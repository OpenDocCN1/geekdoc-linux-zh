    \ a network server that has a SAMBA (Windows SMB) share created that requires\
    \ no authentication. You can also use a network attached storage appliance and\
    \ create a public share. In this lab, the share will be /server1/public but you\
    \ should substitute your own server and share name. If you cannot create a public\
    \ share that requires no credentials, an alternative method is provided that uses\
    \ log in with credentials.\n\n### Materials Required\n\nThis lab requires the\
    \ following:\n\n- A computer running Fedora 20 Linux\n- Access to a SAMBA share\
    \ that requires no logon credentials\n\nEstimated completion time: 30 minutes\n\
    \n### Activity\n\n1. Start your Linux computer. Switch to a command-line terminal\
    \ (tty2) by pressing Ctrl+Alt+F2, and log in as the root user.\n\n2. Create a\
    \ directory to mount the SAMBA share by typing mkdir /mnt/backup and pressing\
    \ Enter.\n\n3. Mount the SAMBA share by typing mount -t cifs //server1/public\
    \ /mnt/backup and pressing Enter. If you are prompted for a password, press Enter.\n\
    \n> If your share requires login credentials, replace the mount command with:\
    \ -t cifs -o username,password //server1/public where username and password are\
    \ the required credentials.\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_133_0.png)\n\
    \n4. Type ls /mnt/backup and press Enter to see the contents of the share.\n\n\
