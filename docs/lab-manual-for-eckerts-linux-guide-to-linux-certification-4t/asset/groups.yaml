    你可以通过删除不再需要的旧文件或将它们移动到其他介质（磁带、光盘、闪存 驱动器等）来恢复磁盘空间。要识别旧文件，你可以检查它们的时间戳。每个文件都有三个类型的时间戳，管理员应该了解如何操作以帮助他们完成文件清理任务。


    # 所需材料


    本实验需要以下设备：


    - 一台运行 Fedora 20 Linux 的计算机


    预计完成时间：30 分钟


    # 活动背景


    Linux 文件有三种类型的时间戳：


    - 创建时间（ctime，此处指更改时间）在创建文件或目录时会自动设置为当前的时间和日期。当文件的权限、属性、所有者或内容更改时，它也会更改为当前时间。

    - 访问时间（atime）在文件被打开时，会自动更改为当前的时间和日期。

    - 修改时间（mtime）在文件被写入并关闭时，会发生更改。


    # 活动


    1.  如有必要，启动你的系统，切换到 tty2，并以 root 身份登录终端。

    2.  如有必要，输入 `cd /home/julie` 并按回车，切换到 Julie 的主目录（在实验 10.3 中创建）。

    3.  要删除此目录下的所有文件，输入 `rm * -I` 并按回车。当提示 `rm: remove all arguments?` 时，输入 `y` 并按回车。

    4.  使用 `touch` 命令创建一个名为 `file1` 的新文件。输入 `ls -l` 并按回车。通常情况下，`ls` 命令显示 `mtime`，例如所示：

    5.  要显示文件的 `ctime`，使用 `--time` 选项。输入 `ls -l --time=ctime` 并按回车。（注意：确保在时间选项之前使用两个连字符。）在本例中中，日期和时间与
    `mtime` 相同：

    6.  要显示文件的 `atime`，使用 `ls -l --time=atime` 并按回车。如所示，`atime` 与 `mtime` 的值相同：

    7.  你不能仅用一个命令同时显示 `atime`、`ctime` 和 `mtime`。要做到这一点，你需要创建一个组合三个命令的别名，输入 `alias
    dir="ls -l --time=ctime | grep root;ls -l grep root;ls -l --time=atime | grep
    root"` 并按回车。


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    ```


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file2

    ```


    8.  输入 `dir` 并按回车。如下例所示，输出的第一行显示 `ctime`，第二行显示 `mtime`，第三行显示 `atime`：


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    ```


    9.  打开 `file1` 查看时间戳受到的影响，输入 `cat file1` 并按回车。（文件是空的，所以 `cat` 命令没有输出，但由于文件被访问过，`atime`
    发生了变化。）输入 `dir` 并按回车。只有 `atime` 应该发生了变化，正如你所：


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:47 file1

    ```


    10. 使用编辑器修改文件，输入 `vi file1` 并按回车（注：原文 vi1 似为 vi 的笔误）。输入 `dir` 并按回车。只有 `atime`
    应该发生了变化，因为你执行：


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:47 file1

    ```


    11. 打开 `file1` 查看时间戳如何受影响，输入 `cat file1` 并按回车。（文件是空的，所以 `cat` 命令没有输出，但由于文件被访问过，`atime`
    发生了变化。）输入 `dir` 并按回车。只有 `atime` 应该发生了变化，正如你：


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:47 file1

    ```


    12. 使用编辑器修改文件，输入 `vi file1` 并按回车。通过输入 `i` 进入插入模式并添加内容。按 `Esc` 回到命令模式，然后输入 `:wq`
    并按回车。


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:47 file1

    ```


    13. 模拟访问文件，输入 `touch file1` 并按回车。输入 `dir` 并按回车。你会看到：


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:50 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:50 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:50 file1

    ```


    14. 修改文件的权限，输入 `chmod 700 file1` 并按回车。你会看到 `ctime` 发生了：


    ```

    -rwx------ 1 root root 0 Oct 23 09:15 file1

    -rw-r--r-- 1 root root 0 Oct 23 09:13 file1

    -rw-r--r-- 1 root root 0 Oct 23 09:15 file1

    ```


    15. 更改文件的所有者，输入 `chown nobody file1` 并按回车。输入 `dir` 并按回车。你会发现 `ctime` 发生了：


    ```

    -rwx------ 1 nobody root 0 Oct 23 09:15 file1

    -rwx------ 1 nobody root 0 Oct 23 09:13 file1

    -rwx------ 1 nobody root 0 Oct 23 09:15 file1

    ```


    16. 设置该属性，输入 `chattr +A file1` 并按回车。输入 `dir` 并按回车。你会发现 `atime` 没有被更新：


    ```

    -rwx------ 1 nobody root 0 Oct 23 09:15 file1

    -rwx------ 1 nobody root 0 Oct 23 09:13 file1

    -rwx------ 1 nobody root 0 Oct 23 09:15 file1

    ```


    17. 访问文件，使用 `cat file1` 并按回车。输入 `dir` 并按回车。你会发现 `atime` 没有被更新：


    ```

    -rwx------ 1 nobody root 0 Oct 23 09:15 file1

    -rwx------ 1 nobody root 0 Oct 23 09:13 file1

    -rwx------ 1 nobody root 0 Oct 23 09:15 file1

    ```


    18. 你可以使用 `atime` 搜索一年内未访问过的文件，例如，输入 `find -atime 365` 并按回车。365 是自上次访问以来的天数。


    19. 要根据 `mtime` 值搜索文件，请使用 `find -mtime 5` 并按回车，这会搜索五天内未修改的文件。


    20. 除了打开和读取之外，对文件进行的任何操作都会导致 `ctime` 更改。因此，`ctime` 可以作为文件发生了某些操作的指示。


    你也可以配合命令使用 `-exec` 或 `-or` 选项来对找到的文件执行某些操作，例如删除或备份，正如实验 10.3 所示。


    # 理解时间戳


    实验 10.4 理解时间戳


