    \ changes made to interfaces and IP settings are in effect only until you restart\
    \ the computer, when the settings are initialized to the interface's configuration\
    \ file (/etc/sysconfig/network-scripts/ifcfg-eth0). Restart the computer if you're\
    \ continuing to the next lab; otherwise, shut down.\n\n# Review Questions\n\n\
    - 1. Which command configures an IP alias?\n  a. ifconfig -alias eth0 192.0.2.1\n\
    \  b. ifconfig eth0-alias 192.0.2.1\n  c. ifconfig eth0:0 192.0.2.1\n  d. ifconfig\
    \ eth0:0 192.0.2.1 -a\n- 2. You can't assign IP aliases to the local loopback\
    \ (lo) interface. True or False?\n- 3. How many IP aliases can be created?\n \
    \ a. Up to 64 per physical interface\n  b. Up to 256 per physical interface\n\
    \  c. Up to 64, regardless of the number of physical interfaces\n  d. Up to 256,\
    \ regardless of the number of physical interfaces\n- 4. When you shut down a physical\
    \ interface, you must specify the IP address, subnet mask, and broadcast address\
    \ again when you restart the interface. True or False?\n- 5. An IP alias is used\
    \ only for internal testing; you can't actually send packets to the IP address\
    \ addressed to the alias and get a response. True or False?\n\n# Lab 12.3 Installing\
    \ and Configuring NcFTPd\n\n# Objectives\n\nFTP is a common method of transferring\
    \ files over a network. One widely used FTP server for Linux is WuFTP, included\
    \ in nearly all Linux distributions. However, it can be difficult to configure\
    \ and has security vulnerabilities. Experienced Linux users and administrators\
    \ often use other FTP server software, such as NcFTPd. In this lab, you download,\
    \ install, and configure NcFTPd.\n\n# Materials Required\n\nThis lab requires\
    \ the following:\n\n- A computer running Fedora 20 Linux\n- A LAN connection\n\
    - Access to the Internet\n\nEstimated completion time: 45 minutes\n\n# Activity\n\
    \n- 1. You should already be logged in to tty2 as root. If not, switch to tty2,\
    \ and log in as root.\n- 2. To create an IP alias, you must base its name on the\
    \ physical interface's name. The first interface is called eth0 by default, so\
    \ create an IP alias called eth0 by typing ifconfig eth0:192.0.2.1. This shows\
    \ how to create IP aliases. The actual IP addresses depend on your network (img/272b3b99ebe228b8c0cfa22abe675a46_141_0.png).\n\
    - 3. To view the new alias, type ifconfig and press Enter. You see output similar\
    \ to the following:\n  eth0: flags<UP,BROADCAST,RUNNING,MULTICAST> mtu:1500\n\
    \  inet:10.100.1.1 mask:255.255.255.0 broadcast:10.100.255\n  lo: flags<UP,LOOPBACK,RUNNING>\
    \ mtu:65536\n  inet:192.0.2.1 mask:255.255.255.0 broadcast:192.0.2.255\n- 4. Next,\
    \ create another IP alias by typing ifconfig eth0:2:192.5.100.1 and pressing Enter.\
    \ You should have two IP aliases. Use ifconfig to verify the new\n- 5. Type ifconfig\
    \ eth0:2 and press Enter to view information about only eth0.\n- 6. The convention\
    \ is to use numbers following the name (eth) and colons for IP alias, but you\
    \ can use anything you like. Type ifconfig eth0:abc:2.3.5 and press Enter, then\
    \ ifconfig eth0:abc and press Enter to see the new\n- 7. Now create two IP aliases\
    \ for the local loopback (lo) interface by typing ifconfig lo:0:127.0.0.2 and\
    \ pressing Enter, and then typing ifconfig lo:1:127.0.0.3 and pressing Enter.\
    \ Type ifconfig and press Enter to see all the interfaces you've created so far.\n\
    - 8. To shut down an IP alias, type ifconfig eth0:2 and press Enter, and then\
    \ type ifconfig and press Enter to see that the eth0:2 interface is no longer\
    \ listed.\n- 9. If you want to restart an IP alias that's shut down, you must\
    \ re-create it. To see it works, restarting the aliases by typing ifconfig eth0:2\
    \ and pressing Enter. You get the error message: SIOCSIFLAGS: Cannot assign address\n\
    - 10. To communicate with the alias, type ping 192.0.2.1 and press Enter. You\
    \ see the ping reply messages. The ping command continues sending packets to the\
    \ destination IP address until you press Ctrl+C. Press Ctrl+C now.\n\n# Chapter\
    \ 12 Network Configuration\n\nThe Linux internal router uses a routing table to\
    \ determine where packets need to be sent that they arrive at their destinations.\
    \ The route command is also useful for troubleshooting network problems.\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_139_0.png)\n\
    \nIf the eth0 interface is using DHCP for IP address assignment, the process of\
