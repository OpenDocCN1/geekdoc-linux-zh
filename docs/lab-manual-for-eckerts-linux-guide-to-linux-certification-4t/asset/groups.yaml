    \n+   5. Type CDPATH=/usr and press Enter. BASH looks for a subdirectory below\
    \ the /usr directory if it can't find a subdirectory below the current directory.\n\
    \n+   6. Type cd bin and press Enter. This time, there's no error message. Instead,\
    \ your current directory is changed to /usr/bin.\n\n+   7. Go back to your directory\
    \ by typing cd and pressing Enter. Type mkdir ~/bin and press Enter to create\
    \ a bin directory below your home directory.\n\n+   8. Type cd bin and press Enter.\
    \ This time, the current directory is set to ~/bin (the bin directory below your\
    \ directory).\n\n+   9. Type CDPATH=/usr and press Enter. Notice that the colon\
    \ in Step 5's similar command has been eliminated. You see the results in the\
    \ next step.\n\n+   10. Go back to your home directory. Type cd bin and press\
    \ Enter. The current directory is set to /usr/bin, which is the bin directory\
    \ below the /usr and not your home directory. What happened? Eliminating the colon\
    \ specified not for directories below your current directory (in this case, your\
    \ home directory).\n\nThe PATH feature doesn't search for directories if you use\
    \ a cd command that specifies a directory beginning with a slash (/), a dot (.),\
    \ or two dots (.).\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_88_0.png)\n\n+\
    \   11. Go back to your home directory, and type cd ~/bin and press Enter. This\
    \ time BASH sets the current directory to the ~/bin directory because you specified\
    \ it. BASH didn't have to search for it.\n\n+   12. Next, make the search more\
    \ complex by typing CDPATH=/usr:var and pressing Enter. Now BASH searches your\
    \ current directory first, then the /usr directory, and then the /var directory.\n\
    \n+   13. Go back to your home directory. Type cd log and press Enter. The current\
    \ directory is set to /var/log. BASH can't find a log directory below the current\
