    \n+   7. 输入 `cd` 并按回车回到你的目录。输入 `mkdir ~/bin` 并按回车在你的主目录下创建一个 `bin` 目录。\n\n+  \
    \ 8. 输入 `cd bin` 并按回车。这次，当前目录被设置为 `~/bin`（即你目录下的 `bin` 目录）。\n\n+   9. 输入 `CDPATH=/usr`\
