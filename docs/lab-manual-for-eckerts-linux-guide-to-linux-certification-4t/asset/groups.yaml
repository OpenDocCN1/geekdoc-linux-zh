    \ `cp /usr/share/libreoffice/4/share/sample/sample/image.bmp ~/` 并按回车，将位图图像复制到你的主目录。\n\
    \n- 3. 输入 `ls -l *.bmp` 并按回车查看位图文件。输入 `file image.bmp` 并按回车查看文件类型。\n\n- 4. 输入\
    \ `convert image.bmp image.jpg` 并按回车将位图转换为 JPEG。输入 `ls -l *.jpg` 并按回车查看文件大小。\n\
    \n- 5. 输入 `file image.jpg` 并按回车查看文件类型。你会看到类似下面的输出：\nimage.jpg: JPEG image data,\
    \ 800x 600, 2 color, progressive, standard\n\n- 6. 输入 `./image.jpg` 并按回车查看图像。你可以使用图像查看器查看它。接下来，输入\
    \ `./image.bmp` 并按回车。你会看到未压缩文件 (image.bmp) 和压缩文件 (image.jpg) 都可以工作。\n\n- 7. 输入\
    \ `convert image.bmp -gray gray.jpg` 并按回车将图像转换为灰度。输入 `./gray.jpg` 并按回车查看结果。\n\n\
    - 8. 输入 `ls -l *.jpg` 并按回车查看文件大小。你会发现灰度版本的文件更小。\n\n- 9. 输入 `file image.jpg` 并按回车查看文件类型。\n\
    \n- 10. 关闭所有窗口。如果你计划继续进行下一个实验，请保持登录；否则，关闭计算机。\n\n## 复习题\n\n- 1. 哪个命令可以告诉你扩展名为\
    \ .bmp 的文件是否真的是位图？\n  a. ls -file\n  b. bmp\n  c. file\n  d. ls -1 * | grep bmp\n\
    \n- 2. ImageMagick 软件包中的哪个命令可以将位图转换为压缩图像文件？\n  a. file\n  b. bmpcvt\n  c. convert\n\
    \  d. jpeg\n\n- 3. 灰度 jpeg 文件通常比彩色 bmp 文件大。对或错？\n\n- 4. 写出列出具有 jpeg 扩展的文件及其文件大小的命令。\n\
    \n- 5. 为什么你可能将位图文件转换为 jpeg？\n  a. 为了保持最佳质量\n  b. 为了节省空间和带宽\n  c. 为了图像显示更多颜色\n\
    \  d. 为了允许文件在 Windows 中显示\n\n"
