    onscreen:

    Broadcast message from root@localhost.localdomain Date-Time.

    The system is going down

    The system is going down for power-off at Date-Time.


    +   4. Type shutdown -c and press Enter to abort the shutdown.


    +   5. Type shutdown -h +5 The system is going down again and press Enter. You
    see the same messages you saw in Step 3.


    +   6. Next, go to tty5 by pressing Alt+F5. Log in as root. After entering your
    password, in a minute or so you see a similar message to this:


    ```

    Broadcast message from root@localhost.localdomain Date-Time.

    The system is going down

    The system is going down for power-off at Date-Time.

    ```


    +   7. Go back to tty2 by pressing Alt+F2. Type shutdown -c and press Enter to
    abort the shutdown.'
