    ### 第二部分翻译（引言与特性）


    [content]

    # 引言


    实操学习是掌握 CompTIA Linux+ LPI 认证以及 Linux 相关职业所需技能的最佳方法。本书包含了在现实世界中应用基本概念实验。此外，每章都提供了复习题以强化您的掌握。本书的结构与
    Cengage Learning 的《Linux+ Linux 认证指南》一致，结合使用可以获得有效的学习体验。本书适用于初级 Linux 管理课程。作为前提，学生应具备操作系统基础和网络知识。


    # 特性


    为了确保教师和学生的良好体验，本书包含以下特性：


    - Linux+ 认证目标：每章都列出了来自 CompTIA Linux+ 考试的相关目标。

    - 实验目标：每个实验都有简要描述和学习目标列表。

    - 所需材料：每个实验包含了执行所需的材料信息。

    - 完成时间：每个实验都有预估的完成时间，以便您更准确地规划活动。

    - 活动章节：实验以易于管理的章节形式呈现；需要时会提供额外信息。

    - 分步说明：逻辑清晰的分步说明将引导您完成每个实验中的实践活动。

    - 复习题：问题有助于强化实验中涵盖的概念。


    # 最低硬件要求


    这些最低硬件要求可能不足以在所有情况下运行 Fedora 20，但应满足运行本手册中实验的要求：


    - 64 位 CPU

    - 80 GB 硬盘空间

    - 4 GB 内存 (RAM)

    - DVD 驱动器

    - 网络连接

