    \ and suggestions as needed.\n\n# INTRODUCTION TO LINUX\n\nLabs included in this\
    \ chapter\n\n- Lab 1.1 Becoming Familiar with the Squid Proxy Server\n- Lab 1.2\
    \ Exploring Different Linux Distributions\n- Lab 1.3 Exploring Open-Source Web\
    \ Server Use\n- Lab 1.4 Seeing How Linux and Windows Can Be Integrated\n- Lab\
    \ 1.5 Investigating Linux Security\n\nCompTIA Linux+ Exam Objectives\n\n| Objective\
    \ | Lab |\n|---|---|\n| N/A | These labs don't address Linux+ objectives directly,\
    \ but they give you background information to help you master the objectives and\
    \ understand the Linux operating system. | 7.1-1 |\n\nSome labs in this book explore\
    \ information on the Internet. Because Web pages can change without notice, you\
    \ might see not always match what's described in the lab. You might have to search\
    \ the Web to find the best match for links in steps. When in doubt, check with\
    \ your instructor.\n\n# 1.1 Becoming Familiar with the Squid Proxy Server\n\n\
    ## Objectives\n\nThe goal of this lab is to become familiar with a useful open-source\
    \ software package that runs on Linux. The Squid proxy server is a great example\
    \ of a high-quality software package that's free and well supported and runs on\
    \ many different hardware and software platforms.\n\n## Materials Required\n\n\
    This lab requires the:\n\n- An Internet connection\n- A Web browser on any computer\
    \ (The Labs in this chapter do not require your Linux machine, any computer with\
    \ a Web browser and an Internet connection will suffice)\n\nEstimated completion\
    \ time: 30 minutes\n\n## Activity Background\n\nThere are thousands of software\
    \ packages you can run on Linux. The Squid proxy server is a particularly useful\
    \ because it can substantially reduce the Internet bandwidth required for Web\
    \ browsing and improve the performance of FTP file transfers. Squid serves as\
    \ a good example of the support available for open-source software.\n\n## Activity\n\
    \n1. Start your Web browser.\n2. Type http://www.squid-cache.org in the address\
    \ bar, and press Enter to display the Squid Proxy Cache page.\n3. Click the About\
    \ Squid link at the left. Spend some time reviewing the information. Next, click\
    \ the Why Squid link and learn why many Internet providers use Squid.\n4. Click\
    \ the Squid Deployment Case-Studies link at the left. Click the Wikipedia Squid\
    \ Deployment link, and spend some time reading about how Wikimedia Squid uses.\n\
    5. Click the FAQ link at the left, and then click the AboutSquid link. Browse\
    \ through the page, and notice the plethora of operating systems Squid supports.\n\
    6. If you're continuing to the next lab, leave your Web browser open; otherwise,\
    \ close it.\n\n# 1. Squid can cache which of the following protocols? (Choose\
    \ all that apply).\n\n- a. HTTP\nb. SMTP\nc. FTP\nd. SSH\n\n2. Squid can run only\
    \ on Linux. True or False?\n\n3. Squid performs best when your computer has a\
    \ lot of memory. True or False?\n\n4. Squid uses hard disk space as its secondary\
    \ cache. True or False?\n\n5. Technically, Squid is which of the following?\n\n\
    - a. Web browser cache\nb. Internet object cache\nc. TCP port stretcher\nd. Processor\
    \ L3 cache\n\n# Lab 1.2 Exploring Different Linux Distributions\n\n## Objectives\n\
    \nThere are dozens of Linux distributions, often referred to as “distros.” In\
    \ this lab, you visit the DistroWatch.com site to review some well-known distros\
    \ and read about their unique features.\n\n## Materials Required\n\nThis lab requires\
    \ the following:\n\n- An Internet connection\n- A Web browser\n\n| Estimated completion\
    \ time: 30 minutes |\n\n## Activity\n\n1. Start your Web browser, if necessary.\n\
    2. Type distrowatch.com in the address bar and press Enter.\n3. Click the Distribution\
    \ list arrow. In the list of distributions you can click Fedora, and then click\
    \ Refresh. Fedora 20 comes with this book, and as you can see, there are a number\
    \ of releases after this version. Scroll down to Fedora 20 and read about interesting\
    \ features included in the Fedora 20 release.\n4. Scroll back up to the top. This\
    \ time, click Ubuntu in the Distribution list box, and then click Refresh. Find\
    \ the Distribution Release: Ubuntu 14.10 article, and click the press release\
    \ link. Read about some features available in what many we consider one of the\
    \ better Linux Linux/laptop desktops.\n\n# Chapter 1 Introduction to Linux\n\n\
    5. Click your browser's Back button until you get back to the DistroWatch.com\
    \ page. Click Red Hat in the Distribution list box, and click Refresh. Find the\
    \ Distribution Release: Red Hat Enterprise Linux 6.6 article. Read the description\
    \ of this release and compare it with the Ubuntu description. Can you tell which\
    \ distro is marketed as a server OS and which is marked as a desktop OS?\n6. Read\
    \ about other well-known distros, such as CentOS, Knoppix, and openSUSE. If you're\
    \ continuing to the next lab, leave your Web browser open; otherwise, close it.\n\
    \n## Review Questions\n\n1. There are many distributions of the Linux OS for which\
    \ of the following questions?\n   a. It's proprietary software.\n   b. Microsoft\
    \ allows any vendor to ship its own version as long as it contains a Microsoft\
    \ logo.\n   c. It's open-source software.\n   d. The licensing costs are only\
    \ about $100 per distribution.\n\n2. Fedora is the community distribution of which\
    \ commercial product?\n   a. Ubuntu\n   b. openSUSE\n   c. CentOS\n   d. Red Hat\
    \ Enterprise\n\n3. Ubuntu distributions are targeted mainly toward enterprise-level\
    \ server applications. True or False?\n\n4. According to the DistroWatch Web site,\
    \ roughly how many Linux distributions are available?\n   a. About 10\n   b. Well\
    \ over 100\n   c. About two dozen\n   d. Around 50\n\n5. OpenSUSE is distributed\
    \ by Novell and ships with the RPM package manager. True or False?\n\n# Lab 1.3\
    \ Exploring Open-Source Web Server Use\n\n## Objectives\n\nThe goal of this lab\
    \ is to help you see the widespread use of open-source Web servers, using a factor\
    \ that's well understood in the commercial software world—market share. In this\
    \ lab, you conduct research to discover the percentage of Web servers running\
    \ the three most popular Web server packages: Apache, Microsoft IIS, and Oracle\
    \ iPlanet.\n\n## Materials Required\n\nThis lab requires the following:\n\n- An\
    \ Internet connection\n- A Web browser\n\nEstimated completion time: 20 minutes\n\
    \n## Activity\n\n1. Start your Web browser.\n2. Type http://news.netcraft.com/archives/web_server_survey.html\
    \ in the address bar, and then press Enter to display the Netcraft Web Server\
    \ Survey site. This site has a graph showing the market share for the most popular\
    \ Web servers. Note that while Apache at one time led the pack by a large margin,\
    \ in recent years Microsoft seems to have taken much of Apache's market share\
    \ and they are now about even.\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_18_0.png)\n\
    \nOne factor with a major effect on the Netcraft survey results is \"virtual hosting,\"\
    \ a feature that allows a single Web server to host many Internet sites or URLs.\
    \ In the Netcraft survey, an ISP running a single Web server with 5000 hosts is\
    \ seen as 5000 Web servers, not a single Web server.\n3. Type http://w3tech.com/technologies/overview/web_server/all\
    \ in the address bar, and then press Enter to see the results of a Web server\
    \ survey conducted by W3Techs. Click the technologies overview link to see more\
    \ information about how the survey is conducted.\n4. Compare the results of the\
    \ W3Techs and Netcraft surveys. How are they similar? How do they differ? What\
    \ do you think accounts for the differing results?\n5. If you're continuing to\
    \ the next lab, leave your Web browser open; otherwise, close it.\n\n## Review\
    \ Questions\n\n1. Why might the Netcraft survey not be an accurate way of determining\
    \ the number of Apache Web servers on the Internet?\n   a. There's no way to know\
    \ what software a Web server is using.\n   b. A Web server could be using virtual\
    \ hosting that allows one physical Web server to appear as numerous Web servers.\n\
    \   c. Web server administrators might have servers masquerade as other types\
    \ of software to improve compatibility between their servers and popular browsers.\n\
    2. Based on the survey results from Netcraft, which company has seen the most\
    \ substantial increase in market presence?\n   a. nginx\n   b. NCSA\n   c. Sun\n"
