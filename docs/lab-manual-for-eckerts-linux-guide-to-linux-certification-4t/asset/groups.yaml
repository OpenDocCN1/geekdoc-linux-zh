    \ press Enter. You see something similar to the following:\n\n```\n0000000 del\
    \ E F stx soh nul nul nul nul nul nul nul nul nul\n0000016 stx nut etx soh nul\
    \ nul nul nul nul nul nul dc3 enq b 4 nul nul nul\n0000032 4 k bel nul nul nul\
    \ nul nul 4 nul sp nul ack nul ( nul\n0000048 em nul can nul ack nul nul nul 4\
    \ nul nul 4 nul nul eot bs\n0000064 4\n0000065\n```\n\nIn this example, the first\
    \ byte is del (a mnemonic), also called rub or rubout in older ASCII versions.\
