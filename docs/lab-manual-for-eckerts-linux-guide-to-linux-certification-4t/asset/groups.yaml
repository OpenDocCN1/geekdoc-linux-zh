    # Lab 7.4 Adding Automation to the BASH Prompt


    # Objectives


    The goal of this lab is to learn how to configure BASH to run scripts automatically.


    # Materials Required


    This lab requires:


    +   - A computer running Fedora 20 Linux


    ```

    Estimated completion time: 15 minutes

    ```


    # Activity Background


    In this lab, you build a list of people''s names that''s stored in a file called
    list. Each name is followed by a simple number to represent some information,
    such as an index to another file or database. There are many ways to do this,
    of course.


    You also use a BASH feature that enables you to run a program automatically whenever
    the PSI prompt is displayed. It''s the main prompt that appears when control is
    returned to the BASH shell. This feature isn''t available in all shells.


    # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and if
    necessary, log in to the terminal as User1.


    +   2. Go to your home directory, if necessary. Use the touch command to create
    a file named list.


    +   3. First, you create a simple shell script to sort the list. You could use
    a text editor to create it, but because it''s only one line, use the echo command.
    Type echo ''sort -l ~/list mv ~/list > ~/sorter'' and press Enter to create a
    file named sorter in your home directory.


    +   4. To give the script execution permission so that it can run, chmod +x sorter
    and press Enter.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_85_0.png)


    > NOTE


