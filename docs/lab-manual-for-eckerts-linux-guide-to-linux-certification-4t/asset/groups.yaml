    \ by using pipes, which send one command's output to another command as input.\
    \ After completing this lab, you'll be able to do the following:\n\n- Pause the\
    \ display of data at full screen\n- Display text strings embedded in binary data\n\
    - Filter a data stream based on a word\n\n## Materials Required\n\nThis lab requires\
    \ the following:\n\n- A computer running Fedora 20 Linux\n\nEstimated completion\
    \ time: 15 minutes\n\n## Activity\n\n- 1. Switch to a command-line terminal (tty2)\
    \ by pressing Ctrl+Alt+F2, and log in to the root user, if necessary.\n- 2. Move\
    \ to the /usr/share/man/man1 directory by typing `cd /usr/share/man/man1` and\
    \ pressing Enter. You can find pages in a subdirectory of /usr/share/man/. To\
    \ find the exact filename for the man page, type `ls -l /usr/share/man/man1/bash*`\
    \ and press Enter. You should see something similar to following:\n```\n-rw-r--r--\
    \ 1 root 79285 Aug bash\n```\n- 3. The man page file is compressed, so you have\
    \ to decompress it. Type `gunzip /usr/share/man/man1/bash.gz` and press Enter.\
    \ The file should now be uncompressed (gunzip command removes the .gz extension).\n\
    - 4. bash is a plain text file, so you read it with text-based commands such as\
    \ cat, more, and less. Type `cat bash` and pressing Enter. Because the file is\
    \ large, the screen will scroll, but you can stop the scrolling by pressing Ctrl+C.\n\
    - 5. If the scrolls faster than you can, use more to display one page at a time\
    \ and pause until you press a key to display the next page. Type `more bash` and\
    \ press Enter to see the first page of text.\n- 6. Press any key to see the next\
    \ page. If you don't want to view the entire file, you can exit more and get back\
    \ to the command prompt by typing q.\n- 7. More command doesn't allow you to go\
    \ back in the file to see text on previous pages. To do that, use less. Type `less\
    \ bash` and press Enter. To move forward and backward in the file, press Page\
    \ Down and Page Up keys. When you have finished, press q to exit the less command.\n\
    - 8. You can use grep to display only lines containing words. Type `cat bash |\
    \ grep input` and press Enter. In this command, you're telling grep to display\
    \ only lines containing the string.\n- 9. You can also use more or less commands\
    \ with grep. Type `cat bash | grep input | more` and press Enter. Notice that\
    \ the screen stops after the page. Exit the command by pressing q.\n- 10. Type\
    \ logout and press Enter to log out of the system, and press Ctrl+Alt+F1 to go\
    \ back to the graphical screen.\n\n## Review Questions\n\n- 1. In which directory\
    \ are man pages located in Fedora?\n    - a. /etc/man\n    - b. /var/man\n   \
    \ - c. /sbin/man\n    - d. /usr/share/man\n- 2. Man pages are normally stored\
    \ in compressed form. True or False?\n- 3. If you want to find certain strings\
    \ in a file, which command do you use to filter the file's contents?\n    - a.\
    \ ls\n    - b. grep\n    - c. strings\n    - d. less\n- 4. Which command do you\
    \ use to display only one page of text at a time?\n    - a. ls\n    - b. cat\n\
    \    - c. grep\n    - d. more\n- 5. Which command lets you use Page Up and Page\
    \ Down to move through a file?\n    - a. ls\n    - b. more\n    - c. less\n  \
    \  - d. cat\n\n# Lab 3.2 Performing Complex Searches\n\n## Objectives\n\nThe goal\
    \ of this lab is to learn how regular expressions and the grep command can be\
    \ used for complex searches of documents. Regular expressions are useful when\
    \ searching for lines in a text file or data stream containing certain strings.\
    \ Sometimes, however, you need to find lines based on more complex criteria. For\
    \ example, if you want to extract lines from a file or data stream containing\
    \ two words that aren't adjacent, creating a regular expression to handle this\
    \ situation could be difficult. A simple solution is to use two grep filters,\
    \ one for each word. Any lines passing through both filters contain both words.\n\
    \n## Materials Required\n\nThis lab requires the following:\n\n- A computer running\
    \ Fedora 20 Linux\n\nEstimated completion time: 15 minutes\n\n## Activity\n\n\
    - 1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log\
    \ in to the terminal as the root user.\n- 2. Move to the /usr/share/man/man1 directory\
    \ by typing `cd /usr/share/man/man1` and pressing Enter.\n- 3. Type `cat bash\
    \ | grep display | less` and press Enter. The word “display” in lowercase letters\
    \ is shown on lines. Press q to quit.\n- 4. Type `cat bash | grep Display | less`\
    \ and press Enter. The word “Display\", starting with an uppercase letter, is\
    \ shown on all lines. Press q to quit.\n- 5. Searches with grep are usually case\
    \ sensitive, but you can use the -i option for searches that aren't case sensitive.\
    \ Type `cat bash | grep -i display | less` and press Enter. The output contains\
    \ both “display” and “Display.” Press q to quit.\n- 6. To make the search more\
    \ complex, you can search for more than one word. Type `cat bash | grep -i display\
    \ | grep history` and press Enter. There's no need to pipe the output to a less\
    \ filter because it's unlikely that more than a few lines will match. You see\
    \ a few lines containing “display” (for the search that's not case sensitive)\
