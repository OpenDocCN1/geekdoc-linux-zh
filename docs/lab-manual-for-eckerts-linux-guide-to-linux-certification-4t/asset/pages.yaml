    # # Lab 3.4 Displaying Binary Data


    # ## Objectives


    The goal of this lab is to see how to display binary data files in a variety of
    formats, such as decimal, hexadecimal, and octal.


    # ## Materials Required


    This lab requires the following:


    +   * A computer running Fedora 20 Linux


    Estimated completion time: 30 minutes


    # ## Activity Background


    Sometimes you need to search through binary files to find text strings; for example,
    you might want to know the version number of a program or data file. In this case,
    viewing the binary file directly might be easier than using the program you''d
    normally use to open the file. When you want to view binary data, the tools you
    sometimes convert it into a form that''s convenient to use but sometimes not.
    One of these tools is the od command, which by default treats the binary data
    you want to view as a program instead of binary data. The problem is that it might
    swap bytes around so that the file''s first byte appears after the second byte,
    the fourth byte appears before the third, and so on. This work is worthwhile if
    you''re a programmer looking at a program dump running on a computer that stores
    bytes in memory, but it''s not helpful if you just want to look at simple binary.
    In this lab, you will work with examples that display bytes in the same order
    they appear in the file, which is the way most people prefer to see.'
