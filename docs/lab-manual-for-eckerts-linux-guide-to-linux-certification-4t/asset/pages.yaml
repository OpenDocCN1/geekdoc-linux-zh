    # # Lab 8.3 Running an X Server


    # ## Objectives


    Gnome and KDE are Linux graphical desktop environments with features similar to
    those in Macintosh and Windows. These environments are complex, with layers of
    software and settings for each layer. In this lab, you will run one of these layers—the
    X Server program. You see what functions an X server provides and how to interact
    with an X server to run applications.


    You might think running an X server isn''t useful, but using it without the other
    layers of a graphical desktop environment can reduce system resource requirements
    and lock down a desktop so that users can run only authorized applications. You
    could use this technique for building a kiosk application, for example.


    After finishing this lab, you''ll be able to do the following:


    +   * Start and stop an X server

    * Run X applications from the command line

    * Specify command-line options to set window properties


    # ## Materials Required


    This lab requires the following:


