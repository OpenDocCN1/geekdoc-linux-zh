    The kernel is typically stored on the hard disk in an ordinary file, where this
    file is located which allows your system to boot quickly. You should know where
    this file is located to create a boot disk, or you might need to modify your boot
    loader (LILO or GRUB) configuration file. LILO and GRUB are the most common Linux
    boot loaders. Knowing the kernel''s name and location is necessary for each task.


