  md: 'You can recover disk space by deleting old files that are no longer needed
    or moving them to other media (tape, optical discs, flash drives, and so on).
    To identify old files, you can check their timestamps. Each file has three types
    of timestamps, and administrators should know how to work to help them with file-housekeeping
    tasks.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 30 minutes


    # Activity Background


    Linux files have three types of timestamps:


    +   - The creation time (atime) is set to the current time and date automatically
    when the file or directory is created. It is also changed to the current time
    when a file''s permissions, attributes, owners, or contents change.

    - The access time (atime) is changed to the current time and date automatically
    when the file is opened.

    - The modification time (mtime) is changed when the file is written to and closed.


    # Activity


    +   1. If necessary, start your system, switch to tty2, and log in to the terminal
    as root.

    2. If necessary, switch to Julie''s home directory (created in Lab 10.3) by typing
    cd /home/julie and pressing Enter.

    3. To remove all files in this directory, type rm * -I and press Enter. When you''re
    prompted with rm: remove all arguments?, type y and press Enter.

    4. Create a new file called with the touch command. Type ls -l and press Enter.
    Normally, the ls command displays mtime, as shown in this example:

    5. To display the file''s ctime, use the --time option. Type ls -l --time=ctime
    and press Enter. (Note: Make sure you use two hyphens before the time option.)
    In this example, the date and time are the same as with mtime:

    6. To display a file''s atime, use ls -l --time=atime and press Enter. As shown
