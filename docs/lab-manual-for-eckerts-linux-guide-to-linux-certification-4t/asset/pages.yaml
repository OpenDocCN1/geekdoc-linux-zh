  md: '# Lab 11.1 Compressing Programs with gzexe


    # # Objectives


    Making files as small as possible is useful, particularly when they have to be
    stored on a disk or must be transmitted over a slow network or modem link. Linux
    program files can be compressed for the same reasons. In this lab, you learn how
    to use the gzexe command to compress binary programs.


    # # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    # # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in as the root user, if necessary.


    +   2. Make sure you''re in your home directory by typing cd Enter. Next, copy
    the rpm program from the /bin directory to your home directory by typing cp /bin/rpm
    / and pressing Enter.


    +   3. Find the rpm program''s file size by typing ls -l rpm and pressing Enter.
    The file size should be between 15,000 and 16,000 bytes.


    +   4. Compress the program by typing gzexe rpm and pressing Enter. This process
    takes a few seconds. When it''s finished, you see a line similar to rpm: 58%.
    The number indicates the percentage of compression, so in this example, the rpm
    program was compressed by 58%.


    +   5. The original file was renamed as rpm-, and the new compressed file is named
    rpm. Type ls -l rpm to see both file sizes. There be a substantial difference,
    as shown:


    ```

    rwxr-xr-x 1 root root 7615 10:22 rpm

    rwxr-xr-x 1 root root 16152 10:21 rpm-

    ```


    +   6. Both files run the same program. Type /rpm --version and press Enter. You
    see output similar to RPM version 4.11.1, indicating the rpm program''s version.
    Next, type /rpm/ --version and press Enter. You see both the uncompressed file
    (rpm-) and the compressed file (rpm) work. (Be sure to type two "-” characters
    of front in the previous commands),


    +   7. When you compressed the program, it takes slightly longer to start because
    it must be uncompressed first. First use the time command to compare the times
    both programs take to run. First, type /rpm --version and press Enter to see how
    long the compressed program takes to run. Rpm output similar to the following:


    ```

    RPM version 4.11.1

    real 0.0024s

    user 0.0013s

    sys 0.0003s

    ```'
