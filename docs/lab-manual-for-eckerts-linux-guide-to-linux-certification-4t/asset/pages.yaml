  md: '# # Lab 9.1 Displaying Parent-Child Relationships between Processes


    # ## Objectives


    The goal of this lab is to investigate methods for displaying parent-child relationships
    between processes.


    # ## Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    ```

    Estimated completion time: 15 minutes

    ```


    # ## Activity Background


    Chapter 9 in the accompanying textbook explains parent and child processes and
    how to use the ps -f command to see PID and PPID values. A PPID is the PID of
    a parent process. Using PPID values, you can see the parents of all processes.
    When child processes have children, the relationships are more complex and difficult
    to see in the display. In this lab, you explore other commands that more clearly
    show the relationships between processes.


    # ## Activity


    +   1. Start your Linux computer. Switch to a command-line terminal (tty2) by
    pressing **Ctrl+Alt+F2**, and log in to the terminal as User1.

    2. Type **ps -eH -l** and press **Enter**. The e option selects all processes,
    and the H option produces a process hierarchy display. Child processes are listed
    under their parents and indented by two spaces so that you can see parent-child
    relationships more easily than nonhierarchical ps commands. Here''s an example
    of what the output looks like:


    ```

    PID TTY TIME CMD

    1 ? 00:00:04 init

    491 ? 00:00:02 udevd

    970 ? 00:00:00 udevd

    971 ? 00:00:00 udevd

    1141 ? 00:00:28 auditd

    1143 ? 00:00:01 audispd

    1144 ? 00:00:00 sedispatch

    1168 ? 00:00:00 rsyslog

    ```


    +   If you see the --more-- prompt, press q to return to the command prompt.

    3. Type **ps -eHf** and press **Enter**. You see output similar to the preceding
    example. These options cause ps to use the / and _ characters instead of spaces
    to show parent-child relationships.'
  merge: -1
  pgno: 101
