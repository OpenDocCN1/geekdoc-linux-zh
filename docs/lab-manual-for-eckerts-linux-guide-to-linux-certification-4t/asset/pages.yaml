  md: '# # Lab 7.1 Using the BASH History Feature


    # ## Objectives


    The goal of this lab is to learn about the command history available with the
    BASH shell. With this feature, you don''t have to retype shell commands you''ve
    entered previously. After finishing this lab, for example, you can use this feature
    to recall every command you entered by pressing the up arrow key, specifying numbers
    that represent a command''s order in the history list, and searching for commands
    containing a certain string. You can also replace words in the most recent command
    as a shortcut to retyping the entire command.


    # ## Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    # ## Activity


    +   1. Start your Linux system and log in to the GUI as User1. Switch to a command-line
    terminal (tty2) by pressing Ctrl+Alt+F2, and log in to the terminal as User1.

    2. You can access the history of commands you''ve entered in the BASH shell in
    a few ways. The easiest way is using the up arrow key to see your most recent
    command displayed. Press the up arrow again to see the next most recent command.

    3. Clear the command line by pressing the down arrow key twice.

    4. To give BASH some commands to store in the history, type the following lines,
    Enter after each line:


    ```

    cd

    ls -1 /etc

    ls -1

    whoami

    who

    ```


    +   5. Next, check to see whether these commands were added to the history. To
    get a list of all commands that have been entered, type history and press Enter.
    The screen scrolls, but the commands you entered in Step 4 are displayed. Each
    command in the history list is numbered, like this:


    ```

    79 cd

    80 ls -1 /etc

    81 ls -1

    82 whoami

    83 who

    84 history

    ```


    +   6. You can select any command by stepping back through the history with the
    up arrow key, but when the history list is long it is. An easier method is specifying
    the command''s number or searching for it. To select and issue a command by number,
    you enter an exclamation point (!) followed by the command''s number.'
