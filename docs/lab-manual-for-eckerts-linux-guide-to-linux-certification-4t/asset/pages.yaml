    in Fedora. You can find pages in a subdirectory of /usr/share/man/, with the number
    in the subdirectory referring to a man section. To find the exact filename for
    the man page, type ls -l /usr/share/man/man1/bash* and press Enter. You should
    see something similar to the following (although others files might be listed):


    ```

