    Hello from root


    +   16. Type rm file1 and press Enter. If you''re asked whether you want to remove
    the file, type y and press Enter. Type ls -l and press Enter. Notice that the
    file no longer exists because user1 was able to erase user2''s file. You might
    think that the user account has only read access to the file, it shouldn''t be
    able to erase it. However, user1 has write access to the /var/local/share directory,
    which enables it to delete user2''s files. You can solve this security problem
    by setting the sticky bit on the directory, as shown in the next step.


