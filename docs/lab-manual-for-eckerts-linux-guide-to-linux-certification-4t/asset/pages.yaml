  md: '# Chapter 12 Network Configuration


    The Linux internal router uses a routing table to determine where packets need
    to be sent that they arrive at their destinations. The route command is also useful
    for troubleshooting network problems.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_139_0.png)


    If the eth0 interface is using DHCP for IP address assignment, the process of
    shutting down the interface and restarting resets the interface to use DHCP, overriding
    the address and subnet mask you previously set. In this case, ask your instructor
    what address to use in Step 12 when you set the default gateway.


    +   2. To add a default gateway for a router or device with the IP address 10.100.1.250,
    type route default gw 10.1.1 and press Enter. See how your routing table was affected
    by typing route -n again and pressing Enter. There should be an entry for the
    new gateway with Destination column set to 0.0.0.0. The route 0.0.0.0 is used
    to designate the default route.


    +   3. Leave your computer in its current configuration to continue to Lab 12.2.


    If your Ethernet interface is not eth0 and is instead something similar to en016777736,
    you can change it by following these instructions:


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_139_1.png)


    +   1. Edit the file /etc/default/grub

    2. Look for the line that begins with GRUB_CMDLINE_LINUX and add the following
    at the end of the line and within the quotes ''net.ifnames=0 biosdevname=0''

    3. At the command prompt, type grub2-mkconfig -o /grub2/grub.cfg

    4. Type mv /etc/sysconfig/network-scripts/ifcfg-eno167777736 /etc/sysconfig/network-scripts/ifcfg-eth0

    5. Restart the system.


