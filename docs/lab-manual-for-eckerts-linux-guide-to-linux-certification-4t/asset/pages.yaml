  md: "# Lab 14.1 Validating Files\n\n# Objectives\n\nThis lab shows you how to validate\
    \ files using cryptographic hashes to verify that they’re genuine. The `md5sum`\
    \ command is one method for performing this task.\n\n# Materials Required\n\n\
    This lab requires the following:\n\n+   - A computer running Fedora 20 Linux\n\
    \nEstimated completion time: 10 minutes\n\n# Activity Background\n\nIn Linux,\
    \ you have a few ways to validate files, such as the `sum`, `cksum`, and `md5sum`\
    \ commands. However, `md5sum` is cryptographically stronger than `sum` and `cksum`,\
    \ so you should use it when possible. Use the MD5 message digest to create a cryptographic\
    \ hash of a file. When transmitting this file, make the hash to the recipient,\
    \ who also uses `md5sum` to compute a hash on the file. If the recipient’s hash\
    \ is the same as the sender’s hash, the file is genuine. If the hashes differ,\
    \ the file has been tampered with.\n\n hash consists of 32 characters. Fortunately,\
    \ you don’t have to compare two long sequences of characters because `md5sum`\
    \ handles this comparison for you if you use the `--check` or `-c` option.\n\n\
    # Activity\n\n+   1. Start your Linux computer. Switch to a command-line terminal\
    \ (tty2) by pressing `Ctrl+Alt+F2`, and log in as user1.\n\n+   2. To become familiar\
    \ with the `md5sum` command, type `man md5sum` and press **Enter**. Read the information,\
    \ but don’t be concerned if you don’t understand everything on the page. Press\
    \ `q` to exit the man.\n\n+   3. To copy a program file in the bash directory\
    \ to your home directory, type `cp /bin/bash ~` and press **Enter**.\n\n+   4.\
    \ To generate a cryptographic hash of the bash file and display the output onscreen,\
    \ type `md5sum -b bash` and press **Enter**. The `-b` option is used on binary\
    \ files, such as the bash program; by default, md5sum assumes the file is a text\
    \ file unless you use this option. Output similar to the following is displayed:\n\
    \n```\n26b6100fa713bb5591a74073fe622bcc *bash\n```\n\n+   5. Generate the hash\
    \ again, but this time send the output to a file by typing `md5sum -b bash > bash.md5`\
    \ and pressing **Enter**.\n\n+   6. To validate the bash file, type `md5sum -c\
    \ bash.md5` and press **Enter**. You see bash: OK. The `-c` option is the same\
    \ as `--check`, which tells md5sum to compare the MD5 hashes for the bash and\
    \ bash.md5 files."
