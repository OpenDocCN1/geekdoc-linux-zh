  md: '# Lab 3.2 Performing Complex Searches


    # Objectives


    The goal of this lab is to learn how regular expressions and the grep command
    can be used for complex searches of documents. Regular expressions are useful
    when searching for lines in a text file or data stream containing certain strings.
    Sometimes, however, you need to find lines based on more complex criteria. For
    example, if you want to extract lines from a file or data stream containing two
    words that aren''t adjacent, creating a regular expression to handle this situation
    could be difficult. A simple solution is to use two grep filters, one for each
    word. Any lines passing through both filters contain both words.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal as the root user.


    +   2. Move to the /usr/share/man/man1 directory by typing cd /usr/share/man/man1
    and pressing Enter.


    +   3. Type cat bash.1 | grep display less and press Enter. The word “display”
    in lowercase letters is shown on all lines. Press q to quit.


    +   4. Type cat bash.1 | grep Display less and press Enter. The word “Display",
    starting with an uppercase letter, is shown on all lines. Press q to quit.


    +   5. Searches with grep are usually case sensitive, but you can use the -i option
    for searches that aren''t case-sensitive. Type cat bash.1 | grep -i display less
    and press Enter. The output contains both “display” and “Display." Press q to
    quit.


    +   6. To make the search more complex, you can search for more than one word.
    Type cat bash.1 | grep -i display | grep history and press Enter. There''s no
    need to pipe the output to a less filter because it''s unlikely that more than
    a few lines will match. You see a few lines containing “display” (for the search
    that''s not case sensitive) and “history” (for the case-sensitive search).


    +   7. You can also use grep to search for regular expressions. Try searching
    for a simple regular expression, type cat bash.1 | grep ^When grep script and
    press Enter. The caret (^) searching for the word “When” at the start of the line
    and “script” elsewhere in the line.


    +   8. You uncompressed bash.1 file in Step 3 of Lab 3.1. To restore it to its
    compressed form, type gzip bash.1 and press Enter.'
