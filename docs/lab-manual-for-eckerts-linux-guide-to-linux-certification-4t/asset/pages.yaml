  md: '# # Lab 13.2 Installing and Configuring NIS


    # ## Objectives


    The goal of this lab is to learn how to configure a Network Information Service
    (NIS) server. Configuring the client requires two Linux servers, so you don''t
    do this task in this lab. If you have a second Linux computer, you can go through
    the client configuration process (explained in Chapter 13 of the accompanying
    textbook).


    # ## Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux

    - An Internet connection


    Estimated completion time: 15 minutes


    # ## Activity


    +   1. If necessary, start your Linux computer, switch to a command-line terminal,
    and log in to the terminal as root.


    +   2. Type `yum install ypserv` press y and then **Enter** to confirm.


    +   3. Type `domainname F20_domain` (or substitute another name for F20_domain)
    and press **Enter**.


    +   5. Next, open the `/var/yp/Makefile` file in a text editor, navigate to the
    line beginning with all; and delete the word `mail` in that line. Save and close
    the file.


    +   6. In a text editor, create a new file named `/var/yp/securenets`. If you
    don''t create this file, any computer can share your user and password information.
    Add a line listing your network''s subnet mask and network address. For example,
    if your network is 10.0.0.0/16, add the line `255.255.0.0 10.0.0.0.` (Note: You
    can add lines for net-works, or individual hosts that should be able to access
    the NIS server databases.) Save and close the file.


    +   7. Open the `/etc/ypserv.conf` file in a text editor. Uncomment the line so
    that all hosts are allowed to access all databases. Save and close the file.


    +   8. At the command prompt, type `systemctl start ypserv.service` and press
    **Enter**. If you were setting up NIS permanently, you would also enter `systemctl
    enable ypserv.service`.


    +   9. Type `systemctl start ypasswdd.service` and press **Enter**. (Again, if
    you were setting NIS permanently, you would use the `systemctl enable` command
    to start ypasswdd when the system starts.)'
