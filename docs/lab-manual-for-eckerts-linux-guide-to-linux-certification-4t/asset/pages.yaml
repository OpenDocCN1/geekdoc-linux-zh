    # Objectives


    The goal of this lab is to create complex functions stringing two or more simple
    Linux commands together by using pipes, which send one command''s output to another
    command as input. After completing this lab, you''ll be able to do the following:


    +   - Pause the display of data at full screen

    - Display text strings embedded in binary data

    - Filter a data stream based on a word


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    | Estimated completion time: 15 minutes |


