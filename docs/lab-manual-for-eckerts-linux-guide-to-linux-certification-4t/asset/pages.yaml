  md: '# Chapter 4 Linux Filesystem Management


    8. Another good use of the find command is locating files that have been accessed
    or modified in a certain time period. For example, to list files in /etc directory
    that have been accessed in the past 60 minutes, type find /etc -amin -60 and press
    Enter. See a list of files that have been modified in the past day, type find
    /etc -mtime -1 and press Enter.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_55_0.png)


    The -amin argument looks for files that have been accessed in a specified number
    of minutes. You can also use -mmin to look for files that have been modified.
    The -mtime and -atime arguments look for files that have been modified or accessed
    in a specific number of days.


    So far, you''ve focused on displaying files that match a criterion, but you can
    use find to perform other actions when files criteria. In Steps 2 and 3, you used
    find to locate files with no user owners. In Step 4, you used chosen to assign
    owners to these files. You can combine these two steps into one. First, change
    the owner of the file so that there is no owner: type chown 7000 test and press
    Enter. Type find / -nouser and press Enter to list the test file. Now find / -nouser
    -exec chown nobody "{}\ and press Enter. This command changes the user owner to
    the nobody for all files and directories with no user owner. Type ls -l test and
    press Enter to see the test file now owned by the nobody user.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_55_1.png)


    The exec parameter specifies running the chgrp command every time finds a file
    with no owner. The braces ({}) are placeholder for the name of the unowned file,
    and the semicolon (;) signals the end of the command.


    9. The find command has many more options. To get help with this command, type
    man find and press Enter. Browse through the man pages, and when you''re finished,
    press q to quit. Type logout and press Enter, and then press Ctrl+Alt+F1 to go
    back to the graphical screen.


    # Review Questions


    +   1. Which of the following displays a list of files in the current directory
