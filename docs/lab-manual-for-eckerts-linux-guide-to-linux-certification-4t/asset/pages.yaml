  md: '# Lab 2.6 Giving Shutdown Notification


    # Objectives


    The goal of this lab is to learn how to shut down a Linux system so that other
    users are notified.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 30 minutes


    # Activity Background


    When Linux computers are networked and one computer''s resources are being used
    by others, it''s useful to notify all users when the system is being shut down
    so that they have a chance to save their data and exit applications before the
    shutdown. You can use the Linux shutdown command to specify a notification message
    and send it to users automatically.


    # Activity


    +   1. Start your Linux computer and press Ctrl+Alt+F2 to go to a command prompt
    and login as root, if necessary.


    +   2. Tell Linux to shut down five minutes from now by typing shutdown -h +5
    The system is going down and pressing Enter. You see the following messages:


    ```

    Shutdown scheduled for Date-Time, use shutdown -c to cancel.

    Broadcast message from root@localhost.localdomain

    The system is going down

    The system is going down for power-off at Date-Time.

    ```


    +   3. Wait about four minutes, and you will see these additional lines displayed
    onscreen:

    Broadcast message from root@localhost.localdomain Date-Time.

    The system is going down

    The system is going down for power-off at Date-Time.


    +   4. Type shutdown -c and press Enter to abort the shutdown.


    +   5. Type shutdown -h +5 The system is going down again and press Enter. You
    see the same messages you saw in Step 3.


    +   6. Next, go to tty5 by pressing Alt+F5. Log in as root. After entering your
    password, in a minute or so you see a similar message to this:


    ```

    Broadcast message from root@localhost.localdomain Date-Time.

    The system is going down

    The system is going down for power-off at Date-Time.

    ```


    +   7. Go back to tty2 by pressing Alt+F2. Type shutdown -c and press Enter to
    abort the shutdown.'
