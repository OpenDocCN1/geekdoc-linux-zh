    --encrypt secret and pressing Enter. You''ve created an encrypted file called
    secret.gpg without destroying the original file called secret. Type ls -secret
    and see output similar to the following:

    4. Log out as user1, and log in as user2. Decrypt the secret.gpg by typing ppg2
    --decrypt /home/user1/secret.gpg and pressing Enter.

