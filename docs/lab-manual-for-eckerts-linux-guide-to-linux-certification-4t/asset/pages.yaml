  md: '# Lab 12.1 Configuring Ethernet Interfaces


    On VMware virtual machines, the Ethernet interface name may be eno16777736 or
    something similar. You can change it to eth0 by following the instructions at
    the end of this lab. The lo0 in the loopback network device, which you will learn
    about in Lab 12.2.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_138_0.png)


    +   3. To change a NIC''s IP address, pass the new address as a parameter by typing
    ifconfig eth0 10.100.1.1 netmask 255.255.0.0 and pressing Enter.


    +   4. To view an interface''s status, specify its name by typing ifconfig eth0
    and pressing Enter. You see output similar to what''s shown in Step 2, but no
    information about lo is displayed.


    +   5. To change the subnet mask, type ifconfig eth0 netmask 255.255.255.0 and
    press Enter.


    +   6. Again, display eth0 status. You should see the network value has changed.


    +   7. To display only the lines showing the IP address (inet), broadcast address,
    and subnet mask as well as IPv6 address information (inet6), type ifconfig eth0
    | grep inet and press Enter. You see output similar to the following:


    ```

    inet 10.100.1.1 netmask 255.255.255.0 broadcast 10.100.1.255

    inet6 fe80::20c:29ff:fe8d:be36 prefixlen 64 scope 0x20<link>

    ```


    +   8. Sometimes you need to see an Ethernet NIC''s MAC address, for example,
    your company uses locally managed MAC addresses. In Step 2, the MAC address is
    00:00:29:8d:be:36. You can change it, but you must shut down the interface first
    by typing ifconfig eth0 down and pressing Enter.


    > While an interface is down, your computer can''t send or receive packets on
    it.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_138_1.png)


    +   9. Change the MAC address by typing ifconfig eth0 hw ether 00:00:ba:ad:f0:0d
    and pressing Enter.


    +   10. Restart the interface by typing ifconfig eth0 up and pressing Enter. Verify
    that the MAC address has changed by typing ifconfig eth0 | grep inet and pressing
    Enter. You should see the following:


    ether 00:00:ba:ad:f0:0d txqueelen 1000 (Ethernet)


    +   11. The ifconfig command can''t be used to configure one important parameter:
    the default route (default gateway). You must use the route command to set it.
    If it tries to resolve IP addresses without command-line options, it displays
    the routing table in the table to names using DNS. To disable DNS lookups, you
    use the -n option by typing route -n and pressing Enter. The routing table should
    be similar to this example (only the first three columns of the output are shown
    below):


    Kernel routing table

    Destination Gateway Genmask ... output omitted

    10.100.1.0 0.0.0.0 255.255.255.0 ... output omitted


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_138_2.png)'
