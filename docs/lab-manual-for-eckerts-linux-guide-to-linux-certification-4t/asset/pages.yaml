    # 3.5 Working with Unusual File and Directory Names


    # Objectives


    The goal of this lab is to see how Linux file systems enable you to use almost
    any file and directory names you like and use any special characters in names.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 20 minutes


    # Activity Background


    If you career started with DOS or early Windows versions, you might remember severe
    restrictions on file and directory names. DOS restricted file and directory names
    to eight characters with an optional extension of up to three characters. Early
    Windows versions had the same restriction, but Windows 95 changed it that names
    could be up to 256 characters, but there were limitations on the types of characters
    that were allowed.


    Later Windows versions reduced the limitations, but some still remain. You can
    create names with any characters you like. You just need to realize that some
    characters might conflict with your system''s shell. Although conflicts can result,
    Linux usually has a way to work around them.


    # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal with your username.


    +   2. To change the shell prompt so you can see your current directory easily,
    type PS1="\w" and press Enter. The prompt now shows the current working directory.


    +   3. Chances are good that the current directory is your home directory. If
    so, the command prompt should be ~. If it''s not, go to your home directory by
    typing cd ~ or cd and pressing Enter.


    +   4. The tilde (-) represents your home directory. If you want to see the actual
    directory, type pwd and press Enter. If you are logged in root, your home directory
    is most likely /root, although it could be different depending on how the administrator
    set up the system.


    +   5. Create a directory called test below your home directory by typing mkdir
    test and pressing Enter. Make it the current directory by typing cd ~/test and
    pressing Enter. The command prompt is now ~/'
