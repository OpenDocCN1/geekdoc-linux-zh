  md: '# Lab 9.2 Customizing Output


    # Objectives


    The goal of this lab is to learn how to use the ps command to customize process
    display formats. Standard display formats are designed for general use and usually
    show more information than needed, but you can use command-line options to modify
    what information is displayed.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    # Activity


    +   1. If necessary, start your Linux computer, switch to a command-terminal,
    and log in to the terminal as User1.


    +   2. Type ps -e l and press Enter. The -e option displays all processes. The
    output has four columns: PID, TTY, TIME, and CMD. The first few lines of output
    look similar to the following:


    | PID TTY TIME CMD |

    | 1 ? 00:00:04 systemd |

    | 2 ? 00:00:02 kthreadread |

    | 3 ? 00:00:00 ksoftirqd/0 |


    If you see -- prompt at the bottom, press q to get back to the command prompt.


    +   3. Type ps ax l and press Enter. The option displays all processes started
    by a terminal (tty), and the x option displays all processes not started by a
    terminal. Using these two options is the logical equivalent of the -e option.
    This display has columns: PID, TTY, STAT, TIME, and COMMAND. There are also subtle
    differences in how data is displayed; for example, child processes are shown in
    brackets and the STAT column shows the status of the process. The S in the status
    column means the process is in the interruptible sleep state. The first few lines
    of output look similar to the:


    | PID TTY STAT TIME COMMAND |

    | 1 ? S 00:04 /usr/lib/systemd/systemd |

    | 2 ? S 00:02 [kthreadread] |

    | 3 ? S 00:00 [ksoftirqd/0] |


    If you see -- prompt at the bottom, press q to get back to the command prompt.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '4. To see more options for changing the format, type ps -ef | more and press
    Enter. The -ef option displays all processes in a listing format, as you can see
    in this example:


    | UID | PPID | C | STIME | TTY | CMD |

    |---|---|---|---|---|---||

    | root | 1 | 0 | 0Oct | ? | 00:00:04 | /usr/lib/systemd/systemd |

    | root | 2 | 1 | 0Oct | ? | 00:00:02 | [kthreadadd] |

    | root | 3 | 0 | 0Oct | ? | 00:00:00 | [ksoftirqd/0] |


    If you see the --More-- prompt at the bottom, press q to go back to the command
    prompt.


    5. Try the following formats and notice how each one is displayed:


    +   - -f—Full listing

    - -j—Jobs format

    - j—Job control format

    - 1—Long listing

    - s—Signal format

    - v—Virtual memory format

    - X—i386 register format (use only with an Intel processor-based system)


    6. The -o option is for a user-defined format. Type ps -eo pid,cmd | and press
    Enter to specify showing only the PID and CMD columns, as in this example:


    | PID | CMD |

    |---|---|

    | 1 | /sbin/init |

    | 2 | [kthreadadd] |

    | 3 | [migration/0] |


    > You must have a space after the -o option and no spaces before after the commas
    separating column names.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_104_0.png)


    If you see the --More-- prompt at the bottom, press q to go back to the command
    prompt.


    7. Type ps -eo pid,ppid,mem | to add PPID and %MEM columns to the display. (A
    PPID is the process ID of a parent process, as you learned in Lab 9.1.) The %mem
    option displays the percentage of system memory a process uses. Processes that
    use only a tiny portion of system memory are displayed as 0.0, as shown in this
    example:


    | PID | PPID | %MEM | CMD |

    |---|---|---|---|

    | 1 | 0 | 0.1 | /usr/lib/systemd/systemd |

    | 2 | 0 | 0.0 | [kthreadadd] |

    | 3 | 2 | 0.0 | [ksoftirqd/0] |'
