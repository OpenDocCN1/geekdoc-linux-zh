- img_proc: true
  md: '# Activity


    +   1. Start your Web browser.


    +   2. Type http://www.linuxsecurity.com in the address bar and press Enter to
    see a Web page on Linux security matters. The page changes frequently, feel free
    to explore Notice that you''re cautioned about potential security holes in software,
    want to use secure protocols (such as SSH) instead of unsecured ones (such as
    Telnet), and so forth.

    The emphasis is on how to avoid security problems and attacks. Linux software
    updates and patches are usually available before Web sites are attacked, unlike
    typical situation with commercial software (with updates and patches becoming
    available only after sites are attached).


    +   3. Click the HOWTos near the top. Click the Secure firewall link to go to
    a list of articles and Web sites on Linux firewalls. The Linux OS has a built-in
    firewall. You just need to configure it—and that can be challenging if you don''t
    understand protocols as IP, TCP, and UDP. The resources on this page help you
    configure the firewall by giving you instructions or supplying software (as scripts)
    that makes it easier.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_21_0.png)


    +   4. Type http://www.ietf.org/rfc/rfc2137.txt in the address bar and press Enter.
    You are looking at a Request for Comment (RFC), published by the Internet Engineering
    Task Force (IETF) to describe an Internet Standard. (The IETF is the caretaker
    of the Internet, and its focus is security and protecting the Internet from attack.)
    This document''s content is detailed and technical and might be beyond your comprehension,
    but you''re focusing on how the IETF handles security concerns.


    +   5. Scroll down until you see the section “Security Considerations,” and read
    these paragraphs. Most IETF RFCs have a security section. What do IETF RFCs have
    to do with Linux? Designers of Linux and other open-source software use protocols
    and standards, as IETF RFCs, to be compatible with other software. The only designers
    use proprietary protocols when they''re designing software to integrate with a
    vendor''s product, with as the Samba product.


    +   6. Type http://www.nsa.gov/research/selinux in the address bar and press Enter
    to see the SELLinux (stands for “enhanced Linux”) site. SELinux, created by the
    U.S. National Security Agency (NSA), adds extensions to Linux to make it less
    vulnerable to break-ins. Even if a Linux computer is attacked, SELinux severely
    limits the attacker''s ability to do anything on the computer. Attacks common
    in the Windows world, such as Code Red and Nimda, are also in the Linux world,
    even without SELinux. With SELinux, these attacks are highly unlikely.


    +   7. Exit your browser, and close any windows.'
  merge: -1
  pgno: 21
