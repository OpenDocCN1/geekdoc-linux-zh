    # Lab 5.3 Using the fuser Command


    # Objectives


    The goal of this lab is to become familiar with the fuser command, which enables
    you to see which users or daemons are holding files open. You might need to know
    this information if you want to perform an operation on a file but some other
    user has it open. Also, when you''re writing a program, this information can tell
    you when it has an error.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    # Activity


    +   1. If necessary, switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2,
    and log in to the terminal as the root user.

    2. Switch to virtual console 3 by pressing Ctrl+Alt+F3, and then log in as the
    root user.

    3. Create a zero-length file by typing touch sample and pressing Enter.

    4. Open the file and hold it by typing less sample and pressing Enter.

    5. Switch to virtual console 2 by pressing Ctrl+Alt+F2.

    6. You can use fuser to find the process that is holding the sample file open.
    First, type fuser * and press see all files in the current directory. To see which
    process is holding the sample file open, type fuser sample and pressing Enter.
    You should see similar to the following:


    ```

    root/sample: 2650

    ```


    This output tells you that process 2650 is holding the file open. Your process
    number will probably be different.


    7. See what process 2650 is by typing ps xxxx (replacing xxxx with your process
    number) and pressing Enter. You should see output similar to the following:


    | PID STAT TIME COMMAND |

    | 2650 tty3 S 0:00 less sample |


    This output tells you that process 2650 was started from virtual console 3 (tty3).'
