  md: '# Materials Required


    This lab requires the following:


    +   - An Internet connection

    - A Web browser


    Estimated completion time: 20 minutes


    # Activity


    +   1. Start your Web browser.


    +   2. Type http://news.netcraft.com/archives/web_server_survey.html in the address
    bar, and then press Enter to display the Netcraft Web Server Survey site. This
    site has a graph showing the market share for the most popular Web servers. Note
    that while Apache at one time led the pack by a large margin, in recent years
    Microsoft seems to have taken much of Apache''s market share and they are now
    about even.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_18_0.png)


    One factor with a major effect on the Netcraft survey results is "virtual hosting,"
    a feature that allows a single Web server to host many Internet sites or URLs.
    In the Netcraft survey, an ISP running a single Web server with 5000 virtual hosts
    is seen as 5000 Web servers, not a single Web server.


    +   3. Type http://w3tech.com/technologies/overview/web_server/all in the address
    bar, and then press Enter to see the results of a Web server survey conducted
    by W3Techs. Click the technologies overview link to see more information about
    how the survey is conducted.


    +   4. Compare the results of the W3Techs and Netcraft surveys. How are they similar?
    How do they differ? What do you think accounts for the differing results?


    +   5. If you''re continuing to the next lab, leave your Web browser open; otherwise,
    close it.


    # Review Questions


    +   1. Why might the Netcraft survey not be an accurate way of determining the
    number of Apache Web servers on the Internet?


    +   a. There''s no way to know what software a Web server is using.


    +   b. A Web server could be using virtual hosting that allows one physical Web
    server to appear as numerous Web servers.


    +   c. Web server administrators might have servers masquerade as other types
    of software to improve compatibility between their servers and popular browsers.


    +   2. Based on the survey results from Netcraft, which company has seen the most
    substantial increase in market presence?


    +   a. nginx


    +   b. NCSA


    +   c. Sun'
