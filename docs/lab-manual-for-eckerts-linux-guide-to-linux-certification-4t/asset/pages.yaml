  md: '# Lab 14.2 Using SSH


    # Objectives


    In this lab, you use Secure Shell (SSH) to communicate with another Linux computer.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    ```

    Estimated completion time: 20 minutes

    ```


    # Activity Background


    In an earlier lab, you practiced configuring and using Telnet. However, this protocol
    poses major security risks if it''s used over a public network. It produces an
    unencrypted packet stream that can be intercepted easily. SSH is a more secure
    way to communicate because the packet stream is encrypted with a cryptographically
    strong cipher.


    # Activity


    +   1. On your Linux computer, if necessary, switch to the second virtual console
    (tty2) and log in as user.

    2. Start the sshd service by typing `sudo systemctl start sshd.service` and press
    Enter. Enter the password for the root user when prompted.

    3. You will simulate making an ssh connection to another computer by connecting
    to local-host. Type `ssh user@localhost` and press Enter. You see output similar
    to this:

    nThe authenticity of host ''localhost'' (127.0.0.1)'' can''t be established.

    RSA key fingerprint is 3d:c1:c4:b4:24:df:f2:ec:a8:f2:62:34:51:5a:0b.

    Are you sure you want to continue connecting (yes/no)?

    4. Type yes and press Enter. You see this warning:

    Warning: Permanently added ''localhost'' (RSA) to the list of known hosts, user@localhost''s
    password:

    5. Type the password and press Enter. The account''s last login time is displayed
    followed by a prompt.


    > RSA key fingerprint is a 128-bit number expressed as 32 hexadecimal digits.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_161_0.png)'
