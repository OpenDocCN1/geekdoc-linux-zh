  md: '# Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux

    - A network connection and the IP address of another device on your network


    Estimated completion time: 10 minutes


    # Activity


    +   1. Start Linux and log in to the GUI as a regular user. Open a terminal window,
    and then type ifconfig and press Enter to view your IP address. Type route and
    press Enter to see the address of your default gateway. Make a note of both addresses.

    2. Type su and press Enter to type the root password so you are running as root.
    You need root privileges to configure the firewall.

    3. Type firewall-cmd --state and press Enter to see the current status of the
    firewall. You should see a message that says “running.”

    4. Type firewall-cmd -get-services and press Enter to see the list of services
    supported by the firewall-cmd. You''ll see a list of common services you are probably
    familiar with such as dhcp, dns ftp, http, telnet and some that you may not be
    familiar with such as pmcd, nmproxy, and今回. These are the services you can use
    by name with the firewall-cmd command so you don''t need to know their port number
    and protocol.

    5. Type firewall-cmd --list-all-zones I and press Enter. You''ll see a list of
    zones which you''ll learn about in Chapter 14 of the accompanying book. The first
    line after zone name is interfaces: Press Space until you see the zone named public.
    Notice that after the public name, it says “default, active). And after interfaces:
    you see. On the line that starts with “services:” you see a list of services that
    are enabled for this zone. Press q if necessary, to exit.

    6. Type firewall-cmd --get-active-zones and press Enter. You will see only the
    public zone.

    7. To enable the ftp service in the default zone (public), firewall-cmd --add-service=ftp
    and press Enter. Type firewall-cmd --query-service=ftp and press Enter. The output
    is “yes”, which means the service is enabled for the default zone.

    8. Type firewall-cmd --list-all and press Enter to see detailed information for
    the default zone.

    9. Type firewall-cmd --remove-service=ftp and press Enter to disable the service.
    Type firewall-cmd --query-service=ftp and press Enter. The output is “no”, which
    means the service is disabled for the default zone. Type firewall-cmd --list-all
    and press Enter to see that ftp is no longer listed on the services.

    10. Now type firewall-cmd --add-service=ftp --timeout=120 and press Enter. This
    enables the service for two minutes (120 seconds). Type firewall-cmd --query-service=ftp
    and press Enter. The output is “yes.” Wait about two minutes and type firewall-cmd
    --query-service=ftp and press Enter. The output is “no”, indicating the service
    is now disabled.'
