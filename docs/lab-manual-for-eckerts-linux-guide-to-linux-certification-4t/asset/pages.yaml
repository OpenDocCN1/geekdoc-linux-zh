  md: '# Lab 8.1 Setting the Default Runlevel


    # Objectives


    The purpose of this lab is to learn how to change the default runlevel at startup.
    Many Linux distributions set the initial runlevel to 5 (graphical.target), which
    starts the GUI automatically. Some users prefer to have the system boot to a command
    prompt, however, and runlevel 3 (multi-user.target) does this. You can configure
    runlevels easily by running the systemctl command.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    # Activity Background


    The common runlevels, the analogous targets and their meanings are as follows:


    +   - 0:poweroff.target:Halt the system.

    - 1:rescue.target:Single-user mode.

    - 3:multi-user.target:Multiuser mode with full networking support.

    - 5:graphical.target:Multiuser mode with full networking support and start the
    graphical user interface.

    - 6:reboot.target:Reboot the system.


    # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing **Ctrl+Alt+F2**, and
    log in to the terminal as root.


    +   2. Type **runlevel** and press **Enter** to see the current runlevel. You
    see N 5 which means yours are at runlevel 5. The N before the 5 means that you
    have not previously running at a different runlevel.


    +   3. Now, type **systemctl get-default** and press **Enter** to see the runlevel
