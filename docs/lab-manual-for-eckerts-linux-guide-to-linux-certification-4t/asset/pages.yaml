  md: '# # Lab 2.1 Booting a Linux Live Installation


    # ## Objectives


    In this lab, you download and install Linux Mint, a relatively new and easy-to-use
    Linux distribution that is focused on providing desktop and mobile user capabilities.
    You will run Linux Mint directly from the installation ISO file that you download,
    so little additional disk space is required on your host computer. Running Linux
    directly from the installation DVD or ISO file is referred to as a live boot or
    live installation. Linux Mint also allows you to install the OS to your hard drive,
    if desired. This lab is intended to expose you to the idea of live distributions
    and for you to see another distribution besides Fedora which you will use throughout
    the book.


    # ## Materials Required


    This lab requires the following:


    +   - A Web browser and an Internet connection


    | Estimated completion time: 45 minutes |


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_25_0.png)


    Some steps in this activity might differ slightly, depending on the Linux Mint
    version you download.


    # ## Activity


    +   1. Start your Web browser, and go to http://www.linuxmint.com. Click Download
    from the top menu. Click the Cinnamon 64-bit link and click one of the mirror
    sites to download the .iso file. (Note: Downloading the file might take a long
    time, depending on your connection speed; for example, with a DSL connection,
    the download might take an hour and half more)

    2. Create a new virtual machine (VM) with the virtual machine software on your
    Windows computer and choose the option to boot an .iso file. Configure the VM
    with 1 GB of RAM and accept the defaults for other parameters.

    3. Start the virtual machine and press Space to see the Linux Mint logo and the
    countdown timer to bring up the boot menu. From the boot menu, use the arrow keys
    to select Start Linux Mint and press Enter. You are logged in as a user named
    mint by default.

    4. When you use the Linux desktop, click the Terminal icon on the bottom of the
    screen (if you hover your mouse over an icon, it will show the name of it). Type
    whoami and press Enter to see the name of the user you are logged in as, which
    should be mint.

    5. Go to the /proc directory by typing cd /proc and pressing Enter.

    6. Type ls and press Enter. The filenames and directory names that are displayed
    in the /proc directory aren''t real files, nor do they actually exist on your
    disk. The Linux kernels simulate as a convenient way for you to access information
    about your system with the familiar ls command.'
