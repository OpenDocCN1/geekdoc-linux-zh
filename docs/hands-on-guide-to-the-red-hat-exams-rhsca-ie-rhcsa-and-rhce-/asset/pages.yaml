  md: '# CHAPTER 18


    # DNS


    When you''re trying to access a website, you type in the name you are looking

    for and it comes up. In the background, though, Domain Name Service (DNS)

    is what translates website name into an IP address so that the site may be

    accessed. This translation also occurs when you are connecting to other systems

    on your network instead of their IP addresses. DNS

    plays a critical role in your networks, but also on the Internet as a

    hole. The root DNS servers for the world run BIND as their DNS

    software choice, so naturally Red Hat also includes it on the exams. This chap-

    ter covers BIND in great detail because it is such a critical network component.


    # Setting Up BIND


    Just as with any service, you need to install the packages for BIND first.


    +   Step 1. Install the required packages:

    # yum install -y bind bind-utils bind-libs


    +   Step 2. Verify that the packages have been installed:

    # rpm -qa | grep bind

    bind-utils-9.7.0-5.P2.el16.x86_64

    bind-9.7.0-5.P2.el16.x86_64

    bind-libs-9.7.0-5.P2.el16.x86_64


    +   Step 3. Ensure that the service is set to start on system boot:

    # chkconfig named on


    +   Step 4. Verify that the service is set to start on boot:

    # chkconfig --list named

    named  :off 1:off 2:on 3:on 4:on 5:on 6:off'
