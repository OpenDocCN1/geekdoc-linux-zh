    # Installing an FTP Server


    In this chapter, we use the vsftpd package, which stands for Very Secure FTP Daemon.
    This particular FTP server offers additional features that make it a more secure
    choice if you have to use FTP. As with all services you''d like to offer to your
    network users, you need to make sure that the appropriate packages are installed.
    Here''s how:


    Grab the required package:


    ```

    # yum install -y vsftpd

    ```


    When the installation is complete, verify it was installed successfully:


    ```

    # rpm -qa | grep vsftpd\vsftpd-2.2.2-6.el6.x86_64

