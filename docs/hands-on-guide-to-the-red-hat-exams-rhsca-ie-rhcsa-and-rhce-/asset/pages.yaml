    # Making Swap Partition


    The system uses swap space as a type of "virtual memory" for when your physical
    memory begins to run low. This is done by using a piece of disk storage to swap
    files in and out of memory (hence, the term swap). This capability can be useful
    on systems that don''t have large amounts of physical memory or when your system
    is running something that becomes memory intensive. Before you create a swap,
    however (which is done in the next chapter), you need to partition space on your
    disk for it. This is also a little different from the partitions you have previously
    creating because the partition type is different. Let''s make a swap partition
    on /dev/hdd for the system.


    Like use the fdisk utility to start:


    ```

    # fdisk /dev/hdd

    ```


    **Step 2.** Create a new partition:


    ```

    Command (m help): n

    Command action

    e extended

    p primary partition (1-4) 1

    Partition number (1-4): 1

    First cylinder (1-16664, default 1):

    Using default value 1

    Last cylinder or +size or +sizeM or +sizeK (1-16664, default 16664): +2048M

    ```


    When you are creating partitions, by default, partition type 83 is chosen (Linux).
    For a swap partition, however, you need to change the type to 82 (Linux Swap).
