  md: '# Chapter 5: Networking 63


    machines here) environment, using host files is a feasible task. You would need
    to make entries in the hosts file on every server (remember the hosts file is
    local to the server). You can see, however, that this approach would quickly get
    out of hand from a management perspective when the number of machines to update
    and keep track of grows quickly. I''m sure you could have guessed, the next logical
    step is to let the system query a DNS server instead of the hosts file. The /etc/resolv.conf
    file contains the IP address of the DNS server. This allows your systems to resolve
    DNS queries instead of a local lookup in the hosts file.


    Let''s look at what is currently in the /etc/resolv.conf file:


    ```

    # cat /etc/resolv.conf

    ; generated by /sbin/dhclient-script

    nameserver 172.168.1.1

    ```


    This output shows that the server we are on (RHEL01) sends all queries to the
    DNS server 172.168.1.1 (which happens to be RHEL01). Although you don''t have
    a DNS server installed (yet), this example shows how to troubleshoot incorrect
    settings on clients. You could also have a /etc/resolv.conf file that looks like
    this:


    ```

    # cat /etc/resolv.conf

    search example.com

    nameserver 192.168.1.1

    nameserver 172.168.1.1

    ```


    The search option is the name of the domain that will be searched by default.
    If your client is trying to access a hostname that is not fully qualified (such
    as RHEL01.example.com), and the DNS server returns an error that it can''t find
    the specified host, try adding the search `domain` option. This is a common setup
    when clients and servers belong to a domain. The second listing of the nameserver
    option just specifies a secondary DNS server in the first case is not available.


    All right, so you have configured a hosts file and a resolv.conf. Now, I''m sure
    someone is asking, which one gets queried first? Naturally, there is a third file
    that contains a single line defining the search order. This third file can be
    one of the two, although it is usually the latter.


    Older File:


    ```

    # cat /etc/hosts.conf

    order hosts,bind

    ```


    Newer File:


    ```

    # cat /etc/nsswitch.conf | grep hosts

    hosts: files dns

    ```'
