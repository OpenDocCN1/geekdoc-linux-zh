    # Working with GRUB


    The previous section described the boot process and how it works. The first part
    of that process deals with the bootloader, GRUB. In this section, we look at GRUB
    and its role in the boot process in depth.


    The GRUB bootloader is broken down into different stages. The code contained on
    the master boot record (MBR) is considered GRUB stage 1. It loads GRUB stage 1,5,
    which tries to identify the file system type (optional), or it can call GRUB stage
    2 directly. Stage 2 is what calls the kernel and loads it into memory. In stage
    1, GRUB needs to search the MBR looking for an active partition from which to
    boot the kernel. GRUB has its own format for looking through hard disks. The syntax
    of this format


    ```

    xdn[,m] where x is the drive, n is the number of the disk, and m denotes the partition
    number.

    ```


    This syntax is very useful when troubleshooting issues with GRUB because you need
    to know how GRUB searches for disk drives when trying to find the primary partition.
    When the primary partition is found, GR loads the kernel, which is where you move
    on to stage 2. Stage 2 is the place where you will tend to spend the most time
    troubleshooting boot with the system. As stage 2 starts, it presents you with
    a list of kernels that you can boot from, along with a list of options you can
    use to modify the parameters passed to the kernel during bootup (as you saw in
    Figure 2-1). Now let''s look at how to edit those entries (see Figure 2-2).


    # Grub Boot Options:


    +   - Edit the commands before booting

    - Modify or append the kernel arguments before booting

    - Open the GRUB command line'
