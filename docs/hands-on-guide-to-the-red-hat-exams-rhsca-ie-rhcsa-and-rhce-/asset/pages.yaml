  md: '# REAL-WORLD TIP


    If you just use the shutdown command, it actually brings the system into maintenance
    mode. To have the system actually shut down or reboot, you need to use the -h
    or -r option.


    Let''s look at some examples for a better understanding of how this works. Suppose
    you want to turn off the system. You could then do the following:


    ```

    # shutdown -h now

    ```


    This time instead of a complete poweroff, reboot the system as follows:


    ```

    # shutdown -r now

    ```


    You could also use the reboot command to achieve the same effect:


    ```

    # reboot

    ```


    As a final example, delay the shutdown by 2 minutes:


    ```

    # shutdown -h 120

    ```


    These are just examples of what you can do with the shutdown command. Unless you
    give permissions to your users, only the root user can issue the shutdown and
    reboot commands. Be careful about those users you allow to have access to these
    commands. You wouldn''t want random users rebooting your system constantly to
    fix problems!


    > WARNING: In earlier versions of Red Hat, you could use the /etc/shutdown.allow
    file to control who was allowed to shut down the system. With the release of RHEL6
    and the new Upstart utility, you can no longer use this file to control the shutdown
    process for individual users.


    Similar to the shutdown command is the halt command. The halt command brings the
    system to a powered-off state like shutdown.


    To turn off the system, you use this command:


    ```

    # shutdown now

    ```


    You could also use


    ```

    # halt

    ```


    Coinciding with the halt command are poweroff and reboot. The reason these commands
    all go in hand is that poweroff and reboot are actually both links to the halt
    command. You can verify this by using the following example:


    ```

