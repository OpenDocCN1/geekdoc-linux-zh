    # User Login Events


    Aside from the normal logs generated and used by the syslog service, there are
    two special commands that deal with system logins. These two commands have special
    logs that can be read only through the use of these commands:


    +   - lastlog Lists login records

    - faillog Lists failed login attempts


    You can use these two commands for viewing login events. These two commands are
    useful for hunting down attacks where users are trying to force themselves into
    other users'' accounts (called a brute-force attack).


    Syntax: **lastlog [options]**


    Options:


    +   - b DAYS Displays results older than DAYS

    - -u LOGIN Displays results for the user LOGIN'
