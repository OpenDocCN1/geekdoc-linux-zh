- img_proc: true
  md: 'If you want to turn off the swap, you can use the swapoff command. I do not
    show how to use it here because you just set up the swap space.


    Syntax: swapoff [options] DEVICE


    Options:


    +   - a Enables all swap devices

    - e Silently skips devices that don''t exist

    - s Verifies that the swap is running


    > REAL-WORLD TIP

    The big difference between the two swap types is that file swap is easier to manage
    because you can move the swap file to another disk if you want. The partition
    would need to be removed, re-created, and so on. Although Red Hat recommends using
    a partition swap, file swaps are fast enough these days with less administrative
    overhead to not use them instead. One word of caution, though, is that you can
    use only one swap (of either type) per physical disk.


    # Mounting a File System


    You have created your partitions and given them all a file system. Now you''d
    like to use them. No problem! Before you can use your new systems, though, you
    need to connect them to the directory hierarchy through the use of the mount command.
    They can be mounted to any directory, which is referred to as a mount point. If
    you mount a file system on a directory that is not empty, everything within that
    directory becomes inaccessible. Therefore, you should create a new directory as
    a mount point for each of your file systems. There are only two commands for mounting
    file systems:


    +   mount mounts a file system

    umount Unmounts a file system


    So far, you have created a few file systems plus some swap partitions. Let''s
    get these file systems mounted on the system.


    +   Step 1. Start by going to the /opt directory, where you can make some directories
    to serve as mount points.


    ```

    # cd /opt

    # mkdir company_data

    # mkdir backup

    ```'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'You have made two directories here that you can now use as mount points for
    the file systems. You can mount /dev/hdb1 to the company_data directory and /dev/hdc1
    to the backup directory.


    Syntax: mount [options] DEVICE MOUNT_POINT


    # Options:


    +   - r Mounts as read-only

    - w Mounts as read/write (the default)

    - L LABEL Mounts the file system with the name LABEL

    - v Provides verbose output


    # Step 2. Mount the two file systems:


    ```

    # mount /dev/hdb1 /opt/company_data

    # mount /dev/hdc1 /opt/backup

    ```


    Notice that you don''t specify a file type or any mount options. The reason is
    that the mount command automatically detects the file system type and mounts it
    for you. By default, the file system is also mounted with the defaults option.
    This is a good option to go with for most file systems because it covers many
    options you would normally want a file system mounted with. They include


    +   rw Mount a file system as read/write

    suid Enables running setuid and setgid programs

    dev Interprets device files on the file system

    exec Permits binary file execution

    auto Mounts the file system when the -a option is specified

    nouser Disallows any normal user from (un)mounting the file system

    async Allows all file system I/O to occur asynchronously


    With the file systems now mounted, you can use them as if they were a regular
    directory. Removing or unmounting a file system is a little complex because users
    might be actively using that file system. You can use the fuse and lsof commands
    to check for open files and users that are currently using files on a file system
    that you are trying to unmount.


    Syntax: umount'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'Options:

    -f Forces mount

    -v Provides verbose output


    # Step 3. Try to unmount the file system to see whether it is busy:

    # umount /opt/backup

    umount: /opt/backup: device is busy.

    (In some cases useful info about processes that use the device is found by lsof(8)
    or fuser(1))


    You can see the device is busy, so check who is using it.

    Syntax: fuser [options] MOUNT_POINT | FILE SYSTEM

    Options:


    +   -c Checks the mounted file system

    -k Kills processes using the file system

    -m Shows all processes using the file system

    -u Displays user IDs

    -v Provides verbose output


    # Step 4. Check to see what users are currently using the file system:

    # fuser -cu /dev/hdc1

    /opt/backup: 2337c (root)


    You can also use the lsof command for more details. This is another command like
    dd that has a huge number of options that I can''t possibly begin to cover in
    this book.


    # Step 5. View all open files:

    # lsof /dev/hdc1

    COMMAND PID USER FD TYPE DEVICE SIZE NAME

    bash 2337 root cwd DIR 22,1 4096 2 /opt/backup

    lsof 4815 root cwd DIR 22,1 4096 2 /opt/backup

    lsof 4816 root cwd DIR 22,1 4096 2 /opt/backup


    You can either contact the users or terminate any open connections yourself.


    # Step 6. To kill the open connections, you can use the fuser command again:

    # fuser -ck /opt/backup'
