    # Extra File System Commands


    From time to time, you need to perform maintenance on your file systems to ensure
    reliability and optimal performance. Usually, for any maintenance purposes, you
    take the file system offline by unmounting it. Suppose your boss just came and
    told you that you need to perform maintenance on the /dev/hdb1 file system this
    weekend.


    +   Step 1. Take your file system offline:


    ```

    # unmount /dev/hdb1

    ```


    Now let''s look at some of the different maintenance tasks you can perform. Here
    are the file system maintenance commands you have to work with:


    | blkid | Displays block device attributes |

    | df | Shows usage of the file system(s) |

    | e2fsck | Checks ext file systems |

    | e2label | Modifies the label on an ext file system |

    | findfs | Allows you to locate a specific file system |

    | resize2fs | Resizes an ext file system |

    | tune2fs | Tunes ext file system attributes |


    First, you need to label the file system. A specific file system more easily with
    a common name, instead of /dev/hdc1. An added benefit is the system''s being able
    to keep its label even if the underlying disk is switched with a new one. To label
    a file system, use the e2label command.


    Syntax: e2label DEVICE


    +   Step 2. Let''s label the file system CData to denote that it''s the company
    data file system:


    ```

    # e2label /dev/hdb1 CDData

    ```


    +   Step 3. You can use the same command to also verify:


    ```

    # e2label /dev/hdb1

    CDData

    ```'
