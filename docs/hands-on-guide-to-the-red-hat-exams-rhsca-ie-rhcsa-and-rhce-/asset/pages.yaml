  md: '# CHAPTER 20


    # Email Services


    The world today runs on email, and without without it, we would have a hard time
    functioning. Because of this, we need solid and reliable email servers to ensure
    that our email is processed correctly and either delivered or received on time.
    This chapter covers the different email services that can be used on Red Hat and
    the email process works as a whole. For Red Hat, Sendmail is the default for sending
    mail and Dovecot is the default for receiving. Here, we focus more on Postfix
    for sending and Dovecot for receiving. Let''s start with an overview of how email
    services work.


    # Email Service Overview


    The email system is divided into three different parts: MUA, MDA, and MTA. The
    mail user agent (MUA) deals specifically with end users. It is what they use to
    type and read emails they receive. The MUA is a mail client of some sort, such
    as Thunderbird or Evolution. The mail delivery agent (MDA) handles the delivery
    of mail from the receiving mail server to the spool where the mail sits until
    an MUA picks it up for the user. Finally, the mail transfer agent (MTA) is responsible
    for moving mail from one server to another until it arrives at its destination.
    In the next sections, we cover the setup of Postfix and Dovecot to provide mail
    functionality needed for the network.


    # SMTP with Postfix


    Red Hat provides both Sendmail and Postfix as viable mail programs. We focus only
    on Postfix in this book for multiple reasons. Postfix provides for easier administration,
    allows increased security, and supports virtual domains. It is also the default
    mail program on RHEL6.'
  merge: -1
  pgno: 424
- img_proc: true
  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    > MIGRATION TIP

    Up until RHEL5, Sendmail was the default mail program for the Red Hat operating
    system, but this has changed to Postfix with the release of RHEL6.


    > EXAM TIP

    For the exam, you can use either Postfix or Sendmail as long as the system functions
    properly and the required task is met. As pointed out in the preceding tip, Sendmail
    is no longer the default, so it may be easier to learn Postfix even if you aren''t
    really familiar with it.


    **Step 1.** To started, you just need to verify that Postfix is installed correctly:


