- img_proc: true
  md: 'your partitions. If you select this option, you are required to enter a password.
    You will be prompted for this password every time the system boots to decrypt
    the partitions for use by the system.


    > WARNING: Do not lose this password! If you do, anything you have encrypted will
    be completely inaccessible.


    Just because your partitions are encrypted with LUKS doesn''t ensure that they
    are protected when the system is turned on. LUKS protects your system only when
    it is off (if the partition isn''t mounted in single-user mode). When the system
    has booted and the partition is decrypted (which it has to do to make the data
    accessible), by LUKS. You can use file-based encryption in combination with LUKS
    to provide additional security when the system is on. Later in this chapter, we
    discuss GnuPG, which is an open source file-based encryption using PGP.


