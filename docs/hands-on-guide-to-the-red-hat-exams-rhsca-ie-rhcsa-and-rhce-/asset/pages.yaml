  md: 'Chapter 10: The Kernel


    # WARNING


    When updating a kernel with the rpm command, never use the -U option to update.
    The reason behind this is that the update option erases the prior kernel when
    updating, whereas the -i option installs the newer kernel alongside the old kernel.
    If something doesn''t work or goes wrong, you have an older kernel to revert to.


    You''ve been warned!


    Regardless of what method you use, when the update of the kernel is complete,
    you should verify that /boot/grub/grub.conf has been updated to stanza with the
    updated kernel and that it is set to boot from it. This should happen automatically
    when updating the kernel via the package manager; however, I recommend that you
    always verify this for yourself (otherwise, your system may boot incorrectly).


