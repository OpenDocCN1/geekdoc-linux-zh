    and RHEL02. You have 2.5 hours to complete this lab.


    **Task 1:** Using RHEL02 as your server, perform a network install of host Client01
    using the FTP protocol. No desktop manager (Gnome or KDE) is required on Client01
    during the installation.


    **Task 2:** Run the t_root_password script on RHEL02. The root password should
    be changed to something random. Recover the root password and change it to SecurePassword.


    **Task 3:** On Client01, change the default system runlevel to 3.


    **Task 4:** Create a new user User03. Give the user any password, but force it
    to expire and be changed on the first login of User03.


    **Task 5:** On RHEL02, output the status of each network service at each runlevel
    to a file called runlevel_stats.


    **Task 6:** On RHEL02, implement the following:


    +   - On /dev/hdb, configure this disk to use LVM and create three logical volumes
    of equal size.


    +   - Give the second logical volume the name backups.


    +   - On /dev/hdc, create the following basic partitions: one partition 3GB in
    size, a swap 2GB in size, and one partition 1GB in size.


    +   - Create ext4 file systems on all created partitions except the swap partition.


    +   - Enable the swap partition.


    **Task 7:** Modify the default timeout for kernel selection during boot to be
    20 seconds. Also, create a second entry in the GRUB config file that allows you
    to boot into single-user mode.'
