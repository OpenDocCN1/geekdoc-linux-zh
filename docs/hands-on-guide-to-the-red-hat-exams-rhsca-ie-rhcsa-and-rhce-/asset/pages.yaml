    sunprpc on /var/lib/nfs/rpc_pipefs type rpc_pipefs (rw)

    /dev/hdb1 on /opt/company_data type ext4 (rw)

    /dev/hdc1 on /opt/backup type ext3 (rw)

    ```


    # Step 4.


    Go through the /etc/fstab file. The file follows this syntax:


    ```

    <device> <mount point> <file system> <mount options>

    <write data during shutdown> <check sequence>

    ```


    # Step 5.


    View the /etc/fstab


    ```

    # cat /etc/fstab

    /dev/vg_rhel01-lv_root / ext4 defaults 1 1

    UUID=5485df3d-7b48-42f1-b3d3-3d844c6560fb / ext4 defaults 1 2

    /dev/vg_rhel01-lv_swap / swap defaults 0 0

    tmpfs /dev/shm tmpfs defaults 0 0

    devpts /dev/pts devpts gid=5,mode=620 0 0

    sysfs /sys sysfs defaults 0 0

    proc /proc proc defaults 0 0

    ```


    The first three fields should be fairly obvious because you have been working
    with them throughout the chapter. The last three require some explaining, though.
    The fourth field defines the options that you can use to mount the file system.
    You have already seen that the default option actually includes many different
    options for the file system. Here is a complete list of all the options available:


    ```

    rw      Mount file system as read/write

    suid Enables running setup and setgid

    dev     Interts devices on the file system

    ```'
  merge: -1
