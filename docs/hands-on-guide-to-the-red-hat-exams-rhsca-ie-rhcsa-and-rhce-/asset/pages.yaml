  md: '# No locked files


    So far, you are doing well with the client being able to connect to the Samba
    server. You need to know that any share that is mounted without being added to
    the /etc/fstab file will be unmounted after the system is rebooted. To remedy
    this situation, you can create an entry in the /etc/fstab file.


    Step 1. Create an entry in the /etc/fstab file:


    ```

    //172.168.1.1/company_data /opt/test cifs user=user01,pass=<password> 0 0

    ```


    Can anyone find a problem with this entry? The problem is that the username and
    password are exposed in clear-text for anyone to see. Another way that you can
    create an entry in the /etc/fstab without exposing credentials is to put the credentials
    inside a file to refer from the /etc/fstab file.


    Step 2. Add the credentials you''d like to use to:


    ```

    # echo "username=user01" > /etc/samba/smbcred

    # echo "password=password" >> /etc/samba/smbcred

    ```


    > EXAM TIP

    Make sure to set the permissions of the /etc/samba/smbcred file properly.


    Step 3. Update the entry in the /etc/fstab file to reflect the changes to how
    the credentials are read:


    ```

    //172.168.1.1/company_data /opt/test cifs credentials=/etc/samba/smbcred 0 0

    ```


    You can use the mount command to unmount the Samba share and reboot the system
    to make sure that the share mounts correctly when the system reboots.


    # Summary


    Samba is great for being able to share files with Windows systems. It also can
    provide a good backup strategy for Windows domain controllers. This chapter showed
    some great benefits, as being able to provide print services and Windows logon
    services. There is a lot of information to take in when learning to configure
    Samba. Luckily, the config file is heavily documented to help you along. In the
    next chapter, we look at FTP servers and clients.'
  merge: -1
