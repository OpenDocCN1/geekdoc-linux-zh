- img_proc: true
  md: 'The first line defines the user who is allowed to log in to the system.

    The second line lists the arguments passed to the VNC server when the

    service starts.


    +   - geometry Defines the size of the viewer when the client connects


    +   -nolisten tcp Denies TCP connections to the VNC server


    +   -nohttpd Denies VNC clients from connecting


    +   -localhost Forces the use of a secure gateway (port forwarding)


    The number that appears (2 in this case) is the number of the session for

    defined user. The VNC server runs on port 5900, but the actual

    port that will be used is 5900 + the number = 5902 in this case.


    # Step 4. Change your config file to the following:


    ```

    # /etc/config/vncservers

    VNCERVERS[2]="helpdesk" -geometry 1024x768 -nolisten tcp -nohttpd

    ```


    # Step 5. Save the file and exit.


    Because you are on a local network, you don''t need to worry about se-

    connections. You will be using the helpdesk user to connect as well.


    # Step 6. Set the password for the helpdesk user to be able to connect with him:


    ```

    # vncpasswd

    Password:

    Verify:

    ```


    # Step 7. Start the VNC server to be able to connect to it:


    ```

    # vncserver :1

    auth: creating new authority file /root/.Xauthority

    ```


    New RHEL0:1 (root)'' desktop is RHEL0:1


    Creating default startup /root/.vnc/xstartup

    Starting applications specified in /root/.vnc/xstartup

    Log file is /root/.vnc/RHEL0:1.log


    This creates the files required for the VNC server because it has now started

    for the first time.


    MIGRATION TIP

    On RHEL5, the VNC has a configuration issue: It will not start the desktop man-

    ager without an edit to the ~/.vnc/xstartup file. To prevent the issue of not
    seeing

    tesktop manager correctly, you need to edit this file.'
