- img_proc: true
  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Guide and Lab Manual


    The options defined within this section apply specifically to the website and
    directory structure, as defined by the Directory option. For the preceding example,
    this means the site located in the /var/www/html directory. If you want to change
    the directory where your site is located, you need to change the DocumentRoot
    option as well as the Directory option. The default option is


    ```

    DocumentRoot "/var/www/html"

    ```


    There is also a way to have multiple sites using virtual hosts, as you see later.
    When your config file is completely set the way you want it, you can use the httpd
    service to test your config file. Using the configtest argument, the service parses
    the config file for any errors and reports back if something is found. It is always
    a good idea to check your config file before trying to use it because it will
    prevent the service from starting if it contains any errors.


    Test the config:


    ```

    # service httpd configtest

    Syntax OK

    ```


    There is another cool option that the httpd service has (many services have it,
    but it is more useful here). Normally, for a service to use a new config file,
    it requires that the service is restarted. This restart actually stops the service
    from running before starting over again. Normally, this isn''t a big deal, when
    hundreds of people are hitting your site, you can afford to have even a two-second
    outage? To circumvent this, you can use the reload argument, which allows the
    main config file to be reread without the actual service being brought down. This
    is why it is important to test your config files.


    To restart the httpd service, use the following command:


    ```

    # service httpd restart

    Stopping httpd: [ OK ]

    Starting httpd: [ OK ]

    ```


    To only reload the service and reread the config file, use this command:


    ```

    # service httpd reload

    Reloading httpd: [ OK ]

    ```


    One other option to keep in mind is the graceful parameter. It restarts the web
    server, allowing it to read the new config file changes without disconnecting
    your currently connected clients. The only downfall here is that the currently
    active connections use the old config file until they terminate their connection
    and reconnect. You can use it as follows:


    ```

    # service httpd graceful

    ```'
