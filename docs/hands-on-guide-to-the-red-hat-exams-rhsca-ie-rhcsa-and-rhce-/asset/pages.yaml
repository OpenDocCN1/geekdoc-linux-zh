  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual


    across the country to reset the server? Before you create any new rules, make
    a copy of your current working iptables rules and name it iptables.bak


    ```

    # cp /etc/sysconfig/iptables /etc/sysconfig/iptables

    ```


    Because you learned about scheduled jobs in Chapter 9, you can put that information
    to good use. Use the following command to schedule a job to replace any changes
    to the iptables with the backup copy you made in a specific amount of time:


    ```

    # echo "mv /etc/sysconfig/iptables.bak /etc/sysconfig/iptables && iptables restart"
    | at +now+20

    ```


    This way, if you locked out, the rules reset themselves after the time threshold
    has been reached. If your rules work correctly, you can just delete the job. Trust
    me: This one is a lifesaver.


    Let''s look at the default firewall rules that we come with Red Hat:


    ```

    # cat /etc/sysconfig/iptables

    # Generated by iptables-save v1.4.7 on Thu Dec 2 15:59:03 2010

    *filter

    :INPUT ACCEPT [0:0]

    :FORWARD ACCEPT [0:0]

    :OUTPUT ACCEPT [22:3572]

    -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT

    -A INPUT -p icmp -j ACCEPT

    -A INPUT -i lo -j ACCEPT

    -A INPUT -p tcp -m state NEW -m tcp --dport 22 -j ACCEPT

    -A INPUT -j REJECT --reject-with icmp-host-prohibited

    -A FORWARD -m physdev --physdev-is-bridged -j ACCEPT

    -A FORWARD -j REJECT --reject-with icmp-host-prohibited

    COMMIT

    # Completed on Thu Dec 2 15:59:03 2010

    ```


    # MIGRATION TIP


    In RHEL5, the default set of firewall rules is completely different! The rules
    have been cut down in RHEL6 to include only an SSH incoming rule. The default
    rules for RHEL5 are as follows:


    ```

    # cat /etc/sysconfig/iptables

    # Manual customization of this file is not recommended.

    *filter

    :INPUT ACCEPT [0:0]

    ```'
