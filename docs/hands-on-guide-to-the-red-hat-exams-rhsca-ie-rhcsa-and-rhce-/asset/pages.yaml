  md: '# Step 1. To remove a logical volume, use the lvremove command:


    ```

    # lvremove /dev/vg_group0/SecretData

    Do you really want to remove active logical volume SecretData?

    [y/n]: y

    Logical volume "SecretData" successfully removed

    ```


    A nice feature about lvremove is that it has a -t option, which allows you to
    test the removal of a logical partition without actually deleting it.

    The commands to remove volume groups and physical volumes also support the -t
    option.


    **WARNING:** Although this advice seems common sense, make sure you back up any
    data before deleting anything within the LVM structure. Removing logical volumes,
    volume groups, and physical volumes is destructive and results in all data loss
    for that object within the LVM structure. The deletion occurs even if there is
    data on any part of the LVM structure.


    Going down the LVM layers, you could also remove the entire volume group if you
    want.


    # Step 2. Use the vgremove command to remove the volume group:


    ```

    # vgremove vg_group01

    Do you really want to remove volume group "vg_group01" containing 1 logical volumes?
    [y/n]: y

    Do you really want to remove active logical volume lvol0? [y/n]: y

    Logical volume "lvol0" successfully removed

    Volume group "vg_group01" successfully removed

    ```


    You can also do both steps in one command using the -f option with vgremove:


    ```

    # vgremove -f vgGroup01

    ```


    # Step 3. Verify the changes:


    ```

    # vgdisplay vg_group01

    Volume group "vg_group01" not found

    ```


    You should no longer see vg_group01 (as displayed here). At the last layer are
    the physical volumes, which you can remove with pvremove command. Using this command
    completely wipes all LVM metadata (essentially the whole disk drive).


    # Step 4. Wipe all current physical volumes:


    ```

    # pvremove /dev/hdb

    Labels on physical volume "/dev/hdb" successfully wiped

    ```


    ```

    # pvremove /dev/hdc

    Labels on physical volume "/dev/hdc" successfully wiped

    ```'
