  md: '# Virtualization with KVM


    Kernal-based Virtualization Module (KVM) is a kernel module built for RHEL6. Because
    support for KVM is officially built in to RHEL6 kernel only, if you''re still
    on RHEL5, you need to upgrade before proceeding in this chapter. KVM can be used
    to create and manage virtual machines built on the physical host as well. This
    capability is useful for consolidating servers and keeping costs down. There is
    also a security and ease of management benefit. Although the Red Hat exams don''t
    require you to know virtualization in depth, there are some basic requirements.
    This chapter covers the basics of setting up a physical host and creating virtual
    machines. We also look at how to manage virtual resources.


    # Working with Virtual Machines


    When choosing a system to serve as your physical host for any number of virtual
    clients, you need to do some planning. Your host system requires enough resources
    to support itself and the virtual machines. Ensure that you have sufficient CPU
    processing power, memory, and storage space. You need to plan how many virtual
    machines you''d like to build on top of your host and scale your physical host
    system accordingly.


    # Setting Up the Physical Host


    The creation of virtual machines is done through the use of a hypervisor. This
    hypervisor allows the sharing of resources between the physical and virtual systems.
    In RHEL6, the KVM hypervisor requires a 64-bit host system with the correct extensions
    (Intel 64 or AMD64).


    When you''re getting started with virtualization, there are a few packages that
    need to be installed (and many different ways to do it). If you install Red Hat
    from the DVD, you can select the Virtual Host option to install the required packages
    automatically. If you''re installing from a kickstart file, you can use the kvm
    directive to accomplish the same thing. Another option is to install the files
    from the repositories as normal if your installation is already in place.'
  merge: -1
  pgno: 452
- img_proc: true
  md: 'WARNING: You won''t receive any updates from Red Hat unless you have a virtual-ization
    entitlement license.


    NOTE: Because you are using virtual machines already emulate the lab, you won''t
    be able to follow along with the commands in this chapter unless you have a separate
    side machine lying around.


    To start, install the required packages for KVM:


    ```

    # yum install -y python-virtinst libvirt virt-manager libvirt-client

    libvirt-client-0.8.1-27.el16.x86_64

    libvirt-0.8.1-27.el16.x86_64

    python-virtinst-0.500.3-7.el16.noarch

    libvirt-python-0.8.1-27.el16.x86_64

    virt-manager-0.8.4.8-8.el6

    ```


    Verify that the packages were installed correctly:


    # Installing a Virtual Client


    If you''ve worked in VMware or VirtualBox before, at this point you''re probably
    thinking of looking for the GUI to set up your clients. For purposes of this chapter,
    first install the client from the command line and then do it again using the
    GUI front end. Using KVM from the command line makes for easier administration
    (mostly because you can automate processes through scripts). Using the virt-install
    command, you can create, manage, and automate the virtual machines.


    Syntax: virt-install — name NAME ram RAM STORAGE INSTALL [options]


    One problem is that there are tons of options for the command, so there is not
    enough room to list them all. For a complete list of options, use the following:


    ```

    # virt-install -help

    ```


    This command can be used interactively or through scripts, making it easier to
    create virtual guests. Aside from the virt-install command, you can also use virt-manager,
    which can accomplish many of the tasks. This GUI virt-manager utility (front end)
    is used to create virtual guests. If you have an aversion to the command line,
    you can use virt-manager to achieve the same results. Regardless of which method
    you use, there are a few things that remain constant. You can install virtual
    guests just as you would any normal physical host: through local installation
    media, network installation, or PXE.'
