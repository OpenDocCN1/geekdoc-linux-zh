    When you''re comfortable working with processes, you can then make some advanced
    adjustments, such as changing the priority of a particular process. Let''s say
    that you use a custom application running on your system. You can use the renice
    to give that particular process higher priority on the CPU.


    Syntax: renice <priority> [options]


    Options:


    +   - p PID Changes process priority for a particular PID

    - u user Changes process priority for a particular user


    The priority values range from -20 (first priority) to 20 (dead priority). Only
    the root user may set processes to use a priority under 0. Going back to the example,
    you can give the application extra priority by using the following:


    ```

    # renice -2 3874

    ```


    This command changes the application process (3874) to better priority than its
    default priority of 0. Knowing how to work with system processes and extract information
    from your system will help you become a better system administrator. It can also
    help you troubleshoot faster on the Red Hat exams.


    In the next section, we look at job scheduling, which can be combined with some
    of the commands just covered to automate system monitoring.


    # Automation with cron and at


    In any operating system, it is possible to create jobs that will reoccur. This
    process, known as job scheduling, is usually based on user-defined jobs. For Red
    Hat, this process is handled by the cron service, which can be used to schedule
    tasks (also jobs). By default, Red Hat comes with a set of predefined jobs that
    occur on the system (hourly, daily, weekly, monthly, and with arbitrary periodicity).
    As an administrator, however, you can define your own jobs and allow your users
    to create them as well.


    Step 1. the cron package is installed by default, check to make sure it is installed
    on your system:


    ```

    # rpm -qa grep cron

    cron-1.4.4-2.el16.x86_64

    cron-anacron-1.4.4-2.el16.x86_64

    crontabs-1.10-32.1.el16.noarch

    ```'
