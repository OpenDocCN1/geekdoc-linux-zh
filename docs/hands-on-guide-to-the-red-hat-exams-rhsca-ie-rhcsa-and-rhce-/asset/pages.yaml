  md: '```

    # Install the Base and Core software packages, plus OpenSSH server & client

    # This is the bare minimum for a system to run (with remote access via SSH)

    %packages

    @Core

    @Base

    openssh-clients

    openssh-server

    ```


    Kickstart file is well documented, so it should be fairly easy to understand what
    is going on. I also don''t use any kind of complex partitioning, making the partition
    layout easier to understand. In the last section, you can also see that you are
    only going to be installing enough packages to get the system up and running and
    nothing more. By doing this, you provide a faster install after aren''t many packages
    to install first of all, and if you ever decide that you need a package that you
    left out, you can always install it later. After you generate an encrypted password
    and replace it in the appropriate line, this kickstart file will provide you with
    a basic setup for a client using your kickstart server.


    One great benefit of using the kickstart system is that you can have your kickstart
    execute scripts upon completing the installation of your system. At the end of
    your kickstart file, you would define a %post section. Anything in the %post section
    is treated as if you were typing it at the console of a system. You can perform
    customizations or execute other scripts for further configuration of your system.%post
    is usually a more useful section because the system is already installed, you
    should know that there is also a %pre section that is executed before the installation
    begins.


    Kickstart enables you to create more advanced partitions. In the kickstart file,
    you need to use the commands outlined in the web page mentioned earlier to carve
    out drives and create your advanced partitions. As an example, let''s create LVM
    partitions for the client.


    This is an excerpt from another kickstart file I have:


