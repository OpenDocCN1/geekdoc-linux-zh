    Let’s now focus to FTP host-based and user-based security.


    # FTP Security


    After you configure SELinux for the vsftpd service, you should also con-figure
    some basic security. When dealing with security for FTP, you can run into a\little
    trouble if you don’t plan things ahead of time.


    The FTP protocol supports two different types of file transfers. The first is
    known

    as active mode, which uses port 20 to connect back to the client. The second is

    as passive mode, which uses a custom-defined range of ports over 1024.

    Because there are two different modes for FTP, you need to decide which mode

    you to use so that you can configure the correct security settings and open

    the correct ports on firewall. Back in the configuration section, the option

    connect_from_port_20 is set to YES by default. This means that, by default, active

    mode is used for the vsftpd service.


    Look at some other options that can be used for security. You can disable

    an anonymous_enable option to prevent unauthorized users from accessing the

    FTP server. The local_enable option, which is enabled by default, allows local

    system users to log in to FTP server. Keeping this option is usually safe option

    so that you don’t need to maintain a second list of users who want to be able
    to

    log in the FTP server.


    There is one other security step you should take for the FTP server.

    userlist_enable option, which is set to YES by default, allows the vsftpd service
    to

    cult the /etc/vsftpd/user_list file. When this option is used in conjunction

    t userlist_deny option, all users in this are denied access to the server and

    ot even prompted for a password. This prevents them from submitting clear-text

    passwords over the network. If you want to change this setting, you could\yset
    the userlist_deny option to NO. All users except those listed in

    /etc/vsftpd/user_list are denied access. This is useful if you want select

    individuals to be able to log in and not all your system users.


    Here is what the file contains by default:


    ```

    # cat user_list

    # vsftpd_deny=NO, only allow users in this file

    # userlist_deny=YES (default), never allow users in this file, and

    # do not even prompt for a password.

