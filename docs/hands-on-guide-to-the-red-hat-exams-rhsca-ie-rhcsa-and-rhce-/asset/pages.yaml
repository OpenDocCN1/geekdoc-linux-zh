  md: '# Chapter 9: System Logging, Monitoring, and Automation 29


    The /etc/at.allow file:


    +   - If it exists, only these users are allowed (at.deny is ignored).

    - If it doesn''t exist, all users except at.deny are permitted.


    The /etc/at.deny file:


    +   - If it exists and is empty, all users are allowed (Red Hat default).


    For both files:


    +   - If neither exists, root only.


    The at service also includes a single command, at, that is used to set up the
    jobs you want to run.


    Syntax: at [options]


    Options:


    +   - - Lists all jobs in the queue

    - d ID Removes a job from the queue

    - -m Sends mail to the user when the job is complete

    - f FILE Reads input from the file

    - -v Shows the time the job will be executed


    The at command enables you to specify a time in many different formats, making
    it really flexible. Let''s look at a few examples of the time formats you can
    use:


    ```

    # at 9am

    # at now + 3 days

    # at 1:30 3/22/10

    ```


    After you specify a time, your command prompt changes:


    ```

    # at 10:07am

    at>

    ```'
