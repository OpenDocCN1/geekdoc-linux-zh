  md: '# Summary


    Creating partitions is a key part to system management. You need to understand
    how to plan ahead and create custom partition layouts on systems as well as how
    to create the partition scheme you have designed. It is also important to understand
    the usefulness of RAID and LVM, along with how to implement them properly. These
    can both be very powerful tools when used correctly. The next chapter explains
    how to create file systems on your partitions, which allow them to become usable
    to the rest of the system.


    # Review Questions


    +   1. What option is used with both the fdisk and parted commands to display
    the current partition tables?

    2. What does the partprobe command do?

    3. Do you need to write changes to the disk when using the parted command? What
    about fdisk?

    4. What are the three different types of RAID described in this chapter?

    5. What command can you use to query information from the kernel about RAID arrays?

    6. Can you put your /boot partition on a RAID 5 array?

    7. What are the three items that make up LVM?

    8. What are the side effects of shrinking a volume group or logical volume?

    9. What is the biggest benefit of using LVM over basic partitions?

    10. What command can you use to get information about logical volumes?


    # Answers to Review Questions


    +   1. The print option is used with both the fdisk and parted commands to display
    the current partition tables.

    2. The partprobe command forces the kernel to reread the partition table. You
    should always call it after making any changes to your system partitions.

    3. When you exit the parted utility, all your changes are automatically written
    to disk. With the fdisk command, you need to manually write your changes for disk
    to take effect.

    4. RAID 0 (Striping), RAID 1 (Mirror), and RAID 5 (Striping with parity).

    5. cat /proc/mdstat'
