  md: '# What to Do When a Disk Fails


    Suppose that a disk in the array failed. In that case, you need to remove that
    disk from the array and replace it with a working one. You do have extra disk
    drives, right? You can manually fail a disk to see what it would be like if a
    disk failed in the array.


    Step 1. To fail a disk in the array, use this command:


    ```

    # mdadm /dev/md0 -f /dev/hdd1

    mdadm: set /dev/hdd1 faulty in /dev/md0

    ```


    Step 2. Verify that the disk in the array has failed by looking at the details
    of the RAID array:


