    # Mastering Kickstart Config Files


    Building a kickstart file can be fairly easy, until something goes wrong. The
    one thing I will say is that it requires trial and error to get everything that
    you want to. Before we go any further, though, bookmark the following page:


    > http://docs.redhat.com/docs/en-US/Red_Hat_Enterprise_Linux/6/Installation_Guide/si-kickstart2-options.html


    This page provides the best reference on kickstart files, along with the syntax
    and a description of each option. I didn’t include it here because the page is
    huge and it is better to always have an updated version online anyway.


    Let’s look at a sample kickstart file and redhat-base.cfg


    ```

    # cat /var/www/pub/kickstart/redhat-base.cfg

    ```


    ```

    # Tells kickstart to start the install

    install

    ```


    ```

    # Specifies the language

    lang en_US.UTF-8

    ```


    ```

    # Specifies the keyboard layout

    keyboard us

    ```


    ```

    # Skip Red Hat key input

    ```'
