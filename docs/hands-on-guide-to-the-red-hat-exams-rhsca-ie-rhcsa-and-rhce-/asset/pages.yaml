  md: '# Hands-on Guide to the Red Hat® RHCSSA™ and RHCE® Cert Guide and Lab Manual


    ```

    key --skip

    ```


    # Forces the text install to be used (saves on time because a GUI doesn''t need

    to be loaded)


    text


    # Skips the display of any GUI during install

    skipx


    # Used with an HTTP install to specify where the install files are located

    url --url http://172.168.1.1/pub/


    # Assign the client a static IP upon first boot & set the hostname

    network --device eth0 --hostname Client --bootproto dhcp


    # Set the root password

    rootpw --iscrypted <encrypt_password>


    # Enable the firewall and open port 22 for SSH remote administration

    firewall --enabled --port=22:tcp


    # Setup security and SELinux

    authconfig --enableshadow --enablemd5

    selinux --permissive


    # Set the timezone

    timezone --utc America/New_York


    # Create the bootloader in the MBR with drive sda the drive to install it on

    bootloader --location=mbr --drive=hda


    # Wipe all partitions and build them with the info below

    ***hda may be different depending on the type of drives you use***

    clearpart --drives=hda --all --initlabel


    # Create a 100MB /boot partition

    part /boot --fstype ext3 --size=100


    # Create a 5GB / partition

    part / --fstype ext3 --size=5000


    # Create a 2GB swap

    part swap --size=2000


    # Use the rest of the free space on disk to create the /home partition

    part /home --fstype ext3 --size=100 --grow'
