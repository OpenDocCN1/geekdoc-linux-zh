    This file definitely needs some explaining. The first main section is all information
    required for a package, which you already saw in this chapter when you queried
    information from a package. The Source and BuildRoot are both significant because
    they play a role in how the package is built. The Source is the archive file that
    the package will use; in this case it is named after the myfile.tar.gz file created
    and moved into the SOURCES directory. BuildRoot is the directory that will be
    used to actually build the software (you could use the BUILD directory as well).


    The rest of the spec file contains sections defined with a %. First up is the
    %description section, which provides a description for the package you are trying
    to build (as I''m sure you guessed). The %prep and %setup sections both move the
    SOURCE into the BUILD directory and decompress the file archive. The -n option
    specifies the name of the directory that will be entered into upon decompression.
    The %install section is normally the place where your software is compiled and
    installed on your current system. When it is installed, the files need to be collected
    so they can be deployed via the package you are building, which leads to the %files
    section. Here, you need to include any file that you wanted in your package. Any
    directory you specify here includes all files and subdirectories below it as well.
    Because you are building a package with only a few files, you can just specify
    the directory previously created (/opt/sample_pkge) in the %install section.'
