  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    Step 2. Uncomment the following lines:


    ```

    MOUNT_NFS_V1="no"

    MOUNT_NFS_V2="no"

    MOUNT_NFS_V3="no"


    RPCNFSRDARGS="-N 2 -N 3"

    ```


    The first three lines disable the mount daemon from accepting anything below version
    4. The last line disables the NFS service from even adver-tising using version
    4 as well.


    # MIGRATION TIP


    If you are on RHEL5, there is an unresolved bug that causes strange errors if
    you disable all versions of the mount daemon from being advertised. For RHEL5,
    I recommend uncommenting only the following lines:


    ```

    MOUNT_NFS_V1="no"

    MOUNT_NFS_V2="no"

    ```


    Step 3. Save the file and exit.


    Next, let work with the /etc/exports file because this defines re-sources will
    be available to your clients. If the file does not exist already, you can create
    it. The syntax of the /etc/exports file is <mountpoint><host<permissions/options>>


    > WARNING: There is no space between the <host> field and the <permissions/options>
    field. If you include a space, you receive a syntax error and the resource will
    not export properly.


    Mount Options:


    +   - rw Sets read/write permissions

    - ro Sets read-only permissions

    - insecure Allows the use of ports over 1024

    - sync Specifies that all changes must be written to disk before a command completes

    - no_wdelay Forces the writing of changes immediately (useful for logs if something
    crashes)

    - root_squash Prevents root users'
