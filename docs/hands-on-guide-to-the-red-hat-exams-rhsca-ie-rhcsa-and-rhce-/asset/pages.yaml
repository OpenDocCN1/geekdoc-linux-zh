    # Advanced Networking


    We have already looked at the basic steps to configuring networking. As mentioned
    previously, you can edit the network interface config files to fine-tune the network
    settings (such as adjusting speed, duplexing, and more). One networking topic
    we look at is Ethernet bonding.


    # Ethernet Bonding


    Ethernet bonding is used to combine multiple interfaces into one, creating an
    increase in available bandwidth and redundancy. This is done by creating a special
    network interface file called a channel bonding interface. Because you are in
    a environment using virtual network interfaces, there really isn''t any additional
    bandwidth benefit, but redundancy is always good. You need to create a third network
    interface on your RHEL01 virtual system before you create your bonded interfaces.


    **Step 1.** Enable the bonding kernel module:


    ```

    # nano /etc/modprobe.d/bond.conf

    Alias bond0 bonding

    ```


    **Step 2.** Create the bond interface config file in the /etc/config/network-scripts
    directory:


    ```

    # nano /etc/config/network-scripts/ifcfg-bond0

    DEVICE="eth0"

    IPADDR=172.168.1.1

    NETMASK=255.255.255.255

    ONBOOT=yes

    BOOTPROTO=none

    USERCTL=no

    BONDING_OPTS="primary=eth1"

    ```


    Now that the bond interface is set up and the kernel module is loaded, you need
    to assign which interfaces will be added to the bond interface (in this case,
    eth1 and eth2).'
