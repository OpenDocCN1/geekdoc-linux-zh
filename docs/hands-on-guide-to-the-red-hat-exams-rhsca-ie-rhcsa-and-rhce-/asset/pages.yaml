  md: '# SELinux


    Security Linux (SELinux) is another layer of security for the Linux operating
    system. Developed by the National Security Agency (NSA), it adds protection for
    different files, applications, processes, and so on. Many users who are just starting
    out need to turn off SELinux because it is a complex system that can take much
    time and effort to get used to. Instead of turning it off, you could use SELinux
    in “missive” mode, which allows everything to function normally but logs warnings
    when actions or commands would have been blocked. Running in this mode is good
    for troubleshooting and gaining an understanding of how SELinux works. For the
    Red Hat Exam, however, you need to know how to work with SELinux enabled and enforcing.


    # Understanding SELinux


    As already stated, SELinux can be quite complex. Let’s start with some of the
    basics to understanding SELinux. It can run in three different modes:


    +   - disabled SELinux is turned off and doesn’t restrict anything.

    - permissive SELinux is turned on, but it logs warnings only when an action normally
    would have been blocked.

    - enforcing SELinux is turned on and blocks actions related to services.


    Aside from these three modes, there are numerous commands that you can use for
    the management of SELinux:


    +   - sestatus Shows the current status of SELinux

    - getenforce Shows the enforcing status of SELinux

    - setforce Changes the enforcing status of SELinux

    - getbool Returns the Boolean value of a service option

    - setbool Sets the Boolean value of a service option

    - chcon Changes the context of a file, directory, or service

    - restorecon Resets the context of an object'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual


