  md: '# ## SELLinux Troubleshooting


    When you''re troubleshooting SELinux issues, there are a few packages that you
    should install first:


    ```

    # yum install -y policycoreils-python policycoreils selinux-setroubleshoot-server

    ```


    You will also find the following two log files handy:


    | /var/log/audit/audit.log | Logs SELinux denials |

    | /var/log/messages | Logs SELinux denials |


    Each log file provides specific error messages when denials occur, making easier
    to search using grep. Two common commands you can use to hunt for error messages
    include


    ```

    # grep "SELinux is preventing" /var/log/messages

    # grep "denied" /var/log/audit/audit.log

    ```


    Problems can arise in SELinux for numerous reasons. However, the top three include


    +   **Labeling problems**—Using a nonstandard directory tends to cause problems
    if the directory or files aren''t labeled


    +   **Correct context**—When you''re moving files, they can lose or retain incorrect
    contexts, causing access errors. Use the matchpathcommand to verify the correct
    context.


    +   **Confined service**—If certain Booleans are not enabled, a service may have
    trouble operating or communicating with other services.


    # Policy Violations


    If you are having trouble with Booleans and need to determine what a specific
    Boolean does, you can use the semanage command as you saw earlier.


    To list all the Booleans with their current values and a brief description, use
    the following:


    ```

    # semanage boolean -1

    SELinux boolean

    ```


    | ftp_home_dir | -> off | Allow ftp to read and write files in |

    | smarton_2ware | -> off | Enable additional permissions needed |

    | xdm_sysadm_login | -> off | Allow xdm logins as sysadm |

    | xen_use_nfs | -> off | Allow xen to manage nfs files |

    | mozilla_read_content | -> off | Control mozilla content access |

    | [Output Truncated] |'
