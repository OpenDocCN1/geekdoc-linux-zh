    # Connecting Clients


    Setting up a client to use NFS is relatively simple when you have the NFS server
    in place. Let''s set up the Client01 system to use a share on the RHEL01 NFS server.


    +   Step 1. To start, you need to install the required packages:

    # install -y nfs-utils nfs4-acl-tools


    ```

    # install -y nfs-utils nfs4-acl-tools

    ```


    These two packages include the necessary files for you to connect to the NFS server
    and use the exported resources. On the client side, you will need the rpcbind
    service running to mount NFS resources on the server.


    +   Step 2. Ensure that the required service is set to start on boot:

    # chconfig rpcbind on


    ```

    # chconfig rpcbind on

    ```


    You can now create some directories to hold the NFS shares on the local system.


    +   Step 3. Create two local directories:

    # mkdir /mnt/{company_data,temp}


    ```

    # mkdir /mnt/{company_data,temp}

    ```


    +   Step 4. Mount the company_data NFS share:

    # mount -t nfs fsvers=4 172.168.1.1:/opt/company_data /mnt/company_data


    ```

    # mount -t nfs fsvers=4 172.168.1.1:/opt/company_data /mnt/company_data

    ```


    > MIGRATION TIP

    RHEL5, the mount command uses NFS version 3, so you need to specify the version.
    You would use the following command instead:

    # mount -t nfs fsvers=4 172.168.1.1:/opt/company_data /mnt/company_data

    nRHEL6, version 4 is used by default, so there is no need to specify.'
