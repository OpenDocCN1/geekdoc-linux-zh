- img_proc: true
  md: '# REAL-WORLD TIP


    Red Hat recommends that you use the /var/lib/libvirt/images directory to hold
    the virtual guest image files. These image files are the virtual disks used to
    run each virtual. You can also store ISO files here for local installation. This
    location is preconfigured for SELinux, so any other location requires a custom
    written within SELinux to work (which beyond the scope of this book).


    Let’s create a single virtual guest using virt-install:


    ```

    # virt-install --name Client03 --ram 512 --disk path=/var/lib/libvirt/images/client03.img,size=8
    --network network=default --cdrom /dev/cdrom

    ```


    This looks like a lot to take in for once; however, it is quite simple when you
    break down the parts. This command creates a virtual guest named Client03 with
    512GB of memory and 8GB of storage. The network interface is set to default (which
    is the first virtual adapter), and the installation occurs from the DVD mounted
    on /dev/cdrom. Remember that you can also use the virt-manager utility if you
    are more comfortable with a graphical interface.


    Give your virtual guest name and choose the install media, as shown in Figure
    22-1.


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_454_0.png)


    Figure 22-1 Choosing a name.


    Provide a storage path to the virtual disk (see Figure 22-2).'
