  md: '# 254 Hands-on Guide to the Red Hat® RHCSSA™ and RHCE® Cert Guide and Lab Manual


    # Creating cron Jobs


    The default setting for Red Hat allows any user to create a cron job. As the root
    user, you also have the ability to edit and remove any cron job you want. Let''s
    jump into creating a cron job for the system. You can use the crontab command
    to create, edit, and delete jobs.


    Syntax: crontab [-u user] [option]


    Options:


    +   -e Edits the user''s crontab


    +   -l Lists the user''s crontab


    +   -r Deletes the user''s crontab


    +   -i Prompts before deleting the user''s crontab


    Before you start using the crontab command, however, you should look over the
    format it uses so you understand how to create and edit cron jobs. Each user has
    their own cron file in /var/spool/cron (the file for each user is created only
    after the user creates their first cron job), based on the username of each user.
    Any “allow” actions taken by cron service are logged to /var/log/cron.


    View the /etc/crontab file to understand its syntax:


    ```

    # grep ^ /etc/crontab

    # For details see man 4 cron jobs

    # Example of job definition:

    # | minute (0 - 59)

    # | hour (0 - 23)

    # | day of month (1 - 31) OR jan,feb,mar,apr *

    # | month (1 - 12) OR day of week (0 - 6) (Sunday=0) OR sun,mon,tue,etc.,

    # | * * * * command to be executed

    ```


    This file spells out the values that can exist in each field. You must make sure
    you provide a value for each field; otherwise, the crontab will not be created.
    You can also define step values by using */<number to step by>. For example, you
    could put */5 in the month field to mean every fifth minute.


    The best way to understand these fields is to create a crontab file and make some
