  md: '# REAL-WORLD TIP


    In the real world, you will work with firewall rules constantly. One important
    point to remember is when testing firewall rules, you will not always be in front
    of the system you''re working on. When tuning or creating your rules, you need
    to be careful that you don''t create a rule that will lock out of your system!
    Nothing is worse than tuning a rule and saving it, only to realize later you have
    now locked yourself out of the system and need to drive three hours to your disaster
    recovery site because you can''t get access to your server!


    # Troubleshooting Firewall Rules


