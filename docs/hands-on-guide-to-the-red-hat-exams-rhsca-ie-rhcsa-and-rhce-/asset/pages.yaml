  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual


    # Firewall and SELinux Configuration


    NFS is one of the many Red Hat services that can take advantage of TCP Wrappers
    as well as firewall rules for security. We don''t use TCP Wrappers here, but should
    you run into trouble on the NFS service working, don''t forget to check whether
    anything is being filtered by TCP Wrappers. Because you are using NFS version
    4 here, you need to create only a single firewall rule.


    +   Step 1. Use iptables to create the additional firewall rules:


    ```

    # iptables -I INPUT 5 -p tcp -m tcp --dport 2049 -j ACCEPT

    ```


    +   Step 2. Save the firewall rules you created:


    ```

    # service iptables save

    Saving firewall rules to /etc/sysconfig/iptables: [ OK ]

    ```


    +   Step 3. Restart the iptables service:


    ```

    # service iptables restart

    iptables: Flushing firewall rules: [ OK ]

    iptables: Setting chains to policy ACCEPT: [ OK ]

    iptables: Unloading modules: [ OK ]

    iptables: Applying firewall rules: [ OK ]

    ```


    > WARNING: According to Red Hat''s documentation, NFS version 3 is the default
    on RHEL5 (this isn''t the case with later versions of RHEL5) to stay with NFS
    version 4, you need to statically define ports in the /etc/sysconfig/nfs file
    for each of the four daemons required for the NFS service to run. You also need
    to add these ports to the /etc/services file and create a firewall rule for each
    one. For all this trouble, you are better off using NFS version 4 instead.


    Each step of NFS can vary slightly based on other firewall rules and security-restrictions
    that you might have in place, so testing with these options will help.


    # Expert Tip


    If are using NFS version 4 and having issues with firewall rules, you can take
    the following steps:


    +   Step 1. Define static ports in /etc/sysconfig/nfs for each of the four required
    da-mons NFS us.

    Step 2. Create a firewall rule for the rpcbind service (TCP and UDP port 111).

    Step 3. Create a firewall rule for the MOUNT_PORT you specified (TCP and UDP).

    Step 4. Create a firewall rule for the STATD_PORT you specified (TCP and UDP).

    Step 5. Create a firewall rule for the LOCKD_TCPPORT you specified (TCP).

    Step 6. Create a firewall rule for the LOCKD_UDPPORT you specified (UDP)'
