  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    **Step 1.** Edit the ~/.vnc/xstartup file to uncomment the first two lines:

    ```bash

    # nano -/.vnc/xstartup

    # Comment the following two lines for normal desktop:

    unset SESSION_MANAGER

    exec /etc/X11/xinit/xinitrc

    ```


    At this point, you need to restart the VNC server session for the changes to take
    effect.


    **Step 2.** Kill the current VNC session:

    ```bash

    # vnncerver -kill :1

    Killing Xvnc process ID 12865

    ```


    **Step 3.** Start a new session:

    ```bash

    # vnncerver :1

    auth: creating new authority file /root/.Xauthority

    ```


    RHEL02:1 (root)'' desktop is RHEL02:1


    Creating default startup script /root/.vnc/xstartup

    Starting applications specified in /root/.vnc/xstartup

    Log file is /root/.vnc/RHEL02:1.log


    At this point, your VNC server should be running properly, but you also need to
    make sure that you created a firewall rule for the port that the VNC server is
    using. I don''t show how to create one here because you will use a different port
    for setting up your VNC server.


    # Connecting Clients


    So far, you have set up a VNC server on RHEL02 and also created a firewall allowing
    you to gain access to the system. All that is left to do at this point is connect
    from a client system. You can install the client package on Client02 and get the
    connection through.


    +   **Step 1.** Install the VNC package that contains the client software to connect:

    ```bash

    # yum install -y tigervnc

    ```


    +   **Step 2.** Verify that the package was installed successfully:

    ```bash

    # rpm -qa | grep tiger

    tigervnc-1.0.90-0.10.20100115svn3945.el16.x86_64

    ```


    +   **Step 3.** At this point you can use the vncviewer command to connect to
    the VNC server:

