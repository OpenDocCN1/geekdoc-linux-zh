    # Managing Password Policies


    Ensuring that a good password policy is in place helps easy administration of
    your system. It prevents break-ins and brute-force attacks on account passwords.
    There are few different ways you can manage the password policies on your system.


    +   **Step 1.** Look at the /etc/login.defs file, which controls password length,
    age, and expiration:


    ```

    # cat /etc/login.defs

    # Password aging controls:

    # PASS_MAX_DAYS Maximum number of days a password may be used.

    # PASS_MIN_DAYS Minimum number of days allowed password changes.

    # PASS_MIN_LEN Minimum acceptable password length.

    # PASS_WARN_AGE Number of days warning before a password expires.

    PASS_MAX_DAYS 99999

    PASS_MIN_DAYS 0

    PASS_MIN_LEN 5

    PASS_WARN_AGE 7

    ```


    Next, turn your attention back to PAM for a moment. Both the pam_cracklib and
    pam_pwquality modules are used in enforcing password length and complexity. Already
    defined by default as part of the password requirements, the pam_cracklib module
    can be changed to enforce stricter requirements.


    +   **Step 2.** View the current pam_cracklib policy:


    ```

    password pam_cracklib.so try_first_pass retry=3 type=

    ```


    You can add additional parameters to increase (or decrease) the complexity and
    length of the password. You can''t, however, take all the options available at
    face value. You can gain "credit points" by using complexity within your password.
    For example, if the minlen option is set to 6, you can have a four-character password
    with one uppercase character and one number, giving you two additional'
