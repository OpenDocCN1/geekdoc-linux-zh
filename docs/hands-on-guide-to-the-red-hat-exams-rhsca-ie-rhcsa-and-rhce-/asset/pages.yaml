    Finally, you should also know how to look through the documentation for a given
    package. This documentation is known as a package''s man pages, and most packages
    contain it. To access the man pages, use the man command:


    ```

    # man nano

    ```


    Scroll up and down to view the documentation and press q to quit. Usually, the
    man pages provide in-depth details, usage, and examples for any given package.
    Working with the man pages is very important, especially for the Red Hat customers.
    You will not be able to remember every command option or every aspect of the syntax,
    and being able to find what you''re looking for through the use of the man pages
    is very helpful.


    # REAL-WORLD TIP


    For the curious, you can also take RPM packages apart to obtain individual files
    from them. To extract the contents of an RPM package, use the rpm2cpio command:


    ```

    # rpm2cpio <package> | cpio -id

    ```


    This capability is useful if a single file is corrupted, and you need to replace
    it but don''t want to install/uninstall/reinstall the entire package.


    # Doing It Again with Yum


    In the previous section, we discussed software and package management with the
    rpm command. In this section, we look at the exact same tasks, except this time
    we use the more flexible yum utility. The yum command has access to repositories
    where tons of packages are kept and can install, upgrade, or remove them for you
    automatically. Yum also takes care of resolving and installing all dependencies
    for you, which the rpm command can''t do. We go through all the commands we did
    with rpm.


    Syntax: yum [options] command


    Options:


    +   -c Specifies the location of the config file


    +   -q Specifies quiet, no output


    +   -y Indicates to always answer yes to prompts


    +   -v Provides verbose output'
