    drwxr-xr-x user0 root unconfined_u:home_r:home_s

    drwxr-xr-x user0 root unconfined_u:home_r:home_s

    drwxr-xr-x user0 root unconfined_u:home_r:home_s

    ```


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_261_0.png)


    Figure 11-1 Files, directories, and services all have contexts.


