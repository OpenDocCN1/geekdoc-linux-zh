  md: '# Runlevels


    When the system boots up, it queries for the default runlevel, which is defined
    in the /etc/initabb file. When that default runlevel is located, the system boots
    into that particular runlevel. The different runlevels are essentially “states”,
    which allow services to be started or stopped depending on the runlevel you are
    in. There are six runlevels in total, which are shown in the /etc/initabb file.
    Each runlevel also has a directory called /etc/rc.d/rc#, where # is the runlevel
    (from 0 to 6). These different directories contain scripts to tell the system
    which services should be started or stopped at the particular runlevel. Let''s
    look at the different runlevels:


    +   0 Halt

    1 Single-user mode

    2 Multiuser with partial services

    3 Full multiuser with networking (text mode)

    4 Not used

    5 Full multiuser graphical mode (provides a GUI desktop login)

    6 Reboot


    The easiest runlevels to understand are 0 and 6. These two runlevels are called
    by the same command with different input. In runlevel 0, essentially the system
    is off (the powered off “state” if you will). In runlevel 6, the system is restarting
    (the reboot “state”). Runlevel 1 is used to enter single-user mode, which you
    would enter if there are issues with the system and you''d like to perform maintenance.
    You can also reset the root user''s password in this runlevel. The remaining runlevels—2,
    3, and 5—provide various states for services to run in. There is also a runlevel
    4, but it is unused. The best way to get a feel for what is started in each of
    these runlevels is to look in the /etc/rc.d/rc# directory for each runlevel. These
    directories contain files that define whichservices should be started or stopped.
    These files actually soft to the service init scripts on the system. Don''t forget
    that Upstart is the program that actually starts and stops services at each runlevel.
    The /etc/init/rc.conf files show how each set of scripts is called:


    ```

    # cat rc.conf

    # rc - System V runlevel compatibility

    #n# This task runs the old sysv-rc runlevel scripts. It

    # is usually started by the telinit compatibility wrapper.

    ```


    start on runlevel [@123456]'
