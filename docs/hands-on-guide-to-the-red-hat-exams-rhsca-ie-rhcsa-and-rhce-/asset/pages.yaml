    # # Logical Volume Manager


    LVM is a form of advanced partition management. The benefit to using LVM is ease
    of management due to the ways disks are set up. With LVM, however, is one of the
    more complex tasks to understand the first time you deal with it. After you have
    some practice, you will find LVM makes life easier. When you set up your system
    for the first time, you have a certain number of physical disks (the lab has four
    for this book). These physical disks are the base of the LVM structure and referred
    to as physical volumes. The next layer in the structure is volume groups, where
    physical volumes are combined into a single pool of storage. The final layer in
    the structure is logical volumes, which are the actual partitions on the system.


    # # GENERAL INFO


    Aside from physical disks, a partition can serve as a physical volume as.'
