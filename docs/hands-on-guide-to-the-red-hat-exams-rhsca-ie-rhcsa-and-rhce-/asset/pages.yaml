  md: '# Step 3.


    Because you don''t want to search this file or it every time you need to view
    the mounted file systems, you can use the mount command with no options to also
    view the currently mounted file systems:


    ```

    # mount

    /dev/vg_rhel01-lv_root on / type ext4 (rw)

    proc on /proc type proc (rw)

    sysfs on /sys type sysfs (rw)

    devpts on /dev/pts type devpts (rw,gid=5,mode=620)

    tmpfs on /dev/shm type tmpfs

