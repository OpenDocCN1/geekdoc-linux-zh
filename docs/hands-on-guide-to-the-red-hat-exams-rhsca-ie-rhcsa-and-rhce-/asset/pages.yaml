    tp-4.2.4p-2.el6.x86_64

    ```


    With the client installed, again look at the config file. Instead of servers,
    you can set the RHEL01 system as the primary server to sync with.


    +   Step 2. Define RHEL01 as the primary server and make sure the driftfile line
    is uncommented:


    ```

    # cat /etc/ntp.conf


    Server          172.168.1.1

    driftfile       /var/lib/ntp/drift

    ```


    Now the client is looking at RHEL01 to sync its. The additional option, driftfile,
    is a scratch place for the NTP service to calculate time checks and errors for
    accuracy. It is recommended for better results but not required.


