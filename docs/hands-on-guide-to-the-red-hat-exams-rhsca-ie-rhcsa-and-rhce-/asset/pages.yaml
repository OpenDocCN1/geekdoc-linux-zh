  md: '# REAL-WORLD TIP


    If you are just starting out with RAID, it is worth noting that you can create
    partitions on a single disk and then use them to create your RAID to see how it
    is implemented. In the real world, however, a RAID setup on a single disk completely
    defeats the purpose of the RAID because it exists for performance or redundancy,
    which you cannot achieve with all your partitions on a single disk.


