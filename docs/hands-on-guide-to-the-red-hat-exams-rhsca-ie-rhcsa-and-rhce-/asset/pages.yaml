- img_proc: true
  md: '# Step 2. Create the swap space /dev/hdc2:


    ```

    # mkswap /dev/hdc2

    Setting up swapspace version 1, size = 4184928 KiB

    no label, UUID=a5f9b7ec-e488-426b-462b-a369-d63cf84ec626

    ```


    After you create a swap space, you need to enable or activate it using the swapon
    command.


    # Step 3. Enable the swap partition:


    ```

    # swapon /dev/hdc2

    ```


    # Step 4. Verify that the swap is running correctly:


    | Filename | Type | Size | Used | Priority |

    | --- | --- | --- | --- | --- |

    | /dev/dm-1 | partition | 4128760 | 0 | -1 |

    | /dev/hdc2 | partition | 4184924 | 0 | -2 |


    Now you have a partition swap set up, you can also set up a file swap. You can
    use the dd command to reserve space for another swap on /dev/hdb1 partition. The
    dd command can be used for many purposes and has a huge syntax, so I do not cover
    the whole thing here, just the specific options you use.


    # Step 5. Reserve 1GB of space for the swap:


    ```

    # dd if=/dev/zero of=/mnt/file_swap bs=1024 count=1000000

    1000000+0 records in

    1000000+0 records out

    1024000000 bytes (1.0 GB) copied, 19.2931 seconds, 53.1 MB/s

    ```


    # Step 6. Just as partition swaps, you can now create a swap space specifying
    the device file just created:


    ```

    # mkswap /mnt/file_swap

    Setting up swapspace version 1, size = 999996 KiB

    no label, UUID=e0b83e4d-8712-413d-9db7-c221cf5087a2

    ```


    # Step 7. Enable the swap:


    ```

    # swapon /mnt/file_swap

    ```


    # Step 8. Again, you can verify that the swap is enabled:


    | Filename | Type | Size | Used | Priority |

    | --- | --- | --- | --- | --- |

    | /dev/dm-1 | partition | 4128760 | 0 | -1 |

    | /dev/hdc2 | partition | 4184924 | 0 | -2 |

    | /mnt/file_swap | file | 999992 | 0 | -3 |'
