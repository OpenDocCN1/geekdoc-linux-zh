    option) is the clean command. It wipes the yum cache and forces it to sync with
    the Red Hat repositories, giving you the most updated package information.


    To flush the cache, do the following:


    ```

    # yum clean all

    Loaded plugins: fastestmirror

    Cleaning up Everything

    Cleaning list of fastest mirrors

    ```


    I find that yum is a very efficient tool for package management when it is adding,
    updating, and removing software. I do find, however, that the rpm command and
    its options provide greater functionality when I want to query a package on the
    system. Knowing when to use which command or when to switch between them will
    help you become a better system administrator.


    # Configuring Additional Repositories


    Sometimes you might want to install a package that isn''t in the repositories
    that come preconfigured with Red Hat. If the package is available in someone else''
    repository, you can add that person''s repository to your yum config file.


    > WARNING: I can''t begin to stress enough that you SHOULD NEVER download or install
    packages from random repositories or any location that you can''t verify is a
    legitimate source. Make sure that you fully trust the repositories from which
    you are installing packages because this would be the easiest way for an attacker
    to get you to install harmful packages.'
