    # Firewall and SELinux Configuration


    To complete the kickstart setup, you just need to make a few adjustments to the
    security settings of the system. Because we haven''t covered iptables and firewall
    rules yet, this section just shows the commands you need for now. We cover firewall
    rules in Chapter 12.


    You need to use TCP port 80 for the HTTP service to function properly. One security
    benefit of using the HTTP protocol for kickstart is that it requires only a single
    port open on the firewall.


    **Step 1.** Use the iptables command to create your firewall rule:


    ```

    # iptables -I INPUT 5 -p tcp -m tcp --dport 80 -j ACCEPT

    ```


    **Step 2.** Save the rule you created:


    ```

    # service iptables save

    Saving firewall rules to /etc/sysconfig/iptables: [ OK ]

    ```


    **Step 3.** Restart the service for the changes to take effect:


    ```

    # service iptables restart

    iptables: Flushing firewall rules [ OK ]

    iptables: Setting chains to policy ACCEPT: filter [ OK ]

    iptables: Unloading modules: [ OK ]

    iptables: Applying firewall rules: [ OK ]

    ```


    Normally, for a service, you need to disable SELinux protection as well. In this
    case, there is no need to make any adjustments to SELinux for the kickstart server
    to work.


    # MIGRATION TIP


    In RHEL5, SELinux is set up to block services by default. You need to adjust this
    for the HTTP service to work properly.


    **Step 1.** Query for the Boolean value you need to change:


    ```

    # getsebool -a | grep httpd_dis

    httpd_disable_trans -- off

    ```


    **Step 2.** Disable SELinux protection:


    ```

    # setsebool -P httpd_disable_trans=1

    ```


    **Step 3.** Verify that the Boolean has changed:


    ```

    # getsebool -a | grep httpd_dis

    ```'
