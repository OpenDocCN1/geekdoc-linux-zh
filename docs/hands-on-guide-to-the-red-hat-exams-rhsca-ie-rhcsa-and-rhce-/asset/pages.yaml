  md: '# RED HAT ENTERPRISE LINUX 5


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_21_0.png)


    **Figure 1-9** Choose a root password.


    **Step 10.** Now you are able to select which packages you installed. This process
    can get very detailed because you can choose a package group and then individual
    packages within the group. For my install, I''m going to leave the defaults (which,
    as shown in Figure 1-10, install the base system plus the Gnome Desktop Manager).
    You need to know how to configure different packages and installations by hand,
    so allowing the system to install them now isn''t going to help in the long run.


    After you click Next, the installation of the operating system begins. This process
    can be fairly quick (10 minutes) or slightly longer (30 minutes) depending on
    which software you choose to install and other configuration options. When the
    installation is complete, you are prompted to reboot the system. When the system
    has rebooted, make sure that you remove the CD from the drive or set the system
    to boot from the primary disk so not to start the installation all over again.
    Following the reboot, the system begins the firstboot process.


    # The Firstboot Process


    The firstboot process we are going to follow here is a continuation from our RHEL5
    installation. RHEL6 uses a text menu-driven process that is similar. The first
    thing you see during the firstboot process is the firewall configuration page,
    as shown in Figure 1-11.'
