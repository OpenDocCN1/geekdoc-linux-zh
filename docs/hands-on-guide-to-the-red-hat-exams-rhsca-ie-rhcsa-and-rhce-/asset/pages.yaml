    You need to consult your company''s password policy to determine which options
    should be set. You can practice editing each option to see how they will affect
    the complexity of your system passwords.


    # Summary


    Dealing with security either for the Red Hat or in the real world is no small
    task. In the first section, we described TCP Wrappers, which helps with securing
    services that support it. Next, we looked at firewall rules iptables and NAT,
    which help to enforce security on the system. Finally, we discussed PAM, which
    provides modules for security of different services and actions on the system.
    Each part of this chapter plays a different role in providing different parts
    of the system. It takes practice and experience to learn the proper way to configure,
    monitor, and troubleshoot security effectively for a Red Hat system. Security
    is also important throughout the rest of the book because you need to use what
    you learned here to work with the other services.


