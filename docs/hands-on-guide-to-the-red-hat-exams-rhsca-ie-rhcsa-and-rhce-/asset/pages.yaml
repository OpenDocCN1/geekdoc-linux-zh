    +   9. The chmod command is used to change the permissions of files and directories.
    The chown command is used to change the ownership of files and directories.


    +   10. A soft limit acts like an alarm, signaling when you are reaching your
    limit. If you don''t specify a grace period, the soft limit is the max. A hard
    limit is required if a grace period exists. It is the max limit you can hit before
