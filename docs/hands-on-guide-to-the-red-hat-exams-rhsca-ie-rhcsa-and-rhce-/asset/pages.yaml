  md: '# Receiving Mail with Dovecot


    Now that you can send mail, you also need to be able to receive it. Dovecot enables
    you to set up an incoming mail server that allows for multiple protocols to be
    used when accessing mail.


    +   **Step 1.** Unlike with Postfix, you first need to set up Dovecot by installing
    the correct package:

    # yum install -y dovecot


    +   **Step 2.** Verify the installation:

    # rpm -qa grep dovecot

    dovecot-2.0.0-10.beta6.20100630.el6.x86_64


    +   **Step 3.** Enable the service to start on system boot:

    # chkconfig dovecot on


    +   **Step 4.** Verify the service will start at boot:

    # chkconfig dovecot --listndovecot 0:off 1:off 2:on 3:on 4:on 5:on 6:off


    # Configuring Dovecot


    Dovecot, unlike Postfix, has only a single config file that you need to configure.
    Like its partner Postfix, the Dovecot config file is long—more than 1,000+ lines.
    Although the entire file is not shown here, you need to configure a few key options.


    > MIGRATION TIP

    In RHEL6, the config file for Dovecot has been moved. It is now located at /etc/dovecot/dovecot.conf.
    Previously in RHEL5, it was located at /etc/dovecot.conf.


    +   **Step 1.** Start by opening the file for editing:

    # nano /etc/dovecot/dovecot.conf


    +   **Step 2.** Define the protocols that you''d like to have the Dovecot server
    use:

    protocols = imap pop3


    +   **Step 3.** You should also define the IP address for the service to listen
    on, disable SSL, and define where user mailboxes should be stored:

    listen = 172.168.1.1

    ssl_disable = yes

    mail_location = maildir:~/Maildir'
