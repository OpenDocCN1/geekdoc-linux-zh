  md: 'When you create or delete users, sometimes things don''t always work out properly.
    This can cause the password files to become inconsistent. You can use the pwck
    command to verify the consistency between the /etc/passwd file and the /etc/shadow
    file:


    ```

    # pwck

    user adm: directory /var/adm does not exist

    user news: directory /etc/news does not exist

    user uucp: directory /var/spool/uucp does not exist

    pwck: no changes

    ```


    One other topic about the lines of passwords is locking and unlocking user accounts.
    This is done by manipulating users'' passwords in the /etc/shadow file (usually
    through the usermod command, not by hand). As a real-world example, suppose you
    are hiring two people next week. The boss says, “I want two accounts for these
    two new people so that they are ready to go and not have to wait on them to be
    set up.” You should already know that creating accounts with no passwords is not
    an option, and some administrators are obsessive with security and don'' like
    leave open accounts that have default passwords. In this case, you can create
    the new users as you normally would with a standard default password (usually
    defined by policy) and then lock their accounts.


    **Step 1.** Create a user account:


    ```

    # useradd -c "New User" user06

    ```


    **Step 2.** Set the user''s default password:


    ```

    # passwd user06

    Changing password for user06.

    New UNIX password:

    Retype new UNIX password:

    pass: all authentication tokens updated successfully.

    ```


    **Step 3.** Lock the user''s account:


    ```

    # usermod -L user06

    ```


    Locked accounts have passwords that start with an exclamation point (!) in the
    /etc/shadow file.


    **Step 4.** Verify that the account is locked:


    ```

    # cat /etc/shadow | grep user06

    user06:$S1$9w0e2v2Mb3YqrntPpn69LAudti0:14805:0:99999:7:::

    ```


    Now when she starts working Monday morning, you can simply unlock the user''s
    account and she is up and running.


    **Step 5.** Unlock the account:


    ```

    # usermod -U user06

    ```'
