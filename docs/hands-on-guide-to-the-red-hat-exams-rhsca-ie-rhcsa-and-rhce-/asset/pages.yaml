    If the results that you are expecting not match what is displayed, or if the hostname
    or IP address can''t be found, it is a good indication that there is a problem
    with that particular zone file. This is a good way to test a few of the entries
    in each zone file to verify functionality of the DNS server. Aside from the host
    command, you can also use the nslookup command that offers different information
    about lookups.


    **Step 5.** Query the domain name again:


