  md: '# Setting Up RAID


    So far, we have addressed basic partitions, including swap, and how to set them
    up. Now let''s move on to the final type of advanced partitioning: RAID. RAID
    partitions allow for more advanced features such as redundancy and better performance.
    Before we describe how to implement RAID, let''s look at the different types of
    RAID:


    +   - RAID 0 (Striping) disks are grouped together to form one large drive. This
    offers better performance at the cost of availability. Should any single disk
    in the RAID fail, the entire set of disks becomes unusable. Two disk minimum.

    - RAID 1 (Mirroring) disks are copied from one to another, allowing for redundancy.
    Should any one disk fail, the other disk takes over, having an exact copy of data
    from the original disk. The downside is slow write times. Two disk minimum.

    - RAID 5 (Striping with parity) disks are similar to RAID 0 and join together
    to form one large drive. The difference here is that 25% of the disk is used for
    a parity bit, which allows the disk to be recovered should a single disk fail.
    Three disk minimum.


    While RAID can be implemented at the hardware level, the Red Hat exams are not
    hardware based and therefore focus on the software implementation of RAID through
    the MD driver. Next, let''s use the three free disk drives from the previous section
    (hdb, hdc, and hdd) to set up a RAID array.


    Install the following package:


    ```

    # yum install -y mdadm

    ```


    Step 1.


    Step 2.


    Verify the install:


    ```

    # rpm -qa | grep mdadm

    mdadm-3.1.3-1.el6.x86_64

    ```


    This package should have already been installed with the system, you may be able
    to just verify its existence. To start, you first need to create partitions on
    the disk you want to use (yes, I had you erase them at the end of the previous
    section...think of it as practice). You start with a RAID 5 setup, so you need
    to make partitions on at least three different disks.'
  merge: -1
