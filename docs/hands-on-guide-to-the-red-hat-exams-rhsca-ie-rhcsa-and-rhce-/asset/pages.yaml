  md: 'At this point, you have only a handful of file systems, so it isn''t too hard
    to find the one you''re looking for. If this were not the case, you could use
    the finds command to search through the labels of your file systems and return
    the one you are looking for.

    Syntax: finds LABEL=<label>UUID=<uuid>


    # Step 4. Find the file system you labeled:


    ```

    # finds LABEL=CData

    /dev/hdb1

    ```


    When you verify that the label exists and is the file system that you are looking
    for, you can also query more information about the device using the blkid command.

    Syntax: blkid [options]


    Options:


    +   - s Shows specified tag(s)

    - dev Specifies the device to probe


    # Step 5. Combine the blkid command with grep for specific results:


    ```

    # blkid grep CData

    /dev/hdb1: LABEL="CData" UUID=2752ffb4-2bca-41c6-a569-f3563f6e884d TYPE="ext4"

    ```


    # Step 6. When you finish your file system with the new label instead of the device
    path:

