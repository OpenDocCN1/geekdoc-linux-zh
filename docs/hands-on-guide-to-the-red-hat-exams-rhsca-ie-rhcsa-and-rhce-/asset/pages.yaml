  md: 'One additional step that you need to take for your secure website is opening
    an additional port on the firewall.


    Step 1. Use the iptables command to create your firewall rules:


    ```

    # iptables -I INPUT 5 -p tcp -m tcp -dport 80 -j ACCEPT

    # iptables -I INPUT 5 -p tcp -m tcp -dport 443 -j ACCEPT

    ```


    Step 2. Save the rule that you created:


    ```

    # service iptables

    Saving firewall rules to /etc/sysconfig/iptables:

    ```


    Step 3. Restart the firewall service for the changes to take effect:


    ```

    # service iptables restart

    iptables: Flushing firewall rules:

    iptables: Setting chains to policy ACCEPT: filter

    ```


    ```

    iptables: Loading modules:

    iptables: Applying firewall rules:

    ```


    # CGI Applications


    Now that you know how to configure and secure a web server, let''s look at some
    advanced deployments and how to share data. For this first example, let''s deploy
    a CGI application on the web server.


    Step 1. Create a directory to hold your web application:


    ```

    # mkdir /var/www/web-app-01

    ```


    Step 2. Copy any required files into the newly created directory:


    ```

    # cp /home/user/01/app.py /var/www/web-app-01

    ```


    > NOTE: You can get the app.py from http://sourceforge.net/projects/rhcelabscripts/


    Step 3. Add the following section to your /etc/httpd/conf/httpd.conf file:


    ```

    ScriptAlias /webapp "/var/www/web-app-01"

    <Directory "/var/www/web-app-01/">

    Options ExecCGI FollowSymLinks

    Order allow,deny

    Allow from all

    </Directory>

    ```


    Step 4. Check the config file for syntax errors:


    ```

    # service httpd configtestest

    Syntax OK

    ```


    Step 5. Set the correct permissions for the directory:


    ```

    # chmod 755 -R /var/www/web-app-01

    ```'
