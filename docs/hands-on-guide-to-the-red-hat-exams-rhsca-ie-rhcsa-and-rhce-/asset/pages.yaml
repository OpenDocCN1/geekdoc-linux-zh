    # MIGRATION TIP


    In RHEL5, the /etc/cron file was used as the root''s crontab. This crontab followed
    a different format from that of all other users. The /etc/crontab has an extra
    field between the last time field and command field. In this field, you must specify
    which user you want the job to run.


    Here is what the /etc/cron file looks like for RHEL5 systems:


    ```

    # cat /etc/crontab

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    HOME=/

    ```


    ```

    # run-parts

    01 * * * root run-parts /etc/cron.hourly

    02 4 * * root run-parts /etc/cron.daily

    22 4 * * root run-parts /etc/cron.weekly

    42 4 1 * root run-parts /etc/cron.monthly

