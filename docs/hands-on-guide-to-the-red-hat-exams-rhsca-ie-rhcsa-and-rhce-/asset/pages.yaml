  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual


    to make sure that there are no errors or issues when booting up with the new kernel.
    If you encounter any issues, you can reboot and choose the older kernel at the
    GRUB boot menu to fix any issues you''re having.


    Up to this point, you should be comfortable updating and upgrading a kernel on
    your Red Hat System. Although it is possible to build completely custom kernels,
    this is a very large undertaking and requires a good deal of knowledge regarding
    the internals of the Linux kernel. We don''t cover this topic here because custom
    kernel compiling is not part of the Red Hat exams; however, there are many great
    books on the subject.


    The last topic that we address is modifying the kernel through the use of /proc/sys
    file system.


    # Tuning the Kernel with /proc/sys


    One of the great things about Linux is that it works on many different types of
    hardware out of the box. Although this is a great feature of Linux, it also requires
    developers of different distributions, such as Red Hat, to generalize settings
    for their versions of the operating system. This generalization is fine in most
    cases, but those who want some extra processing power and better performance should
    tune their kernel.


    The kernel has a virtual file system /proc/sys, which allows you to tune the kernel
    while the system is running. The kernel creates the /proc/sys virtual file system
    when the system boots up, which holds all the parameters of the kernel. You can
    manipulate kernel parameters for testing purposes (these are changed through a
    special file), or you can compile your own kernel to have them built in permanently.
    When you have the kernel tuned the way you''d like, you can simply have your settings
    applied when the system boots. As you are testing kernel changes, make sure you
    dont rely on any settings within the /proc/sys file system because they are erased
    when the system reboots. During tuning, you can use the echo command to change
    the values of the kernel while the system is running.


    Let''s look at an example showing how to allow the system to temporarily forward
    packets.


    +   Step 1. View the current value in the kernel:


    ```

    # cat /proc/sys/net/ipv4/ip_forward

    ```


    +   Step 2. Change the kernel option that controls packet forwarding:


    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
