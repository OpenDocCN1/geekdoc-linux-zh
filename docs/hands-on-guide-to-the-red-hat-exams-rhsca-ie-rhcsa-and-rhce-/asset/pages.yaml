  md: '# CHAPTER 13


    # Remote Access


    You walk into the server room and install Red Hat on your new server. After the
    installation is complete, you will need to configure numerous packages and then
    setting up users. All these tasks take time, and if you work in a data center,
    chances are your office is located elsewhere. Remote access to any system that
    you work on managing and troubleshooting much easier because you don''t physically
    need to be in the same location as your systems. In this chapter, we discuss using
    SSH for command-line remote access and VNC for graphical remote access.


    # Secure SHell (SSH)


    You know that at some point or another you will need to administer servers remotely,
    and you wouldn''t want to do this without some sort of security in place, right?
    SSH can protect the traffic that passes from your computer to a remote computer,
    making the tunnel for administration. The tunnel that SSH uses for communication
    is encrypted, unlike protocols such as Telnet that don''t employ any encryption.
    SSH is a fairly easy service to set up and is useful in many different ways. Although
    it is usually installed by default, you also verify.


    +   Step 1. Verify that the SSH server package is installed:


    ```

    # rpm -qa | grep ssh

    libssh2-1.2.2-70.el16.x86_64

    openssh-5.3p1-20.el16.x86_64

    openssh-server-5.3p1-20.el16.x86_64

    openssh-clients-5.3p1-20.el16.x86_64

    ```


    +   Step 2. If the SSH server package is not installed, do the following:


    ```

    # yum install -y openssh-server

    ```


    +   Step 3. Make sure to verify again:


    ```

    # rpm -qa | grep ssh

    openssh-server-5.3p1-20.el16.x86_64

    ```'
