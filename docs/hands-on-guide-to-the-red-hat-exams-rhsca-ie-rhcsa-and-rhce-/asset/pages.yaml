    \ also need to edit the /etc/named.conf file.\n\n**Step 8.** Insert the following\
    \ at the bottom of your /etc/named.conf:\n\n```\ncontrols {\n    inet 127.0.0.1\
    \ port 953\n    allow { 127.0.0.1; } keys { \"rndckey\"; };\n};\n```\n\nThe controls\
