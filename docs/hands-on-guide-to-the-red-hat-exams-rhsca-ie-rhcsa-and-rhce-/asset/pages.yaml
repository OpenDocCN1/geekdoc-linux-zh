  md: '# Hands-On Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    # SSH Security


    SSH has many different options when it comes to security. First, let''s look at
    some host security. The SSH service can make up the TCP Wrappers service for additional
    protection when you are setting it up. Suppose you want to allow connections only
    from 172.168.1.0/24 network to the RHEL01 host.


    +   Step 1. Use TCP Wrappers to limit the hosts that can connect to the server:


    ```

    # echo sshd: 172.168.1.1" >> /etc/hosts.allow

    # echo "ALL: ALL" >> /etc/hosts.deny

    ```


    This allows all clients within the 172.168.1.0/24 subnet to connect to the SSH
    server (provided they have a valid user account), and allows any other host outside
    this subnet. Although TCP Wrappers is a good starting point for host-based security,
    you should also change a few of the options in the config file to really improve
    the security of your SSH server. You should take into account the default port
    that the SSH service uses, the IP address that the server listens on, and the
    protocol.


    +   Step 2. Change the options to improve security:


    ```

    Protocol 2

    Port 2222

    ListenAddress 172.168.1.1

    ```


    When you change these options, the default port isn''t known to everyone-one,
    and the internal network adapter listens for connections. Be careful not to lock
    yourself out of the external network, though.


    Let''s switch focus for a second and look at user-based security. Although this
    type of security is not in the config file by default, you can also limit the
    users or groups you''d like to connect to your SSH server. The SSH service processes
    options in the following order:

    DenyUsers AllowUsers DenyGroups AllowGroups


    +   Step 3. Add the following to your config file to allow only specific users
    to connect:


    ```

    AllowUsers user1,user2

    ```


    Now only the two users who have been listed are allowed to connect to the SSH
    server. Although security for SSH is great, make sure you have documented your
    security somewhere because hardened systems tend to lead to connection issues
    if not planned properly. You need to be aware what security mechanisms you have
    in place when troubleshooting.'
