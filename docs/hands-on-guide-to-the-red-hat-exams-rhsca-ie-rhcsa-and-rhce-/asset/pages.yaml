  md: '# Package Management


    Software is the basis of any operating system, allowing you to install and use
    different utilities. In Linux, software is distributed through the use of packages,
    which contain the actual software files. Each distribution of Linux has its own
    package management system. For Red Hat, there are two package management systems:
    RPM and Yum. In this chapter, we look at package management and how to handle
    software for the Red Hat system.


    # Working with RPM


    A package contains a directory structure that is composed of files to make up
    the software application. In Red Hat, packages have the .rpm extension and can
    be installed through different means. Before diving into package management, let''s
    look at the naming convention used by the system to describe packages.


    Package Syntax: package_name-version-release.arch.rpm


    As an example, let''s look at the postfix package, which is used to install an
    SMTP mail server:


    ```

    postfix-2.6.6-2.el6.x86_64.rpm

    ```


    You can see from the preceding that the name of the package is postfix, the version
    number is 2.6.6, and it is meant for a 64-bit operating system. The -2 is the
    release, and the el6 is something you find only in Red Hat packages because it
    specifies an internal number for the Red Hat release. Being able to read a package
    and understand its version information is important for a system administrator.
    This helps in determining whether your packages are out-of-date or whether you
    are vulnerable to security risks in different versions of software. When you install
    one package, it requires that you install another as known as a dependency. Certain
    packages require versions to make sure that their dependencies don''t break when
    upgrading. You can see being able to get version information from packages is
    a necessary skill. All packages are held within a repository somewhere, depending
    on who produces the package. Red Hat has its own software repositories, which
    hold the packages for the Red Hat operating system. When you update your packages,
    they are compared to the version of the package in the repository to see if'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual


    there is a newer version. You can also have new versions of packages outside repositories,
    but these require a slightly different installation method. In the first half
    of this chapter, we look at packages outside repositories.


    # Installing and Removing Packages


    The first package management utility we look at is RPM. This utility is used to
    manage individual packages outside the repositories. This means you can use the
    yum command to query packages in the repositories and install them, whereas you
    use the RPM utility to install rpm packages that you download (either manually
    from the repositories or the Web). For both RPM and Yum, the syntax and options
    are monstrous. Until you become accustomed to working with them, you can refer
    to their help menus for a listing of all the options. This section includes only
    the most common options that you will need. An example should help clear things
    up.


    Syntax: rpm [options]


    The options for rpm are divided into three different sections (modes): install/upgrade/erase,
    query, and verify.


