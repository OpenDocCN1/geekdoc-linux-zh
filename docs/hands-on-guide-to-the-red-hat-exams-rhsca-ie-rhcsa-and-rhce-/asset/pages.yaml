    Working with IP addresses and assigning them to servers is great, it becomes highly
    impractical after you start managing a large number of servers and clients. Instead,
    you can use hostnames (the name of the server), which can be used in place of
    an IP address. The lookup and translation of an IP address to hostname happens
    automatically via a DNS server on your network. Although this section doesn''t
    cover DNS in its entirety, it describes client-side DNS issues and ways to troubleshoot
    them. There are some key files that make name resolution occur on the system.
    Let''s look at those files:


    +   - /etc/sysconfig/network Contains the hostname of the system

    - /etc/resolv.conf Contains the IP addresses of the DNS servers

    - /etc/hosts Contains the local IP to hostname mappings

    - /etc/nsswitch.conf Contains the order in which the local DNS server is queried
    for information


    Aside from these key files, there are also a few client-side commands that you
    can use as well:


    +   - hostname Sets or returns the hostname of the system'
