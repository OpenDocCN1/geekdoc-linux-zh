  md: '# System Logging, Monitoring,

    and Automation


    How do you know when something goes wrong on your system? You look at the logs,
    of course! In all seriousness, understanding system logging is important so that
    you can troubleshoot when something goes wrong. Logs are kept for all everything
    that you can think of, including the kernel, boot process, and different services
    that are running. Aside from logs, there are also utilities you can use to monitor
    and check the status of your system. This chapter looks at how you can use these
    tools and logging to troubleshoot anything that is thrown your way. The chapter
    also touches on how to automate some of these tasks.


    # Working with Syslog


    Whenever something goes wrong—and sometimes things go right—on the system, a message
    is generated by the syslog service. These messages are used to keep track of how
    the system is performing, what actions are taking place, and if there is a problem
    with something. Red Hat comes with a syslog service built in and already set to
    start at boot. In RHEL6, the rsyslog package installed by default and is the primary
    logging service used.


    > In RHEL5, the default logging service was split between two daemons: syslog
    and klogd. syslog was used for system messages and klogd for kernel messages.
    In RHEL6, these have both been replaced by the rsyslog daemon, which handles both
    types of messages. If you are still on RHEL5, you can install the syslog service
    via the syslogd package.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual


    The rsyslog service has a main config file, /etc/rsyslog.conf, that controls messages
    are sent when they are generated. Because logging is a critical piece of the operating
    system, it is installed by default as the core packages.


    Step 1. Just out of good habit, you should verify that the package is installed:


    ```

    # rpm -qa | grep rsyslog

    rsyslog-4.6.2-2.el6.x86_64

    ```


    Because you can see that it is installed, you should also check on other issues.


    Step 2. First, make sure that the service is set to start when the system boots:


    ```

    # chconfig rsyslog --list

    rsyslog 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```


    Step 3. Second, make sure that the service is currently running:


    ```

    # service rsyslog status

    rsyslog (pid 1279) is running...

    ```


    RHEL05:


    Step 1. Verify the installation of the package:


    ```

    # rpm -qa | grep klog

    syslogd-1.4.1-44.el5

    ```


    Step 2. Check that the service will start on boot:


    ```

    # chconfig rsyslog --list

    syslog 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```


    Aside from the name difference, as we have already discussed, there are two daemons
    that run instead of one. They do, however, both run under a single service name.


    Step 3. Verify that the service is running:


    ```

    # service rsyslog status

    syslogd (pid 2214) is running...

    klogd (pid 2217) is running...

    ```


    As you can see here, there are some slight differences between logging on RHEL5
    and RHEL6 (such as the naming and single versus double daemons). The rsyslog service
    provides better logging features, so it is recommended to upgrade if possible.'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'All the messages sent to the rslog service are stored in the /var/log directory,
    and each message section has its own log file or subdirectory. You can also define
    your own log files or directories. The biggest problem that arises from using
    any logging service is the files can become uncontrollable if unchecked. Being
    able to log different alerts and obtain information from logs, in my opinion,
    is an art all unto itself. There are so many ways to customize logs, and each
    network setup is different. You should know that there are nine different alerts
    that the syslog service-uses. These alerts can be produced by different network
    devices and Red Hat systems.


    The nine severity levels of syslog include the following:


    +   - emerg

    - alert

    - crit

    - err

    - warning

    - notice

    - info

    - debug

    - none


    # The Config File


    The /etc/rsyslog.conf file is broken down into the following parts:


    | Modules | Indicate whether they can be loaded or unloaded (rsyslog is modular)
    |

    | Global directives | Specify config options that apply to the daemon (all start
    with a $) |

    | Rules | Indicate cooperation of a selector and an action |

    | Selector | Is based on <facility>.<priority> |

    | Action | Defines what to do with messages after they’re sorted by the selector
    |


    Let’s look at the default config file to see some examples:


    ```

    # cat /etc/rsyslog.conf

    #rsyslog v3 config file

    ```


