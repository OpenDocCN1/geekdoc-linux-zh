  md: "# Chapter 14: Web Services\n\n# 3. Settings for virtual hosts, which allow\
    \ Web requests to be sent to\n# different IP addresses or hostnames and have them\
    \ handled by the\n# same Apache server process.\n\nIn this section, we discuss\
    \ specifically the global environment and main server options. Here are some common\
    \ options for the global section:\n\n| ServerRoot | Defines where the config files\
    \ are held |\n| Timeout | Specifies the time before a request times out (120 seconds\
    \ is the default) |\n| Listen | Indicates the port number to listen on (default\
    \ 80) |\n| User | Identifies the group to run the web server as |\n| Group | Identifies\
    \ the group to run the web server as |\n| LoadModule | Defines a module to load\
    \ when the web server starts |\n\nThese options apply to the server as a whole,\
    \ usually changing from server to server instead of section. Let's look at a few\
    \ basic options for the main server section:\n\n| ServerRoot | Defines where the\
    \ website files are located |\n| ServerName | Defines a server name or IP address\
    \ and port number |\n\nThese main server options are the default for the server.\
    \ As you see later in this chapter, when you host multiple sites on a single server,\
    \ any option that isn't defined uses the global section options as the default.\
    \ If you have worked with Apache before or know something about Apache, you already\
    \ have an understanding of how large a topic Apache can be. There are numerous\
    \ texts to just configuring and maintaining Apache web servers because of the\
    \ complexity behind it. For the Red Hat exams and real-world setups, you need\
    \ to know only the basics of Apache.\n\nLet's start by defining the location of\
    \ a website on the file system. By default, it is located in /var/www/html directory,\
    \ although this can be changed if you'd like. In the main config file, you see\
    \ a section denoted by the Directory option.\n\nSection of /etc/httpd/conf/httpd.conf:\n\
    \n```\n<Directory /var/www/html/>\n  Options Indexes FollowSymLinks\n  AllowOverride\
    \ None\n  Order allow,deny\n  Allow from all\n</Directory>\n```"
