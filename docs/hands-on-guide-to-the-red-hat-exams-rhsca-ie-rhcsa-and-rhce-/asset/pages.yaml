  md: 'When a denial occurs on the system, you see an ID associated with it in your
    log files. This ID can be used to determine a more detailed understanding of what
    could be causing problems with your files or service.


    Use the sealert command to obtain more information from an ID:


    ```

    # sealert -i 0621a8c3-b182-49cf-9116-c78a9d4d52199

    ```


    You can see that this command will give you information to understand what is
    going on. Although you wouldn''t run into too many issues with SELinux on the
    Red Hat exam, it is important to be able to work with the Boolean values and know
    how to find what you are looking among them. Aside from Booleans, most of the
    SELinux issues should be minor.


    # Summary


    With the release of RHEL6, SELinux has taken on a larger role in securing systems.
    This chapter covers how to set up and configure SELinux, while ensuring functionality
    of your system. For the Red Hat exams, make sure you are comfortable looking up
    Boolean values and knowing how to adjust them, changing file contexts, and handling
    SELinux policy violations. Also, this chapter explains contexts and how they play
    a role in SELinux. If you want to learn more about SELinux, there are entire courses
    dedicated to SELinux and advanced management.


