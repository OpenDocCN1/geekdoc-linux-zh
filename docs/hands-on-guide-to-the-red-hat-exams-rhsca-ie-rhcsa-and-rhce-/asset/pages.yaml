- img_proc: true
  md: '```

    exec Permits binary file execution

    auto Mounts the file system when the -a option is specified

    ouser Disallows any normal user from (un)mounting the file system\async Allows
    all file system I/O to occur asynchronously

    ```


    The fifth field defines whether data should be backed up (also called dumping)
    before a shutdown or reboot occurs. This field commonly uses a value of 1. A value
    of0 might be used if the file system is a temporary storage for files, as /tmp/.
    The last field defines the order in which file system checking should take place.
    For the root file system, the value should be 1; everything else should 2. If
    you have a removable file system (such as a CD-ROM or external hard drive), you
    can define a value of 0 and skip the checking altogether. Because you want the
    two file systems created earlier to be mounted when the system boots, you can
    add two definitions for them.


    +   Step 6. Open the /etc/fstab file for editing:


    ```

    # nano /etc/fstab

    ```


    +   Step 7. Add the following line for the /dev/hdc1 file system:

    /dev/hdc1 /opt/backup ext3 defaults 0 0


    While you have this file, you should also define the swap file system as well
    (you don''t think I forgot about that, do you?). You have one partition and one
    swap file. The order of the swap file matters because it indicates the order in
    which the devices are used by the system itself.


    +   Step 8. Add the following line for the swap:

    /dev/hdc2 swap defaults 0 0


    Now you can save the file and exit. You don''t have to reboot to test it!


    +   Step 9. You can use the mount command with the -a option to remount all file
    systems defined in the /etc/fstab file:


    ```

    # mount -a

    ```


    Now all your file systems should be mounted and available for use.


    > NOTE: Although we have been talking a lot about file systems as they relate
    to disk drives, the mount command can be used to mount other types of file systems
    as well. For example, you usually have a /media directory off the root partition
    that is'
