  md: '# The Kernel


    The heart of Red Hat is the Linux kernel. The kernel is responsible for interacting
    with the hardware and producing output to the screen. There is also a virtual
    file system that gets created in the /proc directory to hold hold information
    and parameters for the kernel. In this chapter, we look at the basics of the kernel,
    ways to update it, and ways to tune it the /proc file system. Although the focus
    of this book is on Red Hat and the exams, everything in this chapter applies to
    other versions of the Linux operating system as well.


    # Kernel Basics


    Linux is truly just the kernel. Red Hat and the other distributions in existence
    today are software and configuration files packaged with the Linux kernel to bring
    you an entire operating system (although we still refer to any distribution as
    Linux). Because the kernel is really what runs everything, understanding how it
    works is essential. The kernel can be used to load new drivers, support new hardware,
    or even offer a custom kernel for individual needs. The Linux kernel is modular,
    and because of this, you can load and unload kernel modules even after the system
    has booted. In this chapter, we look at four commands that help working with the
    kernel:


    +   - uname Displays information about the kernel

    - lsmod Lists currently loaded kernel modules

    - modinfo Displays information about a kernel module

    - sysctl Enables you to tune kernel parameters'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    Let''s start with the uname command to find out some information about the kernel
    first.


    Syntax: uname [option]


    Options:


    +   - a Prints all information relating to the kernel

    - s Shows the kernel name

    -r Requests kernel release information

    - v Requests the kernel version


    Let''s check and see which version of the kernel is currently running:


    ```

    # uname -a

    Linux RHEL01 2.6.32-71.e16.x86_64 #1 SMP Wed Sep 1 01:33:01 EDT 2010 x86_64 x86_64

    x86_64 GNU/Linux

    ```


    The kernel version numbering is important here (2.6.32-71.e16). The first is the
    major version of the kernel. The second number is the major release of the first
    number. If the release is even, it is (6), it means this is a stable release of
    the kernel. Odd numbers are development kernels and should not be used for production
    systems. The third number is the patch version of the kernel. The last number
    (71) is added by Red Hat to represent its release version of the kernel. Also
    note the e16, which tells you that you are running Red Hat Enterprise Linux 6.
    If you couldn''t tell, this is an x64-bit version of the operating system (denoted
    by x86_64).


    > REAL-WORLD TIP

    Although we are talking about even and odd numbers for the stability of the kernel,
    this information is more for historical purposes. Today, everything is referred
    to as a 2.6 kernel or later.


    You can also get the version of the currently installed kernel through the package
    manager:


    ```

    # rpm -qa | grep kernel

    kernel-2.6.32-71.e16.x86_64

    ```


    You could also use the following:


    ```

    # rpm -q kernel

    ```


    When it comes to working with kernels, you should be familiar with different locations.
    Let''s look at four of these locations:'
