    # Centralized Logging


    If you''d like to set up a centralized syslog server, you need to choose which
    server to store all your logs on. For this example, you can use the RHEL01 system
    as the centralized server and configure it to receive logs from the other systems
    on the network.


    Step 1. Look at a section of the /etc/rsyslog.conf file you again:


    ```

    #### MODULES ####


    $ModLoad imuxsock.so # provides support for local system logging (e.g. via logger
    command)

    $ModLoad imlog.so # provides kernel logging support (previously by rklogd)

    $ModLoad immark.so # provides --MARK-- message capability


    # Provides UDP syslog reception

    $ModLoad imudp.so

    $UDPServerRun 514


    # Provides TCP syslog reception

    $ModLoad imtcp.so

    $InputServerRun 514

    ```


    In the modules section, you can see two areas that will provide the capability
    to receive logs from other systems. The standard is to use the UDP protocol on
    port 514. By uncommenting the section related to UDP reception, you essentially
    provide a way for the syslog server to become the centralized server for the network.


    Step 2. Uncomment the following two lines:


    ```

    $ModLoad imudp.so

    $UDPServerRun 514

    ```'
