    You wouldn''t know by looking at the output of this command, but these are all
    links to scripts on the system, usually within the /etc/rc.d/init.d directory.
    You can also see from the output that each link has an interesting syntax. The
    syntax is something like


    [K|S]##ServiceName


    The K stands for Kill and the S stands for Start. The ## is any number between
    01 and 99, including duplicates. Finally, there is the name of the service. When
    you put all this together, you get a list of every service that is stopped (K)
    or started (S) when the system enters runlevel 3. The numbers indicate the order
    in which a service is started or stopped, with all Kings being processed first
    (in numerical order from 1 to 99) and then all Starts being processed second (in
    numerical order from 1 to 99). If the number is the same, the alphabetical sort
    dictates the order.

