    use this disk directly in half. Create two partitions, each with half of the disk
    space available; verify they are correct, and write the changes to the disk.


    # Step 4. Create a new partition:


    ```

    Command (m for help): n

    Command action

    e extended

    p primary partition (1-4)

    Partition number (1-4): 1

    First cylinder (1-1044, default 1):

    Using default value 1

    Last cylinder or +size +sizeM +sizeK (1-1044, default 1044): +4294M

    ```


    Because you are cutting the disk in half based on the megabytes available, you
    use the +sizeM syntax (as shown here). You could divide the disk based on kilobytes
    (+sizeK) or cylinders (+size) if you want, but working in megabytes is much easier.
    With the first partition created, you can make the second.


    # Step 5. Create a second partition:


    ```

    Command (m for help): n

    Command action

    e extended

    p primary partition (1-4)

    Partition number (1-4): 2

    First cylinder (549-1044, default 549):

    Using default value 549

    Last cylinder or +size +sizeM +sizeK (8322-16644, default 16644):

    Using default value 1044

    ```


    For this partition, you don''t need to specify a partition size because, default,
    it will grow the partition to the size remaining on the disk. When you are asked
    what the size should be, pressing Enter just allocates the remaining disk space
    available.'
