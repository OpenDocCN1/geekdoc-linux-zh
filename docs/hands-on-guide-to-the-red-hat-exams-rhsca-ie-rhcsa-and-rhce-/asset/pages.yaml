  md: '# Chapter 9: System Logging, Monitoring, and Automation


    Here, the root user is defined to run the specified commands. This user field
    is now optional in RHEL6.


    What do you think happens if you set cron jobs to run during the night (say, to
    run some reports) and you shut down the system right before you go home? Well,
    it turns out there is another great feature of cron. The /etc/anacontab file defines
    jobs that should run every time the system is started. If your system is turned
    off during the time that a cron job should have run, when the system boots again,
    the cron service will call /etc/anacontab to make sure that all missed cron jobs
    are run.


    Let''s look at the /etc/anacontab file:


    ```

    # cat anacontab

    SHELL=/bin/sh

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=45

    # the maximum random delay added to the base delay of the jobs

    RANDOM_DELAY=45

    # the jobs will be started during the following hours

    START_HOURS=3-22

    ```


    | period in days | job-identifier | command |

    |---|---|---|

    | 1 | cron.daily | nice run-parts /etc/cron.daily |

    | 7 | 25 | cron.weekly | nice run-parts /etc/cron.weekly |

    | @monthly 45 | cron.monthly | nice run-parts /etc/cron.monthly |


    The comments in this file make it easy to understand how jobs are defined. If
    your system is constantly on and you don''t need anacron to run, you can uninstall
    the cronie-anacron package, which controls the anacron commands for the cron service.


    # MIGRATION TIP


    In RHEL5, anacron was a separate service from cron. The Anacron service alone
    was called when the system booted similarly ran the /etc/anacontab file. This
    file looks similar to the RHEL6 version without any comments:


    ```

    # cat anacontab

    SHELL=/bin/sh

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=

    ```


    | 1 | 65 | cron.daily | run-parts /etc/cron.daily |

    | 7 | 70 | cron.weekly | run-parts /etc/cron.weekly |

    | 30 | 75 | cron.monthly | run-parts /etc/cron.monthly |'
  merge: -1
