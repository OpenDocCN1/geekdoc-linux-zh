    | | Start | End | Blocks | Id | System |

    |---|---|---|---|---|{}|

    | /dev/hdb | 1 | 548 | 4401778 | 83 | Linux |

    | /dev/hdb2 | 549 | 1044 | 3984120 | 83 | Linux |


    You can see the two partitions created. Based on their block sizes, they are almost
    identical in size (there is some variation because of reserved space, superblocks,
    and other factors that we discuss later).


    # Step 7. Write the changes to disk:


    Command (m for help): `w`

    The partition table has been altered!


    Calling `ioctl()` to re-read partition table.

    Syncing disks.


    Now that two new partitions have been created and written to disk, you should
    verify their existence. Before doing that, you want the kernel to reread the partition
    table to make sure that it recognizes all disks and partitions correctly. To do
    this, you use the partprobe command.


    Syntax: `partprobe [OPTIONS] [DEVICE]`


    Options:


    +   - -d Does not actually inform the operating system

    - -s Prints a summary of contents


    # Step 8. Call the partprobe command:


    ```

    # partprobe /dev/hdb

    ```


    This command has no output to it.


    # GENERAL INFO


    Although you can check the partitions just created without running the partprobe
    command first, it is always a good idea to run this command first. Forcing the
    partition table ensures that you get the latest information from your system and
    that no strange errors or outdated information is returned.'
