  md: 'config file, but this is one area where RHEL6 has changed. First, let''s look
    at a ver- sion of the old grub.conf file:


    ```

    # cat /boot/grub/grub.conf

    default=0

    timeout=5

    splashimage=(hd0,0)/grub/splash.xpm.gz

    hiddenmenu

    title Red Hat Enterprise Server (2.6.18-92.e15)

    root (hd0,0)

    kernel vmlinuz-2.6.18-92.e15 root=/dev/VolGroup0/LogVol00 rhgb quiet

    initrd/initrd-2.6.18-92.e15.img

    ```


    In the preceding example, you can see that there is a single option to boot from,
    as defined by the title entry. This is also known as entry 0, so it becomes the
    default kernel to boot. You can also see the version of the kernel that you are
    using and the place where the root partition will be mounted during the boot process.
    If you want to add additional options to boot into, you could append an- other
    title with options for a second boot choice. This grub.conf file contains everything
    you need to make sure the boot process works smoothly.


    Now let''s look at the new version of the grub.conf file for RHEL6:


    ```

    # cat grub.conf

    default=0

    timeout=5

    splashimage=(hd0,0)/grub/splash.xpm.gz

    hidden

    title Red Hat Enterprise Linux (2.6.32-t16.x86_64)

    root (hd0,0)

    kernel vmlinuz-2.6.32-t16.x86_64 root=/dev/mapper/vg_rhel01-lv_root

    _DM_LV=/lv_root rd_DM_LV=vg_rhel01/lv_swap rd_NO_LKS rd_NO_MD

    rd_NO_MD LANG=en_US.UTF-8 SYSTEM KEYBOARDTYPE=us kernel-autoroot quiet

    initrd/initramfs-2.6.32-t16.x86_64.img

    ```


    Almost everything is the same for the line containing the kernel boot parameters.
    This new version defines additional options such as encryption, RAID, and the
    use of /dev/mapper for LVM management. Again, it is important to take note of
    the new changes in RHEL6 because you need to be trouble-shoot the grub.conf file
    should something go wrong with the system. In both versions of Red Hat, you can
    also edit the config file from the GRUB command line as well. Using the c option
    to enter the GRUB command line, you can make changes to the config file, reinstall
    GRUB, or repair a broken config file.'
