  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    User:


    unconfined_u    Unprotected user

    system_u        System user

    user_u          Normal user


    Role:


    object_r      File

    system_r      Users and processes


    Domain:


    unconfined_r   Unprotected file or process


    > **NOTE:** For the domain section listed here, unconfined_r is only one type
    of context that can be used. More restrictive values can be used, but unconfined_r
    is the most general, which is why it is listed here.


    Each file, folder, and service has an associated label that contains all three
    contexts. In this section, we look at the SSH service as an example because it
    is installed with the system by default. You can use the ps command described
    in Chapter 9, “System Logging, Monitoring, Automation,” to view the labels associated
    with a service.


    Check the SELLinux labels associated with SSH service:


    ```

    # ps -Z ssh

    LABEL           PID TTY CMD

    user_u:system_r:sshd_t-s0:s0:c0.1023 1421 00:00:00 ssh

    user_u:system_r:sshd_t-s0:s0:c0.1023 4977 00:00:00 ssh

    user_u:system_r:sshd_t-s0:s0:c0.1023 4982 00:00:00 ssh

    ```


    The first field you see is system_u, which can be expanded from the text section,
    is a system user. The second field contains system_r, which again you can reference
    to see that it is a user or, in this case, a process. The third field shows unconfined_t
    as the domain. You can ignore the field for the moment.


    Let’s look a little further at the domain context. The domain is a simple way
    of categorizing which contexts talk to one another. Another example should make
    this clearer.'
