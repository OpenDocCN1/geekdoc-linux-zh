  md: '# Commands:


    +   - clean Removes cached data

    - erase Removes a package from the system

    - grouplist Displays available package groups

    - groupinstall Installs the packages within a group

    - info Displays information about a package

    - install Installs a package on the system

    - search Enables you to search for a package

    - update Updates a package


    Yum also has a config file located at /etc/yum.conf that contains some basic settings
    for how Yum will behave. These options include where Yum locally cache packages
    as it installs them, how much it will generate for log files, and the location
    of the log file. Usually, the default settings are good, but you should know where
    this file is located in case you ever want to tune the settings for Yum.


