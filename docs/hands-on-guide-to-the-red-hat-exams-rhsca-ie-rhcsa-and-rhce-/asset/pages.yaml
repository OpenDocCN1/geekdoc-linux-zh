    ```\n\n```\nSSLCertificateFile /etc/pki/tls/certs/localhost.crt\n```\n\n```\n\
    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key\n```\n\n```\n<Files \"\
    \\.(cgi|shtml|html|php)?$\">\n  SSLOptions +StdEnvVars\n</Files>\n```\n\n```\n\
    <Directory /var/www/cgi-bin\">\n  SSLOptions +StdEnvVars\n</Directory>\n```\n\n\
    ```\nSetEnvIf User-Agent \\*.MSIE.*\" \\\n  nokeepail ssl-un-shutdown \\\\\n \
    \ downgrade-1.0 force-response-1.0\n```\n\n```\nCustomLog logs /ssl_request_log\
    \ \\\n  \"%t %h %{SSL_PROTOCOL} %x{SSL_CIPHER} \\\"%r\\\" %b\"\n```\n\n```\n</VirtualHost>\n\
    ```\n\nThe most important elements here are the Listen option and the options\
    \ defined within the <VirtualHost _default_:443> </VirtualHost> tags. By default,\
    \ the secure site is hosted as a予以 (which is nice because it allows you to run\
    \ alongside other insecure sites). We cover virtual hosts later in this chapter.\n\
    \nYou should also take note of the following options:\n\n```\nSSCertificateFile\
    \ /etc/pki/tls/certs/localhost.crt\nSSCertificateKeyFile /etc/pki/tls/private/localhost.key\n\
    ```\n\nThey define the options and locations of your certificate file and key,\
    \ which are used when hosting a secure website. Although the default works will\
    \ work, if you change the IP address or domain name, you will need to generate\
    \ a new certificate and key. Installing the crypto-utils package provides you\
