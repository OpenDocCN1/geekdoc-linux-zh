  md: '# Working with NAT


    One final use for iptables is network address translation (NAT). This allows you
    to use a server as a gateway to a subnet, essentially controlling what goes in
    and out of your network. You actually use this in the lab so that all systems
    can use RHEL01 as a gateway to get in and out of the private network.


    Earlier, we discussed the syntax of iptables:


    ```

    Syntax: iptables [options] [chain] -j [target]

    ```


    However, there is actually one extra piece to this, the table type:


    ```

    Syntax: iptables -t [table-type] [chain] -j [target]

    ```


    The reason I left out table-type filter originally is that there are two types
    of filters: filter and nat. By default, a filter type table is used, which is
    why you don''t have to specify it. Because you''re working with NAT, however,
    you need to specify the table type along with iptables rules based on what type
    of rule you need. Destination NAT (DNAT) uses the PREROUTING chain to manipulate
    the destination IP address. Source NAT (SNAT) uses the POSTROUTING chain to manipulate
    the source IP address. With SNAT, packets are adjusted before they are routed.
    You need to create a rule that allows all your clients on the internal network
    to communicate with the outside world.


    +   Step 1. Use the following rule to implement NAT for the internal network:


    ```

    # iptables -t nat -I PREROUTING -o eth0 -s 172.168.1.0/24 -j MASQUERADE

    ```


    The interface eth0 contains the outside network IP address (for me). The internal
    network is 172.168.1.0/24 (which is configured on eth1). This rule allows clients
    on the internal network to point to this system (RHEL01) as the default gateway
    and have their requests for outside traffic, such as a web page or package download,
    forwarded to the correct external network. You also need to make an adjustment
    to the kernel for this NAT rule to function properly.


    +   Step 2. Make the following change to the kernel:


    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    The preceding change is valid until the system is rebooted, however. If you want
    the kernel parameter change to become permanent, you need to modify the kernel
    parameter on boot. Make sure that you save and restart the firewall service for
    the changes to take effect.'
