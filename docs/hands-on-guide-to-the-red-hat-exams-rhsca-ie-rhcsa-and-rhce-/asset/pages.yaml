- img_proc: true
  md: 'While fdisk is more common, it is slowly being replaced by parted, which is
    more flexible. You can also use cat to check the output of various files on the
    /proc file system for information. The /proc file system is created by the kernel
    when the system boots and holds current information about the system (you learn
    more about the /proc file system in Chapter 10, “The Kernel”).


    To view information about the current partition layout, use the following command:


    ```

    # cat /proc/partitions grep hda

    8 0 20971520 hda

    8 1 512000 hda1

    8 2 20485496 hda2

    8 16 8388608 hdb

    8 32 8388608 hdc

    8 48 8388608 sdd

    ```


    If you are using SCSI disks of IDE disks, you can just change the command to


    ```

    # cat /proc/partitions grep sd

    ```


    As you can see from the output, you get a listing of four different disks: hda,
    hdb, hdc, and hdd.


    > NOTE: The first two letters represent whether the disk is a SCSI (sd) or IDE
    (hd) disk. The third letter represents which disk it actually is. If there is
    a number after the three letters, it is the number of the partition. For the lab,
    you can see that they are all hd disks, meaning they are IDE. There are also four
    physical drives: a, b, c, and d. Because no partitions are created yet on the
    last three disks (hdc, hdc, and hdd), there are no numbers. Meanwhile, you can
    see hda has three partitions.


    In this case, you want to partition the last three disks, so you need to view
    your current partitions to see if any exist. You can use the fdisk command to
    accomplish this.


    Syntax: fdisk [options] [device]


    Options:


    +   -b Specifies the sector size of the disk

    -h Specifies the number of heads on the disk

    -l Lists current partition tables'
