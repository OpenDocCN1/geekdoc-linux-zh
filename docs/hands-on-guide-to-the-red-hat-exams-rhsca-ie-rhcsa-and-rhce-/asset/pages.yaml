- img_proc: true
  md: '# Step 7. Now you should be able to unmount the file system:


    ```

    # umount /opt/backup

    ```


    **WARNING:** By killing all the open connections, you are essentially terminating
    anything that users have open. If they are working on something that has not been
    saved (such as a Word or PowerPoint document), all the changes are lost. It’s
    good practice to send out notifications to users to alert them when file system
    maintenance will occur; that way, they are responsible for saving and closing
    all their documents beforehand.


    Now you know how to unmount file systems, but there is something else you need
    to look at. If you reboot your system right now, all the file systems you just
    mounted will no longer be available when the system comes back up. Why? The mount
    command is not persistent, so anything that mounted with it will no longer be
    available across system reboots. I suppose you want to know how to fix that, right?
    The system looks at two config files. One deals with the mounting of file systems
    during the boot process, and the other keeps track of currently mounted systems:


    +   - /etc/mtab Contains a list of all mounted file systems

    - /etc/fstab Mounts all listed file systems with given options at boot time


    Let’s look at /etc/mtab file every. Every time you mount or unmount a file system,
    this is updated to always reflect what is currently mounted on the system.


    # Step 1. View the /etc/mtab file:


    ```

    # cat /etc/mtab

    /dev/mapper/vg_rhel01-lv_root / ext4 rw 0 0

    /proc /proc rw 0 0

    sysfs /sysfs rw,=5,mode=620 0 0

    devts /dev/pts devpts rw

    tmpfs /dev/shm rw,rootcontext="system_u:object_r:tmpfs_t:s0"

    0 0

    /dev/sda11 /boot ext4 rw 0 0

    none /proc/sys/fs/binfmt_misc binfmt_misc rw 0 0

    sunspc /var/lib/nfs/rpc_ppefs rpc_ppefs rw 0 0

    /dev/hdb1 /opt/company_data ext4 rw 0 0

    /dev/hdc1 /opt/backup ext3 rw 0 0

    ```


    # Step 2. You can query to check whether a particular file system is mounted with
    the grep command:


    ```

    # cat /etc/mtab | grep backup

    /dev/hdc1 /opt/backup ext3 rw 0 0

    ```'
  merge: -1
