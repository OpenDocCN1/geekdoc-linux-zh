    is useful if you want to map multiple NFS resources to a client without needing
    to create an individual mapping for each one, but this is not a good idea if you
    have multiple NFS servers with many resources. Using autofs isn''t too hard but
    requires a little practice to make the mounts automated the way you''d like them
    to be.


