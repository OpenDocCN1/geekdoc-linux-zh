    \ DNS settings for Client01:\n\n```\n# cat /etc/resol.conf\nsearch example.com\n\
    nameserver 172.168.1.1\n```\n\n# BIND Security\n\nThe BIND DNS server offers plenty\
    \ of ways in which to make your DNS server more secure. When you are editing your\
    \ /etc/named.conf file, there is a section where you can define options that you'd\
    \ like to use with the server. I purposely left some options at the beginning\
    \ of this chapter so to show the security provide by adding them in. You can create\
    \ a more refined list of hosts and subnets that you'd like to allow to perform\
    \ actions or tasks against your DNS server.\n\nThe first option you can use is\
    \ listen-on, which defines the port and IP address(es) that your server will listen\
    \ on. This limits the subnets on which the DNS server can be reached from. You\
    \ can also use the allow-query option to limit which subnets even access to the\
    \ DNS server to begin with. A third option, allow-transfer, defines the slave\
    \ servers that are allowed to query data from the master and transfer its zone\
    \ file. This should not be allowed from any other host on your network.\n\nHere\
    \ is part of the /etc/named.conf file:\n\n```\n/ Global options for the BIND Server\
    \ */\noptions {\n  listen-on port 53 { 172.0.0.1; 172.168.1.1; };\n  allow-query\
    \ { 172.0.0.1; 172.168.1.0/24; }\n\n  allow-transfer { 172.168.1.2; }\n\n  directory\
    \ \"var/named\"; // the default\n  dump-file \"data/cache_dump.db\";\n  statistics-file\
    \ \"data/named_stats.txt\";\n  memstatistics-file \"data/named_mem_stats.txt\"\
    ;n}\n```\n\nAlthough being able to query from any system on the network might\
    \ seem convenient, it can become a huge pain to remember IP addresses and subnets\
    \ that are all"
  merge: -1
