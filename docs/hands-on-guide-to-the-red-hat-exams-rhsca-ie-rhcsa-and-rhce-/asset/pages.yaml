    # Switching Accounts


    With all these user accounts floating around, someone is bound to run into a problem
    or later. Being able to switch accounts is most useful when you''re troubleshooting
    some specific problem a user has or if you want to show a user how to do something.
    The commands you have available are as follows:


    +   - su Enables you to run a command as another user or switch user accounts

    - sudo Enables you to run a command as the root user


    Suppose you are logged in as user02, but user03 is having trouble executing a
    command. You can switch over to user03''s account to check that the command is
    able to run and the problem is not just a user error.


    To switch accounts, use this command:


    ```

    # su user03

    Password:

    ```


    Enter the password for user03, and you are logged in as that user. When you are
    finished, you can use the exit command to leave user03''s account and return to
    your own account. If your user account is authorized, you can also log in as the
    root user using the command:


    ```

    # su -

    Password:

    ```'
