    # # Task 1 – The First Partition


    +   Step 1. Disk /dev/hdb RHEL01 needs to be partitioned. Use the following guidelines
    while partitioning the disk:

    a. There should be three partitions on this disk.

    b. The first and second partitions should both be 2GB in size.

    c. The third partition should consume the rest of the disk space.

