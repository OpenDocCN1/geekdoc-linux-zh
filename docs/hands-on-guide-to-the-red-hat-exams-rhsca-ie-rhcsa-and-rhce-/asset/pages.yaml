    # Answers to Review Questions


    +   1. Stage 1: During this stage, the primary bootloader is read into memory
    by the BIOS from the MBR. Stage 1.5: During this stage, the bootloader is read
    into memory by stage 1 bootloader (only if necessary). Stage 2: During this stage,
    the bootloader reads the operating system or kernel.


