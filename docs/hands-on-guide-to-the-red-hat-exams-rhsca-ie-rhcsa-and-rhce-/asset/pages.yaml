    # Configuring NFS


    The NFS and rpcbind services both control a number of daemons on the system\when
    they are started. Let''s look at the different daemons these two services are

    composed of:


    +   - rpcbind forwards incoming requests to the appropriate subservice

    - rpc.idmap Maps the UID and GID to users and groups

    - rpc.lockd manages file locks and releases in case of client disconnect

    - rpc.nfsd Responds to client requests for file access

    - rpc.quotad Provides statistics on disk quotas to clients

    - rpc.statd Works with rpc.lockd to provide recovery services


    Let''s look at the config files that you will be dealing with:


    +   - /etc/sysconfig/nfs contains the main config files for the NFS service

    - /etc/exports contains a list of resources that will be exported (made available)
    to clients


    Here are some additional files that you will use when working with NFS:


    +   - /var/lib/nfs/stab contains a list of currently exported resources

    - /var/lib/nfs/rtab contains a list of remotely mounted resources


    For the first configuration step, you need to make a few changes to the main con-

    file.


    Step 1. Open the main config file for editing:


    ```

    # nano /etc/sysconfig/nfs

    ```'
