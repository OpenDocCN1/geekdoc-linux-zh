    # Squid Web Proxy


    A proxy server is a device that usually sits between a client and the destination
    the user is trying to reach. It can provide security, anonymity, and even protection
    for the client behind the proxy. To help in this process is Squid, which is a
    proxy server for Red Hat. It sits between the client and server that the user
    is trying to connect to. Many times these devices are used when you want to control
    access to the Internet (think web filtering). As a proxy, it can also cache data
    that users request from the Web and make it locally available, reducing the load
    on'
