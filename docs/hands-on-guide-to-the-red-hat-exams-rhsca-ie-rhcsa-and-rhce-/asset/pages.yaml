    # Managing a Virtual Client


    Much as you can create virtual guests, you also need to manage them after they
    have been created. Management includes tasks such as starting/stopping, rebooting,
    taking a snap-shot (also called saving), and migrating. These tasks can all be
    accomplished through the virt-manager utility, but on the command line, you can
    use the virt command.'
