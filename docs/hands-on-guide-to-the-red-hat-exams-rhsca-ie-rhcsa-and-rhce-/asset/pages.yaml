    Ensure that the service starts on system boot:


    ```

    # chconfig vsftpd on

    ```


    Verify the service starts at boot:


    ```

    # chconfig vsftpd --list

    vsftpd 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```


    # Configuring vsftpd


    To start the configuration of the FTP server, you need to look at the main config
    file; it''s located at /etc/vsftpd/vsftpd.conf, which is where you configure the
    settings of the FTP server.


    Step 1. Look at which options are available in the config file:


    ```

    # grep -v # vsftpd.conf

    anonymous_enable=YES

    local_enable=YES

    write_enable=YES

    local_mask=022

    dirmessage_enable=YES

    xferlog_enable=YES

    connect_from_port=20=YES

    xfer_log_format=YES

    listen=YES

    pam_service_name=vsftpd

    userlist_enable=YES

    tcpppers=YES

    ```


    Step 2. Now let''s go over each of these options can be used for:


    anonymous_enable=YES

    The default; sets security, allow that it should be changed

    to NO for better host-based security


    local_enable=YES

    Allow local users to log in'
