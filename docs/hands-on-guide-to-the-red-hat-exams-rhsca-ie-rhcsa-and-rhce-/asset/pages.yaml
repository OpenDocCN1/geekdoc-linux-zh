    # Virtual Hosts


    One of the big benefits of Apache is that you can run multiple websites on a single
    host. This is done through a virtual host configuration, where you can define
    different sites in your main Apache config file. We have have already discussed
    the global options and main server options in the main config file. The third
    section deals with virtual host options:


    +   - NameVirtualHost Specifies the hostname or IP address for the virtual host

    - ServerAdmin Indicates the email address for the webmaster

    - DocumentRoot Defines the directory for the virtual host files

    - ServerName Defines the URL for the virtual host'
