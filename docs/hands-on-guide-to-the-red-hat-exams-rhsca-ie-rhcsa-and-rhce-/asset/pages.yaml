    tpdate-4.2.4p8-2.e16.x86_64


    +   Step 3. Make sure that the service will start when the system boots up:

    # chkconfig ntppd on


    +   Step 4. Verify the service starts on boot:

    # chkconfig ntppd --list

    tppd 0:off 1:off 2:on 3:on 4:on 5:on 6:off


    Before starting the service, let''s configure the system.


    # Configuring NTP


    To configure the primary NTP server, let''s look at part of the config file that
    comes with the system:


    ```

    # cat /etc/ntp.conf

    ...

    server 0.rhel.pool.ntp.org

    server 1.rhel.pool.ntp.org

    server 2.rhel.pool.ntp.org

    ...

    #server 127.127.1.0

    #fudge 127.127.1.0 stratum 10

    ```'
