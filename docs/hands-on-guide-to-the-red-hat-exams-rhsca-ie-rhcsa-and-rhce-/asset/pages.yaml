- img_proc: true
  md: 'Next, set the setuid bit:


    ```

    # chmod 4755 reporting_script

    ```


    You could also use the following:


    ```

    # chmod u+s reporting_script

    ```


    Now view the permissions of the file:


    ```

    # 11

    total 12

    -rwxr-xr-x 1 user01 user01 0 Jun 17:20 reporting_script.sh

    ```


    In the file''s owner permissions, notice that there is s in place of the x. This
    shows that this file has the setuid flag set. Even if you''re logged in as user02,
    you can still run this command as though you are user01.


    # REAL-WORLD TIP


    Although the example we looked at works properly, you can''t use the setuid bit
    on scripts owned by the root user. You can, however, use it on binaries owned
    by the root user.


    # REAL-WORLD TIP


    As a security tip, you can search your entire system for all files with the setuid
    bit to see what your users have access to run as another user.


    To find setuid files, use the following:


    ```

    # find -perm 4000

    ```


    Next, let''s look at setgid, which is similar to setuid but set at the group level
    instead. With this bit, all users of the group are able to execute the file instead
    of just the user who owns it. The setgid allows users to collaborate on files.
    Let''s create a directory for users to share and then assign it the correct permissions.


    **Step 1.** As root, create the directory:


    ```

    # mkdir /tmp/Sales

    ```


    **Step 2.** Create the group and add users to it:


    ```

