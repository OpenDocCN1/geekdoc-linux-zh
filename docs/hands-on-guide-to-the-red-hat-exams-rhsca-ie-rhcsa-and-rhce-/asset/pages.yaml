    # Pluggable Authentication Module


    Pluggable Authentication Module (PAM) includes a set of dynamically loadable libraries
    that can be used to enforce security on the system. It does this by using a set
    of configuration files that check for different criteria (depending on the application
    or service being called). These config files are located in /lib/security for
    32-bit systems and /lib64/security for 64-bit systems. Here are some of the available
    library modules:


    ```

    # ls /lib/security

    pam_access.so pam_odddij_mkhomedir.so

    pam_creds.so pam_passwdqc.so

    pam_chroot.so pam_permit.so

    pam_console.so pam_pkcs11.so

    pam_cracklib.so pam_postgresql.so

    pam_debug.so pam_whistory.so

    pam_deny.so pam_rosthosts_auth.so

    pam_echo.so pam_rosthosts.so

    ```


    Although this is not the full list, you can tell what some of these modules are
    by just looking at their names. If a service make use of PAM, you can find a config
    file available in the /etc/pam.d directory. Again, there are many files located
    here that you can work with. To work and make use of PAM, you need to understand
    how the config files work.


    # Securing Access


    Each config file contains four columns using the following:


    ```

    module_type control_flag module_name [arguments]

    ```


    Further breaking down different options, there are four different module types
    used as a security mechanism:'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Hands-on Guide to the Red Hat® Exams: RHCSSA™ and RHCE® Cert Guide and Lab
    Manual


    | auth | Establishes identity |

    | account | Allows or denies access |

    | password | Manages password policies |

    | session | Applies settings to an application |


    There are also five different control flags that determine the action to take
    based on success or failure:


    +   - required | Proceeds if passed; continues even on fail

    - requisite | Stops on failure

    - sufficient | Requires no other verification if true

    - optional | Ignores success or failure

    - include | Includes module-type directives from another file


    The third column is a name of a file that should be called the dynamic library
    file, including any optional arguments as well. Let''s look at one of the config
    files as an example:


    ```

    # cat /etc/pam.d/reboot

    #%PAM-1.0

    auth      sufficient pam_rootok.so

    auth      required pam_console.so

    #auth     include   system-auth

    account   required pam_permit.so

    ```


    This PAM config file handles who reboot the system. pam_rootok.so module, which
    returns true if the user calls the command as the root user. If you are root user
    because of the “sufficient” control flag, no requirements are necessary and the
    system reboots. If you are not the root user, the next line is: it checks to you
    are logged in the console. The logic here is that if you wouldn''t want to reboot
    the system and come it in an unstable state without having physical console access.
    If this is the case, the final line is called (pam_permit.so), which always returns
    true so the system will reboot.


    PAM modules and their config files aren''t hard to use, but knowing how to read
    and what they mean can take some practice. Make sure you understand the module
    types and control flags.'
