  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    # MIGRATION TIP


    In RHEL5, the NFS service is blocked by default because of SELinux protection.
    You need to make a change to a single Boolean to disable SELinux protection to
    the service.


    Step 1. Query for the Boolean value you need to change:


    ```

    # getsebool -a | grep nfsd_dis

    nfsd_disable_trans -- off

    ```


    Step 2. Disable SELinux protection:


    ```

    # getsebool -P nfsd_disable_trans=1

    ```


    Step 3. Verify that the Boolean has changed:


    ```

    # getsebool -a | grep nfsd_dis

    nfsd_disable_trans -> on

    ```


    Your basic security requirements should be taken care of. The SELinux Booleans
    have been set and firewall rules added. Let''s look now at additional security
    that you can provide for the NFS server.


    # NFS Security


    In NFS, much of the security is built in through other means. When you''re dealing
    with security, there are always two main areas to focus on: host-based security
    and user-based security. Let''s look at user-based security first.


    Because the resources that are exported from the server are just standard directories
    and files, they use common file permissions or ACLs that the system administrator
    provides. This means that it is important to set up permissions and test them
    when setting directory structures to export. From these standard permissions,
    there isn''t anything else that needs to be covered from a user-based security
    perspective.


    For host-based security, there are some features you can use for NFS. Table 15-2
    shows some of the options that can be used on NFS shares.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Table 15-2 Options for NFS Shares


    | Mount Options | Description |

    | --- | --- |

    | ro | Sets the exported file system as read-only |

    | rw | Sets the exported file system as read/write |

    | sync | Prevents the NFS server from replying unless the changes are written
    to disk |

    | wdelay | Delays the NFS server from writing to the disk if it suspects another
    write quest is imminent |

    | root_squash | Prevents root users connected remotely from having root privileges
    |

    | noexec | Prevents execution of binaries on mounted file systems |

    | nosuid | Disables set-user-identifier or set-group-identifier bits |


    You can also use access control lists (ACLs) in conjunction with NFS to restrict
    access to certain hosts. This can also be accomplished with firewall rules depending
    on which method you''re comfortable with. Make sure that you restrict access to
    clients that need access to NFS shares. Also, make sure that you use the root_squash
    command if you can because it prevents other users with root permissions from
    causing trouble on your NFS shares.


    # Troubleshooting NFS


    There are three management commands that help with troubleshooting NFS from both
    the server and client sides:


    +   * mountstats Shows information about mounted NFS shares

    * nfsstat Shows statistics of exported resources

    * nfsostat Shows statistics of NFS mounted shares


    > MIGRATION TIP

    The mountstats and nfsostat commands are available only under RHEL6.'
