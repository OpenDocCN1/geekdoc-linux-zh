- img_proc: true
  md: '# Troubleshooting SSH


    When it comes to troubleshooting SSH, the service tends to either work or not
    work. A key part of working with SSH is also being able to troubleshoot it. The
    first place to always look with SSH is the log file located /var/log/secure. This
    file should provide you with any information as to why you cannot connect to a
    remote machine. If you run into errors about the host refusing the connection,
    the problem is most likely something blocking your connection. This could be due
    to the service not running, firewall rules being incorrect, or extra security
    measures such as TCP Wrappers. Another common error that occurs often when testing
    is the remote key of the server changing. If the key changes on the remote host,
    you have a big warning message:


    ```

    @@ WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED! @@

    ```


    IT IS POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY! Someone could be eavesdropping
    on you right now (man-in-the-middle attack)! It is possible that the RSA key has
    just changed.


    If this is the case, you can open the ~/.ssh/known_hosts file to edit or delete
    the containing_key that has changed.


    > WARNING: The known_hosts file contains ONE key PER line!


    The reason I''m warning you that is not all displays are long enough to display
    the full length of the key, they wrap it, giving the illusion of a multiline key.
    It would not be a good thing to try to delete the four- or five-line key from
    this file in the nano text editor because you would actually end up erasing everything
    low.


    # SSH Security Revisited


    The previous section describes ways to set up an SSH server, configuration, and
    some ways to make SSH more secure. Here, we look at two additional steps that
    can be added to the SSH server to increase security further. These features are
    key authentication and port forwarding. With key authentication, users have a
    private key (on their client machines) and a public key (on the server that they
    want to connect to). When a user tries to log to the server, the two keys are
    used (with an optional passphrase) to allow the user to log. This provides additional
    security because it requires you to not know a user''s password, but also a copy
    of that user’s private key. With port forwarding, you can set up a management
    gateway requiring you to connect to the gateway first before connecting to any'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'additional servers within the network. This provides for centralized administration
    of logins and good auditing.


    # Public/Private Keys


    To start the key authentication process, I''d like to point out a few things:


    +   - ~/.ssh/id_rsa Your private key

    - ~/.ssh/id_rsa.pub Your public key

    - ~/.ssh/authorized_keys Place on the server where the public key is


    When creating your keys, you can specify either DSA or RSA encryption. For this
    example, use RSA. The ssh-keygen command enables you to create a set of keys with
    the SSH service.


    # Step 1. Generate the keys on Client02 as user01:


    ```

    # ssh-keygen -t rsa

    Generating public/private RSA key pair.

    Enter file in which to save the key (/home/user01/.ssh/id_rsa):

    [Press Enter]

    Created directory ''/home/user01/.ssh''

    Enter passphrase (empty for no passphrase): [Enter a STRONG password]

    ter same passphrase:

    Your identification has been saved in /home/user01/.ssh/id_rsa.

    Your public key has been saved in /home/user01/.ssh/id_rsa.pub.

    The key fingerprint is

    f8:a2:d3:e9:b5:e2:a4:3b:50:01:7e:23 user01@Client02

    ```


    Here, you can see both the private and public keys being generated. You should
    now have an .ssh directory in user01''s home directory. Now you need to copy the
    public key (id_rsa.pub) over to the server so you can use it to log in. There
    is actually a nice little thing that can do for you.


    # Step 2. Copy the public key to RHEL01 as user01:


    ```

    # ssh-copy-id -i ~/.ssh/id_rsa.pub RHEL01

    29nThe authenticity of host ''rhel01 (172.168.1.1)'' can''t be established.

    RSA key fingerprint is

    Sa:28:dc:c7:e1:5a:3d:f4:b1:99:05:1f:5f:ac:46:bc.

    Are you sure you want to continue connecting (yes/no)? added ''rhel01'' (RSA)
    to the list of known hosts

    ```


    Now logging into the machine, with "ssh ''RHEL01''", and check in:


    ```

    .ssh/authorized_keys

    ```


    to make sure we''ve added extra keys that you''re expecting.'
  merge: -1
