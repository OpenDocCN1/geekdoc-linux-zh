    Each file, directory, and service on your system has a context that is to prevent
    or allow actions (see Figure 11-1). SELinux uses these contexts along with Boolean
    values to permit certain actions or services


    ```

    root@RHEL6 # ls -Z /home/user0

    drwxr-xr-x user root unconfined_u:home_r:home_s

