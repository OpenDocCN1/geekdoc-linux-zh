    # NTP Security


    Security with NTP is predefined for you in the config file when you''re setting
    up an NTP server. Again, let''s look through part of the /etc/ntp.conf file. Notice
    the following two lines:


    ```

    restrict default kod modify notrap nopeer noquery

    restrict 127.0.0.1

    ```


    These security settings prevent access from any other time server making changes.
    They also restrict the interface to performing administrative duties on the local
    loopback. The options listed below are the following:


    +   - kod Prevents “kiss of death” packets

    - modify Prevents other time servers from making changes

    - notrap Disables messages from being trapped

    - nopeer Prevents other systems from becoming an NTP peer with the server

    - noquery Disallows queries from other NTP servers


    All options provide better security but sometimes may restrict certain functionality.
    You can remove any options you don''t want to have an effect on the NTP server.
    This file is also a great place to look when you''re troubleshooting to see if
    one of these options is preventing a sync of information to your NTP server. If
    you want to add to another administrative interface, you can simply add a restrict
    option to the /etc/ntp.conf file:


    ```

    restrict 172.168.1.0 mask 255.255.255.250

    ```


    Now you can make changes and manage this NTP server from any system on the local
    subnet. Don''t forget to restart the NTP service if you make any changes.'
