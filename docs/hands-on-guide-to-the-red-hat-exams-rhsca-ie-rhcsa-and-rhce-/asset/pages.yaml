- img_proc: true
  md: '# Answers to the Review Questions


    +   1. False. The virt-install package allows you to manage virtual machines via
    the command line. The virt-manager package allows you to manage virtual machines
    via a GUI interface.

    2. False. You must dictate the amount of RAM you want allocated to your virtual
    machine when you create it.

    3. The virsh command is used to manage virtual guests.

    4. This command reboots virtual guest Client04.

    5. After you connect to a hypervisor, you can use virsh list —all to list all
    virtual guests.


    # Lab 22


    # Task 1 – KVM


    +   Step 1. Open the GRUB config file in any text editor.

    Step 2. Add a new entry to the config file:

    na. The new entry should have the title Red Hat Recovery

    b. The new entry should not be the default.

    c. The recovery entry should allow you toot boot into recovery mode.

    Step 3. Change the timeout of the boot selection to 10 seconds.


    The task is complete when the system boots with both entries in the GRUB menu
    and they both work correctly.


    # Task 2 – Boot Issues


    +   Step 1. Make sure you have your Red Hat installation CD available. Delete
    the /etc/initstab file, and reboot the system.

    You will receive an error message that the system can''t find the file.

    Step 2. Boot from the Red Hat installation CD into recovery mode.

    Step 3. Replace the file from the CD into the correct location on the system.

    Step 4. You may need to use the command mount /dev/cd-rom /mnt to access the CD
    drive.


    The task is complete when the system boots up again.'
