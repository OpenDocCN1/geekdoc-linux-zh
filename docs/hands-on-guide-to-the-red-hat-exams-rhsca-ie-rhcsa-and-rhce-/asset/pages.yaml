  md: '# REAL-WORLD TIP


    You can log in to the root user account using the su command with no parameters.
    So what is the difference between su and su - The su command moves you into the
    root user''s account without initializing any of root''s path or shell variables.
    When you use su -, everything is initialized as if you were logging in from the
    console.


    After you enter the root password, you are logged in as the root user.


    Suppose, however, that you don''t want to become the root user, but you need to
    run a command with elevated privileges for it to work. You can use the sudo command
