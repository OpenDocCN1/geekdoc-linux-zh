    # Network User Authentication


    As mentioned at the beginning of this chapter, there are services LDAP that allow
    you to store your users and passwords in a central location. The current exams
    require that you are able to connect clients (servers or desktops) to a network
    directory service for network authentication to occur. This is easy because the
    servers will be in place for you to connect. There are a ways that you can go
    about connecting to a network directory, and there are two types of servers to
    connect. As far as commands go, you need to know only:


    +   authconfig-tui A menu-based configuration utility for network authentication
    clients


    +   authconfig A command-line version of authconfig-tui


    Here we only the authconfig-tui utility because it is faster to use and time is
    limited on the exam. If you''re interested in scripting or adjusting more options,
    you can look further into the authconfig command on your own.'
