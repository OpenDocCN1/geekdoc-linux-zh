  md: '# System Initialization


    The boot process can be quite complex if you have never worked with it before.
    That being said, it is important to understand so that you can troubleshoot the
    system should it not boot properly. When a computer boots up, the BIOS is the
    first program that runs. After it is loaded, the BIOS begins to test the system
    through the Power On Self Test (POST) and starts loading peripheral devices. The
    BIOS then looks for the boot device and passes control to it. The boot device
    contains the master boot record (MBR), which starts to boot the system via the
    bootloader. From here, the Grand Unified Bootloader (GRUB, the boot manager) looks
    to boot the kernel that is labeled as the default. Finally, the kernel calls the
    init process (the first process to be spawned on a Linux system), which boots
    up the rest of the system. Aside from troubleshooting the boot process, you also
    need to understand how services are started and stopped, and how to add system
    services to the boot process, and how to manage the bootloader itself.


    # The Boot Process


    Let''s look again at the boot process, but this time we can examine each area
    in depth, starting with the GRUB bootloader. The Grand Unified Bootloader has
    the default bootloader for Red Hat, Ubuntu, and many other versions of Linux as
    well. The bootloader can be used to boot into different operating systems (usually
    called a *multiboot system*), for system recovery, and to boot the kernel using
    special arguments. When GRUB loads, you are given a list of kernels and additional
    operating systems (if available) from which you can choose to boot (see Figure
    2-1).


    By default, there is a configurable 5-second timeout value that chooses the default
    kernel if you don''t make a selection and the timeout threshold is reached.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '![](img/3ac10b03127f2296ea10a3f4cc885db7_32_0.png)


    **Figure 2-1** GRUB boot selection.


    # REAL-WORLD TIP


    Although the default is 5 seconds, some older video cards take just 5 seconds
    to display the screen. I recommend that you set the default to at least 5 seconds
    and 10 for older systems.


    After GRUB loads the kernel, it passes control over to the kernel, which in turn
    begins initialize and configure the computer''s hardware. Depending on how your
    GRUB configuration file is set up, you may or may not see anything during this
    process. There is a "quiet" option in GRUB that hides this process from the user
    (using a graphical of some sort is shown in its place, as the Red Hat logo). During
    the boot process, everything is logged to the /var/log/dmesg file. You can also
    use the dmesg command to query information about the boot process after the system
    has booted. When the system''s drivers are in place, the kernel executes /sbin/init
    process.


    # REAL-WORLD TIP


    Although the Red Hat exams do not test on hardware, you can use the lsmod command
    to troubleshoot in the real world if you are having a hardware problem.


    # GENERAL INFO


    In Red Hat 6, the boot process has been replaced by a new utility called Upstart
    instead of the traditional SysV Init style scripts. This utility decreases the
    time that it takes the system to boot and is already being used on other versions
    of Linux such as Ubuntu.'
  merge: -1
