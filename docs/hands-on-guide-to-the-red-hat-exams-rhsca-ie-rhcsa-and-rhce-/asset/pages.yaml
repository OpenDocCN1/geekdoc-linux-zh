  md: "334 Hands-on Guide to the RH Hat® Exams: RHSA™ and RHCE® Cert Guide and Lab\
    \ Manual\n\n# # Apache Security\n\nIn the previous section, we addressed the firewall\
    \ rules and SELinux policy changes to get the httpd service working. This section\
    \ goes in depth with Apache security because it is such a large topic. For the\
    \ exam and particularly in the real world, you need to be able to configure host-based\
    \ and user-based security for Apache. You are also required to set up a secure\
    \ website using the HTTPS protocol.\n\nHost-Based Security\n\nTo start, you can\
    \ limit the IP address on which the server can listen for incoming connections.\
    \ Use the Listen option to define an IP address and a port, usually 80. This capability\
    \ is helpful if you have multiple IP addresses because it allows access to the\
    \ IP address, and therefore that network, you specify.\n\nOn the RHEL01 system,\
    \ there are two IP addresses: 172.168.1.1 and 192.168.1.5. Let's configure this\
    \ Apache server to allow clients to access it only from the 172.168.1.0/24 network:\n\
    \nListen 172.168.1.1:80\n\nNow RHEL01 will listen only on the 172.168.1.1 IP address\
    \ on port 80 for incoming requests.\n\nNext, let's look at the <Directory> section,\
    \ which holds options pertaining to the main server config. Within this section,\
    \ the first thing you do is restrict the network, IP addresses, or domains that\
    \ have access to the web server. In the <Directory> section, let's set up Allow\
    \ from Deny from options.\n\n+   - **Step 1.** Allow all hosts to connect:\n \
    \ Allow from all\n\n+   - **Step 2.** Allow only a specific IP or host, use the\
    \ following:\n  Allow from 172.168.1.2\n\n+   - **Step 3.** You could also use\
    \ the hostname:\n  Allow from RHEL02\n\n+   - **Step 4.** You can also specify\
    \ a domain:\n  Allow from .example.com\n\n+   - **Step 5.** The deny options work\
    \ in the same manner. To deny from a whole subnet, use the following:\n  Deny\
    \ from 192.168.1.1"
  merge: -1
  pgno: 316
- img_proc: true
  md: 'WARNING: There are two things to watch out for here. First, when you specifying
    a domain to allow or deny from, make sure you include the leading dot (.); otherwise,
    the restriction deny won''t work properly. Second, when you specify a subnet,
    there is no ending dot (.) or last caret.


    After you determine the hosts you want to allow or deny access to your web server,
    you need to define which order they are applied in:


    +   - Order allow,deny Allows first and then denies everything else

    - Order deny, allow Denies first and then allows everything else


    Because the goal is to make the web server more secure, let''s use the first option,
    which denies everything by default. To finish the <Directory> section, let''s
    look at general options and the AllowOverride option. The default setup in the
    config file is pretty secure:


    +   - Options FollowSymLinks Allows indexing of directories and allows symlinks
    outside this <Directory> section

    - AllowOverride None Does not allow any normal user to make changes in DocumentRoot


    There are quite a few different option settings you can define here. I suggest
    spending some time in the main pages and the default config file, which contains
    detailed documentation to the different options for Apache.


    The complete <Directory> section now looks like this:


    ```

    <Directory> /var/www/html/

    Options Indexes FollowSymLinks

    AllowOverride None

    Order allow,deny

    Allow from 172.168.1

    </Directory>

    ```


    The options we just covered allow you to have a more secure server through hosted
    security. Don''t forget that these options are specific to this one <Directory>
    section and can be different in each section. If you want to define the defaults
    for any further subsections you want to have, you can define all options in your
    <Directory /> section, which is the default option.


    NOTE: By default, the httpd service runs with the following credentials:


    +   - User apache

    - Group apache'
  merge: -1
  pgno: 317
- img_proc: true
  md: "# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual\n\
    \nThis is a great default setting because it allows the httpd service to run only\
    \ as the Apache user. Should something on the server get compromised, the hacker\
    \ would be able to access only resources the Apache user has access to, which\
    \ usually isn't anything outside the web directories.\n\n# User-Based Security\n\
    \nNow that we have configured some host-based authentication, we can move on to\
    \ user-based authentication. This provides a way to allow only certain users or\
    \ groups to access the web server or portions of the web server. Here are the\
    \ options that can be used for based user security:\n\n+   - AuthType Defines\
    \ the authentication type\n- AuthName Adds a comment for the user to see on login\n\
    - UserFile Specifies the file used to define username and password\n- AuthGroupFile\
    \ Similar to the user file but for groups\n- Require Specifies the users or groups\
    \ that can log in\n\nLet's look at an example to make the usage of these options\
    \ more clear. Suppose you want to password protect the main site because it contains\
    \ information for human-resources (HR) that didn't get out.\n\n**Step 1.** Define\
    \ the following under the main server section in the config file:\n\n```\n<Directory\
    \ \"/var/www/html\">\n  AuthType Basic\n  AuthName \"Password Restricted Area\"\
    \n  AuthFile /etc/httpd/userfile\n  Require user user01\n</Directory>\n```\n\n\
    Now you can go over to the /etc/httpd directory and create a user to hold the\
    \ user accounts. You can use the htpasswd command to create the user and group\
    \ accounts.\n\n**Step 2.** Create the sole user who will need access to this site:\n\
    \n```\n# htpasswd -cm /etc/httpd/userfile user01\nNew password:\nRe-type new password:\n\
    Adding password for user user01\n```"
  merge: -1
  pgno: 318
- img_proc: true
  md: 'There are two important issues to note here. First, notice the -c option when
    calling this command, which creates the file and populates it with the first user
    and password. DO NOT use this option again when creating subsequent users; otherwise,
    it will completely overwrite the file and you will lose all users in the file.
    The second is the -m option, which uses MD5 encryption when writing the passwords
    to the file. You should always use this; otherwise, anyone will be able to see
    the username and password combo in clear-text!


    # Step 3.


    Restart the web server:


    ```

    # service httpd reload

    Reloading httpd: [ OK ]

    ```


    Access the main page by pointing your browser from any system on the 172.168.1.0
    /24 network to http://172.168.1.1/index.html. You should be prompted for a username
    and password. This is great now a secure main, and HR can begin posting documents.
    There is a problem, however. Suppose HR would like the site to be fully accessible
    to the company, for public news. They also want to have a section where only HR
    employees can go view things (like everyone''s salary). Not a problem. You can
    just make a few changes to make all this happen.


    # Step 4.


    First, open your main config file and change the <Directory> section:


    ```

    <Directory "/var/www/html">

    AllowOverride authconfig

    </Directory>

    ```


    Save your config file and navigate to your web directory structure.


    # Step 5.


    Here, create a new directory to hold the documents for the HR group:


    # Step 6.


    ```

    # cd /var/www/html

    # mkdir dir

    ```


    Now, you need to create a file called .htaccess that defines who has access to
    this per-directory because you are allowing this file to "override" the default
    access of anyone (this is why you change the AllowOverride option in the main
    config file).


    # Step 7.


    Enter the following into the file:


    ```

    # nano .htaccess

    AuthType Basic

    AuthName "Password Restricted Area"

    AuthGroupFile /etc/httpd/groupfile

    Require group hr_users

    ```'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    Like the user-defined access, this allows only users from the hr_users group,
    defined in the /etc/http/groupfile. Save this file and close it. The last step
    you need to add is a few user accounts for the HR users to the already-existing
    userfile and then allow the hr_users group file.


    Step 8. Create a user accounts:


    ```

    # htpasswd -m /etc/httpd/userfile hr01

    New password:

    Re-type new password:

    Adding password for user hr01

    ```


    ```

    # htpasswd -m /etc/httpd/userfile hr02

    New password:

    Re-type new password:

    Adding password for user hr02

    ```


    Step 9. In /etc/httpd/groupfile, add the following:

    hr_users: hr01 hr02


    Step 10. With everything in place, you can restart the web server:


    ```

    # service httpd reload [ OK ]

    Reloading httpd:

    ```


    Now if you try to access http://172.168.1.1/index.html, you will have no problem.
    This area is no longer password-protected. However, if you were to go over to
    http://172.168.1.1/test.html, you would be prompted for a username and password.
    You will also notice, however, that if you enter hr01 as the username, you are
    not able to access this area. The reason is that you used the Require group option,
    which requires a member of the hr_users group you defined.


    There is one other option that falls under security that you should be aware of
    in case it comes up on the exam. The option is called UserDir, and when it''s
    enabled, it allows users to browse and access the public_html directory within
    their home folder. This option can be useful if you each want to share some files
    over the Web, but I shouldn''t even need to tell you that a security issue is
    if left unchecked. By default, this option is disabled, and with good reason.


    If you need to be able to show content out of a user''s home directory for the
    exam, set the following option in the main config file:


    ```

    UserDir public_html

    ```'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'Then navigate to any user account on the system, create a public_html directory
    if it doesn''t exist, and set the appropriate permissions:


    ```

    # cd /home/user01

    # mkdir public_html

    # chmod 701 /home/user01

    # chmod 705 -R /home/user01/public_html

    ```


    > CAUTION: I can''t begin to stress the importance of not using this UserDir option.
    You would be allowing your user''s home directory to be world executable and public_html
    would be readable and executable. This just screams security problem! The only
    reason I cover it in this book is that you are aware of the option for the exam.
    In the real world, use caution when setting up this option!


    # Setting Up HTTPS


    Aside from normal websites, you can also have secure websites using the HTTPS
    protocol. Configuring websites in Apache is simple. If you haven''t already installed
    the mod_ssl package, you need to do so before anything else. When this package
    is installed, the /etc/httpd/conf.d/ssl.conf is added to your system. This file
    contains the configuration settings for your secure web server.


    Here is what the default file looks:


    ```

    # grep -v ^# /etc/httpd/conf.d/ssl.conf

    ```


    ```

    LoadModule ssl_module modules/mod_ssl


    Listen 443


    SSLPhraseDialog builtin


    SSLSessionCache shmbc:/var/cache/mod_ssl/scache(512000)

    SSLSessionCacheTimeout 300


    SSLMutex default


    SSLRandomSeed startup file:/dev/urandom 256

    SSLRandomSeed connect builtin


    SSLCryptoDevice builtin


    <VirtualHost _default_:443>


    ErrorLog logs/ssl_error_log

    TransferLog logs/ssl_access_log

    ```'
  merge: -1
  pgno: 321
- img_proc: true
  md: "# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab\
