  md: '# Troubleshooting


    This chapter is all about troubleshooting the system. Although there is no wrong
    or right way to go about accomplishing this, there are some common is- to look
    at. This chapter covers a variety of issues that could arise when you''re working
    or configuring services. This chapter is also written in a slightly different
    format, using a problem-and-answer style. Let''s get started.


    # Boot Issues


    Many issues can arise when you are working with the boot process of the sys- tem.
    Here are some of the common issues you might run into on the exam or in the real
    world.


    # Lost My Root User Password


    If you forget your root user password or you are taking over a system where the
    root password isn''t documented, you can still get into the system. You need to
    perform the following actions at the physical console of the system.


    +   Step 1. Boot into single-user mode by appending the command line during boot
    with the following:


    +   Step 2. When you are presented with a command prompt, change the user password:

    # passwd root

    Changing password for user root.

    New password:

    Retype new password:

    Passwd: all authentication tokens updated successfully.


    +   Step 3. Reboot the system and validate that the new root password password
    works correctly:

    # reboot'
