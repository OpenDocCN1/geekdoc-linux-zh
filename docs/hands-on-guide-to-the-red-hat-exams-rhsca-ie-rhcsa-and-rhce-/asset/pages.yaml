- img_proc: true
  md: '# Chapter 13: Remote Access 37


    When the public key is in place, you also need to adjust your main config file
    on the SSH server (RHEL01) to allow authentication via public/private keys.


    +   Step 3. In the sshd_config file, change the following two options:

    ```bash

    PasswordAuthentication no

    PubKeyAuthentication yes

    ```


    This change prevents users from logging on with anything but their public/private
    key combination.


    +   Step 4. Restart the SSH service for the settings to take effect:

    ```bash

    # service ssh restart

    Stopping sshd: [ OK ]

    Starting sshd: [ OK ]

    ```


    +   Step 5. Try to connect to RHEL01 as user01 from the Client02 host to ensure
    that the authentication is working properly:

    ```bash

    # user01@172.168.168.1.1

    user01@172.168.168.1''s password:

    Last login: Jun 3 06:22:12 2010 from 172.168.1.20

    [user01@RHEL01 ~]

    ```


    # Port Forwarding


    As already mentioned, port forwarding allows you to connect to a centralized gateway
    before forming additional connections within your network. This capability increases
    security by forcing connections to flow through a centralized gateway where auditing
    usually takes place to keep track of who is logged in. In this centralized management
    is accomplished through the use of port forwarding, where each connection is made
    to the gateway and then forwarded to another server.


    Syntax: ssh username@hostname -L local-port:remote-hostname:remote-port


    Let''s look at an example. Suppose on RHEL01 you want to create a port forwarding
    to RHEL01 and allow SSH connections to come only from RHEL01. You can use the
    following command to set up the tunnel on the initial tunnel to RHEL01:


    ```

    # user01@172.168.1.2 -L 1234:172.168.1.2:22

    ```


    After executing this command on RHEL01, you should now have a tunnel forwarded
    to RHEL02. Other users can use SSH locally on RHEL01 to be forwarded to RHEL02.


    Another example would be sending all traffic to a specific site:


    ```

    # ssh -N -L 8080:localhost:80 <site>

    ```'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    The -N keeps the SSH connection from being interactive. Now if you were to set
    up your browser to use a proxy connecting to a localhost on port 8080, you would
    be able to securely visit the site specified in the command. Although port forwarding
    is useful for quick testing or connections, there are actually great programs
    out there that allow for easier management and tunnel creation just using the
    command line.


    # VNC Servers


    Having remote access to a server is great, but what happens if an end user calls
    in says she''s having problems with her system? Chances she isn''t just using
    a shell and her desktop has somehow messed up. You don''t have to use SSH to fix
    the problem remotely because there is always an alternative: VNC. The VNC server
    allows you to remote into the user''s system and view her desktop. With the end
    user''s desktop view, you can more easily troubleshoot any issues she is having.
    Setting up a VNC server isn''t hard, and in fact, it sometimes comes pre-installed
    as part of a desktop package.


    +   **Step 1.** Install the vnc-server package on RHEL02:

    > # yum install -ty vnc-server


    +   **Step 2.** Query to make sure the package is installed correctly:

    > # rpm -qa | grep tiger

    tigervnc-server-1.0.90-0.10.20100115svn3945.el6.x86_64


    > MIGRATION TIP

    On RHEL6, the available VNC package is called tigervnc and tigervnc-server.

    On RHEL5 and earlier, a different package called vnc and vnc-server is available.


    > EXAM TIP

    The vino package, which is similar to vnc-server, provides the same functions
    through the Gnome Desktop Manager.


    With the packages installed, you need to adjust the two lines in the main config
    file telling the VNC server how to run.


    +   **Step 3.** View the default items:

    > # cat /etc/sysconfig/vncservers

    > # VNCSERVERS=:2="username"

    > # VNCSERVERARGS[2]="-geometry 800x600 -nolisten tcp -nohtttpd -nlocalhost"'
  merge: -1
