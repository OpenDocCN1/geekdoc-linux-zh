  md: 'The following list outlines what is contained in each file:


    +   - anaconda-ks.cfg Provides a kickstart file of the installation

    - install.log Lists all the installed packages during installation

    - install.log.syslog Stores messages generated during the installation


    The anaconda-ks.cfg file is actually a kickstart file created based on the details
    and selections made during installation. Later in the book, I talk about the kickstart
    file to automate installation. The next file, install.log, lists all the packages
    that were installed during installation. When you want to customize your system
    and cut down on the number of packages being installed, this is a good place to
    see what is being installed in the first place. Finally, install.log.syslog log
    files that offer more information about events during the install process. In
    the /tmp directory, you can also find a set of anaconda.* log files that offer
    more information about events during the install process. Usually, if something
    goes wrong during installation of the system, you know it right then and there.
    These files are good for troubleshooting, should you need them.


    # Summary


    This chapter described the installation of Red Hat. Although installing a Red
    Hat system from CD is no longer part of the exam, it is important to understand
    the concepts discussed here. Partitioning, system setup and post-installation
    tasks affect how the system runs post-installation. You should have an understanding
    of how the system is installed and how to verify it was installed correctly. In
    the coming chapters, we discussed partitioning such as RAID and LVM. Also in this
    chapter, we talked about viewing log files to verify that the installation was
    successful. In the next chapter, we dive deeper into how the boot process and
    system services work.'
