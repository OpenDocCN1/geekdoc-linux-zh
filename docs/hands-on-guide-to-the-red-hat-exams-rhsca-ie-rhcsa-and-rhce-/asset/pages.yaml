    # Adjusting the Size of LVM Partitions


    The best feature of LVM is that you can reduce or expand your logical volumes
    and volume groups. If you are running out of room on a particular logical volume
    or volume group, you can add another physical volume to the volume group and then
    expand the logical volume to give you more room.


    # EXAM TIP


    When you resize a logical volume that already contains a formatted file system,
    you need to grow the file system into the new space that becomes available. We
    discuss growing a file system in Chapter 4, “File Systems and Such,” but you should
    make a mental note if you are running this on itoms.


    To extend a logical volume, use the lxtend command.


    +   **Step 1.** Add 2GB to the SecretData logical volume:


    ```

    # lxtend -L +200G /dev/vg_group01/SecretData

    Extending logical volume SecretData to 4.88 GB

    Logical volume SecretData successfully resized

    ```


    +   **Step 2.** You could also create a new size instead of using the + to :


    ```

    # lxtend -L 600G /dev/VolGroup01/SecretData

    Extending logical volume SecretData to 5.86 GB

    Logical volume SecretData successfully resized

    ```


    Either of the preceding commands yields the same result. As a alternative, you
    could also use the lvisize command:


    ```

    # lvisize -L 700G /dev/VolGroup01/SecretData

