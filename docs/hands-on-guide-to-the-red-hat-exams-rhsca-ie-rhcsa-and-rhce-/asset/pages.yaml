- img_proc: true
  md: 'The first three lines shown here are the Internet (public) NTP servers that
    you sync with the correct time. The fourth server option, which is commented out,
    defines a local clock driver that you can use to update the time. This is usually
    based on the BIOS if used. The final option, fudge, defines the stratum level
    to which your server is set. The server here is at a stratum level of 10; a local
    system clock is also defined, and there are three public Internet servers you
    sync with accurate time.


    # MIGRATION TIP


    In RHEL6, the local server and fudge options are both commented out by default.


    For now, just let the system sync with the public Internet time servers.


    +   Step 1. Start the NTP service:


