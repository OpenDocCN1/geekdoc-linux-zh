    100021 4 tcp 32803 nlockmgr

    ```


    When you see the nfs daemon running, notice that only version 4 is listed. The
    reason is that you disabled all other versions in the config file. Although some
    of the other daemons used other versions as well, you should verify that at the
    nfs daemon shows version 4.'
