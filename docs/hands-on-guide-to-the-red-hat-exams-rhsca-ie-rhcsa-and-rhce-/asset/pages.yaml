  md: '# Chapter 18: DNS 40


    see here that you define a masters option, which is actually the master DNS server.

    The slave DNS server will periodically check with the master DNS server, pull
    down the data for a zone, and create the zone file if it doesn''t exist. The slave
    zone exists in the /var/named/slaves directory.


    **NOTE:** Make sure that your named.ca, named.localhost, and named.loopback files
    are in place on RHEL0.


    **Step 1.** With the files in place, you can check for syntax errors:


    ```

    # service named configfigtest

    zone localhost/IN: loaded serial 42

    zone 0.0.127-in-addr.arpa/IN: loaded serial 1997022700

    ```


    **Step 2.** Start the named service:


    ```

    # service named start

    Starting named: [ OK ]

    ```


    **Step 3.** Check the /var/named/slaves directory to see if the zones copied over
    the master DNS server correctly:


    ```

    # ls /var/named/slaves

    example.com.revzone example.com.zone

    ```


    You can manually pull the zone files from the master DNS server by using the dig
    command to perform a transfer. We look at the full syntax of the dig command,
    but here you can see how to manually transfer a zone file:


    ```

    # dig -t axfr example.com @rhel01

    >>> DIG 9.3.6-P1-RedHat-9.3.6-4.P1.el5 <<< @rhel01 example.com axfr

    ; (1 server found)

    ;; global options: printcdmd

