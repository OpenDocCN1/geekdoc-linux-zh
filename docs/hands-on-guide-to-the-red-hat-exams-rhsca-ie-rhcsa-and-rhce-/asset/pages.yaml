  md: 'The system now prompts you for the password that you set up for the helpdesk
    user on Client01. After you enter the password, a display of the remote desktop
    appears as if you were sitting at the system.


    VNC can be useful when you''re trying to help end users troubleshoot or show them
    how to do something. Many times in the real world, the desktop managers are not
    used (only the shell is), so there isn''t really a need for VNC on servers.


    # # Summary


    In this chapter, we looked at two different types of remote access. We discussed
    SSH and how it creates secure tunnels to provide system administrators with secure
    access to their systems. We also looked at VNC and how it can be used to remotely
    connect to desktops. Remote access is critical in the real world because no one
    manages systems from the console (unless there is an issue with the system). Knowing
    how to set up remote access and configure it to be secure is a vital real-world
    skill. For the Red Hat exams, make sure that you are comfortable working on systems
    remotely.


    # # Review Questions


    +   1. What is SSH used for?

    2. Should you allow remote access? Why or why not?

    3. What happens if a host changes its IP address and the keys don''t match?

    4. Which version of SSH should you use?

    5. SSH can run only on TCP port 22. True or False?

    6. TCP Wrappers can be used with SSH. True or False?

    7. What is the benefit of using public/private key authentication?

    8. What is VNC?

    9. What is the name of the package that allows you to install VNC?


    # # Answers to the Review Questions


    +   1. SSH is used for secure remote management of Linux systems.

    2. You should never allow remote access. Should your root account become compromised
    and you use the same password, someone could gain access to all your systems.
    You also don''t want the most powerful user of your system (with no accountability)
    logging in and making changes.'
