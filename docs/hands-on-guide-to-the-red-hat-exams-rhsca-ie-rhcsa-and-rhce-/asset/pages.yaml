  md: '# # File Systems and Such


    In the preceding chapter, we spent a lot of time working with partitions and setting
    up the layout of the different disks for the system. Now to be able to use these
    disks, we need to create a file system for each one, mount it somewhere on the
    file hierarchy, and set it so that it will always be available when the system
    boots up. This chapter also describes file permissions, access control lists (ACLs),
    and quotas. All these tools together help you manage your system and storage efficiently.


    # ## File System Setup


    In the preceding chapter, we set up different types of partitions for the system.
    The partitions are essentially the disk space carved out for you to use. Before
    the partitions can be used, however, we need to create a file system for each.
    The default file system for RHEL5 is ext3 and has been changed to ext4 for RHEL6.
    Both of these file systems offer a journaling option, which has two main advantages.
    First, it can help speed up recovery if there is a disk failure causing file systems
    keep a "journal" of the file system''s metadata. Second, it can check drives faster
    during the system boot process. The journaling feature is not available on older
    file systems such as ext2. The creation of ext3 and ext4 file systems is exactly
    the same, so moving between the two shouldn''t be a big deal. Because we made
    a mess with partitions in the preceding chapter, we need a new partition layout
    on Table 4-1 if they don''t already exist.


    Table 4-1 Partitions Needed


    | Partition | Size | Comment |

    | --- | --- | --- |

    | /dev/hdb1 | 8GB | Normal partition |

    | /dev/hdc1 | 4GB | Normal partition |

    | /dev/hdc2 | 4GB | Swap partition |

    | /dev/hdd* | 5GB | Logical volume using LVM |

    | /dev/hdd1 | 8GB | Normal partition |'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# GENERAL INFO


    There are many types of file systems, including ext2, ext3, ext4, ReiserFS, ZFS,
    XFS, and JFS.


    # Creating a File System


    When you''re creating a file system, there are many different ways to complete
    the same task. Following are the commands you can use to create and manage file
    systems:


    +   - mkfs Creates an ext[21314] partition

    - mkfs.ext2 Creates an ext2 partition

    - mkfs.ext3 Creates an ext3 partition

    - mkfs.ext4 Creates an ext4 partition


    In the preceding chapter, we worked with basic partitions, RAID, and LVM. The
    creation of file systems on these different partitions all worked the way. For
    simplicity, let''s stick with basic partitions and LVM. The first partition is
    hdb1, which takes up the whole disk (8GB in size). Let''s create a new ext4 file
    system on this partition using mkfs command.


    Syntax: mkfs [options] DEVICE


    Options:


    +   - -J Creates a journal option (by default for ext4, used on ext2 only to upgrade)

    - -m Specifies a reserved percentage of blocks on a file system

    - -L Labels the volume


    Step 1. Create the first file system: /dev/hdb1


    ```

    # mkfs.ext4 /hdb1

    mk2fs 1.41.12 (17-May-2010)

    ystem label=

    OS type: Linux

    Block size=4096 (log=2)

    Fragment size=4096 (log=2)

    Stride=0 blocks, Stripe width=0

    s52428 inodes, 2096744 blocks

    104823 blocks (5.0%) reserved for the super user

    First data block=0

    Maximum filesystem blocks=2147483648

    64 groups

    32768 blocks per group, 32768 fragments per group

    0192 inodes per group

    ```'
