  md: "RHEL02, you should leave SELinux set to enforcing. If you run into any problems\
    \ where you suspect SELinux of causing the issue, you can troubleshoot using the\
    \ two different systems. On the exam, you are required to work with SELinux set\
    \ enforcing, so you need to understand how to troubleshoot it and fix any issues\
    \ that arise.\n\n# Configuring SELinux\n\nYou can change the mode in which SELinux\
    \ operates by changing the config file. The main config file is /etc/selinux/config.\n\
    \nView the current details of the /etc/selinux/config:\n\n```\n# cat /etc/selinux/config\n\
    # This file controls the state of SELinux on the system.\n# SELINUX= can take\
    \ one of these three values:\n  - enforcing SELinux security policy is enforced.\n\
    \  - permissive SELinux prints warnings instead of enforcing.\n  - disabled -\
    \ SELinux is fully disabled.\n```\n\nSELINUX=enforcing\n# SELINYPE= type policy\
    \ in use. Possible values are:\n  - targeted Only network daemons are protected.\n\
    \  - strict Full SELinux protection.\n\nYou can see that the three SELinux modes\
    \ are listed in the comments of the file and that the current mode is enforcing.\
    \ At any time, you can change the mode that SELinux runs, but a system reboot\
    \ is required for it to take effect. After you change the mode in which SELinux\
    \ is running and reboot the system, SELinux relels the file system to change the\
    \ context of the files. This process can take consuming depending on the size\
    \ of your drive and the number of files it contains, planning ahead with the mode\
    \ to run SELinux is always advised. From editing the config file, you can also\
    \ use the setforce command to change the status.\n\nSyntax: setforce [ Enforcing\
    \ | Permissive | 1 | 0 ]\n\nIf the current mode is permissive, you can change\
    \ it to enforcing with the following:\n\n```\n# setforce enforcing\n```\n\nRegardless\
    \ of which you use when changing the mode in which SELinux runs, you are still\
    \ required to reboot the system. Now that you know how to find and change the\
    \ mode in which SELinux operates, let's move on to contexts.\n\n# File Contexts\n\
    \nSELinux uses three different contexts to enforce security: user, role, and domain\
    \ (also type). New to RHEL6 is the addition of a fourth context known as level\
    \ (this level represents the sensitivity level of a file or directory). These\
    \ can be further expanded to define values for each context."
