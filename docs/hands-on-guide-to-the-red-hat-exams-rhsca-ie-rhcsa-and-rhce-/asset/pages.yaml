  pgno: 443
- img_proc: true
  md: '# Password Change Not Available in Single-User Mode


    When you enter single-user mode, you may encounter an issue where the root user''s

    password cannot be changed. You can use the following steps to resolve this.


    +   - **Step 1.** Verify the existence of the /etc/shadow file:

    # ls /etc grep shadow


    +   - **Step 2.** If the /etc/shadow file doesn''t exist (which would be the cause
    of the error

    in this case), use the pwconv command to re-create the /etc/shadow file:

    # pwconv


    +   - **Step 3.** Now execute the passwd command to reset or change the root user''s

    password:

    # passwd root

    Changing password for user root

    New password:

    Retype new password:

    Passwd: all authentication tokens updated successfully.


    +   - **Step 4.** Reboot the system and validate that the new root password works

    correctly:

    # reboot


    # The MBR Is Corrupt

    If you are having booting the system and you have determined that the mas-

    ter boot record (MBR) is corrupt, you need to boot into rescue mode. Use the Red

    Hat DVD, boot from it, and choose the option to enter rescue mode.


    +   - **Step 1.** After you boot, enter the GRUB shell:

    # grub

    Probing devices to guess BIOS drives. This may take a long time.


    ```

    GNU GRUB version 0.97 (640K lower / 3072K upper memory)

    [ Minimal BASH-like line editing is supported. For the first word,

    TAB

    lists command completions. Anywhere else TAB lists the

    possible

    completions of a device/filename.]

    gub>

    ```


    +   - **Step 2.** Locate the root drive:

    gub> root

    (hd0,0): Filesystem type is unknown, partition type 0x8'
