    for use. In each system the physical disk drives are divided up into partitions
    that allow you to store data on them (after a file system has been created, of
    course, but that''s in the next chapter). There are also special types of partitions
    such as RAID that allow for increased performance, redundancy, or both. LVM, like
    RAID, is an advanced form of partitioning that eases management of partitions
    and makes growing them for increased storage capacity simple. One of the key points
    to remember when working with partitions is to plan ahead. Will your partitions
    need to be bigger in the future? How should your data be organized? Planning ahead
    will make you a better system administrator and also ease the pain of partition
    migration and management down the road.


    # Basic Partitions


    Working with disks is an important part of maintaining storage space on your system.
    Partitions determine how your storage space is carved out for use later by the
    system and its users. When adding more storage or creating it for the first time,
    you should partition your disk space into a logical format for use later. Many
    installers come with an "automated" partitioning option for those that don''t
    need a custom layout; however, most system administrators will want to lay out
    their own partitions. In the lab, RHEL01 is configured with four hard disks. You
    will use three of these drives (the smaller ones) to set up custom partitions.
    All drives are IDE (/dev/hdx) versus /dev/sdx for SCSI/SATA users. Before you
    begin partitioning, you should look at the drives currently available for use
    as well as the current partitions on any of these drives. You can use two different
    utilities when partitioning disks:


    +   - fdisk Disk-partitioning utility


    +   - parted Another disk-partitioning utility'
  merge: -1
