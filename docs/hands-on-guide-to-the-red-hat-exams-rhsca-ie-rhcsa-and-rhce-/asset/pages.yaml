    # Configuring Postfix


    Postfix actually starts a service called master, which is its main service. This
    master starts three other services itself: nmqgr, pickup, and smtp. nmqgr service
    is responsible for mail transmission, relay, and delivery. The pickup service
    transfers messages, and the smtp service provides incoming mail. There are numerous
    things to know when working with Postfix, so let''s take a look.


    Here are the management commands for Postfix:


    +   - mailq Allows to view the mail queue (* means active, ! means on hold)

    - postmaster Postfix lookup table management

    - supersuper Allows to perform maintenance jobs on the Postfix queue

    - postfixconf Postfix configuration utility'
