    # Users Can Create Files In Their Home Directories


    If users cannot create files in their home directories, your first thought should
    be that the partition is out of space. When it comes to users files in their home
    directories, they tend to keep everything, which just eats away at file space.


    **Step 1.** Verify that the partition isn''t full:


    ```

    # df -h

    ```


    **Step 2.** If the partition is not full, check to see whether the user has his
    quota:


    ```

    # quota

    ```


    If neither of these situations is the issue (which is highly unlikely), the next
    step is to verify whether the issue pertains to only a single user or all users.'
