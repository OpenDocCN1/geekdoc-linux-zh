    This command creates a journal on the ext2 file system, essentially converting
    it to ext3. We cover the tune2fs command in the next section.


    # Create a Swap


    In Linux, a swap space is used as a "scratch space" for the system. When the system
    runs on low memory, it uses the swap space as a virtual memory to swap items in
    and out of physical memory. Although it should not be used in place of physical'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'memory because it is much slower,it''s a critical piece of any system. There
    are two different types of swaps that you can have: file swap and partition swap.
    Following are the commands you use when working with a swap space:


    +   - mkswap Creates a swap device


    +   - swapon Enables a swap space


    +   - swapoff Disables a swap space

    Wipes zeroes out an area of the disk


    First, create a partition swap with the remaining space on the hdc2 partition
    (don''t forget that the swap partition is a different type from ext partitions).
    Use the mkswap command to create a swap space.


    Syntax: swapon [options] DEVICE


    Options:


    +   - a Enables all swap devices


    +   - e Silently skips devices that don''t exist


    +   - s Verifies that the swap is running


    # Step 1. Starting with the swapon command, check whether there are any current
    swap spaces on the system:


    | swapon -s | Size Used Priority |

    | Filename partition | |

    | /dev/dm-1 412876 0 -1 |


    Although a swap is displayed here, it is not one of the partitions created (this
    partition is from the original install on the system).


    Syntax: mkswap [options] DEVICE


    Options:


    +   - c Checks the device for bad blocks before creating the swap area'
