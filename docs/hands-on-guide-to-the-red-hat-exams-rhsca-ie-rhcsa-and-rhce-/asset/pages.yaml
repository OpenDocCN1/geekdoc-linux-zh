    SELinux mount: /selinux

    Current mode: enforcing

    Mode from config file: enforcing

    Policy version: 21

    Policy from config file: targeted

    ```


    You can also use the getenforce command to view the status in a different way:


    ```

    # getenforce

    Enforcing

    ```


    When you first installed this system, SELinux was set to be enforcing. In RHEL6,
    this setting is the default. Because you are working in a lab environment, I suggest
    that you set SELinux to permissive on Client01 and Client02. For RHEL01 and'
