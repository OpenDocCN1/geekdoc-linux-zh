  md: '# REAL-WORLD TIP


    In RHEL6, the version of GRUB being used is 0.97. The most current version of
    GRUB is 2.0, which has different features available. One notable feature if you
    up-grade to 2.0 is that you can''t edit the grub.conf file by hand (your changes
    will be overwritten). The differences in GRUB versions are outside the scope of
    this book, so be aware that updating GRUB requires you to manage grub.conf differently.


    # The GRUB Command Line


    One task that is common in the real world and also a possible exam question how
    to repair a broken MBR. For this to happen, you need to make use of the res-environment,
    which can be found by booting from the RHEL installation DVD. When you are in
    the rescue environment, you can repair your broken MBR.


    +   **Step 1.** Load up the GRUB command line to find the disk and partition that
    contain the grub.conf file using the find command:


    ```

    grub> find /grub/grub.conf

    (hd0,0)

    ```


    You could also run:


    ```

    grub> root

    (hd0,0): Filesystem type is unknown, partition type 0x8e

    ```


    +   **Step 2.** Install GRUB on the drive that is returned:


    ```

    grub> setup (hd0)

    Checking if "/boot/stage1" exists... no

    Checking if "/stage1" exists... yes

    Checking if "/stage2" exists... yes

    Checking if "/grub/e2fs_stage1_5" exists... yes

    Running "embedded /grub/e2fs_stage1_5 (hd0)" ... 26 sectors are

    embedded.

    Running "install /boot/stage1 (hd0)1+26 p

    (hd0,0)/grub/stage2

    /grub.conf"... succeeded

    Done.

    ```


    Now that your MBR is fixed, you should be able to boot into the system once again.
    The preceding example also shows where the boot partition is located (par-ition
    0 on disk 0), as well as the file system type. It is important that you also back
    up the grub.conf file in case something happens to your system; that way, you
    can easily restore it. Chapter 18, "DNS," covers more scenarios and issues that
    appear on the exam dealing with troubleshooting GRUB and the system boot process.'
