    If the service isn''t set to start on boot, you can enable it with the following:

    # chconfig postfix on


    Because the Postfix service comes installed by default, you really don''t need
    to do much to get started.


    > MIGRATION TIP

    BecauseHEL5 has Sendmail set up as the default mail program, you need to take
    some additional steps before moving on to configuring Postfix.


    **Step 1.** Install the Postfix package because it isn''t there by default:

    # yum install -y postfix


    **Step 2.** Verify that the package installed correctly:

