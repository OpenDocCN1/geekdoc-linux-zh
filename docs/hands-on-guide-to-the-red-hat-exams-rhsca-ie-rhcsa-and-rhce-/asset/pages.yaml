  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE Cert Guide and Lab Manual


    Before using the authconfig-tui tool, we cover how to manually set up and configure
    NIS and LDAP, the two client network authentication methods. Although NIS is no
    longer a requirement for either exam, it might come in handy for legacy purposes.


    The first type of network authentication is NIS, which requires the following
    packages for client authentication to the work:


    +   - ybind

    The actual service that binds NIS client to an NIS server

    - portmap

    A package used for security on NIS clients


    Start by installing the required packages on the system:


    ```

    # ym install -y ybind portmap

    ```


    After the packages are installed, you need to configure the /etc/yp.conf file
    and define your client settings. Specifically, you need to define the IP address
    of the NIS server and the domain name:


    ```

    # nano /etc/yp.conf

    ```


    Uncomment the following line:


    ```

    domain NISDOMAIN server HOSTNAME

    ```


    For the setup, you can use example.com as the domain name, and the IP address
    of the NIS server is 172.168.1.1. Your line in the config file there should be


    ```

    domain example.com server 172.168.1.1

    ```


    Save and close the file when finished. Next, you need to start the service:


    ```

    # service ybind start          [ OK ]

    Starting ybind:

    # service portmap start        [ OK ]

    Starting portmap:

    ```


    On the exam, you also need to make sure that any changes are persistent across
    a reboot. Enable both services to start at boot time:


    ```

    # chconfig ybind on

    # chconfig portmap on

    ```


    Finally, you need to edit the /etc/nsswitch.conf file and specify that you want
    your users and groups to be authenticated against the NIS domain, and if that
    isn''t available, then check locally. Open the file for editing:


    ```

    # nano /etc/nsswitch.conf

    ```


    Edit the following lines to look like this:


    ```

    passwd                  nis files

    ```'
