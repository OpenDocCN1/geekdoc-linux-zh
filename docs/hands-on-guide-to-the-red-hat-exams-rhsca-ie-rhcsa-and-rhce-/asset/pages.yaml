  md: '# NFS


    There are many different ways you can share files with users on your network.
    This chapter is the first of three chapters dealing with sharing files over the
    network. Specifically, in this chapter we will look at NFS, Samba in the next
    chapter, and FTP in Chapter 17. NFS provides a way for other systems on the network
    to store files in a centralized place. This ensures that backups are easier and
    security remains intact on a single point (instead of spread over multiple servers).
    Keeping your data in a centralized place will make your life much easier as a
    system administrator. Let''s jump into into NFS and centralized storage.


    # Network File Systems


    The Network File Systems (NFS) protocol works great when it comes to Linux systems
    because it allows for client flexibility, centralized management of files, and
    some other great features. To get NFS working properly, you need to set up the
    NFS server first and then set up the client to access the server. As with any
    other service, you need to install a few packages before doing anything else.
    The actual NFS service is the same for both servers and clients, with the difference
    being found in the services running and the config files.


    There are four different versions of NFS; version 4 is the most current. Although
    you can disable what versions the server listens for, the client actually determines
    which version it will use when connecting to the server (unless, of course, the
    server is offering the version the client is asking for). This description will
    make more sense as you move along in the chapter.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '352 Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    > MIGRATION TIP

    When RHEL5 was introduced, it came with both NFS versions 3 and 4 available for
    use, version 3 was used by default. In RHEL6, both versions are available, but
    version 4 is the default. It is recommended that if you are still on RHEL5, you
    use version 4 because of the numerous improvements.


    # Installing an NFS Server


    Follow these steps to install an NFS server.


    +   Step 1. To begin the NFS server setup, install the required packages:

    # yum install -y nfs-utils nfs4-acl-tools


    +   Step 2. Verify the package installation:

    # rpm -qa | grep nfs

    nfs4-acl-tools-0.3.3-5.el6.x86_64

    nfs-utils-1.2.2-7.el6.x86_64

    nfs-utils-lib-1.1.5-1.el6.x86_64


    > MIGRATION TIP

    RHEL6 no longer includes any of the system-config GUI packages. This includes
    the removal of the system-config-nfs package.


    +   Step 3. The NFS server uses three different services to function properly.
    You need to enable them all at boot for the NFS server to function the way it
    should:

    # chkconfig nfs on

    # chkconfig nfslock on

    # chkconfig rpcbind on


    > MIGRATION TIP

    RHEL6 now includes the rpcbind service, which replaces the portmapper service
    from RHEL5. If you are still using RHEL5, you need to replace the rpcbind commands
    in these examples with portmap instead.


    +   Step 4. Verify that all three services are set to start on system boot:

    # chkconfig --list nfs

    nfs 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    # chkconfig --list nfslock

    nfslock 0:off 1:off 2:on 3:on 4:on 5:on 6:off'
