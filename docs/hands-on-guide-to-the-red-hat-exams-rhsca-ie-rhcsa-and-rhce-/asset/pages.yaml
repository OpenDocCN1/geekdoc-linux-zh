  md: 'Chapter 14: Web Services


    # REAL-WORLD TIP


    The default LogLevel is set to warn, but you can change it to info or debug to
    see detailed information about what is going on. Be very careful when changing
    this, though, because it can produce a huge amount of data and negatively impact
    your system or lock it up entirely.


    Another useful tool to troubleshoot web server issues is with the elinks browser.
    This text-based browser lets you easily check websites. To make use of this utility,
    you need to install an additional package.


    +   **Step 1.** Install the required package:


    ```

    # yum install -y elinks

    ```


    +   **Step 2.** When it''s installed, you can test your site with the following:

    # elinks 172.168.1.1.1


    After running the command, you should see the screen shown in Figure 14-1.


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_315_0.png)


    This page is used to test the proper operation of the Apache HTTP server after
    it has been installed. If you can read this page, it means the Apache HTTP server
    installed at this site is working properly.


    If you are a member of the general public:

    The fact that you are seeing this page indicates that the website you just visited
    is either experiencing problems, or is undergoing routine maintenance.


    If you would like to let the administrators of this website know you''ve seen
    this page instead of the page expected, you should send them e-mail, sent to namemaster
    and directory address of the website''s domain should reach the appropriate person.


    For example, if you experienced problems while visiting example.com, you should
    send e-mail to "webmaster@example.com".


    For information on Red Hat Enterprise Linux, please visit the Red Hat, Inc. website
    The documentation for Red Hat Enterprise Linux is available on the Red Hat, Inc.
    website.


    If you are the website administrator:

    http://www.redhat.com/


    **Figure 14-1** Test page for the Apache HTTP server.


    If you do not specify between HTTP and HTTPS, normal HTTP is assumed. If you want
    to test for a secure site, you can use the following:

    # elinks https://172.168.1.1.1


    +   **Step 4.** To quit the elinks browser, just press q.'
