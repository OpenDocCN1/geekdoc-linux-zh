    # Summary


    Working with DNS servers is never an easy topic. If you have never worked with
    them before, understanding the process of DNS queries and the setup to make them
    work correctly is even more difficult. BIND is quietly flexible, however, and
    is the most widely used implementation in the world.


    This chapter covered four different types of DNS servers in detail and how to
    set them up. We also looked at security pertaining to DNS servers and troubleshooting
    any issues that come up. DNS servers play a big role in the network and are one
    of the critical parts of the network infrastructure in the real world. Make sure
    you understand the concepts as well as implementation because you have to handle
    this, not just on the Red Hat exam, but also in the real world.


