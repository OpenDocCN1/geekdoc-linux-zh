  md: "**WARNING:** For many commands and changes on Linux, there are multiple ways\
    \ to achieve the same results. Make sure you choose the method that you are most\
    \ comfortable with to save time on the exam.\n\n# Routing\n\nWhen you have a system\
    \ that has two or more network interfaces (such as RHEL01 host), they are called\
    \ dual-bomed or multibomed systems. You need to make sure that each interface\
    \ has a gateway that it can route through. Using the route command, you can display\
    \ the current routes the system has and add additional routes if you need to.\n\
    \nSyntax: route [options]\n\nOptions:\n\n| add | Adds a net route |\n| del | Deletes\
    \ an existing route |\n| flush | Flushes any temporary routes |\n\n**WARNING:**\
    \ As a good troubleshooting tip, watch for keywords to detect gateway or routing\
    \ issues. If you receive an error message about being unable to contact a host\
