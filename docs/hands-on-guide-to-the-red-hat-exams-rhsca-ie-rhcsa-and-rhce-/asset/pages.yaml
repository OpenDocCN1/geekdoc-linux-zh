  md: 'This chapter covers the following subjects:


    +   - **Starting the Installation**—This section covers the installation and setup
    of the Red Hat Enterprise Linux operating system.


    +   - **Verifying the Installation**—After you complete the installation, this
    section shows you how to verify that the installation was successful.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# CHAPTER 1


    # Installation


    The first step when working with any new operating system is learning how to install
    it. This is an essential first step because the installation and setup affect
    how the system will be used post-install. This chapter covers the installation
    of Red Hat, the first steps to take post-install, and some other helpful tips
    to watch out for the installation. Although the installation of Red Hat is no
    longer covered on the exam itself, installing Red Hat is an important subject.
    The first system you build will define a "template" for what your future installs
    will look like. It is common to build a kickstart server as well, which will automate
    the entire process of installation. Before we get ahead of ourselves, though,
    let''s start with the basic installation process.


    # Starting the Installation


    Let''s start with a typical installation of Red Hat Enterprise Linux. The first
    virtual machine is going to be called RHEL01, and we''ll walk through the installation
    here together. You should follow along the install instructions to get a feel
    for how RHEL is installed. At the end of this chapter, you will reinstall Red
    Hat Enterprise Linux on this virtual machine as part of Lab 1 (the first task
    of Lab 1 to be exact).


    +   **Step 1.** Create a virtual machine in VirtualBox, with 384MB of RAM, and
    name it RHEL01.


    +   **Step 2.** Make sure that the installation CD is in the drive (or attached
    as an ISO), and boot from the CD. If you don''t press Enter at the screen, it
    will begin to boot automatically after the timeout threshold (about 3 seconds).
    The installation process should begin at this point.


    +   **Step 3.** The first option should be obvious because choosing a language
    affects the rest of the installation process. You also need to choose your keyboard
    layout at this point.


    +   **Step 4.** Next comes the storage layout of the system. You don''t need any
    crazy configuration here, so choose the basic option and move on (see Figure 1-1).'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Step 5.


    The next screen allows you to choose a hostname for your system. Notice the option
    on the bottom left to configure networking as well (see Figure 1-2). You don''t
    need to make any changes to the network adapters for now; by default they are
    set to receive an IP address via Dynamic Host Configuration Protocol (DHCP). If
    you want to an interface to have a static IP address, you could configure that.


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_14_0.png)


    Figure 1-1 Storage selection.


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_14_1.png)


    Figure 1-2 Set the hostname.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '**Step 6.** Select your time zone. For me, it''s America/New York.


    **Step 7.** Choose a root password (see Figure 1-3). Make sure that this password
    is something that no one else will be able to guess. The root user basically has
    full access to anything on the system, so it''s not a good idea to use something
    that can be guessed on the first try.


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_15_0.png)


    **Figure 1-3** Choose a root password.


    **Step 8.** Next, go to the partition layout screen. This screen is the place
    where you will probably spend the most time (see Figure 1-4). Here, you create
    the partitions for your new installation. For the purpose of getting through the
    install, select All Space. You could create a custom partitioning scheme (which
    will probably always happen with future installs), but it is not necessary here.
    By default, Red Hat uses logical volume management (covered in Chapter 3, "Disks
    and Partitioning") when creating a default layout so that all your partitions
    (with the exception of /boot) are on logical volumes. To create a custom layout,
    you need to check the box on the bottom allowing you to modify the partitioning
    layout. New in Red Hat Enterprise Linux 6 (RHEL6), you can also choose to encrypt
    your system (using LUKS). If you''d like to do this, just check the box on the
    bottom. After you choose to continue, the partition table is written to the system
    drives.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '![](img/3ac10b03127f2296ea10a3f4cc885db7_16_0.png)


    **Figure 1-4** Partition creation.


    # ### MIGRATION TIP


    You need to be careful about certain features between the different versions of
    Red Hat. Here, I''m specifically talking about LUKS encryption. If you installed
    updated versions of Red Hat Enterprise Linux 5 (such as version 5.4 or 5.5), you
    will notice that the LUKS encryption option is available during installation.
    However, the official Red Hat documentation states that only Red Hat Enterprise
    Linux 6 supports LUKS encryption. Although I try to point out of of differences
    throughout the book, make sure you understand when certain features are available
    for use (via updates) and when they are officially supported.


    # ### REAL-WORLD TIP


    Many system administrators have their own way of creating partition layouts, and
    sometimes that is even dictated by company requirements. Due to individual taste,
    and the fact that I will start a war discussing the topic of "what should be laid
    out where," I do not describe how to create a custom partitioning scheme based
    on any standards. There are, however, two important points to know. One is that
    /boot partition can never be part of a Logical Volume Manager (LVM) layout. Second,
    you should spend time and plan ahead as how you want your partitions laid out
    because a little planning now will save you from a big headache later.


    **Step 9.** Now you can select which packages you installed. This process can
    get very detailed because you can choose a package group and then'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'individual packages within the group. For my install, I''m going to leave the
    defaults, which install the base system with no desktop manager (see Figure 1-5).
    You need to know how to configure different packages and installations by hand,
    allowing the system to install them now isn''t going to help in the long run.


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_17_0.png)


    Figure 1-5 Package selection.


    When you click Next, the installation of the operating system begins. This process
    can be quickly (10 minutes) or slightly longer (30 minutes) depending on which
    software packages you chose to install and other configuration options. When the
    installation is complete, you are prompted to reboot the system. After the system
    has rebooted, make sure that you either remove the CD from the drive or set the
    system to boot from the primary disk as not to start the installation process
    over again. This completes the installation of Red Hat Enterprise Linux 6.


    # An Older Install with RHEL5


    I have included this section for those who are still running Red Hat Enterprise
    Linux 5 (RHEL5). Let''s face it, new operating systems offer great new features
    and stability, but no upgrades all his systems the moments a new release comes.
    This takes careful planning, testing, and coordination.


    Let''s revisit the installation process using RHEL5 for the operating system.
    We should notice how the installation process and order have changed with the
    move to RHEL6. If you''d like to practice along with this section, you can install
    RHEL on your Client01 virtual machine.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Step 1. Create a virtual machine in VirtualBox with 384MB of RAM, and name
    it Client01.


    Step 2. Make sure that the installation CD is in the drive (or attached as an
    ISO), and boot from the CD. If you don''t press Enter at the first, it will begin
    automatically after the timeout threshold (3 seconds). The installation process
    should begin at this point.


    Step 3. The first option should be obvious because choosing a language affects
    the rest of the installation process. You also need to choose your keyboard layout
    at this point.


    Step 4. You are prompted to enter an installation number, which you can skip for
    now. Because you are setting up a lab, you do not need to register the system
    with Red Hat.


    Step 5. Next, go to the partition layout screen. This screen is the place you
    will probably spend the most time (see Figure 1-6). Here, you will create the
    partitions for your new installation. For the purpose of getting through the installation,
    elect to create all partitions and create the default recommended layout for now.
    You could create a custom partition scheme (which will probably always happen
    with future installs), but it is not necessary here. By default, Red Hat uses
    LVM when creating a default layout so that all your partitions (with the exception
    of /boot) are logical values.


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_18_0.png)


    Figure 1-6 Partition creation.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# REAL-WORLD TIP


    Many system administrators have their own way of creating partition layouts, and
    sometimes that is even dictated through company requirements. Due to individual
    taste, and the fact that I start will be discussing the topic of "what should
    be laid out where," I do not describe how to create a custom partitioning scheme
    based on any standards. There are, however, two important points to know. One
    is that /boot partition can never be part of an LVM layer. Second, you should
    spend time and plan ahead as how you want your partitions laid out because little
    planning now will save you from a big headache later.


    +   Step 6. By choosing to proceed, you should get a warning message about your
    partitions not being initialized and doing so will erase all data on the system
    (Figure 1-7). This isn''t a concern because there is nothing on the system currently.


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_19_0.png)


    Figure 1-7 Partition warning.


    # WARNING


    I should not have to say this, but I''ll say it anyway: Initializing disk drives
    erases ALL DATA. If you are following along, there shouldn''t be any data on your
    disk currently (because you are using a virtual machine); however, if you are
    building out a lab differently, make sure you make a backup of any data before
    installing, initializing, or formatting any disk drive!'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Step 7. Next on the list is setting the network interfaces that you need for
    the system. For this installation, you''ll set up two network interfaces. The
    first should be eth0, and it should get its IP address from a DHCP server; the
    second should be eth1 and have its IP address set statically (see Figure 1-8).


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_20_0.png)


    Figure 1-8 Add network interfaces.


    Step 8. Select your time zone. For me, it''s America/New York.


    Step 9. Choose a root password (see Figure 1-9). Make sure that this password
    is something full that no one will easily be to. The root user basically has full
    access to anything on the server, so it''s not a good idea to use something that
    can be guessed on the first try.


    > REAL-WORLD TIP

    There is big debate over whether choosing a strong password for the root user
    is necessary in a lab environment it is usually cut off from production networks.
    Just remember that if you are working on a remotely, you had to get into it, which
    means that someone else can too. If you are working on a local laptop (I am on
    my laptop), the chances of someone breaking in decrease because there is no remote
    connection. Either way, the decision is up to you and which school of thought
    you''d like to follow.'
  merge: -1
