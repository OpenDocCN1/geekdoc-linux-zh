  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual


    According to the Red Hat Exam Prep Guide, you need to be able to synchronize clients
    with a higher-stratum server. The term stratum is define different levels, from
    1 to 15, of time servers that are available to sync with. A stratum 1 time server
    is the most accurate. For load balancing and redundancy, you would probably want
    to configure a primary NTP server and a secondary NTP server to sync with a stratum
    1 time server (which is located off your network). Now let''s look closely at
    both the server and client side of NTP.


    # Installing a Time Server


    Usually, the NTP package comes installed as part of your Red Hat system, but it
    is always good to know how to install it should you ever need to.


    +   Step 1. If you need to, install the package:

