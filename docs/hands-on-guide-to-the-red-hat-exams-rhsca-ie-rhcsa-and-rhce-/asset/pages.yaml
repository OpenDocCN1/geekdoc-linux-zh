  md: 'Knowing how to delete users (and their home directories) may be essential for
    the exam, but this is not even close to real-world practice. Many companies have
    a strict policy about retention of files, it goes without saying that 99% of the
    time you want to delete the users but keep their files. As a best practice, you
    should root take ownership of the files and make read-only to everyone but the
    root user, denying everyone else access. This way, if you need to recall anything
    from this user''s directory or if you get audited, you can recall the user''s
    files quickly.


    # REAL-WORLD TIP


    Although you might like to think that users will stay organized and keep their
    files in their home directories, seasoned system administrators know that this
    is not the case. Users love to create files and put them in all sorts of places
    on the system. To combat this, you can search for all files that belong to a user
    before you delete her. you can lock her account so no one can gain access to it
    (you learn shortly); then you can use the following command to search for all
    files that belong to the user you delete:


    ```

    # find / -user05

    ```


    You can move these files to a single location and change the permissions on them,
    as already discussed, for safekeeping.


    # Passwords


    You may have noticed that no password was specified for any of the users created
    so far. Does this mean each user''s password is blank and anyone can log in with
    a user''s account? Actually no. By default, an account is locked until a password
    is assigned to it. For password management, you can use the following commands:


    +   - passwd Sets a password or resets a password for a user account


    +   - chage Enables you to modify the parameters surrounding passwords (complexity,
    age, expiration)


    +   - pwck Verifies the consistency of passwords across database files


    When you create a user account, you can use the -p option to set a password; however,
    this requires you to type the password for the user in clear-text on the screen,
    and anyone walking can see it. A better method for password creation/assignment
    is to use the passwdd command, which allows you to change (or, in this case, set)
    the user''s password.


    Syntax: passwd [options] LOGIN'
