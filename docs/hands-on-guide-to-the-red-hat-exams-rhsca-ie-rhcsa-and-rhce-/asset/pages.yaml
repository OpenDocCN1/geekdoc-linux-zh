    As you can see from the file output, two clients have active leases. When viewing
    the leases file, you should be careful that all times in the dhcpd.leases file
    are in UTC (GMT). The reason for this is that there is no daylight savings in
    that time zone, making it internationally usable. Make sure pay attention to this
    if you''re trying to troubleshoot with this file. As a final tip, make sure you
    use the configtest option to test the syntax of your config files before starting
    or restarting the service. This prevents any errors from occurring when you try
    to start the service.


    # REAL-WORLD TIP


    You may want to consider setting up a secondary DHCP server as a failover. It
    provides you with a backup should your primary server fail (don''t just rely on
    this secondary server, though; make sure you test it). If you create a failover
    server, you should follow the 80/20 rule: 80% of your IP addresses should be used
    on your primary DHCP server, and 20% should be used on your secondary server.


    # Network Time Protocol


    Do you know what time it is? If you don''t, that''s okay because we''re going
    to disconnect the network time protocol (NTP) service. This service is responsible
    for maintaining your system, which is highly important in any environment because
    so many things rely on time (logs, error messages, applications, and so). There
    are a few rules that your system can have when using NTP. They include


    +   - Primary NTP Server Provides time to secondary NTP servers or clients

    - Secondary NTP Server Provides time to clients; helps load balance primary NTP
    servers

    - NTP Peer Provides and receives time

    - NTP Client Receives time from primary or secondary NTP servers'
