  md: '# CHAPTER 12


    # System Security


    I''d like to start off this chapter by saying that because I''m a person who is
    nuts about security, I think this is one of the most important chapters in the
    book. One of the biggest reasons for system compromise these days isn''t that
    some elite hacker is breaking in and circumventing the multiple layers of security
    on your network; it that some system administrators couldn''t take five minutes
    to close the front door! we look at defense in depth, starting with TCP Wrappers,
    iptables (which are used to set up the firewall), and the Plgable Authentication
    Module (PAM). If there is one chapter that you should spend a good amount of time
    reading, and not just for the exam, this is the one.


    # Security Through TCP Wrappers


    TCP Wrappers is a host service that can be used to limit or control access from
    remote hosts. Although it is installed by default, verifying manually is always
    good. First, check for the TCP Wrappers package to make sure it is installed.


    ```

    # rpm -qa | grep wrappers

    tcp_wrappers-7.6.56.3.el16.x86_64

    tcp_wrappers-libs-7.6.56.3.el16.x86_64

    ```


    Now that you know the service is installed, you can begin to configure it for
    access control. You can limit access to either users or hosts via /etc/hosts.allow
    and /etc/hosts.deny files (which you can mix both users and hosts in either file).
    The order in which items are defined within these two files is important! The
    TCP Wrappers scans the two files in the following fashion:


    +   Search the hosts.allow file.


    +   Search the hosts.deny file.


    +   If not found in either, allow.


    The TCP Wrapper service itself uses the following syntax in the two already-mentioned
    files:


    ```

    <daemon_list> : <client_list>

    ```'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Hands-Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab Manual


    Aside from being able to define an hostname or IP address in the client_list field,
    you can also define any of the following six keywords:


    +   - ALL Specifies all networks

    - LOCAL Specifies the local network

    - EXCEPT Excludes a particular user/client

    - KNOWN Indicates all hosts that can be resolved by the system

    - UNKNOWN Indicates all hosts that can be resolved by the system

    - PARANOID Specifies that the forward lookup IP address doesn''t


    These keywords can be used to help keep your rule count under. Instead of defining
    each host within your network, you can just use the keyword LOCAL.


    Let''s look at a few examples to help define the point. Suppose that you want
    to restrict access to the SSH service and allow connections only from the local
    network. In this case, you would use the following rule in /etc/hosts.allow:


    ```

    ssh : 172.168.1.

    ```


    First


    ```

    sshd : 172.168.1.1

    ```


    With the preceding line, connections would be allowed only from the host 172.168.1.1,
    instead of the entire 172.168.1.0 /24 subnet.


    # REAL-WORLD TIP


    In the real world, it is highly recommended that you use TCP Wrappers to lock
    down things like SSH to your local subnets. This prevents people on the inside
    from accessing the servers unless they are on the correct subnet. Usually, users
    are on their own subnet, denying them access to any management connections.


    Going further with this example, if you want to allow all users from the 172.168.1.0/24
    network except the 172.168.1.100 host? Then you could use the following rule in
    /etc/hosts.allow:


    ```

    sshd : 172.168.1. EXCEPT 172.168.1.100

    ```'
  merge: -1
