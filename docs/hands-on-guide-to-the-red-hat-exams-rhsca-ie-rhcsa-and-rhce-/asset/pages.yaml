  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    # Table 14-1 SELinux Options


    | Option | Description |

    |---|---|

    | httpd_can_network_connect | Allow httpd scripts and modules to connect to the
    network using TCP. |

    | allow_httpd_mod_auth_ntlm_winbind | Allow Apache to use mod_auth_pam. |

    | httpd_tty_comm | Unify httpd to communicate with the terminal. Needed for entering
    the passphrase for certificates at the terminal. |

    | httpd_read_user_content | Allow httpd to read user content. |

    | httpd_use_nfs | Allow httpd to access NFS file systems. |

    | httpd_tmp_exec | Allow Apache to execute temp content. |

    | httpd_execmem | Allow httpd scripts and modules execmem/execstack. |

    | httpd_can_sendmail | Allow http daemon to send mail. |

    | httpd_builtin_scripting | Allow httpd to use built in scripting (usually PHP).
    |

    | httpd_can_check_spam | Allow the http daemon to check spam. |

    | httpd_can_network_connect_cobbler | Allow httpd scripts and modules to connect
    to cobbler over the network. |

    | httpd_ssi_exec | Allow httpd to run SSI executables in the same domain as system
    CGI scripts. |

    | httpd_enable_ftp_server | Allow httpd to act as an FTP server by listening on
    the FTP port. |

    | httpd_setrlimit | Allow the httpd daemon to change system limits. |


    To provide basic web services to your network, you don''t need to make any changes.
    Almost any extension or nonbasic functionality requires modification of SELinux
    protection.


    # MIGRATION TIP


    In RHEL6, the available Boolean options for web services have changed completely.
    Make sure that you are familiar with the new options available.'
