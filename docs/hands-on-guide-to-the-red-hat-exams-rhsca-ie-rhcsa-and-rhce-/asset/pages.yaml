  md: 'Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE Cert Guide and Lab Manual


    # Step 3. Verify that it has been changed:


    ```

    # ls -Z myfile

    -rw-r--r--.. root root system_u:object_r:admin_home_t:s0 myfile

    ```


    # REAL-WORLD TIP


    A neat trick you can do with the chcon command is to restore the context of another
    file. This capability is useful when you''re using SELinux to enforce security
    on websites. You can set up a dummy site that acts as a template, like /var/www/html/default_site.
    When you create a new customer site, you can use the chcon command to restore
    the template site and apply the correct context:


    ```

    # chcon -vr reference /var/www/html/default_site /var/www/html/customer_site

    ```


    If you make a mistake or just want to restore the original contexts of a file
    or directory, you can use the restorecon command.

    Syntax: restorecon [options]

    Options:


    +   -i Ignores files that don''t exist

    -p Shows progress

    -v Shows changes as they happen

    -F Reset context


    # Step 4. Reset the context of your file back to its original context:


    ```

    # restorecon -F myfile

    ```


    # Step 5. Verify the change was applied correctly:


    ```

    # ls -Z myfile

    -rw-r--r--.. root root object_r:admin_home_t:s0 myfile

    ```


    You may notice that instead of going back to user_u, the user context is now set
    to root. This behavior is normal for the root user, but if you use this for non-root-owned
    files, it would have been reset to user_u.


    This discussion may seem really confusing, but working through the labs will help
    clarify any confusion. Creating SELinux policies is an advanced topic that isn''t
    covered here or on the Red Hat exams, but knowing how to work with contexts and
    troubleshoot issues is definitely a requirement.'
