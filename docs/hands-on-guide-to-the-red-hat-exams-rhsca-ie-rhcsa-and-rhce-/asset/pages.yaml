    # Encryption with LUKS


    Linux Unified Key Setup, LUKS, is a disk encryption for Linux. LUKS uses block
    device encryption, which protects the system when it is off (particularly if the
    drive is removed or stolen). When installing RHEL6 for the first time, you come
    to the partition creation screen where you can also choose to use encryption on'
  merge: -1
