  md: '# Networking


    One of the key elements of connecting to different systems is the network configuration
    involved. In this chapter, we look at how to configure both DHCP and static IP
    addresses, troubleshoot network issues, and resolve client DNS problems. Networking
    is an important foundation because without it, you aren''t able to communicate
    with the outside world or the rest of your network, or share files with your users.
    This book is not a primer on networking, so as an understanding of subnetting,
    default gateways, and other basic networking concepts is vital before reading
    this chapter.


    # Setting Up Networking


    Network management is fairly easy when it comes to Red Hat. Most of the network
    configuration is kept in files; therefore, adjusting these settings is simple.
    To start, you can use 3 management commands:


    +   * ifconfig Displays the IP address and other interface-related information


    +   * route Enables you to view or change the routing information on the system


    +   * system-config-network Provides a menu-driven utility for network configuration
    tui


    When you''re working with network interfaces, there are two additional files you
    need to know:


    +   * /etc/sysconfig/network This file contains gateway and hostname information.


    +   * /etc/sysconfig/network-scripts This directory contains all the interface
    config files for your system.


    Let''s start looking at the hostname and networking information:


    ```

    # cat /etc/sysconfig/network

    NETWORK=yes

    ```'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    ```

    NETWORK_IPV6=yes

    HOSTNAME=RHEL8

    ```


    The output here should be reasonably straightforward. The first two lines tell
    the system whether or not enable networking for IPv4 and IPv6. By default, they
    are both enabled and can remain that unless otherwise noted. I prefer to disable
    IPv6 if it is not in use so as to avoid extra traffic to the network. The third
    option defines what the system hostname is going to be. One additional option
    not listed here is GATEWAY. This option tells the system what the IP address of
    the gateway is. The reason that it doesn''t appear on the system (here or may
    not on yours) is that the option is set by the DHCP server, in which case it doesn''t
    appear. If you have a static IP address, you should use the GATEWAY option listed
    here. You may also define yourself to override any other gateway settings.


    # EXAM TIP


    When you change the hostname of your computer, you don''t have to reboot. If you
    do not reboot, however, there are numerous places that you need to change the
    hostname. If the system is not critical (or you have extra time on the Red Hat
    exam), you should restart the system and allow it to make all the adjustments
    for you.


    Next, let''s jump over to the /etc/sysconfig/network-scripts directory, where
    the remaining important files that deal with networking. Each network interface
    has its own config file in this directory that follows the format ifcfg-ethX,
    where X is the number of the network card. For example, my primary network card
    contains the following in its config file:


    ```

    # cat /etc/sysconfig/network-scripts/ifcfg-eth0

    DEVICE=eth0

    BOOTPROTO=dhcp

    HWADDR=08:00:27:30:74:AA

    ONBOOT=yes

    DHCP_HOSTNAME=RHEL8

    TYPE=ethernet

    ```


    There are two important elements to note in this file. The first is the DEVICE
    option, which specifies interface you are working with. Here, the first interface
    is specified, and by looking at the next line, you can see the protocol in use.
    This interface uses the DHCP protocol, which means that the IP address is leased
    from a DHCP server on the network (automatically during boot). Suppose you want
    to change this to a static IP address? You could edit this file by hand, but for
    basic configuration, there is a faster method.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'EXAM TIP

    If you edit the network interface files by hand, you have more options available
    to work with. You can customize the options that you want to use; however, customizing
    them takes time and is not required for the Red Hat exams.


    # Static IP Addresses


    A fast way for you to configure network interfaces is to use the system-config-network-tui
    command. It starts the menu-driven interface that allows you to configure your
    interfaces on-the-fly. Let''s change the second interface (eth1) to have a static
    IP address with this utility.


    +   * Step 1. Launch the utility:

    # system-config-network-tui


    +   * Step 2. Select which network interface you want to edit (see Figure 5-1).


    ![](img/3ac10b03127f2296ea10a3f4cc885db7_135_0.png)


    **Figure 5-1** Network interface to edit.


    +   * Step 3. Edit the details of the interface (see Figure 5-2).


    +   * Step 4. Save and quit when you are finished.


    Here, you can see that you can make any change you need to the interface, including
    it to a static IP address instead of using the DHCP protocol. Now that you''ve
    made changes to the network interfaces, you need to restart the network service
    for the changes to take effect. Instead of bringing down all the interfaces on
    the system by restarting the network service, you could just bring down a single
    interface that you have made changes. Because you made a change only to eth1,
    you can just bring down that one interface. To do this, you use the ifdown and
    ifup commands. These two commands are really the ifconfig command, but in a shorthand
    format.'
