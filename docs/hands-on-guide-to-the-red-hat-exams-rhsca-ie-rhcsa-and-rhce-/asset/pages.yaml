  md: '# Syntax: virsh [options] [commands]


    Options:


    +   -c Connects to a hypervisor


    +   -r Connects with a read-only connection


    +   -q Opens in quiet mode


    +   -l Outputs logging to a file


    Similar to the virt-install command, virsh has way too many subcommands to list
    here. Let''s look at only the management commands for now:


    +   help Prints basic help


    +   list Lists all the virtual guests


    +   dumpxml Outputs the XML config file for guest


    +   create Creates a virtual guest based on an XML file


    +   start Starts an inactive guest


    +   destroy Forces a guest to stop


    +   define Outputs the XML config file for a guest


    +   domid Displays the guest ID


    +   domuuid Displays the guest UUID


    +   dominfo Displays the guest information


    +   domname Displays the guest''s name


    +   domstate Displays the state of the guest


    +   quit Quits the interactive terminal


    +   reboot Reboots a guest


    +   restore Restores a previously saved guest from a file


    +   resume Resumes a paused guest


    +   save Saves the present state of a guest


    +   shutdown Shuts down a guest gracefully


    +   suspend Pauses a guest


    +   undefine Deletes all files relating to a guest


    +   migrate Migrates the guest to another host (live migration possible)'
  merge: -1
  pgno: 457
- img_proc: true
  md: 'You can see that this is a hefty list, but you should know most of these commands
    if you''ve worked with virtualization previously. Before you can use the virsh
    command to manage your virtual guests, you need to connect to the correct hypervisor
    (on the physical host) to gain access to the virtual guests.


    Connect to the hypervisor on RHEL03, the physical host:


    ```

    # virsh connect RHEL03

    ```


    Now that you have connected, you can manage any of the virtual hosts attached
    to this hypervisor.


    # REAL-WORLD TIP


    After you attach to a hypervisor, use the list command to display all available
    virtual guests:


    ```

    # virsh list --all

    ```


    # Monitoring Virtual Resources


    If you recall all the way back in Chapter 9, "System Logging, Monitoring, and
    Automation," we discussed tools and commands that could be used to monitor system
    resources. When you''re dealing with virtualization, there is also a need to monitor
    system resources; however, this time you want to see what''s going on all your
    virtual guests, not just the physical host. To accomplish this, let''s look at
    the virsh command again with a different set of options.


    | setmem | Sets the allocated memory for a guest |

    | setmaxmem | Sets the maximum memory limit for the hypervisor |

    | setvcpus | Changes the number of virtual CPUs assigned to a guest |

    | vcpuinfo | Displays virtual CPU information about a guest |

    | vcpupin | Controls the virtual CPU affinity of a guest |

    | domblkstat | Displays block device statistics for a guest |

    | domifstat | Displays network interface statistics for a guest |

    | attach-device | Attaches a device to a guest |

    | attach-disk | Attaches a new disk to a guest |

    | attach-interface | Attaches a new network interface to a guest |'
  merge: -1
  pgno: 458
- img_proc: true
  md: '# 480 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and
    Lab Manual


    detach-device Detaches a device from a guest


    detach-disk Detaches a disk from a guest


    detach-interface Detaches a network interface from a guest


    Just as you''re managing virtual guests, you need to connect to a hypervisor before
    you can begin using these commands. Within each virtual guest, you have available
    the same utilities discussed in Chapter 9; however, these additional options for
    virsh give you an external view of what is going on the physical host and guest
    system. When monitoring resources, you also have the option of using the virt-manager
    utility. This utility has all the same options, but it allows you to see in a
    graphical form. It is important to create a baseline with your virtual guests
    when you create them for the first time. This allows you to monitor resources
    and determine if there is a problem by comparing the current utilization to the
    baseline of the system. This is an important skill to have, especially when you''re
    trying to determine whether your current hardware is enough to support your virtual
    guest systems.


    # Summary


    In this chapter, we discussed KVM on RHEL6 to create and manage virtual guests.
    We also discussed how to monitor these virtual guests after they have been created.
    Although there is a separate Red Hat certification based solely on virtualization,
    system administrators need to understand the basics of creating and managing virtual
    machines, particularly in today''s world where virtualization is everywhere. If
    you have an interest in virtualization using Red Hat technologies, I suggest you
    look at the RHCSA certification and training courses.


    # Review Questions


    +   1. The virt-install package allows you to manage virtual machines via a GUI
    interface. True or False?


    +   2. By default, all virtual machines are created with the same amount of RAM.
    True or False?


    +   3. What is the virsh command used for?


    +   4. What does virsh reboot Client@4 do?


    +   5. How can you display all virtual guests after they''re connected to a hypervisor?'
