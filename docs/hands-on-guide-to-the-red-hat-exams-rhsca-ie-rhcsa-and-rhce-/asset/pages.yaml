  md: '# Task 2 – RAID


    +   **Step 1.** Disk /dev/hdc in RHEL01 needs to be partitioned. Use the following
    guidelines while partitioning the disk:

    a. There should be three equal-sized partitions that consume the whole disk.

    b. The third partition should be a swap partition.

    c. The first two partitions should be set up in a RAID 1 array.

    nThe task is complete when the partitions and RAID array have been created and
    can be verified.


    # Task 3 – LVM


    +   **Step 1.** Set up LVM on your system using the following guidelines:

    a. Create a physical volume on /dev/hdd.

    b. Create a volume group called VolGroup22.

    c. Create two logical volumes within VolGroup22.

    d. The first logical volume should have the default name.

    e. The second logical volume should be named Company_Data.

    f. Both logical volumes should be 2,048MB in size.


    +   **Step 2.** Make the following changes to your LVM structure:

    a. Extend your LVM structure by adding /dev/hdb3 into the volume group (VolGroup22).

    b. Grow your Company_Data volume to fill the rest of the volume group.


    The task is complete when the logical volumes, volume groups, and physical volumes
    can all be verified.'
