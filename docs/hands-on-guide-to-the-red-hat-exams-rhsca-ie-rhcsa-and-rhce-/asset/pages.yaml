    \ ACCEPT: filter [ OK ]\n  iptables: Unloading modules: [ OK ]\n  iptables: Applying\
    \ firewall rules [ OK ]\n\nAdditionally, you need to look at SELinux protection\
    \ for the web server. Table 14-1 presents the available options.\n\n# Table 14-1\
    \ SELinux Options\n\n| Option | Description |\n| httpd_can_network_relay | Allow\
    \ httpd to act as a relay. |\n| httpd_can_network_connect_db | Allow httpd scripts\
    \ and modules to connect to databases over the network. |\n| httpd_use_gpg | Allow\
    \ http to run gpg in the gpg-web domain. |\n| httpd_enable_cgi | Allow httpd CGI\
    \ support. |\n| httpd_use_cifs | Allow httpd to access CIFS file systems. |\n\
    | allow_httpd_mod_auth_pam | Allow Apache to use mod_auth_pam. |\n| allow_httpd_anon_write\
    \ | Allow Apache to modify public files used for public file transfers. Directories/Files\
    \ must be labeled public_rw_content_t. |\n| httpd_enable_homedirs | Allow httpd\
    \ to read home directories. |\n| allow_httpd_sys_script_anon_write | Allow Apache\
    \ Scripts to write to content. Directories/Files must be labeled public_rw_content_t.\
    \ |\n| httpd_dbus_avahi | Allow Apache to communicate with the avahi service via\
    \ dbus. |\n| httpd_unified | Unify httpd handling of all content files. |"
