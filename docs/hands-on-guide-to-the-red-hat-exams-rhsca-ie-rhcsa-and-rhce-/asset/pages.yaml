    \nStep 3. Install the required package:\n\n```\n# yum install -y tftp-server\n\
    ```\n\nStep 4. Verify that the package is installed correctly:\n\n```\n# rpm -qa\
    \ | grep tftp\ntftfp-server-0.49-5.1.el6.x86_64\n```\n\nNow that the package is\
    \ installed, you can go into the /etc/xinetd.d directory and see the config file\
    \ for the new service. By default the TFTP service is disabled. Let's look at\
    \ the config file, which is small and simple to understand.\n\n```\n# cat /etc/xinetd.d/tftp\n\
    service tftp\n{\n    socket_type = dgram\n    protocol = udp\n    wait = yes\n\
    \    user = root\n    server = /usr/sbin/in.tftpd\n    server_args = -s tftpboot\n\
    \    disable = yes\n    per_source = 11\n    cps = 100 2\n    flags = IPv4\n}\n\
    ```\n\nHere, you can see the bases, such as which protocol and what arguments\
    \ are passed to the service during startup. For this example, all defaults work\
    \ fine. You may be wondering why I suggest leaving the service disabled if you\
    \ want to use it. Services that are controlled by xinetd can be enabled in the\
    \ config file when you enable them during the boot process.\n\nStep 5. Enable\
    \ the TFTP server to start when the system boots:\n\n```\n# chconfig tftp on\n\
    ```\n\nStep 6. Verify that the service will start during booting:\n\n```\n# chconfig\
