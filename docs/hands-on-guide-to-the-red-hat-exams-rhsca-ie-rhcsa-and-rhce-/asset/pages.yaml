  md: "# Hands-on Guide to the Red Hat Exams: RHCSA™ and RHCE® Cert Guide and Lab\
    \ Manual\n\n# Step 4.\n\nYou could also reference the default directory for a\
    \ single command:\n\n```\n## chcon --reference=html site2\n```\n\nThis changes\
    \ the site2 directory to match the html directory’s SELLinux context.\n\n# Step\
    \ 5.\n\nYou can now check again and verify that all the context fields for the\
    \ customer site directories have been changed correctly:\n\n```\n# 11 -Z\ndrwr-xr-x.\
    \ root root system_u:object_r:httpd_sys_exec_t:s:0 cgi-bin\ndrwr-xr-x. root root\
    \ system_u:object_r:httpd_sys_content_t:s:0 error\ndrwr-xr-x. root root system_u:object_r:httpd_sys_content_t:s:0\
    \ html\ndrwr-xr-x. root root system_u:object_r:httpd_sys_content_t:s:0 icons\n\
    drwr-xr-x. root root system_u:object_r:httpd_sys_content_t:s:0 site1\ndrwr-xr-x.\
    \ root root system_u:object_r:httpd_sys_content_t:s:0 site2\n```\n\n# Troubleshooting\
    \ Apache\n\nOne of the best tools available for troubleshooting Apache is its\
    \ log files. Each log file has a separate directory from the other on the system,\
    \ which makes them easy to pick out. There are two basic files you can use to\
    \ troubleshoot with:\n\n+   - /var/httpd/access_log\tLogs access to the server\n\
    \n+   - /var/httpd/error_log\tLogs error messages from the server\n\nUsually,\
    \ browsing these two logs provides you with enough information when troubleshooting\
    \ to resolve your issues. In the main config file, there is also a section for\
    \ logging that enables you to change the information recorded by the httpd service.\
    \ If you'd like different output (or more output), you can adjust the logging\
    \ accordingly.\n\nIf you're using a secure server, there are three additional\
    \ files for SSL:\n\n+   - /var/httpd/ssl_access_log\tLogs access to the secure\
    \ site\n\n+   - /var/httpd/ssl_error_log\tLogs error messages from the secure\
    \ site\n\n+   - /var/httpd/ssl_request_log\tLogs requests made from the server\
    \ to clients\n\nAs you have already seen, you can use the config-test parameter\
    \ when looking for errors in the main config file. One error error everyone seems\
    \ to get when starting the service is about the ServerName option not set, so\
    \ the web server assumes 127.0.0.1 by default. To correct this, you should set\
    \ the ServerName option within the main config file to the name of your server.\
    \ You can also change the amount of output generated in the log files by changing\
    \ the LogLevel option within the main config file."
