  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    # Summary


    File sharing makes life a lot easier when you don''t have files all over the place.
    Centralized file storage also helps when it comes to security and auditing. Knowing
    how to work with file sharing services is a big part of collaboration in the workplace.
    Users always need a place to put their files, and security is always a growing
    concern. Make sure that you plan ahead for growth of file servers, and from time
    to time, test your security. At this point, you should know how to set up a file
    sharing server using NFS. This chapter provided a lot of information due to the
    requirements of setting up such services, so make sure you practice labs and different
    configuration styles until you are comfortable setting up and troubleshooting
    all the different file sharing services.


    # Review Questions


    +   1. Red Hat Enterprise Linux 6 uses the portmap service alongside the NFS service.
    True or False?

    2. What is the /var/lib/nfs/etc file used?

    3. To export directories as resources, what file needs to be edited?

    4. The exportfs command is used to view currently exported resources. True or
    False?

    5. What port does NFS use by default?

    6. What command can you use to view NFS statistics?

    7. What option needs to be used with the mount command to mount an NFS resource?


    # Answers to Review Questions


    +   1. False. The portmap service was replaced by the rpbind service in Red Hat
    Enterprise Linux.

    2. The /var/lib/nfs/etc file is used to keep track of currently exported resources.

    3. The /etc/exports file needs to contain any directory that you want to export,
    including which options you''d like to use as well.

    4. False. The exportfs command is used to export one or all resources.

    5. The NFS service uses TCP port 2049 by default.

    6. The nfsstat command can be used to view NFS statistics.

    7. The -t option is used with the mount command to mount NFS resources.'
