  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Guide and Lab Manual


    If you want to upgrade package (because you know that it is already installed),
    you can substitute the -i option for -u. This command upgrades the package or
    installs it if the package isn''t already installed:


    ```

    # rpm -Uvh nano-2.2.6-1.x86_64.rpm

    ########################################################### [100%]

    ########################################################### [100%]

    1:nano

    ```


    You might decide that you no longer want the package installed. In that case,
    you can use the -e option to remove it:


    ```

    # rpm -e nano

    ```


    You can reinstall the package at a later date if you keep the .rpm file on your
    system (or if you download it again).


    > REAL-WORLD TIP


    A common situation to run on the job is having to install a package that is already
    installed. You don''t have to go through the trouble of uninstalling the package
    first only to reinstall it. You can use the -replacepkgs option along with radius
    to install over an existing installation:


    ```

    # rpm -ivh replacepkgs nano-2.2.6-1.x86_64.rpm

    ```


    # Querying and Verifying Packages


    You just installed the latest version of a package and want to make sure that
    it installed properly. How do you check? You can use the query and verification
    options for the rpm command, of course. Let''s jump back to the installation of
    nano for a second. This time, before you install the package, you can query the
    currently installed system packages to verify whether nano is already installed.
    If you already installed the newer version of nano, your output might look slightly
    different from mine.


    Query the installed packages for nano:


    ```

    # rpm -qa | grep nano

    nano-1.3.12-1.el16.x86_64

    ```


    The -q option tells rpm that you are querying for something, and the -a option
    tells rpm to query all packages installed on the system. You don''t want to list
    every single package, however so you can use the grep command to pick out only
    the package(s) you are hunting for. The benefit of using grep is that it is actually
    a pattern match, it returns multiple results matching what you are looking for
    (giving you all the installed packages on the system relating to nano or whatever
    you are hunting for). If the package does not exist, no results are returned.
    As you can see here, the package does exist and it is at version 1.3.12.'
