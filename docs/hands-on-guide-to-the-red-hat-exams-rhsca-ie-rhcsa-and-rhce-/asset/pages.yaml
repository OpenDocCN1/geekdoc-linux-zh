    # Troubleshooting File Systems


    This section covers about file system and partition issues.


    The System Complains About a File System Label


    When entries in the /etc/fstab (which are read at boot time), you can use a label
    instead of the actual partition path to make things easier for you to read and
    find. If for some reason, the label changes and you haven''t updated the /etc/fstab
    file, you receive an error. If this error is on the root file system, you need
    to enter single-user mode and adjust the /etc/fstab file before the system will
    boot properly.


    The Superblock Has Become Corrupt


    If the superblock on your system has corrupt, you can re-create it one with the
    backup superblocks. If the primary file system has the corruption, you may need
    to use single-user mode or the rescue environment to perform the recovery.


