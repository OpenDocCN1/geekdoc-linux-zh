    Polling This type of communication between the device and the CPU is best-used
    for devices that don''t need to be instant. Polling at the CPU''s convenience,
    and thus incurs the cost of processing overhead and a delay between a device action
    and the processing of the action. Such a model is useful when the device doesn''t
    pose a problem to the overall responsiveness of a device. For example, screens
    refresh at 60Hz (about 16ms), and thus a mouse that incurs a tiny, microsecond
    delay due to polling would be largely imperceptible.


    Interrupt This type of communication is best when there is time of essence. Interrupts
    allow the CPU to handle the I/O event as soon as it occurs, since the event is
    generated as soon as possible. The obvious downside is the overhead of the interrupt
    handler, though this sort of delay is largely unavoidable.


    # Transferring Data to/Devices


    Interfaces to devices are implemented with a series of registers that are used
    for different actions. Typically, there are three types: status registers, command
    registers, and data registers. These simply appear as memory locations to the
    CPU, writing to a register (a memory store) would trigger a device action. There
    are two means of transferring the data and from the device: programmed I/O or
    direct memory access. These essentially depend on whether the CPU accesses device
    memory or main memory.


    PIO The programmed I/O, or PIO, is that it requires additional hardware support:
    the CPU simply treats reads and writes to special registers like any other memory
    load/store operations. Using their registers often comes with a high performance
    cost, for example, sending a 1500-byte packet on a NIC with a 8-byte register
    would require 199 load/store instructions!


    DMA Allowing the device to access main memory directly is faster, albeit more
    complex. Direct access, or DMA, requires hardware support in the form of a "DMA
    controller.\ In this model, rather than accessing the device''s registers directly,
    the data transfer is managed by the controller. By using main memory, we avoid
    the overhead of fragmented transfers: the CPU tells the device where to find the
    data in memory. With the network packet example, the transmission request (which
    is still to the command register by the CPU) includes information about where
    to find the packet in main memory. From the CPU''s perspective, we only need a
    single store instruction (for the command) and a single DMA configuration.


    An important thing to keep in mind for DMA is that the main memory question can
    no longer be paged out; must persist as long as the device needs to perform a
    data transfer.


