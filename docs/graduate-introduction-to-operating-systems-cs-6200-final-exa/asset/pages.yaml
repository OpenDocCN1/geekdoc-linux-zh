    Since the home node is a static property of the memory, the mapping between memory
    and its respective home (called the global map) is distributed and replicated
    across every node in the system. The prefix of a shared address identifies its
    home node, whereas the suffix identifies the replica number. A result behaves
    under virtual address translation: the first part is an index into a global map
    to nodes (the index into the page table), and the second part is a frame number
    (like the offset physical memory).


    # MOVE, HOME NODE, GET OUT THE WAY


    By adding a level of redirection between a shared memory address and its home,
    we can allow the home to move. Instead of treating the prefix as a node ID, it''s
    translated to an index that maps into a dynamic home node.


    If we introduce explicit replicas to the system – existing along the on-demand
    replicas that are already temporarily present in local caches – we implement load
    balancing, hotspot avoidance, and redundancy. Management of such replicas can
    be either by the home node or a higher-level management node, which effectively
    acts as a home node for one or more backing nodes.


