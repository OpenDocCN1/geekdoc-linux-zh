    In order to create an isolation for processes, in which they have access to all
    (or more) the system''s physical memory, computers use page tables. Processes
    are assigned a virtual address space; this is associated with physical memory
    as it''s referenced. Page tables are the data structure that performs the association
    and translation between virtual and physical addresses (or nested levels of page
    tables, known as multi-level page tables). They require hardware support and are
    outside the scope of the kernel - modern architectures have a memory management
    unit (MMU) responsible for these tasks.


    When the process accesses memory, the virtual address is translated to a physical
    location by the MMU. There are a variety of things that can occur as a result
    of an unsuccessful translation:


    Not Present if the translation for requested address is present in the page table
    but does not translate to an existing physical address, that (the entire "page")
    has been moved elsewhere (like to)'
