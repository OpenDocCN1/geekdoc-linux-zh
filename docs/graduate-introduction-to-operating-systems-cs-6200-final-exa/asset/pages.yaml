    # Review Guide — FINAL


    Implementation The requue of this scheduler used two parallel arrays of lists
    (i.e. something struct task_list[140]). One of these was the active array whereas
    the other was the expired array; the index corresponded to the priority.


    # ACHIEVING O(1)


    Insertion is trivially O(1): it requires inserting into an array and mapping the
    “end” pointer of the list to the new task. Selection is achieved by using a hardware
    instruction to find the first set bit in a bitmap corresponding to the array in
    which a set bit indicates a non-empty index.


    Tasks remain in the active array until they expire; voluntarily yielding tasks
    “active”. On expiration, the task is moved to the expired array. When there are
    no more tasks in the active array, it is swapped with the expired array. Note
    that higher priority tasks (which are often I/O-bound) higher times means that
    they will be kept scheduled if they need appropriately.


    Problems workloads changed to become more interactive; things like video chat,
    gaming, etc meant the jitter caused by long times became unacceptable. Even though
    I/O-bound tasks would naturally get a higher priority, moving to the expired array
    may mean a wait before they ever get another chance to run. Significant delays
    cause poor performance for users. The O(1) scheduler didn''t make guarantees or
    clauses for fairness: task execution was not proportional to priority.


    Linux CFS This scheduler—“completely fair scheduler”— replaced it. Its requue
    uses a red-black tree, which is self-balancing and tries to ensure the tree’s
    depth is similar across all nodes.[]. The tree is ordered by “virtual runtime,”
    or runtime. Its priority is proportional to the time spent by a task on the CPU
    (with nanosecond granularity) and in other words, runtime is adjusted based on
    the actual time spent on the CPU, then scaled by the task’s priority and “nicness”¹.


    Implementation In each branch, the left node has less runtime than the right node.
    Hence, the left-most node in the tree is always picked, as it has the least amount
    of time on the CPU. Runtime increases for low-priority tasks, moving them to the
    right, and increases slower for high-priority tasks, allowing them more time on
    the left side of a branch. The same tree is used for all priorities; the priority
    is implicitly included in the balancing of the tree via runtime.


    Algorithmic Complexity Selecting a task is still O(1), but insertion is now O(log
    N), where N is the total number of processors in the requue.


    > In Fedora’s task of scheduling for multiprocessors, what’s the goal of the scheduler’s
    figuring for? What are some performance counters that can be useful in identifying
    the workload (compute vs. memory bound) and the ability of the scheduler to maximize
    the throughput?


    Fedora argues that the ideal scheduler would need information about pending workloads
    when scheduling decisions. It uses the theoretical metric CPI, or cycles per execution,
    as a way to measure the “average instruction delay.” A device-heavy workload would
    spend a lot of ticks waiting on an instruction to complete, whereas a CPU-bound
    workload could complete faster.


    Unfortunately, CPI is not only a theoretical, but unreliable metric for many applications.
    Applications are often not heavily skewed towards either CPU-bound or I/O-bound,
    meaning CPI does not vary enough to make reliable scheduling decisions.


    CALL: A task’s “nice” value adjusts its priority from the default.


