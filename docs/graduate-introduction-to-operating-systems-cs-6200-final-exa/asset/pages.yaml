    When sharing state, what are the tradeoffs associated with the sharing granularity?


    The choice of granularity is correlated to the layer in the software stack that
    the shared memory implementation resides. For example, sharing by the page is
    tightly-coupled with the operating system, the system also manages memory by the
    page. Other approaches, like per-object sharing, are application-or-specific.
    One thing to be careful of is granularity increases when two operations operate
    on different portions of the shared memory region. For example, given one KiB
    page, application instance A might need the first 100 bytes and instance B might
    need the last 100 bytes. Neither of these instances cares that the other is operating
    in the same page, but since granularity is page-based, with object-based granularity,
    one might need only Object::member_a while another needs only `Object::member_b`.


    For distributed memory systems (think distributed shared memory) what are the
    basic mechanisms needed to maintain consistency – e. do you understand why it
    is better to use “home nodes,” and why we differentiate between a global index
    structure to find the home nodes and a local index structures used by the home
    nodes to track information about the position of the state are responsible for?


    When distributing it helps to associate a particular state with a “home node”.
    In the context of distributed shared memory, this is called a home node, and is
    responsible for maintaining metadata about the state. This includes tracking access
    and modifications to its memory caches, permissions (i.e. whether or not a particular
    memory location can be cached), locking for exclusive access, the. The home node
    is different from the state owner, which is the (temporary) owner and operator
    on a particular memory segment. Of course, the home node does track the current
    owner; all of this metadata, indexed by the object identifier, itself is a local
    metadata map.


