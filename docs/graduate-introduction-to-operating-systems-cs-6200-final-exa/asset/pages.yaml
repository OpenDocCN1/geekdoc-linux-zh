    | Processes to share memory, what does the OS need to do? Do they use the same
    virtual addresses to access the same memory |


    For processes to share memory, they need to ask the kernel to create a shared
    memory segment. This is a special piece of memory in which both processes map
    their unique virtual address to the same memory location:


    ![](img/a24b7091bf587932fb9e28c7753b6515_9_0.png)


    This association requires expensive initial setup on the kernel: the OS must create
    (and track) the virtual address mapping and allow it to be used by multiple processes.
    After that, though, the sharing happens exclusively in userspace. This is a big
    advantage over other IPC methods, such as message queues or sockets, which rely
    on the kernel to deliver every message.


    > For processes to communicate using a shared memory-based communication channel,
    they still have to copy data from one location to another? What are the costs
    associated with vs. (re)mapping? What are the tradeoffs between message-based
    vs. shared-memory-based communication?


    When sharing memory, changes to memory in one process are reflected in the other
    and transparently. Of the view of the shared memory could change at any time.
    Hence, if a process needs to perform calculations based on shared memory that
    is at risk of being overwritten, it must copy them to its local memory. There
    may still be copying involved, but this isn''t universally true; with a good design
    and proper synchronization, the amount of copying from using shared memory can
    be greatly reduced to the other, kernel-level IPC mechanisms.


    Trade-offs Message-based IPC has the advantage of using a standard, kernel-provided
    API that can guarantee about thread-safety, message arrival, all. E of these have
    to be re-implemented by the programmer if desired with shared memory IPC. On the
    downside, though, such convenience comes with the cost of performance. As mentioned
    previously, message-based IPC requires a lot of expensive hops from user mode
