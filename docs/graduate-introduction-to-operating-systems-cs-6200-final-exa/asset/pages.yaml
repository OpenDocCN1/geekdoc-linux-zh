    # INTEL PTE


    The following is a page table entry on the MMU in Intel processors.


    | 31 | 9 | | | | | | | 0 |

    |---|---|---|---|---|---|---|---|-|

    | PPN | G | PAT | D | PCD | PWT | U/S | R/W | P |


    The labels correspond to the following meanings:


    +   - **D** The dirty bit, indicating whether or not the page has been written
    to since it was loaded.

    - **A** The accessed bit, indicating whether or not the page has been accessed
    during some period of time, typically used in page replacement algorithms.

    - **PCD** Indicates whether or page caching is disabled.

    - **PWT** Toggles page-through.

    - **U/S** Indicates the privilege level of the page, either user-mode or system-mode.

    - **R/W** Controls the permissions on the page: 0 indicates it''s a read-only
    page, whereas 1 indicates both read and write permissions.

    - **P** The present bit, akin to a "valid" bit.


    How does the OS manage the memory allocated to the underlying physical memory?
