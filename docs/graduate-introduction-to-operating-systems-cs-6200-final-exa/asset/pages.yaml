    | What were the problems with virtualizing x86? How did protection of x86 used
    to work, and how does it work now? Were the virtualization problems on x86 fixed?


    An important requirement in virtualization is that the hypervisor needs to be
    aware of, and handle correctly, all of the privileged system calls. This relies
    on the fact that execution of a privileged instruction by guest would trap into
    the VMM. A big problem when virtualizing x86 systems was that, well, this didn''t
    happen (for 17 instructions). For example, enabling and disabling interrupts would
    silently fail rather than trap into the kernel, meaning guests couldn''t do this,
    and VMMs weren''t aware that they!


    Though these inconsistencies were fixed in the architecture, the solution to them
    was to translate such problematic instructions into ones that would trap into
    the VMM! This technique is known as binary translation.


    From the hardware side of things, x86 – which is now the most dominant architecture
    – added a lot of features to improve virtualization support:


    +   **Privileges** Instead of the 4-ring approach that didn''t define clear purposes
    for each guest, there is simply a “root,” and “non-root” mode for instructions.


    +   **VM Control Structure** Instructions that come from VMS are handled better;
    the hardware can actually inspect instructions and determine whether or not it
    should expect a trap. Furthermore, these “VCPUs” track metrics and are accessible
    by the hypervisor.


    +   **Pages Tables** Page tables are extended to perform better under virtualized
    environments. For example, the TLB in the MMU now tags with a “virtual machine
    identifier,” which allows it to cache translations.


    +   **Devices** Support was introduced for devices to be more aware of virtualized
    environments. For example, multiple devices have logical interfaces that each
    can interact with a VMM separately. Interrupts are routed better, as well.


    | In virtualization, what the passthrough vs. split-device model?


    The massive variety in I/O devices means we can''t use a more uniform, standard
    approach to virtualization as with CPUs or memory. There are many models for achieving
    virtualization.


    **Pasthrough** In the passthrough model for device virtualization, the VMM confirms
