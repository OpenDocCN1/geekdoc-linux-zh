    Do you understand the history and motivation behind cloud computing, and basic
    models of cloud offerings? Do you understand some of the enabling technologies
    that make cloud offerings useful?


    Cloud computing is beneficial due to its elasticity and abstraction. There''s
    no need to manage infrastructure; the scale of your application is directly correlated
    with its demand, saving money and resources. Management of your application is
    standardized and easily-accessible via a web API provided by the cloud computing
    service. Billing is based on usage, typically divided by “tiers” that corresponds
    to the power of a rented system.


    The cloud operates on a massive scale and requires technologies that support such
    a scale. Aside from the obvious need for virtualization to isolate tenants, clouds
    also need resource provisioning technologies to fairly allocate, track, and manage
    resources for their tenants. Furthermore, big data technologies are essential
    in storing and processing the immense amounts of data that customers (and the
    providers themselves) consume. The necessity of “virtual infrastructure” by customers
    also makes software-defined solutions deponent. Finally, monitoring at scale requires
    real-time processing solutions to catch and analyze failures.


    Do you understand what the cloud scales make it practical? Do you understand what
    about the cloud scales make failures unavoidable?


    The Large of Numbers makes cloud services viable. Different clients, of whom many,
    have different usage patterns and peak times. Averaging these factors leads to
    a steady pattern of resource usage for the provider.


    Unfortunately, this law leads to unavoidable failures. The scale that cloud services
    operate means amounts of hardware. If the failure rate of a particular component
    – say, a hard drive is 0.01% per month (1 in 10,000), a sufficiently-large data
    center might have 100,000 hard drives. That means about 10 hard drives will fail
    a month, every month! Of course, that’s hard drives; there are hundreds, if thousands,
    of individual components in a particular system. Thus, individual failures happen
    with a fairly high frequency.


