    One of the obvious overheads of scheduling is the execution of the scheduling
    algorithm itself. Just if it''s only beneficial to switch between tasks:


    ```

    $2^{context switch < t_{blocking}}$

    ```


    Similarly, it''s only beneficial to run the scheduler if it takes less time than
    the amount of time it would take to finish the task. To discretize the overhead,
    there''s the overhead of overhead, the overhead of the algorithm, and the overhead
    of the resulting context switch. It''s even possible to schedule control when
    there''s nothing to do – for example: a timeslice expired, it''s only the task.


    Longer timeslices are better for CPU-bound tasks. By their nature, metrics like
    average wait time are irrelevant because the task''s goal is to do useful work.
    CPU-bound tasks don''t require interactivity and can always make the best of their
    time on the CPU.


    Shorter timeslices are better for I/O-bound tasks. I/O-heavy tasks will implicitly
    create their own schedule by yielding during I/O operations. Additionally, shorter
    timeslices allow them opportunity to interact with the user, responding to incoming
    requests, etc. which are essential for perceiving “interactivity.” The sooner
    an I/O bound task can issue an I/O request, the better; less idle time for task
    and better for other tasks who also want CPU time. Shorter timeslices allow for
    a better distribution of utilization – both devices can stay highly in-use.


