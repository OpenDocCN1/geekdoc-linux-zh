    Disk access is the slowest type of data access; we employ several techniques that
    optimize both the software and hardware-specific aspects of disk access to avoid
    such significant latency:


    **Caching** The operating system maintains a file buffer cache in main memory.
    This cache stores parts of the file and maintains changes to those parts. The
    changes are periodically flushed via fsync(). This is why it is dangerous to unplug
    a USB drive without "ejecting" it first; the data might still be in the cache!
    This cache is per-file, so all viewers of a file see changes simultaneously and
    instantaneously; these are known as UNIX semantics when discussing update synchronization.


