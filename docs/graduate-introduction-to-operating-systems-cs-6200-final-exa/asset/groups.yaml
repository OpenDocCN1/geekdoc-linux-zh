    The empirical data, though likely to be largely bogs and completely invaluable
    considering everyday file access patterns (most files are open for 0.5 seconds?)
    really? okay dude; that’s not enough time to edit it), affects the design of Sprite
    in significant ways.


    Write-Back Delays Sprite adopted an approach where every 30 seconds, dirty blocks
    that had been since modified during period (i.e. in the last 30 seconds) are written
    out of a client''s cache to the server’s cache. After 30 seconds under the same
    conditions, it would be written to the server’s disk. This design choice was made
    under the observation that “20-30% of new data was deleted within 30 seconds,
    and 50% was deleted within 5 minutes”; as such, it made sense to delay disk writes
    in hopes that they would not be necessary in the first place, since the original
    write would be deleted.


    Rejecting Write-on-Close Part of the rationale to implementing write-back rejecting
    the write-on-close alternative. The BSD study indicated to the authors that “75
    percent of files are open less 0.5 seconds and 90 percent are open less than 10
    seconds”, which indicated that on-close would occur very frequently, and thus
    still incur a high cost overall.


    Benchmark Estimates The authors used the BSD study to approximate how many simultaneous
    clients a machine running Sprite could handle. They used the “average I/O rates
    per user” to approximate load, and extrapolated this to the maximum of concurrent
    users under the various networked filesystem implementations.


    In Sprite NFS, various parts of the system track metadata points. For example,
    the use of out-dated caches, both the clients and the servers receive version
    information about their files; the clients compare their local versions to that
    of the server when they open them, in order to see or not their version is outdated.
    Endpoints track per-file timers for the delayed write-back, as well as “cacheability”
    flags that kick in when there’s a writer to a file. The server also tracks the
    current and last write of a file; the latter is referenced when the server needs
    its dirty blocks (since these are fetched on-demand instead of pushed).


