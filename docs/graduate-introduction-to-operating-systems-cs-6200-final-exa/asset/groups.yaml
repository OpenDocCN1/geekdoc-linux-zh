    # 操作系统研究生导论


    # 复习指南 — 期末考试


    实现：该调度器使用了两个并行的列表数组（例如 `something struct task_list[140]`）。其中一个是活跃数组（active array），另一个是过期数组（expired
    array）；索引对应优先级。


    # 实现 O(1)


    插入是轻而易见的 O(1)：它需要将任务插入到数组中，并将列表的“末尾”指针映射到新任务。选择通过使用硬件指令在位图中找到对应数组的第一个置位来实现的，位图中的置位表示该索引非空。


    任务一直留在活跃数组中，直到它们过期；主动让出（yielding）的任务保持为“活跃”状态。过期后，任务被移动到过期数组。当活跃数组中没有更多任务时，它将与过期数组交换。请注意，高优先的任务（通常是
    I/O 密集型的）频率更高，意味着如果需要，它们会被更频繁地调度。


    工作负载发生了变化，变得更具交互性；如视频聊天、游戏等，这意味着长时间等待引起的抖动变得无法接受。尽管 I/O 密集型任务自然会获得更高的优先级，但移动到过期数组可能意味着在获得下一次运行机会之前需要等待。显著延迟会导致用户性能低劣。O(1)
    调度器没有对公平性做出保证或规定：任务执行与优先级不成正比。


    Linux CFS：这种调度器——“完全公平调度器”取代了它。它的实现使用了红黑树，红黑树是自平衡的，并试图确保树深度在所有节点之间相似。树按“虚拟运行时间”（virtual
    runtime）或运行时间排序。优先级与任务在 CPU 上花费的时间（纳秒级粒度）成比例，换句话说，运行时间根据在 CPU 上的实际时间进行调整，然后根据任务的优先级和“nice”值¹进行缩放。


    实现：在每个分支中，左节点的运行时间少于右节点。因此，树中最左的节点总是被选中，因为它在 CPU 上花费的时间最少。低优先级任务的运行时间增加，将它们移向右侧；高优先级任务增加较慢，允许它们在分支的左侧停留更多时间。所有优先级都使用同一棵树；优先级通过运行时间在树的平衡中隐含包含。


    算法复杂度：选择任务仍然是 O(1)，但插入现在是 O(log N)，其中 N 是要求中处理器的总数。


    > 在 Fedora 的多处理器任务调度中，调度器计算的目标是什么？哪些性能计数器有助于识别工作负载（计算密集型 vs 内存密集型）以及调度器最大化吞吐量的能力？


    Fedora 认为，理想的调度器在做出调度决策时需要待处理负载的信息。它使用理论指标 CPI（每次执行的周期数）作为衡量“平均指令延迟”的方法。设备密集型工作负载会花费大量时钟周期（ticks）等待指令完成，而
    CPU 密集型工作负载可以更快地完成。


    遗憾的是，CPI 对于许多应用来说不仅是一个理论指标，而且是一个不可靠的指标。应用程序通常不会极端偏向 CPU 密集型或 I/O 密集型，这意味着 CPI
    的变化不足以做出可靠的调度决策。


    术语解释：任务的“nice”值会在默认值的基础上调整其优先级。


