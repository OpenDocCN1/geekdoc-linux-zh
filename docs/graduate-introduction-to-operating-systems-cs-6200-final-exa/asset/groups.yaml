- md: "\n# Graduate Introduction to Operating Systems\n\n# Review Guide – FINAL\n\n\
    **Read & Increment** This instruction is essential to the following code, executed\
    \ atomically:\n\n```\nint read_and_inc(int value) {\n    int old = *value;\n \
    \   ++(*value);\n    return old;\n}\n```\n\nThis is essential for the queuing\
    \ lock described in the last question of this section.\n\nDifferent hardware implement\
    \ different atomic instructions; certain synchronization constructs that rely\
    \ on particular atomic instructions are not necessarily platform-independent.\n\
    \n> Why are spinlocks useful? Would you use a spinlock in every place where you're\
    \ currently using a mutex?\n\nSpinlocks are useful for critical sections: it's\
    \ more efficient to wait for the critical section to be available than perform\
    \ a context switch to another. In other words, it's useful in situations in which\
    \ fault equals:\n\n```\ncontext < blocking task\n```\n\ndoes not. It's also useful\
    \ when there are no tasks, yielding (and then immediately being running) is essentially\
    \ a cheaper version than simple looping. For these specific scenarios, spinlocks\
    \ are useful. They should generally not replace existing approaches to synchronization,\
    \ such as using mutexes.\n\n> Can you understand why it is useful to have more\
    \ powerful synchronization constructs, like reader-writer locks or monitors? What\
    \ about makes them more powerful than using spinlocks, or mutexes and condition\
    \ variables?\n\nAdvanced synchronization constructs are beneficial because they\
    \ assume some usage pattern. The more generic the pattern, the fewer assumptions\
    \ can be made about how it will be used. Reader/writer locks, for example, even\
    \ if they use semaphores under the hood, choose better internal design decisions\
    \ because they describe more specific usage semantics.\n\nFrom the perspective\
    \ of the programmer, higher-level constructs are easier to use and configure incorrectly.\
    \ When low-level requirements like locking and unlocking are implicit, it's harder\
    \ to make these mistakes.\n\n> Can you work through the evolution of the spinlock\
    \ implementations in the Anderson paper, from basic test-and-set to the queuing\
    \ lock? Do you understand issue with an earlier implementation is addressed with\
    \ a subsequent implementation?\n\nFirst, there was test-and-set, just spinning\
    \ on the atomic instruction. Then, there was test-and-set, which made better use\
    \ of the cached value, since test-and-set invalidates the cache if the value doesn't\
    \ change. Then, there were sleeps (both static and dynamic) introduced both the\
    \ memory reference and before the lock check (to allow threads to quiesce without\
    \ invalidation). Finally, there was a queuing lock in which threads occupied a\
    \ position in a line and each release of the lock would trigger the next thread\
    \ to go; this method required a more complex atomic instruction, though (or the\
    \ emulation of one).\n\n# Graduate Introduction to Operating Systems\n\n# Review\
    \ Guide – FINAL\n\n# Performance\n\nDifferent types of spinlocks were better suited\
    \ for different levels of contention and processor count. In general, this can\
    \ be divided into two categories: high load (many contending processors) and low\
    \ load (a handful of contending processors). The latter is a better model for\
    \ modern x86 systems, which typically have 2-4 cores.\n\n![](img/a24b7091bf587932fb9e28c7753b6515_12_0.png)\n\
    \n**Figure 4**: Performance comparison of Anderson's spinlock implementations.\n\
    \n**High Loads** Under loads, the queuing lock was the best implementation: it\
    \ scaled the processor count increased. Test-and-test-and-set performed the worst\
    \ because it introduced the highest level of contention. Static locks performed\
    \ better than dynamic sleeps in their respective categories, and sleeping after\
    \ a memory reference outperformed sleeping on the lock release since it avoided\
    \ invalidations.\n\n**Low Loads** Under low loads, the basic spin-lock (r.a.a.\
    \ test-and-test-and-set) performed the best, which was the simplest and had the\
    \ lowest latency. For some reason, dynamic backoff-outperformed static backoff,\
    \ since the delay was lower between seeing the lock and acquiring it than it would've\
    \ been in the static case. The queuing lock actually performed the worst because\
    \ of its higher initial cost: the read-and-increment atomic function is pricier\
    \ to execute and results in a high latency.\n\n# Part 3 – Lesson 5: I/O Management\n\
    \nLecture video: https://classroom.udacity.com/courses/ud923/lessons/345023824/concepts/last-viewed\n\
    Transcript: https://docs.google.com/document/d/1kVn9P5mevfh5SepCyC-Ix0CcRGfB41VG5chCW-j6w\n\
    \n> What are the steps in sending a command to a device (say packet, or block\
    \ file)? What are the steps in receiving from a device? What are the differences\
    \ in programmed I/O vs DMA support?\n\nThe interface for interacting with a class\
    \ of hardware devices is typically defined by the operating system; this is the\
    \ abstraction layer discussed at the beginning of the class. The bridge between\
    \ the operating system exists and how the device acts properly functionality is\
    \ implemented by the device driver. Even still, there are differences in how a\
    \ CPU processes events from devices.\n\n# Processing Device Events\n\nBroadly,\
    \ devices can be split into two categories: polling-based devices and interrupt-based\
    \ devices. The communication mechanism we use should be decided based on the device\
    \ properties and the goals: things such as update frequency (how fast does a file\
    \ read, how often a user moves the mouse), performance goals (latency vs. throughput),\
    \ data rate (i.e. input- or output-only) and other device-specific considerations.\n\
    \n**Polling** This type of communication between the device and the CPU is best-used\
    \ for devices that don't need to be instant. Polling at the CPU's convenience,\
    \ and thus incurs the cost of processing overhead and a delay between a device\
    \ action and the processing of the action. Such a model is useful when the device\
    \ doesn't pose a problem to the overall responsiveness of a device. For example,\
    \ screens refresh at 60Hz (about 16ms), and thus a mouse that incurs a tiny, microsecond\
    \ delay due to polling would be largely imperceptible.\n\n**Interrupt** This type\
    \ of communication is best when there is time of essence. Interrupts allow the\
    \ CPU to handle the I/O event as soon as it occurs, since the event is generated\
    \ as soon as possible. The obvious downside is the overhead of the interrupt handler,\
    \ though this sort of delay is largely unavoidable.\n\n# Transferring Data to/Devices\n\
    \nInterfaces to devices are implemented with a series of registers that are used\
    \ for different actions. Typically, there are three types: status registers, command\
    \ registers, and data registers. These simply appear as memory locations to the\
    \ CPU, writing to a register (a memory store) would trigger a device action. There\
    \ are two means of transferring the data and from the device: programmed I/O or\
    \ direct memory access. These essentially depend on whether the CPU accesses device\
    \ memory or main memory.\n\n**PIO** The programmed I/O, or PIO, is that it requires\
    \ additional hardware support: the CPU simply treats reads and writes to special\
    \ registers like any other memory load/store operations. Using their registers\
    \ often comes with a high performance cost, for example, sending a 1500-byte packet\
    \ on a NIC with a 8-byte register would require 199 load/store instructions!\n\
    \n**DMA** Allowing the device to access main memory directly is faster, albeit\
    \ more complex. Direct access, or DMA, requires hardware support in the form of\
    \ a \"DMA controller.\" In this model, rather than accessing the device's registers\
    \ directly, the data transfer is managed by the controller. By using main memory,\
    \ we avoid the overhead of fragmented transfers: the CPU tells the device where\
    \ to find the data in memory. With the network packet example, the transmission\
    \ request (which is still to the command register by the CPU) includes information\
