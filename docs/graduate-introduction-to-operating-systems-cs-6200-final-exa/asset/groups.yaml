    The motivation behind RPC is to remove boilerplate, hide cross-machine complexities,
    decouple the communication protocol from the application logic; it defines a high-level
    interface for data movement and communication.


    Interface Definition An interface definition language is an independent approach
    to defining the type of calls available on a server. It can be a language-agnostic
    definition file or specific to the implementation.


    Registry & Binding A registry is a database of services: it is used by clients
    to find servers that they are looking for. It can be distributed (as in, "give
    me all RPC servers that provide an add," or machine-specific for the latter),
    which need to know the server’s address in advance (and must provide some port
    number).


    Failures Because of the complexity of the system (cross-machine, network-dependent,
    etc.), there are plenty of situations where a call might fail. It’s sometimes
    impossible to determine the cause of such failures, and even a timeout/retry approach
    may never succeed. Because of this, an RPC implementation will define an error
    specification, defining all of the ways in which an RPC call can fail. Such a
    case results in an "error notification."


