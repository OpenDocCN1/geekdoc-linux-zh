    > What are some of the design options in implementing a distributed system? What
    are the tradeoffs associated with a stateful design? What are the tradeoffs with
    optimization techniques – such as caching, replication, and partitioning – in
    the implementation of a distributed service.


    One of the most important design decisions in a distributed service is regarding
    redundancy: what extent is state duplicated across machines? Does every (or every
    two, or...) machine store state? Most designs incorporate, have two approaches:
    a replicated system, and a partitioned system, in which each server stores part
    of the data.


    > LATENCY ANALOGY

    If the hard drive is travelling to Mars for a flash kend, communicating with a
    remote server (even considering what type of access they have to do!) is like
    going to Pluto in a modern space ship [1][2]

    In other words, optimizations are important.


    **Tracking State** We must distinguish the implications of a stateful versus stateless
    model. A stateless model requires requests to be self-contained; this is highly
    limiting but it frees us from supporting caching and consistency management. It
    also results in larger requests, but it does make server-side processing much
    simpler and cheaper. The greatest benefit is rewards towards: just restart. Stateless
    systems offer better performance at the cost of complexity in checking and recovery.


    **Caching** is an important optimization to minimize network latency. Clients
    maintain some file state and operate on it locally. This introduces the problem
    of consistency and coherence across clients, which is like the consistency problem
    with caches in multi-processors. We used write-invalidate and write-update techniques
    to enforce coherence; here, we have both client- and server-server approaches
    that are dependent on the specific file semantics of the DFS.


