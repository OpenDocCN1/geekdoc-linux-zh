    certain guarantees about the availability, validity, and “current-ness” of data
    to higher-level applications as long as the applications follow the rules. There
    are different consistency models that guarantee things with levels of confidence,
    but the most important part is that the applications need to follow the model
    for those guarantees to hold.


    The two main operations for managing consistency are push invalidations and pull
    modifications. The former is a pessimistic approach that assumes any changes will
    be visible elsewhere immediately; proactively pushes invalidations to other systems
    as soon as they occur. The latter is a lazier approach with a more optimistic
    outlook; as memory is needed, modification info is reacted from other nodes on
    demand.


