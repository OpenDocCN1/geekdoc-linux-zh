    I/O Scheduling: Because files are essentially scattered across a disk''s blocks,
    performance can improve if we schedule reads that the disk head moves across blocks
    in a more sequential order.


    **Prefetching**: When reading from a disk, it''s possible that the nearby blocks
    will also be useful! If we prefetch blocks in advance, we won''t need to read
    them again if they''re needed.


    **Journaling**: Instead of writing out to the proper disk location, which will
    require a lot of random access, we write updates in a log called the journal.
    The log contains a description of the write that''s supposed to take place, specifying
    the block, the offset, and the value, essentially describing an individual write.
    The journal is periodically flushed to disk and must be the most reliable part
    of the system in order not to lose data.


