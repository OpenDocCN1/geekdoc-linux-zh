- md: "\n# CS6200 FINAL EXAM\n\nGeorge Kudravtsev\n\nFall 2018\n\n> A Word of Warning\
    \ to Ye Who Enter\nI'm just a former student. I think most of the content in this\
    \ guide is reasonably correct, but please don't treat these review answers as\
    \ gospel. And, if you ask me about it, I probably won't even be able to answer\
    \ you because I've forgotten 80% of this stuff.\n(though I would appreciate corrections)\n\
    \n# Part 3 – Lesson 1: Scheduling\n\nLecture video: https://classroom.udacity.com/courses/ud923/lessons/339758762/concepts/last-view\n\
    Transcript: https://docs.google.com/document/d/1CR-2lcEdH4NG5xRIdHsqBxQQQ9T4OQIxXG-ZRJWKQ\n\
    \n# METRIC MANIA\n\nWarning: I'm pretty sure this boxed everyone that read it\
    \ in with me. The purpose of the formula \"derivations\" was to try to get a better\
    \ understanding of each metric by generalizing it. You won't need the formulas,\
    \ but you should definitely understand what each of the metrics entails!\n\nWhen\
    \ scheduling, there are a number of important metrics to keep in mind to effectively\
    \ compare algorithms. For all of them, we define $T_i$ as the completion time\
    \ of task $i$, where the values are ascending values based on their queuing order\
    \ (not execution order, as defined by the scheduler). This value is either prior\
    \ to execution (in an ideal world) or estimated based on heuristics (in the real\
    \ world). We also define $n$ as the number of tasks used for the metric.\n\nThe\
    \ first three metrics assume that all tasks are submitted at the same time. Such\
    \ a simplistic scenario is unlikely to appear on the exam, and so is likely to\
    \ understand how these formulas were derived rather than simply memorize them.\
    \ Understanding their derivation will synthesize the information better for a\
    \ final-worthy question that may involve more complex scenarios priorities, preemption,\
    \ and varied arrival times. Such scenarios are hard to generalize, and this is\
    \ much better done by hand.\n\n- Throughput ($\\tau$) – We define this as the\
    \ number of tasks that can be completed during a period of time. To keep things\
    \ simple, the 'selected period of time' should be the total time to execute all\
    \ of the tasks in the given scenario.\n\n```\n$\\tau = \\frac{n}{\\sum_{i=1}^n\
    \ T_i}$\n```\n\n# Graduate Introduction to Operating Systems\n\n# Review Guide\
    \ – FINAL\n\n- **Avg. Job Completion Time ($c_{avg}$)** - This is defined as the\
    \ average time it takes for a task to go from 'queued' to 'completed.'\n\nFor\
    \ a FCFS policy,\n\n```\n$c_{avg} = \\frac{nT_i + (n-1)T_{i+1} + \\dots + T_n}{n}\
    \ \\sum_{i=1}^{n} (n-i)T_i$\n```\n\nFor a SJF policy, we define $C_j$ as the *sorted\
    \ order* of the tasks based on their expected completion time (ascending). $C_1$\
    \ is the shortest, and so on. Then, the formula is identical to FCFS except with\
    \ $C_j$ replacing $T_i$.\n\n- **Avg. Job Wait Time ($w_{avg}$)** - This is defined\
    \ as the average time it takes for a task to move from a 'queued' state to an\
    \ 'executing' state.\n\nFor a FCFS policy,\n\n```\n$w_{avg} = \\frac{(n-1)T_1\
    \ + (n-2)T_2 + \\dots + T_{n-1}}{n} \\sum_{i=1}^{n} (n-i)T_i$\n```\n\nFor a SJF\
    \ policy, the formula for $w_{avg}$ mirrors FCFS with $C_j$ instead of $T_i$.\n\
    \n- **CPU Utilization ($\\mu$)** - This is defined as the percentage of time that\
    \ the CPU is used to do \"useful work\" (i.e. not context switches). In general,\n\
    \n```\n$\\mu = \\frac{t_{useful}}{t_{useful} + t_{overhead}}$\n```\n\nThe timeslice\
    \ should be calculated over a consistent interval. It's useful to use an interval\
    \ that is related to the given timeslice to figure out how much overhead occurs.\n\
    \nHow does scheduling work? What are the basic steps and data structures involved\
    \ in scheduling a task on the CPU? I think of scheduling as the thing that happens\
    \ between tasks. As a kernel-level task, the scheduling algorithm executes periodically\
    \ and is triggered for many reasons, including:\n\n- **Idling** — when the CPU\
    \ becomes idle, the scheduler runs the next task to avoid waiting.\n- **New Tasks**\
    \ — when a new task arrives on the ready queue, the scheduler may determine what\
    \ to do with the task. If the scheduler requests priority, it may choose to interrupt\
    \ the current task.\n- **Timeslice Expiration** — to ensure fairness, tasks are\
    \ usually assigned a time limit in which they are allowed exclusive access to\
    \ the CPU. Once timeslice expires, the scheduler needs to determine who is allotted\
    \ the next timeslice.\n\nThe decisions made in each of the above scenarios depend\
    \ on scheduling policies; they require different implementations. In the abstract,\
    \ the data structure used for scheduling is the runqueue, and it's tightly coupled\
    \ to decision-making.\n\n# Graduate Introduction to Operating Systems\n\n Review\
    \ Guide – FINAL\n\nWhat are the overheads associated with scheduling? Do you understand\
    \ the tradeoffs associated with the frequency of preemption and scheduling (short\
    \ vs. long slices)? One of the overheads of scheduling is the context switch itself.\n\
    \n```\n$context switch < t_{overhead}$\n```\n\nSimilarly, it's only beneficial\
    \ to run the scheduler if it takes less time than the amount of time it would\
    \ take to finish the task. To discretize the overhead, the overhead of the algorithm\
    \ and the overhead of context switch are even possible to schedule when nothing\
    \ to do—Longer timeslices are better for CPU-bound tasks. By their nature, metrics\
    \ like wait time are irrelevant because the task's goal is to do useful work.\
    \ Shorter timeslices are better for I/O-bound tasks. I/O-heavy tasks implicitly\
    \ create their own schedule by yielding during I/O operations. Additionally, shorter\
    \ timeslices allow them opportunity to interact with incoming requests, which\
    \ are essential for “interactivity.” The sooner an I/O bound task can issue an\
    \ I/O request, the better less idle time for tasks who also want CPU time. Shorter\
    \ timeslices allow for better distribution of utilization – both devices can stay\
    \ highly used.\n\nCan you compute the metrics described at the top of this section\
    \ given a scenario (i.e. given a few threads with their compute and I/O phases)\
    \ and scheduling policy? Consider a scenario with the following workload:\n\n\
    - 3 tasks – $T_1$ is I/O-bound but needs 3ms of CPU time; $T_2$ and $T_3$ are\
    \ CPU-bound and need 4ms and 5ms of CPU time, respectively.\n- $T_1$ issues an\
    \ I/O request when there is nothing after 1ms of CPU time.\n- I/O requests take\
    \ 5ms to complete.\n- The scheduling algorithm runs in 0.2ms, and a context switch\
    \ costs 0.3ms.\n- The scheduling policy is robin with 2ms timeslices.\n- Tasks\
    \ arrive in the order 1, 2, 3.\n\nThe resulting timeslice graph looks like the\
    \ following:\n\n![](img/a24b7091bf587932fb9e28c753b6515_2_0.png)\n\nFigure 1:\
    \ The timeslice graph for tasks $T_1, T_2$, and $T_3$. Note the assumption that\
    \ the scheduler is still invoked if there are no tasks. This may not be true –\
    \ I'm planning on asking a question about this on Piazza/Slack.\n\n# Graduate\
    \ Introduction to Operating Systems\n\n# Guide – FINAL\n\nThroughput 3 tasks completed\
    \ in 14.7 seconds means $\\tau = 3/14.7 \\approx 0.204 tasks/s.\n\nAvg. Completion\
    \ The completion times are (8.5, 11, 14.7) for the tasks, in seconds. Thus, the\
    \ average completion time is:\n\n```\n$c_{avg} = \\frac{8.5+11+14.7}{3} = \\frac{34.2}{3}\
    \ = 11.4 s\n```\n\nAvg. Wait The wait times are (0, 1.5, 4) for the tasks, in\
    \ seconds. Thus, the average wait time is simply:\n\n```\n$w_{avg} = \\frac{1.5}{3}\
    \ = 1.833 s\n```\n\nCPU Utilization We first choose the interval, the entire running\
    \ time of the tasks. It will give us the most accurate utilization. Over the course\
    \ of 15 switches, we had 5 context switches and 6 algorithm invocations.\n\n```\n\
    $\\mu = \\frac{14.7-(5\\times(0.5+0.2))}{14.7} \\approx 0.816$\n```\n\nThus, we\
    \ had about 82% CPU utilization for these tasks. Not ideal, but the overhead is\
    \ an absurd amount of time... shrugs.\n\nDo you understand the motivation behind\
    \ the multi-level feedback queue? Specifically, why different queues have different\
    \ priorities and how moves between these queues? You can contrast this with the\
    \ O(1) scheduler? What do you understand were the problems with the O(1) scheduler\
    \ which led to the CFS?\n\nThe multi-level feedback queue (MLFQ), was designed\
    \ to dynamically balance a task's runtime based on the history of the task. Each\
    \ level of the MLFQ contains increasingly longer time values. If a task yields\
    \ during its entirety, it is considered to be more CPUbound. However, if it uses\
    \ the entire timeslice, it is moved to a lower level of the queue.\n\n| THEORY\
    \ IN ACTION |\n|---| \n| The scheduler uses a 6-level MLFQ, with some fancy rules\
    \ calculating the feedback that moves tasks between levels. |\n\nLinux (1) Scheduler\
    \ This scheduler takes time to perform both task switching and insertion. It borrows\
    \ from the MLFQ but has a different approach to incorporating feedback. The priority\
    \ of a task — ranging from 0 (high) to 139 (low), where priorities (0, 99) are\
    \ “real-time” and kernel-level — is proportional to its timeslice priority ↑ timeslice↓.\
    \ In other words, the more idle indicates more I/O operations, and the priority\
    \ is raised. Less idle time indicates more CPU usage, and priority is lowered\
    \ (by 5, in both cases). Please note the word “priority” in this paragraph means\
    \ the logical priority (as in, this is a “high priority task”), a high priority\
    \ task would have a low priority value, which can be confusing (especially on\
    \ the sample image).\n"
