    (the disk). Thus, the memory read results from a disk, placing the page back into
    physical memory and updating the page table.


    Not Allocated There are two forms of unallocated address accesses: intended and
    unintended.


    An intended unallocated page access would be like the process stack growing beyond
    a page boundary. The stack needs another page to keep growing. This kind of access
    would likely be interpreted as "valid" by the kernel, allowing it to create a
    new page table and associate the new page with physical memory, replacing some
    outdated page if necessary. This is known in literature as "allocation on first
    touch."


    An unallocated unwanted access would be like dereferencing an invalid pointer.
    This is another type of page fault that would result in a segmentation fault (SIGGV)
    from the user process.


    Not Allowed If a particular type of access is forbidden – such as a write to a
    read-only page (like the static, .data section of a program) the MMU will issue
    a page fault to the operating system. This type of protection is critical for
    certain exception prevention techniques such as W^X (write-xor-execute), which
    mark memory as either writable or executable, preventing things like buffer overflows
    that allow stack to execute code.


    Copy-on-Write COW. Since the clone will contain much of the same data as its parent,
    there is no need to copy it to a different location in physical memory. Otherwise,
    the two virtual address spaces refer to the same physical pages. That is, until
    the clone writes some new data to the page, and only then, do we copy the physical
    page to make sure the page''s memory is not modified (marking the page as write-protected
    for the clone). Other pages remain unoccupied, unless those containing the process''
    instructions. This is known as copy-on-write, or COW.


    > How do we handle the fact that processes address more memory than physically
    available? How does page replacement work?


    Because addresses are virtualized, we can address an arbitrary amount of memory.
    Any pages that don''t fit into physical memory can still be stored on disk and
    are "paged in" or "paged out" as needed. A page table exists (this is an important
    part of a context switch) and has entries to map all possible memory. For entries
    beyond physical memory is managed by the operating system: it tracks extra memory
    being stored on disk, and once. When a page''s not in physical memory is requested,
    the MMU will then look up where it stored the page on disk, placing it into physical
    memory and updating the page table. This process of swapping out pages to simulate
    a larger address space than physically available is known as demand paging.


    Decisions about which page to replace depend on the replacement policy. One policy
    is the recently used page (or LRU); this policy will evict the oldest unaccessed
    page in the page table (via the access bit) to make room for a new entry from
    disk. Replacements can also use the dirty bit: if a page hasn''t been modified,
    it doesn''t need to be written somewhere to be replaced.


