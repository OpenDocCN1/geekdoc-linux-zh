    | What is the motivation for RPC? What are the different design points to be sorted
    out in implementing an RPC runtime (e.g., binding, process semantics, interface
    specification...)? What are some of the options and associated tradeoffs? |

    | In the Sun RPC model, what is specifically to be done to address these design
    points? | |


    The motivation behind RPC is to remove boilerplate, hide cross-machine complexities,
    decouple the communication protocol from the application logic; it defines a high-level
    interface for data movement and communication.


    Interface Definition: An interface definition language is an independent approach
    to defining the type of calls available on a server. It can be a language-agnostic
    definition file or specific to the implementation.


    Registry & Binding: A registry is a database of services: it is used by clients
    to find servers that they are looking for. It can be distributed (as in, "give
    me all RPC servers that provide an add," or machine-specific for the latter),
    which need to know the server’s address in advance (and must provide some port
    number).


    Failures: Because of the complexity of the system (cross-machine, network-dependent,
    etc.), there are plenty of situations where a call might fail. It’s sometimes
    impossible to determine the cause of such failures, and even a timeout/retry approach
    may never succeed. Because of this, an RPC implementation will define an error
    specification, defining all of the ways in which an RPC call can fail. Such a
    case results in an "error notification."


    Sun RPC Design Choices

    Sun’s RPC implementation makes the following choices: a language-agnostic ID (called
    XDR) that uses rpcgen to convert .x files to language-specific implementations),
    a per-machine registry that specifies the service details (called portmap), and
    a retry-on-failure mechanism that makes a best-effort to include as many details
    as possible.


    > What''s (un)marshalling? How does an RPC serialize and deserialize complex variable
    size data structures? What''s specifically done in RPC/XDR?


    To translate a local representation of a structure into a machine-independent
    one that can be transmitted over a network, we use marshalling. This encodes a
    procedure call into a contiguous message buffer containing all its details (procedure
    name, arguments, etc.) and prepares it to be transmitted. Unmarshalling is, obviously,
    the inverse of this. This encoding process is automatically generated for a particular
    structure by the RPC toolchain from IDF specification.


