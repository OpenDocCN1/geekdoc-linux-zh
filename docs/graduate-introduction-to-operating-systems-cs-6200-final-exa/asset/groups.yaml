    # Graduate Introduction to Operating Systems


    # Review Guide – FINAL


    +   **Avg. Job Completion Time ($c_{avg}$)** - This is defined as the average
    time it takes for a task to go from ''queued'' to ''completed.''


    For a FCFS policy,


    ```

    $c_{avg} = \frac{nT_i + (n-1)T_{i+1} + \dots + T_n}{n} \sum_{i=1}^{n} (n-i)T_i$

    ```


    For a SJF policy, we define $C_j$ as the *sorted order* of the tasks based on
    their expected completion time (ascending). $C_1$ is the shortest, and so on.
    Then, the formula is identical to FCFS except with $C_j$ replacing $T_i$.


    +   **Avg. Job Wait Time ($w_{avg}$)** - This is defined as the average time it
    takes for a task to move from a ''queued'' state to an ''executing'' state.


    For a FCFS policy,


    ```

    $w_{avg} = \frac{(n-1)T_1 + (n-2)T_2 + \dots + T_{n-1}}{n} \sum_{i=1}^{n} (n-i)T_i$

    ```


    For a SJF policy, again define $C_j$ as outlined for $c_{avg}$ and the formula
    mirrors FCFS but with $C_j$ instead of $T_i$.


    +   **CPU Utilization ($\mu$)** - This is defined as the percentage of time that
    the CPU is used to do "useful work" (i.e. not context switches). In general,


    ```

    $$\mu = \frac{t_{useful}}{t_{useful} + t_{overhead}}$

    ```


    The times should be calculated over a consistent, recurring interval. It''s useful
    to use an interval that is related to the given timeslice, figure out how much
    overhead occurs during timeslice.


    > How does scheduling work? What are the basic steps and data structures involved
    in scheduling a thread on the CPU?


    I think of scheduling as "the thing that happens between the other things." Existing
    as a kernel-level task, the scheduling algorithm executes periodically and is
    triggered for many reasons, including:


    +   **Idling** — when the CPU becomes idle, the scheduler runs to the next task
    to execute, to avoid waiting resources.


    +   **New Tasks** — when a new task arrives on the ready queue, the scheduler
    may need to determine what to do with the task. If the scheduler requests task
    priority, for example, it may choose to interrupt the current task (known as preemption)
    and prioritize the new task.


    +   **Timeslice Expiration** — to ensure fairness, tasks are usually assigned
    a time limit in which they are allowed exclusive access to the CPU. Once the timeslice
    expires, the scheduler needs to determine who is allotted the next timeslice.


    The decisions made in each of the above scenarios depends on the scheduling policy;
    different policies enable different types of decisions and require different types
    of implementations. In the abstract, the data structure used for scheduling is
    known as the runqueue, and it''s tightly coupled to a policy to enable specific
    decision-making.'
