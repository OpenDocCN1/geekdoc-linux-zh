    # Graduate Introduction to Operating Systems


    # Review Guide – FINAL


    This can also be calculated by looking at the remaining bits. A 4KiB means 12
    bits are used for the page, leaving $24 - 12 = 12$ for the index, so $2^{12}$
    values.


    Do you understand the benefits of hierarchical page tables? For a given address
    format, can you workout the sizes of the page table structures in different layers?


    Page tables are a fixed size; they contain enough entries to map to the entire
    address space, regardless of whether or not there is enough physical memory. Recall,
    also, page tables are per-process data structure. A process will not use much
    of its available virtual address space; this means there are empty entries in
    the page. By splitting the table into multiple levels of page tables, we can reduce
    the size of these gaps and wasted PTEs.


    # THEORY IN ACTION


    This optimization becomes essential when dealing with larger address spaces. A
    64-bit architecture has too many address memory locations to store all of PTEs.
    Hence it becomes necessary to divide it into levels.


    Modern Intel systems have a five-level page table, capable of addressing 128PB
    (petal) of memory, given 4KiB pages. It allows us to (theoretically) have 57 address
    bits.


    # Sample Calculation


    Suppose we have a hierarchical page table for a 32-bit architecture with 3 levels:
    level 1 is 4 bits, level 2 is 2 bits, and level 3 is 6 bits. The first two levels
    indexes into the subsequent, deeper level, whereas the last level behaves like
    an index into a page table as before. This results in a virtual address chunking
    like:


    | $P_1$ | $P_2$ | $P_3$ | offset |

    |---|---|---|---|

    | 31 | 27 | 25 | 19 |


    Thus, $P_1$ indexes into the first table, which has $2^4 = 16$ entries. $P_2$
    indexes into the second table, which has $2^2 = 4$ entries. $P_3$ indexes into
    the third table and combines with the offset just like in a single-level table
    (see Figure 2), having $2^6=64$ entries.


    How does this impact the address space? A 20-bit offset means 1MB. Thus, a single
    inner-most page table can address 26 bits of memory (64MB). The second layer can
    address 28 bits of memory (256MB). In other words, a single entry in the third
    layer addresses 28 bits of memory. There are 16 such layers, and thus the schema
    can address the full 32 bits of memory.


    What''s the benefit over a single page table? Suppose a process needs 2MB of memory,
    and hence two page tables. With a single page table, there are $2^{12}=4096$ entries
    created immediately, with just two slots occupied. With the hierarchical page
    table, we create the top-level table (16 entries), a second-level table (4 entries),
    and the third-level table (64 entries), for a total of 84 entries. Even if the
    two pages are not in the same level, that''s still $84\cdot2=168$ entries. This
    is a huge savings in per-process memory requirements, especially with low memory
    usage.'
