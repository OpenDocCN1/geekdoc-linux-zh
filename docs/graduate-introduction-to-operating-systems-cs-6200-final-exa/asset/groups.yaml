    > What''s (un)marshalling? How does an RPC serialize and deserialize complex variable
    size data structures? What''s specifically done in RPC /XDR?


    To translate a local representation of a structure into a machine-independent
    one that can be transmitted over a network, we use marshalling. This encodes a
    procedure call into a contiguous message buffer containing all its details (procedure
    name, arguments, etc.) and prepares it to be transmitted. Unmarshalling is, obviously,
    the inverse of this. This encoding process is automatically generated for a particular
    structure by the RPC toolchain from IDF specification.


