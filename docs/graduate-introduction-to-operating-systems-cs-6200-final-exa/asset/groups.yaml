    你理解云计算的历史和动机吗？你了解一些云服务提供方案吗？


    云计算的益处源于其伸缩性（elasticity）。不需要管理基础设施。云计算在巨大的规模上运行。除了虚拟化的明显需求外，云还需要资源供给以公平地分配、跟踪和管理。此外，大数据对于存储至关重要。大规模监控需要实时解决方案来捕捉和分析。


    你理解规模如何变得实用吗？你理解规模如何变得不可避免吗？


    数量定律使得云服务可行。不同的客户（其中许多）有不同的使用模式和峰值时间。这些因素会导致稳定的模式。遗憾的是，这种规律导致了不可避免的故障。如果某个组件的故障率——例如硬盘——每月为
    0.01%（万分之一），一个足够大的数据中心可能拥有 10 万块硬盘。这意味着每个月会有 10 块硬盘故障！当然，那只是硬盘；一个特定的系统中有成百上千个个体组件。因此，个体故障发生的频率相当高。


