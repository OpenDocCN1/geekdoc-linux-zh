    Do you understand the history and motivation behind cloud computing? Do you understand
    some of cloud offerings?


    Cloud computing is beneficial due to its elasticity. There''s no need to manage
    infrastructure. The cloud operates on massive scale. Aside from the obvious need
    for virtualization, clouds also need resource provisioning to fairly allocate,
