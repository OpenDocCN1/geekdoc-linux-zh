    # Graduate Introduction to Operating Systems


    # Review Guide – FINAL


    Consistency models have a lot of small variations. The following is a quick enumeration
    of their guarantees without the lengthy examples and explications that follow
    in this section, for reference.


    # Strict


    All nodes see all updates immediately.


    # Sequential


    Updates from multiple nodes can arrive in any order but arrive in the same order
    to all nodes. Updates from the same node arrive in the order they occurred.


    # Causal


    Updates from multiple nodes can arrive in any order or at any node. Updates from
    the same node arrive in the order they occurred. When a write occurs after a read,
    the update of that before read and the new write must occur in that order.


    # Weak


    No guarantees about sync boundaries. On a sync, the node is guaranteed to see
    all updates that occur from other nodes up to their latest sync.


    It''s important to differentiate an update vs an operation. This distinction is
    discussed further in the sequential consistency section.


    > Though they''re not necessarily an omnipresent, omnipotent, and perfectly-good
    observer as the Christian view of God, we can guarantee that observer won''t lie
    to us about events occurring on the system.


    When sharing state, what are the tradeoffs associated with the sharing granularity?


    The choice of granularity is correlated to the layer in the software stack that
    the shared memory implementation resides. For example, sharing by the page is
    tightly-coupled with the operating system, the system also manages memory by the
    page. Other approaches, like per-object sharing, are application-or-specific.
    One thing to be careful of is granularity increases when two operations operate
    on different portions of the shared memory region. For example, given one KiB
    page, application instance A might need the first 100 bytes and instance B might
    need the last 100 bytes. Neither of these instances cares that the other is operating
