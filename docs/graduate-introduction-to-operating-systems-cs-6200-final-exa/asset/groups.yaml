    # Part 4 – Lesson 4: Datacenter Technologies


    Lecture video: https://classroom.udacity.com/courses/ud923/lessons/365329007/concepts/last-view

    Transcript: https://docs.google.com/document/d/1Fe9eQpEbIZmEPLN6S2GWmWLkvbHKSyW-TRQ


    > When managing large-scale distributed systems and services, what are the pros
    and cons with adopting a homogeneous environment, a heterogeneous environment?


    A functionally homogeneous approach to distributed systems means every system
    is equal: it executes every possible step for the processing of a request. This
    is much like the standard "boss-worker" model, in which workers are generic threads
    that perform all the steps in a certain task. Alternatively, a functionally heterogeneous
    approach isolates tasks to certain machines, or for request types. This is somewhat
    akin to the "pipeline" model, where individual steps of a task are isolated and
    can be scaled according to the time it takes to complete them.


    The tradeoffs between each are similar to the tradeoffs we discussed in Part I
    of this regard regarding boss-worker and pipeline models, with additional tradeoffs
    that are part of the "distributed" aspect of things. A heterogeneous model is:
    the front-end is more straightforward and behaves as a simple dispatcher. Scaling
    is simpler, as it requires adding more nodes to the system. Of course, the simplicity
    and generality comes at a performance cost, since specific things can''t be optimized.
    Caching is difficult, since a single front-end is aware of which node processed
    which task, and thus can''t make any inferences about existing workload. With
    a heterogeneous design, both the front-end and the overall management is is more
    complex, but now the dispatcher (and workers themselves) can make meaningful inferences
    about data locality and caching in their workers.


