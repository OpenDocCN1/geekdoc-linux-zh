    转录：https://docs.google.com/document/d1KfdAFTAyumB_ODQ-fikuY_wb0QBCkW105Sd\n\n\
    | 为了让进程共享内存，操作系统需要做什么？它们使用相同的虚拟地址访问相同的内存吗 |\n\n为了让进程共享内存，它们请求内核创建一个共享内存段。这是一个特殊的内存，两个进程将其唯一的虚拟地址映射到同一个内存位置：\n\
    \n![](img/a24b7091bf587932fbe28c753b615_0.png)\n\n这种关联需要在内核上进行昂贵的初始化：操作系统必须创建（并跟踪）虚拟地址映射并允许多个进程使用。此后，共享完全在用户空间发生。这是相对于其他\
    \ IPC 方法（如消息队列或套接字）的巨大优势，后者依赖内核传递每条消息。\n\n> 为了进程使用基于内存内存进行通信，仍然需要将数据从一个位置拷贝到另一个位置吗？与重映射相关的成本是什么？基于消息与基于共享内存通信的权衡是什么？\n\
    \n共享内存时，一个进程对内存的变化透明地反映在另一个进程中。共享内存可能会随时改变。因此，如果一个进程需要基于共享内存执行计算，它必须将其复制到本地内存。这可能涉及复制，但并非普遍如此。\n\
    \n# 操作系统导论 复习指南 – 最终\n\n| 为了让进程共享内存，操作系统需要做什么？它们使用相同的虚拟地址访问相同的内存吗 |\n\n为了让进程共享内存，它们请求内核创建一个共享内存段。这是一个特殊的内存，两个进程将其唯一的虚拟地址映射到同一个内存位置：\n\
    \n![](img/a24b7091bf587932fbe28c753b615_0.png)\n\n这种关联需要在内核上进行昂贵的初始化：操作系统必须创建（并跟踪）虚拟地址映射并允许多个进程使用。此后，共享完全在用户空间发生。这是相对于其他\
    \ IPC 方法（如消息队列或套接字）的巨大优势，后者依赖内核传递每条消息。\n\n# 操作系统导论 复习指南 – 最终\n\n| 你可以实现同步的不同方法\
