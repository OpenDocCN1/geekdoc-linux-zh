    转字稿：https://docs.google.com/document/d/1CR-2lcEdH4NG5xRIdHsqBxQQQ9T4OQIxXG-ZRJWKQ\n\
    \n# 指标狂热\n\n警告：我非常确定读过这个框内容的人和我一样有共鸣。公式“推导”的目的是试图通过泛化它来更好地理解每个指标。你不需要这些公式，但你绝对应该理解每个指标包含的内容！\n\
    \n在进行调度时，有许多重要的指标需要记住，以便有效地比较算法。对于所有这些指标，我们定义 $T_i$ 为任务 $i$ 的完成时间，其值是根据队列顺序排列的升数值（而不是调度器定义的执行顺序）。该值要么是在执行之前（在理想世界中），要么是基于启发式估计的（在现实世界中）。我们还定义\
    \ $n$ 为用于该指标的任务数量。\n\n前三个指标假设所有任务同时同时提交。这种简单的场景不太可能出现在考试中，因此，理解这些公式是如何推导出来的可能比简单地背下它们更好。理解它们的推导过程可以更好地综合信息，以应对期末水平的题目，这类题目可能涉及更复杂的场景，如优先级、抢占和不同的到达时间。此类场景很难泛化，通过手算完成效果会更好。\n\
    \n- 吞吐量 ($\\tau$) – 我们将其定义为在一段时间内可以完成的任务数。为了保持简单，“所选时间段” 应该是在给定场景下执行所有任务的总时间。\n\
    \n```\n$\\tau = \\frac{n}{\\sum_{i=1}^n T_i}$\n```\n\n# 操作系统研究生导\n\n# 复习指南 – 期末\n\
    \n- **平均作业完成时间 ($c_{avg}$)** - 这定义为任务从“队列中”到“已完成”所需的平均时间。\n\n对于 FCFS（先来先行）策略，\n\
    \n```\n$c_{avg} = \\frac{nT_i + (n-1)T_{i+1} + \\dots + T_n}{n} \\sum_{i=1}^{n}\
    \ (n-i)T_i$\n```\n\n对于 SJF（最短作业优先）策略，我们定义 $C_j$ 为根据预期完成时间（升序）排序的任务*排序顺序*。$C_1$\
    \ 是最短的，依此类推。那么，公式与 FCFS 相同，只是用 $C_j$ 替换了 $T_i$。\n\n- **平均作业等待时间 ($w_{avg}$)**\
    \ - 这定义为任务从“队列”状态移动到“执行”状态所需的平均时间。\n\n对于 FCFS 策略，\n\n```\n$w_{avg} = \\frac{(n-1)T_1\
    \ + (n-2)T_2 + \\dots + T_{n-1}}{n} \\sum_{i=1}^{n} (n-i)T_i$\n```\n\n对于 SJF 策略，$w_{avg}$\
    \ 的公式与 FCFS 镜像，用 $C_j$ 代替了 $T_i$。\n\n- **CPU 利用率 ($\\mu$)** - 这定义为 CPU 用于执行“有用工作”（即非上下文切换）的时间百分比。通常，\n\
    \n```\n$\\mu = \\frac{t_{useful}}{t_{useful} + t_{overhead}}$\n```\n\n时间片（timeslice）应该在一致的时间间隔内进行计算。使用与给定时间片相关的间隔来计算发生了多少开销，将是很有帮助的。\n\
    \n调度是如何运作的？在 CPU 上调度任务涉及哪些基本步骤和数据结构？我将调度理解为发生在任务之间的事情。作为一种内核级任务，调度算法周期性执行，并由许多原因触发，包括：\n\
    \n- **空闲 (Idling)** — 当 CPU 空闲时，调度器运行下一个任务以避免等待。\n- **新任务** — 当新任务到达就绪队列时，调度器可能决定如何处理该任务。如果调度器请求优先级，它可能会选择中断当前任务。\n\
    - **时间片过期** — 为了确保公平，任务通常会被分配一个时间限制，在此限制内它们被允许独占 CPU。一旦时间片过期，调度器需要决定分配下一个给谁。\n\
