    转录：https://docs.google.com/document/d1SavqGKc7qQYDFEy1vljqWCJ8uDf4AvZs4ZQD3y_gc\n\
    \n| 为了实现同步机制，在最底层你需要依赖硬件指令。有些例子有哪些？ |\n\n同步同步两个操作：对共享状态的读取，以及由（且仅一个！）进程对共享状态的写入。如果这些操作没有同时发生，可能会出现一个进程的写入与另一个进程的读取交叉的情况，导致多个进程认为自己拥有访问临界区的权限。原子的一些示例包括：\n\
