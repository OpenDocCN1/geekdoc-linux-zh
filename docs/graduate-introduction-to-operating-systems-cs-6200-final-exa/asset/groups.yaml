    \n现代 Intel 系统具有五级页表，在页为 4KiB 的情况下可以访问 128PB 的内存。这允许我们（理论上）拥有 57 位地址。\n\n# 示例计算\n\
    \n假设我们有一个用于 32 位架构的 3 级分级页表：第一级为 4 位，第二级为 2 位，第三级为 6 位。前两级索引到后续更深层，而最后一层像以前一样是页表的索引。这导致了虚拟地址分块如下：\n\
    \n| $P_1$ | $P_2$ | $P_3$ | offset |\n|---|---|---|---|\n| 31 | 27 | 25 | 19 |\n\
    \n因此，$P_1$ 索引到第一个表，它有 $2^4 = 16$ 个条目，$P_2$ 索引到第二个表，它有 $2^2 = 4$ 个条目，$P_3$ 索引到第三个表并与偏移量结合，就像单级表一样（见图2），有\
    \ $2^6=64$ 个条目。这对地址空间有什么影响？20 位偏移量意味着 1MB。因此，单个内层页表可以访问 26 位内存（64MB）。第二层可以访问 28\
    \ 位内存（256MB）。换句话说，第三层的单个条目可以访问 28 位内存。有 16 层这样的结构，因此该方案可以访问完整的 32 位内存。\n\n与单页表相比有什么好处？假设一个进程需要\
    \ 2MB 内存，因此有两个页表。使用单页表，会立即创建 $2^{12}=4096$ 个条目。使用分级页表，我们创建一个顶层表（16 条目）、二层表（4 条目）和第三层表（64\
    \ 条目），总共 84 条目。即使两个页不在同一级，仍然是 $84\\cdot2=168$ 条目。这在进程级内存需求上是巨大的节省。\n\n# 操作系统导论\
