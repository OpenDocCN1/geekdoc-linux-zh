    # Part 3 – Lesson 2: Memory Management


    Lecture video: https://classroom.udacity.com/courses/ud923/lessons/339975873/concepts/last-viewed

    Transcript: https://docs.google.com/document/d/lutXUw0Sa7IRqwexJR1nG9Fit60Eqc4aHX8iRuYZTA


    # INTEL PTE


    The following is a page table entry on the MMU in Intel processors.


    | 31 | 9 | | | | | | | 0 |

    |---|---|---|---|---|---|---|---||-|

    | PPN | G | PAT | D | PCD | PWT | U/S | R/W | P |


    The labels correspond to the following meanings:


    - **D** The dirty bit, indicating whether or not the page has been written to
    since it was loaded.

    - **A** The accessed bit, indicating whether or not the page has been accessed
    during some period of time, typically used in page replacement algorithms.

    - **PCD** Indicates whether or page caching is disabled.

    - **PWT** Toggles page-through.

    - **U/S** Indicates the privilege level of the page, either user-mode or system-mode.

    - **R/W** Controls the permissions on the page: 0 indicates it''s a read-only
    page, whereas 1 indicates both read and write permissions.

    - **P** The present bit, akin to a "valid" bit.


    How does the OS manage the memory allocated to the underlying physical memory?
    What happens when a process tries to access a page not in physical memory? What
    happens when a process tries to access a page that hasn''t been allocated to it?
    What happens when a process tries to modify a page''s protected? How does COW
    work?


    In order to create an isolation for processes, in which they have access to all
    (or more) the system''s physical memory, computers use page tables. Processes
    are assigned a virtual address space; this is associated with physical memory
    as it''s referenced. Page tables are the data structure that performs the association
    and translation between virtual and physical addresses (or nested levels of page
    tables, known as multi-level page tables). They require hardware support and are
    outside the scope of the kernel - modern architectures have a memory management
    unit (MMU) responsible for these tasks.


    When the process accesses memory, the virtual address is translated to a physical
    location by the MMU. There are a variety of things that can occur as a result
    of an unsuccessful translation:


    - Not Present if the translation for requested address is present in the page
    table but does not translate to an existing physical address, that (the entire
    "page") has been moved elsewhere (like to the disk). Thus, the memory read results
    from a disk, placing the page back into physical memory and updating the page
    table.


    - Not Allocated There are two forms of unallocated address accesses: intended
    and unintended.


    An intended unallocated page access would be like the process stack growing beyond
    a page boundary. The stack needs another page to keep growing. This kind of access
    would likely be interpreted as "valid" by the kernel, allowing it to create a
    new page table and associate the new page with physical memory, replacing some
    outdated page if necessary. This is known in literature as "allocation on first
    touch."


    An unallocated unwanted access would be like dereferencing an invalid pointer.
    This is another type of page fault that would result in a segmentation fault (SIGGV).


    - Not Allowed If a particular type of access is forbidden – such as a write to
    a read-only page (like the .data section of a program) the MMU will issue a page
    fault to the operating system. This type of protection is critical for certain
    exception techniques such as W^X (write-xor-execute), which mark memory as either
    writable or executable, preventing things like buffer overflows.


    Copy-on-Write COW. Since the clone will contain much of the same data as its parent,
    there is no need to copy it to a different location. Otherwise, the two address
    spaces refer to the same physical pages. That is, until the clone writes some
    new data, and only then, do we copy the physical page marking the page write-protected
    for the clone.


    > How do we handle the fact that processes address more memory than physically
    available? How does page replacement work?


    Because addresses are virtualized, we can address an arbitrary amount of memory.
    Any pages that don''t fit into physical memory can still be stored on disk and
    are "paged in" or "paged out" as needed. A page table exists (this is an important
    part of a context switch) and has entries to map all possible memory. For entries
    beyond physical memory is managed by the operating system: it tracks extra memory
    being stored on disk, and once. When a page''s not in physical memory is requested,
    the MMU will then look up where it stored the page on disk, placing it into physical
    memory and updating the page table. This process of swapping out pages to simulate
    a larger address space is known as demand paging.


    Decisions about which page to replace depend on the replacement policy. One policy
    is the recently used page (or LRU); this policy will evict the oldest unaccessed
    page in the page table (via the access bit) to make room for a new entry from
    disk. Replacements can also use the dirty bit: if a page hasn''t been modified,
    it doesn''t need to be written somewhere to be replaced.


