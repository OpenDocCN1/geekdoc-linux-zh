    RPC 背后的动机是消除样板代码（boilerplate），隐藏跨机器的复杂性，并将通信协议与应用逻辑解耦；它为数据移动和通信定义了一个高层接口。


    接口定义（Interface Definition）：接口定义语言（IDL）是一种用于定义服务器上可用调用类型的独立方法方法。它可以是一个与语言无关的定义文件，也可以是针对特定实现的。


    注册表与绑定（Registry & Binding）：注册表是一个服务数据库：客户端用它来查找所需的服务器。它可以是分布式的（例如，“给我所有提供‘add’功能的
    RPC 服务器”），后者是针对特定机器的，后者需要提前知道服务器的地址（必须提供某些端口号）。


    失败（Failures）：由于系统的复杂性（跨机器、依赖网络等），存在许多调用可能失败的情况。有时无法确定此类失败的原因，即使是超时/重试方法也可能永远失败。正因如此，RPC
    实现将定义一个错误规范，定义 RPC 调用可能失败的所有方式。此类情况会导致“错误通知”。


    Sun RPC 设计选择

    Sun 的 RPC 实现了以下选择：一个与语言无关的 ID（称为 XDR，使用 `rpcgen` 将 `.x` 文件转换为特定语言的实现），一个指定服务细节的每机器注册表（称为
    `portmap`），以及一种失败时重试的机制，该机制尽可能包含尽可能多的细节。


