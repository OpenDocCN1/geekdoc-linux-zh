    ![](img/a24b7091bf587932fb9e28c7753b6515_7_0.png)


    Figure 2: A demonstration of translation from a virtual address to a physical
    memory location. Keep in mind that this diagram doesn''t include TLB lookups,
    use hierarchical tables, or handle what happens on a missed entry.


    Explain further, a single virtual address is discretized into one or more page
    numbers (VPNs) that are used as the index in a page table. The resulting page
    table entry at index correlates the VPN to a physical page number (PPN); this
    is appended to the virtual address (called the offset) as is. The combined result
    is the physical memory location.


    TLB The translation lookaside buffer is a cache of recency-used page table entries.
    It allows translations to occur ever faster: since the page tables themselves
    must be stored in memory, they take time to access relative to on-chip, domain-specific
    cache.


    > Do you understand the relationships between the size of an address, the size
    of the address space, the size of a page, the size of the page table...


    Let''s consider a scenario of a 24-bit architecture with 1MiB of physical memory.
    This corresponds to the following page values:


    +   **Address Size** The address – both virtual and physical – simply follows
    the bus width by the architecture. Theoretically, we should be able to convert
    any sized of virtual address to a physical address, because it''s a hardware-provided
    interface, we must rely on how things works in practice.

    **Address Space** The address space is directly connected to the hardware bus
    width. Despite having 1MiB of physical memory, the address space still contains
    $2^{24}$ addresses. Anything beyond 1MiB will be marked as paged out; In other
    words, any description about the amount of physical memory available is a red
    herring when it comes to page table calculations.

    **Page Size** This is a system-specific, custom-configurable value. For the purposes
    of demonstration, we will assume they are $4^{12}$ ($4 \cdot 2^{10} = 2^{12}$).


    With all of this mind, let''s calculate the size of a single page table. Once
    again, we need to be able to address $2^{24}$ addresses, discretized into $2^{12}$-sized
    chunks. This means:


    ```

    $\frac{2^{24}}{2^{12}} = 2^{12} = 4096$ page table entries

    ```'
