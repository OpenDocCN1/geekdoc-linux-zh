- "# Linux 初学者指南：从零开始掌握 Linux 操作系统和命令行\n\n\n\n![](img/cover00134.jpeg)\n\n\n\n\n\n\
  \n\n\n\n\n\n\nLinux 是一种基于 `UNIX` 和 `POSIX` 编程语言的免费开源操作系统。它可以免费下载和使用。它是基于 `Intel\
  \ x86` 范式构建的。事实上，与其他操作系统相比，Linux 拥有最广泛的用户群。\n\n这就是为什么基于 Linux 的计算机或系统运行迅速，甚至经常与那些惊人的超级计算机相比。与其他操作系统不同，Linux\
  \ 可以被定制为任何形式的系统，而其他操作系统是为特定的计算机类型设计的。\n\n这归于开源软件的协作，能够支持不同的库和目录。\n\n下一步是学习更多编写和编辑\
  \ shell 脚本以及开发自动化脚本，这将帮助你充分利用 Linux。\n\nLinux 操作系统（OS）并没有被普通用户充分认知，尽管它是最常用的平台，适用于\
  \ Android 手机、智能手表、冰箱、洗衣机、视频游戏机和数字录像机（DVR）。\n\n当你想起 Linux 是如何诞生的以及它是如何持续增长的，令人叹为观止。Linux\
  \ 从一个个人——芬兰的林纳斯·托瓦尔斯（Linus Torvalds）的业爱好开始，演变成了一个功能可以与任何商业 Unix 操作系统媲美的完整操作系统。更棒的是，Linux\
  \ 连同它所有的源代码都是免费的。你只需要从互联网下载它，或者从许多 Linux CD 销售处以低廉的价格购买 CD 或 DVD 即可。\n\n“一分钱一分货”的谚并不适用于\
  \ Linux。尽管 Linux 是免费的，但它在性能、功能和可靠性方面绝非逊色。Linux 的设计和修改与其健壮性很大关系。来自世界各地的开发者共同添加新功能。用户每天更新增量版本并在多种设备配置中进行测试。Linux\
  \ 的修订版本比消费级应用经过了更广泛的 Beta 测试。\n\n自 1994 年 3 月 14 日 Linux 内核 `1.0` 以来，Linux 用户的数量呈指数级增长。许多\
  \ Linux 发行版使得操作系统、软件和安装工具的安装和使用变得更容易。某些 Linux 发行版通过商业销售获得补贴，而另一些仍然免费提供。\n\n与许多其他免费下载的软件程序不同，Linux\
  \ 带有丰富的在线文档，涵盖了在多台 PC 和外设上下载和配置操作系统等主题。少数硬核 Linux 用户已经熟练到仅凭在线文档就能有效地使用 Linux。然而，有很大比例的用户是为了特定目的（例如设置\
  \ Web 服务器或学习 Linux）而切换到 Linux 的。许多 Linux 用户仍然在家里使用他们的机器。但对于这些新用户来说，在线文档很难使用，因为它们经常不涵盖每个用户可能设想的\
  \ Linux 特有用途。\n\n如果你是 Linux 初学者，你需要一份循序渐进的指南，不仅能引导你完成安装和配置，还能解释如何针对特定任务使用 Linux。在决定\
  \ Linux 发行版之前，尝试尝试几个。\n\n本书的编写考虑了几乎没有或完全没有知识的普通人。它采用简单易懂的语言制定，这使得它对新手和专业人士都同样有用。\n\
  \n\nLinux 起于一个 PC 操作系统，但从以后扩展到了服务器、超级计算机、数据中心和其他设备。Linux 现在用于集成设备，如路由器、安全控制、电视、数码相机、游戏机和智能手表。基于\
  \ Linux 内核并运行在平板电脑和智能手机上的 Android 是 Linux 最大的胜利。感谢 Android，Linux 拥有任何特定操作系统中最大的用户群。Linux\
  \ 发行版是一组 Linux 包。\n\nLinux 发行版也是一种由以 Linux 框架或内核为中心的算法组成的操作系统，包括 Linux 内核以及支持模块和软件。你也可以通过安装适用于嵌入式系统、计算机等各种\
  \ Linux 发行版来获取基于 Linux 的操作系统。\n\n\n\n\n\n\n你计算机上的操作系统（OS）负责计算机的硬件和软件。通常会有多个计算机应用程序同时运行，它们都需要访问计算机的中央处理器（`CPU`）、存储和内存。这由操作系统（OS）进行协调，以确保每个软件都能获得其所需的资源。\n\
  \n计算机软件和系统开发从操作系统（OS）中受益匪。如果没有操作系统，每个应用程序都必须包含自己的用户界面以及管理计算机低级功能所需的大量代码，例如磁盘存储、网络连接等。鉴于可用硬件资源的范围广泛，这将增加任何应用程序的大小，并导致软件开发变得低效。\n\
  \n许多基础任务，如传输数据包或在典型的输出屏幕（如显示器）上显示文本，可以被委托给系统软件，系统软件充当硬件和软件之间的桥梁。系统软件允许应用程序以可预测且一致的方式与设备通信，而无需应用程序知道有关硬件的特定细节。\n\
  \n只要所有应用程序都以相同的方式访问相同的服务和资源，操作系统（OS）就可以处理几乎任何范围的应用程序。这减少了创建和调试程序所需的时间编程工作，同时确保用户可以通过标准且直观的界面监控、管理和维护系统硬件。\n\
  \n为了针对特定的硬件环境优化操作系统服务，操作系统（OS）使用了广泛的计算机驱动程序数据库。虽然任何软件都可以对存储媒体进行初始调用，但操作系统接收该调用并使用关联驱动程序将调用转换为该计算机硬件资源所需的指令。如今，操作系统（OS）作为一个稳健的接口，用于识别、配置和管理各种硬件，例如处理器、处理模块和内存管理。\n\
  \n\n操作系统（OS）有三个主要功能：通过命令行界面（`CLI`）或图形用户界面（`GUI`）提供用户界面（`UI`）；执行并调节应用程序的执行；向向应用程序通信系统资源（通常通过结构化的\
  \ `API`）。\n\n\n`UI` 代表用户界面。每个操作系统必须有一个图形用户界面（`GUI`），允许用户与操作系统通信，以设置、自定义和排除操作系统及其硬件的故障。`CLI`\
  \ 和 `GUI` 是两种两种主要的用户界面。\n\n`CLI` 也称为终端模式窗口，基于文本的系统界面，允许用户使用标准键盘输入与某些任务相关的命令、参数和参数。个人依赖于触摸屏、触控板和鼠标等输入设备提供的输入来导航基于图标和符号的\
  \ `GUI` 或桌面。\n\n主要感兴趣的是修改文件和程序的用户（例如通过双击图标在其主应用程序中打开文件）似乎是最高频的 `GUI` 用户。专业开发者和高级用户继续青睐\
  \ `CLI`，因为他们必须经常管理极其粗略且复杂的命令，例如开发和管理脚本以为员工建立新计算机。\n\n\n每个应用程序都由操作系统（OS）启动和管理。这通常有助于一系列行为，例如多个进程和线程的时间分片，以便不同的任务可以分用可用处理器的长时间。它有助于管理程序为获取处理器的严肃响应而产生的中断。这有助于确保有足够的容量运行程序，并且其数据在呈现时不会与其他操作和执行杂务发生冲突。\n\
  \n操作系统（OS）还可以提供 `APIs`，允许应用程序在不理解有限的操作系统或设备状态的情况下使用操作系统和硬件操作。例如，`Windows API` 可以帮助软件从鼠标和键盘获取输入，构建对话框和按键等\
  \ `GUI` 元素，向存储设备读写数据等。应用程序旨在运行的哪个操作系统通常是经过定制的。\n\n\n1. 在多用户环境中，多个程序将同时运行，操作系统决定哪些程序应该按什么顺序运行，以及每个程序在移动到下一个之前应该被多少时间。\n\
  2. 它管理与连接硬件设备（包括硬盘、打印机和拨号接口）的 `I/O`。\n3. 它向每个程序或系统操作员发送有关服务状态和任何可能出现的故障的通知。\n4.\
  \ 它可以处理批作业协调，以便辅助应用程序能够专注于其他任务。\n5. 在支持并行处理的系统中，操作系统可以处理如何拆分程序以便在多个处理器上同时运行。\n\n\
  所有主计算机系统都需要操作系统，有时操作系统必须设计具有多种属性以适应不同的形状。\n\n\n操作系统的作用是定义、自定义并将计算机设备连接到应用程序。操作系统可以配置设备驱动程序。它识别并检测硬件，允许操作系统和程序在无需预先了解设备或装置的情况下在系统上运行。\n\
  \n找到正确的设备并激活驱动程序是操作系统（OS）的责任，这样程序只需要对设备提出请求，而不需要使用该设备的唯一命令或代码。许多设备，如连接选项、通信端口、图形设备（如\
  \ `GPUs`）、主板芯片组，甚至存储设备，都处于类似的情况。\n\n操作系统（OS）识别并配置用于操作逻辑和物理设备，通常将其存储在类似 `Windows\
  \ Registry` 的逻辑结构中。为了确保适当系统效率和保护，设备制造商必须定期修补和升级驱动程序，操作系统也应该这样做。当更换计算机时，操作系统还会下载并修改新驱动程序。\n\
  \n\n尽管操作系统的基本功能相似，但许多操作系统适用于大量的平台和用户需求。\n\n\n这种操作系统可用于各种。通用操作系统是指一组旨在在各种硬件上运行广泛应用程序的操作系统，允许用户同时运行多个应用程序或任务。通用操作系统可以部署在各种笔记本电脑和桌面配置上，并运行各种应用程序，包括会计软件、目录、浏览器浏览器和游戏。为了确保程序能够高效共享广泛的硬件，通用操作系统通常侧重于线程和硬件管理。\n\
  \n以下是流行的桌面操作系统示例：\n\n1. 办公和家用计算机的非官方标准是微软的签名操作系统 `Windows`。这种基于 `GUI` 的操作系统首次于 1985\
  \ 发布，之后经常更新。\n2. 苹果 `Mac` 系列计算机和工作站的操作系统是 `Mac OS`。\n3. `Unix` 是一种专注于适应性和多功能的多用户操作系统。`Unix`\
  \ 是最早用用 `C` 编程语言开发的操作系统之一，开发于 20 世纪 70 年代。\n4. `Linux` 是作为 PC 用户的免费替代方案而创建的。`Linux`\
  \ 以高性能和可靠的操作系统而闻名。\n\n\n\n\n\n\n移动操作系统满足平板电脑和智能手机等移动通信设备的特定需求。与传统 PC 相比，移动设备的计算能力通常很小，因此操作系统在规模和复杂度上也必须缩小，以减少资源消耗，同时为计算机上运行的应用程序保留足够的资源。移动操作系统重视高级功能、用户访问性以及流媒体传输等数据处理功能。移动操作系统包括\
  \ Google 的 `Android` 和苹果的 `IOS`。\n\n\n并非所有计算机都是多功能的。需要操作系统的设备可以用于各种便携设备，如虚拟家庭助手、ATM\
  \ 机机、飞机系统和物联网（`IoT`）系统。主要的区别在于，相应的计算设备只负责一件事，因此操作系统经过了规模缩小，并侧重于效率和韧性。为了在所有情况下都能保持运行，操作系统应该运行快速、不发生故障，并优雅地管理所有错误。通常，操作系统存储在内置计算机本身的芯片组上。例如，嵌入式操作系统可以用于生命支持系统的医疗部分，并且必须持续运行以维持医疗机构的正常工作。\n\
  \n## 网络操作系统\n\n`NOS` 是一种定制的操作系统，旨在使局域网内设备之间的连接更加容易。网络操作系统（`NOS`）提供了理解网络协议以及构建、交换和拆解网络包所需的连接堆栈。由于其他类型的操作系统大多数都管理网络通信，专门的\
  \ `NOS` 在今天基本上已经过时了。\n## 实时操作系统\n\n实时操作系统在实时范围内运行。当计算机系统必须在一致且可重复的时间限制内与世界通信时，计算机制造商可能会使用实时操作系统。例如，先进的制造控制系统可以引导大型工厂或发电站的操作。此类设施可以从各种传感器和信号控制阀、电机以及各种其他设备产生信号。在这种情况下，工业管理系统必须对不断变化的现实情况做出快速、准确的反应。否则，可能会发生悲剧。在其他形式的操作系统中合理的缓冲、加载通信延迟和其他停顿，在\
  \ `RTOS` 中是不允许的。\n\n\n`Linux Kernel` 是一个开源 Unix 类操作系统的基础。Linus Torvalds 在 1991 年首次发布了它。它是一个开放且免费的操作系统，代码可以更新并传输给任何人用于公司或商业目的。\n\
  \n在某些方面，`Linux` 与你过去可能使用的其他几个操作系统（如 `Windows` 或 `Mac OS`）是相同的。`Linux` 在其他操作系统中也具有图形用户界面以及你所熟悉的软件，例如文本处理器、图片编辑器和视频编辑软件。在某些情况下，程序开发者可能为与你在其他平台上使用的完全相同的程序创建一个\
  \ `Linux` 版本。简而言之，任何可以使用 pc 或 笔记本电脑设备的人都可以使用 `Linux`。\n\n然而，`Linux` 在几个方面与其他系统不同。最重要的是，`Linux`\
  \ 是免费开源软件。`Linux` 的源代码是开源的，并且任何具备技能的人都可以免费下载、更新和贡献。\n`Linux` 的独特之处还在于，虽然 `Linux`\
  \ 的核心组件是广泛可用的，但有多个 `Linux` 发行版可供选择，每个发行版都有其自己的软件替代方案。这表明 `Linux` 是具有适应性的，因为可以替换的不仅是网络浏览器和文字处理器等程序。`Linux`\
  \ 用户还可以自定义关键组件，如平台的视觉化界面和其他元素。\n\n无论你是否意识到，你可能仍在使用 `Linux`。根据你所参考的消费者调查，运行 `Linux`\
  \ 的服务器创建了互联网上三分之一到二之三的所有网站。\n\n个人和公司倾向于将 `Linux` 用于数据库，因为它是稳定、可扩展的，并来自广泛用户社区的优优质服务。\n\
  \n你拥有的许多设备运行着 `Linux`，包括 `Android` 手机、`Chromebooks`、电子存储设备、便携式摄像机、可穿戴设备等。在你车辆的引擎内部，`Linux`\
  \ 正在运行。作为 `Linux` 操作系统框架的一部分，`Microsoft Windows` 也包含了 `Linux` 组件。\n\n不熟悉 `Linux`\
  \ 的用户经常会忽视它，错误地认为这是一个复杂且具有挑战性的操作系统。尽管如此，近年来 `Linux` 操作系统正变得比它们的 `Windows` 竞争对手更面向用户，因此尝试一下\
  \ `Linux` 是判断 `Linux` 是否适合你的最佳方法。\n\n\n1. `Linux` 最大的优势在于它是一个开源操作系统。这确保了源代码对所有人开放，并且你可以与任何人贡献、更改和共享代码。\n\
  2. `Linux` 比任何基于稳定性的操作系统都更稳定。这并不是说 `Linux` 是安全的。它确实有漏洞，但比其他任何操作系统都更容易受到攻击。不需要防病毒软件。\n\
  3. `Linux` 更新简单且定期。\n4. 有许多 `Linux` 发行版可根据你的需求或喜好进行选择。\n5. `Linux` 是一个可以从互联网下载的免费操作系统。\n\
  6. 它在社区中拥有大量的关注者。\n7. 它具有高水平的稳定性。它几乎不会停止或崩溃，短时间内后不需要重启。\n8. 它保护用户的隐私。\n9. `Linux`\
  \ 操作系统的效率高于其他操作系统。它让大部分个人能够执行所有任务并对其进行有效管理。\n10. 它适合在网络上使用。\n11. `Linux` 有很多多功能。你不需要安装整个\
  \ `Linux` 套件。你只需要安装所需的组件。\n12. `Linux` 可以读写各种格式的文件。\n13. 从网络安装快速又方便。它可以安装在任何硬件上，包括你的旧电脑。\n\
  14. 即使硬盘空间有限，它也能正确完成所有任务。\n\n\n`Linux` 操作系统是中小型企业的理想选择，现在经常被用于原本 `UNIX` 曾唯一选择的大型企业。`Linux`\
  \ 曾被认为是一个有趣的研究项目。在大多数以网络和多用户通信为主要关注点的大型组织中并未将 `Linux` 视为一种选择。然而，随着大型软件公司将其软件迁移到\
  \ `Linux` 以及该操作系统广泛分发的能力，它已成为 Web 托管和业务应用程序的可行选择。\n\n然而，在某些情况下，`UNIX` 是或曾是直接解决方案。如果一家公司使用超过\
  \ 8 个 CPU 的巨大对称多处理程序或结构，它必须运行 `UNIX`。`UNIX` 在高效管理所有操作方面比 `Linux` 强大得多。但自 2004 年以来，世界上使用\
  \ `Linux` 的超级计算机已超过了 `UNIX`。\n\n由于 `Linux` 是一个开源操作系统，它可以免费提供。任何人都可以从杂志、出版物或互联网获取\
  \ `Linux` 副本。组织通常为供应商支付服务合同费用，而不是服务器版本的软件费用。主要的服务器设备制造商是 `IBM`、`Hp` 和 `Dell`。\n\n\
  \n\n\nUNIX 的费用比 Linux 高。中端 UNIX 服务器的价格在 25,000 到 249,999 美元之间。HP、SUN 和 IBM 是主要的分销商。顶级的\
  \ UNIX 服务器费用超过 500,000 美元。根据 IDC 和 Gartner 的数据，IBM 是 UNIX 服务器领域的领先公司，HP 居第二，SUN\
  \ 居第七。\n\n商业级 UNIX 通常为每个系统量身定制，导致高昂的初始成本，而 Linux 则拥有模型化的软件包。Linux 的模式比单纯的企业级 UNIX\
  \ 操作系统更与 Windows 相似。购买 UNIX 服务器的用户会获得一个供应商支持包，其中包含了帮助设置和维护系统的服务。而 Linux 的供应商支持必须单独购买。\n\
  \n两种操作系统设备都容易受到病毒攻击，但 Linux 在处理病毒方面配备更为完备。UNIX 中存在的大多数功能和特性已在 Linux 中实现，包括多用户环境中的用户域分类、多任务环境中的任务分离、可以进行身份验证和/或远程访问机制等。由于\
  \ Linux 是一个开源操作系统，任何人都可以在用户论坛上修复漏洞，并在几天内完成补丁。然而，UNIX 并非如此，用户必须等待很长时间才能收到正确的漏洞补丁。由于它不需要通过企业级操作系统漫长的开发流程，开发者社区通常能更早交付更新。\n\
  \n与此同时，Linux 作为一个开源操作系统，由数以万计的开发者资助。明确来说，这比 UNIX 能够提供更具创造力且功能上市速度更快的能力。\n\n在过去的几年里，Linux\
  \ 的演进速度快于任何服务器操作系统。据估计，使用的 Linux 设备超过 2500 万台，而 UNIX 系统仅有 550 万个。\n\n由于在嵌入式技术中的应用以及免费易于获取，Linux\
  \ 正在快速增长。为了应对 Linux，HP、IBM 和 SUN 等公司正在开发具有图形用户界面且同样符合 Linux 标准的用户友好型定制 UNIX 系统。\n\
  ## 1. Linux 系统架构\n\n内核是操作系统的一部分，负责管理 CPU 资源、分配内存、传输数据、调度进程、执行应用程序并确保它们之间相互隔离。当计算机启动时，会加载第一个应用程序。内核最重要的代码段被挂载到安全内存区域，以防止它们被某些操作系统应用程序覆盖。\n\
  \nLinux 是一种可以在广泛硬件上实现的操作系统，用于构建软件、运行程序等。内核是 Linux 的核心。Linux 最初是用 `C` 语言编写并运行在 `i386`\
  \ 机器上的，但从以后已适配了比其他操作系统更多的设备。Linux 现在是全球最广泛使用的操作系统。\n\n`CLI`（命令行界面，也被称为 shell）用于管理\
  \ Linux。Linux 发行版提供一系列 Linux 应用程序，例如用于管理和操作硬件的应用软件、共享库、程序和系统任务（这些任务同时运行并引用网络请求），除了管理软件和硬件进程的内核外。对于\
  \ Linux 而言，有超过 70,000 个程序供选择，以及多种编程语言。包含应用程序及其信息的软件包用于安装应用程序。\n\n有必要理解，所有的操作系统都在内核空间运行其二进制文件，以避免内核挂起和中断系统。每当用户访问程序或方法时，它都会在用户空间中运行。这种区分至关重要。应用程序可能源于多个地方，可能不完善，或可能来自未知来源。这些程序无法篡改内核基础设施并触发系统故障，因为它们运行在内核空间之外。\n\
  \n若要连接系统内存资源或网络设备，所有程序（包括执行基本操作系统任务的系统守护进程任务）必须向内核发出系统请求。每个专业的多操作系统环境都创建了用户空间与内核空间的配置，以保持其安全、快速和可靠。\n\
  \n简而言之，内核空间与用户的分离使得 Linux 成为可能的最稳定、最安全的操作系统。\n\n![C:\\Users\\Hamza\\Desktop\\overview1.gif](img/image00121.jpeg)\n\
  \n进程调度器是最重要的子系统。所有其他组件都依赖于它，因为它们都需要暂停和重启进程。通常，一个子系统会暂停程序以等待设备操作完成，并在进程完成后重启该进程。当一个进程尝试通过整个网络传递消息时，网络接口可以在设备成功发送请求之前暂停该进程。因此，网络接口在接收请求（或设备返回失败）后，会通过一个显示操作结果的返回码来恢复程序。对于类似的目的，进程调度器、虚拟数据库服务器和进程间协作都依赖于进程调度器。\n\
  \n以下是一些不那么显而但至关重要的依赖关系：\n\n1. 当操作恢复时，进程调度器接口使用内存管理器来更新该进程的硬件数据映射。\n2. 进程间处理子系统需要内存管理器来实现共享内存网络通信。这种方法允许两个进程使用共享内存区域及其内存。\n\
  3. 虚拟文件系统使用网络接口来辅助网络文件系统（`NFS`），内存控制器用于提供内存磁盘单元。\n4. 内存管理器使用数字文件系统来促进切换。这是内存管理器主要依赖于进程调度器的唯一因素。每当进程尝试访问被交换出的信息时，内存管理器会向系统文件发送请求以从持久存储中检索内存，此时进程会被停止。\n\
  5. 与显式限制相比，内核中的所有模块都依赖于某些在任一子系统中不可见的公共基础设施。两个内核组件都使用这些协议为内核分配和释放资源，使用打印警报或错误的程序以及系统监控程序。这些工具将不会直接列出，因为它们被认为是可以访问的。\n\
  6. 在此阶段，架构设计反映了 Garlan 和 Shaw 的数据抽象风格。所示的每个子系统都包含可以通过过程框架访问的状态信息，且每个子系统最终控制其管理的资源。\n\
  Linux 内核的技术框架是成功的。这种性能的关键因素是开发者组织的安排和系统的可配置性。为了维护大量的个体志愿者程序员，需要 Linux 内核框架。\n\n\n\
  \n\n包含更多兼容的硬件平台是 Linux 内核的另一项重大增强。系统的架构通过将所有设备代码拆分为每个模块中的独立模块，鼓励了扩展性。通过仅重新设计内核的设备部分，少数开发者就可以将\
  \ Linux 内核移植到类似主要的硬件框架中。\n\n\nLinux 的目录配置类似于树形。Linux 系统文件结构的根是一切的起点。所有内容从根开始，但目录从根开始扩展。\n\
  \n在 Linux 中，使用正斜杠（`/`）来分隔目录。在讨论文件和目录路径时，“正斜杠”被称为“slash”。由于它的完整引用为 `/`，因此系统文件的起源通常被称为“slash”。当有人说“检查\
  \ slash（check-in slash）”或“目录在 slash 中”时，指的是根目录。\n\n可执行文件或二进制文件存在于 `/bin` 目录中。应用程序是用源代码开发的，源代码是个人可以解释的纯文本。之后，数据被处理成机器可读的二进制文件。计算机代码是\
  \ 0 和 1 的序列，因此被称为二进制文件。最需要记住的一点是，函数、应用程序和程序通常可以在 `/bin` 中找到。\n\n`/etc` 目录包含配置文件。配置文件调节着操作系统和应用程序的行为。例如，`/etc`\
  \ 中的某个文件可以指示操作系统进入图形模式或文本模式。\n\n![image2.png](img/image00122.jpeg)\n\n\n在操作系统内部，进程执行任务。软件是磁盘上交互式镜像中的机器语言数据和指令。进程是正在运行的软件程序。\n\
  \n它是一个复杂的对象，随着处理器执行机器码命令而不断演进。进程包含程序计数器（包括所有 CPU 日志）和进程帧（包括临时文件，如任务参数、返回链接、保存的量以及程序的数据和指令）。处理器中的当前操作包含在执行中的程序或方法中。Linux\
  \ 是一种支持多处理器的操作系统。进程是具有自身权利和义务的特定活动。当一个进程失败时，它不会影响系统中的其他进程。每个进程都有自己的虚拟内存，并且只能通过稳定的、内核管理的框架与其他进程进行通信。\n\
  \n进程在整个存在期间可能会消耗大量的系统资源。它会在设备的 CPU 上运行命令，并将自身及其数据存储在系统的内存空间中。它可以打开并使用文件服务器内部的文件，并显式或隐式使用进程中的电子组件。Linux\
  \ 可以记录进程及其可用的设备资源，以便平等地处理系统中的其他操作。如果一个进程限制了大量的内存空间或 CPU，对系统中的其他操作将是不公平的。\n\nCPU\
  \ 是系统中最有价值的资源，通常只有一个。Linux 是一种多任务操作系统，它在系统的任何时间点从每个 CPU 运行一个进程，以优化 CPU 的利用率。当操作多于\
  \ CPU 时，剩余进程应该等待处理器可用后才能运行。多处理是一个直观的过程。进程一直运行直到需要等待某些东西（通常是系统资源）。一旦获得了该资源，它就可以再次运行。CPU\
  \ 在单元处理框架（如 `DOS`）中可能会保持空闲，等待期将被浪费。多处理系统中，许多进程同时存储在内存中。当进程被强制等待时，操作系统会将 CPU 从该操作切换到另一个价值更高的进程。调度器决定哪个操作最适合立即运行，Linux\
  \ 采用了多种调度技术来确保一致性。\n\nLinux 支持各种二进制文件格式，包括 `ELF` 和 `Java`，这些必须被平等对待。\n\n除了标准进程外，Linux\
  \ 还支持实时进程。这些进程必须迅速响应外部因素，调度器对它们的处理方式与普通用户进程不同。尽管 `task struct` 系统架构多样化且复杂，但它的领域可以分为几个功能部门：\n\
  \n### 状态 (State)\n进程的状态随运行变化，取决于具体。以下是 Linux 进程的阶段：\n\n### 运行 (Running)\n程序已运行（它是系统当前的进程）或已准备好运行（正在等待分配给设备\
  \ CPU 之一）。\n\n### 等待 (Waiting)\n进程正在等待事件发生或资源可用。Linux 区分了时间限制和不可中断的等待进程。信号可以干扰可中断的工作进程，而不可中断的工作进程取决于硬件参数，且在任何情况下都无法被中断。\n\
  \n### 停止 (Stopped)\n该阶段已停止，通常是因为接收到了信号。重新实现的进程可能处于挂起。\n\n### 僵尸 (Zombie)\n这是由于某些原因，在进程向量中具有\
  \ `task struct` 数据模型的停止进程。它顾如其名：一个休眠的程序。\n\n### 调度数据 (Scheduling Data)\n这些数据由调度器获取，专门用于合理地确定系统中的哪个操作需要运行。\n\
  \n### 标识符 (Identifiers)\n系统中的每个进程都被分配了一个进程标识符。进程标识符只是一个数字，而不是进程向量的迭代器。每个进程通常都有用户和组标识符，用于限制对平台文件和设备的访问。\n\
  \n\nLinux 发行版将开源代码实现到一个单一平台，然后可以挂载并启动。Linux 发行版适用于个人电脑、非图形服务器、服务器群、手持设备以及家庭影院计算机和嵌入式系统等特殊应用。任何人可以通过构建或更改现有发行版来构建最新的\
  \ Linux 发行版。目前维护着 300 多种 Linux 发行版。\n\n## 2.1 什么是 Linux 发行版？\n\nLinux 发行版也称为 Linux\
  \ Distro，是由不同开源开发者和软件开发者创建组件组成的计算机操作系统。Linux 内核、GNU Shell 工具、桌面环境、X 服务器、安装程序、包管理系统和其他资源都包含在每个发行版中。许多元素是独立创建并以源码形式分发的。网络浏览器、生产力工具和其他应用程序（如\
  \ `KVM` 虚拟机）也包含大多数发行版中。\n\n发行版是一个完整的 Linux 系统工具包。Linux 发行版包含了 GNU 项目工具、Linux 内核以及各种增加系统能力的开源应用程序项目。\n\
  \n有各种 Linux 发行版可以满足几乎所有的计算需求。大多数 Linux 发行版针对特定用户社区定制的，例如企业客户、媒体爱好者、计算机程序员或普通终端用户。\n\
  \n\n\nLinux 发行版通常分为三大类：\n\n1. 专用发行版\n2. 核心发行版\n3. Live 测试版（活动版）\n\n后续章节将解释 Linux\
  \ 发行版的分类，并提供每个组的 Linux 发行版实例。\n\n\n核心发行版包含了 `GNU` 和 `Linux` 操作系统、一个或多个视觉化桌面界面，以及几乎任何可以随时安装和使用的\
  \ Linux 程序。无论你的需求如何，核心 Linux 发行版都能为全面的 Linux 配置提供一站式的便利。\n\n在 Linux 早期，发行版是以软盘形式发布的的。你必须手动导入各种类别的物品并将它们复制到磁盘中。一整个发行版通常需要\
  \ 20 张甚至更多软磁盘。这无疑是一次极其痛苦的经历。\n\n随着 `DVD` 或 `CD` 播放器在个人电脑上变得流行，Linux 发行版开始以 CD 组或单独\
  \ DVD 的形式提供。通常，你可以下载一个标准的 DVD 镜像文件（由于扩展名的原因也称为 `ISO` 文件），然后将该镜像挂载到 `DVD` 上。之后，安装\
  \ Linux 变得简单得多。\n\n![C:\\Users\\Hamza\\Desktop\\1a.png](img/image00123.jpeg)\n\n\
  Linux 发行版仍然以 `ISO` 镜像文件的形式发布。许多计算机不再配备 DVD 播放器，但工具允许你将其挂载到可启动的优盘上。新电脑可以从 USB 驱动器启动，而优盘在服务器和工作站上仍然存在。\n\
  \n对于 Linux 专家来说，有许多发行选择是完美的，但新手可能会面临挑战。在安装过程中，大多数内核会提问以决定默认加载哪些程序、哪些设备连接到计算机以及如何启用硬件。这些问题对于新手来说可能令人困惑。他们经常会在机器上加载过多的程序，或者加载太少，结果后来发现系统无法执行他们需要的任务。\n\
  \n\n随着时间的增长，出现了一个新的发行版子集，直接针对新的计算机用户。这些主要基于核心发行版，但仅包含适用于特定用例的少量软件。\n\n除了提供定制应用程序（如针对企业客户的办公软件）外，定制\
  \ Linux 发行版通常尝试通过自动检测和设置流行的硬件设备来帮助新的 Linux 用户。这使得下载和安装 Linux 变得更加方便。\n\n![C:\\Users\\\
  Hamza\\Desktop\\2a.png](img/image00124.jpeg)\n## Live 测试版\n\n可启动的 DVD Linux 发行版（也称为\
  \ `Lived`）在 Linux 领域非常受欢迎。如今大多数计算机允许你通过从 `Disc` 或 `Thumb` 盘访问操作系统，而不是从硬盘启动。这允许你无需安装即可体验\
  \ Linux 系统。\n\n许多 Linux 发行版构建了可启动的 `ISO` 镜像，你可以将其挂载到 `Disc` 或 `USB` 上以享受这一功能的优势。这些发行版仅包含\
  \ Linux 系统的一部分。由于空间限制，演示版无法包含完整的 Linux 系统，但它们能包含的功能之多会让你震惊！你可以从 `USB` 棒启动电脑，然后从网络下载剩余的包。\n\
  这是尝试不同 Linux 发行版的极佳方法，完全不需要接触你的电脑。插入 `DVD`，你就可以准备就绪。所有的 Linux 软件都可以从 `DVD` 或 `USB`\
  \ 驱动器运行。几乎每个发行版现在都有 Live 版本，只需从发行版下载一个并刻录到 `DVD` 即可尝试。\n\n有些 Live 发行版（如 `Ubuntu`）还允许你从\
  \ Live 设备运行 Linux 发行版。这允许你从光盘或 `USB` 驱动器启动，尝试该发行版，如果你喜欢，之后将其部署到电脑系统中。这是一个非常方便且用户友好的功能。\n\
  \nLinux Live 发行版和所有东西一样，也有缺点。由于所有内容都通过 `USB` 或 `Cd` / `DVD` 访问，程序运行速度较慢，特别是当你使用带有较慢光驱驱动器的旧电脑时。此外，你对系统进行的任何改进在重启后都会丢失。\n\
  \n\n最适合你的 Linux 发行版取决于你的使用场景和工具规范。对于不同的目的，有不同的 Linux 发行版。某些发行版是为了桌面使用设计的，而另一些是为了帮助后端\
  \ IT 框架设计的。\n\n如果你正在寻找一个新的 Linux 发行版，首先可以考虑的是你需要企业级 Linux 发行版还是社区级 Linux 发行版。\n\n\
  Linux 发行版有很多：社区和企业。社区版是一种广泛使用的 Linux 发行版，主要由开源网络支持和资助。企业级 Linux 发行版（也称为商业发行版）通过供应商成员身份提供，因此不再完全依赖于社区的支持。\n\
  \n社区版和企业版发行版的主要区别在于由谁决定对消费者什么重要。贡献者从广泛的开源选项中选择和管理包，决定了社区发行版的路线。发行商则根据消费者的需求决定企业级发行版的路线。\n\
  \n### 选择发行版时需要考虑的因素\n\n**通用软件** -（编程语言、办公应用、图形软件、游戏等）。许多发行版是极简的，软件很少。而某些发行版则完全相反。这很大程度上取决于你作为客户的需求。如果应用程序没有预捆装，你通常可以轻松地下载它。\n\
  \n**成本** – 是否要为发行版支付零费用、少量费用或巨额费用取决于你的需求和发行商的运营模式。许多商业发行版提供企业支持。它们为依赖 Linux 系统处理从基础需求到项目要求的任何公司提供电话热线和\
  \ 24 小时支持。但值得注意的是，尽管你支付了费用，这并不意味着它更好。\n\n\n**最新更新**– 许多发行版几个月或几年不更新。它们可能认为版本是“稳定的”，因此除非有重大安全补丁或准备升级否则不更新。某些发行版（通常是专用版）经常停止并关闭。\n\
  \n**支持** – 大多数流行的发行版在论坛或消息频道都有良好的社区协助。有些仍然提供免费的 Linux 程序和配置，但也可以签署服务合同。\n\n**易用性**\
  \ – 操作系统的易用性也是选择发行版时的一个因素。\n\n\n\n\n\n\nCanonical 是创建并支持 Ubuntu 的组织，同时也为该操作系统提供企业级支持。桌面版（Desktop）、服务器版（Server）和核心版（Core）是三大型号。其他“衍生版”（spins）包括\
  \ Edubuntu、Lubuntu、Kubuntu 等，它们是为了公共教育设计的。除了授权版本外，目前还有约 40 种第三方版本。\n\nUbuntu 每年发布两次。四月的更新包含两年一次的“长期支持”（Long\
  \ Term Support）更新。这些版本提供五年的免费帮助，涵盖错误修复和安全保护更新。普通的“过渡性”版本提供为期九个月的支持，但从一个版本升级到下一个版本非常简单。\n\
  \n如果你不喜欢 Ubuntu 的界面，Linux Mint 是基于 Ubuntu 构建的，专为初设计，并包含 `GNOME`、`Cinnamon` 和 `KDE`\
  \ 版本。在功能方面，Linux Mint 与 Ubuntu 大小相同。\n\n\n毫无疑问，Linux Mint 是最适合新手的基于 Ubuntu 的发行版之一。是的，它是基于\
  \ Ubuntu 构建的。你可以获得 Ubuntu 带来的优势。然而，它提供了多种工作区环境，包括 `MATE`、`Cinnamon` 和 `Xfce`，而不是\
  \ `GNOME` 平台。实际上，在其他几个领域，Linux Mint 优于 Ubuntu。\n\n这不仅关乎典型的用户体验（这对 Windows 操作系统来说是一个加项），它在技术规格有限的情况下提供了卓越的生产力，特别是在使用\
  \ `MATE` 或 `Xfce` 桌面环境时。\n\n它还利用了 Ubuntu 的应用程序仓库。你无需担心软件安装问题。\n\nMint 20 有三个桌面版本：`MATE`、`Cinnamon`\
  \ 和 `XFCE`。它以 Ubuntu 20.04 LTS 为中心。Mint 不再支持 32 位版本，仅提供 64 位版本。Linux Mint 20 基于\
  \ Linux 内核 `5.4`，包含了对 `NVIDIA` GPU、`AMD Navi 12` 和 `Intel` CPU 增强的兼容性。整个用户界面也经过了更新，拥有新的图标、新的样式和数字增强的任务栏。\n\
  \n新功能包括在局域网（LAN）中运行的文件共享软件 `Warpinator`，以及用于 HiDPI 显示器的分比例缩放功能，可以获得更清晰、更锐利的图像。其他应用程序包括\
  \ `Firefox`、`Timeshift`、`Audacious` 音乐播放器、`LibreOffice` 和 `Thunderbird`。\n\nLinux\
  \ Mint 是一个非常类 Windows 的操作系统发行版。因此，如果你不需要特定的用户体验，Linux Mint 是一个很好的选择。\n## 2.5 MX\
  \ Linux\n\n它正在创建一个由来自 `antiX` 和 `MEPIS` 社区的活跃用户组成的社区。目标是创建一个中间、方便的 Linux 发行版，结合这两个环境的最佳特性。\n\
  \n最新版本（`MX 17.1`）可以在 MX 网站下载 32 位或 64 位架构的版本。已经有一个更积极的消息：对于当前的发布 ISO 文件，可以下载定期更新。这些是全新的\
  \ ISO 镜像，已安装最新的改进，因此你无需在新安装后浪费时间进行升级。\n\n尽管没有使用流行的 `Mint (LMDE)` 或 `calamares` 安装程序，MX\
  \ Linux 仍然使用了自己的安装程序。\n\n平台是 `Xfce 4.12`，但它有一套设计合理且直接的设置。我们倾向于将面板放在屏幕左侧，这可以充分利用可用屏幕。面板没有设置为自动隐藏，而大多数人在屏幕较小的笔记本电脑上更喜欢这样做。没问题，右键点击窗口，进入\
  \ `Panel`（面板），然后 `Preferences`（偏好），从菜单中选择 `auto-hide`（自动隐藏）。\n\n\n在菜单收藏夹中，还有一个 `MX\
  \ Tools` 工具程序。这让我们想起了 `MEPIS`，这是一个实用且易于使用的工具程序，允许你控制广泛的系统设置。\n\n这里有几个你无法在其他平台上找到的独有特性。为了微调你的系统，`Tweak`\
  \ 和 `Conky config` 工具非常实用。\n\n还可以安装驱动程序（`Nvidia`）和编码器，对于那些不想与 `Synaptic` 命令行斗争的人，还有一个\
  \ MX 特有的开发工具包。\n\n\nSuSE 曾是一个独立的 Linux 发行版，后来被 Novell 收购。随后 Micro Focus 收购了它。从那以后它们被频繁买卖，现在的总价值约为\
  \ 25 亿美元。\n\n`SUSE Leap` 是一个里程碑式的发布，面向计算机用户以及企业设计与部署。OpenSUSE 倡议是一个进步且健壮的协作计划，提供两个主要的\
  \ SUSE 子公司：`SUSE Enterprise` 和 `SUSE Leap`。它适合开源程序员和数据管理员。\n\n另一方面，`SUSE Tumbleweed`\
  \ 是一个滚动更新版本，包含了最新的软件框架和 IDE。得益于办公程序、`GCC` 解释器和内核等最新组合包的出现，`TumbleWeed` 对于每个高级用户或计算机程序员来说变得容易得多。\n\
  \nOpenSUSE 依赖 `Yast` 软件包，程序员和软件操作员倾向于使用它来处理应用程序。\n\nSuSE 像 `RedHat` 一样，拥有完整的商业版本和生产版本。SuSE\
  \ 是一个面向企业的优秀全能者，并与 `SAP` 等公司有赞助和企业合作。Red Hat 和 SUSE 共享的不仅仅是系统。它最初基于 `Red Hat`，因此使用相同的基于\
  \ `RPM` 的包控制系统，但它已经进化到可以被视为具有其自由度的发行版。它的 `YAST` 管理信息系统使得服务设置变得简单。\nOpenSUSE 是 SuSE\
  \ 免费版的名称。OpenSUSE 有几个独有特性，即 `Tumbleweed`——一个前沿的应用程序软件系统。它包含了几个开发工具，例如为交互式软件开发设计的\
  \ `openQA`，以及生成用于在实际设备安装的 Linux 可视化的 `Kiwi`。默认情况下，OpenSUSE 使用 `KDE` 桌面。\n\n\nFedora\
  \ 长期以来被认为是领先的易用操作系统之一，这归功于它的易用性和预装应用程序，这些程序可以帮助学者快速上手。\n\n它是一个健壮且适应性强的操作系统，为台式电脑、笔记本电脑、服务器甚至\
  \ IoT 环境而设计。Fedora 基于 `Red Hat` 构建，在公司进入企业流程之前作为测试场。它通常用于开发和教育，对程序员和学习者非常有帮助。\n\n\
  \n\n\n顾如其名，稳定版（stable）稳如磐石，并带有最大的安全保护，但不包含最新的软件程序。然而，由于其可靠性和质量，它非常适用于 Web 服务器，也适合那些不担心提供最新软件程序的适度计算机用户。Debian\
  \ Stable 是大多数系统的默认系统。\n\nDebian Testing 是一个持续更新的版本，包含了尚未进一步集成到稳定发布版的最新软件。这是下一个 Debian\
  \ 稳定发布版本的开发阶段。它通常容易出现不稳定的情况，并且容易崩溃。此外，它不会及时收到安全更新。`Bullseye` 是最近的 Debian Testing\
  \ 版本。\n\nDebian 的不稳定版本（unstable）仍处于活跃开发中。这是一个创新的发行版，为那些在代码进入“Testing”级别之前积极贡献代码的程序员提供了一个理想的论坛。\n\
  \n数百万的人正在使用 Debian，因为它拥有庞大的软件包仓库和高可靠性，特别是在生产系统中。\n\n\nArch Linux 是一个独特、紧凑且便携的 Linux\
  \ 发行版，旨在为关注挂载和运行机制的资深用户或 Linux 专家设计。它允许用户根据自己的喜好自定义或配置系统。Arch 是为精通 Linux 工作原理的人设计的。\n\
  \n与大多数 Linux 发行版不同，Arch Linux 不是由 Debian 或 Red Hat 等父级发行版生成的。由于它构建在一个主要的（但稳定的）基础之上的，它保持了独立，并因其极快的\
  \ Linux 发行速度而受到技术人员的尊重。所有其他内容都通过 `Pacman` 软件包过程添加。\n\nArch 是持续发布版，这意味着它的所有内容都是更新的。你只需要刷新界面中的模块。标准的软件包管理器是\
  \ `Pacman`，它利用了 Arch 用户仓库（AUR），这是一个用于安装软件程序的平台。最近的更新是 2020.09.01。\n\n\n从 1993 年开始，Slackware\
  \ 可能是第一个准确的 Linux 发行版。它采用 `.tar.gz` 包而不是更熟悉的 `YUM` 或 `APT` 框架，这与 Arch 相同。如果你是一个不想编译任何内容的资深用户，Arch\
  \ 可能会适合你，因为它仍然允许与 Slackware 相同的自定义程度。\n\nSlackware 主要集中于“软着陆 Linux 发行版”（Soft-landing\
  \ Linux Distribution），已成为其他几个软件包的基础，最著名的是 SUSE Linux 发行版的第一个变体，它是最早的仍在维护的发布版本。\n\
  \nSlackware 致力于通过关注设计可靠性和便利性，成为一个更“类 Unix”的发行版。\n\n它尝试通过对从上层的应用程序包进行适当的更改，而不预测使用用例或排除消费者的决策。与大多数主流\
  \ Linux 发行版不同，Slackware 缺乏视觉化设置过程，也不会自动解决应用程序的依赖关系。对于设置和管理，它依赖文本文件和一些 shell 脚本。它启动后进入一个类似于无需进一步修改的命令行控制环境。由于其许多限制性和简单直接的特性，Slackware\
  \ 被认为最适合有经验的、专业导向的 Linux 用户。\n\n尽管 Slackware 是开源软件且免费的，但它缺乏结构化的错误跟踪系统或社区代码仓库，主要由\
  \ Volkerding 定期发布更新。开发者没有结构化的成员流程，Volkerding 似乎是发布的主要贡献者。\n\n\nGentoo 只是一个为专家设计的发行版，这些专家从一开始就能识别出他们正在处理的服务。开发者、框架工程师和网络工程师属于这一类。不建议\
  \ Linux 新手使用。Gentoo 旨在让那些寻求深入理解基于 Linux 的操作系统的优缺点的人。\n\nGentoo 带有 `portage`，这是在其他发行版（包括\
  \ Calculate Linux 和 `Sabayon`）中也使用的软件包控制系统，它以 Gentoo 为中心并与之兼容。它用 `Python` 编写，并基于端口集（port\
  \ collections）的原则构建。基于 BSD 的发行版（如 `NetBSD` 和 `OpenBSD`）包含了端口集，即更新和补丁的编译集合。\n\n\n\
  CentOS 平台是由 CentOS 组创建并开发的公共操作系统，旨在提供一个安全且稳定的开源环境。CentOS 专注于 `RHEL` 并提供免费下载和更新，是\
  \ Red Hat Linux 的极佳替代品。它为用户提供了 `RHEL` 的可靠性和准确性，同时也为他们提供了免费的安全功能改进。CentOS 8 是想要利用\
  \ `RHEL` 特性的 Linux 用户的热门选择。\n\nCentOS 8.2 是最新版本，也是 CentOS 8 的第三个版本。它使用 `BaseOS`\
  \ 和 `App stream` 仓库，并预装了最新的软件包，如 `Python 3.8`、`Maven 3.6`、`GCC 9.1` 等。\n\n\n今天大多数\
  \ PC 预装的是 Microsoft Windows 而不是 Linux。虽然这种方法让设备从通用公共包中取出后用起来很方便，但也意味着如果你使用 Linux，几乎总是必须自己手动挂载它。\n\
  \n在 Linux 早期，让 Linux 在 PC 上运行几乎需要计算机科学的学士学位。对我们来说有趣的是，图形化安装现在相对简单就能完成，对于用过 Microsoft\
  \ Windows 等图形化操作系统的用户来说很容易。本章涵盖了在你的计算机上安装和运行 Linux 发行版所需的所有知识。\n\n尽管各种 Linux 发行版使用多个安装命令，但它们都是非常出色的。虽然你可能在安装过程中看到的视觉效果与我们完全相同，但基本原理应该是类似的。如果你注意到某些新东西或我们没有提到的东西，请不要惊讶。安装程序仅仅是在根据你的计算机系统定制它所提供的内容。\n\
  \n\n虚拟机应用程序生成一个名为虚拟机的虚拟化生态系统，它作为一个独立的计算机系统运行，主要使用虚拟硬件系统。在你现有的操作系统上，虚拟机只是窗口中的一个进程在运行。你可以使用虚拟机启动操作系统安装盘，操作系统将会被欺骗，认为自己正运行在真实的设备上。\n\
  \n你机器上的默认系统软件称为主机（host），而位于虚拟机内部运行的操作系统称为客体（guest）。这让事情不会变得过于复杂。\n\n客体操作系统挂载在特定虚拟机的数字硬盘上。该文件由虚拟机程序向客体操作系统呈现为一个普通的硬盘。这确保了你不需要处理物理硬盘的分段或其他棘手的问题。\n\
  \n\n\n由于虚拟化引入了开销，请不要假设它们的运行速度像在实际设备上挂载接口那样快。虚拟机在运行挑战性性游戏或其他需要大量视觉效果和处理器速度的应用时并不理想，因此它们并不是在\
  \ `Mac OS X` 或 `Linux` 上运行 `Windows` 游戏的最佳方式，除非这些游戏较旧或对图形性能要求不高。\n\n公司引入服务器虚拟化是为了更好地利用物理服务器的计算资源，减少对服务器集群的依赖，并节省数据中心的资源。我们今天所熟知的\
  \ `VMs` 在过去的 15 年中变得流行。每个应用程序不再需要独立的服务器硬件，因为它们可以在具有各种 `OS` 规范的特定主机上运行。\n\n虚拟机可以分为两种：进程虚拟机，用于隔离单个功能；以及虚拟系统虚拟机，用于将应用程序或系统与计算机系统隔离。`NET\
  \ Framework`、`Java` 虚拟机和 `Parrot` 虚拟机都是进程虚拟机。\n\n`Hypervisors`（虚拟机程序）被`system VMs`\
  \ 用中间人，允许软件访问系统资源。`Intel/Linux Foundation (Xen)`、`VMware (ESX/ESXi)`、`Oracle (Oracle\
  \ VM Server for x86 and MV Server for SPARC )` 和 `Microsoft` 都是虚拟机程序领域（`Hyper-V`）的顶级参与者。\n\
  \n数字机器可以用于桌面电脑。一个在实际 `Mac` 硬件上使用虚拟 `Windows 10` 版本的 `Mac` 用户是最明显的例子。\n\n\n`Virtual\
  \ Machines` 有多种用途。以下列出了一些：\n\n- **尝试不同平台实验**：在虚拟机中安装不同的 `Linux` 发行版，允许你尝试它们并学习它们是如何运行的。在虚拟机\
  \ `Windows 10` 中运行 `macOS` 可以让你熟悉你可能想要全职使用的各种操作系统。\n- **整合服务器**：拥有多台服务器的企业可以将某些服务器虚拟化并在它们在单台设备上执行。由于每个\
  \ `VM` 都是一个自包含的隔间，它避免了在同一部 `OS` 上运行多个服务器带来的安全问题。虚拟机还可以从一台物理服务器迁移到另一台物理服务器。\n- **使用需要旧操作系统的程序**：如果用户的关键应用程序需要\
  \ `Windows XP`，用户可以在安装了 `XP` 的虚拟机中运行它。这使用户可以使用仅与 `Windows XP` 兼容的软件而无需安装它。这意义重大，因为\
  \ `Microsoft` 不再支持 `Windows XP` 了。\n- **在不同平台上测试应用程序**：你可以在 `VM` 中下载每个操作系统，以评估应用程序在多个平台上的性能。\n\
  - **使用为不同操作系统创建的软件**：`Linux` 和 `Mac os` 用户可以在 `VM` 中运行 `Windows`，以便在他们的桌面上运行 `Windows`\
  \ 应用程序而无需担心兼容性问题。遗憾的是，游戏是一个问题。虚拟机系统会增加开销，`VM` 中的 3D 游戏无法流畅运行。\n\n人们可以在特定设备上执行多个\
  \ `OS` 实现，因为程序与实际主机计算机隔离，从而提高了效率，降低了资金成本和物理空间。虚拟机的另一个优点是它们可以运行遗留应用程序，减少或消除了将旧程序迁移到新操作系统的需求和费用。\n\
  \n开发者使用虚拟机（`VMs`）在安全的虚拟化环境中测试应用程序。它还可以帮助隔离可能感染特定 `VM` 案例的勒索软件。由于 `VM` 内的恶意软件无法与主机系统交互，因此无法造成太大伤害。\n\
  \n虚拟机也有一些缺点。在单个物理主机上运行多个虚拟机可能会导致性能问题，特别是当符合特定应用程序的架构规范时。尽管与计算机系统相比，这使得它们的性能不那么强大。大多数的\
  \ IT 操作使用虚拟结构和物理结构的混合体。\n虚拟化软件是在虚拟机中运行数据库的关键。虚拟化软件有多种选择。`Linux` 领域最常见的有：\n\n1. `KVM`：它是一个与\
  \ `Linux` 内核直接集成的开源计划。它只能在具有虚拟化能力 CPU 的系统上运行。\n2. `VirtualBox`：由 `Oracle` 赞助的项目，安装在任何\
  \ `Linux` 发行版中，无论内核或 CPU 类型。\n3. `VMware Server`：这是由 `VMware` 提供的软件包，运行在 `Windows`、`Mac\
  \ OS X` 和 `Linux` 主机上，提供免费版和商业版。\n\n这些虚拟化软件包安装在 `Linux` 主机上，允许用户同时访问多个虚拟网络操作系统，如\
  \ `Linux` 和 `Windows`。\n\n在本章中，我们将向你展示如何设置和使用 `Oracle VirtualBox`，以及如何作为虚拟机运行 `Linux`\
  \ 工作空间。\n\n\n第一步是安装 `VirtualBox`。该包可能在发行版软件仓库中，取决于你的 `Linux` 发行版。`VirtualBox` 软件套装包含在\
  \ `Ubuntu` 和 `OpenSUSE` 的标准软件仓库中。\n\n使用 `Ubuntu Software` 程序或 `openSUSE Software\
  \ Center` 在你的设备上安装它。安装完成后，该软件包将出现在设备启动器中。\n\n如果你的 `Linux` 发行版不包含 `VirtualBox`，或者你只想确保你拥有最新的更新，你可以直接从\
  \ `VirtualBox` 网站获取并在那里安装。`VirtualBox` 网站有几个流行的 `Linux` 发行版的安装包（包括 `Ubuntu` 和 `OpenSUSE`）。在下载程序时，为你的\
  \ `Linux` 发行版选择正确的 `VirtualBox` 版本至关重要。\n\n从网站下载并安装 `VirtualBox` 工具包的过程是：\n\n1.\
  \ 在网络浏览器中访问 `http://www.virtualbox.org`。\n2. 尽管 `Oracle` 赞助 `VirtualBox` 项目，但它有自己带有下载文件、文档和社区论坛的网站。\n\
  3. 点击主网页左侧的 `Downloads` 选项卡。\n4. 确定 `Linux` 平台最新版本的 `VirtualBox` 版本。\n5. 这适用于你所选择的主机站点。其他操作系统（如\
  \ `Microsoft Windows`）也可以在 `VirtualBox` 程序内部运行。\n6. `VirtualBox` 适用于 `Microsoft\
  \ Windows` 和 Apple 的 Mac OS X`。如果你担心在现有的 `Windows` 或 `Mac` 系统上安装 `Linux`，可以使用 `VirtualBox`\
  \ 在现有系统上的虚拟机中运行 `Linux`。正如本章提到的，在你的 `Windows` 或 `Mac OS X` 环境中在 `VirtualBox` 内作为虚拟机运行\
  \ `Linux` 发行版，与在 `Linux` 主机环境中运行是一样的。\n\n\n\n\n1. `VirtualBox` 需要内核头文件来创建插入内核的模块。在安装\
  \ `VirtualBox` 之前，你可能需要先安装这些包。请查看你的 Linux 发行版文档，查找安装内核头文件的包。对于 openSUSE，它是 `kernel-default-devel`。\n\
  \n2. 当包管理器提示时，请输入管理员密码。\n\n3. 你的桌面菜单系统中可能会添加一个新的 `VirtualBox` 条目。在 KDE 菜单中，openSUSE\
  \ 将该菜单项放在 `Applications System`（应用程序系统）部分下。\n\n![Oracle VM VirtualBox 主窗口欢迎页截图，用于开始创建某些虚拟机。](img/image00125.jpeg)\n\
  \n4. 一旦你进入主窗口，就可以开始构建虚拟机了！\n\n\n安装任何 Linux 发行版都有几个步骤，我们将简要地带你了解这些步骤，而不涉及过多的细节。然后，你可以按照每个版本的详细说明来安装你想要的内容。\n\
  \n在安装任何 Linux 发行版之前，你将需要大量关于计算机硬件的知识。在开始安装 Debian 之前，请收集有关你的 PC 及其外围组件的信息。幸运的是，大多数\
  \ Linux 安装程序都能检测并操作大多数 PC 外围设备。尽管如此，了解你的 PC 硬件也是个好主意，这样在安装过程中出现任何问题时你可以进行故障。\n\n\
  \n第一步是刻录用于分发的介质。任何带有刻录 DVD 或 CD 功能的设备都可以胜。（DVD 刻录机必须刻录 DVD；但 DVD 刻录机可以刻录 CD 和 DVD。）如果你已经有一个带有\
  \ CD/DVD 刻录机的 Windows PC，通常可以使用该系统刻录 CD。\n\n确保你的计算机可以从包含介质的驱动器启动。虽然大多数新 PC 都可以直接从\
  \ DVD/CD 驱动器启动，但某些 PC 可能需要你的帮助。通常，PC 设置为优先从硬盘启动，更改启动设备顺序需要进入 `Setup`。\n\n要让 PC 从\
  \ DVD 驱动器启动，在电脑启动时进入 `Setup`。进入 `Setup` 并选择启动设备的具体步骤因 PC 而异，但通常包括按下某个键，例如 `F2`。电脑启动时会出现一条简短的消息，指示你按哪个键进入\
  \ `Setup`。在 `Setup` 中，你可以将 DVD 驱动器指定为启动系统。将 DVD 或 CD 插入 DVD 驱动器，并在设置从 DVD 驱动器启动后重启电脑。\n\
  \n第三步是从 Live CD 或 DVD 启动你的 PC 以尝试 Live CD 版本。否则，第三步是为 Linux 在 PC 硬盘上腾出空间。如果你使用的是\
  \ Microsoft Windows，取决于你是想用 Linux 替换 Windows 还是保留 Windows 和 Linux 发行版，这一步可能具有挑战性，也可以简单。\n\
  \n请注意，你当前的操作系统使用了整个硬盘来安装 Linux，而不删除（或干扰）Windows。你需要对硬盘进行分区（划分），以便 Windows 运行在一侧，Linux\
  \ 运行在另一侧。分区是一个令人生胆畏的操作，因为你面临擦除硬盘上任何内容的风险。在进行任何重大更改之前，请务必为你的数据创建备份。\n\n你可以使用分区工具在硬盘上构建\
  \ Linux 安装程序将使用的分区。如果你的计算机运行的是最新的 Windows 10 或更旧版本的 Windows，可以考虑购买商业级硬盘分区软件。但你可以使用一个名为\
  \ `QTParted` 的 GUI（图形用户界面）工具（它随 Knoppix 和许多其他发行版一起提供）来重新划分 PC 的硬盘分区。\n\n注意，某些 Linux\
  \ 发行版安装程序（如 openSUSE）将通过缩小 Windows 分区来自动构建 Linux 分区。在这种情况下，你不需要使用 `QTParted` 等方法缩小硬盘上的\
  \ Windows 分区。\n\n在硬盘上为 Linux 留好分区后，你就可以从所选发行版的 DVD 启动计算机并开始安装 Linux。安装过程中涉及若干措施，它们在不同版本之间有所不同。既然你已经走了这一步，现在应该是顺风水了。如果你只需通过安装屏幕，将在一两个小时内完成。大多数安装程序（如\
  \ openSUSE 界面）都有图形用户界面，引导你完成每个阶段。\n\n在安装过程中，再次划分硬盘是一个关键步骤，但这次你只需要使用你构建的额外分区即可。\n\
  \n在完成几个设置步骤（例如设置网络和时区并让安装程序完成剩余的安装工作）后，选择要安装的软件包。某些发行版通过消除软件选择阶段并安装默认软件包集合来简化这一过程。\n\
  \n完成安装后重启 PC。在自动配置运行之前，你需要重启。\n\n当你首次启动 Linux 时，可以完成一些额外的配置措施并安装额外的软件包。\n\n\n如果你担心\
  \ PC 无法运行 Linux，在开始安装 Linux 之前，请记住以下一些关键组件：\n\n- **DVD 驱动器**：你的计算机必须有一个 DVD 驱动器（DVD-ROM\
  \ 或 DVD 刻录机）并能够从它启动。使用何种模型没有关系。重要的是 DVD 驱动器连接到计算机的方式。大多数新 PC 上，DVD 驱动器连接到硬盘控制器（`IDE`\
  \ 或 `ATA`）。外部 DVD 驱动器可能会连接到 `USB` 端口。在 Linux 中，任何 `IDE/ATA` 或 `USB` DVD 驱动器都可以工作。\n\
  - **硬盘**：Linux 支持所有 `IDE` 光驱。`SCSI`（小型计算机系统接口）是 Linux 支持的另一种硬盘控制器。你需要大约 `5GB` 的硬盘空间来舒适安装和运行\
  \ Linux。查看 Linux 的 Live CD 版本不需要硬盘空间。\n- **键盘**：配合 Linux 和 `X Window System`，任何键盘都可以工作。\n\
  - **显示器**：显示器不是必不可少的，但它必须能够显示显卡的屏幕分辨率。像素（水平和垂直）决定了屏幕分辨率（例如 `1024 x 768`）。安装程序可以检测许多现代显示器。如果安装程序没有检测到你的显示器，你可以选择具有特定分辨率的通用显示器模型（例如\
  \ `1024 x 768`）。你也可以通过显示器的品牌和型号识别它，这些可以在显示器的背面找到。\n- **鼠标**：安装软件可以检测鼠标。配合 Linux\
  \ 和 `X Window System`，任何鼠标（`PS/2` 或 `USB`）都可以工作。\n- **网卡**：虽然网卡并不是所有 PC 的标准配置，但它们变得越来越常见。无论你的\
  \ PC 是否有 `Wi-Fi` 或有线网卡，安装程序都应该识别并使用它。如果你遇到问题，尝试找到网卡的品牌和型号，以便在网上查询 Linux 是否支持该卡。\n\
  - **处理器**：只要处理器速度超过 `700 MHz`（兆赫）或 `GHz`（吉赫），就没有关系。过去几年生产的大多数处理器速度远高于此。根据一般原则，越快越好。其他\
  \ Intel 兼容的处理器（如 `AMD` 和 `VIA` 处理器）也可以运行 Linux。\n- **内存 (RAM)**：RAM 指的是计算机可用的内存。内存越大，处理速度越快。要安装\
  \ Linux 和 `X Window System`，你至少需要 `512MB` 的 RAM。某些发行版有更高的最低内存要求，为了舒适地运行 GUI 桌面，你可能需要更多内存。\n\
  \n\n\n\n\n\n**SCSI 控制器**：`SCSI controllers` 将硬盘和其他外设连接到独立高性能 PC 和旧版工作站中。如果你的 PC\
  \ 拥有 `SCSI controller`，请了解更多关于该控制器的品牌和型号。\n\n**声卡**：如果你的 PC 拥有声卡且你想在 Linux 中使用它，请确保该显卡兼容。成功安装\
  \ Linux 后，你可以对声卡进行自定义。\n\n**显卡**：在文本模式下，Linux 支持任何显卡（也称为显示器适配器），但如果你想使用图形用户界面，你需要一个支持\
  \ `X Window System` 的显卡。安装程序可以检测支持的显卡并正确配置 `X Window System`。如果安装程序无法检测你的显卡，了解显卡的品牌和型号将有所帮助。\n\
  \n**打印机**：其品牌和型号必须标识你计划在 Linux 中使用的所有打印机。\n\n许多 Linux 发行版（如 `Debian GNU/Linux`）可以在任何支持\
  \ Linux 内核的硬件上运行。\n\n查看你的 PC 硬件是否与特定发行版兼容，请访问供应商网站查看他们的硬件兼容性列表。\n\n\nWindows 安装在标准\
  \ Windows PC 的单个大分区上，占据了整个硬盘。为了为 Linux 腾出空间，你需要缩小分区。安装软件在 Linux 安装期间会将空闲空间用于 Linux\
  \ 分区。\n\n尝试 Live CD 发行版（如 `Ubuntu`）时不需要重新划分硬盘。只需从 Live CD 启动电脑即可。你无需执行重新分区阶段，因为安装程序会在不破坏\
  \ Windows 分区的情况下缩小它。你必须重新划分硬盘，以便在上面安装 `Fedora`、`Debian` 或任何其他 Linux 发行版。你可以使用商业产品在\
  \ Windows 下调整磁盘分区的尺寸。你可以启动 Linux 发行版，然后使用 `GParted`（分区编辑器）调整 Windows 分区的大小。`GParted`\
  \ 可以调整用于所有最新 Windows 版本的 `NTFS`（用于文件系统）分区的大小。\n\n调整磁盘分区大小时仍然存在丢失硬盘上所有数据的风险。在使用磁盘分区工具调整分区之前，请对硬盘进行备份。在对分区进行任何操作之前，确保你能够从备份中恢复文件。\n\
  \n\n1. 从 `Ubuntu` 桌面，选择 `System Administration GParted`。\n2. `GParted` 窗口打开，该工具列出在你的电脑上发现的硬盘。第一个硬盘由设备名称\
  \ `/dev/sda` 标识；第二个由设备名称 `/dev/sdb` 标识，以此此类推。\n3. 从 `GParted` 窗口右侧的设备列表中，选择硬盘。\n\
  4. 从分区列表中选择你想要调整大小的分区。\n5. 通常，最大的分区是这个。`Windows 10`、`Windows 8` 以及其他最新版本的分区类型为 `NTFS`，如分区列表中的\
  \ `Type` 列所示。典型的新 PC 中可能存在两个分区：一个较小的 `fat16` 分区和一个较大的 `NTFS` 分区。\n6. 从下拉菜单中选择 `GParted\
  \ Resize/Move`。\n8. 修改分区大小，然后按 `Resize/Move`。\n9. 调整分区后，你可以选择一个留有至少 `4GB` 空闲空间的大小。对话框中的\
  \ `Free Space After` 字段显示空闲空间的大小。\n10. 当你指定了想要进行的调整后，点击 `Apply` 开始进程。\n11. 出现警界面时点击\
  \ `Apply`。\n12. 所有待处理的操作已完成，分区已更新，你现在移除 Windows 分区后就有了空闲空间。\n13. 为 Linux 释放空间后，你就可以安装你喜好的\
  \ Linux 发行版了。\n\n## 安装前尝试 Live CD\n\n在安装任何内容之前，先尝试 Live CD 或可启动 USB 版本。通常情况下，除了对\
  \ Linux 桌面有所感受外，你还可以进行一些额外的安装前工作。\n\n例如，要启动 `Ubuntu`，请从 Live CD 启动电脑。会出现一个菜单，允许你从几个选项中选择以控制启动阶段或检查你的设备是否符合硬件规格。你可以选择启动\
  \ `Ubuntu` 的默认选项（如果你在菜单 30 秒超时前未做出选择，将自动执行此操作）。\n\n几分钟后，`Ubuntu` 使用的 `GNOME GUI`\
  \ 桌面会出现，你可以探索 `Ubuntu`。当你打开 `Examples` 文件夹时，你将看到 `Ubuntu` 可以做的几件事。你也可以使用 `System\
  \ Administration GParted` 来更改硬盘的配置。\n\n完成 `Ubuntu` 操作后，选择 `System Quit`，删除 DVD，并在\
  \ `Ubuntu` 关闭后点击 `Enter`。如果你计划安装 `Ubuntu`，请点击桌面上的 `Install` 图标开始进程。\n\n\n可启动的 USB\
  \ 发行版已经存在了一段时间，但它们一直存在让我无法使用的缺陷。然而，较新的工具，例如 `Fedora Media Writer` (https://github.com/MartinBriza/MediaWriter)\
  \ 简化了开发流程，使得大多数用户可以在没有帮助的情况下完成操作。安装过程是非破坏性的，这意味着你可以保留 USB 盘上的现有文件，且数据持久化非常容易。\n\n\
  我们将向你展示如何制作一个可启动的闪存盘并在本文的后续章节中使用。\n\n\n虽然命令行方法可以制作可启动的闪盘，但最简单的方法是使用 Windows（我们意识到在\
  \ Windows 上制作 Linux 启动介质可能是异异的）。要制作可启动的闪盘，请遵循以下步骤：\n\n2. 安装后运行该软件。\n3. 在 `Target\
  \ Device` 部分中选择闪盘。\n4. 闪盘的名称可能是 `TravelDrive`。\n5. 选择镜像源（`ISO` 文件）。\n6. 如果你的网络连接较慢，可以使用单个\
  \ Live CD 下载 `ISO` 文件。如果你有更快的连接，使用 `Download` 选项访问 `ISO` 文件。\n7. 如果询问，设置持久化存储。\n\
  8. 分配给安装的可用空间被称为持久存储。我们建议至少 `300MB`。\n9. 点击 `Create Live USB` 按钮并等待进程完成。\n10. 预计等待十分。在大多数硬盘上创建两个目录：`syslinux`（小于\
  \ 7MB，负责启动）和 `LiveOS`（大小取决于你的存储设置）。\n11. 退出程序并测试新创建的驱动。\n\n\n我们尝试了多个闪盘，只要下载后有 `1GB`\
  \ 的空闲空间，对任何一个都没有出现过问题。较小的驱动（2GB 或更小）通常出厂格式化为 `FAT`，而较大的驱动格式化为 `FAT32`。据我们所知，格式化对安装或使用没有太大影响。\n\
  \n确保工作站设置允许从 USB 启动，这通常需要重新配置 BIOS。要这样做，请执行以下步骤：\n\n1. 重启电脑并按下进入 `BIOS` 设置的键。\n\
  2. 该键通常是 `F12` 或 `DEL`，但也可能是 `F1` 或 `F2`。\n3. 进入 `Boot Menu` 并选择 `Boot USB Devices\
  \ First`（或类似的选项）。\n\n\n\n\n\n1. 在某些计算机上，闪存驱动器可能隐藏在启动 BIOS 的硬盘部分。选择 `Boot Hard Drives`，将主硬盘改为存储介质，然后确保\
  \ `USB` 是 `Boot Device` 下的第一个选项。如果从 USB 启动的选项为 `Enable/Disable`，请选择“Enable”，进入启动设备顺序，并将\
  \ `USB` 选择移动到硬盘选择上方。\n\n工作站将在在此阶段重启，如果你的 `USB` 驱动器已插入，Fedora 应该会启动。\n\n如果单行条目 `Boot\
  \ Error` 且没有发生其他情况，请按照制造商的说明更新设备 BIOS。\n\n\n当机器启动时，Fedora 环境的加载速度比 Live CD 环境快得多。`USB`\
  \ 驱动器上生成的新文件是可见的，并且可以访问其他设备。“安装到硬盘”图标会保留在屏幕上，允许你需要时快速且永久地切换到 Fedora。\n\n虽然使用操作系统不需要连接互联网，但我们强烈建议这样做，因为大多数用户都希望下载额外的程序来进一步测试操作系统的功能。\n\
  \n恭喜你取得了成就！你现在可以开始使用 Linux 了。\n\n\n在访问你的虚拟世界之前，你必须完成一些额外的虚拟机设置。由于 `New Virtual Machine\
  \ Wizard` 创建的是一个通用世界，你可能想先对其进行自定义。本节将解释如何配置虚拟机以及如何安装你的操作系统。\n\n### 调整设置\n\nVirtualBox\
  \ 为你构建的每个虚拟机收集配置选项。VirtualBox 在虚拟机中模拟这些配置设置中定义的内容。\n\n选择左侧的虚拟机项目，并点击工具栏上的“Settings”图标以访问配置设置。出现\
  \ `Settings` 对话框。\n\n在 `Settings` 对话框的左侧，通过带有文本的图标显示了十个配置类别：\n\n![VirtualBox 设置对话框的截图，显示\
  \ 10 个设置类别，描述为左侧带有文本的图标。](img/image00126.jpeg)\n\n- **General**（通用）：`General Setting`\
  \ 定义虚拟机的名称和操作系统类型。你将在 `Advanced` 选项卡上启用剪板，以便在主机和客系统之间复制和粘贴文本、文件和目录。\n- **System**（系统）：控制虚拟机的\
  \ CPU 和内存分配。\n- **Display**（显示）：此组件管理虚拟机的视频内存和虚拟显示器。\n- **Storage**（存储）：控制对虚拟硬盘和\
  \ DVD 驱动器的访问。你构建的虚拟硬盘应该在这里提到，但如有必要你也可以添加更多。你也可以从这里让虚拟机访问主机的 DVD 驱动器。VirtualBox 的另一个酷功能是直接在客设备上安装\
  \ `ISO` 文件。你现在可以直接从 `ISO` 映像安装 Linux 发行版，而无需将其刻到 DVD。\n  如果你将从 DVD 安装虚拟机操作系统，请确保在\
  \ `DVD` 部分挂载 DVD 驱动器。遗憾的是，该选项设计上并不可用。\n- **Audio**（音频）：控制对主机系统声卡的访问。你可以为 Linux 主机选择\
  \ `ALSA` 驱动程序，以便虚拟服务器将声音传输到主机 Linux 音频系统。\n- **Network**（网络）：虚拟机将链接到主机网络，你可以在那里配置该功能。在虚拟机和主机设备之间，默认的\
  \ `NAT` 选项生成一个内部网络。这在虚拟机和网络其余部分之间建立了屏障，防止其他设备访问虚拟机。如果你正在测试操作系统并希望将其隔离在网络其余之外，这非常有用。如果你想让虚拟机完全访问你的局域网，请选择\
  \ `Bridged` 网络选项。虚拟服务器的网络接口随后可以链接到主机服务器上的网络。\n- **Serial Ports**（串口端口）：如果打开，则控制对主机系统串口通信端口的访问。\n\
  - **USB**：列出你想要在客系统使用的主机系统 `USB` 设备列表。\n- **Shared Folders**（共享文件夹）：此功能允许你构建一个从主机系统和虚拟机都可以访问的文件夹。这在两个环境之间创建了一个简单的文件传输通道。\n\
  - **User Interface**（用户界面）：选择你想为虚拟机电源启用的菜单栏功能。\n\n自定义完设置后，点击“OK”保存设置并返回 VirtualBox\
  \ 主窗口。你现在已准备好安装应用程序了！\n\n\n既然虚拟机已为你的新操作系统进行了自定义，你现在可以开始了。但是，在开始之前，请双击检查是否拥有安装所需的\
  \ DVD 或 `USB` 驱动器。获取后，你可以按照以下步骤进行安装：\n\n1. 将操作系统安装 DVD 插入主机的 CD/DVD 播放器，或使用虚拟机的\
  \ DVD 驱动器访问 `ISO` 映像文件。如果你的桌面默认打开了文件管理器程序，你可以在继续之前将其关闭。\n   光片安装在设备上并显示为桌面图标是正常的。\n\
  2. 从左侧列表中选择你想要在上面安装操作系统的虚拟机。\n3. 选择工具栏上的 `Start` 图标。这会开启虚拟机，就像你打开了硬件电源开关一样。出现 `VirtualBox`\
  \ 中的控制仿真窗口。此窗口包含了通常显示显示器上的所有内容。\n\n![VirtualBox 控制仿真窗口的截图，窗口底部显示一组图标，指示虚拟机正在访问系统上的硬件。](img/image00127.jpeg)\n\
  \n4. 当虚拟机访问设备上的硬件时，窗口底部的图标会指示这一点。图标有：\n   - 硬盘\n   - DVD 播放器\n   - 音频输入和输出\n   -\
  \ 网络链接\n   - USB 链接\n   - 文件夹交换\n   - 视频内存\n   - 正在录制\n\n在浏览器的右下角可以找到鼠标图标、钥匙图标和\
  \ `Right Ctrl` 字样。当你启动虚拟机时，`VirtualBox` 会接管主机系统的键盘和鼠标，并将其交给虚拟机。按下键盘右侧的 `Control`\
  \ (`Ctrl`) 键将控制权交回主机设备（例如，同时运行另一个程序）。将鼠标放在控制仿真窗口内的任何位置并按下 `right Ctrl` 键即可重新获得虚拟机的控制权。\n\
  5. 完成你正在使用的操作系统的安装。\n6. 使用 DVD 或 `ISO` 文件启动虚拟机（参考 `Settings` 对话框的 `General` 部分）。只需观察操作系统的常规安装程序。操作系统会检测你在虚拟机中安装的仿真硬件。\n\
  7. 安装完成后，重启虚拟机。\n\n大多数操作系统 (OS) 都内置重启功能。如果发生这种情况，`VirtualBox` 控制仿真窗口会检测到重启并保持打开，允许你观察重启过程。\n\
  \n![默认 Ubuntu 页面的截图，在打开的 openSUSE VirtualBox 窗口中运行着良好的操作系统。](img/image00128.jpeg)\n\
  \n结果是在你的虚拟机内部运行一个正常的操作系统。\n\n\n你的 Mac 拥有强大的性能、长续航能力和高耐用性。Mac 的硬件是不可比拟的，使其成为运行 Linux\
  \ 的强大机器。\n\n\n\n\n\nLinux 为那些无法获得 macOS 更新的旧 Mac 赋予了新生命。与其让你老旧的 MacBook Pro 变成一个没用的纸镇，不如升级到新版本的\
  \ Linux 并让系统运行多年。\n\n当你使用双启动系统时，Linux 和 macOS 都会在你的 Mac 上启用。当你的电脑启动时，按住 `option`\
  \ 键来选择要使用的操作系统。虚拟机和双启动系统之间的最本质区别在于，双启动允许你同时只使用一个操作系统，但它提供了更好的性能。\n\n如果你根本不打算使用 macOS，你可能想将其替换为\
  \ Linux。这样一来，机器文件就不会占用你的任何存储空间。\n\n然而，如果你改变了主意，恢复 macOS 将既复杂又耗时。由于 Linux 会覆盖 macOS\
  \ 恢复分区（Recovery partition），这一情况是事实的。如果你确定不想使用双启动选项而是选择虚拟机设置，请跳过分区阶段并直接进入安装过程。\n\n\
  1. 你需要一个至少有 2GB 存储空间的 U 盘来在你的 Mac 上运行 Linux。为了在 U 盘上挂载 `Ubuntu`，你必须先对其进行格式化。请确保你已经备份了任何重要数据。\n\
  2. 使用以太网适配器将 Mac 连接到互联网。这一点非常重要，因为没有第三方驱动程序，你的 Wi-Fi 在 `Ubuntu` 中无法工作。同样，如果蓝牙出现故障，iMac\
  \ 用户可以使用 USB 键盘或鼠标。\n3. 为了实现双启动，请尽量确保你的硬盘上有足够的可用空间。\n\n\n4. 通过前往 Apple 菜单 > 关于此本机\
  \ > 存储空间，验证你至少有 25GB 的可用空间。\n\n![image10.png](img/image00130.jpeg)\n\n5. 最后也是重要的一点，为你的\
  \ Mac 创建备份。通过在双启动分区中部署 Linux，你不应该丢失任何数据。如果发生任何故障，你需要清空你的 Mac 来恢复它。\n6. 与其构建双启动设置，不如使用\
  \ `Carbon Copy Cloner` 备份你的 macOS 恢复分区，以便用 Linux 替换 macOS。这会让切回 macOS 变得得多。\n\n\
  ### 从 USB 安装程序启动\n\n在按住 `option` 键的同时重启你的 Mac，并将 USB 闪盘直接插入电脑。一旦引导加载程序显示出来，使用方向键选择\
  \ `Boot EFI` 并按下“Enter”。\n\n在 `Ubuntu` 加载界面后，会显示 `Ubuntu` 桌面。\n\n利用这个机会在你的 Mac 上尝试\
  \ `Ubuntu`。记住，它可能会慢，因为它是从 USB 闪盘运行的。由于 `Ubuntu` 设计上无法使用 Mac 的 Wi-Fi，请使用以太网线连接互联网。\n\
  \n\n设置完成后，双击桌面上的“安装 Ubuntu”图标。\n\n要选择你的键盘布局和语言，请执行屏幕上的提示。选择“常规安装（Normal installation）”和“安装第三方软件”选项。安装此允许你使用\
  \ Wi-Fi 和蓝牙的应用需要通过以太网线将 Mac 连接到互联网。然后点击“继续（Continue）”按钮。\n\n如果提示，请保持分区挂载状态。\n\n\n\
  你 Mac 的默认启动管理器并不总是适用于 `Ubuntu`。这意味着你仍然必须部署一个第三方启动管理器，它允许你在电脑启动时轻松地在 macOS 和 Linux\
  \ 之间切换。\n\n下一步是安装 `rEFInd`。你必须短暂禁用系统完整性保护（System Integrity Protection）以启用 `rEFInd`。之后再次启用它，因为这是\
  \ macOS 的一项基本安全功能。\n\n要设置 `rEFInd` 启动管理器，请遵循以下步骤：\n\n1. 在应用程序的实用工具文件夹中启动禁用 `SIP`\
  \ 的 `Terminal`（终端）。\n2. 在另一个窗口中，打开 `Finder` 并切换到 `rEFInd` 链接。\n3. 将 `rEFInd-install`\
  \ 包拖入你的 `Terminal` 窗口后按 Enter。\n4. 提示时输入你的用户账户，然后再次按 Enter。\n5. 记住在安装完成后重新启用 `SIP`。\n\
  6. 将 `rEFInd-install` 文件拖入 `Terminal` 窗口并输入代码。\n7. 在你重启 Mac 的下一一刻，`rEFInd` 选择应该会自动出现。如果没有出现，请在启动时按住\
  \ `Option` 键以启动你的启动管理器。\n\n\n你需要连接到机器并告诉它你想让它做什么。在 Linux 中与机器通信的一种方式是通过名为 shell（终端）的程序。shell\
  \ 不是图形界面。它是完成你任务的一系列命令和语法。\n\n按照图形桌面的标准，shell 环境显得非常平淡和无聊。当你第一次启动 shell 时，你会看到一个简单的提示符，例如\
  \ `$`，后面跟着一个闪烁的光标等待你输入内容。\n\n## 4.1 什么是 Shell？\n\n命令行 shell（command shell）也称为命令解释器，是一个向操作系统和应用程序发送命令并接收其回响的程序。在功能上，它类似于\
  \ MS-DOS 中的 `command.com` 或 Windows 中的 `cmd.exe`，但 Linux shell 的功能强大得多。脚本（Scripts）是用命令行\
  \ shell 语言编写的小型程序，用于对文件及其数据执行顺序顺序操作。\n\n如果不理解如何使用命令行，很难成为一名成功的 Linux 专业人士。\n\n命令行（The\
  \ command line）是一个 shell 提示符，显示设备是否准备好接受用户命令。这被称为用户-系统对话。用户对输入的每条命令都会收到来自系统的响应：\n\
  \n1. 一个新的提示符，表示命令已执行，你将进行下一步。\n2. 错误消息是系统对事件给用户的陈述。\n对于习惯于图形界面系统的用户来说，操作命令行可能看起来不方便。这种形式在\
  \ Linux 中一直非常基础且完善。当你需要执行相同的命令或文件名时（在执行最常见的操作时）， shell 中有几种方法可以节省键入工作：\n\n1. 自动添加长命令\n\
  2. 重新执行过的命令\n3. 基于标准的文件名替换\n\n当你需要对多个项目执行相同操作时，命令行的优势就显而易见。在图形界面系统中，你需要与对象数量相当的输入设备。在命令行上，一个命令就足够了。\n\
  \n## 4.2 获取 Shell 权限\n\n\n\n\n\n\n命令行外壳（也称为命令解释器）是一种向操作系统和应用程序发送命令并接收其响应的程序。在任务功能上，它与\
  \ MS-DOS 中的 `command.com` 或 Windows 中的 `cmd.exe` 相似，但 Linux Shell 在功能上要不可比拟地丰富。脚本是用命令行\
  \ Shell 语言编写的小型程序，用于对文件及其数据执行顺序操作。\n\n在通过输入用户名和密码登录系统后，你可以看到命令行提示符——一行以 `$` 结尾的文本。该符号将代表命令行。如果在安装系统期间配置了在系统启动时启动图形用户界面，那么你可以在任何虚拟文本控制台上进入命令行。你可以通过按下\
  \ `Ctrl-Alt-F1` - `Ctrl-Alt-F6` 或使用如 `xterm` 等终端模拟器程序来实现。\n\n以下列出的 Shell 是可用的。根据发行版的不同，它们可能会有所区别：\n\
  \n\n### Bash\n最著名的 Linux Shell。它可以关联命令和文件的名称，维护命令历史，并允许你对其进行编辑。\n\n### pdkdh\n在\
  \ UNIX Shell 系统中，Korn shell 的克隆版本广为人知。\n\n### sash\n此 Shell 是独特的，因为它不依赖于任何共享库，并包含一些最常用工具的简化版本，例如\
  \ `al`、`dd` 和 `gzip`。在从机器崩溃中恢复或更新最关键共享库的版本时，sash 非常好用。\n\n### tcsh\nC shell 的升级版本。\n\
  \n### zsh\n这是列表中最新的 Shell。它包含了高级功能，例如命令参数自动补全以及许多其他让操作 Shell 变得更加方便实用的功能。然而，由于所有\
  \ `zsh` 扩展默认都是禁用的，在使用此命令行 Shell 之前，你必须阅读文档并允许你需要的功能。\n\n`Bash`（Bourne Again Shell）是默认\
  \ Shell。使用命令 `echo $ SHELL` 可以查看你正在使用哪个 Shell。\n\nShell 不仅在功能上有所不同，在命令语法上也不同。如果你是新用户，我们建议从\
  \ `bash` 开始。额外的示例将解释该领域的工作原理。\n\n\n`bash` 中的命令行由命令名称以及后续键（选项）组成，键会改变命令的行为。键通常以字符\
  \ `-` 或 `--` 开头，且仅由一个字母组成。在命令之后，可以添加参数（参数）——命令必须执行其上的对象名称（通常是文件和目录的名称）。\n\n按下 `Enter`\
  \ 键完成命令输入后，命令会被移动到执行 Shell。用户的终端上可能会出现有关命令执行的消息或由于命令执行导致的错误。后续命令行提示符（以 `$` 字符结尾）的出现意味着命令已完成，你可以输入下一个命令。\n\
  \n在 `bash` 中，许多技术使得输入和编辑命令行变得简单。例如，你可以使用键盘：\n\n| 键 | 说明 |\n| :--- | :--- |\n| `Ctrl-A`\
  \ | 回到行首。通过按下 `Home` 键可以实现的结果。 |\n| `Ctrl-u` | 此命令应删除当前行； |\n\n你可以使用符号 `;` 在单行内输入多个命令。`bash`\
  \ 会跟踪所有执行过的命令，使得返回并重复或编辑其中一个变得简单。从历史中选择所需的命令：`up` 键显示上一个命令，`down` 键显示后一个命令，`this`\
  \ 键显示下一个命令。要在不遍历整个历史记录的情况下找到特定的命令，按下 `Ctrl-R` 并输入要在搜索的命令中使用的关键词。\n\n历史记录记录的命令是有编号的——输入\
  \ `:` 来运行特定命令。\n\n`!` 命令编号\n\n如果你输入 `!!`，将执行你输入的上一个命令。\n\n在 Linux 上，软件和命令名称可能非常长。幸运的是，`bash`\
  \ 会为你完成名称。你可以通过按下 `Tab` 键完成命令、程序或目录的名称。假设你想使用 `bunzip2` 解压缩程序作为示例。输入：\n\n```bash\n\
  $ bu\n```\n\n然后点击 `Tab` 键。如果没有发生任何事情，还有其他补全命令的。再次按下 `Tab` 键，你将获得以字母 `bu` 开头的名称列表。例如，框架包含这些程序：`buildhash`、`builtin`\
  \ 和 `bunzip2`：\n\n```bash\n$ bu\nbuildhash builtin bunzip2\n```\n\n```bash\n$ bu\n\
  ```\n\n在输入 `n>` 后点击 Tab（bunzip 是唯一第三个字母为 `n` 的名称）。Shell 将为你补全名称的剩余部分，你现在只需按“Enter”键执行命令。\n\
  \n`bash` 会在系统变量 `PATH` 指定的目录搜索从命令行调用的程序。默认，由 `./` 表示的目录（点斜）不包含在此目录列表中。你必须使用命令 `./prog`\
  \ 从目录运行程序。\n\n## 4.4 Shell 脚本\n\n通常，你的 Shell 提示符中的信息是有用的。例如，如果你在 Ubuntu 系统测试箱上以\
  \ `rich` 身份登录，你的提示符看起来像这样：\n\n```bash\nrich@testbox:~$\n```\n\n你处于“Home”文件夹中，如波浪符号\
  \ (`~`) 所示。美元符号意味着 `bash` Shell 已经准备好让我输入命令。\n\n在介绍一些 Shell 的功能之前，我们想告诉你们另一种启动 Shell\
  \ 会话的方法。你可能不会经常使用它，但在某些阶段可能会派上用场。首先，请记住，你的提示符包含在 GUI 桌面中。\n\n\n\n\n当你使用桌面的“锁定屏幕”功能时，你的\
  \ GUI 会话会被锁定。任何人都可以 `Ctrl+Alt` 切换到虚拟终端。因此，在离开电脑之前，请注销你的虚拟终端。\n\n当你玩腻了这个小技巧后，请退出（字面意思，输入\
  \ `exit`）以注销你打开的任何 VT，然后点击 `Ctrl+Alt` 快捷键返回你的图形化桌面和 bash 提示符。之后，你就会发现这个 shell 小工具到底有多用了。\n\
  \n\n由于 shell 会解释你编写的内容，因此理解 shell 如何解释你输入的文本至关重要。以下是所有 shell 命令的通用格式：\n\n```\ncommand\
  \ option1 option2 … optionN\n```\n\n命令行（command line）是指单行命令的术语。你在命令行上输入一个命令，并附带一个或多个可选参数（或称为参数）。这些命令行选项（或参数）允许你决定命令应该执行的操作。\n\
  \n要将命令与选项分开，并将选项相互分开，请使用空格或制表符（tab）。如果你选择了一个包含空格的选项，必须将其放在引号内才能使用。例如，输入 `grep` 命令来扫描密码文件中的两个单词（`grep`\
  \ 是一个以加密方式在文件中搜索文本的命令）。\n\n```\ngrep \"WWW daemon\" /etc/passwd\n```\n\n`grep` 在包含这些单词的行上的输出所示。（你在屏幕上看到的可能与我们这里展示的不相同。）\n\
  \n```\nwwwrun:x:30:8:WWW daemon apache:/var/lib/wwwrun:/bin/false\n```\n\n如果你用你的名字创建了一个用户账户，请使用\
  \ `grep` 命令并将你的名字作为参数，但记住，如果名字包含空格，请给它加上引号。\n\n当你熟悉命令行后，可以发现一些让生活变得更简单的键盘快捷键。在这一部分中，我们将向你如何使用\
  \ `bash` shell 的某些功能，让你的命令行体验尽可能有趣。命令行补全、编辑以及使用已输入命令的后台都是这些功能之一。\n\n你可以要求 Linux\
  \ 为你完成命令或文件名。\n\n鉴于你在 Linux 命令行中输入的内容比在 GUI 环境中多得多，因此一个允许你尽可能使用输入快捷键的功能非常有用的。shell\
  \ 的命令补全功能可以补全文件名和系统命令。\n\n由于 Linux 文件系统可以处理几乎无限的文件名，许多文件名可能会变得非常巨大。输入这些长文件名非常耗时。坦率地说，命令补全让输入命令或长文件名变得轻而易举。\n\
  \n使用命令补全用于完成两件事之一：输入命令或完成文件名。\n\n### 执行命令\n\n考虑以下场景：你想输入一个命令，但你只知道它以字母 `up` 开头，并且预计它会返回机器重启以来的时间。在命令提示符处，输入\
  \ `up` 然后按 `Tab`：\n\n```\nrich@testbox:~$ up[TAB]\n```\n\n会发生以下情况之一：\n\n1. 如果搜索路径（搜索程序的目录位置；输入\
  \ `echo $PATH` 来查看你的路径）仅包含一个匹配的命令，命令行将补全该命令，机器将等待你按 `Enter` 执行它。\n2. 蜂鸣声意味着有多个命令以字母\
  \ `up` 开头。再次按 `Tab`，将出现选项。在列表中找到该命令并继续输入，直到前几个字母不同，此时你就可以按 `Tab` 键补全命令。如果按两次 `Tab`\
  \ 后没有显示任何内容，则没有匹配项。\n\n### 完成文件名\n\n不要输入前几个字符然后按 `Tab` 来获取命令行补全。如果你在命令行上输入文件名，你必须输入前几个字符然后按\
  \ `Tab`。shell 通常会扫描当前工作目录中符合你输入内容的文件名，然后补全命令行文件名。如果有多个文件包含你输入的字母，你将听到蜂鸣声，并需要再次按\
  \ `Tab` 查看选项列表，这与命令补全功能一样。\n\n这需要一些时间适应，但一旦你掌握了 `Tab` 键和 shell 命令行补全功能，你就会奇怪自己以前没有它是如何生存的。\n\
  \n### 浏览你的命令历史记录\n\nshell 能记住你做过的事情真是贴心。shell 跟踪命令的能力帮助你轻松地回到你很久以前（甚至是几天前）敲过的那些长得离谱的命令。例如，假设你定位并删除了系统中所有的核心转储文件（core\
  \ dump 文件是包含调试数据的大文件，只有专家程序员或你的机器才能理解）。该命令类似于：\n\n```\nfind / -name core -exec rm\
  \ {} \\;\n```\n\n若要重新运行该命令，从你的 shell 历史记录中检索并重新运行它。最简单的方法是输入 `Find` 并按“Enter”（如果你是重复你上次使用的完全相同的命令版本，即\
  \ `find` 命令）。这将指示你的系统在历史记录中搜索最后一次 `find` 实例并重新运行。\n\n如果你运行了多次 `find` 命令，并想确保你重新运行的是正确的版本，你需要查看你的命令历史记录。在达到想要重新执行的命令之前，反复按向上方向键，可以逐行查看。按\
  \ `Enter` 键重新运行命令。\n\n当你在提示符处输入 `history` 命令时，它会显示最后 20 条命令（默认），如果你好奇它们是什么的话。\n\n\
  \nLinux 专家通常执行的键盘舞蹈对计算机新手来说也令人为观止。这些键盘音乐家知道鼠标和图形界面等技术进步，但他们更倾向于使用主键，并觉得操作得更快。达到这种专家水平需要时间，但每位专家曾经都是新手，通过足够的练习，每个新手都能变成专家。\n\
  \n根据它们能为你提供的功能，本章将命令行命令分成了几类。\n\n\n这些命令为整个系统提供信息和控制。普通用户可以运行许多收集系统信息的命令。然而，主动更改系统配置的命令必须以\
  \ root 身份登录时运行——或者已使用 `Su` 命令变成超级用户。\n\n### 管理命令\n\n- `passwd`: 更改特定用户的密码。任何用户都可以使用此命令更改自己的密码。\n\
  - `su`: 切换到另一个用户账户而无需注销第一个账户。使用此命令的理想方法是 `su` 这样你的文件系统路径和其他信息就会加载。\n\n### 内核支持命令\n\
  \n你可能偶尔需要为新系统添加内核支持（软件或硬件）。如果发生这种情况，你有几种选择：可以重建内核，或者挂载可加载内核模块。虽然重建内核不需要核科学博士学位，但它是一种耗时的烦恼，最好避免。表格中的命令允许你在系统运行时添加内核支持，而不是从头开始重新构建。\n\
  \n- `lsmod`: 列出你的内核加载的模块。\n- `insmod`: 手动加载模块。\n- `rmmod`: 手动卸载模块。\n- `modprobe`:\
  \ 连同依赖和设置加载模块。\n\n### 进程命令\n\n进程是你系统大部分活动的基础。即使机器看起来很空闲，也有许多进程（程序）在后台运行。这些在表格中的命令允许你查看内部情况，以确保任何需要运行的都在运行，并且你没有过热或过载资源。\n\
  \n\n\n| Crontab | 设置按定期执行的命令。 |\n| :--- | :--- |\n| Kill | 通过进程号停止进程。通常使用 `kill\
  \ -9` 强制停止无法停止的程序。 |\n| Killall | 通过名称而非进程号停止进程。 |\n| Nice | 为进程分配 CPU 调度优先级。 |\n\
  | Pidof | 获取程序或进程的 ID 号。 |\n| Ps | 获取大量进程的 ID 号，通常用作 `ps aux`。 |\n| Pstree | 显示程序之间的关系。\
  \ |\n| Renice | 更改程序的 CPU 使用优先级。 |\n| Top | 显示资源使用情况。 |\n\n## 网络命令\n\n即使只是你的小型家庭网络，绝大多数\
  \ Linux 系统现在也已连接到互联网。图形化的网络管理器（Network Manager）工具可以帮助你在一个位置上自定义网络设置。Linux 还包含一系列命令行工具，用于管理和微调网络设置。下表列出了一些实用的网络相关命令。\n\
  \n| Ethtool | 显示网络接口的以太网设置。 |\n| :--- | :--- |\n| Ifconfig | 显示或设置网络接口的 IP 地址和子网掩码。\
  \ |\n| Ip | 显示或设置网络接口的 IP 地址、子网掩码和路由器。 |\n| Iw | 显示或设置无线网络接口的无线设置。 |\n| iwconfig\
  \ | 显示或设置无线网络接口的 SSID、IP 地址和子网掩码。 |\n| Nmcli | 打开网络管理器命令行界面。 |\n| Nmtui | 打开基于菜单的网络管理器命令行工具。\
  \ |\n| Route | 显示或设置默认路由信息。 |\n\n## 5.2 函数命令\n\n由于每个命令都有独特的角色，根据其角色将这些工具分类是非常容易的。如果你知道需要运行什么进程，但不确定哪条命令可以完成任务，可以从这里开始搜索。你可以通过参考帮助页（man\
  \ pages）和其他支持材料（在线网站和参考书）进行更深层次的学习。\n\n在命令提示符处，输入 `man command`即可进入帮助手册。例如，`man\
  \ ls` 会显示文件列出命令的支持信息。\n\n### Shell 帮助命令\n\n在寻找命令的支持时，你可以使用一组非常有用的 Shell 命令，如表所示。\n\
  \n寻求命令提示符选项的知识是一项永无止境的搜索。为了快速找到这些详细材料，帮助页系统在你指尖提供了有用的指南。\n\n| Apropos | 查找帮助页描述中包含关键词的命令。\
  \ |\n| Info | 寻找有用信息的方法之一。 |\n| Man | Linux 和 UNIX 中获取帮助的标准方式。 |\n| Whatis | 获取命令的单行描述。\
  \ |\n\n### Bash 命令\n\n当你尝试在帮助页中查找任何命令的支持详情时，它们似乎并不存在，且命令没有以文件的形式出现在你的系统上。当你在提示符处输入命令时，请记住你正在操作一个\
  \ Shell 程序。（在我的情况下，默认的 Linux Shell 是 `bash`。）Shell 收集了你可以用来与它通信的命令，如下表所示。\n\n| Alias\
  \ | 创建或列出命令快捷方式。 |\n| Unalias | 命令快捷方式。 |\n| Env | 列出当前运行的环境变量及其设置。 |\n| History\
  \ | 列出你最后输入的 1,000 条命令。 |\n| Export | 每当你被要求设置环境变量时，创建该变量并使用此命令，以便该变量被妥善记住。 |\n\n\
  当你查看这些命令的帮助页条目时，你会得到 `BASH BUILTINS` 加载的支持。要搜索此手册，按下正斜杠键（`/`）打开帮助搜索 GUI，然后输入要查找的命令名称。按“回车”开始搜索。界面会在第一次遇到该词时停止。点击\
  \ N 键跳转到术语的下一次出现处再次尝试。\n\n例如，你可能正在阅读巨大的 bash 帮助页（输入 `man bash` 进入此页面），但你只对提示符感兴趣，提示符是文本窗口中光标左侧的文本。提示符的一个良好示例是：\n\
  \n```\nrich@testbox:~$\n```\n\n要跳转到该短语第一次出现，输入 `/prompt` 并按“回车”。如果单词周围的文本与你寻找的内容不匹配，点击\
  \ N 键移动到下一个。\n\n### 压缩与组合\n\n尽管磁盘空间不再以前那样昂贵，但带宽和备份介质的需求仍然很大。如表所示，该类别提供了各种工具用于为了存储压缩和组织数据。\n\
  \n| bzip2 | 将文件压缩为 `.bz2` 格式。主要用于大型文本文件。 |\n| bunzip2 | 解压缩 `.bz2` 文件。 |\n| gunzip\
  \ | 解压缩 `.gz` 和 `.tgz` 文件。 |\n| Unzip | 解压缩 `.zip` 格式的文件。 |\n| Compress | 将文件压缩为\
  \ `.Z` 格式。 |\n| Xz | 压缩和解压缩 `.xz` 格式的文件。 |\n| Tar | 将文件组合打包。使用此命令的标准方法是 `tar xvf\
  \ filename`，例如 `tar xvf download.tar`。 |\n| Gzip | 将文件压缩为 `.gz` 格式。 |\n| Uncompress\
  \ | 解压缩 `.Z` 格式的文件。 |\n| Zip | 将文件压缩为 `.zip` 格式。 |\n\n## 5.3 文件系统命令\n\n无论使用哪种操作系统，如果不导航和操作文件系统，做事情都是挑战性的。这些工具将帮助你确定位置。\n\
  \n### 通用文件系统命令\n\n表中所指定的命令提供了对整个文件系统的信息或执行操作，从开发、调优到修复和恢复。其中一些命令返回信息，而另一些则提供了进行深度文件系统操作的手术工具。\n\
  \n| e2label | 为 `ext2` 或 `ext3` 分区应用文件系统标签。 |\n| badblocks | 搜索分区中的坏块。 |\n| Eject\
  \ | 弹出 CD 或 DVD。 |\n| e2fsck | 检查并修复 `ext2` 或 `ext3` 文件系统。 |\n| Mkfs | 创建文件系统（格式化分区）。\
  \ |\n| Fsck | 可以检查并修复许多类型的文件系统。 |\n| Mount | 将分区加载到你的文件系统中。 |\n| Umount | 从文件系统中移除分区。\
  \ |\n| Sync | 将缓冲区中的所有信息保存到磁盘。 |\n| tune2fs | 调整 `ext2` 和 `ext3` 文件系统参数。 |\n\n\n\
  如表所示，文件组织命令提供了移动文件和文件系统单位的工具。\n\n| Cp | 复制文件。 |\n| Df | 显示分区及其可用空间。 |\n| Ls | 列出目录内容或文件信息。\
  \ |\n| Mkdir | 创建目录。 |\n| Cd | 切换目录。 |\n| Du | 显示目录及其子目录使用的磁盘空间。 |\n| Ln | 创建快捷方式。\
  \ |\n| Mv | 移动或重命名文件。 |\n| Rmdir | 删除空目录。 |\n| Pwd | 显示当前所在目录的路径。 |\n| Rm | 删除文件。\
  \ |\n\n### 文件定位命令\n\n下表提到的命令帮助你从 Linux 巨大的树形结构文件系统中查找文件。\n\n| Find | 核心文件系统搜索工具。\
  \ |\n| Locate | 轻量级文件系统搜索工具。 |\n| Which | 如果你输入此命令，将告诉你运行程序的路径。 |\n\n### 文件属性命令\n\
  \n文件类似于糖果。包装上列出了成分、尺寸和制造日期，这些都描述了内部美味的糖块。（也许包装是防儿童的。）包装信息存储在文件的 inode 中。除了更改文件 inode\
  \ 信息外，这些命令还可以返回有关文件内容的数据，如表所示。\n\n| Chgrp | 更改文件关联的组。 |\n| Stat | 显示文件的统计信息。 |\n\
  | Wc | 显示文件中有多少个单词、行数等。 |\n| Chmod | 更改文件权限。 |\n| File | 显示你正在处理什么类型的文件。 |\n| Chown\
  \ | 更改文件的所有者。 |\n| Touch | 创建此命名的空文件。 |\n\n\n\n\n\n## 文件查看器命令\n\n许多设备用户喜欢的消遣是搜索文本文件。这些程序提供了广泛的功能，用于显示各种大小的可读文本文件的内容。由于这些命令只是查看器，而不是编辑器，因此你不会像使用全屏编辑器那样损坏文件内容。\n\
  \n| 命令 | 描述 |\n| :--- | :--- |\n| `Head` | 显示文件的前十行。 |\n| `More` | 一次显示屏文件，只能向前移动。\
  \ |\n| `Less` | 一次显示屏文件，可以向前或向后移动。 |\n| `Tail` | 显示文件的最后十行。 |\n| `Cat` | 将文件内容倾到屏幕上。\
  \ |\n\n\n下面列出的命令帮助用户处理文件系统中的文件。\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `Cat` | 在标准输出中显示文件（可以将多个文件合并为一个大文件）。\
  \ |\n| `Diff` | 比较两个文本文件并找出差异。 |\n| `Cut` | 从文件的每行文本中提取特定部分。 |\n| `Dd` | 从一个文件复制数据块到另一个文件（用于从设备复制数据）。\
  \ |\n| `Expand` | 将所有制表符转换为空格。 |\n| `Fold` | 将每行文本折叠以适应指定的宽度。 |\n| `File` | 显示文件中的数据。\
  \ |\n| `Grep` | 在文本文件中搜索正则表达式。 |\n| `Lpr` | 打印文件。 |\n| `Less` | 一次显示一页文本文件。（按 b\
  \ 键向后移动。） |\n| `More` | 一次显示一页文本文件。（只能向前移动）。 |\n| `Paste` | 合并多个文件的对应行。 |\n| `Nl`\
  \ | 对文本文件中所有非空行进行编号，并将行打印到标准输出。 |\n| `Patch` | 使用原始文件和修订版文件之间的差异更新文本文件。 |\n| `Sort`\
  \ | 对文本文件中的行进行排序。 |\n| `Sed` | 在应用指定编辑命令的同时将文件复制到标准输出。 |\n| `Split` | 将一个文件分成多个指定大小的较小文件。\
  \ |\n| `Tac` | 反转文件（最后一行在前，依此类推）。 |\n| `Zcat` | 显示压缩文件（解压缩后）。 |\n| `Tail` | 显示文件的最后几行。\
  \ |\n| `Tr` | 在整个文件中用一组字符替换另一组。 |\n| `Uniq` | 消除文本中的重复行。 |\n| `zmore` | 一次显示一页压缩文件。\
  \ |\n| `Wc` | 统计文本文件的行、字和字符数。 |\n| `Zless` | 一次显示一页压缩文件。（按 b 键向后移动。） |\n\n## 5.4\
  \ 成为超级用户 (Root)\n\n你必须成为 root 来执行需要高权限的操作，例如管理你的系统。通常，你使用常用的用户名和密码日常登录。然而，当你需要超级用户权限时，运行以下命令变为\
  \ root：\n\n```\nsu -\n```\n\n`su` 后跟着一个空格和一个减号，这是命令（或连字符）。shell 需要 root 密码。在输入密码后点击“回车”。\n\
  \n完成作为 root 身份所需的任何操作后（你可以以 root 身份做任何事情），输入 `exit` 返回原来的用户名。\n\n与其使用 `su -` 命令获取\
  \ root 权限，不如输入 `sudo` 后跟你想作为 root 运行的命令。由于在安装 Ubuntu 时你没有机会设置 root 用户，因此你必须使用 `sudo`\
  \ 命令。如果你在 `/etc/sudoers` 文件中被识别为授权用户，`sudo` 将以你已登录 root 的身份执行该命令。要了解更多关于 `/etc/sudoers`\
  \ 文件的信息，请输入 `man sudoers`。\n\n## 5.5 处理日期和时间\n\n`date` 命令可以显示当前的日期时间和设置新的日期时间。如果你在\
  \ shell 提示符输入 `date`，你会得到类似的内容：\n\n```\nFri Mar 12 15:10:00 EST 2021\n```\n\n如你所示，`date`\
  \ 命令本身显示最新的日期时间。\n\n要更改日期，请以 root 登录并输入 `date`，然后是 `MMDDhhmmYYYY` 格式的日期时间。输入 2021\
  \ 年 3 月 12 日 晚上 10:30 来设置日期时间。\n\n`031220302021` 就是日期。\n\n日期时间格式 `MMDDhhmmYYYY`\
  \ 与 24 小时军用钟相似，具有以下含义：\n\n1. `MM` 代表月份，是一个两位数字（01 到 12）。\n2. `DD` 是代表月份日期的两位数字（01\
  \ 到 31）。\n3. 在 24 小时格式下，`hh` 是两位数小时（00 是午夜，23 是晚上 11 点）。\n4. 分钟由 `mm` 测量，是一个两位数字（00\
  \ 到 59）。\n5. 四位年份用 `YYYY` 表示（例如 2021）。\n\n`cal` 是另一个与日期相关的有用命令。如果你在不带任何选项的情况下输入\
  \ `cal`，它会打印当月的日历。当你输入 `cal` 后跟一个数字时，该数字被视为年份，并打印该年的日历。提供月份数字（1 = 一月，2 = 二月，依此类推）配合年份可以显示特定年份特定月的日历。\n\
  \n\n由于大多数 PC 现在连接到局域网 (LAN) 或互联网，你也必须控制你的网络连接。为了建立局域网，Linux 包含一个网络配置工具。通常有一个 GUI\
  \ 终端拨号工具用于通过调制调器连接互联网。\n\n如果你使用 DSL 或电缆调制调器连接到互联网，你需要一台带有以太网卡的 PC 来连接电缆或 DSL 调制调器。你还必须配置以太网并建立局域网。幸运的是，这些步骤通常包含在\
  \ Linux 安装过程中。如果你愿意，稍后可以使用 GUI 网络配置工具进行配置。\n\nLinux 还带有用于配置防火墙的工具，防火墙充当你的设备与任何试图窥探你互联网连接的人之间的安全屏。可以使用\
  \ `iptables` 命令或 GUI 防火墙配置功能配置防火墙。\n\n\n物理通道将你的设备连接到供应商的服务器，允许你连接到互联网。\n\n物理连接可以通过三种方式之一建立：\n\
  \n1. 无线连接；\n2. 局域网；\n3. 允许交换 PPP 的调制调器。\n\n在第一种情况下，需要无线访问点。只有在互联网开放的情况下，才能建立连接的无线网络。\n\
  \n当你的机器连接到局域网时，使用第二种方法通过服务器访问万维网。在这种情况下，你不需要担心设置连接，因为局域网管理员会处理。只需打开一个窗口，输入你想访问的\
  \ URL，然后进入即可。\n\n第三种选择是使用拨号调制调器连接。管理员不会帮助你，因此你必须独立完成。我们同意进一步研究这种方法。\n\n你需要一个调制调器和一个电话才能开始。下一步是选择一个互联网提供商，并获取你的\
  \ PC 连接到供应商调制调器池的电话，以及进入全球网络的用户名和密码。\n\n然后必须配置 PPP 协议。你可以手动配置，也可以借助配置软件帮助。手动配置非常耗时，并且需要编辑文件和编写脚本。初学者应该使用一个自动完成整个互联网接入过程的程序。\n\
  \n该软件最初用于 KDE 图形环境，被称为 `kppp`。此实用程序使得设置连接变得简单得多，通常你只需要正确定义账户详情即可。\n\n## 理解互联网\n\n\
  鉴于互联网的广泛使用和流行，你不仅希望将你的 Linux 设备连接到网络，还要连接到全球最大的网络：互联网。取决于你拥有 DSL 还是电缆调制调器，我将在本中为你展示几种连接互联网的方法。仍有小部分的人在使用拨号网络服务，但他们现在很少了。大多数用户对拨号连接较慢的输出并不满意。\n\
  \n\n\n\nDSL 和电缆调制解器是连接互联网的两种选择，包括将特定的调制解器连接到 Linux 设备上的以太网卡。在这些情况下，你需要配置 Linux 系统的以太网网络。如果你的电脑只是通过移动/Wi-Fi\
  \ 链路连接的网络上的客户端，且不需要专用连接，那么事情就很简单。你只需要在进入下一章之前跳过这一章即可。\n\n你对互联网的观点定义了你如何解释它。大多数人通过他们所使用的服务来看待互联网。作为用户，你可能将互联网视为一个交换信息的媒介，具有以下特性：\n\
  \n1. **电子邮件**：使用特定的电子邮件地址向互联网上的所有人发送电子邮件。\n2. **网页**：从全球数百万台服务器下载并访问文档，在 Facebook\
  \ 上点赞链接，使用 Google 搜索信息等。\n3. **信息共享**：下载应用程序、音乐文件、视频和其他有用材料。你可以为其他系统的用户提供可下载的文件。\n\
  4. **远程访问**：通过互联网登录另一台设备，前提是你拥有该远程计算机的权限和访问权限。\n\n根据技术人员的说法，互联网是一个全球网络系统。Internet\
  \ 一词是 internetworking（组网）的缩写，即连接网络。`Internet Protocol`（`IP`协议）是为了连接多个网络而开发的。\n\n\
  在物理链路方面，互联网等同于公路和道路网络。由于这种相似性，互联网被主流媒体称为“信息超级高速”。互联网拥有一些高容量网络（10-Gbps 骨干网每秒支持 100\
  \ 亿位）以及许多低容量网络，从 56 Kbps 的拨号连接到 100 Mbps 或更高的高速电缆链路，正如公路和道路网络中有州际公路、许多州道和许多郊区街道。（每秒千比特等于\
  \ `Kbps`，每秒百万比特等于 `Mbps`）。互联网的骨干是一个高容量网络。\n\n单一实体并不拥有互联网，它也不由单一计算机控制。实际的互联网是一个由成千上万合作组织运营的网络集合。是的，网络由数万家公司监管。这听起来不可思议，但它确实在运行。\n\
  \n## 网络基础 101\n\n如果你使用连接到局域网（LAN）的电脑，并在安装过程中安装了网络功能，你可能已经连接到了互联网。\n\n不应因为高速提供商的存在而阻碍\
  \ Linux 用于高速网络。仅仅因为他们没有明确支持 Linux，并不意味着该技术与其不兼容。`TCP/IP`（互联网流量规则集）是为 UNIX 操作系统设计的，而\
  \ Linux 正源于此。\n\n如果你想实现 Windows 和 Linux 的双启动，你的 ISP 可以帮助你设置宽带链路，然后你就可以在任何你有时间和意愿的时候尝试让\
  \ Linux 连接上。\n\n### 电缆调制解器\n当你注册电缆互联网服务时，安装人员通常会给你一个特定的电缆调制解器系统。传输电缆调制解器的信号通过有线同轴电或光纤传输。你的工作站可以通过连接到电缆调制解器以太网口的以太网线直接连接，或者如果你的工作站具有无线网络芯片，可以通过无线连接。你需要与你的电缆提供商联系，以确定具体的可用速度。\n\
  \n### 数字用户线路 (DSL)\nDSL 以数字格式向你的电话插座发送数据。DSL 之闻是因为它利用了电话公司现有的铜线布线。即使是标准电话线相同的线路也可以使用。DSL\
  \ 连接需要额外的通信硬件，这些硬件应由你的互联网服务供应商（`ISP`）提供。\n\nDSL 分为几类：\n1. `ISDN`（综合业务数字网络）数字用户线路\
  \ (`IDSL`）——关于 `ISDN` 的描述可以在后面的项目列表中找到。\n2. `光用户线路（对称）` (`SDSL`）\n3. `数字用户线路（非对称）`\
  \ (`ADSL`）\n4. `DSL`（通用） (`XDSL`）\n\n询问你的 `ISP` 关于你 DSL 链路的速度，因为速度各不相同。\n\n####\
  \ ISDN（综合业务数字网络）\nISDN 是家庭最老的高速解决方案之一。当 28 Kbps（约为今天标准拨号调制解器速度的一半）似乎是你从电话到电话公司的铜线中获得的全部时，情况就是如此。ISDN\
  \ 在某些地区仍然可用，如果你距离电话公司的中心局 3.4 英里以内，它能保证提供 128 Kbps 的恒连接。`ISDN` 调制解器（通常由 `ISDN ISP`\
  \ 提供）和网络适配器必须使用 `ISDN`（有时是以太网卡）。\n\n#### 卫星调制解器\n对于那些住在没有电缆、DSL 或 ISDN 连接的偏远或低基础设施地区的人，卫星调制解器是一个可行的方案。在某些方面，这种通道与电缆类似，因为通常通过与卫星电视信号相同的提供商访问。卫星也有某些缺点。如果你的互联网服务不可靠，它将面临与卫星电视服务相同的命运。上传和下载速度也可能差异巨大。\n\
  \n#### 拨号调制解器\n即使在现在高速互联网时代，在无法访问宽带或成本过的地方，拨号调制解器仍然在使用。它将计算机的数字信号转换为从电话公司墙上插座传输所需的模拟信号。除了订阅\
  \ `ISP`，你不需要做任何额外操作，因为调制解器使用的是现有的语音电话服务。不过，你不能同时在同一条电话线上进行拨号和通话。\n\n## 设置硬件\n\n\
  在你椅子上坐舒服之前，双击检查几项。你需要执行低级操作（如爬到桌子下）来完成：\n\n1. **连接以太网线**：如果你的电缆、DSL 或 ISDN 调制解器需要来自工作站的有线链路，请确保以下措施到位：\n\
  \    - 一根以太网线（类似于电话线，但连接器更宽）插入电脑的以太网口和你的 `ISP` 安装的特定调制解器中。\n2. **无线连接**：如果你的设备有无线卡或芯片组，你需要一个无线路由器来接收和引导设备之间的无线流量，以及一个桥接器将你的工作站连接到以太网网络。你正在使用的硬件决定了无线路由器或桥接器距离卡多远以及跨越什么障碍（墙、地板等）。设置你的无线接入需要以下步骤：\n\
  \    - **识别**无线路由器或桥接器使用的无线协议：无线协议主要五类，大多分组为 Wi-Fi（`802.11a`、`802.11b`、`802.11g`、`802.11n`\
  \ 和 `802.11ac`）。确保你购买的无线路由器或桥接器支持你的设备使用的无线标准。\n    - **为你的无线网络**赋予唯一的名称。\n    -\
  \ **启用无线网络保护**：有几种不同的无线保护规范可选。最流行的是 `WEP`、`WPA` 和 `WPA2`，其中 `WPA2` 是三者中最稳定的。如果你的无线路由器支持，请使用\
  \ `WPA2` 保护。\n\n### 调制解器\n如果你使用调制解器连接互联网，请确保：\n- 电话线的一端插入墙上插座，另一端插入调制解器。\n- 如果使用外部调制解器，确保调制解器牢固地连接到设备上的相应端口并确保已开启。\n\
  - 当使用内部调制解器时，双击检查它不是需要特殊 Windows 驱动程序的软件调制解器（通常称为 `WinModems`）。\n\n\n\n\n\n\n由于\
  \ Linux 普及度的迅速提升，许多 ISP 都开始教他们的支持人员如何使用它。如果你已经有一个 ISP，请联系他们并提醒他们你的 Linux 志向。很可能，该人员已经拥有\
  \ Linux 订阅者所需的信息，并可以与你分享。如果你正在寻找新的互联网服务提供商，本节将帮助你做出明智的决定。\n\n某些 ISP 拥有专有软件，必须安装在你的计算机上才能连接互联网。可能，他们提供的应用程序只能在\
  \ Windows 上运行。\n\n在寻找互联网服务提供商时，请考虑以下问题：\n\n1. 它提供 Linux 技术支持吗？如果你打算运行 Linux，这是一个需要记住的重要方面。这不一定是决定性的失败因素，但可能会很有帮助。\n\
  2. 是否可以获得推荐？询问你的朋友。满意客户的推荐是 ISP 最好的伙伴。\n3. 你是否可以使用你约定的带宽？许多互联网服务提供商对网络进行超超分订阅，认为并非所有人都会同时在线。确保你在深夜（当你的邻居都在用电脑看电影时）能获得你付钱的带宽！\n\
  \n## 收集你所需的信息\n\n在与可靠的 ISP 注册服务后，你将收到客户信息单。该表单应详细说明你的网络如何分配用于网络通信的 IP 地址。有时，IP 地址分配给路由器，而本地网络中的个人工作站被赋予私有\
  \ IP 地址。\n\nIP 地址通过两种方式之一分配给你的 Linux 工作站：\n\n1. **静态**：你的 IP 地址保持不变。服务器使用静态地址的频率比桌面电脑高得多。如果你使用静态地址，你的\
  \ ISP 必须为你提供名称服务器 IP 地址、网关地址、网络地址和子掩码。客户信息单应包含这些信息。\n2. **动态**：当你连接或在定期间隔时，你的 IP\
  \ 地址会发生。大多数桌面电脑不需要精确的地址，这让 ISP 的工作变得简单。这也让笔记本电脑的生活变得简单，因为它们经常在不同网络之间切换。如果你使用动态地址，将被告知使用动态主机配置协议（`DHCP`）。你的缆调制调器、DSL、ISDN\
  \ 或卫星调制调器兼作带有 `DHCP` 的路由器，为本地网络上的设备分配唯一的 IP 地址。\n\n\n1. 用于向互联网发送电子邮件消息的传出 `SMTP`\
  \ 中继服务器地址。\n2. 从你服务器收件箱检索邮件的入站 `POP3` 或 `IMAP` 电子邮件服务器地址。\n\n你可以使用 Linux 系统通过这些细节创建互联网连接。\n\
  \n\n你正在寻找 Linux 云托管服务器吗？为了让你的网站或电子商务网站更有效，同时确保卓越的整体效率，这是更好的选择。\n\n使用 Linux 云托管服务器的客户受益于改进的可配置性以及根据其资质进行调整的能力。我们提供的这种硬盘服务器提高了你网站的整体效率，并让你对可用计算资源有更多的控制权。\n\
  \nLinux 服务器软件使用尖端技术，允许任何人运行他们版本的 Linux，同时为他们提供更强的整体性能、更强的可配置性和更好的供应路径。\n\n保证百分之百的运行时间，这确保了你的博客可以流畅运行而不会长时间卡顿。为了确保你的博客仍然关于备份服务器，提供了自动故障转移功能。\n\
  \nLinux 服务器 Web 托管服务包含 DDOS 安全，以确保最高水平的尖端安全。`DNS` 和地理位置重复的客户端被转发到八家传输公司。\n\nLinux\
  \ Shared Web 托管支持最新且可靠的 Web 托管版本，如 `Fedora 7`、`CentOS 7`、`Ubuntu 14.04 LTS` 和 `Debian\
  \ 7.8`。客户可以使用操作系统的所有服务器和 PC 功能。这些预装主机可以立即访问，允许客户在他们自己的 Web 托管服务中使用它们。\n\n如果你的网站出现问题，有专门的支持人员可以提供专门的解决方案。可以为客户提供任何流行且广泛理解的基础知识，引导他们处理简单的请求。\n\
  \n客户将获得与物理服务器相同的、按需构建的个人硬盘。Linux Web 托管服务程序允许你的主机通过 Internap 运营商的千兆上行链路连接到。\n\n\
  提供了最新的章节变体，以便客户拥有完全的控制权。\n\n由于运营商网络将单个主机切分以便方便地与客户共享，传统的 VPS Web 托管服务不再是首选方案。\n\n\
  VPS 提供商使用容器技术在单个 Linux 类型上隔离多个用户，这减少了操作和生产力。\n\n## 6.3 网络拓扑结构\n\n从 Windows 到 macOS，大多数现代操作系统都内置了对传输控制协议/网协议（`TCP/IP`）网络的支持。TCP/IP\
  \ 网络可以通过各种物理接口实现，包括以太网卡、串口端口和并行端口。\n\n通常，以太网网络用于你办公室甚至家中的局域网（`LAN`）（如果你家里有两个或更多系统），而无线网络（下一章）在大多数地区正变得越来越普遍。\n\
  \n如果你在局域网（`LAN`）上有笔记本电脑，或者不想拉一堆乱线来将 PC 连接到 `LAN`，你可以使用无线以太网网络。在通常情况下，你有一个缆调制调器或\
  \ DSL 互联网连接。你想将带有无线网卡的笔记本电脑连接到缆或 DSL 调制调器以访问互联网。本章解释了如何连接到以太网 `LAN` 并使用无线网络访问互联网。\n\
  \n### 6.3.1 理解 LAN 的 TCP/IP\n\n考虑 TCP/IP 网络最简单的方法将其视为一个四层模型，每层负责一个特定的角色。分层模型描述了从物理链路到终端用户应用程序之间的数据流。\n\
  | 4 | 应用层 | 邮件、传输、TELNET |\n| :--- | :--- | :--- |\n| 3 | 传输层 | `TCP` (传输控制协议) `UDP`\
  \ (用户数据报协议) |\n| 2 | 网络层 | `IP` (网协议) |\n| 1 | 物理层 | 以太网 |\n\n在四层模型中，信息通常从一层传递到下一层。当一个应用程序向另一个应用程序发送数据时，数据跨越这些层：应用、传输、网络和物理。数据从物理网络传输向上传输到接收端。\n\
  \n为了处理和格式化数据，每层都有自己的协议 —— 惯例。标准协议是执行任务的预期序列，例如写信封，如果你认为发送数据类似于通过邮政服务寄信（首先是姓名，然后是街道地址，接着是城市、州和邮政编码或其他邮编）。\n\
  \n\n从上到下，是这四层的功能：\n\n\n\n\n\n### 1. 协议层\n\n- **应用层 (Application)**：运行面向用户的程序，如电子邮件客户端、文件传输程序和网络浏览器。用于电子邮件的简单邮件传输协议\
  \ (`SMTP`) 和邮局协议 (`POP`)、用于互联网的超文本传输协议 (`HTTP`) 以及用于文件传输的文件传输协议 (`FTP`) 都是应用层协议。应用层协议通常会分配一个端口号，可以被视为特定应用程序的标识符。例如，`HTTP`\
  \ 或 Web 服务器连接到端口 `80`。\n- **传输层 (Transport)**：将信息从一个应用程序移动到另一个应用程序。传输控制协议 (`TCP`)\
  \ 和用户数据报协议 (`UDP`) 是该层中两个最相关的协议（其中 `UDP`）。`TCP` 确保数据传输，而 `UDP` 只负责发送数据而不确保其到达目标地。\n\
  - **网络层 (Network)**：从一个网络接收数据包并将其传输到另一个网络。如果网络之间距离较远，数据包在到达目的地之前会从一个网络路由到下一个网络。IP\
  \ 协议是该层最重要的协议（即 `IP`）。\n- **物理层 (Physical)**：物理网络硬件在网络中持有数据包（如以太网卡或令牌环卡）。\n\n分层模型的简单之处在于，每层只负责一项任务，将其他任务交给其余层处理。层之间可以混合组合。`TCP/IP`\
  \ 网络可以构建在任何形式的物理网络介质上，从以太网到无线电波（无线网络中）。每层都可以在各种模块中实现，程序是模块化的。传输层和网络层通常包含在操作系统，任何应用程序都可以使用它们。\n\
  \n由于安全、可用应用程序的出现，`TCP/IP` 取得了巨大进展。`TCP/IP` 协议最初是工作应用程序，而不是网络架构和协议的纸面总结——谁能对已经运行良好的程序异议呢？`TCP/IP`\
  \ 现在主导着互联网。\n\n\n当你拥有一个包含许多台机器的网络时，你需要对每台机器进行单独分类。`IP` 地址是计算机在 `TCP/IP` 网络中的地址。该地址基于网络地址和主机地址，因为\
  \ `TCP/IP` 关注的是网络互连。你可能将网络地址和主机地址理解为需要两个地址来唯一标识一台计算机：\n\n1. 网络地址指定计算机在网络上的位置。\n\
  2. 主机地址识别网络上的特定设备。\n\n`IP` 地址是一个 4 字节（32 位）的值，结合了网络地址和主机地址。每个字节应写成一个十进制值，并在每个数字后加一个点\
  \ (`.`)。因此出现了诸如 `132.250.112.52` 的网络地址。点十进制或点四位法是编写 `IP` 地址的方法。\n\n一个字节（包含 8 位）在十进制表示法中的可以是\
  \ `0` 到 `255` 之间的值。有效的 `IP` 地址可能只包含 `0` 到 `255` 之间的点十进制数字。\n\n### 端口号和网络服务\n\n由于任何支持\
  \ `TCP/IP` 的设备上都提供多种标准服务，`TCP/IP` 协议族已成为互联网的通用语言。这些服务通过简化发送和接收电子邮件、新闻和网页来保持互联网的运行。这些服务通过多种名称识别，包括：\n\
  \n- `DHCP`（动态主机配置协议）是一种允许设备动态配置 `TCP/IP` 网络参数的协议。`DHCP` 是一种为 `TCP/IP` 网络 分配动态 `IP`\
  \ 地址和其他网络信息（如名称服务器、默认网关和域名）的协议。`DHCP` 服务器在端口 `67` 上监听。\n- `FTP`（文件传输协议）是一种用于在互联网上计算机之间传输数据的协议。`FTP`\
  \ 使用两个端口：端口 `20` 用于数据传输，端口 `21` 用于控制信息交换。\n- 域名使用 `DNS`（域名系统）翻译为 `IP` 地址。该服务的端口号为\
  \ `53`。\n- `HTTP`（超文本传输协议）是一种用于计算机之间交换文档的协议。万维网的底层协议是 `HTTP`。Web 服务器和客户端默认在端口 `80`\
  \ 上通信。随着增加了 `SSL/TLS`，协议变为 `HTTPS`，端口号改为 `443`。\n- `SMTP`（简单邮件传输协议）是一种在系统之间发送和接收电子邮件消息的协议。对于信息共享，`SMTP`\
  \ 使用端口 `25`。\n- 客户端使用 `POP3`（邮局协议第三版）接收邮件，该协议使用端口 `110`。当使用 `SSL/TLS` 进行保护时，端口变为\
  \ `995`。\n- 客户端也可以使用 `IMAP`（互联网消息访问协议）与邮件通信（而不是 `POP3`），它使用端口 `143`。当使用 `SSL/TLS`\
  \ 安全性时，端口变为 `993`。\n- `NNTP`（网络新闻传输协议）是一种以存储和转发格式在互联网上传输新闻文章的协议。`NNTP` 协议使用端口 `119`。\n\
  - `NetBIOS` 是 Windows 使用的网络协议，它使用多个端口进行会话，最常见的是 `139`。\n- `SSH`（安全外壳）是一种用于在不稳定网络上的安全远程登录和其他安全网络服务协议。`SSH`\
  \ 使用端口 `22`。\n- 当一台设备上的用户登录互联网上的另一个系统时，会使用 `Telnet`。（为了登录远程设备，用户需要有效的用户 ID 和密码。）默认情况下，`Telnet`\
  \ 连接到端口 `23`，但 `Telnet` 可以连接任何端口。\n- `SNMP`（简单网络管理协议）是一种允许你在互联网上管理所有形式网络设备的协议。`SNMP`\
  \ 使用 `FTP` 的两个端口：`161` 和 `162`。\n- Cisco 注册目录服务使用端口 `465`。\n- `TFTP`（简单的文件传输协议）是一种允许从一个设备向另一个设备传递文件的协议。（通常用于通过网络从无盘工作站导入文件。）在端口\
  \ `69` 上传输 `TFTP` 数据。\n- `NFS`（网络文件系统）是一种允许计算机共享文件的系统。`NFS` 使用 Sun 的远程过程调用 (`RPC`)\
  \ 设施，该设施通过端口 `111` 通信。\n\n每个服务连接到一个已知端口。任何端口都由 `TCP` 协议用于定位服务。\n\n### 6.3.2 理解无线网络\n\
  \n你听过 Wi-Fi。无线 Fidelity (`Wi-Fi`) 是一种与以太网网络类似的短距离无线网络。Wi-Fi 网络的运行细节由 `IEEE`（电气电子工程师学会）标准描述。制造商使用这些规范开发你可以购买并建立无线局域网\
  \ (`WLAN`) 的产品。\n\nWi-Fi 网络标准进展迅速。`802.11a` 催生了 `802.11b`，两者合并形成了 `802.11g`，随后被\
  \ `802.11n` 取代。但这两个标准的目标都是解释无线以太网的物理层如何工作。建立无线网络不需要了解所有规范的所有细节，但学习一些关键点将有助于你为网络购买合适的设备。\n\
  \n由于所有无线信道用户共享该带宽，用户看到的实际数据吞吐量仍然远低于通道的总容量。此外，随着用户 PC 与无线接入点之间距离的增加，数据传输会降低。\n\n\
  基础、点点模式和无线等效加密 (`WEP`)：\n\n对于无线以太网，`802.11` 协议规定了两种操作模式：基础和点点。在没有接入点的情况下，点点模式实际上是两个或多个无线以太网卡相互通信。\n\
  \n\n\n\n基础模式（Infrastructure mode）描述了所有无线以太网卡如何相互通信以及通过接入点与有线局域网通信。在本章中，假设你已将无线以太网卡设置为基础模式。这种模式在配置文件被称为“控制”（controlled）。\n\
  \n无线等效隐私（WEP）是 `802.11` 标准的一个特性，用于保护无线通信免受窃听。WEP 使用移动站（如带有无线以太网卡的笔记本电脑）与接入点（也称为基站）之间交换的\
  \ 40 位或 104 位隐藏密钥。在数据包传输之前，该密钥用于对其进行加密，并进行完整性检查以确保数据包在传输过程中未更改。\n\n`802.11` 标准并未提到共享密钥是如何创建。许多无线局域网使用所有移动站和接入点都交换的单一密钥。然而，在大学校园这样的环境中，这种方法的扩展性不佳，因为密钥是所有用户共享的——你知道与数百人共享密码是什么什么体验。WEP\
  \ 很少用于大学等大型无线网络。在这样的无线网络中，必须使用其他验证方法，如 `SSH`（安全 Shell）。尽管 WEP 曾被认为适用于家庭无线网络，但现在已不再被推荐。\n\
  \nWi-Fi 联盟十多年前发布了一种名为 Wi-Fi 安全访问（WPA）的规范，它取代了之前的 WEP 标准，并通过一些改进增强了保护。与 WEP 使用固定密钥不同，WPA\
  \ 使用临时密钥完整性协议（TKIP），它为网络传输的每 10 KB 数据创建新密钥，使得 WPA 更难破解。Wi-Fi 安全访问 2（WPA2）是 WPA 加密的第二代，由\
  \ Wi-Fi 联盟于 2004 年发布。WPA2 基于最终 `IEEE 802.11i` 标准，使用带有数字证书的公钥加密以及 `RADIUS`（远程认证拨号用户服务）服务器进行无线以太网网络中的认证、授权和计费。WPA2\
  \ 使用高级加密标准（AES）加密数据。最近公布 WPA3 似乎是未来的趋势，旨在进一步提高安全性。\n\n\n网协议（Internet Protocol）建立网络边界并中继数据报，从而实现互联网网络。\n\
  \n该结构由头部和有效负载组成，其头部包含主要的 IP 地址和使用特定参数链接的接口。内部和外部网关协议、路由前缀以及网络标识都涉及其中。端到端协议在可靠性方面发挥作用，但预期的框架如下：\n\
  \n| | UDP Header | UDP DATA → Transport |\n| :--- | :--- | :--- |\n| IP Header |\
  \ IP Data → Internet |\n| Frame Header | Frame Data | Frame Footer → Link |\n| Data\
  \ | Application |\n\n## 获取对端信息\n\n要获取对端信息，返回所有的 TCP 和 IP 信息。服务器和客户端都通过这种方式连接到网络。你也可以使用\
  \ `getpeername()` 套接字在信息快速可用时进行捕获并保存信息。这包括由不同 Linux 方法发送和检索的正确数据，以及程序中对应的相应的套接字描述符和权限。某些信息也可以被视为私有以改善用户体验。\n\
  \n允许套接字 `TCPAcceptor::accept()` 在网络中流行以接收数据。你可以这样来区分服务器和客户端行为的区别。\n\n## 创建与销毁\n\n\
  这些与套接字描述符相关，并允许在屏幕上显示对端 TCP 端口和 IP 地址。与之前的 Linux 前身不同，它没有使用 `C++` 之外的其他语言。\n\n析构函数可能会破坏你建立的任何链接。例如，为了退出你的一个社交网络账户，正是因为存在析构函数。\n\
  \n大多数 Linux 发行版都有许多程序，可以满足你大部分的日常计算需求。大部分程序都可以从你发行版的 GUI 桌面访问。\n\n几乎每个 Linux 程序都有一个专门的网站，你可以在那里找到关于它的详细信息，包括在哪里以及如何下载。每个发行版都带有一系列工具和应用程序，你可以在设置系统时安装它们。\n\
  \n如果是 Debian 或基于 Debian 的发行版（如 Ubuntu），缺少某个应用时只要只要有高速互联网连接，就可以快速获取。\n\n## Linux\
  \ 和 SMTP 客户端\n\nSMTP 客户端可能会使用一些之前相同的字符，但会有一些微调。这完全关于打开套接字、打开输入输出源、读写套接字以及清理客户端门户。此外，请注意它涉及：\n\
  \n1. 数据报的传输。这意味着如果你的门户向不同的客户端和服务器发送数据报，本地套接字将运行。\n2. Linux 通信流和数据报通信。\n3. 套接字编程。\n\
  \n## Echo 客户端设置\n\n在 Linux 中，Echo 客户端通过向 `socket()` 传递参数运行，这意味着你可以使用带有 `PF INET`\
  \ 特性的 IP 将它们放入同一个 TCP 套接字中。要构建一个正确的客户端结构，记住你需要改进之前的代码。\n\n## Linux 中的套接字\n\n同时，注意你可以用\
  \ `C` 编写 Linux，因为它们都使用套接字。`socket` 充当客户端与端口之间的桥梁，向服务器发送请求并等待其响应。最后，完成数据传输和接收。\n\n\
  同时，Linux 套接字将为服务器构建一个套接字，将其连接到端口。你可以监听客户端的流量。你也可以等待客户端到达该阶段并观察提交和接收的数据。以下是它的其他一些功能：\n\
  \n| socket_description | Description |\n| :--- | :--- |\n| `socket_description`\
  \ | 这允许客户端和服务器的细节显示在屏幕上。 |\n| `write buffer` | 这标识信息。 |\n| `write buffer length`\
  \ | 你需要查看字符串的输出以写入缓冲区长度。 |\n| `client_socket` | 将显示套接字定义。 |\n| `address` | 这用于 `link`\
  \ 函数中将地址行保持在栈顶。 |\n| `address_len` | 如果第二个参数为空，则它将显示在屏幕上。 |\n| `return` | 这有助于返回客户端和套接字轮廓。由于此点，客户端和服务器之间的交互通常被简化了。\
  \ |\n| `server_socket` | 这是顶层套接字的描述。 |\n| `backlog` | 这是尚未满足的需求数量。 |\n\n## 6.4 诊断命令和文件\n\
  \n设置传输控制协议/网协议（TCP/IP），就像 Linux 中几乎所有其他内容一样，涉及准备一系列配置文件（你可以用任何文本编辑器编辑的文本文件）和命令。`/etc`\
  \ 目录包含这些文件的大部分。Linux 安装程序尝试帮助预填充值，并消除你直接与每个 TCP/IP 配置文件通信的需求。然而，如果你知道文件名及其用途，手动编辑文件（如有必要）总是更容易的。\n\
  \n当你安装 Linux 时，可以设置 TCP/IP 网络。然而，为了成功控制网络，你将需要熟悉 TCP/IP 配置文件并在必要时编辑它们。（例如，为了验证名称服务器是否正确列出，你需要了解\
  \ `/etc/resolv.conf` 文件，它存储了名称服务器的 IP 地址。）\n\n| File Name | Contents: |\n| :---\
  \ | :--- |\n| `/etc/hosts` | 本地网络以及你经常访问的其他系统的 IP 地址和主机名 |\n| `/etc/host.conf` |\
  \ 关于如何将主机名转换为 IP 地址的指令 |\n\n\n\n\n\n| `/etc/networks` | 网络名称和 IP 地址 |\n| `/etc/nsswitch.conf`\
  \ | 关于如何将主机名转换为 IP 地址的指令 |\n| `/etc/hosts.allow` | 关于哪些系统可以访问你系统上的互联网服务的指令 |\n|\
  \ `/etc/resolv.conf` | DNS 服务器的 IP 地址 |\n| `/etc/hosts.deny` | 关于哪些系统必须被拒绝访问你系统上的互联网服务的指令\
  \ |\n\n在如今，很少会遇到未连接网络的 Linux 机器，无论是计算机还是工作站。有时，诊断网络故障、通信异常或运行缓慢是至关重要的。在本节中，我们将介绍最常用的\
  \ Linux 网络诊断命令。\n\n| 命令 | 用途 |\n| :--- | :--- |\n| `ping` | 帮助确定互联网连接 |\n| `traceroute`\
  \ | 帮助检查连接互联网所需的路由跳数 |\n| `route` | 允许查看连接互联网时使用的路由 |\n| `dig` | 帮助验证 DNS 稳定性 |\n\
  | `ethtool` | 允许检查网卡的物理连接性 |\n| `IP ADDR LS` | 列出带有 IP 地址的网卡，用于配置多个 IP 地址 |\n| `ifconfig`\
  \ | 显示网卡的网络配置 |\n| `mtr` | 用于确定产生网络响应延迟和流量问题的路由器 |\n| `nslookup` | 用于检查目标主机/网站的\
  \ IP 地址 |\n\n\n“Linux 上有哪些应用程序？”以及“我是否能在 Linux 上使用我喜好的应用程序和程序？”是关于 Linux 的两个最常见的问题。\n\
  \n虽然在某些情况下 Linux 上可以直接访问相同的程序，但在大多数情况下并非如此。最棒的部分是，Linux 拥有许多最常用 Windows 程序的替代方案。\n\
  \n本章将向你介绍 Linux 上一些优秀的应用程序。我们将查看 Microsoft Office、Photoshop、Internet Explorer、Windows\
  \ Media Player、Adobe Reader 以及其他软件替代方案。\n\n## 7.1. Microsoft Office 替代品\n\n生产力是每个操作系统或平台的本质特性。幸运的是，Linux\
  \ 拥有广泛的生产力应用，包括办公套件。\n\n大多数 MS Office 替代品可以下载并用于访问、修改和生成许多类型的文档，包括 `.xlsx`、`.docx`\
  \ 和 `.pptx`。\n\n### LibreOffice\n\n在 Linux 上，LibreOffice 通常被认为是最好的 Microsoft Office\
  \ 替代品。许多 Linux 及其发行版都将其作为标准办公套件自带。这部分是因为它是免费且开源的。这是因为它非常出色。它不是 Microsoft Office，但它是一个替代品，如果你习惯了微软的产品，起初习惯\
  \ Libre Office 可能会很困难。\n\n随着你逐渐习惯并越来越熟悉它，你会发现 LibreOffice 的功能同样丰富，甚至更多。LibreOffice\
  \ 是 OpenOffice 的分支，而 OpenOffice 在 LibreOffice 出现之前被广泛使用。由于它是开源软件，它拥有一个庞大的开发者社区。从本质上说，每个人都可以参与这项事业。LibreOffice\
  \ 支持插件，这确实让开发者的工作变得更简单。\n\n如果你觉得遗漏了某些内容，可以看看是否能找到包含你所寻找的功能的扩展程序。它与三个主流桌面操作系统以及 Linux\
  \ 都兼容。\n\n**优点：**\n1. 它是开源且免费的。\n2. 提供了完整的功能。\n3. 与 Microsoft Office 文件类型的兼容性极。\n\
  \n**缺点：**\n1. 风格过时了。\n\n### Apache OpenOffice\n\nOpenOffice 基于与 LibreOffice 相同的框架，并且与它有很多共同点。由于开发周期较长，它在开发方面落后于\
  \ LibreOffice。LibreOffice 分离的一个关键原因之一就是此。\n\nApache OpenOffice 是 Linux 上合理的 MS Office\
  \ 替代品。它经过了多年的开发和测试，并且像 LibreOffice 一样是跨平台的。它具有许多用于制作文档、演示文和表格的功能。这个替代办公套件除了传统的开放文档格式外还包含了\
  \ Microsoft Office 格式。\n\n这确保了你发布或从 Microsoft Office 用户那里获取的文档是兼容的。\n\n**优点：**\n\
  1. 用户界面熟悉且直接。\n2. 使用了 Apache 许可证。\n3. 支持多种语言。\n\n**负面方面：**\n1. 对 Microsoft Office\
  \ 文件格式的支持较少。\n\n## 7.2 MS 记事本替代品\n\nNotepad 是程序员和普通大众中标准的源码和文本编辑器，但它只兼容 Windows。然而，在\
  \ Linux 上，有一系列非常胜任甚至更优的替代方案。\n\n### Vim\n\n毫无疑问，Vim 是 Linux 上编程最实用的文字处理器（编辑器）之一。自从作为\
  \ `Vi` 出现以来，它获得了广泛的普及，并成为 Unix 世界最有影响力的编辑器之一。如果你正在为 Linux 寻找一个紧凑、革命性且可配置的记事本替代品，请务必考虑使用\
  \ `Vim`。多级撤销链、对各种插件和文件类型的全面支持，以及与许多工具的完全兼容，只是 `Vim` 的显著特征之一。\n\n**Vim 的一些显著特性：**\n\
  1. `Vim` 的多级撤销框架的独特之处在于，它让你对源代码拥有完全的控制权，同时也允许你进行实验。\n2. 它提供了脚本功能，并对几种计算机语言和文件格式提供全面支持。\n\
  3. `Vim` 极其安全，能够快速满足即使是最苛刻的用户的需求。\n4. 它与 `Emacs` 一样是最多功能的文本编辑器之一，允许以最小的精力进行广泛的更改。\n\
  \n### Gedit:\n\nGedit 像 Notepad++ 一样，是一个轻小但强大的代码编辑器，运行在 Linux、Microsoft Windows、Mac\
  \ OS 和 BSD 上。外部脚本、资源和代码片段编译等功能都得到了广泛支持。`Gedit` 带有对 `FTP`、`SSH`、`HTTP` 和 `WebDAV`\
  \ 等其他安全数据编辑协议的支持。如果你正在运行 Ubuntu 或其他基于 GNOME 的操作系统，`Gedit` 可能已经安装好了。\n\n**显著特性：**\n\
  1. `Gedit` 具有可定制性，提供了如 `HTML`、`C`、`C++`、`Python`、`XML` 和 `Perl` 等脚本语言。\n2. 与其他类似的记事本替代品相比，其查找和替换功能非常好，并支持正则表达式。\n\
  3. `Gedit` 拥有插件框架，允许用户添加额外功能以获得更交互的性能。\n4. 它发布于二十多年前，但现在仍在持续运行和维护。\n\n## 7.3 Internet\
  \ Explorer/Microsoft Edge 替代品\n\n尽管 Internet Explorer 传统上是 Windows 的标准网络浏览器，但 Linux\
  \ 用户可以访问各种补充且特别独特的浏览器。如果你厌倦了使用 Microsoft Edge 并需要浏览器来完成特定项目，无疑有备选浏览器供你选择。\n\n###\
  \ Brave:\n\nBrave 于 2016 年进入浏览器领域。Brave 是一种以流行的 Chromium 浏览器为中心的浏览器，具有强大的广告和跟踪拦截能力。得益于其独特的隐私特性，Brave\
  \ 在 2019 年成为日益受到青爱的浏览器之一。\n\nBrave 最近发布了基础注意力令牌 (`BAT`)，这是一种加密货币，用于补偿用户通过 Brave\
  \ 关注隐私的广告网络所展示的广告费用。用户还可以使用 `BAT` 为网站“打赏”，让 Brave 随机向他们访问的页面分发 `BAT`，或者持有 `BAT`\
  \ 以兑换现金。\n\n\n\n\n\n尽管该公司颠覆在线广告的尝试从长期来看失败了，但看到更多支持 Linux 的开源创新和应用仍然令人鼓舞。在 `brave.com`\
  \ 上，你可以找到安装说明。\n\n## Google Chrome\n\nGoogle Chrome 及其开源伴侣 `Chromium` 自 2008 年底发布以来，已迅速成为\
  \ `Ubuntu` 机器上 `Microsoft Edge` 最常见的替代品。`Chromium` 包含在 `Ubuntu` 软件包中，可以使用 `apt`\
  \ 或 `snap` 安装。Chrome 也可以直接从 Google 获取。Canonical 曾考虑将 `Chromium` 作为 `Ubuntu` 中取代\
  \ `Internet Explorer` 的标准浏览器，但 Firefox 到此保留了自己的地位。\n\n## 7.4 Photoshop 替代品\n\nAdobe\
  \ Photoshop 是一项运行在 `Windows` 和 `Mac OS X` 上的高端图像开发和设计程序。不可否认，几乎所有人都知道它。它是如此受喜爱。你也可以在运行\
  \ Windows 的虚拟机中配合 Linux 使用 Photoshop，但并并不是最佳体验。\n\n通常情况下，我们对 Adobe Photoshop 的替代品并不多。不过，在本章中，我们将介绍一些适用于\
  \ Linux 的最优秀的免费 Photoshop 替代品。\n\n### Pixlr\n\nPixlr 是一个免费但闭源的在线图像编辑程序，允许用户使用各种高级功能和数万种免费效果创造性地处理图像。\n\
  \nPixlr 的软件客户端兼容 `Android`、`Mac os`、`Windows` 和 `Ios`，它有约 5 亿活跃用户和超过 100 亿张修过的图像。尽管它还没有\
  \ Linux 应用，但 Linux 用户可以通过访问其在线版本来利用它的所有功能，在浏览器中生成并编辑美丽的图像。\n\n### Photopea\n\nPhotopea\
  \ 是另一个免费的在线编辑软件，允许你创建和处理位图图像。它在浏览器中运行，因此本地存储数据，即使你没有连接互联网也可以使用它。\n\nPhotopea 的程序旨在模拟\
  \ Photoshop 用户界面和许多功能，例如与掩罩、过滤器、纹理、形状、智能对象和按键绑定进行交互。还支持 `RAW`、`PSD`、`sketch` 和 `XCF`\
  \ 等其他标准图形格式。\n\n如果你想要可以在任何设备上运行的合法的免费编辑软件，选择 Photopea 绝不会错。如果你不喜欢显示的广告，也可以免费访问。\n\
  \n## 7.5 Movie Maker 替代品\n\nWindows Movie Maker 是视频制作与视频编辑被视为简单任务的主要原因之一，因为该软件允许开发者使用各种效果融合多个视频等。它的界面非常简单，几乎几乎任何用户都能在几秒钟内掌握其机制。然而，如果你认为\
  \ Movie Maker 在某些方面缺乏功能，包括当你需要额外功能或要在无法访问 Movie Maker 的系统上编辑视频时，这是可以理解的。但是对于视频处理，你可能需要一个更复杂的环境。以下是在使用\
  \ Linux 时你可以选择的几个 windows movie maker 替代品：\n\n### Shotcut\n\nShotcut 是一个用于 Linux\
  \ 的视频编辑应用，它的特殊之处在于其用户界面看起来像媒体播放器而不是编辑器。凭借其丰富的功能集合，该应用让视频编辑变得轻而易举。它足以应付大多数用途，但如果你需要更强大的功能（例如专业或高级的视频录制），这可能不是合适的替代品。由于其功能，它被认为是一款良好的\
  \ Linux 视频编辑软件。\n\n### Pitivi\n\nPitivi 也是一个开源且免费使用的视频编辑器。该应用专为简单的视频编辑设计。提供了剪辑、分割、修剪和片段对齐等简单功能。音频混合通过\
  \ `Pitivi` 曲线方法辅助。它还有使用热键和键盘快捷键的潜力。这允许音频和视频连接，这是一项巨大的收益。它是唯一支持 `MEF`（材质交换格式）格式的开源视频编辑器。Pitivi\
  \ 用户友好的 GUI 允许直接操作、拖放和原生主题导航。该程序可以转换为多种语言。它还附带了用户手册。\n\n## 7.6 Windows Media Center\
  \ 替代品\n\n以下是一些你可以在 Linux 上使用的 Windows Media center 替代品：\n\n### GeeXboX\n\nGeeXboX\
  \ 是一个功能全的 Linux 媒体中心操作系统，运行在笔记本电脑和嵌入式计算机上。它可以直接从 USB 盘运行或通过常规构建，并且占用空间小。\n\n最新版本\
  \ 3.1 仅为 160 兆字节。GeeXboX 是在旧机器上运行或从 USB 驱动器启动的理想选择。由于 GeeXboX 基于 `Kodi` 构建，你会熟悉其用户界面。\n\
  \n### OpenELEC\n\nOpenELEC 运行 `XBMC`，但从那时以后已变为运行 `Kodi`。只需要在空闲的硬盘分区上安装目标文件夹即可。完成后，你的\
  \ Linux 机器将运行 `Kodi`。\n\n连接到整个 `Kodi` 插件库，你可以根据喜好自定义 Linux 媒体中心。`Kodi` 还支持电视电视和\
  \ DVR（数字录像），为你提供完整的媒体中心环境。\n\n## 7.7 Adobe Acrobat Reader 替代品\n\nAdobe Reader 长期以来被认为是大多数桌面系统上最好的\
  \ PDF 阅读器和编辑器之一。Adobe Reader 的免费版包含文档读取和查看、打印和注释等功能。`PRO` 版本是一个高级版本，增加了 PDF 编辑、转换和签名等功能。\n\
  \n其他 PDF 阅读器为日常使用提供了相同的的核心功能。根据所需的功能数量，有许多 PDF 阅读器应用供选择。某些侧重于提供基本功能，而另一些则提供额外功能来增强功能。\n\
  \n### X-PDF\n\n它执行阅读器预期的基本任务。功能包括文本提取过程、PDF 到 Postscript 转换和其他工具。偏好图形用户界面的消费者可能会感到困惑。可以通过下载页面或\
  \ Linux 终端下载。\n\n### GNU GV\n\n它是一个简单的图形用户界面 (GUI) 框架，用于在 Linux 上显示 `Pdf` 文档。它通过允许用户主要通过用户界面与\
  \ `Ghost script` 解析器通信来运行。它还有一个过时的用户界面，不吸引那些需要鲜艳色彩图形的用户。然而，对于查看、打印和缩放等基本 PDF 任务，它是紧凑且实用的。你可以使用\
  \ `apt` 软件包管理器、Fedora 的 `dnf` 或 CentOS 的 `yum` 在基于 `Ubuntu` 的发行版上安装它。\n\n## 结论\n\
  \n这本书帮助你学会了如何自信地使用 Linux，从在你的电脑上安装它到编写你的程序。\n\n我们还希望这本书帮助你根据需求和应用选择最佳的 Linux 分发版，协助你完成日常计算任务。在本书结束时，你还应该学会了如何使用命令行在\
  \ Linux 环境中工作，以及一些让你的系统稳定的步骤。\n\nLinux 无疑是可用最可靠的操作系统之一——最棒的部分是它是免费的，所以你不需要支付额外费用来获取它，也不需要因为负担不起合法版而被迫接受冒版版。\n\
  \n\n\n\n使用 Linux 并不像初看起来那样需要多年的多年实践经验、大量的尝试错误、高级的计算机科学训练或深度的投入。只要你能告诉任何人如何找到你的办公室，你就能创建一个实现你所愿一切的\
  \ Linux 系统。本书的目的并不是将你变成一个完全的 Linux 极客（尽管那是 Linux 启蒙的巅峰），相反，它是向你展示构建运行良好的 Linux 系统的内部细节，并赋予你使用它的诀窍和能力。\n\
  \n这就是你开始 Linux 所需的一切。你只需要一个文本编辑器、Linux Shell 或集成开发环境，以及对某门编程语言的知识，外加一台相当、可靠的计算机和一个\
  \ Linux 发行版，就能成为一名 Linux 专业人士了。现在是时候测试你的技能并分析你到为止从这本书中中学到的内容了。\n\n我个人非常感谢你的投入和时间，请不要忘记在\
  \ Amazon 上留下评论，这有助于我更好地了解我的读者，并一定会改进我的下一部作品。\n\n预谢你的感谢。\n\n---\n\n嘿！不要错过这个！我确信你会感兴趣：![Image](img/image00131.jpeg)\n\
