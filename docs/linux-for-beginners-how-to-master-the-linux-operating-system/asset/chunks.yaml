  trans: '


    1. `VirtualBox` 需要内核头文件来创建插入内核的模块。在安装 `VirtualBox` 之前，你可能需要先安装这些包。请查看你的 Linux
    发行版文档，查找安装内核头文件的包。对于 openSUSE，它是 `kernel-default-devel`。


    2. 当包管理器提示时，请输入管理员密码。


    3. 你的桌面菜单系统中可能会添加一个新的 `VirtualBox` 条目。在 KDE 菜单中，openSUSE 将该菜单项放在 `Applications
    System`（应用程序系统）部分下。


    ![Oracle VM VirtualBox 主窗口欢迎页截图，用于开始创建某些虚拟机。](img/image00125.jpeg)


    4. 一旦你进入主窗口，就可以开始构建虚拟机了！


    # 在物理硬件上安装 Linux


    安装任何 Linux 发行版都有几个步骤，我们将简要地带你了解这些步骤，而不涉及过多的细节。然后，你可以按照每个版本的详细说明来安装你想要的内容。


    在安装任何 Linux 发行版之前，你将需要大量关于计算机硬件的知识。在开始安装 Debian 之前，请收集有关你的 PC 及其外围组件的信息。幸运的是，大多数
    Linux 安装程序都能检测并操作大多数 PC 外围设备。尽管如此，了解你的 PC 硬件也是个好主意，这样在安装过程中出现任何问题时你可以进行故障。


    ## 遵循重要步骤


    第一步是刻录用于分发的介质。任何带有刻录 DVD 或 CD 功能的设备都可以胜。（DVD 刻录机必须刻录 DVD；但 DVD 刻录机可以刻录 CD 和 DVD。）如果你已经有一个带有
    CD/DVD 刻录机的 Windows PC，通常可以使用该系统刻录 CD。


    确保你的计算机可以从包含介质的驱动器启动。虽然大多数新 PC 都可以直接从 DVD/CD 驱动器启动，但某些 PC 可能需要你的帮助。通常，PC 设置为优先从硬盘启动，更改启动设备顺序需要进入
    `Setup`。


    要让 PC 从 DVD 驱动器启动，在电脑启动时进入 `Setup`。进入 `Setup` 并选择启动设备的具体步骤因 PC 而异，但通常包括按下某个键，例如
    `F2`。电脑启动时会出现一条简短的消息，指示你按哪个键进入 `Setup`。在 `Setup` 中，你可以将 DVD 驱动器指定为启动系统。将 DVD 或
    CD 插入 DVD 驱动器，并在设置从 DVD 驱动器启动后重启电脑。


    第三步是从 Live CD 或 DVD 启动你的 PC 以尝试 Live CD 版本。否则，第三步是为 Linux 在 PC 硬盘上腾出空间。如果你使用的是
    Microsoft Windows，取决于你是想用 Linux 替换 Windows 还是保留 Windows 和 Linux 发行版，这一步可能具有挑战性，也可以简单。


    请注意，你当前的操作系统使用了整个硬盘来安装 Linux，而不删除（或干扰）Windows。你需要对硬盘进行分区（划分），以便 Windows 运行在一侧，Linux
    运行在另一侧。分区是一个令人生胆畏的操作，因为你面临擦除硬盘上任何内容的风险。在进行任何重大更改之前，请务必为你的数据创建备份。


    你可以使用分区工具在硬盘上构建 Linux 安装程序将使用的分区。如果你的计算机运行的是最新的 Windows 10 或更旧版本的 Windows，可以考虑购买商业级硬盘分区软件。但你可以使用一个名为
    `QTParted` 的 GUI（图形用户界面）工具（它随 Knoppix 和许多其他发行版一起提供）来重新划分 PC 的硬盘分区。


    注意，某些 Linux 发行版安装程序（如 openSUSE）将通过缩小 Windows 分区来自动构建 Linux 分区。在这种情况下，你不需要使用 `QTParted`
    等方法缩小硬盘上的 Windows 分区。


    在硬盘上为 Linux 留好分区后，你就可以从所选发行版的 DVD 启动计算机并开始安装 Linux。安装过程中涉及若干措施，它们在不同版本之间有所不同。既然你已经走了这一步，现在应该是顺风水了。如果你只需通过安装屏幕，将在一两个小时内完成。大多数安装程序（如
    openSUSE 界面）都有图形用户界面，引导你完成每个阶段。


    在安装过程中，再次划分硬盘是一个关键步骤，但这次你只需要使用你构建的额外分区即可。


    在完成几个设置步骤（例如设置网络和时区并让安装程序完成剩余的安装工作）后，选择要安装的软件包。某些发行版通过消除软件选择阶段并安装默认软件包集合来简化这一过程。


    完成安装后重启 PC。在自动配置运行之前，你需要重启。


    当你首次启动 Linux 时，可以完成一些额外的配置措施并安装额外的软件包。


    ## 分析你的系统硬件


    如果你担心 PC 无法运行 Linux，在开始安装 Linux 之前，请记住以下一些关键组件：


    - **DVD 驱动器**：你的计算机必须有一个 DVD 驱动器（DVD-ROM 或 DVD 刻录机）并能够从它启动。使用何种模型没有关系。重要的是 DVD
    驱动器连接到计算机的方式。大多数新 PC 上，DVD 驱动器连接到硬盘控制器（`IDE` 或 `ATA`）。外部 DVD 驱动器可能会连接到 `USB` 端口。在
    Linux 中，任何 `IDE/ATA` 或 `USB` DVD 驱动器都可以工作。

    - **硬盘**：Linux 支持所有 `IDE` 光驱。`SCSI`（小型计算机系统接口）是 Linux 支持的另一种硬盘控制器。你需要大约 `5GB`
    的硬盘空间来舒适安装和运行 Linux。查看 Linux 的 Live CD 版本不需要硬盘空间。

    - **键盘**：配合 Linux 和 `X Window System`，任何键盘都可以工作。

    - **显示器**：显示器不是必不可少的，但它必须能够显示显卡的屏幕分辨率。像素（水平和垂直）决定了屏幕分辨率（例如 `1024 x 768`）。安装程序可以检测许多现代显示器。如果安装程序没有检测到你的显示器，你可以选择具有特定分辨率的通用显示器模型（例如
    `1024 x 768`）。你也可以通过显示器的品牌和型号识别它，这些可以在显示器的背面找到。

    - **鼠标**：安装软件可以检测鼠标。配合 Linux 和 `X Window System`，任何鼠标（`PS/2` 或 `USB`）都可以工作。

    - **网卡**：虽然网卡并不是所有 PC 的标准配置，但它们变得越来越常见。无论你的 PC 是否有 `Wi-Fi` 或有线网卡，安装程序都应该识别并使用它。如果你遇到问题，尝试找到网卡的品牌和型号，以便在网上查询
    Linux 是否支持该卡。

    - **处理器**：只要处理器速度超过 `700 MHz`（兆赫）或 `GHz`（吉赫），就没有关系。过去几年生产的大多数处理器速度远高于此。根据一般原则，越快越好。其他
    Intel 兼容的处理器（如 `AMD` 和 `VIA` 处理器）也可以运行 Linux。

    - **内存 (RAM)**：RAM 指的是计算机可用的内存。内存越大，处理速度越快。要安装 Linux 和 `X Window System`，你至少需要
    `512MB` 的 RAM。某些发行版有更高的最低内存要求，为了舒适地运行 GUI 桌面，你可能需要更多内存。


