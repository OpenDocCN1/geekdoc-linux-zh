    ## 通过这本全面的指南，深入探索加密货币和区块链的世界！


    区块链和加密货币是席卷全球的现象的一部分。它们是一股现代创新浪潮，已经在重塑行业、社会和政治关系以及其他任何形式的价值交换。


    尽管如此，它们看起来是如此陌生，似乎没有人了解它们的任何事情。主流媒体充斥着关于加密货币的谜团、神话以及对许多问题的部分答案。


    加密货币究竟是什么？


    区块链技术是如何工作的？


    它们与美元或欧元等现实世界货币有何联系？


    如何可以获得它们？


    本书弥补了关于区块链的纯技术性书籍与主要关注实际应用、预期经济效应讨论以及未来愿景的研究型书籍之间的鸿沟。


