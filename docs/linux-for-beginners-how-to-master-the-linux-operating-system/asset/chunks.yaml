  trans: '


    # 1. 预装核心工具


    Canonical 是创建并支持 Ubuntu 的组织，同时也为该操作系统提供企业级支持。桌面版（Desktop）、服务器版（Server）和核心版（Core）是三大型号。其他“衍生版”（spins）包括
    Edubuntu、Lubuntu、Kubuntu 等，它们是为了公共教育设计的。除了授权版本外，目前还有约 40 种第三方版本。


    Ubuntu 每年发布两次。四月的更新包含两年一次的“长期支持”（Long Term Support）更新。这些版本提供五年的免费帮助，涵盖错误修复和安全保护更新。普通的“过渡性”版本提供为期九个月的支持，但从一个版本升级到下一个版本非常简单。


    如果你不喜欢 Ubuntu 的界面，Linux Mint 是基于 Ubuntu 构建的，专为初设计，并包含 `GNOME`、`Cinnamon` 和 `KDE`
    版本。在功能方面，Linux Mint 与 Ubuntu 大小相同。


    ## 2.4 Linux Mint


    毫无疑问，Linux Mint 是最适合新手的基于 Ubuntu 的发行版之一。是的，它是基于 Ubuntu 构建的。你可以获得 Ubuntu 带来的优势。然而，它提供了多种工作区环境，包括
    `MATE`、`Cinnamon` 和 `Xfce`，而不是 `GNOME` 平台。实际上，在其他几个领域，Linux Mint 优于 Ubuntu。


    这不仅关乎典型的用户体验（这对 Windows 操作系统来说是一个加项），它在技术规格有限的情况下提供了卓越的生产力，特别是在使用 `MATE` 或 `Xfce`
    桌面环境时。


    它还利用了 Ubuntu 的应用程序仓库。你无需担心软件安装问题。


    Mint 20 有三个桌面版本：`MATE`、`Cinnamon` 和 `XFCE`。它以 Ubuntu 20.04 LTS 为中心。Mint 不再支持 32
    位版本，仅提供 64 位版本。Linux Mint 20 基于 Linux 内核 `5.4`，包含了对 `NVIDIA` GPU、`AMD Navi 12`
    和 `Intel` CPU 增强的兼容性。整个用户界面也经过了更新，拥有新的图标、新的样式和数字增强的任务栏。


    新功能包括在局域网（LAN）中运行的文件共享软件 `Warpinator`，以及用于 HiDPI 显示器的分比例缩放功能，可以获得更清晰、更锐利的图像。其他应用程序包括
    `Firefox`、`Timeshift`、`Audacious` 音乐播放器、`LibreOffice` 和 `Thunderbird`。


    Linux Mint 是一个非常类 Windows 的操作系统发行版。因此，如果你不需要特定的用户体验，Linux Mint 是一个很好的选择。


    ## 2.5 MX Linux


    它正在创建一个由来自 `antiX` 和 `MEPIS` 社区的活跃用户组成的社区。目标是创建一个中间、方便的 Linux 发行版，结合这两个环境的最佳特性。


    最新版本（`MX 17.1`）可以在 MX 网站下载 32 位或 64 位架构的版本。已经有一个更积极的消息：对于当前的发布 ISO 文件，可以下载定期更新。这些是全新的
    ISO 镜像，已安装最新的改进，因此你无需在新安装后浪费时间进行升级。


    尽管没有使用流行的 `Mint (LMDE)` 或 `calamares` 安装程序，MX Linux 仍然使用了自己的安装程序。


    平台是 `Xfce 4.12`，但它有一套设计合理且直接的设置。我们倾向于将面板放在屏幕左侧，这可以充分利用可用屏幕。面板没有设置为自动隐藏，而大多数人在屏幕较小的笔记本电脑上更喜欢这样做。没问题，右键点击窗口，进入
    `Panel`（面板），然后 `Preferences`（偏好），从菜单中选择 `auto-hide`（自动隐藏）。


    后台运行着 `Conky` 提供日期/日期/负载详情，但如果你不需要它，收藏夹菜单中仍有 `Conky Switch` 功能。


    在菜单收藏夹中，还有一个 `MX Tools` 工具程序。这让我们想起了 `MEPIS`，这是一个实用且易于使用的工具程序，允许你控制广泛的系统设置。


    这里有几个你无法在其他平台上找到的独有特性。为了微调你的系统，`Tweak` 和 `Conky config` 工具非常实用。


    还可以安装驱动程序（`Nvidia`）和编码器，对于那些不想与 `Synaptic` 命令行斗争的人，还有一个 MX 特有的开发工具包。


    ## 2.6 Open SUSE


    SuSE 曾是一个独立的 Linux 发行版，后来被 Novell 收购。随后 Micro Focus 收购了它。从那以后它们被频繁买卖，现在的总价值约为
    25 亿美元。


    `SUSE Leap` 是一个里程碑式的发布，面向计算机用户以及企业设计与部署。OpenSUSE 倡议是一个进步且健壮的协作计划，提供两个主要的 SUSE
    子公司：`SUSE Enterprise` 和 `SUSE Leap`。它适合开源程序员和数据管理员。


    另一方面，`SUSE Tumbleweed` 是一个滚动更新版本，包含了最新的软件框架和 IDE。得益于办公程序、`GCC` 解释器和内核等最新组合包的出现，`TumbleWeed`
    对于每个高级用户或计算机程序员来说变得容易得多。


    OpenSUSE 依赖 `Yast` 软件包，程序员和软件操作员倾向于使用它来处理应用程序。


    SuSE 像 `RedHat` 一样，拥有完整的商业版本和生产版本。SuSE 是一个面向企业的优秀全能者，并与 `SAP` 等公司有赞助和企业合作。Red
    Hat 和 SUSE 共享的不仅仅是系统。它最初基于 `Red Hat`，因此使用相同的基于 `RPM` 的包控制系统，但它已经进化到可以被视为具有其自由度的发行版。它的
    `YAST` 管理信息系统使得服务设置变得简单。


    OpenSUSE 是 SuSE 免费版的名称。OpenSUSE 有几个独有特性，即 `Tumbleweed`——一个前沿的应用程序软件系统。它包含了几个开发工具，例如为交互式软件开发设计的
    `openQA`，以及生成用于在实际设备安装的 Linux 可视化的 `Kiwi`。默认情况下，OpenSUSE 使用 `KDE` 桌面。


    ## 2.7 Fedora


    Fedora 长期以来被认为是领先的易用操作系统之一，这归功于它的易用性和预装应用程序，这些程序可以帮助学者快速上手。


    它是一个健壮且适应性强的操作系统，为台式电脑、笔记本电脑、服务器甚至 IoT 环境而设计。Fedora 基于 `Red Hat` 构建，在公司进入企业流程之前作为测试场。它通常用于开发和教育，对程序员和学习者非常有帮助。


    '
- fmt: '

    As its name implies, the stable version is rock-solid and comes with maximum security
    protection but does not come with the most up-to-date software programs. It is,
    however, suitable for web servers due to its reliability and quality, and it also
    qualifies for more moderate computer users who are not concerned with providing
    the most up-to-date software programs. Debian Stable is the default system on
    most systems.


    Debian Testing is a continuous update that contains the most up-to-date software
    not yet integrated further into a stable release. This is the subsequent stable
    Debian release''s development phase. It usually prone to instabilities and is
    easily broken. It also does not receive security updates promptly. `Bullseye`
    is the most recent Debian Testing release.


    Debian''s unstable distribution is still in active development. It is an innovative
    distribution that serves as an ideal forum for programmers who actively contribute
    to the code before it reaches the ''Testing'' level.


    Millions of people are using Debian because of its extensive package repositories
    and its reliability, particularly in production systems.


    ## 2.9 Arch Linux


    Arch Linux is a quirky Linux distribution compact and portable intended for experienced
    users or Linux specialists concerned with what is mounted and operating. It allows
    users to customize or configure the system according to their preferences. Arch
    is designed for people who are well-versed in the workings of Linux.


    Unlike most Linux distributions, Arch Linux is not generated from a parental distribution
    such as Debian or Red Hat. Since it is built on a primary (yet stable) foundation,
    it remains alone and is respected by techies for lightning-fast Linux distribution.
    All else is added via the `Pacman` packaging process.


    Arch is a continuous release, which means it is all updated. All you must do is
    refresh the modules in the interface. The standard package administrator is `Pacman`,
    and it makes use of the Arch User Repository, which is a platform for installing
    software programs. The most recent update is 2020.09.01.


    ## 2.10 Slackware


    Starting in 1993, Slackware was most likely the first accurate Linux distribution.
    It employs `.tar.gz` packages instead of the more familiar `YUM` or `APT` frameworks,
    identical to Arch. If you are a more experienced user who doesn''t want to compile
    anything, Arch might be for you, as it still allows for equal rates of customization
    as Slackware.


    Slackware, centered mostly on Soft-landing Linux Distribution, has served as the
    foundation for several other Software packages, most prominently the first variants
    of SUSE Linux distros, and is the earliest still-maintained release.


    Slackware strives to be a much more "Unix-like" distribution by focusing on design
    reliability and convenience.


    It attempts not to predict usage cases or exclude consumer decisions by making
    a few changes appropriate to application packages from upwards. Unlike most mainstream
