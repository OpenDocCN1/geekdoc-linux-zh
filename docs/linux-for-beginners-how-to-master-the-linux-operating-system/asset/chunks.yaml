    由于虚拟化引入了开销，请不要假设它们的运行速度像在实际设备上挂载接口那样快。虚拟机在运行挑战性性游戏或其他需要大量视觉效果和处理器速度的应用时并不理想，因此它们并不是在
    `Mac OS X` 或 `Linux` 上运行 `Windows` 游戏的最佳方式，除非这些游戏较旧或对图形性能要求不高。


    公司引入服务器虚拟化是为了更好地利用物理服务器的计算资源，减少对服务器集群的依赖，并节省数据中心的资源。我们今天所熟知的 `VMs` 在过去的 15 年中变得流行。每个应用程序不再需要独立的服务器硬件，因为它们可以在具有各种
    `OS` 规范的特定主机上运行。


    虚拟机可以分为两种：进程虚拟机，用于隔离单个功能；以及虚拟系统虚拟机，用于将应用程序或系统与计算机系统隔离。`NET Framework`、`Java` 虚拟机和
    `Parrot` 虚拟机都是进程虚拟机。


    `Hypervisors`（虚拟机程序）被`system VMs` 用中间人，允许软件访问系统资源。`Intel/Linux Foundation (Xen)`、`VMware
    (ESX/ESXi)`、`Oracle (Oracle VM Server for x86 and MV Server for SPARC )` 和 `Microsoft`
    都是虚拟机程序领域（`Hyper-V`）的顶级参与者。


    数字机器可以用于桌面电脑。一个在实际 `Mac` 硬件上使用虚拟 `Windows 10` 版本的 `Mac` 用户是最明显的例子。


    ## 虚拟机的实际用途


    `Virtual Machines` 有多种用途。以下列出了一些：


    - **尝试不同平台实验**：在虚拟机中安装不同的 `Linux` 发行版，允许你尝试它们并学习它们是如何运行的。在虚拟机 `Windows 10` 中运行
    `macOS` 可以让你熟悉你可能想要全职使用的各种操作系统。

    - **整合服务器**：拥有多台服务器的企业可以将某些服务器虚拟化并在它们在单台设备上执行。由于每个 `VM` 都是一个自包含的隔间，它避免了在同一部 `OS`
    上运行多个服务器带来的安全问题。虚拟机还可以从一台物理服务器迁移到另一台物理服务器。

    - **使用需要旧操作系统的程序**：如果用户的关键应用程序需要 `Windows XP`，用户可以在安装了 `XP` 的虚拟机中运行它。这使用户可以使用仅与
    `Windows XP` 兼容的软件而无需安装它。这意义重大，因为 `Microsoft` 不再支持 `Windows XP` 了。

    - **在不同平台上测试应用程序**：你可以在 `VM` 中下载每个操作系统，以评估应用程序在多个平台上的性能。

    - **使用为不同操作系统创建的软件**：`Linux` 和 `Mac os` 用户可以在 `VM` 中运行 `Windows`，以便在他们的桌面上运行 `Windows`
    应用程序而无需担心兼容性问题。遗憾的是，游戏是一个问题。虚拟机系统会增加开销，`VM` 中的 3D 游戏无法流畅运行。


    人们可以在特定设备上执行多个 `OS` 实现，因为程序与实际主机计算机隔离，从而提高了效率，降低了资金成本和物理空间。虚拟机的另一个优点是它们可以运行遗留应用程序，减少或消除了将旧程序迁移到新操作系统的需求和费用。


    开发者使用虚拟机（`VMs`）在安全的虚拟化环境中测试应用程序。它还可以帮助隔离可能感染特定 `VM` 案例的勒索软件。由于 `VM` 内的恶意软件无法与主机系统交互，因此无法造成太大伤害。


    虚拟机也有一些缺点。在单个物理主机上运行多个虚拟机可能会导致性能问题，特别是当符合特定应用程序的架构规范时。尽管与计算机系统相比，这使得它们的性能不那么强大。大多数的
    IT 操作使用虚拟结构和物理结构的混合体。


    虚拟化软件是在虚拟机中运行数据库的关键。虚拟化软件有多种选择。`Linux` 领域最常见的有：


    1. `KVM`：它是一个与 `Linux` 内核直接集成的开源计划。它只能在具有虚拟化能力 CPU 的系统上运行。

    2. `VirtualBox`：由 `Oracle` 赞助的项目，安装在任何 `Linux` 发行版中，无论内核或 CPU 类型。

    3. `VMware Server`：这是由 `VMware` 提供的软件包，运行在 `Windows`、`Mac OS X` 和 `Linux` 主机上，提供免费版和商业版。


    这些虚拟化软件包安装在 `Linux` 主机上，允许用户同时访问多个虚拟网络操作系统，如 `Linux` 和 `Windows`。


    在本章中，我们将向你展示如何设置和使用 `Oracle VirtualBox`，以及如何作为虚拟机运行 `Linux` 工作空间。


    ## 安装虚拟机


    第一步是安装 `VirtualBox`。该包可能在发行版软件仓库中，取决于你的 `Linux` 发行版。`VirtualBox` 软件套装包含在 `Ubuntu`
    和 `OpenSUSE` 的标准软件仓库中。


    使用 `Ubuntu Software` 程序或 `openSUSE Software Center` 在你的设备上安装它。安装完成后，该软件包将出现在设备启动器中。


    如果你的 `Linux` 发行版不包含 `VirtualBox`，或者你只想确保你拥有最新的更新，你可以直接从 `VirtualBox` 网站获取并在那里安装。`VirtualBox`
    网站有几个流行的 `Linux` 发行版的安装包（包括 `Ubuntu` 和 `OpenSUSE`）。在下载程序时，为你的 `Linux` 发行版选择正确的
    `VirtualBox` 版本至关重要。


    从网站下载并安装 `VirtualBox` 工具包的过程是：


    1. 在网络浏览器中访问 `http://www.virtualbox.org`。

    2. 尽管 `Oracle` 赞助 `VirtualBox` 项目，但它有自己带有下载文件、文档和社区论坛的网站。

    3. 点击主网页左侧的 `Downloads` 选项卡。

    4. 确定 `Linux` 平台最新版本的 `VirtualBox` 版本。

    5. 这适用于你所选择的主机站点。其他操作系统（如 `Microsoft Windows`）也可以在 `VirtualBox` 程序内部运行。

    6. `VirtualBox` 适用于 `Microsoft Windows` 和 Apple 的 Mac OS X`。如果你担心在现有的 `Windows`
    或 `Mac` 系统上安装 `Linux`，可以使用 `VirtualBox` 在现有系统上的虚拟机中运行 `Linux`。正如本章提到的，在你的 `Windows`
    或 `Mac OS X` 环境中在 `VirtualBox` 内作为虚拟机运行 `Linux` 发行版，与在 `Linux` 主机环境中运行是一样的。

