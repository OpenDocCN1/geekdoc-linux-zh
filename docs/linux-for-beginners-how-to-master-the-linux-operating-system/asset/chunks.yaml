    # Linux Shell


    A command shell, also known as a command interpreter, is a program that sends
    the commands to the operating system and application programs and receiving their
    responses. It compares to `command.com` in MS-DOS or `cmd.exe` in Windows in terms
    of tasks, but the Linux shell is incomparably more affluent in terms of functionality.
    Scripts are small programs written in the command shell language that perform
    sequential operations with files and their data.


    You can see a command line prompt – a line ending in `$` – after you have registered
    in the system by entering a username and password. This symbol will represent
    the command line. You could get to the command line on any virtual text console
    if a graphical user interface were configured to start at the system boot during
    the installation. You can do this by pressing `Ctrl-Alt-F1` - `Ctrl-Alt-F6` or
    by using a terminal emulator program like `xterm`.


    The shells listed below are available. Depending on the distributor, they can
    differ:


    ## Available Shells


    ### Bash

    The most famous Linux shell. It can connect to the names of commands and files,
    maintains a command history, and allows you to edit them.


    ### pdkdh

    On UNIX shell systems, the Korn shell clone is well-known.


    ### sash

    This shell is unique because it does not depend on any shared libraries and contains
    simpler versions of some of the most commonly used utilities, such as `al`, `dd`,
    and `gzip`. The sash comes in handy when recovering from machine crashes or updating
    the versions of the most critical shared libraries.


    ### tcsh

    Upgraded version of C shell.


    ### zsh

    This is the most recent shell on the list. It includes advanced features such
    as command argument autocompletion and a slew of other features that make working
    with the shell much more convenient and practical. However, since all `zsh` extensions
    are disabled by default, you must read the documentation and allow the features
    you need before using this command shell.


    `Bash` Bourne Again Shell is the shell by default. Use the command `echo $ SHELL`
    to see which shell you are using.


    Shells vary not only in terms of functionality but also in terms of command syntax.
    If you are a new user, we suggest that you start with `bash`. Additional examples
    explain this area''s work.


    ## Bash Shell


    The command line in `bash` consists of the command''s name followed by keys (options),
    which alter the command''s actions. Keys usually start with the character `-`
    or `--` and consist of only one letter. After the command, arguments (parameters)
    – the names of the objects on which the command must be executed – can be added
    (often the names of files and directories).


    After pressing the `Enter` key to finish entering a command, the command is moved
    to the execution shell. There may appear messages about the command execution
    or errors resulting from the command execution on the user''s Terminal. The appearance
    of the following command line prompt (ending with the `$` character) means that
    the command has been completed, and you can enter the next one.


    In `bash`, many techniques make typing and editing the command line simpler. You
    may, for example, use the keyboard to:


    | Key | Description |

    | :--- | :--- |

    | `Ctrl-A` | Return to the start of the line. By pressing the `Home` key, you
    can achieve the same result. |

    | `Ctrl-u` | This command should remove the present line; |

    | `Ctrl-C` | Abort the current command''s execution. |


    You may use the symbol `;` to enter several commands in a single line. `bash`
    keeps track of all commands performed, making it simple to go back and repeat
    or edit one of them. Pick the desired command from the history: the `up` key displays
    the previous command, the `down` key displays the down command, and `this` key
    displays the next command. To find a particular command among those that have
    been executed without going through the entire storey, press `Ctrl-R` and enter
    a keyword used in the command you are searching for.


    The commands documented in history are numbered—type `:` to run a particular command.


    `!` command number


    If you type `!!`, the last command you typed would be executed.


    On Linux, software and command names can be excessively long. Fortunately, `bash`
    will finish the names for you. You may complete the name of a command, program,
    or directory by pressing the `Tab` key. Let''s say you want to use the `bunzip2`
    decompression program as an example. To do so, type:


    ```bash

    $ bu

    ```


    Then click the `Tab` key. If nothing happens, there are a few other options for
    completing the command. By pressing the `Tab` key once more, you will get a list
    of names that begin with the letter `bu`. The framework, for example, contains
    these programs: `buildhash`, `builtin`, and `bunzip2`:


    ```bash

    $ bu

    buildhash builtin bunzip2

    ```


    ```bash

    $ bu

    ```


    Click Tab after typing `n>` (bunzip is the only name with the letter `n` as the
    third letter). The shell will complete the remaining part of the name for you,
    and all you have to do now is to press “Enter” to execute the command.


    `bash` searches directories specified in the `PATH` system variable for programs
    invoked from the command line. By default, the directory, denoted by `./`, is
    not included in this directory listing (dot slash). You must use the command `./prog`
    to run the program from the directory.


    ## 4.4 Shell Scripting


    Frequently, the information in your shell prompt is useful. If you are logged
    in as `rich` on Ubuntu''s system testbox, for example, your prompt will look like
    this:


    ```bash

    rich@testbox:~$

    ```


    You are in the “Home” folder, as indicated by the tilde character (`~`). The dollar
    sign means the `bash` shell is ready for me to type a command.


    Before you go through some of the shell''s features, we want to tell you about
    another way to start a shell session. You may not use it often, but it may come
    in handy at some stage. Foremost, keep in mind, your prompt is contained within
    the GUI desktop.

