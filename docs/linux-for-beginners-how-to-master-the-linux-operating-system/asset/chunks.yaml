  trans: "\n\n1. 在某些计算机上，闪存驱动器可能隐藏在启动 BIOS 的硬盘部分。选择 `Boot Hard Drives`，将主硬盘改为存储介质，然后确保\
    \ `USB` 是 `Boot Device` 下的第一个选项。如果从 USB 启动的选项为 `Enable/Disable`，请选择“Enable”，进入启动设备顺序，并将\
    \ `USB` 选择移动到硬盘选择上方。\n1. 退出 BIOS 设置并保存更改。\n\n工作站将在在此阶段重启，如果你的 `USB` 驱动器已插入，Fedora\
    \ 应该会启动。\n\n如果单行条目 `Boot Error` 且没有发生其他情况，请按照制造商的说明更新设备 BIOS。\n\n## 定期使用最新驱动器\n\
    \n当机器启动时，Fedora 环境的加载速度比 Live CD 环境快得多。`USB` 驱动器上生成的新文件是可见的，并且可以访问其他设备。“安装到硬盘”图标会保留在屏幕上，允许你需要时快速且永久地切换到\
    \ Fedora。\n\n虽然使用操作系统不需要连接互联网，但我们强烈建议这样做，因为大多数用户都希望下载额外的程序来进一步测试操作系统的功能。\n\n恭喜你取得了成就！你现在可以开始使用\
    \ Linux 了。\n\n## 3.3 在 Windows 10 虚拟机上安装 Linux\n\n在访问你的虚拟世界之前，你必须完成一些额外的虚拟机设置。由于\
    \ `New Virtual Machine Wizard` 创建的是一个通用世界，你可能想先对其进行自定义。本节将解释如何配置虚拟机以及如何安装你的操作系统。\n\
    \n### 调整设置\n\nVirtualBox 为你构建的每个虚拟机收集配置选项。VirtualBox 在虚拟机中模拟这些配置设置中定义的内容。\n\n\
    选择左侧的虚拟机项目，并点击工具栏上的“Settings”图标以访问配置设置。出现 `Settings` 对话框。\n\n在 `Settings` 对话框的左侧，通过带有文本的图标显示了十个配置类别：\n\
    \n![VirtualBox 设置对话框的截图，显示 10 个设置类别，描述为左侧带有文本的图标。](img/image00126.jpeg)\n\n- **General**（通用）：`General\
    \ Setting` 定义虚拟机的名称和操作系统类型。你将在 `Advanced` 选项卡上启用剪板，以便在主机和客系统之间复制和粘贴文本、文件和目录。\n\
    - **System**（系统）：控制虚拟机的 CPU 和内存分配。\n- **Display**（显示）：此组件管理虚拟机的视频内存和虚拟显示器。\n-\
    \ **Storage**（存储）：控制对虚拟硬盘和 DVD 驱动器的访问。你构建的虚拟硬盘应该在这里提到，但如有必要你也可以添加更多。你也可以从这里让虚拟机访问主机的\
    \ DVD 驱动器。VirtualBox 的另一个酷功能是直接在客设备上安装 `ISO` 文件。你现在可以直接从 `ISO` 映像安装 Linux 发行版，而无需将其刻到\
    \ DVD。\n  如果你将从 DVD 安装虚拟机操作系统，请确保在 `DVD` 部分挂载 DVD 驱动器。遗憾的是，该选项设计上并不可用。\n- **Audio**（音频）：控制对主机系统声卡的访问。你可以为\
    \ Linux 主机选择 `ALSA` 驱动程序，以便虚拟服务器将声音传输到主机 Linux 音频系统。\n- **Network**（网络）：虚拟机将链接到主机网络，你可以在那里配置该功能。在虚拟机和主机设备之间，默认的\
    \ `NAT` 选项生成一个内部网络。这在虚拟机和网络其余部分之间建立了屏障，防止其他设备访问虚拟机。如果你正在测试操作系统并希望将其隔离在网络其余之外，这非常有用。如果你想让虚拟机完全访问你的局域网，请选择\
    \ `Bridged` 网络选项。虚拟服务器的网络接口随后可以链接到主机服务器上的网络。\n- **Serial Ports**（串口端口）：如果打开，则控制对主机系统串口通信端口的访问。\n\
    - **USB**：列出你想要在客系统使用的主机系统 `USB` 设备列表。\n- **Shared Folders**（共享文件夹）：此功能允许你构建一个从主机系统和虚拟机都可以访问的文件夹。这在两个环境之间创建了一个简单的文件传输通道。\n\
    - **User Interface**（用户界面）：选择你想为虚拟机电源启用的菜单栏功能。\n\n自定义完设置后，点击“OK”保存设置并返回 VirtualBox\
    \ 主窗口。你现在已准备好安装应用程序了！\n\n### 安装操作系统\n\n既然虚拟机已为你的新操作系统进行了自定义，你现在可以开始了。但是，在开始之前，请双击检查是否拥有安装所需的\
    \ DVD 或 `USB` 驱动器。获取后，你可以按照以下步骤进行安装：\n\n1. 将操作系统安装 DVD 插入主机的 CD/DVD 播放器，或使用虚拟机的\
    \ DVD 驱动器访问 `ISO` 映像文件。如果你的桌面默认打开了文件管理器程序，你可以在继续之前将其关闭。\n   光片安装在设备上并显示为桌面图标是正常的。\n\
    2. 从左侧列表中选择你想要在上面安装操作系统的虚拟机。\n3. 选择工具栏上的 `Start` 图标。这会开启虚拟机，就像你打开了硬件电源开关一样。出现\
    \ `VirtualBox` 中的控制仿真窗口。此窗口包含了通常显示显示器上的所有内容。\n\n![VirtualBox 控制仿真窗口的截图，窗口底部显示一组图标，指示虚拟机正在访问系统上的硬件。](img/image00127.jpeg)\n\
    \n4. 当虚拟机访问设备上的硬件时，窗口底部的图标会指示这一点。图标有：\n   - 硬盘\n   - DVD 播放器\n   - 音频输入和输出\n \
    \  - 网络链接\n   - USB 链接\n   - 文件夹交换\n   - 视频内存\n   - 正在录制\n   - CPU 状态\n\n在浏览器的右下角可以找到鼠标图标、钥匙图标和\
    \ `Right Ctrl` 字样。当你启动虚拟机时，`VirtualBox` 会接管主机系统的键盘和鼠标，并将其交给虚拟机。按下键盘右侧的 `Control`\
    \ (`Ctrl`) 键将控制权交回主机设备（例如，同时运行另一个程序）。将鼠标放在控制仿真窗口内的任何位置并按下 `right Ctrl` 键即可重新获得虚拟机的控制权。\n\
    5. 完成你正在使用的操作系统的安装。\n6. 使用 DVD 或 `ISO` 文件启动虚拟机（参考 `Settings` 对话框的 `General` 部分）。只需观察操作系统的常规安装程序。操作系统会检测你在虚拟机中安装的仿真硬件。\n\
    7. 安装完成后，重启虚拟机。\n\n大多数操作系统 (OS) 都内置重启功能。如果发生这种情况，`VirtualBox` 控制仿真窗口会检测到重启并保持打开，允许你观察重启过程。\n\
    \n![默认 Ubuntu 页面的截图，在打开的 openSUSE VirtualBox 窗口中运行着良好的操作系统。](img/image00128.jpeg)\n\
    \n结果是在你的虚拟机内部运行一个正常的操作系统。\n\n## 3.4 在 MacOS 虚拟机上安装 Linux\n\n你的 Mac 拥有强大的性能、长续航能力和高耐用性。Mac\
    \ 的硬件是不可比拟的，使其成为运行 Linux 的强大机器。\n\n"
- fmt: '

    Linux gives new life to outdated Macs that can no longer get macOS updates. Rather
    than having your old MacBook Pro become an unnecessary paperweight, upgrade to
    the new version of Linux and run the system for years.


    Both Linux and macOS are enabled on your Mac when you use a dual boot system.
    When your computer is booting up, hold the option to pick on what operating system
    to utilize. The essential differentiator between a virtual machine and a dual
    boot system is that dual-booting allows you to use only one operating system simultaneously,
    but it provides better performance.


    If you do not intend to use macOS anyway, you might like to replace it with Linux.
    That way, the machine files do not eat up any of your storage.


    However, if you reconsider, restoring macOS is complicated and time-consuming.
    As Linux writes over the macOS Recovery partition, this is true. If you are sure
    that you do not want to use the dual-booting option and go for the Virtual Machine
    setup, skip the Partition phase and proceed to the installation process.


    1. A flash drive with at least 2GB of storage is needed to run Linux on your Mac.
    To mount `Ubuntu` on the flash drive, you will need to erase it first. Please
    ensure you have backed up any essential data first.

    2. Link your Mac to the internet with an Ethernet adapter. This is critical because,
    without third-party drivers, your Wi-Fi can not work in `Ubuntu`. In the same
    way, iMac users can get a USB keyboard or mouse if Bluetooth fails.

    3. To have a dual boot, try to ensure you have enough available space on your
    hard drive.


    ![image9.png](Images/image00129.jpeg)


    4. Verify that you have at minimum 25GB of free space by going to the Apple menu
    > About This Mac > Storage.


    ![image10.png](Images/image00130.jpeg)


    5. Last but not least, create a backup of your Mac. By deploying Linux in a dual
    boot partition, you should not lose any data. If something goes wrong, you will
    need to wipe your Mac clean to restore it.

    6. Instead of building a dual-boot setup, use `Carbon Copy Cloner` for backing
    up your macOS Recovery partition to replace macOS with Linux. This makes reverting
    to macOS a lot simpler.


    ### Booting from USB Installer


    Restart your Mac while keeping the option and insert the USB flash drive into
    the computer directly. Once the boot loader shows, pick `Boot EFI` with the arrow
    keys and press “Enter.”


    The `Ubuntu` desktop appears after the `Ubuntu` loading screen.


    Take advantage of this opportunity to try `Ubuntu` on your Mac. Remember that
    it could be slow because it is operating from a USB flash drive. Using an Ethernet
    cable to link to the internet since `Ubuntu` can''t use the Mac''s Wi-Fi by design.


    ### Installing Linux on Mac


    Double-click the "Install Ubuntu" icon on the desktop when set.


    To select your keyboard layout and languages, execute the on-screen prompts. Select
    a Normal installation and the Install third-party software option. Installing
    this app, which allows you to use Wi-Fi and Bluetooth, requires connecting your
    Mac to the internet with an Ethernet cable. Then press the Continue button.


    Keep the partitions mounted if asked.


    ### Setting Up the Boot Manager


    Your Mac''s default boot manager does not always operate for `Ubuntu`. This means
    you must deploy a third-party boot manager anyway, which will allow you to easily
    switch between macOS and Linux when your computer boots up.


    The next move is to install `rEFInd`. You must briefly deactivate System Integrity
    Protection to enable `rEFInd`. Allow it again afterward because this is an essential
    security function for macOS


    To set up the `rEFInd` boot manager, follow these steps:


    1. Launch `Terminal` from the Utility folder in Applications with `SIP` disabled.

    2. In a different window, open `Finder` and switch to the `rEFInd` link.

    3. Click Enter after dragging the `rEFInd-install` package into your `Terminal`
    window.

    4. Enter your user account when asked, then click Enter again.

    5. Remember to re-enable `SIP` after the installation is complete.

    6. Dropping the `rEFInd-install` file into a `Terminal` window and entering the
    code.

    7. The `rEFInd` selection should automatically appear the next instant you reboot
    your Mac. Keep Option when booting up to launch your boot manager if it does not.


    # Chapter 4: Linux Shell


    You will need to connect with the machine and tell it what you want it to do.
    One way to communicate with a machine in Linux is via a program called the shell.
    A shell is not a graphical interface. It is the set of commands and syntax to
    complete your tasks.


    By graphical desktop norms, the shell environment is very bland and boring. When
    you first launch the shell, you will see a short prompt, such as a `$`, followed
    by a blinking cursor waiting for you to type something.


    ## 4.1 What is Shell?


    A command shell, also known as a command interpreter, is a program that sends
    the commands to the operating system and application programs and receiving their
    responses. It is comparable to `command.com` in MS-DOS or `cmd.exe` in Windows
    in terms of functions, but the Linux shell is much more functional. Scripts are
    small programs written in the command shell language that perform sequential operations
    with files and their data.


    It is difficult to be a successful Linux professional without understanding how
    to use the command line.


    The command line is a shell prompt that shows whether the device is ready to accept
    a user command. This is called a user-system dialogue. The user receives a response
    from the system for each command entered:


    1. A new invitation, indicating that the command has been executed and that you
    will proceed to the next step.

    2. An error message is a statement from the system to the user about events in
    the system.


    Working with the command line can seem inconvenient to users used to working with
    systems with a graphical interface. This form of GUI has always been basic in
    Linux and thus well developed. There are several ways to save effort, keystrokes
    when performing the most common behavior in the Linux command shells:


    1. Long command or file names are automatically added

    2. Scanning for and re-executing an executed command

    3. File name list substitutions based on a standard and much more


    When you need to conduct identical operations on several items, the command line''s
    advantages become apparent. In a graphical interface system, you will need as
    many input devices as there are objects. On the command line, one command will
    suffice.


    This chapter will go over the essential resources you can use to solve any user
    task using the command line. It ranges from basic file and directory operations
    like copying, renaming, and searching to more complicated tasks involving massive
    related operations like those found in user applications, dealing with large data
    arrays or text, and in system administration.


    ## 4.2 Gaining Access to Shell


    The `bash` shell is the default shell in Linux. The Bourne shell, also known as
    `sh`, is a UNIX shell used in this work environment. The Bourne again shell is
    what the word `bash` refers to. Most Linux distributions have the `bash` shell.


    A terminal program on your GUI desktop can launch a `bash` session. The terminal
    program you use is determined by your desktop:


    1. The default terminal in the `GNOME 3` desktop is `Terminal`. Pick the `Terminal`
    icon from the program launcher, or type `Terminal` into the Search text box if
    you do not see it.

    2. The default terminal in the `KDE Plasma` desktop is `Konsole`. To open it,
    go to the `K` menu and choose Applications System `Konsole`.


    The shell command line prompt is the prompt in the window. Your commands are typed
    in there.


    Additional cool features in both `Terminal` and `Konsole` include cutting and
    pasting text and changing the color of the text and context. You can also use
    green text on a black screen, much like the computer terminals in old movies from
    the 1970s.


    ## 4.2 Types of Shell

