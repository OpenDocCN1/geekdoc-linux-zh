    # 文件查看器命令


    许多设备用户喜欢的消遣是搜索文本文件。这些程序提供了广泛的功能，用于显示各种大小的可读文本文件的内容。由于这些命令只是查看器，而不是编辑器，因此你不会像使用全屏编辑器那样损坏文件内容。


    | 命令 | 描述 |

    | :--- | :--- |

    | `Head` | 显示文件的前十行。 |

    | `More` | 一次显示屏文件，只能向前移动。 |

    | `Less` | 一次显示屏文件，可以向前或向后移动。 |

    | `Tail` | 显示文件的最后十行。 |

    | `Cat` | 将文件内容倾到屏幕上。 |


    ## 文件处理命令


    下面列出的命令帮助用户处理文件系统中的文件。


    | 命令 | 描述 |

    | :--- | :--- |

    | `Cat` | 在标准输出中显示文件（可以将多个文件合并为一个大文件）。 |

    | `Diff` | 比较两个文本文件并找出差异。 |

    | `Cut` | 从文件的每行文本中提取特定部分。 |

    | `Dd` | 从一个文件复制数据块到另一个文件（用于从设备复制数据）。 |

    | `Expand` | 将所有制表符转换为空格。 |

    | `Fold` | 将每行文本折叠以适应指定的宽度。 |

    | `File` | 显示文件中的数据。 |

    | `Grep` | 在文本文件中搜索正则表达式。 |

    | `Lpr` | 打印文件。 |

    | `Less` | 一次显示一页文本文件。（按 b 键向后移动。） |

    | `More` | 一次显示一页文本文件。（只能向前移动）。 |

    | `Paste` | 合并多个文件的对应行。 |

    | `Nl` | 对文本文件中所有非空行进行编号，并将行打印到标准输出。 |

    | `Patch` | 使用原始文件和修订版文件之间的差异更新文本文件。 |

    | `Sort` | 对文本文件中的行进行排序。 |

    | `Sed` | 在应用指定编辑命令的同时将文件复制到标准输出。 |

    | `Split` | 将一个文件分成多个指定大小的较小文件。 |

    | `Tac` | 反转文件（最后一行在前，依此类推）。 |

    | `Zcat` | 显示压缩文件（解压缩后）。 |

    | `Tail` | 显示文件的最后几行。 |

    | `Tr` | 在整个文件中用一组字符替换另一组。 |

    | `Uniq` | 消除文本中的重复行。 |

    | `zmore` | 一次显示一页压缩文件。 |

    | `Wc` | 统计文本文件的行、字和字符数。 |

    | `Zless` | 一次显示一页压缩文件。（按 b 键向后移动。） |


    ## 5.4 成为超级用户 (Root)


    你必须成为 root 来执行需要高权限的操作，例如管理你的系统。通常，你使用常用的用户名和密码日常登录。然而，当你需要超级用户权限时，运行以下命令变为 root：


    ```

    su -

    ```


    `su` 后跟着一个空格和一个减号，这是命令（或连字符）。shell 需要 root 密码。在输入密码后点击“回车”。


    完成作为 root 身份所需的任何操作后（你可以以 root 身份做任何事情），输入 `exit` 返回原来的用户名。


    与其使用 `su -` 命令获取 root 权限，不如输入 `sudo` 后跟你想作为 root 运行的命令。由于在安装 Ubuntu 时你没有机会设置 root
    用户，因此你必须使用 `sudo` 命令。如果你在 `/etc/sudoers` 文件中被识别为授权用户，`sudo` 将以你已登录 root 的身份执行该命令。要了解更多关于
    `/etc/sudoers` 文件的信息，请输入 `man sudoers`。


    ## 5.5 处理日期和时间


    `date` 命令可以显示当前的日期时间和设置新的日期时间。如果你在 shell 提示符输入 `date`，你会得到类似的内容：


    ```

    Fri Mar 12 15:10:00 EST 2021

    ```


    如你所示，`date` 命令本身显示最新的日期时间。


    要更改日期，请以 root 登录并输入 `date`，然后是 `MMDDhhmmYYYY` 格式的日期时间。输入 2021 年 3 月 12 日 晚上 10:30
    来设置日期时间。


    `031220302021` 就是日期。


    日期时间格式 `MMDDhhmmYYYY` 与 24 小时军用钟相似，具有以下含义：


    1. `MM` 代表月份，是一个两位数字（01 到 12）。

    2. `DD` 是代表月份日期的两位数字（01 到 31）。

    3. 在 24 小时格式下，`hh` 是两位数小时（00 是午夜，23 是晚上 11 点）。

    4. 分钟由 `mm` 测量，是一个两位数字（00 到 59）。

    5. 四位年份用 `YYYY` 表示（例如 2021）。


    `cal` 是另一个与日期相关的有用命令。如果你在不带任何选项的情况下输入 `cal`，它会打印当月的日历。当你输入 `cal` 后跟一个数字时，该数字被视为年份，并打印该年的日历。提供月份数字（1
    = 一月，2 = 二月，依此类推）配合年份可以显示特定年份特定月的日历。


    # 第 6 章：基础网络管理


    由于大多数 PC 现在连接到局域网 (LAN) 或互联网，你也必须控制你的网络连接。为了建立局域网，Linux 包含一个网络配置工具。通常有一个 GUI 终端拨号工具用于通过调制调器连接互联网。


    如果你使用 DSL 或电缆调制调器连接到互联网，你需要一台带有以太网卡的 PC 来连接电缆或 DSL 调制调器。你还必须配置以太网并建立局域网。幸运的是，这些步骤通常包含在
    Linux 安装过程中。如果你愿意，稍后可以使用 GUI 网络配置工具进行配置。


    Linux 还带有用于配置防火墙的工具，防火墙充当你的设备与任何试图窥探你互联网连接的人之间的安全屏。可以使用 `iptables` 命令或 GUI 防火墙配置功能配置防火墙。


    ## 网络安全 Linux


    物理通道将你的设备连接到供应商的服务器，允许你连接到互联网。


    物理连接可以通过三种方式之一建立：


    1. 无线连接；

    2. 局域网；

    3. 允许交换 PPP 的调制调器。


    在第一种情况下，需要无线访问点。只有在互联网开放的情况下，才能建立连接的无线网络。


    当你的机器连接到局域网时，使用第二种方法通过服务器访问万维网。在这种情况下，你不需要担心设置连接，因为局域网管理员会处理。只需打开一个窗口，输入你想访问的
    URL，然后进入即可。


    第三种选择是使用拨号调制调器连接。管理员不会帮助你，因此你必须独立完成。我们同意进一步研究这种方法。


    你需要一个调制调器和一个电话才能开始。下一步是选择一个互联网提供商，并获取你的 PC 连接到供应商调制调器池的电话，以及进入全球网络的用户名和密码。


    然后必须配置 PPP 协议。你可以手动配置，也可以借助配置软件帮助。手动配置非常耗时，并且需要编辑文件和编写脚本。初学者应该使用一个自动完成整个互联网接入过程的程序。


    该软件最初用于 KDE 图形环境，被称为 `kppp`。此实用程序使得设置连接变得简单得多，通常你只需要正确定义账户详情即可。


    ## 理解互联网


    鉴于互联网的广泛使用和流行，你不仅希望将你的 Linux 设备连接到网络，还要连接到全球最大的网络：互联网。取决于你拥有 DSL 还是电缆调制调器，我将在本中为你展示几种连接互联网的方法。仍有小部分的人在使用拨号网络服务，但他们现在很少了。大多数用户对拨号连接较慢的输出并不满意。


