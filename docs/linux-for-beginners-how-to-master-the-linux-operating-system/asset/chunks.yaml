    - 7.7 Adobe Acrobat Reader 替代方案\n- 结\n\n# 绪言\n\nLinux 是一种基于 `UNIX` 和 `POSIX` 编程语言的免费开源操作系统。它可以免费下载和使用。它是基于\
    \ `Intel x86` 范式构建的。事实上，与其他操作系统相比，Linux 拥有最广泛的用户群。\n\n这就是为什么基于 Linux 的计算机或系统运行迅速，甚至经常与那些惊人的超级计算机相比。与其他操作系统不同，Linux\
    \ 可以被定制为任何形式的系统，而其他操作系统是为特定的计算机类型设计的。\n\n这归于开源软件的协作，能够支持不同的库和目录。\n\n下一步是学习更多编写和编辑\
    \ shell 脚本以及开发自动化脚本，这将帮助你充分利用 Linux。\n\nLinux 操作系统（OS）并没有被普通用户充分认知，尽管它是最常用的平台，适用于\
    \ Android 手机、智能手表、冰箱、洗衣机、视频游戏机和数字录像机（DVR）。\n\n当你想起 Linux 是如何诞生的以及它是如何持续增长的，令人叹为观止。Linux\
    \ 从一个个人——芬兰的林纳斯·托瓦尔斯（Linus Torvalds）的业爱好开始，演变成了一个功能可以与任何商业 Unix 操作系统媲美的完整操作系统。更棒的是，Linux\
    \ 连同它所有的源代码都是免费的。你只需要从互联网下载它，或者从许多 Linux CD 销售处以低廉的价格购买 CD 或 DVD 即可。\n\n“一分钱一分货”的谚并不适用于\
    \ Linux。尽管 Linux 是免费的，但它在性能、功能和可靠性方面绝非逊色。Linux 的设计和修改与其健壮性很大关系。来自世界各地的开发者共同添加新功能。用户每天更新增量版本并在多种设备配置中进行测试。Linux\
    \ 的修订版本比消费级应用经过了更广泛的 Beta 测试。\n\n自 1994 年 3 月 14 日 Linux 内核 `1.0` 以来，Linux 用户的数量呈指数级增长。许多\
    \ Linux 发行版使得操作系统、软件和安装工具的安装和使用变得更容易。某些 Linux 发行版通过商业销售获得补贴，而另一些仍然免费提供。\n\n与许多其他免费下载的软件程序不同，Linux\
    \ 带有丰富的在线文档，涵盖了在多台 PC 和外设上下载和配置操作系统等主题。少数硬核 Linux 用户已经熟练到仅凭在线文档就能有效地使用 Linux。然而，有很大比例的用户是为了特定目的（例如设置\
    \ Web 服务器或学习 Linux）而切换到 Linux 的。许多 Linux 用户仍然在家里使用他们的机器。但对于这些新用户来说，在线文档很难使用，因为它们经常不涵盖每个用户可能设想的\
    \ Linux 特有用途。\n\n如果你是 Linux 初学者，你需要一份循序渐进的指南，不仅能引导你完成安装和配置，还能解释如何针对特定任务使用 Linux。在决定\
    \ Linux 发行版之前，尝试尝试几个。\n\n本书的编写考虑了几乎没有或完全没有知识的普通人。它采用简单易懂的语言制定，这使得它对新手和专业人士都同样有用。\n\
    \n# 第 1 章：Linux 是关于什么的？\n\nLinux 起于一个 PC 操作系统，但从以后扩展到了服务器、超级计算机、数据中心和其他设备。Linux\
    \ 现在用于集成设备，如路由器、安全控制、电视、数码相机、游戏机和智能手表。基于 Linux 内核并运行在平板电脑和智能手机上的 Android 是 Linux\
    \ 最大的胜利。感谢 Android，Linux 拥有任何特定操作系统中最大的用户群。Linux 发行版是一组 Linux 包。\n\nLinux 发行版也是一种由以\
    \ Linux 框架或内核为中心的算法组成的操作系统，包括 Linux 内核以及支持模块和软件。你也可以通过安装适用于嵌入式系统、计算机等各种 Linux\
    \ 发行版来获取基于 Linux 的操作系统。\n\n## 1.1 什么是操作系统？\n\n"
- fmt: '

    The OS (Operating System) on your computer is in charge of the computer''s hardware
    and software. Several computer applications are usually running simultaneously,
    and they all need access to your computer''s central processing unit (`CPU`),
    storage, and memory. This is coordinated by the OS (Operating System) to ensure
    that each software receives the resources it requires.


    Computer software and system development benefit significantly from an OS (Operating
    System). Without an OS (Operating System), each application must include its user
    interface and the extensive code required to manage the computer''s low-level
    functions, such as disc storage, network connectivity, and so on. Given the wide
    range of hardware resources available, this would increase any application size
    and render software development inefficient.


    Many fundamental tasks, such as transmitting data packets or presenting text on
    a typical output screen, such as a monitor, may be delegated to system software,
    which acts as a bridge between hardware and software. System software allows applications
    to communicate with the devices predictably and consistently without even the
    applications'' need to know specific details about the hardware.


    The OS (Operating System) — can handle almost any range of applications if they
    all access the same services and resources in the same way. This decreases the
    time and programming needed to create and debug a program while making sure that
    users can monitor, manage, and manage system hardware across a standard and intuitive
    interface.


    To optimize OS services to the particular hardware environment, the OS (Operating
    System) uses an extensive database of computer drivers. While any software may
    make an introductory call to the storage media, the OS receives the call and employs
    the associated driver to convert the call into commands required by the hardware
    resources on that computer. Nowadays, the OS (Operating System) serves as a robust
    interface for identifying, configuring, and managing various hardware, such as
    processors, processing modules, and memory management.


    ## Primary Functions of OS (Operating System)


    An OS (Operating System) has three primary functions: it provides a user interface
    (`UI`) via a Command Line Interface (`CLI`) or a Graphical User Interface (`GUI`).
    It executes and regulates application execution, and defines and communicates
    system resources to such applications (typically via a structured `API`).


    ### User Interface (UI)


    `UI` stands for the user interface. Every OS (Operating System) must have a graphical
    user interface (`GUI`), allowing users to communicate with the OS to set up, customize,
    and troubleshoot the OS and its hardware. `CLI` and `GUI` are the two main user
    interfaces available.


    The `CLI`, also known as the terminal mode window, is a text-based system interface
    that allows users to enter commands, arguments, and parameters related to certain
    tasks using the standard keyboard. Individuals depend on inputs delivered by input
    devices such as touchscreens, touchpads, and mouse devices to navigate the `GUI`
    or desktop, which is based on icons and symbols.


    Users who are mainly interested in modifying files and programs, like double-clicking
    an icon to open a file in its primary application, seem to be the most frequent
    `GUI` users. Professional developers and advanced users continue to favor the
    `CLI` as they must regularly manage extraordinarily rough and complex commands,
    such as developing and managing scripts to establish new computers for employees.


    ### Application Management


    Every application is launched and managed by an OS (Operating System). This generally
    facilitates a range of behaviors, such as timesharing several processes, and threads,
    so different tasks can split the accessible processors'' time. It also helps to
    manage disruptions that programs produce to get a processor''s serious response.
    This helps to maintain there is enough capacity to run the program, and its data
    is presented without conflicting with other operations and performing errands.


    An OS (Operating System) may also provide `APIs` that allow applications to use
    OS and hardware operations without understanding the limited OS or device state.
    A `Windows API`, for example, can help a software get input from a mouse and keyboard,
    build `GUI` elements like dialogue boxes and keys, read and write data to a storage
    device, and much more. The OS on which an application is intended to run is usually
    customized.


    An OS can also provide various services to programs, namely:


    1. In a multiuser environment, where several programs will run simultaneously,
    the OS decides which programs should operate in what sequence and time each program
    should be given before moving on to the next.

    2. It manages `I/O` to and from connected hardware devices, including hard drives,
    printers, and dial-up interfaces.

    3. It sends notifications about the state of service and any failures that might
    have appeared to each program or a system operator.

    4. It can handle batch job coordination so the facilitating application can focus
    on other tasks.

    5. An OS can handle how to split a program to run it on multiple processors simultaneously
    on systems that support parallel processing.


    All main computer systems need an OS, and sometimes, an OS must be designed with
    multiple attributes to cater to different form factors.


    ### Device management


    An OS is to define, customizing, and connecting computer devices to applications.
    The OS can configure device drivers. It recognizes and detects hardware, allowing
    the OS and programs to operate on the OS using the system without prior knowledge
    of the equipment or devices.


    It is the OS (Operating System) responsibility to find the correct device and
    activate the driver software so a program only needs to make requests to the device
    and not have to use commands or codes unique to that device. Many devices, such
    as Connectivity options, communication ports, graphics devices like `GPUs`, motherboard
    chipsets, even storage devices, are in a similar situation.


    The OS (Operating System) recognizes and configures logical and physical devices
    for operation and usually stores it in a logical structure like the `Windows Registry`.
    To secure the proper system efficiency and protection, device makers must patch
    and upgrade drivers regularly, and the OS should do the same. The OS also downloads
    and modifies new drivers when computers are replaced.


    ## Types of Operating Systems


    Although an operating system''s basic functions are similar, numerous operating
    systems cater to a wide multitude of platforms and user requirements.


    ### General Purpose OS


    This OS can be used for a variety of purposes. A general-purpose OS refers to
    a group of operating systems designed to run a wide range of applications on a
    wide range of hardware, allowing a user to run multiple applications or tasks
    simultaneously. A general-purpose operating system can be deployed on a variety
    of laptop and desktop configurations and run a variety of applications, including
    accounting software, directories, internet browsers, and games. To make sure that
    programs can efficiently share the broad range of hardware available, general-purpose
    OS usually concentrates on thread and hardware management.


    The following are examples of popular desktop operating systems:


    1. The unofficial norm for office and home computers is Microsoft''s signature
    operating system, `Windows`. The `GUI`-based operating system was first released
    in 1985 and has since been updated often.

    2. The OS for Apple''s `Mac` line of computers and workstations is `Mac OS`.

    3. `Unix` is a multiple-user OS that focuses on adaptability and versatility.
    `Unix` was among the first OS to be developed in the `C` programming language,
    having been developed in the 1970s.

    4. `Linux` was created as a free alternative for PC users. `Linux` has a legacy
    for being a high-performing and reliable operating system.


    Mobile OS

