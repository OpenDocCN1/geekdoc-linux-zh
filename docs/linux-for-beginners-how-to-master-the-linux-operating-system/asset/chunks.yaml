    使用 Linux 并不像初看起来那样需要多年的多年实践经验、大量的尝试错误、高级的计算机科学训练或深度的投入。只要你能告诉任何人如何找到你的办公室，你就能创建一个实现你所愿一切的
    Linux 系统。本书的目的并不是将你变成一个完全的 Linux 极客（尽管那是 Linux 启蒙的巅峰），相反，它是向你展示构建运行良好的 Linux 系统的内部细节，并赋予你使用它的诀窍和能力。


    这就是你开始 Linux 所需的一切。你只需要一个文本编辑器、Linux Shell 或集成开发环境，以及对某门编程语言的知识，外加一台相当、可靠的计算机和一个
    Linux 发行版，就能成为一名 Linux 专业人士了。现在是时候测试你的技能并分析你到为止从这本书中中学到的内容了。


    我个人非常感谢你的投入和时间，请不要忘记在 Amazon 上留下评论，这有助于我更好地了解我的读者，并一定会改进我的下一部作品。


    预谢你的感谢。


