    UNIX 的费用比 Linux 高。中端 UNIX 服务器的价格在 25,000 到 249,999 美元之间。HP、SUN 和 IBM 是主要的分销商。顶级的
    UNIX 服务器费用超过 500,000 美元。根据 IDC 和 Gartner 的数据，IBM 是 UNIX 服务器领域的领先公司，HP 居第二，SUN
    居第七。


    商业级 UNIX 通常为每个系统量身定制，导致高昂的初始成本，而 Linux 则拥有模型化的软件包。Linux 的模式比单纯的企业级 UNIX 操作系统更与
    Windows 相似。购买 UNIX 服务器的用户会获得一个供应商支持包，其中包含了帮助设置和维护系统的服务。而 Linux 的供应商支持必须单独购买。


    两种操作系统设备都容易受到病毒攻击，但 Linux 在处理病毒方面配备更为完备。UNIX 中存在的大多数功能和特性已在 Linux 中实现，包括多用户环境中的用户域分类、多任务环境中的任务分离、可以进行身份验证和/或远程访问机制等。由于
    Linux 是一个开源操作系统，任何人都可以在用户论坛上修复漏洞，并在几天内完成补丁。然而，UNIX 并非如此，用户必须等待很长时间才能收到正确的漏洞补丁。由于它不需要通过企业级操作系统漫长的开发流程，开发者社区通常能更早交付更新。


    与此同时，Linux 作为一个开源操作系统，由数以万计的开发者资助。明确来说，这比 UNIX 能够提供更具创造力且功能上市速度更快的能力。


    在过去的几年里，Linux 的演进速度快于任何服务器操作系统。据估计，使用的 Linux 设备超过 2500 万台，而 UNIX 系统仅有 550 万个。


    由于在嵌入式技术中的应用以及免费易于获取，Linux 正在快速增长。为了应对 Linux，HP、IBM 和 SUN 等公司正在开发具有图形用户界面且同样符合
    Linux 标准的用户友好型定制 UNIX 系统。


    ## 1. Linux 系统架构


    内核是操作系统的一部分，负责管理 CPU 资源、分配内存、传输数据、调度进程、执行应用程序并确保它们之间相互隔离。当计算机启动时，会加载第一个应用程序。内核最重要的代码段被挂载到安全内存区域，以防止它们被某些操作系统应用程序覆盖。


    Linux 是一种可以在广泛硬件上实现的操作系统，用于构建软件、运行程序等。内核是 Linux 的核心。Linux 最初是用 `C` 语言编写并运行在 `i386`
    机器上的，但从以后已适配了比其他操作系统更多的设备。Linux 现在是全球最广泛使用的操作系统。


    `CLI`（命令行界面，也被称为 shell）用于管理 Linux。Linux 发行版提供一系列 Linux 应用程序，例如用于管理和操作硬件的应用软件、共享库、程序和系统任务（这些任务同时运行并引用网络请求），除了管理软件和硬件进程的内核外。对于
    Linux 而言，有超过 70,000 个程序供选择，以及多种编程语言。包含应用程序及其信息的软件包用于安装应用程序。


    有必要理解，所有的操作系统都在内核空间运行其二进制文件，以避免内核挂起和中断系统。每当用户访问程序或方法时，它都会在用户空间中运行。这种区分至关重要。应用程序可能源于多个地方，可能不完善，或可能来自未知来源。这些程序无法篡改内核基础设施并触发系统故障，因为它们运行在内核空间之外。


    若要连接系统内存资源或网络设备，所有程序（包括执行基本操作系统任务的系统守护进程任务）必须向内核发出系统请求。每个专业的多操作系统环境都创建了用户空间与内核空间的配置，以保持其安全、快速和可靠。


    简而言之，内核空间与用户的分离使得 Linux 成为可能的最稳定、最安全的操作系统。


    ![C:\Users\Hamza\Desktop\overview1.gif](img/image00121.jpeg)


    进程调度器是最重要的子系统。所有其他组件都依赖于它，因为它们都需要暂停和重启进程。通常，一个子系统会暂停程序以等待设备操作完成，并在进程完成后重启该进程。当一个进程尝试通过整个网络传递消息时，网络接口可以在设备成功发送请求之前暂停该进程。因此，网络接口在接收请求（或设备返回失败）后，会通过一个显示操作结果的返回码来恢复程序。对于类似的目的，进程调度器、虚拟数据库服务器和进程间协作都依赖于进程调度器。


    以下是一些不那么显而但至关重要的依赖关系：


    1. 当操作恢复时，进程调度器接口使用内存管理器来更新该进程的硬件数据映射。

    2. 进程间处理子系统需要内存管理器来实现共享内存网络通信。这种方法允许两个进程使用共享内存区域及其内存。

    3. 虚拟文件系统使用网络接口来辅助网络文件系统（`NFS`），内存控制器用于提供内存磁盘单元。

    4. 内存管理器使用数字文件系统来促进切换。这是内存管理器主要依赖于进程调度器的唯一因素。每当进程尝试访问被交换出的信息时，内存管理器会向系统文件发送请求以从持久存储中检索内存，此时进程会被停止。

    5. 与显式限制相比，内核中的所有模块都依赖于某些在任一子系统中不可见的公共基础设施。两个内核组件都使用这些协议为内核分配和释放资源，使用打印警报或错误的程序以及系统监控程序。这些工具将不会直接列出，因为它们被认为是可以访问的。

    6. 在此阶段，架构设计反映了 Garlan 和 Shaw 的数据抽象风格。所示的每个子系统都包含可以通过过程框架访问的状态信息，且每个子系统最终控制其管理的资源。

    Linux 内核的技术框架是成功的。这种性能的关键因素是开发者组织的安排和系统的可配置性。为了维护大量的个体志愿者程序员，需要 Linux 内核框架。

