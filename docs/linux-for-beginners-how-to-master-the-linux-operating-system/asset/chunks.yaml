    coordination all rely on the process scheduler.


    The following are some of the less evident but crucially significant dependencies:


    1.  When an operation is restored, the memory manager is used by the process-scheduler
    interface to update the hardware data map for that process.


    1.  The memory manager is required by the inter-process processing subsystem to
    enable shared-memory network communication. This method enables two processes
    to use a shared memory area with their memory.


    1.  The network interface is used by the virtual file system to aid a network
    file system (NFS), and the memory controller is used to provide the ramdisk unit.


    1.  The digital file system is used by the memory manager to facilitate switching.
    It is the only factor why the memory manager is dependent mostly on the process
    scheduler. Whenever a process attempts to access swapped-out information, the
    memory manager sends a request to the system files to retrieve the memory from
    permanent storage, and the process is halted.


    1.  Compared to the explicit constraints, all modules in the kernel depend on
    a certain common infrastructure that is not visible in either subsystem. Both
    kernel components use these protocols to assign and free resources for the kernel''s
    use, and procedures to print alert or error alerts, and system monitoring routines.
    These tools will not be listed directly since they are believed to be widely accessible.


    1.  At this stage, the architectural design reflects that of Garlan and Shaw’s
    Data Abstraction style. Each one of the portrayed subsystems comprises state information
    that can be accessed through a procedural framework, and each subsystem is ultimately
    in control of the resources it manages.


    The Linux kernel''s technical framework is successful. Key factors in this performance
    were the arrangement for developer organization and system configurability. To
    maintain a large number of individual volunteer programmers, the Linux kernel
    framework was needed. This criterion proposed that the platform''s most development-intensive
    components, such as hardware application software and file and networking interfaces,
    could be incorporated powerfully and flexibly. The Linux designer chose an application
    and database method to make these structures flexible. Each physical domain controller
    is configured as a separate segment with a shared interface. In this manner, a
    single developer could introduce a new system driver with little interaction from
    other Linux kernel developers. The success of a significant number of professional
    developers in implementing the kernel demonstrates the feasibility of this technique.'
