- fmt: "\n# File Viewer Commands\n\nMany a device user's favorite pastime is searching\
    \ text files. These programs provide a wide range of functions for displaying\
    \ the contents of readable text files of various sizes. Since these commands are\
    \ just viewers, not editors, you can't harm the contents of a file with them,\
    \ as with a full-screen editor.\n\n| Command | Description |\n| :--- | :--- |\n\
    | `Head` | Shows the initial ten lines of a file. |\n| `More` | Shows the file\
    \ a screen at a time, forward only. |\n| `Less` | Shows the file a screen at a\
    \ time, forward and backward. |\n| `Tail` | Shows the last ten lines of a file.\
    \ |\n| `Cat` | Dumps the contents of the file to your screen. |\n\n## Processing\
    \ File Commands\n\nThese commands listed below help users to process files in\
    \ the filesystem.\n\n| Command | Description |\n| :--- | :--- |\n| `Cat` | Displays\
    \ a file in standard output (can concatenate several files into one big file).\
    \ |\n| `Diff` | Compares two text files and finds differences. |\n| `Cut` | Extracts\
    \ particular sections from each line of text in a file. |\n| `Dd` | Copies blocks\
    \ of data from one file to another (used to copy data from devices). |\n| `Expand`\
    \ | Converts all tabs to spaces. |\n| `Fold` | Wraps each line of text to fit\
    \ a specified width. |\n| `File` | Displays the data in a file. |\n| `Grep` |\
    \ Searches for regular expressions in a text file. |\n| `Lpr` | Prints files.\
    \ |\n| `Less` | Displays a text file one page at a time. (Go backward by pressing\
    \ b.) |\n| `More` | Displays a text file one page at a time. (Goes forward only).\
    \ |\n| `Paste` | Concatenates corresponding lines from several files. |\n| `Nl`\
    \ | Numbers all nonblank lines in a text file and prints the lines to standard\
    \ output. |\n| `Patch` | Updates a text file by using the differences between\
    \ the original and revised copies of the file. |\n| `Sort` | Sorts lines in a\
    \ text file. |\n| `Sed` | Copies a file to standard output while applying specified\
    \ editing commands. |\n| `Split` | Breaks up a file into several smaller files\
    \ with specified sizes. |\n| `Tac` | Reverses a file (last line first and so on).\
    \ |\n| `Zcat` | Displays a compressed file (after decompressing). |\n| `Tail`\
    \ | Displays the last few lines of a file. |\n| `Tr` | Substitutes one group of\
    \ characters for another throughout a file. |\n| `Uniq` | Eliminates duplicate\
    \ lines from a text file. |\n| `zmore` | Displays a compressed file, one page\
    \ at a time. |\n| `Wc` | Counts the lines, words, and characters in a text file.\
    \ |\n| `Zless` | Displays a compressed file, one page at a time. (Go backward\
    \ by pressing b.) |\n\n## 5.4 Becoming Superuser (Root)\n\nYou must become root\
    \ to do something that demands high privilege, such as administering your scheme.\
    \ Typically, you log in as daily use with your usual username and password. When\
    \ you need superuser rights, however, run the following command to become root:\n\
    \n```\nsu -\n```\n\n`su`, followed by a space, and the minus sign, is the command\
    \ (or hyphen). The shell needs the root password. Click “Enter” after typing the\
    \ password.\n\nWhen done whatever you have wanted as root (and you can do something\
    \ as root), type `exit` to return to your usual username.\n\nRather than using\
    \ the `su -` command to gain root access, type `sudo` followed by the command\
    \ you want to run as root. Since you do not get to set up a root user when you\
    \ install Ubuntu, you must use the `sudo` command. `sudo` executes the command\
    \ as if you were logged in as root if you are identified as an authorized user\
    \ in the `/etc/sudoers` file. To learn more about the `/etc/sudoers` file, type\
    \ `man sudoers`.\n\n## 5.5 Working with the Date and Time\n\nThe `date` command\
    \ can show the current date and time and set a new date and time. If you type\
    \ `date` at the shell prompt, you will get something like this:\n\n```\nFri Mar\
    \ 12 15:10:00 EST 2021\n```\n\nThe `date` command alone, as you can see, shows\
    \ the latest date and time.\n\nTo change the date, log in as root and type `date`,\
    \ followed by the date and time in `MMDDhhmmYYYY`. Type March 12, 2021, 10:30\
    \ p.m. to set the date and time.\n\n`031220302021` is the date.\n\nThe date and\
    \ time format `MMDDhhmmYYYY` is similar to the 24-hour military clock and has\
    \ the following meaning: \n\n1. `MM` stands for month and is a two-digit number\
    \ (01 through 12).\n2. `DD` is a two-digit number that represents the month's\
    \ day (01 through 31).\n3. In 24-hour format, `hh` is a two-digit hour (00 is\
    \ midnight, and 23 is 11 p.m.).\n4. The minute is measured by `mm`, which is a\
    \ two-digit number (00 through 59).\n5. The four-digit year is denoted by `YYYY`\
    \ (such as 2021).\n\n`cal` is another useful date-related command. It prints a\
    \ calendar for the month if you type `cal` with no choices. When you type `cal`\
    \ followed by a number, the number is treated as the year, and the calendar for\
    \ that year is printed. Provide the month number (1 = January, 2 = February, and\
    \ so on) accompanied by the year to display the calendar for a particular month\
    \ in a specific year.\n\n# Chapter 6: Basic Network Administration\n\nSince most\
    \ PCs are now connected to a local-area network (LAN) or the Internet, you must\
    \ also control your network link. To set up the LAN, Linux includes a network\
    \ configuration tool. A GUI Internet dial-up tool is normally available for connecting\
    \ to the Internet with a modem.\n\nIf you use a DSL or cable modem to link to\
    \ the Internet, you will need a PC with an Ethernet card that links to the cable\
    \ or DSL modem. You must also configure the Ethernet card and set up a LAN. Fortunately,\
    \ these steps are usually included in the Linux installation process. You can\
    \ use a GUI network configuration tool to do the configurations later if you prefer.\n\
    \nLinux also comes with tools for configuring a firewall, which acts as a security\
    \ shield between your device and anyone attempting to snoop on your Internet connection.\
    \ The firewall can be configured using `iptables` commands or a GUI firewall configuration\
    \ function.\n\n## Securing Linux on Networking\n\nA physical channel connects\
    \ your device to the provider's server, allowing you to connect to the Internet.\n\
    \nA physical relation can be arranged in one of three ways:\n\n1. A wireless connection;\n\
    2. A local network;\n3. A modem that allows PPP to be exchanged.\n\nA wireless\
    \ access point is required in the first case. It is only possible to set up a\
    \ wireless network with the Internet if it is open.\n\nWhen your machine is linked\
    \ to a local network, the second approach is used to access the World Wide Web\
    \ via a server. In this scenario, you will not have to worry about setting up\
    \ the link because the local network administrator will take care of it. Simply\
    \ open a window, type in the URL you want to visit, and go.\n\nThe third choice\
    \ is to use a dial-up modem link. The administrator will not assist you, so you\
    \ must do it independently. We agreed to investigate this approach further.\n\n\
    You will need a modem and a phone to get started. The next step is to choose an\
    \ Internet service provider and obtain the phone number from which your PC can\
    \ connect to the provider's modem pool, and your username and password to enter\
    \ the global network.\n\nThe PPP protocol must then be configured. You can do\
    \ this manually or help with the configuration software. Manual configuration\
    \ is time-consuming and necessitates the editing of files and developing scripts.\
    \ Beginners should use a particular program that automates the entire process\
    \ of establishing Internet access.\n\nThis software was initially used in the\
    \ KDE graphical environment and is known as `kppp`. This utility makes it much\
    \ easier to set up a link and, usually, you have only to define the accounting\
    \ details correctly.\n\n## Understanding the Internet\n\nGiven the Internet's\
    \ widespread usage and popularity, you will want to link your Linux device not\
    \ just to a network but also to the world's largest network: the Internet. Depending\
    \ on whether you have a DSL or cable modem, I show you how to connect to the Internet\
    \ in several ways in this chapter. A small percentage of people still use the\
    \ dial-up network service, but they are few these days. most users are not happy\
    \ with the slower output of a dial-up connection.\n"
  raw: 'File Viewer Commands:


    Many a device user''s favorite pastime is searching text files. These programs
    provide a wide range of functions for displaying the contents of readable text
    files of various sizes. Since these commands are just viewers, not editors, you
    can''t harm the contents of a file with them, as with a full-screen editor.


    | Head | Shows the initial ten lines of a file. |


    | More | Shows the file a screen at a time, forward only. |


    | Less | Shows the file a screen at a time, forward and backward. |


    | Tail | Shows the last ten lines of a file. |


    | Cat | Dumps the contents of the file to your screen. |


    Processing File Commands:


    These commands listed below help users to process files in the filesystem.


    | Cat | Displays a file in standard output (can concatenate several files into
    one big file). |


    | Diff | Compares two text files and finds differences. |


    | Cut | Extracts particular sections from each line of text in a file. |


    | Dd | Copies blocks of data from one file to another (used to copy data from
    devices). |


    | Expand | Converts all tabs to spaces. |


    | Fold | Wraps each line of text to fit a specified width. |


    | File | Displays the data in a file. |


    | Grep | Searches for regular expressions in a text file. |


    | Lpr | Prints files. |


    | Less | Displays a text file one page at a time. (Go backward by pressing b.)
    |


    | More | Displays a text file one page at a time. (Goes forward only). |


    | Paste | Concatenates corresponding lines from several files. |


    | Nl | Numbers all nonblank lines in a text file and prints the lines to standard
    output. |


    | Patch | Updates a text file by using the differences between the original and
    revised copies of the file. |


    | Sort | Sorts lines in a text file. |


    | Sed | Copies a file to standard output while applying specified editing commands.
    |


    | Split | Breaks up a file into several smaller files with specified sizes. |


    | Tac | Reverses a file (last line first and so on). |


    | Zcat | Displays a compressed file (after decompressing). |


    | Tail | Displays the last few lines of a file. |


    | Tr | Substitutes one group of characters for another throughout a file. |


    | Uniq | Eliminates duplicate lines from a text file. |


    | zmore | Displays a compressed file, one page at a time. |


    | Wc | Counts the lines, words, and characters in a text file. |


    | Zless | Displays a compressed file, one page at a time. (Go backward by pressing
    b.) |


    5.4 Becoming Superuser (Root)


    You must become root to do something that demands high privilege, such as administering
    your scheme. Typically, you log in as daily use with your usual username and password.
    When you need superuser rights, however, run the following command to become root:


    su -


    Su, followed by a space, and the minus sign, is the command (or hyphen). The shell
    needs the root password. Click “Enter” after typing the password.


    When done whatever you have wanted as root (and you can do something as root),
    type exit to return to your usual username.


    Rather than using the su - command to gain root access, type sudo followed by
    the command you want to run as root. Since you do not get to set up a root user
    when you install Ubuntu, you must use the sudo command. Sudo executes the command
    as if you were logged in as root if you are identified as an authorized user in
    the /etc/sudoers file. To learn more about the /etc/sudoers file, type man sudoers.


    5.5 Working with the Date and Time


    The date command can show the current date and time and set a new date and time.
    If you type date at the shell prompt, you will get something like this:


    Fri Mar 12 15:10:00 EST 2021


    The date command alone, as you can see, shows the latest date and time.


    To change the date, log in as root and type date, followed by the date and time
    in MMDDhhmmYYYY Type March 12, 2021, 10:30 p.m. to set the date and time.


    031220302021 is the date.


    The date and time format MMDDhhmmYYYY is similar to the 24-hour military clock
    and has the following meaning: 


    1.  MM stands for month and is a two-digit number (01 through 12).


    1.  DD is a two-digit number that represents the month''s day (01 through 31).


    1.  In 24-hour format, hh is a two-digit hour (00 is midnight, and 23 is 11 p.m.).


    1.  The minute is measured by mm, which is a two-digit number (00 through 59).


    1.  The four-digit year is denoted by YYYY (such as 2021).


    Cal is another useful date-related command. It prints a calendar for the month
    if you type cal with no choices. When you type cal followed by a number, the number
    is treated as the year, and the calendar for that year is printed. Provide the
    month number (1 = January, 2 = February, and so on) accompanied by the year to
    display the calendar for a particular month in a specific year.


    # Chapter 6: Basic Network Administration


    Since most PCs are now connected to a local-area network (LAN) or the Internet,
    you must also control your network link. To set up the LAN, Linux includes a network
    configuration tool. A GUI Internet dial-up tool is normally available for connecting
    to the Internet with a modem.


    If you use a DSL or cable modem to link to the Internet, you will need a PC with
    an Ethernet card that links to the cable or DSL modem. You must also configure
    the Ethernet card and set up a LAN. Fortunately, these steps are usually included
    in the Linux installation process. You can use a GUI network configuration tool
    to do the configurations later if you prefer.


    Linux also comes with tools for configuring a firewall, which acts as a security
    shield between your device and anyone attempting to snoop on your Internet connection.
    The firewall can be configured using iptables commands or a GUI firewall configuration
    function.


    Securing Linux on Networking:


    A physical channel connects your device to the provider''s server, allowing you
    to connect to the Internet.


    A physical relation can be arranged in one of three ways:


    1.  A wireless connection;


    1.  A local network;


    1.  A modem that allows PPP to be exchanged.


    A wireless access point is required in the first case. It is only possible to
    set up a wireless network with the Internet if it is open.


    When your machine is linked to a local network, the second approach is used to
    access the World Wide Web via a server. In this scenario, you will not have to
    worry about setting up the link because the local network administrator will take
    care of it. Simply open a window, type in the URL you want to visit, and go.


    The third choice is to use a dial-up modem link. The administrator will not assist
    you, so you must do it independently. We agreed to investigate this approach further.


    You will need a modem and a phone to get started. The next step is to choose an
    Internet service provider and obtain the phone number from which your PC can connect
    to the provider''s modem pool, and your username and password to enter the global
    network.


    The PPP protocol must then be configured. You can do this manually or help with
    the configuration software. Manual configuration is time-consuming and necessitates
    the editing of files and developing scripts. Beginners should use a particular
    program that automates the entire process of establishing Internet access.


    This software was initially used in the KDE graphical environment and is known
    as kppp. This utility makes it much easier to set up a link and, usually, you
    have only to define the accounting details correctly.


    Understanding the Internet:


    Given the Internet''s widespread usage and popularity, you will want to link your
    Linux device not just to a network but also to the world''s largest network: the
    Internet. Depending on whether you have a DSL or cable modem, I show you how to
    connect to the Internet in several ways in this chapter. A small percentage of
    people still use the dial-up network service, but they are few these days. most
    users are not happy with the slower output of a dial-up connection.'
