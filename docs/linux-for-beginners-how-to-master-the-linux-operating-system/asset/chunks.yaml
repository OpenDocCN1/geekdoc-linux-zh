    6.3 The Network Topology


    From Windows to macOS, most modern operating systems have built-in support for
    Transmission Control Protocol/Internet Protocol (TCP/IP) networking. TCP/IP networking
    is possible over various physical interfaces, including Ethernet cards, serial
    ports, and parallel ports.


    Usually, an Ethernet network is used for your local area network (LAN) at your
    office or even at home (if you have two or more systems at home), while wireless
    (the next chapter) is becoming more common in most areas.


    You can use a wireless Ethernet network if you have laptop computers on your local
    area network (LAN) or do not want to run a tangle of wires to connect a PC to
    the LAN. In a typical situation, you have a cable modem or DSL Internet connection.
    You want to link one or more laptops with wireless network cards to the cable
    or DSL modem to access the Internet. This chapter explains how to link to an Ethernet
    LAN and access the Internet using wireless networking.


    ## 6.3.1 Understanding TCP/IP of LAN


    The simplest way to consider TCP/IP networking is to think of it as a four-layer
    model, with each layer responsible for a specific role. The layered model depicts
    the data flow between the network''s physical link and the end-user application.


    | 4 | Application | Mail, Transfer, TELNET |


    | 3 | Transport | TCP (Transmission Control Protocol)UDP (User Diagram Protocol)
    |


    | 2 | Network | IP (Internet Protocol) |


    | 1 | Physical | Ethernet |


    Information often passes from one layer to the next in this four-layer model.
    When an application sends data to another application, the data travels across
    these layers: application, transport, network, and physical. The data is sent
    up from the physical network transport application to the receiving end.


    For handling and formatting data, each layer has its own set of protocols — conventions.
    A standard protocol is the desired sequence of acts for a mission, such as addressing
    an envelope, if you think of sending data as being close to sending letters via
    the postal service (first the name, then the street address, followed by the city,
    state, and zip or other postal code).


    These four layers have different names depending on which reference you check.
    The transport layer is known as host-to-host. The network layer is known as internetwork
    or Internet. The application layer is known as process/application, and the physical
    layer is known as network access in the old DOD model.


