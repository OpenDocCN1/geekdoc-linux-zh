    # Linux Shell


    命令行外壳（也称为命令解释器）是一种向操作系统和应用程序发送命令并接收其响应的程序。在任务功能上，它与 MS-DOS 中的 `command.com` 或
    Windows 中的 `cmd.exe` 相似，但 Linux Shell 在功能上要不可比拟地丰富。脚本是用命令行 Shell 语言编写的小型程序，用于对文件及其数据执行顺序操作。


    在通过输入用户名和密码登录系统后，你可以看到命令行提示符——一行以 `$` 结尾的文本。该符号将代表命令行。如果在安装系统期间配置了在系统启动时启动图形用户界面，那么你可以在任何虚拟文本控制台上进入命令行。你可以通过按下
    `Ctrl-Alt-F1` - `Ctrl-Alt-F6` 或使用如 `xterm` 等终端模拟器程序来实现。


    以下列出的 Shell 是可用的。根据发行版的不同，它们可能会有所区别：


    ## 可用的 Shell


    ### Bash

    最著名的 Linux Shell。它可以关联命令和文件的名称，维护命令历史，并允许你对其进行编辑。


    ### pdkdh

    在 UNIX Shell 系统中，Korn shell 的克隆版本广为人知。


    ### sash

    此 Shell 是独特的，因为它不依赖于任何共享库，并包含一些最常用工具的简化版本，例如 `al`、`dd` 和 `gzip`。在从机器崩溃中恢复或更新最关键共享库的版本时，sash
    非常好用。


    ### tcsh

    C shell 的升级版本。


    ### zsh

    这是列表中最新的 Shell。它包含了高级功能，例如命令参数自动补全以及许多其他让操作 Shell 变得更加方便实用的功能。然而，由于所有 `zsh` 扩展默认都是禁用的，在使用此命令行
    Shell 之前，你必须阅读文档并允许你需要的功能。


    `Bash`（Bourne Again Shell）是默认 Shell。使用命令 `echo $ SHELL` 可以查看你正在使用哪个 Shell。


    Shell 不仅在功能上有所不同，在命令语法上也不同。如果你是新用户，我们建议从 `bash` 开始。额外的示例将解释该领域的工作原理。


    ## Bash Shell


    `bash` 中的命令行由命令名称以及后续键（选项）组成，键会改变命令的行为。键通常以字符 `-` 或 `--` 开头，且仅由一个字母组成。在命令之后，可以添加参数（参数）——命令必须执行其上的对象名称（通常是文件和目录的名称）。


    按下 `Enter` 键完成命令输入后，命令会被移动到执行 Shell。用户的终端上可能会出现有关命令执行的消息或由于命令执行导致的错误。后续命令行提示符（以
    `$` 字符结尾）的出现意味着命令已完成，你可以输入下一个命令。


    在 `bash` 中，许多技术使得输入和编辑命令行变得简单。例如，你可以使用键盘：


    | 键 | 说明 |

    | :--- | :--- |

    | `Ctrl-A` | 回到行首。通过按下 `Home` 键可以实现的结果。 |

    | `Ctrl-u` | 此命令应删除当前行； |

    | `Ctrl-C` | 终止当前命令的执行。 |


    你可以使用符号 `;` 在单行内输入多个命令。`bash` 会跟踪所有执行过的命令，使得返回并重复或编辑其中一个变得简单。从历史中选择所需的命令：`up`
    键显示上一个命令，`down` 键显示后一个命令，`this` 键显示下一个命令。要在不遍历整个历史记录的情况下找到特定的命令，按下 `Ctrl-R` 并输入要在搜索的命令中使用的关键词。


    历史记录记录的命令是有编号的——输入 `:` 来运行特定命令。


    `!` 命令编号


    如果你输入 `!!`，将执行你输入的上一个命令。


    在 Linux 上，软件和命令名称可能非常长。幸运的是，`bash` 会为你完成名称。你可以通过按下 `Tab` 键完成命令、程序或目录的名称。假设你想使用
    `bunzip2` 解压缩程序作为示例。输入：


    ```bash

    $ bu

    ```


    然后点击 `Tab` 键。如果没有发生任何事情，还有其他补全命令的。再次按下 `Tab` 键，你将获得以字母 `bu` 开头的名称列表。例如，框架包含这些程序：`buildhash`、`builtin`
    和 `bunzip2`：


    ```bash

    $ bu

    buildhash builtin bunzip2

    ```


    ```bash

    $ bu

    ```


    在输入 `n>` 后点击 Tab（bunzip 是唯一第三个字母为 `n` 的名称）。Shell 将为你补全名称的剩余部分，你现在只需按“Enter”键执行命令。


    `bash` 会在系统变量 `PATH` 指定的目录搜索从命令行调用的程序。默认，由 `./` 表示的目录（点斜）不包含在此目录列表中。你必须使用命令 `./prog`
    从目录运行程序。


    ## 4.4 Shell 脚本


    通常，你的 Shell 提示符中的信息是有用的。例如，如果你在 Ubuntu 系统测试箱上以 `rich` 身份登录，你的提示符看起来像这样：


    ```bash

    rich@testbox:~$

    ```


    你处于“Home”文件夹中，如波浪符号 (`~`) 所示。美元符号意味着 `bash` Shell 已经准备好让我输入命令。


    在介绍一些 Shell 的功能之前，我们想告诉你们另一种启动 Shell 会话的方法。你可能不会经常使用它，但在某些阶段可能会派上用场。首先，请记住，你的提示符包含在
    GUI 桌面中。


