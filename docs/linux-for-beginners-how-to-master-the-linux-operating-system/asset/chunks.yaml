    # Hardware Compatibility


    **SCSI controller**: `SCSI controllers` link disc drives and other peripherals
    to a PC in individual high-performance PCs and legacy workstations. If your PC
    has a `SCSI controller`, learn more about the controller''s make and model.


    **Sound card**: If your PC has a sound card and you want to use it with Linux,
    make sure the card is compatible. After successfully installing Linux, you can
    customize the sound card.


    **Video card**: In text mode, Linux works with any video card (also known as monitor
    adapter), but if you want the graphical user interface, you will need a video
    card that supports the `X Window System`. The installer can detect a supported
    video card and correctly configuring the `X Window System`. If the installer cannot
    detect your video card, knowing the make and model of the card is helpful.


    **Printer**: Its make and model must identify every printer you plan to use in
    Linux.


    Many Linux distributions, such as `Debian GNU/Linux`, will run on any hardware
    that supports the Linux kernel.


    To see if your PC''s hardware is compatible with a specific distribution, go to
    the vendor''s website and look at their hardware compatibility list.


    ## Freeing Up Space for Your Linux Distribution


    Windows is installed on a single large partition on a standard Windows PC, taking
    up the entire hard drive. To make space for Linux, you will need to shrink the
    partition. The installation software uses the free space for the Linux partitions
    during the Linux installation.


    There is no need to repartition your hard drive to try the Live CD distributions,
    such as `Ubuntu`. Simply boot your computer from the Live CD. You need not perform
    the repartitioning phase because the installers will shrink a Windows partition
    without destroying it. You must repartition your hard drive to install `Fedora`,
    `Debian`, or any other Linux distribution on it. You can use a commercial product
    to resize the disc partitions under Windows. You can boot a Linux distribution
    and then use `GParted` (the partition editor) to resize the Windows partitions.
    `GParted` can resize `NTFS` (NT File System) partitions used for all recent Windows
    versions.


    The risk of losing all the data on the hard drive when you resize the disc partition
    still exists. Make a backup of your hard drive before using a disc partitioning
    tool to resize partitions. Ensure you can recover your files from the backup after
    you have made your backup before doing something about the partitions.


    ### Follow these steps to shrink the Windows partition after Ubuntu boots, and
    the GUI desktop appears:


    1. From the `Ubuntu` desktop, choose `System Administration GParted`.

    2. The `GParted` window opens, and the tool lists the drives it discovers on your
    computer. The first hard drive is identified by the device name `/dev/sda`; the
    second is identified by the device name `/dev/sdb`, and so on.

    3. From the list of devices on the right side of the `GParted` window, select
    the hard drive.

    4. Pick the partition you want to resize from the list of partitions.

    5. Usually, the largest partition is this one. The partition class for `Windows
    10`, `Windows 8`, and other recent versions are `NTFS`, as shown by the `Type`
    column in the partitions list. Two partitions may be present in a typical new
    PC: a small `fat16` partition and a sizeable `NTFS` partition.

    6. Select `GParted Resize/Move` from the drop-down menu.

    7. The dialogue box for resizing partitions appears.

    8. Change the partition''s size and then press `Resize/Move`.

    9. After the partition, you can select a size that leaves you with at least `4GB`
    of free space. The `Free Space After` field in the dialogue box displays the size
    of the free space.

    10. When you have specified the adjustments you want to make, click `Apply` to
    start the process.

    11. Click `Apply` when the alert appears.

    12. All pending operations have been completed, the partition has been updated,
    and you now have free space after the Windows partition has been removed.

    13. After you have freed up the space for Linux, you can install your preferred
    Linux distribution.


    ## Try Out A Live CD Before Installing


    Try a Live CD or bootable USB version before installing something. You may typically
    perform a few additional preinstallation chores besides having a feel for a Linux
    desktop.


    For example, to start `Ubuntu`, boot your computer from the Live CD. A menu appears,
    allowing you to choose from several choices to control the boot phase or check
    your device to see whether it meets hardware specifications. You can choose the
    default choice for booting `Ubuntu` (which will be done automatically if you do
    not make a selection before the menu expires in 30 seconds).


    After a few minutes, the `GNOME GUI` desktop, which `Ubuntu` uses, appears, and
    you can explore `Ubuntu`. When you open the `Examples` folder, you will see several
    things `Ubuntu` can do. You may also use `System Administration GParted` to change
    the hard drive''s configuration.


    When done with `Ubuntu`, select `System Quit`, delete the DVD, and click `Enter`
    when `Ubuntu` has shut down. If you plan to install `Ubuntu`, start the process
    by clicking the `Install` icon on the desktop.


    # Installing Linux


    Bootable USB distributions have been around for a while, but they''ve always had
    flaws that kept me from using them. However, newer ones, such as `Fedora Media
    Writer` (https://github.com/MartinBriza/MediaWriter), have streamlined the development
    process to where most users can walk through it without assistance. The installation
    process is non-destructive, which means you can keep your existing files on the
    USB drive, and data persistence is easy.


    We will show you how to make a bootable flash drive and use it in your environment
    in the rest of this chapter.


    ## Making A Bootable USB Flash Drive


    While command-line methods in Linux can build a bootable flash drive, the most
    straightforward method is to use Windows. (we realize that making a Linux boot
    medium from Windows might seem heretical, but most users interested in a Live
    USB implementation of Linux are Windows users.) To make a bootable flash drive,
    follow these steps:


    1. Get the bootable software you want to use.

    2. Run the software after installation.

    3. Pick the flash drive in the `Target Device` section.

    4. The flash drive could have a name `TravelDrive` on it.

    5. Choose the source of the image (the `ISO` file).

    6. If your Internet connection is weak, you can use a single Live CD to pull the
    `ISO` file. Use the `Download` option to access an `ISO` file if you have a faster
    Internet connection.

    7. If asked, set persistent storage.

    8. The storage space allocated to the installation still available is known as
    persistent storage. We recommend a size of at least `300MB`.

    9. Press the `Create Live USB` button and wait for the process to finish.

    10. Expect a ten-minute wait for the process to end. On most hard drives, two
    directories are created: `syslinux` (less than `7MB` and responsible for booting)
    and `LiveOS` (the size of which depends on your storage setting).

    11. Exit the program and test the newly created bootable drive.


    ## Work Troubleshooting


    we tried multiple flash drives and never had a problem with any of them as long
    as there was `1GB` of free space after download. Smaller drives (`2GB` or less)
    are often factory-formatted with `FAT`, whereas larger drives are formatted with
    `FAT32`. Formatting had little effect on installation or usability, as far as
    we could tell.


    Ensure that the workstation''s settings enable it to boot from USB, which usually
    necessitates BIOS reconfiguration. To do so, take these steps:


    1. Restart the computer and press the key that takes you to the `BIOS` settings.

    2. This key is usually `F12` or `DEL`, but it may also be `F1` or `F2`.

    3. Go to the `Boot Menu` and select the `Boot USB Devices First` choice (or something
    similar).

    '
