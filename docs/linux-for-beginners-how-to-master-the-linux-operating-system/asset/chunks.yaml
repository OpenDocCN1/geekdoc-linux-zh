    Infrastructure mode describes how all wireless Ethernet cards communicate with
    one another and with the wired LAN through an access point. We will assume you
    have set your wireless Ethernet card to infrastructure mode for this chapter.
    This mode is called controlled in the configuration files.


    Wired Equivalent Privacy (WEP) is a feature of the `802.11` standard that protects
    wireless communications from eavesdropping. WEP uses a hidden key of 40 or 104
    bits exchanged between a mobile station (such as a laptop with a wireless Ethernet
    card) and an access point (also called a base station). Until data packets are
    transmitted, the secret key is used to encrypt them, and an integrity check is
    conducted to ensure that packets are not changed in transit.


    The `802.11` standard does not mention how the shared key is created. Many wireless
    LANs use a single key that all mobile stations and access points exchange. However,
    in a setting like a college campus, such a method does not scale well because
    the keys are shared with all users — and you know how it is when you share a password
    with hundreds of people. WEP is seldom used on large wireless networks, such as
    universities. Other authentication approaches, such as `SSH` (Secure Shell), must
    log in to remote systems in such wireless networks. Although WEP was once considered
    adequate for use on a home wireless network, it is no longer recommended.


    The Wi-Fi Alliance released a specification called Wi-Fi Protected Access (WPA)
    more than a decade ago, which replaced the previous WEP standard and enhanced
    protection by making a few improvements. Unlike WEP, which uses fixed keys, WPA
    uses Temporal Key Integrity Protocol (TKIP), which creates new keys for every
    10 KB of data sent over the network, making WPA more challenging to crack. Wi-Fi
    Protected Access 2 (WPA2), the second generation of WPA encryption, was launched
    by the Wi-Fi Alliance in 2004. WPA2 is based on the final `IEEE 802.11i` standard,
    which uses public-key encryption with digital certificates and a `RADIUS` (Remote
    Authentication Dial-In User Service) server for authentication, authorization,
    and accounting in wireless Ethernet networks. WPA2 encrypts data using the Advanced
    Encryption Standard (AES). WPA3, which was recently revealed, seems to be the
    way of the future, aiming to raise security even further.


    ## Main Protocols of the Internet


    The Internet Protocol establishes network boundaries and relaying datagrams that
    allow internet networking.


    The structure consists of a header and a payload, the header of which is considered
    the primary IP address and interfaces linked using specific parameters. Internal
    and external gateway protocols, and routing prefixes, and network designation,
    are all concerned. End-to-end protocols play a role in the reliability, but expect
    the framework to look like this:


    | | UDP Header | UDP DATA → Transport |

    | :--- | :--- |

    | IP Header | IP Data → Internet |

    | Frame Header | Frame Data | Frame Footer → Link |

    | Data | Application |


    ## Obtaining Information about Peers


    To get peer information, return all TCP and IP information. Both the server and
    the client are linked to the network this way. You may also use the `getpeername()`
    socket to capture and save information when it becomes usable quickly. This includes
    the correct data to be sent and retrieved by different Linux methods and proper
    socket descriptors and rights for those in the program. Some can also be considered
    private to improve the user experience.


    Allow the socket `TCPAcceptor::accept()` to be prevalent in the network to accept
    data. You can say the difference between server and client behavior this way.


    ## Creating and Destroying


    These are linked to the socket''s descriptor and allow peer TCP Ports and IP Addresses
    to be displayed onscreen. Unlike its Linux predecessors, this uses no other languages
    other than `C++`.


    Destructors could then break any links you have made. To log out of one of your
    social networking accounts, for example, do so because destructors are present.


    Most Linux distributions have many programs that can be used for most of your
    everyday computing needs. Most of these programs can be accessed from your distro''s
    GUI desktop.


    Almost every Linux program has a dedicated website where you can find extensive
    information about it, including where and how to download it. Each distro comes
    with its collection of utilities and applications you can install when you set
    up your system.


    If a Debian or Debian-based distro, such as Ubuntu, lacks an app, you can quickly
    get it as long as you have a high-speed internet connection.


    ## Linux and SMTP Client


    SMTP Client is likely to use some of the same characters as before, with a few
    tweaks. This is all about opening the socket, opening the input and output sources,
    reading and writing the socket, and cleaning up the client portal. Also, be mindful
    that it entails:


    1. Transmission of datagrams. This means that if your portal sends datagrams to
    different clients and servers, local sockets will operate.

    2. Linux Communications Stream and datagram communication.

    3. Socket Programming.


    ## Echo Client Set-ups


    In Linux, Echo Clients operate by passing arguments to the `socket()`, which means
    you can use the IP with the `PF INET` feature to put them both in the same TCP
    socket. To build a proper client structure, remember that you will need to improve
    previous codes.


    ## The Sockets in Linux


    Also, be aware that you can code Linux in `C` because they both use sockets. The
    `socket` acts as a bridge between the client and the port and sends the requests
    to the server while waiting for it to respond. Finally, data transmission and
    reception are completed.


    Simultaneously, the Linux Socket will build a socket for the server, connecting
    itself to the port. You can listen to client traffic as it builds up. You could
    also wait for the client to arrive at that stage and watch the data submitted
    and received. The following are some of its other functions:


    | socket_description | Description |

    | :--- | :--- |

    | `socket_description` | This allows both the client and the server''s details
    to appear onscreen. |

    | `write buffer` | This identifies the information. |

    | `write buffer length` | You will need to look at the output of the string to
    write the buffer length. |

    | `client_socket` | The socket definition will appear. |

    | `address` | This is used in the `link` function to keep the address line at
    the top of the stack. |

    | `address_len` | This will appear onscreen if the second parameter is null. |

    | `return` | This aids in the return of both the client and the socket outline.
    Interaction between the client and the server is often simplified because of this.
    |

    | `server_socket` | This is the Description of the top-of-the-head socket. |

    | `backlog` | This is the number of demands that have yet to be fulfilled. |


    ## 6.4 Diagnostic Commands and Files


    Setting up Transmission Control Protocol/Internet Protocol (TCP/IP), like almost
    everything else in Linux, involves preparing a slew of configuration files (text
    files you can edit with any text editor) and commands. The `/etc` directory contains
    the majority of these files. The Linux installer tries to help pre-filling values
    and remove the need for you to communicate directly with each TCP/IP configuration
    file. However, if you know the file names and their purposes, manually editing
    the files (if necessary) is always easier.


    When you install Linux, you can set up TCP/IP networking. However, to control
    the network successfully, you will need to become familiar with the TCP/IP configuration
    files and be able to edit them if necessary. (For example, to verify if the name
    servers are correctly listed, you will need to know about the `/etc/resolv.conf`
    file, which stores name server IP addresses.)


    | File Name | Contents: |

    | :--- | :--- |

    | `/etc/hosts` | IP addresses and hostnames for your local network and any other
    systems you access often |

    | `/etc/host.conf` | Instructions on how to translate hostnames into IP addresses
    |

