    移动操作系统满足平板电脑和智能手机等移动通信设备的特定需求。与传统 PC 相比，移动设备的计算能力通常很小，因此操作系统在规模和复杂度上也必须缩小，以减少资源消耗，同时为计算机上运行的应用程序保留足够的资源。移动操作系统重视高级功能、用户访问性以及流媒体传输等数据处理功能。移动操作系统包括
    Google 的 `Android` 和苹果的 `IOS`。


    ## 嵌入式操作系统


    并非所有计算机都是多功能的。需要操作系统的设备可以用于各种便携设备，如虚拟家庭助手、ATM 机机、飞机系统和物联网（`IoT`）系统。主要的区别在于，相应的计算设备只负责一件事，因此操作系统经过了规模缩小，并侧重于效率和韧性。为了在所有情况下都能保持运行，操作系统应该运行快速、不发生故障，并优雅地管理所有错误。通常，操作系统存储在内置计算机本身的芯片组上。例如，嵌入式操作系统可以用于生命支持系统的医疗部分，并且必须持续运行以维持医疗机构的正常工作。


    ## 网络操作系统


    `NOS` 是一种定制的操作系统，旨在使局域网内设备之间的连接更加容易。网络操作系统（`NOS`）提供了理解网络协议以及构建、交换和拆解网络包所需的连接堆栈。由于其他类型的操作系统大多数都管理网络通信，专门的
    `NOS` 在今天基本上已经过时了。


    ## 实时操作系统


    实时操作系统在实时范围内运行。当计算机系统必须在一致且可重复的时间限制内与世界通信时，计算机制造商可能会使用实时操作系统。例如，先进的制造控制系统可以引导大型工厂或发电站的操作。此类设施可以从各种传感器和信号控制阀、电机以及各种其他设备产生信号。在这种情况下，工业管理系统必须对不断变化的现实情况做出快速、准确的反应。否则，可能会发生悲剧。在其他形式的操作系统中合理的缓冲、加载通信延迟和其他停顿，在
    `RTOS` 中是不允许的。


    ## 1. 作为操作系统的 Linux


    `Linux Kernel` 是一个开源 Unix 类操作系统的基础。Linus Torvalds 在 1991 年首次发布了它。它是一个开放且免费的操作系统，代码可以更新并传输给任何人用于公司或商业目的。


    在某些方面，`Linux` 与你过去可能使用的其他几个操作系统（如 `Windows` 或 `Mac OS`）是相同的。`Linux` 在其他操作系统中也具有图形用户界面以及你所熟悉的软件，例如文本处理器、图片编辑器和视频编辑软件。在某些情况下，程序开发者可能为与你在其他平台上使用的完全相同的程序创建一个
    `Linux` 版本。简而言之，任何可以使用 pc 或 笔记本电脑设备的人都可以使用 `Linux`。


    然而，`Linux` 在几个方面与其他系统不同。最重要的是，`Linux` 是免费开源软件。`Linux` 的源代码是开源的，并且任何具备技能的人都可以免费下载、更新和贡献。


    `Linux` 的独特之处还在于，虽然 `Linux` 的核心组件是广泛可用的，但有多个 `Linux` 发行版可供选择，每个发行版都有其自己的软件替代方案。这表明
    `Linux` 是具有适应性的，因为可以替换的不仅是网络浏览器和文字处理器等程序。`Linux` 用户还可以自定义关键组件，如平台的视觉化界面和其他元素。


    无论你是否意识到，你可能仍在使用 `Linux`。根据你所参考的消费者调查，运行 `Linux` 的服务器创建了互联网上三分之一到二之三的所有网站。


    个人和公司倾向于将 `Linux` 用于数据库，因为它是稳定、可扩展的，并来自广泛用户社区的优优质服务。


    你拥有的许多设备运行着 `Linux`，包括 `Android` 手机、`Chromebooks`、电子存储设备、便携式摄像机、可穿戴设备等。在你车辆的引擎内部，`Linux`
    正在运行。作为 `Linux` 操作系统框架的一部分，`Microsoft Windows` 也包含了 `Linux` 组件。


    不熟悉 `Linux` 的用户经常会忽视它，错误地认为这是一个复杂且具有挑战性的操作系统。尽管如此，近年来 `Linux` 操作系统正变得比它们的 `Windows`
    竞争对手更面向用户，因此尝试一下 `Linux` 是判断 `Linux` 是否适合你的最佳方法。


    ### Linux 的优点


    1. `Linux` 最大的优势在于它是一个开源操作系统。这确保了源代码对所有人开放，并且你可以与任何人贡献、更改和共享代码。

    2. `Linux` 比任何基于稳定性的操作系统都更稳定。这并不是说 `Linux` 是安全的。它确实有漏洞，但比其他任何操作系统都更容易受到攻击。不需要防病毒软件。

    3. `Linux` 更新简单且定期。

    4. 有许多 `Linux` 发行版可根据你的需求或喜好进行选择。

    5. `Linux` 是一个可以从互联网下载的免费操作系统。

    6. 它在社区中拥有大量的关注者。

    7. 它具有高水平的稳定性。它几乎不会停止或崩溃，短时间内后不需要重启。

    8. 它保护用户的隐私。

    9. `Linux` 操作系统的效率高于其他操作系统。它让大部分个人能够执行所有任务并对其进行有效管理。

    10. 它适合在网络上使用。

    11. `Linux` 有很多多功能。你不需要安装整个 `Linux` 套件。你只需要安装所需的组件。

    12. `Linux` 可以读写各种格式的文件。

    13. 从网络安装快速又方便。它可以安装在任何硬件上，包括你的旧电脑。

    14. 即使硬盘空间有限，它也能正确完成所有任务。


    ### 从 UNIX 到 Linux


    `Linux` 操作系统是中小型企业的理想选择，现在经常被用于原本 `UNIX` 曾唯一选择的大型企业。`Linux` 曾被认为是一个有趣的研究项目。在大多数以网络和多用户通信为主要关注点的大型组织中并未将
    `Linux` 视为一种选择。然而，随着大型软件公司将其软件迁移到 `Linux` 以及该操作系统广泛分发的能力，它已成为 Web 托管和业务应用程序的可行选择。


    然而，在某些情况下，`UNIX` 是或曾是直接解决方案。如果一家公司使用超过 8 个 CPU 的巨大对称多处理程序或结构，它必须运行 `UNIX`。`UNIX`
    在高效管理所有操作方面比 `Linux` 强大得多。但自 2004 年以来，世界上使用 `Linux` 的超级计算机已超过了 `UNIX`。


    由于 `Linux` 是一个开源操作系统，它可以免费提供。任何人都可以从杂志、出版物或互联网获取 `Linux` 副本。组织通常为供应商支付服务合同费用，而不是服务器版本的软件费用。主要的服务器设备制造商是
    `IBM`、`Hp` 和 `Dell`。


