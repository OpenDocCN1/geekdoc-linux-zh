    # Chapter 7: Alternatives to Windows Applications


    “What application is available on Linux?” and “Would I be enabled to utilize my
    preferred applications and programs on Linux?” are two of the most commonly asked
    questions about Linux.


    While the same program might be readily accessible on Linux sometimes, it is not
    in the majority of the cases. The best part is that Linux has a multitude of substitutes
    to the most common Windows programs.


    This chapter will teach you about some of the finest applications for Linux. We
    will look at Microsoft Office, Photoshop, Internet Explorer, Windows Media Player,
    Adobe Reader, and other software alternatives.


    ## 7.1. Microsoft Office Substitute


    Productivity is an essential feature of every operating system or platform. Fortunately,
    Linux has a wide range of productivity applications, including office suites.


    The majority of MS Office substitutes for Linux may download and be used to access,
    modify, and generate documents in many file types, including `.xlsx`, `.docx`,
    and `.pptx`.


    ### LibreOffice


    On Linux, LibreOffice is commonly regarded as the best Microsoft Office substitute.
    Many Linux computers and distros come with it as the standard office suite. It
    is partly because it is free and open-source. This is because it is amazing. It
    is not Microsoft Office, but it is a substitute, and becoming used to Libre Office
    will be difficult at first if you are used to Microsoft''s offering.


    As you get used to it and become more familiar with it, you will discover that
    Libre Office is just as feature-rich, if not more so. LibreOffice is a fork of
    OpenOffice, which was widely used before LibreOffice. Since it is open-source
    software, it has access to a large developer community. Essentially, everyone
    can help with the venture. LibreOffice supports plug-ins to make it simpler for
    sure developers.


    If there is anything you think is missing, look around to see if you can find
    an extension that incorporates the feature/function you are looking for. It is
    compatible with all three big desktop operating systems, and Linux.


    **Advantages:**

    1. It is open-source and free.

    2. Full functionality is provided.

    3. Compatibility with Microsoft Office file types is excellent.


    **Downsides:**

    1. The style is obsolete.


    ### Apache OpenOffice


    OpenOffice is based on the same framework as LibreOffice and also has a lot in
    common with it. Due to the long development cycle, it lags behind LibreOffice
    in terms of development. One of the critical reasons LibreOffice broke away from
    them was because of this.


    Apache OpenOffice is a reasonable MS Office replacement for Linux. Years of development
    and testing have gone into it, and it, like LibreOffice, is cross-platform. It
    has a lot of features for making papers, presentations, and sheets. This substitute
    office suite incorporates Microsoft Office formats besides the traditional open
    document format.


    This ensures that the documents you distribute or obtain from Microsoft Office
    users are compatible.


    **Advantages:**

    1. A familiar and straightforward user interface.

    2. The Apache license is used.

    3. Many languages are supported.


    **Negative aspects:**

    1. Microsoft Office file formats have little support.


    ## 7.2 MS Notepad Substitute


    Notepad is a standard source code and text editor among programmers and the public
    but it is only compatible with Windows. On Linux, however, there is a range of
    competent or even superior alternatives.


    ### Vim


    Vim is, without question, one of the most helpful word processors for programming
    in Linux. Since its emergence as `Vi`, it has gained widespread popularity and
    has developed itself as among the most influential editors in the Unix world.
    Consider `Vim` highly recommended if you are searching for a compact, revolutionary,
    and configurable Notepad alternative for Linux. Multi-level undo chains, comprehensive
    support for various plug-ins and file types, and fully prepared compatibility
    with many tools are just a few of `Vim`''s notable features.


    **Some Notable features of Vim:**

    1. `Vim`''s multi-level undo framework is unique in how it gives you complete
    control over your source code while also allowing you to experiment.

    2. It provides scripting features and comprehensive support for a handful of computer
    languages and file formats.

    3. `Vim` is exceptionally secure, and it can quickly meet the needs of even the
    most demanding users.

    4. It, along with `Emacs`, is among the most versatile text editors, allowing
    for a wide range of changes with minimal effort.


    ### Gedit:


    Gedit, like Notepad++, is a small but powerful code editor that runs on Linux,
    Microsoft Windows, Mac OS, and BSD. External scripting, resources, and snippet
    compilation, among other features, are all supported extensively. `Gedit` comes
    with support for `FTP`, `SSH`, `HTTP`, and `WebDAV`, among other secure data editing
    protocols. If you are running Ubuntu or another GNOME-based operating system,
    `Gedit` is probably already installed.


    **Salient Features:**

    1. `Gedit` is highly customizable, with scripting languages such as `HTML`, `C`,
    `C++`, `Python`, `XML`, and `Perl` provided.

    2. Compared to other close Notepad alternatives, the find and replace feature
    is excellent, and regular expressions are supported.

    3. `Gedit` has a plug-in framework that lets users add additional features for
    a much more interactive performance.

    4. It was first published over two decades ago, but it is still constantly operated
    and maintained.


    ## 7.3 Internet Explorer/Microsoft Edge Substitute


    Though Internet Explorer has traditionally been the standard web browser for Windows,
    Linux users have access to various complementary and particularly unique browsers.
    There''s undoubtedly an alternate browser to choose from for you if you are tired
    of using Microsoft Edge and need a browser to complete a specific project.


    ### Brave:


    Brave reached the browser business in 2016. Brave is browser-centered on the accessible
    Chromium browser and has great ad and tracking service blocking capabilities.
    Brave became one of the increasingly commonly preferred browsers in 2019, thanks
    to its unique privacy features.


    Brave recently launched the Basic Attention Token (`BAT`), a cryptocurrency used
    to compensate users for displaying ads distributed via Brave''s privacy-focused
    advertisement network. Users can also use `BAT` to “tip” sites, have Brave distribute
    `BAT` to the pages they visit randomly or hold the `BAT` for trading them in for
    cash.

