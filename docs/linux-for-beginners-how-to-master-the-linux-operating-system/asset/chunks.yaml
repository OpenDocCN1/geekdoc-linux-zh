    files you can edit with any text editor) and commands. The /etc. The directory
    contains the majority of these files. The Linux installer tries to help pre-filling
    values and remove the need for you to communicate directly with each TCP/IP configuration
    file. However, if you know the file names and their purposes, manually editing
    the files (if necessary) is always easier.


    When you install Linux, you can set up TCP/IP networking. However, to control
    the network successfully, you will need to become familiar with the TCP/IP configuration
    files and be able to edit them if necessary. (For example, to verify if the name
    servers are correctly listed, you will need to know about the /etc/resolv.conf
    file, which stores name server IP addresses.)


    | File Name | Contents: |


    | /etc/hosts | IP addresses and hostnames for your local network and any other
    systems you access often |


    | /etc/host.conf | Instructions on how to translate hostnames into IP addresses
    |'
