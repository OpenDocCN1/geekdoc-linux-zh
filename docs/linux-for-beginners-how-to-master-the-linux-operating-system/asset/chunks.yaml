    Including more compatible hardware platforms in a Linux kernel is another significant
    enhancement. The system''s architecture encourages extensibility by breaking down
    all equipment code into separate modules in each module. By re-designing only
    the device parts of the kernel, a few developers can port the Linux kernel to
    something like a major hardware framework.


    ## 1. File Hierarchy Structure of Linux


    The directory configuration in Linux is similar to that of a tree. The root of
    the Linux system file structure is where it all starts. All begin at the base,
    but directories expand off it.


    In Linux, a forward slash (`/`) is used to separate directories. "Forward slash"
    is called "slash" when discussing files and directory routes. Since the complete
    reference to it is `/`, the system files'' origin is often linked to as "slash."
    The origin directory is referred to when someone says, "check-in slash" or "the
    directory is in slash."


    Executable or binary files are found in the `/bin` directory. Applications are
    developed in source code, which is plain text that individuals can interpret.
    After that, the data is processed into machine-readable binaries. Computer code
    is a sequence of zeros and ones, so they are called binaries. The most important
    thing to remember is that functions, applications, and programs can often be found
    in `/bin`.


    The `/etc` directory contains configuration files. Configuration files regulate
    the behavior of the operating system and applications. For example, a file in
    `/etc`, for example, instructs the operating system to either boot into the graphic
    mode or text mode.


    ![image2.png](Images/image00122.jpeg)


    ## 2. The Process Architecture of Linux


    Inside the operating system, processes perform the tasks. Software is machine
    language data and instruction in an interactive image on a disc. A process is
    a software program in motion.


    It is a complex object continuously evolving as the processor executes machine
    code commands. The process contains the program counter, including all the CPU''s
    logs and the process frames, including temporary files such as task parameters,
    return links, saved quantities, and the program''s data and instruction. The current
    operation in the processor is included in the executing program or method. Linux
    is an operating system that supports multiple processors. Processes are specific
    activities with their own set of rights and obligations. When one process fails,
    it does not affect other processes in the system. Each process has its virtual
    memory and can only communicate with other processes via stable, kernel-managed
    frameworks.


    A process can consume a lot of system resources throughout its existence. It will
    operate its commands on the device''s CPUs and store itself and its data in the
    system''s memory space. It can open and use files inside the file servers and
    use the electronic components in the process explicitly or implicitly. Linux can
    keep a record of the process and the device resources available to it to handle
    and the other operations in the system equally. If one process constrained much
    of the system''s memory space or CPUs, it would be unfair to other operations
    in the system.


    The CPU is the most valuable resource in the system, and there is typically only
    one. Linux is a multitasking operating system that runs a process from each CPU
    throughout the system at all points of time to optimize CPU utilization. When
    there are more operations than CPUs, the remaining processes should wait for a
    Processor to become available before they can function. Multiprocessing is a straightforward
    process. A process runs until it needs to wait for something, usually a system
    resource. Once it has that resource, it can run again. The CPU may remain idle
    in a unit-processing framework, such as `DOS`, and the waiting period would be
    wasted. Many processes are stored in memory at one time in a multiprocessing system.
    When a process is forced to wait, the OS shifts the CPU from that operation to
    another, more worthy process. The scheduler determines which operation is the
    most suitable to run immediately, and Linux employs a variety of scheduling techniques
    to ensure consistency.


    Linux supports various binary file formats, including `ELF` & `Java`, which must
    be handled equitably.


    Linux facilitates real-time processes in addition to standard processes. These
    processes must respond to external factors rapidly, and the scheduler treats them
    differently than regular user processes. Even though the `task struct` system
    architecture is diverse and complicated, its domains can be separated into several
    functional departments:


    ### State

    A process''s condition varies as it operates, depending on the situation. The
    following are the phases of Linux processes:


    ### Running

    The program has either been operating (it is the system''s present process) or
    prepared to run (it is awaiting assignment to one of the device''s CPUs).


    ### Waiting

    The process is preparing the occurrence of an incident or the availability of
    a resource. Linux distinguishes between time-limited and uninterruptible waiting
    processes. Signals can disrupt interruptible working processes, while uninterruptible
    working processes depend on hardware parameters and cannot be disrupted under
    any conditions.


    ### Stopped

    The phase has come to a halt, generally because of receiving signals. A reimplemented
    process can be on hold.


    ### Zombie

    This is a stopped process with a `task struct` data model in the process vector
    for some cause. It is precisely what it looks like: a dormant procedure.


    ### Scheduling Data

    This data is obtained by the scheduler in particular for it to reasonably determine
    which operation in the system needs to run.


    ### Identifiers

    A process identifier is assigned to each process in the system. A process identifier
    is just a number, not an iterator, into the process vector. Each process often
    has user and group identifiers, which are used to restrict access to the platform''s
    files and equipment.


    # Chapter 2: Decide Your Distribution


    Linux distributions implement open source code into a single platform that can
    then be mounted and booted. Linux distributions are also available for personal
    computers, non-graphical servers, server farms, handheld devices, and special
    applications such as home theatre Computers and embedded systems. Anyone may build
    their latest Linux distribution by building it from source code or changing an
    existing distribution. Over 300 Linux distributions are kept and maintained at
    the moment.


    ## 2.1 What is a Linux Distribution?


    A Linux distribution, also known as a Linux Distro, is a computer operating system
    made up of components created by different open source developers and software
    developers. The Linux kernel, the GNU shell utilities, the desktop environment,
    the X server, an installer, a package management system, and other resources are
    all included with each distribution. Many elements are created independent of
    one another and distributed as source code. A web browser, productivity tools,
    and other applications, like the `KVM` hypervisor, are also included in most distributions.


    A distribution is an entirely composed Linux system kit. A Linux distribution
    includes the GNU project tools, the Linux kernel, and a variety of open-source
    application projects that add to the system''s capabilities.


    There are various Linux distributions available to satisfy almost every computing
    need. The majority of Linux distributions are tailored to a particular user community,
    such as corporate customers, media hobbyists, computer programmers, or regular
    end-users.

