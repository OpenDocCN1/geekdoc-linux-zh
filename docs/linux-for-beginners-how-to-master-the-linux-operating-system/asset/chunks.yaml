    desktop. Ctrl+Alt may switch to a virtual terminal by anyone. So, before you leave
    your machine, log out of your virtual terminals.


    When you have had your fill of this little trick, exit (literally, type exit)
    to log out of any VTs you have opened and click the Ctrl+Alt shortcut to return
    to your graphical desktop and bash prompt. After that, you will see what all the
    fuss is about with this shell gadget.


    4.5 Basic Command Line Editing


    Since a shell interprets what you write, it is crucial to understand how the shell
    interprets the text you enter. This is the general format of all shell commands:


    command option1 option2 … optionN


    A command line is a term for a single line of commands. You enter a command accompanied
    by one or more optional parameters on a command line (or arguments). These command-line
    options (or arguments) allow you to decide what the command should do.


    To separate the command from the options and separate options from one another,
    use a space or a tab. You must place a choice that includes embedded spaces inside
    quotation marks to use it. Enter the grep command to scan for two words of text
    in the password file, for example. (grep is a command that searches for text in
    files in a cryptic manner.


    grep "WWW daemon" /etc/passwd


    The output of grep on the line containing those words looks like this. (What you
    see on your screen can not be the same as what we show.


    wwwrun:x:30:8:WWW daemon apache:/var/lib/wwwrun:/bin/false


    If you built a user account with your name, use the grep command with your name
    as an argument, but remember to quote the name if it contains spaces.


    As you understand the command line, you can discover some keyboard shortcuts to
    make your life easier. In this segment, we will show you how to use some of the
    bash shell''s features to make your command-line experience as fun as possible.
    Command-line completion, editing, and using the background of entered commands
    are among these functions.


    You can ask Linux to finish a command or filename for you.


    Given you type much more on the command line in Linux than you would in a GUI
    environment, a feature that allows you to use typing shortcuts wherever possible
    is useful. The shell''s Command completion feature completes filename and system
    commands.


    Since the Linux file system can deal with nearly infinite filename sizes, many
    filenames can become enormous. It''s time-consuming to type these long filenames.
    Thankfully, command completion makes typing a command or a long filename a breeze.


    Use command completion for one of two things: entering a command or finishing
    a filename.


    Performing a command


    Consider the following scenario: you want to type a command, but all you know
    is that it starts with the letters up and is expected to return the time since
    the machine was rebooted. At the command prompt, type up and then press Tab:


    rich@testbox:~$ up[TAB]


    One of these scenarios occurs:


    1.  If the search path (directory locations for searching for programs; type echo
    $PATH to discover what yours is) includes only one matching command, the command
    line is completed with that command, and the machine waits for you to press Enter
    to execute it.


    1.  A beep implies that more than one command begins with the letter up. Press
    Tab a second time, and the options will appear. Locate the command on the list
    and type it until the first letters are distinct, at which point you can complete
    the command by pressing the Tab key. There is no match if nothing is displayed
    after pressing Tab twice.


    Completing a File Name:


    Do not type the first few characters and then press Tab to get command-line completion.
    If you are typing a filename on the command line, you have to type the first few
    characters and then press Tab. The shell typically scans the current working directory
    for filenames that fits what you have typed and then completes the command line
    filename. If more than one file contains the letters you type, you will hear a
    beep and need to press Tab again to see a list of options, just as with the command-completion
    function.


    It takes some getting used to, but once you have mastered the Tab key and the
    shell command-line completion function, you will wonder how you managed without
    it.


    Browsing your command history


    It is sweet of the shell to remember what you have done. The shell''s ability
    to keep track of commands helps you to easily return to those obscenely long commands
    you pecked at a long time ago — even days ago! For example, suppose you located
    and removed all of your system''s core dump files (core dump files are huge files
    containing debugging data that only an expert programmer or your machine would
    understand). The command was something along these lines:


    find / -name core -exec rm {} \;


    To re-run the command, retrieve it from your shell history and rerun it. The easiest
    way is to type. Find and press “Enter” (if you are repeating the exact version
    of the command you used last time, which is the find command). This instructs
    your system to search your history for the last instance of find in the list and
    rerun it.


    If you have run the find command more than once and want to make sure you are
    re-running the correct version, you will need to look at your command history.
    By pressing the up-arrow key repeatedly before reaching the command you want to
    re-execute, you can do so line by line. Press the Enter key to rerun the command.


    When you enter the history command at the prompt, it displays your last 20 commands
    (by default), if you are curious about what they were.


