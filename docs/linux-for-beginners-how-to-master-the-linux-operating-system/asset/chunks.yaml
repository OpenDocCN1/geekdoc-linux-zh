    Since virtualization introduces overhead, do not presume them to run as quickly
    as they would if you mounted the interface on actual devices. Virtual machines
    do not work well with challenging games or other applications that need a lot
    of visuals and Processor speed, so they are not the best way to run `Windows`
    games on `Mac OS X` or `Linux` not unless they are old or not graphically intense.


    Companies introduced server virtualization to better use their physical servers''
    processing resources, reducing the necessity for server farms and saving resources
    in the data center. `VMs`, as we recognize them today, grew in popularity over
    the last 15 years. Independent server hardware was not needed for each app since
    it could operate on a single specific host with various `OS` specifications.


    There can be two types of virtual machines: process virtual machines, which isolate
    a single function, and virtual system machines, which isolate the application
    or system from the computer system. The `NET Framework`, the `Java` virtual machine,
    and the `Parrot` virtual machine are process virtual machines.


    `Hypervisors` are used by `system VMs` as a middleman, allowing software to access
    system resources. `Intel/Linux Foundation (Xen)`, `VMware (ESX/ESXi)`, `Oracle
    (Oracle VM Server for x86 and MV Server for SPARC )`, and `Microsoft` are all
    top players in the hypervisor domain (`Hyper-V`).


    Digital machines can be used on desktop computers. A `Mac` user using a virtual
    `Windows 10` version on their actual `Mac` hardware is the most obvious example.


    ## Practical Uses of Virtual Machines


    `Virtual Machines` can be used for multiple. Some are listed below:


    - **Experiment with different platforms**: Installing different `Linux` distributions
    across a virtual machine allows you to try them out and learn how they operate.
    Operating `macOS` on `Windows 10` inside a virtual machine allows you to familiarise
    yourself with various operating systems you may want to use full-time.

    - **Consolidate servers**: Businesses with multiple servers can virtualize some
    servers and execute them on a single device. Because each `VM` is a self-contained
    compartment, it avoids the security issues that come with running multiple servers
    on the same `OS`. Virtual machines could also be relocated from one physical server
    to another.

    - **Use apps that demand an old operating system**: If users'' critical application
    requires `Windows XP`, users can run it in a virtual machine with `XP` installed.
    This enables users to use the software only compatible with `Windows XP` without
    having to install it. This is significant because `Microsoft` no longer supports
    `Windows XP`.

    - **Test applications on different platforms**: You can download each operating
    system in a `VM` to evaluate how an application performs on multiple platforms.

    - **Use software created for a different operating system**: Users of `Linux`
    and `Mac os` can run `Windows` in a `VM` to run `Windows` applications on their
    desktops without worrying about compatibility issues. Games, regrettably, are
    an issue. Virtual machine systems add overhead, and 3D games in a `VM` would not
    run smoothly.


    People can execute multiple `OS` implementations on a specific device since the
    program is segregated from the actual host computer, improving efficiency, financing
    costs, and physical space. Another benefit of virtual machines is that they can
    run legacy applications, diminishing or reducing the need for and expense of transferring
    an outdated app to a newer operating system.


    Developers use virtual machines (`VMs`) to test applications in a secure, virtualized
    environment. It can also aid in the isolation of ransomware that can infect a
    specific `VM` case. As malicious software within a `VM` cannot interact with the
    host system, it cannot do as much harm.


    There are a few drawbacks to Virtual machines. Running multiple virtual machines
    on a single physical host can cause performance issues, particularly if the architecture
    specifications for a specific application are not met. Although particularly compared
    to a computer system, this renders them less powerful. The majority of IT operations
    use a mix of virtual and physical structures.


    Virtualization software is the key to operating databases in virtual machines.
    Virtualization software comes in a variety of options. The most common in the
    `Linux` sector are:


    1. `KVM`: It is an open-source initiative that integrates with the `Linux` kernel
    directly. It can only run on systems with a virtualization-capable CPU.

    2. `VirtualBox`: An `Oracle`-sponsored project that installs in any `Linux` distribution,
    regardless of kernel or CPU type.

    3. `VMware Server`: It is a software package offered by `VMware` that runs on
    `Windows`, `Mac OS X`, and `Linux` hosts and is available in both free and commercial
    versions.


    These virtualization software bundles install on a `Linux` host and allow users
    to simultaneously access multiple virtual network operating systems, like `Linux`
    and `Windows`.


    In this chapter, we will show you how to set up and use `Oracle VirtualBox` and
    how to run a `Linux` workspace as a virtual machine.


    ## Installing a Virtual Machine


    The first move is to install `VirtualBox`. This bundle may be available in the
    distribution software repository, depending on your `Linux` distribution. The
    `VirtualBox` software kit is included in the standard software repositories for
    both `Ubuntu` and `OpenSUSE`.


    Install it on your device using the `Ubuntu Software` program or the `openSUSE
    Software Center`. The package appears in the device launcher after it has been
    installed.


    If your `Linux` distribution does not include `VirtualBox`, or if you just want
    to make sure you have the most recent update, you can get it directly from the
    `VirtualBox` website and install it from there. `VirtualBox`''s website has installation
    packages for several popular `Linux` distributions (including `Ubuntu` and `OpenSUSE`).
    It is critical to choose the correct `VirtualBox` version for your `Linux` distribution
    while downloading the program.


    The processes to download and install the `VirtualBox` kit from the website are:


    1. Go to `http://www.virtualbox.org` in a web browser.

    2. Even though `Oracle` sponsors the `VirtualBox` project, it has its website
    with download files, documentation, and a community forum.

    3. Click the `Downloads` tab on the main web page, on the left-hand side.

    4. Determine the `Linux` platform''s latest `VirtualBox` edition.

    5. This applies to the host site you have chosen. Other operating systems, like
    `Microsoft Windows`, can also be run inside the `VirtualBox` program.

    6. `VirtualBox` is available for both `Microsoft Windows` and `Apple''''s Mac
    OS X`. If you are nervous about installing `Linux` on an existing `Windows` or
    `Mac` system, you can use `VirtualBox` to operate `Linux` in a virtual machine
    on the existing system. Running a `Linux` distribution as a virtual machine within
    `VirtualBox` in your `Windows` or `Mac OS X` environment is the same as running
    it in a `Linux` host environment, as mentioned in this chapter.

    7. Click on the specific link that corresponds to your `Linux` distribution and
    version.

    8. Match the delivery version to the operating system you are using. If a `VirtualBox`
    version for your particular version is not yet available, grab the most recent
    version available. Chances are there that it''ll still work.

    9. When the download begins, save the package to your computer''s hard drive.

    10. The installation procedure is lengthy and prone to failure. It is a safe idea
    to download the whole kit to your hard drive and install it from there.

    11. Open your file manager and locate the `VirtualBox` installation package file.
    Double-click the package file.


    1. To remove and install the. `Deb` package in `Ubuntu`, you must first install
    a `Package Manager` application. The `openSUSE Dolphin` file manager knows what
    to do automatically.

