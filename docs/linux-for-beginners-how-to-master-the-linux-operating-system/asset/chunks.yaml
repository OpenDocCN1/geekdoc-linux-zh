    如果你想要可以在任何设备上运行的合法的免费编辑软件，选择 Photopea 绝不会错。如果你不喜欢显示的广告，也可以免费访问。


    ## 7.5 Movie Maker 替代品


    Windows Movie Maker 是视频制作与视频编辑被视为简单任务的主要原因之一，因为该软件允许开发者使用各种效果融合多个视频等。它的界面非常简单，几乎几乎任何用户都能在几秒钟内掌握其机制。然而，如果你认为
    Movie Maker 在某些方面缺乏功能，包括当你需要额外功能或要在无法访问 Movie Maker 的系统上编辑视频时，这是可以理解的。但是对于视频处理，你可能需要一个更复杂的环境。以下是在使用
    Linux 时你可以选择的几个 windows movie maker 替代品：


    ### Shotcut


    Shotcut 是一个用于 Linux 的视频编辑应用，它的特殊之处在于其用户界面看起来像媒体播放器而不是编辑器。凭借其丰富的功能集合，该应用让视频编辑变得轻而易举。它足以应付大多数用途，但如果你需要更强大的功能（例如专业或高级的视频录制），这可能不是合适的替代品。由于其功能，它被认为是一款良好的
    Linux 视频编辑软件。


    ### Pitivi


    Pitivi 也是一个开源且免费使用的视频编辑器。该应用专为简单的视频编辑设计。提供了剪辑、分割、修剪和片段对齐等简单功能。音频混合通过 `Pitivi`
    曲线方法辅助。它还有使用热键和键盘快捷键的潜力。这允许音频和视频连接，这是一项巨大的收益。它是唯一支持 `MEF`（材质交换格式）格式的开源视频编辑器。Pitivi
    用户友好的 GUI 允许直接操作、拖放和原生主题导航。该程序可以转换为多种语言。它还附带了用户手册。


    ## 7.6 Windows Media Center 替代品


    以下是一些你可以在 Linux 上使用的 Windows Media center 替代品：


    ### GeeXboX


    GeeXboX 是一个功能全的 Linux 媒体中心操作系统，运行在笔记本电脑和嵌入式计算机上。它可以直接从 USB 盘运行或通过常规构建，并且占用空间小。


    最新版本 3.1 仅为 160 兆字节。GeeXboX 是在旧机器上运行或从 USB 驱动器启动的理想选择。由于 GeeXboX 基于 `Kodi` 构建，你会熟悉其用户界面。


    ### OpenELEC


    OpenELEC 运行 `XBMC`，但从那时以后已变为运行 `Kodi`。只需要在空闲的硬盘分区上安装目标文件夹即可。完成后，你的 Linux 机器将运行
    `Kodi`。


    连接到整个 `Kodi` 插件库，你可以根据喜好自定义 Linux 媒体中心。`Kodi` 还支持电视电视和 DVR（数字录像），为你提供完整的媒体中心环境。


    ## 7.7 Adobe Acrobat Reader 替代品


    Adobe Reader 长期以来被认为是大多数桌面系统上最好的 PDF 阅读器和编辑器之一。Adobe Reader 的免费版包含文档读取和查看、打印和注释等功能。`PRO`
    版本是一个高级版本，增加了 PDF 编辑、转换和签名等功能。


    其他 PDF 阅读器为日常使用提供了相同的的核心功能。根据所需的功能数量，有许多 PDF 阅读器应用供选择。某些侧重于提供基本功能，而另一些则提供额外功能来增强功能。


    ### X-PDF


    它执行阅读器预期的基本任务。功能包括文本提取过程、PDF 到 Postscript 转换和其他工具。偏好图形用户界面的消费者可能会感到困惑。可以通过下载页面或
    Linux 终端下载。


    ### GNU GV


    它是一个简单的图形用户界面 (GUI) 框架，用于在 Linux 上显示 `Pdf` 文档。它通过允许用户主要通过用户界面与 `Ghost script`
    解析器通信来运行。它还有一个过时的用户界面，不吸引那些需要鲜艳色彩图形的用户。然而，对于查看、打印和缩放等基本 PDF 任务，它是紧凑且实用的。你可以使用
    `apt` 软件包管理器、Fedora 的 `dnf` 或 CentOS 的 `yum` 在基于 `Ubuntu` 的发行版上安装它。


    # 结论


    这本书帮助你学会了如何自信地使用 Linux，从在你的电脑上安装它到编写你的程序。


    我们还希望这本书帮助你根据需求和应用选择最佳的 Linux 分发版，协助你完成日常计算任务。在本书结束时，你还应该学会了如何使用命令行在 Linux 环境中工作，以及一些让你的系统稳定的步骤。


    Linux 无疑是可用最可靠的操作系统之一——最棒的部分是它是免费的，所以你不需要支付额外费用来获取它，也不需要因为负担不起合法版而被迫接受冒版版。


