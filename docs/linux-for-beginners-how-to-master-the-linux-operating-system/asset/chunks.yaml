  trans: '


    ### 1. 协议层


    - **应用层 (Application)**：运行面向用户的程序，如电子邮件客户端、文件传输程序和网络浏览器。用于电子邮件的简单邮件传输协议 (`SMTP`)
    和邮局协议 (`POP`)、用于互联网的超文本传输协议 (`HTTP`) 以及用于文件传输的文件传输协议 (`FTP`) 都是应用层协议。应用层协议通常会分配一个端口号，可以被视为特定应用程序的标识符。例如，`HTTP`
    或 Web 服务器连接到端口 `80`。

    - **传输层 (Transport)**：将信息从一个应用程序移动到另一个应用程序。传输控制协议 (`TCP`) 和用户数据报协议 (`UDP`) 是该层中两个最相关的协议（其中
    `UDP`）。`TCP` 确保数据传输，而 `UDP` 只负责发送数据而不确保其到达目标地。

    - **网络层 (Network)**：从一个网络接收数据包并将其传输到另一个网络。如果网络之间距离较远，数据包在到达目的地之前会从一个网络路由到下一个网络。IP
    协议是该层最重要的协议（即 `IP`）。

    - **物理层 (Physical)**：物理网络硬件在网络中持有数据包（如以太网卡或令牌环卡）。


    分层模型的简单之处在于，每层只负责一项任务，将其他任务交给其余层处理。层之间可以混合组合。`TCP/IP` 网络可以构建在任何形式的物理网络介质上，从以太网到无线电波（无线网络中）。每层都可以在各种模块中实现，程序是模块化的。传输层和网络层通常包含在操作系统，任何应用程序都可以使用它们。


    由于安全、可用应用程序的出现，`TCP/IP` 取得了巨大进展。`TCP/IP` 协议最初是工作应用程序，而不是网络架构和协议的纸面总结——谁能对已经运行良好的程序异议呢？`TCP/IP`
    现在主导着互联网。


    ### IP 地址


    当你拥有一个包含许多台机器的网络时，你需要对每台机器进行单独分类。`IP` 地址是计算机在 `TCP/IP` 网络中的地址。该地址基于网络地址和主机地址，因为
    `TCP/IP` 关注的是网络互连。你可能将网络地址和主机地址理解为需要两个地址来唯一标识一台计算机：


    1. 网络地址指定计算机在网络上的位置。

    2. 主机地址识别网络上的特定设备。


    `IP` 地址是一个 4 字节（32 位）的值，结合了网络地址和主机地址。每个字节应写成一个十进制值，并在每个数字后加一个点 (`.`)。因此出现了诸如 `132.250.112.52`
    的网络地址。点十进制或点四位法是编写 `IP` 地址的方法。


    一个字节（包含 8 位）在十进制表示法中的可以是 `0` 到 `255` 之间的值。有效的 `IP` 地址可能只包含 `0` 到 `255` 之间的点十进制数字。


    ### 端口号和网络服务


    由于任何支持 `TCP/IP` 的设备上都提供多种标准服务，`TCP/IP` 协议族已成为互联网的通用语言。这些服务通过简化发送和接收电子邮件、新闻和网页来保持互联网的运行。这些服务通过多种名称识别，包括：


    - `DHCP`（动态主机配置协议）是一种允许设备动态配置 `TCP/IP` 网络参数的协议。`DHCP` 是一种为 `TCP/IP` 网络 分配动态 `IP`
    地址和其他网络信息（如名称服务器、默认网关和域名）的协议。`DHCP` 服务器在端口 `67` 上监听。

    - `FTP`（文件传输协议）是一种用于在互联网上计算机之间传输数据的协议。`FTP` 使用两个端口：端口 `20` 用于数据传输，端口 `21` 用于控制信息交换。

    - 域名使用 `DNS`（域名系统）翻译为 `IP` 地址。该服务的端口号为 `53`。

    - `HTTP`（超文本传输协议）是一种用于计算机之间交换文档的协议。万维网的底层协议是 `HTTP`。Web 服务器和客户端默认在端口 `80` 上通信。随着增加了
    `SSL/TLS`，协议变为 `HTTPS`，端口号改为 `443`。

    - `SMTP`（简单邮件传输协议）是一种在系统之间发送和接收电子邮件消息的协议。对于信息共享，`SMTP` 使用端口 `25`。

    - 客户端使用 `POP3`（邮局协议第三版）接收邮件，该协议使用端口 `110`。当使用 `SSL/TLS` 进行保护时，端口变为 `995`。

    - 客户端也可以使用 `IMAP`（互联网消息访问协议）与邮件通信（而不是 `POP3`），它使用端口 `143`。当使用 `SSL/TLS` 安全性时，端口变为
    `993`。

    - `NNTP`（网络新闻传输协议）是一种以存储和转发格式在互联网上传输新闻文章的协议。`NNTP` 协议使用端口 `119`。

    - `NetBIOS` 是 Windows 使用的网络协议，它使用多个端口进行会话，最常见的是 `139`。

    - `SSH`（安全外壳）是一种用于在不稳定网络上的安全远程登录和其他安全网络服务协议。`SSH` 使用端口 `22`。

    - 当一台设备上的用户登录互联网上的另一个系统时，会使用 `Telnet`。（为了登录远程设备，用户需要有效的用户 ID 和密码。）默认情况下，`Telnet`
    连接到端口 `23`，但 `Telnet` 可以连接任何端口。

    - `SNMP`（简单网络管理协议）是一种允许你在互联网上管理所有形式网络设备的协议。`SNMP` 使用 `FTP` 的两个端口：`161` 和 `162`。

    - Cisco 注册目录服务使用端口 `465`。

    - `TFTP`（简单的文件传输协议）是一种允许从一个设备向另一个设备传递文件的协议。（通常用于通过网络从无盘工作站导入文件。）在端口 `69` 上传输 `TFTP`
    数据。

    - `NFS`（网络文件系统）是一种允许计算机共享文件的系统。`NFS` 使用 Sun 的远程过程调用 (`RPC`) 设施，该设施通过端口 `111` 通信。


    每个服务连接到一个已知端口。任何端口都由 `TCP` 协议用于定位服务。


    ### 6.3.2 理解无线网络


    你听过 Wi-Fi。无线 Fidelity (`Wi-Fi`) 是一种与以太网网络类似的短距离无线网络。Wi-Fi 网络的运行细节由 `IEEE`（电气电子工程师学会）标准描述。制造商使用这些规范开发你可以购买并建立无线局域网
    (`WLAN`) 的产品。


    Wi-Fi 网络标准进展迅速。`802.11a` 催生了 `802.11b`，两者合并形成了 `802.11g`，随后被 `802.11n` 取代。但这两个标准的目标都是解释无线以太网的物理层如何工作。建立无线网络不需要了解所有规范的所有细节，但学习一些关键点将有助于你为网络购买合适的设备。


    由于所有无线信道用户共享该带宽，用户看到的实际数据吞吐量仍然远低于通道的总容量。此外，随着用户 PC 与无线接入点之间距离的增加，数据传输会降低。


    基础、点点模式和无线等效加密 (`WEP`)：


    对于无线以太网，`802.11` 协议规定了两种操作模式：基础和点点。在没有接入点的情况下，点点模式实际上是两个或多个无线以太网卡相互通信。


