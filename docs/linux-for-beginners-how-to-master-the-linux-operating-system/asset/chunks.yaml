- fmt: "\n1. The flash drive may be concealed in the hard drive portion of the boot\
    \ BIOS on some computers. Choose `Boot Hard Drives`, change the primary hard drive\
    \ to the storage media, and then make sure the `USB` is the first option under\
    \ `Boot Device`. Choose “Enable,” go to the order of boot devices, and transfer\
    \ the `USB` selection above the hard drive selection if the option to boot from\
    \ USB is `Enable/Disable`.\n1. Exit the BIOS setup and save your changes.\n\n\
    The workstation will reboot at this stage, and if your `USB` drive is plugged\
    \ in, Fedora should boot.\n\nIf the single-line entry `Boot Error` appears and\
    \ nothing else occurs, follow the manufacturer's instructions to update the device\
    \ BIOS.\n\n## Working with The Latest Drive Regularly\n\nThe Fedora environment\
    \ loads much faster than the Live CD environment when your machine boots. The\
    \ new files generated on the `USB` drive are visible, and other devices can be\
    \ accessed commonly. The “Install to Hard Drive” icon remains on the screen, allowing\
    \ you to make a fast and permanent switch to Fedora if you so desire.\n\nWhile\
    \ getting an Internet connection is unnecessary to use the operating system, we\
    \ highly advise it because most users would want to download additional programs\
    \ to test the operating system's functionality further.\n\nCongratulations on\
    \ your achievement! You can now begin to use Linux.\n\n## 3.3 Installing Linux\
    \ on Virtual Machines on Windows 10\n\nYou must complete some additional virtual\
    \ machine setup before you can access your virtual world. Since the `New Virtual\
    \ Machine Wizard` creates a generic world, you will want to customize it first.\
    \ This segment explains how to configure the virtual machine and how to install\
    \ your operating system.\n\n### Adjusting The Settings\n\nVirtualBox collects\
    \ configuration options for each virtual machine you build. VirtualBox emulates\
    \ what is defined in these configuration settings in the virtual machine.\n\n\
    Pick the virtual machine entry on the left-hand side and press the “Settings”\
    \ icon in the toolbar to access the configuration settings. The `Settings` dialogue\
    \ box appears.\n\nOn the left-hand side of the `Settings` dialogue box, ten configuration\
    \ categories are shown by icons with text:\n\n![Screenshot of the VirtualBox Settings\
    \ dialog box that has 10 setting categories, depicted as icons with text on the\
    \ left-hand side.](Images/image00126.jpeg)\n\n- **General**: `General Setting`\
    \ defines the virtual machine's name and operating system type. You will enable\
    \ the clipboard on the `Advanced` tab to copy and paste text, files, and directories\
    \ between the host and guest systems.\n- **System**: Controls the virtual machine's\
    \ CPU and memory allocation.\n- **Display**: This component manages the virtual\
    \ machine's video memory and virtual displays.\n- **Storage**: Controls access\
    \ to virtual hard drives and DVD drive emulation. The virtual hard drive you have\
    \ built should be mentioned here, but you can add more if necessary. You can also\
    \ give the virtual machine access to the host system's DVD drive from here. Another\
    \ cool feature of VirtualBox is installing an `ISO` image file on the guest device\
    \ directly. You can now install Linux distributions directly from `ISO` image\
    \ files instead of burning them to DVD.\n  Ensure you mount the DVD drive in the\
    \ `DVD` section if you will install the virtual machine operating system from\
    \ a DVD. Unfortunately, that option is not available by design.\n- **Audio**:\
    \ Controls access to the host system's sound card. You can choose the `ALSA` driver\
    \ for Linux hosts to enable the virtual server to transmit sound to the host Linux\
    \ sound system.\n- **Network**: The virtual machine will link to the host system's\
    \ network, where you configure that function. Between the virtual machine and\
    \ the host device, the default `NAT` option generates an internal network. This\
    \ creates a barrier between the virtual machine and the rest of the network, preventing\
    \ other devices from accessing the virtual machine. This is useful if you are\
    \ testing an operating system and want to keep it besides the rest of your network.\
    \ Pick the `Bridged` network option instead if you want the virtual machine to\
    \ have complete access to your local network. The virtual server's network interface\
    \ can then link to the network on the host server.\n- **Serial Ports**: If open,\
    \ control access to the host system's serial communication ports.\n- **USB**:\
    \ Make a list of the `USB` devices on the host system you want to use on the guest\
    \ system.\n- **Shared Folders**: This feature allows you to build a folder accessible\
    \ from both the host system and the virtual machine. This creates a simple file\
    \ transfer pipeline between the two environments.\n- **User Interface**: Select\
    \ which menu bar features you want to be enabled for virtual machine power.\n\n\
    After you have customized your settings, click “OK” to save them and return to\
    \ the VirtualBox main window. You are all set to install some apps now!\n\n###\
    \ Installing the OS\n\nYou are ready to go now that the virtual machine has been\
    \ customized for your new operating system. However, before you begin, double-check\
    \ that you have the DVD or `USB` drive required for the installation. After you\
    \ have got that, you can install it by following these steps:\n\n1. Insert the\
    \ operating system installation DVD into the host system's CD/DVD player, or use\
    \ the virtual machine's DVD drive to access the `ISO` image file. If your desktop\
    \ opens a file manager program by default, you can close it before continuing.\n\
    It is normal for the disc to be installed on the device and appear as a desktop\
    \ icon.\n2. From the left-hand list, choose the virtual machine on which you want\
    \ to install the operating system.\n3. Select the `Start` icon from the toolbar.\
    \ This switches on the virtual machine as if you had switched on the hardware's\
    \ power switch. The console emulation window in `VirtualBox` appears. This window\
    \ contains all that would usually show on display.\n\n![Screenshot of the VirtualBox\
    \ console emulation window displaying a set of icons at the bottom of the window\
    \ the indicate when the virtual machine is accessing hardware on the system.](Images/image00127.jpeg)\n\
    \n4. When the virtual machine is accessing hardware on the device, icons at the\
    \ bottom of the window indicate this. The icons are:\n   - The hard disc drive\n\
    \   - The DVD player\n   - Audio input and output\n   - The network link\n   -\
    \ The USB link\n   - The folder exchanged\n   - Memory for video\n   - Making\
    \ a recording\n   - The state of the CPU\n\nA mouse icon, a key icon, and the\
    \ word `Right Ctrl` can all be found in the browser's bottom-right corner. When\
    \ you start the virtual machine, `VirtualBox` takes control of the host system's\
    \ keyboard and mouse and gives it to the virtual machine. Press the `Control`\
    \ (`Ctrl`) key on the right side of the keyboard to return control to the host\
    \ device (for example, to run another program simultaneously). Place the mouse\
    \ anywhere within the console emulation window and press the `right Ctrl` key\
    \ to regain control of the virtual machine.\n\n5. Complete the installation of\
    \ the operating system you are using.\n6. The `DVD` or `ISO` file is used to start\
    \ the virtual machine (refer to the `General` section of the `Settings` dialogue\
    \ box). Simply observe the operating system's usual installation procedure. The\
    \ operating system detects the emulated hardware you installed in the virtual\
    \ machine.\n7. When the installation is over, reboot the virtual machine.\n\n\
    The majority of Operating Systems (OS) comes with a built-in reboot feature. If\
    \ this occurs, the `VirtualBox` console emulation window detects the reboot and\
    \ remains open, allowing you to observe the reboot.\n\n![Screenshot of the default\
    \ Ubuntu page displaying a perfectly working operating system running in an openSUSE\
    \ VirtualBox window.](Images/image00128.jpeg)\n\nThe result is a functional operating\
    \ system that runs inside your virtual machine.\n\n## 3.4 Installing Linux on\
    \ Virtual Machines on MacOS\n\nYour Mac has a lot of power, a long battery life,\
    \ and a lot of durabilities. A Mac's hardware is hard to beat, making it a powerful\
    \ machine for operating Linux.\n"
