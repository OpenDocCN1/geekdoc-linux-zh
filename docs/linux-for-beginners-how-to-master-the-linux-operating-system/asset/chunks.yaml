  trans: '

    当你使用桌面的“锁定屏幕”功能时，你的 GUI 会话会被锁定。任何人都可以 `Ctrl+Alt` 切换到虚拟终端。因此，在离开电脑之前，请注销你的虚拟终端。


    当你玩腻了这个小技巧后，请退出（字面意思，输入 `exit`）以注销你打开的任何 VT，然后点击 `Ctrl+Alt` 快捷键返回你的图形化桌面和 bash
    提示符。之后，你就会发现这个 shell 小工具到底有多用了。


    ## 4.5 基础命令行编辑


    由于 shell 会解释你编写的内容，因此理解 shell 如何解释你输入的文本至关重要。以下是所有 shell 命令的通用格式：


    ```

    command option1 option2 … optionN

    ```


    命令行（command line）是指单行命令的术语。你在命令行上输入一个命令，并附带一个或多个可选参数（或称为参数）。这些命令行选项（或参数）允许你决定命令应该执行的操作。


    要将命令与选项分开，并将选项相互分开，请使用空格或制表符（tab）。如果你选择了一个包含空格的选项，必须将其放在引号内才能使用。例如，输入 `grep` 命令来扫描密码文件中的两个单词（`grep`
    是一个以加密方式在文件中搜索文本的命令）。


    ```

    grep "WWW daemon" /etc/passwd

    ```


    `grep` 在包含这些单词的行上的输出所示。（你在屏幕上看到的可能与我们这里展示的不相同。）


    ```

    wwwrun:x:30:8:WWW daemon apache:/var/lib/wwwrun:/bin/false

    ```


    如果你用你的名字创建了一个用户账户，请使用 `grep` 命令并将你的名字作为参数，但记住，如果名字包含空格，请给它加上引号。


    当你熟悉命令行后，可以发现一些让生活变得更简单的键盘快捷键。在这一部分中，我们将向你如何使用 `bash` shell 的某些功能，让你的命令行体验尽可能有趣。命令行补全、编辑以及使用已输入命令的后台都是这些功能之一。


    你可以要求 Linux 为你完成命令或文件名。


    鉴于你在 Linux 命令行中输入的内容比在 GUI 环境中多得多，因此一个允许你尽可能使用输入快捷键的功能非常有用的。shell 的命令补全功能可以补全文件名和系统命令。


    由于 Linux 文件系统可以处理几乎无限的文件名，许多文件名可能会变得非常巨大。输入这些长文件名非常耗时。坦率地说，命令补全让输入命令或长文件名变得轻而易举。


    使用命令补全用于完成两件事之一：输入命令或完成文件名。


    ### 执行命令


    考虑以下场景：你想输入一个命令，但你只知道它以字母 `up` 开头，并且预计它会返回机器重启以来的时间。在命令提示符处，输入 `up` 然后按 `Tab`：


    ```

    rich@testbox:~$ up[TAB]

    ```


    会发生以下情况之一：


    1. 如果搜索路径（搜索程序的目录位置；输入 `echo $PATH` 来查看你的路径）仅包含一个匹配的命令，命令行将补全该命令，机器将等待你按 `Enter`
    执行它。

    2. 蜂鸣声意味着有多个命令以字母 `up` 开头。再次按 `Tab`，将出现选项。在列表中找到该命令并继续输入，直到前几个字母不同，此时你就可以按 `Tab`
    键补全命令。如果按两次 `Tab` 后没有显示任何内容，则没有匹配项。


    ### 完成文件名


    不要输入前几个字符然后按 `Tab` 来获取命令行补全。如果你在命令行上输入文件名，你必须输入前几个字符然后按 `Tab`。shell 通常会扫描当前工作目录中符合你输入内容的文件名，然后补全命令行文件名。如果有多个文件包含你输入的字母，你将听到蜂鸣声，并需要再次按
    `Tab` 查看选项列表，这与命令补全功能一样。


    这需要一些时间适应，但一旦你掌握了 `Tab` 键和 shell 命令行补全功能，你就会奇怪自己以前没有它是如何生存的。


    ### 浏览你的命令历史记录


    shell 能记住你做过的事情真是贴心。shell 跟踪命令的能力帮助你轻松地回到你很久以前（甚至是几天前）敲过的那些长得离谱的命令。例如，假设你定位并删除了系统中所有的核心转储文件（core
    dump 文件是包含调试数据的大文件，只有专家程序员或你的机器才能理解）。该命令类似于：


    ```

    find / -name core -exec rm {} \;

    ```


    若要重新运行该命令，从你的 shell 历史记录中检索并重新运行它。最简单的方法是输入 `Find` 并按“Enter”（如果你是重复你上次使用的完全相同的命令版本，即
    `find` 命令）。这将指示你的系统在历史记录中搜索最后一次 `find` 实例并重新运行。


    如果你运行了多次 `find` 命令，并想确保你重新运行的是正确的版本，你需要查看你的命令历史记录。在达到想要重新执行的命令之前，反复按向上方向键，可以逐行查看。按
    `Enter` 键重新运行命令。


    当你在提示符处输入 `history` 命令时，它会显示最后 20 条命令（默认），如果你好奇它们是什么的话。


    # 第 5 章：Linux 命令


    Linux 专家通常执行的键盘舞蹈对计算机新手来说也令人为观止。这些键盘音乐家知道鼠标和图形界面等技术进步，但他们更倾向于使用主键，并觉得操作得更快。达到这种专家水平需要时间，但每位专家曾经都是新手，通过足够的练习，每个新手都能变成专家。


    根据它们能为你提供的功能，本章将命令行命令分成了几类。


    ## 5.1 系统控制命令


    这些命令为整个系统提供信息和控制。普通用户可以运行许多收集系统信息的命令。然而，主动更改系统配置的命令必须以 root 身份登录时运行——或者已使用 `Su`
    命令变成超级用户。


    ### 管理命令


    - `passwd`: 更改特定用户的密码。任何用户都可以使用此命令更改自己的密码。

    - `su`: 切换到另一个用户账户而无需注销第一个账户。使用此命令的理想方法是 `su` 这样你的文件系统路径和其他信息就会加载。


    ### 内核支持命令


    你可能偶尔需要为新系统添加内核支持（软件或硬件）。如果发生这种情况，你有几种选择：可以重建内核，或者挂载可加载内核模块。虽然重建内核不需要核科学博士学位，但它是一种耗时的烦恼，最好避免。表格中的命令允许你在系统运行时添加内核支持，而不是从头开始重新构建。


    - `lsmod`: 列出你的内核加载的模块。

    - `depmod`: 重新生成模块依赖关系。

    - `insmod`: 手动加载模块。

    - `rmmod`: 手动卸载模块。

    - `modprobe`: 连同依赖和设置加载模块。


    ### 进程命令


    进程是你系统大部分活动的基础。即使机器看起来很空闲，也有许多进程（程序）在后台运行。这些在表格中的命令允许你查看内部情况，以确保任何需要运行的都在运行，并且你没有过热或过载资源。

    '
- fmt: "\n| Crontab | Sets up commands to execute at regular intervals. |\n| :---\
    \ | :--- |\n| Kill | Stops a process by its number. Often used as `kill -9` for\
    \ an abrupt stop for something that won't stop. |\n| Killall | Stops a process\
    \ by its name rather than the number. |\n| Nice | Assigns a CPU utility priority\
    \ to a process. |\n| Pidof | Gets a program's or process’s ID number. |\n| Ps\
    \ | Gets a lot of processes' ID numbers, usually used as `ps aux`. |\n| Pstree\
    \ | Shows the relationships between programs. |\n| Renice | Changes a program's\
    \ CPU use priority. |\n| Top | Shows resource use. |\n\n## Network Commands\n\n\
    Even if it is just your small home network, most Linux systems are now connected\
    \ to the internet. The graphical Network Manager tool helps you to customize your\
    \ network settings in one location. Linux also includes a range of command-line\
    \ tools for managing and fine-tuning the network settings. The table lists some\
    \ of the more useful network-related commands.\n\n| Ethtool | Displays Ethernet\
    \ settings for a network interface.\n| :--- | :--- |\n| Ifconfig | Displays or\
    \ sets the IP address and netmask for a network interface. |\n| Ip | Displays\
    \ or sets the IP address, netmask, and router for a network interface. |\n| Iw\
    \ | Displays or sets the wireless settings for a wireless network interface. |\n\
    | iwconfig | Displays or sets the SSID, IP address, and netmask for a wireless\
    \ network interface. |\n| Nmcli | Opens the Network Manager command-line interface.\
    \ |\n| Nmtui | Opens the Network Manager menu-based command-line tool. |\n| Route\
    \ | Displays or sets the default router information. |\n\n## 5.2 Function Commands\n\
    \nSince every command has a distinct role, categorizing these tools into groups\
    \ based on their roles is easy. If you know what process you need to run but are\
    \ not sure which command will do the job, start your search here. You can go deeper\
    \ by referring to man pages and other support material (online sites and reference\
    \ books)\n\nAt a command prompt, type `man command` to get to a man tab. `man\
    \ ls`, for example, displays the file listing command's support information.\n\
    \n### Shell Help Commands\n\nWhen looking for support with a command, you have\
    \ access to an exciting set of shell commands, as shown in the table.\n\nSeeking\
    \ knowledge about a command's command-prompt choices is a never-ending search.\
    \ For quickly finding this detailed material, the man page system provides helpful\
    \ guides at your fingertips.\n\n| Apropos | Looks for commands containing a keyword\
    \ in their man page descriptions. |\n| Info | One way of finding helpful information.\
    \ |\n| Man | The standard way of getting help in Linux and UNIX. |\n| Whatis |\
    \ Gets a one-line description of a command. |\n\n### Bash Commands\n\nWhen you\
    \ try to look up the support details for any commands in the man pages, they do\
    \ not seem to exist, and the commands do not appear as files on your system. When\
    \ you type commands at the prompt, remember that you are working with a shell\
    \ program. (In my case, the default Linux shell is `bash`.) The shell collects\
    \ commands you can use to communicate with it, mentioned in the following table.\n\
    \n| Alias | Creates or lists command shortcuts. |\n| Unalias | Removes command\
    \ shortcuts. |\n| Env | Lists your currently running environment variables and\
    \ their settings. |\n| History | Lists of the last 1,000 commands you have typed.\
    \ |\n| Export | Whenever you are told to set an environment variable, create the\
    \ variable and then use this command so that the variable will appropriately be\
    \ remembered. |\n\nWhen you view the man page entry for these commands, you get\
    \ the `BASH BUILTINS` loads to support instead. To search this manual, open the\
    \ man search GUI by pressing the forward-slash (`/`) key, then typing the name\
    \ of the command you want to look up. To begin the quest, press “Enter.” The interface\
    \ comes to a halt the first time the word is encountered. Click the N key to go\
    \ to the next occurrence of the term to try again. \n\nFor example, you may be\
    \ reading the huge bash man page (type `man bash` to access this page), but you\
    \ are only interested in prompts, which are the bits of text to the left of your\
    \ cursor in a text window. A good example of a prompt is:\n\n```\nrich@testbox:~$\n\
    ```\n\nTo jump down to the first instance of this phrase, type `/prompt`, and\
    \ press “Enter.” If the text surrounding the word does not match what you are\
    \ looking for, click the N key to move on to the next.\n\n### Compressing and\
    \ Comprising\n\nAlthough disc space is not as valuable as it once was, bandwidth\
    \ and backup media are still in high demand. As shown in the table, this category\
    \ offers various tools for compacting and organizing data for storage.\n\n| bzip2\
    \ | Compresses files into `.bz2` format. Used mostly for large sets of text files.\
    \ |\n| bunzip2 | Uncompresses `.bz2` files. |\n| gunzip | Uncompresses `.gz` and\
    \ `.tgz` files. |\n| Unzip | Uncompresses files from `.zip` format. |\n| Compress\
    \ | Compresses files into `.Z` format. |\n| Xz | Compresses and uncompresses files\
    \ from `.xz` format. |\n| Tar | Packages files together in a group. The standard\
    \ way of using this command is `tar xvf filename`, such as `tar xvf download.tar`.\
    \ |\n| Gzip | Compresses files into `.gz` format. |\n| Uncompress | Uncompresses\
    \ files from `.Z` format. |\n| Zip | Compresses files into `.zip` format. |\n\n\
    ## 5.3 File System Commands\n\nIt is challenging to do something without navigating\
    \ and working with the filesystem, regardless of which operating system you are\
    \ using. These tools will assist you in locating your position.\n\n### General\
    \ File system Commands\n\nThese commands, specified in the table, provide information\
    \ or perform actions on the entire filesystem from development and tuning to repair\
    \ and recovery. Some of these commands return info, while others give you surgical\
    \ tools for serious filesystem hacking.\n\n| e2label | Applies a filesystem label\
    \ to an `ext2` or `ext3` partition. |\n| badblocks | Searches a partition for\
    \ bad blocks. |\n| Eject | Ejects a CD or DVD. |\n| e2fsck | Checks and repairs\
    \ an `ext2` or `ext3` filesystem. |\n| Mkfs | Creates a filesystem (format a partition).\
    \ |\n| Fsck | Can check and repair many types of filesystems. |\n| Mount | Loads\
    \ a partition into your filesystem. |\n| Umount | Removes a partition from the\
    \ filesystem. |\n| Sync | Saves all information out of buffers onto disks. |\n\
    | tune2fs | Adjusts `ext2` and `ext3` filesystem parameters. |\n\n### File Organization\
    \ Commands\n\nAs shown in the table, file organization commands provide tools\
    \ for moving files and filesystem units around.\n\n| Cp | Copies a file. |\n|\
    \ Df | Shows partitions and how much space they have. |\n| Ls | Lists the contents\
    \ of a directory or information about a file. |\n| Mkdir | Creates a directory.\
    \ |\n| Cd | Changes directories. |\n| Du | Shows how much disk is used in the\
    \ directory and below. |\n| Ln | Creates a shortcut. |\n| Mv | Moves or renames\
    \ a file. |\n| Rmdir | Deletes an empty directory. |\n| Pwd | Shows the path for\
    \ the directory you are in. |\n| Rm | Deletes a file. |\n\n### File Location Commands\n\
    \nThe commands mentioned in the following table, assist you in finding files in\
    \ Linux's massive tree-structure filesystem.\n\n| Find | Hard-core filesystem\
    \ search tool. |\n| Locate | Lighter-weight filesystem search tool. |\n| Which\
    \ | Tells you the path for the program run if you typed this command. |\n\n###\
    \ File Attributes Commands\n\nFiles are similar to candy bars. The wrappers list\
    \ the ingredients, size, and date of manufacture, which are descriptive of the\
    \ tasty nugget inside. (Perhaps the wrapper is child-resistant.) the wrapper information\
    \ is stored in an inode in files. Besides changing file inode information, these\
    \ commands can also return data about the file's content, as shown in the table.\n\
    \n| Chgrp | Changes the group associated with a file. |\n| Stat | Shows statistics\
    \ about the file. |\n| Wc | Shows how many words, lines, and so on are in this\
    \ file. |\n| Chmod | Changes a file's permissions. |\n| File | Shows what type\
    \ of file you are dealing with. |\n| Chown | Changes who owns a file. |\n| Touch\
    \ | Creates an empty file of this name. |\n"
  raw: '| Crontab | Sets up commands to execute at regular intervals. |


    | Kill | Stops a process by its number. Often used as kill -9 for an abrupt stop
    for something that won''t stop. |


    | Killall | Stops a process by its name rather than the number. |


    | Nice | Assigns a CPU utility priority to a process. |


    | Pidof | Gets a program''s or process’s ID number. |


    | Ps | Gets a lot of processes'' ID numbers, usually used as ps aux. |


    | Pstree | Shows the relationships between programs. |


    | Renice | Changes a program''s CPU use priority. |


    | Top | Shows resource use. |


    Network Commands:


    Even if it is just your small home network, most Linux systems are now connected
    to the internet. The graphical Network Manager tool helps you to customize your
    network settings in one location. Linux also includes a range of command-line
    tools for managing and fine-tuning the network settings. The table lists some
    of the more useful network-related commands.


    | Ethtool | Displays Ethernet settings for a network interface. |


    | Ifconfig | Displays or sets the IP address and netmask for a network interface.
    |


    | Ip | Display or sets the IP address, netmask, and router for a network interface.
    |


    | Iw | Displays or sets the wireless settings for a wireless network interface.
    |


    | iwconfig | Displays or sets the SSID, IP address, and netmask for a wireless
    network interface. |


    | Nmcli | Opens the Network Manager command-line interface. |


    | Nmtui | Opens the Network Manager menu-based command-line tool. |


    | Route | Displays or sets the default router information. |


    5.2 Function Commands


    Since every command has a distinct role, categorizing these tools into groups
    based on their roles is easy. If you know what process you need to run but are
    not sure which command will do the job, start your search here. You can go deeper
    by referring to man pages and other support material (online sites and reference
    books)


    At a command prompt, type man command to get to a man tab. Man ls, for example,
    displays the file listing command''s support information.


    Shell Help Commands:


    When looking for support with a command, you have access to an exciting set of
    shell commands, as shown in the table.


    Seeking knowledge about a command''s command-prompt choices is a never-ending
    search. For quickly finding this detailed material, the man page system provides
    helpful guides at your fingertips.


    | Apropos | Looks for commands containing a keyword in their man page descriptions.
    |


    | Info | One way of finding helpful information. |


    | Man | The standard way of getting help in Linux and UNIX. |


    | Whatis | Gets a one-line description of a command. |


    Bash Commands:


    When you try to look up the support details for any commands in the man pages,
    they do not seem to exist, and the commands do not appear as files on your system.
    When you type commands at the prompt, remember that you are working with a shell
    program. (In my case, the default Linux shell is bash.) The shell collects commands
    you can use to communicate with it, mentioned in the following table.


    | Alias | Creates or lists command shortcuts. |


    | Unalias | Removes command shortcuts. |


    | Env | Lists your currently running environment variables and their settings.
    |


    | History | Lists of the last 1,000 commands you have typed. |


    | Export | Whenever you are told to set an environment variable, create the variable
    and then use this command so that the variable will appropriately be remembered.
    |


    When you view the man page entry for these commands, you get the BASH BUILTINS loads
    to support instead. To search this manual, open the man search GUI by pressing
    the forward-slash (/) key, then typing the name of the command you want to look
    up. To begin the quest, press “Enter.” The interface comes to a halt the first
    time the word is encountered. Click the N key to go to the next occurrence of
    the term to try again.


    For example, you may be reading the huge bash man page (type man bash to access
    this page), but you are only interested in prompts, which are the bits of text
    to the left of your cursor in a text window. A good example of a prompt is:


    rich@testbox:~$


    To jump down to the first instance of this phrase, type /prompt, and press “Enter.”
    If the text surrounding the word does not match what you are looking for, click
    the N key to move on to the next.


    Compressing and Comprising:


    Although disc space is not as valuable as it once was, bandwidth and backup media
    are still in high demand. As shown in the table, this category offers various
    tools for compacting and organizing data for storage.


    | bzip2 | Compresses files into .bz2 format. Used mostly for large sets of text
    files. |


    | bunzip2 | Uncompresses .bz2 files. |


    | gunzip | Uncompresses .gz files and .tgz files. |


    | Unzip | Uncompresses files from .zip format. |


    | Compress | Compresses files into .Z format. |


    | Xz | Compresses and uncompresses files from .xz format. |


    | Tar | Packages files together in a group. The standard way of using this command
    is tar xvf filename, such as tar xvf download.tar. |


    | Gzip | Compresses files into .gz format. |


    | Uncompress | Uncompresses files from .Z format. |


    | Zip | Compresses files into .zip format. |


    5.3 File System Commands


    It is challenging to do something without navigating and working with the filesystem,
    regardless of which operating system you are using. These tools will assist you
    in locating your position.


    General File system Commands:


    These commands, specified in the table, provide information or perform actions
    on the entire filesystem from development and tuning to repair and recovery. Some
    of these commands return info, while others give you surgical tools for serious
    filesystem hacking.


    | e2label | Applies a filesystem label to an ext2 or ext3 partition. |


    | badblocks | Searches a partition for bad blocks. |


    | Eject | Ejects a CD or DVD. |


    | e2fsck | Checks and repairs an ext2 or ext3 filesystem. |


    | Mkfs | Creates a filesystem (format a partition). |


    | Fsck | Can check and repair many types of filesystems. |


    | Mount | Loads a partition into your filesystem. |


    | Umount | Removes a partition from the filesystem. |


    | Sync | Saves all information out of buffers onto disks. |


    | tune2fs | Adjusts ext2 and ext3 filesystem parameters. |


    File Organization Commands:


    As shown in the table, file organization commands provide tools for moving files
    and filesystem units around.


    | Cp | Copies a file. |


    | Df | Shows partitions and how much space they have. |


    | Ls | Lists the contents of a directory or information about a file. |


    | Mkdir | Creates a directory. |


    | Cd | Changes directories. |


    | Du | Shows how much disk is being used in the directory and below. |


    | Ln | Creates a shortcut. |


    | Mv | Moves or renames a file. |


    | Rmdir | Deletes an empty directory. |


    | Pwd | Shows the path for the directory you are in. |


    | Rm | Deletes a file. |


    File Location Commands:


    The commands mentioned in the following table, assist you in finding files in
    Linux''s massive tree-structure filesystem.


    | Find | Hard-core filesystem search tool. |


    | Locate | Lighter-weight filesystem search tool. |


    | Which | Tells you the path for the program run if you typed this command. |


    File Attributes Commands:


    Files are similar to candy bars. The wrappers list the ingredients, size, and
    date of manufacture, which are descriptive of the tasty nugget inside. (Perhaps
    the wrapper is child-resistant.) the wrapper information is stored in an inode
    in files. Besides changing file inode information, these commands can also return
    data about the file''s content, as shown in the table.


    | Chgrp | Changes the group associated with a file. |


    | Stat | Shows statistics about the file. |


    | Wc | Shows how many words, lines, and so on are in this file. |


    | Chmod | Changes a file''s permissions. |


    | File | Shows what type of file you are dealing with. |


    | Chown | Changes who owns a file. |


    | Touch | Creates an empty file of this name. |'
