  trans: "\nDSL 和电缆调制解器是连接互联网的两种选择，包括将特定的调制解器连接到 Linux 设备上的以太网卡。在这些情况下，你需要配置 Linux\
    \ 系统的以太网网络。如果你的电脑只是通过移动/Wi-Fi 链路连接的网络上的客户端，且不需要专用连接，那么事情就很简单。你只需要在进入下一章之前跳过这一章即可。\n\
    \n你对互联网的观点定义了你如何解释它。大多数人通过他们所使用的服务来看待互联网。作为用户，你可能将互联网视为一个交换信息的媒介，具有以下特性：\n\n1.\
    \ **电子邮件**：使用特定的电子邮件地址向互联网上的所有人发送电子邮件。\n2. **网页**：从全球数百万台服务器下载并访问文档，在 Facebook\
    \ 上点赞链接，使用 Google 搜索信息等。\n3. **信息共享**：下载应用程序、音乐文件、视频和其他有用材料。你可以为其他系统的用户提供可下载的文件。\n\
    4. **远程访问**：通过互联网登录另一台设备，前提是你拥有该远程计算机的权限和访问权限。\n\n根据技术人员的说法，互联网是一个全球网络系统。Internet\
    \ 一词是 internetworking（组网）的缩写，即连接网络。`Internet Protocol`（`IP`协议）是为了连接多个网络而开发的。\n\
    \n在物理链路方面，互联网等同于公路和道路网络。由于这种相似性，互联网被主流媒体称为“信息超级高速”。互联网拥有一些高容量网络（10-Gbps 骨干网每秒支持\
    \ 100 亿位）以及许多低容量网络，从 56 Kbps 的拨号连接到 100 Mbps 或更高的高速电缆链路，正如公路和道路网络中有州际公路、许多州道和许多郊区街道。（每秒千比特等于\
    \ `Kbps`，每秒百万比特等于 `Mbps`）。互联网的骨干是一个高容量网络。\n\n单一实体并不拥有互联网，它也不由单一计算机控制。实际的互联网是一个由成千上万合作组织运营的网络集合。是的，网络由数万家公司监管。这听起来不可思议，但它确实在运行。\n\
    \n## 网络基础 101\n\n如果你使用连接到局域网（LAN）的电脑，并在安装过程中安装了网络功能，你可能已经连接到了互联网。\n\n不应因为高速提供商的存在而阻碍\
    \ Linux 用于高速网络。仅仅因为他们没有明确支持 Linux，并不意味着该技术与其不兼容。`TCP/IP`（互联网流量规则集）是为 UNIX 操作系统设计的，而\
    \ Linux 正源于此。\n\n如果你想实现 Windows 和 Linux 的双启动，你的 ISP 可以帮助你设置宽带链路，然后你就可以在任何你有时间和意愿的时候尝试让\
    \ Linux 连接上。\n\n### 电缆调制解器\n当你注册电缆互联网服务时，安装人员通常会给你一个特定的电缆调制解器系统。传输电缆调制解器的信号通过有线同轴电或光纤传输。你的工作站可以通过连接到电缆调制解器以太网口的以太网线直接连接，或者如果你的工作站具有无线网络芯片，可以通过无线连接。你需要与你的电缆提供商联系，以确定具体的可用速度。\n\
    \n### 数字用户线路 (DSL)\nDSL 以数字格式向你的电话插座发送数据。DSL 之闻是因为它利用了电话公司现有的铜线布线。即使是标准电话线相同的线路也可以使用。DSL\
    \ 连接需要额外的通信硬件，这些硬件应由你的互联网服务供应商（`ISP`）提供。\n\nDSL 分为几类：\n1. `ISDN`（综合业务数字网络）数字用户线路\
    \ (`IDSL`）——关于 `ISDN` 的描述可以在后面的项目列表中找到。\n2. `光用户线路（对称）` (`SDSL`）\n3. `数字用户线路（非对称）`\
    \ (`ADSL`）\n4. `DSL`（通用） (`XDSL`）\n\n询问你的 `ISP` 关于你 DSL 链路的速度，因为速度各不相同。\n\n####\
    \ ISDN（综合业务数字网络）\nISDN 是家庭最老的高速解决方案之一。当 28 Kbps（约为今天标准拨号调制解器速度的一半）似乎是你从电话到电话公司的铜线中获得的全部时，情况就是如此。ISDN\
    \ 在某些地区仍然可用，如果你距离电话公司的中心局 3.4 英里以内，它能保证提供 128 Kbps 的恒连接。`ISDN` 调制解器（通常由 `ISDN\
    \ ISP` 提供）和网络适配器必须使用 `ISDN`（有时是以太网卡）。\n\n#### 卫星调制解器\n对于那些住在没有电缆、DSL 或 ISDN 连接的偏远或低基础设施地区的人，卫星调制解器是一个可行的方案。在某些方面，这种通道与电缆类似，因为通常通过与卫星电视信号相同的提供商访问。卫星也有某些缺点。如果你的互联网服务不可靠，它将面临与卫星电视服务相同的命运。上传和下载速度也可能差异巨大。\n\
    \n#### 拨号调制解器\n即使在现在高速互联网时代，在无法访问宽带或成本过的地方，拨号调制解器仍然在使用。它将计算机的数字信号转换为从电话公司墙上插座传输所需的模拟信号。除了订阅\
    \ `ISP`，你不需要做任何额外操作，因为调制解器使用的是现有的语音电话服务。不过，你不能同时在同一条电话线上进行拨号和通话。\n\n## 设置硬件\n\n\
    在你椅子上坐舒服之前，双击检查几项。你需要执行低级操作（如爬到桌子下）来完成：\n\n1. **连接以太网线**：如果你的电缆、DSL 或 ISDN 调制解器需要来自工作站的有线链路，请确保以下措施到位：\n\
    \    - 一根以太网线（类似于电话线，但连接器更宽）插入电脑的以太网口和你的 `ISP` 安装的特定调制解器中。\n2. **无线连接**：如果你的设备有无线卡或芯片组，你需要一个无线路由器来接收和引导设备之间的无线流量，以及一个桥接器将你的工作站连接到以太网网络。你正在使用的硬件决定了无线路由器或桥接器距离卡多远以及跨越什么障碍（墙、地板等）。设置你的无线接入需要以下步骤：\n\
    \    - **识别**无线路由器或桥接器使用的无线协议：无线协议主要五类，大多分组为 Wi-Fi（`802.11a`、`802.11b`、`802.11g`、`802.11n`\
    \ 和 `802.11ac`）。确保你购买的无线路由器或桥接器支持你的设备使用的无线标准。\n    - **为你的无线网络**赋予唯一的名称。\n   \
    \ - **启用无线网络保护**：有几种不同的无线保护规范可选。最流行的是 `WEP`、`WPA` 和 `WPA2`，其中 `WPA2` 是三者中最稳定的。如果你的无线路由器支持，请使用\
    \ `WPA2` 保护。\n\n### 调制解器\n如果你使用调制解器连接互联网，请确保：\n- 电话线的一端插入墙上插座，另一端插入调制解器。\n- 如果使用外部调制解器，确保调制解器牢固地连接到设备上的相应端口并确保已开启。\n\
    - 当使用内部调制解器时，双击检查它不是需要特殊 Windows 驱动程序的软件调制解器（通常称为 `WinModems`）。\n\n"
