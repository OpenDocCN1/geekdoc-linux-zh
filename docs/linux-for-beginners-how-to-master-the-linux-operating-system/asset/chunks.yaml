  raw: 'DSL and cable modem are two options for connecting to the Internet, including
    connecting a particular modem to an Ethernet card on your Linux device. In these
    situations, you will need to configure your Linux system''s Ethernet networking.
    If your computer is just a client on a network connected to through a mobile/Wi-Fi
    link and does not need its dedicated connection, things are simple. You will just
    want to skip through this chapter before moving on to the next.


    Your viewpoint on the Internet defines how you interpret it. The majority of people
    view the Internet through the lens of the services they use. As a user, you might
    think of the Internet as a medium for exchanging information, with features like


    1.  Email: Use specific email addresses to send emails to everyone on the Internet.


    1.  Web: Download and access documents from millions of servers worldwide, link
    on Facebook, use Google to search for information, and so on.


    1.  Sharing of information: Download apps, music files, videos, and other helpful
    material. You can provide files for users on other systems to download.


    1.  Remote access: Log in to another device over the Internet, assuming you have
    permissions and access to the remote computer.


    The Internet, according to technologists, is a global network system. The word
    internet is an abbreviation for internetworking, which is connecting networks.
    The Internet Protocol (IP) was developed to link multiple networks.


    The Internet equals a network of highways and roads in terms of physical links.
    Because of this resemblance, the Internet was dubbed "the Information Superhighway"
    by the mainstream press. The Internet has some very high-capacity networks (a
    10-Gbps backbone can support 10 billion bits per second) and many lower-capacity
    networks ranging from 56 Kbps dial-up connections to a high-speed cable link of
    100 Mbps or more, much as the highway and road network has interstate highways,
    many state roads, and many more suburban streets. (A thousand bits per second
    equals Kbps, and a million bits per second equals Mbps.) The Internet''s backbone
    is a high-capacity network.


    A single entity does not own the Internet, and it is also not controlled by a
    single computer. The actual Internet can be viewed as a set of networks operated
    by thousands of cooperating organizations. Yes, networks are overseen by tens
    of thousands of companies. It sounds incredible, but it works.


    6.1 Networking 101


    If you are on a computer connected to a LAN and installed the networking during
    installation, you could already be linked to the Internet.


    Allowing Linux to be used for high-speed networks should not be discouraged by
    high-speed providers. Just because they do not explicitly support Linux does not
    mean the technology is not compatible with it. TCP/IP (the Internet''s collection
    of traffic rules) was built for the UNIX operating system, from which Linux is
    descended.


    If you want to dual-boot Windows and Linux, your ISP can help you set up your
    broadband link, and then you can tinker with having Linux connected whenever you
    have the time and desire.


    Cable modems: When you sign up for cable Internet service, you will usually be
    given a particular cable modem system by the installation technician. The signal
    to the cable modem is carried by either wired coaxial cables or fiber optics.
    Your workstation can be directly linked to the cable modem through an Ethernet
    cable connected to an Ethernet port on the cable modem or wirelessly if your workstation
    has a wireless network chipset. You will need to speak with your cable provider
    to determine the exact speeds available.


    Digital Subscriber Line (DSL): DSL sends data in a digital format to your phone
    jack. DSL is famous because it makes use of your phone company''s existing copper
    telephone wiring. Even the same phone line as a standard phone line can be used.
    A DSL connection necessitates additional communication hardware, which should
    be provided by your Internet Service Provider (ISP).


    DSL comes in several categories:


    1.  ISDN (Integrated Services Digital Network) Digital Subscriber Line (IDSL)
    — a description of ISDN can be found later in this bulleted list.


    1.  Optical Subscriber Line (Symmetric) (SDSL)


    1.  Digital Subscriber Line (Asymmetric) (ADSL)


    1.  DSL (Generic) (XDSL)


    Ask your ISP about the speed of your DSL link because it varies.


    ISDN (Integrated Services Digital Network): ISDN is one of the oldest high-speed
    solutions for homes. When 28 Kbps (half the speed of today''s standard dial-up
    modems) was about all you could get out of the copper strands connecting your
    phone to the telephone company, it seemed. ISDN is still available in some regions,
    and it guarantees a constant 128 Kbps connection if you are within 3.4 miles of
    the phone company''s central office. An ISDN modem (typically supplied by the
    ISDN ISP) and a network adapter must use ISDN (sometimes an Ethernet card).


    Satellite modems: For those who live in remote or low-infrastructure areas without
    access to cable, DSL, or ISDN connections, satellite modems can be a viable option.
    In several ways, this channel is similar to cable because it is usually accessed
    from the same providers as satellite television signals. The satellite has certain
    disadvantages. Your Internet service will suffer the same fate as your satellite
    television service if it is unreliable. The upload and download speeds can also
    be very different.


    Dial-up modems: Even now with high-speed Internet, dial-up modems are still used
    where broadband is inaccessible or prohibitively costly. It converts the computer''s
    digital signal into the analog signal required for transmission from the phone
    company''s wall jack. You need not do something extra other than subscribing to
    an ISP since the modem uses an existing voice telephone service. You can''t use
    the same phone line for dial-up and a phone call simultaneously, though.


    Setting up the hardware:


    Before you get too comfortable in your chair, double-check a few items. You will
    need to perform low-level maneuvers (such as crawling under your desk) to accomplish
    this:


    1.  Linking Ethernet cables: If your cable, DSL, or ISDN modem needs a wired link
    from your workstation, make sure the following is in place:


    1.  An Ethernet cable (similar to a phone cable, but with a broader connector)
    is inserted into your computer''s Ethernet port and the particular modem your
    ISP mounted.


    1.  Wireless connections: If your device has a wireless card or chipset, you will
    need a wireless router to receive and direct your wireless traffic between devices,
    and a bridge to link your workstation to your Ethernet network. The hardware you
    are using defines how far and over what (walls, floors, and so on) a wireless
    router or bridge may be from the card. Setting up your wireless access requires
    these steps:


    1.  Identifying the wireless protocol used by your wireless router or bridge:
    There are five major types of wireless protocols, which are mostly grouped as
    Wi-Fi (802.11a, 802.11b, 802.11g, 802.11n, and 802.11ac). Ensure that the wireless
    router or bridge you buy supports the wireless standard that your devices use.


    1.  Giving your wireless network a unique network name.


    1.  Enabling your wireless network''s protection.


    There are a few different wireless protection specifications to choose from. The
    most popular are WEP, WPA, and WPA2, with WPA2 being the most stable of the three.
    Use WPA2 protection if your wireless router supports it.


    Modem: If you are using a modem to connect to the Internet, make sure that:


    1.  A telephone cable is inserted into one end of the wall jack and the other
    end into the modem.


    1.  If using an external modem, make sure the modem is securely linked to the
    appropriate port on the device and that it is turned on.


    1.  When using an internal modem, double-check that it is not a software modem
    that requires special Windows drivers (commonly called WinModems).'
