  trans: '

    Linux 发行版通常分为三大类：


    1. 专用发行版

    2. 核心发行版

    3. Live 测试版（活动版）


    后续章节将解释 Linux 发行版的分类，并提供每个组的 Linux 发行版实例。


    ## 核心发行版


    核心发行版包含了 `GNU` 和 `Linux` 操作系统、一个或多个视觉化桌面界面，以及几乎任何可以随时安装和使用的 Linux 程序。无论你的需求如何，核心
    Linux 发行版都能为全面的 Linux 配置提供一站式的便利。


    在 Linux 早期，发行版是以软盘形式发布的的。你必须手动导入各种类别的物品并将它们复制到磁盘中。一整个发行版通常需要 20 张甚至更多软磁盘。这无疑是一次极其痛苦的经历。


    随着 `DVD` 或 `CD` 播放器在个人电脑上变得流行，Linux 发行版开始以 CD 组或单独 DVD 的形式提供。通常，你可以下载一个标准的 DVD
    镜像文件（由于扩展名的原因也称为 `ISO` 文件），然后将该镜像挂载到 `DVD` 上。之后，安装 Linux 变得简单得多。


    ![C:\Users\Hamza\Desktop\1a.png](img/image00123.jpeg)


    Linux 发行版仍然以 `ISO` 镜像文件的形式发布。许多计算机不再配备 DVD 播放器，但工具允许你将其挂载到可启动的优盘上。新电脑可以从 USB 驱动器启动，而优盘在服务器和工作站上仍然存在。


    对于 Linux 专家来说，有许多发行选择是完美的，但新手可能会面临挑战。在安装过程中，大多数内核会提问以决定默认加载哪些程序、哪些设备连接到计算机以及如何启用硬件。这些问题对于新手来说可能令人困惑。他们经常会在机器上加载过多的程序，或者加载太少，结果后来发现系统无法执行他们需要的任务。


    ## 专用发行版


    随着时间的增长，出现了一个新的发行版子集，直接针对新的计算机用户。这些主要基于核心发行版，但仅包含适用于特定用例的少量软件。


    除了提供定制应用程序（如针对企业客户的办公软件）外，定制 Linux 发行版通常尝试通过自动检测和设置流行的硬件设备来帮助新的 Linux 用户。这使得下载和安装
    Linux 变得更加方便。


    ![C:\Users\Hamza\Desktop\2a.png](img/image00124.jpeg)


    ## Live 测试版


    可启动的 DVD Linux 发行版（也称为 `Lived`）在 Linux 领域非常受欢迎。如今大多数计算机允许你通过从 `Disc` 或 `Thumb`
    盘访问操作系统，而不是从硬盘启动。这允许你无需安装即可体验 Linux 系统。


    许多 Linux 发行版构建了可启动的 `ISO` 镜像，你可以将其挂载到 `Disc` 或 `USB` 上以享受这一功能的优势。这些发行版仅包含 Linux
    系统的一部分。由于空间限制，演示版无法包含完整的 Linux 系统，但它们能包含的功能之多会让你震惊！你可以从 `USB` 棒启动电脑，然后从网络下载剩余的包。


    这是尝试不同 Linux 发行版的极佳方法，完全不需要接触你的电脑。插入 `DVD`，你就可以准备就绪。所有的 Linux 软件都可以从 `DVD` 或 `USB`
    驱动器运行。几乎每个发行版现在都有 Live 版本，只需从发行版下载一个并刻录到 `DVD` 即可尝试。


    有些 Live 发行版（如 `Ubuntu`）还允许你从 Live 设备运行 Linux 发行版。这允许你从光盘或 `USB` 驱动器启动，尝试该发行版，如果你喜欢，之后将其部署到电脑系统中。这是一个非常方便且用户友好的功能。


    Linux Live 发行版和所有东西一样，也有缺点。由于所有内容都通过 `USB` 或 `Cd` / `DVD` 访问，程序运行速度较慢，特别是当你使用带有较慢光驱驱动器的旧电脑时。此外，你对系统进行的任何改进在重启后都会丢失。


    ## 2.2 如何选择适合你的发行版？


    最适合你的 Linux 发行版取决于你的使用场景和工具规范。对于不同的目的，有不同的 Linux 发行版。某些发行版是为了桌面使用设计的，而另一些是为了帮助后端
    IT 框架设计的。


    如果你正在寻找一个新的 Linux 发行版，首先可以考虑的是你需要企业级 Linux 发行版还是社区级 Linux 发行版。


    Linux 发行版有很多：社区和企业。社区版是一种广泛使用的 Linux 发行版，主要由开源网络支持和资助。企业级 Linux 发行版（也称为商业发行版）通过供应商成员身份提供，因此不再完全依赖于社区的支持。


    社区版和企业版发行版的主要区别在于由谁决定对消费者什么重要。贡献者从广泛的开源选项中选择和管理包，决定了社区发行版的路线。发行商则根据消费者的需求决定企业级发行版的路线。


    ### 选择发行版时需要考虑的因素


    **通用软件** -（编程语言、办公应用、图形软件、游戏等）。许多发行版是极简的，软件很少。而某些发行版则完全相反。这很大程度上取决于你作为客户的需求。如果应用程序没有预捆装，你通常可以轻松地下载它。


    **成本** – 是否要为发行版支付零费用、少量费用或巨额费用取决于你的需求和发行商的运营模式。许多商业发行版提供企业支持。它们为依赖 Linux 系统处理从基础需求到项目要求的任何公司提供电话热线和
    24 小时支持。但值得注意的是，尽管你支付了费用，这并不意味着它更好。


    **安装软件** – 不同的发行版使用不同的“打包”技术。`APT` 用于基于 Debian 的系统（如 `Linux Mint` 和 `Ubuntu`）。虽然这在今天大多毫无意义，但它们仍然以某种微妙的方式运行。


    **最新更新**– 许多发行版几个月或几年不更新。它们可能认为版本是“稳定的”，因此除非有重大安全补丁或准备升级否则不更新。某些发行版（通常是专用版）经常停止并关闭。


    **支持** – 大多数流行的发行版在论坛或消息频道都有良好的社区协助。有些仍然提供免费的 Linux 程序和配置，但也可以签署服务合同。


    **易用性** – 操作系统的易用性也是选择发行版时的一个因素。


    '
- fmt: '

    # 1. Pre-installed essential tools


    Canonical, the organization that created and supports Ubuntu, also provides enterprise-level
    support for the operating system. Desktop, Server, and Core are the three major
    models. Other ''spins'' include Edubuntu, Lubuntu, Kubuntu, and others, created
    with public education in mind. There have been around 40 third-party spins in
    existence today in additament to the authorized spins.


    Ubuntu comes out twice per year. The April update includes a ''Long Term Support''
    update every two years. These come with five years of free help. This comprises
    bugfixes and protection updates. Normal ''intermediation'' releases come with
    a nine-month support period, but updating one version to the next is straightforward.


    If you do not like the Ubuntu interface, Linux Mint is built on Ubuntu, is designed
    for beginners, and includes `GNOME`, `Cinnamon` and `KDE` versions. Linux Mint
    is somewhat identical to Ubuntu in terms of functionality.


    ## 2.4 Linux Mint


    Linux Mint is, without a doubt, the finest Ubuntu-based distribution for newcomers.
    Yes, it is built on Ubuntu. You can expect the benefits that come with Ubuntu.
    It does, however, deliver a variety of workspace environments, including `MATE`,
    `Cinnamon`, and `Xfce`, instead of the `GNOME` platform. In reality, Linux Mint
    outperforms Ubuntu in few other areas.


    It is not just about the typical user experience, which is a plus for Windows
    operating systems. It offers excellent productivity with limited technical specifications,
    mainly when used with the `MATE` or `Xfce` desktop environments.


    It also makes use of Ubuntu''s application repositories. You would not have to
    be concerned about software installation.


    Mint 20 comes in three desktop versions: `MATE`, `Cinnamon`, and `XFCE`. It is
    centered on Ubuntu 20.04 LTS. Mint no longer supports 32-bit variants, and only
    64-bit editions are available. Linux Mint 20 is based upon Linux kernel `5.4`,
    which includes enhanced compatibility for `NVIDIA` GPUs, `AMD Navi 12`, and `Intel`
    CPUs. The overall user interface has also been updated, with new icons, new styles,
    and a digitally enhanced taskbar.


    `Warpinator`, a file-sharing software that operates in a LAN, and a fractional
    scaling function for HiDPI monitors to experience clearer and crisper images are
    among the new features. `Firefox`, `Timeshift`, `Audacious` music player, `LibreOffice`,
    `Timeshift`, and `Thunderbird` are among the other applications.


    Linux Mint is a fantastic Windows-like operating distribution. So, if you do not
    want a specific user experience, Linux Mint is a good option.


    ## 2.5 MX Linux


    It is creating a community of devoted users from both the `antiX` and `MEPIS`
    communities working together. The aim is to create a mid-weight, convenient Linux
    distribution that combines both environments'' best features.


    The most recent version (`MX 17.1`) is available with either 32-bit or 64-bit
    architectures from the MX website. There is already a more positive thing: about
    the current release ISO files, regular updates are downloadable. These are brand-new
    ISO images, including the latest improvements installed, so you will not have
    to waste time upgrading after a new install.


    Instead of the more prevalent `Mint (LMDE)` or `calamares` installers, MX Linux
    nevertheless uses its own.


    The platform is `Xfce 4.12`, but it has a well-thought-out and straightforward
    setup. Our preference is for the panel to be on the left of the screen. This enables
    the optimum use of the available screen. The panel is not set to auto-hide, which
    most people prefer on their laptops with smaller screens. No problem, right-click
    the window, go to `Panel`, then `Preferences`, and pick `auto-hide` from the menu.


    It has `Conky` operating in the backgrounds that provide day/date/load details,
    but there is still a `Conky Switch` function in the favorites menu if you do not
    want it.


    In the menu favorites, there is also an `MX Tools` utility. This reminds us of
    `MEPIS`, a useful, user-friendly utility that allows you to control a wide range
    of system settings.


    There are a few exclusive features here you will not find on other platforms.
    For fine-tuning your system, the `Tweak` and `Conky config` utilities are handy.


    Drivers (`Nvidia`) and codecs can also be installed, and there is another MX-specific
    development kit for those who do not want to struggle with the `Synaptic` command
    line.


    ## 2.6 Open SUSE


    SuSE used to be a stand-alone Linux distribution that Novell later bought out.
    Micro Focus then bought that out. They have been bought and sold often since then
    and now have a total value of about $USD 2.5 billion.


    `SUSE Leap` is a milestone release that addresses computer users and corporate
    design and deployment. The OpenSUSE initiative is a progressive and robust collaboration
    program that provides two key SUSE subsidiaries: `SUSE Enterprise` and `SUSE Leap`.
    It is suitable among open-source programmers and data administrators.


    On the other hand, `SUSE Tumbleweed` is a rolling update that includes the most
    up-to-date software frames and IDEs. Thanks to the emergence of up-to-date bundles
    such as office programs, the `GCC` interpreter, and the kernel, `TumbleWeed` is
    a lot easier for every power user or computer programmer.


    OpenSUSE depends on the `Yast` package manager, which is preferred for programmers
    and software operators for handling software applications.


    SuSE, like `RedHat`, has a complete business version and a production version.
    SuSE is an excellent all-arounder oriented toward the enterprise, with sponsorship
    and corporate collaborations with companies like `SAP`. Red Hat and SUSE share
    more than just the corporate system. It was initially based on `Red Hat` and hence
    used the same `RPM`-based package control system, but it has evolved enough to
    be considered a distribution with its liberties. Its `YAST` management information
    system makes service setup easy.


    OpenSuSE is the name of SuSE''s free edition. OpenSuSE has several exclusive features,
    namely `Tumbleweed`, a cutting-edge application software system. Several developer
    tools are included, such as `openQA`, which is designed for interactive software
    development, and `Kiwi`, which generates Linux visuals for installation on actual
    devices. By default, OpenSUSE utilizes the `KDE` desktop.


    ## 2.7 Fedora


    Fedora has long been regarded as among the leading user-friendly operating systems,
    thanks to its ease of use and pre-installed applications that help beginners get
    up and running quickly.


    It is a robust and adaptable operating system designed for desktop computers and
    notebooks, servers, and even IoT environments. Fedora is built on `Red Hat` and
    serves as a testing ground for the company before moving into the Enterprise process.
    It is typically used for creation and education, and it is useful for both programmers
    and learners.


    Fedora has been using the `DNF` package for a long time (and it is still the standard
    package manager) and provides the most up-to-date and best `RPM` software applications.
    Fedora 32 is the most recent version of Fedora.


    ## 2.8 Debian


    Debian is known for giving rise to well-known Linux distributions like `Mint`,
    `Deepin`, and `Ubuntu`, which have delivered outstanding results, reliability,
    and user interface. Debian 10.5, an upgrade to Debian 10 recognized as Debian
    `Buster`, is the most recent stable version.


    Debian 10.5 is not the latest iteration of `Buster`. Instead, it is an upgrade
    to `Buster`, including the most recent enhancements and new application software.
    Security patches that resolve pre-existing vulnerabilities are included. There
    is no reason to get rid of the `Buster` system if you already have one. Use the
    `APT` development kit to update your system.


    The Debian initiative has over 59,000 development tools and supports a wide variety
    of computers, with each version covering a wider variety of system configurations.
    It aims for cutting-edge innovation and long-term sustainability. `Secure`, `Research`,
    and `Volatile` are the three main development divisions in Debian.

    '
