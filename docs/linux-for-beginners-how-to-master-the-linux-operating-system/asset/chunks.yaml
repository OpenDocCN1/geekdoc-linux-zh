    | `nslookup` | 用于检查目标主机/网站的 IP 地址 |


    # 第 7 章：Windows 应用程序替代方案


    “Linux 上有哪些应用程序？”以及“我是否能在 Linux 上使用我喜好的应用程序和程序？”是关于 Linux 的两个最常见的问题。


    虽然在某些情况下 Linux 上可以直接访问相同的程序，但在大多数情况下并非如此。最棒的部分是，Linux 拥有许多最常用 Windows 程序的替代方案。


    本章将向你介绍 Linux 上一些优秀的应用程序。我们将查看 Microsoft Office、Photoshop、Internet Explorer、Windows
    Media Player、Adobe Reader 以及其他软件替代方案。


    ## 7.1. Microsoft Office 替代品


    生产力是每个操作系统或平台的本质特性。幸运的是，Linux 拥有广泛的生产力应用，包括办公套件。


    大多数 MS Office 替代品可以下载并用于访问、修改和生成许多类型的文档，包括 `.xlsx`、`.docx` 和 `.pptx`。


    ### LibreOffice


    在 Linux 上，LibreOffice 通常被认为是最好的 Microsoft Office 替代品。许多 Linux 及其发行版都将其作为标准办公套件自带。这部分是因为它是免费且开源的。这是因为它非常出色。它不是
    Microsoft Office，但它是一个替代品，如果你习惯了微软的产品，起初习惯 Libre Office 可能会很困难。


    随着你逐渐习惯并越来越熟悉它，你会发现 LibreOffice 的功能同样丰富，甚至更多。LibreOffice 是 OpenOffice 的分支，而 OpenOffice
    在 LibreOffice 出现之前被广泛使用。由于它是开源软件，它拥有一个庞大的开发者社区。从本质上说，每个人都可以参与这项事业。LibreOffice
    支持插件，这确实让开发者的工作变得更简单。


    如果你觉得遗漏了某些内容，可以看看是否能找到包含你所寻找的功能的扩展程序。它与三个主流桌面操作系统以及 Linux 都兼容。


    **优点：**

    1. 它是开源且免费的。

    2. 提供了完整的功能。

    3. 与 Microsoft Office 文件类型的兼容性极。


    **缺点：**

    1. 风格过时了。


    ### Apache OpenOffice


    OpenOffice 基于与 LibreOffice 相同的框架，并且与它有很多共同点。由于开发周期较长，它在开发方面落后于 LibreOffice。LibreOffice
    分离的一个关键原因之一就是此。


    Apache OpenOffice 是 Linux 上合理的 MS Office 替代品。它经过了多年的开发和测试，并且像 LibreOffice 一样是跨平台的。它具有许多用于制作文档、演示文和表格的功能。这个替代办公套件除了传统的开放文档格式外还包含了
    Microsoft Office 格式。


    这确保了你发布或从 Microsoft Office 用户那里获取的文档是兼容的。


    **优点：**

    1. 用户界面熟悉且直接。

    2. 使用了 Apache 许可证。

    3. 支持多种语言。


    **负面方面：**

    1. 对 Microsoft Office 文件格式的支持较少。


    ## 7.2 MS 记事本替代品


    Notepad 是程序员和普通大众中标准的源码和文本编辑器，但它只兼容 Windows。然而，在 Linux 上，有一系列非常胜任甚至更优的替代方案。


    ### Vim


    毫无疑问，Vim 是 Linux 上编程最实用的文字处理器（编辑器）之一。自从作为 `Vi` 出现以来，它获得了广泛的普及，并成为 Unix 世界最有影响力的编辑器之一。如果你正在为
    Linux 寻找一个紧凑、革命性且可配置的记事本替代品，请务必考虑使用 `Vim`。多级撤销链、对各种插件和文件类型的全面支持，以及与许多工具的完全兼容，只是
    `Vim` 的显著特征之一。


    **Vim 的一些显著特性：**

    1. `Vim` 的多级撤销框架的独特之处在于，它让你对源代码拥有完全的控制权，同时也允许你进行实验。

    2. 它提供了脚本功能，并对几种计算机语言和文件格式提供全面支持。

    3. `Vim` 极其安全，能够快速满足即使是最苛刻的用户的需求。

    4. 它与 `Emacs` 一样是最多功能的文本编辑器之一，允许以最小的精力进行广泛的更改。


    ### Gedit:


    Gedit 像 Notepad++ 一样，是一个轻小但强大的代码编辑器，运行在 Linux、Microsoft Windows、Mac OS 和 BSD 上。外部脚本、资源和代码片段编译等功能都得到了广泛支持。`Gedit`
    带有对 `FTP`、`SSH`、`HTTP` 和 `WebDAV` 等其他安全数据编辑协议的支持。如果你正在运行 Ubuntu 或其他基于 GNOME 的操作系统，`Gedit`
    可能已经安装好了。


    **显著特性：**

    1. `Gedit` 具有可定制性，提供了如 `HTML`、`C`、`C++`、`Python`、`XML` 和 `Perl` 等脚本语言。

    2. 与其他类似的记事本替代品相比，其查找和替换功能非常好，并支持正则表达式。

    3. `Gedit` 拥有插件框架，允许用户添加额外功能以获得更交互的性能。

    4. 它发布于二十多年前，但现在仍在持续运行和维护。


    ## 7.3 Internet Explorer/Microsoft Edge 替代品


    尽管 Internet Explorer 传统上是 Windows 的标准网络浏览器，但 Linux 用户可以访问各种补充且特别独特的浏览器。如果你厌倦了使用
    Microsoft Edge 并需要浏览器来完成特定项目，无疑有备选浏览器供你选择。


    ### Brave:


    Brave 于 2016 年进入浏览器领域。Brave 是一种以流行的 Chromium 浏览器为中心的浏览器，具有强大的广告和跟踪拦截能力。得益于其独特的隐私特性，Brave
    在 2019 年成为日益受到青爱的浏览器之一。


    Brave 最近发布了基础注意力令牌 (`BAT`)，这是一种加密货币，用于补偿用户通过 Brave 关注隐私的广告网络所展示的广告费用。用户还可以使用 `BAT`
    为网站“打赏”，让 Brave 随机向他们访问的页面分发 `BAT`，或者持有 `BAT` 以兑换现金。


