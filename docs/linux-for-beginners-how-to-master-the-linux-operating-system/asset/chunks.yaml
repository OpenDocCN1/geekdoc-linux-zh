    1. `VirtualBox` requires the kernel header files to create modules that plug into
    the kernel. Before installing `VirtualBox`, you will probably need to install
    these packages first. Look up the package that installs the kernel header files
    in your Linux distribution''s documentation. For openSUSE, it is `kernel-default-devel`.


    2. Enter the administrative password when the package manager asks for it.


    3. You might have a new `VirtualBox` entry added to your desktop menu system.
    In the KDE menu, openSUSE places the menu entry under the `Applications System`
    section.


    ![Screenshot of the Welcome page of the Oracle VM VirtualBox main window, to start
    creating some virtual machines.](Images/image00125.jpeg)


    4. You can build virtual machines once you have gotten to the main window!


    # Installing Linux on Physical Hardware


    There are several steps to installing any Linux distribution, and we will walk
    you through them briefly and without going into too much detail. Then you can
    install what you want by following the comprehensive instructions for each delivery.


    Before installing any Linux distributions, you will need a lot of knowledge about
    your computer''s hardware. Before beginning the installation of Debian, gather
    information about your PC and its peripheral components. Most Linux installation
    programs, fortunately, will detect and operate with the majority of PC peripherals.
    Nonetheless, knowing your PC''s hardware is a good idea so you can troubleshoot
    if anything goes wrong during the installation.


    ## Following The Important Steps


    The first move is to burn the media used for distribution. Any device with a burner
    capable of burning DVDs or CDs will do so. (A DVD burner must burn a DVD; however,
    a DVD burner can burn both CDs and DVDs.) If you already have a Windows PC with
    a CD/DVD burner, you can usually burn the CDs using that system.


    Ensure that your computer can boot from the drive containing the media. While
    most new PCs can boot directly from a DVD/CD drive, some may need your assistance.
    Typically, the PC is programmed to boot from the hard drive before the DVD/CD
    drive, and changing the order of boot devices requires going into `Setup`.


    To make a PC boot from a DVD drive, go into `Setup` when the computer turns on.
    The exact steps for entering `Setup` and selecting a boot device differ by PC,
    but they usually include pressing a key, such as `F2`. A brief message appears
    when the computer turns on, instructing you on which key to press to enter `Setup`.
    You may designate the DVD drive as the boot system while in `Setup`. Insert the
    DVD or CD into the DVD drive and restart your computer after being set up to boot
    from the DVD drive.


    The third move is to boot your PC from the Live CD or DVD to try a Live CD delivery.
    Otherwise, the third move is to make space on your PC''s hard drive for Linux.
    This move can be challenging or straightforward if you are using Microsoft Windows,
    depending on whether you want to replace Windows with Linux or retain Windows
    and a Linux distribution.


    Know that your current operating system uses the entire hard drive to install
    Linux without deleting (or disturbing) Windows. You will need to partition (divide)
    the hard drive so Windows can live on one side and Linux on the other. Partitioning
    can be a frightening move because you risk wiping out anything on the hard drive.
    Always create a backup of your essential data before making any significant changes.


    You can use a partitioning tool to build a partition on your hard drive that the
    Linux installation program will use. If your computer is running the latest Windows
    10 or an older version of Windows, consider purchasing a commercial hard drive
    partitioning software. But you can use a GUI (graphical user interface) tool named
    `QTParted`, which comes with Knoppix and many other distributions, to repartition
    your PC''s hard drive.


    Notice that some Linux distribution installers, such as openSUSE, will automatically
    build Linux partitions by shrinking a Windows partition. There, you will not need
    to shrink the Windows partition on your hard drive with a method like `QTParted`.


    After you have set aside a partition on your hard drive for Linux, you can boot
    your computer from the DVD that came with your chosen distribution and begin the
    Linux installation. Several measures are involved in the installation, and they
    differ from one delivery to the next. It should be easy sailing now that you have
    made it this far. You will be finished in an hour or two if you just go through
    the installation screens. Most installers, such as the openSUSE interface, have
    a graphical user interface that walks you through each stage.


    Partitioning the hard drive again is a crucial move during installation, but this
    time you simply use the extra partition you built.


    Pick the software packages to install after completing a few setup steps, such
    as setting up the network and time zone and letting the installer finish the remaining
    installation chores. Some distributions simplify the process by eliminating the
    software selection stage and installing a default collection of software packages.


    Restart the PC after completing the installation. Until the automatic configuration
    runs, you will need to reboot.


    When you first boot up Linux, you can complete some additional configuration measures
    and install additional software packages.


    ## Analyzing Your System''s Hardware


    If you are worried that your PC cannot run Linux, here are some of the most critical
    components to remember before you begin the Linux installation:


    - **DVD drive**: Your computer must have a DVD drive (either a DVD-ROM or a DVD
    burner) and be able to boot from it. It makes no difference what model you use.
    What matters is the way the DVD drive is connected to the computer. DVD drives
    attach to the hard drive controller on most new PCs (`IDE`, Integrated Drive Electronics,
    or `ATA`, for AT Attachment). An external DVD drive would probably attach to the
    `USB` port. In Linux, any `IDE/ATA` or `USB` DVD drive will function.

    - **Hard drives**: Linux accepts every `IDE` disc drive. `SCSI` (Small Computer
    System Interface) is another hard drive controller that Linux supports. You will
    need about `5GB` of hard drive space to install and play with Linux comfortably.
    You need no hard drive space to check out the Live CD versions of Linux.

    - **Keyboard**: With Linux and the `X Window System`, any keyboard will function.

    - **Monitor**: The monitor is not essential, except that it must display the video
    card''s screen resolutions. The pixels (horizontally and vertically) determine
    the screen resolution (such as `1024 x 768`). The installer detects many modern
    monitors. If the installer does not detect your monitor, you can choose a generic
    monitor model with a specific resolution (such as `1024 x 768`). You can also
    identify a monitor by its make and model, which can be found on the monitor''s
    back.

    - **Mouse**: The installation software can detect the mouse. With Linux and the
    `X Window System`, any mouse (`PS/2` or `USB`) will function.

    - **Network card**: While network cards are not standard on all PCs, they are
    becoming increasingly uncommon. Whether or not your PC has a `Wi-Fi` or wired
    network card, the installer should be able to identify and use it. If you have
    issues, try to locate the network card''s make and model so you can look up whether
    Linux supports that card online.

    - **Processor**: As long as the processor speed is over `700 MHz` (megahertz)
    or `GHz` (gigahertz), it doesn''t matter. Most processors produced in the last
    few years have speeds far above that. The quicker, the better, as a general rule.
    Other Intel-compatible processors, such as `AMD` and `VIA` processors, will run
    Linux.

    - **RAM**: RAM refers to the memory available to your computer. The more RAM,
    like processing speed, the better. To install both Linux and the `X Window System`,
    you will need at least `512MB` of RAM. Some distributions have a higher minimum
    memory requirement, and you will need even more to run a GUI desktop comfortably.

    '
