    Linux 为那些无法获得 macOS 更新的旧 Mac 赋予了新生命。与其让你老旧的 MacBook Pro 变成一个没用的纸镇，不如升级到新版本的 Linux
    并让系统运行多年。


    当你使用双启动系统时，Linux 和 macOS 都会在你的 Mac 上启用。当你的电脑启动时，按住 `option` 键来选择要使用的操作系统。虚拟机和双启动系统之间的最本质区别在于，双启动允许你同时只使用一个操作系统，但它提供了更好的性能。


    如果你根本不打算使用 macOS，你可能想将其替换为 Linux。这样一来，机器文件就不会占用你的任何存储空间。


    然而，如果你改变了主意，恢复 macOS 将既复杂又耗时。由于 Linux 会覆盖 macOS 恢复分区（Recovery partition），这一情况是事实的。如果你确定不想使用双启动选项而是选择虚拟机设置，请跳过分区阶段并直接进入安装过程。


    1. 你需要一个至少有 2GB 存储空间的 U 盘来在你的 Mac 上运行 Linux。为了在 U 盘上挂载 `Ubuntu`，你必须先对其进行格式化。请确保你已经备份了任何重要数据。

    2. 使用以太网适配器将 Mac 连接到互联网。这一点非常重要，因为没有第三方驱动程序，你的 Wi-Fi 在 `Ubuntu` 中无法工作。同样，如果蓝牙出现故障，iMac
    用户可以使用 USB 键盘或鼠标。

    3. 为了实现双启动，请尽量确保你的硬盘上有足够的可用空间。


    ![image9.png](img/image00129.jpeg)


    4. 通过前往 Apple 菜单 > 关于此本机 > 存储空间，验证你至少有 25GB 的可用空间。


    ![image10.png](img/image00130.jpeg)


    5. 最后也是重要的一点，为你的 Mac 创建备份。通过在双启动分区中部署 Linux，你不应该丢失任何数据。如果发生任何故障，你需要清空你的 Mac 来恢复它。

    6. 与其构建双启动设置，不如使用 `Carbon Copy Cloner` 备份你的 macOS 恢复分区，以便用 Linux 替换 macOS。这会让切回
    macOS 变得得多。


    ### 从 USB 安装程序启动


    在按住 `option` 键的同时重启你的 Mac，并将 USB 闪盘直接插入电脑。一旦引导加载程序显示出来，使用方向键选择 `Boot EFI` 并按下“Enter”。


    在 `Ubuntu` 加载界面后，会显示 `Ubuntu` 桌面。


    利用这个机会在你的 Mac 上尝试 `Ubuntu`。记住，它可能会慢，因为它是从 USB 闪盘运行的。由于 `Ubuntu` 设计上无法使用 Mac 的
    Wi-Fi，请使用以太网线连接互联网。


    ### 在 Mac 上安装 Linux


    设置完成后，双击桌面上的“安装 Ubuntu”图标。


    要选择你的键盘布局和语言，请执行屏幕上的提示。选择“常规安装（Normal installation）”和“安装第三方软件”选项。安装此允许你使用 Wi-Fi
    和蓝牙的应用需要通过以太网线将 Mac 连接到互联网。然后点击“继续（Continue）”按钮。


    如果提示，请保持分区挂载状态。


    ### 设置启动管理器


    你 Mac 的默认启动管理器并不总是适用于 `Ubuntu`。这意味着你仍然必须部署一个第三方启动管理器，它允许你在电脑启动时轻松地在 macOS 和 Linux
    之间切换。


    下一步是安装 `rEFInd`。你必须短暂禁用系统完整性保护（System Integrity Protection）以启用 `rEFInd`。之后再次启用它，因为这是
    macOS 的一项基本安全功能。


    要设置 `rEFInd` 启动管理器，请遵循以下步骤：


    1. 在应用程序的实用工具文件夹中启动禁用 `SIP` 的 `Terminal`（终端）。

    2. 在另一个窗口中，打开 `Finder` 并切换到 `rEFInd` 链接。

    3. 将 `rEFInd-install` 包拖入你的 `Terminal` 窗口后按 Enter。

    4. 提示时输入你的用户账户，然后再次按 Enter。

    5. 记住在安装完成后重新启用 `SIP`。

    6. 将 `rEFInd-install` 文件拖入 `Terminal` 窗口并输入代码。

    7. 在你重启 Mac 的下一一刻，`rEFInd` 选择应该会自动出现。如果没有出现，请在启动时按住 `Option` 键以启动你的启动管理器。


    # 第 4 章：Linux Shell


    你需要连接到机器并告诉它你想让它做什么。在 Linux 中与机器通信的一种方式是通过名为 shell（终端）的程序。shell 不是图形界面。它是完成你任务的一系列命令和语法。


    按照图形桌面的标准，shell 环境显得非常平淡和无聊。当你第一次启动 shell 时，你会看到一个简单的提示符，例如 `$`，后面跟着一个闪烁的光标等待你输入内容。


    ## 4.1 什么是 Shell？


    命令行 shell（command shell）也称为命令解释器，是一个向操作系统和应用程序发送命令并接收其回响的程序。在功能上，它类似于 MS-DOS 中的
    `command.com` 或 Windows 中的 `cmd.exe`，但 Linux shell 的功能强大得多。脚本（Scripts）是用命令行 shell
    语言编写的小型程序，用于对文件及其数据执行顺序顺序操作。


    如果不理解如何使用命令行，很难成为一名成功的 Linux 专业人士。


    命令行（The command line）是一个 shell 提示符，显示设备是否准备好接受用户命令。这被称为用户-系统对话。用户对输入的每条命令都会收到来自系统的响应：


    1. 一个新的提示符，表示命令已执行，你将进行下一步。

    2. 错误消息是系统对事件给用户的陈述。


    对于习惯于图形界面系统的用户来说，操作命令行可能看起来不方便。这种形式在 Linux 中一直非常基础且完善。当你需要执行相同的命令或文件名时（在执行最常见的操作时），
    shell 中有几种方法可以节省键入工作：


    1. 自动添加长命令

    2. 重新执行过的命令

    3. 基于标准的文件名替换


    当你需要对多个项目执行相同操作时，命令行的优势就显而易见。在图形界面系统中，你需要与对象数量相当的输入设备。在命令行上，一个命令就足够了。


    ## 4.2 获取 Shell 权限


