    # Choosing the ISP (Internet Service Provider)


    Because of Linux''s meteoric rise in popularity, many ISPs teach their support
    staff how to use it. If you already have an ISP, contact them and remind them
    of your Linux ambitions. Most possibly, the individual already has the information
    necessary to Linux subscribers and can share it with you. If you are looking for
    a new Internet service provider, this section will help you make an informed decision.


    Some ISPs have proprietary software that must be installed on your computer to
    connect to the Internet. Likely, the applications they have will only run on Windows.


    Consider these questions while looking for an Internet service provider:


    1. Does it provide Linux technical support? This is an important aspect to remember
    if you intend to run Linux. It need not be a deal-breaker, but it can be helpful.

    2. Is it possible to get a recommendation? Inquire with a friend. A happy customer''s
    recommendation is an ISP''s best mate.

    3. Would you be able to use the bandwidth you have agreed to? Many Internet service
    providers oversubscribe their networks, believing that not all would be online
    simultaneously. Be getting the bandwidth you are paying for particularly late
    at night when your neighbors are all watching movies on their computers!


    # Gathering The Information You Need


    After you sign up for services with a reliable ISP, you will receive a customer
    information sheet. This sheet should detail how your network is allocated an IP
    address needed to communicate over the network. Sometimes, the IP address is allocated
    to the router, and the individual workstations on your local network are given
    private IP addresses.


    An IP address is allocated to your Linux workstation in one of the two ways:


    1. **Static**: Your IP address remains the same. Servers use static addresses
    more often than desktops. Your ISP must provide you with your nameserver IP addresses,
    gateway address, network address, and netmask if you are using static. The customer
    information sheet should contain this information.

    2. **Dynamic**: When you connect, or at regular intervals, your IP address changes.
    Most desktops do not need the exact address the time, which makes life simpler
    for ISPs. It also makes life simpler for laptop computers, which are often shifted
    from network to network. If you are using dynamic addressing, you will be told
    to use the Dynamic Host Configuration Protocol to bind (`DHCP`). Your cable, DSL,
    ISDN, or satellite modem doubles as a router with `DHCP`, assigning unique IP
    addresses to devices on your local network.


    If you use your ISP as your email provider, you will need to know these additional
    details to configure your email client.


    1. The address of the outbound `SMTP` relay server used to send email messages
    to the Internet.

    2. The inbound `POP3` or `IMAP` email server address for retrieving emails from
    your server''s inbox.


    You can use your Linux system to create an Internet connection with these details.


    # 6.2 Linux Cloud Hosting


    Are you looking for Linux Cloud Hosting Servers? To make your website or e-commerce
    website more effective while still ensuring excellent overall efficiency, this
    is the better option.


    Clients that use Linux Cloud Hosting Servers benefit from improved reconfigurability
    and the ability to make adjustments based on their qualifications. This hard drive
    server we provide for you increases your website''s overall efficiency and gives
    you more control over the computing assets available.


    Linux server software uses cutting-edge technology to allow anyone to run their
    version of Linux while also providing them with improved overall performance,
    tougher reconfigurability, and better supply routes.


    One hundred percent uptime is assured, which ensures that your blog can run smoothly
    without lagging for an extended time. To ensure that your blog is still about
    backup servers, an auto-failover feature is available.


    DDOS Safety is included with the Linux server web hosting service to ensure the
    highest level of state-of-the-art security. `DNS` and clientele geographically
    repetitive are forwarded to eight transit firms.


    Linux Shared Web Hosting supports the most recent and dependable web hosting versions,
    such as `Fedora 7`, `CentOS 7`, `Ubuntu 14.04 LTS`, and `Debian 7.8`. Clients
    have access to all server and PC functionality of the operating system. These
    pre-installed hosts are instantly accessible, allowing clients to use them in
    their own web hosting service offerings.


    If you have an issue with your website, there are dedicated support staff available
    to provide specialized solutions. Any popular and broad understanding foundation
    can be offered to clients to direct them through simple requests.


    Customers are given personal hard drives built to order in the same way as a physical
    server. The Linux web hosting service program allows your hosts to connect to
    the Internet via Internap''s carrier''s gigabit uplinks.


    The most recent section variations are provided so the clients can have complete
    control.


    Since the carrier''s networks slice up the individual hosts to conveniently share
    them with the clients, the traditional VPS web hosting service is no longer a
    preferred option.


    VPS providers use container technology to isolate multiple users on a single Linux
    type, which reduces operation and productivity.


    # 6.3 The Network Topology


    From Windows to macOS, most modern operating systems have built-in support for
    Transmission Control Protocol/Internet Protocol (`TCP/IP`) networking. TCP/IP
    networking is possible over various physical interfaces, including Ethernet cards,
    serial ports, and parallel ports.


    Usually, an Ethernet network is used for your local area network (`LAN`) at your
    office or even at home (if you have two or more systems at home), while wireless
    (the next chapter) is becoming more common in most areas.


    You can use a wireless Ethernet network if you have laptop computers on your local
    area network (`LAN`) or do not want to run a tangle of wires to connect a PC to
    the `LAN`. In a typical situation, you have a cable modem or DSL Internet connection.
    You want to link one or more laptops with wireless network cards to the cable
    or DSL modem to access the Internet. This chapter explains how to link to an Ethernet
    `LAN` and access the Internet using wireless networking.


    ## 6.3.1 Understanding TCP/IP of LAN


    The simplest way to consider TCP/IP networking is to think of it as a four-layer
    model, with each layer responsible for a specific role. The layered model depicts
    the data flow between the network''s physical link and the end-user application.


    | 4 | Application | Mail, Transfer, TELNET |

    | :--- | :--- | :--- |

    | 3 | Transport | `TCP` (Transmission Control Protocol) `UDP` (User Diagram Protocol)
    |

    | 2 | Network | `IP` (Internet Protocol) |

    | 1 | Physical | Ethernet |


    Information often passes from one layer to the next in this four-layer model.
    When an application sends data to another application, the data travels across
    these layers: application, transport, network, and physical. The data is sent
    up from the physical network transport application to the receiving end.


    For handling and formatting data, each layer has its own of the protocols — conventions.
    A standard protocol is the desired sequence of acts for a mission, such as addressing
    an envelope, if you think of sending data as being close to sending letters via
    the postal service (first the name, then the street address, followed by the city,
    state, and zip or other postal code).


    These four layers have different names depending on which reference you check.
    The transport layer is known as host-to-host. The network layer is known as internetwork
    or `Internet`. The application layer is known as process/application, and the
    physical layer is known as network access in the old DOD model.


