    Although the company''s attempt to disrupt online ads fails in the long term,
    it is encouraging to see more open source innovation and applications that support
    Linux. On `brave.com`, you will find installation instructions.


    ## Google Chrome


    Google Chrome and its open-source companion `Chromium` have rapidly become the
    most common replacements for `Microsoft Edge` on `Ubuntu` machines since their
    release in late 2008. `Chromium` is available in the `Ubuntu` packages and can
    be installed using `apt` or `snap`. Chrome is also available directly from Google.
    Canonical has considered making `Chromium` the standard browser in `Ubuntu` in
    place of `Internet Explorer`, but Firefox has so far kept its ground.


    ## 7.4 Photoshop Substitute


    Adobe Photoshop is a high-end image development and design program that runs on
    both `Windows` and `Mac OS X`. It is undeniable that almost everyone knows it.
    It is that well-liked. You can also use Photoshop with Linux in a virtual machine
    running Windows, but this is not the best experience.


    As a general rule, we do not have many choices for Adobe Photoshop replacements.
    However, we will go through some of the finest free Photoshop substitutes for
    Linux in this chapter.


    ### Pixlr


    Pixlr is a free but closed-source online image editing program that allows users
    to manipulate images creatively using various advanced features and tens of thousands
    of free effects.


    Pixlr''s software clients are compatible with `Android`, `Mac os`, `Windows`,
    and `Ios`, and it has around 500 million active users more than 10 billion retouched
    images. Although it does not yet have a Linux app, Linux users can take advantage
    of all of its capabilities through accessing its online versions to generate and
    edit beautiful images in their browser.


    ### Photopea


    Photopea is another free online editing software that allows you to create and
    manipulate raster images. It operates in the browser and therefore stores data
    locally, allowing you to use it even though you are not connected to the internet.


    Photopea is programmed to emulate Photoshop''s user interface and many functions,
    such as interacting with masks, filters, textures, shapes, intelligent artifacts,
    and key bindings. Other standard graphical formats like `RAW`, `PSD`, `sketch`,
    and `XCF` are also supported.


    You can not go mistaken with Photopea if you would like a legitimately free editing
    software you can run on any device. It is freely available to access if you do
    not like the advertisements shown.


    ## 7.5 Movie Maker Substitute


    Windows Movie Maker was one of the main reasons Video Production & Video Editing
    became regarded as a simple task, as the software allowed developers to blend
    multiple videos with various effects and everything. Its interface was so simple
    that almost any user could grasp the mechanism in a matter of seconds. However,
    it is understandable if you deem Movie Maker lacking in certain areas, including
    when you require extra functionality or would like to edit videos on a system
    for which Movie Maker is not accessible. However, for video processing, you can
    need a more sophisticated environment. Here are a few windows movie maker alternatives
    you can choose while using Linux:


    ### Shotcut


    Shotcut is a video editing app for Linux, and it is peculiar in that its user
    interface resembles that of a media player rather than an editor. With its extensive
    collection of features, the app makes video editing a breeze. It will suffice
    for most purposes, but if you require more robust features, such as specialized
    or advanced video recording, this may not be the suitable alternative. It counts
    as a good video editing software for Linux due to its features.


    ### Pitivi


    Pitivi is a video editor also open-source and free to use. This app is made for
    simple video editing. Simple functions such as clipping, splitting, trimming,
    and clip snapping are provided. Audio mixing is assisted by the `Pitivi` curves
    method. It also has the potential to use hotkeys and keyboard shortcuts. This
    allows audio and video to be connected, which is a significant gain. It is the
    only open-source video editor to facilitate the `MEF` (Material Exchange Format)
    format. The user-friendly GUI of Pritivi allows for direct manipulation, drag-and-drop,
    and native theme navigation. This program can be converted into several languages.
    It also comes with a user manual.


    ## 7.6 Windows Media Center Substitute


    Here are a few alternatives of the Windows Media center which you can use on Linux:


    ### GeeXboX


    GeeXboX is a full-featured Linux media center operating system that runs on laptops
    and embedded computers. It can be run directly from a USB stick or built conventionally,
    and it has a small footprint.


    The most recent edition, 3.1, is just 160 megabytes in size. GeeXboX is ideal
    for running on older machines or booting from a USB drive. Since GeeXboX is built
    on `Kodi`, you will recognize the user interface.


    ### OpenELEC


    OpenELEC ran `XBMC`, but it has since evolved to run `Kodi`. Installing the destination
    folder on a spare hard disc partition is all that is needed. Your Linux machine
    will run `Kodi` once it is done.


    With connections to the entire `Kodi` add-on collection, you can customize your
    Linux media center to your liking. `Kodi` also supports live Television and DVR,
    offering you a complete media center environment.


    ## 7.7 Adobe Acrobat Reader Substitute


    Adobe Reader has long been regarded as one of the best PDF readers and editors
    on most Desktop systems. The free edition of Adobe Reader contains features such
    as document reading and viewing, printing, and annotations. The `PRO` edition,
    a premium version, adds features including PDF editing, transformation, and signing.


    Other PDF readers offer identical core functions for daily use. There are many
    PDF reader applications to choose from, based on the number of features needed.
    Some focus on providing basic functionality, whereas others provide extra features
    to enhance functionality.


    ### X-PDF


    It performs the essential tasks that a reader would anticipate. The text extraction
    process, PDF to Postscript conversion, and other utilities are among the functions.
    Consumers who prefer graphical user interfaces can be confused. It is available
    for download through the download page or the Linux terminal.


    ### GNU GV


    It is a simple graphical user interface (GUI) framework for displaying `Pdf` documents
    on Linux. It operates by allowing users to communicate primarily with `Ghost script`
    parser via a user interface. It also has an outdated user interface that does
    not appeal to those that require brightly colored graphics. It is, however, compact
    and practical for basic PDF tasks like viewing, printing, and zooming. You can
    use the `apt` package manager, `dnf` for `Fedora`, or `yum` for `CentOS` to install
    it on `Ubuntu`-based distros.


    # Conclusion


    This book has helped you learn how to use Linux with confidence, from installing
    it on your computer to writing your programs.


    We also hope this book has helped you select the best Linux distribution for your
    needs and applications to assist you in performing everyday computing tasks. You
    should also have learned how to work inside a Linux environment using the command
    line by the end of this book, and some steps for making your system stable.


    Linux is unquestionably one of the most dependable Operating Systems available—and
    the best part is that it is free, so you will not have to pay extra to get it,
    and you will not have to settle for counterfeit copies because you cannot afford
    the legal edition.

