    Working with Linux does not require years of hands-on experience, loads of trial
    and error, advanced computer science training, or deep commitment, as it appears
    at first glance. You can create a Linux system that does what you want if you
    can tell anyone how to find your office. The aim of this book is not to transform
    you into a full-fledged Linux geek (although that is the pinnacle of Linux enlightenment)
    Instead, it is to show you the ins and outs of building a well-functioning Linux
    system, and to give you the know-how and ability to use it.


    That is all you will need to get started with Linux. You will need a text editor,
    the Linux shell, or integrated development environment, and knowledge of a programming
    language besides a decent, reliable computer and a Linux distribution to be a
    Linux professional. Now is the time to put your skills to the test and analyzing
    what you have learned so far from this book.


