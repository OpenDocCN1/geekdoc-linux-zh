    顾如其名，稳定版（stable）稳如磐石，并带有最大的安全保护，但不包含最新的软件程序。然而，由于其可靠性和质量，它非常适用于 Web 服务器，也适合那些不担心提供最新软件程序的适度计算机用户。Debian
    Stable 是大多数系统的默认系统。


    Debian Testing 是一个持续更新的版本，包含了尚未进一步集成到稳定发布版的最新软件。这是下一个 Debian 稳定发布版本的开发阶段。它通常容易出现不稳定的情况，并且容易崩溃。此外，它不会及时收到安全更新。`Bullseye`
    是最近的 Debian Testing 版本。


    Debian 的不稳定版本（unstable）仍处于活跃开发中。这是一个创新的发行版，为那些在代码进入“Testing”级别之前积极贡献代码的程序员提供了一个理想的论坛。


    数百万的人正在使用 Debian，因为它拥有庞大的软件包仓库和高可靠性，特别是在生产系统中。


    ## 2.9 Arch Linux


    Arch Linux 是一个独特、紧凑且便携的 Linux 发行版，旨在为关注挂载和运行机制的资深用户或 Linux 专家设计。它允许用户根据自己的喜好自定义或配置系统。Arch
    是为精通 Linux 工作原理的人设计的。


    与大多数 Linux 发行版不同，Arch Linux 不是由 Debian 或 Red Hat 等父级发行版生成的。由于它构建在一个主要的（但稳定的）基础之上的，它保持了独立，并因其极快的
    Linux 发行速度而受到技术人员的尊重。所有其他内容都通过 `Pacman` 软件包过程添加。


    Arch 是持续发布版，这意味着它的所有内容都是更新的。你只需要刷新界面中的模块。标准的软件包管理器是 `Pacman`，它利用了 Arch 用户仓库（AUR），这是一个用于安装软件程序的平台。最近的更新是
    2020.09.01。


    ## 2.10 Slackware


    从 1993 年开始，Slackware 可能是第一个准确的 Linux 发行版。它采用 `.tar.gz` 包而不是更熟悉的 `YUM` 或 `APT`
    框架，这与 Arch 相同。如果你是一个不想编译任何内容的资深用户，Arch 可能会适合你，因为它仍然允许与 Slackware 相同的自定义程度。


    Slackware 主要集中于“软着陆 Linux 发行版”（Soft-landing Linux Distribution），已成为其他几个软件包的基础，最著名的是
    SUSE Linux 发行版的第一个变体，它是最早的仍在维护的发布版本。


    Slackware 致力于通过关注设计可靠性和便利性，成为一个更“类 Unix”的发行版。


    它尝试通过对从上层的应用程序包进行适当的更改，而不预测使用用例或排除消费者的决策。与大多数主流 Linux 发行版不同，Slackware 缺乏视觉化设置过程，也不会自动解决应用程序的依赖关系。对于设置和管理，它依赖文本文件和一些
    shell 脚本。它启动后进入一个类似于无需进一步修改的命令行控制环境。由于其许多限制性和简单直接的特性，Slackware 被认为最适合有经验的、专业导向的
    Linux 用户。


    尽管 Slackware 是开源软件且免费的，但它缺乏结构化的错误跟踪系统或社区代码仓库，主要由 Volkerding 定期发布更新。开发者没有结构化的成员流程，Volkerding
    似乎是发布的主要贡献者。


    ## 2.11 Gentoo


    Gentoo 只是一个为专家设计的发行版，这些专家从一开始就能识别出他们正在处理的服务。开发者、框架工程师和网络工程师属于这一类。不建议 Linux 新手使用。Gentoo
    旨在让那些寻求深入理解基于 Linux 的操作系统的优缺点的人。


    Gentoo 带有 `portage`，这是在其他发行版（包括 Calculate Linux 和 `Sabayon`）中也使用的软件包控制系统，它以 Gentoo
    为中心并与之兼容。它用 `Python` 编写，并基于端口集（port collections）的原则构建。基于 BSD 的发行版（如 `NetBSD` 和
    `OpenBSD`）包含了端口集，即更新和补丁的编译集合。


    ## 2.12 CentOS


    CentOS 平台是由 CentOS 组创建并开发的公共操作系统，旨在提供一个安全且稳定的开源环境。CentOS 专注于 `RHEL` 并提供免费下载和更新，是
    Red Hat Linux 的极佳替代品。它为用户提供了 `RHEL` 的可靠性和准确性，同时也为他们提供了免费的安全功能改进。CentOS 8 是想要利用
    `RHEL` 特性的 Linux 用户的热门选择。


    CentOS 8.2 是最新版本，也是 CentOS 8 的第三个版本。它使用 `BaseOS` 和 `App stream` 仓库，并预装了最新的软件包，如
    `Python 3.8`、`Maven 3.6`、`GCC 9.1` 等。


    # 第 3 章：安装 Linux


    今天大多数 PC 预装的是 Microsoft Windows 而不是 Linux。虽然这种方法让设备从通用公共包中取出后用起来很方便，但也意味着如果你使用
    Linux，几乎总是必须自己手动挂载它。


    在 Linux 早期，让 Linux 在 PC 上运行几乎需要计算机科学的学士学位。对我们来说有趣的是，图形化安装现在相对简单就能完成，对于用过 Microsoft
    Windows 等图形化操作系统的用户来说很容易。本章涵盖了在你的计算机上安装和运行 Linux 发行版所需的所有知识。


    尽管各种 Linux 发行版使用多个安装命令，但它们都是非常出色的。虽然你可能在安装过程中看到的视觉效果与我们完全相同，但基本原理应该是类似的。如果你注意到某些新东西或我们没有提到的东西，请不要惊讶。安装程序仅仅是在根据你的计算机系统定制它所提供的内容。


    ## 3.1 什么是虚拟机？


    虚拟机应用程序生成一个名为虚拟机的虚拟化生态系统，它作为一个独立的计算机系统运行，主要使用虚拟硬件系统。在你现有的操作系统上，虚拟机只是窗口中的一个进程在运行。你可以使用虚拟机启动操作系统安装盘，操作系统将会被欺骗，认为自己正运行在真实的设备上。


    你机器上的默认系统软件称为主机（host），而位于虚拟机内部运行的操作系统称为客体（guest）。这让事情不会变得过于复杂。


    客体操作系统挂载在特定虚拟机的数字硬盘上。该文件由虚拟机程序向客体操作系统呈现为一个普通的硬盘。这确保了你不需要处理物理硬盘的分段或其他棘手的问题。

