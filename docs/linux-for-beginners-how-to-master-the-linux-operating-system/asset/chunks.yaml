- fmt: '

    ### 1. Protocol Layers


    - **Application**: Runs user-facing programs such as email clients, file transfers,
    and web browsers. Simple Mail Transfer Protocol (`SMTP`) and Post Office Protocol
    (`POP`) for email, Hypertext Transfer Protocol (`HTTP`) for the Internet, and
    File Transfer Protocol (`FTP`) for file transfers are application-level protocols.
    A port number is often assigned to application-level protocols and can be considered
    an identifier for a particular application. `HTTP` or a web server, for example,
    is connected with port `80`.

    - **Transport**: Moves information from one application to another. Transmission
    Control Protocol (`TCP`) and User Datagram Protocol (`UDP`) are the two most relevant
    protocols in this layer (`UDP`). `TCP` ensures data transmission, while `UDP`
    simply sends data without ensuring that it reaches its intended destination.

    - **Network**: Receives data packets from one network and transfers them to another.
    Data packets are routed from one network to the next before they hit their destinations
    if the networks are far apart. The Internet Protocol is the most important in
    this layer (`IP`).

    - **Physical**: The physical networking hardware holds data packets in a network
    (such as an Ethernet card or token ring card).


    The layered model''s simplicity is that each layer is responsible for just one
    mission, leaving the other layers to handle the rest. Layers can be mixed and
    matched. A `TCP/IP` network can be built on any form of physical network medium,
    from Ethernet to radio waves (in a wireless network). Each layer can be implemented
    in various modules, and the program is modular. The transport and network layers
    are typically included with the operating system, and any application may use
    them.


    `TCP/IP` has made substantial strides due to the availability of secure, usable
    applications. The `TCP/IP` protocols began as working applications rather than
    a paper summary of network architecture and protocols — and who can argue with
    what is already working? `TCP/IP` now dominates the Internet.


    ### IP Addresses


    When you have a network with many machines, you need to classify each one individually.
    The `IP` address is a computer''s address in `TCP/IP` networking. The address
    is founded on a network address, and a host address since `TCP/IP` is concerned
    with internetworking. You may think of a network address and a host address as
    having to have two addresses to identify a computer uniquely:


    1. The network address specifies the computer''s location on the network.

    2. A host address identifies a particular device on a network.


    An `IP` address is a 4-byte (32-bit) value that combines the network and host
    addresses. Each byte should be written as a decimal value, with a dot (`.`) after
    each number. So network addresses like `132.250.112.52` appear. Dotted-decimal
    or dotted-quad notation is a method of writing `IP` addresses.


    A byte (which has 8 bits) may have a value between `0` and `255` in decimal notation.
    A valid `IP` address may contain dotted-decimal numbers only between `0` and `255`.


    ### Port numbers and internet services


    Since several standard services are available on any device that supports `TCP/IP`,
    the `TCP/IP` protocol suite has become the Internet''s lingua franca. These services
    keep the Internet running by making it easier to send and receive email, news,
    and web pages. These services are recognized by a variety of names, including:


    - `DHCP` (Dynamic Host Configuration Protocol) is a protocol that enables a device
    to configure `TCP/IP` network parameters dynamically. `DHCP` is a protocol that
    assigns dynamic `IP` addresses and other networking information (such as name
    servers, default gateways, and domain names) to `TCP/IP` networks. On port `67`,
    the `DHCP` server is listening.

    - `FTP` (File Transfer Protocol) is a protocol for transferring data over the
    Internet between computers. `FTP` uses two ports: port `20` for data transfer
    and port `21` for control information exchange.

    - Domain names are translated into `IP` addresses using `DNS` (Domain Name System).
    The port number for this service is `53`.

    - `HTTP` (Hypertext Transfer Protocol) is a protocol for exchanging documents
    between computers. The World Wide Web''s underlying protocol is `HTTP`. The web
    server and client communicate on port `80` by default. As `SSL/TLS` is added,
    the protocol becomes `HTTPS`, and the port number is changed to `443`.

    - `SMTP` (Simple Mail Transfer Protocol) is a protocol for sending and receiving
    email messages between systems. For information sharing, `SMTP` uses port `25`.

    - The client receives mail using `POP3` (Post Office Protocol version 3), which
    uses port `110`. The port changes to `995` when `SSL/TLS` is used for protection.

    - Clients may also use `IMAP` (Internet Message Access Protocol) to communicate
    with mail (instead of `POP3`), and it uses port `143`. The port changes to `993`
    when `SSL/TLS` is used for security.

    - `NNTP` (Network News Transfer Protocol) is a protocol for transmitting news
    articles around the Internet in a store-and-forward format. The `NNTP` protocol
    uses port `119`.

    - `NetBIOS` is a networking protocol used by Windows, and it uses several ports
    for the session, the most common of which is `139`.

    - `SSH` (Protected Shell) is a secure remote login and other secure network services
    protocol used on an unstable network. Port `22` is used by `SSH`.

    - When a user on one device logs in to another system on the Internet, `Telnet`
    is used. (To log in to the remote device, the user must have a valid user ID and
    password.) By default, `Telnet` connects to port `23`, but the `Telnet` client
    can link to any port.

    - `SNMP` (Simple Network Management Protocol) is a protocol that allows you to
    manage all forms of network devices over the Internet. `SNMP` uses the same two
    ports as `FTP`: `161` and `162`.

    - Cisco''s Rendezvous Directory Service uses port `465`.

    - `TFTP` (Trivial File Transfer Protocol) is a file transfer protocol that allows
    you to pass files from one device to another. (It is usually used to import boot
    files from another network host through `X` terminals and diskless workstations.)
    On port `69`, `TFTP` data is transferred.

    - `NFS` (Network File System) is a file-sharing system that allows computers to
    share files. `NFS` uses Sun''s Remote Procedure Call (`RPC`) facility, which communicates
    over port `111`.


    Each service is connected to a well-known terminal. Each port is used by the `TCP`
    protocol to locate a service on any device. (Each service is provided by a server
    process, a particular computer program that runs on a system.)


    ### 6.3.2 Understanding Wireless Networks


    You have heard of Wi-Fi. Wireless Fidelity (`Wi-Fi`) is a short-range wireless
    network that operates similarly to wired Ethernet networks. The technical details
    of how `Wi-Fi` networks operate are described by `IEEE` (Institute of Electrical
    and Electronics Engineers) standards. Manufacturers use these specifications to
    develop the products you can purchase to set up a wireless local-area network
    (`WLAN`).


    The Wi-Fi network norm has progressed quickly. `802.11a` gave birth to `802.11b`,
    and the two were merged to form `802.11g`, which `802.11n` eventually superseded.
    But the goal of both of these standards was to explain how the physical layer
    of a wireless Ethernet network functions. You need not know all the specifics
    of all those specifications to set up a wireless network, but learning a few key
    points will help you buy the right equipment for your network.


    Since all radio channel users share that bandwidth, the actual data throughput
    that a user sees is still much less than the channel''s total capacity. Also,
    as the distance between the user''s PC and the wireless access point grows, the
    data transfer rate decreases.


    The infrastructure, ad hoc modes, and Wired Equivalent Privacy (`WEP`):


    For wireless Ethernet networks, the `802.11` protocol specifies two modes of operation:
    infrastructure and ad hoc. Without an access point, ad hoc mode is essentially
    two or more wireless Ethernet cards communicating with each other.

