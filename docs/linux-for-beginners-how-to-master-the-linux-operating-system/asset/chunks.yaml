    基础模式（Infrastructure mode）描述了所有无线以太网卡如何相互通信以及通过接入点与有线局域网通信。在本章中，假设你已将无线以太网卡设置为基础模式。这种模式在配置文件被称为“控制”（controlled）。


    无线等效隐私（WEP）是 `802.11` 标准的一个特性，用于保护无线通信免受窃听。WEP 使用移动站（如带有无线以太网卡的笔记本电脑）与接入点（也称为基站）之间交换的
    40 位或 104 位隐藏密钥。在数据包传输之前，该密钥用于对其进行加密，并进行完整性检查以确保数据包在传输过程中未更改。


    `802.11` 标准并未提到共享密钥是如何创建。许多无线局域网使用所有移动站和接入点都交换的单一密钥。然而，在大学校园这样的环境中，这种方法的扩展性不佳，因为密钥是所有用户共享的——你知道与数百人共享密码是什么什么体验。WEP
    很少用于大学等大型无线网络。在这样的无线网络中，必须使用其他验证方法，如 `SSH`（安全 Shell）。尽管 WEP 曾被认为适用于家庭无线网络，但现在已不再被推荐。


    Wi-Fi 联盟十多年前发布了一种名为 Wi-Fi 安全访问（WPA）的规范，它取代了之前的 WEP 标准，并通过一些改进增强了保护。与 WEP 使用固定密钥不同，WPA
    使用临时密钥完整性协议（TKIP），它为网络传输的每 10 KB 数据创建新密钥，使得 WPA 更难破解。Wi-Fi 安全访问 2（WPA2）是 WPA 加密的第二代，由
    Wi-Fi 联盟于 2004 年发布。WPA2 基于最终 `IEEE 802.11i` 标准，使用带有数字证书的公钥加密以及 `RADIUS`（远程认证拨号用户服务）服务器进行无线以太网网络中的认证、授权和计费。WPA2
    使用高级加密标准（AES）加密数据。最近公布 WPA3 似乎是未来的趋势，旨在进一步提高安全性。


    ## 互联网的主要协议


    网协议（Internet Protocol）建立网络边界并中继数据报，从而实现互联网网络。


    该结构由头部和有效负载组成，其头部包含主要的 IP 地址和使用特定参数链接的接口。内部和外部网关协议、路由前缀以及网络标识都涉及其中。端到端协议在可靠性方面发挥作用，但预期的框架如下：


    | | UDP Header | UDP DATA → Transport |

    | :--- | :--- | :--- |

    | IP Header | IP Data → Internet |

    | Frame Header | Frame Data | Frame Footer → Link |

    | Data | Application |


    ## 获取对端信息


    要获取对端信息，返回所有的 TCP 和 IP 信息。服务器和客户端都通过这种方式连接到网络。你也可以使用 `getpeername()` 套接字在信息快速可用时进行捕获并保存信息。这包括由不同
    Linux 方法发送和检索的正确数据，以及程序中对应的相应的套接字描述符和权限。某些信息也可以被视为私有以改善用户体验。


    允许套接字 `TCPAcceptor::accept()` 在网络中流行以接收数据。你可以这样来区分服务器和客户端行为的区别。


    ## 创建与销毁


    这些与套接字描述符相关，并允许在屏幕上显示对端 TCP 端口和 IP 地址。与之前的 Linux 前身不同，它没有使用 `C++` 之外的其他语言。


    析构函数可能会破坏你建立的任何链接。例如，为了退出你的一个社交网络账户，正是因为存在析构函数。


    大多数 Linux 发行版都有许多程序，可以满足你大部分的日常计算需求。大部分程序都可以从你发行版的 GUI 桌面访问。


    几乎每个 Linux 程序都有一个专门的网站，你可以在那里找到关于它的详细信息，包括在哪里以及如何下载。每个发行版都带有一系列工具和应用程序，你可以在设置系统时安装它们。


    如果是 Debian 或基于 Debian 的发行版（如 Ubuntu），缺少某个应用时只要只要有高速互联网连接，就可以快速获取。


    ## Linux 和 SMTP 客户端


    SMTP 客户端可能会使用一些之前相同的字符，但会有一些微调。这完全关于打开套接字、打开输入输出源、读写套接字以及清理客户端门户。此外，请注意它涉及：


    1. 数据报的传输。这意味着如果你的门户向不同的客户端和服务器发送数据报，本地套接字将运行。

    2. Linux 通信流和数据报通信。

    3. 套接字编程。


    ## Echo 客户端设置


    在 Linux 中，Echo 客户端通过向 `socket()` 传递参数运行，这意味着你可以使用带有 `PF INET` 特性的 IP 将它们放入同一个
    TCP 套接字中。要构建一个正确的客户端结构，记住你需要改进之前的代码。


    ## Linux 中的套接字


    同时，注意你可以用 `C` 编写 Linux，因为它们都使用套接字。`socket` 充当客户端与端口之间的桥梁，向服务器发送请求并等待其响应。最后，完成数据传输和接收。


    同时，Linux 套接字将为服务器构建一个套接字，将其连接到端口。你可以监听客户端的流量。你也可以等待客户端到达该阶段并观察提交和接收的数据。以下是它的其他一些功能：


    | socket_description | Description |

    | :--- | :--- |

    | `socket_description` | 这允许客户端和服务器的细节显示在屏幕上。 |

    | `write buffer` | 这标识信息。 |

    | `write buffer length` | 你需要查看字符串的输出以写入缓冲区长度。 |

    | `client_socket` | 将显示套接字定义。 |

    | `address` | 这用于 `link` 函数中将地址行保持在栈顶。 |

    | `address_len` | 如果第二个参数为空，则它将显示在屏幕上。 |

    | `return` | 这有助于返回客户端和套接字轮廓。由于此点，客户端和服务器之间的交互通常被简化了。 |

    | `server_socket` | 这是顶层套接字的描述。 |

    | `backlog` | 这是尚未满足的需求数量。 |


    ## 6.4 诊断命令和文件


    设置传输控制协议/网协议（TCP/IP），就像 Linux 中几乎所有其他内容一样，涉及准备一系列配置文件（你可以用任何文本编辑器编辑的文本文件）和命令。`/etc`
    目录包含这些文件的大部分。Linux 安装程序尝试帮助预填充值，并消除你直接与每个 TCP/IP 配置文件通信的需求。然而，如果你知道文件名及其用途，手动编辑文件（如有必要）总是更容易的。


    当你安装 Linux 时，可以设置 TCP/IP 网络。然而，为了成功控制网络，你将需要熟悉 TCP/IP 配置文件并在必要时编辑它们。（例如，为了验证名称服务器是否正确列出，你需要了解
    `/etc/resolv.conf` 文件，它存储了名称服务器的 IP 地址。）


    | File Name | Contents: |

    | :--- | :--- |

    | `/etc/hosts` | 本地网络以及你经常访问的其他系统的 IP 地址和主机名 |

    | `/etc/host.conf` | 关于如何将主机名转换为 IP 地址的指令 |


