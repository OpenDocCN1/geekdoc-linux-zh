    # 6.3 网络拓扑结构


    从 Windows 到 macOS，大多数现代操作系统都内置了对传输控制协议/网协议（`TCP/IP`）网络的支持。TCP/IP 网络可以通过各种物理接口实现，包括以太网卡、串口端口和并行端口。


    通常，以太网网络用于你办公室甚至家中的局域网（`LAN`）（如果你家里有两个或更多系统），而无线网络（下一章）在大多数地区正变得越来越普遍。


    如果你在局域网（`LAN`）上有笔记本电脑，或者不想拉一堆乱线来将 PC 连接到 `LAN`，你可以使用无线以太网网络。在通常情况下，你有一个缆调制调器或
    DSL 互联网连接。你想将带有无线网卡的笔记本电脑连接到缆或 DSL 调制调器以访问互联网。本章解释了如何连接到以太网 `LAN` 并使用无线网络访问互联网。


    ## 6.3.1 理解 LAN 的 TCP/IP


    考虑 TCP/IP 网络最简单的方法将其视为一个四层模型，每层负责一个特定的角色。分层模型描述了从物理链路到终端用户应用程序之间的数据流。


    | 4 | 应用层 | 邮件、传输、TELNET |

    | :--- | :--- | :--- |

    | 3 | 传输层 | `TCP` (传输控制协议) `UDP` (用户数据报协议) |

    | 2 | 网络层 | `IP` (网协议) |

    | 1 | 物理层 | 以太网 |


    在四层模型中，信息通常从一层传递到下一层。当一个应用程序向另一个应用程序发送数据时，数据跨越这些层：应用、传输、网络和物理。数据从物理网络传输向上传输到接收端。


    为了处理和格式化数据，每层都有自己的协议 —— 惯例。标准协议是执行任务的预期序列，例如写信封，如果你认为发送数据类似于通过邮政服务寄信（首先是姓名，然后是街道地址，接着是城市、州和邮政编码或其他邮编）。


    这四层根据你参考的资料不同有不同的名称。传输层被称为主机到主机。网络层被称为网际网或 `Internet`。应用层被称为进程/应用，物理层在旧的 DOD 模型中被称为网络访问。


    从上到下，是这四层的功能：


