    ### Photopea


    Photopea 是另一个免费的在线编辑软件，允许你创建和处理位图图像。它在浏览器中运行，因此本地存储数据，即使你没有连接互联网也可以使用它。


    Photopea 的程序旨在模拟 Photoshop 用户界面和许多功能，例如与掩罩、过滤器、纹理、形状、智能对象和按键绑定进行交互。还支持 `RAW`、`PSD`、`sketch`
