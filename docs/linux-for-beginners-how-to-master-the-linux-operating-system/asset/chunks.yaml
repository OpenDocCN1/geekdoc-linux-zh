    | Crontab | 设置按定期执行的命令。 |

    | :--- | :--- |

    | Kill | 通过进程号停止进程。通常使用 `kill -9` 强制停止无法停止的程序。 |

    | Killall | 通过名称而非进程号停止进程。 |

    | Nice | 为进程分配 CPU 调度优先级。 |

    | Pidof | 获取程序或进程的 ID 号。 |

    | Ps | 获取大量进程的 ID 号，通常用作 `ps aux`。 |

    | Pstree | 显示程序之间的关系。 |

    | Renice | 更改程序的 CPU 使用优先级。 |

    | Top | 显示资源使用情况。 |


    ## 网络命令


    即使只是你的小型家庭网络，绝大多数 Linux 系统现在也已连接到互联网。图形化的网络管理器（Network Manager）工具可以帮助你在一个位置上自定义网络设置。Linux
    还包含一系列命令行工具，用于管理和微调网络设置。下表列出了一些实用的网络相关命令。


    | Ethtool | 显示网络接口的以太网设置。 |

    | :--- | :--- |

    | Ifconfig | 显示或设置网络接口的 IP 地址和子网掩码。 |

    | Ip | 显示或设置网络接口的 IP 地址、子网掩码和路由器。 |

    | Iw | 显示或设置无线网络接口的无线设置。 |

    | iwconfig | 显示或设置无线网络接口的 SSID、IP 地址和子网掩码。 |

    | Nmcli | 打开网络管理器命令行界面。 |

    | Nmtui | 打开基于菜单的网络管理器命令行工具。 |

    | Route | 显示或设置默认路由信息。 |


    ## 5.2 函数命令


    由于每个命令都有独特的角色，根据其角色将这些工具分类是非常容易的。如果你知道需要运行什么进程，但不确定哪条命令可以完成任务，可以从这里开始搜索。你可以通过参考帮助页（man
    pages）和其他支持材料（在线网站和参考书）进行更深层次的学习。


    在命令提示符处，输入 `man command`即可进入帮助手册。例如，`man ls` 会显示文件列出命令的支持信息。


    ### Shell 帮助命令


    在寻找命令的支持时，你可以使用一组非常有用的 Shell 命令，如表所示。


    寻求命令提示符选项的知识是一项永无止境的搜索。为了快速找到这些详细材料，帮助页系统在你指尖提供了有用的指南。


    | Apropos | 查找帮助页描述中包含关键词的命令。 |

    | Info | 寻找有用信息的方法之一。 |

    | Man | Linux 和 UNIX 中获取帮助的标准方式。 |

    | Whatis | 获取命令的单行描述。 |


    ### Bash 命令


    当你尝试在帮助页中查找任何命令的支持详情时，它们似乎并不存在，且命令没有以文件的形式出现在你的系统上。当你在提示符处输入命令时，请记住你正在操作一个 Shell
    程序。（在我的情况下，默认的 Linux Shell 是 `bash`。）Shell 收集了你可以用来与它通信的命令，如下表所示。


    | Alias | 创建或列出命令快捷方式。 |

    | Unalias | 命令快捷方式。 |

    | Env | 列出当前运行的环境变量及其设置。 |

    | History | 列出你最后输入的 1,000 条命令。 |

    | Export | 每当你被要求设置环境变量时，创建该变量并使用此命令，以便该变量被妥善记住。 |


    当你查看这些命令的帮助页条目时，你会得到 `BASH BUILTINS` 加载的支持。要搜索此手册，按下正斜杠键（`/`）打开帮助搜索 GUI，然后输入要查找的命令名称。按“回车”开始搜索。界面会在第一次遇到该词时停止。点击
    N 键跳转到术语的下一次出现处再次尝试。


    例如，你可能正在阅读巨大的 bash 帮助页（输入 `man bash` 进入此页面），但你只对提示符感兴趣，提示符是文本窗口中光标左侧的文本。提示符的一个良好示例是：


    ```

    rich@testbox:~$

    ```


    要跳转到该短语第一次出现，输入 `/prompt` 并按“回车”。如果单词周围的文本与你寻找的内容不匹配，点击 N 键移动到下一个。


    ### 压缩与组合


    尽管磁盘空间不再以前那样昂贵，但带宽和备份介质的需求仍然很大。如表所示，该类别提供了各种工具用于为了存储压缩和组织数据。


    | bzip2 | 将文件压缩为 `.bz2` 格式。主要用于大型文本文件。 |

    | bunzip2 | 解压缩 `.bz2` 文件。 |

    | gunzip | 解压缩 `.gz` 和 `.tgz` 文件。 |

    | Unzip | 解压缩 `.zip` 格式的文件。 |

    | Compress | 将文件压缩为 `.Z` 格式。 |

    | Xz | 压缩和解压缩 `.xz` 格式的文件。 |

    | Tar | 将文件组合打包。使用此命令的标准方法是 `tar xvf filename`，例如 `tar xvf download.tar`。 |

    | Gzip | 将文件压缩为 `.gz` 格式。 |

    | Uncompress | 解压缩 `.Z` 格式的文件。 |

    | Zip | 将文件压缩为 `.zip` 格式。 |


    ## 5.3 文件系统命令


    无论使用哪种操作系统，如果不导航和操作文件系统，做事情都是挑战性的。这些工具将帮助你确定位置。


    ### 通用文件系统命令


    表中所指定的命令提供了对整个文件系统的信息或执行操作，从开发、调优到修复和恢复。其中一些命令返回信息，而另一些则提供了进行深度文件系统操作的手术工具。


    | e2label | 为 `ext2` 或 `ext3` 分区应用文件系统标签。 |

    | badblocks | 搜索分区中的坏块。 |

    | Eject | 弹出 CD 或 DVD。 |

    | e2fsck | 检查并修复 `ext2` 或 `ext3` 文件系统。 |

    | Mkfs | 创建文件系统（格式化分区）。 |

    | Fsck | 可以检查并修复许多类型的文件系统。 |

    | Mount | 将分区加载到你的文件系统中。 |

    | Umount | 从文件系统中移除分区。 |

    | Sync | 将缓冲区中的所有信息保存到磁盘。 |

    | tune2fs | 调整 `ext2` 和 `ext3` 文件系统参数。 |


    ### 文件组织命令


    如表所示，文件组织命令提供了移动文件和文件系统单位的工具。


    | Cp | 复制文件。 |

    | Df | 显示分区及其可用空间。 |

    | Ls | 列出目录内容或文件信息。 |

    | Mkdir | 创建目录。 |

    | Cd | 切换目录。 |

    | Du | 显示目录及其子目录使用的磁盘空间。 |

    | Ln | 创建快捷方式。 |

    | Mv | 移动或重命名文件。 |

    | Rmdir | 删除空目录。 |

    | Pwd | 显示当前所在目录的路径。 |

    | Rm | 删除文件。 |


    ### 文件定位命令


    下表提到的命令帮助你从 Linux 巨大的树形结构文件系统中查找文件。


    | Find | 核心文件系统搜索工具。 |

    | Locate | 轻量级文件系统搜索工具。 |

    | Which | 如果你输入此命令，将告诉你运行程序的路径。 |


    ### 文件属性命令


    文件类似于糖果。包装上列出了成分、尺寸和制造日期，这些都描述了内部美味的糖块。（也许包装是防儿童的。）包装信息存储在文件的 inode 中。除了更改文件 inode
    信息外，这些命令还可以返回有关文件内容的数据，如表所示。


    | Chgrp | 更改文件关联的组。 |

    | Stat | 显示文件的统计信息。 |

    | Wc | 显示文件中有多少个单词、行数等。 |

    | Chmod | 更改文件权限。 |

    | File | 显示你正在处理什么类型的文件。 |

    | Chown | 更改文件的所有者。 |

    | Touch | 创建此命名的空文件。 |


