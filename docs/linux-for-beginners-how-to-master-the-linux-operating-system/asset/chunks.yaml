  trans: '


    你计算机上的操作系统（OS）负责计算机的硬件和软件。通常会有多个计算机应用程序同时运行，它们都需要访问计算机的中央处理器（`CPU`）、存储和内存。这由操作系统（OS）进行协调，以确保每个软件都能获得其所需的资源。


    计算机软件和系统开发从操作系统（OS）中受益匪。如果没有操作系统，每个应用程序都必须包含自己的用户界面以及管理计算机低级功能所需的大量代码，例如磁盘存储、网络连接等。鉴于可用硬件资源的范围广泛，这将增加任何应用程序的大小，并导致软件开发变得低效。


    许多基础任务，如传输数据包或在典型的输出屏幕（如显示器）上显示文本，可以被委托给系统软件，系统软件充当硬件和软件之间的桥梁。系统软件允许应用程序以可预测且一致的方式与设备通信，而无需应用程序知道有关硬件的特定细节。


    只要所有应用程序都以相同的方式访问相同的服务和资源，操作系统（OS）就可以处理几乎任何范围的应用程序。这减少了创建和调试程序所需的时间编程工作，同时确保用户可以通过标准且直观的界面监控、管理和维护系统硬件。


    为了针对特定的硬件环境优化操作系统服务，操作系统（OS）使用了广泛的计算机驱动程序数据库。虽然任何软件都可以对存储媒体进行初始调用，但操作系统接收该调用并使用关联驱动程序将调用转换为该计算机硬件资源所需的指令。如今，操作系统（OS）作为一个稳健的接口，用于识别、配置和管理各种硬件，例如处理器、处理模块和内存管理。


    ## 操作系统（OS）的主要功能


    操作系统（OS）有三个主要功能：通过命令行界面（`CLI`）或图形用户界面（`GUI`）提供用户界面（`UI`）；执行并调节应用程序的执行；向向应用程序通信系统资源（通常通过结构化的
    `API`）。


    ### 用户界面 (UI)


    `UI` 代表用户界面。每个操作系统必须有一个图形用户界面（`GUI`），允许用户与操作系统通信，以设置、自定义和排除操作系统及其硬件的故障。`CLI` 和
    `GUI` 是两种两种主要的用户界面。


    `CLI` 也称为终端模式窗口，基于文本的系统界面，允许用户使用标准键盘输入与某些任务相关的命令、参数和参数。个人依赖于触摸屏、触控板和鼠标等输入设备提供的输入来导航基于图标和符号的
    `GUI` 或桌面。


    主要感兴趣的是修改文件和程序的用户（例如通过双击图标在其主应用程序中打开文件）似乎是最高频的 `GUI` 用户。专业开发者和高级用户继续青睐 `CLI`，因为他们必须经常管理极其粗略且复杂的命令，例如开发和管理脚本以为员工建立新计算机。


    ### 应用程序管理


    每个应用程序都由操作系统（OS）启动和管理。这通常有助于一系列行为，例如多个进程和线程的时间分片，以便不同的任务可以分用可用处理器的长时间。它有助于管理程序为获取处理器的严肃响应而产生的中断。这有助于确保有足够的容量运行程序，并且其数据在呈现时不会与其他操作和执行杂务发生冲突。


    操作系统（OS）还可以提供 `APIs`，允许应用程序在不理解有限的操作系统或设备状态的情况下使用操作系统和硬件操作。例如，`Windows API` 可以帮助软件从鼠标和键盘获取输入，构建对话框和按键等
    `GUI` 元素，向存储设备读写数据等。应用程序旨在运行的哪个操作系统通常是经过定制的。


    操作系统还可以为程序提供各种服务，即：


    1. 在多用户环境中，多个程序将同时运行，操作系统决定哪些程序应该按什么顺序运行，以及每个程序在移动到下一个之前应该被多少时间。

    2. 它管理与连接硬件设备（包括硬盘、打印机和拨号接口）的 `I/O`。

    3. 它向每个程序或系统操作员发送有关服务状态和任何可能出现的故障的通知。

    4. 它可以处理批作业协调，以便辅助应用程序能够专注于其他任务。

    5. 在支持并行处理的系统中，操作系统可以处理如何拆分程序以便在多个处理器上同时运行。


    所有主计算机系统都需要操作系统，有时操作系统必须设计具有多种属性以适应不同的形状。


    ### 设备管理


    操作系统的作用是定义、自定义并将计算机设备连接到应用程序。操作系统可以配置设备驱动程序。它识别并检测硬件，允许操作系统和程序在无需预先了解设备或装置的情况下在系统上运行。


    找到正确的设备并激活驱动程序是操作系统（OS）的责任，这样程序只需要对设备提出请求，而不需要使用该设备的唯一命令或代码。许多设备，如连接选项、通信端口、图形设备（如
    `GPUs`）、主板芯片组，甚至存储设备，都处于类似的情况。


    操作系统（OS）识别并配置用于操作逻辑和物理设备，通常将其存储在类似 `Windows Registry` 的逻辑结构中。为了确保适当系统效率和保护，设备制造商必须定期修补和升级驱动程序，操作系统也应该这样做。当更换计算机时，操作系统还会下载并修改新驱动程序。


    ## 操作系统的类型


    尽管操作系统的基本功能相似，但许多操作系统适用于大量的平台和用户需求。


    ### 通用操作系统


    这种操作系统可用于各种。通用操作系统是指一组旨在在各种硬件上运行广泛应用程序的操作系统，允许用户同时运行多个应用程序或任务。通用操作系统可以部署在各种笔记本电脑和桌面配置上，并运行各种应用程序，包括会计软件、目录、浏览器浏览器和游戏。为了确保程序能够高效共享广泛的硬件，通用操作系统通常侧重于线程和硬件管理。


    以下是流行的桌面操作系统示例：


    1. 办公和家用计算机的非官方标准是微软的签名操作系统 `Windows`。这种基于 `GUI` 的操作系统首次于 1985 发布，之后经常更新。

    2. 苹果 `Mac` 系列计算机和工作站的操作系统是 `Mac OS`。

    3. `Unix` 是一种专注于适应性和多功能的多用户操作系统。`Unix` 是最早用用 `C` 编程语言开发的操作系统之一，开发于 20 世纪 70 年代。

    4. `Linux` 是作为 PC 用户的免费替代方案而创建的。`Linux` 以高性能和可靠的操作系统而闻名。


    移动操作系统


