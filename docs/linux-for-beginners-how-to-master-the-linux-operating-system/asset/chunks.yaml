    # 硬件兼容性


    **SCSI 控制器**：`SCSI controllers` 将硬盘和其他外设连接到独立高性能 PC 和旧版工作站中。如果你的 PC 拥有 `SCSI controller`，请了解更多关于该控制器的品牌和型号。


    **声卡**：如果你的 PC 拥有声卡且你想在 Linux 中使用它，请确保该显卡兼容。成功安装 Linux 后，你可以对声卡进行自定义。


    **显卡**：在文本模式下，Linux 支持任何显卡（也称为显示器适配器），但如果你想使用图形用户界面，你需要一个支持 `X Window System`
    的显卡。安装程序可以检测支持的显卡并正确配置 `X Window System`。如果安装程序无法检测你的显卡，了解显卡的品牌和型号将有所帮助。


    **打印机**：其品牌和型号必须标识你计划在 Linux 中使用的所有打印机。


    许多 Linux 发行版（如 `Debian GNU/Linux`）可以在任何支持 Linux 内核的硬件上运行。


    查看你的 PC 硬件是否与特定发行版兼容，请访问供应商网站查看他们的硬件兼容性列表。


    ## 为你的 Linux 发行版释放空间


    Windows 安装在标准 Windows PC 的单个大分区上，占据了整个硬盘。为了为 Linux 腾出空间，你需要缩小分区。安装软件在 Linux 安装期间会将空闲空间用于
    Linux 分区。


    尝试 Live CD 发行版（如 `Ubuntu`）时不需要重新划分硬盘。只需从 Live CD 启动电脑即可。你无需执行重新分区阶段，因为安装程序会在不破坏
    Windows 分区的情况下缩小它。你必须重新划分硬盘，以便在上面安装 `Fedora`、`Debian` 或任何其他 Linux 发行版。你可以使用商业产品在
    Windows 下调整磁盘分区的尺寸。你可以启动 Linux 发行版，然后使用 `GParted`（分区编辑器）调整 Windows 分区的大小。`GParted`
    可以调整用于所有最新 Windows 版本的 `NTFS`（用于文件系统）分区的大小。


    调整磁盘分区大小时仍然存在丢失硬盘上所有数据的风险。在使用磁盘分区工具调整分区之前，请对硬盘进行备份。在对分区进行任何操作之前，确保你能够从备份中恢复文件。


    ### 在 Ubuntu 启动并显示 GUI 桌面后，按照以下步骤缩小 Windows 分区：


    1. 从 `Ubuntu` 桌面，选择 `System Administration GParted`。

    2. `GParted` 窗口打开，该工具列出在你的电脑上发现的硬盘。第一个硬盘由设备名称 `/dev/sda` 标识；第二个由设备名称 `/dev/sdb`
    标识，以此此类推。

    3. 从 `GParted` 窗口右侧的设备列表中，选择硬盘。

    4. 从分区列表中选择你想要调整大小的分区。

    5. 通常，最大的分区是这个。`Windows 10`、`Windows 8` 以及其他最新版本的分区类型为 `NTFS`，如分区列表中的 `Type` 列所示。典型的新
    PC 中可能存在两个分区：一个较小的 `fat16` 分区和一个较大的 `NTFS` 分区。

    6. 从下拉菜单中选择 `GParted Resize/Move`。

    7. 出现调整分区区的对话框。

    8. 修改分区大小，然后按 `Resize/Move`。

    9. 调整分区后，你可以选择一个留有至少 `4GB` 空闲空间的大小。对话框中的 `Free Space After` 字段显示空闲空间的大小。

    10. 当你指定了想要进行的调整后，点击 `Apply` 开始进程。

    11. 出现警界面时点击 `Apply`。

    12. 所有待处理的操作已完成，分区已更新，你现在移除 Windows 分区后就有了空闲空间。

    13. 为 Linux 释放空间后，你就可以安装你喜好的 Linux 发行版了。


    ## 安装前尝试 Live CD


    在安装任何内容之前，先尝试 Live CD 或可启动 USB 版本。通常情况下，除了对 Linux 桌面有所感受外，你还可以进行一些额外的安装前工作。


    例如，要启动 `Ubuntu`，请从 Live CD 启动电脑。会出现一个菜单，允许你从几个选项中选择以控制启动阶段或检查你的设备是否符合硬件规格。你可以选择启动
    `Ubuntu` 的默认选项（如果你在菜单 30 秒超时前未做出选择，将自动执行此操作）。


    几分钟后，`Ubuntu` 使用的 `GNOME GUI` 桌面会出现，你可以探索 `Ubuntu`。当你打开 `Examples` 文件夹时，你将看到 `Ubuntu`
    可以做的几件事。你也可以使用 `System Administration GParted` 来更改硬盘的配置。


    完成 `Ubuntu` 操作后，选择 `System Quit`，删除 DVD，并在 `Ubuntu` 关闭后点击 `Enter`。如果你计划安装 `Ubuntu`，请点击桌面上的
    `Install` 图标开始进程。


    # 安装 Linux


    可启动的 USB 发行版已经存在了一段时间，但它们一直存在让我无法使用的缺陷。然而，较新的工具，例如 `Fedora Media Writer` (https://github.com/MartinBriza/MediaWriter)
    简化了开发流程，使得大多数用户可以在没有帮助的情况下完成操作。安装过程是非破坏性的，这意味着你可以保留 USB 盘上的现有文件，且数据持久化非常容易。


    我们将向你展示如何制作一个可启动的闪存盘并在本文的后续章节中使用。


    ## 制作可启动的 USB 闪盘


    虽然命令行方法可以制作可启动的闪盘，但最简单的方法是使用 Windows（我们意识到在 Windows 上制作 Linux 启动介质可能是异异的）。要制作可启动的闪盘，请遵循以下步骤：


    1. 获取你使用的启动软件。

    2. 安装后运行该软件。

    3. 在 `Target Device` 部分中选择闪盘。

    4. 闪盘的名称可能是 `TravelDrive`。

    5. 选择镜像源（`ISO` 文件）。

    6. 如果你的网络连接较慢，可以使用单个 Live CD 下载 `ISO` 文件。如果你有更快的连接，使用 `Download` 选项访问 `ISO` 文件。

    7. 如果询问，设置持久化存储。

    8. 分配给安装的可用空间被称为持久存储。我们建议至少 `300MB`。

    9. 点击 `Create Live USB` 按钮并等待进程完成。

    10. 预计等待十分。在大多数硬盘上创建两个目录：`syslinux`（小于 7MB，负责启动）和 `LiveOS`（大小取决于你的存储设置）。

    11. 退出程序并测试新创建的驱动。


    ## 故障排除


    我们尝试了多个闪盘，只要下载后有 `1GB` 的空闲空间，对任何一个都没有出现过问题。较小的驱动（2GB 或更小）通常出厂格式化为 `FAT`，而较大的驱动格式化为
    `FAT32`。据我们所知，格式化对安装或使用没有太大影响。


    确保工作站设置允许从 USB 启动，这通常需要重新配置 BIOS。要这样做，请执行以下步骤：


    1. 重启电脑并按下进入 `BIOS` 设置的键。

    2. 该键通常是 `F12` 或 `DEL`，但也可能是 `F1` 或 `F2`。

    3. 进入 `Boot Menu` 并选择 `Boot USB Devices First`（或类似的选项）。


