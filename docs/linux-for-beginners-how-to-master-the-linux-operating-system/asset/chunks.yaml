    包含更多兼容的硬件平台是 Linux 内核的另一项重大增强。系统的架构通过将所有设备代码拆分为每个模块中的独立模块，鼓励了扩展性。通过仅重新设计内核的设备部分，少数开发者就可以将
    Linux 内核移植到类似主要的硬件框架中。


    ## 1. Linux 的文件层级结构


    Linux 的目录配置类似于树形。Linux 系统文件结构的根是一切的起点。所有内容从根开始，但目录从根开始扩展。


    在 Linux 中，使用正斜杠（`/`）来分隔目录。在讨论文件和目录路径时，“正斜杠”被称为“slash”。由于它的完整引用为 `/`，因此系统文件的起源通常被称为“slash”。当有人说“检查
    slash（check-in slash）”或“目录在 slash 中”时，指的是根目录。


    可执行文件或二进制文件存在于 `/bin` 目录中。应用程序是用源代码开发的，源代码是个人可以解释的纯文本。之后，数据被处理成机器可读的二进制文件。计算机代码是
    0 和 1 的序列，因此被称为二进制文件。最需要记住的一点是，函数、应用程序和程序通常可以在 `/bin` 中找到。


    `/etc` 目录包含配置文件。配置文件调节着操作系统和应用程序的行为。例如，`/etc` 中的某个文件可以指示操作系统进入图形模式或文本模式。


    ![image2.png](img/image00122.jpeg)


    ## 2. Linux 的进程架构


    在操作系统内部，进程执行任务。软件是磁盘上交互式镜像中的机器语言数据和指令。进程是正在运行的软件程序。


    它是一个复杂的对象，随着处理器执行机器码命令而不断演进。进程包含程序计数器（包括所有 CPU 日志）和进程帧（包括临时文件，如任务参数、返回链接、保存的量以及程序的数据和指令）。处理器中的当前操作包含在执行中的程序或方法中。Linux
    是一种支持多处理器的操作系统。进程是具有自身权利和义务的特定活动。当一个进程失败时，它不会影响系统中的其他进程。每个进程都有自己的虚拟内存，并且只能通过稳定的、内核管理的框架与其他进程进行通信。


    进程在整个存在期间可能会消耗大量的系统资源。它会在设备的 CPU 上运行命令，并将自身及其数据存储在系统的内存空间中。它可以打开并使用文件服务器内部的文件，并显式或隐式使用进程中的电子组件。Linux
    可以记录进程及其可用的设备资源，以便平等地处理系统中的其他操作。如果一个进程限制了大量的内存空间或 CPU，对系统中的其他操作将是不公平的。


    CPU 是系统中最有价值的资源，通常只有一个。Linux 是一种多任务操作系统，它在系统的任何时间点从每个 CPU 运行一个进程，以优化 CPU 的利用率。当操作多于
    CPU 时，剩余进程应该等待处理器可用后才能运行。多处理是一个直观的过程。进程一直运行直到需要等待某些东西（通常是系统资源）。一旦获得了该资源，它就可以再次运行。CPU
    在单元处理框架（如 `DOS`）中可能会保持空闲，等待期将被浪费。多处理系统中，许多进程同时存储在内存中。当进程被强制等待时，操作系统会将 CPU 从该操作切换到另一个价值更高的进程。调度器决定哪个操作最适合立即运行，Linux
    采用了多种调度技术来确保一致性。


    Linux 支持各种二进制文件格式，包括 `ELF` 和 `Java`，这些必须被平等对待。


    除了标准进程外，Linux 还支持实时进程。这些进程必须迅速响应外部因素，调度器对它们的处理方式与普通用户进程不同。尽管 `task struct` 系统架构多样化且复杂，但它的领域可以分为几个功能部门：


    ### 状态 (State)

    进程的状态随运行变化，取决于具体。以下是 Linux 进程的阶段：


    ### 运行 (Running)

    程序已运行（它是系统当前的进程）或已准备好运行（正在等待分配给设备 CPU 之一）。


    ### 等待 (Waiting)

    进程正在等待事件发生或资源可用。Linux 区分了时间限制和不可中断的等待进程。信号可以干扰可中断的工作进程，而不可中断的工作进程取决于硬件参数，且在任何情况下都无法被中断。


    ### 停止 (Stopped)

    该阶段已停止，通常是因为接收到了信号。重新实现的进程可能处于挂起。


    ### 僵尸 (Zombie)

    这是由于某些原因，在进程向量中具有 `task struct` 数据模型的停止进程。它顾如其名：一个休眠的程序。


    ### 调度数据 (Scheduling Data)

    这些数据由调度器获取，专门用于合理地确定系统中的哪个操作需要运行。


    ### 标识符 (Identifiers)

    系统中的每个进程都被分配了一个进程标识符。进程标识符只是一个数字，而不是进程向量的迭代器。每个进程通常都有用户和组标识符，用于限制对平台文件和设备的访问。


    # 第 2 章：选择你的发行版


    Linux 发行版将开源代码实现到一个单一平台，然后可以挂载并启动。Linux 发行版适用于个人电脑、非图形服务器、服务器群、手持设备以及家庭影院计算机和嵌入式系统等特殊应用。任何人可以通过构建或更改现有发行版来构建最新的
    Linux 发行版。目前维护着 300 多种 Linux 发行版。


    ## 2.1 什么是 Linux 发行版？


    Linux 发行版也称为 Linux Distro，是由不同开源开发者和软件开发者创建组件组成的计算机操作系统。Linux 内核、GNU Shell 工具、桌面环境、X
    服务器、安装程序、包管理系统和其他资源都包含在每个发行版中。许多元素是独立创建并以源码形式分发的。网络浏览器、生产力工具和其他应用程序（如 `KVM` 虚拟机）也包含大多数发行版中。


    发行版是一个完整的 Linux 系统工具包。Linux 发行版包含了 GNU 项目工具、Linux 内核以及各种增加系统能力的开源应用程序项目。


    有各种 Linux 发行版可以满足几乎所有的计算需求。大多数 Linux 发行版针对特定用户社区定制的，例如企业客户、媒体爱好者、计算机程序员或普通终端用户。


