    - There are a large number of quality applications available to run on the Linux
    platform. These are comparable to commercial applications that run on other operating
    systems but, like Linux, these too are free of charge. For instance, the free
    LibreOffice suite offers similar functionality to the commercial Microsoft Office
    suite.

    - With open-source software, an administrator can know exactly what a program
    can do and the security dangers it presents. An open-source application cannot
    secretly gather information about the user or send confidential information to
    third parties.


    ![image](images/hot.jpg)


    Pronounce the name `Linux` with a short “i” – so it’s “li-nucks”, not “lie-nucks”.


    ![image](images/forget.jpg)


    Many web servers are said to have a “LAMP” configuration – an acronym for `L`inux,
    `A`pache, `M`ySQL, `P`HP, which combines operating system, web server, database,
    and server-side scripting.


    ## The Evolution of Linux


    In 1983, a visionary programmer named Richard Stallman began a movement called
    the `GNU` Project. Its philosophy was that software should be free from restrictions
    against copying or modification in order to make better and more efficient programs.
    This inspired programmers around the world to create programs driven by efficiency
    rather than by financial incentive.


    By 1991, the `GNU` Project had created a lot of software tools including the `GNU
    C Compiler` written by Stallman himself. At that time many of these tools were
    incorporated into a Unix-compatible operating system by a 21-year old student
    at the University of Helsinki. His name was Linus Torvalds and he named the operating
    system `Linux` (`Linu`s – Uni**x**).


    `Linux` was made available for download on the internet so other programmers could
    test and tweak the source code, then return it to Linus Torvalds. After a period
    of enthusiastic development, `Linux 1.0` was made available globally under the
    `GNU General Public License`, which ensured it would remain free.


    Programmers were keen to explore `Linux` and soon found some amazing uses for
    it. In April 1996, researchers at Los Alamos National Laboratory used `Linux`
    to run 68 PCs as a single parallel processing machine to simulate atomic shock
    waves. At $150,000 this supercomputer cost just one-tenth the price of a comparable
    commercial machine. It reached a peak speed of 19 billion calculations per second,
    making it the 315th most powerful supercomputer in the world. It proved to be
    robust too – three months later it still didn’t have to be rebooted.


    `Linux` continued to grow in popularity as a text-based operating system, while
    Windows became the dominant graphical desktop operating system. Recognizing that
    most PC users want the point-and-click convenience of a graphical environment,
    the `Linux` camp began to develop a system comparable to the Windows desktop.


    From a handful of enthusiasts in 1991 to millions of users now – `Linux` has come
    of age. Today’s sleek `K Desktop Environment` (`KDE`) and the `Gnome` desktop
    environment now offer a user-friendly alternative for Windows users – `Linux`
    for the desktop!


    ![image](images/pg9_1.jpg)


    This penguin is “Tux” – the happy `Linux` mascot.


    ![image](images/pg9_2.jpg)


    The term “GNU” is a recursive acronym for `G`NU’s `N`ot `U`nix. Discover more
