    ## Getting More Apps


    ![image](images/pg86_1.jpg)


    In addition to the apps that are supplied with your Linux distro, there are many
    more free apps that can be easily installed. The Linux Mint distro includes a
    Software Manager utility app that lets you search for more apps by name or by
    category. When you select an app, there is a description and screenshot accompanied
    by user reviews that help you decide if you want to install that app:


    ![image](images/1o.jpg)Click `Menu`, `Administration`, `Software Manager` to launch
    the utility


    ![image](images/2o.jpg)Click a category button for the type of app you are seeking
    – for example, to find a picture editor app, click the `Graphics` button


    ![image](images/pg86_2.jpg)


    ![image](images/forget.jpg)


    If you know the name of the app you can use the Search box to find it.


    ![image](images/3o.jpg)Click any item listed in your chosen category to see a
    description and reviews of that app


    ![image](images/pg86_3.jpg)


    ![image](images/pg87_1.jpg)


    ![image](images/hot.jpg)


    You can click this link to open the app’s Home page in your web browser and discover
    more about the app.


    ![image](images/hot.jpg)


    ![image](images/4o.jpg)Click the `Install` button if you decide you want this
    app


    ![image](images/5o.jpg)Enter your password to download and install the app


    ![image](images/pg87_2.jpg)


    ![image](images/6o.jpg)Now, click `Menu`, `Graphics` to see a launcher has been
    added into the appropriate category


    ![image](images/pg87_3.jpg)


    ![image](images/hot.jpg)


    The description page of an installed app has a `Remove` button (in place of the
    `Install` button) that you can click to uninstall that app.


    ![image](images/pg87_4.jpg)


    ## Summary


    • The `Mozilla Firefox` web browser is included with most Linux distros.

    • The `+ New Tab` button in Firefox opens a new tab containing a Search box and
    links to “Top Sites”.

    • Firefox provides `Reader view` to hide page distractions.

    • Firefox web browser is highly customizable and allows the installation of `add-ons`
    for extra functionality.

    • Many Linux distros include the `Thunderbird` app with which to send and receive
    email messages.

    • The `formatting bar` in Thunderbird allows you to adjust the font, layout, and
    content, and to insert emojis in your message.

    • The `Thunderbird` email app is also a contact manager.

    • Linux Mint includes the `HexChat` cross-platform instant messaging app.

    • The `Official Linux Mint Support Channel` is available to chat about Linux topics.

    • The `Transmission` app can download content using the BitTorrent protocol.

    • Transmission requires a `torrent file` containing information about the content
    to be acquired.

    • Pieces of content from various `peers` are automatically assembled, making the
    BitTorrent protocol very efficient.

    • Linux Mint includes a `Software Manager` utility app that groups available apps
    by category.

    • Software Manager provides a `description` and `reviews` of each available app.

    • The Software Manager app can `Install` and `Remove` apps from the system.


    # 6 Producing with Office


    ***This chapter describes the productive apps within the free LibreOffice suite.***


    - [Creating Documents](#chapter06.xhtml_sec41)

    - [Exporting Documents](#chapter06.xhtml_sec42)

    - [Creating Spreadsheets](#chapter06.xhtml_sec43)

    - [Creating Presentations](#chapter06.xhtml_sec44)

    - [Creating Visualizations](#chapter06.xhtml_sec45)

    - [Running Macros](#chapter06.xhtml_sec46)

    - [Adding Interaction](#chapter06.xhtml_sec47)

    - [Handling Data](#chapter06.xhtml_sec48)

