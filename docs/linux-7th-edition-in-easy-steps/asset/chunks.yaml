    **Summary**


    •The **Screensaver** app can be used to disable the screensaver or to choose an
    animated screensaver.


    •The **Lock screen** can be customized to display an “Away message” for times
    when the user is absent.


    •The window title bars in Linux Mint contain familiar **Minimize**, **Maximize/Reduce**,
    and **Close** buttons.


    •Windows can be **Snapped** to the screen edges and **Tiled** to the screen corners.


    •The **Hot Corner** feature can be enabled to display workspaces.


    •Windows can be dragged from one **Workspace** to another and the apps will remain
    running on hidden workspaces.


    •The **Window Tiling** app can be used to disable Tiling and Snapping or to modify
    their behavior.


    •The **Windows** app can be used to modify title bar actions and to modify window
    actions.


    •A window can be selected with the **Window Switcher** feature by pressing the
    Alt and Tab keyboard keys.


    •The **Themes** app can be used to change the look of Window Borders, Icons, Controls,
    Mouse Pointer, and Desktop.


    •Wi-Fi connections, wired connections, and proxy connections can be controlled
    with the **Network** app.


    •The Network app can also be used to add a **VPN** connection to mask your presence
    when online.


    •Linux Mint should automatically detect and add a **Printer** when it is directly
    connected to the PC.


    •The **Printers** app can be used to add a network printer to the system to enable
    printing via a Wi-Fi connection.


    •The **Bluetooth** app can be used to pair the PC with a nearby Bluetooth device.


