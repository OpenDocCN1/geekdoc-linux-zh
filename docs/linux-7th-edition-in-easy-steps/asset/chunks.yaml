- fmt: "\nThe printer removes that job while continuing to print the image file –\
    \ the text file in job number 2 is not sent to the printer, so does not get printed.\n\
    \n![image](images/hot.jpg)\n\nA print job can only be removed from the print queue\
    \ by its owner or the root superuser.\n\nPrinting from a shell prompt is not restricted\
    \ to simply printing files – data can also be queued for printing using the `lpr`\
    \ command together with the `|` pipe character:\n\n![image](images/5g.jpg)Enter\
    \ `ls -l /etc | lpr` to print a list of the `/etc` directory – by piping results\
    \ of an `ls` command to the `lpr` command\n\n![image](images/6g.jpg)While the\
    \ list is printing, issue an `lpq` command to see the print queue source is piped\
    \ from standard input\n\n![image](images/pg181_1.jpg)\n\nThe ability to print\
    \ in Linux is provided by the `CUPS` (Common Unix Printing System) facility. This\
    \ provides a print spooler, which buffers data in a format the printer will understand,\
    \ and a scheduler, which sends the buffered data to the printer when it is ready\
    \ to be received.\n\nThe `lpstat` command has individual options to provide CUPS\
    \ status information about the scheduler, spooler, and printer/s:\n\n![image](images/7g.jpg)Issue\
    \ the command `lpstat -t` option to see printer status\n\n![image](images/pg181_2.jpg)\n\
    \n![image](images/hot.jpg)\n\nWhere more than one printer is available, use `lpr\
    \ -P` to nominate the printer to print the job.\n\n## Evaluating Expressions\n\
    \nThe `expr` command enables you to perform simple math calculations at the shell\
    \ prompt. It recognizes all the usual arithmetic operators, but those that have\
    \ other meanings in the shell need to be prefixed by a backslash \\ escape character.\
    \ For instance, the `*` wildcard must be escaped for multiplication.\n\n![image](images/pg182_1.jpg)\n\
    \nEach argument must be separated by whitespace, and parentheses can be used to\
    \ establish operator precedence in longer expressions – but each parenthesis character\
    \ must be escaped.\n\nThe `expr` command can also perform Boolean evaluations\
    \ that return either true (1) or false (0) answers, and perform simple string\
    \ manipulation with functions `length`, `substr`, and `index`.\n\n![image](images/1g.jpg)At\
    \ a shell prompt, enter `expr 7 + 3` to perform addition, and `expr 7 \\* 3` to\
    \ perform multiplication\n\n![image](images/2g.jpg)Enter `expr 7 \\* \\( 3 + 1\
    \ \\)` to evaluate a complex expression, and `expr 7 = 3` to make a Boolean equality\
    \ evaluation\n\n![image](images/3g.jpg)Issue the command `expr length “Linux in\
    \ easy steps”` to discover the length of the specified string\n\n![image](images/4g.jpg)Issue\
    \ the command `expr substr “Linux in easy steps” 7 13` to extract a substring\
    \ of the specified string\n\n![image](images/5g.jpg)Issue the command `expr index\
    \ “Linux in easy steps” “x”` to discover the position of the first “x” in the\
    \ string\n\n![image](images/pg182_2.jpg)\n\n![image](images/forget.jpg)\n\nThe\
    \ arithmetic operators are `+` add, `-` subtract, `*` multiply, `/` divide, and\
    \ `%` modulo.\n\n![image](images/hot.jpg)\n\nYou can quickly launch a graphical\
    \ calculator from a Terminal window using the `xcalc` command.\n\nThe result of\
    \ an expression evaluation can be made to cause a particular action using an if-then-else\
    \ statement. This has three separate parts that specify a test expression, the\
    \ action to perform when the test is true, and the action to perform when it is\
    \ false.\n\nThe `if` keyword begins the statement and is followed by the test\
    \ expression enclosed within a pair of `[ ]` square brackets. Each part of the\
    \ entire statement must be separated from the next by whitespace, to enable the\
    \ shell to evaluate the expression.\n\nThe `then` keyword begins the second part\
    \ of the statement, specifying the commands to execute when the test is true.\
    \ Similarly, the `else` keyword begins the third part of the statement, specifying\
    \ the commands to execute when the test is false. Finally, the `fi` keyword must\
    \ be added to mark the end of the statement.\n\n![image](images/forget.jpg)\n\n\
    You must leave a space after the `if` keyword to avoid an error. Also leave a\
    \ space after the `[` bracket and before the `]` bracket to avoid an error.\n\n\
    You may type the first part of the statement then hit **Return** to be prompted\
    \ to enter the rest of the statement, or type the entire statement separating\
    \ each part with a semicolon:\n\n![image](images/6g.jpg)Type `if [ `expr 7 % 2`\
    \ = 0 ]` to test if the remainder of dividing seven by two is zero, then hit **Return**\n\
    \n![image](images/7g.jpg)At the statement prompt, enter `then echo “Even Number”`\n\
    \n![image](images/8g.jpg)Now, enter `else echo “Odd Number”`\n\n![image](images/9g.jpg)Type\
    \ `fi` then hit **Return** to perform the appropriate action\n\n![image](images/10g.jpg)Make\
    \ a similar test in a continuous statement by typing `if [ `expr 8 % 2` = 0 ];\
    \ then echo Even; else echo Odd; fi`, then hit **Return** to perform the appropriate\
    \ action\n\n![image](images/pg183_1.jpg)\n\n![image](images/snake.jpg)\n\nThe\
    \ backtick ` `` operators enclose `expr 7 % 2` so that operation gets performed\
    \ before the test expression is evaluated – in this case, the remainder of 1 is.\n\
    \n## Scripting the Shell\n\nLengthy shell routines, like those in chapter10, can\
    \ be conveniently saved as a script that begin their first line with `#!/bin/bash`,\
    \ and are typically given `.sh` extension.\n\n![image](images/forget.jpg)Once\
    \ a script file has access permission set to “executable”, it can be executed\
    \ by `./`. A script might, perhaps, employ the `$RANDOM` variable that generates\
    \ an integer from zero to 32767 each time it is called. These are not truly random,\
    \ as the same sequence is generated given the same starting point. To ensure different\
    \ sequences, it is necessary to set it One solution is to extract a dynamic value\
    \ from the current time using `date+%s` to deliver the current number of seconds\
    \ that have elapsed since 00:00:00 GMT January 1, 1970. Using this to seed the\
    \ `$RANDOM` variable gets better number generation.\n\n![image](images/hot.jpg)\n\
    \nEnter `RANDOM=1` then `echo $RANDOM` three times to see the pattern. Repeat\
    \ both commands to see the pattern.\n\nArithmetic can be performed on shell variables,\
    \ such as `$RANDOM`, by including the `let` command in a script:\n\n![image](images/1g.jpg)Open\
    \ any text editor and begin a new file with the line `#!/bin/bash`\n\n![image](images/2g.jpg)On\
    \ a new line, type a line to seed the `$RANDOM` variable `RANDOM=`date+%s``\n\n\
    ![image](images/3g.jpg)Add a line to assign a value 1-20 to a variable `let NUM=(RANDOM\
    \ % 20 + 1)`\n\n![image](images/4g.jpg)On the next line, type an instruction to\
    \ clear the window `clear`\n\n![image](images/5g.jpg)Add these lines to output\
    \ text for the user `echo “I have chosen a number between 1 and 20” echo “Can\
    \ you guess what it is?”`\n\n![image](images/forget.jpg)Parentheses surround the\
    \ expression to evaluate, but you must not introduce whitespace around the `=`\
    \ character in the assignments.\n\n![image](images/6g.jpg)Now, add a line to read\
    \ the user’s guess into a variable `read GUESS`\n\n![image](images/7g.jpg)Type\
    \ the following lines exactly to evaluate whether the user’s guess matches the\
    \ generated number and output an appropriate response for each incorrect attempt\n\
    \n```bash\nwhile [ $GUESS -ne $NUM ]\ndo\n  if [ $GUESS -gt $NUM ]\n  then echo\
    \ “No - try lower... ”\n  else echo “No - try higher... ”\n  fi\n  read GUESS\n\
    done\n```\n\n![image](images/8g.jpg)Add a line to confirm a correct guess `echo\
    \ “Yes the number is $NUM”`\n\n![image](images/9g.jpg)Save the script as `guess.sh`\
    \ in the current directory\n"
  raw: 'The printer removes that job while continuing to print the image file – the
    text file in job number 2 is not sent to the printer, so does not get printed.


    ![image](images/hot.jpg)


    A print job can only be removed from the print queue by its owner or the root
    superuser.


    Printing from a shell prompt is not restricted to simply printing files – data
    can also be queued for printing using the lpr command together with the | pipe
    character:


    ![image](images/5g.jpg)Enter ls -l /etc | lpr to print a list of the /etc directory
    – by piping results of an ls command to the lpr command


    ![image](images/6g.jpg)While the list is printing, issue an lpq command to see
    the print queue source is piped from standard input


    ![image](images/pg181_1.jpg)


    The ability to print in Linux is provided by the CUPS (**C**ommon **U**nix **P**rinting
    **S**ystem) facility. This provides a print spooler, which buffers data in a format
    the printer will understand, and a scheduler, which sends the buffered data to
    the printer when it is ready to be received.


    The lpstat command has individual options to provide CUPS status information about
    the scheduler, spooler, and printer/s:


    ![image](images/7g.jpg)Issue the command lpstat -t option to see printer status


    ![image](images/pg181_2.jpg)


    ![image](images/hot.jpg)


    Where more than one printer is available, use **lpr -P** to nominate the printer
    to print the job.


    **Evaluating Expressions**


    The expr command enables you to perform simple math calculations at the shell
    prompt. It recognizes all the usual arithmetic operators, but those that have
    other meanings in the shell need to be prefixed by a backslash \ escape character.
    For instance, the * wildcard must be escaped for multiplication.


    ![image](images/pg182_1.jpg)


    Each argument must be separated by whitespace, and parentheses can be used to
    establish operator precedence in longer expressions – but each parenthesis character
    must be escaped.


    The expr command can also perform Boolean evaluations that return either true
    (1) or false (0) answers, and perform simple string manipulation with functions
    length, substr, and index.


    ![image](images/1g.jpg)At a shell prompt, enter expr 7 + 3 to perform addition,
    and expr 7 \* 3 to perform multiplication


    ![image](images/2g.jpg)Enter expr 7 \* \( 3 + 1 \) to evaluate a complex expression,
    and expr 7 = 3 to make a Boolean equality evaluation


    ![image](images/3g.jpg)Issue the command expr length “Linux in easy steps” to
    discover the length of the specified string


    ![image](images/4g.jpg)Issue the command expr substr “Linux in easy steps” 7 13
    to extract a substring of the specified string


    ![image](images/5g.jpg)Issue the command expr index “Linux in easy steps” “x”
    to discover the position of the first “x” in the string


    ![image](images/pg182_2.jpg)


    ![image](images/forget.jpg)


    The arithmetic operators are **+** add, **-** subtract, ***** multiply, **/**
    divide, and **%** modulo.


    ![image](images/hot.jpg)


    You can quickly launch a graphical calculator from a Terminal window using the
    **xcalc** command.


    The result of an expression evaluation can be made to cause a particular action
    using an if-then-else statement. This has three separate parts that specify a
    test expression, the action to perform when the test is true, and the action to
    perform when it is false.


    The if keyword begins the statement and is followed by the test expression enclosed
    within a pair of [ ] square brackets. Each part of the entire statement must be
    separated from the next by whitespace, to enable the shell to evaluate the expression.


    The then keyword begins the second part of the statement, specifying the commands
    to execute when the test is true. Similarly, the else keyword begins the third
    part of the statement, specifying the commands to execute when the test is false.
    Finally, the fi keyword must be added to mark the end of the statement.


    ![image](images/forget.jpg)


    You must leave a space after the **if** keyword to avoid an error. Also leave
    a space after the **[** bracket and before the **]** bracket to avoid an error.


    You may type the first part of the statement then hit **Return** to be prompted
    to enter the rest of the statement, or type the entire statement separating each
    part with a semicolon:


    ![image](images/6g.jpg)Type if [ `expr 7 % 2` = 0 ] to test if the remainder of
    dividing seven by two is zero, then hit **Return**


    ![image](images/7g.jpg)At the statement prompt, enter then echo “Even Number”


    ![image](images/8g.jpg)Now, enter else echo “Odd Number”


    ![image](images/9g.jpg)Type fi then hit **Return** to perform the appropriate
    action


    ![image](images/10g.jpg)Make a similar test in a continuous statement by typing
    if [ `expr 8 % 2` = 0 ]; then echo Even; else echo Odd; fi, then hit **Return**
    to perform the appropriate action


    ![image](images/pg183_1.jpg)


    ![image](images/snake.jpg)


    The backtick **`** operators enclose **expr 7 % 2** so that operation gets performed
    before the test expression is evaluated – in this case, the remainder of 1 is
    substituted, making the expression **if [ 1 = 0 ]**.


    **Scripting the Shell**


    Lengthy shell routines, like those [here](#chapter10.xhtml_must), can be conveniently
    saved as a shell script for execution when required. Shell scripts are simply
    plain text files that begin their first line with #!/bin/bash, specifying the
    location of the bash program, and are typically given a .sh file extension.


    ![image](images/pg184_1.jpg)


    Once a shell script file has its access permission set to “executable”, it can
    be executed by specifying its path at a shell prompt – its name prefixed by ./
    dot-slash characters if it is in the current directory.


    A script might, perhaps, employ the $RANDOM shell variable that generates an integer
    from zero to 32,767 each time it is called. These are not truly random, however,
    as the same sequence is generated given the same starting point (seed) – in order
    to ensure different sequences, it is necessary to set it with different seeds.


    One solution is to extract a dynamic value from the current time using the date
    +%s command to deliver the current number of seconds that have elapsed since 00:00:00
    GMT January 1, 1970. Using this to seed the $RANDOM variable gets better random
    number generation.


    ![image](images/hot.jpg)


    Enter **RANDOM=1** then **echo $RANDOM** three times to see the pattern. Repeat
    both commands to see the pattern repeat.


    Arithmetic can be performed on shell variables, such as $RANDOM, by including
    the let command in a script:


    ![image](images/1g.jpg)Open any plain text editor and begin a new file with the
    line #!/bin/bash


    ![image](images/2g.jpg)On a new line, type a line to seed the $RANDOM variable
    RANDOM=`date +%s`


    ![image](images/3g.jpg)Add a line to assign a value 1-20 to a variable let NUM=(
    $RANDOM % 20 + 1 )


    ![image](images/4g.jpg)On the next line, type an instruction to clear the window
    clear


    ![image](images/5g.jpg)Add these lines to output text for the user echo “I have
    chosen a number between 1 and 20” echo “Can you guess what it is?”


    ![image](images/forget.jpg)


    Parentheses surround the expression to evaluate, but you must not introduce whitespace
    around the **=** character in the assignments.


    ![image](images/6g.jpg)Now, add a line to read the user’s guess into a variable
    read GUESS


    ![image](images/7g.jpg)Type the following lines exactly to evaluate whether the
    user’s guess matches the generated number and output an appropriate response for
    each incorrect attempt


    **while [ $GUESS -ne $NUM ]**


    **do**


    **if [ $GUESS -gt $NUM ]**


    **then echo “No - try lower... ”**


    **else echo “No - try higher... ”**


    **fi**


    **read GUESS**


    **done**


    ![image](images/8g.jpg)Add a line to confirm a correct guess echo “Yes the number
    is $NUM”


    ![image](images/9g.jpg)Save the script as guess.sh in the current directory'
