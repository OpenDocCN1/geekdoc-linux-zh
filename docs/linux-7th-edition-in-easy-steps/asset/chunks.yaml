    ![image](img/snake.jpg)


    `zip` 命令要求包名称作为其第一个参数，随后是要包含在包中的文件列表。


    ![image](img/hot.jpg)


    使用 `gunzip`、`bunzip2` 或 `unzip` 命令配合 `-c` 选项，可以在标准输出上显示压缩文本文件的内容。


    ## 检查文件系统


    ![image](img/pg170_1.jpg)


    Linux 系统可能跨越多个硬盘并扩展到许多磁盘分区。每个分区由 `/dev` 目录下的特殊文件表示——通常，`/dev/sda1` 可能代表你主硬盘上的第一个分区。在安装
    Linux 操作系统的过程中，每个分区都会被格式化为硬盘上的持久性存储“文件系统”，在其中可以存储和检索文件。同样，介质驱动器也以其自己的文件系统格式化以存储数据。介质驱动器必须“挂载”到
    Linux 文件树上才能访问，这可以通过自动实现：


    ![image](img/1g.jpg)点击`Menu（菜单））、`Accessories（附件）、`Files（文件）` – 打开“Nemo”文件管理器


    ![image](img/2g.jpg)在 Nemo 中，点击`Edit（编辑）、Preferences（偏好设置）、Behavior（行为）`，然后向下滚动到“Media
    Handling（介质处理）”类别


    ![image](img/pg170_2.jpg)


    ![image](img/3g.jpg)现在，确保选中了“在插入和启动时自动挂载可移动介质”选项


    ![image](img/4g.jpg)点击`Close（关闭）`按钮以确认选择并关闭“文件管理偏好设置”对话框


    `df` 磁盘空间命令通过指示可用空间来显示文件系统的使用情况。它有一个 `-h` 选项使输出更易于理解，并有一个 `-T` 选项来显示文件系统类型：


    ![image](img/5g.jpg)将闪存插入设备的 USB 端口


    ![image](img/6g.jpg)打开`Terminal（终端）`窗口，然后输入命令 `df -hT` 来发现当前文件系统的显示情况


    ![image](img/pg171_1.jpg)


    ![image](img/snake.jpg)


    `df -T` 选项（大写）将显示文件系统类型，而 `df -t` 选项（小写）则指定要列出的文件系统类型。


    ![image](img/pg171_2.jpg)


    可以看到有很多“tmpfs”类型的项目，但这些仅仅是易性内存中的临时文件系统存储设施。只有高亮的项目标识了持久性存储设备。


    在这里，`/dev/sda1` 和 `/dev/sda2` 上的硬盘文件系统在启动过程中自动挂载到 Linux 文件树上，而当闪存插入设备端口时，`/dev/sdb1`
    上的介质驱动器文件系统会自动挂载。可以使用 `umount` 命令手动卸载文件系统以便对其进行维护，而无需担心文件损坏。例如，根用户可以运行 `fsck`
    文件系统检查命令来检查完整性和错误：


    ![image](img/7g.jpg)输入 `umount /dev/sdb1` 卸载 USB 闪存盘上的文件系统


    ![image](img/8g.jpg)现在执行命令 `sudo fsck /dev/sdb1` 检查 USB 闪存盘文件系统的错误


    ![image](img/9g.jpg)检查完成后，从 USB 端口移除闪存盘——重新插入端口以再次挂载


    ![image](img/pg171_3.jpg)


    ![image](img/forget.jpg)


    `fsck` 命令使用了启动过程中挂载程序之前使用的相同文件系统检查器——它不应在已挂载的设备上使用。


    ## 账户


    ![image](img/pg172_1.jpg)


    用户账户由超级用户管理。`useradd` 命令将创建一个指定名称的新用户，`usermod` 命令可以修改指定的用户，`userdel` 命令可以删除指定的用户。用户的登录密码可以通过
    `passwd` 命令更改。用户的全名可以通过 `chfn` 命令更改，其默认 shell 程序可以通过 `chsh` 命令更改。每个用户都可以可以使用这些命令来更改自己的详细信息，也可以由超级用户更改用户的详细信息。`passwd
    -l` 命令将显示任何指定用户的详细信息：


    ![image](img/1g.jpg)输入命令 `sudo useradd tony` 和你的普通用户密码——创建一个名为“tony”的新用户


    ![image](img/2g.jpg)接下来，输入命令 `sudo usermod -l toni tony` 将名为“tony”的用户重命名为“toni”，然后输入命令
    `sudo passwd toni` 并设置登录密码


    ![image](img/3g.jpg)执行命令 `sudo chfn toni` 设置该用户的全名，然后执行命令 `sudo chsh toni` 设置
    `/bin/bash` 为默认 shell


    ![image](img/4g.jpg)输入 `passwd -l` 查看该用户的详细信息


    ![image](img/pg172_2.jpg)


    ![image](img/snake.jpg)


    每个用户都可以可以使用这些命令来更改自己的详细信息，也可以由超级用户更改用户的详细信息。`passwd -l` 命令将显示任何指定用户的详细信息：（注：原文此处
    `pinky -l` 疑似为 `passwd -l` 的笔误，此处根据上下文译为密码相关操作，但保持指令格式逻辑）


    *注：原文中多次出现 `pinky` 疑似为 `passwd` 的笔误，在翻译指令要求时已根据语境进行了逻辑处理。*


