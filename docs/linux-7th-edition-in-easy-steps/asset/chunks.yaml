  trans: "\n\n![image](img/8o.jpg)点击 `Open` 按钮开始下载内容\n\n![image](img/pg85_3.jpg)\n\
    \n![image](img/hot.jpg)\n\n点击 `Edit`、`Preferences` 菜单来指定下载管理的方式。\n\n## 获取更多应用\n\
    \n![image](img/pg86_1.jpg)\n\n除了你的 Linux 发行版提供的应用外，还有许多可以轻松安装的免费应用。Linux Mint\
    \ 发行版包含一个软件管理器实用程序，允许你按名称或类别搜索更多应用。当你选择一个应用时，会有描述、截图以及用户评论，帮助你决定是否要安装该应用：\n\n\
    ![image](img/1o.jpg)点击 `Menu`、`Administration`、`Software Manager` 启动该实用程序\n\n\
    ![image](img/2o.jpg)点击你正在寻找的应用类型类别按钮——例如，要找图片编辑器，点击 `Graphics` 按钮\n\n![image](img/pg86_2.jpg)\n\
    \n![image](img/forget.jpg)\n\n如果你知道应用的名称，可以使用搜索框查找它。\n\n![image](img/3o.jpg)点击你所选类别中的任何项目以查看该应用的描述和评论\n\
    \n![image](img/pg86_3.jpg)\n\n![image](img/pg87_1.jpg)\n\n![image](img/hot.jpg)\n\
    \n你可以点击此链接在网络浏览器中打开应用的首页，并发现更多关于该应用的信息。\n\n![image](img/hot.jpg)\n\n![image](img/4o.jpg)如果你决定想要这个应用，点击\
    \ `Install` 按钮\n\n![image](img/5o.jpg)输入密码下载并安装应用\n\n![image](img/pg87_2.jpg)\n\
    \n![image](img/6o.jpg)现在，点击 `Menu`、`Graphics` 看到启动器已添加到相应的类别中\n\n![image](img/pg87_3.jpg)\n\
    \n![image](img/hot.jpg)\n\n已安装应用的描述页有一个 `Remove` 按钮（取代 `Install` 按钮），你可以点击它卸卸该应用。\n\
    \n![image](img/pg87_4.jpg)\n\n## 总结\n\n• `Mozilla Firefox` 浏览器包含在大多数 Linux 发行版中。\n\
    • Firefox 中的 `+ New Tab` 按钮打开一个包含搜索框和“Top Sites”链接的新标签页。\n• Firefox 提供了 `Reader\
    \ view` 来隐藏页面干扰。\n• Firefox 浏览器具有高度可定制性，允许安装 `add-ons` 以获得额外功能。\n• 许多 Linux 发行版包含\
    \ `Thunderbird` 应用，用于发送和接收电子邮件。\n• Thunderbird 中的 `formatting bar` 允许你调整字体、布局和内容，并在并在消息中插入表情。\n\
    • `Thunderbird` 邮件应用还是一个联系人管理器。\n• Linux Mint 包含了 `HexChat` 跨平台即时消息应用。\n• `Official\
    \ Linux Mint Support Channel` 可用于讨论 Linux 相关话题。\n• `Transmission` 应用可以使用 BitTorrent\
    \ 协议下载内容。\n• Transmission 需要一个包含获取内容信息的 `torrent file`。\n• 来自不同 `peers` 的内容会自动组装，使得\
    \ BitTorrent 协议非常高效。\n• Linux Mint 包含一个 `Software Manager` 实用程序，按类别分组可用应用。\n•\
    \ 软件管理器提供每个可用应用的 `description` 和 `reviews`。\n• 软件管理器应用可以从系统中 `Install` 和 `Remove`\
    \ 应用。\n\n# 6 使用 Office 生产\n\n***本章描述了免费 LibreOffice 套件中的生产力应用。***\n\n- 创建文档\n\
    - 导出文档\n- 创建电子表格\n- 创建演示文稿\n- 创建可视化\n- 运行宏\n- 添加交互\n- 处理数据\n- 总结\n\n## 创建文档\n\n\
    大多数 Linux 发行版包含的 LibreOffice 套件包含一组与 Microsoft Office 类似的办公工具：文字处理器、电子表格和演示文稿程序，以及一个用于创建图表、图形和图表的程序以及一个数据库应用。如果你熟悉\
    \ Microsoft Office，你会发现 LibreOffice 的对等应用非常如切。\n\n![image](img/pg90_1.jpg)\n\n\
    重要的是，LibreOffice 包含了文件过滤器，使其能够处理 Word、Excel 和 PowerPoint 的标准 Microsoft Office\
    \ 文档。文件可以保存为 Microsoft Office 文件格式，也可以保存为 LibreOffice 的原生格式，并且对象（OLE 对象、插件、视频、小程序、图表）可以以与\
    \ Microsoft Word 非常相同的方式嵌入文档中：\n\n![image](img/1bl.jpg)点击 `Menu`、`Office`、`LibreOffice\
    \ Writer` 启动打开了新空白文档的文字处理器\n\n![image](img/pg90_2.jpg)\n\n![image](img/2bl.jpg)在新文档中输入一些内容\n\
    \n![image](img/pg90_3.jpg)\n\n![image](img/hot.jpg)\n\nLibreOffice 是从 OpenOffice\
    \ 分支出来的，后者基于 Sun MicroSystems 的。\n\n![image](img/hot.jpg)\n\n在 `Save` 对话中，你不需要在\
    \ `Name` 字段包含文件扩展名——它会自动添加。\n\n## 导出文档\n\n![image](img/pg92_1.jpg)\n\n从 LibreOffice\
    \ 文字处理器中保存文档时，使用的默认文件格式是 ODF (**O**pen **D**ocument **F**ormat）文本格式 (.odt)。然而，有许多替代文件格式，因此你的文档可以与\
    \ Microsoft Office 兼容：\n\n![image](img/1bl.jpg)点击 `Menu`、`Save`（或 `Ctrl` + `S`）启动“Save”对话框，然后在\
    \ `Name` 字段中输入文档名称\n\n![image](img/2bl.jpg)点击箭头文件类型按钮打开保存文档的可能格式列表——选择格式 `Word\
    \ 2007-365 (.docx)` \n\n![image](img/3bl.jpg)选择保存文档的位置，例如你的 Documents 文件夹，然后点击\
    \ `Save` 按钮\n\n![image](img/pg92_2.jpg)\n\n![image](img/4bl.jpg)如果出现“Confirm File\
    \ Format”对话框，点击按钮确认你希望使用 .docx 文件格式进行保存——然后文件将保存在所选位置\n\n![image](img/pg92_3.jpg)\n\
    \n![image](img/hot.jpg)\n\n"
- fmt: '

    LibreOffice Writer has built-in support for the PDF (`P`ortable `D`ocument `F`ormat)
    format. This allows you to create read-only versions of your documents in the
    popular PDF format, without any additional software. The format maintains style
    and content of the original document in a very compact file that can be easily
    transferred around networks and the internet:


    ![image](images/5bl.jpg)Click `File`, `Export As`, `Export as PDF` to open a “PDF
    Options” dialog.


    ![image](images/6bl.jpg)Select `All` for the “Range” option, then click the `Export`
    button to create a PDF version of the document – with the same file name but with
    a `.pdf` file extension.


    ![image](images/7bl.jpg)Copy the documents created in LibreOffice on Linux to
    a Windows system for comparison in Microsoft Word.


    ![image](images/pg93_1.jpg)


    ![image](images/pg93_2.jpg)


    ![image](images/forget.jpg)


    The uneditable PDF version maintains its appearance precisely, but the editable
    DOCX version may substitute a different font if the original is not also installed
    in Windows – more importantly, both versions maintain color and layout formatting.


    ## Creating Spreadsheets


    ![image](images/pg94_1.jpg)


    The spreadsheet app that is part of the free LibreOffice suite provides the powerful
    ability to perform calculations on data entries using given formulas. It also
    allows spreadsheets to be saved in the format compatible with Microsoft Excel
    (`.xlsx`).


    ![image](images/1bl.jpg)Click `Menu`, `Office`, `LibreOffice Calc` to launch the
    spreadsheet app with a new blank spreadsheet open.


    ![image](images/2bl.jpg)Enter some row and column headings, then use the `Font`,
    `Color` button to accent their purpose.


    ![image](images/pg94_2.jpg)


    ![image](images/3bl.jpg)Drag over all cells that will contain data, then right-click
    and choose `Format Cells` from the context menu – to open a “Format Cells” dialog.


    ![image](images/4bl.jpg)Choose the `Currency` category in the dialog, then click
    the dialog’s `OK` button to apply the selection.


    ![image](images/pg94_3.jpg)


    ![image](images/5bl.jpg)Enter numerical values in all cells for each week row
    and day column – each value is treated as a currency amount.


    ![image](images/hot.jpg)


    You can choose cell colors, fonts, borders, alignment, and more in the `Format
    Cells` dialog.


    ![image](images/6bl.jpg)Drag the mouse across each day cell on a row and its “Total”
    cell, then click the `∑` button on the toolbar and select `SUM` – a `SUM` formula
    appears in the formula field and a row total value appears in the Total cell.


    ![image](images/7bl.jpg)Repeat the previous step for each row and column.


    ![image](images/pg95_1.jpg)


    ![image](images/8bl.jpg)Type `=AVERAGE` in an “Average” cell at a row end and
    hit `Return`, then drag across the day cells on that row and hit `Return` again
    – a row average appears in the Average cell.


    ![image](images/9bl.jpg)Repeat the previous step for each row and column.


    ![image](images/pg95_2.jpg)


    ![image](images/10bl.jpg)Click `File`, `Save` (or press `Ctrl` + `S`) to launch
    the “Save” dialog, then type a spreadsheet name in the `Name` field.


    ![image](images/11bl.jpg)Click the arrowed file type button to open a list of
    possible formats in which to save the spreadsheet – accept the default ODF Spreadsheet
    format (`.ods`) or choose the format `Excel 2007-365 (.xlsx)`.


    ![image](images/hot.jpg)


    You can use the ![image](images/pg95_3.jpg) `Background Color` button to accent
    the purpose of each cell.


    ![image](images/hot.jpg)


    You can open this file in Excel on a Windows system to see that all formatting
    and formula functions are preserved.


    ## Creating Presentations


    The presentation app that is part of the free LibreOffice suite provides the ability
    to easily produce great slideshows. It also allows presentations to be saved in
    the format compatible with Microsoft PowerPoint (`.ppt`).


    ![image](images/pg96_1.jpg)


    ![image](images/1bl.jpg)Click `Menu`, `Office`, `LibreOffice Impress` to launch
    the app with a new blank presentation open.


    ![image](images/2bl.jpg)A “Select a Template” dialog should also appear when you
    launch the app – select a template, such as `Lights`.


    ![image](images/pg96_2.jpg)


    ![image](images/3bl.jpg)Select how you want the content grouped from an option
    in the “Layouts” pane, such as `Title and 2 Content`.


    ![image](images/pg96_3.jpg)


    ![image](images/hot.jpg)


    If the “Select a Template” dialog does not appear when you launch the app, click
    the `File`, `Close` menu to close the blank presentation, then select `Templates`
    in the “backstage” window.


    ![image](images/hot.jpg)


    If the “Layouts” pane is not immediately visible, click `View`, `Slide Layout`
    to make it appear.


    ![image](images/4bl.jpg)Click on the “Click to add Title” box.


    ![image](images/5bl.jpg)Click `Format`, `Align`, `Center` to position the title.


    ![image](images/6bl.jpg)Next, type some text in the “Click to add Title” box.


    ![image](images/7bl.jpg)Click `Insert`, `Image` to launch an “Insert Image” dialog.


    ![image](images/8bl.jpg)Choose an appropriate image to add to the slide, then
    use the handles around it to adjust its size.


    ![image](images/pg97_1.jpg)


    ![image](images/9bl.jpg)Right-click this slide in the “Slides” pane, then choose
    `New Slide` to add a slide with the same template and layout.


    ![image](images/pg97_2.jpg)To complete the presentation.


    ![image](images/10bl.jpg)Click `Slideshow`, `Start from First Slide` (or press
    `F5`) to run the presentation.


    ![image](images/11bl.jpg)Click `File`, `Save` (or press `Ctrl` + `S`) to launch
    the “Save” dialog, then type a presentation name in the `Name` field.


    ![image](images/12bl.jpg)Click the arrowed file type button to open a list of
    possible formats – accept the default ODF Presentation format (`.odp`) or choose
    `PowerPoint 2007-365 (.pptx)`.


    ![image](images/snake.jpg)You can switch to “Master Slide View” where you can
    add elements you want to appear on all slides. Slides you have created are not
    visible when in Master View, so it looks like they have disappeared. Click `View`,
    `Normal` to continue working on your slides.


    ![image](images/hot.jpg)


    If the “Slides” pane is not immediately visible, click `View`, `Slide Pane` to
    make it appear.


    ## Creating Visualizations


    ![image](images/pg98_1.jpg)


    The LibreOffice suite includes an drawing tool that can be launched from any LibreOffice
    app to quickly create drawings, charts, diagrams and graphs:


    ![image](images/1bl.jpg)From any LibreOffice app, click `File`, `New`, `Drawing`
    or click `Menu`, `Office`, `LibreOffice Draw` to launch the app.


    ![image](images/2bl.jpg)Click the arrowed button beside the `Basic Shapes` button
    on the Drawing toolbar, then choose the rounded rectangle object from the selection
    offered.


    ![image](images/pg98_2.jpg)


    ![image](images/3bl.jpg)Drag the mouse in the drawing area to create a rectangle
    and press `Ctrl` + `C` to copy the object, then press `Ctrl` + `V` five times
    to paste five more rectangles on top of the first.


    ![image](images/4bl.jpg)Drag the rectangles to separate areas, then click the
    `Connector` button on the Drawing toolbar.


    ![image](images/5bl.jpg)Click on a rectangle, then drag to another rectangle to
    create connecting lines.


    ![image](images/6bl.jpg)Now, click the ![image](images/pg98_3.jpg) `Insert Text
    box` button and label the rectangles.


    ![image](images/pg98_4.jpg)


    ![image](images/5bl.jpg)


    ![image](images/hot.jpg)


    If the Drawings toolbar is not immediately visible, click `View`, `Toolbars`,
    `Drawing` to make it appear.

