    -   Linux 平台上有很多高质量的应用程序可以使用。这些程序与在操作系统上运行的商业应用程序相当，但与 Linux 一样，它们也是免费的。例如，免费的
    LibreOffice 软件套提供了与商业 Microsoft Office 软件包类似的功能。

    -   通过开源软件，管理员可以确切知道一个程序可以做什么以及它带来的安全风险。开源应用程序不会秘密收集用户信息，也不会向第三方发送机密信息。


    ![image](img/hot.jpg)


    读 `Linux` 这个名字时使用短元音“i”——读作“li-nucks”，而不是“lie-nucks”。


    ![image](img/forget.jpg)


    许多 Web 服务器被认为拥有“LAMP”配置——这是 `L`inux、`A`pache、`M`ySQL、`P`HP 的缩写，它结合了操作系统、Web 服务器、数据库和服务端脚本语言。


    ## Linux 的演变


    1983 年，一位富有远见的程序员 Richard Stallman 启动了一项名为 `GNU` 项目的。它的哲学是软件不应该受到复制或修改的限制，以便创建出更好、更高效的程序。这激励了世界各程序员创建由效率而非财务激励驱动的程序。


    到 1991 年，`GNU` 项目已经创建了许多软件工具，包括 Stallman 本人编写的 `GNU C Compiler`。当时，这些工具中的许多被赫尔辛基大学的一个
    21 岁学生整合到了一个兼容 Unix 的系统中。他的名字是 Linus Torvalds，他将该操作系统命名为 `Linux` (`Linu`s – Uni**x**)。


    `Linux` 在互联网上开放下载，以便其他程序员可以测试和调整源代码，然后将其返回给 Linus Torvalds。在经过热烈的开发后，`Linux 1.0`
    在 `GNU 通用许可证`下在全球发布，这确保了它保持免费。


    程序员们热于探索 `Linux`，并很快发现了一些惊人的用途。1996 年 4 月，洛斯阿拉莫斯国家实验室的研究人员使用 `Linux` 将 68 台 PC
    作为一个单一并行处理机来模拟原子冲击波。这台超级计算机的价格为 15 万美元，仅为同商业机器的十分分之一。它的峰值速度达到了每秒 190 亿次，成为世界第
    315 大强大的超级计算机。它也被证明是稳健的——三个月后它仍然不需要重启。


    `Linux` 作为一种文本操作系统继续增长，而 Windows 变成了占据主导地位的图形桌面操作系统。考虑到大多数 PC 用户都想要图形环境的点击式便利性，`Linux`
    阵营开始开发一种与 Windows 桌面相当的系统。


    从 1991 年的少数爱好者到现在的数百万用户——`Linux` 已经成熟。今天精美的 `K 桌面环境` (`KDE`) 和 `Gnome` 桌面环境现在为
    Windows 用户提供了一个用户好的替代方案——用于桌面的 `Linux`！


    ![image](img/pg9_1.jpg)


    这只企鹅是“Tux”——快乐的 `Linux` 吉物。


    ![image](img/pg9_2.jpg)


    “GNU”一词是 `G`NU’s `N`ot `U`nix 的递归缩写。可以在 [gnu.org/licenses/gpl.html](http://www.gnu.org/licenses/gpl.html)
    在线了解更多关于 `GNU 通用许可证` 的信息。


    ![image](img/pg9_3.jpg)


    可以在 [gnome.org](http://www.gnome.org) 在线了解更多关于 `Gnome` 图形桌面的信息。


    ## 选择发行版


    `Linux` 的核心是一系列经过测试的编译代码，被称为 `kernel`（内核）。`kernel` 为操作系统提供核心功能，就像汽车的引擎一样。它负责基础工作，例如帮助其他程序访问硬件以及在各种程序之间共享你的计算机处理器。


    ![image](img/pg10_1.jpg)


    除了 `kernel` 之外，`Linux` 还包含许多系统级程序，例如处理你的电子邮件、网络连接和引导加载程序的服务。将这些考虑为汽车的变速箱、齿轮和底盘——没有这些，引擎就没太大用。


    `Linux` 发行版通常还包含大量的用户级程序——即日常使用的应用程序：例如 Web 浏览器、文字处理器、文本编辑器、图形编辑器、媒体播放器等。这些是汽车的最后装饰，确保了良好的乘坐体验——白壁轮胎和软皮内饰。


    所有这些组件都捆绑在各种 `Linux` 发行版包中，通常被称为“distros”（发行版）——就像汽车的所有组件捆绑在一起制成一台完整的汽车一样。


    ![image](img/hot.jpg)


    大多数 `Linux` 发行版都以“现场”版本提供，让你能够从磁盘运行 `Linux`——这样你可以在不将 `Linux` 安装到硬盘的情况下尝试它。


    就像汽车有许多品牌和型号一样，也有许多 `Linux` 发行版供选择。最知名的发行版包括 `RedHat Fedora`、`SUSE`、`Ubuntu` 和
    `Mint`。每个发行版都有自己的安装程序和独特的默认配置，取决于发行者认为的最佳安排。对你来说最理想的选择将取决于你个人的偏好以及你如何使用 `Linux`。下面描述了最流行的发行版以帮助你选择：


    ### RedHat Fedora


    最广为人知的 Linux 发行版之一，由商业性的 `RedHat Enterprise Linux` 产品线和由 `Fedora Project` 社区开发的免费
    `Fedora` 发行版组成。`Fedora` 发行版有几个版本——用于 PC 的“Workstation”、用于服务器的“Server”以及用于云生态系统的“IoT”。


    **优点**：广泛使用，出色的社区支持，具有创新性。


    **缺点**：Fedora 版本的生命周期有限，多媒体支持差。


    从 [getfedora.org](http://getfedora.org) 免费下载


    ![image](img/pg10_2.jpg)


    “选择自由。选择 Fedora。”


    ### openSUSE


    基于社区的“openSUSE”发行版因其安装程序和 `YaST` 配置工具而获得好评。随盒附的文档被标记为迄为止最完整的。固定发布的“Leap”发行版是 `openSUSE`
    获奖的 `SUSE Linux Enterprise` (`SLE`) 产品的的基础，而滚动发布的“Tumbleweed”发行版提供了所有软件的最新稳定版本。


    **优点**：注重细节，易用的 `YaST` 配置工具。


    **缺点**：发行版巨大——包含超过 1500 个捆绑包。


    从 [opensuse.org](http://opensuse.org) 免费下载


    ![image](img/pg11_1.jpg)


    “系统管理员、开发者和桌面用户的首选。”


    ### Ubuntu


    这个复杂的社区发行版通常采用流行的 `Gnome` GUI 桌面管理器。它具有固定的六个月发布周期的优势，每两年有一个支持五年的 `LTS` (`L**ong
    **T**erm **S**upport`)发布版。`Ubuntu` 发行版有几个版本——用于 PC 的“Desktop”、用于服务器的“Server”、用于物联网设备的“IoT
    ”以及用于云计算的“Cloud”。`Ubuntu` 桌面版的默认界面与 Windows 桌面非常不同。


    **优点**：优秀的社区，以及固定的发布周期。


    **缺点**：界面对 Windows 用户来说会很陌生。


    从 [ubuntu.com](http://ubuntu.com) 免费下载


    ![image](img/pg11_2.jpg)


    “快速、安全简单，Ubuntu 助力全球数百万台 PC。”


    ### Linux Mint


    '
- fmt: '

    A modern, elegant operating system that is easy to use. It is based on the `Ubuntu`
    operating system and works straight out of the box, with full multimedia support.
    All Linux Mint distros are LTS releases that appear shortly after each `Ubuntu`
    LTS release, and are supported for five years. Users are encouraged to send feedback
    so their ideas can be used to improve Linux Mint. This operating system typically
    employs the `Cinnamon` GUI desktop manager, which will feel familiar to those
    moving from the Windows operating system. For that reason, Mint is used throughout
    this book to demonstrate the features of a Linux operating system.


    **Pros**: Great community, and the interface will seem familiar to Windows users
    – the best distro for beginners.


    **Cons**: `Ubuntu` has a larger community of users than Mint.


    Free download from **[linuxmint.com](http://linuxmint.com)**


    ![image](images/pg11_3.jpg)


    “Linux Mint. From freedom came elegance”.


    ## Providing Disk Space


    ![image](images/pg12_1.jpg)


    An operating system is installed on an area of the hard disk drive called a “partition”.
    When `Windows` is the only installed operating system, its partition will normally
    occupy the entire hard drive. To install Linux in this situation there are three
    possible options:


    • **Delete the Windows partition** – replacing it with Linux partitions that occupy
    the entire drive. This option will delete the `Windows` operating system along
    with all the applications and data files. It creates a dedicated Linux computer
    that will immediately start Linux when the PC gets switched on.


    • **Reduce the Windows partition size** – so that it no longer occupies the entire
    drive, then create Linux partitions in the resulting free space. This option will
    retain the `Windows` operating system, applications and data files. It creates
    a “dual-boot” computer that allows the user to choose whether to start Linux or
    `Windows` whenever the PC gets switched on.


    • **Add a second hard drive to the system** – this allows Linux partitions to
    occupy the entire second drive and retains the `Windows` operating system, applications
    and data files on the first drive. It too creates a dual-boot computer that allows
    the user to choose whether to start Linux or `Windows` whenever the PC gets switched
    on.


    ![image](images/hot.jpg)


    A `H` `D` `D`rive (`HDD` or simply “hard drive”) can be partitioned into one or
    more regions so that the operating system can manage each region separately.


    The option to install an additional hard drive for Linux is a popular choice for
    many people as they have often upgraded their original hard drive to a larger
    one, and so have their original drive spare. It also has several benefits over
    the other options:


    • The free space on the `Windows` drive is not reduced.

    • It removes the risk of data loss through partition resizing.

    • The familiar `Windows` operating system is retained.

    • It distinctly separates the two operating systems.

    • Drive failure would only disrupt one operating system.


    ![image](images/snake.jpg)


    Resizing partitions is a scary process where data loss can, and does, occur –
    even in expert hands. All contents of the partition must be backed up before attempting
    this operation.


    ## Adding a Second Hard Drive


    Older `IDE` (Integrated Drive Electronics) hard drives need to be configured as
    a master/slave relationship by setting “jumpers” on the hard drive. The drives
    can then be connected in tandem by a single ribbon cable.


    ![image](images/pg13_1.jpg)


    Most modern PCs now have `SATA` hard drives that do not need a master/slave configuration.
    Providing you have a `Windows` drive installed, your PC will automatically recognize
    an additional drive as secondary:


    ![image](images/1b.jpg)Turn off your PC, open up the case and find the existing
    hard drive – located in a cage


    ![image](images/2b.jpg)Install an additional `SATA` drive in the cage, then follow
    the cable of the first drive to identify where it plugs into the motherboard –
    usually a connector marked “SATA”


    ![image](images/3b.jpg)Plug your new drive’s `SATA` cable into an adjacent `SATA`
    connector on the motherboard, and plug the other end into the new `SATA` drive
    itself


    ![image](images/4b.jpg)Attach a power cable from the PC’s power unit to the `SATA`
    drive, then close the case and turn on your PC


    ![image](images/5b.jpg)Right-click the Start button and choose `Disk` `Management`
    to see an “Initialize Disk” dialog appear


    ![image](images/6b.jpg)Click `OK` to initialize the new hard drive, then back
    in Disk Management, right-click on the new drive and choose `New Simple Volume`
    from the context menu


    ![image](images/7b.jpg)Repeatedly click `Next` in the “New Simple Volume Wizard”
    to format the drive and allocate it a drive letter


    ![image](images/hot.jpg)


    If you are not comfortable working inside your PC case, a computer store should
    be pleased to undertake the fitting of a second drive for a modest fee.


    ![image](images/pg13_2.jpg)


    `SATA` (`S`erial `A`dvanced `T`echnology `A`ttachment) is the standard for connecting
    devices to the PC’s motherboard.


    ## Creating Boot Media


    ![image](images/pg14_1.jpg)


    The Linux Mint distro is available in three editions, with desktop environments
    called “Cinnamon”, “MATE”, and “Xfce” respectively. The most popular version is
    the `Cinnamon` edition that will be used throughout this book. It can be downloaded
    onto a USB flash drive to create “boot media”. This lets you try out Linux without
    making changes to your system, and lets you install Linux onto your system if
    desired. But first you will need to ensure your system meets these minimum requirements:


    • **1GB of RAM**

    • **15GB of disk space**

    • **1024 x 768 resolution**


    Like other distros, the Linux Mint download is an ISO file whose content must
    be “burnt” onto the USB flash drive (not merely copied onto it) to create the
    boot media:


    ![image](images/1b.jpg)Launch a web browser, then navigate to the download page
    **[linuxmint.com/download.php](http://www.linuxmint.com/download.php)**


    ![image](images/2b.jpg)Next, click on the `Cinnamon` link


    ![image](images/pg14_2.jpg)


    ![image](images/3b.jpg)Now, click a `Download mirror` link for your country from
    the list that appears


    ![image](images/4b.jpg)Choose to save the ISO file in a preferred location on
    your system to begin the download


    ![image](images/pg14_3.jpg)


    `linuxmint.iso`


    ![image](images/5b.jpg)


    When the download completes, you now need an app to burn the image onto the USB
    flash drive. Linux Mint recommends the `Etcher` app. Navigate your web browser
    to [balena.io/etcher](https://balena.io/etcher) and download the installer for
