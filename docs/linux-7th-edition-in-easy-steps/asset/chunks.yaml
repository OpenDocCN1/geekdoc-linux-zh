- fmt: '

    The Terminal window above displays the default `bash` command prompt and places
    the cursor after the prompt – ready to receive a command. The default prompt here
    comprises the current user name (`mike`), a separator character (`@`), the host
    PC name (`linux-pc`), the current directory (`~` tilde character denoting the
    Home directory), and a final terminating character (`$`).


    ![image](images/hot.jpg)


    You can learn more about `bash` commands with the companion book in this series
    Bash in easy steps. Visit `[www.ineasysteps.com](http://www.ineasysteps.com)`
    for more information on this book.


    ![image](images/snake.jpg)


    Options are not standardized – the same option can have different meanings for
    different commands.


    You can confirm the current user and host PC name at any time with the `whoami`
    and `hostname` commands:


    ![image](images/2r.jpg)Type the `whoami` command at a prompt, then hit `Return`


    ![image](images/3r.jpg)Now, type the `hostname` command and hit `Return` again


    ![image](images/pg141_1.jpg)


    ![image](images/forget.jpg)


    Commands use lowercase only – in uppercase the command will not be recognized.


    Some commands call upon individual programs that reside on your system – for example,
    the `clear` command that removes previous content from the Terminal. Others are
    “builtin” commands that are built in to the shell itself – for example the `exit`
    command that quits the shell and closes the Terminal window. You can determine
    whether a command is a builtin using the `type` command and the command’s name
    as its argument:


    ![image](images/4r.jpg)Type `clear` and hit `Return` to remove the previous content,
    then enter `type clear` and hit `Return` again to discover the location of the
    `clear` command program


    ![image](images/5r.jpg)Enter `type exit` and hit `Return` to discover that the
    `exit` command is a shell builtin instruction, then type the `exit` command and
    hit `Return` to quit the shell


    ![image](images/pg141_2.jpg)


    ![image](images/hot.jpg)


    Type a `--help` argument (two hyphens & “help”) after any command, then hit `Return`,
    to see a list of options for that command.


    ### Navigating at the Prompt


    When you start a shell session you are, by default, located in your home directory
    of the Linux file system. You can switch to any directory to which you have access
    permission by stating its absolute address as the argument to the `cd` command.
    Similarly, you can return to your home directory by stating its absolute address
    as the argument to the `cd` command, or using its tilde alias with the command
    `cd ~`.


    ![image](images/pg142_1.jpg)


    For shorter hierarchical moves, the command `cd ..` moves up one level to the
    parent directory of the current directory. Stating just the name of an immediate
    sub-directory as the argument to the `cd` command moves down one level to that
    sub-directory:


    ![image](images/1r.jpg)Launch a shell window then enter the `pwd` command at the
    prompt to print the current working directory


    ![image](images/2r.jpg)Enter the combined command `cd /etc ; pwd` to switch to
    the `/etc` directory and confirm it as the working directory


    ![image](images/3r.jpg)Next, enter the combined command `cd ~ ; pwd` to return
    to the home directory


    ![image](images/4r.jpg)Enter the combined command `cd .. ; pwd` to move up to
    the parent directory


    ![image](images/5r.jpg)Enter the combined command `cd /etc ; pwd` to switch to
    the `/etc` directory


    ![image](images/pg141_2.jpg)


    ![image](images/hot.jpg)


    Type a `--help` argument (two hyphens & “help”) after any command, then hit `Return`,
    to see a list of options for that command.


    ### Operating on Directories


    It is sometimes useful to be able to extract the name of a file using the `basename`
    command. Conversely, you can use `dirname` to extract the parent directory of
    a path.


    ![image](images/pg144_1)


    A new directory can be created in the shell using the `mkdir` command. This takes
    the directory name as its argument. Alternatively, a directory can be created
    elsewhere by specifying a full path.


    ![image](images/1r.jpg)Enter the command `mkdir Sub1` to create a directory named
    “Sub1” in the current directory


    ![image](images/2r.jpg)Enter the command `mkdir /home/mike/Sub2` to create a directory
    named “Sub2” using an absolute path


    ![image](images/3r.jpg)Issue the command `basename Sub1` to extract the program
    name from the path


    ![image](images/4r.jpg)Issue the command `dirname /home/mike/Sub2` to extract
    the parent directory of the path


    ![image](images/5r.jpg)


    Directories can be removed in the shell using the `rmdir` command. This takes
    the directory name as its argument and will instantly remove an empty directory,
    but will simply warn you that the directory is not empty if it contains files.


    Having to delete files manually, one by one, may provide safeguards but can be
    tedious. An intelligent alternative is available by using the recursive interactive
    `-ri` option of the `rm` command. This steps inside the directory and examines
    every file – requesting your confirmation before deleting each file. When all
    files have been deleted it then asks if you want to delete the directory:


    ```

    rm -ri Sub2

    ```


    ![image](images/6r.jpg)Launch the Text Editor using the `xed` command, and create
    three text files in the “Sub2” directory


    ![image](images/7r.jpg)Issue the command `rmdir Sub1` to remove the empty “Sub1”
    directory


    ![image](images/8r.jpg)Now, issue the command `rmdir Sub2` to attempt to remove
    the non-empty “Sub2” directory


    ![image](images/9r.jpg)Enter the command `rm -ri Sub2` to interactively delete
    the files within the “Sub2” directory, and remove the directory itself, by replying
    “Y” (yes) to each question


    ![image](images/pg145_1.jpg)


    ![image](images/hot.jpg)

