    The contents of the current directory can be revealed using the ls command to
    display a list of its files and immediate sub-directories. This is a comprehensive
    command that has many useful options:


    •Use the -a option to see all directory contents – including hidden files and
    hidden sub-directories.


    •Use the -l option to see long format listing for each item – including user and
    group ownership names.


    •Use the -t option to sort the contents by the time they were created or last
    modified.


    •Use the -o option to suppress group ownership details.


    •Use the -g option to suppress user ownership details.


