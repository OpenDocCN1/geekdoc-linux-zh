    ![image](images/hot.jpg)


    You can click the **Panel settings** item on this context menu for options to
    automatically hide the Taskbar panel, add more panels, and edit panels.


    ![image](images/hot.jpg)


    Notice that the **Applets** settings window functions much like the **Desklets**
    settings window described [here](#chapter02.xhtml_sec12).


    ![image](images/3r.jpg)Click the **Manage** button to select from a list of installed
    applets, or click the **Download** button to install another applet – for example,
    download the “Weather” applet


    ![image](images/4r.jpg)Click the **Manage** button and select the Weather applet,
    then click the **+ Add** button to add it to the Taskbar panel


    ![image](images/5r.jpg)The weather app should detect your location, but also allows
    you to choose a location. Right-click on the applet then choose the **Configure**
    option


    ![image](images/pg33_1.jpg)


    ![image](images/6r.jpg)In the Weather settings window, click the **Location**
    button then slide the **Manual Location** button to “On”


    ![image](images/pg33_2.jpg)


    ![image](images/7r.jpg)Next, type a preferred city name into the **Location**
    box, then close the window


    ![image](images/8r.jpg)Now, click the Taskbar applet to see the weather for your
    chosen location


    ![image](images/pg33_3.jpg)


    ![image](images/hot.jpg)


    Right-click on an applet to see a context menu that offers configuration options
    and an option to remove the applet from the Desktop.


    **Launching Apps**


    ![image](images/pg34_1.jpg)


    Apps can be launched in Linux Mint from the (Start) Menu and additional launchers
    can easily be added to the Taskbar, or on the Desktop, for frequently-used applications:


    ![image](images/1r.jpg)Click the ![image](images/pg34_2.jpg) **Menu** button,
    at the far left of the Taskbar, then position the mouse pointer over the **Accessories**
    category to see that category’s list of apps


    ![image](images/2r.jpg)On the Accessories menu list, click the **Text Editor**
    item to launch the Text Editor app


    ![image](images/pg34_3.jpg)


    ![image](images/hot.jpg)


    You can also type the name of an app into this **Search** box to find it.


    ![image](images/hot.jpg)


    The launchers in the sidebar are “Favorites”. You can choose **Add to favorites**
    on the context menu to add a launcher in the sidebar.


    ![image](images/3r.jpg)Right-click on the Text Editor item in the Accessories
    menu, then choose **Add to panel** from the context menu to create a launcher
    button on the Taskbar


    ![image](images/pg34_4.jpg)


    ![image](images/4r.jpg)Click the new launcher that has been added to the Taskbar
    to launch the Text Editor


    ![image](images/pg35_1.jpg)


    ![image](images/5r.jpg)Right-click on the Text Editor item in the Accessories
    menu, then choose **Add to desktop** from the context menu to create a launcher
    icon on the Desktop


    ![image](images/6r.jpg)Click the shortcut launcher icon that has been added to
    the Desktop, to launch the Text Editor


    ![image](images/pg35_2.jpg)


    ![image](images/hot.jpg)


    To delete a launcher from the Taskbar, right-click on it and choose **Remove**.
    To remove a launcher from the Desktop, right-click on it and choose **Delete**.


    You can also create a Desktop launcher icon for any application if you know its
    precise command name. In this instance, the Text Editor for the Cinnamon Desktop
    is named “xed”.


    ![image](images/7r.jpg)Right-click on the Desktop, then choose **Create a new
    launcher here** from the context menu that appears


    ![image](images/pg35_3.jpg)


    ![image](images/8r.jpg)Type a name and the **xed** command name into the appropriate
    input fields in the “Launcher Properties” dialog, then click its **OK** button
    to create the Desktop launcher


    ![image](images/pg35_4.jpg)


    ![image](images/pg35_5.jpg)


    ![image](images/hot.jpg)


    You can also launch apps from a command prompt in a Terminal window. Simply type
    the app’s command (**xed** in this case) then hit the **Enter** key to launch
    the app.


    **Editing the Menu**


    ![image](images/pg36_1.jpg)


    Like many things in the Linux Mint operating system, the (Start) Menu can be customized
    to suit your personal taste:


    ![image](images/1r.jpg)Right-click on the **Menu** button, at the far left of
    the Taskbar, then select the **Configure** option


    ![image](images/pg36_2.jpg)


    ![image](images/2r.jpg)Click the **Panel** button and slide the **Use a custom
    icon and label** toggle button to “On”


    ![image](images/3r.jpg)Select from options to adjust **Appearance** and **Behavior**.
    For example, change the Menu button’s **Text** value


    ![image](images/pg36_3.jpg)


    ![image](images/4r.jpg)See that your selected options are instantly applied to
    the Menu


    ![image](images/pg36_4.jpg)


    ![image](images/5r.jpg)Click the **Menu** button in the “Menu” window, then click
    the **Open the menu editor** button


    ![image](images/pg37_1.jpg)


    ![image](images/hot.jpg)


    You can click the hamburger button and save your Menu settings as a file, which
    can be imported later to resume those settings.


    ![image](images/pg37_4.jpg)


    ![image](images/hot.jpg)


    The “Super” key refers to the special key on your keyboard. Typically, this is
    the Windows Key. Press it once to open the Menu, then press it again to close
    the Menu.


    ![image](images/pg36_5.jpg)


    ![image](images/6r.jpg)Slide all toggle switches to the “Off ” position to simplify
    the Menu


    ![image](images/pg37_2.jpg)


    ![image](images/7r.jpg)Now, click the **Open the menu editor** button


    ![image](images/8r.jpg)Click any category in the left-hand pane, then select Menu
    items in the right-hand pane


    ![image](images/pg37_3.jpg)


    ![image](images/forget.jpg)


    You can uncheck the individual items to remove them from the Menu and click the
    **Restore System** **Configuration** button to resume its default appearance.


    **Installing Updates**


    ![image](images/pg38_1.jpg)


    Having set up Timeshift to make regular backups of your Linux Mint operating system
    (see [here](#chapter01.xhtml_sec8)), it is recommended that you regularly apply
    all updates available for your system:'
