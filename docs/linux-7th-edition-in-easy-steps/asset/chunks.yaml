    ![image](images/pg9_3.jpg)


    Discover more about the `Gnome` graphical desktop online at [gnome.org](http://www.gnome.org)


    ## Choosing a Distro


    At the very heart of `Linux` is a bunch of tried-and-tested compiled code called
    the `kernel`. The `kernel` provides the operating system with its core functionality,
    much like the engine in a car. It takes care of the basics, such as helping other
    programs access hardware and sharing your computer’s processor among various programs.


    ![image](images/pg10_1.jpg)


    In addition to the `kernel`, `Linux` contains a number of system-level programs,
    such as the services to handle your email, web connection and bootloader. Consider
    these as a car’s transmission, gears, and chassis – without these, the engine
    is not much use.


    `Linux` distributions generally also include a large number of user-level programs
    – the applications for daily use: for instance, web browsers, word processors,
    text editors, graphics editors, media players, and so on. These are the finishing
    touches to the car that ensure a great ride – whitewall tires and soft leather
    upholstery.


    All of these components are bundled together in a wide variety of `Linux` distribution
    packages, commonly referred to as “distros” – just as all the components of a
    car are bundled together to make a complete car.


    ![image](images/hot.jpg)


    Most `Linux` distros are available as a “live” version that lets you run `Linux`
    from a disk – so you can try it out without installing `Linux` onto your hard
    drive.


    In the same way that there are many makes and models of cars, there are many `Linux`
    distros to choose from. Some of the best known distros are `RedHat Fedora`, `SUSE`,
    `Ubuntu`, and `Mint`. Each distro has its own installer and unique default configuration
    according to what the distributor considers to be the best arrangement. The ideal
    one for you will depend on your own personal preferences and how you want to use
    `Linux`. The most popular distros are described below to help you choose:


    ### RedHat Fedora


    One of the most publicized Linux distros, comprising the commercial `RedHat Enterprise
    Linux` product line and the free `Fedora` distro that is developed by the `Fedora
    Project` community. There are several editions of the `Fedora` distro – “Workstation”
    for PCs, “Server” for servers, and “IoT” for cloud-based ecosystems.


    **Pros**: Widely used, excellent community support, innovative.


    **Cons**: Limited product life-span of Fedora editions, poor multimedia support.


    Free download from [getfedora.org](http://getfedora.org)


    ![image](images/pg10_2.jpg)


    “Choose Freedom. Choose Fedora.”


    ### openSUSE


    The community-based “openSUSE” distro has received positive reviews for its installer
    and `YaST` configuration tools. The documentation, which comes with the boxed
    product, has been labeled as the most complete by far. The fixed release “Leap”
    distro is the base for the `openSUSE` award-winning `SUSE Linux Enterprise` (`SLE`)
    products, and the rolling release “Tumbleweed” distro provides the very latest
    stable versions of all software.


    **Pros**: Attention to detail, easy-to-use `YaST` configuration tools.


    **Cons**: Huge distro – including over 1,500 bundled packages.


    Free download from [opensuse.org](http://opensuse.org)


    ![image](images/pg11_1.jpg)


    “The makers’ choice for sysadmins, developers and desktop users.”


    ### Ubuntu


    This sophisticated community distro typically employs the popular `Gnome` GUI
    desktop manager. It has the advantage of a fixed six-month release cycle, and
    every two years there is an `LTS` (`L**ong **T**erm **S**upport) release that
    is supported for five years. There are several editions of the `Ubuntu` distro
    – “Desktop” for PCs, “Server” for servers, “IoT ” for Internet of Things devices,
    and “Cloud” for cloud computing. The default interface of the `Ubuntu` Desktop
    edition is quite different to that of the Windows desktop.


    **Pros**: Great community, and fixed release cycle.


    **Cons**: The interface will seem unfamiliar to Windows users.


    Free download from [ubuntu.com](http://ubuntu.com)


    ![image](images/pg11_2.jpg)


    “Fast, secure and simple, Ubuntu powers millions of PCs worldwide.”


    ### Linux Mint

