    ![image](images/pg98_1.jpg)


    The LibreOffice suite includes an accomplished drawing tool that can be launched
    from any LibreOffice app to quickly create drawings, charts, diagrams and graphs:


    ![image](images/1bl.jpg)From any LibreOffice app, click **File**, **New**, **Drawing**
    or click **Menu**, **Office**, **LibreOffice Draw** to launch the app


    ![image](images/2bl.jpg)Click the arrowed button beside the **Basic Shapes** button
    on the Drawing toolbar, then choose the rounded rectangle object from the selection
    offered


    ![image](images/pg98_2.jpg)


    ![image](images/3bl.jpg)Drag the mouse in the drawing area to create a rectangle
    and press **Ctrl** + **C** to copy the object, then press **Ctrl** + **V** five
    times to paste five more rectangles on top of the first


    ![image](images/4bl.jpg)Drag the rectangles to separate areas, then click the
    ![image](images/pg98_3.jpg) **Connector** button on the Drawing toolbar


    ![image](images/5bl.jpg)Click on a rectangle, then drag to another rectangle to
    create connecting lines


    ![image](images/6bl.jpg)Now, click the ![image](images/pg98_4.jpg) **Insert Text
    box** button and label the rectangles


    ![image](images/pg98_5.jpg)


    ![image](images/hot.jpg)


    If the Drawings toolbar is not immediately visible, click **View**, **Toolbars**,
    **Drawing** to make it appear.


