    **Downloading Content**


    ![image](images/pg84_1.jpg)


    Linux distros typically include the Transmission BitTorrent Client app to acquire
    content via the BitTorrent protocol. This lets you download directly from other
    groups of people – in which each person is called a “peer”. Pieces of content
    from various peers are automatically assembled, making the BitTorrent protocol
    very efficient and reliable, particularly for large content files.


    The Transmission BitTorrent Client first requires you to download a “torrent file”
    containing information about the content you wish to acquire. These can be found
    in a BitTorrent directory such as Public Domain Torrents (publicdomaintorrents.info),
    Internet Archive ([archive.org](http://www.archive.org)), or Legit Torrents (legittorrents.info):


    ![image](images/1o.jpg)Open the **Firefox** web browser and visit a BitTorrent
    directory, then select an item you would like to download


    ![image](images/pg84_2.jpg)


    ![image](images/2o.jpg)Choose to save the torrent file – by default to the **Downloads**
    folder within your home directory


    ![image](images/pg84_3.jpg)


    ![image](images/3o.jpg)Click **Menu**, **Internet**, **Transmission** to launch
    the app


    ![image](images/4o.jpg)Click the **Open** button on the Transmission toolbar –
    to open an “Open a Torrent” dialog


    ![image](images/pg84_4.jpg)


    ![image](images/hot.jpg)


    Torrent downloads are often associated with illegal downloads, but free open content
    can be legally downloaded.


    ![image](images/hot.jpg)


    The first time you launch the **Transmission** app a dialog will appear in which
    you need to agree to share content responsibly.


    ![image](images/5o.jpg)Select the torrent file you downloaded and check the **Show
    options dialog** option


    ![image](images/pg85_1.jpg)


    ![image](images/6o.jpg)Click the **Open** button – to open a “Torrent Options”
    dialog


    ![image](images/pg85_2.jpg)


    ![image](images/hot.jpg)


    You can download multiple torrents simultaneously and click here to set each one’s
    priority to **Low**, **Normal**, or **High**.


