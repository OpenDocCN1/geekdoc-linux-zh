    from its manual page.


    **Finding Files**


    ![image](images/pg152.jpg)


    Locating a file on your system can be achieved from a shell prompt using the find
    command. This is a very powerful command, with over 50 possible options, but it
    has an unusual syntax. Possibly the one most often used looks like this:


    find *DirectoryName* -type f -name *FileName*


    The directory name specifies the hierarchical starting point from which to begin
    searching. If you know the file exists somewhere in your home directory structure,
    you could begin searching there ( ~ ). The -type f option specifies that the search
    is for a file – denoted by the letter “f ”. The -name option makes the search
    by name – seeking the specified file name:


    ![image](images/1r.jpg)Enter find ~ -type f -name some.txt to seek all files named
    some.txt within your home directory structure


    ![image](images/pg152_1.jpg)


    ![image](images/hot.jpg)


    Use the wildcard ***** with the file name when you know the name but not the extension.


    By default, the find command will only report the location of actual files, but
    you can also have it include symbolic links in the report by adding a -L option
    as its very first argument:


    ![image](images/2r.jpg)Now, enter find -L ~ -type f -name some.txt to see the
    result now locate the file and a symbolic link to that file – and an error message!


    ![image](images/pg152_2.jpg)


    ![image](images/forget.jpg)


    You can recall the last command entered by pressing the **Up** arrow key.


    If a search result includes error messages, you can exclude error messages by
    appending 2>/dev/null to the command:


    ![image](images/3r.jpg)Enter find -L ~ \ -type f -name some.txt 2>/dev/null to
    seek the location of a file, report the location of any softlinks to that file,
    and suppress error messages


    ![image](images/pg153_1.jpg)


    In addition to searching for files, the -type option can specify that the search
    is for directories – denoted by the letter “d”.


    ![image](images/hot.jpg)


    The \ backslash in this command simply lets you continue the command on the next
    line. Hit **Enter** after you type the \ backslash to see a continuation prompt
    appear on the next line.


    When searching deep directory structures, with many sub-directory levels, it is
    sometimes desirable to limit the depth of search with the find command’s -maxdepth
    option. This requires an integer argument to specify the number of levels to search:


    ![image](images/4r.jpg)Enter find /usr -maxdepth 1 -type d to report only those
    directories that are direct descendants of the /usr directory


    ![image](images/pg153_2.jpg)


    ![image](images/hot.jpg)


    The **/usr** directory has many levels – remove the **-maxdepth 1** option from
    the command in Step 4 and run the command again to see all directories.


    **Reading Text Files**


    ![image](images/pg154_1.jpg)


    The simplest way to view a text file in the shell is with the cat command. Just
    state one or more files to view as its arguments and it will display their content,
    concatenating the text together. Viewing one or two small text files will fit
    comfortably in a single window so you will see the entire text. Larger files,
    however, will exceed the space in a single window so you will only see the final
    part of the text. The solution is to send the text stream to the less command
    via the “|” pipe operator. This means that the text is displayed one screen at
    a time, starting from the beginning:


    ![image](images/1r.jpg)At a shell prompt, enter cat quote1.txt quote2.txt to display
    the content of two text files on standard output


    ![image](images/pg154_2.jpg)


    ![image](images/2r.jpg)Now, type cat ballad.txt | less then hit **Return** to
    display the file contents in less mode – in which a “:” prompt appears below the
    content text where you can enter special **less** mode commands to display selective
    text


    ![image](images/pg154_3.jpg)


    ![image](images/hot.jpg)


    You can use a **-n** option with the **cat** command to number each line on standard
    output.


    ![image](images/hot.jpg)


    The “less” facility offers many great options – press the **H** key in less mode
    to see them all.


    ![image](images/3r.jpg)Use the **Page Up** and **Page Down** keys to scroll through
    the text in less mode, then press the > key to skip to the end of the text and
    hit the Q key to quit less mode


    The head command lets you preview the first 10 lines of a text file, and its companion
    tail command lets you preview the final 10 lines – great for skipping to the end
    of a long log file.


    You can also display text with added line numbers using the nl number line command
    that provides useful control over numbering. Its -v option specifies an integer
    at which to start numbering, and its -b t option numbers only non-empty lines.


    ![image](images/4r.jpg)Enter the command **tail ballad.txt** to preview the last
    10 lines of text within the file (including empty lines)


    ![image](images/5r.jpg)Now, enter nl -v 0 -b t ballad.txt | head to preview the
    first 10 lines of text – numbered starting at zero, and numbering only non-empty
    lines


    ![image](images/pg155_1.jpg)


    ![image](images/forget.jpg)


    The shell pipeline technique allows the output from any command to be redirected
    as input for another command.


    **Writing Text Files**


    ![image](images/pg156_1.jpg)


    The classic Linux shell program for creating and editing text files is the compact
    vi application that is also found on Unix systems:


    ![image](images/1r.jpg)Type vi at a shell prompt, then hit **Return** to open
    the text editor in the shell window at its “splash screen”


    ![image](images/pg156_2.jpg)


    The vi (vim) editor displays a tilde character at the beginning of each empty
    line. You cannot enter any text initially, as vi opens in “command mode” where
    it will attempt to interpret anything you type as an instruction:


    ![image](images/2r.jpg)Press the **Insert** key to change to “insert mode” where
    text can be input


