    ![image](img/9g.jpg)输入 `zip elegy.zip elegy.txt` 来指定压缩名称及其应以压缩形式包含的文件。


    ![image](img/10g.jpg)再次执行 `du -b ele*` 命令来比较文件大小，然后输入 `unzip elegy.zip` 解压缩包内容。


