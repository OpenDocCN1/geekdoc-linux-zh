  raw: 'A modern, elegant operating system that is easy to use. It is based on the
    Ubuntu operating system and works straight out of the box, with full multimedia
    support. All Linux Mint distros are LTS releases that appear shortly after each
    Ubuntu LTS release, and are supported for five years. Users are encouraged to
    send feedback so their ideas can be used to improve Linux Mint. This operating
    system typically employs the Cinnamon GUI desktop manager, which will feel familiar
    to those moving from the Windows operating system. For that reason, Mint is used
    throughout this book to demonstrate the features of a Linux operating system.


    **Pros**: Great community, and the interface will seem familiar to Windows users
    – the best distro for beginners.


    **Cons**: Ubuntu has a larger community of users than Mint.


    Free download from **[linuxmint.com](http://linuxmint.com)**


    ![image](images/pg11_3.jpg)


    “Linux Mint. From freedom came elegance”.


    **Providing Disk Space**


    ![image](images/pg12_1.jpg)


    An operating system is installed on an area of the hard disk drive called a “partition”.
    When Windows is the only installed operating system, its partition will normally
    occupy the entire hard drive. To install Linux in this situation there are three
    possible options:


    •**Delete the Windows partition** – replacing it with Linux partitions that occupy
    the entire drive. This option will delete the Windows operating system along with
    all the applications and data files. It creates a dedicated Linux computer that
    will immediately start Linux when the PC gets switched on.


    •**Reduce the Windows partition size** – so that it no longer occupies the entire
    drive, then create Linux partitions in the resulting free space. This option will
    retain the Windows operating system, applications and data files. It creates a
    “dual-boot” computer that allows the user to choose whether to start Linux or
    Windows whenever the PC gets switched on.


    •**Add a second hard drive to the system** – this allows Linux partitions to occupy
    the entire second drive and retains the Windows operating system, applications
    and data files on the first drive. It too creates a dual-boot computer that allows
    the user to choose whether to start Linux or Windows whenever the PC gets switched
    on.


    ![image](images/hot.jpg)


    A **H**ard **D**isk **D**rive (HDD or simply “hard drive”) can be partitioned
    into one or more regions so that the operating system can manage each region separately.


    The option to install an additional hard drive for Linux is a popular choice for
    many people as they have often upgraded their original hard drive to a larger
    one, and so have their original drive spare. It also has several benefits over
    the other options:


    •The free space on the Windows drive is not reduced.


    •It removes the risk of data loss through partition resizing.


    •The familiar Windows operating system is retained.


    •It distinctly separates the two operating systems.


    •Drive failure would only disrupt one operating system.


    ![image](images/snake.jpg)


    Resizing partitions is a scary process where data loss can, and does, occur –
    even in expert hands. All contents of the partition must be backed up before attempting
    this operation.


    **Adding a Second Hard Drive**


    Older IDE (Integrated Drive Electronics) hard drives need to be configured as
    a master/slave relationship by setting “jumpers” on the hard drive. The drives
    can then be connected in tandem by a single ribbon cable.


    ![image](images/pg13_1.jpg)


    Most modern PCs now have SATA hard drives that do not need a master/slave configuration.
    Providing you have a Windows drive installed, your PC will automatically recognize
    an additional drive as secondary:


    ![image](images/1b.jpg)Turn off your PC, open up the case and find the existing
    hard drive – located in a cage


    ![image](images/2b.jpg)Install an additional SATA drive in the cage, then follow
    the cable of the first drive to identify where it plugs into the motherboard –
    usually a connector marked “SATA”


    ![image](images/3b.jpg)Plug your new drive’s SATA cable into an adjacent SATA
    connector on the motherboard, and plug the other end into the new SATA drive itself


    ![image](images/4b.jpg)Attach a power cable from the PC’s power unit to the SATA
    drive, then close the case and turn on your PC


    ![image](images/5b.jpg)Right-click the Start button and choose **Disk** **Management**
    to see an “Initialize Disk” dialog appear


    ![image](images/6b.jpg)Click **OK** to initialize the new hard drive, then back
    in Disk Management, right-click on the new drive and choose **New Simple Volume**
    from the context menu


    ![image](images/7b.jpg)Repeatedly click **Next** in the “New Simple Volume Wizard”
    to format the drive and allocate it a drive letter


    ![image](images/hot.jpg)


    If you are not comfortable working inside your PC case, a computer store should
    be pleased to undertake the fitting of a second drive for a modest fee.


    ![image](images/pg13_2.jpg)


    SATA (**S**erial **A**dvanced **T**echnology **A**ttachment) is the standard for
    connecting devices to the PC’s motherboard.


    **Creating Boot Media**


    ![image](images/pg14_1.jpg)


    The Linux Mint distro is available in three editions, with desktop environments
    called “Cinnamon”, “MATE”, and “Xfce” respectively. The most popular version is
    the Cinnamon edition that will be used throughout this book. It can be downloaded
    onto a USB flash drive to create “boot media”. This lets you try out Linux without
    making changes to your system, and lets you install Linux onto your system if
    desired. But first you will need to ensure your system meets these minimum requirements:


    •**1GB of RAM** (2GB preferred)


    •**15GB of disk space** (20GB preferred)


    •**1024 x 768 screen resolution**


    Like other Linux distros, the Linux Mint download is an ISO image file whose content
    must be “burnt” onto the USB flash drive (not merely copied onto it) to create
    the boot media:


    ![image](images/1b.jpg)Launch a web browser, then navigate to the download page
    **[linuxmint.com/download.php](http://www.linuxmint.com/download.php)**


    ![image](images/2b.jpg)Next, click on the **Cinnamon** link


    ![image](images/pg14_2.jpg)


    ![image](images/3b.jpg)Now, click a **Download mirror** link for your country
    from the list that appears


    ![image](images/4b.jpg)Choose to save the ISO image file in a preferred location
    on your system to begin the download


    ![image](images/pg14_3.jpg)


    linuxmint.iso


    ![image](images/5b.jpg)When the download completes, you now need an app to burn
    the image onto the USB flash drive. Linux Mint recommends the **Etcher** app.
    Navigate your web browser to **balena.io/etcher** and download the installer for
    your system, such as “Download for Windows (x86/x64)”


    ![image](images/hot.jpg)


    USB Flash Drive – also variously known as Thumb Drive, Pen Drive, Disk Key, Gig
    Stick, or Memory Stick.


    ![image](images/6b.jpg)When the installer download has completed, run its **Setup**
    wizard to install Etcher on your system


    ![image](images/7b.jpg)Next, connect a USB flash drive to your computer


    ![image](images/8b.jpg)Now, start the Etcher app and click the **Flash from file**
    button, then select the ISO image file you downloaded


    ![image](images/pg15_1.jpg)


    ![image](images/pg15_2.jpg)


    ![image](images/9b.jpg)Click the **Select target** button, then select the USB
    flash drive you connected to your computer


    ![image](images/10b.jpg)Click the **Flash!** button to burn the contents of the
    ISO onto the USB flash drive – creating the Linux boot media


    ![image](images/pg15_3.jpg)


    ![image](images/pg15_4.jpg)


    ![image](images/hot.jpg)


    If you wish to verify the ISO image file (recommended) you can find instructions
    on how to do so at [linuxmint-installation-guide.readthedocs.io/en/latest/verify.html](http://linuxmint-installation-guide.readthedocs.io/en/latest/verify.html)


    **Starting a Live Session**'
