- fmt: '

    Permissions can be changed at a shell prompt with the `chmod` command, stating
    the permission values and the file name as its arguments. For example, the command
    `chmod 777 myfile` sets full permissions for a file named “myfile”. You must first
    assume root superuser status with the `sudo` command if you are not the owner.
    The `chgrp` command can be used to change the group membership of a file by stating
    a group name and the file name as its arguments. Similarly, the `chown` command
    can specify a username and the file name to change the user ownership.


    ![image](images/forget.jpg)


    Notice that this user is a member of the group named “fund” that was created [here](#chapter10.xhtml_access).


    ![image](images/hot.jpg)


    See [here](#chapter04.xhtml_sec32) for more on access permissions.


    ![image](images/1g.jpg)


    Enter `chmod 644 mike-notes` to allow everyone to read this owned file, then enter
    `sudo chown mike andy-notes` to change ownership of that file – so this user can
    read it


    ![image](images/2g.jpg)


    Next, enter `sudo usermod -G fund dave`, to make the user “dave” a member of the
    group named “fund”, then enter `sudo chgrp fund dave-notes` to change the file’s
    group


    ![image](images/3g.jpg)


    Now, enter `sudo chmod 640 dave-notes`, to allow all exit to members of the group
    to read this file, then enter `exit` to end the Terminal session


    ![image](images/pg175_1.jpg)


    ![image](images/4g.jpg)


    Open the Terminal to start a new session, then issue an `ls -l` command to see
    the changes, then read the files where access was previously denied


    ![image](images/pg175_2.jpg)


    ![image](images/snake.jpg)


    Do not fall into the habit of setting everything to permissions of 777 – use access
    permissions thoughtfully to maintain useful restrictions.


    ## Controlling Processes


    ![image](images/pg176_1.jpg)


    A Linux system has many processes running at any given time, representing open
    apps, shell jobs, and background services. Each process has a unique `PID` (Process
    Identity) number. You can see a list of every current process with the `ps -e`
    command – or those for a particular user – with `ps -u` followed by the username.
    The process owner can terminate a process by stating its `PID` number as the argument
    to a `kill` command:


    ![image](images/1g.jpg)


    Open a Terminal window, then enter a command to begin a new process – for example,
    to start the ftp internet file transfer program


    ![image](images/pg176_2.jpg)


    ![image](images/2g.jpg)


    Next, open a second Terminal window, then enter the command `ps -e` to see a long
    list of all processes


    ![image](images/pg176_3.jpg)


    Scroll down the list to find the Terminal windows listed as “pseudo terminals”
    named as `pts/0` and `pts/1`


    ![image](images/hot.jpg)


    Enter the command `man ftp` to discover more about the ftp file transfer program.


    ![image](images/forget.jpg)


    Each `PID` is dynamically allocated by the operating system when a process is
    launched, to identify that particular instance.


    ![image](images/4g.jpg)


    Now, enter the command `ps -e | grep pts` to refine the list to just the processes
    running in each Terminal


    ![image](images/5g.jpg)


    See that the first number against each listed process is its `PID` – the ftp program
    is `PID` 2627


    ![image](images/pg177_1.jpg)


    Enter the command `kill 2627` to terminate the ftp process in the first window


    ![image](images/6g.jpg)


    Enter the command `ps -e | grep pts` once more to see the process is no longer
    in the list


    ![image](images/pg177_2.jpg)


    Highlighted here are `ftp` program process `PID` and the message in the first
    window after you issue `kill` command.


    ![image](images/hot.jpg)


    At a prompt you can enter the `top` command to view the most active processes
    – press the `Q` key to quit.


    ## Exploring the Network


    In much the same way that each house on a street has a unique address to which
    mail can be addressed for direct communication, every computer on a network has
    a unique number known as its `IP` (Internet Protocol) address, which can be used
    to directly communicate with a particular computer.


    ![image](images/pg178_1.jpg)


    You can discover the IP address of the computer behind a web address by stating
    the URL as the argument to the `host` command. In some cases, for large-scale
    websites, this may reveal multiple IP addresses:


    ![image](images/1g.jpg)


    At a shell prompt, enter `host www.google.com` to discover the IP address for
    URL


    ![image](images/pg178_2.jpg)


    Add a `-a` option to `host` command to see all information about host.


    ![image](images/hot.jpg)


    The most basic test to see if another computer is reachable across the network
    sends tiny data packets to its IP address using the `ping` command. This continues
    sending packets until you stop it, but you may limit the number of packets by
    adding `-c` option stating the total number of packets to send:


    ```

    ping -c 3 216.58.209.4

    ```


    ![image](images/2g.jpg)


    to see if it is reachable


    ![image](images/pg178_3.jpg)


    The IP address used here is one of those for the Google URL – revealed by `host`
    command in Step 1.


    ![image](images/forget.jpg)


    In Linux you can discover the IP address of your own computer by issuing `ifconfig`
    command to display the network interface configuration. If you know the connection
    device name, you can specify that as the argument to `ifconfig` command to see
    an individual report. If your computer has multiple connection devices, each one
    will be listed separately:


    ![image](images/3g.jpg)


    Issue a plain `ifconfig` command to discover the network IP address of your computer


    ![image](images/pg179_1.jpg)


    The computer in this example has a network connection through a wireless router,
    with an IP address of `192.168.0.166`, via a device named `wlp2s0`. Traditionally,
    the devices were named `eth0`, `eth1`, etc. for Ethernet devices and `wlan0`,
    `wlan1`, etc. for wireless devices, but a new naming scheme was introduced to
    overcome identification problems where multiple network interfaces are available
    on modern networks. The new naming scheme identifies the devices more specifically,
    to avoid confusion. With the connection above, the devices identified are Ethernet
    (`enp3s02`), localhost (`lo`), and wireless LAN (`wlp2s0`).


    ![image](images/hot.jpg)


    The `lo` loopback interface is useful for testing network applications locally
    before live deployment.


    ![image](images/snake.jpg)


    The `ifconfig` command only displays the status of active interfaces – add a `-a`
    option to include inactive interfaces.


    ## Printing from the Shell


    The `lpr` command takes a file name or path as its argument to establish a print
    job to send the specified file to the printer. Each job is placed in a queue awaiting
    transmission to the printer – when the job reaches the front of the queue, data
    from the file is sent to the printer and gets printed.


    ![image](images/pg180_1.jpg)


    You can examine jobs in the print queue with the `lpq` command – each job is automatically
    assigned a job number. A job can be removed from the queue, before it gets sent
    to the printer, using the `lprm` command together with its job number:


    ![image](images/1g.jpg)


    At a shell prompt, enter `lpr tux.png` to create a print job – to print an image
    file named “tux.png”


    ![image](images/2g.jpg)


    Enter `lpr ballad.txt` to create another print job – to print the specified text
    file “ballad.txt”


    ![image](images/3g.jpg)


    Issue an `lpq` command to see the current print queue


    ![image](images/pg180_2.jpg)


    The print queue reveals that the printer is actively printing job number 1 – the
    image file.


    ![image](images/4g.jpg)


    Before print job number 1 completes, issue the command `lprm 2` (or alternatively,
    the command `cancel 2`) to remove that job from the print queue

