    Notice that you can choose to extend the delay before the screensaver will appear
    if you don’t want to totally disable the screensaver.


    ![image](images/5g.jpg)

    Next, click the `Customize` button


    ![image](images/6g.jpg)

    Type a custom `Away message` to be displayed on the Lock screen


    ![image](images/pg45_1.jpg)


