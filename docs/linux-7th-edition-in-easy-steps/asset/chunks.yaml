    ## Handling Data


    ![image](images/pg104_1.jpg)


    The LibreOffice suite includes a database app that, like Microsoft Access, lets
    you store data and easily extract items of data:


    ![image](images/1bl.jpg)Click `Menu`, `Office`, `LibreOffice Base` to launch the
    app, then select “Create a new database” and click `Finish` – to open a “Save”
    dialog


    ![image](images/2bl.jpg)Enter a `Name`, then click `Save` to close the dialog


    ![image](images/3bl.jpg)Select `Tables`, then click `Use Wizard to Create Table`
    – to open a “Table Wizard” dialog


    ![image](images/pg104_2.jpg)


    ![image](images/4bl.jpg)Choose the `Personal` category, then select a `Sample
    table` – to see the available fields within that table


    ![image](images/pg104_3.jpg)


    ![image](images/5bl.jpg)Click an available field, then click the `>` button to
    move it to the `Selected fields` pane – to include it in your table


    ![image](images/6bl.jpg)Select all the fields you want, then click `Finish` to
    close the dialog and see a “Table Data View” window


    ![image](images/hot.jpg)


    The `Design View` and `Create View` options offer greater control but the `Wizard`
    is simpler.


    ![image](images/hot.jpg)

