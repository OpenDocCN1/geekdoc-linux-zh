    ## 流媒体电视


    ![image](img/pg120_1.jpg)


    Linux Mint 包含一个名为“Hypnotix”的流媒体应用，支持电视直播、电影和剧集。该应用本身不提供内容，而是从 IPTV（IP 电视）提供商处传输内容。Hypnotix
    默认配置了一个名为“Free-TV”的 IPTV 提供商。该提供商仅提供免费、合法、公开的内容，且不包含成人内容：


