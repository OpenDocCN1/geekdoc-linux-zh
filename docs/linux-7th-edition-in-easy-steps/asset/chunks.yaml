    ![image](img/13o.jpg)


    点击工具栏上的 `Send` 按钮发送邮件。


    ![image](img/pg81_3.jpg)


    ![image](img/hot.jpg)


    主“Write”窗口中的 `Edit`, `Preferences` 菜单允许你编辑用于组合、安全等各种 Thunderbird 设置。


