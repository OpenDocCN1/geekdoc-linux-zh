    ## Summary


    - `Linux` is a free, stable multi-user operating system that is derived from the
    powerful Unix operating system.

    - The name “Linux” combines letters from the first name of its originator, `Linu`
    Torvalds, with the final letter of Uni`x`.

    - Both `KDE` and the `Gnome` desktop are user-friendly graphical user interfaces,
    providing the same point-and-click convenience of the Windows desktop.

    - The `kernel` provides the core functionality of Linux.

    - Linux `distros` bundle the kernel, system-level programs, and free user-level
    programs in a variety of combinations.

    - The most popular Linux Mint distro employs the `Cinnamon` desktop manager, and
    is the best distro for beginners.

    - Minimum hardware requirements to run Linux Mint are 1GB of RAM, 15GB of disk
    space, and a screen resolution of 1024 x 768 – but higher specifications will
    perform better.

    - A second `hard drive` can easily be added to a PC so it can dual-boot to Linux
    or Windows.

    - A Linux distro can be downloaded and burned as a file system image onto a USB
    flash drive to create `boot media`.

    - In order to boot from a USB flash drive it may be necessary to change the boot
    device order using the boot `Setup utility`.

    - A `Live Session` lets you try out most features of Linux Mint before installation,
    and also provides an installer.

    - The Linux Mint `installer` allows you to install Linux as the sole operating
    system, or install it alongside Windows.

    - Before you start using the Linux Mint operating system it is recommended you
    enable the `Timeshift` backup utility so you can restore your system should problems
    arise.


