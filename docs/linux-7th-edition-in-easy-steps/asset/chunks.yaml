  raw: 'Notice that you can choose to extend the delay before the screensaver will
    appear if you don’t want to totally disable the screensaver.


    ![image](images/5g.jpg)Next, click the **Customize** button


    ![image](images/6g.jpg)Type a custom **Away message** to be displayed on the Lock
    screen


    ![image](images/pg45_1.jpg)


    ![image](images/7g.jpg)Close the dialog to save your custom message


    ![image](images/8g.jpg)Click the **Menu button**, then the ![image](images/pg45_2.jpg)
    “Lock screen button” to see your screensaver, and see your message on the Lock
    screen


    ![image](images/pg45_3.jpg)


    ![image](images/hot.jpg)


    There is also a Customize option to “Ask for a custom message when locking the
    screen from the menu” – so you can add a unique message when you leave your PC.


    ![image](images/forget.jpg)


    There are no animated screensavers included by default with this edition of Linux
    Mint.


    **Managing Windows**


    ![image](images/pg46_1.jpg)


    The control buttons on the Linux Mint window title bars perform the same actions
    as those in the Windows operating system:


    ![image](images/pg46_2.jpg)


    You can also snap windows to the screen edges, tile windows to the corners of
    the screen, and move windows between workspaces:


    ![image](images/1g.jpg)Click **Menu**, **Accessories**, **Text Editor** to open
    the Text Editor app


    ![image](images/2g.jpg)Click the window’s ![image](images/pg46_3.jpg) control
    button to reduce it from full-screen size


    ![image](images/3g.jpg)Next, click on the window’s title bar and hold down the
    mouse button, then drag the window to any screen edge


    ![image](images/4g.jpg)When you see a zone preview, release the mouse button to
    snap the window to that edge – filling half of your screen


    ![image](images/pg46_4.jpg)


    ![image](images/5g.jpg)Now, click on the window’s title bar and hold down the
    mouse button, then drag the window to any screen corner


    ![image](images/hot.jpg)


    Windows that are not full-size snapped or tiled can be resized by dragging their
    edges or corners.


    ![image](images/hot.jpg)


    You can ignore the on-screen instruction to **Hold <Ctrl>**. Simply snap two apps
    to the left and right sides of your screen to work on two documents at the same
    time.


    ![image](images/6g.jpg)When you see a zone preview, release the mouse button to
    snap the window to that corner – filling a quarter of your screen


    ![image](images/pg47_1.jpg)


    ![image](images/7g.jpg)Click **Menu**, **Preferences**, **Hot Corners** to open
    a “Hot Corners” window


    ![image](images/8g.jpg)Enable the top left-hand corner to show workspaces, then
    move the mouse cursor to that corner to see the workspaces


    ![image](images/pg47_2.jpg)


    ![image](images/pg47_3.jpg)


    ![image](images/forget.jpg)


    You can tile up to four apps. Also, you can snap and tile. For example, tile two
    apps at the top corners and snap another app across the bottom half of the screen
    to work on three documents at the same time.


    ![image](images/hot.jpg)


    You can drag apps from one workspace to another and click any workspace to begin
    working there in full screen. The apps remain running on the hidden workspaces
    so you can switch back to them.


    **Personalizing Options**


    ![image](images/pg48_1.jpg)


    You can personalize the behavior and appearance of windows by specifying preferences
    on your Linux Mint operating system. For example, many people prefer to change
    the default light gray windows to dark gray:


    ![image](images/1g.jpg)Click **Menu**, **Preferences**, **Window Tiling** to open
    a “Window Tiling” window – here you can disable Tiling and Snapping or modify
    its behavior


    ![image](images/pg48_2.jpg)


    ![image](images/hot.jpg)


    Slide this toggle switch to the “Off” position to disable the **Hold <Ctrl>**
    message when snapping or tiling your windows.


    ![image](images/2g.jpg)Click **Menu**, **Preferences**, **Windows** to open a
    “Windows” window – here you can modify title bar actions and window actions


    ![image](images/pg48_3.jpg)


    ![image](images/hot.jpg)


    Click the **Alt-Tab** button at the top of the dialog and explore switcher style
    options. To use the window switcher hold down the **Alt** key then jab the **Tab**
    key to select a window. Release the **Alt** key to give that window focus.


    ![image](images/pg48_4.jpg)


    ![image](images/3g.jpg)Click **Menu**, **Preferences**, **Themes** to open a “Themes”
    window, then click the **Themes** button to see the current appearance settings


    ![image](images/pg49_1.jpg)


    ![image](images/hot.jpg)


    Click the **Add/Remove** button to see a list of themes you can download and install.
    These provide additional options on the fly-out menu for the Desktop.


    ![image](images/4g.jpg)Click the current **Mint-Y** setting for “Window borders”
    to open a fly-out menu, then select the **Mint-Y-Dark** option to instantly change
    the border appearance


    ![image](images/5g.jpg)Similarly, click the current **Mint-Y** setting for “Controls”,
    then select **Mint-Y-Dark** on the fly-out menu to instantly change the appearance
    of window controls


    ![image](images/pg49_2.jpg)


    ![image](images/hot.jpg)


    Click the **Settings** button to see options to show or hide icons on window buttons
    and menus.


    **Controlling Connections**


    ![image](images/pg50_1.jpg)


    Linux Mint allows you to easily control how you connect to the internet via wireless
    Wi-Fi or wired Ethernet connections. You can also mask your presence via a proxy
    server or through a Virtual Private Network (VPN) connection:


    ![image](images/1g.jpg)Click **Menu**, **Preferences**, **Network** to open a
    “Network” window, then click **Wi-Fi** in the left-hand pane – to see available
    wireless connections in the right-hand pane


    ![image](images/pg50_2.jpg)


    ![image](images/2g.jpg)Similarly, click **Wired** to see available wired connections


    ![image](images/pg50_3.jpg)


    ![image](images/3g.jpg)Click **Network proxy** to see or add details for a proxy
    server with which you could mask your presence


    ![image](images/pg50_4.jpg)


    ![image](images/forget.jpg)


    You can also click the “Wireless connection” icon on the **System Tray** to view
    network status.


    ![image](images/pg50_5.jpg)


    ![image](images/hot.jpg)


    Proxy servers and VPNs both hide your IP address but, unlike VPNs, proxies do
    not encrypt your connection – it is safer to use a VPN to mask your presence.


    ![image](images/4g.jpg)Click the + **Add** button to open an “Add VPN” dialog,
    then choose the **Point-to-Point Tunneling Protocol (PPTP)** option


    ![image](images/pg51_1.jpg)


    ![image](images/5g.jpg)Next, enter the Name, URL, and User details of your VPN
    service, then click the **Advanced** button


    ![image](images/pg51_2.jpg)


    ![image](images/snake.jpg)


    You will need to click this icon and choose whether to store the password before
    you can enter a password.


    ![image](images/6g.jpg)Select authentication and security options and click OK,
    then click the + **Add** button on the “Add VPN” dialog


    ![image](images/pg51_3.jpg)


    ![image](images/7g.jpg)Click the newly-added VPN entry in the “Network” window,
    then slide the toggle switch to the “On” position to connect


    ![image](images/pg51_4.jpg)


    ![image](images/snake.jpg)


    The **W-Fi P2P** network connection item is not enabled by default.


    **Adding Printers**


    ![image](images/pg52_1.jpg)


    Linux Mint provides drivers for a wide range of printers, so adding a printer
    is often simply a matter of connecting the printer to a USB port on your PC and
    turning the printer on. The operating system should recognize the printer and
    display a notification that it has been automatically added to your system:


    ![image](images/pg52_2.jpg)


    The properties and options of added printers can be found in the “Printers” app,
    which can also be used to add network printers:


    ![image](images/1g.jpg)Click **Menu**, **Administration**, **Printers** to open
    a “Printers” window


    ![image](images/pg52_3.jpg)


    ![image](images/pg52_4.jpg)


    ![image](images/2g.jpg)Double-click on an installed printer to open its “Properties”
