    ## Viewing Images


    ![image](images/pg108_1.jpg)


    Many Linux distros include the simple Image Viewer app (`xviewer`) that can zoom
    and scroll. In Linux Mint you can find its launcher on the menu in the Accessories
    category, but usually you will launch it from a right-click context menu:


    ![image](images/1v.jpg)Drag the mouse over image file icons to select them, then
    right-click and choose **Open with Image Viewer**


    ![image](images/pg108_2.jpg)


    ![image](images/2v.jpg)See the Image Viewer app launch, displaying the first image
    alphabetically


    ![image](images/pg108_3.jpg)


    ![image](images/hot.jpg)


    You can also double-click on any file icon to instantly open that image in Image
    Viewer.


    ![image](images/hot.jpg)


    You can use your mouse to zoom too. Place the cursor over an image in Image Viewer
    then use the mouse wheel to zoom in and out.


    ![image](images/3v.jpg)Click the ![image](images/pg109_1.jpg) **Forward** button
    to view all the selected images, or click **View**, **Slideshow** to view them
    full-screen


    ![image](images/pg109_2.jpg)


    ![image](images/pg109_3.jpg)


    ![image](images/pg109_4.jpg)


    ![image](images/4v.jpg)Click **View**, **Image Gallery** to open a scrollable
    gallery pane within the Image Viewer window


    ![image](images/pg109_5.jpg)


    ![image](images/pg109_6.jpg)


    ![image](images/5v.jpg)Scroll to an image, then click **File**, **Set as Wallpaper**
    to make that image your Desktop background


    ![image](images/pg109_7.jpg)


    ![image](images/hot.jpg)


    A full-screen slideshow displays each image for five seconds, but you can change
    this with **Edit**, **Preferences**, **Slideshow**. Click **Esc** to quit a running
