    **Exchanging Email**


    ![image](images/pg80_1.jpg)


    Many Linux distros include the popular Thunderbird email app. The first time Thunderbird
    gets started it offers you a new email account or the option to use an existing
    email account. Typically, you will need to supply the name of your ISP’s mail
    servers (POP and SMTP), and your email address and password. When this is complete,
    and you have an internet connection, you can start sending and receiving email
    messages:


    ![image](images/1o.jpg)Click **Menu**, **Internet**, **Thunderbird Mail**, then
    click the **Get Messages** button on Thunderbird’s toolbar


    ![image](images/2o.jpg)Expand the folders list in the left-hand pane, then click
    the **Inbox** to see received messages in the top right-hand pane


    ![image](images/pg80_2.jpg)


    ![image](images/hot.jpg)


    Thunderbird is also a contact manager. Right-click this “From” field and choose
    **Add to Address Book** then click the **Address Book** button on the toolbar
    to see your contacts list.


    ![image](images/3o.jpg)Click on a received message in the top right-hand pane
    to see its contents appear in the bottom right-hand pane


    ![image](images/4o.jpg)To write a message, click the **Write** button on the toolbar
    to open a “Write” window – as seen opposite


    ![image](images/5o.jpg)In the Write window’s **From** field, select the account
    from which to send the message


    ![image](images/6o.jpg)In the **To** field, type the email address you are sending
    to


    ![image](images/7o.jpg)In the **Subject** field, type a short message title


    ![image](images/hot.jpg)


    The POP (**P**ost **O**ffice **P**rotocol) server handles incoming emails, and
    the SMTP (**S**imple **M**ail **T**ransfer **P**rotocol) server handles outgoing
    emails.


    ![image](images/8o.jpg)Now, type your message in the main window


    ![image](images/9o.jpg)Use the options on the formatting bar to adjust the font,
    layout, content, and insert a **Smiley face** emoji


    ![image](images/pg81_1.jpg)


    ![image](images/hot.jpg)


    Click this button to insert various content directly into your message.


    ![image](images/pg81_4.jpg)


