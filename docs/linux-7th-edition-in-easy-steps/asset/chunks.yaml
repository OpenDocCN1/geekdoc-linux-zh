    # 9 命令行终端


    ***本章介绍了命令行在文件管理方面的强大功能。***


    ## 调用终端


    Linux 系统的系统的核心是一系列核心机器指令，被称为“kernel”（内核）——这是一个不那么用户友好的技术程序，因为它主要设计用于与电子组件通信。Linux
    “shell”（外壳）是一个设施，允许用户以人类可读的形式通过命令与内核进行通信。它翻译命令行指令以便进行处理。


    ![image](img/pg140_1.jpg)


    大多数 Linux 发行版包含多个提供不同功能的 shell 程序。然而，默认的 Linux shell 程序称为 `Bash` (**B**ourne **A**gain
    **SH**ell)，它是 Unix 操作系统中原始 Bourne shell 的更新版本。


