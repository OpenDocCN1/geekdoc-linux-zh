    \n![image](images/pg68_3.jpg)\n\n![image](images/2p.jpg)Right-click anywhere on\
    \ the Desktop, then choose **Create a new launcher here** from the context menu\
    \ – to open a “Launcher Properties” dialog box\n\n![image](images/3p.jpg)Enter\
