    ![image](images/10g.jpg)At a shell prompt, change the access permissions to make
    the script executable by its owner with this command `chmod 711 guess.sh`


    ![image](images/11g.jpg)Enter `./guess.sh` to execute the script, then guess the
    number randomly selected by the script.


    ![image](images/pg185_1.jpg)


    ![image](images/hot.jpg)


    The `while-do` statement is a loop that employs the `-ne` (not equal) comparison
    operator and a `-gt` (greater than) comparison operator. Other Bash shell comparison
    operators include `-eq` (equal) and `-lt` (less than).


    ![image](images/snake.jpg)


    Remember that the square bracket characters are operators – there must be space
    around them to avoid errors.


    ## Summary


    - The `sudo` command executes commands at a shell prompt as if a regular user
    is the root superuser.

    - The Advanced Packaging Tool (APT) list of packages can be updated with `apt-get
    update`, packages installed with `apt-get install`, and removed with `apt-get
    remove`.

    - Files can be compressed with `gzip`, `bzip2` or `zip`, and uncompressed with
    their companions `gunzip`, `bunzip2`, and `unzip`.

    - File systems can be attached to the tree with `mount`, detached with `umount`,
    and checked with the `fsck` command.

    - User accounts can be created and edited by the root superuser with the commands
    `useradd`, `userdel` and `usermod`.

    - Login passwords can be changed with the `passwd` command, and personal details
    can be edited with the `chfn` command.

    - The groups accounts can be created and edited by the superuser with `groupadd`,
    `groupdel`, and `groupmod`.

    - Access permissions can be modified using the `chmod` command, and ownership
    changed using `chown` and `chgrp`.

    - Each process has a unique Process ID (PID), revealed by the `ps` command, and
    may be terminated by a `kill` command.

    - The IP address of a URL can be discovered with the `host` command, and that
    of your own computer with `ifconfig`.

    - Print jobs can be created with `lpr`, removed with `lprm`, listed with `lpq`,
    and status displayed with the `lpstat` command.

    - Expressions can be evaluated with the `expr` command, and strings manipulated
    with `length`, `substr`, and `index` functions.

    - Bash shell scripts begin with `#!/bin/bash` and are executed at a prompt by
    prefixing the file name by `./` dot-slash characters.


    [![image](images/IBC.jpg)](http://www.ineasysteps.com)


    [![image](images/bcover.jpg)](http://www.ineasysteps.com)

    '
