    You can also click `Copy to Clipboard` and close this dialog, then paste a screenshot
    into the GIMP app for editing.


    ![image](images/forget.jpg)


    Notice that some options are “grayed out” (indicating they are not available)
    depending on the type of screenshot you have chosen.


    ![image](images/4b.jpg)Relaunch the app, then choose the “Grab the current window”
    option


    ![image](images/5b.jpg)Select the “Include pointer” option, then click the `Take`
    `Screenshot` button


    ![image](images/pg135_1.jpg)


    ![image](images/6b.jpg)Edit the name and location, then click the `Save` button


    ![image](images/pg135_2.jpg)


    ![image](images/7b.jpg)See that the screenshot includes the cursor and any pop-up
