    Drawings can be saved in the native `ODF` (`Open Document Format`), Drawing format
    (`.odg`), or exported in a variety of image formats such as `PNG` (`.png`), `GIF`
    (`.gif`), and `SVG` (`.svg`).


    ![image](images/7bl.jpg)Click the `Insert`, `Chart` menu to add a default bar
    chart to the drawing area – a chart Formatting toolbar also appears


    ![image](images/pg99_1.jpg)


    ![image](images/8bl.jpg)On the Formatting menu, click the ![image](images/pg99_2.jpg)
    `Data Table` button and modify the default values in the “Data Table” dialog that
    appears, then close that dialog


    ![image](images/9bl.jpg)Click the ![image](images/pg99_3.jpg) `Chart Type` button
    to launch a “Chart Type” dialog, then choose `Line` in the left-hand pane and
    `Points and Lines` as the type of chart


    ![image](images/pg99_4.jpg)


    ![image](images/10bl.jpg)Click the `OK` button to close the “Chart Type” dialog
    and apply the chosen line style


    ![image](images/pg99_5.jpg)


    ![image](images/hot.jpg)


    The chart Formatting toolbar can be launched from the `View`, `Toolbars`, menu
    – after you have inserted a chart.


    ![image](images/hot.jpg)


    To insert an existing chart into a document, click `Insert`, `Object`, `OLE Object`
    – but to insert the default editable chart, just click `Insert`, `Chart`.


    ## Running Macros


    ![image](images/pg100_1.jpg)


    A “macro” is a recorded sequence of keystrokes that are stored with a given name.
    Running a macro replays the sequence, writing into the current document. This
    is particularly useful for recreating frequently-typed text within spreadsheets
    in LibreOffice Calc and within text documents in LibreOffice Writer:


    ![image](images/1bl.jpg)Launch Writer, then click `Tools`, `Options`, `LibreOffice`,
    `Advanced` and check the `Enable macro recording` option


    ![image](images/pg100_2.jpg)


    ![image](images/2bl.jpg)Next, click `Tools`, `Macros`, `Record Macro` to begin
    recording – a small window appears, bearing a `Stop Recording` button


    ![image](images/pg100_3.jpg)


    ![image](images/3bl.jpg)Click the ![image](images/pg100_4.jpg) `Center` button
    on the toolbar, then type your address


    ![image](images/pg100_5.jpg)


    ![image](images/4bl.jpg)Click the `Stop Recording` button in the small window,
    then see a “Basic Macros” dialog appear


    ![image](images/5bl.jpg)In the `Macro Name` text field, replace the name “Main”
    by the name “Address”, then click the `Save` button


    ![image](images/hot.jpg)


    A Java Runtime Environment (`JRE`) is required on the Linux system to run macros.
    Linux Mint includes the OpenJDK Runtime Environment for Java, but you may need
    to install a Java Runtime Environment on other distros.


    ![image](images/6bl.jpg)To run this macro at any time, first click `Tools`, `Macros`,
    `Run Macro` to launch a “Macro Selector” dialog


    ![image](images/7bl.jpg)Select the `Address` macro from `My Macros`, `Standard`,
    `Module1`, then click the `Run` button to write your address


    ![image](images/pg101_1.jpg)


    ![image](images/pg101_2.jpg)


    ![image](images/8bl.jpg)To edit this macro, click `Tools`, `Macros`, `Edit Macros`
    to launch a “My Macros” dialog, then select the `Address` macro to see the code
    behind the macro actions


    ![image](images/pg101_3.jpg)


    ![image](images/9bl.jpg)Locate the text values describing your address, then replace
    them with different values and click `File`, `Save` to apply the changes


    ![image](images/10bl.jpg)Finally, repeat Steps 6 and 7 to run this macro once
    more and see the modified address values written


    ![image](images/pg101_4.jpg)


    ![image](images/forget.jpg)


    The macro recorder only records actions relating to document content in the window
    where it was started, and it only works with the LibreOffice Writer and Calc apps.


    ![image](images/hot.jpg)


    Click on `Tools`, `Macros`, `Organize Macros`, `LibreOffice Basic`, then select
    an existing macro and use the `Delete` button to remove it.


