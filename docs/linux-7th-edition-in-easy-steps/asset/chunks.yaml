    Guess what? Wheels have been round for a really long time, and anybody who “reinvents”
    the new wheel is generally considered a crackpot. It turns out that “round” is
    simply a good form for a wheel to have. It may be boring, but it just tends to
    roll better than a square, and “hipness” has nothing what-so-ever to do with it.


    **Linus Torvalds, creator of the Linux kernel**


