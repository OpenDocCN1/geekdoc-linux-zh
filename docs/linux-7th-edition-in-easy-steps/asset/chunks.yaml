    ## Engaging the Internet


    This chapter demonstrates popular Linux apps for your online activities: [Browsing
    the Web](#chapter05.xhtml_34), [Customizing Firefox](#chapter05.xhtml_35), [Exchanging
    Email](#chapter05.xhtml_36), [Chatting Online](#chapter05.xhtml_37), [Downloading
    Content](#chapter05.xhtml_38), and [Getting More Apps](#chapter05.xhtml_39), and
    finally, a [Summary](#chapter05.xhtml_40).


    ### Browsing the Web

    ![image](images/pg76_1.jpg)

    Most Linux distros include the open-source Mozilla Firefox web browser. This popular
    free browser is available for various platforms and is highly customizable. It
    has been developed by the open-source community from original Netscape browser
    source code into a standards-compliant product:


    ![image](images/1o.jpg)

    Ensure you are connected to the internet, then click `Menu`, `Internet`, `Firefox
    Web Browser` to launch the web browser at its “Start Page”.


    ![image](images/pg76_2.jpg)


    ![image](images/2o.jpg)

    Click the `+ New Tab` button to open a new tab containing a Search box and links
    to “Top Sites”.


    ![image](images/76_3.jpg)


    ![image](images/hot.jpg)

    You can enter a URL in the address bar and hit `Return` to visit a web page. The
    address bar is also a Search box for the Yahoo! search engine.


    ![image](images/hot.jpg)

    The `Save to Pocket` feature lets you save web pages so you can view them later
    on any device.


    ![image](images/3o.jpg)

    Search for an item of interest, such as “How solar cells work”, then select a
    link from the results to visit the page.


    ![image](images/pg77_1.jpg)


    ![image](images/4o.jpg)

    Next, click the `Reader view` button on the toolbar to see the page without distractions.


    ![image](images/pg77_2.jpg)


    ![image](images/5o.jpg)

    Now, click the `Add bookmark` button on the toolbar, then choose the `Bookmarks
    Toolbar` folder option.


    ![image](images/pg77_3.jpg)


    ![image](images/6o.jpg)

    Click the `Done` button to see the item now appear on a “Bookmarks Toolbar” so
    you can revisit the page.


    ![image](images/pg77_4.jpg)


    ![image](images/forget.jpg)

    The `Reader view` button is not available for all web pages, but when visible
    it toggles between views. Click it to return to the regular page view.


    ![image](images/hot.jpg)

    Click the `Show sidebars` button and choose the `Bookmarks` option to see your
    bookmarks appear in the sidebar.


    ### Customizing Firefox

    ![image](images/pg78_1.jpg)

    The interface of the Firefox web browser is highly customizable and you can install
    “add-ons” for extra functionality:


    ![image](images/1o.jpg)

    Right-click on the toolbar, then choose the `Customize` option on the context
    menu – to open a “Customize Firefox” window.


    ![image](images/pg78_2.jpg)


    ![image](images/2o.jpg)

    Drag any item onto the toolbar to add it, or drag an item onto the Customize Firefox
    menu to remove it.


    ![image](images/pg78_3.jpg)


    ![image](images/hot.jpg)

    You can also drag items onto the `Overflow Menu`, which you can access later by
    clicking the toolbar’s `>>` button.


    ![image](images/pg78_8.jpg)


    ![image](images/3o.jpg)

    Click the `Themes` button and choose from the “My Themes” list of installed themes,
    or click on `Get More Themes` to install additional themes.


    ![image](images/pg78_4.jpg)


    ![image](images/4o.jpg)

    See your chosen theme instantly applied to the Firefox interface.


    ![image](images/pg78_5.jpg)


    ![image](images/hot.jpg)

