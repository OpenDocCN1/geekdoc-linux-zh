    ## Understanding Permissions


    In Linux, each file and directory has an “Owner” – generally, this is the user
    who created it. The `Owner` has full permission to read the file, write to the
    file, and to execute the file (if it’s executable).


    ![image](images/pg72_1.jpg)


    The `Owner` may also set permissions to specify if other users can read, write,
    and execute the file. The file’s accessibility can be restricted to the `Owner`,
    or to a “Group” of which the owner is a member, or to any user of the system (“Others”).


    Permission settings of a file can be found on the `Permissions` tab of its Properties
    dialog:


    ![image](images/1p.jpg)

    Right-click on a file, then choose the `Properties` item from the context menu
    – to launch the “Properties” dialog


    ![image](images/pg72_2.jpg)


    ![image](images/hot.jpg)


    You can select the `Emblems` tab to add a symbol to the file icon – for example,
    denoting the file as important.


    ![image](images/2p.jpg)

    Click on the `Permissions` tab to view the current settings


    ![image](images/pg72_3.jpg)


    ![image](images/hot.jpg)


    Here, the `Owner` and `Group` have “Read and write” permission, but `Others` have
    “Read-only” permission.


    ![image](images/hot.jpg)


    When a user account is created, a `Group` of the same name is also created – of
    which that user is a member.


    Usually the Owner, Group and Others will have permission to at least read the
    file. If you are the owner of the file, the `Owner` will have permission to write
    – and to execute the file if it’s executable.


    As the owner of the file you can use the arrowed buttons to change the access
    permissions of this file:


    ![image](images/3p.jpg)

    Click the arrowed button in the “Others” field, then choose `None` from the drop-down
    menu to restrict access to the `Owner` and `Group` members


    ![image](images/pg73_1.jpg)


    ![image](images/hot.jpg)


    Checking this option makes the file executable for those users who have permission
    to access it.


    ![image](images/4p.jpg)

    Click on the `Open With` tab if you would also like to change the default app
    that opens this file


    ![image](images/pg73_2.jpg)


    ![image](images/forget.jpg)


    Changing the default app is applied to all files of this file type, whereas changing
    permissions is applied to this file only. Here, the change will make LibreOffice
    Writer the default app to open all text files.


    ![image](images/forget.jpg)

    If you need to change permissions on files where you are not the owner, you need
    rootuser status – see [chapter10.xhtml_78] for details.


    ### Summary

    - The file system comprises a number of standard directories arranged hierarchically
    beneath `/`.

    - Data files created by a user should only be stored in the `/home` directory
    – in the user’s `home` directory.

    - A user can navigate around the file system graphically using the `Nemo` file
    browser.

    - An individual `file` can be copied, moved, renamed, and deleted with the file
    browser.

    - Desktop shortcuts are easily created by selecting `Add to desktop` on the Menu.

    - The “Launcher Properties” dialog can create shortcuts to apps.

    - A shortcut to a local file can be created as a `link`, which is merely a reference
    to the target file.

    - Care must be taken to avoid oraning links when the target file gets moved or
    renamed.

    - It is important to recognize that many Linux directories contain `hidden` sub-directories.

    - Hidden files and directories always have names that begin with a `.` character.

    - The `View`, `Show Hidden Files` menu in the file browser allows all content
    to be seen.

    - Files can be located using the file browser’s `Search` box to match file names
    or extensions.

    - The `Owner` of a file can specify access permissions to allow the `Owner`, `Group`,
    and `Others` to read, write, and execute.

    [/content]


