    ## Doing Calculations


    Linux Mint includes a Calculator app that can perform many different types of
    calculations and conversions. It provides a scrollable History View of your previous
    calculations so you can select a previous calculation to manipulate further.


    ![image](images/pg128_1.jpg)


    There are five modes available in the Calculator app in which you can enter basic
    equations, execute math and financial functions, and perform conversions of currency,
    size, and number base:


    ![image](images/1b.jpg)Click `Menu`, `Accessories`, `Calculator` to launch the
    app in “Basic Mode”.


    ![image](images/2b.jpg)Enter some equations to see the result and see them get
    added to the `History View` area.


    ![image](images/pg128_2.jpg)


    ![image](images/3b.jpg)Select “Advanced Mode” from the title bar menu, then select
    options to convert a measured distance.


    ![image](images/pg128_3.jpg)


    ![image](images/hot.jpg)


    There is no limit to the number of calculations in the `History View` area.


    The `Advanced Mode` provides additional buttons that perform math functions, such
    as logarithm (`log`).


    ![image](images/4b.jpg)Select “Financial Mode” from the title bar menu, then select
    options to approximately convert a sum of currency.


    ![image](images/pg129_1.jpg)


    ![image](images/5b.jpg)Select “Programming Mode” from the title bar menu, then
    select options to convert number bases.


    ![image](images/pg129_2.jpg)


    ![image](images/6b.jpg)Select “Keyboard Mode” from the title bar menu, then select
    options to convert temperature scales.


    ![image](images/pg129_3.jpg)


    ![image](images/forget.jpg)


    The `Financial Mode` provides additional buttons that perform financial functions
    such as future value (`Fv`).


    ![image](images/hot.jpg)


    Decimal 100 is binary `1100100`, which represents the sum of `64+32+0+0+4+0+0`.
    Decimal 100 is also octal `144` and hexadecimal `64`.


    ![image](images/forget.jpg)


    The `Programming Mode` provides additional buttons that perform programming functions,
    such as Boolean algebra (`AND`, `OR`, `XOR`, `NOT`).


    ## Managing Archives


    ![image](images/pg130_1.jpg)


    The Linux Mint distro includes a versatile Archive Manager app that can compress
    files into many archive file formats. If you choose the popular ZIP (`.zip`) format
    you can password-protect the archive, but this format often does not produce the
    smallest archive file size. You can find the Archive Manager launcher on the Menu
    in the Accessories category, but usually you will launch it from a right-click
    context menu:


    ![image](images/1b.jpg)Right-click on a folder you would like to compress, and
    choose `Compress` on the context menu – to open a “Compress” dialog.


    ![image](images/pg130_2.jpg)


    ![image](images/2b.jpg)Enter an archive file name, then select the `.zip` archive
    file format.


    ![image](images/pg130_3.jpg)


    ![image](images/3b.jpg)Choose a location and expand “Other Options”, then enter
    a password.


    ![image](images/4b.jpg)Click the `Create` button to make an archive copy of the
    original folder and its contents at your chosen location.


    ![image](images/5b.jpg)Right-click on the original folder and choose `Delete`
    on the context menu – to remove the folder and its contents.


    ![image](images/snake.jpg)


    Not all archive file formats support password protection.


    ![image](images/forget.jpg)


    The archive does not replace the original folder – it is created in addition to
    the original.


    ![image](images/6b.jpg)Next, right-click on the archive file and choose `Open
    With Archive Manager` – to see its contents.


    ![image](images/pg131_1.jpg)


    ![image](images/7b.jpg)Now, click the `Extract` button to see its contents.


    ![image](images/pg131_2.jpg)


