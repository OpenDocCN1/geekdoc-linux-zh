    ![image](images/10p.jpg)Drag the mouse pointer across both files, then right-click\
    \ and choose **Move to Trash** to delete the files\n\n![image](images/pg67_2.jpg)\n\
    \n![image](images/pg67_3.jpg)\n\n![image](images/hot.jpg)\n\nYou can right-click\
    \ in the file browser and choose **Create New Folder** from the context menu to\
    \ add a new directory – but remember that this should be within your home directory\
    \ hierarchy.\n\n![image](images/hot.jpg)\n\nTo recover a trashed file, click the\
    \ **Trash** icon on the file browser’s sidebar (or the one on the Desktop), right-click\
    \ the file icon, then choose the **Restore** option from the context menu.\n\n\
    ## Creating Shortcuts\n\n![image](images/pg68_1.jpg)\n\nIt is often convenient\
    \ to create Desktop shortcuts to the apps and files you access most frequently.\
    \ Shortcuts for apps can be created from options on the Menu, or from the Desktop\
    \ context menu. Shortcuts for files can be created as links using the file browser:\n\
