    A ![image](images/pg119_5.jpg) icon gets added to the System Tray when playback
    begins of music, podcasts or radio. You can close the Rhythmbox window and playback
    will continue. Click the ![image](images/pg119_5.jpg) icon and use the controls
    on the panel that appears to control playback, or click its `X` button to quit
    playback.


