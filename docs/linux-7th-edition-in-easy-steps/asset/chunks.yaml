    The purpose of each standard Linux directory is described in more detail on the
    ensuing pages of this chapter.


    ![image](images/snake.jpg)


    Do not confuse the `/root` directory (the home directory of the root superuser)
    with the `/` root of the file system.


    ## Recognizing Directories


    ### `/bin`

    Contains small executable programs (binaries) that are required when your PC boots
    up, and programs that execute basic commands. This directory is roughly equivalent
    to the `C:\Windows` directory in Windows.


    ![image](images/pg60_1.jpg)


    ### `/boot`

    Contains important files required when your PC boots up and also the Linux kernel
    itself – the heart of the operating system. The kernel controls access to all
    the hardware devices your computer supports, and allows multiple programs to run
    concurrently and share that hardware.


    ![image](images/pg60_2.jpg)


    ### `/cdrom`

    This is historically a directory in which CD-ROMs inserted into the system were
    mounted – the standard location is now `/media`.


    ![image](images/pg60_3.jpg)


    ### `/dev`

    Contains special file system entries that represent devices that are attached
    to the system. These allow programs access to the device drivers that are essential
    for the system to function properly – although the actual driver files are located
    elsewhere. The entry `/dev/sda` represents the first hard drive on your PC.


    ![image](images/pg60_4.jpg)


    ### `/etc`

    Contains system configuration files storing information about everything from
    user passwords and system initialization to screen resolution settings. These
    are plain text files that can be viewed in a text editor. The files in this directory
    are roughly equivalent to the combination of `.ini` files and the Registry entries
    found in the Windows operating system.


    ![image](images/pg60_5.jpg)


    ### `/home`

    Contains a sub-directory for each user account to store personal data files. If
    there is a user account named “mike” there will be a `/home/mike` directory where
    that user can store personal files – other users cannot save files there. This
    directory is where you store all your working documents, images, and media files.


    ![image](images/pg61_1.jpg)


    ### `/lib`

    Contains 32-bit library files that are used by the executable programs in the
    `/bin` and `/sbin` directories. These shared libraries are particularly important
    for booting the system and executing commands within the root file system. They
    are roughly equivalent to the `.dll` (Dynamic Link Libraries) in Windows.


    ![image](images/pg61_2.jpg)


    ### `/lib64`

    Contains 64-bit library files that are used by the executable programs in the
    `/bin` and `/sbin` directories.


    ![image](images/pg61_3.jpg)


    ### `/lost+found`

    Contains misplaced files that may be corrupted, but from which data can still
    be recovered.


    ![image](images/pg61_4.jpg)


    ### `/media`

    This is a directory in which removable media inserted into the system gets mounted.
    When you connect a USB flash drive to your PC, a sub-directory, such as `/media/flash-drive`,
    is created.


    ![image](images/pg61_5.jpg)


    ### `/mnt`

    This is a directory in which the system administrator can temporarily mount an
    additional file system.


    ![image](images/pg61_6.jpg)


    ### `/opt`

    Contains nothing initially, but this directory provides a special area where optional
    add-on application software packages can be installed. If “example” is the name
    of a particular software package in the `/opt` directory, then all its files could
    be placed within sub-directories of an `/opt/example` directory.


    ![image](images/pg62_1.jpg)


    ### `/proc`

    Contains special files that relay information to and from the kernel. The hierarchy
    of “virtual” files within this directory represents the current state of the kernel.
    Unlike binary and text files, most virtual files are listed as zero bytes in size
    and are time-stamped with the current date and time. This reflects the notion
    that they are constantly updating.


    ![image](images/pg62_2.jpg)


    ### `/root`

    This is the home directory of the root account superuser – for security reasons,
    regular users cannot access this directory.


    ![image](images/pg62_3.jpg)


    ### `/run`

    Contains transient files required by applications at runtime to supply data such
    as process IDs.


    ![image](images/pg62_4.jpg)


    ### `/sbin`

    Contains executable system programs (binaries) that are only used by the root
    superuser and by Linux when the system is booting up or performing system recovery
    operations. For instance, the clock program that maintains the system time when
    Linux is running is located in the `/sbin` directory. This directory is roughly
    equivalent to the `C:\Windows\system` directory in Windows.


    ![image](images/pg62_5.jpg)


    ### `/srv`

    Contains files that supply data for services provided by the system.


    ![image](images/pg63_1.jpg)


    ### `/sys`

    This is a virtual file system that stores the kernel’s view of the system and
    of the devices connected to the system.


    ![image](images/pg63_2.jpg)


    ### `/timeshift`

    Contains backup snapshots of the system taken at intervals specified by the Timeshift
    app.


    ![image](images/pg63_3.jpg)


    ### `/tmp`

    Contains temporary files that have been created by running programs. Mostly these
    are deleted when the program gets closed, but some do get left behind – periodically
    these should be deleted. This directory is roughly equivalent to the `C:\Windows\Temp`
    directory in Windows.


    ![image](images/pg63_4.jpg)


    ### `/usr`

    Contains applications and files used by users, as opposed to applications and
    files used by the system. For example, non-essential applications are located
    inside `/usr/bin`.


    ![image](images/pg63_5.jpg)


    ### `/var`

    Contains variable files that store information about ongoing system status, particularly
    logs of system activity. To see recent event messages, enter `/var/log`.


    ![image](images/pg63_6.jpg)


    ## Navigating with Nemo


    The standard Linux sub-directories can be viewed graphically by opening the file
    browser. In Linux Mint, Nemo can be launched by clicking the ![image](images/pg64_2.jpg)
    “Files” button on the Taskbar or by selecting “Files” on the Menu.


    ![image](images/pg64_1.jpg)


    Click **Menu**, **Accessories**, **Files** to open the file browser – see the
    home directory


    ![image](images/1p.jpg)

    Expand the **My Computer** list in the left-hand sidebar


    ![image](images/2p.jpg)

    Click the **File System** item – to see all the sub-directories within the system
    root


    ![image](images/3p.jpg)


    Click any directory folder to explore the system’s sub-directories


    ![image](images/4p.jpg)

    Click the ![image](images/pg64_4.jpg) back button above the sidebar to go to the
    previously-visited location


    ![image](images/5p.jpg)


    If you cannot see the sidebar when you open Nemo, hit the F9 key to show the sidebar.


    You can navigate through the file system with Nemo by clicking on a folder or
    by clicking on a location in the sidebar. Also, you can click the ![image](images/pg65_1.jpg)
    button on the toolbar to open a location field, then type in a directory address
    and hit the **Enter** key.


    ![image](images/6p.jpg)

    Click the folder icon of the `/home` directory (“home”) – there will be a folder
    there bearing your username


    ![image](images/7p.jpg)

    Click on the folder bearing your username to see the contents of your home directory


    ![image](images/pg65_2.jpg)


    Notice that when you click a folder icon, information about its contents appears
    at the bottom of the window – see how many folders are empty.


    ![image](images/hot.jpg)


    You can click these buttons to change how the folders are viewed.

