    - [Launching Apps](#chapter02.xhtml_sec14)

    - [Editing the Menu](#chapter02.xhtml_sec15)

    - [Installing Updates](#chapter02.xhtml_sec16)

    - [Closing the Desktop](#chapter02.xhtml_sec17)

    - [Summary](#chapter02.xhtml_sec18)


    ## Meeting the Interface


    ![image](images/pg28_1.jpg)


    When you start up the Linux Mint operating system, the first thing you see while
    the system begins loading is a black screen displaying only the Linux Mint logo:


    ![image](images/pg26_2.jpg)


    ![image](images/forget.jpg)


    The distro featured throughout this book is Linux Mint 20 (Ulyssa).


    Unless you selected the option to “Log in automatically” during the installation
    process (as described [here](#chapter01.xhtml_timezone)), the next thing you see
    is the `Log in` screen shown below:


    ![image](images/pg26_3.jpg)


    You can now enter the password you chose, then click the arrow button that appears
    in the password box (or hit the `Enter` key) to log in to the Linux Mint operating
    system.


    ![image](images/hot.jpg)


    The current time is also shown at the top right of the `Log in` screen. Hover
    your mouse cursor above the time to see the current date appear in a pop-up `Tooltip`
    box.


    After you log into Linux Mint, whether via the `Log in` screen or by choosing
    the automatic option, the GUI (`G`raphical `U`ser `I`nterface) Desktop and Taskbar
    will appear, as shown below:


    ![image](images/pg27_1.jpg)


    ![image](images/hot.jpg)


    The `Welcome` dialog provides helpful information for new users. Uncheck this
    option if you don’t want to see this dialog again. Click the `X` button in the
    top right of any window to close that window.


    If you have experience of the Windows operating system, the Linux Mint Desktop
    will seem familiar – as is the intention.


    ### System Tray


    The System Tray contains, by default, five icons that provide access to useful
    features when you click on the icon:


    ![image](images/pg27_2.jpg)


    ![image](images/hot.jpg)


    Hover your mouse cursor above the time to see information appear in a `Tooltip`
    box.


    ### Configuring the Desktop


    ![image](images/pg28_1.jpg)


    One of the first changes people want to make to their Desktop is to change the
    background Desktop:


    ![image](images/1r.jpg)


    Right-click anywhere on the Desktop to open a context menu


    ![image](images/pg28_2.jpg)


    Select the `Change Desktop` option to open a `Backgrounds` window


    ![image](images/3r.jpg)


    Choose `Ulyssa` in the left pane to see a selection of wallpaper


    ![image](images/pg28_3.jpg)


    ![image](images/hot.jpg)


    You can click the `Settings` button to choose a color instead of an image


    ![image](images/hot.jpg)


    You can also click on the `Pictures` folder to choose your own images


    ![image](images/4r.jpg)


    ![image](images/pg28_4.jpg)


    If you are used to seeing the “Recycle Bin” icon on the Windows Desktop, or would
    simply like to restore deleted easily, you will want to see the Trash icon on
    Linux Mint:


    ![image](images/1r.jpg)


    Right-click anywhere on the Desktop wallpaper to open the context menu and select
    `Customize` to open a `Current Monitor Layout` window


    ![image](images/pg29_1.jpg)


    ![image](images/pg29_2.jpg)


    You can select options from this window to change the size of all Desktop icons
    and change how they are arranged


    ![image](images/2r.jpg)


    Next, click the `Desktop Settings` link to open a `Desktop` window


    ![image](images/pg29_3.jpg)


    ![image](images/3r.jpg)


    See that the toggle switch for the `Trash` icon is in the `Off` position


    ![image](images/4r.jpg)


    Slide the toggle switch to the ![image](images/pg29_4.jpg) “On” position to see
    the Trash icon now appear on the Desktop


    ### Adding Desklets


    ![image](images/pg30_1.jpg)


    Linux Mint offers a number of small apps (“applets”) that run on the Desktop.
    These are similar to the Desktop widgets you may have seen in Windows, but are
    called “Desklets” (**Desk**top app**lets**) in Linux Mint. Some desklets are installed
    as standard, and you can download many more:


    ![image](images/1r.jpg)


    Right-click anywhere on the Desktop wallpaper to open the context menu, then select
    `Add Desklets` to open a `Desklets` settings window


    ![image](images/pg30_2.jpg)


    ![image](images/2r.jpg)


    Next, select an installed desklet, such as the `Clock desklet`


    ![image](images/pg30_3.jpg)


    ![image](images/3r.jpg)


    Now, click the `+ Add` button to instantly add the desklet to your Desktop


    ![image](images/pg30_4.jpg)


    ![image](images/hot.jpg)

