    ## Editing Images


    ![image](images/pg114_1.jpg)


    The primary image editing application in Linux is the GIMP (**G**NU **I**mage
    **M**anipulation **P**rogram) open-source app that includes over 220 plugins in
    a standard installation. These provide the GIMP with many of the capabilities
    of Adobe Photoshop but do not provide native support for CMYK colors.


    The GIMP is highly configurable and has powerful scripting support. GIMP can be
    used to edit images and to create attractive web page graphics:


    ![image](images/pg114_2.jpg)


    ![image](images/1v.jpg)Items in the Tool Options panel change according to which
    tool is selected in the Toolbox panel. For example, click the ![image](images/pg114_3.jpg)
    Paintbrush tool in the Toolbox to see options available for that tool in the Tool
    Options panel


    ![image](images/pg114_4.jpg)


    ![image](images/hot.jpg)


    The GIMP app is not bundled with Linux Mint by default. See [here](#chapter05.xhtml_sec39)
    for installation instructions.


    ![image](images/2v.jpg)Now, in the Toolbox, select each tool in turn to see their
    available options in the Tool Options panel


    ![image](images/3v.jpg)The Brushes, Patterns and Fonts panel has tabs for each
    category that display items in a scrollable window. Each tab displays the current
    selection for that category. For example, click the ![image](images/pg115_2.jpg)
    Brushes tab and select a star-shaped brush to see that shape appear on the tab


    ![image](images/pg115_1.jpg)


    ![image](images/4v.jpg)Select the ![image](images/pg115_3.jpg) Paintbrush tool
    in the Toolbox and click on an image in the Image Window to paint star shapes


    ![image](images/5v.jpg)Now, select the ![image](images/pg115_4.jpg) Pattern tab
    and ![image](images/pg115_5.jpg) Fonts tab in turn to examine the available items
    in those categories


    ![image](images/6v.jpg)The Layers, Channels and Paths panel has tabs that display
    items for each category. Each category provides a button to toggle the visibility
    of individual items. For example, select the ![image](images/pg115_7.jpg) Channels
    tab then click the ![image](images/pg115_8.jpg) eye button of the Red channel
    to hide all red components of the image


    ![image](images/pg115_6.jpg)


    ![image](images/7v.jpg)There are buttons at the bottom of the Layers, Channels
    and Paths panel that allow you to add, remove, or arrange items in each category.
    For example, select the ![image](images/pg115_9.jpg) Layers tab then click the
    ![image](images/pg115_10.jpg) Create button to open a “Create a New Layer” dialog


    ![image](images/8v.jpg)Enter a layer name, such as “StarLayer”, then click the
    `OK` button to close the dialog and see the new layer added in the Layers tab


    ![image](images/pg115_11.jpg)


    ![image](images/forget.jpg)


    The GIMP can read many image file types – including PSD files produced by Photoshop.


    ![image](images/snake.jpg)


    The results of some GIMP plugins can be less predictable than those in Photoshop
    for inexperienced users.


    ## Watching Movies


    ![image](images/pg116_1.jpg)


    Linux Mint includes a fast, light-weight media player app named Celluloid that
    can play audio and video content in many file formats including AVI, MPG, WMV,
    WAV, MP3, and many more. Celluloid is the default media player for audio and video
    files in Linux Mint:


    ![image](images/1v.jpg)Double-click on a video file icon to begin immediate playback
    of that video


    or


    Click `Menu`, `Sound & Video`, `Celluloid` to launch the media player app, then
    click `+`, `Open` and browse to a video file


    ![image](images/pg116_2.jpg)


    ![image](images/pg116_3.jpg)


    ![image](images/2v.jpg)Select a movie to see it immediately begin to play in the
    Celluloid app’s display area


    ![image](images/pg116_4.jpg)


    ![image](images/hot.jpg)


