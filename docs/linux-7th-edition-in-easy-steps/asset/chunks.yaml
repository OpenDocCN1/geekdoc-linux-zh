    folder as “tracks”


    ![image](images/4v.jpg)Click on the tracks in the list to select them, then click
    the `Import selected tracks` button to make a playlist


    ![image](images/pg118_4.jpg)Click the `Play` button to start playing from “Track
    1” or double-click any track to play that track


    ![image](images/pg119_1.jpg)


    ![image](images/hot.jpg)


    Right-click on a track and choose `Remove` to delete it from the playlist.


    ![image](images/forget.jpg)You can also right-click on a music file icon and choose
    `Open with`, `Rhythmbox` to play it.


    ![image](images/7v.jpg)Select `Radio` in the “Library” pane and double-click one
    of the listed radio stations to start listening


    ![image](images/pg119_2.jpg)


    ![image](images/8v.jpg)Select `Podcasts` in the “Library” pane, then click the
    `Add` button on the toolbar and search for podcasts by topic


    ![image](images/9v.jpg)Double-click on any podcast of interest to start listening


    ![image](images/pg119_3.jpg)


    ![image](images/10v.jpg)Click the `X` button to close the Rhythmbox window, then
    click the **Rhythmbox** icon on the System Tray and click the `X` button in the
    pop-up panel to exit the app


    ![image](images/hot.jpg)


    You can add more radio stations by clicking the `Add` button and entering a URL
    – use a search engine to find URLs for internet radio stations and podcasts.

