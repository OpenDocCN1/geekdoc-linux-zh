- fmt: '

    If you’re feeling brave, and are absolutely certain that the directory contains
    nothing you will miss, you can use the `rm` command with just a `-r` option to
    instantly delete a directory and its entire contents – use with care!


    ## Managing Files


    The shell `mv` command lets you easily move files around your Linux system from
    the command line. This command requires two arguments stating the name of the
    file to be moved, and the destination to which it should be moved. Interestingly,
    the `mv` command can also be used to rename a file by stating its current name
    and a new name as its two arguments.


    ![image](images/pg146_1.jpg)


    If you wish to copy rather than move a file to a new location, the `cp` command
    can be used. This command can accept one or more files to be copied as its arguments,
    stating the destination as the final argument:


    ![image](images/1r.jpg)

    Launch a shell Terminal window, then enter an `ls` command to see the contents
    of the current directory


    ![image](images/2r.jpg)

    Issue an `mv` command to rename an existing file – for example, from “alpha.txt”
    to “zebra.txt” with `mv alpha.txt zebra.txt` – and an `ls` command to confirm
    the name change


    ![image](images/3r.jpg)

    Enter `mv zebra.txt Box` to move the renamed file to a Box sub-directory – and
    an `ls` command to see it’s gone


    ![image](images/4r.jpg)

    Enter `cp some.txt Box` to copy a file named “some.txt” to the same sub-directory


    ![image](images/5r.jpg)

    Issue an `ls` command with the name of the sub-directory – confirming a file was
    moved and a file was copied


    ![image](images/pg146_2.jpg)


    ![image](images/hot.jpg)


    Use the `-i` option with the `mv` command to prompt before overwriting a file
    of the same name.


    The `rm` command can be used to delete one or more files named as its arguments.
    The `*` wildcard can also be used to delete all files in a directory – if you
    are absolutely certain none are needed.


    You can create hard links, pointing to the system address of a file, and soft
    (symbolic) links, storing the path to a file, with the `ln` command. By default,
    this will create a hard link to the file named as its argument – use its `-s`
    option to create a symbolic link.


    ![image](images/snake.jpg)


    The wildcard `*` character means “all” and should be used with caution.


    The `readlink` command can be used to discover the target to which a symbolic
    link is pointing:


    ![image](images/6r.jpg)

    Enter `rm Box/zebra.txt` to delete a file in a sub-directory and an `ls Box` command
    to confirm it’s gone


    ![image](images/7r.jpg)

    Enter `ln Box/some.txt hardlink` to create a hard link named “hardlink” to a file
    in the sub-directory


    ![image](images/8r.jpg)

    Now, enter `ln -s Box/some.txt softlink` command to create a soft link named “softlink”
    to the same file


    ![image](images/9r.jpg)

    Enter an `ls` command to see both links have been created in the home directory


    ![image](images/10r.jpg)

    Enter a `readlink softlink` command to see the target to which the soft link points


    ![image](images/pg147_1.jpg)


    ![image](images/hot.jpg)


    If you delete the target file a hard link will retain a copy of the file’s content,
    but a soft link will simply point to a target that no longer exists.


    ![image](images/forget.jpg)


    You can find more details on shortcut links [here](#chapter04.xhtml_sec30).


    ## Examining File Properties


    The Linux shell provides many commands that can be used to examine attributes
    of any file. The most comprehensive is the `stat` command that lists every important
    attribute of the file stated as its argument.


    ![image](images/pg148_1.jpg)


    If you just want to discover the file size, use the `du` disk usage command with
    its `-b` option to count the number of bytes.


    Use the `wc` word count command to quickly discover how many newlines, words,
    and bytes a text file contains, or assess what type of file it is with the `file`
    command:


    ![image](images/1r.jpg)

    Enter `stat Box/some.txt` to discover the attributes of a file named “some.txt”
    in a Box sub-directory


    ![image](images/2r.jpg)

    Enter `du -b Box/some.txt` to discover the size of this file in byte units


    ![image](images/3r.jpg)

    Enter `wc Box/some.txt` to discover that file’s line count, word count, and byte
    count


    ![image](images/4r.jpg)

    Now, enter `file Box/some.txt` and `file Box/tux.png` commands to discover the
    file type of two files


    ![image](images/pg148_2.jpg)


    ![image](images/hot.jpg)


    Use the `wc` command with its `-m` option to just see a total word count.


    ![image](images/pg148_3.jpg)


    See that here the `wc` command reveals the number of newlines (29), words (175),
    and bytes (1137) of this file.


    The `touch` command introduces some interesting possibilities, as it can create
    an empty file and can change the Last Accessed and Last Modified timestamp attributes
    of a file. Used alone, it simply updates these to the present time, but used with...
    (Wait, the source text cuts off or repeats, I will follow the provided text).


    ![image](images/1r.jpg)

    Enter `stat Box/some.txt` to discover the attributes of a file named “some.txt”
    in a Box sub-directory


    ![image](images/2r.jpg)

    Enter `du -b Box/some.txt` to discover the size of this file in byte units


    ![image](images/3r.jpg)

    Enter `wc Box/some.txt` to discover that file’s line count, word count, and byte
    count


    ![image](images/4r.jpg)

    Now, enter `file Box/some.txt` and `file Box/tux.png` commands to discover the
    file type of two files


    ![image](images/pg148_2.jpg)


    ![image](images/hot.jpg)

    Use the `wc` command with its `-m` option to just see a total word count.


    ![image](images/pg148_3.jpg)

    See that here the `wc` command reveals the number of newlines (29), words (175),
    and bytes (1137) of this file.


    The `touch` command introduces some interesting possibilities, as it can create
    an empty file and can change the Last Accessed and Last Modified timestamp attributes
    of a file. Used alone, it simply updates these to the present time, but used with...
    (Note: The input text had some repetition/overlap at the end, I have processed
    the unique segments provided).


    ## Comparing Files


    The shell provides several ways to compare two files. You can check if two files
    are identical with the `cmp` command. If they are indeed identical, the command
    reports nothing, but if they differ, it reports the location of the first difference.


    ![image](images/pg150_1.jpg)


    Text files can be compared line-by-line with the `comm` command. Its output is
    slightly unusual, as it creates three columns to indicate lines that match in
    each:


    - **Column 1**: lines found in the first file, not the second.

    - **Column 2**: lines found in the second file, not the first.

    - **Column 3**: lines found in both files.


    ![image](images/1r.jpg)

    Use a text editor to create a file named `abc.txt`, with three lines “Alpha”,
    “Bravo”, and “Charlie”, and a file named `acd.txt` with three lines “Alpha”, “Charlie”
    and “Delta” – save the files in the current directory


    ![image](images/2r.jpg)

    Launch a shell Terminal window and enter the command `cmp abc.txt acd.txt` to
    discover where the first difference occurs between these two files


    ![image](images/3r.jpg)

    Enter `comm abc.txt acd.txt` to see a line-by-line comparison


    ![image](images/pg150_2.jpg)


    ![image](images/hot.jpg)

    The `cmp` command can also be used to compare binary files such as images.


    ![image](images/hot.jpg)


    The `comm` command has options to suppress column output – the option `-12` suppresses
    the first two columns to show only lines that are common to both files.


    The `diff` command offers an alternative to the `comm` command for comparison
    of text files. It too compares line-by-line, and it produces a detailed report
    showing any unique lines. It can also be used to compare two directories to reveal
    unique files.


    Files may also be compared using checksum numbers to verify their integrity. Checksum
    numbers are often found on internet download pages so the user can ensure that
    a downloaded file is intact – typically, the checksum is made using the md5 algorithm.


    The `md5sum` command produces a 32-byte checksum for the file specified as its
    argument, and should exactly match that stated by the originator if the file is
    indeed intact.

