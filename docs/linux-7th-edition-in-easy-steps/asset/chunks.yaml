    ## Streaming TV


    ![image](images/pg120_1.jpg)


    Linux Mint includes a streaming app named “Hypnotix” that supports live TV, movies
    and series. The app does not provide content itself but streams content from IPTV
    (Internet Protocol TV) providers. Hypnotix is configured by default with only
    one IPTV provider called “Free-TV”. This provider supplies only free, legal, publicly
    available content, and no adult content:


    ![image](images/1v.jpg)Click **Menu**, **Sound & Video**, **Hypnotix** to launch
    the Hypnotix app


    ![image](images/pg120_2.jpg)


    ![image](images/2v.jpg)Click the **TV Channels** panel to see a selection of streaming
    services, listed with flags denoting their country of origin and the number of
    channels they offer


    ![image](images/pg120_3.jpg)


    ![image](images/3v.jpg)Click on one of the listed services, such as “Redbox USA”,
    to see a scrollable alphabetical list of channels appear alongside a display area


    ![image](images/pg121_1.jpg)


    ![image](images/forget.jpg)


    There are presently no Movies or Series, so those panels are inactive.


    ![image](images/hot.jpg)


    Free-IPTV offers over 2000 legally available TV channels from all over the world.


    ![image](images/4v.jpg)Scroll through the list and click any channel to begin
    streaming its content to the display area


    ![image](images/pg121_2.jpg)


    ![image](images/5v.jpg)Place your cursor over the display area, then use the pop-up
    controls to pause or resume live streaming TV


    ![image](images/pg121_3.jpg)


    ![image](images/hot.jpg)


    Hypnotix is a new app introduced in Linux Mint version 20.


    ![image](images/snake.jpg)


    Your viewing experience depends on your connection speed.


    ![image](images/hot.jpg)


    To add another IPTV provider, click the ![image](images/pg121_4.jpg) button on
    the launch screen, then click **Add a new provider** and enter the URL of an M3U
    playlist. Search online for “Free IPTV M3U Playlist”.


    ## Sharing Content


    ![image](images/pg122_1.jpg)


    You can easily send files to another Linux PC on your local network using the
    Warpinator app. Each computer must be running the Warpinator app in order to be
    detected. Additionally, they must each use the same group code and port number,
    set in the Warpinator app’s Preferences dialog window – by default, the group
    code is “Warpinator” and the port number is 42000.


    ![image](images/1v.jpg)Select **Menu**, **Accessories**, **Warpinator** on a locally
    networked PC to see the app detect another Linux PC


    ![image](images/pg122_2.jpg)


    ![image](images/pg122_3.jpg)


    ![image](images/2v.jpg)Click on the other detected PC to which you want to send
    a file – to switch into a **File Transfers** window


    ![image](images/3v.jpg)Next, browse to the file’s location to select a file, or
