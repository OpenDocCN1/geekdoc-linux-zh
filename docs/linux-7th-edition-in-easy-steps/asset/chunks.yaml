    ## Using Accessories


    ***This chapter describes some of the useful accessory apps included with Linux.***


    ### Writing Text


    The plain text Text Editor app (`xed`) in Linux Mint is the equivalent of the
    Notepad app in Windows – but Text Editor has many more features. It can number
    lines, sort lines into alphanumeric order, and it provides syntax highlighting
    for a whole range of scripting, programming, and markup languages.


    ![image](images/pg126_1.jpg)


    You must recognize, however, that Linux does not treat text line endings in the
    same way as Windows. Linux adds a non-printing line feed (`\n`) (“newline”) character,
    whereas Windows adds non-printing carriage return and line feed (`\r\n`) characters.
    This means that text files created in Linux do not maintain line endings correctly
    when viewed on a Windows system. The Text Editor app provides an option when saving
    text files that lets you choose your preferred type of endings:


    ![image](images/1b.jpg)Click **Menu**, **Accessories**, **Text Editor** to launch
    the app


    ![image](images/2b.jpg)Next, click **Tools**, **Autocheck Spelling** to turn the
    spellchecker on


    ![image](images/3b.jpg)Now, type in some lines of text – see the spellchecker
    place a red underline beneath any suspicious items


    ![image](images/pg126_2.jpg)


    ![image](images/4b.jpg)Click **Edit**, **Preferences**, **Editor**, then slide
    the “Display line numbers” toggle switch to the “On” position – to see the lines
    get numbered


    ![image](images/5b.jpg)Click the **Close** button, click **Edit**, **Select All**
    (or press **Ctrl** + **A**) to select all text, then hit the **Delete** key to
    remove all text


    ![image](images/hot.jpg)


    The Notepad app in versions of the Windows 10 operating system from October 2018
    supports both Linux LF (line feed) line endings, and Windows CRLF (carriage return
    + line feed) line endings.

