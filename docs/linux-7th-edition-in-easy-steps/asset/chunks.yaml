    **Touring the File System**


    ***This chapter describes the Linux file system and explains its directory structure.***


    [**Meeting the Directory Tree**](#chapter04.xhtml_sec26)


    [**Recognizing Directories**](#chapter04.xhtml_sec27)


    [**Navigating with Nemo**](#chapter04.xhtml_sec28)


    [**Handling Files**](#chapter04.xhtml_sec29)


    [**Creating Shortcuts**](#chapter04.xhtml_sec30)


    [**Locating Files**](#chapter04.xhtml_sec31)


    [**Understanding Permissions**](#chapter04.xhtml_sec32)


    [**Summary**](#chapter04.xhtml_sec33)


    **Meeting the Directory Tree**


    ![image](images/pg58_1.jpg)


    When moving from Windows, the new Linux user needs to be aware of some differences
    between the two operating systems:


    •Linux is case-sensitive – Windows is not. For instance, files named “readme.txt”
    and “README.txt” are seen as two different files in Linux, but there is no distinction
    in Windows.


    •Linux directories and files have ownership permissions that can restrict accessibility
    to the owner or group – Windows directories and files are generally universally
    accessible.


    •Linux was developed as a multi-user network operating system – Windows evolved
    from MS-DOS (**M**icro**s**oft **D**isk **O**perating **S**ystem) as a single-user
    home operating system.


    •Linux desktop users cannot change system settings; only the “root” superuser
    may do so – Windows desktop users have free reign to wreak havoc.


    •Linux partitions are created using the Ext4 file system – Windows partitions
    use FAT, FAT32 or NTFS file systems.


    •Linux path names contain forward slash characters – Windows path names contain
    backslash characters: for instance, a Linux path /home/mike and a Windows path
    C:\Users\mike.


    •Linux does not have any drive letters – Windows typically uses C: for the hard
    disk drive, D: for the optical drive, E: for an external drive, and so on.


    ![image](images/hot.jpg)


    See [here](#chapter04.xhtml_sec32) and [here](#chapter10.xhtml_sec83) for more
    on access permissions.


    ![image](images/hot.jpg)


    See [here](#chapter10.xhtml_sec81) for more on the Linux file system.


    The lack of drive letters in Linux indicates what is, probably, the biggest difference
    between Linux and Windows – the way their directory structures are arranged. In
    Linux, everything is contained within a single unified hierarchical system – beginning
    with the “root” directory, symbolized by a single forward slash “/”.


    The Linux installation creates a number of standard sub-directories within the
    root directory. Each one of these, in turn, houses its own sub-directory structure,
    thereby creating a directory “tree” – the “root” directory of / is the root of
    the tree.


    Contents of peripheral drives appear in the tree in the directory at which they
    are “mounted” by Linux, creating a unified structure. The table below lists the
    directory structure of the Linux Mint file system. All are sub-directories of
    the basic root directory “/”.


