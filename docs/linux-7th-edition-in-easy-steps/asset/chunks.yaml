    [**Creating Visualizations**](#chapter06.xhtml_sec45)


    [**Running Macros**](#chapter06.xhtml_sec46)


    [**Adding Interaction**](#chapter06.xhtml_sec47)


    [**Handling Data**](#chapter06.xhtml_sec48)


    [**Summary**](#chapter06.xhtml_sec49)


    **Creating Documents**


    The LibreOffice suite that is included with most Linux distros contains a set
    of office tools similar to those in Microsoft Office: word processor, spreadsheet,
    and presentation programs, together with a program to create charts, graphs and
    diagrams, and a database app. If you are familiar with Microsoft Office you will
    feel instantly at home with the LibreOffice equivalents.


    ![image](images/pg90_1.jpg)


    Most importantly, LibreOffice contains file filters that allow it to work with
    standard Microsoft Office documents from Word, Excel and PowerPoint. Files can
    be saved in Microsoft Office file formats, as well as formats native to LibreOffice,
    and objects (OLE objects, plugins, video, applets, charts) can be embedded within
    a document in much the same way as in Microsoft Word:


    ![image](images/1bl.jpg)Click **Menu**, **Office**, **LibreOffice Writer** to
    launch a word processor with a new blank document open


    ![image](images/pg90_2.jpg)


    ![image](images/2bl.jpg)Type some content in the new document


    ![image](images/pg90_3.jpg)


    ![image](images/hot.jpg)


    LibreOffice is forked from OpenOffice, which was based on original code from the
    StarOffice application by Sun MicroSystems. Sun made the code freely available
    for development by the open-source community – so LibreOffice has no proprietary
    ties.


    ![image](images/hot.jpg)


    There are versions of LibreOffice for Linux, Mac and Windows – all available for
    free download at [libreoffice.org](http://www.libreoffice.org)


    ![image](images/3bl.jpg)Click the **Edit**, **Select All** menu item (or press
    **Ctrl** + **A**) to select all content, then choose a font from this drop-down
    list on the toolbar


    ![image](images/pg91_1.jpg)


    ![image](images/hot.jpg)


    The Writer interface shown here contains the **Standard** toolbar and **Formatting**
    toolbar.


    ![image](images/4bl.jpg)Select the heading text then use these toolbar buttons
    to modify the font height, font weight and font color


    ![image](images/5bl.jpg)Click the **Insert**, **Image** menu item to launch an
    “Insert Image” dialog, then choose an image file to add to the document at the
    current cursor position


    ![image](images/6bl.jpg)Click on the image and drag it to position it over the
    text body, then drop it to see the text automatically wrap around


    ![image](images/pg91_2.jpg)


    ![image](images/hot.jpg)


    Notice that an **Image** toolbar automatically replaces the Formatting toolbar
    when an image is selected. Double-click the image to open an “Image” dialog where
    you can adjust the **Wrap** spacing, and much more.


    ![image](images/7bl.jpg)Click **File**, **Properties** to open a “Properties”
    dialog where you can add a document description and security options


    **Exporting Documents**


    ![image](images/pg92_1.jpg)


    When saving documents from the LibreOffice word processor, the default file format
    used is the ODF (**O**pen **D**ocument **F**ormat) Text format (.odt). Many alternative
    file formats are available, however, so your documents can be made compatible
    with Microsoft Office:


    ![image](images/1bl.jpg)Click **File**, **Save** (or press **Ctrl** + **S**) to
    launch the “Save” dialog, then type a document name in the **Name** field


    ![image](images/2bl.jpg)Click the arrowed file type button to open a list of possible
    formats in which to save the document – choose the format **Word 2007-365 (.docx)**


    ![image](images/3bl.jpg)Choose a location at which to save the document, such
    as your Documents folder, then click the **Save** button


    ![image](images/pg92_2.jpg)


    ![image](images/4bl.jpg)If a “Confirm File Format” dialog appears, click the button
    to confirm you wish to save using the .docx file format – the file is then saved
    at the chosen location


    ![image](images/pg92_3.jpg)


    ![image](images/hot.jpg)


    In the **Save** dialog you don’t need to include a file extension in the Name
    field – it gets added automatically.'
