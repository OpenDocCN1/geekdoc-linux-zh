    ![image](images/pg65_5.jpg)


    **Handling Files**


    ![image](images/pg66_1.jpg)


    All data files you create in Linux should only be saved in your home directory,
    or a sub-directory (“folder”). They can be revisited at any time using the Nemo
    file browser and can be easily copied, moved, renamed, or deleted:


    ![image](images/1p.jpg)Click on **Menu**, **Accessories**, **Text Editor** to
    launch a plain text editor, then type in some text and click ![image](images/pg66_2.jpg)
    the Save button on the toolbar (or click the File, Save menu)


    ![image](images/2p.jpg)In the “Save As” dialog, double-click your **Documents**
    folder to open it, then type a name for the text document (say, sample.txt) and
    click the ![image](images/pg66_2.jpg) Save button


    ![image](images/3p.jpg)Launch the Nemo file browser, then open the **Documents**
    folder that is located in your home directory and find the saved text file


    ![image](images/4p.jpg)Right-click on the file’s icon and choose **Copy** from
    the context menu – to copy that file to the “clipboard”


    ![image](images/pg66_4.jpg)


    ![image](images/5p.jpg)Next, right-click on the **Public** folder within your
    home directory, then choose **Paste Into Folder** from the context menu – to deposit
    a copy of the file


    ![image](images/forget.jpg)


    The **clipboard** is a memory buffer provided by the operating system and is used
    for short-term data transfer.


    ![image](images/hot.jpg)


    Directories may contain hidden files – click the **View**, **Show Hidden Files**
    menu in the Nemo file browser to also show hidden files.


    ![image](images/6p.jpg)Open the Public folder, then right-click on the copied
    file and choose **Rename** from the context menu to see the file name get highlighted
    – ready to be changed


    ![image](images/pg67_1.jpg)


    ![image](images/7p.jpg)Now, type a new file name (“copy”, for instance), then
    hit **Return** to rename the file as copy.txt – the file extension .txt remains


    ![image](images/8p.jpg)Right-click on the renamed file and choose **Cut** from
    the context menu


    ![image](images/9p.jpg)Navigate back into the Documents folder, then right-click
    on the file browser window and choose **Paste** from the context menu – depositing
    the renamed file


    ![image](images/10p.jpg)Drag the mouse pointer across both files, then right-click
    and choose **Move to Trash** to delete the files


    ![image](images/pg67_2.jpg)


    ![image](images/pg67_3.jpg)


    ![image](images/hot.jpg)


    You can right-click in the file browser and choose **Create New Folder** from
    the context menu to add a new directory – but remember that this should be within
    your home directory hierarchy.


    ![image](images/hot.jpg)


    To recover a trashed file, click the **Trash** icon on the file browser’s sidebar
    (or the one on the Desktop), right-click the file icon, then choose the **Restore**
    option from the context menu.


    **Creating Shortcuts**


    ![image](images/pg68_1.jpg)


    It is often convenient to create Desktop shortcuts to the apps and files you access
    most frequently. Shortcuts for apps can be created from options on the Menu, or
    from the Desktop context menu. Shortcuts for files can be created as links using
    the file browser:


    ![image](images/1p.jpg)Right-click an app icon on the Menu, then click the **Add
    to desktop** option to place a shortcut on the Desktop


    ![image](images/pg68_2.jpg)


    ![image](images/pg68_3.jpg)


    ![image](images/2p.jpg)Right-click anywhere on the Desktop, then choose **Create
    a new launcher here** from the context menu – to open a “Launcher Properties”
    dialog box


    ![image](images/3p.jpg)Enter a shortcut Name, then click the **Browse** button
    to open a “Choose a command” dialog


    ![image](images/4p.jpg)Navigate to the /usr/bin directory and select the app for
    which you want to create a shortcut – to add its path in the Command field


    ![image](images/pg68_4.jpg)


    ![image](images/pg68_5.jpg)


    ![image](images/5p.jpg)Click the icon button to open a “Choose an icon” dialog


    ![image](images/hot.jpg)


    A shortcut or a link can be deleted in the same way as a file – select its icon
    then hit the **Delete** key. Alternatively, right-click on the icon then choose
    **Delete** or choose **Move to Trash**.


    ![image](images/forget.jpg)


    The /**usr** directory contains sub-directories storing programs that can be run
    by any user.


    ![image](images/6p.jpg)Next, enter **gnome-character-map** in the Search box,
    then choose an appropriate shortcut icon in the right pane


    ![image](images/pg69_1.jpg)


    ![image](images/7p.jpg)Click the **Select** button to close the dialog and see
    the icon appear in the “Launcher Properties” dialog


    ![image](images/8p.jpg)Click the **OK** button to place a shortcut on the Desktop


    ![image](images/pg69_2.jpg)


    ![image](images/pg69_3.jpg)


    ![image](images/9p.jpg)Open the file browser in your home Documents directory,
    then right-click on a text file and choose the **Edit**, **Make Link** menu –
    a shortcut icon now appears in that directory and has an arrow denoting it to
    be a link


    ![image](images/pg69_4.jpg)


    ![image](images/10p.jpg)Drag the link icon from the file browser and drop it onto
    the Desktop to create a shortcut that can be clicked to launch a Text Editor displaying
    the target file


    ![image](images/pg69_5.jpg)


    ![image](images/forget.jpg)


    If a selected icon does not appear in the **Launcher Properties** dialog it will
    not appear on the shortcut – a default icon will appear.


    ![image](images/snake.jpg)


    Care must be taken to maintain links, as changes to the target file, such as renaming
    or moving it, will leave the links “orphaned” – no longer pointing correctly at
    the target file.


    **Locating Files**


    It is important to recognize that many directories in Linux contain hidden sub-directories
    and hidden files containing configuration data. These are like the “System” files
    that are hidden by default in the Windows operating system. In Linux, the name
    of each hidden directory and file always begins with a dot.


    ![image](images/pg70_1.jpg)


    ![image](images/pg70_2.jpg)


    ![image](images/1p.jpg)Open the file browser in your home directory


    ![image](images/2p.jpg)Now, click **View**, **Show Hidden Files** to see all contents


    ![image](images/pg70_3.jpg)


    ![image](images/hot.jpg)


    Right-click on the file browser window then select **Arrange Items** from the
    context menu to choose how you would like the contents arranged.


    ![image](images/pg70_4.jpg)


    The easiest way to find a file on your system is with the “Search” box in the
    Nemo file browser. You can find all files of a particular file type by entering
    a file extension into the Search box. For example, enter txt to find all files
    with a “.txt” file extension.


    Conversely, you can find all files of a known name regardless of the file extension
    by entering a name into the Search box. The file browser begins searching as soon
    as you enter three characters into the Search box, so you don’t need to know the
    full name, and the letters need not be the first three letters of the name – just
    three consecutive letters within the name. You can substitute the * wildcard character
    for unknown letters too. The search is not case-sensitive, so the results will
    include uppercase and lowercase matches to the name (or part-name) that you enter:


    ![image](images/1p.jpg)Open the file browser in your home directory


