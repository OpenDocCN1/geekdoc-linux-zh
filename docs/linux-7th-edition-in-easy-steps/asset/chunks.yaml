    ## Manipulating Text Content


    ![image](images/pg158_1.jpg)


    The shell `cut` and `paste` commands may not be what you expect. They work with
    text arranged in columns, delimited by an invisible tab character. Each column
    of text is known as a “field” and the `cut` command can specify which field to
    display – for instance, the option `-f3` chooses the third column from the left.
    The `paste` command is the opposite of the `cut` command, combining columns from
    multiple files for display horizontally:


    ![image](images/1r.jpg)Use `vi` to create two text files `nums.txt` and `vegs.txt`,
    each with two columns of text separated by tab characters


    ![image](images/2r.jpg)Enter `cat nums.txt vegs.txt` to display the file contents
    vertically, one above the other


    ![image](images/3r.jpg)Now, enter `paste nums.txt vegs.txt` to display the file
    contents horizontally, side-by-side


    ![image](images/4r.jpg)Enter `cut -f2 vegs.txt` to just display the contents from
    the second column of one file


    ![image](images/pg158_3.jpg)


    Simple text transformations can easily be made by piping a text stream to the
    `tr` command. This requires two arguments to specify what to change, and how it
    should be changed. For instance, the command `tr a “*” changes all occurrences
    of the letter “a”, replacing each one with an asterisk on standard output.


    ![image](images/hot.jpg)


    Use a `-T` option with the `cat` command to display the invisible tab characters
    as “^I” on standard output.


    ![image](images/pg158_2.jpg)


    ![image](images/forget.jpg)


    Multiple fields can be specified as a commaseparated list, like `-f1,3` or as
    a range such as `-f2-4`.


    Typically, the `tr` command is used to transform capitalization on output. The
    `sort` command is often used at the end of a pipeline to display lines of text
    sorted alphabetically. It can also be used to order lines numerically if a `-n`
    option is used. The `tee` command is useful in a pipeline that ends with a sort
    instruction to write the text stream as a file before sorting. The file name is
    specified by the argument to the `tee` command and the file is created in the
    current directory:


    ![image](images/5r.jpg)Enter `cat quote3.txt ; \ cat quote3.txt | tr “a-z” “A-Z”`
    to display the contents of a file named “quote1.txt” – both in its original format
    and after transformation to uppercase


    ![image](images/6r.jpg)Enter `cut -f2 vegs.txt | sort` to just display the contents
    of a second column, sorted alphabetically


    ![image](images/7r.jpg)Now, enter `cut -f2 vegs.txt \ | tee vegs-column2.txt |
    sort` to save a second column as a text file before displaying it sorted alphabetically
    on standard output


    ![image](images/8r.jpg)Finally, enter `cat vegs-column2.txt` to display the file


    ![image](images/pg159_1.jpg)


    ![image](images/snake.jpg)


    Remember that the sequence of characters specified to the `tr` command must be
    enclosed in quotes.


    ![image](images/hot.jpg)


    Use a `-a` option with the `tee` command to append text to a file, rather than
    overwriting previous text.


    ## Matching Text Patterns


    ![image](images/pg160_1.jpg)


    The `grep` command is one of the most useful of all commands. It has many possible
    options, but its purpose is simply to display all lines from a text file that
    contain a specified string or pattern. A `grep` command can specify a string to
    seek as its first argument, and a file name in which to search as its second argument:


    ![image](images/1r.jpg)At a shell prompt, enter `grep sword ballad.txt` to display
    all lines in this text file that contain the word “sword”


    ![image](images/pg160_2.jpg)


    Notice that the output above has two duplicate lines. The `sort` command can be
    used to reorder lines – to make duplicate lines appear in succession – and duplicated
    successive lines can be removed with the `uniq` command. Output from the `grep`
    command can be piped to a `sort` command to make the duplicate lines successive,
    then piped to `uniq` so only unique lines remain:


    ![image](images/2r.jpg)Enter `grep sword ballad.txt \ | sort | uniq` to display
    all unique lines in this text file that contain the word “sword”


    ![image](images/pg160_2.jpg)


    The `look` command is useful to quickly output all lines of text from a file that
    begin with a specified prefix. It can accept a `-d` option to only seek to match
    alphanumeric characters.


    ![image](images/hot.jpg)


    The `grep` command can also match regular expressions. For instance, `grep [Y]
    ballad.txt` would output all lines that have an uppercase Y. See the `grep` man
    page for more on regular expressions.


    ![image](images/3r.jpg)Enter `look -d Y ballad.txt` to see a list of lines beginning
    with the letter “Y” from this file, ignoring spaces and tabs


    ![image](images/pg161_1.jpg)


    ![image](images/hot.jpg)


    You can also use the `look` command with a string argument to see a list of words
    starting with that string – taken from an editable dictionary file that is normally
    located at `/usr/share/dict/words`.


    The `aspell` program is a powerful spellchecker that has a `-c` option that lets
    you interactively check a file for spelling errors. This highlights possible errors
    and suggests alternatives that you can choose to replace or ignore each highlighted
    word in turn:


    ![image](images/4r.jpg)Enter `aspell -c ballad.txt` to begin the spellchecker
    for this text file


    ![image](images/5r.jpg)Type the number against a suggested replacement to immediately
    replace the highlighted word with it


    ![image](images/pg161_2.jpg)


    ![image](images/forget.jpg)


    Press the `I` key to ignore a word, the `R` key to type your own replacement,
    or the `X` key to exit the `aspell` spellchecker.


    ## Summary


    - The `whoami` command reveals the user name, `hostname` reveals the host PC name,
    `clear` empties the shell window, and `exit` terminates the shell session.

    - The `pwd` command reveals the current working directory, the directory location
    can be changed with `cd`.

    - The `~` tilde character is an alias for the home directory and any directory’s
    content can be revealed by `ls`.

    - The `basename` command returns the last part of an address, whereas `dirname`
    command returns just the first part.

    - New directories are created with `mkdir`, and empty directories can be removed
    by `rmdir`.

    - Files are moved or renamed with `mv`, copied with `cp`, and removed with `rm`.

    - The `ln` command is used to create hard links and soft links, but `readlink`
    command can only be used with soft links.

    - The `stat` command lists all file properties, `du` reports the file size, and
    the `file` command reports the file type.

    - Timestamps of a file can be modified by the `touch` command, and `wc` command
    can be used to report the word count.

    - Files can be compared with `cmp`, `comm`, and `diff` commands, and checksums
    generated by `cksum` and `md5` commands.

    - The `find` command locates a file, `grep` locates a string within a file, and
    `look` locates lines beginning with a given letter.

    - Files can be viewed using the `cat` command, lines numbered with `nl`, and spelling
    checked by `aspell` command.

    - The `head` command displays the first 10 lines of a file, whereas `tail` command
    displays its final 10 lines.

    - The `vi` editor can be used to create text files and individual text columns
    manipulated by the `cut` and `paste` commands.

    - A shell pipeline directs output to be used as input for another command and
    can include `tee` to write a file, `tr` to transform the output, and `sort` to
    order the output alphanumerically.

