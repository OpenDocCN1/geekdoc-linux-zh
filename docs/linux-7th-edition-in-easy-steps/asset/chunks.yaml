    Notice that when you click on a folder icon, information about its contents appears
    at the bottom of the window – see how many folders are empty.


    ![image](images/hot.jpg)


    You can click these buttons to change the sidebar view and to show/hide the sidebar.


    ![image](images/4p.jpg)Click any directory folder to explore the system’s standard
    sub-directories


    ![image](images/5p.jpg)Click the ![image](images/pg64_4.jpg) back button above
    the sidebar to go to the previously-visited location


    ![image](images/hot.jpg)


    If you cannot see the sidebar when you open Nemo, hit the F9 key to show the sidebar.


    You can navigate through the file system with Nemo by clicking on a folder or
    by clicking on a location in the sidebar. Also, you can click the ![image](images/pg65_1.jpg)
    button on the toolbar to open a location field, then type in a directory address
    and hit the **Enter** key.


    ![image](images/6p.jpg)Click the folder icon of the /home directory (“home”) –
    there will be a folder there bearing your username


    ![image](images/7p.jpg)Click on the folder bearing your username to see the contents
    of your home directory


    ![image](images/pg65_2.jpg)


    ![image](images/hot.jpg)


    Notice that Nemo displays the name of the currently-displayed directory on its
    title bar.


    ![image](images/hot.jpg)


    You can click these buttons to change how the folders are viewed.


    ![image](images/hot.jpg)


    You can drag this slider to adjust the zoom level.'
