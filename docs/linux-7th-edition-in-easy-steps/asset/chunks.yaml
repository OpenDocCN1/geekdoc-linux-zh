    ## Becoming the Superuser


    A regular user can call upon many shell commands, but some are only available
    to a privileged “superuser”. These restricted commands typically perform system
    administration functions to which regular users should not be allowed instant
    access.


    ![image](images/pg164_1.jpg)


    On a typical home Linux system, the default user created during installation is
    given access to the `sudo` command, which allows commands to be executed as if
    the regular user is the superuser.


    The `sudo` command is most often needed where you receive a “Permission denied”
    message when attempting to perform an operation. Prefixing the previous command
    with the `sudo` command effectively grants the required permission. If the previous
    command was lengthy, you can simply issue a `sudo !!` command to run it again
    with the required `sudo` prefix:


    ![image](images/1g.jpg)At a shell prompt, enter `parted /dev/sda` to attempt to
    launch the partition editor for the hard-drive device


    ![image](images/2g.jpg)As the shell informs you that you are not the superuser,
    type `c` then hit `Return` to cancel the attempt


    ![image](images/pg164_2.jpg)


    ![image](images/3g.jpg)Now, enter `sudo parted /dev/sda` (or just enter `sudo
    !!`) to launch the partition editor successfully


    ![image](images/4g.jpg)At the (parted) prompt, enter a print command to list the
    partition information for the hard drive


    ![image](images/5g.jpg)Now, enter a help command to see the available operations
    that may be performed, or enter a quit command to exit the partition editor


    ![image](images/pg165_1.jpg)


    ![image](images/hot.jpg)


    Storage devices (“sd”) on your system are labeled alphabetically, so the first
    device on your system is labeled `sda`.


    ![image](images/snake.jpg)


    The root superuser can access any file or program on the system – with the potential
    to wreak havoc! Only log in as the root superuser if it’s absolutely essential.


    To assume superuser status in order to perform system administration, the `sudo`
    command can be used together with the `su` (switch user) command. This makes you
    the “root” user, with system-wide access, whose home directory is the `/root`
    directory:


    ![image](images/6g.jpg)Issue the `sudo su` command, then enter your regular user
    password to assume superuser status


    ![image](images/7g.jpg)Enter `cd ~ ; pwd` to navigate to the root superuser’s
    home directory and display its location


    ![image](images/8g.jpg)Log out from the root superuser account by entering the
    `exit` command – to resume regular user status back in the user’s home directory


    ![image](images/pg165_2.jpg)


    ![image](images/forget.jpg)


    For security, the shell displays no characters for password entries.


    ## Installing Packages


    The Advanced Packaging Tool (APT) is a command-line tool that automates the process
    of retrieving, configuring, and installing software packages. It relies upon online
    repositories to locate software and resolve dependencies – so that the installation
    package will include any libraries required by the application. Unsurprisingly,
    as package installation modifies your system, all `APT` commands must be run using
    `sudo` for superuser privileges.


    ![image](images/pg166_1.jpg)


    The APT’s `apt-get` command has several options with which to manage packages.
    It’s useful to first execute an `apt-get update` command to update the list of
    available repository packages, before issuing an `apt-get install package-name`
    command.


    Once installed, a package can be upgraded to the latest version with an `apt-get
    upgrade package-name` command.


    After a package has been installed it can be removed later using an `apt-get remove
    package-name` command – but this retains the configuration files for that package.
    For complete removal of a package and its configuration files, you can instead
    use the command `apt-get --purge remove package-name`.


    ![image](images/1g.jpg)Enter the `sudo apt-get update` command to ensure the package
    list is up-to-date


    ![image](images/2g.jpg)Now, issue a command to install a package – for example,
    enter `sudo apt-get install gnome-mahjongg` (note gg ending) to install a graphical
    tiles game package


    ![image](images/pg166_2.jpg)


    ![image](images/3g.jpg)Some packages request confirmation before installation
    that requires you to type `Y` and hit `Return` if you are happy to proceed, or
    enter `N` to cancel the installation


    ![image](images/pg167_1.jpg)


    ![image](images/hot.jpg)


    Use `apt-cache search package-name` to locate an installed or available package.


    ![image](images/hot.jpg)


    Use `man apt-get` to see the full range of options.


    After the packages are retrieved, unpacked and set up, the installation is complete
    and the application is ready to run:


    ![image](images/4g.jpg)Check the Menu to see that a new Games category containing
    a launch icon has been added for the newly-installed package – click **Games**,
    **Mahjongg** to play


    ![image](images/pg167_2.jpg)


    ![image](images/pg167_3.jpg)


    ![image](images/hot.jpg)


    The Synaptic Package Manager is a user-friendly graphical interface for the Advanced
    Packaging Tool (APT) – in Linux Mint, click **Menu**, **Administration**, **Synaptic
    Package Manager** to launch the app.


    ## Handling Archives


    ![image](images/pg168_1.jpg)


    The traditional file compression tool in Linux uses the `gzip` command to compact
    one or more files into a single archive – adding a `.gz” file extension and replacing
    the original files. Its companion `gunzip` command can be used to extract files
    from an archive created with `gzip` – replacing the compressed archive:


    ![image](images/1g.jpg)Enter `du -b ele*` to learn the byte size of local files
    whose names begin “ele” – in this case, it’s one elegy.txt


    ![image](images/2g.jpg)Next, enter `gzip elegy.txt` to create a compressed archive
    of that file – named with an added “.gz” file extension


    ![image](images/3g.jpg)Now, use a further `du -b ele*` to compare the file size
    of the compressed `gzip` archive to the original file


    ![image](images/4g.jpg)Enter `gunzip elegy.txt.gz` to extract the original file


    ![image](images/pg168_2.jpg)


    The modern `bzip2` compression tool gets better compression than `gzip` but is
    less widely used – distributing `bzip2` archives may not find universal acceptance.
    It works like the `gzip` tool, but adds a `.bz2` file extension and has a companion
    `bunzip` uncompressor:


    ![image](images/5g.jpg)Enter `du -b ele*` to learn the byte size of local files
    whose names begin “ele” – in this case, it’s one elegy.txt


    ![image](images/6g.jpg)Next, enter `bzip2 elegy.txt` to create a compressed archive
    of that file – named with an added “.bz2” file extension


    ![image](images/7g.jpg)Now, use a further `du -b ele*` to compare the file size
    of the compressed `bzip2` archive to the original file


    ![image](images/forget.jpg)


    A `bzip2` archive file size is smaller than `gzip` and `zip` archives – notice
    the size of the archives in these examples.


    ![image](images/8g.jpg)Enter `bunzip2 elegy.txt.bz2` to extract the original file
    – being sure to include the added “.bz2” file extension


    ![image](images/pg169_1.jpg)


    Compressed archives created in Windows systems invariably use the zip compression
    format. In Linux systems their contents can be extracted by the `unzip` command
    and archives created for distribution to Windows users with the `zip` command.
    The `unzip` command does not delete the archive file after extraction:

