    \ the Public folder, then right-click on the copied file and choose **Rename**\
    \ from the context menu to see the file name get highlighted – ready to be changed\n\
    \n![image](images/pg67_1.jpg)\n\n![image](images/7p.jpg)Now, type a new file name\
    \ (“copy”, for instance), then hit **Return** to rename the file as `copy.txt`\
    \ – the file extension `.txt` remains\n\n![image](images/8p.jpg)Right-click on\
    \ the renamed file and choose **Cut** from the context menu\n\n![image](images/9p.jpg)Navigate\
    \ back into the Documents folder, then right-click on the file browser window\
