    ![image](images/forget.jpg)


    The **Advanced Mode** provides additional buttons that perform math functions,
    such as logarithm (**log**).


    ![image](images/4b.jpg)Select “Financial Mode” from the title bar menu, then select
    options to approximately convert a sum of currency


    ![image](images/pg129_1.jpg)


