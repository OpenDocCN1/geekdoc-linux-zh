    window and fullscreen views


    ![image](images/17.jpg)


    ![image](images/hot.jpg)


    You can click the hamburger button and choose `Toggle Controls` to hide or show
    the controls.


    ## Playing Music


    ![image](images/pg118_1.jpg)


    The Rhythmbox player is great for playing music files and is also a podcast aggregator
    – an internet radio tuner:


