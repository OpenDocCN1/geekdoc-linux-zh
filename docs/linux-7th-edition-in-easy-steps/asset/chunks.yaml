    ## 处理文件


    ![image](img/pg66_1.jpg)


    你在 Linux 中创建的所有数据文件都应该只保存在你的主目录或子目录（“文件夹”）中。你可以随时使用 Nemo 文件浏览器访问这些文件，并轻松地进行复制、移动、重命名或删除：


