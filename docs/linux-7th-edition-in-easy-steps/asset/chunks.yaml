    ## Summary


    - `LibreOffice` contains a set of office tools similar to those in the Microsoft
    Office suite.

    - Files can be saved in `Microsoft Office file formats` and file formats native
    to LibreOffice apps.

    - `LibreOffice` `Writer` is a word processor app for documents that can contain
    text and embedded objects.

    - `LibreOffice Writer` has built-in support for the `Portable Document Format
    (PDF)`.

    - `LibreOffice` `Calc` is a spreadsheet app that can perform calculations on data
    entries using given formulas.

    - `LibreOffice Calc` provides a `Format Cells` facility to specify how cell content
    should appear.

    - `LibreOffice` `Impress` is a presentation app that can produce slideshows.

    - `LibreOffice Impress` provides a number of standard `Templates` and offers many
    standard `Layouts`.

    - `LibreOffice` `Draw` is a drawing app that can create illustrations, charts,
    diagrams, and graphs.

    - `LibreOffice Draw` provides a `Chart Type` facility that provides many standard
    charts.

    - A `macro` is a recorded sequence of keystrokes that can be replayed to repeat
    those keystrokes.

    - `LibreOffice` apps can add `form controls` to a document for interaction with
    the user.

    - `LibreOffice` `Base` is a database app that can store data and retrieve specific
    items of data.

    - `LibreOffice Base` provides wizards that can create `Tables` and perform `Queries`
    in a database.


