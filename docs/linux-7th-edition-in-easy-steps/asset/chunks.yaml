    ![image](images/9g.jpg)Enter `zip elegy.zip elegy.txt` to specify the archive
    name and the file it should contain in compressed form


    ![image](images/10g.jpg)Issue another `du -b ele*` command to compare file sizes,
    then enter `unzip elegy.zip` to extract the archive contents


    ![image](images/11g.jpg)When asked, choose the “r” option, then rename the extracted
    file elegy.unzipped – to differ from the original


    ![image](images/pg169_2.jpg)


    ![image](images/snake.jpg)


    The `zip` command requires the archive name as its first argument, followed by
    a list of files to be included in that archive.


    ![image](images/hot.jpg)


    Use a `-c` option with `gunzip`, `bunzip2`, or `unzip` commands to display the
    content of compressed text files on standard output.


    ## Examining File Systems


    ![image](images/pg170_1.jpg)


    A Linux system may span multiple hard disk drives and extend across many disk
    partitions. Each partition is represented by a special file in the `/dev` directory
    – typically, `/dev/sda1` may represent the first partition on your master hard
    disk drive. During installation of the Linux operating system, each partition
    is formatted as a persistent storage “file system” on the hard drive in which
    files can be stored and recalled. Similarly, media drives are formatted with their
    own file systems in which to store data. Media drives must be “mounted” onto the
    Linux file tree in order to make them accessible, and this can be achieved automatically:


    ![image](images/1g.jpg)Click `Menu`, `Accessories`, `Files` – to open the “Nemo”
    file manager


    ![image](images/2g.jpg)In Nemo, click `Edit, Preferences, Behavior`, then scroll
    down to the “Media Handling” category


    ![image](images/pg170_2.jpg)


    ![image](images/3g.jpg)Now, ensure that the option to “Automatically mount removable
    media when inserted and on startup” is selected


    ![image](images/4g.jpg)Click the `Close` button to confirm the selection and to
    close the “File Management Preferences” dialog


    The `df` disk free command shows how file systems are being used by indicating
    free space. It has a `-h` option to make the output more understandable and a
    `-T` option to display file system types:


    ![image](images/5g.jpg)Insert a flash drive into a USB port on your device


    ![image](images/6g.jpg)Open a `Terminal` window, then enter the command `df -hT`
    to discover how the file system currently appears


    ![image](images/pg171_1.jpg)


    ![image](images/snake.jpg)


    The `df -T` option (uppercase) will display file system types, whereas the `df
    -t` option (lowercase) specifies which file system types to list.


    ![image](images/pg171_2.jpg)


    See that there are many items of the “tmpfs” type, but these are merely temporary
    file system storage facilities in volatile memory. Only the highlighted items
    identify persistent storage devices.


    Here, the hard drive file systems on `/dev/sda1` and `/dev/sda2` were automatically
    mounted onto the Linux file tree during the boot process, and the media drive
    file system on `/dev/sdb1` was automatically mounted when the flash drive was
    inserted into the device port. A file system can be manually unmounted using the
    `umount` command to perform maintenance on it without fear of file corruption.
    For instance, the root superuser can run the `fsck` file system check command
    to check for integrity and errors:


    ![image](images/7g.jpg)Enter `umount /dev/sdb1` to unmount the file system on
    the USB flash drive


    ![image](images/8g.jpg)Now, issue the command `sudo fsck /dev/sdb1` to check the
    USB flash drive file system for errors


    ![image](images/9g.jpg)When the check completes, remove the flash drive from the
    USB port – reinsert it into the port to mount it again


    ![image](images/pg171_3.jpg)


    ![image](images/forget.jpg)


    The `fsck` command uses the same file system checker that is used during the boot
    process prior to the mount procedures – it should not be used on mounted devices.


    ## Working with Accounts


    ![image](images/pg172_1.jpg)


    User accounts are administered by the superuser. The `useradd` command will create
    a new user of a specified name, the `usermod` command can modify a specified user,
    and the `userdel` command can delete a specified user. A user’s login password
    can be changed by the `passwd` command. The user’s full name can be changed by
    the `chfn` command, and their default shell program can be changed by the `chsh`
    command. Each user may employ these to change their own details, or the superuser
    can change the user’s details. The `pinky -l` command will show the details of
    any specified user:


    ![image](images/1g.jpg)Enter the command `sudo useradd tony` and your regular
    user password – to create a new user named “tony”


    ![image](images/2g.jpg)Next, enter the command `sudo usermod -l toni tony` to
    rename the user named “tony” to “toni”, then enter the command `sudo passwd toni`
    and set a login password


    ![image](images/3g.jpg)Issue the command `sudo chfn toni` and enter the full name
    of this user, then issue the command `sudo chsh toni` and enter `/bin/bash` to
    set the bash program as the default


    ![image](images/4g.jpg)Enter the command `pinky -l` to see this details


    ![image](images/pg172_2.jpg)


    ![image](images/snake.jpg)Never change any aspect of `usermod` also note that
    `pinky` are lowercase.


    ![image](images/forget.jpg)The user’s personal details are typically more extensive
    than the brief details. A “group” is a set of user accounts whose rights can be
    modified simultaneously by the superuser. For example, a group may be granted
    access. Any user can discover which groups they belong to with the `groups` command
    and can specify a username to reveal the group membership of one particular user.
    The superuser can employ `groupadd` command to specify the name of a new group,
    or `groupmod -n` to change the name of an existing group, or `groupdel` to delete
    a specified group. The superuser can also add a user to an existing group with
    the `usermod -G` command – stating the group name and username as arguments:


    ![image](images/5g.jpg)Enter the command `groups toni` to discover that this user
    is only a member of a group named “tony” – added when the user account was created


    ![image](images/6g.jpg)Enter the command `sudo groupmod -n toni tony` to change
    the group name to match the modified username


    ![image](images/7g.jpg)Enter `sudo groupadd fund` to create a new group named
    “fund”, then enter `sudo usermod -G fund toni` to make the user a member of the
    new group


    ![image](images/8g.jpg)Issue the command `groups toni` once more to see all groups
    of which this user is now member


    ![image](images/pg173_1.jpg)


    ![image](images/hot.jpg)


    Group information is typically stored in a file at `/etc/group` that lists all
    group names, together with a comma-separated list of users belonging to each group.


    ## Setting Access Permissions


    ![image](images/pg174_1.jpg)


    The `ls -l` long listing command reveals the access permissions of each item in
    the current directory as a string of 10 characters at the start of each line.
    The first is a `d` for a directory, or a dash for a file, followed by sequential
    Read (`r`), Write (`w`) and Execute (`x`) permissions for the owning User, Group,
    and Others. In the listing below, a script may be Read and Executed by everyone
    and the owner may also Write to it. The owner can both Read and Write a text note
    but others may only Read it.. The owner can both Read and Write a text note but
    others may only Read it. Three other text files may be Read or Written to only
    by their respective owners.


    ![image](images/pg174_2.jpg)


    Each set of permissions can also be described numerically where Read = 4, Write
    = 2, and Execute = 1\. For instance, a value of 7 describes full permissions to
    Read, Write and Execute (4 + 2 + 1), 6 describes permissions to Read, Write (4
    + 2), and so on.

