    button (`PrtSc`) to immediately capture an image of your screen or use the `Alt`
    + `PrtSc` key combination to immediately capture the currently-active window.
    Additionally, Linux Mint includes a `Screenshot` app that provides delay and other
    options – much like the Snipping Tool app in Windows:


    ![image](images/1b.jpg)Click `Menu`, `Accessories`, `Screenshot` to launch the
    app


