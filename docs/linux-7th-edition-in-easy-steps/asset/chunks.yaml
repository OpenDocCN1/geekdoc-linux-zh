    **Meeting the Interface**


    ![image](images/pg28_1.jpg)


    When you start up the Linux Mint operating system, the first thing you see while
    the system begins loading is a black screen displaying only the Linux Mint logo:


    ![image](images/pg26_2.jpg)


    ![image](images/forget.jpg)


    The distro featured throughout this book is Linux Mint 20 (Ulyssa).


    Unless you selected the option to “Log in automatically” during the installation
    process (as described [here](#chapter01.xhtml_timezone)), the next thing you see
    is the **Log in** screen shown below:


    ![image](images/pg26_3.jpg)


    You can now enter the password you chose, then click the arrow button that appears
    in the password box (or hit the **Enter** key) to log in to the Linux Mint operating
    system.


    ![image](images/hot.jpg)


    The current time is also shown at the top right of the **Log in** screen. Hover
    your mouse cursor above the time to see the current date appear in a pop-up **Tooltip**
    box.


