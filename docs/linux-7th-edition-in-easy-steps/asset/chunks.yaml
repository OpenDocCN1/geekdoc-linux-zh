    **Chatting Online**


    ![image](images/pg82_1.jpg)


    Linux distros typically include a cross-platform instant messaging application.
    Linux Mint includes the free open-source HexChat IRC (**I**nternet **R**elay **C**hat)
    app. This can be used to chat about Linux and other topics on the “freenode” IRC
    network:


    ![image](images/1o.jpg)Click **Menu**, **Internet**, **HexChat** to launch the
    app – connecting to the “Official Linux Mint Support Channel”


    ![image](images/pg82_2.jpg)


    ![image](images/2o.jpg)Next, click the **HexChat**, **Network List** menu option
    – to open the “Network List” dialog


    ![image](images/pg82_3.jpg)


    ![image](images/3o.jpg)Enter a **Nick name** and a **User name**, then select
    the “freenode” network


    ![image](images/4o.jpg)Now, click the **Connect** button – to connect to the “freenode”
    network


    ![image](images/pg82_4.jpg)


    ![image](images/5o.jpg)Once connected, enter the command /join ##Linux in the
    HexChat text field – to join freenode’s Linux Support Channel


    ![image](images/pg83_1.jpg)


    ![image](images/forget.jpg)


    If the “User List” is not visible, click the **View**, **User List** menu options
    to make it appear.


    ![image](images/hot.jpg)


    The **Nick name** will be your name visible in the IRC channels and the **User
    name** is your identity to the server.


    ![image](images/6o.jpg)Enter comments or questions in the HexChat text field to
