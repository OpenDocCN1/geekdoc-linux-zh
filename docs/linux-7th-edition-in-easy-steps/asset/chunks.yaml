    \ to navigate to the home directory one more time\n\n![image](images/pg65_5.jpg)\n\
    \n## Handling Files\n\n![image](images/pg66_1.jpg)\n\nAll data files you create\
    \ in Linux should only be saved in your home directory, or a sub-directory (“folder”).\
    \ They can be revisited at any time using the Nemo file browser and can be easily\
    \ copied, moved, renamed, or deleted:\n\n![image](images/1p.jpg)Click on **Menu**,\
    \ **Accessories**, **Text Editor** to launch a plain text editor, then type in\
    \ some text and click ![image](images/pg66_2.jpg) the Save button on the toolbar\
    \ (or click the File, Save menu)\n\n![image](images/2p.jpg)In the “Save As” dialog,\
    \ double-click your **Documents** folder to open it, then type a name for the\
    \ text document (say, `sample.txt`) and click the ![image](images/pg66_2.jpg)\
    \ Save button\n\n![image](images/3p.jpg)Launch the Nemo file browser, then open\
    \ the **Documents** folder that is located in your home directory and find the\
    \ saved text file\n\n![image](images/4p.jpg)Right-click on the file’s icon and\
    \ choose **Copy** from the context menu – to copy that file to the “clipboard”\n\
    \n![image](images/pg66_4.jpg)\n\n![image](images/5p.jpg)Next, right-click on the\
    \ **Public** folder within your home directory, then choose **Paste Into Folder**\
    \ from the context menu – to deposit a copy of the file\n\n![image](images/forget.jpg)\n\
    \nThe **clipboard** is a memory buffer provided by the operating system and is\
    \ used for short-term data transfer.\n\n![image](images/hot.jpg)\n\nDirectories\
    \ may contain hidden files – click the **View**, **Show Hidden Files** menu in\
