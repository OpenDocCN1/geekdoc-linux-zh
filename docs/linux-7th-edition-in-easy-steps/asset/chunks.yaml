    # 9 Commanding the Terminal


    ***This chapter introduces the power of the command-line for file management.***


    ## Invoking the Terminal


    At the very heart of the Linux operating system is a core series of machine instructions
    known as the “kernel” – this is a technical program that is not user-friendly,
    as it is mainly designed to communicate with electronic components. A Linux “shell”
    is a facility that allows the user to communicate via commands with the kernel
    in a human-readable form. It translates command-line instructions so they can
    be processed.


    ![image](images/pg140_1.jpg)


    Most Linux distros include several shell programs that offer different features.
    The default Linux shell program, however, is called `Bash` (**B**ourne **A**gain
    **SH**ell), which is an updated version of the original Bourne shell found in
    the Unix operating system.


    The shell understands a large number of commands, and each has a number of “options”
    that may (optionally) be specified to modify their behavior – usually these are
    prefixed by a hyphen. Many also accept “arguments” that provide data to be used
    by the command. The typical syntax of a shell command looks like this:


    ```

    command -option argument

    ```


    Shell commands can be executed at a prompt in a Terminal window on a graphical
    desktop interface:


    ![image](images/1r.jpg)Click `Menu`, `Administration`, `Terminal` (or click the
    ![image](images/pg140_2.jpg) launcher on the Taskbar) to launch a Terminal window


    ![image](images/pg140_3.jpg)


