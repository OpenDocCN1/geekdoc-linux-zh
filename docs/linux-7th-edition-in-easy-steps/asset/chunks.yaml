    ![image](images/hot.jpg)


    If the Side Pane is not immediately visible, click `View`, `Side Pane` to make
    it appear.


    ![image](images/3b.jpg) Click the `Forward` button to advance the pages, or click
    on a “Thumbnail” in the Side Pane to jump to a page


    ![image](images/4b.jpg)Select the “Annotations” option in the Side Pane drop-down
    menu, then click on its icon to see the note


    ![image](images/pg137_1.jpg)


    ![image](images/hot.jpg)


    Use the `View` buttons to choose whether or not view Continuous pages in the window,
    and click the `View`, `Dual` menu option to view facing pages.


    ![image](images/5b.jpg)Select the “Bookmarks” option in the Side Pane menu, then
    to mark a page, click `Bookmarks`, `Add Bookmark`


    ![image](images/pg137_2.jpg)


    ![image](images/hot.jpg)


    You can click `File`, `Properties` to discover a document’s origin.


