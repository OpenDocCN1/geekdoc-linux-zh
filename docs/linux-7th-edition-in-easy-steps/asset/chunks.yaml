  trans: "\n打印机在移除该任务的同时继续打印图像文件——任务号 2 中的文本文件未发送到打印机，因此不会打印。\n\n![image](img/hot.jpg)\n\
    \n打印任务只能由其所有者或 root 超用户从打印队列中删除。\n\n从 shell 提示符打印不仅限于简单的打印文件——还可以使用 `lpr` 命令配合\
    \ `|` 管道字符将数据排队进行打印：\n\n![image](img/5g.jpg)输入 `ls -l /etc | lpr` 来打印 `/etc` 目录的列表——通过将\
    \ `ls` 命令的结果传递给 `lpr` 命令\n\n![image](img/6g.jpg)在列表打印期间，执行 `lpq` 命令查看打印队列，源是从标准输入管道的\n\
    \n![image](img/pg181_1.jpg)\n\nLinux 中的打印功能由 `CUPS`（通用 Unix 打印系统）设施提供。它提供了一个打印后台进程（spooler），用于以打印机理解的格式缓冲数据，以及一个调度器（scheduler），在打印机准备好接收时将缓冲数据发送到打印机。\n\
    \n`lpstat` 命令具有单独的选项来提供关于调度器、后台进程和打印机的 CUPS 状态信息：\n\n![image](img/7g.jpg)执行命令\
    \ `lpstat -t` 查看查看打印机状态\n\n![image](img/pg181_2.jpg)\n\n![image](img/hot.jpg)\n\
    \n当可用多个打印机时，使用 `lpr -P` 指定用于打印任务的打印机。\n\n## 评估表达式\n\n`expr` 命令允许你在 shell 提示符处执行简单的数学计算。它识别所有常用的算术运算符，但那些在\
    \ shell 中有其他含义的运算符需要用反斜杠 `\\` 转义字符开头。例如，`*` 通配符必须转义才能用于乘法。\n\n![image](img/pg182_1.jpg)\n\
    \n每个参数之间必须用空格分隔，可以使用括号来建立较长表达式中的运算符优先级——但每个括号字符都必须进行转义。\n\n`expr` 命令还可以执行布尔求值，返回真\
    \ (1) 或假 (0) 答案，并使用函数 `length`、`substr` 和 `index` 执行简单的字符串处理。\n\n![image](img/1g.jpg)在\
    \ shell 提示符下，输入 `expr 7 + 3` 执行加法，输入 `expr 7 \\* 3` 执行乘法\n\n![image](img/2g.jpg)输入\
    \ `expr 7 \\* \\( 3 + 1 \\)` 评估复杂表达式，输入 `expr 7 = 3` 进行布尔等值判断\n\n![image](img/3g.jpg)执行命令\
    \ `expr length “Linux in easy steps”` 来发现指定字符串的长度\n\n![image](img/4g.jpg)执行命令\
    \ `expr substr “Linux in easy steps” 7 13` 来提取指定字符串的子字符串\n\n![image](img/5g.jpg)执行命令\
    \ `expr index “Linux in easy steps” “x”` 来发现字符串中第一个 “x” 的位置\n\n![image](img/pg182_2.jpg)\n\
    \n![image](img/forget.jpg)\n\n算术运算符为 `+` 加、`-` 减、`*` 乘、`/` 除以及 `%` 取模。\n\n![image](img/hot.jpg)\n\
    \n你可以使用 `xcalc` 命令从终端窗口快速启动图形化计算器。\n\n表达式评估的结果可以通过 `if-then-else` 语句导致特定的动作。该语句包含三个独立部分，分别指定测试表达式、测试为真时执行的动作以及测试为假时执行的动作。\n\
    \n`if` 关键字开始语句，后面跟着括在一对 `[ ]` 方括号内的测试表达式。整个语句的每个部分都必须与下一部分用空格分隔，以便 shell 评估该表达式。\n\
    \n`then` 关键字开始语句的第二部分，指定测试为真时执行的命令。同样，`else` 关键字开始语句的第三部分，指定测试为假时执行的命令。最后，必须添加\
    \ `fi` 关键字来标记语句的结束。\n\n![image](img/forget.jpg)\n\n你必须在 `if` 关键字后留一个空格以避免错误。同样在\
    \ `[` 括号之后和 `]` 括号之前也要留一个空格以避免错误。\n\n你可以输入语句的第一部分然后按 **回车**（Return）提示输入语句的剩余部分，或者输入整个语句并用分号分隔每个部分：\n\
    \n![image](img/6g.jpg)输入 `if [ `expr 7 % 2` = 0 ]` 来测试七除二的余数是否为零，然后按 **回车**\n\n\
    ![image](img/7g.jpg)在语句提示符下，输入 `then echo “Even Number”`\n\n![image](img/8g.jpg)现在，输入\
    \ `else echo “Odd Number”`\n\n![image](img/9g.jpg)输入 `fi` 然后按 **回车** 执行相应的动作\n\
    \n![image](img/10g.jpg)通过输入 `if [ `expr 8 % 2` = 0 ]; then echo Even; else echo\
    \ Odd; fi` 在连续语句中进行类似的测试，然后按 **回车** 执行相应的动作\n\n![image](img/pg183_1.jpg)\n\n![image](img/snake.jpg)\n\
    \n反引号 `` `` 运算符包裹了 `expr 7 % 2`\n\n## 编写脚本\n\n长长的 Shell 例程可以方便地保存为脚本，它们以 `#!/bin/bash`\
    \ 开头，并通常赋予 `.sh` 扩展名。\n\n![image](img/forget.jpg)一旦脚本文件设置了执行权限，就可以通过 `./` 执行。为了确保不同的序列，有必要使用\
    \ `date+%s` 提取自 00:00:00 GMT 1970 年 1 月 1 日以来的秒数来种子 `$RANDOM` 变量以获得更好的数字生成效果。\n\
    \n![image](img/hot.jpg)\n\n输入 `RANDOM=1` 然后执行三次 `echo $RANDOM` 查看模式。重复这两个命令。可以通过在脚本中包含\
    \ `let` 命令对 Shell 变量（如 `$RANDOM`）进行算术运算![image](img/1g.jpg)打开任何文本编辑器并以 `#!/bin/bash`\
    \ 开始一个新文件\n\n![image](img/2g.jpg)在新行中，输入一行种子 `$RANDOM` 变量 `RANDOM=`date+%s``\n\
    \n![image](img/3g.jpg)添加一行将 1-20 的值赋值给变量 `let NUM=(RANDOM % 20 + 1)`\n\n![image](img/4g.jpg)在下一行输入一个清除窗口的指令\
    \ `clear`\n\n![image](img/5g.jpg)添加这些行来输出给用户的文本 `echo “I have chosen a number\
    \ between 1 and 20” echo “Can you guess what it is?”`\n\n![image](img/forget.jpg)括号包裹了要评估的表达式，但你不能在赋值的\
    \ `=`字符周围引入空格。\n\n![image](img/6g.jpg)现在，添加一行将用户的猜测读取到变量 `read GUESS`\n\n![image](img/7g.jpg)输入以下行以评估用户的猜测是否与生成的数字匹配，并对每次错误的尝试输出相应的响应\n\
    \n```bash\nwhile [ $GUESS -ne $NUM ]\ndo\n  if [ $GUESS -gt $NUM ]\n  then echo\
    \ “No - try lower... ”\n  else echo “No - try higher... ”\n  fi\n  read GUESS\n\
    done\n```\n\n![image](img/8g.jpg)添加一行确认正确的猜测 `echo “Yes the number is $NUM”`\n\
    \n![image](img/9g.jpg)将脚本保存为当前目录下的 `guess.sh`\n"
