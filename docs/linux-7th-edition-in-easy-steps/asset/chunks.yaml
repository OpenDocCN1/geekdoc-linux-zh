    ![image](images/9b.jpg)Drag the cursor to select a rectangular area of the screen,
    then release the mouse button to capture that area


    ![image](images/10b.jpg)Edit the name and location, then click the `Save` button


    ![image](images/pg135_4.jpg)


    ![image](images/hot.jpg)


    You can open the `Apply effect` drop-down menu to choose an effect when grabbing
    the current window.


    ![image](images/pg135_5.jpg)


    ![image](images/hot.jpg)


    You can also press `Shift` + `PrtSc` to see the cursor change to a crosshair so
