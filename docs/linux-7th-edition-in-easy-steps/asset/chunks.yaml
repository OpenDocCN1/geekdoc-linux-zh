  raw: 'Having created the boot media by following the steps [here](#chapter01.xhtml_sec4),
    you now have the ability to run Linux Mint in a “Live Session”. This means you
    can safely explore the Linux operating system on a PC where Windows is already
    installed on the hard drive as its operating system.


    ![image](images/pg16_1.jpg)


    In order to begin a Linux Live Session your PC must be able to boot up from the
    USB flash drive containing the boot media. This requires the PC’s boot settings
    to seek instructions from the USB flash drive before seeking instructions on the
    hard drive. If your PC looks to boot from the hard drive first, you will need
    to change the settings:


    ![image](images/1b.jpg)Consult your PC’s documentation to discover how to access
    its **Setup** utility. This often requires you to press the F2 key while starting
    the PC – but it does vary


    ![image](images/2b.jpg)Connect the USB flash drive boot media to your PC


    ![image](images/3b.jpg)Start up your PC and enter the Setup utility


    ![image](images/4b.jpg)Select the section relating to the PC’s **Boot** process


    ![image](images/pg16_2.jpg)


    ![image](images/5b.jpg)Make the flash drive (USB HDD) the first boot device by
    following the Setup utility’s **Help** instructions


    ![image](images/hot.jpg)


    The UEFI (**U**nified **E**xtensible **F**irmware **I**nterface) in modern PCs
    replaces the BIOS (**B**asic **I**nput/**O**utput **S**ystem) firmware interface
    in earlier PCs. These control how your PC boots up.


    ![image](images/forget.jpg)


    The Setup utility is unique to your PC, so its appearance will probably differ
    from the one shown here. Most PCs will, however, provide a way to change the Boot
    Priority Order so you can boot the PC from the USB flash drive.


    ![image](images/6b.jpg)Save the new settings and exit the Setup utility – typically
    by pressing the F10 key


    ![image](images/7b.jpg)If your PC is configured to boot in legacy BIOS mode, Linux
    Mint will now automatically start a Live Session


    ![image](images/pg17_1.jpg)


    If your PC is configured to boot in UEFI mode, you will be presented with a menu.
    Select the “Start Linux Mint” option, then hit the **Enter** key to start a Live
    Session.


    ![image](images/pg17_2.jpg)


    ![image](images/hot.jpg)


    When there is an option to choose between UEFI boot mode and legacy BIOS mode,
    UEFI offers several advantages – UEFI supports large hard drive partitions, has
    secure booting, and provides efficient system management.


    ![image](images/hot.jpg)


    You may also see “UEFI” referred to as “EFI” – UEFI is simply EFI 2.0.


    **Beginning Installation**


    ![image](images/pg18_1.jpg)


    Having started a Live Session by following the steps [here](#chapter01.xhtml_sec5),
    you can try out the Linux Mint operating system. It will perform in a similar
    manner to when it is permanently installed on the hard drive, but with these notable
    exceptions:


    •**The Live Session is slower** – it is loaded from the USB flash drive, rather
    than quickly from a hard drive.


    •**Changes are not permanent** – they are not saved on the USB flash drive, or
    written anywhere on your PC.


    •**Some apps behave differently** – system utilities, such as the Update Manager,
    cannot be used effectively.


    The user name in a Live Session is “mint”. If asked for a password you can simply
    hit the Enter key to proceed.


    Live Session provides an installer icon on the Desktop that can be used to begin
    permanent installation of Linux Mint:


    ![image](images/pg18_2.jpg)


    ![image](images/1b.jpg)Double-click on the “Install Linux Mint” icon to launch
    the Linux Mint installer wizard


    ![image](images/2b.jpg)On the “Welcome” screen, select your preferred language,
    then click the **Continue** button


    ![image](images/pg19_1.jpg)


    ![image](images/3b.jpg)On the “Keyboard layout” screen, select your layout, then
    click the **Continue** button


    ![image](images/pg19_2.jpg)


    ![image](images/hot.jpg)


    If you are unsure of the keyboard layout you can type into this box and let the
    installer figure it out.


    ![image](images/4b.jpg)Choose your wireless connection when asked, then check
    the box to install codecs and click the **Continue** button


    ![image](images/pg19_3.jpg)


    ![image](images/forget.jpg)


    This book features Linux Mint version 20 (Ulyssa) Cinnamon throughout. This version
    has Long Term Support until 2025.


    ![image](images/snake.jpg)


    Third-party codecs are required for multimedia support in certain apps. You are
    almost certainly going to want them.


    **Completing Installation**


    ![image](images/5b.jpg)On the “Installation type” screen...


    ![image](images/pg20_1.jpg)


    If you want only the Linux operating system on your PC (recommended), select **Erase
    disk and install Linux Mint**.


    ![image](images/pg20_2.jpg)


    Or, if Windows is installed and you also want to keep that on your PC, select
    the option to **Install Linux Mint alongside Windows Boot Manager**.


    ![image](images/pg20_3.jpg)


    ![image](images/hot.jpg)


    Advanced users can choose to manage disk partitions by choosing the **Something
    else** option here. Linux Mint requires one partition to be mounted on the root/directory.
    Although the operating system occupies around 15GB, this partition should ideally
    be 100GB+.


    If you retain Windows, the installer will resize the Windows operating system
    and install Linux in the free space created. A boot menu should appear so you
    can choose between operating systems whenever you start your PC – a “dual-boot”
    setup.


    ![image](images/6b.jpg)After choosing the installation type in either case, adjust
    the space suggested for each operating system if desired, then click the **Install
    Now** button to proceed


    ![image](images/snake.jpg)


    Attempting to create a dual-boot setup can be problematic on some PCs – erase
    the entire disk and install Linux Mint.


    ![image](images/7b.jpg)On the “Where are you?” screen, select your timezone then
    click the **Continue** button


    ![image](images/pg21_1.jpg)


    ![image](images/hot.jpg)


    Simply click your approximate location on the global map to select your timezone.


    ![image](images/8b.jpg)On the “Who are you?” screen, enter your details then click
    the **Continue** button to install system files


    ![image](images/pg21_2.jpg)


    ![image](images/hot.jpg)


    If you are the only user of the PC you can select the option to **Log in automatically**
    so you will not be asked for your password whenever you start Linux Mint. You
    may also select the **Encrypt my home folder** option if you are concerned about
    security.


    ![image](images/9b.jpg)Enjoy the slideshow while Linux Mint gets installed, then
    upon completion click the **Restart Now** button


    ![image](images/pg21_3.jpg)


    ![image](images/pg21_4.jpg)


    ![image](images/hot.jpg)


    For help with installation refer to the online Linux Mint forums at **[forums.linuxmint.com](http://forums.linuxmint.com)**


    **Enabling Backups**


    ![image](images/pg22_1.jpg)


    Having completed the installation process by following the steps [here](#chapter01.xhtml_sec6),
    Linux Mint will launch to your Desktop. Before you start using the operating system
    it is recommended you enable the “Timeshift” backup utility. This is like “System
    Restore” on Windows and will allow you to restore the operating system to an earlier
    backup should any problems arise:


    ![image](images/1b.jpg)Click on **Menu** (“Start” button), **Administration**,
    **Timeshift**


    ![image](images/pg22_2.jpg)


    ![image](images/2b.jpg)Next, enter the password you chose in the “Who are you?”
    dialog during the installation process, then click the **Authenticate** button


    ![image](images/pg22_3.jpg)


    ![image](images/3b.jpg)Now, select the “RSYNC” option, then click the **Next**
    button


    ![image](images/pg22_4.jpg)


    ![image](images/hot.jpg)


    “RSYNC” is a disk-based backup system that only backs up what has changed since
    the previous backup.'
