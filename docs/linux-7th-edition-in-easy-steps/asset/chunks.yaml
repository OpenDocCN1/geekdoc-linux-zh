    ## Reading Documents


    ![image](images/pg136_1.jpg)


    The Linux Mint distro includes the Document Viewer app (`xreader`) that is useful
    when reading multi-page documents such as a user guide. Typically, these types
    of documents are in the Portable Document Format (`.pdf`) that can contain annotations
    and are sometimes protected by a password. You can find the Document Viewer launcher
    on the Menu in the Accessories category, but usually you will launch it by double-clicking
    on a PDF document’s file icon or from a right-click context menu:


    ![image](images/1b.jpg)Right-click on a document file icon and choose `Open With
    Document Viewer` to launch the app


    ![image](images/pg136_2.jpg)


