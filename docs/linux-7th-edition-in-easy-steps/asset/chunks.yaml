    ![image](images/4r.jpg)Double-click in the `Main (ulyssa)` box and select a local
    mirror from the list that appears, then click `Apply`


    ![image](images/pg38_5.jpg)


    ![image](images/pg38_6.jpg)


    ![image](images/5r.jpg)Now, select a local mirror for the `Base (focal)` box,
    then click `OK` to close the “Software Sources” dialog


    ![image](images/hot.jpg)


    A “Welcome” screen may appear when you first open the Update Manager. Click its
    `OK` button to proceed.


    ![image](images/6r.jpg)Wait while the software list gets updated, then return
    to the “Update Manager” window


    ![image](images/pg39_1.jpg)


    ![image](images/7r.jpg)Click the `Select All` button, then click `Install Updates`


    ![image](images/pg39_2.jpg)


    ![image](images/8r.jpg)If advised additional packages are required, click `OK`


    ![image](images/pg39_3.jpg)


    ![image](images/9r.jpg)Enter your password, then click the `Authenticate` button
    – Linux Mint will now download and install available updates


    ![image](images/pg39_4.jpg)


    ![image](images/pg39_5.jpg)


    ![image](images/pg39_6.jpg)


    ![image](images/snake.jpg)


    It can take a little time to update the cache and download updates, so it is important
    to choose a fast local mirror server.


    ![image](images/hot.jpg)


    Notice that in Linux Mint the updates are referred to as “packages”. These are
    managed by the `Synaptic Package Manager`, which can be found in the Administration
    category on the Menu.


    ## Closing the Desktop


    ![image](images/pg40_1.jpg)


    If your Linux Mint operating system is left unused it will, by default, automatically
    replace the Desktop with a screensaver and lock the screen. This means you will
    need to enter your password to get back to the Desktop. If you wish to leave your
    PC, you can immediately lock the screen for security purposes:


    ![image](images/1r.jpg)Click the `Menu button`, then click the “Lock screen” button
    to instantly close the Desktop


    ![image](images/pg40_2.jpg)


    ![image](images/2r.jpg)See the screensaver now fills the screen so your PC cannot
    be used


    ![image](images/pg40_3.jpg)


    ![image](images/3r.jpg)Move your mouse when you want to unlock your PC, and you
    will be presented with a password request – enter your password to return to the
    Desktop


    ![image](images/pg40_4.jpg)


    ![image](images/hot.jpg)


    You can also lock the screen using the `Ctrl` + `Alt` + `L` keyboard shortcut.
    To discover more Linux Mint shortcuts, click `Menu`, `Preferences`, `Keyboard`
    to open the “Keyboard” window, then click the `Shortcuts` button. Select a category,
    such as `System`, in the left-hand pane to see available shortcuts in the right-hand
    pane.


    ![image](images/hot.jpg)


    You can click the ![image](images/pg40_5.jpg) `Switch User` button to log out
    – you will then see the `Log in` screen illustrated [here](#chapter02.xhtml_sec10).


    You may sometimes want to log out of the Linux Mint operating system for security
    purposes or to switch users:


    ![image](images/1r.jpg)Click `Menu`, then click the “Log Out” button to see a
    “Session” options dialog appear


    ![image](images/pg41_2.jpg)


    ![image](images/pg41_1.jpg)


    ![image](images/2r.jpg)Click the `Log Out` option button, or the `Switch` User`
    option button, to see the `Log in` screen appear


    ![image](images/pg41_3.jpg)


    ![image](images/hot.jpg)


    The `Switch User` option saves your session state to allow someone else to log
    in. When they log out and you log back in, you will be back where you left off
    – your open apps will still be running. The `Log Out` option, on the other hand,
    ends the session and closes your open apps – when you log back in they will not
    be running.


    When you are going to be away from your PC for a long time you will probably want
    to shut down the operating system:


    ![image](images/1r.jpg)Click `Menu`, then click the “Quit” button to see a “Shut
    down this system now?” options dialog appear


    ![image](images/pg41_4.jpg)


    ![image](images/2r.jpg)Click the `Shut Down` option button to exit Linux Mint
    and power off your PC


    ![image](images/pg41_5.jpg)


    ![image](images/hot.jpg)


    ## 3. Setting Preferences


    ***This chapter describes some useful ways you can set up your Linux Mint to suit
    your preferences.***


    ### Configuring the Screensaver


    By default, your Linux Mint Desktop will automatically switch to the screensaver
    if you do not interact with your PC for a while. This means you may frequently
    have to enter your password to return to the Desktop and is unnecessary if your
    PC is located in an environment where security is not a concern. Fortunately,
    you can disable this behavior so the Desktop will always be visible unless you
    choose to explicitly lock the PC.


    ![image](images/pg44_1.jpg)


    You may also choose how the screen appears by selecting a custom screensaver,
    and you can add a message to the Lock screen:


    ![image](images/1g.jpg)Click `Menu`, `Preferences`, `Screensaver` to open a “Screensaver”
    window


    ![image](images/pg44_2.jpg)


    ![image](images/2g.jpg)Next, click the `Settings` button


    ![image](images/pg44_3.jpg)


    ![image](images/3g.jpg)Now, open the drop-down menu for “Screensaver settings”
    and select the `Never` option – to stop your PC automatically switching to the
    Lock screen


    ![image](images/4g.jpg)Choose preferences from the `Lock settings` section

