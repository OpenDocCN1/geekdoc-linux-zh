- "# Linux 第7版入门指南\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\n![image](img/IFC.jpg)\n\
  \n![image](img/title.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n![image](img/pg6.jpg)\n\n#\
  \ 1 开始使用\n\n***本章介绍了 Linux 系统并描述了典型的安装过程。***\n\n## 介绍 Linux\n\n![image](img/pg8.jpg)\n\
  \nLinux 是一种可以在各种硬件上运行的操作系统，包括大多数桌面电脑使用的 Intel 系统。它是 1969 年引入的强大的 Unix 系统的现代衍生版本。近年来，随着计算机用户发现了它的许多优势，Linux\
  \ 的流行程度急剧增加：\n\n- Linux 根据 GNU 公共许可发布，该许可确保了它对所有用户都是免费的。你可以在互联网上免费下载，但如果你更喜欢 CD/DVD\
  \ 副本，则可能需要支付分发费用。\n- Linux 的源代码访问是不限制的，并且可以进行修改。这使得全球的数千名程序员能够完善代码以提高性能。\n- Linux\
  \ 是一种真正的多用户、多任务操作系统，允许多个用户同时运行多个应用程序而不会遇到任何流量问题。世界上许多 Web 服务器运行在 Linux 上，原因正是在此。\n\
  - Linux 是一个极其稳定的操作系统——连续运行超过一年的情况并不少见。它可以在“在线”进行升级，因此很少需要重启。\n\n**林纳斯·托瓦兹，Linux\
  \ 内核创建者**\n\n\n\n\n\n-   Linux 平台上有很多高质量的应用程序可以使用。这些程序与在操作系统上运行的商业应用程序相当，但与 Linux\
  \ 一样，它们也是免费的。例如，免费的 LibreOffice 软件套提供了与商业 Microsoft Office 软件包类似的功能。\n-   通过开源软件，管理员可以确切知道一个程序可以做什么以及它带来的安全风险。开源应用程序不会秘密收集用户信息，也不会向第三方发送机密信息。\n\
  \n![image](img/hot.jpg)\n\n读 `Linux` 这个名字时使用短元音“i”——读作“li-nucks”，而不是“lie-nucks”。\n\
  \n![image](img/forget.jpg)\n\n许多 Web 服务器被认为拥有“LAMP”配置——这是 `L`inux、`A`pache、`M`ySQL、`P`HP\
  \ 的缩写，它结合了操作系统、Web 服务器、数据库和服务端脚本语言。\n\n## Linux 的演变\n\n1983 年，一位富有远见的程序员 Richard\
  \ Stallman 启动了一项名为 `GNU` 项目的。它的哲学是软件不应该受到复制或修改的限制，以便创建出更好、更高效的程序。这激励了世界各程序员创建由效率而非财务激励驱动的程序。\n\
  \n到 1991 年，`GNU` 项目已经创建了许多软件工具，包括 Stallman 本人编写的 `GNU C Compiler`。当时，这些工具中的许多被赫尔辛基大学的一个\
  \ 21 岁学生整合到了一个兼容 Unix 的系统中。他的名字是 Linus Torvalds，他将该操作系统命名为 `Linux` (`Linu`s – Uni**x**)。\n\
  \n`Linux` 在互联网上开放下载，以便其他程序员可以测试和调整源代码，然后将其返回给 Linus Torvalds。在经过热烈的开发后，`Linux 1.0`\
  \ 在 `GNU 通用许可证`下在全球发布，这确保了它保持免费。\n\n程序员们热于探索 `Linux`，并很快发现了一些惊人的用途。1996 年 4 月，洛斯阿拉莫斯国家实验室的研究人员使用\
  \ `Linux` 将 68 台 PC 作为一个单一并行处理机来模拟原子冲击波。这台超级计算机的价格为 15 万美元，仅为同商业机器的十分分之一。它的峰值速度达到了每秒\
  \ 190 亿次，成为世界第 315 大强大的超级计算机。它也被证明是稳健的——三个月后它仍然不需要重启。\n\n`Linux` 作为一种文本操作系统继续增长，而\
  \ Windows 变成了占据主导地位的图形桌面操作系统。考虑到大多数 PC 用户都想要图形环境的点击式便利性，`Linux` 阵营开始开发一种与 Windows\
  \ 桌面相当的系统。\n\n从 1991 年的少数爱好者到现在的数百万用户——`Linux` 已经成熟。今天精美的 `K 桌面环境` (`KDE`) 和 `Gnome`\
  \ 桌面环境现在为 Windows 用户提供了一个用户好的替代方案——用于桌面的 `Linux`！\n\n![image](img/pg9_1.jpg)\n\n\
  这只企鹅是“Tux”——快乐的 `Linux` 吉物。\n\n![image](img/pg9_2.jpg)\n\n“GNU”一词是 `G`NU’s `N`ot\
  \ `U`nix 的递归缩写。可以在 [gnu.org/licenses/gpl.html](http://www.gnu.org/licenses/gpl.html)\
  \ 在线了解更多关于 `GNU 通用许可证` 的信息。\n\n![image](img/pg9_3.jpg)\n\n可以在 [gnome.org](http://www.gnome.org)\
  \ 在线了解更多关于 `Gnome` 图形桌面的信息。\n\n## 选择发行版\n\n`Linux` 的核心是一系列经过测试的编译代码，被称为 `kernel`（内核）。`kernel`\
  \ 为操作系统提供核心功能，就像汽车的引擎一样。它负责基础工作，例如帮助其他程序访问硬件以及在各种程序之间共享你的计算机处理器。\n\n![image](img/pg10_1.jpg)\n\
  \n除了 `kernel` 之外，`Linux` 还包含许多系统级程序，例如处理你的电子邮件、网络连接和引导加载程序的服务。将这些考虑为汽车的变速箱、齿轮和底盘——没有这些，引擎就没太大用。\n\
  \n`Linux` 发行版通常还包含大量的用户级程序——即日常使用的应用程序：例如 Web 浏览器、文字处理器、文本编辑器、图形编辑器、媒体播放器等。这些是汽车的最后装饰，确保了良好的乘坐体验——白壁轮胎和软皮内饰。\n\
  \n所有这些组件都捆绑在各种 `Linux` 发行版包中，通常被称为“distros”（发行版）——就像汽车的所有组件捆绑在一起制成一台完整的汽车一样。\n\n\
  ![image](img/hot.jpg)\n\n大多数 `Linux` 发行版都以“现场”版本提供，让你能够从磁盘运行 `Linux`——这样你可以在不将 `Linux`\
  \ 安装到硬盘的情况下尝试它。\n\n就像汽车有许多品牌和型号一样，也有许多 `Linux` 发行版供选择。最知名的发行版包括 `RedHat Fedora`、`SUSE`、`Ubuntu`\
  \ 和 `Mint`。每个发行版都有自己的安装程序和独特的默认配置，取决于发行者认为的最佳安排。对你来说最理想的选择将取决于你个人的偏好以及你如何使用 `Linux`。下面描述了最流行的发行版以帮助你选择：\n\
  \n### RedHat Fedora\n\n最广为人知的 Linux 发行版之一，由商业性的 `RedHat Enterprise Linux` 产品线和由\
  \ `Fedora Project` 社区开发的免费 `Fedora` 发行版组成。`Fedora` 发行版有几个版本——用于 PC 的“Workstation”、用于服务器的“Server”以及用于云生态系统的“IoT”。\n\
  \n**优点**：广泛使用，出色的社区支持，具有创新性。\n\n**缺点**：Fedora 版本的生命周期有限，多媒体支持差。\n\n从 [getfedora.org](http://getfedora.org)\
  \ 免费下载\n\n![image](img/pg10_2.jpg)\n\n“选择自由。选择 Fedora。”\n\n### openSUSE\n\n基于社区的“openSUSE”发行版因其安装程序和\
  \ `YaST` 配置工具而获得好评。随盒附的文档被标记为迄为止最完整的。固定发布的“Leap”发行版是 `openSUSE` 获奖的 `SUSE Linux\
  \ Enterprise` (`SLE`) 产品的的基础，而滚动发布的“Tumbleweed”发行版提供了所有软件的最新稳定版本。\n\n**优点**：注重细节，易用的\
  \ `YaST` 配置工具。\n\n**缺点**：发行版巨大——包含超过 1500 个捆绑包。\n\n从 [opensuse.org](http://opensuse.org)\
  \ 免费下载\n\n![image](img/pg11_1.jpg)\n\n“系统管理员、开发者和桌面用户的首选。”\n\n### Ubuntu\n\n这个复杂的社区发行版通常采用流行的\
  \ `Gnome` GUI 桌面管理器。它具有固定的六个月发布周期的优势，每两年有一个支持五年的 `LTS` (`L**ong **T**erm **S**upport`)发布版。`Ubuntu`\
  \ 发行版有几个版本——用于 PC 的“Desktop”、用于服务器的“Server”、用于物联网设备的“IoT ”以及用于云计算的“Cloud”。`Ubuntu`\
  \ 桌面版的默认界面与 Windows 桌面非常不同。\n\n**优点**：优秀的社区，以及固定的发布周期。\n\n**缺点**：界面对 Windows 用户来说会很陌生。\n\
  \n从 [ubuntu.com](http://ubuntu.com) 免费下载\n\n![image](img/pg11_2.jpg)\n\n“快速、安全简单，Ubuntu\
  \ 助力全球数百万台 PC。”\n\n### Linux Mint\n\n\n\n\n一个现代、优雅且易于使用的操作系统。它基于 `Ubuntu` 操作系统，开箱即用，并提供完整的多媒体支持。所有的\
  \ Linux Mint 发行版都是 LTS（长期支持）版本，会在每个 `Ubuntu` LTS 发布后不久出现，并获得五年的支持。鼓励用户发送反馈，以便将他们的建议被用于改进\
  \ Linux Mint。该操作系统通常采用 `Cinnamon` GUI 桌面管理器，对于从 Windows 操作系统迁移过来的用户来说，这会感到非常熟悉。因此，本书将全程使用\
  \ Linux Mint 来演示 Linux 操作系统的各项特性。\n\n**优点**：社区非常优秀，界面对 Windows 用户来说很熟悉——最适合初学者的发行版。\n\
  \n**缺点**：`Ubuntu` 的用户社区比 Mint 大。\n\n从 **[linuxmint.com](http://linuxmint.com)**\
  \ 免费下载\n\n![image](img/pg11_3.jpg)\n\n“Linux Mint. 优雅源自自由”。\n\n## 提供磁盘空间\n\n![image](img/pg12_1.jpg)\n\
  \n操作系统安装在硬盘驱动器上一个称为“分区”的区域上。当 `Windows` 是唯一安装的操作系统时，它的分区通常会占用整个硬盘。在这种情况下安装 Linux\
  \ 有三种可能的选项：\n\n• **删除 Windows 分区**——用占用整个驱动器的 Linux 分区替换它。此选项将删除 `Windows` 操作系统以及所有应用程序和数据文件。它会创建一个专用的\
  \ Linux 计算机，当 PC 开启机启动时，它会立即启动 Linux。\n\n• **减小 Windows 分区大小**——使其不再占用整个驱动器，然后在产生的空闲空间创建\
  \ Linux 分区。此选项将保留 `Windows` 操作系统、应用程序和数据文件。它创建一个“双启动”计算机，允许用户在每次 PC 开机时都选择启动 Linux\
  \ 还是 `Windows`。\n\n• **为系统添加第二块硬盘**——这允许 Linux 分区占用整个第二块驱动器，并保留第一块硬盘上的 `Windows`\
  \ 操作系统、应用程序和数据文件。这同样创建一个双启动计算机，允许用户在每次 PC 开机时都选择启动 Linux 还是 `Windows`。\n\n![image](img/hot.jpg)\n\
  \n一个 `H` `D` `D` 驱动器（`HDD` 或简单称为“硬盘”）可以被分为一个或多个区域，以便操作系统能够分别管理每个区域。\n\n为 Linux 安装额外硬盘的选项是许多人的热门选择，因为他们通常已经将原始硬盘升级为更大的，因此他们的原始驱动器就闲置置了。与其他选项相比，它还具有几个优势：\n\
  \n• `Windows` 驱动器上的空闲空间不会被减少。\n• 消除了通过调整分区大小导致数据丢失的风险。\n• 保留了熟悉的 `Windows` 操作系统。\n\
  • 明确分离了两个操作系统。\n• 驱动器故障只会影响一个操作系统。\n\n![image](img/snake.jpg)\n\n调整分区大小是一个可怕的过程，数据丢失可能会且确实会发生——即使在专家手中也是如此。在尝试此操作之前，必须备份分区的的所有内容。\n\
  \n## 添加第二块硬盘\n\n旧的 `IDE`（集成驱动器电子）硬盘需要通过在硬盘上设置“跳线帽”来配置为主主/从关系。然后这些硬盘可以通过一根排线进行串联连接。\n\
  \n![image](img/pg13_1.jpg)\n\n大多数现代 PC 现在都拥有 `SATA` 硬盘，不需要主/从配置。只要你安装了 `Windows`\
  \ 驱动器，你的 PC 就会自动将额外的驱动器识别为从盘：\n\n![image](img/1b.jpg)关闭 PC，打开机箱并找到现有的硬盘——位于硬盘笼内\n\
  \n![image](img/2b.jpg)在硬盘笼内安装一个额外的 `SATA` 驱动器，然后顺着第一块硬盘的电线识别它插在主板上的位置——通常是一个标记为“SATA”的连接器\n\
  \n![image](img/3b.jpg)将你新硬盘的 `SATA` 线插入主板上相邻的 `SATA` 连接器，并将另一端插入新的 `SATA` 驱动器本身\n\
  \n![image](img/4b.jpg)从 PC 电源单元连接一条电源线到 `SATA` 驱动器，然后关闭机箱并开启 PC\n\n![image](img/5b.jpg)右键点击“开始”按钮并选择`磁盘`\
  \ `管理`，看到出现“初始化磁盘”对话框\n\n![image](img/6b.jpg)点击`确定` 初始化新硬盘，然后在磁盘管理中，右键点击新驱动器并从右菜单中选择`新建简单卷`\n\
  \n![image](img/7b.jpg)在“新建简单卷向导”中反复点击“下一步”，以格式化驱动器并为其分配驱动器号\n\n![image](img/hot.jpg)\n\
  \n如果你不习惯在 PC Case 内部操作，电脑商店应该乐意以廉宜的费用为你安装第二块硬盘。\n\n![image](img/pg13_2.jpg)\n\n\
  ## 创建启动媒体\n\n![image](img/pg14.jpg)\n\nLinux Mint 发行版有三个版本，桌面环境分别为“Cinnamon”、“MATE”和“Xfce”。最受欢迎的版本是\
  \ `Cinnamon`，它可以在不对系统进行任何更改的情况下尝试 Linux，并在需要时安装到系统。但在之前，你需要确保系统满足以下要求：\n\n• **1GB\
  \ 内存**\n• **15GB 磁盘空间**\n• **1024 x 768 分辨率**的 USB U 盘\n\n像其他发行版一样，Linux Mint 的下载是一个\
  \ ISO 文件，必须“刻录”到 U 盘上创建 Linux 启动媒体：\n\n![image](img/1b.jpg)启动浏览器，导航到下载页面 **[linuxmint.com/download.php](http://www.linuxmint.com/download.php)**\n\
  \n![image](img/2b.jpg)接下来，点击 `Cinnamon` 链接\n\n![image](img/3b.jpg)现在，从列表中点击你所在国家的\
  \ `下载镜像` 链接\n\n![image](img/4b.jpg)选择将 ISO 文件保存到系统的器位置以开始下载\n\n![image](img/5b.jpg)\n\
  \n`linuxmint.iso`\n\n下载完成后，你现在需要一个应用将镜像刻录到 USB 闪盘。Linux Mint 推荐使用 `Etcher`。访问 [balena.io/etcher](https://balena.io/etcher)\
  \ 并下载适用于系统的安装程序，例如“Download for Windows (x86/x64)”\n\n![image](img/hot.jpg)\n\n\
  U 盘——也被称为 Thumb Drive、Pen Drive、Disk Key、Gig Stick 或 Memory Stick。\n\n![image](img/6b.jpg)安装程序下载完成后，运行其`安装`向导在系统中安装\
  \ Etcher\n\n![image](img/7b.jpg)接下来，将 USB 闪盘连接到你的计算机\n\n![image](img/8b.jpg)现在，启动\
  \ Etcher 应用并点击`选择文件`按钮，然后选择你下载的 ISO 镜像\n\n![image](img/pg15_1.jpg)\n\n![image](img/pg15_2.jpg)\n\
  \n![image](img/9b.jpg)点击`选择目标`按钮，然后选择连接到计算机的 USB 闪盘\n\n![image](img/10b.jpg)点击`刻录!`\
  \ 按钮将 ISO 的内容刻录到 USB 闪盘上——创建 Linux 启动媒体\n\n完成后，如果你想验证 ISO 镜像文件（推荐），可以在 [linuxmint-installation-guide.readthedocs.io/en/latest/verify.html](http://linuxmint-installation-guide.readthedocs.io/en/latest/verify.html)\
  \ 找到操作方法。\n\n**启动实时会话**\n\n\n\n\n按照此处的步骤创建启动介后，你现在已经能够在“实时会话”（Live Session）中运行 Linux\
  \ Mint。这意味着你可以在一台已经安装了 Windows 作为操作系统的 PC 上安全地探索 Linux 操作系统。\n\n![image](img/pg16_1.jpg)\n\
  \n要启动 Linux 会话，你的 PC 必须能够从包含启动介的 USB 闪盘启动。这要求 PC 的启动设置在查找硬盘指令之前，先从 USB 闪盘查找指令。如果你的\
  \ PC 首先尝试从硬盘启动，则你需要更改设置：\n\n![image](img/1b.jpg)查阅你的 PC 文档了解如何访问其 `Setup` 工具程序。这通常要求你在启动\
  \ PC 时按下 `F2` 键——但视情况而异\n\n![image](img/2b.jpg)将 USB 闪盘启动介连接到你的 PC\n\n![image](img/3b.jpg)启动\
  \ PC 并进入 `Setup` 工具程序\n\n![image](img/4b.jpg)选择与 PC `Boot` 过程相关的部分\n\n![image](img/pg16_2.jpg)\n\
  \n![image](img/5b.jpg)按照 `Setup` 工具程序的 `Help` 指令，将闪盘（USB HDD）设为第一个启动设备\n\n![image](img/hot.jpg)\n\
  \n现代 PC 中的 UEFI (`U`nified `E`xtensible `F`irmware `I`nterface）替换了早期 PC 中的 BIOS\
  \ (`B`asic `I`nput/**O`utput `S`ystem）固件接口。这些控制着你的 PC 如何启动。\n\n![image](img/forget.jpg)\n\
  \n`Setup` 工具程序是你的 PC 特有的，因此它的外观可能与此处显示的不同。然而，大多数 PC 都提供更改启动优先级顺序的方法，以便你从 USB 闪盘启动\
  \ PC。\n\n![image](img/6b.jpg)保存新设置并退出 `Setup` 工具程序——通常按下 `F10` 键\n\n![image](img/7b.jpg)如果你的\
  \ PC 配置为以 legacy BIOS 模式启动，Linux Mint 现在将自动启动实时会话\n\n![image](img/pg17_1.jpg)\n\n\
  如果你的 PC 配置为以 UEFI 模式启动，你将看到一个菜单。选择“Start Linux Mint”选项，然后按下 `Enter` 键启动实时会话。\n\n\
  ![image](img/pg17_2.jpg)\n\n![image](img/hot.jpg)\n\n当可以在 UEFI 启动模式和 legacy BIOS\
  \ 模式之间选择时，UEFI 提供了若干优势——UEFI 支持大硬盘分区、具有安全启动功能并提供高效的系统管理。\n\n![image](img/hot.jpg)\n\
  \n## 开始安装\n\n![image](img/pg18_1.jpg)\n\n按照此处的步骤启动实时会话后，你可以尝试 Linux Mint 操作系统。它的运行方式与永久安装在硬盘上类似，但有以下显著异常：\n\
  \n- **实时会话速度较慢**——它是从 USB 闪盘加载的，而不是从硬盘快速加载。\n- **更改不是永久的**——这些更改不会保存在 USB 闪盘上，也不会写入你\
  \ PC 的任何地方。\n- **某些应用行为不同**——系统实用程序（如更新管理器）无法有效使用。\n\n实时会话中的用户名是“mint”。如果提示输入密码，只需按下\
  \ `Enter` 键即可继续。\n\n实时会话在桌面上提供了一个安装图标，用于开始 Linux Mint 的永久安装：\n\n![image](img/pg18_2.jpg)\n\
  \n![image](img/1b.jpg)双击“Install Linux Mint”图标启动 Linux Mint 安装向导\n\n![image](img/2b.jpg)在“Welcome”（欢迎）屏幕上，选择你偏好的语言，然后点击\
  \ `Continue”（继续）按钮\n\n![image](img/pg19_1.jpg)\n\n![image](img/3b.jpg)在“Keyboard\
  \ layout”（键盘布局）屏幕上，选择你的布局，然后点击 `Continue` 按钮\n\n![image](img/pg19_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n如果你不确定键盘布局，可以在此框中输入并让安装程序自行识别。\n\n![image](img/4b.jpg)在被问时选择你的无线连接，然后勾选安装解码器的框并点击\
  \ `Continue` 按钮\n\n![image](img/pg19_3.jpg)\n\n![image](img/forget.jpg)\n\n本书全文采用\
  \ Linux Mint 版本 20 (Ulyssa) Cinnamon。该版本提供直到 2025 年的长期支持。\n\n![image](img/snake.jpg)\n\
  \n某些应用中的媒体支持需要第三方解码器。你几乎会需要它们。\n\n## 完成安装\n\n![image](img/5b.jpg)在“Installation\
  \ type”（安装类型）屏幕上...\n\n![image](img/pg20_1.jpg)\n\n如果你只想在 PC 上运行 Linux 操作系统（推荐），选择\
  \ `Erase disk and install Linux Mint`擦除磁盘并安装 Linux Mint）。\n\n![image](img/pg20_2.jpg)\n\
  \n或者，如果安装了 Windows 且也想在 PC 上保留它，选择 `Install Linux Mint alongside Windows Boot Manager`与\
  \ Windows 引导管理器旁安装 Linux Mint）选项。\n\n![image](img/pg20_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n高级用户可以通过选择 `Something else` 来管理分区。Linux Mint 需要一个挂载在根目录的分区。虽然操作系统占用 15GB，该分区理想情况下应为\
  \ 100GB。\n\n如果你保留 Windows，安装程序将调整 Windows 并在空闲空间上安装 Linux。启动菜单将会出现，以便你在启动 PC 时可以选择操作系统——双系统设置。\n\
  \n![image](img/6b.jpg)在选择安装类型后，根据需要为每个操作系统调整空间，然后点击 `Install Now`现在按钮\n\n![image](img/snake.jpg)尝试创建双系统设置在某些\
  \ PC 上可能会有问题——删除整个磁盘并安装 Linux Mint。\n\n![image](img/7b.jpg)在“Where are you?”屏幕上选择你的时区，然后点击\
  \ `Continue`按钮\n\n![image](img/pg21_1.jpg)\n\n![image](img/hot.jpg)只需在地图上点击你的所在地来选择时区。\n\
  \n![image](img/8b.jpg)在“Who are you?”屏幕上输入你的信息，然后点击 `Continue`按钮安装系统文件\n\n![image](img/pg21_2.jpg)\n\
  \n![image](img/hot.jpg)如果你是 PC 的唯一用户，可以选择 `Log in automatically`自动登录，这样启动 Linux\
  \ Mint 时无需输入密码。如果你担心安全，还可以选择 `Encrypt my home folder`加密我的文件夹选项。\n\n![image](img/9b.jpg)在\
  \ Linux Mint 安装时欣赏幻灯片，完成后点击 `Restart Now`重启现在\n\n![image](img/pg21_3.jpg)\n\n![image](img/pg21_4.jpg)\n\
  \n![image](img/hot.jpg)\n\n有关安装的帮助请参考 Linux Mint 在线论坛 [forums.linuxmint.com](http://forums.linuxmint.com)\n\
  \n## 启用备份\n\n![image](img/pg22_1.jpg)\n\n按照此处点击`Menu`（启动按钮）、`Administration`管理、`Timeshift`\n\
  \n![image](img/pg22_2.jpg)\n\n![image](img/2b.jpg)接下来，输入你在安装过程中“Who are you?”对话框中选择的密码，然后点击\
  \ `Authenticate`验证按钮\n\n![image](img/pg22_3.jpg)\n\n![image](img/3b.jpg)现在，选择`RSYNC`选项，然后点击\
  \ `Next`下一步按钮\n\n![image](img/pg22_4.jpg)\n\n![image](img/hot.jpg)\n\n`RSYNC`是一种基于磁盘的备份系统，仅备份自上次备份以来发生更改的内容。\n\
  \n\n\n\n\n![image](img/4b.jpg)\n选择您想要保存系统备份快照的设备，然后点击 `Next` 按钮。（在这里，选定的设备是一个连接的外部硬盘，但您也可以连接一个\
  \ USB 闪存并选择该设备进行备份）\n\n![image](img/pg23_1.jpg)\n\n![image](img/5b.jpg)选择您希望在所选设备上保存系统备份快照的频率（每月、每周、每天或每小时），然后点击\
  \ `Finish`按钮\n\n![image](img/pg23_2.jpg)\n\n![image](img/6b.jpg)日后重新打开 `Timeshift`\
  \ 并选择已保存的备份快照，然后点击 `Restore` 按钮恢复您的 Linux Mint 系统\n\n![image](img/pg23_3.jpg)\n\n\
  ![image](img/forget.jpg)\n\n不要将您的主硬盘作为保存备份快照的位置——因为如果您的硬盘故障，这对您将没有任何帮助。\n\n![image](img/snake.jpg)\n\
  \n备份快照保存在所选设备根目录下新创建的 `timeshift` 目录中。启动快照在后台执行，因此不会影响系统的启动速度。\n\n## Summary\n\n\
  - `Linux` 是一个免费、稳定的多用户操作系统，源自强大的 Unix 操作系统。\n- “Linux”这一名称结合了其创始人 `Linu` Torvalds\
  \ 名字的首几个字母与 Uni`x` 的最后一个字母。\n- `KDE` 和 `Gnome` 桌面都是用户友好的图形化用户界面，提供了与 Windows 桌面相同的点击式操作便利性。\n\
  - `kernel`（内核）提供了 Linux 的核心功能。\n- Linux `distros`（发行版）将内核、系统级程序和免费的用户级程序以各种组合组合在一起。\n\
  - 最受欢迎的 Linux Mint 发行版采用 `Cinnamon` 桌面管理器，是初学者的最佳发行版。\n-  Linux Mint 的最低硬件要求是 1GB\
  \ 内存、15GB 磁盘空间以及 1024 x 768 的屏幕分辨率——但更高的配置性能会更好。\n- 可以轻松为 PC 添加第二个 `hard drive`，以便实现\
  \ Linux 或 Windows 的双启动。\n- 可以下载 Linux 发行版并作为文件系统镜像刻录到 USB 闪存盘上以创建 `boot media`。\n\
  - 为了从 USB 闪存盘启动，可能需要使用启动 `Setup utility` 修改启动设备顺序。\n- `Live Session`（现场模式）允许您在安装之前尝试\
  \ Linux Mint 的大部分功能，并提供安装程序。\n- Linux Mint `installer`（安装程序）允许您将 Linux 作为唯一的操作系统安装，或与\
  \ Windows 同时安装。\n- 在开始使用 Linux Mint 操作系统之前，建议您启用 `Timeshift` 备份工具，以便在出现问题时恢复系统。\n\
  \n# 2 探索桌面\n\n*本章描述了 Linux Mint 界面，阐解释了如何使用它，并演示了如何对其自定义。*\n\n- 认识界面\n- 配置桌面\n-\
  \ 添加 Desklets\n- 调整任务栏\n- 启动应用\n- 编辑菜单\n- 安装更新\n- 关闭桌面\n- 总结\n\n## 认识界面\n\n![image](img/pg28_1.jpg)\n\
  \n当您启动 Linux Mint 操作系统时，系统开始加载时您看到的第一个界面是黑屏，只显示 Linux Mint 标志：\n\n![image](img/pg26_2.jpg)\n\
  \n![image](img/forget.jpg)\n\n本书介绍的发行版是 Linux Mint 20 (Ulyssa)。\n\n除非您在安装过程中选择了“自动登录”选项（如此处所述），否则接下来看到的将是所示的\
  \ `Log in` 屏幕：\n\n![image](img/pg26_3.jpg)\n\n现在您可以输入您选择的密码，然后点击密码框中出现的箭头按钮（或按 `Enter`\
  \ 键）登录 Linux Mint 操作系统。\n\n![image](img/hot.jpg)\n\n当前时间也显示在 `Log in` 屏幕的右上角。将鼠标光标悬停在时间上方即可在弹出的\
  \ `Tooltip` 框中看到当前日期。\n\n登录 Linux Mint 后，无论是通过 `Log in` 屏幕还是选择自动选项，都会出现如下所示的 GUI（图形化用户界**面**）桌面和任务栏：\n\
  \n![image](img/pg27_1.jpg)\n\n![image](img/hot.jpg)\n\n`Welcome`（欢迎）对话框为新用户提供了有用信息。如果您不想再次看到此对话框，请取消勾选此选项。点击任何窗口右上角的\
  \ `X` 按钮关闭该窗口。\n\n如果您有 Windows 操作系统的经验，Linux Mint 桌面看起来会很熟悉——这正是设计意图。\n\n### 系统托\n\
  \n系统托默认包含五个图标，点击这些图标可以访问有用的功能：\n\n![image](img/pg27_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n将鼠标光标悬停在时间上方即可在 `Tooltip` 框中看到出现的信息。\n\n### 配置桌面\n\n![image](img/pg28_1.jpg)\n\
  \n人们想要对桌面进行的早期更改之一就是更改桌面背景：\n\n![image](img/1r.jpg)\n\n在桌面的任何地方右键点击以打开上下文菜单\n\n\
  ![image](img/pg28_2.jpg)\n\n选择 `Change Desktop` 选项打开 `Backgrounds` 窗口\n\n![image](img/3r.jpg)\n\
  \n在左侧面板中选择 `Ulyssa` 查看一组壁纸\n\n![image](img/pg28_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n您可以点击 `Settings` 按钮选择颜色而不是图像\n\n![image](img/hot.jpg)\n\n您也可以点击 `Pictures` 文件夹选择您自己的图像\n\
  \n![image](img/4r.jpg)\n\n![image](img/pg28_4.jpg)\n\n如果您习惯了在 Windows 桌面看到“回收站”图标，或者只是想轻松地恢复删除的文件，您会在\
  \ Linux Mint 上看到垃圾桶图标：\n\n![image](img/1r.jpg)\n\n在桌面壁纸的任何地方右键点击打开菜单，然后选择 `Customize`\
  \ 打开 `Current Monitor Layout` 窗口\n\n![image](img/pg29_1.jpg)\n\n![image](img/pg29_2.jpg)\n\
  \n您可以从此窗口选择选项来更改所有图标的大小及其排列方式\n\n![image](img/2r.jpg)\n\n接下来，点击 `Desktop Settings`\
  \ 链接打开 `Desktop` 窗口\n\n![image](img/pg29_3.jpg)\n\n![image](img/3r.jpg)\n\n看到 `Trash`\
  \ 图标的开关处于 `Off` 位置\n\n![image](img/4r.jpg)\n\n将开关滑动到“On” 位置，即可看到垃圾桶图标出现在桌面上\n\n\
  ### 添加 Desklets\n\n![image](img/pg30_1.jpg)\n\nLinux Mint 提供了许多运行在桌面上的小程序（applets）。这些与您在\
  \ Windows 中可能过的桌面组件类似，但在 Linux Mint 中被称为“Desklets”（**Desk**top app**lets**）。某些 desklet\
  \ 是标准安装的，您还可以下载更多：\n\n![image](img/1r.jpg)\n\n在桌面壁纸的任何地方右键点击打开上下文菜单，然后选择 `Add Desklets`\
  \ 打开 `Desklets` 设置窗口\n\n![image](img/pg30_2.jpg)\n\n![image](img/2r.jpg)\n\n接下来，选择一个已安装的\
  \ desklet，例如 `Clock desklet`\n\n![image](img/pg30_3.jpg)\n\n![image](img/3r.jpg)\n\
  \n现在，点击 `+ Add` 按钮即可将该 desklet 添加到您的桌面。\n\n![image](img/pg30_4.jpg)\n\n![image](img/hot.jpg)\n\
  \n\n\n\n你可以点击小组件（Desklets）窗口中的`General Settings`按钮来修改小组件的宽度和装饰外观。\n\n![image](img/forget.jpg)\n\
  \n你可以在桌面上拖动小组件，以根据你的喜好进行布局。\n\n![image](img/4r.jpg)点击`Download` 按钮，然后选择一个小组件，并点击向下箭头按钮将其安装到你的电脑上。\n\
  \n![image](img/pg31_1.jpg)\n\n![image](img/5r.jpg)点击`Manage` 按钮查看你选择的小组件是否已添加到已安装的小组件列表中。\n\
  \n![image](img/pg31_2.jpg)\n\n![image](img/hot.jpg)\n\n点击 `-` 按钮从桌面上移除选中的组件，或点击\
  \ `x` 按钮卸载选中的组件。\n\n![image](img/6r.jpg)勾选新安装的组件，然后点击`+ Add` 按钮将其立即添加到桌面。\n\n![image](img/pg31_3.jpg)\n\
  \n![image](img/hot.jpg)\n\n当你选择`Download` 按钮时，对话框可能会提示你“你的缓存已过期”。点击对话框上的`Yes` 按钮立即更新它。\n\
  \n![image](img/hot.jpg)\n\n右键点击组件可以显示右键菜单，其中提供了配置选项以及从桌面移除组件的选项。\n\n### 调整任务栏\n\n\
  ![image](img/pg32_1.jpg)\n\n任务栏面板包含每个运行应用程序窗口的图标，你可以点击该图标将最小化的窗口恢复到原始大小。有用的是，你可以将鼠标光标悬停在最小化应用的图标上，查看该窗口的缩略图预览：\n\
  \n![image](img/pg32_2.jpg)\n\n此外，你可以在任务栏面板添加实用的应用程序（Applets）：\n\n![image](img/1r.jpg)右键点击`Taskbar`打开右键菜单\n\
  \n![image](img/pg32_3.jpg)\n\n![image](img/2r.jpg)选择`Applets`选项 – 打开“Applets”设置窗口\n\
  \n![image](img/pg32_4.jpg)\n\n![image](img/hot.jpg)\n\n你可以点击此右键菜单中的`Panel settings`项目，以获得自动隐藏任务栏面板、添加更多面板以及编辑面板的选项。\n\
  \n![image](img/hot.jpg)\n\n注意，`Applets`设置窗口的功能与此处描述的`Desklets`设置窗口非常。\n\n![image](img/3r.jpg)点击`Manage`\
  \ 按钮从已安装的应用列表中选择，或点击`Download` 按钮安装另一个应用 – 例如，下载“Weather”应用\n\n![image](img/4r.jpg)点击`Manage`\
  \ 按钮并选择天气应用，然后点击`+ Add` 按钮将其添加到任务栏面板\n\n![image](img/5r.jpg)天气应用应该会自动检测你的位置，但同时也允许你选择位置。右键点击该应用，然后选择`Configure`选项。\n\
  \n![image](img/pg33_1.jpg)\n\n![image](img/6r.jpg)在天气设置窗口中，点击`Location`按钮，然后将`Manual\
  \ Location`按钮滑到“On”。\n\n![image](img/pg33_2.jpg)\n\n![image](img/7r.jpg)接下来，在`Location`框中输入首选城市名称，然后关闭窗口。\n\
  \n![image](img/8r.jpg)现在，点击任务栏应用查看你所选位置的天气。\n\n![image](img/pg33_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n右键点击应用可以显示右键菜单，其中提供了配置选项以及从桌面移除应用的选项。\n\n### 启动应用程序\n\n![image](img/pg34_1.jpg)\n\
  \n在 Linux Mint 中可以从（开始）菜单启动应用程序，并轻松地将启动器添加到任务栏或桌面，以便频繁使用应用程序：\n\n![image](img/1r.jpg)点击任务栏左侧的![image](img/pg34_2.jpg)\
  \ `Menu` 按钮，然后将鼠标指针悬停在`Accessories`类别上，查看该类别的应用程序列表。\n\n![image](img/2r.jpg)在 Accessories\
  \ 菜单列表中点击`Text Editor`项目启动文本编辑器应用。\n\n![image](img/pg34_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n你还可以在此`Search` 框中输入应用名称来查找它。\n\n![image](img/hot.jpg)\n\n侧边栏中的启动器是“收藏”。你可以在右键菜单中选择`Add\
  \ to favorites`向侧边栏添加启动器。\n\n![image](img/3r.jpg)右键点击 Accessories 菜单中的 Text Editor\
  \ 项目，然后从右键菜单选择`Add to panel`在任务栏创建一个启动器按钮。\n\n![image](img/pg34_4.jpg)\n\n![image](img/4r.jpg)点击已添加到任务栏的新启动器以启动文本编辑器。\n\
  \n![image](img/pg35_1.jpg)\n\n![image](img/5r.jpg)右键点击 Accessories 菜单中的 Text Editor\
  \ 项目，然后从右键菜单选择`Add to desktop`在桌面上创建一个启动器图标。\n\n![image](img/6r.jpg)点击已添加到桌面的启动器以启动文本编辑器。\n\
  \n![image](img/pg35_2.jpg)\n\n![image](img/5r.jpg)右键点击 Accessories 菜单中的 Text Editor\
  \ 项目，然后从右键菜单选择`Add to desktop`在桌面上创建一个启动器图标。\n\n![image](img/pg35_3.jpg)\n\n点击已添加到桌面的启动器以启动文本编辑器。\n\
  \n![image](img/pg35_4.jpg)\n\n![image](img/5r.jpg)右键点击 Accessories 菜单中的 Text Editor\
  \ 项目，然后从右键菜单选择`Add to desktop`在桌面上创建一个启动器图标。\n\n![image](img/pg35_5.jpg)\n\n![image](img/6r.jpg)点击已添加到桌面的启动器以启动文本编辑器。\n\
  \n![image](img/pg36_1.jpg)\n\n![image](img/7r.jpg)\n\n要删除任务栏上的启动器，右键点击它并选择删除。你也可以根据精确命令创建一个桌面启动器。\n\
  \n![image](img/hot.jpg)\n\n在启动器属性对话框输入名称和命令，然后点击`OK` 按钮创建它。\n\n![image](img/pg36_2.jpg)\n\
  \n![image](img/8r.jpg)\n\n![image](img/pg37_3.jpg)\n\n![image](img/hot.jpg)\n\n\
  你还可以从终端提示符启动应用。只需在此输入应用的命令然后按回车键启动它。\n\n### 编辑菜单\n\n![image](img/pg36_1.jpg)\n\n\
  像 Linux Mint 系统的许多事物一样，开始菜单可以根据你的喜味进行定制：\n\n![image](img/1r.jpg)右键点击任务栏左侧的`Menu`\
  \ 按钮，然后选择`Configure`选项。\n\n![image](img/pg36_2.jpg)\n\n![image](img/2r.jpg)点击`Panel`\
  \ 按钮并将`Use icon and label`切换按钮滑到“On”。\n\n![image](img/3r.jpg)从`Appearance`和`Behavior`选择选项，例如更改菜单按钮的`Text`值。\n\
  \n![image](img/pg36_3.jpg)\n\n![image](img/4r.jpg)查看你的选择已立即应用到菜单中。\n\n![image](img/5r.jpg)点击此右键菜单中的`Panel\
  \ settings`项目，以获得自动隐藏任务栏面板等等选项。\n\n![image](img/pg36_4.jpg)\n\n![image](img/hot.jpg)\n\
