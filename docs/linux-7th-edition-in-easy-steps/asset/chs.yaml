  \ 菜单来指定下载管理的方式。\n\n## 获取更多应用\n\n![image](img/pg86_1.jpg)\n\n除了你的 Linux 发行版提供的应用外，还有许多可以轻松安装的免费应用。Linux\
  \ Mint 发行版包含一个软件管理器实用程序，允许你按名称或类别搜索更多应用。当你选择一个应用时，会有描述、截图以及用户评论，帮助你决定是否要安装该应用：\n\
