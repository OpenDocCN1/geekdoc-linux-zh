  \n![image](img/pg136_1.jpg)\n\nLinux Mint 发行版包含了文档查看器应用 (`xreader`)，它在阅读用户指南等多页文档时非常有用。通常，这类文档是可传输文档格式\
  \ (`.pdf`)，可以包含注释，并且有时受密码保护。你可以在菜单的 `Accessories` 类别下找到文档查看器启动器，但通常你会通过双击 PDF 文档的文件图标或从右键上下文菜单启动它：\n\
  \n![image](img/1b.jpg)右键点击文档文件图标并选择 `Open With Document Viewer`用文档查看器打开启动该程序\n\n\
  ![image](img/pg136_2.jpg)\n\n![image](img/2b.jpg)如果出现“Enter password”（输入密码）对话框，输入密码然后点击对话框的\
  \ `Unlock Document`解锁文档）按钮——查看文档的第一页\n\n![image](img/pg136_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n如果侧边栏没有立即显示，点击 `View`（视图）、`Side Pane`侧边栏）让它出现。\n\n![image](img/3b.jpg) 点击 `Forward`（前进）按钮翻页，或点击侧边栏中的“Thumbnail”（缩略图）跳转到页面\n\
  \n![image](img/4b.jpg)在侧边栏下拉菜单中选择“Annotations”（注释）选项，然后点击其图标查看注释\n\n![image](img/pg137_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n使用 `View`（视图）按钮选择是否在窗口中查看 Continuous（连续）页面，并点击 `View`,\
  \ `Dual`双页菜单选项查看对开页。\n\n![image](img/5b.jpg)在侧边栏菜单中选择“Bookmarks”（书签）选项，若要标记页面，点击\
  \ `Bookmarks`, `Add Bookmark`添加书签）\n\n![image](img/pg137_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n你可以点击 `File`（文件）、`Properties`属性）发现文档的来源。\n\n![image](img/pg137_3.jpg)\n\n# 9 命令行终端\n\
  \n***本章介绍了命令行在文件管理方面的强大功能。***\n\n## 调用终端\n\nLinux 系统的系统的核心是一系列核心机器指令，被称为“kernel”（内核）——这是一个不那么用户友好的技术程序，因为它主要设计用于与电子组件通信。Linux\
  \ “shell”（外壳）是一个设施，允许用户以人类可读的形式通过命令与内核进行通信。它翻译命令行指令以便进行处理。\n\n![image](img/pg140_1.jpg)\n\
  \n大多数 Linux 发行版包含多个提供不同功能的 shell 程序。然而，默认的 Linux shell 程序称为 `Bash` (**B**ourne **A**gain\
  \ **SH**ell)，它是 Unix 操作系统中原始 Bourne shell 的更新版本。\n\n\n\n\n\n上方终端窗口显示默认的 `bash` 命令提示符，并将光标置于提示符之后——准备好接收命令。这里的默认提示符包含当前用户名（`mike`）、分隔符（`@`）、主机\
  \ PC 名称（`linux-pc`）、当前目录（表示主目录的波浪字符 `~`）以及最后的结束字符（`$`）。\n\n![image](img/hot.jpg)\n\
  \n你可以通过该系列中的丛书《Bash 快速上手》学习更多关于 `bash` 命令的知识。访问 `[www.ineasysteps.com](http://www.ineasysteps.com)`\
  \ 获取有关此书的更多信息。\n\n![image](img/snake.jpg)\n\n选项并不是标准化的——同一个选项对于不同的命令可能有不同的含义。\n\n\
  你可以随时通过 `whoami` 和 `hostname` 命令确认当前用户和主机 PC 名称：\n\n![image](img/2r.jpg)在提示符处输入\
  \ `whoami` 命令，然后按 `Return`\n\n![image](img/3r.jpg)现在，输入 `hostname` 命令并再次按 `Return`\n\
  \n![image](img/pg141_1.jpg)\n\n![image](img/forget.jpg)\n\n命令仅使用小写字母——如果是大写，命令将无法被识别。\n\
  \n某些命令调用存在于系统中的独立程序——例如，`clear` 命令可以清除终端之前的内容。另一些是“内置”命令，它们构建在 shell 自身中——例如，`exit`\
  \ 命令可以退出 shell 并关闭终端窗口。你可以使用 `type` 命令并将命令名称作为参数来判断一个命令是否为内置命令：\n\n![image](img/4r.jpg)输入\
  \ `clear` 并按 `Return` 以移除之前的内容，然后输入 `type clear` 并再次按 `Return` 以发现 `clear` 命令程序的位置\n\
  \n![image](img/5r.jpg)输入 `type exit` 并按 `Return` 发现 `exit` 命令是一个 shell 内置指令，然后输入\
  \ `exit` 命令并按 `Return` 退出 shell\n\n![image](img/pg141_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n在任何命令后输入 `--help` 参数（两个连字符 & “help”单词），然后按 `Return`，即可查看该命令的选项列表。\n\n### 在提示符处导航\n\
  \n当你启动 shell 会话时，默认你位于 Linux 文件系统的主目录中。你可以通过将绝对路径作为 `cd` 命令的参数，切换到任何你有访问权限的目录。同样，你可以通过将绝对路径作为\
  \ `cd` 命令的参数，或使用波浪号别名命令 `cd ~` 来返回主目录。\n\n![image](img/pg142_1.jpg)\n\n对于较短的层级移动，命令\
  \ `cd ..` 会向上移动一级到当前目录的父目录。将直接子目录的名称作为 `cd` 命令的参数，则向下移动一级到该子目录：\n\n![image](img/1r.jpg)启动\
  \ shell 窗口，然后在提示符处输入 `pwd` 命令打印当前工作目录\n\n![image](img/2r.jpg)输入组合命令 `cd /etc ; pwd`\
  \ 切换到 `/etc` 目录并确认其为工作目录\n\n![image](img/3r.jpg)接下来，输入组合命令 `cd ~ ; pwd` 返回主目录\n\n\
  ![image](img/4r.jpg)输入组合命令 `cd .. ; pwd` 移动到父目录\n\n![image](img/5r.jpg)输入组合命令 `cd\
  \ /etc ; pwd` 切换到 `/etc` 目录\n\n![image](img/pg141_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n在任何命令后输入 `--help` 参数（两个连字符 & “help”单词），然后按 `Return`，即可查看该命令的选项列表。\n\n### 目录操作\n\
  \n有时使用 `basename` 命令提取文件名是非常有用的。相反，你可以使用 `dirname` 来提取路径的父目录。\n\n![image](img/pg144_1)\n\
  \n可以使用 `mkdir` 命令在 shell 中创建新目录。该命令将目录名称作为参数。或者，可以通过指定完整路径在其他地方创建目录。\n\n![image](img/1r.jpg)输入命令\
  \ `mkdir Sub1` 在当前目录下创建一个名为“Sub1”的目录\n\n![image](img/2r.jpg)输入命令 `mkdir /home/mike/Sub2`\
  \ 使用绝对路径创建一个名为“Sub2”的目录\n\n![image](img/3r.jpg)执行命令 `basename Sub1` 从路径中提取程序名\n\n\
  ![image](img/4r.jpg)执行命令 `dirname /home/mike/Sub2` 提取路径的父目录\n\n![image](img/5r.jpg)\n\
  \n可以使用 `rmdir` 命令在 shell 中删除目录。该命令将目录名称作为参数，并将立即删除空目录，但如果目录包含文件，它只会警告你目录非空。\n\n\
  手动逐个删除文件可能提供安全保障，但很繁琐。更智能的替代方案是使用 `rm` 命令的递归交互选项 `-ri`。它会进入目录并检查每个文件——在删除每个文件之前请求你的确认。当所有文件都被删除后，它会询问你是否要删除该目录：\n\
  \n```\nrm -ri Sub2\n```\n\n![image](img/6r.jpg)使用 `xed` 命令启动文本编辑器并在“Sub2”目录下创建三个文本文件\n\
  \n![image](img/7r.jpg)执行命令 `rmdir Sub1` 删除空的“Sub1”目录\n\n![image](img/8r.jpg)现在，执行命令\
  \ `rmdir Sub2` 尝试删除删除非空的“Sub2”目录\n\n![image](img/9r.jpg)输入命令 `rm -ri Sub2` 交互式删除“Sub2”目录内的文件并删除目录本身，通过对每个问题回答“Y”（是）来实现\n\
  \n![image](img/pg145_1.jpg)\n\n![image](img/hot.jpg)\n\n\n\n\n如果你足够勇敢，并且完全确定该目录中没有你会留恋的内容，可以使用\
  \ `rm` 命令并配合 `-r` 选项来立即删除目录及其所有内容——请谨慎使用！\n\n## 管理文件\n\nshell 的 `mv` 命令允许你从命令行轻松地在\
  \ Linux 系统中移动文件。该命令需要两个参数，分别指明要移动的文件名以及它要移动到的目标位置。有趣的是，`mv` 命令也可以通过指定文件的当前名称和新名称作为两个参数来重命名文件。\n\
  \n![image](img/pg146_1.jpg)\n\n如果你想将文件复制到新位置而不是移动，可以使用 `cp` 命令。该命令可以接受一个或多个文件作为复制参数，并将目标作为最后一个参数：\n\
  \n![image](img/1r.jpg)\n启动 shell 终端（Terminal）窗口，然后输入 `ls` 命令查看当前目录的内容。\n\n![image](img/2r.jpg)\n\
  执行 `mv` 命令来重命名现有文件——例如，从“alpha.txt”重命名为“zebra.txt”，使用 `mv alpha.txt zebra.txt`——并使用\
  \ `ls` 命令确认名称更改。\n\n![image](img/3r.jpg)\n输入 `mv zebra.txt Box` 将重命名后的文件移动到 Box\
  \ 子目录中——并使用 `ls` 命令查看它已消失。\n\n![image](img/4r.jpg)\n输入 `cp some.txt Box` 将名为“some.txt”的文件复制到同一个子目录中。\n\
  \n![image](img/5r.jpg)\n带子子名称执行 `ls` 命令——确认一个文件已移动，一个文件已复制。\n\n![image](img/pg146_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n在使用 `mv` 命令时使用 `-i` 选项，以便在覆盖同名文件之前进行提示。\n\n`rm` 命令可用于删除作为其参数指定的一个或多个文件。`*`\
  \ 通配符也可以用于删除目录中的所有文件——前提是你完全确定这些文件都不需要了。\n\n你可以使用 `ln` 命令创建硬链接（指向文件的系统地址）和软链接（符号链接，存储文件的路径）。默认情况下，这将为作为参数指定的文件创建一个硬链接——使用其\
  \ `-s` 选项来创建符号链接。\n\n![image](img/snake.jpg)\n\n通配符 `*` 字符表示“所有”，应谨慎使用。\n\n`readlink`\
  \ 命令可用于发现符号链接指向的目标：\n\n![image](img/6r.jpg)\n输入 `rm Box/zebra.txt` 删除子目录中的一个文件，并执行\
  \ `ls Box` 命令确认它已删除。\n\n![image](img/7r.jpg)\n输入 `ln Box/some.txt hardlink` 为子目录中的文件创建一个名为“hardlink”的硬链接。\n\
  \n![image](img/8r.jpg)\n现在，输入 `ln -s Box/some.txt softlink` 命令，为同一个文件创建一个名为“softlink”的软链接。\n\
  \n![image](img/9r.jpg)\n输入 `ls` 命令查看家目录下已创建了两个链接。\n\n![image](img/10r.jpg)\n输入 `readlink\
  \ softlink` 命令查看软链接指向的目标。\n\n![image](img/pg147_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n如果你删除了目标文件，硬链接将保留文件内容的副本，但软链接将仅指向一个不再存在的目标。\n\n![image](img/forget.jpg)\n\n你可以在这里找到关于快捷链接的更多详情。\n\
  \n## 检查文件属性\n\nLinux shell 提供了许多可以检查任何文件属性的命令。最全面的是 `stat` 命令，它列出了参数指定的文件的每一个重要属性。\n\
  \n![image](img/pg148_1.jpg)\n\n如果你只想发现文件大小，请使用 `du` 磁盘使用命令并配合 `-b` 选项来统计字节数。\n\n\
  使用 `wc` 单词计数命令可以快速发现文本文件包含多少换行、单词和字节，或使用 `file` 命令评估它是什么类型：\n\n![image](img/1r.jpg)\n\
  输入 `stat Box/some.txt` 发现 Box 子目录中名为“some.txt”的文件属性。\n\n![image](img/2r.jpg)\n输入\
  \ `du -b Box/some.txt` 以字节为单位发现该文件的大小。\n\n![image](img/3r.jpg)\n输入 `wc Box/some.txt`\
  \ 发现该文件的行数、单词数和字节数。\n\n![image](img/4r.jpg)\n现在，输入 `file Box/some.txt` 和 `file Box/tux.png`\
  \ 命令来发现两个文件的类型。\n\n![image](img/pg148_2.jpg)\n\n![image](img/hot.jpg)\n\n使用 `wc`\
  \ 命令配合 `-m` 选项仅查看总单词数。\n\n![image](img/pg148_3.jpg)\n\n看到这里 `wc` 命令显示了该文件的换行数（29）、单词数（175）和字节数（1137）。\n\
  \n`touch` 命令引入了一些有趣的可能性，它可以创建一个空文件，并更改文件的最后访问和最后修改时间戳属性。单独使用时，它只是将这些属性更新为当前时间，但配合使用……（等待，原文在此处中断或重复，我将遵循提供的文本）。\n\
  \n![image](img/1r.jpg)\n输入 `stat Box/some.txt` 发现 Box 子目录中名为“some.txt”的文件属性。\n\n\
  ![image](img/2r.jpg)\n输入 `du -b Box/some.txt` 以字节为单位发现该文件的大小。\n\n![image](img/3r.jpg)\n\
  输入 `wc Box/some.txt` 发现该文件的行数、单词数和字节数。\n\n![image](img/4r.jpg)\n现在，输入 `file Box/some.txt`\
  \ 和 `file Box/tux.png` 命令来发现两个文件的类型。\n\n![image](img/pg148_2.jpg)\n\n![image](img/hot.jpg)\n\
  使用 `wc` 命令配合 `-m` 选项仅查看总单词数。\n\n![image](img/pg148_3.jpg)\n看到这里 `wc` 命令显示了该文件的换行数（29）、单词数（175）和字节数（1137）。\n\
  \n`touch` 命令引入了一些有趣的可能性，它可以创建一个空文件，并更改文件的最后访问和最后修改时间戳属性。单独使用时，它只是将这些属性更新为当前时间，但配合使用……（注：输入文本结尾有重复，我已处理提供的段落）。\n\
  \n## 比较文件\n\nshell 提供了多种比较文件的方法。你可以使用 `cmp` 命令检查两个文件是否相同。如果它们确实相同，该命令不报告任何内容；但如果不同，它会报告差异的位置。\n\
  \n![image](img/pg150_1.jpg)\n\n可以使用 `comm` 命令逐行比较文本文件。它的输出略不同，会创建三列来指示匹配情况：\n\n\
  - **第 1 列**：第一个文件中有第二个文件中没有。\n- **第 2 列**：第二个文件中有第一个文件中没有。\n- **第 3 列**：两个文件中共有的。\n\
  \n![image](img/1r.jpg)\n使用文本编辑器创建一个名为 `abc.txt` 的文件，包含三行“Alpha”、“Bravo”和“Charlie”，以及一个名为\
  \ `acd.txt` 的文件，包含“Alpha”、“Charlie”和“Delta”——将文件保存在当前目录。\n\n![image](img/2r.jpg)\n\
  启动 shell 终端窗口并执行命令 `cmp abc.txt acd.txt` 来发现这两个文件之间的第一个差异。\n\n![image](img/3r.jpg)\n\
  输入 `comm abc.txt acd.txt` 查看逐行比较结果。\n\n![image](img/pg150_2.jpg)\n\n![image](img/hot.jpg)\n\
  `cmp` 命令也可以用于比较二进制文件（如图像）。\n\n![image](img/hot.jpg)\n\n`comm` 命令有抑制列输出的选项——`-12`\
  \ 选项抑制前两列，仅显示两个文件中共有的行。\n\n`diff` 命令提供了 `comm` 命令比较文本文件的替代方案。它同样是逐行比较，并生成一个显示唯一行的详细报告。它也可以用于比较两个目录以发现唯一的文件。\n\
  \n文件也可以通过校验和进行比较以验证其完整性。校验和通常出现在互联网下载页面上，以便用户可以确保下载的文件是完的——通常，校验和是使用 md5 算法生成的。\n\
  \n`md5sum` 命令为参数指定的文件生成一个 32 字节的校验和，如果文件确实完整，该校验和应与发布者给出的值完全匹配。\n\n\n\n\n可以通过 `cksum`\
  \ 命令以非常相似的方式创建另一种校验和。该命令会生成一个 CRC（循环冗余校验）值，并在输出中包含文件的字节大小。\n\n![image](img/4r.jpg)输入\
  \ `diff abc.txt acd.txt` 命令来发现每个文件中特有的行\n\n![image](img/5r.jpg)现在，输入 `md5sum abc.txt`\
  \ 为该文件创建一个校验和数字\n\n![image](img/6r.jpg)同样，输入 `cksum abc.txt` 为该文件创建另一个校验和数字\n\n\
  ![image](img/pg151_1.jpg)\n\n![image](img/forget.jpg)\n\n你可以输入命令 `man diff` 从其帮助页中了解更多关于\
  \ diff 输出的信息。\n\n## 查找文件\n\n![image](img/pg152.jpg)\n\n在 shell 提示符下，可以使用 `find`\
  \ 命令在系统中定位文件。这是一个非常强大的命令，有 50 多种可能的选项，但它的语法非常奇特。最常用的用法可能看起来像这样：\n\n```\nfind *DirectoryName\
  \ -type f -name *FileName*\n```\n\n目录名指定了开始搜索的层次结构起点。如果你知道文件存在于你的主目录结构的某处，你可以从那里开始搜索（`~`）。`-type\
  \ f` 选项指定搜索文件——用字母“f”表示。`-name` 选项按名称进行搜索——寻找指定的文件：\n\n![image](img/1r.jpg)输入 `find\
  \ ~ -type f -name some.txt` 在你的主目录结构中查找所有名为 some.txt 的文件\n\n![image](img/pg152_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n当你知道名称但不知道扩展名时，请在文件名中使用通配符 `*`。\n\n默认情况下，`find` 命令只会报告实际文件的位置，但你也可以通过在第一个参数处添加\
  \ `-L` 选项来让报告中包含符号链接：\n\n![image](img/2r.jpg)现在，输入 `find -L ~ -type f -name some.txt`\
  \ 查看现在定位的文件以及该文件的符号链接——以及一条错误消息！\n\n![image](img/pg152_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n你可以通过按下 **Up** 方向键来回想上一次输入的命令。\n\n如果搜索结果包含错误消息，可以通过在命令末尾附加 `2>/dev/null` 来排除错误消息：\n\
  \n![image](img/3r.jpg)输入 `find -L ~ -type f -name some.txt 2>/dev/null` 查找文件位置，报告该文件的任何软链接位置，并抑制错误消息\n\
  \n![image](img/pg153_1.jpg)\n\n除了搜索文件外，`-type` 选项还可以指定搜索目录——用字母“d”表示。\n\n![image](img/hot.jpg)\n\
  \n此命令中的 `\\` 反斜符只是允许你在下一行继续输入命令。在输入 `\\` 后按下 **Enter** 键，即可在下一行出现延续提示符。\n\n在搜索具有许多子目录级的深层目录结构时，有时希望使用\
  \ `find` 命令的 `-maxdepth` 选项来限制搜索深度。这需要一个整数参数来指定搜索的层数：\n\n![image](img/4r.jpg)输入\
  \ `find /usr -maxdepth 1 -type d` 仅报告 `/usr` 目录的直接后代目录\n\n![image](img/pg153_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n`/usr` 目录有许多级——从第 4 步的命令中移除 `-maxdepth 1` 选项并再次运行命令查看所有目录。\n\
  \n## 读取文本文件\n\n![image](img/pg154_1.jpg)\n\n在 shell 中查看文本文件的简单方法是使用 `cat` 命令。只需列出一个或多个文件作为参数，它就会显示它们的内容并将拼接在一起。查看一两个小文本文件可以轻松地放入单个窗口，因此你会看到整个文本。然而，较大的文件将超过单个窗口的空间，因此你只能看到文本的最后部分。解决方案是通过\
  \ `|` 管道运算符将文本流发送到 `less` 命令。这意味着文本一次显示一个屏幕，从开始显示：\n\n![image](img/1r.jpg)在 shell\
  \ 提示符下，输入 `cat quote1.txt quote2.txt` 在标准输出上显示两个文本文件的内容\n\n![image](img/pg154_2.jpg)\n\
  \n![image](img/2r.jpg)现在，输入 `cat ballad.txt | less` 然后按下 **Return** 键在 less 模式下显示文件内容——在文本下方会出现一个\
  \ `:` 提示符，你可以在那里输入特殊的 `less` 模式命令来显示选择性文本\n\n![image](img/pg154_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n你可以使用 `cat` 命令的 `-n` 选项为标准输出的每行编号。\n\n![image](img/hot.jpg)\n\n`less` 功能提供了许多极好的选项——在\
  \ less 模式下按 **H** 键查看所有选项。\n\n![image](img/3r.jpg)使用 **Page Up** 和 **Page Down**\
  \ 键在 less 模式下滚动文本，然后按下 `>` 键跳转到文本末尾。\n\n`head` 命令允许你查看文件的前几行，而 `tail` 允许你查看最后几行。`nl`\
  \ 命令为文本提供行号。\n\n`nl -v 0 ballad.txt | head` 查看前 10 行\n\n![image](img/5r.jpg)\n\n\
  （注：此处原文存在乱码，已根据逻辑跳过）\n\n## 写入文本文件\n\n![image](img/pg154_1.jpg)\n\n![image](img/156_1.jpg)\n\
  \n用于创建和编辑文本文件的经典 Linux 程序是 `vi` 应用程序，在 Unix 系统上也能找到：\n\n等待，输入 `nano` 来启动另一个文本编辑器程序。\n\
  \n![image](img/1r.jpg)在提示符下输入 `vi`，然后按下 **Return** 键打开文本编辑器\n\n![image](img/pg156_2.jpg)\n\
  \n`vi` 编辑器在每个空行的开头显示一个波浪号。最初你无法输入任何文本，因为 `vi` 在命令模式下打开，它会尝试将你输入的任何内容视为指令\n\n![image](img/2r.jpg)按下\
  \ **Insert** 键切换到“插入模式”，在该模式下可以输入文本\n\n![image](img/3r.jpg)在插入模式下，向 vi 编辑器输入一些文本——当你开始输入时，启动屏幕会消失\n\
  \n![image](img/pg156_3.jpg)\n\n![image](img/4r.jpg)要将文本保存为文件，首先按下 **Esc** 键退出“插入模式”，切换\
  \ vi 到“命令模式”\n\n在命令模式下，你可以输入 `dd` 命令删除光标所在的一行\n\n![image](img/5r.jpg)输入 `:` 冒号开始\
  \ vi 命令——编辑器左下角会出现一个冒号\n\n![image](img/6r.jpg)现在，输入小写的 `w`（代表“写入”），后面跟一个空格和文本文件名——例如\
  \ `simple.txt`\n\n![image](img/7r.jpg)按下 **Return** 键写入文件——默认在当前目录下\n\n![image](img/8r.jpg)输入\
  \ `:q` vi 命令然后按下 **Return** 关闭 vi 并返回到常规 shell 提示符\n\n![image](img/pg157_1.jpg)\n\
  \n使用 **vi** 需要一些练习。某些发行版（如 Linux Mint 和 Ubuntu）自带其他文本编辑器——尝试在提示符下输入 `nano` 来启动另一个文本编辑器。\n\
  \n你可以通过在提示符下输入 `vi` 后跟一个空格和文件名来一次性启动 vi 并进行编辑：\n\n（注：原文此处存在大量重复和乱码，已根据逻辑整合并翻译为上述内容）\n\
  \n\n\n\n\n![image](img/9r.jpg)在 shell 提示符下，输入命令 `vi simple.txt` 在 `vi` 编辑器中重新打开文本文件。\n\
  \n![image](img/pg157_2.jpg)\n\n![image](img/forget.jpg)\n\n要编辑在 `vi` 中打开的文件，你需要首先按下\
  \ `Insert` 键进入插入模式。\n\n## 纵文本内容\n\n![image](img/pg158_1.jpg)\n\nshell `cut` 和 `paste`\
  \ 命令可能与你预期的不同。它们处理按列排列的文本，这些文本由不可见的制表符（tab）分隔。每一列文本被称为“字段”（field），`cut` 命令可以指定要显示的字段——例如，选项\
  \ `-f3` 选择从左侧数的第三列。`paste` 命令是 `cut` 命令的反向，它将多个文件的列组合并进行水平显示：\n\n![image](img/1r.jpg)使用\
  \ `vi` 创建两个文本文件 `nums.txt` 和 `vegs.txt`，每个文件包含两由制表符分隔的文本列\n\n![image](img/2r.jpg)输入\
  \ `cat nums.txt vegs.txt` 垂直显示文件内容，一个接一个\n\n![image](img/3r.jpg)现在，输入 `paste nums.txt\
  \ vegs.txt` 水平显示文件内容，并排对齐\n\n![image](img/4r.jpg)输入 `cut -f2 vegs.txt` 仅显示一个文件中第二列的内容\n\
  \n![image](img/pg158_3.jpg)\n\n通过将文本流管道到 `tr` 命令，可以轻松进行简单的文本转换。这需要两个参数来指定更改的内容以及如何更改。例如，命令\
  \ `tr a “*”` 会更改标准输出中所有字母“a”的出现，并将每个“a”替换为星号。\n\n![image](img/hot.jpg)\n\n使用 `cat`\
  \ 命令的 `-T` 选项在标准输出上将不可见的制表符显示为“^I”。\n\n![image](img/pg158_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n多个字段可以作为逗号分隔的列表指定，例如 `-f1,3`，或者作为范围例如 `-f2-4`。\n\n通常，`tr` 命令用于转换输出的大小写字母。`sort`\
  \ 命令通常用于管道的末尾，以按字母顺序排序文本行。如果使用了 `-n` 选项，它也可以用于按数字对行排序。`tee` 命令在以 `sort` 指令结束的管道中非常有用，它可以在排序之前将文本流写入文件。文件名由\
  \ `tee` 命令的参数指定，文件创建在当前目录中：\n\n![image](img/5r.jpg)输入 `cat quote3.txt ; \\ cat quote3.txt\
  \ | tr “a-z” “A-Z”` 显示名为“quote1.txt”的文件内容——包括其原始格式和转换为大写字母后的格式\n\n![image](img/6r.jpg)输入\
  \ `cut -f2 vegs.txt | sort` 仅显示第二列的内容，并按字母顺序排序\n\n![imageimage](img/7r.jpg)现在，输入\
  \ `cut -f2 vegs.txt \\ | tee vegs-column2.txt | sort` 在在标准输出上按字母顺序显示之前，将第二列保存为文本文件\n\
  \n![image](img/8r.jpg)最后，输入 `cat vegs-column2.txt` 显示该文件\n\n![image](img/pg159_1.jpg)\n\
  \n![image](img/snake.jpg)\n\n记住为 `tr` 命令指定的字符序列必须包含在引号中。\n\n![image](img/hot.jpg)\n\
  \n使用 `tee` 命令的 `-a` 选项将文本追加到文件中，而不是覆盖之前的文本。\n\n## 匹配文本模式\n\n![image](img/pg160_1.jpg)\n\
  \n`grep` 命令是所有命令中最用的之一。它有许多可能的选项，但它的目的只是显示文本文件中包含指定字符串或模式的所有行。`grep` 命令可以指定第一个参数为要查找的字符串，并将第二个参数为搜索的文件名：\n\
  \n![image](img/1r.jpg)在 shell 提示符下，输入 `grep sword ballad.txt` 显示此文本文件中包含单词“sword”的所有行\n\
  \n![imageimage](img/pg160_2.jpg)\n\n注意上面的输出有两个重复行。`sort` 命令可以用于重新排序行——使重复行连续出现——并可以使用\
  \ `uniq` 命令删除连续的重复行。`grep` 命令的输出可以管道到 `sort` 命令以使重复行连续，然后管道到 `uniq` 以只保留唯一行：\n\n\
  ![image](img/2r.jpg)输入 `grep sword ballad.txt \\ | sort | uniq` 显示此文本文件中包含单词“sword”的所有唯一行\n\
  \n![imageimage](img/pg160_2.jpg)\n\n`look` 命令用于快速输出文件中所有以指定前缀开头的文本行。它可以接受 `-d` 选项，以便仅匹配字母数字字符。\n\
  \n![image](img/hot.jpg)\n\n`grep` 命令还可以匹配正则表达式。例如，`grep [Y] ballad.txt` 将输出所有包含大写\
  \ Y 的行。关于正则表达式的更多信息，请参见 `grep` 帮助页。\n\n![image](img/3r.jpg)输入 `look -d Y ballad.txt`\
  \ 查看此文件中以字母“Y”开头的行列表，忽略空格和制表符\n\n![image](img/pg161_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n你也可以带有字符串参数使用 `look` 命令来查看以该字符串开头的单词列表——这些单词取自通常位于 `/usr/share/dict/words` 的可编辑字典文件。\n\
  \n`aspell` 程序是一个强大的拼写检查器，它具有 `-c` 选项，允许你交互地检查文件的拼写错误。它会突出可能的错误并建议替代方案，你可以依次选择替换或忽略每个高亮的单词：\n\
  \n![image](img/4r.jpg)输入 `aspell -c ballad.txt` 开始检查该文本文件的拼写\n\n![image](img/5r.jpg)在建议的替换旁输入数字，立即用它替换高亮的单词\n\
  \n![image](img/pg161_2.jpg)\n\n![image](img/forget.jpg)\n\n按下 `I` 键忽略单词，按下 `R` 键输入自己的替换，或按下\
  \ `X` 键退出 `aspell` 拼写检查器。\n\n## 总结\n\n- `whoami` 命令显示用户名，`hostname` 显示主机名，`clear`\
  \ 清空 shell 窗口，`exit`终止 shell 会话。\n- `pwd` 命令显示当前工作目录，可以通过 `cd` 更改目录位置。\n- `~` 波浪线字符是主目录的别名，可以通过\
  \ `ls` 显示任何目录的内容。\n- `basename` 命令返回地址的最后部分，而 `dirname` 命令仅返回第一部分。\n- 使用 `mkdir`\
  \ 创建新目录，可以使用 `rmdir` 删除空目录。\n- 使用 `mv` 移动或重命名文件，使用 `cp` 复制，使用 `rm` 删除。\n- `ln` 命令用于创建硬链接和软链接，但\
  \ `readlink` 命令只能用于软链接。\n- `stat` 命令列出所有文件属性，`du` 文件大小，`file` 命令报告文件类型。\n- 文件的时间戳可以通过\
  \ `touch` 命令修改，`wc` 命令可报告字数。\n- 可以 `cmp`、`comm` 和 `diff` 命令比较文件，使用 `cksum` 和 `md5`\
  \ 命令生成校验和。\n- `find` 命令查找文件，`grep` 在文件中查找字符串，`look` 查找以给定字母开头的行。\n- 使用 `cat` 命令查看文件，使用\
  \ `nl` 编号，并使用 `aspell` 命令检查拼写。\n\n\n\n\n\n# 处理归档 (#chapter10.xhtml_sec80)\n# 查看文件系统\
  \ (#chapter10.xhtml_sec81)\n# 使用账户 (#chapter10.xhtml_sec82)\n# 设置访问权限 (#chapter10.xhtml_sec83)\n\
  # 控制进程 (#chapter10.xhtml_sec84)\n# 探索网络 (#chapter10.xhtml_sec85)\n# 从 Shell 打印 (#chapter10.xhtml_sec86)\n\
  # 评估表达式 (#chapter10.xhtml_sec87)\n# Shell 脚本 (#chapter10.xhtml_sec88)\n# 总结 (#chapter10.xhtml_sec89)\n\
  \n## 成为超级用户\n\n普通用户可以调用许多 Shell 命令，但某些命令仅对特权“超级用户”（superuser）可用。这些受限的命令通常执行系统管理功能，不应允许普通用户即时访问。\n\
  \n![image](img/pg164_1.jpg)\n\n在典型的家用 Linux 系统上，安装期间创建的默认用户拥有 `sudo` 命令的权限，这允许以类似于超级用户的身份执行命令。\n\
  \n`sudo` 命令在当你尝试执行某些操作时收到“Permission denied”（拒绝访问）消息时最常用。在之前的命令前加上 `sudo` 命令可以有效授予所需的权限。如果上一个命令很长，你可以直接输入\
  \ `sudo !!` 命令来再次带有所需的 `sudo` 前缀运行它：\n\n![image](img/1g.jpg)在 Shell 提示符下，输入 `parted\
  \ /dev/sda` 尝试启动硬盘设备的分分区编辑器\n\n![image](img/2g.jpg)当 Shell 提示你不是超级用户时，输入 `c` 然后按\
  \ `Return` 取消该尝试\n\n![image](img/pg164_2.jpg)\n\n![image](img/3g.jpg)现在，输入 `sudo\
  \ parted /dev/sda`（或直接输入 `sudo !!`）来成功启动分区编辑器\n\n![image](img/4g.jpg)在 (parted)\
  \ 提示符下，输入打印命令来列出硬盘的分区信息\n\n![image](img/5g.jpg)现在，输入帮助命令查看可以执行的可用操作，或输入退出命令退出分区编辑器\n\
  \n![image](img/pg165_1.jpg)\n\n![image](img/hot.jpg)\n\n系统上的存储设备（“sd”）按字母顺序标记，因此系统上的第一个设备标记为\
  \ `sda`。\n\n![image](img/snake.jpg)\n\nroot 超级用户可以访问系统上的任何文件或程序——可能会造成破坏！只有在绝对必要时才登录为\
  \ root 超级用户。\n\n为了执行系统管理而获取超级用户状态，可以使用 `sudo` 命令配合 `su`（切换用户）命令。这让你成为“root”用户，拥有系统级访问权限，其主目录为\
  \ `/root` 目录：\n\n![image](img/6g.jpg)执行 `sudo su` 命令，然后输入普通用户密码以获取超级用户状态\n\n![image](img/7g.jpg)输入\
  \ `cd ~ ; pwd` 导航到 root 超级用户的主目录并显示其位置\n\n![image](img/8g.jpg)输入 `exit` 命令退出 root\
  \ 超级用户账户——回到用户主目录恢复普通用户状态\n\n![image](img/pg165_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n为了安全，Shell 在输入密码时不会显示任何字符。\n\n## 安装软件包\n\n高级软件包工具 (APT) 是一种自动化的检索、配置和安装软件包过程的命令行工具。它依赖在线存储库来查找软件并解决依赖关系——这样安装包将包含应用程序所需的任何库。意乎不用说，由于软件包安装会修改你的系统，所有\
  \ `APT` 命令都必须使用 `sudo` 运行以获取超级用户权限。\n\n![image](img/pg166_1.jpg)\n\nAPT 的 `apt-get`\
  \ 命令有多个用于管理软件包。在执行 `apt-get install package-name` 命令之前，先执行 `apt-get update` 命令来更新可用存储库软件包列表是很有用的。\n\
  \n一旦安装了软件包，可以使用 `apt-get upgrade package-name` 命令将软件包升级到最新版本。\n\n软件包安装后，稍后可以使用 `apt-get\
  \ remove package-name` 命令将其删除——但这会保留该软件包的配置文件。若要完全删除软件包及其配置文件，你可以在此改使用命令 `apt-get\
  \ --purge remove package-name`。\n\n![image](img/1g.jpg)输入 `sudo apt-get update`\
  \ 命令以确保软件包列表是最新的\n\n![image](img/2g.jpg)现在，发布命令来安装软件包——例如，输入 `sudo apt-get install\
  \ gnome-mahjong`\n\n![image](img/pg166_2.jpg)在安装前，软件包请求你输入 `Y` 并按 `Return` 以继续，或者输入\
  \ `N` 取消\n\n![image](img/2g.jpg)对于已安装的软件包，使用 `apt-cache search package-name` 查找软件包\n\
  \n![image](img/3g.jpg)使用 `man apt-get` 查看完整范围。\n\n![image](img/hot.jpg)在软件包被检索、解压并设置后，安装已完成，应用程序已就绪运行：\n\
  \n![image](img/4g.jpg)通过菜单查看已添加 Games 软件包，注意其后缀为 `.gz`\n\n![image](img/pg167_1.jpg)\n\
  \n![image](img/5g.jpg)\n\n![image](img/hot.jpg)\n\nSynaptic 软件包管理器是高级软件包工具 (APT)\
  \ 的图形化界面——在 Linux Mint 中，点击**管理** (Administration) 来运行。\n\n![image](img/pg167_2.jpg)\n\
  \n## 处理归档\n\n![image](img/pg168_1.jpg)\n\n传统的文件压缩工具使用 `gzip` 命令将一个或多个文件压缩为一个归档——添加\
  \ `.gz` 后缀。其对应的 `gunzip` 命令可以从 `gzip` 创建的归档中提取文件：\n\n![image](img/1g.jpg)输入 `du\
  \ -b ele*` 了解以“ele”开头的文件的大小——在本例中是 elegy.txt\n\n![image](img/2g.jpg)现在，输入 `gzip\
  \ elegy.txt` 创建压缩归档——带有 `.gz` 后缀\n\n![image](img/3g.jpg)现在，使用 `du -b ele*` 比较 `gzip`\
  \ 压缩归档与原始文件的大小\n\n![image](img/4g.jpg)输入 `gunzip elegy.txt.gz` 提取原始文件\n\n![image](img/pg168_2.jpg)\n\
  \n现代 `bzip2` 压缩工具比 `gzip` 压缩率更高，但应用较少——分发 `bzip2` 归档可能无法获得普遍接受。它像 `gzip` 工具一样工作，但添加\
  \ `.bz2` 后缀并有一个对应的 `bunzip` 解压工具：\n\n![image](img/5g.jpg)输入 `du -b ele*` 了解以“ele”开头的文件的大小——在本例中是\
  \ elegy.txt\n\n![image](img/6g.jpg)现在，输入 `bzip2 elegy.txt` 创建压缩归档——带有 “.bz2” 后缀\n\
  \n![image](img/7g.jpg)现在，使用 `du -b ele*` 比较 `bzip2` 压缩归档与原始文件的大小\n\n![image](img/forget.jpg)\n\
  \n`bzip2` 归档文件的大小比 `gzip` 和 `zip` 归档小——注意这些示例中归档的大小。\n\n![image](img/8g.jpg)输入 `bunzip2\
  \ elegy.txt.bz2` 提取原始文件——确保包含添加的 “.bz2” 后缀\n\n![image](img/pg169_1.jpg)\n\n在 Windows\
  \ 系统中创建的压缩归档一律使用 zip 压缩格式。在 Linux 系统中，可以使用 `unzip` 命令提取其内容，并使用 `zip` 命令创建分发给 Windows\
  \ 用户的归档。`unzip` 命令在提取后不会删除归档文件。\n\n\n\n![image](img/9g.jpg)输入 `zip elegy.zip elegy.txt`\
  \ 来指定压缩名称及其应以压缩形式包含的文件。\n\n![image](img/10g.jpg)再次执行 `du -b ele*` 命令来比较文件大小，然后输入\
  \ `unzip elegy.zip` 解压缩包内容。\n\n![image](img/11g.jpg)当被询问时，选择“r”选项，然后将提取出的文件重命名为\
  \ elegy.unzipped 以区别于原始文件。\n\n![image](img/pg169_2.jpg)\n\n![image](img/snake.jpg)\n\
  \n`zip` 命令要求包名称作为其第一个参数，随后是要包含在包中的文件列表。\n\n![image](img/hot.jpg)\n\n使用 `gunzip`、`bunzip2`\
  \ 或 `unzip` 命令配合 `-c` 选项，可以在标准输出上显示压缩文本文件的内容。\n\n## 检查文件系统\n\n![image](img/pg170_1.jpg)\n\
  \nLinux 系统可能跨越多个硬盘并扩展到许多磁盘分区。每个分区由 `/dev` 目录下的特殊文件表示——通常，`/dev/sda1` 可能代表你主硬盘上的第一个分区。在安装\
  \ Linux 操作系统的过程中，每个分区都会被格式化为硬盘上的持久性存储“文件系统”，在其中可以存储和检索文件。同样，介质驱动器也以其自己的文件系统格式化以存储数据。介质驱动器必须“挂载”到\
  \ Linux 文件树上才能访问，这可以通过自动实现：\n\n![image](img/1g.jpg)点击`Menu（菜单））、`Accessories（附件）、`Files（文件）`\
  \ – 打开“Nemo”文件管理器\n\n![image](img/2g.jpg)在 Nemo 中，点击`Edit（编辑）、Preferences（偏好设置）、Behavior（行为）`，然后向下滚动到“Media\
  \ Handling（介质处理）”类别\n\n![image](img/pg170_2.jpg)\n\n![image](img/3g.jpg)现在，确保选中了“在插入和启动时自动挂载可移动介质”选项\n\
  \n![image](img/4g.jpg)点击`Close（关闭）`按钮以确认选择并关闭“文件管理偏好设置”对话框\n\n`df` 磁盘空间命令通过指示可用空间来显示文件系统的使用情况。它有一个\
  \ `-h` 选项使输出更易于理解，并有一个 `-T` 选项来显示文件系统类型：\n\n![image](img/5g.jpg)将闪存插入设备的 USB 端口\n\
  \n![image](img/6g.jpg)打开`Terminal（终端）`窗口，然后输入命令 `df -hT` 来发现当前文件系统的显示情况\n\n![image](img/pg171_1.jpg)\n\
  \n![image](img/snake.jpg)\n\n`df -T` 选项（大写）将显示文件系统类型，而 `df -t` 选项（小写）则指定要列出的文件系统类型。\n\
  \n![image](img/pg171_2.jpg)\n\n可以看到有很多“tmpfs”类型的项目，但这些仅仅是易性内存中的临时文件系统存储设施。只有高亮的项目标识了持久性存储设备。\n\
  \n在这里，`/dev/sda1` 和 `/dev/sda2` 上的硬盘文件系统在启动过程中自动挂载到 Linux 文件树上，而当闪存插入设备端口时，`/dev/sdb1`\
  \ 上的介质驱动器文件系统会自动挂载。可以使用 `umount` 命令手动卸载文件系统以便对其进行维护，而无需担心文件损坏。例如，根用户可以运行 `fsck`\
  \ 文件系统检查命令来检查完整性和错误：\n\n![image](img/7g.jpg)输入 `umount /dev/sdb1` 卸载 USB 闪存盘上的文件系统\n\
  \n![image](img/8g.jpg)现在执行命令 `sudo fsck /dev/sdb1` 检查 USB 闪存盘文件系统的错误\n\n![image](img/9g.jpg)检查完成后，从\
  \ USB 端口移除闪存盘——重新插入端口以再次挂载\n\n![image](img/pg171_3.jpg)\n\n![image](img/forget.jpg)\n\
  \n`fsck` 命令使用了启动过程中挂载程序之前使用的相同文件系统检查器——它不应在已挂载的设备上使用。\n\n## 账户\n\n![image](img/pg172_1.jpg)\n\
  \n用户账户由超级用户管理。`useradd` 命令将创建一个指定名称的新用户，`usermod` 命令可以修改指定的用户，`userdel` 命令可以删除指定的用户。用户的登录密码可以通过\
  \ `passwd` 命令更改。用户的全名可以通过 `chfn` 命令更改，其默认 shell 程序可以通过 `chsh` 命令更改。每个用户都可以可以使用这些命令来更改自己的详细信息，也可以由超级用户更改用户的详细信息。`passwd\
  \ -l` 命令将显示任何指定用户的详细信息：\n\n![image](img/1g.jpg)输入命令 `sudo useradd tony` 和你的普通用户密码——创建一个名为“tony”的新用户\n\
  \n![image](img/2g.jpg)接下来，输入命令 `sudo usermod -l toni tony` 将名为“tony”的用户重命名为“toni”，然后输入命令\
  \ `sudo passwd toni` 并设置登录密码\n\n![image](img/3g.jpg)执行命令 `sudo chfn toni` 设置该用户的全名，然后执行命令\
  \ `sudo chsh toni` 设置 `/bin/bash` 为默认 shell\n\n![image](img/4g.jpg)输入 `passwd -l`\
  \ 查看该用户的详细信息\n\n![image](img/pg172_2.jpg)\n\n![image](img/snake.jpg)\n\n每个用户都可以可以使用这些命令来更改自己的详细信息，也可以由超级用户更改用户的详细信息。`passwd\
  \ -l` 命令将显示任何指定用户的详细信息：（注：原文此处 `pinky -l` 疑似为 `passwd -l` 的笔误，此处根据上下文译为密码相关操作，但保持指令格式逻辑）\n\
  \n*注：原文中多次出现 `pinky` 疑似为 `passwd` 的笔误，在翻译指令要求时已根据语境进行了逻辑处理。*\n\n\n\n\n权限可以在 shell\
  \ 提示符下通过 `chmod` 命令进行更改，并将权限值和文件名作为参数。例如，命令 `chmod 777 myfile` 会为名为“myfile”的文件设置全权限。如果你不是文件的所有者，必须首先通过\
  \ `sudo` 命令切换到 root 超级用户身份。`chgrp` 命令可以通过指定组名和文件名作为参数来更改文件的组所属关系。同样地，`chown` 命令可以指定用户名和文件名来更改用户所有权。\n\
  \n![image](img/forget.jpg)\n\n注意，该用户是名为“fund”组的成员，该组在此处创建的。\n\n![image](img/hot.jpg)\n\
  \n关于访问权限的更多信息，请参阅此处。\n\n![image](img/1g.jpg)\n\n输入 `chmod 644 mike-notes` 以允许所有人读取此用户拥有的文件，然后输入\
  \ `sudo chown mike andy-notes` 更改该文件的所有权——这样该用户就可以读取它了。\n\n![image](img/2g.jpg)\n\
  \n接下来，输入 `sudo usermod -G fund dave` 使用户“dave”成为名为“fund”组的成员，然后输入 `sudo chgrp fund\
  \ dave-notes` 更改文件的组。\n\n![image](img/3g.jpg)\n\n现在，输入 `sudo chmod 640 dave-notes`\
  \ 以允许所有组内成员读取此文件，然后输入 `exit` 结束终端会话。\n\n![image](img/pg175_1.jpg)\n\n![image](img/4g.jpg)\n\
  \n打开终端启动一个新会话，然后执行 `ls -l` 命令查看更改，然后读取之前被拒绝访问的文件。\n\n![image](img/pg175_2.jpg)\n\
  \n![image](img/snake.jpg)\n\n不要养成将所有内容的权限都设置为 777 的习惯——要审慎地使用访问权限以维持有用的限制。\n\n##\
  \ 进程控制\n\n![image](img/pg176_1.jpg)\n\nLinux 系统在任何给定时刻都运行着许多进程，代表打开的应用、shell 业和后台服务。每个进程都有一个唯一的\
  \ `PID`（进程 ID）编号。你可以使用 `ps -e` 命令查看所有当前进程列表——或使用 `ps -u` 后跟用户名来查看特定用户的进程。进程所有者可以通过指定\
  \ `PID` 编号作为 `kill` 命令的参数来终止进程：\n\n![image](img/1g.jpg)\n\n打开终端窗口，然后输入命令开始一个新进程——例如，启动\
  \ ftp 互联网文件传输程序。\n\n![image](img/pg176_2.jpg)\n\n![image](img/2g.jpg)\n\n接下来，打开第二个终端窗口，然后输入命令\
  \ `ps -e` 查看所有进程的长列表。\n\n![image](img/pg176_3.jpg)\n\n向下滚动列表，找到列为“伪终端”（pseudo terminals）且名为\
  \ `pts/0` 和 `pts/1` 的终端窗口。\n\n![image](img/hot.jpg)\n\n输入命令 `man ftp` 以发现更多关于 ftp\
  \ 文件传输程序的信息。\n\n![image](img/forget.jpg)\n\n每个 `PID` 都是在进程启动由操作系统动态分配的，用于识别该特定实例。\n\
  \n![image](img/4g.jpg)\n\n现在，输入命令 `ps -e | grep pts` 将列表精炼为仅在每个终端运行的进程。\n\n![image](img/5g.jpg)\n\
  \n可以看到列出的进程对应的第一个数字是其 `PID`——ftp 程序的 `PID` 为 2627。\n\n![image](img/pg177_1.jpg)\n\
  \n输入命令 `kill 2627` 终止第一个窗口中的 ftp 进程。\n\n![image](img/6g.jpg)\n\n再次输入命令 `ps -e |\
  \ grep pts` 查看该进程已不在列表中。\n\n![image](img/pg177_2.jpg)\n\n此处突出显示的是 `ftp` 程序进程的 `PID`\
  \ 以及你在执行 `kill` 命令后第一个窗口中显示的消息。\n\n![image](img/hot.jpg)\n\n在提示符处，你可以输入 `top` 命令查看最活跃的进程——按\
  \ `Q` 键退出。\n\n## 探索网络\n\n就像街道上的每栋房子都有一个唯一的地址以便投递邮件进行直接通信一样，网络上的每台计算机都有一个唯一的数字，即\
  \ `IP`（互联网协议）地址，它可以用于与特定的计算机进行直接通信。\n\n![image](img/pg178_1.jpg)\n\n你可以通过将 URL 作为\
  \ `host` 命令的参数发现网页地址背后计算机的 IP 地址。在某些情况下，对于大型网站，这可能会显示多个 IP 地址：\n\n![image](img/1g.jpg)\n\
  \n在 shell 提示符下，输入 `host www.google.com` 以发现 URL 的 IP 地址。\n\n![image](img/pg178_2.jpg)\n\
  \n为 `host` 命令添加 `-a` 选项以查看关于主机的所有信息。\n\n![image](img/hot.jpg)\n\n检查另一台计算机跨网络可到达的最基本测试是使用\
  \ `ping` 命令向其 IP 地址发送微小数据包。这会持续发送数据包直到你停止它，但你可以通过添加 `-c` 来限制数据包的数量：\n\n```\nping\
  \ -c 3 216.58.209\n```\n\n![image](img/2g.jpg)\n\n以查看是否跨网络可到达。\n\n![image](img/pg178_3)\n\
  \n通过 `host` 命令发现 URL 的 IP 地址。\n\n![image](img/forget.jpg)\n\n在 Linux 中，你可以通过执行 `ifconfig`\
  \ 命令发现计算机的 IP 地址。如果你知道设备名称，可以将其作为 `ifconfig` 命令的参数以查看单独报告：\n\n![image](img/3g.jpg)\n\
  \n执行 `ifconfig` 命令显示网络接口配置。\n\n![image](img/pg179_1.jpg)\n\n此示例中的计算机通过无线路由器连接，IP\
  \ 地址为 `192.168.0.166`。传统上，设备被命名为 `eth0`、`eth1` 等以太网以及 `wlan0`、`wlan1` 等无线设备，但引入了新的命名方案以解决多个网络接口的识别问题。上述连接中识别出的设备为以太网\
  \ (`enp3s2`)、本地回 (`lo`) 和无线局域网 (`wlp2s`)。\n\n![image](img/hot.jpg)\n\n`lo` 回环接口用于在部署之前测试网络应用程序。\n\
  \n![image](img/snake.jpg)\n\n`ifconfig` 命令仅显示活动接口的状态——添加 `-a` 选项以包含非活动接口。\n\n##\
  \ 从 Shell 打印\n\n`lpr` 命令接受文件名或路径作为参数来建立打印任务，将指定的文件发送到打印机。每个任务都被放入队列中等待传输——当任务到达队列前端时，文件数据会被送到打印机并打印。\n\
  \n![image](img/pg180_1.jpg)\n\n你可以使用 `lpq` 命令检查打印队列中的任务——每个任务会自动分配一个任务编号。在任务发送到打印机之前，可以使用\
  \ `lprm` 命令结合任务编号将其从队列中移除：\n\n![image](img/1g.jpg)\n\n在提示符下，输入 `lpr tux.png` 创建一个打印任务——打印名为“tux.png”的图像文件。\n\
  \n![image](img/2g.jpg)\n\n输入 `lpr ballad.txt` 创建另一个打印任务——打印指定的文本文件“ballad.txt”。\n\
  \n![image](img/3g.jpg)\n\n执行 `lpq` 命令查看打印队列。\n\n![image](img/pg180_2.jpg)\n\n打印队列显示打印机正在打印编号为\
  \ 1 的任务——图像文件。\n\n![image](img/4g.jpg)\n\n在打印任务 1 完成之前，执行 `lprm 2` 命令（或者替代使用 `cancel\
  \ 2` 命令）将该任务从打印队列中移除。\n\n\n\n\n打印机在移除该任务的同时继续打印图像文件——任务号 2 中的文本文件未发送到打印机，因此不会打印。\n\
  \n![image](img/hot.jpg)\n\n打印任务只能由其所有者或 root 超用户从打印队列中删除。\n\n从 shell 提示符打印不仅限于简单的打印文件——还可以使用\
  \ `lpr` 命令配合 `|` 管道字符将数据排队进行打印：\n\n![image](img/5g.jpg)输入 `ls -l /etc | lpr` 来打印\
  \ `/etc` 目录的列表——通过将 `ls` 命令的结果传递给 `lpr` 命令\n\n![image](img/6g.jpg)在列表打印期间，执行 `lpq`\
  \ 命令查看打印队列，源是从标准输入管道的\n\n![image](img/pg181_1.jpg)\n\nLinux 中的打印功能由 `CUPS`（通用 Unix\
  \ 打印系统）设施提供。它提供了一个打印后台进程（spooler），用于以打印机理解的格式缓冲数据，以及一个调度器（scheduler），在打印机准备好接收时将缓冲数据发送到打印机。\n\
  \n`lpstat` 命令具有单独的选项来提供关于调度器、后台进程和打印机的 CUPS 状态信息：\n\n![image](img/7g.jpg)执行命令 `lpstat\
  \ -t` 查看查看打印机状态\n\n![image](img/pg181_2.jpg)\n\n![image](img/hot.jpg)\n\n当可用多个打印机时，使用\
  \ `lpr -P` 指定用于打印任务的打印机。\n\n## 评估表达式\n\n`expr` 命令允许你在 shell 提示符处执行简单的数学计算。它识别所有常用的算术运算符，但那些在\
  \ shell 中有其他含义的运算符需要用反斜杠 `\\` 转义字符开头。例如，`*` 通配符必须转义才能用于乘法。\n\n![image](img/pg182_1.jpg)\n\
  \n每个参数之间必须用空格分隔，可以使用括号来建立较长表达式中的运算符优先级——但每个括号字符都必须进行转义。\n\n`expr` 命令还可以执行布尔求值，返回真\
  \ (1) 或假 (0) 答案，并使用函数 `length`、`substr` 和 `index` 执行简单的字符串处理。\n\n![image](img/1g.jpg)在\
  \ shell 提示符下，输入 `expr 7 + 3` 执行加法，输入 `expr 7 \\* 3` 执行乘法\n\n![image](img/2g.jpg)输入\
  \ `expr 7 \\* \\( 3 + 1 \\)` 评估复杂表达式，输入 `expr 7 = 3` 进行布尔等值判断\n\n![image](img/3g.jpg)执行命令\
  \ `expr length “Linux in easy steps”` 来发现指定字符串的长度\n\n![image](img/4g.jpg)执行命令 `expr\
  \ substr “Linux in easy steps” 7 13` 来提取指定字符串的子字符串\n\n![image](img/5g.jpg)执行命令 `expr\
  \ index “Linux in easy steps” “x”` 来发现字符串中第一个 “x” 的位置\n\n![image](img/pg182_2.jpg)\n\
  \n![image](img/forget.jpg)\n\n算术运算符为 `+` 加、`-` 减、`*` 乘、`/` 除以及 `%` 取模。\n\n![image](img/hot.jpg)\n\
  \n你可以使用 `xcalc` 命令从终端窗口快速启动图形化计算器。\n\n表达式评估的结果可以通过 `if-then-else` 语句导致特定的动作。该语句包含三个独立部分，分别指定测试表达式、测试为真时执行的动作以及测试为假时执行的动作。\n\
  \n`if` 关键字开始语句，后面跟着括在一对 `[ ]` 方括号内的测试表达式。整个语句的每个部分都必须与下一部分用空格分隔，以便 shell 评估该表达式。\n\
  \n`then` 关键字开始语句的第二部分，指定测试为真时执行的命令。同样，`else` 关键字开始语句的第三部分，指定测试为假时执行的命令。最后，必须添加 `fi`\
  \ 关键字来标记语句的结束。\n\n![image](img/forget.jpg)\n\n你必须在 `if` 关键字后留一个空格以避免错误。同样在 `[` 括号之后和\
  \ `]` 括号之前也要留一个空格以避免错误。\n\n你可以输入语句的第一部分然后按 **回车**（Return）提示输入语句的剩余部分，或者输入整个语句并用分号分隔每个部分：\n\
  \n![image](img/6g.jpg)输入 `if [ `expr 7 % 2` = 0 ]` 来测试七除二的余数是否为零，然后按 **回车**\n\n\
  ![image](img/7g.jpg)在语句提示符下，输入 `then echo “Even Number”`\n\n![image](img/8g.jpg)现在，输入\
  \ `else echo “Odd Number”`\n\n![image](img/9g.jpg)输入 `fi` 然后按 **回车** 执行相应的动作\n\n\
  ![image](img/10g.jpg)通过输入 `if [ `expr 8 % 2` = 0 ]; then echo Even; else echo Odd;\
  \ fi` 在连续语句中进行类似的测试，然后按 **回车** 执行相应的动作\n\n![image](img/pg183_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n反引号 `` `` 运算符包裹了 `expr 7 % 2`\n\n## 编写脚本\n\n长长的 Shell 例程可以方便地保存为脚本，它们以 `#!/bin/bash`\
  \ 开头，并通常赋予 `.sh` 扩展名。\n\n![image](img/forget.jpg)一旦脚本文件设置了执行权限，就可以通过 `./` 执行。为了确保不同的序列，有必要使用\
  \ `date+%s` 提取自 00:00:00 GMT 1970 年 1 月 1 日以来的秒数来种子 `$RANDOM` 变量以获得更好的数字生成效果。\n\n\
  ![image](img/hot.jpg)\n\n输入 `RANDOM=1` 然后执行三次 `echo $RANDOM` 查看模式。重复这两个命令。可以通过在脚本中包含\
  \ `let` 命令对 Shell 变量（如 `$RANDOM`）进行算术运算![image](img/1g.jpg)打开任何文本编辑器并以 `#!/bin/bash`\
  \ 开始一个新文件\n\n![image](img/2g.jpg)在新行中，输入一行种子 `$RANDOM` 变量 `RANDOM=`date+%s``\n\n\
  ![image](img/3g.jpg)添加一行将 1-20 的值赋值给变量 `let NUM=(RANDOM % 20 + 1)`\n\n![image](img/4g.jpg)在下一行输入一个清除窗口的指令\
  \ `clear`\n\n![image](img/5g.jpg)添加这些行来输出给用户的文本 `echo “I have chosen a number between\
  \ 1 and 20” echo “Can you guess what it is?”`\n\n![image](img/forget.jpg)括号包裹了要评估的表达式，但你不能在赋值的\
  \ `=`字符周围引入空格。\n\n![image](img/6g.jpg)现在，添加一行将用户的猜测读取到变量 `read GUESS`\n\n![image](img/7g.jpg)输入以下行以评估用户的猜测是否与生成的数字匹配，并对每次错误的尝试输出相应的响应\n\
  \n```bash\nwhile [ $GUESS -ne $NUM ]\ndo\n  if [ $GUESS -gt $NUM ]\n  then echo\
  \ “No - try lower... ”\n  else echo “No - try higher... ”\n  fi\n  read GUESS\n\
  done\n```\n\n![image](img/8g.jpg)添加一行确认正确的猜测 `echo “Yes the number is $NUM”`\n\n\
  ![image](img/9g.jpg)将脚本保存为当前目录下的 `guess.sh`\n\n\n\n\n![image](img/10g.jpg)在 shell\
  \ 提示符下，使用命令 `chmod 711 guess.sh` 修改访问权限，使所有者可以执行该脚本。\n\n![image](img/11g.jpg)输入\
  \ `./guess.sh` 执行脚本，然后猜出脚本随机选择的数字。\n\n![image](img/pg185_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n`while-do` 语句是一种循环，它使用了 `-ne`（不等于）比较运算符和 `-gt`（大于）比较运算符。其他的 Bash shell 比较运算符还包括\
  \ `-eq`（等于）和 `-lt`（小于）。\n\n![image](img/snake.jpg)\n\n记住中括号字符是运算符——在它们周围必须有空格以避免错误。\n\
  \n## 总结\n\n- `sudo` 命令在 shell 提示符下执行命令，就像普通用户是 root 超级用户一样。\n- 使用 `apt-get update`\
  \ 更新高级软件包工具 (APT) 软件包列表，使用 `apt-get install` 安装软件包，并使用 `apt-get remove` 删除软件包。\n\
  - 文件可以使用 `gzip`、`bzip2` 或 `zip` 进行压缩，并使用相应的工具 `gunzip`、`bunzip2` 和 `unzip` 解压缩。\n\
  - 文件系统可以使用 `mount` 挂载到树上，使用 `umount` 卸载，并使用 `fsck` 命令进行检查。\n- root 超级用户可以使用 `useradd`、`userdel`\
  \ 和 `usermod` 命令创建和编辑用户账户。\n- 使用 `passwd` 命令更改登录密码，使用 `chfn` 命令编辑个人详情。\n- 超用户可以使用\
  \ `groupadd`、`groupdel` 和 `groupmod` 创建和编辑组。\n- 使用 `chmod` 命令修改访问权限，使用 `chown` 和\
  \ `chgrp` 更改所有权。\n- 每个进程都有唯一的进程 ID (PID)，通过 `ps` 命令显示，并可以通过 `kill` 命令终止。\n- 使用 `host`\
  \ 命令可以 URL 的 IP 地址，使用 `ifconfig` 可以自己电脑的 IP 地址。\n- 使用 `lpr` 创建打印任务，使用 `lprm` 删除任务，使用\
  \ `lpq` 列出任务，并使用 `lpstat` 显示状态。\n- 使用 `expr` 命令评估表达式，并使用 `length`、`substr` 和 `index`\
  \ 函数处理字符串。\n- Bash shell 脚本以 `#!/bin/bash` 开头，通过在文件名名前加上 `./` 点斜杠字符在提示符下执行。\n\n\
  ![image](http://www.ineasysteps.com)\n\n![image](http://www.ineasysteps.com)\n\n"
