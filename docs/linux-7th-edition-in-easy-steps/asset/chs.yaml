  `Adblock Plus` 是一款广受好评的免费扩展程序，拥有超过 1100 万用户。它会自动拦截广告并在 Firefox 工具栏上放置一个按钮。显示拦截广告的数量，并提供允许非侵入性广告的选项。\n\
  \n### 电子邮件\n\n![image](img/pg80_1.jpg)\n\n许多 Linux 发行版包含了流行的 Thunderbird 电子邮件应用程序。Thunderbird\
  \ 第一次启动时会为你提供一个新的电子邮件帐户或使用现有帐户的选项。通常，你需要提供 ISP 邮件服务器名称（`POP` 和 `SMTP`）以及你的电子邮件地址和密码。完成后，如果你连接了互联网，就可以开始发送和接收邮件了：\n\
  \n![image](img/1o.jpg)\n\n点击 `Menu`、`Internet`、`Thunderbird Mail`，然后点击 Thunderbird\
  \ 工具栏上的 `Get Messages` 按钮。\n\n![image](img/2o.jpg)\n\n展开左侧面板中的文件夹列表，然后点击 `Inbox`\
