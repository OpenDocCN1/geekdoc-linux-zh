  \ 还是联系人管理器。右键点击此“From”字段并选择 `Add to Address Book`，然后点击工具栏上的 `Address Book` 按钮查看你的联系人列表。\n\
  \n![image](img/3o.jpg)\n\n点击右上侧面板中的收到的邮件，其内容将出现在右下面板中。\n\n![image](img/4o.jpg)\n\
  \n要写邮件，点击工具栏上的 `Write` 按钮打开“Write”窗口——如右侧所示。\n\n![image](img/5o.jpg)\n\n在“Write”窗口的\
