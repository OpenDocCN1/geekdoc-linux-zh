  - 启用 PCMCIA 卡
- - '###'
  - 是否在系统启动时启动 PCMCIA 服务？(yes/no)
- - '###'
  - 'PCMCIA: 此变量决定所使用的芯片组。有效值为 ''182365'' 或 ''tcic''。如果留空，pcmcia 将在启动时不会启动。'
- - '###'
  - PCMCIA_PCIC_OPTS - 在此处设置 socket 驱动定时参数。这些参数在 "man i82365"（或 "man tcic"）中有描述。
- - '###'
  - 更多信息，请在 PCMCIA-HOWTO 中查找 "PCIC_OPTS"。
