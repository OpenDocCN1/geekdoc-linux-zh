    # Mounting Filesystems and Devices


    You can mount devices, partitions, and separate disks to directories (called mount
    points) within the filesystem. To read from a device, such as a floppy disk or
    a CD-ROM, you use the mount command. The mount command''s syntax is: mount -t
    type /dev/device mountpoint . For example, to mount a CD-ROM drive, type


    mount -t iso9660 /dev/cdrom /mnt/cdrom


    To access the CD-ROM drive, simply change into the /mnt/cdrom directory, and then
    Type to display a list of files found on the CD-ROM.


    Your default filesystem types and mount points are set in /etc/fstab. The fstab
    file sets the default device, mount point, filesystem type, type of mount, and
    filesystem dump and fsck order options. Here is an example of an fstab file:


    | /dev/hda3 / ext2 defaults 1 2 |

    | /dev/hda1 /boot ext2 defaults 1 2 |

    | /dev/hda4 swap defaults 0 0 |

    | /dev/fd0 /mnt/floppy ext2 noauto 0 0 |

    | /dev/cdrom /mnt/cdrom iso9660 noauto,ro 0 0 |


    Settings in /etc/fstab also allow you to use the defaults when you''re mounting
    filesystems manually. For instance, rather than typing


    ```

    mount -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    you''d simply type


    ```

    mount /dev/cdrom

    ```


    or even


    ```

    mount /mnt/cdrom

    ```


    and mount automatically mounts the CD-ROM, based on the defaults in your /etc/fstab
    file.


    To mount filesystems with settings other than the defaults, or to mount filesystems
    that aren''t listed in the /etc/fstab file, you need to specify the type, device,
    and'
