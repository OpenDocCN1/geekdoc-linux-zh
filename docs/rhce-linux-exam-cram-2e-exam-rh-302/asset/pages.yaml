    If you choose the Routing button, you see a list of any special routing rules
    you have set up. You can also set up your network gateway here. From this window,
    you can add, edit, and delete routing options. To edit a static route, click the
    Add button. Here you can enter a device, the network, the netmask, and gateway
    options.


    > To configure network information without X, use netconfig. The netconfig tool
    runs the same interface as the network configuration stage of the Red Hat text
    installation.


    # Configuring Extras with Linux Administration Tools


    Many system administrators enjoy being able to configure, reconfigure, or simply
    fix their extra settings and peripherals, including keyboards, the clock, a mouse,
    and sound cards. There are several administration tools available on Linux to
    do these tasks. Some of the most commonly used ones include kbdconfig, timeconfig,
    mouseconfig, sndconfig, setup, and authconfig. Each of these configuration programs
    is run in console menu mode (this mode is also used during the installation process).
    In fact, authconfig, kbdconfig, timeconfig, and mouseconfig are actually used
    in the installation process.


    If you get a new type of keyboard, or are experimenting with keyboards, you want
    to use the kbdconfig tool. To invoke the kbdconfig tool, type at the root prompt.
    You are prompted with a blue, red, and yellow screen that asks you to select the
    type of keyboard you have. When you have selected your keyboard, use the Tab key
    to select the OK button and then press Enter. It''s that simple.


    You can just easily adjust your time settings. To do so, use the timeconfig tool
    by typing timeconfig at the root prompt. You can select your time zone and use
    Tab to select OK. This utility is a favorite for administrators who travel among
    several time zones.'
