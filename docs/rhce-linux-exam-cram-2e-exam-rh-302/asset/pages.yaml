  md: '# Advanced Installation 163


    Once you have your export entry, you must either restart your NFS server or use
    the exportfs /home/ftp/pub/RedHat command.


    # Managing RPM Installation


    After you have set up the network installation server of your choice, you can
    opt to change the RPMs available for installation by adding or removing RPMs from
    the RPMS directory of the install location. You can add or remove RPMs by using
    the tool called genhdlist. The genhdlist tool can be found under /misc/src/anaconda/utils.
    After you''ve added or removed the RPMs, simply run genhdlist, specifying the
    directory where your RPMs are located:


    genhdlist /home/ftp/install/RedHat/1386/


    # Installing Using kickstart


    Many companies and hardware resellers often need to configure Red Hat Linux on
    many machines. If all the machines have the exact same hardware configuration
    and need the exact software configuration, you can automate the installation by
    using a program called kickstart.


    The kickstart program automates your installation by automatically answering the
    questions that the installation program asks. The kickstart utility works with
    ASCII-based instruction file that can be supplied from a boot floppy disk or even
    from an NFS server.


    The kickstart program automatically installs Red Hat Linux using several methods.
    The two main supported methods are CD-ROM-based and NFS-based installations. FTP
    and HTTP installations, though not commonly advertised, are supported as well.


    The kickstart program uses a kickstart configuration file called ks.cfg.The ks.cfg
    file contains all the configuration answers to all the questions that are asked
    during an installation. If an answer is not provided in the ks.cfg file, the installation
    pauses and prompts you to answer the question. After you answer the question,
    the automatic installation resumes. A sample ks.cfg file follows:


    ```

    lang en_US

    network --bootproto dhcp

    cdrom

    device ethernet

    keyboard "us"

    zombr yes

    clearpart --linux

    part /boot --size 16

    part / --size 250

    ```'
