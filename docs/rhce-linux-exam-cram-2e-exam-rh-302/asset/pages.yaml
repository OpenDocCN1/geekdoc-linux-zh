    # The cron Program


    The cron program allows you to run jobs at specific intervals. The cron program
    uses your crontab file to configure which programs to run, and when. To set up
    a crontab file for an individual user, the user types crontab -e to edit the crontab
    file. The user crontab is automatically placed in /var/spool/cron/crontabs/. An
    example crontab entry looks like this:


    ```

    # run example cron job

    01 2 3 4 5 $HOME/bin/daily.job

    ```


    Lines in the crontab file have six fields. The first field specifies the minute
    of the hour that the indicated executable is to be run (0 through 59). The second
    field specifies the hour of the day that the executable should be run (0 through
    23). The third field specifies the day of the month (0 through 31). The fourth
    field specifies the month of the year (0 through 12). The fifth field specifies
    the day of the week (0 through 7). The final field specifies the program to be
    run.


    Using an asterisk (*) in place of any of the six first fields indicates "every",


