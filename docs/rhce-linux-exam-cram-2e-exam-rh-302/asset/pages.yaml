    portmap and mount.


    # Kernel Modules


    The NFS client requires a specific set of kernel modules. These modules include
    nfs.o, lockd.o and sunrpc.o. These kernel modules are installed in the default
    Red Hat 6.2 kernel installation and will automatically load when you start the
    user-space daemons by the kernel module loader.


