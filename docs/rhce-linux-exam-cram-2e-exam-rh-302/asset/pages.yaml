  md: '# httpd


    httpd (Hypertext Transport Protocol Daemon) is the HTTP (or World Wide Web) server.
    On Red Hat, the default httpd is Apache. Apache is a free Web server that was
    originally derived from the National Center for Supercomputing Applications (NCSA)
    HTTP server. The configuration files are located in /etc/httpd/conf/


    # NIS


    NIS (Network Information Service, originally called Yellow Pages, was developed
    by Sun Microsystems to simplify filesystem administration by maintaining the files
    in a central database. The clients contact database server to retrieve information.
    Two basic NIS utilities include ypcat (which displays an NIS database) and ypmatch
    (which searches an NIS database).


    # inetd


    This is the Internet daemon that listens for service requests on network connections
    and then starts up the appropriate daemon to respond to the particular request.


    # Network Security


    All Unix and Linux administrators should know the basic methods for securing their
    systems, including monitoring users and groups, setting file permissions properly,
    using umask, and using shadow passwords.


    # Monitoring Users and Groups


    One of the most time-consuming duties of a Red Hat system administrator revolves
    around monitoring users and groups. Some basic administration tasks include monitoring
    services used, user accounts, and even software use.


    Among other things, you''ll need to monitor unneeded services. To see which services
    are automatically started at boot-time, simply uncheck them. Doing so stops them
    from being started at boot-time. If any services you don''t use are, you can also
    stop services you''re currently running (for example, nfs) by running /etc/rc.d/init.d/nfs
    stop


    Using common sense when assigning user accounts can save you many headaches later.
    For instance, set up guidelines when users choose their passwords; they shouldn''t
    be the same as their usernames, nor should they be any type of English word. It''s
    best to have a mixture of numbers and alphabetical characters,'
