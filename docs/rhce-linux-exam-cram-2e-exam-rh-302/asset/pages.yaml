    # Software Configuration Objectives


    The biggest (and most difficult) parts of this exam are the software configuration
    objectives. The largest percentage of your software configuration test is covered
    in Chapter 10 with networking services. In addition, you can expect objectives
    to cover subjects ranging from installation and configuration options in Chapter
    6, to advanced configuration options in Chapter 8, X options in Chapter 9, and
    security features in Chapter 11. You should expect to see objectives (and probably
    more than one) from each of these chapters. Spend your time wisely.


    # Managing Your Time


    You are given two and a half hours for the installation and configuration portion
    of the exam. Use the following guidelines, and budget your time so you can finish
    all objectives in the exam.


    +   Plan—While previewing your objectives, make a mental (or paper) note of how
    long each task should take. Objectives that take longer, or make you wait, can
    be probably done at the same time as another objective, saving overall time. Make
    sure to leave the last 15 minutes of the exam available to double-check your work.


    +   Begin—Begin your exam within five minutes of receiving your objectives. Do
    not preview too long, or you''ll risk running out of time to complete the exam.
    Installation and configuration take time.


    +   When you get stuck—If you''re stuck on an objective, or it just isn''t working
    right, spend no longer than five minutes trying to work on it. If you''re unable
    to solve the problem, concentrate on getting through the rest of the objectives,
    and then go back to the ones you had problems with.'
