  md: '# Administering Users


    To add users when you''re in X Window, follow these steps:


    +   1. Invoke the linuxconf program by typing linuxconf at the root prompt.

    2. To open the Users Accounts tab, shown in Figure 6.1, select Config, then Users
    Accounts, then Normal, then User Accounts.

    3. If you have more than 15 accounts on the system, linuxconf provides you with
    a filter screen, where you can select a smaller range of accounts. To get the
    full list, select Accept without changing any of the parameters.

    4. The Add button will open the User Account Creation dialog box, in which you
    enter all the information for a new account. You are presented with seven fields
    in which supply information for the account:


    +   * Login Name—This is the only required field.

    * Full Name—This is for the user''s full name.

    * Group—This allows you to specify any specific group that should be assigned
    to the account. By default, linuxconf assigns a group that is equivalent to the
    login name.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_156_0.png)


    Figure 6.1 The Users Accounts tab of the linuxconf program.'
