    -av. The option specifies exports to add the entries, and the v option to produce
    the output verbose.

    2. Run exportsfs -rv. After changing /etc/exports, you must update the NFS server
    by using exports -rv. This command re-exports all directories in /etc/exports,
    synchronizing the server''s list of exports (maintained by mount in /var/lib/nfs/xtab)
    with the /etc/exports file.


    To remove a filesystem from mount''s list of exported filesystems, use exports
    -u. More information about exports can be found in the exports(8) page (man 8
    exports).


    # The NFS Client


