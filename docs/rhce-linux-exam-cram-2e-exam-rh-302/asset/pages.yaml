  md: '# Chapter 8


    The first section is for information only. It states the use and author of the
    file. The second section discusses the seven runlevels, which are the different
    states in the system which is running. Level 0 is the halt state. Level 1 indicates
    that the system is running in single-user mode. Level 1 allows you to administer
    your system without multi-user support.


    Did you forget your root password? You can boot into runlevel 1 (single-user mode)
    and change the password.


    Runlevel 2 is multi-user mode, but it has no networking support. Runlevel 3 is
    full multi-user mode and does offer full networking support. Runlevel 4 isn''t
    used. On Red Hat Linux is full multi-user mode, and it boots into an X-based login
    screen. Runlevel 6 is for rebooting. Following the runlevel descriptions is a
    line that starts with id:. This line specifies the default runlevel to boot into.
    After your system is booted into a particular runlevel, you can access other runlevels
    by using the init or telnit commands. By issuing an init 6 command at the root
    prompt, you can command the system to reboot. However, issuing an init 1 command
    tells the system to boot into single-user mode. These commands can be issued only
    by root. Here is an example of an /etc/initabb file:


    ```

    #

    # initabb  This file describes how the INIT process should set up

    # system in a certain run-level.

    #

    # Author: Miquel van Smoorenburg, <miquels@drinkel.nl.mugnet.org>

    # Modified for RHS Linux by Marc Ewing and Donnie Barnes


    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, with no networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    #

    id:3:initdefault:

    ```


    The third section of the /etc/initabb file details the boot sequence. It starts
    the system initialization with the rc.sysinit script (see “Understanding System
    Initialization'
