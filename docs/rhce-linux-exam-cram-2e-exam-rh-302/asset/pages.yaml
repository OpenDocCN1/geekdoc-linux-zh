  md: '# Question 3


    | What permission allows a file to be readable by the owner, group, and user,
    while allowing only write access to the owner and group? |

    | a. 644 |

    | b. 750 |

    | c. 755 |

    | d. 774 |


    Answer d is correct. Permissions of 774 give a file -rwxrwx-- permission attributes.
    This means that the file is rwx by owner, rwx by group, but only by r by user.
    Answer a is incorrect because 644 allows rw by owner, rw by group, and r by user.
    Answer b is incorrect because 750 allows rwx by owner, r-x by group, and no access
    by user. Answer c is incorrect because 755 allows rwx by owner, r-x by group.


    # Question 4


    | Why do you need DNS? |


    You need DNS for domain name resolution. DNS is used to convert IP addresses to
    domain names, and domain names back to IP addresses. This process allows you to
    connect to the Internet with a domain name (such as www.coriolis.com) instead
    of having to remember 209.140.152.4.


