  md: '# Supernetting Classes


    In 1992, a new adaptation to the IP classes was proposed. The idea was to supernet
    multiple classes in order to reserve IP numbers. Otherwise, IP addresses would
    be wastefully assigned (for example, a Class B address might be assigned when
    only two Class Cs'' worth of addresses was required), and we would run out of
    IP addresses quickly. Therefore, Classless InterDomain Routing (CIDR) was invented.


    Using supernetting, the class mask are extended so that a network address and
    a subnet mask can, for example, specify multiple Class C subnets with one address.
    For example, if you need 500 addresses, you can supernet two Class C networks
    together. Table 4.4 shows supernetted subnets.


    It is expected that CIDR will have enough IP addresses available for the next
    few years, until IPv6 is implemented. IPv6 uses 128-bit addresses, which would
    comfortably allow over 34 trillion trillions of IP addresses.


    # Subnets


    To create a subnet, you split IP addresses into two parts: a network and a host.
    Typically, therefore, the destination network is derived from the network part
    of the IP address; hosts with identical IP network numbers should be found within
    the same network.


    Every subnet is assigned a netmask (also referred to as a subnet mask): the number
    of bits interpreted as the subnet number. For instance, a Class C network number
    of 192.168.1.0 has a netmask of 255.255.255.0, whereas a Class B network number
    of 176.16.0.0, has a netmask of 255.255.255.0.


    # Network Configuration


    The ifconfig command is used to configure the kernel-resident network interfaces.
    It is used at boot-time to set up network interfaces as necessary. The first interface
    you''ll have to set up is the loopback interface (lo), as shown here:


    ```

    #ifconfig lo 127.0.0.1

    ```


    | Table 4.4 Supernetting subnets. | |

    | Subnet/Result | Description |

    | 193.60.220.0 | Class C subnet address |

    | 193.60.221.0 | Class C subnet address |

    | 193.60.220.0 | Supernetted subnet address |

    | 255.255.252.0 | Subnet mask |

    | 193.60.220.255 | Broadcast address |'
  merge: -1
