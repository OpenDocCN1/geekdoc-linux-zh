  md: '10. To make sure that you''re connected to the DHCP server, run ifconfig. The
    eth0 section of the output should have an inet addr: entry with your DHCP-assigned
    network address.


    # Time Services


    A number of services available in Red Hat Linux allow you to configure and synchronize
    time services on your machine. These tools are made available because few machines
    have atomic clocks attached to them; therefore, computers often lose accurate
    time. There are three main time-related tools included in Red Hat Linux 6.2—they
    are the time configuration tool timetool and the time synchronization tools ntpd
    and rdate.


    # Time Configuration


    A GUI tool for time configuration, timetool, is packaged with Red Hat Linux 6.2.
    The RPM available for timetool on the Red Hat Linux 6.2 CD is timetool-2.7.3-1.noarch.rpm.


    To change system time with timetool, execute it as root by typing timetool at
    the root prompt. In the GUI window, select the time setting you want to change
    (hour, minute or second), and then use the up and down arrows to change the setting.
    When the time is set appropriately, choose the Set System Clock button to save
    the time setting to the system. Then choose the Exit Time Machine button to exit.


    # Time Synchronization


    Some administrators choose to use time synchronization tools to set the system
    time based on a specified machine. One (older) tool used for this is rdate. A
    more popular package used to set up a continuously running synchronization daemon
    is xntpd.


    # rdate


    The Red Hat Linux rdate is a tool used to synchronize the system time with a specified
    machine. The rdate tool synchronizes only once when the tool is used. The RPM
    used to install rdate on the Red Hat Linux 6.2 CD is rdate-1.0-1.i386.rpm.


    To use rdate, run rdate -p s host where host is the machine with which you want
    to synchronize your time. The -p option prints the time set on the remote host
    you specify. The -s option synchronizes the time on your machine with the host
    you specify.'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'rdate Similar to rdate tools use port 37 to send and receive rdate requests.
    Many administrators disable this port and service; therefore, finding a good rdate
    host might be troublesome unless it is on your network.


    # xntp3


    The most popular package used for time synchronization is the xntp3 package. The
    xntp3 package contains several time-related tools such as ndate and the popular
    xntpd time daemon, which runs continuously to synchronize your system. The RPM
    used to install xntp3 on the Red Hat Linux 6.2 CD is xntp3-5.93-14.i386.rpm, and
    it is found in the /RedHat/RPMS/ directory.


    +   - npdate tool is used to retrieve the date and time from the network by polling
    the Network Time Protocol Servers as specified in the command. The npdate command
    is often placed in /etc/rc.local''s startup script, or it can be run from the
    system cron.


    +   - xntpd Time synchronization daemon used to continuously adjust system time.
    Configuration for xntpd is done through /etc/ntp.conf.


    # Squid Proxy Server


    Squid is a caching proxy server. Proxy servers are used to cache data streams
    as FTP, gopher, and HTTP. Network clients can be directed to the proxy server
    to aid in pulling cached HTTP documents.


    # Setting Up Squid


    To install Squid via RPM from the Red Hat Linux 6.2 CD, use squid-2.3.STABLE1-5.i386.rpm
    from the /RedHat/RPMS/ directory. The main configuration file that is automatically
    set up from the RPM is /etc/squid/squid.conf. The squid.conf file consists of
    every configuration setting needed to run Squid; this file contains excellent
    comment explanations for each setting available.


    After you install the Squid RPM, the default configuration file (squid.conf) is
    already configured with default settings that allow you to run Squid out of the
    box. To start Squid, /etc/rc.d/init.d start or service squid start. When you start
    Squid for the first time, you automatically create the Squid cache files as specified
    in the /etc/squid/squid.conf settings. The squid daemon will automatically listen
    on port 3128 for proxy requests.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Using Squid


    The most popular use for Squid is as a Web proxy server. A Web proxy caches HTTP
    request information (such as images, HTML pages, and so on) on a local machine
    to speed browsing downloads for clients on the network. This feature is especially
    useful when a specific Web site is requested numerous times on a specific network.


    When configuring a client to use a proxy server (such as Netscape), you simply
    set the client to point its HTTP traffic to the proxy server''s IP address and
    port (3128). For instance, if your proxy server was on 192.168.0.1 and the network
    client was running Netscape, you would take the following steps:


    +   1. Load Netscape Navigator. From the menu at the top of the window, choose
    Edit and then Preferences. In the Preferences menu, you can set up everything
    from identification information to advanced options, such as using a proxy server.


    +   2. Select the Advanced option in the left frame of the Preferences window
    by selecting the arrow to the left of the Advanced option. Select the Proxies
    option from beneath the Advanced directory. In the right frame of the window,
    select Manual Proxy Configuration and choose the View button. An Edit Manual Proxy
    Configuration window then appears.


    +   3. In the HTTP: setting box, set the IP address to the Squid server on your
    network (in this example, the server is set to 192.168.0.1), and set the port
    to send to (by default, this is set to 3128).'
  merge: -1
