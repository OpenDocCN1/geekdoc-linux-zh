  md: '# About the Author


    Kara J. Pritchard is currently the Assistant Director for Program Development
    of the Linux Professional Institute, working on developing the standard base for
    Linux certification. As an independent consultant, Kara has been promoting the
    use of Linux in both corporate and educational facilities since late 1995 in the
    Illinois and St. Louis metropolitan areas.


    Kara began participating in the Linux community in the fall of 1995, when she
    was introduced to the Southern Illinois Linux Users Group (SILUG), founded by
    her husband in 1994. With her husband, Kara founded the Linux Users of Central
    Illinois (LUCI) in 1997 and moved SILUG into an umbrella organization including
    multiple LUGs across southern Illinois. She now works with LUGs all over the world
    through her LUG Resource Project (http://www.linuxusersgroups.org/) sponsored
    as a Linux Evangelist by Linuxgruppen. You can contact her at kara@luci.org.'
