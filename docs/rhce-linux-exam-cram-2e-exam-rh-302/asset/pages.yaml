    # Kernel Configuration


    The files you need to boot a kernel are located in the /boot directory. These
    files include System.map, boot.b, boot.0300, initrd, and kernel images (typically
    named with the vmlin prefix). The System.map file is a file that you use to debug
    the kernel. The boot.b file is the file that LILO creates; it''s used in the second
    stage of LILO and is pointed from LILO in the master boot record. The boot.0300
    file is a backup of your master boot record that is created when you install LILO.
    The initial ramdisk used to boot a system that uses SCSI during the boot process
    is called initrd. The vmlinux files are the kernel images that are created during
    the kernel''s make process.


    Kernel source and documentation are located under the /usr/src/linux directory.
    Under this directory you will find a number of files and resources that you might
    find helpful when compiling or debugging your kernel. Some of these files include
    the CREDITS file, which gives credit to many of the contributors to the Linux
    kernel, as well as the Documentation directory, which contains many text files
    with details about hardware, kernel files, and more. The Documentation directory
    also contains files that are required for compiling a kernel, such as Makefile
    and System.map. By default, any work you do with the Linux kernel will take place
    under this directory.


    # Kernel Configuration Tools


    The first step in compiling (or recompiling) a kernel involves the make tool,
