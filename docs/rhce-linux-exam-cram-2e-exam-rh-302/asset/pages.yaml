    # OSS (open-source software)


    Software whose source code is available to the public.


    # output


    The text result from a console command.


    # PAM (Pluggable Authentication Modules)


    System that enables ruleset implementation without having to recode individual
    services.


    # partition


    A section of a disk. Under Linux, each partition on a disk shows up as a separate
    device.


    # passwd


    Tool used to change (or set) a user password.


    # PCI (Peripheral Component Interconnect)


    The 32- or 64-bit, 33MHz bus that was designed by Intel and is used in most current
    PCs and workstations.


    # PCMCIA


    Slot-style hardware used in laptops.


    # peripheral


    Device attached externally to a computer.


    # Perl


    Programming and scripting language developed by Larry Wall.


    # permissions


    Access levels granted to a file, program, or directory, for a user or group. Can
    be changed with chmod.


    # Pine


    Text-based mail reader on Unix systems. The Pine mail reader is a little more
    user-friendly than Elm. Pine uses key-combination menus and a simpler text editor.


    # plug and play


    Hardware that is software (not jumper) configurable.


    # PMS (Package Management System)


    Package management system project led by Rik Faith. It is a predecessor to RPM
    (see RPM).


    # pointer


    The arrow or other indicator represents the location of your mouse, traceback,
    glide point, or other pointing device that corresponds to the location on the
    screen. Quite often the shape, color, or size of the pointer will change to indicate
    that the mouse has a particular function on that specific area of the screen.'
