    After creating a user account, you can change the user''s information or password
    by returning to the User Accounts window in linuxconf. To do so, open the Config
    branch of the tree, and select Users Accounts, then Normal, User Accounts. In
    the window, choose the user you want to change, and then modify the user''s entries.
    You can edit all user accounts this way with the exception of root. To change
    root''s password, use the menu to go to Config; then select Users Accounts.


    # Red Hat''s control-panel


    Red Hat''s control-panel, shown in Figure 6.2, is an X application that serves
    as a launching panel for several configuration tools. To start Red Hat''s control-panel,
    start up an xterm as root in X, and then type control-panel. Next, select the
    button for whichever tool you want to run.


    > Note: When running control-panel, you should not edit any configuration files
    that it might use.


    Some control-panel tools are Users and Groups, printer configuration (printintool),
    and network setup (netcfg). You can also configure extras by using the kbdconfig,
    timeconfig, mouseconfig, and sndconfig tools, discussed later in this chapter.


