  md: '# 242 Chapter 10


    The following options are used when you''re running Apache server standalone mode:


    ```

    # Server-pool size regulation. Rather than making you guess

    # how many server processes you need. Apache dynamically adapts

    # to the load it sees. That is, it tries to maintain enough

    # server processes to handle the current load plus a few spare

    # servers to handle load spikes (e.g., multiple

    # simultaneous requests from a single Netscape browser).


    # It does this by periodically checking how many servers are

    # waiting for a request. If there are fewer number than there

    # are MinSpareServers, it creates a new spare. If there are

    # more than MaxSpareServers, the spares die off. The

    # default values are probably OK for most sites.


    MinSpareServers 5

    MaxSpareServers 20

    ```


    The settings set how many httpd servers are running at any given moment. These
    spare servers are used to handle rushes of requests or other spikes of HTTP traffic.
    The MinSpareServers directive sets the maximum number of spares to have at any
    given moment. The following options also regulate the number of httpd servers
    running:


    ```

    # Number of servers to start initially, should be a reasonable

    # ballpark figure.

    # StartServers 8


    # Limit on total number of servers running, i.e., limit on the

    # number of clients who can simultaneously connect -- if this

    # limit is ever reached, clients will be LOCKED OUT, so it

    # should NOT BE SET TOO LOW.

    # It is intended mainly as a brake to keep a runaway server from

    # taking the system with it as it spirals...


    MaxClients 150

    ```


    The StartServers option sets how many servers Apache should be started. The MaxClients
    option is a little more important because it sets the maximum of running servers.
    This limits the number of clients who can simultaneously connect to your server.
    Therefore, you should not set this option too low, but keep the number reasonable
    enough to keep your Web server from crashing.'
  merge: -1
