  md: '# Domain Name Service (DNS)


    DNS is the service responsible for managing the host and domain name conversion
    to the mapped IP addresses. Therefore, DNS is responsible for converting an IP
    address to its domain name and converting a domain name to its assigned IP address.
    The server that is run on a Linux DNS server is named. The named server is part
    of the BIND (Berkeley Internet Name Domain) package used on more than 85 percent
    of all DNS servers in the world.


    # Configuring BIND 8.x


    During the Red Hat Linux 6.2 installation, you''re given the option of installing
    BIND automatically. However, if BIND isn''t installed during the Linux installation,
    from the Red Hat Linux 6.2 CD-ROM, you can install it. There are three RPMs you
    should install. The first, and most important, is the bind-8.2.2_P5-9.i386.rpm
    file, which is the main BIND RPM. The second is recommended to be installed on
    every machine, if a machine isn''t being used as a DNS server, because it is the
    BIND utilities package. The BIND utilities package is installed with bind-utils-8.2.2_P5-9.i386.rpm.
    An optional (but highly recommended) package to be used with BIND is the caching
    name-server package that configures your DNS to cache DNS entries, making lookups
    and DNS access faster. The caching name-server package to install is cachingnameserver-6.2-2.noarch.rpm.


    The main configuration file for BIND 8.x is /etc/named.conf. In the /etc/named.conf
    file, you can specify options, such as the default directory for named files,
    and specify the zones for the named entries you''re hosting. There are two types
    of named files that you host. The first is the database (db) entry specified for
    each domain entries named either db.domain.com or domain.com.db, depending on
    the naming scheme you use. The db entries are the forward DNS entries for your
    domain. The second type of named file you host is the reverse DNS file, denoted
    by db.x.x.x.in-addr.arpa where x.x.x is the reverse subnet you''re hosting. For
    example, if you host the 192.168.1.x subnet, you have a db.1.168.192.in-addr.arpa
    reverse DNS file.


    Some DNS servers do not host the entire subnet. Therefore, the subnet provider
    (Internet Service Provider) hosts the reverse DNS information, and the in-addr.arpa
    entries are not required on your machine.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_283_0.png)'
  merge: -1
  pgno: 283
- img_proc: true
  md: "# named.conf\n\nThe /etc/named.conf file is the main configuration file for\
    \ named. Within the named.conf file, you specify options such as the default directory\
    \ for named entries (the Red Hat Linux 6.2 default is /var/named/) and zone entries\
    \ for named files. The following is a sample /etc/named.conf file:\n\n```\noptions\
    \ {\n  directory \"/var/named\";\n};\n\nzone \".\" {\n  type hint;\n  file \"\
    named.ca\"\n};\n\nzone \"1.168.192.in-addr.arpa\" {\n  type master;\n  file \"\
    db.1.168.192.in-addr.arpa\"\n};\n\nzone \"example.com\" {\n  type master;\n  file\
    \ \"db.example.com\"\n};\n\nzone \"example.net\" {\n  type slave;\n  file \"db.example.net\"\
    \n  masters (\n    192.168.0.100\n  );\n}\n```\n\nThis sample /etc/named.conf\
    \ file has five types of entries. (For clarity, each is highlighted separately).\
    \ The first two entries are mandatory configuration options for BIND. In this\
    \ example, the specified option sets where all named files will be placed. By\
    \ default, this option is set to /var/named/. Many DNS administrators are accustomed\
    \ to keeping named files under /etc/named/ and thus change this directory option\
    \ to \"/etc/named\".\n\nThe second entry is a default zone entry to specify which\
    \ file can be used as a \"hint\" for where to find name servers. By default, BIND\
    \ 8 uses /var/named/named.ca. This second entry is required, and editing this\
    \ entry or file is not recommended unless it's absolutely necessary."
  merge: -1
  pgno: 284
- img_proc: true
  md: "# 254 Chapter 10\n\nThe third entry in the example is a reverse DNS zone entry.\
    \ The zone specified is the “1.168.192.in-addr.arpa” zone. The reverse DNS is\
    \ a primary DNS record, so the type entry is set to master. The file with the\
    \ reverse DNS information is in /var/named/db.1.168.192.in-addr.arpa, so the file\
    \ is set to `db.1.168.192.in-addr.arpa`.\n\nThe fourth entry is a primary secondary\
    \ DNS zone entry. The zone specified is the “example.com” zone. Because the entry\
    \ is a primary DNS entry, the type is set to master. The file for the entry is\
    \ found in /var/named/db.example.com, so the file is set to `db.example.com`.\n\
    \nThe fifth entry is a sample secondary DNS zone entry. The zone specified in\
    \ the example is “example.net”. Because the entry is a secondary DNS entry, the\
    \ type is set to slave. The file for this secondary entry is found in /var/named/db.example.net,\
    \ so the file option is set to `db.example.net`. Because this entry is a secondary\
    \ DNS entry, you must provide the primary DNS server information to retrieve the\
    \ DNS information. In this entry’s case, the primary DNS server is 192.168.0.100;\
    \ therefore, the masters option is set to 192.168.0.100.\n\n# Forward DNS Files\n\
    \nForward DNS files are used to resolve domain names to the domains’ assigned\
    \ IP addresses. These files, by default, are found under the /var/named/ directory\
    \ and are typically named db.domain.com or domain.com.db. In these examples, I’ll\
    \ use db.example.com. The following is a sample forward DNS file for a master\
    \ (primary) record:\n\n```\n$TTL 86400\n@ ns.example.com. root.example.com. (\n\
    \    1999080101 : serial\n    10800 : refresh (3 hours)\n    3600 : retry (1 hour)\n\
    \    604800 : expire (7 days)\n    86400 : minimum (1 day))\n```\n\n| IN NS |\
    \ ns1.example.com. |\n| IN NS | ns2.example.com. |\n| IN MX | 0 mail.example.com.\
    \ |\n| IN A | 192.168.0.212 |\n| localhost IN A | 127.0.0.1 |\n| www IN A | 192.168.0.212\
    \ |\n| ns1 IN A | 192.168.0.10 |\n| ns2 IN A | 192.168.0.11 |"
