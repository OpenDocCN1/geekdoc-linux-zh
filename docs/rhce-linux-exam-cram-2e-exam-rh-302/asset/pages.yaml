- img_proc: true
  md: '# Hardware Configuration


    Older versions of Linux made hardware configuration much more difficult compared
    to other operating systems, such as Microsoft Windows, especially with newly released
    hardware. Many new devices simply weren''t supported, and you were required to
    write your own drivers or wait for someone else to. Today''s versions make installing
    new hardware very simple. You can now use both PCI and ISA plug-and-play devices.
    Advanced block device support is now enabled. You can even have Red Hat Linux
    automatically detect newly added hardware during the boot process.


    # Plug and Play


    When installing device cards, you will find two types of cards and different methods
    to configure each of them. The oldest of the two cards is the ISA card. ISA cards
    are connected to your computer via ISA slots on your motherboard. Some ISA cards
    are configured manually by setting jumpers located on the card. Newer ISA cards
    are Plug-and-Play (PnP) compatible, which means they can be configured with system
    tools. A newer type of device card is the PCI card, which is connected to your
    computer via the PCI interface on your motherboard. All PCI devices are PnP compatible.


    > Note: The 2.4 series of kernels will have built-in support for ISA PnP, so the
    manual tools (discussed next) won''t be required. The tools will still work but
    not the same way they do with the 2.2 kernel series.


    ISA PnP devices are configured with isapnp tools. The main tool, isapnp, uses
    a configuration file, isapnp.conf, to configure the ISA PnP device. An additional
    ISA PnP tool is pnpdump. The pnpdump tool is used to scan your ISA PnP cards and
    to dump the resource data from your cards to stdout (standard output). Some of
    this data includes IO ports, interrupts, and DMA channels. A third tool is pnpprobe.
    The pnpprobe tool is used to scan your ISA bus for PnP sound cards. The pnpprobe
    tool uses pnpdump to retrieve the sound card information.


    +   To install a jumperless ISA card, follow these steps:

    1. Run the following command: pnpdump > /etc/isapnp.conf.

    2. Edit the /etc/isapnp.conf file and make changes as needed.

    3. Run the following command: isapnp /etc/isapnp.conf.


    # Hard Drive Controllers


    Support and tools to interface with your hard drive controllers have greatly improved
    in the last few versions of Red Hat Linux. A tool used to set low-level'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'parameters for your hard drive controllers hdparm. The hdparm tool can allow
    you to enable or disable various parameters on your hard drive, such as 32-bit
    I/O support for an EIDE controller.


    One popular feature, especially among server installations of Red Hat Linux, the
    support for RAID (Redundant Array of Independent or [Inexpensive] Disks). A new
    feature of Red Hat 6.2 is the ability to configure RAID during the installation
    process. RAID configuration is prompted during the installation phase when you
    configure your hard disk partitions with Disk Druid (see Chapter 5 for details).


    Use RAID when you want to use multiple hard disk drives as one logical drive.
    There are multiple types of RAID, which are indicated by the level number. All
    RAID levels use methods of mirroring and striping. Mirroring data refers to having
    identical copies of data in separate locations (disks). Striping data refers to
    distributing data across multiple disks, not simply copying it. RAID level 5 (referred
    to as RAID 5) is the most common form of RAID. RAID 5 uses striping with parity
    across your RAID array. RAID 1 is used to mirror identical copies of data between
    pair disks. RAID 0 is used for simply striping data across the disks in your array.


    Some tools used when you''re implementing mkraid, raidstart, and raidstop. The
    mkraid tool is used to initialize your RAID device array. The de-fault configuration
    file used by mkraid is /etc/raidtab. The raidstart and raidstop tools are fairly
    self-explanatory. The first tool, raidstart, is used to start your RAID array
    configuration. The second tool, raidstop, is used to stop your RAID array configuration.


    # Detecting New Hardware


    New to Red Hat in version 6.1 was kudzu. The kudzu tool probes for new hard- during
    a Red Hat system boot. With this new feature, you''re immediately given the choice
    to configure the device now or later.


    During the boot sequence, kudzu queries known control devices for newly-attached
    devices or peripherals. Next, it queries the interrupts directly for device response.
    If a new device is detected, you''re prompted to configure your new device. A
    database, located in /etc/sysconfig/hwconf, contains your hardware configuration
    information to be used by kudzu.


    Note: Serial devices aren''t detected by kudzu during boot. Serial devices are
    probed only during the initial installation process.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Filesystem and Mount Configuration


    In order to read, write, or otherwise use additional filesystems and devices,
    you must be able to mount them. To do so, you must use the mount command and supply
    information such as the device, the filesystem type, and the mount point. Some
    filesystem types that are available include:


    +   - vfat—Used to mount Windows partitions and filesystems

    - mdos—Used to mount MS-DOS filesystems and devices

    - ext2—Used for Linux filesystems

    - iso9660—Used for CD-ROM devices


    The syntax for the mount command for a device is:


    ```

    mount -t type /dev/device /mnt/mountpoint

    ```


    Replace type with the filesystem type, device with the device or partition to
    be mounted, and mountpoint with the mount directory you want to use. For example,
    to mount an iso9660 filesystem of a CD-ROM to /mnt/cdrom, first make sure that
    the /mnt/cdrom mount point is created, and then issue this command:


    ```

    mount -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    Many times, you can eliminate the filesystem type and mount point, allowing for
    easier mount procedures, rather than simply entering mount /dev/cdrom. You can
    do this because of the entries in the /etc/fstab file, discussed in Chapter 3.
    Entries in the /etc/fstab file set up default settings for mount options. Each
    entry sets default settings as the mount point, the type of filesystem, how it
    should be mounted, if it''s to be dumped, and in what order the filesystems should
    be checked. Here is an example of an /etc/fstab file:


    | /dev/hda3 / ext2 defaults 1 1 |

    | /dev/hda1 /boot ext2 defaults 1 2 |

    | /dev/hda4 /swap swap defaults 0 0 |

    | /dev/fd0 /mnt/floppy ext2 noauto 0 0 |

    | /dev/cdrom /mnt/cdrom iso9660 noauto,ro,user 0 0 |


    The first entry specifies that /dev/hda3 should be mounted to (root) as an ext2
    filesystem with default mount options. It should be dumped and checked first.
    The second line specifies that /dev/hda1 should be mounted as /boot as an ext2
    filesystem. It should be mounted with the default mount options, should be dumped,
    and'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'should be checked second. The third line specifies that /dev/hda4 be mounted
    as a swap filesystem with default mount options, but not dumped or checked in
    any order. The fourth line specifies that /dev/fd0 be mounted as /mnt/floppy with
    an ext2 filesystem but not mounted automatically at boot, and so on.


    Note: When you read the /etc/fstab file, note the different device-naming conventions.
    For instance, /dev/hda1 is the first master hard drive. The h specifies it''s
    an IDE drive, and the 1 specifies that it''s the first partition on the drive.
    However, /dev/sdb3 indicates that it''s the second (slave) SCSI drive. The 3 indicates
    that it''s the third partition on that drive.


    Adding entries to /etc/fstab (or changing them if necessary) doesn''t require
    to restart any services to make the changes go into effect. In fact, after changing
    the /etc/fstab file, you can mount the devices in several manners, such as


    mount /mnt/mountpoint


    or


    mount /dev/device


    The unsupplied information, such as type, mountpoint, or device (as needed) are
    automatically assigned. You can use this convention unless you decide to read
    from a device with other filesystems, and so on, that are specified in the file.
    For instance, if your floppy has an mdsdos filesystem, specify -t mdsdos for the
    type options. To unmount any filesystem or device, use the unmount command as
    you would use the mount command, as in


    mount /mnt/cdrom


    # Managing Packages with RPM


    RPM, which you use to manage packages, is open source. It can be used on several
    other Linux distributions and even commercial Unix systems other than Red Hat.
    RPM can run in many modes. Some of these include the ability to install, query,
    verify, check signatures, and build RPM packages in rebuilding the RPM databases;
    file permissions; and set owner and group settings. RPM files are usually named
    with the .rpm extension, but this naming convention is for practice only. The
    .rpm extension doesn''t give special technical meaning to a file. Unlike DOS files,
    renaming TEXT.EXE to TEXT.TXT would cause the executable to stop functioning,
    test.rpm could be renamed as test_tst or even just as, and RPM would still recognize
    the package file.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Getting to Know RPM


    Much like Linux, RPM didn''t just magically appear and work. It was developed
    over time, based on several other package-management projects. The first development
    of today''s RPM was found in RPP. RPP was used in the first Red Hat Linux distributions.
    In fact, its first features are still the foundation for the purpose and features
    of RPM today. RPP is credited with being the initial source for the simple one-line
    commands to install and uninstall packages. RPM also introduced the scripts that
    are run before after packages are installed and uninstalled. The initial query
    and verify features were also introduced with RPP. Unfortunately, the features
    available with RPP just were not enough.


    The need for more features led the Red Hat software developers to peer in on the
    projects for package management that the developers of BOGUS distribution were
    developing. The BOGUS developers, led by Rik Faith, were working on a package-management
    project called PMS (Package Management System). The feature that RPP was lacking
    PMS had mastered the concept of pristine sources. Pristine sources allowed the
    packer to release versions of software and to track the changes made to the previous
    version.


    Three more steps were taken before we had the RPM we know and love today. Interestingly
    enough, Red Hat itself supported/or developed all three steps. In the first step,
    Faith and Doug Hoffman had a contract with Red Hat Software to produce PM, the
    new updated Package Manager that incorporated the features of RPP with the pristine-source
    feature of PMS. Although PM''s functionality was close to that of the RPM we have
    today, it still lacked good core database design and had no multiple architecture
    support. PM was never used in a commercially available product.


    Red Hat developers Marc Ewing and Erik Troan completed the last two steps for
    developing RPM. The first of these two steps introduced the first version of the
    official RPM, which was developed in Perl. The last step rewrote RPM in the C
    development language to increase the program''s speed. After the C rewrite, new
    developments such as package dependencies were added.


    # Installing, Uninstalling, and Upgrading with RPM


    The fundamental job of RPM is to add and remove components from your system. An
    RPM file is actually a type of compressed archive. Using the rpm command, you
    can install, delete, and upgrade these RPM-archived packages.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Basic Configuration and Administration


    To install an RPM file, use the command-line option -i (for install). For example,
    to install an RPM file for sendmail (such as sendmail-8.9.3-20.i1386.rpm), enter


    ```

    rpm -i sendmail-8.9.3-20.i1386.rpm

    ```


    To uninstall an RPM package, use the command-line option -e (for erase). To uninstall
    the sendmail-8.9.1-2.i1386.rpm sendmail package, enter


    ```

    rpm -e sendmail-8.9.3-20.i1386.rpm

    ```


    Another task that you can perform with RPM is to upgrade individual components
    or packages on your system without having to completely reinstall them. Unlike
    the configuration files of tar files or gzip packages, the configuration files
    of RPM packages are preserved when you upgrade. Therefore, you won''t lose your
    configuration. To upgrade a package, use the -U option (for upgrade). To upgrade
    to the sendmail-8.9.3-20.i1386.rpm sendmail package, enter


    ```

    rpm -U sendmail-8.9.3-20.i1386.rpm

    ```


    ![](img/fe9012f0d9b0102febe0e70f330ee448_166_0.png)


    When you are installing or upgrading a package, it''s helpful to use the -v and
    -h options. The -v option (for verbose) prints the name of the file within the
    package it''s installing. The -h option (for hash mark, #) prints hash marks to
    show how far the installation has progressed. An example of using both of these
    options is:


    ```

    rpm -ivh sendmail-8.9.1-2.i1386.rpm

    ```


    Another helpful RPM installation option is -F (for freshen). Freshen allows you
    to automatically compare a list of RPM files against the RPM already installed
    on your system. If an RPM within the list of RPMs is newer than the one on your
    system, it''s automatically upgraded. If an RPM file within the list isn''t newer
    than the one on your system (or is even installed on your system), it''s ignored.
    To use the -F option, run


    ```

    rpm -F *.rpm

    ```


    from the directory that contains the list of RPM files you want to compare. Note
    that *.rpm refers to every RPM file in that directory. You can also use other
    wildcards, file names, or combinations thereof to get whatever result you are
    looking for.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'Note: Several commands can be issued to RPM at the end of the string following
    two dashes (–). To force a package to install, use -force. To ignore package dependencies
    and install, use -nodeps. To identify uninstalled packages that Red Hat requires,
    use -redprovides (this option requires the rpmdb-redhat package to be installed).


    # Querying with RPM


    RPM was designed with querying capabilities. The RPM archives have custom binary
    headers that contain data about the package and its contents, allowing you to
    query individual packages very easily. You can search through your system database
    for packages and find out which package file belongs, and so on.


    To query for a specific package, use the -q option (for query). Using the rpm-q
    option requires an argument that specifies the package name, such as libc. How-ever,
    passing an -a option (for all) to the -q option, such as


    ```

    rpm -qa

    ```


    queries and prints all installed RPM files on your system. Here''s a sample output
    of querying specifically for all the libc packages you have installed on a system:


    ```

    # rpm -q libc

    libc-5.32-31 and libc-5.32-28.

    ```


    This output shows that this particular system has two libc packages installed:
    libc-5.32-31 and libc-5.32-28. To get information about specific packages, you
    can use the -i option with the query. The format for this is


    rpm -qi packlename


    The output of this command gives you information such as the name of the package,
    any relocations (if applicable), the version, the vendor, the build date, the
    installation date, and the source RPM. In addition, it gives you a summary of
    the package and a detailed description of the package and its use.


    Additional options used with the rpm query function are the -l (for list) and
    the -f (for file) options. The -l option queries the contents of an RPM file.
    The -f function queries files of an RPM. The rpm-ql command is used against an'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'existing RPM file. It lists all the files and directories that are contained
    within the RPM. For instance,


    ```

    rpm -ql libc

    ```


    lists all the files and directories of the libc package. The rpm -qf command is
    used against an existing file; using this command on a file queries for the package
    that owns the specific file. For instance, doing an


    ```

    rpm -qf xxbill

    ```


    while you''re in the /usr/lib directory yields


    ```

    xbill-2.0-6

    ```


    which means that the xbill-2.0-6 RPM file installed the /usr/lib/xbill file.


    > You aren''t always expected to use the package name. If you are using Linux''s
    tab completion feature, the -p option is especially useful. This option specifies
    that you are using the full package name, not just the package name. For instance,
    using rpm -qi libc gets the same results as using rpm -qip libc-5.3.12-31.src.rpm.


    # Verifying with RPM


    In addition to using RPM to query for specific files that you''ve already installed
    on your system, you can verify packages against the original RPM database or the
    package''s origin. You verify a package when you want to check for problems, such
    as corrupted or missing files, within it. After verifying a package, you can reinstall
    the package because any current configurations you have set for the package are
    preserved.


    To verify a package, you use the -V option (verify). The output of the -V option
    is a string of eight characters, possibly followed by a c (indicating that it
    is a configuration file) and then followed by the path and file name. The most
    important information in the output is the eight-character string, in which each
    character displays the result of the comparison between one attribute of the file
    compared to the value of the same attribute recorded in the RPM database. A single
    character (.) for a specific character means that the attribute matched. Table
    6.1 lists the eight characters and their attributes.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'To give you an idea of what verifying a package looks like, here is an example
    of verifying the sendmail package:


    ```

    $rpm -V sendmail

    nG. /etc/aliases.db

    S.5 -T /var/log/sendmail.st

    ```


    The output shows two files with differences: aliases.db and sendmail.st. The aliases.db
    file has different Group attributes; the sendmail.st file has different file sizes,
    MD5 sums, and Mtimes.


    # Verifying RPM Origin


    Another item worth verifying from your RPM is the origin of your RPM. To verify
    the origin, RPM can check the GPG (GNU Privacy Guard) signature of the package.
    You can check the GPG signature in one of two ways: either with the -K option
    or with the -checksig option.


    # Other RPM Utilities


    Since RPM 3.0.4, you''ve been able to install, upgrade, and freshen RPM packages
    over a network through either an FTP or an HTTP connection. An FTP connection
    allows globbing, or specifying more than one file at a time, whereas an HTTP connection
    allows you to specify only one file. Here''s an example of updating all of your
    RPM packages:


    ```

    rpm -Fvh http://updates.redhat.com/6.2/1386/*.rpm

    ```


    Another useful utility is rpmfind. The rpmfind utility allows you to locate the
    packages you need to install via Internet servers and mirror sites. When using


    | Table 6.1 Output of the RPM Verify option.

    | Character | Attribute |

    | 5 | MD5 sum |

    | S | File size |

    | L | Symlink |

    | T | Mtime |

    | D | Device |

    | U | User |

    | G | Group |

    | M | Mode (includes permissions and file type) |'
