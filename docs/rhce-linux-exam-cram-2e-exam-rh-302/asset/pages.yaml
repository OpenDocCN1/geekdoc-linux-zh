- img_proc: true
  md: 'Security is an essential part of networking. Keeping your system secure from
    crackers and available for only authorized use is a must. With very basic security
    problems can arise from standard daily activities. With such emphasis placed on
    network security, it''s important for an RHCE in the workplace to be comfortable
    with setting up network security. Knowledge of security concepts, tools, and configuration
    is essential. In this chapter, I will discuss security concepts, NIS (Network
    Information Service), LDAP (Lightweight Directory Access Protocol), PAM (Pluggable
    Authentication Modules), inet, and tcp_wrappers. I will also discuss some advanced
    network options, including routing, firewalling, and IP masquerading and SSH (Secure
    Shell).


    # # NIS


    NIS is Sun Microsystems Network Information Service. It was formerly known as
    Yellow Pages, but after a trademark dispute with British Telecom, Sun changed
    the name to Network Information Service. The original name, Yellow Pages, is why
    all the NIS-related commands begin with you.


    NIS is a simple directory service whose main purpose is to allow authentication
    of systems on local networks. NIS allows configuration information—such as passwd
    and group files, sendmail aliases, automount maps, and hosts files—to be kept
    on a central server. Each system in the NIS domain runs the NIS client, ybind,
    to find a server and retrieve the appropriate maps on it.


    NIS uses a master/slave server configuration that resembles DNS. The master NIS
    server holds the NIS map files. Changes in the maps are then pushed to the slave
    server(s). Although an NIS domain can operate with only one server, it''s best
    to have at least one server for redundancy.


    You must run the RPC portmapper (/usr/sbin/portmap) to run NIS. The RPC portmapper
    servers convert the RPC program numbering to TCP/IP or UDP/IP protocol port numbers.


    # # NIS on Red Hat Linux


    Red Hat Linux 6.2 ships with NIS-v.2-compliant clients, servers, and tools. The
    three NIS packages in Red Hat Linux 6.2 include ybind (the NIS client), yps (the
    NIS server), and yp-tools (the utilities for querying the NIS server). NIS is
    used only when specified by the /etc/nsswitch.conf file and ybind. In this section,
    I will discuss the NISbind and NIS server commands.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# NIS Client


    The NIS client is responsible for querying the NIS server for information from
    the NIS system maps and for other NIS information. NIS clients use six main tools:


    +   - ypbind—Finds and stores information about an NIS domain and server. Information
    is stored in /var/yp/binding. This tool runs during boot-up.


    +   - ypwhich—Returns the value of the NIS server used by the NIS client.


    +   - ypcat—Prints the values of all keys in the specified NIS map.


    +   - yppoll—Returns the version and master server of the specified NIS map.


    +   - ypmatch—Prints the values of keys from an NIS map.


    +   - ypdomainname—Prints the name of the NIS domain.


    # NIS Server


    The NIS server is responsible for hosting the NIS maps responding to NIS client
    requests, for managing changes to NIS maps (especially the NIS password map),
    and, in the case of a master NIS server, for pushing map changes to slave servers.
    In addition to the NIS client commands, the NIS server uses NIS commands such
    as:


    +   - ypserv—Starts the NIS server program.


    +   - ypasswd—Starts the server that handles the NIS password changes.


    +   - makedbm—Translates ASCII databases, such as /etc/passwd, to DBM databases.


    +   - yppush—Notifies the slave servers when master databases are changed.


    # /etc/nsswitch.conf


    NIS is used only when specified by the /etc/nsswitch.conf file. The GNU C library
    includes support for the Name Service Switch file (/etc/nsswitch.conf), which
    is patterned after the nsswitch.conf file on Solaris 2. The Name Server Switch
    file configures the order of lookups for various services. The following code
    is the /etc/nsswitch.conf file that is shipped with Red Hat 6.2.


    ```

    #

    # /etc/nsswitch.conf

    #

    # An example Name Service Switch config file. This file should be

    # sorted with the most-used services at the beginning.

    ```'
  merge: -1
