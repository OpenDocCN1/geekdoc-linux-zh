    # mount


    The utility required to use NFS is a client to mount a remote NFS filesystem.
    Common use of the mount utility is used to mount a remotethost/path /local/path.
    There are several commonly used mount options for NFS. Table 10.2 lists the most
    common options used on NFS.


    Using the previous mount options, you could mount the filesystem /export on the
    NFS server linux.example.com with an 8K blocksize on /mnt/nfs by issuing the following:


    ```

    linux.example.com:/export /mnt/nfs -o rsize=8192,wsize=8192

    ```


    # NFS Tools


    In addition to the mount command to mount the NFS filesystems, there are a few
    other NFS tools to help you use and admin NFS filesystems. Table 10.3 lists a
    few extra tools to make your life with NFS easier.


    | Table 10.2 NFS mount options. |

    |---||

    | rsize=num | Read num bytes at a time (instead of the default 1024 bytes). |

    | wsize=num | Write num bytes at a time (instead of the default 1024 bytes). |

    | soft | If a timeout occurs, return an I/O error to the calling program. |

    | hard | If a timeout occurs, send a "Server not responding" message to the console
    and continue to retry. (This is the default behavior). |

    | intr | For a hard mount that has timed out, allow I/O to be interrupted with
    a signal to the calling program. (The default is not to allow I/O on a hard mount
    to be interrupted.) |


    | Table 10.3 NFS tools. |

