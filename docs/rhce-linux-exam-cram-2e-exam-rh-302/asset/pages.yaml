  md: '# Sample Lab Objectives


    Please review and complete the following objectives. (In addition, you''ll want
    to review the tasks from each chapter and feel comfortable completing them.) The
    following objectives, like the objectives of the exam, are performance-based.
    This means that there are no right-or-wrong, yes-or-no answers. The credit is
    given for making the objective work, and making it work right, not necessarily
    for the steps you took to get there or the tools you used. Therefore, you will
    not find an answer key for this section in the back of the book (as you will for
    the multiple-choice element of the exam in Chapter 14).


    # Objective 1


    +   * Install Red Hat Linux with the CD-ROM media provided. Set up the machine
    with separate partitions dedicated for /boot,/home, /(root), /var, and swap. Configure
    the Red Hat machine to support networking via DHCP, X Window System, and printing.


    # Objective 2


    Your mom wants an account on your machine. Set her up with a nonprivileged account
    where she can browse the Internet and receive email. Well, Linux is catching on
    all at your house—Dad and little sister Pam want accounts, too. Set dad up with
    an account. He wants his email forwarded to his dad@example.com account. Pam wants
    an email-only account on your machine. That way she can download her email to
    her computer at school.


    # Objective 3


    Compile a custom modularized kernel. Customize options such as machine type and
    hardware support, and disable options, such as SDN and Infrared, that might not
    be available on your machine. The main objective is to have a kernel configured
    specifically for your machine. Set up the machine so that you have a choice to
    boot from either your new kernel or your old kernel.


    # Objective 4


    Your mom is really tired of using WindowMaker. She wants to try KDE instead. Your
    little sister Pam decides she wants to browse the Internet when she''s at home,
    too, but she prefers fwm95. Dad just doesn''t like change, so he wants to keep
    WindowMaker. Set each of these users up to automatically start up their favorite
    desktop or window managers when they log in.'
