- img_proc: true
  md: '# The Exam Situation


    When you arrive at the testing center where you scheduled your exam, or at Red
    Hat''s training facility, you''ll need to sign in with an exam coordinator. He
    or she might ask you to show two forms of identification, one of which must be
    a photo ID. After you''ve signed in, you''ll be escorted to your testing station,
    and you''ll be asked to deposit below your books, bags, or other items you bring
    with you. Typically, the room will be furnished with anywhere from half a dozen
    to computers.


    You''ll be furnished with a pen and pencil and a blank sheet of paper. You''re
    allowed to write down any information you want on both sides of this sheet. Before
    the exam, you should memorize as much as you can of the material that appears
    on The Cram Sheet (inside the front cover of this book) so you can write information
    on the blank sheet as you are seated in front of the computer. You can refer to
    your rendition of The Cram Sheet any time you like during the test. Keep in mind,
    however, that most of the RHCE exams are performance based, not multiple choice.
    This means that you''ll be facing time restrictions that you have to balance between
    your physical system time, task coordination, and more. So use your time wisely.


    The exam situation will be staffed by all the instructors or exam coordinators,
    who will monitor the tests and give instructions when necessary. In addition,
    the instructor is available as a last resort for help. Please note that asking
    the instructor for help does affect your score by a very large percentage (as
    much as 25 percent for one question). If you''re running out of time and can''t
    get past a specific portion of the exam, you might opt to take the point reduction
    to complete the exam. Depending on which part of the exam you begin, the instructor
    will have loaded or prepared the appropriate Red Hat certification exam setup.
    You''ll be testing with a number of other students, and you''ll all be asked to
    start at the same time.


    All Red Hat certification exams allow a maximum amount of time in which to complete
    your work. The RHCE 302 Exam consists of three sections. The sections are presented
    in random order—meaning that the time written exam might be first, another time
    the Installation Lab, and another time the Debugging Lab—so make sure you''re
    prepared before entering the exam area. You might not be able to take advantage
    of the breaks between exams to prepare for the next one. The exam takes a total
    of six hours: two and a half hours for each hands-on exam and one hour for the
    written exam.


    Red Hat certification exams are performance based. Although this might sound quite
    simple, the exam comprises three elements, two of which, as I mentioned, are hands-on.
    You''re given a task assignment for each section, as well as a'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 4 Chapter 1


    nondisclosure agreement stating that you won''t disclose the information and questions
    on the exam. In the debugging section, you''ll be asked to fix a system with a
    problem that the instructor has set up. This section has two tasks with individual
    goals assigned to each task. You are graded for each goal you reach in task.


    The installation and configuration section of the exam is also hands-on. It also
    provides you with a task list of multiple scenarios, goals, and system processes
    to set up on an uninstalled, unconfigured machine.


    The least stressful part of the exam is the written element, composed of 50 multiple-choice
    questions. Do not let the simplicity of a multiple-choice exam fool you, however.
    You might be asked to select the best or most effective solution to a problem
    from a range of choices, all of which technically are correct. In addition, you
    can also guarantee that you''ll be presented with questions that were not made
    available in any preparation material or even to those individuals participated
    in the RHCE 302 preparation course. Taking the exam is quite an adventure, and
    involves real thinking, skill, and time management. This book shows you what to
    expect and how to deal with the potential problems, puzzles, and predicates.


    # Exam Layout and Design


    For the multiple-choice exam, each question typically presents four or five options.
    The written exam is expected to change often (to fully test the exam taker), so
    you never know when you''re going to get a curve ball. To get comfortable with
    all types of questions, I''ve included some differently formatted questions in
    the end-of-chapter questions (the "Practice Questions" section in each chapter).
    For example, in this book, at least, you''ll have to answer questions that have
    multiple correct answers, such as “What are three video configuration tools used
    in Red Hat 6.2"


    # Exam-Taking Basics


    The most important advice about taking any exam is this: Read each question carefully.
    Some questions are deliberately ambiguous, some use double negatives, and others
    use terminology in imprecise ways. The author has taken numerous exams—both practice
    and live—and in nearly every one she has missed at least one question because
    she didn''t read it closely or carefully enough.


    Here are some suggestions on how to deal with the tendency to jump to an answer
    too quickly:


    +   - Make sure you read every word in the question. If you find yourself jumping
    ahead impatiently, go back and start over.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'As you read, try to restate the question in your own terms. If you can do this,
    you should be able to pick the correct answer(s) much more easily.


    When returning to a question after your initial read-through, read every word
    again—otherwise, your mind can fall quickly into a rut. Sometimes revisiting a
    question after turning your attention elsewhere lets you see something you missed,
    the strong tendency is to see what you''ve seen before. To avoid that tendency
    at all costs.


    If you return to a question more than twice, try to articulate yourself what you
    don''t understand about the question, why the answers appear not to make sense,
    or what appears to be missing. If you chew on the subject for a while, your subconscious
    might provide the details that are lacking, or you might notice a “trick” will
    point you to the right answer.


    Above all, try to deal with each question by thinking through what you know about
    Red Hat Linux and Linux in general—the characteristics, behaviors, facts, and
    figures. By reviewing what you know (and what you''ve written down on your information
    sheet), you''ll often recall or understand things sufficiently to determine the
    answer to the question.


    # Question-Handling Strategies


    Based on exams the author has taken, some interesting trends have become apparent.
    In the multiple-choice element, for questions taking only a single answer, usually
    two or three of the answers will be obviously incorrect, and two of the answers
    will be plausible—but, of course, only one can be correct. Unless the answer leaps
    out at you (if it does, reread the question to look for a trick; sometimes those
    are the ones you''re most likely to get wrong), begin the process of answering
    by eliminating those answers that are most obviously wrong.


    Things to look for in obviously wrong answers include spurious menu choices or
    utility names, nonexistent software options, and terminology you''ve never seen.
    If you''ve done your homework for an exam, no valid information should be completely
    new to you. In that case, unfamiliar or bizarre terminology probably indicates
    a totally bogus answer.


    Numerous questions assume that the default behavior of a particular utility is
    in effect. If you know the defaults and understand what they mean, this knowledge
    will help you cut through many Gordian knots.


    Budget your time by making sure you''ve completed one-fourth of the questions
    one-fourth of the way through the exam period (or the first 12 or 13 questions
    in the first 14 or 15 minutes) and completed three-quarters of them three-quarters
    of the way through (36 or 37 questions in the first 45 to 47 minutes).'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'If you''re not finished when 55 minutes have elapsed, use the last 5 minutes
    to guess your way through the remaining questions. Remember, guessing is potentially
    more valuable than not answering because blank answers are always wrong, but a
    guess might turn out to be right. If you don''t have a clue about any of the remaining,
    pick answers at random, or choose all a''s, b''s, and so on. The important thing
    is to submit an exam for scoring that has an answer to every question.


    # # Mastering the Inner Game


    In the final analysis, knowledge breeds confidence, and confidence breeds success.
    If you study the materials in this book carefully and review all the examprep
    questions at the end of each chapter, you should become aware of those areas where
    additional learning and study are required.


    Next, follow up by reading some or all of the materials recommended in the “Need
    to Know More?” section at the end of each chapter. In addition, check out one
    of the online resources listed in Chapter 4. The idea is to become familiar enough
    with the concepts and situations you find in the sample questions that you can
    reason your way through similar situations on a real exam. If you know the material,
    you have every right to be confident that you can pass the exam.


    After you''ve worked your way through the book, take the practice written exam
    in Chapter 14. This will provide a reality check and help identify areas you need
    to study further. Before scheduling a real exam, make sure you follow up and review
    materials related to the questions you miss on the practice exam. Only when you''ve
    covered all the ground and feel comfortable with the whole scope of the practice
    exam you should take a real one.


    > If you take the practice written exam and you don''t score at least 85 percent
    correct, you''ll want to practice further.


    Armed with the information in this book and with the determination to augment
    your knowledge, you should be able to pass the certification exam. However, you
    need to work at it, or you''ll spend the exam fee more than once before you finally
    pass. If you prepare seriously, you should do well. Good luck!


    # # Additional Resources


    A good source of information about Red Hat certification exams comes from Red
    Hat itself. Because its products and technologies—and the exams that go with them—change
    frequently, the best place to go for exam-related information is online.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Red Hat Certification Exams


    If you haven''t already visited the Red Hat Certified Engineer site, do so right
    now. The RHCE home page resides at http://www.redhat.com/training.html.


    Note: This page might not be there by the time you read this, or it might have
    been replaced by something new and different, because things change regularly
    on the Red Hat site.


    The options on the home page''s menu point to the most important sources of information
    in the RHCE pages. Check out the Certification Options to read about the various
    certification and training programs that Red Hat offers.


    These are just the high points of what''s available in the Red Hat certification
    and training pages. As you browse through them—and I strongly recommend that you
    do—you''ll probably find other informational tidbits mentioned that are every
    bit as interesting and compelling.


    # Coping with Change on the Web


    Sooner or later, all the information about the Red Hat Certified Engineer and
    training pages, and the other Web-based resources throughout this book, will go
    stale or be replaced by newer information. In some cases, the URLs you find here
    might lead you to their replacements; in other cases, the URLs will go nowhere,
    leaving you with the dreaded "404 File not found" error message. When that happens,
    don''t give up.


    There''s always a way to find what you want on the Web if you''re willing to invest
    some time and energy. Most large or complex Web sites—and Red Hat''s qualities
    on both counts—offer a search engine. As long as you get to Red Hat''s site (it
    should stay at http://www.redhat.com for a long while yet), you can use this tool
    to help you find what you need.


    The more focused you can make a search, the more likely it is that the results
    will include information you can use. For example, you can search for the string
    "training and certification" to produce a lot of data about the subject in general,
    but if you''re looking for the installation guide for Red Hat 6.2 you''ll be more
    likely to get there quickly if you use a search string similar to the following:
    "Installation Guide Red Hat 6.2".


    Finally, feel free to use general search tools—such as http://www.google.com,
    http://www.search.com, http://www.altavista.com, and http://www.excite.com—to
    search for related information. The bottom line is this: if you can''t find something
    where the book says it is, intensify your search.'
