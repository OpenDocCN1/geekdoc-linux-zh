    from the current type to a new type (for instance, changing a Linux native to
    Linux swap). The option gives you a list of supported types and their codes. The
    q option quits fdisk without saving changes, and the w writes the table to disk
    and exits.


    # mkfs


    The administration tool mkfs is used to build a filesystem on a device, usually
    a hard-disk partition. The mkfs tool is simply a front end for the various filesystem
    builders available for Linux. Typical usage of mkfs looks like this:


    ```

    mkfs [-V ] [-t ftype ] [- fs-options ] filesys []

    ```


    The following list explains the typical options used with mkfs as well as some
    additional options available:


    +   - -V-Produces verbose output, including all filesystem-specific commands that
    are executed. This is useful for testing.

    - -ftype-Specifies the type of filesystem to be built. If the type isn''t specified,
    the default filesystem type (currently ext2) is used.

    - fs-options-Specifies filesystem-specific options to be passed to the real filesystem
    builder.

    - -c-Checks the device for bad blocks before building the filesystem.'
