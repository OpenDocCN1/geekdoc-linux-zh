    # Troubleshooting Your Installation


    After viewing the dmesg logs, you might notice that specific pieces of hardware
    are not loading properly. If you think a piece of hardware has a compatibility
    issue—or perhaps the driver for your hardware was not available during installation—check
    out the “Hardware Compatibility HOWTO” from the Linux Documentation Project at
    linuxdoc.org/HOWTO/Hardware-HOWTO.html.


    Another troubleshooting source is Red Hat, which offers a hardware guide for the
    Red Hat distribution. Red Hat also offers version-specific lists for older versions
    of Red Hat. These lists can be found at http://www.redhat.com/hardware/. Although
    both Red Hat and the Linux Documentation Project list much of the same information,
    the Red Hat list is most often accurate and current because Red Hat follows the
    support for each individual version.


    One of the most common installation problems other than hardware support relates
    to LILO. Occasionally, a disk sector is bad and LILO does not install to it properly.
    Other times, LILO doesn’t work because it was configured incorrectly. One of the
    best ways to troubleshoot your LILO problems is to watch the output of LILO itself.'
