- img_proc: true
  md: 'Open source software (OSS) and Linux in general have come a long way since
    Linus Torvalds began his hobbyist project called “Linux” back in 1990. In order
    to understand Linux at all, you must learn both the history and the general concepts
    before the development of OSS and Linux. So before you get engrossed with all
    the technical details of Linux, let''s discuss where it started and how it developed.
    This chapter will help you understand where Linux came from, what it''s all about,
    and where to look when you need more information.


    # # Understanding Open Source Software


    OSS (open source) is software whose source code is available to the public. Having
    publicly available source code does not necessarily mean that there are no copyright
    issues, however. In fact, OSS typically is copyrighted with restrictions to preserve
    its open source status, authorship, and control. OSS is usually developed by the
    mass effort of programmers all over the world. Universities, government agencies,
    and not-for-profit organizations (as well as individual programmers) develop OSS.


    Although companies and individuals released their source code for years, the actual
    label “open source” was not used until early 1998. On one early February day,
    a group of individuals met to discuss Netscape Communications’ January 1998 announcement
    that it was going to release the source code for its popular Web browser, Netscape
    Navigator. members of this group included Todd Anderson, Chris Peterson (of the
    Foresight Institute), Jon “maddog” Hall and Larry Augustin (of Linux International),
    Samckman (from the Silicon Valley Linux Users Group), and Eric S. Raymond.


    These individuals recognized the impeccable timing that would be needed to respond
    to Netscape Communications’ actions. The Linux and “free software” community would
    need to react appropriately to seize the opportunity to gain corporate recognition
    for the open development process. After brainstorming tactics, the corporate community,
    and Netscape Communications'' recent actions, this community finally agreed on
    the “open source” label. Peterson had this title instead of “free software.”


    Many things have happened to the open source community since it adopted the term
    “open source” instead of “free software.” Shortly after the announcement regarding
    the new movement toward OSS, a feverish debate between hackers all over the world
    began about the use of the new term. In fact, Richard Stallman, founder of the
    GNU project, considered using the new term, only for a little while. By the end
    of February, however, the roar died down over the “open source” label issue. All
    attention was diverted back to the corporate world as'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Netscape Communications and O''Reilly and Associates agreed to begin re-ferring
    OSS in their press releases and on their Web sites.


    At the end of March, Netscape Navigator''s source code was made freely avail-,
    spawning a massive download over the Internet. Within a few hours of its release,
    hackers all over the world began returning code fixes and enhancements.


    In April, the press began its stream of non-technical coverage of open source
    software for the public''s benefit. Salon magazine interviewed Eric S. Raymond
    (commonly referred to as "ESR" in the Linux community) and published an-article
    on the details of OSS.


    May was an exciting month for the open source community. Corel announced that
    it was going to port WordPerfect and its products to Linux. In addi-, Sun Microsystems
    and Adaptec were the first two large, established vendors to join Linux International.


    OSS began to heat up in July when an article was published in Forbes magazine.
    The focus of the article? An interview with Linus Torvalds himself.


    The number of open source projects continued to escalate into the end of the year.
    In October, Microsoft helped an exciting end to Linux''s first year. In response
    to its impending antitrust case, Microsoft released a formal statement claiming
    that Linus''s existence proved that Microsoft didn''t in have an operating-system
    monopoly. The year closed up with a bang after IDG announced that the Linux market
    share had increased by 212 percent in 1998.


    Today "open source" has been adopted as a mainstream term by the majority of technology
    vendors. Vendors that use open source projects today in their com-mercial businesses
    include Apple Computer, Inc., Compaq, Corel Corporation, IBM, SGI, and Sun Microsystems.


    # The Free Software Foundation (FSF)


    Before the OSS project began, the Free Software Foundation (FSF), founded to help
    protect and pursue the rights of free software, was already established. The FSF,
    which supports the free software movement, is currently a tax-exempt char-ity
    that raises funds to work on the GNU Project.


    According to the FSF, free software is a matter of liberty, not price. The FSF
    says that to understand the concept, you should think of "free speech," not "free
    beer." The FSF believes that free software is freedom for the user to run, copy,
    distribute, study, change, and improve software.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# The GNU Project


    The GNU Project was started in 1984 to develop a completely free Unix-like operating
    system. The GNU founder, Richard Stallman (also fondly known by his email handle
    RMS), is the best one to explain its beginnings, so here (quoted verbatim) is
    his original post to Usenet in September 1983. He explains his plans for the GNU
    Project:


    ```

    From Csvax:pur-ee:inuxclihnx5clihnp4!houxmimhuxileleagle!mit-vax!mit-eddie!RMS@mit-OZ

    From: RMS%OZ@mit-eddie

    Newsgroups: net.unix-wizards.net.usoft

    Subject: new UNIX implementation

    Date: 27-Sep-83 12:35:59 EST

    Organization: MIT AI Lab, Cambridge, MA

    ```


    Free Unix!


    Starting Thanksgiving I am going to write a complete Unix-compatible software
    system called GNU (for''s Not Unix), and give it away free to everyone who can
    use it. Contributions of time, money, programs and equipment are greatly needed.


    To begin with, GNU will be a kernel plus all the utilities needed to write and
    run C programs: editor, shell, C compiler, linker, assembler, and a few others.
    After this we will add a text formatter, a YACC, an Empire game, a spreadsheet,
    and hundreds of other things. We hope to supply, eventually, everything useful
    that normally comes with a Unix system, and anything else useful, including on-line
    and hardcopy documentation.


    GNU will be to run Unix programs, but will not be identical to Unix. We will make
    all improvements that are convenient, based on our experience with other operating
    systems. In particular, we will have longer filenames, version numbers, a crashproof
    file system, filename completion perhaps, terminal-independent display support,
    and eventually a Lisp-based window system through which several Lisp programs
    and ordinary Unix programs can share a screen. Both C and Lisp will be available
    as system programming languages. We will have network software based on MIT''s
    chaosnet protocol, far superior to UOUCP. We may also have something compatible
    with UOUCP.


    Who Am I?


    I am Richard Stallman, inventor of the original much-imititated EMACS editor,
    now at the Artificial Intelligence Lab at MIT. I'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'have worked extensively on compilers, editors, debuggers,

    command interpreters, the Incompatible Timesharing System and

    t Lisp Machine operating system. I pioneered terminal-

    independent display support in ITS. In addition I have imple-

    ment one crashproof file system and two window systems for

    Lisp machines.


    # Why I Must Write GNU


    I consider that the golden rule requires that if I like a

    program I must share it with other people who like it. I cannot

    in good conscience sign a nondisclosure agreement or a software

    license agreement.


    So that I can continue to use computers without violating my

    principles, I have decided to put together a sufficient body of

    free software so that I will be able to get along without any

    software that is not free.


    # How You Can Contribute


    I am asking computer manufacturers for donations of machines

    and money. I''m asking individuals for donations of programs

    and work.


    One computer manufacturer has already offered to provide a

    machine. But we could use more. One consequence you can expect

    if you donate machines is that GNU will run on them at an early

    date. The machine had be better able to operate in a resid-

    tial area, and not require sophisticated cooling or power.


    Individual programmers can contribute by writing a compatible

    du of some Unix utility and giving it to me. For most

    projects, part-time distributed work would be very hard to

    coordinate; the independently-written parts would not work

    together. But for the particular task of replacing Unix, this

    blem is absent. Most interface specifications are fixed by

    Unix compatibility. If each contribution works with the rest of

    Unix, it will probably work with the rest of GNU.


    If I get donations of money, I may be able to hire a few people

    full or part time. The salary won''t be high, but I''m looking

    for people for whom knowing they are helping humanity is

    important as money. I view this as a way of enabling dedicated

    people to devote their full energies to working on GNU by

    sparing them the need to make a living in another way.


    For more information, contact me.'
