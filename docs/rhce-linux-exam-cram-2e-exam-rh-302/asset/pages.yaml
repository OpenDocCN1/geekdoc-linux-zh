  md: '# vmlinux


    vmlinux

    A compressed vmlinux kernel file, which is a play on vmunix, the standard kernel
    name on Unix systems. (Compressed files often have the last character changed
    to z or have a .z or .Z appended to the file name.)


    xf86config

    Text-based configuration tool that is used to configure the XF86Config file.


    window

    A frame where any given application resides and is managed by the window manager.
    The active window is the window that you are currently using on your desktop.
    The active window is usually indicated by being on top, in focus, or highlighted
    compared to the inactive windows on the screen.


    xhost

    Tool used to grant X permission to host applications for other machines.


    xntp3

    Tool used to set up a continuously running synchronization daemon.


    ypcat

    Tool used to print the values of all keys in the specified NIS database.


    window manager

    The main interface between the X Window System and the user. The window manager
    provides functionality such as window borders, menus, icons, desktops, and toolbars,
    and allows the user to customize them all.


    ypmatch

    Tool used to print the values of keys from an NIS map.


    ypoll

    Tool used to return the version and master server of the specified NIS map.


    ypush

    Tool used to notify the slave servers when master databases are changed.


    X

    The X Window System, originally developed at MIT as a client-server protocol for
    building graphical user interfaces.


    ypwhich

    Tool used to return the name of the NIS server used by the NIS client.'
