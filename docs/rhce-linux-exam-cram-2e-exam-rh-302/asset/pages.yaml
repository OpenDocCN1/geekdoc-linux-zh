    file when they start up their X sessions. The .Xdefaults file is used by every
    type of Window Manager, including KDE, Window Maker, Enlightenment, AfterStep,
    and fwwm. You''ll find the following within the .Xdefaults file:


    +   Settings for basic X applications. The .Xdefaults file contains the defaults
    (such as color, size, and font options) for the emacs and XEmacs editors.'
