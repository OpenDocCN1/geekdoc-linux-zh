- img_proc: true
  md: '![](img/fe9012f0d9b0102febe0e70f330ee448_262_0.png)


    Figure 9.9 KDE.


    The kalendar program is a simple KDE-based calendar and to-do-list manager. The
    korganizer program is a slightly more complex program that involves a calendar
    and an appointment manager similar to those of Microsoft Outlook and Netscape''s
    NSCAL. You can find many additional applications for KDE at www.kde.org.


    # Remote X Applications


    A popular feature of the X Window System is that it can display an application
    on a remote host, as I mentioned earlier in this chapter. X is an entirely network-transparent
    system that can provide seamless access from one workstation to another that is
    running applications. Applications can be displayed on other machines, even if
    the other machines are not running the same operating system. To set up access,
    you must use a host authentication program, such as xhost or xauth, and use a
    command to export the DISPLAY environment variable, as export DISPLAY=remotehost:0.


    # Setting Up Remote Access


    You use the xhost program to grant permission to host applications for other machines.
    Using xhost is simple. To enable permission to display remote applications, use
    xhost +remotehost. To disable permission to display remote applications, use xhost
    -remotehost.'
