    192.168.100.0–j DENY.


    When specifying your rule, you can specify several types of targets. The target
    is what happens when your rule specifications are matched. Five of the most common
    target values are ACCEPT, DENY, REJECT, MASQ and REDIRECT. Table 11.5 lists each
