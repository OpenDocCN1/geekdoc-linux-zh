    # User Administration


    For most Linux administrators, the most time-consuming and important job is user
    administration. User administration can involve such things as adding and deleting
    user accounts, modifying user information, setting up basic user shell settings,
    and setting up user window managers.


    # Adding User Accounts


    There are several ways to add new user accounts to your system. You used to have
    to add users manually, but you can now use command-line tools—such as useradd,
    passwd, and mkpasswd—as well as graphical tools—such as linuxconf and userconf—to
    set up user accounts, passwords, home directories, shells, and more.


    Adding user accounts manually can be a very tedious task. First you have to edit
    the user and group files to add the user information in /etc/passwd and /etc/group,
    respectively. Next, you must create the user''s home directory and copy the default
    files and user directories from /etc/skel. Finally, you have to change the ownership
    of the new home directory so that the directory is owned by the new user.


    The most popular Linux (and Unix) user addition tool is useradd, which is the
    same as adduser. To add a new user using the useradd as root, enter adduser'
  merge: -1
