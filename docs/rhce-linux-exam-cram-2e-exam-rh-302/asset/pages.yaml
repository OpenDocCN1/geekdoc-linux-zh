    # Installation Process


    The installation method for Red Hat has changed significantly with each release.
    The release of Red Hat 6.1 was the first to introduce a graphical interface for
    the installation. However, for machines that wouldn''t support X or for users
    (like me) who were accustomed to the text interface, both options were available.


    # Beginning Your Installation


    As I mentioned earlier in this chapter, you begin your installation in different
    ways depending on your method of installation. The most standard installation
    uses a boot floppy and the Red Hat 6.2 CD-ROM. Some options do require a boot
    floppy at all. Others don''t require the CD but require special boot floppies.
    The most common types of installations include DOS autoboot, boot floppy/CD combination,
    NFS, FTP, and hard drive installations.


    # DOS Autoboot Install


    To begin your installation without using a boot floppy, you should have a bootable
    DOS partition on your machine. Boot to the DOS partition. Insert your Red Hat
    CD and change to the /dositools directory. Under the /dosit directory is a tool
    named autoboot.exe, which automatically boots from a DOS machine into the Linux
    installation. At the first welcome screen, press Enter at the “boot:” prompt to
    choose Install Or Upgrade a Red Hat machine. If you want to do this in text mode,
    type text at the “boot:” prompt.


    The commercial Red Hat 6.2 CD is bootable. Therefore, for a system whose BIOS
    can support booting from CD-ROM, simply enable this option in your BIOS and boot
    directly from the CD-ROM.


    # Boot Floppy Install


    To begin your installation using the standard boot floppy and the CD-ROM, simply
    turn on the machine with the boot floppy in the floppy drive. At the welcome screen,
    press Enter at the “boot:” prompt if you want to either install or upgrade your
    Red Hat via the graphical interface. If you want to use the text interface, type
    text at the “boot:” prompt and press Enter. If you are using a PCMCIA CD-ROM or
    network card for the installation, you must use the special'
  merge: -1
