  md: 'If Yes, make sure you understand the methods used in Red Hat Linux 6.2, the
    differences between Red Hat Linux 6.2 and other Red Hat Linux versions, and the
    differences between Red Hat Linux 6.2 and other vendor distributions (such as
    Caldera, SuSE, and Debian).


    If No, you will want to obtain a copy of Red Hat Linux 6.2 and learn how to install,
    configure, and maintain it. You can use this book to guide your activities and
    studies.


    +   6. For any specific Linux product that is not itself an operating system (for
    example, the X Window System or Apache), have you installed, configured, used,
    and upgraded this software? [Yes or No]


    If the answer is Yes, skip to the next section. If it''s No, you must get some
    experience. Read on for suggestions on how to do this.


    With the RHCE 302 exam, experience is a must, be it something as simple as Pine
    or as challenging as NFS or Apache.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_29_0.png)


    > If you have the funds, or your employer will pay your way, taking a class from
    Red Hat Software, Inc., or from an Authorized Training Partner. In addition to
    classroom exposure to the topic of your choice, you get a copy of the Red Hat
    Linux version that is the focus of your course, along with the training materials
    for that class.


    Before you even think about taking any exam, make sure you''ve spent enough time
    with the related software to understand how it can be installed and configured,
    how to maintain such an installation, and how to troubleshoot software when things
    go wrong. This will help you in the exam as well as in real life.


    # Testing Your Exam-Readiness


    Whether you attend a formal class on a specific topic to get ready for an exam
    or use materials to study on your own, some preparation for the Red Hat Certified
    Engineer exam is essential. At $749 a try, pass or fail, you want to do everything
    you can to pass the exam on your first try. That''s where the importance of studying
    comes in.


    I''ve included practice objectives, goals, and exams in this book, so if you don''t
    score well on the first test, you can study more and then tackle the second'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'test. If you still don''t hit a score of at least 85 percent after the second
    test, you''ll want to investigate practice-tests available from commercial vendors.


    For any given subject, consider taking a class if you''ve tackled self-study materials,
    taken the test, and failed anyway. The opportunity to interact with an instructor
    and fellow students can make all the difference in the world if you can afford
    privilege. For information about Red Hat classes, visit the Training and Certification
    page at http://www.redhat.com/products/training.html.


    # Onward, through the Fog!


    After you''ve assessed your readiness, undertaken the right background studies,
    obtained the hands-on experience that will help you understand the products and
    technologies at work, reviewed the many sources of information to help you prepare
    for a test, you''ll be ready to take a round of practice tests. When your scores
    come back high enough to get you through the exam, you''re ready to go after the
    real thing. If you follow this assessment regime, you''ll know not only what you
    need to study but also when you''re ready to make a test date. Good luck!'
