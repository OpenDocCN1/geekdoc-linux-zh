  md: '# Boot Managers


    Several boot managers can boot Linux as well as manage other operating systems
    booting on the same system. Some of the popular ones include:


    +   - LILO—Discussed in Chapters 3 and 5, and for Linux Loader, this is the default
    bootloader with Linux. Red Hat, as well as most Linux vendors, recommends that
    you use it as your default boot manager.


    +   - System Commander—This is a commercial product that you can purchase from
    a local software vendor.


    +   - SysLinux—This executes the Linux boot-up from a DOS filesystem.


    Even if you decide not to use LILO as your boot manager, you still need LILO to
    manage your Linux boot-up. You decide where to install LILO based on the default
    boot manager you decide to use. If you are using LILO, then choose to install
    LILO in the master boot record (MBR) on your system. If you choose to use another
    boot manager, such as System Commander, install LILO to the superblock of the
    /boot partition.


    # The LILO Boot Manager


    If you are using LILO as your default boot manager, you can select the operating
    system to boot during the installation process. After your system performs its
    BIOS checks and detection, you see the “LILO:” prompt. If you leave this prompt
    alone, whatever operating system is chosen as the default boots.


    To interrupt the automatic process and specify which operating system to boot,
    press the Shift key as soon as you see the “LILO:” prompt. To see which boot options
    are available, press the Tab key. You can then specify which operating system
    to boot, as well as any options that you might require.—as well as the default
    boot operating system, the delay of the “LILO:” prompt, and more—are specified
    in the /etc/lilo.conf file on a system that is dual-booted with Red Hat 6.2 and
    Windows 98:

    The following is an example of an /etc/lilo.conf file:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    delay=10

    timeout=50

    default=linux

    ```


    ```

    image=/boot/vmlinuz-2.2.14-5.0

    label=linux

    ```'
