  md: '# Chapter 9


    available for your desktop. The two main desktop environments shipped with Red
    Hat Linux are GNOME and KDE.


    # GNOME


    GNOME is based on CORBA and the GTK+ toolkit, allowing programmers to import and
    export component type resources of their choice. This means that a program can
    use any editor it needs as long as the editor supports a standard interface via
    CORBA. Currently, the GNOME development project is partially funded by RHAD Labs,
    a division of Red Hat Software, Inc.


    GNOME is used primarily as a base desktop environment for other window managers.
    By default, window managers as Enlightenment and Window Maker use GNOME as the
    base environment. In addition to the styles and tools that the window managers
    add, GNOME offers several GNOME utilities to make the desktop more user-friendly.


    One of GNOME''s tools is the GNOME Midnight Commander (GMC), GMC is a file manager,
    similar to the Windows Explorer, that provides capabilities as drag and drop and
    file browsing. Another tool GNOME uses is GDM, the GNOME Display Manager. GDM
    is more robust than the default X Display Manager (XDM). GDM allows the user to
    log into GNOME, KDE, or AnotherLevel. GDM allows the user to change the environment
    choice at login. By bringing up an xtterm to bypass the window manager, GDM also
    provides a fails mode in case a problem occurs in the user environment.


    # KDE


    Unlike GNOME, KDE is more tightly integrated with the window manager. You can,
    however, use KDE with other window managers, including AfterStep, Enlightenment,
    and Window Maker. KDE is based on the Qt toolkit, developed by the Norwegian-based
    company Trolltech. Figure 9.9 shows a KDE desktop using the default KDE window
    manager.


    KDE provides many KDE tools, applications, and functionality to the window manager.
    KDE incorporates KDE File Manager (KFM). Like GMC, KFM provides drag-and-drop
    functionality to the desktop, provides an Explorer-style file manager, and incorporates
    Web-browsing functionality. Like GNOME, KDE has its own display manager, called
    KDE Display Manager (KDM).


    Other programs that are available for KDE include applications such as illustrator
    and klyx. The illustrator program is a vector-based graphics program similar to
    Adobe Illustrator or CoreDRAW. The klyx program is a modern approach to writing
    documents with a computer, using LyX formatting. Some popular information management
    tools available for KDE include kalendar and korganizer.'
  merge: -1
