- img_proc: true
  md: '# Kernel Basics


    There are two types of Linux kernels: monolithic and modular. Monolithic kernels
    are much like old-style Unix kernels. All the system support is compiled directly
    in the kernel. Therefore, if SCSI support is required, all the SCSI drivers and
    so are compiled directly in the kernel. This creates a much larger kernel, but
    it runs a little faster at boot-time. In addition, monolithic kernels use a constant
    amount of RAM.


    On the other hand, the only drivers that modular kernels need compiled are those
    required at boot-time. Remaining drivers and support are installed as modules
    and loaded only when needed. The modular kernel method is less secure than the
    monolithic kernel method; however, the modular kernel method is more memory-efficient
    and allows the kernel to be much smaller.


    Some systems require the use of ramdisk. Initial ramdis are required when support—such
    as SCSI support during boot-up—is needed. The ramdisk is noted in your /etc/lilo.conf
    file as an initrd= comment. I will discuss creating this file later in this chapter.


    # Kernel Housekeeping


    Good kernels know how to keep their kernels clean and their systems functioning.
    It’s a good habit to never delete an existing kernel when you compile a new one
    or when you install a new one with RPM. Rather than overwriting your existing
    kernel, rename it. You can then set up LILO, the Linux boot loader, to boost your
    existing kernel as a choice, just in case your new kernel is unbootable.


    If your new kernel is unbootable, do not fret. You kept your existing kernel to
    boot, didn''t you? Chances might have misconfigured your system, maybe even set
    the wrong options during your configuration, or possibly have a missing or corrupt
    kernel source. If one of these situations happens, debugging your kernel problems
    by noting the errors you receive when compiling or booting. If you can''t solve
    the problem, try and try again. Just remember that wherever you visit, clean up
    after yourself. Leaving behind old configurations from previous trials might make
    future attempts less successful.


    # Kernel Modules


    Kernel modules used in modular kernels. Kernel modules are loaded as needed when
    support for a specific device or protocol is required. Modules that the kernel
    uses are located in the /lib/modules/ directory. The files located under /lib/modules/
    are separated by kernel versions. For instance, on my system, I have'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'installed kernel 2.2.12-20 and 2.2.14-5.0. Therefore, I have a directory under
    /lib/modules/ for each kernel.


    When a request is made for a service from a module that either hasn''t been loaded
    or isn''t compiled directly into the kernel, the kernel (using kmod) tries to
    load the needed module. To find the needed module, kmod runs modprobe, which looks
    into /lib/modules/, then into the appropriate kernel directory, and then the appropriate
    device directory, if needed.


    Red Hat Linux provides a number of tools that make controlling modules simple.
    These tools include lsmod, insmod, rmmod, and modprobe. The lsmod tool tells you
    which modules are running. A sample output of lsmod follows.


    | Module | Size Used by |

    | parport_pc | 7304 | 0 [vmppuser] |

    | parport | 7452 | 0 [vmppuser parport_pc] |

    | lockd | 30344 | 1 (autoclean) |

    | sunrpc | 52132 | 1 (autoclean) [lockd] |

    | ds | 6696 | 2 |

    | i18365 | 29800 | 2 [ds i18365] |

    | pcmia_core | 44480 | 0 (autoclean) (unused) |

    | ppp | 19500 | 0 (autoclean) |

    | slhc | 4312 | 0 (autoclean) [ppp] |


    The insmod tool loads a service manually. The rmmod tool removes any idle modules
    that aren''t being used. The modprobe tool automatically loads all base modules
    that are needed for a specific service.


    # Module Configuration


    Module loading used to be handled in Red Hat Linux by kerneld. As of the 2.2 Linux
    kernel, kerneld became obsolete. The Red Hat Linux now uses kmod, a kernel process,
    to handle the loading of kernel modules.


    One configuration file used with modularized kernels is /etc/conf.modules. The
    /etc/conf.modules file sets specifies commands, options, paths, and so on for
    modules. In addition, this file sets up any module aliases and parameters that
    might be required.


    Red Hat Linux also has a kernel configuration tool (kernelcfg) that is used in
    X to help configure kernel modules. To run this tool, enter kernelcfg at the root
    prompt. The window shown in Figure 8.1 appears.


    The Kernel Configurator lists the installed modules on your system. You can then
    add or delete modules with the Add and Remove buttons located at'
