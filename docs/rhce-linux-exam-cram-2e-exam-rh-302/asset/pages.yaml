  md: '# POP (Post Office Protocol)


    POP (Post Office Protocol)

    A protocol used to retrieve electronic mail from a remote server. (Currently,
    Linux supports to two POP protocols: POP2 and POP3. POP2 is obsolete, although
    it is still supported.)


    rebuilding

    Recompiling.


    RIP (Routing Information Protocol)

    A protocol used to dynamically reconfigure routing information.


    ppp

    ppp interface name.


    RISC (Reduced Instruction Set Computing)

    The CPU architecture used in the Alpha, Sparc, and other CPUs, and that has short,
    fixed-length instructions that perform simple tasks. More instructions must be
    built out of simpler instructions. This architecture allows the CPU to be simpler
    and generally faster than a CISC CPU, but at the cost of needing to execute many
    more instructions than a CISC CPU.


    printtool

    Tool used to configure printing.


    prototype

    Machine configured as a test, or base model, and used for cloning.


    pwconv

    Tool used to convert /etc/passwd using shadow passwords.


    rmmod

    Tool used to remove a loadable kernel module.


    pwunconv

    Tool used to convert /etc/passwd from shadow passwords.


    query

    A request sent by one program to another program or package for information.


    root

    The superuser, whose user ID is 0. File permissions are ignored for root.


    RAM (Random Access Memory)

    Memory used on a system for storing temporary data for programs and files.


    root directory

    The / directory.


    RARP (Reverse ARP)

    A protocol used to discover the IP address of a device given its MAC address.


    root window

    The background of your screen. The root window doesn''t have any of the standard
    characteristics of any other window, but it does have some unique applications.
    The root window is where you can customize your background images, among various
    other tasks.


    rdate

    The Red Hat Linux tool used to synchronize the system time with a specified machine.
    The rdate tool synchronizes only when used.'
