  md: '# Question 6


    | What''s the difference between the less and more commands? |


    The less and more commands are both filters. If you pipe the output of a file
    or a command through either of these filters, you get the output one page at a
    time. The difference, however, lies in their functionality. For example, less
    is a more powerful tool than more; less allows you not only to view the output
    one page at a time, but also to scroll up and down through the file. less also
    allows you to search through the file using standard vi commands.


