    # Hostname Configuration


    Unlike some operating systems, Linux- and Unix-based systems are affected if the
    system time is not set properly. One of the core Linux applications affected is
    cron. Scheduled jobs will not run at the correct time of day if the time isn''t
    set properly. During the time configuration stage of the installation, you are
    prompted for your time zone and asked whether or not you want to set your hardware
    clock to GMT (Greenwich Mean Time). A special feature of the graphical interface
    is that you can click on a map to indicate your location rather than scrolling
    through a long worldwide location list. See Figures 5.18 and 5.19.


    > *Note: You should always check the Hardware Clock Set To GMT box unless you
    are dual-booting your system with Windows. Otherwise, Daylight Savings Time can
    upset your system.*


    # Account Configuration


    A new feature added since Red Hat 6.0 is the ability to create not only the root
    user during installation but least one additional (optional) user as well. As
    I''ve mentioned previously, the graphical interface configures both of these options
    in one screen, whereas the text interface takes two screens.


    One of the features of the graphical interface is that the system checks to see
    that your root password is valid before you commit it. If the password is too
    short, the system will automatically tell you. If the password is too easily guessed,
    the system will tell you that, too. When your password is valid, the system will
    report that the root password is accepted. See Figure 5.20.'
