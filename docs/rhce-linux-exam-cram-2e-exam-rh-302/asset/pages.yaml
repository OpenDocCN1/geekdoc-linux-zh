  md: '158 Chapter 7


    In addition to the standard Red Hat Linux installation, several other installation
    methods and options are available. These options allow you to boot multiple operating
    systems or even automate the installation. You might even need to install a system
    that is to be headless, meaning without a monitor and keyboard. Special hardware,
    such as a PCMCIA system (laptop), also requires special installation and configuration
    methods. Your typical Red Hat user probably does not even know most of these options
    exist. However, becoming RHCE means that you know about them and you can set up
    and configure them properly.


    # Dual-Booting Linux


    Administrators often like to dual-boot their systems. This means that the administrator
    installs more than one operating system and then chooses one to run.


    Note: Currently, running more than one operating system simultaneously is possible
    only by using software packages as VMware.


    You can set up your machine to prompt you to choose which OS you want to run at
    boot-time. In this section, we will discuss setting up your machine with the option
    to boot either Linux or Microsoft Windows.


    # Partitioning Disks


    To dual-boot your machine with Linux and Windows, you must create separate partitions
    on your hard drive for each operating system. It''s typically to create at least
    four partitions for this—or if you decide to create separate partitions for /home,
    /var, and other directories on your Linux filesystem.


    The four primary partitions are for Linux /boot, for Windows, for Linux Native,
    and for Linux Swap. Creating the first partition (50MB or smaller) for /boot allows
    the system to easily boot properly. This setup is especially useful on large disks
    with more than 1024 cylinders and on disks that require LBA mode. The following
    is an example of a partition table on a system with four partitions:


    ```

    /dev/hda: 24 heads, 63 sectors. 839 cylinders

    Units - cylinders of 15120 * 512 bytes

    ```


    | Device Boot | Start | End | Blocks | Id | System |

    |---|---|---|---|---|---||

    | /dev/hd1 | | 1 | 7 | 52888 | 83 | Linux |

    | /dev/hd2 | * | 8 | 75 | 514080 | b | Win95 FAT32 |

    | /dev/hd3 | | 76 | 813 | 5579280 | 83 | Linux |

    | /dev/hd4 | | 814 | 839 | 196560 | 82 | Linux swap |'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'The first partition is a boot partition for Linux. It is a Linux Native partition
    and is mounted to /boot. The second is a DOS partition, which is used for installation
    of Windows 98. The third and fourth partitions are also for Linux. The third is
    the root partition, which is a Linux Native partition and mounted to /. The fourth
    is a Linux Swap partition and is not mounted to any filesystem.


    Sometimes you might want to dual-boot a system after you already have an operating
    system, such as Windows, installed. To dual-boot the Windows system with Linux,
    you must resize or shrink your current Windows partition. In the doubtless directory
    of your Red Hat Linux 6.2 CD-ROM is a DOS tool called fips, which you can use
    to resize your DOS or Windows partitions. A commercial program that allows you
    to do the same thing is PartitionMagic by PowerQuest Corporation. PartitionMagic
    is a DOS program that can resize any types of partitions safely without destroying
    data. Since version 4, PartitionMagic also resizes Linux partitions.


    # Installing Both Operating Systems


    A dual-boot system set up from scratch is much easier to configure properly and
    will likely have fewer errors. By default, you should always install your alternate
    (not Linux) operating system first. Doing so allows you configure the bootloader
    for your Linux installation so you can boot multiple operating systems. In addition,
    by installing the non-Linux operating system first, you format the entire disk
    during their default installations, you eliminate the risk of the other operating
    system deleting your Linux installation.


    If you use the other operating system to partition your disk, simply leave the
    unpartitioned space available for Linux. Red Hat Linux can format and partition
    the unallocated space during installation. Some administrators find it helpful
    to partially begin the Red Hat Linux installation before installing the guest
    operating system. By this I mean you start the Red Hat Linux installation and
    proceed to the point where you format the disk; then you stop the Red Hat Linux
    to install the guest operating system. You can then use Disk Druid (discussed
    in Chapter 5) or fdisk (discussed in Chapters 3 and 5) during the Red Hat Linux
    installation to set up all your partitions. Make sure you create your DOS or guest
    operating-system partition and set it to the appropriate type (for Windows, this
    is type b). You can then write the partition table. When the Linux installation
    moves to the next stage, you can reboot the system and begin installing your guest
    operating system.'
