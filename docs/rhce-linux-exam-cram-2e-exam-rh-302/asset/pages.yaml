  md: '# Network File System (NFS)


    NFS is the Network File System, the standard method for sharing files between
    Unix (Unix-like) systems. Linux can be an NFS server to other Linux (or Unix)
    systems, as well as an NFS client to other Linux (or Unix) systems.


    # The NFS Server


    The NFS server can be installed by default during the Red Hat Linux 6.2 installation.
    If NFS was not installed during your Red Hat installation, you can use the RPM
    on the Red Hat installation CD. The NFS RPM can be found at /RedHat/RPMS/knfsd-1.2.2-4.i386.rpm.


    Red Hat 6.2 uses the kernel nfsd feature of the 2.2 Linux kernels. Therefore,
    in order to use it the kernel must be configured with the appropriate kernel support.
    With the stock Red Hat 6.2, the kernel nfs requires the nfsfd.o module (which
    requires the lockd.o and sunrpc.o modules). In addition, the NFS server requires
    the following user-space daemons and utilities.


    +   - Portmap—The NFS server must be running the portmap daemon. It is included
    in the portmap package-4.0-19.i386.rpm.


    +   - RPC—RPC daemons from the knfsd package must be running. They include rpc.statd,
    rpc.quotad, rpc.mount, and rpc.nfsd. (These can be started by running /etc/rc.d/init.nfs
    start.)


