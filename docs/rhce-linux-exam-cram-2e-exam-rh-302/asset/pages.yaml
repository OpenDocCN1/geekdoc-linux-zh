  md: '# 72 Chapter 4


    +   > biod—Performs NFS block I/O operations for client processes.

    "> rpc.mount—Handles mount requests from remote computers.

    "> rpc.lock—Manages file locking for both client and server systems.

    "> rpc.stat—Handles lock crash and recovery services for both client and server
    systems.

    "> portmap—Facilitates the initial connection between local and remote servers.


    Note: Current versions of Red Hat use the kernel nfsid. Simple nfsid is a kernel
    module.


    # sendmail


    The sendmail program is the most popular mail transport agent (MTA) for Linux.
    The sendmail program does the physical sending and receiving of user and system
    email. You use sendmail in conjunction with a mail delivery agent (MDA) and a
    mail user agent (MUA). The MDA receives the incoming mail from sendmail and delivers
    it to the appropriate user. A typical Red Hat Linux installation uses procmail
    as the MDA for sendmail. Some other commonly used MDAs include maillocal and deliver.
    After the MDA has delivered the mail, the user uses an MUA to retrieve it. Some
    popular MUAs include Pine, Elm, mut, and mailix. Going the other direction, a
    user uses his MUA (Pine) to send mail directly to the MTA (sendmail).


    # POP3 and IMAP


    POP3 (Post Office Protocol 3) and IMAP (Internet Message Access Protocol) are
    protocols that allow a user to retrieve her mail from the mail server to her mail
    reader. POP3 pulls mail from the mail spool, one message at a time, to a local
    spool. The user can then opt to delete all the messages on the mail spool or leave
    them all. IMAP, however, reads the mail messages directly from the spool without
    copying the messages to the local spool. The user can then change, delete, and
    create folders, and so forth, on her local mail reader. When she does so, the
    changes are automatically applied to the mail spool.


    # FTP


    FTP (File Transfer Protocol) is used to transfer files between systems over a
    network. For a user to connect to a system via FTP, either the user must supply
    a valid username and password, or the system must be able to accept anonymous
    users.'
