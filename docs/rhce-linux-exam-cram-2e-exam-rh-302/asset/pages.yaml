    # Question 10


    | How is a network connection request handled when you''re using tcp_wrappers?
    |


    When a network connection request is made to a server, the request is accepted
    by inetd. If access is passed by inetd, inetd then starts tcpd with the argument
    for which program to start. tcp_wrappers checks the service and the user-access
    grant permissions in /etc/hosts.allow. If no specifications are made in /etc/hosts.allow,
    then tcp_wrappers checks for any deny entries for the service or user in /etc/hosts.deny.
    If no deny entry is found in /etc/hosts.deny, the connection is granted.'
