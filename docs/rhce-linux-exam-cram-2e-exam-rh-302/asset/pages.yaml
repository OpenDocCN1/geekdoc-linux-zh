  md: '# Chapter 3


    Before pursuing your dream of becoming a Red Hat Certified Engineer (RHCE), or
    just becoming a Linux power user, you should have extensive knowledge of Linux,
    Linux tools, and TCP/IP networking basics. These prerequisites are also required
    if you take part in the Red Hat Certified Engineering training program, which
    is scheduled for the four days before you take your exam. This chapter will discuss
    many of the general Linux and Unix concepts that you need to be familiar with
    before tackling your RHCE preparation.


    # Unix Basics


    Linux is a Unix-like operating system. Therefore, it''s essential for you to know
    basic Unix commands in order to become an RHCE. You must have working knowledge
    of Unix concepts such as the filesystem hierarchy, filesystem mounting and administration,
    basic shell configuration, and basic file operations. You must also be familiar
    with filters, wildcards, vi, and other tools for manipulating and editing files.


    # Unix Filesystem Hierarchy and Structure


    Unix filesystems are structured in a directory tree. Although these structures
    differ slightly in each flavor of Unix system, the directories I describe here
    are standard on Linux.


    The main directory, called the root directory, is denoted with a simple forward
    slash (/). All directories on a Unix system are subdirectories of the root. Directly
    under the root directory are the following subdirectories:


    +   /bin—The typical location for executable and binary files for Unix commands
    and utilities. It also contains executables used by users.


    +   /dev—The device directory. The /dev directory contains files divided into
    subdirectories that contain files for a specific device and special files that
    we''ll discuss later in this chapter. These directories are named based on the
    type of device files they contain. Some examples of these directories are hda1
    (for the first IDE hard drive), fd0 (for the floppy disk), and cdrom, which is
    a symbolic link created to the CD-ROM device that Red Hat was installed from,
    if it was installed via CD-ROM.


    +   /etc—The location for configuration files and—what''s more important—for the
    system boot scripts. These boot scripts are located under the /etc/rc.d/ directory.
    The services that run at bootup are located under /etc/rc.d/init.d.'
  merge: -1
