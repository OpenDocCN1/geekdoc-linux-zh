    +   2. Edit /etc/sendmail.mc. Edit the /etc/sendmail.mc file to make any changes
    you need. If an option is in single quotes, be sure the first quote around the
    item is a forward tick (\`''). To disable (or comment) a line, insert dnl at the
    front of the line.


    +   3. Generate a new /etc/sendmail.cf. Generate the new /etc/sendmail.cf list
    from the edited /etc/sendmail.mc by using the m4 macro processor. To do this,
    execute: m4 sendmail.mc > sendmail.cf. (Please double-check to see that you have
    a backup of your running sendmail.cf before overwriting your current one.)


    +   4. Restart sendmail. Restart sendmail by running /etc/rc.init.d/sendmail restart
    or service sendmail restart.


    # procmail


    The mail delivery agent used by default with Red Hat Linux 6.2 and sendmail is
    procmail. The procmail MDA is used to handle the mail between the MTA (sendmail)
    and the MUA (mail reader). Typically, procmail is installed during Red Hat Linux
    6.2 installation. If necessary, however, you can install procmail via RPM. The
    RPM file included with Red Hat Linux 6.2 for procmail is procmail-3.14-i386.rpm,
    located in the /RedHat/RPMS/ directory on your Red Hat Linux 6.2 CD-ROM.


    # Configuring procmail


    For the MDA services of procmail, there is nothing you to configure. This means
    that after installation, procmail is ready to go "out of the box." You can, customize
    how procmail handles each user''s mail; you do this by editing a .procrc file
    within each user''s home directory. By editing a user''s home .procmailrc, you
    can enable mail sorting, blocking, and more. For an in-depth description of filtering
    options available through procmail, run man procmail.'
