    # Understanding the Linux Kernel


    The Linux kernel is the foundation on which Linux is based. The Linux kernel,

    in fact, is where Linux gets its name. As discussed in Chapter 3, the Linux kernel

    was developed as a hobby by a student Lin Torvalds in Helsinki, Finland.

    The Linux kernel, combined with many applications and GNU tools, is what

    makes up Red Hat today. In this section, I''ll discuss technicalities of the kernel

    good housekeeping practices, kernel modules, kernel configuration, kernel

    compiling, and more.'
