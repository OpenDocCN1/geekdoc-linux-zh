    > A typical Red Hat Linux installation uses the DOS-style partition table, which
    recognizes only four primary partitions. To resolve this problem, create extended
    partitions that hold logical partitions. An extended partition can hold up to
    12 partitions, allowing for a maximum of 16 partitions on one drive. Regardless
    of the number of primary partitions, the first logical partition always has a
    device number of 5. For example, the first logical partition on the first IDE
    hard drive would be named hda5.


