    # Email Services


    Email services comprise three main parts: the mail transport agent (MTA), the
    mail delivery agent (MDA), and the mail user agent (MUA). The MTA is responsible
    for the physical sending of user and system email. The MDA receives the incoming
    email from the MTA and delivers it to the appropriate user. The MUA retrieves
    the mail delivered by the MDA and allows the user to read it. In addition to mail
    relaying from MTA to MDA to MDA, outgoing mail is submitted by the MUA, transferred
    to the MTA, and sent to the appropriate recipient server. In this section, I briefly
    discuss the default Red Hat Linux MTA (sendmail), MDA (procmail), and popular
    MUAs (Elm, Pine, and Netscape Messenger).


    # sendmail


    The most popular (default Red Hat Linux) mail transport agent (MTA) is sendmail.
    The sendmail program is typically installed by default during the Linux installation;
    when installed via the Red Hat 6.2 CD-ROM, sendmail requires no configuration
    to work properly.


    If sendmail is not installed during your Red Hat Linux 6.2 CD-ROM, you can install
    the RPM found on your Red Hat Linux 6.2 CD-ROM. The RPM file on the Red Hat 6.2
    CD is sendmail-8.9.3-20.i386.rpm; it’s found in the /RedHat/RPMS/ directory on
    your Red Hat 6.2 CD-ROM.


    # Configuring sendmail


    The main configuration file for sendmail is /etc/sendmail.cf. The /etc/sendmail.cf
    file is machine-readable code to run sendmail. Because /etc/sendmail.cf is machine-readable
    code, it is not very administrator- or reader-friendly. Because of the complexity
    and sensitivity of this file, editing this file by hand is not recommended. For
    this task, there is a macro preprocessor available, m4, which should be used to
    re-create the sendmail.cf file from an edited source (/etc/sendmail.mc).'
