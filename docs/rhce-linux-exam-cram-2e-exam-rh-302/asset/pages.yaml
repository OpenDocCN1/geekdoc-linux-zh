  md: '# GNOME and KDE Workstation Configurations


    Choosing either Workstation configuration (GNOME or KDE) automatically installs
    the most common packages used on a personal workstation. In addition to the base
    Red Hat installation, some of the workstation features include many of the development
    packages. Both options install more components than does the Server alternative.
    Packages such as graphics and multimedia are installed. The difference between
    the two Workstation options is the desktop environment. Choosing the GNOME option
    installs GNOME as your default environment and installs all of the GNOME tools
    and packages. Choosing KDE, obviously, installs KDE as the desktop environment
    and installs all of the KDE tools and packages. The differences between KDE and
    GNOME will be discussed in Chapter 9.


    # The Server Configuration


    Choosing the Server configuration automatically installs many of the most common
    packages used on a networked server. Unlike the Workstation configuration, the
    Server configuration chooses the majority of the most stable packages. With the
    development packages and extra Window tools eliminated, fewer packages are installed.
    Some of the features installed with these packages include:


    +   * Anonymous FTP

    * Caching name server

    * BIND

    * Advanced Perl

    * PostgreSQL

    * Samba


    > You should not choose a preconfigured type of installation if you are dual booting
    or have any other existing Linux partitions on any hard drive in your system.
    The Workstation installation will overwrite NT''s bootloader in the MBR and will
    erase all other Linux partitions in your system. The Server installation will
    erase all partitions (including non-Linux partitions) from all of your hard drives.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_127_0.png)


    # The Custom Configuration


    Choosing the Custom configuration allows you to set up any particular configuration
    you want. You are given two ways to select your packages: You can select either
    a feature that automatically selects the necessary packages or one that'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'selects individual packages manually. You are even given the option to install
    everything, which is simple for new users.


    # Examining Hard Disk Options


    After specifying your installation type, you''ll specify exactly where you want
    the Linux installation to be physically placed. You do this by partitioning and
    formatting the disk and setting mount points. If you are using the text interface,
    you are asked to select a disk-editing tool: either Disk Druid or fdisk. If you
    are using the graphical interface, you already chose a tool by selecting U fdisk
    in the last prompt, or not selecting it. If you didn''t select fdisk (see Figure
    5.7), you''ll automatically use Disk Druid. Next you are asked to specify the
    disks you want to partition. Red Druid will detect the drives on your system,
    and in both interfaces, will present you with a list of detected drives to choose
    from.


    Disk Druid is Red Hat''s install-time disk management utility. You can create
    and delete disk partitions according to user-supplied requirements as well as
    manage mount points for each partition. The traditional Linux disk-partitioning
    tool is fdisk, introduced in Chapter 3. The fdisk program is a bit more flexible
    than Disk Druid, but fdisk requires you to have some experience with disk partitioning
    and to be accustomed to using a text interface.


    # Disk Druid


    Selecting Disk Druid presents you with a graphical user interface to help you
    partition the drive and select mount points on the drive. Disk Druid is available
    only when you''re installing Red Hat Linux. The first screen is the Current Disk
    Partitions screen. This screen shows all currently partitions and disk drive summaries.
    See Figures 5.9 and 5.10.


    The differences between the two interfaces are minimal, with the graphical interface
    allowing you to reset the entire table or set up software RAID devices from the
    main menu. Each line in the Current Disk Partitions section represents a disk
    partition. Each line has five fields:


    +   - Mount Point—Indicates where the partition will be mounted when Red Hat is
    installed.


    +   - Device—Displays the partition''s device name.


    +   - Requested—Specifies the minimum size requested when the partition was created.


    +   - Actual—Shows the space that is currently assigned to the partition.


    +   - Type—Shows the partition''s type, such as Linux Native, Linux Swap, or other
    type.'
  merge: -1
  pgno: 128
