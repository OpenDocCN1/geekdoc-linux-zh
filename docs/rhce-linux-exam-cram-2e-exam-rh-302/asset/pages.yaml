    # Installation Method


    After you''ve booted with your selected boot floppy, you''ll be prompted to choose
    which type of installation you want to use. Currently, there are five types of
    installations. See Table 5.1.


    # Installing Red Hat: The First Stage


    The first step of the installation is to configure the installation process itself.
    It asks for your language, your keyboard style, and your mouse style (graphical
    interface).


    The installation process opens with a welcome screen that you select to select
    the language that you use to install Red Hat Red Hat 6.2 supports most European
    languages, including English, German, and Icelandic (see Figures 5.1 and 5.2).


    Next, you are prompted for your keyboard configuration. Depending on the interface
    you''re using (graphical or text), you have different options at this stage. With
    the graphical interface, you''re prompted for the keyboard model you''re using,
    the type of layout you''d like, and whether or not to use dead keys. You''re even
    given the option to test your keyboard selection. See Figure 5.3. If you''re using
    the text interface, you''re prompted for the model of keyboard you''re using.
    See Figure 5.4.


    If you''re using the graphical interface, you''ll be prompted for your mouse configuration
    during the third phase of installation (when you configure the rest of your peripherals).
    The two interfaces differ slightly; with the graphical interface, you can specify
    the port and device of your mouse, but with the text interface, you specify only
    the model of your mouse. See Figures 5.5 and 5.6.


    | Table 5.1 Installation methods |

    | Method Type | Description |

    | CD-ROM | Installs from each internal CD-ROM or a PCMCIA CD-ROM. Requires the
    regular or PCMCIA boot disk. |

    | FTP | Installs from an FTP server. Requires the network or PCMCIA boot disk.
    |

    | Hard Drive | Used if Red Hat Linux files were downloaded or copied to a local
    hard drive. Requires the regular or PCMCIA boot disk. |

    | HTTP | Installs from a Web server. Requires the network or PCMCIA boot disk.
    |

    | NFS Image | Installs from an NFS server hosting a Red Hat Linux CD-ROM or a
