  md: '# Using Network-Based kickstart


    To start a network-based kickstart installation, you simply need a Red Hat Linux
    boot disk created with the bootnet.img boot image. At the “boot:” prompt, type
    linux ks. This command looks for the NFS and DHCP servers automatically and obtains
    all the necessary information.


    Setting up network-based kickstart network installations is a bit complex and
    differs from network setup to network setup. Therefore, documentation for this
    process is limited. Although knowing kickstart procedures will be helpful to your
    career if you work in a large company, extensive knowledge of this process is
    unnecessary for your RHCE certification. However, you should have a good working
    knowledge of the process.'
