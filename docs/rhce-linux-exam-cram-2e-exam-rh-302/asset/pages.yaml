    The DocumentRoot directive is the location, on the Apache server, of the files
    for the entry''s Web pages and data. Often, administrators use a single directory
    for all Web pages, such as /home/html/, and create a directory under the /home/html/
    directory for each domain. In this case, the DocumentRoot would be set to /home/html/domain.
    Other times, administrators link the DocumentRoot into a user''s home directory,
    and create a directory in the home directory to contain the documents. In this
    case, DocumentRoot would be set to /home/user/domain or something similar.


    ```

    DocumentRoot "/home/httpd/html"

