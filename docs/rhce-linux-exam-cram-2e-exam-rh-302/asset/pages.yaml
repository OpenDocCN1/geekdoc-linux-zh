  md: '# Unix


    # tcp_wrappers


    The operating system that was developed in the late 1960s and early 1970s at Bell
    Labs and that is the inspiration for Linux.


    A tool that uses the system files /etc/hosts.allow and /etc/hosts.deny to control
    who and cannot access services managed by inet.


    # terminal emulator


    URL (Uniform Resource Locator)

    A Web address such as http://www.coriolis.com/


    A window with just text that basically mimics a text terminal. An example of a
    terminal emulator is an xterm.


    # user


    Individual with an account on a machine.


    # TeX


    Special formatting and typesetting program.


    # user ID


    The number associated with individual user accounts. The system automatically
    sets this number when the account is created.


    # timeout


    GUI tool used to configure system time.


    # useradd


    Tool used to add user accounts to a system. (Equivalent to adduser.)


    # tools


    Software commands used to administer a program or computer services.


    # userdel


    Tool used to delete a system user.


    # TOS


    Type of service.


    # vfat


    Mount type associated with Windows partitions and filesystems.


    # TTL (Time To Live)


    A field in an IP packet that defines the number of routers the packet should pass
    through before being rejected. (The traceroute command works by repeatedly sending
    an ICMP echo packet, incrementing the TTL until the host is reached.)


    # virtual consoles


    Multiple text-based logins located on separate virtual screens on your system.


    # virtual hosts


    Apache feature allowing a single machine to host multiple domains.


    # UDP (User Datagram Protocol)


    The stream-oriented, connectionless protocol of TCP/IP.


    # visual bell


    Visual alarm, such as a screen flash, used to specify a system beep without the
    speaker.


    # umask


    File-creation mask used to set up default file permissions based on the umask
    setting subtracted from full permissions of 777.'
