- img_proc: true
  md: '# 40 Chapter 3


    Development kernels aren''t guaranteed to compile, much less work properly. They
    usually do work well, many sites that need one or more-not-quite-perfect features
    in the development kernels will use them for production systems. (For example,
    many sites with SMP systems run the 2.1.x kernels for greatly improved performance.)
    Real work is often done with systems that run development kernels, so the kernel
    developers tend to receive excellent bug reports, and this fuels the fast development
    cycle.


    You can always retrieve the Linux kernel source via anonymous FTP from ftp://ftp.kernel.org/pub/linux/kernel/
    or from one of its mirrors. There are directories for each kernel major.version
    kernel contains a file that indicates the latest release of that version. For
    example, a directory listing of the v2.4 directory shows the following:


    ```

    -r--r--r--p- 1 korg korg 0 Jun 23 21:53 LATEST-IS-2.4.0-test2

    ```


    Another quick to determine the latest kernel version is to run the finger @finger.kernel.org
    command. Doing so should give you output like that shown here:


    ```

    [zeus.kernel.org]

    The latest stable version of the Linux kernel is: 2.2.16

    The latest beta version of the Linux kernel is: 2.4.0-test2

    The latest prepatch (alpha) version *appears* to be: 2.4.0-test3/pre4

    ```


    After you''ve determined the version of the kernel source that you need, get the
    file linux-x.y.z.tar.gz linux-x.y.z.tar.bz2 (where x.y.z is the version number).
    The file with the .bz2 extension is compressed with bzip2, and the file with the
    .gz extension is compressed with gzip. The bzip2-compressed file is much smaller
    (usually 15 to 20 percent smaller) than the gzip-compressed file.


    If you already have a version of the kernel source available, you might prefer
