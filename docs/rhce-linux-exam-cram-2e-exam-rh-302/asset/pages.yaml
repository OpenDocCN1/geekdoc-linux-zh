  md: '# Chapter 6


    System administrators who are accustomed to administering a large group of users,
    or users for a large corporation, might want to set up their users by group. For
    instance, you might have set up all users in the Sales department in the group
    named Sales. You might also have set up temporary contractors in the group named
    Contractor. Using the groupdel command removes all system entries referring to
    that group. Keep in mind, however, that you must manually search your filesystems
    for remaining files. Another problem with groupdel is that you cannot remove a
    primary group for an existing user.


    The most popular Unix user-deletion tool is userdel. To delete a user with it,
    enter the userdel username command from the root prompt. The userdel tool automatically
    removes the user''s entries in both the /etc/passwd and /etc/group files. Using
    the userdel tool without any options removes these two entries but not the user''s
    home directory and files. To remove them, pass userdel the -r option. For example,
    the command


    ```

    userdel -r username

    ```


    removes username''s entries in the /etc/passwd and /etc/group files as well as
    username''s home directory.


    As you''ve seen, linuxconf is a very useful tool and you can use it to delete
    your user accounts. To do so, you are given few options that are unavailable when
    you use other deletion methods. After starting linuxconf from the root prompt,
    you''re presented with the directory tree in the left window of the screen. In
    the directory tree, select Config, then Users Accounts, then Normal, and then
    User Accounts. To select the user you want to delete, double-click the username.
    Then click the Delete button. You''re prompted to choose to archive the account''s
    data, or leave it alone. After you''ve chosen an option, choose Quit and then
    Activate Changes.


    # Modifying User Information


    A time will come when you need to modify a user''s information. Perhaps your user
    gets married and has a new name. Maybe you just need to change the user''s password
    or permissions. Whatever the reason, there are ways you can modify the user''s
    account without having to re-create it.


    To change a user''s password, you can manually edit the user''s /etc/passwd entry,
    run the passwd command, use linuxconf, or assign a random password by using the
    mkpasswd command. In addition, some useradd command options allow you to specify
    this information when you create the user account. For a complete list of options
    available, use the man useradd command.'
  merge: -1
