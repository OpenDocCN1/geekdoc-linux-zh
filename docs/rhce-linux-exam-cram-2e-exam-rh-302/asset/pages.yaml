    # Kernel Basics


    Basic kernel configuration and rebuilding RHCE. You should be extremely familiar
    with the tools and files required to rebuild your kernel. The kernel is the most
    rapidly changing part of any Linux distribution. One of the reasons for the rapid
    development of the Linux kernel is the two-track development system that Linux
    has used since version 1. The version number of the Linux kernel is always in
    the form *major.minor.patchlevel*, where the *minor* number indicates whether
    the kernel is stable or in development. Stable kernels are indicated by an *even*
    minor number. For example, 1.0.9, 1.2.13, 2.0.36, and 2.2.5 are all stable kernels,
    whereas 1.1.12 and 2.3.8 are both development kernels. Stable kernels are updated
    less frequently and are tested before they are released. Development kernels are
    released as frequently as possible to allow testing and to allow all developers
    to synchronize their kernel source trees with Linux’s official tree.'
