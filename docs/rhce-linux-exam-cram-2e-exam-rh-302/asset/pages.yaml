  pgno: 159
- img_proc: true
  md: 'To install a new mouse or trackball, use the mouseconfig tool. To do so, type
    mouseconfig at the root prompt. Choose your appropriate mouse from the list, and
    then use the Tab key to select OK.


    A little more involved, albeit not much, is the sndconfig tool. To set up sound
    on your system, use the sndconfig tool by typing sndconfig at the root prompt.
    The screen first prompts you to autoprobe for plug-and-play sound cards that can
    be configured automatically. If no card was found, you re prompted to select your
    sound card from a list. After you have the appropriate sound device selected or
    detected, your system runs a few tests to verify that your card is working. If
    you hear the appropriate sounds, use the Tab key to select OK, and you''ll be
    finished.


    Unlike some of the other configuration tools, the sndconfig tool adds entries
    into your /etc/conf.modules file. The sndconfig tool sets the driver, IRQ, and
    IO settings — well as any aliases that might be needed — in this file.


    Note: Depending on your X Window environment (Chapter 9), there are special daemons
    that can be used. Enlightenment uses a sound daemon called esd, and KDE uses a
    sound daemon called kauderver.


    If you want to change your current password and authentication settings, you can
    use the authconfig tool. The authconfig tool allows you to configure shadow passwords,
    MD5 passwords, and even NIS authentication. The interface of authconfig is duplicated
    from the original installation.


    For a menu of configuration options, you can use the setup tool. The setup tool
    allows you to reconfigure multiple items by using the tools described such as
    kbdconfig, timeconfig, and authconfig — while also allowing you to set system
    boot services with nsysv and configure your network or X configuration. See Figure
    6.3.


