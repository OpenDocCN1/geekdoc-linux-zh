  md: '# Standard Networking Services 255


    ```

    ftp IN CNAME www

    mail IN CNAME www

    irc IN CNAME irc.example.net.

    ```


    For clarity, the sections of the /var/named/db.example file have been highlighted.
    The first section is the SOA (Start of Authority) entry. The SOA entry contains
    the domain of the originating host, the domain address of the maintainer, the
    file serial number, and various time parameters (refresh, retry, expire, and minimum
    TTL).


    The second highlighted section of the /var/named/db.example file specifies the
    domain''s primary and secondary DNS server. These servers are denoted by the NS
    tokens. The first NS entry is the primary DNS server, and the second NS entry
    specifies the secondary DNS server. You can also add tertiary DNS servers and
    so forth with the same NS entries.


    The third highlighted section includes other references, options, and settings
    for the domain entry. The MX (mail exchange) token points to the mail exchange
    server for the domain. The A tokens point to host addresses. For example, the
    A token in this example sets the domain example.com to 192.168.0.212. Another
    A token sets the domain www.example.com to 192.168.0.212 as well. An additional
    token used in this example is CNAME (canonical name). The CNAME token points to
    an appropriate IP address or domain. In the example, ftp.example.com is pointed
    to the same address as www, which was already defined as 192.168.0.212. Also,
    mail.example.com is directed to www. There is also a CNAME pointer for irc.example.com
    which redirects the request to a real IRC (Internet Relay Chat) server, which
    in this example is located at irc.example.net.


    # Reverse DNS Files


    Reverse DNS files are used to resolve IP addresses to their assigned host names.
    Reverse DNS is set up per subnet, meaning that all 192.168.0.x addresses would
    have a single reverse DNS file defined, as 192.168.1.x, 192.168.2.x, and so on
    (where x is equal to all nodes from .0 through .255).


    Reverse DNS files are named by the subnet (in reverse order) followed by the in-addr.arpa.
    For instance, the reverse DNS file for the 192.168.100.x subnet would be db.100.168.192.in-addr.arpa,
    and the reverse DNS file for the 205.23.12.x subnet would be db.12.23.205.in-addr.arpa.


    Although the subnet and in-addr.arpa file names are always used, many administrators
    replace the db with rev., simply for clarification (for instance, rev.12.23.205.in-addr.arpa
    or 12.23.205.in-addr.arpa). Regardless of which naming convention you use, keep
    the same naming convention throughout your


