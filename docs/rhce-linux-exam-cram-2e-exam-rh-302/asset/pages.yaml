  md: '# Setting Up a Samba Share


    When you''re setting up a Samba share, there are roughly five steps to follow
    (after the basic installation). To set up a Samba share for a specific directory
    (for this example/home), go through the following steps.


    +   1. Check the workgroup setting in /etc/smb.conf. The default setting is WORKGROUP.
    To set the workgroup (or domain) to MYGROUP, add a line in the [global] section
    like this:


    ```

    workgroup = MYGROUP

    ```


    +   2. Add the share to the /etc/smb.conf. You first need to add the share entry
    beneath the Share Definitions section of /etc/smb.conf. The entry will have six
    lines. The first line names your share—for example, [USER_HOME]. The second line
    sets the comment that is the part seen by the Windows client. A sample comment
    could be Home Directories. The third line specifies the path to the shared directory.
    For this example, the setting would be /home. The fourth line specifies public
    access (also known as guest ok). The fifth line specifies whether the share is
    printable (used only for printer shares). The sixth line specifies whether the
    share is writable. A sample entry for a Share Definition might look like this:


    ```

    [USER_HOME]

    comment = User Home Directories

    path = /home

    public = yes

    printable = no

    writable = yes

    ```


    +   3. Check your /etc/smb.conf syntax. After you have saved your changes to /etc/smb.conf,
    you should check your smb.conf syntax. A tool that allows you to do that is testparm.


    +   4. Restart Samba. After your /etc/smb.conf has been set up appropriately,
    you need to restart the SMB server. To do this, run /etc/rc.d/init.d/smb restart
    or service samba restart.


    +   5. Test your samba. First check to make sure SMB is running (/etc/rc.d/smb
    status or service samba status). If SMB is running properly, attempt to mount
    your own SMB share via smclient. To do this, use smclient -L localhost. (When
    you''re prompted with a password, press Enter.) If your system is working properly,
    you should see everything your machine is offering as SMB share.'
  merge: -1
  pgno: 296
