  md: 'The X Window System is the GUI used when Linux is running. Most administration
    tools in Linux have a GUI interface that can be used with the X Window System.
    Most administrators use the X Window System on their Red Hat Linux machines. Therefore,
    it is imperative that you are studying for the RHCE 302 exam, you understand the
    X Window System, X servers, X clients, and remote X applications.


    # # X Concepts


    The X Window System is not a new technology. In fact, it was implemented on several
    Unix systems before Linux was even created. One of the best explanations for where
    the X Window System came from can be found in the X Window System HOWTO, maintained
    by Ray Brigible and found in the LDP (Linux Documentation Project, http://www.linuxdoc.org/).
    The HOWTO explains that the X Window System was developed in the Laboratory for
    Computer Science at the Massachusetts Institute of Technology and was first released
    in 1984. The origins of X are based on the WWindowing package developed by Paul
    Asente at Stanford.


    The HOWTO continues to explain that in September 1987, MIT issued the first release
    of the X11 that we know and today. As of X11R2, development and control passed
    from MIT to the X Consortium, formed in January 1988.


    The X Window System is currently developed and distributed by the X.Org consortium.
    A liberal license permits the existence of free and low-cost implementations.
    Linux uses the XFree86 version of the X Window System. The XFree86 version, which
    can be freely distributed, is a collection of X servers for Unix-based operating
    systems on Intel x86 platforms. The work is derived from X386, and much of the
    new work is contributed back into the X11R6 project.


    # # X Window System Components


    The X Window System is made up of four main components that interact with one
    another to function: an X server, an X client, the X protocol, and an window manager.
    We''ll discuss the server, client, and window managers later in this chapter.


    You can establish the X Window System client/server relationship in two ways.
    Typically, on a Red Hat Linux system, the X client and the X server are located
    on the same machine. In this scenario, the X application acts as the client, and
    the hardware display adapter acts as the X server. In other instances, especially
    within large Red Hat Linux networks, the client/server relationship is established
    between two separate machines—a physically separate client and a separate X server.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# X Window System 219


    With both client/server relationships, however, the client makes requests to the
    X server. The X server responds by drawing the windows on the X server display.
    The X server''s response translates the X client''s request into hardware instructions,
    such as to a pixel here, change this pixel color, or do a screen refresh, and
    so on.


    All the request and response exchanges between the X client and the X server are
    carried over the X protocol, the X Window System''s underlying network transport
    protocol. The X protocol is used to enable programs to display graphic images
    on your monitor.


    The traffic that is set up between the X client and the X server does not go by
    itself between the client and the server. In fact, an X window manager is required.
    The X window manager, of which there are several types, acts like "middle management"
    between the X client and the X server.


    # X Server


    The X server is responsible for listening for X client requests for instructions
    on how to draw windows on the X display. If the X server is running without a
    client that makes requests, your monitor is a gray screen without any features
    or windows displayed. To understand the X Window System, and to pass the RHCE
    302 exam, you must know about the XFree86 servers and X configuration.


    # XFree86 Servers


    Most Linux distributions use the XFree86 servers supplied by the XFree86 Project.
    The XFree86 Project, Inc., is a non-profit organization that produces XFree86,
    a freely distributable implementation of the X Window System that runs on Linux
    and other x86-based Unix operating systems. Red Hat 6.2 is released with XFree86
    3.3.6-20. The XFree86 Project for the 3.3.x system currently has over 15 available
    XFree86 servers. However, all of these are being combined into one with the release
    of XFree86 version 4.0. Upcoming releases of Red Hat will be packaged with both
    3.3.6 and 4.0.x versions of XFree86. Until the video drivers are rewritten for
    4.0x, 3.3.6 will have better hardware support. Using 3.3.6, each server supports
    a specific type or family of video chipsets. Some of the most common servers are
    the FBDev, I28, Mach8, Mach32, Mach64, S3 Virgo, SVGA, and VGA14. The majority
    of video cards used today use the SVGA, Mach64, and S3 XFree86 servers.


    Note: When all servers are compiled into one server with the release of XFree86
    version 4, individual chipset support will be modularized for use with the single
    XFree86 server.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'To see if an XF86 server included in your Red Hat Linux distribution supports
    your video hardware, check Red Hat Software''s hardware compatibility lists (http://www.redhat.com/).
    For hardware support of other versions of XFree86, visit http://www.xfree86.org/,
    the Web site of the XFree86 Project, Inc. At this Web site, you can also download
    new versions of the XFree86 server.


    # # X Server Configuration


    Setting up the X Window System involves many files, options, and settings. All
    the configuration files used for the X Window System, as well as several programs
    and configuration tools, are found in the /etc/X11/ directory. The most important
    programs and tools include X and xinit, as well as Xconfigurator, XF86Setup, and
    xf86config.


    The X file is actually a symlink to Xwrapper, which runs /etc/X11/X, which is
    symlinked to your X server. The server you''re using is in the /usr/X11R6/bin/
    directory. Therefore, if you were using the XF86_S3 server, your X file could
    be symlinked to /usr/X11R6/bin/XF86_S3.


    The xinit program is used to start the X Window System. When executed without
    a specific client program indicated, the xinit program looks for a file named
    .xinitrc in the user''s home directory. The xinitrc file is a script used to start
    up client programs as the user has specified. If no xinitrc file is found in the
    user''s home directory, xinit uses the following default:


    ```

    xterm -geometry +1+1 -n login -display :0

    ```


    # # Xconfigurator


    Xconfigurator is Red Hat''s X Window System configuration program. To invoke this
    program, enter Xconfigurator at the shell prompt. The Xconfigurator creates a
    basic XF86Config file that is based on the selections you make within the menu
    interface. This XF86Config file (on Red Hat systems) is under /etc/X11 (which
    happens to be symlinked from /usr/X11R6/lib/X11 for compatibility with the default
    XFree86 directory structure).


    When running Red Hat''s Xconfigurator program, you are presented with a menu-based
    screen with a blue, red, yellow, and gray color scheme (as was used during the
    Red Hat Linux installation). Figure 9.1 shows the interface used with Xconfigurator.


    Xconfigurator has two modes of operation: interactive and kickstart. In interactive
    mode, Xconfigurator prompts you for the type of video card and monitor attached
    to your computer. Some of this information might be automatically'
