  md: '# 296 Chapter 11


    In order to perform firewalling on a Red Hat Linux system, you must have compiled
    the Linux kernel with firewall support. To check whether your kernel is already
    compiled for firewalling, issue the following command:


    ```

    ls -l /proc/net/ip_fwchains

    ```


    If the file exists, then your kernel already has compiled support for firewalling.
    If not, then you need to compile a kernel with firewall support. If you need (or
    choose) to compile a new kernel for firewall support, enable (or modularize) at
    least the following support:


    +   - Networking support (CONFIG_NET)


    +   - Network firewalls (CONFIG_FIREWALL)


    +   - TCP/IP networking (CONFIG_INET)


    +   - IP: firewalling (CONFIG_IP_FIREWALL)


    +   - IP: allows defragment (required for masquerading) (CONFIG_IP_ALWAYS_DEFRAG)


    # ipchains


    The ipchains tool specifies firewall policies to the Linux kernel. With ipchains,
    you can filter depending on IP address, port, network, destination, subnet, connection
    state, domain names, sub-domain names, and so on. You can install ipchains from
    the ipchains package on the Red Hat Linux 6.2 CD-ROM. The RPM for ipchains is
    ipchains-1.3.9-5.i386.rpm.


    There are three categories of rules in ipchains: the IP input chain, the IP output
    chain, and the IP forwarding chain. For each category, an individual table of
    rules is maintained:


    +   - IP input chain (input firewall) —The input rules regulate the acceptance
    of incoming IP packets. All packets coming in via one of the local network interfaces
    are checked against the input firewall rules. A rule that matches a packet will
    cause the rule’s packet and byte counters to be incremented appropriately.


    +   - IP output chain (output firewall) —The output rules define the permissions
    for sending IP packets. All packets that are to be sent via one of the local network
    interfaces are checked against the output firewall rules. A rule that matches
    will cause the rule’s packet and byte counters to be incremented appropriately.'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'IP forwarding chain (forwarding firewall) —The IP forwarding rules define the
    permissions for forwarding IP packets. All packets sent by a remote destination
    are checked against the forwarding firewall rules. A rule that matches will cause
    the packet and byte counters to be incremented appropriately.


    # Using ipchains


    Multiple options and rules can be used for issuing ipchains commands. The standard
    syntax for using ipchains is:


    ```

    ipchains -command chain [rule specification] [target]

    ```


    Several commands can be issued to ipchains. Table 11.4 lists the six most commands,
    their usage, and descriptions of what the commands do. (For a complete list, view
    the ipchains(5) man page—man 5 ipchains.)


    Rule specifications are required when you add (-A) or delete (-D) a rule. Several
    parameters can be used for rule specifications (for a complete list, view man
    5 ipchains). Three popular rule specifications are -p (protocol), -s (source),
    and -j (jump), described here:


    +   -p—Specifies the protocol. The protocol can be TCP, UDP, ICMP, or all. For
    example, a sample rule would be ipchains -A input -p icmp -s source -j target.


    +   -s—Specifies the source. The source can be the name of a host or a network,
    or an IP address. For example, a sample rule would be ipchains -A input -s 192.168.100.0
    -j target.


    | Table 11.4 Commands for ipchains. | Description |

    | --- | --- |

    | -A | ipchains -A chain rule | Appends a rule specification to the end of the
    specified chain. |

    | -D | ipchains -D chain rule | Deletes a rule from the specified chain. |

    | -L | ipchains -L chain | Lists rules in the selected chain. (If no chain is
    specified, all rules are listed.) |

    | -F | ipchains -F chain | Flushes all rules from the selected chain. |

    | -P | ipchains -P chain target | Sets a policy of the specified chain to the
    given target (see Table 11.5). |

    | -h | ipchains -h | Displays Help for the command. |'
