    # Administration Basics


    As a Linux administrator, you should be familiar not only with Unix, shell, and
    kernel basics, but also with other tools and programs. Home directories, file-location
    directories, daemons, logging, and backing up and restoring files are all concepts
    you should be familiar with.


    # Home Directories


    When a user account is created, it automatically has a home directory assigned.
    The /home/username directory contains-fault files, such as .Xdefaults, .bashrc,
    and .bash_profile. These files are copies from a default file location, typically
    found at /etc/skel (skeleton files).


    ![](img/fe9012f0d9b0102febe0e70f330ee448_78_0.png)


    > Superusers are users who have increased access and control. The standard superuser
    is root, where user id (UID) is set to 0. However, programs such as sudo can also
    provide limited superuser privileges to other users.


    # Daemons


    A daemon is one whose parent process is process ID 1 (for example, the init process).
    Linux uses daemons to perform routine tasks, such as monitoring system resources.


    For list of the daemons you are running, you can execute ps -aux, which reports
    a process status. To see which daemons are being loaded at bootup, you can type
    ntsys. The daemons that are checked with an asterisk (*) are loaded at startup.
    The init scripts for these daemons are located at /etc/rc.d/init.d/. You can use
    the init scripts to start, stop, or restart your daemons.


    Managing these daemons, as well as managing networking services, is simplified
    by using the ntsysv program to select which daemons to start at bootup. In addition,
    you can use inetd, the “Internet super-server” daemon. The inetd daemon'
