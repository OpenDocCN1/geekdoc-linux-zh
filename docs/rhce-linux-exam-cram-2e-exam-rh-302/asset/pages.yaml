  md: '# Installation and Configuration


    The root of the two hands-on portions of the RHCE 302 exam is the installation
    and configuration of a networked Red Hat Linux system. Topics at hand will cover
    everything from the base Red Hat Linux system to software configuration (covered
    in the next section). Until you get started, you won''t be sure what is available
    for you to use (equipment, media, software, pages, and so on), you''ll have to
    install the system, and what (if any) documentation will be available. In addition,
    the installation and configuration portion of the performance-based exam is time-limited.
    By default, you are given only two and a half hours to perform the system installation
    and configure whatever hardware and software options are specified.


    # What You Expect


    When you go in for the installation and configuration portion of the exam, try
    to feel prepared. Feel confident that you can successfully achieve all the primary
    goals of each section in this book. Don''t wait in expecting any surprises. You
    shouldn''t find any unexpected circumstances in this exam.


    For the exam, you''ll be presented with all the tools you can use (if any) for
    your installation. What types of tools could you be presented with? You might
    scratch paper, writing utensils, floppy disks, CD-ROMs, network information, server
    information, and more.


    You''ll then be given your list of objectives. Nope, you can''t start yet! When
    all test-takers have received their objectives, you''ll be asked to turn over
    the objective packet to fill out the front information. On the first sheet of
    the packet, you''ll fill out your name, other basic information, and the time
    you start (provided by the instructor). In addition, you''ll be asked to sign
    a nondisclosure agreement stating that you will not share the contents of your
    exam.


    When you''re finished with the exam, you place your objectives upside down on
    your desk and check in with your instructor before leaving the exam room. The
    instructor will then check whether and how you completed your objectives.


    # How to Handle It


    Your installation and configuration exam objectives will be straightforward. Remember,
    don''t expect anything tricky for this part of the exam. When your instructor
    signals for you to begin, follow these steps:


    +   1. Read each objective.

    2. Note which objectives you can perform most easily and which ones you''ll find
    difficult.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# The Installation and Configuration Exam


    3. Make any quick notes that you might find useful as reminders later in the exam.
    (Especially write notes that you might not have media, documentation, or man pages
    for.)


    4. Make note of any objectives that you can meet simultaneously. Remember, this
    is a timed exam. If any objective requires you to wait for a result, do something
    else at the same time. Also, if any objectives can be related, finish both in
    one step (rather than returning to a subject and finishing later).


    5. Don''t spend more than five minutes doing this. Pick your first obvious objective
