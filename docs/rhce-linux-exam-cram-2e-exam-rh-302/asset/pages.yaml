  md: 'current default options, skip the make mrproper step. To finish configuring
    your kernel, use your choice of make config, make menuconfig, or make xconfig,
    as discussed earlier in this chapter.


    +   2. Next, you must do some general kernel housekeeping. This means that you
    need to clean up any unused or temporary files from the kernel source tree. To
    clean up the source tree, run make clean.


    +   3. Next, you must ensure that all dependencies are available and correctly
    placed. The two dependencies in particular are the kernel header files /usr/src/linux/config.h
    and /usr/src/linux/proc_fs.h. To check for these dependencies, run make dep.


    +   4. Next you must create the kernel image. Your two options are make zImage
    and make bImage. Both methods compile a kernel image, place it in the /arch/i386/boot
    directory, and then call the image either zImage or bImage (depending on the method
    you use).


    The method you use depends on the size of your kernel. If your kernel image plus
    the compressed kernel image is smaller than 640K, you can use zImage. However,
    if your kernel is monolithic, or otherwise larger than 640K, you should use bImage.
    Unless you''re attempting to make the smallest possible kernel, it''s always safe
    to use bImage.


    After the image is created, copy the zImage or bImage from the /usr/src/linux/i386/boot
    directory to the /boot directory. In the /boot directory, you might want to rename
    the image to something like vmlinuz-kernel.version, such as 2.2.18.


    +   5. Next, you compile your modules. If you made a completely monolithic kernel,
    skip to Step 7. Otherwise, run make modules to compile all of your selected modules.


    +   6. You must next install your compiled modules by running make modules_install.
    When you install the modules with this make option, make install them to /lib/modules.


    > Note: With the post-configuration make options—such as make clean, make dep,
    make modules, and make modules_install—you don''t have to invoke each make command
    one at a time. You can string them together to run automatically without user
    intervention; to do this, run make clean dep modules modules_install . While letting
    this run, you can do whatever you want; you don''t need to wait for any specific
    task until all make options are finished.'
