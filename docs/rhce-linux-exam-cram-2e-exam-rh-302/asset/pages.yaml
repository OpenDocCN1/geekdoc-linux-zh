  md: '# Advanced Installation 165


    The next section specifies the packages you want to install. Under the %packages
    line, you can specify individual names of packages to be installed. This line
    is used if the system will use a custom configuration or if you are going to install
    additional packages. In addition, you can specify to install the default configuration
    (such as workstation or server). To do so, use the kickstart file options @ KDE
    Workstation, @ GNOME Workstation, or @ Server. Make sure that if you use one of
    these options, place a space between the @ sign and the setting.


    The final option is %post. This section runs any special commands after the system
    has been installed. For example, you might want to run a command in the %post
    section that sets up your name server. To do so, type


    ```

    echo "nameserver 192.168.0.254>>/etc/resolv.conf

    ```


    where 192.168.0.254 is your specified name server.


    # Using Diskette-Based kickstart


    The most common type of kickstart installation uses a kickstart boot floppy and
    a CD-ROM. The required boot floppy uses a ks.cfg configuration file. The ks.cfg
    file is created based on the installation information on your prototype machine.
    This means that in order to have a successful ks.cfg boot disk, you must manually
    set up one machine with the specific settings that you need on the system. After
    installing the system with everything you want, you can create the ks.cfg file.
    To do this, run the mkickstart command and redirect the output to the ks.cfg file.
    For example,


    ```

    mkickstart >ks.cfg

    ```


    can run only as root. The mkickstart utility then prepares your prototype system
    for its configuration. When it''s finished, view the ks.cfg file to ensure that
    everything was detected properly.


    After you have created the ks.cfg file, copy it to your boot disk. The appropriate
    boot disk for this system uses the standard boot.img image. Copy the ks.cfg file
    to the boot diskette''s top-level or root directory.


    To start your kickstart installation, boot your system with the boot floppy, and
    have the Red Hat Linux CD-ROM in the CD-ROM drive. At the boot prompt, enter linux
    ks=floppy. Your installation should run automatically from that point.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_196_0.png)'
