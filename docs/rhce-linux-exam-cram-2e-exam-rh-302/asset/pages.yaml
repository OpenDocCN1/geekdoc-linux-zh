  md: '# Self-Assessment


    I included a Self-Assessment in this Exam Cram book to help you evaluate your
    readiness to tackle RHCE certification. This Self-Assessment should also help
    you understand what you need to master the topic of this book—namely, RHCE 302.
    Before you tackle this Self-Assessment, let''s talk about concerns you might face
    when pursuing an RHCE and about what an ideal RHCE candidate might look like.


    # RHCEs in the Real World


    In the next section, I describe an ideal RHCE candidate, knowing full well that
    only a few real candidates will meet this ideal. In fact, my description of ideal
    candidate might seem downright scary. But take heart: although the requirements
    to obtain an RHCE might seem formidable, they are by means impossible to meet.
    However, you should be keenly aware that getting through the process takes time,
    requires some expense, and consumes substantial effort.


    Introduced in the spring of 1999, the RHCE program is very young. Demand for this
    certification is growing, and the limited seating for the testing makes the RHCE
    even more valuable. However, if you''re willing to tackle the process seriously
    and do what it takes to obtain the necessary experience and knowledge, you can
    take—and pass—all the certification tests involved in obtaining an RHCE. In fact,
    Coriolis has designed its Exam Cras and companion Exam Preps to make it as easy
    for you as possible to prepare for certification exams. We''ve also greatly expanded
    our Web site, http://www.examram.com, to provide a host of resources for various
    certifications.


    # The Ideal RHCE Candidate


    Just to give you some idea of what an ideal RHCE candidate is like, following
    are some relevant statistics about the background and experience such an individual
    might have. Don''t worry if you don''t meet these qualifications—this is a far
    from ideal world, and where you fall short is simply where you''ll have more work
    to do.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   Academic or professional training in network theory, concepts, and operations.
    This training includes everything from networking hardware and soft-ware to the
    Linux operating system, services, and applications.


    +   Two or more years of professional networking experience, including experience
    with Ethernet, modems, and other networking media. This experience must include
    installation, configuration, upgrading, and troubleshooting.


    +   Two or more years in a normed environment with hands-on experience with Red
    Hat Linux or other Linux distributions, such as Caldera, Debian, or SuSE. A solid
    understanding of each system''s architecture, installation, con-figuration, maintenance,
    and troubleshooting is also essential.


    +   Familiarity with key Linux-based TCP/IP-based services, including HTTP (Web
    servers), DHCP, and DNS, plus familiarity with one or more of the following: FTP,
    Samba, Squid, NFS, or ipchains.


    #  Put Yourself to the Test


    The following series of questions and observations is designed to help you figure
    out how much work you must do to pursue Red Hat certification and what kinds of
    resources you might consult on your quest. Be absolutely honest in your answers,
    or you''ll end up wasting money on exams you''re not ready to take. There are
    no right or wrong answers, only steps along the path to certification. Only you
    can decide where you really belong in the broad spectrum of aspiring candidates.


    Two things should be clear from the outset, however:


    +   Even a modest background in computer science will be helpful.


    +   Hands-on experience with Linux, Linux products, and Linux technologies is
    an essential ingredient to certification success.


    # Educational Background


    +   1. Have you ever taken any computer-related classes? [Yes or No]


    If Yes, proceed to question 2; if No, proceed to question 4.


    +   2. Have you taken any classes on Unix operating systems? [Yes or No]


    If Yes, you will probably be able to handle Red Hat''s architecture and system
    component discussions. If you''re rusty, brush up on basic Unix concepts, especially
    virtual memory, multitasking regimes, user mode versus superuser mode operation,
    filesystems, and general computer security topics.'
  merge: -1
  pgno: 27
- img_proc: true
