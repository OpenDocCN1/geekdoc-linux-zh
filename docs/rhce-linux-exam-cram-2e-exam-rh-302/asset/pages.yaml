    # Runlevel Directories


    The system runlevel directories are noted as /etc/rc.d/rc0 through /etc/rc.d/rc6.d.
    These directories do not actually contain real files or scripts. Instead, they
    contain links to scripts that are located in the /etc/rc.d/init.d directory.


    The links in the rcX.d directories are run when the system accesses the rc.sysinit
    initialization script. Each directory contains links to real scripts. Here is
    an excerpt of the files in /etc/rc.d/rc0.:


    ```

    lrwxr-xr-x 1 root 13 Jun 15 1999 K10ifs ->../init.d/xfs

    lrwxr-xr-x 1 root 13 Jun 15 1999 K15gpm ->../init.d/gpm

    lrwxr-xr-x 1 root 13 May 9 19:54 K20ifs ->../init.d/nfs

    ```


    Each symlink in the rcX.d directories is noted with an S or K at the beginning
    of the link name. S indicates that the script is to be started; K indicates that
    it should be stopped. Following the S or K is a two-digit number that indicates
    the order in which the scripts are to run. For example, 10 gets before 15.


    Following a list of the scripts that are started or stopped between the seven
    runlevels. Each time another runlevel is accessed, with init 1, all the services
    in the rcX.d directory are performed.


