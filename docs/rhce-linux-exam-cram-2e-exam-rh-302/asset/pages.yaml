    # # Kernel Configuration Options


    When configuring a kernel using any of the tools described earlier in this chapter,
    you are presented with at least 20 divisions of configuration options. These options
    range everywhere from configuration tool preferences to hardware support and even
    development tools. This section discusses the different categories of options
    available, the settings available, and the standard preferences and practices
    for each category.


    *Note: The options described in the following sections are not necessarily listed
    in the order in which your make option presents them. The order in which you configure
    your kernel does not affect the kernel in any way. These options and descriptions
    are based on the compilation of kernel 2.2. Options for other kernels, older or
    newer, might have fewer or additional options and categories because more hardware
    and other technologies are supported.*


    # # Code Maturity Level


    One of the first concerns Code Maturity Level options. The Code Maturity Level
    option sets whether the kernel configuration prompts you for development or incomplete
    support options within the kernel. If you set this option to No, all development
    and incomplete support options are automatically disabled. It is recommended that
    you set this option to Yes. Many tools require development packages to work properly.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_220_0.png)


    **Figure 8.3** Linux Kernel Configuration (make xconfig).'
  merge: -1
