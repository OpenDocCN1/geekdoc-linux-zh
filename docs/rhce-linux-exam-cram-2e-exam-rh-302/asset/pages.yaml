- img_proc: true
  md: 'newuser where newuser is the new user''s username. Next, if you want to set
    the user''s password, enter passwd newuser. You are prompted to enter the user''s
    password and confirm it. Or, if you want to generate a random password, enter
    mkpasswd newuser instead of using passwd. The adduser (or useradd) command automatically
    sets up the user''s home directory by copying the files located in /etc/skel.


    As mentioned earlier in this chapter, linuxconf is a graphical-user-interface
    tool used to set up many things, including new users, in Linux. To invoke linuxconf
    at the root prompt. Then move through the directory tree in the left screen to
    go through Config, then Normal, User Accounts. Next, click the Add button. You
    are prompted for information such as the login, the user''s full name, his group
    (optional), any additional groups, and special permissions. After choosing the
    Accept button, you are asked to enter a user password and confirm it.


    You can use another graphical-user-interface tool, userconf, to add users. The
    userconf tool, which is a little more user-friendly than linuxconf, has buttons
    and self-explanatory tabs (rather than the directory tree). To invoke userconf,
    enter userconf at the root prompt. To add a user, click User Accounts and then
    on the Add button. You can add the user information exactly as you do when you
    use linuxconf.


    # Deleting User Accounts


    A good administrator keeps a good audit on the users on her machine. The main
    thing to keep track of is which users are active and aren''t. You should disable
    accounts that are no longer being used, such as those for employees who no longer
    working there. Leaving old accounts active on your system is a security risk.
    When you disable the account, make sure to remove all the files the user had on
    the system. By keeping the old accounts on the system (disabled), you prevent
    the possibility of reusing UIDs (user IDs), thus maintaining a higher level of
    security.


    You can remove users from your system in several ways: You can remove them manually,
    remove them within a group (with groupdel), or use the freely interfaced tools
    such as userdel or linuxconf. Each tool differs, and which one you use is simply
    a preference.


    If you don''t like to trust automatic programs, or if for some reason your tool
    isn''t functioning or isn''t available, you can remove the user manually. First,
    edit your password file and remove the line assigned to the user. Next, remove
    the user''s entry in the /etc/group file. Finally, rename, move, or delete the
    user''s home directory, including the .login and .profile files within that directory.'
