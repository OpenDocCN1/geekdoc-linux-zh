    # Partition Types


    You can enable five major partition types in the kernel. These options turn on
    support for various partition-table formats that various operating systems use.
    The first option is for BSD disk-label support, which enables support for BSD-style
    partition tables. The second option is for Macintosh partition-map support. This
    is used on the Macintosh platform. The third option is is for SMD disk-label support,
    which enables support for Sun partition tables. The fourth option is for support
    of the x86 Solaris partition table. The last option is the experimental support
    for Unixware slices. By default, Linux uses the DOS-style partitiontable format.


    # Native Language Support


    If you turn on FAT support, or support for the Microsoft Joliet extension for
    ISO9660, you are prompted for support for NLS, which is used to support the various
    character sets used around the world. These character sets are labeled by codepage
    and their appropriate number, such as codepage 437, which is the charset for the
    United States and Canada. Approximately 27 character sets, ranging from United
    States English to Turkish to Russian, are available.


    # Console Drivers


    The four options in the Console Drivers category allow you to enable options for
    your Linux console. The first is the VGA text console support option. This option
    turns on support for the standard PC-style VGA text console. You should almost
    always turn this on for x86 systems.


    The second is the mode video selection support option. This includes support in
    the kernel for switching VGA text modes using the BIOS before the kernel boots
    into protected mode (and can no longer use the BIOS). To use this option, you
    must boot the kernel with the "vga" option.


    The third option is support for the dual-headed MDA text console. This new experimental
    option allows you to run with an Hercules monochrome-adapter and monitor on your
    system. This can be very handy for keeping something such as the system log displayed
    on a second monitor at all times.'
