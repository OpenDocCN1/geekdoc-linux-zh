  md: '# IP Masquerading


    IP masquerading is a specialized version of NAT (Network Address Translation),
    in which all packets on a network are forwarded through a firewall and modified
    to appear as if the packet originated from the firewall itself. IP masquerading
    relies on the firewalling and ipchains packages to be installed (explained in
    the section titled “Sample ipchains”).


    # Setting Up IP Masquerading


    In addition to the support for firewalling and the ipchains package installation,
    you must have secured specific options (compiled or modularized) to the Linux
    kernel. The three options required are as follows:


    +   - IP: transparent proxy support (CONFIG_IP_TRANSPARENT_PROXY)

    - IP: masquerading (CONFIG_IP_MASQUERADE)

    - IP: masquerading special modules support (CONFIG_IP_MASQUERADE-MOD)


    # Using ipchains for IP Masquerading


    Setting up an ipchains rule to masquerade is simple. Let’s say you have an internal
    network assigned with 192.168.0.x addresses. You want to give each machine in
    your internal network access to the Internet through a single gateway server (a
    Linux router dialed in via modem to the Internet). You can forward all traffic
    from the internal Ethernet interface (eth0) to the external network interface
    (ppp0), masquerading all the packets to look as if they were generated by the
    router with the following ipchains command (all on one line):


    ```

    ipchains -A forward -p all -s 192.168.0.0/24 -d 0.0.0.0/0 -i ppp0 -j MASQ

    ```


    # Secure Shell (SSH)


    SSH is the Secure Shell utility used to securely connect and transfer data between
    two machines over a network. SSH provides secure replacement for utilities such
    as rsh, telnet, login, ftp, and rpc.


    SSH also runs in a server/client environment using sshd server and ssh client.
    The SSH client connects with the sshd server and authenticates the connection,'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'allowing the connection or data transportation to occur over an encrypted tunnel.
    For data transactions such as rcp or ftp, the secure replacement tool with SSH
    is scp.


    In addition to simple data transactions, SSH can also provide transparent X authentication
    and redirection. With SSH, you can start an X client on the remote machine, and
    the display will travel encrypted over your connection and appear on your local
    machine without using systems such as xhost or xauth, as I discussed in Chapter
    9.


    Because of export encryption technology laws, SSH is not shipped on your Red Hat
    6.2 CD. You should either obtain SSH from http://www.zedz.net/ or acquire an open-source
    version from http://www.openssh.com.'
