  md: '# Chapter 7


    ```

    part swap --128

    part /usr --size 1000 --grow -maxsize 2000

    install

    mouse ps/2 --emulthree

    timezone --utc US/Central

    xconfig --monitor ''lcd panel 1024x768''

    rootpw redraw

    auth --shadow --enablemd5

    #lilo --append ''anything-needed''

    %packages

    @ KDE Workstation

    %post

    ```


    This example shows a very simple and very basic ks.cfg file. The first line specifies
    that English is the selected language. The second line specifies your network
    configuration, which in this case is DHCP. The third line specifies the installation
    medium. This line contains either cdrom or nfs -server name.of.server -dir/pathtoimagefile
    and so on. The next two lines configure any devices as Ethernet and keyboard.


    The next five lines in this file refer to the hard disk and its partitioning.
    The first option, zerombr, instructs Red Hat Linux to clear the current partition
    information. The clearpart option specifies to clear all the Linux partitions
    on the disk. The three part options specify the partitions to be created on the
    disk, including partition type, mount point, and size. I will discuss changes
    to the ks.cfg file in more detail later in the chapter (see "Using Diskette-Based
    kickstart").


    The next option, install, is a required parameter stating that you will do a fresh
    installation of Red Hat Linux. The next three options in sample ks.cfg are additional
    configuration settings. The mouse option allows you to set the mouse type in any
    options you need, such as emulating two buttons. The timezone option specifies
    the time zone to set on your machine. The xconfig line specifies which X server
    to install and what type of monitor you are using.


    The final options set system information and installation information. The rootpw
    line allows you to specify the root password. If you have the encrypted version
    of your root password, you can use the following option line:


    ```

    rootpw -iscripted $whatever%$thescheme*is

    ```


    The auth line allows you to permit the use of shadow passwords and MD5. In addition,
    if your systems are going to use LILO, you can install and configure LILO by using
    the lilo option. You can also append any information that LILO needs using the
    -append option.'
