    #  Configuring Network Installations


    Red Hat Certified Engineers often work in large environments where manual installations
    from CD-ROM media are not only tedious but also slow compared to installing over
    a network. Therefore RHCE candidates should be comfortable setting up the network
    installation servers and creating ways to automate the installations.


    # Configuring Network Installation Servers


    As discussed in Chapter 5, there are three methods of network installations that
    a Red Hat client can install with: `FTP`, HTTP, and NFS.


    # FTP Installation Server


    Setting up an FTP installation server allows clients accessible on your network
    to install Red Hat from a publicly accessible FTP directory. If your public directory
    is `/home/fpt/install/RedHat`, you would need to copy all of the CD-ROM''s contents
    from the Red Hat directory into `/home/fpt/install/RedHat`.


    # HTTP Installation Server


    An HTTP installation server requires your server to support HTTP connections.
    Setting up HTTP access is quite similar to setting up FTP access. Instead of copying
    the contents of the RedHat directory into a public FTP folder, you need to place
    the contents into your HTTP accessible folder, such as `/home/httpd/html/install/RedHat`.
    If you decide to support both FTP and HTTP installations, rather than wasting
    disk space with two copies of the contents of RedHat, simply create a symbolic
    link (`-s`) between the two directories.


    # NFS Installation Server


    An NFS installation server requires a little more to set up than the previously
    mentioned FTP and HTTP servers. For an NFS server, you must properly have nfsd
    running on the network. For the installation information, you must create an entry
    in the `/etc/exports` file for NFS to create the export. If you had the information
    located in the FTP directory, `/home/fpt/install/RedHat/`, you would add an entry
    to `/etc/exports`, like this:


    ```

    /home/fpt/pub/RedHat

    ```'
