  md: '# Using a CD-ROM


    If you have a bootable CD-ROM, you can start your installation by booting from
    the Red Hat 6.2 distribution CD. Make sure your BIOS is set to boot from the CD-ROM
    first. If you are planning to set up a dual-boot system (discussed in Chapter
    7) and already have a DOS partition on the drive, you can choose to use the autoboot
    feature, located under the directory /desoutils on the Red Hat 6.2 CD. However,
    if you don''t have a bootable DOS partition or a bootable CD-ROM, you must use
    a boot floppy.


    # Using a Boot Floppy


    If the boot floppy is not included with your installation media, you can create
    it by using either rewrite (on DOS) or dd (on a Unix machine). Using either of
    these utilities writes the boot image to a floppy disk. You can run rewrite directly
    from the Red Hat 6.2 CD by following these steps:


    +   1. Load the CD and change into the \desoutils directory.


    +   2. Run *rewrite*. You are asked to supply the path to the boot directory that
    you want to load. For instance, for boot.img, enter \images/boot.img. You are
    then asked to provide your target. You are using a floppy disk, so choose A:


    +   3. You are next prompted to insert a floppy disk and press Enter. The process
    takes a few minutes, but when it''s finished, you have a working boot disk.


    To use the dd utility on a Unix system to create a boot disk from the CD, first
    mount the CD-ROM. Next, type the command `dd if=/dev/fd0 of=/mnt/crom/images/boot.img`
    replacing /mnt/crom with the mount directory of your CD-ROM. You might also need
    to replace /dev/fd0 with the appropriate mount point of your floppy disk. The
    boot image, named boot.img, is on the Red Hat 6.2 CD under the /images directory.
    You can also download the boot.img file from one of Red Hat''s FTP mirrors. A
    list of mirrors can be found at http://www.redhat.com/mirrors.html.


