    \ jobs apply to moving back time. If the time is moved backward by less than one\
    \ hour, the scheduled jobs are not run again. However, if time is moved back by\
    \ more than an hour, commands are re-executed.\n\n# Bash Configuration\n\nChapter\
    \ 6 discussed how to configure the bash files for individual users. As a reminder,\
    \ you should recognize the .bash_logout, .bash_profile, and .bashrc. These files—which\
