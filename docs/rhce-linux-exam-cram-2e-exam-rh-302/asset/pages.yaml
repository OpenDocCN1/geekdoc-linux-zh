  md: '# Basic Configuration and Administration


    Running passwd command from the root prompt prompts you to change the root password.
    To change a user''s password using passwd, run


    passwd username


    You are then prompted to change and verify the username''s new password. This
    command is also made available to users for their own passwords. However, only
    root can use the passwd command to change other users'' passwords.


    If you want to change a user''s login name, groups, shell, or home directory,
    you can use a command-line utility called usermod. You can use usermod only when
    a user isn''t logged in or otherwise active on the system. To learn more about
    how to use usermod, run the man usermod command at the shell prompt.


    # Understanding the Basic User Environment


    Any time a user account is created, either manually or with a user administration
    tool, a certain number of default files and directories are created in the user''s
    home directory (located at /home/username). By default, the files that are copied
    into the user''s home directory include .Xdefaults, .bash_logout, .bash_profile,
    and .bashrc, which I will discuss more fully in the next section.


    These default files are copied from the /etc/skel directory, which contains "skeleton"
    files that are used by default when a new user account is created. Anything found
    in this directory is automatically copied to a user''s directory when the directory
    is created. For instance, when KDE is installed, two files are copied automatically
    to the /etc/skel directory. The two files are .kde and kderc, which are configuration
    files for the KDE Window Manager. You should put anything you would like to have
    copied into a user''s home directory in /etc/skel as well.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_178_0.png)


    > Adding files to /etc/skel affects only new users created on the system. You
    must manually copy any additional files you want existing users to have.


    # /etc/skel Files


