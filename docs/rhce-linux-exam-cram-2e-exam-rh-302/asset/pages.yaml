  md: '# # IP Addressing


    The most important concept to understand in TCP/IP networking is IP addressing.
    An IP address is a numeric identifier assigned to each machine on an IP network.
    An IP address is a software address, not a hardware address (hardware addresses
    are hard-coded into the machine or the network interface card).


    # ## IP Numbers


    An IP address is made up of 32 bits. These bits are separated into four 8-bit
    octets. (Each octet contains four bytes of information and specifies either the
    network or the machine node.) Every machine on a subnet has the same network address
    but individual node addresses.


    You can display an IP address in three ways. The first and most common method
    is dotted decimal notation. 130.57.30.56. The second way is using the binary system.
    If you convert 130.57.30.56 to binary, it is 10000010.00111110.000100111000. The
    third way is the hexadecimal system. If you note 130.57.30.56 as hexadecimal,
    it is 82 39 1E 38.


    *Note: Throughout this section—and the entire book—IP addresses are written using
    the dotted decimal format.*


    # ## IP Classes


    There are three classes of IP networks: Class A, Class B, and Class C. Different
    classes are used depending on network size. The Class A network is used for a
    collection of a small number of networks with a large number of nodes. The Class
    B network is rarely used in a network, but can be used in a large network where
    numerous Class C networks are unmanageable and a Class A network is too large.


    A Class A network uses the addressing format Net.Node.Node.Node, allowing you
    to have up to 127 networks and 16,777,216 nodes per network. IP addresses for
    Class A networks range from 1.0.0.0 to 127.0.0.0.


    *Note: Class A networks are no longer assigned because none is available to assign.
    In fact, some Class A networks are already being carved up into smaller networks.*


    Being assigned a Class A network gives you all network addresses under the Net
    address. For instance, a company that owns the 12.0.0.0 Class A set of IP addresses
    has every IP address from 12.0.0.0 to 12.255.255.255.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Chapter 4


    A Class B network uses the addressing format Net.Net.Node.Node. This allows you
    to have up to 16,384 networks and 65,534 nodes per network. IP addresses for Class
    B networks range from 128.0.0.0 to 191.0.0.0. Being assigned a Class B network
    gives you all network addresses under the Net.Net assignment. For instance, a
    company that owns the 130.1.0.0 Class B network owns every IP address from 130.1.0.0
    to 130.1.255.255.


    The Class C networks are the most common network class used today. They allow
    you to have up to 2,097,152 networks, but you are limited to having only 254 nodes
    per network. IP addresses for Class C networks range from 192.0.0.0 to 223.0.0.0.
    Being assigned a Class C network gives you all network addresses under the assigned
    Net.Net.Node.Node address. For instance, an administrator or company who owns
    the 200.0.2.0 Class C network owns every IP address from 200.0.2.0 to 200.0.255.255.


    You might be wondering what happens with network addresses above 235.255.255.255.
    Well, there are other classes of networks: Class D and Class E. Class D is used
    for multicast packets. These packets include the addresses from 224.0.0.0 to 239.255.255.255.
    A multicast transmission is used when a host wants to broadcast to multiple destinations,
    such as when a host is attempting to learn all the routers on its network. The
    Class E range of addresses is 240.0.0.0 through 255.255.255. These numbers are
    reserved for future use. You should not assign Class D or Class E addresses to
    nodes on your network.


    controlled by an official Internet organization called the Network Information
    Center (NIC), also referred to as InterNIC. Its Web site is located at http://www.internic.net.


    The Internet Assigned Numbers Authority (IANA) has reserved the following blocks
    of addresses for private networks:


    +   - 10.0.0.0 through 10.255.255.255

    - 172.16.0.0 through 172.31.255.255

    - 192.168.0.0 through 192.168.255.255


    These addresses can be used on any internal private network free of charge. However,
    these addresses are not publicly routable.


    Note: Classless InterDomain Routing, or CIDR (discussed in the next section),
    has mostly made the Class A, B, and C system technically irrelevant. Regardless,
    the classes terminology is still widely used.'
  merge: -1
