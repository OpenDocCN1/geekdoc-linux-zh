    # # Installing Red Hat: The Final Stage


    After all the dependency requirements are met, Red Hat begins the physical installation
    process. It creates the filesystem on the drive to which you''re installing, checks
    to see that you have adequate disk space, and finally begins installing the chosen
    packages. In addition, Red Hat 6.2 automatically detects the type of CPU you have
    installed and optimizes the installed kernel. The autodetected types of CPUs include
    Pentium Pro, PII/III, and AMD''s K5 and K6. All other CPUs are set up with the
    default 386 settings.


    > During the installation process, you can view installation messages and other
    information on the first five virtual consoles. Press Alt+F1 displays the installer.
    Press Alt+F2 presents a bash shell. Press Alt+F3 displays an Installer log. Press
    Alt+F4 shows all of your kernel messages. Press Alt+F5 displays the standard output
    of m2fs.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_146_0.png)


    # # Verifying Your New Installation


    After you complete your installation, the first thing you''ll do is restart your
    machine. When your machine successfully boots, log in as "root" with the root
    password you selected during the installation. Before trying to use programs or
    services on the newly installed Linux machine, view dmesg log file by entering
    cat /var/log/dmesg at the prompt. The output of dmesg is a log of the messages
    you see during boot-time. Within the dmesg log, you can look for the messages
    stating that the kernel has initialized your partitions, your ethernet card, and
    more. Listing 5.1 shows a sample snippet of dmesg output.


