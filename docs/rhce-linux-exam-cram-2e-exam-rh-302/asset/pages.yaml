  md: '# Question 6


    What is a bootloader?


    A bootloader is a program used to manage the boot process of an operating system,
    such as LILO, can manage the boot processes of multiple operating systems, allowing
    you to boot more than one operating system from separate partitions on the same
    machine. At this time, however, you cannot boot multiple operating systems simultaneously.


