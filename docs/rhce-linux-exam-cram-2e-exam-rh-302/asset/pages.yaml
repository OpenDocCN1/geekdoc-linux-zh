  md: 'The largest portion of the RHCE 302 exam centers on setting up Red Hat Linux
    networking services. The reason for such focus is that the greatest percentage
    of Red Hat installations are for machines to be used as either clients or servers
    on a network. Supporting networking is the strongest feature and most common use
    of Linux. To be successful not only on the RHCE 302 exam but also as a RHCE, you
    must be comfortable with installing, configuring, and using many Linux networking
    services. In this chapter, I''ll discuss Apache, email, Domain Name Services (DNS),
    File Transfer Protocol (FTP), Network File System (NFS), Samba and Server Message
    Block (SMB), the Dynamic Host Configuration Protocol (DHCP), time services, and
    the Squid proxy server.


    # # Apache


    Apache is the world''s most popular Hypertext Transport Protocol (HTTP) server,
    running on more than 62 percent of the world''s Web servers as of this writing.
    Apache was originally based on the most popular Web server in 1995, NCSA''s httpd
    1.3. Because the first version of Apache consisted of different patches applied
    to NCSA''s httpd, Apache was often referred to as a "patchy server," which is
    how Apache gets its name (A+PAChy). In this section, I''ll discuss how to set
    up Apache and how to set up virtual hosts.


    Red Hat Linux 6.2 is shipped with Apache 1.3. You can install it either during
    the installation of Red Hat Linux or by installing the RPM file apache-1.3-12.i386.rpm,
    which is located on your Red Hat Linux 6.2 CD in the /RedHat/RPMS directory.


    The installation of Apache places all the configuration files in the /etc/http/conf/
    directory. Apache used to use three main configuration files: access.conf, httpd.conf,
    and srm.conf. These three files have now been combined into one httpd.conf.


    # ## Configuring Apache


    The /etc/httpd/httpd.conf file is the main httpd server configuration file. In
    previous releases of Apache, the httpd.conf file made calls for information from
    the access.conf and srm.conf. Due to the size of the httpd.conf file, I am going
    to discuss it in sections, explaining the most important configuration options
    in this file.


    The httpd.conf configuration directives are sorted into three basic sections.


    +   - Directives that control the operation of the Apache server (global environment).'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'Directives that define the parameters of the main or default server that responds
    to requests not handled by a virtual host. (Also provides default values for the
    settings of all virtual hosts.)


    Settings for virtual hosts that allow Web requests to be sent to multiple IP address
    or host names and then them handled by the Apache server process. (I''ll discuss
    setting up virtual hosts in the next section of this chapter.)


    # Section 1: Global Environment—httpd.conf


    The directives in this section of httpd.conf affect the entire operation of Apache.
    This includes the number of requests that Apache can handle and the location of
    Apache configuration files.


    The following snippet of code specifies whether to run httpd in standalone mode
    or through inetd. The default setting for Apache is to run the server in standalone
    mode. Running the server through inetd is not advised because it causes inetd
    to fork() repeatedly, with each fork() function running its own instance of httpd.
    This causes the Web server to be very slow.


    ```

    # ServerType is either inetd, or standalone.

    # only supported on Unix platforms.

    #nServerType standalone

    ```


    The ServerRoot directive specifies the top of the directory tree where the server''s
    configuration, error, and log files are kept. Do not add a slash (/) to the end
    of this directory path. Here''s a ServerRoot directive:


    ```

    ServerRoot "/etc/httpd"

    ```


    Note: If you intend to place this directive on an NFS (or other network) mounted
    filesystem, then read the LockFile documentation (http://www.apache.org/docs/mod/core.html).


    The following line from httpd.conf sets the number of seconds before http send
    and receive requests out. The numeric setting is set in seconds:


    ```

    # Timeout: The number of seconds before receives and sends time

    # out.

    # Timeout 300

    ```'
