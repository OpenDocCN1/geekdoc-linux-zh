  md: '# Chapter 10


    The DirectoryIndex directive is the default file that is assumed to be loaded
    first within the Web directory. This means that if you go to http://www.example.com,
    httpd will look in the DocumentRoot directive and automatically load the file
    named index.html, index.shtml, or index.cgi (whichever is present) as specified
    by the DirectoryIndex listing. The index.html file and related files are the default
    options. If you want to change this, add files such as home.html, you change the
    following:


    ```

    DirectoryIndex index.html index.shtml index.cgi

    ```


    The ErrorLog directive specifies the location of the error log file. If you don''t
    specify an ErrorLog directive within your VirtualHost container, error messages
    will be logged here by default. Many administrators place all their logs under
    a main logs directory. Therefore, an appropriate setting for ErrorLog in the custom
    scenario is ErrorLog logs/www.example.com/error_log.


    ```

    ErrorLog /var/log/httpd/error_log

    ```


    Note: After configuring Apache, or making changes such as adding virtual hosts,
    you must restart httpd before your changes go into effect. To restart httpd, use
    the restart option by running /etc/rc.init.d/httpd restart or service httpd restart.


    # Virtual Hosts


    As discussed in the previous section, virtual hosts are configured in the httpd.conf
    file. Virtual hosts are all the entries for enabling different hosts to be hosted
    on the same machine. Originally, Web servers could typically host only a single
    domain on a single machine. Though other Web servers were developing methods to
    host multiple hosts on a single server, Apache was the first to develop a simple
    interface for hosting multiple domains on a single machine. The concept of hosting
    more than one host on a single machine is called virtual hosting.


    During the early development of virtual hosting, Apache required multiple IP addresses
    to be assigned to each host. Now Apache allows you to configure multiple hosts
    to share the same IP address. This means that two domains can be assigned the
    same IP address but have individual Web sites.


    # Configuring Virtual Hosts


    After you have Apache configured properly, there are eight steps you follow to
    configure your virtual hosts by editing the httpd.conf file:'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Standard Networking Services 245


    1. Set NameVirtualHost. The NameVirtualHost setting is required only when you''re
    setting up hosts with the same IP address. If you have individual IP addresses
    for each host, skip this step. The setting for NameVirtualHost can be name-based
    (www.example.com) or IP-based(192.168.0.1). Use this setting to tell httpd when
    there are multiple hosts under the specific name (www.domain.com) or IP address
    (192.168.0.1). VirtualHost entries under the NameVirtualHost directive are indexed
    by the ServerName setting. A request for an IP address or domain listed under
    the NameVirtualHost directive will be matched by ServerName and the appropriate
    DocumentRoot settings. For example, NameVirtualHost 192.168.0.1.


    2. Set VirtualHost. The setting for the VirtualHost can be name-based (www.example.com)
    or IP-based(192.168.0.1). Administrators typically prefer to use name-based settings.
    This method allows the administrator to change IP addresses for the host in DNS
    without changing the httpd.conf file. Make sure you have registered the domain
    and set up DNS to ensure that this works properly. For example, «VirtualHost www.example.com>.


    3. Set DocumentRoot. The setting for DocumentRoot points to the directory where
    the Web documents for the host can be found. This setting might point to a subdirectory
    for the host under a larger dedicated directory, such as /home/httpd/domain, or
    a dedicated subdirectory located under a user''s home directory, such as /home/user/domain,
    or anywhere you prefer. Within this dedicated directory, you should put any HTML
    or other Web files required for the Web site. Make sure the DocumentRoot directory,
    subdirectories, and files are all readable and executable (with permissions set
    to at least 755 for directories and 644 for files). For example, DocumentRoot/home/exampleadmin/example/.


    4. Set ServerName. The setting for ServerName is the name-based reference used
    by browsers to request your host''s Web site. For instance, if a user would enter
    http://www.example.com/ to access your Web site, your ServerName would be www.example.com.
    This option is especially important when IP addresses are being shared among hosts.
    For example, ServerName www.example.com.


    5. Set ErrorLog. The setting for ErrorLog specifies the directory and file in
    which httpd should store any errors for the specific host. By default, this setting
    is logs/error_log. For example, ErrorLog logs/error_log.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 246 Chapter 10


    +   6. Set TransferLog. The setting for TransferLog specifies the directory and
    file in which httpd should log all access information for the host. The default
    setting for the TransferLog is logs/access_log. For example, TransferLog logs/access_log.


    +   7. Close the VirtualHost entry. To specify the end of the particular virtual-host
    entry, you must close it by supplying the <VirtualHost> option as the last line
    of the virtual-host entry. For example, </VirtualHost>.


    +   8. Save and restart. Save the changes in the httpd.conf file, and restart
    httpd (not your system). To restart httpd, enter /etc/rc.d/init.d/httpd or restart
    service httpd restart.


    There are several other options available for customizing your individual virtualhost
    entries. Three specific options include the settings for Alias, Redirect, and
    ServerAlias


    +   Alias /sublocation /alternate_document_root — Using Alias setting allows you
    to set an alternative location file for a path below your host. For instance,
    if you want to have one DocumentRoot for www.example.com/example/, but have an
    entirely different path for www.example.com/, you can supply the Alias within
    the www.example.com virtual-host entry to point to another directory for its Web
    files. For example, Alias /example /home/example.


    +   Redirect /sublocation/other.new.location — Using the Redirect setting allows
    you to specify an alternative location for a subdirectory under the specific virtual-host
    entry. For instance, if you want www.example.com/somewhere to redirect to www.somewhere.org,
    you can add the Redirect option to the virtual-host entry for www.example.com.
    For example, Redirect /somewhere http://www.somewhere.org.


    +   ServerAlias *.example.com — Using the ServerAlias allows you to specify additional
    ServerNames that can be used to access the same Web data. For instance, you can
    set the ServerAlias setting in the www.example.com virtual-host entry to allow
    users to access not only http://www.example.com/ but also http://example.com/
    and http://web.example.com/. For example, ServerAlias example.com *example.com.


