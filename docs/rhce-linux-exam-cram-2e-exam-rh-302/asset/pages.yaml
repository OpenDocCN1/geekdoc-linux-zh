  md: 'When you''re establishing this route, you might want to set up host-name resolution.
    To do so, use the /etc/hosts file (If you don''t use DNS or NIS for address resolution,
    you must put all hosts in the /etc/hosts file.) The /etc/hosts file has three
    fields. The first is the IP address, the second contains the fully qualified domain
    name, and the third contains any aliases for the name. Table 4.5 shows a sample
    /etc/hosts file.


    # Configuring the Domain Name Service (DNS)


    To configure the use of the BIND name service for host lookups, you have to tell
    the resolver library which name servers to use. The file used to specify the name
    server is resolv.conf, as shown here:


    ```

    search example.net

    nameserver 0.0.0.0

    ```


    If the resolv.conf file is empty, the resolver assumes that the name server is
    on your local host.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_100_0.png)


    The search option specifies the local domain. Therefore, if the name server can''t
    find the name "sites," it looks for "sites.example.net," as specified in the /etc/hosts
    file just shown. The nameserver option specifies the IP address of the name server,
    which in this case is localhost, or 127.0.0.1.


    # Network Tools


    Some additional tools that are helpful when you''re working with networks and
