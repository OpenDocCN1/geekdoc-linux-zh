- img_proc: true
  md: '# Processor Type and Features


    The first question, regarding Processor Family, sets certain assumptions for the
    kernel. When the Processor Family option is set to 386, the kernel you compile
    should run on any86-compatible processor. Using any higher CPU family makes the
    kernel assume certain capabilities in the processor (which might have a large
    impact on performance on that type of CPU). Therefore, the resulting kernel won''t
    run on anything lower than the family you specify.


    The next three options allow you to set Intel Pentium/PII/PIIII options. Disabling
    the serial number at boot-up makes the kernel disable the CPU ID serial number
    that is embedded on the new PII CPUs. Enabling PII/PIIII Extended/Fast FPU (floating-point
    unit) save-and-restore is required to make the new PII 128-bit XMM registers.
    Enabling CPU-specific MMX/MMX2 optimization functions allows the use of the MMX
    registers and 128-bit MMX2 registers.


    The Math Emulation turns on the kernel software''s floating-point emulation. This
    is safe to turn on for CPUs with hardware floating-point units because the kernel
    detects the FPU at boot-up and disables emulation. Turning this option increases
    the size of the kernel, however, so it''s necessary only for 386, 486SX, and other
    CPUs without hardware floating-point units.


    The MTRR Support option can have a huge impact on performance. This option allows
    you to turn on write-combining for certain cards, such as video cards on the PCI
    or AGP bus. This option is available only on Pentium II (and higher) and K6-2
    (and higher) CPUs. It''s safe to turn this option on CPUs that don''t support
    it because it adds a small amount of additional code to the kernel.


    The Symmetric Multiprocessing Support option turns on SMP support in the kernel.
    This is also safe for uniprocessor systems. However, turning on this option might
    slow down systems slightly, and it adds a small amount of code to the kernel.


    The setting for Maximum Physical Memory allows you to set the RAM amount the kernel
    will recognize. By default the kernel sees a maximum of 1GB. The alternate option
    is 2GB.


    Note: New 2.4 kernels have support for 4GB on x86 platforms.


    # Loadable Module Support


    You are given the option to configure loadable module support—for modular kernels—during
    kernel configuration. The three options available under this heading are to enable
    loadable module support, to set version information on all symbols for modules,
    and to enable the kernel module loader. For'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'modular kernels, you must select Yes for Loadable Module Support and Kernel
    Module Loader. The Set Version Information choice is optional. The modular version
    setting is used to make modules usable after a kernel compilation without you
    having to recompile the module.


    # General Setup


    The general setup section of the kernel configuration options has about 29 options.
    The first option is to enable BIGMEM support. This is required if you want to
    use more than 1GB of memory. Two of the main options in this section are for networking
    and PCI support. If you set the Networking Support option to No, the configuration
    tool automatically disables all networking-related configuration options. If you
    want any networking connectivity, you should set this option to Yes.


    As with the Networking Support option, choosing No for the PCI support option
    disables all PCI-support-related configuration options. If your motherboard has
    PCI slots or PCI support, choose Yes for this option. Most 586 (and higher) processors
    and motherboards have PCI onboard. If your motherboard does not have PCI onboard,
    choose No.


    The remaining options in this section set system preferences. Other hardware support
    options and other system options are available here. Kernel support for specific
    types of binaries (as a out, java, and ELF binaries) is located here. In addition,
    specific hardware support, such as whether to support PC style or foreign hardware,
    is set here.


    Your power management support is also located in this set of options. If your
    BIOS can support Advanced Power Management (APM), you should select Yes here.
    The remaining APM options allow you to specify how APM manages CPU usage, shutdown
    options, suspend options, and more.


    # Plug and Play


    Most Intel computers use some sort of plug-and-play hardware. Therefore, the Plug
    and Play Support category, you can decide whether to support for plug-and-play
    hardware in your kernel. Most administrators answer Yes to this option. Also found
    in this category is support for parallel devices on your system. If any parallel
    devices will be used on your system, enable this option. It''s recommended to
    modularize this option so that the support is loaded only when needed.


    Note: With 2.2.x (and newer) kernels, Plug and Play Support is used only for parallel
    devices.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Block Devices


    The Block Devices section of kernel configuration is quite extensive and very
    specific. Within this section, you can specify floppy-disk, CD-ROM, tape, IDE,
    SCSI, and ATAPI device support. With the exception of IDE disk support, most of
    these options should be modularized to be loaded as needed.


    In addition to these media devices, PCI and IDE chipset support options are available.
    Here, you enable whichever chipset you have on your system and disable the rest.
    Best aside the chipset information, you can select device support, such as loopback,
    network block, multiple device driver, and ramdisk support. Loopback device support
    is typically modularized, whereas network block support and multiple-device-driver
    support are enabled only if needed. Ramdisk support is required by SCSIboot systems
    that need to use initial ramdisk (initrd) to boot. If you use SCSI hard drives,
    you should enable this option.


    The final options in this section include XT hard disk support and parallel-port
    IDE device support. If your system will access an XT hard disk, you should enable
    the support. If you think you might ever connect a parallel-port IDE device, such
    as a CD-ROM drive, tape drive, or other IDE device, it''s recommended to modularize
    this support.


    # Networking Options


    The Networking Options section contains all the configuration options for everything
    related to networking, including hardware, software, and protocols. The Packet
    Socket option turns on an interface that allows programs to communicate directly
    with network devices. Programs such as tcpdump, packet sniffers, and dhcpd (a
    DHCP client) use the interface to send and receive packets without going through
    the kernel TCP stack.


    The Kernel/User Netlink Socket option turns on support for communication between
    certain network-related parts of the kernel and user processes. This option is
    currently used by the kernel to publish routing messages (when CONFIG_RTNETLINK
    is on) and by arpd the ethertap device.


    The next two prompts are related to kernel firewalls. The first prompt for support
    for network firewalls. Selecting Yes turns on support for IP firewalling, masquerading,
    and so on. The second prompts for support for socket filtering. Selecting Yes
    enables support for user-space socket filters.


    The Unix Domain Socket option turns on support for Unix domain sockets, which
    are heavily used by many programs, such as syslog and X, even when a system is
    not connected to a network. You should enable this option except in embedded applications
    where you know that no communication over Unix sockets will occur.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Advanced Configuration 193


    Enabling support for the TCP/IP networking option includes support for TCP/IP
    networking, which many normal programs use heavily. Again, turn this option-on
    except in embedded applications where you know you will not TCP/IP.


    Several other TCP/IP-related configuration options appear appear in this section.
    The first option includes experimental support for the IPv6 networking protocol,
    which will soon replace the current TCP/IP protocol (IPv4) used over the Internet.
    If you want to test IPv6 on your network, turn on this driver.


    Within this section, you''re also prompted for support of other networking protocols,
    such as IPX and AppleTalk DDP. Enabling the IPX option turns support for the IPX
    protocol, which older versions of Novell''s NetWare OS use. Enabling the AppleTalk
    DDP option turns on support for the AppleTalk protocol, which MacOS networks use
    to share files and printers.


    Three experimental options are available to enable support for networking over
    amateur radio links: CCITT X.25 Packet Layer, LAPB Data Link Driver, and 802.2
    LLC. You can use X.25 over amateur radio, as well as serial links and Ethernet.
    LAPB is a link-level protocol that is used with the X.25 protocol. The 802.2 LLC
    choice is another option for a link-level protocol (over Ethernet) for X.25.


    The next options allow you to enable support for various network operations. The
    first option allows experimental support for bridging. Enabling this option allows
    the Linux kernel to act as an Ethernet bridge. The second option allows support
    for wide area network (WAN) routing. This new option allows you to configure support
    for WAN adapter cards, such as Sangoma frame relay cards. A third, new network
    operation option is for fast switching. This new option allows for direct NIC-to-NIC
    transfers. Be wary of this option, however, because is not compatible with several
    other network options (as kernel firewalling). Enable this option only if the
    system will be a dedicated router.


    A few options that manage network connectivity and flow are also available. One
    of the first options enabling forwarding between high-speed interfaces. This option
    turns on support for hardware throttling when the network is congested. The online
    help for this option if this sounds like something you need. Another option is
    new: support for CPUs you suspect are too slow to handle the full bandwidth of
    the network they are attached to. Most often, you don''t need to enable this option.


    # QoS and/or Fair Queuing


    QoS (Quality of Service) is used to manage the distribution of packets over a
    network device. If you want to use the default scheduling algorithm, do not enable
    the option. If you consider yourself an expert and you''d like to experiment with
    other schedulers, enable this option.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Telephony Support


    The options under Telephony Support enable or modularize functions used in telephony
    card equipment under Linux. The second option specifically enables support for
    Quicknet Technologies, Inc., cards.


    # SCSI Support


    The first option for SCSI support is simply to enable SCSI support, which turns
    on support for SCSI devices. If you turn this option on, you are given the opportunity
    to configure various driver options and configure support for various types of
    devices and interface cards. Unless you''re booting off a SCSI device, it''s safe
    to simply modularize this option in case you install a SCSI card or other SCSI
    device.


    # SCSI Low-Level Drivers


    Beneath the SCSI Low-Level Drivers configuration option, there are 90 options
    to enable support and customize settings for your SCSI support. Most of the options
    enable support for various SCSI chipsets, such as Adaptec AHA152X, Adaptec AIC7xxx,
    BusLogic SCSI, and NCR53c8xx. Other options allow you to configure reset delays,
    command queues, and more.


    # Network Device Support


    There are several options available in the Network Device Support section. The
    first option, to enable support for network devices, allows you to configure support
    for various network devices. If you enable this option, you are prompted for specific
    network device support. If you select No for this option, the following network
    device devices are automatically disabled.


    Another network device option is for dummy net driver support. Enabling this option
    allows you to include support for a "dummy" network interface. Traffic to this
    interface is simply discarded. This option is useful for keeping a permanent IP
    address associated with a system, even though its only "real" network interface
    is PPP or SLIP.


    A handy option located here is support for EQL (serial line load balancing). Enabling
    this option turns on support for load balancing over PPP or SLIP interfaces. You
    can use EQL to combine multiple lower-speed serial links into a single higher-speed
    network interface. Note that the other end of the link must also support this
    protocol.


    Another device that you can enable is support for FDDI (Fiber Distributed Data
    Interface) drivers. Turning this option allows you you to configure for'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'FDDI adapter cards. In addition to FDDI support, there is an option to enable
    frame relay DLCI support. Turning on this option allows you to configure support
    for frame relay adapter cards.


    The next three options—PLIP, PPP, and SLIP support—allow you to enable these types
    of network connections. Enabling PLIP support enables parallel connections. This
    option turns on support for the Parallel Internet Protocol, which works over specially
    modified parallel cables. Enabling PPP support enables point-to-point connections.
    This option turns on support for the PPP protocol, which is most used for networking
    over serial links like modems. Enabling SLIP support enables serial line connections.
    This option turns on support for SLIP, a protocol that predates PPP and that is
    used to work over serial links. PPP is a more robust protocol, so you generally
    won''t need SLIP support. Turning the SLIP option also allows you to configure
    various SLIP driver options.


    New options found here include options for wireless networking. Some options include
    AT&T WaveLAN technology, Aeron Arlan, and wireless LANs that aren''t ham radio.


    # ARCnet Devices


    The configuration options under ARCnet Device allow you to configure networks
    with ARCnet chipsets. ARCnet is an old networking system that somewhat resembles
    Ethernet and that is used primarily on PCs.


    # Ethernet (10 or 100Mbit)


    The most-needed option in this category is to enable Ethernet support. This option
    allows you to configure support for various Ethernet controllers. The most varieties
    you''ll find are 10Base-2 or Thinnet (10Mbps over coax cable), 10Base-T or twisted-pair
    (10Mbps over twisted-pair), 10Base-F (10Mbps over fiber-optic cable), 100Base-TX
    (100Mbps over two twisted-pair cables), 100Base-T4 (100Mbps over four standard
    twisted-pair cables), and 100Base-FX (100Mbps over fiber-optic cable). The 100Base
    Ethernets are also known as Fast Ethernet.


    # Ethernet (1000Mbit)


    1000Mbit Ethernet is also known as Gigabit Ethernet. This is 1Gbps over fiber
    optic cable or short copper links. The configuration options under Ethernet (1000Mbit)
    are to specifically support different varieties of Gigabit Ethernet cards.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# AppleTalk Devices


    AppleTalk is used when you need your Linux box to communicate in a Macintosh environment.
    The options within the AppleTalk Devices section configures sup-port for various
    firmware and encapsulation options.


    # Token Ring Devices


    Turning this option allows you to include support for a few token-ring-adapter
    cards in the kernel. Token ring is an old, slow, and expensive local-area-network
    system that IBM developed and heavily pushed several years ago. It''s still com-monly
    found in large IBM-centric organizations.


    # WAN Interfaces


    This category contains options for enabling support for WAN devices, such as serial
    boards and I/O adapters. Vendor-specific devices such as Comt, MultiGate, and
    Sealeave Systems are found here.


    # Amateur Radio Support


    One of the smaller category includes options in your kernel configuration for
    amateur radio support. Turning on this option allows you to configure support
    for networking over amateur radio. You should enable this option only if you plan
    to work with radio networking.


    # Infrared Support


    Another small category enables the new option of support for infrared devices.
    The main option in this category is to enable IrDA subsystems support. En-abling
    this option allows you to configure support for communication over cer-tain infrared
    interfaces. This category includes an option for networking between infrared interfaces.


    # Infrared-port Device Drivers


    This category contains a number of options for supporting various IrDA drivers,
    ports, and serial dongles. Specifically, you can select support for IrTTY using
    Linux serial drivers versus IrPORT using IrDA serial drivers. In addition, you
    can select various serial dongle types, such as ESI, ACTSYS, Greenwich, or Parallax.


    # ISDN Support


    You can select support for ISDN with the ISDN Support option. Enabling ISDN Support
    allows you to configure kernel support for ISDN adapter cards and for networking
    over ISDN.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Old CD-ROM Driver Support


    Some systems use CD-ROM drives other than SCSI or current IDE CD-ROM drives. Enabling
    this option allows you to configure support for CD-ROM drives that use old proprietary
    interfaces, such as those commonly found on sound cards. Typically, you don''t
    need to enable this support.


    # Character Devices


    Within the Character Devices category, there are approximately 12 configuration-options.
    One of the first options is to enable support for virtual terminal devices. This
    is the standard way of supporting the keyboard/mouse/monitor combination of a
    system in Linux. You should consider this a required option on all systems other
    than embedded devices.


    Another option allows the system console to be set to a virtual terminal. The
    system console is where kernel messages go logins are allowed in single-user mode.
    You should turn this on unless you''re sure you will always use another device,
    such as a serial port, for the system console.


    Another Character option is to enable support for standard, generic, dumb serial
    ports. Turning this option allows you to set a serial port as the system console.
    To enable console support on the dumb terminal, you must enable support for the
    console on the serial port. Some additional serial-support options include Extended
    Dumb Serial Driver and Non-standard Serial Port Support. Enabling the Extended
    Dumb Serial Driver option allows you to turn on certain options for the standard
    serial driver, such as support for IRQ-sharing. Enabling the Non-standard Serial
    Port Support option allows you to configure support for various intelligent serial
    boards.


    The next option in this category is to enable support for Unix98 PTY. Turning
    this option on includes kernel support for the /dev/pts/number naming scheme for
    pseudo-terminal devices mandated by the UNIX98 specification. This system is supported
    by the GNU C library version 2.1 and higher. It is used by default in Red Hat
    6.2 and higher.


    If you plan to connect a parallel printer to the system, you must enable parallel
    printer support. In addition, there is an option to enable printer read-back.
    It turns on support for status read-back from printers. When this option is turned
    on you get status information from the printer when you execute /dev/lp0 (or whatever
    the printer device is).


    Some older systems use an old-style QJC-02 tape drive. To enable support for this
    type of tape drive, you must turn on the QJC-02 Tape Support option.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Chapter 8


    Another option in this category is to enable watchdog timer support. Doing allows
    you to configure support for the watchdog device, which is used to monitor system
    health by triggering a reboot if the device isn''t written to in a certain period
    of time. The idea is that a process''s job is to occasionally write to this device,
    and that process fails, something bad must have happened to the system. The watchdog
    device can be driven entirely by software that might not be reliable if the system
    has crashed. The watchdog device can also be tied to special hardware-monitoring
    cards. Most administrators don''t use this software option.


    To be able to read and write to a PC''s CMOS, you must enable /dev/nvram support.
    This option turns for reading and writing a system''s volatile RAM (NVRAM) area.
    On PCs, this is usually called the CMOS. This can be used, for example, to store
    a small amount of information that will persist over reboots. Doing so can be
    very dangerous, though, because overwriting the NVRAM on a system will probably
    make it unbootable. Most administrators don''t enable this option.


    The last option in this category is for enhanced real-time clock support. This
    option turns on extended support for the real-time clock chip on most systems.
    This is generally handy to have available, and it is required for synchronization
    on SMP systems.


    # Mice


    Special input devices, such as special mouse types, require different support
    within the kernel. In the Mice category, you can enable support for ATIXL bus
    mouse, Logitech bus mouse, Microsoft bus mouse, and even digitizer pads. Also,
    if you plan to use a PS/2 mouse instead of a serial mouse, you must enable the
    PS/2 mouse support here.


    # Joysticks


    With gaming becoming more popular on the Linux platform, more specialized joysticks
    are being supported. Enabling joystick support allows you to select support for
    specific joysticks, such as those made by Gravis, Logitech, Microsoft, and Creative
    Labs.


    # Watchdog Cards


    A popular monitoring system for Linux is Watchdog. Within the Watchdog Cards category,
    you can enable various features such as shutdown options, timer options, and WDT501
    features.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Video for Linux


    The category of Video for Linux is a bit misleading. This category is not for
    video display support, such as X support, but is for additional video option support.
    Enabling support for Video for Linux allows you to configure support options for
    various video-capture cards, TV tuner cards, and FM radio cards.


    # Ftape Support


    Ftape is the floppy-tape device. Enabling the Ftape (QIC-80/Travan) Support option
    allows you to configure kernel support for various tape drives that use the standard
    PC floppy-disk interface.


    # Filesystem Support


    The Filesystem Support category for kernel configuration currently contains options
    for about 14 filesystem types. One of the first options is Quota Support. Enabling
    this option turns on support for user and group quotas (usage limits) on filesystems.


    Another option is for kernel automounter support. This option turns on kernel
    support for a daemon that can be used to automatically mount local and remote
    filesystems. This option can be extremely convenient, especially on desktop systems.


    One of the first options for types of filesystems is the experimental support
    option for the read-only ADFS filesystem. There are also options for supporting
    the Amiga FFS filesystem and the experimental Apple Macintosh filesystem. These
    options allow you to configure support for the native filesystems used by Acorn''s
    RiscOS, AmigaOS, and macOS, respectively.


    To read DOS- and Windows-style filesystems from Linux, you must have support for
    these filesystems. Enabling the DOS FAT fs support option allows you to configure
    support for DOS- and Windows-style FAT filesystems.


    The standard filesystem used on CD-ROMs is the ISO9660 filesystem. To enable support
    for these filesystems, you must select Yes for the ISO 9660 CD-ROM filesystem
    support option.


    Some additional options for supporting foreign filesystems include support for
    the Minix fs, the read-only NTFS filesystem, and the read-only OS/2 HPFS filesystem.
    These options turn on support for the native filesystems of Minix (which was also
    once the native Linux filesystem), Windows NT, and OS/2, respectively.'
  merge: -1
  pgno: 230
- img_proc: true
  md: "# Chapter 8\n\n /proc filesystem support options turn on support for the /proc\
    \ filesystem.\nan option that comes after this—/dev/pts filesystem for Unix98\
