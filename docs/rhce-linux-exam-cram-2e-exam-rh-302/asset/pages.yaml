  md: '# Chapter 7


    To create a kickstart boot floppy, you first need to create the boot floppy with
    the appropriate boot image. When you use a CD-ROM, you create the boot image with
    the boot.img file. For network installations, you use the bootnet.img files. To
    create the boot disk, use the dd command on Linux (as described in Chapter 5),
    you must create your kickstart configuration file, named ks.cfg, by running mkkickstart
    on the machine prototype that you want to clone. Write the output of mkkickstart
    to the file ks.cfg by typing mkkickstart>ks.cfg. Make any changes you want to
    the configuration file, and then copy the ks.cfg file to your boot floppy.


    # Question 4


    +   What are the %post entries in the ks.cfg file used for?

    a. Logging entries

    b. Scripts run during installation

    c. Configuration options

    d. None of the above


    Answer is d is correct. The %post entries are scripts or commands that are run
    after the installation. Although these scripts might indicate some logging, or
    configuration options, they can be set up only with the scripts that are run there.


    # Question 5


    How do you force kickstart to prompt you for information during an installation?
    Why would you want to do this?


    To force kickstart to prompt you for an answer or setting during installation,
    simply do not provide the setting in the ks.cfg file. Doing this is helpful if
    you want to specify IP addresses without using a DHCP server or if peripherals
    such as video or mouse differ on various machines.'
