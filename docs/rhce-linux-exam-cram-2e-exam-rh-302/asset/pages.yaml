- img_proc: true
  md: '![](img/fe9012f0d9b0102febe0e70f330ee448_148_0.png)


    Watch for your LILO prompt. If you don''t get any part of the LILO prompt, LILO
    didn''t load. If you get an L, the first-stage bootloader is loaded and started.
    If you get LI, the second-stage bootloader is loaded. If you get LI, the second-stage
    bootloader is started. If you get LIL?, the second-stage bootloader was loaded
    at an incorrect address. If you get LIL-, the descriptor table is corrupt. If
    you get LILO, all of LILO has been loaded correctly.


    When you''re comfortable with your current Linux installation, you must check
    for errata. Errata lists contain updates, bug fixes, and more for your fresh Linux
    installation. For Red Hat''s errata list, visit www.redhat.com/support/errata/.
    You should download and install all necessary update packages. These packages
    can be downloaded from ftp.updates.redat.com or a mirror site.'
