    field isn''t set, the field has an asterisk. The first field indicates which minute
    of the hour the script should run. Valid settings for this field are 0 (or 00)
    through 59. If the five fields read 22****, the script runs on the twenty-second
    minute of every hour.


    The second field specifies the hour of the day. Valid settings for this field
    are 0 through 23. If the five fields read 00 12***, the script runs every twelfth
    hour at the zero minute of every day.


    The third field indicates the day of month. Valid settings for this field are
    0 through 31. If the five fields read 0 0 1**,, the script runs the first day
    of every month at the zero hour and zero minute.


    The fourth field specifies the month of the year. Valid settings for this field
    are 1 through 12. In addition, you can use names of month (such as jan, feb, mar,
    and so on). If the five fields read 0 0 1 3*, the job runs the first day of the
    third month of every year at the zero hour and zero minute.


    The final script specifies the day of the week. Valid settings for this field
    are 0 through 7, where both 0 and 7 are Sunday. In addition, you can specify the
    day''s name (such as sun, mon, tue, and so on). If the five fields read 0 12***
    5, the job runs every Friday of every month at the zero minute of the twelfth
    hour.


    Each of the time fields also allows you to specify ranges and multiple run times.
    Using a dash (-) to specify two options in a field specifies that the script should
    run within the valid range. Using a comma to separate two options in a field specifies
    that the script should run at both times. For instance,


    ```

    30 12 1,15 2,4,6,8,10,12 * /usr/sbin/rm -rf /home/user/tmp/*

    ```


    removes all files under the tmp directory in the user home directory at 12:30
    P.M. on the first and fifteenth days of every month, starting in February and
    including April, June, August, October, and December. On the other hand,


    ```

    30 12 1-5-9 * /usr/sbin/rm -rf /home/user/tmp/

    ```


    removes all the directories in the user''s tmp directory at 12:30 P.M. every day
    between the first and fifteenth of every month between March and September. If
    you tossed a 5 in the fifth directory, the job would run every Friday as well,
    even outside the March-through-September range or the first-through-fifteenth
    range.


