    # IP Routing


    IP routing is the process of a packet finding the appropriate host by traveling
    through a sequence of hosts from an original host to a destination host. Three
    of the protocols used in IP routing are:


    +   * Address Resolution Protocol (ARP)—Used to map IP addresses to Ethernet addresses


    +   * Reverse Address Resolution Protocol (RARP)—Used to permit hosts to find
    out their IP addresses at boot-time


    +   * Routing Information Protocol (RIP)—Used to dynamically adjust routes inside
    a small network'
