  md: '| Package Group | Description |

    | --- | --- |

    | Printer Support | installs printer support to a local or network printer |

    | X Window System | installs support for a graphical user interface |

    | GNOME | installs tools within the X Window System |

    | KDE | installs the X Window environment KDE |

    | Mail/WWW/News Tools | Enables your machine to manage and use mail and Internet
    services |

    | DOS/Windows Connectivity | Allows connections to and from DOS and Windows clients
    |

    | Graphics Manipulation | installs packages to read, create, and alter graphics
    files |

    | Games | installs games for entertainment |

    | Multimedia Support | installs packages that allow multimedia use |

    | Networked Workstation | Enables the machine to communicate with other machines
    on a network |

    | Dial-Up Workstation | Enables the machine to communicate with other machines
    via a modem |

    | News Server | Sets up the machine to be used as a news server |

    | NFS Server | Allows the machine to serve as a network file server |

    | SMB (Samba) Connectivity | Enables the machine to communicate with Windows clients
    |

    | IPX/NetWare Connectivity | installs the capability to communicate with or as
    NetWare clients |

    | Anonymous FTP Server | installs the packages necessary to allow anonymous file
    transfer service |

    | Web Server | installs packages necessary to provide HTTP and Web service |

