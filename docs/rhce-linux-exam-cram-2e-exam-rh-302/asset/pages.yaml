  md: '# 2 Chapter 1


    Exam taking is not something most people anticipate eagerly, no matter how well
    prepared they might be. In most cases, familiarity helps ameliorate anxiety. In
    plain English, this means you probably won''t be as nervous when you take your
    fourth or fifth Red Hat certification exam as you''ll your first one. Granted,
    every certification exam—whether it''s a Red Hat exam, a Caldera exam, or another
    certification program—will be different, but the preparation process will be similar
    and you''ll become more comfortable with each experience.


    Whether it''s your first year or tenth, understanding the details of exam taking
    (how much time to spend on questions, the environment you''ll be in, and so on)
    and understanding the exam software will help you concentrate on the material
    rather than on the setting. Likewise, mastering a few basic exam-taking skills
    will help you recognize—and perhaps even outfox—some of the tricks and gotchas
    you''re bound to find in some of the exam questions.


    This chapter, besides explaining the exam environment and software, describes
    some proven exam-taking strategies you should be able to use to your advantage.


    # Assessing Exam-Readiness


    Before you take your Red Hat exam, I strongly recommend that you complete the
    Self-Assessment included with this book (it appears just before this chapter,
    in fact). This assessment will help you compare your knowledge base to the requirements
    for obtaining an RHCE, and it will help you identify parts of your background
    or experience that might need improvement, enhancement, or further. If you get
    the right set of basics under your belt, obtaining Red Hat certification will
    be that much easier.


    Once you''ve gone through the Self-Assessment, you can study those topics where
    your background or experience might not measure up to an ideal certification candidate.
    You can also tackle subject matter for individual tests at the same time, so you
    can continue making progress while you''re catching up in some areas.


    Once you''ve worked through an Exam Cram, read the supplementary materials, completed
    the chapter tasks, and taken the practice test, you''ll have a pretty clear idea
    of when you should be ready to take the real exam. I strongly recommend that you
    keep practicing until you scores the 80 percent mark; 85 percent would be a good
    goal to give yourself some margin for error in a real situation (where stress
    will play more of a role than it does when you practice). Once you hit that point,
    you should be ready to go. But if you get through the practice exam in this book
    without attaining that score, you should keep taking practice tests and studying
    the materials until you get there. You''ll find more information about how to
    study and prepare in the Self-Assessment section of this book, along with even
    more pointers on how to study and prepare. But now, on to the'
  merge: -1
