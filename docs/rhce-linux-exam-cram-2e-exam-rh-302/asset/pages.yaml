- img_proc: true
  md: 'Red Hat Advanced Prerequisites


    # # Routes


    Routes are specific paths set up for packet information to travel from the source
    to its destination. Three types of routes are static, dynamic, and default routes.


    Static routes are used for small- to medium-sized networks. These networks tend
    to be very simple because they do not have redundant paths to destinations. Static
    routes are established by issuing route commands at boot-time.


    Dynamic routes differ from static routes; with dynamic routes, the optimal path
    to destinations is determined as requested and then updated as necessary. Dynamic
    routing is typically used by either the routed daemon or the gated daemon.


    Default routes are established between your immediate host and its host, between
    your host''s host and its host, and so on. For instance, if a packet''s destination
    is 10.248.89.7, and the internal router''s routing-table entries include 192.168.0.1
    and 10.168.1.0, then the packet is sent to the default route (typically 0.0.0.0).
    The default route is assigned a gateway, which redirects the packet to the router''s
    host. If the host''s router doesn''t have the 10.248.89.x routing-table entry,
    the packet is forwarded to the host''s host, and so on. Each of these exchanges
    is called a hop. After 30 hops, if the packet hasn''t reached its destination,
    it dies. This scenario is called a ttl-ceeded.


    # # Networking Services


    After working with networks for an extended period of time, you''ll become familiar
    with a variety of networking services. Some of these popular services include
    Network File System (NFS), sendmail, POP3 and Internet Message Access Protocol
    (IMAP), File Transfer Protocol (FTP), Domain Name Service (DNS), Dynamic Host
    Control Protocol (DHCP), Samba, the Hypertext Transport Protocol Daemon (httpd),
    Network Information Service (NIS), and inetd.


    # # NFS


    The Network File System (NFS) service allows filesystems that physically reside
    on one computer system to be used by other computers on the network. These connections
    appear as local disks to remote users. NFS configuration files can be found in
    /etc/fstab and /etc/exports. NFS uses several daemons to handle its services.
    These services are started at boot-time in the /etc/rc.init.d/nfs scripts.


    Some of these services include:


    +   - nfsd—Handles filesystem exporting and file-access requests from remote systems.
    This daemon runs multiple times as more remote systems use the services.'
  merge: -1
