    # Using Graphical RPM Tools


    RPM offers two graphical administration tools: Gnome-RPM (also called GnoRPM),
    which is a GUI tool that replaces glint as the package-management tool; and Kpackage,
    which is similar to GnoRPM but uses the QT/KDE toolkit.


    To invoke either GnoRPM or Kpackage, type gnorpm or kpackage, respectively, from
    the root prompt. When Gnome is running, you''re presented with a browser-style
    window (shown in Figure 6.4). In the left window is a directory tree available
    for packages. The packages are split among several directories, such as Amusements,
    Applications, and Development. The right window lists the files in that directory.
    Some of the buttons on top are Install, Upgrade, Uninstall, and Query, they are
    all available with the manual RPM tools. When Kpackage is running, you''re presented
    with nearly the same layout and the same functionality. See Figure 6.5.


    # Building RPMs


    RPM would not be nearly effective as you could not build your own RPM packages.
    Using the -b option (for build) with rpm allows you to build your own package.
    In addition to the -b option, you can use the -t option (for tar files) to look
    inside tar files for the spec file to use.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_170_0.png)


    Figure 6.4 The GnoRPM tool.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Chapter 6


    ![](img/fe9012f0d9b0102febe0e70f330ee448_171_0.png)


    Figure 6.5 The Kpackage tool.


    After specifying the first argument, you must specify the stage of building and
    packaging that is to be done. Here are some options and what they do:


    +   - bp—Executes the "%prep" stage from the spec file. This stage typically unpacks
    the source and applies any needed patches.


    +   - bl—Tells RPM to do a list check. The "%files" section from the spec file
    is macro expanded, and RPM checks to make sure the files exist.


    +   - bc—Tells RPM to do the "%build" stage from the spec file, following the
    prep stage. Essentially, it''s the equivalent of a "make install."


    +   - bb—Has RPM build a binary package. This build is done after the prep, build,
    and install stages.


    +   - ba—Builds both binary and source packages. This option is also used after
    the prep, build, and install stages.


    After changing RPM files, including patches and updates, you may opt to rebuild
    the RPM file to include the new changes. There are two ways to use RPM in this
    manner: you can use the --recompile option or the --rebuild option. When you run
    RPM with either option, RPM installs the named source package and then automatically
    does a prep, compile, and install. In addition, the --rebuild option builds a
    new binary package. After the build has been completed, the build directory is
    automatically removed (by using --clean), and the source and spec files for the
    package are removed.'
