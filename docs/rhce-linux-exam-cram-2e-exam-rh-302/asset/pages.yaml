  md: '# System Security and Administration 283


    protocols: files

    prpc: files

    services: files


    netgroup: nisplus


    publickey: nisplus


    automount: files nisplus

    alias: files nisplus


    The format of the preceding nswitch file uses the layout, database: location [result-action],
    where database is the name of the requested database, location is the location
    of the database, result is the requested result, and action is the action that
    occurs if the result is matched. Therefore, in the stock Red Hat 6.2 nswitch.conf
    file, passwd lookups with the getpw* C library calls will first go to the local
    password file, and if the passwd are not located, will next try NIS+, and if they
    are still not located, will finally try NIS if it''s configured.


    Tables 11.1 through 11.3 list the databases, locations, and results that the GNU
    C library can recognize.


    > Note: The action for any result will always be either RETURN or CONTINUE.


    | Table 11.1 NIS databases. |

    | Database | Description |

    | aliases | Mail aliases that are used by sendmail |

    | ethers | Ethernet numbers |

    | group | User groups used by getgrp() functions |

    | hosts | Host names and numbers; used by gethostbyname() and similar functions
    |

    | netgroup | Network-wide list of hosts and users; used for access rules |

    | network | Network names and numbers; used by getnent() |

    | passwd | User passwords; used by getpwent() functions |

    | protocols | Network protocols; used by getprotent() functions |

    | publickey | Public and secret keys for secure_rpc; used by NIS+ and NFS |

    | rpc | Remote-call names and numbers; used by getprcbypname() and similar functions
    |

    | services | Network services; used by getservent() functions |

    | shadow | Shadow user passwords; used by getspnam() functions |'
