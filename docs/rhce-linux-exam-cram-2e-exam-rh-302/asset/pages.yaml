    # fdisk


    The traditional Linux partitioning tool is fdisk. It''s available both during
    and after installation. After installation, you can use fdisk when repartitioning
    drives, adding drives, and so on. It is a text-based tool and is not considered
    very user-friendly.


    Note: You should be familiar with disk partitioning before using fdisk.


    If you select Use fdisk with the graphical interface, you''ll execute fdisk in
    a window exactly as you would with the text interface or after installation. See
    Figure 5.11. When you edit partitions, you see the Partition Disks dialog box
    (text interface method shown in Figure 5.12), which lists every disk on your computer.


    To edit a specific disk, highlight the disk you''d like to partition and then
    select Edit. Next, you enter fdisk and can partition the disk you selected. (You
    can repeat this process for each disk you want to partition.) When you''re finished,
    select Done.


    After selecting a drive, you are dropped into a command-line program to edit the
    selected drive. At the "Command (m for help):" prompt, type m and press Enter.
    Doing so gives you a list of all available commands (as discussed in Chapter 3).'
