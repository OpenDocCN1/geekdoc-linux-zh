  md: 'Choosing the interfaces button lists all current interfaces installed on your
    machine. Some typical interfaces include lo (for local host), eth0 (for Ethernet),
    and ppp0 (for PPP) connections. From this screen, you can add, edit, copy, alias,
    delete, and turn on and off different interfaces. When you add an interface, you''re
    given the option of PPP (Point-to-Point Protocol), SLIP (Serial Line Internet
    Protocol), PLIP (Parallel Line Internet Protocol), Ethernet, ARCNet, Token Ring,
    or pocket ATP. Depending on the type, you''re asked to provide options such as
