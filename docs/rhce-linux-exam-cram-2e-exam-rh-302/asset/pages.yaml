    | Table 11.2 NIS locations. |

    | Location | Location Description |

    | --- | --- |

    | nisplus (nis+) | Lookup via NIS+ |

    | nis (yp) | Lookup via NIS |

    | compat | Lookup via NIS manner compatible with older versions of glibc |

    | db | Lookup via local database files |

    | files | Lookup via local text files |

    | dns | Lookup via DNS |


    | Table 11.3 NIS results. |

    | Result | Description | Default Action |

    | --- | --- | --- |

    | SUCCESS | The error occurred, and the entry was returned. | RETURN |

    | NOTFOUND | The lookup process works OK, but the needed value was not found.
    | CONTINUE |

    | UNAVAIL | The service is permanently unavailable. This can mean that the needed
    file is not available, or for DNS, that the server is not available or does not
    allow queries. | CONTINUE |

    | TRYAIN | The service is temporarily unavailable. This can mean that a file is
    locked or that a server cannot accept any more connections. | CONTINUE |


    # Lightweight Directory Access Protocol (LDAP)


    LDAP is an open standard protocol for accessing directory information services.
    The LDAP protocol runs over TCP protocols and other Internet transport protocols.
    LDAP can be used to access either standalone directory services or X.500 directories.


    Combined with SSL (Secure Sockets Layer), LDAP is intended to be an alternative
    directory service for NIS. Many of SSL''s features include encryption support
    and the ability to access control lists.


    LDAP directory service is based on a client/server model, quite similar to NIS.
    One or more LDAP servers contain the data used to make the LDAP directory tree
    or back-end database. An LDAP client connects to the LDAP server to make a request.
    The server responds to the request with either an answer or a'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# System Security and Administration 285


    pointer to where the client can get an answer to its request. One of the biggest
    advantages of LDAP over NIS is that with LDAP, server synchronization occurs in
    increments, data is pushed immediately to slave servers, whereas NIS syn-chonizes
    its data transfers periodically.


    # OpenLDAP


    The OpenLDAP project is a collaborative effort to provide an open-source LDAP
    suite of applications and tools. Like Netscape Communications'' Directory Server,
    OpenLDAP also bases its project on the original University of Michigan LDAP server
    project.


    The OpenLDAP package uses the server daemon slapd. The slapd server runs in a
    standalone environment. The OpenLDAP X.500 gateway is called ldapd. The OpenLDAP
    replication server is called slurpd. The configuration file used to set up LDAP
    client behavior is /etc/openldap/ldap.conf.


    OpenLDAP can be installed from the openldap-1.2.9-5.i386.rpm off your Red Hat
    6.2 CD, or downloaded from OpenLDAP''s Web site at http://www.ldap.org.


    # Pluggable Authentication Modules (PAM)


    PAM is the Pluggable Authentication Modules system that enables ruleset implementation
    without having to recode individual services. All security-conscious programs
    (such as login, su, and ftp) are configured by PAM to manage a variety of authentication
    and security checks.


    When a service such as login is used, PAM checks its configuration files to determine
    how to authenticate the user. For instance, PAM might authenticate by checking
    /etc/passwd, kerberos, or NIS. After the method of authentication is determined,
    PAM returns an answer to the service to indicate whether the user was authenticated.


    # PAM Configuration


    All PAM configuration files are located in /etc/pam.d/. Every application or service
    that can use PAM has a file entry in entries that can be found in /etc/pam.d/
    include chhn, chsh, halt, linux, login, passwd, ppp, reboot, rexec, rlogin, rsh,
    shutdown, su, xdm, and xscreensaver. If they''re installed, you might find entries
    for kde, samba, and ssh here as well. Looking at these files, you will see four
    columns of information.'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'They include module-type, control-flag, module-path, and arguments. Take a

    look at the following example of the login entry in /etc/pam.d/


    ```

    #%PAM-1.0

    auth      required      /lib/security/pam_security.so

    auth      required      /lib/security/pam_pwdb.so  shadow nullock

    auth      required      /lib/security/pam_login.so

    account   required      /lib/security/pam_pwdb.so

    password required      /lib/security/pam_cracklib.so

    password required      /lib/security/pam_pwdb.so nullock use_authtok

    session required      /lib/security/pam_pwdb.so

    session   optional    /lib/security/pam_console.so

    ```


    # module-type


    The module-type column in your PAM configuration files contains four types of

    modules. These include auth, account, session, and password.


    +   - auth—This module provides two ways of authenticating the user. First,

    it establishes that the user is indeed who the user claims to be. It does this
    by

    instructing the application to prompt the user for a password. The module

    can then grant group membership (independent of /etc/groups) or other priv-

    leges its credential granting properties.

    - account—This module performs non-authentication-based account manage-

    ment. This module is typically used to restrict or permit access to a service

    based on the time of day, the maximum number of users, or even the location

    of the user (for instance, allowing user “root” to log in from only the console).

    - session—This module performs duties that need to be done for the user be-

    fore they be given service. Services that are affected by this module in-

    clude the logging of information about a user opening and closing data,

    mouring directories, and so on.

    - password—This module is required for updating the authentication token

    associated with each user. There is typically one module for each challenge-

    or response-based authentication (auth) module-type.


    # control-flag


    The control-flag is used to indicate how the PAM library will react to the success

    or failure of the module with which it is associated. The four flags that are
    used to

    sify the module actions are required, requisite, sufficient, and optional, de-

    scribed here:'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'required—Indicates that the success of the module is required for the module-type
    facility to succeed. If this module fails, the failure will not be apparent to
    the user until all modules of the same module-type have been executed.


    requisite—Similar to **required**, but if this module fails, control is immediately
    returned to the application. This flag is useful to protect against the possibility
    of a user being allowed to enter a password over an unsafe medium.


    sufficient—Indicates that the Linux-PAM is satisfied that this module-type has
    succeeded in its purpose. If no previous module has failed, no more stacked modules
    of this type are invoked. If this module fails, the result is not deemed fatal
    to the application.


    optional—Marks the module as not being critical to the success or failure of the
    user''s application. In fact, Linux-PAM will ignore such a module when determining
    the module stack succeeds or fails.


    # module-path and Arguments


    **The module-path** is the name to the dynamically loadable module. The default
    path to the module is set to `/lib/security/` unless another path is mentioned.
    Typically, the full path `/lib/security/` is listed regardless.


    **The argument** column of each entry lists arguments that are passed to the module
    when it is invoked. Typically, these arguments are optional and listed specifically
    to each module. If an argument is invalid, the module ignores it. If such an error
    is made, the module is required to write the error to syslog, the system log daemon.
    The five generic arguments that are often used and understood by most modules
    are `debug`, `no_warn`, `use_first_pass`, `try_first_pass`, and `use_mapped_pass`,
    described here:


    +   debug—Use the syslog log to logging debugging information to the system log
    files.


    +   no_warn—Instructs the module to not give warning messages to the application.


    +   use_first_pass—The module should not prompt the user for a password. Instead,
    the module should obtain the previously typed password from the preceding auth
    module. If that does not work, the user will not be authenticated.


    +   try_first_pass—The module should attempt authentication with the previously
    typed password from the preceding auth module. If that does not work, the user
    is prompted for a password.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Chapter 11


    use_mapped_pass—Instructs the module to take the clear text authentication token
    entered by a previous module and use it to generate an encrypted (or decrypted)
    key to safely store or retrieve the authentication token required for the module.


    The use_mapped_pass argument is not currently supported by any of the modules
    in the Linux-PAM distribution because of possible consequences associated with
    US encryption restrictions. Developers within the United States (or their own
    countries) can implement it freely within their countries.


    Note: A special argument listed in the example for auth was shadow. This refers
    to support shadow passwords, a feature that is supported by pam_pwud.so. Shadow
    passwords utilize several methods to increase system security. Shadow passwords
    make it more difficult to extract system password information from system password
    files, by replacing the password field of /etc/passwd (with an "x") and creating
    the file /etc/shadow to contain the password hash.


    Red Hat 6.2 can be set to use shadow passwords during installation. If shadow
    passwords were not enabled during installation, you can convert the system to
    use shadow passwords by running the pwconv program. If necessary, you can convert
    it back to regular passwords by using pwconv. The change should be transparent
    to all programs that use PAM.


    # /etc/securitytty


    The /etc/security file is used by login to determine which tty devices root log
    in. Typically, only the local consoles are listed. By limiting access to only
    local consoles, you disable direct login superuser privileges from anywhere except
    the console. This is not fail-safe, however, because disabling virtual terminal
    login does not restrict the user from using su to log in as root from the user
    account. Also, some programs such as SSH and xdm can be configured to allow root
    logins over the network regardless of security-file settings. The output of /etc/security
    file is very simple because it lists only the tty devices that allow root logins.
    Figure 11.1 shows a sample output of a default Red Hat 6.2 /etc/security file.


    # inetd


    The daemon inetd is the Internet "superserver" daemon that controls most of the
    network services that listen for incoming connections on your machine. The inetd'
  merge: -1
  pgno: 319
- img_proc: true
  md: '![](img/fe9012f0d9b0102febe0e70f330ee448_320_0.png)


    **Figure 11.1** A default Red Hat 6.2 /etc/secuerty file.


    daemon runs in the background, binding all relevant ports and calling the appropriate
    servers when necessary.


    The /etc/inetd.conf configuration file controls the **inetd** daemon. This inetd.conf
    file specifies which services **inetd** manages, and contains a list of entries
    composed of seven fields. The seven fields are as follows:


    +   **Service Name**—The service name is translated to a port number by looking
    up the service name in the /etc/secuerty file.


    +   **Socket Type**—This specifies either the stream for TCP or the dgram for
    UDP.


    +   **Protocol**—This specifies the name of the transport protocol used by the
    service.


    +   **wait/nowait**—This specifies the **wait** or **nowait** option for dgram
    sockets (it does not affect stream sockets).


    +   **User**—Login ID of the user under whom the process will execute.


    +   **Server Program**—Full path name to the server program to be executed.


    +   **Arguments**—Command and arguments to be passed to the server.


    When a connection is requested from another machine over a network, the request
    is initially handled by **inetd**. The **inetd** daemon looks up the service by
    its port number in /etc/services/. It then starts the appropriate server listed
    in the /etc/inetd.conf file to connect with the incoming request.'
  merge: -1
