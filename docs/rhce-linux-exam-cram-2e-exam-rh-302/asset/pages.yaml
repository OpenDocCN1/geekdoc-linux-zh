    +   # run-parts

    01 * * * root run-parts /etc/cron.hourly

    02 4 * * root run-parts /etc/cron.daily

    22 4 * * root run-parts /etc/cron.weekly

    42 4 1 * root run-parts /etc/cron.monthly


    With the default crontab setup, the crontab points to a directory in each line.
    When each line runs, every script in the directory is run. For instance, the first
    entry runs every script in /etc/cron.hourly at the first minute of every hour,
    and the second entry runs every script in /etc/cron.daily every day at 4:02 A.M.
    The third entry runs every script in /etc/cron.weekly every Sunday at 4:22 A.M.,
    and the fourth entry runs every script in /etc/cron.monthly the first day of each
    month at 4:42 A.M.


