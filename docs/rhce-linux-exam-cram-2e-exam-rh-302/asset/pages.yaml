  md: '# Chapter 6


    The development of Red Hat 6.2 saw a large increase in the number of services
    and programs you could install and configure automatically during the installation
    process. With Linux, with most operating systems, you still have some configuration
    to do after your installation. To be a successful RHCE, you must know how to configure
    packages, programs, and peripherals that aren''t installed during installation,
    and you must be able to perform system administration tasks.


    # System Configuration Tools


    One of the most common myths about using Linux is that it''s hard to configure
    and customize a system after the initial installation. Although this statement
    was true in the early years of Linux, you no longer have to configure, install,
    or upgrade system components by hand. Today, Red Hat includes several tools that
    make the configuration of your Linux system much simpler. Two of these tools are
    linuxconf and Red Hat''s control-panel. In addition to these configuration management
    tools, you can run many configuration programs manually, such as authconfig, kbdconfig,
    mouseconfig, setup, and timeconfig. Red Hat 6.1 also introduced a tool called
    kudzu to help detect and configure new hardware added to the system after the
    initial installation.


    # Using linuxconf


    This popular tool allows you to configure and control many parts of your system.
    In addition, linuxconf can manage a wide range of programs and tasks, such as
    adding new users (described here) and getting connected to a network (discussed
    later in this chapter).


    To run linuxconf, you must be the superuser, also known as root, on your system.
    At the root prompt, type linuxconf to invoke the program linuxconf, which is located
    in the /bin directory.


    The linuxconf program offers you four types of interfaces. You can use the command-line
    mode to configure your system using scripts. You can use the character-cell mode,
    which, like the Red Hat installation program, allows you to use an easy-to-follow
    graphical user interface without the use of X. You can also use an X-Window-based
    mode, which uses a point-and-click tree interface. The last interface is a Web
    interface, which uses all the advantages of the Web for remote administration
    tasks. It even works well with text-based browsers, such as lynx. By default,
    linuxconf runs in either character-cell or X Window mode.'
  merge: -1
  pgno: 155
