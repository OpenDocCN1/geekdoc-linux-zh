    **Figure 5.20** Account Configuration (graphical interface).


    # Authentication Configuration


    Red Hat Linux has two features that make passwords more secure: the implementation
    of MD5 passwords and shadow passwords. If you''re going to be doing administration
    over a network with NIS, you can enable the use of NIS during this phase as well.
    It is always recommended that you enable both MD5 and shadow passwords unless
    you are using NIS.


    Enabling MD5 passwords allows you to use a long password (up to 256 characters)
    as opposed to the standard 8 characters. Enabling shadow passwords helps protect
    your password files by storing them in a file, /etc/shadow, that is read-only
    as root.


    The graphical and text interfaces have the same options for authentication configuration.
    With both, you have three options: enable MD5 passwords, enable shadow passwords,
    and enable NIS.


    # Package Group Selection


    During the Custom configuration installation, you are first given the option to
    select package groups to install. You can choose from among 26 groups, listed
    and described in Table 5.2, in addition to simply installing everything. The difference
    between the graphical and text interfaces at this stage is limited only to appearance,
    as shown in Figures 5.21 and 5.22.'
