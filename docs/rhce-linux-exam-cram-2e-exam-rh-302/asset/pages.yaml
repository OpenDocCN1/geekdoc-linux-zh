  md: '# Question 6


    +   Why do you need to rerun LILO after editing lilo.conf?

    - a. To rerun configuration settings and apply them to the appropriate LILO files,
    such as /boot/map

    - b. To add new operating systems or kernels installed on the system to the LILO
    boot manager

    - c. To save changes you''ve made in lilo.conf to the MBR or superblock

    - d. To check for errors made when editing lilo.conf

    - e. All of the above


    Answer e is correct. Running LILO after editing the lilo.conf allows LILO to update
    its files, such as /boot/boot.b, to add new volumes and so on (answer a). Adding
    new boot partitions, kernel images, and so on (answer b) also requires running
    LILO so that they will be recognized as options during boot-time. Answer c is
    questionable as correct because anything written to the /etc/lilo.conf file is
    saved when writing the physical file, but running LILO would save the changes
    to your boot configuration. Answer d is true as well; running LILO finds settings
    within the file that are duplicated labels or invalid boot images.


