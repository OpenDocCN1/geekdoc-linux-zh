- img_proc: true
  md: 'It is rumored that this method will be changing in upcoming versions of Red
    Hat Linux to reflect Debian''s locations for the boot scripts. Therefore, these
    files might be represented under /etc/init.d rather than /etc/rc.d/init.d. This
    is still different from other distributions and other commercial versions of Unix,
    which place these files under /sbin/init/d.


    +   - /sbin—The location of some system configuration and system administrator
    executable files. Most of your general administration commands—such as lilo, fdisk,
    fsck, and route—are located here.


    +   - /home—The location of the home directories for your general users. Under
    /home, each user can set up his or her email, public_html, and personal files.


    +   - /lost+found—The system''s directory for placing lost files that are (or
    created) by disk errors or improper system shutdowns. At boot, programs such as
    fsck find the nodes, which have no directory entries, and reattach them as files
    in this directory. In addition to the root filesystem, there should be one /lost+found
    directory located on every filesystem created on the system. If no lost+found
    directory exists, the fsck program will create it.


    +   - /mnt—The default mount directory. Under /mnt, you mount your devices such
    as CD-ROMs and floppy disks.


    +   - /proc—Your process directory created to hold temporary. Under /proc, you
    will find information about running processes, as well as system configuration
    information such as interrupt usage, I/O port use, and CPU type.


    +   - /tmp—A default directory created to temporary files. This is a good directory
    to keep an eye on if you''re trying to limit disk space.


    +   - /usr—The location for subdirectories for local programs and executables
    for user and administrative commands. The /usr directory contains the binaries
    for X, games, your shared libraries, and more. Essentially, /usr will contain
    just everything that isn''t necessary for booting the system.


    +   - /var—The location for your spooling, logging, and other data (the “var”
    is short for “various”). Common applications that use /var for spooling and logging
    are mail, printing, and cron.


    +   - /opt—The location for optional packages. Many programs, such as Appixware
    (from VistaSource) and KDE, install packages in this directory.'
