    # Backing Up and Restoring Files


    To be a good Unix administrator, you should be in the habit of backing up important
    files regularly. Two typical programs that are used to make archives of a system
    are tar and cpio. The tar program is the tape archive utility. It stores and retrieves
    data from an archive. To make an archive with tar, use


    ```

    tar -cvf filename.tar file

    ```'
