  md: '# Chapter 4


    The RHCE 302 exam is designed to certify the advanced Linux or Unix engineer and
    system administrator of Red Hat Linux. Anyone who participates in the program
    should have intermediate to advanced knowledge of computer hardware, printing,
    networking, TCP/IP networking, network services, and network security. This chapter
    will cover these areas.


    # Hardware


    The RHCE 302 certification exam is based on Red Hat 6.2 running on Intel hardware.
    You should be aware that Red Hat also runs on a number of other hardware platforms
    such as Alpha and SPARC. For this exam, you should be well versed in Intel and
    Intel-clone architectures. A firm knowledge of Interrupt Request (IRQ) settings,
    hard disk subsystems, and basic disk partitioning is a must.


    # Intel Architectures


    # IRQ Settings


    The PCI (and related Accelerated Graphics Port, or AGP) bus is the most popular
    expansion used in current PC systems. Most PC motherboards have both ISA and PCI
    slots available. The differences between ISA and PCI buses lie in the way they
    handle IRQ and input/output (I/O) addressing and in their data transfer speed.'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'The ISA bus''s settings, such as IRQ and I/O, are hard-wired directly on the
    card. This arrangement does not allow the operating system to query the bus, you
    cannot change configurations without changing jumper settings on the card. Plug-and-play
    ISA cards are an exception, but they require special configuration tools. The
    ISA bus has these characteristics:


    +   - It is limited by the maximum clock speed of approximately 8MHz.


    +   - Its maximum data-transfer rate is 8Mbps.


    +   - It is limited by the 16-bit data width and 20-bit address width.


    The PCI bus, however, allows the BIOS to control IRQ and I/O addressing. The operating
    system can directly query the PCI bus, so you can control the settings from within
    the operating system. The PCI bus has these characteristics:


    +   - It is faster than the ISA bus, allowing a maximum clock speed of 66MHz.


    +   - Its maximum data-transfer rate is 132Mbps.


    +   - It has a 32-bit data width and a 32-bit address width.


    Serial ports on Intel and Intel-core computers have standard I/O and IRQ settings.
    Table 4.1 lists the standard settings for serial ports.


    Note: Linux sees an AGP card as another PCI card, but it''s run at 100MHz. AGP
    is used almost exclusively for graphics cards.


    # Hard Disk Subsystems


    Two of the most common hard disk subsystems used in current Intel hardware are
    IDE (Integrated Drive Electronics) and Small Computer Systems Interconnect (SCSI).
    IDE drives have the controller located directly on the piece of hardware, and
    they use an IDE bus that is typically integrated on the motherboard. Most Intel
    motherboards have two IDE buses. Each bus supports one master and one slave, limiting
    the number of IDE devices to four.


    | Table 4.1 Standard serial ports |

    | Linux Serial Port | DOS COM Port | I/O | IRQ |

    |---|---|---|--|

    | ttyS0 | com 1 | 3F8 | 4 |

    | ttyS1 | com 2 | 2F8 | 3 |

    | ttyS2 | com 3 | 3E8 | 4 |

    | ttyS3 | com 4 | 2E8 | 3 |'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'SCSI devices use a controller that is separate from the drive itself. These
    controllers run on SCSI cards (also called SCSI adapters) and are connected to
    the computer through the ISA or PCI slots. SCSI devices are not limited to master
    and slave drives, which are IDE devices. SCSI devices are limited only by the
    number of devices that the SCSI card supports. Typical cards can support anywhere
    from 7 to 30 devices; however, higher-quality cards are reported to support over
    100 devices.


    Performance factors differentiate the qualities of IDE and SCSI devices. Typical
    SCSI devices can transfer data from a range of 10Mbps through 160Mbps, and typical
    IDE devices from a range of 8Mbps through 100Mbps. Both systems'' speed rates
    depend on the device and the controller card.


    # Disk Partitioning


    Another must for understanding Linux is understanding hard-drive partitioning.
    Partitioning, which we briefly looked at in Chapter 2, is a mechanism used to
    segment a single physical disk into multiple logical devices. These logical disks
    appear as a contiguous section of physical blocks.


    An entire hard disk does not have to be partitioned completely. You can save the
    remaining space for future allocation, or use it as a gap to allow for resizing
    partitions.


    > Moving and resizing partitions is tricky and can easily corrupt your filesystem.
    Before altering your partition table, always back up your data.


    The number of partitions created on a drive is typically determined by the particular
    machine''s needs. Separate partitions are suggested for separate operating systems
    to use and, in Linux''s case, for swap space. However, it is generally recommended
    that you assign separate partitions (or even separate hard disks) for mounting
    separate filesystems, such as /home, /var, /var/log, and root, for large-disk
    installations or active workstations.


    # Printing


    Red Hat uses the printer spooling systems that were originally developed for BSD
    (Berkeley Systems Distribution) Unix. Linux can maintain multiple printers at
    multiple sites as well as multiple print queues. Some basic printing commands
    you''ll include lpr, lpq, lprm, lpd, and lpc, described in Table 4.2.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Table 4.2 Basic printing commands.


    | Command | Description |

    | --- | --- |

    | lpr | Adds jobs to the print queue |

    | lpq | Lists jobs currently in print queues |

    | lprm | Removes jobs from the print queue |

    | lpd | Is the printer daemon that sends data from the spool to the printer |

    | lpc | Is the administrative interface for printing |


    To add a printer to your system via direct parallel connection, first ensure that
    the printer is physically connected properly. Make sure that the lpd server is
    started at boot-time (check by running nsysys). Edit /etc/printcap, and add an
    entry for the new printer. Create your spool directory in mkdir /var/spool/newps.
    Make sure your spool''s permissions are set to 755 (we''ll go more detail on permissions
    later in this chapter). Create the printer''s accounting file with the **touch**
    command. You can then start the printer in its queue by using the lpc command,
    as shown here:


    ```

    #touch /var/adm/lp_acct/ps3

    #chown daemon /var/adm/lp_acct/ps3

    #chmod 755 /var/adm/lp_acct/ps3

    #lpc up ps3

    ```


    The spool system on Linux can also print to remote printers. To add a remote printer,
    simply edit /etc/printcap, adding lines similar to the following:


    ```

    #remote printer setup

    remp|rp=remote on remote line:\n:lp=-:rm=remote:lp2=sd=/var/spool/remp

    ```


    > Note: The above /etc/printcap entry has no references about the details of the
    printer itself. This is because the host will manage the job after it''s sent.


    This entry sets up the remote printer named remp. Not specifying the lp= field
    tells us that this entry is for a remote printer. The **rm= field points us to
    the destination system (here, we''ve named it "remote"). The **rp= field holds
    the name of the target printer. The **sd= field selects the spool directory that
    the printer will use.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Networking with TCP/IP


    A Linux box without a network is like a typist without hands. Therefore, a Linux
    administrator who wishes to obtain the RHCE certificate must have a good understanding
    of networking concepts such as Transmission Control Protocol/ Internet Protocol
    (TCP/IP), network ports, and networking services.


    # TCP/IP Fundamentals


    The most important networking protocol used in today''s networks is TCP/IP. It
    is the fundamental set of protocols used to establish the Internet as well as
    the majority of the world''s wide area networks. Networking is one of Linux''s
    star features, making it more popular every day for business networks, Internet
    Service Providers (ISPs), manufacturing facilities, and network companies.


    # TCP/IP and the Open Systems Interconnection (OSI) Model


    The TCP/IP architectural model of computer-to-computer communication is based
    on the Open Systems Interconnection (OSI) model. The OSI model consists of seven
    layers, whereas the TCP/IP model has only four. Here is a list of the OSI model''s
    layers:


    +   - Application layer

    "- Presentation layer

    "- Session layer

    "- Transport layer

    "- Network layer

    "- Data Link layer

    "- Physical layer


    Compare those with the TCP/IP model''s layers:


    +   - Application layer—Handles TCP/IP network daemons and applications. This
    layer performs the jobs of the OSI model''s Presentation, Session, and Application
    layers.


    +   - Transport layer—Handles all the data routing and delivery issues, including
    session initiation, error control, and sequence checking. This layer covers the
    OSI model''s Transport layer and part of the Network layer.


    +   - Internet layer—Handles all the data addressing, transmission, and the IP
    packet. This layer covers part of the OSI model''s Network layer.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Red Hat Advanced Prerequisites


    Network Access layer—Specifies the procedures for transmitting data over the network,
    including how to access the physical medium. Also called the Network Interface
    layer. (This is used for many protocols, including Ethernet and FDDI, the Fiber
    Distributed Data Interface.)


    # TCP and User Datagram Protocol (UDP) Protocols


    TCP is not the only protocol used in TCP/IP networking. Some applications, as
    as the Network File System (NFS), use a sibling protocol UDP (User Datagram Protocol).
    Both protocols allow the application to contact a service on a specific port.
    However, UDP doesn''t establish a connection; rather, it sends single packets
    to the service.


    # Internet Control Message Protocol (ICMP) Packet Types


    Internet Control Message Protocol (ICMP) is used by the kernel code to send error
    messages to other hosts. There are ICMP packet types, some valid types are echo-reply,
    destination-unreachable, source-query (deprecated, but NT sends them for some
    reason), redirect, echo-request, router-advertisement, router-solicitation, time-exceeded,
    parameter-problem, timestamp-request, timestamp-reply, address-mask-request, and
    address-mask-reply.


    The destination-unreachable packet can carry one of 14 messages. These include
    network-unreachable, host-unreachable, protocol-unreachable, port-unreachable,
    fragmentation-needed, source-route-failed, network-unknown, host-unknown, network-prohibited,
    host-prohibited, TOS-network-unreachable, host-unreachable, communication-prohibited,
    and host precedence-cutoff.


    The redirect packet can carry one of four messages: network-redirect, host-redirect,
    TOS-network redirect, and host-redirect.


    The time-exceeded packet (also known as ttl-exceeded) can carry one of two messages:
    ttl-zero-during-transit and ttl-zero-during-reassembly.


    The parameter-problem packet can carry one of these two messages: ip-header-bad
    and required-option-misusing.


    # Understanding Ports


    Network services are each assigned (or bound to) a port. Ports are TCP''s and
    UDP''s abstraction of a service endpoint. There are 64K (or 65,536) possible ports
    available for use. All ports under 1,024 (low-number ports) are considered privileged
    ports. This means that only the root can bind mine to them. However, 1,024 and
    above are unprivileged ports, meaning that any user can bind to them.'
  merge: -1
  pgno: 94
