    essary, such as page size.


    # Network Configuration


    Choosing the network configuration tool runs the netcfg program. The first screen

    lists your machine host and allows you to search for host names under

    additional domains. Here, you also list your current name servers. If you

    make any changes in the list, you must save your information and reactivate your

    network device.


    By choosing the Hosts button, you can add, edit, and delete different hosts to\which
    your machine can connect, and you can add, edit, and delete aliases for

    these hosts. Adding or editing your hosts requires the IP address for the host

    machine, the full name of the host, and a nickname for it. When you edit these

    hosts, you are actually editing /etc/hosts file.'
