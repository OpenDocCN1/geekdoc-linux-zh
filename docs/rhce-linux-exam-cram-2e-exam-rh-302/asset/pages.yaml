    # # File Transfer Protocol (FTP)


    FTP is the File Transfer Protocol used to connect two machines (a server and a
    client) in order to transfer files from one to the other. Typically, FTP works
    by a client connecting to a server (via an FTP client) and then uploading files
    to the server or downloading files from the client.


    Two general types of FTP servers are user access and anonymous access. User-access
    FTP servers require that the client accessing the FTP server have a valid user
    account (username and password) on the system. Anonymous-access FTP servers allow
    any client to connect without needing a specific username or password to access
    the system. In this section, I will discuss how to set up the default Red Hat
    Linux FTP server (wu-ftpd) and how to set up the anonymous FTP.


    # # Setting Up wu-ftpd


    The default Red Hat Linux 6.2 FTP server is wu-ftpd. By default, you can install
    the wu-ftpd package during the Red Hat Linux 6.2 installation. If you did not
    install wu-ftpd during your Red Hat Linux installation, you can install it from
    the Red Hat 6.2 CD with the RPM wu-ftpd-2.6.0-3.i386.rpm.


    After the installation of wu-ftpd is finished, there is nothing to configure.
    With the default wu-ftpd installation, any user can then use ftp to your server,
    and with his'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Chapter 10


    username and password authentication, gain FTP access to his own home directory.
    The wu-fppd package sets up three configuration files: /etc/ftpaccess, /etc/ftphosts,
    and /etc/ftpsusers.


    # The /etc/ftpasswd File


    The /etc/ftpasswd file is the main ftppd configuration file. There are a number
    of options you can configure and customize in the /etc/ftpasswd file. With the
    loginfails option, you can specify the number of attempts to successfully log
    into the FTP server. (The default is loginfails 5, which allows five attempts
    before the FTP server refuses connection.) You can also allow or deny specific
    tool access (such as compress, tar, and chmod) to specific types of connections
    (such as all, guest, and anonymous). For more information about /etc/ftpasswd
    options, read the ftpasswd man page (man 5 ftpasswd)


    # The /etc/ftphosts File


    The /etc/ftphosts file is used to allow or deny access to specific accounts from
    hosted servers. There are two types of entries in the /etc/ftphosts file. The
    first is allow, and the second is deny. The syntax is allow username host. . For
    example, allow kara 192.168.0.* would allow only the user “kara” to log in from
    192.168.0.* hosts. The deny entry any anonymous user connections from any 192.168.1.*
    host. For more information about setting up the /etc/ftphosts file, read the ftphosts
    man page (man 5 ftphosts)


    # The /etc/ftpsusers File


    The /etc/ftpsusers file is used to specify exactly which system user accounts
    not log in to the server via ftp. By default, system users such as root, bin,
    deamon, adm, lp, sync, shutdown, halt, mail, weucp, operator, games, and nobody
    are automatically added to this list. If you create users to whom you want to
    deny FTP access, add them to the /etc/ftpsusers file as well.


    # Setting Up Anonymous FTP


    An anonymous FTP server does not require a user to enter a specific user ID or
    password to access the server. This means the FTP server can be reached with anonymous
    FTP clients (such as Netscape Navigator) and by simply passing the generic usernames
    (such as “anonymous” and “ftp”) along with the email address as the password.


    To configure your FTP server as an anonymous FTP server, you can install the anonftp
    RPM, and the wu-fppd server will be configured automatically. This RPM can be
    found on your Red Hat Linux 6.2 CD as /RedHat/RPMS/anonftp-3.0-3.i386.rpm.'
  merge: -1
