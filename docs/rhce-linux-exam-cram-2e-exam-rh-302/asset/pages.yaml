    # # Planning Your Configuration


    During the installation, you are prompted for several configuration, setting,
    and

    installation options (including network settings, host and domain information,

    root password, and hardware specifications). Before beginning your installation,

    you should have all this information prepared so that you do not have to find
    it—

    figure out—during the installation process.


    One of the most important configuration issues involves the physical hard drive

    installation. You should know exactly which drive and which partition you plan

    to install on. Knowing this information is especially important if you have mul-

    tiple drives or if you have existing partitions from a previous Linux installation
    or

    or other operating system. Specifying the wrong drive or partition during the
    in-

    stalls will destroy any information on the drive, and you will not be able to

    recover it.


    You should also plan your partition layout. If you''re installing on a small drive,
    or

    setting up a long-term dedicated service machine, you may opt simply to install

    all the packages and directories in one partition (in addition to your swap parti-

    tion). For installations on machines with multiple operating systems, existing

    partitions, or very large drives, it''s best to create multiple partitions. The
    most

    common dedicated partitions are set up for the following filesystems:


    +   * /

    * /home

    * /var

    * /tmp

    * /boot

    * /usr

    * swap


    Setting up separate filesystems is helpful when you are managing large filesystems.

    Splitting filesystems among separate partitions rebuild time if one file-

    system becomes corrupted; it also sets up better security when other users at-

    tempt to access the system. In addition, setting up these separate filesystems
    makes

    system upgrades easier. For example, creating a separate filesystem for users''
    home

    directories allows you to upgrade the entire system without damaging user data.'
