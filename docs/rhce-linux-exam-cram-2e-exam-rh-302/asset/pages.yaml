    ```


    # Shadow Passwords


    Shadow passwords have several purposes. First, the password field of /etc/passwd
    is removed (replaced by an "x"). The file /etc/shadow then contains the password'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'hash. The permissions on the shadow file make it unreachable by anyone but
    root (and, in some distributions, the "shadow" group). This makes it more difficult
    to extract password hashes to run through crack or other similar password-guessing
    programs. The shadow file also contains password aging information.


    You can convert a system to shadow passwords by running the pwconv program. If
    necessary, you can later convert the system back by using pwunconv. The change
    should be transparent to all programs that use PAM. Password aging can be controlled
    with the charge program.


    # tcp_wrappers


    The use of tcp_wrappers on your system allows you to perform specific actions
    when another machine connects to your own. With the use of /etc/hosts.allow and
    /etc/hosts.deny configuration files, you can and cannot use specific services.
    The use of tcp_wrappers can affect only services that are controlled by inetd
    (as previously discussed in the section about inetd).


    When a connection request is sent from another machine to your machine, inetd
    first checks if the service is enabled and all permissions are set properly. If
    so, inetd passes off the request to tcp_wrappers. Next, tcp_wrappers checks the
    /etc/hosts.allow file to see if permission is specifically granted for that service
    to the requested user. If tcp_wrappers finds that the specific user is granted
    access to the service, the connection is granted. If no setting in the /etc/hosts.allow
    file is specified, then tcp_wrappers checks the /etc/hosts.deny file. If tcp_wrappers
    finds that the specific service has been denied to that user, the connection is
    refused. However, if no setting in /etc/hosts.deny specifies that the service
    to the requested user is denied, the connection is granted.


    # /etc/hosts.allow


    The /etc/hosts.allow file is the first file that tcp_wrappers checks for allowed
    connections to specific services by specific users. If a service or user is specifically
    granted access in /etc/hosts.allow, the /etc/hosts.deny file is ignored.


    In the /etc/hosts.allow file, permission is granted to either a specific service
    or to all services. The service setting is then granted to individual IP blocks,
    IP ranges, domains, local, or to all. The entries in the /etc/hosts.allow file
    are set up by service:granted_to where service specifies the name of the services
    and granted_to who (or what location) has permission to use the service.


    # Specifying Services


    When specifying a service to provide access to, you can specify the particular
    service, such as ftpd, or specify all services. To specify a particular service,
    you use


    ![](img/fe9012f0d9b0102febe0e70f330ee448_322_0.png)'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Chapter 11


    the syntax in.service, where service is the service to be specified. To specify
    all services, you use the syntax ALL.


    To grant a specific service, as fptpd, to everyone on your local 192.168.x.x network,
    you will have an entry in /etc/hosts.allow file that looked like this: in.fptpd:
    192.168.0.0/255.255.0.0. With this entry, tcp_wrappers allows access to the ftp
    daemon that is connecting from any IP from 192.168.0.0 through 192.168.255.255.


    To grant all services to everyone on your local 192.168.x.x network you will have
    an entry in /etc/hosts.allow file that looked like this: ALL:192.168.0.0/255.255.0.0.
    With this entry, tcp_wrappers allows all services granted by inert that are connecting
    from any IP from 192.168.0.0 through 192.168.255.255.


    # Specifying User Access


    When granting a user access to a service, you can specify a specific domain, a
    range of IPs, or all. In addition, you can use an EXCEPT argument that allows
    you to specify specific domains and IPs to which access should not be granted.


    To allow all access to a specific domain, as redhat.com, you would use the following
    entry: ALL .redhat.com. With this entry, any user from redhat.com, can access
    available services on your machine. To specify an additional domain, such as coriolis,
    you would use the following: ALL:.redhat.com,coriolis.


    To grant a specific IP, such as 192.168.0.1, to all services, IP; such as 192.168.0.1,
    you would use the following: ALL:192.168.0.1. With this entry, only users from
    192.168.0.1 can access all services on the machine. To specify an additional IP,
    such as 192.168.0.100, you would use the following: ALL:192.168.0.1,192.168.0.100.


    To grant all users access to services, you would use ALL: ALL. You can specify
    EXCEPT cases with any of the previously mentioned arrangements. For instance,
