  md: 'The objective of the RHCE program is to promote advanced skills among its participants.
    Although one of the goals of Red Hat software is to package a product that an
    average skilled Linux user can use easily, the goals for an RHCE are set higher.
    An RHCE should be skilled not only in installation methods but also in configuration
    methods. An RHCE should also be able to customize all parts of the system—from
    the kernel to the bash shell. This chapter will discuss many types of advanced
    configuration methods.


    # # Understanding Quotas


    Quotas are essential to system administrators who are administering the data,
    Web servers, and on so many users. The quota system is much like setting up a
    budget for how much disk space a user or group can use on a system.


    For you to use quotas, your Red Hat Linux kernel must be configured to use quotas.
    By default, the installed Red Hat Linux kernel already has quota support compiled
    in; however, if you are using a custom or recompiled kernel, you must ensure that
    quota support is compiled.


    After kernel quota support is compiled, you need to see if the quota RPM is installed.
    If quota is installed from a Red Hat Linux 6.2 system and the quota RPM is installed,
    then


    ```

    quota-2.00pre-3

    ```


    is returned to you. If you do not have the quota RPM installed, you can either
    obtain the RPM files from your favorite Red Hat FTP site or install them from
    CD-ROM. To install the quota RPM, simply run


    ```

    rpm -Uvh quota*

    ```


    from the directory that contains your quota RPM files.


    The necessary quota files are started in the startup script, located in /etc/rc.d/rc.sysinit.
    When executed, the script looks to see if the appropriate scripts are available
    and runs /sbin/quotacheck to turn on quotas. Here are a few snippets of code from
    the rc.sysinit script that is required to run quotas. This code should automatically
    be placed in your rc.sysinit file when you install the RPM:


    ```

    # Update quotas if fsck was run on /

    if [ "$_RUN_QUOTACHECK" -eq 1 -a /sbin/quotacheck ]; then

    action "Checking root filesystem quotas"

    /sbin/quotacheck -v /

    ```


    ```

    fi

    ```'
