    # Building the Kernel


    After the kernel source is unpacked, change directories into the kernel source
    directory, and then run one of these commands: `make config`, `make menuconfig`,
    or `make xconfig`. The `config` target presents you with a list of options for
    the kernel in the form of questions. The `menuconfig` and `xconfig` targets are
    menu-driven interfaces for the configuration process, with the first a text interface
    and the latter with an X interface. The `menuconfig` and `xconfig` options are
    certainly easier than the simple `config` options, but they don''t work properly
    with compiling development kernels. The `config` option is considered the standard
    way to configure the kernel because it has been available since the beginning
    of Linux kernel development.


    If you choose the `make config` route, you''re presented with a series of questions,
    one for each of the kernel configuration options. The possible answers are `y`
    to turn the item on (or include the driver), `n` to turn the item off (or skip
    the driver), `m` to make the driver a kernel module, or `q` to get help on that
    option. After running `make config`, you must prepare to compile the source code
    by using `make dep`, followed by `make clean`.


    Next, you need to compile your kernel. To compile, you have two options: `make
    zimage` and `make bzImage`. Because `zimage` limits the kernel to booting within
    the first 640K of disk space, I recommend that you use the `make bzImage` option
    to allow larger kernels. With either of these commands, you can then manually
    add your kernel to LILO within `/etc/lilo.conf` and have the option to boot your
    old kernel, in your case one doesn''t work properly.


    > The methods for make zimage and make bzImage are x86-based commands only. On
    other architectures (such as Alpha), you can use `make boot`, which works on the
    x86 platform as well.


    After successfully building your kernel, you must run `make modules` and `make
    modules_install`. Doing such builds and installs the loadable modules that you
    configured for your kernel. After these commands have finished successfully, copy
    your new image to the /boot directory, and then add the appropriate lines to lilo.conf.
