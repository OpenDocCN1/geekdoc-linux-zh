  md: '# Dynamic Host Configuration Protocol (DHCP)


    DHCP is a superset of boot, which is used to assign IP addresses to clients on
    a network. DHCP is used for dynamic hosts that can move, connect, and disconnect
    from networks. DHCP can dynamically assign IP addresses from preassigned IP addresses
    in /etc/dhcpd.leases and set static IP addresses based on the NIC MAC (Media Access
    Control) address. DHCP can even restrict access by accepting requests from only
    specified MAC addresses.


    # Setting Up a DHCP Server


    To set up a DHCP server, make sure that you have installed the DHCP RPM. The DHCP
    RPM packaged with Red Hat Linux 6.2 is dhcp-2.0-5.i386.rpm. To finish setting
    your DHCP server, follow these steps:


    +   1. Check to you have MULTICAST support in your kernel. To do this, run ifconfig
    -a. If you already have MULTICAST support, you will have a line that says “UP
    BROADCAST RUNNING MULTICAST MTU:1500 Metric:1” in the eth0 section of the ifconfig
    output. If MULTICAST is not in your configuration, you must reconfigure your kernel
    to support MULTICAST, replace your NIC (if not supported), or change your interface
    settings.

    2. Add a route for 255.255.255.255 (required by Microsoft clients). To do this,
    type route add -host 255.255.255.255 dev eth0 (where eth0 is the device of your
    Ethernet card).

    3. Start the DHCP server. To start the server, type /usr/sbin/rc/init.d/dhcpd
    -d -f.

    4. Verify that DHCP is working properly.

    5. Configure your /etc/dhcpd.conf file (an example for setting random IPs for
    clients follows).


    > Note: If you get an “unknown host” error when adding this route, add the following
    entry to your /etc/hosts file: 255.255.255.255 all-ones.


    # Configuring dhcpd for Random IP Assignment


    To set up DHCP to assign random IP addresses to DHCP clients on the network, you
    will need to configure the /etc/dhcpd.conf file, which is the main configuration
    file for DHCP. The following list contains sample settings for the /etc/dhcpd.conf
    file. These settings will allow DHCP to randomly assign IP addresses'
  merge: -1
