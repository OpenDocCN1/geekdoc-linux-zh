  md: '# Email Clients


    Email clients are the mail user agents used by the user to read her mail. There
    are a variety of MUAs available. Any MUA can be used as long as the MUA supports
    the POP or IMAP (discussed in Chapter 4) protocols to receive mail remotely. Some
    popular email clients used on Linux include elm, pine, and Netscape mail reader.


    # Elm


    The MUA Elm is a text-based mail reader used on Unix systems. The interface is
    text-based, and commands are given by simple key commands prompted by the mail
    reader. The text of the email is derived by editing a text file with your default
    editor (emacs, elm, and so on), which is automatically spawned when running Elm.
    To install Elm, install elm-2.5.3-6.i386.rpm from the /RedHat/RPMS directory of
    your Red Linux 6.2 CD-ROM. Figure 10.1 shows the interface used with the ElmMUA.


    # Pine


    Another popular text-based MUA is Pine. The Pine reader is a little more user-friendly
    than Elm key combination menu-based options; Pine uses a simpler text editor.
    To install Pine from the Red Hat Linux 6.2 CD, install the pine-4.21-8.i386.rpm
    file. Figure 10.2 shows the text-based interface for Pine.


    # Netscape


    In addition to the multiple text-based MUAs that are found on most Unix systems,
    other graphical MUAs exist as well. Remember, any MUA that supports POP and IMAP
    (discussed in Chapter 4) should work on your Red Linux


