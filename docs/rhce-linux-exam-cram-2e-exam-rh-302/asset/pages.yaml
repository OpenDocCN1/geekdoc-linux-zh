    # X Client


    An X client is the software that sends requests to the X server. The X server
    draws on the X display, returns information, or performs another requested task.
    An X client can be the software on the same machine as the X server or on a remote
    host. I''ll discuss the remote applications later in this chapter.


    The standard X desktop is made up of many services and programs, which vary depending
    on the window manager or environment you use. However, several standard terms
    and applications apply. When using an X client, you should be aware of the following
    terms and their differences:


    +   - **screen**—Your whole desktop. The terms "screen" and "desktop" are often
    exchanged. Technically, the screen is the primary video display with which you
    view your X Window System.

    - **root window**—The background of your screen. The root window doesn''t have
    any of the standard characteristics of any other window, but it does have some
    unique applications. The root window is where you can customize your background
    images.

    - **window manager**—The main interface between the X Window System and the user.
    The window manager provides functionality as window borders, menus, icons, desktops,
    buttons, and toolbars, and it allows the user to customize them all. I''ll discuss
    the various window managers later in this chapter.

    - **pointer**—The arrow or indicator that represents the location of your mouse,
    track, glide point, or other pointing device as it corresponds to the location
    on the screen. Often, the shape, color, or size of the pointer changes to indicate
    that the mouse has a particular function on that specific area of the screen.

    - **window**—A frame in which any given application resides and is managed by
    the window manager. The active window, the window you''re currently using'
