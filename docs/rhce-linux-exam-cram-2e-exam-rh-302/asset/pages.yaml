  md: '# Section 2: Main Server Configuration—httpd.conf


    The directives in the second section of httpd.conf set up the values used by the
    Main Apache server that responds to requests not handled by the <VirtualHost>
    definition. The values in this section also provide the default setting for other
    <VirtualHost> containers that you define in the file.


    If you''re running Apache as a standalone server, you must specify what port the
