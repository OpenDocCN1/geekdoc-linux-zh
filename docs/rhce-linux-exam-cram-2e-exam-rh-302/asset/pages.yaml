  md: '# Samba (SMB)


    Samba is the open source server that implements SMB (Server Message Block). SMB
    allows you to set up your Red Hat Linux 6.2 machine to act as a server for Windows
    95/98/NT for services such as file- and print-sharing.


    # Setting Up SMB


    With Red Hat Linux 6.2, you can install Samba during the installation (use the
    Set Up Windows File And Print Sharing option). If Samba wasn''t installed during
    your Red Hat installation, you can install the Samba RPM from the Red Hat Linux
    6.2 CD. The CD contains the RPM in /RedHat/RPMS/samba-2.0.6-9.i386.rpm.


    Installing the Samba RPM sets the main configuration file for SMB as /etc/smb.conf.
    In addition to the main configuration file, a number of additional configuration
    files and tools are installed. Table 10.4 lists all the configuration files and
    tools installed by the Samba RPM file.


    | File | Path | Description |

    | --- | --- | --- |

    | smb.conf | /etc/smb.conf | Configuration file for Samba |

    | smbpasswd | /etc/smbpasswd | Configuration file for Windows password file for
    server |

    | smbuser | /etc/smbus | Unix-to-NT user mapping |

    | nmbd | /usr/bin/nmbd | Windows NetBIOS names for sending and receiving names
    of machines on the network |

    | smbd | /usr/bin/smbd | Samba daemon for server shares |

    | swat | /usr/bin/swat | Web-configuration tool for SMB |

    | smbdadduser | /usr/bin/smbdadduser | Tool for adding users to your system |

    | smbclient | /usr/bin/smbclient | Client-side program to connect to SMB server
    from Linux |

    | smbmount | /usr/bin/smbmount | Utility to mount SMB shares |

    | smbpasswd | /usr/bin/smbpasswd | Utility used to add users to /etc/smbpasswd,
    allowing for Windows encrypted passwords |

    | smbprint | /usr/bin/smbprint | Script used for printing |

    | smbrun | /usr/bin/smbrun | Script used for printing |

    | smbstatus | /usr/bin/smbstatus | Tool used to print status information for the
    running SMB server |

    | smbtar | /usr/bin/smbtar | Script used for backing up Windows machines to your
    SMB server |

    | smbmount | /usr/bin/smbmount | Tool used to unmount SMB service |'
