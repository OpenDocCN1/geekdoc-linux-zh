    # Routes


    Two types of routes can be established with Linux TCP/IP routing—static and dynamic.
    Static routes are hard-coded routes that are assigned to a router. They will not
    change, whether there is a failure on a network or an alternate route is available.
    This means that a static route is the only path from one host to another. The
    most popular static route on a Linux network is the route to the machine''s default
    gateway.


    A dynamic route is a route that is assigned "on the fly," meaning that no definitive
    route is set, and for a packet is assigned each time a packet is sent (not predetermined).
    A typical type of dynamic route is the route established with standard dial-up
    access to an ISP. When the client makes a request for a particular Web site, for
    instance, the packet is sent from the client to the ISP router. The ISP router
    then looks for the next router that can accept the packet for the requested petition.
    If router does not exist, the ISP router then looks for an alternate route that
    can reach the host (or an additional route), until the host is reached. The ability
    to use an alternate route is the main difference between dynamic and static routes.
    A dynamic route can use a separate route each time a specific host is requested,
    whereas a static route will use the exact same route for the specified host.


    # Linux Firewalling


    The kernel can be set up to do firewalling, meaning that certain kinds of TCP/IP
    traffic are allowed, but other traffic is not. Firewall support is configured
    using ipchains. Support for ipchains is a feature of 2.2.x (and very late 2.0.x
    kernels). Early kernels used the ipfwadm utility (which is now obsolete).


    In the latest kernel, 2.4.x, the kernel firewall coding has been rewritten. Firewalling
    in 2.4 is controlled with a program called iptables. The 2.4.x kernel also contains
    compatibility modules for ipchains and ipfwadm. As of the publish date of this
    book, a stable version of 2.4.x has not been released, so I''ll cover ipchains
    later. Because ipchains and iptables are similar, the same concepts will apply
    to both. The iptables HOWTO, available from //netfilter.kernelnotes.org/, contains
    a section on the differences between ipchains and iptables. Consult that documentation
    for more information if you''re trying to do firewalling with a 2.4.x kernel.'
