  md: '# Red Hat Advanced Prerequisites


    using upper- and lowercase. Also, allow shell access to only those users who need
    it. For instance, if a user is simply pulling his mail from the account, set his
    shell access to /usr/bin/passwd (or something similar). Doing forces the user
    to change his password instead of allowing him to have shell access.


    Another good area to monitor is software usage; keep an audit of the software
    you''re running. Many times, unauthorized users exploit popular software, such
    as sendmail or BIND, and then gain root access to your system. Keep up to date
    by using the most current versions of your software.


    # Setting File Permissions Properly and Using umask


    Every file, program, and directory is set up with file permissions. Executing
    an ls -l command in a directory prints the list of files, including details, as
    shown here:


    ```

    -rw-rw-r-- 1 kara kara 7688 Jan 13 14:32 pick

    drwxr-xr-x 9 kara kara 1024 Mar 27 12:15 public_html

    -rw-rw-r-- 1 root root 43489 May 7 1998 tempcap

    -rw-rw-r-- 1 root root 3313 Apr 30 1998 wgetrc

    ```


    The first group of characters represents the permissions for the file. The permissions
    are noted (when you are using -l) by a string of 10 characters, drwxrwxrwx and
    combinations thereof. When a particular character is replaced by a hyphen (-),
    the permission assigned to that character is not granted. These characters are
    split into four groups. The first character is represented by a d, which stands
    for a directory. drwxr-xr-x indicates a directory, whereas -rw-rw-r-- indicates
    a file name. The remaining nine characters are split into three groups, rwx rwx
    rwx. The first group pertains to the owner, the second group, and the third to
    everybody else. The r in each case stands for readable, the w for writable, and
    the x for executable. Table 4.6 shows an example of permission settings.


    | Table 4.6 Permissions. |

    | Permission String | Explanation |

    | --- | --- |

    | -rw------ | Readable, writable, and executable by the owner only |

    | -rwx-x-- | Readable, writable, and executable by the owner; readable and executable
    by the group |

    | -rwxr-xr--x | Readable, writable, and executable by the owner; readable and
    executable by the group; executable by the public |'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Chapter 4


    When you are assigning or referring to permissions of a file, the r, w, and x
    characters are assigned numeric values of 4, 2, and 1, respectively. You then
    add these values together per group to get the permission values (for example,
    rwx=r+w+x = 4+2+1=7; r-x=r+0=4 0+1=5). Table 4.7 shows permission strings and
    their numerical values.


    Therefore, a file with -rw-r---- details has permissions set to 644. By default,
    all files are created with file permissions of 666. These permissions are adjusted
    per user by their default umask. A umask sets the file permissions by subtracting
    the user''s umask from the default 666. For example, if a umask is set to 022,
    the files created within that shell and its subprocesses are set to 644 (666-022).


    To set the umask in a shell, use the umask command. Here''s an example:


    ```

    #umask 022

    ```


    For files that need to have their permissions changed—such as to be executable
    or limit access to the owner and the group—you use only the chmod command. Here''s
    an example:


    ```

    #chmod 777 filename

    ```


    This code sets the file name to have 777 permissions (-rwxrwxwx), and the world
    can read, write, and execute them. However,


    ```

    #chmod 770 filename

    ```


    causes the owner and group—but not anyone else—to be able to read, write, and
    execute the file name.


    By default, when a user account is created, that account is given its own owner
    ID and group. To add users to other groups, edit the /etc/group file. The following
    is an excerpt from /etc/group file:


    ```

    luci::402:steve,kara,jburke

    egypt:499:alan,barb

    steve:500:

    ```


    | Table 4.7 Permission values. |

    | Permission String | Numerical Permission Value |

    | -rwx------ | 7-0-0 |

    | -rwx-x--x | 7-5-0 |

    | -rwx-x--x | 7-5-1 |'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'In this example, files that have specified access to the group named luci users
    steve, kara, and jburke access. On the other hand, alan and barb do not have access
    because they are assigned to the egypt group, not to luci, and vice versa. To
    set a specific group to use a file, use the chgrp command. For instance,


    ```

    #chgrp luci index.html

    ```


    sets the group ownership of index.html to the luci group. The index.html file
    has 664 permissions, owned by steve, and the luci group assigned to it. There-fore,
    steve and users in the luci group (steve, kara, and jburke) can read and write
    to that file, whereas everybody else can only read the file. The following code
    changes the group ownership of the index.html file to luci; this change is verified
    with the ls -l command:


    ```

    #chgrp luci index.html

    #ls -l index.html

    -rw-rw--r luci 3709 Mar 22 17:57 index.html

    ```


    # Using Shadow Passwords


    Shadow passwords have several purposes. First, the password field of/etc/passwd
    is removed (replaced by an x). The file /etc/shadow then contains the password
    hash. The permissions on the shadow file make it unreachable by anyone but root
    (and, on some distributions, the shadow group). As a result, extracting password
    hashes to run through crack or any other similar password-guessing program is
    more difficult as compared to running the program on a system that doesn''t use
    shadow passwords. The shadow file contains password aging information as well.


    You can convert a system to shadow passwords by running the pwconv program. If
    necessary, you can later convert it back using pwconv. The change should be transparent
    to all programs that use Pluggable Authentication Modules (PAM). You can control
    password aging with the change program.'
