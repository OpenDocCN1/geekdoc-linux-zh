    password.


    /etc/fstab

    File used to configure filesystems on

    a machine.


    /etc/printcap

    File used to configure printers.


    /etc/group \

    File used to assign users to specific

    (or shared) groups.


    /etc/rc.d/rc.local

    Script used for local startup configu-

    ation.


    /etc/hosts

    File that contains hosts found on

    your system.'
