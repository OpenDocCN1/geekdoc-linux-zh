  md: '# History of Linux


    Linus Torvalds started Linux as a hobbyist project in 1990. Torvalds, a college
    student from Finland, began the project after purchasing a computer to run Minix,
    a Unix-like operating system that was included in Andrew Tanbaum''s textbook Operating
    Systems: Design and Implementation. Shortly after, Torvalds decided to learn more
    about some of the low-level features of the Intel 8036 processor, and he then
    began working on what would eventually become the Linux kernel.


    Within two months of starting the project, Linus released kernel 0.01 shortly
    after he posted it to the comp.os.minix newsgroup:


    > From: torvalds@klaava.Helsinki.FI (Linus Benedict Torvalds)\Newsgroups: comp.os.minix

    Subject: Would you like to see most in minix

    Message-ID: <1991Aug25.205708.9541@klaava.Helsinki.FI>

    Date: 25 Aug 91 20:57:08 GMT


    Hello everybody there using minix -


    I''m doing a (free) operating system (just a hobby, won''t be big and professional
    like gpu) for 386(486) AT clones. This has been brewing since april, and is to
    starting to get ready. I''d like any feedback on things people like/dislike in
    minix, as my OS resembles it somewhat (same physical layout of the file-system
    (due to practical reasons) among other things).


    I''ve currently ported bash(1.08) and gcc(1.40), and things seem to work. This
    implies that I''ll get something practical within a few months, and I''d like
    to know what features most people would want. Any suggestions are welcome, but
    I won''t promise I''ll implement


    Linus (torvalds@kruuna.helsinki.fi)


    PS. Yes - its free of any minix code, and it has a multi-threaded fs. It is NOT
    portable [sic] (uses 386 task switching etc) and it probably will support anything
    other than AT-harddisks as that''s all I have :-(


    Nearly three years after Torvalds started this project, Linux 1.0 was released.
    By this time, several Linux distributors had begun packaging the Linux kernel
    with basic support programs, the GNU utilities and compilers, the X Window system,
    and other useful programs. The mass numbers of Linux kernel hackers had'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'managed to develop all the things expected from a current Unix system, including
    preemptive multitasking, virtual memory, shared libraries, TCP/IP support, NFS
    (Network File System), Ethernet, and so on.


    In 1995, the Linux 1.2 kernel was released. The new kernel supported modules,
    kernel-level firewalls, non-TCP/IP networking protocols, and so on. By this time,
    Linux had become as stable as any commercial version of Unix on the x86 platform,
    and it was even being ported to the DEC Alpha, Sun SPARC, and SGI MIPS platforms.


    In 1996, the Linux 2.0 kernel was released. Version 2 saw the preliminary support
    for SMP (symmetric multiprocessor) machines. It was also fully functional on multiple
    platforms, including the x86, Alpha, SPARC, Motorola 68K, PowerPC, and MIPS platforms.


    In 1999, the latest stable kernel, version 2.2, was released. The 2.2 kernel fully
    supports the SMP machines, and it more fully supports multiple platforms, including
    the 64-bit platforms. In addition, version 2.2 is significantly faster than previous
    versions.


    In summer of 2000, the newest stable kernel, version 2.4, will be released. There
    will be a lot of new features, including tighter firewalls and more hardware support.


    # History of Red Hat


    Red Hat was started in 1994 when two entrepreneurs, Bob Young and Mark Ewing,
    ventured into beginning a commercial Linux distributor. In just one short year,
    Red Hat''s distribution of Linux was taking the market by storm and was even voted
    best desktop operating system of the year by InfoWorld. In 1997, Red Hat won another
    InfoWorld award when its distribution of Red Hat Linux version 5 won this again
    in 1999 with Red Hat Linux 5.2, in addition to being voted "LinuxWorld Favorite"
    by the open source community, LinuxWorld. This was a feat that no other software
    product had achieved in the InfoWorld awards.


    In September 1998, large technology firms began to invest in Red Hat. Some of
    the first included Intel Corporation and Netscape Communications. In addition
    to technical firms, venture capital firms decided to invest. The first two were
    Benchmark Capital and Greylock Management. Red Hat''s investment base continued
    to grow, and the company eventually filed to enter the stock market as RHAT in
    June 1999.


    Red Hat has expanded, changed, and adapted many times in its short six years.
    Since beginning as simply a packager of Linux, Red Hat has gained many important
    developers for the project, including Alan Cox. Since its extremely successful'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'initial public offering (Nasdaq: RHAT) in August 1999, Red Hat has hired such
    primary kernel developers as David Miller, Ingo Molnar, and Stephen Tweedie. In
    addition, Red Hat is quickly expanding its installation base by being the most
    popular Linux distribution to be sold and supported by mainstream vendors such
    as IBM, Compaq, Dell, and Hewlett-Packard. Before these vendors began shipping
    Linux, however, many Linux vendors, including VA Linux Systems and Penguin Computing,
    were already shipping Red Hat-configured machines.


