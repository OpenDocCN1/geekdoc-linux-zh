  md: 'drive; however, the size is limited to 2GB. After you select the partitions
    for your drive and set them to be the proper partition types, the Red Hat installation
    formats the swap space and the separate partitions. The following is an example
    of a recommended partitioning scheme for a Red Hat Linux server:


    +   - 300MB / (root; this size may vary)


    +   - 16MB /boot


    +   - 300 through 700MB /usr


    +   - 512MB /home (minimum)


    +   - Swap partition with a maximum of 2GB


