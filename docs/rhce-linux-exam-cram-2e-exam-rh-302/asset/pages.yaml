  md: '# DNS


    DNS (Domain Name Service) is used to translate domain names, such as redhat.com,
    to IP addresses, such as 199.183.24.134. Your DNS zones are managed by various
    registrars.


    # DHCP


    DHCP (Dynamic Host Control Protocol)—a descendant of the boot protocol (bootp)—automatically
    assigns IP addresses to a client on a local network. DHCP uses User Datagram Protocol
    (UDP) when the client sends a DHCPDISCOVER message to a broadcast packet to the
    network.


    The DHCP server receives this packet and assigns (either statically or dynamically)
    an IP address to the client. The DHCP server sends to the client a DHCP OFFER
    packet that contains an address and the lease time, as well as other pertinent
    networking information (such as address, netmask, gateway, name, and so on). The
    client issues a DHCPREQUEST for the specified address. The server responds to
    this with the DHCPPACK (which agrees with the client and starts the lease time).


    ![](img/fe9012f0d9b0102febe0e70f330ee448_104_0.png)


    The Internet Software Consortium (ISC) dhcpd uses /etc/dhcpd.conf for configuration
    files and /etc/dhcpd.leases for lease information.


    # SMB


    Samba is a server for the Server Message Block (SMB) protocol, which is the default
    file-sharing and printer-sharing protocol that all versions of Windows, OS/2,
    and Lan Manager use. Samba allows alternative operating systems to use a Unix
    or Linux box as a file or print server. Samba consists of two daemons: smbd (the
    Samba server) and nmbd (the NetBIOS name server). Clients use nmbd to find other
    hosts on the network. Configuration files are located in /etc/smb.conf and /etc/smbusers.'
