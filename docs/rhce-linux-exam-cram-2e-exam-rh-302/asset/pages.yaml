    # Question 8


    | What are the three classes of IP networks, and how do they differ? | what are
    the three classes of IP networks, and how do they differ? |


    The three classes of IP networks are the A, B, and C classes. These are based
    on 32-bit addresses, written in the xxx.xxx.xxx.xxx format. Class A networks are
    the largest class of network and include all addresses in a class (such as 204.0.0.0
    through 204.255.255.255). Class B networks include addresses in a range such as
    204.4.0.0 through 204.4.255.255. Class C is the most widely used network class.
    It is assigned in a 255-node range (for example, from 204.25.0 through 204.25.255).'
