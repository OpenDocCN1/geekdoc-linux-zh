  md: '# Basic Networking


    The favorite features of Linux are centered around its networking capabilities.
    Red Hat Linux supports a number of network interfaces and protocols, ranging from
    modem to network interface card and from TCP/IP to IPX.


    # Exploring /etc/sysconfig


    The files found under the /etc/sysconfig/ directory are files that scripts use
    to execute boot-time. These files are named by the devices they configure, such
    as clock, mouse, and network.


    Beneath the /etc/sysconfig/ directory is a directory that contains network script
    files. These are located under /etc/sysconfig/network-scripts/. The network-scripts
    directory contains scripts such as ifcfg-eth0, ifup, ifdown, and ifup-ppp. The
