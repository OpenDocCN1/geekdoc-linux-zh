    # # The Vicie cron system


    The Vicix cron system allows your machine to run specific commands at regularly
    specified intervals. You can set these commands to run hourly, daily, weekly,
    monthly, or ever. Both root and individual users can use the cron system.


    The cron system uses configuration files named /etc/crontab. The system''s crontab
    file is located in /etc/crontab. User-specific crontabs are in /var/spool/cron/username.
    If a cron job specifies a standard out request, the output is emailed to the user
    who owns the job.'
