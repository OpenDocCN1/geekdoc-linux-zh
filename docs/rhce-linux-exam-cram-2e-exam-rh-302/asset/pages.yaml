  md: 'The underlying goal of becoming an RHCE is to certify your skills in the installation,
    configuration, and administration of a Red Hat Linux system. The first step to
    achieving your goals as an RHCE is to master the skills involved in installation.
    In this chapter, I''ll discuss the steps to successfully install a Red Hat 6.2
    system.


    # # Getting Started


    Before you begin your installation of Linux, you have to decide why you are installing
    Linux in the first place. What are your needs? What do you want to do? Linux has
    a vast variety of applications, system uses, and support options. Deciding what
    you''re going to do in advance will help you decide what to install or set up.


    # # Server vs. Workstation


    You can use Linux in either a server or a workstation environment. In fact, if
    necessary, you can use it in both. If you are just a home user, or perhaps a work-at-home
    user, you''re probably looking to set up a workstation. On your workstation, you
    can set up all your dial-up applications, as well as work on your home programming
    projects and more. However, if you are trying to set up a router, a file server,
    an Internet gateway, a Dynamic Host Control Protocol (DHCP) server, or a Quake
    server, you need to evaluate your requirements for setting up a server.


    # # Hardware Requirements


    If you''re planning to set up an at-home or office workstation, your hardware
    requirements are minimal. Although it''s doubtful you would be very surfing the
    Net—or compiling a kernel—on a 486/33 with 16MB of RAM, it is possible. Linux
    can use most PC hardware. To see if your hardware is supported visit www.redhat.com/hardware/


    *Note: Just-released hardware, if not released with a Linux driver, is typically
    supported within a few weeks of its release.*


    If you want to set up a router or a firewall, you can use any basic hardware setup.
    In fact, using a router or firewall isn''t CPU—or memory-intensive. You can therefore
    set up an adequate router on a 486 with 16MB of memory and a 250MB hard disk.
    Depending on your setup, you might also need to include networking interface cards
    (NICs), modems, ISDN adapters, or even frame relay cards.


    If you want to set up a network file server, your hardware requirements will be
    different from those when you are setting up a simple workstation or a router.
    NFS servers are not CPU bound, a slower system such as a 486 is adequate. However,
    you should evaluate your speed and size requirements. If you will be'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'serving a large number of files, or large files, you must keep ample hard disk
    space. If your machine is serving a large number of users, or will be kept under
    high load, you should consider hard disk speed as well. You may opt to use SCSI
    disks, which have faster access times than IDE disks. Using SCSI disks, however,
    requires that you use a SCSI adapter. Memory is used on an NFS server for cache.
    Larger amounts of memory provide faster writing and accessibility for commonly
    used files.


    If you are planning to set up a database server, you should evaluate your input/output
    (I/O) needs. Database servers are very CPU-intensive, so you may need a CPU that
    can handle the number of users using the system. When implementing an NFS server,
    you need ample amounts of disk space and memory. The speed of your hardware (hard
    disk and memory) may also be a large factor when you choose hardware.


    # Pre-Installation


    To make your Red Hat 6.2 installation smoothly, you should plan as much of the
    installation as possible before beginning. Make sure you have several documentation
    and information resources available for quick reference during the installation
    or for troubleshooting afterward. An excellent resource for this is the Red Hat
    6.2 Installation Guide. This guide is included with the retail version of Red
    Hat, which you can purchase directly from Red Hat (http://www.redhat.com/) or
    from a reseller. A hard copy of the manual is also available from Red Hat. You
    can find an electronic version of this manual on Red Hat 6.2 CD in the /doc/install-guide/
    directory. In addition, you can download the manual for free from Red Hat''s Web
    site at http://www.redhat.com/support/manuals/. In addition, other great documents
    can be found on Red Hat''s Web site at http://www.redhat.com/docs/


    # Preparing Your Installation Media


    After you have gathered the necessary installation materials, it is very important
    to make sure you have all the necessary media—such as your installation CD and
    boot disks—prepared. With Red Hat 6.2, different media can be used—or in some
    cases, are required—depending on the method you decide to boot the installation
    program.


    You should also have access to any peripherals you want to set up during the installation,
    as well as all the technical information for any hardware connected to, or installed
    inside, the machine. If you are planning to install over a network, you should
    ensure that you are properly connected to your network and that you have located
    a stable server to install.'
