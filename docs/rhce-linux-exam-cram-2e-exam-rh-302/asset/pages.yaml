  md: '# Practice Questions


    # Question 1


    What line in /etc/hosts.allow would specifically grant access to fptd for users
    from redhat.com?


    * a. ALL EXCEPT in.fptd:redhat.com

    * b. in.fptd: ALL EXCEPT .redhat.com

    * c. ALL:in.fptd

    * d. None of the above


    Answer d is correct. Answer a is incorrect because it specifies permission for
    all services except fptd to redhat.com. Answer b is incorrect because it specifies
    access to fptd for all except redhat.com. Answer c is incorrect because it is
    an invalid format.


    # Question 2


    What command do you use to add routes to a Linux router?


    * a. addroute

    * b. route

    * c. netstat

    * d. net


    Answer b is correct. The route command is used for adding routes to a Linux router.
    Answers a and d are incorrect because they are invalid options. Answer c is incorrect
    because netstat is used to print network information, such as routing tables and
    so forth, but does not add routes to the system.'
