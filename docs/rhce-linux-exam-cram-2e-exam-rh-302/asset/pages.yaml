  md: '# # The Debugging Exam


    As I discussed in Chapter 12, the majority of the RHCE exam–302 exam is performance-based.
    Whereas the installation and configuration exam is graded by your completion of
    objectives and goals as specified in your objectives sheet, the debugging exam
    is different. You''re not presented with a list of specific tasks to accomplish.
    Instead, you''re presented with an end goal (what needs to work), and you have
    to work your way through a number of (unspecified) problems to get to your end
    goal.


    There are many things to manage when you''re taking a performance-based examination
    such as the debugging element. Not only do you need to be fluent with the skills
    at hand, but you also need to manage your time well, know where to go when the
    going gets tough, and know what to do when things are not going well.


    This hands-on-portion of the RHCE 302 focuses on the troubleshooting of Red Hat
    Linux. This chapter discusses methods, planning, and skills relating to the debugging
    of Red Hat Linux.


    Preparing for this section of the exam is difficult because you cannot be sure
    which element of Red Hat Linux will be broken, you won''t be sure exactly which
    tools you''ll have to fix the problems, and under no circumstances can you simply
    reinstall the broken component (or system). The debugging portion of the RHCE
    302 exam allows you two and a half hours (total) to fix two separate debugging
    issues.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# What to Expect


    When you go to take the debugging element of the exam, remain calm. The debugging
    skills work best when you have a clear mind. The biggest mistake people make during
    the debugging element is to worry about what will be broken on the system and
    to be stressed about the exam before taking it. Don''t make any assumptions about
    what you can or cannot do for the exam.


    When you enter the examination room, you''ll be seated at your machine and asked
    to stow away any tools, books, or other materials you brought with you. You''ll
    then be presented with any tools you''re allowed to use during the exam. As with
    the installation and configuration exam, you''ll be issued an objectives sheet,
    and when instructed to do so, you''ll turn it over and sign the nondisclosure
    agreement on the front page. When permitted, you can open the objectives handout
    and start the exam.


    When you''re finished with the first objective, you''ll document the problem was
    and how you fixed it. The instructor will then come to your machine, sign off
    on your objectives sheet, verify that you did or not fix the problem, and send
    you off for a quick break while he or she prepares your system for the next debugging
    objective.


    # How to Handle It


    After opening your objectives sheet, you''ll be given a result to work toward.
    A sample result could be something similar to "establish a networking connection
    from the workstation to the server using DHCP." This might sound simple, but the
    machine has been "sabotaged" to make the task much more difficult. First, the
    machine might not boot properly, and second, it might have something configured
    improperly in networking that doesn''t allow a simple configuration for DHCP (or
    it might).


    Regardless of what your objectives will be or part of your system will be broken,
    there are several steps you can follow to help you determine the problem and recover
    your system. Not all of the following steps will be required each time you troubleshoot
    a machine (in real life or on the exam):


    +   1. Boot your machine. See what happens, what errors you get, and where the
    system seems broken. Do you know where the error is? Can you fix the machine as
    is? If not, perhaps you need to boot the system into single-user mode and fix
    the problem. You might need to use system rescue disks.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# 2. Obtain boot disks.


    This set is created from your system and a boot image from the Red Hat 6.2 CD-ROM.
    (You''ll either create these disks from your installation and configuration exam
    or have them supplied by the instructor.)


    Use mkbootdisk for the first disk. This creates a boot disk for your system (used
    for emergencies, boot without LILO, and such). To create your boot disk, type
    mkbootdisk image where image is the image of your bootable kernel located in /boot.


    Use the boot.img or bootnet.img image from the Red Hat 6.2 CD-ROM for the second
    rescue disk. Type:


    ```

    dd if=/mnt/cdrom/images/boot.img of=/dev/fd0

    ```


    +   3. Boot your machine. If you can fix your problem by booting from single-user
    mode, type linux single at the LILO prompt, and proceed to the next step. Otherwise,
    check the system BIOS to see if it''s set to boot from floppy disk as its first
    option. Then boot with your boot disk or your bootable CD-ROM.


    +   4. Do you need to check your filesystems? First, use fdisk -l to print your
    partition table. Verify which you believe to be the filesystem partitions. After
    you''ve decided which one is your root filesystem (it will most likely be the
    largest one), you can use fsck to check the filesystem. If /(root) is /dev/hda4,
    then use fsck /dev/hda4.


    +   5. Do you need to mount your filesystems? (If you booted via the rescue disks,
    then yes, do.) can mount your filesystems using mount. Be sure to verify your
    partition table by using fdisk -l. You must mount your devices in a specific order.


    First, create a mount directory to mount your filesystems. For instance, if you
    want to mount root (/) and /boot, then create directories called /mnt/harddrive
    (for root) and /mnt/harddrive/boot (for boot). Next, mount your file systems.
    You must always mount your root file system and the remaining filesystems beyond
    the root file mountpoint. If /dev/hda4 is your root (/) file system and /dev/hda2
    is your boot file system, mount root (mount /dev/hda4/mnt/harddrive) and then
    boot (mount /dev/hda2/mnt/harddrive/boot).'
  merge: -1
  pgno: 346
- img_proc: true
  md: '6. Regardless of any appropriate changes to your system (single-user mode or
    with rescue disks), you''ll need to make any changes to your system to fix the
    problem (if the problem was something other than a corrupt filesystem, which is
    most likely the case for the RHCE 302 example).


    7. Did you have to change LILO? If you did, you have to rerun lilo to save the
    changes to your system. Run /sbin/lilo if you are in single-user mode. If you
    are in rescue mode, you will have to use lilo -r to specify where the root filesystem
    is (because you mounted it to /mnt/harddrive). To use lilo on the separated filesystem,
    use /mnt/harddrive/sbin/lilo -r /mnt/harddrive.


    8. Have you changed the disk? If so, then you need to synchronize your disk to
    ensure that the changes (changes made) are written to the hard disk. To do this,
    use sync. From the prompt, you might want to run this time once or twice to be
    absolutely positive that all of your system buffers were flushed and written to
    the disk.


    9. Are you ready to reboot? Well, if you''re in single-user mode, go for it. If
    you''re in rescue mode, you have to unmount your mounted filesystem. You have
    to do this in a specific order as well. Whereas when you mounted them, you mounted
    root (/) first, when you unmount them, you have to unmount root (/) partition
    (from these examples), use unmount /mnt/harddrive/boot. Next, unmount the root
    (/) partition by us- unmount /mnt/harddrive.


    10. Remove all disks (if necessary), and exit from the system. Power the system
    off, and try out the repaired system.


    Does your system boot properly? Good. You might not be through, however. Your
    objective sheet might list something in particular (such as networking, video,
    or sound) that isn''t working on the system. Because your system is now booting
    properly, you can fix whatever is specified, using your knowledge of setting up
    and configuring the item (covered in previous chapters, such as items discussed
    in Chapters 6, 8, 9, and 10).


    # Managing Your Time


    You''re given two and a half hours to complete two separate sets of objectives
    in the debugging portion of the exam. Try to use the following guidelines, and-
    get your time so that you can finish all objectives in the exam.


    +   - Plan—While previewing your objectives, make a mental (or paper) note of
    how long each task should take you. Try to budget only 1.25 hours (the the'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'exam time) for each objective sheet. (Remember, you won''t know what the second
    set of objectives is until you have completed the first.)


    +   Begin—Begin your exam within five minutes of receiving your objectives. Do
    not preview too long, or you''ll risk running out of time to complete the exam.
    Installation, configuration, and debugging all take time.


    +   When you get stuck—Each set of objectives will have two types of debugging
    elements involved. With this in mind, try to spend 25 percent of your time for
    each mini-objective. If you''ve spent more than half of your total time (50 percent
    of two and a half hours) on the first mini-objective, you might want to consult
    the instructor for help. Consulting for help on a mini-objective, however, means
    that you don''t get credit for that mini-objective. (If there are two mini-objectives
    in an objective, and you get help on one of them, you lose 50 percent for the
    single objective.) Although completing each mini-objective is critical to your
    score, running out of time and not completing the remaining objectives is detrimental.'
