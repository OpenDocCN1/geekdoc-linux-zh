    The FSF''s main project is the GNU project. Linux is composed of the Linux kernel
    and many GNU programs and utilities. Some popular GNU tools that are used frequently
    are Bash, CVS, and Emacs, GCC, ghostview, the Gimp, gzip, itpool, screen, and
    tar. These are just few of the existing GNU programs available, however. In fact,
    the GNU tools are often available for other commercial versions of Unix as well.


    Due to the large number of GNU tools that are used within Linux, and those that
    help the Linux distribution, some Linux advocates and evangelists differ in their
    opinions of what to call Linux. Many GNU evangelists insist on calling Linux "GNU/Linux"
    or "Lignux". Personally I simply call it "Linux". However, I do credit the GNU
    tools for making Linux work. Therefore, as in the debate about how to pronounce
    Linux (lie-nucks, lih-nucks, or lee-nooks), I have no preference about what you
    call Linux.


    Note: Some components of Linux were incorporated from various versions of Unix.
    For instance, the X Window System was actually derived from BSD.


    # The GNU General Public License (GPL)


    The General Public License (GPL) is the license that most open source projects
    use for their software. Developed in the late 1980s, the GPL has not been revised
    since its publication in 1991. The GPL is quite extensive, and many of its users
    interpret the document in different ways. The GPL''s text is included in this
    book''s Appendix. Read it for a better understanding of the foundation of the
    open source community.


    ![](img/fe9012f0d9b0102febe0e70f330ee448_45_0.png)


    Although you aren''t tested on this information in the RHCE Exam 302, you are
    required to have working knowledge of it.'
