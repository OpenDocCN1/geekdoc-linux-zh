    # Sound Support


    For systems with sound cards, you should enable sound support. The prompt to enable
    sound support is simply Sound Card Support. Turning this option allows you to
    configure support for sound cards and to configure various options for the Linux
    kernel sound driver.


    # Additional Low-Level Sound Drivers


    If you are unable to find the support for your sound card within the Sound Support
    category, you might find it in the Additional Low-Level Sound Drivers category.
    Some of the options found here include AWE32 synth, Gallant Audio cards, and options
    for some sound-card joystick interfaces.


    # Kernel Hacking


    A final category for configuring your kernel is Kernel Hacking. This category
    has only one option, which you use to configure support for the SysRq key. This
    option turns on support for various "magic" key sequences using Alt+SysRq on the
    standard PC keyboard. These sequences synchronize all mounted filesystems, kill
    all processes on the virtual console, reboot the system, and so on. This option
    can be very convenient, but you should not turn it on for systems where access
    to the system''s console could be a security risk.


    # Compiling and Installing a Custom Kernel


    When compiling and installing a kernel, you use various options. There are as
    many as 11 options that you can use when compiling and installing your kernel
    from start to finish; I''ll describe them in this section. Follow these steps
    to compile and install a new kernel:


    +   1. You must first configure your kernel as discussed in the "Kernel Options"
    earlier in this chapter. There are several options available to configure your
    kernel. First, to compile your kernel, you must be in the /usr/src/linux directory.
    Next, if you plan to configure your kernel completely from scratch, use make mrproper.
    Doing so removes your current .config file and allows you to set up all new options
    for your kernel without knowing your default configuration. If you want to see'
