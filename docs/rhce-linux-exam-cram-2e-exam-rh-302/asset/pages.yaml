  md: '# Introduction


    Welcome to RHCE Linux Exam Cram, Second Edition! This book aims to help you get
    ready to take—and pass—the Red Hat certification exam RHCE 302. This Introduction
    explains Red Hat''s certification programs in general and talks about how the
    Exam Cram helps help you prepare for Red Hat''s certification exams.


    Exam Cram helps you understand and appreciate the subjects and materials you need
    to pass Red Hat certification exams. Exam Cram is aimed at test preparation and
    review. They do not teach everything you need to know about a topic (the ins and
    outs of building RPMs). In-stead, I present and dissect the questions and problems
    I''ve found that you''re likely to encounter on a test. I''ve worked from Red
    Hat''s own training materials, preparation guides, and tests. My aim is to bring
    together as much information as possible about Red Hat certification exams.


    Nevertheless, to completely prepare yourself for any Red Hat test, you should
    begin by taking the Self-Assessment included in this book (immediately following
    this Introduction). This tool will help you evaluate your knowledge base against
    the requirements for RHCE under both ideal and real circumstances.


    Based on what you learn from that exercise, you might decide to begin your studies
    with some classroom training, or you might pick up and read one of the many Linux
    guides available from Red Hat or third-party vendors. I strongly recommend that
    you also install and configure the software and tools that you''ll be tested on,
    because nothing beats hands-on experience and familiarity when it comes to understanding
    the questions you''re likely to encounter on a certification test. Book learning
    is essential, but hands-on experience is the best teacher of all—especially two-thirds
    of the exam is hands-on.


    # The Red Hat Certified Engineer (RHCE) Program


    The RHCE exam is made up of three parts:


    +   - Installation and Configuration Lab Exam


    +   - Debugging Lab Exam'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction


    +   - Written Exam


    The three exams are taken on the same day and are each graded individually. The
    RHCE taker must receive a composite score of 80 percent on all three exams, with
    no single score dropping below 50 percent.


    The best place to keep tabs on the RHCE program and its various certifications
    is on the Red Hat Web site. The current URL for the RHCE program is: http://www.redhat.com/training/rhce/courses/.
    Red Hat''s Web sites change frequently, so if this URL does not work, try the
    Search tool on Red Hat''s site with either “RHCE” or the quoted phrase “Red Hat
    Certified Engineer Program” as the search string. This will help you find the
    latest and most accurate information about the company''s certification programs.


    # Taking a Certification Exam


    Alas, testing is not free. Your exam could cost from $349 to $749 (depending on
    whether you participate in the training program or take the exam-only approach).
    Currently, exams are administered by Red Hat. To reach the Red RHCE team, email
    training@redhat.com. Exams are also offered by Global Knowledge (http://db.globalknowledge.com/catalog/certlisting.asp?code=RHCE)
    and IBM Global Services (http://www-3ibm.com/services/spotlight/linux.html).


    To schedule an exam, call at least 10 days in advance. Exam seats are limited
    and are often booked solid two months in advance. To cancel or reschedule an exam,
    you must call at least 2 days before the scheduled test time to receive any sort
    of refund (For canceling 2 days in advance, you are billed 80 percent; for 3 to
    10 days in advance, you are billed 50 percent; and for more than 10 business days
    in advance, you are given a full refund.) When calling Red Hat, please have the
    following information ready for the RHCE staff member who handles your call:


    +   - Your name, organization, and mailing address.


    +   - A method of payment. (The most convenient approach is to supply a valid
    credit card number with sufficient credit. Otherwise, payments by check, money
    order, or purchase order must be received before a test is scheduled. If the latter
    methods are required, ask your order taker for more details.)


    On the day of the test, arrive at least 15 minutes before the scheduled time slot.
    You must bring and supply two forms of identification, one of which must be a
    photo ID.


    All exams are completely closed-book. You will be required to stow anything brought
    with you under your desk. You will be furnished with a blank'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Introduction


    sheet of paper, a pencil, and any other tools you might need for your exam. I
    suggest that you immediately write down on that sheet of paper all the information
    you''ve memorized for the test.


    When you complete a Red Hat certification exam component, you will report to your
    instructor. The instructor will sign off on your lab exam, instructing you on
    the next step, or you will turn in your written exam and be excused for a break.
    All exam components are scored on a percentage basis.


    # How to Prepare for an Exam


    Preparing for any Linux exam requires that you obtain and study materials designed
    to provide comprehensive information about Red Hat Linux and the specific exam
    for which you are preparing. The following list of materials will help you study
    and prepare:


    +   - The Red Linux 6.2 manuals (or online documentation found on Red Hat''s Web
    site)


    +   - The Linux Documentation Project (online resource found at http://www.linuxdoc.org/)


    +   - Red Hat Hat Preparation Site (online resource found at http://rhce2b.com/)


    In addition, you''ll probably find the following training courses useful in your
    quest for Red Hat Linux expertise:


    +   - RHCE 300 Certification Training—Red Hat Inc. (Durham, NC) offers an RHCE
    300 Certification course. The course is a week-long adventure and includes a full
    day of examinations. Current perks of the course include daily catered lunches
    and all the soda and juice you can handle. You pay for it in the long run, however,
    the week-long course (which includes the exam fee) is currently priced at $2,498.


    +   - Other Red Hat Inc. Training—Red Hat Inc. offers three additional courses
    to help you learn Red Hat Linux. They include RH033 (Introduction to Red Linux
    I and II), RH133 (Red Hat Linux System Administration I and II), and RH253 (Red
    Hat Networking and Security Administration). Each class is a four-day program,
    and prices range from $1,098 (RH033) to $2,198 (RH253).


    +   - Study guides—Several publishers—including the Coriolis Group—offer Linux
    titles. The Coriolis Group series includes the following:


    +   - The Exam Cram series—These books give you information about the material
    you need to know to pass the tests.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introduction


    +   The Exam Prep series—These books provide a greater level of detail than the
    Exam Cram books are designed to teach you everything you need to know from an
    exam perspective. Each book comes with a CD that contains interactive practice
    exams in a variety of testing formats.


    Together, the two series make a perfect pair. Check ExamCram.com for additional
    products from Coriolis.


    You''ll find that this book will complement your studying and preparation for
    the exam, either on your own or with the aid of the previously mentioned study
    programs. In the section that follows, I''ll explain how this book works and why
    this book counts as a member of the required and recommended materials.


    # About this Book


    Each Exam Cram chapter follows a regular structure, along with graphical cues
    about important or useful information. Here''s the structure of a typical chapter:


    +   Opening hotlists—Each chapter begins with a list of the terms, tools, and
    techniques that you must learn and understand before you can be fully conversant
    with the chapter''s subject matter. The hotlists are followed by one or two introductory
    paragraphs to set the stage for the rest of the chapter.


    +   Topical coverage—After the opening hotlists, each chapter covers a series
    of topics related to the chapter''s subject. Throughout this section, I highlight
    important topics or concepts as Exam Alerts, like this:


