  md: '# Practice Questions


    # Question 1


    | What type of boot image is required to use kickstart when you use a CD-ROM?
    |

    | a. bootnet.img |

    | b. boot.img |

    | c. ks.cfg |

    | d. ks.img |


    Answer b is correct. Answer a is incorrect because the bootnet.img image file
    is used for doing network installations. Answer c is incorrect because ks.cfg
    is a configuration file used with kickstart, not a boot image. Answer d is incorrect
    because ks.img isn''t a valid option.


    # Question 2


    | You must have a DHCP server in order to use kickstart. |

    | a. True |

    | b. False |


    Answer b is correct. A DHCP server is not required with either type of kickstart
    installation. The CD-ROM doesn''t require the DHCP server during installation,
    even if you''re planning to use DHCP for the systems. In addition, with network
    installations, DHCP servers are required only if you need the DHCP server to assign
    individual ks.cfg files for each machine (to assign individual static IP addresses
    and so on).


