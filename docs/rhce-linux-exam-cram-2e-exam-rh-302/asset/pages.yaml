  md: '# Practice Questions


    # Question 1


    | Who developed Linux?

    | a. Linus Torvalds

    | b. Richard Stallman

    | c. Bob Young

    | d. None of the above |


    Answer a is correct. This is a tricky question because both answers a and d would
    be correct by today''s definition. Technically, Linux is developed by thousands
    of individuals, not just one. However, though a very large community helps to
    develop Linux today, the original developer was Linus Torvalds.


    # Question 2


    | What is the GPL and what is its purpose? |


    The GPL is the General Public License. Its purpose is to protect the copyright
    and the open source or free-software characteristics that the author of a software
    package wishes to keep. This license prevents other authors, companies, and so
    on from using the software source, making modifications, and redistributing it
    without redistributing the code as well.


    # Question 3


    | Who founded the FSF and began the GNU Project?

    | a. Linus Torvalds

    | b. Richard Stallman

    | c. Bob Young

    | d. None of the above |


    Answer b is correct. Richard Stallman founded the FSF and began the GNU Project.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Question 4


    Who founded Red Hat?


    Red Hat was a cooperative project between two entrepreneurs, Bob Young and Mark
    Ewing.


    # Question 5


    +   What online resource can you use for documentation and links for help with
    Linux-related programs, hardware, and more?

    - a. http://www.microsoft.com

    - b. http://linuxdoc.org/

    - c. http://www.compac.com

    - d. http://www.slashdot.org


    Answer b is correct. All of these sites offer interesting Linux information of
    sorts; however, the best place to find help and documentation for your Linux issues
    is the Linux Documentation Project, found at http://www.linuxdoc.org/.


    # Question 6


    +   Red Hat is the primary developer of Linux.

    - a. True

    - b. False


    Answer b is correct. Linux is developed by teams, companies, and programmers from
    all over the world. Red Hat does have staff members who develop parts of Linux,
    but it''s not their main business. Rather, Red Hat helps the community by packaging,
    testing, bug fixing, developing, and supporting different parts of Linux.'
  merge: -1
  pgno: 54
- img_proc: true
