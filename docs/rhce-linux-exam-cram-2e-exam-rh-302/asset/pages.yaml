  md: '# Practice Questions


    # Question 1


    | What command(s) can you use to create a Linux installation boot floppy? |

    | a. bb and rawwrite |

    | b. dd and rawwrite |

    | c. vi and pico |

    | d. mkboot disk |


    Answer b is correct. The dd and rawwrite tools are the Unix and DOS tools used
    to create an installation boot disk. The mkbootdisk command (answer d) is used
    to create after-installation boot disks, such as those used in Rescue boot-disk
    sets. Answers a and c are incorrect because bb is not a valid command, and both
    vi and pico are text-editing tools, not commands for writing to a boot floppy.


    # Question 2


    | What types of installations require a special boot disk? [Check all correct
    answers] |

    | a. PCMCIA |

    | b. FTP |

    | c. NFS |

    | d. HTTP |

    | e. Samba |


    Answer a, b, c, and d are correct. An installation that requires a PCMCIA device
    (answer a)—such as a CD-ROM or a network card—during installation needs a boot
    disk made with the pcmcia.img image. FTP (answer b), NFS (answer c), and HTTP
    (answer d) all require a boot disk made with the bootnet.img. Answer e is incorrect
    because Samba is no longer supported as of Red Hat 6.2.'
  merge: -1
