    unfsid. Normally, it will pass control to the kernel nfsfd and exit.</span>*


    # Configuring NFS Server Exports


    The knfsd server uses /etc/exports to configure exported filesystems. The format
    of the file entries is typically


    /path/to/export host(options)


    The first field (/path/to/export) is the path that you want to make available
    via NFS. An example would be /mnt/cdrom. The second field (host) is the host name
    (IP address or address/netmask) to which you want the filesystem exported. If
    nothing is supplied for host, the filesystem is exported to the world. The last
    field (options) is a comma-separated list of export options. Some standard examples
    are ro for read-only and rw for read-write. An example of the options can be (ro)
    specifying that the exported filesystem is read-only or'
