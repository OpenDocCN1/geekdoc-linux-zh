    ```

    export DISPLAY=remotemachine:0.0

    ```


    After this string is executed, that shell''s display is set to the remote machine
    specified. Any commands executed in that shell are then displayed to the remote
    machine.


    To display a single command to another host, use the


    ```

    command DISPLAY=remotemachine:0 command

