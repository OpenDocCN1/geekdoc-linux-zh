    # Sample ipchains


    The following are some ipchains rules and their explanations. The sample scenario
    is set up on a router (192.168.0.254) controlling a 192.168.0.x network:


    +   - -P input -j REJECT—Rejects all incoming packets unless specified with an
    ALLOW in the input chain.


    +   -A input -icmp -j DENY—Adds to the input chain a rule that drops all ICMP
    packets into the network.


    +   -A output -tcp -j ALLOW—Adds to the output chain a rule that ALLOW all TCP
    packets to go out of the network.


    +   -A input -s 192.168.50.2 -j REJECT—Adds to the input chain a rule that rejects
    all packets from 192.168.50.2 coming into the network.


    | Table 11.5 ipchains targets. |

    | Target | Description |

    | ACCEPT | Allows the packet through. |

    | DENY | Drops the packet. |

    | REJECT | Similar to DENY, but sends an ICMP message back to the sender, stating
    that the packet was dropped. |

    | MASQ | Used only in forward chains (or user-defined chains). Requires CONFIG_IP_MASQUERADE
    to be compiled in the Linux kernel. Packets are masqueraded as if they originated
    from the local host. (Reverse packets are also demqueraded automatically, bypassing
    the forwarding chain.) See the section titled "IP Masquerading" for more information.
    |

    | REDIRECT | Used only in forward chains (or user-defined chains). Requires CONFIG_IP_TRANSPARENT_PROXY
    to be compiled in the Linux kernel. Packets are redirected to a local socket.
    |'
