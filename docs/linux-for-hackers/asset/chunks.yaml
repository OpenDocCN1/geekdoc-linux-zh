    Bash 取自于缩写 Bourne Again Shell。Bash 是一种带有语法的命令语言。Bash 使用自然人类语言来拟定命令。Bash 还具有其他额外功能，如迭代、作业控制、字符串处理、函数、扩展等。这些
    Bash 特性的每一个都允许最大程度的控制和维护以及批处理。Bash 解释并处理所有输入到 shell 的命令。Bash 构系统管理以及整个系统开发的核心部分。脚本基本上是用户编写命令的地方。Linux
    系统默认内置了 `bash`，这对黑客来说是一个额外的优势。Shell 脚本涉及让 shell 解析并执行命令。Shell 脚本是 shell 被指派完成的程序。


    bash 脚本是计算机在运行时遵循的脚本。脚本告诉计算机在执行特定动作后要做什么或说什么。Bash 脚本类似于剧本或表演，演员将遵循并说脚本所说的或要求他们做的事。Bash
    脚本通常允许用户使用或输入任何可以在脚本中逐个使用或执行的命令。每天逐个执行命令可能是乏味的，而且会产生很多错误。因此，确保任务减少并使事务自动化至关重要。自动化不仅让事情变得更舒适，还减少了可能阻止程序运行的错误。因此，为了避免逐个执行命令的过程，使用了脚本。脚本将包含程序运行所需的所有命令并一起运行。


    开发 bash 脚本只需要用户具有使用命令行的基础知识。该过程有三个步骤要遵循，如下文所示。


    ### 创建 bin 目录

    这是一个存储可执行程序的子目录。这个 `bin` 充当创建的 bash 脚本的存储器或家。可以通过以下命令完成。


    ```bash

    cd ~/

    mkdir bin

    ```


    ###将 bin 目录导出到 PATH

    ```bash

    export PATH=$HOME/$USER/bin:$PATH

    ```

    将 `bin` 添加到 `PATH` 允许用户轻松找到程序。将你的 bin 目录添加到路径。编辑你的 `.bashrc` 文件（或可用文件）将 `~/bin`
    添加路径。将可执行文件复制到此 bin 目录，或从用户 bin 目录向你想使用的可执行文件创建符号链接。


    ### 创建 bash 脚本

    创建 bash 脚本时，他们需要告诉计算机他们正在创建一个 bash 脚本。实现这一点的方法是通过 `#!/bin/bash`。此命令将通知计算机正在制作
    bash 脚本。之后是用户想要让程序显示的命令。编写脚本时应使用特定的语法。例如，当用户希望在程序运行时显示某些内容时，他们将使用 `echo` 语法，后面跟上引号中他们想说的内容。例如，你想让程序在脚本运行后显示
    welcome 一词；你可以输入以下内容：


    ```bash

    echo "welcome."

    ```

    当程序运行时，它将在屏幕上显示 welcome 一词。为了在程序响应和下一个动作之间输入时间，将使用 `sleep` 语法，后面跟着他们想要暂停的时间。例如
    `sleep 5`，该命令意味着程序将在执行下一个命令之前始终暂停五秒。完成后，只需按 `CTRL + X` 退出，并将要求根据你给程序命名的保存文件。需要注意的是，bash
    脚本可以非常长。脚本的大小取决于用户希望程序自动运行而无需用户参与的同时活动数量。例如，当按下计算机上的关机按钮时，计算机运行 bash 脚本，允许它在关电之前保存所有工作并关闭运行中的应用程序。所有这些活动都遵循
    bash 脚本，计算机上的许多应用程序和操作也是如此。


    一旦人员保存了 bash 脚本，他们必须使脚本变得可执行。这涉及将脚本模式更改为可执行版本。更改模式将涉及用户输入以下内容。


    ```bash

    chmod +X <name of the file>

    ```

    在此之后，用户将输入


    ```bash

    ./<name of the file>

    ```

    一旦按下回车，脚本将根据其输入和执行的方式运行。bash 脚本还将包含更多语法和命令，这些有助于压缩许多手动运行但可以自动运行的命令。这将确保用户不需要做太多，而是由程序自动运行。因此，bash
    脚本为程序提供了一定程度的自动化。


    ### 变量

    bash 脚本中的变量对于完成整个脚本至关重要。用户必须分配变量并赋予含义。例如，可以给字母 `X` 分配一个变量。在脚本中，将输入如下内容。


    ```bash

    #!/bin/bash

    X="1."

    ```

    变量意味着当用户在代码中插入特定变量时，建议分配给它的值。这有助于缩短脚本中的单词数。检索变量涉及在终端上输入变量和 `echo` 语法。该过程如下。


    ```bash

    echo $X

    ```

