    Introduction


    In this book, we shall learn how an operating system called Linux works and how
    hackers can use this tool to help them hack. Linux is an operating system (OS)
    created by Linus Torvalds early in the 1990s and is a popular choice to work with
    today. The main part behind this to ensure that it works is the Linux Kernel which
    is available for free. Unlike Microsoft Windows which is easier to use, Linux
    may seem a bit more difficult to work with. But this is mostly because we have
    to actually do some coding and use the command line, rather than the graphical
    interfaces, to make things work and to bring up the programs we want.


    An operating system helps you go about tasks on a computer like writing, browsing
    the internet or doing many other activities. If the installation of the operating
    system is not on your desktop, then you will be unable to use your computer. Even
    for you to be able to read this content you need an operating system. The kernel
    is the heartbeat of the Linux system, and they can be of different types such
    as Ubuntu, Fedora, and Debian.


    Here, you will get to understand the different types of Linux distributions, how
    each of the distribution work and which one can best suit your preferences. The
    skills needed for you to start the hacking techniques to enable a smooth hacking
    process. With the detailed review of what you need, then getting started will
    become easy for you. 


    # Chapter 1:


    # Preview of the Linux Operating System


    Preview of How Linux Works


    Linux Kernel distinguishes this OS from other OSs. The Kernel is the coding used
    to develop Linux, and over the years, many developers keep upgrading the version.
    That is why for you to hack using Linux, you must understand how Linux Kernel
    works. The Kernel is in the innermost part of the operating system where it does
    jobs like:


     managing the hardware.


     Do the essentials services of the OS.


     Allocates resources evenly. '
