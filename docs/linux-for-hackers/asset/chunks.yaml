  raw: 'IT experts have the duty to ensure organizations'' network security and systems
    are safe from all hackers. Through advanced penetration, they ensure that all
    hacking attempts are detected and stopped before they even occur. Advanced penetration
    usually involves experts utilizing the same techniques or methods often used by
    hackers to get into their systems. Hackers begin by monitoring an organization''s
    technical landscape to try and identify any loopholes they can get through. Once
    they identify any loop-holes within the system, then they go-ahead to launch their
    attacks. Similarly, pen testers take their time exploring the network and security
    system and simulate similar attacks to try and identify those areas which could
    be potential loop-holes. Pen testers use penetration testing when they are augmenting
    a web application firewall (WAF). The main aim of penetration testing is detecting
    any inputs that could be at risk of code injection attacks.


    ### Penetration testing stages


    1) Planning and reconnaissance


    The first stage in pen-testing involves outlining a clear plan for the test. The
    pen tester has to lay out a strategy with goals on how they will carry out the
    test, the systems to be tested, and the methods that will be used during testing.
    The pen tester then goes ahead to gather all relevant information concerning the
    target for the test. For instance, the pen tester needs to seek intelligence on
    domain and network names before conducting the test. 


    2) Scanning


    The second stage involves trying to predict how the target application will respond
    upon intrusion. Pen testers have access to two tools that they can use to understand
    the target application more effectively.


    a) Static analysis


    This tool allows pen testers to investigate an application to determine how it
    will react while running. This method involves examining a code without necessarily
    running any program in the system. Static analysis allows experts to have an in-depth
    understanding of the code structure. Static analysis allows for identification
    of any system errors that could potentially make the system vulnerable to cyber
    attacks 


    b) Dynamic analysis


    After conducting a static analysis, a dynamic analysis should be conducted right
    after. Dynamic analysis operates by identifying more subtle errors that could
    not be identified during the static analysis. Dynamic analysis involves investigation
    of the code while running a program. One advantage of dynamic analysis is that
    it provides real-time information that allows easy identification of vulnerabilities
    within the system. Other than being reliable in the identification of errors,
    the dynamic analysis also allows programmers to eliminate programs that are unnecessary
    in the system. The dynamic analysis also cross-checks on the compatibility of
    the program being tested with other programs.


    3) Gaining Access


    In gaining access, pen testers have to use web application attacks to try and
    identify vulnerabilities within the target. T launch this attack, programmers
    can use any of the web application attacks running from backdoors, cross-site
    scripting, and SQL-injection. Once an attack is launched, pen testers use different
    strategies to try and exploit all vulnerable points. Testers can either intercept
    traffic, steal available data, or escalate some of the privileges in an attempt
    to see how the system will behave.


    4) Maintaining access


    The next step involves investigating how long hackers might last in the system
    after they gain access. Testers have to imitate advanced persistent threats to
    try to determine how long attackers might last within their systems. Advanced
    persistent threat attacks are often executed with the intention of spending longer
    periods within the system with the aim of gaining in-depth access to organizations''
    systems. Through imitating this type of attack, testers get to see how long a
    potential threat could last within their systems.


    5) Analysis


    The final stage involves a thorough analysis of all the activities conducted during
    penetration testing. Pen testers write a comprehensive report that includes;


     All sensitive data that was accessed


     All vulnerabilities that were exploited


     Amount of time is taken within the target before detection


    ### Penetration Testing Methods


    1) Internal testing


    In this case, a tester simulates attacks by a ‘malicious insider.’ In this case,
    the tester has access to the application as they can get behind the system''s
    firewall.


    2) External testing


    Pen testers during an external testing target all company assets that can be accessed
    on the internet. The goal of external testing is to access either company domain
    name servers or company email to try and extract data from these targets. 


    3) Blind testing


    In blind-testing, the tester is only presented with a company name. the tester
    then has to act like a real hacker and try to maneuver their way into the system.
    Organizations use this method to study real-time hacker activities. 


    4) Double-blind testing


    In this case, both the tester and the security personal goes in blind. The tester
    only has a name to work with. The security personnel is also not informed prior
    to the attack. The main aim is to study how fast the security personnel will respond
    to an attack.


    5) Targeting testing


    In this case, the testers work hand in hand with the security personnel. the testers
    update the security team of any movements they make within the system so that
    the security tea, can counter with a secure move.


    ### Penetration Testing Methodologies


    1.  Black-box penetration testing


    In black-box testing, the pen tester in given no source code or any vital information
    on the system. the tester lacks prior knowledge of the system, and the testing
    relies entirely on their analysis of the systems and any currently running programs.
    Testers have to utilize all available scanning tools to try and identify any vulnerabilities.
    Black-box testing has proven to be inefficient as testers ay end up not detecting
    any vulnerabilities for failing to breach the security system.


    2.  Gray-box penetration testing


    A grey-box tester, on the other hand, has some level of knowledge on the network’s
    internal system. Gray-box testers are well-informed of the systems architecture
    and documentation. A grey-box tester only has to focus on systems that pose the
    greatest risk. Pen testers have to prioritize on high-risk systems, instead of
    wasting time trying to understand the information first.


    3.  White-box penetration testing


    White-box testing is also known as open-box or auxiliary testing. Much like gray-box
    testing, pen testers are provided with full information on the system and any
    architectural documents. In this method, testers conduct static code analysis
    as well as dynamic analysis. White-box penetration allows testers to conduct both
    internal and external assessment of the system. By combining both static and dynamic
    analysis, pen testers ensure that they do not miss any vulnerable entry points
    that hackers can maneuver their way into. white-box penetration is a more integrated
    target method as it involves pen testers working together with developers to identify
    and fix all vulnerabilities.


     Speed, Efficiency, and Coverage


    Black-box testing is the fastest method in penetration testing when compared to
    gray-box and white-box testing. One shortcoming with black-box testing, however,
    is on the fact that testers have limited access to any information pertaining
    to the system. the limited information lowers the efficiency of the methodology
    as testers may end up missing some of the essential vulnerabilities. Pen testers
    using black-box testing are bound to miss some vulnerabilities as they have little
    to no information on high-risk targets within the system.'
