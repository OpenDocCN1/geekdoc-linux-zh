    # 引言


    Linux 操作系统自带 300 多种预装工具，你可能在黑客攻击过程中需要这些工具，而其他的 Linux 工具可以轻松从网上下载。通过 Linux，只要你知道如何使用这些工具以及如何根据你的需求操纵它们，黑客攻击过程就会变得简单。


    # 在开始黑客操作之前你需要了解的知识


    黑客攻击是一门艺术，因此需要多年的实践才能完全精通，并学会如何处理针对系统的各种攻击。在开始练习黑客操作的过程中，对黑客一无所知也没有关系。但请注意，一个拥有计算机常识但没有编程知识的新手是非常危险的。因此，为了成为黑客专家，你需要在实践中付出大量努力。


    # 开始 Linux 所需的条件


    对于没有任何知识的初学者，你首先需要访问 Kali Linux 官方页面，然后关于 Linux 系统的基础知识。然后访问他们的下载页面并下载 Kali Linux
    iOS 文件。在开始之前，你需要了解如何安装最新版本的 Kali Linux 操作系统。下面的步骤将显示如何安装它。


    ## 安装 Kali Linux


    你有两种方法可以安装 Kali，例如使用 USB 安装到硬盘上，以及使用 VMware 安装。我们的重点是后者：


    ### 在 VMware 中安装 Kali Linux


    **第一步**

    首先，你应该识别你电脑的性能，是 64 位还是 32 位。如果你的电脑是 64 位的，那么你需要 64 位版本。如果你不确定电脑的版本或它是 32 位的，那么你需要
    32 位版本。


    **第二步**

    然后你通过浏览器的下载管理器点击 ISO 或点击种子（torrent）来下载 Linux。强烈建议使用种子，因为它速度更快。下载完成后，创建一个虚拟机。


    **第三步**

    在出现的窗口中选择安装程序磁盘映像文件（`ISO`），然后在浏览部分选择 Kali Linux ISO 文件。选择后，点击“下一步”。


    **第四步**

    在出现的工具箱中，为你的虚拟机选择一个标题。你可以使用如 `Virtual kali` 的名称。你还应该为它选择一个位置。建议在我的文档中将该文件夹命名为
    `Virtual machines`，然后点击“下一步”。


    **第五步**

    下一步是设置 Kali 的最大容量，不应小于 20 GB。不过，建议你使用 30 GB，因为 Kali 会随着时间的推移而扩大。选择 Kali 的容量后，在下一个选项中更改为将虚拟磁盘存储为单个文件，然后点击“下一步”。


    **第六步**

    在出现的窗口中，点击“自定义硬件”选项按钮对某些硬件设置进行自定义。


    **第七步**

    现在，会为你呈现一个硬件设置窗口。在左侧窗格中选择“内存（Memory）”，然后在右侧窗口中将滑块滑动到至少 512 MB。请注意，你分配给虚拟机的最大内存不应超过已安装内存的一半。例如，如果你的电脑有
    8 GB 内存，那么滑块给出的最大值应为 4 GB。在左侧面板中，高亮“处理器（processors）”。该选项很大取决于你电脑的处理器。如果你的电脑有多个处理器，那么你应该选择多个处理器以获得高效性能。在左侧，点击“新建适配器（New
    Adaptor）”，然后在右侧将圆点移动到桥接（顶部）选项并点击“适配器（Adapters）”按钮。系统会自动弹出一个小窗口，你可以在其中取消除网络适配器之外的所有选项，然后点击“确定（OK）”。在硬件设置底部，关闭，然后在向导中点击“完成（Finish）”。


    **第八步**

    一旦你点击完成按钮，新的虚拟机将添加到虚拟机库中。启动 Linux 以进行安装。在右侧面板中高亮创建的虚拟机名称以完成安装。


    **第 9 步**

    在出现的启动菜单上，使用向下箭头滚动到“图形化安装（Graphical install）”并按回车。


    **第 10 步**

    选择你偏好的语言；使用鼠标或方向键滚动，然后按回车。


    **第 11 步**

    在随后出现的屏幕上选择你的位置并点击“继续（continue）”。


    **第 12 步**

    系统将询问你的键盘布局，例如，你可以选择阿拉伯键盘。注意这将取决于你理解的语言。


    **第 14 步**

    Kali 将删除你电脑上的硬件，然后点击“继续”，但先不要配置网络。


    **第 15 步**

    你将设置计算机主机，它将作为你的计算机名称。点击“继续”。


    **第 16 步**

    在下一个窗口中，为主主账户设置你偏好的 root 密码。然后确认输入的密码并点击“继续”。


    **第 17 步**

    Linux 现在将确定磁盘分区，然后将向你显示一个对话框，选择第一个选项并继续，确保所有文件都在一个文件中并点击继续。通过选择“完成分区（Finish partitioning）”确认要进行的更改，并更改磁盘并确认更改。操作系统现在将安装，可能需要长达
    30 分钟。


    **第 18 步**

    在询问网络镜像（network mirror）时，选择“否”。


    **第 19 步**

    安装程序将询问是否安装 `GRUG` 并接受它。此时安装过程已完成，并将显示成功通知。

    操作系统将重启，然后你就可以使用密码登录了。


    ## 存储管理


    存储管理是指管理存储设备的过程。Linux 有许多工具可以管理存储驱动器和硬件设备。Linux 在存储管理方面执行：


    ### 内存管理

    内核允许进程在需要时访问内存，因为它拥有系统内存。


    ### 设备管理

    内核允许进程访问外围设备。


    ### 任务管理

    内核允许应用程序执行。它在软件和硬件之间进行上下文切换。


    ### 存储管理方法

    - 提供将 LUN 回到所需路径的选项

    - 监控并在路径变化时通知

    - 提供多路径设备重映射命名的自定义选项

    - 提供基于策略的路径和分组，供用户通过定义路径自定义 I/O

    - 促进路径之间的负载均衡


    ## 块存储


    Linux 内核中的块存储仅仅是块设备的同义词。块设备是任何存储数据的硬件设备，如闪存内存、固态硬盘（`SSD`）和机械硬盘（`HDD`）。基本上，块设备在计算机中通常被称为磁盘存储。一旦设置，块设备将作为设备上当前文件系统的扩展，因此你可以在驱动器上读取甚至写入信息。


