    \ Linux 的操作系统是如何运作的，以及黑客如何利用这个工具来帮助他们。Linux 是由 Linus Torvalds 在 20 世纪 90 年代初创建的操作系统（OS），目前是非常流行的选择。确保其正常运行的核心部分是\
    \ Linux 内核，它是免费的。与更容易使用的微软 Windows 相比，Linux 看起来可能有点难以处理。但这主要是因为我们必须实际进行一些编码并使用命令行，而不是图形界面来让一切运行。\n\
    \n## Linux 内核\n\nLinux 内核将此操作系统与其他操作系统区分开来。内核是开发 Linux 的代码，在多年来，许多开发者一直在更新版本。这就是为什么如果你想用\
    \ Linux 进行黑客攻击，你必须了解 Linux 内核是如何工作的。内核位于操作系统的最内层，它执行以下工作：\n\n* 管理硬件。\n* 执行操作系统的基本服务。\n\
    * 分配资源均衡。\n\n"
