    Hackers prefer Linux to Windows due to its extreme reliability. Unlike Windows
    that requires one to keep re-installing software, Linux has none of that. Linux
    allows smooth operation and allows the system to run smoothly longer than Windows.
    Linux does not bother hackers to keep rebooting their systems for reasons such
    as software installation. Another fact that makes Linux more reliable is because
    of the web servers that use it like Facebook.


    ## Linux is Free

    Linux is free to all members of the public, making it more suitable for all hackers.
    Linux does not require any fee from its users. Hackers can freely access Linux
    distro like `Fedora` and `Ubuntu`. Hackers barely spend anything on Linux, as
    they do not have to purchase any license before using the software. Linux has
    a general public license that saves hackers a whole lot of money. Most of the
    hacking tools are also written for Linux users, making their work even more comfortable.


    ## Easy maintenance and Multitasking

    Linux is easy to use and maintain. Hackers only need to install the software,
    and they are good to go. Linux has its software repository that makes using it
    even more comfortable. Hackers have access to embedded systems as well as high-performance
    applications when using this server. Linux allows users to perform several tasks
    all at once. Linux does not present issues such as hanging or freezing due to
    being ‘overworked.’ The system will enable users to run as many programs as possible
    without affecting each other as compared to Windows. Linux is also free from issues
    such as slow processing that can slow down the activities of hackers.


    ## Linux is network friendly and Easy to Install

    Almost all Linux distributions are user-friendly. The Linux distribution allows
    for the easy installation of the operating system. the distributions also provide
    hackers with user-friendly software. Linux also has a swift boot system compared
    to that used by other systems. All hackers need a faster network to complete their
    activities in the shortest time possible. Linux allows hackers to test their networks
    using various commands. Linux is not only fast but also reliable enough to allow
    access to a faster network compared to other systems.


    ## Bash scripting

    Bash is drawn from the initials, Bourne Again Shell. Bash is a command language
    with syntax. Bash uses natural human language to formulate the commands. Bash
    also has additional features such as iteration, job control, string manipulation,
    functions, expansion, and more. Each of these Bash features allows for maximum
    control and maintenance as well as batch processing. Bash interprets and processes
    all commands fed into the shell. Bash forms a central part of system administration
    as well as the development of the system as a whole. A script is basically where
    a user writes their command. Linux has `bash` within its system by default, an
    added advantage to hackers. Shell scripting entails leaving the shell to interpret
    and execute the command A shell script is a program that shell has been tasked
    with to complete.


    The bash script is the script that a computer follows when operating. The script
    tells the computer what to do or say after the execution of specific actions.
    Bash scripting is similar to a play or an act where the actors will follow and
    say what the script says or asks them to do. Bash scripting generally allows the
    user to use or input any commands that can be used or executed one by one in a
    script. Executing commands one by one and daily can be tedious as well as there
    would be many mistakes. Therefore it is essential to ensure that the task is reduced
    and that matters are automated. Automation does not only make things more comfortable;
    it also reduces mistakes that would otherwise prevent programs from running. Therefore,
    to avoid the process of having to execute commands one by one, a script is used.
    The script will include all commands necessary for a program to run being run
    together.


    The development of a bash script only requires one to have basic knowledge of
    using the command line. the process has three steps to follow, as explained below.


    ### Create a bin directory

    This is a subdirectory that stores executable programs. This `bin` acts as a store
    or home for the bash scripts that are created. It can be done by applying the
    following commands.


    ```bash

    cd ~/

    mkdir bin

    ```


    ### Export bin directory to the PATH

    ```bash

    export PATH=$HOME/$USER/bin:$PATH

    ```

    Adding the `bin` to the `PATH` allows the user to be able to find the programs
    easily. Add your bin directory to your path. Edit your `.bashrc` file (or equivalent)
    to add in `~/bin` to your path. copy executables into this bin directory or create
    a symbolic link from within your user bin directory to the executable you want
    to use.


    ### Creating a bash script

    When one is creating a bash script, they need to tell the computer that they are
    creating a bash script. The way to achieve this is through typing `#!/bin/bash`.
    This command will inform the computer that a bash script is being made. This will
    be followed by the commands that the user wants the program to display. There
    is a syntax that should be used when scripting. For example, when the user wants
    the computer to display something when the program is run, they will use the syntax
    `echo` followed by what they want to say in quotes. For example, you want the
    program to display the word welcome after it is run on the script; one will type
    the following:


    ```bash

    echo "welcome."

    ```

    When the program is run, it will display the word welcome on the screen. To input
    time between the response of the program and the next action, one will use the
    syntax `sleep` followed by the length of time they want the pause to be. For example
    `sleep 5`, the command will mean that the program will always pause for five seconds
    before it can execute the next command. When done one will simply press `CTRL
    + X` to exist, and they will be asked to save the file according to the name they
    gave the program. It is important to note that bash scripts can be very long.
    The size of the script will rely on the number of simultaneous activities that
    one wants the program to run automatically without the user having to get involved.
    For example, when one presses the shut down button on a computer, the computer
    runs on a bash script that allows it to save all the work and close the running
    applications automatically before it can power off. All these activities follow
    a bash script and so do many applications and actions on a computer.


    Once a person has saved the bash script, they have to make the script executable.
    This involves changing the mode of the script to a version that is executable.
    Changing the mode will involve the user type the following.


    ```bash

    chmod +X <name of the file>

    ```

    After this step, the user will then type


    ```bash

    ./<name of the file>

    ```

    Once you press enter, the script will run according to how it was input and executed.
    The bash script will also include more syntax and commands that will help to condense
    the many commands that are run manually but can be run automatically. This will
    ensure that the user does not have to do too much, but rather the program will
    run automatically. The bash script, therefore, provides the program with a certain
    level of automation.


    ### Variables

    Variables in bash scripting are essential in completing the whole script. The
    user has to assign variables and meanings to them. For example, one can assign
    the letter `X` a variable. On the script, one will type as follows.


    ```bash

    #!/bin/bash

    X="1."

    ```

    The variables mean that the user when they insert a certain variable in the code,
    suggests the value assigned to it. It helps to shorten the number of words in
    the script. Retrieving the variables involves typing the variable and syntax `echo`
    on the terminal. The process will go as follows.


    ```bash

    echo $X

    ```

