    ## Loopback

    The loopback (`Lo`) interface will always have an IP address of `127.0.0.0` that
    represents the host. For example, you want to access a web page running on the
    same server as that you you are, and then you will need to type, `HTTP:127.0.0.1`
    on your browser.


    ## Ethernet

    The Ethernet 0 (`eth0`) interface is basically the local network connection. When
    running Linux on a virtual machine, you will still be required to connect to a
    physical network interface of the host. Commonly, you will be required to cross-check
    if the Ethernet has an IP address and the `eth0` is in an `UP`-state.


    ### MAC address

    The media access control (`MAC`) is an identifier assigned to a network at layer
    2 of the data link layer. A network interface must have a `MAC` address which
    is commonly called the hardware address. `MAC` addresses are always to any adopter
    when they are manufactured or if it’s a virtual adapter, the address is assigned
    to the adapter when it is created and always appears in six groups of two hexadecimal
    digits each. The Ethernet interface explained above the `MAC` address is known
    as ether address or the link.


    ### IP addressing

    The `IP` addresses of all devices are unique on a particular network; hence, every
    device has at least one address. `IP` addresses normally fall between `1.1.1.1`
    and `255.255.255`.


    #### Example 1

    To view the `IP` address used, you will type the `IP` address commands which will
    look like the one below


    ```

    <LOOPBACK,UP,LOWER_UP>  6536 qdisc noqueue state UKNOWN group default

    Lin/loopback 00.00.00.00.00.00 brd 00.00.00.00.00.00

    inet 127.0.0.1/8 scope host Io

    valid_Ift forever preferred_If forever

    inte 6::1/128 scope host

    valid_Ift forever preffered_Ift forever

    ```


    There is one Linux networking tool that everyone conversant with Linux has heard
    of, i.e. `ping`. It began as an acronym and now has gotten to enjoy its status
    as a fully flagged word and now it’s the most commonly used tool in testing the
    reachability of a network.


    ### How Ping Works

    `ping` starts by sending an internet control message protocol (`ICMP`) across
    the network; then, it will notify when there is a response or not. If the host
    is able to connect to the network, it will send an `ICMP` success response. However,
    if the user is unable to connect to the network, it will send a ping test failed.


    Another tool used by Linux in the troubleshooting process is the `trace root`.
    `traceroot` usually Probes the network between the local system and the destination;
    hence, it will gather all information about the `IP` router in the path. `Tracetoot`
    is useful when there is an issue in the path, such as network issues intermediary
    nodes showing slow response then you may want to know which node is showing the
    slow response.


    ## Dynamic host configuration protocol (DHCP)

    What if you have tens, thousands or an infinite number of computers within your
    network? It will be time-consuming to try to assign and track which machines have
    which `IP` address. Here is when the power of `DHCP` comes to play. It will obtain
    the `IP` address of a host or a device when it actually connects to the specific
    network. However, `DHCP` is commonly used with devices that do not have side effects
    occurring from a dynamic `IP` address change in the server system. Administrators
    can create `DHCP` reservations or manually configure static `IP` addresses to
    ensure every network adapter connected to the network will always get the same
    `IP` address when connected to the network.


    ### DNS (Dynamic name system)

    Interconnected computers mostly connect to each other using `IP` addresses. It
    would be very difficult to keep remembering everything you need to connect to
    on the internet. imagine you want to connect to `google.com` even `facebook.com`
    and then you are required to remember the `IP` of `google`, `facebook` or any
    other website every time you want to search them on the web. It would be very
    hectic to access the internet. `DNS` comes in handy as it is used to map the web
    pages to specific `IP` addresses that we can easily remember.


    ## Network statistics and counters

    While undertaking the troubleshooting process, it becomes vital to answer questions.
    Firstly, is the interface sending the data it is required to transmit if it is
    not sending then is it sending some errors and lastly what process is sending
    all that traffic.


    Having covered how to view network information, then we need to know how to set
    up some common network configurations.


    ### Process

    Start by changing an `IP` address. Note that when making changes in Linux you
    can have these two types of changes:

    - Immediate effective changes that are not persistent. These changes are not effective
    once you restart off your operating system

    - Changes that are effective even after restarting your computer.


    For immediate effective changes to be made on the `IP` configuration, then you
    will use the `link`, `route`, and `address` command options. However, you will
    be required to have the `iproute2` package installed on the Linux OS. By default,
    the package is usually pre-installed but will highly depend on the version of
    the OS you are using.


    ## Network interface bonding

    You may need more network bandwidth than a single interface can give. Otherwise,
    you may be having network issues, or maybe you want some form of risk redundancy.
    The risk redundancy has many names depending on the vendor; such names are `EtherChannell`,
    `VMware`, `PortGroups`, `bonds`, and risk aggression groups are just a few. Linux
    also provides such features and is named `bonding`. Bonding allows a user to create
    a single logical network and later link with multiple logical networks, then scale
    to add more interface hence the provision of load balancing, thus preventing interface
    failure protection. Using the `bonding` feature requires one to install the kernel
    module via the `modprobe` command since the `modrobe` command will help in adding
    additional capabilities in the Linux kernel.


    ### Basic Linux network bonding modules

    - `Balancer rr`: It’s the default round-robin bonding that provides fault tolerance
    and also loads balancing.

    - `Active back up`: This module provides fault tolerance where one slave can be
    active at a time and in an event it fails the other slave takes over.

    - `Balance xor`: Based on hash, it offers fault tolerance and load balancing.

    - `Broadcast`: Offers fault tolerance through transmitting data on the slave interface.

    - `802.3ad`: It creates aggression groups for any link sharing the same velocity
    as a duplex for it to provide load balancing and fault tolerance. Its standard
    dynamic link is `IEE.802.3ad`. `802.ad` is the common type of bonding, and it
    uses `LACP` for it to communicate with a bond from the other side.

    - `Balance tbl`: It adaptively transmits load balancing without the help of any
    special switch support.

    - `Balance alb`: It’s an adaptive load balancing that requires no special switch
    support due to its use of `ARP`.d

