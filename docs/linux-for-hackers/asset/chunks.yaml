    of 4 GB is what should be memory given to the slider. In the left plane, highlight
    processors on the left plane. The option will heavily depend on your computer''s
    processor. If your computer has multiple processors, then you should select multiple
    processors for efficient performance. On the left, click the New Adaptor, then
    on the right side move the dot to the bridged (top) option and click configure
    the Adapters button. A small window will automatically pop up where you will uncheck
    all the options in the exception of the one next to the network adaptor then click
    OK. At the bottom of the hardware, close then Click Finish in the wizard.


    Step 8


    The new virtual machine will have been added to the VM library once you clicked
    the finish button. Start Linux in order to install it. Highlight, the name of
    the created virtual machine in the right pane in order to finish the installation.


    Step 9


    On the boot menu that appears, use the down arrow keys for scrolling down to Graphical
    install and hit enter.


    Step 10


    Select your preferred language; by using either the mouse or the arrow keys to
    scroll then hit Enter.


    Step 11


    Select your location on the next screen that appears and hit continue.


    Step 12


    You will be asked your keymap, for example, you can choose the Arabic keyboard.
    *Note this will depend on the language that you understand.


    Step 14


    Kali will delete the hardware on your computer, then click continue but do not
    configure the network yet.


    Step 15


    You will set the computer hostname which will act as your computer name. Click
    continue


    Step 16


    On the next window set your preferred root password on the main account. Then
    confirm the inputted password and click continue.


    Step 17


    Linux will now determine the disk partitions then you will be presented with a
    dialogue box, select the first option and continue and make sure that all files
    to be on one file and hit continue. Then confirm the desired changes to be made
    by selecting Finish partitioning and make changes to the disk and confirm the
    changes. The OS will now install and can take a duration of up to 30 minutes.


    Step 18


    Then select no when asked about the network mirror


    Step 19


    The installer will ask whether to install the GRUG and accept it. The installation
    process is completed by now, and a success notification will be displayed


    The OS will restart, and then you can log in using the password you heard the
    set.


    ## Storage management


    Storage management refers to the process of managing computer storage devices.
    Linux has many tools that can be used to manage storage drives and hardware devices.
    Linux can perform the following in regards to storage management:


    Memory management


    The kernel allows processes to access the memory when they need them since it
    has access to the system memory.


    Device management


    The kernels allow processes to access peripheral devices through device drivers.


    Task management


    The kernel allows application execution. It performs context switching between
    software and hardware


    ### Methods of storage management


    *   Provision of options to failback of the LUN to the required paths


    *   Monitoring and notifying if there is any change in the path


    *   Provision of options to the customization of names of the device-mapper to
    multipath devices.


    *   Provision of policy-based paths and grouping for a user to the customization
    of I/O through defined paths


    *   Facilitation of balancing of the loads among many paths.


    ## Block storage


    Block storage in Linux kernel is simply a synonym for the word block device. A
    block device is any hardware device that stores data same as flash memory, solid-state
    drive(SSD) and hard disk drive (HDD). Basically, a block device is commonly known
    as disk storage in the computer. Once it has been set the block device acts as
    an addition of the current file system on the device hence, you can read or even
    write information on the drive.


    ### How Linux manages storage devices


    Linux operating system represents almost everything by a file that encompasses
    the storage devices present on the /dev category. Files in charge of the storage
    devices always named starting with sd or HD then followed by a letter. For instance,
    the first drive in a server can be represented by /dev/sda. Similarly, partitioned
    files within these drives have files within the /dev category. The partitions
    are usually appended by adding a number after the drive name. For instance, the
    second partition from the previous example would be /dev/sda2.'
