    ## ### 管理 Linux 内核模块

    Linux 内核是 Linux 操作系统的核心部分。它负责操作计算机和硬件。内核有两种类型，包括微内核和单内核。微内核负责操作系统的功能，管理内存和 CPU
    时间。单内核负责设备驱动程序。当两种类型结合并协同工作时，它们有助于管理操作系统以及硬件的操作。Linux 操作系统中的模块是操作系统根据需要加载或卸载的代码段。这些模块的功能是帮助在不关闭整个系统的情况下扩展操作系统的功能。


    从 Linux 中加载和移除模块的能力是该操作系统最大的优势之一。这是因为这有助于减小 own 体积。如果没有加载或移除模块的能力，意味着操作系统将带有系统来帮助完成基础内核中加载的任何预期功能。加载模块会导致内存浪费，由于用户的需求不同，这些功能对某些用户来说是无用的。Linux
    有三个主要的内核模块：文件系统驱动程序、设备驱动程序和系统调用。


    人们倾向于编译自己的内核的一个主要原因是某些驱动程序（以及其他内核功能）需要补丁。有时，某些内核功能可能会损坏。在这种情况下，补丁可能需要用户开发自己的内核。另一种人员可能开发内核的情况是他们需要更新驱动程序或使用新的驱动程序。这可能导致开发新内核。编译自己的内核意味着这个人将删除某些内核并构建新内核。移除旧内核并替换为新内核的过程意味着系统得到了优化。在许多情况下，优化可以为用户带来更快的系统。然而，这只是优势，而不是构建和替换内核的原因。


    ### 插入模块

    仅三个内核的存在导致添加更多内核来增强功能。在标准的 Linux 操作系统中，模块存储在 `/lib/modules//kernel/` 目录下，并具有 `.ko`
    扩展名。要将模块插入内核，应使用 `insmod` 命令。用户只需输入语法 `insmod <module_name>.ko`。


    例如：

    ```

    # insmod /lib/ modules/ 4.4.0-21-generic /kernel/ drivers/cpufreq /SpeedStep-
    lib.ko

    ```


    ### 移除模块

    有时，用户可能决定某些模块在当时没有用。因此，他们需要从内核中移除它们。要从内核中移除模块，用户需要使用 `rmmod` 命令。`rmmod <module_name>.ko`
    是移除模块的语法。然而，必须注意的是程序正在使用的模块无法移除。


    例如：

    ```

    # rmmod /lib/ modules /4.4.0-21-generic /kernel/ drivers/ cpufreq/ speedstep-lib.ko

    ```


    ### 创建并加载内核模块

    用户可以创建并将新内核添加到他们的操作系统中。创建新内核是一个简单的过程。以下是创建内核过程中要遵循的步骤。


    1. 添加头行。添加头行的通用格式如下。


    ```c

    #include <Linux/ kernel.h>

    #include <Linux/ init.h>

    #include <Linux/ module.h>

    ```

