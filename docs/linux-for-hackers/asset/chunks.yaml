    当我们手动编辑文档中的文本时，会变得非常疲惫；而且，我们无法消除人为错误的可能性。因此，找到一种方法，通过命令来轻松地修改文档中任何大小文本文件的文字是非常关重要的。Linux
    命令行就派上了用场，因为它允许用户输入单行命令行并在少于一个文档的时间内编辑整个文档。


    Linux 操作系统中的每一个命令都只能执行一项工作，且它只做那项工作，不做其他。Linux 命令行工具可以像积木一样按照我们的意愿连接在一起，并利用命令行发挥优势。


    ## Linux 在文本处理中的用途


    连接命令行的过程被称为“管道”（piping）。管道的符号是 `|`（始终记住它不是小写的 L 或任何其他字符，而是 `|`）。


    Linux 提供的另一个特性是使用直角括号 `>`。默认情况下，当我们在终端输入命令时，Linux 操作系统会将命令显示在屏幕上。然而，当我们想要创建文件时，需要使用
    `>` 重定向命令输出，后面跟着文件名。请注意，如果文件已经存在，它将被覆盖；因此，如果你不想让它被覆盖，追加文件就变得非常重要。为了追加文件，你需要使用
    `>>` 将内容追加到文件中。在追加文件时，结果将保存在现有文件的末尾。注意，只有现有文件可以被追加。


    ## 为什么要使用文本处理


    考虑这种情况：你正尝试访问一个网页，但你忘记了密码、用户名或两者都忘了。你可能需要尝试猜测密码或用户名。然而，密码通常是区分大小写的；因此，你可能需要尝试密码的多个版本以找到准确的密码。这个过程可能非常疲惫；因此，创建一个词列表来为我们提供各种版本的密码或用户名变得非常重要。


    Linux 非常别有用，因为它可以帮助你生成各种词列表，你将使用这些列表来尝试你忘记的密码版本。请注意，未经许可访问他人的页面或系统是不符合道德的，不应该尝试，因为这可能会让你受到法律的制裁。


    ### 创建词列表


    以 Unix 和 Linux 这两个词为例。


    在这种情况下我们如何使用文本处理呢？


    在这种情况下，每个单词将单独占一行；使用这个例子，单词 Linux 将位于第一行。当使用单词 Unix 创建词列表时，你可能想尝试诸如 `Unix`、`UNIX`、`unix`
    和 `Unix` 等密码。如果此时我们想对词文件中的每一行执行此操作，并将结果追加到我们的原始词列表中，那么词列表将比原始词列表大四倍，因此在创建此类文件时，考虑文件大小至关重要，因为它们的大小可能会达到
    GB 甚至更多。


    #### 解释


    例如，使用单词 Unix，有不同的组合，如 Unix（这里第一个字符是大写字母）


    * `UNIX` 所有字符均为大写

    * `UNIX` 大写的可选方案

    * `unix` 小写的可选方案

    * 想一想单词 `UNIX` 会产生多少种选项，或者单词后面是否会有数字？


    ## 用于文本处理的七大 Linux 命令行工具


    * `vim` 命令 - 该命令是一个文本编辑器，可以在命令行模式或 GUI 模式下使用。Vim 非常强大，可以用于编辑任何类型的文本。vim 的一个缺点是它的学习曲线非常陡峭。


    ### vim 的特性


    * 在极低内存上运行。

    * 它支持非常多的文件和编码。

    * 它兼容所有 Unix 系统。

    * `grep` 命令 - 该命令由于在大多数基于 Unix 的系统中运行速度快，是经常使用的命令之一。通过其他程序，`grep` 命令可以与其他程序配合以读取各种输入。在文件或标准输出中，`grep`
    可用于查找字符串或匹配正则表达式。

    * `sort` 命令 - 正如其所示，它用于对文件进行字母数字排序，因为它会按照特定顺序排列行。该命令默认按 ASCII 排序文件。


    #### sort 命令排序行的方式


    1. `sort` 命令一次排列一行。

    2. `sort` 命令程序按参数顺序排列的列表打印输入的所有行。

    3. `sort` 命令支持按字母顺序、倒序、数字甚至通过口语方式对行进行排序。

    4. 该命令还可以忽略大小写，并返回行是否已排序的结果。

    5. 默认情况下，整个输入键被视为排序键，空格被视为字段分隔符。


    #### sort 命令的特性


    * 以数字开头的行将位于字母开头的行之前。

    * 首字母在字母表中出现靠前的行将放在首字母在字母表中出现靠后的行之前。

    * 以字母表中靠前字母开头的行将位于以靠后字母开头的行之前。

    * 以大写字母开头的行将位于相同单词的小写字母开头的行之前。


    示例：


    假设你正在创建一个名为 `file.txt` 的文件。


    ```bash

    $ cat > file.txt

