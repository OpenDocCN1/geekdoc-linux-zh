  trans: '

    与 Windows 操作系统相比，Linux 系统更加灵活。然而，Linux 的使用可能比 Windows 操作系统复杂。与其他操作系统相比，Linux 具有许多优势。Linux
    有两个著名的特性，使其脱颖而出：Linux 内核和服务器平台。在某些情况下，Linux 系统可以被认为拥有五个主要组件。


    ### Linux 的五个主要组件


    -   **Linux 内核**：这是一项允许用户修改操作系统的特性。Linux 操作系统可以被更改或定制以满足用户的特定需求。例如，大多数安卓手机和一些家电都使用
    Linux 操作系统。这一特性允许工具开发者根据自己的需求对操作系统进行定制。

    -   **服务器平台**：这意味着用户可以将操作系统作为构建其他操作系统的基础。因此，它为大多数设备制造领域的开发者和制造商提供了更好的选择。

    -   **Shell（外壳）和 GUI（图形用户界面）**：通过 Shell 和 GUI，用户可以与内核通信。用户使用 Shell 执行想要的功能。通过
    Shell，用户可以向系统输入命令，内核将运行这些命令。

    -   **系统实用程序**：系统实用程序包括个人在执行所需任务时使用的任何应用程序和程序。没有系统实用程序，管理设备将变得几乎不可能，因此它们是 Linux
    操作系统中不可或缺的一部分。

    -   **应用程序**：这些是用户可以用于各种任务的各种应用程序。这些是用户安装或上传到系统中并用于多项任务的程序。例如浏览器、需要时的杀病毒软件。它们大多从外部源引入，而不是系统应用程序那样预装的。


    ### 定制与灵活性


    Linux 作为一个多功能操作系统运行，可以根据定制服务不同的用途。然而，与其他操作系统一样，核心作用是连接用户与设备。Linux 允许用户访问设备可能需要的任何服务。Linux
    并不是一个程序或一组工具。当人们下载 Linux 操作系统时，它会带有其他被称为 `GNU programs` 的程序。目前在使用的有许多不同的 Linux
    发行版。然而，每种发行版都经过了定制以适应用户的需求。这些发行版保持开源状态，这意味着如果用户觉得它们难以使用或操作，可以对其进行修改或定制。


    一旦下载了最适合自己的发行版，就可以下载免费应用程序供 Linux 使用。大多数程序与操作系统一样是免费下载的。一旦在设备上拥有了这些应用，就可以像任何其他操作系统一样使用它们。应用程序可以用于浏览互联网、玩游戏、使用办公套件等其他活动。如果你不喜欢操作系统的某些部分，可以对其进行定制以符合你的需求。因此，在
    Linux 中，用户将通过切换各种特性来定制操作系统。Windows 操作系统不允许用户更改某些功能。因此，用户只能在现有的操作系统上添加第三方应用程序。Linux
    则允许用户使用他们想要的内容，并删除或替换操作系统中不需要的内容。这使得对于许多需要创建自定义操作系统的组织来说既简单又灵活。


    ### 基础概念


    可以说，Linux 操作系统为用户提供了操作系统的核心组件。从这些核心组件开始，用户将着构建自己的操作系统。这将通过用户添加或删除他们不喜欢的元素来实现。通过这种消除和替换的方法，用户最终能够定制或构建他们喜爱的操作系统。这是其他操作系统缺乏的特征之一。其他操作系统是完全开发好的，关于它们很少可以被更改或定制。这可以用建筑来最好的解释或说明。Windows
    操作系统通常向用户提供一整栋建筑，因此，很少东西可以被更改。然而，Linux 为用户提供了建筑的基础。用户可以从该基础开始构建他们想要的建筑。因此，在安装
    Linux 操作系统后，用户将添加他们喜欢的应用程序，并按照他们偏好的设计定制桌面。


    ### 核心特性


    #### Shell

    Linux 最重要的特性之一是 Shell。它允许用户通过命令行向系统输入命令。在 Windows 中，Shell 是命令提示符。然而，命令行比命令提示符具有显著优势。虽然可以更改
    Windows 系统的功能及其某些特性，但用户可以使用命令行来改进 Linux 的功能。通过命令行，可以修改系统的工作方式。Shell 是黑客的基本工具之一，允许他们开发用于黑客的脚本和程序。


    #### 引导加载程序 (Boot Loader)

    引导加载程序是用户首先交互的 Linux 组件。当安装 Linux 时，引导加载程序会自动安装。大多数用户看不到它，但它一直在运行。当系统通电时，操作系统使用引导加载程序向用户开放。在某些情况下，用户可能在机器上安装了多个操作系统。当用户有多个操作系统时，引导加载程序允许用户选择使用哪一个。引导加载程序将打开操作系统并授予用户访问权限。引导加载程序是自动的，从系统开启的那刻到用户可以访问桌面和应用程序，它一直在为系统使用做好准备。


    ### 启动系统


    当人们想要使用 Linux 系统时，第一步是开启系统。开启系统意味着屏幕会亮起，引导加载程序将启动。引导加载程序加载设备中的系统。如果有多个操作系统，则允许用户选择一个来使用。选择后，引导加载程序将允许你输入密码（如果需要的话）。设备的成功打开和操作系统的加载将让用户能够访问设备的桌面。访问桌面可能是一个简单的任务，但
    Linux 操作系统的桌面在不同设备之间是不同的。Linux 操作系统有许多桌面环境，改变了桌面的外观。


    Linux 和 Windows 之间非常不同。因此，建立这两个操作系统之间的差异有助于人们理解 Linux 是如何工作的。Windows 对大多数用户来说非常常见，可以作为一个很好的比较点。Windows
    系统中的各种特性会被 Linux 系统中的其他变化元素所取代。

    '
- fmt: '

    One difference can be seen in that Linux has very many customizable distributions.
    This is unlike in windows where there are no variants. For example, Linux has
    options such as `kali`, `ubuntu`, that are customized to fit user needs. Windows
    only has versions such as `windows 10`, `windows XP` among other variants. Another
    difference is seen in the command line. The Linux distributions all have a command
    line that allows the user to customize the operating system. However, the command
    prompt in windows will enable one to carry out limited tasks but never to customize
    the operating system. While running and installing Linux takes a shorter time,
    Linux can run very complicated tasks. Windows, on the other hand, will take a
    prolonged installation period due to the many items that have to be installed
    at once.


    Linux only requires one to install a few items and add the rest as they need them.
    This makes the installation complicated due to the customization and adding kernels.
    In Linux, the installation of updates is only when on needs or chooses to. This
    makes sure that the updates are stable and easy to install as one can update bit
    by bit. However, windows updates need to run altogether, taking longer. When they
    fail to install altogether, the operation of the operating system is profoundly
    affected. Linux operating systems are hard to break through, making it more secure.
    This is different from windows operating systems where a person has to install
    an antivirus program to avoid viruses and malware. Malware and viruses in windows
    can come from very many different places, and therefore one has to be cautious.


    ## Linux for hacking


    When one talks about using Linux to hack, they are speaking in a comprehensive
    manner. This is because there are multiple distributions of Linux with each having
    numerous hacking tools. This means that there are very many options that one can
    use to hack using Linux. However, the process of hacking using Linux is almost
    the same for every distribution and every tool. Therefore one can create an outline
    of the process of hacking using Linux.


    The first step into learning how to hack using Linux is to understand the Linux
    operating system. In Linux, hackers have a significant advantage that presents
    itself in the form of the command-line interface. The command-line interface is
    a similar tool to command prompt in windows that allows the user to write scripts.
    However, the main advantage that the command-line interface has is that it can
    be customized to fit the needs of the user. In other words, the user has more
    control over their operating system in Linux than in windows. Therefore, being
    aware of how to use the whole system is a significant step to learning how to
    use it for hacking.


    The next step is that one needs to understand more about networking. If one is
    going to be breaking the rules, then they need to understand the rules and how
    they work. Therefore, when one is learning how to hack, they need to know how
    the systems work. Networking involves understanding how computers exchange data
    and how they work. Hacking consists of understanding the working of networks and
    their processes so that one can exploit these processes and gain access to the
    chain and exchange of information.


    Linux is one of the closest friends to a hacker. This is because, through Linux,
    a hacker can be able to develop a platform through which they can hack into systems
    and applications. Therefore, to use Linux to hack, one needs to have some necessary
    skills in using Linux. One needs to develop skills that will help them navigate
    through the Linux system and build scripts that they can use to hack into systems.
    Further, Linux has very many tools that are used in hacking. It is essential that
    one has Linux skills so that they can be able to use these tools appropriately.
    The hacker must also understand various security concepts that are used in protecting
    programs. Linux is used to develop most securities for these programs. Therefore,
    through understanding the Linux system, the hacker will be able to know how they
    can avoid these security traps used by administrators in protecting programs,
    applications, and even websites.


    Linux is among the best-operating systems that one can use to learn to script.
    This is because it offers a user very many languages to use to write scripts.
    The user can choose any of the languages that they will think is simple to understand.
    Linux allows the user to interchange languages which is not the case for windows.
    Windows is not very accommodating for different code languages. Therefore, Linux
    is a better option to learn the programming language with. The user can use Linux
    distributions to learn scripting skills.


    ## How to hack and what you need


    Hacking is the use of computer skills and software to overcome a technical problem.
    Most people will have a different reaction when the word hacking is mentioned.
    Some people will feel that hacking is a bad thing while it is not. There are various
    types of hacking, and a kind of hacking is ethical hacking. Hacking can be used
    to resolve any issues the the modern worker. In contrast, it has also been used
    in very many contrary acts that resulted in hacking developing a negative reputation.
    It is, however, essential to learning how to hack various systems for the sake
    of acquiring multiple information. A person needs numerous tools and skills to
    complete a hack.


    ### Requirements


    1. Linux operating system-` this is the platform through which one will be able
    to run the hack. Linux allows the user to write and implement various programs
    and therefore makes it easy for one to use during hacking. The operating system
    can be in multiple distributions such as `Kali`, `Ubuntu`, `Backtrack`, among
    other distributions.

    2. HTML writing knowledge-`HyperText Mark-Up Language is the primary language
    that the computer uses and can be used to give instructions to the network. Without
    programming knowledge, it is essential that one has some expertise in `HTML`.
    The ability to write `HTML` will help in writing codes.

    3. Basic programming knowledge-` most websites and applications are based on a
    program. Programming is the knowledge of how these websites and apps are created
    and how they run. Hacking is breaking the rules to these platforms, hacking into
    these platforms, then one must know the rules. Programmers use various languages
    when programming, including `Python`, `Javascript`, and `Java`. Each of the languages
    used by programmers offers them a set of advantages and disadvantages.


    Once one has the requirements, they will have to follow various steps into hacking.
    When the levels are correctly monitored, then it will be a simple process. The
    steps can be known as phases, and there are five phases. The stages include `reconnaissance`,
    `scanning`, `gaining access`, `maintaining access`, and `clearing tracks`.


    1) Reconnaissance- In this stage, one needs to collect as much information about
    the platform they are hacking. The information should be collected in three parts,
    including `network`, `host`, and `people involved`. The data collection can be
    done into methods called `footprinting`. It can be `active footprinting` which
    consists of collecting information through interacting with the target. `Passive
    footprinting` consists of gathering information on the goal without interacting
    with the goal.

