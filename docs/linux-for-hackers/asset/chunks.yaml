  trans: "\n\n由于 `/dev/sda*` 和 `/dev/hd*` 设备文件代表了旧的驱动器分区方式，单独使用这些值时会成为一个劣势。当设备在启动过程中更改其节点时，会导致对哪个驱动器被分配了特定名称产生困惑，因为\
    \ Linux 内核在每次启动过程中都会决定哪个驱动器获得特定的名称。\n\n通过 `/dev/disk` 解决此问题，子目录对应于识别系统上分区和磁盘的定义方式。这些子目录包括在启动期间生成的符号链接，用于指向正确的\
    \ `/dev/(sh)da*` 文件。这些链接通常根据标识文件的目录命名。\n\n### `/dev/disk` 下的子目录\n\n- **按标签 (By\
    \ label)**：文件系统必须有一种命名文件的方法，以便为特定的磁盘或分区分配名称。\n- **按 UUID (By uuid)**：`UUID` 或通用唯一标识符是一段长字母数字字符串，可以作为存储设备的标识符。这些字符串人类无法读读，但保证在不同系统间是唯一的。极度建议使用\
    \ `uuids` 来引用可能跨越不同系统的存储设备，因为不会发生命名冲突。\n- **按分区标签和分区 UUID (By partlabel and by\
    \ partuuid)**：`GPT` 表通常有特定的标签，甚至是用于标识的 `UUIDs`。此目录的功能与前两个目录相似，但使用的是 `GPT` 特有的标识符。\n\
    - **按 ID (By id)**：它们是动态硬件生成的目录，拥有其序列号和与之连接的硬件。\n- **按路径 (By path)**：该目录完全取决于连接到系统的存储设备。然而，连接到不同的端口会更改目录的原始值；因此，它面临与按\
    \ id 模式类似的缺点。\n\n### 挂载块设备\n\n位于 `/dev` 中的文件用于与系统的内核驱动程序通信。需要更多的抽象来使设备成为剩余空间的一部分。在\
    \ Linux 和类似的 Unix 操作系统中，尽管涉及许多设备，系统仍表示为单一的统一文件树。在访问驱动程序的内容时，你从那里进行访问。有多种挂载选项可以更改挂载设备的行为。为了防止内容被修改，明智之举是以只读模式挂载驱动器。\n\
    \n使用文件系统层次结构标准，你可以将文件系统挂载到 `/mnt` 或其子目录下。然而，该层次结构对于在何处放置永久存储没有提供建议；因此，你可以将其挂载到\
    \ `/mnt` 或 `/mnt` 子目录下。\n\n### 使用 `/etc/fstab` 创建永久挂载\n\nLinux 系统检查文件系统表 (`/etc/fstab`)\
    \ 来判断在启动过程中将挂载哪些文件系统以及哪些。除了具有 `system.mount` 单元文件的文件系统外，其他条目的文件系统将不会自动挂载。该文件系统非常简单，每行必须代表一个应该被挂载的文件系统。\n\
    \n### 复杂存储管理\n\n当我们想要灵活性、更高性能、额外的管理结构甚至冗余时，就会使用复杂的管理范式。\n\n 什么是 RAID\n\n它是独立磁盘冗余阵列。它允许对驱动器进行分类，并在以后将其作为一个单元进行管理，具有更多的功能，因为它使用了虚拟化技术，同时也属于存储管理。RAID\
    \ 阵列的特征始终取决于 RAID 级别。而 RAID 级别定义了阵列中磁盘之间的关系。级别还会影响组的性能和冗余。\n\n最常见的级别\n\n- **RAID\
    \ 0**：此级别表示驱动器拆分阶段。拆分意味着数据写入阵列，然后被拆分并随后分布在该特定组的各个磁盘中。它有优点，因为可以读取或写入。然而，它也面临缺点，单个驱动器的故障会导致整个阵列的数据丢失。这是因为没有单个磁盘包含足够的重建所需内容的信息。\n\
    - **RAID 1**：可用于制作某些数据的副本。例如，你有两个 2 TB 的硬盘；总而言之，你拥有 4 TB 的硬盘。在镜像模式中，你只能看到 2 TB\
    \ 的逻辑硬盘。然而，在保存数据时，它会写入到两个驱动器上。磁盘最小数量必须大于两个，因为在其中一个驱动器故障时，你可以从另一块磁盘获取数据；从而确保数据不会丢失。\n\
    \n### RAID 1 的特性\n\n1. 它提供了故障容错能力。\n2. 重建通常很快。\n3. 它的性能通常很快。\n4. 可以在小型设备中使用。\n\
    5. 读取性能通常良好。\n6. 写入性能通常较慢。\n7. 将损失一半容量。\n\n- **RAID 5**：此级别通过部分分布工作，其中数据受到保护。它可以幸存单个驱动器故障，但如果超过一个驱动器故障，可能会导致大量数据丢失。RAID\
    \ 5 的特性\n\n1. 它具有出色的性能。\n2. 读取通常很快。\n3. 它提供了故障容错。\n4. 必须有一块磁盘处于校验状态。\n5. 可用于大规模、、备份。\n\
    6. 可以从所有驱动器重建校验位。\n\n- **RAID 10**：RAID 10 的特性与 RAID 5 相似，但不进行校验分布。它至少需要四个驱动器，以确保即使两个驱动器故障，数据也可以重建。RAID\
    \ 10 的特性\n\na) 读取性能良好。\nb) 性能较差。\nc) 它提供了故障容错。\nd) 重建从两个驱动器完成。\ne) 它可以用于长阵列。\n\
    f) 它用于大规模。\n\n基础磁盘知识对于了解如何设置 RAID 至关重要。\n\n文件系统\n\n在执行存储管理时，文件系统非常重要。决定哪个文件系统适合计算机取决于你想执行的计算类型。\n\
    \n文件系统的根目录包含目录和文件，位于顶端，由 `/` 表示。\n\n### 路径名的类型\n\n1. **绝对路径**：文件始终通过其绝对路径标识，该路径从根目录开始反向延伸。`/`\
    \ 在绝对路径中有两种不同的含义：\n   - 指定文件目录。\n   - 使用 `~` 缩写的主目录。\n   - 使用 `~` 缩写的用户用户名。\n\
    2. **相对路径**：相对路径从当前位置开始，与绝对路径不同。\n\n"
- fmt: '

    The Linux operating system is flexible compared to the windows operating system.
    However, Linux can be complicated to use than the Windows operating system. Linux
    carries multiple advantages when compared to other operating systems. Linux has
    two well-known features that make it stand out: Linux kernel and server platform.
    In some cases, the Linux system can be said to have five primary components.


    ### Five Primary Components of Linux


    - **Linux kernel**: It is a feature that allows one to modify the operating systems.
    Linux operating system can be changed or customized to fit the specific needs
    of the user. For example, most android phones and some of the appliances use Linux
    operating system. This feature has allowed the developers of the tools to customize
    the operating system to fit their needs.

    - **Server platform**: this means that one can use the operating system as the
    basis for building another operating system. Therefore, it offers a better option
    for most developers and manufacturers in device manufacturing.

    - **Shells and GUIs**: Through shells and GUIs the users can communicate to the
    kernel. The user uses the shell to execute the functions they want. Through the
    shells, the user can input commands into the system, and the kernel will run the
    commands.

    - **System utilities**: The system utilities include any applications and programs
    that the individual will use to carry out the tasks that they want. Without the
    system utilities, managing the device will be close to impossible and therefore,
    they make an essential part of the Linux operating system.

    - **Application programs**: These are various applications that can be used for
    various tasks by the user. These are applications that the user will install or
    upload into the system that they will use for multiple tasks. For example, a browser,
    an antivirus program if need be. They are mostly introduced from external sources
    and are not pre-installed like system applications.


    ### Customization and Flexibility


    Linux works as a multi-front operating system and can serve different purposes
    according to the customization. However, just like in other operating systems,
    the central role is to connect the user to the device. Linux allows the user to
    access any services that they may need from the device. Linux is not a single
    program or group of tools. When one downloads the Linux operating system, it comes
    with other programs called the `GNU programs`. There are different distributions
    of Linux that are in use today. However, each is customized to suit a user’s needs.
    These distributions remain open source meaning one can modify or customize them
    if they feel that they are hard to use or operate.


    Once one has downloaded the best distribution for themselves, they can then download
    free applications to use with Linux. Most of the claims are free to download,
    just like the operating system. Once one has the apps on their device, they can
    then use them like any other operating system. The applications can be used to
    browse the internet, play games, office suite, among other activities. In case
    you do not like something about the operating system, one can customize it so
    that it is similar to their need. Therefore, in Linux, one will customize the
    operating system by switching various features. The Windows operating system does
    not allow for one to change some functions. Consequently, one can only add third-party
    applications to an already existing operating system. Linux will allow one to
    use what they wish to and eliminate or replace what they do not need in their
    operating system. This is making it straightforward to operate and flexible for
    many organizations that need to make their own custom operating systems.


    ### The Foundation Concept


    One can say that the Linux operating system provides the user with only the core
    components of an operating system. From the core components, the user will then
    move to make their operating system. This will be done through the user adding
    or removing some of the elements that they do not like. Through this elimination
    and replacement method, the user will eventually be able to customize or build
    an operating system of their liking. This is one of the features that the other
    operating systems lack. Other operating systems come fully developed, and very
    little can be changed or customized about them. This can be taken or explained
    best using a building. The windows operating system usually presents the user
    with a whole building, and for this reason, very few things can be changed. However,
    Linux provides the user with the foundation of a building. The user can then build
    the building they want from that foundation. Therefore, on installing the Linux
    operating system, the user will add applications that they prefer, customize the
    desktop to their preferred design.


    ### Core Features


    #### Shell

    One of the most important features of Linux, is the shell. It allows the user
    to enter commands through the command line into the system. In windows, the shell
    is the command prompt. However, the command line has a significant advantage over
    the command prompt. While one can change the functioning of a windows system and
    some of its features, a user can use the command line to improve the functioning
    of Linux. From the command line, one can modify how the system will work. The
    shell is one of the essential tools for a hacker that allows them to develop scripts
    and programs that can be used for hacking.


    #### Boot Loader

    The boot loader is a component of Linux that the user first interacts with. The
    boot loader is automatically installed when one installs Linux. Most users do
    not see it, but it is always working. When a system is powered on, the operating
    system uses the boot loader to open access to the user. In some cases, the users
    may have multiple operating systems installed in their machines. When the users
    have various operating systems, the boot loader allows the user to choose which
    operating system to use. The boot loader will then open the operating system and
    grant access to the user. The boot loader is automatic and runs from the minute
    the system is opened to the minute the user can access the desktop and applications.
    It prepares the system for use.


    ### Starting the System


    When one wants to use a Linux system, the first step is to power the system on.
    Powering the system means that the screen will light up and the boot loader will
    kick on. the boot loader loads the systems in the device. If there are multiple
    operating systems, then the user is allowed to select one to use. After selection,
    the boot loader will allow you to enter a password if any is required. The successful
    opening of the device and loading of the operating system will give the user access
    to the desktop of the device. Accessing the desktop may be a simple task, but
    the desktop of a Linux operating system changes from one device to the other.
    The Linux operating system has very many desktop environments that change how
    the desktop looks. This is unlike in windows operating systems where the desktop
    environment is static, and anyone can use it. The Linux system allows multiple
    desktop environments, and this means how one can access programs and applications
    can change.


    Linux and windows are very different from each other. Therefore, establishing
    the differences between the two operating systems will help one understand how
    Linux works. Windows is very common to most users and can serve as a good point
    of comparison. Various features on windows are replaced on the Linux system by
    other elements of Linux variation.

    '
