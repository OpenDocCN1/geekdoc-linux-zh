- fmt: "\nSince the `/dev/sda*` and `/dev/hd*` device files represent the olden ways\
    \ of partitioning drives, it then becomes a disadvantage when the values are used\
    \ in isolation. When the device changes its nodes during the booting process,\
    \ it poses confusion as to which drive has been assigned a particular name, since\
    \ the Linux kernel decides which drive gets a certain name during each and every\
    \ booting process.\n\nSolving the issue with the `/dev/disk`, subdirectories correspond\
    \ with a defined way of identifying the partitions and disks on the system. The\
    \ subdirectories include symbolic links generated during booting to correct`/dev/(sh)da*`\
    \ files. These links are usually named in accordance with the directory identifying\
    \ the files.\n\n### Subdirectories under `/dev/disk`\n\n- **By label**: File systems\
    \ must have a method of naming files in order to assign a name to a particular\
    \ disk or partition. \n- **By uuid**: The `UUID` or the universally unique identifiers\
    \ are a long string of alphanumerical that can be used as an identification of\
    \ a storage device. The strings are not readable by people but guaranteed to be\
    \ specific across systems. It will be much advisable to use `uuids` to refer to\
    \ storage that may move across various systems since naming collisions cannot\
    \ occur.\n- **By partlabel and by partuuid**: `GPT` tables usually have specific\
    \ labels and even the `UUIDs` used in identification. This directory function\
    \ similar to the previous two directories but uses `GPT` specific identifiers.\n\
    - **By id**: They are dynamic hardware generated directories having their serial\
    \ numbers and the hardware attached to them.\n- **By path**: the directory entirely\
    \ depends on the storage devices that are connected to the system. However, connection\
    \ to a different port alters the original value of the directory; hence, it faces\
    \ similar kinds of drawbacks to by ids.\n\n### Mounting block devices\n\nFiles\
    \ contained within the `/dev` are used in communication with the kernel driver\
    \ for the system. More abstraction is required to make the device as a portion\
    \ of the remaining space. In Linux and similar Unix OS despite the number of devices\
    \ involved the system is represented in a single unified file tree. While accessing\
    \ the driver’s contents you will access them from there. There are various mounting\
    \ options used that alter the mounted devise behavior. To prevent the contents\
    \ from being altered, it is wise to mount the drive in the read-only mode.\n\n\
    Using the file system hierarchy standard, you can mount file systems under the\
    \ `/mnt` or its subdirectory. However, the hierarchy offers no recommendation\
    \ on where to place permanent storage; hence, you can mount them under the `/mnt`\
    \ or `/mnt` subdirectories.\n\n### Making permanent mounts with `/etc/fstab`\n\
    \nThe Linux system checks on the file system table(`/etc/fstab`) to gauge the\
    \ file systems that it will and those that it will not mount during the boot process.\
    \ With the exception of file systems having the `system.mount` unit files, the\
    \ other file system having no entry won’t be mounted automatically. This file\
    \ system is simple as each line must represent a file system that should be mounted.\n\
    \n### Complex storage management\n\nComplex management paradigms are used when\
    \ we want to achieve flexibility, more performance, additional management structures\
    \ or even redundancy.\n\nWhat is raid\n\nIt means a redundant array of an independent\
    \ disk. It allows someone to categorize drives and later manage them as a single\
    \ unit with more capabilities as it uses virtualization technology and also it\
    \ is storage management. The features of raid arrays always depend on the raid\
    \ level. The raid level, on the other hand, defines the relationship of the disk\
    \ in the array. The level will also impact the performance and the redundancy\
    \ of the set.\n\nMost common levels\n\n- **RAID 0**: This level indicates the\
    \ drive splitting phase. By splitting it means that the data is written on the\
    \ array, then split and later distributed among the various disk in that particular\
    \ set. It has merit since it can be read or written. However, it faces drawbacks\
    \ as failure to a single drive can lead to loss of data from the entire array.\
    \ This is due to the fact that no single disk contains enough information about\
    \ the content needed to rebuild.\n- **RAID 1**: Can be used in making a copy of\
    \ some data. For example, you have 2 TB hard drives; in total, you would have\
    \ 4TB hard drives. In mirroring you will be able to see only the 2 TB or the logical\
    \ hard drive. However, while saving data it will write on both drives. The minimum\
    \ number of dives must be more than two since in an event one of the drives fails,\
    \ you will get the data from the other disk; hence ensuring there is no data loss.\n\
    \n### Characteristics of RAID 1\n\n1. It provides fault tolerance capability.\n\
    2. Rebuilt is usually fast.\n3. Its performance is usually fast.\n4. It can be\
    \ used in a small device.\n5. The reading is usually good.\n6. The writing performance\
    \ is usually slow.\n7. Half of the capacity will be lost.\n\n- **RAID 5**: This\
    \ level works by partial distribution, where data is protected. This can survive\
    \ a single drive failure, but if more than one drive fails, it can cause a lot\
    \ of data loss. Characteristics of RAID 5\n\n1. It has excellent performance.\n\
    2. Reading is usually fast.\n3. It provides fault tolerance.\n4. One disk must\
    \ be under parity.\n5. It can be used on a large scale, backups.\n6. Can rebuild\
    \ parity from all the drives.\n\n- **RAID 10**: Raid 10 has similar characteristics\
    \ as raid 5 but does not parity distributes. It needs a minimum of four drives\
    \ so to ensure even if two of the drives fail data can be rebuilding. Characteristics\
    \ of raid 10\n\na) The reading performance is good.\nb) Poor performance.\nc)\
    \ It provides fault tolerance.\nd) Rebuilding is done from two drives.\ne) It\
    \ may be used in long arrays.\nf) It is used on scale.\n\nBasic disk knowledge\
    \ is important in order to know how to the raid setup.\n\nFile system\n\nWhile\
    \ performing storage management, the file system is very important. Deciding which\
    \ file system to be suited for the computer relies on the type of computing you\
    \ want to perform.\n\nThe root directory of a file system contains directories\
    \ and files, At the top of the directory denoted by `/`.\n\n### Types of pathnames\n\
    \n1. **Absolute pathnames**: Files are always identified by their absolute pathnames,\
    \ which starts from the root in an inverted manner. The `/` has 2 different meanings\
    \ in absolute.\n   - Specification of the file directory.\n   - Abbreviation of\
    \ the home directory using `~`.\n   - Abbreviation of the user’s name using `~`.\n\
    2. **Relative path names**: Relative parenthesis starts from the current location,\
    \ unlike the absolute parenthesis.\n"
  raw: 'Since the /dev/sda* and /dev/hd* device files represent the olden ways of
    partitioning drives, it then becomes a disadvantage when the values are used in
    isolation. When the device changes its nodes during the booting process, it poses
    confusion as to which drive has been assigned a particular name, since the Linux
    kernel decides which drive gets a certain name during each and every booting process.


    Solving the issue with the /dev/disk, subdirectories correspond with a defined
    way of identifying the partitions and disks on the system. The subdirectories
    include symbolic links generated during booting to correct/dev/(sh)da* files.
    These links are usually named in accordance with the directory identifying the
    files.


    ### Subdirectories under /dev/disk


    *   By­ label: File systems must have a method of naming files in order to assign
    a name to a particular disk or partition.


    *   By uuid: The UUID or the universally unique identifiers are a long string
    of alphanumerical that can be used as an identification of a storage device. The
    strings are not readable by people but guaranteed to be specific across systems.
    It will be much advisable to use uuids to refer to storage that may move across
    various systems since naming collisions cannot occur.


    *   By partlabel and by partuuid: GPT   tables usually have specific labels and
    even the UUIDs used in identification. This directory function similar to the
    previous two directories but uses GPT specific identifiers.


    *   By id: They are dynamic hardware generated directories having their serial
    numbers and the hardware attached to them.


    *   By path: the directory entirely depends on the storage devices that are connected
    to the system. However, connection to a different port alters the original value
    of the directory; hence, it faces similar kinds of drawbacks to by ids.


    ### Mounting block devices


    Files contained within the /dev are used in communication with the kernel driver
    for the system. More abstraction is required to make the device as a portion of
    the remaining space. In Linux and similar Unix OS despite the number of devices
    involved the system is represented in a single unified file tree. While accessing
    the driver’s contents you will access them from there. There are various mounting
    options used that alter the mounted devise behavior. To prevent the contents from
    being altered, it is wise to mount the drive in the read-only mode.


    Using the file system hierarchy standard, you can mount file systems under the
    /mnt or its subdirectory. However, the hierarchy offers no recommendation on where
    to place permanent storage; hence, you can mount them under the /mnt or /mnt subdirectories.


    ### Making permanent mounts with /etc/fstab


    The Linux system checks on the file system table(/etc/fstab) to gauge the file
    systems that it will and those that it will not mount during the boot process.
    With the exception of file systems having the system. Mont unit files, the other
    file system having no entry won’t be mounted automatically. This file system is
    simple as each line must represent a file system that should be mounted.


    More complex storage management


    Complex management paradigms are used when we want to achieve flexibility, more
    performance, additional management structures or even redundancy.


    What is raid


    It means a redundant array of an independent disk. It allows someone to categorize
    drives and later manage them as a single unit with more capabilities as it uses
    virtualization technology and also it is storage management. The features of raid
    arrays always depend on the raid level. The raid level, on the other hand, defines
    the relationship of the disk in the array. The level will also impact the performance
    and the redundancy of the set.


    Most common levels


     RAID 0 - This level indicates the drive splitting phase. By splitting it means
    that the data is written on the array, then split and later distributed among
    the various disk in that particular set. It has merit since it can be read or
    written. However, it faces drawbacks as failure to a single drive can lead to
    loss of data from the entire array. This is due to the fact that no single disk
    contains enough information about the content needed to rebuild.


     RAID 1 - Can be used in making a copy of some data. For example, you have 2
    TB hard drives; in total, you would have 4TB hard drives. In mirroring you will
    be able to see only the 2 TB or the logical hard drive. However, while saving
    data it will write on both drives. The minimum number of dives must be more than
    two since in an event one of the drives fails, you will get the data from the
    other disk; hence ensuring there is no data loss.


    Characteristics of RAID 1


    1.  It provides fault tolerance capability.


    2.  Rebuilt is usually fast.


    3.  Its performance is usually fast.


    4.  It can be used in a small scale database and operating system.


    5.  The reading of the contents is usually good.


    6.  The writing performance of the raid is usually slow.


    7.  Half of the total space capacity will be lost.


     RAID 5 - This level works by partial distribution, where part of the information
    will be used in rebuilding the data. This ensures our data is protected in the
    eventuality of a drive failure. The partial distributed information is stored
    in each of the drives. This RAID can survive from a single drive failure, but
    if more than one drive fails, it can cause a lot of data loss.


    Characteristics of RAID 5


    1.  It has excellent performance.


    2.  Reading is usually fast due to the high speed involved.


    3.  It provides fault tolerance of drives.


    4.  One disk must be under parity.


    5.  It can be used in strong servers such as web browsers, file servers, and important
    backups.


    6.  Can rebuild parity information from all the drives.


     RAID 10 - Raid 10 has similar characteristics as raid 5 but does not parity
    distributes system. It needs a minimum of four drives so as to ensure even if
    two of the drives fail data can be rebuilding while replacing the fault drives.


    Characteristics of raid 5


    a) The reading performance is good.


    b) Poor performance.


    c) It provides fault tolerance.


    d) Rebuilding is done from two parity drives.


    e) It may be used in long arrays.


    f) It is used on a large scale, backups and video streaming.


    Basic disk knowledge is important in order to know how to the raid setup.


    File system


    While performing storage management, the file system is very important. Deciding
    which file system to be suited for the computer relies on the type of computing
    you want to perform.


    The root directory of a file system contains directories and files, At the top
    of the directory denoted by /.


    ### Types of pathnames


    1.  Absolute pathnames


    Files are always identified by their absolute pathnames, which starts from the
    root in an inverted manner. The (/) has 2 different meanings in absolute parenthesis.ie.


    *   Specification of the file directory.


    *   Abbreviation of the home directory using tilde.


    *   Abbreviation of the user’s name using tilde.


    2.  Relative path names


    Relative parenthesis starts from the current location, unlike the absolute parenthesis.


    Listing Files


    The Is command can be used in listing the contents of the directory. More so,
    you can list files in a deferent 


    directory by typing Is the pathname.


    Changing the working directory


    To change you need to enter your typing the command cd followed by the directory
    you need to change. You could also go back to the home page by typing cd followed
    by the directory when you get lost in a file system.


    The root user


    Linux system has a special user named root, which is a powerful administrator
    of the Linux system. The root can access all the files, including the other users.
    The root can perform all the formatting features to the files. The dream of upcoming
    hackers is to become the root user of a system.


