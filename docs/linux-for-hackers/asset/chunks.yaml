  trans: "\n当你想执行 `Kernel` 时，你需要在内核态下实现它，而不是用户态。因此，运行在系统中的任何应用程序都通过我们所谓的“系统调用”与 `Kernel`\
    \ 通信。系统允许用户利用接口与 `Kernel` 进行平滑的交互。你知道每一个可能与系统交互的函数都会自动转换成系统系统调用吗？这里有一个例子：\n\n\
    ```\nVoid main () {}\n```\n\n假设这是你将看到的最明显的现象之一。在这里，它通过主入口访问并在随后退出。为了让你理解我们所说的内容，这里是内核的分级图。\n\
    \n| 用户进程 | 图形用户界面 | 这里的 | Shell |\n| :--- | :--- | :--- | :--- |\n图 1.1 \n\n|\
    \ Linux 内核 | 系统调用 | 进程管理 | 内存管理 | 设备驱动程序 |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n图 1.2 \n\n| 硬件 | 处理器 | 主内存 | 磁盘 | 网络部件 |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n\n在我们在本指南的过程中，我们将详细解释内核与黑客技术之间的关系。但在那之前，理解一些基础知识是关重要的；这只是一个介绍。\n\n## 应用程序、硬件与内核之间的关系\n\
    \n从图中我们可以看到用户进程运行在用户态，而 `Kernel` 运行在内核态。这意味着如果代码运行在内核态，它就可以无任何限制地访问处理器（`CPU`）和主内存。尽管这可能让你感到高兴，但内核的这一特性可能会很容易导致整个系统崩溃。\n\
    \n因此，用户态限制了对处理器的直接访问。这就是为什么当任何用户误操作进入处理器并更改 `CPU` 的功能时，它会导致整个系统崩溃。当崩溃的情况不严重时，内核会尝试清理所造成的烂子。尽管如此，你有正在运行的程序，它们也将无法照常工作。当你更改用户界面时，与内核相比，它可能引起严重的损害。\n\
    \n硬件是计算机的物理部分，保存着机器的内存，即随机访问存储器。它存储保存在文件中的信息，并协助中央处理单元更快、更高效地加载文件。计算机的所有输入和输出都通过主内存运行。内部内存中存在你需要了解的一些内存。\n\
    \n主内存 – 这里我们有随机访问存储器 (`RAM`) 和只读存储器 (`ROM`)。\n\n1. `RAM` – 以这种形式存储的数据在用户进行提示时可以随时被访问。这种内存具有极强的易失性，你可以对其进行读写。假设掉电了，这种内存将无法追踪。我们有不同类型的随机访问存储器。\n\
    \n- `SRAM` – 这是静态随机访问存储器。这是你可以获得的最昂贵的内存之一。这种内存有几个版本，如 `DDR2`、`DDR3` 和 `DD4`，它们都比比\
    \ `DDR` 更好的性能。每个单元由六个电容器。\n- `DRAM` – 动态随机访问存储器是计算机中最常用的内存类型。与 `SRAM` 相比，这种内存较慢，每个单元有一个电容器和一个晶体管。\n\
    \n2. `ROM` – 顾其名，这种数据只能读取不能写入。对于用户来说，这是一种快速的数据。与随机访问存储器不同，断电后以后可以访问这些数据。我们可以说，即使断电，计算机不需要软件来帮助\
    \ `CPU` 通信。这种内存有数百万个晶体管和电容器。现在，当这两个部分结合时，它们就形成了我们所谓的内存单元，由单个位表示。电容器桶存储电子，尽管有时桶可能会漏水。动态随机访问存储器在放电之前帮助为空空的桶充电。这个过程在许多循环中反复进行，以便处理器能够读写内存。\n\
    \n这是一个需要理解的关键点，因为在黑客攻击期间，如果你不了解应该与哪种内存工作，我们的数据可能会被追踪。当你想要黑进计算机的内存时，你可以进行诸如真空、游戏漏洞利用、调试模式等操作。在任何情况下，如果内存操作是不可能的，那么进行操作将具有挑战性。\n\
    \n内核是 Linux 的心脏。图 1.1 概述了 Linux 内核的功能。在它的进程部分，`Kernel` 选择哪个进程先被允许运行而不是另一个。在内存部分，`Kernel`\
    \ 帮助记录内存，例如分配给特定进程的内存量或可以共享的内存量。在设备部分，驱动程序充当硬件和进程之间的接口，进程为了与内核通信，它们使用系统调用。\n\n\
    ## 使用 Linux 的益处\n\n这里是使用 Linux 的益处：\n\n1. **安全性** – 与其他操作系统相比，Linux 是最安全的操作系统。你会发现，当恶意软件攻击它时，其他操作系统非常脆弱。更有趣的是，在任何病毒攻击或授权登录之前，用户必须输入密码。\n\
    2. **可靠性** – 它具有极好的稳定性，使用户能够高效地使用它 - 不需要因为某些错误而不断重启电脑。\n3. **免费使用** – 你可以去浏览器下载该操作系统，而不需要被要求输入激活密钥。\n\
    4. **多任务** – 你能够使用系统执行不同的任务，而不会像在其他操作系统那样遇到很多困难。即使当你需要处理很多任务时，它也不会降低速度或效率。这很棒，因为它为黑客提供了同时监控不同事物的机会。\n\
    5. **不同的发行版** – 通过 Linux 系统可以有很多发行版，这些发行版被称为发行版（bistros）。\n6. **开源** - Linux 的一个优点是它的源码对所有人开放。根据你想要执行的具体事情，你可以自由地执行、添加或修改代码；这在其他操作系统上是罕见的。\n\
    7. **更新** – 使用 Linux 时，你会注意到很多软件更新提示。软件更新很容易更新，只需几秒钟即可完成。\n\n你会发现，与另一个操作系统相比，使用它具有独特的优势。所有这些特征结合在一起，让你在进行黑客攻击时需要这个操作系统。`Ubuntu`\
    \ 是最直接的 Linux 语言。这是因为一旦你理解了命令是如何执行的，就会学会如何使用它。\n\n# 第 2 章：黑客攻击与黑客需要的技能\n\n###\
    \ 什么是黑客攻击？\n\n在使用一些可以用于黑客攻击的技术之前，首先你需要详细了解什么是黑客攻击。当我们谈论黑客攻击时，我们指的是一个主动寻找系统漏洞的过程。一旦你发现了这些漏洞，就可以利用这些弱点帮助你非法访问。这是通过破解操作系统算法来实现无密码访问。\n"
