    ## 1. Local environment set up

    Before one can use python for scripting, then they must have python in their computers.
    In some operating systems, Python is pre-installed. In some operating systems,
    one has to acquire python from a different source. For the user to ascertain whether
    they have python, one needs to open a terminal window and type `python` to establish
    whether it is installed or not. There are various varieties of python that is
    installed in the various operating system; this step allows one to identify the
    type installed as well.


    ## 2. Getting python

    In case of python is not installed on the device, one will need to download it.
    The user will need to visit the official python website, where they will get the
    latest source codes, news, and documentation. The website will not only help the
    user to get python; the user will get access to various documentation to guide
    on using python.


    ## 3. Installing python

    there are a few steps to follow to install and begin using python. When using
    a Linux operating system, one will visit the official python website and download
    python source code in the form of a zip file. Once downloaded, extract the files
    and edit the setup file in case one needs to make modifications. The next step
    is running the `./configure` script. Click `make`. Then click `make install`.


    ## 4. Setting PATH

    The path is the directories that the operating system will search for executables.
    Executables are an essential part of the codes, and therefore the user gets a
    chance to define how they will be obtained. In every operating system, adding
    directories is different. In Linux, one has to follow these steps to add python
    directories to the path.


    - In the `csh` shell − type `setenv PATH "$PATH:/usr/local/bin/python"` and press
    Enter.

    - In the `bash` shell (Linux) − type `export PATH="$PATH:/usr/local/bin/python"`
    and press Enter.

    - In the `sh` or `ksh` shell-type `PATH="$PATH:/usr/local/bin/python"` and press
    Enter.

    - Note — `/user/local/bin/python` is the path of the Python directory


    ## ### Python scripting using Kali Linux

    Once a user has opened their computer and identifies that it runs on Kali Linux
    you will need to confirm what version of python you are using so as to begin scripting.
    These are the steps to follow before one can begin scripting using Linux.


    1. Verify the python version to achieve this, and the user will need to click
    on the terminal on the desktop. The next step is to type the word `python` on
    the terminal, and the computer will respond with the name of the python language
    installed. The process will look as shown below.


    ```

    Username: -$ python

    <Python version> <date> <time>

    ```


    2. Proceed to test if python is working properly. It can be through the application
    of a simple test such as running a script that you already know about python.
    One can also use arithmetic tests as follows. Simply type your text on the screen


    ```

    >>> 20+40 then press enter button

    60

    ```


    The answer to the sum will be displayed on the terminal.


    One can proceed to perform other tests on python to ascertain its functionality.


    3. Close the test so as to begin scripting. Closing the script involves running
    one command only as follows.


    ```

    >>> exit( )

    ```


    4. When one wants to use prebuilt packages, one can visit the python index official
    website and select what package they will be using in their hack.


    5. Once the installation of the packages is complete, one can then proceed to
    run and type their scripts. It is essential to understand the syntax that should
    be used in python scripting. It is, however, quite a simple syntax.


    On the terminal typing on python will look as follows.


    ```

    In [1]: print “call user.”

    Call user

    ```


    The specific words that one uses to help insert command and run them on python
    are called syntax. For example, the use of the word `print` to ask the program
    to display certain words. Therefore it is essential that one when scripting is
    able to understand the syntax as they are essential to ensure that the script
    is executable later.


    - `Print()` - A function to display the output of a program.

    - `Range()` - returns a list of integers, the sequence of which is defined by
    the arguments passed to it.

    - `Sets` - Sets are collections of unique but unordered items.

    - `Str()` - allows the user to represent the content of a variable as a string.


    ## ### Managing Linux kernel modules

    The Linux kernel is Linux operating system`s core part. It is in charge of operating
    the computer and the hardware. There are two types of kernels which include the
    microkernel and monolithic kernel. The microkernel is in charge of the functionality
    of the operating system. The microkernel will manage the memory and CPU time.
    The monolithic kernel is in charge of the device drivers. When the two types are
    combined and work together, they help manage the operations of the operating system
    as well as the hardware. Modules in the Linux operating system are pieces of code
    that can be loaded or unloaded upon demand by the operating system. The function
    of these modules is to help extend the functionality of the OS without having
    to shut down the whole system.


    The ability to load and remove modules from Linux is one of the most significant
    advantages of this operating system. This is because it helps to reduce the size
    of the operating system. Without the ability to load modules or remove them, then
    it would mean that the operating system would come with systems to help complete
    any anticipated functions loaded in the base kernel. Loading the modules will
    lead to wasting of memory and with users having different needs, then they would
    be useless to some users. Linux has three major kernel modules: file system drivers,
    device drivers, and system calls.


    One major reason why people prefer to compile their kernels is that some drivers
    (and other kernel features) need to be patched. At times some of the kernel features
    may get broken. When this is the case, patching up may need the user to develop
    their kernels. Another case where a person may develop a kernel is when they need
    to update the drivers or needs to use new ones. They may result in developing
    a new kernel. Compiling one’s kernels will mean that the person will remove some
    kernels and build new ones. The process of removing the older kernels and replacing
    them with new ones will mean that the system is optimized. The optimization, in
    many cases, can result in a faster system for the user. However, this is just
    an advantage and not a reason to build and replace kernels.


    ### Inserting modules

    The presence of only three kernels leads to the need to add some more kernels
    to help enhance functionality. In the normal Linux OS, modules are kept in the
    `/lib/modules//kernel/` directory, and they have a `.ko` extension. To insert
    a module into the kernel, one should use the `insmod` command. The user will simply
    type the syntax `insmod <module_name>.ko`.


    For example:

    ```

    # insmod /lib/ modules/ 4.4.0-21-generic /kernel/ drivers/cpufreq /SpeedStep-
    lib.ko

    ```


    ### Removing modules

    At times, one may decide that some modules are not useful at the time. They will,
    therefore, need to remove them from the kernel. To remove the modules from the
    kernel, the user needs to use the `rmmod` command. `rmmod <module_name>.ko` is
    the syntax for removal of modules. However, it is essential to note that a module
    in use by a program cannot be removed.


    For example:

    ```

    # rmmod /lib/ modules /4.4.0-21-generic /kernel/ drivers/ cpufreq/ speedstep-lib.ko

    ```


    ### Creating and loading a kernel module

    One can be able to create and add their new kernels to their operating systems.
    Creating new kernels is a simple step process. Below are the steps to follow in
    the process of creating a kernel.


    1. Add the header lines. The general format for adding the header lines is as
    follows.


    ```c

    #include <Linux/ kernel.h>

    #include <Linux/ init.h>

    #include <Linux/ module.h>

    ```

