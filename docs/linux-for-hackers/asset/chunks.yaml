    - **Hacktivist** – This kind, hacks websites and leaves messages on the hacked
    sites. The message he leaves maybe about political, religious, social, global,
    government issues related. Most often, they are negative messages.

    - **Black hat** – His main aim is to access a computer to get data mainly for
    self-gain. He intends to violate the copyrights or steal money.

    - **Ethical hacker** – He is also known as a white hat. He hacks the system of
    the computer to identify the weakness of a computer and fix it. They can test
    a system to see if it is vulnerable to hackers.

    - **Grey hat** – This person hacks a computer system without authority. His main
    aim is to identify the problem and tell the system owner.


    Therefore, ethical hacking is the most recommended since you get access to the
    computer using by legally accessing. As an ethical hacker, make sure you get permission
    to access the system owner. You have the mandate to secure your clients’ data
    from being hacked by users instead inform the necessary personnel. This person
    can protect data or if you are a guru, then do the protection.


    ## Types of Hacking Techniques and Precautions to Take


    Here are some of the hacking methods that a hacker uses while hacking:


    ### Passive attacks

    This type is where the hacker tries to hack the computers by looking at the weakness
    available. The main mission done by this type of hacking is to get information
    about a specific company and not necessarily change any information.


    The attack can either be active or passive reconnaissance. In the active reconnaissance
    the attacker may try to access through ports scans while in passive, the attacker
    monitors the activities done.


    ### Methods of Passive


    - **Dumpster diving** – Here the intruder gets some of the information from dustbins.
    These are saved passwords in the dustbin. They use the passwords to access the
    locked information and covert the system entries. This tells you not to save passwords
    in your computer or forgetting to delete them permanently in case anything happens
    to your machine, system or network.

    - **War diving** - This method is done by intruders getting vulnerable WIFI networks
    through the processing of scanning. Mainly, this is done by a portable antenna
    by a moving vehicle. Many people like accessing free WIFI in public places; this
    gives the intruders the chance to access those open networks easily. The main
    aim of this hacking method is to access internet connections.

    - **Waterhole attacks** – This name was inspired by these predators who like staying
    near the watering hole to attack the prey. Now, the intruders stay near the niche
    of the sites to hunt when the users access the website and try to attack using
    malware.


    They attack the site by sending affected Html codes when the user clicks on the
    site it redirects on other sites. Making them unable to access the specific information
    they were looking for. Afterward, the compromised site infects the targeted users
    once they access the link.


    ### Ways to Defend Against Waterhole Attack


    - **Two-factor authentication** – You will find what they steal your passwords
    and username. To prevent being attacked use two-factor authentication which, makes
    it hard for them to guess the codes or any other way used in this way.

    - **Disable tools vulnerable to watering hole** – Some software is easily affected
    or vulnerable to attacks so if possible, remove them. Some of this software is
    adobe’s flash.

    - **Security audit** – Depending on which country you are, you can decide to get
    a security audit in one of the companies well known in IT services.

    - **Update software** – Attackers take advantage of hacking a system because of
    not updating software regularly. Security is key for every business database so
    keep updating some of the software on your computer or else you become a victim
    of hacking.

    - **Monitor network** – Have a regular update monitoring, this helps you keep
    track of those people visiting the site. `SSL` – traffic checker can help you
    do that.


    **Keylogger** – It is also called a monitoring software. It is like a CCTV that
    monitors every activity taking place loggings, downloads, chats, etc. They do
    that by logging into your keyboard so that you do not suspect that anything is
    going on. They can access sensitive information such as credit card numbers, passwords
    and things like account information.


    Keylogging can be done in a positive way, like parents monitoring their children
    from going to dangerous sites that may lead to cyber crimes and frauds. Sometimes
    it might be difficult to detect if you have a keylogger. You can note when your
    keyboard keeps redirecting you to a certain site, slower performance than usual
    or screen error messages.


    ### How to Protect Against a Keylogger


    - **Password manager** – Most of these password managers use the feature of autofill
    that helps you remember the password. But did you know this is dangerous? Yes,
    hackers can save the password. Although some keyloggers save passwords when typed
    on keyboards, it is good to check whether if your computer/system has this suspicious
    keylogger. As a company, a keylogger can be used to check unusual activities.

    - **Be cautions** – This happens almost to everyone where you receive links from
    unknown people. Some of these links are infected and are sent to prompt you to
    click them. The click of those links is the beginning of the hacking. You’ll find
    once you click on these links your computer starts misbehaving or redirecting
    to specific sites.

    - **Keyboard layout** – Perhaps, try to change the design of your computer. Keylogger
    is available in QWERTY layout, try changing it to `DVORAK`. This is because it
    becomes hard to convert the captures in that layout.

    - **Security tools** – To put extra security measures in your computer, you need
    to put additional security tools. Some tool like `Ghost press` is an anti-keylogger
    that stops other programs from running behind the system without knowing.

    - **Change passwords** – In case you suspect someone is logging to your mails
    then try to put the hard password but easy to remember. A hacker may steal your
    password and not necessarily use it immediately. Keep changing your password just
    in case in future he tries to hack the system unexpectedly.


    ### Cookie theft

    Cookie data is available when in transit. It is always sent in the form of headers
    in sites this makes them vulnerable to attackers. In public places, this becomes
    riskier since they access easily.


    ### Cookie Manipulation


    - Did you know cookies can be manipulated? Yes, cookies are manipulated. Most
    users like saving their data using cookies, only save non-sensitive data with
    cookies. The reason being, an attacker, will definitely use your cookies to get
    some sensitive information.

    - An alternative for this is saving your data in the server-side session. The
    session is more of a database file that keeps records of your personal information.
    It helps the user avoid the danger of data being manipulated.

    - To help yourself from the manipulation, put cookies expiry dates. So, after
    a while, the information will be no more, thus lingers it from exploitation. Visiting
    non-`SSL` sites puts one in danger of exposing their data to malicious sites.
    `SSL` encrypted sites are more saver sites to visit since they have secured cookies
    that prevent you from damage.

    - Another way to save yourself from cookie manipulation is by using suitable algorithms.
    The algorithms help in both encryption and decryption of values. This is very
    significant because supposing the cookies are in plain text and fail to operate.
    Then they are never prompt to attacks because the algorithms in place are hard
    to crack.

    - Additionally, people decide to sign their cookies as a protection defense tool.

