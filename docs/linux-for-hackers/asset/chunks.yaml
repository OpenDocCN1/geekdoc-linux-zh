    \n## Relationship Between the Applications, Hardware, and Kernels\n\nFrom the\
    \ diagram, we can see that the user process runs in the user mode whereas, the\
    \ `Kernel` runs in the kernel- mode. That is if a code is running in the kernel\
    \ mode can access processor (`CPU`) and the main memory without any restrictions.\
    \ Although this might make you happy, this feature of the kernel can easily crash\
    \ a whole system down.\n\nThe user mode, therefore, restricts access directly\
    \ to the processor. That is why when any users mistakenly go to the processor\
    \ and alter the functioning of the `CPU`; it crashes the whole system. Where cases\
    \ of a crash are not mild, then the kernel tries to clean up the messes done.\
    \ Although if you had running programs, then they will not work as usual. When\
    \ you alter the user-face, it may not cause severe damages compared to the kernel.\n\
    \nHardware is the physical part of the computer holding the memory of the machine\
    \ that is the Random-Access Memory. It stores information that has been saved\
    \ in files and also assisting the central processing unit in loading files faster\
    \ and efficiently. All inputs and outputs of the computer run through the main\
    \ memory. There are some memories found in the internal memory that you need to\
    \ understand.\n\nPrimary Memory – here we have the Random-Access Memory (`RAM`)\
    \ and Read-Only Memory (`ROM`).\n\n1. `RAM` – Data stored in this form can be\
    \ easily accessed anytime when a user does a prompt. This type of memory is exceptionally\
    \ volatile, where you can write or read. Suppose power goes off, then this memory\
    \ cannot be traced. We have different types of Random-access Memory.\n\n- `SRAM`\
    \ – This is static random-access memory. It is one of the most expensive memories\
    \ you can ever get. There are several versions of this memory such as `DDR2`,\
    \ `DDR3`, and `DD4`, all giving the user a better performance than `DDR`. It consists\
    \ of six capacitors in each cell.\n- `DRAM` – Dynamic random-access memory is\
    \ the most commonly used type of memory in computers. Compared to `SRAM`, this\
    \ kind of memory is slower with a capacitor and transistor in each cell.\n\n2.\
    \ `ROM` – As the name suggests this type of data can only be read but unable to\
    \ write. It is a fast kind of data for the users. Unlike random-access memory,\
    \ when the power goes off, one can access this data later on. We can say, even\
    \ when power is off the computer does not need software to help the `CPU` communicate.\
    \ This memory has millions of transistors and capacitors. Now, when these two\
    \ parts are combined, they form what we call a memory cell denoted by a single\
    \ bit. A capacitor bucket stores electrons though at times the bucket may leak.\
    \ The dynamic random-access memory helps recharge the emptied buckets before doing\
    \ the disbarment. The process is repeated repeatedly in very many cycles to enable\
    \ the processor to read and write memory back.\n\nThis is a key point to understand\
    \ since, at times during hacking our data can be traced if you do not understand\
    \ which memory to work with. When you can to hack the memory of a computer, you\
    \ can do stuff like Vacuums, game exploits, good modes and much more. In any case,\
    \ if memory manipulation is impossible, then it will be challenging to do the\
    \ manipulation.\n\nThe kernel is the heartbeat of Linux. Figure 1.1 gives an overview\
    \ of what the Linux kernel does. In the process part of it, the `Kernel` selects\
    \ which process is to be allowed first before the other. In the memory, `Kernel`\
    \ helps keep a record of memory like the amount of memory to allocate to a particular\
    \ process or the amount of memory that can be shared. In the device, drivers act\
    \ as an interface between the hardware and processes, for processes to have a\
    \ communication to the kernel they use system calls.\n\n## Benefits of Using Linux\n\
    \nHere the benefits of using Linux:\n\n1. **Security** – Compared to other operating\
    \ systems, Linux is the most secure OS to use. You will find that other operating\
    \ systems are very vulnerable when malware attacks it. What makes it more interesting\
    \ is that before any virus attacks or authorized logins, one has to insert the\
    \ password.\n2. **Reliable** – It has excellent stability that enables the users\
    \ to use it efficiently - no need of keeping rebooting your computer because of\
    \ some errors.\n3. **Free to use** – It is possible to go to your browser and\
    \ download the operating system without asked to insert the activation key.\n\
    4. **Multitask** – You are able to perform different tasks using the system without\
    \ a lot of difficulties like we find in the other operating systems. It does not\
    \ decrease its speed or efficiency even when you need to take on a lot of tasks.\
    \ It is great since it provides a hacker with the opportunity to monitor different\
    \ things all at once.\n5. **Different distributions** – With the Linux system\
    \ it is possible to do many distributions, these distributions are called bistros.\n\
    6. **Open source** - Something good about Linux is that its sources are available\
    \ for everyone. Depending on the exact thing that you want to do, then you are\
    \ free to execute, add or modify the codes; which is a rare thing found on the\
    \ other operating systems.\n7. **Updates** – When using Linux, you will notice\
    \ so many software updates prompts. The software updates are easy to updates which\
    \ takes a few seconds for them to updates.\n\nYou’ll notice that it has unique\
    \ advantages when using it as opposed to another operating system. All these features\
    \ combined give you the need to use this OS’s when doing the hacking. `Ubuntu`\
    \ is the straightest forward Linux language to use. This is because you will learn\
    \ how to use it once you understand how the commands get executed.\n\n# Chapter\
    \ 2: # Hacking and the Skills Hackers Need\n\n### What is Hacking?\n\nBefore going\
    \ ahead with some of the techniques that we can use with hacking, first, you need\
    \ to understand what hacking is in detail. When we talk about hacking we are looking\
    \ at a process that will actively search for vulnerabilities in the system. Once\
    \ you find these vulnerabilities, then you use the weakness to help you gain access\
    \ illegally. This is done by cracking the operating system algorithm to be able\
    \ to access without a password.\n\nWhen computers interact with each other externally,\
    \ they run the risk of getting hacked. So, who is a hacker? This is the person\
    \ behind the hacking. He tries to access the computer and tries to get the weakness\
    \ of a computer. This means hackers are very skillful with computers for them\
    \ to be able to know how to alter with data manipulation – their classification\
    \ is the following categories.\n\n- `Phreaker` – Tries to identify a weakness\
    \ in a telephone.\n- `Script kiddies` – this type of hacker is not skilled. He\
    \ uses tools online to enable him to do the hacking.\n"
