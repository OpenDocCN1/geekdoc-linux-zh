  trans: '

    一个区别在于 Linux 拥有许多可定制的发行版。这与 Windows 不同，Windows 并没有变体。例如，Linux 拥有如 `kali`、`ubuntu`
    等根据用户需求定制的选项。Windows 只有 `windows 10`、`windows XP` 等版本以及其他变体。另一个区别出现在命令行中。所有的 Linux
    发行版都带有命令行，允许用户自定义操作系统。然而，Windows 的命令提示符仅允许执行有限的任务，而永远无法自定义操作系统。虽然运行和安装 Linux 的时间较短，但
    Linux 可以运行非常复杂的任务。相比之下，由于一次需要安装许多项目，Windows 的安装时间会很长。


    Linux 只需要安装几个项目，并根据需要添加其他项目。由于自定义和添加内核，这使得安装过程变得复杂。在 Linux 中，更新仅在有需要或用户选择时进行。这确保了更新是稳定且易于安装的，因为可以逐部分更新。然而，Windows
    更新需要一起运行，耗时更长。当它们全部安装失败时，操作系统的运行会受到严重影响。Linux 操作系统很难被破解，使其更加安全。这与 Windows 操作系统不同，在
    Windows 上，人们必须安装防病毒程序来避免病毒和恶意软件。Windows 中的恶意软件和病毒可能来自许多不同的地方，因此必须保持谨慎。


    ## 用于攻击的 Linux


    当人们谈论使用 Linux 进行攻击时，他们是以全面的的方式在讨论。这是因为有多个 Linux 发行版，每个发行版都有大量的黑客工具。这意味着有很多选项可以使用
    Linux 进行黑客。然而，使用 Linux 进行黑客的过程对于每个发行版和每个工具来说几乎是相同的。因此，可以创建一个使用 Linux 进行攻击的过程概述。


    学习如何使用 Linux 进行攻击的第一步是理解 Linux 操作系统。在 Linux 中，黑客拥有一个显著优势，形式为命令行界面。命令行界面与 Windows
    中的命令提示符类似的工具，允许用户编写脚本。然而，命令行的主要优势在于它可以根据用户需求进行定制。换句话说，用户对 Linux 操作系统的控制权比 Windows
    大得多。因此，意识到如何使用整个系统是学习如何用它进行攻击的重要一步。


    下一步是需要更多地了解网络知识。如果打算打破规则，就需要理解规则及其运作方式。因此，在学习如何黑客时，需要知道系统是如何工作的。网络涉及理解计算机如何交换数据以及它们如何工作。黑客攻击由理解网络及其过程组成，以便利用这些过程并获取信息链和交换的权限。


    Linux 是黑客最亲的朋友之一。这是因为通过 Linux，黑客可以开发一个平台，通过该平台入侵系统和应用程序。因此，要使用 Linux 进行攻击，需要具备一些使用
    Linux 的必要技能。人们需要开发帮助他们导航 Linux 系统的技能，并构建可以用于入侵系统的脚本。此外，Linux 拥有许多用于黑客的工具。拥有 Linux
    技能至关重要，以便能够恰当地使用这些工具。黑客还必须理解用于保护程序的各种安全概念。Linux 被用于开发这些程序的大多数安全防护。因此，通过理解 Linux
    系统，黑客将能够如何避免管理员在保护程序、应用程序甚至网站时所使用的这些安全陷阱。


    Linux 是可以学习编写脚本的最佳操作系统之一。这是因为为用户提供了许多语言来编写脚本。用户可以选择任何他们认为简单易懂的语言。Linux 允许用户切换语言，而
    Windows 则做不到。Windows 对不同的代码语言并不十分友好。因此，Linux 是学习编程语言的更好选择。用户可以使用 Linux 发行版来学习脚本技巧。


    ## 如何攻击以及你需要什么


    黑客攻击是利用计算机技能和软件来克服技术问题。当提到黑客一词时，大多数人会有不同的反应。有些人会觉得黑客是坏事，但事实并非如此。有多种类型的攻击，其中一种是伦理黑客。黑客攻击可以解决现代工作者遇到的任何问题。相比之下，它也被用于许多相反的活动，导致黑客攻击留下了负面声誉。然而，为了获取多种信息，学习如何攻击各种系统是至关重要的。一个人需要许多工具和技能来完成一次攻击。


    ### 要求


    1. Linux 操作系统-`这是运行攻击的平台。Linux 允许用户编写和实现各种程序，因此在黑客期间易于使用。操作系统可以是多个发行版，如 `Kali`、`Ubuntu`、`Backtrack`
    等。

    2. HTML 编写知识-`超文本标记语言是计算机使用的主要语言，可以用于向网络发送指令。在没有编程知识的情况下，必须在 `HTML` 方面拥有专业知识。编写
    `HTML` 的能力有助于编写代码。

    3. 基础编程知识-`大多数网站和应用程序都是基于程序的。编程是关于这些网站和应用是如何创建以及如何运行的知识。黑客攻击是打破这些平台的规则，入侵这些平台，因此必须知道规则。程序员在编程时使用各种语言，包括
    `Python`、`Javascript` 和 `Java`。程序员使用的每种语言都为他们提供了一系列优缺点。


    一旦具备了要求，就必须遵循攻击的各个步骤。当级别被正确监控时，这将是一个简单的过程。这些步骤可以被称为阶段，共有五个阶段。阶段包括`侦察`(reconnaissance)、`扫描`(scanning)、`获取访问`(gaining
    access)、`维持访问`(maintaining access) 和`清除踪迹`(clearing tracks)。


    1) 侦察- 在此阶段，人们需要收集关于他们正在攻击的平台的尽可能的信息。信息应分三部分收集，包括`网络`(network)、`主机`(host) 和`涉及人员`。数据收集可以通过被称为`足迹探测`(footprinting)
    的方法进行。可以是`主动足迹探测`(active footprinting)，包括通过与目标交互来收集信息。`被动足迹探测`(Passive footprinting)
    包括在不与目标交互的情况下收集目标信息。


    '
- fmt: "\n## 2) Scanning\nThis involves data collection of relevant information that\
    \ one can use to gain access. In the scanning process, one will also evaluate\
    \ which of the weaknesses found will be used to ensure that the hacker has been\
    \ able to gain access to the system. Scanning should be conducted according to\
    \ the various types of scans. One should first conduct a scan of the network and\
    \ ports to understand the program or the system better. Use the ideas gained to\
    \ know where there can be possible vulnerabilities. It is essential that scanning\
    \ is conducted systematically that will ensure that the hacker does not forget\
    \ to scan for anything. In the current phase, there are three types of scanning,\
    \ including port scanning, vulnerability scanning, and network mapping.\n\n###\
    \ Port scanning\nIn this scanning, the hacker will look for services that run\
    \ on the target, open ports, and live systems.\n\n### Vulnerability scanning\n\
    Look for weaknesses in the target that one can use to gain access to the system.\
    \ Once the defects have been identified, they can be exploited later.\n\n### Network\
    \ mapping \nInvolves mapping out and getting an idea of how the target is arranged.\
    \ For example, what network is being used, routers, and firewalls that protect\
    \ the system. This information is essential in the hacking process and organizing\
    \ the hack.\n\n## 3) Gaining Access\nThe hacker will attempt to break into the\
    \ system. This can be through the use of various tools. The hacker will also need\
    \ to increase their privilege so that they can accomplish their task.\n\n## 4)\
    \ Maintaining Access\nOnce the hacker has gained access, they can be kicked out\
    \ or locked out by the security system of the target. The hacker has to maintain\
    \ access through uploading trojan, rootkits, or malicious files. This may reduce\
    \ the privilege for the administrator or even help the hacker to keep the connection\
    \ without knowledge of the administrator.\n\n## 5) Clearing Tracks\nA hacker can\
    \ be seen as a thief or an intruder. After accessing the system, the administrator\
    \ will want to catch the intruder. The hacker, therefore, needs to cover up their\
    \ tracks to avoid being caught. This step, therefore, will involve the hacker\
    \ modifying the logs to the system to remove any evidence of them accessing the\
    \ network. If the hacker had uploaded any files or installed any applications,\
    \ they need to uninstall them to ensure that the administrator cannot detect their\
    \ presence.\n\nThe above phases are a basic outline of the hacking process. All\
    \ hacks follow a similar process. Various modifications can be made by the hacker\
    \ to fit the needs of the hacker. For example, if one wants to prove or show the\
    \ weakness of a system, they do not have to clear tracks. Failure to cover their\
    \ tracks will help the administrator identify that there was an intruder in the\
    \ order. Once the hacker has infiltrated the system, they can do whatever they\
    \ desire. It is significant to note that in many cases that hackers are seen as\
    \ a threat to the system despite having good intentions.\n\n## Python scripting\
    \ for the hacker\n\n### Introduction to Python\nPython is an interpretive language\
    \ accompanied by elegant syntax, which makes an outstanding choice for scripting\
    \ and rapid application development in many areas. It is a dynamically typed programming\
    \ language. Python is also better for data manipulation and repeated tasks. Its\
    \ ability to manipulate data makes it very good for hacking. It has very easy\
    \ language and syntax that a hacker can use to make the best scripts. It has a\
    \ large database and very many libraries that allow the user to have access to\
    \ much information that they may need to hack any system.\n\nFurther, the fact\
    \ that the language has very little syntax makes it simple to use. Experts also\
    \ prefer to use because one does not have to struggle with the syntax. This will\
    \ mean that a beginner will have an easy time creating scripts using `python`.\
    \ Its high performance is also another reason as to why it has a very large number\
    \ of users.\n\n### Applications of Python\n1) GUI based desktop applications\n\
    \    - Image processing\n    - Games\n    - graphic design applications\n    -\
    \ Scientific and computational applications\n2) Operating systems\n3) Web frameworks\
    \ and web applications\n4) Prototyping\n5) Enterprise and business applications\n\
    6) Language development\n\nA `python script` is the text file with statements\
    \ that are used to develop a `python` program. Once a person has a `python script`,\
    \ they can execute the program without having to rewrite it repeatedly. Therefore,\
