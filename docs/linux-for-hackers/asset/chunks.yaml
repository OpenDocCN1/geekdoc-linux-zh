  trans: "\n\n## 2) 扫描\n这涉及收集相关信息，这些信息可以用于获取访问权限。在扫描过程中，人们还将评估发现的哪些漏洞将用于利用，以确保黑客能够访问系统。扫描应该根据各种扫描类型进行。人们首先应该对网络和端口进行扫描，以更好地了解程序或系统。利用获得的想法来确定可能存在漏洞的地方。系统地进行扫描至关重要，这可以确保黑客不会遗漏任何扫描项。在当前阶段，有三种扫描，包括端口扫描、漏洞扫描和网络拓扑。\n\
    \n### 端口扫描\n在这种扫描中，黑客将寻找在目标上运行的服务、开放的端口和活动系统。\n\n### 漏洞扫描\n寻找目标中的缺陷，以便用于访问系统。一旦识别出这些缺陷，稍就可以进行利用。\n\
    \n### 网络拓扑\n涉及绘制拓图并了解目标的布局情况。例如，正在使用什么网络、路由器以及保护系统的防火墙。这些信息在黑客过程中和组织攻击过程中至关重要。\n\
    \n## 3) 获取访问权限\n黑客将尝试入侵系统。这可以通过各种工具实现。黑客还需要提升他们的权限，以便完成任务。\n\n## 4) 维持访问权限\n一旦黑客获得了访问权限，他们可能会被目标的安全系统踢出或锁定。黑客必须通过上传木马、根内核或恶意文件来维持访问权限。这可能会降低管理员的权限，甚至帮助黑客在管理员不知情的情况下保持连接。\n\
    \n## 5) 清除踪迹\n黑客可以被视为小偷或入侵者。在访问系统后，管理员将想要抓住入侵者。因此，黑客需要掩盖自己的足迹以避免被发现。这一步骤将涉及黑客修改系统日志，以删除他们访问网络的任何证据。如果黑客上传了任何文件或安装了任何应用程序，他们需要卸载它们，以确保管理员检测不到他们的存在。\n\
    \n上述阶段是攻击过程的基本概述。所有的攻击都遵循相似的过程。黑客可以根据自己的需求进行各种修改。例如，如果有人想证明或展示系统的弱性，他们就不需要清除踪迹。未能掩盖足迹将有助于管理员识别出有入侵者进入。一旦黑客渗透系统，他们就可以随心所欲。值得注意的是，在很多情况下，尽管黑客意良好，他们仍被视为系统的威胁。\n\
    \n## 黑客的 Python 脚本编程\n\n### Python 简介\nPython 是一种带有优雅语法的解释型语言，这使其成为许多领域中脚本编写和快速应用程序开发的卓越选择。它是一种动态类型编程语言。Python\
    \ 也更适合数据处理和重复性任务。它处理数据的能力非常适合黑客攻击。它拥有非常简单的语言和语法，黑客可以使用它来编写最好的脚本。它拥有庞大的数据库和许多库，允许用户访问攻击任何系统可能需要的大量信息。\n\
    \n此外，该语言语法简单，使其易于使用。专家们也倾向于使用它，因为人们不需要在语法上挣扎。这意味着学者可以轻松地使用 `python` 创建脚本。它的高性能也是它拥有海量用户的的另一个原因。\n\
    \n### Python 的应用\n1) 基于 GUI 的桌面应用程序\n    - 图像处理\n    - 游戏\n    - 图形设计应用\n    -\
    \ 科学和计算应用\n2) 操作系统\n3) Web 框架和 Web 应用程序\n4) 原型制作\n5) 企业和商业应用\n6) 语言开发\n\n`python\
    \ script` 是用于开发 `python` 程序的文本文件。一旦人们有了 `python script`，他们就可以执行程序而无需反复重写。因此，`python\
    \ script` 是开发应用程序必不可的一部分，因为它更有效。Python 优于其他脚本语言，是因为它有许多简单的库。Python 既可以用于复杂的脚本，也可以用于简单的脚本，用于开发几乎任何用途的程序。派遣\
    \ NASA 使用 `python` 为其应用程序编写脚本；这表明 `python` 可以完成各种任务。\n\n有几个原因导致大多数黑客倾向于使用 `python`\
    \ 而不是其他语言。\n\na) 语言简单——`python` 不仅容易学习，而且非常好用。这一优势使得在进行黑客攻击时它比其他语言更受青睐。学者以及执行各种变体任务的专家都可以\
    \ `Python`。\n\nb) 高性能——`python` 已证明在不同用途下运行有效。Python 已被用于涉及长短脚本的程序，并在两者中都有用。这些高性能标准使其成为黑客的首选语言。\n\
    \nc) 广泛的社区和支持——Python 拥有庞大的用户群。用户可以帮助在使用过程中可能遇到的任何问题。大型社区确保了问题可以尽快得到解决。由于这个原因，大多数黑客将倾向于将\
    \ `python` 作为他们的编程语言。\n\nd) 巨大的市场——Python 为用户提供了巨大的机会池。使用 `python` 运行的程序不断创造需求。高需求导致黑客拥有许多职业机会。\n\
    \ne) 第三方模块的存在：Python 软件包索引 (`PyPI`) 拥有许多第三方模块，帮助 Python 与大多数其他语言和平台交互。这意味着 `python`\
    \ 可以在很多平台上使用，也确保了许多用户可以使用其脚本。\n\n在编写 `python script` 时，有多种方法。Python 脚本必须先编写后运行，这样它们才能变成程序。编写\
    \ `python script` 的第一种方法是通过文本编辑器中输入脚本。编写脚本后，稍将在 `Terminal` 上运行脚本。第二种方法是通过直接在 `Python`\
    \ 的交互式解释器中输入脚本。使用解释器允许用户直接在 `Terminal` 中输入命令。Python 是一门基础且成熟的编程语言，包含了安全的代码行使用，维护易于处理，系统调试也非常容易。它在全球范围内赢得了重要性，因为计算机巨头\
    \ Google 已将其作为其官方编程语言之一。\n\n### 使用 Python 编写脚本\n考虑到其拥的语法，使用 Python 编写脚本非常容易。这允许用户编写他们能够理解并能够执行的脚本。当使用\
    \ `python` 编写脚本时，由于语言非常简单，人们可以验证他们正在编写的内容。然而，用户能够理解并专注于避免他们可能犯的错误是至关重要的。\n\n使用\
    \ `python` 编写脚本需要遵循一些步骤。\n\n"
