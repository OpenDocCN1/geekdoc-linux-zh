  trans: '


    - Lucid puppy – 当它最初创建时被称为 Lucid，后来当一个叫 Larry Short 的人向公众发布它时，添加了 puppy 一词。puppy
    一词反映了它美观且易于使用的特点。

    - Wary puppy – 这是由一个叫 Barry 的人发布的第二个版本的 puppy。这种类型主要是为要求较低的旧电脑开发的。因此，它在技术世界中并不是一种流行的发行版。它的主要目标是让旧桌面电脑变得功能齐全且实用。它使用了支持旧硬件的旧版本内核，而新版本的内核不再支持这些硬件。

    - Slacko puppy – 这是 puppy Linux 的第三版本，由一个叫 Mick Amadio 的人开发和维护。它因功能而闻名，关于 Slacko
    的新闻在社区中获得了积极反馈并广受欢迎。因此，它不断发布新版本，最新的版本是 Slacko 5.7，至今仍被使用。

    - Racy puppy - 这是 Barry Racy Puppy 发布的第四版本，他就是创建 warry puppy 的同一个人。它类似于 warry
    的特征；唯一的区别是这个版本针对新版本的桌面。它使用新版本的内核，比 warry puppy 更受欢迎。

    - Precise Puppy – 这是 Barry 再次发布的第五个版本。它是基于 Ubuntu 的兼容性构建的，没有那些需要更先进技术的复杂花哨功能，这与
    Barry 的主要目标相反。在 Barry 发布的所有版本中，这一个最受欢迎，并且至今仍在使用中。


    ## Linux 中的目录


    你在 Linux 中看到的任何内容都有一个文件系统。每个文件系统由不同的目录组成，我们通常称为文件夹（其根目录为 `/`，即基础根目录）。目录可能位于操作系统上的不同分区或另一个分区上，但仍然基于文件系统。它们遵循特定的文件系统层次结构，但有时可能会偏离该顺序。以下是
    Linux 中常用的目录列表。


    - `/` – 这是整个文件系统层次结构的主根。

    - `/bin` – 帮助存储用户的命令。

    - `/boot/` – 包含系统启动文件。

    - `/dev/` – 包含设备文件。

    - `/etc/` – 这里是目录和配置文件的位置。

    - `/home/` – 目录的默认位置。

    - `/initrd/` – 辅助加载设备模块。

    - `/lib/` 和 `/usr/lib/` – 此目录存放程序使用的库文件。

    - `/lost + found/` – 存放没有名称的文件，也称为孤立文件。

    - `/opt/` – 假设你有第三方软件，此目录有助于该软件的安装和卸载。

    - `/proc/` – 虚拟目录，存放特定程序所需的系统数据。

    - `/sbin/` – 此目录帮助存储用户命令。

    - `/tmp/` – 目录保留临时系统目录。

    - `/usr/` – 包含与用户相关的文件系统。

    - `/var/` – 包含经常变化的文件，例如打印机文件。


    ## 备份 Linux 文件系统


    这些文件系统的备份主要通过 `tar`、`dump` 和 `spio` 等备份命令完成。作为一名黑客，了解备份是如何发生的很好，因为很多时候你将需要进行备份。列出的命令可能不足以完成整个备份过程，但让我们看看备份时需要执行的各种方法。


    1. 使用 `tar` 命令备份 – （磁带存档）可以对单个文件进行备份。使用此命令时，你无法备份特殊字符，它只对挂载的文件有效。

    2. 使用 `cpio` 命令备份 – 这种类型可以用于单个文件和多个文件。与 `tar` 不同，这种类型的命令会备份特殊字符和块文件。此外，要使用此命令进行备份，你需要文件列表。


    用户可以使用 `dump` 工具进行备份，它可以帮助你完成完整的备份和恢复过程。备份可以通过多种方式完成，例如用户使用远程系统、磁带或恢复选择或全部文件。使用
    Linux 操作系统备份或恢复你正在操作的内容很容易的；你只需要掌握一些可以帮助你恢复选项的命令或程序。


    ### 桌面环境类型


    ### GNOME – 代表 GNU 网络对象模型环境（GNU Network Object Model Environment）。它是一个用于桌面应用程序的图形用户界面，旨在增强用户的可用性。你不需要学习编程即可使用此应用程序。它是一个用户友好应用程序，帮助新手熟悉
    Linux 操作系统。桌面版本拥有小部件库，帮助黑客或程序员开发与 GNOME 环境集成的应用。它有不同的形式，如 Fedora，并且开始上手它非常容易，因为你可以同时执行不同的任务。


    ### KDE – 代表 K 桌面环境。这是一个流行的 Linux 桌面环境，但与 GNOME 相比更为复杂。这种类型让用户感到更方便，因为它使用了窗口化。它给了用户选择自定义桌面环境的选择，因为它带有不同的发行版功能，如
    Konqueror 浏览器和 Koffice 软件。该浏览器的工作方式像 Windows，可以帮你浏览本地文件，或者它本身就是一个浏览器。如果你正在寻找具有许多配置选项的桌面选项，那么这个最适合你的需求。它基于
    QT 工具包，这意味着它与其他桌面使用了不同的程序。


    ### Xfce – 这种 Linux 环境具有与 GNOME 类似的功能特征。如果你想要更传统且轻量级的环境，这个可能更理想。它使用 GTK 工具包，安装了文本编辑器和图像查看器等程序。


    ### Cinnamon – 创建它的开发者为 Linux Mint 发行版开发的。这是一种基于 GNOME 3 的图形界面的现代桌面环境。这种类型的环境也可以作为首选桌面环境用于
    Ubuntu。


    ### MATE – 这种类型由开源软件组成，免费使用并在 Linux 操作系统上运行。它的名字源于一种南美植物马。该社区的许多人支持 Mate Advanced
    Traditional Environment，使其成为 Linux 的免费桌面环境。这种桌面环境的优点是兼容旧、新版本的桌面。


    ### Unity – 它由 Ubuntu 发行版背后的公司开发。该桌面环境的主要目标是改进在笔记本电脑上运行的屏幕空间。它的首次发布于 2010 年，并随着时间不断不断改进。它与其他桌面环境不同，因为它使用了不同的用户界面。左侧是启动器，上方是
    dash（控制面板）图标。对于新用户来说，很难注意到配置设置中哪里可以禁用或启用此通知。用户需要在网络浏览器中搜索以查看如何操作。这种桌面环境的一个缺点是它提供的用于自定义的默认工具很少。


    # 文本处理


    文本处理是修改文本以适应我们需求的过程。对文档可以进行许多格式化操作。它们包括但不限于：将单词的每个字母更改为大写、可能文档中有一个拼写错误的单词，我们想要更改整个文档中该拼写错误单词的所有实例。


    '
- fmt: '

    When we manually edit the text in a document, it can be very tiresome; moreover,
    we cannot eliminate the possibilities of human error. Thus it is very vital to
    find a way to find a command that can be used to modify words in a text file of
    any size in a document with ease. The Linux command line comes in hand, as it
    allows someone to type a single command line and edit the whole document in less
    than a document.


    Each and every command found in the Linux operating system can perform only one
    job, except that it will only do that one job and no other. The Linux command-line
    tools can be linked together like bricks the way we want and use the command lines
    to our advantage.


    ## How Linux is Useful in Text Manipulation


    The process of connecting the command lines is known as piping. The symbol for
    a pipe is `I` (always remember it is not a lower-case L or any other character,
    but only `I`).


    Another feature that Linux offers is the use of the right-angle bracket `>`. By
    default, the Linux operating system displays commands on the screen when we input
    the command in the terminal. However, when we want to create files, we need to
    redirect the output of the command using the `>` then followed by the name of
    the file. Please note if the file is written already existed, it will be overwritten;
    hence, it becomes important to append the file if you don’t want it to be overwritten.
    In order to append a file, you need to use the `>>` to APPEND (added) to the file.
    In instances when you append a file, the results will be saved at the end of the
