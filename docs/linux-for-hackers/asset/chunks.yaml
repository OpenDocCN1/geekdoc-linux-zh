    \ the kernel-mode as oppose to the user mode. So, any applications running in\
    \ the system communicates with `Kernel` using what we call “system call”. The\
    \ system enables the user to have a smooth interaction utilizing an interface\
    \ to reach the `Kernel`. Did you know that every function that possibly interacts\
    \ with the system automatically translates to a system call? Here is an example\n\
