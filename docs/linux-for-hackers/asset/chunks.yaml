  trans: '

    黑客有许多方法可以扫描网站或程序以寻找漏洞。如果一种方法不起作用，黑客可以尝试其他方法。这些方法包括使用 `VEGA`、使用 `ZapProxy`，黑客还可以使用数据库工具来评估漏洞。这些工具包括
    `sqlmap`、`SQL ninja` 等。黑客还可以使用 CMS 扫描工具，包括 `WPScan`、`Joomscan` 以及其他工具。另一组用于寻找漏洞的工具是
    SSL 扫描工具和 `W3af`。黑客可以根据自己对每种工具的熟练程度来使用其中任何一种工具。一个人掌握的扫描工具越多越好，因为他们有许多选择可以帮助发现漏洞。因此，学习如何使用多种扫描方法至关重要，因为它们可以帮助他们快速扫描问题，即使在受保护良好的情况下也能识别漏洞。


    ## 2. 利用漏洞帮助你获取访问权限

    在这一步中，黑客已经发现了网站的漏洞。他们需要利用该漏洞来获取网站及其内容。


    ### 利用漏洞的方法

    利用漏洞是一个涉及使用工具来减慢甚至破坏网站运行方式的过程。黑客可以通过以下方式利用系统中的弱点来帮助获取访问权限。漏洞可以用于引入恶意代码、数据、脚本等材料，这些材料会影响网站及其功能。通过引入这些材料，网站的运行速度可能比平时慢，拒绝用户访问，甚至在网站上引入流量。通过这种方式，黑客将有时间收集他们想要的数据并在离开时掩盖自己的足迹。黑客将利用管理员解决问题的时间完成他们的任务。


    ## 3. 维持对网站的访问权限

    维持访问权限是攻击中一个非常重要的阶段。攻击的大部分功能取决于黑客是否能够维持访问权限。能够维持访问将帮助黑客成功完成任务。黑客必须保持对系统的访问，以便他们有足够的时间完成活动并离开。维持访问可以通过多种方式实现。其中一种方法是确保黑客尽可能长时间不被发现。因此，在这种情况下，黑客会确保日志无法向管理员提供有关他们存在的信息。维持访问权限可能涉及黑客在完成任务期间尽可能地拒绝管理员访问系统。通过执行拒绝服务
    (`DOS`) 攻击或拒绝服务，黑客可以确保系统的用户无法访问它。这将确保管理员也无法访问系统，或者只能执行少数无法驱逐黑客的活动。然而，大多数黑客更倾向于盗取其他用户的用户名和密码。通过保留这些登录详情，将有助于黑客在日后重新访问系统。他们可以在不被发现的情况下尽可能多次地访问系统，因为他们看起来像一个普通用户。无论黑客选择哪种方式，他们都应该能够根据需要维持对账户或程序的访问权限，以确保他们已经能够完成任务。


    ## 4. 完成后掩盖足迹

    无论是合法的还是不合法的黑客都涉及在未获得用户或管理员许可的情况下访问程序或系统。因此，这意味着在某种程度上，黑客是一个入侵者。因此，在攻击之后（特别是访问了任何关键信息），程序所有者将寻找黑客。在某些情况下，可以对黑客采取法律行动。因此，不被发现至关重要。在攻击过程中，黑客会留下痕迹和脚印。可以通过追踪这些脚印来确定黑客是谁。因此，掩盖攻击足迹并确保无法确定黑客是谁至关重要。掩盖足迹有多种方法。下面解释了这些方法以及人们如何在攻击后成功掩盖足迹。


    禁用审计是可以使用用来掩盖足迹的方法之一。一旦黑客获得了系统访问权限并拥有管理员权限，他们就可以简单地关闭审计。审计允许系统收集系统内正在发生的信息。禁用验证将允许黑客在不被记录的情况下开展业务。一旦他们完成工作，黑客将重新启用验证。启用验证只需要黑客运行
    `auditpol.exe` 程序。在没有审计记录的情况下，管理员无法得知特定时间内系统内发生了什么。


    清除日志是攻击期间掩盖足迹的另一种方法。正如大家可能已经的，系统、程序或应用程序会保存活动记录。这些活动记录可以被识别为日志。因此，当黑客进入订单时，他们在订单中的活动记录会被记录下来。管理员可以通过读取日志来了解系统中发生了什么。在黑客完成后，他们可以清除日志，这样就不会有攻击期间的活动记录。当管理员查看系统时，他们将无法高效地确定做了什么。这意味着他们也无法确定是谁攻击了他们的系统。可以用于清除日志的一些实用程序包括
    `clear logs.exe` 和 `meterpreter shell`。


    修改日志和注册表文件是黑客更改系统日志和记录的地方。一旦系统记录了黑客的活动，他们将简单地编辑日志。黑客会将日志替换为管理员预计正在发生的活动。这种方法相当安全，因为它确保管理员甚至不会怀疑系统被入侵过。管理员会简单地认为系统一直正常运行，即使系统中有一个黑客。


    删除所有创建的文件和文件夹是需要采取的一个基本步骤之一。即使已经采取了其他掩盖足迹的措施，这也被视为一种补充行动。在攻击过程中，黑客可能需要上传文件、创建文件夹并创建文件，以帮助访问系统或执行他们的活动。大多数管理员都了解系统中的内容，因此他们能够尽可能地识别系统中的任何外部文件。出于如此，删除他们上传的文件或清除新文件夹非常重要。如果存在外来材料，但使用了其他方法掩盖足迹，管理员仍然能够判断出发生了攻击。因此，清除他们引入系统的中的材料至关重要。


    ## 渗透测试

    黑客在攻击技术上正变得越来越聪明。组织必须尝试比这些黑客更聪明，以保护他们的私人信息（如贸易机密）免受任何未经授权的人员侵害。高级渗透测试是一种风险管理策略，用于识别网络安全和系统安全中的潜在漏洞。在识别系统中所有潜在风险后，会立即采取行动尝试控制该风险。渗透测试可以被描述为网络安全策略，因为它揭示了系统内的任何安全漏洞。


    ### 高级渗透如何工作


