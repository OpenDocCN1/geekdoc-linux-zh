  trans: '


    - **黑客行动主义 (Hacktivist)** – 这类人会攻击网站并在被黑的网站上留言。他们留下的信息可能涉及政治、宗教、社会、全球或政府相关问题。大多数情况下，这些都是负面信息。

    - **黑帽 (Black hat)** – 他的主要目标是访问计算机获取数据以自利。他意图侵犯版权或盗取资金。

    - **伦理黑客 (Ethical hacker)** – 也称为白帽。他们通过攻击计算机系统来识别漏洞并进行修复。他们可以测试系统以查看其是否容易受到黑客攻击。

    - **灰帽黑客 (Grey hat)** – 此人在未经授权的情况下攻击计算机系统。他的主要目标是识别问题并告知系统所有者。


    因此，伦理破解是最受推荐的，因为你是通过合法访问进入计算机的。作为伦理黑客，请确保你获得了系统所有者的访问许可。你有责任保护客户的数据不被用户攻击，并应通知相关人员。此人可以保护数据，或者如果你是专家，则可以亲自执行保护工作。


    ## 破解技术类型及预防措施


    以下是黑客在攻击时使用的一些黑客方法：


    ### 被动攻击

    这种类型是指黑客通过观察现有的漏洞尝试攻击计算机。这种类型攻击的主要任务是获取有关特定公司的信息，而不一定更改任何信息。


    攻击可以是主动侦察，也可以是被动侦察。在主动侦察中，攻击者可能尝试通过端口扫描进行访问；而在被动侦察中，攻击者会监控正在进行的活动。


    ### 被动攻击方法


    - **翻垃圾 (Dumpster diving)** – 入侵者从垃圾桶中获取一些信息。这些是保存在垃圾桶里的密码。他们使用这些密码访问锁定的信息并掩盖系统入口。这提醒你不要在计算机中保存密码，或者在机器、系统或网络发生任何情况时，不要忘记永久删除它们。

    - **无线网钓鱼 (War diving)** - 这种方法是入侵者通过扫描处理获取易受攻击的 WIFI 网络。主要通过移动车辆上的便携天线完成。许多人喜欢在公共场所访问免费
    WIFI；这为入侵者提供了轻松访问这些开放网络的机会。这种破解方法的主要目标是获取互联网连接。

    - **水坑攻击 (Waterhole attacks)** – 这个名字的灵感源于那些喜欢留在水池附近攻击猎物的掠食者。现在，入侵者留在目标网站附近等待用户访问时进行狩猎，并尝试使用恶意软件进行攻击。


    他们通过发送受影响的 HTML 代码来攻击网站，当用户点击网站时，它会重定向到其他网站。使用户无法访问他们寻找的特定信息。之后，一旦目标用户访问链接，受损网站就会感染他们。


    ### 如何防御水坑攻击


    - **双重身份验证 (Two-factor authentication)** – 你会发现他们窃取密码和用户名。为了防止被攻击，请使用双重身份验证，这让他们难以猜出代码或使用其他此类方法。

    - **禁用易受水坑攻击的工具** – 某些软件容易受到影响或遭受攻击，如果可能，请将其删除。其中一些软件是 Adobe 的 Flash。

    - **安全审计 (Security audit)** – 根据你所在的国家，你可以决定在知名的 IT 服务公司进行安全审计。

    - **更新软件** – 攻击者利用系统未定期更新软件来实施攻击。安全是每个企业数据库的关键，因此请保持更新计算机上的某些软件，否则你将成为黑客的受害者。

    - **监控网络 (Monitor network)** – 进行定期的更新监控，这有助于你跟踪访问网站的人员。`SSL` 流量检查器可以帮助你做到。


    **键盘记录器 (Keylogger)** – 也称为监控软件。它就像摄像头一样，监控所有发生的活动记录，登录、下载、聊天等。他们通过记录你的键盘输入来实现，让你不会怀疑有任何事情发生。他们可以访问敏感信息，如信用卡号、密码和账户信息等。


    键盘记录可以以积极的方式进行，例如父母监控儿童访问可能导致网络犯罪和欺诈的危险网站。有时，如果你有键盘记录器，可能很难检测到。你可以注意你的键盘是否不断将你重定向到某个网站、性能是否比平时慢，或者屏幕是否显示错误信息。


    ### 如何防止键盘记录器


    - **密码管理器 (Password manager)** – 大多数密码管理器使用自动填充功能来帮助你记住密码。但你知道这是危险的吗？是的，黑客可以保存密码。虽然某些键盘记录器会在键盘上打字时保存密码，但检查你的计算机/系统是否有此类可疑的键盘记录器是好的。作为公司，可以使用键盘记录器来检查异常活动。

    - **保持谨慎 (Be cautions)** – 这种情况几乎发生在每个人身上，即你会收到来自陌生人的链接。其中一些链接是被感染的，并发送来提示你点击。点击这些链接就是破解的开始。你会发现，一旦点击了这些链接，你的计算机就会开始运行异常或重定向到特定网站。

    - **键盘布局 (Keyboard layout)** – 也许可以尝试更改计算机的设计。键盘记录器适用于 QWERTY 布局，尝试将其更改为 `DVORAK`。这是因为在该布局下转换捕获的内容变得困难。

    - **安全工具 (Security tools)** – 为你的计算机增加额外的安全措施，你需要安装额外的安全工具。某些如 `Ghost press` 的工具是反键盘记录器，可以阻止其他程序在不知情的情况下在后台运行。

    - **更改密码 (Change passwords)** – 如果你怀疑有人在登录你的邮件，尝试设置一个复杂但易记的密码。黑客可能会窃取你的密码，但不一定会使用。经常更改密码，以防将来他在意之外地尝试破解系统。


    ### Cookie 窃取 (Cookie theft)

    Cookie 数据在传输过程中是可用的。它总是以网站标头的形式发送，这使得它们容易受到攻击者的攻击。在公共场所，由于容易访问，这种风险更大。


    ### Cookie 操纵 (Cookie Manipulation)


    - 你知道 Cookie 可以被操纵吗？是的，Cookie 会被操纵。大多数用户喜欢使用 Cookie 保存数据，但应仅使用 Cookie 保存非敏感数据。原因是攻击者绝对会使用你的
    Cookie 来获取某些敏感信息。

    - 此的替代方案是将你的数据保存在服务器端的会话（session）中。会话更像是一个数据库文件，记录你的个人信息。它帮助用户避免数据被操纵的危险。

    - 为了帮助自己防止操纵，请为 Cookie 设置过期日期。这样，一段时间后信息将不再存在，从而防止被利用。访问非 `SSL` 网站会面临数据暴露给恶意网站的风险。`SSL`
    加密网站是更安全的访问地，因为它们具有安全的 Cookie，可以防止受损坏。

    - 另一种防止 Cookie 操纵的方法是使用合适的算法。算法有助于数值的加密和解密。这非常重要，因为假设 Cookie 是明文的且无法运行，那么它们永远不会受到攻击，因为已有的算法很难被破解。

    - 此外，人们决定对 Cookie 进行签名，作为一种保护防御工具。


