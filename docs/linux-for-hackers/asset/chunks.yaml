    \ more interesting is that before any virus attacks or authorized logins, one\
    \ has to insert the password.\n\n2.  Reliable – It has excellent stability that\
    \ enables the users to use it efficiently - no need of keeping rebooting your\
    \ computer because of some errors.\n\n3.  Free to use – It is possible to go to\
    \ your browser and download the operating system without asked to insert the activation\
    \ key.\n\n4.  Multitask – You are able to perform different tasks using the system\
    \ without a lot of difficulties like we find in the other operating systems. It\
    \ does not decrease its speed or efficiency even when you need to take on a lot\
    \ of tasks. It is great since it provides a hacker with the opportunity to monitor\
    \ different things all at once.\n\n5.  Different distributions – With the Linux\
    \ system it is possible to do many distributions, these distributions are called\
    \ bistros.\n\n6.  Open source - Something good about Linux is that its sources\
    \ are available for everyone. Depending on the exact thing that you want to do,\
    \ then you are free to execute, add or modify the codes; which is a rare thing\
    \ found on the other operating systems.\n\n7.  Updates – When using Linux, you\
    \ will notice so many software updates prompts. The software updates are easy\
    \ to updates which takes a few seconds for them to updates.\n\nYou’ll notice that\
    \ it has unique advantages when using it as opposed to another operating system.\
    \ All these features combined give you the need to use this OS’s when doing the\
    \ hacking. Ubuntu is the straightest forward Linux language to use. This is because\
    \ you will learn how to use it once you understand how the commands get executed.\n\
    \nChapter 2:\n\n# Hacking and the Skills Hackers Need\n\nWhat is Hacking?\n\n\
    Before going ahead with some of the techniques that we can use with hacking, first,\
    \ you need to understand what hacking is in detail. When we talk about hacking\
    \ we are looking at a process that will actively search for vulnerabilities in\
    \ the system. Once you find these vulnerabilities, then you use the weakness to\
    \ help you gain access illegally. This is done by cracking the operating system\
    \ algorithm to be able to access without a password.\n\nWhen computers interact\
    \ with each other externally, they run the risk of getting hacked. So, who is\
    \ a hacker? This is the person behind the hacking. He tries to access the computer\
    \ and tries to get the weakness of a computer. This means hackers are very skillful\
    \ with computers for them to be able to know how to alter with data manipulation\
    \ – their classification is the following categories.\n\n Phreaker – Tries to\
    \ identify a weakness in a telephone.\n\n Script kiddies – this type of hacker\
    \ is not skilled. He uses tools online to enable him to do the hacking."
