    # 语法以及脚本开发中使用的符号至关重要。如果未能使用正确的符号和语法，将导致程序结果不符合预期。因此，确保语法和符号正确至关重要。例如，如果忘记在想要获取的变量之前放置
    `$` 符号，程序将给出不符合预期的结果。因此，在编写脚本时应格外小心，否则错误会导致程序无法运行。避免脚本中的错误涉及对已完成的脚本进行持续测试，以确保它们运行正常。对脚本进行校对也至关重要，这可以确保脚本正确、语法正确，甚至拼写也是正确的。脚本中的任何错误都会反映在程序中。例如，


    ```bash

    #!/bin/bash


    echo “welcome.”

    ```


    而不是


    ```bash

    #!/bin/bash


    echo “welcome.”

    ```


    这个错误将导致程序在启动时显示错误信息。程序将不会显示“welcome”，而是显示“welcome.”，因此在完成脚本后，校对脚本是一个至关重要的步骤，持续运行将有助于识别此类错误。


    ## 自动任务


    自动任务是指程序在没有任何人工干预的情况下自行运行的任务。用户并不一定需要输入任何命令来运行它们。例如，当打开程序时，用户必须启动它。随后的几个步骤和阶段是自动的。在大多数程序中，一旦运行，它们会首先显示“welcome.”。随后是一系列操作，例如收集信息，然后要求用户输入密码。所有这些动作都按照指定的时间间隔运行。在从欢迎消息到请求密码的所有这些动作运行期间，用户没有以任何方式进行干预。用户可能也没有向程序输入任何命令。因此，这些动作或任务是独立运行的。在应用程序运行后执行这些任务使得它们成为自动任务。一个动作会触发另一个或更多动作，以帮助减少用户必须执行的活动数量。自动任务也被称为调度任务，因为它们被设置为在其他事情发生后立即发生。在某种意义上，它们是由其他任务触发的。


    ## 在 Linux 上调度任务


    在 Linux 上调度任务就像为动作或任务准备并设置一个序列，以便它们在特定动作发生时自动启动。在 Linux 上，必须使用 `cron` 守护进程，它可以帮助在特定时间运行任务。当使用正确的语法将任务添加到
    `crontab` 文件时，它们将按照之前的计划自动运行。在许多情况下，调度用于自动化备份、系统维护，甚至运行重复性任务。有时任务太多，用户无法单凭之力完成，因此它们将被自动化，以确保它们自行运行。


    ## 调度/自动化任务


    Linux 上的任务自动化遵循几个步骤来完成。步骤的执行方式如下：


    ### 1. 打开 Crontab


    在这一步中，用户将在其计算机上打开终端。当终端打开后，用户将输入 `crontab -e`。此命令打开用户账户的 crontab 文件。在该文件中，命令根据用户的权限运行。如果想让命令在系统许可下运行，将使用
    `sudo crontab -e` 命令。此命令帮助用户访问 root 账户的 crontab 文件。系统可能会要求选择一个编辑器，在大多数情况下，选择 `nano`。在很多情况下选择
    `nano` 是因为它最易于使用。只需输入编辑器的数字并按回车即可进行选择。


    ### 2. 添加新任务


    打开 crontab 后，用户将使用翻页键（page down）移动到文件末尾。从那里，他们可以调度自己的任务。在调度或自动化任务时，需要遵循特定的格式。设置任务开始的时间，使用以下格式：`minute
    (0-59) hour (0-23) day (1-31) month (1-12) weekday (0-6) command`。在此命令中，必须注意在分钟和星期中，第一个是
    0，这意味着每周的第一天将被赋予 0，30 分钟将是 29，依此类推。星号 `*` 用于表示重复，可以代表任何值。例如，如果你想让命令在每天凌晨 12:30
    运行，命令如下：


    ```

    29 0 * * * /usr/bin/ example

    ```


    使用用逗号分隔的值来指定多次执行。例如，如下的一行：


    ```

    0,14,29,44 * * * * /usr/bin/ example2

    ```


    将在每小时、每天的第 15 分钟处运行 `/usr/bin/example2`。确保将每个新任务都添加到新的一行中。


    ### 3. 保存文件


    一旦调度了任务，用户就可以按照他们的意保存它们。保存过程通过使用 `Ctrl - O` 然后按回车来实现。保存文件后，只需使用快捷键 `Ctrl - X`
    即可退出。


    # 第 6 章：Web 攻击过程


    ## Web 攻击


    Web 攻击是全球范围内的一种普遍做法，主要目标是获取对网站数据的访问权限。虽然不可能攻击遇到的每一个网站，但人们可以攻击某些网站。攻击网站的困难程度取决于该网站的保护程度。因此，你会发现虽然有些网站很容易被攻击，但有些网站由于其安全级别而无法被攻击。网站上漏洞的存在便利了
    Web 攻击。可以使用许多方法来攻击网站。某些黑客可能会使用跨站脚本（XSS）、SQL 注入等其他方法来攻击网站。以下是人们在攻击网站时可以遵循的步骤。


    1.  分析网站的弱点或漏洞。网站在基础设施甚至在编程语言上都可能存在漏洞。黑客应该首先通过识别这些针对系统的弱点来开始网站 攻击，因为这些弱点将是进入网站的途径。


    ### 漏洞的类型


    网站中存在许多种类型的漏洞。每种漏洞都可以以其特定的方式被利用。网站中的漏洞越多，访问和控制网站就越容易。网站的一些潜在弱点如下文所示。


    - **SQL 注入**：这可能是一段代码，用于帮助黑客上传、编辑、修改和篡改网站上的信息。一旦 `SQL` 成功进入网站，它将不再按其预期工作。这种功能上的更改允许黑客访问他们想要的数据、修改它或完成任何他们需要的活动。


    - **跨站脚本 (XSS)**：在这一类漏洞中，攻击者将通过任何发现的弱点向网站中注入恶意代码。脚本将开始窃取每个访问者的 Cookie。每访问一次站点，脚本就会被激活并窃取
    Cookie。代码会将 Cookie 发送给攻击者。通过 Cookie，攻击者可以访问访客的数据，并可以在他们需要时用来访问网站。


    - **失效的身份验证和会话管理**：在这里，攻击者将重点关注攻击活跃会话。一旦他们攻击了活跃会话，他们将使用用户的凭据访问网站。访问账户意味着攻击者可以收集任何所需的数据和信息。


    网站中还有其他可以被利用的漏洞类型。漏洞越多，攻击就越容易，威胁也越高。这种威胁不仅针对网站所有者，也针对网站的用户，因为他们可能会迅速丢失数据或同样受到攻击。


    ### 发现漏洞的方法


