    # Introduction


    Linux operating system comes with over 300 pre-installed tools which you will
    probably need in your hacking process, while the other Linux tools can be downloaded
    easily from the internet. With Linux, the hacking process becomes easy when you
    know how to use the tools and how to manipulate the tools to your specifications.


    # What you need to know before you start the hacking procedure


    Hacking is an art and hence needs years of practice in order to master it in full
    and also how to handle various attacks on systems. Having no idea about hacking
    is okay while you start practicing the hacking process. Be warned a newbie with
    general knowledge about computers and no knowledge about programming can be very
    risky. Hence In order to be an expert in hacking, it will require you to make
    a lot of effort in practice.


    # What you require in order to start with Linux


    For beginners without any knowledge, you need first to visit the kali Linux official
    page then read about the basics of the Linux OS. Then visit their download page
    and download the Kali Linux iOS file. Before beginning, you will need to know
    how to install the latest Kali Linux OS. The procedure below will show how to
    install it.


    ## Installation of Kali Linux


    There are two ways in which you can install the kali such as, installation on
    the hard disk using USB, and installation using VMware. Our focus will be On the
    later:


    ### Installation of Kali Linux in VMware


    **Step one**

    First and foremost, you should identify your computer capability, whether it is
    the 64 bit or the 32 bit. If your computer is the 64-bit, then you will need the
    64-bit version. If you are not sure of the version of your computer or it is the
    32-bit version, then you will need the 32-bit version.


    **Step 2**

    You then download Linux via the browsers download manager by clicking the ISO
    or by clicking the torrent. Torrent is highly recommended as it is faster. When
    the download is complete, create a virtual machine.


    **Step 3**

    Select an installer disk image file (`ISO`) on the window that appears, then select
    the Kali Linux ISO file on the browse section. Once you select, then click Next.


    **Step 4**

    On the toolbox that appears, select a title for your virtual machine. You can
    have a name such as `Virtual kali`. You should also select a location for it.
    It is recommended you name your folder `Virtual machines` in my documents then
    click Next.


    **Step 5**

    The next step is to set the maximum size of your kali, which should not be less
    than 20 GB. However, you are recommended to use 30 GB as kali tends to expand
    over time. After selecting the size of your kali, on the next option change to
    store virtual disk as a single file, then click Next.


    **Step 6**

    Customize some hardware settings on the window that appears on the Customize Hardware
    Option Button.


    **Step 7**

    Now, a window for hardware settings will be presented for you. Then select `Memory`
    in the left window pane, then on the right window and slide the slider to at least
    512 MB. Be aware that you should assign a virtual machine a maximum of half the
    Ram installed. For example, if your computer has a ram of 8 GB, then a maximum
    of 4 GB is what should be memory given to the slider. In the left plane, highlight
    processors on the left plane. The option will heavily depend on your computer''s
    processor. If your computer has multiple processors, then you should select multiple
    processors for efficient performance. On the left, click the `New Adaptor`, then
    on the right side move the dot to the bridged (top) option and click the `Adapters`
    button. A small window will automatically pop up where you will uncheck all the
    options in the exception of the one next to the network adaptor then click `OK`.
    At the bottom of the hardware, close then Click `Finish` in the wizard.


    **Step 8**

    The new virtual machine will have been added to the VM library once you clicked
    the finish button. Start Linux in order to install it. Highlight, the name of
    the created virtual machine in the right pane in order to finish the installation.


    **Step 9**

    On the boot menu that appears, use the down arrow keys for scrolling down to `Graphical
    install` and hit enter.


    **Step 10**

    Select your preferred language; by using either the mouse or the arrow keys to
    scroll then hit Enter.


    **Step 11**

    Select your location on the next screen that appears and hit continue.


    **Step 12**

    You will be asked your keymap, for example, you can choose the Arabic keyboard.
    Note this will depend on the language that you understand.


    **Step 14**

    Kali will delete the hardware on your computer, then click continue but do not
    configure the network yet.


    **Step 15**

    You will set the computer hostname which will act as your computer name. Click
    continue.


    **Step 16**

    On the next window set your preferred root password on the main account. Then
    confirm the inputted password and click continue.


    **Step 17**

    Linux will now determine the disk partitions then you will be presented with a
    dialogue box, select the first option and continue and make sure that all files
    to be on one file and hit continue. Then confirm the desired changes to be made
    by selecting `Finish partitioning` and make changes to the disk and confirm the
    changes. The OS will now install and can take a duration of up to 30 minutes.


    **Step 18**

    Then select no when asked about the network mirror.


    **Step 19**

    The installer will ask whether to install the `GRUG` and accept it. The installation
    process is completed by now, and a success notification will be displayed.

    The OS will restart, and then you can log in using the password you heard the
    set.


    ## Storage management


    Storage management refers to the process of managing computer storage devices.
    Linux has many tools that can be used to manage storage drives and hardware devices.
    Linux can perform the following in regards to storage management:


    ### Memory management

    The kernel allows processes to access the memory when they need them since it
    has access to the system memory.


    ### Device management

    The kernels allow processes to access peripheral devices through device drivers.


    ### Task management

    The kernel allows application execution. It performs context switching between
    software and hardware.


    ### Methods of storage management

    - Provision of options to failback of the LUN to the required paths

    - Monitoring and notifying if there is any change in the path

    - Provision of options to the customization of names of the device-mapper to multipath
    devices

    - Provision of policy-based paths and grouping for a user to the customization
    of I/O through defined paths

    - Facilitation of balancing of the loads among many paths.


    ## Block storage


    Block storage in Linux kernel is simply a synonym for the word block device. A
    block device is any hardware device that stores data same as flash memory, solid-state
    drive(`SSD`) and hard disk drive (`HDD`). Basically, a block device is commonly
    known as disk storage in the computer. Once it has been set the block device acts
    as an addition of the current file system on the device hence, you can read or
    even write information on the drive.


    ### How Linux manages storage devices


    Linux operating system represents almost everything by a file that encompasses
    the storage devices present on the `/dev` category. Files in charge of the storage
    devices always named starting with `sd` or `HD` then followed by a letter. For
    instance, the first drive in a server can be represented by `/dev/sda`. Similarly,
    partitioned files within these drives have files within the `/dev` category. The
    partitions are usually appended by adding a number after the drive name. For instance,
    the second partition from the previous example would be `/dev/sda2`.

