    ## 回环接口 (Loopback)

    回环接口 (`Lo`) 始终有一个 `127.0.0.0` 的 IP 地址，代表主机。例如，你想访问运行在当前同一台服务器上的网页，这时你需要在浏览器中输入
    `HTTP:127.0.0.1`。


    ## 以太网 (Ethernet)

    以太网 0 (`eth0`) 接口基本上是局域网连接。在虚拟机上运行 Linux 时，你仍然需要连接到主机的物理网络接口。通常，你需要检查以太网是否具有 IP
    地址，以及 `eth0` 是否处于 `UP`（开启）状态。


    ### MAC 地址

    介质访问控制 (`MAC`) 是分配给数据链路层第 2 层网络的标识符。网络接口必须有一个 `MAC` 地址，这通常被称为硬件地址。`MAC` 地址在制造时总是会被分配给任何适配器；如果是虚拟适配器，则该地址在创建时分配给适配器，并始终表现为六组、每组两个十六进制数字。上述解释的以太网接口的
    `MAC` 地址被称为以太网地址（ether address）或链路地址（link address）。


    ### IP 地址划分

    所有设备的 IP 地址在特定网络上都是唯一的；因此，每个设备至少有一个地址。`IP` 地址通常位于 `1.1.1.1` 到 `255.255.255` 之间。


    #### 示例 1

    要查看所使用的 IP 地址，你将输入 IP 地址命令，如下所示：


    ```

    <LOOPBACK,UP,LOWER_UP>  6536 qdisc noqueue state UKNOWN group default

    Lin/loopback 00.00.00.00.00.00 brd 00.00.00.00.00.00

    inet 127.0.0.1/8 scope host Io

    valid_Ift forever preferred_If forever

    inte 6::1/128 scope host

    valid_Ift forever preffered_Ift forever

    ```


    每个熟悉 Linux 的人都听说过一种 Linux 网络工具，即 `ping`。它起初是一个缩写词，现在已成为一个正式单词，并且是测试网络连通性最常用的工具。


    ### Ping 如何工作

    `ping` 通过向网络发送互联网控制消息协议 (`ICMP`) 包开始；然后它会在有响应时通知你。如果主机能够连接到网络，它将发送 `ICMP` 成功响应。然而，如果用户无法连接到网络，它将发送
    ping 测试失败。


    Linux 在故障排除过程中使用的另一个工具是 `traceroute`。`traceroute` 通常探测本地系统与目标之间的网络；因此，它会收集有关路径上所有
    `IP` 路由器的信息。当路径出现问题时，`traceroute` 非常有用，例如网络问题导致中间节点响应缓慢，此时你可能想知道是哪个节点响应缓慢。


    ## 动态主机配置协议 (DHCP)

    如果你的网络中有数十、几千个甚至无限数量的计算机会怎样？尝试分配并跟踪每台机器拥有哪个 IP 地址将非常耗时。这就是 `DHCP` 发挥用场的时候了。它会在主机或设备实际连接到特定网络时获取其
    IP 地址。然而，`DHCP` 通常用于不会因服务器系统动态 IP 地址变化产生副作用的设备。管理员可以创建 `DHCP` 预留或手动配置静态 IP 地址，以确保连接到网络的每个网络适配器在连接时始终获得相同的
    IP 地址。


    ### DNS (动态域名系统)

    互连的计算机大多数使用 IP 地址相互连接。要记住互联网上所有需要连接的内容将是非常困难的。想象你想连接到 `google.com` 甚至 `facebook.com`，那么每次你想在网上搜索它们时，都必须记住
    `google`、`facebook` 或任何其他网站的 IP。访问将变得非常混乱。`DNS` 派上了用场，因为它用于将网页映射到我们可以轻松记住的特定 IP
    地址。


    ## 网络统计与计数器

    在进行故障排除过程中，回答问题至关重要。首先，接口是否正在发送它需要传输的数据？如果没有发送，是否在发送某些错误？最后，是哪个进程在发送所有流量？


    在涵盖了如何查看网络信息之后，我们需要知道如何设置一些常见的网络配置。


    ### 进程

    从更改 IP 地址开始。注意，在 Linux 中进行更改时，你有两种类型的更改：

    - 立即生效但不持久的更改。一旦你重启操作系统，这些更改将不再生效。

    - 重启电脑后仍然有效的更改。


    要对 IP 配置进行即时生效的更改，你需要使用 `link`、`route` 和 `address` 命令选项。然而，你需要在 Linux OS 上安装 `iproute2`
    软件包。默认情况下，该包通常是预装的，但很大取决于你正在使用的操作系统版本。


    ## 网络接口绑定 (Bonding)

    你可能需要比单个接口提供的更多的带宽。否则，你可能会遇到网络问题，或者你可能想要某种形式的风险冗余。风险冗余根据供应商不同有许多名称，例如 `EtherChannel`、`VMware`、`PortGroups`、`bonds`
    以及聚合组只是其中一角。Linux 也提供了此类功能并命名为 `bonding`。绑定允许用户创建一个逻辑网络，稍后与多个逻辑网络连接，然后扩展添加更多接口，从而提供负载均衡和防止接口故障的保护。使用
    `bonding` 特性需要通过 `modprobe` 命令安装内核模块，因为 `modprobe` 命令将帮助为 Linux 内核添加额外功能。


    ### 基础 Linux 网络绑定模块

    - `Balancer rr`：默认的轮询绑定，提供容错能力和负载均衡。

    - `Active back up`（主备模式）：该模块提供容错能力，一次有一个从机处于活动状态，发生故障时由另一个从机接管。

    - `Balance xor`：基于哈希，提供容错和负载均衡。

    - `Broadcast`（广播）：通过在从机接口上传输数据提供容错。

    - `802.3ad`：为任何具有相同速率的链路创建聚合组，以提供负载均衡和容错。其标准动态链路是 `IEEE.802.3ad`。`802.ad` 是常见的绑定类型，它使用
    `LACP` 与另一端的绑定口进行通信。

    - `Balance tbl`：在没有特殊交换机支持的情况下自适应传输负载均衡。

    - `Balance alb`：这是一种自适应负载均衡，由于使用了 `ARP`，它不需要特殊的交换机支持。


