    - Lucid puppy – When it was first created it was called Lucid, then later added
    the word puppy when it was released to the public by a guy called Larry Short.
    The word puppy reflected its aspect of being good looking and user-friendly.

    - Wary puppy – It was a second release of the puppy from a guy called Barry. This
    kind was mostly developed for old computers with fewer requirements. Therefore,
    it is not a popular distribution in the technology world. Its main aim was to
    make the old desktop become functional and useful. It used the old version of
    the kernel that supports the old hardware, where it can no longer be supported
    by the new version of the kernel.

    - Slacko puppy – This is the third release of puppy Linux that was developed and
    maintained by a guy called Mick Amadio. It became known due to its functionalities,
    and the news about Slacko gained popularity in the community with positive feedback.
    For this reason, it went creating new releases the latest one being Slacko 5.7
    that is still used to date.

    - Racy puppy - This is the fourth release by Barry Racy Puppy, the same person
    who created a warry puppy. It resembles the features of warry; the only difference
    is that this one is targeted for new versions of the desktop. It uses the new
    version of the kernel, making it more popular than a warry puppy.

    - Precise Puppy – This was the fifth release in the list by Barry again. It was
    built with the compatibilities of Ubuntu with few bells and whistles that required
    a more advanced technology as opposed to Barry''s main aim. Among Barry releases,
    this one gained more popularity and is still used to date.


    ## Directories in Linux


    Whatever you see in Linux has a file system in them. Each file system is composed
    of different directories mostly known to us as folders (its root is `/` which
    is the base root). The directories may have some different partitions either on
    the operating system or a different one but still based on the file system. They
    follow a certain file system hierarchy, but at times they may deviate from that
    order. Here is a list of the regularly used directories in Linux.


    - `/` – This the the primary hierarchy root in the whole file system hierarchy.

    - `/bin` – Helps store the user’s commands.

    - `/boot/` – Has the system startup files.

    - `/dev/` – Has the device files.

    - `/etc/` – Here is the location of directories and configurations files.

    - `/home/` – Default location where home directories are found.

    - `/initrd/` – Assist in the loading of device modules.

    - `/lib/` and `/usr/lib/` – This directory holds the library files used by programs.

    - `/lost + found/` – Holds those files with no names also known as orphaned files.

    - `/opt/` – Suppose if you have third party software, this directory helps in
    the installing and uninstalling of that software.

    - `/proc/` – It is a virtual directory that holds system data required by specific
    programs.

    - `/sbin/` – This directory helps in storing user commands.

    - `/tmp/` – The directory keeps temporary system directories.

    - `/usr/` – Contains a file system related to users.

    - `/var/` – Files that keep changing such as printer are contained here.


    ## Backup Linux File Systems


    The backup of these file systems is mostly done by backup commands such as `tar`,
    `dump`, and `spio`. As a hacker, it is good to understand how the backup takes
    place because many times, you will be needed to do the backup. The commands listed
    there may not be sufficient to do the whole process of backup but let us look
    at the different ways you need to do while backing up.


    1. Backing using `tar` command – (Tape achieve) the backup can be done both on
    a single file backup. With this command, you cannot backup special characters
    and only works on mounted files.

    2. Backing using `cpio` command – This type can be used to both single and multiple
    files. Unlike `tar`, this type of command backs special characters and the block
    files. Additionally, for you to backup with this command, it requires you to have
    a list of files.


    Backup can be done by a user using the `dump` utility that helps you do the full
    backup and restore process. The backup can be done in various ways like a user
    using the remote system, tape or restoring selected or fill files. It is easy
    to backup or restores what you are doing using the Linux operating system; you’ll
    need to master some commands or programs that can help you to restore options.


    ### Types of Desktop Environments


    ### GNOME – Stands for GNU Network Object Model Environment. It is a graphical
    user interface used for desktop applications to enhance the usability of the user.
    You do need to know how to do programming for you to sue this application. It
    is a user-friendly application that helps newbies go about the Linux operating
    system. The desktop version has widgets libraries that help hackers or programmers
    develop apps that intergrade with the GNOME environment. It is available in different
    forms such as Fedora and getting started with it is easy because you can perform
    a different task at the same time.


    ### KDE – Stands for the K desktop environment. It is a popular Linux desktop
    environment, but more complex compared to GNOME. This type has made it easy for
    users since it uses windows. It gives the user the choice of choosing their customized
    desktop environment since it comes with different distributions features like
    the Konqueror browser and Koffice software. The browser works like windows, that
    help you browse the local files or similarly it is a browser itself. If you are
    looking for a desktop option with many configuration options, then this can best
    suit your requirements. It has its basis on the QT toolkit, meaning it uses different
    programs compared to other desktops.


    ### Xfce – This Linux environment has similar functions and features like that
    of GNOME. This one can be more ideal if you want more of a traditional and lightweight
    environment. For this one, it uses the GTK toolkit which has installed programs
    such as text editor, and image viewer.


    ### Cinnamon – The developer who created this, developed it for Linux Mint distributions.
    It is a modern kind of desktop environment with graphical interferences based
    on GNOME 3. This type of environment can also be used in Ubuntu as your preferred
    desktop environment.


    ### MATE – This type is composed of an open-source that is free to use and runs
    on the Linux operating system. Its name is derived from a South American plant
    called yerba mate. Mate Advanced Traditional Environment was supported by many
    people of this community that it advances to become a free desktop environment
    for Linux. The good thing with the type of desktop environment is compatible with
    both the old and new versions of desktops.


    ### Unity – It was developed by a company behind Ubuntu distributions. The main
    aim of this desktop environment was developed to improve the real estate screen
    to run in netbooks. Its first release was made in the year 2010, with consistent
    improvements from time to time. It is kind different from other desktop environments
    because it uses a different user interface. On the left side is the launcher,
    and the dash icon on top of it. For a new user, it is difficult to note where
    one can disable or enable this notification on the configuration settings. The
    user will have to search on the web browser to see how to go about it. One disadvantage
    of this desktop environment is that it has very little default tools that can
    be used customization.


    # Text Manipulation


    Text manipulation is the process of modifying the text to suit our needs. There
    are many formatting features that can be done to a document. They include but
    not limited to, changing the word of every character of a word to uppercase, maybe
    there is a misspelled word in a document, and we want to change every instance
    of the misspelled word in the whole document.

