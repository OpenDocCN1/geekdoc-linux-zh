    ### Managing Linux kernel modules


    The Linux kernel is Linux operating system`s core part. It is in charge of operating
    the computer and the hardware. There are two types of kernels which include the
    microkernel and monolithic kernel. The microkernel is in charge of the functionality
    of the operating system. The microkernel will manage the memory and CPU time.
    The monolithic kernel is in charge of the device drivers. When the two types are
    combined and work together, they help manage the operations of the operating system
    as well as the hardware. Modules in the Linux operating system are pieces of code
    that can be loaded or unloaded upon demand by the operating system. The function
    of these modules is to help extend the functionality of the OS without having
    to shut down the whole system.


    The ability to load and remove modules from Linux is one of the most significant
    advantages of this operating system. This is because it helps to reduce the size
    of the operating system. Without the ability to load modules or remove them, then
    it would mean that the operating system would come with systems to help complete
    any anticipated functions loaded in the base kernel. Loading the modules will
    lead to wasting of memory and with users having different needs, then they would
    be useless to some users. Linux has three major kernel modules: file system drivers,
    device drivers, and system calls.


    One major reason why people prefer to compile their kernels is that some drivers
    (and other kernel features) need to be patched. At times some of the kernel features
    may get broken. When this is the case, patching up may need the user to develop
    their kernels. Another case where a person may develop a kernel is when they need
    to update the drivers or needs to use new ones. They may result in developing
    a new kernel. Compiling one’s kernels will mean that the person will remove some
    kernels and build new ones. The process of removing the older kernels and replacing
    them with new ones will mean that the system is optimized. The optimization, in
    many cases, can result in a faster system for the user. However, this is just
    an advantage and not a reason to build and replace kernels.


    Inserting modules


    The presence of only three kernels leads to the need to add some more kernels
    to help enhance functionality. In the normal Linux OS, modules are kept in the
    /lib/modules//kernel/ directory, and they have a .ko extension. To insert a module
    into the kernel, one should use the insmod command. The user will simply type
    the syntax insmod <module_name>.ko


    For example: # insmod /lib/ modules/ 4.4.0-21-generic /kernel/ drivers/cpufreq
    /SpeedStep- lib.ko


    Removing modules


    At times, one may decide that some modules are not useful at the time. They will,
    therefore, need to remove them from the kernel. To remove the modules from the
    kernel, the user needs to use the rmmod command. rmmod <module_name>.ko is the
    syntax for removal of modules. However, it is essential to note that a module
    in use by a program cannot be removed.


    For example: # rmmod /lib/ modules /4.4.0-21-generic /kernel/ drivers/ cpufreq/
    speedstep-lib.ko


    Creating and loading a kernel module


    One can be able to create and add their new kernels to their operating systems.
    Creating new kernels is a simple step process. Below are the steps to follow in
    the process of creating a kernel.


    1.  Add the header lines. The general format for adding the header lines is as
    follows.


    #include <Linux/ kernel.h>


    #include <Linux/ init.h>


    #include <Linux/ module.h>'
