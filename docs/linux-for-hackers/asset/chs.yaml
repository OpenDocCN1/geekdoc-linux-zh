  \n\n\n\n\n\n\n\n![](img/image00115.jpeg)\n\n\n# 引言\n\n在本本书中，我们将学习一个名为 Linux 的操作系统是如何运作的，以及黑客如何利用这个工具来帮助他们。Linux\
  \ 是由 Linus Torvalds 在 20 世纪 90 年代初创建的操作系统（OS），目前是非常流行的选择。确保其正常运行的核心部分是 Linux 内核，它是免费的。与更容易使用的微软\
  \ Windows 相比，Linux 看起来可能有点难以处理。但这主要是因为我们必须实际进行一些编码并使用命令行，而不是图形界面来让一切运行。\n\n## Linux\
  \ 内核\n\nLinux 内核将此操作系统与其他操作系统区分开来。内核是开发 Linux 的代码，在多年来，许多开发者一直在更新版本。这就是为什么如果你想用\
  \ Linux 进行黑客攻击，你必须了解 Linux 内核是如何工作的。内核位于操作系统的最内层，它执行以下工作：\n\n* 管理硬件。\n* 执行操作系统的基本服务。\n\
  * 分配资源均衡。\n\n\n\n\n当你想执行 `Kernel` 时，你需要在内核态下实现它，而不是用户态。因此，运行在系统中的任何应用程序都通过我们所谓的“系统调用”与\
  \ `Kernel` 通信。系统允许用户利用接口与 `Kernel` 进行平滑的交互。你知道每一个可能与系统交互的函数都会自动转换成系统系统调用吗？这里有一个例子：\n\
  \n```\nVoid main () {}\n```\n\n假设这是你将看到的最明显的现象之一。在这里，它通过主入口访问并在随后退出。为了让你理解我们所说的内容，这里是内核的分级图。\n\
  \n| 用户进程 | 图形用户界面 | 这里的 | Shell |\n| :--- | :--- | :--- | :--- |\n图 1.1 \n\n| Linux\
  \ 内核 | 系统调用 | 进程管理 | 内存管理 | 设备驱动程序 |\n| :--- | :--- | :--- | :--- | :--- |\n图 1.2\
  \ \n\n| 硬件 | 处理器 | 主内存 | 磁盘 | 网络部件 |\n| :--- | :--- | :--- | :--- | :--- |\n\n在我们在本指南的过程中，我们将详细解释内核与黑客技术之间的关系。但在那之前，理解一些基础知识是关重要的；这只是一个介绍。\n\
  \n## 应用程序、硬件与内核之间的关系\n\n从图中我们可以看到用户进程运行在用户态，而 `Kernel` 运行在内核态。这意味着如果代码运行在内核态，它就可以无任何限制地访问处理器（`CPU`）和主内存。尽管这可能让你感到高兴，但内核的这一特性可能会很容易导致整个系统崩溃。\n\
  \n因此，用户态限制了对处理器的直接访问。这就是为什么当任何用户误操作进入处理器并更改 `CPU` 的功能时，它会导致整个系统崩溃。当崩溃的情况不严重时，内核会尝试清理所造成的烂子。尽管如此，你有正在运行的程序，它们也将无法照常工作。当你更改用户界面时，与内核相比，它可能引起严重的损害。\n\
  \n硬件是计算机的物理部分，保存着机器的内存，即随机访问存储器。它存储保存在文件中的信息，并协助中央处理单元更快、更高效地加载文件。计算机的所有输入和输出都通过主内存运行。内部内存中存在你需要了解的一些内存。\n\
  \n主内存 – 这里我们有随机访问存储器 (`RAM`) 和只读存储器 (`ROM`)。\n\n1. `RAM` – 以这种形式存储的数据在用户进行提示时可以随时被访问。这种内存具有极强的易失性，你可以对其进行读写。假设掉电了，这种内存将无法追踪。我们有不同类型的随机访问存储器。\n\
  \n- `SRAM` – 这是静态随机访问存储器。这是你可以获得的最昂贵的内存之一。这种内存有几个版本，如 `DDR2`、`DDR3` 和 `DD4`，它们都比比\
  \ `DDR` 更好的性能。每个单元由六个电容器。\n- `DRAM` – 动态随机访问存储器是计算机中最常用的内存类型。与 `SRAM` 相比，这种内存较慢，每个单元有一个电容器和一个晶体管。\n\
  \n2. `ROM` – 顾其名，这种数据只能读取不能写入。对于用户来说，这是一种快速的数据。与随机访问存储器不同，断电后以后可以访问这些数据。我们可以说，即使断电，计算机不需要软件来帮助\
  \ `CPU` 通信。这种内存有数百万个晶体管和电容器。现在，当这两个部分结合时，它们就形成了我们所谓的内存单元，由单个位表示。电容器桶存储电子，尽管有时桶可能会漏水。动态随机访问存储器在放电之前帮助为空空的桶充电。这个过程在许多循环中反复进行，以便处理器能够读写内存。\n\
  \n这是一个需要理解的关键点，因为在黑客攻击期间，如果你不了解应该与哪种内存工作，我们的数据可能会被追踪。当你想要黑进计算机的内存时，你可以进行诸如真空、游戏漏洞利用、调试模式等操作。在任何情况下，如果内存操作是不可能的，那么进行操作将具有挑战性。\n\
  \n内核是 Linux 的心脏。图 1.1 概述了 Linux 内核的功能。在它的进程部分，`Kernel` 选择哪个进程先被允许运行而不是另一个。在内存部分，`Kernel`\
  \ 帮助记录内存，例如分配给特定进程的内存量或可以共享的内存量。在设备部分，驱动程序充当硬件和进程之间的接口，进程为了与内核通信，它们使用系统调用。\n\n##\
  \ 使用 Linux 的益处\n\n这里是使用 Linux 的益处：\n\n1. **安全性** – 与其他操作系统相比，Linux 是最安全的操作系统。你会发现，当恶意软件攻击它时，其他操作系统非常脆弱。更有趣的是，在任何病毒攻击或授权登录之前，用户必须输入密码。\n\
  2. **可靠性** – 它具有极好的稳定性，使用户能够高效地使用它 - 不需要因为某些错误而不断重启电脑。\n3. **免费使用** – 你可以去浏览器下载该操作系统，而不需要被要求输入激活密钥。\n\
  4. **多任务** – 你能够使用系统执行不同的任务，而不会像在其他操作系统那样遇到很多困难。即使当你需要处理很多任务时，它也不会降低速度或效率。这很棒，因为它为黑客提供了同时监控不同事物的机会。\n\
  5. **不同的发行版** – 通过 Linux 系统可以有很多发行版，这些发行版被称为发行版（bistros）。\n6. **开源** - Linux 的一个优点是它的源码对所有人开放。根据你想要执行的具体事情，你可以自由地执行、添加或修改代码；这在其他操作系统上是罕见的。\n\
  7. **更新** – 使用 Linux 时，你会注意到很多软件更新提示。软件更新很容易更新，只需几秒钟即可完成。\n\n你会发现，与另一个操作系统相比，使用它具有独特的优势。所有这些特征结合在一起，让你在进行黑客攻击时需要这个操作系统。`Ubuntu`\
  \ 是最直接的 Linux 语言。这是因为一旦你理解了命令是如何执行的，就会学会如何使用它。\n\n# 第 2 章：黑客攻击与黑客需要的技能\n\n## 什么是黑客攻击？\n\
  \n在使用一些可以用于黑客攻击的技术之前，首先你需要详细了解什么是黑客攻击。当我们谈论黑客攻击时，我们指的是一个主动寻找系统漏洞的过程。一旦你发现了这些漏洞，就可以利用这些弱点帮助你非法访问。这是通过破解操作系统算法来实现无密码访问。\n\
  \n\n\n\n- **黑客行动主义 (Hacktivist)** – 这类人会攻击网站并在被黑的网站上留言。他们留下的信息可能涉及政治、宗教、社会、全球或政府相关问题。大多数情况下，这些都是负面信息。\n\
  - **黑帽 (Black hat)** – 他的主要目标是访问计算机获取数据以自利。他意图侵犯版权或盗取资金。\n- **伦理黑客 (Ethical hacker)**\
  \ – 也称为白帽。他们通过攻击计算机系统来识别漏洞并进行修复。他们可以测试系统以查看其是否容易受到黑客攻击。\n- **灰帽黑客 (Grey hat)** –\
  \ 此人在未经授权的情况下攻击计算机系统。他的主要目标是识别问题并告知系统所有者。\n\n因此，伦理破解是最受推荐的，因为你是通过合法访问进入计算机的。作为伦理黑客，请确保你获得了系统所有者的访问许可。你有责任保护客户的数据不被用户攻击，并应通知相关人员。此人可以保护数据，或者如果你是专家，则可以亲自执行保护工作。\n\
  \n## 破解技术类型及预防措施\n\n以下是黑客在攻击时使用的一些黑客方法：\n\n### 被动攻击\n这种类型是指黑客通过观察现有的漏洞尝试攻击计算机。这种类型攻击的主要任务是获取有关特定公司的信息，而不一定更改任何信息。\n\
  \n攻击可以是主动侦察，也可以是被动侦察。在主动侦察中，攻击者可能尝试通过端口扫描进行访问；而在被动侦察中，攻击者会监控正在进行的活动。\n\n### 被动攻击方法\n\
  \n- **翻垃圾 (Dumpster diving)** – 入侵者从垃圾桶中获取一些信息。这些是保存在垃圾桶里的密码。他们使用这些密码访问锁定的信息并掩盖系统入口。这提醒你不要在计算机中保存密码，或者在机器、系统或网络发生任何情况时，不要忘记永久删除它们。\n\
  - **无线网钓鱼 (War diving)** - 这种方法是入侵者通过扫描处理获取易受攻击的 WIFI 网络。主要通过移动车辆上的便携天线完成。许多人喜欢在公共场所访问免费\
  \ WIFI；这为入侵者提供了轻松访问这些开放网络的机会。这种破解方法的主要目标是获取互联网连接。\n- **水坑攻击 (Waterhole attacks)**\
  \ – 这个名字的灵感源于那些喜欢留在水池附近攻击猎物的掠食者。现在，入侵者留在目标网站附近等待用户访问时进行狩猎，并尝试使用恶意软件进行攻击。\n\n他们通过发送受影响的\
  \ HTML 代码来攻击网站，当用户点击网站时，它会重定向到其他网站。使用户无法访问他们寻找的特定信息。之后，一旦目标用户访问链接，受损网站就会感染他们。\n\n\
  ### 如何防御水坑攻击\n\n- **双重身份验证 (Two-factor authentication)** – 你会发现他们窃取密码和用户名。为了防止被攻击，请使用双重身份验证，这让他们难以猜出代码或使用其他此类方法。\n\
  - **禁用易受水坑攻击的工具** – 某些软件容易受到影响或遭受攻击，如果可能，请将其删除。其中一些软件是 Adobe 的 Flash。\n- **安全审计\
  \ (Security audit)** – 根据你所在的国家，你可以决定在知名的 IT 服务公司进行安全审计。\n- **更新软件** – 攻击者利用系统未定期更新软件来实施攻击。安全是每个企业数据库的关键，因此请保持更新计算机上的某些软件，否则你将成为黑客的受害者。\n\
  - **监控网络 (Monitor network)** – 进行定期的更新监控，这有助于你跟踪访问网站的人员。`SSL` 流量检查器可以帮助你做到。\n\n\
  **键盘记录器 (Keylogger)** – 也称为监控软件。它就像摄像头一样，监控所有发生的活动记录，登录、下载、聊天等。他们通过记录你的键盘输入来实现，让你不会怀疑有任何事情发生。他们可以访问敏感信息，如信用卡号、密码和账户信息等。\n\
  \n键盘记录可以以积极的方式进行，例如父母监控儿童访问可能导致网络犯罪和欺诈的危险网站。有时，如果你有键盘记录器，可能很难检测到。你可以注意你的键盘是否不断将你重定向到某个网站、性能是否比平时慢，或者屏幕是否显示错误信息。\n\
  \n### 如何防止键盘记录器\n\n- **密码管理器 (Password manager)** – 大多数密码管理器使用自动填充功能来帮助你记住密码。但你知道这是危险的吗？是的，黑客可以保存密码。虽然某些键盘记录器会在键盘上打字时保存密码，但检查你的计算机/系统是否有此类可疑的键盘记录器是好的。作为公司，可以使用键盘记录器来检查异常活动。\n\
  - **保持谨慎 (Be cautions)** – 这种情况几乎发生在每个人身上，即你会收到来自陌生人的链接。其中一些链接是被感染的，并发送来提示你点击。点击这些链接就是破解的开始。你会发现，一旦点击了这些链接，你的计算机就会开始运行异常或重定向到特定网站。\n\
  - **键盘布局 (Keyboard layout)** – 也许可以尝试更改计算机的设计。键盘记录器适用于 QWERTY 布局，尝试将其更改为 `DVORAK`。这是因为在该布局下转换捕获的内容变得困难。\n\
  - **安全工具 (Security tools)** – 为你的计算机增加额外的安全措施，你需要安装额外的安全工具。某些如 `Ghost press` 的工具是反键盘记录器，可以阻止其他程序在不知情的情况下在后台运行。\n\
  - **更改密码 (Change passwords)** – 如果你怀疑有人在登录你的邮件，尝试设置一个复杂但易记的密码。黑客可能会窃取你的密码，但不一定会使用。经常更改密码，以防将来他在意之外地尝试破解系统。\n\
  \n### Cookie 窃取 (Cookie theft)\nCookie 数据在传输过程中是可用的。它总是以网站标头的形式发送，这使得它们容易受到攻击者的攻击。在公共场所，由于容易访问，这种风险更大。\n\
  \n### Cookie 操纵 (Cookie Manipulation)\n\n- 你知道 Cookie 可以被操纵吗？是的，Cookie 会被操纵。大多数用户喜欢使用\
  \ Cookie 保存数据，但应仅使用 Cookie 保存非敏感数据。原因是攻击者绝对会使用你的 Cookie 来获取某些敏感信息。\n- 此的替代方案是将你的数据保存在服务器端的会话（session）中。会话更像是一个数据库文件，记录你的个人信息。它帮助用户避免数据被操纵的危险。\n\
  - 为了帮助自己防止操纵，请为 Cookie 设置过期日期。这样，一段时间后信息将不再存在，从而防止被利用。访问非 `SSL` 网站会面临数据暴露给恶意网站的风险。`SSL`\
  \ 加密网站是更安全的访问地，因为它们具有安全的 Cookie，可以防止受损坏。\n- 另一种防止 Cookie 操纵的方法是使用合适的算法。算法有助于数值的加密和解密。这非常重要，因为假设\
  \ Cookie 是明文的且无法运行，那么它们永远不会受到攻击，因为已有的算法很难被破解。\n- 此外，人们决定对 Cookie 进行签名，作为一种保护防御工具。\n\
  \n\n\n\n\n# 诱敌钓计 – 这似乎是当今世界常用的一种相当诡险的黑客技术。黑客所做的是入侵网站/系统并开始发布与该网站无关的文章。公司本身可能并没有察到正在发生什么。攻击者随后会通过与网站并不一定相关的广告来引导你。\n\
  \n他们插入了只有 Google 能看到而用户无法看到的链接。他们从中获利，因为其中一些链接是广告。由于这种方式，访问你的计算机变得更容易了，因为当你下载内容时，病毒会攻击你的计算机。你可能见过这种类似的情况，比如一个银行网站上有关于比特币的文章。这应该让你引起思考，并意识到这些内容是被操纵的。\n\
  \n### 避免诱敌钓计战术\n\n- 免费的东西会影响人类。几乎所有人看到“免费”这个词时都会点击广告。让我们从现实世界的角度来看：这里有两家公司提供相同的产品。A\
  \ 公司告诉你我将以 `$10` 提供该产品，而 B 公司则免费给你。说实话，许多人或你你自己会去 B 公司。\n- 你必须注意，世界上没有免费的午餐。实际上，免费的东西背后隐藏着成本。有两种可能，要么有一个交易让你在不久后花费一些现金，要么是一种形式的诱饵，让你可能立即获得一些额外现金。免费的东西会让人们做出草率的决定，从长远来看，这让你付出巨大代价。\n\
  - 避免暴露你的个人信息。某些广告想让你用电子邮件、电话号码等详细信息进行注册。即使他们说你第一次注册就能赚 `$30`，也要保持警惕。\n\n# 使用 Linux\
  \ 系统的黑客技能\n\n假设你想成为一名黑客，那么你需要了解编程语言。这是一种可以帮助你编写计算机程序的语言。它们有不同的种类，且种而异。我应该学习编程吗，这有必要吗？是的，有。找出你为什么需要理解这些语言：\n\
  \n- 有时你在进行黑客活动可能会遇到错误。理解发生的错误是必要的。\n- 由于你能够编写程序，你将能够解决一些问题。\n- 现在网上有很多开源资源可以获取，你可以根据自己的喜好对其进行自定义。\n\
  \n也许，你正在问自己应该开始学习哪些程序。这可能没有肯定的答案，因为这取决于你想要专门化的领域。需要学习的语言如下：\n\n- `HTML` – 当你学习使用\
  \ `HTML` 时，你能够识别代码中的弱点。它可以帮助你理解如何操作以获取数据并解释数据。\n- `C` 和 `C++` - 这类语言可以帮助你通过将其推进到所需的模式来创建你自己的\
  \ shellcode。\n- `PHP` – 是被广泛使用的知名语言之一。理解这种语言是有好处的。因为如果写得不好，网站可能会变得容易受到攻击。一旦理解了如何进行编码，就可以检测出网站内的漏洞和错误。\n\
  - `JavaScript` – 一旦你理解了如何使用这种语言，你将能够理解如何在客户端浏览器上执行代码。此外，这种语言将帮助你读取任何保存的 cookies。\n\
  - `Python` – 帮助你理解如何自定义市面上已有的工具。\n\n掌握这些简单编程语言的基础知识是好的。有了基础，就可以处理其他语言。在某些情况下，你会发现这些语言语言之间是相互关联的。因此，要如何如何操作就变得容易了。如果你不适应学习新概念，那么进行黑客活动可能会很困难。因为技术发展得非常快，现在新发明层出不穷。保持灵活并学习经常发布的新技术是件好事。\n\
  \n# 在黑客活动中如何保护自己\n\n从我们目前所学的来看，我们看到黑客有很多方法窃取数据。如果攻击者发现了漏洞或任何弱点，他们就有窃取敏感信息的空间。\n\n\
  以下是保护自己不被黑入的不同方法：\n\n1. 删除 `cookies` 中保存的数据。这可以防止由于保存的密码导致的 cookies 操纵。这适用于你垃圾箱或自动填充中的个人信息。\n\
  2. 避免公共 `WIFI`，因为它们是不安全的。任何人都可以利用互联网连接访问你网站上的数据。\n3. 准备防病毒软件，高级版本可以帮助你识别在你不知情的情况下计算机上的任何病毒。\n\
  4. 远离免费的东西。如上所示，免费的东西背后总有陷阱。没有免费的午餐。\n5. 禁用第三方权限。许多人经常忘记这一点，这似乎是一件小事，但它是关键。当手机上下载了某些应用时，你会发现一直开启的权限图标。它可能不会通知用户后台正在发生什么，但请检查这些应用。某些应用在安装后就会获得手机联系人、聊天和敏感信息的访问。\n\
  6. 通过对你的网站或计算机运行测试来检查任何易受攻击的弱点，从而领先于黑客。没有哪个网站或设备是 100% 安全；唯一的方法是在进入诱饵之前保持聪明。\n7.\
  \ 避免点击来自不可信人员或网站的链接。不安全的网站总是攻击发生的地方。当你看到重定向到某些网站或下载应用时，将其标记为垃圾邮件。\n8. 使用 `Linux`\
  \ 时，确保你更改了 `hostname`，因为他们肯定知道正在发生什么。这必须通过使用备用内部网络匹配来完成。\n9. 获取 `tor` 浏览器和 `proxy`。下载这两个程序并安装在你的计算机上，记住更改代理设置。`tor`\
  \ 互联网通过帮助你匿名使用互联网来保护你的数据。在使用此浏览器时，没有人知道你是是谁，也不知道你在互联网上在做什么。\n\n让它更安全的是，它在互联网上提交数据时对其进行多层加密，像洋葱一样。一旦发送了该层，它们就会在多个中继中堆叠，直到最后一个数据包离开中继到达你的目标地。这个过程被称为\
  \ `onion routing`（洋葱路由），它是保护自己的最佳方法之一。\n\n# 第 3 章：# Linux 发行版和备份文件系统\n\n## 如何使用\
  \ Linux 操作系统\n\n这是一个多年一直使用并不断升级的操作系统。旧版本对用户并不友好，但随着受欢迎程度增加，版本被升级为用户友好的模式。我们所知的一些著名的操作系统如\
  \ windows、mac 等。程序员更倾向于这种操作系统，因为很容易将其自定义为他们所需的操作系统，使其成为下载量最多的操作系统之一。\n\n你可能会问自己，我应该开始学习\
  \ `Linux` 吗？是的，你应该。原因是因为它是目前范围内广泛使用的许多操作系统的母体，你永远无法逃避它。事实上，学习 `Linux` 是作为黑客可以做的最简单的事情之一。Linux\
  \ 操作系统有不同的桌面环境，我们稍后来看。\n\n## 什么是 Linux 发行版？\n\nLinux 通常缩称为 “Linux distro”，是开源程序的一种类型，通常包含各种工具和软件等组件。理解了这一点，你就会发现有数百种发行版可供免费安装。每种发行版都是为了特定的目的而制造的；例如，`android`\
  \ 是很多人熟悉的常用发行版之一。\n\n## Linux 发行版的类型\n\n\n\n\n\n## Ubuntu\n它是广知的 Linux 发行版之一，自 2004\
  \ 年起存在。它由 Mark Shuttleworth 在《南非百万富翁》节目中发明。它提供多种语言版本且易于使用。它始终是一个免费的操作系统；你不需要任何资金即可拥有此系统。它通常以周期方式发布，每隔\
  \ 6 个月发布一次。因此，你无需花费任何额外费用即可获得该系统的定期更新。\n\n该操作系统是一个开源程序，赋予用户根据自己的喜好进行自定义的权限。它是一种灵活的系统，因为你可以将其用于桌面版本，也可以作为服务器使用。Ubuntu\
  \ 可以在你的电脑上运行，也可以作为侧系统与你现有的操作系统一起使用。\n\n它的运行需要 Linux 架构的帮助来向计算机硬件发送指令。你会发现它使用了与 Windows、Mac\
  \ OS 和 Android 等其他操作系统类似的图形用户界面。你会认同，许多人都使用过这个操作系统，使得在 Ubuntu 中使用库文件变得更加容易。\n\n\
  ## Gentoo Linux\nGentoo Linux 是一种基于源码的发行版。这意味着你必须找到源码；因此，它是经验丰富的开发者的发行版。由于该操作系统的移植性，它可以在任何环境中无障碍使用。关于这一特性，你可以使用常见的处理器\
  \ `PA-RICC`、`x86` 等对其进行安装。\n\n使用这个发行版并非易事，精通 Linux 终端将帮助想要探索此操作系统的黑客。这更像是从零开始启动\
  \ Linux，尽管一旦理解了这些不可思议的发行版，你会有很多机会以非常棒的方式构建和个性化功能。\n\n它有自己的一个名为 `portage` 的端口。`portages`\
  \ 是至关重要的，因为它们帮助进行安全安装、虚拟包并为你配置文件。因此，它为你提供了极高的性能评分。\n\n让我们详细了解：\n\n### 使用 Gentoo\
  \ Linux 的优势\n- 与 Linux 结合具有高度安全性。\n- 它是一个动态操作系统，可以在任何类型的计算机上轻松管理。\n- 它拥有一个至关重要的包，特别是对于新用户来说。\n\
  - 它拥有多种工具可以帮助你以简单的方式管理操作系统。\n- 他们有 Gentoo 社区，当你遇到问题时可以进行任何查询。\n- 它支持不同类型的架构处理器供选择。\n\
  \n### 常见用户问题\n- 用户不知道如何使用 Gentoo。\n- 用户无法安装应用程序。\n- 用户无法使用 `portages`。\n- 用户无法使用终端。\n\
  - 用户没有阅读手册（即解释 Gentoo Linux 一切的文档）。\n\n你可能对这个 Gentoo Linux 感兴趣，这里是你需要了解的：\n- **了解终端**\
  \ – 这显然是你需要精通的最强大的工具。\n- **了解如何构建应用程序** – 在每个操作系统中你都会找到应用程序。知道如何正确安装和使用它们是至关重要的。\n\
  - **每个发行版都带有一份文档**。养成阅读的习惯将帮助你掌握该发行版或任何其他发行版的基础知识。\n- **持续学习 Gentoo 技能**，以改进你不了解的地方。这样可以帮助你更快地掌握基础知识。\n\
  \n## Linux mint\nLinux mint – 这是一个被广泛使用的操作系统，有许多用户在使用。它于 2006 年发布，并具有计算机主题的桌面版本。对于初学者来说，这是一个很好的操作系统，因为它具有良好的用性，方便他们开始。\n\
  \nLinux mint 构建在其他软件层之上，例如 `Linux Kernel`（Linux 内核）和 `cinnamon desktop`。对此，你可能会发现它依赖\
  \ `Ubuntu` 和 `Debian` 等操作系统作为其系统基础。Linux mint 的主要目标是为用户创建一个实用的环境，同时让他们使用桌面执行任务。\n\
  \n当下的目标是创建一个简化的用户界面，允许公司和商务人士提升他们的技能。因此，为目标用户提供扩展其先进技术知识的机会，而不是仅仅是化。它为他们提供了在真实桌面上发挥构思的自由。\n\
  \n### 编辑器\n这是 Linux mint 发布的一个版本，旨在帮助修改以满足特定需求。黑客们熟悉的一些流行版本有：\n\n- **VIM** – 你可能会发现使用默认的\
  \ `vi` 编辑器作为主编辑器变得无聊。不用担心，因为 `VIM` 为你提供了最佳性能和许多选项供选择。`VIM` 一词的意思是“改进的 vi”，其发音含义是指一个为了满足开发者需求而改进的编辑器。\n\
  - **Geany** - 它是 Linux 开发者最常用的编辑器之一，集成了 `GTK+` 工具包。它是一个支持许多编程语言的编辑器。\n- **Kwrite**\
  \ – 它最初由 `KDE` 开发，并于 2000 年发布。其主要目标是帮助编辑远程文件并对你的文件进行编码。\n- **Nano** – 这是一个著名的编辑器，主要用于\
  \ `UNIX` 操作系统。它首次于 2000 年发布，带有许多附加功能，是一个强大的文本编辑器。另外一点是，它只能通过命令行运行。\n- **GNU Emacs**\
  \ – 它是 Linux 环境中最老的文本编辑器，你可以将其作为你的编辑器。该编辑器由一个名为 Richard Stallman 的人开发，他也是 `GNU`\
  \ 项目的创始人。这个操作系统的好处是，许多程序员都使用它，并且被证明在几乎所有的编程语言中运行良好。\n- **Gedit** – 如果你用过 `GNOME`，你可能用过这个文本编辑器，因为它是默认的编辑器。\n\
  - **Kate** – `Kubuntu` 操作系统带有 `Kate` 作为默认编辑器。通过这个编辑器，你可以对许多文件进行编辑。这个编辑器很有趣的一点是它支持许多语言，因为它能自动检测语言。\n\
  - **Eclipse** – 这个编辑器主要由寻求创作健壮且兴奋代码的设计师和后端开发者使用。对于经验丰富的开发者。\n\n## Mandriva\nMandriva\
  \ – 该操作系统最初作为 `Mandrake Linux` 引入，带有一些不熟悉的特性。今天它是目前使用的最佳操作系统之一。它拥有面向未来黑客的友好型特性，如\
  \ Mandriva 控制中心。这一特性使得配置某些设置变得简单。\n\n你可能会发现的一些特性是：\n- 图形化安装程序 – 此功能帮助任何用户在桌面或笔记本电脑上完成操作系统的安装，而无需经过命令行过程。这个功能很好，特别是对于那些仍在学习或刚开始学习\
  \ Linux 的人。\n- 图形化配置 – 此功能经过了改进，你不再需要经过编辑配置设置的过程。该功能帮助你使用图形化工具更改配置。为了帮助你理解这一点，以编辑器进入大众之前为例。起初，他们通过编辑计算机的\
  \ IP 地址来完成配置。现在由于技术的进步已有所不同，像 `VIM` 这样的编辑器将帮助你完成。\n\n## Puppy Linux\nPuppy Linux\
  \ – 这是一个非常适合旧版本电脑的旧操作系统。它有各种特性配置，用户可以根据需要使用。了解这种发行版是不同操作系统的组合。\n\n它主要发布了四个主要版本：\n\
  \n\n\n\n\n- Lucid puppy – 当它最初创建时被称为 Lucid，后来当一个叫 Larry Short 的人向公众发布它时，添加了 puppy\
  \ 一词。puppy 一词反映了它美观且易于使用的特点。\n- Wary puppy – 这是由一个叫 Barry 的人发布的第二个版本的 puppy。这种类型主要是为要求较低的旧电脑开发的。因此，它在技术世界中并不是一种流行的发行版。它的主要目标是让旧桌面电脑变得功能齐全且实用。它使用了支持旧硬件的旧版本内核，而新版本的内核不再支持这些硬件。\n\
  - Slacko puppy – 这是 puppy Linux 的第三版本，由一个叫 Mick Amadio 的人开发和维护。它因功能而闻名，关于 Slacko\
  \ 的新闻在社区中获得了积极反馈并广受欢迎。因此，它不断发布新版本，最新的版本是 Slacko 5.7，至今仍被使用。\n- Racy puppy - 这是 Barry\
  \ Racy Puppy 发布的第四版本，他就是创建 warry puppy 的同一个人。它类似于 warry 的特征；唯一的区别是这个版本针对新版本的桌面。它使用新版本的内核，比\
  \ warry puppy 更受欢迎。\n- Precise Puppy – 这是 Barry 再次发布的第五个版本。它是基于 Ubuntu 的兼容性构建的，没有那些需要更先进技术的复杂花哨功能，这与\
  \ Barry 的主要目标相反。在 Barry 发布的所有版本中，这一个最受欢迎，并且至今仍在使用中。\n\n## Linux 中的目录\n\n你在 Linux\
  \ 中看到的任何内容都有一个文件系统。每个文件系统由不同的目录组成，我们通常称为文件夹（其根目录为 `/`，即基础根目录）。目录可能位于操作系统上的不同分区或另一个分区上，但仍然基于文件系统。它们遵循特定的文件系统层次结构，但有时可能会偏离该顺序。以下是\
  \ Linux 中常用的目录列表。\n\n- `/` – 这是整个文件系统层次结构的主根。\n- `/bin` – 帮助存储用户的命令。\n- `/boot/`\
  \ – 包含系统启动文件。\n- `/dev/` – 包含设备文件。\n- `/etc/` – 这里是目录和配置文件的位置。\n- `/home/` – 目录的默认位置。\n\
  - `/initrd/` – 辅助加载设备模块。\n- `/lib/` 和 `/usr/lib/` – 此目录存放程序使用的库文件。\n- `/lost + found/`\
  \ – 存放没有名称的文件，也称为孤立文件。\n- `/opt/` – 假设你有第三方软件，此目录有助于该软件的安装和卸载。\n- `/proc/` – 虚拟目录，存放特定程序所需的系统数据。\n\
  - `/sbin/` – 此目录帮助存储用户命令。\n- `/tmp/` – 目录保留临时系统目录。\n- `/usr/` – 包含与用户相关的文件系统。\n\
  - `/var/` – 包含经常变化的文件，例如打印机文件。\n\n## 备份 Linux 文件系统\n\n这些文件系统的备份主要通过 `tar`、`dump`\
  \ 和 `spio` 等备份命令完成。作为一名黑客，了解备份是如何发生的很好，因为很多时候你将需要进行备份。列出的命令可能不足以完成整个备份过程，但让我们看看备份时需要执行的各种方法。\n\
  \n1. 使用 `tar` 命令备份 – （磁带存档）可以对单个文件进行备份。使用此命令时，你无法备份特殊字符，它只对挂载的文件有效。\n2. 使用 `cpio`\
  \ 命令备份 – 这种类型可以用于单个文件和多个文件。与 `tar` 不同，这种类型的命令会备份特殊字符和块文件。此外，要使用此命令进行备份，你需要文件列表。\n\
  \n用户可以使用 `dump` 工具进行备份，它可以帮助你完成完整的备份和恢复过程。备份可以通过多种方式完成，例如用户使用远程系统、磁带或恢复选择或全部文件。使用\
  \ Linux 操作系统备份或恢复你正在操作的内容很容易的；你只需要掌握一些可以帮助你恢复选项的命令或程序。\n\n### 桌面环境类型\n\n### GNOME\
  \ – 代表 GNU 网络对象模型环境（GNU Network Object Model Environment）。它是一个用于桌面应用程序的图形用户界面，旨在增强用户的可用性。你不需要学习编程即可使用此应用程序。它是一个用户友好应用程序，帮助新手熟悉\
  \ Linux 操作系统。桌面版本拥有小部件库，帮助黑客或程序员开发与 GNOME 环境集成的应用。它有不同的形式，如 Fedora，并且开始上手它非常容易，因为你可以同时执行不同的任务。\n\
  \n### KDE – 代表 K 桌面环境。这是一个流行的 Linux 桌面环境，但与 GNOME 相比更为复杂。这种类型让用户感到更方便，因为它使用了窗口化。它给了用户选择自定义桌面环境的选择，因为它带有不同的发行版功能，如\
  \ Konqueror 浏览器和 Koffice 软件。该浏览器的工作方式像 Windows，可以帮你浏览本地文件，或者它本身就是一个浏览器。如果你正在寻找具有许多配置选项的桌面选项，那么这个最适合你的需求。它基于\
  \ QT 工具包，这意味着它与其他桌面使用了不同的程序。\n\n### Xfce – 这种 Linux 环境具有与 GNOME 类似的功能特征。如果你想要更传统且轻量级的环境，这个可能更理想。它使用\
  \ GTK 工具包，安装了文本编辑器和图像查看器等程序。\n\n### Cinnamon – 创建它的开发者为 Linux Mint 发行版开发的。这是一种基于\
  \ GNOME 3 的图形界面的现代桌面环境。这种类型的环境也可以作为首选桌面环境用于 Ubuntu。\n\n### MATE – 这种类型由开源软件组成，免费使用并在\
  \ Linux 操作系统上运行。它的名字源于一种南美植物马。该社区的许多人支持 Mate Advanced Traditional Environment，使其成为\
  \ Linux 的免费桌面环境。这种桌面环境的优点是兼容旧、新版本的桌面。\n\n### Unity – 它由 Ubuntu 发行版背后的公司开发。该桌面环境的主要目标是改进在笔记本电脑上运行的屏幕空间。它的首次发布于\
  \ 2010 年，并随着时间不断不断改进。它与其他桌面环境不同，因为它使用了不同的用户界面。左侧是启动器，上方是 dash（控制面板）图标。对于新用户来说，很难注意到配置设置中哪里可以禁用或启用此通知。用户需要在网络浏览器中搜索以查看如何操作。这种桌面环境的一个缺点是它提供的用于自定义的默认工具很少。\n\
  \n# 文本处理\n\n文本处理是修改文本以适应我们需求的过程。对文档可以进行许多格式化操作。它们包括但不限于：将单词的每个字母更改为大写、可能文档中有一个拼写错误的单词，我们想要更改整个文档中该拼写错误单词的所有实例。\n\
  \n\n\n\n当我们手动编辑文档中的文本时，会变得非常疲惫；而且，我们无法消除人为错误的可能性。因此，找到一种方法，通过命令来轻松地修改文档中任何大小文本文件的文字是非常关重要的。Linux\
  \ 命令行就派上了用场，因为它允许用户输入单行命令行并在少于一个文档的时间内编辑整个文档。\n\nLinux 操作系统中的每一个命令都只能执行一项工作，且它只做那项工作，不做其他。Linux\
  \ 命令行工具可以像积木一样按照我们的意愿连接在一起，并利用命令行发挥优势。\n\n## Linux 在文本处理中的用途\n\n连接命令行的过程被称为“管道”（piping）。管道的符号是\
  \ `|`（始终记住它不是小写的 L 或任何其他字符，而是 `|`）。\n\nLinux 提供的另一个特性是使用直角括号 `>`。默认情况下，当我们在终端输入命令时，Linux\
  \ 操作系统会将命令显示在屏幕上。然而，当我们想要创建文件时，需要使用 `>` 重定向命令输出，后面跟着文件名。请注意，如果文件已经存在，它将被覆盖；因此，如果你不想让它被覆盖，追加文件就变得非常重要。为了追加文件，你需要使用\
  \ `>>` 将内容追加到文件中。在追加文件时，结果将保存在现有文件的末尾。注意，只有现有文件可以被追加。\n\n## 为什么要使用文本处理\n\n考虑这种情况：你正尝试访问一个网页，但你忘记了密码、用户名或两者都忘了。你可能需要尝试猜测密码或用户名。然而，密码通常是区分大小写的；因此，你可能需要尝试密码的多个版本以找到准确的密码。这个过程可能非常疲惫；因此，创建一个词列表来为我们提供各种版本的密码或用户名变得非常重要。\n\
  \nLinux 非常别有用，因为它可以帮助你生成各种词列表，你将使用这些列表来尝试你忘记的密码版本。请注意，未经许可访问他人的页面或系统是不符合道德的，不应该尝试，因为这可能会让你受到法律的制裁。\n\
  \n### 创建词列表\n\n以 Unix 和 Linux 这两个词为例。\n\n在这种情况下我们如何使用文本处理呢？\n\n在这种情况下，每个单词将单独占一行；使用这个例子，单词\
  \ Linux 将位于第一行。当使用单词 Unix 创建词列表时，你可能想尝试诸如 `Unix`、`UNIX`、`unix` 和 `Unix` 等密码。如果此时我们想对词文件中的每一行执行此操作，并将结果追加到我们的原始词列表中，那么词列表将比原始词列表大四倍，因此在创建此类文件时，考虑文件大小至关重要，因为它们的大小可能会达到\
  \ GB 甚至更多。\n\n### 解释\n\n例如，使用单词 Unix，有不同的组合，如 Unix（这里第一个字符是大写字母）\n\n* `UNIX` 所有字符均为大写\n\
  * `UNIX` 大写的可选方案\n* `unix` 小写的可选方案\n* 想一想单词 `UNIX` 会产生多少种选项，或者单词后面是否会有数字？\n\n##\
  \ 用于文本处理的七大 Linux 命令行工具\n\n* `vim` 命令 - 该命令是一个文本编辑器，可以在命令行模式或 GUI 模式下使用。Vim 非常强大，可以用于编辑任何类型的文本。vim\
  \ 的一个缺点是它的学习曲线非常陡峭。\n\n### vim 的特性\n\n* 在极低内存上运行。\n* 它支持非常多的文件和编码。\n* 它兼容所有 Unix\
  \ 系统。\n* `grep` 命令 - 该命令由于在大多数基于 Unix 的系统中运行速度快，是经常使用的命令之一。通过其他程序，`grep` 命令可以与其他程序配合以读取各种输入。在文件或标准输出中，`grep`\
  \ 可用于查找字符串或匹配正则表达式。\n* `sort` 命令 - 正如其所示，它用于对文件进行字母数字排序，因为它会按照特定顺序排列行。该命令默认按 ASCII\
  \ 排序文件。\n\n### sort 命令排序行的方式\n\n1. `sort` 命令一次排列一行。\n2. `sort` 命令程序按参数顺序排列的列表打印输入的所有行。\n\
  3. `sort` 命令支持按字母顺序、倒序、数字甚至通过口语方式对行进行排序。\n4. 该命令还可以忽略大小写，并返回行是否已排序的结果。\n5. 默认情况下，整个输入键被视为排序键，空格被视为字段分隔符。\n\
  \n### sort 命令的特性\n\n* 以数字开头的行将位于字母开头的行之前。\n* 首字母在字母表中出现靠前的行将放在首字母在字母表中出现靠后的行之前。\n\
  * 以字母表中靠前字母开头的行将位于以靠后字母开头的行之前。\n* 以大写字母开头的行将位于相同单词的小写字母开头的行之前。\n\n示例：\n\n假设你正在创建一个名为\
  \ `file.txt` 的文件。\n\n```bash\n$ cat > file.txt\n* Emailing\n* Client\n* command\n\
  * variable\n```\n\n使用 `sort` 命令对文件排序\n\n语法：\n\n```bash\n$ sort filename.txt\n```\n\
  \n命令：\n\n```bash\n$ sort file.txt\n```\n\n输出\n\n* Client\n* Command\n* Emailing\n\
  * Variable\n\n* `cut` 命令 - 此命令用于从文件中删除字符、字节和字段。默认情况下，该命令输出排序后的结果，而保持原始文件不变。在确定要剪切的文件时，会考虑各种参数。\n\
  * `uniq` 命令 - 该命令用于删除已排序行中的重复文本。因此，重复的行必须单独成行才能被识别和排序。此命令通常与 `sort` 命令配合使用。\n* `sed`\
  \ 命令 - 该命令根据 Unix 系统中使用 `sed` 语言编写的特殊命令来处理文本。`sed` 语言用于创建使用哈希或文件扩展的 `sed` 脚本。通常，`sed`\
  \ 用于替换文本。\n* `less` 命令 - 此命令用于在屏幕上缓冲输出。\n* `diff` 命令 - 这是一个简单的命令。它用于比较文本源，然后输出文本的差异。\n\
  \n### 网络管理\n\n网络管理是使用工具管理、运行和维护计算机网络的过程。网络管理主要关于数据传输通道的能力和效率。然而，网络管理没有精确的定义，因为它是一个广泛的主题。网络管理的主要领域包括\n\
  \n### 网络管理\n\n* 它涉及跟踪许多计算机资源，例如监控传输线路、集线器、交换机、路由器和服务器。你可以监控性能并更新相关的软件——主要是网络管理软件、网络操作系统以及网络用户分发和使用的应用程序。\n\
  \n和其他任何操作系统一样，你需要连接到网络。它可以是你的互联网服务提供商网络、公司网络甚至是 WiFi。然后你将需要学习如何将 Linux 连接到网络。\n\n\
  ### Linux 网络接口\n\n有不同的 Linux 版本，它们对网络的命名也不同。通常，所有 Linux 都会有以下接口。\n\n\n\n\n## 回环接口\
  \ (Loopback)\n回环接口 (`Lo`) 始终有一个 `127.0.0.0` 的 IP 地址，代表主机。例如，你想访问运行在当前同一台服务器上的网页，这时你需要在浏览器中输入\
  \ `HTTP:127.0.0.1`。\n\n## 以太网 (Ethernet)\n以太网 0 (`eth0`) 接口基本上是局域网连接。在虚拟机上运行 Linux\
  \ 时，你仍然需要连接到主机的物理网络接口。通常，你需要检查以太网是否具有 IP 地址，以及 `eth0` 是否处于 `UP`（开启）状态。\n\n### MAC\
  \ 地址\n介质访问控制 (`MAC`) 是分配给数据链路层第 2 层网络的标识符。网络接口必须有一个 `MAC` 地址，这通常被称为硬件地址。`MAC` 地址在制造时总是会被分配给任何适配器；如果是虚拟适配器，则该地址在创建时分配给适配器，并始终表现为六组、每组两个十六进制数字。上述解释的以太网接口的\
  \ `MAC` 地址被称为以太网地址（ether address）或链路地址（link address）。\n\n### IP 地址划分\n所有设备的 IP 地址在特定网络上都是唯一的；因此，每个设备至少有一个地址。`IP`\
  \ 地址通常位于 `1.1.1.1` 到 `255.255.255` 之间。\n\n### 示例 1\n要查看所使用的 IP 地址，你将输入 IP 地址命令，如下所示：\n\
  \n```\n<LOOPBACK,UP,LOWER_UP>  6536 qdisc noqueue state UKNOWN group default\nLin/loopback\
  \ 00.00.00.00.00.00 brd 00.00.00.00.00.00\ninet 127.0.0.1/8 scope host Io\nvalid_Ift\
  \ forever preferred_If forever\ninte 6::1/128 scope host\nvalid_Ift forever preffered_Ift\
  \ forever\n```\n\n每个熟悉 Linux 的人都听说过一种 Linux 网络工具，即 `ping`。它起初是一个缩写词，现在已成为一个正式单词，并且是测试网络连通性最常用的工具。\n\
  \n### Ping 如何工作\n`ping` 通过向网络发送互联网控制消息协议 (`ICMP`) 包开始；然后它会在有响应时通知你。如果主机能够连接到网络，它将发送\
  \ `ICMP` 成功响应。然而，如果用户无法连接到网络，它将发送 ping 测试失败。\n\nLinux 在故障排除过程中使用的另一个工具是 `traceroute`。`traceroute`\
  \ 通常探测本地系统与目标之间的网络；因此，它会收集有关路径上所有 `IP` 路由器的信息。当路径出现问题时，`traceroute` 非常有用，例如网络问题导致中间节点响应缓慢，此时你可能想知道是哪个节点响应缓慢。\n\
  \n## 动态主机配置协议 (DHCP)\n如果你的网络中有数十、几千个甚至无限数量的计算机会怎样？尝试分配并跟踪每台机器拥有哪个 IP 地址将非常耗时。这就是\
  \ `DHCP` 发挥用场的时候了。它会在主机或设备实际连接到特定网络时获取其 IP 地址。然而，`DHCP` 通常用于不会因服务器系统动态 IP 地址变化产生副作用的设备。管理员可以创建\
  \ `DHCP` 预留或手动配置静态 IP 地址，以确保连接到网络的每个网络适配器在连接时始终获得相同的 IP 地址。\n\n### DNS (动态域名系统)\n\
  互连的计算机大多数使用 IP 地址相互连接。要记住互联网上所有需要连接的内容将是非常困难的。想象你想连接到 `google.com` 甚至 `facebook.com`，那么每次你想在网上搜索它们时，都必须记住\
  \ `google`、`facebook` 或任何其他网站的 IP。访问将变得非常混乱。`DNS` 派上了用场，因为它用于将网页映射到我们可以轻松记住的特定 IP\
  \ 地址。\n\n## 网络统计与计数器\n在进行故障排除过程中，回答问题至关重要。首先，接口是否正在发送它需要传输的数据？如果没有发送，是否在发送某些错误？最后，是哪个进程在发送所有流量？\n\
  \n在涵盖了如何查看网络信息之后，我们需要知道如何设置一些常见的网络配置。\n\n### 进程\n从更改 IP 地址开始。注意，在 Linux 中进行更改时，你有两种类型的更改：\n\
  - 立即生效但不持久的更改。一旦你重启操作系统，这些更改将不再生效。\n- 重启电脑后仍然有效的更改。\n\n要对 IP 配置进行即时生效的更改，你需要使用 `link`、`route`\
  \ 和 `address` 命令选项。然而，你需要在 Linux OS 上安装 `iproute2` 软件包。默认情况下，该包通常是预装的，但很大取决于你正在使用的操作系统版本。\n\
  \n## 网络接口绑定 (Bonding)\n你可能需要比单个接口提供的更多的带宽。否则，你可能会遇到网络问题，或者你可能想要某种形式的风险冗余。风险冗余根据供应商不同有许多名称，例如\
  \ `EtherChannel`、`VMware`、`PortGroups`、`bonds` 以及聚合组只是其中一角。Linux 也提供了此类功能并命名为 `bonding`。绑定允许用户创建一个逻辑网络，稍后与多个逻辑网络连接，然后扩展添加更多接口，从而提供负载均衡和防止接口故障的保护。使用\
  \ `bonding` 特性需要通过 `modprobe` 命令安装内核模块，因为 `modprobe` 命令将帮助为 Linux 内核添加额外功能。\n\n\
  ### 基础 Linux 网络绑定模块\n- `Balancer rr`：默认的轮询绑定，提供容错能力和负载均衡。\n- `Active back up`（主备模式）：该模块提供容错能力，一次有一个从机处于活动状态，发生故障时由另一个从机接管。\n\
  - `Balance xor`：基于哈希，提供容错和负载均衡。\n- `Broadcast`（广播）：通过在从机接口上传输数据提供容错。\n- `802.3ad`：为任何具有相同速率的链路创建聚合组，以提供负载均衡和容错。其标准动态链路是\
  \ `IEEE.802.3ad`。`802.ad` 是常见的绑定类型，它使用 `LACP` 与另一端的绑定口进行通信。\n- `Balance tbl`：在没有特殊交换机支持的情况下自适应传输负载均衡。\n\
  - `Balance alb`：这是一种自适应负载均衡，由于使用了 `ARP`，它不需要特殊的交换机支持。\n\n\n\n\n\n# 引言\n\nLinux 操作系统自带\
  \ 300 多种预装工具，你可能在黑客攻击过程中需要这些工具，而其他的 Linux 工具可以轻松从网上下载。通过 Linux，只要你知道如何使用这些工具以及如何根据你的需求操纵它们，黑客攻击过程就会变得简单。\n\
  \n# 在开始黑客操作之前你需要了解的知识\n\n黑客攻击是一门艺术，因此需要多年的实践才能完全精通，并学会如何处理针对系统的各种攻击。在开始练习黑客操作的过程中，对黑客一无所知也没有关系。但请注意，一个拥有计算机常识但没有编程知识的新手是非常危险的。因此，为了成为黑客专家，你需要在实践中付出大量努力。\n\
  \n# 开始 Linux 所需的条件\n\n对于没有任何知识的初学者，你首先需要访问 Kali Linux 官方页面，然后关于 Linux 系统的基础知识。然后访问他们的下载页面并下载\
  \ Kali Linux iOS 文件。在开始之前，你需要了解如何安装最新版本的 Kali Linux 操作系统。下面的步骤将显示如何安装它。\n\n## 安装\
  \ Kali Linux\n\n你有两种方法可以安装 Kali，例如使用 USB 安装到硬盘上，以及使用 VMware 安装。我们的重点是后者：\n\n###\
  \ 在 VMware 中安装 Kali Linux\n\n**第一步**\n首先，你应该识别你电脑的性能，是 64 位还是 32 位。如果你的电脑是 64 位的，那么你需要\
  \ 64 位版本。如果你不确定电脑的版本或它是 32 位的，那么你需要 32 位版本。\n\n**第二步**\n然后你通过浏览器的下载管理器点击 ISO 或点击种子（torrent）来下载\
  \ Linux。强烈建议使用种子，因为它速度更快。下载完成后，创建一个虚拟机。\n\n**第三步**\n在出现的窗口中选择安装程序磁盘映像文件（`ISO`），然后在浏览部分选择\
  \ Kali Linux ISO 文件。选择后，点击“下一步”。\n\n**第四步**\n在出现的工具箱中，为你的虚拟机选择一个标题。你可以使用如 `Virtual\
  \ kali` 的名称。你还应该为它选择一个位置。建议在我的文档中将该文件夹命名为 `Virtual machines`，然后点击“下一步”。\n\n**第五步**\n\
  下一步是设置 Kali 的最大容量，不应小于 20 GB。不过，建议你使用 30 GB，因为 Kali 会随着时间的推移而扩大。选择 Kali 的容量后，在下一个选项中更改为将虚拟磁盘存储为单个文件，然后点击“下一步”。\n\
  \n**第六步**\n在出现的窗口中，点击“自定义硬件”选项按钮对某些硬件设置进行自定义。\n\n**第七步**\n现在，会为你呈现一个硬件设置窗口。在左侧窗格中选择“内存（Memory）”，然后在右侧窗口中将滑块滑动到至少\
  \ 512 MB。请注意，你分配给虚拟机的最大内存不应超过已安装内存的一半。例如，如果你的电脑有 8 GB 内存，那么滑块给出的最大值应为 4 GB。在左侧面板中，高亮“处理器（processors）”。该选项很大取决于你电脑的处理器。如果你的电脑有多个处理器，那么你应该选择多个处理器以获得高效性能。在左侧，点击“新建适配器（New\
  \ Adaptor）”，然后在右侧将圆点移动到桥接（顶部）选项并点击“适配器（Adapters）”按钮。系统会自动弹出一个小窗口，你可以在其中取消除网络适配器之外的所有选项，然后点击“确定（OK）”。在硬件设置底部，关闭，然后在向导中点击“完成（Finish）”。\n\
  \n**第八步**\n一旦你点击完成按钮，新的虚拟机将添加到虚拟机库中。启动 Linux 以进行安装。在右侧面板中高亮创建的虚拟机名称以完成安装。\n\n**第\
  \ 9 步**\n在出现的启动菜单上，使用向下箭头滚动到“图形化安装（Graphical install）”并按回车。\n\n**第 10 步**\n选择你偏好的语言；使用鼠标或方向键滚动，然后按回车。\n\
  \n**第 11 步**\n在随后出现的屏幕上选择你的位置并点击“继续（continue）”。\n\n**第 12 步**\n系统将询问你的键盘布局，例如，你可以选择阿拉伯键盘。注意这将取决于你理解的语言。\n\
  \n**第 14 步**\nKali 将删除你电脑上的硬件，然后点击“继续”，但先不要配置网络。\n\n**第 15 步**\n你将设置计算机主机，它将作为你的计算机名称。点击“继续”。\n\
  \n**第 16 步**\n在下一个窗口中，为主主账户设置你偏好的 root 密码。然后确认输入的密码并点击“继续”。\n\n**第 17 步**\nLinux\
  \ 现在将确定磁盘分区，然后将向你显示一个对话框，选择第一个选项并继续，确保所有文件都在一个文件中并点击继续。通过选择“完成分区（Finish partitioning）”确认要进行的更改，并更改磁盘并确认更改。操作系统现在将安装，可能需要长达\
  \ 30 分钟。\n\n**第 18 步**\n在询问网络镜像（network mirror）时，选择“否”。\n\n**第 19 步**\n安装程序将询问是否安装\
  \ `GRUG` 并接受它。此时安装过程已完成，并将显示成功通知。\n操作系统将重启，然后你就可以使用密码登录了。\n\n## 存储管理\n\n存储管理是指管理存储设备的过程。Linux\
  \ 有许多工具可以管理存储驱动器和硬件设备。Linux 在存储管理方面执行：\n\n### 内存管理\n内核允许进程在需要时访问内存，因为它拥有系统内存。\n\n\
  ### 设备管理\n内核允许进程访问外围设备。\n\n### 任务管理\n内核允许应用程序执行。它在软件和硬件之间进行上下文切换。\n\n### 存储管理方法\n\
  - 提供将 LUN 回到所需路径的选项\n- 监控并在路径变化时通知\n- 提供多路径设备重映射命名的自定义选项\n- 提供基于策略的路径和分组，供用户通过定义路径自定义\
  \ I/O\n- 促进路径之间的负载均衡\n\n## 块存储\n\nLinux 内核中的块存储仅仅是块设备的同义词。块设备是任何存储数据的硬件设备，如闪存内存、固态硬盘（`SSD`）和机械硬盘（`HDD`）。基本上，块设备在计算机中通常被称为磁盘存储。一旦设置，块设备将作为设备上当前文件系统的扩展，因此你可以在驱动器上读取甚至写入信息。\n\
  \n\n\n\n\n由于 `/dev/sda*` 和 `/dev/hd*` 设备文件代表了旧的驱动器分区方式，单独使用这些值时会成为一个劣势。当设备在启动过程中更改其节点时，会导致对哪个驱动器被分配了特定名称产生困惑，因为\
  \ Linux 内核在每次启动过程中都会决定哪个驱动器获得特定的名称。\n\n通过 `/dev/disk` 解决此问题，子目录对应于识别系统上分区和磁盘的定义方式。这些子目录包括在启动期间生成的符号链接，用于指向正确的\
  \ `/dev/(sh)da*` 文件。这些链接通常根据标识文件的目录命名。\n\n### `/dev/disk` 下的子目录\n\n- **按标签 (By label)**：文件系统必须有一种命名文件的方法，以便为特定的磁盘或分区分配名称。\n\
  - **按 UUID (By uuid)**：`UUID` 或通用唯一标识符是一段长字母数字字符串，可以作为存储设备的标识符。这些字符串人类无法读读，但保证在不同系统间是唯一的。极度建议使用\
  \ `uuids` 来引用可能跨越不同系统的存储设备，因为不会发生命名冲突。\n- **按分区标签和分区 UUID (By partlabel and by partuuid)**：`GPT`\
  \ 表通常有特定的标签，甚至是用于标识的 `UUIDs`。此目录的功能与前两个目录相似，但使用的是 `GPT` 特有的标识符。\n- **按 ID (By id)**：它们是动态硬件生成的目录，拥有其序列号和与之连接的硬件。\n\
  - **按路径 (By path)**：该目录完全取决于连接到系统的存储设备。然而，连接到不同的端口会更改目录的原始值；因此，它面临与按 id 模式类似的缺点。\n\
  \n### 挂载块设备\n\n位于 `/dev` 中的文件用于与系统的内核驱动程序通信。需要更多的抽象来使设备成为剩余空间的一部分。在 Linux 和类似的 Unix\
  \ 操作系统中，尽管涉及许多设备，系统仍表示为单一的统一文件树。在访问驱动程序的内容时，你从那里进行访问。有多种挂载选项可以更改挂载设备的行为。为了防止内容被修改，明智之举是以只读模式挂载驱动器。\n\
  \n使用文件系统层次结构标准，你可以将文件系统挂载到 `/mnt` 或其子目录下。然而，该层次结构对于在何处放置永久存储没有提供建议；因此，你可以将其挂载到 `/mnt`\
  \ 或 `/mnt` 子目录下。\n\n### 使用 `/etc/fstab` 创建永久挂载\n\nLinux 系统检查文件系统表 (`/etc/fstab`)\
  \ 来判断在启动过程中将挂载哪些文件系统以及哪些。除了具有 `system.mount` 单元文件的文件系统外，其他条目的文件系统将不会自动挂载。该文件系统非常简单，每行必须代表一个应该被挂载的文件系统。\n\
  \n### 复杂存储管理\n\n当我们想要灵活性、更高性能、额外的管理结构甚至冗余时，就会使用复杂的管理范式。\n\n 什么是 RAID\n\n它是独立磁盘冗余阵列。它允许对驱动器进行分类，并在以后将其作为一个单元进行管理，具有更多的功能，因为它使用了虚拟化技术，同时也属于存储管理。RAID\
  \ 阵列的特征始终取决于 RAID 级别。而 RAID 级别定义了阵列中磁盘之间的关系。级别还会影响组的性能和冗余。\n\n最常见的级别\n\n- **RAID\
  \ 0**：此级别表示驱动器拆分阶段。拆分意味着数据写入阵列，然后被拆分并随后分布在该特定组的各个磁盘中。它有优点，因为可以读取或写入。然而，它也面临缺点，单个驱动器的故障会导致整个阵列的数据丢失。这是因为没有单个磁盘包含足够的重建所需内容的信息。\n\
  - **RAID 1**：可用于制作某些数据的副本。例如，你有两个 2 TB 的硬盘；总而言之，你拥有 4 TB 的硬盘。在镜像模式中，你只能看到 2 TB 的逻辑硬盘。然而，在保存数据时，它会写入到两个驱动器上。磁盘最小数量必须大于两个，因为在其中一个驱动器故障时，你可以从另一块磁盘获取数据；从而确保数据不会丢失。\n\
  \n### RAID 1 的特性\n\n1. 它提供了故障容错能力。\n2. 重建通常很快。\n3. 它的性能通常很快。\n4. 可以在小型设备中使用。\n5.\
  \ 读取性能通常良好。\n6. 写入性能通常较慢。\n7. 将损失一半容量。\n\n- **RAID 5**：此级别通过部分分布工作，其中数据受到保护。它可以幸存单个驱动器故障，但如果超过一个驱动器故障，可能会导致大量数据丢失。RAID\
  \ 5 的特性\n\n1. 它具有出色的性能。\n2. 读取通常很快。\n3. 它提供了故障容错。\n4. 必须有一块磁盘处于校验状态。\n5. 可用于大规模、、备份。\n\
  6. 可以从所有驱动器重建校验位。\n\n- **RAID 10**：RAID 10 的特性与 RAID 5 相似，但不进行校验分布。它至少需要四个驱动器，以确保即使两个驱动器故障，数据也可以重建。RAID\
  \ 10 的特性\n\na) 读取性能良好。\nb) 性能较差。\nc) 它提供了故障容错。\nd) 重建从两个驱动器完成。\ne) 它可以用于长阵列。\nf)\
  \ 它用于大规模。\n\n基础磁盘知识对于了解如何设置 RAID 至关重要。\n\n文件系统\n\n在执行存储管理时，文件系统非常重要。决定哪个文件系统适合计算机取决于你想执行的计算类型。\n\
  \n文件系统的根目录包含目录和文件，位于顶端，由 `/` 表示。\n\n### 路径名的类型\n\n1. **绝对路径**：文件始终通过其绝对路径标识，该路径从根目录开始反向延伸。`/`\
  \ 在绝对路径中有两种不同的含义：\n   - 指定文件目录。\n   - 使用 `~` 缩写的主目录。\n   - 使用 `~` 缩写的用户用户名。\n2.\
  \ **相对路径**：相对路径从当前位置开始，与绝对路径不同。\n\n\n\n\n与 Windows 操作系统相比，Linux 系统更加灵活。然而，Linux\
  \ 的使用可能比 Windows 操作系统复杂。与其他操作系统相比，Linux 具有许多优势。Linux 有两个著名的特性，使其脱颖而出：Linux 内核和服务器平台。在某些情况下，Linux\
  \ 系统可以被认为拥有五个主要组件。\n\n### Linux 的五个主要组件\n\n-   **Linux 内核**：这是一项允许用户修改操作系统的特性。Linux\
  \ 操作系统可以被更改或定制以满足用户的特定需求。例如，大多数安卓手机和一些家电都使用 Linux 操作系统。这一特性允许工具开发者根据自己的需求对操作系统进行定制。\n\
  -   **服务器平台**：这意味着用户可以将操作系统作为构建其他操作系统的基础。因此，它为大多数设备制造领域的开发者和制造商提供了更好的选择。\n-   **Shell（外壳）和\
  \ GUI（图形用户界面）**：通过 Shell 和 GUI，用户可以与内核通信。用户使用 Shell 执行想要的功能。通过 Shell，用户可以向系统输入命令，内核将运行这些命令。\n\
  -   **系统实用程序**：系统实用程序包括个人在执行所需任务时使用的任何应用程序和程序。没有系统实用程序，管理设备将变得几乎不可能，因此它们是 Linux\
  \ 操作系统中不可或缺的一部分。\n-   **应用程序**：这些是用户可以用于各种任务的各种应用程序。这些是用户安装或上传到系统中并用于多项任务的程序。例如浏览器、需要时的杀病毒软件。它们大多从外部源引入，而不是系统应用程序那样预装的。\n\
  \n### 定制与灵活性\n\nLinux 作为一个多功能操作系统运行，可以根据定制服务不同的用途。然而，与其他操作系统一样，核心作用是连接用户与设备。Linux\
  \ 允许用户访问设备可能需要的任何服务。Linux 并不是一个程序或一组工具。当人们下载 Linux 操作系统时，它会带有其他被称为 `GNU programs`\
  \ 的程序。目前在使用的有许多不同的 Linux 发行版。然而，每种发行版都经过了定制以适应用户的需求。这些发行版保持开源状态，这意味着如果用户觉得它们难以使用或操作，可以对其进行修改或定制。\n\
  \n一旦下载了最适合自己的发行版，就可以下载免费应用程序供 Linux 使用。大多数程序与操作系统一样是免费下载的。一旦在设备上拥有了这些应用，就可以像任何其他操作系统一样使用它们。应用程序可以用于浏览互联网、玩游戏、使用办公套件等其他活动。如果你不喜欢操作系统的某些部分，可以对其进行定制以符合你的需求。因此，在\
  \ Linux 中，用户将通过切换各种特性来定制操作系统。Windows 操作系统不允许用户更改某些功能。因此，用户只能在现有的操作系统上添加第三方应用程序。Linux\
  \ 则允许用户使用他们想要的内容，并删除或替换操作系统中不需要的内容。这使得对于许多需要创建自定义操作系统的组织来说既简单又灵活。\n\n### 基础概念\n\n\
  可以说，Linux 操作系统为用户提供了操作系统的核心组件。从这些核心组件开始，用户将着构建自己的操作系统。这将通过用户添加或删除他们不喜欢的元素来实现。通过这种消除和替换的方法，用户最终能够定制或构建他们喜爱的操作系统。这是其他操作系统缺乏的特征之一。其他操作系统是完全开发好的，关于它们很少可以被更改或定制。这可以用建筑来最好的解释或说明。Windows\
  \ 操作系统通常向用户提供一整栋建筑，因此，很少东西可以被更改。然而，Linux 为用户提供了建筑的基础。用户可以从该基础开始构建他们想要的建筑。因此，在安装\
  \ Linux 操作系统后，用户将添加他们喜欢的应用程序，并按照他们偏好的设计定制桌面。\n\n### 核心特性\n\n### Shell\nLinux 最重要的特性之一是\
  \ Shell。它允许用户通过命令行向系统输入命令。在 Windows 中，Shell 是命令提示符。然而，命令行比命令提示符具有显著优势。虽然可以更改 Windows\
  \ 系统的功能及其某些特性，但用户可以使用命令行来改进 Linux 的功能。通过命令行，可以修改系统的工作方式。Shell 是黑客的基本工具之一，允许他们开发用于黑客的脚本和程序。\n\
  \n### 引导加载程序 (Boot Loader)\n引导加载程序是用户首先交互的 Linux 组件。当安装 Linux 时，引导加载程序会自动安装。大多数用户看不到它，但它一直在运行。当系统通电时，操作系统使用引导加载程序向用户开放。在某些情况下，用户可能在机器上安装了多个操作系统。当用户有多个操作系统时，引导加载程序允许用户选择使用哪一个。引导加载程序将打开操作系统并授予用户访问权限。引导加载程序是自动的，从系统开启的那刻到用户可以访问桌面和应用程序，它一直在为系统使用做好准备。\n\
  \n### 启动系统\n\n当人们想要使用 Linux 系统时，第一步是开启系统。开启系统意味着屏幕会亮起，引导加载程序将启动。引导加载程序加载设备中的系统。如果有多个操作系统，则允许用户选择一个来使用。选择后，引导加载程序将允许你输入密码（如果需要的话）。设备的成功打开和操作系统的加载将让用户能够访问设备的桌面。访问桌面可能是一个简单的任务，但\
  \ Linux 操作系统的桌面在不同设备之间是不同的。Linux 操作系统有许多桌面环境，改变了桌面的外观。\n\nLinux 和 Windows 之间非常不同。因此，建立这两个操作系统之间的差异有助于人们理解\
  \ Linux 是如何工作的。Windows 对大多数用户来说非常常见，可以作为一个很好的比较点。Windows 系统中的各种特性会被 Linux 系统中的其他变化元素所取代。\n\
  \n\n\n一个区别在于 Linux 拥有许多可定制的发行版。这与 Windows 不同，Windows 并没有变体。例如，Linux 拥有如 `kali`、`ubuntu`\
  \ 等根据用户需求定制的选项。Windows 只有 `windows 10`、`windows XP` 等版本以及其他变体。另一个区别出现在命令行中。所有的 Linux\
  \ 发行版都带有命令行，允许用户自定义操作系统。然而，Windows 的命令提示符仅允许执行有限的任务，而永远无法自定义操作系统。虽然运行和安装 Linux 的时间较短，但\
  \ Linux 可以运行非常复杂的任务。相比之下，由于一次需要安装许多项目，Windows 的安装时间会很长。\n\nLinux 只需要安装几个项目，并根据需要添加其他项目。由于自定义和添加内核，这使得安装过程变得复杂。在\
  \ Linux 中，更新仅在有需要或用户选择时进行。这确保了更新是稳定且易于安装的，因为可以逐部分更新。然而，Windows 更新需要一起运行，耗时更长。当它们全部安装失败时，操作系统的运行会受到严重影响。Linux\
  \ 操作系统很难被破解，使其更加安全。这与 Windows 操作系统不同，在 Windows 上，人们必须安装防病毒程序来避免病毒和恶意软件。Windows 中的恶意软件和病毒可能来自许多不同的地方，因此必须保持谨慎。\n\
  \n## 用于攻击的 Linux\n\n当人们谈论使用 Linux 进行攻击时，他们是以全面的的方式在讨论。这是因为有多个 Linux 发行版，每个发行版都有大量的黑客工具。这意味着有很多选项可以使用\
  \ Linux 进行黑客。然而，使用 Linux 进行黑客的过程对于每个发行版和每个工具来说几乎是相同的。因此，可以创建一个使用 Linux 进行攻击的过程概述。\n\
  \n学习如何使用 Linux 进行攻击的第一步是理解 Linux 操作系统。在 Linux 中，黑客拥有一个显著优势，形式为命令行界面。命令行界面与 Windows\
  \ 中的命令提示符类似的工具，允许用户编写脚本。然而，命令行的主要优势在于它可以根据用户需求进行定制。换句话说，用户对 Linux 操作系统的控制权比 Windows\
  \ 大得多。因此，意识到如何使用整个系统是学习如何用它进行攻击的重要一步。\n\n下一步是需要更多地了解网络知识。如果打算打破规则，就需要理解规则及其运作方式。因此，在学习如何黑客时，需要知道系统是如何工作的。网络涉及理解计算机如何交换数据以及它们如何工作。黑客攻击由理解网络及其过程组成，以便利用这些过程并获取信息链和交换的权限。\n\
  \nLinux 是黑客最亲的朋友之一。这是因为通过 Linux，黑客可以开发一个平台，通过该平台入侵系统和应用程序。因此，要使用 Linux 进行攻击，需要具备一些使用\
  \ Linux 的必要技能。人们需要开发帮助他们导航 Linux 系统的技能，并构建可以用于入侵系统的脚本。此外，Linux 拥有许多用于黑客的工具。拥有 Linux\
  \ 技能至关重要，以便能够恰当地使用这些工具。黑客还必须理解用于保护程序的各种安全概念。Linux 被用于开发这些程序的大多数安全防护。因此，通过理解 Linux\
  \ 系统，黑客将能够如何避免管理员在保护程序、应用程序甚至网站时所使用的这些安全陷阱。\n\nLinux 是可以学习编写脚本的最佳操作系统之一。这是因为为用户提供了许多语言来编写脚本。用户可以选择任何他们认为简单易懂的语言。Linux\
  \ 允许用户切换语言，而 Windows 则做不到。Windows 对不同的代码语言并不十分友好。因此，Linux 是学习编程语言的更好选择。用户可以使用 Linux\
  \ 发行版来学习脚本技巧。\n\n## 如何攻击以及你需要什么\n\n黑客攻击是利用计算机技能和软件来克服技术问题。当提到黑客一词时，大多数人会有不同的反应。有些人会觉得黑客是坏事，但事实并非如此。有多种类型的攻击，其中一种是伦理黑客。黑客攻击可以解决现代工作者遇到的任何问题。相比之下，它也被用于许多相反的活动，导致黑客攻击留下了负面声誉。然而，为了获取多种信息，学习如何攻击各种系统是至关重要的。一个人需要许多工具和技能来完成一次攻击。\n\
  \n### 要求\n\n1. Linux 操作系统-`这是运行攻击的平台。Linux 允许用户编写和实现各种程序，因此在黑客期间易于使用。操作系统可以是多个发行版，如\
  \ `Kali`、`Ubuntu`、`Backtrack` 等。\n2. HTML 编写知识-`超文本标记语言是计算机使用的主要语言，可以用于向网络发送指令。在没有编程知识的情况下，必须在\
  \ `HTML` 方面拥有专业知识。编写 `HTML` 的能力有助于编写代码。\n3. 基础编程知识-`大多数网站和应用程序都是基于程序的。编程是关于这些网站和应用是如何创建以及如何运行的知识。黑客攻击是打破这些平台的规则，入侵这些平台，因此必须知道规则。程序员在编程时使用各种语言，包括\
  \ `Python`、`Javascript` 和 `Java`。程序员使用的每种语言都为他们提供了一系列优缺点。\n\n一旦具备了要求，就必须遵循攻击的各个步骤。当级别被正确监控时，这将是一个简单的过程。这些步骤可以被称为阶段，共有五个阶段。阶段包括`侦察`(reconnaissance)、`扫描`(scanning)、`获取访问`(gaining\
  \ access)、`维持访问`(maintaining access) 和`清除踪迹`(clearing tracks)。\n\n1) 侦察- 在此阶段，人们需要收集关于他们正在攻击的平台的尽可能的信息。信息应分三部分收集，包括`网络`(network)、`主机`(host)\
  \ 和`涉及人员`。数据收集可以通过被称为`足迹探测`(footprinting) 的方法进行。可以是`主动足迹探测`(active footprinting)，包括通过与目标交互来收集信息。`被动足迹探测`(Passive\
  \ footprinting) 包括在不与目标交互的情况下收集目标信息。\n\n\n\n\n\n## 2) 扫描\n这涉及收集相关信息，这些信息可以用于获取访问权限。在扫描过程中，人们还将评估发现的哪些漏洞将用于利用，以确保黑客能够访问系统。扫描应该根据各种扫描类型进行。人们首先应该对网络和端口进行扫描，以更好地了解程序或系统。利用获得的想法来确定可能存在漏洞的地方。系统地进行扫描至关重要，这可以确保黑客不会遗漏任何扫描项。在当前阶段，有三种扫描，包括端口扫描、漏洞扫描和网络拓扑。\n\
  \n### 端口扫描\n在这种扫描中，黑客将寻找在目标上运行的服务、开放的端口和活动系统。\n\n### 漏洞扫描\n寻找目标中的缺陷，以便用于访问系统。一旦识别出这些缺陷，稍就可以进行利用。\n\
  \n### 网络拓扑\n涉及绘制拓图并了解目标的布局情况。例如，正在使用什么网络、路由器以及保护系统的防火墙。这些信息在黑客过程中和组织攻击过程中至关重要。\n\
  \n## 3) 获取访问权限\n黑客将尝试入侵系统。这可以通过各种工具实现。黑客还需要提升他们的权限，以便完成任务。\n\n## 4) 维持访问权限\n一旦黑客获得了访问权限，他们可能会被目标的安全系统踢出或锁定。黑客必须通过上传木马、根内核或恶意文件来维持访问权限。这可能会降低管理员的权限，甚至帮助黑客在管理员不知情的情况下保持连接。\n\
  \n## 5) 清除踪迹\n黑客可以被视为小偷或入侵者。在访问系统后，管理员将想要抓住入侵者。因此，黑客需要掩盖自己的足迹以避免被发现。这一步骤将涉及黑客修改系统日志，以删除他们访问网络的任何证据。如果黑客上传了任何文件或安装了任何应用程序，他们需要卸载它们，以确保管理员检测不到他们的存在。\n\
  \n上述阶段是攻击过程的基本概述。所有的攻击都遵循相似的过程。黑客可以根据自己的需求进行各种修改。例如，如果有人想证明或展示系统的弱性，他们就不需要清除踪迹。未能掩盖足迹将有助于管理员识别出有入侵者进入。一旦黑客渗透系统，他们就可以随心所欲。值得注意的是，在很多情况下，尽管黑客意良好，他们仍被视为系统的威胁。\n\
  \n## 黑客的 Python 脚本编程\n\n### Python 简介\nPython 是一种带有优雅语法的解释型语言，这使其成为许多领域中脚本编写和快速应用程序开发的卓越选择。它是一种动态类型编程语言。Python\
  \ 也更适合数据处理和重复性任务。它处理数据的能力非常适合黑客攻击。它拥有非常简单的语言和语法，黑客可以使用它来编写最好的脚本。它拥有庞大的数据库和许多库，允许用户访问攻击任何系统可能需要的大量信息。\n\
  \n此外，该语言语法简单，使其易于使用。专家们也倾向于使用它，因为人们不需要在语法上挣扎。这意味着学者可以轻松地使用 `python` 创建脚本。它的高性能也是它拥有海量用户的的另一个原因。\n\
  \n### Python 的应用\n1) 基于 GUI 的桌面应用程序\n    - 图像处理\n    - 游戏\n    - 图形设计应用\n    - 科学和计算应用\n\
  2) 操作系统\n3) Web 框架和 Web 应用程序\n4) 原型制作\n5) 企业和商业应用\n6) 语言开发\n\n`python script` 是用于开发\
  \ `python` 程序的文本文件。一旦人们有了 `python script`，他们就可以执行程序而无需反复重写。因此，`python script` 是开发应用程序必不可的一部分，因为它更有效。Python\
  \ 优于其他脚本语言，是因为它有许多简单的库。Python 既可以用于复杂的脚本，也可以用于简单的脚本，用于开发几乎任何用途的程序。派遣 NASA 使用 `python`\
  \ 为其应用程序编写脚本；这表明 `python` 可以完成各种任务。\n\n有几个原因导致大多数黑客倾向于使用 `python` 而不是其他语言。\n\na)\
  \ 语言简单——`python` 不仅容易学习，而且非常好用。这一优势使得在进行黑客攻击时它比其他语言更受青睐。学者以及执行各种变体任务的专家都可以 `Python`。\n\
  \nb) 高性能——`python` 已证明在不同用途下运行有效。Python 已被用于涉及长短脚本的程序，并在两者中都有用。这些高性能标准使其成为黑客的首选语言。\n\
  \nc) 广泛的社区和支持——Python 拥有庞大的用户群。用户可以帮助在使用过程中可能遇到的任何问题。大型社区确保了问题可以尽快得到解决。由于这个原因，大多数黑客将倾向于将\
  \ `python` 作为他们的编程语言。\n\nd) 巨大的市场——Python 为用户提供了巨大的机会池。使用 `python` 运行的程序不断创造需求。高需求导致黑客拥有许多职业机会。\n\
  \ne) 第三方模块的存在：Python 软件包索引 (`PyPI`) 拥有许多第三方模块，帮助 Python 与大多数其他语言和平台交互。这意味着 `python`\
  \ 可以在很多平台上使用，也确保了许多用户可以使用其脚本。\n\n在编写 `python script` 时，有多种方法。Python 脚本必须先编写后运行，这样它们才能变成程序。编写\
  \ `python script` 的第一种方法是通过文本编辑器中输入脚本。编写脚本后，稍将在 `Terminal` 上运行脚本。第二种方法是通过直接在 `Python`\
  \ 的交互式解释器中输入脚本。使用解释器允许用户直接在 `Terminal` 中输入命令。Python 是一门基础且成熟的编程语言，包含了安全的代码行使用，维护易于处理，系统调试也非常容易。它在全球范围内赢得了重要性，因为计算机巨头\
  \ Google 已将其作为其官方编程语言之一。\n\n### 使用 Python 编写脚本\n考虑到其拥的语法，使用 Python 编写脚本非常容易。这允许用户编写他们能够理解并能够执行的脚本。当使用\
  \ `python` 编写脚本时，由于语言非常简单，人们可以验证他们正在编写的内容。然而，用户能够理解并专注于避免他们可能犯的错误是至关重要的。\n\n使用 `python`\
  \ 编写脚本需要遵循一些步骤。\n\n\n\n\n\n## 1. 本地环境搭建\n在可以使用 Python 编写脚本之前，用户必须在电脑上安装 Python。在某些操作系统中，Python\
  \ 是预装的；在另一些操作系统中，则必须从其他来源获取 Python。用户要确定自己是否安装了 Python，需要打开终端窗口并输入 `python` 来确认是否已安装。不同的操作系统安装了不同版本的\
  \ Python，此步骤也允许用户识别所安装的类型类型。\n\n## 2. 获取 Python\n如果设备上没有安装 Python，则需要下载它。用户需要访问\
  \ Python 官方网站，在那里可以获取最新的源代码、新闻和文档。该网站不仅能帮助用户获取 Python，还能提供各种文档来指导如何使用 Python。\n\n\
  ## 3. 安装 Python\n安装并开始使用 Python 需要遵循几个步骤。当使用 Linux 操作系统时，用户将访问 Python 官方网站并以 zip\
  \ 文件的形式下载 Python 源码。下载完成后，解压文件，并在需要进行修改时编辑设置文件。下一步是运行 `./configure` 脚本。点击 `make`。然后点击\
  \ `make install`。\n\n## 4. 设置 PATH\n路径是操作系统搜索可执行文件的目录。可执行文件是代码的重要部分，因此用户有机会定义如何获取它们。在每个操作系统中，添加目录的方法都是不同的。在\
  \ Linux 中，必须遵循以下步骤将 Python 目录添加到路径中：\n\n- 在 `csh` shell 中 —— 输入 `setenv PATH \"\
  $PATH:/usr/local/bin/python\"` 并按回车。\n- 在 `bash` shell (Linux) 中 —— 输入 `export PATH=\"\
  $PATH:/usr/local/bin/python\"` 并按回车。\n- 在 `sh` 或 `ksh` shell 中 —— 输入 `PATH=\"$PATH:/usr/local/bin/python\"\
  ` 并按回车。\n- 注意 — `/user/local/bin/python` 是 Python 目录的路径\n\n## ### 使用 Kali Linux\
  \ 进行 Python 脚本\n一旦用户打开电脑并确认其运行的是 Kali Linux，你就需要确认正在使用的 Python 版本，以便开始编写脚本。在开始 Linux\
  \ 编写脚本之前，需要遵循以下步骤。\n\n1. 验证 Python 版本。要做到这一点，用户需要点击桌面上的终端。下一步是在终端中输入 `python` 单词，计算机将响应已安装的\
  \ Python 语言名称。过程如下所示。\n\n```\nUsername: -$ python\n<Python version> <date> <time>\n\
  ```\n\n2. 继续测试 Python 是否正常工作。可以通过运行一个你已经熟悉的 Python 简单脚本来测试。也可以进行如下的算术测试。只需在屏幕上输入你的文本：\n\
  \n```\n>>> 20+40 然后按回车键\n60\n```\n\n求和结果将显示在终端上。\n\n用户可以继续对 Python 进行其他测试以确定其功能。\n\
  \n3. 关闭测试以开始脚本。关闭脚本仅需运行如下命令：\n\n```\n>>> exit( )\n```\n\n4. 当用户想要使用预构建的软件包时，可以访问\
  \ Python 索引官方网站并选择他们在黑客攻击中将使用的包。\n\n5. 一旦包安装完成，就可以继续运行并输入他们的脚本。理解 Python 脚本中应使用的语法至关重要。然而，这种语法非常简单。\n\
  \n在终端中输入 Python 看起来如下：\n\n```\nIn [1]: print “call user.”\nCall user\n```\n\n用户用于帮助插入命令并在\
  \ Python 上运行它们的特定单词被称为语法。例如，使用单词 `print` 来请求程序显示某些词。因此，用户在编写脚本时能够理解语法至关重要，因为它们确保了脚本以后是可以执行的。\n\
  \n- `Print()` - 用于显示程序输出的函数。\n- `Range()` - 返回整数列表，其序列由传递给它的参数定义。\n- `Sets` - 集合是唯一但无序的项目集合。\n\
  - `Str()` - 允许用户将变量的内容表示为字符串。\n\n## ### 管理 Linux 内核模块\nLinux 内核是 Linux 操作系统的核心部分。它负责操作计算机和硬件。内核有两种类型，包括微内核和单内核。微内核负责操作系统的功能，管理内存和\
  \ CPU 时间。单内核负责设备驱动程序。当两种类型结合并协同工作时，它们有助于管理操作系统以及硬件的操作。Linux 操作系统中的模块是操作系统根据需要加载或卸载的代码段。这些模块的功能是帮助在不关闭整个系统的情况下扩展操作系统的功能。\n\
  \n从 Linux 中加载和移除模块的能力是该操作系统最大的优势之一。这是因为这有助于减小 own 体积。如果没有加载或移除模块的能力，意味着操作系统将带有系统来帮助完成基础内核中加载的任何预期功能。加载模块会导致内存浪费，由于用户的需求不同，这些功能对某些用户来说是无用的。Linux\
  \ 有三个主要的内核模块：文件系统驱动程序、设备驱动程序和系统调用。\n\n人们倾向于编译自己的内核的一个主要原因是某些驱动程序（以及其他内核功能）需要补丁。有时，某些内核功能可能会损坏。在这种情况下，补丁可能需要用户开发自己的内核。另一种人员可能开发内核的情况是他们需要更新驱动程序或使用新的驱动程序。这可能导致开发新内核。编译自己的内核意味着这个人将删除某些内核并构建新内核。移除旧内核并替换为新内核的过程意味着系统得到了优化。在许多情况下，优化可以为用户带来更快的系统。然而，这只是优势，而不是构建和替换内核的原因。\n\
  \n### 插入模块\n仅三个内核的存在导致添加更多内核来增强功能。在标准的 Linux 操作系统中，模块存储在 `/lib/modules//kernel/`\
  \ 目录下，并具有 `.ko` 扩展名。要将模块插入内核，应使用 `insmod` 命令。用户只需输入语法 `insmod <module_name>.ko`。\n\
  \n例如：\n```\n# insmod /lib/ modules/ 4.4.0-21-generic /kernel/ drivers/cpufreq /SpeedStep-\
  \ lib.ko\n```\n\n### 移除模块\n有时，用户可能决定某些模块在当时没有用。因此，他们需要从内核中移除它们。要从内核中移除模块，用户需要使用\
  \ `rmmod` 命令。`rmmod <module_name>.ko` 是移除模块的语法。然而，必须注意的是程序正在使用的模块无法移除。\n\n例如：\n\
  ```\n# rmmod /lib/ modules /4.4.0-21-generic /kernel/ drivers/ cpufreq/ speedstep-lib.ko\n\
  ```\n\n### 创建并加载内核模块\n用户可以创建并将新内核添加到他们的操作系统中。创建新内核是一个简单的过程。以下是创建内核过程中要遵循的步骤。\n\n\
  1. 添加头行。添加头行的通用格式如下。\n\n```c\n#include <Linux/ kernel.h>\n#include <Linux/ init.h>\n\
  #include <Linux/ module.h>\n```\n\n\n\n\n## 2. 下一步是包含对正在创建的模块的描述，以及内核作者的详细信息。许可证在此部分也至关重要。这一步骤通过赋予模块名称、指定作者和许可证，帮助明确正在创建的模块。此部分遵循的通用格式如下。\n\
  \n```\nMODULE_DESCRIPTION(\"Kernel module 2\");\nMODULE_AUTHOR(\"Author Name\");\n\
  MODULE_LICENSE(\"GPL\");\n```\n\n## 3. 在完成上述步骤后，用户可以在加载模块之前编译内核模块。模块的编译通过两个文件完成：`Kbuild`\
  \ 文件和 `Makefile`。当此过程完成后，内核即准备就绪。\n\n## 4. 最后一步是插入模块。插入过程涉及使用 `insmod` 命令\n\n# 为什么\
  \ Kali Linux 是初学者的最佳选择\n\nKali Linux 是一种基于 Debian 的 Linux 发行版，主要用于高级渗透测试以及应用程序和网站的系统安全审计。Kali\
  \ 拥有数百种工具，用于执行各种信息安全任务，例如法证调查、渗透测试和逆向工程。Offensive Security 是信息安全行业的领先公司，也协助信息安全方面的培训。该公司开发并维护\
  \ Kali Linux 发行版，该发行版对于程序和网站安全的维护至关重要。Kali Linux 于 2013 年 3 月 13 日发布。Kali Linux\
  \ 是一个对 BackTrack Linux 全面重制的 Linux 发行版。对于初学者来说，首选 Kali Linux 是因为它与其它发行版相比具有多个优势。\n\
  \n### Kali Linux 的优势\n\n### 渗透测试工具\nKali Linux 加载了 600 多种渗透测试工具。作为初学者，可能不知道哪种是渗透测试的最佳工具。因此，凭借全方位的设备，黑客可以挑选一个他们觉得易用的工具。\n\
  \n此外，丰富的工具集合允许用户可以使用多种工具来执行测试。使用各种工具允许黑客建立尽可能多的弱点进行利用。对于初学者来说，漏洞越多对黑客就越有利，因为这让工作变得更简单。因此，Kali\
  \ Linux 在提供更多渗透工具方面具有显著优势。\n\n### 免费使用\nKali Linux 免费使用。Kali Linux 的开发者开发它是为了让任何人访问。各种操作系统的费用意味着初学者可能负担不起使用这些操作系统。大多数初级黑客可能没有支付操作系统所需的高水平财务状况。\n\
  \n### 开源 Git 树\nKali Linux 的开源代码允许人们自定义操作系统。定制对于初学者来说是至关重要的，因为它允许初学者使用他们理解的操作系统。对于初学者来说，很多事情可能会让他们感到困惑；然而，如果他们可以自定义操作系统，他们就能轻松地理解这些流程。初学者可以调整软件包，以便开发出一个最适合他们使用的版本。随着经验的增加，用户还可以进行更改，以适应他们对操作系统新水平的理解。\n\
  \n### 安全环境\nKali Linux 操作系统的开发方式在用户获取和使用过程中都能保护用户。初学者可能不懂如何保护自己免受某些威胁，因此 Kali Linux\
  \ 团队可以保护他们。\n\n### 广泛的无线设备支持\n某些 Linux 发行版对它们可以安装的硬件限制非常刻板。但 Kali Linux 并非如此。该系统的开发和定制使其适用于多个平台上的多个用户。初学者可能没有用于用于某些发行版的精细硬件，但\
  \ Kali Linux 操作系统允许用户通过多个无线设备访问它。\n\n### 多语言支持\n初学者学习黑客面临的障碍之一是他们可能找不到支持他们母语言的操作系统。然而，Kali\
  \ Linux 支持更多语言。虽然某些操作只能用英语完成，但它允许用户使用母语言进行某些操作。适应更多语言使得黑客更容易学习如何在系统周围进行操作。\n\n###\
  \ Kali Linux 是安全的\nKali Linux 提供了一个威胁极小的安全环境。这意味着用户不需要担心恶意软件、间谍软件、蠕虫甚至木马等风险。使用 Kali\
  \ Linux 甚至不需要在运行的同时使用杀毒软件。因此，这些操作系统让初学者能够学习黑客技术，而不会有被黑客攻击的高风险。这是一个巨大的优势，因为它能保护用户免受黑客生活中可能出现的威胁。\n\
  \n### 快速且稳定\n在黑客攻击中，系统的稳定性非常重要。例如，某人已经黑入了另一个系统，但在他们完成目标之前，系统崩溃了。系统不稳定或运行缓慢是令有抱负的黑客感到沮丧的问题之一。然而，Kali\
  \ Linux 操作系统确保黑客在黑客过程中免受系统崩溃或失败的影响。速度对于黑客来说也至关重要。黑客行为更多是一场与时间的竞赛。在完成攻击之前花费的时间越长，被发现的概率和风险越高。因此，黑客会更倾向于使用快速操作系统以避免被发现。Kali\
  \ Linux 为黑客提供了速度，因此是黑客的朋友。\n\nKali Linux 的这些额外优势使其易于使用。新增的功能让初学者不仅易于制定自己的规则，还能在黑客过程中为他们提供帮助。因此，Kali\
  \ Linux 操作系统是初级黑客使用的最佳选择之一。\n\n# 为什么黑客使用 Linux\n\n### Linux 提供细粒度控制\n今天，大多数黑客倾向于使用\
  \ Linux 而不是 Windows 有几个原因。首先，Linux 允许黑对其对其进行最大控制。Linux 允许黑客进行细粒度控制，这意味着他们可以控制操作系统的每一个方面。与限制用户仅有特定水平控制权的\
  \ Windows 不同，Linux 为用户提供了完全控制权。黑客可以使用 `Python` 和 `BASH` 快速方便地编写操作系统。\n\n### Linux\
  \ 是开源的\nLinux 在几乎每个方面都与 Windows 不同。开源意味着 Linux 将源代码提供给用户，而 Windows 不是。因此，黑客能够操纵操作系统的源代码。用户可以更改源代码的这一事实使黑客能够成功黑入其他系统。\n\
  \n### Linux 是透明的\n黑客不仅要了解自己的操作系统，还要了解目标系统。Linux 的透明性允许黑客看到这一点。Linux 允许用户访问并操纵系统的大部分部分。黑客可以自定义操作系统的各个方面。Linux\
  \ 还为黑客提供了一个深度集成的命令行，比 Windows 提供的要强。Linux 为黑客提供最大安全性的事实使其对黑客更有吸引力。\n\n### Linux\
  \ 允许定制\nLinux 允许用户根据偏好自定义桌面。对于偏好根据自己的需求定制系统的用户来说，Linux 是完美的。除了提供主题主题的选项外，Linux 还为用户提供了多种图标主题。\n\
  \n### Linux 是可靠的\n\n\n\n\n\n黑客更喜欢 Linux 而不是 Windows，因为它具有极高的可靠性。与需要不断重新安装的 Windows\
  \ 不同，Linux 不需要这些。Linux 允许流畅运行，并允许系统比 Windows 运行得更久。Linux 不会因为软件安装等原因让黑客频繁重启系统。另一个让\
  \ Linux 更可靠的事实是，像 Facebook 这样的 Web 服务器在使用它。\n\n## Linux 是免费的\nLinux 对所有公众免费开放，使其更适合所有黑客。Linux\
  \ 不需要向用户收取任何费用。黑客可以自由访问 `Fedora` 和 `Ubuntu` 等 Linux 发行版。黑客在 Linux 上几乎不需要花费任何费用，因为在使用软件之前不需要购买任何许可证。Linux\
  \ 拥有通用许可证，为黑客节省了大量的资金。大多数黑客工具也是为 Linux 用户编写的，让他们的工作更加舒适。\n\n## 易于维护和多任务处理\nLinux\
  \ 易于使用和维护。黑客只需要安装软件即可开始使用。Linux 有自己的软件仓库，这使得使用变得更加舒适。在使用此服务器时，黑客可以访问嵌入式系统以及高性能应用程序。Linux\
  \ 允许用户执行多个任务。Linux 不会因为“过度工作”而出现挂起或冻等问题。与 Windows 相比，系统允许用户运行尽可能多的程序而不相互影响。Linux\
  \ 还免于可能减慢黑客活动的处理缓慢等问题。\n\n## Linux 网络友好且易于安装\n几乎所有的 Linux 发行版都是用户友好的。Linux 发行版允许轻松安装操作系统。这些发行版还为黑客提供了友好的软件。与其他系统相比，Linux\
  \ 还具有快速的启动系统。所有黑客都需要更快的网络以便在最短时间内完成活动。Linux 允许黑客使用各种命令测试他们的网络。Linux 不仅快速，而且足够可靠，允许访问比其他系统更快的网络。\n\
  \n## Bash 脚本\nBash 取自于缩写 Bourne Again Shell。Bash 是一种带有语法的命令语言。Bash 使用自然人类语言来拟定命令。Bash\
  \ 还具有其他额外功能，如迭代、作业控制、字符串处理、函数、扩展等。这些 Bash 特性的每一个都允许最大程度的控制和维护以及批处理。Bash 解释并处理所有输入到\
  \ shell 的命令。Bash 构系统管理以及整个系统开发的核心部分。脚本基本上是用户编写命令的地方。Linux 系统默认内置了 `bash`，这对黑客来说是一个额外的优势。Shell\
  \ 脚本涉及让 shell 解析并执行命令。Shell 脚本是 shell 被指派完成的程序。\n\nbash 脚本是计算机在运行时遵循的脚本。脚本告诉计算机在执行特定动作后要做什么或说什么。Bash\
  \ 脚本类似于剧本或表演，演员将遵循并说脚本所说的或要求他们做的事。Bash 脚本通常允许用户使用或输入任何可以在脚本中逐个使用或执行的命令。每天逐个执行命令可能是乏味的，而且会产生很多错误。因此，确保任务减少并使事务自动化至关重要。自动化不仅让事情变得更舒适，还减少了可能阻止程序运行的错误。因此，为了避免逐个执行命令的过程，使用了脚本。脚本将包含程序运行所需的所有命令并一起运行。\n\
  \n开发 bash 脚本只需要用户具有使用命令行的基础知识。该过程有三个步骤要遵循，如下文所示。\n\n### 创建 bin 目录\n这是一个存储可执行程序的子目录。这个\
  \ `bin` 充当创建的 bash 脚本的存储器或家。可以通过以下命令完成。\n\n```bash\ncd ~/\nmkdir bin\n```\n\n###将\
  \ bin 目录导出到 PATH\n```bash\nexport PATH=$HOME/$USER/bin:$PATH\n```\n将 `bin` 添加到 `PATH`\
  \ 允许用户轻松找到程序。将你的 bin 目录添加到路径。编辑你的 `.bashrc` 文件（或可用文件）将 `~/bin` 添加路径。将可执行文件复制到此 bin\
  \ 目录，或从用户 bin 目录向你想使用的可执行文件创建符号链接。\n\n### 创建 bash 脚本\n创建 bash 脚本时，他们需要告诉计算机他们正在创建一个\
  \ bash 脚本。实现这一点的方法是通过 `#!/bin/bash`。此命令将通知计算机正在制作 bash 脚本。之后是用户想要让程序显示的命令。编写脚本时应使用特定的语法。例如，当用户希望在程序运行时显示某些内容时，他们将使用\
  \ `echo` 语法，后面跟上引号中他们想说的内容。例如，你想让程序在脚本运行后显示 welcome 一词；你可以输入以下内容：\n\n```bash\necho\
  \ \"welcome.\"\n```\n当程序运行时，它将在屏幕上显示 welcome 一词。为了在程序响应和下一个动作之间输入时间，将使用 `sleep`\
  \ 语法，后面跟着他们想要暂停的时间。例如 `sleep 5`，该命令意味着程序将在执行下一个命令之前始终暂停五秒。完成后，只需按 `CTRL + X` 退出，并将要求根据你给程序命名的保存文件。需要注意的是，bash\
  \ 脚本可以非常长。脚本的大小取决于用户希望程序自动运行而无需用户参与的同时活动数量。例如，当按下计算机上的关机按钮时，计算机运行 bash 脚本，允许它在关电之前保存所有工作并关闭运行中的应用程序。所有这些活动都遵循\
  \ bash 脚本，计算机上的许多应用程序和操作也是如此。\n\n一旦人员保存了 bash 脚本，他们必须使脚本变得可执行。这涉及将脚本模式更改为可执行版本。更改模式将涉及用户输入以下内容。\n\
  \n```bash\nchmod +X <name of the file>\n```\n在此之后，用户将输入\n\n```bash\n./<name of the\
  \ file>\n```\n一旦按下回车，脚本将根据其输入和执行的方式运行。bash 脚本还将包含更多语法和命令，这些有助于压缩许多手动运行但可以自动运行的命令。这将确保用户不需要做太多，而是由程序自动运行。因此，bash\
  \ 脚本为程序提供了一定程度的自动化。\n\n### 变量\nbash 脚本中的变量对于完成整个脚本至关重要。用户必须分配变量并赋予含义。例如，可以给字母 `X`\
  \ 分配一个变量。在脚本中，将输入如下内容。\n\n```bash\n#!/bin/bash\nX=\"1.\"\n```\n变量意味着当用户在代码中插入特定变量时，建议分配给它的值。这有助于缩短脚本中的单词数。检索变量涉及在终端上输入变量和\
  \ `echo` 语法。该过程如下。\n\n```bash\necho $X\n```\n\n\n\n\n# 语法以及脚本开发中使用的符号至关重要。如果未能使用正确的符号和语法，将导致程序结果不符合预期。因此，确保语法和符号正确至关重要。例如，如果忘记在想要获取的变量之前放置\
  \ `$` 符号，程序将给出不符合预期的结果。因此，在编写脚本时应格外小心，否则错误会导致程序无法运行。避免脚本中的错误涉及对已完成的脚本进行持续测试，以确保它们运行正常。对脚本进行校对也至关重要，这可以确保脚本正确、语法正确，甚至拼写也是正确的。脚本中的任何错误都会反映在程序中。例如，\n\
  \n```bash\n#!/bin/bash\n\necho “welcome.”\n```\n\n而不是\n\n```bash\n#!/bin/bash\n\n\
  echo “welcome.”\n```\n\n这个错误将导致程序在启动时显示错误信息。程序将不会显示“welcome”，而是显示“welcome.”，因此在完成脚本后，校对脚本是一个至关重要的步骤，持续运行将有助于识别此类错误。\n\
  \n## 自动任务\n\n自动任务是指程序在没有任何人工干预的情况下自行运行的任务。用户并不一定需要输入任何命令来运行它们。例如，当打开程序时，用户必须启动它。随后的几个步骤和阶段是自动的。在大多数程序中，一旦运行，它们会首先显示“welcome.”。随后是一系列操作，例如收集信息，然后要求用户输入密码。所有这些动作都按照指定的时间间隔运行。在从欢迎消息到请求密码的所有这些动作运行期间，用户没有以任何方式进行干预。用户可能也没有向程序输入任何命令。因此，这些动作或任务是独立运行的。在应用程序运行后执行这些任务使得它们成为自动任务。一个动作会触发另一个或更多动作，以帮助减少用户必须执行的活动数量。自动任务也被称为调度任务，因为它们被设置为在其他事情发生后立即发生。在某种意义上，它们是由其他任务触发的。\n\
  \n## 在 Linux 上调度任务\n\n在 Linux 上调度任务就像为动作或任务准备并设置一个序列，以便它们在特定动作发生时自动启动。在 Linux 上，必须使用\
  \ `cron` 守护进程，它可以帮助在特定时间运行任务。当使用正确的语法将任务添加到 `crontab` 文件时，它们将按照之前的计划自动运行。在许多情况下，调度用于自动化备份、系统维护，甚至运行重复性任务。有时任务太多，用户无法单凭之力完成，因此它们将被自动化，以确保它们自行运行。\n\
  \n## 调度/自动化任务\n\nLinux 上的任务自动化遵循几个步骤来完成。步骤的执行方式如下：\n\n### 1. 打开 Crontab\n\n在这一步中，用户将在其计算机上打开终端。当终端打开后，用户将输入\
  \ `crontab -e`。此命令打开用户账户的 crontab 文件。在该文件中，命令根据用户的权限运行。如果想让命令在系统许可下运行，将使用 `sudo\
  \ crontab -e` 命令。此命令帮助用户访问 root 账户的 crontab 文件。系统可能会要求选择一个编辑器，在大多数情况下，选择 `nano`。在很多情况下选择\
  \ `nano` 是因为它最易于使用。只需输入编辑器的数字并按回车即可进行选择。\n\n### 2. 添加新任务\n\n打开 crontab 后，用户将使用翻页键（page\
  \ down）移动到文件末尾。从那里，他们可以调度自己的任务。在调度或自动化任务时，需要遵循特定的格式。设置任务开始的时间，使用以下格式：`minute (0-59)\
  \ hour (0-23) day (1-31) month (1-12) weekday (0-6) command`。在此命令中，必须注意在分钟和星期中，第一个是\
  \ 0，这意味着每周的第一天将被赋予 0，30 分钟将是 29，依此类推。星号 `*` 用于表示重复，可以代表任何值。例如，如果你想让命令在每天凌晨 12:30\
  \ 运行，命令如下：\n\n```\n29 0 * * * /usr/bin/ example\n```\n\n使用用逗号分隔的值来指定多次执行。例如，如下的一行：\n\
  \n```\n0,14,29,44 * * * * /usr/bin/ example2\n```\n\n将在每小时、每天的第 15 分钟处运行 `/usr/bin/example2`。确保将每个新任务都添加到新的一行中。\n\
  \n### 3. 保存文件\n\n一旦调度了任务，用户就可以按照他们的意保存它们。保存过程通过使用 `Ctrl - O` 然后按回车来实现。保存文件后，只需使用快捷键\
  \ `Ctrl - X` 即可退出。\n\n# 第 6 章：Web 攻击过程\n\n## Web 攻击\n\nWeb 攻击是全球范围内的一种普遍做法，主要目标是获取对网站数据的访问权限。虽然不可能攻击遇到的每一个网站，但人们可以攻击某些网站。攻击网站的困难程度取决于该网站的保护程度。因此，你会发现虽然有些网站很容易被攻击，但有些网站由于其安全级别而无法被攻击。网站上漏洞的存在便利了\
  \ Web 攻击。可以使用许多方法来攻击网站。某些黑客可能会使用跨站脚本（XSS）、SQL 注入等其他方法来攻击网站。以下是人们在攻击网站时可以遵循的步骤。\n\
  \n1.  分析网站的弱点或漏洞。网站在基础设施甚至在编程语言上都可能存在漏洞。黑客应该首先通过识别这些针对系统的弱点来开始网站 攻击，因为这些弱点将是进入网站的途径。\n\
  \n### 漏洞的类型\n\n网站中存在许多种类型的漏洞。每种漏洞都可以以其特定的方式被利用。网站中的漏洞越多，访问和控制网站就越容易。网站的一些潜在弱点如下文所示。\n\
  \n- **SQL 注入**：这可能是一段代码，用于帮助黑客上传、编辑、修改和篡改网站上的信息。一旦 `SQL` 成功进入网站，它将不再按其预期工作。这种功能上的更改允许黑客访问他们想要的数据、修改它或完成任何他们需要的活动。\n\
  \n- **跨站脚本 (XSS)**：在这一类漏洞中，攻击者将通过任何发现的弱点向网站中注入恶意代码。脚本将开始窃取每个访问者的 Cookie。每访问一次站点，脚本就会被激活并窃取\
  \ Cookie。代码会将 Cookie 发送给攻击者。通过 Cookie，攻击者可以访问访客的数据，并可以在他们需要时用来访问网站。\n\n- **失效的身份验证和会话管理**：在这里，攻击者将重点关注攻击活跃会话。一旦他们攻击了活跃会话，他们将使用用户的凭据访问网站。访问账户意味着攻击者可以收集任何所需的数据和信息。\n\
  \n网站中还有其他可以被利用的漏洞类型。漏洞越多，攻击就越容易，威胁也越高。这种威胁不仅针对网站所有者，也针对网站的用户，因为他们可能会迅速丢失数据或同样受到攻击。\n\
  \n### 发现漏洞的方法\n\n\n\n\n黑客有许多方法可以扫描网站或程序以寻找漏洞。如果一种方法不起作用，黑客可以尝试其他方法。这些方法包括使用 `VEGA`、使用\
  \ `ZapProxy`，黑客还可以使用数据库工具来评估漏洞。这些工具包括 `sqlmap`、`SQL ninja` 等。黑客还可以使用 CMS 扫描工具，包括\
  \ `WPScan`、`Joomscan` 以及其他工具。另一组用于寻找漏洞的工具是 SSL 扫描工具和 `W3af`。黑客可以根据自己对每种工具的熟练程度来使用其中任何一种工具。一个人掌握的扫描工具越多越好，因为他们有许多选择可以帮助发现漏洞。因此，学习如何使用多种扫描方法至关重要，因为它们可以帮助他们快速扫描问题，即使在受保护良好的情况下也能识别漏洞。\n\
  \n## 2. 利用漏洞帮助你获取访问权限\n在这一步中，黑客已经发现了网站的漏洞。他们需要利用该漏洞来获取网站及其内容。\n\n### 利用漏洞的方法\n利用漏洞是一个涉及使用工具来减慢甚至破坏网站运行方式的过程。黑客可以通过以下方式利用系统中的弱点来帮助获取访问权限。漏洞可以用于引入恶意代码、数据、脚本等材料，这些材料会影响网站及其功能。通过引入这些材料，网站的运行速度可能比平时慢，拒绝用户访问，甚至在网站上引入流量。通过这种方式，黑客将有时间收集他们想要的数据并在离开时掩盖自己的足迹。黑客将利用管理员解决问题的时间完成他们的任务。\n\
  \n## 3. 维持对网站的访问权限\n维持访问权限是攻击中一个非常重要的阶段。攻击的大部分功能取决于黑客是否能够维持访问权限。能够维持访问将帮助黑客成功完成任务。黑客必须保持对系统的访问，以便他们有足够的时间完成活动并离开。维持访问可以通过多种方式实现。其中一种方法是确保黑客尽可能长时间不被发现。因此，在这种情况下，黑客会确保日志无法向管理员提供有关他们存在的信息。维持访问权限可能涉及黑客在完成任务期间尽可能地拒绝管理员访问系统。通过执行拒绝服务\
  \ (`DOS`) 攻击或拒绝服务，黑客可以确保系统的用户无法访问它。这将确保管理员也无法访问系统，或者只能执行少数无法驱逐黑客的活动。然而，大多数黑客更倾向于盗取其他用户的用户名和密码。通过保留这些登录详情，将有助于黑客在日后重新访问系统。他们可以在不被发现的情况下尽可能多次地访问系统，因为他们看起来像一个普通用户。无论黑客选择哪种方式，他们都应该能够根据需要维持对账户或程序的访问权限，以确保他们已经能够完成任务。\n\
  \n## 4. 完成后掩盖足迹\n无论是合法的还是不合法的黑客都涉及在未获得用户或管理员许可的情况下访问程序或系统。因此，这意味着在某种程度上，黑客是一个入侵者。因此，在攻击之后（特别是访问了任何关键信息），程序所有者将寻找黑客。在某些情况下，可以对黑客采取法律行动。因此，不被发现至关重要。在攻击过程中，黑客会留下痕迹和脚印。可以通过追踪这些脚印来确定黑客是谁。因此，掩盖攻击足迹并确保无法确定黑客是谁至关重要。掩盖足迹有多种方法。下面解释了这些方法以及人们如何在攻击后成功掩盖足迹。\n\
  \n禁用审计是可以使用用来掩盖足迹的方法之一。一旦黑客获得了系统访问权限并拥有管理员权限，他们就可以简单地关闭审计。审计允许系统收集系统内正在发生的信息。禁用验证将允许黑客在不被记录的情况下开展业务。一旦他们完成工作，黑客将重新启用验证。启用验证只需要黑客运行\
  \ `auditpol.exe` 程序。在没有审计记录的情况下，管理员无法得知特定时间内系统内发生了什么。\n\n清除日志是攻击期间掩盖足迹的另一种方法。正如大家可能已经的，系统、程序或应用程序会保存活动记录。这些活动记录可以被识别为日志。因此，当黑客进入订单时，他们在订单中的活动记录会被记录下来。管理员可以通过读取日志来了解系统中发生了什么。在黑客完成后，他们可以清除日志，这样就不会有攻击期间的活动记录。当管理员查看系统时，他们将无法高效地确定做了什么。这意味着他们也无法确定是谁攻击了他们的系统。可以用于清除日志的一些实用程序包括\
  \ `clear logs.exe` 和 `meterpreter shell`。\n\n修改日志和注册表文件是黑客更改系统日志和记录的地方。一旦系统记录了黑客的活动，他们将简单地编辑日志。黑客会将日志替换为管理员预计正在发生的活动。这种方法相当安全，因为它确保管理员甚至不会怀疑系统被入侵过。管理员会简单地认为系统一直正常运行，即使系统中有一个黑客。\n\
  \n删除所有创建的文件和文件夹是需要采取的一个基本步骤之一。即使已经采取了其他掩盖足迹的措施，这也被视为一种补充行动。在攻击过程中，黑客可能需要上传文件、创建文件夹并创建文件，以帮助访问系统或执行他们的活动。大多数管理员都了解系统中的内容，因此他们能够尽可能地识别系统中的任何外部文件。出于如此，删除他们上传的文件或清除新文件夹非常重要。如果存在外来材料，但使用了其他方法掩盖足迹，管理员仍然能够判断出发生了攻击。因此，清除他们引入系统的中的材料至关重要。\n\
  \n# 渗透测试\n黑客在攻击技术上正变得越来越聪明。组织必须尝试比这些黑客更聪明，以保护他们的私人信息（如贸易机密）免受任何未经授权的人员侵害。高级渗透测试是一种风险管理策略，用于识别网络安全和系统安全中的潜在漏洞。在识别系统中所有潜在风险后，会立即采取行动尝试控制该风险。渗透测试可以被描述为网络安全策略，因为它揭示了系统内的任何安全漏洞。\n\
  \n### 高级渗透如何工作\n\n\n\n\n\nIT 专家有责任确保组织的网络安全和系统免受所有黑客的侵害。通过高级渗透测试，他们可以确保所有的黑客尝试在发生之前被检测并阻止。高级渗透测试通常涉及专家利用黑客进入系统时经常使用的相同技术或方法。黑客首先从监控组织的技术格局开始，试图识别任何他们可以穿过的漏洞。一旦他们识别出系统内的任何漏洞，就会发起攻击。同样，渗透测试人员会花时间探索网络和安全系统，并模拟类似的攻击，试图识别那些可能成为潜在漏洞的区域。测试人员在增强\
  \ Web 应用防火墙（WAF）时会使用渗透测试。渗透测试的主要目标是检测任何可能面临注入攻击风险的输入。\n\n## 渗透测试阶段\n\n1) 规划与侦察\n\
  渗透测试的第一阶段涉及为测试制定一个清晰的计划。测试人员必须制定一个策略，明确他们将如何执行测试、要测试的系统以及测试期间将使用的方法。然后，测试人员开始收集有关测试目标的所有相关信息。例如，测试人员在进行测试之前需要获取有关域名和网络名称的情报。\n\
  \n2) 扫描\n第二阶段涉及预测目标应用程序在受到入侵后将如何响应。渗透测试人员可以使用两种工具，以更有效地理解目标应用程序。\n\na) 静态分析\n该工具允许测试人员调查应用程序，以确定其在运行时的反应。这种方法涉及检查代码，而不一定得在系统中运行任何程序。静态分析允许专家对代码结构有深入的理解。静态分析可以识别任何可能使系统遭受网络攻击的系统错误。\n\
  \nb) 动态分析\n在进行静态分析之后，应立即进行动态分析。动态分析通过识别静态分析无法发现的更细微错误来运行。动态分析涉及在运行程序时对代码进行调查。动态分析的一个优势是它提供了实时信息，能够轻松识别系统中的漏洞。除了识别错误方面可靠外，动态分析还允许程序员消除系统内不必要的程序。动态分析还交叉检查了测试程序与其他程序的兼容性。\n\
  \n3) 获取权限\n在获取权限时，渗透测试人员必须使用 Web 应用攻击试图识别目标内部的漏洞。为了启动此类攻击，程序员可以使用从后门、跨站脚本和 SQL 注入运行的任何\
  \ Web 应用攻击。一旦启动攻击，渗透测试人员将使用不同的策略试图利用所有漏洞点。测试人员可以拦截流量、窃取可用数据或尝试提升某些权限，以观察系统的行为。\n\
  \n4) 维持权限\n下一步涉及调查黑客在获取权限后可能在系统中停留多久。测试人员必须模拟高级持续性威胁（APT），试图确定攻击者在他们的系统内可以持续多久。高级持续性威胁攻击的执行意图通常是在系统内停留更长时间，其旨在获得对组织系统的深度访问权限。通过模拟这类攻击，测试人员可以观察潜在威胁在系统中可以持续多久。\n\
  \n5) 分析\n最后阶段涉及对渗透测试期间进行的所有活动进行彻底分析。渗透测试人员编写一份综合报告，包括：\n- 所有被访问的敏感数据\n- 所有被利用的漏洞\n\
  - 在检测到之前在目标系统内花费的时间\n\n## 渗透测试方法\n\n1) 内部测试\n在这种情况下，测试人员通过“恶意内部人员”模拟攻击。在这种情况下，测试人员拥有应用程序的权限，因为他们可以绕过系统的防火墙。\n\
  \n2) 外部测试\n外部测试期间的渗透测试人员针对所有可以在互联网上访问的公司资产。外部测试的目标是访问公司域名服务器或公司邮箱，试图从这些目标中提取数据。\n\
  \n3) 盲测试\n在盲测试中，测试人员只获得一个公司名称。然后测试人员必须像真正的黑客一样，试图设法进入系统。组织使用这种方法研究实时的黑客活动。\n\n4)\
  \ 双盲测试\n在这种情况下，测试人员和安全人员都是盲目的。测试人员只有一个名称可以工作。安全人员在攻击发生之前也未被知情。主要目标是研究安全人员对攻击响应的速度有多快。\n\
  \n5) 目标测试\n在这种情况下，测试人员与安全人员密切合作。测试人员向安全团队更新他们在系统内的任何移动，以便安全团队能够采取安全措施进行反击。\n\n##\
  \ 渗透测试方法论\n\n1. 黑盒渗透测试\n在黑盒测试中，测试人员没有获得源代码或关于系统的任何关键信息。测试人员缺乏对系统的先验知识，测试完全取决于他们对系统和任何正在运行程序的分析。测试人员必须利用所有可用的扫描工具试图识别任何漏洞。黑盒测试已被证明是效率低下的，因为测试人员可能由于未能突破安全系统而没有检测到任何漏洞。\n\
  \n2. 灰盒渗透测试\n另一方面，灰盒测试人员对网络内部系统具有一定程度的了解。灰盒测试人员对系统架构和文档了如指掌。灰盒测试人员只需关注风险最大的系统。渗透测试人员必须优先考虑高风险系统，而不是浪费时间先去理解信息。\n\
  \n3. 白盒渗透测试\n白盒测试也称为开放盒测试或辅助测试。与灰盒测试类似，渗透测试人员获得了有关系统的完整信息和任何架构文档。在这种方法中，测试人员进行静态代码分析以及动态分析。白盒渗透允许测试人员对系统进行内部和外部评估。通过结合静态和动态分析，渗透测试人员确保他们不会错过黑客可以设法进入的任何漏洞入口点。白盒渗透是一种更整合的目标方法，因为它涉及渗透测试人员与开发人员合作，识别并修复所有漏洞。\n\
  \n### 速度、效率与覆盖范围\n与灰盒和白盒测试相比，黑盒测试是渗透测试中最快的方法。然而，黑盒测试的一个缺点是测试人员对与系统相关的信息的访问有限。信息的限制降低了该方法的效率，因为测试人员最终可能会漏掉一些关键漏洞。使用黑盒测试的渗透测试人员注会错过某些漏洞，因为他们对系统内的高风险目标几乎没有信息。\n\
  \n\n\n另一方面，灰盒测试与黑盒测试相比提供了更广的覆盖，但速度较慢。在使用灰盒测试时，测试人员会获得有关该系统及其文档的大量信息。通过这些信息，测试人员可以高效地覆盖广泛区域，并有效地分析所有潜在漏洞。使用灰盒测试的测试人员可以有效获取网络的内部访问权限，并识别所有漏洞目标。\n\
  \n最有效的方法是白盒渗透测试。与灰盒测试相比，白盒测试更为复杂，因此比其他两种方法要慢得多。测试人员面对的详尽数据需要时间来分析和理解，因此使用这种方法进行渗透测试本身将花费更长时间。\n\
