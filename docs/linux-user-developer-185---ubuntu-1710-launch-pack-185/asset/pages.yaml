  md: '# HARDWARE


    # Intel Management Engine disabled, Linux hits target


    Purism takes on all big guns and continues to enhance laptop security


    A busy month for Purism the developer of open hardware for security—conscious
    users disable the Intel Management Engine (ME). For the past decade, researchers
    have been attempting to bypass or break the ME, which is in almost all modern
    laptops as part of Intel technology exclusively. This secondary CPU can control
    a PC when switched off, and is seen by many as security risk. Purism''s Youness
    says: "The management engine entirely is the next step beyond disabling it. Coreboot
    would also provide necessary security."

    This secondary CPU can control a PC even when switched off, and is seen by many
    as security risk. Purism''s Youness says: "The management engine entirely is the
    next step beyond disabling it. Coreboot would also provide necessary security."

    in the meantime, Purism has released an update for existing devices to disable
    the ME.


    LUO founder and CEO of Purism, Todd Weaver, explained that they would build "development
    and manufacturing. Increasing throughout the next 12 months," the firm intends
    to hire developers for low-level software, GNU/Linux for a 5-inch touch-only interface,
    commerce testing and developing of the KDE/Plama and GNOME/GTK+ middleware. By
    early 2018, developers will be ready, with the phone itself ready by then. But
    Weaver ensures it doesn''t end there. "Then we get into the growth phase, where
    we focus on the Linux laptops, primarily incremental hardware improvements, software
    releases, elementary support for VPN, maps, and more set to continue, perhaps
    the most needed product support."

    "Since there are no ethical devices on the market as we have—a long-term strategy
