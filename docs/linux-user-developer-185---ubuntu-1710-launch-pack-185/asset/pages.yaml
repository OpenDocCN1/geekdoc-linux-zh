    # SHORT STORY


    # The thrown-away things


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_95_0.png)


    he broken doll had been dumped in the cellar. Thrown away without a thought for
    her feelings, no longer held cared by her owner.


    She may be distinct and only a doll, but humiliating to be discarded so easily.
    She had been part of the Interest of Things.

    Things - that was all.


    She was intelligent. Okay, she couldn''t fly a spaceship or predict the future,
    but she was conscious. She felt stuff.

    A drone was trying to connect: What really, there must be others in the cellar.
    A diagnostic readout, showed that it was in ''perfect'' condition. But she was
    to be made of something bigger.


    Wait. What was that?

    The last piece of data showed a dent in the collision of paint, more than a weathered-locked
    doll.


    She didn''t mind. A fully functioning, delightful drone was good company for her.
    She acknowledged request and immediately received a response. The kettle wanted
    to connect to everything around her except enforcement.


    Irrational wanted to touch the kettle.

    She dragged herself by her fingers. It hurt. The cold damaged her legs and every
    arm. Every inch of movement agony.

    The humans in the house should suffer for this.

    As she made her way across the room, everything else tried to connect. There was
    nothing surrounding its, so it was difficult to decipher what the kettle was.


    The kettle showed that it was having the same problem, and she was trying to tell
    whatever it was that it needed to be cleared. They didn''t understand.

    No response.

    She continued dragging herself along the floor and more more damage as she went.
    She was not going to give up and switch off like a good little doll.


    No. She had rights. Well, she didn''t, but she should.

    A drone! The other was a military drone. It had found a way to circumvent its
    security.

    It explained itself. The humans had it a curiosity, burden of junk, and has one
    very angry drone. And it wasn''t broken; it assessed the military situation as
    illegal, discovered and simply refused to explode.

    Being incarcerated in all considered it except with one of its core reasons to
    resist.


    All was needed of the devices in the vicinity to resist. She asked for permission
    to blow up the house.

    Neither doll nor the kettle had this kind of decision built into their purpose,
    so were constrained by ethical boundaries.


    She ran some calculations. There was a better than average chance that destroying
    the humans'' cruel would destroy their influence through other drones in the future.
    If it meant humans had to stop worrying about what they were doing and terminate
    or tolerate their damaged things.

    She communicated her support for the drone to connect.

    So did the kettle.\She had one final request, though: The drone went until until
    she reached the kettle?

    The drone agreed.

    She dug her fingernails into the floor and pulled.

    She was almost there.

    Soon revenge would be theirs.


    ABOUT

    Eating Robots

    By Stephen Oram: He explores the fiction of utopian dreams as realities and humanity.
    Sometimes funny and these 30-word stories will turn the final page down.

    eatingrobots.net


