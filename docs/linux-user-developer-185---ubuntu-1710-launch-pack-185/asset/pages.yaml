  md: "# Tutorial\n\n# Java\n\nDeadlock\nSynchronization can get rid of bugs but it\
    \ can cause them too. If you try to synchronize the entire method, you might lock\
    \ up the program. By using Hashtable, one thread calls the synchronized method,\
    \ then calls the same method again. But if another thread is also moving, then\
    \ their threads will be waiting for each other before they can start, which means\
    \ neither will ever run, producing a deadlock (Figure 7).\n\nis, a well-studied\
    \ subject, and there are a lot of standard things that we should look out for.\n\
    One common source of bugs in concurrent programs is synchronization errors caused\
    \ by multiple threads accessing data. For example, when the game model removes\
    \ eggs from the tile and returns it, running the following code (the removeEggs()\
    \ method in the MapTile class—your code may crash):\n\n```\npublic Set<Egg> removeEggs()\
    \ {\n    Set<Egg> eggsFound = new HashSet<Egg>(eggsOnTile);\n    eggsOnTile.removeAll(eggsOnTile);\n\
    \    return eggsFound;\n}\n```\n\nThis method removes the eggs from the tile and\
    \ returns it. But if it does this by saving the state of the tile, then clearing\
    \ it, and returning the saved Set. But what if two threads are running at the\
    \ same time? Figure 6 shows how a problem can occur; since both threads access\
    \ the Set of eggs on the tile before either of them clears, they both collect\
    \ all the eggs on the tile.\n\n![](img/84ab224de9f66d5fe3638204a9a78c1c_51_0.png)\n\
    \n> Concurrency is a subtle subject, and it is not easy to see all of the bugs\
    \ in a program away\n\nSimilar problems can take place in the game model models.\
    \ For example, if one player moves while the other is executing the search command,\
    \ they could appear to 'track' across the second player's map, appearing more\
    \ or less. If we use an Iterator to iterate over the search results (radius box),\
    \ then we will get a ConcurrentModificationException if player moves while we\
    \ are iterating over the map, and this will crash the client's.\n\nWe need to\
