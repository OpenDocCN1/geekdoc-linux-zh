    We do same for the move(), searchRadius() and displayInventory(). Each of these\
    \ methods is in the sense that it should be carried out in one, and that is what\
    \ the synchronized keyword will ensure.\n\n# Deal with denial-of-service attacks\n\
    \nIn this section, we will demonstrate a denial-of-service attack by malicious\
    \ player of the game. Start up a server, a client, and then run the following\
    \ code in a command:\n\n```\nwhile :\necho 'S'\necho 'N'\necho sleep 1000\n```\n\
    \nThis will create a connection to the server and send S and moves while a command\
