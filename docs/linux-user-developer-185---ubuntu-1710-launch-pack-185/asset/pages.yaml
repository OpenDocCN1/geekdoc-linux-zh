    \ interleaved with other accesses to the same state: the method must be\n\n![](img/84ab224de9f66d5fe3638204a9a78c1c_51_1.png)\n\
    \nAbove we use the debug panel in Eclipse to detect when the shared data is. Lucky,\
    \ Java makes it easy to do. To solve the first problem, we add the synchronized\
