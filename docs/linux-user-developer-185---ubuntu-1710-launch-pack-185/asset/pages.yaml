    | Usability | Can be pushed into service out of the box without any tweaks | Straightforward
    to use, but doesn''t support drag and drop filenames | Will enhance productivity
    once it''s set up as you need | Easy to open and detect fast paths and uses as
    a background |

    | Overall | Lightweight and usable and includes a useful config manager | A good
    functional option for users looking for overpowered machines | This is the perfect
    terminal with ample tweaks for the CLI | Ideal adaptation for anyone who likes
    the default terminal terminals.|


    # AND THE WINNER IS


    Terminator

    If you use the command to launch an occasional scroll few times a week, any terminal
    emulator would do. Sakura help you conserve resources on an older computer without
    losing any functionality of a terminal emulator. For a bit more than that, you
    might use ROXTerm – a lot lighter than your environment''s defaults.


    But for people who spend a considerable time on the CLI, it''s a choice between
    Terminator and Terminology. Terminology lives up to name (Why should emulators
    be boring?) and is a visual masterpiece. It''s a wonderful option for people who
    think creatively. You can use its simple interface to configure the desktop and
    apply even images and videos as the background. It has two big drawbacks: lack
