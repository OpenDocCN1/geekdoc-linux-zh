    the Status variables; for instance, if you''re using it to detect motion in your
    house, you could name them ''livingroom'', ''kitchen'', and ''study''. If you''re
    composing a script, switch on the red LED for the ''strip'' with the code: sb.light.red.on().
    Then type exit() once you''ve finished testing.


