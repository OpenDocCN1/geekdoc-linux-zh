  md: '# Expression


    # Matches


    we use grep euro on its own, then we will turn up such as neurosis as well. Luckily,
    grep allows us to use the character ^ to denote the start of a line:


    ```

    $ <dictionary.txt grep "euro"

    europe

    europe

    european

    europeans

    europegium

    ```


    | ^ / $ | Beginning/end of a line |

    |---|---|

    | [linux] | Any character |

    | | Any of the characters i, l, n, x |

    | [a-h] | Any lower-case letter from a to h |

    | [0-9-Za-p] | A digit, a capital letter, or a lower-case p |

    | ^Q | Any character that is not a digit or a capital Q |

    | \...\ | Three characters, treated as a single expression |

    | \(...\) | Three characters, followed by the same three characters |

    | \, \. | A literal character , [etc]. |


    The expression that we use grep is known as a regular expression. You may meet
    regular expressions in other languages, in which case the functionality of grep
    will be familiar to you. Regular expressions form a special language that allows
    us to


    # The reason grep is so powerful that it is built to work with regular expressions


    specify a pattern carefully. A regular expression defines a set of strings that
    ''match'' pattern. The functionality of grep is as follows: go through the input
    line by line and print out those lines that match the pattern.


    One important feature of regular expressions is its express capacity for wildcards.
    For example, a full stop , is used to match any character:


    ```

    $ <dictionary.txt grep "reven*"

    revenue

    revenue

    ```


    Another thing that regular expressions do is match a pattern certain number of
    times. For example, the character * causes the previous part of the expression
    to match any number of times, including zero:


    ```

    $ <dictionary.txt grep "princes"

    prince

    princes

    princes

    ```


    When we were getting along the first tutorial, we learned that the character *
    used to match any string of characters. With regular expressions, the syntax is
    far different, but more flexible. Instead of using * to match a string, we can
    use . instead:


    ```

    $ <dictionary.txt grep "un.ily*"

    neasily

    happily

    necessarily

    ```


    Above The Basic Language contains many expressions we can use to match particular
    classes of characters


    This is extra for today, but the advantage is by modifying the pattern we can
    customise grep to match. For example we can use grep to match a specific number
    of times by using curly braces preceded by brackets:


    ```

    $ <dictionary.txt grep "^v{2}"

    disentisestablishmentarianismelectronography

    ```


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_34_0.png)


    Here, we ask grep to find all words containing the pattern ^v{2}. In this case,
    the output is in English that have at least two characters


    Regular expressions allow us to match ranges of characters. For example we want
    to find if there are five or more vowels in a word:


    ```

    $ <dictionary.txt grep "[aeiou]*"

    queuing

    ```


    The pattern [aeiou] matches any one of the letters e, i, o, u. We can also use
    ranges of characters using brackets; for example, [a-z]. The [A-Za-z] matches
    all capital and lower-case letters. We can also use negated brackets [...] to
    match all characters except the ones we specify. For example, if we know our input
    consists only of lowercase letters, then [^aeiou] match consonants.


    # Grouping and backreferences


    Regular expressions allow us to group expressions into one. With this we can use
    brackets, preceded by backslash — \(...\). This causes the expressions to be treated


