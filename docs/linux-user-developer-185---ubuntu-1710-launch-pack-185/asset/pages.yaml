  md: '# Components


    # Light scripting


    The script on the Pi Zero only looks for emails from a address with specific words.
    Martin demonstrates how the Pi receives a ''redalert'', the script tells it to
    flash the LEDs for 30 seconds.


    # Power trim


    Martin said that none of his micro-USB cables was enough to fit into the cylinder
    plugged into the Pi''s pocket. He considered the Pi from the GPIO pins, but decided
    to trim them to fit the existing cable. There are three cables from the Unicorn
    to each other and these were just enough connect before sliding the Pi into the
    viewer.


    +   * Raspberry Pi Zero W 40-pin header soldered

    * microSD card

    * Pimoroni Unicorn pHAT

    * Right-angle header pins for the HAT (8 used)

    * 3x20cm female jumper leads

    * Heat shrink to disguise the three leads

    * Plastic box to chop up for the bracket

    * 1x M10 bolt to secure the bracket to the cylinder door

    * 1x1930s Kodak Table Viewer

    * HDMI and USB adapters (for access to monitor and keyboard)


