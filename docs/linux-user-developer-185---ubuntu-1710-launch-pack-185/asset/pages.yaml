  md: "# Set up a Jupyter server on your Pi\n\nJupyter provides a great interface\
    \ that you can use for your Raspberry Pi for collaborative computing or science\
    \ projects\n\n![](img/84ab224de9f66d5fe3638204a9a78c1c_77_0.png)\n\nRaspberry\
    \ Pi has found a niche in several projects where it's used as the computational\
    \ core. This led to the Pi Foundation creating the Module, designed specifically\
    \ for this use case. With this, we will build our project. By looking at this\
    \ Jupyter project. Through its web-based interface, Jupyter provides a great front-end\
    \ to access available through your Raspberry Pi. If you are a Python user, you\
    \ can install Jupyter with the commands.\n\nbeing, which can be difficult, so\
    \ instead you put all of these options in a configuration file if you want to\
