    # GROUP TEST


    # Terminal emulators


    Don''t sweat it if your desktop environment''s default terminal emulator doesn''t
    suit your workflow. We look at some of the best available options


    # ROXTerm


    If you''re not that hardcore, you might be using ROXTerm. This emulator uses the
    GTK library just like gnome-terminal and despite its name, it is not restricted
    to the ROX desktop. The terminal satisfies power users without making it too geeky
    for the rest of us. http://roxterm.sourceforge.net


    # Sakura


