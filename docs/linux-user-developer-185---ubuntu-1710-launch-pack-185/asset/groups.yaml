    # 计算机安全


    ## 使用 ESIL 仿真破解晦涩的汇编程序


    轻松的逆向工程是一种损失。然而，使用 Radare2 ESIL 语言发射部分代码是有希望的。


    **逆向工程、二进制文件的动态和符号分析被广泛用于逆向分析固件和恶意软件。** 在新威胁不断出现的世界里，非逆向工程专家无处遁形。现在介绍 Radare2
    ESIL，这是一种汇编指令的中间语言，能够实现轻松表示。ESIL 主要在 Radare2 中用于描述汇编指令的行为。通过处理栈和函数序言，你可以在不执行危险代码的情况下仿真任何架构的函数。自然地，这很有趣：在复杂程序中仿真函数或指令，通过执行其编码器逻辑来解码
    shellcode，并对其进行进一步的分析甚至仿真、调试、分支预测、解包等检测。你准备好深入研究寄存器、条件跳转和二进制仿真了吗？请下文！


    ## 识别输入和输出


    假设你在日常逆向工程会中遇到了一个晦涩的指令。这段代码段可以用于分析它，但只要不将其在某些验证、函数序言和结尾之后封装，然后在来自非二进制分析的沙箱中进行汇装、链接并执行，你就可以安全地调试并动态分析代码。你应该考虑仿真它：


    ```assembly

    00  mov eax, 0

    01  push ebx

    02  push ebp

    03  mov ebp, esp

    04  sub esp, 4

    05  mov edx, [ebp+8]

    06  mov ecx, [ebp+4]

    07  lea eax, [label]

    08  xor eax, edx

    09  mov [ebp-4], eax

    0a  add esp, 4

    0b  pop ebp

    0c  pop ebx

    0d  ret

    ```


