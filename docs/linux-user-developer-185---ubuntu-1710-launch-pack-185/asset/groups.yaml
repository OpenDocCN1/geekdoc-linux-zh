    ## Ubuntu 17.10 启动包


    ## 定制 GNOME 17.10


    ### 快速贴士：

    重新打开文件浏览器


    你知道在 Chrome 中可以按 Ctrl+T 打开标签页吗？在 Nautilus（GNOME 文件管理器）中也有相同的快捷键。


    为了让现有的 Ubuntu 用户在切换到 GNOME 时不那么突兀，Unity 中使用的主题和颜色也引入了 Ubuntu 默认启动器。深紫色、橙色和红色被用于视觉效果——你很可能会在新版本中感到宾至归，除非你尝试改变它。你可能会怀念的是窗口按钮（即最小化/最大化/关闭），它们从左侧移动到了右侧，这是在
    2010 年跨越屏幕的。出于兼容性考虑，你可以将它们移动回去。对于使用非标准窗口的开发者来说，这确实是一个迟到的新开始。Chrome 刚刚在 Beta 版开始使用
    GTK 控件——这是 Ubuntu 浏览器长期以来期待的欢迎变化。这种影响将延续到稳定版。


    ### 快速指南


    #### Dash to Panel


    Ubuntu 引入的启动器是流行的 ''Dock'' GNOME 扩展的分叉。作为另一个扩展，Dash to Panel 是扩展功能强大的绝佳示例。Dash
    替换了左侧的 dock，取而代之的是一个我们所谓的“类 Windows”任务栏，并重新定位了快捷方式。它具有一些很棒的功能，包括图标悬停、可自定义的运行指示和快捷键。你可能想通过
    `sudo apt remove gnome-shell-extension-ubuntu-dock` 移除标准 dock。


    Dash to Panel 将 dock 任务栏移动到屏幕底部的单一面板。


    #### 扩展让 GNOME 变得灵活


    为了让 GNOME 看起来完全符合你的要求，SHELL（你看到的界面）有一个 GTK+ 主题（Ambience），它将应用程序、对话框等的外观与外壳栏、任务切换器、顶部菜单和其他“外壳”整合在一起。如果你想更改机器上的主题，你需要找到你喜欢的主题。鉴于
    GNOME 的巨大人气，你可能会发现大多数你喜的主题都能正常工作。


    为了应用这些主题，你首先需要安装 GNOME 扩展。扩展是按你想要更改 GNOME 外观的一种极其强大的方式。要开始操作，只需打开网络浏览器并指向 https://extensions.gnome.org/
    ，系统会提示你安装浏览器扩展，之后，你应该安装 ''User Themes''——这允许你从用户目录配置上述主题。


    Ubuntu 预装了许多扩展。原生的 GNOME 3.10 安装版包含一个看起来像 Ubuntu 界面的 dock —— 但很棒的是绑定的 ''Ubuntu
    dock'' 扩展修复了这个问题，使得界面看起来很舒服。最后，确保应用程序指示器出现在顶部栏，这在默认的 GNOME 中是不存在的。


    已安装的扩展可以进行更新、启用/禁用、移除，最重要的是进行配置。你可以从网站使用它们，或使用 Tweak 工具（GNOME Tweak Tool）。它就像
    Unity Tweaks。它有许多精炼你的 GNOME 安装的方法，还是一个不基于浏览器的扩展管理工具。要安装它，请使用 `sudo install gnome-tweaks`。


    工具中的微调按类别划分——“外观（Appearance）”部分允许你设置偏好、启用/禁用动画甚至主题。“桌面（Desktop）”部分对于添加和删除桌面图标以及设置桌面和屏幕背景特别有用。“字体（Fonts）”部分也允许更改字体。鼠标行为（Mouse
    behaviour）允许你调整输入设置。“窗口（Windows）”部分让你更改窗口周围的行为，以及显示/隐藏阅读器标题栏。


    虽然 Ubuntu 团队努力让 GNOME 感觉熟悉，但仍然缺少一些东西。GNOME dash 与 unity 一样强大（在 3.20 版本中有所改进）。它最初非常基础，提供了搜索应用程序、文档、Ubuntu
    软件中心的能力，通过使用扩展可能会变得更强大。项目可以右键点击“添加到收藏夹”（在启动器上）或移除。


    ## 微调 (Tweaks)


    ## 外观 (Appearance)


    | 类别 | 设置 |

    | :--- | :--- |

    | 全局深色主题 | 关闭 |

    | 桌面 | |

    | 动画 | |

    | 主题 | |

    | 应用程序 | Ambiance |

    | 键盘与鼠标 | 光标 |

    | 电源 | 图标 |

    | 启动应用程序 | Shell |

    | 窗口 | (无) 默认 |


    GNOME 的一个亮点是它是如何处理的——最初可能会觉得很奇怪。这是因为对于许多应用程序实际上有两个菜单：菜单（出现在顶部）和应用程序菜单。你是只有全局菜单还是应用程序菜单完全取决于软件开发者。其意是支持主“全局”菜单，但到目前这还没有完善。


    ### 有用的 GNOME 扩展


    在查看 GNOME 网站（https://extensions.gnome.org/）时，你会发现一个可以增强你体验的扩展列表。一个流行的扩展是 ''Caffeine''，防止计算机进入睡眠。Dash
    to Panel 将 dock 任务栏移动到屏幕底部的单一面板。


    GNOME 的一个亮点是它是如何处理的——最初可能会觉得很奇怪。这是因为对于许多应用程序实际上有两个菜单：菜单（出现在顶部）和应用程序菜单。你是只有全局菜单还是应用程序菜单完全取决于软件开发者。其意是支持主“全局”菜单，但到目前这还没有完善。


    虽然 Ubuntu 团队努力让 GNOME 感觉熟悉，但仍然缺少一些东西。GNOME dash 与 unity 一样强大（在 3.20 版本中有所改进）。它最初非常基础，提供了搜索应用程序、文档、Ubuntu
    软件中心的能力，通过使用扩展可能会变得更强大。项目可以右键点击“添加到收藏夹”（在启动器上）或移除。


    ### 备选发行版


    桌面环境


    如果你正在选择一个发行版来跨越，请记住有很多选项。Ubuntu MATE 是那些想要传统界面的的人的好选择。


    '
