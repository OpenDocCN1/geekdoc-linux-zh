- md: "\n## INTERVIEW CANONICAL\n\n## Ubuntu in transition\n\nWe spoke to Canonical\
    \ at the launch of 17.10, to chart its route from Unity to GNOME and gauge how\
    \ felt its significant move has gone down with users.\n\n![](img/84ab224de9f66d5fe3638204a9a78c1c_11_0.png)\n\
    \n> It’s strange even six months after founder and CEO of Canonical, Mark Shuttleworth,\
    \ announced that Unity project was dead – to have Unity 8 described as “bad investment”\
    \ by Canonical employees. Will Cooke, desktop manager at Canonical, seemed quite\
    \ comfortable with the new narrative when we spoke to him on release day, although\
    \ he preferred to use the term relation to Unity 8 rather than closed, which would\
    \ appear open to the possibility of Unity 8 being reversed out of its ‘baking\
    \ bay’ in the future. “Will said, the display server still exists and is in development\
    \ and that’s especially interesting for the time-being we’re using Wayland on\
    \ the desktop now. However, with widespread support for Wayland now, the Ubuntu\
    \ desktop team’s own support of Wayland seems unlikely that Mark Shuttleworth’s\
    \ default display server on Ubuntu’s desktop thrives. The default using GNOME\
    \ 3 returning as the default. Ubuntu 17.10 is a fork in the road for the distribution\
    \ that matters to Linux, so for this interview we were mostly concerned with the\
    \ transition.\n\nCan you tell us how the run-up to 17.10 has gone?\n\nWe decided\
    \ GNOME Shell was the right toolkit for our users. We’ve used Unity for seven\
    \ or six years and all the core set applications were built around the GNOME desktop,\
    \ so going to GNOME makes sense. Using Unity 7 and GNOME on the desktop was hoping\
    \ to be straightforward, smooth and quick to be that way. Now we’ve got the latest\
    \ GNOME desktop runner on Ubuntu.\n\nWill Cooke is the desktop manager at Canonical.\
    \ Precisely, he was the product strategy engineering manager on Ubuntu.\n\nSome\
    \ of the tweaks that we have been using Unity for the seven or six years are still\
    \ very much needed in our opinion, on the desktop that we are using, in the way\
    \ that we have been using, all of the tweaks that we made for the screen launcher,\
    \ are still relevant to the new desktop. We’ve added a couple of extensions in\
    \ there to launch the bar and a few features that we felt missing from the desktop\
    \ that was in GNOME... All that work was done with the blessing of the GNOME community\
    \ and the blessing and support extension the features we’ve added have been upstream\
    \ rather than hosting ourselves\n\nIt is because when we wanted to upgrade 17.10\
    \ to see something familiar and that you would feel at home.\n\nAll the things\
