    core. This led to the Pi Foundation creating the Module, designed specifically
    for this use case. With this, we will build our project. By looking at this Jupyter
    project, through its web-based interface, Jupyter provides a great front-end to
    access available through your Raspberry Pi. If you are a Python user, you can
    install Jupyter with the commands.


    Labelled as `jupyter notebook --port=8888`, it defaults to 8888. If you have other
    services running on your Pi, this may already be in use. Once this is done, you
    can start up with Jupyter:


    ```bash

    sudo apt-get install python-dev

    sudo pip install --upgrade pip

    sudo pip install jupyter

    ```


