    # OPINION


    ## The concept of applying collective responsibility to open source risk


    ### We can''t eliminate the risks of increasingly complex software, but Mel argues
    we need a smarter approach


    Software has bugs. This applies to widely used open source software (OSS) like
    Linux, Apache, OpenSSL, and more. And while we know how transformative collective
    collaboration can be developed with OSS, we also believe that the quality of OSS
    is on par with if not better than developed software in regards to defects per
    line of code, but this has not reduced the impact to the users who consume projects.
    Why the complexity of the software and the fact that programming is a human activity
    have combined to right against the core tenets which underlie the improvement
    of quality of OSS - that "given enough eyeballs, bugs are shallow" (Linus''s Law).
    The while recent projects have suffered in widely published disclosures, such
    as Heartbleed and Shellshock, and while the code in these projects can be reviewed
    and audited, these measures are often not enough to prevent harm. What this means
    is that risk is inherent regardless of the overall quality of the software and
    the development projects. We also know how to improve the security, robustness,
    and functionality of the software.


    We can argue that testing is required even, when there is sufficient test coverage
    with projects. We also know how we can improve the state of OSS security? We have
    many tools available, but their application is inconsistent. What is a maturity
    modeling framework which provides transparent objective measures of a project''s
    health coupled with the application of software quality tools.


    As the result of Heartbleed, the Linux Foundation''s Core Infrastructure Project
    in 2015 attempted to model the majority of its Census Project. Criteria such as
    the number of CVEs (Common Vulnerabilities and Exposures) associated with a project
    as well as contributor count, popularity programming language and exposure with
    package information such as transitive dependencies, and crash statistics. This
    information was not indicative of vulnerabilities or quality, but reflected projects
    which were in need of attention.


    These metrics however missing a starting point. In maturity should consider the
    unknowns – weaknesses specified/unspecified behaviour. Tools such as Software
    Composition (to track a project''s dependencies) Shell can help identify avoidable
    software quality defects which may be the result of fuzzing (to test the failure
    in of malformed and unexpected inputs), Test Coverage (the measure of code of
    automated tests) can be applied to broaden our view of a project''s maturity profile.
    The challenge is to apply these tests at a point in time, but continuously as
    the project matures. What the application of maturity modeling with an automated
    software quality toolchain provides us to measure the risk associated with individual
    OSS projects. This information can help developers prioritize issues which may
    have impact on a project''s security. The goal is not to completely eliminate
    risk (which is impossible), but to potentially reduce it through the improvement
    of a project''s quality. This is only possible if the community accepts this collective
    responsibility, it is not enough to simply identify projects at risk; it requires
    developer engagement to address discovered issues. Mel is the open source solution
    for synopsis


