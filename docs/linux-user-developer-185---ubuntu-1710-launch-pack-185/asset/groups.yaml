    # 笔记本电脑电源管理教程


    ## 轻松提升 Linux 笔记本电脑电池续航


    笔记本电池在 Linux 下往往耗电更快。通过调整一些设置，可以延长充电之间的使用时间。


    无论你的 Linux 笔记本电脑之前使用的是专有操作系统，还是设置了双系统，你可能已经注意到——一种挥之不去的不便。那就是你的笔记本电池在 Linux 下的续航时间没有那么长。


    这里有几种实用的解决方案，例如更换视频驱动程序、使用移动电池盒、改变行为习惯以及调整设置，这些都能提高电池续航。结果将是你的笔记本在 Linux 下可以保持更久的电量。


    从你发行版的内置设置开始吧。这在 Ubuntu 和 Fedora 中的位置有所不同，你需要打开“系统 电源”（System Power）。在这里，你可以调整电源管理器调整的速度，以及电脑空闲时的设置。设置较短的时间（例如五分钟）可以避免电池电量进入临界低电量。挂起（Suspend）是一个不错的选择，如果这意味着当你找到电源时，笔记本可以随时恢复运行。


    关闭显示器也是一个好选择（请阅亮度文档），如果有“降低亮度”开关，请开启它。


    除了电源，还有其他考虑可以提高电池性能的因素。其中之一是禁用无线网络——蓝牙可能会是一个问题。虽然某些笔记本电脑支持低功耗 4G LTE，但某些旧笔记本电脑使用的适配器不兼容新版本的蓝牙。对于网络，禁用此项无法帮助你防止耗电型
    Web 应用（在后台经常更新的应用，如 Gmail）产生影响。如果你的笔记本有飞行模式按钮，可以从面板禁用蓝牙和无线网络，但仅适用于快速连接。


    正在寻找其他减少笔记本电池消耗的方法吗？可移动式媒体也有帮助。任何类型的 USB 驱动器、SD 卡等都需要持续供电才能保持挂载和可浏览，因此这些设备可以节省电池寿命。


    机械硬盘自然会消耗电量。你对笔记本硬盘做不了什么，但在不使用时弹出 CD 和 DVD 也有帮助。如果你使用光驱，请将其取出；获取一个面板来盖在笔记本的空隙上并不难。如果这不可行，或者你更倾向于更实用的解决方案，最好是使用
    HDD 或 SSD。


    ## 可移动式媒体与 Flash


    Adobe Flash 是另一回事。如果将其设置为在 2020 年运行，它也会为你节省电池电量。它只是时代的遗迹，不会对你的笔记本电池续航造成崩溃。


    你有几个选项可以使用。首先，你可以直接禁用它。这种前瞻性的行动将根据现有的任何软件硬件节省大量能量。具体来说，你可以阻止 Flash 以防止视频和媒体自动播放。在
    Mozilla Firefox 中，打开“扩展 > 插件”（Add-ons > Plugins）并找到 Flash Showcase。使用“激活”（Activate）选项控制
    Flash。如果你希望被询问，请先选择“询问”（Ask）；Google Chrome 用户可以使用 `chrome://flags/search` 找到 HTML5
    视频播放阻止选项。


    通过目前为止我们看到的内容，你应该能感觉到 Linux 笔记本电池续航的明显提升。但你可以通过 TLP 进一步优化，TLP 是一项优秀的自定义软件，可用于管理系统的电源使用。安装
    TLP 将首先帮助你添加 PPA。


    ```bash

    sudo add-apt-repository ppa:linuxrunner/tlp

    ```


    按照屏幕提示操作，然后更新并安装：


    ```bash

    sudo apt install tlp-rdw

    sudo apt run tlp-start

    ```


    当你准备好后，运行 `sudo tlp start`。这将加载默认设置。要查看并编辑这些设置，请用文本编辑器 `nano /etc/tlp.conf` 打开配置文件。在这里，你会找到启用或禁用
    TLP 的设置，并且可以发现更多内容。但在笔记本窗口中调整可能有点复杂。例如，在 `tlp-utils.github.io/` 有一个图形化前端可用于编辑
    zip 文件及其内容。终止目录中的可执行文件，并运行 `~/.tlp`。一旦设置好配置，用户界面将通过标签页轻松导航，找到可以调整的电源设置。你会发现启用
    TLP (TLP_ENABLE) 的选项，并在音频（Audio）选项卡中启用或禁用音频省电。你可能想这样做，但禁用音频省电比直接按静音键更有效。


    # 高级 Linux 电源管理


    接下来，处理磁盘。如果你在页面顶部发现了各种硬盘驱动器。正如我们之前关于可移动硬件的讨论，这值得智智考虑。通过启用 `POWER_OFF_BAT`，你可以通过不使用光驱来节省电量。注意，可以通过删除和替换标签来禁用它。显而易见，它仅对
    Radeon 驱动程序有效。这是因为管理 Intel/Nvidia 显卡的电源，你可能会在这里找到相关选项。


    转向网络，有两个 Wi-Fi 功能默认是禁用的。这些适配器会影响你节省了多少电量。不要禁用无线，而是使用 `USB_DEVICE_ON`。如果你使用 USB-WOL，你需要关闭它。


    接下来的组配置包含了一些需要调整的设置。例如，`POIS` 可以管理 PCI Express 状态电源管理设置等。对于笔记本来说，这些选项几乎总是正确的。然而，只能使用自动挂起（auto-suspend）。对于笔记本，有一个图形化前端可用……具体查看
    `CPU_SCALING_FREQ` 和 `CPU_PERF`。


    机械硬盘自然会消耗电量。你对笔记本硬盘做不了什么，但在不使用时弹出 CD 和 DVD 也有帮助。如果你使用光驱，请将其取出；获取一个面板来盖在笔记本的空隙上并不难。如果这不可行，或者你更倾向于更实用的解决方案，最好是使用
    HDD 或 SSD。


    '
