    # 观点


    ## 将集体责任制应用于开源风险的理念


    ### 我们无法消除日益复杂的软件带来的风险，但 Mel 认为我们需要一种更智能的方法


    软件存在漏洞。这同样适用于广泛使用的开源软件（OSS），如 Linux、Apache、OpenSSL 等。虽然我们知道集体的协作能通过 OSS 产生多么巨大的变革，但我们也认为，从每行代码的缺陷数量来看，OSS
    的质量等同于甚至优于开发后的软件，但这并没有减少对消费项目的用户的影响。由于软件的复杂性以及编程作为一项人类活动的事实，这些因素共同违背了作为改进开源软件质量的核心准则——即“只要眼睛足够多，漏洞就无处遁形”（林纳斯法则）。尽管最近的一些项目在如
    Heartbleed 和 Shellshock 这样广泛公布的漏洞中遭受了损失，虽然这些项目的代码可以进行审查和审计，但这些措施通常不足以防止伤害。这意味着，无论软件和开发项目的整体质量如何，风险都是内在的。我们也知道如何提高软件的安全性、健壮性和功能性。


    我们可以认为，即使在项目具有足够的测试覆盖率时，测试仍然是必要的。我们也知道如何提高开源软件安全的水平？我们有许多可用工具，但其应用并不一致。是否存在一种成熟度建模框架，既能提供项目健康的透明客观衡量，又能结合软件质量工具的应用？


    作为 Heartbleed 事件的结果，Linux 基金会的核心基础设施项目在 2015 年尝试对其大多数普查项目（Census Project）进行建模。标准包括与项目相关的
    CVE（常见漏洞与披露）数量、贡献者数量、流行编程语言，以及通过包信息（如传递性依赖）的暴露情况和崩溃统计数据。这些信息并不代表漏洞或质量，而是反映了需要关注的项目。


    然而，这些指标缺少一个起点。在成熟度方面，应该考虑未知因素——已指定/未指定的行为。诸如软件成分分析（跟踪项目的依赖关系）等工具，可以帮助识别可以避免的软件质量缺陷，这些缺陷可能是模糊测试（用于测试格式化和意外输入的失败情况）的结果；测试覆盖率（自动化测试的代码衡量标准）可以用于拓宽我们对项目成熟度画像的视角。挑战在于如何在特定时间点应用这些测试，并随着项目的成熟进行持续应用。成熟度建模与自动化软件质量工具链相结合，为我们提供了衡量与单个开源项目相关的风险的方法。这些信息可以帮助开发者优先处理可能影响项目安全的问题。目标不是完全消除风险（这是不可能的），而是通过提高项目质量来潜在地减少风险。只有当社区接受这种集体责任时，这才是可能的；识别有风险的项目是不够的；它需要开发者参与来解决发现的问题。Mel
    是摘要的开源解决方案。


    > 风险是内在的，无论软件的整体质量如何


    # Linux 新闻与观点


    ## 评论


    ### 关于杂志的问题与意见


    ### Linux 与开源


    使用 TLP 更安全，我们在本期中介绍过这种电源管理实用程序。对于笔记本电脑的电源管理，我们还建议安装并启用 TLP（如果你使用 apt，大多数基于 Debian
    的发行版都可以在其仓库中找到它）。TLP 是一个默认配置，提供开箱即用的省电功能，有助于管理笔记本电脑的温度和功耗。对于许多用户来说，它能防止意外关机并节省大量电池量。硬件所有者正在更换
    CPU 和 GPU 使用的硅脂，因为笔记本制造商使用的是廉价材料，这些材料往往会失去导电性。我们建议用压缩空气清理笔记本内部，但可能并非必要。我们在上面的教程中提到了这一点，但有一个图形化前端工具，你可以在这里找到：https://github.com/linux-power


    ### Canonical 的阴谋？


    ### 起飞


    亲爱的 Lars，我的 Zenbook 笔记本电脑有一个像直升机一样狂转的习惯。我安装了 Ubuntu 17.04 并在设置窗口更改了一些内容。然而我需要尝试修复这个问题，因为我的笔记本现在发噪音很大。


    亲爱的 Smith，当 Canonical 在这么多年之后决定转向 Unity 时，我感到一点也不生气。他们为什么要这样做？你认为这只是个玩笑吗？Canonical
    最近在抛弃 Ubuntu 吗？这是我们在论坛和 Twitter 上看到的常见阴谋论。我不确定这是否仅仅是过去经验不幸的偏离——但这是 Canonical 放弃
    Unity 的一个可能原因。当他们决定关闭该团队时，Canonical 仍在运作。记住，Canonical 已经大幅扩展到 GNOME 之外。但有了 GNOME，它是不会消失的。Canonical
    的决定并非出于对桌面和服务器 ISO 的务实关注（后者的头疼程度小得多）。通过 GNOME，Canonical 有能力向上游提交（post upstream）以帮助改进重要的核心技术。


    # 联系我们！有什么想告诉我们的或需要回答的问题吗？请发送邮件至 linuxuser@future.com


    Chris: 听起来你的风扇在玩闹。首先，你可以尝试使用 lm-sensors 检查系统温度。如果你在终端中输入 `sensors`，你将获得任何可用传感器的结果。例如，它检测到了显卡和
    CPU 的温度。一段时间以来你的传感器没有被检测到，所以使用 `sensors-detect` 开始将模块添加到内核。你可以进入 `fancontrol`，这将允许你为风扇设置最小和最大温度。


    Chris: 感谢你的评论，Lars。是的，Jon 的文章是每月杰作，将数百次提交压缩在两页内。他喜欢在打印细节上更深入一点，所以如果你花时间找一张 Tony
    Torvalds 竖中指的照片，你就知道 Jon 错过了。关于评论——我们确实努力做得更有技术性，但依然易于理解。我们想听听其他读者对我们一些深度文章的看法。它们对你来说是很美妙还是太深了？


    Tim Larson，我从 2005 年开始就开始使用 Linux，目前在 IT 领域担任 Linux 系统管理员。我曾是《Linux Format》的读者，很难找到高质量的内容，也很容易看到《Linux
    User》的不同之处。两本杂志都做得很大，虽然《Linux User》是一本杂志，我只发现它比 LXF 技术性强一点（如果某些功能感觉太过了的话）。因此我认为你们拥有一本很好的杂志，融合了评论、DIY
    项目，我特别喜欢 Jon Masters 的《内核色彩》（Kernel Colour）。我认为你们应该考虑减少教程（人们可以在网上找到这些），转而追求更多深度内容。


    ## Canonical 真的在杀死 Ubuntu 吗？不，它只是在准备 IPO 期间，对桌面操作系统的支持变得更加务实。


    最后，正如我们在对 Will Cooke 采访的这条推文中所看到的——在 Twitter 上关注我们，通过基于会话的扩展来定制桌面体验。没什么好。查看我们在
    ppa 的 Ubuntu 特色。你可以关注从 Ubuntu 灰烬中产生的社区项目。例如 Mint，最新的内核更新已经移植到 Debian 和 Ubuntu
    16.04 LTS。进展虽然缓慢，但最近的更新提供了更流畅的体验——尽管现在还是早期阶段，用户仍然会遇到死机。


    '
