    working with researchers on scientific problems and writing Android apps.


    If you have installed Anaconda, the port for the Raspberry Pi will install it.
    Once that is done, you will need to set it up. The assumption will be that you
    are using your Raspberry Pi headless, so in that case, you will also need to use
    some terminal virtualization, such as screen or tmux.


    Depending on the version of Jupyter, you may see that there is a set log. To make
    this a security measure, you will need to enter the URL to your Raspberry Pi in
    order to connect to the server.


    ```bash

    sudo apt-get install tmux

    ```


    Now that you have a Jupyter server running, what can you do with it? When you
    first load it, you see a dashboard of any existing notebooks. If it is your first
    time, it will be empty. There is a new button which will allow you to create a
    new notebook. Then start it with the command `tmux attach`.


    ```bash

    This is how you can easily log back into the Pi and reattach to the tmux instance
    in order to work with your process. There are a large number of options available
    when starting Jupyter which can be expressed as command-line options. That means
    you need to remember what options are:


    - `--notebook-dir`

    - `--no-browser`


    By default, Jupyter wants to open a browser automatically when starting up, which
    is not what we want on a remote machine. So use `--no-browser` and set its value.
    The most common option that will need to be changed is the port.


