  - '[PAGE 20]


    # QUICK GUIDE


    # Snaps on Ubuntu 17.10


    Snaps, by universal Linux packaging format, are set to get bug free in Ubuntu
    17.10. Snaps are designed with all the dependencies an application needs, reducing
    the common issues with mixing libraries and the need to repack multiple times
    for different distributions. Snaps are front and center—the ''featured'' banner
    in the Ubuntu Store now provides snaps by default and is easy to install any only-packaged
    apps. An Ubuntu login is required to use mobile apps on Android and iOS.


    system search functionality has had a huge overhaul and is improved, with various
    settings now included in the results. The settings interface looks more polished
    than before and in the new updated displays settings, support for HIDPI is improved.
    Integration with Unity for support still feels short compared to only scaling,
    although this is stated to be fixed with enough investment resources in this area.


    LightDM and the Unity Greeter are no longer the first thing you see as Ubuntu—instead,
    the GNOME Display is. The classic Ubuntu


    ''Ambience'' styling makes an appearance, with signature aubergine and orange
    present and current!


    # It''s the Weyland forward


    After much debate, it was decided that Artful would use the Wayland server instead
    of X1. Despite being not ready for prime-time, it appears to be working well for
    the most users. Why Wayland? The X graphs are faster and more modern—although
    this is not anything of its versatility. It''s also a side effect of many fixed
    hacks in the X window system control stack, which will be better performing, more
    efficient, and as importantly, more maintainable.


    Canonical has been forging ahead to expect become default with Unity 8, development
    is effectively stopped from a desktop focus the focus shifting to using Mir on
    IoT devices.


    Artful also ships with a 4.13 kernel, which brings a range of hardware support—not
    only for the latest but also for older machines, like boards such as the Raspberry
    Pi, BeagleBone6 and Rockship RV1108. Thunderbolt support brings improvements to
    many of systems which have included and are now more security improvements. The
    next kernel, 4.14, is a LTS release, so there''s plenty claimed ahead of the next
    release lockdown.


    # QUICK TIP


    If you like to test the latest kernel out of your distro, the UKUK tool is available:
    use add-apt-repository ppa:ppeee2014/stable followed by sudo apt update && sudo
    apt install linux-ubuntu Works nicely with Wayland just yet.


    # Cutting-edge kernel


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_20_0.png)


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_20_1.png)


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_20_2.png)


    # Upgrading the terminal


    If you''re running Ubuntu on 17.10, but you prefer to work in a terminal, do this
    first. Ensure the update application is installed with sudo apt install update-ubuntu-core
    / Ensure that update-release-upgrades is set to ''normal'' (if not an LTS release,
    your system will only update to LTS releases by default, then launch the update
    tool with do-release-upgrade.


    # Dealing with Weyland issues


    Although Ubuntu 17.10 is built with a Weyland session, you may need to boot out
    of X session (the display server) if you experience issues (often manifest as
    flickering). You just need to click the ''cog'' icon in DEM (the login screen)
    and select the alternative session. Your choice will be remembered as default
    for next time you log in.


    # Retaining access to Unity


    If you can''t just get out of Ubuntu or you want to keep the period of transition,
    then when you are upgrading in place or adding GDM to a fresh install, just install
    the package with sudo apt and the option will appear. This type of course applies
    to other desktop environments: you can run KDE, MATE, Cinnamon and such alongside
    your choices.


