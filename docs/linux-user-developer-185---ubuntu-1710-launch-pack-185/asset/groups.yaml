    # 开源


    06 新闻与观点 | 10 字母 | 12 访谈 | 16 内核周


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_5_0.png)


    ## 硬件


    ## 你的 Wi-Fi 网络被破解了吗？


    Ubuntu 及其他主流 Linux 发行版发布了新漏洞，以解决一个惊人的安全漏洞。


    WPA 协议中的漏洞于去年夏天发现，并由比利时安全研究人员 Matthew Vanhoef 公之。


    这种被称为“CRACK”（密钥重装攻击）的漏洞利用了 WPA 握手强制客户端设备访问和处理加密密钥的缺陷。CRACK 攻击使攻击者强制客户端设备使用之前过的加密密钥，而该密钥应该只使用一次。当密钥被重用时，加密就可以被绕过，允许攻击者破解
    wifi。


    明确的是，CRACK 对你的网网络安全构成了威胁。网上银行、网上购物和社交网络都面临风险。网上银行和其他金融交易现在非常脆弱。


    通过破解加密，攻击者将拥有自己的数字钥匙，以观察（并复制）每次在线交易的凭据（以及细节）。事实上，CRACK 是一种极佳的攻击，为政府提供了加密后门。正如
    Vanhoef 所言：“这种攻击不仅限于恢复登录凭据（例如电子邮件地址和密码）。通常，任何依赖于所用设备和网络设置的数据或信息，无论加密密钥（消息内容），都可能解密数据。”


    因此，macOS、iOS 和 Android 设备都收到了补丁，路由器也是如此。对于 Linux 来说，CRACK 攻击了许多 Android 设备，需要在从
    panda 到基于 Linux 的物联网应用等各种范围的系统进行补丁。该平台漏洞仍然是一个问题，大多数已经解决。仍有 50% 的仍在修复中。


    关于 Linux 话题，Vanhoef 解释道：“这种攻击对于版本 2.4 及以上的 wpa.（Linux 上常用的 Wi-Fi 客户端）来说特别是灾难性的。在这里，加密密钥将安装一个全零加密密钥……这使得拦截变得轻而易举”


    > 非常想切换到以太网连接以保护易受设备


    许多 Linux 发行版有旧的更新来修复该漏洞，但延迟设备——如路由器和媒体中心——可能会受到影响。即使设备过时，短期解决方案可能仍然有效。如果可能，请切换到以太网，并在公共场所使用你手机的热点功能。使用
    VPN 可能会防止 CRACK 攻击的成功。同时，如果你正在使用 IoT 设备，请向制造商检查补丁。如果没有提供，请在发布补丁之前避免使用该设备。


    ## 硬件


    ## Intel 管理引擎被禁用，Linux 命中目标


    Purism 面临严巨挑战并继续增强笔记本电脑安全


    对于安全意识开源硬件开发者 Purism 来说，这是忙碌的一个月——具有安全意识的用户禁用了 Intel 管理引擎（ME）。在过去的十年里，研究人员一直试图绕过或破解
    ME，它作为 Intel 技术专属存在于几乎所有现代笔记本电脑中。这个辅助 CPU 在关机时可以控制电脑，被许多人视为安全风险。Purism 的 Youness
    表示：“管理引擎完全是禁用它之后的下一步。Coreboot 也会提供必要的安全保障。”与此同时，Purism 发布了针对现有设备的更新以禁用 ME。


    Purism 创始人兼首席执行官 Todd Weaver 解释说，他们将在未来 12 个月内增加“开发和制造”。该公司计划聘用低级软件开发人员、用于 5 英寸全触摸接口的
    GNU/Linux、商业测试以及 KDE/Plama 和 GNOME/GTK+ 中间件的开发人员。到 2018 年初，开发者将准备就，手机届时也会准备就。但
    Weaver 确保这不会止于此。“然后我们进入增长阶段，专注于 Linux 笔记本电脑，主要是硬件的增量改进、软件发布，以及对 VPN、地图等基础支持将持续进行，这也许是最需要的产品支持。”


    “由于市场上还没有像我们这样的合伦理设备——我们有一项长期战略，即从安全通信到 Android/iOS 替代设备逐步扩大市场。” Weaver 明确表示，“通过创建一个可信的、用户控制的手机来颠覆市场，正是我们的目标。”


