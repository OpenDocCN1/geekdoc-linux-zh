    # OpenSource


    06 News & Opinion | 10 Letters | 12 Interview | 16 Kernel Weekly


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_5_0.png)


    ## HARDWARE


    ## Has your Wi-Fi network been CRACKED?


    New flaw has been released for Ubuntu and other key Linux distributions to address
    a stunning security weakness.


    Weaknesses in the WPA protocol were discovered last summer and made public by
    Belgian security researcher Matthew Vanhoef.


    Dubbed ''CRACK'' (Key Reinstallation Attack), the exploit exploits flaws in how
    the WPA handshake forces the client device to access and process encryption keys.
    The CRACK attack enables the attacker to force the client device to use a previously
    used encryption key, which should only be used once. When the key is reused, the
    encryption can be bypassed, allowing the attacker to crack wifi.


    To clear, CRACK poses a risk to the safety of your internet. Online banking, online
    shopping and social networking are at risk. Online banking and other financial
    transactions are now vulnerable.


    By cracking the encryption, an attacker will have their own digital than, to observe
    (and copy) the credentials (and other details) of every online transaction. Indeed,
    CRACK is an excellent attack giving governments backwards into encryption. As
    Vanhoef notes, "The attack is not limited to recovering login credentials (i.e.
    email addresses and passwords). In general, any data or information that depends
    on the device being used and the network setup, it is possible to decrypt data
    regardless of the voting key (the content of a message)."


    So, macOS, iOS and Android devices have all received patches, as routers do. For
    Linux, CRACK attacks many Android devices on the plant needing patches across
    various ranges of systems, from panda to Linux-based Internet of Things applications.
    The platform vulnerability is still an issue, which will be met at most. 50 cent
    of all still work to fix.


    On the topic of Linux, Vanhoef explains: "The attack is especially catastrophic
    against version 2.4 and above wpa., a Wi-Fi client commonly used on Linux. Here,
    the encryption key will install an all-zero encryption key [...]. This makes it
    trivial to intercept and"


    > Absolutely want to switch to an Ethernet connection to protect vulnerable devices


    Many Linux distros have older updates to patch the flaw, however lag devices -
    such as routers and media centers - may be affected. Even if it''s outdated, short-term
    solutions might still work. Switching to Ethernet whether possible, and in public,
    using your phone''s tethering feature. Using a VPN might prevent a successful
    CRACK attack. Meanwhile, if you''re using IoT devices, check with the manufacturer
    for a patch. If none is forthcoming, avoid using the device until a patch is issued.


