    ## 特性


    ## 算法艺术家


    Dave Makin 创作的《矿山》开创了生成式艺术图谱化


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_63_0.png)


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_63_1.png)


    上方是 Dave Makin 创作的名为《所罗门王矿山》的分形艺术品。


    右上是哈罗德·科恩（Harold Cohen），他是生成式艺术的先驱。


    右侧是西奥多洛斯·帕帕西奥杜（Theodoros Papatheodou），他利用 EEG 脑波进行绘画。这是关于对他们图谱化死亡思考。


    他意识到，这并没有提供完美的解决方案。“真正的绘画是一个无意识、自动的过程，图像中的每个像素获得的关注度与其他像素完全相同，”他解释道，“历史上从未有过任何由人类生成的图像是这样制作的。在
    AARON 的后来的变体中，这种困境通过放弃我生成单色图像的独占角色解决了，这些图像随后由手工上色。”现在，我在为这个过程能够做到的事情做出贡献，并在自由地使用合作者，”哈罗德说。


    ## 脑波艺术


    群行为是许多“代理”的集体运动，它们遵循简单的规则来引导自己的行为。每个代理都被表示为在画布上移动的小画笔，留下墨水痕迹。从原始脑波中提取的情绪数据被输入到群可视化系统中。


    一种生成式群绘画，代表了每个人的心理状态，产生了复杂的、不重复的色彩图案。这些画成为盛世广告（Saatchi & Saatchi）身份认同的重要组成部分，并在伦敦的画廊展出。


    ## 分形几何作为艺术


    分形近年来引起了人们的极大兴趣。从数学奇景如著名的曼德博罗集合（Mandelbrot set），到三维立方体以及可以模仿自然的所谓分形系统，分形是无限复杂的，尽管它们可以通过一组简单的规则生成。分形艺术家大卫·梅因（David
    Maine）说，分形是他人生中的第二次启示，第一次是计算机编程。他现在正将分形几何的数学公式转化为艺术品。


    大卫描述了这种痴迷是如何开始的。“1999年，当我有一些空闲时间时，我遇到了大多数现代分形软件的祖先。Fractal 是一个 DGS 程序，界面有点笨拙，但它能够从各种分形类型产生一些惊人的结果，甚至有一个基础界面让你尝试你自己的分形。


    尽管通过分形可以实现这种多样性，但大卫发现他可以使用第三方软件而不是自己的软件来追求爱好。“在玩了 Fractal 之后（在 mM 出现之前它并不存在），我扩展了这一功能，允许用户使用更高级的编程语言编写自己的分形。”


    “至于我的分形艺术作品，它们通常最初源于对新技术或公式的探索，然后对其进行创作。这有点像风景摄影师寻找完美的视角，然后在构图和上色上，可能使用多层叠加，就像摄影师调整光线和场景，并不断锐化，直到我对结果满意。”


    ## 关于 Processing 的轶事


    “我尝试过成为一名真正的程序员，我真的尝试过。但我没有获得计算机科学学位，一年半后退学了。很抱歉，但这让我无聊得要命。这对于一个生成式艺术家来说可能是一个令人惊讶的陈述，而且它出现在他的书籍《生成式艺术：Processing
    使用实用指南》中，这是一本艺术家的指南


    ## 快速指南


    ## Processing – 语言


    虽然生成式语言几乎可以被产生，但有一个特殊地方对生成式艺术家很有意义。名为 Processing 的工具旨在视觉环境中教授编程基础知识，尽管它的成功已经超出了教育领域，现在被许多艺术家使用。根据其开发者的话，Processing
    促进了视觉艺术内的软件素养，以及该语言和 IDE，见 https://processing.org


    尽管 Processing 是作为初学者语言开发的，但它包含了现代概念。它是开源的，且免费的。适用于 macOS 和 Windows。


    这种随机性是令人惊讶的。它是视觉艺术的。它是开源的，且免费的。适用于 macOS 和 Windows。


