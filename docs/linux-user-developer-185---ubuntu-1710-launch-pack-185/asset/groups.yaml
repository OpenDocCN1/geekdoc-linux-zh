    # Review Terminal emulators


    # ROXTerm


    # Sakura


    The approachable geek''s terminal that packs advanced features


    The bare-bones no-frills emulator that does the job


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_81_0.png)


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_81_1.png)


    +   - Advanced uses of any of the three D-Bus methods to take charge of terminals
    from other apps and scripts


    +   - Take a look at Sakura''s man for a list of default keycodes and how to customise
    them


    # Multitasking


    ROXTerm supports multiple tabs and detects the tab by default, even if there is
    one tab. The tabs can be detected, and rearranged for better management. You can
    switch between open tabs using the menu or the keyboard. The tab menu also houses
    options to customize a particular tab or all others besides the one selected.


    # Multitasking


    Although it''s a tab bar by default, Sakura supports multiple tabs that you can
    name for management. You can also change the default behaviour and always display
    a tab bar even at the bottom of the window. However, while you can rearrange tabs
    inside Sakura, you can move them into a new window.


    # Customization


    ROXTerm allows you to create profiles, with a different set of parameters, to
    define every feature from schemes to colour shortcuts. Tabs and windows inherit
    customization from the window or tab they opened. You can switch profiles and
    use the Configuration Manager to create custom ones.


    # Customization


    Sakura has the ability to define customization inside multiple profiles. You can
    select the colour, font and a set of types for Sakura''s terminal window. Sakura
    supports three types of cursors that can also be made like in the good old days.
    You can also enable the display of a scroll bar.


    # Appearance


    ROXTerm allows you to define the default size of the terminal window, including
    the option to run full-screen. ROXTerm also allows you to define text, colour
    and contrast. It has the ability to detect web and SSH windows when you hover
    over them in the terminal window.


    # Appearance


    The look of this emulator is rather plain and uninviting, You''ll have to spend
    a couple of minutes to increase its visual appeal. Sakura allows you to change
    its opacity and colour scheme and run it full-screen. It enables the default typeface
    on the terminal font, but you can dial it back to.


    # Usability


    ROXTerm is very good with defaults and can be used without configuration tweaks.
    Using the File > Session option, you can save the state of all open windows and
    tabs, with their content. You can drag text into the terminal window if you drag
    files and URLs, it will copy their location instead of them


    # Usability


    Sakura is a simple text editor and isn''t very difficult to configure, making
    it appealing to newcomers. Dragging and dropping files has no effect, however,
    it allows you to insert links in external applications using Ctrl + + keys. The
    best thing about Sakura is that it works well on underpowered machines.


    # Overall


    A lightweight terminal emulator with easy-to-use config settings. Its Configuration
    Manager and ability to detect web and SSH windows make it a useful option for
    occasional terminal users.


    # Overall


    If you use a terminal very rarely, Sakura can help you save some resources. It
    offers just the bare functionality, but what sets it apart from the others is
    its minuscule hardware footprint.'
