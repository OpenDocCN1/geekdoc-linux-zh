  mdcn: "\n\n## Canonical 访谈\n\n## 转型中的 Ubuntu\n\n我们在 17.10 版本发布时对 Canonical 进行了访谈，以规划他们从\
    \ Unity 转向 GNOME 的路线，并评估了这一重大转变对用户的反响如何。\n\n![](img/84ab224de9f66d5fe3638204a9a78c1c_11_0.png)\n\
    \n> 在 Canonical 创始人兼首席执行官马克·沙特（Mark Shuttleworth）宣布 Unity 项目终结六个月后，Canonical 的员工竟然将\
    \ Unity 8 描述为“糟糕的投资”，这很奇怪。Canonical 的桌面管理器 Will Cooke 在我们在版本发布当天与他交谈时，对这种新叙述显得相当从容，尽管他更倾向于使用“与\
    \ Unity 8 的关系”而非“关闭”，后者似乎留了 Unity 8 在未来可能从其“烘焙区”中退出的可能性。“Will 说，显示服务器仍然存在并正在开发中，这对于我们目前在桌面上使用\
    \ Wayland 来说特别有趣。然而，随着 Wayland 如今获得广泛支持，Ubuntu 桌面团队对 Wayland 的支持似乎并不希望马克·沙特在 Ubuntu\
    \ 桌面上的默认显示服务器蓬勃发展。默认使用 GNOME 3 将回归默认。Ubuntu 17.10 是这个对 Linux 至关重要的发行版的一个十字路口，因此在这次访谈中，我们主要关注过渡问题。\n\
    \n你能告诉我们 17.10 的准备工作进展如何吗？\n\n我们认为 GNOME Shell 是我们用户的正确工具包。我们使用 Unity 六、七年了，所有的核心套程序都是围绕\
    \ GNOME 桌面构建的，所以转向 GNOME 是合合理的。在桌面上同时使用 Unity 7 和 GNOME 原本希望是简单、流畅且快速的，我们也确实做到了。现在我们在\
    \ Ubuntu 上拥有了最新的 GNOME 桌面运行器。\n\nWill Cooke 是 Canonical 的桌面管理器。准确地说，他曾是 Ubuntu\
    \ 的产品策略工程经理。\n\n我们认为，在过去六七年里使用 Unity 时进行的一些调整，在我们使用的桌面上仍然非常需要。我们为屏幕启动器（screen\
    \ launcher）做的所有调整对于新桌面仍然适用。我们在其中添加了几个扩展来启动状态栏，并添加了一些我们认为 GNOME 桌面中缺失的功能……所有这些工作都在\
    \ GNOME 社区的许可下完成，并在扩展社区的许可和支持下，我们添加的功能是上游的而不是自行托管。\n\n这是因为当我们想要升级 17.10 时，希望能看到熟悉的、让你感到如家的东西。\n\
    \n我们为了改进 Ubuntu 所做的一切更改完全是临时。当你登录时，这些更改会生效；当你注销时，它们就会消失。你的设置将与你绑定，但我们所做的所有调整都是即时的，因此没有回到\
    \ Unity 或源代码的路径来让它按照我们想要的方式运行。它是上游的 GNOME，只是进行了一些微调。\n\n![](img/84ab224de9f66d5fe3638204a9a78c1c_11_1.png)\n\
    \n## 激活社区\n\n为了配合 17.10 的发布，Canonical 开设了一个新的社区中心 https://community.ubuntu.com，Will\
    \ 说，这是让人们更容易参与 Ubuntu 的方式。\n我们有很多不同的地方供人们参与并寻找同类人，例如 Ask Ubuntu (https://askubuntu.com)\
    \ 和 Launchpad (https://launchpad.net/ubuntu) 以及其他所有平台，但我们想把东西放在中心位置，让人们知道从哪里开始。\n\
    希望它更现代的设计能让人们更容易参与并对类似的事情感兴趣。\n\nCooke 说，一旦基础建立起来，他们计划了各种活动：“首先，我们想为 18.04 设计一个社区驱动的主题。我们的团队希望……”\n\
    \n在 17.10 上，Wayland 是由于我们目前在桌面上使用 Wayland，所以 Ubuntu 桌面团队 Ubuntu 社区支持。\n\n![](img/84ab224de9f66d5fe3638204a9a78c1c_12_0.png)\n\
    \n| 类别 | 类型 | 标签 |\n| :--- | :--- | :--- |\n| 公告 | | Ubuntu 社区 |\n| 文档 | | 17.10\
    \ |\n| Bug | | 17.10 |\n| 服务 | | Ubuntu 桌面 |\n| 特性 | | 17.10 |\n| 事件 | | Ubuntu\
    \ 社区 |\n| 翻译 | | Ubuntu |\n| 通用 | | Ubuntu |\n\nCooke 提到：“Wayland 是未来，我认为通过测试它并对于，公开支持\
    \ Wayland 并希望更多地转向它，我们将获得关键的采用规模，让数以百万计的用户在日常机器上测试它。Wayland 将是我们正尝试构建的关键，对于通用易用性、工具改进和稳定性修复。GNOME\
    \ 在修复了许多隐藏在角落的 Bug 后已经相当稳定，所以仅仅改进 GNOME 工具包及其速度和可靠性是我在这种情况下关注的重点，因为它是一个 LTS（长期支持版），一切都必须稳如磐山。”\n\
    \n## 开源\n\n## 讨论下一个版本总是好的，但 GNOME 的哪些默认体验（例如透镜 HUD、全局菜单）你认为你们想在 18.04 中包含，还是说更多取决于用户深入研究\
    \ GNOME 扩展？\n\n## 默认使用 Netplan\n\nNetplan 是一种广泛使用的工具，用于定义桌面和服务器的网络配置。随着时间的推移，网络配置在\
    \ NetworkManager 和 ifup 之间变得碎片，17.10 将其引入作为标准。它的接口是兼容的，同时提供整个系统的概览。\n\n```\n/etc/netplan/yaml\n\
    netplan:\n  generate:\n    backend: config\nsystemd-network\n```\n\nNetplan 可以设置绑定、桥接、VLAN、独立网络接口，并可以针对静态或\
    \ DHCP 地址实现\n\n"
