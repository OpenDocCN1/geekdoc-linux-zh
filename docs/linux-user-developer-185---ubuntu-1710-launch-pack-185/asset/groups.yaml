    \n- **QUICK TIP: Wayland issues**: If you are having issues with Wayland apps\
    \ do not handle properly you can still use Xorg by changing your selection at\
    \ the new GNOME login screen.\n\nUbuntu 11.04 'Natty' was released in April 2011,\
    \ the first version to use Unity by default, although the previously default GNOME\
    \ was still available as an option. The move to Unity was hugely controversial,\
    \ not least because fans of GNOME feared the change would jeopardize its future.\
    \ The 11.10 'Ocelot' release took a step further, no longer including GNOME, allowing\
    \ Ubuntu founder Mark Shuttleworth to provide a unified interface across multiple\
    \ devices - laptops, tablets, phones and TVs. Over the years, the mobile phone\
    \ space became dominated by iOS and Android, and the tablet market came to be\
