    # Tutorial Laptop power management


    ## Easily improve battery life on your Linux laptop


    Laptop batteries tend to discharge quicker under Linux. Tweak a few settings to
    enjoy more time between charges.


    Whether your Linux laptop previously had a proprietary operating system, or is
    set up to dual boot, you''ve probably noticed - a nagging inconvenience that doesn''t
    go away. But it''s that your laptop battery doesn''t last as long under Linux.


    There are several practical solutions to this, such as replacing video drivers,
    enabling a portable battery pack back, behavioural changes, and tweaking settings
    can all contribute to better battery life. The result will be your laptop keeps
    charge longer on Linux.


    Open your distribution''s built-in settings to get started. The location for this
    will differ between Ubuntu and Fedora, you''ll need to open System Power. Here,
    tweak how quickly the power manager adjusts, and settings for when the computer
    becomes inactive. A short time, such as five minutes, is how avoidable avoidable
    battery is critically low. Suspend is a good option, and if it means your laptop
    is ready to be resumed when you find a power supply.


    Having the display switch off is also a good option (see Brightness doc), and
    if there''s a Reduce brightness toggle, enable it.


    Beyond power, there are other things to consider for improved battery performance.
    One of these is disabling wireless internet - Bluetooth can be a problem. While
    low-power 4G LTE is available in some laptops, some older laptops use adapters
    that aren''t compatible with the newer version of Bluetooth. For networking, disabling
    this will not help in you prevent power-drawing web apps (things that regularly
    update in the background, like Gmail) from having an impact. Both Bluetooth and
    wireless networking can be disabled from the panel, if your laptop has an airplane
    mode button, but only for that fast connection.


    Looking for other ways to reduce your laptop''s battery usage? Removable media
    can also help. Any sort of USB drive, SD card and so requires constant power to
    remain mounted and browsable, so devices can save battery life.


    Mechanical drives will naturally eat up battery life. You can''t do too much about
    your laptop''s hard drive, but ejecting CDs and DVDs when you''re not in use also.
    If you use the optical drive, then remove it out; it shouldn''t be too hard to
    acquire a bezel to attach to your laptop for the gap. If that isn''t possible,
    or prefer a more practical solution, the best is to use an HDD or SSD.


    ## Removable media and Flash


    Adobe flash is another matter. If it''s set to run in 2020, it will also save
    you battery. Only a relic of the times does it cause a crash on your laptop''s
    battery life.


    You have several options with Flash. First, you can simply disable it. This forward
    action will save you plenty of energy with whatever software and hardware available.
    Specifically, you can block Flash to prevent videos and media from auto-playing.
    In Mozilla Firefox, open Add-ons > Plugins and find Flash Showcase. Use the ''Activate''
    option to control Flash. If you prefer to be asked, select ''Ask'' first; Google
    Chrome users can use the chrome://flags/search to find HTML5 video playback block
    option.


    Everything we''ve looked so far you should have a noticeable increase in your
    Linux laptop''s battery life. But you can go even further with TLP which is a
    great piece of customizable software that can be used to manage your system''s
    power use. Installation of TLP will help you first a PPA.


    ```bash

    sudo add-apt-repository ppa:linuxrunner/tlp

    ```


    Follow the on-screen prompts, then update and install:


    ```bash

    sudo apt install tlp-rdw

    sudo apt run tlp-start

    ```


    When you''re ready, run sudo tlp start. This will load the default settings. To
    view and edit these, open the config file in your text editor with nano /etc/tlp.conf.
    Here, you''ll find settings to enable or disable TLP and you can find much more.
    But it can be a bit tricky tweaking in a laptop-window. For, there''s a graphical
    front-end available at tlp-utils.github.io/ to edit the zip file and its contents.
    Terminate the executable in the directory, and run ~/.tlp. Once the configuration
    is set, the user interface will be easy to navigate through tabs, find power settings
    that you can adjust. You''ll find the option to Enable TLP (TLP_ENABLE), and in
    the Audio tab enable or disable audio power saving. It''s likely you''ll want
    to do so, but disabling audio power saving is more effective than hitting the
    Mute button.


    # Advanced Linux power management


    Next, move onto disks. If you''ve found various hard disk drives at the top of
