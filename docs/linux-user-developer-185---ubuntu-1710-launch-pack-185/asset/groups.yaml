    \ AARON 是一种更常见的生成艺术媒介，而且与 Springer 的第一本节目不同，本文介绍的图像也是如此。如果一个生成艺术家可以为每一件作品编写程序，那么提供软件手段和自主性要常见得多；或者，艺术家可能会选择委托控制权以提供独特的交互体验。除此之外，我们不想纠结于什么是生成艺术什么是不是，就此而言，一些人坚持认为即使使用第三方软件包制作作品，艺术家也必须编写代码。同样，我们不想这样具有局限性。如果我们接受这个定义，并且它悦目或悦耳——尽管这显然需要大量工作——我们乐意将其包含，一个广义的生成艺术定义将足够。\n\
    \n## 生成艺术先驱\n\n哈罗德·科恩（Harold Cohen）被许多人通过他的开创性工作为今天的生成艺术奠定了基础。这位出生英国的艺术家可能是最早使用生成艺术的人之一。AARON\
    \ 不是一个完成品，而是 Cohen 在 1973 年编写的一个复杂程序；“AARON”可能是计算历史上最老的持续开发的程序。然而，到开发时已经增加了许多。虽然许多目前的生成艺术家使用数学规则，但\
    \ AARON 是人工智能的一项实验。特别是，它模拟了各种艺术形式的行为，正如我们在这里试图说明的那样。\n\n因此，程序的开发可以类比为人类认知过程的发展。相反，作为程序员，哈罗德可以被视为现实世界感知软件的创造者。因此，除了能够产生大部分抽象图像外，程序随着时间的推移而不断演变，因为\
    \ AARON 对植物生长的描述足够通用，允许生成各种树；同时，AARON 被教授了人体结构。\n\n在某种意义上，在其开发的很大时期，它领先于时代，因为当时没有足够的彩色打印技术。由于这个原因，哈罗德·科恩投入了精力开发过程驱动的绘画机器。\n\
