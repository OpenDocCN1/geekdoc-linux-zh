    # Welcome to issue 18

    This Linux User & Developer


    ## Master Ubuntu 17.10, p18

    ## Machine learning with TensorFlow, p54

    ## Build a robot sentry, p40


    Welcome to the issue and North America''s favourite Linux & FOSS magazine.


    I discovered recently that ''aardaard'' means ''earth'' in Afrikaans. We were
    just going to view the review of Aart, a grounded and pragmatic approach to moving
    to the GNOME desktop, or more like putting list on a page. Send us an email and
    let us know what you think! In the meantime, there''s a look up in Ubuntu 17.10,
    so dive into our next feature (see p18) - we''ve got a little automation thing
    running, with a feature of creative artists - for example, autonomous programs
    to paint pictures from a person''s mental state. We''ve also got a guide to the
    machine learning library, TensorFlow (see p54) and another short feature on the
    day how to set up a Raspberry Pi (see p98)


    Chris Thornhill


