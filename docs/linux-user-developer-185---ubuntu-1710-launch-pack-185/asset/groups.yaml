    \ | check for updates (daily) | |\n| when there are security updates | download\
    \ and install automatically | | |\n| let-me-notify | for new versions | | |\n\n\
    ![](img/84ab224de9f66d5fe3638204a9a78c1c_19_2.png)\n\n- **Trying the ISO**: Before\
    \ you update your machine it is a good idea to try the live-boot tool and everything\
    \ working. Although support is typically improved in new releases, there is reason\
    \ to wait before updating. You'll notice that for the 17.10 release there are\
    \ no longer 32-bit ISOs - this is unlikely to affect most users on modern hardware,\
    \ however.\n\n- **Back up your data**: Before upgrading, you should back up your\
    \ data. We know that something might go wrong. Even if you have backups (and you\
    \ always should), it's better than sorry. If you want to be ultra-efficient and\
