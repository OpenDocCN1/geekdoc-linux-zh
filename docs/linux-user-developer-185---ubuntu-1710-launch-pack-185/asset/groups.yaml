- md: "\n# InspiringOS The quest for the open science\n\n## QUICK FACT\nRed Gate lends\
    \ a hand a\nIt's not often you get a call from a company asking if you want a\
    \ team of software engineers for free a week, but Red Gate Software picked WaterScope\
    \ as its wildcard for a Down Tools and helped with UI and documentation work.\n\
    \n![](img/84ab224de9f66d5fe3638204a9a78c1c_31_0.png)\n\nPointed it at the object\
    \ he wanted to look at - putting the lens distance away from the sensor - it would\
    \ function as a microscope. \n\nSurprisingly, the difficulty of aspect microscopy\
    \ is nothing but the mechanics. With objects that are millions of metres across\
    \ require a very high-powered microscope to see anything and at that point the\
    \ focus of your microscope is less than a millimeter. Using a larger model of\
    \ the 3D-printed OpenFlexure microscope (pictured, top p31), Bowman describes\
    \ the problem: \"If your sample wobbles even by a micron [the width of a human\
    \ hair], you could ruin everything.\"\n\nThe expensive part for serious science\
    \ work, then, building a mechanical stage for fine control of what you want to\
    \ measure, the mechanical stage might then cost you £1,000 or easily more than\
    \ that. When Bowman began a project with a sample of WaterScope (p30), you can\
    \ see the iterations of the image (pictured in the main image, top p31), the step\
