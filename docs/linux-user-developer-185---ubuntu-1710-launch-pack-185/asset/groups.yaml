    我们仍然会保持 Ubuntu 的高辨识度。我们有出色的色彩风格，对于如何工作以及用户也有自己的见解，用户会告诉我们他们想要工作的方式。我不认为会有太大摩擦；我认为我们为
    Ubuntu 版本设置安装 GNOME 桌面的方式，意味着每个人都能相对容易地上手并使用。我不认为我们很快就会采用默认的 GNOME 体验。我们预预期将有一个启动器，会有其他可以微调的部分，但
    GNOME 的设计将通过我们的修改而脱颖而出。我们完全不会隐藏它。我们希望人们能获得它的精华。


    ## 提到 GNOME，你最看中的是什么？


    嗯，Dash（启动器），对我来说，发现可以最快速访问所有应用程序是关键——那个收藏的启动器，它让我的工作流变得顺畅得多。我不知道这是否是我长期以来一直使用
    Ubuntu的原因，还是因为它是获取我所需内容更简单的方法。坦率说，这有点麻烦。


    ## Ubuntu 回归 GTK+，Ubuntu 对 Qt 的立场是什么？


    我们终于启动了现有的项目。我们正与 KDE 的同事们紧密合作。他们刚刚宣布首选的打包方式将是 snap，而我们有一系列 snap 构建版本。我不是团队的成员，但我们在
    Linux 领域看到了很多 Qt——它比 GNOME 稍微标准一些——像 cartoon（卡通）之类的东西。这与我们处理桌面技术的方法有所不同。


    ## 你如何看待未来五年 Ubuntu 桌面的变化？


    我们不会看到潮水般的人采用 Ubuntu 或 Linux 桌面。有趣的地方在于他们是否会使用网络浏览器，根据目前的趋势，开发应用程序的概念正变得越来越淡化——任何你可以通过浏览器完成的事情，到那时我们是想运行
    Windows 呢，或者如果你使用 Linux，是把它作为一个运行器呢？在那个节点，Ubuntu 和 Linux 比 Windows 强大得多，因此对于绝大多数人来说是一个可行的选择。我想，当他们晚上坐下来、在路上、学习并与人们聊天时……
    我们在想，既然可以免费获得操作系统，为什么要付钱呢？而且它还可以更安全、更可靠？


    Ubuntu 核心团队正在管理在使用 Ubuntu 时 Unity 带来的突兀的体验，而这不需要开发 GNOME Shell。


    考虑到实用性，你是否担心桌面操作系统没有足够的资金来进行首要任务？或者这是一种误解？


    Ubuntu 的桌面应用已预装在他们的机器上。我们在桌面方面的工作直接连接到服务器，并且比云端更慷慨；在云端，他们会更想在笔记本电脑上运行，因为他们可以测试它们是否和云端一样好。他们可以在笔记本电脑上一整天获得相同的软件体验，例如在他们开始工作之前，就像在云端一样。因此，Ubuntu
    桌面很受欢迎，它产生了收入，并且在日常开发和使用我们部署的内容上相同的模式，这对开发者来说是一个非常有吸引力的故事。


    你特别喜欢发布版本中的实用性吗？


    这有点底层了，但我们非常喜欢这一点：我们在发布中进行的所有自定义都不会影响运行 GNOME 桌面会话的能力。我们已经说过，这是 Ubuntu 桌面，仅此而已。我们的设置之一以及什么样的东西会影响该会话。如果只是纯粹的用户偏好，我们已经让它变得非常容易。我觉得这对我们很好，因为我们完全没有试图阻止
    GNOME 在 Ubuntu 上的决策。它们就在那里。我们略有不同，但两者可以完美共存。我认为这是我们关系的一个很好的比喻。


    > 最终，GNOME 的设计是为了通过我们的修改而脱颖而出。我们完全不会尝试隐藏它。


    ## 开源


    ### 你的 Linux 新闻与观点来源


    ## 观点


    ### 内核专


    Jon Masters 总结了 Linux 内核社区的最新动态。


    Torvalds 宣布了 Linux 4.14-rc7，这是 4.14 正式版之前的传统发布：在这种情况下，再次稳健。


    Linux 可能很快就会进入 RC 阶段。我们已经思考这几周了，“考虑到我们遇到过的问题”。虽然延迟会将 4.15 的合并窗口推迟到 3 月，但在我们的感恩节假期期间不允许有进一步的破坏性更改。


    填充正在使用的内存区域。CPU 包含硬件“漫游器”，每当执行内存访问时都会遍历这些区域。这需要一些时间。TLB 需要对每个访问的地址重复此过程。


    正如我们上周提到的，Linux 4.14 将包含支持，带来了新的‘Greg K+H’ 内核支持。4.14 将是一个 LTS（长期支持）内核，其支持将扩展到……

