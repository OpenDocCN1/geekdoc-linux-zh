    # InspiringOS 开放科学之追求


    ## 快速事实

    Red Gate 伸出援

    你很少会收到某公司打电话问你是否想要免费一周的软件工程师团队，但 Red Gate Software 选择了 WaterScope 作为其在 Down Tools
    活动中的“王牌项目”，并协助了 UI 和文档编写工作。


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_31_0.png)


    将其对准想要观察的物体——将镜头远离传感器一段——它就能像显微镜一样工作。


    惊讶的是，光学显微镜的难度完全在于机械结构。对于跨越数百万米的物体，需要高功率显微镜才能看到任何东西，而此时显微镜的焦点小于1毫米。Bowman 使用较大型号的3D
    打印 OpenFlexure 显微镜（如图所示，顶部第31页）描述了这个问题：“如果你的样本即使只抖动一个微米（头发的宽度），你也可能毁掉一切。”


    因此，对于严肃的科学工作，昂贵的部分在于构建一个用于精密控制测量对象的机械台，这个机械台的成本可能高达 1000 英镑甚至更多。当 Bowman 开始一个带有
    WaterScope 样本的项目（第30页）时，你可以看到图像的迭代（见主图，顶部第31页），这种进步展示了该显微镜作为一个“落射式”显微镜（放大倍数为 x330）的样本，其设计旨在允许
    X 和 Y 轴的自由控制和移动。使用更大的显微镜结构将非常复杂且无法制造：“你也无法移动它。”


    顶部的 WaterScope 项目结合了水质现场测试以及改善清洁饮用水获取的帮助。


    右侧：3D 打印显微镜根据 CERN 硬件许可协议授权。


    如今有 63 亿人无法获得安全的饮用水，因此 WaterScope 认为检测水中的细菌是一个如此漫长且困难的过程：“细菌检测既困难又不方便，所以这些人无法自行进行。你必须先收集水；用过滤器从瓶中提取水，然后通过网格更小的过滤器通过，最后让它们生长，18
    小时后寻找战斗的、恶性的细菌菌落。如果你在一个基础设施不良好的地方工作，肉眼就能很容易看到菌落，你可能无法获得干净的水龙头，而且你可能需要离开你所在地。


    > Bowman 较大的显微镜使用 Python 脚本，使用户能够围绕载玻片移动视视野。


    目标是添加更多功能，例如自动聚焦以及将所有图像缝合在一起形成数字表示的能力。


    WaterScope 是 Bowman 跟进的项目，源自 iTeams Cambridge 计划（该计划包括树莓派等过去的成功项目）。该计划的一部分专注于关注的创新……


    最好的方法是在较小规模上进行测试。毕竟，从单个细菌菌落开始，且设备小巧便携，不需要太多的医生。实验室是有希望的，如果你能找到细菌，就有可能知道你的是哪种细菌，而最后一部分正是我们目前正在努力的方向。


    32


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_32_0.png)


    # 科学硬件


    上方：OpenFlexure 自动化显微镜设计今年夏天在坦桑尼亚的斯萨姆经过了测试，并用回收瓶进行了 3D 打印。


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_32_1.png)


    上方：正如 Richard Bowman 指出的，你可以得到各种颜色的塑料，为什么要局限于黑色？


    ## 设计构建模块


    Bowman 博士目前正在为想要制造实验设备的人研究 3D 打印所需的“构建模块”。定制移动台和机械适配器等物品对他们至关重要，他知道。“如果你想让激光击光纤，”Bowman
    举例说明，“你需要精度优于微米的精密移动台，而且必须足够稳定，在实验过程中不会抖动。”他手工制的舞台已经足够好。Bowman 表示，不仅商业硬件价格惊人，“如果被锁在一个盒子里，对于电子产品来说可以，但对于科学仪器来说。”


    想法是获取一个小时生长过程的时间摄影视频并对其进行处理，以便计算细菌数量。我们使用这些图像数据来验证发生的一切。


    技术人员 [...] 如果我们的意思是同时运行十台显微镜，因为它们都是自动化的，那么“如果他们把病人转到医院，就可以提供数字或纸质载玻片，这样他们就不需要重复工作”


    我们有细菌正在生长。我们对自己制造的东西很有信心，但我们仍在努力识别是哪种细菌。


    '
