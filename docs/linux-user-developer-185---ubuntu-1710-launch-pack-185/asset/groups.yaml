    上面让 ESIL VM 引擎为你完成繁重的工作吧！无论如何，我们需要识别函数在使用什么类型的数据、在哪里找到它以及在哪里存储它的输出。当然，一旦你成功调试了它，应用在数据上的转换将会显现。


    在架构上，除非原始代码是用 GCC 未使用 EBP 寄存器（也称为帧指针）编译的，否则传递函数的任何参数都可以找到，因为它是相对于 EBP 的偏移。如果是负数，[ebp]
    是在函数内部定义的局部变量。在一个具有一个参数的函数的 C 程序中，它定义了一个局部变量。编译它并使用 GDB 或 R2 进行进行调试。如果你显式告诉 GCC
    不要使用帧指针并反汇编该函数，所有的引用都将来自 ESP 寄存器。


    从封面上获取一个代码段，反汇编并查找此代码中的变量，尝试证明相对于 esp 有两个正偏移。作为经验法则，它还会告诉你哪个是第一个参数，哪个是第二个参数。在
    x86 架构上，在我们提供的代码段中，参数按反序传递的（先是调用的最后一个参数，然后是最后一个，以此此类推），汇编代码将这些参数推入栈，然后函数调用参数。以上没问题，你不需要简单理解
