    ```bash

    sudo jupyter extension enable

    ```


    This will enable the kernel in the Jupyter cluster, where you can see all available
    clusters. To start a new cluster on the main Raspberry Pi, start the jupyter lab
    in terminal and execute the following command:


    ```bash

    jupyter lab

    ```


    This will create a cluster of Pi four, which will allow you to test your parallel
    code and ensure that it is using the cluster code comfortably with your parallel
    work. There are several different ways to handle the cluster, and in this example
    we have set up SSH keys on all of the participating Pis to login in without password.
