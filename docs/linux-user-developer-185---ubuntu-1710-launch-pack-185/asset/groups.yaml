    # 评测


    ## 终端模拟器


    ## 简评：我们的结论对比与总结


    | 多任务处理 | ROXTerm | Sakura | Terminator | Terminology |

    |---|---|---|---|---|

    | 多任务处理 | 支持多个标签页，可以轻松地命名、检测和重新连接 | 支持多个标签，但这些标签无法移动到窗口之外，这有点烦人 | 可以分标签页和拆分窗口以创建可配置的布局
    | 可以创建复杂的布局，并包含标签切换器以便在标签间跳转 |

    | 个性化 | 允许创建配置文件，甚至可以包含自定义快捷键 | 虽然可以定义和保存快捷键，但遗憾的是无法保存到配置文件中 | 将按键绑定和配置调整到配置文件
    | 支持多个主题；无法在配置文件中保存自定义设置 |

    | 外观 | 你可以更改字体、文本颜色、背景甚至光标 | 默认情况下看起来非常整洁，但可以通过少数选项进行调整 | 看起来很宽敞，但可以使用其配置进行调整
    | 唯一可以在应用内显示多个文件的模拟器 |

    | 可用性 | 开箱即用，无需任何调整 | 使用直观，但不支持拖放文件名 | 一旦按照你的需求设置，将提高生产力 | 易于打开、检测快速路径并作为后台使用
    |

    | 总体 | 轻量且实用，包含一个实用的配置管理器 | 为追求高性能机器的用户提供的良好功能选择 | 这是一个完美的终端，为 CLI 提供了丰富的调整空间
    | 任何喜欢默认终端的人的理想选择。 |


    ## 优胜者是


    ### Terminator


    如果你每周只是偶尔使用几次命令来启动几次滚动，那么任何终端模拟器都可以。Sakura 可以帮助你在旧电脑上节省资源，同时又不会丢失终端模拟器的任何功能。如果想要更多功能，你可以使用
    ROXTerm —— 它比你环境的默认终端轻得多。


    但对于那些在 CLI 上花费大量时间的人来说，需要在 Terminator 和 Terminology 之间做出选择。Terminology 名不虚传（为什么模拟器应该是无聊的呢？），它是一件视觉杰作。对于富有创意的人来说，这是一个极佳的选择。你可以使用它的简单界面来配置桌面，甚至应用图像和视频作为背景。它有两个缺点：缺乏可调整的按键绑定，且没有保存配置文件的选项。


    虽然终端风格可能没有 Terminator 那么突出，但很容易调整得看起来相当吸引人。Terminator 具有滚动回功能，因此在滚动屏幕时不会丢弃任何输出。这个终端模拟器最强大的点是其广泛的配置选项，允许用户灵活地创建不同的布局以适应他们的工作流。最棒的是，你可以将自定义内容（包括布局）保存到配置文件中以便使用。我们还欣赏它自动处理包含元字符的文件名的能力。经验丰富的宽屏战士们也会喜欢
