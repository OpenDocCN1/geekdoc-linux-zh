  - '[PAGE 19]


    # Ubuntu 17.10 Launch Pack


    # # Ubuntu 17.10 changes


    Canonical''s cross-platform vision for Ubuntu is dead. Long live the new vision
    for Ubuntu! The future''s bright, but it''s GNOME


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_19_0.png)


    +   QUICK TIP

    Wayland issues

    If you are having issues with Wayland apps do not handle properly you can still
    use Xorg by changing your selection at the new GNOME login screen.


    Ubuntu 11.04 ''Natty'' was released, in April 2011, the first version to use Unity
    by default, although the previously default GNOME was still available as an option.
    The move to Unity was hugely controversial, not least because fans of GNOME feared
    the change would jeopardize its future. The 11.10 ''Ocelot'' release took a step
    further, no longer including GNOME, allowing Ubuntu founder Mark Shuttleworth
    to provide a unified interface across multiple devices - laptops, tablets, phones
    and TVs. Over the years, the mobile phone space became dominated by iOS and Android,
    and the tablet market came to be dominated by both, which Ubuntu would fail. So,
    here we are - it was announced in April this year that Unity development would
    cease and Ubuntu would return to GNOME, with 17.10 ''Artistic'' becoming the first
    release of the new era.


    Ubuntu 17.10 ships with GNOME 3.2 ''Manchester'' by default, effectively replacing
    both the standard Ubuntu distribution and the previously offered GNOME flavour
    (an upgrade path from both Unity and GNOME 17.04 distros is provided). Many of
    the standards are also provided in this release, which could possibly receive
    a number of updates in the new version.


    > Wayland introduces a much more controlled graphics stack, which will be better
    performing, more efficient and maintainable


    # HOW Update your installation


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_19_1.png)


    | Ubuntu Software | Software Updater | Additional Addons | Developer Tools |

    |---|---|---|--|

    | update from software | recommended updates (automatically) | check for updates
    (daily) | |

    | when there are security updates | download and install automatically | |

    | let-me-notify | for new versions |


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_19_2.png)


    +   Trying the ISO

    Before you update your machine it is a good idea to try the live-boot tool and
    everything working. Although support is typically improved in new releases, there
    is reason to wait before updating. You''ll notice that for the 17.10 release there
    are no longer 32-bit ISOs - this is unlikely to affect most users on modern hardware,
    however.


    +   Back up your data

    Before upgrading, you should back up your data. We know that something might go
    wrong. Even if you have backups (and you always should), it''s better than sorry.
    If you want to be ultra-efficient and give yourself a rollback plan, consider
    take a full image of your hard disk using the dd command (carefully).


    +   Upgrading from the GUI

    If you are planning to upgrade to Ubuntu, you can use Software Updater. In ''Software
    & Updates'', click the ''Updates'' tab and make sure that ''Notify me of a new
    Ubuntu version'' is selected. (Optional) Optionally you can also check the option
    for pre-release updates. When time you check for updates, Software Updater should
    notify you that a new version is available.


