- md: "\n## Feature Ubuntu 17.10 Launch Pack\n\n## INTRODUCING UBUNTU 17.10\n\nThe\
    \ 17.10 'Artful Aardvark' Ubuntu release represents a seismic shift in Canonical's\
    \ approach to its flagship Linux distribution – and the changes provide plenty\
    \ to excite new and existing Linux users, too.\n\n## Ubuntu 17.10 Artful Aardvark\
    \ succeeds 'Zesty Zippy' marks\n\nnot only a new beginning for the alphabet, continues\
    \ to be recycled, but also a new era for a product. In April, Canonical announced\
    \ that its 'Unity' project has died, with the dream of desktop and phone distribution.\
    \ Long delayed, Unity was expected to reach a solid state of matter by the release\
