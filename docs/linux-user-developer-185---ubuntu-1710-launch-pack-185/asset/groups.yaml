    # Dealing with iterations


    When you write the nextPlayerByTiles() method, you will need to return the next
    player from a particular tile. If you do this in this way, we will eventually
    end up with two loops, for iteration: one over tiles and one over players. We
    will use an Iterator for each, checking whether the iterator is within the required
    distance, or then we have to iterate over the players on the map, and the code
    will start to work badly.


    This will have two effects: it will clean up our code, and we will avoid nested
    loops that performs the same task. The way to do this in Java is to write an implementation
    of the Iterator interface. The iterator has two methods: hasNext(), which returns
    true if there is another element, and next(), which returns the next element in
    the iteration or null.


