    ## AND THE WINNER IS


    ### Terminator


    If you use the command to launch an occasional scroll few times a week, any terminal
    emulator would do. Sakura help you conserve resources on an older computer without
    losing any functionality of a terminal emulator. For a bit more than that, you
    might use ROXTerm – a lot lighter than your environment''s defaults.


    But for people who spend a considerable time on the CLI, it''s a choice between
    Terminator and Terminology. Terminology lives up to name (Why should emulators
    be boring?) and is a visual masterpiece. It''s a wonderful option for people who
    think creatively. You can use its simple interface to configure the desktop and
    apply even images and videos as the background. It has two big drawbacks: lack
    of tweakable key bindings and no option to save your profiles.


    While Terminal style quotient might not be as high as Terminator''s, it is easily
    tweaked to look rather inviting. Terminator has scrollback so it doesn''t discard
    any output when it scrolls the screen. The strongest point of this terminal emulator
    is its wide range of configuration options that allows users the flexibility to
    create different layouts to suit their workflow. To top it all, you can save the
    customizations, including the layouts, into profiles for easy use. We also appreciate
    its ability to automatically dropped filenames that contain metacharacters. Experienced
    wide-line warriors will also allow Terminator''s ability to define custom shortcuts.
    It can also extend the app''s functionality by enabling the use of various plugins.


    Wayne Sharma


