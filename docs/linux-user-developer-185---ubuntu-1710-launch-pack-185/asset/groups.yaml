    集成。Muon 软件包管理器作为 Plasma 的替代方案回归，且 VLC 成为此版本的默认媒体播放器。


    - Lubuntu 由 LXDE 驱动，该版本正在进行从 Unity 到 Qt 的迁移。Artful 版本仅包含两个子版本：普通版本和 Lubuntu Next
    版本，因为用户更倾向于 LXQt 版本。对于大多数用户来说，使用基于稳定 LXQt 的版本是有意义的，因为它是一个流畅且实用的桌面面板——很可能是 18.04
    LTS 版本中的主要环境。

    - Lubuntu 设计得轻量级且敏捷。它运行速度快，并且包含了你在发行版内外想要的所有功能，使其成为空间和能力有限的系统来说的理想选择。

    - Lubuntu 使用轻量级的 Xfce 桌面。它运行快速且打磨程度良好，因此看起来不像某些轻量级选项那样简陋。17.10 版本没有重大变化，但 Ubuntu
    丰富的环境确保了极佳稳定性。

    - Lubuntu Budge 是一个更高级层次的打磨版本，仅在 17.04 "Zesty release" 中亮相。Budge 发行版构建在 Ubuntu
    之上（尽管调整较少），并包含了适用于 Artful 的 Ubuntu 10.2。该版本新增了 Alt+Tab 切换器，这是一个新功能（基于 Cinnamon）。以及许多更新的应用程序和额外的设置选项。此外，舍弃了一些标准的
    Gnome 应用，并替换为更轻量级的替代品，以及文件索引服务。这一改变减少了 Budge 的内存占用。


    # Ubuntu 之外的生活


    虽然这些是针对大多数用户的，但仍有大量的其他发行版可用，有以 Gnome 作为默认环境的，也有没有的。从 Unity 迁移到更新的发行版的好处是，你可以切换到非基于
    Ubuntu 的发行版，通过安装少量扩展即可获得你完全想要的体验。


    在 Debian/Ubuntu 营中，Linux Mint 是一个受欢迎的发行版。Mint 的设计旨在开箱即用，包括专有解码器，这是许多发行版都避之不及的。Mint
    默认使用 Cinnamon 环境（它是 Gnome Shell 版本 2 的分支），还可以安装许多其他环境。Mint 包含了 MintTools，它拥有备受赞誉的软件和管理器更新工具，可以保持稳定水平以帮助用户。在软件方面，保守的方法在稳定性上几乎是不可战胜的。


    > 如果你想要 Gnome 但又想要一些有点不同的东西，那么 OPENSUSE Tumbleweed 是 openSUSE 发行版的一个滚动更新版本，它在不依赖严格的策略发布周期的情况下维护最新的稳定版本。该项目是为了那些追求稳定胜于新新的用户而存在的。如果你想尝试滚动更新，可以使用通用
    openSUSE 发行版，另一个选项是 Fedora。Fedora 由 Red Hat 驱动，实际上实际上是商业版 Red Hat 未来版本的支持平台。


    # 长期支持


    Ubuntu 18.04 仍然是 LTS 版本，如果你现在使用 Ubuntu 但不需要立即获得新功能，18.04 LTS 可以很好用一段时间。这听起来有点吓，但该发行版极其可靠。虽然由于更新非常频繁可能会出现不兼容的情况，但它仍然非常稳定。


    # 特性 Ubuntu 17.10 发布包


    更新频率，并为更常见的基于 Debian 的选项提供了良好的替代方案。


    一个备受推誉的 Linux 发行版与 elementary OS 然不同。它被誉为“Windows 和 macOS 的快速且充足的替代品”，但它仅仅是另一个发行版。另一个发行版，拥有海量且精心策划的应用程序集，这些程序旨在满足日常需求，而不是用不必要的臃肿软件填充电脑。另一个晚出的
    Ubuntu，它提供了应用程序的易发现和安装，并通过许多不同的方法支持多样化的工作流。它的最新版本 0.1 ‘Loki’ 基于当前的 Ubuntu，并且同样容易安装。


    上游 GNOME

    从登录界面安装 `gnome-choose ‘GNOME’` 以使用更新版本的 GNOME。安装 `gnome-desktop` 以访问额外的 GNOME
    应用。


    另一个出来的是 Solus，一个滚动更新模型的发行版，Solus 是从零构建的，并使用软件包管理器的分支版本，即 `opkg`。在 Solus 中，该发行版已经加入了相当的


