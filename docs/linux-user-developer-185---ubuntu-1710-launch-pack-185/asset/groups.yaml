    # Evolutionary artwork


    Evolutionary artwork involves a combination of randomness and an analogy to the
    theory of evolution. The generative algorithms create something that can be thought
    of as a gene, introducing random variations or mutations to produce a range of
    images. The software selects the two that are most pleasing before merges the
