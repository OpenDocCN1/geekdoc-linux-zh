    Cell work of code execution happens when you either press Shift+Enter or click
    on the Execute button at the top of the notebook. You can also go back to a previous
    cell, edit and run it again. This brings that needs to be in mind: Jupyter notebook
    has a chronologically based state. This state is common in commercial analysis,
    such as Mathematics. If you set a value to a variable, you may change the value
    next time you access it. The output is managed in the same way as ''In'' and ''Out''.
    Actually, you have access to all the variables available in IPython. For example,
