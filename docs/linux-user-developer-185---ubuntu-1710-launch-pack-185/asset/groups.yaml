    ## Ubuntu 17.10 发布包


    ## 隆介绍 UBUNTU 17.10


    Ubuntu 17.10“Artful Aardvark”（艺术土拨）版本代表了 Canonical 对其旗舰 Linux 发行版策略的重大转变——这些变化也为新老
    Linux 用户带来了许多令人惊喜。


    ## Ubuntu 17.10 Artful Aardvark 继任“Zesty Zippy”（活泼土獭）


    这不仅是字母表的新开始、循环的延续，更是一个产品的新时代。今年 4 月，Canonical 宣布其“Unity”项目已经终结，桌面和手机分发的梦想也随之破灭。Unity
    一期延迟，本预计在 17.04 版本发布时达到稳定状态。相反，Ubuntu 正处于一个回归 GNOME 的过渡期，正如该环境的开放支持者和 Unity 拥护者长期以来描述的那样。尽管过去六个月面临显而易见的挑战，GNOME
    与 Unity 的之争已过去，目前所有的开源项目都已稳定并准备就绪。尽管战略方向发生了变化，但还有许多其他值得关注的特性。伴随着新环境而来的是新的默认桌面环境。Unity
    范式的改变，哦，还有一个非常漂亮的新桌面背景。此前的成功意味着内核版本获得了自定义更新（这是一次大更新），硬件支持得到了全面改进，诸此类推。


    除了这个 Ubuntu 之外，服务器版本和 Ubuntu 变体也都得到了更新，享受了新内核带来的益处。与典型的非 LTS（长期支持）版本一样，这些更新特别是增量式的，限于软件包更新。


    > 尽管过去六个月面临显而易见的挑战，但一切感觉都很精良、稳定且准备就绪


    争论已经消失，但看起来现在似乎只有一个目标。自从发布以来，桌面的更改以惊人的速度进行，开发团队正努力让桌面环境的切换对现有的 Ubuntu 用户来说是及时的、稳定且舒适的。他们还需要整合任何
    Ubuntu 版本中包含的各种新功能。这也许是 Artful Aardvark 最大的成就：一切感觉都很精良，


    可能大多数服务器用户可能会等到 17.04 LTS 再进行升级，除非你是一个正在纠结是否升级的桌面用户？如果你是另一个倾向于基于 GNOME 的小型发行版用户，或者正在决定是否切换？我们将具体查看内部内容：你如何将
    Ubuntu 17.10 调整成符合你需求的形状，以及 Ubuntu 生态之外的其他选择是什么。


    ## 概览


    ### 17.10 的更改，p20


    关于 Ubuntu 的更改有很多讨论，这是否意味着它对现有用户来说将是新奇又熟悉的？如果你是第一次使用它，这意味着什么？


    ### 自定义 17.10，p22


    一如既往，17.10 是无限自定义的，切换到 GNOME 比 Unity 提供了更多选项。我们将向你展示如何微调你的安装。


    ### Artful Aardvark，p24


    Artful Aardvark 并不全是 GNOME……还有其他的变体。我们对 Unity 的失去感到遗憾，但想要可以保留的新事物。


    www.linuxuser.co.uk 19


    ## Ubuntu 17.10 发布包


    ### Ubuntu 17.10 更改


    Canonical 对 Ubuntu 的跨平台愿景已经结束。让 Ubuntu 的新愿景万岁！未来是光明的，但它是属于 GNOME 的。


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_19_0.png)


    - **快速提示：Wayland 问题**：如果你遇到 Wayland 应用无法正常处理的问题，仍然可以通过新的 GNOME 登录界面更改选择来使用 Xorg。


    Ubuntu 11.04“Natty”（呆萌）于 2011 年 4 月发布，是第一个默认使用 Unity 的版本，尽管之前的默认 GNOME 仍作为一个选项可用。转向
    Unity 引起了巨大争议， GNOME 粉丝担心这种变化会危及它的未来。11.10“Ocelot”（猫头鹰）版本更进一步，不再包含 GNOME，让 Ubuntu
    创始人 Mark Shuttleworth 能够跨设备（笔记本电脑、平板电脑、手机和电视）提供统一界面。多年来，手机领域被 iOS 和 Android 主导，平板电脑市场也被两者主导，而
    Ubuntu 未能突围。因此，我们在这里了——今年 4 月宣布 Unity 开发将停止，Ubuntu 将回归 GNOME，而 17.10“Artful”（艺术）成为新时代的第一个发布版本。


    Ubuntu 17.10 默认带有 GNOME 3.2“Manchester”（曼彻斯特），有效地取代了标准 Ubuntu 发行版之前提供的 GNOME 变体（提供了从
    Unity 和 GNOME 17.04 的升级路径）。许多标准也在此版本中提供，它们可能在新版本中收到多次更新。


    > Wayland 引入了更受控制的图形栈，性能将更好、更高效且易于维护


    ## 如何更新你的安装


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_19_1.png)


    | Ubuntu 软件 | 软件更新 | 附加插件 | 开发者工具 |

    |---|---|---|---|

    | 从软件更新 | 推荐更新（自动） | 检查更新（每日） | |

    | 当有安全更新时 | 自动下载并安装 | | |

    | 提醒我 | 针对新版本 | | |


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_19_2.png)


    - **尝试 ISO**：在更新你的机器之前，尝试实时启动工具并确保一切运行正常是一个好主意。虽然支持通常在新版本中得到改进，但有理由在更新之前等待。你会发现对于
    17.10 版本不再提供 32 位的 ISO——但这可能不会影响现代硬件上的大多数用户。


    - **备份你的数据**：在升级之前，你应该备份你的数据。我们知道可能会出问题。即使你有备份（你总是应该备份的），也比后悔要好。如果你想获得极高效率并为自己提供回滚计划，请考虑使用
    `dd` 命令（小心操作）对硬盘进行完整镜像备份。


    - **从 GUI 升级**：如果你计划升级到 Ubuntu，可以使用“软件更新器”。在“软件和更新”中，点击“更新”选项卡，并确保选中“有新的 Ubuntu
    版本时提醒我”（可选）你也可以勾选预发布版更新选项。当你检查更新时，软件更新器会通知你有新版本可用。


    ## 快速指南


    ### Ubuntu 17.10 中的 Snaps


    Snaps 作为一种通用的 Linux 软件包格式，旨在在 Ubuntu 17.10 中无 Bug。Snaps 设计时包含了应用程序所需的所有依赖项，减少了库冲突的常见问题以及为不同发行版多次重新打包的需求。Snaps
    处于中心位置——Ubuntu 商店中的“特色”横幅现在默认提供 Snaps，并轻松安装任何单独打包的应用。在 Android 和 iOS 上使用移动应用需要登录
    Ubuntu。


    系统搜索功能经过了巨大的重构，并得到了改进，结果中现在包含了各种设置。界面看起来比以前更精良，并且在新的显示设置中对 HiDPI 的支持得到了改进。与 Unity
    相比支持感觉仍然很短。


    '
