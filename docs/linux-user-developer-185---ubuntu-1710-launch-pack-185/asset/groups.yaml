    Control characters in filenames

    Adam Borowski started a spirited discussion on the topic of ‘fs: hard banning
    files with control characters in the name’, which he proposed modifying the Linux
    VFS (virtual file system) to ban the creation of files containing characters such
    as newline (expressed as ‘n’). This is because of security concerns or misunderstanding
    of such characters, especially in scripts. He referenced an essay by Alex Vero
    (VFS maintainer) described as being ‘full of commentary’; Oliver Galibert followed
    up (jokingly) to suggest that banning control characters could also extend to
    spaces (‘Go, on to spaces freely’). Nevertheless, there was some interest (from
    Te So, the ext file system in finding a middle ground. He argued it might be useful
    to create an LSM (Linux Security Module) that could be used by those who want
    to impose restrictions on filenames.


    A new ‘actors’ listing for the purpose of discussion of hardware acceleration
    under Linux has been created. This includes work with HMM (Heterogeneous Memory
    Management) type devices, MLs, and many other devices: http://linux.org/linux-accelerators.


    Christopher Mason (the Linux kernel team lead and the Linux Foundation Technical
    Advisory Board) posted a notice of an imminent vote for new elected membership.
    For five out of the 11 body members proposed to take place at Kernel Summer, an
    annual event, with members serving for two years. The Linux Foundation is about
    more than the kernel, the kernel community has an outstanding voice, especially
    regarding technical direction, and, the winning candidates (surprisingly!) well-known
    kernel hackers: Steve Rostedt (real-time kernel and) Benjamin Batner; Jonathan
    Cost (LWN), Greg K, Tim Bert (embedded Linux), and Te So (ext file system author).


