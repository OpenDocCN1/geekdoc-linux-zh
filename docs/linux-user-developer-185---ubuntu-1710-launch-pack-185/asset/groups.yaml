    # Components


    # Light scripting


    The script on the Pi Zero only looks for emails from a address with specific words.
    Martin demonstrates how the Pi receives a ''redalert'', the script tells it to
    flash the LEDs for 30 seconds.


    # Power trim


    Martin said that none of his micro-USB cables was enough to fit into the cylinder
    plugged into the Pi''s pocket. He considered the Pi from the GPIO pins, but decided
    to trim them to fit the existing cable. There are three cables from the Unicorn
    to each other and these were just enough connect before sliding the Pi into the
    viewer.


    +   * Raspberry Pi Zero W 40-pin header soldered

    * microSD card

    * Pimoroni Unicorn pHAT

    * Right-angle header pins for the HAT (8 used)

    * 3x20cm female jumper leads

    * Heat shrink to disguise the three leads

    * Plastic box to chop up for the bracket

    * 1x M10 bolt to secure the bracket to the cylinder door

    * 1x1930s Kodak Table Viewer

    * HDMI and USB adapters (for access to monitor and keyboard)


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_70_0.png)


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_70_1.png)


    # Easy auto


    Martin used the IFTTT (If This, Then That) service for this project. "It''s definitely
    my go-to app for automation. If you use it, it''s kind of an online hub that lets
    you link together online services, using applets to control how they interact
    with each other."


    # Unicorns & rainbows


    Martin wanted to say fairly true to the lamp''s original function, the Unicorn
    pHAT was the obvious choice as of replacing the light source by pumping out coloured
    light onto a wall. In the end, he decided the back of the metal slide aperture
    to get as much brightness as possible from the LEDs.


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_70_2.png)


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_70_3.png)


    Above As well as his basic email/flash demo, Martin used IFTTT to create some
    practical scripts, such as making the lamp flash if his phone battery (using Android
    Battery Service) gets below 15%, or if different weather conditions are met. He
    also linked it up to the Weather Underground so that it lights up if it''s about
    rain


    Above Martin says he especially enjoyed the extra challenge of "not, irreversibly
    altering the original piece. I love that big lens can be angled and tilted off."
    Although the weight is heavy, the result is worth it. With its useful scripts,
    hes found it handy that he can move it around the house'
