    ### Linux and open source


    It''s safer to use TLP, a power management utility that we''ve covered in this
    issue. For power management for laptops generally, we also recommend installing
    and enabling TLP (most Debian-based distros will have it available in their repositories
    if you use apt). TLP is a default configuration that provides power saving out
    of the box, which helps manage your laptop''s temperature and power usage. For
    many users it stops unexpected shutdowns and saves a lot of battery life. Hardware
    owners are replacing thermal paste used for the CPU and GPU, as laptop manufacturers
    use cheap stuff and it tends to lose conductivity. We''d suggest cleaning the
