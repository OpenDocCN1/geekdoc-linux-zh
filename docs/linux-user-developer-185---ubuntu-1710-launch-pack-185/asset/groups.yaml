    # 测评


    # Parrot Security 3.8


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_87_0.png)


    # 发行版


    # Parrot Security 3.8


    饱和的渗透测试领域还需要另一个发行版吗？Parrot Security 认为需要。


    目前并不缺乏这类专门的发行版，它们为想要探测网络健壮性的伦理黑客提供了海量的工具。


    Kali Linux 多年来一直是该领域的冠军。现在，在面临多年来来自许多项目的挑战后，Parrot OS 的最新版本对其统治地位构成了真正的威胁。首先，Parrot
    Security 的使命比 Kali Linux 广得多。除了用于执行安全审计的更多渗透测试工具，该发行版还包含了保持你匿名性的顶尖工具，并完全具备双重功能。尽管工具集似乎无穷无尽，但
    Parrot 非常直观，其定制化功能将帮助新用户找到正确的工具。这个基于 Debian 的发行版使用了修改过的桌面环境，可以根据你的喜好对工具进行分类。例如，渗透测试工具都在
    Parrot 菜单中，该菜单拥有名为“漏洞分析”、“后渗透”等子菜单。


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_87_1.png)


    | 规格 | 详情 |

    | :--- | :--- |

    | 内存 | 完整安装需要 384MB / 2GB |

    | 存储 | 1GHz 处理器 |

    | 获取地址 | www.parrotsec.com |


    上述发行版比它的许多同类产品更全面、多功能且易用，而且外观也很良好。


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_88_0.png)


    上面，在你成为一名伦理黑客的途中，你可以安装并使用 Parrot Sec 作为你的桌面环境。为了让 Parrot 取代 Kali，开发者需要完善关于使用内置的漏洞利用（Exploit）、密码破解、数字取证等工具的
    Wiki 指南。这些工具中的大部分涵盖了更多主题。例如，“无线测试”菜单包含 802.11 无线工具、蓝牙、WiFi、NFD 和工具；数字取证发行版是该项目与
    CAINE 数字取证项目负责人合作的成果。


    Parrot 还包含了几种密码学和加密工具来保护你的数据。它整合了一整套其他工具，包括浏览器和 Tor 客户端。如果你不确定，可以使用 Onion 代理，它可以作为其他工具的主机。此外，设计为
    Live 介质的 Parrot 版本可以安装在磁盘上，并包含许多桌面应用，包括 LibreOffice、虚拟机管理器（Virtual Machine Manager）和
    VLC。有几种方法：标准的是基于安装的方法，也有图形版本。除了这些，用户还可以从 USB 盘运行 Parrot，启动菜单提供了带或不带持久化启动这些环境的选项。


    Parrot 逊于热门 Kali 的领域是文档和支持。该项目一个被低估的优势是本地社区。该项目拥有全球范围内的个人专家作为其大使，以及你可以寻求的各种论坛。Parrot
    Wiki 上的文档目前是自动生成的。为了让 Parrot 取代 Kali，开发者最终需要完善使用内置工具的 Wiki 指南。也就是说，该项目提供的手动文档比任何同类发行版都详细。


    ## 优点


    除了渗透测试工具的免费方法外，它还包含了用于维护隐私的工具。


    ## 缺点


    某些工具需要更具体的文档，这些文档也应该在 Live 和安装环境中可用。


    ## 总结


    一个全面的发行版，完全配备了适用于所有类型的工具：渗透、隐私和匿名。安排良好的菜单将帮助你导航到正确的工具。最棒的专业化发行版，Parrot 适合所有人，但在文档方面有所缺失。


    Wayne Sharma

    www.linuxux.com


    # 测评 新鲜免费开源软件


    # 网页浏览器

    Brave 0.18.23 dev


    内置隐私控制的浏览器


    网络是一个虚拟的雷区，布满了侵犯隐私的 Cookie 和追踪器。虽然流行的浏览器可以被配置为随处追踪你，但 Brave 在其核心中直接内置了增强隐私的特性。在联合创始人
    Brendan Eich 的领导下，Brave 承诺在竞争对手两个方面有两项改进：隐私和速度。其中之一通过拦截广告和追踪器实现，这带来了提高速度的愉快副作用，因为浏览器不需要花时间加载所有的追踪和广告信息。但通过拦截，Brave
    也破坏了许多网站的收入来源。因此 Brave 允许你自己设置微支付，这样你就可以用侵入性较小的广告替换广告，并支付给网站。Brave 浏览器的 Linux
    版本持续开发，每几周发布一次新版本。你可以从其网站获取最新版本的 Brave 浏览器，适用于 RPM 和基于 deb 的发行版的 pek 二进制包。


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_89_0.png)


    > Sessions 功能允许你在同一行内运行资源的独立实例


    - 优点

    - 拦截广告和追踪器，并用产生广告的广告替换无用的广告。


    - 缺点

    - 仍在开发中，某些人可能不同意其替换广告的政策。


    - 非常适合……

    - 任何时候保持隐私和速度。

    www.brave.com


    # 下载管理器

    HTraQt 1.4

    HTraQt 1.4


    一个高效且功能丰富的下载器


    对于大多数人来说，HTraQt 已经足够。但如果你需要下载更多内容，可以使用 HTraQt。HTraQt 的 Linux 版本持续开发，每几周发布一次新版本。你可以从其网站获取最新版本的
    HTraQt，适用于 RPM 和基于 deb 的发行版的 pek 二进制包。


    Parrot 逊于热门 Kali 的领域是文档和支持。该项目一个被低估的优势是其本地社区。


    - HTraQt 1.4

    HTraQt 1.4


    一个高效且功能丰富的下载器


    对于大多数人来说，HTraQt 已经足够。但如果你需要下载更多内容，可以使用 HTraQt。


    - 优点

    - 安装和使用简单，提供了充足的控制力。


    - 缺点

    - 像命令行工具一样，需要查阅文档。


    - 非常适合……

    - 下载文件和监控。


    '
