    If you wish to upload the results, run through the documentation to familiarise
    yourself with its CLIs. If that sounds like too much work, you can just execute
    phoronix-test-suite gui to fire up its experimental graphical interface.


    # Pros


    A comprehensive benchmarking tool that can also compare results with others.


    # Cons


    Like command-line tools, it requires a trip to the documentation for best results.


    The PTS website hosts pre-packaged binaries for DEB-based distributions such as
    Ubuntu.


    # Great for...


    benchmarking and comparing performance,

    http://bit.ly/PhoronixTS


    # VIRTUAL PLANETARIUM


    # Stellarium 0.16.1


    Gaze at the stars above you


    ![](img/84ab224de9f66d5fe3638204a9a78c1c_90_0.png)


    Stellarium is an open source planetarium for your computer to use 3D realistic
    skies in real time. The software is capable of displaying stars, constellations,
    planets, nebulae, as well as deep space objects and can simulate astronomical
    phenomena such as meteor showers and eclipses. Stellarium calculates the positions
    of the Sun and Moon, planets, and draws the sky as per your location and time
    with illustrative representation of the ground, landscape and atmosphere.


    Stellarium is available in the official repositories of most desktop systems.
    From your website you can grab the deb packages, and Ubuntu users can fetch the
    latest release from the PPA repository. Stellarium requires 1GB RAM and a 3D graphics
    card that supports OpenGL 3.0 at the minimum to run full and you can move around
    the sky by dragging your mouse. The left and bottom screen edges hide the status
    and toolbar. Read Stellarium''s documentation to get a hang of these two menus
    with other controls in order to better visualise and understand the skies above
    you.


    Above Stellarium shows a catalog of millions of stars and showing hot stars and
    simulates eclipse events


    # Pros


    A realistic view of your current night sky thanks to a catalogue of heavenly bodies.


    # Cons


    More resource-intensive than the typical app in your repository, with a peculiar
    interface.


    # Great for...


    Deciphering the stars in the skies directly above.

    www.stellarium.org'
