- img_proc: true
  md: '# SECURING FILES WITH ACLS


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Change regular ACL file permissions using setfacl

    - Control default ACL file permissions for new files and directories.


    # CHANGING ACL FILE PERMISSIONS


    Use setfacl to add, modify, or remove standard ACLs on files and directories.

    ACLs use the normal file system representation of permissions, ''r'' for read
    permission, ''w'' for write permission, and ''x'' for execution. A ''-'' (dash)
    indicates that the relevant permission is absent. When (recursively) setting ACLs,
    an ''X'' can be used to indicate that execute permission only be set on directories
    and not regular files, unless the file already has the execute permission. This
    is the same behavior as chmod.


    # Adding or Modifying ACLs


    ACLs can be set using the command-line using the -m option, or passed via a file
    using the -t option ("-" (dash) instead of a file name for stdin). These two options
    are the "modify" options; they add new ACL entries or replace existing ACL entries
    on a file or directory. Any other existing ACL entries on the file or directory
    remain untouched.


    > NOTE

    Use the --set and --set-file options to completely replace the ACL settings on
    a file.


    When defining an ACL on a file, if the add operation does not include settings
    for the file owner, group owner, or other permissions, these will be set based
    on the current standard file permissions (these are also known as the base ACL
    entries and cannot be deleted), and a new mask value will be calculated and added
    as well.

    To add or modify a user or named user ACL:


    ```

    [user@-$] setfacl -m u:rx file

    ```


    if name is left, it applies to the file owner, otherwise name can be a username
    or UID value. In this example, the permissions granted would be read-only, and
    if already set set, (unless file was a directory, in which case the directory
    would get the execute permission set to allow search directory);


    ACL file owner and standard file owner permissions are equivalent; consequently,
    using chmod on the file owner permissions is equivalent to using setfacl on the
    file owner permissions. chmod has no effect on named users.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# CHAPTER 4 | Controlling Access to Files with ACLs


    To add or modify a group or named group ACL:


    ```

    user@host ~]$ setfacl -m g:name:rw file

    ```


    This follows the same pattern for adding or modifying an ACL entry. If name is
    left blank, then it applies to the group owner. Otherwise, specify a group or
    GID value for a named group. The permissions will be read and write in this example.


    chmod has no effect on group permissions for files with ACL settings, but it updates
    the ACL mask.


    To add or modify the other ACL:


    ```

    user@host ~]$ setfacl -m o:: file

    ```


    other only accepts permissions. Typical permission settings for others are: no
    permissions at all, with a dash (-); and read-only permissions as usual with r.
    Of course, you can set any of the standard permissions.


    ACL other and standard other permissions are equivalent, so using chmod on the
    other is equivalent to using setfacl on the other permissions.


    You can add multiple entries with the same command; use a comma-separated list
    of entries:


    ```

    user@host ~]$ setfacl -m u:rw,g:consultants:rx,o:: file

    ```


    This sets the file owner to read, write, and execute, sets the group consultants
    to read-only and conditional execute, and restricts all users to no permissions.
    The group owner maintains existing file or ACL permissions and any "named" entries
    unchanged.


    # Using setfacl as Input


    You can use the output from getfacl as input to setfacl:


    ```

    user@host ~]$ getfacl -A | setfacl --set-file= file-B

    ```


    The --set-file option accepts input from a file or stdin. The dash character (-)
    specifies the use of stdin. In this case, file-B has the same ACL settings as
    file-A.


    # Setting an Explicit ACL Mask


    You can set an ACL mask explicitly on a file or directory to limit the effective
    permissions for named users, the group owner, and named groups. This restricts
    any existing permissions that the mask makes, but does not affect permissions
    that are less than the mask.


    ```

    user@host ~]$ setfacl -m m::r file

    ```


    This adds a mask that restricts any named users, the group owner, and any named
    groups to read-only permission, regardless of their existing settings. The file
    owner and other users are not impacted by the mask setting.


    getfacl shows an effective comment beside entries that are restricted by a mask
    setting.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# CHAPTER 4 | Controlling Access to Files with ACLs


    > IMPORTANT

    By default, each time of the impacted ACL settings (named users, group owner,
    or groups) is modified or deleted, the ACL mask is recalculated, potentially resetting
    a previous explicit mask setting.

    nTo avoid the mask recalculation, use the -n option or include a mask setting
    (-m:perms) with any setfacl operation that modifies mask-affected ACL settings.


    # Recursive ACL Modifications


    When setting an ACL on a directory, use the -R option to apply to the ACL recursively.
    Remember that you are likely to want to use the ''X'' permission with recursion
    so that files with the execute permission set the execute permission set to allow
    directory search. It is considered good practice to use the uppercase ''X'' when
    non-recursively setting ACLs because it prevents administrators from accidentally
    extending permissions to a regular file.


    ```

    [user@host ~]$ setfacl -R -m u:name:rx directory

    ```


    This adds the user to the directory and all existing files and subdirectories,
    setting read-only and conditional execute permissions.


    # Deleting ACLs


    Deleting ACL entry follows the same basic format as the modify operation, except
    that ''perms'' is not specified.


    ```

    [user@host ~]$ setfacl -x u:name,g:name file

    ```


    This removes the named user and the named group from the file or directory ACL.
    Any other existing ACL entries remain active.


    You can include both the delete (-x) and modify (-m) operations in the same setfacl
    operation.

    The mask can only be deleted if there are no other ACLs (excluding the base ACL
    which cannot be deleted), so it must be deleted. The file will no longer have
    any ACLs and ls -1 will not show the plus (+) next to the permissions string.
    Alternatively, to delete all ACL entries on a file or directory (including default
    ACL on directories), use the following command:


    ```

    [user@host ~]$ setfacl -b file

    ```


    # CONTROLLING DEFAULT ACL PERMISSIONS


    To ensure files and directories within a directory inherit certain ACLs, use the
    default ACL on a directory. You can set a default ACL and any of the standard
    ACL settings, including a default mask.


    The directory itself requires standard ACLs for access control because the default
    ACLs do not implement access control for the directory; they only provide ACL
    permission inheritance. For example:


    RHT34-RHEL8.0-en-1-20190531 103'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# CHAPTER 4 | Controlling Access to Files with ACLs


    ```

    [user@host ~]$ setfacl -m d:name:rx directory

    ```


    This adds a default user (d:name) with read-only permission and execute permission
    on subdirectories.


    The setfacl command for adding a default ACL for each of the ACL types is exactly
    the same as for standard ACLs, but prefixed with d: Alternatively, use the -d
    option on the command line.


    > **IMPORTANT**nWhen setting default ACLs on a directory, ensure that users will
    be able to access the contents of new subdirectories created in it including the
    execute permission on the default ACL.


    Users will not automatically get the execute permission set on newly created files
    unlike new directories, the ACL mask of a new regular file is rw-.


    > **NOTE**nNew files and new subdirectories continue to get their owner UID and
    primary group GID values set from the creating user, except when the parent directory
    setgid flag is enabled, in which case the primary group GID is the same as the
    parent directory ID.


    # Deleting Default ACL Entries


    Delete a default ACL the same way that you delete a standard ACL, prefacing with
    d;, or use the -d option.


    ```

    [user@host ~]$ setfacl -x d:name:name directory

    ```


    This removes the default ACL entry that was added in the previous example.


    To delete all default ACL entries on a directory, use setfacl -k directory.


    > **REFERENCES**nacl(5), setfacl(1), and getfacl(1) man pages'
