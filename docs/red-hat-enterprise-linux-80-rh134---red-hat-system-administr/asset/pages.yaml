  md: '# MANAGING SWAP SPACE


    # OBJECTIVES


    After completing this section, you should be able to create and manage swap spaces
    to supplement physical memory.


    # INTRODUCING SWAP SPACE CONCEPTS


    A swap space is an area of disk under the control of the Linux kernel memory management
    subsystem. The kernel uses swap space to supplement the system RAM by holding
    inactive pages of memory. The combined system consider RAM plus swap space as
    virtual memory.


    When the memory usage on a system exceeds a defined limit, the kernel searches
    through RAM looking for idle memory pages assigned to processes. The kernel writes
    the idle pages to the swap area and reclaims the RAM pages to processes. If a
    process requires access to a page on disk, the kernel locates another idle page
    of memory, writes it to disk, then recalls the needed page from the swap area.


    Because swap areas reside on disk, swap is slow when compared to RAM. While it
    is used to augment system RAM, you should not consider swap space as a sustainable
    solution for insufficient RAM for your workload.


    # Sizing the Swap Space


    Administrators size the swap space based on the memory workload on the system.
    Application vendors sometimes provide recommendations on that subject. The following
    table provides some guidance on the total amount of physical memory.


    # RAM and Swap Space Recommendations


    The laptop and desktop hibernation uses the swap space to save the RAM contents
    before powering off the system. When you turn the system back on, the kernel restores
    the RAM contents from the swap space and does not need a complete boot. For those
    systems, the swap space needs to be greater than the amount of RAM.


    The Knowledgebase article in the Reference section at the end of this section
    gives more guidance on sizing the swap space.'
