  md: '# CHAPTER 6 | Managing Basic Storage


    +   4. Specify the sector on which the new partition starts on.


    ```

    Start? 2048s

    ```


    Notice the s if you do not provide the value in sectors. You can also use the
    MiB, GiB, TiB, MB, GB, or TB suffixes. If you do not provide a suffix, MB is the
    default. parted may return the value you provide to satisfy disk constraints.


    When parted starts, it retrieves the disk topology from the device. For example,
    the physical block size is typically a parameter that parted collects. With that
    information, parted ensures that the start position correctly aligns the partition
    with the disk structure. Correct partition alignment is important for optimal
    performance. If the start position is in a misaligned partition, parted displays
    a warning. With most disks, a start sector that is a multiple of 2048 is a safe
    assumption.


    +   5. Specify the disk sector where the new partition should end.


    ```

    End? 1000MB

    ```


    With parted, you cannot directly provide the size of your partition, but you can
    quickly compute it with the following formula:


    ```

    Size = End - Start

    ```


    As soon as you provide the end position, parted updates the partition table on
    the disk with the new partition details.


    +   6. Exit parted.


    ```

    (parted) quit

    Information: You may need to update /etc/fstab.


    [root@host ~]#

    ```


    +   7. Run the udev settle. This command waits for the system to detect the new
    partition and to create the associated device file under the /dev directory. It
    only returns when it is done.


    ```

    [root@host ~]# udevadm settle

    [root@host ~]#

    ```


    As an alternative to the interactive mode, you can also create the partition as
    follows:


    ```

    [root@host ~]# parted /dev/vdb mkpart primary xfs 2048s 1000MB

    ```


    # Creating GPT Partitions


    The GPT scheme also uses the parted command to create new partitions.


    +   1. Specify the disk device to create the partition on.'
