  md: '# INVESTIGATING AND RESOLVING SELINUX ISSUES


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Use SELinux log analysis tools.

    - Display useful information during SELINUX troubleshooting using the sealert
    command.


    # TROUBLESHOOTING SELINUX ISSUES


    It is important to understand what actions you must take when SELLinux prevents
    access to files on a server that you know should be accessible. Use the following
    steps as a guide to troubleshooting these issues:


    +   1. Before thinking of any adjustments, consider that SELLinux may be doing
    its job by correctly prohibiting the attempted access. If a web server tries to
    access files in /home, this could signal a compromise of the service if content
    is not published by users. If access should have been granted, then additional
    steps are needed to solve the problem.

    2. The most common issue is an incorrect file context. This can occur when a file
    is created in one file context and moved to a place where a different context
    is expected. In most cases, running restorecon will correct the issue. Correcting
    issues in this way has a narrow impact on the security of the system.

    3. Another remedy for overly restrictive access could be the adjustment of a Boolean.
    For example, the ftp_anon_write boolean controls whether anonymous users can upload
    files. You must turn this boolean to permit anonymous FTP users to upload files.
    Adjusting booleans requires more care because they can have a broad impact on
    system security.

    4. It is possible that the SEL policy has a bug that prevents legitimate access.
    Since SEL has matured, this is a rare occurrence. When it is a policy bug identified,
    contact Red Hat to report the bug so it can be resolved.


    # MONITORING SELINUX VIOLATIONS


    Install the setroubleshoot-server package to send SELinux messages to /var/log/messages.
    setroubleshoot-server listens for audit messages in /var/log/audit/audit.log and
    sends a short summary to /var/log/messages. This summary contains unique identifiers
    (UUID) for SELinux violations that can be used to gather further information.
    The sealert -1 UUID command is used to produce reports for a specific incident.
    Use sealert -a /var/log/audit.log to produce reports for all incidents in that
    file.


    audit/audit.log


    Consider the following sample of commands on a standard Apache web server:


    ```

    [root@host ~]# touch root/file3

    [root@host ~]# mv root/file3 /var/www/html

    [root@host ~]# systemctl start httpd

    [root@host ~]# curl http://localhost/file3

    ```'
