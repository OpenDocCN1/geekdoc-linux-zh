  md: '# CHAPTER 8 | Implementing Advanced Storage Features


    ![](img/3c5dfc78dee328600013666607c8aa7b_246_0.png)


    Figure 8.1: Elements of Stratis


    A pool groups block devices into the data tier and optionally the cache tier.
    The data tier focuses on flexibility and integrity and the cache tier focuses
    on improved performance. Because the cache tier is intended to improve performance,
    you should use block devices that have higher input/output per second (IOPS),
    such as SSDs.


    # Describing the Simplified Storage Stack


    Stratis modifies many aspects of local storage provisioning and configuration
    across a range of Red Hat products. For example, in earlier versions of the Anaconda
    installer, system administrators had to layer each aspect of disk management over
    the other. Now, the installer uses Stratis, simplifying disk setup. Other products
    that use Stratis include Cockpit, Red Hat Virtualization, and Red Hat Enterprise
    Linux Atomic Host. For all of these products, Stratis makes it simpler and less
    error prone to manage storage space and snapshots. Stratis allows easier integration
    with the higher-level management tools using any CLI programmatically.'
