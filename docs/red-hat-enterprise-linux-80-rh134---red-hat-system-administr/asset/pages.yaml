  md: '# ORIENTATION TO THE CLASSROOM ENVIRONMENT


    Internet & Facility Network


    Student Network 172.25.250.0/24


    ![](img/3c5dfc78dee328600013666607c8aa7b_11_0.png)


    Figure 0.1: Classroom environment


    In this course, the main computer system used for hands-on learning activities
    is workstation. Two other machines are also used by students for these activities:
    servera, and serverb. All three of these systems are in the lab.example.com DNS
    domain.


    All student systems have a standard user account, student, which has the password
    student. The root password on all student systems is redhat.


    # Classroom Machines


    | MACHINE NAME | IP ADDRESSES | ROLE |

    | --- | --- | --- |

    | bastion.lab.example.com | 172.25.250.254 | Gateway system to connect student
    private network to classroom server (must be running) |

    | workstation.lab.example.com | 172.25.250.9 | Graphical workstation used for
    system administration |

    | servera.lab.example.com | 172.25.250.10 | First server |

    | serverb.lab.example.com | 172.25.250.11 | Second server |


    The primary function of bastion is that it acts as a router between the network
    that connects the student machines and the classroom network. If bastion is down,
    other student machines will only be able to access systems on the individual student
    network.'
