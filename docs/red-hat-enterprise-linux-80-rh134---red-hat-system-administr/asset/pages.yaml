- img_proc: true
  md: '# Removing Port Labels


    The syntax for removing a custom port label is the same as the syntax for adding
    a port label, instead of using the -a option (for Add), use the -d option (for
    Delete).


    For example, to remove the binding of port 71/TCP to gopher_port_t:


    ```

    [root@#] semanage port -d -t gopher_port_t -p tcp 71

    ```


    # Modifying Port Bindings


    To change a port binding, perhaps because requirements changed, use the -m (Modify)
    option. This is a more efficient process than removing the old binding and adding
    a new one.


    For example, to modify port 71/TCP from gopher_port_t to http_port_t, an administrator
    can use the following command:


    ```

    [root@server]# semanage port -m -t http_port_t -p tcp 71

    ```


    As before, view the modification using the semanage command.


    ```

    [root@server]# semanage port -1 -C

    SELinux Port Type Proto Port Number

    http_port_t tcp 71

    [root@server]# semanage port -1 | grep http

    http_cache_port_t tcp 8000, 8118, 8123, 10001-10010

    http_cache_port_t udp 3130

    http_port_t tcp 71, 80, 81, 443, 488, 8008, 8009, 8443, 9000

    pegasus_http_port_t tcp 5988

    pegasus_http_port_t tcp 5989

    ```


    > REFERENCES

    semanmanage(8), semanage-port(8), and *selinux(8) man pages'
