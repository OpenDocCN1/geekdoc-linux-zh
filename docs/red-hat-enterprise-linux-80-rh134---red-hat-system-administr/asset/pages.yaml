  md: '# AUTOMATING INSTALLATION WITH KICKSTART


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Explain Kickstart concepts and architecture.

    - Create a Kickstart file with the Kickstart Generator website.

    - Modify an existing Kickstart file with a text editor and check its syntax with
    ksvalidator.

    - Publish a Kickstart file to the installer.

    - Perform a network Kickstart installation.


    # CREATING A KICKSTART PROFILE


    You can automate the installation of Red Hat Enterprise Linux using a feature
    called Kickstart. Using Kickstart, you specify everything Anaconda needs to complete
    an installation, including disk partitioning, network interface configuration,
    package selection, and other parameters, in a Kickstart file. By referencing the
    text file, Anaconda performs the installation without user interaction.


    > NOTE

    Kickstart in Red Hat Enterprise Linux is similar to the Jumpstart facility in
    Oracle Solaris, or to using an unattended Setup file for Microsoft Windows.


    Kickstart begins with a list of commands that define how to install the target
    machine. Lines starting with # characters are characters to be ignored by the
    installer. Additional sections begin with a directive, recognized by a % first
    character, and end line with the %end directive.


    The packages section specifies the software to be installed on the target system.
    Specify individual packages by name (without versions). Package groups, specified
    by name or ID, are recognized by beginning them with an @ character. Environment
    groups (groups of package groups) are recognized by beginning them with the ^
    characters. Specify modules, streams, and profiles with @module:stream/profile
    syntax.


    Groups have mandatory, default, and optional components. Kickstart installs normally
    and default components. To exclude a package or group from installation, precede
    it with a - character. However, excluded packages or group may still install if
    there are mandatory dependencies of requested packages.


    A Kickstart configuration uses two additional sections, %pre and %post, which
    contain shell scripting commands that further configure the system. The %pre script
    is executed before any disk partitioning is done. Typically, this is used only
    if actions are required to recognize or initialize a device before disk partitioning.
    The %post script is executed after the installation is otherwise completed.


    You must specify the primary Kickstart commands before the %pre, %post, and %packages
    sections, but otherwise, you can place these sections in any order in the file.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# CHAPTER 12 | Installing Hat Enterprise Linux


    # KICKSTART FILE COMMANDS


    # Installation Commands


    Define the installation source and how to perform the installation. Each is followed
    by an example.


    +   * url: Specifies the URL pointing to the installation media.


    ```

    url --url="http://classroom.example.com/content/rhel8.0/x86_64/dvd/"

    ```


    +   * repo: Specifies where to find additional packages for installation. This
    option must point to a valid yum repository.


    ```

    repo --name="appstream" --baseurl=http://classroom.example.com/content/rhel8.0/x86_64/dvd/Appstream/

    ```


    +   * text: Forces a text mode install.


    +   * vnc: Allows the graphical installation to be viewed remotely over VNC.


    ```

    vnc --password=redhat

    ```


    # Partitioning Commands


    Define the devices and partitioning scheme to be used.


    +   * clearpart: Removes partitions from the system prior to creation of new partitions.
    By default


    ```

    clearpart --all --drives=sda,sdb --init

    ```


    +   * part: Specifies the size, format, and name of a partition.


    ```

    part /home --filesystem=ext4 --label=homes --size=4096 --maxsize=8192 --grow

    ```


    +   * autopart: Automatically creates a root partition, a swap partition, and
    an appropriate


    partition for the architecture. On large enough drives, this also creates a /home
    partition.


    +   * ignoredisk: Controls Anaconda''s access to disks attached to the system.


    ```

    ignoredisk --drives=sdc

    ```


    +   * bootloader: Defines where to install the bootloader.


    ```

    bootloader --location=mbr --boot-drive=sda

    ```


    +   * volgroup, logvol: Creates LVM volume groups and logical volumes.


    ```

    part pv.01 --size=8192

    volgroup myvg pv.01

    logvol / --vgname=myvg --fst=xfs --size=2048 --name=rootvol --grow

    logvol /var --vgname=myvg --fst=xfs --size=4096 --name=varvol

    ```'
  merge: -1
  pgno: 373
