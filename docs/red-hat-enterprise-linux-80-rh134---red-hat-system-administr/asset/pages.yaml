    # Configuring the Firewall-cmd commands with the Command Line


    The firewall-cmd command interacts with the firewalld dynamic firewall manager.
    It is installed as part of the main firewall package and is available for administrators
    who prefer to work on the command line, for systems without a graphical interface,
    or for scripting a firewall setup.


    The following table lists a of frequently used firewall-cmd commands, along with
    an explanation. Note that unless otherwise specified, almost all commands will
    work on the runtime configuration, unless the --permanent option is specified.
    If the --permanent option is'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# CHAPTER II | Managing Network Security


    is specified, you must activate the setting by running the firewall-cmd --reload
    command, which reads the current permanent configuration and applies it as the
    new runtime configuration. Many of the commands listed take the --zone option
    to determine which zone they affect. When a netmask is used, use CIDR notation,
    such as 192.168.1/24.


    | FIREWALL-CMD COMMANDS | EXPLANATION |

    | --- | --- |

    | --get-default-zone | Query the current default zone. |

    | --set-default-zone=ZONE | Set the default zone. This changes both the runtime
    and the permanent configuration. |

    | --get-zones | List all available zones. |

    | --get-active-zones | List all zones currently in use (have an interface or source
    tied to them), along with their interface and source information. |

    | --add-source=CIDR [--zone=ZONE] | Route traffic coming from the IP address or
    network/netmask to the specified zone. If no --zone option is provided, the default
    zone is used. |

    | --remove-source=CIDR [--zone=ZONE] | Remove the routing traffic from the zone
    coming from the IP address or network/netmask network. If no --zone= option is
    provided, the default zone is used. |

    | --add-interface=INTERFACE [--zone=ZONE] | Route traffic from INTERFACE to the
    specified zone. If no --zone= option is provided, the default zone is used. |

    | --change-interface=INTERFACE [--zone=ZONE] | Associate the interface with ZONE
    instead of its current zone. If no --zone= option is provided, the default zone
    is used. |

    | --list-all [--zone=ZONE] | List all configured interfaces, services, and ports
    for ZONE. If no --zone= is provided, the default zone is used. |

    | --list-all-zones | Retrieve all information for all zones (interfaces, sources,
    ports, services). |

    | --add-service=SERVICE [--zone=ZONE] | Allow traffic to SERVICE. If no --zone=
    option is provided, the default zone is used. |

    | --add-port=PORT/PROTOCOL [--zone=ZONE] | Allow traffic to the PORT/PROTOCOL
    port(s). If no --zone= option is provided, the default zone is used. |

    | --remove-service=SERVICE [--zone=ZONE] | Remove SERVICE from the allowed list
    for the zone. If no --zone= option is provided, the default zone is used. |'
