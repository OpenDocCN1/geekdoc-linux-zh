  md: '# CONTROLLING SELINUX FILE CONTEXTS


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Manage the SELinux policy rules that determine the default context for files
    and directories using the semanage fcontext command.


    +   - Apply the context defined by the SELinux policy to files and directories
    using the restorecon command.


    # INITIAL SELINUX CONTEXT


    On systems running SELinux, all processes and files are labeled. The label represents
    the security relevant information, known as the SELinux context.


    New files typically inherit their SELinux context from the parent directory, ensuring
    that they have the proper context.


    But inheritance procedure can be undermined in two ways. First, if you create
    a file in a different location from the ultimate intended location and move it,
    the file still has the SELinux context of the directory where it was created,
    not the destination directory. Second, if you copy a file preserving the SELinux
    context, with the cp -a command, the SELinux context reflects the context of the
    original file.


    The following example demonstrates inheritance and its pitfalls. Consider these
    two files created in /tmp, one moved to /var/www/html and the second copied to
    the same directory. Note the SELinux contexts on the files. The file that was
    moved to the /var/www/html directory retains the context for the /tmp directory.
    The file that was copied to the /var/www/html directory inherited SELinux context
    from the /var/www/html directory hierarchy.


    The ls -Z command displays the SELinux context of a file. Note the label of the:


    ```

    [root@]# ls -Z /var/www/html/index.html

    -rw-r--r-- root unconfined_u:object_r:httpd_sys_content_t:s0 /var/www/html/index.html

    ```


    And the ls -Zd command displays the SELinux context of a directory:


    ```

    [root@]# ls -Zd /var/www/html/

    drwxr-xr-x root root system_u:object_r:httpd_sys_content_t:s0 /var/www/html/

    ```


    Note that the /var/www/index.html has the same label as the parent directory /var/www/html/.
    Now, create files outside of the /var/www/html directory and note their file context:'
