- img_proc: true
  md: '# ADDING PARTITIONS, FILE SYSTEMS, AND PERSISTENT MOUNTS


    # OBJECTIVES


    After completing this section, you should be able to create storage partitions,
    format them with file systems, and mount them for use.


    # PARTITIONING A DISK


    Disk partitioning allows system administrators to divide a hard drive into multiple
    logical storage units, referred to as partitions. By separating a disk into partitions,
    system administrators can use different partitions to perform different functions.


    For example, disk partitioning is necessary or beneficial in these situations:


    +   - Limit available space to applications or users.

    - Separate operating system and program files from user files.

    - Create a separate area for memory swapping.

    - Limit disk space use to improve the performance of diagnostic tools and backup
    imaging.


    # MBR Partitioning Scheme


    Since 1982, the Master Boot Record (MBR) partitioning scheme has dictated how
    disks are partitioned on systems using BIOS firmware. This scheme supports a maximum
    of four primary partitions. On Linux, with the use of extended and logical partitions,
    administrators can create a maximum of 15 partitions. Because partition size is
    stored as 32-bit values, disks partitioned with the MBR scheme have a maximum
    disk and partition size of 2B.


    | MBR | Primary | Primary | Primary | Extended (vdb4) | Unused |

    |---|---|---|---|---|-|

    | vdb1 | vdb2 | vdb3 | vdb5 | vdb6 | |


    Figure 6.1 Partitioning of the /dev/vdb storage device


    As physical disks are getting larger, and SAN-based volumes even larger than,
    the 2 TB disk and partition size limit of the MBR partitioning scheme is no longer
    a theoretical limit, but rather a real-world problem that system administrators
    encounter and more frequently in production environments. As a result, the legacy
    MBR scheme is in the process of being superseded by the new GUID Partition Table
    (GPT) for disk partitioning.


    # GPT Partitioning Scheme


    For systems using Unified Extensible Firmware Interface (UEFI) firmware, GPT is
    the standard for laying out partitions on physical hard disks. GPT is part of
    the UEFI standard and addresses many of the limitations that old MBR-based schemes
    imposed.


    A GPT provides a maximum of 128 partitions. Unlike an MBR, which uses 32 bits
    for storing block addresses and size information, a GPT allocates 64 bits for
    logical block addresses. This'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# CHAPTER 6 Managing Basic Storage


    allows a GPT to accommodate partitions and disks of up to eight zebytes (ZiB)
    or eight billion tebibytes.


    In addition to addressing the limitations of the MBR partitioning scheme, a GPT
    also offers some additional features and benefits. A GPT uses a globally unique
    identifier (GUID) to identify each disk and partition. In contrast to an MBR,
    which has a single point of failure, a GPT offers redundancy of its partition
    table information. The primary GPT resides at the head of the disk, with a backup
    copy, the secondary GPT, is housed at the end of the disk. A GPT uses a checksum
    to detect errors and corrections in the GPT header and partition table.


    Primary Backup GPT


    | vdb1 | vdb2 | vdb3 | vdb5 | Unused |

    |---|---|---|---|---|


    Figure 6.2: GPT Partitioning of the /dev/vdb storage device


    # MANAGING PARTITIONS WITH PARTED


    Partition editors are programs which allow administrators to make changes to a
    disk''s partitions, such as creating partitions, deleting partitions, and changing
    partition types. To perform these operations, administrators can use the parted
    editor for both the MBR and the GPT partitioning scheme.


    The parted command takes the name of the whole disk as the first argument and
    or more commands. The following example uses the print command to display the
    partition table on the /dev/vda disk.


    ```

    [root@host ~]# parted /dev/vda print

    Model: Virtio Block Device (virtblk)

    Disk /dev/vda: 53.7GB

    Sector size (logical/physical): 512B/512B

    Partition Table: mdos

    Disk Flags:

    ```


    | Number Start End Size Type File system Flags |

    |---|---|---|---|---|---||

    | 1 | 1049KB 10.7GB 10.7GB primary xfs | boot |

    | 2 | 1049KB 53.7GB 42.9GB primary xfs |


    If you do not provide an argument, parted opens an interactive session for issuing
    commands.


    ```

    [root@host ~]# parted /dev/vda

    GNU Part 3.2

    Using /dev/vda

