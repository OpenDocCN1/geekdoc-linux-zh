  md: '# Kickstart Generator


    Generate a custom kickstart file based on your configuration parameters.


    Learn more about Kickstart Installations and how to use the generated config file
    in the Red Hat Linux Install guide []


    ![](img/3c5dfc78dee328600013666607c8aa7b_378_0.png)


    Figure 12.3: Basic Configuration with Kickstart Generator


    > NOTE

    At the time of writing, the Kickstart Generator website did not provide Red Hat
    Enterprise Linux 8 as a menu option. Red Hat Enterprise Linux 8 Beta was a valid
    selection.


    Creating Kickstart file from scratch is typically too complex, but editing an
    existing Kickstart file is common and useful. Every installation creates a /root/anaconda-ks.cfg
    file containing the Kickstart directives use a good starting point when creating
    Kickstart file manually.


    **kvalidator** is a utility that checks for syntax errors in a Kickstart file.
    It ensures that keys and options are properly used, but it does not validate URL
    paths, installed packages, or groups, not any of %post or %pre scripts will succeed.
    For instance, if firewall -- disabled is misspelled, **kvalidator** could produce
    one of the following:


    ```

    [user@host ~]$ kvalidator /tmp/anaconda-ks.cfg

    nThe following problem occurred on line 10 of the kickstart file:


    Unknown command: firewall


    [user@host ~]$ kvalidator /tmp/anaconda-ks.cfg

    The following problem occurred on line 10 of the kickstart file:


    no option: --disabled

    ```


    The **pykickstart** package provides **kvalidator.**'
