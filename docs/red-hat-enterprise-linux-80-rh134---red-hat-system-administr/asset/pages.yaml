  md: '# RESETTING THE ROOT PASSWORD


    # OBJECTIVES


    After completing this section, you should be able to log to a system and change
    the root password when the current root password has been lost.


    # RESETTING THE ROOT PASSWORD FROM THE BOOT LOADER


    One task that every system administrator should be able to accomplish resetting
    a lost root password. If the administrator is logged in, either as an unprivileged
    user with full sudo access, or as root, this task is trivial. When the administrator
    is not logged in, this task becomes slightly more involved.


    Several methods exist to set a new root password. A system administrator could,
    for example, boot the system using a Live CD, mount the root file from system,
    and edit /etc/shadow. In this section, we explore a method that does not require
    the use of external media.


    > NOTE

    Red Hat Enterprise 6 and earlier, administrators can boot the system into runlevel
    1 to get a root prompt. The closest analogs to runlevel 1 on a Red Hat Enterprise
    8 machine are the rescue and emergency targets, both of which require the root
    password to log in.


    On Red Hat Linux 8, it is possible to have the scripts that run the initramfs
    at certain points, provide a root shell, and then continue when that shell exits.
    It is mostly meant for debugging, but you can also use this method to reset a
    lost root password.


    To access that root shell, follow these steps:


    +   1. Reboot the system.

    2. Interrupt the boot loader countdown by pressing any key, except Enter.

    3. Move the cursor to the kernel entry to boot.

    4. Press e to edit the selected entry.

    5. Move the cursor to the kernel command line (the line that starts with linux).

    6. Append rd.break. With that option, the system breaks just before the system
    handles control of the initramfs to the actual system.

    7. Press Ctrl+x to boot with the changes.


    At this point, the system presents a root shell, with the actual root file system
    on the disk mounted read-only on /sysroot. Because troubleshooting often requires
    modification to the root file system, you need to change the root file system
    to read/write. The following step shows how the remount, rw option to the mount
    command remount the file system with the new option (rw) set.'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'Prebuilt images may place multiple console= arguments to the kernel to support
    a wide array of implementation scenarios. Those console= arguments indicate the
    devices to use for console output. The caveat with rd.break is that though the
    system sends kernel messages to all consoles, the prompt ultimately uses whichever
    console is given. If you do not get your prompt, you may want to temporarily reorder
    the console= arguments when you edit the kernel line from the boot loader.


    The system has not enabled SELinux, so any file you create does not have an SELinux
    context. Some tools, like the password command, first create a temporary file,
    move it in place of the file they are intended to, effectively creating a new
    file without an SELinux context. For this reason, when you use the password command
    with rd.break, the /etc/shadow does not get an SELinux context.


    To reset the root password from this point, use the following procedure:


    +   1. Remount /sysroot as read/write.


    ```

    switch_root:/ mount -o remount,rw /sysroot

    ```


    +   2. Switch into a root jail, where /sysroot is treated as the root of the file-system
    tree.


    ```

    switch_root:/# chroot /sysroot

    ```


    +   3. Set a new root password.


    ```

    sh-4.4# password root

    ```


    +   4. Make sure that all unlabeled files, including /etc/shadow at this point,
    get relabeled during boot.


    ```

    sh-4.4# touch /.autorelabel

    ```


    +   5. Type exit twice. The first command exits the chroot jail, and the second
    command exits the initramfs debug shell.


    At this point, the system continues booting, performs a full SELinux relabel,
    and then reboots again.


    # INSPECTING LOGS


    Looking at the logs of previously failed boots can be useful. If the system journals
    are persistent across reboots, you can use the journalctl tool to inspect those
    logs.


    Remember that by default, the system journals are kept in the /run/log/journal
    directory, which means the journals are cleared when the system reboots. To store
    journals in the /'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'var/log/journal directory, which persists across reboots, set the Storage parameter
    to persistent in /etc/systemd/journal.conf.


    ```

    [root@host]# vim /etc/systemd/journal.conf

    ...output omitted...

    [Journal]

    Storage=persistent

    ...output omitted...

    [root@host]# systemctl restart systemd-journal.service

    ```


    To inspect the logs of previous boots, use the -b option of journalctl Without
    any arguments, the -b option only displays messages since the last boot. With
    a negative number as an argument, it displays the logs of previous boots.


    ```

    [root@host]# journalctl -b -1 -p err

    ```


    This command shows all messages rated as an error or worse from the previous boot.


    # REPAIRING SYSTEMD BOOT ISSUES


    To troubleshoot shell startup issues at boot time, Red Enterprise Linux 8 makes
    the following tools available.


    # Enabling the Early Debug Shell


    By enabling the debug-shell service with systemctl enable debug-shell.service,
    the system spawns a root shell on TTY9 (Ctrl+Alt+F9) early during the boot sequence.
    This shell is automatically logged in as root, so that administrators can debug
    the system while the operating system is still booting.


    > WARNING

    Do not forget to disable the debug-shell.service when you are done debugging,
    because it leaves an unauthenticated root shell open to anyone with local console
    access.


    # Using the Emergency and Rescue Targets


    By appending system.unit=rescue.target or system.unit=emergency.target to the
    kernel line from the boot loader, the system spawns into a root or rescue shell
    instead of starting normally. Both of these shells require the root password.


    The emergency target keeps the root file system mounted read-only


    Administrators can use these shells to fix any issues that prevent the system
    from booting normally; for example, a dependency loop between services, or an
    incorrect entry in /etc/fstab. Exiting from these shells continues with the regular
    boot process.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Identifying Stuck Jobs


    During startup, systemd spawns a number of jobs. If some of these jobs cannot
    complete, they block other jobs from running. To inspect the current job list,
    administrators can use the systemctl list-jobs command. Any jobs listed as running
    must complete before the jobs listed as waiting can continue.


    > REFERENCES

    dracut.cmdline(7), systemd-journald(8), journald.conf(5), journalctl(1), and systemctl(1)
    man pages'
