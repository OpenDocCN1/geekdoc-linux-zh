- img_proc: true
  md: "# EXTENDING A LOGICAL VOLUME AND XFS FILE SYSTEM\n\nOne benefit of logical\
    \ volumes is the ability to increase their size without experiencing downtime.\
    \ Free extents in a volume group can be added to a logical volume to extend its\
    \ capacity, which can then be used to extend the file system contains.\n\n# Extending\
    \ a Logical Volume\n\nTo extend a logical volume, perform the following steps:\n\
    \nVerify that the volume group has space available.\n\nUse vgdisplay to verify\
    \ that there are sufficient ext ext.\n\n```\n[root@host]# vgdisplay vg01\n-- Volume\
    \ group ---\nVG Name                  vg01\n  output omitted...\n  PE / Size \
    \              178 / 712.00 MiB\n  output omitted...\n```\n\nInspect the Free\
    \ PE in the output. Confirm if the volume group has sufficient free space for\
    \ the LV extension. If insufficient space is available, then extend the volume\
    \ group appropriately. See the section called \"Extending and Reducing Volume\
    \ Group\"\n\n# Extending the logical volume.\n\nUse lvextend_DEVICE_NAME to extend\
    \ the logical volume to a new size.\n\n```\n[root@host]# lvextend -L 300M /dev/vg01/lv01\n\
    ```\n\nThis increases the size of the logical volume vg01 by 300 MiB. Notice the\
    \ plus sign (+) in front of the size, which means adding this value to the size;\
    \ otherwise, the value defines the final size of the LV.\n\nAs with lvcreate,\
    \ different methods exist to specify the size: the -l option expects the number\
    \ of physical extents as the argument. The -L option expects size in bytes, megabytes,\
    \ gigibytes, and similar.\n\nThe following list provides some examples of extending\
    \ LVs.\n\n# Extending LVs Examples\n\n| COMMAND | RESULTS |\n|---|---|\n| lvextend\
    \ -l 128 | Resize the logical volume to exactly 128 extents in size. |\n| lvextend\
    \ -l +128 | Add 128 extents to the current size of the logical volume. |\n| lvextend\
    \ -L 128M | Resize the logical volume to exactly 128 MiB. |\n| lvextend -L +128M\
    \ | Add 128 MiB to the current size of the logical volume. |"
  merge: -1
  pgno: 228
- img_proc: true
  md: '# CHAPTER | Managing Logical Volumes


    | COMMAND | RESULTS |

    |---|---|

    | lvextend -l +50%FREE | Add 50 percent of the current free space in the VG to
    the LV. |


    # Extend the file system.


    Use xfs_growfs mountpoint to expand the file system to occupy the extended LV.
    The target file system must be mounted when you use the xfs_growfs command. You
    can continue to use the file system while it is being resized.


    ```

    [root@host ~] xfs_growfs /mnt/data

    ```


    > NOTE

    common mistake is to run lvextend but forget to run xfs_growfs. An alternative
    to running the two steps consecutively is to include the -r option with the lvextend
    command. This resizes the file system after the LV is extended, fsadm(8). It works
    with a number of different file systems.


    +   - Verify the new size of the file system:


    ```

    df -h /mountpoint.

    ```


    # EXTENDING A LOGICAL VOLUME AND EXT4 FILE SYSTEM


    The steps for extending an ext4-based logical system are essentially the same
    as for an XFS-based LV, except for the step that resizes the file system. Review
    the section called "Extending a Logical Volume and XFS File System".


    # Verify that the volume group has space available.


    Use vgdisplay VGNAME to verify that the volume group has a sufficient number of
    physical extents available.


    # Extend the logical volume.


    Use lvextend -l +extents /dev/vgname/lvname to extend the logical volume /dev/vgname/lvname


    # Extend the file system.


    Use resize2fs /dev/vgname/lvname to expand the file system to occupy the new extended
    LV. The file system can be mounted in while the extension command is running.
    You can include the -p option to monitor the progress of the resize operation.


    ```

    [root@host #] resize2fs /dev/vg0/lv1

    ```


    > NOTE

    The primary difference between xfs_growfs and resize2fs is the argument passed
    to identify the file system. xfs_growfs takes the mount point and resize2fs takes
    the logical volume name.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# EXTEND LOGICAL VOLUME AND SWAP SPACE


    Logical volumes formatted as swap space can be extended as well, however the process
    is different than the one for extending a file system, such as ext4 or XFS. Logical
    volumes formatted with a file system can be extended dynamically with no downtime.
    Logical volumes formatted with swap space must be offline in order to extend them.


    Verify the volume group has swap space.


    Use vgdisplay vgname to verify that a sufficient number of free physical extents
    are available.


    Deactivate the swap space.


    Use swapoff -v /dev/vgname/lvname to deactivate the swap space on the logical
    volume.


    > WARNING

    Your system must have enough free memory or swap space to accept anything that
    needs to page in when the swap space on the logical volume is deactivated.


    Extend the logical volume.


    lvextend -1 +extents /dev/vgname/lvname extends the logical volume /dev/vgname/lvname
    by the extents value.


    Format the logical volume as swap space.


    mkswap /dev/vgname/lvname formats the entire logical volume as swap space.


    Activate the swap space.


    Use swapon -va /dev/vgname/lvname to activate the swap space on the logical volume.


    > REFERENCES

    lvm(8), pvcreate(8), pvmove(8), vgdisplay(8), vgxtend(8), vgreduce(8),

    vgdisplay(8), vgxtend(8), vgreduce(8), lvextend(8), fdisk(8), gdisk(8),

    parted(8), probepart(8), xfs_growfs(8), and resizefs(8) swapoff(8)

    swapon(8) mkswap(8)man pages'
  merge: -1
