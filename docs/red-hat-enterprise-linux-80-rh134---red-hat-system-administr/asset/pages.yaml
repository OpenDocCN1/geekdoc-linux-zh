  md: '# CHANGING THE SELINUX

    ENFORCEMENT MODE


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Explain how SELinux protects resources.

    - Change the current SELinux mode of a system.

    - Set the default SELinux mode of a system.


    # HOW SELINUX PROTECTS RESOURCES


    SELinux provides a critical purpose in Linux, permitting or denying access to
    files and other resources that are significantly more precise than user permissions.


    File permissions control which users or groups of users can access specific files.
    However, a user given read or write access to any specific file can use that file
    in any way that user chooses, even if that is not how the file should be used.


    For example, with write access to a file, a structured data file designed to be
    written using only a particular program, be be opened and modified by other editors
    that could result in corruption?


    File permissions cannot stop such undesired access. They were never designed to
    control how a file is used, but only who is allowed to read, write, or run a file.


    SELinux consists of policies, defined by the application developers, who declare
    exactly what actions and accesses are proper and allowed for each binary executable,
    configuration, and data file used by an application. This is known as a targeted
    policy because one policy is written to cover the activities of a single application.
    Policies define predefined labels that are placed on individual programs, files,
    and network ports.


    # WHY USE SELINUX ENHANCED LINUX?


    Not all security issues can be predicted in advance. SELinux prevents a vulnerability
    in one application affecting other applications or the underlying system. SELinux
    provides an extra layer of security; it adds a layer of complexity which can be
    off-putting to new this subsystem. Learning to work with SELinux may take time
    but the enforcement policy ensures that a weakness in one part of the system does
    not spread to other parts. If SELinux works poorly with a particular subsystem,
    you can turn off enforcement for that specific service until you find a solution
    to the underlying problem.


    SELinux has three modes:


    +   - Enforcing: SELinux is enforcing access control rules. Computers generally
    run in this mode.

    - Permissive: SELinux is active but instead enforcing access control rules, it
    creates warnings of rules that have been violated. This is used primarily for
    testing and troubleshooting.

    - Disabled: SELinux is turned off entirely: no SELinux violations are denied,
    nor ever recorded. Discouraged!'
  merge: -1
