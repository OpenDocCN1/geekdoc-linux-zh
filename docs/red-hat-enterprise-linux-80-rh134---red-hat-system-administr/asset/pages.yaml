  md: '# CHAPTER 8 Implementing Advanced Storage Features


    # COMPRESSING AND DEDUPLICATING STORAGE WITH VDO


    # OBJECTIVES


    After completing this section, you should be able to optimize the use of storage
    space by using VDO to compress and deduplicate on storage devices.


    # DESRIBING VIRTUAL DATA OPTIMIZER


    Red Hat Enterprise Linux 8 includes the Virtual Data Optimizer (VDO) driver, which
    optimizes the data footprint on block devices. VDO is a Linux device mapper driver
    that reduces disk space on block devices, and minimizes the replication of data,
    saving disk space and even increasing data throughput. VDO includes two kernel
    modules: the kvdo module to transparently control data, and the uds module for
    deduplication.


    The VDO layer is placed on top of an existing block storage device, such as a
    RAID device or a local disk. These block devices can be encrypted. The storage
    layers, such as LVM volumes and file systems, are placed on top of a VDO device.
    The following diagram shows the placement of VDO in an infrastructure consisting
    of KVM virtual machines that are optimized storage devices.


    | Virtual Machine | Virtual Machine | Virtual Machine | Virtual Machine | Virtual
    Machine |

    | KVM Hypervisor |

    | VDO |

    | RAID Layer |

    | Block Device | Block Device | Block Device | Block Device |


    Figure 8.4: VDO-based virtual machines


    VDO applies three phases to data to reduce the footprint on storage devices:


    +   - **Zero-Block Elimination** filters out blocks that contain only zeros (O)
    and records the information of these blocks only in the metadata. The nonzero
    data blocks are passed to the next phase of processing. This phase enables the
    thin provisioning in the VDO devices.

    - **Deduplication** eliminates redundant data blocks. When you create multiple
    copies of the same data, VDO detects the duplicate data blocks and updates the
    metadata to use those duplicate blocks as references to the original data block
    without creating redundant data blocks. The universal deduplication (UDS) kernel
    module checks redundancy of the data through the metadata it maintains. This kernel
    module shifts part of the VDO.

    - **Compression** is the last phase. The kvdo kernel module compresses the data
    blocks using LZ4 compression and groups them on 4 KB blocks.


    RH134-RHEL8.0-en-1-20190531


    237'
