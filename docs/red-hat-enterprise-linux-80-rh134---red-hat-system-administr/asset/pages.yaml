  md: '# TESTING S INPUTS


    To ensure that scripts are not easily disrupted by unexpected conditions, it is
    a good practice to not make assumptions regarding input, command-line arguments,
    user input, command substitutions, variable expansions, and file-name expansions.
    Integrity checking can be performed using Bash''s test command.


    Like all commands, the test command produces an exit code upon completion, which
    is stored in the $?. To see the conclusion of a test, display the value of $ immediately
    following the execution of the test command. Again, an exit status of 0 indicates
    the test succeeded, and nonzero values indicate the test failed.


    Tests are performed using a variety of operators. Operators can be used to determine
    if a number is greater than, greater or equal to, less, less or equal to, or equal
    to another number. They can be used to test if a string is the same as another
    of text. Operators can also be used to evaluate if a variable has a value or not.


    > Many types of operators are used in shell scripting, in addition to the comparison
    operators taught here. The man page for test(1) lists the important conditional
    expression operators with descriptions. The bash(1) man page explains operator
    use and evaluation, which is a very difficult read for beginners. It is recommended
    that students further their advanced shell scripting needs through books and courses
    dedicated to shell programming.


    The following examples demonstrate the use of the test command using Bash''s numeric
    operators.


    ```

    [user@host ~]$ test 1 -gt 0; echo $?

    0

    [user@host ~]$ test 0 -lt 1; echo $?

    1

    ```


    Tests can be performed using the Bash test command syntax, <<TESTEXPRESSION>].
    They can also be performed using Bash''s newer extended test command syntax, [[TESTEXPRESSION>]],
    which has been available since Bash version 2.02 and provides features such as
    regex pattern matching.


    The following examples demonstrate the use of Bash test command syntax and Bash''s
    numeric comparison operators.


    ```

    [user@host ~]$ 1 -eq 1; echo $?

    0

    [user@host ~]$ 1 -ne 1; echo $?

    1

    [user@host ~]$ 8 -gt 2; echo $?

    0

    [user@host ~]$ 2 -lt 2; echo $?

    0

    ```'
