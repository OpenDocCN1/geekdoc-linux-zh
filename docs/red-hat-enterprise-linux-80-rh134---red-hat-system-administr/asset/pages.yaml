  md: '# MANAGING VIRTUAL MACHINES WITH COCKPIT


    The virt Yum module provides the virsh command to manage your virtual machines.
    The Cockpit tool provides a web console interface for KVM management and virtual
    machine creation.


    ![](img/3c5dfc78dee328600013666607c8aa7b_386_0.png)


    Install the cockpit-machines package to add the Virtual Machines menu to Cockpit.


    ```

    [root@host ~] yum install cockpit-machines

    ```


    If Cockpit is not already running, start and enable it.


    ```

    [root@host ~] systemctl enable --now cockpit.socket

    ```


    To create a new virtual machine with Cockpit, access the Virtual Machines menu
    in the Cockpit web interface. From there, click Create VM and enter the VM configuration
    in the Create New Virtual Machine window.


    > Figure 12.6: Managing virtual machines in Cockpit'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# CHAPTER 12 | Installing Red Hat Enterprise Linux


    ![](img/3c5dfc78dee328600013666607c8aa7b_387_0.png)


    Figure 12.7: Creating a virtual machine in Cockpit


    +   - **Name** sets a *domain* for the virtual machine configuration. This name
    is unrelated to the network host name you give the system in the VM.

    - **Installation Source Type** is the method for retrieving the installation ISO
    file. Choices include the local file system, or an HTTPS, FTP, or NFS URL.

    - **Installation Source** provides the path to the installation source.

    - **OS Vendor** and **Operating System** indicates the virtual machine’s operating
    system. The virtualization layer presents hardware emulation compatible with the
    operating system chosen.

    - **Memory** is the amount of RAM to make available to the new VM.

    - **Storage Size** is the disk size to give the new VM. Associate additional disks
    with the VM after installation.

    - **Immediately Start VM** indicates whether the VM should immediately start after
    you click **Create.**


    Click **Create** to create the VM and **Install** to start the operating system
    installation. Cockpit displays the VM console from which you can install the system.'
