  md: '# COMPREHENSIVE REVIEW


    # OBJECTIVES


    After completing this section, you should have reviewed and refreshed the knowledge
    and skills learned in Red Hat System Administration II.


    # REVIEWING RED HAT SYSTEM ADMINISTRATION II


    Before beginning the comprehensive review for this course, you should be comfortable
    with the topics covered in each chapter.


    You can refer to earlier sections in the textbook for extra study.


    # Chapter 1, Improving Command-line Productivity


    Run commands more efficiently using advanced features of the Bash shell, shell
    scripts, and various utilities provided by Red Hat Enterprise Linux.


    +   - Automate sequences of commands by writing a simple shell script.


    +   - Efficiently run commands over lists of items in a script or from the command-line
    using loops and conditionals.


    +   - Find text matching a pattern in log files and command output using the grep
    command and regular expressions.


    # Chapter 2, Scheduling Future Tasks


    Schedule tasks to automatically execute in the future.


    +   - Set up a command that runs once at some point in the future.


    +   - Schedule commands to run on a repeating schedule using a user''s crontab.


    +   - Schedule commands to run on a repeating schedule using the system crontab
    file and directories.


    +   - Enable and disable system timers, and configure a timer that manages temporary
    files.


    # Chapter 3, Tuning System Performance


    Improve system performance by setting tuning parameters and adjusting scheduling
    priority of processes.


    +   - Optimize system performance by selecting a tuning profile managed by the
    true daemon.


    +   - Prioritize or de-prioritize specific processes with the nice and rename
    commands.


    # Chapter 4, Controlling Access to Files with ACLs


    Interpret and set Access Control Lists (ACLs) on files to handle situations requiring
    complex user and group access permissions.'
