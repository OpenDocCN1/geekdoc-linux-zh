  md: '# IMPLEMENTING VIRTUAL DATA OPTIMIZER


    The logical devices that you create with VDO are called VDO volumes. VDO volumes
    are similar to disk partitions, you can format the volumes with the desired file-system
    type and make it like a regular file system. You can also use a VDO volume as
    an LVM volume.


    To create a VDO volume, specify a block device and the name of the logical device
    that VDO presents to the user. You can optionally specify the logical size of
    the VDO volume. The logical size of the VDO volume can be more than the physical
    size of the actual block device.


    Because the VDO volumes are thinly provisioned, you can only see the logical space
    in use and if you do not specify the logical size creating the volume, VDO assumes
    the physical size as the logical size of the VDO. 1:1 ratio of mapping logical
    size to physical size gives better performance but provides less efficient of
    storage space. Based on your infrastructure requirements, you should prioritize
    performance or storage efficiency.


    When the logical size of a VDO volume is more than the actual physical size, you
    should proactively monitor the volume statistics to view the actual usage using
    vdostats --verbose command.


    # Enabling VDO


    Install the vdo and kmod-kvdo packages to enable VDO in the system.


    ```

    ```root@host]# yum install vdo kmod-kvdo

    ...output omitted...

    Is this ok [y/N]: y

    ...output omitted...

    Complete!

    ```

    ```


    # Creating a VDO Volume


    To create a VDO volume, run the vdo create command.


    ```

    ```root@host]# vdo create --name=vdo1 --device=/dev/vdd --vdoLogicalSize=50G

    ...output omitted...

    ```

    ```


    If you omit the logical size, the resulting VDO volume gets the same size as its
    physical device.


    When the VDO volume is in place, you can format it with the file-system type of
    your choice and mount it under your system.


    # Analyzing a VDO Volume


    To analyze a VDO volume, run the vdo status command. This command displays a report
    on the VDO system, and the status of the VDO volume in YAML format. Use the --name=
    option to specify the name of a particular volume. If you omit the name of the
    volume, the output of the vdo status command displays the status of all VDO volumes.


    ```

    ```root@host]# vdo status --name=vdo1

    ...output omitted...

    ```

    ```'
