  md: '# CHAPTER 1 Improving Command-line Productivity


    the regular expression with c[aou] matches patterns that start with a c, followed
    by either a, o, or u, followed by a t.


    Multipliers are a mechanism used with wildcards. Multipliers apply to the previous
    character in the regular expression. One of the more common multipliers is the
    asterisk, or character (*). When used in a regular expression, this multiplier
    means zero or more of the previous expression. You can use * with expressions,
    not just characters. For example, c[aou]*t. A regular expression of c* matches
    cat, coat, culvert, and even ct (zero characters between the c and the t). Any
    it starting with a c, then or more characters, ending with a t.


    Another type of multiplier would indicate the number of previous characters desired
    in the pattern. An example of using an explicit multiplier would be ''c.{2}t''.
    This regular expression will match any word beginning with a c, followed by exactly
    two characters, and ending with a t. ''c.{2}t'' would match two in the example:


    ```

    cat

    coat convert

    cart cover

    cypher

    ```


    > NOTE

    It is recommend practice to use single quotes to encapsulate the regular expression
    because they often contain metacharacters (such as $, *, and {}). This ensures
    that the characters are interpreted by the command and not by the shell.


    > NOTE

    This has introduced two distinct metacharacter parsing systems: shell pattern
    matching (also known as globbing or file-name expansion), and regular expressions.
    Both systems use similar metacharacters, such as the asterisk (*), but have differences
    in interpretation interpretation and rules, the two systems can be confusing until
    each is sufficiently mastered.


    Pattern matching is a command-line parsing technique designed for specifying many
    files names, and is primarily supported only for representing file-name patterns
    on the command line. Regular expressions are designed to represent any form or
    pattern in strings, no how complex. Regular expression are internally supported
    by numerous text processing commands, such as grep, sed, awk, python, perl, and
    many applications, with some minimal command-dependent variations in interpretation
    rules.


    # Regular Expressions


    | | DESCRIPTION |

    |---||

    | . | The period (.) matches any single character |

    | ? | The preceding item is optional and will be matched at most once |

    | * | The preceding item will be matched zero or more times |

    | + | The preceding item will be matched one or more times |


