  md: '# CHAPTER6 | Accessing Network-Attached Storage


    (the /etc/sysconfig/nfs file from earlier versions of the operating system is
    deprecated now. Use the /nfsconf tool to get, set, or unset nfs configuration
    parameters.


    The /etc/nfs.conf configuration file is composed of multiple sections with square
    brackets [keyword] with value assignments the section. For an NFS server, configure
    the [nfsd] section. A value assignment or key is composed of a name for the value,
    an equals sign, and a setting for the value, as vers4.2=y. The lines with "# or
    "" are ignored, as are any blank lines.


    ```

    [user@host ~]$ sudo cat /etc/nfs.conf

    ...output omitted...

    [nfsd]

    # debug=0

    # threads=8

    # host=

    # port=0

    # grace-time=90

    # lease-time=90

    # tcp=y

    # vers2=n

    # vers3=y

    # vers4.0=y

    # vers4.1=y

    # vers4.2=y

    # rdma=n

    ```


    By default the [nfsd] section''s key-value pairs are commented out. However, the
    comments show the default options that will take effect if they are changed. This
    provides you with a good starting point for NFS configuration.


    Use nfsconf --set section key value to set a value for the key in the specified
    section.


    ```

    [user@host ~]$ sudo nfsconf --set nfsd vers4.2 y

    ```


    This command updates the /etc/nfs.conf configuration file:


    ```

    [user@host ~]$ sudo cat /etc/nfs.conf

    ...output omitted...

    [nfsd]

    vers4.2 = y

    # debug=0

    # threads=8

    # host=

    # port=0

    # grace-time=90

    # lease-time=90

    # tcp=y

    # vers2=n

    # vers3=y

    # vers4=y

    ```'
