    # USING EXIT CODES WITHIN A SCRIPT


    After a script has processed all of its contents, it exits to the process that
    it called. However, there may be times when it is desirable to exit a script before
    it finishes, as when an error condition is encountered. This can be accomplished
    with the use of the exit command within a script. When a script encounters the
    exit command, it exits immediately and does not process the remainder of the script.


    The exit command can be executed with an optional integer argument between 0 and
    255, which represents an exit code. An exit code is that is returned after a process
    has completed. An exit value of 0 represents no error. All other nonzero values
    indicate an exit code. You can use different nonzero values to differentiate different
    types of errors encountered. This exit code is passed back to the parent process,
    which stores it in the ? variable and can be accessed with $ demonstrated in the
    following examples.


    ```

    [user@host bin]$ cat hello

    #!/bin/bash

    echo "Hello, world"

    exit 0

    ```


    ```

    [user@host bin]$ ./hello

    Hello, world

    ```


    ```

    [user@host bin]$ echo $?

    0

    ```


    If the exit command is called without an argument, then the script exits and passes
    the exit status of the last command executed to the parent process.'
