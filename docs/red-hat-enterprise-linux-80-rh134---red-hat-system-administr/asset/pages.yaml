  md: '# FIREWALL-CMD COMMANDS


    # EXPLANATION


    | --remove-port=PORT/PROTOCOL [--zone=ZONE] | Remove the PORT/PROTOCOL port(s)
    from the allowed list for the zone. if no --zone= is provided, the default zone
    is used. |

    | --reload | Drop the runtime configuration and apply the persistent configuration.
