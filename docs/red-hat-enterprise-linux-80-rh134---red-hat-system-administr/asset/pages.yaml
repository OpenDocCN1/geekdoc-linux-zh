  md: '# INSTALLING RED HAT ENTERPRISE LINUX


    # OBJECTIVES


    After completing this section, you should be able to install Red Hat Enterprise
    Linux on a server.


    # SELECTING INSTALLATION MEDIA


    Red Hat provides several installation media that you can download from the Customer
    Portal using your active subscription.


    +   - A binary DVD containing Anaconda, the Red Hat Enterprise Linux installation
    program, and the BaseOS and AppStream package repositories. These repositories
    contain the packages needed to complete the installation without additional media.

    - A boot ISO containing Anaconda, but requires a configured network to access
    package repositories available using HTTP, FTP, or NFS.

    - A QCOW2 image containing a preset system disk ready to deploy as a virtual machine
    in cloud or enterprise virtual environments. QCOW2 (QEMU Copy On Write) is the
    standard image format used by Red Hat.


    Red Hat provides installation media for four supported architectures: x86 64-bit
    (AMD and Intel), IBM Power Systems (Little Endian), IBM Z, and ARM 64-bit.


    After downloading, burn the DVD or boot ISO to physical media, copy each to a
    USB flash drive or publish, or push each from a network server using Kickstart
    use.


    # Building Images with Composer


    Composer is a new tool in RHEL 8. For specialized cases, Composer allows administrators
    to build custom system images for deployment on cloud platforms or virtual environments.


    Composer uses the Cockpit graphical console. It can also be invoked from a command
    line using the `composer-cli` command.


    # MANUAL INSTALLATION WITH ANACONDA


    Using the binary DVD or boot ISO, administrators can install a RHEL system on
    a bare-metal server or a virtual machine. The Anaconda program supports two installation
    methods:


    +   - The manual installation interacts with the user to query how Anaconda should
    install and configure the system.


    +   - The automated installation uses a Kickstart file which tells Anaconda how
    to install the system. A later section details Kickstart installations in greater
    detail.


    # Installing RHEL with the Graphical Interface


    When you boot the system from the binary DVD or the boot ISO, Anaconda starts
    as a graphical application.'
  merge: -1
