    The example commands below set the default zone to dmz, assign all traffic coming
    from the 192.168.0./24 to the internal zone, and open the network ports for the
    mysql service on the internal zone.


    ```

    [root@host]# firewall-cmd --set-default-zone=dmz

    [root@host]# firewall-cmd --permanent --zone=internal \

    add-source=192.168.0./24

    [root@host]# firewall-cmd --permanent --zone=internal --add-service=mysql

    [root@host]# firewall-cmd --reload

    ```


    > > NOTE

    For situations where the basic syntax of firewallld is not enough, you can also
    add rich-rules, a more expressive syntax, to write complex rules. Even if the
    rich-rules syntax is not enough, you can also use Direct Configuration rules,
    raw nft syntax mixed in with firewallld rules.

    These advanced modes are beyond the scope of this chapter.


    +   firewall-cmd(1), firewallld(1), firewallld.zone(5), firewallld.zones(5), and
    nft(8) man pages'
