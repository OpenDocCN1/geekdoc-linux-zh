  md: '# CHAPTER | Accessing Network-Attached Storage


    Use systemctl to start and enable the autofofs service.


    ```

    [user@~$ sudo systemctl enable --now autofofs

    Created symlink /etc/systemd/system/multi-user.target.wants/autofofs.service ->
    /usr/lib/systemd/system/autofofs.service.

    ```


    # Direct Maps


    Direct maps are used to map an NFS share to an existing absolute path point.


    To directly map mounted points, the master map file may appear as follows:


    ```

    / /etc/auto.direct

    ```


    All direct map entries use / - the base directory. In this case, the mapping file
    that contains the mount details is /etc/auto.direct.


    The content for the /etc/auto.direct file may appear as follows:


    ```

    /mnt/docs -rw, sync serverb:/shares/docs

    ```


    The mount point (or key) is always an absolute path. The rest of the mapping file
    uses the structure.


    In this example the /mnt directory exists, and it is not managed by autofofs.
    The full directory / mnt/docs will be created and removed automatically by the
    autofofs service.


    # Indirect Wildcard Maps


    When an NFS server exports multiple subdirectories within a directory, the automounter
    can be configured to access any one of those subdirectories using a single mapping
    entry.


    Continuing the previous example, serverb:/shares exports two or more subdirectories
    and they are accessible using the same mount point, then the content for the /etc/auto.demo
    file might appear as follows:


    +   * -rw, sync serverb:/shares/


    The mount point (or key) is an asterisk character (*), and the subdirectory on
    the source location is an ampersand character (&). Everything else in the entry
    is the name.


    When a user attempts to access /shares/work, the key * (which is work in this
    example) replaces the ampersand in the source location and serverb:/shares/work
    is mounted. With the indirect example, the work directory is created and removed
    automatically by autofofs.


    > REFERENCES

    autofs(5), automount(8), auto.master(8), and mount.nfs(8) man pages'
