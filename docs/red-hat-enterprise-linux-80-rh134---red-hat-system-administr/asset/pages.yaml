  md: '# CHAPTER 1 | Improving Command-line Productivity


    In this conditional structure, Bash tests the conditions in the order presented.
    When it finds a condition that is true, Bash executes the actions associated with
    the condition and then skips the remainder of the conditional structure. If none
    of the conditions are true, Bash executes the actions enumerated in the **else**
    clause.


    The following code section demonstrates the use of an **if/then/elif/then/else**
    statement to run the **mysql** client if the **mariadb** service is active, run
    the client if the **postgresql** service is active, or run the **sqlite3** client
    if both the **mariadb** and **postgresql** services are not active.


    ```

    [user@host ~] systemctl is-active mariadb > /dev/null 2>&1

    MARIADB_ACTIVE=$$

    [user@host ~] sudo systemctl is-active postgresql > /dev/null 2>&1

    POSTGRESQL_ACTIVE=$$

    [user@host ~] if [ "$MARIADB_ACTIVE" -eq 0 ]; then

    > mysql

    > elif [ "POSTGRESQL_ACTIVE" -eq 0 ]; then

    > psql

    > else

    > sqlite3

    > fi

    ```


    # REFERENCES

    bash(1) man page'
