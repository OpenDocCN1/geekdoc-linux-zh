  md: '# WRITING SIMPLE BASHL SCRIPTS


    # OBJECTIVES


    After completing this section, you should be able to automate sequences of commands
    by writing a simple shell script.


    # CREATING AND EXECUTING BASHL SCRIPTS


    Many simple, common system administration tasks are achieved using command-line
    tools. Tasks with greater complexity often require chaining multiple commands
    that pass results between them. Using the Bash environment and scripting features,
    Linux commands are combined into shell scripts to easily repetitive and difficult
    real-world problems.


    In its simplest form, a Bash script is an executable file that contains a list
    of commands, and possibly with programming logic to control the overall task.
    When well-written, a shell script is a powerful command-line tool on its own,
    and can be leveraged by other scripts.


    Shell proficiency is essential to successful system administration in any operational
    environment. Working knowledge of shell scripting is crucial in enterprise environments,
    where your script can improve the efficiency and accuracy of routine completion.


    You can create a Bash script by opening a new empty file in a text editor. While
    you can use any text editor, advanced editors, such as vim or emacs, understand
    Bash shell syntax and provide color-coded highlighting. This helps identify common
    errors such as improper syntax, unpaired quotes, parentheses, brackets, and much
    more.


    # Specifying the Command Interpreter


    The first line of a script begins with ''#!'', commonly referred to as sh-bang
    or shebang, from the names of these two characters, sharp and bang. This two-byte
    magic number indicates an interpretive script: syntax that the following is the
    fully-qualified filename for the correct interpreter needed to process this script''s
    lines. To understand how magic numbers indicate file types in Linux, see the file(1)
    and magic(5) pages. For script files using Bash scripting, the first line of a
    shell script begins as follows:


    ```

    #!/bin/bash

    ```


    # Executing a Bash Script


    A completed shell script must be executable to run as an ordinary command. Use
    the chmod command to add execute permission, in conjunction with the chown command
    to change the file ownership of the script. Grant execute permission only for
    intended users of the script.


    If you place the script in one of the directories listed in the PATH environment
    variable, then you can invoke the script using the file name as any other command.
    The shell uses the first command it finds with that file name; avoid using existing
    command names for your shell script file name. Alternatively, you can invoke a
    script by entering a path to the'
