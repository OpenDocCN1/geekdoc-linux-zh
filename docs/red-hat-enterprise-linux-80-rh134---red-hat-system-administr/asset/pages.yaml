  md: '# ADJUSTING SELINUX POLICY WITH BOOLEANS


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Activate and deactivate SELINUX policy rules using **setbool**

    - Manage the persistent value of SELINUX booleans using the **semanage boolean
    -l** command.

    - Consult man pages that with _selinux_ to find useful information about SELinux
    booleans.


    # SELINUX BOOLEANS


    SELINux booleans are switches that change the behavior of the SELinux policy.
    SELinux booleans are rules that can be enabled or disabled. They can be used by
    security administrators to tune the policy to make selective adjustments.


    The SELinux man pages, provided with the _selinux-policy-doc_ package, describe
    the purpose of the available booleans. The **man -k '' _selinux''** command lists
    these man pages.


    Commands used for managing SELLinux booleans include **getboolean**, which lists
    booleans and their state, and **setbool**. **setbool -P** modifies the SELINUX
    policy to make the modification persistent. **semanage boolean -l** reports on
    whether or not a boolean is persistent, along with a short description of the
    boolean.


    Non-privileged users can run the **getboolean** command, but must be a superuser
    to run **semanage boolean -l** and **setbool -P**.


    ```

    [user@host ~]$ getboolean -a

    abrt_anon_write -> off

    abrt_handle_event -> off

    abrt_cmd_watch_anon_write -> on

    antivirus_scan_system -> off

    antivirus_use_jit -> off

    ...output omitted.

    [user@host ~]$ getboolean httpd_homediedirs

    http_homediedirs -> off

    ```


    ```

    [user@host ~]$ setboolean httpd_homediedirs on

    Could not activate active booleans. Please try as root: Permission denied

    [user@host ~]$ sudo setboolean httpd_homediedirs on

    [user@host ~]$ sudo semanage boolean -l | grep httpd_homediedirs

    httped_homediedirs (on (off)) Allow httpd to be homedirs

    [user@host ~]$ getboolean httpd_homediedirs

    httpd_homediedirs -> on

    ```


    The **-P** option writes all values to the policy, making them persistent across
    reboots. In the example that follows, note the values in parentheses: both are
    now set to on.'
