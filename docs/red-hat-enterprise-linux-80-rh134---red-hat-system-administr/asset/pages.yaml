    # MOUNTING FILE SYSTEMS


    After you have added the file system, the last step is to mount the file system
    to a directory in the directory structure. When you mount a file system onto the
    directory hierarchy, user-space utilities can access or write files on the device.


    # Manually Mounting File Systems


    Administrators use the mount command to manually attach the device onto a directory
    location, or mount point. The mount command expects the device, the mount point,
    and optionally file system options. The file-system options customize the behavior
    of the file system.


    ```

    [root@host ~]# mount /dev/vdb1 /mnt

    ```


    You may also use the mount command to view mounted file systems, the mount points,
    and the options.


    ```

    [root@host ~]# mount | grep vdb1

    /dev/vdb1 on /mnt type xfs (rw, relatime, seclabel,attr2, inode64, noquota)

    ```


    # Persistently Mounting File Systems


    Manually mounting a file system is a good way to verify that a formatted device
    is accessible and working as expected. However, when the server reboots, the system
    does not automatically mount the file system onto the directory tree again; the
    data is on the file system, but users cannot access it.


    To make sure that the system automatically mounts the file system at boot, add
    an entry to the /etc/fstab file. This configuration file lists the file systems
    to mount at boot.


    /etc/fstab is a white-space-delimited file with six fields per line.


    ```

    [root@host ~]# cat /etc/fstab


    #

    # /etc/fstab

    # Created by anaconda on Wed Feb 13 16:39:59 2019

    #

    # Accessible filesystems, by reference, are maintained under ''/dev/disk/''.

    # See pages fstab(5), findsfs(8), mount(8) and/or blkid(8) for more info.

    #

    # After editing this file, run ''systemctl daemon-reload'' to update systemd

    # units generated from this file.

    ```


    RHT34-RHEL8.0-en-20190531'
