    # ## Troubleshooting the Installation


    During a Red Hat Enterprise Linux 8 installation, Anaconda provides two virtual
    consoles. The first has five windows provided by the **tmux** software terminal
    multiplexer. You can access that console with **Ctrl+Alt+F1**. The second console,
    displays by default, shows the Anaconda graphical interface. You can access it
    with **Ctrl+Alt+F6**.


    In the first console, **tmux** provides a prompt in the second window. You may
    use it to enter commands to inspect and troubleshoot the system while the installation
    continues. The other windows provide diagnostic messages, logs and other information.


    The following table lists the keystroke combinations to access the virtual consoles
    and the tmux windows. For tmux, the keyboard shortcuts are performed in two actions:
    press and release **Ctrl-b**, then press the number of the window you want to
    access. With **tmux**, you can also use **Alt+Tab** to rotate the focus between
    the windows.


    | KEY SEQUENCE | CONTENTS |

    | --- | --- |

    | Ctrl+Alt+F1 | Access the tmux terminal multiplexer. |

    | Ctrl+b1 | When tmux, access the main information page for the installation process.
    |

    | Ctrl+b2 | When tmux, provide a root shell. Anaconda stores the installation
    log files in the /tmp file. |

    | Ctrl+b3 | When tmux, display the contents of the /tmp/anaconda.log file. |

    | Ctrl+b4 | When tmux, display the contents of the /tmp/storage.log file. |

    | Ctrl+b5 | When tmux, display the contents of the /tmp/program.log file. |

    | Ctrl+Alt+F6 | Access the Anaconda graphical interface. |


    > NOTE

    For compatibility with earlier Red Hat Enterprise Linux versions, the virtual
    consoles from **Ctrl+Alt+F2** through **Ctrl+Alt+F5** also present root shells
    during installation.


    > REFERENCES

    For more information, refer to the Installing and deploying RHEL guide at https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html-single/performing_a_standard_rhel_installation/index'
