    # # Matching the Start and End of a Line


    The previous section used an exact regular expression on a file. Note that the
    regular expression would match the match string no where on the line it occurred:
    the beginning, end, or middle of the word or line. Use a *line anchor* to control
    the location of the regular expression looks for a match.


    To search at the beginning of a line, use the caret character (^). To search at
    the end of a line, use the dollar sign ($).


    Using the same file as above, the **^cat** regular expression would match two
    words. The **Scat** regular expression would not find any matching words.


    ```

    cat

    dog

    concatenate

    dogma

    category

    educated

    boondoggle

    vindication

    chilidog

    ```


    To locate lines in the file ending with **dog**, use that exact expression and
    an end of line anchor to create the regular expression **dog$**. Applying **dog$s**
    to the file would find two matches:


    ```

    dog

    chilidog

    ```


    To locate the only word on a line, use both the beginning and end-of-line anchors.
    For example, to locate the word **cat** when it is the only word on line, use
    **^cat$**.


    ```

    cat dog rabbit

    cat

    horse cat cow

    cat pig

    ```


    # # Adding Wildcards and Multipliers to Regular Expressions


    Regular expressions use a period or dot (.) to match any single character with
    the exception of the newline character. A regular expression of **c.t** searches
    for a string that contains a **c** followed by any single character followed by
    a **t**. Examples include **cat, concatenate, vindication, c5t,** and **c$**.


    Using an unrestricted wildcard you cannot predict the character that would match
    the wildcard. To match specific characters, replace the unrestricted wildcard
    with acceptable characters. Changing'
