- img_proc: true
  md: 'Alternatively, use a whole disk, a RAID array, or a SAN disk.


    A physical device only needs to be prepared if there are none prepared already
    and a new physical volume is required to create or extend a volume group.


    ```

    [root@host ~]# parted -s /dev/vdb mkpart primary 1MiB 769MiB

    [root@host ~]# parted -s /dev/vdb mkpart primary 770MiB 1026MiB

    [root@host ~]# parted -s /dev/vdb set 1 lvm on

    [root@host ~]# parted -s /dev/vdb set 2 lvm on

    ```


    # Create a physical volume


    Use pvcreate to create the physical volume (or other physical) as a volume. The
    pvcreate command divides the physical volume into physical extents (PEs) of a
    fixed size, for example, 4 MiB blocks. You can label multiple devices at the same
    time using space-delimited device names as pvcreate.


    ```

    [root@host ~]# pvcreate /dev/vdb2 /dev/vdb1

    ```


    This labels the devices /dev/vdb2 and /dev/vdb1 as PVs, ready for allocation into
    a volume group.


    A PV only needs to be created if there are no PVs to create or extend a VG.


    # Create a volume group


    Use vgcreate to create one or more physical volumes into a volume group. A volume
    group is the functional equivalent of a hard disk; you will create logical volumes
    from the pool of free physical extents in the volume group.


    The vgcreate command line consists of a volume group name followed by one or more
    physical volumes to allocate to this volume group.


    ```

    [root@host ~]# vgcreate vg01 /dev/vdb2 /dev/vdb1

    ```


    This creates a VG named vg01 that the combined size, in PE units, of the two PVs
    /dev/vdb2 and /dev/vdb1.


    A VG only needs to be created if not already. Additional VGs may be created for
    administrative reasons to manage the PVs and LVs. Otherwise, existing VGs can
    be extended to accommodate new LVs when needed.


    # Create a logical volume


    Use lvcreate to create a new volume from the available physical extents in a volume
    group. At a minimum, the lvcreate command includes the -n option to set the LV
    name, either the -l option to set the LV size in bytes or the -1 option to set
    the LV size in extents, and the name of the volume group hosting the logical volume.


    ```

    [root@host ~]# lvcreate -n lv01 -L 700MiB vg01

    ```


    This creates an LV called lv01, 700 MiB in size, in the vg01. This command will
    fail if the volume group does not have a sufficient number of free extents for
    the requested.'
