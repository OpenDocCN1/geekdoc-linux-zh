  md: '# CHAPTER 2 | Scheduling Future tasks


    # # INSPECTING AND MANAGING DEFERRED USER JOBS


    To get an overview of the pending jobs for the current user, use the command atq
    or the at -1 commands.


    ```

    [user@host ~]$ atq

    1 28 Mon Feb 2 05:13:00 2015 a user

    29 Mon Feb 3 16:00:00 2014 h user

    27 Tue Feb 4 12:00:00 2014 a user

    ```


    In the preceding output, every line represents a different job scheduled to run
    in the future.


    +   - The unique job number for this job.

    - The execution date and time for the scheduled job.

    - Indicates that the job is scheduled with the default queue a. Different jobs
    may be scheduled with different queues.

    - The owner of the job (and the user that the job will run as).


    > **IMPORTANT**nUnprivileged users can only see and control their own jobs. The
    root user can see and manage all jobs.


    To inspect the actual commands that run when a job is executed, use the at -c
    JOBNUMBER command. This command shows the environment for the job being set up
    to reflect the environment of the user who created the job at the time it was
    created, followed by the actual commands to run.


    # ## Removing Jobs


    The atm JOBNUMBER command removes a scheduled job. Remove the scheduled job when
    it is no longer needed, for example, a remote firewall configuration succeeded,
    and does not need to be reset.


    > REFERENCES

    at(1) and atd(8) man pages

    /usr/share/doc/at/timespec'
