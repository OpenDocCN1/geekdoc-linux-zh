  md: '# CHAPTER 12 installing Red Hat Enterprise Linux


    # PUBLISH THE KICKSTART FILE TO ANACONDA


    Make the Kickstart file available to the installer by placing it in one of these
    locations:


    +   - A network server available at install time using FTP, HTTP, or NFS.

    - An available USB disk or CD-ROM.

    - A local hard disk on the system to be installed.


    The installer must access the Kickstart file to begin an automated installation.
    The most common method uses a network server such as FTP, web, or NFS server.
    Network servers facilitate Kickstart file maintenance because changes can be made,
    and then immediately used for multiple future installations.


    Providing Kickstart file on USB or CD-ROM is also convenient. The Kickstart file
    can be embedded in the boot media used to start the installation. However, when
    the Kickstart file is changed, you must generate new installation media.


    Providing the Kickstart file on a local disk allows you to quickly rebuild a system.


    # BOOT ANACONDA AND POINT IT TO THE KICKSTART FILE


    Once a Kickstart method is chosen, the installer is told where to locate the Kickstart
    file by passing the **inst.ks=LOCATION** parameter to the installation kernel.
    Some examples:


    +   - inst.ks=http://server/dir/file

    - inst.ks=ftp://server/dir/file

    - inst.ks=nfs:server/dir/file

    - inst.ks=hd:device/dir/file

    - inst.ks=cdrom:device


    ![](img/3c5dfc78dee328600013666607c8aa7b_379_0.png)


    **Figure 12.4:** Specifying the Kickstart file location during installation'
  merge: -1
