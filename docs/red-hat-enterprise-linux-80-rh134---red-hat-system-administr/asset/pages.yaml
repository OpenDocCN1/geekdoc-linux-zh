  md: '# CHAPTER 15 | Managing SELinux Enforcement


    ```

    [user@host ~]# setenforce Enforcing

    [user@host ~]# setenforce Enforcing

    ```


    Alternatively, you can set the SELinux mode at boot time by passing a parameter
    to the kernel:

    kernel argument of enforcing=0 boots the system into permissive mode; a value
    of

    enforcing=1 sets enforcing mode. You can also disable SELinux completely by passing
    on the

    kernel parameter selinux=0. A value of selinux=1 enables SELinux.


    # SETTING THE DEFAULT SELINUX MODE


    You can configure SELinux persistently using the /etc/selinux/config file. In
    the

    ample below (the default configuration), the configuration file sets SELinux to
    enforcing. The

    comments also show the other valid values: permissive and disabled.


    ```

    # This file controls the state of SELinux on the system.

    # SELINUX= can take one of these three values:

    # enforcing - SELinux security policy is enforced.

    # permissive - SELinux prints warnings instead of enforcing.

    # disabled - No SELinux policy is loaded.

    SELINUX=enforcing

    # SELINUXTYPE= can take one of these two values:

    # targeted - Targeted processes are protected,

    # minimum - Modification of targeted policy. Only selected processes

    # are protected.

    # mls - Multi Level Security protection.

    SELINUXTYPE=targeted

    ```


    The system reads this file at boot time and configures SELinux as shown. Kernel
    arguments

    selinux=0|1 and enforcing=0 override this configuration.


    > REFERENCES

    getenforce(8), setenforce(8), and selinux_config(5) man pages'
