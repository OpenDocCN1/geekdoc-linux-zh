  md: '# CHAPTER 6 Managing Basic Storage


    ```

    #

    UUID=a8063676-443d-409a-b584-68be2c9f570 / xfs defaults 0 0

    UUID=7a20315d-ed8b-4e75-a5b6-24ff9e1f9838 /wikidata xfs 0 0

    ```


    When you add an entry in the /etc/fstab file, run the systemctl daemon-reload
    command, or reboot, for systemd to register the new configuration.


    ```

    [root@host ~]# systemctl daemon-reload

    ```


    The first field specifies the UUID for the device. This example uses the UUID
    to specify the device. File systems create and store their super block at creation.
    Alternatively, you could use the device file, such as /dev/vdb1.


    > NOTE

    Using the UUID is preferable because block device identifiers can change in certain
    scenarios, such as a cloud provider changing the underlying layer of a virtual
    machine, or the disks being detected in a different order with each system boot.
    The block device file name may change, but the UUID remains constant in the file
    system''s super block.


    Use the lsblk --fs command to scan the blocks connected to a machine and retrieve
    the file system UUIDs.


    ```

    [root@host ~]# lsblk --fs

    ```


    | NAME FSTYPE UUID MOUNTPOINT |

    | sr0 | | |

    | vda | | |

    | lda1 | xfs | a8063676-443d-409a-b584-68be2c9f570 | |

    | vdb | | |

    | ldb1 | xfs | 7a20315d-ed8b-4e75-a5b6-24ff9e1f9838 | /datadata |


    The second field is the mount point, from which the block device will be accessible
    in the directory structure. The mount point must exist; if not, create it with
    the mkdir command.


    The third field contains the file-system type, such as xfs or ext4.


    The fourth field is the comma-separated list of options to mount the device. defaults
    is a set of commonly used options. The mount(8) man pages document the other available
    options.


    The fifth field is used by the dump to back up the device. Other backup applications
    do not usually use this field.


    The last field, the fsck order field, determines whether the fsck command should
    be run at system boot to verify that the file systems are clean. The value in
    this field indicates the order in which fsck should run. For XFS file systems,
    set this to 0 because XFS does not use fsck to check its file-system status. For
    ext4 file systems, set it to 1 for the root file system and 2 for the other ext4
    file systems. This way, fsck processes the root file system first and then checks
    file systems on separate devices concurrently, and file systems on the same disk
    in sequence.'
