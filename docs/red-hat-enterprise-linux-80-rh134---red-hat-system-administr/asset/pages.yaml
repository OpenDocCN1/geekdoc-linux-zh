    [root@host ~]

    ```


    # Formatting the Device


    The mkswap command activates a swap space to the device. Unlike other formatting
    utilities, mkswap writes a single block of data at the beginning of the device,
    leaving the rest of the device unformatted so the kernel can use it for storing
    memory pages.


    ```

    [root@host ~] mkswap /dev/vdb2

    Setting up swapspace version 1, size = 244 MiB (255844848)

    no label, UUID=39e2667a-9458-42fe-9665-5c584605881

    ```


    # ACTIVATING SWAP SPACE


    You can use the swapon command to activate a formatted swap space.


    Use swapon with the device parameter, or use swapon -a to activate all the swap
    spaces listed in the /etc/fstab file. Use swap --show and free commands to inspect
    the available swap spaces.


    | | total | used | free | shared buff/cache | available |

    |---|---|---|---|---|---||

    | Mem:| 1873036 | 134688 | 1536346 | 16748 | 201912 | 1576044 |

    | Swap:| 0 | 0 | 0 | | | |


    ```

    [root@host ~] swapoff /dev/vdb2

    | total | used | free | shared buff/cache | available |

    |---|---|---|---|---|---||

    | Mem:| 1873036 | 135044 | 1536040 | 16748 | 201952 | 1575680 |

    | Swap:| 249852 | 0 | 249852 | | | |

    ```


    You can deactivate a swap space using the swapoff command. If the swap space has
    pages written to it, swapoff tries to move those pages to other swap spaces or
    back into memory. If it cannot write data to other spaces, the swapoff command
    will fail with an error, and the swap space stays active.


    # Activating Swap Space Persistently


    To activate a swap space at every boot, place an entry in the /etc/fstab file.
    The example shows a typical line in /etc/fstab for the swap space created.


    ```

    UUID=39e2667a-9458-42fe-9665-5c584605881 swap defaults 0 0

    ```


    The example uses the UUID as the first field. When you format the device, the
    mkswap command displays UUID. If you read the output of mkswap, use the lsblk
    -fs command. As alternative, you can use the device name in the first field.


    The second field is typically reserved for the mount point. However, for swap
    devices, which are not accessible through the directory structure, this field
    takes the placeholder swap.


    The third field is the file system type. The file system type for swap space is
    swap.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# CHAPTER 6 | Managing Storage


    The fourth field is for options. The example uses the defaults option. The defaults
    option includes the mount option auto, which means activate the swap space automatically
    at system boot.


    The final fields are the dump field and fsck order. Swap spaces require neither
    backing up file-system checking so these fields should be set to zero.


    When you add or remove an entry in the /etc/fstab file, run the systemctl daemon-reload
    command, or reboot the server, for system to register the new configuration.


    ```

    [root ~]# systemctl daemon-reload

    ```


    # Setting the Swap Space Priority


    By default, the system uses swap spaces in order, meaning that the kernel uses
    the first activated swap space until it is full, then it uses the second swap
    space. However, you can define a priority for each swap space to force that order.


    To set the priority, use the pri in /etc/fstab. The kernel uses the swap space
    with the highest priority first. The default priority is -2.


    The following example shows three swap spaces defined in /etc/fstab. The kernel
    uses the swap space deﬁf in /etc/fstab. The kernel uses the swap space with the
    first entry, with pri=10. When that space is full, it uses the second entry, with
    pri=4. Finally, it uses the third entry, with a default priority of -2.


    | UUID=af30ccb0-3866-456a-b2f5-58889a49eff3 | swap defaults 0 0 |

    | UUID=39d2e67a-9458-42fe-96c5-cc5c84605881 | swap pri=4 0 0 |

    | UUID=f8bd7fa6-b781-44a8-961b-37ac3e57f2fb | swap pri=10 0 0 |


    Use swap --show to display the swap space priorities.


    When swap spaces have the same priority, the kernel writes to them in a round-robin
    fashion.


    > REFERENCES

    mkswap(8), swapon(8), swapoff(8), mount(8), and parted(8) man pages

    Knowledgebase: What is the recommended swap size for Red Hat platforms?

    ://access.redhat.com/solutions/IS5244'
