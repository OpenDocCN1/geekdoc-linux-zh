  md: '# CHAPTER II | Managing Network Security


    # MANAGING SERVER FIREWALLS


    # OBJECTIVES


    After completing this section, you should be able to accept or reject network
    connections to system services using firewall rules.


    # FIREWALL ARCHITECTURE CONCEPTS


    The kernel includes netfilter, a framework for network traffic operations such
    as packet filtering, network address translation and port translation. By implementing
    handlers in the kernel that intercept hooks, connection tracking system, and the
    logging facility, interface directly with the kernel''s networking stack. Firewall
    software uses these hooks to filter rules and packet-modifying functions, allowing
    every packet going through the network stack to be processed. Any incoming, outgoing,
    or forwarded packet can be modified, dropped, or routed programmatically before
    reaching user space components or applications. Netfilter is the primary component
    in Red Hat Enterprise Linux 8 firewalls.


    # Nftables enhances netfilter


    The Linux kernel includes nftables, a new filter and packet classification subsystem
    that has enhanced of netfilter''s core architecture such as networking stack hooks,
    and the logging facility. nftables is faster packet processing, faster rules updates,
    and simultaneous IPv4 and IPv6 processing from the same rules. Another major difference
    between nftables and the original netfilter is that Netfilter is configured through
    multiple utility frameworks, using iptables, iptables, and ebtables, which are
    now deprecated.Nftables uses the single nft user-space utility, allowing all protocol
    management to occur through a single interface, eliminating historical contention
    caused by diverse front ends and multiple nft interfaces.


    # Introducing firewal


    Firewal is a dynamic firewall manager, a front end to the nftables framework using
    the nft command. Until the introduction of nftables, firewal used the iptables
    command to configure netfilter directly, as an improved alternative to the iptables
    service. RHEL 8 remains the default end for managing firewall rulesets and, using
    xtables-nft to translate iptables objects directly into nftables rules and objects.
    Although strongly discouraged, firewal can be reverted to the iptables-back-end
    for complex cases where existing iptables cannot be properly processed by nft
    translations.


    Applications query the subsystem using the D-Bus interface. The firewall subsystem,
    available from the firewall RPM package, is not included in a minimal install,
    but is included in a base installation. With firewal, firewall management is simplified
    by classifying all network traffic into zones. Based on criteria such as the IP
    address of a packet or the incoming network interface, traffic is diverted into
    the firewall rules for the appropriate zone. Each zone has its list of ports and
    services that are either open or closed.


    314


    RHT34-RHEL8en-1-2019031'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# CHAPTER 1 | Managing Network Security


    > NOTE

    For laptops or other machines that regularly change networks, NetworkManager can
    be used to automatically set the firewall zone for a connection. The zones are
    customized with rules appropriate for particular connections.


    This is especially useful when travelling between home, work, and public wireless
    networks. A user might want their system''s ssh service to be reachable when connected
    to home and corporate networks, but not when connected to the public wireless
    network in the local coffee shop.


    Firewall checks the source address for every packet coming into the system. If
    that source address is assigned to a specific zone, the rules for that zone apply.
    If firewall associates the packet with the zone for the incoming network interface
    and if the network interface is not associated with a zone for some reason, firewall
    associates the packet with the default zone.


    The default zone is not a separate zone, but a designation for an existing zone.
    Initially, firewall designates the public zone as default, and maps the lo10 loopback
    interface to the trusted zone.


    Most zones allow traffic through the firewall, which makes a list of particular
    ports and protocols, such as 631/udp, or pre-defined services, such as ssh. If
    the traffic does not match a permitted port and protocol service, it is generally
    rejected (The trusted zone, which permits all traffic by default, is one exception
    to this).


    # Pre-defined Zones


    Firewall has pre-defined zones, each of which you can customize. By default, all
    zones permit incoming traffic which is part of a communication initiated by the
    system, and all outgoing traffic. The following table details init initial zone
    configuration.


    # Default Configuration of Firewall Zones


    | ZONE NAME | DEFAULT CONFIGURATION |

    |---|---|

    | trusted | Allow all incoming traffic. |

    | home | Reject incoming traffic unrelated to outgoing traffic or matching the
    ssh, mdns, ip-client, samba-client, or dhcpv6-client pre-defined services. |

    | internal | Reject incoming traffic unrelated to outgoing traffic or matching
    the ssh, mdns, ip-client, samba-client, or dhcpv6-client pre-defined services
    (same as the home zone to start with). |

    | work | Reject incoming traffic unrelated to outgoing traffic or matching the
    ssh, ip-client, or dhcpv6-client pre-defined services. |

    | public | Reject incoming traffic unrelated to outgoing traffic or matching the
    ssh or dhcpv6-client pre-defined services. The default zone for newly added network
    interfaces. |


    R134-RHEL8.0-en-201909531 315'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# CHAPTER II | Managing Network Security


    | ZONE NAME | DEFAULT CONFIGURATION |

    |---|---|

    | external | Reject incoming traffic unless related to outgoing traffic or matching
    the ssh pre-defined service. Outgoing IPv4 traffic forwarded through this zone
    is masqueraded to look like it originated from the IPv4 address of the outgoing
    network interface. |

    | dmz | Reject incoming traffic unless related to outgoing traffic or matching
    the ssh pre-defined service. |

    | block | Reject all incoming traffic unless related to outgoing traffic. |

    | drop | Drop all incoming traffic unless related to outgoing traffic (do not
    respond with ICMP errors). |


    For a list of available pre-defined zones and intended use, see firewalld.zones(5).


    # Pre-defined Services


    Firewall has a number of pre-defined services. These services help you identify
    particular network services to configure. Instead of having relevant ports for
    the samba-client service, for example, specify the pre-built samba-client service
    to configure the correct ports and protocols. The following table lists the pre-defined
    services used in the initial firewall configuration.


    Selected Pre-defined Firewall Services


    | SERVICE NAME | CONFIGURATION |

    |---|---|

    | ssh | Local SSH server. Traffic to 22/tcp |

    | dhcpv6-client | Local DHCPv6 client. Traffic to 546/udp on the fe80::/64 IPv6
    network |

    | ipp-client | Local IPP printing. Traffic to 63/udp. |

    | samba-client | Local Windows file and print sharing client. Traffic to 137/udp
    and 138/udp. |

    | mdns | Multicast DNS (mDNS) local-name link resolution. Traffic to 5353/udp
    to the 224.0.0.251 (IPv4) or ff02:: (IPv6) multicast addresses. |


    > NOTE

    Many pre-defined services are included in the firewalld package. Use firewall-cmd
    --get-services to list them. Configuration files for pre-defined services are
    found in /usr/lib/firewalld/services, in a format defined by firewalld.zone(5).

    Either use the pre-defined services or directly specify the port and protocol
    required. The Web Console graphical interface is used to review pre-defined services
    and to define additional services.'
