    +   * **reboot, poweroff, halt**: Specify the action to take when the installation
    completes.


    > NOTE

    The **ksverdiff** utility from the **pykickstart** package is useful for identifying
    changes in Kickstart syntax between two versions of Red Hat Enterprise Linux or
    Fedora.


    For example, **ksverdiff -f RHEL7 -t RHEL8** identifies changes in syntax from
    RHEL 7 to RHEL 8. Available versions are listed in the top of the file `/usr/lib/python3.6/site-packages/pykickstart/version.py`.


    # EXAMPLE KICKSTART FILE


    The first part of the file consists of the installation commands, as disk partitioning
    and installation source.


    ```

    #version=RHEL8

    ignored --only-use=vda

    # System bootloader configuration

    bootloader --append="console=ttyS0 console=ttyS0,115200n8 no_timer_check

    net.ipv6=crashkernel=auto --location=mbr --timeout=1 --boot-drive=vda

    # Clear the Master Boot Record

    zombr

    # Partition clearing information

    clearpart --all --initlabel

    # Use text mode install

    text

    repo --name="appstream" --baseurl=http://classroom.example.com/content/rhel8.0/

    x86_64/dvd/AppStream/

    # Use network installation

    url="http://classroom.example.com/content/rhel8.0/x86_64/dvd/"

    # Keyboard layouts

    # old format: keyboard us

    ```'
