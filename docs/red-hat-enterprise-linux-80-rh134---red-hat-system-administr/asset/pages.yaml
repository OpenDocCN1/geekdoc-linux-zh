    # # Quoting Special Characters


    A number of characters and words have special meaning to the Bash shell. However,
    occasionally you will want to use these characters for their literal values, rather
    than for their special meanings. To do this, use one of three tools to remove
    (escape) the special meaning: the backslash (\), single quotes (''''), or double
    quotes (").


    The backslash escape removes the special meaning of the single character following
    it. For example, to display the literal string # not a comment with the echo command,
    the # sign must not be interpreted by Bash as having special meaning. Place the
    backslash in front of the #.


    ```

    [user@host ~]$ echo # not a comment

    [user@host ~]$ echo \# not a comment

    # not a comment

    ```


    When you need to escape more than one character in a text string, either use the
    escape multiple times or employ single quotes (''''). Single quotes preserve the
    meaning of all characters they enclose. Observe the escape character and single
    quotes in action:


    ```

    [user@host ~]$ echo # not a comment

    [user@host ~]$ echo \# not a comment \#n# not a comment

    [user@host ~]$ echo ''not a comment''

    # not a comment

    ```


    Use double quotation marks to suppress globbing and shell expansion, but still
    allow command substitution. Variable substitution is conceptually identical to
    command substitution, but may use optional brace syntax. Observe the examples
    of various forms of quotation mark use below.


    Use single quotes to interpret all text literally. Besides globbing and shell
    expansion, quotations direct the shell to additionally suppress suppress command
    and variable substitution. The question mark (?) is a meta-character that also
    needs protection from expansion.


    ```

    [user@host ~]$ var=$($hostname); echo $Var

    host

    [user@host ~]$ echo """* hostname is ${Var} """

    \*\*\* hostname is host \*\*\*

    [user@host ~]$ echo Your variable is \USER.

    ```'
