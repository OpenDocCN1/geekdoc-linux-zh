    # Setting a Default Target


    When the system starts, systemd activates the default, target target. Normally
    the default target in /etc/systemd/system/ is a symbolic link to either graphical.target
    or multi-user.target. Instead of editing this symbolic link by hand, the systemctl
    command provides two sub to manage this link: get-default and set-default.


    ```

    [root@host ~]$ systemctl get-default

    multi-user.target

    [root@host ~]$ systemctl set-default graphical.target

    Removed /etc/systemd/system/default.target

    Created symlink /etc/systemd/system/default.target -> /usr/lib/systemd/system/graphical.target

    graphical.target

    ```


    # Selecting a Different Target at Boot Time


    To select a different target at boot time, append the systemd.unit=target.target
    option to the kernel command line from the boot loader.


    For example, boot the system into a rescue shell where you can change the system
    configuration with almost no services running, append the following option to
    the kernel command line from the boot loader.


    ```

    systemd.unit=rescue.target

    ```


    This configuration only affects a single boot, making it a useful tool for troubleshooting
    the boot process.


    To use this selecting a different target, use the following procedure:'
