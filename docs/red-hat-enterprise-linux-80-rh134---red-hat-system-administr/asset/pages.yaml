  md: '# MANAGING TEMPORARY FILES


    # OBJECTIVES


    After completing this section, you should be able to enable and disable systemd
    timers, and configure a timer that manages temporary files.


    # MANAGING TEMPORARY FILES


    A modern system requires a large number of temporary files and directories. Some
    applications (and users) use the /tmp directory to hold temporary data, while
    others use a task-specific location such as /tmp and user-specific directories
    under /run. In this context, volatile means the file system storage only exists
    in memory. When the system reboots or loses power, the contents of volatile storage
    will be gone.


    To keep a system running cleanly, it is necessary for these directories and files
    to be created when they do not exist, by daemons and scripts right on them being
    there, and for old files to be purged that they do not fill up disk space or provide
    faulty information.


    Red Hat Linux 7 and later include a new tool called systemd-tmpfiles --create,
    which provides a structured and configurable method to manage temporary directories
    and files.


    When system starts, one of the first service units launched is systemd-tmpfiles-setup.
    This service runs the command systemd-tmpfiles --remove. This command reads configuration
    files from /usr/lib/tmpfiles.d/ /run/tmpfiles.d/ /etc/tmpfiles.d/*. Any files
    and directories marked for deletion are removed, and any files and directories
    marked for creation (or permission fixes) are created with the correct permissions
    if necessary.


    # Cleaning Temporary Files with a Systemd Timer


    To ensure that long-running systems do not fill up their disks with stale data,
    a systemd timer called systemd-tmpfiles-clean triggers systemd-tmpfiles-clean.service
    on a regular interval, which executes the systemd-tmpfiles --clean command.


    The system unit configuration file has a name [Timer] that indicates how often
    the service with the same name should be started.


    Use the following systemctl section to view the contents of the systemd-tmpfiles-clean
    unit configuration file.


    ```

    [user@]$ systemctl cat systemd-tmpfiles-clean.timer

    # /usr/lib/system/systemd-tmpfiles-clean.timer

    # SPDX-License: LGPL-2.1+

    #

    # systemd is free software; you can distribute it and modify it under

    # the terms of the GNU Lesser General Public License as published

    # by

    # the Free Software Foundation; either version 2.1 of the License, or

    ```'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# CHAPTER 2 | Scheduling Future Tasks


    # (at your option) any later version.


    ```

    [Unit]

    Description=Daily Cleanup of Temporary Directories

    Documentation=man:tmpfiles.d(5) man:systemd-tmpfiles(8)


    [Timer]

    OnBootSec=15min

    ```


    In the preceding configuration parameter OnBootSec=15min indicates that the service
    called systemd-tmpfiles-clean gets triggered 15 minutes after the system has booted
    up. The parameter UnitActiveSec=id indicates that any further trigger to the systemd-tmpfiles-clean.
    service waits 24 hours after the service was activated.


    Based on your requirement, you can change the parameters in systemd-tmpfiles-clean.timer
    unit configuration. For example, the value 30min for the parameter UnitActiveSec
    triggers the systemd-tmpfiles-clean. service waits 30 minutes after the service
    was activated. As a result, systemd-tmpfiles-clean. service gets triggered 30
    minutes after bringing the change into effect.


    After changing the unit configuration file, use the systemctl daemon-reload command
    to ensure that systemd is aware of the change. This command reloads the systemd
    manager configuration.


    ```

    [root@host ~]# systemctl daemon-reload

    ```


    After you the systemd manager configuration, use the following systemctl command
    to activate the systemd-tmpfiles-clean.timer unit.


    ```

    [root@host ~]# systemctl enable --now systemd-tmpfiles-clean.timer

    ```


    # Cleaning Temporary Files Manually


    The command systemd-tmpfiles --clean parses the configuration files as the systemd-tmpfiles
    --create will purge all files that have not been accessed, changed, or modified
    more recently than the maximum age defined in the configuration file.


    The format of the configuration for systemd-tmpfiles is detailed in the systemd.d(5)
    manual page. The basic syntax consists of seven columns: Type, Path, Mode, UID,
    GID, Age, and Argument. Type refers to the action systemd-tmpfiles should take;
    for example, d to create a directory if it does not yet exist, or Z to recursively
    restore SELinux contexts and file permissions and ownership.


    The following are some examples explanations.


    ```

    /run/systemd/seats 0755 root root

    ```


    When creating files and directories, create the /run/systemd/seats directory if
    it does not yet exist, used by the user root and the group root, with permissions
    to rwxr-xr-x. This directory will not be automatically purged.'
