  md: '# SCHEDULING RECURRING USER JOBS


    # OBJECTIVES


    After completing this section, you should be able to schedule commands to run
    on a repeating schedule using a user''s crontab.


    # DESCRIBING RECURRING USER JOBS


    Jobs scheduled to run repeatedly are called *recurring jobs*. Red Hat Enterprise
    Linux systems ship with the *cron* daemon, provided by the *cronie* package, enabled
    and started by default specifically for recurring jobs. The cron daemon manages
    multiple files: one per user (edited with the *crontab* command), and a set of
    system-wide files. This configuration gives users and administrators control over
    which recurring jobs should be executed.


    If a scheduled command produces any output or error that is not redirected, the
    *cron* daemon attempts to email that output to the user who owns that job (unless
    redirected) using the mail server on configuration. Depending on the environment,
    this may need additional configuration. The output or error of the scheduled command
    can be redirected to different files.


    # SCHEDULING RECURRING USER JOBS


    Normal users can use the *crontab* command to manage their jobs. This command
    can be used in four different ways:


    Crontab Examples


    | COMMAND | INTENDED USE |

    |---|---|

    | crontab -l | List the jobs for the current user. |

    | crontab -r | Remove all jobs for the current user. |

    | crontab -e | Edit jobs for the current user. |

    | crontab filename | Remove all jobs, and replace with the jobs read from *filename*.
    If no file is specified, *stdin* is used. |


    > The superuser uses the -u option with the *crontab* command to manage jobs for
    another user. You should not use the *crontab* command to manage system jobs;
    instead, use the methods described in the next section.


    # DESCRIBING USER JOB FORMAT


    The *crontab -e* command invokes Vim by default, unless the EDITOR environment
    variable has been set to something different. Enter one one job per line. Other
    valid entries include: empty lines,'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# CHAPTER 2 | Scheduling tasks


    typically for ease of reading; comments, identified by lines starting with the
    number sign (#); and environment variables using the format NAME=value, which
    affects all lines below the line where they are declared. Common variable settings
    include the SHELL variable, which declares which shell to use to interpret the
    remaining lines of the crontab, and the MAILTO variable, which determines which
    should receive any emailed output.


    > IMPORTANT

    Sending email may require additional configuration of the local mail server or
    SMTP relay on a system.


    Fields in the crontab file appear in the following order:


    +   * Minutes

    * Hours

    * Day of month

    * Month

    * Day of week

    * Command


    > IMPORTANT

    When the Day of month and Day of week fields are both other than *, the command
    is executed when either of these fields are satisfied. For example, to run a command
    on the 15th of every month, and every Friday at 12:15, use the following job format:


    15 12 15 * Fri command


    The first five fields use all the syntax rules:


    +   * "Do not Care"/always.

    * A number to specify a number of minutes or hours, a date, or a weekday. For
    weekdays, 0 equals Sunday, 1 equals Monday, 2 equals Tuesday, and so on. 7 also
    equals Sunday.

    * x-y for a range, x to include.

    * x, for lists. Can include ranges as well, for example, 5, 10-13, 17 in the Minutes
    column to indicate that a job should run at 5, 10, 11, 12, and 17 minutes past
    the hour.

    * /*x to indicate an interval of x, for example, /*7 in the Minutes column runs
    a job every seven minutes.


    Additionally, 3-letter English abbreviations can be used for both months and weekdays,
    for example, Jan, Feb, and Mon, Tue.


    The last field contains the command to execute using the default shell. The SHELL
    environment variable can change the shell for the scheduled command. If the command
    contains an unescaped percent sign (%), then that sign is treated as a newline
    character, and everything after the percentage sign is passed to the command on
    stdin.


    RHT134-RHEL8.0-en-20190531'
