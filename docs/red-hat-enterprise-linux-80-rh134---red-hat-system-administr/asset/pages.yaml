  md: "# CHAPTER I | Improving Command-line Productivity\n\nstatement at the end closes\
    \ the if/then construct. The following code section demonstrates the use of an\
    \ if/then construct to start the psactct service if it is not active.\n\n```\n\
    [user@host ~]$ systemctl is-active psactct > /dev/null 2>&1\n[user@host ~]$ if\
    \ [ $? -ne 0 ]; then\n  sudo systemctl start psactct\nfi\n```\n\n# Using the if/then/else\
    \ Construct\n\nThe if/then/else construct can be further expanded so that different\
    \ sets of actions can be taken depending on whether a condition is met. The following\
    \ is an if/then/else construct.\n\n```\nif <CONDITION>; then\n  <STATEMENT>\n\
    \  ...\n  <STATEMENT>\n  else\n  <STATEMENT>\n  ...\n  <STATEMENT>\nfi\n```\n\n\
    The following code section demonstrates the use of an if/then/else statement to\
    \ start the psactct service if it is not active and stop it if it is active.\n\
    \n```\n[user@host ~]$ systemctl is-active psactct > /dev/null 2>&1\n[user@host\
    \ ~]$ if [ $? -ne 0 ]; then\n  sudo systemctl start psactct\n  else\n  sudo systemctl\
    \ stop psactct\nfi\n```\n\n# Using the if/then/elif/then/else Construct\n\nLastly,\
    \ the if/then/else construct can be further extended to test more than one condition,\
    \ executing a different set of actions when a condition is met. The construct\
    \ for this is shown in the following example:\n\n```\nif <CONDITION>; then\n \
    \ <STATEMENT>\n  ...\n  <STATEMENT>\nelif <CONDITION>; then\n  <STATEMENT>\n \
    \ ...\n  <STATEMENT>\nelse\n  <STATEMENT>\n  ...\n  <STATEMENT>\nfi\n```"
