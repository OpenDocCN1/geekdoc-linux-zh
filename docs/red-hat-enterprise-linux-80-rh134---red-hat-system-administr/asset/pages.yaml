  md: '# REPAIRING FILE SYSTEM ISSUES AT BOOT


    # OBJECTIVES


    After completing this section, you should be able to manually repair file-system
    configuration or corruption issues that stop the boot process.


    # DIAGNOSING AND FIXING FILE SYSTEM ISSUES


    Errors in `/etc/fstab` and corrupt file systems can stop a system from booting.
    In most cases, systemd drops to an emergency shell that requires the `root` password.


    The following table lists some common errors and their results.


    # Common File System Issues


    | PROBLEM | RESULT |

    | Corrupt file system | systemd attempts to repair the file system. If the problem
    is too severe for an automatic fix, systemd drops the user to an emergency shell.
    |

    | Nonexistent device or UUID referenced in /etc/fstab | systemd waits for a set
    amount of time, waiting for the device to become available. If the device does
    not become available, systemd drops the user to an emergency shell after the timeout.
    |

    | Nonexistent mount point in /etc/fstab | The system drops the user to an emergency
    shell. |

    | Incorrect mount option specified in /etc/fstab | The system drops the user to
    an emergency shell. |


    In all cases, administrators can use the emergency shell to diagnose and fix the
    issue, because no file systems are mounted before the emergency shell is displayed.


    > NOTE When using the emergency shell to address file-system issues, do not forget
    to run `systemctl daemon-reload` after editing `/etc/fstab`. Without this reload,
    systemd may continue using the old version.


    The `nofail` option in an entry in `/etc/fstab` permits the system to boot even
    if the mount of that file system is not successful. **Do not** use this option
    under normal circumstances. With `nofail`, an application can start with its storage
    missing, with possibly severe consequences.'
  merge: -1
  pgno: 319
