  md: '# SCHEDULING RECURRING SYSTEM JOBS


    # OBJECTIVES


    After completing this section, you should be able to schedule commands to run
    on a repeating schedule using the system crontab file and directories.


    # DESCRIBING RECURRING SYSTEM JOBS


    System administrators often need to run recurring jobs. Best practice is to run
    these jobs from system accounts rather than from user accounts. That is, do not
    schedule to run these jobs using the crontab command, but instead use system-wide
    crontab files. Job entries in system-wide cron files are similar to those of the
    users'' cron entries, excepting only that the system-wide cron files have an extra
    field to define the command field; the user under authority the command should
    run.


    The /etc/crontab file has a useful syntax in the included comments.


    ```

    # For details see man 4 crontabs

    # Example of job definition:

    # | minute (0 - 59)

    # | hour (0 - 23)

    # | day of month (1 - 31) OR jan,feb,mar,apr...

    # | month (1 - 12) OR (Sunday=0 or 7) sun,mon, tue

    # | day of week (0 - 6)

    # * * * * user-name command to be executed

    ```


    Recurring system jobs are defined in two locations: the /etc/crontab file, and
    within the /etc/cron.d/ directory. You should schedule recurring system jobs.
    Place the custom crontab file in /etc/cron.d to protect it from being overwritten
    by any package update occurs to the provider of /etc/crontab, which may overwrite
    the existing entries. Packages requiring recurring system jobs place their crontab
    files in /etc/cron.d/. Administrators also use this location to group related
    jobs into a single file.


    The cron system also includes repositories for scripts that need to run every
    hour, day, week, and month. These repositories are directories /etc/cron.hourly/,
    /etc/cron.weekly/, and /etc/cron.monthly/. Again, these directories contain executable
    scripts, not cron files.


    > IMPORTANT

    Remember to make any script you place in these directories executable. If a script
    is not executable, it will not run. To make a script executable, use the chmod
    +x script_name.'
  merge: -1
  pgno: 69
- img_proc: true
  md: "# CHAPTER 2 | Scheduling tasks\n\nA command called run-parts called from the\
    \ /etc/cron.d/@hourly file runs the /etc/cron.hourly/* scripts. The run-parts\
    \ command also runs the daily, weekly, and monthly jobs, but it is called from\
    \ a different configuration file called /etc/anacontab.\n\n> In the past, a separate\
    \ service anron was used to handle the /etc/anacontab file, but in Red Hat Enterprise\
    \ Linux 7 and later, the regular crond service parses this file.\n\nThe purpose\
    \ of /etc/anacontab is to make sure that important jobs always run, and not accidentally\
    \ skipped the system was turned off or hibernating when the job should have been\
    \ executed. For example, if a system job runs daily was not executed last time\
    \ it was due to the system being rebooting, the job is executed when the system\
    \ recovers. However, there may be a delay of several minutes in starting the job\
    \ depending on the value of the Delay in minutes parameter specified for the /etc/anacontab.\n\
    \nThere are different files in /var/spool/ancron/ for each of the daily, weekly,\
    \ and monthly jobs to determine if a particular job runs. When cron starts a job\
    \ from /etc/anacontab, it updates the stamps of those files. The same stamp is\
    \ used to determine when a job was last run. The syntax of /etc/anacontab is different\
    \ from the regular crontab configuration files. It contains exactly four fields\
    \ per line, as follows: \n\n+   - Period in days\nThe interval for the jobs that\
    \ run on a repeating schedule. This field accepts an integer or a macro as its\
    \ value. For example, the macro @daily is equivalent to the integer 1, which means\
    \ that the job is executed on a daily basis. Similarly, the macro @weekly is equivalent\
    \ to the integer 7, which means that the job is executed on a weekly basis.\n\
    - Delay in minutes\nThe amount time the crond daemon should wait before starting\
    \ this job.\n- Job identifier\nThe unique name the job is identified as in the\
    \ log messages.\n- Command\nThe command to be executed.\nThe /etc/anacontab file\
    \ also contains environment variable declarations using the syntax NAME=value.\
    \ Of special interest is the variable START_HOURS,RANGE, which specifies the interval\
    \ for the jobs to run.. On a particular day, a job does not run within this time\
    \ interval, the job has to wait until the next day for execution.\n\n# INTRODUCING\
    \ SYSTEMD TIMER\n\nWith the advent of systemd in Red Hat Enterprise Linux 7, a\
    \ new scheduling function is available: systemd timer units. A system timer unit\
    \ activates another unit of a different type (such as a service) whose name matches\
    \ the timer unit. The timer allows timer-based activation of other units. For\
    \ easier debugging, systemd logs timer events in system journals."
