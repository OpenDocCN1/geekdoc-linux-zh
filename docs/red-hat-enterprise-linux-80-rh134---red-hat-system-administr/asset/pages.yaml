  md: '# Creating MBR Partitions


    Creating an MBR disk partition involves several steps:


    +   Specify the disk device to create the partition on.


    As the root user, execute the parted command and specify the disk device name
    as an argument. This starts the parted command in interactive mode and displays
    a command prompt.


    ```

    [root@host ~]# parted /dev/vdb

    GNU Parted 3.2

    Using /dev/vdb

    Welcome to GNU Parted! Type ''help'' to view a list of commands.

    (parted)

    ```


    +   Use the mkpart subcommand to create a new primary or extended partition.


    | (parted) mkpart |

    | Partition type? | primary/extended? primary |


    > For situations where you need more than four partitions on an MBR-partitioned
    disk, create three primary partitions and one extended partition. This extended
    partition serves as a container which you can create multiple logical partitions.


    +   Indicate the file-system type that you want to create on the partition, such
    as xfs or ext4. This does not create the file system on the partition; it is only
    an indication of the partition type.


    File system type? [ext2]? xfs


    To get the list of the supported file-system types, use the following command:


    ```

    [root@host ~]# parted /dev/vdb help mkpart

    mkpart PART-TYPE [fs] START make a partition

    ```


    PART-TYPE is one of: primary, logical, extended

    FS-TYPE is one of: btrfs, nfs2, ext4, ext3, ext2, fat32, fat16, hfs,

    hfs, hfs, jfs, swswap, linux-swap(vi), linux-swap(v0), reiserfs,

    hup-ufs, sun-ufs, xfs, apfs2, apfs, amfs, amfus5, amfus4, amfus3,

    amfus2, amfus1, amfus0, affs7, affs6, affs4, affs3, affs2,

    aff1, affs0, linux-swap, linux-swap(old)

    START and END are locations, such as 4GB or 10%. Negative values

    count from the end of the disk. For example, -1 specifies exactly the

    last sector.


    ```

    ''mkpart makes a partition without creating a new file system on the partition.
    FS-TYPE may be specified to set an appropriate partition ID.

    ```'
