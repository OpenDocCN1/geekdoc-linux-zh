  md: '# CREATING A SWAP SPACE


    To create a swap space, you need to perform the following:


    +   - Create a partition with a file system type of linux-swap.


    +   - Place a swap signature on the device.


    # Creating a Swap Partition


    Use parted to create a partition of the desired size and set its file system type
    to linux-swap. In the past, tools looked at the partition file system type to
    determine if the device should be activated; however that is no longer the case.
    Utilities no longer use the partition file system type, setting allows administrators
    to quickly determine the partition''s purpose.


    The following example creates a 256 MB partition.


    ```

    [root@host ~] parted /dev/vdb

    GNU Parted 3.2

    Using /dev/vdb

    Welcome to GNU Parted! Type ''help'' to view a list of commands.

    (parted) print

    Model: Virtio Block Device (virtblk)

    Disk /dev/vdb: 5369MB

    Sector size (logical/physical): 512B/512B

    Partition Table: gpt

    Disk Flags:


    Number Start End Size File system Name data

    1 1049KB 1001MB 1000MB


    (parted) mkpart

    Partition name? [] swap1

