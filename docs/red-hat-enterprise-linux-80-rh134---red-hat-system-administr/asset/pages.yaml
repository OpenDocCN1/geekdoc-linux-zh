  md: '# # INSTALLING AND CONFIGURING VIRTUAL MACHINES


    # ## OBJECTIVES


    After completing this section, you should be able to install a virtual machine
    on your Red Hat Enterprise Linux server using Cockpit.


    # ## INTRODUC KVM VIRTUALIZATION


    Virtualization is a feature that allows a single machine to be divided into multiple
    *virtual machines (VM)*, each of which can run an independent operating system.


    Red Hat Enterprise Linux 8 supports *KVM (Kernel-based Virtual Machine)*, a full
    virtualization solution built into the standard Linux kernel. KVM can run multiple
    Windows and Linux operating systems.


    ![](img/3c5dfc78dee328600013666607c8aa7b_384_0.png)


    In Red Hat Enterprise Linux, manage KVM with the *virsh* command or with Cockpit''s
    Virtual Machines.


    KVM virtual machine technology is available across all Red Hat products, from
    standalone instances of Red Hat Enterprise Linux to the Red Hat OpenStack Platform:


    +   - Physical hardware under Red Hat Enterprise Linux to provide KVM virtualization.
    Red Hat Enterprise Linux is typically a thick host, a system that supports VMs
    while providing other local and network services, applications, and management
    functions.

    - Red Hat Virtualization (RHV) provides a centralized web interface that allows
    administrators to manage an entire infrastructure. It includes advanced features
    such as KVM migration, redundancy, and high availability. *Red Hat Virtualization
    Hypervisor* is a tuned version of Red Hat Enterprise Linux dedicated to the singular
    purpose of provisioning and supporting VMs.

    - Red Hat OpenStack Platform (RHOSP) provides the foundation to create, deploy,
    and scale a public or private cloud.'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# CHAPTER 12 | Installing Red Hat Enterprise Linux


    Red Hat supports virtual machines running these operating systems:


    +   - Hat Enterprise Linux 6 and later

    - Microsoft Windows 10 and later

    - Microsoft Windows Server 2016 and later


    # CONFIGURING A RED HAT ENTERPRISE LINUX PHYSICAL SYSTEM AS A VIRTUALIZATION HOST


    Administrators can configure a Red Hat Enterprise Linux as a virtualization host,
    appropriate for development, testing, training, or when needing to work in multiple
    operating systems at the same time.


    # Installing the Virtualization Tools


    Install the virt yum module to prepare a system to become a virtualization host.


    ```

    [root@host ~#] yum module list

    Name            Profiles        Summary

    virt            rhel [d]         common [d]      Virtualization module


    Hint: [d]default, [enabled], [x]disabled, [i]installed

    [root@host ~#] yum module install virt

    ... omitted...

    ```


    # Verifying the System Requirements


    KVM requires an Intel processor with the VT-X and Intel 64 extensions for x86-based
    systems or an AMD processor with the AMD-V and the AMD64 extensions. To verify
    your hardware and check the system requirements, use the virt-host-validate command.


    ```

    [root@host ~#] virt-host-validate

    QEMU: Checking for hardware virtualization              : PASS

    QEMU: Checking if device /dev/kvm exists                : PASS

    QEMU: Checking if device /dev/dev is accessible           : PASS

    QEMU: Checking if device /dev/vhost-net exists         : PASS

    QEMU: Checking if device /dev/net/tun exists             : PASS

    QEMU: Checking for cgroup ''memory'' controller support      : PASS

    QEMU: Checking for cgroup ''memory'' controller mount-point : PASS

    QEMU: Checking for cgroup ''cpu'' controller support          : PASS

    QEMU: Checking for cgroup ''cpu'' controller mount-point     : PASS

    QEMU: Checking for cgroup ''cpuact'' controller support      : PASS

    QEMU: Checking for cgroup ''cpuact'' controller mount-point : PASS

    QEMU: Checking for cgroup ''cpuset'' controller support      : PASS

    QEMU: Checking for cgroup ''cpuset'' controller mount-point : PASS

    QEMU: Checking for cgroup ''devices'' controller support      : PASS

    QEMU: Checking for cgroup ''devices'' controller mount-point : PASS

    QEMU: Checking for cgroup ''blkio'' controller support       : PASS

    QEMU: Checking for cgroup ''blkio'' controller mount-point  : PASS

    QEMU: Checking for device assignment 10OMMU support       : PASS

    ```


    The system must pass all of the validation items in order to be a KVM host.'
