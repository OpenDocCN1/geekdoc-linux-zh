  md: '# CONTROLLING SELINUX PORT LABELING


    # OBJECTIVES


    After completing this section, you should be able to verify that network ports
    have the correct SELinux type so services are able to bind to them.


    # SELINUX PORT LABELING


    ![](img/3c5dfc78dee328600013666607c8aa7b_346_0.png)


    SELinux does more than just file and process labels. Network traffic is also tightly
    enforced by the SELinux policy. One of the methods that SELinux uses for network
    traffic is labeling network ports; for example, the *targeted* policy, port *22/TCP*
    has the label *ssh_port_t* associated with it. The default HTTP ports, *80/TCP*
    and *443/TCP*, have the label *http_port_t* associated with them.


    Whenever a process wants to listen on a port, SELinux checks to see whether the
    label associated with that process (domain) is allowed to bind to that port. This
    can stop a rogue service from taking ports otherwise used by other (legitimate)
    network services.


    # MANAGING SELINUX PORT LABELING


    If you decide to run a service on a nonstandard port, SELinux almost certainly
    will block the traffic. In this case, you must update SELinux port labels. In
    some cases, the *targeted* policy has already labeled the port with a type that
    can be used; for example, port *8008/TCP* is often used for web applications,
    that is already labeled with *http_port_t*, the default port type for the web
    server.


    # Listing Port Labels


    To get an overview of all the current port assignments, run the *semanage port
    -l* command. The *-l* option lists all current assignments in this form:


    ```

    port_label_t    tcp|udp    comma,separated,list,of,ports

    ```


    Example output:


    ```

    [root@host]# semanage port -l

    ...output omitted...

    http_cache_port_t    tcp      8000, 8118, 8123, 10001-10010

    http_cache_port_t    udp      3130

    http_port_t         tcp      80, 81, 443, 488, 8008, 8009, 8443, 9000

    ```


    To refine the search, use the *grep* command:'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# CHAPTER II | Managing Network Security


    ```

    [root@host ~]# semanage port -1 | grep ftp

    ftp_data_port_t    tcp      28

    ftp_port_t          tcp      21, 989, 990

    ftp_port_t          udp      989, 990

    tftfp_port_t         udp      69

    ```


    Note that a port label can appear twice in the output, once for TCP and once for
    UDP.


    # Managing Port Labels


    Use the semanage command to assign new port labels, remove port labels, or modify
    existing ones.


    > IMPORTANT

    Most standard services available in the Linux distribution provide SELinux policy
    module that sets labels on ports. You cannot change the labels on those ports
    using semanage; to change those, you need to replace the policy module. Writing
    and generating policy modules falls outside the scope of this course.


    To add a port to an existing port label (type), use the following syntax. The
    -a adds a new port label, the -t denotes the protocol.


    ```

    [root@host ~]# semanage port -a -t port_port_label -p tcp|udp PORTNUMBER

    ```


    For example, to allow a gopher service to listen on port 71/TCP:


    ```

    [root@host~]# semanage port -a -t gopher_port_t -p tcp 71

    ```


    To view changes to the default policy, administrators can add the -C option to
    the semanage command.


    ```

    [root@host~]# semanage port -1 -C

    SELinux Port Type

    ```


    | SELinux Port Type | Protocol | Port Number |

    | --- | --- | --- |

    | gopher_port_t | tcp | 71 |


    > NOTE

    The targeted policy ships with a large number of port types.

    Service specific SELinux man pages found in the selinux-policy-doc package include
    documentation on SELLinux types, booleans, and port types. If these man pages
    are not installed on your system, follow this procedure:


    ```

    [root@host ~]# yum install selinux-policy-doc

    [root@host ~]# man -k _selinux

    ```


    328 RHT34-RHEL 8.0-en-1-20190531'
  merge: -1
