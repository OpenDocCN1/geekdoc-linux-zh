    > WARNING

    Removing a logical volume destroys any data stored on the logical volume. Back
    up or move your data before you remove the logical volume.


    # Remove the logical volume.


    Use lvremove DEVICE_NAME to remove a logical volume that is no longer needed.


    ```

    root@host ~# lvremove /dev/vg01/lv01

    ```


    Unmount the file system before running this command. The command prompts for confirmation
    before removing the LV.


    The LV''s physical extents are freed and made available for assignment to existing
    or new LVs in the volume group.


    # Remove the volume group.


    Use vgremove VG_NAME to remove a volume group that is no longer needed.


    ```

    root@host ~# vgremove vg01

    ```


    The VG''s physical volumes are freed and made available for assignment to existing
    or new VGs on the system.


    # Remove the physical volumes.


    Use pvremove to remove physical volumes that are no longer needed. Use a space-delimited
    list of PV devices to remove the PV metadata from the partition (or disk). The
    partition is now free for reallocation or reformation.


    ```

    root@host ~# pvremove /dev/vdb2 /dev/vdb1

    ```


