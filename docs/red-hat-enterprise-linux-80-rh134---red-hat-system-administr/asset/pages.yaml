  md: "# CHAPTER 1 Improving Command-line Productivity\n\n```\n[user@host ~]$ [ 1\
    \ -lt 2 ]; echo $?\n\n```\n\nThe following examples demonstrate the use of Bash's\
    \ string comparison operators.\n\n```\n[user@host ~]$ [ abc = abc ]; echo $?\n\
    [user@host ~]$ [ abc == def ]; echo $?\n[user@host ~]$ [ abc != def ]; echo $?\n\
    \n```\n\nThe following examples demonstrate the use of Bash's string operators.\n\
    \n```\n[user@host ~]$ STRING=''; [ -z \"$STRING\" ]; echo $?\n[user@host ~]$ STRING='abc';\
    \ [ -n \"$STRING\" ]; echo $?\n\n```\n\n> NOTE\nThe space characters inside the\
    \ test brackets are mandatory, because they separate the words and elements within\
    \ the test expression. The shell's command parsing routine divides all lines into\
    \ words and operators by recognizing spaces and other metacharacters, using built-in\
    \ parsing. For full treatment of this advanced concept, see the man page getopt(3).\
    \ The left square bracket character (() is itself a built-alias for the test command.\
    \ Shell words, whether they are commands, switches, options, or other token elements,\
    \ are always delimited by spaces.\n\n# CONDITIONAL STRUCTURES\n\nSimple scripts\
    \ represent a collection of commands that are executed from beginning to end.\
    \ Conditional structures allow users to incorporate decision making into shell\
    \ scripts, where certain portions of the script are executed only when certain\
    \ conditions are met.\n\n# Using the if/then Construct\n\nThe simplest of the\
    \ conditional structures in Bash is the if/then construct, which has the following\
    \ syntax.\n\n```\n<CONDITION>; then\n  <STATEMENT>\n  ...\n  <STATEMENT>\nfi\n\
    ```\n\nWith this construct, if a condition is met, one or more actions are taken.\
    \ If the given condition is not met, no action is taken. The numeric, string,\
    \ and file tests previously demonstrated are frequently utilized for testing the\
    \ conditions in if/then statements."
