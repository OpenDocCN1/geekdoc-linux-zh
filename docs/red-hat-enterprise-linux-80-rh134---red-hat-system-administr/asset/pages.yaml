  md: '+   - zeromber: Initialize disks whose formatting is unrecognized.


    # # Network Commands


    Define the network features used by the host.


    +   - network: Configures network information for target system. Activates network
    devices in installer environment.


    ```

    network --device=eth0 --bootproto=dhcp

    ```


    +   - firewall: Defines the firewall configuration for the target system.


    ```

    firewall --enabled --service=ssh,http

    ```


    # # Location and Security Commands


    Configure settings related to security, language, and regions.


    +   - lang: Sets the language to use during installation and the default language
    of the installed system. Required.


    ```

    lang en_US.UTF-8

    ```


    +   - keyboard: Sets the system keyboard type. Required.


    ```

    keyboard --vkeymap=us --xlayouts=''

    ```


    +   - timezone: Defines the timezone, NTP servers, and whether the hardware clock
    uses UTC.


    ```

    timezone --utc --ntpserver=time.example.com Europe/Amsterdam

    ```


    +   - authselect: Sets up authentication options. Options recognized by authselect
    are valid for this command. See authselect(8).


    +   - rootpw: Defines the initial root password.


    ```

    rootpw --plaintext redhat

    or

    rootpw --isencrypted=$6KUnFFrTZ08jv.P1SHY1Vbb0XkBwoMuRf0.SpbQ....XDR1Uucho0G6

    ```


    +   - selinux: Sets the SELinux mode for the installed system.


    ```

    selinux --enforcing

    ```


    +   - services: Modifies the default set of services to run under the default
    systemd target.


    ```

    services --disabled=network,iptables,ip6tables --enabled=NetworkManager, firewall

    ```


    +   - group, user: Create a local group or user on the system.'
