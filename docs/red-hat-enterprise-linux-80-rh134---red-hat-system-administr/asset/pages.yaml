  md: '# DOCUMENT CONVENTIONS


    > ### REFERENCES

    “References” describe where to find external documentation relevant to a subject.


    > ### NOTE

    “Notes” are tips, shortcuts or alternative approaches to the task at hand. Ignoring
    a note should have no negative consequences, but you might miss out on a trick
    that makes your life easier.


    > ### IMPORTANT

    “Important” boxes detail things that are easily missed: configuration changes
    that only apply to the current session, or services that need restarting before
    an update will apply. Ignoring a box labeled “Important” will not cause data loss,
    but may cause irritation and frustration.


    > ### WARNING

    “Warnings” should not be ignored. Ignoring warnings will most likely cause data
    loss.'
