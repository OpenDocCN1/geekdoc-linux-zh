  md: '# MATCHING TEXT IN COMMAND OUTPUT WITH REGULAR EXPRESSIONS


    # ## OBJECTIVES


    After completing this section, students should be able to:


    +   - Create regular expressions that match desired data.

    - Apply regular expressions to text files using the grep command.

    - Search files and data from piped commands using grep.


    # ## WRITING REGULAR EXPRESSIONS


    ![](img/3c5dfc78dee328600013666607c8aa7b_36_0.png)


    Regular expressions provide a pattern matching mechanism that facilitates finding
    specific content. The vim, grep, and less commands all use regular expressions.
    Programming languages such as Perl, Python, and C can all use regular expressions
    when pattern matching criteria.


    Regular expressions are a language of their own, which means they have their own
    syntax and rules. This section looks at the syntax used when creating regular
    expressions, as well as showing some regular expression examples.


    # ## Describing a Simple Regular Expression


    The simplest regular expression is an exact match. An exact match is when the
    characters in the regular expression match the type and order in the data that
    is being searched.


    Suppose a user is looking through the following file looking for all occurrences
    of the pattern cat:


    ```

    cat

    dog

    concatenate

    dogma

    category

    educated

    boondoggle

    vindication

    chilidog

    ```


    cat is an exact match of a c, followed by an a, followed by a t with no other
    characters in between. Using cat as the regular expression to search the previous
    file returns the following matches:'
