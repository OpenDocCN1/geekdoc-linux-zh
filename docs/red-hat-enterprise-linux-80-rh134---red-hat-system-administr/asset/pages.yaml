  md: '# SECURITY CONCEPTS


    Enhanced Linux (SELinux) is an additional layer of system security. The primary
    goal of SELinux is to protect user data from system services that have been compromised.
    Most Linux administrators are familiar with the default user/group/permission
    security model. This is a user and group based model known as discretionary access
    control. SELinux provides an additional layer of security that is object-based
    and controlled by more sophisticated rules, known as mandatory access control.


    To allow anonymous access to a web server, firewall ports must be opened. However,
    this gives malicious people opportunity to crack the system through a security
    exploit. If they succeed in compromising the web server process they gain permissions
    of the apache process and the apache group. That user and group has access to
    the document root, `/var/www/html`. It also has access to `/tmp`, and `/var/tmp`,
    and all other files and directories that are writable.


    SELinux is a set of rules that determines which process can access files, directories,
    and ports. Every file, process, directory, and port has a special label called
    a SELinux context. A context is used by the SELinux policy to determine whether
    a process can access a file, directory, or port. By default, the policy does not
    allow any interaction unless explicit grant rules exist. If there is no rule,
    access is denied.


    SELinux labels have several contexts: user, role, type, and sensitivity. The targeted
    policy, which is the default policy allowed in Red Hat Enterprise Linux, bases
    its on the third context: the type context. Type context usually ends with _t.


    ```

    unconfined_u:object_r:httpd_sys_content_t:/var/www/html/file

    ```


    | SELinux User | Role | Type | Level | File |


    Figure 5: SELinux File Context


    The context for a web server is http_t. The context for files and directories
    normally found in `/var/www/html` is httpd_sys_content_t. The contexts for files
    and directories normally found in `/tmp` and `/var/tmp` are tmp_t. The context
    for web server ports is http_t.


    Apache has a type context that permits Apache access to files and directories
    with the httpd_sys_content_t type context. By default files in `/var/www/html`
    and other web server directories have the httpd_sys_content_t type context. There
    is no allow rule in the policy for files normally found in `/tmp` and `/var/tmp`,
    so access is not permitted. With SELinux, a malicious user who could compromise
    the web server process could not access the /tmp directory.


    The MariaDB server has a type context of mysql_t. By default, files in `/data/mysql`
    have the mysql_db_t type context. This context allows MariaDB to access those
    files by other services, such as the Apache web service.'
