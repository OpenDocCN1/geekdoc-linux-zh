    [root@host ~]# ls -Z /var/www/html/*

    ununconfined_u_object:r:user_t:s0 /var/www/html/file1

    ununconfined_u_object:r:httpd_system_content_t:s0 /var/www/html/file2

    ```


    The moved file maintains its original label while the copied file inherits the
    label from the /var/www/html directory. unconfined_u: denotes the role, and s0
    is the level. A sensitivity level of 0 is the lowest sensitivity level.


    # CHANGING SELINUX CONTEXT OF A FILE


    Commands to change the SELinux context on files include semanage context, restorecon,
    and chcon.


    The preferred method to set the SELinux context for a file is to clear the default
    labeling for a file using the semanage context command and then applying that
    context to the file using the restorecon command. This ensures that the labeling
    will be as desired even after a complete relabeling of the file system.


    The chcon command changes SELinux contexts. chcon sets the security context on
    the file, stored in the file system. It is useful for testing and experimenting.
    However, it does not save context changes in the SELinux context database. When
    a restorecon command runs, changes made by the chcon command also do not save.
    If the entire file system is relabeled, the SELinux context for files changed
    using chcon are reverted.


    The following screen shows a directory being created. The directory has a type
    of default_t


    ```

    [root@host ~]# mkdir /virtual

    [root@host ~]# ls -Zd /virtual

    drwx-xr-xr. root root unconfined_u:object_r:default_t:s0 /virtual

    ```


    The chcon command changes the file context of the /virtual directory: the type
    value changes to httpd_sys_content_t,


    ```

    [root@host ~]# chcon -t httpd_sys_content_t /virtual

    [root@host ~]# ls -Zd /virtual

    drwx-xr-xr. root root unconfined_u:object_r:httpd_sys_content_t:s0 /virtual

    ```


    The restorecon command runs and the type value returns to the value of default_t.
    Note the Relabeled message.'
