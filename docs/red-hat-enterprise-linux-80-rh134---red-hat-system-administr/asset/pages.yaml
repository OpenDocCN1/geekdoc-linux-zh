    # group: operators

    ```


    The first three lines are comments that identify the file name, owner (**user**),
    and group owner (**operators**). If there are any additional file flags, such
    as `setuid` or `setgid`, then a fourth comment line will be appearing showing
    which flags are set.


    User entries:


    ```

    user::rwx

