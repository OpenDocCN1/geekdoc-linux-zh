  md: '# CHAPTER 8 | Implementing Advanced Storage Features


    | Anaconda | stratis-cli | Cockpit |

    |---|---|---|

    | Blivet | D-Bus | Udisks2 |

    | | Stratis | |

    | etc. | | libblockdev |

    | device-mapper | cryptsetup | libxfs | libmultipath |


    Figure 8.2: Stratis in the Linux storage management stack


    # Describing Stratis Layers


    Internally, Stratis uses the Backbone subsystem to manage the block devices, and
    the Thinpool subsystem to manage the pools. The Backbone subsystem has a data
    tier that maintains the on-disk metadata on devices, and detects and corrects
    data corruption. The cache tier uses high-performance block devices to act as
    a cache on top of the data tier. The Thinpool subsystem manages the thin-provisioned
    volumes associated with the Stratis file systems. This subsystem uses the dm-thin
    device mapper driver to replace LVM on the virtual volume sizing and management.
    dm-thin creates volumes with a large virtual size, formatted with XFS, but with
    a small physical size. As the physical size nears free, Stratis expands automatically.


    # Stratis Layers | Internal View


    | User View | Filesystem | Filesystem | |

    |---|---|---||

