  md: '```

    D /home/student 0700 student student 1d

    ```


    Create the /home/student directory if it does not exist yet. If it does, empty
    it of all contents. When systemd-tmpfiles --clean is run, remove all files that
    have not been accessed, changed, or modified in more than one day.


    ```

    L /run/fstablink root root /etc/fstab

    ```


    Create the symbolic link /run/fstablink pointing to /etc/fstab. Never atomically
    purge this line.


    # Configuration File Precedence


    Configuration files can exist in three places:


    +   * /etc/tmpfiles.d/*

    * /run/tmpfiles.d/*

    * /usr/lib/tmpfiles.d/*


    The files in /usr/lib/tmpfiles.d/ have the same name as a file in /run/tmpfiles.d/
    should not edit these files. The files under /run/tmpfiles.d/ are themselves volatile
    files, normally used by daemon to manage their own temporary files. The files
    under /etc/tmpfiles.d/ are meant for administrators to configure custom temporary
    locations, and to override vendor-provided defaults.


    If a file in /run/tmpfiles.d/ has the same name as a file in /usr/lib/tmpfiles.d/,
    then the file in /run/tmpfiles.d/ is used. If a file in /etc/tmpfiles.d/ has the
    same name as a file in /run/tmpfiles.d/ or /usr/lib/tmpfiles.d/, then the file
    in /etc/tmpfiles.d/ is used.


    Given these precedence rules, you can override vendor-provided settings by copying
    the relevant file to /etc/tmpfiles.d/, and editing it. Working in this fashion
    ensures that administrator-provided settings can be easily managed from a central
    configuration management system, and not be overwritten by an update to a package.


    > NOTE When testing new or modified configurations, it can be useful to apply
    only the commands from one configuration file. This can be achieved by specifying
    the name of the configuration file on the command line.


    > REFERENCES systemd-tmpfiles(8), tmpfiles.d(5), stat(1), stat(2), and systemd.timer(5)
    man pages'
