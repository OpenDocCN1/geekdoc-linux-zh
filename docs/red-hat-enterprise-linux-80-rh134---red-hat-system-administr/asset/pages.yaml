    # Writing the Partition Table on a New Disk


    To partition a new drive, you first have to write a disk label to the it. The
    disk label indicates which partitioning scheme to use.


    > NOTE

    Keep in mind that parted makes the changes immediately. A mistake with parted
    could definitely lose data to loss.


    As the root user, use the command to write an MBR disk label to the disk.


    ```

    [root@host ~#] parted /dev/vdb mklabel mdsos

    ```


    To write a GPT disk label, use the following command.


    ```

    [root@host ~#] parted /dev/vdb mklabel gpt

    ```


    > WARNING

    The mklabel command wipes the existing partition table. Only use mklabel when
    the intent is to reuse the disk without regard to the existing data. If a new
    label changes the partition boundaries, all data in existing file systems will
    become inaccessible.'
