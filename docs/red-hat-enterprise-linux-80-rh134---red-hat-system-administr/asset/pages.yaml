    # Providing Output From A Shell Script


    The echo command displays arbitrary by passing the text as an argument to the
    command. By default, the text displays on standard output (STDOUT), but it can
    also be directed to error (STDERR) using output redirection. In the following
    Bash script, the echo command displays the message **Hello, world** to STDOUT.


    ```

    [user@host-$]$ cat ~/bin/hello

    !/bin/bash

    echo "Hello, world"


    [user@host-$]$ hello

    Hello, world

    ```


    > NOTE

    This user can run **hello** at the prompt because the **~/home/user/bin** directory
    is in your PATH variable and the **hello** script in it is executable. as long
    as there is no other executable file the shell automatically finds the script
    there, called **hello** in any of the directories listed prior to **/home/user/bin**
    in the PATH.


    The **echo** command is widely used index in shell scripts to display information
    or error messages. These messages can be a helpful indicator of the progress of
    a script and can be directed either to standard output, or redirected to a log
    file for archiving. When displaying error messages, it is good practice to direct
    them to STDERR to make it easier to differentiate error messages from normal status
    messages.


    ```

    [user@host-$]$ cat ~/bin/hello

    !/bin/bash

    echo "Hello, world"

    echo "ERROR: Houston, we have a problem." >&2


    [user@host-$]$ echo hello.log

    Hello, world

    [user@host-$]$ cat hello.log

    ERROR: Houston, we have a problem.

    ```


    The **echo** command can also be very helpful when trying to debug a problematic
    shell script. The addition of echo statements to the portion of the script that
    is not behaving as expected can help clarify the commands being executed, as well
    as the values of variables being invoked.


