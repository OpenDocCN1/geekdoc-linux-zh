    Controlling the Boot Process


    ![](img/3c5dfc78dee328600013666607c8aa7b_304_0.png)'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# SELECTING THE BOOT TARGET


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Describe the Red Hat Enterprise Linux boot process.

    - Set the default target used when booting.

    - Boot a system to a non-default target.


    # DESCRIBING THE RED HAT ENTERPRISE LINUX 8 BOOT PROCESS


    Modern computer systems are complex combinations of hardware and software. Starting
    from an undefined, powered-down state to a running system with a login prompt
    requires a large number of pieces of hardware and software to work together. The
    following list gives a high-level overview of the tasks involved for a physical
    x86_64 booting system Red Hat Enterprise Linux 8. The list for x86_64 virtual
    machines is similar, but the hypervisor handles some of the hardware-specific
    tasks in software.


    +   - The machine is powered on. The system firmware, either modern UEFI or older
    BIOS, runs a Power On Self Test (POST) and starts to initialize some of the hardware.


    Configured using BIOS or UEFI configuration settings that you typically reach
    by pressing a special key combination, as F2, early during the boot process.


    +   - The system firmware searches for a boot loader, device configured in the
    UEFI boot firmware or by searching for a Master Boot Record (MBR) on all disks,
    in the order configured in the BIOS.


    Configured using BIOS or UEFI screens that you typically reach by pressing a special
    key combination, as F2, early during the boot process.


    +   - The system firmware reads a boot loader from disk and passes control of
    the system to the boot loader. On a Red Hat Enterprise Linux 8 system, the boot
    loader is the GRand Unifiedloader version 2 (GRUB2).


    Configured using the grub2-install command, which installs GRUB2 as the boot loader
    on the disk.


    +   - GRUB2 loads its configuration from the /boot/grub/grub.cfg file and displays
    a menu where you can select which kernel to boot.


    Configured using the /etc/grub.d/, the /etc/default/grub file, and the grub2-mkconfig
    command to generate the /boot/grub/grub.cfg file.


    +   - After you select a kernel, or the timeout expires, the boot loads the kernel
    and initramfs from disk and places them in memory. An initramfs is an archive
    containing the kernel modules for all the hardware required at boot, initialization
    scripts, and more. On Red Hat Enterprise Linux 8, the initramfs contains an entire
    usable system by itself.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# CHAPTER 10 | Controlling the boot Process


    Configured using the /etc/dracut.conf.d/ directory, the dracut command, and the
    initramfs command to edit the initramfs file.


    +   - The boot loader handles control over the kernel, passing in any options
    specified by the kernel command line in the boot loader, and the loading of the
    initramfs in memory.


    Configured using the /etc/grub.d/ directory, the /etc/default/grub file, and the
    grub2-mkconfig command to generate the /boot/grub2/grub.cfg file.


    +   - The kernel initializes all hardware for which it can find a driver in the
    initramfs, then executes /sbin/init from the initramfs as PID 1. On Red Enterprise
    Linux 8,/sbin/init is a link to systemd.


    Configured using the kernel init=command-line parameter.


    +   - The systemd instance from the initramfs executes all units of the initrd.
    target target. This mounting the root file system on disk to the /sysroot directory.


    Configured using /etc/fstab


    +   - The kernel switches (pivots) the root file system from initramfs to the
    root file system in /sysroot, then re-executes itself using the configuration
    of systemd installed on the disk.


    +   - systemd looks for a default target, either passed in the kernel command
    line or of system, then starts (and stops) units until the configuration for that
    target, solving dependencies between units automatically. In essence, a systemd
    target is a set of units that the system should activate to reach the desired
    state. These targets typically start a text-based log or a graphical login screen.


    Configured using /etc/systemd/system/default.target and /etc/systemd/system.


    # REBOOTING AND SHUTTING DOWN


    To power off or reboot a running system from the command line, you can use the
    systemctl command.


    systemctl poweroff stops all running services, unmounts all file systems (or remount
    them read-only when they cannot be unmounted), and then powers down the system.


    systemctl reboot stops all running services, unmounts all file systems, and then
    reboots the system.


    You can also use the shorter version of these commands, poweroff and reboot, which
    are symbolic links to their systemctl equivalents.


    > NOTE systemctl halt and halt are also available to stop the system, unlike poweroff,
    these commands do not power off the system; they bring a system down to a point
    where it is safe to power off manually.


    # SELECTING A SYSTEMD TARGET


    A systemd target is a set of systemd units that the system should start to reach
    a desired state. The following table lists the most important targets.'
  merge: -1
  pgno: 306
- img_proc: true
  md: "# Commonly Used Targets\n\n| TARGET | PURPOSE |\n| :--- | :--- |\n| graphical.target\
    \ | System supports multiple users, graphical- and text-based logins. |\n| multi-user.target\
    \ | System supports multiple users, text-based logins only. |\n| rescue.target\
    \ | sulogin prompt, system initialization completed. |\n| emergency.target | sulogin\
    \ prompt, initramfs pivot complete, and system root mounted on read only.\n\n\
    A target can be a part of another target. For example, the graphical.target includes\
    \ multi-user.target, which in turn depends on basic.target and others. You can\
    \ view these dependencies with the following:\n\n```\n[user@host~$] systemctl\
    \ list-dependencies graphical.target | grep target\ngraphical.target\n└-multi-user.target\n\
    \  |-basic.target\n  └-paths.target\n  └-slices.target\n  └-sockets.target\n \
    \ └-sysinit\n    └-cryptsetup.target\n    └-local-fs.target\n  └-swap.target\n\
    ```\n\nTo list the available targets, use the following command:\n\n```\n[user@host~$]\
    \ systemctl list-units --type=target all\nUNIT | LOAD ACTIVE SUB DESCRIPTION\n\
    basic.target | loaded active active Basic System\ncryptsetup.target | loaded active\
    \ active Local Encrypted Volumes\nememergency.target | loaded inactive dead Emergency\
    \ Mode\ngetty-pre.target | loaded inactive dead Login Prompts (Pre)\ngetty.target\
    \ | loaded active active Login Prompts\ngraphical.target | loaded inactive dead\
    \ Graphical Interface\n```\n\n# Selecting a Target at Runtime\n\nOn a running\
    \ system, administrators can switch to a different target using the systemctl\
    \ isolate command.\n\n```\n[root@host~#] systemctl isolate multi-user.target\n\
    ```\n\nIsolating a target stops all services not required by that target (and\
    \ its dependencies), and starts any required services not yet started."
  merge: -1
  pgno: 307
- img_proc: true
  md: '# CHAPTER 1 | Controlling the boot Process


    Not all targets are isolated. You can only isolate targets that AllowIsolate=yes
    set in their unit files. For example, you can isolate the graphical target, but
    not the cryptsetup target.


    ```

    [user@host ~]$ systemctl cat graphical.target

    # /usr/lib/systemd/system/graphical.target

    # ...output omitted...

    [Unit]

    Description=Graphical Interface

    Documentation=man:system.special(7)

    Requires=multi-user.target

    Wants=display-manager.service

    Conflicts=rescue.target

    After=multi-user.target rescue.target display-manager.service

    AllowIsolate=yes

    [user@host ~]$ systemctl cat cryptsetup.target

    # /usr/lib/systemd/system/cryptsetup.target

