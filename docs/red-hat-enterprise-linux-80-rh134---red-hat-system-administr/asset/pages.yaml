- img_proc: true
  md: '# INTERPRETING FILE ACLS


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Describe ACLs and file-system mount options.

    - View and interpret ACLs with ls and getfacl.

    - Describe the ACL mask and ACL permission precedence.

    - Identify where Red Hat Enterprise Linux uses ACLs by default.


    # ACCESS CONTROL LIST CONCEPTS


    Standard file permissions are satisfactory when used by only a single owner, and
    a single designated group of people. Some use cases require that files are accessed
    with different file permission sets by named users and groups. Access Control
    Lists (ACLs) provide this function.


    With ACLs, you can grant permissions to multiple users and groups, identified
    by user name, group name, UID, or GID, using the same permission flags used with
    regular file permissions: read, write, and execute. These additional users and
    groups, beyond the file owner and the file''s group, are called named users and
    named groups respectively, because they are not in a long list, but rather within
    an ACL.


    Users can set ACLs on files and directories that they own. Privileged users, assigned
    the CAP_OWNER capability, can set ACLs on any file or directory. New files and
    subdirectories automatically inherit ACL settings from the parent directory''s
    default ACL, if they are set. Similar to normal file access rules, the parent
    directory hierarchy needs at least the search (execute) permission set to enable
    users and groups to have access.


    # File-system ACL Support


    File systems must be mounted with ACL support enabled. XFS file systems have built-in
    ACL support. Other file systems, such as ext3 or ext4 on Red Hat Enterprise Linux
    8, have the acl option enabled by default, on older versions you should confirm
    that ACL support is enabled. To enable file-system ACL support, use the ACL option
    with the mount command or in the file system''s entry in /etc/fstab configuration
    file.


    # VIEWING AND INTERPRETING ACL PERMISSIONS


    The ls -l [host content] ls -l reports.txt shows ACL settings:


    ```

    [user@host content] ls -l reports.txt

    -rw-r--+ 1 user operators 30 Mar 19 23:56 reports.txt

    ```


    The plus sign (+) at the end of the 10-character permission string indicates that
    an extended ACL structure with entries exists on this file.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# CHAPTER 4 | Controlling Access to Files with ACLs


    user:

    Shows the user ACL settings, which are the same as the standard user file settings;
    **rwx**.


    group:

    Shows the current ACL mask settings, not the group owner settings; **rw-**.


    other:

    Shows the other ACL settings, which are the same as the standard other file settings;
    no access.


    > **IMPORTANT**nChanging group permissions on a file with an ACL using `chmod`
    does not change the group owner permissions, but does change the ACL mask. Use
    `setfacl -m g:perms file` if the intent is to update the file''s group owner permissions.


    # View File ACLs


    To display ACLs on a file, use **getfacl file**:


    ```

    [user@host content]$ getfacl reports.txt

    # file: reports.txt

    # owner: user

    # group: operators

    user:rwx

    user:consultant3::-

    user:1005:rwx #effective:rw-

    group::rwx #effective:rw-

    group:consultant1:r-

    group:2210:rwx #effective:rw-

    mask:rw-

    other::---

    ```


    Review each section of the previous example:


    Commented entries:


