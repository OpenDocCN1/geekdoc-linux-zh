    man-pages-fr:0:3.7-16.el8.noarch

    mythes-fr:0:2.3-10.el8.noarch

    ```


    > IMPORTANT

    Langpacks use RPM weak dependencies in order to install supplementary packages
    only when the core package needs it is also installed.


    For example, installing langpacks-fr as shown in the preceding examples, the mythes-fr
    package will only be installed if the mythes thesaurus is also installed on the
    system.


    If mythes is subsequently installed on that system, the mythes-fr package will
    also automatically installed due to the weak dependency from the already installed
    langpacks-fr package.


    > REFERENCES

    locale(7), localect(1), locale.conf(5), vconsole.conf(5), unicode(7), and utf-8(7)
    man pages


    Conversions between the names of the graphical desktop environment''s XI layouts
    and their names in localect can be found in the file /usr/share/X11/kb/rules/base.lst.


