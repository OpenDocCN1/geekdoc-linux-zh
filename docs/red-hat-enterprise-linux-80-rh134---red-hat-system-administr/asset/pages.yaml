  md: '# AUTOMOUNTING NETWORK-ATTACHED STORAGE


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Describe the benefits of the automounter using direct and indirect maps,
    including wildcards.


    +   - Automount NFS shares using direct and indirect maps, including wildcards.


    # MOUNTING NFS SHARES WITH THE AUTOMOUN


    The automounter is a service (autofs) that automatically mounts NFS shares "on-demand,"
    and will automatically unmount NFS shares when they are no longer being used.


    # Automounter Benefits


    +   - Users do not need to have root privileges to run the mount and umount commands.


    +   - NFS shares configured in the automounter are available to all users on the
    machine, subject to access permissions.


    +   - NFS shares are not permanently connected like entries in /etc/fstab, freeing
    network and system resources.


    +   - The automounter is configured on the client side; no server-side configuration
    is required.


    +   - The automounter uses the same options as the mount command, including security
    options.


    +   - The automounter supports both direct and indirect mount-point mapping, for
    flexibility in mount-point locations.


    +   - autofs creates and removes indirect mount points, eliminating manual management.


    +   - NFS is the default automounter network file system, but other network file
    systems can be automatically mounted.


    +   - autofs is a service that is managed like other system services.


    # Create an automount


    Configuring an automounter is a multiple step process:


    +   1. Install the autofs package.


    ```

    [user@host ~]$ sudo yum install autofs

    ```


    This package contains everything needed to use the automounter for NFS shares.


    +   2. Add a master map file to /etc/auto.master.d. This file identifies the base
    directory used for mount points and identifies the mapping file used for creating
    the automounts.


    ```

    [user@host ~]$ vim /etc/auto.master.d/demo.autofs

    ```'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# CHAPTER IX | Accessing Network-Attached Storage


    The name of the master file is arbitrary (although typically meaningful), but
    it must have an extension of .autofs for the subsystem to recognize it. You can
    place multiple entries in a single master map file; alternatively, you can create
    multiple master map files with its entries grouped logically.


    Add the master map entry, in this case, for indirectly mapped mounts:


    ```

    /shares /etc/auto.demo

    ```


    This entry uses the /shares directory as the base for indirect automounts. The
    /etc/auto.demo file contains mount details. Use an absolute file name. The auto.demo
    file needs to be created before starting the .autofs service.


    +   3. Creating the mapping files. Each mapping file identifies the mount point,
    mount options, and source location to mount for a set of automounts.


    ```

    [user@host ~$] sudo vim /etc/auto.demo

    ```


    The mapping file naming convention is /auto.name, where name reflects the content
    of the map.


    ```

    work -rw,sync server2:/shares/work

    ```


    The format of an entry is mount point, mount options, and source location. This
    example shows a basic indirect mapping entry. Direct and indirect maps using wildcards
    are created later in this section.


    +   Known the key in the main pages, the mount point is created and removed automatically
    by the autofs service. In this case, the fully qualified mount point is /shares/work
    (see the master map file). The /shares directory and the /shares/work directories
    are created and removed as needed by the autofs service.


    In this example, the local mount point mirrors the server''s directory structure,
    however this is not required; the local mount point can be named anything. The
    autofs service does not enforce a strict name on the client.


    +   Mount options start with a dash (-) and are comma-separated with no white
    space. Mount options available to a manual mounting of a file system are available
    when automounting. In this example, the automounter shares the mount with read/write
    access (rw option), and the server is synchronized immediately during write operations
    (sync option).


    Useful automounter-specific options include -ftime and -strict. Use ftype to specify
    the file system type, for example, nfs4 or xfs, and use strict to treat errors
    when mounting file systems fail.


    +   The source location for NFS shares follows the ::/pathname pattern; in this
    example, server2:/shares/work. For this to succeed, the NFS server, server2, must
    export the directory with read/write access and the requesting access must have
    standard Linux file permissions on the directory. If server2 exports the directory
    with read/only access, the client will get read/only access even though it requested
    read/write access.


    +   4. Start and enable the automounter service.


    RH134-HEL8.0-en-20190531


    269'
