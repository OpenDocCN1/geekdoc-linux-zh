    # # CONTROLLING YOUR SYSTEMS


    Students are assigned remote computers in a Red Hat Online Learning classroom.
    They are accessed through a web application hosted at rol.redhat.com [http://rol.redhat.com].
    Students should log in to this site using their Red Hat Customer Portal credentials.


    # ## Controlling the Virtual Machines


    The virtual machines in your classroom environment are controlled through a web
    page. The state of each virtual machine in the classroom is displayed on the page
    under the Online Lab tab.


    # ### Machine States


    | VIRTUAL MACHINE STATE | DESCRIPTION |

    | :--- | :--- |

    | STARTING | The virtual machine is in the process of booting. |

    | STARTED | The virtual machine is running and available (or, when booting, soon
    be). |

    | STOPPING | The virtual machine is in the process of shutting down. |

    | STOPPED | The virtual machine is completely shut down. Upon starting, the virtual
    machine boots into the same state as it was shut down (the disk will been preserved).
    |

    | PUBLISHING | The initial creation of the virtual machine is being performed.
    |

    | WAITING_TO_START | The virtual machine is waiting for other virtual machines
    to start. |


    Depending on the state of a machine, a selection of the following actions is available.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Introduction


    # Classroom/Machine Actions


    | BUTTON OR ACTION | DESCRIPTION |

    | --- | --- |

    | PROVISION LAB | Create the ROL classroom. Creates all of the virtual machines
    needed for the classroom and starts them. Can take several minutes to complete.
    |

    | DELETE LAB | Delete the ROL classroom. Destroys all virtual machines in the
    classroom. **Caution: Any work generated on the disks is lost.** |

    | START LAB | Start all virtual machines in the classroom. |

    | SHUTDOWN LAB | Stop all virtual machines in the classroom. |

    | OPEN CONSOLE | Open a new tab in the browser and connect to the console of the
    virtual machine and run commands. In most cases, students should log in directly
    to the virtual workstation environment and use **ssh** to connect to the other
    virtual machines. |

    | ACTION → Start | Start (power on) on the virtual machine. |

    | ACTION → Shutdown | Gracefully shut down the virtual machine, preserving the
    contents of its disk. |

    | ACTION → Power Off | Forcefully shut down the virtual machine, preserving the
    contents of its disk. This is equivalent to removing the power from a physical
    machine. |

    | ACTION → Reset | Forcefully shut down the virtual machine and reset the disk
    to its initial state. **Caution: Any work generated on the disk is lost.** |


    At the start of an exercise, if instructed to reset a single virtual machine node,
    click **ACTION → Reset** for only the specific virtual machine.


    At the start of an exercise, if instructed to reset all virtual machines, click
    **ACTION → Reset**


    If you want to return the classroom environment to its original state at the start
    of the course, you can click **DELETE LAB** to remove the entire classroom environment.
    After the lab has been deleted, you can click **PROVISION LAB** to provide a new
    set of classroom systems.


    > > WARNING

    The **DELETE LAB** operation cannot be undone. Any work you have completed in
    the classroom environment up to that point will be lost.


    # The Autostop Timer


    The Red Hat Online enrollment entitles students to a certain amount of computer
    time. To help conserve allotted time, the ROL classroom has an associated countdown
    timer, which shuts down the classroom environment when the timer expires.


    To adjust the timer, click **MODIFY** to display the **New Autostop Time** dialog
    box. Set the number of hours until the classroom should automatically stop. Click
    **ADJUST TIME** to apply this change to the timer settings.


    ![](img/3c5dfc78dee328600013666607c8aa7b_13_0.png)'
