  md: '# Example Recurring User Jobs


    This section describes some examples of recurring jobs.


    +   - The following job executes the command /usr/local/bin/yearly_backup at exactly
    9 a.m. on February 2nd, every year.


    ```

    0 9 2 2 * /usr/local/bin/yearly_backup

    ```


    +   - The following job sends an email command to echo the Chime to the owner
    of this job, every five minutes between 9 a.m. and 5 p.m., every Friday in July.


    ```

    /5 9-16 * Jul 5 echo "Chime"

    ```


    The preceding 9-16 range of hours that the job starts at the ninth hour (09:00)
    and continues until the end of the sixteenth hour (16:59). The job starts executing
    at 09:00 with the last execution at 16:55 because five minutes from 17:00 which
    is beyond the given scope of hours.


    +   - The following job runs the command /usr/local/bin/daily_report every weekday
    at two minutes before midnight.


    ```

    58 23 * * 1-5 /usr/local/bin/daily_report

    ```


    +   - The following job executes the mutt command to send the mail message Checking
    in to the recipient boss@example.com on every workday (Monday to Friday), at 9
    a.m.


    ```

    0 9 * * 1-5 mutt -s "Checking in" boss@example.com % Hi there boss, just checking
    in.

    ```


    > REFERENCES

    crond(8), crontab(1), and crontab(5) man pages'
