  md: '# CHAPTER 2 | Scheduling Future Tasks


    # Sample Timer Unit


    The sysstat package provides a systemd timer called sysstat-collect.timer to collect
    system statistics every 10 minutes. The following output shows the configuration
    lines of /usr/lib/systemd/sysstat-collect.timer.


    ```

    ...output omitted...

    [Unit]

    Description=Run system accounting tool every 10 minutes


    [Timer]

    OnCalendar=*:00/10


    [Install]

    WantedBy=systemd.service.

    ```


    The OnCalendar=*:00/10 signifies that this timer activates the corresponding unit
    (sysstat-collect.service). However, you can specify more complex intervals. For
    example, a 2019-03-* 12:35,37,39:16 against the OnCalendar parameter allows the
    timer to activate the corresponding service unit at 12:35:16, and 12:36:19 every
    day throughout the entire month of March, 2019. You can also specify relative
    timing using parameters like OnUnitActiveSec. For example, the OnUnitActiveSec=15min
    option changes the timer to trigger the unit 15 minutes after the last time the
    unit activated its corresponding unit.


    > IMPORTANT

    Do not modify any unit configuration file under the /usr/lib/systemd/system directory
    because any update to the provider package of the configuration file may override
    the changes you made in that file. So, make a copy of the unit configuration file
    you intend to change under the /etc/systemd/ directory and modify it so that the
    changes you make with respect to a unit do not get overwritten by any update to
    the provider package. If two files exist with the same name then the /usr/lib/systemd/system
    and /etc/systemd/system directories, systemd parses the file under the /etc/systemd/system
    directory.


    After you change the timer configuration file, use the systemctl daemon-reload
    command to ensure systemd is aware of the changes. This command reloads the systemd
    manager configuration.


    ```

    [root@host ~]# systemctl daemon-reload

    ```


    After you reload the systemd manager configuration, use the following systemctl
    command to activate the timer unit.


    ```

    [root@host ~]# systemctl enable --now <unitname>.timer

    ```


    +   REFERENCES

    crontab(5), anacron(8), anacontab(5), systemd.timer(7),

    system.timer(5), and cron(8) man pages'
