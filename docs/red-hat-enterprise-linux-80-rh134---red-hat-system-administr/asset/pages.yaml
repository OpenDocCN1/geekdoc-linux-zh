  md: '# CREATING LOGICAL VOLUMES


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Describe logical volume management components and concepts.

    - Implement LVM storage.

    - Display LVM component information.


    # LOGICAL VOLUME MANAGEMENT (LVM) CONCEPTS


    Logical volumes and logical volume management make it easier to manage disk space.
    If a file system that hosts a logical volume needs space, it can be allocated
    to its logical volume from the free space in the volume group and the file system
    can be resized. If a disk starts to fail, a replacement disk can be registered
    as a physical volume with the volume group and the logical volume’s extents can
    be migrated to the new disk.


    # LVM Definitions


    Physical devices are the storage devices used to save data stored in a logical
    volume. These are block devices and could be partitioned, whole disks, RAID arrays,
    or SAN devices. A device must be initialized as an LVM physical volume in order
    to be used with LVM. The entire device will be used as a physical volume.


    # Physical volumes (PVs)


    You must initialize a device as a physical volume before using it in an LVM system.
    LVM tools segment physical volumes into physical extents (PEs), which are small
    chunks of data that act as the smallest storage block on a physical volume.


    # Volume groups (VGs)


    Volume groups are storage pools made up of one or more physical volumes. This
    is the functional equivalent of a whole disk in basic storage. A PV can be allocated
    to a single VG. A VG can consist of unused space and any number of logical volumes.


    # Logical volumes (LVs)


    Logical volumes are created from free physical extents in a volume group and provide
    the “storage” device used by applications, users, and the operating system. LVs
    are a collection of logical extents (LEs), which map to physical locations, the
    smallest storage chunk of a PV. By default, each LE maps to one PE. Setting specific
    LV options can change this mapping; for example, causing each LE to map to multiple
    PEs.


    # IMPLEMENTING LVM STORAGE


    Creating LVM storage requires several steps. The first step is to determine which
    physical devices are used to use. After a set of suitable devices has been assembled,
    they are initialized as physical volumes so that they are recognized as belonging
    to LVM. The physical volumes are then combined into a volume group. This creates
    a pool of disk space out of which logical volumes can be'
