    Default ACL mask entry:


    ```

    default:mask::rwx

    ```


    Default mask settings show the initial maximum permissions for all new files or
    directories created by named user ACLs, the group owner ACL, or named group ACLs:
    read and write for new files and execute permission on new subdirectories. New
    files never execute permission.


    Default other entry:


    ```

    default:other::---

    ```


    Default other or "world" permissions. All other UIDs and GIDs have no permissions
    to new files or new subdirectories.


    The default entries in the previous example do not include the named user (UID
    1005) and named group (GID 2210); consequently, they will not automatically initialize
    ACL entries added for them any new files or subdirectories. This effectively limits
    them to files and subdirectories that already have ACLs, or if the relevant file
    owner adds the ACL later using setfacl. They can still create their own files
    and subdirectories.


    > NOTE

    The output from getfacl can be used as input to setfacl for restoring ACLs, or
    for copying ACLs from a file or directory and save them into a new file. For example,
    to restore ACLs from a backup, use getfacl -R /dir1 > file to generate a ACL output
    for the directory and its contents. The output can then be used for recovery of
    the original ACLs, passing the saved output as input to the setfacl command. For
    example, to perform a bulk update of the same directory in the current path use
    the following command: setfacl --set-file=file1


    # The ACL Mask


    The ACL mask defines the maximum permissions you can grant to named users, the
    group owner, and named groups. It does not restrict the permissions of the file
    owner or other users. All files and directories that implement ACLs have an ACL
    mask.


    The mask can be viewed with getfacl and explicitly set with setfacl. It will be
    calculated and added automatically if it is not explicitly, but it could also
    be inherited from a parent directory mask setting. By default, the mask is recalculated
    whenever any of the affected ACLs are added, modified, or deleted.


    # ACL Permission Precedence


    When determining whether a process (a running program) can access a file, file
    permissions and ACLs are applied as follows:'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# CHAPTER 4 | Controlling Access to Files with ACLs


    +   - If the process is running as the user that owns the file, the file''s user
    ACL permissions apply.


    +   - If the process is running as a user that is listed in a named ACL entry,
    then the new ACL permissions apply (as long as it is permitted by the mask).


    +   - If the process is running as a group that matches the group owner of the
    file, or as a group with an explicitly named group ACL entry, then the matching
    ACL permissions apply (as long as it is permitted by the mask).


    +   - Otherwise, the file''s other ACL permissions apply.


    # EXAMPLES OF ACL USE BY THE OPERATING SYSTEM


    Red Hat Enterprise Linux has examples that demonstrate typical ACL use for extended
    permission requirements.


    # ACLs on Systemd Journal Files


    systemd-journal uses ACL entries to read access to the `/run/log/journal/cb44...8ae2/system.journal`
    file. This ACL allows the members of the `adm` and `wheel` groups to have access
    to the logs managed by `journalctl` without having to give specific permissions
    to the privileged content inside `/var/log/`, like `messages`, `secure` or `audit`.


    Due to the systemd-journal configuration, the parent folder of the `system.journal`
    file can change, so the systemd-journal applies ACLs to the new folder and file
    automatically.


    > NOTE

    System administrators should check an ACL on the `/var/log/journal/` folder when
    systemd-journal is configured for persistent storage.


    ```

    [host]$ getfacl /run/log/journal/cb44...8ae2/system.journal

    getfacl: Removing ''/'' from absolute path names

    # file: /run/log/journal/cb44...8ae2/system.journal

    # owner: root

    # group: systemd-journal

    user::r-

    group::r-

    group:adm:r-

    group:wheel:r-

    mask::r-

    other::---

    ```


    # ACL on Systemd Managed Devices


    systemd-udev uses a set of udev rules that enable the uaccess tag to some devices,
    such as CD/DVD players or USB storage devices, sound cards, and many others. The
    previous mentioneddev rules sets ACLs on these devices to allow users logged in
    to a graphical user interface (for example gdm) to have full control of these
    devices.


    The ACLs will remain active until the user logs out of the GUI. The next user
    who logs in to the GUI will have a new ACL applied for the required devices.'
