  md: '# CHAPTER | Managing Logical Volumes


    Logical volumes created from the available space in a volume group can be formatted
    with a file system, activated as swap space, and mounted persistently.


    ![](img/3c5dfc78dee328600013666607c8aa7b_214_0.png)


    Figure 7: Logical volume management components


    LVM provides a comprehensive set of command-line tools for implementing and managing
    LVM storage. These command-tools can be used in scripts, making them suitable
    for automation.


    > IMPORTANT

    The following examples use device vdb and its partitions to illustrate LVM commands.
    In practice, these examples would need to use the correct devices for the disk
    and disk partitions that are being used by the system. Use the **lsblk**, **blkid**,
    or **cat /proc/partitions** commands to identify the devices on your


    # Creating a Logical Volume


    To create a logical volume, perform the following steps:


    # Prepare the physical device.


    Use **parted**, **gdisk**, or **fdisk** to create a new partition for LVM. Always
    set the partition type to **Linux LVM** on LVM partitions; use **0x8e** for MBR
    partitions. If necessary, use **partprobe** to register the new partition with
    the kernel.'
