  md: '# CHAPTER 2 Installing Red Hat Enterprise Linux


    Click **Reboot** when the installation is done. Anaconda displays the **Initial
    Setup** screen, if a graphical desktop was installed. Accept the license information
    and optionally register the system with the subscription manager. You may skip
