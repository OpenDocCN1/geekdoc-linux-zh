  md: "# RUNNING COMMANDS MORE EFFICIENTLY USING LOOPS\n\n# OBJECTIVES\n\nAfter completing\
    \ this section, you should be able to:\n\n+   - Iterate over lists using for loops.\n\
    - Evaluate exit codes from commands and scripts.\n- Perform tests using operators.\n\
    - Create conditional structures using if statements.\n\n# USING LOOPS TO ITERATE\
    \ COMMANDS\n\nSystem administrators often encounter repetitive tasks in their\
    \ day-to-day activities. Repetitive tasks can take the form of executing an action\
    \ multiple times on a target, such as checking a process every 10 minutes to see\
    \ if it has completed. Task repetition can also take the form of executing an\
    \ action once across multiple targets, such as backing up each database on a system.\
    \ The for loop is one of the multiple shell loops constructed by Bash, and can\
    \ be used for task iterations.\n\n# Processing Items from the Command Line\n\n\
    Bash's for loop uses the following syntax:\n\n```\nfor VARIABLE in LIST; do\n\
    \  COMMAND VARIABLE\ndone\n```\n\nThe loop processes the strings provided in LIST\
    \ in order one by one and exits after processing the last string in the list.\
    \ Each string in the list is temporarily stored as the value of VARIABLE, while\
    \ the for loop executes the block of commands contained in its construct. The\
    \ naming of the variable is arbitrary. Typically, the variable is referenced by\
    \ commands in the command block.\n\nThe list of strings provided to a for loop\
    \ can be supplied in several ways. It can be a list of strings entered directly\
    \ by the user, or generated from different types of shell expansion, such as variable,\
    \ brace, or file-name expansion, or command substitution. Some examples that demonstrate\
    \ the ways strings can be provided for for loops.\n\n```\n[user@host ~$ for HOST\
    \ in host1 host2 host3; do echo $HOST; done\nhost1\nhost2\nhost3\n[user@host ~$\
    \ for HOST in host(1,2,3); do echo $HOST; done\nhost1\nhost2\nhost3\n[user@host\
    \ ~$ for HOST in host(1..3); do echo $HOST; done\nhost1\n```"
