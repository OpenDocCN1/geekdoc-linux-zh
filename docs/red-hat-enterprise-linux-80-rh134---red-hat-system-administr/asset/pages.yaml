  md: '# MOUNTING NETWORK-ATTACHED STORAGE WITH NFS


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Identify NFS share information.

    - Create a directory to use as a mount point.

    - Mount an NFS share using the mount command or by configuring the /etc/fstab
    file.

    - Unmount NFS share using the umount command.

    - Configure your NFS client to use NFSv4 using the new nfsconf tool.


    # MOUNTING AND UNMOUNTING NFS SHARES


    NFS, the Network File System, is an internet protocol used by Linux, UNIX, and
    similar operating systems as their native network file system. It is an open standard,
    currently being actively enhanced, which supports native Linux permissions and
    file-system features.


    The default NFS version in Red Hat Linux 8 is 4.2, NFSv4 and NFSv3 major versions
    are supported. NFSv2 is no longer supported. NFSv4 clients use only the TCP protocol
    to communicate with the server; early NFS versions could use either TCP or UDP.


    NFS servers export shares (directories). NFS clients mount exported shares to
    a local mount point (directory), which must exist. NFS shares can be mounted a
    number of ways:


    +   - Manually, using the `mount` command.

    - Automatically at boot time using /etc/fstab entries.

    - On demand, using either the autofs service or the systemd-automount facility.


    # Mounting NFS Shares


    To mount an share, follow these three steps:


    +   1. **Identify:** The administrator of the NFS client system can identify available
    NFS shares in various ways:


    The administrator for the NFS server may provide export details, including security
    requirements.


    Alternatively, the client administrator can identify NFSv4 shares by mounting
    the root directory of the NFS server and exploring the exported directories. Access
    to shares that use Kerberos security will be denied, but the share (directory)
    name will be visible. Other shared directories will be browsable.


    ```

    [user@host ~] sudo mkdir mountpoint

    [user@host ~] sudo mount serverb:/mountpoint

    [user@host ~] sudo ls mountpoint

    ```'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# CHAPTER6 | Accessing Network-Attached Storage


    2. Mount point: Use mkdir to create a mount point in a suitable location.


    ```

    [user@host ~]$ mkdir -p mountpoint

    ```


    3. Mount: As file systems on partitions, NFS shares must be mounted to be available.
    In each case, you must run these commands as a superuser either by logging in
    as \`root\` or by using the \`sudo\` command.


    +   - Temporarily: Mount the NFS share using the mount command:


    ```

    [user@host ~]$ sudo mount -t nfs -o rw,sync server:share mountpoint

    ```


    The \`-t nfs\` option is the file-system type for NFS shares (not strictly required
    but shown for completeness). The \`-o sync\` option tells mount to immediately
    synchronize operations with the NFS server (the default is asynchronous).


    This command mounts the share immediately but not persistently; the next time
    the system boots, this share will not be available. It is useful for one-time
    access to data. It is also useful for mounting an NFS share before making the
    share available persistently.


    +   - Permanently: To ensure the NFS share is mounted at boot time, edit the \`/etc/fstab\`
    file to add the mount entry.


    ```

    [user@host ~]$ sudo vim /etc/fstab

    ...

    server:/share /mountpoint nfs rw,soft 0 0

    ```


    Then, mount the NFS share:


    ```

    [user@host ~]$ sudo mount /mountpoint

    ```


    Because the NFS server and mount options are found in the \`/etc/fstab\` entry
    by the NFS client service, you do not need to specify this on the command line.


    # Unmounting NFS Shares


    As root (or using \sudosudo`), unmount an NFS share using the \`umount\` command.


    ```

    [user@host ~]$ sudo umount mountpoint

    ```


    > NOTE

