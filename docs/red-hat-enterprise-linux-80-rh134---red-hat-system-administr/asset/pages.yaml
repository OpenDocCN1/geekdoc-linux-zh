    # OBJECTIVES


    +   - Describe the Red Hat Enterprise Linux boot process, set the default target
    used when booting, and boot a system to a non-default target.

    - Log in to a system and change the root password when the current root password
    has been lost.

    - Manually repair file system configuration or corruption issues that stop the
    boot process.


    # SECTIONS


    +   - Selecting the Boot Target (and Guided Exercise)

    - Resetting the Root Password (and Guided Exercise)

