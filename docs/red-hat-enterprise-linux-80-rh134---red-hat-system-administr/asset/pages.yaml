  md: 'bind to this port. The log message also produces the syntax of the semanage
    port command that you can easily fix the issue.


    +   9.4. Use the semanage port command to set the appropriate SELinux context
    on the port 3008/TCP for httpd to bind to it.


    ```

    [root@server ~]# semanage port -a -t http_port_t -p tcp 3008

    ```


    +   9.5. Use the systemctl command to restart httpd. This command should successfully
    restart the service.


    ```

    [root@server ~]# systemctl restart httpd

    ```


    +   9.6. Add the port 3008/TCP to the default firewalld zone called public.


    ```

    [root@server ~]# firewall-cmd --add-port=3008/tcp --permanent

    success

    [root@server ~]# firewall-cmd --reload

    success

    ```


    +   9.7. Exit the root user''s shell.


    ```

    [root@server ~]# exit

    logout

    ```


    +   9.8. Log off from server.


    ```

    [student@server ~]$ exit

    logout

    Connection to server closed.

    ```


