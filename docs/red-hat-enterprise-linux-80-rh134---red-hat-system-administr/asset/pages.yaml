  md: '# MATCHING REGULAR EXPRESSIONS WITH GREP


    The grep command, provided as part of the distribution, uses regular expressions
    to isolate matching data.


    # Isolating data using the grep command


    The grep command provides a regular expression and a file on which the regular
    expression should be matched.


    ```

    [user@host ~]$] grep ''^computer'' /usr/share/dict/words

    computer

    computerese

    computerise

    computerite

    computerizable

    computerization

    computerize

    computerized

    computerizes

    computerizing

    computerlike

    computernik

    computers

    ```


    > It is recommended practice to use single quotes to encapsulate the regular expression
    they often contain shell metacharacters (such as $, *, and {}). This ensures that
    the characters are interpreted by grep and not by the shell.


    The grep command can be used in conjunction with other commands using a pipe operator
    (|). For example:


    ```

    [root@host ~] ps aux | grep chron

    chronyd 662 0.0 0.1 29440 2468 5 10:56 0:00 /usr/sbin/chronyd

    ```


    # grep Options


    The grep command has many useful options for adjusting how it uses the provided
    regular expression with data.'
