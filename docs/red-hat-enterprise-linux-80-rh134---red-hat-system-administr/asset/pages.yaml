  md: '# EXTENDING LOGICAL VOLUMES


    # OBJECTIVES


    After completing this section, you should be able to:


    +   - Extend a volume group (VG) using `pvcreate` and `vgxtend`, and use `vgdisplay`
    to verify the results.

    - Reduce a VG using `pmove` and `vgreduce`.

    - Extend a logical volume (LV) using `lvextend`.

    - Resize XFS file systems with `xfs_growfs`.

    - Resize ext4 file systems with `resize2fs`.


    # EXTENDING AND REDUCING A VOLUME GROUP


    You can add more disk space to a volume group by adding additional physical volumes.
    This is *extending the volume group*. Then, you can assign the new physical extents
    from the additional physical volumes to logical volumes.


    You can remove unused volumes from a volume group. This is called *reducing the
    volume group*. First, use the `pmove` command to move data from one physical volume
    to other physical volumes in the volume group. In this way, a new disk can be
    added to an existing volume group, data can be moved from an older or slower disk
    to a new disk, and the old disk removed from the volume group. You can perform
    these actions while the logical volumes in the volume group are active.


    > The following examples use the device vdb and its partitions to illustrate LVM
    commands. In practice, use the appropriate devices for the disk and disk partitions
    on your own system.


    # Extending a Volume Group


    To extend a volume group, perform the following steps:


    # Prepare the physical device and create the physical volume.


    As creating a new volume group, you must create and prepare a new partition for
    use as a physical volume if there are not prepared already.


    ```

    [root@host ~]# parted -s /dev/vdb mkpart primary 1027MiB 1539MiB

    [root@host ~]# parted -s /dev/vdb set 3 lvm on

    [root@host ~]# pvcreate /dev/vdb3

    ```


    A PV is only needed to create if there are no PVs to free the VG.'
