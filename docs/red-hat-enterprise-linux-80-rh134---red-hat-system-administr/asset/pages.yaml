    # CONTROLLING ACCESS TO FILES WITH ACLS


    # GOAL


    Interpret and set Access Control Lists (ACLs) on files to handle situations requiring
    complex user and group access permissions.


    # OBJECTIVES


    +   - Describe use cases for ACLs, identify files that have ACLs set, and interpret
    the effect of those ACLs.

    - Set and remove ACLs on files and define default ACLs automatically set by a
    directory on newly created files.


    # SECTIONS


    +   - Interpreting File ACLs (and Guided Exercise)

    - Securing Files with ACLs (and Guided Exercise)


    # LAB


    Controlling Access to Files with ACLs


    ![](img/3c5dfc78dee328600013666607c8aa7b_110_0.png)'
  merge: -1
