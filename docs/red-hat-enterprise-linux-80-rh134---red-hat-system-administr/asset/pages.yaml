  md: '# INTRODUCTION


    RED HAT SYSTEM ADMINISTRATION II

    This course is specifically designed for students who have completed Red Hat System
    Administration I (RH124). Red Hat System Administration II (RH134) focuses on
    the key tasks needed to become a full time Linux Administrator and to validate
    those skills via the Red Hat Certified System Administrator exam. This course
    goes deeper into Enterprise Linux administration including filesystems and partitioning,
    logical volumes, SELinux, firealling, and troubleshooting.


    ![](img/3c5dfc78dee328600013666607c8aa7b_10_0.png)


    # COURSE OBJECTIVES


    +   - Expand and extend on skills gained during the Red Hat System Administration
    I (RH124)

    - Build skills needed by an RHCSA-certified Red Hat Enterprise Linux system administrator.


    # AUDIENCE


    +   - This course is singularly designed for students who have completed Red Hat
    System Administration I (RH124). The organization of topics is such that it is
    not appropriate for students to use RH134 as a curriculum entry point. Students
    who have not taken a previous Red Hat course are encouraged to take either System
    Administration I (RH124) if they are new to Linux or the RHCSA Fast Track course
    (RH200) if they are experienced with Enterprise Linux administration.


    # PREREQUISITES


    +   - Having sat the Red Hat System Administration I (RH124) course, or equivalent
    knowledge.'
  merge: -1
  pgno: 10
