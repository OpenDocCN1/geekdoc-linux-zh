  md: "# Extend the volume group.\n\nUse **vgxtend** to add the new physical volume\
    \ to the volume group. Use the VG name and PV device arguments as **vgxtend**.\n\
    \n```\n[root@host ~#] vgxtend vg0 /dev/vdb3\n```\n\nThis extends the vg0 VG by\
    \ the size of the /dev/vdb3 PV.\n\n# **Verify the new space is available**\n\n\
    Use **vgdisplay** to confirm the additional physical extents are available. Inspect\
    \ the **Free PE / Size** in the Output. It should not be zero.\n\n```\n[root@host\
    \ ~]# vgdisplay vg01\n-- Volume group\n  VG Name vg01\n  output omitted...\n \
    \ Free PE / Size 178 / 712.00 MiB\n  output omitted...\n```\n\n# # Reducing a\
    \ Volume Group\n\nTo reduce a volume group, perform the following steps:\n\n#\
    \ **Move the physical extents.**\n\nUse **pmove PV_DEVICE_NAME** to relocate any\
    \ extents from the physical volume you want to remove to other physical volumes\
    \ in the volume group. The other physical volumes must have a sufficient number\
    \ of free extents to accommodate this move. This is only possible if there are\
    \ enough free extents in the VG and all of those come from other PVs.\n\n```\n\
    [root@host ~#] pmove /dev/vdb3\n```\n\nThis command moves the PEs from **/dev/vdb3**\
    \ to other PVs with free PEs in the same VG.\n\n> **WARNING**\nBefore using **pmove**,\
    \ back up data stored on all logical volumes in the volume group. An unexpected\
    \ power loss during the operation may leave the volume group in an inconsistent\
    \ state. This could cause loss of data on logical volumes in the volume group.\n\
    \n# **Reduce the volume group**\n\nUse **vgreduce VG_NAME PV_DEVICE_NAME** to\
    \ remove a physical volume from a volume group.\n\n```\n[root@host ~#] vgreduce\
    \ vg01 /dev/vdb3\n```\n\nThis removes the **/dev/vdb3** PV from the vg01 VG and\
    \ it can now be added to another VG. Alternatively, **pvremove** can be used to\
    \ permanently stop using the device as a PV."
