  md: '# SCHEDULING A DEFERRED USER JOB


    # OBJECTIVES


    After completing this section, you should be able to set up a command that runs
    once at some point in the future.


    # DESCRIBING DEFERRED USER TASKS


    Sometimes you might need to run a command, or set of commands, at a point in the
    future. Examples include people who want to schedule an email to their boss, or
    a system administrator working on a firewall configuration who puts a "safety"
    job in place to reset the firewall settings in ten minutes, unless they deactivate
    the job beforehand.


    These scheduled commands are often called *jobs*, and the term *deferred* indicates
    that these tasks or jobs are going to run in the future.


    One of the solutions available to Red Hat Enterprise Linux users for scheduling
    deferred tasks is *at*. The package provides the (**atd**) system daemon along
    with a set of command-line tools to interact with the daemon (**at, atq**, and
    more). In a default Red Hat Enterprise Linux installation, *atd* is installed
    and enabled automatically.


    Users (including **root**) can queue jobs for the **at** daemon using the **at**
    command. The **atd** daemon provides 26 queues, **a** to **z**, in alphabetically
    ordered queues getting lower system priority (higher nice values, discussed in
    a later chapter).


    # Scheduling Deferred User Tasks


    Use the **TIMESPEC** command to schedule a new job. The **at** command reads the
    commands to execute from the **stdin** channel. While manually entering commands,
    you can finish your input by pressing **Ctrl-D**. For more complex commands that
    are prone to typographical errors, it is easier to use indirection from a script
    file, for example, **now +5min < mys**, rather than typing all commands in a manual
    terminal.


    The **TIMESPEC** argument with the **at** command accepts many powerful combinations,
    allowing users to describe exactly when a job should run. Typically, they start
    with a time, for example, **02:00pm:15:59**, or even teamtime followed by an optional
    date or number of days in the future. The following lists are examples of combinations
    that can be used.


    +   * now +5min


    +   * team tomorrow (teamtime is **16:00**)


    +   * noon +4 days


    +   * 5pm august 3 2021


    For a complete list of valid time specifications, refer to the timespec definition
    as listed in the the references.'
  merge: -1
