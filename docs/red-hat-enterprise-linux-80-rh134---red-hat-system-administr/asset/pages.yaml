  md: "# INTERNATIONALIZATION\n\n# PER-USER LANGUAGE SELECTION\n\nYour users might\
    \ prefer to use a different language for their desktop environment than the system-wide\
    \ default. They might also want to use a different keyboard layout or input method\
    \ for their account.\n\n# Language Settings\n\nIn the GNOME desktop environment,\
    \ the user might be prompted to select their preferred language and input method\
    \ on first login. If not, the easiest way for an individual to adjust their preferred\
    \ language and input method settings is to use the Region & Language application.\n\
    \nYou can start this application in two ways. You can run the command gnome-control-center\
    \ from a terminal window, or on the top bar, from the menu in the right corner,\
    \ select the settings button (which has a crossed screwdriver and wrench for an\
    \ icon) from the bottom left of the menu.\n\nIn the window that opens, select\
    \ Region & Language. Click and select the preferred language from the list that\
    \ appears. This also updates the Formats setting to the default for that language.\
    \ The next time you log in, these changes will take effect.\n\nThese settings\
    \ affect the GNOME desktop environment and any applications such as gnome-terminal\
    \ that are started inside it. However, by default they do not apply to any account\
    \ accessed through an ssh login from a remote system or a text-based login on\
    \ a virtual console (such as tty5).\n\n> NOTE\nYou can make your shell environment\
    \ use the same LANG setting as your graphical environment, even when you log in\
    \ through a text-based virtual console or ssh. One way to do this is to place\
    \ code similar to the following in ~/.bashrc file. This example will set the language\
    \ used by a text login to match the one currently set for your GNOME desktop environment:\n\
    ```bash\ni=$(grep 'LANGUAGE=' /var/lib/AccountsService/users/${USER} \\\n| sed\
    \ 's/LANGUAGE=/')\nif [ \"$i\" != \"\" ]; then\n  export LANG=$i\nfi\n```\n\n\
    Japanese, Korean, Chinese, and other languages with a non-Latin character set\
    \ might not display properly on text-based virtual consoles.\n\nIndividual commands\
    \ can be made to use another setting by setting the LANG variable in the command\
    \ line:"
  merge: -1
  pgno: 14
- img_proc: true
  md: '[user@host]$ LANG=fr_FR.utf8 date

    jeeu. avril 25 17:55:01 CET 2019


    Subsequent commands will revert to the system''s default language for output.
    The locale command can be used to determine the current value of LANG and other
    related environment variables.


    # Input Method Settings


    GNOME in Red Hat Enterprise Linux 7 or later automatically uses the IBus input
    method selection, making it easy to change keyboard layouts and inputs quickly.


    The Region & Language application can also be used to enable alternative input
    methods. In the Region & Language application, the Input Source box shows what
    input methods are currently available. By default, English (US) may be the only
    available method. Highlight English (US) and click the keyboard icon to select
    the current layout.


    To add another input method, click the + button at the bottom left of the Input
    Sources window. An Add Input Source window opens. Select your, then your preferred
    input method or keyboard layout.


    When more than one input method is configured, the user can switch between quickly
    by typing Super+Space. A status indicator will also appear in the GNOME top bar,
    which has two functions: It indicates which input method is active, and acts as
    a menu that can be used to switch between input methods or select advanced features
    of complex input methods.


    Some of the methods are marked with gears, indicating that these methods have
    advanced configuration options and capabilities. For example, the Japanese (Kana
    Kanji) input method allows you to pre-edit text in Latin and use Down Arrow and
    Up keys to select the correct characters.


    US English speakers may also find this useful. For example, English (United States)
    is the keyboard layout English (international AltGr keys), which treats AltGr
    (or the right Alt) on a PC 104/105-key keyboard as a "secondary shift" modifier
    key and dead key activation for typing additional characters. There are also Dvor
    and other alternative layouts available.


    > NOTE

    Unicode character can be entered in the GNOME desktop environment if you know
    the Unicode point. Press Ctrl+Shift+U, followed by the code point. After Ctrl-Shift-U
    has been typed, an underlined u will be displayed to indicate that the system
    is waiting for Unicode code point.


    For example, the Greek letter lambda has the code point U+03BB, and can be entered
    by typing Ctrl-Shift-U, then 03BB, Enter.


    # SYSTEM-WIDE DEFAULT LANGUAGE SETTINGS


    The system''s default language is set to US English, using the UTF-8 encoding
    of Unicode as its character set (en_US.utf8), but this can be changed during or
    after installation.


    From the command line, the root user can change the system-wide locale settings
    with the localectl command. If localectl is run with no arguments, it displays
    the current system-wide settings.'
  merge: -1
