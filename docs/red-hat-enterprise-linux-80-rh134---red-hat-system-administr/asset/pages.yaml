  md: '# introduction


    To set the system-wide default language, run the command localectl set-locale

    LANG=locale, where locale is the appropriate value for the LANG environment variable
    from the

    "Language Codes Reference" table in this chapter. The change will take effect
    for users on their

    next login, and is stored in etc/locale.conf.


    ```

    root@host]# localectl set-locale LANG=fr_FR.utf8

    ```


    In GNOME, an administrative user can change settings from Region & Language by
    clicking

    t Login Button at the upper-right corner of the window. Changing the Language
    of the

    graphical login screen will also adjust the system-wide default language setting
    stored in the /

    etc/locale.conf configuration file.


    ![](img/3c5dfc78dee328600013666607c8aa7b_16_0.png)


    > > Text-based virtual consoles such as tty4 are more limited in the fonts they
    can

    dis terminals in a virtual console running a graphical environment, or

    pseudonymous for ssh sessions. For example, Japanese, Korean, and Chinese

    characters may not display as an expected-based virtual console. with a Latin

    character set for the system-wide default.


    Likewise, text-based virtual consoles are more limited in the input methods they

    support, and is managed separately from the graphical desktop environment.

    The available global input settings can be configured through localectl for

    text-based virtual consoles and the graphical environment. See the localectl(1)

    and vconsole.conf(5) man pages for more information.


    # LANGUAGE PACKAGES


    Special RPM packages install langpacks packages that add support for specific

    languages. These packages use dependencies to automatically install additional
    RPM packages

    containing locales, dictionaries, and translations for other software packages
    on your system.


    To list the packages that are installed and that may be installed, use yum list
    langpacks:-


    ```

    root@host]# yum list langpacks-*

    Updating Subscription repositories.

    Updating Subscription repositories.

    Installed Packages

    langpacks-en.noarch               1.0-12.el8               AppStream

    Available Packages

    langpacks-mf.noarch               1.0-12.el8               rhel-8-for-x86_64-appstream-rpms

    langpacks-am.noarch               1.0-12.el8               rhel-8-for-x86_64-appstream-rpms

    langpacks-ar.noarch               1.0-12.el8               rhel-8-for-x86_64-appstream-rpms

    langpacks-as.noarch               1.0-12.el8               rhel-8-for-x86_64-appstream-rpms

    langpacks-ast.noarch               1.0-12.el8               rhel-8-for-x86_64-appstream-rpms

    ```


    To add language support, install the appropriate langpacks package. For example,
    the following

    command adds support for French:


    ```

    root@host]# yum install langpacks-fr

    ```'
  merge: -1
