  md: '# ADJUSTING TUNING PROFILES


    # OBJECTIVES


    After completing this section, you should be able to optimize system performance
    by selecting a tuning profile managed by the tuned daemon.


    # TUNING SYSTEMS


    System administrators can optimize the performance of a system by adjusting various
    device settings based on a variety of use case workloads. The tuned daemon applies
    tuning adjustments both statically and dynamically, using tuning profiles that
    reflect particular workload requirements.


    # Configuring Static Tuning


    The tuned daemon applies tuning settings when the service starts or selection
    of a new profile. Static tuning configures kernel parameters in profiles that
    tuned at runtime. With static tuning, kernel parameters are set for overall performance
    expectations, and are not adjusted at activity levels.


    # Configuring Dynamic Tuning


    With dynamic tuning, the tuned daemon monitors system activity and adjusts settings
    depending on runtime behavior. Dynamic tuning is continuously tuning to fit the
    current workload, starting with the initial settings declared in the chosen profile.


    For example, storage devices experience high use during startup and login, but
    have minimal activity when users consist using web browsers and email clients.
    Similarly, CPU and network devices experience activity increases during peak usage
    throughout the workday. The tuned daemon monitors the activity of these components
    and adjusts parameter settings to maximize performance during high-activity times
    and reduces settings during low activity. The tuned daemon uses performance provided
    in predefined tuning profiles.


    # INSTALLING AND ENABLEING TUNED


    A minimal Red Hat Enterprise Linux 8 installation enables and the tuned package
    by default. To install the package manually:


    ```

    [root@host ~]$ yum tuned installed

    [root@host ~]$ systemctl enable --now tuned

    Created symlink /etc/systemd/system/multi-user.target.wants/tuned.service -> /usr/lib/systemd/system/tuned.service.

    ```


    # SELECTING A TUNING PROFILE


    The tuned application provides profiles divided into the following categories:


    +   - Power-saving profiles

    - Performance-boosting profiles'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# CHAPTER 3 | tuning System Performance


    The performance-boosting profiles include profiles that focus on the following
    aspects:


    +   - Low latency for storage and network

    - High throughput for storage and network

    - Virtual machine performance

    - Virtualization host performance


    # Tuning Profiles Distributed with Red Hat Enterprise Linux 8


    | TUNED PROFILE | PURPOSE |

    | balanced | Ideal for systems that require a compromise between power saving
    and performance. |

    | desktop | Derived from the balanced profile. Provides faster response of interactive
    applications. |

    | throughput-performance | Tunes the system for maximum throughput. |

    | latency-performance | Ideal for server systems that require low latency at the
    expense of consumption. |

    | network-latency | Derived from the latency-performance profile. It enables additional
    network tuning parameters to provide low network latency. |

    | network-throughput | Derived from the throughput-performance profile. Additional
    network tuning parameters are applied for maximum throughput. |

    | powersave | Tunes the system for maximum power saving. |

    | oracle | Optimized for Oracle database loads based on the throughput-performance
    profile. |

    | virtual-guest | Tunes the system for maximum performance if it runs on a virtual
    machine. |

    | virtual-host | Tunes the system for maximum performance if it acts as a host
    for virtual machines. |


    # MANAGING PROFILES FROM THE COMMAND LINE


    The tuned-adm command is used to change settings of the tuned daemon. The tuned-adm
    command can query current settings, list available profiles, recommend a tuning
    profile for the system, change profiles directly, or turn off active.


    A system administrator identifies the active tuning profile with tuned-adm active.


    ```

    [root@~$] tuned-adm active

    Current active profile: virtual-guest

    ```


    The tuned-adm list command lists all available tuning profiles, including both
    built-in and custom tuning profiles created by a system administrator.'
