  md: 'Describe use cases for ACLs, identify files that have ACLs set, and interpret
    the effect of those ACLs.


    Set and remove ACLs on files and define default ACLs automatically by a directory
    on newly created files.


    #  Chapter 5, Managing SELinux Security


    Protect the security of a server using SELinux.


    +   Describe how SELinux protects resources and how to select the enforcement
    mode.


    +   Configure a file SELinux context to control how processes interact with that
    file.


    +   Configure SELinux booleans to allow runtime policy changes for varying access
    needs.


    +   Investigate SELinux log messages and troubleshoot SELinux AVC denials.


    #  Chapter 6, Managing Basic Storage


    Create and manage storage devices, partitions, file systems, and swap spaces from
    the command line.


    +   Create storage partitions, format them with file systems, and manage them
    for use.


    +   Create and manage swap spaces to supplement physical memory.


    #  Chapter 7, Managing Logical Volumes


    Create and manage logical volumes containing file systems and swap spaces from
    the command line.


    +   Create and manage logical volumes from storage devices, and format them with
    file systems or prepare them with swap spaces.


    +   Add and remove storage volumes assigned to volume groups, and nondestructively
    extend the size of a logical volume formatted with a file system.


    #  Chapter 8, Implementing Advanced Storage Features


    Manage storage using the Stratis local storage management system and use the VDO
    volumes to optimize storage space in use.


    +   Manage multiple storage layers using Stratis local storage management.


    +   Optimize the use of storage space using VDO to compress and deduplicate data
    on storage devices.


    #  Chapter 9, Accessing Network-Attached Storage


    Access network-attached storage using the NFS protocol.


    +   Mount, and unmount an NFS export from the command line and at boot.


    +   Configure the automounter with direct and indirect maps to automatically mount
    an NFS file system on demand, and unmount it when it is no longer in use.


    +   Configure an NFS client to use NFSv4 using the new nconf tool.'
