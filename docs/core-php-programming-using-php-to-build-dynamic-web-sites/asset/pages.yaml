  md: '# # Chapter 2


    Everything in PHP is either an identifier or an operator. An identifier can be
    a function or variable. An operator is usually one or two symbols that stand for
    some sort of data manipulation like addition or multiplication. When they are
    combined, they become an expression. This chapter introduces these concepts which
    form the basis of all PHP code.


    # ## Identifiers


    Identifiers give names to the abstract parts of PHP: functions, variables, and
    classes. Some of them are created by PHP in the form of built-in functions or
    environment variables. Others you create. Identifiers may be of any length and
    consists of letters, numbers, or underscores. The first character of an identifier
    must be either a letter or an underscore. Figure 2–1 contrasts acceptable identifiers
    with unacceptable ones.

    Upper- and lowercase letters are recognized as different. That is, the variables
    UserName and username are two distinct identifiers. The exception is built-in
    functions. As stated in Chapter 1, functions like print can be called Print if
    you prefer.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Chapter 2 Variables, Operators, and Expressions


