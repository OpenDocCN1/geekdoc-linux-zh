- img_proc: true
  md: '# Chapter 14 Sorting, Searching, and Random Numbers


    # Sorting


    To sort means to put a set of like items into order. The rules of ordering can
    be simple, such as strings sorted by the order of the alphabet. They could be
    complex, such as sorting addresses first by country, then by state, then by city.
    The process of sorting can take several forms but always involves comparing two
    elements with a set of rules for ordering. The result of the comparison determines
    whether the two items are in order or out of order, there-fore needing to be swapped.


    There are three classes of sorts: exchange, insert, and select. In an exchange
    method, two elements are compared and possibly exchanged. This process continues
    until the list is in order. In an insert method, the elements are moved and placed
    in another list, one by one. Each time an element is moved it is inserted into
    the correct position. When all elements are moved, the list is in order. A selection
    sort builds a second list by scanning the first and repeatedly selecting the lowest
    value. Insertion and selection sorts are two sides of a coin. The former scans
    the new list, the latter scans the old list.


    As I said earlier, a sort algorithm is essentially comparison and possible movement
    of elements in a list. On average, moving elements around takes the same amount
    of time, no matter what algorithm you use. Likewise, the comparison is independent
    of the actual sort. If we take these to be constants, the most important question
    to ask about each algorithm is: How many times does the algorithm perform either
    of these costly actions?


    Of course, the sort must be kept in context with the data. Some algorithms perform
    very well when the data is completely unordered but slow when the data are already
    in order or in reverse order. Some sorts perform poorly when there are many elements;
    others have an overhead as to be inappropriate for smaller data sets. Like any
    technician, the programmer matches the tool to the job.


    In the first part of this chapter I will describe the bubble sort and the quicksort.
    I will guide you through expressing the algorithms in PHP. I will then go on to
    describe the built-in sorting functions.


    # Bubble Sort


    Bubble sort''s one virtue is simplicity. The list is scanned repeatedly, once
    less than there are elements. Neighboring items are compared and swapped out of
    order. Each time through the list you can scan one less because the lightest bubbles,
    to stick with the metaphor, have risen to the top.'
  merge: -1
