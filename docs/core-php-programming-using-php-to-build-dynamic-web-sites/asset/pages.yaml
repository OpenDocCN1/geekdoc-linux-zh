  md: "# Chapter 3 Control Statements\n\n```\n<?\nfor($counter = 1; $counter <= 10;\
    \ $counter++) {\n    print(\"counter is $counter<BR>\\n\");\n}?>\n```\n\n**Figure\
    \ 3–13** A Typical for Loop\n\nwhile statement, the continue expression is evaluated.\
    \ If false, control jumps to just after the continue block. Otherwise, the code\
    \ block is executed. Before the continue expression is evaluated, the increment\
    \ statement is executed. This puts at all the information needed for running the\
    \ loop in one place and forces you to think about all the steps. Figure 3–13 is\
    \ a simple for loop, which is typical in form.\n\nMost for loops look like Figure\
    \ 3–13. They use a counter that increments by one each time through the loop.\
    \ However, the for statement is not particular about what you put in the three\
    \ slots. The initialization slot allows a comma-separated list of assignments\
    \ can be used to assign values to two or more variables. You may also leave a\
    \ slot blank. Figure 3–14 converts the code in Figure 3–10 into a for loop. I've\
    \ added line breaks to the for statement to keep the code from wrapping. It also\
    \ makes it easier to see the three parts.\n\nAlthough the for statement is longer\
    \ and looks more complicated, it really is no different than the simple example\
    \ in Figure 3–13. A variable, in this case currentDate, is set to some initial\
    \ value. That value is used to test for an end condition. And the value is incremented\
    \ by the number of seconds in a day instead of just one.\n\n# The exit Statement\n\
    \nLike break, the exit statement offers a way to escape from execution. The exit\
    \ statement stops all execution. Any text after the exit statement, PHP or just\
    \ HTML, is not sent to the browser. This is useful when an error occurs and it\
    \ would be more harmful to continuing code than to just abort. This is often the\
    \ case when preparing database queries. If the SQL statement cannot be parsed,\
    \ it makes no sense to try it."
