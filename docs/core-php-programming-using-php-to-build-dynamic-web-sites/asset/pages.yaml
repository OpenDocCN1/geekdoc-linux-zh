  md: '# Chapter I An Introduction to PHP


    The first block of PHP code puts values into some variables. The four variables
    are YourName, Today, CostOfLunch, and DaysBuyingLunch. PHP knows they are variables
    because they are preceded by a dollar sign ($). The time you use a variable in
    a PHP script, some memory is set aside to store the information you want to save.
    You don''t need to tell PHP what kind of information you expect to be saved in
    the variable: PHP can figure this out on its own.


    The script first puts a character string into the variable YourName. As I noted
    earlier, PHP knows it''s textual data because I put quotes around it. Likewise
    I put today''s date into a variable named Today. In this case PHP knows to put
    text into the variable the date function returns. This type of data is referred
    to as a string, which is shorthand for character string. A character is a single
    letter, number, or any other mark you make by typing a single key on your keyboard.


    Notice that there is an equal sign between the variable and the value you put
    into it. This is the assignment operator. Everything to its right is a variable
    named to its left.


    The third and fourth assignments are putting numerical data into variables. The
    value 3.5 is a floating-point, or fractional, number. PHP calls this type double,
    showing some of its C heritage. The 4 in the next assignment is an integer, or
    whole number.


    After printing some HTML code, another PHP code block is opened. The script prints
    today''s date as a level three header. Notice the script passes some types of
    information to the print command. You can give string literals or variables to
    print and they will be sent to the browser.


    When it comes to variables, PHP is not so lenient with case. Today and today are
    two different variables. Since PHP doesn''t require you to declare variables before
    you use them, you can accidentally type today when you mean Today and no error
    will be generated. If variables are unexpectedly empty, check your case.


    The script next prints "Leon, you will be out 14.00 dollars this week." The line
    that prints the total has to calculate it with multiplication using the operator.


