  md: '# odbc_close(integer connection)


    Use odbc_close to close a connection to a database. If there are open transactions
    for the connection, an error will be returned and the connection will not be closed.


    # Example


    ```

    <?php

    // connect to database

    $connection = odbc_connect("store", "guest", "guest");


    // execute query

    $query = "SELECT price ";

    $query .= "FROM catalog ";

    $query .= "WHERE id=10 ";

    $result = odbc_do($connection, $query);


    odbc_fetch_row($result)


    $price = odbc_result($result, 1);


    print("$price<BR>\n");


    obdc_close($connection);

    ?>

    ```


