    doesn''t exist, more than likely you may use ODBC with an appropriate driver.
    Also included in this chapter are functions for accessing other systems that are
    essentially databases, including mail and LDAP. Chapter 16 discusses strategies
    for using databases with PHP-powered sites.


    Most of the functions in this section rely on an extension module. These are loaded
    either in the php.ini file or with the appropriate function.


    While this chapter describes the PHP functions that communicate with various systems,
    it does not pursue the intricacies of all the systems. I can''t possibly include
    an introduction to SQL within this book. If you have chosen a database for integration
    with PHP, I assume you will take the time to learn about that database.


