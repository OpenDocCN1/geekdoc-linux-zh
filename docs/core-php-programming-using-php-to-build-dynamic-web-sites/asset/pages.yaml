    # array each(array arrayname)


    The each function returns a four-element array that represents the next value
    from an array. You may traverse an entire array by repeatedly calling each. The
    four elements of the returned array refer to the key and value of the current
    element. You may refer to the key with 0 or key, and to get the value use 1 or
    value.'
