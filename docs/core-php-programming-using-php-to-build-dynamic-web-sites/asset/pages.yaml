    # value current(array arrayname)


    The current function returns the value of the current element pointed to by PHP''s
    internal pointer. Each array maintains a pointer to one of the elements of an
    array. By default it points to the first element added to the array until it is
    moved by a function.


    # Example


    ```

    <?php

    $colors = array("red", "green", "blue");

    print(current($colors));

    ?>

    ```


