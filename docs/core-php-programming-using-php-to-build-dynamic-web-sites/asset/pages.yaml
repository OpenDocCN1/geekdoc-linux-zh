  md: By now you most likely understand regular expressions, but one new idea is worth
    noting. The call to ereg_replace in Figure 15–8 uses integer to stand for a linefeed.
    This is because ASCII 10 is a linefeed character. You might think of using backslash-n
    here, but that would not give the results you want. Recall that the backslash
