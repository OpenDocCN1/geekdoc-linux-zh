  md: '# About the CD


    What''s Included

    The CDROM attached to this book has the following top-level directories:


    +   - Apache

    This directory contains source code and a Windows installation executable for
    the Apache Web server version 1.3.3. This is the best Web server to use for Unix.

    - Boaz

    This directory contains examples from http://php.netvision.net.il/examples/

    - Examples

    This directory contains source code for every example in the book.

    - PHP

    This directory contains the source code and Windows binaries for PHP version 3.0.6.
    It also contains the documentation created by the PHP developers. They downloaded
    from the PHP home site, http://www.php.net/

    - Sklar

    This directory contains examples from the PHP Exchange at http://px.sklar.com/nn-itami

    This directory contains source code and Windows binaries for the Xitami Web server.
    The files were downloaded from http://www.imatix.com/. Xitami is easiest server
    for Windows to set up to PHP.


    # System Requirements


    The CD-ROM is a standard ISO 9660 CD formatted with RockRidge and Joliet extensions.


    Installation instructions, copyright notices, license agreements, and system requirements
    are provided for each program as appropriate.

    Use of the Java Web Server CD-ROM is subject to the terms of the License Agreement
    following the index in this book.


    # Technical Support


    Prentice Hall does not offer technical support for any of the programs on the
    CD-ROM. However, if the CD is damaged, you may obtain a replacement copy by sending
    an email decribing the problem to: disc_exchange@phpptr.com'
