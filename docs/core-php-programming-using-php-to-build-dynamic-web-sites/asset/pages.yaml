  md: '# Related Functions


    eregi


    # string ereg_replace(string pattern, string replacement, string text)


    Use ereg_replace to replace text. Each time the pattern matches a substring within
    the text argument, it is replaced with the replacement argument. The text argument
    is unchanged, but the altered version is returned.


    If the pattern contains subexpressions in parentheses, the replacement may contain
    a special code for specifying which subexpression to replace. The form is to use
    two backslashes followed by a single digit, zero through nine. Zero matches the
    entire expression; one through nine match the first nine subexpressions respectively.


    Regular expressions are discussed in depth in Chapter 15.


    # Example


    ```

    // swap newlines for break tags

    $text = "line1\nline2\nline3\n"

    print(ereg_replace("\n", "<BR>", $text));


    print("<HR>\n");


    // print the user agent with

    // mozilla changed to navigator

    print(ereg_replace("^\\Mozilla", "\\Navigator", $HTTP_USER_AGENT));

    ```


