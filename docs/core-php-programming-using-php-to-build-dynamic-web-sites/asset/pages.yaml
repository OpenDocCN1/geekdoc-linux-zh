    query made to the specified database connection link. If the link argument is
    omitted, the last opened connection is assumed.


    # Example


    ```

    // connect to server

    $mysql_link = mysql_connect("localhost", "httpd", "");


    // select the ''store'' database

    $mysql_select_db("store", $mysql_link);


    // update some invoices

    $query = "UPDATE invoice SET checked = now() ";

    $query = "WHERE ID < 100 {}

    $mysql_result = mysql_query($query, $mysql_link);


    // let user know how many rows were updated

    $affected_rows = mysql_affected_rows($mysql_link);

    print("$affected_rows updated.<BR>\n");

    ```


