    \ it. On the other hand it allows you to write very compact code.\n\n# The switch\
    \ Statement\n\nAn alternative to if-elseif-else structures is the switch statement.\
    \ The switch statement works on the assumption that you compare a single expression\
    \ to a set of expressions. Figure 3-6 demonstrates the structure of a switch statement.\n\
    \nThe root-expression inside a switch statement is evaluated and then compared\
    \ to each expression following a case statement. At the end of the list of cases\
    \ you can put a default statement that works exactly like an else statement; it\
    \ matches if no other case matches.\n\nNotice that cases do not have curly braces\
    \ after them. This reveals an important difference between if and switch. When\
    \ an block blocks and is executed, control skips to the end of the entire if statement.\
    \ In Figure 3-4, if you is Tuesday, german_Day is set to “Deinstag”, and control\
    \ jumps down to the closing curly brace closing the else block.\n\nA case statement\
    \ serves cases as a starting point for execution. The root expression is compared\
    \ to each case expression until one matches. Each line of code that is executed.\
    \ If another case statement is reached, it is ignored. Sometimes this is useful,\
    \ but most often a break statement is used to escape from the switch statement.\n\
    \nTake a look at Figure 3-7, I recoded Figure 3-4 using a switch statement. The\
    \ best argument for using switch is that it can be much easier to\n\n![](img/490647a2fc8fbc7034b6e56593c58845_67_0.png)\n\
    \n```\nswitch(root-expression)\n{\n  case case-expression:\n  default:\n}\n```"
