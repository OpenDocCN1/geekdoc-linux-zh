  md: '# The if Statement


    Figure 3-1 lays out the form of an if statement.

    The if statement executes a block of code if the expression is inside the parentheses
    evaluates to true; otherwise the entire block is skipped. Execution resumes after
    the block surrounded by curly braces.


    The command else may appear immediately after the block and has a block of its
    own. This block is executed only in the case when the previous expression is false.
    Between an if block and an else block you may put as many elseif commands as you''d
    like. Each elseif expression is evaluated in turn and control skips past those
    that are false.


    Once a true expression is reached, the rest of the expression inside the if statement
    is skipped over. Figure 3-2 demonstrates an if-elseif-else statement.


    Of course, you are not obligated to have an elseif or an else. Sometimes you might
    want to build a very simple if statement as in Figure 3-3.


    # Using else and elseif


    You can use if to build a series of checks that covers all possible cases. Just
    start by checking for the first condition with an if; then check for each fol-


    **Figure 3-1** The Form of an if Statement


    ```

    if(expression1)

    {

    This block gets executed if expression1 is true.

    }

    elif(expression2)

    {

    This block gets executed if expression1 is false and expression2 is true.

    }

    else

    {

    This block gets executed if both expression1 and expression2 are false.

    ```'
