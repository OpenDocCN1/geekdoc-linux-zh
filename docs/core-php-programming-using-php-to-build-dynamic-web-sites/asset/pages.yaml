  md: "# Chapter 14 Sorting, Searching, and Random Numbers\n\n```\n<?\n/*\n** Quicksort\n\
    ** input_array is an array of integers\n** left is the leftmost element to be\
    \ considered\n** right is the rightmost element to be considered\n*/\nfunction\
    \ Quicksort($input_array, $left_limit, $right_limit)\n{\n    //start pointers\n\
    \    $left = $left_limit;\n    $right = $right_limit;\n\n    //Choose the middle\
    \ element for the pivot\n    $pivot = intval(($left + $right)/2);\n    $pivot\
    \ = $input_array[$pivot];\n\n    do\n        while(($input_array[$left] < $pivot)\
    \ AND\n            ($left < $right_limit))\n        {\n            $left++;\n\
    \        }\n        while($pivot < $input_array[$right]) AND\n            ($right\
    \ > $left_limit))\n        {\n            $right--;\n        }\n        if($left\
    \ <= $right)\n        {\n            //swap elements\n            $temp = $input_array[$left];\n\
    \            $input_array[$left] = $input_array[$right];\n            $input_array[$right]\
    \ = $temp;\n            $left++;\n            $right--;\n        }\n    } while($left\
