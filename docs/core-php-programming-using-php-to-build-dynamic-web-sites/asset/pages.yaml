    | a (b*) | Matches a, ab, abb, ... — an plus any number of b''s. |

    | a (b+) | Matches ab, abb, abbb, ... — an plus one or more b''s. |

    | a (b?) | Matches either a or ab — an possibly followed by a b. |

    | a (b{3}) | Matches only abb. |

    | a (b{2,4}) | Matches abb, abbb, abbbb, ... — an followed by two to four b''s.
