  md: "# Example\n\n```\n<? \nprint(\"hello world!<BR\\n\");\n?>\n```\n\n# Related\
    \ Functions\n\necho, flush, printf\n\n# printf(string format, ...)\n\nThe printf\
    \ function converts and outputs arguments to the browser based on a format string.\
    \ The format string contains codes, listed in Figure 8–1, for different data types.\
    \ These codes begin with a percentage sign, %, and end with a letter that determines\
    \ the type of data. The codes match up with a list of values that follow the format\
    \ string in the argument list. Any text outside these codes will be sent unchanged\
    \ to the browser.\n\nFigure 8-1 Printf Type Specifiers\n\n| Type Specifier | Description\
    \ |\n| --- | --- |\n| d | Integer, decimal notation. |\n| o | Integer, octal notation.\
    \ |\n| x, X | Integer, hexadecimal notation. 'x' will use lowercase letters; 'X'\
    \ will use uppercase letters. |\n| b | Integer, binary notation. |\n| c | Character\
    \ specified by integer ASCII code. See Appendix B for a complete list of ASCII\
    \ codes. |\n| s | String. |\n| f | Double. |\n| e | Double, using scientific notation\
