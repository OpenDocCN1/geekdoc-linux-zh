  md: 'The first part of this book is a thorough discussion of PHP as a programming
    language. You will be introduced to common concepts of computer science and how
    they are implemented in PHP. No prior programming experience beyond simple mark-up
    languages is necessary. The focus of these chapters is on building a foundation
    of understanding rather than how to solve specific problems. If you have experience
    programming in a similar language, such as C or Perl, you may choose to read Chapter
    1 and skip the rest, saving it as a reference. In most situations PHP syntax works
    similarly to these two languages.


    Chapter 1 is an introduction to PHP, how it began, and what it looks like. It
    may be enough of an introduction PHP for experienced programmers since it moves
    quickly through key features of PHP. If you are less experienced, I encourage
    you to treat this chapter as a first look. Don''t worry much about exactly how
    the examples work. I explain the concepts in-depth in later chapters.


    Chapter 2 introduces the concepts of variables, operators, and expressions. These
    are building blocks of a PHP script. Essentially, a computer stores and manipulates
    data. Variables are how PHP allows you to name values, and expressions allow you
    to manipulate them. Chapter 3 examines the ways PHP allows you to control program
    execution. This includes conditional branches and loops. Chapter 4 deals with
    functions, how they are called, and how to define them. Functions are packages
    of code that you can call upon repeatedly. Chapter 5 is about arrays, collections
    of values that are identified either by numbers or names. Arrays are a very powerful
    way to store information and retrieve it efficiently. Chapter 6 is about classes,
    an object-oriented approach to grouping functions and data. Chapter 7 deals with
    how PHP sends and receives data.'
  merge: -1
