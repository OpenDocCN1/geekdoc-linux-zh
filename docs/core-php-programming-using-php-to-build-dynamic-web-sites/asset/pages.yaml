  md: '# # Chapter 7


    Ultimately a script must communicate with the outside world to be useful. We''ve
    seen PHP scripts that send text to the browser and get some information from functions
    like date. In this chapter we will examine all the ways a PHP script can exchange
    data. This includes local disk drives, databases and across the internet.


    PHP is similar to other programming environments with one notable exception: User
    input comes only from HTML forms. The fields in forms are turned into variables.
    You cannot stop your script in the middle and ask the user a question. This situation
    provides unique challenges.


    # ## Writing to the Browser


    Three functions in PHP will send text to the browser: echo, print, and printf.
    Each does the same thing: They take values and print them to the browser. The
    printf function allows you to specify a format of the output rather than sending
    values as-is. I used print so far in my examples, mostly out of habit. I don''t
    usually need the formatting that printf provides. Many older PHP examples you
    will find on the Web use echo because it existed in PHP2. I avoid its use because
    it behaves more like an operator than a function.'
