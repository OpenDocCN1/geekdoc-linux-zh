  md: '# Chapter 9 Data Functions


    | Code | Data Type | Description |

    | --- | --- | --- |

    | a | String | Repeat count is the number of characters to take from the string.
    If there are fewer characters in the string than specified by the repeat count,
    spaces are used to pad it out. |

    | A | String | Repeat count is the number of characters to take from the string.
    If there are fewer characters in the string than specified by the repeat count,
    nulls (ASCII 0) are used to pad it out. |

    | c | Integer | The integer will be converted to a signed character. |

    | C | Integer | The integer will be converted to an unsigned character. |

    | d | Double | The double will be stored in double-width floating-point format.
    Depending on your operating system, this is probably 8 bytes. |

    | f | Double | The double will be converted to a single-width floating-point format.
    Depending on your operating system, this is probably 4 bytes. |

    | h | String | The ASCII value of each argument will be saved as two characters
    representing the ASCII code in hexadecimal. |

    | I | Integer | The argument will be saved as an unsigned integer. Typically this
    is 4 bytes. |

    | I | Integer | The argument will be saved as a signed integer. Typically this
    is 4 bytes, with one bit used for sign. |

    | l | Integer | The argument is saved as an unsigned long, which is usually 8
    bytes. |

    | L | Integer | The argument is saved as a signed long, which is usually 8 bytes
    with one bit used for sign. |

    | n | Integer | The argument is saved as an unsigned short, which is 2 bytes.
    The value is saved in such a way that allows for safe unpacking on both little-endian
    and big-endian machines. |

    | N | Integer | The argument is saved as an unsigned long, which is 8 bytes. The
    value is saved in such a way that allows for safe unpacking on both little-endian
    and big-endian machines. |

    | s | Integer | The argument is saved as an unsigned short, which is usually 2
    bytes. |

    | S | Integer | The argument is saved as a signed short, which is usually 2 bytes
    with one bit used for sign. |

    | x | None | This format directive doesn''t match with an argument. It writes
    a null byte. |

    | X | None | This format directive causes the pointer to packed string back up
    1 byte. |

    | @ | None | This format directive moves the pointer to the absolute position
    specified by its repeat code. The empty space is padded with null bytes.


