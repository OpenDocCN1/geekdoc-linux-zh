    color. Colors are treated as three-dimensional coordinates, and closeness is defined
    by the distance between two points.


    # Example


    ```

    <?

    header("Content-type: image/gif");

    $image = imagecreatefromgif("tamil.gif");


    // find index of color closest to pure magenta

    $magentaIndex = imagecolorclosest($image, 255, 0, 255);


    // get RGB values

    $colorArray = imagecolorsforindex($image,

    $magentaIndex);


    // allocate closest color

    $colorMagenta = imagecolorallocate($image,

    $colorArray["red"],

    $colorArray["green"],

    $colorArray["blue\]);


    // draw a square

    imagefilledrectangle($image,

    10, 10, 50, $colorMagenta);


    // allocate real color

    $colorRealMagenta = imagecolorallocate($image,

    255, 0, 255);


    // draw a square

    imagefilledrectangle($image,

    30, 30, 70, 70, $colorRealMagenta);


    imagegif($image);

    ?>

    ```


