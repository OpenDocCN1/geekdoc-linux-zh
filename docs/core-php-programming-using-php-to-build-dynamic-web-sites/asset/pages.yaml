- img_proc: true
  md: '# # Chapter 20


    In this final chapter, I will touch upon some issues of efficiency and debugging.
    Sometimes it''s easy to get something working that could be faster or easier to
    maintain. In most cases it is best to spend this time-front. Going back to a finished
    project to attempt to speed it up is often an annoying task.


    Unfortunately, writing efficient code is more art than science. Certainly progress
    has been made in the form of programming methodologies such as object-oriented
    programming, but many tricks have to be learned along the way. I will attempt
    to share tips I''ve picked up that are specific to PHP.


    # ## When to Use Functions


    If you are coding in C, it is usually a good idea to turn repeating functionality
    into functions or macros. When the program is compiled, the optimizer will produce
    an executable that will eliminate all inefficiencies this may introduce. This
    is not true of PHP. Each call to a function is paid for in CPU time. You must
    take more time when deciding to put functionality into a function. Ultimately
    it may become a choice between readability and efficiency.'
  merge: -1
  pgno: 562
- img_proc: true
  md: "# Chapter 20 Efficiency and Debugging\n\nLike many other languages, PHP uses\
    \ stacks to store variables as it calls functions. Stacks, as the name implies,\
    \ are ordered lists of data elements. Each element must be pulled off the stack\
    \ one at a time, and the last element added must be removed first. Imagine each\
    \ data element as a marble. The marbles are dropped into a tube. When a function\
    \ is called, the first marble indicating from where the function was called is\
    \ dropped into the tube. Then one marble for each function parameter is dropped\
    \ into the tube. The tube is then handed to the function, which turns the tube\
    \ upside down to pull each marble out.\n\nThis manipulation of data takes time.\
    \ To illustrate, I created two scripts, Figure 20-1 and Figure 20-2. The first\
    \ script executes some code in a loop. The second calls as a function that executes\
    \ the same code. On my system the first script takes six seconds and the second\
    \ takes ten. That's a 66 percent addition in execution speed with no difference\
    \ in external functionality. If you run the scripts on a faster machine, you may\
    \ need to bump the number of iterations of the loops up to get meaningful results.\n\
    \nOf course, I am iterating through the loop 20,000 times. This is probably not\
    \ a realistic situation when it comes to a Web page. But it is realistic to expect\
    \ iterating 2,000 times through a loop with 10 simultaneous users requesting the\
    \ top-ten items in an online-store. If you could cut the time it takes to display\
    \ the page in half, taking the code out of the function is a small price to pay.\n\
    \n# Figure 20-1 Executing Code in a Loop\n\n```\n<$start = time();\n\nfor($index\
    \ = 0; $index < 20000; $index++) {\n    $value += (cos(time()%360));\n}\n\n$finish\
    \ = time();\n\nprint(\"Elapsed Time: \" . \n($finish - $start) . \" seconds<BR>\\\
    n\");\n?>\n```"
  merge: -1
