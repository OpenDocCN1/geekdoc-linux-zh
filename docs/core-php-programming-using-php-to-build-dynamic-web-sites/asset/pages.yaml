  md: '# Appendix D


    # PHP TAGS


    ![](img/490647a2fc8fbc7034b6e56593c58845_578_0.png)


    There are three ways to mark an area of PHP script in a Web page, displayed below.
    The results of the script, if any, will take the place in the final output. If
    a line break follows the closing tag, it will be removed. This helps you write
    more readable code.


    ```

    <?

    ?>


    <?php

    ?>

    ```


    ```

    <SCRIPT LANGUAGE="php">

    </SCRIPT>

    ```'
