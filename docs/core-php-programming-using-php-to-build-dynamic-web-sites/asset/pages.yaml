- img_proc: true
  md: '# Chapter 19 Design


    ply checks that the session is valid each time a page is requested. If the session
    is invalid, we may display an error message, send the user back to the login page,
    or just generate a new session identifier. The decision must be made within context.


    In a site that requires login, the session identifier will be associated with
    a user identifier, which would be the key to a table of user information. You
    may also keep track of the last time the session requested a page and have all
    those with no activity in a given period, perhaps 15 minutes, expire. This protects
    users who walk away from their desks.


    You may also choose to associate arbitrary variables with each session. This is
    relatively easy to implement with a relational database. Create a table where
    each row is uniquely identified by session identifier and variable name. Creating
    a variable is as easy as inserting a row into the table. You can fetch each variable
    with each request, or only fetch them as needed.


    # Cloaking


    When creating a plain HTML site you are faced with two paths: create a site that
    works great in only one browser, or create a mediocre site that works in all browsers.
    PHP allows you to create a site that works great in any browser. The HTTP_USER_AGENT
    variable contains the string most browsers send to the Web server to identify
    themselves. This variable may be used to choose between versions of content. This
    cloaks the inner workings of the site from the. A seamless experience is provided
    to visitors, despite browser capabilities.


    Chapter 15 contains an example of using regular expressions to parse HTTP_AGENT
    into understandable elements. In most cases browser name and version are sufficient,
    though operating system is also helpful. My experience is that there are subtle
    differences between identical versions of browsers running on Windows or the Macintosh.
    One design element I have cloaked in the past are JavaScript rollers. These are
    graphic buttons that change when the mouse is passed over them. For example, the
    label on the button may glow. This is accomplished in JavaScript by replacing
    the image. Unfortunately, this is not possible in older browsers. The code to
    accomplish this may be included only for browsers capable of executing it.


    Another cloak I used in the past involved graphic hard rules. An HTML trick is
    to create a single-pixel image and stretch it by setting the height and'
