  md: '# # Chapter 18


    By this time you have learned the basics of PHP. You have a reference for all
    the functions. And you''ve been introduced to some fundamental problems of programming.
    But all the examples I''ve shown have been pieces, snippets for the sake of illustration.
    This chapter will discuss how to integrate PHP into a Web site. It will help you
    decide whether to build a site completely with PHP, to sprinkle PHP throughout
    the site, or to simply create a few PHP-driven pages. I''ll also discuss issues
    involved in using PHP to generate HTML.


    # Sprinkling PHP within an HTML Document


    The first and most obvious approach to using PHP is to build HTML files as you
    have always done, inserting PHP tags as necessary. This could take the form of
    repeating HTML that you replace with a call to a PHP function. It could take the
    form of a large block of PHP code that generates database output. Or it could
    be a script that processes a form submission. These are all situations where the
    impact of PHP on the site is slight. This is a good first'
