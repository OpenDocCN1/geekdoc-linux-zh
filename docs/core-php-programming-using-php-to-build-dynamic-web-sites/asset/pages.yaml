  md: '# Chapter 8 I/O Functions


    You also have the option of placing characters between the % and the type specifier
    that control how data is formatted. Immediately following the % you may place
    any number of flags. These flags control padding and alignment. They are listed
    in Figure 8-2.


    After any flags, you may specify a minimum field length. The converted output
    will be printed in a field of at least this width, longer if necessary. If the
    output is shorter than the minimum width, it will be padded with a padding character.
    A space is used if none has been specified. The padding character will normally
    be placed to the left but will be placed to the right if the - flag is used.


    Next, you may specify a precision. It must start with a period to separate it
    from the minimum field length. For strings, the precision is taken to mean a maximum
    field length. For doubles, the precision is the number of digits that appear after
    the decimal point. Precision has no meaning for integers.


    # Example


    ```

    printf(\%-10s %5d %.5f <BR>\n",

    "a string", 10, 3.14);

    ```


    # Related Functions


    echo, flush, print


    Figure 8-2 Printf Flags


    | Flag | Description |

    |---|---|

    | - space | Align text to the left. Pad output with spaces. This is the default
    padding character. |

    | 0 | Pad output with zeros. |

    | any character | Pad output with any character. |'
