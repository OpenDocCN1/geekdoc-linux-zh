    used with the other font functions. The fonts are stored as bitmaps in a special
    format. The PHP distribution contains a Perl script for converting X11 .bdf files
    to PHP''s format.

    The code that loads fonts is architecture dependent. The chart in Figure 12–2
    shows the structure of a font file for 32-bit integers. Use this if you wish to
    create your own font files.


    Figure 12-2 PHP Font File Format


    | Position | Length | Description |

    | 0 | 4 | Number of characters in the font |

    | 4 | 4 | ASCII value of first character |

    | 8 | 4 | Width in pixels for each character |

    | 12 | 4 | Height in pixels for each character |

    | 16 | variable | Each pixel uses 1 byte, so this field should be the product
    of the number of characters, the width, and the height. |'
