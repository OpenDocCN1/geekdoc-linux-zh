- img_proc: true
  md: '# Chapter 20 Efficiency and Debugging


    you may have a hard time. You will have to examine the structure of each table
    to see the order of the columns. A better approach is to specify the columns you
    need, leaving out any you won''t use. This would transform the query into something
    like


    ```

    SELECT u.ID, u.Name, e.Name

    FROM user u, employ e

    WHERE u.ID = e.ID

    ```


    which specifies only three columns. You can be sure, regardless of the columns
    in the table, the user ID will be column zero.


    Another advantage of this is that since the resulting data have been narrowed
    to three columns, each fetch will be smaller. The savings go all the way back
    to the database because it will return only three pieces of data times the number
    of rows. None of the unused rows from the first version of the query will be sent
    through the network from the database server to PHP. In turn, PHP doesn''t need
    to put them into the array.


    # When to Store Content in a Database


    When I speak of content, I mean although static text, perhaps containing HTML.
    There is no rule saying that content should never be placed in a database, or
    it should always be put in a database. In the case of a bulletin board, it makes
    sense to put each message in a database. Messages are likely to be added continually.
    It is convenient to treat them as units, manipulating them by their creation dates
    or authors. At the other extreme, a copyright message that appears at the bottom
    of every page of a site is more suited to a text file that is retrieved with the
    require function.


    Somewhere between these two extremes is a break-even point. The reason is that
    databases provide a trade-off. They allow you to handle data in complex ways.
    They allow you to associate several pieces of information around a common identifier.
    And the cost is that to retrieve the data is slower than if you opened a file
    and read the contents.


    Many Web sites are nothing more than a handful of pages dressed up in a common
    graphic theme. A hundred files in a directory are easy to manage. You can name
    each one to describe their contents and refer to them in an URL such as'
  merge: -1
  pgno: 565
- img_proc: true
  md: '# In-line Debugging


    http://www.mysite.com/index.php?screen=about_us


    and still get the benefit of systematically generating the layout and navigation.
    Your PHP script can, perhaps use the value of the screen variable as the name
    of a local file, in a directory named screens. Developers can work on the page
    contents as they are accustomed to because they know the code is stored in a file
    named about_us in a directory screens.


    When the content grows to a thousand pages, keeping each in a separate file starts
    to become unmanageable. A relational database will help organize the content.
    It''s likely that with a site so large there will be many versions of the navigation.
    In a database it is easy to build a table that associates page content with navigation.
    You can also automate hyperlinks by creating one-way associations between pages.
    This would cause a link to automatically appear on a page.


    The biggest problem with this approach is the lack of good tools for editing the
    site. Developers are used to fetching files into an editor via FTP. Asking these
    people to start using a database shell is most likely out of the question Teaching
    SQL to anyone who might work on the site will eliminate any benefit gained when
    the content is put into the database. So, you are faced with creating your own
    tools to edit the content. The logical path is to create Web-based tools since
    coding a desktop application is a major project in itself, especially if Windows
    and Macintosh users are to be accommodated. As you might guess, Web-based site
    editors are less than ideal. however, with very large sites they become bearable
    because the alternative of managing such a large static is a greater evil, so
    to speak.


    # In-line Debugging


    There are times when code produces unexpected results. Examining the code reveals
    nothing. In this case the best thing to do is some in-line debugging. PHP scripts
    generate HTML to be interpreted by a browser, and HTML has a comment tag. Therefore,
    it is a simple matter to write PHP code that reports diagnostic information inside
    HTML comments.


    Often I create database queries dynamically, based on user input. A stray character
    or invalid input can cause the query to return an error. Sometimes I will print
    the query itself; also print the results of the error functions, such as mysql_error.
    The same applies to code uncurated to databases. Printing diagnostic information,
    even if it is as simple as saying "got here," can help.'
  merge: -1
  pgno: 566
- img_proc: true
  md: '# Remote Debugging


    PHP\u2019s support\u20\u2019s for remote debugging is incomplete, but as of version
    3.0.5 it is usable. You may enable it for all scripts by editing the configuration
    file php.ini, or you may use the debugger_on function, described in Chapter 8.
    Once enabled, PHP will attempt to connect to a remote host and port each time
    a script is run.


    You will need a port listening program to get the debugging information. There
    are numerous free port listeners for Windows. I''ve found Pat Lister by Hauke
    X to work well. Similar programs exist for UNIX as well.


    All debugging messages are sent to the listening host, regardless of the error
    reporting level set in php.ini. Message are sent in a special format


    date host (pid) type:message-data


    followed by a linefeed.

    The date is in the format YYYY-MM-DD. Time is in the format HH:MM:UUUUUU. The
    last six digits of time are seconds and microseconds. The host is name of server
    and pid is the process identifier. The type is a special code described in Figure
    20-3. The rest of the line is a message terminated with a linefeed.


    Using the remote debugger is as simple as executing a PHP script and watching
    the debug information appear in the port listener output.


    **Figure 20-3** Debugging Types


    | Type | Description |

    | --- | --- |

    | end | The end of an error message. |

    | frames | The number of frames in the call stack. |

    | function | The name of the function where the error occurred. |

    | location | The filename and line number that generated the error message. |

    | message | A PHP error message. |

    | start | This type signifies the beginning of a debugging message. The data-message
    for this line will be the type of error. |'
  merge: -1
