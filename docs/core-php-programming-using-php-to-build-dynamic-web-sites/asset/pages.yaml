  md: '# Chapter 14 Sorting, Searching, and Random Numbers


    described, along with the other sorting functions, in Chapter 9. It will be instructive
    to compare sort to rsort, asort, asort, and ksort.


    The sort function puts all the elements in the array in order from lowest to highest.
    If the array contains strings, this means ordering them by the ASCII codes of
    each character. If the array contains only numbers, then they are ordered by their
    values. The indices, the values used to reference the elements, are discarded
    and replaced with integers starting with zero. This is an important effect that
    Figure 14–3 demonstrates.


    Notice that point worth noting is although I use some numbers and a string to
    index the array, after I sort, all the elements are numbered zero through four.
    Keep this in mind if you ever need to clean up the indices of an array.


    Another point worth noting is the order of the output: Apple, Blueberry, Watermelon,
    apple, pear. A dictionary might list "apple" just before after "Apple," but the
    ASCII code for "A" is 65. The ASCII code for "a" is 97. Appendix B lists all the
    ASCII codes. If you want a case-insensitive sort, see the section on sorting using
    your own comparison function (page 440).


    The sort function works exactly like sort, except that it orders elements in the
    opposite direction. Try modifying the code in Figure 14–3 by changing sort to
    rsort.


    The other sort functions, asort and asort , work in a slightly different way.
    They preserve the relationship between the index and the element.


