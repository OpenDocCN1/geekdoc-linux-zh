    # Figure 18-7 Start of HTML Page


    The PHP code is considered to be a PHP file, regardless of the extension of the
    name. If PHP code appears in the included file, it is surrounded in <? and ?>
    tags. You may want to turn back to the functional reference to refresh yourself
    on the differences between include and require, but they aren''t particularly
    important to this discussion.


    Chunks of HTML must appear on every well-formed page. Additionally you may develop
    repeating elements such as a company logo. Rather than write them into every page,
    you may choose to put them into a file and dynamically include them. Figure 18-7
    contains HTML you might include at the top of every page on a site. Figure 18-8
    is two lines to close a page. Figure 18-10 wraps the content in Figure 18–9 with
    the opening and closing code to form a complete page.


    In this way, HTML and PHP are separated in modules. In this example I have hard-coded
    the inclusion of a two-line HTML file, but I could as easily include the code
    tables from Figure 18–2. The HTML in Figure 18–7 can be reused from page to page,
    and if I need to add something to every page on the site, I only need to edit
    that one file. I might want to add the PHP function from Figure 18–1. It will
    be available for use inside the code from Figure 18–9.


    It may occur that this approach is exhibiting another pattern. Every page on the
    site will simply become three calls to require. The first and last calls will
    always be the same. In fact every page on the site will simply vary by the name
    of the file included in the second require statement. This takes us beyond the
    issue of integrating HTML and PHP and into the structural design of a site. It
    is possible to create a site that has exactly one PHP script. This idea is developed
    in Chapter 19.


    # Figure 18-8 End of HTML Page


    ```

    </BODY>

    </html>

    ```'
