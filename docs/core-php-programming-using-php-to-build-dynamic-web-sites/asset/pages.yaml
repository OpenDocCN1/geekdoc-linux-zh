  md: '# # Chapter 11


    The functions in this section fall into three categories: time and date, alternative
    calendars, and configuration. The time and date functions are standard for any
    programming language. They allow you to get the current date in several formats.
    The calendar functions manipulate dates in various calendars. The configuration
    functions offer a way to change the configuration of PHP on a per script basis.


    # ## Time and Date


    All the time functions work off the UNIX epoch, which is January 1, 1970. Dates
    are expressed as seconds since the epoch. This makes it easy to refer to dates
    with integers. When a function calls for seconds since the epoch, I have referred
