  md: '# Preface


    My first inkling that I might like to write a book about PHP was born out of the
    frustration I felt with the existing PHP manual. It was a single, large HTML file
    with all the functions in alphabetical order. It was on a Web server thousands
    of miles away from me in Canada, so it was slow to show up in my browser, even
    across a T1 connection. It wasn''t long before it was saved on my desktop. After
    struggling for several months, it started to dawn on me that I could probably
    organize the information into a more usable format. Around that time the next
    version of PHP began to take shape, and it a new manual was developed. It was
    organized around PHP''s source code, but was less complete than the old PHP manual.
    I contributed descriptions for some of the missing functions, but I still had
    to write my own new manual. In the Spring of 1998, I was given the opportunity
    to do so by Prentice Hall. It is an honor for my book to be among classics such
    as The C Programming Language.


    This book assumes a certain familiarity with the Internet, the Web and HTML programming,
    but it will introduce you to concepts common to all programming languages and


    ¹Kernighan, Brian W., & Ritchie, Dennis M., The C Programming Language, Bell Telephone
    Laboratories, Incorporated, 1978.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Preface


    how they work in PHP. You can expect this book to teach you how to create rich,
    dynamic Websites. You can also expect it to remain on your desk as a reference
    for how PHP works, or even as a recipe book for solving common design problems.


    Every attempt has been made to provide real-world examples along with the explanation
    text. Nothing is more frustrating than trying to adapt some contrived academic
    problem to the Web site you must have working by the end of the week. Some of
    the example are based on code from live Web sites I have worked on in the past
    two years.


    The book is organized into four main sections: an introduction to programming
    problems; a reference for all the functions in PHP; a survey of common programming
    problems; and finally a guide for applying this knowledge to Web site development.
    The first section deals with the issues involved with any programming language:
    what a PHP script looks like; how to control execution; how to deal with data.
    The second section organizes the functions by what they do and gives an example
    of use. The third section deals with solving common programming problems such
    as sorting and generating graphics. The last section offers advice about how to
    create a whole Web site with PHP.'
  merge: -1
