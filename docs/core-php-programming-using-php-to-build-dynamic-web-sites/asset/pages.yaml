    \ the first.\n\n# # Recursion\n\nYour functions may make calls to other functions\
    \ and they may also make calls to themselves. The process of a function calling\
    \ itself is recursion. This circular definition usually leads to elegant algorithms.\
    \ The problem is broken down into a small task that is repeated many times.\n\n\
    Recursive definitions are common in mathematics. Consider this definition of an\
    \ integer: the sum or difference between one and any other integer with one being\
    \ an integer. Is three an integer? Yes, one plus one must be an integer, which\
    \ is two. And the sum of one and two must also be an integer.\n\nRecursion is\
    \ a difficult concept to understand, but it usually leads to clear code. Take\
    \ a look at Figure 4-6. The function checkInteger takes a number as input. We\
    \ know that the difference between an integer and one is an integer. So if the\
    \ function gets a number bigger than one, it simply checks the number minus. If\
    \ we start with a number less than zero, we multiply it by negative and check\
    \ it. Eventually we will reach one or a number between zero and one. The exception\
    \ is if we are passed zero, which is an integer."
