- img_proc: true
  md: '# # Chapter 17


    This chapter explores generating graphics using the GD extension functions described
    in Chapter 12. It is important to be aware of the issues involved with the creation
    of graphics on the fly. The first is that it is relatively costly in terms of
    CPU time. In most cases the flexibility of dynamic graphics is not worth what
    you pay in the load imposed on the server.


    Another issue is that making nice looking graphics from PHP functions is not easy.
    Common techniques like drop shadows are next to impossible. You will see in the
    examples that follow a lot of work goes into creating simple, flat charts.


    Lastly, while there is adequate support for text, functionality you''d expect
    in a word processor do not exist. Text does not wrap at line ends. There is no
    concept of letting, spacing, or descenders.


    Regardless, generating graphics makes sense in some situations. This chapter contains
    some real examples that you can start using with very little modification.'
  merge: -1
  pgno: 512
- img_proc: true
  md: '# Dynamic Buttons


    Images wrapped in anchor tags are a common navigational device. Instead of plain
    text, this method allows you to create buttons that are similar to those created
    in the operating system, or even fanciful icons. In most cases it is best to leave
    these as graphics created in your favorite graphics editor because the time between
    changes is relatively long. On the other hand, if you have a button that changes
    often, it may make sense to create it dynamically with PHP. The content of the
    button, the label, needs to be available as a string in PHP. It could be a statement
    setting the value of a variable. It could also be a value retrieved from a file
    or a database.


    An illustration will make this idea clear. Many corporate Web sites have a section
    for press releases. Instead of just a list of text links, your client wants a
    graphic of a flaming newspaper for each release, all under the title "Hot off
    the Press." Each burning daily has text over the top with the headline from the
    press release. With a small company that only one press release a month, you are
    better off creating these graphics by hand. With a company that releases a press
    each week, it starts to make sense to automate the process. You can put the press
    releases into a database and generate a graphic on the fly as users view the list
    of press releases. One advantage of this approach is if the CEO finds you''re
    putting flaming newspapers on the site, you can make a minor modification and
    the graphics become the company logo with the press title over it.


    Seriously, you must consider the trade-offs associated with dynamically created
    graphics. You don''t want to save yourself 15 minutes if it makes every press
    release download 30 seconds longer. If you''ve been working with the Web for any
    time at all, you know reuse graphics throughout the site because the browser caches
    them. The first page may take longer to load, but each successive page is faster
    because the graphics are already loaded in the browser. Dynamic graphics can be
    cached, of course, but the browser uses the URL to cache files. The GET-method
    form variables are part of the URL, so


    ```

    http://www.site.com/button.php3?label=home&from=1

    ```


    and


    ```

    http://www.site.com/button.php3?label=home&from=2

    ```'
  merge: -1
  pgno: 513
