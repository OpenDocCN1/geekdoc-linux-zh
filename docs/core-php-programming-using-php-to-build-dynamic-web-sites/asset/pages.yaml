    # Storing Content in a Database


    Information stored in a database is not limited to short strings, like the 32-character
    item name from Figure 16-4. You can create 64K blobs, which are enough to store
    a good-sized Web page. The advantage of this is that pages exist in a very structured
    environment. They can be identified by a number, and relationships can be drawn
    between them using only these numbers. The disadvantage is that since the information
    is now in a database, you can''t just load the file into your favorite editor.
    You have to balance the costs and benefits; most Web sites dont need every piece
    of content stored in a database.


    A situation where makes a lot of sense to put the content in a database is a Bulletin
    Board System, or BBS. The system stores messages, which are more than just Web
    pages. Each message has its own title, creation time, and author. This structure
    can be conveniently wrapped into a database table. Furthermore, since each message
    can be given a unique identifier, we can associate messages in a parent-child
    tree. A user can create a new thread of discussion that spawns many other messages.
    Messages can be displayed in this hierarchical structure to facilitate browsing.


    As with all database-related systems, the first step is to create a table. Figure
    16-7 creates a table for storing messages. Each message has a title, the name
    of the person who posted the message, when the message was posted, a parent message,
    and the body of text. The parent might be zero, in which'
