    The main loop of this script gets lines of text from the file stream and looks
    for HREF properties. If one is found in a line, it will be placed in the zero
    element of the match array. The script prints it and then removes it from the
    line using the ere_replace function. This function replaces text matched with
    a regular expression with a string. In this case the script replaces the HREF
    property with an empty string.

    The reason for finding the link and then removing it is that it is possible for
    two links to be on one line of HTML. The ere_replace function will match first
    string only. The solution is to find and remove each link until none remain. Notice
    that when removing the link a replace variable is prepared. Some links might contain
    a question mark, a valid character in a URL that separates a file from form variables.
    Since this character has special meaning to regular expressions, the script places
    a backslash before it let PHP know it''s to be taken literally.

    I use ere_replace to convert text for use in a new context. Since text inserted
    into a database is uniquely delimited by single quotes (''''), I replace all single
    quotes with a backslash and a single quote. Another use for ere_replace is replacement
    of end-of-line characters with break tags.


