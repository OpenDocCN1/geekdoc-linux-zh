  md: '# Appendix E


    # INSTALLING PHP


    PHP works well with both UNIX and Windows NT, though performance will be better
    with UNIX. In either case, you must have administrator privileges as I describe
    below. Since PHP works with most any Web server, I''ll pick two I like: Apache
    on UNIX and Xitami on Windows NT. PHP installs as a module to Apache, therefore
    performance is greatly enhanced. Other Web servers must use PHP as CGI. Regardless,
    I have successfully implemented PHP-powered sites on Windows NT and Microsoft
    Internet Explorer.


    # Installation on Apache for UNIX


    If you are using Linux, you can easily find an RPM for Apache 1.3 and PHP 3.0,
    but this installation may not include every PHP feature you want. I recommend
    this as a very quick start. You can always pursue compiling Apache and PHP from
    scratch. PHP will compile on most versions of UNIX, including Solaris. If you
    have ever compiled software you''ve found on the Net, you will have little trouble
    with this installation.


    The first step is to download the tar files and unpack them. The CDROM that accompanies
    this book has recent versions of both PHP and Apache, but'
  merge: -1
  pgno: 580
- img_proc: true
  md: '# Appendix E


    you may wish to check online for the newest versions, <http://www.php.net/> and
    <http://www.apache.org//>, respectively.


    After unpacking the tar file, the first step is to configure Apache. This is done
    by running the configure script inside the Apache directory:


    ```

    ./configure --prefix=/www

    ```


    The script will examine your system and prepare a make file for Apache. Next,
    configure and compile PHP:


    ```

    ./configure --with-apache=../apache_1.3.x --enable-track-vars

    make

    make install

    ```


    This is done within the PHP directory. The --enable-track-vars options are minimal.
    You might add --with-mysql if you have the MySQL database installed. The documentation
    that comes with the PHP source code explains all the options you can add to the
    configure command. Running make will create the PHP library, and make will prepare
    Apache for including the PHP module. Notice that the call to configure includes
    a path to your Apache source code directory.


    Next, you will need to re-configure Apache and run make. Return to the Apache
    source code directory and run configure again, this time with an option that tells
    Apache to include the PHP module:


    ```

    ./configure --prefix=/www --activate-module=src/modules/php3/libphp3.a

    make

    make install

    ```


    This will create a new make file and run it. The new httpd binary will be installed
    in the /www directory.


    PHP uses a file to supply additional configuration options php3.ini. This file
    should reside in /usr/local/lib, so copy it here:


    ```

    cp php3.ini /usr/local/lib/php3.ini

    ```


    It is likely you will need to edit this file, but if you do there are instructive
    comments inside.


    The last step is to associate a file extension with PHP. This is done by either
    the srm.conf or httpd.conf files. They can be found in Apache''s conf directory.
    Add the following line:


    ```

    AddType application/x-httpd-php3 .php3

    ```'
  merge: -1
  pgno: 581
- img_proc: true
  md: '# Appendix E


    This causes all files with the extension .php3 to be executed as PHP scripts.
    You may choose another, such as phtml. You may also wish to insert index.php3
    as a default document.


    When the Apache server is started, it will process PHP scripts. The documentation
    for Apache has hints for starting Apache automatically. If you have been running
    Apache previously, you will need to restart it, not just kill -HUP.


    # Installation on Xami for Windows NT


    The first step is to install PHP. You do not need to compile PHP for Windows.
    A binary distribution is available on the Web site. Download the zip file and
    expand it ever you wish. I put mine in C:\PHP3. Next, copy the file php3.ini-dist
    into your system root directory, which is probably C:\Wnt. Rename it php3.ini.
    When PHP is invoked, it looks for php3.ini in this directory. Edit it to change
    configuration parameters, including automatically loading extensions.


    The next step is to install Xitati, a great web server. It installs without trouble.
    And best of all, like PHP it free. Xitati is included on the CDROM that accompanies
    this book, but you may wish to check for a newer version on the Imatix web site
    http://www.imatix.com/. A familiar installation program is provided. If you use
    Windows NT, so choose the version of Xitati that runs as a service. This allows
    the Web server to start on its own without anyone logged into the machine.


    Run the installation program. The default values are usually good choices, but
    feel free to change them. The files are installed into C:\Xitati by default, but
    I put mine in G:\Program Files\Xitati. After the files are installed, start the
    Web server by clicking on the new icon in your Control Panel. Xitati runs without
    any configuration, but we will need to add support for PHP.


    Open a Web browser and go to the admin screen: <http://127.0.0.1/admin>. You will
    need to log in using the username and password you entered during installation.
    A menu is presented. Choose the first option, configuration, then click the filters
    link near the top of the screen. You can enter a number of extensions for files
    that will be filtered through the given executable. Enter php3 into the first
    box, and'
  merge: -1
  pgno: 582
- img_proc: true
  md: '# Appendix E


    C:\php3\php.exe into the box to its right. This causes files with the php3 extension
    to be run through PHP. Click the save icon.

    You will need to restart the Web server for the change to take effect. Before
    you do this, you may want to make one more change. The first page of the configuration
    screen allows you to define four default documents. If you make one index.php3,
    you can have a PHP script open by default when given just the directory in the
    URL.'
  merge: -1
