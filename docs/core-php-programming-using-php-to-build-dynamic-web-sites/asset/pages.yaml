- img_proc: true
  md: '# Writing Requirements Specifications


    Before you can design a system, it is important to understand what it''s supposed
    to do. Too often this comes in the form of a verbal request such as, ''we need
    a home page with a guestbook and visitor counter,'' which is never further defined.
    This usually leads to the building of a prototype that is 25 percent of what the
    client wants. Changes are made to the prototype, and the site is now 50 percent
    of what the client wants now. During the time the changes were made, the client
    has missed the target.


    The solution to this problem is to set a target and stick with it. This should
    start with a statement of the goals for the project. The most important question
    left unasked is why. When a client asks for Java banner to appear on their index
    page, it is often because of a desire to seem familiar with leading-edge technology.
    Instead of blindly fulfilling the client''s request, it is better to attempt to
    find the best solution for the why. A slick graphical design can speak much more
    about the client''s attention to details.


    Once you have asked why enough times, you should have a list of several goals
    for the project. These goals should suggest a set of requirements. If one of the
    goals of the system is to raise awareness of items in the client''s catalog. This
    may evolve into a requirement that products appear throughout the site on a rotational
    basis. This could be implemented as banners or kickers strategically placed within
    the site, but don''t tie yourself down with design issues. This earliest stage
    of site development should concentrate solely on the goals of the system.


    From a solid base of goals, you can begin to describe the requirements of the
    system. This usually takes the form of a requirements specification docu.


    Figure 19-1 Properties of Requirements Specifications


    +   * Only specifies external system behavior

    * Specifies constraints on the implementation

    * Allows easy modification

    * Serves as a reference tool for system maintainers

    * Records forethought about the lifecycle of the system

    * Characterizes acceptable responses to undesired events'
  merge: -1
  pgno: 551
- img_proc: true
  md: 'ment, a formal description of the black-box behavior expected from the site.
    The goals will suggest a collection of functional requirements and constraints
    on the design. As I have said, having a goal of increasing sales suggests, among
    other things, that the site should raise customer awareness of catalog items.
    Another requirement could be that the site provide some free service to visitors.
    An example is a loan company offering a mortgage calculator. It is a good idea
    to formally explore possible solutions to requirements, but it''s still important
    to keep design decisions out at this time.


    The requirements specification is formal and structured, but it should be understandable
    by nonexperts in the implementation technology. The description of the behavior
    of the system serves partially as a contract between the client and developer.
    So, clear statements will eliminate misunderstandings that will have a high cost
    later in development. That is not to say that when requirements in measurable
    terms. Constraining page size to 30K is an objective standard and easily tested
    is not easily measurable, but sometimes it''s all you have.


    Figure 19–1 lists things a requirements specification should aspire toward. It
    should only specify external behavior. Every requirement should be expressed as
    the answer to a what question. It should specify constraints. These are best expressed
    as quantities: How many hits per day? Maximum page size? Maximum page depth? It
    should allow you to change it. While you should use natural language, don''t write
    a long narrative. Sections of the document and use diagrams where necessary. It
    should be a document a future programmer can refer to learn about the system.
    Don''t be surprised if that programmer is six months later. The requirements should
    pay attention to the life of the system. In most cases it''s a bad thing when
