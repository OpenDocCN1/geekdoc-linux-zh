    # Oracle


    Oracle is one of the most popular relational databases in the world. It is an
    industrial-strength engine preferred by large corporations. A career can be made
    in support of Oracle databases. And the result is that Oracle is very expensive.
    You are not likely to download a trial version for experimentation. If you are
    lucky enough to land a project involving PHP and Oracle, you will find PHP''s
    native support to be satisfactory.


    One missing piece of functionality is for stored procedures. PHP is unable to
    read results returned by them. The workaround is to write your procedures so that
    they store their results in a temporary table.


    Oracle requires two environment variables to be set: ORACLE_HOME and ORACLE_SID.
    They are most likely not set for your Web server, so you must use the putenv function
    to do so. See any of the examples for how this is done.


    Lastly, Oracle support is something that needs to be compiled into PHP. Libraries
    that come with Oracle are needed and can''t be distributed. This means that if
    you are using a precompiled version of PHP, as is offered for Windows, you won''t
    have Oracle support.


