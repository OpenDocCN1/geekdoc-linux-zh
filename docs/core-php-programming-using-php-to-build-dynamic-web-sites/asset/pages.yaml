  md: '# echo string first, string second, ... string last


    The echo function sends any number of parameters, separated by commas, to the
    browser. Each will be converted to a string and printed with no space between
    them. Unlike most other PHP functions, the echo function does not require parentheses.
    In fact, echo is more of a statement than a function.


    # Example


    ```

    <? echo "First string", 2, 3.0, "last string"; ?>

    ```


    # Related Functions


    print, printf, flush


    # flush()


    As text is sent to the browser via functions like print and echo, it may be stored
    in a memory buffer and written out only when the buffer fills. The flush function
    attempts to force the buffer to be dumped to the browser immediately. Since the
    Web server ultimately controls communication with the browser, the flush may not
    be effective.


    # Example


    ```

    <? flush(); ?>

    ```


    # Related Functions


    echo, print, printf


    # print(string output)


    The output argument of print is sent to the browser.'
