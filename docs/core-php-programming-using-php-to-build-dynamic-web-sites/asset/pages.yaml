  md: "# Building HTML Tables from SQL Queries\n\nPerhaps the simplest task you can\
    \ perform with a database and PHP is to extract data from a table and build an\
    \ HTML table. The table could contain a catalog of items for sale, a list of projects,\
    \ or a list of Internet users and their ping times. For illustration purposes,\
    \ I'll use the first scenario. Imagine a supermarket wants to list the items they\
    \ have for sale on their Website. As a proof of concept, you must create a page\
    \ that lists some items from a database. We'll assume that you have set up a MySQL\
    \ database named store. The PHP script for viewing the catalog of products will\
    \ be built on the same machine as the database server.\n\nThe first step is to\
    \ create the table. Figure 16-1 displays some SQL code for creating a simple,\
    \ three-column table. The table is named catalog. It has a column called ID which\
    \ is an integer with at most 11 digits. It cannot be null and new rows will automatically\
    \ be assigned consecutive values. The last line of the definition specifies ID\
    \ as a primary key. This causes an index to be built on the column and disallows\
    \ duplicate IDs. The other two columns are Name and Price.\n\nName is a variable-length\
    \ character string that may be up to 32 characters long. Price is a floating-point\
    \ number with six digits before the decimal point and two digits after. That's\
    \ a perfect setup for money.\n\nNext, we will need to put some items in the table.\
    \ Since we're only creating a demo, we'll fill in some items we expect in a supermarket\
    \ with some dummy prices. To do this we use the INSERT statement. Figure 16-2\
    \ is an example of this procedure.\n\nEach statement ends with a semicolon, much\
    \ as in PHP. We're telling the MySQL server that we want to insert a row into\
    \ the catalog table, and we'll\n\nFigure 16-1 Creating Catalog Table\n\n```\n\
    CREATE TABLE catalog (\n  ID INT(11) NOT NULL AUTO_INCREMENT,\n  Name VARCHAR(32),\n\
    \  Price FLOAT(6,2),\n  PRIMARY KEY (ID)\n);\n```"
