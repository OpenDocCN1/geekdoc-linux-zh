  md: '# Generating Graphs on the Fly


    Perhaps a more likely use of dynamic graphics is in generating graphs. Since graphs
    rely on data, they lend themselves to very formula-driven creation. If the data
    change often, using PHP to generate the graphs is a good idea. In the following
    examples I''ve written the data into the script, but pulling from a database is
    not difficult. Sending from a form is probably not practical ideal for large amounts
    of data. The GET method imposes a relatively small limit on the total size of
    an URL that varies between Web servers. The two examples I''ll show are a bar
    graph and a pie chart. Each uses the same set of data, which is a fictional survey
    of favorite meat.


    # Bar Graphs


    Bar graphs are a good way to compare values to each other. Creating them is a
    relatively simple task because each data point is a rectangle. The height of the
    rectangle represents the value of the data point. To make the transition the scaling
    factor is used. In Figure 17–3 the graph is 200 pixels tall and the scaling factor
    is two. This means a data point with the value 75 will be 150 pixels tall.


    The business of creating the graph is similar to the process described above where
    a button is created. A blank image is created, several colors are allocated, and
    functions are called for drawing shapes into the image. The script allows the
    width of the bars to adapt to the width of the graph. The width of the graph is
    divided by the number of bars drawn. A ten-pixel gutter is drawn between the bars.
    In the center of the bar the data point''s label is written along its value.


    # Pie Charts


    Pie charts are a good way to see how a value represents a percentage of the whole.
    Each data point is a slice of a pie with a unique color. A legend associates the
    colors with each data point''s label and value.


    Since the pie chart is round, it represents a much more complex problem. PHP''s
    image functions allow you to draw an arc or a triangle, but not a pie slice. The
    solution is to draw the arc at the end of the slice, two lines that connect the
    center of the circle to the ends of the arc. These elements'
