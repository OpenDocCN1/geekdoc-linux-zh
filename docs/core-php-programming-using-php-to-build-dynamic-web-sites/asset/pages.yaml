  md: '# Element Name Description


    | Element | Name | Description |

    |---|---|---|

    | 0 | This is a number identifying the device of the filesystem. On Windows this
    number denotes the drive letter the file is on, with the A being zero. |

    | 1 | Inode | A unique identifier for the file, always zero on Windows. This is
    the same value you will get from the inode function. |

    | 2 | Mode | This is the same value you will get from fileperms, the read/write/execute
    permissions. |

    | 3 | Number of Links | Number of links to file. On Windows this will always be
    1 if the file is not on an NTFS partition. |

    | 4 | User | User ID of the owner, always zero on Windows. This is the same value
    you will get from the fileowner function. |

