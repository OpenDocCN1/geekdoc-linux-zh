  md: '# # Chapter 1


    This chapter will introduce you to PHP. You will learn how it came about, what
    it looks like and why it is the best server-side technology. You will also be
    exposed to the most important features of the PHP language.


    PHP began as a simple macro replacement tool. Like a nice pair of shoes, it put
    you where you needed to go, but you could go only so far. On the hyperspeed development
    track of the Internet, PHP has become the equivalent of a 1960s muscle car. It''s
    cheap, fast, and there is plenty of room under the hood for you and your virtual
    wrench.


    You probably don''t need convincing that it''s Internet, intranet, extranet, the
    Web is no longer about plain HTML files. Web pages are being replaced with Web
    applications. The issue many Web engineers face is choosing among hundreds of
    technologies.


    This chapter will let you poke the PHP engine, get your hands a little dirty,
    and take it for a spin. There are lots of small examples you can try immediately.
    As with all the examples in this book, I''ve tried to use examples that you can
    easily adapt to provide real solutions. Don''t be intimidated if you don''t fully
    understand the PHP code at first. Later chapters will deal with all the issues
    in detail.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Chapter I An Introduction to PHP


    # The Origins of PHP


    Wonderful things come from singular inspiration. PHP began life as a simple way
    to track visitors to Rasmus Lerd''s on-line resume. It also could embed SQL queries
    in Web pages. But as often happens on the Web, admirers quickly asked for their
    own copies. Being a proponent of the Internet''s ethic of sharing, not without
    mentioning a generally agreeable guy, Rasmus unleashed Personal Home Page Tools
    version 1.0 upon an unsuspecting Web.


    Unleased upon himself may be more accurate: PHP became popular consequence was
    a flood of suggestions. PHP 1.0 filtered input, replacing simple commands for
    HTML. As its popularity, people wondered if it couldn''t do more. Loops, conditionals,
    if the consequences of modern structured programming seemed like a next logical
    step. Rasmus studied language parsers, read about YACC and GNU Bison, and created
    PHP 2.0.


    PHP 2.0 allowed developers to embed structured code inside HTML tags. PHP scripts
    could parse data submitted by HTML forms, communicate with databases, and make
    complex calculations on the fly. And it was very fast because the freely available
    source code compiled into the Apache Web server. A PHP script executed as part
    of the Web server process and required no forking, often a criticism of Common
    Gateway Interface (CGI) scripts.


    PHP was a legitimate development solution and can be used for commercial web sites.
    In 1996 Clear Ink created the Supercuts site (www.supercuts.com) and used PHP
    to create a custom experience for the Web surface. By January of 1999 the PHP
    Web site reported almost 100,000 Web sites were using PHP.


    A community of developers grew up around PHP. Feature requests were balanced by
    bug fixes and enhancements. Zeev Suraski and Andi Gutmans made a significant contribution
    by writing a new parser. They observed that the parser in PHP 2.0 was the source
    of many problems. Rasmus decided to begin work on PHP 3.0 and called for developers
    to commit to its creation. Along with Zeev and Andi, others lent their support:
    Stig Bakken, Shane Caraveo, and Jim Winstead.


    After seven months of developments, PHP version 3.0 was released on June 6, 1998.'
  merge: -1
