    # LDAP


    LDAP is an acronym for Lightweight Directory Access Protocol. It is a universal
    method of storing directory information and is a partial implementation of the
    X.500 standard. LDAP was first described in RFC 1777 and RFC 1778.

    Through TCP/IP, clients can access a centralized address book containing contact
    information, public encryption keys, and similar information. Many servers are
    live on the Internet. Dante, a nonprofit organization, maintains a list of LDAP
    servers organized by country at <http://www.dante.net/up/pdi.html>.

    A full discussion on LDAP is beyond the scope of this book, but abundant information
    can be found on the Web. A good starting point is the University of Michigan at
    <http://www.umich.edu/~dirsvcs/ldap/index.html>.

    To enable the functions in this section, load the LDAP extension, "php3_ldap.dll"
    or "php3_ldap.so," depending on platform.


    ```

    boolean ldap_add(integer ldap_connection, string dn, array array)

    ```


    The ldap_add function adds entries to the specified DN. The argument is an array
    of the attribute values. If an attribute can have multiple values, the array element
    should be an array itself. See the attribute in the example below.'
