  md: '# Chapter 9 Data Functions


    # string crypt(string text, string salt)


    The crypt function encrypts a string using C''s crypt function, which uses standard
    DES encryption. The text argument will be encrypted and returned. The salt argument
    is optional, but if used must be two characters. It adds an extra element of complexity.
    You may wish to read the man page on crypt.


    Note that data encrypted with the crypt function cannot be decrypted. The function
    is usually used to encrypt a password that is saved for when authorization is
    necessary. At that time, the password is asked for, encrypted, and compared to
    the previously encrypted password.


    # Example


    ```

    <<?n$password = "secret";nprint(crypt($password));

    ?>

    ```


    # Related Functions


    encrypt


    # string decrypt(string data, integer method, string key)


    The decrypt function attempts to transform an encrypted string passed as the data
    argument into plain text using the method specified by the method argument and
    the key from the key argument. Each of the four methods uses a single key that
    both encrypts and decrypts. The methods are listed in Figure 9–1.


    Figure 9-1 Encryption Schemes


    | Method | Name | Minimum Data Length | Required Key Size |

    |---|---|---|--|

    | 0 | IDEA | 8 characters | 16 characters |

    | 1 | MDC | 8 characters | 16 characters |

    | 2 | DES | 32 characters | 16 characters |

    | 3 | XOR | 16 characters | 16 characters |'
