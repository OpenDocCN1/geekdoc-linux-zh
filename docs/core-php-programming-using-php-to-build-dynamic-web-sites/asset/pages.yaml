    The first step in communicating with a database server is to connect it. This
    is done with the mysql_connect function. It takes a hostname, username, and a
    password. Standard practice is to create a user named httpd with no password and
    restrict this user to the local server. If the connection is successful, a MySQL
    link identifier will be returned. I frequently leave out any check for this because
    either the system is configured correctly or not. Connections are intermittent.
    If your connection fails, the page will certainly return an error message when
    you try to execute a query with the identifier.


    The next step is to select a database. Here I''ve selected the database named
    store. Once we tell PHP which database to use, we get everything from the catalog
    table. This is done with the mysql_query function. It executes a query on the
    given link and returns a result identifier. We will use this identifier to fetch
    the results of the query.


    Before we begin pulling data from the results, we must begin building an HTML
    table. This is done, as you might expect, by using an opening table tag. I''ve
    created a header row with a gray background and the left of the table behavior
    as default.


    Now the fastest way to do this, executionwise, is to use mysql_fetch_row. This
    puts each column in the result set into an array. The columns are numbered starting
    with zero. When no more rows remain, false (0) will be returned. Capitalizing
    on this behavior, I put the row inside a while loop.


    For each row, I copy the three column values into variables that are readable.
    I then create a row in the HTML table, using these variables in the table cells.
    When no rows remain, I close the table. I don''t bother to close the connection
    to the database because PHP will do this automatically.'
