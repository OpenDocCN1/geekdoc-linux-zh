  md: '# Chapter 19 Design


    The last part of the requirements specification is a collection of design hints.
    This represents the requirements writer''s forethought about pitfalls for the
    designer. You might summarize a similar project. You might suggest a design approach.


    # Writing Design Documents


    Once you have created a requirements specification document, you will have to
    decide whether to write a design document. Often it is not necessary, especially
    when a few people are working on a small project. You may wish to choose key elements
    of a complete design document and develop them to the point of usefulness.


    The first part of design is concerned with the architecture of the system. The
    system should be broken into sections that encompass broad groups of functionality.
    A Web application for project management might break down into a module that handles
    project information, a module that handles users, and a module that handles timesheet
    entries. An informational Web site can have an "about us" section for informing
    visitors about the company itself, while a catalog area is a resource for learning
    about the items it sells.


    Depending on the type of site, you should choose some sort of diagram that shows
    the subsystems and how they relate to each other. These are entity relationship
    diagrams. I almost always create a page-flow diagram. Each node in the graph is
    a page as experienced by the user. Lines representing links connect the page to
    other pages on the site. Another diagram is one that shows the relationship between
    database tables. Nodes represent tables, and you may wish to list the fields inside
    boxes that stand for the tables. Lines connect tables and show how fields match.
    It is also helpful to indicate whether the relationship between the tables is
    one or to many.


    The next phase of design is interface specification. This defines how subsystems
    communicate. This can be as simple as listing the URLs for each page. If the site
    has forms, all the fields should be enumerated. If you are tracking user sessions,
    you will want to specify how you will be doing this, with cookies or form variables.
    Define acceptable values for the session identifier. The site will be communicating
    with files or a database, this phase will define names of files or login information
    for databases.'
  merge: -1
  pgno: 555
- img_proc: true
  md: '# Modularization Using include and require


    The last phase of design is a detailed description of how each module works. At
    this point it''s acceptable to specify exactly the method for implementing the
    module. For example, you may specify that a list of catalog items be presented
    using the UL tag. On the other hand, if it does matter, I suggest leaving it out.
    The person writing the actual code will probably have the best idea for solving
    the problem.


    For the rest of this chapter I''d like to present some design ideas you may choose
    to adopt. PHP''s dynamic nature allows for structural designs that can''t be achieved
    in plain HTML. It is a shame to waste this functionality using PHP as a faster
    alternative to CGI. I encourage you to consider using PHP as the engine that powers
    a completely dynamic Web site.


    # Modularization Using include and require


    Despite its name, the include function is not equivalent to C''s preprocessor
    command of the name. In many ways it is like a function call. Given the name of
    a file, PHP attempts to parse the file as if it it appeared in place of the call
    to include. The difference from a function is that the code will only be parsed
    if the include statement is executed. I often wrap calls to include in if statements
    to take advantage of this. This require function, on the other hand, will always
    include the specified file, even if it is inside an block that is never executed.
    It has been discussed several times on the PHP mailing list that require is faster
    than include because PHP is able to inject the specified file into the script
    during an early pass across the code. My rule of thumb is if you are including
    a file inside a control block (if, switch, while, for), then use include. Otherwise,
    use require.


    Almost anything you write in PHP is sprinkled with include and require. The first
    reason is that it makes the code more readable. The other reason is that it breaks
    the site into modules. This allows multiple people to work on the site at once.
    It forces you to write code that is more easily reused, within the existing site
    and on your next project. Most Web sites have consistent navigation is also a
    major problem when building and maintaining the site. Each page has to have a
    duplicate code block pasted into it. Making this a module and including it allows
    you to debug the code once. Taking this idea to the next'
  merge: -1
