  md: '# The include and require Functions


    available to the script. Exploring this array will reveal all the environment
    variables as well as a few other variables. Similar to GLOBALS are HTTP_GET_VARS,
    HTTP_POST_VARS, and HTTP_COOKIE_VARS. As their names suggest, these are associative
    arrays of the variables created from three methods the browser may use to send
    information to the server.


    # Cookies


    Cookies are small strings of data created by a Web server stored on the client.
    In addition to having names and values, cookies have an expiration time. Some
    are set to last for only a matter of minutes. Others persist for months. This
    allows sites to recognize you when you return without requiring a password. To
    learn more about cookies, you may wish to visit Netscape''s


    ```

    http://developer.netscape.com/docs/manuals/communicator/javascript4.htm

    ```


    Using cookies with PHP is almost as easy as using form fields. Any cookies passed
    from the browser to the server are automatically converted into variables. In
    addition cookies are stored in the HTTP_COOKIE_VARS array. Since form fields and
    cookies are all converted into variables, a configuration command inside php.ini
    controls the order.


    # The include and require Functions


    The difference is most dramatic inside a loop. Imagine you had three files you
    wanted to execute one after the other. You could put an include inside a for loop
    and if the files were named something like include1.php3, include2.php3, and include3.php3,
    you would have no problem. You could just build the name based on your counter
    variable.'
