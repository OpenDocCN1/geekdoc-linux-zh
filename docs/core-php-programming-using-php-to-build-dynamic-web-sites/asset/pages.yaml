  md: '# Defining Regular Expressions


    # Sample


    # Description


    | apple | Matches the word apple.

    | apple|ball | Matches either apple or ball.

    | begin|end|break | Matches either begin, end, or break. |


    # Figure 15-2 Branches in a Regular Expression


    Each branch contains one or more atoms. These atoms may be followed by characters
    that modify the number of times the atom may be matched in succession. An asterisk
    (*) means the atom can match any number of times. A plus sign (+) means the atom
    must match at least once. A question mark (?) signifies that the atom may match
    once or not at all.


    Alternatively, the atom may be bound, which means it is followed by curly braces,
    ({ and }),), which contain integers. If the curly braces contain a single number,
    the atom must be matched exactly that number of times. If the curly braces contain
    a number followed by a comma, the atom must be matched that number of times or
    more. If the curly braces contain two numbers separated by a comma, the atom must
    match at least the first number of times, but not more than the second number.
    See Figure 15–3 for some examples of repetition.


    An atom is a series of characters, some having special meaning, others simply
    standing for a character that must be matched. A period (.) matches any single
    character. A caret (^) matches the beginning of the string. A dollar sign ($)
    matches the end of the string. If you need to match one of special characters
    (^[]{}()*?), put a backslash in front of it. In fact, any char


