  md: '# Chapter 18 Integration with HTML


    # Using PHP to Output All HTML


    Any of the examples in the previous section are excellent first steps towards
    introducing PHP into a Web site. Their impact in terms of server load is relatively
    low. I would like to think of sites using similar approaches as PHP-enabled, as
    if they had a small injection of PHP that makes them extraordinary. The step beyond
    this is what I think of as PHP-powered: a site made completely of PHP. In this
    approach every byte of output comes from PHP. The print (echo or print) function
    is used to send HTML tags. Every page is a PHP script with a single pair of PHP
    tags.


    You might have noticed that most of the examples in this approach require extra
    time upfront, the code is much more maintainable. Once information is put in the
    context of the PHP variable, it''s easy to add something dynamic to it. It also
    has the advantage of ultimately being more readable as the page becomes complex.
    As a simple example, compare Figure 18–5 to Figure 18–6. The idea is to change
    the background color of the page depending on the time of day.


    My experience has been that having all the HTML inside the PHP script allows for
    very quick changes. I don''t have to search for the opening and closing tags buried
    inside the HTML as in Figure 18–5. It also allows me to break code up into separate
    lines in the source code that appear as a single line in


    Figure 18–5 Mixing PHP and HTML


    ```

    <HTML>

    <HEAD>

    <TITLE>Figure 18-5</TITLE>

    </HEAD>

    <?

    $Hour = date("H");

    $Intensity = round($Hour/24.0)*(0xFF);

    $PageColor = deche($Intensity) . deche($Intensity) . deche($Intensity);

    ?>

    <BODY BACKGROUND="#<?php print($PageColor);"?>

    <h1>Figure 18–5</h1>

    </BODY>

    </HTML>

    ```'
