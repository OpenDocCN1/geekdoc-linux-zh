    **Figure 1-1** Printing Today''s Date


    Whitespace, that is spaces, tabs and carriage returns, is ignored by PHP. Used
    judiciously, it can enhance the readability of your code. Figure 1–2 is functionally
    the same as the previous example, though it may be easier to notice contains PHP
    code.


    You may also notice that in Figure 1–2 there is a line of code that begins with
    a slash with an asterisk. This is a comment. Everything between the /* and the
    */ is equivalent to whitespace. Comments can be used to document how your code
    works for all simple scripts. Even if you maintain your own code you will find
    comments necessary for all simple scripts.


    In addition to the opening and closing comment statements, PHP also provides two
    ways to build a single-line comment. Double-slashes or a pound sign will cause
    everything after them to the end of the line to be ignored by the parser.


    After skipping over the whitespace and comment in Figure 1–2, the PHP parser encounters
    the first word: print. This is one of PHP''s commands. The rest of the line will
    be evaluated and if it produces output, print will pass it along to the browser.


    Where does the line end? PHP uses a semicolon to denote the end of a line. This
    is in contrast to BASIC and JavaScript which understand a line break to be the
    end of a line. PHP takes inspiration from C on this issue.'
