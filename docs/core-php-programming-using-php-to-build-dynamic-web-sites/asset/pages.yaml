  md: 'the chapters in this section of the book, Chapters 8 through 13, are a functional
    reference. They describe how each PHP function works: what arguments are expected,
    what value is returned, how they ought be used. The functions are grouped generally
    by what they do.


    Chapter 8 is concerned with I/O, input and output. This means functions that send
    and receive information to the browser, and functions that read and write to the
    file system or the network. Chapter 9 is all about manipulating data. There are
    functions for handling arrays, functions for searching for information strings,
    and functions for encoding and decoding information. Chapter 10 is concerned with
    mathematics. Aside from the mathematical functions you expect, PHP offers some
    unique features for handling arbitrarily or small numbers. Chapter 11 is a bit
    of a catch-all chapter that deals with time-related functions and functions that
    affect the configuration of PHP. There are functions for normal dates and times,
    but there are also functions for changing the operation of PHP itself. Chapter
    12 is a short but important chapter on graphics functions. The GD library allows
    you to create and manipulate GIF images on the fly. Chapter 13 is a long chapter
    about the different database and datelike functions. If there is one great achievement
    of PHP, it is certainly support for many databases such as Oracle and Sybase,
    as well as support for free technologies like MySQL. This chapter also describes
    functions for communicating with LDAP and IMAP servers.


    Throughout this section I''ve used a standard format for showing how a function
    works. The form I''ve chosen is compact yet still clear. Each description begins
    with a prototype for the function. This tells you what type of data the function
    returns and what type of data is expected to be passed. When a function returns
    nothing, it will not be preceded by a datatype. Likewise, if a function takes
    no arguments, the parentheses will be empty. Although "boolean" is not a PHP datatype,
    I use it instead of integer to let you know that the function returns true (1)
    or false (0). Unless noted, a return value means the function succeeded.


    Following the prototype is a description of the function. If arguments are optional,
    it''s noted. It will be noted here.


    The example gives you an idea of how the function might work in a real script.
    In many cases I come up with pieces of code that could be dropped into your own
    script. Occasionally I''ll point you to another example in the same section where
    I''ve grouped several functions in one clear example. Most of the database functions,
    for example, make little sense out of the context of a complete script.


    Finally, I provide a list of related functions. Usually these are functions that
    operate similarly, or complement the function being described.


    ![](img/490647a2fc8fbc7034b6e56593c58845_108_0.png)'
