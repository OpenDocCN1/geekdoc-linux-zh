  md: '# Acknowledgments


    I would like to thank those who helped me make this book possible. Certainly,
    I wouldn''t have begun without Micah Brown, who put me together with Prentice-Hall.
    Micah was an excellent technical editor, too. I''d also like to thank Vicky, my
    wife, for being a top-notch technical editor. But also for putting up with me
    spending all my free time writing this book for months.


    It has been a pleasure working with Mark Taub, Vincent Janoski, and the rest of
    the Prentice-Hall team. They have always been professional and patient with me.


    I must also express my gratitude to Rasmus Lerdorf, Zeev Suraski, Andi Gutmans,
    Shane Caraveo, Jim Winstead, and all the others who created PHP. I also owe a
    debt of thanks to David Sklar and Boaz Yahav who allowed me to include snapshots
    of their sites on the CIDROM.


    A tip of my hat to my colleagues at Clear Ink, particularly David Burk, who gave
    me some valuable business advice early on. Before coming to Clear Ink I had never
    heard of PHP, but quickly was given the opportunity to learn it.


    And finally I''d like to acknowledge the support I received from my wife, my parents
    and my grandmother over the past year. I literally couldn''t have done it without
    them.'
