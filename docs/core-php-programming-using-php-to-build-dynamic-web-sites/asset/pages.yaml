    # integer odbc_prepare(integer connection,

    string query)


    The odbc_prepare function parses a query and prepares it for execution. A result
    identifier that may be passed to odbc_execute is returned. Preparing statements
    can be more efficient than making the direct repair prepare statements. This is
    usually the case where you have many rows to insert into the same table. To specify
    a value to be filled in later, use a question mark.


    # Example


    ```

    ?

    // connect to database

    $connection = odbc_connect("store", "guest", "guest");


    // prepare query

    $query = "INSERT INTO catalog (ID, Name, Price) ";

    $query = "VALUES(?, ?, ?) ";

    $result = odbc_prepare($connection, $query);


    // insert

    // 0, 1998 Calendar, 20.00

    // 1, 1999 Calendar, 20.50

    // 2, 2000 Calendar, 21.00

    for($index = 1998; $index <= 2000; $index++) {

    n$values[0] = $index-1998;

    $values[1] = "$index Calendar";

    $values[2] = 20.00 + (0.50 * ($index-1998));


    odbc_execute($result, $values);

    }

    \odbc_close($connection);

    ?

    ```


