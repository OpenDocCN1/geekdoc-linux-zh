    \ You might want to turn back to Chapter 4, specifically the section on recursion.\
    \ The showMessages function uses re-cursion to travel to every branch of the tree\
    \ of messages. It starts by getting a list of all messages that have no parent.\
    \ These are the root-level messages, or beginnings of threads. After showing a\
    \ root-level message, showMessages is called for the thread. This process continues\
    \ until a message is found with no children. Unordered list tags are used to display\
    \ the user in understanding the hierarchy.\nIf a message title is clicked on,\
    \ the page is reloaded which causes the script to switch over to the mode where\
    \ a message is displayed. The fields of the message are displayed in a table.\
    \ This contains any HTML, it will be rendered by the browser because no attempt\
    \ is made to filter it out. This restriction is best applied as part of the code\
