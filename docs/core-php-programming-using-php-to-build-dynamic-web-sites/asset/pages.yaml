    # IMAP


    IMAP is the Internet Message Access Protocol. It was developed in 1986 at Stanford
    University; however, it has been overshadowed by less sophisticated mail protocols,
    as the POP (Post Office Protocol). IMAP allows the user to manipulate mail on
    the server as if it existed locally.


    PHP implements IMAP 4, the latest incarnation described in RFC 1730. More information
    may be obtained at http://www.imap.org/, the IMAP Connection.


    The IMAP extension ("php3_imap4r2.dll" or "php3_imap4r2.so") was being vigorously
    developed at the time of this writing. Doubtlessly, there are new IMAP functions
    that couldn''t make it into the book, as well as the inevitable function changes.
    Check the on-line documentation.'
