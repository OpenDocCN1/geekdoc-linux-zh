- img_proc: true
  md: '# Sorting 433


    The outermost for loop sets the limit for how far to allow bubbles to rise. The
    first time through, this is one because the first element of the array is indexed
    by zero. After going through the inner loop once, we will be certain that the
    smallest number will be in the first position of the array. This is because the
    inner loop will compare the last element to that last element, swap them if they
    are out of order, and then move up a notch. Eventually the smallest element will
    be reached and swapped upward.


    If n is the number of elements in the array, the bubble sort will always make
    (n-1) comparisons, then (n-2) and so on. In Figure 14-1, this means 7 elements
    require 21 comparisons (6+5+4+3+2+1) in the first iteration. This is regardless
    of whether the array is in order or out of order. If the array is already in order,
    no exchanges will be made. If it is in reverse order, an exchange will be made
    for every comparison.


    It''s easy to see that the bubble sort is very inefficient, but if you run the
    example in Figure 14-1, you probably didn''t get the impression it was. For tiny
    lists of fewer than a hundred elements, the bubble sort is slow. If you have to
    code your own sort, the bubble sort has the advantage of being easy to remember
    and simple enough to get right the first time.


    # Quicksort


    Invented by Professor C.A.R. Hoare in 1961, quicksort is proven to be the best
    general-purpose sorting algorithm. Many computer languages offer a library version,
    and PHP uses it for its built-in sorting functions. It is based on the same idea
    of exchanging elements, but adds the concept of partitioning. In most implementations
    it relies on recursion, a topic discussed in Chapter 4.


    The quicksort algorithm chooses a pivot element and divides all elements by whether
    they are greater or less than the pivot. Each subsection is further divided similarly.
    When the granularity becomes small enough, elements are compared and possibly
    swapped, as in the bubble sort.


    When we first call the quicksort function in Figure 14-2, we first pass and last
    elements of the array as the left and right limits. This will cause the array
    to be sorted. For the best performance, the median of all the numbers would be
    best. This would divide the array exactly in two. To find the median, however,
    takes work. Rather than add this overhead, I''ve chosen to pick the number in
    the middle.


    The next step is to divide the list into two halves. Starting from the outside,
    elements are checked for being greater than or less than the pivot.'
