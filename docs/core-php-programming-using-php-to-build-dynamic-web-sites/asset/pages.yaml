  md: '# Chapter 6 Classes


    useful for initializing properties. Unlike other languages, PHP does not allow
    for destructors, functions that execute when the instance is deleted.


    # Accessing Properties


    The properties of an instance are variables, just like any other PHP variable.
    To refer to them, however, you must use the -> operator. You do not use a dollar
    sign in front of the property name. For example, refer to Figure 6–2. The last
    two lines of the script print the name property.


    Unlike object-oriented languages, such as C++, properties of PHP classes are not
    private. Any code may reach into the instance and change or read the values of
    properties.


    # Using Methods


    Accessing methods is similar to accessing properties. The -> operator is used
    to point to the instance''s method. This is show in Figure 6–2 in the calls to
    init and getLastLogin. The methods behave exactly as functions defined outside
    classes.


    Functions defined inside classes have a variable automatically defined for them
    called this. The variable refers to the instance itself and allows methods to
    refer to properties of the instance. Notice that in Figure 6–2 the init function
    uses this to put values into the three properties.


    # Arrays of Objects


    Since instances are variables, you can put them into arrays. However, classes
    are a very new feature of PHP and all wrinkles are not iron out. While you can
    put instances into arrays, you can''t refer to methods and properties directly
    from the array. For example, writing


    ```

    $someArray[17]->someMethod();

    ```'
