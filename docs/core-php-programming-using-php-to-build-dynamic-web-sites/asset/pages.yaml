  md: 'Software engineering is more than just programming. In the same way a civil
    engineer carefully designs and builds a skyscraper, a software engineer carefully
    designs and implements software systems. Even small PHP scripts may benefit from
    software engineering concepts. This sections explores the issues involved with
    using PHP in a Web site.


    Chapter 18 is about integrating PHP and HTML. You can choose to use PHP in key
    places or you may choose to generate every page of a site using PHP. This chapter
    helps you decide.


    Chapter 19 discusses design. An approach for designing a system with PHP is developed,
    including a phase of careful requirements analysis. This chapter also discusses
    pitfalls of implementing forms for gathering user input.


    Chapter 20 touches on issues of efficiency and debugging. Information is provided
    to help you decide when to use functions, among other programming practices. A
    description of remote debugging is also discussed.'
