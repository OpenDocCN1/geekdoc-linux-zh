    # Creating GIFs


    All the functions in this section require the GD extension. Either load it automatically
    by editing php3.ini, or use the dl function. These functions manipulate GIFs,
    the image format most popular on the Web.


    To get started you can use imagecreate to start with a blank graphic, or imagegif
    to load a GIF. Coordinates in these functions treat (0,0) to be the top-left corner
    and refer to pixels. Likewise, any size arguments refer to pixels.


    When creating images with these functions, you can''t simply decide to output
    an image in the middle of a script that outputs HTML. A separate script that sends
    a content-type header is referred to by an IMG tag. All the examples illustrate
    this idea.


    For functions that use fonts, there are five built-in fonts numbered 1, 2, 3,
    4, and 5. You may also load fonts, which will always have identifiers greater
    than five.'
