    # DBM


    The functions in this section allow manipulation of DBM-style databases. Rather
    storing complex records, a DBM database simply stores key/value pairs. This is
    similar to an associative array.

    How DBM files are implemented by operating system and what package was used when
    PHP was compiled. Some libraries create two files per database, some only one.
    The dblist function, described in Chapter 8, returns a string describing the DBM
    library being used. Further information may be found on your system''s man pages.

    PHP performs file locking by creating .lock files. These files are never deleted.
    They are used to block other processes from accessing DBM files while your script
    has the database open. You may wish to delete them yourself.

    To enable the DBM functions, load the DBM extension, "php3_dbm.dll" or "php3_dbm.so,"
    depending on platform.


