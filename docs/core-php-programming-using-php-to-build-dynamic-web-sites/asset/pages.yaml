    # integer dbmopen(string filename, string mode)


    The dbmopen function opens a DBM database. The filename argument is a full path
    to a DBM file, excluding the file extension. Some implementations of DBM use .db
    to denote a DBM file; others use .pag and .dir extensions.

    The mode argument is a string with a single character whose meaning is listed
    in Figure 13–2. A database identifier is returned that may be used in the other
    DBM functions. While a database is open, your script has exclusive use of the
    database. Use dbclose to allow other processes to access the database.


    # Example


    ```

    <?php

    // create a new database

    $db = dbmopen("inventory", "n");


    // add an item key:1 value:Hammer

    dbminsert($db, "1", "Hammer");

    ```


    Figure 13-2 DBM Open Modes


    | Mode | Description |

    |---|---|

    | r | Read |

    | n | Create new file, allow writing |

    | w | Append to existing file |'
