  md: '# # Chapter 15


    Parsing is the act of breaking a whole into components, usually a sentence into
    words. PHP must parse the code you write as a first step in turning a script into
    an HTML document. There will come a time when you are faced with extracting or
    verifying data collected in a string. This could be as simple as a tab-delimited
    list. It could be as complicated as the string a browser uses to identify itself
    to a Web server. You may choose to tokenize the string, breaking it into pieces.
    Or you may choose to apply a regular expression. This chapter introduces PHP''s
    functions for parsing.


    # ## Tokenizing


    PHP allows for a simple model for tokenizing a string. Certain characters, of
    your choice, are considered separators. Characters between separators are considered
    tokens. You may change the set of separators with each token pull from a string,
    which is handy for irregular strings, that is, ones that aren''t simply comma-separated
    lists.


    Figure 15-1 accepts a sentence and breaks it into words using the strtok function,
    described in Chapter 9. As far as the script is concerned, a word is'
