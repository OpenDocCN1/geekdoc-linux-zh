  md: '# Chapter 6


    Object-oriented programming was devised as a solution to problems associated with
    large software projects where many programmers work on a single system. When source
    code grows to be tens of thousands of lines of code or more, each change can cause
    unexpected side effects. Traditionally procedural languages have fallen short
    of the goal of encapsulating data and functionality sufficiently.


    PHP borrows from C++ and offers the concept of classes, objects that contain functions
    and variables under a single identifier. While it is unlikely that a PHP script
    of 100,000 lines will ever be written, classes do offer benefits. Building your
    scripts with classes will certainly aid you in writing code that can be reused.
    This is a good idea, especially if you wish to share your code.


    # Defining a Class


