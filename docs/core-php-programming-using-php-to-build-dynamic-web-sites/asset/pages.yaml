- img_proc: true
  md: '# What Makes PHP Better than Its Alternatives


    The skeptics are asking themselves, “why should I learn PHP?” The days of static
    Web sites built with HTML files and a few CGI scripts are over. Today’s sites
    must be dynamic. All the stale brochures littering the streets of the Internet
    will transform into 24-hour virtual storefronts or be swept away. The toughest
    decision facing the creator of a Web application is choosing from hundreds of
    technologies.


    Perl has adapted well to be a CGI solution and it has been used to drive complex
    Web technology like CyberCash and Excuse EWS search engine. Microsoft provides
    its Active Server Pages with Internet Server. Middleware like Allaire’s Cold Fusion
    is yet another solution. Watchcom lists hundreds of Web technologies, costing
    tens of thousands of dollars. Why would you choose PHP over any of these alternatives?


    The short answer is that PHP is better. It is faster to code and to execute. The
    same PHP code unaltered on different Web server and operating systems. Functionality
    that is standard with PHP is an add-on in other environments. A more detailed
    argument follows.


    PHP is free. Anyone may visit the PHP Web site and download the complete source
    code. Binaries are also available for Windows. The result is easy entry into the
    experience. There is very little risk in trying PHP, and its license allows the
    code to be used to develop works with no royalties. This is unlike products like
    Allaire’s Cold Fusion or Ever’s Tango Enterprise which costs thousands of dollars
    for the software to interpret and serve scripts. Even commercial giants like Netscape
    recognize the advantages of making source code available.


    PHP runs on UNIX, Windows 98, Windows NT and the Macintosh. PHP is designed to
    integrate with the Apache Web Server. Apache, another free technology, is the
    most popular Web server on the Internet and connects with source code for UNIX
    and Windows. Commercial flavors of Apache like WebTen and Stronghold support PHP
    too. But PHP works equally well with other Web servers, including Microsoft’s
    Internet Information Server. Scripts may be moved between server platforms without
    alteration. PHP 3.1 is expected to support ISAPI and NSAPI to allow for the performance
    benefits of tightly coupling with the Microsoft and Netscape Web servers.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter I An Introduction to PHP


    PHP is modifiable. PHP has been designed to allow for future extension of functionality.
    PHP is coded in C and provides a well-defined Application Programming Interface
    (API). Capable programmers may add new functionality easily. The right set of
    functions available in PHP are evidence they often do.


    PHP was written for Web page creation. Perl, C and Java are very good general
    languages and are certainly capable of driving Web applications. The unfortunate
    sacrifice these alternatives make is the ease of communication with the Web experience.
    PHP applications may be rapidly and developed because the code is encapsulated
    in the Web pages themselves.


    Support for PHP is free and readily available. Queries to the PHP mailing list
    are often answered within hours. A custom bug-tracking system on the PHP site
    solves each problem along with its resolution.


    PHP is popular. Internet service providers find PHP to be an attractive way to
    code Web applications without the risks exposed by CGIs. Developers worldwide
    offer PHP programming. Sites coded in PHP will have the option of moving from
    one to another as well as a choice of developers to add functionality.


    Programming skills developed in other structured languages can be applied to PHP.
    PHP takes inspiration from both Perl and C. Experienced Perl and C programmers
    learn PHP very quickly. Likewise, programmers who learn PHP as a first language
    may apply their knowledge toward not only Perl and C, but other C-like languages
    such as Java. This is very different from the programmer who learns to code in
    a visual editor such as Tango Enterprise or Microsoft Visual InterDev.


    # How PHP Works with the Web Server


    The normal process a Web server goes through to deliver a page to a browser is
    as follows. It begins when a browser makes a request for a Web page. Based on
    the URL the browser resolves the address of the Web server, identifies the page
    it would like, and gives any other information that Web server may need. Some
    of this information is about the browser itself, like its name (Mozilla), its
    version (4.05), or the operating system (Windows 95). Other information given
    the Web server could be the text user typed into form fields. If the request is
    for an HTML file, the Web server will simply find the file, tell the browser to
    expect some HTML text, and then send the contents'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# How to Get Started


    of the file. The browser gets the contents and begins rendering the page based
    on the HTML code. If you have been programming HTML for any amount of time, this
    will be clear to you.


    Hopefully you have also some experience with CGI scripts. When a Web server gets
    a request for a CGI, it cannot just send the contents of the file. It must execute
    the first script. The script will generate some HTML code which then sends to
    the browser. As far as the browser is concerned, it''s just getting HTML. The
    Web server gets a bunch of work that it gets very little recognition for, but
    Web servers rarely get the respect they deserve. The medium is definitely not
    the message.


    When a PHP page is requested, it is processed exactly like a CGI, at least the
    extent that the script is not simply sent to the browser. It is first passed through
    the PHP engine which gives the Web server HTML text.


    # How to Get Started


    Learning a new programming language is rarely a matter of reading straight through
    a text and immediately putting that knowledge to use. Reading and thinking are
    just the beginning. Usually the best approach is to try code verbatim. If that
    works, change something and see if it breaks. Programmers affectionately call
    this hacking.


    However, you will want to have an environment to safely hack in. You may be lucky
    enough to be renting space on many Web hosts that offer PHP. If that is the case,
    you only need to find out what file extension they have chosen for PHP, usually
    .php, and upload some scripts. Web servers usually decide how to process files
    by their names, particularly by their dot extensions.


    If you need to set up your own environment, you will have several options. The
    first choice is whether you will be using Apache or another Web server. PHP may
    plug into Apache as a module. This allows PHP to run much faster because a new
    process is created for every PHP page served. If you won''t be using Apache, then
    PHP will exist as a separate executable that processes scripts and passes them
    to the Web server.


    At the time of this writing Apache is the most popular Web server on the Internet.
    About 50 percent of all Web servers are running the Web server created by individuals
    donating their time and making its source code freely available. Anyone capable
    of compiling and installing Apache should have lit-'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Chapter I An Introduction to PHP


    the trouble with installing PHP. The installation instructions found on the PHP
    Web site, www.php.net, are the best place to start.


    When Shane Caraveo joined the PHP3 project, he brought PHP to Windows. PHP works
    as a script engine with Microsoft Internet Information Server, which is underway
    to make it an ISAPI dynamic link library. This makes it roughly equivalent to
    an Apache module. However, my experience is that PHP works great with Imatik''s
    Xitami Web server. A version of this Web server is included on the CD-ROM.


    Every Web server handles CGI functionality differently. If you have difficulty
    getting PHP to communicate with your Web server, the PHP3 mailing list is a good
    place to ask questions. You subscribe to the list by sending mail to php3-subscribe@lists.php.net.
    You can also look through the archive of previous messages by visiting http://www.tryc.on.ca/php3.html.


    # What a PHP Script Looks Like


    PHP exists as a tag inside an HTML file. Like all HTML tags, it begins with a
    less symbol, or opening angle bracket (<), and ends with a greater symbol, or
    closing angle bracket (>). To distinguish from other tags, the PHP has a question
    mark (?) following the opening angle bracket and preceding the closing angle bracket.
    Text inside the PHP tag is expected to be PHP code and is parsed.


    To accommodate XML and some picky editors like Microsoft''s Front Page, PHP offers
    two other ways to mark code. Putting "php" after the opening question mark makes
    PHP friendly to XML parsers. Alternatively, you may use a script tag as if you
    were writing JavaScript. You can refer to Appendix F to see how these alternatives
    work. Use the simple <??> method for all my examples.


    Since PHP exists inside an HTML file, like HTML it is written completely with
    ASCII text. If you code on a Macintosh, you may use Simple<?text>, or you may
    prefer to use BEdit. If UNIX is more your style, you may use vi or emacs. Windows
    users use Notepad. I prefer UltraEdit 6.0, but the point is you can use any editor
    that creates plain text.


    Figure 1–1 shows an ordinary HTML page with one remarkable difference: the PHP
    code between the <?php and the ?> tags. When this page is passed through the PHP
    module, it will replace the PHP code with today''s date. It might read something
    like, "Friday May 1, 1999."'
  merge: -1
  pgno: 31
