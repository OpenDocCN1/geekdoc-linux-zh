  md: '# Chapter 15 Parsing and String Evaluation


    surrounded by a space or either end of the sentence. This leaves commas and other
    punctuation as part of the word.


    It might occur to you that adding a comma to the list of separators would strip
    them out. This is true, but it introduces a side effect. The first time comma
    is followed by a space, an empty token will be returned. An empty string is considered
    to be false. You may recall, this causes the end of the for loop.


    The strtok function is useful only in the most simple and structured situations.
    An example might be reading a tab-delimited text file. The algorithm might be
    to read a line from a file, pulling each token from the line using the tab character,
    then continuing by getting the next line from the file.


    # Regular Expressions


    Fortunately, PHP offers something more powerful than the strtok function: regular
    expressions. Written in a language of their own, regular expressions describe
    patterns which are compared to strings. The PHP source code includes an implementation
    of regular expressions that conform to the POSIX 1003.2 standard. This standard
    allows for expressions of an older style but encourages a modern style that I
    will describe.


    It is beyond the scope of this text to examine regular expressions in depth. It
    is a subject worthy of a book itself. I will explain the basics, as well as demonstrate
    the various PHP functions that use regular expressions. An excellent resource
    for learning more about regular expressions is Chapter 2 of Ellie Quigley’s UNIX
    Shells by Example.


    # Defining Regular Expressions


    At the highest level, a regular expression is one or more branches separated by
    the vertical bar character (|). This character is considered to have the properties
    of a logical-OR. Any of the branches could match with an evaluated string. Figure
    15–2 provides a few examples.


    > ¹Quigley, Ellie, UNIX Shells By Example, Prentice Hall, Upper Saddle River,
    NJ, 1997.'
