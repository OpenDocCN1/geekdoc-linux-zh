    offer drivers and there are third parties, like Intersol sell optimized drivers
    for both Windows and UNIX platforms.


    # boolean odbc_autocommit(integer connection, boolean on)


    The odbc_autocommit function sets whether queries are automatically committed
    when executed. By default this is. The connection argument is an integer returned
    by the odbc_connect or odbc_pconnect functions.

    This function has to be used intelligently, as not all ODBC drivers support commits
    and rollbacks.


    # Example


    ```

    <<?n$connection = odbc_connect("store", "sa", "sa");


    // turn off autocommit

    odbdc_autocommit($connection, FALSE);

    ?>

    ```


