  md: '# # Appendix B


    # # ASCII CODES


    The following table lists the first 128 characters of the ASCII code. PHP allows
    for ASCII codes in the range of 0 to 255, but above code 127 the representation
    differs across operating systems.


    | Decimal | Hex | Character | Description |

    | --- | --- | --- | --- |

    | 0 | 00 | | Null |

    | 1 | 01 | | Start of Heading |

    | 2 | 02 | | Start of Text |

    | 3 | 03 | | End of Text |

    | 4 | 04 | | End of Transmission |

    | 5 | 05 | | Enquiry |

