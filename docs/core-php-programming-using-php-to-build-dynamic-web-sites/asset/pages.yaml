    compute_Mean

    7Lucky


    Figure 2-1

    Acceptable and Unacceptable

    Identifiers


    Variables, discussed in detail below, are always preceded by a dollar sign ($).
    The side effect of this is that a function and a variable can share the same name.
    You may also create a variable with the same name as a built-in function. You
    should not do this, however. It will be very confusing to anyone reading your
    code, you may never create a function with the same name as a built-in function.


    # Data Types


    PHP has three types of data: integers, floating-point numbers, and strings of
    text. Integers are sometimes referred to as whole or natural numbers; they contain
    no decimal point. Floating-point numbers are sometimes called real numbers. They
    always contain a decimal point, even when only a zero follows it. PHP refers to
    these doubles, which is short for double-precision floating-point numbers. Strings
    are collections of textual data. String constants are always surrounded by double
    quotes ("") or single quotes ('''').


    As you write PHP code, you will usually be unaware of the distinction between
    types because variables are multype. You do not declare a variable to be a particular
    type. You just assign it a value. PHP will remember the type of data you put into
    the variable. When you retrieve data from the variable, they are returned with
    that same type.


    There are two ways to override this behavior. The first way is to use the settype
    function. This tells PHP that you start considering a variable to be a certain
    type. The alternative is to use one of the type conversion function: intval, doubleval,
    strval. Consider Figure 2-2, which contrasts settype to the type conversion commands.'
