  md: '# # 8 Chapter


    No useful program can be useful in a vacuum. The functions described in this chapter
    are concerned with I/O (Input and Output), whether it''s to the browser, files
    or across a network. Some of them perform specialized duties such as manipulating
    files. Others are simply for debugging or reporting information about the environment.

    If you are experienced in traditional application development, you may be challenged
    by the unique characteristics of a stateless environment. Your script cant sit
    in a loop and get input from the user until the quit button is clicked. Although
    there are ways to force the preservation of state, that is a collection of variables
    for each user, I encourage you to work within PHP''s world. You may come to find
    that at first were limitations refreshing opportunities.


    # ## Sending Text to the Browser


    Any text outside PHP tags is automatically sent to the browser. This is as you
    would expect. Chapter 18 deals with the decision to send text via a PHP function.
    PHP offers three functions that simply send text to the browser: `echo, print,
    and printf.`'
