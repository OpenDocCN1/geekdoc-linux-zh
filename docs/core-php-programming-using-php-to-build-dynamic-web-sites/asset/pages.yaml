  md: '# core PHP programming


    # USING PHP TO BUILD DYNAMIC WEB SITES


    LEON ATKINSON


    THE EXPERIENCED DEVELOPER''S GUIDE TO PHP!


    Core PHP Programming is the first complete, practical guide to PHP 3.x for experienced
    web developers. Discover PHP borrows the best ideas from Java*, Perl, and C to
    create a remarkably productive scripting environment. Then, with the guidance
    of a leading PHP developer, learn every technique you need to build and robust
    web applications.


    Every Core Series book:


    DEMONSTRATE how to write commercial quality code.


    FEATURES dozens of nontrivial programs and examples—no toy code!


    FOCUSES on the features and functions important to real developers.


    PROVIDES objective, unbiased coverage of cutting-edge techniques—no hype!


    Master PHP syntax; review every PHP function, including I/O, data, and math functions;
    time, date, image, and database functions. PHP at work in sample code that demonstrates
    searching, searching, parsing, and string evaluation. Finally, walk through three
    complete web/database integration applications, learning essential techniques
    for building HTML tables from SQL queries; seeking site visitors; storing content
    in databases, and much more.


    # Core PHP Programming delivers


    Thorough, easy-understand coverage of PHP syntax and functions Step-by-step walkthroughs
    of web/database integration applications Design and optimization techniques for
    maximum performance and extensibility Practical debugging solutions


    CD-ROM INCLUDES a complete implementation of PHP, plus all the book''s code samples,
    and two web servers that support PHP: Apache and Xitati.


    About the Author


    LEON ATKINSON is a developer specializing in designing and implementing Internet-capable
    and Internet-hosted applications. Since joining web professional services provider
    Clear Ink, he has focused on building complex, PHP-based web applications that
    automate business processes.


    U.S. $39.99 | Canada $60.00 PENTICE HALL Upper Saddle River, NJ 07458 http://www.phpnet.com


