  md: '# integer error_reporting(integer level)


    The error_reporting function sets the level of error reporting and returns the
    previous value. The level argument is a bit field, so use the bitwise OR operator
    to put together the type of error reporting you would like. By default PHP uses
    a level of seven, which is Errors, Warnings, and Parser Errors. Refer to Figure
    11–5, which lists error levels.


    # Example


    ```

    <?php

    // empty variable, but no notice

    print($empty_variable);


    // turn on notices

    error_reporting(error_reporting(0) | 8);


    // empty variable, notice message

    print($empty_variable);

    ?>

    ```


