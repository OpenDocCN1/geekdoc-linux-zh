  md: '# # Chapter 16


    PHP has strong support for many databases. If native support for your favorite
    database doesn''t exist, there''s always ODBC, which is a standard for external
    database drivers. Support for new databases seems to show up regularly. The universal
    remark in this regard from the developers has been "give us a machine to test
    on and we''ll add support."


    MySQL is undoubtedly the most popular database used by PHP coders. Apart from
    being free, it suits Web development because of its blazing speed. I''ll assume
    you have a MySQL database in the examples for this chapter. If you don''t, you
    can either go to the MySQL site (http://www.tx.se/) and investigate downloading
    and installing, or you pursue changing the examples to work with another database.


    Most relational databases use the Structured Query Language, or SQL. It is a fourth-generation
    language (4GL) computer language, which means it reads a bit more like English
    than PHP source code. A tutorial on SQL is beyond the scope of this book. If you''re
    completely new to SQL, I recommend investigating the tutorials listed on the documentation
    page on the MySQL home page (http://www.tx.se/doc.html). An alternative would
    be to find a book such as Robert Groth''s and David Gerber''s Hands-On SQL


    > ''Hands-On SQL: The Language, Querying, Reporting and the Marketplace, Prentice
    Hall, Upper Saddle River, NJ, 1997.'
  merge: -1
