  md: 'The weakness in this scheme is that you need to give the generator a random
    number to start with. You can go two routes with this. Usually it is sufficient
    to use the current timestamp. If you need random numbers that are even harder
    to guess, save the seed on disk or in a database.


    The rand function returns a number from zero to some maximum. You can find this
    number using the getrand function, but usually it isn''t important. You can get
    a number in a specific range, use the modulus operator. This will give you a remainder
    from zero to one less than the right operand. Note that in Figure 14–9 I use 100
    and add 1 to result. This results in a number from 1 to 100.


    # Custom Random Number Generators


    In certain circumstances the pseudorandom numbers generated by PHP will not be
    random enough. From a statistical perspective the distribution may be uneven.
    Better distribution may be had using the arbitrary-precision math functions described
    in Chapter 10. Figure 14-10 uses the mixed congruence method. It involves multiplying
    the seed by a number that is power of two plus one and then adding a prime number.


    # Random Identifiers


    If you ever need to track users through a site, you will need to assign unique
    identifiers. In a database you can store all the information you know about the
    user and pass the identifier from page to page either through links or cookies.
    You will need to generate these identifiers randomly, otherwise it is too easy
    for anyone to masquerade as a legitimate user. Fortunately random identifiers-14–11
    are easy to generate.


    Figure 14–11 illustrates how this works. A pool of characters to use in the session
    identifier is defined. Characters are picked randomly from the list to build a
    session identifier of the specified length. That identifier is used inside a link
    so that it is passed to the next page. This method works for any browser, even
    lynx.. Chapter 16 discusses the integration of this technique with a database.'
