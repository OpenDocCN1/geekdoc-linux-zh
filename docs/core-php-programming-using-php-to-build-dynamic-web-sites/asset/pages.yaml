  md: '# # Chapter 19


    Building a Web site with PHP is not the same as building a static Web site. If
    you choose to simply sprinkle PHP code occasionally throughout the site, the effect
    will not be as dramatic, of course. If you choose to use PHP to generate every
    page, you will find many opportunities for transforming patterns into functions.
    As I wrote in Chapter 18, elements such as opening and closing body tags can be
    put into an function or included file. The consequence of this situation is that
    you no longer have a Web site, you have a Web application.


    When this happens it becomes more important to draw upon formal development techniques.
    Certainly, structured design is useful when building static Web sites. The case
    is de made plainly in Web Site Engineering,¹ and the addition of PHP makes careful
    design critical. I can''t cover every topic of software engineering as it applies
    to Web applications in the context of a chapter. I recommend reading Powell''s
    book as an excellent starting point.


    > ¹Powell, Thomas A.; Cutts, Dominique C.; Jones, David L., Web Site Engineering:
    Beyond

    Web Page Design, Prentice Hall, Upper Saddle River, NJ, 1998.'
