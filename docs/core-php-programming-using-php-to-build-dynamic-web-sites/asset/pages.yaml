    # clearstatcache()


    Since calling C''s stat function is relatively expensive in CPU time, PHP caches
    the results of each call. If you attempt to execute one of the functions that
    relies on stat more than once, all calls after the first draw from the cache.
    In the cases where a file changes status often, use clearstatcache to wipe out
    the cache.


    # Example


    ```

    <?php

    clearstatcache();

    ?>

    ```


