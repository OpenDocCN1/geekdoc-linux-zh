  md: "# Regular Expressions\n\nRegular expressions offer a powerful way to test strings\
    \ for the presence of patterns. They use a language all their own to describe\
    \ patterns, a language that consists mostly of symbols. PHP has several functions\
    \ that use regular expressions. You may wish to turn to Chapter 15 which describes\
    \ regular expressions in detail.\n\n# boolean ereg(string pattern, string text,\
    \ array matches)\n\nThe ereg function evaluates the pattern argument as a regular\
    \ expression and attempts to find matches in the text argument. If the optional\
    \ matches argument is supplied, each match will be added to the array. True (1)\
    \ is returned if at least one match is made, false (0) otherwise.\n\nThe first\
    \ element in the matches array, with an index of zero, will contain the match\
    \ for the entire regular expression. Subsequent elements of matches will contain\
    \ the matches for subexpressions. These are the expressions enclosed in parentheses\
    \ in the example.\nThis function is discussed in depth in Chapter 15.\n\n# Example\n\
    \n```\n<<?n  // show User Agent\n  print(\"User Agent: $HTTP_USER_AGENT<BR>\\\
    n\");\n\n  // try to parse User Agent\n  if(ereg(\"^([^+)/([0-9]+)\\.([0-9]+)\"\
    , $HTTP_USER_AGENT, $matches)) {\n    print(\"Full match: $matches[0]<BR>\\n\"\
    );\n    print(\"Browser: $matches[1]<BR>\\n\");\n    print(\"Major Version: $matches[2]<BR>\\\
    n\");\n    print(\"Minor Version: $matches[3]<BR>\\n\");\n  } else {\n    print(\"\
    User Agent not recognized\");\n  }\n?>\n```"
  merge: -1
  pgno: 232
