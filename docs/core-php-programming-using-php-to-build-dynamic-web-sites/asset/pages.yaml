    \ For MySQL this involves mysql_result and mysql_fetch_row, respectively.\n\n\
    Using mysql_result is much slower than the fetch functions. PHP has to work harder\
    \ to find the exact piece of data you need. First, the specified row must be referenced.\
    \ Then the data in that row must be searched for a column with a matching name.\
    \ You can imagine that executing mysql_result several times inside a loop can\
    \ add up to a very slow script. Each call has to start at the beginning and find\
    \ the appropriate data element.\n\nAlternatively, you may fetch an row into an\
    \ array, as I have done in most of the examples so far. The allows you to reference\
    \ the exact element without searching through the entire data set. The challenge\
    \ is to match up the results of the query with the array elements. If you have\
    \ created a query such as\n\n```\nSELECT *\nFROM user u, employer e\nWHERE u.Employer\
    \ = e.ID\n```"
