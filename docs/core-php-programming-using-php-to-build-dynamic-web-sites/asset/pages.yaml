    # Preserving State and Providing Security


    Chapter 16 outlines session identifiers, but it may not have been immediately
    obvious why you would want to secure your Web application by requiring visitors
    to identify themselves with a login and password. However, it would be very annoying
    if the user were forced to enter their page after page after. You may even want
    to track users through the site without actually identifying them. The process
    should be invisible and not intrude on the experience.


    One solution is to generate a random session identifier. This identifier must
    not be easy to guess as well as unique for simultaneous users. The session is
    stored in a database and passed in every link or form. The site sim-'
  merge: -1
