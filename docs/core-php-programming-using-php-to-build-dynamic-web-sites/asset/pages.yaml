  md: '# Chapter 13 Database Functions


    # boolean mysql_close(integer link)


    Use mysql_close to close the connection to a database. The connection must have
    been opened with mysql_connect. Use of this function is not strictly necessary,
    as all non-persistent links are closed automatically when the script finishes.


    # Example


    ```

    <?php

    // open connection

    $mysql_link = mysql_connect("localhost", "httpd", "");


    // close connection

    mysql_close($mysql_link);

    ?>

    ```


    # Related Functions


    mysql_connect


    # integer mysql_connect(string host, string user, string password)


    The mysql_connect function begins a connection to a MySQL database at the specified
    host. If the database is on a different port, follow the hostname with a colon
    and a port number. All the arguments are optional and will de-fault to localhost,
    the name of the user executing the script, and empty, respectively. The user executing
    the script is typically httpd, the Web server.


    Connections are automatically closed when a script finishes execution, though
    they may be closed earlier with mysql_close. If you attempt to open a connection
    that is already open, a second connection will not be made. The identifier of
    the previously open connection will be returned.

    False (0) is returned in the event of an error.


    # Example


    See any of the other examples in this section.'
