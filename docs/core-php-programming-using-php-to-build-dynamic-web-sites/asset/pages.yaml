  md: '# boolean link(string source, string destination)


    The link function creates a hard link. A hard link may not point to a directory,
    may not point outside its own filesystem, and is indistinguishable from the file
    it links to. See the man page for link or ln for a full description. The link
    function expects a source file and a destination file. On Windows this function
    does nothing and returns nothing.


    # Example


    ```

    <?php

    link("/www/htdocs/index.php3",

    "www2/htdocs/index.php3");

    ?>

    ```


    # Related Functions


    linkinfo, readlink, symlink


    # integer linkinfo(string filename)


    The linkinfo function calls the C function stat for the given filename and returns
    the st_dev field stat generates. This may be used to verify the existence of a
    link. It returns false (0) on error. You can read more about stat on the man page,
    or in the help file for Microsoft Visual C++.


    # Example


    ```

    <?php

    print(linkinfo("data.txt"));

    ?>

    ```


