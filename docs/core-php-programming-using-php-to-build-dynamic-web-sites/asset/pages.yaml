  md: '# Chapter 15 Parsing and String Evaluation


    | Sample | Description |

    |---|---|

    | a.c | Matches aac, abc, acc, ... — Any character between an a and c. |

    | ^a.* | Matches any string starting with an a. |

    | [a-c]*x$ | Matches x, ax, bax, abcx — Any of letters from the first three letters
    of the alphabet followed by an x. |

    | b[ao]y | Matches only bay or boy. |

    | [Zz]{5} | Matches any string, five characters long, that does not contain either
    an upper or lowercase z. |

    | [:digit:] | Matches any digit, equivalent to [0-9]. |

    | [<:]a.* | Matches any word that starts with a. |


    **Figure 15-4** Square Brackets in Regular Expressions


    ceded by a backslash will be treated literally, even if it has no special meaning.
    Any character with no special meaning will be considered just a character to be
    matched, backslash or not. You may also group atoms with parentheses ()) so that
    they are treated as an atom.

    Square brackets ([]) are used to specify a range of possible values. This may
    take the form of a list of legal characters. A range may be specified using the
    dash character (-). If the list or range is preceded by a caret (^), the meaning
    is to be any character not in the following list or range.

    In addition to lists and ranges, square brackets may contain a character class.
    These class names are alphanumeric you write [:alpha:]. The classes are alphanum,
    alpha, blank, cntrl, digit, graph, lower, print, punct, space, upper, and xdigit.
    You may wish to look at the man for ctype to get a description of these classes.

    Finally, two additional square bracket codes specify the beginning and ending
    of a word. They are [:<:] and [::], respectively. A word in this sense is defined
    as any sequence of alphanumeric characters and the- underscore characters. Figure
    15–4 shows examples of using square brackets.


