  md: '# Chapter 7 I/O and Disk Access


    76


    Figure 7–2 is an example of using variables created from form variables. The script
    expects a variable named inputColor. The first time this page is viewed, inputColor
    will be empty, the script sets it to be six F, the RGB code for pure white. On
    subsequent calls to the page, the value of the text box will be used to set the
    background color of the page. Notice that inputColor is also used in the INPUT
    to populate it. This way each time you submit the form, you remember what you
    entered.


    As an aside, you should also take note of the technique here of having a page
    call itself.


    # File Uploads


    A file upload is a special case of getting form input. Half of the story is putting
    together the correct HTML. File uploads are specified in RFC 1867. They are supported
    by Netscape Navigator 2 and above, as well as Internet Explorer 4. Placing an
    input tag inside an HTML form with the type attribute causes a file box and a
    button for browsing the local filesystem to appear on the Web page. Browsers that
    do not support uploads will likely render this as a text box, so it''s best to
    only present uploading forms to capable browsers. The form must use the post method
    for uploads, and you must also contain the enctype attribute with a value of multipart/form-data.
    A hidden form variable, MAX_FILE_SIZE, must precede the file input tag. Its value
    is the maximum file size in bytes to be accepted.


    When the form is submitted, PHP will detect the file. The file will be placed
    in a temporary directory on the server, such as /var/tmp. Several variables will
    be created based on the name of the file field. A variable of the same name of
    the file field will contain the complete path to the file in the local filesystem.
    A variable with _name appended to the file field name will contain the original
    file name as provided by the browser. A variable with _size appended to the file
    field name will contain the size of the file in bytes. Finally, a variable with
    _type appended to the file field name will contain the MIME type of the file,
    if it was offered by the browser.


    It is best to immediately move the upload of the new file into a permanent spot,
    since files are placed in a temporary directory. These files may be automatically
    deleted on a regular schedule. Figure 7–3 is an example script that accepts uploads
    and immediately deletes them.'
