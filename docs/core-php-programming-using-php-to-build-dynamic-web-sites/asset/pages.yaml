    # boolean odbc_binmode(integer result, integer mode)


    Use odbc_binmode to set the way binary columns return data for a result set. When
    binary data are returned by the driver, each byte is represented by hexadecimal
    codes. By default, PHP will convert these codes into raw binary data. If you have
    to use the odbc_longread function to set the maximum length of data to anything
    other than zero, then the modes in Figure 13–9 apply. If the maximum read length
    is zero, the data are always converted to raw binary data.'
