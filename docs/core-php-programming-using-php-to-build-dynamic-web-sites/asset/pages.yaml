  md: '# boolean msql_close(integer link)


    The msql_close function closes the link to a database. If the link argument is
    left out, the last opened link is closed. Only links opened by msql-connect may
    be closed. This is not strictly necessary, since all nonpersistent links are automatically
    closed when a script ends.


    # Example


    See msql_connect example.


    # Related Functions


    msql_connect


    # integer msql_connect(string host)


    The msql_connect function attempts to connect to the mSQL server at the specified
    host. If the host argument is left out, the local host will be assumed. A link
    identifier is returned. In the case where an open link exists, it will be returned
    rather than establishing a second link. The connection is automatically closed
    at the end of the script.


    # Example


    ```

    <?$database_link = msql_connect("msql.clearink.com");

    msql_close($database_link);?>

    ```


    # Related Functions


    msql_close, msql_pconnect


    # boolean msql_create_db(string database, integer link)


    msql_create_db function attempts to create a database. The link argument is optional.
    If left out, the last opened link will be used.'
