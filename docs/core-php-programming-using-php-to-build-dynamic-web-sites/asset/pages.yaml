  md: '# Reading and Writing to Files


    83


    sending mail across the Internet. Because PHP has so many built-in functions,
    it is rarely necessary to open pipes, but it''s nice to know it''s an option.


    You can open a file stream that communicates through TCP/IP with fsockopen. This
    function takes a hostname and a port and attempts to establish a connection. It
    is described in Chapter 8, along with the rest of the I/O functions.


    Once you have opened a file stream, you can read or write to it using commands
    like fgets, and fputs. Figure 7-7 demonstrates this. Notice that a while loop
    is used to get each line from the example file. It tests for the end of the file
    with the feof function. When you are finished with a file, end of file or not,
    you call the fclose function. PHP will clean up the temporary memory it sets aside
    for tracking an open file.'
