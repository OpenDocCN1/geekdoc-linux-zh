    The layout module controls where content appears on the page. The main piece of
    content is the output of the screen module, but there will certainly be other
    content such as top and side navigation. There may be a footer to each page that
    displays a copyright and a text-based navigation bar. The layout pulls all these
    pieces together. Layout modules can vary in two ways. First, they can vary in
    where they place elements and what elements they choose to display. The index
    page will likely have different navigational elements from secondary pages. Likewise
    tertiary pages, those three clicks deep, may have only links to the previous page.
    The second layout varies is in the method used. For third-generation browsers,
    the standard is to use tables to place content. Fourth-generation browsers support
    style sheets, so a second set of layout modules may exist for them. It is easy
    in PHP to examine the user agent string by the browser to choose an appropriate
    module.


    Navigation modules can be as simple as an HTML file link to the secondary pages.
    Often you will wish to indicate to which user section of the site they are in
