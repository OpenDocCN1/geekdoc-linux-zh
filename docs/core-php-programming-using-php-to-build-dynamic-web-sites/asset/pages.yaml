  md: '# Chapter 17 Generating Graphics


    The next step is to create an image. There are two ways to do this. You can create
    an image of a specific size which is blank, or you can load an existing GIF. I''ve
    chosen the former because it allows the script to make buttons of any size. You
    can make much more stylish buttons using the latter method. This is another good
    exercise.


    The button will be drawn with three colors: a body color the highlight color and
    the shadow color. I''ve chosen to go with three shades of gray. These colors must
    be allocated with the imagecolorallocate function. Using the body color, the script
    makes a rectangle that is one pixel smaller than the entire image. The border
    around this rectangle is created with four lines. The lines on the bottom and
    right sides are drawn in the shadow color, and the top and left sides are drawn
    with the highlight color. This creates an illusion of the button being three-dimensional.


    To finish the button, the script draws the label. First the text is drawn slightly
    off center in the shadow color. Then the text is drawn in the highlight color
    over it and exactly center, making the text look as though it is floating over
    the button.


    At this point the script has created the image and needs to send it to the browser.
    It is very important that the header be sent to let the browser know


