    Now you have a good overview of the different functional levels within Fibre Channel.
    Continue on to the next section to read about the detailed characteristics of
    each level.


    # 2.2 FC-0: The Physical Layer


    Level FC-0 deals with the physical variants:


    +   * fiber

    * connectors

    * receivers

    * data encoders/decoders

    * serializers/deserializers

    * transmitters'
