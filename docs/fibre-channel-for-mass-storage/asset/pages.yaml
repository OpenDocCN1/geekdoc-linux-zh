  md: '# 4.2 Addressing Methods for HP-UX


    As mentioned previously, there are three methods used by HP-UX for Fibre Channel
    addressing in order to work around the HP-UX limitations¹.


    +   * Peripheral Device addressing

    * Logical Unit addressing

    * Volume Set addressing


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_78_0.png)


    Figure 4-5 Addressing Methods


    The Fibre Channel Protocol (FCP) has a very large address space mapped onto the
    parallel SCSI address model of HP-UX. The FCP portion of the SCSI subsystem on
    HP-UX handles the large target address space associated with Fibre Channel by
    creating multiple virtual SCSI buses.


    1. These limitations will be resolved with a new version of HP-UX, soon to be
    released.'
