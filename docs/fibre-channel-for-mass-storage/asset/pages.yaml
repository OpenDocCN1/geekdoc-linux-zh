    The Gigabit Fibre Channel Switch operates as multiple channels, and is capable
    of providing up to eight concurrent connections. Each connection is capable of
    operating at the full 1 Gigabit speed. This is a significant improvement as current
    solutions have a single loop, which has a total speed of 1 Gigabit, which is shared
    between all of the attached devices.


    The Gigabit Fibre Channel Switch will allow a higher transfer rate, while providing
    a bridge between the current Fibre Channel solutions customers have bought, and
    providing a link to the capabilities to be offered in the future. The Gigabit
    Fibre Channel Switch initially will be supported in many configurations, but will
    be restricted, for support reasons, to no more than two switches (not cascaded)
    for cluster/configuration.'
