  md: '# 2.2.2.1 OFC and non-OFC


    Open Fibre Control (OFC) is a safety feature used to prohibit the laser light
    from functioning when there is a break or disconnect in the fiber cable. This
    is used specifically with high intensity laser lights. Hewlett-Packard uses non-OFC
    because the lasers are of low intensity. Therefore, the laser light is not turned
    off when there is a disconnect. However, this does not mean you should look at
    or point the fiber cable directly at your eye, since there could still be some
    damage. When checking a fiber cable to see if a laser light exists, point the
    cable end at a white piece of paper. If a red dot appears on the paper, then the
    transmitting laser is functioning.


    # 2.2.2.2 Wavelength


    Wavelength is a topic related to single and multimode connectors. Long wave lasers
    are used for long Fibre Channel links, from approximately 500 to 10,000 meters.
    They are typically used with single mode fiber of a 9-micron size.


    Short wave lasers are used for FC-AL links up to approximately 500 meters. They
    are typically used with multimode fiber. The preferred fiber core size is 50-micron.
    62.5-micron core size is also supported for compatibility with existing FDDI installations.
    However, fiber of this type has smaller bandwidth and, in this case, the distance
    is limited by the fiber bandwidth. The length recommendation for the 62.5-micron
    fiber cable is 175 meters.


    When pulling new cable, it is recommended that the customer pull both 9- and 50-micron
    cable to accommodate future expansion.


    # 2.3 FC-1: The Transmission Protocol Level


    The FC-1 level defines the transmission protocol including the 8B/10B encode/decode
    scheme, byte synchronization, and character-level error control. This protocol
    uses the 8B/10B encoding scheme that encodes 8-bit bytes into 10-bit transmission
    characters. The 8B/10B encoding was developed by IBM and was determined to be
    the best for the expected error rate of the system.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# FC-1: The Transmission Protocol Level


    The 8B/10B code has outstanding characteristics including long transmission distances
    and very good error-detection capability. The 8B/10B code finds errors that a
    parity check cannot detect. Parity does not find even numbers of bit errors, only
    odd numbers. But 8B/10B finds almost all errors. Fibre Channel also employs a
    Cyclic Redundancy Check (CRC) on transmitted data. This also assists with error
    detection.


    To assist with transmission the 8B/10B code uses 12 special characters. However,
    we are only concerned with one, the 28.5 special character. At present, it is
    the only special character used by Fibre Channel in the 8B/10B code.


    # 2.3.1 8B/10B Encoding


    The format of the 8B/10B character is Ann.m, where:


    +   * A is equal to “D” for data or “K” for a special character

    * nn is the decimal value of the lower five bits of a byte (bits EDCBA)

    * “.” is a period

    * m is the decimal value of the upper three bits of a byte (bits HGF)'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'Figure 2-9 shows the translation of the HEX number 45.


    # NOTATION


    | HEX | 45 |

    |---|---|

    | | H G F E D C B A |

    | BITS | 0 1 0 0 1 0 1 |


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_45_0.png)


    NOTATION D 05 . 2


    # TRANSMISSION ORDER


    | 8B/10B | A B C D E F G H |

    |---|---|

    | | a b c d e i f g h j |

    | | 1 0 0 1 0 0 1 0 1 |


    Bits i and j based on running disparity


    Figure 2-9 8B/10B Encoding


    The 8B/10B encoded bytes have a property know as “disparity,” which can be positive,
    negative, or neutral. An 8B/10B byte has negative disparity if there are more
    binary ones in the byte than binary zeroes. Conversely, the byte has positive
    disparity if there are more binary zeroes than ones. Neutral disparity is when
    the number of binary ones equals the number of binary zeroes.


    # 2.3.2 K28.5 Special Character Encoding


    The K28.5 special character has the following components:


    +   * K stands for special character

    * 28 is the decimal value of bits EDCBA -- 11100

    * “.” is a period

    * 5 is the decimal value of bits HGF -- 101'
