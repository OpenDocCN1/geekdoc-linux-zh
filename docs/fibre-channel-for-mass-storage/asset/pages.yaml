  md: '# 2.5 FC-3: Common Services


    The FC-3 level, located at the center of the functional levels, concerns itself
    with functions spanning multiple N_Ports. The FC-3 level is the single point in
    the architecture through which all traffic must flow in both directions. The FC-3
    level will contain services that are common (available) to all ports on a node.


    A node may have several ports. A node may also have several ULPs and FC-4 level
    mappings. However, there is only one FC-3 Common Services level per node. The
    FC-3 level can manage a set of tables holding the login information for other
    active ports. Each port on the FC-3 level knows which ports are busy and which
    exchanges they are busy.


    Figure 2-12 shows where the FC-3 level fits into the overall scheme of all the
    Fibre Channel levels.


    Currently there are three functions defined within the FC-3 level standard:


    +   - Striping—Used to achieve higher bandwidth. Striping allows multiple links
    simultaneously and transmits a single information unit across multiple links employing
    multiple N_Ports in parallel.


    +   - Hunt Groups—Are a group of N_Ports associated with a single node, they permit
    any N_Port on the node to receive information containing the correct alias identifier.


    +   - Multicast—This can be compared to a broadcast message. It allows a single
    information unit to be transmitted to multiple N_Ports on a node.


    The FC-3 level knows nothing about the topology of Fibre Channel or the physical
    signaling at the lower levels. This is handled by FC-1 and FC-2 levels. FC-3 understands
    if there are multiple ports attached to a node and if they participate in multiport
    operations like multicasting. Knowing which ports are busy allows the FC-3 level
    to route exchanges between two N*Ports and FC-4s.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# FC-4: Mapping


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_52_0.png)


    Figure 2-13 FC-3 Common Services Level


    # 2.6 FC-4: Mapping


    Mapping is a set of rules that is defined to move information from the Upper Level
    Protocol interfaces to the lower Fibre Channel levels. The ANSI SCSI committee
    and the Fibre Channel committees are currently defining these rules.


    Currently the rules provide for transforming information units into Fibre Channel
    sequences and exchanges and back again. When fully developed, the mapping rules
    are intended to provide clear mapping instructions between the Upper Level Protocol
    (ULP) and the FC-3 and FC-2 levels to enhance interoperability between applications.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'To send data, the FC-4 level takes a unit of information (this is the payload

    in a frame and is the actual data that is being transmitted, it is referred to
    as an

    Information Unit (IU)) from a ULP and transforms it into sequences for the

    FC-3 and FC-2 levels. To receive data, the FC-4 level takes a sequence from the

    FC-3 and FC-2 levels and transforms it into an IU for the ULP.


    # 2.7 Upper Level Protocols


    The ULPs allow two devices to communicate. For example, a computer

    sends data to a disk to be stored for later use, or the communication that takes

    place in a client/server relationship.


    There are many standards currently defined that have been in use for years

    that enable interoperation, such as SCSI or IPI. A goal of Fibre Channel is to

    provide a structure where legacy ULPs would continue to operate, preserving

    the software developed in the past. In this regard then, a map will exist in the

    FC-4 level for every ULP that is transportable over Fibre Channel.


    # 2.8 Classes of Service


    Fibre Channel classes of service are managed by the FC-2 level. Currently

    here are three classes of service defined by the standard:


    +   - Class 1— Dedicated connection service.

    - Connection-oriented

    - Acknowledged delivery

    - Class 2— Multiplexed service.

    - Connectionless

    - Acknowledged delivery'
  merge: -1
  pgno: 53
- img_proc: true
  md: '• Class 3— Datagram service. This is the current class of service provided
    for by Hewlett-Packard. The device drivers determine if data is not received and
    needs to be retransmitted.


    +   - Connectionless

    - Unacknowledged delivery


    Other classes of service may follow. However, they are currently not defined.'
  merge: -1
