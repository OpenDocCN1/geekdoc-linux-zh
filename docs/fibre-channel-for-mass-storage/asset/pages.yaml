  pgno: 38
- img_proc: true
  md: 'FC-0 deals strictly with the serial bit stream to be sent and received, and
    the conductors used to transmit that stream. This layer is called the physical
    layer. The Fibre Channel standard calls this function the Link Control Facility
    (LCF). The requirements are different for different types of media and different
    data rates.


    # 2.2.1 Connectors


    Remember, Chapter 1 stated that the main purpose of Fibre Channel is to have any
    number of existing protocols over a variety of physical media and existing cable
    options. Therefore, FC-0 provides for four types of connectors to accommodate
    for the variety of physical media and for possible existing cable.


    # Single mode SC connector (9um)


    # Coax connector


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_39_0.png)


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_39_1.png)


    # Multimode SC connector (50/62.5 um)


    # STP 9-Pin connector


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_39_2.png)


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_39_3.png)


    Figure 2-5 FC-0 Connectors'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'The single mode and multimode connectors connect to fiber optic cable. Single
    mode fiber optic cable is thinner and has less bandwidth than multimode cable.
    Therefore, single mode cable is used for long distance transmissions, 10,000 meters
    (10km), where multimode cable is used for shorter distances, 500 meters.


    In that case, an example for use might be to connect two buildings some distance
    away each other with single mode fiber optic cable. Then, within each building,
    connect each floor using multimode cable.


    A word of caution, when working in a mixed environment of single and multimode
    cabling, be aware that the connectors have been keyed to prevent accidental connection
    of single mode to multimode or the reverse. However, the keying of the connectors
    is not perfect nor completely standardized. Also, multimode-fiber optic cable
    does not work with single mode transmitters and receivers. The single mode light
    “rattles around” in the big 50 or 62.5 um fibers and dissipates quickly, causing
    data loss.


    Currently, Hewlett-Packard only supports fiber optic cable with its use of Fibre
    Channel and therefore only the SC connectors shown in Figure 2-5.


    The Fibre Channel standard does provide connections to co-ax and proper cabling.


    For co-ax cable:


    +   * the TNC for receive

    * the BNC for transmit


    For copper cable the shielded twisted-pair (STP), 9-pin D-type connector (DB9),
    is used. To prevent accidental attachments, the middle five holes in the Fibre
    Channel DB9 female connector are filled.


    # 2.2.2 Fiber Optic Cables


    Figure 2-6 shows a typical fiber cable and its major components. The light travels
    through the core, the smallest component. The core is covered, or surrounded,
    by a material called cladding. Its purpose is to keep the light in the core, not
    let it escape.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# POLYURETHANE

    OUTER JACKET


    # STRENGTH

    MEMBERS


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_41_0.png)


    **Figure 2-6** Fiber Cable Components


    Then the cladding is wrapped by a coating which is in turn wrapped by the buffer
    jacket. This is all done so the light stays within the the core. However, the
    core fiber itself is very thin and fragile. Therefore to give strength to the
    cable and more protection to the core fiber, the buffer jacket is wrapped with
    a strengthening material. Finally, all of these layers of fiber and material are
    wrapped with the polyurethane outer jacket. Fiber cable is not subject to electromagnetic
    interference, and since the data is transmitted by light it is secure from eavesdropping.'
