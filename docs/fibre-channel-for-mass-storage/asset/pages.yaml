  md: 'Figure 2-10 shows the translation of the HEX number BC.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_46_0.png)


    TRANSMISSION ORDER

    8B/10B A B C D E F G H

    ab b c d e i f g h j

    0 0 1 1 1 1 1 0 1 0 (RD-)

    OR 1 1 0 0 0 0 0 1 0 1 (RD+)


    Figure 2-10 8B/10B Translation


    # 2.3.3 FC-1 Transmission Word


    A transmission word is composed of four transmission characters. Remember, the
    8B/10B code encoded an 8-bit byte into a 10-bit character. Therefore, a transmission
    word is a 40-bit group of 10B transmission characters. A transmission word can
    be one of two kinds:


    +   - datathe first transmission character is an encoded data byte

    - ordered set—the forth transmission character is the K28.5 special character


    If the transmission word is data, each of the four transmission characters is
    an encoded data byte.'
  merge: -1
  pgno: 46
- img_proc: true
  md: "If the transmission word is an ordered set, the first byte is a K28.5 transmission\
    \ character. The other three transmission characters are normal encoded data bytes.\
    \ Ordered sets permit control functions to be imbedded in the bit stream. One\
    \ simple use of ordered sets is to determine at a receiver where word boundaries\
    \ are. If all transmission words are data transmission words, the receiver has\
    \ only a 2.5% chance of getting it right (that is, one in 40 bits).\n\n# 2.3.4\
    \ FC-1: Ordered Set\n\nAn ordered set is a transmission word beginning with a\
    \ special character, as previously discussed, the K28.5 character. Because this\
    \ special character is present, this transmission word has a special control meaning.\
    \ There are three possible meanings:\n\n+   - Frame delimiter—This defines what\
    \ class of service is required. (Classes of service will be explained later in\
    \ this chapter.) The frame contains a start of frame (SOF) and an end of frame\
    \ (EOF) delimiter.\n- Primitive signals—There are two kinds of primitive signals:\n\
    \  - The ordered set may be a primitive signal used for buffer-to-buffer flow\
    \ control.\n  - There is an ordered set for idle primitives. Idles are words that\
    \ fill the space between frames. In Fibre Channel, the transmitter must continuously\
    \ send something over the media. This helps preserve bit, byte, and word synchronization,\
    \ and permits faster communication.\n- Primitive sequences—A set of three identical\
    \ ordered sets for link control. These are used for notification of link failures\
    \ and loss of synchronization."
  merge: -1
  pgno: 47
- img_proc: true
  md: 'FC-2: Framing Protocol


    # 2.4 FC-2: Framing Protocol


    The FC-2 framing protocol manages flow control so data will be delivered with
    no collisions or loss. This level defines the signaling protocol, including the
    frame and byte structure, which is the data transport mechanism used by Fibre
    Channel. The framing protocol is used to break sequences into individual frames
    for transmission, flow control, 32-bit CRC generation, and various classes of
    service.


    To aid in data transfer, FC-2 provides for the following elements:


    +   Frames—basic units of information transfer. The maximum payload of a frame
    is 2112 bytes.


    +   Sequences—are made up of one or more frames. FC-2 names each sequence and
    tracks it to completion.


    +   Exchanges—are the largest construct understood by FC-2. An unidirectional
    or bidirectional set of nonconcurrent sequences. SCSI-3 FCP uses bidirectional
    exchanges, with information passing in one direction at a time. To send data in
    the opposite direction, sequence initiative is passed from one port to another
    and back again. Each port generates one or more sequences within the exchange.


    +   Packets—are made up of one or more exchanges.


    # 2.4.1 Frame Structure


    The following figure demonstrates frame structure.


    | 4 | 24 | 0 to 2112 | 4 | 4 Bytes |

    |---|---|---|---|---||

    | >= 2 Idles | Start of Frame | Frame Header | (Optional Headers) | Payload |
    CRC | End of Frame | 6 Idles |


    **Figure 2-11** FC-2 Frame Structure'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'The total length of the frame is 2148 transmission characters or 537 transmission-words.
    The SOF, CRC, and EOF are all one transmission word in length with the frame header
    being six transmission words in length. The frame is followed by a minimum of
    6 idles (or 24 transmission characters).


    # 2.4.2 Frame Header Structure


    The frame header is divided into fields to carry control information. The following
    figure shows these fields.


    | | 4 | 24 | | 0 to 2112 | | 4 | 4 Bytes |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | >= 2 Idles | Start of Frame | Frame Header | (Optional headers) + Payload |
    CRC | End of Frame | 6 Idles |

    | | | Byte 0 | Byte 1 | Byte 2 | Byte 3 | |

    | Word 0 | Bit 31 | 23 | 15 | 7 | 0 | |

    | | | R_CTL IC | DESTINATION_ID | |

    | 1 | rsvd | SOURCE_ID | |

    | 2 | TYPE | F_CTL | |

    | 3 | SEQ_ID | DF_CTL | SEQ_CNT | |

    | 4 | OX_ID | RX_ID | |

    | 5 | | PARAMETER | |


    Figure 2-12 Frame Header Structure'
  merge: -1
