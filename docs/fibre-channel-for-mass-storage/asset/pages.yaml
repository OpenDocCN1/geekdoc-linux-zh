- img_proc: true
  md: 'The FCP LUN ID is 8 bytes in length. All LUN addressing is done in the first
    two bytes. The control port of a device with an addressable controller uses Peripheral
    Device addressing.


    Hewlett-Packard''s 30-slot Fibre Channel disk array is not a true array. It does
    not have an addressable control port. Each LUN is addressed as though it were
    directly attached.


    # 4.2.1 Hardware Path for Fibre Channel Addressing


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_79_0.png)


    **Figure 4-6** Hardware Path


    Addressing begins as it would on any Hewlett-Packard computer system. The Bus
    converter and HBA addresses have the same format and meanings as on all previous
    Hewlett-Packard products. However, the protocol type, area and port have been
    added for use with Fibre Channel. The protocol type is “8” for mass storage and
    “5” for networking. For Fibre Channel mass storage devices, the protocol type
    will always be “8.”


    The Area is always “0” for private loop. The Port is not always “0” and will be
    covered in following pages.'
  merge: -1
