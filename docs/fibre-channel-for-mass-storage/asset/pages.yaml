    # 5.7.1 Basic Topology


    The disk array protects against single points of failure with RAID (Redundant
    Array of Independent Disks) technology, global hot spares, and redundant, hot-swappable,
    customer-replaceable disk array components. Many of the components can be removed
    and replaced by the customer while the disk array is powered up, without removing
    it from the cabinet and without losing data. The RAID levels supported are 5,
    3, 1/0, and 1. RAID level 0 and individual disk units are not supported because
    they provide no data redundancy.


    Disk arrays and hosts can be directly or indirectly connected to Hewlett-Packard
    FC-AL Hubs in a number of hardware topologies.


