    # 4.2.4 Volume Set Addressing


    This addressing method is used primarily for addressing virtual busses, targets,
    and LUNs. The HP-UX operating system selects the Volume Set addressing method
    based on inquiry data and LUN information returned by the SCSI-3 REPORT LUN command.


    A 14-bit volume number supports up to 16,384 LUNs for a single FCP target:


    +   * bits 13–7 become the bus in the hardware path

    * bits 6–3 become the target in the hardware path

    * bits 2–0 become the LUN in the hardware path


    For example, in Volume Set addressing, the control port of a Fibre Channel Disk
    Array uses Peripheral Device addressing way the LUNs (also known as volumes) will
    use Volume Set addressing.'
