    # 4.2.5 Hard versus Soft Addresses


    The FC-AL protocol allows soft addresses to be assigned to devices if duplicate
    hard addresses are found on the loop. However, it is best to avoid allowing devices
    to acquire a soft address. The only way to allowing devices to acquire a soft
    address is to make sure that all devices have hard addresses before they are attached
    to the loop.


    Create a loop map and verify that any device has added a different hard address
    than devices already on the loop. It is really worth repeating, Make sure all
    devices attached to the loop have a unique hard address. Always run an ios after
    attaching a device to confirm that the device obtained its hard address.


    For example, one array with address 3C attached to an FCA poses no problem and
    two arrays, each with address 3C, attached to two FCAs pose no problem. However,
    two arrays, each with address 3C, attached to a hub will pose a problem. One will
    have a hard address and the other will be assigned a soft address. The first array
    to acquire the loop will receive its hard address and the second array will be
    assigned a soft address because the loop will see a duplicate address.'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'After a disconnect or a power off condition, the loop may initialize with “flip-flopped”
    addresses. This can produce data corruption. Upon power on the array that had
    the soft address may acquire the loop first and receive its hard address and the
    array that had the hard address before the power off condition now will be assigned
    a soft address. The data stored on that device when it had a hard address is no
    longer accessible or even know to the system because of the address “flip-flop.”


    To prevent this condition assign each device a unique hard address.'
  merge: -1
  pgno: 92
