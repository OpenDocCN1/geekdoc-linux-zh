    # 1.2.1 Fibre Channel for Networking


    Fibre Channel can be used for networking. The Fibre Channel standard was written
    to also cover networking protocols (system-to-system communication). Hewlett-Packard''s
    networking implementation uses a speed of 25 Megabytes per second, (M/bytes/s,
    also known as Mbps) or 266 (265.625) megabaud. This is also known as quarter speed,
    with full speed being 100 Mbytes/s or 1063 (1062.5) megabaud. Full speed is also
    known as gigabit speed. Consult the publications listed in Section 6.2 for more
    information on Fibre Channel as applied to the networking environment.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 1.3 Fibre Channel for Mass Storage


    Since Fibre Channel is a generic data transport mechanism, Fibre Channel can transmit
    a number of existing networking and I/O protocols:


    +   I/O protocols:

    * SCSI

    * HIPPI

    * IPI


    +   Network protocols:

    * IP

    * IEEE 802.12


    Hewlett-Packard has chosen to support the SCSI-3 protocol over Fibre Channel for
    its mass storage environment. Mass storage consists of several device classes:


    +   * tapes

    * disks

    * disk arrays


    # 1.4 Advantages of Fibre Channel for Mass Storage


    There are some definite advantages to using Fibre Channel over other architectures.
    Although this is not an all-inclusive list, these are the major advantages:


    # 1.4.1 Distance


    Hewlett-Packard supports up to 10,000 meters (10km) between the computer (or system)
    and the peripheral. What this means is that between the computer and the peripheral
    there can a distance of 10 kilometers. The next section, “Topologies,” will describe
    this in more detail, however, the distance advantage is an excellent solution
    for the campus-type environment.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 1.4.2 Speed


    Fibre Channel permits a theoretical speed of up to 4000 Mbps. (As mentioned previously
    Hewlett Packard supports 1063 Mbps.) Speeds depend greatly on the design of the
    pieces and parts that are connected within the topology between the computer and
    the peripheral. Our challenge within the industry now is to determine how to achieve
    these higher speeds allowed by the Fibre Channel standard. This speaks directly
    to performance because with the speeds capable with Fibre Channel throughput increases
    by four or five times over current channels.


    # 1.4.3 Connectivity or Scalability


    Computer system environments today are very limited in the number of devices that
    can be connected together. They are also limited in that today’s configurations
    do not easily allow the introduction of new technologies, protocols, or even different
    protocols simultaneously.


    Fibre Channel addresses these issues by allowing:


    +   * from two to over 16 million ports that can be concurrently logged in to
    a Fabric with the 24-bit address identifier

    * for the introduction of new technologies like laser light

    * for the transportation of different protocols simultaneously


    # 1.5 Basic Terms


    A set of new terms having no previous association with other protocols has been
    defined for Fibre Channel. For example, SCSI has Initiators and Targets, and Fibre
    Channel has Originators and Responders. In Fibre Channel, the Originators are
    devices that originate (initiate) a transaction or operation. The Responders then,
    answer the operation of the Originators. Also refer to the glossary in the back
    of this book for complete definitions of all terms.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'The following pages will describe more words, as well as the names of some
    of the pieces and parts of Fibre Channel technology/topologies. A node is a device.
    A device is any processor or mass storage subsystem with Fibre Channel functionality.
    A node has at least one port (N_Port, the ''N'' stands for node) and can have
    multiple ports. A port is the connecting interface between the cable and the device.
    The cable is referred to as the link. Fibre Channel is based on full duplex operation,
    therefore two fibers, (TX and RX) one to transmit and one to receive, are required
    to operate a port. The term fiber in this case can be a copper cable or an optical
    strand cable.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_28_0.png)


    Figure 1-2 Basic Terms


    # 1.6 Topologies


    # 1.6.1 Point-to-Point


    The first topology to discuss is the simplest, it is called a point-to-point topology.
    It is two nodes (devices) connected together. One node could be a computer system
    and the other node could be a disk array.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '![](img/92bf92f19abc8dc2f49e0cf07e857a0c_29_0.png)


    Figure 1-3 Point-to-Point Topology


    This particular topology uses two nodes (each node must have at least one port),
    and the nodes are connected using one link or cable. The point-to-point connection
    guarantees instant access with no interference from any other node or application.


    If a peripheral node, such as a disk array, has two N_Ports, access to the disk
    array could be shared between two computer systems. For example, the disk array
    could act as a repository of common software for two computer systems. This would
    be considered two point-to-point connections. See Figure 1-4.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_29_1.png)


    Figure 1-4 Two Point-to-Point Connections'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Topologies


    A point-to-point connection may also be considered a two-node loop. Hewlett-Packard’s
    implementation of point-to-point is a two-node loop. This brings us to our next
    topology to be discussed.


    # 1.6.2 Arbitrated Loop


    A loop, called Fibre Channel Arbitrated Loop (FC-AL) can have up to 127 ports
    connected in series (one right after the other) continuing around and back to
    the originator. For example, the node 1 transmitter is connected to the node 2
    receiver, the node 2 transmitter is connected to the node 3 receiver and so on
    until the final node transmitter is connected to the node 1 receiver, thus completing
    the loop. Figure 1-5 illustrates this example.


    A node loop port (NL_Port) wins arbitration on the loop and establishes a connection
    with another NL_Port on the loop. At the time the connection is established it
    is considered to be a point-to-point connection or two-node loop.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_30_0.png)


    Figure 1-5 Arbitrated Loop Topology'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'In an arbitrated loop only the two connected ports can communicate at any given
    time. All the other ports act as repeaters. When the communication comes to an
    end between the two connected ports, the loop becomes available for arbitration
    and a new connection may be established. Fairness is provided for arbitration
    to provide equal access to all ports. The FC-AL features, operations, and Hewlett-Packard’s
    implementation will be discussed in further detail in Chapter 3.


    # 1.6.3 Switch Topology or Fabric


    The switch topology uses the concept of fabric. The fabric is a mesh of connections.
    When attached to a fabric, a single N_Port can access all the rest, including
    members of loops.


    Unlike the FC-AL topology, many connections may be established within the fabric.
    It can be compared to a telephone system where many phone calls may be occurring
    all at the same time.


    Any node can be attached to a fabric through the N or NL_ports by way of a link.
    The port in the fabric is called an F_Port. An N_Port attaches to an F_Port. If
    an NL_Port is attached to a fabric, then the fabric port is an FL_Port.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_31_0.png)


    Figure 1-6 Fabric Topology'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 1.6.4 A Typical Campus Topology


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_32_0.png)


    **Figure 1-7** Typical Fibre Channel Campus Topology


    A campus topology is nothing more than cabling buildings together so data can
    be transferred from a computer system in one building to storage devices, whether
    they be disk storage or tape storage for backup or some other devices, in another
    building.


    Using current technology these buildings could be up to 10,000 meters from each
    other. This type of topology would incorporate the use of two long-wave hubs attached
    by way of a 9 micron (um) cable. Providing the cable has a measured signal strength
    loss of less than 9 db.'
