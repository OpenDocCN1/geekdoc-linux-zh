  md: '# High Availability Fibre Channel Disk Array


    For high availability implementations, up to four disk arrays with two SPs per
    disk array can be connected to the HP FC-AL Hub. For nonhigh availability implementations,
    up to eight disk arrays with one SP per disk array can be connected to the HP
    FC-AL Hub.


    For high availability, up to four dual-SP disk arrays can be attached to an HP
    FC-AL Hub. The two FC I/O adapters installed in the host connect to the two remaining
    HP FC-AL Hub ports. If one SP fails, ownership of its LUNs can transfer automatically
    to the remaining operational SP through the alternate path. Likewise, if a primary
    and an alternate path have been configured in LVM, LVM can switch automatically
    and transparently to the alternate path. If one host adapter fails, or one FC
    cable from the host to the HP FC-AL Hub or from the HP FC-AL Hub to one of the
    dual-SP disk array fails, that disk array can still be accessed via the alternate
    hardware path. The HP FC-AL Hub is a single point of failure in this topology.
    If the HP FC-AL Hub fails, no communication between the host and any of the disk
    arrays is possible.


    For nonhigh availability, up to eight single-SP disk arrays can be attached to
    the HP FC-AL Hub. If the single SP or the FC cable between the HP FC-AL Hub and
    an array fails, no I/O operations are possible between the host and the disk array
    with the failed SP. If one FC adapter fails in the host, the disk array can still
    be accessed via the hardware path through the other operational FC adapter. If
    the HP FC-AL Hub fails, no communication between the host and any disk arrays
    is possible.


    # 5.7.3 High Availability Topology


    The high availability topology increases the availability of the single system
    distance topology by protecting against single points of HP FC-AL Hub failure
    with the use of redundant HP FC-AL Hubs. Adding a second HP FC-AL Hub also increases
    the number of hosts and disk arrays that can be connected to a single FC-AL.'
  merge: -1
