  md: "# Addressing\n\nThis chapter discusses:\n\n+   * The addressing limitations\
    \ of HP-UX\n* Work-arounds\n* Three methods of addressing\n  - Peripheral Device\
    \ addressing\n  - Logical Unit addressing\n  - Volume Set addressing\n* Reading\
