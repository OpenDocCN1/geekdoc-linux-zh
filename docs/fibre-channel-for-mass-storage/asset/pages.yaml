  md: '# Addressing Methods for HP-UX


    HP-UX selects the Logical Unit addressing method based on inquiry data and LUN
    information returned by the REPORT LUNS command. HP-UX limits the target addresses
    to addresses 0 through 15 and LUN addresses 0 through 7. The target address specifies
    a bus number (3 bits), a target number (6 bits), and a LUN (5 bits).


    Each SCSI bus on the MUX is represented by a separate virtual bus on HP-UX. The
    MUX control port resides on a different virtual bus than its attached devices.
    See Figure 4-11 for an example.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_84_0.png)


    Figure 4-11 Example of Logical Unit Addressing


    What this figure shows is the MUX has its own address (8/12.8.0.255.12.0), with
    a loop address of HEX 2C or decimal 44, using Peripheral Device Addressing.'
  merge: -1
