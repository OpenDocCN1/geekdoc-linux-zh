  md: '# 5.1 CONTROLLER ICs


    # 5.1.1 Overview


    Hewlett-Packard began shipping the TACHYON IC in early 1995 and today, TACHYON
    is the industry''s leading Fibre Channel controller. HP has carried this leadership
    forward with the Tachyon TL IC, a 64-bit PCI-to-Fibre Channel controller, that
    focuses on arbitrated loop topologies for cost-effective, Fibre Channel mass storage
    designs. Both of these implement the TACHYON family architecture, which is a complete
    hardware-ics design that delivers on the true performance capabilities of Fibre
    Channel.


    # 5.1.2 TACHYON


    Controller IC

    HPFC-5000C


    The Industry''s Leading Fibre Channel Controller IC


    # 5.1.2.1 Product Highlights


    +   - Single chip Fibre Channel interface

    - Supports both networking and mass storage implementations

    - Complete hardware-based design uniquely optimized for Fibre Channel performance

    - Released to production June 1996


    # 5.1.2.2 Description


    The TACHYON controller IC, HPFC-5000C, supports Arbitrated Loop, fabric, and point-to-point
    topologies; Class 1, 2 and 3 services; and supports quarter, half, and full-speed
    Fibre Channel data rates. The IC also provides on-chip support of FCP for SCSI
    initiators and targets and hardware assists for TCP/UDP/IP networking. Performance
    is optimized within the IC through complete concurrency with eight internal DMA
    channels and full duplex processing.'
  merge: -1
  pgno: 95
