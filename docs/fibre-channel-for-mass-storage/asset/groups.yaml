    # 图 5-10 级联短波 FC-AL 集线器配置


    ## 5.6.4.2 错误布线示例


    以下插图是错误布线的示例。例如：**不要**将同一集线器的两个端口连接在一起。两个连接之间的端口将从环路消除。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_111_0.png)


    # 图 5-11 错误布线示例：同一集线器上的端口


    **不要**在任何两个集线器之间连接多根电缆。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_112_0.png)


    **图 5-12** 错误布线示例：集线器之间的多个电缆连接


    **不要**尝试将一个集线器连接到多个其他集线器。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_112_1.png)


    **图 5-13** 错误布线示例：连接了两个以上的集线器


    ## 5.7 高可用光纤通道磁盘列


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_113_0.png)


    图 5-14 A3661A HA FC 磁盘列


    此光纤通道外设具有巨大的存储容量。它可以容纳多达 30 个磁盘模块。惠普的最高容量为每个磁盘模块 18 兆字节。这将随着未来版本的发布而增加。该磁盘列专为用于光纤通道拓扑结构而设计。


    它是高可用性 (HA)，因为它采用了冗余组件，例如：


    - 磁盘模块

    - 电源

    - 控制器单元


    它支持运行 HP-UX 10.20 TFC 或更高版本的 K 类、D 类、T 类（仅限 600）和 V 类惠普企业服务器。它具有 1.063 Gbps 的光纤通道链路速度，并支持光纤通道仲裁环路（FC-AL）拓扑结构。


    ### 5.7.1 基本拓扑结构


    磁盘列通过 RAID（独立磁盘冗余阵列）技术、全局热备以及冗余、热插拔、客户可更换的磁盘列组件来防止单点故障。许多组件可以在磁盘列通电的情况下由客户移除并更换，而无需将其从机箱中取出也不会丢失数据。支持的
    RAID 级为 5、3、1/0 和 1。不支持 RAID 0 级和单个磁盘单元，因为它们不提供数据冗余。


    磁盘列和主机可以通过多种硬件拓扑结构直接或间接地地连接到惠普 FC-AL 集线器。


    图 5-15 显示了在主机系统上实现的基本拓扑的高可用版本，该系统具有两个主机 FC I/O 适配器连接到双处理器（SP）磁盘列。


    # 基本拓扑结构


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_115_0.png)


    **图 5-15** 基本拓扑结构，高可用版本：带有两个 FC I/O 适配器的主机


    基本拓扑结构的高可用版本可以在 D 类服务器中实现。


    # 基本拓扑结构


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_116_0.png)


    **图 5-16** 基本拓扑结构，高可用版本：带有四个 FC I/O 适配器的主机


    图 5-16 显示了在具有四个主机 FC I/O 适配器的主机上实现的基本拓扑的高可用版本。其中两个 FC 适配器连接到一个双 SP 磁盘列，而另外两个 FC
    适配器连接到第二个双 SP 磁盘列。主机适配器和 SP 的每次连接都会创建一个独立的 FC-AL。在 T 类服务器中可以安装额外的磁盘列和 FC 适配器。


    非高可用版本将主机或服务器连接到一个或多个单 SP 磁盘列。此版本不提供硬件冗余，且无法防止单 SP、FC 电缆、主机 FC I/O 适配器或内部 SCSI-2
    总线故障。如果这些组件中的任何一个故障，磁盘列将不可用，应用程序无法继续运行。在更换故障的硬件组件之前，磁盘列将保持不可用。逻辑磁盘单元（LUN）内的单个磁盘模块故障后，应用程序可以继续运行。


    图 5-17 显示了在 K 类或 T 类上实现的非高可用基本拓扑结构，四个 FC I/O 适配器连接到四个磁盘列中的单 SP。适配器和 SP 之间的每次连接创建一个独立的
    FC-AL。在 T 类服务器中可以安装额外的磁盘列和 FC 适配器。


    # 基本拓扑结构：无高可用


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_117_0.png)


    **图 5-17** 基本拓扑结构，非高可用版本：带有四个 FC I/O 适配器的主机


    到为止涵盖的所有拓扑结构都被认为是基本拓扑结构，且距离限制在 500 米内，因为它们没有包含集线器的使用。在拓扑结构中使用集线器可以增加光纤通道外设距离主机的距离，但请记住它也会增加拓扑结构的复杂性。


    以下图将演示在连接磁盘列时对集线器的使用。集线器的使用不仅增加了距离，还增加了主机的高可用性和可用存储容量。


    # 高可用光纤通道磁盘列


    单系统拓扑结构的每个实例通常使用以下硬件组件：


    - 一个主机系统或服务器

    - 两个 FC I/O 适配器

    - 一个 10 端口 HP FC-AL 集线器 (A3724)

    - 一到四个双 SP 磁盘列（高可用）或一到八个单 SP 磁盘列（非高可用）

    -主机与 FC-AL 集线器以及 FC-AL 集线器与每个磁盘列之间的每次光纤电缆距离最大为 500 米，FC-AL 总长度不超过 5000 米


    一个或两个单系统拓扑结构可以在 D 类或 K 类服务器中实现。


    ## 5.7.2 距离拓扑结构


    图 5-18 显示了单系统拓扑结构。该拓扑结构使用单个 FC-AL 集线器来连接主机和磁盘列。主机通过两个 FC I/O 适配器连接到集线器，每个磁盘列通过一个
    FC 适配器连接到集线器。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_119_0.png)


    **图 5-18** 单系统拓扑


    单系统拓扑结构使用单个 FC-AL 集线器连接主机和磁盘列。主机通过两个 FC I/O 适配器连接到集线器，每个磁盘列通过一个 FC 适配器连接到集线器。该拓扑结构没有为集线器本身提供冗余。如果集线器故障，主机与磁盘列之间的所有通信将丢失。


    ## 5.7.3 高可用拓扑结构


    高可用拓扑结构通过使用冗余的 HP FC-AL 集线器防止 HP FC-AL 集线器单点故障，提高了单系统拓扑结构的可用性。增加第二个 HP FC-AL 集线器还可以增加连接到单个
    FC-AL 的主机和磁盘列的数量。


    '
