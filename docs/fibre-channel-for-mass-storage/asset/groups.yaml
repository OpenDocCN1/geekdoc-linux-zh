  - '[PAGE 144]


    # Glossary


    Gigabit Link Module (GLM) A physical component that manages the functions of the
    FC-0 layer, which are the physical characteristics of the media and interface,
    including driver, transceivers, connectors, and cables. Also referred to as a
    Physical Link Module (PLM).


    Host In the context of peripheral devices, a processor that runs an operating
    system using a disk array for data storage and retrieval.


    Hub A repeater used to connect several nodes in a network. A hub is a concentration
    point for data and repeats data from one node to all other connected nodes.


    LED Light emitting diode.


    Light Emitting Diode A small light on a device that is often used to provide status
    information.


    Link In Fibre Channel, it is two unidirectional fibres transmitting in opposite
    directions and their associated transmitters and receivers that serve as the communication
    media between nodes in a topology. Comparable to a bus in the SCSI protocol.


    Long Wave Lasers or LEDs that emit light with wavelengths around 1300 nm. Long
    wave lasers are used for long Fibre Channel links, from approximately 700 to 10,000
    m. They are typically used with single-mode fiber of a 9 micron core size.


    Loop Address The unique ID of a node in Fibre Channel loop topology, sometimes
    referred to as a Loop ID.


    Loop Port (L_Port) An N_Port or F_Port that supports arbitrated loop functions
    associated with arbitrated loop.


    N_Port A “Node” port. A Fibre Channel defined hardware entity that performs data
    communication over the Fibre Channel link. It is identifiable by a unique Worldwide
    Name. It can act as an originator or a responder.'
  - '[PAGE 145]


    # Port Identifier


    A unique address identifier by which an N_Port is uniquely known. It consists
    of a Domain (most significant byte), an Area, and a Port, each 1 byte long. The
    N_Port identifier is used in the Source Identifier (S_ID) and Destination Identifier
    (D_ID) fields of a Fibre Channel frame.


    # Node


    A physical device that allows for the transmission of data within a network.


    # Originator


    The Fibre Channel N_Port responsible for starting and exchange. Fibre Channel
    term for a SCSI initiator.


    # Point-to-point


    One of three existing Fibre Channel topologies, in which two devices are directly
    connected by a link with no fabric, loop, or switching elements present.


    # Port


    The hardware entity that connects a device to a Fibre Channel topology. A device
    can contain one or more ports.


    # Protocol


    Formal set of rules governing the format, timing, sequencing, and error control
    of exchanged messages on a data network; may also include facilities for managing
    a communications link and/or contention resolution. A protocol may be oriented
    toward data transfer over an interface, between two logical units directly connected,
    or on an end-to-end basis between two users over a large and complex network.
    Both hardware protocols and software protocols can be defined.


    # RAID


    Redundant Array of Independent Disks. A method for configuring multiple disk modules
    into a logical disk unit, which appears to the host system as a single, contiguous
    disk module.


    # RAID-0


    Three or more disk modules bound as striped disks (the disk array reads and writes
    file information with more than one disk at a time). RAID-0 offers enhanced performance
    by using simultaneous I/O to different modules, but does not intrinsically offer
    high availability. For high availability, the striped disks can be software mirrored.
    RAID-0 is not supported and can be accessed only in FE mode.'
