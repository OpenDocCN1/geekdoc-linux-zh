    # 3.1 FC-AL Characteristics


    There are three topologies supported by Fibre Channel: loop, point-to-point, and
    switched. FC-AL is the loop topology that will be discussed here. The FC-AL is
    a means by which to connect two or more (up to 126) devices in a serial loop configuration.
    This solution is considered low cost because it does not use hubs and switches
    in small to medium configurations. It also provides capability to connect to larger
    loops and fabrics where hubs and switches are used.


    In the FC-AL each port discovers when it has been attached to a loop. Addresses
    are assigned automatically on initialization. Access to the loop is arbitrary,
    there are no collisions and there is no single permanent loop master.


    FC-AL permits fair access on a single arbitrated loop. Access fairness means every
    port wanting to initiate traffic will have the opportunity to own the loop and
    initiate traffic before any other port has the opportunity to own the loop for
    the second time.


    # 3.1.1 Types of Loops


    3.1.1.1 FC-AL Private Loop


    A private loop is enclosed and known only to itself. Figure 3-1 demonstrates a
    common configuration used with FC-AL for Fibre Channel Mass Storage. In this example,
    the processor node has only one Fibre Channel host bus adapter (HBA).'
  - '[PAGE 58]


    # FC-AL Characteristics


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_58_0.png)


    Figure 3-1 FC-AL Private Loop


    The processor node is connected to the hub. Then the three devices, in this case
    disk arrays, are connected to the hub and the loop is formed. If the hub is not
    used then the connection with all three disk arrays cannot be made. A connection
    to only one, in point-to-point fashion, could be accomplished. Another option
    would be to install three HBAs into the processor node and connect each to a disk
    array separately.


    The hub then, provides an advantage in saving HBA slots in the processor node
    and allows multiple storage devices to be added to the loop. Currently, this is
    the type of loop configuration Hewlett-Packard supports.'
  - '[PAGE 59]


    # 3.1.1.2 FC-AL Public Loop


    A Public Loop, shown in Figure 3-2, requires a fabric and has at least one FL_Port
    connecting to a fabric. A public loop extends the reach of the loop topology by
    attaching the loop to a fabric. Public loops are a way to leverage the cost of
    one switched connection over many devices in a loop. Connecting a loop to a fabric
    is similar to connecting a local area network (LAN) to a wide network (WAN). The
    fabric is usually represented by a cloud, as shown in Figure 3-3.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_59_0.png)


    Figure 3-2 FC-AL Public Loop'
  - '[PAGE 60]


    # Figure 3-3 FC-AL Fabric


    Hewlett-Packard does not currently support public loops or fabrics.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_60_0.png)'
  - '[PAGE 61]


    # 3.2 Operations of the FC-AL


    # 3.2.1 Primitive Signals


    | Table 3-1 Primitive Signals |

    | --- | --- |

    | ARB(x) | Arbitrate address x for loop control |

    | OPN(y) | Open one other NL_Port<br>- Full duplex<br>- Half duplex |

    | OPN(r) | Replicate<br>- Broadcast<br>- Selective replicate or multicast |

    | CLS | Close the circuit at the NL_Port |

    | MRK(tx) | Synchronization signal ‘t’ from ‘x’ |


    Note:

    The ''x'' is the address of the port wanting to own the loop and the ''y'' is
    the address of the port to be opened.


    Primitive signals are sent by a transmitting port and recognized and acted upon
    by a receiving port. Currently, the MRK signal is not supported by Hewlett-Packard.'
  - '[PAGE 62]


    # 3.2.2 Primitive Sequences


    Primitive sequences are not recognized or acted upon until the third-consecutive
    occurrence of the ordered set. Currently, there are only three primitive sequences
    used:


    +   * LIP Loop Initialization

    * LIPB Loop Port Bypass

    * LPE Loop Port Enable


    The LIP sequence allows for discovery of ports on the loop. This means that when
    a new node is connected to a loop, the LIP sequence discovers it and allows for
    the new node to be initialized on the loop.


    # 3.2.3 Arbitrated Loop Physical Address (AL-PA)


    All ports have a 24-bit native address identifier, called the N_Port ID. The AL-PA
    is in the lower (8) bits of this identifier. The lower the address, the higher
    the priority is for arbitrating. An 8-bit field can have values from 0–255, or
    256 values. However, not all of these are used for physical addresses.


    AL-PA values must have neutral disparity. (Remember that 8B/10B encoding has positive,
    negative, or neutral disparity.) There are only 134 neutral disparity values out
    of the set of 256 8-bit addresses. 126 values, of the 134, are used for port addresses
    and 8 are used for control functions. Hewlett-Packard uses addresses 00-EF. See
    Table 3-2 for further reference.


    The upper 16 bits are non-zero for public ports on a public loop but are zero
    for ports on a private loop. This is how the loop determines whether it is talking
    publicly or privately.'
  - '[PAGE 63]


    # Table 3-2 AL-PA Values


    | Value | Description |

    |---|---|

    | 00 | Reserved for FL_Port (high priority) |

    | 01-EF | Available for active NL_Ports (126 valid neutral disparity values) |

    | F0 | Reserved for access fairness algorithm (lowest priority) |

    | F1-F6 | Invalid |

    | F7 | Used with initialization primitive sequences |

    | F8 | Used with initialization primitive sequences |

    | F9-FE | Reserved (3 valid) |

    | FF | Replicate request (low priority) or to address “ALL” |


    # 3.2.4 Loop States and Operation


    # 3.2.4.1 Operation Overview


    There is a controlled arbitration process for a port to gain control of an arbitrated
    loop. The Open NL_Port selects a destination NL_Port on the loop before a frame
    is transmitted. The arbitrating port releases control of the loop when frame transmission
    is complete.'
  - '[PAGE 64]


    A port gains ownership of the loop by an arbitration process. The port winning
    arbitration sends an OPN primitive to the destination node, and enters the Opened
    state. Upon receiving the OPN primitive, the destination node also enters the
    Opened state. The loop is now in a point-to-point configuration. Either of the
    open ports can now send command or data frames.


    After completing the information exchange, the port that won arbitration sends
    a CLS primitive to the destination port. Both ports now return to the monitoring
    state.


    # 3.2.4.2 The Monitoring State


    After port initialization, all ports start in the monitoring state, the loop is
    idle, no data is being transmitted, and there is no activity. The loop at this
    time is considered to be closed. While in the monitoring state, ports act as repeaters
    and are looking for primitive signals and sequences to act upon. Before any port
    arbitrates for the loop, the loop is filled with Idles.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_64_0.png)


    Figure 3-4 Monitoring or Idle State'
  - '[PAGE 65]


    # 3.2.4.3 The Arbitration Process


    To begin the arbitration process, a port, in this example Port A, sends the primitive
    signal ARB(a) to notify the loop of its intention to own the loop. Port A wins
    arbitration when the ARB(a) is returned to it. Receiving its ARB(a) means no higher
    priority NL_Port needs the loop at this time.


    When Port A wants to acquire the loop, there can be different conditions on the
    loop. For example:


    +   * Some other port may already have control of the loop.

    * Several ports may be trying to acquire the loop at the same time.


    Port A will win when:


    +   * No other port controls the loop, and

    * No port with a lower AL-PA address (higher priority) is arbitrating.


    Once a port has acquired the loop, it opens the loop, preventing all other ports
    from acquiring the loop. It receives and discards all ARB(x) primitive signals.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_65_0.png)


    Figure 3-5 Arbitration Process'
  - '[PAGE 66]


    # 3.2.4.4 The Open State


    In this example, Port A has acquired the loop. It is now in the Open state with
    the loop physically open at Port A. Nothing may be done until Port A has completed
    a circuit with its intended destination, in this example, Port C.


    Port A sends the OPN primitive signal naming C with an OPN(c,a) for full duplex
    or an OPN(c,c) for half duplex. Port C is monitoring the loop, acting as a repeater,
    and listening for any ordered set pertaining to it. Once it receives the OPN primitive
    signal from Port A, it enters the Open state and physically opens the loop at
    its port.


    The loop is now open between Port A and C and is considered to be a point-to-point
    connection.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_66_0.png)


    Figure 3-6 The Opened State'
- md: '

    ## 3.2.4.5 Open Loop


    Both Port A and Port C have opened the loop. Upper level protocol frames and link
    control frames may now be sent back and forth.


    The circuit formed is essentially a point-to-point link between A and C. This
    is a dedicated path for the duration of the transaction.


    Ports B and D are acting as repeaters but are listening for specific ordered sets
    as before.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_67_0.png)


    Figure 3-7 Open Loop


    ## 3.2.4.6 Closing the Loop


    Either one of the Open ports may initiate the closing procedure by sending a CLS
    primitive signal to the other. In this example, Port A initiates the closing by
    sending the CLS signal.


    Once a port has sent a CLS primitive signal, it may not send frames or R_RDYs.
    However, it may still receive frames and R_RDYs.


    The port receiving the first CLS primitive signal, here Port C, does not have
    to close its circuit right away. It may continue to send frames. Once its operation
    is complete, it sends a CLS primitive signal back to the other port, Port A.


    Port C closes when it sends the CLS to Port A and Port A closes when it receives
    the CLS from Port C. The loop is now closed, with both ports returning to the
    monitoring state.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_68_0.png)


    Figure 3-8 Closing the Loop


    Once the loop is closed it returns to the state or condition shown in Figure 3-4.
    There is no activity and all nodes are retransmitting idle signals. When the loop
    is closed, other ports may acquire the loop.


    Access fairness provides other ports on the loop have one chance to acquire the
    loop before the port that just owned the loop can acquire the loop again. Access
    fairness does not imply time fairness. In other words, a port may hold on to the
    loop as long as it is transmitting frames.


    ## 3.3 Hubs


    Hewlett-Packard''s implementation of FC-AL for a private loop includes a hub.
    FC-AL hubs connect devices to the loop. It is a simple way to connect participants
    in a private loop. There are two types of hubs:


    - Passive, which only reacts to ports being inserted into or removed from a loop

    - Active, which are able to do configuration changes dynamically, based on some
    controlling protocol.


    Some hubs can sense or manage configuration changes in the loop, including:


    - knowing when NL_Ports are added

    - knowing when NL_Ports are removed

    - knowing when address changes occur for an entire set of NL_Ports

    - switching NL_Ports into or out of a loop


    Hubs also provide port bypass circuits to “heal” a loop when a device removed
    or fails. This allows for less disruption in operations. Hubs solve the problems
    of cabling devices and keeping track of which loop is on. With central cabling
    by way of the FC-AL hub, it is easy to add and remove devices from arbitrated
    loops.


    There are some definite advantages to using Fibre Channel hub:


    - Extremely fast solution for connecting peripherals and hosts (nodes)

    - Up to 124 NL_Ports per loop

    - Loop topology eliminates wiring clutter

    - FC-AL hubs enhance subsystem availability

    - FC-AL hubs provide port bypass circuits to permit “hot” repair


    ## 3.4 Topologies


    There will be more information about hubs and specifically Hewlett-Packard hubs
    in Chapter Five. However, for now, to demonstrate a couple of topologies using
    hubs see Figures 3-9 and 3-10.


    ### 3.4.1 Cascading Shortwave Hubs


    A server with an FC-AL, short-wave host bus adapter (HBA) can connect to an FC-AL
    hub 500 meters away. Each of the 10 ports on the hub can connect to an FC-AL device
    up to 500 meters away.


    Cascaded hubs use one port on each hub for the hub-to-hub connection and this
    increases the potential distance between nodes in the loop an additional 500 meters.
    In this topology the overall distance is 1500m. Both hubs can support other FC-AL
    devices at their physical locations. Stated distances assume a 50 micron multimode
    cable.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_71_0.png)


    Figure 3-9 Cascaded Shortwave Hub Topology


    ### 3.4.2 Cascading Long-wave Hubs


    Cascaded FC-AL, non-OFC, long-wave hubs use the long-wave port for the hub-to-hub
    connection. Ports 1 through 9 on each long-wave hub are for connections to FC-AL
    devices. When cascading long-wave hubs, only use the long-wave port on each hub
    to connect the hubs. The overall distance in this topology is 11,000 meters. There
    is 500m from the server to the first hub, plus 10,000m between the two long-wave
    hubs, plus 500m from the second hub to the final device.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_72_0.png)


    Figure 3-10 Cascaded Long-wave Topology


    ## Addressing


    This chapter discusses:


    - The limitations of HP-UX

    - Work-arounds

    - Peripheral Device addressing

    - Logical Unit addressing

    - Volume Set addressing


    ### 4.1 The limitations of HP-UX


    As discussed previously, Fibre Channel allows a large number of addresses. However,
    this large number of addresses does not fit seamlessly into the HP-UX operating
    system. To handle the number of addresses, HP-UX uses:


    - Peripheral Device addressing

    - Logical Unit addressing

    - Volume Set addressing


    But first, there are two major limitations that need to be explained.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_75_0.png)


    Figure 4-1 Target Space


    ### 4.1.1 Target Space Limitations


    Parallel SCSI has the capacity to 16 targets (devices) per bus, the controller.
    FC-AL, however, has a much larger number of targets.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_76_0.png)


    Figure 4-2 LUN Space


    ### 4.1.2 LUN Space Limitations


    Parallel SCSI has the capacity to handle LUNs per target. FC-AL, however, has
    a huge potential number of LUNs¹.


    ### 4.1.3 Work-arounds for Target Space Limitations


    In order to address the allowable targets by FC-AL, HP-UX incorporate the use
    of virtual busses.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_77_0.png)


    Figure 4-3 Work-around for Target Space


    ### 4.1.4 Work-arounds for LUN Space Limitations


    In order to address all the LUNs, HP-UX enables LUNs per virtual bus.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_77_1.png)


    Figure 4-4 Work-around for LUN Space


    ## 4.2 Addressing Methods for HP-UX


    As mentioned previously, there are three methods used by HP-UX for Fibre Channel
    addressing in order to work around the HP-UX limitations:


    - Peripheral Device addressing

    - Logical Unit addressing

    - Volume Set addressing


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_78_0.png)


    Figure 4-5 Addressing Methods


    ### 4.2.1 Hardware Path for Fibre Channel Addressing


    Addressing begins as it would on any Hewlett-Packard computer system. The Bus
    converter and HBA addresses have the same format and meanings as on all previous
    Hewlett-Packard products. However, the protocol type, area and port have been
    added for use with Fibre Channel. The protocol type is “8” for mass storage and
    “5” for networking. For Fibre Channel mass storage devices, the protocol type
    will always be “8.”


    The Area is always “0” for private loop. The Port is not always “0” and will be
    covered in following pages.

    '
  mdcn: '


    ## 3.2.4.5 开环路


    端口 A 和端口 C 均已打开环路。现在可以往返发送上层协议帧和链路控制帧。


    所形成的电路本质上是 A 和 C 之间的点对链路。这是在事务期间的专用路径。


    端口 B 和 D 充当中继器，但像以前一样在监听特定的顺序集（ordered sets）。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_67_0.png)


    图 3-7 开环


    ## 3.2.4.6 关闭环路


    打开的端口中的任意一个都可以通过向另一个端口发送 CLS 原语信号来启动关闭程序。在本例中，端口 A 通过发送 CLS 信号启动了关闭。


    一旦端口发送了 CLS 原语信号，它就不能再发送帧或 R_RDYs。然而，它仍然可以接收帧和 R_RDYs。


    接收第一个 CLS 原语信号的端口（在此处为端口 C）不需要立即关闭其电路。它可以继续发送帧。一旦其操作完成，它会向另一个端口端口 A 发回 CLS 原语信号。


    端口 C 在向端口 A 发送 CLS 时关闭，端口 A 在接收到端口 C 的 CLS 时关闭。环路现在已关闭，两个端口都返回监控状态。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_68_0.png)


    图 3-8 关闭环路


    环路一旦关闭，它将回到图 3-4 所示的状态或条件。此时没有活动，所有节点都在重新重发空闲信号。当环路关闭时，其他端口可能会获取环路。


    访问公平性（Access fairness）确保环路上的其他端口在刚刚拥有环路的端口再次获取环路之前，都有机会获取环路。访问公平性并不意味着时间公平。换句话说，只要端口在发送帧，它就可以一直持有环路。


    ## 3.3 集线器


    惠普（Hewlett-Packard）用于私有环路的 FC-AL 实现集线器。FC-AL 集线器将设备连接到环路上。这是连接私有环路参与者的简单方法。集线器有两种类型：


    - 被动式（Passive）：仅对端口插入或从环路中移除做出反应。

    - 主动式（Active）：能够根据某些控制协议动态地执行配置更改。


    某些集线器可以感知或管理环路中的配置更改，包括：


    - 知道 NL_Ports 何时添加

    - 知道 NL_Ports 何时移除

    - 知道整组 NL_Ports 发生地址变化

    - 将 NL_Ports 切入或退出环路


    集线器还提供端口旁路电路，以便在设备移除或故障时“修复”环路。这允许减少操作中的干扰。集线器解决了设备布线和跟踪哪个环路已开启的问题。通过 FC-AL 集线器进行中央布线，可以很容易从仲裁环路上添加和删除设备。


    使用光纤集线器具有某些明确优势：


    - 连接外设和主机（节点）的极快速解决方案

    - 每个环路多达 124 个 NL_Ports

    - 环路拓扑消除了布线混乱

    - FC-AL 集线器增强了子系统的可用性

    - FC-AL 集线器提供端口旁路电路以允许“热”维修


    ## 3.4 拓扑结构


    第五章将提供更多关于集线器特别是惠普集线器的详细信息。然而，现在为了演示使用集线器的拓扑结构，请参见图 3-9 和图 3-10。


    ### 3.4.1 级联短波集线器


    带有 FC-AL 短波主机总线适配器（HBA）的服务器可以连接到 500 米外的 FC-AL 集线器。集线器上的 10 个端口中的每一个都可以连接到远 500
    米的 FC-AL 设备。


    级联集线器使用每个集线器上的一个端口进行集线器之间的连接，这使得环路中节点之间的潜在距离增加了 500 米。在这种拓扑结构中，总距离为 1500 米。两个集线器都可以在其物理位置支持其他
    FC-AL 设备。所述距离假设使用 50 微米多模光缆。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_71_0.png)


    图 3-9 级联短波集线器拓扑


    ### 3.4.2 级联长波集线器


    级联 FC-AL（非 OFC）长波集线器使用长波端口进行集线器之间的连接。每个长波集线器的端口 1 到 9 用于连接到 FC-AL 设备。在级联长波集线器时，仅仅使用每个集线器上的长波端口来连接集线器。这种拓扑结构中的总距离为
    11,000 米。从服务器到第一个集线器为 500 米，两个长波集线器之间为 10,000 米，从第二个集线器到最后一个设备为 500 米。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_72_0.png)


    图 3-10 级联长波拓扑


    ## 路由


    本章讨论了：


    - HP-UX 的局限性

    - 变通（Work-arounds）

    - 外设设备路由

    - 逻辑单元路由

    - 卷集（Volume Set）路由


    ### 4.1 HP-UX 的局限性


    如前所述，光纤允许大量的地址。然而，这些大量的地址无法无缝地到 HP-UX 系统中。为了处理这些地址，HP-UX 使用：


    - 外设设备路由

    - 逻辑单元路由

    - 卷集路由


    但在之前，需要解释两个主要的局限性。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_75_0.png)


    图 4-1 目标空间


    ### 4.1.1 目标空间局限性


    并行 SCSI 每个总线（控制器）支持 16 个目标（设备）。然而，FC-AL 有数量庞大的目标。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_76_0.png)


    图 4-2 逻辑单元空间


    ### 4.1.2 逻辑单元空间局限性


    并行 SCSI 每个目标支持处理 LUN。然而，FC-AL 有巨大的潜在 LUN 数量¹。


    ### 4.1.3 目标空间的变通方法


    为了通过 FC-AL 处理允许的目标，HP-UX 引入了虚拟总线的使用。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_77_0.png)


    图 4-3 目标空间的变通


    ### 4.1.4 逻辑单元空间的变通方法


    为了处理所有的 LUN，HP-UX 在每个虚拟总线上启用了 LUN。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_77_1.png)


    图 4-4 逻辑单元空间的变通


    ## 4.2 HP-UX 的路由方法


    如前文所述，HP-UX 使用三种方法进行光纤路由，以绕过 HP-UX 的局限性：


    - 外设设备路由

    - 逻辑单元路由

    - 卷集路由


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_78_0.png)


    图 4-5 路由方法


    ### 4.2.1 光纤路由的硬件路径


    路由始与在任何惠普计算机系统中一样开始。总线转换器和 HBA 地址的格式和含义与之前所有的惠普产品相同。然而，增加了协议类型、区域和端口供光纤使用。协议类型“8”代表海量存储，“5”代表网络。对于光纤通道存储设备，协议类型始终为“8”。


    对于私有环路，区域始终为“0”。端口并不总是“0”，将在随后的页面中介绍。


    '
