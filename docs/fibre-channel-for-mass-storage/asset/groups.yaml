    ## 3.1 FC-AL 特性


    光纤通道（Fibre Channel）支持三种拓扑结构：环、点对点和交换。FC-AL 是此处讨论的环形拓扑。FC-AL 是一种以串行环路配置连接两个或多个（最多
    126 个）设备的方法。该方案被认为是低成本的，因为它在小型到中配置中不需要集线器和交换机。它还提供了连接到使用集线器和交换机的更大环路和架构的能力。


    在 FC-AL 中，每个端口在连接到环路时都会发现。地址在初始化时自动分配。对环路的访问是随机的，没有冲突，且没有单一的永久环路主。


    FC-AL 允许在单一仲裁环上进行公平访问。访问公平性意味着每个想要启动流量的端口都有机会拥有环路并启动流量，而在任何其他端口第二次拥有环路之前。


    ### 3.1.1 环的类型


    ### 3.1.1.1 FC-AL 私有环


    私有环是封闭的，仅对自身可见。图 3-1 展示了用于光纤通道存储常用的 FC-AL 配置。在此例中，处理器节点只有一个光纤通道主机总适配器（HBA）。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_58_0.png)


    图 3-1 FC-AL 私有环


    处理器节点连接到集线器。然后，三个设备（在此例中为磁盘阵列）连接到集线器形成环路。如果不使用集线器，则无法与三个磁盘阵列建立连接。只能以点对点的方式与其中一个建立连接。另一种选项是在处理器节点中安装三个
    HBA，并将它们分别连接到每个磁盘阵列。


    此时，集线器提供了节省处理器节点中 HBA 槽位的优势，并允许向环路添加多个存储设备。目前，这是惠尔公司（Hewlett-Packard）支持的环配置类型。


    ### 3.1.1.2 FC-AL 公有环


    图 3-2 所示的公共环需要一个架构（fabric），并至少有一个 FL_Port 连接到架构。公共环通过将环路连接到架构来扩展环拓扑的范围。公共环是一种利用一个交换连接覆盖环路内多个设备的成本的方法。将环路连接到架构类似于将局域网（LAN）连接到广域网（WAN）。架构通常用云表示，如图
    3-3 所示。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_59_0.png)


    图 3-2 FC-AL 公有环


    ### 图 3-3 FC-AL 架构


    惠尔公司目前不支持公共环或架构。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_60_0.png)


    ## 3.2 FC-AL 的操作


    ### 3.2.1 原生信号


    | 表 3-1 原生信号 |

    | --- | --- |

    | ARB(x) | 为环路控制仲裁地址 x |

    | OPN(y) | 打开另一个 NL_Port<br>- 全双工<br>- 半双工 |

    | OPN(r) | 复制<br>- 广播<br>- 选择性复制或多播 |

    | CLS | 关闭 NL_Port 处的电路 |

    | MRK(tx) | 来自 ‘x’ 的同步信号 ‘t’ |


    注意：

    ‘x’ 是想要拥有环路的端口地址，‘y’ 是要打开的端口地址。


    原生信号由发送端口发送，并由接收端口识别和处理。目前，惠尔公司不支持 MRK 信号。


    ### 3.2.2 原生序列


    原生序列在有序集连续出现第三次之前不会被识别或处理。目前仅使用三种原生序列：


    - LIP 环路初始化（Loop Initialization）

    - LIPB 环路端口旁过（Loop Port Bypass）

    - LPE 环路端口启用（Loop Port Enable）


    IP 序列允许发现环路上的端口。这意味着当一个新节点连接到环路时，LIP 序列会发现它并允许新节点在环路上进行初始化。


    ### 3.2.3 仲裁环路物理地址 (AL-PA)


    所有端口都有一个 24 位的原生地址标识符，称为 N_Port ID。AL-PA 位于该标识符的低（8）位。地址越低，仲裁优先级越高。8 位字段可以取从 0–255
    的值，即 256 个值。然而，并非所有这些值都用于物理地址。


    AL-PA 值必须具有中性失真（请记住，8B/10B 编码具有正性、负性或中性失真度）。在 256 个 8 位地址中，只有 134 个中性失真值。134 个值中的
    126 个用于端口地址，8 个用于控制功能。惠尔公司使用地址 00-EF。更多参考信息请参阅表 3-2。


    （此处重复原文段落：AL-PA 值必须具有中性失真。（请记住，8B/10B 编码具有正性、负性或中性失真度）。在 256 个 8 位地址中，只有 134 个中性失真值。134
    个值中的 126 个用于端口地址，8 个用于控制功能。惠尔公司使用地址 00-EF。更多参考信息请参阅表 3-2。）


    AL-PA 的高 16 位为零。


    ### 表 3-2 AL-PA 值


    | 值 | 描述 |

    | --- | --- |

    | 00 | 预留控制功能 |

    | 01-EF | 用于端口地址 |

    | F0 | 预留控制功能 |

    | F1-F6 | 用于端口地址（等待，F7 在下方） |

    | F7 | 预留 |

    | F9-FE | 用于端口地址 |

    | FF | 预留控制功能 |


    ## 3.2.4 环状态


    ### 3.2.4.1 操作概述


    在仲裁环中，端口通过向目标发送 OPN 信号来获取环路。接收 OPN 信号后，目标进入打开（Open）状态并在物理上在其端口处打开环路。


    ### 3.2.4.2 监控状态


    在端口初始化后，所有端口处于监控状态，环路空闲的，没有数据传输。在监控状态下，端口充当继器并监听有序集。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_64_0.png)


    图 3-4 监控或空闲状态


    ### 3.2.4.3 仲裁过程


    为了开始仲裁过程，端口（在此例中为端口 A）发送原生信号 ARB(a) 通知环路其拥有环路的意图。当返回 ARB(a) 时，A 赢得胜利。当端口想要获取环路时，环路上可能存在不同的情况：


    - 其他端口可能已经控制了环路。

    - 多个端口可能同时尝试获取环路。


    A 在以下情况下赢得：


    - 没有其他端口控制环路，且

    - 没有 AL-PA 地址较低（优先级更高）的端口正在仲裁。


    一旦端口获取了环路，它就会打开环路，防止所有其他端口获取环路。它接收并丢弃所有原生信号 ARB(x)。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_65_0.png)


    图 3-5 仲裁过程


    ### 3.2.4.4 打开状态


    在此例中，端口 A 已获取环路。它现在处于打开（Open）状态，环路在端口 A 处物理打开。在端口 A 与预期目标（在此例中为端口 C）完成电路之前，无法进行任何操作。


    端口 A 发送命名 C 的 OPN 原生信号，全双工使用 OPN(c,a)，半双工使用 OPN(c,c)。端口 C 监控环路，作为继器并监听有序集。一旦收到来自
    A 的 OPN 原生信号，它进入打开状态并在端口处物理打开环路。


    环路现在在 A 和 C 之间打开，被视为点对点连接。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_66_0.png)


    图 3-6 打开状态


    '
