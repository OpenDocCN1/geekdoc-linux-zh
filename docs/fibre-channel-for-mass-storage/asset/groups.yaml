    of single mode to multimode or the reverse. However, the keying of the connectors
    is not perfect nor completely standardized. Also, multimode-fiber optic cable
    does not work with single mode transmitters and receivers. The single mode light
    “rattles around” in the big 50 or 62.5 um fibers and dissipates quickly, causing
    data loss.


    Currently, Hewlett-Packard only supports fiber optic cable with its use of Fibre
    Channel and therefore only the SC connectors shown in Figure 2-5.


    The Fibre Channel standard does provide connections to co-ax and proper cabling.


    For co-ax cable:


    - * the TNC for receive

    - * the BNC for transmit


    For copper cable the shielded twisted-pair (STP), 9-pin D-type connector (DB9),
    is used. To prevent accidental attachments, the middle five holes in the Fibre
    Channel DB9 female connector are filled.


    ## 2.2.2 Fiber Optic Cables


    Figure 2-6 shows a typical fiber cable and its major components. The light travels
    through the core, the smallest component. The core is covered, or surrounded,
    by a material called cladding. Its purpose is to keep the light in the core, not
    let it escape.


    | POLYURETHANE |

    | OUTER JACKET |

    | STRENGTH | MEMBERS |


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_41_0.png)


