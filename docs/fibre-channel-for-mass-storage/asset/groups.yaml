  - '[PAGE 97]


    # 5.1.3.2 Description


    The HPFC-5100, Tachyon TL, is a second-generation controller that leverages HP''s
    extensive experience in Fibre Channel, established with the original TACHYLON
    controller. Tachyon TL carries forward the assurance of interoperability and true
    Fibre Channel performance. Tachyon TL focuses on mass storage applications that
    require FC-AL, Class 3 and 2 (ACK0), and SCSI upper layer protocol handling. Coupled
    with a high performance 32/64-bit PCI bus interface, Tachyon TL provides a cost-effective,
    high performance mass storage solution.


    Tachyon TL continues with the TACHYLON architecture, a complete hardware-based
    state machine design. This architecture avoids on-chip microprocessor performance
    issues of a single processing resource, processor cycles per second, and access
    times to firmware. Rather, the TACHYLON architecture is designed to realize the
    full potential of Fibre Channel. Tachyon TL provides the highest levels of concurrency
    by way of numerous independent functional blocks providing parallel processing
    of data, control and commands. In addition, these blocks process at hardware speeds
    versus firmware speeds and automate the entire SCSI I/O in hardware. The result
    is minimized latency and I/O overhead, with the highest levels of parallelism
    to provide maximum I/O rates and bandwidth.


    # 5.1.3.3 FC-AL Features


    In addition to the high performance architecture, Tachyon TL offers second generation
    Fibre Channel features, such as Public Loop, Loop Status, multiple I/O''s in the
    same loop arbitration cycle, loop map, loop broadcast, and loop directed reset.
    These features allow the designer to achieve higher performance in an arbitrated
    loop topology.'
