    # 5.7 High Availability Fibre Channel Disk Array


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_113_0.png)


    Figure 5-14 A3661A HA FC Disk Array


    This Fibre Channel peripheral has substantial storage capacity. It will hold up
    to 30 disk modules. Hewlett-Packard’s highest capacity point is 18 gigabytes per
    disk module. This will increase with future releases. This disk array was designed
    specifically for use in Fibre Channel topologies.


    It is High Availability (HA) because it employs redundant components such as:


    +   * disk modules

    * power supplies

    * controller units'
  - '[PAGE 114]


    It is supported by the K-, D-, T- (600 only), and V-Class Hewlett-Packard Enterprise
    Servers running HP-UX 10.20 TFC or later. It has 1.063 gigabit per second optical
    Fibre Channel link speed and Fibre Channel Arbitrated Loop (FC-AL) topology is
    also supported.


    # 5.7.1 Basic Topology


    The disk array protects against single points of failure with RAID (Redundant
    Array of Independent Disks) technology, global hot spares, and redundant, hot-swappable,
    customer-replaceable disk array components. Many of the components can be removed
    and replaced by the customer while the disk array is powered up, without removing
    it from the cabinet and without losing data. The RAID levels supported are 5,
    3, 1/0, and 1. RAID level 0 and individual disk units are not supported because
    they provide no data redundancy.


    Disk arrays and hosts can be directly or indirectly connected to Hewlett-Packard
    FC-AL Hubs in a number of hardware topologies.


    Figure 5-15 shows the high availability version of the basic topology implemented
    on a host system with two host FC I/O adapters connected to a dual-SP disk array.'
