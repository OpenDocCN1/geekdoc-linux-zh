    50 m, 100 m, and 500 m. The maximum combined cable lengths for all segments, that
    is, the total length of the FC-AL, should not exceed 5000 m because

    performance can degrade due to propagation delay. Because of this it is recommended

    t the total cable length of the FC-AL be as short as possible. Fibre

    optic cables in lengths of 2 m, 16 m, 50 m and 100 m cables can be ordered

    from Hewlett-Packard. Fibre optic cables longer than 100 m must be custom-

    fabricated for each implementation.


    # 5.7.4 High Availability, Distance, and Capacity Topology


    The high availability, distance, and capacity topology expands on the high

    availability topology by using cascaded HP FC-AL Hubs to increase the distance-

    te of each FC-AL and the number of devices that can be interconnected on

    the FC-AL. Cascaded HP FC-AL Hubs are two HP FC-AL Hubs connected

    together.


    Each instance of this topology uses the following hardware components:


    +   * Up to four host systems or servers

    * Two FC I/O adapters per host

    * Two pairs of cascaded 10-port HP FC-AL Hubs

    * Two SPs per disk array

    * Maximum of nine dual-SP disk arrays

    * Maximum 500 m fibre optic cable distance on each connection between

    each host and FC-AL Hub and between each HP FC-AL Hub and disk

    array, for a total FC-AL cable length not to exceed 5000 m


    The high availability topology, this topology supports high availability

    by redundant FC-ALs. If a hardware component (FC adapter, HP FC-AL

    Hub, SP or cables) in one FC-AL fails, I/O communication between hosts and

    disk arrays can continue through the other FC-AL.'
