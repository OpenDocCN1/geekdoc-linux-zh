    \ to 2112 bytes, the first 64 of which can be used for optional headers.\n"
  mdcn: "\n\n# 光通道的未来\n\n本章讨论了：\n\n- * 光通道的未来发展与改进\n- 从何获取有关光通道的更多信息\n\n## 6.1 未来增强\n\
    \n光通道正在快速演进，新元素不断被定义。这些新元素将产生更强大的架构，以支持大规模存储。\n\n到目前为止，定义光通道物理标准（FC-PH）的大部分工作已经完成。尽管该领域会有更多工作，但定义标准的大量工作将在\
    \ FC-3 和 FC-4 层级完成。\n\n### 6.1.1 前景\n\n### 6.1.1.1 更快的光纤速率\n\n2+ Gbps 和 4+ Gbps\
    \ 等更快的光通道速率仍处于理论阶段。然而，一旦实施，它们将极大提高吞吐量。由于惠普将光通道作为其未来技术的一部分，公司正继续生产芯片和其他组件以支持更快速的数据传输。\n\
    \n### 6.1.1.2 寻道组 (Hunt Groups)\n\n对寻道组及其如何或应该运行提供更多、更好的定义。寻道组可以通过将帧发送到节点上的备用端口来增加吞吐量，消除忙的\
    \ N_Port 阻塞通信的可能性。\n\n### 6.1.1.3 多播组\n\n正如第二章 FC-3 通用服务部分所述，FC-3 层允许将单个信息单元传输到节点上的多个\
    \ N_Port。多播组随后可以通过高效地复制要发送到多个 N_Port 的帧来增加吞吐量。这大致等于一个人使用广播语音邮件或电子邮件分发列表。\n\n###\
    \ 6.1.1.4 服务类别 (Classes of Service)\n\n将添加新的服务类别。它们可能处理语音或视频，在提供新的通信可能性的同时，对架构提出新的需求。\n\
    \n### 6.1.1.5 其他可能的增强\n\n其他增强可能会解决 FC-AL 标准中的问题，或者出现在网络管理改进领域。以下列表包含了一些其他可能的改进：\n\
    \n- * 改进的流控制\n- 低级错误恢复\n- 空间复用 —— 环路上的同时进行多项对话\n- 全帧缓冲\n- 网络管理\n  - 拓扑识别\n  -\
