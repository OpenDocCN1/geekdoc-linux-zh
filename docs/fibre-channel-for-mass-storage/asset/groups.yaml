    # 5.8 SCSI Multiplexer


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_127_0.png)


    **Figure 5-22** A3308A SCSI Multiplexer


    Most data centers today are using SCSI technology. Peripheral devices are attached
    to their host systems through SCSI cables connected to SCSI host bus adapters
    (HBAs). To use FC technology, however, each system must be able to “speak Fibre
    Channel.” Meeting this requirement usually means expensive purchases and time-consuming
    conversion, migration of data, and installation of FC-compatible hardware systems
    and peripherals.


    Hewlett-Packard''s solution to this concern is the Fibre Channel SCSI Multiplexer
    (FC-SCSI MUX). The FC-SCSI MUX allows an FC host to use FC technology to transmit
    data to SCSI device types. Using the FC-SCSI MUX, customers can extend the distance
    between a host and peripherals and expand the number of SCSI devices connected
    to the host.


    The MUX multiplexes the inputs and outputs from a single FC connection, HBA, to
    as many as four SCSI busses. Since each bus can support up to 15 devices, one
    MUX, theoretically, can support up to 60 devices (with varying levels of performance).'
  - '[PAGE 128]


    The FC-SCSI MUX permits multiple SCSI mass storage devices to participate in the
    Fibre Channel architecture. Currently, up to eight SCSI IDs can be connected through
    the SCSI MUX and communicate with the host through a single Fibre Channel link.


    The advantage this device affords is to be able to attach existing SCSI devices
    to a Fibre Channel mass storage network. Currently Digital Linear Tape (DLT) libraries
    are supported, however disk and other SCSI devices will be supported with future
    releases.


