    \ The second adapter in each host and the second SP in each disk array connect\
    \ to the second HP FC-AL Hub, cabled into a separate FC-AL. This creates two redundant\
    \ FC-ALs.\n\nBecause each HP FC-AL Hub has ten ports, either two hosts and eight\
    \ disk arrays or four hosts and six disk arrays can attach to each HP FC-AL Hub.\
    \ If any hardware component (SP, host FC I/O adapter, HP FC-AL Hub, or fibre optic\
    \ cable) fails in one FC-AL, the I/O communication between hosts and disk arrays\
    \ can continue through the other FC-AL.\n\nSupported cable lengths for each segment\
    \ of the FC-AL include 2 m, 16 m, 50 m, 100 m, and 500 m. The maximum combined\
    \ cable lengths for all segments, that is, the total length of the FC-AL, should\
    \ not exceed 5000 m because performance can degrade due to propagation delay.\
    \ Because of this it is recommended that the total cable length of the FC-AL be\
    \ as short as possible. Fibre optic cables in lengths of 2 m, 16 m, 50 m and 100\
    \ m cables can be ordered from Hewlett-Packard. Fibre optic cables longer than\
    \ 100 m must be custom-fabricated for each implementation.\n\n## 5.7.4 High Availability,\
    \ Distance, and Capacity Topology\n\nThe high availability, distance, and capacity\
    \ topology expands on the high availability topology by using cascaded HP FC-AL\
    \ Hubs to increase the distance of each FC-AL and the number of devices that can\
    \ be interconnected on the FC-AL. Cascaded HP FC-AL Hubs are two HP FC-AL Hubs\
    \ connected together.\n\nEach instance of this topology uses the following hardware\
    \ components:\n\n- Up to four host systems or servers\n- Two FC I/O adapters per\
    \ host\n- Two pairs of cascaded 10-port HP FC-AL Hubs\n- Two SPs per disk array\n\
    - Maximum of nine dual-SP disk arrays\n- Maximum 500 m fibre optic cable distance\
    \ on each connection between each host and FC-AL Hub and between each HP FC-AL\
    \ Hub and disk array, for a total FC-AL cable length not to exceed 5000 m\n\n\
    The high availability topology, this topology supports high availability by redundant\
    \ FC-ALs. If a hardware component (FC adapter, HP FC-AL Hub, SP or cables) in\
    \ one FC-AL fails, I/O communication between hosts and disk arrays can continue\
    \ through the other FC-AL.\n\nThe increased distance is supported by using 10\
