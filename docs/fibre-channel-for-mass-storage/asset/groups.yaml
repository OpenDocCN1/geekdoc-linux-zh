    # 5.9 FC Switch


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_129_0.png)


    Figure 5-24 Front view of the Hewlett-Packard FC Switch.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_129_1.png)


    Figure 5-25 Back view of the Hewlett-Packard Fibre Channel Switch


    The is capable of allowing Fibre Channel connections to either Private Loops (arbitrated
    loops), or to Fibre Channel Fabric. EPL (Emulated Private Loop), also known as
    QL (Quick Loop) will be available at first release, and supported on HP-UX 11.0
    and HP-UX 10.20 with the appropriate patches. This mode is used to support legacy
    systems and peripherals previously supported on existing HP-UX 11.0 operating
    systems. The Fabric support will not be available until the release of HP-UX 11.01,
    or greater.


    The first release will support legacy systems, such as K-Class, D-Class, T-Class,
    and V-Class, running the above-mentioned HP-UX 10.20 or 11.0 operating systems.
    The host systems will use the existing A3404A, A3636A, A3591B, and A3740A Fibre
    Channel adapters. Once HP-UX 11.01 is available, the FC Switch will be supported
    using the A5157A dual Tachyon TL Fibre Channel adapter, and the A518A single Tachyon
    TL Fibre Channel adapter.'
  - '[PAGE 130]


    These two new adapters are PCI-based, and will be used in the V2500 and

    4000 SPU platforms, on HP-UX 11.01 now.


    The Gigabit Fibre Channel Switch will be available in a 16 port configura-

    tion (the units with no GBICs installed), From one to four GBIC options

    be used, but at least one must be ordered. Each GBIC option provides four

    GBICs (Gigabit Interface Converter) which are installed into any desired empty

    position in the switch. It is possible to use either shortwave, or long-wave GBIC

    optics. No more than one long wave option may be used at this time.


    Use of the long-wave GBIC has limited applications at this time, and any

    customer wanting to use the long-wave GBIC should request configuration

    astistance to avoid unsupported/unsupportable configurations which would

    impair their ability to use this as a SAN (Storage Area Network) solution. The

    abit Fibre Channel Switch is non-Cascade product, meaning only one

    witch may be used per host connection(s). Multiple hosts may be connected to

    a single switch.


    There is a limit to the number of hosts that can be attached to a single

    switch. Please reference the Server Configuration Guide on the Hewlett-Packard

    public Web site at www.hp.com.


    The Gigabit Fibre Channel Switch can be used to connect 16 Fibre Channel

    devices together (consult the Server Configuration Guide for supported config-

    rations). Devices may be either a direct attachment to the switch (as in a Host

    system, or a Fibre Channel peripheral); or may be through an FC-AL Hub (pro-

    vides a local loop at that particular attachment); or by way of an FC-SCSI Mul-

    tlexer for certain tape or disk configurations (see the Server Configuration

    Guide).


    Only one loop connection may be used per Hub. There is a limit of one

    loop master per Fabric Port. If more than one loop master (FL Port) is used, one

    will remain inactive (be wasted) until such time as the original FL port fails.
    At

    first release, the Fibre Channel Switch will only support EMC disk arrays. Other

    models of disk arrays, and other mass storage will be supported at a later date.

    One example is shown below.'
  - '[PAGE 131]


    # Maximum Configuration allowed with EMC ARRAYS and HP FC SWITCHES


