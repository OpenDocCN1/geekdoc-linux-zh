    Figure 2-8 shows what happens when the bend radius of fiber cable is exceeded.
    The maximum bend radius is 3 cm. If the cabling is bent beyond 3 cm, data loss
    or data corruption is likely to occur. The core fiber may also crack or break.


    ### 2.2.2.1 OFC and non-OFC


    Open Fibre Control (OFC) is a safety feature used to prohibit the laser light
    from functioning when there is a break or disconnect in the fiber cable. This
    is used specifically with high intensity laser lights. Hewlett-Packard uses non-OFC
    because the lasers are of low intensity. Therefore, the laser light is not turned
    off when there is a disconnect. However, this does not mean you should look at
    or point the fiber cable directly at your eye, since there could still be some
    damage. When checking a fiber cable to see if a laser light exists, point the
    cable end at a white piece of paper. If a red dot appears on the paper, then the
    transmitting laser is functioning.


    ### 2.2.2.2 Wavelength


    Wavelength is a topic related to single and multimode connectors. Long wave lasers
    are used for long Fibre Channel links, from approximately 500 to 10,000 meters.
    They are typically used with single mode fiber of a 9-micron size.


    Short wave lasers are used for FC-AL links up to approximately 500 meters. They
    are typically used with multimode fiber. The preferred fiber core size is 50-micron.
    62.5-micron core size is also supported for compatibility with existing FDDI installations.
    However, fiber of this type has smaller bandwidth and, in this case, the distance
    is limited by the fiber bandwidth. The length recommendation for the 62.5-micron
    fiber cable is 175 meters.


    When pulling new cable, it is recommended that the customer pull both 9- and 50-micron
    cable to accommodate future expansion.


