    \ 7 | Building 2 |\n| Host 3 | Disk 8 | Building 2 |\n| Host 4 | Disk 9 | Building\
    \ 2 |\n\nFigure 5-21 Campus Topology\n\n## 5.8 SCSI Multiplexer\n\n![](img/92bf92f19abc8dc2f49e0cf07e857a0c_127_0.png)\n\
    \nFigure 5-22 A3308A SCSI Multiplexer\n\nMost data centers today are using SCSI\
    \ technology. Peripheral devices are attached to their host systems through SCSI\
