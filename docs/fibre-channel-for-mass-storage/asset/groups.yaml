    \ 用于存储的光纤通道\nRalph H. Thornburgh\n\n通过光纤通道，您可以轻松将存储系统从 GB 扩展到 TB，并同时提高性能，而不会影响系统、网络或应用程序。《用于存储的光纤通道》逐步介绍了光纤通道的基础，并演示了如何部署惠普的光纤通道产品来解决您的企业挑战。内容包括：\n\
