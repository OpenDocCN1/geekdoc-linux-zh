    图 1-3 点对点拓扑


    这种特定的拓扑使用了两个节点（每个节点必须至少有一个端口），节点之间通过一条链路或电缆连接。点对点连接保证了即时访问，且不受任何其他节点或应用程序的干扰。


    如果外围节点（如磁盘阵列）有两个 N_Port，则对磁盘阵列的访问可以在两个计算机系统之间共享。例如，磁盘阵列可以作为两个计算机系统的公共软件库。这被认为是两个点对点连接。见图
    1-4。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_29_1.png)


    图 1-4 两个点对点连接


    ## 拓扑结构


    点对点连接也可以被视为双节点环。惠普（Hewlett-Packard）对点对点的实现是一个双节点环。这引出了我们下一个讨论的下种拓扑。


    ## 1.6.2 仲裁环


    一种被称为光纤通道授权环（FC-AL）的环路可以有多达 127 个端口串联（一个接一个），环绕一圈回到起点。例如，节点 1 的发送器连接到节点 2 的接收器，节点
    2 的发送器连接到节点 3 的接收器，以此此类推，直到最后一个节点的发送器连接到节点 1 的接收器，从而完成环路。图 1-5 阐释了这个示例。


    节点环端口（NL_Port）在环上赢得仲裁，并与环上的另一个 NL_Port 建立连接。在连接建立时，它被认为是一个对点连接或双节点环。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_30_0.png)


    图 1-5 仲裁环拓扑


    在仲裁环中，任何时刻只有两个连接的端口可以通信。所有其他端口都充当中继器。当两个连接端口之间的通信结束时，环路将变为可仲裁状态，并可以建立新连接。仲裁提供了公平性，以确保所有端口的平等访问。FC-AL
    的特性、操作以及惠普的实现将在第 3 章详细讨论。


    ## 1.6.3 交换拓扑或矩阵（Fabric）


    交换拓扑使用了矩阵（Fabric）的概念。矩阵是连接的网格。当连接到矩阵时，单个 N_Port 可以访问其余所有部分，包括环的成员。


    与 FC-AL 拓扑不同，矩阵内部可以建立许多连接。它可以类比为电话系统，其中许多通话可能同时进行。


    任何节点都可以通过链路通过 N 或 NL 端口连接到矩阵。矩阵中的端口被称为 F_Port。N_Port 连接到 F_Port。如果 NL_Port 连接到矩阵，则矩阵端口就是
    FL_Port。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_31_0.png)


    图 1-6 矩阵拓扑


    ## 1.6.4 典型的校园拓扑


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_32_0.png)


    **图 1-7** 典型光纤通道校园拓扑


    校园拓扑无非将建筑物连接起来，以便数据可以从一栋建筑的计算机系统传输到另一栋建筑的存储设备（无论是磁盘存储、用于备份的磁带存储或其他设备）。


    使用现有技术，这些建筑之间的距离可以达到 10,000 米。这种拓扑结构将包含通过 9 微米（um）电缆连接的两个长波集线器。前提是电缆的测得信号强度损耗小于
    9 db。


