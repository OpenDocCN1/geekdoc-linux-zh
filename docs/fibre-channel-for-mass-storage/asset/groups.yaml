    ## 5.9 FC Switch


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_129_0.png)


    Figure 5-24 Front view of the Hewlett-Packard FC Switch.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_129_1.png)


    Figure 5-25 Back view of the Hewlett-Packard Fibre Channel Switch


    The switch is capable of allowing Fibre Channel connections to either Private
    Loops (arbitrated loops), or to Fibre Channel Fabric. EPL (Emulated Private Loop),
    also known as QL (Quick Loop) will be available at first release, and supported
    on HP-UX 11.0 and HP-UX 10.20 with the appropriate patches. This mode is used
    to support legacy systems and peripherals previously supported on existing HP-UX
    11.0 operating systems. The Fabric support will not be available until the release
    of HP-UX 11.01, or greater.


    The first release will support legacy systems, such as K-Class, D-Class, T-Class,
    and V-Class, running the above-mentioned HP-UX 10.20 or 11.0 operating systems.
    The host systems will use the existing A3404A, A3636A, A3591B, and A3740A Fibre
    Channel adapters. Once HP-UX 11.01 is available, the FC Switch will be supported
    using the A5157A dual Tachyon TL Fibre Channel adapter, and the A518A single Tachyon
    TL Fibre Channel adapter.


    These two new adapters are PCI-based, and will be used in the V2500 and 4000 SPU
    platforms, on HP-UX 11.01 now.


    The Gigabit Fibre Channel Switch will be available in a 16 port configuration
    (the units with no GBICs installed). From one to four GBIC options can be used,
    but at least one must be ordered. Each GBIC option provides four GBICs (Gigabit
    Interface Converter) which are installed into any desired empty position in the
    switch. It is possible to use either shortwave, or long-wave GBIC optics. No more
    than one long wave option may be used at this time.


    Use of the long-wave GBIC has limited applications at this time, and any customer
    wanting to use the long-wave GBIC should request configuration assistance to avoid
    unsupported/unsupportable configurations which would impair their ability to use
    this as a SAN (Storage Area Network) solution. The Gigabit Fibre Channel Switch
    is a non-cascade product, meaning only one switch may be used per host connection(s).
    Multiple hosts may be connected to a single switch.


    There is a limit to the number of hosts that can be attached to a single switch.
    Please reference the Server Configuration Guide on the Hewlett-Packard public
    Web site at www.hp.com.


    The Gigabit Fibre Channel Switch can be used to connect 16 Fibre Channel devices
    together (consult the Server Configuration Guide for supported configurations).
    Devices may be either a direct attachment to the switch (as in a Host system,
    or a Fibre Channel peripheral); or may be through an FC-AL Hub (provides a local
    loop at that particular attachment); or by way of an FC-SCSI Multiplexer for certain
    tape or disk configurations (see the Server Configuration Guide).


    Only one loop connection may be used per Hub. There is a limit of one loop master
    per Fabric Port. If more than one loop master (FL Port) is used, one will remain
    inactive (be wasted) until such time as the original FL port fails. At first release,
    the Fibre Channel Switch will only support EMC disk arrays. Other models of disk
    arrays, and other mass storage will be supported at a later date. One example
    is shown below.


    ## Maximum Configuration allowed with EMC ARRAYS and HP FC SWITCHES


    | S P U | S P U | S P U | S P U | S P U | S P U | S P U | S P U |

    |---|---|---|---|---|---|---|---|

    | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_131_0.png)


    | FC Director #1 | FC Director #2 | FC Director #3 | FC Director #4 | FC Director
    #1 | FC Director #2 | FC Director #3 | FC Director #4 |

    |---|---|---|---|---|---|---|---|

    | EMC ARRAY #1 | EMC ARRAY #2 |


    Figure 5-26 Example of FC Switch Configuration


    The Gigabit Fibre Channel Switch operates as multiple channels, and is capable
    of providing up to eight concurrent connections. Each connection is capable of
    operating at the full 1 Gigabit speed. This is a significant improvement as current
    solutions have a single loop, which has a total speed of 1 Gigabit, which is shared
    between all of the attached devices.


    The Gigabit Fibre Channel Switch will allow a higher transfer rate, while providing
    a bridge between the current Fibre Channel solutions customers have bought, and
    providing a link to the capabilities to be offered in the future. The Gigabit
    Fibre Channel Switch initially will be supported in many configurations, but will
    be restricted, for support reasons, to no more than two switches (not cascaded)
    for cluster/configuration.


    ## FC Switch


    There will also be a limit of no more than eight hosts allowed per pair of switch.
    This is a High Availability (HA) path configuration to maximize the availability
    of the host and mass storage. See Figure 5-26. The initial release will target
    legacy Fibre Channel devices and disk arrays. Other mass storage will be announced
    as testing is completed. The complexity of the switch becomes very quickly; as
    such, it is strongly advised that configurations not specified in the HP-UX Configuration
    Guide NOT BE IMPLEMENTED. The Hewlett-Packard research lab, in conjunction with
    all its partners, is certifying HP-UX configurations as rapidly as possible.


    The Gigabit Fibre Channel Switch will also utilize Hewlett-Packard''s Fibre Manager
    to provide Fibre Channel cluster management. The Fibre Channel Manager is a separate
    product.


    ## 5.10 Typical Hewlett-Packard FC Topologies


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_133_0.png)


    Figure 5-27 Hewlett-Packard Mass Storage Topology


    This topology demonstrates how to attach one host, using one I/O adapter, four
    storage devices, for example two Fibre Channel disk arrays and two tape devices,
    possibly DLT tape libraries, through a hub.


    ## Typical Hewlett-Packard FC Topologies


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_134_0.png)


    Figure 5-28 Hewlett-Packard Mass Storage Topology


    This topology demonstrates a configuration using two hubs. Looking at the diagram,
    remember a long-wave hub has one hub-to-hub port, leaving nine other ports for
    devices. So you can see more possibilities with devices.


    Remember also that just because there are multiple disk arrays and other SCSI
    devices, and the possibility of many devices being attached to the hubs, this
    is not a high availability configuration. In this particular topology there are
    couple of single points of failure. For example, there is only one FC adapter.
    If it fails the host will not be able to communicate with any device in the entire
    storage area network (SAN). The cable from the FC adapter to the first hub is
    also a single point of failure.


    ## 5.10.1 Year 2000 Issues


    All Hewlett-Packard enterprise storage devices are Year 2000 compliant when configured
    according to Hewlett-Packard standards. Year 2000 compliance applies to disk drives,
    disk arrays, tape drives, tape libraries, magneto-optical devices, and Fibre Channel
    infrastructure products. All products are compliant in the original revisions
    shipped by Hewlett-Packard except for the Model 12 and Model 12H. The Model 12
    and 12H have logging utilities that require a patch to make them Year 2000 compliant.
    Minimum patch revisions are shown below.


    Model 12 and Model 12H Minimum Patch Revisions for Year 2000 compliance Operating
    System Minimum Patch Revision:


    - HP-UX 10.01, 10.10, 10.20 PHCO_14584

    - HP-UX 11.0 PHCO_14585

    - NT 4.0 SP3 AutoRAID for NT version 1.02


    For more information on specific products refer to the Hewlett-Packard Year 2000
    Website at http://hpweb.y2k.nafohq.com

    '
