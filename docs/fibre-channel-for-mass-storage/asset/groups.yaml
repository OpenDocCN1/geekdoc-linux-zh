    # Glossary


    **Adapter** A printed circuit assembly which transmits user data (I/Os) between
    the host system''s internal bus and the external Fibre Channel link and vice versa.
    Also called an I/O adapter, host adapter, or FC adapter.


    **Address** The logical location of a peripheral device, node, or any other unit
    component in a network location. The formatted number specifying a specific network
    location. See *SCSI Addressing.*


    **Arbitrated Loop** See Fibre Channel Arbitrated Loop.


    **Area** The second byte of the N_Port Identifier.


    **Attenuation** The difference (loss) between transmitted and received power,
    due to the transmission loss through equipment lines or other communications devices.


    **Bandwidth** The range of frequencies that can pass over a given circuit. Generally,
    the greater the bandwidth, the more information that can be sent through the circuit
    in a given amount of time.


    **Baud** The encoded bit rate per second. A measure of transmission speed.


    **Bus** A means of transferring data between modules and adapters or between an
    adapter and SCSI devices. For a SCSI bus definition, see *SCSI Bus.*'
  - '[PAGE 141]


    # Cascaded FC-AL Hubs One FC-AL hub connected to another FC-AL hub to increase
    arbitrated loop distances. Cascaded hubs allow distances up to 10 Kilometers between
    hubs, or 500 meters between a hub and a device.


    Class of Service The types of services provided by the Fibre Channel topology
    and used by the communicating port.


    Domain The most significant byte in the N_Port Identifier for the FC device. It
    is not used in the FC-SCSI hardware path ID. It is required to be the same for
    all SCSI targets logically connected to an FC adapter.


    Fabric A Fibre Channel term that describes a crosspoint switched network, which
    is one of three existing Fibre Channel topologies. A fabric consists of one or
    more fabric elements, which are switches responsible for frame routing. The fabric
    structure is transparent to the devices connected to it and relieves them of the
    responsibility for station management.


    FC-AL See Fibre Channel Arbitrated Loop (FC-AL).


    FC-AL device A device that uses Fibre Channel Arbitrated Loop, which consists
    of one or more NL_Ports.


    FC-AL Port The port on the FC-AL hub that provides connection between the FC-AL
    adapter and the FC-AL link.


    FC-SCSI Hardware Path ID A list of values showing the physical hardware path of
    the host to the target device.


    ```

    Format:

    Bus_Converter/Adapter_Address.Protocol_Type.Area.

    Port.Bus.Target.LUN

    Example: 8/4.8.0.0.2.4

    ```


    Fiber See Fibre Optic Cable.'
  - '[PAGE 142]


    Glossary


    121


    # Fiber Optics


    A technology that uses light as an information carrier. Fiber optic cables are
    a direct replacement for conventional coaxial cable and wire pairs. The glass-based
    transmission facility occupies less physical volume for an equivalent transmission
    capacity, and the fibers are immune to electrical interference.


    # Fibre


    A generic Fibre Channel term used to cover all transmission media specified in
    the Fibre Channel Physical Layer standard (FC-PH), including optical fiber, copper
    twisted pair, and copper coaxial cable.


    # Fibre Optic Cable


    An optical fiber cable made from thin strands of dielectric material, such as
    glass, through which data in the form of light pulses is transmitted by laser
    or LED. Fibre optic cable is used for high-speed transmission over medium to long
    distances.


    # Fibre Channel


    Logically, Fibre Channel is a bidirectional, full-duplex, point-to-point, serial
    data channel structured for high performance capability. Physically, Fibre Channel
    interconnects devices, such as host systems and servers, FC hubs and disk arrays,
    through ports, called N_Ports, in one of three topologies: a point-to-point link,
    an arbitrated loop, or a crospoint switched network, which is called a fabric.
    FC can interconnect two devices in a point-to-point topology, from two to 126
    devices in an arbitrated loop.


    FC is a generalized transport mechanism that has no protocol or native I/O command
    set, but can transport any existing protocol, such as SCSI, in FC frames. FC is
    capable of operating at speeds of 100 MB/s (full speed), 50 MB/s (half speed),
    25 MB/s (quarter speed), or 12.5 MB/s (eighth speed), over distances of up to
    100 m over copper media or up to 10 km over optical links. The disk array operates
    at full speed.'
  - '[PAGE 143]


    # Fibre Channel Arbitrated Loop (FC-AL)


    One of three existing Fibre Channel topologies, in which two to 126 ports are
    interconnected serially in a single loop circuit. Access the FC-AL is controlled
    by an arbitration scheme. The FC-AL topology supports all classes of service and
    guarantees in-order delivery of FC frames when the originator and responder are
    on the same FC-AL. The disk array''s default topology is arbitrated loop.


    # Fibre Channel Arbitrated Loop Hub


    A full-duplex, 1.063 Gigabit per second intelligent hub used in a FC-AL topology
    to increase the loop''s reliability, the number of loop connections, and the distances
    between the host system(s) and disk array(s). A maximum of ten devices can be
    connected to each FC-AL hub.


    # Fibre Channel Protocol for SCSI (FCP)


    FCP defines a high-level Fibre Channel mapping layer (FC-4) that uses lower-level
    Fibre Channel (FC-PH) services to transmit SCSI command, data, and status information
    between a SCSI initiator and a SCSI target across the FC link using FC frame and
    sequence formats.


    # Frame


    A collection of bits that contain both control information and data; the basic
    unit of transmission on a network. Control information is carried in the frame
    with the data to provide for such functions as addressing, sequencing, flow control,
    and error control to the respective protocol levels. It can be of fixed or variable
    length.


    The smallest, indivisible unit of application-data transfer used by Fibre Channel.
    Frame size depends on the hardware implementation and is independent of the application
    software. Frames begin with a 4-byte Start of Frame (SOF), end with a 4-byte End
    of Frame (EOF), contain a 24-byte frame header and a 4-byte Cyclic Redundancy
    Check (CRC), and can carry a variable data payload from 0 to 2112 bytes, the first
    64 of which can be used for optional headers.'
