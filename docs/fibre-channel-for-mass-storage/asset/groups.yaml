    **Figure 2-4** Fibre Channel levels


    Now you have a good overview of the functional levels within Fibre Channel. Continue
    on to the next section to read about the detailed characteristics of each level.


    ## 2.2 FC-0: The Physical Layer


    Level FC-0 deals with the physical variants:


    - fiber

    - connectors

    - receivers

    - data encoders/decoders

    - serializers/deserializers

    - transmitters


    FC-0 deals strictly with the serial bit stream to be sent and received, and the
    conductors used to transmit that stream. This layer is called the physical layer.
    The Fibre Channel standard calls this function the Link Facility (LCF). The requirements
    are different for different types of media and different data rates.


    ## 2.2.1 Connectors


    Remember, Chapter 1 stated that the main purpose of Fibre Channel is to have any
    number of existing protocols over a variety of physical media and existing cable
    options. Therefore, FC-0 provides for four types of connectors to accommodate
    for the variety of physical media and possible existing cable.


