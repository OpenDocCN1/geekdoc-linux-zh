    # 2.3.3 FC-1 Transmission Word


    A transmission word is composed of four transmission characters. Remember, the
    8B/10B code encoded an 8-bit byte into a 10-bit character. Therefore, a transmission
    word is a 40-bit group of 10B transmission characters. A transmission word can
    be one of two kinds:


    +   - datathe first transmission character is an encoded data byte

    - ordered set—the forth transmission character is the K28.5 special character


    If the transmission word is data, each of the four transmission characters is
    an encoded data byte.'
  - "[PAGE 47]\n\nIf the transmission word is an ordered set, the first byte is a\
    \ K28.5 transmission character. The other three transmission characters are normal\
    \ encoded data bytes. Ordered sets permit control functions to be imbedded in\
    \ the bit stream. One simple use of ordered sets is to determine at a receiver\
    \ where word boundaries are. If all transmission words are data transmission words,\
    \ the receiver has only a 2.5% chance of getting it right (that is, one in 40\
    \ bits).\n\n# 2.3.4 FC-1: Ordered Set\n\nAn ordered set is a transmission word\
    \ beginning with a special character, as previously discussed, the K28.5 character.\
    \ Because this special character is present, this transmission word has a special\
    \ control meaning. There are three possible meanings:\n\n+   - Frame delimiter—This\
    \ defines what class of service is required. (Classes of service will be explained\
    \ later in this chapter.) The frame contains a start of frame (SOF) and an end\
    \ of frame (EOF) delimiter.\n- Primitive signals—There are two kinds of primitive\
    \ signals:\n  - The ordered set may be a primitive signal used for buffer-to-buffer\
    \ flow control.\n  - There is an ordered set for idle primitives. Idles are words\
    \ that fill the space between frames. In Fibre Channel, the transmitter must continuously\
    \ send something over the media. This helps preserve bit, byte, and word synchronization,\
    \ and permits faster communication.\n- Primitive sequences—A set of three identical\
    \ ordered sets for link control. These are used for notification of link failures\
    \ and loss of synchronization."
- md: "\n## 2.4 FC-2: Framing Protocol\n\nThe FC-2 framing protocol manages flow control\
    \ so data will be delivered with no collisions or loss. This level defines the\
    \ signaling protocol, including the frame and byte structure, which is the data\
    \ transport mechanism used by Fibre Channel. The framing protocol is used to break\
    \ sequences into individual frames for transmission, flow control, 32-bit CRC\
    \ generation, and various classes of service.\n\nTo aid in data transfer, FC-2\
    \ provides for the following elements:\n\n- Frames—basic units of information\
    \ transfer. The maximum payload of a frame is 2112 bytes.\n- Sequences—are made\
    \ up of one or more frames. FC-2 names each sequence and tracks it to completion.\n\
    - Exchanges—are the largest construct understood by FC-2. An unidirectional or\
    \ bidirectional set of non-concurrent sequences. SCSI-3 FCP uses bidirectional\
    \ exchanges, with information passing in one direction at a time. To send data\
    \ in the opposite direction, sequence initiative is passed from one port to another\
    \ and back again. Each port generates one or more sequences within the exchange.\n\
    - Packets—are made up of one or more exchanges.\n\n### 2.4.1 Frame Structure\n\
    \nThe following figure demonstrates frame structure.\n\n| 4 | 24 | 0 to 2112 |\
    \ 4 | 4 Bytes |\n| :--- | :--- | :--- | :--- | :--- |\n| >= 2 Idles | Start of\
    \ Frame | Frame Header | (Optional Headers) | Payload | CRC | End of Frame | 6\
    \ Idles |\n\n**Figure 2-11** FC-2 Frame Structure\n\nThe total length of the frame\
    \ is 2148 transmission characters or 537 transmission-words. The SOF, CRC, and\
    \ EOF are all one transmission word in length with the frame header being six\
    \ transmission words in length. The frame is followed by a minimum of 6 idles\
    \ (or 24 transmission characters).\n\n### 2.4.2 Frame Header Structure\n\nThe\
    \ frame header is divided into fields to carry control information. The following\
    \ figure shows these fields.\n\n| | 4 | 24 | | 0 to 2112 | | 4 | 4 Bytes |\n|\
    \ :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| >= 2 Idles | Start\
    \ of Frame | Frame Header | (Optional headers) + Payload | CRC | End of Frame\
    \ | 6 Idles |\n| | | Byte 0 | Byte 1 | Byte 2 | Byte 3 | | |\n| Word 0 | Bit 31\
    \ | 23 | 15 | 7 | 0 | | |\n| | | R_CTL | DESTINATION_ID | | | |\n| 1 | rsvd |\
    \ SOURCE_ID | | |\n| 2 | TYPE | F_CTL | | |\n| 3 | SEQ_ID | DF_CTL | SEQ_CNT |\
    \ | |\n| 4 | OX_ID | RX_ID | | |\n| 5 | | PARAMETER | | |\n\nFigure 2-12 Frame\
    \ Header Structure\n\n### Table 2-1 Frame Header Structure Explanations\n\n| |\
    \ |\n| :--- | :--- |\n| Routing Control (R_CTL) | Contains IC (Information Category)\
    \ and RB (Routing Bits) subfields. Routing Bits indicate the frame type. The IC\
    \ field indicates payload content (for example, SCSI status). |\n| Destination\
    \ ID (D_ID) | The native address of the destination N_Port, a well-known address,\
    \ or an alias address. |\n| Source ID (S_ID) | The address identifier of the source\
    \ N_Port. |\n| Type | The protocol associated with the payload (for example, SCSI-3)\
    \ |\n| Frame Control (F_CTL) | Bits that identify the transfer of sequence; beginning,\
    \ middle, or end of sequence; and end of connection. |\n| Data Field Control (DF_CTL)\
    \ | Indicates the presence of optional headers. |\n| Sequence ID (SEQ_ID) | A\
    \ unique numeric sequence identifier between two ports. |\n| Sequence Count (SEQ_CNT)\
    \ | A 16-bit rollover frame counter or frame identifier. |\n| Originator Exchange\
    \ ID (OX_ID) | A number an originator uses to uniquely identify an exchange. |\n\
    | Responder Exchange ID (RX_ID) | A number like OX_ID, but for the exchange responder.\
    \ |\n| Parameter | Contents may vary with frame type. Often used as a relative\
    \ offset of payload contents. |\n\n## 2.5 FC-3: Common Services\n\nThe FC-3 level,\
    \ located at the center of the functional levels, concerns itself with functions\
    \ spanning multiple N_Ports. The FC-3 level is the single point in the architecture\
    \ through which all traffic must flow in both directions. The FC-3 level will\
    \ contain services that are common (available) to all ports on a node.\n\nA node\
    \ may have several ports. A node may also have several ULPs and FC-4 level mappings.\
    \ However, there is only one FC-3 Common Services level per node. The FC-3 level\
    \ can manage a set of tables holding the login information for other active ports.\
    \ Each port on the FC-3 level knows which ports are busy and which exchanges they\
    \ are busy.\n\nFigure 2-12 shows where the FC-3 level fits into the overall scheme\
    \ of all the Fibre Channel levels.\n\nCurrently there are three functions defined\
    \ within the FC-3 level standard:\n\n- Striping—Used to achieve higher bandwidth.\
    \ Striping allows multiple links simultaneously and transmits a single information\
    \ unit across multiple links employing multiple N_Ports in parallel.\n- Hunt Groups—Are\
    \ a group of N_Ports associated with a single node, they permit any N_Port on\
    \ the node to receive information containing the correct alias identifier.\n-\
    \ Multicast—This can be compared to a broadcast message. It allows a single information\
    \ unit to be transmitted to multiple N_Ports on a node.\n\nThe FC-3 level knows\
    \ nothing about the topology of Fibre Channel or the physical signaling at the\
    \ lower levels. This is handled by FC-1 and FC-2 levels. FC-3 understands if there\
    \ are multiple ports attached to a node and if they participate in multiport operations\
    \ like multicasting. Knowing which ports are busy allows the FC-3 level to route\
    \ exchanges between two N_Ports and FC-4s.\n\n## FC-4: Mapping\n\n![](img/92bf92f19abc8dc2f49e0cf07e857a0c_52_0.png)\n\
    \nFigure 2-13 FC-3 Common Services Level\n\n## 2.6 FC-4: Mapping\n\nMapping is\
    \ a set of rules that is defined to move information from the Upper Level Protocol\
    \ interfaces to the lower Fibre Channel levels. The ANSI SCSI committee and the\
    \ Fibre Channel committees are currently defining these rules.\n\nCurrently the\
    \ rules provide for transforming information units into Fibre Channel sequences\
    \ and exchanges and back again. When fully developed, the mapping rules are intended\
    \ to provide clear mapping between applications.\n\nTo send data, the FC-4 level\
    \ takes a unit of information (this is the payload in a frame and is the actual\
    \ data that is being transmitted, it is referred to as an Information Unit (IU))\
    \ from a ULP and transforms it into sequences for the FC-3 and FC-2 levels. To\
    \ receive data, the FC-4 level takes a sequence from the FC-3 and FC-2 levels\
