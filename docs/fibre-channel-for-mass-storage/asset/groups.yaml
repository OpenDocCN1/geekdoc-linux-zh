- md: "\n# Fibre Channel Futures\n\nThis chapter discusses:\n\n- * Future developments\
    \ and improvements of Fibre Channel\n- Where to get more information regarding\
    \ Fibre Channel\n\n## 6.1 Future Enhancements\n\nFibre Channel is evolving rapidly\
    \ and new elements are constantly being defined. These new elements will produce\
    \ a more powerful architecture to support mass storage.\n\nMost of the work thus\
    \ far in defining the Fibre Channel physical standards (FC-PH). Although there\
    \ will be more work done in this area, the larger amount of work in defining standards\
    \ will be done in the FC-3 and FC-4 levels.\n\n### 6.1.1 What Lies Ahead\n\n###\
    \ 6.1.1.1 Faster Fiber Rates.\n\nThe faster Fibre Channel rates of 2-plus Gbps\
    \ and 4-plus Gbps are still theoretical. When implemented, however, they could\
    \ greatly increase throughput. Since Hewlett-Packard supports Fibre Channel as\
    \ part of it's future technology, it is continuing to produce chips and other\
    \ components to support the faster rates of data transfer.\n\n### 6.1.1.2 Hunt\
    \ Groups\n\nMore and better definitions of hunt groups and how they will or should\
    \ operate. Hunt groups could increase throughput by sending frames to an alternate\
    \ port on a node, eliminating the possibility of a busy N_Port blocking communication.\n\
    \n### 6.1.1.3 Multicast Groups\n\nAs discussed in the FC-3 Common Services section\
    \ of Chapter Two, the FC-3 level allows a single information unit to be transmitted\
    \ to multiple N_Ports on a node. Multicast groups then could increase throughput\
    \ by efficiently replicating frames to be sent to multiple N_Ports. This is roughly\
    \ equivalent to a person using broadcast voice mail or email distribution lists.\n\
    \n### 6.1.1.4 Classes of Service\n\nNewer classes of service will be added. They\
    \ may address voice or video, which will offer new communication possibilities\
    \ while placing new demands on the architecture.\n\n### 6.1.1.5 Other Possible\
    \ Enhancements\n\nOther enhancements may address problems in the FC-AL standard\
    \ or may come in the area of network management improvement. The following list\
    \ includes some of the other possible improvements.\n\n- * Improved flow control\n\
    - Low-level error recovery\n- Spatial reuse — more than one conversation on the\
    \ loop at one time\n- Full frame buffering\n- Network management\n  - identification\
    \ of topology\n  - discovery of topology when loop configuration changes\n- Faster\
    \ ULP error recovery\n- Low-cost switching hubs\n\nEven though these enhancements\
    \ may be coming, Hewlett-Packard is only committed to the currently defined standards.\n\
    \n## 6.2 Sources for More Information Regarding Fibre Channel\n\n### 6.2.1 Publications\n\
    \nCurrently there are two major publications for introducing Fibre Channel.\n\n\
    - 1. FIBRE CHANNEL: Connection to the Future\nFibre Channel Association\n12407\
    \ MoPac Expressway North 100-257\nP.O. Box 9700\nAustin, Texas 78766-8422\n\n\
    - 2. What is FIBRE CHANNEL\nAncot Corporation\n115 Constitution Drive\nMenlo Park,\
    \ CA 94025\n\n### 6.2.2 World Wide Web\n\n- More information can be found at the\
    \ following Web sites.\n- http://www.x3.org\n- http://www.amdahl.com/ext/CARP/FCA\n\
    - http://www.skipestone.com\n- http://www.ssaia.org\n\n(Each of these sites has\
    \ links to many more associated sites.)\n\n# Glossary\n\n**Adapter** A printed\
    \ circuit assembly which transmits user data (I/Os) between the host system's\
    \ internal bus and the external Fibre Channel link and vice versa. Also called\
    \ an I/O adapter, host adapter, or FC adapter.\n\n**Address** The logical location\
    \ of a peripheral device, node, or any other unit component in a network location.\
    \ The formatted number specifying a specific network location. See *SCSI Addressing.*\n\
    \n**Arbitrated Loop** See Fibre Channel Arbitrated Loop.\n\n**Area** The second\
    \ byte of the N_Port Identifier.\n\n**Attenuation** The difference (loss) between\
    \ transmitted and received power, due to the transmission loss through equipment\
    \ lines or other communications devices.\n\n**Bandwidth** The range of frequencies\
    \ that can pass over a given circuit. Generally, the greater the bandwidth, the\
    \ more information that can be sent through the circuit in a given amount of time.\n\
    \n**Baud** The encoded bit rate per second. A measure of transmission speed.\n\
    \n**Bus** a means of transferring data between modules and adapters or between\
    \ an adapter and SCSI devices. For a SCSI bus definition, see *SCSI Bus.*\n\n\
    **Cascaded FC-AL Hubs** One FC-AL hub connected to another FC-AL hub to increase\
    \ arbitrated loop distances. Cascaded hubs allow distances up to 10 Kilometers\
    \ between hubs, or 500 meters between a hub and a device.\n\n**Class of Service**\
    \ The types of services provided by the Fibre Channel topology and used by the\
    \ communicating port.\n\n**Domain** The most significant byte in the N_Port Identifier\
    \ for the FC device. It is not used in the FC-SCSI hardware path ID. It is required\
    \ to be the same for all SCSI targets logically connected to an FC adapter.\n\n\
    **Fabric** A Fibre Channel term that describes a crosspoint switched network,\
    \ which is one of three existing Fibre Channel topologies. A fabric consists of\
    \ one or more fabric elements, which are switches responsible for frame routing.\
    \ The fabric structure is transparent to the devices connected to it and relieves\
    \ them of the responsibility for station management.\n\n**FC-AL** See Fibre Channel\
    \ Arbitrated Loop (FC-AL).\n\n**FC-AL device** a device that uses Fibre Channel\
    \ Arbitrated Loop, which consists of one or more NL_Ports.\n\n**FC-AL Port** The\
    \ port on the FC-AL hub that provides connection between the FC-AL adapter and\
    \ the FC-AL link.\n\n**FC-SCSI Hardware Path ID** A list of values showing the\
    \ physical hardware path of the host to the target device.\n\n```\nFormat:\nBus_Converter/Adapter_Address.Protocol_Type.Area.\n\
    Port.Bus.Target.LUN\nExample: 8/4.8.0.0.2.4\n```\n\n**Fiber** See Fibre Optic\
    \ Cable.\n\n# Fiber Optics\n\nA technology that uses light as an information carrier.\
    \ Fiber optic cables are a direct replacement for conventional coaxial cable and\
    \ wire pairs. The glass-based transmission facility occupies less physical volume\
    \ for an equivalent transmission capacity, and the fibers are immune to electrical\
    \ interference.\n\n# Fibre\n\nA generic Fibre Channel term used to cover all transmission\
    \ media specified in the Fibre Channel Physical Layer standard (FC-PH), including\
    \ optical fiber, copper twisted pair, and copper coaxial cable.\n\n# Fibre Optic\
    \ Cable\n\nAn optical fiber cable made from thin strands of dielectric material,\
    \ such as glass, through which data in the form of pulses is transmitted.\n\n\
    # Fibre Channel\n\nLogically, Fibre Channel is a bidirectional, full-duplex, point-to-point,\
    \ serial channel for high performance. Physically, Fibre Channel interconnects\
    \ devices, such as host systems and disk arrays, through switches, called ports,\
    \ in one of three topologies: point-to-point, an arbitrated loop, or a crosspoint\
    \ switched network, which is called a fabric. FC can transport any existing protocol,\
    \ such as SCSI, at speeds of 100 MB/s (full speed), 50 MB/s (half speed), 25 MB/s\
    \ (quarter speed), or 12.5 MB/s (eighth speed), over distances of 100 m over copper\
    \ or 10 km over optical links.\n\n# Fibre Channel Arbitrated Loop (FC-AL)\n\n\
    One of three existing Fibre Channel topologies, in which two to 126 ports are\
    \ interconnected serially in a single loop. Access the FC-AL is controlled by\
    \ an arbitration scheme. The FC-AL topology supports all classes of service and\
    \ guarantees in-order delivery of frames when the originator and responder are\
    \ on the same FC-AL. The disk array's default topology is arbitrated loop.\n\n\
    # Fibre Channel Arbitrated Loop Hub\n\nA full-duplex, 1.063 Gigabit per second\
    \ intelligent hub used in a FC-AL topology to increase the loop's reliability,\
    \ the number of loop connections, and the distances between the host system(s)\
    \ and disk array(s). A maximum of ten devices can be connected to each FC-AL hub.\n\
    \n# Fibre Channel Protocol for SCSI (FCP)\n\nFCP defines a high-level Fibre Channel\
    \ mapping layer (FC-4) that uses lower-level Fibre Channel (FC-PH) services to\
    \ transmit SCSI command, data, and status information between a SCSI initiator\
    \ and a SCSI target across the FC link using FC frame and sequence formats.\n\n\
    # Frame\n\nThe smallest, indivisible unit of application-data transfer used by\
