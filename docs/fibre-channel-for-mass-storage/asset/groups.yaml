    ## 5.9 FC 交换机


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_129_0.png)


    图 5-24 惠尔-惠普（Hewlett-Packard）FC 交换机正面。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_129_1.png)


    图 5-25 光纤交换机背面


    该交换机允许光纤通道连接到私有环（仲裁环）或光纤通道矩阵（Fabric）。EPL（模拟私有环），也称为 QL（快速环）将在首个版本中提供，并支持安装了适当补丁的
    HP-UX 11.0 和 HP-UX 10.20。此模式用于支持此前在现有 HP-UX 11.0 操作系统上支持的旧系统和外围设备。矩阵支持直到发布 HP-UX
    11.01 或更高版本后才会可用。


    首个版本将支持运行上述 HP-UX 10.20 或 11.0 操作系统的旧系统，例如 K 类、D 类、T 类和 V 类。主机系统将使用现有的 A3404A、A3636A、A3591B
    和 A3740A 光纤通道适配器。一旦 HP-UX 11.01 可用，将使用 A5157A 双 Tachyon TL 光纤通道适配器和 A518A 单 Tachyon
    TL 光纤通道适配器支持 FC 交换机。


    这两个新适配器是基于 PCI 的，现在已用于 HP-UX 11.01 上的 V2500 和 4000 SPU 平台。


    千兆交换纤交换机提供端口配置（未安装 GBIC 的单元）。可以使用一到四个 GBIC 选项，但必须订购一个。每个 GBIC 选项提供四个 GBIC（千兆接口转换器），可安装在交换机中任何所需的空位置。可以使用短波或长波
    GBIC 光学器件。此时最多只能使用一个长波选项。


    长波 GBIC 的应用目前非常有限，任何想要使用长波 GBIC 的客户应要求配置协助，以避免不受支持/无法实现的配置，这将损害其作为 SAN（存储区域网络）解决方案的使用能力。千兆光纤通道交换机是非级联产品，这意味着每个主机连接只能使用一台交换机。多个主机可以连接到单个交换机。


    连接到单个交换机的主机数量有限制。请参考惠尔-惠普公共网站 www.hp.com 上的《服务器配置指南》。


    千兆光纤通道交换机可用于连接 16 台光纤通道设备（咨询《服务器配置指南》了解支持的配置）。设备可以直接连接到交换机（如主机系统或光纤通道外围设备）；也可以通过
    FC-AL 集线器（在该特定连接处提供本地环）；或者通过 FC-SCSI 复用器用于磁带或磁盘配置（见《服务器配置指南》）。


    每个集线器只能使用一个环连接。每个矩阵端口限制为一个环主。如果使用多个环主（FL 端口），其中一个将保持空闲状态（被浪费），直到原始 FL 端口失效。在首个版本中，光纤通道交换机将仅支持
    EMC 磁盘阵列。其他型号的磁盘阵列和其他质存储将在以后支持。下方显示了一个示例。


    ## EMC 阵列与 HP FC 交换机允许的最大配置


    | S P U | S P U | S P U | S P U | S P U | S P U | S P U | S P U |

    |---|---|---|---|---|---|---|---|

    | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_131_0.png)


    | FC Director #1 | FC Director #2 | FC Director #3 | FC Director #4 | FC Director
    #1 | FC Director #2 | FC Director #3 | FC Director #4 |

    |---|---|---|---|---|---|---|---|

    | EMC ARRAY #1 | EMC ARRAY #2 | | | |


    图 5-26 FC 交换机配置示例


    千兆光纤通道交换机作为多个通道工作，能够提供最多八个并发连接。每个连接都能以全 1 Gigabit 的速度运行。这是一个重大的改进，因为目前的解决方案是单环，其总速度为
    1 Gigabit，并在所有连接的设备之间共享。


    千兆光纤通道交换机将允许更高的传输率，同时在客户已购买当前的光纤通道解决方案之间提供桥接，并提供到未来提供的能力的链路。千兆光纤通道交换机最初将支持许多配置，但由于支持原因，集群/配置将限制为不超过两台交换机（非级联）。


    ## FC 交换机


    每对交换机也限制最多允许八台主机。这是一种高可用（HA）路径配置，旨在最大化主机和质存储的可用性。详见图 5-26。初始版本将针对旧光纤通道设备和磁盘阵列。其他质存储将在稍后宣布支持。交换机的复杂性变得很快，因此强烈建议不要实施
    HP-UX 指南中未指定的配置。惠尔-惠普实验室及其所有合作伙伴将尽快认证 HP-UX 配置。


    千兆光纤通道交换机还将利用惠尔-惠普的光纤管理器来提供光纤通道管理。光纤管理器是一个独立产品。


    ## 5.10 典型的惠尔-惠普光纤通道拓扑


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_133_0.png)


    图 5-27 惠尔-惠普质存储拓扑


    此拓扑演示了如何连接一个主机，使用一个 I/O 适配器、四个存储设备（例如两个光纤通道磁盘阵列和磁带设备，可能是 DLT 磁带库），通过集线器。


    ## 典型的惠尔-惠普光纤通道拓扑


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_134_0.png)


    图 5-28 惠尔-惠普质存储拓扑


    此拓扑演示了使用两个集线器的配置。查看图表，记住长波集线器有一个集线器间端口，剩余九个端口用于设备。此外，尽管有多个磁盘阵列和其他 SCSI 设备以及许多设备连接到集线器，但这并不是高可用配置。在这种特定的拓扑中存在一些单点故障。例如，只有一个光纤适配器。如果它故障，主机将无法与整个存储区域网络（SAN）中的任何设备通信。从适配器到第一个集线器的电也是单点故障。


    ## 5.10.1 2000 年问题


    所有惠尔-惠普企业存储设备在按照惠尔-惠普标准配置时均符合 2000 年标准。2000 年标准适用于磁盘驱动器、磁盘阵列、磁带驱动器、磁带库、光设备以及光纤通道基础设施产品。除了
    Model 12 和 Model 12H 外，惠尔-惠普交付的所有原始版本均符合标准。Model 12 和 12H 具有需要补丁才能符合 2000 年标准的日志程序。最小补丁版本所示。


    Model 12 和 Model 12H 符合 2000 年标准的最小操作系统补丁版本：


    - HP-UX 10.01, 10.10, 10.20 PHCO_14584

    - HP-UX 11.0 PHCO_14585

    - NT 4.0 SP3 AutoRAID for NT 版本 1.02


    有关特定产品的更多信息，请参阅惠尔-惠普 2000 年网站：http://hpweb.y2k.nafohq.com


    '
