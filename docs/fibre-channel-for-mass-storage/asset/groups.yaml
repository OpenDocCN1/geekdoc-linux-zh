    ## Addressing Methods for HP-UX


    The HBA takes the highest soft address on the loop. This address does not show
    up in the hardware path. A soft address is an address used if there are duplicate
    hard addresses on a loop. Devices on a loop must not be allowed to acquire a soft
    address because of the possibility that a device could acquire a different soft
    address if power fails for a device on a loop and later is restored. For more
    information refer to the “Hard versus Soft addresses” at the end of this chapter.


    A Hewlett-Packard FC-AL hub does not have a Fibre Channel address and is therefore
    not seen in an ioscan output. The hub is a pass-through device that increases
    reliability by electrically bypassing nodes that are causing problems on the loop
    and has no loop address of its own.


    ## 4.2.2 Peripheral Device Addressing


    This addressing method is used for addressing the FC-SCSI MUX (discussed in Chapter
    5), controller, and certain other Fibre Channel array controllers. The Hewlett-Packard
    High-Availability Fibre Channel Disk Array (HA FC Disk Array) also uses this type
    of addressing for its controller. This type of addressing is also used for targets
    with eight or fewer LUNs.


    Peripheral device addressing is used with devices that do not specify a device
    type of array controller for LUN0 and do not use Logical Unit addressing or Volume
    Set addressing. This addressing method is specified by the Private Loop Device
    Attach profile standard. Although the profile is an 8-bit LUN field, HP-UX limits
    the address to values 0 through 7.


    ### 4.2.2.1 Loop Addressing in ioscan


    The HA FC disk array uses Peripheral Device addressing exclusively. The loop address
    for this device must be set physically. There are switches on the controllers
    that accomplish this. These switches are set in hexadecimal values. The hardware
    path displays this address as two separate fields (called nibbles, they are half
    a byte each) in decimal.


    For example, the loop address is set by using the device switches, located on
    the controller face-plate. These switches have hexadecimal values. For this example
    the switches are set at 3C. The decimal value is then derived by separating the
    two characters, converting from HEX, and then separating them with a period. See
    Figure 4-7.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_81_0.png)


    Figure 4-7 Nibble Conversion of Loop Address on a 30-Slot Array


    The hardware path for the device shows each nibble as a decimal value separated
    by a period.


    ## Addressing Methods for HP-UX


    - 8/12.8.0.255.3.12

    - LUN (lower 4 bits of array loop address)

    - Bus (upper 4 bits of array loop address)

    - Port (255 = direct attach to FC device)

    - Area (0 = private loop)

    - Protocol Type (8 = mass storage)

    - Host Bus Adapter address

    - Bus converter


    **Figure 4-8** Example of LUN using Peripheral Device Addressing


    This example shows LUN 0 with a loop address of decimal 60. The Loop address is
    represented in the Bus and Target fields. The HEX 3C is converted to a decimal
    60.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_82_0.png)


    **Figure 4-9** Hewlett-Packard HA FC Disk Array


    In this example, LUN 0 is an addressable device and not the control port.

    The Hewlett-Packard HA FC Disk Array uses Peripheral Device addressing exclusively.


    Figure 4-10 Example of an ioscan for a disk array.


    | Class | H/W Path | Driver | S/W State | H/W Type | Description |

    |---|---|---|---|---|--|

    | fcp | 0 8/12.8 | fcp | CLAIMED | INTERFACE | FCP Protocol Adapter |

    | ext_bus | 10 8/12.8.0.255.3 | fcpdev | CLAIMED | INTERFACE | FPC Device Interface
    |

    | target | 8 8/12.8.0.255.3.12 | tgt | CLAIMED | DEVICE | |

    | disk | 76 8/12.8.0.255.3.12.1 sdisk | CLAIMED | DEVICE | DGC C3400WDR5 |

    | disk | 77 8/12.8.0.255.3.12.2 sdisk | CLAIMED | DEVICE | DGC C3400WDR5 |


    **Figure 4-10** Example of an ioscan


    ## 4.2.2.2 Loop Addressing in Grid Manager


    When using the Hewlett-Packard HA FC Disk Array remember the Loop ID must be set
    using the switches in the back of the unit located on the controllers. In our
    examples the Loop ID of 3C is used. When displaying this in Grid Manager, it shows
    up as the decimal number 60. This conversion uses the normal HEX to decimal conversion.


    If the switches are set to something other than 3C, remember to make the conversion
    from HEX to decimal. For example, if the switches are set to 2C, then the HEX
    conversion will be 44 in decimal.


    ## 4.2.3 Logical Unit Addressing


    This addressing method is used for addressing the SCSI devices attached to the
    FC-SCSI MUX. Remember, the MUX itself uses Peripheral Device addressing. It has
    an addressable control port, however, the devices attached to the MUX will use
    Logical Unit addressing.


    ## Addressing Methods for HP-UX


    HP-UX selects the Logical Unit method based on inquiry data and LUN information
    returned by the REPORT LUN command. HP-UX limits the target addresses to 0 through
    15 and LUN addresses 0 through 7. The target address specifies a bus number (3
    bits), a target number (6 bits), and a LUN (5 bits).


    Each SCSI bus on the MUX is represented by a separate virtual bus on HP-UX. The
    MUX control port resides on a different virtual bus than its attached devices.
    See Figure 4-11.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_84_0.png)


    Figure 4-11 Example of Logical Unit Addressing


    What this figure shows is the MUX has its own address (8/12.8.0.255.12), with
    a loop address of HEX 2C or decimal 44, using Peripheral Device Addressing. While
    on virtual bus 3, target 0, LUN 0 has its own address (8/12.8.0.44.3.0), and LUN
    1 of target 15 has its own address (8/12.8.0.44.3.15.1) using Logical Unit Addressing.


    ## 4.2.3 Deriving the MUX loop address


    The Port field from the path of a device attached to the MUX is first translated
    into HEX. Next, the HEX numbers are separated into the Bus and Target fields,
    and finally, the numbers are converted back to decimal. See Figure 4-12.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_85_0.png)


    Figure 4-12 Example for Converting the MUX Loop Address


    This procedure for conversion is primarily used during troubleshooting the hard
    address of the MUX.


    ## Addressing Methods for HP-UX


    The next example shows the hardware path of the FC-SCSI MUX control port. The
    value of 255 in the Bus field indicates that the MUX control port uses the Peripheral
    Device method and is directly connected to an FC device. Compare with Figure 4-11.


    ```

    8/12.8.0.255.2.12.0

    LUN (MUX Control)

    Target (lower 4 bits of MUX addr)

    Bus (upper 4 bits of MUX addr)

    Port (255 = direct attach to FC device)

    Area (0 = private loop)

    Protocol Type (8 = mass storage)

    Adapter Address

    Bus Converter

    ```


    Figure 4-13 Hardware Path for the MUX Control Port


    The next example shows the resulting hardware path for a device attached to SCSI
    bus 3 on the MUX. Again, compare with Figure 4-11.


    ```

    8/12.8.0.44.3.0.0

    LUN

    Target (SCSI Device)

    Bus

    Port (loop address)

    Area (0 = private loop)

    Protocol Type (8 = mass storage)

    Adapter Address

    Bus Converter

    ```


    Figure 4-14 Example Hardware Path for a Device on MUX bus 3


    The Bus field in the LUN hardware path is the SCSI bus number on the MUX. The
    Port field in the LUN hardware path is the loop address in decimal. The hardware
    path for the MUX control port contains the loop address in the Bus and Target
    fields.


    ```

    # ioscan -fn

    ```


    | Class | H/W Path | Driver | S/W State | H/W Type | Description |

