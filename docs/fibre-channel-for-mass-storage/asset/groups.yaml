    # 5.1.3.4 Physical Layer


    The physical layer interface is the popular 10-bit wide specification that allows
    interfacing to a low-cost serializer/deserializer(SerDes) IC. This is the same
    physical layer interface that is popular on Fibre Channel disk drives today due
    to its quality gigabit signaling, small form factor, and low-cost.


    # 5.1.3.5 Applications


    +   • Motherboard integration

    • Host Bus Adapters

    • Storage Subsystems

    • I2O designs


    # 5.1.4 TACHYON Block Diagrams


    TACHYON is a fundamental building block compatible with Hewlett-Packard''s Fibre
    Channel solution which includes interface controllers, physical link- modules,
    adapters, switches, and disk drives.


    The TACHYON architecture supports both networking and mass storage connections
    to provide a low cost, high performance solution with low host overhead.'
