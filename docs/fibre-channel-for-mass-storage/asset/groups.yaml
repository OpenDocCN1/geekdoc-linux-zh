    # High Availability Fibre Channel Disk Array


    Each instance of the single-system distance topology generally uses the following
    hardware components:


    +   * One host system or server

    * Two FC I/O adapters

    * One 10-port HP FC-AL Hub (A3724A)

    * One to four dual-SP disk arrays (for high availability) or one to eight single-SP
    disk arrays (for nonhigh availability)

    * Maximum 500 m m fibre optic cable distance on each connection between the host
    and the HP FC-AL Hub and between the HP FC-AL Hub and each disk array, for a total
    FC-AL cable length not to exceed 5000 m


    One or two single-distance topologies can be implemented in D-Class and K-Class
    systems, and up to 11 instances of this topology can be implemented in T-Class
    servers.


    # 5.7.2 Distance Topology


    Figure 51 illustrates the single-system distance topology with one host with two
    FC I/O adapters and three dual-SP disk arrays. In this example two of the HP FC-AL
    Hub''s ten ports are unused.


    This topology uses one 10-port HP FC-AL Hub. The two FC I/O adapters in the single
    host attach to two ports in the HP FC-AL Hub, providing redundant hardware paths
    between the host and the HP FC-AL Hub. The SPs of dual or single-SP disk arrays
    attach to some or all of the remaining eight FC-AL Hub ports. This topology creates
    a single FC-AL that resembles a star topology with the HP FC-AL Hub acting as
    the central switching element. The 10-port FC-AL Hub is inserted between the host
    and the disk arrays, increasing both the number of arrays (and total disk capacity)
    that can be connected to a single host and the total length of the FC cabling.
    The HP FC-AL Hub is a single point of failure in this topology.'
  - '[PAGE 119]


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_119_0.png)


    **Figure 5-18** Single-System Distance Topology


    Supported cable lengths for each segment of the FC-AL include 2 m, 16 m, 50 m,
    100 m, and 500 m. The maximum combined cable lengths for all segments, is the
    total length of the FC-AL, should not exceed 5000 m because performance can degrade
    due to propagation delay. Because of this it is recommended that the total cable
    length of the FC-AL be as short as possible. Fibre optic cables in lengths of
    2 m, 16 m, 50 m, and 100 m cables can be ordered from Hewlett-Packard. Fibre optic
    cables longer than 100 m must be customfabricated for each implementation.


    Like the basic topology, both high availability versions (two SPs per disk array)
