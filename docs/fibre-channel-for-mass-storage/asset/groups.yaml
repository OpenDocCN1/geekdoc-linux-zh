    # Figure 5-10 Cascaded Shortwave FC-AL Hub Configuration


    ## 5.6.4.2 Incorrect Cabling Examples


    The following illustrations are examples of incorrect cabling. For example: Do
    NOT cable together two ports on the same hub. Ports between the two connections
    will be eliminated from the loop.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_111_0.png)


    # Figure 5-11 Incorrect Cabling Example: Connected Ports on the Same Hub


    Do NOT attach more than one cable between any two hubs.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_112_0.png)


    **Figure 5-12** Incorrect cabling example: more than one cable connection between
    hubs


    Do NOT attempt to connect a hub to more than one other hub.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_112_1.png)


    **Figure 5-13** Incorrect cabling example: more than two hubs connected


    ## 5.7 High Availability Fibre Channel Disk Array


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_113_0.png)


    Figure 5-14 A3661A HA FC Disk Array


    This Fibre Channel peripheral has substantial storage capacity. It will hold up
    to 30 disk modules. Hewlett-Packard’s highest capacity point is 18 gigabytes per
    disk module. This will increase with future releases. This disk array was designed
    specifically for use in Fibre Channel topologies.


    It is High Availability (HA) because it employs redundant components such as:


    - disk modules

    - power supplies

    - controller units


    It is supported by the K-, D-, T- (600 only), and V-Class Hewlett-Packard Enterprise
    Servers running HP-UX 10.20 TFC or later. It has 1.063 gigabit per second optical
    Fibre Channel link speed and Fibre Channel Arbitrated Loop (FC-AL) topology is
    also supported.


    ### 5.7.1 Basic Topology


    The disk array protects against single points of failure with RAID (Redundant
    Array of Independent Disks) technology, global hot spares, and redundant, hot-swappable,
    customer-replaceable disk array components. Many of the components can be removed
    and replaced by the customer while the disk array is powered up, without removing
    it from the cabinet and without losing data. The RAID levels supported are 5,
    3, 1/0, and 1. RAID level 0 and individual disk units are not supported because
    they provide no data redundancy.


    Disk arrays and hosts can be directly or indirectly connected to Hewlett-Packard
    FC-AL Hubs in a number of hardware topologies.


    Figure 5-15 shows the high availability version of the basic topology implemented
    on a host system with two host FC I/O adapters connected to a dual-SP disk array.


    # Basic Topology


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_115_0.png)


    **Figure 5-15** Basic Topology, High Availability Version: Host with Two FC I/O
    Adapters


    One high availability version of the basic topology can be implemented in D-Class
    servers.


    # Basic Topology


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_116_0.png)


    **Figure 5-16** Basic Topology, High Availability Version: Host with Four FC I/O
    Adapters


    Figure 5-16 shows the high availability version of the basic topology implemented
    on a host with four host FC I/O adapters. Two of the FC adapters are connected
    to one dual-SP disk array while the other two FC adapters are connected to a second
    dual-SP disk array. Each connection of host adapter and SP creates a separate
    FC-AL. Additional disk arrays and FC adapters can be installed in T-Class servers.


    The non-high availability version connects a host or server to one or more single-SP
    disk arrays. This version provides no hardware redundancy and does not protect
    against single points of SP, FC cable, host FC I/O adapter, or internal SCSI-2
    bus failure. If any of these components fail, the disk array becomes unavailable
    and applications cannot continue to run. The disk array remains unavailable until
    the failed hardware component is replaced. Applications can continue to run after
    the failure of single disk modules within logical disk units (LUNs).


    Figure 5-17 shows the non-high availability version of the basic topology implemented
    on either a K-Class or T-Class with four FC I/O adapters connected to single SPs
    in four disk arrays. Each connection between adapter and SP creates a separate
    FC-AL. Additional disk arrays and FC adapters can be installed in T-Class servers.


    # Basic Topology: No High Availability


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_117_0.png)


    **Figure 5-17** Basic Topology, NonHigh Availability Version: Host with Four FC
    I/O Adapters


    All the topologies covered up to this point are considered to be basic and are
    limited in distance to 500 meters because they do not incorporate the use of a
    hub. Using a hub in the topology can increase the distance the Fibre Channel peripheral
    can be placed from the host, but remember it will also increase the complexity
    of the topology.


    The following figures will demonstrate the use of hubs in topologies when just
    connecting to disk arrays. The use of hubs not only increases distance but also
    the degree of high availability and storage capacity available to the host(s).


    # High Availability Fibre Channel Disk Array


    Each instance of the single-system distance topology generally uses the following
    hardware components:


    - One host system or server

    - Two FC I/O adapters

    - One 10-port HP FC-AL Hub (A3724A)

    - One to four dual-SP disk arrays (for high availability) or one to eight single-SP
    disk arrays (for nonhigh availability)

    - Maximum 500 m fibre optic cable distance on each connection between the host
    and the HP FC-AL Hub and between the HP FC-AL Hub and each disk array, for a total
    FC-AL cable length not to exceed 5000 m


    One or two single-system distance topology can be implemented in D-Class or K-Class
    servers.


    ## 5.7.2 Distance Topology


    Figure 5-18 shows the single-system distance topology. This topology uses a single
    FC-AL hub to connect the host and the disk arrays. The host is connected to the
    hub with two FC I/O adapters, and each disk array is connected to the hub with
    one FC adapter.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_119_0.png)


    **Figure 5-18** Single-System Distance Topology


    The single-system distance topology uses a single FC-AL hub to connect the host
    and the disk arrays. The host is connected to the hub with two FC I/O adapters,
    and each disk array is connected to the hub with one FC adapter. This topology
    provides no redundancy for the hub itself. If the hub fails, all communication
    between the host and the disk arrays is lost.


    ## 5.7.3 High Availability Topology


    The high availability topology increases the availability of the single system
    distance topology by protecting against single points of HP FC-AL Hub failure
    with the use of redundant HP FC-AL Hubs. Adding a second HP FC-AL Hub also increases
    the number of hosts and disk arrays that can be connected to a single FC-AL.

    '
