    # Preface


    # WHAT THIS BOOK IS ABOUT


    This book discusses the implementation of Fibre Channel. It opens with the limitations
    of current storage architectures, explains how Fibre Channel answers these limitations.
    Next, it details the functional levels of Fibre Channel, and finally, future developments
    and improvements.


    # WHO SHOULD READ THIS BOOK?


    You should read this book if you are new to Fibre Channel or if you are a System
    Technician. This chapter discusses the features and operations of Fibre Channel
    Arbitrated Loop (FC-AL), and explains how FC-AL is a very effective topology for
    mass storage. Hewlett-Packard has a commitment to this topology, as evidenced
    by its Fibre Channel hub product. This chapter will familiarize the reader with
    the characteristics, operations, and advantages of it.


    # WHY IS THIS BOOK NEEDED?


    Fibre Channel is a new technology and many people are not familiar with it. Therefore,
    this book was written to introduce users to the technology. This publication focuses
    on Fibre Channel in mass storage environments and discusses the aspects of Fibre
    Channel technology.


    # HOW TO USE THIS BOOK


    This book can be used as a reference. For example, if you are unfamiliar with
    Fibre Channel, you would want to start at the beginning. However, if you are familiar
    with Fibre Channel and only want to review the addressing, you would want to review
    Chapter Four.


    # AT A GLANCE


    Following is a chapter-by-glance at this book:


    - Chapter 1: This chapter discusses the limitations of current storage architectures,
    explains how Fibre Channel answers these limitations, and defines basic terms.

    - Chapter 2: This chapter details the functional levels of Fibre Channel, emphasizing
    physical components. There are six levels: three are port levels and three are
    node levels.

    - Chapter 3: This chapter discusses the features and operations of Fibre Channel
    Arbitrated Loop (FC-AL), and explains how FC-AL is a very effective topology for
    mass storage.

    - Chapter 4: This chapter explains Peripheral Device, Logical Unit, and Volume
    Set addressing, which is unique to Hewlett-Packard''s HP-UX Operating System environment.

    - Chapter 5: This chapter presents an overview of Hewlett-Packard''s products,
    describes the systems that support Fibre Channel, and discusses how the products
    work together.

    - Chapter 6: This chapter discusses the future developments and improvements to
    Fibre Channel and how to get more information. This chapter familiarizes the reader
    with some of the capabilities that may become available in the near future.


    # Acknowledgments


    I would like to the following people for their efforts and work they have accomplished
    for the Fibre Channel initiative within Hewlett-Packard:


    - Kale Black: for his technical reviews of this material during development.

    - Paul McGowan: for his support while writing this book and for his technical
    reviews of the material.

    - Marks Montanez: for her work writing product service manuals and an HP Journal
    article introducing Fibre Channel.

    - Judy Smith: for her work writing training manuals for the HP Fibre Channel field
    training and an HP Journal article introducing the Hewlett-Packard Fibre Channel
    chip.

    - Debbie Clingsmith: for her work writing and delivering the HP Fibre Channel
    field training material.

    - Russ Routh: for his work on the HP Fibre Channel Arbitrated Loop.

    - Barry Schoenborn: for all his efforts and support during the development of
    the HP Fibre Channel field training material and this book.

    - Bobbi Gibson: the Information Engineering department manager supporting me in
    my efforts to write this book.

    - Jade Simonson: the Technical Marketing manager of our division for supporting
    me in my efforts to write this book.

