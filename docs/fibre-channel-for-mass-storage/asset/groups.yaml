    ## 6.2 关于光通道的更多信息来源\n\n### 6.2.1 出版物\n\n目前有两种介绍光通道的主要出版物。\n\n- 1. FIBRE CHANNEL:\
    \ Connection to the Future\nFibre Channel Association \n12407 MoPac Expressway\
    \ North 100-257\nP.O. Box 9700\nAustin, Texas 78766-8422\n\n- 2. What is FIBRE\
    \ CHANNEL\nAncot Corporation\n115 Constitution Drive\nMenlo Park, CA 94025\n\n\
    ### 6.2.2 世界维网\n\n- 可以在以下网站找到更多信息。\n- http://www.x3.org\n- http://www.amdahl.com/ext/CARP/FCA\n\
    - http://www.skipestone.com\n- http://www.ssaia.org\n\n（这些网站每个都有指向更多关联网站的链接。）\n\
    \n# 术语表\n\n**适配器 (Adapter)** 一种印刷电路组件，用于在主机系统的内部总线与外部光通道链路之间反之传输用户数据（I/O）。也称为\
    \ I/O 适配器、主机适配器或 FC 适配器。\n\n**地址 (Address)** 外围设备、节点或网络位置中其他单元组件的逻辑位置。指定特定网络位置的格式化数字。参见\
    \ *SCSI 寻址*。\n\n**仲裁环路 (Arbitrated Loop)** 参见光通道仲裁环路。\n\n**区域 (Area)** N_Port\
    \ 标识符的第二个字节。\n\n**衰减 (Attenuation)** 发射功率与接收功率之间的差异（损失），这是由于通过设备线路或其他通信设备的传输损耗造成的。\n\
    \n**带宽 (Bandwidth)** 可通过给定电路的频率范围。通常情况下，带宽越大，在给定时间内通过电路发送的信息就越多。\n\n**波特率 (Baud)**\
    \ 每秒编码比特率。衡量传输速度的单位。\n\n**总线 (Bus)** 一种在模块与适配器之间或适配器与 SCSI 设备之间传输数据的方法。对于 SCSI\
    \ 总线定义，请参见 *SCSI 总线*。\n\n**级联 FC-AL 集线器 (Cascaded FC-AL Hubs)** 将一个 FC-AL 集线器连接到另一个\
    \ FC-AL 集线器以增加仲裁环路距离。级联集线器允许集线器之间的距离达 10 公里，或集线器与设备之间的距离可达 500 米。\n\n**服务类别 (Class\
    \ of Service)** 光通道拓扑提供并供通信端口使用的的服务类型。\n\n**域 (Domain)** FC 设备 N_Port 标识符中的最高位字节。它不用于\
    \ FC-SCSI 硬件路径 ID。对于逻辑上连接到 FC 适配器的所有 SCSI 目标，该值必须是相同的。\n\n**织 (Fabric)** 光通道术语，用于描述交叉交换网络，它是三种现有的光通道拓扑之一。织由一个或多个织元素组成，其中交换机负责帧的路由。织的结构对于连接到它的设备是透明的，并减轻了它们负责站管理的责任。\n\
    \n**FC-AL** 参见光通道仲裁环路 (FC-AL)。\n\n**FC-AL 设备 (FC-AL device)** 使用光通道仲裁环路的设备，由一个或多个\
    \ NL_Port 组成。\n\n**FC-AL 端口 (FC-AL Port)** FC-AL 集线器上的端口，提供 FC-AL 适配器与 FC-AL 链路之间的连接。\n\
    \n**FC-SCSI 硬件路径 ID (FC-SCSI Hardware Path ID)** 显示从主机到目标设备的物理硬件路径的数值列表。\n\n```\n\
    格式:\nBus_Converter/Adapter_Address.Protocol_Type.Area.\nPort.Bus.Target.LUN\n\
    示例: 8/4.8.0.0.2.4\n```\n\n**光纤 (Fiber)** 参见光纤电缆。\n\n# 光纤 (Fiber Optics) 一种使用光作为信息载体的技术。光纤电缆是传统同轴电缆和线对的直接替代品。基于玻璃的传输设施在同传输容量下占据更小的体积，且光纤对电干扰免疫。\n\
    \n# 光 (Fibre) 通用光通道术语，用于涵盖光通道物理层标准（FC-PH）指定的所有介质，包括光纤、铜双绞和铜同轴电缆。\n\n# 光纤电缆 (Fibre\
    \ Optic Cable) 由细绝缘材料（如玻璃）丝制成的光纤电缆，数据以脉冲形式在其中传输。\n\n# 光通道 (Fibre Channel) 逻辑上，光通道是一种用于高性能的双向、全双工、点对点串行通道。物理上，光通道通过交换机（端口连接设备（如主机系统和磁盘阵），采用三种拓扑之一：点对点、仲裁环路或交叉交换网络（织）。FC\
    \ 可以传输任何现有协议（如 SCSI），速度为 100 MB/s（全速）、50 MB/s（半速）、25 MB/s（四分之一速）或 12.5 MB/s（八分之一速），铜缆距离为\
    \ 100 米，光链路为 10 公里。\n\n# 光通道仲裁环路 (Fibre Channel Arbitrated Loop, FC-AL) 三种现有光通道拓扑之一，二到\
    \ 126 个端口串行连接在单个环路上。FC-AL 的访问由仲裁方案控制。FC-AL 拓扑支持所有服务类别，并在源点和响应者位于同一 FC-AL 时保证帧有序。磁盘阵的默认拓扑是仲裁环路。\n\
    \n# 光通道仲裁环路集线器 (Fibre Channel Arbitrated Loop Hub) 一种全双工、1.063 Gb 的智能集线器，用于 FC-AL\
    \ 拓扑以增加环路可靠性、连接数量以及主机系统与磁盘阵之间的距离。每个 FC-AL 集线器最多可连接十个设备。\n\n# 用于 SCSI 光通道协议 (Fibre\
    \ Channel Protocol for SCSI, FCP) FCP 定义了一种高层光通道映射层（FC-4），它利用低级光通道（FC-PH）服务通过\
    \ FC 链路在 SCSI 起器和 SCSI 目标之间传输 SCSI 命令、数据和状态信息，使用 FC 帧和序列格式。\n\n# 帧 (Frame) 光通道应用数据传输的最小、不可分单元。帧的大小取决于硬件实现，与应用程序无关。帧以\
    \ 4 字节的帧起始（SOF）开始，以 4 字节的帧尾（EOF）结束，包含 24 字节帧头和一个 4 字节循环冗余校验（CRC），并携带从 0 到 2112\
    \ 字节的可变数据负载，其中前 64 字节可用于可选头。\n\n"
