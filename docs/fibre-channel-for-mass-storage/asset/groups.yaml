  - '[PAGE 147]


    # SCSI Port


    An opening at the back of the SCSI MUX providing connection between the SCSI adapter
    and the SCSI bus.


    # Shortwave


    Lasers or LEDs that emit light with wavelengths around 780 nm or 850 nm. Short
    wave lasers are used for Fibre Channel links up to approximately 700 m. They are
    typically used with multimode fibre. The preferred fibre core size is 50 microns
    since this fibre has large bandwidth so that the distance is limited by the fibre
    attenuation. A 62.5 micron core size is also supported for compatibility with
    existing FDDI installations. Fibre of this type has smaller bandwidth, and in
    this case, the distance is limited by the fibre bandwidth.


    SP See Storage-Control Processor (SP).


    # Storage-Control Processor (SP)


    A printed-circuit board with memory modules that control the disk modules in the
    storage system chassis. The SP runs Grid Manager, which is used to bind and unbind
    logical disk units, set up disk array caching, observe array status, and view
    the SP event log. The SP in a disk array divides the multiplexed SCSI-2 bus traffic
    from the host into five internal, single-ended, SCSI-2 buses (identified by the
    letters A, B, C, D, and E). Each internal SCSI-2 bus supports multiple logical
    disk units (LUNs).


    # Topology


    The physical layout of devices on a network. The three Fibre Channel topologies
    are fabric, arbitated loop, and point-to-point. The disk array’s default topology
    is arbitated loop.'
