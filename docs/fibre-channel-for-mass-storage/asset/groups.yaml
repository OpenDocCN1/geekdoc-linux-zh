    # High Availability Fibre Channel Disk Array


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_122_0.png)


    Figure 5-19 High Availability (redundant loop) Topology


    In this topology each host uses two FC I/O adapters and each disk array use dual
    SPs. One adapter in each host and one SP in each disk array connect to one HP
    FC-AL Hub, forming FC-AL. The second adapter in each host and the second SP in
    each disk array connect to the second HP FC-AL Hub, cabled into a separate FC-AL.
    This creates two redundant FC-ALs.


    Because each HP FC-AL Hub has ten ports, either two hosts and eight disk arrays
    or four hosts and six disk arrays can attach to each HP FC-AL Hub. If any hardware
    component (SP, host FC I/O adapter, HP FC-AL Hub, or fibre optic cable) fails
    in one FC-AL, the I/O communication between hosts and disk arrays can continue
    through the other FC-AL.'
