    Channel and therefore only the SC connectors shown in Figure 2-5.


    The Fibre Channel standard does provide connections to co-ax and proper cabling.


    For co-ax cable:


    - * the TNC for receive

    - * the BNC for transmit


    For copper cable the shielded twisted-pair (STP), 9-pin D-type connector (DB9),
    is used. To prevent accidental attachments, the middle five holes in the Fibre
    Channel DB9 female connector are filled.


    ## 2.2.2 Fiber Optic Cables


    Figure 2-6 shows a typical fiber cable and its major components. The light travels
    through the core, the smallest component. The core is covered, or surrounded,
    by a material called cladding. Its purpose is to keep the light in the core, not
    let it escape.


    | POLYURETHANE |

    | OUTER JACKET |

    | STRENGTH | MEMBERS |


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_41_0.png)


    **Figure 2-6** Fiber Cable Components


    Then the cladding is wrapped by a coating which is in turn wrapped by the buffer
    jacket. This is all done so the light stays within the the core. However, the
    core fiber itself is very thin and fragile. Therefore to give strength to the
    cable and more protection to the core fiber, the buffer jacket is wrapped with
    a strengthening material. Finally, all of these layers of fiber and material are
    wrapped with the polyurethane outer jacket. Fiber cable is not subject to electromagnetic
    interference, and since the data is transmitted by light it is secure from eavesdropping.


    ## FC-0: The Physical Layer


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_42_0.png)


    ## Figure 2-7 Light Transmission


    Figure 2-7 demonstrates how light travels through the core. It is reflected from
    side to side. This also shows the cladding keeping the light in the core.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_42_1.png)


    ## Figure 2-8 Bend Radius


    Figure 2-8 shows what happens when the bend radius of fiber cable is exceeded.
    The maximum bend radius is 3 cm. If the cabling is bent beyond 3 cm, data loss
    or data corruption is likely to occur. The core fiber may also crack or break.


    ### 2.2.2.1 OFC and non-OFC


    Open Fibre Control (OFC) is a safety feature used to prohibit the laser light
    from functioning when there is a break or disconnect in the fiber cable. This
    is used specifically with high intensity laser lights. Hewlett-Packard uses non-OFC
    because the lasers are of low intensity. Therefore, the laser light is not turned
    off when there is a disconnect. However, this does not mean you should look at
    or point the fiber cable directly at your eye, since there could still be some
    damage. When checking a fiber cable to see if a laser light exists, point the
    cable end at a white piece of paper. If a red dot appears on the paper, then the
    transmitting laser is functioning.


    ### 2.2.2.2 Wavelength


    Wavelength is a topic related to single and multimode connectors. Long wave lasers
    are used for long Fibre Channel links, from approximately 500 to 10,000 meters.
    They are typically used with single mode fiber of a 9-micron size.


    Short wave lasers are used for FC-AL links up to approximately 500 meters. They
    are typically used with multimode fiber. The preferred fiber core size is 50-micron.
    62.5-micron core size is also supported for compatibility with existing FDDI installations.
    However, fiber of this type has smaller bandwidth and, in this case, the distance
    is limited by the fiber bandwidth. The length recommendation for the 62.5-micron
    fiber cable is 175 meters.


    When pulling new cable, it is recommended that the customer pull both 9- and 50-micron
    cable to accommodate future expansion.


    ## 2.3 FC-1: The Transmission Protocol Level


    The FC-1 level defines the transmission protocol including the 8B/10B encode/decode
    scheme, byte synchronization, and character-level error control. This protocol
    uses the 8B/10B encoding scheme that encodes 8-bit bytes into 10-bit transmission
    characters. The 8B/10B encoding was developed by IBM and was determined by IBM.

