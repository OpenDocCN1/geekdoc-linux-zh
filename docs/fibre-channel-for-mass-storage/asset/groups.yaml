    单模连接器和多模连接器连接到光缆。单模光缆比多模光缆更细，带宽也更小。因此，单模光缆用于远距离传输，10,000 米（10km），而多模光缆用于较短的距离，500
    米。


    在这种情况下，一个应用示例可能是使用单模光纤连接两个隔着一定距离的建筑。然后，在每栋建筑内部使用多模光缆连接每一层。


    需要注意的是，在单模和多模布线的混合环境中工作时，请注意连接器具有键槽设计，以防止单模意外连接到多模或反之亦然。然而，连接器的键槽设计并非完美，也没有完全标准化。此外，多模光纤与单模传输器和接收器不兼容。单模光在
    50 或 62.5 微米的大光纤中“乱跳”并迅速耗散，导致数据丢失。


    目前，惠尔-惠普（Hewlett-Packard）在其光纤通道的使用中仅支持光缆，因此仅支持图 2-5 所示的 SC 连接器。


    光纤通道标准确实提供了到同轴和适当布线的连接。


    对于同轴电缆：


    - 接收使用 TNC

    - 传输使用 BNC


    对于铜电缆，使用了屏蔽双线（STP）9 针 D 型连接器（DB9）。为了防止意外连接，光纤通道 DB9 母连接器中的中间五个孔被填充了。


    ## 2.2.2 光电缆


    图 2-6 显示了典型的光电缆及其主要组件。光通过最小的组件——纤芯传输。纤芯被一种称为包层的材料覆盖或包围。它的目的是让光保持在纤芯内，不让其逸出。


    | 聚氨酯 |

    | 外护套 |

    | 强度加强成员 |


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_41_0.png)


    **图 2-6** 光电缆组件


    然后，包层外面被涂层包裹，涂层再被缓冲护套包裹。这一切都是为了让光保持在纤芯内。然而，光纤芯本身非常细且易碎。因此，为了给电缆提供强度并为纤芯提供更多保护，缓冲护套包裹了加强材料。最后，所有这些光纤和材料层都用聚氨酯外护套包裹。光电缆不受电磁干扰的影响，由于数据是通过光传输的，因此它是防窃听的。


    ## FC-0: 物理层


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_42_0.png)


    ## 图 2-7 光传输


    图 2-7 展示了光如何通过纤芯传输。它在侧面之间反射。这还显示了包层如何将光保持在纤芯内。


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_42_1.png)


    ## 图 2-8 弯半径


    图 2-8 显示了当超过光电缆的弯半径时会发生什么情况。最大弯半径为 3 厘米。如果布线弯曲超过 3 厘米，可能会发生数据丢失或数据损坏。纤芯也可能会裂裂或断。


    ### 2.2.2.1 OFC 和非 OFC


    开放光纤控制（OFC）是一种安全功能，用于在光电缆断裂或断开时禁止激光光工作。这专门用于高强度激光光。惠尔-惠普使用非 OFC，因为这些激光是低强度的。因此，当发生断开时，激光光不会关闭。但并不意味着你应该直视光电缆或将其直接对准你的眼睛，因为仍可能造成损伤。在检查光电缆是否存在激光光时，将电缆末端对着一张白纸。如果纸上出现红点，则发射激光正在正常工作。


    ### 2.2.2.2 波长


    波长是一个与单模多模连接器相关的话题。长波激光用于长距离光纤通道链路，范围大约从 500 到 10,000 米。它们通常与 9 微米尺寸的单模光纤配合使用。


    短波激光用于长约 500 米的 FC-AL 链路。它们通常与多模光纤配合使用。首选的光纤芯尺寸为 50 微米。为了兼容现有的 FDDI 安装，也支持 62.5
    微米的纤芯尺寸。然而，这种光纤的带宽较小，在这种情况下，距离限于光纤带宽。62.5 微米光电缆的建议长度为 175 米。


    在拉新电缆时，建议客户同时拉 9 微米和 50 微米的电缆以适应未来的扩展。


    ## 2.3 FC-1: 传输协议层


    FC-1 层定义了传输协议，包括 8B/10B 编码/解码方案、字节同步和字符级错误控制。该协议使用 8B/10B 编码方案将 8 位字节编码为 10 位传输字符。8B/10B
    编码是由 IBM 开发并由 IBM 确定的。

    '
