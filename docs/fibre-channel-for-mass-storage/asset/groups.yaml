    ## 3.1 FC-AL Characteristics


    There are three topologies supported by Fibre Channel: loop, point-to-point, and
    switched. FC-AL is the loop topology that will be discussed here. The FC-AL is
    a means by which to connect two or more (up to 126) devices in a serial loop configuration.
    This solution is considered low cost because it does not use hubs and switches
    in small to medium configurations. It also provides capability to connect to larger
    loops and fabrics where hubs and switches are used.


    In the FC-AL each port discovers when it has been attached to a loop. Addresses
    are assigned automatically on initialization. Access to the loop is arbitrary,
    there are no collisions and there is no single permanent loop master.


    FC-AL permits fair access on a single arbitrated loop. Access fairness means every
    port wanting to initiate traffic will have the opportunity to own the loop and
    initiate traffic before any other port has the opportunity to own the loop for
    the second time.


    ### 3.1.1 Types of Loops


    ### 3.1.1.1 FC-AL Private Loop


    A private loop is enclosed and known only to itself. Figure 3-1 demonstrates a
    common configuration used with FC-AL for Fibre Channel Mass Storage. In this example,
    the processor node has only one Fibre Channel host bus adapter (HBA).


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_58_0.png)


    Figure 3-1 FC-AL Private Loop


    The processor node is connected to the hub. Then the three devices, in this case
    disk arrays, are connected to the hub and the loop is formed. If the hub is not
    used then the connection with all three disk arrays cannot be made. A connection
    to only one, in point-to-point fashion, could be accomplished. Another option
    would be to install three HBAs into the processor node and connect each to a disk
    array separately.


    The hub then, provides an advantage in saving HBA slots in the processor node
    and allows multiple storage devices to be added to the loop. Currently, this is
    the type of loop configuration Hewlett-Packard supports.


    ### 3.1.1.2 FC-AL Public Loop


    A Public Loop, shown in Figure 3-2, requires a fabric and has at least one FL_Port
    connecting to a fabric. A public loop extends the reach of the loop topology by
    attaching the loop to a fabric. Public loops are a way to leverage the cost of
    one switched connection over many devices in a loop. Connecting a loop to a fabric
    is similar to connecting a local area network (LAN) to a wide network (WAN). The
    fabric is usually represented by a cloud, as shown in Figure 3-3.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_59_0.png)


    Figure 3-2 FC-AL Public Loop


    ### Figure 3-3 FC-AL Fabric


    Hewlett-Packard does not currently support public loops or fabrics.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_60_0.png)


    ## 3.2 Operations of the FC-AL


    ### 3.2.1 Primitive Signals


    | Table 3-1 Primitive Signals |

    | --- | --- |

    | ARB(x) | Arbitrate address x for loop control |

    | OPN(y) | Open one other NL_Port<br>- Full duplex<br>- Half duplex |

    | OPN(r) | Replicate<br>- Broadcast<br>- Selective replicate or multicast |

    | CLS | Close the circuit at the NL_Port |

    | MRK(tx) | Synchronization signal ‘t’ from ‘x’ |


    Note:

    The ''x'' is the address of the port wanting to own the loop and the ''y'' is
    the address of the port to be opened.


    Primitive signals are sent by a transmitting port and recognized and acted upon
    by a receiving port. Currently, the MRK signal is not supported by Hewlett-Packard.


    ### 3.2.2 Primitive Sequences


    Primitive sequences are not recognized or acted upon until the third-consecutive
    occurrence of the ordered set. Currently, there are only three primitive sequences
    used:


    - LIP Loop Initialization

    - LIPB Loop Port Bypass

    - LPE Loop Port Enable


    The LIP sequence allows for discovery of ports on the loop. This means that when
    a new node is connected to a loop, the LIP sequence discovers it and allows for
    the new node to be initialized on the loop.


    ### 3.2.3 Arbitrated Loop Physical Address (AL-PA)


    All ports have a 24-bit native address identifier, called the N_Port ID. The AL-PA
    is in the lower (8) bits of this identifier. The lower the address, the higher
    the priority is for arbitrating. An 8-bit field can have values from 0–255, or
    256 values. However, not all of these are used for physical addresses.


    AL-PA values must have neutral disparity. (Remember that 8B/10B encoding has positive,
    negative, or neutral disparity.) There are only 134 neutral disparity values out
    of the set of 256 8-bit addresses. 126 values, of the 134, are used for port addresses
    and 8 are used for control functions. Hewlett-Packard uses addresses 00-EF. See
    Table 3-2 for further reference.


    AL-PA values must have neutral disparity. (Remember that 8B/10B encoding has positive,
    negative, or neutral disparity.) There are only 134 neutral disparity values out
    of the set of 256 8-bit addresses. 126 values, of the 134, are used for port addresses
    and 8 are used for control functions. Hewlett-Packard uses addresses 00-EF. See
    Table 3-2 for further reference.


    The upper 16 bits of the AL-PA are zero.


    ### Table 3-2 AL-PA Values


    | Value | Description |

    | --- | --- |

    | 00 | Reserved for control functions |

    | 01-EF | Available for port addresses |

    | F0 | Reserved for control functions |

    | F1-F6 | Available for port addresses (Wait, F7 is below) |

    | F7 | Reserved for |

    | F9-FE | Available for port addresses |

    | FF | Reserved for control functions |


    ## 3.2.4 Loop States


    ### 3.2.4.1 Operation Overview


    In an arbitrated loop, a port acquires the loop by sending an OPN signal to the
    destination. Upon receiving the OPN signal, the destination enters the Open state
    and physically opens the loop at its port.


    ### 3.2.4.2 The Monitoring State


    After port initialization, all ports in the monitoring state, the loop is idle,
    there is no data being transmitted. While in the monitoring state, ports act as
    repeaters and are listening for any ordered set.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_64_0.png)


    Figure 3-4 Monitoring or Idle State


    ### 3.2.4.3 The Arbitration Process


    To begin the arbitration process, a port, in this example Port A, sends the primitive
    signal ARB(a) to notify the loop of its intention to own the loop. Port A wins
    arbitration when the ARB(a) is returned. When a port wants to acquire the loop,
    there can be different conditions on the loop:


    - Some other port may already have control of the loop.

    - Several ports may be trying to acquire the loop at the same time.


    Port A will win when:


    - No other port controls the loop, and

    - No port with a lower AL-PA address (higher priority) is arbitrating.


    Once a port has acquired the loop, it opens the loop, preventing all other ports
    from acquiring the loop. It receives and discards all ARB(x) primitive signals.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_65_0.png)


    Figure 3-5 Arbitration Process


    ### 3.2.4.4 The Open State


    In this example, Port A has acquired the loop. It is now in the Open state with
    the loop physically open at Port A. Nothing may be done until Port A has completed
    a circuit with its intended destination, in this example, Port C.


    Port A sends the OPN primitive signal naming C with an OPN(c,a) for full duplex
    or an OPN(c,c) for half duplex. Port C is monitoring the loop, acting as a repeater,
    and listening for any ordered set. Once it receives the OPN primitive signal from
    Port A, it enters the Open state and physically opens the loop at its port.


    The loop is now open between Port A and C and is considered to be a point-to-point
    connection.


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_66_0.png)


    Figure 3-6 The Opened State

