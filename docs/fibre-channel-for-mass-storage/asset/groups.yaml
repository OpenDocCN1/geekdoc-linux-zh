    # Overview of Fibre Channel for Mass Storage


    This chapter discusses:


    - Limitations of current mass storage architectures

    - How Fibre Channel answers these limitations

    - Basic terms and topologies


    # 1.1 Current Mass Storage Architectures


    Current architectures (data transfer protocols) have three major problems:


    1. Limited speed

    2. Limited distance between devices

    3. Limited number of devices supported


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_23_0.png)


    **Figure 1-1** Current Limitations


    # What is Fibre Channel?


    For example, the small Computer System Interface (SCSI) parallel interface is
    restricted to:


    - the bus being no longer than 25 meters

    - 32 SCSI devices per bus

    - a double cable system


    In today''s modern computer system environments, these restrictions are very limiting
    to design and confining in space, and it gets worse. The two-byte wide SCSI P-cable
    limits configurations to 16 devices.


    The single-ended SCSI protocol is limited to eight IDs or addresses per bus (seven
    devices and one controller), and wide differential SCSI is limited to 16 IDs per
    bus (15 devices and one controller) to configure a 1-terabyte disk storage unit.
    A fully redundant disk array would require 30 SCSI IDs (two per bus).


    These concerns about limited speed, distance, and number of devices caused the
    industry to start thinking about alternatives. The alternative is Fibre Channel.


    # 1.2 What is Fibre Channel?


    Fibre Channel is a new communications protocol designed to overcome the limitations
    of existing architectures. It is a generic data transport mechanism with the primary
    task of transporting data at the fastest rate possible using current technology.
    Fibre Channel is a scalable interface for achieving high-speed data transfer rates
    among heterogeneous systems and peripherals. System types could include supercomputers,
    mainframes, workstations, and desktops (personal computers).


    Peripherals could include mass storage devices such as disk arrays and possibly
    tape libraries. The main purpose of Fibre Channel is to have any number of existing
    protocols over a variety of physical media and existing cable options. The following
    table demonstrates the various speeds that can be attained using the different
    cable types.


