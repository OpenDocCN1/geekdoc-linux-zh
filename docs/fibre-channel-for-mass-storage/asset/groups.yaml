    # FC-4: Mapping


    ![](img/92bf92f19abc8dc2f49e0cf07e857a0c_52_0.png)


    Figure 2-13 FC-3 Common Services Level


    # 2.6 FC-4: Mapping


    Mapping is a set of rules that is defined to move information from the Upper Level
    Protocol interfaces to the lower Fibre Channel levels. The ANSI SCSI committee
    and the Fibre Channel committees are currently defining these rules.


    Currently the rules provide for transforming information units into Fibre Channel
    sequences and exchanges and back again. When fully developed, the mapping rules
    are intended to provide clear mapping instructions between the Upper Level Protocol
    (ULP) and the FC-3 and FC-2 levels to enhance interoperability between applications.'
  - '[PAGE 53]


