    # Fibre Channel Futures


    This chapter discusses:


    +   * Future developments and improvements of Fibre Channel

    * Where to get more information regarding Fibre Channel'
  - '[PAGE 137]


    # 6.1 Future Enhancements


    Fibre Channel is evolving rapidly and new elements are constantly being defined.
    These new elements will produce a more powerful architecture to support mass storage.


    Most of the work thus far in defining the Fibre Channel physical standards (FC-PH).
    Although there will be more work done in this area, the larger amount of work
    in defining standards will be done in the FC-3 and FC-4 levels.


    # 6.1.1 What Lies Ahead


    # 6.1.1.1 Faster Fiber Rates.


    The faster Fibre Channel rates of 2-plus Gbps and 4-plus Gbps are still theoretical.
    When implemented, however, they could greatly increase throughput. Since Hewlett-Packard
    supports Fibre Channel as part of it''s future technology, it is continuing to
    produce chips and other components to support the faster rates of data transfer.


    # 6.1.1.2 Hunt Groups


    More and better definitions of hunt groups and how they will or should operate.
    Hunt groups could increase throughput by sending frames to an alternate port on
    a node, eliminating the possibility of a busy N_Port blocking communication.


    # 6.1.1.3 Multicast Groups


    As discussed in the FC-3 Common Services section of Chapter Two, the FC-3 level
    allows a single information unit to be transmitted to multiple N_Ports on a node.
    Multicast groups then could increase throughput by efficiently replicating frames
    to be sent to multiple N_Ports. This is roughly equivalent to a person using broadcast
    voice mail or email distribution lists.'
  - "[PAGE 138]\n\n# 6.1.1.4 Classes of Service\n\nNewer classes of service will be\
    \ added. They may address voice or video, which will offer new communication possibilities\
    \ while placing new demands on the architecture.\n\n# 6.1.1.5 Other Possible Enhancements\n\
    \nOther enhancements may address problems in the FC-AL standard or may come in\
    \ the area of network management improvement. The following list includes some\
    \ of the other possible improvements.\n\n+   * Improved flow control\n* Low-level\
    \ error recovery\n* Spatial reuse — more than one conversation on the loop at\
    \ one time\n* Full frame buffering\n* Network management\n  - identification of\
    \ topology\n  - discovery of topology when loop configuration changes\n* Faster\
    \ ULP error recovery\n* Low-cost switching hubs\n\nEven though these enhancements\
    \ may be coming, Hewlett-Packard is only committed to the currently defined standards."
