    # 什么是光纤通道？


    例如，小型系统接口（SCSI）并行接口受限于：


    - 总线长度不超过 25 米

    - 每个总线支持 32 个 SCSI 设备

    - 双电缆系统


    在当今的现代计算机系统环境中，这些限制对设计和空间限制是非常是非常大的，而且情况在变糟。双字节宽 SCSI P 缆将配置限制在 16 个设备。


    单端 SCSI 协议限制为每个总线 8 个 ID 或地址（7 个设备和 1 个控制器），宽差分 SCSI 限制为每个总线 16 个 ID（15 个设备和 1
    个控制器），以配置 1TB 的磁盘存储单元。完全冗余的磁盘阵列需要 30 个 SCSI ID（每个总线两个）。


    这些对速度、距离和设备数量限制的担忧导致行业开始考虑替代方案。替代方案就是光纤通道。


