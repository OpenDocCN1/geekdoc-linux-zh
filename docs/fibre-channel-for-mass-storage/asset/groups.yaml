    \nSupported cable lengths for each segment of the FC-AL include 2 m, 16 m, 50\
    \ m, 100 m, 500 m, and 10 k. The maximum combined cable lengths for all segments,\
    \ that is, the total length of the FC-AL, should not exceed 11 k because performance\
