    # Retyping a Directory


    When the Desktop first accesses a directory, it looks at the directories and files
    to determine their type, based on the rules defined for your system or site. This
    information is stored in a hidden file to improve performance.


    When the Desktop accesses a directory it has been in, it only examines files added
    since its last visit. However, if you execute a file, it is examined again, as
    a security measure.


    Correctly determining a file type is very important because the Desktop uses the
    information in several ways, including


    +   - To display the correct icon when files are viewed by icon

    - To carry out the correct action when files are activated

    - To determine whether files are printable and to print them correctly

    - To determine whether a program must be run in a terminal emulator window


    If you add a new rule (using the right mouse menu), the Desktop automatically
    retypes the directory. If you experience problems with file types, the Desktop
    has an option for retying directories.


    +   1. Open a directory window for the directory you want to retype.

    2. Choose File | Retype Directory.


    The directory is retyped.


