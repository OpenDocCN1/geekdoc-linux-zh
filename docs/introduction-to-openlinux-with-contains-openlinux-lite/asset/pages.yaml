    # Moving and Copying Files and Directories


    In the Desktop, you can move and copy files and directories using mouse actions
    or the File Move or File | Copy command.


    You can move or copy a file or directory from one directory to another in two
    ways:


    +   * Drag the file or directory to its new location

    * If you want to copy a file or directory instead of moving it, hold down the
    <Ctrl> key when you click and drag the icon.

    * Select the file or directory or choose the File | Move command


    # Removing Directories and Files


    In the Desktop, you can delete directories and files from your system in two ways:


    +   * Select a directory or file or choose the File | Remove command

    * Drag a file or directory to the Trash icon


    Depending on how you set your preferences, when you use the File | Remove command
    to remove a file, it might be permanently deleted. When you remove a directory,
    the directory and all its files and subdirectories might also be deleted.'
