    **Specifying an External Shell.** The External Shell field displays the pathname
    of the shell the Desktop uses for any operation that requires an external shell,
    for many double-click actions, and for the Terminal Emulator command from the
    Desktop | Run menu.


    You can change the shell if you prefer another. Otherwise, use the default shell,
    bash.


    **Specifying Commands for Printing.** When the Desktop prints a file, it uses
    two commands: one to format the file and one to spool it to the printer. These
    two commands are displayed in the Print Formatter and Print Spool fields in Execution
    Preferences.


    The formatter command processes the file for printing—it might paginate the document
    or put in headers. The spooler command receives the data produced by the formatter
    command and sends it to the printer.


    To determine the correct values for Print Formatter and Print Spooler, take the
    full command string you would normally use to print files and split it at the
    pipe symbol (|). Put the first half of the command in the Print Formatter field.


    The Desktop assumes that the names of files to be printed are inserted at the
    end of the print command. If the names belong somewhere other than the end, insert
    the special symbol for selected files (#f) where the file name should be placed.
    Put the second half of the command in the Print Spooler field.


    The Desktop supplies the pipe symbol at execution time. For example, if you would
    print a file by entering on the command line


    ```

    pr filename | 1p

    ```'
