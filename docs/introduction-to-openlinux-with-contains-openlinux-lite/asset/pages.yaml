- img_proc: true
  md: '# Interacting with Windows and Dialogs


    Many windows and dialogs in the Desktop provide several common actions from which
    users select. The following lists describe actions likely to occur in windows
    and dialogs. These actions appear in approximately this order in windows. The
    actions and meanings are


    +   - "Yes" and "No" answer a question and close the window.

    - "OK" applies changes you make and closes the window.

    - "Apply" applies changes you make but does not close the window.

    - "Reset" cancels changes not saved or applied, and does not close the window.

    - "Cancel" closes the window without performing actions not already saved or applied
    to the application.

    - "Help" provides information about the dialog.

    - "Stop" ends the current task at the earliest possible breaking point.


    # Using Accelerator Keys


    The Desktop is controlled primarily with a mouse. However, you can also use a
    key or key combination to perform Desktop operations. In most windows, you can
    hold down the <Alt> key and press the underlined letter in a menu to select that
    menu option.


    An accelerator key is a single key (such as F1) or a key combination (such as
    Ctl+Y) assigned to a command in a menu. Using an accelerator key has the same
    effect as selecting the command from the menu with the mouse.


    Many commands can be selected with accelerator keys. If so, the key sequence is
    displayed at the right of the command in the menu. Accelerator keys are abbreviated
    in menus. For example, when you see ^Y in the Windows menu in the Desktop window,
    hold down the Control key and press Y.


    A list of accelerator keys is included in the online Desktop User Guide.'
  merge: -1
