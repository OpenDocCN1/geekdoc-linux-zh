  md: '# Using Environment Variables


    This section discusses how to use the Environment Variables command from the Options
    menu in the Desktop window to work with environment variables.


    # What Are Environment Variables?


    Environment variables provide a shorthand way to insert data into a command line
    or directory path and to pass information between programs.


    Standard environment variables contain information about your operating environment.
    You cannot change or delete the variables of some standard environment variables,
    but you can change their contents. In addition, you cannot change or delete the
    following (a lock appears beside their names in the list):


    +   * HOME (the pathname of your home directory)

    * PATH (your search path)

    * TERM (your terminal type)


    To use an environment variable in a text field or in another shell, enter a dollar
    sign ($) and the variable name. The Desktop, or another shell, substitutes the
    value of the variable at the point where the variable appears in the field.


    The Desktop exports environment variables so that any program run by the Desktop
    inherits the current list of variables.


    # Editing Environment Variables


    +   1. On the Desktop, select Options | Environment Variables.


    The Environment Variables window opens.'
