  md: '# Learning to Use the Desktop


    The Desktop is a graphical user interface to the Calder OpenLinux operating system.
    You can use the Desktop to organize your personal workspace so that the programs,
    files, and directories you use most often are readily accessible.


    With the Desktop, you can run an application (like a spreadsheet or word processor)
    by double-clicking the program''s icon *or* one of its data files.


    To move a file between directories, you can drag it from one window to another
    with the mouse. You can perform tasks such as creating links and changing file
    ownership and access permissions without typing a single command.


    The Desktop interface is included with the CD-ROM in this book, but only as a
    time-limited test version. The rest of the OpenLinux system will continue to function,
    but the Desktop interface described in this chapter will only be available for
    the first 30 days after you install your system.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Chapter 5: Learning to Use the Desktop


    Following are a few of the tasks that the Desktop simplifies for you:


    +   * Running programs

    * Opening files for editing

    * Printing files

    * Viewing the contents of directories

    * Creating new directories

    * Moving and removing directories

    * Moving, copying, and removing files

    * Finding directories and files in your system

    * Displaying and changing information about directories and files


    This chapter describes how to use the Desktop to organize your work. It provides
    a brief description of the capabilities of the Desktop and how to use them. A
    more complete reference to using the Desktop is provided online in the Desktop
    User''s Guide, which you can access from the Caldera Info icon on your Desktop.


    # Starting and Using the Desktop


    When your system is first installed, the Desktop is configured as the default
    application of the X Window System graphical environment. This means that when
    you start the graphical system (as described below), the Desktop starts. When
    you exit the Desktop, the graphical system exits, returning you to a character-based
    display.


    You can change the default configuration, so that the Desktop does not start automatically.
    The online Desktop User Guide contains instructions to do this. Using start-up
    options during the Desktop initialization is described as well. For example, you
    can have directories opened automatically, the default colors changed, or sound
    turned off, as the Desktop starts.'
  merge: -1
