  md: 'I''d also like to thank Matt Foster who did the original re-write.


    # 2. Printing Under Linux


    This section discusses how to print files, examine the print queue, remove jobs
    from the print queue, format files before printing them, and configure your printing
    environment.


    # 2.1. History of Linux Printing


    The Linux printing system---the lp system---is a port of the source code written
    by the Regents of the University of California for the Berkeley Software Distribution
    version of the UNIX operating system.


    # 2.2. Printing a File Using lpr


    By far, the most simplistic way to print in the Linux operating system is to send
    the file to be printed directly to the printing device. One way to do this is
    to use the cat command. As the root user, one could do something like


    ```

    # cat thesis.txt > /dev/lp

    ```


    In this case, /dev/lp is a symbolic link to the actual printing device---be it
    dot-matrix, laser printer, typesetter, or plotter. (See ln(1) for more information
    on symbolic links.)


    For the purpose of security, only the root user and users in the same group as
    the print daemon are able to write directly to the printer. This is why commands
    such as lpr, lprm, and lpq have to be used to access the printer.


    Because of this, users have to use lpr to print a file. The lpr command takes
    care of all the initial work needed to print the file, and then hands control
    over to another program, lpd, the line printing daemon. The line printing daemon
    then tells the printer how to print the file.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# 2. Printing Under Linux


    When lpr is executed, it first copies the specified file to a certain directory
    (the spool directory) where the file remains until lpd prints it. lpd is told
    that there is a file to print, it will spawn a copy of itself (what we programmers
    calling forking). This copy will print our file while the original copy waits
    for more requests. This allows for multiple jobs to be queued at once.


    suppresses printing of the burst page, -s creates a symbolic link instead of copying
    the file to the spool directory (useful for large files), and #n specifies the
    number of copies to print. An example interaction with lpr might be something
    like


    ```

    $ lpr #2 -sp dj thesis.txt

    ```


    The syntax of lpr(1) is a very familiar one,


    This command will create a symbolic link to the file thesis.txt in the spool directory
    of the printer named dj, where it would be processed by lpr. It would print a
    second copy of thesis.txt.


    ```

    $ lpr [ options ] [ filename ... ]

    ```


    If name is not specified, lpr expects input to come from standard input (usually
    the keyboard, or another program''s output). This enables the user to redirect
    a command''s output to the spool printer. As such,


    For a listing of all the options that lpr will recognize, see lpr(1).


    ```

    $ cat thesis.txt | lpr

    ```


    # 2.3. Viewing the Print Queue with lpq


    or,


    To view the contents of the print queue, use the lpq command. Issued without arguments,
    it returns the contents of the default printer''s queue.


    ```

    $ pr -n160 thesis.txt lpr

    ```


    The lpr command accepts several command-line arguments that allow a user to control
    how it works. Some of the most widely used arguments are: -Pprinter specifies
    the printer to use, -h


    The returned output of lpq can be useful for many purposes.


    ```

    $ lpq lpr is ready and printing Rank Owner Job Files Total Size active mwf 31
    thesis.txt 682048 bytes

    ```


