    # Understanding the Graphical Environment


    OpenLinux uses the X Window System, often called "X," to provide a powerful, distributed
    graphical environment. Below are basic concepts to get you started using this
    graphical environment.


    # X and the Desktop


    The X Window System is a graphical subsystem on which X applications run. The
    Desktop interface interface provided on your Calder system is simply an application
    that uses the X Window System. As configured in OpenLinux, when you Exit the Desktop
    (by choosing Exit Desktop from the File Menu), the X Window System remains open.
    From the blank X Window screen, you can see a menu of options by holding down
    the left mouse button.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'The Desktop provides a convenient graphical method of interacting with, viewing,
    and configuring your filesystem and other computer resources.


    # Multiuser and Multitasking


    The X Window System is a distributed, multiuser, multitasking graphical environment.
    It relies on the underlying Linux operating system for its functionality; but
    provides a graphical interface to use the capabilities of Linux.


    As with it itself, you can have many applications running at the same time. They
    all continue simultaneously. If you have X terminals connected to the same network
    as the computer OpenLinux, many users can each be using several graphical applications
    at the same time. The only limitations are how fast your machine is, and how much
    disk space, swap partition space, and memory you have.


    # Using Graphical Windows


    When you have several graphical applications running on your Desktop, one application
    at a time has “focus." You can give focus to another window by placing the mouse
    pointer on that window''s title bar and clicking the left mouse button. The Title
    bar and border of the application with focus changes color. Your keystrokes are
    sent to the application which has focus, even if a part of the window is covered.


    +   To bring an application window to the front, so that no other windows cover
    part of it, click the mouse pointer on the Title bar of the application that you
    want to use.


    +   You can resize a window by placing the mouse pointer in any corner of the
    window, or on the edge of the window. When the pointer changes to an arrow, you
    can click and drag the border of the window to resize it. Some windows do not
    allow resizing.


    +   To move a window to a new location on the screen, click on the title bar.
    Drag the window to a new location and release the mouse button.'
  merge: -1
