  md: '# What Is OpenLinux?


    The Caldera OpenLinux™ operating system is a complete multi-user-tasking operating
    system environment that allows users to easily interact with networked resources
    on local intranets or the worldwide Internet. OpenLinux allows an unrestricted
    number of users to browse and publish information on corporate LANs and worldwide
    networks.


    This chapter describes some of the key features of OpenLinux in more detail, explains
    some computing concepts that may be helpful as you install and use it, and lists
    where you can obtain more information about Caldera products.


    # Key Features of OpenLinux


    OpenLinux is a distribution of the Linux operating system. A Linux distribution
    is a complete Linux operating system, with its associated utilities. There are
    several different OpenLinux products, each of which will build OpenLinux as a
    foundation and add additional features and functionality to meet the needs of
    a certain group of users.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 2: What Is OpenLinux?


    The CD-ROM included with this book is OpenLinux Lite. It contains a complete Linux
    operating system, but doesn''t have the commercial components that are included
    in other OpenLinux products.


    Many of the features of OpenLinux are features inherent in Linux; others are found
    only in Caldera’s commercial OpenLinux products. Features of the OpenLinux distribution
    of Linux (and of the CD-ROM in this book) include:


    +   - High-speed networking with TCP/IP, the Internet protocol.

    - Support for a variety of other networking protocols, filesystems, and networked
    operating systems.

    - Support for hundreds of hardware components, including CD-ROM, multimedia devices,
    laptop computers, high-speed networking cards, and high-performance video graphics
    cards.

    - An easy-to-use installation program, with menu-based configuration tools that
    use the same familiar look-and-feel.

    - A POSIX-based multi-user operating environment with complete Internet connectivity
    tools, traditional UNIX® development environments, and a high-speed, pre-emptive
    multi-tasking architecture that takes full advantage of 32-bit microprocessors.
    Caldera includes support for both ELF and binary formats.

    - An unrestricted number of user accounts on each Caldera operating system, for
    use on a single computer system.

    - Complete Internet integration, including servers for DNS/NMS (name services),
    HTTP (Web), SMTP (email), FTP, SNMP (management), PPP/SLIP (dial-in), NNTP (Usenet
    News), and many others.

    - A Web server, automatically installed and configured by default, with the ability
    to host multiple domain names (“virtual domains,” used to support multiple departments
    or companies on a single computer).

    - Access to all of your existing systems as a client: UNIX, Windows NT, Windows95,
    and Windows for Workgroups 3.11.

    - Ability to remotely manage UNIX systems via remote login on networked or dial-in
    connections.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '+   Ability to remotely access network resources without requiring a separate-rate
    machine as a dedicated gateway.


    +   Ability to run many DOS and SCO UNIX applications at the same time your computer
    acts as an Internet gateway for your organization.


    # Adding Commercial Features to OpenLinux


    In addition to the features listed above, Caldera has added components that are
    not found in other Linux systems, but are part of various OpenLinux value-added
    features that make OpenLinux a complete environment for authoring, publishing,
    and browsing information on corporate or worldwide networks. Although some of
    these features are not included with the CD-ROM in this book, they are listed
    here for your information:


    +   A sophisticated Desktop interface can be used to view and manage file systems,
    including drag-n-drop functionality between applications and file types, default
    or user-selected click and drag-n-drop options, and configuration of the Desktop
    environment via graphical dials. The Desktop includes color wheels, action-sound
    defaults, icons (with editing), graphical preference selection, and much more.
    A complete chapter describing the use of the Desktop begins on page 73.


    The Desktop interface is included with the OpenLinux Lite CD-ROM in this book.
    It is a time-limited version, however, and will stop working 30 days after you
    install the OpenLinux Lite CD-ROM. (The OpenLinux operating system will continue
