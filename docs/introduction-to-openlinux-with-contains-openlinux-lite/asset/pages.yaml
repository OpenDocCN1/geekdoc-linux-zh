    - Type


    When directories and files are displayed in Wide view, you can sort by the following
    categories, in ascending or descending order:


    +   - File or directory name

    - Color (of an icon''s text)

    - Owner name

    - Group name

    - Size

    - Time and date the directory or file was last changed

    - File type


    To sort by a displayed category in Wide view, double-click a column heading. (If
    a category has been removed from the Wide view display, you cannot sort by that
    category; use the Menu view to show the category again.)


    # Sorting by Category


