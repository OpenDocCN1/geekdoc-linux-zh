  md: '# Working with Layouts


    You can arrange your workspace in many ways and then name and save each arrangement
    as a layout.


    A layout is a specific arrangement of a workspace and includes the appearance
    and contents of the Desktop window and any other open Desktop windows (except
    preferences windows). Saving a layout makes it easy to switch from one activity
    to another without manually rearranging the windows.


    For example, you could save a layout for working on budgets that include your
    spreadsheet program, documents you are working on, and a directory icon representing
    the directory in which you keep business plans. Ordinarily, when the Desktop starts,
    it restores your workspace to the exact arrangement it was in when you exited
    the Desktop.


    This arrangement (called *Startup* in the Layouts window) is not associated with
    a specific layout but is a feature of the Desktop operating environment. It can
    be thought of as a snapshot of your workspace for the last shutdown.


    The contents of the icon bar are saved as part of a layout. Certain buttons or
    external commands in one layout may be useful only for certain tasks, and you
    may not need these in other layouts.


    When you save a layout, you can only include windows controlled by the Desktop.
    You cannot save terminal emulator windows or other external program windows as
    part of your layout.


    The layouts window shows available layouts in a list. Preconfigured layouts are
    in bold at the end of the list, and miniature icons at the left of their names
    contain a small padlock, indicating they cannot be removed or overwritten. The
    first item in the layouts list, Current, is highlighted. Current is not a layout;
    it identifies the arrangement of your workspace at this time, whether or not the
    arrangement is also a saved layout.'
  merge: -1
