    +   c. If you wish to edit the hostname, choose Edit Hostname from the menu.


    +   3. Choose the Save button to make your changes permanent.


    +   4. Choose the Done button to exit the utility.


    # Basic Routing and Name Services


    In order to communicate with other computers by using their IP addresses, one
    computer must have a method of discovering the IP address of another computer.
    This is done through IP routing. Routing involves one computer keeping track of
    how to locate other computers, and passing that information on when requested
    to do so.


    # Routing


    Routing can apply to many protocols. This section refers to routing IP packets,
    which are what the Internet and the information services described in this chapter
    use.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'The computer that routed packets on a network was traditionally separate from
    the computers on which people did their daily work. The router sat in a closet
    and did nothing but receive IP packets and send them according to various routing
    protocols. On a busy network, it is still helpful to have a dedicated router to
    manage the large number of packets to be routed.


    On smaller networks, particularly those not connected to the Internet (perhaps
    providing Internet-type information services internally), a dedicated router is
    not needed. The routing functionality of OpenLinux can fill this need without
    dedicating a separate computer as a router.


    As installed by default, OpenLinux performs many routing functions. To act as
    a gateway from computers in your organization to the Internet, or from outside
    computers that dial-up to your server (via PPP), you must also have IP forwarding.
    IP forwarding is a routing feature that is included in OpenLinux, but is not turned
    on after initially installing it.


    To activate IP forwarding, you must go to the directory /usr/src/linux and enter
    the command make config. The process that this command starts is quite complicated.
    If you are unfamiliar with routing or using UNIX tools, we recommend contacting
    your ISP or a Caldera Channel Partner for information.


    # Name Services


    In addition to the IP address of a computer, we often refer to a computer by its
    hostname and domain name. These names, while useful for us, are not understood
    by other computers. They must be converted into IP addresses. The programs that
    do this conversion are providing *Name Services.*


    In the same way that a router provides information on IP addresses to other computers,
    a name server provides conversions for other computers that have a host or domain
    name and want an IP address. The name server keeps tables of how to convert many
    names, and where to send requests that it does not have a conversion for.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'The simplest form of name service is the file /etc/hosts on your Caldera system.
    This file can list host and domain names with their IP addresses. This file usually
    contains few entries, however, because you usually don''t know the IP numbers
    of all the computers on the Internet that you want to contact.


    OpenLinux includes complete functionality for the Domain Name Services (DNS) and
    Network Information Services (NIS). Setting up these services is beyond the scope
    of this book. Learning more about the following commands can help you get started,
    however. Use the man command with each one to learn more (for example, enter the
    command name named). In addition, review the files in the directory /etc/named/boot.


    +   * ifconfig

    * route

    * named

    * bind

    * dig

    * nslookup

    * whois


    # Providing Services to an Intranet


    If you have set up networking (routing with IP forwarding and DNS name server),
    all network information services are be available to anyone on your network that
    uses IP networking.


    To provide information services, review the various sections in this chapter to
    learn about setting up the services you want to have available on your system,
    then tell people in your organization about them and how to use them.'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'For example, The Web server is set up by default, you can start giving everyone
    the name of the computer on which the Web server is running, and they can start
    retrieving documents.


    # Providing Services on the Internet


    Providing information services to the Internet is really no different from providing
    them to your local organization. The only additional concerns are the security
    of information on your network, and expanding your networking connectivity to
    include the Internet.


    # Getting Connected


    Vendors of a variety of Internet-related hardware have begun to provide Linux
    drivers for their equipment. These drivers enable OpenLinux to provide the most
    cost-effective high-speed connections to the Internet. Support for Frame Relay
    cards, ISDN cards, multi-port serial cards, and related systems allow integrators
    to provide a complete Internet solution on Caldera OpenLinux without costly external
    hardware components or software add-ons. Information about these hardware products
    is included on the Caldera Web page.


    # Dedicated Internet Connections


    If you wish to create an Internet site that you anticipate will have high traffic,
    you should connect to the Internet via a high-speed, dedicated communications
    line. OpenLinux can easily be connected to this type of line with an expansion
    board (no additional software is needed). For information on creating such a connection
    to the Internet, contact a Caldera Channel Partner or your Internet Service Provider.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Chapter 6: Working With Internet and Intranet Services


    # SLIP and PPP


    # Allowing Access to Services


    This configuration allows all connections from mycompany.com and *.mycompany.com
    machines. It also allows the services talk, finger, and ftp to accept requests
    from all machines.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'The tcpd program allows much more sophisticated access control, using a combination
    of the files /etc/hosts.allow and /etc/hosts.deny. Read the tcpd(8) and hosts_access(5)
    man pages for complete details.


    # Modem Pools


    OpenLinux is ideal for those who wish to provide modem pools for users to connect
    to a network via a standard telephone line. Each modem uses a serial port. Cards
    with multiple serial ports are available from several manufacturers, and can provide
    from 4 to 256 serial ports through a single expansion slot on your PC.


    # Network Information Services


    The reason people want to connect to the Internet is because of the services that
    it provides. In this section, we describe the most popular services that you may
    want to provide on your Internet server. OpenLinux includes full capabilities
    in all of the services described below (and in many less popular services as well).


    +   * Email

    Email is used to send messages from one person to one or a few others, directly
    from machine to machine. It is not a real-time transfer, but offers the advantage
    of being able to pass through several intermediate machines to reach the addressee.
    Email on OpenLinux and the Internet uses the protocol SMTP.


    +   * FTP

    The File Transfer Protocol is used to transfer files from a centralized repository
    to a client located on the network. In practice, FTP servers (repositories) exist
    all over the world, each providing files that their owners want to make available.
    FTP is designed for direct, real-time access, but without interacting with the
    information being transferred. The protocol is actually called FTP.


    +   * Worldwide Web'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Chapter 6: Working With Internet and Intranet Services


    The Web uses the protocol HTTP to access small to medium sized documents with
    a direct, real-time connection to another computer on the network. It is similar
    to the uses of FTP, but HTTP is designed to allow the person receiving the file
    to immediately interact with the file received. In conjunction with HTTP and the
    Web, a format for the documents transferred is defined: HTML. This format is suited
    to interactive, graphical documents.


    +   - NFS

    The Network File System protocol is used to access part of a remote filesystem
    as if were part of your local filesystem. NFS is not commonly used across the
    Internet because of security and speed issues, it can be when needed.


    +   - News

    The Usenet newsgroups are like a giant communal email system, divided by subjects.
    Users can read messages submitted by others, and submit their own messages, which
    everyone can read. Using the protocol NNTP, the newsgroup messages are copied
    from server to server (mirrored) so that users can quickly access them.


    # Email


    OpenLinux works very well as an organizational mail server and gateway. The following
    summary information describes OpenLinux as an email gateway using the sendmail
    program. If you require further reference on email or sendmail, we recommend the
    book *sendmail*, by Bryan Costales, from O''Reilly & Associates, Inc., and the
    documentation for sendmail, written by the author of sendmail.


    # sendmail Configuration


    A default sendmail.cf configuration file is placed in /etc during installation.
    The default configuration should work for most SMTP-only sites. It will not work
    for UUCP sites; you must generate a new sendmail.cf if you need to use UUCP mail
    transfers.'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'To generate a sendmail.cf, install the following packages from the Caldera
    CD-ROM:


    +   - m4

    - sendmail sources


    Read the README in /usr/src/mail/sendmail-8.6.9/cf for more details on creating
    sendmail configuration files.


    One common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, the main organizational Internet
    gateway, company.com, handles all mail accounts. We can add the hostnames of other
    machines in the organization to the /etc/sendmail.cw files, in order to have mail
    sent to those machines captured by the main mail server company.com. For example,
    we might add the following lines to sendmail.cw:


    ```

    # sendmail.cw - include all aliases for your

    machine.

    torgo.company.com

    poodle.company.com

    devel.company.com

    ```


    Then on the other machines (torgo, poodle, and devel), we would edit the /etc/sendmail.cf
    file to “masquerade” as company.com when sending mail, and to forward any local
    mail processing to company.com. To do this, find the DH and DM lines in /etc/sendmail.cf
    and edit them:


    ```

    # who gets all local email traffic ($R has prece-

    dence for unqualified names)

    DHcompany.com

    # who I masquerade as (null for no masquerading)

    DMcompany.com

    ```


    With this type of configuration, all mail sent will appear as if it were sent
    from company.com and any mail sent to torgo.company.com or the other hosts, will
    be delivered to company.com.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Chapter 6: Working With Internet and Intranet Services


    # Setting Up an FTP Server


    An FTP server is automatically set up as part of the standard OpenLinux installation.
    This server can be used for anonymous FTP as well. For in-formation about configuring
    your FTP server, use the command man ftpd.


    # Setting Up a Worldwide Web Server


    A Worldwide Web server is automatically started on OpenLinux to pro-vide online
    help and documentation. If you wish to use this Web server to provide documents
    to others, all you need to do is place the documents in the correct directory.
    The default directory for these document files is / home/httpd/html. You must
    be connected to the Internet for users to access your computer.


    Your OpenLinux Lite CD-ROM includes the Apache web server software, which can
    be used for multiple domain names. For example, you could advertise both CompanyA.com
    and CompanyB.com as Web addresses, while hosting sites on the same OpenLinux computer.


    The configuration files for the Web server are already set up so that all users
    can see your Web server. They can only see the files in the document directory
    of the Web server, however. You can change the configuration files for the Web
    server as needed. They are located in /etc/ httpd/conf.


    To provide information to other users via the Worldwide Web, just check the following
    points:


    +   * Place Web documents (in HTML format) in the default Web docu ment directory,
    /home/httpd/html.

    * Have a network connection to the users who want to access your Web server (this
    is usually an Internet connection).


    # Setting Up NFS Services


    All the required NFS daemons are started at boot time by default. The portmapper
    which controls access to NFS services, however, utilizes the /'
  merge: -1
  pgno: 177
- img_proc: true
  md: '/etc/hosts.allow and /etc/hosts.deny files for access control. To enable other
    machines to mount a directory from your system via NFS, you must add a line to
    /etc/hosts.allow for each machine or domain which you wish to connect to the portmapper.


    In order to avoid deadlocks, the portmap program does not attempt to look up the
    remote host name or user name, nor will try to match NIS netgroups. Thus only
    network patterns (IP addresses) will work for portmap access control. For example,
    to allow all hosts in madison.com domain (whose network address is 194.143.24.0),
    you would add the following line to /etc/hosts.allow:


    ```

    portmap: 194.143.24.0/255.255.255.0

    ```


    See the hosts_access(5) and rpc.portmap(8) man pages for complete access control
    details.


    To export a filesystem via NFS, so that other systems can mount it, include the
    directory where the filesystem is mounted on your system in the /etc/exports directory.
    For example, to allow hosts matching *.madison.com to mount /mnt/rhcsd and /mnt/cdrom
    as read-only filesystems, first add these lines to the /etc/exports file:


    +   * /mnt/rhcsd *.madison.com(ro)

    * /mnt/cdrom *.madison.com(ro)


    Then kill and restart the rpc.nfsd and rpc.mountd daemons so that they will load
    the new configuration. See the exports(5), rpc.nfsd(8) and rpc.mountd(8) man pages
    for complete details.


    # Setting Up a News Server


    OpenLinux is well-suited to act as a newsgroup server for your organization. The
    CD-ROM includes all of the software components to set up OpenLinux as an NNTP-based
    news server, allowing users to read news and post to the thousands of Internet
    newsgroups.'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'All that you need is an Internet connection, and the expertise to set up the
    news server. Setting up a news server is a complex operation, and is beyond the
    scope of this book. We recommend that you contact your network administrator,
    or consult the reference books mentioned at the beginning of this chapter.


    # Client Access to Network Information Services


    If your network has an Internet connection, you can immediately begin accessing
    Internet resources when you have installed OpenLinux. Simply execute one of the
    Internet services commands such as telnet or ftp, or double-click on the browser
    icon located on the Desktop.


    The Web browser included with OpenLinux Lite provides graphical client access
    to many services, including:


    +   * Worldwide Web

    * FTP

    * gopher


    If you prefer not to work in a graphical environment, you can also access Internet
    information systems with the following character-based utilities by entering the
    command name in a terminal window:


    +   * elm is used to read and send email

    * trm is used to read newsgroups

    * ftp is used to access ftp sites'
  merge: -1
