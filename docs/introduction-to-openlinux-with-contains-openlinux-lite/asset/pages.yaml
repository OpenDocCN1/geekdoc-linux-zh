    - **Wide** if you want to view directories and files in a wide, detailed format


    Specifying Whether Directories and Files Are Positionable. When a directory window
    is in the non-positionable format, it contains a splitter. The splitter is a horizontal
    bar that divides the window into two sections. The top section contains subdirectories;
    the bottom section contains files.


    Use Display Preferences to change the default so that directory windows open without
    the splitter and so directories and files are displayed together. They can then
    be positioned anywhere in their windows.


    Specifying Whether Hidden Files Are Displayed in Directory Windows.


    Hidden files are directories and files whose names begin with ". (with the exception
    of the current and parent directories). These directories and files are not shown
    by default because the \." prefix is often used in naming system configuration
    files or data files that users rarely need to view.


    You can use Display Preferences to change the default so that hidden files are
    displayed when a directory window opens.


