  md: '# Working With Internet and Intranet Services


    Caldera OpenLinux is ideal for providing Information services to your organization
    as an Intranet or Internet server. Though complete information about setting up
    and managing these information services is beyond the scope of this chapter, the
    following sections explain briefly how Open-Linux can be configured and used:


    +   * IP Configuration

    * Basic Routing and Name Services

    * Providing Services to an Intranet

    * Providing Services on the Internet

    * Network Information Services

    * Client Access to Network Information Services


    Becoming a full-fledged Internet server with things like a Web server, email access
    for clients, and an FTP site is not a trivial task. After you read through this
    chapter to learn the basics, you can find more assistance by looking in following
    sources.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '+   - The online documentation included on the Caldera CD-ROM. In particular,
    consult the Linux Documentation Project HOWTO documents, and the man pages for
    the services described (for example, enter the command man ftppd).


    +   - A Caldera Channel Partner, who may specialize in setup or administration
    of Internet and Intranet services.


    +   - Additional reference materials from the Internet, your Internet Service
    Provider, or your local computer bookstore.


    # IP Network Configuration


    The Internet Protocol (IP) is the basis for all networking done on the Internet.
    The IP information needed to configure your system was requested during the installation
    process. That configuration information is sufficient if you want to be a client
    on the Internet. If you want to use OpenLinux to operate an Internet server, you
    need to complete addition configuration, as described in the sections below.


    If you need to alter the IP networking information that you entered during installation,
    this section describes how to use the graphical networking configuration tools
    to do so.


    The network configuration utility is shown below. If you logged in as root, an
    icon for this utility is shown on your Desktop. You must be logged in as root
    to change IP networking. The IP networking parameters that you can edit are described
    in the paragraphs below.


    You can also use the LISA utility to configure your IP networking.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '![](img/361ba1f1a2f214d776526662a65e3151_168_0.png)


    +   * Interfaces

    Network devices can be added, removed, configured, brought up, brought down, etc.
    Ethernet, loopback, PPP and SLIP devices are supported.

    If you are using SLIP configuration, you should edit /etc/dip-script to "chat"
    properly with your SLIP server. Carefully check the wait lines, which must recognize
    what your SLIP server says.

    * Nameservers

    You can add nameservers to this dialog. These will be used to resolve domain names.

    * Hosts

    You can add specific computers to the list of Hosts. The names in this list include
    an IP address, and are used to resolve the listed domain names when a name server
    is not available.

    * Hostname

    You can change the name of your system. Changing your hostname could cause problems
    if other systems are using your system by referring to its name (for example,
    as a Worldwide Web or FTP server).


    # ## Editing Network Parameters'
  merge: -1
  pgno: 168
- img_proc: true
  md: '+   1. Start the graphical Network Configuration utility by choosing it on
    the Desktop.


    If you do not have an icon for the Network Configuration utility on your Desktop,
    you can enter the following command within a graphical terminal emulator window
    (such as xterm):


    ```

    netcfg

    ```


    +   2. Select the parameter that you wish to edit, as described in the list of
    parameters above.


    +   a. If you wish to add a parameter, an Add dialog will open when you choose
