  md: '# Preparing an Un-Shared Hard Disk


    If the hard disk on which you will install OpenLinux will not contain any other
    operating system, you should divide it into two partitions: one for the Linux
    filesystem, and one for the Swap Partition. You can complete this task during
    the installation using the Linux fdisk utility.


    The steps to follow use the Linux fdisk utility during the installation are provided
    below. You can proceed now to the Installation section; you will be directed to
    return here at the appropriate point.


    # Using the Linux fdisk Utility to Prepare Partitions


    +   1. After your hardware is recognized, choose "Yes" to set up partitions on
    your hard disk.

    2. Select the hard disk device to partition from the list shown.

    The fdisk utility starts and a list of commands is shown on-screen.

    3. Use the p command to see a list of existing partitions.

    4. If any old partitions remain, use the d command to delete them.

    5. Use the n command to create a new partition for your swap area.

    This partition should be between 16 and 64 MB in size, and should be a primary
    partition. To specify a size, you can enter something like this:

    +32MB

    6. Use the t command to mark the partition that you just created as Type 82, Linux
    Swap.

    7. Use the n command again to create a main linux partition.

    You can use the remainder of your hard disk space for this partition. It should
    be a primary partition also.

    8. Select the partition that you just created.

    9. Use the t command to mark the partition as Type 83, Linux.'
