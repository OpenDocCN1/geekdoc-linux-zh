  md: '# Networking


    OpenLinux includes a wide range of networking features. Networking is usually
    installed and configured as you install OpenLinux. To complete the network configuration
    during installation, you need your network information, including your IP address
    and router, and the addresses of your name server and network. (See the form on
    page 2 or page 27).


    IP networking information is stored in several different directories and files.
    These files are set up during installation. If you wish to change these files,
    use the configuration tools unless you are very familiar with networking. You
    can view the man page for many of these files (for example, enter the command
    man hosts). But if you are not familiar with IP networking, we recommend that
    you take the opportunity during the Installation process to install and configure
    your IP networking.


    # Hostnames and Domain Names


    In a large network, such as the Internet, computers are given names as numbers
    (see “IP Addresses” below). Different organizations or companies on the Internet
    are assigned names for their networks. These are called domain names. Examples
    include caldera.com, for.com and mit.edu.


    Within a domain (for an organization or company), a system administrator or user
    can choose a name for an individual computer. This is the computer''s hostname.
    The full name to reach that computer is a combination of the hostname and the
    domain name where that host is located. example, if a computer is named frosty,
    and is part of the network in a company with the domain name of caldera.com, then
    the fully-qualified domain name (FQDN) to reach that computer is frosty.caldera.com.
    You select the hostname for your computer in cooperation with your system administrator.
    The domain name must come from the system administrator, or you won''t be able
    to access network resources.


    On the network, the hostname and domain name are easy for people to read and remember,
    but for the computer systems, they are mapped to numbers based on the Internet
    Protocol (IP), as described below. A name'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 2: What Is OpenLinux?


    server uses the Domain Name Service protocol (DNS) to map between IP address numbers
    and hostnames and domain names.


    # IP Addresses


    Every computer on an IP-based network (including the Internet) is assigned an
    address that allows it to communicate with other computers. This address is written
    as a set of four numbers that uniquely identify a single location on the Internet,
    and allow information from other locations on the Internet to reach that computer.
    Here are several examples:


    +   * 204.141.89.7

    * 137.64.1.1

    * 137.64.131.7


    During the installation process, you will be asked for several IP addresses (see
    the form on page 27). Your system administrator or Internet Service Provider will
    have these addresses.


    An IP address allows you to reach the Internet through your Internet gateway or
    Internet Service Provider. It also allows others on the Internet to reach you.
    In some circumstances, IP addresses are assigned dynamically and you do not see
    your address information. This is most common when using dial-up services with
    SLIP or PPP (see “Using SLIP and PPP” on page 20).


    Blocks of IP addresses are assigned to organizations. Within these blocks, certain
    addresses are used for special things like gateways and name servers. Your system
    administrator will have an IP number for your computer, and will have also have
    the IP address of the computers on your network that are used as a gateway and
    a name server. These IP addresses are requested during installation.


    18


    Introduction to OpenLinux'
