    When using the Desktop, there is no single current directory. The current directory
    in each directory window is the directory whose contents are displayed in the
    window. By default, the full pathname of this directory appears in the title bar
    of each window.


    As part of your display preferences, you can choose the information you want to
    display in the window''s title bar.


    In the directory section of each directory window, the current directory is represented
    by “.” (dot). The directory that contains the current directory in each directory
    window is called the parent directory. In the directory section of a directory
