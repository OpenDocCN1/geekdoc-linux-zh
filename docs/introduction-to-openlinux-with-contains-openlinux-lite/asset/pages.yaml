  md: '# Changing Creation Preferences


    Use Creation Preferences to define a creation mask and default access permissions
    (protection modes) for new directories and files you create in the Desktop. A
    creation mask blocks permissions for new directories and files. Creation masks
    are important for maintaining security.


    If you used the Desktop to set access permissions, you know that you select checkboxes
    to allow permissions. The creation mask works in the opposite way: you select
    checkboxes to exclude permissions.


    For example, if you select the W (write) checkbox for Group when defining a creation
    mask, other members of your group will not be given write permission for files
    you create.


    When you define a creation mask, you must tell the Desktop which creation mask
    to use when you start up the Desktop: the mask defined for that environment or
    a mask you want to define. To do this, use the Store Mask or Inherit Mask buttons.


    Default access permissions are automatically assigned to directories and files
    you create. Therefore, any permissions that you block using the creation mask
    will not become default access permissions.'
  merge: -1
