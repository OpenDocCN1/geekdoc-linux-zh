  md: '# Customizing File Actions


    Initial file actions are determined by the system rulebase, which is controlled
    by the system administrator. However, the Desktop lets you create and edit user-specific
    file actions for a file or all files of a specific type.


    Use the File Actions window to enter these file actions and save them to your
    custom rulebase. Customizing file actions for yourself does not affect the system''s
    rulebase. (You can always restore the system rulebase file actions.)


    You can use several symbols to define file actions for the Desktop, in addition
    to those used by your shell. The special Desktop symbols are described in the
    following table.


    **TABLE 8.** Values of symbols used in the Command Line window


    | Option | Inserts this symbol | With this value |

    |---|---|--|

    | Selected Files | #f | The names of all files selected in the directory window
    or on the Desktop. |

    | | #F | The full pathnames of selected files. |

    | Selected Directories | #d | The names of all directories selected in the directory
    window or on the Desktop. |

    | | #D | The full pathnames of selected directories. |

    | Effective User | #u | The current user name. |

    | Effective Group | #g | The group name associated with the Desktop process. |

    | Current Directory | #c | The full pathname of the current directory, or the
    user''s home directory if running from the Desktop window than a directory window.
    This current directory appears as the title of the Command Line window. |

    | Drop Receiver | #r | The name of the drop receiver associated with selected
    files. |

    | | #R | The full pathname of the drop receiver associated with selected files.
    |'
  merge: -1
