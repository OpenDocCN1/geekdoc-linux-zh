    # Changing Execution Options


    In addition to viewing access permissions for a directory or file, you can also
    view and change execution options. These options include


    +   - The Set User ID On Execution and Set Group ID On Execution options, which
    allow other users to execute a program with the access permissions of the program''s
    owner or group. Use these permissions with extreme care: they can give other users
    control over your files.


    +   - The Save Text After Execution option (or sticky bit), which causes an executable
    file to be marked so it is less likely to be swapped out to disk between users.
    Use this option with care: it improves the performance of the application, but
    can affect the performance of more important applications.


    Although these options may only seem meaningful for executable files, they can
    also affect directories on some systems (for more information, see your system
    administrator).


    # Changing Ownership and Group Reference


    Every directory and file has an owner and a group reference. You are the owner
    of directories and files you create. If you own a directory or file, you you control


    +   - Who owns it


    +   - Which group it is associated with


    +   - Who can view it


    +   - Who can change it


    +   - Who can execute it (if it is a program)'
