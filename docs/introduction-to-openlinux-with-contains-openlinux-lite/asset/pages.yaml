    This is the default OpenLinux installation. It requires about 250 MB of disk space
    and includes the graphical Desktop, Internet servers, development tools, etc.


    +   - Minimal (without X Window System)

    This is a minimal Linux system, with no graphical system. It requires about 35
    MB.


    +   - Minimal (with X Window System)

    This is a minimal Linux system, without development tools and many utilities,
