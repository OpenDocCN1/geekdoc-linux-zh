    +   4. When prompted, press <Enter> again to continue.


    You can review the kernel messages by pressing <Left-Shift>+<PageUp> and <Left-Shift>+<PageDown>
    to be sure your hardware was detected properly.


    +   5. Answer the on-screen questions about your system.


