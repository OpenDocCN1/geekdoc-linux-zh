    +   The powerful CRiSP-LiTE text editor is provided as a default editor on the
    Desktop. Whenever you open a text file, it is displayed in CRiSP-LiTE, providing
    an intuitive interface to edit the file.


    CRiSP-LiTE is included with the CD-ROM in this book. It is not a time-limited
    version.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '+   - Netscape Navigator®, the industry-standard Internet and Web browser,
    is included with most OpenLinux products. Netscape is used not only for Internet
    browsing, but is integrated as the online help and documentation viewer.


    +   - Metro-X from Metro Link Incorporated is a commercial X server, allowing
    any configuration of your graphical interface on a variety of popular high-performance
    video cards. For additional support, XFree86 X servers from the XFree86 Project,
    Inc. are included as well, and can be installed as needed.


    Only the XFree86 graphics system is included with the CD-ROM in this book.


    # Concepts To Understand


    As a full-featured, multi-user, multi-tasking UNIX®-like operating system, OpenLinux
    may present some concepts that are unfamiliar to you. This section defines some
    basic terms that you will want to know as you install and use the operating system.


    # Virtual Memory


    Computers always have more hard disk storage than RAM storage. But RAM is where
    programs and data must be stored while you work on them. Virtual memory allows
    the programs to think that they have at their disposal more RAM than your computer
    actually has. This is done by automatically saving data to the hard disk when
    computer memory is full, and swapping that data back into computer memory when
    it is needed again by a user or application.


    For example, suppose you have 5 applications running at the same time, but you
    only have 16 MB of memory. When you load a large data file into your word processor
    document might be saved to a special place on your hard disk. When you start working
    on the word processor document again, it is moved back from the hard disk to RAM
    without the word processor application doing anything.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'OpenLinux uses virtual memory to efficiently run many applications at the same
    time, and operate on large data files without running out of memory. The area
    on the hard disk that the virtual memory feature uses is called the swap area.
    This is described further below.


    As for system memory (RAM), OpenLinux™ will operate well in 8 MB of RAM if you
    use only text mode, even if you have many users or remote terminals. If you have
    8 MB of RAM, you should specify a large swap partition (see page 13). If you will
    be using the graphical Desktop metaphor, or other applications under the X Window
    System, you should have 16 MB of RAM for best results.


    # Swap Space


    OpenLinux uses a separate partition of your hard disk to store information that
    is temporarily swapped from computer memory to hard disk by the virtual memory
    feature. This partition is called a Linux Swap Partition. The size and speed of
    the swap partition affects the performance of your system.


    You determine the size of the Swap Partition when you create partitions during
    the installation process. The Swap Partition should be equal to or larger than
    the amount of RAM (memory) that your computer has, but at least 16 MB. For example,
    a common system might have 16 MB of RAM; the Swap Partition should be between
    16 and 32 MB. If you have a system with a very large hard disk, or you run many
    applications at the same time, you could make the Swap Partition even larger.


    Any space that you include in the Swap Partition is not available for regular
    file storage by any of the operating systems running on your computer.


    # Shared Hard Disks and Boot Managers


    A single computer can be used for both OpenLinux and other operating systems.
    Most users who use this feature have either IBM OS/2, DOS, or some version of
    MS Windows on their computer with OpenLinux.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'When you have more than one operating system on your computer, you choose which
    one to use when you turn on or reboot your computer. A brief prompt asks which
    of the available operating systems you wish to start. This process is managed
    by a program called a boot manager. Boot managers are stored in the Master Boot
    Record of your hard disk or floppy disk, or on the boot record of a hard disk
    partition. When you answer the boot manager prompt, the boot manager transfers
    control to the selected operating system to continue booting.


    The boot manager included with OpenLinux is called LILO: the Linux LOader. LILO
    is configured and installed as you complete the installation.


    If you have more than one hard drive, you can easily dedicate one to your OpenLinux
    installation and a second to another operating system. You will still use LILO
    or another boot manager to choose which operating system to boot.


    While using OpenLinux, you can access data on other partitions of your hard disk
    (non-Linux partitions), as long as they are using a supported filesystem type.
    The supported filesystems include HPFS (for OS/2), FAT (for DOS/Windows 3.1),
    VFAT (for Windows95), and many UNIX filesystems. For example, if you have OpenLinux
    installed on the second partition of your hard disk, and Windows95 installed on
    the first partition, you can log in as root and use this command to mount the
    first partition:


    ```

    mount -t vfat /dev/hda1 /mnt/win95

    ```


    Now when you use the commands below, you are viewing the root directory of your
    Windows95 filesystem:


    ```

    cd /mnt/win95

    ls

    ```


    You can view, copy and create files in the Windows95 filesystem, but you must
    follow the limitations of the other filesystem (in this case, only 8.3 filenames
    can be used).'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Hardware Parameters


    The Caldera Installation program should determine what hardware you have and allow
    the installation of OpenLinux to proceed without problems.


    Occasionally, however, the Installation program needs a hint to correctly locate
    and use your hardware. If necessary, you provide this help by entering hardware
    boot parameters or kernel module (insmod) parameters during installation.


    Each boot or insmod parameter indicates a type of hardware (or other option) and
    one or more values that identify that hardware or option so that it can be correctly
    used.


    Boot parameters are entered at the boot manager prompt, before the operating system
    (or the installation) actually starts. For example, at the LILO boot manager prompt,
    you might normally enter linux (or press <Enter>) if linux is the default.


    ```

    LILO: install

    ```


    If you determine during installation that boot parameters are needed, you might
    enter something like this instead:


    ```

    LILO: install cdu31a=0x340,13 eth0=11,0x260

    ```


    This example indicates the addressing information for a Sony CD-ROM drive and
    an ethernet card. The equal sign (=) separates the parameter from the values.
    Commas separate values given to one parameter; spaces separate multiple boot parameters.


    Any boot parameters that are needed for your system are entered during the installation
    process and stored in the LILO configuration file. You don''t have to enter this
    information each time you start your system.


    Kernel module parameters or insmod parameters are entered during installation
