    # Preparing Your Hard Disk


    Before you install OpenLinux, you must prepare the hard disk of your computer.
    This accomplishes two things:


    +   * Many users wish to use two or more operating systems on a single computer,
    selecting one each time they start their computer. This is easy to do with OpenLinux,
    as long as your hard disk is partitioned so that multiple operating systems can
    co-exist.

    * The easiest way to share a computer between two operating systems, however,
    is to purchase a second hard disk and use it for the Caldera system.

    * The advanced multi-tasking provided by OpenLinux uses a feature called Swap
    Partition. This is a separate area on your hard disk that is not used to store
    your data files. Instead, the operating system uses it as a virtual memory storage
    area (see “Virtual Memory” on page 12). You must set up a free area on your hard
    disk for this Swap Partition.


    The sections below describe how to prepare the hard disk of your computer in three
    different situations:


    +   * A computer, or one that will be used only for OpenLinux.

    * A computer with both OpenLinux and a DOS or Windows system.

    * A computer with both OpenLinux and any other operating system.'
