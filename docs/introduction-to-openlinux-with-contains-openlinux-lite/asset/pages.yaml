    #  3.2. Printing PostScript files


    Printing PostScript files on a printer that has a PostScript interpreter is simple;
    just use lpr, and the printer will take care of all of the details for you. For
    those of us that don''t have printers with PostScript capabilities, we have to
    resort to other means. Luckily, there are programs available that can make sense
    of PostScript, and translate it into a language that most printers will understand.
    Probably the most well known of these programs is Ghostscript.


    Ghostscript''s responsibility is to convert all of the descriptions in a PostScript
    file to commands that the printer will understand. To print a PostScript file
    using Ghostscript, you might do something like


    ```

    $ gs -dSAFER -qPAUSE -sDEVICE=deskjet -sOutput=\lpr scripts.ps

    ```


    Notice in the above example that we are actually piping the output of Ghostscript
    to the lpr command by using the -sOutputfile.


    Ghostview is an interface for Ghostscript for the X Window System. It allows you
    to preview a PostScript file before you print it. Ghostview and Ghostscript can
    both be swiped with "


    #  3.3. Printing PDF files


    Adobe has released an Acrobat reader for Linux, and it''s available on the Adobe
    home page "". Its predecessor, xpdf, is also available. Both should print to a
    postscript device.


    #  3.4. Printing TeX files


    One of the easiest ways to print TeX files is to convert them to PostScript and
    then print them using Ghostscript. To do this, you first need to convert them
    from TeX to a format known as DVI (which stands for device-independent). You can
    do this with the tex(1) command. Then you would need'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'to convert the DVI file to a Post-Script file using dvips. All of this would
    look like the following when typed in


    ```

    $ tex thesis.tex $

    dvips thesis.dvi

    ```


    Now you are ready to print the resulting PostScript file as described above.


    # 3.5. Printing troff formatted files


    ```

    $ groff -Tasciii

    thesis.tr | lpr

    ```


    or, if you prefer,


    ```

    $ groff thesis.tr

    > thesis.ps

    ```


    and print the PostScript file as described above.


    # 3.6. Printing man pages


    ```

    $ man | col -b |

    lpr

    ```


    The man pages contain pre-formatted troff data, so we have to strip out any highlighting,
    underlines, etc. The ''col'' program does this just nicely, and we''re piping
    data, the man program won''t use more.


    # 4. Miscellaneous

    Items


    # 4.1. Formating Before Printing


    Since most ASCII files are not formatted for printing, it is useful to format
    them in some way before they are actually printed. This may include putting a
    title and page number on each page, setting the margins, double spacing, indenting,
    or printing a file in multiple columns. A common way to do this is to use a print
    preprocessor as pr.


    ```

    $ pr +4 -d -h"Ph.D.

    thesis, 2 Draft"

    -160 thesis.txt |

    lpr

    ```


    In the example, pr would take the file thesis.txt and skip the first three pages
    (+4), the page length to sixty lines (-160), double space the output (-d), and
    add the phrase "Ph.D. Thesis, 2 Draft" to the top of each page (-h). Lpr would
    then queue pr''s output. It is on-line at manual page for more information using
    pr.


    # 4.2. The PRINTER Environment

    Variables


    All of the commands in the Linux printing system accept the -P option. This allows
    the user'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'to specify which printer to use for output. If a user doesn''t specify which
    printer to use, then the default printer will be assumed as the output device.


    Instead of having to specify a printer to use every time that you print, you can
    set the PRINTER environment variable to the name of the printer that you want
    to use. This is accomplished in different ways for each shell. For bash you can
    do this with


    ```

    $ PRINTER="printer_name"; export PRINTER

    ```


    and csh, you can do it with


    ```

    $ setenv PRINTER "printer_name"

    ```


    These commands can be placed in your login scripts (.profile for bash, or .cshrc
    for csh), or issued on the command-line. (See bash(1) and csh(1) for more information
    on environment variables.)


    # 5. Answers to Frequently Asked Questions


    Q1. How do I prevent the staircase effect?


    A1. The staircase effect is caused by the way some printers expect lines to be
    terminated. Some printers want lines that end with a carriage-return/line-feed
    sequence (DOS-style) instead of the line-feed sequence used for UNIX-type systems.
    The easiest way is to see if your printer can switch between the two styles somehow--either
    by flipping a DIP switch, or by sending an escape sequence at the start of each
    print job. To do the latter, you need to create a filter (see Q2).

    A quick fix is to use a filter on the command-line. An example of this might be


    ```

    $ cat thesis.txt | todos | lpr

    ```'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# 5. Answers to Frequently Asked Questions


    # Q2. What is a filter?


    A2. A filter is a program that reads from standard input (stdin), performs some
    action on this input, and writes to standard output (stdout). Filters are used
    for a lot of things, including text processing.


    +   - GhostScript

    - TeX

    - NetPBM

    - jpeg utilities

    - gzip


    # Q3. What is a magic filter?


    A3. A magic filter is a filter that performs an action based on a file''s type.
    For example, if the file is a plain, text file, it would simply print the file
    using the normal methods. If the file is a PostScript file, or any other format,
    it would print it using another method (ghostscript). Two examples of this is
    magic-filter and APSfilter. One caveat of these filters is that the appropriate
    programs have to be installed before you install the filter.


    # Q4. What about the Windows Printing System? Will Linux work with that?


    A4. Maybe. Printers that accept only the WPS commands will not work with Linux.
    Printers that accept WPS and other commands (such as the Canon BJC 610) they''re
    set to something other than WPS format. Other printers, such as some HP DeskJet
    820Cxi/Cse, *not* work with Linux. That said, Linux can act as a printer server
    (See Samba) for Win95 machines, since Win95 has drivers for those printers.


    The reason for this is that when the filter gets installed, it queries your system
    for specific programs (such as ghostscript - if it finds it, then it knows it
    can handle PostScript data), then builds itself based on what it finds. To handle
    all the printer files, you should probably have at least the following


    # Q5. What kinda cheesy is this! I can''t print more than 6 pages or I get a "file
    too large" error.


    A5. One of the options in the /etc/printcap file relates to the maximum size of
    a print file. The default is 1000 disk blocks


    Introduction to OpenLinux


    229'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Appendix B: Printing HOWTO


    (about 500k?). For PostScript files and the like, this will give you maybe 6-8
    pages with graphics and all. Be sure to add the following line in the printer
    definition:


    ```

    mc=0

    ```


    The primary reason for this is to keep the spool partition from getting filled.
    There is another way to do it, by making lpr create a soft link from the spool
    directory to your print file. But you have to remember to add the -s option to
    lpr every time.


    # 6. Troubleshooting


    This section covers some common things that can go wrong with your printing system.


    If your printer doesn''t work:


    +   - Do other print jobs work? (application problem?)

    - Is lpd running? (check it using lpc) (print controller)?)

    - Can root send something directly to the printer? (print services)?

    - Can you print from DOS? (cable/printer problem)?


    Answering these questions can help find a solution.


    Send other suggestions for this section to <markk@auratek.com>.


    # 7. References


    This is a section of references on the Linux printing system. I have tried to
    keep the references section of this HOWTO as focused as possible. If you feel
    that I have forgotten a significant reference work, please do not hesitate to
    contact me.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# 7. References


    Before you post your question to a USENET group, consider the following:


    +   - Is the printer accepting jobs? (Use lpc(8) to verify.)

    - Is the answer to your question covered in this HOWTO or Grant Taylor''s Printing
    HOWTO?


    +   - ghostview(1) view PostScript documents using Ghostscript

    - groff(1) front-end for the groff formatting system

    - gs(1) Ghostscript interpreter/viewer

    - lpc(8) line printer control program

    - lpd(8) line printer spooler daemon

    - lpq(1) spool queue examination program

    - lpr(1) off-line printer

    - lprm(1) remove jobs from the line printer spooling queue

    - pr(1) convert text files for printing

    - tex(1) text formatting and type-setting

    - USENET newsgroups

    - comp.os.linux.* a plethora of information on Linux

    - comp.unix.* discussions relating to the UNIX operating system


    If any of the above are true, you may want to think twice before you post your
    question. And, when you do finally post to a newsgroup, try to include pertinent
    information. Try not to just say something like, “I’m having trouble with lpr,
    please help.” These types of posts will most definitely ignored by many. Also
    try to include the kernel version that you''re running, how the error occurred,
    and, if any, the specific error message that the system returned. On-Line Manual
    Pages


    +   - cat(1) concatenate and print files

    - dvips(1) convert a TeX DVI file to PostScript'
  merge: -1
