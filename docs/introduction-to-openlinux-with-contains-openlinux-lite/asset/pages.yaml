    # Shutting Down Your Computer


    Because OpenLinux is a multi-tasking, multi-user operating system, you should
    never just turn the power switch off. You must tell OpenLinux that you are shutting
    down, so that anything that is still in process can be finished.


    You can leave your computer on day to day without concern. The screen goes black
    if left unattended for a few minutes. You can turn your monitor off to save power.


    When you do want to turn your computer off, follow this procedure.


    # Shutting Down OpenLinux


    +   1. Exit the Desktop by choosing Exit Desktop from the File menu.


    +   2. Exit the X Window System by holding down the left mouse button and selecting
    Exit Desktop | Quit Desktop.


    You return to the character-mode command line.


