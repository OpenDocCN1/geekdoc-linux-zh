    # Printing Files


    You can print files on the Desktop or from a directory window by selecting a file
    and choosing the File | Print command. If you try to print a file that is not
    printable, the Desktop displays a dialog telling you will not be printed.


    When the Desktop prints a file, it uses two commands: one to format the file and
    one to spool it to the printer. Files printed to NetWare Print Queues use a different
    system, however.


    You can specify the print formatter and spooler commands as part of your execution
    preferences. (See “Changing Execution Preferences” on page 130.) The formatter
    command processes the file for printing. For example, it might paginate the document
    or put in headers. The spooler receives the data produced by the formatter command
    and sends it to the printer.


    When you choose File | Print, the Desktop checks to see if the file is printable.
    If it is, the Desktop checks to see if a special formatting command is defined
    for that type of file. If there is, the Desktop uses it. If not, the Desktop uses
    the command from the user’s execution preferences.'
  merge: -1
