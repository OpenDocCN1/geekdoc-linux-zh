    # Graphical Display Technology


    The XFree86 programs included on the CD-ROM in this book support a wide variety
    of video cards and monitors (see the Appendix on page 179). The Window System
    (X) is the underlying graphical system used by Linux and the Caldera Desktop interface.
    X allows you to take full advantage of the capabilities of your video hardware,
    and to distribute graphical applications across networks.


    The program controlling the X interface (called an X server) can be configured
    as part of the installation process, or immediately after you start to use your
    system. Some Caldera products use the Metro-X server from Metro Link Incorporated
    as the default X server; the CD-ROM in this book uses the X servers from the XFree86
    Project, Inc.


    As described in the Appendix, if you need to make alterations to the default X
    configuration or use the XFree86 servers, you may need detailed information about
    your video hardware. This information can usually be found in your hardware documentation.


    The X Window System provides powerful capabilities not found on any graphical
    system. For example, any graphical application can be executed on one computer
    and displayed on a different computer. In addition, the configuration of X allows
    software to take full advantage of the features of your graphics hardware.'
