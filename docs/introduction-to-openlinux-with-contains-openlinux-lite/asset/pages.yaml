  md: 'Specifying a Double-Click Speed. The Desktop lets you choose how fast or slow
    you can double-click a mouse button to get a double-click action instead of two
    single-click actions. The Desktop matches the time it takes you to double-click
    an object. The following options are available:


    +   * Slow to allow a long amount of time between clicks

    * Medium to allow a medium (or average) amount of time between clicks

    * Fast to allow a very short amount of time between clicks


    Specifying a Directory Double-Click Action. By default, the Desktop opens a window
    for each directory you double-click. However, if you Ctrl+double-click a directory,
    the Desktop displays the contents of that directory in the current directory window
    (no new window is opened).


    In other words, the contents of the directory you double-click replace the contents
    of the directory displayed in that directory window.


    Using Operation Preferences, you can indicate which double-click action you prefer
    as your default. You can specify whether to double-click or to Ctrl+double-click
    to open a new directory window.


    Specifying an Icon Dragging Preference. For dragging operations, you can specify
    either of two behaviors: whether you want to display a full icon or only its outline
    during drag operations. Use the Icon Dragging radio buttons in Operation Preferences
    to specify


    +   * Full Icon, for the Desktop to display the full icon image during drag operations.

    * Outline Only, for the Desktop to display an outline of the icon during drag
    operations. Also, when you drag icons over drop receiver, only the cursor changes
    shape—the drop receiver icon does not change.


    On some systems, dragging an outline rather than the full icon can be a significant
    performance improvement, because the amount of redrawing done during a drag operation
    is greatly reduced.'
