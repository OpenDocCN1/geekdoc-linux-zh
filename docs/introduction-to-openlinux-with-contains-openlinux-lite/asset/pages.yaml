  md: 'The following summarizes the access permissions you can assign.


    TABLE 7. Directory and file access permissions

    | If you assign this permission | For a directory, specified users can | For a
    file, specified users can |

    |---|---|--|

    | R (read) | View its contents | View its contents |

    | W (write) | Put directories or files in it & remove directories or files from
    it | Change its contents |

    | X (execute) | Search the directory | Run it as a command |


