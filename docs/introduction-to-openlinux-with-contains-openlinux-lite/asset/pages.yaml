  md: '# Sorting Directories and Files


    You can sort directories and files in a directory window according to a specific
    category and in a particular order.


    When directories and files are displayed in Icon or Name view in a positionable
    directory window, you can sort by the following categories, in ascending or descending
    order:


    +   - Directory or file name

