    button. Its name appears in the first text box in the status area at the bottom
    of the Desktop window. (First, select View | View Status Area.) Click a button
    to execute the associated action.


    Generally; the buttons supplied with the Desktop provide shortcuts for operations
    that can also be performed using Desktop menu commands. However, you can add buttons
