  md: '# Quick-Start Install


    This chapter will get your new Caldera system up and running in about 30 minutes.
    To use the Quick-Start Install instructions, you should be familiar with common
    UNIX and Linux terms, and understand a little about computer hardware. If any
    of the concepts mentioned in this chapter or on-screen are unfamiliar to you,
    refer to the next chapter for more detailed descriptions.


    You may need one or two blank, formatted, 3 1/2 inch diskettes to complete the
    installation. If you are installing across a network, you also should have your
    network and IP information before proceeding (IP addresses for node, gateway,
    and DNS server; hostname and domain name). The form on the next page provides
    a place where you can collect the information you need to complete the installation.


    The Quick-Start installation creates a completely new system. If you have an existing
    Caldera or other Linux system, refer to Chapter 3 for directions on installing
    the OpenLinux Lite CD-ROM from this book while preserving important data from
    your existing system.'
