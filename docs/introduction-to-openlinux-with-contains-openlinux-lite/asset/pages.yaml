  md: '# # Basic Command Line Utilities


    Although the Desktop interface provides an ideal way to run programs, manage your
    filesystem, and browse network resources, you may still want to use the command
    line utilities to access parts of your system. Here we briefly describe several
    commands that are frequently used.


    Many of the more advanced concepts and tasks relating to your filesystem and system
    administration are usually completed from the Desktop, and are discussed in Chapter
    5. These include things such as setting file permissions, creating symbolic links,
    and adjusting display preferences for the Desktop.


    The commands below can be used from the character-mode command line, or from within
    a Terminal Emulator window on the Desktop. The commands are the same as those
    on any other UNIX operating system, and are similar to many commands that you
    may be familiar with DOS. Remember, however, that all commands are sensitive.


    Table 3. Basic Command Line Utilities

    | Command | Purpose |

    | --- | --- |

    | ls | List the contents of a directory (like the DOS command DIR) |

