  md: '# Creating Links


    A link lets you access a directory or file from more than one location in a file
    system or directory hierarchy.


    You use a different type of link depending on how you want to reference a directory
    or file. Symbolic links take up little disk space—much less than a copy of the
    directory or file. You can view or make changes to a file or directory through
    a link.


    You can create two types of links:


    +   - Hard

    - Symbolic


    A hard link is a reference to a physical file; a symbolic link is a reference
    to a directory or file name.


    You can only create Hard links for files, not for directories. The link can be
    in a different directory but it must be on the same file system. A file is not
    removed from your system until all its hard link names are removed.


    To find out how many hard links a file has


    Unlike a hard link, a symbolic link can be made across file systems and can reference
    directories and files. When you create a symbolic link, a file is created that
    contains the pathname of the actual directory or file. As with a hard link, you
    can view or make changes to a file through its symbolic links.


    Because a symbolic link only points to a directory or file name and is not an
    actual file system reference, when you remove the original directory or file you
    also make all its symbolic links invalid.'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'The link is still there, but because it points to nothing, the link causes

    errors if you try to use it. The symbolic link becomes available again if

    y put a file with the same name in the same location.


    There are two types of symbolic links:


    +   * Absolute


    +   * Relative


    An absolute symbolic link is a full pathname that leads to the original

    directory or file. Because it explicitly refers to each directory in the

    pathname, you create an absolute symbolic link if you keep the original

    directory or file in the same location in the directory structure.


    However, you can move the linked reference, because its location does

    determine the reference. If you remove, move, or change the name of

    the original directory or file, you cannot access that directory or file

    because the pathname is invalid.


    A relative symbolic link is a relative pathname that leads to the original

    directory or file. The location of the linked reference is used to determine

    the location of the original directory or file, so one cannot move relative

    to the other without making the link invalid.


    Relative symbolic links let you move the portion of the directory

    structure containing the original directory or file and the linked reference

    within the file system. (For more about the types of links supported by

    your system, see the online Linux system documentation.)


    # Creating a Link


    +   1. Select the files you want to create a link for.


    +   2. In the directory window, choose File | Link.'
