- img_proc: true
  md: '# Hardware

    Parameters


    The auto-detect feature of the Installation program should determine exactly what
    hardware you have and allow the installation of Caldera OpenLinux to proceed without
    problems.


    Occasionally, however, the auto-detection feature needs some "help" to correctly
    locate and use your hardware. If necessary, you provide this help by entering
    boot parameters when you start the installation process, or kernel parameters
    (called insmod parameters) when using the Kernel Module Manager during installation.


    Each parameter indicates a type of hardware (or other option) and one or more
    values that identify that hardware or option so that it can be correctly used.
    Boot parameters are entered at the boot manager prompt, before the OpenLinux installation
    actually starts. The insmod parameters are entered during installation, when prompted
    from the Kernel Module Manager menus.


    For example, at the LILO boot manager prompt, you might normally enter linux (or
    press Enter if linux is the default).


    ```

    LILO: linux

    ```'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'If you determine during installation that boot parameters are needed,

    y might enter else something like this instead:


    ```

    LILO: linux cdu31=0x340,13 eth0=11,0x260,0,0,eth0

    ```


    This example indicates the addressing information for a Sony CD-ROM

    drive and an ethernet card. The equal sign (=) separates the parameter

    from the value you provide. Spaces separate multiple parameters.


    You can also use boot parameters to turn off the auto-detection feature if

    needed. For example, if the auto-detection feature checks for some types

    of CD-ROM drives, it may interfere with the configuration of some

    network cards as a side effect. You can overcome this by providing

    information about your CD-ROM drive and turning off the auto-

    detection, maintaining your network card configuration.


    Below are some recommended boot and insmod parameters to help you

    access and configure hardware that may not respond well the auto-

    detection. To use parameters, you may need to know information such as

    the IRQ interrupt and memory address used by your hardware. Consult

    dos already configured on your computer, you may be able to discover

    some relevant hardware information by reviewing the CONFIG.SYS file

    in DOS.


    Items enclosed in square brackets in the syntax diagrams are optional when

    y enter your parameters. Items in the syntax descriptions that are in ital-

    ics are variables for which you must supply a value.


    A device generally has only one boot parameter, which may have several

    value pairs. A kernel module can have several different parameters that all

    apply to the same device.


    After entering one of these parameters at the boot manager prompt,

    watch the kernel messages to see if the device was recognized correctly.

    Messages will generally either have "failed" or a display of the device with

    the correct port, IRQ, etc.'
  merge: -1
