  md: '# Adding and Removing New Software

    Packages


    The concept of a software package makes it simple to manage your

    OpenLinux system. Every software component that is installed on your

    system is part of a package. OpenLinux includes package management

    tools to quickly and easily install a new piece of software from the

    Caldera CD-ROM.


    The table beginning on page 190 contains a complete list and brief

    descriptions of the software packages available on the Caldera CD-

    ROM.


    Software packages on the Caldera CD-ROM are stored in a format called

    rpm. Each rpm file (having a file extension .rpm) contains the files that

    comprise the software, plus additional information about where to install

    each file, how much disk space the software requires, and how to run any

    initialization files that the software provides.


    You must be logged in as root to manage software packages. After

    logging in using your regular username and password, use the su

    command and the root password to gain superuser access before using

    t rpm utility.


    System administrators may wish to use the glint utility to manage

    software packages. The glint utility is a graphical package management

    tool that is located in the Admin Tools group on your Desktop.


    If you prefer to use command line utilities, the rpm command can be

    used. Once you know the location of a package, you can install it with a

    single command. Packages on the Caldera CD-ROM are located in the/

    packages directory. For example, to install the XFree86 video driver for

    GA, the command might be as follows (depending on where your

    CD-ROM is mounted):


    ```

    rpm -i /mnt/cdrom/col/packages/XFree86-SVGA-

    3.2.rpm

    ```'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'The -i option indicates to install the named package.


    If you discover you have installed a package that you don''t need any longer,
    you might first query to make certain it is installed and see how large it is
    is:


    ```

    rpm -qi ispell

    ```


    The -qi option indicates that this is a query, and that you want basic package
    information for the ispell spell checking package. No path is used, because you
    are referring to a package that is already installed. The rpm utility knows where
    to find it.


    If you decide to remove this package from your system, based on the information
    in the query response, you can do so with a single command, using the -u option
    to uninstall the package.


    ```

    rpm -e ispell

    ```


    You can see a complete list of options and learn more about the rpm command by
    entering one of these commands:


    ```

    rpm --help

    ```


    ```

    man rpm

    ```


    # Working With Users and Groups


    Because OpenLinux is a multiuser, multitasking environment, a single computer
    running OpenLinux may have many users connected at the same time, via various
    network connections.


    The procedures in this section will guide you in some basic user and group account
    management tasks. These tasks are completed using the graphical User and Groups
    Configuration tool, usrcfg. If you log in as root before starting the Desktop,
    these tools appear on the Desktop, ready for you to use. You cannot complete the
    tasks in this section unless you are logged in as root, because no other user
    has access permission to change the user and group information files (/etc/passwd
    and /etc/group).


