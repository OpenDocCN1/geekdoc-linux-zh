  md: '# Using OpenLinux Around the World


    Caldera OpenLinux products are available with documentation and computer interfaces
    translated into several languages.


    There are also several places where options allow you to effectively use OpenLinux
    in other languages. These options are described below.


    At the beginning of the Installation, you select a language for the Installation.
    You also select a keyboard layout appropriate to your computer. The keyboard you
    select is used during the rest of the installation and when you start to use your
    system after installation. you also choose a time zone.


    # The Root User


    The root is a special super-user account. As on other UNIX-like systems, the root
    user has access to all files and devices. This access is required to do many configuration
    tasks, but can be dangerous for day-to-day work because the root user can access
    (and change) anything on the system.


    After completing the installation process, you can log in as root to complete
    system administration tasks. Do not log in as root for your day-to-day work.


    If you log in as root and start the Desktop, a set of administrative tool icons
    appears on the Desktop. If you log in as your regular user account, you can also
    use administrative tools by changing to root access temporarily with the su command
    and entering the root password. Type exit to return to your normal user status.


    # Setting Up User Accounts


    OpenLinux is a multi-user system. Whenever it is started, you must log in using
    a valid username and password. The root superuser and one other user account are
    created during installation; you must create other user accounts. This multi-user
    system allows many users to access the system at'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Chapter 2: What Is OpenLinux?


    the same time. Even if you are the only person who will use the computer, you
    still use a user account for yourself that is separate from the root account.


    You can add new users anytime using the configuration utilities described in Chapter
    4.


    # Using SLIP and PPP


    The Serial Line Internet Protocol (SLIP) and the Point to Point Protocol (PPP)
    are protocols that make your computer a full peer on a network via a serial connection,
    such as a modem operating over a voice telephone line.


    Any computer that can use a modem can access a remote computer as a terminal,
    sending keystrokes and receiving characters to display. This does not make a machine
    a “peer” on a network, however, because all interaction takes place at the remote
    computer. This is known as *terminal emulation.*


    By using SLIP or PPP, your computer is seen as a separate computer on the Internet
    or other network. Instead of all program execution taking place at the remote
    site that you are logged in to, your computer can execute programs that access
    the network directly. This means that multiple programs can be connected to the
    Internet, for example, and graphical Web browsers can be used on your computer
    over your modem connection.


    PPP is generally preferred over SLIP because it is more robust and allows multiple
    protocols to be used (not just IP). We therefore discuss only the specifics of
    PPP here, though many of the same principles apply to a SLIP connection.


    To connect to a remote network (including the Internet) using PPP, the site that
    you connect to (your ISP, for example) must allow you to connect using PPP. This
    connection is different than the specialized connection protocol used by companies
    like America Online or CompuServe.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Concepts To Understand


    Base includes all necessary software, both to connect to a remote computer using
    PPP or SLIP, and to allow other computers to connect to your Caldera system using
    PPP or SLIP.


    The basic steps to establish a PPP connection are:


    +   1. Install a modem and determine that you can access it via the serial port
    devices (for example, as /dev/cua0 or /dev/ttyS0).

    2. Call a remote computer or service provider that allows PPP access.

    3. Run the PPP script to initiate PPP communications with the remote computer.

    4. Wait a moment for the remote computer to initialize the connection.

    5. Begin using your Caldera system as if you were connected to the remote computer
    or network via a standard network connection (such as Ethernet). For example,
    start using the Netscape Navigator.


    You Internet Service Provider can probably provide you with a sample script to
    connect to them using PPP. See the appendices for more information about PPP.


    Your Caldera system can also be used as a terminal server, allowing other users
    to call in and connect to your computer via PPP.


    # Using OpenLinux on a Laptop


    OpenLinux can easily be installed on many brands of laptop computers. PCMCIA hardware
    and some of the unusual video hardware included on laptops are detected as part
    of the standard installation process.


    As a general rule, laptops are more difficult to install than desktop machines
    because of the unusual hardware they include. A smaller percentage of peripheral
    devices is supported on laptops, and some brands may not be supported at all.
    Nevertheless, many popular brands (such as IBM, Toshiba, Micron, and AST) run
    OpenLinux very well,'
