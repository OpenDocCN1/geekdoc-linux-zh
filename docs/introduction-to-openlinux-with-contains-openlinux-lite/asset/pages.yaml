    # Changing Desktop Preferences


    The Desktop preferences let you specify how you want the Desktop to do certain
    things. There are several preference categories:


    +   * Execution. Use to specify which program to use to display terminal-emulator
    windows, which text and data editors to use, which external shell to use, how
    to format and spool a file to be printed, and which path-name to receive mail.

    * Operation. Use to control the limit for file size, double-click speed, the action
    the Desktop performs when you double-click a directory, icon dragging behavior,
    which mouse behavior to use, and the seconds between display updates.

    * Creation. Use to define a creation mask that specifies default access permissions
    for new directories and files.

