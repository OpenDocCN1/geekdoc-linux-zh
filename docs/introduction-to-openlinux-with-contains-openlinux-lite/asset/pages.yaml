  md: '# Appendix B: Usage HOWTO


    # lprm


    Another useful feature of any printing system is the ability to cancel a job that
    has been previously queued. To do this, use lprm.


    ```

    $ lprm -

    ```


    The above command cancels all of the print jobs that are owned by the user who
    issued the command. A single print job can be canceled by first getting the job
    number as reported by lpq and then giving that number to lprm. For example,


    ```

    $ lprm 31

    ```


    would cancel job 31 (thesis.txt) on the default printer.


    # 2.5. Controlling the lpd program with lpc


    The lpc(8) program is used to control the printers lpd serves, you can enable
    or disable a printer or its queues, rearrange entries within a queue, and get
    a status report on the printers and their queues. Lpc is mostly used in a setup
    where there are multiple printers hanging off one machine.


    ```

    $ lpc

    ```


    The above will start the lpc program. By default, this enters you into an interactive
    mode, and you can begin issuing commands. The other option is to issue an lpc
    command on the command line.


    ```

    $ lpc status all

    ```


    A list of the available commands are in the lpd man page, but here are a few of
    the major commands you''ll want to know about. Any commands marked with option
    can either be a printer name (lp, print, etc) or the keyword all, which means
    all printers.


    +   - disable option - prevents any new printer job from being entered

    - down option - disables all printing on the printer

    - enable option - allow new jobs to enter the print queue

    - quit (or exit) - leave lpc

    - restart option - restarts lpd for that printer


    # 224


    # Introduction to OpenLinux'
