    To prepare the hard disk of your DOS or Windows system, you will:


    +   - Defragment your filesystem.

    This moves all the data on your DOS system to one area of your hard disk. (Data
    normally spreads all over the hard disk as you use your computer).


    +   - A DEFRAG.EXE or OPTIMIZE.EXE program is included as part of most versions
    of DOS or Windows. If you do not have a Defrag program, or something similar (such
    as utilities included with PC Tools or Norton Utilities), you cannot use this
    procedure.


    +   - Shrink your filesystem partition with the FIPS utility.

    The FIPS utility cuts off part of the partition used by DOS or Windows that have
    “unallocated” free space. Without damaging the existing data on the hard disk.
    You then use the free space created by FIPS to create a Linux partition and Swap
    partition.


    +   - The FIPS program is included on the Caldera CD-ROM. Always back up critical
    data before using the FIPS utility.


    +   - Create the Linux partitions using the fdisk utility during the Installation.'
