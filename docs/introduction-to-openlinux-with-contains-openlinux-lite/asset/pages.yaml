    # File Typing on the Desktop


    This section describes how file typing works and the general capabilities of the
    file typing language. File typing is done automatically when you use the Desktop.
    Adding to the file typing capabilities is a task for advanced users; only an overview
    of the features of file typing is included here. More detailed information on
    file typing, and a complete reference of available file typing commands and examples
    are available in the online Desktop User Guide.


    # How File Typing Works


    The Desktop''s file typing mechanism consists of three basic components:


    +   - A file typing language (FTL), used to define the rules by which file types
    are identified

    - A file typing compiler (FTC), which compiles file typing rules written using
    the FTL

    - A file system server (FSS), which manages file system information and allows
    high-speed access to directories


    File type definitions are written in text files using the FTL. They include statements
    that describe files (such as a particular format for a file name), a string of
    characters that must be in a specific location in the file, or a location in the
    file system in which the directory or file must be be.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'In addition to the rules used to determine file types, file type definitions
    specify the icon to display for each directory or file and actions associated
    with that type of file.


    These definitions are compiled by the FTC to create a binary file named LG.rulebase,
    LG.rulebase is stored in the Desktop data directory (specified at installation)
    and is read into memory at start-up.


    When the Desktop displays the contents of a directory, the FSS looks for an .lgdb
    file. If this file is not found, the file type information for every file in the
    directory is computed. If the user has write permission for the directory, an
    .lgdb file is created for the next time the Desktop opens the directory.


    If an .lgdb file is present, the FSS compares the contents of the directory to
    determine whether directories or files were added to the directory since the last
    time the .lgdb file was modified.


    If so, newly added items are typed according to the current rulebase. If the current
    user has write permission for the .lgdb file (the normal situation), it is updated.


    # Adding New File Typing Rules


    Though a complete description of available commands and features is not provided
    in this chapter, you can try adding simple file types by imitating existing file
    types. Use the procedure below, referring to more in-depth online instructions
    as needed.


    +   Review the system rulebase files for something similar to what you want to
    add to the rulebase.


    +   Rulebase files are stored in the directory /usr/visix/lg/default/lg_ftc. Rules
    for programs are in prog.ftc; rules for other files are in data.ftc. You should
    store your new rules in the corresponding files, prog.loc.ftc and data.loc.ftc.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '+   2. Copy a rule that is similar to what you need from the appropriate rulebase
    file (prog.ftc or data.ftc) to the appropriate rulebase file (prog.loc.ftc or
    data.loc.ftc).


    +   3. Modify the new rule to fit your needs.


    +   4. Save and exit the rulebase file.


    +   5. Compile and install the new rulebase files by entering these two commands
    while you are still in the lg_ftc directory:


    ```

    make

    make install

    ```


    +   6. Exit the Desktop and restart it to have your new rules take effect.'
  merge: -1
  pgno: 165
