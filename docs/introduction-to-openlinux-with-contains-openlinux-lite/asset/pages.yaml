  md: 'Located in the upper right corner of the window, the minimize button reduces
    the window to a small icon at the right edge of your screen (the icon may not
    appear immediately). The application running in that window continues to run,
    but the window is not visible. You can restore the window to its previous size
    by clicking on the icon for the window.


    The maximize button causes the window to resize to fill your screen. Once the
    window has been maximized, choosing the maximize button again will restore the
    window to its previous size.


    Right-clicking on the maximize button of a window that is not maximized expands
    the window vertically while keeping the same width.


    +   - The Control Menu

    In the upper left corner of each window is a button which, when selected, displays
    a control menu for that window. The control menu allows you to resize the window,
    minimize it, maximize it, or close it.


    # The Desktop


    The Desktop interface is an X application which is installed as part of the default
    system comes with OpenLinux. It can provide a full screen interface to your system
    and your other applications.


    The Desktop area provides a space where you can place applications, commonly accessed
    files, or other utilities. Once these are on the Desktop, you can choose them
    at any time.


    Online help for the Desktop interface is available by choosing an item from the
    Help menu or by choosing a Help button in a Desktop dialog. (See the Release Notes
    for more information about using the Help system).


