    * Create new icons

    * Edit existing icons


    Some characteristics are represented in more than one icon design that comes with
    the Desktop. Icons with the same design make up an icon family.


    Icons with one fold in the upper right corner represent data files that can be
    opened by more than one application. An example of this type of file is a file
    that contains only text.


    This type of file can be edited by more than one editor or word processor. Icons
    in this family often contain another visual cue that'
