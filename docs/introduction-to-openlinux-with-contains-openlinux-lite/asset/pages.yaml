  md: 'You can have the Desktop determine the position of terminal emulator windows
    on the workspace by selecting the Desktop Assigns Position checkbox (below the
    Terminal Program field). If the checkbox is not selected, the window manager determines
    the position.


    You can specify a terminal program in Execution Preferences and include arguments
    you would use if you were invoking the program from a shell command prompt.


    **Specifying Text and Data Editors.** The Execution Preferences Text Editor and
    Data Editor fields display the pathnames and arguments for the programs you want
    the Desktop to execute when you activate a text or data file.


    To change a text or data editor, you must know the syntax to invoke the program.
    If you enter just the pathname of the editor, the Desktop assumes it takes a file
    name as its only argument. For example, if in the Text Editor field you enter


    ```

    /usr/bin/emacs #f

    ```


    the Desktop executes the command:


    ```

    /usr/bin/emacs filename

    ```


    when you activate (open or double-click) a text file (filename is the name of
    the file you selected).


    To read edit messages from your editor or other program before its window disappears,
    put the lg_pause command after the command that calls the editor. The lg_pause
    command prompts you to press Enter before exiting the terminal emulator window.


    When you use lg_pause, specify the position of the file name in the command line
    using the Desktop special symbol for selected files (#f). For example, to use
    the editor vi, select Run In New Terminal Emulator Window and enter the following
    in the Text Editor field:


    ```

    /usr/bin/vi #f; lg_pause

    ```'
  merge: -1
