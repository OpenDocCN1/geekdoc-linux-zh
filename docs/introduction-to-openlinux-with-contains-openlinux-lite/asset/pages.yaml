    # Interacting with the Desktop


    To use the Desktop, you must already know how to perform a basic set of actions,
    including


    +   - Selecting items on the desktop and in menus by clicking on them with a mouse
    or other pointing device

    - Selecting buttons and checkboxes by clicking on them

    - Dragging and dropping


    Most Desktop actions are designed for mouse-based operation, but all Desktop features
    are also accessible from the keyboard.


    # Using a Mouse


    The following table describes how to use a two-button mouse.


    | Action | Button |

    |---|---|

    | Select and drag items; open a menu | left |

    | Switch between selections | Ctrl+left |

    | Extend selection | Shift+left |

    | Drag selection | both |

    | Drag selection to copy | Ctrl+both |

    | Drag selection to move | Shift+both |

    | Display a pop-up menu of available actions for an item | right |'
