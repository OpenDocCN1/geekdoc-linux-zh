  md: '# # Everything You Need to Get Started with OpenLinux!


    Nobody knows Linux like Caldera. OpenLinux is Calder''s professional edition of
    Linux. This book is the guide to using and running OpenLinux. Just follow the
    menus and the instructions in this book and you''re up and running in about 30
    minutes.


    **Included in these pages are:**


    +   - Step by step installation and configuration guides.

    - Easy to follow instructions for setting up and maintaining networks and Internet
    connections.

    - Guide to setting up printing.


    ![](img/361ba1f1a2f214d776526662a65e3151_275_0.png)


    Besides a complete edition of Caldera OpenLinux and hundreds of freeware packages,
    this **CD-ROM** includes:


    +   - A complete edition of CRISLite editor.

    - Apache webserver

    - An evaluation of the Looking Glass desktop.


    > "A powerful, stable, friendly and fast Linux distribution. The bottom line:
    excellent."\-Nicholas Petreley, InfoWorld, 3/97


    Linux is a product of freelance Internet developers worldwide. One reason it''s
    superior. But it also means there''s been no company you could turn to-until Caldera.


    Caldera is an industry leader committed to advancing Linux and helping you get
    the most out of it. Our working relationships with Novell, Sun, Netscape and other
    leading-edge companies ensure you''re enjoying the best technology available.
    And you can count on us being there to implement Linux innovations as-they''re
    introduced.


    ![](img/361ba1f1a2f214d776526662a65e3151_275_1.png)


    SYSTEM REQUIREMENTS: Intel 80386, 80486, or DX (80486) or Pentium; approximately
    33MHz hard disk space (default installation: 40MB, recommended: 60MB, all packages
    120MB); memory (8MB RAM minimum, shared between Caldera and other applications;
    16MB RAM recommended); 3.2 inch hard drive for installations.


    Windows NT system requires at least an 80386 processor, 4MB RAM, and 20MB hard
    disk space. See the Gateway to Windows NT or visit www.caldera.com for more details.


    Supports a variety of network cards, SCSI devices, routers, printers, and terminals.


    Contact Caldera or your reseller for further information.


    SHELLING: Operating Systems, Internet, Unix

    $25.95 US / $41.95 CAD


    Visit us on the Web: http://www.caldera.com/'
  merge: -1
