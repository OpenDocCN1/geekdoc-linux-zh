  md: '# APPENDIX B Software Packages

    Index


    The Caldera OpenLinux Lite CD-ROM included with this book contains nearly 700
    MB of compressed software. The software is divided into packages based on its
    function. For example, one software package contains the Desktop interface and
    related components, another package contains the Apache World Wide Web server,
    and another contains the CRISPlite editor.


    You determined what packages are on your system by the Installation option you
    selected while installing OpenLinux.You can install additional packages from the
    CD-ROM or from another location, such as a hard disk archive of the CD-ROM, or
    the Caldera FTP site. Each software package can be installed or uninstalled with
    a single command. For instructions on installing and removing packages, see page
    64. All package names are case sensitive.


