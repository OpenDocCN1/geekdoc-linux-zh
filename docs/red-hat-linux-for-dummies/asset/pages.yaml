  md: '# Chapter 20


    # # Ten Problem Areas and Solutions


    **In This Chapter


    +   - I can''t boot Linux anymore

    - My disk numbers have changed since installation

    - My CD-ROM isn''t detected

    - I don''t know how to remove LILO and restore the MBR

    - I can''t use LILO to boot

    - The ls command doesn''t show files in color

    - Linux can''t find a shell script (or a program)

    - When I start X Window System, I see a gray screen

    - I don''t know how to make Window System start at boot time

    - I never seem to have the correct time


    In any complex, technical situation, people end up having problems and issues
    that they need help with. The problems in this chapter were taken from a database
    of questions and answers created after hundreds of people installed the CD-ROM.
    Some of questions have been answered in the rest of the book, but because they
    still generate “what happened” questions, I repeat the information here.


    # ## I Can''t Boot Linux Anymore


    **Problem:** You''ve installed Linux and everything is fine (naturally). Then
    one day you make a change to your Windows or Windows NT system, and Linux stops
    working. You no longer specify that you want to boot Linux.


    **Solution:** Various operating systems tend to think that they are the only operating
    system on the disk or the system. Therefore, when they are installed or updated,
    they write things to an area of the system called the Master Boot Record (MBR).
    This process overlays the Linux boot loader (called LILO) and stops you from booting
    Linux. The best correction requires an ounce of'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# 292 Part VI: The Part of Tens


    prevention: Make an emergency boot floppy disk, as I instruct you to do during
    installation. Keep this disk handy when you update your system (or during any
    other significant system event, such as repartitioning disks or rebuilding your
    kernel). Then, if you make a mistake, you can boot the floppy, which will enable
    you to reboot your Linux operating system. When you''ve rebooted your system using
    the floppy, just log in as root and type lilo on the command line. This repairs
    the MBR by reinstalling LILO.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_319_0.png)


    If you are installing multiple operating systems on a new machine, do yourself
    a favor and install Linux last. Otherwise, you have to keep reinstalling LILO.


    # My Disk Numbers Have Changed Since Installation


    Problem: Linux numbers disks each time it boots, calling SCSI disks names like
    sda, sdb, and sdc. Suppose that sda holds your Microsoft system, sdb holds the
    bulk of Linux, sdc holds your user files, and sdd holds your swap space. Now you
    add another disk and your user files are on sdd and your swap space is on sde.
    The new disk is called sdc but has nothing on it. What happened?


    Solution: SCSI disks are lettered according to the SCSI IDs set on each disk.
    Linux names the disks using this ordering scheme. If you insert a new disk into
    the SCSI bus with a SCSI ID that is lower than an existing disk, you rename all
    disks with a SCSI ID above the one you just installed. It''s best to start installing
    your SCSI disks with a SCSI ID of 0, 1, 2, and so on; then put other SCSI devices
    at the end of the SCSI bus (SCSI IDs 6, 5, 4, and so on). Note that most SCSI
    controllers are set to SCSI ID 7 by default.


    IDE disks are numbered according to the IDE controller they are on and whether
    they are a master or a slave on that controller. Therefore, adding a new disk
    to a set of IDE controllers will not change the existing names, as shown here:


    | Controller | Disk | Linux Name |

    | --- | --- | --- |

    | ide0 | master | hda |

    | ide0 | slave | hdb |

    | ide1 | master | hdc |

    | ide1 | slave | hdd |

    | ide2 | master | hde |

    | ide2 | slave | hdf |'
  merge: -1
  pgno: 319
- img_proc: true
  md: '| Controller | Disk | Linux Name |

    | --- | --- | --- |

    | ide3 | master | hdg |

    | ide3 | slave | hdh |

    | ide0 = primary controller | | |

