    This list includes lots of environmental variables, but we don''t have the space
    to describe them all. So, here are the most important ones:


    +   - PATH tells the shell all the places to look for commands

    - HOME tells where to go when you don''t supply any arguments

    - OSTYPE tells the shell and programs what operating system they''re on


    Different shells have different ways to set these variables (and create and others)
    to tell the commands what to do.


    Note that a variable not being set to some value (null) is different from a variable
    that doesn''t exist (unset), and these differences vary from command to command.
    For example, in the preceding listing, the first variable, USER, is set to NULL.
    The fact that it''s there is all significant. The fact that it is to NULL instead
    of some other value is also significant to various programs.


    # Diagnostics


    Error messages or exit codes indicate that something has gone wrong in the program
    or shell. Normally, UNIX error messages are terse. Sometimes things may seem to
    be wrong when they really are okay. For example, most UNIX users think that when
    they issue ls in an empty directory, they should get an error message such as
    directory empty or file not found. The problem? The command ls itself can display
    the filenames in any order (as opposed to *, which displays the files in alphabetical
    order). Therefore, if you have a directory with three files in it named file,
    and found — which happens to print in order — you can''t determine whether the
    directory is empty or not. Given, this is a example, the developers of UNIX thought
    that less was better than more (we''re not talking about command names less) and
    that silence is golden (which means something if you''ve ever heard those old,
    noisy, hot-card terminals).'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'Most programs display an exit code, which you normally don''t see unless it''s
    a non-zero code, which means the program ended unsuccessfully. If you''re a programmer,
    you can test for this, and if you do programming or shell script writing, we encourage
    you to set and test exit codes.


    # Bugs/deficiencies


    Yes, all programs have bugs, and most Linux people are good about correcting them.
    But some bugs are so arcane that they affect only one in a million people, and
    to try and correct them would mean redesigning the entire program. Therefore,
    this type of bug is regarded as a deficiency or a limitation and is listed in
    the man page.


    # Compatibility issues


    When a new version of a command or a program comes out, it may work slightly differently
    than the old command or program. This modification can cause a compatibility issue
    with shell scripts that have been written to use the old command or program. If
    the author of the command or program thinks a problem may occur, it should be
    documented here.


    # Caveats


    Caveats are warnings that the programmer wants to give to the user of the command
    or program. Caveats may include things to think about before executing the command
    or program, security issues, or how much file system space the program uses on
    large applications.


    # Disclaimers


    Disclaimers are usually legal statements included at the insistence of the author''s
    employer or the employer''s lawyers, telling you that if you use this program
    and it harms someone, don''t come back to them. All programs in all operating
    systems have disclaimers somewhere.


    # Authors


    The authors are simply the people who wrote the command or program that the manual
    page is describing. Often, this section also explains how to report bugs or discuss
    new features you may want to see.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Acknowledgments


    The acknowledgments section, which is much more pleasant than the disclaimers
    section, recognizes the previous work put into a program that the author has built
    on. Allowing and encouraging people to build on the work of others is the essence
    of Linux and the GNU Public License.


    # Debugging options


    Some programs, such as sendmail, have the capability to diagnose problems. If
    the manual page has a debugging options section, you can find information on setting
    and using these options to debug the program.


    # Configuration files


    With options and environmental variables, another way to determine what the manual
    page is describing through configuration files, sometimes known as startup files.
    These files may be in your home directory, a systemwide directory, or a sitwide
    directory. Often, Linux looks for them in a certain order. Sitewide files have
    the strongest influence, systemwide files and local user (your startup) files
    have the second and third strongest influence, respectively. The systems administrator
    can use these files to set policies across companies and systems, while allowing
    you to tailor the program to your needs.


    Two examples of startup files are the .bashrc file, which is probably in your
    home directory, and the /etc/bashrc file in the /etc directory. Note that the
    file in your home directory starts with a period. This type of file is called
    a hidden, or dot, file. You don''t normally see hidden files when you list your
    directory, unless you issue the `ls -a` or `ls .*` command.


    # Copyrights


    Many people mistakenly believe that Linux code or other freeware code is not copyrighted.
    The authors of the code often take great care to copyright their code because
    they want to receive credit for their work.


    # Copying permissions/distribution policy


    The copyright holder gives away most Linux code through the GNU Public License,
    or what is commonly called copyleft. The copyleft stipulates that those holding
    a copy of the code can use it for whatever purpose they want,'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 332 Part VII: Appendixes


    as long as they make the code freely available to anyone who wants it. If they
    change the code, they must make the changed code (including the source code) freely
    available to those who want it.


    Sometimes, other copying and distribution policies are associated with the command
    or program that manual page is describing. These policies can include the following
    types of permissions, where you may:


    +   - Use but not redistribute the code

    - Use the code, but no source code is available

    - Use and distribute the code as shareware, by paying a fee for continued use

    - Have limited use, such as educational or personal (but not commercial) use

    - Use the code on one machine only


    If you bought the operating system, or a layered product distribution (a distribution
    that includes both the operating system and a commercial application), or both
    from a CD-ROM vendor, then the overall distribution policy on the CD-ROM is usually
    the strictest (that is, you are limited to installing it on one machine because
    of its licensed software), so you don''t have to worry as long as you follow your
    overall licensing.


    # POSIX compatibility/standards

    conformance


    In the dark days of computer science, each vendor went off to develop its own
    operating system, with its own set of commands and programming interfaces. This
    way of thinking created a Tower of Babel (not to be confused with the Tower of
    Hanol, which is a puzzle game) among computer users and programmers. When UNIX
    systems first appeared, they were portable across different types of hardware,
    and you could have the same operating system, commands, and programming interfaces
    whether you were programming a Digital Equipment Corporation system, a Sun Microsystems
    computer, an IBM computer, or others. Unfortunately, this approach lasted ten
    minutes in the scope of UNIX''s life, because UNIX escaped from Bell Labs, it
    went to the University of California, Berkeley, and pool. Two different UNIX systems
    were now in existence!


    A little later'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Appendix C: The Linux man Pages


    In 1988, the IEEE developed the POSIX standard for operating systems. The IEEE
    is a great organization, and probably the best thing that it did to build on UNIX
    rather than start over scratch. It took the interfaces from the existing System
    V and Berkeley versions of UNIX.


    If an operating system is POSIX-compatible and a program is written to POSIX standards,
    the program should run on the operating system with no problems, and users should
    be able to use that operating system with little or no retraining from the last
    POSIX operating system they learned.


    Although much work still has to be accomplished in defining what POSIX is and
    in vendors implementing POSIX, POSIX compliance and certification are worthy goals.


    Other standards should be implemented and met by manufacturers, distribution makers,
    and developers (not necessarily in that order) — standards for network communication,
    for the day wat is put on the CD-ROM, and so on. Both formal standards and informal
    de facto standards, both of which help your system work better with the next system.


    Linux was built with POSIX compatibility as a goal, and it follows many of the
    other standards. This makes it easy to port code from one set of POSIX-compatible
    operating system to another. It also allows Linux to interoperate with other operating
    systems. Many Linux people are active in standards bodies, and the movement toward
    standards is generally supported in the Linux community.


    # Files


    In addition to the startup or configuration files mentioned previously, sometimes
    the command or program that the manual page is describing uses other files in
    the system and temporary files for holding intermediate work. Such files are listed
    in this section of the man page. If a command does not work, perhaps one of these
    files is missing, has the wrong file permissions (or the directories they are
    in have the wrong file permissions), is owned by the wrong person, or has corrupt
    data.


    # Future work


    The future work section lists the author’s plans for the command or program that
    the manual page is describing, often in an an attempt to generate interest and
    help from other people.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# 334 Part VII: Appendixices


    # Other places to look for help


    You can find help in several other places on the system. One place is the /usr/doc
    directory.


    Note: Some system administrators conserve disk space by not loading /usr/doc on
    their systems. With the abundance of inexpensive disks, this is usually penny
    wise, pound foolish. Documentation as that found in /usr/doc


    can be put on one system and then made available to everyone through the magic
    of the Network File System (NFS). Tell your system administrator to do that. If
    you are your system administrator, go into a closet and give yourself a lecture!


    ![](img/61222a84312a7aaf1d7bb493d840cde4_361_0.png)


    # See also/related software


    The see also/related software section lists programs associated with the command
    or program that the manual page is describing. Often, several programs make up
    a system of programs to do a particular task. Some programs have similar capabilities
    but are not the same. Some programs are the antithesis of the program you''re
    looking at (for example, cut and paste). The see also gives you an overall picture
    of what the program is supposed to do or leads you to the right program for the
    job.


    # Finding the Right man Page


    If you don''t know what command you''re looking for, use the apropos command followed
    by the word you''re interested in. The apropos command searches all the man pages
    looking for that word, and lists the man command names along one-line descriptions
    of all the commands that contain that word. You should probably pipe the output
    of the apropos command into the more command:


    ```

    [maddog@doghouse maddog]$ apropos print | more

    ```


    Note that apropos matches on partial words (called strings), which is why we suggested
    print instead of printer. The shorter the keyword, the more matches the command
    finds.


    Second, after you have the pages you want to look at, execute the man command
    for each one. From the one-line description, you can probably decide which commands
    fit your needs.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Appendix C: The linux man Pages 335


    Third, look at the description field, which gives you a better idea of what the
    command can do. If you''re still not sure about the command''s basic functionality,
    look at the see also section, to see whether other commands fit the bill.


    After that, skip the synopsis section — it''s usually a reminder of how to type
    the command — and go directly to the options section. Read through the options
    section, trying to apply the options to the basic description of the command.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_362_0.png)


    After you''ve read several man pages, you''ll notice that the same options appear
    for similar commands.


    This is all pretty much passive work. To find out what a command really does,
    you should try it out. Create a small test file by using an editor, or use an
    existing file, such as the /etc/passwd file, as input. (It''s better not to practice
    while logged in as root as you could accidentally damage a file or directory.)


    From time to time, we read all the man pages in the system, concentrating on the
    command descriptions. We do this to become familiar with new commands. Also, our
    memories are not what they used to be. But to be fair to our failing memories,
    the system does have close to 1,200 general-user commands and about 260 system
    administration commands.'
  merge: -1
