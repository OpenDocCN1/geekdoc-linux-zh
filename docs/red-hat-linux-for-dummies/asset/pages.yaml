    # IDG''s Linux World


    Linux World is a new show with conferences sponsored by IDG. Its Web site is www.linuxexpo.com.


    # Try to Help Others


    After you''ve exhausted all avenues of help (or maybe even before), you should
    just try to figure it out yourself. Often, you''ll find that the pieces fit together
    or that the software is not as difficult as you thought. Here are some tips:


    +   - If you''re investigating a large software package, scan the documentation
    one time and then concentrate on the new topics. Jon remembers the first time
    he tried to learn golf(1), a powerful text-processing system. The documentation
    was daunting, and he thought he would never learn the package. It turns out he
    was right; he learned it. But if he learned enough to do a few simple things and
    that all he needed to. With those "simple things" (less than 2 percent of the
    power of the package), he could write letters, create-ead slides, and do the necessary
    text processing. When he needed another command, he''d look it up in a reference
    book.


    +   - Create a small sample of what you want to do. If you''re working with a
    new command or part of Linux, create a small example of the one part of the command
    or software that you don''t know, and see how that works.


    +   - Keep it simple. A Friend of Jon''s named Mike Gancar (Hi Mike!) wrote a
    book called The Philosophy of Unix. In this book, he talks about how UNIX systems
    were created and programmed in the early days, utilizing lots of the small, cryptic
    (we prefer the word terse) commands that loop below the glossy interface of X
    Window System. With these commands, you can create powerful programs called shell
    scripts or just use the commands one at a time to transform your data. The main
    intent of book is to keep things simple and simple.


    +   - Remember that Linux is only a piece of code and your computer is only a
    machine. So what if you make a mistake? You''re probably running Linux on a machine
    that has only one user. That''s the great thing about Linux. It runs on inexpensive
    machinery that you can buy an old 486 computer with enough disk and memory in
    it to run Linux as a practice system, all for under $50. (Jon bought a machine
    at a Ham Fest. It runs very nicely.) So even if you have to reinstall your system
    due to some mistake you made, you won''t disturb anyone else on your practice
    machine. You now know how to install Linux, so no one has to know it but when
    something goes wrong.'
