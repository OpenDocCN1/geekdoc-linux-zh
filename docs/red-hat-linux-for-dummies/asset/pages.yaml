  md: '# Introducing the Linux file system tree


    The Linux file system is like a tree turned upside down, as shown in the following
    figure. The top of the upside-down tree is represented by a / (slash) and is called
    the root. A series of limbs, branches and leaves are below the root. The limbs
    are called mount points, the smaller branches are your directories, and the leaves
    are your files. Each mount point is a disk partition, and that disk partition
    is mounted on the directory branch, it turns the directory limb above it. When
    the partition is mounted on the directory branch, it turns that branch into another
    limb, allowing for even more branches to be positioned and attached below the
    mount point.


    Normally, you need at least a root partition in your directory structure (the
    upside-down tree) and a swap space (particularly if you have a system with under
    16MB of RAM). Therefore, at a minimum, you should set up two types of disk space:
    a Linux file system starting at the root


    and a swap space. Theoretically, you don''t have to set up swap space, and some
    people choose not to. If you do, however, you can run more programs than you have
    real memory for use data sizes greater than the real memory you have on your system.


    As mentioned, at a minimum, setting up a separate partition for your user files
    (usually called the home directory) is better and setting up multiple disk partitions
    for Linux is even better still. The downside is that backing up your files and
    updating your system to new versions of Linux much much easier. You have to leave
    empty space in each partition for new files, and these empty spaces add up. A
    reasonable analogy is using a filing cabinet to store your personal files versus
    a single box. The box is easier to obtain and takes up less space, but in the
    long run, a filing cabinet is much more useful and efficient.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_99_0.png)'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Chapter 5: Installation: The Home Stretch


    # # Choosing your disk partitions


    You can install Linux several ways. You can install it, and your personal files,
    all in one large partition. When you want to reinstall Linux (such as when you
    get an updated version or a different distribution), however, you have to back
    up and restore all your data files.


    The other extreme of installing Linux is to create a partition for each of the
    following areas:


    +   * A root partition (the root directory), where the kernel that necessary to
    boot the system and the configuration files reside reside. This partition needs
    to be only 30MB to 50MB.


    +   * A swap partition, which enables Linux to take advantage of virtual memory.
    If you have 16MB of RAM or less, you should have a swap partition. Actually, you
    should have a swap partition even if your system has more than 16MB. The swap
    partition should be the same size as the memory installed on your computer. If
    you have 32MB of RAM installed on your computer, for your swap file should be
    32MB. Then, Linux can run in 4MB of virtual memory. On the other hand, having
    more swap space allows programs to run simultaneously or large programs to run
    with more data. Linux allows each partition to be up to 127MB, with up to 16 swap
    partitions for Intel.


    +   * A /home partition, where the users'' home directories go. Its size is influenced
    by how many users you have planned for the system.


    +   * A /usr/local partition, for storing programs you want to separate from the
    rest of the Hat Linux software. It is a good idea to keep such software separate
    because when you reinstall the operating system you can leave this partition untouched


    Therefore, you don''t have to re-install the applications.


    +   * A /usr partition, where most of the software on the Linux system resides.
    It should be about 150MB to 350MB, depending on what packages you''re installing.


    +   * The /opt partition. is for optional applications and other software. Many
    software vendors automatically install to this directory. It is a good idea to
    keep such software separate when re-install the operating system you can leave
    this partition untouched. you don''t have to re-install the applications.


    +   * A /tmp partition, an additional partition for temporary files in larger
    multi-user systems and network file servers.


    +   * A /usr/src partition, which contains which of the Linux source code.


    The problem with this type of setup is that you have a lot of partitions that
    can''t share space. If you need a little more space in your /tmp partition, and
    for your /home partition is almost empty, Linux can''t easily use the space in
    /home/for /tmp usage. This is particularly true of smaller systems that have fewer
    disks and less disk space.


    A happy medium that we use is to create a root partition that includes /usr,/tmp,/asc,
    and /usr/local, another partition for swap space, and another partition for /home.
    On larger systems with more disks, we usually create more separate partitions.
    The preceding list shows the order that we use when creating separate partitions,
    in priority from top to bottom, stopping when we feel the disk space is becoming
    too fragmented.


    (continued)'
  merge: -1
