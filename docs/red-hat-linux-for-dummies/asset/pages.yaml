    # Sending E-mail


    To send an e-mail message, you need to know someone''s e-mail address. Just as
    a URL consists of certain components, an e-address is made up of the person''s
    e-mail name (often the same as his or her login name) and domain name. For example,
    to send an e-mail to the President of the United States, you address it to president@whitehouse.gov.


    Your ISP has given you an e-address, and you can ask your friends for their e-mail
    addresses. It''s ironic that to get your friends'' e-mail addresses, you end up
    spending a lot of time on the telephone.


    With the Mail & Discussions window on the screen, click the New Msg icon. The
    Compose window, similar to Figure 18-14, appears .


    # It slices, it dices, it even....


