  md: '# Saving the partition table and exiting fdisk


    The changes you make do not have any effect until you save them. If you want to
    quit fdisk at any time without saving changes, use the q command. If you''re satisfied
    with the changes, however, do the following at the fdisk command prompt:


    +   1. Type w to write the disk partition back to the disk.

    2. Type q.

    The fdisk programs terminates, and you return to the Red Hat installation screen.

    3. You''ve finished partitioning your hard disk, so select the Done button.

    4. If the system tells you to reboot, select the Ok button.


    You may see the reboot message if you changed the partition table by adding or
    deleting partitions, as shown in Figure D-12. This is a normal occurrence.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_374_0.png)


    +   5. Follow the same steps that you performed from the time you booted the "Beginning
    the Installation" section, in Chapter 5, until the installation program again
    gives you the choice of partitioning your disks — because your disks are now partitioned
    properly, select the Done button.'
