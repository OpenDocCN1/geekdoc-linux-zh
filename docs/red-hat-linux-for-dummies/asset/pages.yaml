    many SCSI controllers found on older sound cards (particularly the Sound Blaster
    and Media Vision cards).


    ![](img/61222a84312a7aaf1d7bb493d840cde4_340_0.png)


    We recommend that you stay away from some of the older SCSI cards and the sound-based
    SCSIs because they are slow and the booting process has difficulty determining
    where they are. Try to find a PCI-based SCSI controller instead.


