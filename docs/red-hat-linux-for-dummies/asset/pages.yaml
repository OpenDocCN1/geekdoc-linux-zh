  md: '# Piping: Oh Danny Boy, the Pipes....


    Many Linux commands generate a lot of output, and if it all went to standard output
    as output the screen, without some type of control, it would scroll past. For
    example, type the following:


    ```

    ls -al /etc

    ```


    This command lists all the files in your /usr directory. Because this directory
    holds a overload of files, the information scrolls down your screen faster than
    you — or Evelyn Wood graduate — can read it. You can, however, correct.


    With a process called piping Linux uses the output from one command as the input
    for another. It''s not as confusing as it sounds. In the last example, you had
    too much information — output — to fit on one lonely screen. You can take that
    information and output — or input — it into a program that divides the information
    into screen-sized pieces and displays them.


    To do this, you use the more command, which is an appropriate name for this tool.
    You pipe the list command output to the more command. But how do you pipe? You
    use the | character on your keyboard. We bet you were wondering what that key
    was. For type the command as follows:


    ```

    ls -al /etc | more

    ```


    Linux doesn''t care if spaces surround the | character, but you may want to use
    them for clarity and to get in the habit of including spaces because they are
    important at other times.


    When you press Enter, the information appears one screen at a time with the word
    More appearing at the bottom of each screen except the last one. To move to the
    next screen, press the spacebar. When you finish with the last screen, the more
    command takes you back to the Linux prompt. The more command can do even more.
    When the screen halts with the More appearing at the bottom, you can type some
    commands to the more program:


    +   - q to get out of the more command without wading through all those screens

    - h to see a list of all commands available in the more command


    Note that if you press Enter one screen at a time, Linux shows you the next entry
    in the list, not the next screen.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_166_0.png)


    ![](img/61222a84312a7aaf1d7bb493d840cde4_166_1.png)'
