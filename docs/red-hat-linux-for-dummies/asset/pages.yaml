    In Chapter 19, we list ten important places to find help. You can use some of
    these sources also to enhance and widen your knowledge of Linux. There''s no end
    to the things you can find out about Linux.


    In Chapter 20, we put together ten of the most frequently encountered problems
    after people have installed Linux. If you have trouble, turn here first.'
