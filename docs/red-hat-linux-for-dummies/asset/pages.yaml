  md: '# Chapter 5: Installation: The Home Stretch


    # What''s your keyboard''s nationality?


    Different countries have different keyboards. Linux, like many UNIX systems, have
    a keyboard mapping feature that enables you to use it with different keyboards.


    If you''re not in the United States, you will probably choose something other
    than the us keyboard, unless you bought your system in the United States. If you
    don''t see an obvious choice, choose something that looks like. If it seems to
    work, finish the installation. After the installation, you can change the keyboard
    mapping if necessary with the /usr/sbin/kbdconfig command.


    Figure 5-1 lists some of the keyboard maps for your system. If you''re in the
    United States, you will probably select the us option. Even, however, you may
    have a different keyboard than the us keyboard, so browsing through the list to
    see what else is worthwhile.


    If you choose one of the workstation or server installation types, then be careful
    that you don''t accidentally erase your existing partitions. Red Hat gives you
    the option to manually create the partitions or let Red Hat choose them automatically.
    The manual method works exactly as described in the section “Partitioning your
    Hard Disk,” which uses the Disk Druid utility.


    # Partitioning Your Hard Disk


    The steps in this section describe the most crucial configuration decisions that
    you need to make. You need to decide how to partition your hard disk. Partitions
    are where the software that comprises Linux are stored.


    Red Hat uses the Disk Druid program to partition your hard disk. No, no hooded
    guy from ‘ol England’ isn’t behind the screen. Disk Druid is a Red Hat program
    that simplifies the job of partitioning your hard disk.


    If you choose to test for bad blocks during the formatting of the swap partition(s),
    testing the surface of the disk may take a while. Don''t panic if nothing seems
    to be happening for a few minutes.


    The Disk Druid window, similar to the one shown in Figure 5-2, shows all the existing
    partitions on your hard drive. Note that if you''re using a SCSI hard drive, then
    your drives show up as sda, sdb, and so on. If like most people, have a typical
    PC, then you use an IDE hard drive. In that case, your drives show up as had,
    hdb, and so on, as shown in Figure 5-2. Whatever type of drive you have doesn''t
    affect how Disk Druid works, so don''t worry that your examples differ from yours.'
