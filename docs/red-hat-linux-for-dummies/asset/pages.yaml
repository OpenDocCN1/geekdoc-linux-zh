  md: '# Introduction


    Other books about Linux contain fascinating information for UNIX system administrators
    as well as long lists of unpronounceable commands with confusing options. Red
    Hat Linux For Dummies is different. The fascinating information is for you, and
    the descriptions and directions are written in plain English.


    Use this book as an entertaining and informative reference to Linux. Or buy a
    whole stack of them and use them to press flowers. (Hey, you can still use the
    top one as a reference for Linux.)


    # About This Book


    This book is designed to be a helping-hands reference. It provides a place to
    turn to for help and solace in those moments when, after two hours of typing xstart
    fruitlessly and reloading X Window System twice, your 5-year-old tells you that
    the .x goes at the end of the word.


    We tried our hardest to fill this book with the things that you need to know,
    such as:


    +   - Installing Red Hat Linux

    - Installing the X Window System

    - Issuing important commands

    - Working with files and directories

    - Using Applicx Words and other applications

    - Getting online and building a firewall

    - Finding help


    You''ll see troubleshooting tips throughout the book. It''s not that Linux is
    all that that much trouble — we just want your experience to be trouble-free as
    possible.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Foolish Assumptions


    You know what they say about people who make assumptions, but this book would
    never have been written if we didn''t make a few. This book is for you if:


    +   * You have a Linux operating system. Surprise — one is on the Red Hat Linux
    For Dummies CD-ROM in the back of the book.

    * You have an x86 PC-compatible computer with at least a 2x CD-ROM drive.

    * You want to put the Linux operating system and the computer together, using
    duct tape hasn''t worked.

    * You don''t need to become a Linux guru — at least not yet.


    # Conventions Used in This Book


    At computer conventions, thousands of computer people get together and talk about
    deep technical issues such as:


    +   * Is Coke better than Pepsi?

    * Are Tim-Tams the ultimate junk food?

    * What is the best hardware for running Linux?


    But these are not the types of conventions we''re talking about in this section.
    Our conventions are shorthand ways of designating specific information, such as
    what is and isn''t a command or the meaning of certain funny-looking symbols.


    # Typing code


    Commands in the text are shown like this. Commands not in the text, but set off
    on lines by themselves, look like this:


    ```

    [maddog@shamet]$pwd

    /home/maddog

    ```


    When you see stuff in boldface, it means it''s something you should type. The
    non-bold stuff is text that the computer displays. So, in the preceding example,
    when you type pwd (and press Return), the computer displays /home/maddog.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Introduction


    Well, not quite. Notice the [maddog@shamet maddog] in the preceding shaded area.
    You won''t see that on your system, unless you''re my doppel-ganger, that is.
    But you will see something similar. The same goes for /home/maddog; the maddog
    is replaced with the directory name on your system.


    Now for some further complications. Check out the following:


    ```

    [root@shamet #] passwd <name>

    ```


    <name> is italic. That means you should replace <name> with a name. In this case,
    you replace <name> with your login name. How are you supposed to know that? Don''t
    worry, we tell you so in the text.


    Here''s a rundown of the command syntax in Linux:


    +   - Text inside brackets [ ] is optional.

    - Text inside angle brackets > must be replaced with appropriate text.

    - Text inside braces { } indicates that you must choose one of the values that
    are inside the braces and separated by the | sign.

    - Text not surrounded by [ ], {, or < > must be typed exactly as shown.

    - An ellipsis (...) means so and on to repeat the preceding command as needed.


    Don''t concern yourself with this too much. For the most of the book, you don''t
    need to know these particulars. When you need to know something about a particular
    syntax, come back here for a refresher course.


    # Keystrokes and such


    Keystrokes are shown with a plus sign between the keys. For example, Ctrl+Alt+Delete
    means you should press the Ctrl key. Alt key, and Delete key all at the same time.
    (No, we don''t make you press any more than three keys at the same time:)


    You also seeing something like this time to time:


    ```

    [maddog@shamet maddog]$ vi quagmire

    a

    echo Report of login names and users on the Linux system

    date

    ------------------------------------

    cut -f 1,5 -d: /etc/passwd | sed ''s/:/ - - /''

    <ESC>

    :wq

    ```'
  merge: -1
