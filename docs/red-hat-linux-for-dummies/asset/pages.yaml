    # Getting to know (and configure) GNOME


    Now that you are familiar with the basics of what GNOME can do, it''s time to
    briefly describe how you can modify it. There are two configuration systems that
    you need to pay attention to. The first is the GNOME Control Center system. The
    second is the Enlightenment configuration system.


    The GNOME Control Center is started by clicking the Main Menu button and choosing
    Settings: GNOME Control Center. The screen shown in Figure 14-6 starts. The Control
    Center lets you modify all the basic properties of GNOME. For instance, choose
    Desktop: Background and you can set the color, and other aspects of the Desktop.
    Choose Desktop: Screensaver: Xjack and switch from the default random screen saver
    to the “All work and no play makes a Jack a dull boy” screen saver. Not a bad
    selection for those long winters spent at remote resorts!


