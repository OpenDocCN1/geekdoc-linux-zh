  md: '# # Appendix E


    # # About the CD-ROMs


    The CD-ROMs that comes with this book contain the full freeware distribution of
    Red Hat Linux 6.1, sourcecode, as well as Netscape Communicator. CD2 contains
    source code, CD1 contains everything else.


    # ## System Requirements


    Make sure that your computer meets the minimum system requirements listed here.
    If your computer doesn''t match up to most of these requirements, you may have
    problems using the contents of the CDs:


    +   - A PC with a 486 or faster processor.

    - At least 8MB of total RAM installed on your computer. For the best performance,
    we recommend that people who want to use X Window System have at least 16MB and
    preferably 32MB of main memory.

    - At least 800MB of hard drive space available to install all the software from
    the CD. You''ll need less space if you don''t install every program. For example,
    if you want to install only the smallest subset of the base system and X Window
    System, you can do that in about 180 bytes.

    - A CD-ROM drive.

    - A 3½-inch floppy disk drive and a blank 3½-inch disk.

    - A monitor capable of displaying at least 256 colors or grayscale.

    - An IDE or a SCSI disk.

    - A keyboard and a mouse.

    - A modem with a speed of at least 14,400 bps if you want to go online.


    Appendix B lists all the hardware compatible with Linux.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# Using the instructions


    # What You''ll Find


    CD1 contains the freely distributable parts of Red Hat Linux Publisher''s Edition
    Version 6.1. You may view lot of the documentation on this CD through an HTML
    viewer such as Netscape, which is also included on CD1, and you may print it out.
    You can also view most of this from other operating systems such as DOS, Windows,
    or UNIX.


    We recommend that you look at the “Official Red Hat Linux Installation Guide,”
    which is in the following directory:


    ```

    [Your CD-ROM drive number]:doc\rhmanual\manual\index.htm

    ```


    The guide is included in HTML format, so you can view it with a Web browser.


    Because CD1 has a full implementation of Linux, all the accompanying tools and
    utilities would take too much room. Briefly, the CD includes most of the software
    that you need to access the Internet; write programs in several computer languages;
    create and manipulate images; create, manipulate, and play back sounds (if you
    have a sound board); play certain games; and work with electrical design. And
    of course, all the source code is included — CD2 includes additional source code
    for Linux.


    # If You Have Problems (Of the CD Kind)


    We tried our best to test various computers with the minimum system requirements.
    Alas, your computer may differ, and Linux may not install or work as stated.


    The twoeliest problems are that you don''t have enough RAM for the programs you
    want to use, or you have some hardware that Linux does not support. Luckily, the
    latter problem occurs less frequently each day as hardware is supported under
    Linux. (Check out Appendix B for a list of compatible hardware).


    You may also have SCSI disks that use a controller not supported by Linux or'
  merge: -1
  pgno: 377
- img_proc: true
  md: 'a controller that is simply too new for the Linux development team to have
    given it the proper support at the time the CDs were pressed.


    If you have trouble with corrupt files on either of the CDs, please call the IDG
    Books Worldwide Customer Service phone number: 800-762-2974 (outside the United
    States: 317-596-5430). Customer service won''t be able to help with the complications
    relating to the program or how it works. Please see the Installation Instructions
    at the end of this book.'
