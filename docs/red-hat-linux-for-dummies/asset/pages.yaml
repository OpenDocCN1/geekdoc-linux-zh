  md: '# Acquiring Distributions and Compendiums


    Linus Torvalds and the Linux development team created the Linux operating system
    kernel. The kernel includes the software for managing memory, files, programs
    that are running, networking, and various hardware devices. Think of the kernel
    as a cop directing traffic.


    The compilers and other programs that go making up what most people think of Linux
    come from a variety of people who distribute the programs over the Internet or
    on CD-ROM. Typically, these people add an installation technique, system management
    tools, a file system (the way that directories and files are organized), some
    applications (either freeware or commercial), and a distribution medium. The base
    Linux system must be able to be freely copied, even if value-added components
    are not.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_45_0.png)


    In addition to a single distribution that may come on one or more CD-ROMs, you
    can find compendiums of distributions, which are like samples, that include several
    distributions as well as copies of Internet sites that hold Linux programs and
    documentation. Some information on compendiums is redundant and harder to use
    than if it came on a single-distribution CD; other information is useful and usually
    inexpensive. After you have Linux and running, you may want to try out a compendium
    to see what it holds for you.


    The question you''re probably asking now is "Which Linux distribution is best?
    The answer is "It depends on what you want." Some people want a Linux distribution
    that works with an older kernel that has had time to mature; others want the latest
    and greatest distribution. Some people want small distributions with few programs
    other than the operating system; others distributions overflowing with goodies.
    Most people, however, want a combination of these features as a stable name offering
    reliable customer support.


    Linux distributions are so inexpensive that you can easily buy two or three versions
    to see what they''re like. Many Linux distributions may be installed on multiple
    computers. And after you install Linux for the second or third time, think of
    the experience you''ll have gained.'
