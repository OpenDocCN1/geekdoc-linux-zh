  md: '# Part I: Introducing Linux


    # Using Linux in Different Ways


    Linux is a versatile operating system. Initially the sole domain of computer science,
    Linux is now used by businesses, individuals, and govern-ments to cut costs, improve
    performance, and get work done. You can use Linux in a variety of ways: as a desktop
    workstation, a server system, an Internet gateway (by means by which you can connect
    your network to the Internet), a firewall, the basis of an embedded system (such
    as a smart VCR or a robot), or even as a supercomputer. Another prominent use
    of Linux is by Internet service providers (ISFs), who use it to provide information
    and services to the Internet and the World Wide Web. And thousands of people working
    on different parts of Linux, the system becomes more flexible and capable with
    each passing day. Linux is a revolutionary system that would put Dilbert out of
    business.


    # Boosting your personal workstation


    With the powerful operating system, you can run many programs at the same time,
    handle the needs of more than one user at a time, and use high-quality graphics.
    Linux can handle files and programs of immense size. When used with the 64-bit
    Digital Alpha processor, for example, Linux can handle data terabytes (thousands
    of billions of characters in size). Linux uses a sophisticated window-ing system
    called the X Window System (also known as X Windows, X11, or most commonly as
    X) and can share files not only with UNIX systems but also with Windows, OS/2,
    and other operating systems.


    Linux also includes the following:


    +   - Compilers

    - Database editors

    - Freeway programs (such as mail readers, image editors, circuit design programs,
    and text formatters)

    - HTML editors

    - Slide/graphic presentation tools

    - Spreadsheets

    - TCP/IP

    - Web browsers

    - Word processors'
