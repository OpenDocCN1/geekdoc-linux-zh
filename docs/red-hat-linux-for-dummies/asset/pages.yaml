    Pretty neat.


    We''re not done yet! You can also find tutorials by choosing Help->Tutorial, as
    lessons on formatting and spell checking. These tutorials are a good way to quickly
    run up that ''learning curve. Figure 16-6 shows a sample help window. Help covers
    several other topics, including the other Applixware functions.'
