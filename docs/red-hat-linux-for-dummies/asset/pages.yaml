  md: '# 106 Part II: Installing Linux


    # Introducing the gods of X


    Your X programs come from code that contributed to the X Window System project,
    which was first connected with Project Athena at the Massachusetts Institute of
    Technology. Later, the project became the focus of the X Window System Consortium,
    a nonprofit group established to develop the X Window System technology.


    for the love of programming. The XFree86 team of programmers tried to give support
    to new video controllers as they come out. Unfortunately, giving this support
    is often difficult for several reasons:


    Because the source code was freely distributable, a group of programmers from
    all over the world formed to give support to X Window code on low-end PC systems.
    They called themselves XFree86 based on the fact that their code was free and
    directed towards PCs, which were largely based on Intel x86 compatible processors.


    +   - They have no relationship with the video controller manufacturer.


    +   - The video controller manufacturer thinks that keeping the programming interface
    secret gives it an edge against its competitors.


    +   - The video board is built into a larger system board.


    +   - The video controller is simply too new.


    Over time, they ported their code to freely distributable operating systems on
    other architectures. They did this — and continue to do this —


    Until support is available, most people rely on SVGA compatibility mode to get
    the card to work.


    # Shutting Down the System


    If you''re accustomed to MS-DOS or Windows 3.1, having a section on shutting down
    the system may seem strange. After all, shouldn''t you just off the power switch?
    No! Linux requires a systematic process to shut down the operating system, after
    which you can turn off the power switch.


    If you have finished installing the system, you are logged in as a systems administrator
    called root. Follow these steps to shut down the system:


    +   1. If X is running, press Ctrl+Alt+Backspace to stop X.


    +   The system returns to character-cell mode, and the # prompt appears. The #
    prompt tells you that you have the powers of the systems administrator (don''t
    let it go to your head) and that you can shut down the operating system.


    +   2. Type shutdown -h now at the prompt.


    This command tells Linux to halt the operating system now rather than later.'
  merge: -1
