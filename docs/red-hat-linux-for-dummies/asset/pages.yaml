  md: '# Red Hat Linux For Dummies


    Now, you know from the "Typing code" section that the stuff in boldface needs
    to be typed as shown. When you see a key in angle brackets, such as <ESC>, in
    code, it''s telling you to press the Escape key, not to type the E S C characters.


    # How This Book Is Organized


    Like all proper For Dummies books, this book is organized into independent parts.
    Well, that''s not quite true. This is an almost proper For Dummies book. If you
    don''t have Linux installed, you really have to go through Part I before you can
    do much with Linux, also from framing the CD or using it as a neat Frisbee.


    For all other parts, you can read them in any order. Heck, try reading them backwards
    for a real challenge. In this section, we tell you what each part contains.


    # Part I: Introducing Linux


    In Part 1, you find out about the birth of Linux and about the different types
    of Linux out there, including the one on the Red Hat Linux For Dummies CD-ROM.
    You also get some tips on which one is right for you.


    # Part II: Installing Linux


    In Part II, you get your answer to the age-old question: How the heck do I install
    Linux? We give you detailed, step-by-step instructions. You also get lots of help
    installing the X Window System, the graphical part of Linux. You may want a double
    espresso or a can of Jolt soda (Twice the caffeine!) by your side for this one.


    # Part III: Just the Basics


    Linux isn''t a high-maintenance operating system, but it does need some care.
    (Chocolate helps, too.) In Part III, you discover how to manage the Linux file
    system, which is the biggest part of caring for and feeding Linux. You also get
    some hints on writing simple programs with Linux scripts and adding new software
    with RPM Vroom. Vroom.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Introduction


    # Part IV: Using Red Hat Linux


    In Part IV, you get the glorious particulars on actually doing something with
    Linux. We''ll take you through the X Window System and the GNOME desktop windows
    environment by moving, resizing, hiding, and closing windows, as well as using
    the file manager and much more. We also introduce full-featured desktop productivity
    suites such as Apprix and StarOffice, and show how Linux can now be used in the
    front office as well as the back office.


    # Part V: Going Online


    Everyone is online these days, and Linux users are no exception. In Part V, you
    find out how to contact an Internet service provider (ISP) to get an account for
    accessing the Internet, how to set up Linux to interact with that account, and
    how to use the Netscape Navigator Web browser with that account to ski the Web.
    We also give instructions for setting up a simple but effective firewall to protect
    your valuable information.


    # Part VI: The Part of Tens


    A For Dummies book isn''t complete without a Part of Tens, and that''s Part VI.
    You find ten all-important resources in Chapter 19. And in Chapter 20, we provide
    answers to the ten most bothersome questions people have after installing Linux.
    (The folks at Red Hat Software provided these questions.)


    # Part VII: Appendices


    Finally, the appendices. In Appendix A, instructions are given for using the de
    facto Linux text editor vi. We list all the hardware that we know that''s compatible
    with Linux in Appendix B. In Appendix C, you find out all you need to know about
    the Linux man pages, while Appendix D gives you instructions for using fdisk to
    partition your hard disk. And in Appendix E, we''ll tell you where in the book
    you can get information on installing the applications on CD-ROMs.


    # What You''re Not to Read


    Heck, you don''t have to read any of this book if you don''t want to, but why
    you bought it? (Not that we''re complaining.) Part I has background information.
    If you don''t want it, don''t read it. Also, in sidebars is optional,'
  merge: -1
  pgno: 32
- img_proc: true
