- img_proc: true
  md: 'Deleting directories is a little more complicated, of course. When you choose
    to delete an entire directory, and it''s not empty, a prompt appears to delete
    it recursively (which means it deletes all subdirectories, too). Answer Yes and
    every file and directory within that directory is removed.


    Finally, you can delete multiple files and directories. Also, lasso the desired
    files and directories by clicking and dragging the mouse cursor. Right-click the
    icons or names (but not the white space around the icon and name). The simple
    menu, as described previously, appears. Select Delete and then answer Yes in the
    confirmation window.


    You can change the confirmation behavior of moving, copying, or deleting functions.
    Choose Edit; Preferences and select the Confirmation tab in the Preferences window.
    You can toggle various options that control such behavior.


    # Creating directories


    To create a new directory, choose Directory. The Create New Directory dialog box
    appears; enter the name of the new directory. Linux creates the directory in the
    current working directory, which is the directory that the File Manager currently
    shows.


    # Viewing files and directories


    By default, files and directories display in iconic — symbolic — form. The only
    information that an icon shows is the name and whether it is a file or directory.
    You can see more information by clicking the Brief, Detailed, or Custom buttons
