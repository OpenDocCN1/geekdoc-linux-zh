  md: '# Appendix D: Making Life Difficult with fdisk


    ![](img/61222a84312a7aaf1d7bb493d840cde4_366_0.png)


    Deleting partitions

    Look at the partitions printed by the p command. The first one (probably denoted
    by hda if it is an IDE disk sda if it is a SCSI disk) is known to fdisk as partition
    1, and it''s probably the Microsoft operating system (such as Windows or MS-DOS),
    if you have one. The second partition is partition 2; this is probably the partition
    created by FIPS and is therefore empty. To delete the empty partition, follow
    these steps:


    +   1. Type d.

