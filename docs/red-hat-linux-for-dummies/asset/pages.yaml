  md: '# 230 Part IV: Using Red Hat Linux


    Most of the amixer controls are labeled in Figure 15-17. Here''s a little additional
    information:


    +   - The Loudness control boosts the bass slightly for when you low volume output
    (when your parents are home, the baby is asleep, or you have new batteries in
    your hearing aid).

    - The Stereo Separation control is for cards that try to convince you that they
    have stereo separation capabilities.

    - Each slider is made up of two columns, one for the left channel and one for
    the right channel. Place the cursor directly over one of the columns and drag
    to move the column up or down. Move the cursor between the two columns to move
    both columns at the same time.


    We find it easier to use the middle mouse button to grab the top of the column.
    To do so, move the cursor to the top of a column, click and hold down the middle
    mouse button, then move the mouse to pull the column up and down. If your mouse
    has only two buttons but you requested three-button emulation when installing
    your system, hold down both buttons at the same time to simulate the middle mouse
    button.


    If you didn''t ask for three-button emulation but want it now, follow these steps
    to do:


    +   1. Become root or superuser.

    2. Execute the following:

    `/usr/sbin/mouseconfig`

    3. Tab until the cursor is over Emulate Three Buttons and press the spacebar.

    An asterisk (*) appears in the window.

    4. Tab to the Ok button and then press the Enter key.

    You have installed three-button emulation for your mouse.

