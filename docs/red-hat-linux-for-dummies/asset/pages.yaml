  md: "# # Appendix C\n\n# # The Linux man Pages\n\n**In This Appendix**\n\n+   -\
    \ Starting the `man` command\n- Reading the man pages\n- Finding commands\n\n\
    UNIX and Linux systems are largely made up of small, terse commands executed on\
    \ the command line. Typically, each command is associated with at least one man\
    \ page. The Linux man pages have nothing to do with gender: The *man* stands for\
    \ *manual*.\n\nAt one time, the man pages were the only documentation that came\
    \ with UNIX systems. Somewhere we still have the thin book we received as first\
    \ time users and systems administrators. All that contained was the man pages,\
    \ and from that, we were supposed to install a UNIX system. Many years later,\
    \ we still look at the man pages first to get a quick idea of what a command should\
    \ do, and what arguments to use on the command line or what values to set.\n\n\
    This appendix shows you how to use the `man(1)` command, and how to read and understand\
    \ the man pages, and how to locate other man pages that may help you understand\
    \ the Linux command you're investigating.\n\n# # Using the man Command\n\nTo get\
    \ started using the man pages, follow these steps:\n\n+   1. **With Linux up and\
    \ running, log in** as a user (either a general user or root).\n2. **Type the\
    \ `man` command**.\n   The system asks what manual page you want. The syntax of\
    \ the `man` command (like many other commands) requires at least one argument.\n\
    3. **Supply an argument by typing** `man man`."
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 324 Part VII: Appendixices


    The first man is the command name, and the second man tells Linux that you want
    information on the manual program itself. The system may tell you to wait a moment
    while it formats the page to your screen, and then it displays the reference page
    for the man command.


    +   4. If a colon ( appears at the bottom of the screen, press the spacebar to
    see the next page, or use the arrow keys to maneuver around the pages.


    +   5. To quit the program, press the q key.


    # Sections in the man Pages


    You can usually find the man pages in several directories throughout the system:


    +   - /usr/man

    - /usr/local/man

    - /usr/X11/man

    - /usr/lib/perl5/man


    Each directory is broken up into subdirectories representing sections of the manual,
    as follows:


    +   - man1: User commands

    - man2: System calls

    - man3: Library functions

    - man4: Special files

    - man5: File formats

    - man6: Games (look at everyone going to that section!)

    - man7: Miscellany

    - man8: System administration commands

    - mann: roff, troff, and gro (and now tk) macros


    Note that most directories have more than one section.


    Two sections may have entries for a command of the same name. For example, section
    1 has an open command, and section 2 has an open system call. To make sure that
    you''re reading about the right one, you can specify the command on the man command
    line. For example:


    ```

    $maddog@doghouse maddog$ man 2 open

    ```'
  merge: -1
  pgno: 351
- img_proc: true
  md: 'Most sections of the man database (because that''s basically what it is) have

    two parts:


    +   - An intro page represented by a file called intro.n, where the n is a

    number that corresponds to the section number.

    - All commands, calls, library names, and filenames, represented by files

    with the name command.n, where n is the section number.

    - If you use code to change to /usr/man/man/ directory and issue the ls

    command, you see files such as cat.1 and grep.1. Oddly, you don''t find a

    file called cd.1, because the cd command is built into the different shells,

    and its documentation is covered in the bash.1 file, or the csh.1 file.


    If you''re using bash as a shell, you can get information about the rest of the

    built-ins are as follows:


    ```

    [maddog@dghouse maddog]$ help

    ```


    The intro page briefly describes that section of the manual and indicates

    whether you need to know anything special about that section. Printing an

    intro page is simple. For example:


    ```

    [maddog@dghouse maddog]$ man 2 intro

    ```


    or


    ```

    [maddog@dghouse maddog]$ man 3 intro

    ```


    # Topics in the man Pages


    Each page is made up of several sections. Here, we list the sections that

    we think are most important in your quest to figure out how to read man

    pages. Note that some man pages don''t contain all these sections, and other

    pages contain more sections than those outlined here.


    # Name


    The usual is the command name, followed by a hyphen, followed by a

    one-line description of the command''s functionality; this is usually what you

    see if you execute a man -k command or an apropos command. Either of

    these commands, when followed by a word, lists the name field from every

    manual page that contains that word. Type the following:


    ```

    [maddog@dghouse maddog]$ apropos cat

    ```'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# 326 Part VII: Appendixices


    Your apropos command may produce few or no commands. Perhaps no one has generated
    the database made up of command names and descriptions. To do this, either you
    or your systems administrator has to become superuser or root and then execute
    the following command line:


    ![](img/61222a84312a7aaf1d7bb493d840cde4_353_0.png)


    ```

    /usr/sbin/makewathatis

    ```


    # Synopsis


    The synopsis is a shorthand way to describe what the command is looking for in
    terms of argument list. For example:


    ```

    lpq [-l] [-Pprinter] [job # ...] [user ...]

    ```


    is the synopsis for the lpq command (whose job is what is in the print queue).
    The command name (lpq) is first, followed by a series of bracketarguments. If
    an argument is enclosed in square brackets, the argument is optional, meaning
    the lpq command needs no arguments. If you type:


    ```

    [maddog@dghouse maddog]$$ lpq

    ```


    you probably get a no entries message — which means nothing waiting to be printed
    — or a list of people''s jobs waiting to be printed on the default printer.


    If you want to see what is waiting to be printed on another printer, use the optional
    argument -P followed by the name of the printer. For example:


    ```

    [maddog@dghouse maddog]$ lpq -Pzkipsa

    ```


    Now if you type this command, you probably get a message like lpq: zklipsa; unknown
    printer, indicating that your system does not know about a printer zklipsa. If
    you get something else, please let us know that may explain where our print jobs
    are going ... . no, no, just kidding.


    If, however, you have a printer hp51, then you can enter the command to find out
    its status:


    ```

    [maddog@dghouse maddog]$ lpq -Php51

    ```


    In any case, the purpose of this section is not to show you all the functionality
    of the lpq command. Rather, the synopsis section shows in a shorthand way how
    you should use the command, including which arguments are optional.'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'Another confusing thing you see is the . . . notation. Looking back at the
    1pq command synopsis, you see it twice, once following the job # argument and
    once following the user argument. This notation tells you that you can list as
    many job numbers on the line as you want, separated by spaces, and as many user
    names as you want, separated by spaces.


    Sometimes you see a command argument that begins with one hyphen (-) or two (--).
    These characters are technically known as options, whereas job # and user of the
    lpq command are arguments. Options tell the command how to manipulate arguments.
    You may see an option line that looks like this:


    ```

    cat [-benstuvAET]

    ```


    or even:

    ls [-abcdefghiklmnpqrstABCDEFGHIJKLMNOPQRSTSUX1]


    Don''t be overwhelmed. If you deal with the options one at a time, you''ll be
    able to understand how the command works. Take heart in the fact that most of
    the time, people use only one or two options.


    If you issue the ls command, you see that ls has many more options. That''s why
    ls has been described as "a command that went bad with good intentions."


    # Description


    The description section is a brief introduction to the command''s functionality,
    which is then expanded by what the options specify the command to do. A good example
    of a description is the manual page for man itself.


    # Options


    The options section tells how the command treats data in the arguments. Each option
    modifies the command''s actions, drastically or subtly. The options can also pass
    information to the command about where to find files. The three types of options
    are:


    +   - No argument

    - Attached argument

    - Positional argument'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 328 Part VII: Appendixes


    No argument means the option has a hyphen, followed by one or more single-character
    options. For example:


    ```

    [maddog@doghouse maddog]$ ps -ax

