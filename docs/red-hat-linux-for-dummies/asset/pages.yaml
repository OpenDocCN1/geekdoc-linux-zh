    - Taking a look at Linux applications


    Linux is a great operating system with a large base of applications. Major desktop
    productivity applications, like the Applixware and StarOffice desktop office suites,
    have moved Linux into the realm of everyday use. You can also use Windows applications
    on your Linux computer with the help of emulation and other tools. Put these together,
    these packages provide powerful, inexpensive methods for getting your day-to-day
    work done. Linux isn''t just for us nerds anymore.


    # # Introducing Applixware


