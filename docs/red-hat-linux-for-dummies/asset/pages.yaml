  md: '# 54 Part II: Installing Linux


    # Making Room for Linux


    Before you can install Linux on your system, you need to make room for it. Some
    people find space by getting rid of MS-DOS and Windows. Others don''t want to
    make such drastic changes and prefer to have Linux and their other operating system
    peacefully coexist. If this later setup fits the bill for you, the easiest way
    is to add a new hard disk — either IDE or SCSI — to your system and install Linux
    on that.


    If you don''t want to get rid of your current operating system and can''t add
    another hard disk to your system, your only remedy is to defragment your other
    operating system — make its disk space smaller — and then install Linux in the
    free-up space.


    MS-DOS systems usually have one big DOS partition. A partition is simply a method
    for organizing the space on a disk. A disk — like most Windows installations —
    one partition, then the entire disk is used in one big chunk, the C drive: If
    there are two partitions, then the disk is divided into two chunks. For instance,
    if you have two partitions on a Windows disk, then you will see two drives — C:
    and D: for instance.


    That''s the spot you want to make smaller so you can install Linux in the left-over
    space. You can shrink the DOS partition by using destructive repartitioning which
    wipes out all the data on the hard disk, or nondestructive repartitioning which
    is not supposed to wipe out all the data on the hard drive. Yep, this process
    is an adventure, but as your tour guides, we''ll steer you clear the pitfalls.
    Please keep your hands inside the car.


    > Note: If you decide to keep space on your hard drive for DOS, try to keep DOS
    in the first partition because it makes managing DOS and Linux together much easier.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_81_0.png)


    Before performing any major work on restructuring your hard disk, as you are about
    to do, backing up your disk is wise in case something goes wrong. You don''t want
    to lose any data or programs you worked hard to install. Please refer to your
    system owners'' manual to find out how back up your system and how to restore
    the data if necessary. We can''t stress this strongly enough. Backing up is like
    buckling up: It saves lives. Okay, maybe it''s not important, but it certainly
    saves your sanity if you lose your valuable data.


    # Choosing nondestructive repartitioning


    If you can''t add another hard disk to your system, and your only choices are
    destructive and nondestructive repartitioning, nondestructive repartitioning is
    definitely the better choice of the two. You still need to back up your system,
    just in case you have to restore it afterward.'
