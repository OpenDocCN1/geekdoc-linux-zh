  md: '# # Chapter 5


    # # Installation: The Home Stretch


    In This Chapter


    +   - Starting the actual installation

    - Start configuring your new Linux installation

    - Partitioning and formatting your disk

    - Installing the Red Hat Linux software

    - Configuring networking


    Sit down, grab your favorite drink, and contemplate the excitement about to unfold.
    Okay, okay, sit down and contemplate that you won''t have to work hard to install
    Linux. And after you''re done, you''ll have a powerful computer capable of performing
    most, if not all, of your daily chores. The exciting thing is that you''ll have
    all that for the cost of this book! That''s pretty amazing when you think about
    it. For a few bucks, you get the power that it took a million dollars to get just
    a few years ago.


    This chapter describes the first half of the Red Hat installation process. The
    process is divided into the installation of the software and its configuration.
    We describe the installation here and the configuration in Chapter 6.


    # # Beginning the Installation


    Red Hat gives you two installation interface choices: a graphical and a menu-based
    one. The graphical system simplifies the process by grouping similar configurations
    choices together. The menu-based one you takes step by step through the entire
    installation.


    The menu-based installation system works on more computers than the graphical
    one. The graphical system doesn''t recognize all video cards. Therefore, we describe
    the menu-based one here. If you want to use the graphical system, you can use
    these instructions as a reference — they describe all the information that you
    need to supply to install Red Hat.'
  merge: -1
