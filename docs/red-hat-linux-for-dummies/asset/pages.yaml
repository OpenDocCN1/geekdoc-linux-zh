  md: '# Chapter 9: Filing Your Life Away


    # 123


    Your /home directory is not safe from prying eyes. To be sure that your privacy
    is maintained, you need to lock your directory. (We tell you how in the “Granting
    Permissions” section.) However, anyone logging on to your system as root (superuser)
    can see what''s in your /home directory, even if you do lock it.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_150_0.png)


    # Moving Around the File System with pwd and cd


    You can navigate the Linux file system without a map or a GPS. All you need to
    know are two commands: pwd and cd. (These commands are run from the command line.)


    # Figuring out where you are


    To find out you are in the Linux file system, simply type pwd at the command prompt
    as follows:


    ```

    maddog@shamet maddog)$$pwd

    /home/maddog

    maddog@shamet maddog)$$

    ```


    This command indicates that we''re logged in as maddog and in the /home/maddog
    directory. Unless your alter ego is out there, you should be logged in as yourself
    and in the /home/yourself directory, where yourself is your login name.


    The pwd command stands for printing directory. Your working directory is the default
    directory where Linux commands perform their actions. When you type the ls(-l)
    command, for example, Linux shows you the files in your working directory. Any
    file actions on your part occur in your working directory. For security reasons
    that we wont not go into here, the root user is not configured by default to work
    on the current working directory. You can change this, but in general, the root
    user must explicitly specify the current working directory. For instance, you
    are root and are in the /etc directory, and you want to indicate the hosts file,
    then you must enter cat /.hosts instead of just cat hosts.


    Type this command:


    ```

    ls -la

    ```'
