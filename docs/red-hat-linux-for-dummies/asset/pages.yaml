    The a and the x do not have any other values that they have to look at. However,
    in the following command:


    ```

    [maddog@doghouse maddog]$ 1pq -Pzkipsa

    ```


    the P option needs you to supply an argument, in this example, zklpsa.


    # Environmental variables


    Sometimes, to cut down on the information you have to give the command, you can
    set an environmental variable. Each shell (or command interpreter) has an environment
    that it works in. This environment (when it is created) consists of certain files
    that are open, some memory, and almost always some environmental variables.


    Using the bash shell, type the following (if you''re not sure that you''re using
    the bash shell, type bash at the command prompt and then continue with the example):


    ```

    [maddog@doghouse maddog]$ printenv

