    # Installing Applixware


    Once you obtain the Applixware demo via the Internet or the complete package on
    CD-ROM, installing it is a straightforward process. The demo comes in RPM format
    (see Chapter 13). To install Applixware, follow these steps:


    +   1. Log in as the root user and enter the following command (it assumes that
    you have put the Applixware software into the /usr/local/src directory).


    ```

    Tar xvf /usr/local/src/applixdemo*

    ```


    (Please note that the pathname you supply depends on where you downloaded the
    demo to. The following instruction assumes that you downloaded the demo to root''s
    home directory. If you put it somewhere else, or have a CD-ROM copy, then please
    make the appropriate adjustments.


    The Applixware installation and setup system starts its job. A language dialog
    box appears.


    +   2. Run the installation script as follows:


    ```

    /usr/local/src/applix*/install-axdemo

    ```


    A simple informational screen appears.


    +   3. Press any key to continue.


    The installation script prompts you to install into the /opt file system.


    +   4. Press the Return key to continue. Otherwise, you must specify a place to
    put the file system (/usr/local file system is a good alternative).


    If the installation directory does not exist, a prompt appears that enables the
    installation process to create it. Press the Return key to continue.


    Applixware starts to install. It may take ten or more minutes to complete.


    # Firing up Applixware


    After you install Applixware, you can start it by entering the following command
    from a terminal window. First, however, fire up a terminal window by clicking
    the terminal icon on the Gnome/Enlightenment terminal desktop — it looks like
    a computer monitor or TV screen and is located in the GNOME toolbar located along
    the bottom of the screen.'
