  md: '# Chapter 16: Using Linux as Your Workstation 237


    # View that


    The View menu displays or hides the various menu bars, as described in the beginning
    of this chapter. You can also have Words display its formatting characters and
    zoom the display in or out. The Zoom function enables you to make smaller fonts
    more readable without changing the document.


    # Inserting some stuff


    You can use the Insert menu to — yes, you guessed it — insert special characters,
    objects, files, and macros. Special characters include various symbols that are
    not part of the normal character set. Objects include graphics, symbols, and figures.
    You can also insert macros and hyperlinks into your Words documents.


    # Formatting the stuff


    You can format Words documents at the character, paragraph, or document level.
    You can format a character''s font, font size, color, and position, as well as
    bold, italics, and strikethrough.


    # Table top


    You can insert tables into documents. You have control over the number of rows
    and columns in a table. Words can automatically adjust the row height, or you
    can do it manually. You can also adjust the overall positioning.


    # Tools talk


    The main function of the Tools menu is to provide access to the spell checker,
    thesaurus, and change bar. The spell checker is self-explanatory, as is the thesaurus.
    The change bar provides a change-tracking mechanism that works at the line level.
    For example, if you change a single character or an entire line, then the change
    bars displays a marker pointing to the line that has changed. This feature could
    be improved to mark changes in color at the character level.'
