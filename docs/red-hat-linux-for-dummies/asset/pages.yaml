    ```


    The echo command echoes whatever follows it on the line. If you type echo Hi there
    and press the Enter key, Hi there appears on the next line. If you type the command
    line echo 5342 and press Enter, 5342 appears on the line.


    But when you type echo * in your reports directory and press Enter, something
    different from * appears on the next line. What appears is the name of every file
    or directory in the reports directory. This happens because the shell sees the
    * as a regular expression and expands it to match every filename or directory
    name in the directory that does not begin with a period. Expanded line then presented
    to the echo command.


    The same thing happens to your shell script or any other shell script that has
    a regular expression passed to it as an argument. The shell — not the command
    or shell script you invoke — expands the regular expression. Because you created
    eight filenames in the reports directory, you know that eight arguments are on
    the line (for the eight names in your directory) and not just the four you printed.'
