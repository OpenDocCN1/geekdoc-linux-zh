  md: '# Chapter 18: Skiing the Web 277


    Message body


    To field Subject field


    ![](img/61222a84312a7aaf1d7bb493d840cde4_304_0.png)


    Figure 18-14: The Compose window for new messages.


    Below the row of icons, near the top of the window, is the To — after you click
    in it — you can type the e-mail address of the person you are trying to reach.
    Just fun, try sending a letter to your own e-mail address. Then if you receive
    it, you''ll know that you did everything correctly. Just follows these steps to
    do:


    +   1. Click in the To field and type your own e-mail address.

    2. Click in the Subject field and type a suitable subject.

    3. Click in the body of the message and type your message.

    4. Click the Send Now icon.


    If you''re sending a message to yourself, it won''t appear instantaneously. It
    still has to travel through the telephone line, be analyzed by the server, and
    be sent back to you, so be patient.


    You can also attach a file, an image, or even a sound to your message and send
