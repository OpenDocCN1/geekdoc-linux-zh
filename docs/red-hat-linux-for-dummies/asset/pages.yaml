    ```


    # The ls Command Doesn''t Show Files in Color


    **Problem:** Using Linux from the Red Hat Linux For Dummies CD-ROM1, you can''t
    get the ls command to show files in color.


    **Solution:** You have to edit the .bashrc file in your home directory to add
    the following line to the end of the file:


    ```

    alias ls=''ls --color=auto''

    ```


    Then log out and back on to re-execute it (assuming you are using the bash shell),
    and ls shows different file types in different colors.


    # Linux Can''t Find a Shell Script (Or a Program)


    **Problem:** You type a command name, but Linux can''t find the command, even
    if it''s in the current directory.


    **Solution:** When you type a shell or binary command name, Linux looks for the
    name in specific places and in a specific order. To find out what directories
    looks in, and in what order, type the following command:


    ```

    echo $PATH

    ```


    You see a stream similar to the following:


    ```

    /bin:/usr/bin:/usr/local/bin

    ```


    These are the directories Linux looks in to find the command, program, or shell
    you want to execute. You might see more directories depending on your distribution
    or how your system administrator (if you have one) set up your system.'
  merge: -1
