  md: '# # Using modemtool (8)


    As mentioned earlier, the modemtool(8) program makes a connection between the
    special device name /dev/modem and the special device name of the serial line
    that the modem is attached to (/dev/ttyS0, /dev/ttyS1, /dev/ttyS2, and so on),
    any programs that need to use the modem do not have to go searching for it. Instead,
    they talk to the /dev/modem device. In this section, we walk you through the modemtool(8)
    program.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_280_0.png)


    Remember when you use a command with a number in parentheses following the command
    name — for example, modemtool(8) — you only type the command name to run the program,
    not the number or parentheses. The number and the parentheses are nomenclature
    to show that it is a Linux program and the documentation for it (if any) resides
    in a particular section — section 8 in the case of modemtool(8).


    To use the modemtool(8) program, follow these steps:


    +   1. Log in root.

    2. Start X if necessary.

    3. Start a terminal emulator window and type `modemtool`.

    4. Use the arrow keys to highlight the line showing the device to which the modem
    is attached.

    5. Use the tab key to highlight the Ok button and press the Enter key.


    # Setting Up the Networking Software


    You need to have a modem connected and have established an account with ISP, but
    that''s not all you have to do. You also need to tell the Linux system that whenever
    you want to connect to the Internet, you really mean that you''re going to do
    the following:


    +   - Execute a program called PPP (Point-to-Point Protocol).

    - Dial your modem to connect to your ISP.

    - Make the connection.

    - Negotiate what speed the modems will talk at.

    - Log on to the ISP''s system, giving your username and password.

    - Start the PPP services on either end, creating an Internet Protocol to flow
    over the serial line.'
