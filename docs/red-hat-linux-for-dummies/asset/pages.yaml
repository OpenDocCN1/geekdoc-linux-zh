    And then change the directory to put yourself in the santa_cruz directory:


    ```

    cd santa_cruz

    ```


    Now create a file under santa_cruz called radman, by using the cat command (see
    the "Using cat to Create and Add to Files" section earlier in this chapter):


    ```

    cat radman

    Once upon a time there lived a handsome prince.

    ^D

    ```


    Now create another file:


    ```

    cat >journals

