    Older monitors can''t handle resolution rates and scan frequencies higher than
    what they were designed for. A monitor designed for a 640 x 480 resolution (and
    a low scan frequency) can''t display a 2,048 x 1,024 resolution (and a high scan
    frequency). More importantly, if you try to make the monitor display of high a
    frequency, it may burst into flames. (Jon did not believe this until he saw a
    monitor smoking.) Modern monitors, called multisync, can automatically match themselves
    to a series of scan frequencies and resolutions. Some of these monitors are smart
    enough to turn themselves off if the frequencies become too high, instead of bursting
    into flames. Finding the documentation and matching your vertical and horizontal
    frequencies properly is the best way to go (particularly with older monitors).
