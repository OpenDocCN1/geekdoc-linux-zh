  md: '# Chapter 15: Gnowing More Graphical Stuff 213


    You can move multiple files by clicking and holding the mouse button and then
    dragging the mouse cursor over the files that you want. The mouse cursor creates
    a rectangular outline and highlights all the files within that box. Next, click
    anywhere within the box and drag the mouse cursor to the desired directory. Release
    the mouse button and the files move to the specified directory.


    # Copying files and directories


    Copying a file or directory is a bit more complicated than moving one. Rather
    than simply clicking an icon and dragging it someplace, you have to right-click
    the file or directory icon and choose from the menu that appears, as shown in
    Figure 15-2. The menu lists all the options available from the File Manager. Choose
    Copy and another dialog window appears. Within that window, you can manually enter
    the pathname of where you want to copy the file, or you can use the Browse function.
    If you choose Browse, yet another window appears, and you can click and go.


    You can copy multiple files and directories in the same manner as you move them.
    You trace a box around the files you want to work with by clicking and dragging
    the mouse cursor (an action called a lasso so). Next, right-click any of the highlighted
    icon names (but not the white space around the icon and names themselves), and
    you get a menu similar to the one you described; this menu has only three options:
    Copy, Move, and Delete. Choose Copy and follow the instructions described in the
    preceding paragraph.


    # Deleting files and directories


    Deleting files and directories is much the same as copying them. You right-click
    the desired file or directory icon, and the same menu appears when you are getting
    copy. Choose Delete and a prompt appears verifying if you really want to delete
    that file or directory. Exercise your normal caution and click Yes you mean it.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_240_0.png)'
