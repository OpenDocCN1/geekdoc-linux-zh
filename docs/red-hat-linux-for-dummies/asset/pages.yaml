  md: 'How critical is a timely correction? Well, in 1997, a problem with TCP/IP (result-
    ing from a deliberate misuse of a program called ping) affected almost every UNIX
    system in the world. D''oh! This problem allowed bad guys to shut down other people''s
    UNIX systems. The world needed a fix — and quickly! A fix for Linux was on the
    Internet four hours after the problem was identified, and people could easily
    get the fix and apply it to their systems. Various commercial UNIX vendors took
    weeks to develop the fix and send it to their customers.


    # Analyzing and solving problems by three-tier client/server


    Whoa! What the heck is three-tier client/server? This large, standoffish term
    simply means that most computer problems can be broken down into three separate
    problems, or tiers, namely:


    +   - Data storage and retrieval

    - Data manipulation

    - Data presentation


    When you break down a problem into these three levels, the problem is typi- cal
    easier to solve and change later as necessary. Until recently, the data presentation
    level consisted of Windows systems running on the desktop (perhaps using Visual
    Basic to develop the interface). The data manipulation level and the data storage
    and retrieval level consisted of UNIX or older sys- tems communicating over the
    network.


    Now, the data presentation level can be a Linux system running a freely developed
    Web browser or Java system (a portable environment for applications). By using
    Linux, some firms can save thousands of dollars on operating system costs and
    yet still retain security and operating robustness.


    Like most UNIX systems, Linux also has sophisticated data manipulation tools that
    make it a good second-tier system. Linux can extract data from several types of
    databases or reports kept in files from older systems, and then sort, search,
    combine, process, and otherwise manipulate the data, passing the newly created
    results to the presentation level on the desktop.


    Finally, Linux has the facilities to act as a good data storage and retrieval
    level. With several commercial database packages work with Linux. If you can''t
    afford a commercial database package, you can use one of the freely available
    ones, such as Postgres.


    The three-tier concept is to work logically, but after you accomplish that, you
    can put all three pieces of functionality on one — a Linux system.'
  merge: -1
