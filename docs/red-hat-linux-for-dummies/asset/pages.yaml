    # # Video


    In character-cell mode, Linux works with all video cards. Therefore, you''ll be

    able to get your system up and running, at a minimum. Likewise, most cards

    work in VGA or SVGA mode, so you''ll be able to have X Window System running-

    n, although it will be a little slow and coarse-grained.'
