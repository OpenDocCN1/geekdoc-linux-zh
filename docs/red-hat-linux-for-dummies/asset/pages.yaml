  md: '# Creating directories


    To create a new directory in Linux, you use the mkdir command (just like in DOS).
    The command looks like this:


    ```

    [maddog@shamet ~]$mkdir newdirectory

    ```


    This command creates a subdirectory under your current or working directory. If
    you want the subdirectory under another directory, change to that directory first
    and then create the new subdirectory.


    Create a new directory called santa_cruz. Go ahead, do it:


    ```

    mkdir santa_cruz

    ```


