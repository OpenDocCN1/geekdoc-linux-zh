    # Viewing partitions


    Before you start creating a partition with fdisk, you need to see what partitions
    (if any) exist. Type p to list the current partition table, which looks a lot
    the one shown in Figure D-4.


    If you keep the Microsoft operating system on your hard disk and used FIPS to
    make your Microsoft operating system partition smaller, you probably have a second
    partition using up all the additional space on the disk. The first thing you have
    to do with fdisk is remove that partition.'
