    In 1984, MIT Project Athena was trying to develop a computer system that could
    deploy over thousands of computers tied together by networking. Bob Scheiller
    (ol MIT) and Jim Getty (ol Digital Equipment Corporation) built on early work
    performed at Stanford University by Brian Reed and Paul Ascent (ol Digital Equipment
    Corporation). Brian and Paul’s work was called W, so course Bob and Jim named
    their work X. This, along with the work of thousands of other people and companies,
    eventually developed X Window System, the graphical interface to the Linux operating
    system as well as many other operating systems.


    More recently, the free GNU people (technically the GNU Project) have introduced
    the GNU Network Model Environment — GNOME. GNOME is a graphical desktop environment
    window manager is easy to work in and modify to your own taste. The Enlightenment
    window is used together with GNOME and X to give you a complete graphical environment.
    Enlightenment provides the “look and feel” for your system. The line between GNOME
    starts and Enlightenment ends can get blurry. To keep things simple, in this book
    the combination of GNOME/Enlightenment is referred to as simply GNOME.


    In this chapter, you find out some basic ways to work in X and GNOME. You start
    by learning some of each system’s basics. Then you mess with the GNOME panel and
    desktop; the panel is similar to the menu bar on a Windows computer. Later, you
    fool around with simple maneuvers, moving'
  merge: -1
