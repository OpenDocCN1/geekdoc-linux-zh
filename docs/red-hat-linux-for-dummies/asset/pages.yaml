  md: '# Considering Character-Cell or Graphical Applications


    Linux applications are available not only as free and nonfree applications, but
    also as character-cell and graphical applications. Character-cell applications
    are textual types of applications in which you type a command and the system responds.
    MS-DOS is an example of a character-cell operating system. (Character-cell applications
    are sometimes referred to as text-based applications.) In a graphical application,
    you use the mouse as well as the keyboard to tell the computer what to do. Microsoft
    Windows is a ubiquitous example of a graphical operating system. The comparison
    is similar to the difference between an all-text book and a picture book — both
    are useful in different ways. Unfortunately, there is no conspiracy with the X
    Files or even the X-Men.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_49_0.png)


    UNIX started as a character-cell operating system and had graphical windows systems
    added to it. Linux inherited both character-cell and graphical features from UNIX.


    You will probably spend most of your time using Linux in its graphical mode. Many
    Linux character-cell applications, however, were created before the age of X Window
    System or simply work better in character-cell mode. In Chapter 10, you can see
    a bunch of applications that work well in character-cell mode.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_49_1.png)


    If you''re using a laptop for short periods of time (to take notes in a meeting,
    for example) and find that the startup time for X Window System and its associated
    programs is too long, you may want to opt for character-cell mode. You can get
    a lot of work done with simple text editors.


    # Manipulating Words with Text Editors


    Linux systems often come with several different text editors. Text editors are
    programs that typically enable you to type and manipulate alphanumeric characters.
    Some text editors can do simple word processing tasks such as word wrap, but they
    can''t perform most word processing functions, such as spell checking or italicizing
    text.


    Text editors are good for simple text editing tasks and for writing simple or
    even complex programs. Most text editors have built-in help functions, and some
    have full-scale documentation built in or available online. In addition, you can
    find books about a few editors, such as vi(1) and emacs(1).'
