  md: '# 96 Part II: Installing Linux


    Then, you need to know the following about your mouse:


    +   - The model number and manufacturer

    - Whether it is a PS/2 bus mouse or a serial mouse


    Again, your system''s documentation should tell you, and often the bottom of the
    mouse offers some basic information.


    A PS/2 mouse usually has a round connector on the end of its wire, or tail. A
    serial mouse usually has an oblong connector with nine holes. All varieties of
    PS/2 bus mice like the same to Linux. Different serial mouse, however, have different
    characteristics. If you have a serial mouse, you need to know its model number
    and manufacturer, whether it emulates some other well-known mouse.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_123_0.png)


    Three-button mouse work best with Linux, but you can get by a two-button mouse.
    To, holding down both buttons at the same time is equivalent to holding down the
    middle button of a three-button mouse, but only if the system is configured correctly.
    You can find out how to configure the mouse in Chapter 6.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_123_1.png)


    Finally, you need to know about your monitor. Most monitor manuals have a table
    at the back with such information as:


    +   - Horizontal sync range

    - Vertical sync range

    - Resolution

    - Whether it is multisync, which means your monitor can run at several resolution
    rates


    ![](img/61222a84312a7aaf1d7bb493d840cde4_123_2.png)


    Older monitors, particularly VGA monitors that came with older systems, often
    aren''t multisync. These monitors can be damaged if you use them at a higher resolution
    than VGA, which is 640 x 480.


    Horizontal and vertical sync range numbers help where to place the dots on the
    screen. The resolution number tells X how many dots can be on the screen horizontally
    and vertically. The 640 x 480 resolution is usually considered to be the worst,
    1,280 x 1,024 is usually considered to be the best for normal use. Strive for
    800 x 600 as a minimum and 1,024 x 768 as an ideal for most systems.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_123_3.png)


    Higher video resolution uses more video memory (which is on the video card) and
    therefore allows fewer simultaneous colors on the screen (for a given amount of
    video memory), and typically shrinks text on the screen, making it harder to see.
    On the other hand, using a higher resolution means that more information can be
