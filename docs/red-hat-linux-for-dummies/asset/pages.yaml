    however, giving the same file two names is useful. In fact, the ln command was
    created for this reason.


    entry in one file system (on one disk partition) cannot point to a file in another
    file system (on another disk partition). To solve this problem, the symbolic link
    was created, in which the directory entry is a full (or relative) pathname to
    the file.


    Unfortunately, the ln command does not work across file systems. In other words,
