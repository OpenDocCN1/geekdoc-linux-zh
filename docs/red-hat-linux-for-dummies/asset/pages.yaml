    # Creating multiple partitions


    Just for grins, in this section, we go back and create multiple partitions on
    the hard disk to illustrate having several partitions just for Linux. First, we
    delete the large partition 2, which we created in the preceding section, by typing
    d and then 2.


    Now look at Figure D-8. We make several partitions on the disk — using the same
    size specification that we went through in the preceding section — but we use
    the size specification for the first two partitions and then use the cylinder
    specification for the last one. We show you all this in one example, just follow
    along with Figure D-8.


    Now we have one DOS partition for our Microsoft operating system and three partitions
    for Linux. Partition 2 is small for Linux, but we wanted to create all four partitions
    on one hard disk, so the 200MB size is used only for illustration. The recommended
    value is 700MB for all the programs on the companion CD2.'
