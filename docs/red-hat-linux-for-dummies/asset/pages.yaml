  md: '# # Red Hat Linux For Dummies Cheat Sheet


    # vi (1) Commands


    +   - `filename`: Invokes vi text editor on the filename file


    +   - `i`: Enter insert mode, inserting before the current position


    +   - `I`: Enter insert mode, inserting at the beginning of the current line


    +   - `a`: Enter insert mode, inserting after the current position


    +   - `A`: Enter insert mode, inserting at the end of the current line


    +   - `<Esc>`: Return from insert mode to command mode


    +   -x`: Delete a character while in command mode


    +   -cw`: Delete the word behind the current position, and put the editor in insert
    mode


    +   -w`: Write out the file


    +   -q`: Quit with no additional writes to the disk


    +   -wq`: Write back the file, and then quit


    +   -q!: Quit the file with pending changes unwritten


    +   /string`: Search forward through the file for string


    +   ?string`: Search backward through the file for string


    +   -n: Find the next string (either forward or backward)


    +   -u: Undo the last command


    # A Few System Administration Commands


    +   - `mount`: Mount a file system, connecting a disk or a floppy disk to the
    tree


    +   - unmount: Unmount a file system, making it ready to be removed from the system


    +   - fsck: File check of the structure and integrity of the specified file system


    +   - mkfs: Put a directory structure on the low-level formatted disk


    +   - shutdown: Shut the system down, instead of waiting for a message to be sent;
    Ctrl+Del does the same thing


    +   - vmstat: Look at the virtual memory


    +   - procinfo: Gather information about processes


    # File Permissions


    | rwxxrxrwx | Read, write, and execute permissions for user, group, and other
    (world) — mode 777 |

    | drwxrxr-x | A directory that is completely open to its owner and that can be
    read and searched by the group and (not search-) by the world — mode 754 |

    | crw-r-- | A character special file that the owner can read or write to and the
    group and the world can only read — mode 644 |

    | brw------- | A block special file: only the owner can read or write to it —
    mode 600 |


