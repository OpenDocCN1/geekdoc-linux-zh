    Or you can use a shortcut with bash by pressing the Tab key after you think you
    have a unique match:


    ```

    [maddog@shamet maddog]$$ more /etc/pass<TAB>

    ```


    The shell automatically expands the name of the file to /etc/passwd and then hesitates
    to ask whether you want to accept the command:


    ```

