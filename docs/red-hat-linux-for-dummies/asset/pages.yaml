  md: '# 310 Part VII: Appendixices


    After you have your system running, review some of the hardware HOWTOs to see
    whether it lists any other hardware that you may want to use in your Linux system.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_337_0.png)


    # Hardware Architectures


    Linux runs on a variety of hardware architectures. These architectures are usually
    defined by the model name of the main CPU''s manufacturer, such as the Intel architecture,
    the Alpha (Compaq) architecture, and the SPARC (Sun) architecture. This book and
    its CD-ROMs cover only the Intel architecture, which includes AMD and Cyrix CPUs
    from the x386 configurations and any Pentium chipium.


    In addition to the hardware architecture of the CPU, you have to consider the
    bus architecture. A bus is made up of electrical paths, wires, and sockets that
    transmit electrical impulses to and from the CPU.


    ISA, EISA, VLB, and PCI buses have been around a long time and are all supported
    in Linux. Recently, the Microchannel bus received support in the Linux kernel,
    but it''s early code, so it may or may not work on your system. Most new systems
    today are PCI-based, with one or two ISA slots for backward compatibility.


    In addition, although AGP is gaining acceptance as a graphics interface to replace
    ISA, EISA, VLB, and PCI as a throughput model for video, the number of video cards
    available for AGP and supported under Linux is still small. You may want to check
    further into compatibility by reading the latest Hardware HOWTO. Or lacking a
    driver for your AGP video card, you can substitute a PCI-based card instead.


    The combination of the CPU architecture and the bus structure could loosely be
    termed the motherboard (often pronounced "mathboard\ If Linux does not work on
    your system, and you suspect that the motherboard is the problem, first check
    with the motherboard''s manufacturer to see whether it has a newer BIOS, which
    is the code that ties the CPU to the bus structure and devices.


    # Laptops


    Laptops and Linux are problematic for a few reasons. First, if you want to use
    an older laptop for Linux, then you probably will have to fight the small hard
    disk. Linux requires at least 40MB of disk space for character-cell support and
    120MB of main memory for X Window System. Second, most older laptops also have
    only 4MB of main memory, with really expensive upgrade paths to more memory (if
    you can find it). Third, to make laptops small'
  merge: -1
