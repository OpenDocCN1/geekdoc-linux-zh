    The number in brackets is the job number, followed by the process ID number. The
    job number is the number that the shell gives the ical program to keep track of
    the ical job. The process ID number is the number that the entire operating system
    uses to keep track of the ical program.


    To find all the programs running under the shell you''re currently using, you
    can use the jobs command, as follows:


    ```

    [maddog@shamet maddog]$ jobs

