  md: '# Chapter 15: Gnowing More Graphical Stuff


    The following views describe the differences between these views:


    +   - **Icons view**: Displays the symbol (icon) and indicates whether an item
    is a file or directory. Regular file icons take several forms, but text and configuration
    files look like pieces of paper with a corner folded, and executable files look
    like pistons. Links, devices, and so on take other forms. Directories take the
    form of a partially open folder. Icons are also evenly placed across the entire
    File Manager screen.

    - **Brief view**: Shows files and directories on individual lines. Directories
    appear as smaller (closed) file folders. Regular files use various characters
    such as asterisks (*) and exclamation points (!) before the filename to represent
    executable files. Text and word processing files, however, use no such characters
    and show only filenames.

    - **Detailed view**: Displays the size and time stamp of each file and directory
    as their names.

    - **Custom view**: Allows you to choose what file attributes to display. You can
    select the attributes by choosing Edit:Preferences and selecting the Custom tab.
    From there, you can add and delete the attributes from a list of possible attributes.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_242_0.png)


    You can reach these same views by clicking the Layout button and then clicking
    the radio buttons for Icon View, Brief View, Detailed View, or Custom View.


    # **Finding files and directories**


    You can search for files and directories using the File Manager''s Find command.
    Choose Commands<Find File. In the File window, enter the directory where you want
    to start your search (your current directory is the default) and the filename
    to look for.


    # **Running programs and scripts**


    GNOME is such a hard worker that happily launches commands for you. Choose Commands<Run
    Command and enter the name of the command in the Enter Command to Run dialog box.
    For instance, the xclock command, and the X clock appears on your desktop.


    # # Viewing Graphics in GNOME


    GNOME comes with a nice, simple graphics viewer called GQView. You start it by
    choosing Main Menu Button<Graphics< GQView. You can see all the usual suspects
    through this guy: TIF, GIF, JPEG, and so on. The graphics files in your current
    directory appear in GQView''s mini-file managers. Just click the graphics image
    that you want to view, and it appears, as shown in Figure 15-4.'
