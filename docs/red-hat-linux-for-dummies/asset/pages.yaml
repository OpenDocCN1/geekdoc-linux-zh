    and 16/32/AWE PnP, Turtle Beach Wavefront (Maui, Tropez), Wave Blaster (and other
    daughterboards), cards based on the ESS Technologies AudioDrive chips (688, 1888),
    MPU-401 MIDI, TEAC speaker/parallel port DAC.


    # Tape Drives


    When backing up your system, using a tape drive is a way to get lot of storage
    on one device (2 or 4GB or even higher). Linux supports most SCSI tape drives.
    Other drives sometimes uses the floppy controller (such as the Colorado FC-10/FC-20,
    Mountain Mach-2, or the omega Tape Controller II) or hook up to the IDE controller
    (Seagate TapeStor 8000 and Conner CTMA 4000 IDE ATAPI Streaming tape drive).


    Note that Linux does not support tape drives that plug into the parallel port.


    # CD-ROM Drives


    You would think that any CD-ROM device would work under Linux, and most do. Early
    CD-ROM drives, however, were usually attached to the sound board and used for
    multimedia instead of high-capacity data drives. Linux ports most SCSI and EIDE
    (ATAPI) CD-ROM drives, particularly the newer ones that read data at 2x, 4x, 6x,
    and up to 40x speeds.


    # CD-Writers


    Many Iustrated singers, photographers, and choreographers out there would love
    to be able to make their own CD-ROMs, filled with music and pictures. Well, you
    can with Linux! Linux supports CD-writers, and a variety of software is available
    to instruct or guide you on how to write-once (WO) CDs. Programs such as cdwrite
    and cdrecord can be used for writing to CD-WO, and a graphical front-end X-CD
    Reader makes the job even easier. The following CD-writers are supported: Grund
    CDR 100 iPW, HP CD-Writer-7100, HP SureStore 420, HP SureStore 60es/1, JVC XR-9210,
    Mitsubishi CDR-225, Mitsumi CDR-2600TE, Olympus CD 6250, Philips CDR-522/2000/3610,
