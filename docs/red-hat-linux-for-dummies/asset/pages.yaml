  md: '# # Chapter 14


    # # Getting to Gnow GNOME and X


    **In This Chapter**


    +   - Introducing the X Window System

    - Introducing GNOME and Enlightenment

    - Configuring GNOME

    - Managing windows

    - Understanding the virtual desktop

    - Closing and killing windows

    - Stopping X

