    # Adding More Disk Storage


    Eventually, you''re likely to want to add more hard disk storage to your Linux
    system to hold more programs, to hold more data, or to enable more users to log
    in. You usually increase disk storage by adding one or more disks at a time; each
    disk can have one or more disk partitions.


    The disk partition is Linux''s basic file storage unit. First, you create the
    file systems on the disk partitions, and then combine the file systems to form
    a single directory tree structure. The directory tree structure can be on one
    disk or spread across many.


    You can define partitions when adding a new disk or some later. In most cases,
    Linux defines disk partitions during the original Linux installation. You may
    divide a disk into one, two, four, or more partitions, each which may contain
    a file system or be used as a swap partition. Swap partitions allow very large
    programs or many small programs to run if they take up more memory than you have
    RAM in your computer. The total of all your swap partitions and RAM is called
    virtual memory.


    After you create a disk partition, you must create a file system. The file system
    occupies a single space on the disk that has a unique block special (device) name.
    This unique name accesses the file system regardless of'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Chapter 12: Managing the Linux File System


    whether the data is stored on all or only part of a physical disk or is an aggre-
    gate of multiple physical disks.


    Linux developers are constantly supporting new file systems. The following file
    system types are the major ones:


    +   - Local: ext, ext2, hpfs

    - NFS: nfs

    - Samba: SMB

    - CD-ROM: iso9660

    - DOS: msdos, umsdos, vfat

    - Other: sysv and minix


    If you want to add one of these types of file systems, you have to make a new
    partition, which may mean adding a new disk drive, which just so happens to be
    the subject of the next section.


    # Adding a Disk Drive


    The first step to increasing your disk space is to add a new disk drive. The following
    tasks are required to add a disk to your system (regardless of whether the disk
    is SCSI or IDE) and make it accessible to users:


    +   - Attach the disk drive to your computer system.

    - Provide a suitable device driver for the disk''s controller in Linux. Completing
    this task may mean rebuilding the kernel of the Linux operating system (see Chapter
    14 for details).

    - Define at least one partition.

    - Create the block special files for the partition(s).

    - Create a Linux file system(s) on any partition(s) to be used for user files.

    - Enter the new file systems into /etc/fstab, the configuration file.

    - Mount the file systems (you may have to make a directory for a mount point).


    The following sections guide you through the process of configuring a hard disk,
    a floppy drive, and a CD-ROM drive after they are physically installed.'
