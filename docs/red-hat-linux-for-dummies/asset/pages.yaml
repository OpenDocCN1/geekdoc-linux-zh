    ```


    In this example, we used the d option of the ls to tell the command that we wanted
    to see the directory as if it were the only file in the directory. If we had not
    used the d option, we would have seen every file in the plot directory, along
    with the directory itself.


    +   - Special files represent either hardware devices (such as a disk drive, a
    tape drive, or a keyboard) or some type of placeholder that the operating system
    uses. The /dev directory holds many of these special files. You can see this directory
    by typing the following:


    ```

    ls -l /dev

    ```


    +   - Executable files contain instructions (usually called programs, or scripts).
    When you type the name of one of these files, you''re telling the operating system
    to execute the instructions. Some executable files look like gibberish, and others
    look like long lists of computer commands. A lot of these executable files are
    located in /bin, /usr/bin, /sbin, and /usr/sbin.


    # Understanding files and directories


    You can think of the Linux file system as one huge file folder that contains files
    and other file folders, which in turn contain files and other file folders, which
    in turn contain files ... well, you get the point. In fact, the Linux file system
    is generally organized this way. One big directory contains files and directories,
    and all the other directories in turn contain files and directories, and so on.


    # Directories and subdirectories


    A directory contained, or nested, in another directory is called a subdirectory.
    For example, the directory called /mother may contain a subdirectory called /child.
    The relationship between the two is referred to as parent and child. The full
    name of the subdirectory is /mother/child, which would make a good place to keep
    a file containing information about a family reunion. It could be called /mother/child/reunion.'
