  md: '# Chapter 6: Installation: Crossing the Finish Line


    # Getting in the print queue


    When you print a file, it doesn''t go directly to the printer. Instead, it goes
    to an area called a *print queue*. The printer then prints the files waiting in
    the queue, in the order which they arrived at the queue. In this way, one program
    doesn''t have to wait for the printer to stop before giving the command to print
    a file. In addition, the queue allows multiple programs to print to the same printer
    at the same time, without having to wait for the physical printer to become idle.


    Each printer in your system needs a queue name and a place to put the queue. This
    place is called the *spool directory*. You enters this information in the dialog
    box shown in Figure 6-9.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_120_0.png)


    Figure 6-12: Verifying your printer information.


    <Tab><Alt-Tab> between elements | <Space> selects | F12: next screen


    # You''re Done!


    Tada! You''re finished with the installation. Not unsurprisingly, the Done dialog
    box appears.


    Follow these steps to start your system:


    +   1. All that''s left to do is select Ok.


    +   After the system reboots, remove the CD and the floppy disk. Otherwise, you''ll
    be faced with going through the entire installation process again. There''s no
    need to groan — you can always re-reboot and then remove the pesky crickets.


    +   Your system reboots, and you can start Linux.


    +   2. When you see the *LILO boot:* prompt, press the Tab key.'
