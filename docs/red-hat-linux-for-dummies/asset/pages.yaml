  md: 'Continuing with your report, you want some type of header that states the subject
    of the report and the date. You can use the echo command (for the header) and
    the date command (for the date):


    ```

    echo Report of login names and users on the Linux system

    date

    echo ====================================

    cut -f 1,5 -d ; /etc/passwd | sed -e ''s/:/ - /''

    ```


    These four lines are not difficult to type, but having to remember them and retype
    them each time you run the report is a nuisance. We like to save time whenever
    we can, and our memory cells seem to be dropping like...ah, we forget. For these
    reasons, we want to use our favorite text editor to type the lines in a file.


    Our favorite editor is vi. If you want to use another editor, we won''t stop you.
    But be sure to name your file quagmire so that the rest of the example will work.


    In the following example, we used vi to edit a file named quagmire, entering the
    commands that we used before that file:


    ```

    [maddog@shamet maddog]$ vi quagmire

    a

    echo Report of login names and users on the Linux system

    date

    echo ====================================

    cut -f 1,5 -d ; /etc/passwd | sed -e ''s/:/ - /''

    <ESC>

    :wq

    ```


    The last line, :wq, writes the file to the disk and quits the editor.


    Now you must tell Linux that executing the file is okay. To do this, you have
    to change the file permissions to execute:


    ```

    chmod ugo+x,ugo+r quagmire

    ```


    For more permissions, check Chapter 9.


    Your quagmire file was probably created with the owner''s (u), the group''s (g),
    and the rest of the world''s (o) permissions of at least read (r), if not read
    and write (w). The owner (that''s you), the people in the group, and the rest
    of the world should be able to read (r) and execute (x) the shell file, or shell
    script.


    Just because a shell can read does not mean that it can be executed. You must
    explicitly tell the system that executing it is okay.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_182_0.png)


