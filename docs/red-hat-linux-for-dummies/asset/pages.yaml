  md: '# Appendix D: Making Life Difficult with fdisk 345


    +   1. Type p.

    This command displays the partition table and enables you to choose which partition
    you want to make a swap partition.


    +   2. Type t.

    The t command tells fdisk that you want to change the type of a partition.


    +   3. Type the number of the partition you want to change.

    In this example, we typed 3.


    +   4. Type l to list the file codes, if you want.


    +   5. Type the numerical code that represents the file system/partition type
    that you want to.

    Because we want a swap partition, we typed 82.

    Remember to write down which partitions (such as /dev/hda2 or /dev/sdb3) are used
    for file systems (such as /usr /tmp) as you create the partitions and you select
    the partitions later for various file types because most of the other file systems
    can remain as Linux native.


    +   6. Type p to display the partition table and review the results.


    +   7. If you want to define more swap partitions, repeat Steps 2 through 6.

    At this point, however, you may be finished with changing file system types because
    most of the other file systems can remain as Linux native.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_372_0.png)


    # Changing the boot designation


    You need tweak the disk one more time before you go on with the installation.
    You need to set at least one partition as the partition for the computer to boot.
    Normally, this is the first partition. Sometimes, the first partition is already
    set to boot; look at the second column of the partition table and see whether
    an asterisk (*) appears in the boot column. If it does, you can go to the next
    section.


    If no asterisk appears in that column, or if an asterisk is on a disk partition
    other than partition I, you have to change it. In the example in Figure D-11,
    we first negated, or cleared, the boot designator for partition 1, just to show
    you that you use the same steps to clear or set a boot designator.'
  merge: -1
