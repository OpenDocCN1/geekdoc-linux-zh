  md: '# # Chapter 17


    # # Setting Up Your Internet Connection


    **In This Chapter**


    +   - Finding an Internet service provider

    - Connecting with your modem

    - Making the connection between your modem and Internet service provider

    - Starting and stopping the Internet service software

    - Creating a simple but effective firewall


    One of the things to do these days is to ski the Net. You connect to the Internet
    and tie up your phone line for hours, looking for obscure information and sending
    e-mail to people you barely know and never speak to the phone.


    Now you, too, can go to a party and drop the casual phrase "I found this while
    skiing the Net afternoon ... [which will draw bored looks] ... on my Linux system."
    The mention of Linux immediately shows that you are truly a person of class and
    standing in the Internet community.


    First, though, you have to find a good Internet service provider (ISP), hook up
    your phone to the computer (using a device called a modem), and feed a few simple
    commands to your Linux system (and the networking gods) to make the connection.


    # # Locating Your ISP?


    We categorize Internet service providers into those that specialize only in Windows
    and Windows NT products and those that are good. By good, we mean ISPs that can
    handle UNIX and Linux accounts.


    To find a good ISP, first look in your local Yellow Pages under Internet or Internet
    Service Providers. List the names and telephone numbers of any ISPs'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 248 Part V: Going Online


    that you find. These companies are probably local companies, which is fine if
    you want to communicate only from your home. If you do a lot of traveling, you
    may want to call the following national providers:


    AT&T WorldNet: 800-967-5363

    IBM Global Network: 800-426-5968

    CompuServe: 800-336-6823


    Next, talk to some friends who live close to you and ask them which ISP they use
    and what they think of the service. If a service has overused local access numbers,
    you get busy signals a lot. Also, ask about the technical help, which in some
    services is poor or nonexistent.


    Finally, call the ISPs and tell them you have a Linux system and are interested
    in PPP (which stands for point-to-point protocol) services, with e-mail and newsgroups.
    Find out whether they have access numbers in your local calling area. Otherwise,
    you will end up making a long-distance call each time you connect. Check their
    prices and whether they have unlimited service (a flat rate no matter how many
    hours you''re logged on). A typical price for unlimited service is $20 to $30
    per month.


    ISPs that host Web pages are a plus, as are ISPs that can filter junk e-mail,
    or spam. Also find out how and what kind of service they provide. Most ISPs are
    small to medium-sized organizations and cannot afford to staff their lines 24
    hours a day, 7 days a week. However many small ISPs are owned and run by technical
    people who monitor their systems for what like 24 hours a day. They are often
    logged on at home and periodically monitor their e-mail—a good indicator is if
    they have a generic email address such as help@disp.com. If you get lucky or do
    your homework, you''ll connect with one of these ISPs (South Cyberport in Albuquerque,
    NM is also such place) and get excellent help.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_275_0.png)


    Now is a good time to verify that your phone service is billed at a flat rate
    and not metered.


    # The Polish connection


    A young friend of Jon''s from Poland came to visit him. He had obtained a nationwide
    ISP service to keep in touch through the Internet with family and friends back
    home. Unfortunately, the closest number to his ISP connection site was a long-distance
    call from Jon''s house. Jon cautioned him to keep his connection time down so


    that he wouldn''t have a lot of long-distance charges. He assured Jon that he
    would. The month after he went back to Poland, Jon received his phone bill—with
    $70 in long-distance telephone charges to his friend''s Internet provider. He
    Antoni!'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Chapter 17: Setting Up Your Internet Connection 249


    Tell the ISP the highest speed of your modem. Any ISP worth its salt handles 56
    Kbps modems. You''ll probably need to supply a login name and a password for the
    ISP''s server, so you may want to have these written down ahead of time.


    After you choose your ISP and arrange payment, the service provides you with certain
    pieces of information, including the following:


    +   * Telephone access numbers

    * A username (usually the one you wanted)

    * A password (usually the one you supplied)

    * An e-mail address, which is typically your username added to the ISP''s domain
    name

    * A primary Domain Name Server (DNS) number, which is a large number separated
    by periods into four groups of digits

    * A secondary Domain Name Server (DNS) number, which is another number separated
    by periods into four groups of digits

    * An SMTP (mail) server name

    * An NNTP (news) server name

    * A POP3 or IMAP4 server name, which is used to download e-mail from the ISP''s
    server to your machine


    The ISP may also give you software on a CD-ROM or a floppy to help you get your
    account working, but this software probably works only with Microsoft operating
    systems. That''s okay, because your Linux distribution has more than enough software
    to use with the Internet and to help you get your account working.


    # Connecting Your Modem


    To use Linux with the Internet, you must have at least one of these devices:


    +   * A serial modem (just a regular modem)

    * An ISDN line

    * A high-speed (broadband) connector of some type (such as Ethernet, FDDI, a cable
    modem, DSL, ADSL, or ATM if you''re one of the lucky soles to be blessed with
    such service. US West, where are you?)


    For the second and third, or someone you know (your boss, your systems administrator,
    or your 10-year-old) probably arranged for you to get the connection and set up
    your computer for it. The serial modem is a device that you may have chosen yourself,
    or it may come with your'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'computer, in which case you may have little knowledge of how to use it with
    Linux. For the rest of this chapter, we assume that you''re connecting to the
    Internet by using a serial modem and a telephone line.


    Modems, quite simply, do three main functions:


    +   - Convert digital information into tones that travel across telephone lines
    (and vice versa)

    - Dial the telephone number that you want to reach and make the connection with
    a modem at the other end

    - Negotiate with the modem at the other end about what speed to use when sending
    bits of information


    # Sorting through modems


    Modems can be either internal or external. An external modem stays in its own
    little box and usually plugs into a wall outlet for power, into the telephone
    line for the connection, and into a serial connector on the back of your computer.
    An internal modem is usually plugged into a slot on the motherboard inside the
    computer case. (Some internal modems are built directly onto the motherboard.)
    To the computer and operating system, an internal modem appears as if it were
    two or more serial ports. Internal modems draw their power from the computer system,
    and they plug into the phone jack.


    Usually internal modems are less expensive than their external counterparts, but
    some people like external modems because they can hook them up to different computer
    systems by simply unplugging the serial line from one system box and plugging
    it into another.


    A third type of serial line modem is a PCMCIA card (sometimes called a PC card).
    These cards are used often with laptop computers.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_277_0.png)


    Avoid WinModems. These are designed for Windows only. They''re cheaper than regular
    modems because they''re lazy (or smart depending on how you look at it) and depend
    on the Windows operating system to do how much of their work for them. As of this
    writing — as far as we are aware — no Linux drivers exist for such modems.


    # Finding the serial line


    After you connect your modem, you have to tell Linux which serial line (or simulated
    serial line) the modem is connected to. If you have Windows 95 on your system,
    you can see which port or COM line the modem is connected to as follows:'
  merge: -1
