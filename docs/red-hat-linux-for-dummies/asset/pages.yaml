    # Moving On to More Flexible Shell Scripts


    The program in the previous section always works on the same file, which is hard-coded
    into the script. For the rest of this chapter, we show you how to create more
    flexible shell scripts, ones that can generate different filenames as needed and
    automatically adapt to running on different dates.


    Suppose you want to keep monthly copies of the passwd file and see the differences
    between those copies. First, write a program that saves a copy of the passwd file
    and stores it in a directory.


