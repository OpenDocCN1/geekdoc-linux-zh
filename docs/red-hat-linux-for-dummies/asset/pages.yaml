  md: '# Chapter 7: Configuring and Fixing X


    shutdown is a Linux command. Some commands have options, flags, that provide additional
    information about what the command should do. -h means to halt the system after
    it shuts down, rather than reboot. r means to start rebooting after shutdown.
    n means to start the process of shutting down immediately. Without the now, the
    shutdown command would hesitate and sending messages to people still working on
    the system, telling them that the system is to be turned off.


    One other method of rebooting the system is the infamous three-finger salute that
    all Microsoft users know: Ctrl-Alt+Delete. The three-finger salute simply sends
    a shutdown now command to Linux, and the result is the same as if you had typed
    this command.


    As a Linux user, rebooting the system will be an infrequent occurrence. Because
    the login provides a Linux system with the necessary security, you don''t need
    to shut down between sessions. If Linux is stable, it does not freeze often, as
    do some other PC-based operating systems. If you have multiple operating systems
    on the same machine, however, rebooting takes you back to the LILO prompt (or
    the System Commander, or some other booting program) to allow you to boot another
    operating system.


    # Delving deep into color depth


    Color depth — the number of colors your system can have active on the screen at
    one time — is loosely a function of the amount of video memory your system has
    and the screen resolution.


    If your system has a small amount of memory (such as 1MB), your screen can have
    a resolution of 1,024 x 768 pixels (dots) with 256 colors (8 bits) on the screen
    at one time. If your system has 2MB, you can have 64K colors (16 bits) on the
    screen at the same time as your resolution. If you have an older video board with
    a small amount of video memory but some additional video memory sockets, you may
    be able to upgrade the amount of video memory on the video card.


    If you have only 1MB and want to see 64 colors on the screen at one time, you
    can reduce your resolution from 1,024 x 768 to 800 x 600 pixels. If you want true
    color (24 bits), you can set your resolution to 640 x 480 pixels. The picture
    that you


    you''re viewing will take up more of the screen, but color depth versus resolution
    is a trade-off that you can make by choosing the right options.


    When you want to display an image and the color depth is not correct, not drastic
    changes. The picture may look a little lackluster or not quite normal. X has an
    interesting capability to have virtual maps, which allow the window to utilize
    all of the bits of color depth, even if other windows are using different colors.
    When this option is turned on (as it is with Red Hat distribution on CD11), the
    various windows add odd colors as your mouse moves from window to window, the
    window that your mouse activates is the best color available. With newer video
    cards and larger video memories, which allow true color at high resolutions in
    window, this option is less useful.'
