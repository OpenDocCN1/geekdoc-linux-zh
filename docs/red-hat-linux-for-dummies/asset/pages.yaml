  md: '# Chapter 4


    # # Move Over Windows:

    Finding Space for Linux


    **In This Chapter**


    +   - Finding out what you need to install from the accompanying CD-ROM (CD1)

    - Creating a boot disk

    - Squeezing Linux onto your hard disk


    After you''re familiar with the hardware in your system, you''re finally ready
    to open your distribution. (Unless you''re the impatient type like us and have
    already ripped it from its packaging like a child the night before Christmas.)
    If you haven''t identified your hardware yet, take a look at Chapter 3. This chapter
    describes how to install Red Hat Linux, which you can find on the first accompanying
    CD-ROM (CD1).


    # ## Installing Linux from a CD-ROM


    The easiest way to install Linux is on a system with a CD-ROM drive (especially
    an ATAPI/IDE or SCSI CD-ROM). First, you must create a boot floppy from files
    on CD1 that comes with this. The boot floppy is necessary to get the Red Hat installation
    process started. If you need to use a PCMCIA card for a CD-ROM controller to install
    Linux, you have to make the PCMCIA version of the boot floppy, which is also on
    CD1.


    The follow sections delve into the exciting details of creating boot floppy.


    # ## Creating a boot disk in Windows


    If you have a Windows 3.1, 95, 98, or NT system, then you can use your system
    to read CD1 as well as create your boot floppy. CD1 includes a program called
    RAWWRITE.EXE, which you can use to make the floppies while you''re running Windows.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# 52


    # Part II: Installing Linux


    ![](img/61222a84312a7aaf1d7bb493d840cde4_79_0.png)


    In the following instructions, we assume that your CD-ROM is drive D and your
    floppy drive is A. If your drive letters are different, substitute the appropriate
    letters for D and A.


    Follow these steps to create a boot floppy:


    +   1. Make sure that you have a formatted, high-density (1.44MB) 3½-inch floppy.

    2. Insert CD1 into your CD-ROM drive.

    3. Change the directory on the CD-ROM drive or other hard drive where RAWWRITE.EXE
    is stored, and follow along by entering the following code after each prompt:


    ```

    C:\ D:

    D:\> dosutils

    D:\DOSUTILS\> write

    Enter diskette image source file name: d:\images\boot.img

    Enter target diskette drive: a:

    Please insert a formatted diskette into drive A; and

    press -ENTER- : <Enter>

    D:\DOSUTILS>

    ```


    RAWWRITE copies the boot image to the floppy. That floppy can boot (start up)
    your computer and also begin the Red Hat installation process.


    If you need to install Red Hat Linux over a network — if, for instance, your PC
    or notebook does not have a CD-ROM drive but another computer on the network —
    then you need to create a different boot disk. Using the BOOT.IMG file, you should
    use either the BONET.IMG or PCMCIA.IMG disk. The former is when you have a computer
    with Ethernet connection, whereas the latter is typically used for notebooks with
    PCMCIA-type Ethers. Installing via a network is an advanced process and is not
    within the scope of this book. However, knowing that such methods exist is useful.


    +   4. Remove the boot floppy and then label it Boot Floppy so you know what it
    is.


    Now you can use the RAWWRITE program again to copy the rescue image to the other
    blank disk to create the rescue disk. You can use the rescue disk to boot your
    computer in case something gets misconfigured or fails.


    The floppy disk that you created (the boot disk) is a normal MS-DOS file system
    containing boot images and messages. You can list the directory of the floppy
    disk that you made with MS-DOS.'
