  md: '# A Note from the Author


    Red Hat Linux For Dummies is an updated edition of the bestselling Linux for Dummies
    , Second Edition, Red Hat Linux For Dummies builds on, the outstanding content
    of the original Linux For Dummies, Second Edition, and features coverage of the
    latest Linux distribution from Red Hat (a distribution is the Linux operating
    system, plus many additional programs and utilities).


    The newest version of Red Hat Linux, Red Hat Linux 6.1, has improved installation
    features and includes new drivers for video adapters, monitors, printers, and
    more.


    The GNOME desktop environment (similar to the Windows Explorer interface) is now
    included in the Red Hat distribution, GNOME provides an intuitive, user-friendly
    graphical interface, plus file managers and many other utilities as standard equipment.
    The Windows 95/98/NT user should feel right at home in this environment.


    The Appliquware desktop productivity suite is also introduced. This software provides
    you with all of the capability needed to get your word processing, spreadsheet,
    presentation, and other work done. In fact, much of this book was written using
    Appliquware Words. Instructions are given for downloading a free demonstration
    version of Appliquware. From that point, the major Appliquware Words features
    are described.


    Additionally, a simple firewall script is provided to help make your Linux computer
    safe. The script makes use of the newest Linux firewall software called iptchains.
    Instructions are provided to help you build the firewall easily and quickly.


    Enjoy Red Hat Linux For Dummies!


    Paul G. Sury'
