    # Familiarizing yourself with character-cell UNIX editors


    ed(1) is the oldest UNIX character-cell text editor and comes with every UNIX
    system. Because ed(1) doesn''t normally show you the entire file and it doesn''t
    show you the changes you''ve made until you ask it to do so, it may be difficult
