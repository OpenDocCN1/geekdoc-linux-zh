  md: '# Chapter 4: Move Over Windows: Finding Space for Linux


    ![](img/61222a84312a7aaf1d7bb493d840cde4_82_0.png)


    You use an MS-DOS utility FIPS (which is a clone of FDISK) to nondestructively
    resize your DOS partitions. FIPS is included on the accompanying CD-ROM (CD1)
    and on all Linux distributions. We suggest that you read the documentation in
    the fipsdocs subdirectory on CD1 before you use the FIPS utility.


    Although FIPS is supposed to be nondestructive, make sure that you always back
    up your system before using it.


    Newer versions of Windows 95/98 have a 32-bit file allocation table (FAT) and
    drive management that provide for single-disk configurations larger than 2GB.
    Older versions of Windows 95 had a 16-bit FAT; to use the space above 2GB, the
    drive had to be partitioned into logical drives of 2GB or less. New computers
    have drives larger than the 2GB limit. If the drive is partitioned, the large
    drive management system is disabled, and DOS and Windows partitions are again
    limited to 2GB.


    The FIPS utility works by dividing the drive into two partitions. The first one
    is the DOS partition. The second one, beginning at the end of the space used by
    DOS and Windows software and encompassing the rest of the drive space, is the
    non-DOS partition where Linux loads. If you want to use the FIPS utility to partition
    your drive, keep in mind that your new DOS partition can hold only 2GB or less.
    If the amount of used space on your C partition is greater than 2GB, you won''t
    be able to nondestructively repartition unless unless you delete some files or
    move them to another disk.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_82_1.png)


    The problem with older computers is the BIOS doesn''t recognize computers over
    a certain size (such as 400MB), and hard disk makers have used software overlays
    to trick the BIOS into recognizing the entire disk. You may be risking the loss
    of all your data by using a utility like FIPS (or even a commercial package like
    PartitionMagic) on an extra hard drive with these software overlays, so be careful!


    The following two sections on nondestructive partitioning consist of steps to
    defragment the disk and to use FIPS to carve the disk into segments.


    # Defragmenting your disk


    The process of defragmenting a disk simply moves all the data to the front of
    the disk segment, leaving the empty space behind for Linux. Follow the steps that
    apply to your system partition by running the defragmentation program.


    In Windows 3.1 and MS-DOS:


    +   1. Close all programs and windows on your system.

    2. If you''re running Windows 3.1, exit from Windows into MS-DOS.

    To do so, go to the Program Manager window, choose File: Exit Windows, and allow
    Windows 3.1 to exit as gracefully as it can.'
