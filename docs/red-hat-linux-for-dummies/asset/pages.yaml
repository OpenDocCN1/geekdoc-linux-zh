  md: '# Chapter 9


    # Filing Your Life Away


    In This Chapter


    +   - Discovering the ins and outs of files and directories

    - Finding your way through the Linux file system

    - Changing where you are in the Linux file system

    - Creating, moving, copying, and destroying directories and files

    - Giving permissions and taking them away


    In this chapter, you take your first steps through the Linux directory structure.
    We introduce you to file types, subdirectories, and the root directory, as well
    as show you the way home — to your home directory.


    Next, you discover that you don''t need a map to find your way through the Linux
    file system; a few commands do the trick. Then, after you''re oriented with the
    file system, you''re ready to make some changes. You find out how to copy and
    move files and directories, as well as how to create and destroy them. We also
    detail the process of changing a file''s ownership and permissions.


    # Getting Linux File Facts Straight


    Linux files are similar to DOS, Windows, and Macintosh files — and a lot like
    UNIX files. Follow the bouncing prompt as we make short work of long files.


    # Storing files


    A file is a collection of information with a distinct identification made up of
    a filename and a location (called a directory path) where the file is kept. Linux
    can store many files in the same directory — as long as the files have different
    names. Linux can also store files with the same name in different directories.'
