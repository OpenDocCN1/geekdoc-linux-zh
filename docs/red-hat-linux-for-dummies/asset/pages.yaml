  md: '# 284 Part VI: The Part of Tens


    You can find out if a Linux user group is in your area by checking with GLUE (Groups
    of Linux Users Everywhere), which is a service run by SSC (the publishers of the
    Linux Journal). GLUE is an automated map of user groups, and you can find it at
    the following address:


    ```

    www.SSC.com

    ```


    When you arrive at the site, click the Resources link, which takes you to the
    Linux Journal site. Then check out the Resources area there to find out the user
    group closest to you meets.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_311_0.png)


    No group in your area? Post a message at local University or community college
    saying that you want to start one; then, perhaps, other people in your area will
    join you. Terrified at the thought of starting a user group? Group leaders often
    are not the most technically knowledgeable members but are simply good planners.
    They organize the meeting space, find (hound) speakers, send out meeting notices,
    locate sponsors, arrange refreshments (beer), and perform other organizational
    tasks. Sometimes being the leader is a thankless job, but when a meeting goes
    really well, it makes all the work worthwhile. So, as a newbie to Linux, you may
    not know a grep(1) from an awk(1), but you may still make a very good chairperson.


    # Bring in the Cavalry


    Some people will be able to hire people to manage or fix their systems. This is
    what the commercial world calls support. Often, the place where you bought your
    computer whether it''s a store, a value-added reseller (VAR), or the manufacturer
    — provides the support.


    Linux is criticized for not providing that same level of support. Although the
    number of hardware vendors that offers support is low, more and more people are
    well-versed in using Linux and are willing to offer some level of support, whether
    it by e-mail, telephone, or on-site services.


    The first group of people that offers support is the distribution makers. Red
    Hat Software, Inc.; Caldera, Inc.; SSE and others sell support contracts for their
    Linux distributions. These contracts range from e-mail support to telephone support.
    Red Hat recently introduced round-clock support for a reasonable fee. Check out
    Red Hat''s Web page (www.redhat.com) for more details.


    Another group of people offering support is resellers of Linux systems. These
    people typically install Linux on hardware that you purchase from them. They will
    repair your system when it breaks and help you with knotty problems (all with
    a fee).


    The final group of people who offer support is the independent consultants who
    learned about Linux and are now in the business of offering'
