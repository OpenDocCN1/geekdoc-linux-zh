  md: '# # Chapter 13

    # Revving Up the RPM


    +   **In This Chapter**

    * Introducing RPM

    * Finding out how RPM works

    * Installing, updating, removing, querying, and verifying software with RPM

    * Comparing RPM to tar


    This chapter introduces the Red Hat Package Manager (RPM). Red Hat developed RPM
    in conjunction with Caldera Systems. It provides a mechanism for installing, updating,
    and removing software automatically. Without RPM, Linux would not be where it
    is today and is a big reason why Red Hat is the de facto Linux distribution leader.


    # ## Introducing RPM


    One of the primary systems that sets the Red Hat Linux distribution apart is its
    Red Hat Package Manager (RPM). When Linux distributors such as Red Hat create
    a system like RPM, they provide value to their customers and make Open Source
    software profitable. Some of the first Linux systems required the user to install
    all software via the tape archive system (tar), which was a bear to modify. RPM,
    on the other hand, accelerates like crazy as you wind out its engine, and yet
    is quite easy to manage.


    All the software that was installed during the Red Hat installation process is
    stored in RPM form. The /mnt/cdrom/RedHat/RPMS directory contains all the RPM
    packages. You can also install, update, or uninstall software. As of this writing,
    RPM is the most popular system for installing, modifying, and transporting Linux
    software.'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'The package-management concept has been around for quite a while, with all
    the major UNIX vendors supplying their own systems. The idea is to distribute
    software in a single package and have a package manager do the work of installing
    or uninstalling, and managing the individual files. The Linux world has benefited
    greatly from this system that simplifies software distribution.


    # # Taking a Look at What RPM Does


    RPM performs three basic functions: installing, upgrading, and removing packages.
    In addition to these functions, it can also find out all sorts of information
    about installed and yet-to-be-installed packages (and also washes windows). Here
    is a brief rundown of each:


    +   - **Installing packages.** RPM installs packages. Software systems such as
    Netscape Communicator have all files of types that must be put into locations
    to work properly. For instance, under Red Hat, some of the Netscape files need
    to go into the /usr/bin directory. RPM does this automatically. Not only does
    RPM install files into their proper directories, but it also does such as creating
    directories and run scripts to do the things that need to be done.


    +   - **Upgrading packages.** RPM can update existing packages for you. Gone are
    the days when updating a system was worse than going to the dentist. RPM keeps
    track — in a database of its own — of all the packages that you have installed.
    RPM does all of the bookkeeping chores and replaces only the files that need replacing.
    It also saves configuration files that it replaces.


    +   - **Removing packages.** The package database that the RPM keeps is also useful
    in removing packages. RPM goes to each file and removes it. It also removes —
    when no files from other packages occupy — that belong to the package.


    +   - **Querying packages and files.** RPM can give you a great deal of information
    about a package and its files. You can use the query function to find out the
    function of a package and what files belong to it. It can also work on the RPM
    packages themselves, regardless of whether they have been installed.


    +   - **Verifying packages.** Installed packages can be validated. RPM can check
    an installed package against a checksum (a computed fingerprint) to see if and
    how it has been changed. This feature is very useful for security reasons. If
    you suspect that a file or system has been hacked, you can use RPM to find out
    how it has changed.


    Enough car. The following sections describe using RPM.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# # Installing a RPM package


    When you install your Red Hat Linux system, all the software that is copied to
    your hard disk comes from RPM packages. When you want to add additional software
    from the CD1 or a Red Hat mirror (www.redhat.com/mirrors.html), you can do so
    by using the rpm command; a mirror is a Web or FTP site where an exact image of
    a central software distribution is kept. If you want to add the HTML-based HOWTO
    documents, then log in as root and mount the CD-ROM and the package, as follows:


    ```

    mount -r itso9660 /dev/hdc /mnt/cdrom

    rpm -ivh /mnt/cdrom/RedHat/RPMS/howto-html*

    ```


    The i parameter tells rpm to install the RPM package, the v tells it to be verbose,
    and the h creates a simple progress meter. After this process is complete, you
    can view the documents with your browser.


    Sometimes forcing the installation of a package is necessary. Sometimes the RPM
    database that keeps track of installed packages can become corrupted and refuse
    to install a package for you. The following command forces the installation of
    a package:


    ```

    rpm -ivh --force /mnt/cdrom/RedHat/RPMS/

    ```


    # # Updating a RPM package


    When you obtain a newer version of a Linux package, you may want to update your
    existing software. The update function is a way of doing so. To upgrade Samba,
    for instance, simply enter this command:


    ```

    rpm -U samba*

    ```


    Sometimes RPM balks at installing or upgrading a package. Typically, RPM looks
    at an installed package and decides that you aren''t allowed to install the same,
    or older package, over it. You can override RPM and force it to install or upgrade
    a package using the--force parameter:


    ```

    rpm -U --force samba*

    ```


    # # Removing a RPM package


    You can remove a package by using the erase function (-e):


    ```

    rpm -e samba

    ```'
