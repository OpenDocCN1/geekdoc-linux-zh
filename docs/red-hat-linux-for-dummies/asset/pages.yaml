  md: '# Part I: Introducing Linux


    # Connecting to an Internet gateway


    Linux is a great tool for connecting your home or business network to the Internet.
    Software is available (such as dial, which is not on either of the accompanying
    CD-ROMs but can be downloaded from any Red Hat mirror) that automatically connects
    your Linux computer, and thus your private network, to the Internet whenever necessary.
    This gives your private network a permanent, virtual connection for the price
    of a single phone line.


    # Building a firewall


    Linux can also provide protection from the bad guys on the Internet by acting
    as a firewall. A firewall is a system that controls your private network from
    any outside network (in this case, the Internet), and also used to control access
    from your private network to the outside world. Linux is very flexible in regard
    and several packages are available. One of the most popular and simple to use
    is the ipchain filtering software, which is included on the accompanying CD-ROM
    (CD1). Instructions on how to create firewalls are beyond the scope of this book,
    however.


    For instructions on building a firewall, please check out Linux Network Toolkit
    or Red Linux for Small Business, both by Paul Sery; and The Linux Network, by
    Butzen and Hilton (all published by IDG Books Worldwide, Inc.).


    # Providing Internet/intranet services


    Many capabilities of the Internet (outside of a single business) and intranets
    (internal to a single business) are possible because of HTML and the World Wide
    Web. UNIX systems were at the forefront of these developments, and Linux shares
    many benefits of that heritage. Both the Internet and intranets require similar
    services, such as:


    +   * Firewalls to keep the bad guys out

    * FTP to help the good guys get files and software

    * Telnet to support users in logging on and using their machines remotely

    * Web servers to aid users in seeing Web pages

    * Samba and NFS to share files over the network


    Many ISPs use Linux to deliver these services to their customers, not just because
    Linux is free but also the source for the entire operating system is also available.
    When a problem arises, ISPs can correct it quickly rather than wait for a commercial
    software vendor to correct the problem.'
