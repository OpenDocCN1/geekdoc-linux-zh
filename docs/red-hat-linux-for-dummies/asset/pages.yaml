    # Interpreting File Names


    Suppose your mind has been wandering, although you do remember that a file in
    /etc contains passwords, you can''t remember whether the file is in /etc/passwd,
    /etc/password, or whatever. You may want the command interpreter to choose the
    proper spelling of the filename, rather than type what you think it might be.


    You can first list the files in the /etc directory, and then use more to view
    the specific file you want to see (/etc/passwd):


    ```

    [maddog@shamet maddog]$$ ls /etc/pass*

    /etc/passwd

