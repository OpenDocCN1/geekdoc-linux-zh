    # Comparing hard disk controllers


    The main types of hard disks are IDE and SCSI, and each type has its own controller.
    IDE is more common in PCs, and newer PCs usually have two IDE controllers rather
    than one. For each IDE controller, your system can have only two hard disks: a
    master and a slave. Therefore, a PC with two IDE controllers can have up to four
    hard disks. You should know which hard drive is which. Also, if you have a Windows
    system that you want to preserve, you should know which hard drive it resides
    on (a PC can use up to four). Normally, this is the configuration on a Windows
    system.


    +   The first controller''s master disk is called C.


    +   The next hard disk is called D, and it''s the slave disk on the first controller.


    +   The next hard disk is E, and it''s the master disk on the second controller.


    +   The last hard disk is F, and it''s the slave disk on the second controller.


    Normally, Windows is located on your C disk, and data is on your other hard disks.
    This lettering scheme is just one possibility; your hard disks may be set up differently
    and even include CD-ROMs as drives on your IDE controllers.


    High-end PCs have a SCSI controller on the motherboard or on a separate SCSI controller
    board, in addition to or instead of the IDE controller. Older SCSI controllers
    can have up to eight devices on them,'
