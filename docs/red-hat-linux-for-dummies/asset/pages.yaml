  md: '# 74 Part II: Installing Linux


    (continued)


    Some PC BIOSs have rules about where you can install the partition. You must consider
    the following if you''ll be installing the root partition on your hard drive:

    * If you have two IDE (EIDE) drives: The root partition must be one of them. If
    the hard drive and the CD-ROM drive are on the primary controller, the root partition
    must be on that hard drive.

    * If you have one IDE drive and any SCSI drives: The root partition must be either
    on the IDE drive or on the SCSI drive that is ID 0. Other SCSI IDs won''t work.

    * If you have no IDE drive but have SCSI drives: The root partition must be on
    IDE 0 or ID 1, no other SCSI ID will work.

    * If your kernel must live below cylinder 1023: This requirement is because the
    BIOS can''t see far out on the disk, beyond the 1023rd cylinder. The major booting
    process for Linux, called LILO, depends on the BIOS for some of its functions;
    if the Linux kernel is below cylinder 1023, LILO cannot find it and start the
    booting process.

    On IDE drives, cylinder 1023 is generally below the 512MB mark for SCSI drives,
    it''s usually the 1GB level. If you''re using smaller disks, you''re probably
    okay. Otherwise, you probably need to take this into account when you use the
    system. The easiest way to ensure the kernel is located on cylinders 0 through
    1022 is to make your root partition beyond the 1023rd cylinder, you can specify
    this with the fdisk program when you get to disk partitioning. New versions of
    BIOS support Logical Block Addressing (LBA), so they may not have this limitation.
    By using LBA, you can put the BIOS into seeing the disk as having less than 1023
    cylinders.


    # Finding out about files


    Linux, like UNIX, refers to everything as a file. In other words, the name for
    a device such as a hard drive is the file address of its driver. For example,
    /dev/sda is the name of the first IDE hard drive, and /dev/sdb is the name of
    the second SCSI hard drive.

    Linux refers to disks and partitions using a system of letters and numbers, which
    may seem confusing to the DOS or Windows user. Following is a short description
    of the naming conventions for hard drives and partitions.

    Letters refer to the devices on which the partitions are located. IDE hard drives,
    for examples, are named hda, hdb, hdc, and so on. SCSI drives


    are referred to as sda, sdb, sdc, and so on. (The hd stands for hard drive, and
    the sd stands for SCSI drive).

    Numbers describe the partitions. Linux supports only four partitions, but one
    may be an extended partition, which is subdivided into multiple logical partitions.
    The numbers 1, 2, 3, and 4 denote primary partitions; the logical partitions start
    at 5. For example, /dev/hdb3 is the name for the third partition on the second
    IDE hard drive. In a SCSI world, /dev/sdc6 is the name for the second logical
    partition on the third SCSI hard drive.'
