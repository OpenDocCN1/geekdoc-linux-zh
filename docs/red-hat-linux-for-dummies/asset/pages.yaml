    [maddog@shamet emptydirectory]$ cd gregger```

    ```


    At the Linux prompt, type `ls` as follows:


    ```

    ```[maddog@shamet gregger]$ ls

    [maddog@shamet gregger]$```

    ```


    That didn''t do much, did it? It seems as if the account has no files. You may
    need an option. Try the `-a` option and see what happens:


