  md: '# # About the Authors


    **Jon "maddog" Hall** is the Executive Director of Linux International, a vendor
    organization dedicated to promoting the use of the Linux Operating System. He
    has been in the computer industry for over a quarter century (somehow that sounds
    more impressive than just ''twenty-five years''), the past eighteen years of which
    have been spent programming, and admiring the UNIX Operating System. Currently,
    Jon works for Compaq Computer Corporation, where he is helping to shape Compaq''s
    strategy with respect to Linux. Previously, Jon was the Department Head of Computer
    Science at Hartford State Technical College, where his students lovingly (he hopes)
    gave him the nickname "maddog" as he tried to teach them operating system design,
    compiler-piler theory, and he has to live an honorable life.


    While working for Digital Equipment Corporation in May of 1994, maddog Linus Torvalds,
    was intelligent enough (his critics say maddog was just lucky) to recognize the
    potential of the Linux Operating System. Linux changed his life, by providing
    him with twenty-two hour work days. Since maddog has started working with Linux,
    however, he has also started meeting more girls (in particular his two grandchildren).
    You can usually find Jon speaking at various Linux conferences and events (maddog
    just barks) and he has also known to travel long distances to speak to local Linux
    user groups.


    **Paul G. Sery** works for Sandia National Laboratories in Albuquerque, New Mexico.
    He''s a member of the Computer Service Unit, Special Projects, which specializes
    in managing and troubleshooting UNIX and Linux systems.


    When Paul is not beating his head against systems administration problems, and
    his wife Lidia enjoying their tandem in Rio Grande valley. they also enjoy traveling
    throughout Mexico. Paul is the author of LINUX Network Toolkit and Red Hat Linux
    6 in Small Business (both published by IDG Books Worldwide, Inc.). Paul has a
    bachelors degree in Electrical Engineering from the University of New Mexico.'
