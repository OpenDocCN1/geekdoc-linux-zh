    tells you. The subject and sender appear in the center of the screen, and the
    e-mail message itself appears at the bottom of the screen, as shown in Figure
    18-13.


    If you have multiple e-mail messages, you can see each one by clicking the Subject
    line in the middle window. You may reply to, forward, or delete a particular message
    by highlighting its Subject line and clicking the appropriate icon (Reply, Forward,
    or Delete). When you click the Reply icon, the address of the person you''re replying
