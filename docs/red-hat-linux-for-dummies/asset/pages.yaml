- img_proc: true
  md: '# 198 Part IV: Using Red Linux


    windows, changing their size, bringing them to the forefront, and hiding them
    in the background. You finish by locking your screen, logging off GNOME and stopping
    X altogether.


    # Introducing the Amazing Window System


    X (also designated as X11 or X Window System) has three main parts:


    +   - A graphics server

    - A set of graphics libraries

    - A set of graphics clients who normally use the graphics libraries


    The server is a program that talks to the video card, keyboard, and mouse on your
    system. It receives commands from the set of graphics libraries that are incorporated
    into programs. Sometimes these programs are executed directly on the same system
    where the graphics device resides; other times, these programs talk across a network
    to a graphics device on another system. Using X, you can run your program in one
    part of the world and someone can see the output of it in another part of the
    world over the Internet.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_225_0.png)


    The server program, often called XServer, is not part of the operating system,
    as it is in some other operating systems. Instead, X Server is a user-level program
    — a special and complex one.


    Three main types of programs use X:


    +   - Window managers

    - Terminal emulators

    - General applications


    # But I don''t do windows!


    Window managers like Enlightenment are programs that receive commands indirectly
    from the user through mouse clicks and keystrokes. The window manager passes those
    commands to the set of graphics libraries mentioned in the previous section. The
    graphics libraries then communicate with the X server to manipulate windows on
    the graphics device, which is usually your screen.


    The window manager acts like a playground monitor; it''s the central point of
    control for the major windows seen on the screen (and even some windows'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Chapter 14: Getting to Know GNOME and X


    that can''t be seen). It blows a whistle when a window gets unruly. The window
    manager can serve also as a desktop, where you can use it to launch applications.
    A window manager isn''t necessary, but it would be difficult to use more than
    one or two applications at once without also using a window manager. (The applications
    would need to be written to allow resizing, window positioning, and so on.)


    Here are some typical window manipulations:


    +   - Move a window around a scene

    - Make a window smaller or larger

    - Overlap a window with another one

    - Bring an overlapped window into full visibility (called raising a window)

    - Send a window into less visibility (called lowering a window)

    - Make a window very small but still accessible (called iconifying a window)


    Window managers may also maintain an icon bar, which keeps icons easy to find
    and manage, as well performs other functions. But the most important to remember
    about window managers in X is that they are just user-level programs like any
    other — they are not part of the system. You have a choice of window managers,
    and each has different capabilities, although a discussion of these window managers
    and capabilities is outside the scope of this book.


    # With these smarts, why should I play dumb?


    The second main category of program under X is the terminal emulator, a program
    that emulate character-cell terminals. You may be wondering why you would want
    to simulate a dumb, inexpensive terminal when you paid a lot of money for a graphics
    monitor. Shouldn''t every program be graphical?


    In the early days of X, few graphical programs were available. Most programs were
    written to run on character-cell terminals and did not include the libraries that
    create graphical programs on X Server. Therefore, to run both character-cell and
    graphical programs, the dumb terminal had to be emulated through software. The
    main terminal emulator in Linux is xterm. xterm program simulates both a Digital
    VT102 and a Tektronix 4014 terminal. Most character-cell programs were written
    to drive these terminals.


    If you start xterm, it usually executes a shell and gives you a command-line prompt.
    You type commands, and the results are output to the window containing xterm.
    You can use xterm to start the execution of a totally graphical-based program
    such as xterm or x by typing the name of that graphical-based program on the command
    line presented by xterm.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 200 Part IV: Using Red Hat Linux


    # Now the good stuff!


    The third main type of program is the general application, and this can range
    from text editors such as xedit (which looks a lot like a terminal emulator but
    is much different) to applications such as xfig (which manipulates images) and
    xpaint (which enables you to draw objects) to games such as Doom. These programs
    would be impossible (or at very hard) to run on a character-cell terminal.


    # Two interfaces in one


    The Linux operating system CD1 with two, two interfaces in one. Linux makes use
    of both a command-line interface (like that found in MS-DOS) and the X graphical
    interface. X is said to "sit on top of" the command-line operating system. This
    allows total access to the operating system through a command-line interface as
    well as through a graphical interface. (Some operating systems provide you with
    only a graphical interface.)


    ![](img/61222a84312a7aaf1d7bb493d840cde4_227_0.png)


    The Red Hat Linux CD1 includes several window managers including GNOME/Enlightenment,
    KDE, and the previous Linux standard Fwm95. GNOME/Enlightenment is the default
    in this book. KDE is similar to GNOME in that it is a modern system but we leave
    it up to you to explore. You can also use old Fwm95 to start applications (and
    stop them of course), move windows, shrink windows, expand windows, and everything
    but wash windows. Think, you can use your system without ever typing a command!


    ![](img/61222a84312a7aaf1d7bb493d840cde4_227_1.png)


    If X does not automatically start when you boot your computer, then you need to
    do so manually. From the command line, simply enter the command startx. If X fails
    to start, consult Chapters 5 and 6.


    # Gnow GNOME


    Log in to your Linux computer. You should see the GNOME environment, as shown
    in Figure 14-1. GNOME consists of three major elements: the desktop, standard
    applications, and the Panel. The desktop is simply the space where you do your
    work. Standard applications include things like the GNOME File Manager, Help Browser,
    and such. The Panel is the menu bar that appears on the bottom edge of your screen.


    The desktop comes pre-configured with several icons that are links to GNOME File
    Manager, Red Hat Web sites, the Linux Document Project (LDP), and GNOME. In Figure
    14-1, you can see these icons along the left-hand edge of your screen. By default,
    the GNOME File Manager and Help Browser start with'
