  md: '# Tweaking Linux Commands


    Most Linux commands are flexible and can be modified to perform special tasks.
    You can use two devices to alter a command: command options and standard input
    and standard output redirection. You find out about command options first.


    You can use `command options` to fine-tune the actions of a Linux command. We
    introduce the `ls` command earlier in this chapter so you can see the results
    of actions taken on the file system. See how its options work, in the next example
    you try out the `ls` command several times, with different options.


    Use the `mkdir` command to make a new directory called gregger and then use the
    `cd` command to change your directory to that directory:


    ```

