  md: '# Speaking like a geek


    Our editors (and a darn fine ones), hate when we say things like "fsck your file
    system." They want us to say "run the fsck program against the file system." We
    have gone along with it for the most part, but here we tell you what true UNIX
    (and Linux) geeks say:


    Geeks talk about disks, but editors would make us say disk drives. And geeks use
    the words X, X11, and Window System interchangeably, whereas editors politely
    interrupt (each and every time), "Did you mean to say X Window System?"


    +   - "Eff Check" the file system instead of "run ES C K on the file system"


    +   - VEYE (rhymes with "eye") instead of "vee eye" when talking about the editor
    vi


    We also want to point out that geeks are not nerds. Geeks are people who love
    technical topics but typically have a wide range of other interests. Geeks are
    often outgoing, and many (but not all) enjoy being with people.


    We pointed out to editors that fsck is a noun, a verb, and an adjective:


    +   - ran fsck.


    +   - fscked the file system.


    +   - I put the files into the fscked file system.


    One of Jon''s favorite T-shirts (he has more than 3,000) reads: "It is hard being
    a Geek, but it is getting easier."


    So, if you really want to like the Linux operating system and want to learn more,
    you may well be a closet geek. Welcome to the club.


    But this concept makes her shutter.


    # In the News


    You can obtain additional information about the Linux operating system from the
    Internet. A facility called Netews has tens of thousands of newssgroups, and each
    newsgroup covers a special topic. More than 30 newsgroups are devoted to Linux
    topics.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_310_0.png)


    An ISP (Internet service provider) usually provides access to Netews. You can
    use a reader (such as tri, tin, or pine) or one of several browsers (such as the
    Netscape browser included in CD1) to read Netews.


    # User Groups


    User groups are springing up all over the country. Some are more active than others,
    but most hold meetings least once a month. Some are Linux only; others are connected
    to a larger computer group—either UNIX or a more general computer user association.
    User groups are a great opportunity to ask questions, and they stimulate new ideas
    and ways of doing things.'
