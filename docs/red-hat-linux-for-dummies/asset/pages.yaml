    Imagine that you are in a foreign country and don''t know the language, so you
    hire an interpreter to accompany you. You tell the interpreter what you want to
    do and where you want to go. Assuming nothing goes wrong with your flight, the
    interpreter then decides what steps to take (hire a taxi or take the subway, for
    example) and in what order. When you talk to a foreigner, the interpreter translates
    your statements into that country''s native language.


    Shells (also known as command interpreters) do much the same thing. They take
    the English-like commands that you type in, gather resources (such as file names
    and memory), and supply lower-level computer statements to do what you want.


    Many shells have evolved throughout the history of UNIX and Linux. Their history
    and derivation is discussed in the "A shell for all seasons" sidebar later in
    this chapter. For now, we''d like to simplify the issue of which shell is best
    and suggest a shell for you to use.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_168_0.png)


    We recommend bash because it is widely available and has more features than you''ll
    ever need as a user. If you go on to become more of a programmer or if you really
    enjoy investigating shells, you may want to try the popular zsh or the even more
    popular Tcl/Tk or Python, all of which have graphical interfaces.'
