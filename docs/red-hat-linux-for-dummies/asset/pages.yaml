  md: '# Chapter 9: Filing Your Life Away


    +   - Directory files hold the names of files — and other directories — that belong
    to them. These files and directories are called children. Directories in Linux
    (and UNIX) are just another type of file. If you are in a directory, the directory
    above you is the parent. Isn''t that homey?


    When you list files with the ls -l command, lines containing directory files begin
    with the letter d. For example:


    ```

    ```

    [maddog@shamet maddog ~$] ls -d plot

