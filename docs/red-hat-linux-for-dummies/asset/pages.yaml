  md: '# 260 Part V: Going Online


    You should hear a dial tone as your modem picks up the line and then hear your
    modem dialing the number. After one or a few rings, you hear a scratchy, squawking
    sound and then silence.


    After a few seconds, networking is working, and your computer is connected to
    the Internet. To test that everything is okay, type the following at the command-line
    prompt to communicate with a major system at Compaq Computer Corporation:


    ```

    ping gatekeeper.dec.com

    ```


    If you get a message saying that the system is not found, wait a minute more and
    try again. Eventually, you should receive a message talking about how many milliseconds
    it takes for a round-trip message. Congratulations, your networking is working!


    To turn off networking, simply type the following:


    ```

    /sbin/ifdown ppp0

    ```


    You have now set up hardware and software to connect your system to the Internet.
    Your computer has been joined with the Force.


    To actually ski the Net, read e-mail, and otherwise interact with others on the
    Net, check out Chapter 18, where you find out how to configure and use a major
    Internet tool: the Netscape Communicator program.


    # Batten Down the Hatches


    After you''re connected to the Internet, you run the risk of running amok with
    the bad guys (also known as black hats). You''ve heard of hackers, Trojan Horses,
    and such. Unfortunately, they''re real, and the Net is a perfect vehicle for them.


    # Securing your computer


    You may think that there''s safety in numbers. Literally millions of people, businesses,
    and organizations are connected at any one time, and what do you — a simple person
    with a simple computer — have to be concerned about? After all, the bad guys are
    interested in big money or big publicity.


    Well, that line of thinking is all true, and chances are that you''ll never suffer
    anything bad. But that''s a risk that you may or may not want to take. Linux offers
    a rather simple method for protecting yourself. The ipchains RPM that'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Chapter 17: Setting Up Your Internet Connection


    is packaged with Red Hat Linux can be used as a firewall — a tool for preventing
    unauthorized access to your computer.


    Linux is a multiuser and multitasking operating system. Unlike Windows, more than
    one person can be logged in at once. More than one task can be run at once, too.
    This offers an attractive launching point for black hats. If someone can gain
    access to your Linux computer while it''s on the Net, then that person can use
    your machine to launch attacks against other machines. You become the proxy that
    helps bad guys hide their identities.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_288_0.png)


    # Building a simple but effective firewall


    The ipchains software is a system that filters IP packets, which are the backbone
    of the Internet. IP stands for Internet Protocol, in fact. When you''re connected
    to the Internet, all the information (graphics and text) that you send and receive
    is sent in the form of IP packets. These packets contain the information that
    you''re interested in as well — and this is how your stuff gets sent around the
    world — the destination and source address information.


    Anyway, all the information that enters and leaves your computer via the Internet
    is packaged in the form of IP packets. You can use ipchains to accept or deny
    the IP packets based on their destination and source address and ports. (Oh yeah,
    ports are another aspect of the Internet Protocol. Suffice to say that they''re
    used for the internal workings of things as Web browsing.)


    The ipchains firewall we describe in this chapter allows you to access all the
    Internet services except FTP. No one can access your machine or even see it. (Tools
    such as nmap are readily available on the Internet that can be used to scan your
    computer and find out what type of operating system you have as well as what services
    it offers.)


    FTP is to transfer files from one place to another. You can modify the rules to
    allow FTP but that makes it a little more complicated. You can find more extensive
    and complete rules at Paul''s Web: www.swcp.com/~pgsery/rbn12/. Look for ipchains.rules
    and ipchains.reset.


    The following steps describe how to protect yourself by building a firewall:


    +   1. Log in as root and mount the companion CD-ROM (CD1).

    2. Install the ipchains RPM by typing this:

    3. Edit a file and call it firewall.on. It puts it in the /usr/local/etc directory.
    Entering the following ipchains rules into it. (The lines preceded by a hash (#)
    symbol are comments.)


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/ipchains*

    ```


    ![](img/61222a84312a7aaf1d7bb493d840cde4_288_1.png)'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 262 Part V: Going Online


    ```

    # Flush out all existing rules

    ipchains -F

    ipchains -X

    ```


    ```

    # Allow all internal network traffic

    ipchains -A input -i lo -j ACCEPT

    ipchains -A output -i lo -j ACCEPT

    ```


    ```

    # Allow all private network traffic (Ethernet)

    ipchains -A input -i eth0 -j ACCEPT

    ipchains -A output -i eth0 -j ACCEPT

    ```


    ```

    # Allow all TCP packets out to the Internet

    ipchains -A output -p TCP -j ACCEPT -i ppp0 -d 0.0.0.0/

    ```


    ```

    # Allow DNS UDP packets out to the Internet

    ipchains -A output -p UDP -j ACCEPT -i ppp0 -d 0.0.0.0/0 domain

    ```


    ```

    # Allow DNS UDP packets back from the Internet

    ipchains -A input -p UDP -j ACCEPT -i ppp0 -s 0.0.0.0/0 domain

    ```


    4. Create the file that will be used to turn off the firewall. Call it firewall.off
    and put it in the /user/local/etc directory as well.


    ```

    ipchains -F

    ipchains -X

    ipchains -P input ACCEPT

    ipchains -P output ACCEPT

    ipchains -P forward ACCEPT

    ```


    5. Save the files and make them executable by root:


    ```

    chmod 770 /usr/local/etc/firewall.*

    ```'
