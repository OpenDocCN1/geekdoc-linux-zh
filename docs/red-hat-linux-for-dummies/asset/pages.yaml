- img_proc: true
  md: '# Chapter 19


    # Ten Sources of Help


    In This Chapter


    +   - Read, read, read

    - Check out the Linux HOWTOs

    - Go back to school

    - Become a newshowound

    - Become a groupie

    - Pay for support

    - Go the commercial route

    - Visit Web sites

    - Attend conferences

    - Try to help others


    By now, you''re probably wondering whether there is any end to the amount of information
    and knowledge needed to run a Linux (or UNIX) system. The answer is yes, there
    is an end to the knowledge that you need to run a system well, but not to the
    knowledge you can accumulate to understand how things work and interact. In this
    chapter, we suggest several ways to get additional training and support.


    # Books and More Books


    When we started working with computers many years ago, the number of computer
    books could fill one bookshelf, and they were mostly about the electronics of
    the hardware itself. We hardly ever saw books on computers in the popular bookstores.
    Today, thousands of books on computers are available; most describe the software
    and its interactions, with the hardware taking a back seat. Books like the For
    Dummies series aren''t just for bookstores anymore. You can find them in mass-market
    venues like Wal-Mart, for instance.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 282 Part VI: The Part of Tens


    Perhaps you looked at other books before you bought this one and were intimidated
    by their use of technical terms. Or you wanted something task-oriented. You may
    want to look over those books again because your knowledge level will have skyrocketed
    after reading this book. TCP/IP net-working, compiler design, operating system
    theory, formal language theory, computer graphics, and systems administration
    training are all topics that you can study in depth.


    Lots of books specifically about the UNIX operating system are partially or completely
    applicable to Linux, such as books on Perl, a comprehensive interpreter. By getting
    one (or more) books on Perl and sitting down with your Linux system, you have
    a new tool for doing your work and a new appreciation for a complete programming
    language. If you want to find out how to write Perl, you can just view the source
    code.


    # Linux HOWTOs


    ![](img/61222a84312a7aaf1d7bb493d840cde4_309_0.png)


    Don''t forget about the Linux HOWTOs, which are on CD1. These excellent guides
    to Linux are covered under the Linux Documentation Project copyplet, which means
    you can print them. You can install them by logging in as root, mounting the CD-ROM
    (`mount /dev/hda... /mnt/cdrom`) and running the rpm command (`rpm -ivh /mnt/cdrom/RedHat/RPMS/howto*`).
    You can also read the HOWTOs with `more(1)` or less(1).


    # School Days


    Another way to find out more information about UNIX and Linux is to take a course,
    at a local community college. Many colleges offer courses on UNIX, and some have
    used Linux to teach the UNIX courses. You can do your homework on your system
    at home, or if you have a notebook, you can work anywhere. (Jon typed text for
    the first edition of this book in a hotel in Auckland, New Zealand, and updated
    text for the second edition in the United Airlines lounge in Chicago.) We would
    have given the chance to do our computer projects sitting in the comfort of our
    pub . . er, dorm rooms. Instead, we had to sit in a room with a bunch of punch-card
    machines . . . well, never mind. We would have been much more comfortable and
    productive with a Linux system.'
  merge: -1
