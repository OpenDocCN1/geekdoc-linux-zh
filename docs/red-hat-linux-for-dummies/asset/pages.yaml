  md: '# Chapter 9: Filing Your Life Away


    +   - **Write permission** for a file means you can modify the file. For a directory,
    you can create or delete files inside that directory.


    +   - **Execute permission** for a file means you can type the name of the file
    and execute it. You can''t view or copy the file unless you have already read
    permission. This means that files containing executable Linux commands, called
    *shell scripts*, must be both executable and readable by the person executing
    them. Programs written in a compiled language as C, however, must have only executable
    permissions, to protect them from being copied where they shouldn''t be copied.


    For a directory, execute permission means that you can change to that directory
    (with `cd`). Unless you also have permission for the directory, `ls -l` doesn''t
    work. You can list directories and files in that directory but you can''t add
    additional information about the files or directories by just using an `ls -l`
    command. This may seem strange, but it''s useful for security.


    The first character of a file permission is a hyphen (-) if it is a file or d
    if the file is a directory. The nine other characters are read, write, and execute
    positions for each of the three categories of file permissions:


    +   - **Owner (also known as the user)**


    +   - **Group


    +   - **Others


    Your playtime file, for example, may show the following permissions listed with
    the `ls -l playtime` command:


    ```

    -rw-rw----

    ```


    The hyphen (-) in position indicates that it is a regular file (not a directory
    or other special file). The next characters (rw-) are the owner''s permissions.
    The owner can read and write to the file but can''t execute it. The next three
    characters (rw-) are the group''s permissions. The group has read-only access
    to the file. The last three characters (r--) are the others'' permissions, which
    are also read-only.


    [-rw-][rw-][r--] illustrates the four parts of the permissions: the file type
    followed by three sets of triplets


    You can specify most file permissions by using only six letters:


    +   - ugo, which stands for — no, not awful car — user (or owner), group, and
    other


    +   - rwx, which stands for read, write, and execute.'
