    what should be standard input and standard output to the command. Standard input
    is normally the keyboard, and standard output is normally the video screen. (You
    find out more about environments in a moment )

    2. bash expands * to match all the filenames in that particular directory. By
    expanding the filenames, we mean that special characters are used to indicate
    groups of filenames. When these characters are used, the computer sees what filenames
    match with these special characters and supplies the filenames to the command,
    instead of the special characters.

