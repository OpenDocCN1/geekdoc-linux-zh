  md: '# Creating a free distribution


    One of the most important decisions Linus Torvalds made in the early days of the
    Linux kernel was to freely distribute the code through a process known as creating
    a distribution. His genius was not only in developing the kernel but also in utilizing
    the but huge resources of the young Internet. The volunteer process that he started
    created software that was developed quickly and professionally.


    These free distributions were available in various forms: from the Internet, on
    floppy disks, on CD-ROMs, from software publishers who charged a distribution
    fee, or bundled with other programs (which organizations charged for). In every
    case, the base Linux kernel and other freely distributable code had to be identified
    and made available without charge.


    This process also consisted of accumulating huge amounts of free software from
    the Free Software Foundation (FSF) and other places, adding the free software
    to the Linux kernel, and creating a way to install the software on the computer.
    (Richard Stallman who believes that all software should be freely available whoever
    formed the FSF. Linux would not have possible without it.)


    The importance of the availability of the operating system source can be be overstated.
    Freely distributable source code has resulted in a Linux operating system that
    continues to improve rapidly. Each developer can build on the efforts of the one
    before, and these improvements benefit everyone — including you.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_40_0.png)


    And if the number of freeware programs ported to Linux doesn''t satisfy you, commercial
    applications such as databases, data manipulation programs, automated network
    backup systems, and office suites have been ported to Linux, too. With Linux,
    you can have the same environment on your notebook computer, desktop workstation,
    and large server system. Software such as Applire, StarOffice, and WordPerfect
    allow you to use Linux as your personal workstation.


    # Sharing with file and print servers


    Because of its multitasking capability, virtual memory, and powerful file system,
    Linux works well as a file and print server for Microsoft Windows systems. A software
    product called SAMBA allows Windows PCs to communicate with the file system and
    printers attached to a Linux machine. AppleTalk allows Macintosh computers to
    use Linux as a file and printer server. And, of course, Linux can share files
    and printers with UNIX systems. By using Linux to do this work, you can save a
    lot of money because the operating system and the layered software that provide
    these services are freely available.'
