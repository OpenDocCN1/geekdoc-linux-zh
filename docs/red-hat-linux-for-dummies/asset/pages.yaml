  md: '# Chapter 11


    # Scripting Your Act


    # In This Chapter


    +   - Writing a simple shell program

    - Writing a not-so-simple shell program

    - Finding out about multitasking


    After you get the hang of working from within a shell, you can branch out to writing
    shell scripts. And if you''re good at it, you can move to Hollywood and find fame
    and fortune. You probably never anticipated that you could gain so much from purchasing
    this Linux book, eh?


    The bash shell that comes standard with all Linux distributions provides you with
    a powerful programming environment. Shell programming is also called scripting
    and is typically used to perform administrative tasks. This chapter describes
    how to get started in the exciting world of writing scripts. Send your dudes to
    the Actor''s Guide right away!


    # Starting Out with a Simple Shell Script


    In Chapter 10, we show you interactive shell functions, a fancy term that simply
    means that you type something the computer executes it immediately. After a while,
    you may notice that you''re typing a certain series of commands over and over.
    Wouldn''t it be nice to put all those commands in a file and execute them all
    at once? Well, you can!


    For the rest of this section, you work on creating shell scripts, which contain
    a series of commands that are executed every time you type the name of the script
    as command. First you create a simple shell script and later you create a more
    complex one.


    Suppose you want to periodically generate a report, showing who owns the login
    accounts. You can simply print the /etc/passwd file, but that file has a lot more
    information in it than you need. Plus, you are an organized person and prefer
    to format the report yourself rather than use the password file'
