- img_proc: true
  md: '# 182 Part III: Just the Basics


    ```

    /sbin/fdisk /dev/sda

    ```


    To format the common IDE disk, you use the following command:


    ```

    /sbin/fdisk /dev/hda

    ```


    To find out how to use fdisk, refer to Chapter 5. Using fdisk is not too difficult;

    you can partition the drive fairly easily.


    # Making the file system


    Every disk is simply an empty space with a beginning and an end.

    Unless the partition is being used for swap space, you have to put some type

    of file system on the partition before it can become useful. The mkfs (for

    make file system) command is used to create the file system on the partition.

    Normally, the file system is a native Linux file system, which at this time is

    called ext2. The Linux version of mkfs has been nicely streamlined and

    requires hardly any input. To create a file system on the disk partition

    sda, for example, you enter the following command:


    ```

    mkfs -t ext2 /dev/sda

    ```


    Or, for an IDE drive, enter this command:


    ```

    mkfs -t ext2 /dev/hda

    ```


    If you want to create an MS-DOS file system on the disk partition, you use this

    command:


    ```

    mkfs -t mdos /dev/sda2

    ```


    You can continue to execute mkfs commands to create file systems for every

    partition on your disk. Or you can leave some partitions without file sys-

    tems (for future use), as long as you remember to perform the mkfs com-\mand before
    trying to attach them to your file system by using the

    mount command or the /etc/fstab table.


    Congratulations! Your disk has been physically added to your system and

    partitioned, and you''ve added file systems to it. Now the disk is ready to join

    the rest of the file system — simply use either the mount command or the

    /etc/fstab file, we describe earlier in this chapter.'
  merge: -1
