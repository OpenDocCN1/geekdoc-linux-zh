    # Becoming a GNOME File Manager


    Being the boss doesn''t make you a bad person. It''s just a job. Right? Well that
    little GNOME guy is a good worker and doesn''t eat much. Just press a key here,
    click a button, and you''re your manager. It even comes with its own file manager
    that saves you and makes room for those long lunches.


    The GNOME File Manager follows in the tradition of all good file managers; it
    graphically displays the files and directories on your computer. You can copy,
    move, delete, and execute files by pointing and clicking. You can also create
    directories, view file details, and the like. Not a bad deal considering it works
    for free.'
