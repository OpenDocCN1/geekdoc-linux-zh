    # # Linux partition types


    When Linux disk creates partitions, it creates Linux native partitions by default.
    Many styles of file systems are available. The file system that chooses the way
    the operating system puts data on the disk partition, the maximum size of directories,
    the length of file names, and how many files can be in any partition.


    One of the non-file systems you may want to create is a swap partition. In the
    preceding section, we created one swap partition: disk partition 3, set up for
    127MB, which is the maximum size of any one swap partition in Linux. Linux systems
    can handle up to 16 swap partitions, so the size limitation is not crucial.


    Linux is stingy with memory space, and a swap partition is not always necessary.
    Adding one at this time, allows you to run many programs as large programs without
    partitioning your disk. We recommend 127MB to start, assuming you have enough
    disk space for that.


    When you create the swap partition, you must remember to use the t command to
    change it to a swap partition, which brings us to the point of this section. In
    Figure D-10, we show the steps for switching the file system native to swap. To
    follow another:


    Figure D-10: Command (m for help):


