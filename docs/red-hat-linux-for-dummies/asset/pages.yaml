  md: '# # Appendix D


    # # Making Life Difficult with fdisk


    Back in the bad ''old days before Disk Druid (see Chapter 5 for more on Disk Druid),
    you had to walk five miles through hip-deep snow to partition Linux disks. Back
    then, fdisk was the only way to set up a hard drive to install Linux. Just in
    case you want to experience life as it was, in this appendix, we describe how
    to use fdisk. Have fun.


    # # Starting fdisk


    If for some reason you can''t or won''t use Disk Druid, the fdisk program is still
    available. During the installation process, Linux asks you to choose whether you
    want to partition your disk with Disk Druid or fdisk (see Chapter 5). Your first
    action is simply choose fdisk. When you do so, the screen in Figure D-1 appears.
    Here, follow these steps:


    ![](img/61222a84312a7aaf1d7bb493d840cde4_364_0.png)


    +   1. Specify which of your disks you want fdisk to partition.

    2. Press the Tab key until you reach the Done button and then press Enter.


    The fdisk program starts. The first screen of fdisk appears, as shown in Figure
    D-2.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# 338 Part VII: Appendixes


