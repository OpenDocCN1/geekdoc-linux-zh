- img_proc: true
  md: '# Chapter 17: Setting Up Your Internet Connection


    1. Choose Start; Settings; Control Panel.


    The Control Panel window appears.


    2. Double-click the Modem icon.


    The Modems Properties dialog box appears.


    3. Select the Diagnostics tab.


    You see your modem listed, with a COM line number beside it. This is the Windows
    designation for your modem''s serial communications line.


    The modemtool(8) program, which is included on CD1, tells Linux which serial line
    has an attached modem. In addition, you can now utilize the link between the COM
    names that Microsoft products use for serial lines (COM0, COM1, COM2) and the
    names that UNIX systems tend to use (ttyS0, ttyS1, ttyS2, ttyS3). You can see
    the modemtool(8) program in action in Figure 17-1.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_278_0.png)


    Select the device (serial port) to which your modem is connected. If you have
    no modem, select <name>. This configuration simply makes a link from /dev/modem
    to your actual modem.


    | Device | Information |

    |---|---|

    | cua0 | No Modem |

    | cua1 | COM1 under MS - DOS |

    | cua2 | COM2 under MS - DOS |

    | cua3 | COM3 under MS - DOS |

    | cua4 | COM4 under MS - DOS |


    Another way to determine which serial line the modem is attached to is to use
    the staterial program. By unhooking everything but the modem from your serial
    lines, you can issue the staterial command to determine which port your modem
    is attached to. Each time you execute, you provide it with another line designation
    (/dev/ttyS0, /dev/ttyS1, /dev/ttyS2, /dev/ttyS3) and note which of the designations
    has the Clear to Send and Data Set Ready values set to 1. For example, in Figure
    17-2, those values are 0 for /dev/ttyS0.


    Sometimes, the program fails to work and displays an error message like the following:


    ```

    staterial: TIOCMGET failed: Input/output error

    ```


    Yet, when you use the staterial command on a line with a modem on it, the CTS
    and LSR values are 1, as shown in Figure 17-3.'
