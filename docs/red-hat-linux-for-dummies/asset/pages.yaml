  md: '# 120 Part III: Just the Basics


    Confused? An example may help. Suppose you get a grand idea and decide to keep
    it in a file named idea in your directory called /wonderful. Now suppose you''re
    having a very fertile day and come up with another idea. If you want to keep your
    second idea file in the /wonderful directory, you use a different name, such as
    /wonderful/idea2. (We hope your ideas are more original than ours filenames.)
    You can also, however, keep the file in another location— called the /bizarre
    directory. If you decide to keep your second idea in /bizarre, you can call it
    idea, and the filename becomes /bizarre/idea. Linux sees this file and the /wonderful/idea
    as different files. Remember, though, that each directory may contain only one
    file with the same name.


    Linux filenames can be as long as 256 characters. They can contain uppercase and
    lowercase letters (also known as mixed case), numbers, and special characters,
    such as the underscore (_), the dot (.), and the hyphen (-). Because filenames
    are made of mixed case names, and each name is distinct, we call these names case
    sensitive. For example, the names FILENAME, filename, and FiNameMe are unique
    filenames of different files on some systems (like Compaq''s OpenVMS), to Linux
    however, they are the same filename.


    Although filenames technically can contain wildcard characters, such as the asterisk
    (*) and the question mark (?), using them is not a good idea. Various command
    interpreters, or shells, use wildcards to match several filenames at one time.
    If you use wildcards, you will have trouble specifying only those files. We recommend
    that you create filenames that don''t contain spaces or other characters that
    have meaning to shells. In this way, Linux filenames are different than DOS and
    Windows filenames.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_147_0.png)


    # Sorting by file types


    Linux files can contain all sorts of information. Five categories of files will
    become the most familiar to you: user data files, system files, directory files,
    special files, and executable files.


    +   * User data files contain information you create. User data files, sometimes
    known as flat files, usually contain the simplest data, consisting of plain text
    and numbers. More complex user data files, such as graphics or spreadsheet files,
    must be interpreted and used by a special program. These files are mostly legible
    if you look at them with a text editor, because the contents of these files are
    not always ASCII text. Changing these files generally affects only the user who
    owns them.

    * System data files are used by the system to keep track of users on the system,
    logins, passwords, and so on. As system administrator, you may be required to
    view or edit these files. As a regular user, you don''t need to be concerned with
    system data files except, perhaps, the ones you use as examples for your own private
    startup files.'
