    to which they are attached.


    # Choosing a separate or shared hard disk


    You need to decide if you want to put Linux on a separate hard disk from MS-DOS
    and Windows or the two operating systems share one disk.


    Most people think of Windows (either Windows 3.1, Windows 95/98, or Windows NT)
    as an operating system. Most Windows versions (not counting Windows NT or Windows
    CE), however, have an underlying system called MS-DOS, which manages the hard
    disk and hardware components of your PC. From here on, unless we mention a particular
    operating system, when we refer to Windows, we’re referring to the Windows/MS-DOS
    conflation.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_66_0.png)


    # Old systems and new hard disks


    Hard disks are made up of cylinders of information, which in turn are made up
    of tracks of information, which in turn are made up of blocks of information.
    Because newer hard disks have more cylinders, older computer systems can’t easily
    handle them. A method called block addressing, or LBA, was created so that older
    systems can work with newer hard disks, which have more than 1,023 cylinders.


    The BIOS setup specifies whether your computer system is capable of LBA. (The
    BIOS is where your PC hardware — such as disk drives — is configured.) Your hard
    disk may be accessed as an LBA disk. Some BIOS systems do this


    automatically the first time a hard disk with a large number of cylinders is accessed.
    Note, however, changing your disk to an LBA specification if it is not already
    LBA will make the data inaccessible. Therefore, before changing your disk back
    to LBA, you should back it up if it contains any data. (You may decide that adding
    another hard disk is not such a bad idea as an expansion strategy.)


    Different hardware systems have different ways to enter the BIOS setup. Usually,
    you can enter the BIOS setup when you turn on the power and start to boot; when
    you press the Reset button on the front of the system and start to reboot; when
    you go through the normal shutdown of your Windows system and ask it to reboot.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# 40 Part II: Installing Linux


    We strongly recommend that you put Linux on a separate hard disk for two reasons.
    First, these days you can buy multiple gigabyte hard disks for less than $100
    in U.S. currency. Second, the task of shrinking Windows small enough to allow
    Linux to reside in its full glory on an existing hard disk is difficult at best
    and impossible at worst. And splitting the Linux distribution across hard disks
    is possible, so doing so will make the distribution difficult.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_67_0.png)


    If you follow our recommendation and buy another hard disk, put it as the slave
    drive on the first IDE controller or as disk 1 on your SCSI controller, assuming
    that your existing Windows hard disk is the first disk on your IDE controller
    or ID 0 on your SCSI controller. Adding hard disks is a hardware task; the folks
    at the store where you buy the disk should be able to add it to your system for
    you. And while you''re there, you can ask them to tell you the details about the
    other hardware in your system.


    While installing Linux on your hard disks, you may be asked to supply the number
    of disk heads (or tracks), the number of cylinders, and the number of sectors
    per track. Most modern disk drives provide this information on a paper label on
    the outside of the drive. Some modern hard drives are set up for Windows, and
    Linux can access the number of disk heads, cylinders, and sectors.


    If you have your computer apart looking for other information (shame on manufacturers
    who don''t supply useful information), you may well write down all the hard disk
    information you can find. You should look for the number of heads, cylinders,
    and sectors. This information is used to tell the operating system where to put
    data with respect to the beginning of the disk. If you have trouble, check out
    the sections "Getting information from Windows 95 or 98" and "Getting Information
    from MS-DOS and Windows 3.1". SCSI hard disk users don''t have to supply this
    information because the SCSI controller and device drivers calculate it on-the-fly.
    SCSI hard disk owners should, however, know the size of their disks, which is
    printed on the disks or is available through the sections mentioned above.


    # Obtaining Information from Windows 95 or 98


    If you have Windows 95 or Windows 98, you can use the msd program in MS-DOS mode,
    as described in the next section, to find out about the hardware in your system.
    Much more information is available, however, through the Control Panel in Windows
    95/98. You can also find more information about this topic in Windows 95 For Dummies
    or Windows 98 For Dummies, both by Andy Rathbone (IDG Books Worldwide, Inc.).


    With pencil and paper handy, it''s time to access the Windows Control Panel and
    all that information. Follow along with these steps:'
