    ![](img/61222a84312a7aaf1d7bb493d840cde4_366_1.png)


    +   2. Enter the number of the partition you want to delete.

    This number is probably 2.


    +   3. Type p to display the partition table again.

    In this way, you confirm what you just did. A screen similar to the one shown
    in Figure D-6 appears.'
