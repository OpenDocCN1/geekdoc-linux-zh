  md: '# Chapter 9: Filing Your Life Away


    # # Granting Permissions


    Files and directories in Linux have owners and are assigned a list of permissions.
    This system of ownership and permissions forms the basis for restricting and allowing
    access to files. File permissions can also be used to specify whether a file is
    executable as a command and to determine who can use the file or command. Ownership
    and permissions are important to know even if you are the only one who uses your
    system, some commands and databases are owned by other users, including root (the
    superuser). Permissions on these files either allow or disallow you, the general
    user, to update these files.


    Using the ls command with the -l option allows you to see the file''s permissions,
    along with other relevant information, such as who owns the file, what group of
    people have permission to access or modify the file, the size of the file or directory,
    the last time the file was modified, and the name of the file.


    First, create a file with the touch command. The UNIX and Linux communities use
    the touch command for many things, one of which is to create a little zero-length
    file:


    ```

    [daddog@shamet maddog]$$ touch partytime

    [daddog@shamet maddog]$$ ls -l partytime

    ```


    The rw-r--r are the permissions for the partytime file: The owner is you, and
    the group is probably you but may be someone or something else, depending on how
    your system is set up and administered.


    You may be wondering how you can become an owner of a file. Well, you are the
    owner of any file you create, which makes sense. As the owner, you can change
    the default file permissions — and even the ownership. If you change the file
    ownership, however, you lose ownership privileges.


    To change the ownership of a file or a directory, use the chown command. (Get
    it? Chown — change ownership.) In general, you will have to root to do this.


    Suppose you''ve decided to settle down and lead a more contemplative life, one
    more line in a new profession of haiku writing. Someone else will have to plan
    the weekend spells and all-night bashes. So you give up ownership of the partytime
    file:


    ```

    [daddog@shamet maddog]$$chown root partytime

    ```


    This command changes the ownership of partytime to root. If you want to change
    it back, you can use the chown command, but you have to do it as root.'
