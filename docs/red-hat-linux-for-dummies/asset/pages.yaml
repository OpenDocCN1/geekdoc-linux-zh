  md: '# Deleting and moving text in vi


    In this section, you delete and move your text in vi. The vi editor has several
    commands for deleting. You can delete characters, words, or lines. The command
    for deleting a word is dw; this deletes the word to the right of the cursor. You
    can delete more words at once by prefacing the dw command with the number of words
    you deleted from the cursor position. For example, the command 6dw deletes the
    next six words following the cursor. Table A-2 lists additional deletion commands.


    | Command | What It Does |

    | --- | --- |

    | D | Deletes up to the end of the current line |

    | dd | Deletes the current line |

    | x | Deletes the character under the cursor (4x, 5x, and so on) |


    A handy command to remember is u, which is the undo command. You can immediately
    undo edits with this command, in the unlikely event that you make a mistake.


    The business of moving text around in the file usually requires the following
    general steps:


    +   1. Position the cursor at the beginning of the first line you want to move
    or copy.

    2. Type ma, marking that position with the letter a.

    3. Position the cursor at the beginning of the last line that you want to move
    or copy.

    4. Type mb, marking that position with the letter b.

    5. Position the cursor at the line where you want to insert the text.

    6. Type ''a, bm. if you want to move the text, or ''a,bt. if you want to copy
    the text.


    Note that the single quotation marks and period are required.'
