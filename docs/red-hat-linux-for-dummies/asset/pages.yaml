    ```


    The shell expands the wildcard to include all the filenames that match the * wildcard,
    which in this case means all files in the directory. The %# reports that eight
    arguments match the wildcard. Only four of the filenames are presented to you
    however, because you requested only four arguments — filenames in this case —
    in your shell script.


    To see that eight arguments really are on the command line, type the following
    command:


    ```

    ```

