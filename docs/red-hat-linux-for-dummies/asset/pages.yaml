  md: '# Chapter 1


    # Linux and You


    # In This Chapter


    +   - Finding out what Linux is all about

    - Discovering why Linux outperforms other systems

    - Figuring out how you can use Linux


    In 1991, Linus Torvalds, an undergraduate student at the University of Helsinki
    in Finland, got a brand-new IBM 386 PC. Dissatisfied with the operating system
    that came with the hardware, he wanted to run the UNIX system instead. UNIX, however,
    was too expensive. So Linus started his work and later recruited a team of talented
    programmers to tackle the daunting task of creating a new version of UNIX. They
    created a core operating system, or kernel, named Linux.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_38_0.png)


    As mentioned, Linux kernel development began in 1991. By the early spring of 1994,
    the first real version of Linux (Version 1.0) was available for public use. Even
    then it was running at amazing speeds in less than 2MB of RAM on Intel systems.
    This free system created all the following features found in operating systems
    costing hundreds of dollars:


    +   - Multitasking (that is, running more than one job simultaneously).

    - The ability for multiple users to work at the same time.

    - Linux uses demand page virtual memory, which stores unused portions — pages
    — of a program on disk when there is not enough memory to hold the entire program.
    Using demand page memory allows you to run programs that are much larger than
    the amount of RAM on your computer would normally allow.


    An estimated 125,000 people were active Linux users in 1994. (Because no licenses
    are issued to individual users, a more precise number cannot be determined.) In
    1997, three years later, the estimated number of Linux users was 3 million and
    climbing rapidly. By the summer of 1999, the estimates were at more than 10 million.
    This compares to approximately 200 million Windows users.'
  merge: -1
  pgno: 38
