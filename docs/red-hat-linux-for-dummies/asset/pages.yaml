  md: 'Description:

    The filesystem package is one of the basic packages that is installed on ait Red
    Hat Linux system. Filesystem contains the basic directory layout for a Linux operating
    system, including the correct permissions for thedirectories.


    If you want to see what packages an installed package depends on, then use this
    command:


    ```

    rpm -qR kernel

    ```


    It shows that the kernel package requires the initscripts package, as shown here:


    ```

    initscripts >= 3.64

    bin/sh

    ```


    # Verifying RPM packages


    The RPM can verify information about installed packages and their files. This
    is a very useful system administration tool. For instance, if you''re in doubt
    about the Samba configuration file, then you can run this command:


    ```

    rpm -V samba

    ```


    The Samba RPM package keeps a checksum and compares the state of the installed
    files against it. The command returns


    ```

    S.5...T c /etc/smb.conf

    ```


    which means the smb.conf file has been changed. Please consult the RPM man page
    for information about the meaning of the result.


    # Comparing RPM Packages to Tar Files


    Upon the advent of the RPM (and the Debian package manager on Debian Linux systems),
    Linux software was distributed via tar archives, or more descriptively as hairballs.
    The tar mechanism stores one or more files in a single file in a tar format. Typically,
    the tar file has the suffix of .tar; if the tar file is compressed, it should
    have a suffix like .tgz or .tar.gz. Using the tar-based distribution system is
    sufficient if your software does not change often and you are young. However,'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'when you need to upgrade or change software, or work with complex software-
    systems, it becomes quite difficult to work with tarballs. Rather than spending
    your life spitting up hairballs, systems like RPM greatly simplify your life.


    Some software is still distributed exclusively via tar archives. Use the commands
    described in the backup section to employ tar distributions and read any documentation
    that comes with such software. Installing tar archives in a common location is
    best so that you do not lose track of them. The /usr/local directory tree is generally
    considered to be the best location.'
  merge: -1
