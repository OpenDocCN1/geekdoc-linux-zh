  md: '# 212 Part IV: Using Red Hat Linux


    # # Waking up the little guy


    Red Hat Linux configures the GNOME File Manager to start automatically when you
    log in. The File Manager appears toward the end of the login process, as shown
    in Figure 15-1. Should you want to start it manually — after you''ve closed it,
    for instance — then choose Main Menu Button: File Manager.


    The main menu follows the familiar File, Edit, and so on format and does all the
    things that you would expect such a menu to do. The main menu below enables you
    to quickly move up one directory (Up) and redo previous moves (Back and Forward).
    It also lets you rescan a directory, go to your home directory, and change the
    way icons appear. The rescan function, for instance, is useful if you create a
    new file via a terminal screen. The file doesn''t show up in the File Manager
    until you move to another directory and return or else rescan.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_239_0.png)


    Figure 15-1: The GNOME File Manager.


    # # Putting him through his paces


    Most people use file managers to do the basics: copying, moving, and deleting
    files and such. We cover these things here and leave the rest (advanced functions)
    for you to explore on your own.


    # # Moving files and directories


    Moving a file or directory is as simple as clicking it and holding down the mouse
    button, and then dragging the mouse cursor over the directory that you want to
    move it to. Release the button, and you have moved your file or directory.'
  merge: -1
  pgno: 239
