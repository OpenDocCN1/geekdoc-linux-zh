    In Step 1, we mentioned the environment. A shell operates in an environment just
    like humans live and work in an environment. We expect to have and use certain
    things in our human environment. Suppose you leave your office for a few days,
    and someone else steps in to use it. At first, this newcomer uses your environment
    as you arranged it. The person appreciates the fact that the phone works, office
    supplies are in the desk, and so on. But after a while, the newcomer starts moving
    things, and maybe even drinking caffeinated coffee out of your coffee mug! When
    you come back from your trip, everything is changed. You can''t finds easily,
    and stuff is growing in the bottom of your mug. Wouldn''t it be nice if the person
    left the office (your environment) exactly as you had arranged it?


    Bash creates an environment for commands to operate in. When a new command is
    executed, bash creates a clean copy of the environment, executes the command in
    it, and then throws away that environment, returning to the environment it started
    with.


    Now look at a more complex example than just the one command ls -l *:


    ```

    cd /usr/lib

    ls -l * | more

    ```


    In this case:


    +   1. bash creates a new environment for the ls command to be executed and determines
    what should be the input (called standard input in technical jargon) and the output
    (called standard output in nerd-speak) to the command. You can call this new environment
    child number 1; the old environment is its parent.


    +   2. bash creates another environment for the more command to be executed, called
    child number 2, and determines what should be input and output to the more command.
    Because the pipe | symbol is used between the ls -l * command and the more command,
    the output of the ls -l * command is sent to the input of the more command. The
    output of more is sent to the output of the parent bash shell. The parent shell
    is the one into which you have been typing commands and information, and the output
    of that original bash shell is the screen.


    +   3. bash expands * to match all the filenames in that particular directory,
    as before.


