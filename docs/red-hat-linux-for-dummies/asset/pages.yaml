  md: '# Chapter 20: Ten Problem Areas and Solutions


    To correct this problem, use the chown and chgrp commands to change the ownership
    of the lembree home directory to lembree and to change the group ownership of
    the lembree home directory to users:


    ```

    chown lembree ~lembree

    chgrp users ~lembree

    ```


    Make you replace the lembree login name that we use in this example with the login
    name you are having difficulty with.


    # I Don''t Know How to Make the X Window System Start at Boot Time


    **Problem:** You don''t want to have to log in to a command-line mode (such as
    DOS) and then type start. Instead you want to log in through X Window System.


    **Solution:** We set up our machine so that it starts in character-cell mode and
    then allows us to switch to X Window System (Many times, we want to only make
    a simple edit or look at something on the system, and logging in without X Window
    System is simply faster.) If you like to see a graphical interface from the beginning,
    do the following. In the /etc/inittab file, change this line:


    ```

    id:3:initdefault:

    ```


    to this:


    ```

    id:5:initdefault:

    ```


    Save your changes and reboot. X Window System starts at the end of the boot process,
    and you can then log in through the graphical interface. To go back to the old
    way of booting, change the line in the /etc/inittab file back to the following:


    ```

    id:3:initdefault:

    ```


    and reboot the machine.


    # I Never Seem to Have the Correct Time


    **Problem:** When you boot Linux the time is wrong, so you set it with the date(1)
    command. Then you boot Windows and its time is wrong, so you reset. When you reboot
    Linux, its time is wrong again.'
