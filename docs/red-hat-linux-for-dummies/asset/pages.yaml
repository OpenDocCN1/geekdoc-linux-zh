  md: '# Chapter 18: Skiing the Web 271


    # Skiing with good bindings


    Before you start to ski the Web, you need the proper bindings. To navigate to
    a Web page, you type in or click a URL (Uniform Resource Locator). After you know
    URL, you can easily go from there to other places on the Web. URLs look like this:


    ```

    http://www.li.org/

    ```


    or this:


    ```

    www.li.org/

    ```


    All major browsers let omit you the http:// Some browsers also allow you to omit
    the trailing slash (/), unless the final segment is a filename.


    URLs are usually underlined on Web pages. The underline indicates that the text
    is a hyperlink, which means you can simply click the underlined text to go to
    that. If your browser


    doesn''t take you to that location, one of the- following is usually the reason:


    +   - The URL is old, and the page to which it is pointing no longer exists.


    +   - The server system that the page is on is operative. You may see the message
    The server is down.


    +   - The server system is running, but it''s handling too much of a load because
    too many users are trying to access that page. This problem occurs, for example,
    when the Sports Illustrated server puts up the swim-issue.


    +   - Your network connection went down, from your ISP or ISP to the requested
    Web site.


    When skiing the Net, be patient. Even on the best days, downloading certain pages
    can take several minutes.


    # Connecting to the Internet


    After you''ve configured your browser properly, you can connect to the Internet
    by typing the following in a terminal window (start a terminal window — also known
    as a terminal emulator window — by clicking the icon that looks like a computer
    monitor on the GNOME menu bar:


    ```

    /bin/ifup ppp0

    ```


    You have to wait a few seconds (or even a minute) to connect with your ISP (hearing
    the sound of your modem dialing is a good sign). Try ping gatekeeper.com to make
    sure that you are connected (the ping command sends a very simple IP packet and
    listens for the response:


    ```

    ping gatekeeper.dec.com

    ```'
