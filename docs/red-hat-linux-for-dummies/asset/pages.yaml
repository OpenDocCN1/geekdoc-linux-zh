  md: '# Teaching GNOME Some Tricks


    GNOME performs all of the basic graphical functions that you expect a GUI to

    do. You can move windows, resize them, and minimize them and such. This

    section describes these basic functions.


    Before doing something to a window, however, you have to get its attention.

    When a window has your attention, it''s said to have *focus*.


    Depending on how you''ve set up GNOME, you can give a window focus with

    GNOME in several ways:


    +   - Click the window''s name, which is in the icon bar at the bottom of the

    screen.

    - Click the window''s title bar, which is at the top of the window.

    - Click the window itself, which typically also makes the window the top-most
    one.

    - If you''re working in an office with many people, then you can shout,

    "Hey you, wake up!"


    We''ll stick with the Red Hat/GNOME default of having to click a window to

    focus it.


    # Moving day


    To move a window, click and hold the left mouse button anywhere on the title\ubar.
    As long as you hold the left mouse button, the window can move

    anywhere that you move your mouse. Release the button and the window will

    stay there. Note that the title bar is the "bar" along the top of any window

    where the window name is located.


    # Resizing to your heart''s content


    Sometimes a window is a little too big or a little small. Life would be

    easier if you could nudge that window into shape. To do that,

    you can position your mouse cursor on either the lower left or right corner of

    a window until the cursor changes into a double-sided arrow. Left-click the

    mouse and pull the window''s outline to your desired size. Release the mouse

    button and your window takes the new size.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Part IV: Using Red Hat Linux


    Another way to resize a window is to click the far upper left-hand corner. A menu
    appears. Click the Window Size submenu and another menu appears that allows you
    to toggle either height, width, or entire window between its normal (default)
    size and the entire desktop.


    # Making a molehill out of a mountain


    You can minimize (iconify) by clicking on the bold, underscore button towards
    the upper-right corner. Doing this removes the window from the desktop and places
    it in a storage area on the right-hand side of the Panel.


    Now that I have you clicking away through the menu, do you want to know an easier
    way to minimize a window? Look back at Figure 14-7. See those squares in the title
    bar? Click the one that is third from the right (it looks like an underscore character)
    and your program is minimized.


    # Making a mountain out of a molehill


    You can return the window to the desktop by clicking on the icon that corresponds
    to the window on the Panel. You also have the option of completely closing the
    application by right-clicking its icon in the Panel and choosing either Close
    or Nuke in the menu that appears. The difference between the two is that Nuke
    isn''t as nice as Close and close the program if it does not respond to the Close
    command. Nuke isn''t as nice as Close and potentially cause problems if you are
    running a program like a database that is actively manipulating data.


    You''re probably thinking, "If the underscore-looking button to the title bar
    minimizes a window, one of those other buttons probably maximizes a window." Or
    maybe you''re thinking, "I sure hope I can take a break soon." Okay, you''re first
    hunch is right. Check out those buttons to the right of the title bar. The Maximize
    button is the one in the middle; it looks like a square. It is similar in action
    to the cascade window in buttons. Stay tuned to find out about the X button to
    the right of the Maximize button.


    # Closing Your Windows


    Now that you''ve put a lot of windows on the screen, how can you get rid of a
    few or all of them? Well, you can put them in the background by reducing them
    to icons, or you can be more drastic and kill them. Here are a few ways to do
    so:


    +   * First, take advantage of any exit buttons or menu options that the application
    gives you.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Chapter 14: Getting to Gnow GNOME and X


    +   - Click the Close button (the X), which is in the upper-right corner of the
    window''s title bar, to kill the window.

    - Click the upper-left corner of the window and then click either the Close or
    Annihilate options in the menu that appears.

    - Close attempts to contact the application and ask it nicely to stop itself.
    Annihilate doesn''t care what the application thinks and stops it immediately.

    - Click the Title bar to get to the menu described in the previous two steps.
    The menu works exactly as described in those steps. This is just another way to
    get to it.


    # Going out to lunch


    You can save the time of logging out of your X/GNOME desktop by using the screen
    lock. Click the Main Menu Button and choose Lock Screen and the screen saver is
    displayed. To return to productive life and your desktop, press any key, or wiggle
    your mouse and then enter your password in the X Screensaver window.


    # Locking up the shop


    When you''ve finished for the day and want to go home (or just upstairs) you need
    to log out. Click the Main Menu Button* Log out. The Really log out? screen appears;
    click Yes to finish your day.


    You also have the option of using this window to halt or reboot your Linux computer.
    A root password prompt appears before the computer is halted or rebooted.


    # Stopping X


    When you can''t get your applications to respond to you, you can simply stop the
    X Window System, which will kill all the programs running under it. To stop the
    X Window System, press the Ctrl+Alt+Backspace keys all at once. If you started
    X manually, you can then log out of the account. If X is started automatically
    at boot time (as this book assumes), then you will get the X login screen and
    you can log back in.'
