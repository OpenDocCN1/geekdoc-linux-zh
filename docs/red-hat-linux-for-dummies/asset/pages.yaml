  md: '# Part III: Just the Dismounting


    # Mounting and Dismounting


    Files are important to Linux and other UNIX-like operating systems in ways that
    are different from their importance to DOS, Windows, and Macintosh operating systems.
    In Linux, everything is stored as files in predictable locations in the directory
    structure — Linux even stores commands as files. Like other modern operating systems,
    Linux has a tree-structured, hierarchical, directory organization called a file
    system.


    All user-available disk space is combined in a single directory tree. The base
    of this system is the root directory (not to be confused with the root user),
    which is designated with a slash, /. A file system'' contents are made available
    to Linux by merging the file system into the system directory through a process
    called mounting. This is just like mounting a horse except that no horse is involved.


    File systems can be mounted or dismounted, which means that file systems can be
    connected or disconnected to the directory tree. The root file system, which is
    always mounted on the root directory when the system is running and cannot be
    dismounted. Other file systems may be mounted as needed, such as ones contained
    on another hard drive, a floppy disk, or a CD-ROM.


    # Mounting a file system


    Here''s the command syntax for manually mounting a file system:


    ```

    mount block-special-file mount-point

    ```


    Block-special-file is the device driver file for the partition of the disk drive
    (such as a hard drive or a CD-ROM drive) where you have created a file system,
    and mount-point is the directory where the file system is mounted. Want to see
    the mount command assign the first floppy drive, /dev/fd0, to the /mnt directory?
    Hey, did we promise you a good time or when?


    ```

    mount /dev/fd0 /mnt

    ```


    ![](img/61222a84312a7aaf1d7bb493d840cde4_197_0.png)


    A file system can be mounted in only one place at any given time. The directory
    where the file system will be mounted (mount-point) must exist before you issue
    the mount command. Otherwise, the command won''t work. If you need to create the
    directory, use the mkdir command, like this:


    ```

    mkdir /canadianpolice

    mount /dev/fd0 /canadianpolice

    ```


    The first command makes a new directory called /canadianpolice. The second command
    mounts /dev/fd0 — the file system on the disk in the floppy drive — onto that
    directory.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Chapter 12: Managing the Linux System


    # 171


    ![](img/61222a84312a7aaf1d7bb493d840cde4_198_0.png)


    A directory that is used as a mount point is just like any other directory. It
    can store files and other directories. However, any files or directories that
    are stored in a directory that is used as a mount point will not be visible or
    usable until the file system mounted on that directory is unmounted.


    When you''re finished or fed up with the file system that you mounted on /canadian/police,
    you must dismount it by using the umount command. The syntax for the umount command
    is


    ```

    umount name

    ```


    where name is either the name of the block-special-file (/dev/ld0) or the name
    of the directory is the mount-point (/canadian/police).


    # Sleuthing for other file users


    Because Linux is a multiuser operating system, sometimes more than one user is
    logged into the system at the same time. If this is the case, multiple file systems
    might be mounted and in use. The umount command works only on inactive file systems.
    If one of the files in the file system is open or the file system is the current
    directory, an error message says that the device is busy.


    How do you find out which files are being used and by whom? You use the fuser
    command. (Get it? Find user — fuser.) This command returns a lot of information,
    identifying which processes are using a particular file or file system and which
    user is using them. If you use fuser with a filename, it returns information on
    just that file. If you invoke fuser with the block special filename, fuser reports
    on all the files in that file system.


    The fuser command has two options that you may find useful:


    +   - displays user names among process IDs.

    - enables you to specify the file system by name.


    fuser is a character-cell, or text-based, program. By running fuser with the -u
    option, you can get the process number of programs using the file system, with
    the name of the person using them those programs. For example:


    ```

    [maddog@shamet p3ch9020]$ /usr/sbin/fuser -u /home/

    504r(maddog) 503r(maddog) 580r(maddog)

    581r(maddog) 585r(maddog) 586r(maddog)

    598r(maddog) 599r(maddog) 601r(maddog)

    879r(maddog) 1287r(maddog)

    [maddog@shamet p3ch9020]$

    ```'
