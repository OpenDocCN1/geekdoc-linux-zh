    ```


    the file /etc/passwd is output to standard output, which in this case is the screen.


    When you reexecute the preceding command by typing !!, you can also send the output
    to the sort command using the pipe symbol:


    ```

    [maddog@shamet maddog]$ !! | sort

    cat /etc/passwd |sort

    [maddog@shamet maddog]$

    ```


    Linux pulls the /etc/passwd file from the disk and passes it to standard output,
    feeds it into the standard input of sort, and then outputs it to the screen in
    sorted fashion.


    The shell also makes use of the up-arrow and down-arrow keys to reuse commands.
    The up-arrow sequentially returns commands starting from the most recent. The
    down-arrow, surprisingly, goes forward in time. This is bash''s most convenient
    function.


    This history command displays all the commands that you have used up to the Red
    Hat of 1,000. You can use the history command to perform a sort of archaeological
    dig. For instance, if you want to see all the commands of a certain type that
