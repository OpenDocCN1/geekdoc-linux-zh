  md: 'These six letters, and some symbols such as = and commas, are put together
    into a specification of how you want to set the file''s permissions.


    The command for changing permissions is chmod. The syntax for the command is


    ```

    chmod <specification> filename

    ```


    Change the mode of parttime to give the user the ability to read, write, and execute
    the file:


    ```

    chmod u=rwx parttime

    ```


    That was easy enough, wasn''t it? If you want to give the group permission to
    only read and execute the file? You would execute the following command:


    ```

    chmod g=rx parttime

    ```


    Note that this last command does not affect the permissions for owner or other,
    just the group''s permissions.


    Now set all the permissions at once. Separate each group of characters with a
    comma:


    ```

    chmod u=r,g=rwx,o=rwx parttime

    ```


    This command sets the user''s permissions to just read, the group''s permissions
    to read and write, and the other''s permissions to read, write, and execute.


    You can set the permission bits in other ways. But this way is so simple, why
    use any other?


