    3. Next, bash searches the PATH environmental variable looking for a command called
    ls. The PATH variable holds the names of directories that contain commands you
    may want to execute. If the command you want is not in the list, you must explicitly
    tell the shell where it can find the command by typing either a complete or relative
    pathname to the command.


    ```

    ls -l *

    ```


    to the ls command, it looks like you typed


    ```

    ls -l ert opgt uity wert

    ```


    Note that the shell puts the names in alphabetical order before giving them to
    the command.'
