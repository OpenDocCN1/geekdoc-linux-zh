  md: '# 240 Part IV: Using Red Hat Linux


    ![](img/61222a84312a7aaf1d7bb493d840cde4_267_0.png)


    Figure 15-6: The Applware Tutorial Lesson & Exercise window.


    # # Applying more functions with Applix


    Applware provides many more desktop functions. The following list outlines Applware''s
    capabilities.


    +   - **Spreadsheets.** Spreadsheets is a full-featured spreadsheet program. It
    is similar to other tools. If you are familiar with spreadsheet software, then
    Spreadsheets should be straightforward to use.

    - **Graphics.** This program gives you the ability to create simple drawings.
    We used it to create several figures in this book.

    - **Presents.** You can create slides and general-purpose presentation graphics
    with this tool.

    - **HTML editor.** The HTML editor is very simple in its purpose: building Web
    pages. You can edit what you want on the screen, and Applix saves it in HTML form.
    The process is as simple as: You enter it, and edit it, and Applix converts it.

    - **SQL database viewer.** If you work with SQL databases — such as Oracle, Informix,
    Sybase, or Linux''s native son, postgresql — then this tool allows you to view
    and edit the data. Your database must be ODBC-capable in order to use this tool.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Chapter 16: Using Linux as Your Workstation


    +   - E-mail client. Applisoft Office also provides an e-mail client. However,
    you''ll probably want to stick with the Netscape Messenger client, if only to
    minimize the number of software packages you use. Nothing is wrong with this tool,
    but if you''re like us and run the Netscape Navigator browser constantly, then
    you may well use Messenger for e-mail.


    # A StarOffice Is Born


    StarOffice is not a Hollywood acting agency but another desktop productivity suite,
    offered free of charge by Sun Microsystems. It provides all the functions you''d
    expect from such software: word processing, spreadsheets, graphics, and more.
    Our early opinion is that it has more of the look and feel of Microsoft Office
    97 than Applisoft Office. You can read all about it if you pick up a copy of StarOffice
    for Linux for Dummies by Michael Meadhra (published by IDG Books Worldwide, Inc.).


    You can download StarOffice free or order a CD-ROM copy for $9.95 from Sun''s
    Web site at http://www.sun.com/products/staroffice/get.html. Of course, you can
    download the free personal-edition copy, you need to connect to the Internet (which
    we describe in Chapter 17). After you''re connected, check it out.


    # Who''s Number One?


    Who is better? That question is best left to personal taste and opinion. We have
    used Applisoft extensively in the last six months but have just started using
    StarOffice. We can claim ignorance and reasonably bow out of any decisions. You
    can find an informed opinion by checking out StarOffice for Linux for Dummies.
    You can also find a good comparison of Applisoft and StarOffice in issue 54 of
    the Linux Journal. The article is posted at www.linuxjournal.com/issue54/3080.html
    and was written by Fred Butzen who is the co-author of The Linux Network (IDG
    Books Worldwide, Inc.).


    # But What about Corel WordPerfect?


    Last, but not least, is the venerable WordPerfect. The former king of DOS word
    processing is a prominent Linux player. Corel provides a word processor and an
    HTML editor, but WordPerfect is not an office suite like the other systems. We
    used WordPerfect briefly a couple of years ago, but for reasons unrelated to its
    usefulness, we didn''t spend enough time with it to gain an opinion. You can download
    a free copy from linux.corel.com/linux8/download.htm.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 242 Part IV: Using Red Hat Linux


    # A Window on Linux


    One of the really useful tools that we currently use is Microsoft''s Windows NT
    Server 4.0, Terminal Server Edition, with Citrix''s MetaFrame. This product displays
    a full-featured Microsoft Windows desktop on your Linux computer. Applications
    actually run on a Windows NT server but displays on your Linux computer as an
    X window. You get a virtual Windows NT box running in your Linux box.


    Paul uses a Linux computer as his only personal workstation at his job. Most of
    what he needs to do can be done with Linux. However, certain functions, like his
    company timesheet, can run only on a Windows computer. By using MetaFrame/Terminal
    Server, Paul does not need to have a second computer or to bug his coworkers.
    He fires up his MetaFrame client window, connects to the server, and — voilà —
    he has a Windows box within his Linux box. No muss, no fuss.


    You can download Citrix''s client program from the company''s Web site at www.citrix.com.
    Citrix provides a simple Internet-based NT server for demonstration purposes.
    The Web site offers full instructions.


    # Days of Wine and Roses


    Wine stands for Windows Emulator. It converts Windows API functions into their
    X Windows System equivalents. You can run Windows executables on Linux. Pretty
    sweet.


    The Wine home page address is www.winehq.com. This site contains not only the
    latest versions and updates, but also several FAQs. An alternative site is winebin.netpedia.net.
    You can download Wine in RPM format from www.cse.psu.edu/~juran/wine/.


    # Applications Galore!


    The list of Linux applications is growing rapidly. Red Hat maintains a Web page
    for information on Linux applications. The address of that page is www.redhat.com/appindex/index.html.


    Currently, that Red Hat lists applications in the following areas:


    +   - Database

    - Networking'
  merge: -1
  pgno: 269
- img_proc: true
  md: '+   - Games

    - Office Apps and Suites

    - Graphics

    - Groupware

    - Programming and development

    - Math & Science

    - Servers

    - Multimedia

    - X Window System

    - Miscellaneous


    You can find programs for every major area of interest on this page — systems
    like Oracle, Apprixware, and StarOffice. This list is constantly growing and is
    a good indication of the overall health and future direction of Linux.'
