- img_proc: true
  md: '# Chapter 17: Setting Up Your Internet Connection 263


    To activate your firewall, follow these steps:


    +   1. Connect your Linux computer to the Internet:


    ```

    /etc/sysconfig/network-scripts/ifup-ppp

    ```


    +   2. After you''re connected, turn on the firewall:


    ```

    /usr/local/etc/firewall.rules

    ```


    +   3. Try using the Net to connect to a Web site with Netscape Communicator.

    Everything should work as usual.


    +   4. Next, look at the rules that you set up. Enter the command


    ```

    pchains -L

    ```


    You should see a list, as follows:


    Chain input (policy DENY): destination ports

    target prot opt source destination ports

    ACCEPT all -- anywhere anywhere n/a

    ACCEPT all -- anywhere anywhere n/a

    ACCEPT tcp  -ly- anywhere anywhere any ->any

    ACCEPT udp -- anywhere anywhere domain ->any

    Chain forward (policy DENY):

    Chain output (policy DENY):

    target prot opt source destination ports

    ACCEPT all -- anywhere anywhere n/a

    ACCEPT all -- anywhere anywhere n/a

    ACCEPT tcp  -ly- anywhere anywhere any ->any

    ACCEPT udp -- anywhere anywhere any ->domain


    The first chain (which is simply a set of rules used for a common purpose or function)
    is for incoming — or — IP packets. You can see that the default policy is to deny
    all IP packets. The first two rules allow all loopback (lo) and Ethernet (eth0)
    interfaces. The next rule allows the return packets from outgoing connections
    to come back in. The last rule allows the incoming UDP packets, which are used
    for service name (DNS).


    The next chain — forward — denies all packets from being forwarded through your
    Linux computer. Forwarding is only necessary if you use your computer for routing
    or other advanced networking functions.


    The last chain — output — defines what IP packets are allowed out of your computer.
    The first two rules are for your lo and eth0 interfaces again and allow all internal
    traffic. The next rule allows any and all IP packets destined for the Internet
    to leave through the firewall. The last rule allows domain (DNS) packets to go
    out to the Internet.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# 264 Part V: Going Online


    You can make your ipchains rules tighter by allowing only certain types of packets
    out to the Internet. You can specify certain ports and addresses that are allowable,
    for instance. This makes your firewall incrementally safer but also more restrictive.


    To test your firewall, follow these steps:


    +   1. Try to Telnet to your ISP or University account; any computer account that''s
    external to your own computer will do.

    (Telnet is a network program that allows you to connect to a remote computer via
    and interactively entering commands.)


    +   2. After you''re logged in your account, try connecting back to your Linux
    computer.

    nYou can find out what your temporary (dynamic) IP address is by entering the
    following command from your external account if it is a Linux or Unix computer:


    ```

    who | grep <myloginname>

    ```


    This command should show an IP address in numeric form. For instance:

    iamme (192.168.1.250) ...


    Please note that the IP address has been changed to protect the innocent. The
    address is what is known as a public address and will (should) never exist on
    the Internet anyway.


    +   3. Try to Telnet back to your Linux computer:


    ```

    telnet 192.168.1.250

    ```


    If your firewall is set up correctly, nothing should happen. If you turn off your
    firewall, however, then you should be able to log into your Linux computer.


    This firewall is simple and effective. But it by no means the last word in Internet
    or any other type of security. It will do what it means to: allow you to access
    the Internet but not allow the Internet to access you.


    For more information, search the Internet for security-related topics. The SANS
    (www.sans.org), UNIXIX (www.usenix.org), Red Hat (www.redhat.com), and CERT (www.cert.org)
    Web sites are all good places to start. The companion-ROM (CD1) also has some
    good HOWTO documents on the subject. Numerous books also deal with security, including
    Linux Network Toolkit, by Paul Sury and Red Hat in Small business, by Paul Sury
    and Eric Harper (both published by IDG Books Worldwide, Inc.), which provide introductory
    to intermediate discussions on the subject. They provide more in-depth IP filtering
    rules (Hey, Paul''s plugging his owns out*) What can we see?


    ![](img/61222a84312a7aaf1d7bb493d840cde4_291_0.png)'
