    # Creating a partition


    Now you come to the big part, the part you''ve been waiting for, the actual creation
    of the new partition (or partitions if you''ll have more than one).


    After you tell the fdisk program that you want to create a partition, you tell
    the program the following:


    +   - The type of partition you want to create

    - Which partition you want to create

    - Where the partition should start on your disk

    - How big the partition should be


