  md: '# 226 Part IV: Using Red Hat Linux


    First, you need to make sure that Linux recognizes the CD-ROM drive when you run
    xplaycd, the CD player program. Type the following:


    ```

    cd /dev

    ln -s device cdrom

    ```


    where device represents the place in the Linux file system where your CD-ROM drive
    resides. We typped this:


    ```

    cd /dev

    ln -s hdc cdrom

    ```


    The ln (link) command with -s (symbolic) creates a symbolic link from cdrom in
    /dev to hdc in /dev.


    If you have a SCSI CD-ROM drive, your command may be as follows:


    ```

    ln -s scd0 cdrom

    ```


    Creating the symbolic link is all that you should have to, but Red Hat V5.1 requires
    that you follow a few more steps. Like a lot of programs in Linux, xplaycd is
    a work in progress. It has a small feature (that is, bug) in which it writes information
    to one place and reads it from some other place. To correct this problem, type
    the following commands as root (or superuser):


    ```

    cd /usr/local/lib

    mkdir cddb

    chmod 777 cddb

    ln -s cddb /var/lib/cddb

    ```


    All you need to do now is run xplaycd. You can do this by typing xplaycd into
    a terminal emulator, such as xterm, or by choosing Start Programs> Utilities>
    XPlayCD. With either method, a window like the one shown in Figure 15-15 appears.


