  md: '# 154 Part III: Just the Basics


    First, look at the following entry in the passwd file:

    maddog:eyrtuwir:500:500:Red Hat Linux

    User..../home/maddog:/bin/bash


    Each grouping of characters by the colons is called a field. For the report, you
    want only the first and fifth fields. The cut command is the way to go. The man
    page for the cut command shows that the command to get the first and fifth fields
    is as follows:


    ```

    cut -f 1,5 -d:/etc/passwd

    ```


    The man pages are terse but complete descriptions of commands. To get to the man
    page for the cut command, type man cut on the command line.


    You use the -f option for the cut command to list the fields you want printed,
    in this case the first and fifth fields. You use the -d option to specify the
    delimiter for the field, which in this case is a colon. The preceding command
    gives lines of output formatted like this:


    ```

    maddog:Red Hat Linux User,...

    ```


    Maybe you''d prefer to replace the colon with a hyphen, adding a space on each
    side to make the report easier to read. The stream editor is your ticket to formatting
    happiness. You can send the output of cut directly to sed with the following command
    line:


    ```

    cut -f 1,5 -d:/etc/passwd | sed -e ''s/:/ /'' - /

    ```


    The pipe symbol, |, takes the output of the cut command and feeds it to the sed
    command. Look at the part of the command line to the right of the pipe symbol,
    and you can see that the -e option of the sed command tells the man to use the
    next string of characters (in this case, what appears between the two apostrophes,
    or single quotation marks) as a command for the sed stream editor (The command
    here is basically the s command in ed and text editors, which you can read about
    Chapter 9). The command finds the string of characters between the first and second
    slash marks and replaces them with the characters between the second and third
    slash marks


    Note the single quotes around ''s/:/ /''. These quotes instruct the sed to think
    of the entire string of characters as one thing, and to present the string to
    the sed editor as the thing it has to work with. Without the quotes, the shell
    would exclude the blanks in the string that three different fields are in that
    string of characters: s/:/ /, -, and /. In shell statements, unquoted blank space
    (called white space) is considered a separator.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_181_0.png)


    ![](img/61222a84312a7aaf1d7bb493d840cde4_181_1.png)'
