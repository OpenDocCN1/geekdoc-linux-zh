  md: '# # Appendix A


    # # Using vi


    Anyone who writes a Linux book needs a good editor. But the editor that we''re
    talking about is a text editor — the ubiquitous vi — not the tweedy, frazzled,
    publishing professionals who struggle mightily with books. Text editors give you
    the ability to add, delete, search, and move text — everything from thousands
    of lines of text right down to a single character.


    Text files are usually updated with word processors, but every once in a while,
    you may have to go in and update a file with a text editor. In addition, text
    editors create small, compact files of characters, which are still the cheapest
    way to send e-mail and store character data on disk.


    # # Defining Text Editors


    A text editor is an essential tool for Linux. It enables you to create and modify
    an array of text files, including the following:


    +   - User files, such as the logon file

    - System configuration files, such as /etc/stab, /etc/inittab, and /etc/lilo.conf

    - C and C++ programs

    - Shell programs

    - Mail messages


    ![](img/61222a84312a7aaf1d7bb493d840cde4_328_0.png)


    Linux comes with one but two text editors: ed and vi. The ed editor is a line-oriented
    text editor. It was one of the first editors for UNIX systems and traditionally
    is included with every UNIX and Linux system. It''s also a small editor, so small
    distributions of UNIX and Linux can include it. You can always count on ed being
    there.


    The second editor that comes with Linux is vi; it''s included with almost every
    Linux distribution (some specialized distributions as aslinux don''t necessarily
    include it). This full-screen editor also supports the command set of'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 302 Part VII: Appendixes


    a line-oriented editor named ex. The third major text editor for Linux is emacs;
    some people prefer to use this editor for most of their work.


    In Linux, ex and vi are emulated by another text editor named vim. The commands
    for vi work just fine with vim. In addition, vim has more capability than vi.
    For instance, vim makes editing easier by allowing you to switch from command
    to insert mode and still move around the file with the cursor keys. On the other
    hand, vi forces you to continually toggle between the two modes to insert text
    and move around the file. Therefore, vi isn''t included as a separate program
    with Linux systems. When you type v1, you''re really using vim, but this fact
    is invisible to you.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_329_0.png)


    # Introducing vi


    The vi editor on your Linux system is really the vim editor. With a little vim
    and vigor, you can invoke it by using vi, because a symbolic link exists between
    vi and vim.


    Like the ed editor, the vi has two modes of operation and the same type of single-letter
    commands. To start vi, you type vi at the command line. The screen clears, and
    the left-most column displays ইচ্ছে (-). You are looking at an empty, unnamed
    buffer in memory, which you can enter text until you save the text to a named
    file.


    You can start the vi editor in a number of ways, with different options, but the
    most common way to start vi is with only a lifename as the argument, like this:


    ```

    vi tore.and.linus

    ```


    where tore.and.linus is the name of either an existing file that you want to edit
    or a new file that you want to create.


    The vi editor has three modes of operation:


    +   * Visual command mode

    * Colon command mode

    * Text mode


    When you invoke vi with a filename, the editor screen appears. At the bottom-left
    corner is the following line:


    ```

    "filename" [New File]

    ```


    This status line tells you what the editor is doing. In this case, the editor
    has opened a buffer, and the save and quit saves the contents of the buffer to
    the filename file. If you did indeed invoke vi with the following command:'
