  md: '# A shell for all seasons


    When Ken Thompson and Dennis Ritchie first started writing UNIX, they wanted to
    investigate lots of new ideas in using computers. One of the ideas they explored
    was making the human interface to the computer changeable and adaptable to the
    specific needs of the application.


    This interface (or more specifically, humans interact with it) is typically called
    a command interpreter because it looks at each command as it is typed and converts
    it into something the computer can follow as an instruction. Most computer systems
    then had the command interpreter built into the operating system, which meant
    the user couldn''t change it. (DOS is created this way.) The UNIX developers wanted
    to separate the command interpreter from the rest of the operating system. Because
    the functionality desired was both a command interpreter and a complete environment,
    it was called a shell. The first command interpreter for UNIX was the Bourne shell,
    abbreviated sh.


    Later, UNIX was acquired from Bell Labs and tied to the University of California,
    Berkeley, the developers decided to extend the shell. They made it more of a programming
    language and included some features in the C. The resulting shell was the C shell,
    abbreviated sh (pronounced "sea," of course).


    Both the Bourne and the C shell existed for many years. The Bourne shell was available
    on both System V and Berkeley-based systems. The C shell was used only on Berkeley
    systems — AT&T was paranoid about having a shell on its system that was created
    by long-college students. The researchers at Bell Labs fought to add the C shell,
    and eventually it was ported to System V, too.


    Next, GNU, a collection of software based on UNIX and maintained by the Free Software


    Foundation.(GNU, by the way, stands for GNU''s Not Unix.) The GNU project decided
    it needed a shell free of royalty restrictions. Unfortunately, at the time, the
    C shell was still under restrictions from AT&T. The GNU folks decided to create
    their own royalty-free, GPLed shell. Their new shell would be compatible with
    the Bourne shell, incorporate some of the C shell idea, and have some interesting
    features. They called their shell Bourne Again SHELL.


    Meanwhile, innovation stirred at AT&T. Korn, a researcher, merged the best of
    the Bourne shell, C shell, and all others he could find, and made the resulting
    shell free for programmers by implementing several programming features. The most
    notable addition was functions (which help divide large shells into smaller, easier-to-maintain
    ones). His shell was named the Korn (abbreviated ksh). Eventually, this shell
    also developed graphical features and was adopted by the Open Software Foundation
    folks as part of their Common Desktop Environment (dtksh).


    As the price of copies dropped and freely distributable versions of UNIX (netBSD,
    FreeBSD, Linux) made their way across the Internet, new shells from the old ones
    and others started to appear as:


    +   - tsch: A shell with filename completion and command-line editing

    - ash: A V-like shell

    - zsh: Like bash, but with built-in spelling correction on the command-line completion,
    among other useful features

    - pdksh: A public domain reimplementation of the Korn shell

    - Perl: Practical Extraction and Report Language'
