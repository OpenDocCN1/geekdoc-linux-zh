  md: '# Part III: Just the Basics


    # Brushing up on Linux syntax


    You''ll be seeing a lot of Linux commands, so you may find benefit from a quick
    review of the syntax of Linux commands:


    +   - Text not surrounded by [ ], { }, or < > must be typed exactly as shown.


    +   - Text inside brackets [ ] is optional.


    +   - Text inside angle brackets < > must be replaced with appropriate text.


    +   - Text inside braces {} indicates that you must choose one of the values that
    are inside the braces separated by the | sign.


    +   - An ellipsis (...) means and so on or to repeat the preceding command line
    as needed.


    You see only the files that are in your working directory. If you want to specify
    a file that isn''t in your working directory, you have to specify the name of
    the directory that contains the file, as well as the name of the file. For example,
    the following command lists the passwd file in the /etc directory:


    ```

    ls -la /etc/passwd

    ```


    # Specifying the directory path


    If the file you want to read is in a subdirectory of the directory you are in,
    you can reach the file by typing a relative filename. Relative filenames specify
    the location of files relative to where you are.


    In addition to what we tell earlier in this chapter about specifying directory
    paths, you need to know these three additional rules:


    +   - One dot (.) always stands for your current directory.


    +   - Two dots (...) specify the parent directory of the directory you are currently
    in.


    +   - All directory paths that include (.) or (...) are relative directory paths.


    You can see these files by using the -a option of the ls(1) command. Without the
    -a option, the ls(1) command does not bother to list the .. files, or any filename
    beginning with a period. This may seem strange, but the creators of UNIX thought
    that some files were normally hidden kept the directory structure cleaner. Therefore,
    filenames that are always there (. and ..) and special-purpose files are hidden.
    The types of files that should be hidden are those that the user normally not
    need to see in every listing of the directory structure (files used to tailor
    applications to the user''s preferences, for example).'
