  md: '# Chapter 9: Filing Your Life Away


    Now specify a pathname relative to where you are. For example:


    ```

    [maddog@shamet maddog]$$pwd

    /home/maddog

    [maddog@shamet maddog]$$ ls -la ../etc/passwd

    ```


    The last line indicates that to find the passwd file, you go up two directory
    levels (../) and then down to /etc.


    If you want to see the login accounts on your system, you can issue the following
    command from your home directory:


    ```

    [maddog@shamet maddog]$$ ls -la ..

    ```


    This command lists the parent directory. Because the parent directory (/home)
    has all the login directories of the people on your system, this command shows
    the names of their login directories.


    You have been looking at relative pathnames, which are relative to where you are
    in the file system. Filenames that are valid from anywhere in the file system
    are called absolute filenames. These filenames always begin with the slash character
    (/), which signifies root.


    ```

    ls -la /etc/passwd

    ```


    # Changing your working directory


    Sometimes, you may want to change your working directory because doing so allows
    you to work with shorter relative pathnames. To do so, you simply use the cd (for
    change directory) command.


    To change from your current working directory to the /usr directory, for example,
    type the following:


    ```

    cd /usr

    ```


    # Going home


    If you type cd by itself, without any directory name, you return to your home
    directory. Just knowing that you can easily get back to familiar territory is
    comforting. There''s no place like home.


    You can also use cd with a relative specification. For example:


    ```

    cd ..

    ```'
