  md: '# Appendix A: Using vi 303


    vi tome.and.linus


    the bottom-left corner displays the following line:


    "tove.and.linus" [New File]


    When you first invoke vi, you are in visual command mode, which is the default.
    You can use four special commands to either locate text or transition to more
    complex commands:


    +   / Forward search


    +   ? Backward search


    +   n Continue the search in whichever direction you were currently going


    +   : ex command (ex is the line editor included in vi)


    In command mode, the characters you type are used as commands, not as input into
    the file. To use commands, type the character on the command line. For the first
    two commands (/ and ?), the cursor moves to the bottom of the screen, where you
    type the string you are searching for. After you press Enter, the search begins.
    If you want to search for an additional string, you can just press the lower-case
    n key to re-execute the search; to search backwards press the upper-case N key.


    When you type :command, the cursor moves to the bottom of the screen and waits
    for you to enter a command or a command string. You must press the Enter key to
    execute the command.


    Given that characters you type are interpreted as commands in command mode, how
    do you get from command mode to text mode? Simple. Enter a command to do something
    in text mode, and vi takes you there. Here are some commands that you can use
    to switch from command mode to text mode:


    +   i Insert text before the cursor


    +   a Insert text after the cursor


    +   I Insert text at the beginning of the current line


    +   A Insert text at the end of the current line


    As soon as you type any of these commands, Linux puts you in text input mode.
    If you do not press Enter after entering the command, Any text you type after
    invoking the command is placed in a buffer and echoed to the screen.'
