  md: '# 84 Part II: Installing Linux


    Red Hat gives you the option of using systems like the Network Information System
    (NIS) and shadow passwords. NIS provides such systems for sharing a single password
    file among multiple computers. Shadow passwords extract the encrypted passwords
    out of the /etc/passwd file and place them in a separate /etc/shadow file. Shadow
    passwords increase the security of Linux systems, and NIS makes working and managing
    networks easier.


    The discussion of NIS is beyond the scope of this book. Using shadow passwords
    is a good idea and doesn''t cost you anything.


    # Installing Red Hat Linux Software


    The programs and files of Linux are installed as RPM packages, which are described
    in Chapter 13. Several of these individual packages may be lumped into functional
    groups. For instance, many of the networking oriented packages make up the Networked
    Workstation program gives you two choices: installing individual packages (perhaps
    saving some disk space) or installing groups.


    Unless you''ll be using Linux for a specific job, leave the Select Individual
    Packages box at the bottom of the screen black (that is, with no asterisk in it).
    You know exactly what you''re doing, trying to select individual packages isn''t
    a good idea because some parts of a package depend on others being there.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_111_0.png)


    Red Hat Software, which created the distribution, preselect certain components.
    Leaving them selected is usually a good idea, unless you specifically know you
    won''t be using them.


    Follow these steps to install the Red Hat Linux software:


    +   1. In the Package Group Selection dialog box, select all the groups and components
    to install. Then select the OK button and press Enter.


    The menu in this dialog box allows you to select orelect individual groups and/or
    packages. You can safely tab down to the OK button and press Enter to continue
    with the installation.


    If you feel lucky, use the arrow keys to maneuver through the list of groups to
    install. A group is selected when an asterisk appears next to it. To make the
