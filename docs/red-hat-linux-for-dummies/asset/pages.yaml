  md: '# 122 Part III: Just the Basics


    # The root directory


    In the tree directory structure of Linux, DOS, and UNIX, the big directory at
    the bottom of the tree, which is the parent for all the other directories, is
    called the root directory and is represented by a single / (pronounced "slash").
    From the root directory, the whole directory structure grows like a tree, with
    directories and subdirectories branching off like limbs.


    If you could turn the tree over so the trunk is in the air and the branches are
    toward the ground, you would have an inverted tree — which is the way the Linux
    file system is normally drawn and represented (with the root at the top). If we
    were talking about Mother Nature, you''d soon have a dead tree. Because this is
    computer technology, however, you''d soon have something that looks like an ever-growing,
    upside-down tree.


    # What''s in a name?


    You name directories in the same way that you name files, following the same rules.
    The only way that you can tell whether a name is a filename or a directory name
    is the way that the slash character (/) is used to show directories nested in
    other directories. For example, usr/local means local is found in the usr directory.
    You know that /usr is a directory because the trailing slash character tells you
    so; however, you don''t know whether local is a file or a directory.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_149_0.png)


    If you issue the ls command with the -f option, Linux lists directories with a
    slash character at the end, as in /local/, so you would know that local is a directory.


    The simplest way to tell whether the slash character indicates the root directory
    or directories, is to see whether anything appears before the slash character
    in the directory path specification. If nothing appears before the slash, you
    have the root directory. For example, you know that /usr is a subdirectory or
    a file in the root directory because it has only a single slash character before
    it.


    # Home again


    Linux systems have a directory called /home, which contains the user''s home directory,
    where he or she can:


    +   - Store files

    - Create more subdirectories

    - Move, delete, and modify subdirectories and files


    Linux system files as well as files belonging to other users are never in a user''s
    /home directory. Linux decides where the /home directory is placed, and that location
    can be changed only by a superuser, not by general users. Linux is dictatorial
    because it has to maintain order and keep a handle on security.'
