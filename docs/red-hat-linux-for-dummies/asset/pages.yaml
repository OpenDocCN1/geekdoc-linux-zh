    * Input or output files, which supply data or give the command a place to put
    output data, respectively


    # Regular expressions: Wildcards and one-eyed jacks


    If you had to type every filename for every command, Linux would still be useful.
    But something that makes Linux more useful is the capability to use a few special
    characters — called metacharacters, pattern-matching characters, wildcards, or
    regular expressions — to supply filenames. Just as you can substitute wildcards
    for any of your choice in a poker game, Linux pattern-matching characters can
    be substituted for filenames and directory names, much like DOS wildcards.


    Three of these special pattern-matching characters follow:


    +   * (asterisk)

    * ? (question mark)

