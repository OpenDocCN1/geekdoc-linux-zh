  md: '# Xmixer: Sounds for the rest of us


    As mentioned in the preceding section, the xplayed program controls may not affect
    the volume of the music coming from your sound card. This process is usually controlled
    by the xmixer program. Depending on how the hardware of your computer is put together,
    the xmixer program may use different inputs for the CD music. So, you may have
    to experiment a little by moving the sets of slider bars until you get the volume
    of sound you want.


    Figure 15-17 shows the xmixer window with all its buttons and slider bars. These
    controls may or may not match the capabilities of your sound card; the xmixer
    application is written for sound cards in general, as opposed to being written
    for a specific sound card.


    Note that for mixer to work, you must have a sound card, a cable must attach the
    CD-ROM drive to the sound card, and the headphones must be plugged into the sound
    card (not the CD-ROM).


    Figure 15-17: The xmixer window.


