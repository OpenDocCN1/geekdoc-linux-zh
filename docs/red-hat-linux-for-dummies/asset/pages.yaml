  md: '# 294 Part VI: The Part of Tens


    **Solution:** You can log in to Linux as root, and then type the following command:


    ```

    lilo -u

    ```


    Another solution is to boot MS-DOS or Windows 3.1, 95, 98 or NT to an MS-DOS prompt
    and type the following:


    ```

    fdisk /mbr

