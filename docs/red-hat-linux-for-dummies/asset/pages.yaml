    is called piping. The | symbol is called — you guessed it — the pipe symbol.


    # Editing the Command Line


    One of the most useful bash features is command-line editing, which is the capability
    to change parts of a command line without having to retype the entire command.
    Suppose you type the following line:


    ```

    [maddog@shamet maddog]$ ls -1 * | more

    ```


    You actually meant to use the less command, not the more command, but you pressed
    Enter anyway.


    You groan. You press Ctrl+C to halt the command. You would really like to reexecute
    the command, changing more to less, without having to type the entire command.
    Easy; just do the following:


    ```

    [maddog@shamet maddog]$ ^more^less

    ```


