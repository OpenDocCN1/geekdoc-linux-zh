  md: '# 296 Part VI: The Part of Tens


    Now suppose you create a shell or a program flobnob, and you want to execute it
    (and assuming you have set the permission bits to make flobnob executable by you).
    You have two choices (well, you have more than two choices, but I''m listing the
    safest ones). One choice is to type the following on the command line:


    ```

    ./flobnob

    ```


    This tells Linux to look in this directory (/) and execute flobnob.


    Your second choice is to move flobnob to one of the directories shown in the PATH
    variable, such as /usr/local/bin.


    # When I Start X Window System, I See a Gray Screen


    **Problem:** You configured the X Window System, but when you log in as a general
    user (that is, not as root) type startx, all you get a gray screen with a big
    X in the middle. You wait a long time, but nothing happens.


    **Solution:** First, recognize that you may have to wait a long time for a slow
    CPU with a small amount of main memory (about 8MB). Some machines with small amounts
    of memory have required as long as 6 minutes to start X Window System. But assuming
    that you are starting X Window System on a machine with a faster CPU and more
    memory, you may have problems with permissions on your home directory. This is
    particularly true if X System works when you are logged on as root (that is, as
    superuser) but not when you are logged on as a general user.


    To correct this problem, log in as root and go to the home directory of the user
    who is having problems. For this example, suppose that the login name of the user
    is member. After you are in the user''s home directory, issue the `ls -ld` command
    to see who owns that directory and what the permissions are on that directory:


    ```

    cd ~member

    ls -ld .

    drwxr-xr-- root bin 1024 Oct 31 16:00

    ```


    Note in this example, the directory is owned by root and the group ownership is
    bin, which does not allow member to have access to the directory structure inside
    the directory. Because the shells and terminal emulators that X Window System
    needs access to that directory structure, X Window System can''t fully work.'
  merge: -1
