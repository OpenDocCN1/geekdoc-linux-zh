    # Making Your Own Rules


    You, as the owner of a file, can specify permissions for reading, writing to or
    executing a file. You can also determine who (yourself, a group of people, or
    everyone in general) can do these actions on a file. What do these permissions
    mean? Read on (you have our permission) for the scoop:


    +   Read permission for a file enables you to read the file. read permission allows
