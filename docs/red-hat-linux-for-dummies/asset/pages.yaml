  md: '# # Red Hat® Linux® For Dummies® Cheat Sheet


    # A Few Good Commands


    cd directory Change the current directory to directory


    +   - ls List the directory


    +   - ls -l List the directory, with sizes, permissions, ownerships, and dates
    of files


    +   - ls -a List all files, including invisible files (files whose name begin
    with a period)


    +   - pwd Print the working directory (the one you are in)


    +   - rm file Remove file


    +   - mkdir Make a new (empty) directory


    +   - rmdir Remove an empty directory


    +   - cp Copy a file


    +   - mv Move (or rename) a file


    +   - cat Concatenate files


    +   - more Pinate a file


    +   - less Paginate a file


    +   - touch Make a new (empty) file, changing the access date of an existing file


    +   - chown Change the owner of a file or a directory


    +   - chgrp Change the group of a file or a directory


    +   - chmod Change the permissions of a file or a directory


    +   - sort Sort a file in a particular order (depending on the option)


    +   - echo Echo what is typed after the command back to the screen


    +   - date Read the date and time (without an argument); set the date and time
    (with an argument)


    +   - cut Break a file into multiple narrow rows


    +   - sed Stream editor for large files or real-time editing


    +   - ln Link a file to another file


    +   - grep Searching program that uses general regular expressions to find data,
    and then prints it to its output


