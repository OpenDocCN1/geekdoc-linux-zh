    # Edit this


    The Edit menu provides all the functions that you need, such as cut, copy, paste,
    and delete. You can also access the Find & Replace function from this menu.


    The Find & Replace menu enables you to find text strings and replace them with
    another string, if you want, or delete them. You can search forward or backward,
    where you can replace one instance as well as all instances. Options include such
    things as activating case sensitivity (the default is no case sensitivity).


