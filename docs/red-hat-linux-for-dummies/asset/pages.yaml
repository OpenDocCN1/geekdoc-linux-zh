  md: '# 130 Part III: Just the Basics


    # Moving and copying files and directories


    The commands for moving and copying directories and files are mv for move and
    cp for copy. If you want to rename a file, you can use the move command. No, you''re
    not moving the file, but in Linux (and UNIX), the developers realized that renaming
    something was a lot like moving it. The format of the command is as follows:


    ```

    mv <source> <destination>

    ```


    With your example files from the preceding section, you can move the file named
    radman to a file named bryant by executing the following command:


    ```

    mv radman

    ```


    This command leaves the file in the santa_cruz directory but changes its name
    to bryant. So you see the file was not really moved, but just renamed.


    Now moving the bryant file to the work directory. To do that, you have to first
    move the file up and then move it into the work directory. You can do it with
    one command:


    ```

    mv bryant ../work

    ```


    Note that the destination file uses the .. (or parent directory) designation.
    This command tells Linux to go up one directory level and look for a directory
    called work, and then put the file into that directory with the name bryant, because
    you did not specify any other name. If you did this:


    ```

    mv bryant ../work/supersalesman

    ```


    the bryant file would move to the directory named supersalesman. Note that in
    both cases (with the file maintaining its name of bryant or taking the new name
    supersalesman), your current directory is still santa_cruz, and all your filenames
    are relative to that directory.


    > Strictly speaking, the file still has not really moved. The data bits are still
    on the same part of the disk where they were originally. The file specification
    (the directory path plus the filename) that you use to talk about the file is
    different, so it appears to have moved.


    In early versions of UNIX, you were not allowed to use mv to move a file from
    one disk partition to another; you could only copy it by using the cp(1) command.
    Linux allows you to use the mv command to move a file anywhere. Normally, mv leaves
    the data in place and just changes the file''s name or the'
