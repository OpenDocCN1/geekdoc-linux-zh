    # Discovering What Hardware Linux Supports


    Generally, Linux runs on any computer with an Intel processor that is a 386 or
    newer, as well as on various Digital Alpha, Sun SPARC, Motorola, MIPS, PowerPC,
    and HP/PA platforms. We concentrate on Intel PCs because they represent the bulk
    of systems. If you have one of these other systems, don''t despair: They aren''t
    different, and you can properly adapt the instructions. However, you''ll need
    a different CD-ROM than the one in the back of this book, because it supports
    only the Intel line of processors.


    Linux supports symmetric multiprocessing (SMP), which means you can have more
    than one CPU (central processing unit) per computer. In fact, Linux supports several
    processors per system box. If your system has more than one CPU, Linux can also
    utilize those CPUs, either by speeding up a specific program written to take advantage
    of multiple CPUs or by allowing more programs to run at one time. (If you have
    an SMP system, would you care to trade with us?)


    The Intel processor should have the following amount of RAM (main memory):


    +   - Without graphics, Linux runs (er, walks) with 4MB.

    - With graphics, Linux runs with a minimum with 8MB of memory; 16MB, the graphics
    get much faster.

    - With 32MB, Linux screams, and the speed of the application (particularly a graphics-oriented
    program) increases dramatically.

    - Some Linux developers have 128MB in their systems because they tend to run many
    programs at a time, and each program takes up a certain amount of RAM when running.'
