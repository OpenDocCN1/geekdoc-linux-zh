  md: '# Appendix B


    # Hardware Compatibility


    The version of Linux included on the accompanying CD-ROM1 supports a wide range
    of hardware, but like other Linux distributions, it doesn''t support all types
    of hardware.


    If you''re using Windows, you can see a list supported hardware by going to the
    following directory (after you put CD-ROM1 in the system) and using your favorite
    editor to look at the Hardware-HOWTO file:


    ```

    <cdrom-drive-letter>\doc\HOWTO

    ```


    Many, if not most, computers use the D drive for the CD-ROM drive, so the command
    looks like this:


    ```

    d:\doc\HOWTO

    ```


    Or, if you''re using Linux, mount the CD-ROM by using the following command:


    ```

    mount /dev/cdrom /mnt/cdrom

    ```


    Then go to the following directory:


    ```

    more /mnt/cdrom/doc/HOWTO/Hardware-HOWTO

    ```


    to view the file; press the spacebar after viewing each page.


    These suggestions don''t help, however, if you''re in a store right now — or you
    don''t have your system up and running yet — and are trying to determine whether
    Linux will run on your system. For these reasons, we provide this appendix.


    We have made every attempt to present correct material in this appendix. Some
    equipment we''ve listed, however, may not work with Linux. In addition, new hardware
    is introduced all the time, and some of it may work with Linux but not be listed
    here.


    The information in this appendix was taken from the Linux Hardware Compatibility
    HOWTO by Patrick Reijnen and the PCMCIA HOWTO by David Hinds.'
  merge: -1
