    # Setting Up Your Sound System


    Imagine that you''re sitting alone, working at your computer. Feeling lonely?
    Want a little company? Well, we can''t provide a pal, but we can show you how
    your system can provide some tunes.


    First, we assume that your computer has a working sound card installed, and that
