  md: '# Modems


    Modems are simple things on the surface. They are either external to your system
    and plug into an existing serial line, or they are internal to the system and
    look like another serial line to the system. Alas, some modems are made for only
    Windows and therefore do not work with Linux. These modems are generally known
    as WinModems or Windows modems. Keep clear of them.


    # Mice


    Here is another case where you might say "Surely I shouldn''t have any mice issues
    to worry because they''re so simple." Well, when start thinking of the varies
    of mice and men, we know that nothing is simple. Linux supports the following
