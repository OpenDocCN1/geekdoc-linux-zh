  md: '# Living with Floppy Disks


    Floppy disks are treated a little differently than hard disks, mostly due to their
    size and fragility. They are not normally mounted and used for hours and days
    on end to hold gigabytes of data. More often, floppy disks are used to transfer
    data to other computers or to back up a few files.


    Although you can create Linux file systems on floppy disks, using them in other
    ways is more advantageous. For example:


    +   - Floppy disks can be mounted as DOS file systems, which can then be accessed
    with the standard Linux utilities such as cp and ls.

    - Floppy disks can be used as raw devices with commands such as tar and cpio.

    - Floppy disks permit the use of special utilities that can read and write to
    DOS disks.


    On Linux systems, the block special for the first floppy drive is /dev/fd0. The
    default density is 1,440 kilobytes. We assume that you''re using standard, 3½-inch,
    preformatted floppy disks.


    The following commands mount a floppy disk and write a DOS file to it, (replace
    any-dosfile.txt with a real filename):


    ```

    mount /dev/fd0 /mnt/floppy

    cp any-dosfile.txt /mnt/floppy

    umount /mnt/floppy

    ```


    These commands are one way to move files back and forth to an MS-DOS (Windows
    3.1, 95, 98, or NT) machine. You can add the files to a floppy disk, insert the
    floppy in the MS-DOS machine, and the MS-DOS machine can read the files from the
    disk. Likewise, by mounting a floppy disk created on an MS-DOS machine, you can
    read and manipulate the files using Linux.


    The mtools package installed on your system enables you to access DOS disks and
    files without first mounting the floppy disk and adding it to your file system.
    Table 12-1 presents some mtools commands, which are probably familiar to DOS users.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# 184 Part III: Just the Basics


    | Table 12-1 The mtools Utilities |

    | Command | What It Does |

    |---|-|

    | Mformat | Formats a floppy disk in DOS format |

    | mlabel | Labels a DOS floppy disk |

    | mcd | Changes the current directory location on a DOS floppy disk |

    | mdir | Lists the directory contents on a DOS floppy disk |

    | mtype | Displays a DOS file''s contents |

    | mcopy | Copies files between a DOS floppy disk and Linux |

    | mdel | Deletes files on a DOS floppy disk |

    | mren | Renames files on a DOS floppy disk |

    | mmd | Creates a subdirectory on a DOS floppy disk |

    | mrd | Removes a directory from a DOS floppy disk |

    | mattrib | Changes DOS file attributes |


    # # Configuring a CD-ROM Drive


    You treat CD-ROM drives similar to — but not exactly — hard or floppy disk drives.
    The block special file for CD-ROMs in Linux is usually /dev/cdrom, /dev/hdc, /dev/hdd,
    or /dev/sr0, depending on factors such the type of CD-ROM, how it is connected
    to the controller, and its drive number.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_211_0.png)


    The common type of CD-ROM drive is ATAPI, and Linux recognizes ATAPI CD-ROM drives
    at boot. SCSI CD-ROM drives are normally recognized as the kernel boots. If you
    installed the system before CD1, Linux will have recognized the CD-ROM drive,
    which is probably called (/dev/cdrom).


    We mentioned that CD-ROM drives are not exactly like other disk drives because
    CD-ROMs are read-only (which means that you can''t change their contents) and
    typically have only one file system to a disk. Therefore, you do not partition
    a CD-ROM drive, nor do you make a file system before mounting it. The manufacturer
    already did these things. You simply have to determine where you want to mount
    the CD-ROM and which drive you want it attached to. We assume that your CD-ROM
    drive is /dev/cdrom, which is really just a pointer to another special device
    file (called a link) enables you to call the CD-ROM by the name /dev/cdrom, instead
    of'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'having to call it /dev/scda on some systems (because it happens to be a SCSI
    device) and /dev/hdc on other systems (because it happens to be an IDE-based device).


    Here is the command to mount a CD-ROM on your Linux system:


    ```

    mount -r -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    The Linux system dismounts file systems automatically when you shut down the machine
    and — if you have put all the necessary information into the /etc/fstab file —
    automatically mounts them when you start up the system.

    So far as disk systems go, you should be all set.'
