  md: '# 304 Part VII: Appendixes


    You may be asking yourself (because the directions are skimpy or you have no one
    else to ask), "How do I get out of text mode and back to command mode?" Again,
    the answer is simple. If you want out, just press the Escape (Esc) key, and you
    are immediately whisked back to command mode. That''s pretty easy, isn''t it?


    ![](img/61222a84312a7aaf1d7bb493d840cde4_331_0.png)


    If you don''t know whether you''re in command mode, just press Esc a few times.


    # Moving around in a file


    After you know how to open a file in vi, you''re ready to find out how to move
    around in it. The commands in Table A-1 move the cursor arrow. Make sure that
    you''re in command mode; otherwise, Linux places these keys in your file just
    like any other data.


    | Table A-1 | Moving Around in vi |

    |---|---|

    | Command | What It Does |

    | j | Move one line down |

    | k | Move one line up |

    | h | Move one character to the left |

    | l | Move one character to the right |

    | Ctrl+f | Scroll down a full screen |

    | Ctrl+b | Scroll up a full screen |


    If you want to go to a specific line number, use a colon command. Type a colon
    (:), and it appears at the bottom of the screen. Then type the line number where
    you want to be. Here''s an example:


    :12


    When you press Enter, the cursor moves to the beginning of line 12.'
