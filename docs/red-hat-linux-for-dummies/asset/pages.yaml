    command kills all the processes that are using the home file system for any reason.
    After all the programs are shut down and no one else is using the file system,
    you can unmount the file system.


    # Configuring file systems


    Having to mount all the file systems every time you boot the system would quickly
    become annoying. To avoid this, you can have the system execute the required commands
    when you boot. The information needed to execute the required commands is in the
    standard Linux system configuration file located at /etc/fstab. The entries in
    this file usually follow this format:


    ```

    block-special-file mount-loc type opts dump-freq passno

    ```


    Here is a breakdown of this entry:


    +   block-special-file is the name of the device file that is used to mount a
    file system. A device such as a hard drive handles data in chunks and thus the
    term block is used. A block device file such as /dev/hdal refers to the first
    partition on an IDE drive.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Chapter 12: Managing the Linux System 173


    +   - mount-loc is the directory where the file system will be mounted. If the
    directory is on a partition used for swapping, use swap for mount-loc.


    +   - type is the kind of partition. For a native Linux file system, type is ext2.
    opts is the field for listing options, separated by commas. The options may include
    any of the following:


    +   - rw Allow the file to be read and written to (read-write mode).

    - ro Allow the file to be read only (read-only mode).

    - dev Special files in this file system as special files.

    - nodev Treat special files in this file system as filenames.

    - exec Permit execution of binary files from this file system.


    +   - noexec Prevent the execution of binary files from this system. This option
    is useful for file systems that should only store data from being introduced by
    system crackers or to prevent people from executing programs that were meant to
    run on a different system, such as MS-DOS.


    +   - auto Allow the file system to be mounted with the a option to the mount
    command.

    - nouser Forbid a non-super user from mounting the file system.

    - async Write data to the file system asynchronously. The system is faster, but
    you can lose data if a system failure occurs.


    +   - sync Write data to the file system synchronously.

    - suid Permit the set (user ID) access mode (the default).


    The suid access mode enables an executable program with the suid (or setgid) permission
    bit to take on the per sonality permissions of the owner (or the group) of the
    executable program. This can be a security hole; specifying the nosuid option
    prevents files in this file system from having the set user ID (or setgid) access
    effect.


    +   - nosuid Do not perform the suid access mode.

    - noauto Do not automatically mount this file system when the a option is used
    with the mount command.

    - usrquota User quotas may be put into effect.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_200_0.png)'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 174 Part III: Just the Basics


    +   - grpquota Group quotas may be put into effect.

    - defaults A combination of rw, suid, dev, exec, auto, nouser, and async.


    * dump-freq is the frequency with which the file system may be backed up by the
    dump utility (not all systems use this).

    * pass-number is a decimal number specifying the order in fsck, the file system
    check utility, checks the file systems. A pass-number of 1 (one) indicates that
    this file system should be checked first. This pass-number is assigned to root.
    Two file systems on different drives can be checked at the same time to speed
    up things, but file systems on the same drive have different pass-numbers. For
    a swap device, the pass-number should be 0 (zero), which disables checking.


    Following are examples of type /etc/fstab entries:


    ```

    /dev/hdb1 ext2 defaults 1 1

    /dev/hdb3 none swap sw 0 0

    /dev/h95 mdsos noauto 0 0

    ```


    The first line enables the mounting of the first partition of the second IDE disk
    as the root file system. It is a Linux native file system and uses the rw, suid,
    dev, exec, auto, and async options. The first entry in /etc/fstab file also indicates
    that the root file system should be dumped (backed up) once a week (use the man
    command for details on dump). Finally, the first entry of the /etc/fstab indicates
    that the root file system should be the first file system to have fsck performed
    after booting the system.


    The second line shows that the third partition of the second IDE disk is a swap
    partition and has the format of a swap file. (The swap partition is for temporarily
    storing chunks of your random access memory (RAM) when it fills up. Having swap
    space allows your computer to run programs that take up more space than you have
    memory for.) You should never back up the swap partition or perform the fsck command
    on.


    The third line of /etc/fstab points to the first partition of the first disk,
    which is a file system to be mounted on the /w95 directory. This file system probably
    holds Microsoft Windows 95 files, and you can read and write to it. Because the
    noauto option is used, the -auto option will not automatically mount the file
    system. You should never use dump to back it up, nor should you do a file system
    check on.


    After you set the /etc/fstab configuration, file systems can be mounted automatically
    at boot time. In addition, after the /etc/fstab file is set up, the mount and
    umount commands require only mount-point or block-special-file as their argument.


