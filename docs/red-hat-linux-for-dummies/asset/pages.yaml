  md: '# Chapter 12: Managing the Linux File System 177


    # # Reforming Corrupted File Systems


    File systems can become corrupted by anything, from turning off your computer
    without shutting down Linux properly to a driver error or hardware crash. The
    fsck utility can check the file system''s consistency, report errors, and make
    some repairs. Normally, the fsck program is called automatically at the system
    boots. Therefore, if your system crashes, fsck runs on all file systems that were
    mounted when the system crashed.


    The repairs that fsck can perform are limited to structural repairs of the file
    system and its data components. The fsck utility can''t help you if you have corrupted
    data in a structurally intact file. Also, remember that except for the root file
    system, Linux performs on only unmounted file systems. You must make sure that
    the system is in single-user mode to use fsck on the root file system.


    Here''s the syntax for the fsck command:


    ```

    fsck (options) filesystem

    ```


    filesystem names the block special file where the file system resides. If filesystem
    is omitted, the fsck utility checks all the file systems listed in /etc/fstab
    configuration file. If the fsck utility finds any errors, it prompts you for input
    on what to do about the errors. For the most part, you simply agree with whatever
    the program suggests.


    The fsck command has the following options:


    +   - -p Preen the file system. Perform automatic repairs that don''t change the
    contents of files.

    - -n Answer no to all prompts and only list problems; don''t repair them.

    - -y Answer yes to all prompts and repair damage regardless of how severe.

    - -f Force a file system check.


    Many people run the fsck command with the -y option automatically. If you run
    fsck with the -p option, Linux performs some steps automatically. Lost files are
    placed in the lost+found directory, zero-length files are deleted, and missing
    blocks are placed back on the list of free blocks, which are still available for
    filling with data, among other things.


    Suppose your electricity goes out and your system crashes. When the system reboots,
    you see messages similar to the following:'
