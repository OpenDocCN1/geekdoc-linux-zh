  md: '# 148 Part III: Just the Basics


    This line resubmits the command to bash with more changed to less, as follows:


    ```

    ls -1 | less

    ```


    Output appears. If you have to stop the less command, press Q.


    Note that the shell redisplays the first command with the change, and then the
    command is reexecuted. How does the shell know about the first command? History.
    bash remembers all the commands you have typed (to a certain extent) and allows
    you to edit and resubmit them. Awesome!


    ![](img/61222a84312a7aaf1d7bb493d840cde4_175_0.png)


    We say "to certain extent" because bash remembers only a certain number of commands,
    depending on a parameter in the environment. After bash holds that many previous
    commands, it throws away the oldest ones as you type in newer ones. Normally,
    this parameter is large (perhaps 1,000 commands), so bash will essentially remember
    every command that you enter. (We can''t imagine ever wanting to be able to recall
    all the last commands that we entered.)


    # Bang-bang


    The fact that the shell remembers the command lines you type is useful for reexec
    commands at a later time. Simple reexecution commands are represented by exclamation
    points. In computerese, an exclamation point is called a bang, and two exclamation
    points are called — you guessed it — bang-bang.


    Here are two key ways to use the exclamation point:


    +   - !! reexecutes the last command.

    - !<partial command line> reexecutes the command line that started with <partial
    command line>.


    Here''s an example. Type !cat on the command line as follows (cat is the <partial
    command line> mentioned in the preceding list):


    ```

    [maddog@shamet maddog]$ !cat

    ```


    bash searches backward through the previously executed commands in this session,
    looking for the first occurrence of a command line that starts with the letters
    cat. After the program locates the command, it is reexecuted.'
