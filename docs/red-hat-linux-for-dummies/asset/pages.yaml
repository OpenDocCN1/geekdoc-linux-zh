  md: '# Chapter 20: Ten Problem Areas and Solutions


    5. Copy the kernel image you just made on the floppy disk to your C drive.


    Now you can exit Windows and get to the MS-DOS prompt. You can then type the following
    (assuming your root partition is on partition /dev/hda5) to boot Linux:


