  md: '# 314 Part VII: Appendixes


    # # Serial, Parallel, and Joystick Interfaces


    Any standard serial, parallel, joystick, or comb card can be used. Linux ports
    8250, 16450, 16550, and 16550A UARTs.


    # # Other Controllers (Multiport)


    Some cards are used to increase the number of serial lines that a PC-style system
    can support above the one or two serial/parallel lines that come with it. These
    cards are intelligent or non-intelligent, depending on whether the main CPU buffer
    characters coming into the system can handle stop and start signals to the devices.
    Intelligent cards can cut down on the overhead of taking a load off the main CPU
    handling thousands of characters into the system every second by Some non-intelligent
    cards also use an IRQ for every port, which can use much of the system''s resources
    for little gain. To get a card that is intelligent and uses only one IRQ.


    # # Non-intelligent cards


    Some of the non-intelligent cards are AST FourPort and clones (4 port), Accent
    Async-4 (4 port), Arnet Multipart-8 (8 port), Bell Technologies HUB6 (6 port),
    Boca BB-1004, 1008 (4 port) - no DTR, DSR, and Co BB-206 (16 port), Boca IA/AT6
    (6 port), Boca IO 2x4 (4 serial/parallel, uses 5 IRQs), Computeone ValuePort (4,
    6, 8 port) (AST FourPort compatible), DigiBoard PC/X, PC/Xem, PCI/Xem, ISA/Xem,
    PCI/Xr (4, 8, 16 port), Control Hostess 550 (4, 8 port), PC-COMM 4-port (4 port),
    SLIG I/O Expander 4S (4 port, uses 4 IRQs), STB 4-COM (4 port), Twincom AC/450,
    and Usenet Board II (4 port).


    # # Intelligent cards


    Some of the supported intelligent cards are Computeone IntelliPort II (4/8/16
    port), Cyclades Cyclom-8Y/16Y (8, 16 port) (ISA/PCI), DigiBoard PC/Xe (ISA), PC/Xi
    (ISA) and PC/Keve, Equinox SST Intelligent serial I/O Cards, Hayes Easy Connection
    32/1 and 8 port versions, Stallion EasyIO (ISA), Stallion EasyConnection 8/64
    (PCI), Stallion EasyConnection 8/64 (ISA/EISA), Stallion OnBoard (ISA/EISA/MCA),
    and Stallion Brumby (ISA).'
