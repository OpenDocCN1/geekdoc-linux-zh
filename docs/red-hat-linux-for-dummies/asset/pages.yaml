  md: '# 144 Part III: Just the Basics


    The asterisk matches at least one character in any filename. For example, * matches
    the following filenames:


    +   * a

    * acd

    * bce

    * moody


    You''ll probably use * the most in the command ls -1 *.


    The question mark matches any single character. The string of characters a?c,
    for example, match the following:


    +   * abc

    * adc

    * aac

    * afc

    * a9c


    The question mark and the asterisk can be helpful for identifying a particular
    type of file, if you are careful about naming your files. For example, text editors
    usually have the .txt extension, and Microsoft Word files have the .doc extension.
    Linux doesn''t care what the name of a file is, but some programs work only with
    a particular type of file.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_171_0.png)


    Now suppose you followed the convention of naming all your files with the .txt
    extension, and you want to see all the text files in a directory. You can use
    ls -1 command like this:


    ```

    ls -1 *.txt

    ```


    The screen displays all the files in this directory with the .txt extension. Notice
    that we didn''t say that the command shows you all text files or that it shows
    only text files. If you want to name a graphics file with a .txt extension, Linux
    happily obliges you. For your own sanity, however, be diligent in naming files.
    Some programs (such as those that create audio files or picture files) strictly
    oblige a naming convention they create, but Linux itself doesn''t care.


    What do you do if * is part of the filename you''re trying to match? How can you
    tell the shell that you want only the file that contains * and not all the other
    files? The backslash character prevents the shell from interpreting * as a metastacter
    and expanding it — in linux, the backslash escapes the meaning of the special
    character. For example, hi*est matches a file named highest, but hi*est matches
    only the hi*est filename.'
