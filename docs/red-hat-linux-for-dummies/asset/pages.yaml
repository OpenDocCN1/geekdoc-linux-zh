  md: '# 206 Part IV: Using Red Hat Linux


    The Control Center also lets you configure things other than maniacal ratings.
    I''ll leave it to you to explore the wonderful world of setting your keyboard
    bell and such. This system gives you lots of flexibility.


    You can reach the Enlightenment window manager by positioning the mouse cursor
    over a blank part of the desktop and clicking both the left and right mouse buttons.
    A menu appears and you click the Enlightenment Configuration item. The Enlightenment
    Configuration Editor window appears, as shown in Figure 14-7.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_233_0.png)


    Figure 14-7: The Enlightenment Configuration Editor.


    By default, you have to click a window to bring it to the surface (also known
    as focus). You can change it so that merely moving the mouse cursor to a window
    focuses it. The Sloppy Pointer option works more-or-less in between these two
    options.


    The Behavior menu gives you ability to control your keyboard focus. Keyboard focus
    is a way to create shortcuts by assigning keys to launch applications. There are
    too many options and combinations to describe here, give it a try. The Miscellaneous
    section provides control over things like how long it takes for Tooltips to appear
    and for keyboard focus to affect.


    The other options provide control over the remaining look and feel of your desktop.
    You can control the number of virtual windows displayed, your audio system (if
    you have one), and other such things.'
