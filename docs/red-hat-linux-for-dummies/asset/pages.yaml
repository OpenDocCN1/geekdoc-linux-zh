  md: '# 16 Part I: Introducing Linux


    # Linux all over


    The Linux operating system has been ported from the 32-bit Intel architecture
    to a series of other architectures, including Alpha, MIPS, PowerPC, StrongARM
    and SPARC, giving users a choice of machine manufacturer and keeping the Linux
    kernel flexible for new processors.

    The Linux operating system now handles symmetric multiprocessing(more than one
    CPU or mathematical and logical programming per system box). In addition, projects
    are in the works to provide sophisticated processing capabilities, such as:


    +   - High availability: Running a reliable computer all the time


    +   - Scalability: Boosting computer power by adding more system boxes than faster
    CPUs


    This last capability — known as Extreme Linux systems — enables research organizations
    to create machines of supercomputer capabilities at a fraction of the price of
    supercomputers. In certain cases, Extreme Linux systems have been made from obsolete
    PCs, costing the organizations that make them nothing in material costs.


    +   - Real-time programming: Controlling machinery or testing equipment


    # Protecting your turnkey system


    A turnkey system is put together once and then duplicated in hundreds or thousands
    of places. Turnkey systems — not turkeys — are typically information kiosks, hotel
    reservation systems, doctor and lawyer office systems, and automotive diagnostic
    systems. Linux is perfect for this work because it provides the security, protection,
    and stability that turnkey systems needs, without requiring payments for many
    copies of the operating system. For example, say that one application is needed
    on 4,000 systems. If the business had to pay, say, $500 for the operating system,
    the project would cost $2,000,000 extra, just to pay for the operating system.


    # Backing up your network server


    Software is now available to automatically back up individual computers (Linux,
    UNIX, and Windows) over a network. Systems such as BRU2000 and Knox software''s
    Arkeia provide you with what to program, and how often to backup any or all of
    your computers. Both Arkeia and BRU2000 offer free demo versions of their commercial
    packages at their Web sites:


    ```

    www.arkeia.com

    www.bru2000.com

    ```'
