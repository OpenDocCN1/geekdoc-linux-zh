    | ide2 = third controller | | |

    | ide3 = fourth controller | | |


    # # My CD-ROM Isn''t Detected


    **Problem:** Most newer CD-ROMs are either EIDE (ATAPI) or SCSI, and most newer
    computer systems have enough support to see either the ATAPI CD-ROMs or the SCSI
    CD-ROMs, so CD-ROM support is not quite acute an issue in the early days. In addition,
    some older systems and CD-ROMs are now supported.


    Some early CD-ROMs pretended to be other devices (such as tape drives or floppies)
    to fool the computer system into using them, but these CD-ROMs were hidden from
    the detection system. If your system is one of these, despair: You can supply
    information to help Linux find your CD-ROM.


    First looking at the preceding section about disk numbering. This gives you an
    idea of the name that Linux would call your CD-ROM if Linux knew about it. If
    you have an EIDE/ATAPI CD-ROM, type the line whenever you see the boot or lilo
    prompt while booting or installing your system:


    ```

    linux hdx=cdrom

    ```


    where X is the number that your CD-ROM would have if it could be detected.


    # # I Don''t Know How to Remove LILO and Restore My MBR


    **Problem:** You don''t know how to replace the boot record that was on your system
    before you started installing Linux.'
