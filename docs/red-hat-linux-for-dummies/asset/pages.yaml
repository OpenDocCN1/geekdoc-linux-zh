    # Multitasking


    Executing programs on a Linux system, being able to take advantage of its multitasking
    capabilities — that is, running multiple programs at the same time — is beneficial.
    This process is also called job control. Windows NT not de this, Windows 95 and
    Windows 98 seem to do it, and UNIX systems have been doing it for almost 30 years.
    Most of this job control capability is due to the shell being able to launch background
    jobs and manage them.


    For example, perhaps you have a task that will be running a long time, with little
    or no human input needed. When you start that task, all you have to do is to put
    an & (ampersand) at the end of the line, and the job starts running in the background.'
