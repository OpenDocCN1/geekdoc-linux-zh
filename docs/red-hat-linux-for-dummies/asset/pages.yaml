  md: '# Logging into Linux


    When you use Linux, you must log in as a particular user with a distinct login
    name. Why? Linux is a multiuser system, and as such, it uses different accounts
    to keep people from looking at other people''s secret files, erasing necessary
    files from the system, and otherwise doing bad things. The unique identity also
    helps to keep the actions of one person from affecting the actions of another,
    because many people may be using the same computer.


    For now, log in as *root*, which in Linux terms is a superuser. The *superuser*
    is a privileged account that enables a person to go anywhere and do anything on
    the system. Superusers can add drives, do backups, restore damaged files, and
    turn the system oil and on. They can also damage the system if they make a mistake.
    Because superusers are all-powerful, their mistakes can be disastrous.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_140_0.png)


    This is a good time to create another account for yourself that''s non-privileged.
    That way, if you make a mistake while getting familiar with Linux — and who doesn''t
    — the mishap is limited to the power of your account. You can accidentally erase
    your own files and data but not someone else''s files or the system''s files.
    Comforting, isn''t it?


    Before you can create safe, new account for yourself, that''s though, you need
    to log in as *root*. To do that, you need to enter the superuser password you
    typed during installation (refer to Chapter 5):


    ```

    login: root

    Password:

    ```


    You don''t see the password as you type it on the screen. This secrecy ensures
    that anyone watching over your shoulder won''t see the password and try to log
    in later as *root*.


    If you make a mistake while typing the password (or while typing the word *root*),
    the system responds with


    ```

    Login incorrect

    ```


    and gives you another chance by redisplaying the yourself: *login:* prompt. Type
    *root* and then type your password.'
