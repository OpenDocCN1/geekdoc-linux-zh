  md: '# 140 Part III: Just the Basics


    Note that some commands to the more program (such as the b command) don''t work
    when you''re piping input into the program, as opposed to using more with a file.


    Everyone makes mistakes. Everyone changes his mind from time to time. For those
    reasons, you need to know how to delete text from the Linux command line. If you
    want to start over, press Ctrl-U to remove everything on the command line — if
    you have not yet pressed Enter. The Backspace key erases one character at a time.
    The left- and right-arrow keys move the cursor along the line of characters without
    erasing; when you get to the place you want to change, use the Backspace key to
    erase mistakes and retype changes. In most cases, the up- and down-arrow keys
    jump the cursor back and forth through the last few commands.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_167_0.png)


    Linux sometimes uses a command called less, which duplicates the functionality
    of the more command. Originally, the less command was designed to be more robust
    than the more command, but the more command caught up and they now almost the
    same. Some Linux systems display text with the less command instead of the more
    command, which most UNIX programs use.


    ![](img/61222a84312a7aaf1d7bb493d840cde4_167_1.png)


    The less and more commands have two apparent differences. One, the less command
    requires a command to get back to the Linux prompt, even when you are at the end
    of the last page. Two, the more command always says : More at the bottom of a
    screen, whereas less has just a character at the bottom of the screen to indicate
    that it''s waiting for you to input the next command. The companion CD-ROM (CDI),
    which is a Red Hat distribution, uses instead of less as a default.'
