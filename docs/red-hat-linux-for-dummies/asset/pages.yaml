  md: '# Chapter 8


    # Using Linux for the First Time


    In This Chapter


    +   - Starting Linux

    - Logging in as superuser

    - Adding yourself as a general user

    - Stopping Linux


    Congratulations! Linux is now on your system and we''re eager to go, and sure
    you''re anxious to start using it. But before you find out how to use Linux for
    work — or play — you have to make an account for yourself, which will be the place
    for you to log in and do whatever your heart desires.


    Linux is a multiuser system (unlike Microsoft Windows 3.1, 95, 98, or NT), so
    you — every other user — need an individual name and password to protect your
    information and keep your tasks separate from other people''s tasks. You find
    out how to create user accounts in this chapter, too.


    Names and passwords in Linux have one advantage over those in Windows 3.1, 95,
    and 98 systems: Linux has a rich file permissions strategy that keeps either you
    and/or others from erasing and replacing system files. This feature is important
    in a network environment or just when a system is sitting idle at a desk.


    # Giving Linux the Boot


    Are you ready to boot Linux? Follow these steps to start it up:


    +   1. Make sure that your computer is off.

    2. Turn on all peripheral devices, such as printers and scanners.

    3. Turn on the power to the monitor (if it''s separate from the main system box).'
