    # UPS and Miscellaneous Devices


    Many people have little surge protectors on the power to their computer systems.
    It''s better than nothing, that surge protector offers so much protection from
    surges and no protection from brownouts or blackouts. As you know, Linux systems
    just have their power turned off before completing a case, orderly shutdown of
    systems. And when the system does come back up, you''re in for a long wait while
    Linux checks to whether the file system was corrupted. An uninterruptible power
    supply (UPS) uses batteries to provide power to the computer system, allowing
    the computer system to shut down in an orderly way if the power starts to fail.
    Good ones also give you the ability to tie the computer into your UPS, and therefore
    have the UPS judge when it should go to complete shutdown. Some of the UPS units
    mentioned are APC SmartUPS, APC-BackUPS 400/600, APC-SmartUPS700/1400RM, UPS with
    RS-232 connecting port (genepower package), and MGE UPS.


    Many hardware devices are supported, and do not fit into any other category except
    strange . . . . miscellaneous. They include Mattel Powerglow, AIMS Labs RadioTrack
    FM radio card, Reveal FM Radio card, and Videotext.


