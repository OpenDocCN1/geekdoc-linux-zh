  md: '# Configuring a Hard Drive


    The business of adding a hard disk to your microcomputer can be broken down into
    two steps:


    +   - Physically adding the hard drive

    - Logically making Linux aware of it


    The first step is beyond the scope of this book, because your drive may be either
    IDE or SCSI, and the setup of the physical disk is dependent on the rest of the
    hardware in the system. We suggest that you consult the hardware manual that came
    with your system or have a reseller install your new hard disk. The Linux system
    is complicated by the fact that several operating systems — such as DOS, Linux,
    and SCO UNIX — may share the same hard disk.


    To complete all the steps necessary install and configure your new disk, you must
    know the total formatted drive capacity and the number of heads and cylinders,
    among other details. You can usually find this information in the documentation
    or from the manufacturer.


    You may want to keep a record of the data from the partition table (as displayed
    by fdisk), such as


    +   - Partition numbers

    - Type

    - Starting and ending blocks


    # Installing a drive


    After the drive is attached to the system, Linux should recognize it when you
    boot. To review the booting messages in a slower fashion than they''re displayed,
    use the `dmesg` command. If you added a new hdx drive, look for the mention of
    a new hdx drive, where the x is replaced with the letter b, c, d, or e. This informs
    you that your kernel saw the new hard disk as it was booted, and rebuilding the
    kernel is not necessary in order to add this drive. Likewise, if you are adding
    a new SCSI disk drive, the designation sdx, where the x is a letter. In either
    the IDE or SCSI case, you may see other messages with additional information.


    The messages for an IDE drive may look like this:


    ```

    hdb: HITACHI-DK227A-50, 4789MB w/512KB Cache, CHS=610/255/63

    ```


    ![](img/61222a84312a7aaf1d7bb493d840cde4_207_0.png)'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Chapter 12: Managing the Linux File System 181


    And sometime later, a message appears that looks like the following, which describes
    the existing partitions on the new disk (if any):


    ```

    hdb: hdb1 hdb2 < hdb5 hdb6 hdb7 hdb8 >

    ```


    A SCSI disk drive has messages that look like:


    ```

    SCSI device sdb: hdwr device= ......

    sdb: sdb1

    ```


    If you see these messages, the kernel has seen your new disk, and you don''t have
    to rebuild the kernel to use the new disk.

    The Linux distribution on CD1 features block special files for each or eight IDE
    disks (had–bdh) with nine partitions each (1–9). Linux also has block special
    files for seven SCSI disk drives (sda–sdg), which can have eight partitions each
    (1–8). In addition, Linux has a block special file for a SCSI CD-ROM (scd) with
    eight partitions (0–7). If you have lots of disks, or if your Linux distribution
    doesn''t have enough block special files for your disk, you may have to create
    one or more additional block special files for the device, like this:


    ```

    cd /dev; makedev sdg

    ```


    This command creates the block special files for SCSI disk 7. Note in both IDE
    and SCSI disks, the letters and disk numbers correspond: a is for the first disk,
    b is for the second disk, and so on.

    If you add a SCSI disk drive with a lower ID number than one you already have,
    the new disk drive takes that number. Suppose you have SCSI disk drives with hardware
    IDs of 0, 2, and 3. Linux gives these the names sda, sdb, and sdc. You may make
    your partitions and your file systems, and create entries in /etc/fstab to show
    where want the file systems mounted. Now you have a new disk drive and set the
    hardware ID number to 1. When you reboot, the new disk drive gets the sdb designation,
    and the disk drives with IDs of 2 and 3 are renamed to sdc and sdd. You must now,
    at the very least, change your /etc/fstab table. For this reason, we recommend
    adding SCSI disk drives to your system, starting with ID 0 and working up the
    number chain, with no gaps in the numbering.


    # Partitioning a drive


    After you''ve created block special files, you can use fdisk to partition the
    drive. The command to call this utility is /usr/bin/fdisk. For example, if you
    want to invoke fdisk for partitioning the first SCSI disk on your system, you
    type the following command:


    ![](img/61222a84312a7aaf1d7bb493d840cde4_208_0.png)


    ![](img/61222a84312a7aaf1d7bb493d840cde4_208_1.png)'
