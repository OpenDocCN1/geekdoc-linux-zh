  mdcn: ' 登录新工作站后要做的第一件事。CentOS安装程序会询问你，是要为系统设置一个普通用户，还是仅使用root用户即可。虽然系统不会强制要求创建普通用户，但为了加固安全防护，强烈建议日常操作时避免以“root”用户身份登录。相比之下，以普通用户身份登录并处理工作，在需要时通过sudo调用管理权限是更优选择。例如，标准Ubuntu安装流程甚至不会提供使用root的选项。存储设备方面，你始终可以选择默认方案，大多数情况下整个文件系统会安装到单个分区中，但如果遇到更复杂或特殊的用例，你也可以探索其他选项。许多服务器管理员更倾向于将“`/var`”目录层级单独放在一个分区中，确保系统日志数据不会占满整个系统的其余空间。你可以用一块体积小、速度快的SSD（固态硬盘）存储大部分系统文件，而更大的“home”和*var*目录则挂载到容量更大但速度慢得多的机械硬盘上。这样既能利用SSD的高速特性运行Linux二进制文件，又能用成本更低的机械硬盘存储数据，两者性能差异在实际使用中几乎感知不到。

    安装过程中会询问你是否希望将存储设备管理为“LVM卷”。那什么是LVM卷呢？LVM是逻辑卷管理器（Logical Volume Manager）的缩写，这是一种存储设备虚拟化方案，后续可以很方便地对存储进行调整。它的工作原理是这样的：假设你的系统上接有三块独立的物理硬盘，LVM会将它们整合为一个卷组，该卷组的容量等于三块硬盘的总存储空间之和。你随时可以基于该卷组创建任意数量的逻辑卷，只要总容量不超过卷组的可用空间上限，单卷容量可自由组合。如果你的三块硬盘容量分别为2TB、500GB和200GB，且你需要一个至少2.3TB的数据盘，就可以用LVM创建一个2.3TB的逻辑盘，再创建一个400GB的逻辑盘用于存储其他数据。如果未来需求发生变化，你可以缩小数据盘的容量，将多余的数据转移到第二个逻辑盘或新创建的逻辑盘中，新增或替换逻辑卷的操作相对很简单。LVM能提供非常灵活的配置能力，但对于简单的使用场景而言，通常并非必需。

    现在你已经了解了相关基础理论，可以直接开始安装Kali Linux了，但在安装之前，我想向渗透测试人员推荐几款必备的软硬件。

    ## 第2章 软硬件推荐

    - [Tcpdump](https://www.tcpdump.org/)

    - [微软网络监视器](https://www.microsoft.com/en-us/Download/confirmation.aspx?id=4865)

    - [LanDetective](https://landetective.com/download.html)

    - [Chanalyzer](https://www.metageek.com/support/downloads/)

    - [Ettercap](https://www.ettercap-project.org/downloads.html)

    - [NetworkMiner](https://www.netresec.com/?page=NetworkMiner)

    - [Fiddler](https://www.telerik.com/fiddler)

    - [Wireshark](https://www.wireshark.org/download.html)

    - [Kali Linux](https://www.kali.org/downloads/)

    - [vmWare](https://my.vmware.com/web/vmware/downloads)

    - [Virtual Box](https://www.virtualbox.org/wiki/Downloads)

    ### 无线网卡推荐

    很多人一提到无线适配器和无线网卡就会搞混，不知道它们是什么、为什么需要、又该如何在品牌和型号极多的情况下挑选到合适的产品。我们所说的无线适配器，是指可以通过USB端口连接到计算机、支持与Wi-Fi网络上的其他设备通信的硬件，你可以用它接入无线网络，与其他使用Wi-Fi的计算机进行通信。你可能会说自己的笔记本电脑已经自带这个功能了，没错，绝大多数笔记本电脑和智能手机都内置了无线网卡，但这样做存在两个问题。第一个问题是，如果将Kali
    Linux安装在虚拟机中，就无法使用内置的无线适配器；第二个问题是，这些内置无线适配器并不适合用于渗透无线网络。即使你将Kali Linux作为主系统安装在笔记本电脑上，能够使用内置无线网卡，你仍然需要单独购买一款无线适配器用于渗透测试，因为内置网卡大多不支持监听模式和数据包注入功能。你需要用它来破解Wi-Fi密码，完成在Kali
    Linux中借助aircrack-ng等工具能实现的所有渗透操作。

    在开始介绍能与Kali Linux兼容的品牌和型号之前，我们先来聊一个更重要的因素：无线适配器内部使用的芯片组。暂时先忘掉品牌，我们来聊聊负责无线适配器所有计算工作的“核心部件”，它决定了适配器的好坏：是否支持数据包注入和监听模式、是否能与Kali
    Linux兼容，都和品牌无关，适配器内部采用的芯片组才是关键。目前有很多芯片组支持监听模式、数据包注入功能，并且能与Kali Linux兼容，其中一款是Atheros公司推出的AR9271芯片组。该芯片组支持监听模式和数据包注入，你可以用它创建伪造接入点，也可以用它入侵网络，几乎所有Kali
    Linux支持的无线攻击都可以用这款芯片组完成。这款芯片组唯一的缺点是不支持5GHz频段，如果你的目标使用的是5GHz频段，或部分设备通过5G网络连接，你就无法与这些设备通信，甚至无法发现它们，自然也无法发起攻击。这不是因为芯片组性能差，而是因为它无法识别5GHz频段的通信流量。

    如果你想购买搭载这款芯片组的无线适配器，主要有两种选择：第一种是低价选项，你可以购买无牌搭载该芯片组的无线适配器，它可以完成我刚刚提到的所有攻击，唯一的缺点是无品牌，价格更低；第二种是购买Alpha公司生产的AWUS036NHA无线适配器，Alpha是非常知名的硬件厂商，一直推出高品质的无线适配器产品。这款适配器采用和前者相同的芯片组，兼容性一致，唯一的区别在于做工质量，是实力非常强的厂商生产的高品质产品。两款产品的功能都非常可靠，区别仅在于Alpha品牌的适配器传输距离更远、稳定性更强。而无牌低价适配器体积更小巧、更便携，如果你在公共场合使用，会比体积大、带大天线的Alpha适配器更方便。

    接下来要介绍的芯片组是瑞昱（Realtek）公司推出的RTL8812AU。这款芯片组直到2017年的Kali Linux 1版本才获得系统支持，它支持监听模式、数据包注入，同时兼容2.4GHz和5GHz频段。这款芯片组唯一的缺点是稳定性一般：部分攻击需要更强的信号才能完成，部分攻击会执行失败需要重试，有时网卡还会突然断开连接，需要重新插拔才能恢复。搭载这款芯片组的适配器同样有两种选择：你可以购买价格远低于Alpha产品的无牌低价适配器，它采用和前者相同的芯片组；也可以购买Alpha公司推出的同芯片组产品，Alpha是非常有名的优质厂商，其适配器性能更强，传输距离更远。

