    ```


    Full TCP port scan using with service version detection - usually my first scan,
    I find T4 more accurate than T5 and still "very fast".


    ```

    "nmap -v -sS -A -T4 target"

    ```


    Prints verbose output, runs stealth syn scan, T4 timing, OS and version detection
    and provides traceroute and scripts against target services.


    ```

    "nmap -v -sS -A -T5 target"

    ```


    Prints verbose output, runs stealth syn scan, T5 timing, OS and version detection
    and provides traceroute and scripts against target services.


    ```

    "nmap -v -sV -O -sS -T5 target"

    ```


    Prints verbose output, runs stealth syn scan, T5 timing, and provides OS and version
    detection.


    ```

    "nmap -v -p 1-65535 -sV -O -sS -T4 target"

