    payload. Once this is copied to a USB device and inserted into a target system,
    it will trigger and auto-run and compromise the system.


    - Next, it will create a Payload and Listener module which is a rapid menu-driven
    method, creating a Metasploit payload.

    - After that, we have what is called the Mass Mailer Attack which allows the attacker
    to send multiple customized emails to a single email address, or a list of multiple
    addresses.

    - Next, we have the Arduino-Based Attack Vector which programs Arduino-based devices.
    Because these devices register as a USB keyboard when connected to a physical
    Windows system, they can bypass security based on disabling the auto-run or other
