    process. Once the spidering process is complete, go back to the "Sitemap" tab,
    right click on the Mutillidae folder from the dropdown, and select "Engagement
    tools", and then click on "Discover content". Once inside your discovery module,
    you can click on the "Session is not running" button, and the application will
    start the smart brute forcing. At this time, the brute force attack is learning
    from files and folders that it finds within the application and tries to make
    better choices for brute forcing. This technique provides an efficient process
    to identify hidden folders, admin pages, configuration pages, and other interesting
    pages that will be extremely useful to any pen tester.


    ## Chapter 16 SQL Injection with SQLmap


    The most common and exploitable vulnerability in websites is the injection vulnerability,
    which occurs when a victim''s website does not properly monitor inputs, thus allowing
    the attacker to interact with the backend database. One of the most useful tools
    for assessing SQL injection vulnerabilities is called SQLmap. It''s a Python tool
    that automates the reconnaissance and exploitation of multiple types of databases.
    In this chapter, you will learn about SQL injection attacks against the mutillidae.com
    website.


    If you''re using metasploitable, you may need to fix the website configuration
    first. First, you need to connect to your metasploitable host using SSH. Use the
    username "mfsadmin", and the default password which is also "mfsadmin". Once you
    are connected to the metasploitable machine, you need to open the configuration
    file of the mutillidae.com website. In this file, you need to make sure that the
    connection string is pointing to the OWASP Top 10 database. Once completed, you
    can start your SQL injection task.


    First, open the mutillidae.com website. Next, in the left menu, select the OWASP
    Top 10 item, then the Injection menu item, and pick the first SQL injection test
    page from the top. This page is vulnerable to SQL injection, so you need to intercept
    the request sent from your browser to the server using Burp Suite. Before clicking
    on "View account details", you need to ensure that Burp Suite is active.


    Switching back to Burp Suite, you should see the contents of your request. Next,
    you need to save the contents to a file, and after that, you don''t need Burp
    Suite anymore. You can close everything, and open your console.


    Next, type `` `sqlmap -dbs` `` and press Enter to determine the available databases.
    The most likely database to store the application''s data is the OWASP Top 10
    database, therefore you will need to check the tables of that database using the
    command:


    ```sql

    sqlmap --tables --database owasp --u "TARGET_URL"

    ```


    Press Enter. The return data from executing this command should show you the available
    tables inside the OWASP database.


    Next, check the accounts table and dump the data from this table. You can list
    the tables in the database with the following command:

    ```sql

    sqlmap -u "TARGET_URL" --tables -d database_name

    ```

    You can list the names of columns in a table with another command:

    ```sql

    sqlmap -u "TARGET_URL" --columns -d database_name -T table_name

    ```

    You can dump the data using the command:

    ```sql

    sqlmap -u "TARGET_URL" --dump -d database_name -T table_name

    ```'
