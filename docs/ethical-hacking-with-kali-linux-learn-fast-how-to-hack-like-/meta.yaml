    ```

    ### apt-file

    列表中的下一个软件是“apt-file”。这是一个命令行工具，用于在“apt”软件包管理系统的包内搜索文件。它支持在不安装或下载软件包的情况下，列出包内的所有内容。安装该工具的命令如下：

    ```bash

    apt-get install apt-file

    ```

    安装完该软件包后，你还需要执行以下命令更新它的索引：

    ```bash

    apt-file update

    ```

    ### Scrub

    下一个需要安装的应用是“Scrub”。这是一款符合政府标准的安全删除程序。安装该工具的命令如下：

    ```bash

    sudo apt-get install scrub

    ```

    ### Shutter

    接下来需要安装“Shutter”。Shutter是一款截图工具，可以捕获你的桌面图像。安装该工具的命令如下：

    ```bash

    apt-get install shutter

    ```

    ### Figlet

    下一个建议安装的软件是“Figlet”。这款程序可以在控制台显示自定义消息（比如你的公司名称），让控制台显得更专业。安装该工具的命令如下：

    ```bash

    apt-get install figlet

    ```

    接下来，你需要编辑`.bashrc`文件，滚动到文件末尾，添加`figlet <your-message>`命令。接下来保存并关闭文件，重启你的控制台。下次登录控制台时，你首先看到的就是你设置的自定义消息。

    ### SSH配置

    接下来你需要了解SSH（即安全外壳协议）的配置。Kali默认自带SSH密钥，但在Kali上开始使用SSH之前，建议禁用默认密钥并生成专属的密钥对。移动原密钥、生成新密钥对的流程如下：

    #### 注意

    以下是在目录中导航的相关操作说明：

    - 立即返回用户主目录，使用`cd ~`或`cd -`

    - 进入Linux文件系统的根目录，使用`cd /`

    - 以root用户身份进入root用户目录，执行`cd /root/`

    - 向上返回一级目录，使用`cd ..`

    - 返回上一个访问过的目录，使用`cd -`

    接下来，你需要创建一个备份文件夹，并将SSH密钥移动到该备份文件夹中。

    #### 注意

    `cp`是Linux中用于复制文件和目录的命令。其语法格式如下：

    - `cp 源 目标`

    - `cp 目录1 目录2`

    - `cp -选项 源 目标`

    - `cp -选项1 -选项2 源 目标`

    示例如下，要将`/home/test/paper/`文件夹及其所有文件复制到`/usb/backup/`目录，使用以下命令：

    ```bash

    cp -avr /home/test/paper/ /usb/backup/

    ```

    - `-a`：保留指定的属性，包括目录和文件权限、所有者、时间戳，在可能的情况下还会保留额外属性：安全上下文、链接、扩展属性等。

    - `-v`：显示详细输出信息。

    - `-r`：递归复制目录。

    最后，你需要生成新的密钥对，使用以下命令即可：

    ```bash

    dpkg-reconfigure openssh-server

    ```

    接下来你会看到以下提示信息，说明SSH密钥已生成：

    ```

    正在生成SSH2 RSA密钥；此过程可能需要一些时间 ...

    正在生成SSH2 DSA密钥；此过程可能需要一些时间 ...

    正在生成SSH2 ECDSA密钥；此过程可能需要一些时间 ...

    ```

    接下来，你需要使用以下命令验证SSH密钥的哈希值：

    ```bash

    md5sum ssh_host_*

    ```

    这里的`*`代表你新生成的密钥，因此请使用以下命令对比这些哈希值：

    ```bash

    cd default_kali_keys/

    md5sum *

    ```

    重新生成SSH密钥对后，你可以通过命令行执行`/usr/sbin/sshd`来启动SSH服务。启动SSH后，如果你想确认服务正在运行，可以执行`netstat`查询。从输出结果中，你可以看到SSH当前正在22端口监听。

    ## 第4章 渗透测试简介

    我们已经讲解了Linux基础知识，尤其是Kali Linux，以及道德黑客可能需要的额外软硬件。但你在承接道德黑客相关的工作时，不应该直接冲着Kali的命令行或图形界面去，而是要先了解整个工作的流程。因此，我们首先要了解什么是渗透测试，以及它在侦察和踩点阶段是如何运作的。之后我们会讨论如何进行渗透测试，以及如何扫描你的目标。

    首先，我们必须明确我们做渗透测试的根本原因。这看似是个显而易见的问题，但我们会为你展开更多细节。

    接下来我们会介绍不同类型的渗透测试，除了类型差异外，你还需要了解参与其中的不同角色。然后我们会讲解渗透测试的三个不同阶段，让你完全明白每个阶段的内容。

    首先我们会看预攻击阶段，我们会在这个阶段花费大量时间，因为我们需要设定一些参数，同时做好法律层面的自我保护。之后我们会看第2阶段，也就是攻击阶段会执行的操作。最后我们会看攻击后的收尾步骤，以及你需要遵守的相关标准。这些标准中，部分由厂商制定，部分是公开标准，你可以根据自己的目标选择想要遵循的标准。确定适合自己的标准后，就要严格遵守。

    回到最开始的问题：“我们为什么要做渗透测试？” 这个问题看似简单，答案也显而易见，但实际上我们开展渗透测试的原因有多个。首先，我们通过模拟攻击来评估目标组织当前的安全状况，找出恶意攻击者可能利用的漏洞。另一个开展渗透测试的合理原因是完善安全防护措施。既然我们要对网络发起测试，顺带评估甚至重新设计当前的安全机制不是非常合理吗？

    '
