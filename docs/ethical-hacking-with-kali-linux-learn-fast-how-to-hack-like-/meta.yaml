    # Chapter 13 Target setup for Burp Scanner


    A good environment for web penetration testing is the mutillidae.com website,
    which is already installed on a "metasploitable" machine. The "metasploitable"
    is a Linux operating system and is preconfigured for penetration testing purposes.


    To download a copy of the metasploitable host, you need to browse to the project
    website at sourceforge.net and download a copy of the virtual machine by clicking
    on the metasploitable Linux zip item.


    To see the mutillidae.com website in your browser, enter the IP address of your
    metasploitable machine, which in your case it will be a private address. Followed
    by the web application name, which is mutillidae.


    Next, you need to enable the Burp proxy by selecting it from the foxy proxy menu,
    which you installed in the previous chapter. Switch back to Burp proxy, click
    the Proxy tab, then the Intercept tab, and then click on the Intercept button
    to turn it off.


    You don''t need to intercept any requests for the time being. Next, click on the
    Target tab and make sure that the site map tab is selected. You should see the
    mutillidae URL that you just trapped and forwarded.


    The next step you need to do is to add it to the scope. Right click on the mutillidae
    folder and select the "Add to scope" item. The scope defines where automated spidering
    and testing could occur, and helps you to not actively scan domains that are out
    of your scope.


    Vulnerability scanners are automated tools that crawl an application to identify
    the signatures of known vulnerabilities. Vulnerability scanners are noisy and
    are usually detected by the victim.


    But, scans frequently get ignored as part of regular background probing across
    the internet. Burp scanner is a dynamic web application scanner included in the
    professional addition of the Burp Suite software.


    The tool allows you to automatically scan websites and detect common security
    flaws, including SQL injection, cross site scripting, XML injection, missing cookie
    flags, and much more.


    In this chapter, I will explain to you how to use Burp Suite to accomplish a'
