    ## Chapter 11 Device discovery with Hping3

    To discover networking devices, whether they are local or remote, that do not
    respond directly to ICMP ping requests, we can still verify that they exist by
    using TCP and UDP options. Hping3 supports all these options and more. If you
    receive no response from a device you are certain is online, it may be because
    the firewall has been configured to block ping requests to eliminate Denial of
    Service Attacks, which is understandable, but you still want to verify that the
    device is active. Large organizations often disable ping replies by filtering
    them on their firewalls. However, if you still want to confirm that the device
    you are trying to ping is up, you can use many other tools we have already discussed,
    such as nmap and ZenMAP.


    Hping3 replaced the earlier version known as ping2 and now has additional functions
    beyond ICMP ping, including:

    - Ping requests via TCP

    - Ping requests via UDP

    - Fingerprinting

    - Sniffer and spoofer functionality

    - Advanced port scanning

    - Firewall testing

    - Remote uptime measurement

    - TCP/IP (OSI model) stack auditing

    - Advanced Flooding tool

    - Covert Channel Creations

    - File transfer capabilities, and more


    Hping3 is an excellent device discovery tool and is built into Kali Linux by default.
    It operates via a command-line interface and has numerous functionalities. To
    view all available functionalities, type:

    ```

    hping3 -h

    ```

    and press enter. The `h` flag stands for help, so you will be presented with a
    full list of available options for hping3.


    Using Hping3, you can ping not just a single address but hundreds of addresses
    simultaneously. You can also spoof your source IP address to appear as any IP
    address you choose, and manipulate the source interface from which the ping originates.
    As a result, it is nearly impossible to trace the traffic back to its real source.


    I will not cover every possible use case for Hping3, but I will mention that it
    is very easy to use for Denial of Service attacks. To establish a connection between
    two networking devices, a TCP 3-way handshake is required, and its first step
    is a SYN request. SYN stands for Synchronization. If you send a continuous stream
    of SYN requests to a target device, it will be flooded with requests, and eventually
    the CPU of the victim''s PC or any other networking device will be unable to handle
    the load, causing it to shut down.


    An example of a relevant command is as follows:

    ```

    hping3 -S 10.10.10.20 -a 192.168.1.20 22 --flood

    ```

    Parameter breakdown:

    - **-S**：Indicates a SYN request is being sent.

    - **10.10.10.20**：The victim''s IP address.

    - **-a**：Specifies that the following address is the spoofed source address.

    - **192.168.1.20**：The fake source address, which will also become a secondary
    victim, as the primary victim will attempt to reply to the SYN requests sent to
    this IP address.

    - **22**：The "ssh" port number; you can specify any open port identified via tools
    such as nmap.

    - **--flood**：Instructs Kali Linux to send SYN requests as fast as possible.


    Using this command set is not a trivial matter. You can seriously damage any device''s
    CPU even if you run it for just a few seconds. If you let it run for several minutes,
    many devices will likely become unresponsive and shut down. This is why I strongly
    warn you to obtain written authorization before using this command in a production
    environment. Even if you want to practice in a home lab, do not let it run for
    more than a few seconds, as it may cause severe damage to your own networking
    devices.


    ## Chapter 12 Burp Suite Proxy setup

    Burp Proxy is a crucial component of the entire Burp Suite application. It is
    a tool that allows you to intercept web traffic between the browser and the target
    web server.


    To start Burp Suite, go to the application menu, select Kali Linux, then Top 10
    security tools, and finally select Burp Suite from the list. The free version
    of Burp Suite is included in Kali by default, but you can also use the professional
    version to access all of the application''s functionalities. The free version
    is a great starting point for learning how the tool works.


    Once Burp Suite is up and running, ensure your proxy is enabled and listening
    on port 8080. Go to the Proxy tab, select the Options tab, and you will see that
    the proxy listener is active and listening on port 8080. Next, you need to configure
    your browser to use the port Burp Suite is listening on. For Firefox, you can
    use an add-on tool called "Foxy Proxy". This tool makes it easy to manage multiple
    proxies and switch between them quickly.


    After installing "Foxy Proxy", you will see a fox icon with a circle and a line
    through it next to the browser''s URL bar. Click the fox icon, then select "Add
    a new proxy". In the "Proxy Details" tab, set the manual proxy configuration to
    `localhost` and the proxy port to 8080. Then click the General tab, give the proxy
    a name, and finally click the Save button. What you have essentially done is tell
    your browser to route all traffic to your localhost on port 8080, which is the
    port Burp Suite is configured to listen on. Burp will receive this traffic and
    proxy it out to the internet. Once you save this profile, right-click the fox
    icon and select your proxy configuration.


    For this scenario, you can name the profile "Burp Proxy". When you need to use
    it, simply click the icon to activate it. Once your browser is using the proxy,
    navigate to the target web application. If you return to Burp Suite, you will
    see that the Proxy and Intercept tab lights up and turns orange. If this happens,
    you have configured everything correctly. You should also see that Burp has successfully
    captured the GET request for the website.


    By default, Burp is set to intercept all traffic. Intercept mode stops any request
    from the browser to the web application, allowing you to read or modify the request
    before it is sent. If you browse to any site with intercept enabled by default,
    you will not see any responses until you turn off the intercept button. When you
    disable intercept, Burp will continue to capture all web traffic but will not
    tamper with any requests. You can toggle the intercept function on or off as needed.
    Additionally, you can view all captured requests and responses in the History
    tab.'
  mdcn: '

    作为时间同步服务的服务器可用来获取更多信息，例如对等节点列表以及用户经常索要的其他统计信息。有一款名为《NTP指纹工具》的软件，可用于识别NTP服务器运行的操作系统。

    接下来，你应该尝试测试SMTP枚举。SMTP是简单邮件传输协议（Simple Mail Transfer Protocol）的缩写，用于电子邮件的收发及邮件服务器相关操作。你可以使用一款名为《SMTP枚举》的Perl脚本，搭配nmap的众多参数来枚举合法电子邮件地址，这些地址可能包含最终用户的用户名。名为《Metasploit》的软件也可通过SMTP协议帮你枚举用户邮箱。

    完成SMTP枚举和LDAP枚举测试后，还有一项名为DNS的服务需要排查。DNS是域名服务（Domain Naming Services），作用是将域名与对应的IP地址进行映射记录。可用于DNS枚举的工具很多，包括《BioSuite》、《Nmap》或《TX
    DNS Lookup》，另外要记住"nslookup"命令。

    现在你已经收集了大量信息，需要更新你的文档。事实上，几乎每一步都需要同步更新文档内容。你在整理文档的过程中也要随时查阅，以便分析结果、向客户提出安全加固建议。请始终牢记，我们的目标是保障客户安全并提供反馈。

    请注意，本书后续内容将重点讲解攻击部署的具体实例。

    ## 第11章 使用Hping3进行设备发现

    若要发现未直接响应ICMP ping请求的网络设备（无论本地还是远程），我们仍可通过TCP和UDP选项验证设备是否存在。Hping3支持上述所有选项，还支持更多其他功能。如果你确定某设备在线却未收到响应，可能是因为防火墙被配置为阻止ping请求以防范拒绝服务攻击，这一点可以理解，但你仍需要确认该设备处于活跃状态。大型机构通常会通过在防火墙过滤的方式禁用ping回包。不过如果你仍想确认目标的ping可达性，可以使用我们之前提到的其他工具，比如nmap和ZenMAP。

    Hping3取代了早期的ping2版本，现在除了ICMP ping之外还支持更多功能，包括：

    - 通过TCP发送ping请求

    - 通过UDP发送ping请求

    - 指纹识别

    - 嗅探与欺骗功能

    - 高级端口扫描

    - 防火墙测试

    - 远程运行时间测量

    - TCP/IP（OSI模型）协议栈审计

    - 高级泛洪工具

    - 隐蔽信道创建

    - 文件传输能力，以及更多其他功能

    Hping3是一款优秀的设备发现工具，默认集成在Kali Linux系统中。它通过命令行界面运行，具备众多功能。要查看所有可用功能，输入：

    ``` hping3 -h ```

    然后按下回车。`h`参数代表帮助，执行后你将看到hping3所有可用选项的完整列表。

    使用Hping3时，你不仅可以ping单个地址，还可以同时ping数百个地址。你还可以伪造源IP地址，使其显示为任意你指定的IP，还可以修改ping请求的源接口。因此，几乎无法追溯流量到其真实来源。

    我不会介绍Hping3的所有可能用例，但需要提醒你，它很容易被用于发起拒绝服务攻击。

    两台网络设备建立连接需要经过TCP三次握手，其第一步是发送SYN请求。SYN是同步（Synchronization）的缩写。如果你向目标设备持续发送SYN请求，设备会被请求淹没，最终受害者PC或任何其他网络设备的CPU将无法承受负载，导致设备关机。相关示例如下：

    ``` hping3 -S 10.10.10.20 -a 192.168.1.20 22 --flood ```

    参数说明：

    - **-S**：表示正在发送SYN请求。

    - **10.10.10.20**：受害者的IP地址。

    - **-a**：指定后续地址为伪造的源地址。

    - **192.168.1.20**：伪造的源地址，该地址也会成为次要受害者，因为主要受害者会尝试向这个IP回复发送给它的SYN请求。

    - **22**：SSH服务的端口号；你可以指定通过nmap等工具发现的其他开放端口。

    - **--flood**：指示Kali Linux以最快速度发送SYN请求。

    使用这组命令并非小事。哪怕只运行几秒，也可能严重损坏任何设备的CPU。如果让其运行数分钟，大量设备很可能失去响应并关机。因此我强烈警告，在生产环境中使用该命令前必须获得书面授权。即使想在家用实验环境中练习，也不要让其运行超过几秒，否则可能会对你自己的网络设备造成严重损坏。

    ## 第12章 Burp Suite代理配置

    Burp代理是整个Burp Suite应用的核心组件。它是一款可以拦截浏览器与目标Web服务器之间Web流量的工具。

    启动Burp Suite的操作路径为：打开应用程序菜单，选择Kali Linux，再选择十大安全工具，最后从列表中点击Burp Suite。Kali Linux默认集成了Burp
    Suite的免费版，你也可以使用专业版来解锁应用的所有功能。免费版是学习该工具工作原理的绝佳入门选择。

    Burp Suite启动并运行后，要确保代理已启用且在8080端口监听。进入「Proxy」选项卡，点击「Options」选项卡，即可看到代理监听器已激活，正在8080端口监听。

    接下来你需要配置浏览器，使其使用Burp Suite监听的端口。针对Firefox浏览器，你可以使用名为《Foxy Proxy》的扩展工具。这款工具可以轻松管理多个代理，并快速在代理之间切换。安装《Foxy
    Proxy》后，你会看到浏览器地址栏旁有一个带斜杠圆圈的狐狸图标。点击该狐狸图标，选择「添加新代理」。在「代理详情」选项卡中，将手动代理配置设置为`localhost`，代理端口设置为8080。然后点击「常规」选项卡，为代理设置一个名称，最后点击「保存」按钮。

    你上述操作的本质是告知浏览器将所有流量路由到本地主机8080端口，也就是Burp Suite配置的监听端口。Burp会接收这些流量并将其代理转发到互联网。保存该配置文件后，右键点击狐狸图标，选择你刚配置的代理配置。在本场景中，你可以将配置文件名设为「Burp
    Proxy」。需要使用时，只需点击图标即可激活该配置。

    浏览器启用代理后，访问目标Web应用即可。回到Burp Suite界面，你会看到「Proxy」和「Intercept」选项卡亮起并变为橙色。如果出现这种情况，说明你已正确完成所有配置。你还会看到Burp已成功捕获该网站的GET请求。

    默认情况下，Burp会拦截所有流量。拦截模式会阻止浏览器向Web应用发送任何请求，你可以在请求发出前阅读或修改该请求。如果默认开启拦截功能时你访问任意网站，在关闭拦截按钮前都不会看到任何响应。关闭拦截功能后，Burp会继续捕获所有Web流量，但不会篡改任何请求。你可以根据需求随时开启或关闭拦截功能。此外，你还可以在「History」选项卡中查看所有捕获的请求和响应。

    '
