    ## Chapter 25 Packet Manipulation with Scapy

    Scapy is an advanced packet manipulating tool that is not recommended for beginners
    to play with. Yet, it''s fair to mention that this tool exists and certainly can
    act like the king of all hacking tools out there. Scapy can assist you to craft
    virtually any packet that you want to, without any problem.


    Imagine that you are about to administer and validate a configuration on a firewall,
    and one of the policies dictates that you implement the following rule:

    > > "Any packet initiated from the inbound direction to the outbound direction
    is not allowed, and should be denied if the destination IP address is the same
    as the source IP address."


    This firewall rule request of course makes perfect sense, but it also sounds a
    little unrealistic. Just think about how it is possible that a PC sends a request
    from its own IP address to the outbound direction where the destination IP address
    would be the exact same identical IP address as the sender''s PC. That''s impossible
    right? Well, technically it is possible, because this could be a malicious packet.
    Someone may be about to run some port scan within the organization to gain data
    on networking devices and their vulnerabilities to launch a strategic attack,
    that could potentially damage, disable, clone or even shut down the whole system,
    and it would seem that it originated from inside the private network.


    So how is that possible? Well, the tool is called Scapy. Scapy is very likely
    the most powerful and flexible packet manipulation tool that is built into Kali
    Linux, written by Python. Using Scapy, by opening the command line interface we
    can launch it and create a packet, and the best part is that we can specify virtually
    anything:

    - Any source IP address

    - Any destination IP address

    - Type of service

    - IPv4 or IPv6 addresses

    - Change any of the header fields

    - Change the destination port number

    - Change the source port number and more.


    In addition, to craft a unique packet, Scapy is also able to:

    - Capture any traffic

    - Play or replay any traffic

    - Scan for ports

    - Discover networking devices and more.


    Scapy works in Kali Linux, and to launch it on the command line interface you
    type:

    ```

    scapy

    ```

    Then press enter. Because there are so many possibilities with Scapy, let’s begin
    with something straightforward, which is a basic send command:

    ```

    send(IP(src="10.10.10.20", dst="10.10.10.2")/ICMP()/"OurPayload")

    ```


    What this packet creation command means is that I want to send a ping from the
    source IP address of 10.10.10.20 to the destination IP address of 10.10.10.2.
    Additionally, I want this packet to look like an ICMP echo request, but I want
    it to include a payload called OurPayload.


    Scapy is a rule breaker. Therefore, we don’t have to follow proper networking
    protocols exactly; instead we can create packets that logically would never be
    found in a real network. By sending crafted packets to multiple destinations,
    we could just wait for the responses, analyze them to see if we might have triggered
    some weird behavior, and discover a vulnerability in this process.


    To exit from Scapy, you have to press “Ctrl+d” and that would take you back to
    a normal command prompt. But if you want to initiate another command, you must
    start Scapy again by typing:

    ```

    scapy

    ```

    Then press enter.


    Another very dangerous command is when we turn Scapy into a sniffer. If you type:

    ```

    sniff(iface="eth0", prn=lambda x: x.show())

    ```

    Then press enter, this means that you want to sniff all traffic that goes through
    the Ethernet0 interface, and display every single packet as it comes and goes
    through the interface. After you press *enter*, the output would probably fill
    this book; but I wanted to share with you that Scapy is not only capable of crafting
    packets, but it can also act as an intruder or sniffer if we want it to.


    Lastly, I will ask you again to make sure that you have written authorization
    for using Scapy in a live or production environment. If you are only practicing
    in your home lab, in a non-production environment, that should cause no issue
    to anyone; still I would suggest you turn off your router and practice with care
    without any connection to the internet.


