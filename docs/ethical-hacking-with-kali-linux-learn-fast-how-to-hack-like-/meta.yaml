- md: '## Chapter 17 Dictionary Attack with Airodump-ng


    To execute a dictionary attack on a wireless network protected with WPA or WPA2,
    we''re going to follow a four-step process. First, we want to find out the BSSID
    of the access point that we want to execute our dictionary attack against. Once
    we''ve found the access point we want to attack, then we need to decide on the
    wordlist that we want to use for the attack. A wordlist, as the name suggests,
    is a list of words, like a dictionary, and we''re going to try that list of words
    against the access point. The third step is that we''re going to generate authentication
    traffic. For this attack to work, we need to be able to capture a legitimate user
    connecting to the access point and we''re going to generate that traffic, so we
    can sniff it over the air. Lastly, we have to execute the dictionary attack.


    For this attack, we''re going to use Kali Linux. To do that, you have to open
    up a terminal and look at the configuration. Type `iwconfig` and you should see
    two of your wireless LAN adapters. Wireless wlan1 should be your device''s wireless
    LAN card that''s integrated in your device, and wireless wlan0 is your virtualized
    Kali Linux LAN adapter if you have successfully bridged your devices. This is
    also the one that you will be using to execute your attack.


    Therefore, the first thing you need to do is to put Kali Linux''s wlan card into
    monitor mode, but before you would do that, you have to take down your wireless
    LAN adapter by typing:

    ```

    ifconfig wlan0 down

    ```

    Next type:

    ```

    iwconfig wlan0 mode monitor

    ```

    This command will put your wireless LAN adapter into monitor mode. But to ensure
    the wlan is back up, you have to type the command:

    ```

    ifconfig wlan0 up

    ```


    Now that your wireless LAN adapter is back up, you want to confirm that it is
    now in monitor mode. To do that, you have to type the command:

    ```

    iwconfig

    ```

    Here, you should see where it says "Mode"; next to that, it should say that the
    card is now in monitor mode.


    Your next step is to find the BSSID of the access point that you want to attack.
    For that you are going to use the tool called Aircrack, so you have to type:

    ```

    airodump-ng wlan0

    ```

    This will start searching for broadcasted BSSIDs. Here, you will see that you
    are capturing the BSSIDs of the surrounding access points and the channels they
    are using.


    NOTE: Do not compromise your neighbors'' wireless, or worse, do not use this tool
    in a production environment, unless you have written authorization.


    Back to Kali Linux, to exit monitoring, you can press "Ctrl+C" to stop the search
    once you have found your wireless BSSID that you are going to attack. Within the
    output of Kali, you should also have the MAC address of the BSSID, which is normally
    a 12-character string of letters and numbers that you have to take note of, because
    you are going to need that MAC address when you execute the attack.


    The next step is to find a wordlist that you can use in order to break into the
    access point, and Kali has several tools that you can use for this purpose. You
    can also download other similar tools, but the tool called "Airodump" will just
    do the job. Therefore you have to type:

    ```

    airodump-ng --bssid 00:11:22:33:44:55:66 --channel 1 --write wepcracking wlan0

    ```

    NOTE: This is only an example, but where I stated "00:11:22:33:44:55:66" you have
    to type the actual MAC address of the BSSID that you are about to compromise,
    as well as the channel (for you it might be channel 6 or channel 11).


    Once you have successfully executed the above command, you will see that wlan0
    network monitoring has started.


    Here, you will see the data transfer under the "data" column. Bear in mind that
    it all depends on how complex the password is as it might take a few minutes.
    After you have waited a few minutes, you should have enough data that you can
    work with, therefore you have to open a new terminal and type:

    ```

    ls

    ```

    This will list the files that you have captured so far.


    Now to crack the password, you have to type the following command:

    ```

    aircrack-ng wepcracking-01.cap

    ```

    Here the filename "wepcracking-01.cap" is an example but you have to type whatever
    filename you have captured and listed under the ls command, next to the "Public"
    file name. If you have been using WEP authentication, by now the password would
    be cracked. Aircrack-ng normally lists the password as an ASCII file by saying
    "KEY FOUND".


    NOTE: Lastly, I will ask you again to make sure that you have written authorization
    for using Airodump-ng in a live or production environment. If you are only practicing
    in your home lab, in a non-production environment, that should cause no issue
    to anyone; still I would suggest you turn off your router and practice with care
    without any connection to the internet.


    ## Chapter 18 ARP Poisoning with EtterCAP


    Imagine that you have been assigned to carry out a MITM (Man in the Middle) attack
    against a specific host or server, and the choice of tools to use are up to you.
    There are multiple ways to carry out a MITM attack, and in this chapter we are
    going to use another excellent tool that you might consider called EtterCAP. EtterCAP
    is another great way of going about a MITM attack as it has a user-friendly Graphical
    User Interface or GUI that provides a so-called click, select and go method. It''s
    always better to have more knowledge of additional tools if they wouldn''t work
    or you wouldn''t have access at the time you are assigned to do pen testing. You
    should be aware that in order to achieve the same result, there are other options
    that you can go for. EtterCAP is another built-in tool on the Kali Linux platform.


    To launch EtterCAP, you can issue the command:

    ```

    ettercap -G

    ```

    Then press enter. Once EtterCAP is launched, it will wait for us to provide further
    instructions, and you should first click on a menu option: Sniff > then choose
    "unified sniffing". Next, you should specify the network interface that you will
    use for sniffing. In my case it''s ethernet0. This will create some additional
    menu options, so now you should click on the menu option: "Host", then click on
    "Scan for hosts". This should take no longer than 5 seconds to discover all hosts
    that are on the same network. Once complete, go back to the menu icon; Host >
    then click on host lists in order to see all the hosts'' IP Addresses and the
    MAC addresses associated with them.


    Once you have a list of hosts, you can highlight the source address and click
    on "Add to target 1", then highlight the destination address and click on "Add
    to target 2".


    The method we use is called ARP POISONING. ARP stands for Address Resolution Protocol.
    Routers, Layer 3 Switches have ARP entries or ARP tables that contain all IP Addresses
    and their associated MAC Addresses or Physical Addresses that are connected to
    the network. Yet, if we use ARP Poisoning, we could fake the real source address
    by telling the destination that we have the IP Address and the MAC address of
    the source node, so all traffic that is planned to reach the real source host,
    from now on, would first come to us. In addition, all traffic that is planned
    to reach the destination host would come to us as well, as we would also poison
    the real source and tell it that the destination IP Address and MAC address is
    now our machine.


    Using ARP Poisoning is one of the best methods to create a Man in the Middle attack
    as now all traffic that is going back and forth between the source and the destination
    is actually coming through us. Having all that traffic captured, we can decide
    if we just want to analyse it, other than capture it, modify it, forward to a
    different destination, or simply stop the communication between those devices.
    Therefore, the final piece to launch such an attack is to click on the menu icon
    called "MITM" and then select "ARP poisoning". Once you have finished and want
    to stop ARP Poisoning, click on "Stop MITM attack(s)".


    NOTE: Lastly, I will ask you again to make sure that you have written authorization
    for using this method in a live or production environment, as any type of Man
    in the Middle attack is very dangerous, especially when you manipulate routed
    traffic through poisoning the ARP tables by feeding fake MAC addresses. If you
    are only practicing in your home lab, in a non-production environment, that should
    cause no issue to anyone; still I would suggest you turn off your router and practice
    with care without any connection to the internet.'
