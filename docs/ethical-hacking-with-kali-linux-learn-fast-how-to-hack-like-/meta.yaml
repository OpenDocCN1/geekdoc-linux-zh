    ## External Penetration Testing

    External penetration testing evaluates the security of externally connected systems
    from the internet. Controlled tests are used to gain access to internet resources
    and ultimately the “DMZ” (a semi-internal network) by navigating through and around
    firewalls from the internet. External penetration testing also involves identifying
    and exploiting both known and unknown vulnerabilities from the perspective of
    an external attacker. How do you execute an external pen-test task? First, after
    requesting infrastructure information from your client, you need to create a visual
    diagram representing the client''s organizational infrastructure. Diagrams should
    include both physical components and associated personnel where possible. Your
    network map should also include the IP ranges the client has already provided
    to you. Optionally, you can add the Internet Service Provider (ISP) for additional
    clarity. Using Kali Linux, the first step is to map the route to the target.


    ### Route Mapping and Traceroute

    Next, you will run a ping sweep against your target network. Alternatively, you
    can scan the target network to identify live hosts, then use "nmap" to perform
    multiple port scanning techniques against the target. “Route mapping” was originally
    a diagnostic tool used to view the path an IP packet takes from one host to another.
    Using the "TTL" (Time to Live) field in a packet, each hop between points generates
    an "ICMP time exceeded" message. ICMP stands for Internet Control Message Protocol.
    These packets count the number of hosts and the route traversed. For example,
    if your Kali Linux machine is the source host, and a Google server is the destination,
    with two intermediate routers (R1 and R2) in between: First, the Kali machine
    sends a TTL 1 probe to R1. R1 receives it, decrements the TTL by 1, and sends
    back an ICMP time exceeded response. Next, Kali sends a TTL 2 probe to R1; R1
    decrements the TTL to 1 and forwards it to R2. R2 receives the probe, decrements
    the TTL to 0, and sends back an ICMP time exceeded response. Finally, Kali sends
    a TTL 3 probe to R1; R1 forwards it to R2, which decrements the TTL to 0 and sends
    it to the Google server. The Google server then returns a "destination port unreachable"
    response, as most servers block unsolicited probes to closed ports. In Kali Linux,
    "traceroute" is a command-line tool that uses ICMP packets to map network routes.
    To trace the route to Google''s server, run the command:

    ```traceroute www.google.com

    ```

    You will see that the route typically takes between 12 and 16 hops to reach the
    Google server. If you run the same test with "nmap", you will get slightly different
    results. This is because "nmap" performs the same function using the TCP protocol,
    which is permitted by almost all firewalls.


    ### Basic Nmap Scanning Commands

    ```nmap -sP 10.0.0.0/24

    ```

    Ping scans the network, listing all machines that respond to ping requests.

    ```nmap -p 1-65535 -sV -sS -T4 target

    ```

    Full TCP port scan with service version detection - this is usually my first scan.
    I find T4 more accurate than T5 while still being very fast.

    ```nmap -v -sS -A -T4 target

    ```

    Prints verbose output, runs a stealth SYN scan with T4 timing, performs OS and
    version detection, and provides traceroute results and script scans against target
    services.

    ```nmap -v -sS -A -T5 target

    ```

    Prints verbose output, runs a stealth SYN scan with T5 timing, performs OS and
    version detection, and provides traceroute results and script scans against target
    services.

    ```nmap -v -sV -O -sS -T5 target

    ```

    Prints verbose output, runs a stealth SYN scan with T5 timing, and performs OS
    and version detection.

    ```nmap -v -p 1-65535 -sV -O -sS -T4 target

    ```

    Prints verbose output, runs a stealth SYN scan with T4 timing, performs OS and
    version detection, and conducts a full port range scan.

    ```nmap -v -p 1-65535 -sV -O -sS -T5 target

    ```

    Prints verbose output, runs a stealth SYN scan with T5 timing, performs OS and
    version detection, and conducts a full port range scan.


    Each time you see three dots ("...") in your command line output, it means the
    packets are being blocked. This is often caused by firewalls such as Checkpoint
    or Cisco ASA, which drop these packet types by default.


    ### Port Scanning Fundamentals

    Port scanning with "nmap" is the process of connecting to TCP and UDP ports to
    determine what services and applications are running on the target system. There
    are 65,535 total ports for both TCP and UDP on every computer. Some ports are
    associated with specific services; for example, TCP port 21 is used for FTP. The
    first 1024 ports (0-1023) are known as "well-known ports" and are used by standard,
    widely recognized services. Nmap should always come to mind when discussing port
    scanning. It is a universal port scanning tool that relies on active stack fingerprinting:
    specially crafted packets are sent to the target system, and the operating system''s
    responses allow nmap to identify the OS. For "nmap" to work, at least one listening
    port must be open, and the OS must be identifiable via fingerprinting. We could
    write an entire book about "nmap"; if you have never used it before, I highly
    recommend exploring its features. There are also additional resources covering
    basic host discovery via ICMP echo requests and replies, DNS queries, and host
    name resolution.


    ### Common Firewall Types

    When it comes to firewalls, common types include stateful, stateless, zone-based,
    and policy-based firewalls. In summary, stateful firewalls allow inbound traffic
    if the connection was initiated from the internal network to an external network.
    Stateless firewalls, on the other hand, drop inbound packets even if the traffic
    originated from the internal network, unless an explicit "accept" rule has been
    previously configured to allow traffic from a specific source to a specific destination
    on a specific port.


    ### Host Discovery with Hping3

    Nmap uses "traceroute" functionality to identify the path to your chosen destination
