    To start the Social-Engineering Toolkit, type the command "setoolkit" and press
    Enter. You have multiple options to select from when this application loads. The
    first one is the Social-Engineering Attacks, which offers a mix of Social-Engineering
    methods.


    The second one is the Fast-Track Penetration Testing, which provides rapid access
    to some specialized tools. You can type number 2 to select this option.


    Next, you will be presented further options. The first tool is a password cracking
    of SQL databases, the second are some customized exploits that are based on Python.


    After that, we have the User Enumeration, and finally it contains the PSEXEC Powershell
    Injection. You can type number 99 to go back to the main menu, but if you select
    the first choice which contains tools for Social-Engineering Attacks, all you
    have to do is press number 1 on your keyboard.


    Once you have selected this option, once again you will have further options.
    The first one on the list is the Spear-Phishing Attack Vectors which allows an
    attacker to create email messages and send them to targeted victims with attached
    exploits.


    Next, we have the website Attack Vectors which utilize multiple web-based attacks.
    If you select that to see the details, simply press number 2 on your keyboard.'
