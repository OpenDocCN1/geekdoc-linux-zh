    # Chapter 7 Pen Testing @ Stage 3


    If you think that the pre-attack steps or the actual attack steps are the most
    important, well that''s technically not true. The most critical steps are at the
    post-attack stage because you are doing this, from an offensive point of view.


    It''s the responsibility of the pen-tester to clean up their mess. You are going
    to have to ensure that you return the systems to their pre-test state.


    You do not just make a mess and leave. Therefore, you should remove any files
    that you uploaded, any data that you make modifications to; you''ll ensure that
    you restore those as well as any settings that you may have changed.


    This is also one of the reasons why it''s vital to document each step along the
    way. You also must undo any privileges or user settings if you''ve done any privilege
    escalation.


    You also must ensure that you restore the network you have made changes to either
    within DNS or any IP addresses. In summary, you must recreate the very same network
    state as it was before you walked into.


    If you''ve gotten into the registry in any way whatsoever on any system, you must
    ensure that you return those to their same settings as well.


    Sometimes you might even create different shares and connections, so you must
    undo those, and you''ll also have to ensure that you document all the logs that
    were captured, as well as entries that were modified.


    After that, you''ll have to analyse the results, and instead of creating problems,
    you have to develop solutions. Once you have done all that, you have to present
    that documentation to your client, while you must identify critical system and
    critical resources that are at risk, and come up with a prioritized list of what
    needs to be modified first.'
