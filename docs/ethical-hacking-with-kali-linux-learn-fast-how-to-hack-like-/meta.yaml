    then donated to the community. "Community" means anyone, anytime, anywhere, and
    "donated" means that the programming code of any Linux component will be freely
    available for anyone to download, modify, and do anything they might want with
    it, including profiting from their own customized versions if they wish to.


    A computer operating system, or OS, is a set of software tools designed to interpret
    a user''s commands so that they can be translated into terms that the host computer
    can understand. Just about any operating system can be installed and launched
    on most standard hardware architectures, assuming it has enough memory and processing
    power to support the OS''s features. Hence, you can load Linux natively on any
    PC or a Mac, a tiny development board running an ARM processor, or as a virtualized
    container image within a Docker environment.


    Nearly all desktop operating systems provide two ways to access their tools: through
    a graphical user interface, also known as GUI, and through a command line interface,
    or CLI. Every modern operating system allows you to securely and consistently
    run sophisticated productivity and entertainment tools through the GUI and provides
    a suitable environment where you can develop your own software, which was the
    only thing the first personal computers could do.


    All Linux distributions have that in common, but what they do differently is more
    interesting. The most obvious difference between Linux and its commercial competitors
    is the absence of commercial restrictions: other operating systems have them,
    but Linux does not. This means that you are free to install as many versions of
    Linux on as many hardware devices as you wish, and no one will tell you otherwise.


