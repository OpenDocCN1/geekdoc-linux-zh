    a question mark once in the command prompt will display and list all available
    commands along with a description of what they are used for. You can start organizing
    your project by using what are called workspaces. You can create a new workspace
    for your lab, and by the way the "-a" argument is used for adding a workspace.
    Next, to ensure that a new workspace is selected, issue the "workspace" command
    to list all the workspaces that are stored in the Metasploit database. Next, search
    for your exploit by using the "search" command. The returned exploit for the IRCD
    service might be listed, and it assigns the relative ranking of how successful
    it is at achieving an exploit. You can copy the exploit name to use it in the
    next commands. Additional information about this exploit can be obtained by using
    the "info" command. The returned information should include references, as well
    as information about this exploit. It''s better to check it out before proceeding
    and wasting your time. To instruct Metasploit that you will attack the target
    with an exploit, you issue the "use" command. After the "use" command, Metasploit
    changes the command prompt from "msf" to "msf exploit (unreal_ircd_3281_backdoor)".


    If you need to set any options for the exploit, you can do it by executing the
    "show options" command. For example if you need to set the required field for
    the remote host, which is the IP address of the system being attacked, to change
    the value of any option, you start by the "set" keyword, followed by the option
    name, and finally, you enter the option value. To execute the payload, type "show
    payload" command to list all the suitable payloads for this exploit. There''s
    a bunch of them, but you can select the "reverse shell payload" for this example.
    Why would you do that? Well, this is because it''s a popular payload for UNIX
    shells. When I say popular, it means people used it before with a good success
    rate. Next, you need to check the options for the selected payload. The Payload
    option will ask you to enter a value for the local host IP address. You can check
    that out with the command "ifconfig". Enter the value and press Enter. To start
    the attack, enter the "exploit" command and press Enter. Metasploit initiates
    the attack and will confirm by indicating Command shell session 1 opened, and
    giving the IP addresses that originate and terminate the reverse shell.


    When a system is compromised to this extent, it is ready for the post-exploitation
    activities. Post Exploitation is a part of the workflow where the attacker achieves
    the full value of the attack. Once a system has been compromised, the attacker
    generally performs the following activities. He or she conducts a rapid assessment
    to characterize the local environment, such as infrastructure, connectivity, accounts,
    presence of target files or applications that can facilitate further attacks.
    It also locates and copies or modifies target files of interest such as data files
    or financial information. Furthermore, it creates additional accounts and modifies
    the system to support post-exploitation activities. In addition, it attempts to
    vertically escalate the privilege level by capturing administrator or system-level
    credentials, and tries to attack other data systems that are called horizontal
    escalation. By pivoting the attack through the compromised system to the remainder
    of the network, it installs persistent backdoors and covert channels to retain
    control and have secure communications with the compromised system. Lastly, the
    attacker can remove indications of the attack from the compromised system. To
    be successful, the post-exploit activities require comprehensive knowledge of
    the target''s operating system to ensure that protective controls can be bypassed.
    You have already learned how to exploit the system previously, so you will put
    the session in the background by pressing "Ctrl+Z", and type "y" to confirm. It
    is essential to know the session ID for the post-exploitation module that you
    are going to use. This can be obtained with the "sessions" command. If you have
    used this tool for the first time, your session is 1. One of the first modules
    that you can try is called the "hashdump", which will try to collect the password
    hashes of the system. The only setting that you need to insert here is the session
    Id. Before you proceed, you need to set the session Id in the options section.
    Another very interesting post-exploitation module of Metasploit is the "enum_configs",
    which will obtain all the important configuration files, and will store them in
    your system. You should see in the output a sample of the configuration files
    that has been obtained from the remote system. If you want to check one of those
    txt files by using a text editor application, copy one of them, open a new console,
    and use the tool called "nano text editor" to see its contents.


    Once you are ready to move on, close this window, and go back to your main window.
    This time you will need to enumerate the network configurations with the "enum_network"
    module. The "enum_network" command saves everything you have found in text files,
    so you can check them to discover what kinds of installations exist on the remote
    system such as IDS, anti-virus, IPS or firewalls. Next, you can use the "enum_protections"
    module, but you can also enumerate the entire system by obtaining information
    regarding the user accounts, the installed packages, the services, the hard disk,
    the Linux version and so on. To get all this information, you can use the "enum_system"
    command, and you can check out the contents of the generated text files. To discover
    information from the user history, there is a Metasploit module for that as well
    that stores this information on your local system which is called "enum_users_history".


    ## Chapter 33 Social-Engineering Toolkit

    Social Engineering is an important technique that you should be aware of, and
    shortly you will understand how hackers use social engineering applications to
    trick victims into executing the vulnerable trap. SET or Social-Engineering Toolkit
    is an open source Python-driven framework that''s specifically designed to facilitate
    social engineering attacks. A significant advantage of the Social-Engineering
    Toolkit is its inter-connectivity with the Metasploit framework which provides
    the payloads needed for exploitation, the encryption to bypass antivirus, and
    the listener module that connects to the compromised system when it sends a shell
    back to the attacker.


    To start the Social-Engineering Toolkit, type the command "setoolkit" and press
    Enter. You have multiple options to select from when this application loads:

    - Social-Engineering Attacks, which offers a mix of Social-Engineering methods.

    - Fast-Track Penetration Testing, which provides rapid access to some specialized
    tools.


    You can type number 2 to select this option. Next, you will be presented with
    further options:

    - Password cracking tool for SQL databases

    - Customized exploits based on Python

    - User Enumeration

    - PSEXEC PowerShell Injection


    You can type number 99 to go back to the main menu, but if you select the first
    choice which contains tools for Social-Engineering Attacks, all you have to do
    is press number 1 on your keyboard. Once you have selected this option, once again
    you will have further options:

    - Spear-Phishing Attack Vectors, which allow an attacker to create email messages
    and send them to targeted victims with attached exploits.

    - Website Attack Vectors, which utilize multiple web-based attacks. If you select
    this option to view the details, simply press number 2 on your keyboard.'
  mdcn: '

    该版本存在一个后门，你可能数月都察觉不到，触发条件是向任意监听端口的服务器发送字母A、B，随后跟一条系统命令。Metasploit框架有一个可利用该漏洞的模块，可借此获取交互式shell。

    要开始攻击，首先打开控制台。在Kali系统中，启动该框架前需要先启动“PostgreSQL”服务器。接下来，需要运行“msfconsole”应用程序。和所有控制台应用一样，在命令提示符后输入“help”或问号，即可显示并列出所有可用命令，以及对应命令的用途说明。

    你可以通过工作区来整理项目，可以为实验环境创建新工作区，`-a`参数用于添加工作区。接下来，为确保新工作区被选中，输入“workspace”命令，即可列出Metasploit数据库中存储的所有工作区。

    接下来，使用“search”命令搜索你要用的漏洞利用模块，搜索结果会列出IRCD服务的相关利用模块，同时会标注该模块利用成功的相对评级。你可以复制该利用模块的名称，用于后续命令中。使用“info”命令可获取该利用模块的额外信息，返回内容会包含相关参考资料以及该利用模块的说明，建议先查看这些信息再继续操作，避免浪费时间。

    要指示Metasploit框架使用该利用模块攻击目标，需输入“use”命令。输入“use”命令后，Metasploit框架的命令提示符会从“msf”变为“msf
    exploit (unreal_ircd_3281_backdoor)”。如果需要设置利用模块的选项，可以执行“show options”命令查看。例如如果需要设置远程主机必填项（即被攻击系统的IP地址），修改任意选项的值时，需先输入“set”关键字，随后跟选项名称，最后输入选项值即可。

    要执行攻击载荷，输入“show payload”命令，即可列出该利用模块对应的所有适配载荷，可选载荷很多，本示例中选择“reverse shell payload”即可。之所以选择该载荷，是因为它是UNIX
    shell中常用的载荷，此处“常用”指过往使用者普遍反馈成功率很高。接下来需要检查所选载荷的选项，载荷选项会要求你输入本地主机的IP地址，你可以通过“ifconfig”命令查看本机IP，输入对应值后按下回车键即可。

    要发起攻击，输入“exploit”命令后按下回车键。Metasploit框架会启动攻击，并在确认攻击成功后显示“Command shell session
    1 opened”，同时给出反向shell的源IP与目标IP。

    当系统被攻陷到这一步，就可以开展后续的后渗透活动。后渗透是攻击流程中，攻击者获取攻击全部价值的阶段。系统被攻陷后，攻击者通常会开展以下操作：

    - 快速评估本地环境特征，包括基础设施、网络连通性、用户账号，是否存在可用于发起后续攻击的目标文件或应用

    - 定位、复制或修改高价值目标文件，比如数据文件、财务信息

    - 创建额外用户账号、修改系统配置，为后续后渗透活动提供支持

    - 通过窃取管理员或系统级凭据提升权限等级（即纵向提权），同时尝试攻击其他数据系统（即横向渗透）

    通过被攻陷的系统作为跳板攻击整个内网，安装持久化后门和隐蔽信道，以此维持控制权，并与被攻陷系统建立安全通信。最后，攻击者可以清除被攻陷系统上的攻击痕迹。

    后渗透活动要取得成功，需要攻击者充分了解目标系统操作系统，才能确保绕过防护控制机制。你已经掌握过系统利用方法，因此可以按下“Ctrl+Z”将当前会话置于后台，输入“y”确认操作即可。要知道后续使用的后渗透模块对应的会话ID，这一点至关重要，你可以通过“sessions”命令获取会话ID，如果是首次使用该工具，你的会话ID就是1。

    可以尝试的第一个模块是“hashdump”，该模块会尝试收集系统的密码哈希值，这里只需要设置会话ID即可，继续操作前需要在选项区域设置好会话ID。

    Metasploit框架中另一个很有趣的后渗透模块是“enum_configs”，它可以获取所有重要配置文件，并存储到你的本地系统中，你会在输出中看到从远程系统获取到的配置文件样本。如果想用文本编辑器查看其中的txt文件，可以复制文件路径，打开新的控制台，使用名为“nano
    text editor”的工具查看文件内容。准备继续下一步时，关闭当前窗口，回到主操作窗口。

    接下来需要使用“enum_network”模块枚举网络配置，该命令会把所有发现的结果保存为文本文件，你可以查看这些文件，了解远程系统上部署了哪些安全设施，比如入侵检测系统（IDS）、杀毒软件、入侵防御系统（IPS）或防火墙。接下来你可以使用“enum_protections”模块，也可以用其他模块枚举整个系统的信息，包括用户账号、已安装的软件包、运行的服务、硬盘、Linux版本等。要获取所有这些信息，可以使用“enum_system”命令，之后查看生成的文本文件内容即可。如果要获取用户历史记录信息，Metasploit框架也有对应的模块，名为“enum_users_history”，它会将这些信息存储到你的本地系统中。


    ## 第33章 社会工程学工具包

    社会工程学是你需要了解的重要技术，接下来你会明白黑客如何利用社会工程学应用诱骗受害者触发漏洞陷阱。

    SET（社会工程学工具包）是一个开源的、基于Python开发的框架，专门用于发起社会工程学攻击。社会工程学工具包的一大优势是能够与Metasploit框架互联互通，后者可提供渗透所需的攻击载荷、绕过杀毒软件的加密功能，以及当被攻陷系统向攻击者发送shell时用于建立连接的回调模块。

    要启动社会工程学工具包，输入“setoolkit”命令后按下回车键即可。该应用加载后会提供多个可选选项：

    - 社会工程学攻击：提供多种社会工程学攻击方法

    - 快速渗透测试：可使用部分专用工具快速开展测试

    输入数字2即可选择快速渗透测试选项。接下来会出现更多可选选项：

    - SQL数据库密码破解工具

    - 基于Python的定制化利用工具

    - 用户枚举工具

    - PSEXEC PowerShell注入工具

    输入数字99可返回主菜单，如果选择包含社会工程学攻击工具的第一个选项，只需在键盘上按下数字1即可。选择该选项后，会再次出现更多可选选项：

    - 鱼叉式网络钓鱼攻击向量：攻击者可创建附带漏洞利用程序的邮件，发送给指定目标

    - 网站攻击向量：可使用多种基于Web的攻击方式

    如果要查看该选项的详细内容，只需在键盘上按下数字2即可。

    '
