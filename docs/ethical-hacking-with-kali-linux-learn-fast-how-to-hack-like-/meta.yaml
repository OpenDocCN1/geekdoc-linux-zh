    Open Link, and it would open it within the default browser; but it’s fair to mention
    that some of the menu functions do not always work within the default browser.


    I would therefore suggest you to use Firefox browser by copy pasting the provided
    link. Next, Xplico would open up a web based Graphical User Interface that would
    require you to be logged on using the following details:


    +   - Username: xplico'
