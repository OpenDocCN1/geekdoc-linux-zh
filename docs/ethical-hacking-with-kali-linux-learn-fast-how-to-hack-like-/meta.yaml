  md: '# ## Chapter 24 MITM Attack with SSLstrip


    In this chapter I''m going to teach you how to create a fake access point on a
    Kali Linux virtual machine. To complete this attack you will need to have a USB
    network adapter that supports both monitor mode and master mode.


    If you don''t have a USB network adapter that supports these networking modes
    the network adapter that I highly recommend is the Alpha that I have talked about
    earlier. It only cost about $50 and you can pick one up from Amazon as well as
    a few other places.


    Before we begin I want to explain how this attack works. To illustrate it let
    me give you a high-level overview of how this attack works. The main components
    include the victim, the attacker, the fake access point and a router with an internet
    connection.


    What''s happening, is the attacker is connected to the Internet, and the attacker
    is going to share that internet connection through a USB network adapter which
    is acting as a fake access point.


    When someone connects to that fake access point, they''ll be able to access the
    Internet. Let me walk you through this process. The first thing that''s going
    to happen is the victim is going to connect to the fake access point, then the
    victims internet traffic will be routed through the fake access point into the
    attacker.


    Once the attacker obtains the victims Internet traffic, the attacker will manipulate
    and log the victims internet traffic with SSL strip and this is going to allow
    the attacker to force the victim to use HTTP, which as a result is also going
    to allow the attacker to capture any usernames and passwords that the victim enters.


    Once SSL strip is finished manipulating and logging the victims internet traffic,
    the attacker will forward the victims internet traffic to the router. Finally,
    the router will route the victims Internet traffic to whatever website the victim
    is attempting to communicate with.


    What we do here, is that we place ourselves between the victim and the web site
    so as a consequence, we can see any interactions that are occurring between the
    victim and the web site, and this is also referred to as a man-in-the-middle attack.'
