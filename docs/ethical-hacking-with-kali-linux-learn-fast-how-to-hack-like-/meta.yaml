    发现主机后，你需要针对端口开展扫描。你需要查看哪些端口是开放的，哪些是关闭的，哪些端口只允许特定流量通过，这能帮你更清晰地了解这些设备上的安全策略。用于端口扫描的常用工具之一是：（你肯定猜到了）nmap。


