    # Chapter 4 Introduction to Penetration Testing


    We have already discussed Linux basics, specifically Kali Linux, as well what
    additional software and hardware you might require as an Ethical Hacker. Yet,
    instead of jumping right onto Kali''s command line or graphical user interface,
    you should know more about the procedures once you take on a job as an Ethical
    Hacker.


    Therefore, first, we''re going to look at understanding penetration testing, and
    how it works in terms of reconnaissance and footprinting. After that, we are going
    to discuss how to pen test and how to scan your targets.


    First, we have to understand why we pen test in the first place. That may seems
    an obvious question, but we''ll give you some more details here. Next, we''ll
    talk about the different types of pen tests, but there are not only different
    types, but different individuals who are also involved you should be aware of.


    Then we''ll go through the three different stages of pen testing so you fully
    understand what those are. We''ll look at the pre-attack stage, which we spend
    a lot of time in because we want to set some parameters, as well as protecting
    ourselves legally.


    Then we''ll look at stage 2 where we''ll look at the things that we''ll do during
    the attack. Afterward, we''ll look at the post-attack steps, and we''ll talk about
    the standards required you to be following.


    Some of the standards are done by manufacturers, and some of them are open standards,
    so you''ll need to decide which one you wish to follow based on what you''re trying
    to accomplish. Once you find the standard for yourself, stay to it.


    But to the question; "Why do we pen-test in the first place?" Well, this seems
    like an easy question or that you would think the answer is pretty straightforward,
    but there are a few reasons why we do pen tests.


    First of all, we want to evaluate the current security profile of the organization
    by simulating an attack to find out what vulnerabilities a malicious attacker
    could exploit.


    Another legitimate reason we do pen test is to create security measures. Since
    we''re going after the network, doesn''t it make sense to go ahead and figure
    out or maybe redesign our current security mechanisms?'
- md: "## Pen Test Overview\n### Core Objectives and Execution Requirements\nMany\
    \ people feel that pen-test is designed to point out vulnerabilities, but we will\
    \ not just point out the vulnerability, but we must also highlight the effects\
    \ that weakness or that vulnerability poses to the company. Upon completion of\
    \ a pen-test, we can deliver a comprehensive report with the details of everything\
    \ we've discovered. You could also argue that pen testing is designed not just\
    \ to show the gaps in your security model, but it can also benefit in disaster\
    \ recovery and business continuity planning. The goal is to simulate methods that\
    \ malicious attackers would utilize to attempt to gain unauthorized access to\
    \ your network.\n\nFirst of all, you want to ensure that you list the objectives\
    \ of the pen test. Some companies may or may not need certain elements tested.\
    \ Establishing parameters for those tests should be the primary focus, and the\
    \ limitations or justifications of attacking those systems. Another way that you\
    \ could ensure that you perform a decent pen-test is to follow a methodology,\
    \ and we'll talk about methods later on, but you want to focus on one, because\
    \ most of the plans will ensure that you cover all your bases. Documentation is\
    \ another vital factor of a decent pen-test. We want to ensure that the client\
    \ can understand what it is we're talking about, and the pen tester needs to ensure\
    \ that they're available to answer any questions that might come up from the documented\
    \ pen-test report. Another way that you could ensure that you do a decent pen-test\
    \ is to prove you've got the right tools. Some of these tools will be proprietary,\
    \ some open-source, some of them will do things for you automatically, others\
    \ might include scripts, as well as just standard command-line interfaces. Another\
    \ way that you could ensure that you have a decent pen test is to choose who's\
    \ involved. You may not be doing this alone. If you are doing it alone, you want\
    \ to ensure that you and everybody else involved in the pen test is a legit penetration\
    \ tester who follows the rules of non-disclosure agreements. This is important\
    \ if you're being hired to do a pen-test that could destroy a company. It is your\
    \ job, your responsibility, and your integrity to ensure that you help to protect\
    \ the client.\n- Define clear test objectives: Prioritize establishing test scope,\
    \ boundaries, limitations, and justifications for attacking target systems based\
    \ on the specific needs of the enterprise\n- Adopt a unified testing methodology:\
    \ Select a mature methodology to ensure all test points are covered without omissions\n\
    - Maintain comprehensive documentation: Ensure the report is clear and understandable,\
    \ and testers must be available to answer any client questions about the documented\
    \ report\n- Select appropriate testing tools: Tools can include commercial proprietary\
    \ tools, open-source tools, automated tools, scripts, and standard command-line\
    \ interfaces\n- Ensure personnel compliance: All testers must be legitimate penetration\
    \ testers who comply with non-disclosure agreements, possess professional ethics,\
    \ and avoid causing damage to the enterprise during testing\n### Additional Value\
    \ of Pen Testing\nYou also want to ensure that you not only point out what's wrong,\
    \ but when you report the findings, provide some recommendations of what needs\
    \ to be done or what could be done to fix the problem. Offer solutions all the\
    \ time. Besides the main four reasons for performing a pen test, there are a couple\
    \ of other reasons you should be aware too.\n- Accompany vulnerability findings\
    \ with actionable remediation recommendations rather than only pointing out issues\n\
    - Drive infrastructure optimization: Propose security improvement plans for hardware,\
    \ software, and network design to enhance overall enterprise security\n- Develop\
    \ vulnerability prevention plans: Prepare response measures in advance to prevent\
    \ vulnerabilities from being exploited\n- Evaluate network device security: Check\
    \ the security effectiveness of firewalls, routers, switches, web servers, file\
    \ servers, and other equipment\n- Validate existing defense systems: Since network\
    \ environments are dynamic, past test results do not reflect the current security\
    \ status, so regular testing is required to confirm the effectiveness of security\
    \ controls\n- Support security team construction: Help establish or optimize security\
    \ teams, conduct targeted training for specific vulnerabilities, and clarify the\
    \ security responsibilities of personnel in charge of each system\n- Identify\
    \ threats to organizational assets: Threat characteristics vary by industry, for\
    \ example, hospitals and small and medium-sized enterprises have different security\
    \ protection priorities\n- Reduce security costs and improve ROI: Identify and\
    \ remediate vulnerabilities to avoid unnecessary security investment and improve\
    \ the utilization efficiency of security devices\n- Provide basis for security\
    \ system construction: Used to develop security policies, processes, implementation\
    \ plans, and new architecture designs\n- Support enterprise operation planning:\
    \ Help develop systems, processes, execution plans, and long-term development\
    \ plans for the enterprise\n- Meet regulatory compliance requirements: Adapt to\
    \ the laws and regulations of specific industries\n- Reduce legal risks: Avoid\
    \ legal disputes such as class-action lawsuits from customers caused by data breaches\
    \ due to failure to protect their data\n### Differences Between Pen Testing and\
    \ Other Security Tests\nYou're going to read a lot of different terms being utilized\
    \ when it comes to different types of tests being done, such as a security audit\
    \ or vulnerability assessment, while we're still talking about pen-testing. Some\
    \ folks might utilize all these terms interchangeably, but there are some considerable\
    \ differences:\n- Security Audit: Checks whether the enterprise follows a set\
    \ of standard security policies and procedures\n- Vulnerability Assessment: Focuses\
    \ on discovering vulnerabilities in the network, but cannot judge whether the\
    \ vulnerabilities can be exploited, nor evaluate the possible damage caused by\
    \ vulnerability exploitation\n\nIn summary, a pen test is a systematic approach\
    \ to security assessment that encompasses the security audit as well and demonstrates\
    \ if the attacker can successfully exploit the weaknesses in the systems.\n###\
    \ Pen Testing Team Types\nWhen it comes to pen testing, you're also going to hear\
    \ different types of teams, and since there are two types of groups, let me explain\
    \ what each one is.\n- Red Team (Aggressor Team): Composed of ethical hackers,\
    \ with no or limited access to the organization's internal resources, can attack\
    \ with or without notice, and may include system administrators from different\
    \ departments of the organization to simulate the behavior of real malicious attackers\n\
    - Blue Team (Defensive Team): Has access to all organizational resources and information,\
    \ with the core responsibility of detecting and mitigating the Red Team's activities,\
    \ and anticipating how surprise attacks may occur. It may include system administrators\
    \ and standard IT staff, and is the least expensive and most frequent assessment\
    \ approach\n### Pen Testing Classifications\nWhen it comes to the types of pen-tests\
    \ out there, it all depends on your approach and how much information is given\
    \ to you by the organization before the tests start, as well as whether the pen-tests\
    \ are internal or external.\n- White Box Test: Testers have complete knowledge\
    \ of the infrastructure before the test, and the enterprise will provide network\
    \ topology (including all related diagrams), asset inventory, and software inventory.\
    \ This type of test is suitable for scenarios that require a comprehensive security\
    \ audit. However, it should be noted that information security is an ongoing process,\
    \ and pen testing only provides a snapshot of the enterprise's security status\
    \ at the time of testing, and cannot represent long-term security level.\n- Black\
    \ Box Test: Divided into two types:\n  - Blind Test: The pen tester has no knowledge\
    \ of the company or the target, but the target is informed of the audit scope,\
    \ including what, how, and when the tester will test. During the test, the tester\
    \ will simulate the reconnaissance, footprinting, scanning and other actions of\
    \ a real attacker, and collect publicly available information. This type of test\
    \ is time-consuming and expensive due to the time required.\n  - Double-Blind\
    \ Test (Zero Knowledge Test): Neither the pen tester knows the target nor the\
    \ target is informed of the scope of the audit, so both parties do not know the\
    \ what, nor the how. This type of test can test the security awareness of all\
    \ relevant personnel, and is one of the more popular assessment methods used today.\n\
    - Gray Box Test: A combination of white box and black box testing, where the tester\
    \ has partial information (such as the domain name of the server). It saves time\
    \ compared to the black box test, as it skips the early information collection\
    \ stage of the black box test.\n\nThe assumption that you're going to get that\
    \ work done, it also can provide"
  mdcn: "\n## 渗透测试概览\n### 核心目标与执行要求\n很多人认为渗透测试旨在发现漏洞，但我们不会仅停留在指出漏洞层面，还会重点说明该缺陷或漏洞对企业造成的影响。\n\
    渗透测试完成后，我们会提交一份包含所有发现详情的综合报告。你也可以认为，渗透测试的目的不仅是暴露安全体系的漏洞，还能为灾难恢复和业务连续性规划提供支持。\n\
    其核心目标是模拟恶意攻击者用于尝试入侵你网络的方法。\n首先，你需要明确列出渗透测试的目标。不同企业的测试需求存在差异，并非所有元素都需要纳入测试范围。确定测试参数是首要工作，同时要明确针对相关系统发起攻击的限制条件或依据。\n\
    想要执行高质量的渗透测试，另一个要点是遵循一套成熟的方法论。我们后续会介绍具体方法，但你最好专注采用某一套体系，因为绝大多数成熟方案都能确保你覆盖所有测试要点。\n\
    文档记录同样是高质量渗透测试的核心要素。我们要确保客户能够理解报告内容，测试人员也需要随时就报告中的内容解答客户提出的疑问。\n想要执行高质量的渗透测试，你还需要证明配备了合适的工具。这些工具包括商业付费工具、开源工具，有的可自动执行任务，有的需要配合脚本使用，也有仅通过标准命令行界面操作的常规工具。\n\
    想要执行高质量的渗透测试，还需要选对参与人员。你可能并非独自完成测试，若为单人测试，你需要确保自身及其他所有参与人员都是合法的渗透测试工程师，且遵守保密协议相关规定。\n\
    如果你受雇开展可能对企业造成损害的渗透测试，这一点尤为重要。帮助保护客户是你的职责所在，也是你的职业操守要求。\n- 明确测试目标：根据企业实际需求，优先明确测试范围、边界、限制条件，以及针对目标系统发起攻击的依据\n\
    - 采用统一的测试方法论：选择成熟的方法体系，确保覆盖所有测试要点无遗漏\n- 留存完整的文档记录：确保报告清晰易懂，测试人员需随时解答客户针对报告提出的疑问\n\
    - 选用适配的测试工具：工具可包含商业付费工具、开源工具、自动化工具、脚本以及标准命令行接口\n- 确保人员合规：所有测试人员均为合法渗透测试工程师，需遵守保密协议，具备职业操守，测试过程中避免对企业造成损害\n\
    ### 渗透测试的附加价值\n你还需要确保，不仅指出存在的问题，在报告发现结果时，还要提供修复问题的可行建议，始终给出解决方案。\n除开展渗透测试的四大核心原因外，还有几点其他价值值得你了解。\n\
    - 为漏洞发现结果附带可落地的修复建议，而非仅指出问题\n- 推动基础设施优化：针对硬件、软件、网络架构提出安全优化方案，提升企业整体安全水平\n- 制定漏洞预防方案：提前准备响应措施，避免漏洞被利用\n\
    - 评估网络设备安全性：检查防火墙、路由器、交换机、Web服务器、文件服务器及其他设备的安全防护效果\n- 验证现有防御体系：由于网络环境是动态变化的，过往测试结果无法反映当前安全状态，因此需要定期开展测试以确认安全管控措施的有效性\n\
    - 支撑安全团队建设：协助搭建或优化安全团队，针对特定漏洞开展定向培训，明确各系统负责人员的安全职责\n- 识别组织资产面临的威胁：不同行业的威胁特征存在差异，例如医院与中小企业的安全防护优先级各不相同\n\
    - 降低安全成本、提升投入产出比：识别并修复漏洞，避免不必要的安全投入，提升安全设备的利用效率\n- 为安全体系建设提供依据：可用于制定安全策略、流程、落地计划以及新架构设计方案\n\
    - 支撑企业运营规划：协助企业制定系统、流程、执行计划及长期发展规划\n- 满足监管合规要求：适配特定行业的法律法规要求\n- 降低法律风险：避免因未保护客户数据导致数据泄露，引发客户集体诉讼等法律纠纷\n\
    ### 渗透测试与其他安全测试的差异\n当我们讨论渗透测试时，你会接触到安全审计、漏洞评估等不同类型的测试术语。部分人可能会混用这些概念，但二者存在明显差异：\n\
    - 安全审计：核查企业是否遵循一套标准的安全策略与流程\n- 漏洞评估：侧重于发现网络中的漏洞，但无法判断漏洞是否可被利用，也无法评估漏洞被利用后可能造成的损害\n\
    综上，渗透测试是一种系统性的安全评估方式，涵盖安全审计的内容，同时验证攻击者是否能够成功利用系统中的薄弱点。\n### 渗透测试团队类型\n进行渗透测试时，你也会接触到不同类型的测试团队，共有两类，我来分别介绍：\n\
    - 红队（攻击队）：由道德黑客组成，无权限或仅拥有有限的企业内部资源访问权限，可提前通知或突击发起攻击，队伍可能包含企业不同部门的系统管理员，用于模拟真实恶意攻击者的行为\n\
    - 蓝队（防守队）：拥有全部企业资源与信息的访问权限，核心职责是检测并处置红队的攻击活动，预判突袭可能发生的方式。队伍可能包含系统管理员和普通IT人员，是成本最低、应用最广泛的评估方式\n\
    ### 渗透测试分类\n渗透测试的分类主要取决于测试方法、测试开始前企业向测试人员提供的信息量，以及测试是内部测试还是外部测试。\n- 白盒测试：测试人员在测试前已完全掌握基础设施相关信息，企业会提供网络拓扑图（含所有相关架构图）、资产清单和软件清单。这类测试适用于需要开展全面安全审计的场景。但需注意，信息安全是持续性的过程，渗透测试仅能反映测试当时企业的安全状态，无法代表长期安全水平。\n\
    - 黑盒测试：分为两类：\n  - 盲测：渗透测试人员不了解企业和目标的相关信息，但目标方会被告知审计范围，包括测试的内容、方式和时间。测试过程中，测试人员会模拟真实攻击者的侦查、踩点、扫描等行为，收集公开可获取的信息。由于耗时较长，这类测试成本较高。\n\
    \  - 双盲测试（零知识测试）：渗透测试人员不了解目标信息，目标方也不被告知审计范围，双方均不清楚测试的内容和方式。这类测试可以检验所有相关人员的安防意识，是当前应用较广泛的评估方法之一。\n\
    - 灰盒测试：是白盒测试与黑盒测试的结合，测试人员仅掌握部分信息（例如服务器域名）。相比黑盒测试，它跳过了黑盒测试早期的信息收集阶段，可节省测试时间。假设你能完成相关工作，它还可以提供\n"
