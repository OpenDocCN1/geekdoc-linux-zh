    几乎所有桌面操作系统都提供两种访问工具的方式：图形用户界面（又称GUI）和命令行界面（CLI）。所有现代操作系统都允许你通过GUI安全、稳定地运行各类专业的生产力和娱乐工具，并提供合适的环境供你开发自有软件，而这正是第一代个人计算机仅能实现的功能。所有Linux发行版都有这一共通点，但它们的差异也更有趣。

    Linux与其商业竞品最明显的区别在于不存在商业限制：其他操作系统有这类限制，但Linux没有。这意味着你可以自由地在任意数量的硬件设备上安装任意数量的Linux版本，无人可以干涉。这种自由度会改变你使用操作系统的方式，因为它赋予你足够的灵活性来做出最符合你需求的修改和自定义。将安装有Linux文件系统的硬盘从一台计算机拆下后安装到另一台，设备可以正常运行，这种情况十分常见，这在Windows或Mac
