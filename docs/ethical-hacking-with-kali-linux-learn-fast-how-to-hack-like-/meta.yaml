    purpose is: (you guessed it right) “nmap”.


    #### NetBIOS枚举

    Once you have done your port scan, you have a couple of other enumeration methods
    that you can use to give you a better picture. One of those is called “NetBIOS
    enumeration”. When you perform a NetBIOS enumeration, you use it to identify network
