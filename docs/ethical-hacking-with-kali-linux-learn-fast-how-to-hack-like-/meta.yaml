    cooling systems to keep them from melting down. Nevertheless, if you would use
    Linux, you could run virtualized processes, along with regular daily tasks on
    a simple PC, built from less than $300.


    As Linux is open source, many people have created their own versions of the OS,
    known as distributions or "distros" to fit specialized needs. The most famous
    of these is Google''s Android OS for smart phones, but there are hundreds of others,
    including enterprise deployment distros, such as Red Hat Enterprise, and its free
    community rebuild CentOS, for example. There''s a distribution specially optimized
    for scientific and advanced mathematical applications called Scientific Linux,
    Kali Linux for network security testing and management, which we will dive into
    more depth shortly, and other distributions built to be embedded in IoT or Internet
    of Things devices, such as Raspbian for the ultra-cheap Raspberry Pi development
    board.


    Distributions are often grouped into families. For example, a specific distribution
    might earn a reputation for stability, good design, quick patching, and a healthy
    ecosystem of third-party software. Instead of having to re-invent the wheel, other
    communities might fork derivative versions of that parent distro with their own
    customizations, and distribute it under a new name, but the original parent-child
    relationship remains.


    Updates and patches are pushed from the upstream parent to downstream to all the
    children. This is an efficient and effective way to maintain autonomous systems.
    The best known distribution families are Debian, which maintains a downstream
    ecosystem that includes the all-purpose Ubuntu, for example. Mint, Kali Linux,
    and Red Hat are responsible for CentOS, and consumer-focused Fedora distros; SUSE,
    which provides OpenSUSE; and the infamously complex but ultra-efficient Arch Linux,
    whose downstream followers include LinHES for Home Entertainment Management, and
    the GUI-focused Manjaro.


    You''ll also find Linux distribution images for all kinds of dedicated deployments.
    Extremely lightweight distros can be embedded in Internet of Things devices such
    as fridges or light bulbs. Docker containers are fast and efficient because they
    share the OS kernel with their Linux host environments, and they can be built
    using a wide range of Linux-based images.


    The cloud, led by AWS (Amazon Web Services) and Azure, the virtualized on-demand
    service computing platforms, is fantastic as it encompasses almost everything
    we know about computing. Linux is multipurpose and free; therefore, it''s the
    perfect operating system for cloud deployments. Another Linux version that is
    being used to run a significant majority of cloud instances is hosted on Microsoft''s
    Azure cloud platform.


    The significance of the industry-wide shift to the cloud is the appearance of
    specialized Linux distributions that are designed to deliver the best conceivable
    cloud experience by being as small and fast as possible. These specialty distros
    will frequently include out-of-the-box functionality that allows you to take advantage
    of your specific cloud host environment. These distros include AWS''s Amazon Linux
    AMI, for example. AMI stands for Amazon Machine Image, as do purpose-built long-term
    support Ubuntu releases. Long-term support or LTS releases are built to be as
    stable, using fully tested software and configurations. The reliability of such
    configurations makes it possible for the distro managers to continue to provide
    security and feature updates to a release for 5 years. You can deploy an LTS release
    as a server without worrying about having to rebuild it for all that time. If
    you like to try out the latest and greatest versions of software, you might go
    ahead and install the most recent interim release, but for stable environments,
    you have to have an LTS.


    In summary, open source software can be delivered using various license models.
    The GPL, the GNU General Public License, permits any use, modification, or redistribution
    as long as the original license terms aren''t changed. Creative Commons licenses
