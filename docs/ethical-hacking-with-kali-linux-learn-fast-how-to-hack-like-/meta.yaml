  md: '# Chapter 27 IPv6 Packet Capturing with Parasite6


    Imagine that you have a new assignment for penetration testing, and the company
    has two networks that require being broken into. Yet, one of them is very likely
    easy as there are no firewalls in place.


    But the second network seems like it''s more secured and it might take the whole
    day to figure out the possible volnaribility to exploit them. Certain people may
    start with the easy one that could be done under an hour.


    But, if you ask the right questions to the current network implementation that
    is running within the company, you may save yourself from extra head pain and
    have an easy day.


    IPv6 is running as a valid protocol in most computers in companies today. Therefore,
    by taking certain steps to disable it, you could leverage IPv6 according to its
    operation and compromise the network by a Man in the Middle attack.


    If you are aware of that and understand how to crack it, you may be able to finish
    your penetration testing within a short period of time, as the company possibly
    has not enabled all the security features on the network as they should have.


    Man in the Middle attack is achievable by many tools and we have discussed some
    of them already previously. Once we are approaching an IPv6 network, we can use
    another great tool called “Parasite6”.


    Let''s get back to basics and think of what happens when the PC boots the first
    time while connected to a network. Of course the PC first would ask for an IP
    address.


    In this case, an IPv6 address from the router that is on the same network, or
    if there is a DHCP Server, then the DHCP server would assign that IP address to
    that PC.


    Next, if that PC begins to communicate with the outside network or the Internet,
    first it should learn the Mac address of the router, and that would happen by
    using ARP or Address Resolution Protocol, but in IPv6 there is no such thing as
    ARP.


