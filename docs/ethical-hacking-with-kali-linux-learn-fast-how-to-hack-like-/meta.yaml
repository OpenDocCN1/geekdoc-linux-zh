    Of course, you need to replace the package name with your application name.


    Finally, I want to explain to you how your system uses official Kali repositories.
    All the magic happens in the “sources.list” file. You can take a look at that
    file by opening it using leafpad. Whenever you execute your update command, Kali
    looks in the contents of this file to perform the update process.


    Now it''s time to list some important tools that could be very helpful to you
    as a penetration tester.


    ### Preload

    The first one on the list is called the preload application. To install this package,
    execute the following command:

    ```bash

    sudo apt-get install preload

    ```

    The preload application identifies a user''s most commonly used programs and preloads
    binaries and dependencies into memory to provide faster access. It works automatically
    after the first restart, following the installation.


    ### BleachBit

    Your next tool is called BleachBit. BleachBit frees disk space and improves privacy
    by freeing the cache, deleting cookies, clearing internet history, shredding temporary
    files, deleting logs, and discarding other unnecessary files. This application
    has some advanced features such as shredding files to prevent recovery and wiping
    free disk space to hide traces of files that have not been fully deleted. The
    command you need to install BleachBit is:

    ```bash

    sudo apt-get install bleachbit

    ```


    ### Boot-Up Manager

    The next program is the boot up manager. Each application that executes during
    the boot up process slows down the system. This may impact memory usage and system
    performance. You can install the "boot up manager" to disable unnecessary services
    and applications that are enabled during the boot up. The command you need to
    install it is:

    ```bash

    sudo apt-get install bum

    ```


    ### GNOME Do

    The next application you should be aware of and install is called "gnome-do".
    If you like to execute applications from your keyboard, "gnome-do" is the right
    tool for you. The command you need to install this tool is:

    ```bash

    sudo apt-get install gnome-do

    ```


    ### apt-file

    Your next software in the list is the "apt-file". This is a command line tool
    to search within packages of the "apt" packaging system. It allows you to list
    contents of a package without installing or fetching it. The command you need
    to install it is:

    ```bash

    apt-get install apt-file

    ```

    Once you have installed the package, you also have to update it using the command:

    ```bash

    apt-file update

    ```


    ### Scrub

    The next application you need to install is called "Scrub". This application is
    a secure deletion program to comply with government standards. The command you
    need in order to install this tool is:

    ```bash

    sudo apt-get install scrub

    ```


    ### Shutter

    Next, you need to install "Shutter". Shutter is a screenshot tool that captures
    images of your desktop. The command you need in order to install this tool is:

    ```bash

    apt-get install shutter

    ```


    ### Figlet

    The next software you should install is called "Figlet". This program will make
    your console look professional by displaying a custom message, such as your company
    name, for example. The command you need in order to install this tool is:

    ```bash

    apt-get install figlet

    ```

    Next, you need to edit the `.bashrc` file, scroll to the end of the file, and
    add the `figlet <your-message>` command. Next, save and close the file, then restart
    your console. The next time you log back into your console session, the first
    thing you should see is the custom message you have provided.


    ### SSH Configuration

    Next, you need to be aware of SSH, aka Secure Shell, configuration. Kali comes
    with default SSH keys; yet before starting to use SSH on Kali, it is a good idea
    to disable the default keys and generate a unique key set. The process of moving
    the original keys and generating the new keyset is as follows.


    First, open your console and change the directory to the SSH folder.


    #### NOTE

    Here is some help on how to navigate within directories:

    - To return to the home directory immediately, use `cd ~` or `cd -`

    - To change into the root directory of the Linux file system, use `cd /`

    - To go into the root user directory, run `cd /root/` as the root user

    - To navigate up one directory level, use `cd ..`

    - To go back to the previous directory, use `cd -`


    Next, you have to create a backup folder, and you need to move the SSH keys to
    that backup folder.


    #### NOTE

    The `cp` command is a Linux command for copying files and directories. The syntax
    is as follows:

    - `cp source destination`

    - `cp dir1 dir2`

    - `cp -option source destination`

    - `cp -option1 -option2 source destination`


    In the following example, to copy the `/home/test/paper/` folder and all its files
    to the `/usb/backup/` directory, use the following command:

    ```bash

    cp -avr /home/test/paper/ /usb/backup/

    ```

    - `-a`: Preserve the specified attributes such as directory and file mode, ownership,
    timestamps, and if possible, additional attributes: context, links, xattr, all.

    - `-v`: Verbose output.

    - `-r`: Copy directories recursively.


    Lastly, you need to generate the new keyset, so use the following command:

    ```bash

    dpkg-reconfigure openssh-server

    ```


    Next, you will see the following messages, indicating that your SSH keys are generated:

    ```

    Creating SSH2 RSA key; this may take some time ...

    Creating SSH2 DSA key; this may take some time ...

    Creating SSH2 ECDSA key; this may take some time ...

    ```


    Next, you have to verify the SSH key hashes using the following command:

    ```bash

    md5sum ssh_host_*

    ```

    Here the `*` represents your new keys, so compare these hashes using the following
    commands:

    ```bash

    cd default_kali_keys/

    md5sum *

    ```


    After regenerating the SSH key pairs, you can start the SSH service via `/usr/sbin/sshd`
    from the CLI.


    Once you have started SSH, if you want to verify that the service is running,
    perform a `netstat` query. From the output, you should see that SSH is now listening
    on port 22.


    ## Chapter 4 Introduction to Penetration Testing


    We have already discussed Linux basics, specifically Kali Linux, as well as what
    additional software and hardware you might require as an Ethical Hacker. Yet,
    instead of jumping right onto Kali''s command line or graphical user interface,
    you should know more about the procedures once you take on a job as an Ethical
    Hacker. Therefore, first, we''re going to look at understanding penetration testing,
    and how it works in terms of reconnaissance and footprinting. After that, we are
    going to discuss how to pen test and how to scan your targets.


    First, we have to understand why we pen test in the first place. That may seem
    an obvious question, but we''ll give you some more details here. Next, we''ll
    talk about the different types of pen tests, but there are not only different
    types, but different individuals who are also involved that you should be aware
    of. Then we''ll go through the three different stages of pen testing so you fully
    understand what those are. We''ll look at the pre-attack stage, which we spend
    a lot of time in because we want to set some parameters, as well as protecting
    ourselves legally. Then we''ll look at stage 2 where we''ll look at the things
    that we''ll do during the attack. Afterward, we''ll look at the post-attack steps,
    and we''ll talk about the standards that you are required to be following. Some
    of the standards are done by manufacturers, and some of them are open standards,
    so you''ll need to decide which one you wish to follow based on what you''re trying
    to accomplish. Once you find the standard for yourself, stick to it.


    But to the question: "Why do we pen-test in the first place?" Well, this seems
    like an easy question or that you would think the answer is pretty straightforward,
    but there are a few reasons why we do pen tests. First of all, we want to evaluate
    the current security profile of the organization by simulating an attack to find
    out what vulnerabilities a malicious attacker could exploit. Another legitimate
    reason we do pen test is to create security measures. Since we''re going after
    the network, doesn''t it make sense to go ahead and figure out or maybe redesign
    our current security mechanisms?'
