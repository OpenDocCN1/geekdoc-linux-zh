    # # Chapter 9 Introduction to Footprinting


    When it comes to penetration testing and footprinting the target, the purpose
    is to determine what information is available publicly of your target. These are
    information that''s available on the internet, such as network architecture, operating
    systems, applications or users.


    This is passive as far as the research is concerned. You as a pen-tester have
    to try any possible way that you can to go after either hosts or networks.


    It could be either of them, but you have to use any possible way that you can
    to gather as much information as possible before you get into the next stage of
    the penetration test.


    If you find sensitive information on any website or any location that''s publicly
    available, that information needs to be reported to the organization in your report.


    If you find information that you believe is critical and you think it should not
    wait a month or even a week before you submit the full report, you want to notify
    your emergency contact immediately.


    This stage of the attack should help preventing information leakage, and help
    you with social engineering attempts. Let''s look at specifics.


    The first thing you can do is get proper authorization, and that''s going to be
    from whoever is in charge. It may or may not include system administrators.


    Many times companies must know how their system admins are performing. After you
    go through that process, you must ensure that you define the scope.


    Limiting the scope of the pen test is a prerequisite. Going through this stage
    helps to set you up the list of items needs to be tested. For example; what are
    the IP ranges or subnet ranges of the systems, or what are your limitations.


    After you''ve defined the scope, you should plan and gather information about
    that scope using your reconnaissance tools. You have to start with search engines
    such as Google, Bing or Yahoo, whichever one you must use to look at what information
    is currently being exposed.


    You can also check some other specific sites too such as social networking sites
    like Facebook, and see if there is a Facebook page or Twitter account for the
    company.'
  - '[PAGE 56]


    Next, you should see who are friends of that company because that''s where you
    are going to find existing employees and see if you can backtrack from there.


    After you are done looking through the search engines, you have to try to see
    if you can "Google hack" them. You can do that by utilizing additional tools that
    give you a Graphical User Interface such as SiteDigger or the Google Hacking Database.


    By doing Google hacking, it will allow you to find resources that have been crawled
    by the Google search engine that companies may not know are being listed there
    such as printers or cameras, which could provide you an insight of IP addresses
    that are exposed, or what the machine they have.


    Your next step after the Google hack is to go after social networks, such as Facebook,
    Twitter or LinkedIn.


    People have a tendency at the social networking level to let their guards down.
    It''s easy not to see what people are talking about, but start-up conversations
    with users or the employees could be a great way to gather information.


    You might go and start a chat with an existing employee and say: "Hi, it looks
    like you''ve got an excellent company, and I have been thinking about joining
    the IT team. What type of devices do you use in there?"


    Your next step is to go and footprint the websites, and you are going to do that
    with either BlackWidow or Web Site Copier. With these tool, first you have to
    download their website so that you can look at it offline and look at the code.


    You have to remember that everything that''s presented to you in a web interface
    are files that are downloaded to your system. Therefore why not download an exact
    copy of that website so you can take a look at what they''re doing at the back-end,
    particularly if they''re making calls from the front-end to the back-end.


    Next, you can start looking into some email footprinting. You can use some great
    tools that''ll do that for you such as the "nslookup" command to find out the
    DNS names and IP addresses of their servers.


    Some of the information that you can get out from emails includes the'
  - '[PAGE 57]


    encryption that they''re using and other services that could be used along with
    their email environment.


    You can also find out how they are hosting the email servers or what hosting providers
    they use. Next, you can do some competitive intelligence.


    Competitive intelligence is the way that most businesses are using to find out
    about their competitors. Attackers can use the very these same resources to find
    out what the people are doing, and it''s also an excellent way for companies to
    discover what projects their competitors are working currently.


    Next, you should do a "whois" reconnaissance, so you can find out who owns the
    IP address range or their domain. To accomplish this, you can use tools such as
    Domain Dossier or SmartWhois.


    Sometimes these tools will also do some necessary enumeration based on DNS, which
    is your next step. For DNS reconnaissance, you can use tools such as Sam Spade
    or DNSstuff, but you always use the "nslookup" command too, which is very powerful.


    One of the reasons why you should do a DNS reconnaissance is because you are able
    to determine key hosts in the network that you can then use to perform social
    engineering attacks or you could use during a DNS poisoning attack.


    Your next step is to perform a network reconnaissance. For this purpose, you should
    use types of tools, such as "Path Analyzer Pro", which will shows you the path
    that a packet takes, or Network Pinger or VisualRoute tool that allows you to
    find out further information about the targeted network.


    These will help you to draw a better diagram of what you are dealing with. You
    should also try some social engineering attack that includes "shoulder surfing"
    to see if you can gather information by watching what people are doing.


    Other social engineering attacks also include dumpster diving or eavesdropping.
    These will allow you to gather information, such as the organization''s security
    products that they''re using, operating systems, software versions, network layout,
    IP addresses or the names of their servers.


    You must ensure that you document everything that you find. This is because you
    will have to use this document and all the information that you have'
  - '[PAGE 58]


    collected to understand and analyse the security posture of your target.


    You will be surprised with the information you can conclude from what you pull
    off using this method. This is why it''s so important to spend as much time as
    possible here, so you can create a map of everything else you''re about to do.'
