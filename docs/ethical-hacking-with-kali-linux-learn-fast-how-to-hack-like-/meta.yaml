  md: '# Chapter 31 Armitage Hail Mary


    Armitage is an excellent GUI frontend for the Metasploit framework. Armitage was
    developed with the goal of helping security professionals better understanding
    hackers and how they deploy various attacks.


    For further information about this excellent project, please check the Armitage
    official website at fastandeasyhacking.com. How to use Armitage?


    Well, Armitage is also included in Kali Linux, hence all you have to do is to
    turn it on is type within your command line interface:


    ```

    "armitage"

    ```


    Then press enter. You can just accept the default options for the window it pops
    up the first time, and click on the Connect button, then click Yes to start the
    Metasploit RPC server.


    The Armitage user interface has three main panels called Modules, Targets, and
    Tabs. You can click the area between those panels to resize them if you wish,
    but let''s look at each of these panels.


    The module browser panel allows you to launch a Metasploit auxillary module, an
    exploit, or generate a payload and run a post-exploitation module.


    The target panel shows your targets. Armitage represents each target as a computer
    with its assigned or static IP address and other information about it below the
    computer icon.


    Once you run the Armitage tool, it should already identify one hosts if you have
    other systems running in your session. If you have many hosts, the graph view
    will become difficult to work with.


    If this happens, for this situation, Armitage has a table view instead. Therefore,
    go to Armitage menu item, then select the "Set Target View", and then select the
    "Table View" option. Down below, you have the tabs area.


    Armitage opens each dialog console and table in a tab below the module and target
    panels. Metasploit console or Meterpreter console and shell interfaces are each
    use a console tab.


    A console tab allows you to interact with those interfaces through Armitage. If
    you want to open a new console, you have to go to the View menu and select Console.'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'Armitage logs are all console shell and the event-log will gives you an output
    for you. It organizes those logs by date and nodes. You will find these logs in
    the Armitage folder.


    Go to View, then Reporting, select then the "Activity Logs" to open the folder.
    Imagine that you want to export all traffic you have done in this application.


    Armitage and Metasploit share a database to track your hosts, services, vulnerabilities,
    credentials, and user agent strings, captured by browser exploit modules.


    To get all this information, go to View, Reporting, and then click on Export Data.
    This option will export the data from Metasploit and create easily parsable XML
    tab separated value files.


    When it comes to workspaces, Armitage Dynamic Workspaces feature allows you to
    create views into the host database and quickly switch between them.


    To better understand what I''m talking about, select the Workspaces menu, and
    then click on Manage. To manage your dynamic workspaces, you may add, edit, and
    remove workspaces you already created.


    To start an attack, Armitage bundles several Metasploit scans into one feature
    called MSF Scans. This feature will scan for a handful of open ports.


    Similarly to nmap, it then enumerates several common services using Metasploit
    auxillary modules which are built in for the purpose. For your example, you can
    be attacking a Windows XP machine.


    You can select it, right click, and then click on Scan. You may also go to Hosts
    menu, and click on MSF Scans, as they both will give you the same functionality.


    After the scan is complete, before you go and start attacking, you must choose
    your weapon. Armitage makes this process very easy. Select the "Attacks" menu
    and click on Find Attacks.


    The "Find Attacks" option will generate a custom attack menu for each host. To
    exploit a host, right click on it and navigate to Attack, and choose an "Exploit"
    from the list.


    The "Exploit" dialog allows you configure options for a module and choose whether
    to use a reverse connect payload or not. For remote exploits,'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'Armitage chooses your payload for you.


    Generally, Armitage will use Meterpreter for Windows targets, and a command shell
    payload for UNIX targets. After this, all you have to do is to click on the "Launch"
    button.


    If the exploit is successful, Armitage will make the host red and surround it
    with spooky lightning balls. If manual exploitation fails, don''t worry. You have
    the "Hail Mary" option.


    Go to the "Attacks" menu and click on the "Hail Mary" to launch this feature.
    Armitage''s Hail Mary feature will find exploits relevant to your target, then
    filters the exploits using known information, and then sorts them into an optimal
    order.


    This feature won''t find every possible shell, but it''s a good option if you
    don''t know what else to try. Armitage makes it easy to manage the Meterpreter
    agent once you successfully exploit a host.


    Next, you can right-click on the "host" to access the Meterpreter menu, then select
    "Meterpreter" and choose whatever you like from the list.


    For example, you can select the "browse files from the list". Do not be surprised
    if it finds directory items on the victim''s machine. Armitage is great and very
    easy to use, but I recommend you to practice with it and see which attack method
    is most successful to your requirements.


    Lastly, I will ask you again to make sure that you have written authorization
    for using Armitage in a live or production environment. If you are only practicing
    in your home lab, in a non production environment, that should cause no issue
    to anyone; still I would suggest you turn off your router and practice with care
    without any connection to the internet.


    # Chapter 32 The Metasploit Framework


    Exploitation is the heart of ethical hacking. By exploiting vulnerabilities you
    can start making assumptions how dangerous it can be.


    The Metasploit Framework, or MSF is an open source tool designed to facilitate
    penetration testing. The application is written in the Ruby programming language.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'It uses a modular approach, thus facilitating exploits. This makes it easier
    to develop and code exploits, and it also allows for complex attacks to be easily
    implemented.


    The exploit module is the code fragments that target specific vulnerabilities.
    Active exploits will exploit a specific target and run until completed, and then
    exit.


    On the other hand, passive exploits wait for incoming hosts, such as web browsers
    or FTP clients, and exploits them when they connect to the network.


    Payloads are the malicious code that implements commands immediately following
    a successful exploitation. Auxiliary modules do not establish or directly support
    access between the pen tester and the target system.


    Instead, they perform related functions, such as scanning, fuzzing, or sniffing
    that support the exploitation phase. Following a successful attack, the post modules
    run on compromised targets to gather useful data and pivot the attacker deeper
    into the target network.


    Encoders are used to bypass anti-virus defences, and these modules encode the
    payload so it cannot be detected using signature matching techniques.


    Lastly, the No-Operations modules are used to facilitate buffer overflows during
    attacks. The steps for exploiting a target system using MSF start first with choosing
    and configuring an exploit.


    Next, you need to check the target system to determine if it is susceptible to
    attack by the exploit. This step is optional, and it should be your method to
    minimize the detection.


    After that, you can choose and configure the payload, which is the code that will
    be executed on the target system following a successful exploitation. An example
    of a payload would be something like a reverse from the compromised system back
    to the pentester host.


    After this step, you can also choose an encoding technique to bypass detection
    controls, like intrusion detection system or anti-virus software. Lastly, you
    have to execute the exploit.


    Let me explain how it is done. As a pen tester, you should investigate every vulnerability.
    For example, on port 6667 Metasploitable runs the application called "unrealircd",
    which is an IRC daemon.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'This version contains a backdoor that you might not notice for months, triggered
    by sending the letters A, B, following by a system command to the server on any
    listening port.


    Metasploit has a module to exploit this in order to gain an interactive. To start
    the hack, open the console first. In Kali, you will need to start up the "PostgreSQL"
    server before you start the frame.


    Next, you have to run the "msfconsole" application. Like any console application,
    entering how or a question mark once in the command prompt, so this will display
    and list all available commands along with a description of what they are used
    for.


    You can start organizing your project by using what are called workspaces. You
    can create a new workspace for your lab, and by the way the "-a" argument is used
    for adding a workspace.


    Next, to ensure that a new workspace is selected, issue the


    ```

    "workspace"

    ```


    command all the workspaces that are stored in the Metasploit database. Next, search
    for your exploit by using the


    ```

    "search"

    ```


    command. The returned exploit for the IRCD service might be listed, and it assigns
    the relative ranking of how successful it is at achieving an exploit.


    You can copy the exploit name to use it in the next commands. Additional information
    about this exploit can be obtained by using the


    ```

    "info"

    ```


    command. The returned information should include references, as well as information
    about this exploit. It''s better to check it out before proceeding and wasting
    your time.


    To instruct Metasploit that you will attack the target with an exploit, you issue
    the


    ```

    "use"

    ```


    command. After the "use" command, Metasploit changes the command prompt from "msf"
    to "msf exploit (unreal_ircd_3281_backdoor)".'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'If you need to set any options for the exploit, you can do it by executing
    the “show options” command. For example if you need to set the required field
    for the remote host, which is the IP address of the system being attacked, to
    change the value of any option, you start by the “set” keyword, followed by the
    option name, and finally, you enter the option value.


    To execute the payload, type “show payload” command to list all the suitable payloads
    for this exploit. There''s a bunch of them, but you can select the “reverse shell
    payload” for this example. Why would you do that? Well, this is because it''s
    a popular payload for UNIX shells. When I say popular, it means people used it
    before with a good success rate.


    Next, you need to check the options for the selected payload. The Payload option
    will ask you to enter a value for the local host IP address. You can check that
    out with the command “if config”.


    Enter the value and press Enter. To start the attack, enter the “exploit” command
    and press Enter. Metasploit initiates the attack and will confirm by indicating
    Command shell session 1 opened, and giving the IP addresses that originate and
    terminate the reverse shell.


    When a system is compromised to this extent, it is ready for the post-exploitation
    activities. Post Exploitation is a part of the workflow where the attacker achieves
    the full value of the attack.


    Once a system has been compromised, the attacker generally performs the following
    activities. He or she conducts a rapid assessment to characterize the local environment,
    such as infrastructure, connectivity, accounts, presence of'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'target files or applications that can facilitate further attacks.


    It also locates and copies or modifies target files of interest such as data files
    or financial information. Furthermore, it creates additional accounts and modifies
    the system to support post-exploitation activities.


    In addition, it attempts to vertically escalate the privilege level by capturing
    administrator or system-level credentials, and tries to attack other data systems
    that are called horizontal escalation.


    By pivoting the attack through the compromised system to the remainder of the
    network, it installs persistent backdoors and covert channels to retain control
    and have secure communications with the compromised system.


    Lastly, the attacker can remove indications of the attack from the compromised
    system. To be successful, the post-exploit activities require comprehensive knowledge
    of the target''s operating system to ensure that protective controls can be bypassed.


    You have already learned how to exploit the system previously, so you will put
    the session in the background by pressing "Ctrl+Z", and type "y" to confirm.


    It is essential to know the session ID for the post-exploitation module that you
    are going to use. This can be obtained with the "sessions" command.


    If you have used this tool for the first time, your session is 1. One of the first
    modules that you can try is called the "hashdump", which will try to collect the
    password hashes of the system.


    The only setting that you need to insert here, is the session Id. Before you proceed,
    you need to set the session Id in the options section.


    Another very interesting post-exploitation module of Metasploit is the "enum_configs",
    which will obtain all the important configuration files, and will store them in
    your system.


    You should see in the output a sample of the configuration files that has been
    obtained from the remote system.


    If you want to check one of those txt files by using a text editor application,
    copy one of them, open a new console, and use the tool called "nano application"
    to see its contents.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'Once you ready to move on, close this window, and go back to your main window.
    This time you will need to enumerate the network configurations with "enum_network"
    module.


    The "enum_network" command saves everything you have found in text files, so you
    can check them to discover what kinds of installations exist on the remote system
    such as IDS, anti-virus, IPS or firewalls.


    Next, you can use "enum_protections" module, but you can also enumerate the entire
    system by obtaining information regarding the user accounts, the installed packages,
    the services, the hard disk, the Linux version and so on.


    To get all this information, you can use the


    ```

    "enum_system"

    ```


    command, and you can check out the contents of the generated text files. To discover
    information from the user history, there is a Metasploit module for that as well
    that stores this information on your local system which is called "enum_users_history".'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# ## Chapter 33 Social-Engineering Toolkit


    Social Engineering is an important technique that you should be aware of, and
    shortly you will understand how hackers use social engineering applications tricking
    victims into executing the vulnerable trap.


    SET or Social-Engineering Toolkit is an open source Python-driven framework that''s
    specifically designed to facilitate social engineering attacks.


    A significant advantage of the Social-Engineering Toolkit is its inter-connectivity
    with the Metasploit framework which provides the payloads needed for exploitation,
    the encryption to bypass antivirus, and the listener module that connects to the
    compromised system when it sends a shell back to the attacker.


    To start the Social-Engineering Toolkit, type the command "setoolkit" and press
    Enter. You have multiple options to select from when this application loads. The
    first one is the Social-Engineering Attacks, which offers a mix of Social-Engineering
    methods.


    The second one is the Fast-Track Penetration Testing, which provides rapid access
    to some specialized tools. You can type number 2 to select this option.


    Next, you will be presented further options. The first tool is a password cracking
    of SQL databases, the second are some customized exploits that are based on Python.


    After that, we have the User Enumeration, and finally it contains the PSEXEC Powershell
    Injection. You can type number 99 to go back to the main menu, but if you select
    the first choice which contains tools for Social-Engineering Attacks, all you
    have to do is press number 1 on your keyboard.


    Once you have selected this option, once again you will have further options.
    The first one on the list is the Spear-Phishing Attack Vectors which allows an
    attacker to create email messages and send them to targeted victims with attached
    exploits.


    Next, we have the website Attack Vectors which utilize multiple web-based attacks.
    If you select that to see the details, simply press number 2 on your keyboard.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'Once you have selected this option, you will be presented with further options
    once again. The first on the list called Java Applet Attack Method that spoofs
    a Java certificate and delivers a Metasploit-based payload.


    This is known as one of the most successful attacks, and it is effective against
    all systems such as Windows, Linux or OSX targets. Next on the list is called
    the Metasploit Browser Exploit Method that delivers a Metasploit payload using
    an I-frame attack.


    Next on the list we have what it''s called the Credential Harvester attack method
    that clones a website and automatically rewrites the post-parameters to allow
    an attacker to intercept and harvest user credentials.


    Next on our list we have what is called the Tabnabbing Attack Method which replaces
    information on an inactive browser tab with a cloned page that links back to the
    attacker.


    After that we have the Web Jacking Attack Method which utilizes I-frame replacements
    to make the highlighted URL link appear legitimate. Last on the list we have the
    Multi-Attack web Method that allows an attacker to select some or several, or
    all attacks that can be launched at once.


    If you go back to the previous screen and check the rest of the attacks listed,
    the Infectious Media Generator for example creates an auto-run file and Metasploit
    payload.


    Once this copied to a USB device and inserted into target system, it will trigger
    and auto-run and compromise the system. Next, it will create a Payload and Listener
    module which is a rapid menu-driven method, creating a Metasploit payload.


    After that, we have what is called the Mass Mailer Attack which allows the attacker
    to send multiple customized emails to a single email address, or a list of multiple
    addresses.


    Next, we have the Arduino-Based Attack Vector which programs Arduino-based devices.
    Because these devices register as a USB keyboard when connected to a physical
    Windows system, they can bypass security based on disabling the auto-run or other
    endpoint security.


    The Wireless Access Point Attack Vector for example will create a fake wireless
    access point and DHCP server on the attacker''s system and redirect'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'all DNS queries to the attacker.


    The hacker can then launch various attacks, such as the Java Applet Attack or
    a Credential Harvester Attack. The QRCode Generator Attack Vector for example
    creates a QR code with a defined URL associated with an attack.


    The Powershell Attack Vectors will allow the attacker to create attacks that rely
    on Powershell, a command-line shell and scripting language available on all systems
    such as Windows, Vista, and higher versions.


    Lastly, we have Third Party Modules that allow the attacker to use the remote
    administration tool as part of a Java Applet Attack, or as an isolated payload.


    This tool is a text, menu-driven, remote access tool. Covering all these methods
    would take another book by itself, but as you see SET is very user friendly and
    pretty much anyone can use it because all you have to do is decide which attack
    you want to implement, then press their associated number on your keyboard.


    Lastly, I will ask you again to make sure that you have written authorization
    for using SET in a live or production environment. If you are only practicing
    in your home lab, in a non production environment, that should cause no issue
    to anyone; still I would suggest you turn off your router and practice with care
    without any connection to the internet.'
  merge: -1
  pgno: 150
