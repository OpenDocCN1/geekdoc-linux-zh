    on Kali. If the Apache webserver is not running yet, you normally have to start
    it manually; but if you do use your Kali machine, it will automatically start
    it for you.


    If Apache is already running in the background, Xplico will use that server function
    to launch itself. Next, it would tell you to use a specific URL to open Xplico,
    using a webserver.


    You might choose to click on the provided link to open Xplico, or you can just
    copy and paste the address to yor browser session. The link is: http://localhost:9876/


