    ## 第15章 Burp爬虫与SQL注入

    在对网络应用进行渗透测试时，你可以做的第一件事就是使用Burp Suite对目标主机进行爬取。这意味着Burp会遍历整个网站，记录该站点上所有不同的文件和HTTP方法。

    为什么要对目标主机进行爬取呢？这是因为你需要识别所有链接的位置、应用中使用的参数类型、应用引用的外部站点，以及应用运行的总体架构。

    要爬取你的应用，你需要确保已选中「目标」选项卡，同时也选中「站点地图」选项卡。接下来，右键点击你之前添加到作用域中的域名，然后点击名为「爬取此分支」的选项。爬取流程完成后，Burp就会生成应用结构的完整布局。

    你也可以点击Burp提供的列表中的任意文件，查看对应的请求和响应内容。同样，在左侧栏中，你可以在「mutillidae」文件夹下查看网站结构。站点地图选项卡下方的右上角有一个筛选按钮，你可以尝试调整筛选条件，查看哪些内容被过滤、哪些设置适合你的需求。通常建议先将所有域名添加到作用域中，再点击筛选按钮仅显示作用域内的内容。

    有时候，网页或文件夹不会在网络应用中直接显示链接。例如，我们常常会发现管理文件夹或登录页在网站的任何位置都没有被引用。这是因为网站管理员试图对普通用户隐藏这些文件夹和管理员登录页。这些就是你在渗透测试中需要寻找的内容，这样你才能尝试绕过或暴力破解授权流程。

    Burp中有一个专门针对这类场景的模块，叫做「发现内容」，非常实用。如果你打开浏览器并输入Metasploitable虚拟机的IP地址，Burp Suite应该会拦截你的请求，因此你需要先停止拦截。

    接下来，点击「mutillidae」超链接。Mutillidae是一个存在漏洞的网络攻防练习应用，由PHP脚本构成，包含OWASP Top 10中的所有漏洞。你只需访问mutillidae.com的网页，就可以对该站点发起全新攻击。Burp
    Suite应该已经识别到了它的存在。

