    ## Chapter 31 Armitage

    Armitage is an excellent GUI frontend for the Metasploit framework. Armitage was
    developed with the goal of helping security professionals better understand hackers
    and how they deploy various attacks. For further information about this excellent
    project, please check the Armitage official website at fastandeasyhacking.com.


    How to use Armitage? Well, Armitage is also included in Kali Linux, hence all
    you have to do to turn it on is type within your command line interface:

    ```

    armitage

    ```

    Then press enter. You can just accept the default options for the window that
    pops up the first time, and click on the Connect button, then click Yes to start
    the Metasploit RPC server.


    The Armitage user interface has three main panels called Modules, Targets, and
    Tabs. You can click the area between those panels to resize them if you wish,
    but let''s look at each of these panels. The module browser panel allows you to
    launch a Metasploit auxiliary module, an exploit, or generate a payload and run
    a post-exploitation module. The target panel shows your targets. Armitage represents
    each target as a computer with its assigned or static IP address and other information
    about it below the computer icon. Once you run the Armitage tool, it should already
    identify hosts if you have other systems running in your session. If you have
    many hosts, the graph view will become difficult to work with. If this happens,
    Armitage has a table view as an alternative. Therefore, go to the Armitage menu
    item, then select the "Set Target View", and then select the "Table View" option.


    Down below, you have the tabs area. Armitage opens each dialog console and table
    in a tab below the module and target panels. Metasploit console, Meterpreter console
    and shell interfaces each use a console tab. A console tab allows you to interact
    with those interfaces through Armitage. If you want to open a new console, you
    have to go to the View menu and select Console.


    Armitage logs all console shell activity, and the event log will give you an output
    of all actions. It organizes those logs by date and nodes. You will find these
    logs in the Armitage folder. Go to View, then Reporting, select the "Activity
    Logs" to open the folder.


    Imagine that you want to export all traffic you have done in this application.
    Armitage and Metasploit share a database to track your hosts, services, vulnerabilities,
    credentials, and user agent strings captured by browser exploit modules. To get
    all this information, go to View, Reporting, and then click on Export Data. This
    option will export the data from Metasploit and create easily parsable XML tab-separated
    value files.


    When it comes to workspaces, the Armitage Dynamic Workspaces feature allows you
    to create views into the host database and quickly switch between them. To better
    understand this feature, select the Workspaces menu, and then click on Manage.
    To manage your dynamic workspaces, you may add, edit, and remove workspaces you
    have already created.


    To start an attack, Armitage bundles several Metasploit scans into one feature
    called MSF Scans. This feature will scan for a handful of open ports. Similarly
    to nmap, it then enumerates several common services using Metasploit auxiliary
    modules which are built-in for this purpose. For example, you can be attacking
    a Windows XP machine. You can select it, right click, and then click on Scan.
    You may also go to the Hosts menu, and click on MSF Scans, as both options give
    you the same functionality.


    After the scan is complete, before you start attacking, you must choose your weapon.
    Armitage makes this process very easy. Select the "Attacks" menu and click on
    Find Attacks. The "Find Attacks" option will generate a custom attack menu for
    each host. To exploit a host, right click on it and navigate to Attack, and choose
    an "Exploit" from the list. The "Exploit" dialog allows you to configure options
    for a module and choose whether to use a reverse connect payload or not. For remote
    exploits, Armitage chooses your payload for you. Generally, Armitage will use
    Meterpreter for Windows targets, and a command shell payload for UNIX targets.
    After this, all you have to do is click on the "Launch" button.


    If the exploit is successful, Armitage will mark the host red and surround it
    with spooky lightning balls. If manual exploitation fails, don''t worry. You have
    the "Hail Mary" option. Go to the "Attacks" menu and click on the "Hail Mary"
    to launch this feature. Armitage''s Hail Mary feature will find exploits relevant
    to your target, then filters the exploits using known information, and then sorts
    them into an optimal order. This feature won''t find every possible shell, but
    it''s a good option if you don''t know what else to try.


    Armitage makes it easy to manage the Meterpreter agent once you successfully exploit
    a host. Next, you can right-click on the host to access the Meterpreter menu,
    then select "Meterpreter" and choose whatever you like from the list. For example,
    you can select the option to browse files on the victim''s machine. Do not be
    surprised if it finds directory items there.


    Armitage is great and very easy to use, but I recommend you to practice with it
    and see which attack method is most successful for your requirements. Lastly,
    I will ask you again to make sure that you have written authorization for using
    Armitage in a live or production environment. If you are only practicing in your
    home lab, in a non-production environment, that should cause no issue to anyone;
    still I would suggest you turn off your router and practice with care without
