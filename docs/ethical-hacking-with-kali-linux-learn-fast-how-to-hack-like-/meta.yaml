  md: '# ## Chapter 29 DoS Attack with MKD3


    Another enterprise security threat is of course the DOS or Denial of service attacks.
    As the name suggests, a denial of service attack, if successful, prevents other
    people using the resource or services.


    It disrupts the services for other users. There was a case in the press where
    an individual had decided that he was tired of people using their cell phone while
    driving so he drove around with a cellular jammer in his car and as he was driving
    around he was jamming all the frequencies on the cellular network.


    So vehicles around him, those people can''t use their cell phones and you might
    say, wow that''s a great idea, but you have to remember that law enforcement,
    ambulances, also use the cellular services.


    Therefore when you disrupt frequencies on cellular network for other people, you''re
    also disrupting it for services that you don''t want to be disrupting it for.
    This particular individual was tracked down eventually, and once they found him,
    and he got arrested, and he got heavily fined.


    But, how do you execute a denial of service attack? Well, In wireless there are
    two major ways. The first is to bombard your Wi-Fi access point with useless traffic.
    If you create a lot of traffic and the access point is trying to decide what to
    do with that, does it process all those authentication request?


    What if you sent a probe request, and while the access point is dealing with that
    traffic, it''s not dealing with other user traffic. So basically, one approach
    is just to occupy the access point so it then can''t handle legitimate traffic.


    The second approach is simply to create noise and interference in the frequency
    band that the access point is operating on. I can broadcast signals that just
    disrupt and interfere with any other signals that are going over the air at the
    same time.


    Well, in this chapter, I''m going to share with you how to perform a DOS attack.
    Denial of service or DOS means that we are going to kicking everybody off of a
    network and denying them service.


    First, we need to attack our wireless network adapter. Once you''ve done that,
    you need to open up a terminal and then type;'
