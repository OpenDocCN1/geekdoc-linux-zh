    written by full-time staff of large technology companies, including Google and
    Microsoft. Oddly, viewing the license for use of open source software on your
    device is not always so easy. Desktop apps will frequently make their license
    information available through the "Help and About" menu selections, but in other
    cases the best way to find licensing information on a specific product is to visit
    its website.


