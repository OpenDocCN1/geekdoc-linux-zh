    ## 第13章 Burp Scanner的目标配置

    一个非常适合Web渗透测试的环境是mutillidae.com网站，该网站已预先安装在“metasploitable”主机上。metasploitable是一款Linux操作系统，专为渗透测试预装了相关配置。要下载metasploitable主机的副本，你需要访问SourceForge.net上的项目官网，点击metasploitable
    Linux压缩包条目下载对应虚拟机副本。要在浏览器中访问mutillidae.com网站，请输入你的metasploitable主机的IP地址，你当前使用的会是私有地址，后面跟上Web应用名称mutillidae。接下来，你需要通过上一章安装的Foxy
    Proxy菜单选中Burp代理来启用它。回到Burp Suite，点击Proxy选项卡，再点击Intercept选项卡，然后点击Intercept按钮将其关闭。暂时不需要拦截任何请求。接下来点击Target选项卡，确保选中了Sitemap选项卡。你应该能看到你刚刚捕获并转发的mutillidae
    URL。下一步需要将其添加到作用域中：右键点击mutillidae文件夹，选择“添加到作用域”选项。作用域用于定义自动化爬虫和测试的生效范围，也能帮助你避免主动扫描作用域外的域名。


    漏洞扫描器是自动化工具，会爬取应用程序以识别已知漏洞的特征。漏洞扫描器的活动特征明显，通常会被受害者检测到。但在互联网的日常后台探测中，扫描行为经常会被忽略。Burp
    Scanner是Burp Suite软件专业版中包含的动态Web应用扫描器，该工具可以自动扫描网站，检测常见安全漏洞，包括SQL注入、跨站脚本攻击、XML注入、Cookie标志缺失等更多问题。本章将为你讲解如何使用Burp
    Suite完成全量扫描。你依然会使用mutillidae.com网站来完成本次目标。请先参考前一章了解Burp Suite的基础使用方法，再继续学习后续内容。准备就绪后，点击Foxy
    Proxy图标启用Burp Suite代理，从列表中选择你的代理。刷新页面后回到Burp Suite，选择Proxy选项卡，再点击Intercept选项卡，关闭拦截功能。默认情况下，Burp
    Scanner配置为对所有域名执行被动扫描，主动扫描处于禁用状态。在Burp Scanner选项卡中，选择“实时扫描”，确保实时主动扫描部分选中了“使用套件作用域”选项。


    接下来选择Target选项卡，再点击Sitemap选项卡，展开你的目标。现在可以开始对应用程序进行爬取了，切换到Spider选项卡查看爬虫进度。当数值停止上升时，说明执行过程已经完成。爬取过程完成后，回到Sitemap选项卡，右键点击你的目标，选择“主动扫描此分支”选项。Burp
    Suite会弹出名为“主动扫描向导”的新窗口，这是Burp Scanner的简易配置工具。配置的第一步是允许你移除特定类型的资源，包括图片、JavaScript或样式表。大多数情况下默认配置已经足够，你只需点击“下一步”按钮即可。在下一个界面中，工具会显示一个表格，包含Burp
    Scanner扫描期间将要包含的所有端点及参数列表。仔细核对该列表并移除不相关或可能导致故障的端点非常重要。确认选择后，点击“确定”开始扫描。你可以在Burp
    Scanner的“扫描队列”选项卡中查看扫描进度。该表格会展示已完成的扫描请求和正在进行的请求信息，同时也会通过展示每个端点发现的问题数量来概览扫描结果。你也可以在该表格中选择对应资源，右键点击后选择“删除”选项来移除条目。此外，你还可以通过该菜单暂停或重启整个扫描器。


    扫描整个Web应用可能需要数分钟，有时甚至需要数小时。不过你随时可以通过查看Burp Scanner“结果”选项卡中的发现项来分析结果。和Sitemap部分类似，该可视化功能会将漏洞按端点和类别分组，以更便捷的方式呈现。如果Burp
    Scanner发现任何跨站脚本漏洞、SQL注入或路径遍历漏洞，你可以点击特定安全漏洞的预警条目，相关详情会显示在下方。除了展示你发现的问题名称，你还能看到诸如受影响系统的影响评估、工具置信度评估等信息，这些置信度可能是确定、可信或暂定的，同时也会展示受该安全漏洞影响的具体端点。“结果”窗口的右键菜单允许你通过选择“删除所选问题”来移除问题，或者通过设置严重度等级、修改置信度值来分配不同的严重级别。


    当所有资源分析完成、扫描结束后，你可以导出结果。Burp Scanner支持生成基础的HTML或XML报告，可用于记录发现的漏洞。此外，Metasploit等其他安全工具也支持导入这些结果以执行后续任务。在“结果”选项卡中选择所有要导出的条目。若要导出所有发现项，选择根节点。右键点击打开右键菜单，点击“报告所选问题”选项。名为“Burp扫描器报告”向导的新窗口会引导你完成报告格式设置。你可以选择HTML格式后点击“下一步”。在该界面中，你可以自定义报告中要包含的详细程度。例如，你可以选中所有复选框以选择最高详细程度，然后点击“下一步”按钮。由于在最终报告中提供受影响的HTTP请求和响应的快照通常很有用，你也可以选择包含相关摘录，选中对应复选框后点击“下一步”。在此步骤中，Burp
    Scanner报告向导允许你选择或取消选择要导出的问题类别，做出选择后勾选对应的复选框即可，你也可以全选后点击“下一步”。最后一步需要你指定报告的文件名，点击“选择文件”按钮，在文件系统中找到要保存报告的文件夹，输入包含扩展名的文件名后点击“保存”按钮。接下来为你的报告设置标题。此外，你还可以通过选择问题组织方式或目录层级来调整内容的顺序，自定义报告的布局。最后点击“下一步”按钮。向导结束时，进度条会反馈报告生成进度，完成后你可以点击“关闭”按钮。


    ## 第14章 随机化会话令牌

    会话令牌通常用于跟踪会话，因为默认情况下HTTP是无状态协议。本章将讲解如何确保会话令牌被正确随机化，防止被猜测。本示例中，你可以测试mutillidae.com网站，这是一个预装在Linux
    metasploitable主机中的存在漏洞的Web应用。你可以从SourceForge.net下载metasploitable虚拟机。你首先需要生成一些会话令牌。你知道会话令牌是在什么时候由服务器生成并发送给你的吗？当你的浏览器在请求中没有发送有效的会话Cookie时，服务器就会发送会话令牌。为了首次欺骗Web服务器，你需要在清除浏览器历史记录后发送请求，并确保选中了Cookie选项。接下来，使用Burp
    Suite拦截请求。刷新页面后回到Burp Suite的Proxy选项卡，你应该能在请求中看到不存在会话令牌。接下来，如果你点击“转发”按钮将请求发送到服务器，你会收到带有Cookie和新会话ID的响应。点击“转发”按钮发送剩余的请求，当你看到白屏时，说明操作完成。点击History选项卡，从列表中选择一个条目。你应该能在底部区域看到你的第一个请求头，点击Response选项卡，在该区域内右键点击，将其发送到Sequencer。选择“发送到Sequencer”选项后，切换到Sequencer选项卡，确定哪些会话令牌是你需要的。选中目标令牌后，你可以点击“开始实时捕获”来生成会话令牌。会弹出新窗口，开始处理和生成令牌。实时捕获完成后，你可以开始分析会话令牌，Burp
    Suite会为你提供会话令牌随机性的摘要。

