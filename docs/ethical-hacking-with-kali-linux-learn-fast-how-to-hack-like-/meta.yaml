    are alive on the network, and how often are they alive on the network. Besides,
    are they only up during certain times? You will also have to discover the ports
    that are currently open on these nodes, and the services that are running? Each
    one of these things will help you determine if there is any vulnerability that
    you can go after on your target device. Another way of scanning the network is
    to discover if there are any banners that you might be able to grab. By going
    through this process, you will learn which ports you want to close, and if there
