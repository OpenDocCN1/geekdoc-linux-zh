    用于处理更新的包管理工具。如果你打开Linux系统中的「软件和更新」对话框，就可以选择想要的更新应用方式。除了操作系统本身，还有数以千计的免费软件包可供使用，这些软件包能帮你完成任何可行的计算任务，且速度和安全性都远超其他平台。无论是寻找办公生产力套件，还是网页服务器、安全服务，这些都会被可靠的包管理器无缝集成到Linux系统的运行体系中。

    举个例子，如果你要在Windows或Mac上使用Adobe这类剪辑软件，想要让它们高效运行且不出现系统卡顿，就得配备高速CPU、32GB内存以及独立显存。这类整机可能要花费数千美元，还需要配备冷却系统防止硬件过热熔毁。不过如果使用Linux，你只需要一台价格不到300美元组装而成的普通PC，就能同时运行虚拟化进程和日常常规任务。

    由于Linux是开源的，许多人根据特定需求开发了自己的操作系统版本，这类版本被称为发行版（distribution），也常简称为“distros”。其中最著名的就是谷歌面向智能手机开发的Android操作系统，此外还有数百种其他发行版，比如面向企业部署的红帽企业版（Red
    Hat Enterprise），以及由其社区免费重建的CentOS。还有专门针对科学和高等数学应用优化的Scientific Linux发行版、用于网络安全测试与管理的Kali
    Linux（我们稍后会详细介绍），以及其他专为物联网（IoT，Internet of Things）设备嵌入式开发的发行版，比如适配超低价树莓派（Raspberry
    Pi）开发板的Raspbian。

    发行版通常会归类为不同的家族。比如某个特定的发行版可能因稳定性强、设计优秀、补丁更新快、第三方软件生态繁荣而获得良好口碑。其他社区无需重复造轮子，可以基于该父级发行版分叉出带有自身定制修改的衍生版本，以新名称分发，但原有的父子层级关系依然保留。更新和补丁会从上游父级发行版推送到所有下游子级发行版中。这是维护自治系统的高效方式。

    最知名的发行版家族包括Debian，其维护的下游生态中就有全能型发行版Ubuntu。薄荷Linux（Linux Mint）、Kali Linux，以及红帽负责维护CentOS和面向普通用户的Fedora发行版；SUSE则提供OpenSUSE；还有以复杂难上手但运行效率极高著称的Arch
    Linux，其下游衍生发行版包括用于家庭娱乐管理的LinHES，以及注重图形界面的Manjaro。

    你还能找到适用于各类专用部署场景的Linux发行版镜像。极致轻量的发行版可以嵌入到冰箱、灯泡这类物联网设备中。Docker容器速度快、效率高，因为它们会和承载它们的Linux主机环境共享操作系统内核，而且可以基于各类Linux镜像构建。

    以AWS（亚马逊云科技，Amazon Web Services）和Azure为代表的虚拟化按需服务计算平台所构成的云服务非常出色，它几乎涵盖了我们已知的所有计算服务。Linux功能多元且免费，因此是云部署的理想操作系统。运行绝大多数云实例所用的另一种Linux版本，就托管在微软的Azure云平台上。全行业向云端转型的重要意义，催生了一批专门定制的Linux发行版，这类发行版以尽可能小巧、快速为目标，旨在提供最优的云使用体验。这类专用发行版通常会内置开箱即用的功能，让你能够充分利用特定云主机环境的特性。比如AWS的Amazon
    Linux AMI就属于这类发行版。AMI是Amazon Machine Image（亚马逊机器镜像）的缩写，专为长期支持打造的Ubuntu版本也采用这类镜像格式。

    长期支持（LTS，Long Term Support）版本的构建目标是极致稳定，所有软件和配置都经过了充分测试。这类配置的高度可靠性，使得发行版维护方能够为对应版本持续提供长达5年的安全更新和功能更新。你可以将LTS版本部署为服务器，完全无需担心在5年周期内需要重建系统。如果你想要尝试最新最强大的软件版本，可以安装最新的过渡版；但在需要稳定性的生产环境中，必须选用LTS版本。

    总的来说，开源软件的发布可以使用多种许可模式。GNU通用公共许可证（GPL，GNU General Public License）允许用户任意使用、修改或再分发软件，只要不更改原许可条款即可。知识共享（Creative
    Commons）许可允许设置更严格的许可条件，为软件创作者提供更多选择。其他主流的许可模式还包括Apache、BSD和MIT许可。

    Linux是一个灵活的平台，可以定制后为所有物理或虚拟计算设备提供动力。你已经了解了Linux发行版的相关知识：它们会将Linux内核、图形用户界面（GUI）、专用软件及配置打包在一起。我们之前讨论过的发行版家族包括红帽企业版Linux（Red
    Hat Enterprise Linux）、Debian和Arch。

    最后，你现在已经对发行版如何为Linux机器上的软件打补丁、做维护，以及它们发布新版本（包括LTS长期支持版本）的方式有了基础了解。在安装任何Linux发行版之前，我想说明的是，Linux安装并不是一件简单的事。你可以安装Linux的平台、发行版及版本多如牛毛，每个都有独立的安装程序、海量配置选项和独特的安装流程，想要逻辑清晰地呈现这一主题的冰山一角都是巨大的挑战。你可以在个人电脑和传统服务器上安装Linux。除了Android操作系统本身基于Linux内核构建之外，没有什么能阻止你在设备上安装主流发行版，但要注意这类实验可能会对设备造成损害。那如果是批量生产的冰箱、儿童玩具这类小型设备，或是设计上仅需存活几秒、完成特定时效性任务就会永久关闭的虚拟服务器，要怎么办呢？这类场景下常规安装流程无法正常运行，因此你通常需要跳出固有思路来寻找解决方案。

    许多物联网设备会使用树莓派这类小巧且低价的开发板来完成计算操作。就拿树莓派来说，你可以在自己的电脑上构建操作系统镜像，将其刷入SD卡，再把SD卡插入设备就能完成开机启动。虚拟服务器可以通过脚本配置，脚本中可以定义你需要的精确操作系统和配置细节。有时，脚本会响应外部触发信号，自动激活目标环境中的资源，并按需部署以满足变化的需求。Linux和开源生态与生俱来的多样性和灵活性，让你能够组合出适配所用硬件资源、匹配计算工作负载的软件层组合。

    在传统Linux安装过程中，你需要做一些选择：包括操作系统运行的环境设置、计算机的网络连接方式、用于日常管理的用户账户类型，以及系统软件和数据使用的存储设备。我们接下来逐一介绍这些选项。

    Linux发行版支持你用任意语言与图形用户界面（GUI）交互，但你需要指定想要使用的语言以及对应的键盘布局。你选择的语言会决定整个桌面环境中对话框、配置菜单显示的内容。你还需要设置所在地区，这样Linux才能知道你的时区。很多网络和文件处理操作都和时区设置挂钩，所以一定要设置正确。这些设置后续可以通过图形界面（GUI）或命令行界面（CLI）修改。如果情况允许，最好在安装开始前就连接互联网。这样你的发行版就能下载安装存档中未包含的最新更新，能少一个

