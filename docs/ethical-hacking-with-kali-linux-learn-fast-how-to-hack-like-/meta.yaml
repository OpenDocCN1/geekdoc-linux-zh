    # Chapter 5 Pen Testing @ Stage 1


    Pen testing stage one is also known as Pre-engagement, and this stage focuses
    on gathering as much information as possible about your target. This can be done
    using techniques such as scanning or footprinting.


    You must set your boundaries, and that is what you first want to come up with,
    but just like the military, there are rules of engagements. For example, military
    personnel are not allowed to fire, unless fired upon.


    Because they see somebody with a weapon, it doesn''t mean that they''re can go
    ahead and shoot. It all depends on the war that they''re in. Each one would have
    its own rules of engagement, and that''s the same thing here.


    You are creating formal permission to conduct the penetration test, and in the
    rules of engagement, you may specify whether or not you do technical or non-technical
    activities.


    The rules of engagement explicitly define these activities. A security professional
    that''s doing a pen test might be allowed to do certain activities that generally
    considered illegal.


    Some rules of engagement items want to include the IP address range that you''re
    allowed to test. You do not go outside of that range or times that the test conducted
    during business hours, or after business hours.


    You may be thinking; "pen test could take place anytime?" Well, yes, but it all
    depends if you were doing a simulation of a gray box attack from the inside for
    example, because that might be done strictly during business hours.


    You also want to have a list of hosts that the client or department may be considering
    to be restricted. If you see an IP address that''s not on your list, you don''t
    touch it!


    You''ll also list the acceptable testing methods, such as social engineering,
    denial of service attack, what tools will be used, password crackers, network
    sniffers, and so on.


    If you are going to use the tool called "Nmap" for example, will it be an aggressive
    Nmap scan or a private Nmap scan? You should also specify the length of the test.


    Depending on the test itself or what you''ve agreed to; some pen tests can take'
