    在终端中，我们需要输入：```use evil_twin``` 并按回车键。接着输入：```select * from wpa_keys;``` 再次按下回车键，你就能看到客户端密码已存储在你的MySQL数据库中。密码会显示在"password"字段下，确认密码则存储在MySQL数据库的"confirm"字段中。如果客户端输入的两次密码不匹配，系统会跳转到错误页面，提示他们重新输入密码，因为两次输入内容不一致。如果客户端点击取消按钮，则会跳转到一个页面，告知他们此次安全更新的重要性，说明这是为了他们自身着想，并且在他们完成更新之前将无法访问互联网。这就是你创建邪恶双胞胎接入点、搭建用于捕获WPA密码的网页的方法。请在使用这些工具前获取书面授权，否则可能会对连接到该网络的所有网络设备造成严重损害。如果你只是在自己的家庭实验环境、非生产环境中进行练习，这不会对任何人造成影响；不过我仍然建议你关闭路由器，谨慎练习，不要连接互联网。


    ## **第29章 使用mdk3实施DoS攻击**

    另一种企业安全威胁当然是DoS（拒绝服务）攻击。顾名思义，拒绝服务攻击一旦成功，就会阻止其他人使用相关资源或服务，干扰其他用户的正常使用。曾有过这样的新闻报道：一名男子厌烦了人们开车时使用手机，于是他在车上搭载了蜂窝信号干扰器，驾车出行时干扰蜂窝网络的所有频段。这样一来，他周围的人就无法使用手机了。你可能会觉得这是个好主意，但你要记住，执法部门、救护车也会使用蜂窝通信服务。因此，你干扰蜂窝网络频段、影响其他用户正常使用的同时，也干扰了你不希望被影响的公共服务。这名男子最终被追踪到，被捕后还被处以高额罚款。

    不过，该如何实施拒绝服务攻击呢？在无线网络中有两种主要方式。第一种是用大量无用流量轰炸你的Wi-Fi接入点。如果产生大量流量，接入点会忙于处理这些流量、决定如何处理：是处理所有的认证请求吗？如果你发送探测请求，接入点在处理这些流量时，就无法处理其他用户流量。因此，第一种方式的本质是占用接入点，使其无法处理合法流量。第二种方式则是在接入点运行的频段内制造噪声和干扰。我可以广播信号，干扰同时经过空中的其他所有信号。

    在本章中，我将教你如何实施DoS攻击。拒绝服务（DoS）攻击指的就是将网络中所有用户踢下线，使其无法获得服务。首先，我们需要攻击无线网卡。完成后，打开终端并输入：```ifconfig```
    按回车键，之后你需要打开一个文本文件记录一些信息。首先记录你的无线网卡接口名称，我的网卡接口是wlan0，你可以记录下你的接口名称。完成后，你可以通过输入```clear```
    并按回车键清空终端。

    接下来，我们需要扫描可用的接入点来寻找目标，因此输入；```iwlist wlan0 scan``` 然后按回车键。这会列出所有可用的接入点，你可以从中寻找目标。找到目标后，你需要记录下其SSID、BSSID以及信道号。完成后，我们需要创建一个黑名单文件，因此输入；```echo
    (目标接入点的BSSID) > blacklist``` 然后按回车键。这会创建一个名为"blacklist"的文件，其中包含目标接入点的BSSID。

    现在我们需要将无线网卡接口设置为监听模式，输入以下命令；```airmon-ng start wlan0``` 然后按回车键。该命令会创建一个名为"mon0"的监听接口，记下这个监听接口的名称。要确认你的监听接口名称，你可以输入；```airmon-ng```
    然后按回车键。这会显示你所有的接口，你可以在其中看到新创建的名为"mon0"的监听接口。

    现在我们已经可以实施DoS攻击了，输入；```mdk3``` 然后按回车键。接下来输入；```mdk3 mon0 d --blacklist --c 6```
    这里，你需要输入监听接口名称（这里是mon0）、黑名单文件的名称（我的文件中命名为"blacklist"），以及目标接入点的信道号（我这里的是"6"）。输入完成后按回车键。接下来你会看到它开始发送数据包，进而淹没整个网络。同时，如果你查看连接到同一网络的其他设备，你会发现它们都已断开连接。

    现在我们需要打开另一个终端，输入；```mdk3 mon0 a -m -i (目标接入点的BSSID)``` 然后按回车键。查看附近的其他计算机，你会发现它们已经被踢出网络。查看你的Wi-Fi，你会发现连接已经断开。你可以尝试连接到目标BSSID，但会收到连接超时提示。就是这样。如你所见，DoS攻击相对简单。你会发现自己已经被断开连接，现在无法再次接入网络，这就是你使用mdk3实施DoS攻击的方法。


    ## **第30章 使用TCP Hydra实施暴力破解攻击**

    在本章中，你将学习如何分析针对目标系统的暴力破解攻击。在这个场景中，假设你有3个节点：攻击者将使用IP地址为10.0.0.111的Kali Linux系统，受害者机器将使用IP地址为10.0.0.202的Windows
    10设备，渗透测试人员将使用Kali Linux拦截所有流量，分析网络上的任何攻击。假设你是攻击者，想要攻击网络中开启了Telnet服务的一台主机。黑客首先要做的是尝试对目标受害者实施暴力破解。

    要进行暴力破解攻击，你可以使用多种工具，其中渗透测试人员中非常流行、且我们之前没有介绍过的一款工具叫做"hydra（九头蛇）"。要使用hydra，你首先需要打开Kali
    Linux终端窗口，输入以下命令：```hydra -V -l (字典密码文件路径) -t 50 - (受害者IP地址) ssh``` 然后按回车键。其中，“-V”选项用于开启最大详细程度输出，“-l”用于指定登录用户名，后面跟着字典密码文件的路径，“-t”参数用于指定并行连接数，数值越大，测试速度越快，之后是受害者IP地址，最后是你想要暴力破解的协议。按下回车键后，攻击就会开始，你只需要等待密码被破解即可。密码通常在几分钟内就会被破解。

    从黑客的角度来看，下一步该做什么呢？黑客会尝试使用Telnet登录。首先，黑客会发出Telnet命令，指定受害者主机的IP地址，然后输入登录名和破解出的密码。此时，黑客会为这次胜利感到兴奋。如果你进入渗透测试人员的机器分析这次黑客攻击，你会看到当攻击者尝试使用未授权的用户名和密码组合时会发生什么。

    '
