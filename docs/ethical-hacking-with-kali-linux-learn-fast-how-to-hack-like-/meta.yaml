    ## Chapter 3 Installing Virtual Box & Kali Linux


    Virtual Box is a software that specializes in virtualizing various operating systems
    that you can install on Windows, Macintosh or any Linux as well as Solaris. It''s
    free to download. Once you have reached the site you can choose to download different
    platform packages. After you have downloaded VirtualBox, you will be able to build
    and run multiple VMs (Virtual machines). The user manuals on how to install VirtualBox
    are all listed on their website in the previous chapter. Using the software is
    simple, and it is recommended running Kali Linux on it. You can use other similar
    virtual environments such as VMware, but I have personally used VirtualBox for
    many years, therefore that is what I will refer to throughout this book.


    Kali Linux is a Linux Distribution of operating system that you are able to use
    both as your main operating system or run it virtually. You can run it from a
    DVD, or even from USB. Once you have downloaded the ISO file, you might install
    it on top of your existing operating system. Kali Linux is the best Penetration
    Testing Tool Kit / software that has hundreds of tools built into it, ready to
    use for penetration testing against any network out there. Kali Linux is used
    to test an existing network and try to find possible vulnerabilities, so the general
    network security can be improved. Kali Linux is also user-friendly, and the categories
    of tools built into it are for Information gathering, Forensics, Reverse engineering,
    Stress testing, Vulnerability assessment, Reporting tools, Exploitation tools,
    Privilege escalation, Maintaining access and much more.


    Once you have downloaded Kali Linux and are ready to install it in a virtual environment,
    there are a few details that you should be aware of. When you create a new Virtual
    machine for Kali, you must allocate at least 4 Gb of space, and another 20 Gb
    for the Virtual hard drive. After you have a new Virtual machine built completely,
    you have to go to settings and ensure that you adjust the Network settings by
    choosing bridging the VM to your router. Once you finished with the settings,
    you should be able to boot the image. The command you need to type is ``` startx
    ``` then hit enter. This will start installing the GUI (Graphical User Interface)
    from the hard drive, which is also recommended. Until the GUI gets installed,
    there are a few questions that you need to answer, such as language, keyboard,
    location and clock settings for the time zone. Once the installation is complete,
    you must restart the image to boot from the hard drive. After the reboot is complete,
    Kali will ask for login details on the CLI (Command Line Interface). For the username,
    type ``` root ``` and for the password, type ``` toor ``` and hit enter. If you
    are new to CLI and don''t know any commands and what to type, no worries. You
    can always switch to the GUI by typing the command ``` startx ``` and hit enter.
    This will open the user-friendly GUI that will allow you to have access to all
    Pen Test tools that we will further discuss later on. Other basic settings that
    you need to do is IP addressing. Kali Linux by default looks for an IP address
    from your DHCP server, but it''s recommended to assign a static IP address, so
    you don''t get lost which IP represents what machine. The CLI command you need
    to assign an IP address on Kali is:

    ``` ifconfig eth0 10.10.10.2/24 up ```

    Next, you have to configure the default gateway, which is your router''s IP address.
    To do that, type the command:

    ``` route add default gw 10.10.10.1 ```

    Once these settings are complete, ping your router''s IP address by typing the
    command:

    ``` ping 10.10.10.1 ```


    Once you have reachability to your default gateway and are able to access the
    internet with that router, you should test internet connectivity by typing the
    command:

    ``` ping www.google.com ```

    If this is successful, it means that your virtually installed Kali Linux is connected
    to the Internet. The reason you need internet access is because you want to update
    your Kali Linux. Updating your Kali Linux is your top priority. The first task
    you should perform after a clean install is updating your operating system. Advanced
    Packaging Tools, aka APT extends the functionalities of Debian packages by searching
    repositories and installing or upgrading packages along with all the required
    dependencies. Open your console and type **apt-get update**, which is used to
    resynchronize the local package index files with their source as defined in the
    sources.list file. The update command should always be used first, before performing
    an upgrade or a distribution upgrade. Next, you need to upgrade Kali by issuing
    the **-y** option, which proceeds with the installation without the hassle of
    writing yes every time. So what apt-get upgrade stands for? Well, it is used to
    install the newest versions of all packages installed on the system. So the existing
    packages on Kali with new versions available are upgraded. Important to note,
    that the upgrade command will not change or delete packages that are not being
    upgraded, and it will not install packages that are not already present. Lastly,
    you need to execute the **distribution upgrade** command. This command upgrades
    all packages currently installed on the system and their dependencies. It also
    removes obsolete packages from the system. The next thing you need to do is to
    reboot your machine. After rebooting your machine, now you have a fresh, clean
    version of Kali. To list the Debian packages installed on your machine you would
    run the following command:

    **sudo apt list --installed**

    If there are a bunch of them and want to know if a specific tool is already installed,
    you can filter the results by adding the "grep filter" argument. To show a full
    description of a package and identify its dependencies, run the following command:

    "dpkg --status <package_name>"

    And finally, to remove a package from Kali, you should execute the following command:

    "sudo apt-get remove <package_name>  # un-installs the package"

    Of course, you need to replace the package name by the application name.

    Finally, I want to explain to you how your system uses official Kali repositories.
    All the magic happens in the "sources.list" file. You can take a look at that
    file by opening it using leafpad. Whenever you execute your update command, Kali
    looks in the contents of this file to perform the update process.'
