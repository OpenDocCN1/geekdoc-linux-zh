  md: '# Chapter 11 Device discovery with Hping3


    To discover networking devices, whatever they are local or remote, and they are
    not responding directly to ICMP ping request, we can still verify that they exist
    by using TCP and UDP options. Hping3 has all those options and much more.


    If you have no response from a device that you are certain is out there, it might
    be that the firewall has been configured not to allow ping requests in order to
    elliminate Denial of Service Attacks, and that’s understandable but you still
    want to verify that device.


    Large organizations disable ping replies by filtering them on their firewalls.
    Yet, if we still want to validate that the device we are trying to ping is up,
    we can use many other tools that we already discussed, such as nmap and ZenMAP.


    Hping3 replaced the previous version known as ping2 and now it has additional
    functions besides ICMP ping, such as:


    +   - Ping request with TCP,

    - Ping request with UDP,

    - Fingerprinting,

    - Sniffer and spoofer tool,

    - Advance port scanning,

    - Firewall testing,

    - Remote uptime measuring,

    - TCP/IP aka OSI model stack auditing,

    - Advance Flooding tool,

    - Covert Channel Creations,

    - File transfer purposes and more.


    Hping3 is an excellent device discovery tool and it’s built into Kali Linux by
    default. Hping3 is operating on a command line interface, and it has many functionality.
    To list those functionalities, type:


    ```

    hping3 – h

    ```


    and press enter. Here, h stands for help, therefore you will be provided with
    the output of possibilities using hping3.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '![](img/e7d379bcf5614b6f1b2f213c4578b596_71_0.png)


    Using Hping3 you can specify pinging not only one address, but hundreds of addresses
    at the same time, and you can manipulate your own source IP address to look like
    any other IP address that you want it to look like.


    In addition, you can manipulate your source interface where the ping originated
    from. Hence, it''s nearly impossible to trace it back to it''s real source.


    I will not get into every possibilities that you can do with Hping3, but I will
    mention that it''s very easy to create a Denial of Service attack.


    To establish a connection between two networking devices, there should be a TCP
    3-way handshake and it''s first step must be a SYN request. SYN stands for Synchronization.


    What we can initiate is a continious SYN request to a device that would be flooded
    of requests and eventually the CPU of the victim''s PC or any other'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'networking device would not be able to handle it anymore, and it would eventually
    shutdown. An example of the command would look like this:


    ```

    "hping3 –S 10.10.10.20 –a 192.168.1.20 22 –flood"

    ```


    +   - **-S >** This represents the SYN request.

    - **10.10.10.20 >** This IP represents the victim''s IP address.

    - **-a >** This represents that the following address I will specify will be the
    source.

    - **192.168.1.20 >** This is the fake source address instead of providing my own
    address, therefore this address also will be a victim, or we can call it the second
    victim, because the first victim will try to reply to the SYN requests to this
    IP address.

    - **22 >** This represents the "ssh" port number, but you can specify any port
    that has been identified as an open port with tools such as nmap.

    - **--flood >** This means that I am telling Kali Linux to send out the SYN requests
    as fast as possible.


    Using this command set is not a joke. You can seriously damage any device''s CPU
    if you run such command even for a few seconds. If you choose to let it run for
    minutes, I promise you that many devices would propably give up and shutdown.


    This is also why I warn you to make sure that you have a written authorization
    before you use this command in production environment. Besides that, even if you
    want to practice within your home lab environment, do not let it run for more
    then a few seconds as it may cause some very serious damage to your own networking
    devices.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Chapter 12 Burp Suite Proxy setup


    Burp proxy is a crucial component of the entire Burp Suite application. Burp proxy
    it’s another tool that you can use which allows you to intercept the web traffic
    between the browser and the target application, which is the web server itself.


    To start Burp Suite, go to the application menu, then select the Kali Linux item,
    followed by the Top 10 security tools, and then select the Burp Suite from the
    list.


    Burp Suite is the free version within Kali by default, but you can use the professional
    version too, and you will have access to all the functionalities in this application.


    The free version is a good starting point if you want to learn how this application
    works. Once you have Burp up and running, you want to make sure that your proxy
    is enabled and listening on port 8080.


    Go to the Proxy tab, select the Options tab, then you should see that the proxy
    listener is running and listening on port 8080.


    Next, you have to configure your browser so that it can use the port that you
    had Burp Suite listening on. You can use an “add on” tool called “foxy proxy”
    for Firefox.


    It is an easy way to have multiple proxies and to be able to change between them
    quickly. After installing “foxy proxy”, right next to the browser''s URL bar,
    there is a fox with a circle and line across it. Click on the fox, and then click
    add a “new proxy”.


    In the “proxy details” tab, you will need to set the manual proxy configuration
    to the local host and the proxy port to 8080. Next, click on the General tab,
    give that proxy a name and finally click on the Save button.


    What you have essentially done is told your browser to send all the traffic to
    your local host to port 8080. This is the port you have configured the Burp Suite
    application to listen on.


    Burp knows that it will take traffic and proxy-ing it out to the internet. Once
    you have saved this profile, right-click on the fox and select your proxy configuration.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'For this scenario, you can name it "Burp proxy", and if you have to start using
    it, all you have to do is to click on it. Once your browser is using the proxy,
    you can browse to the web application. If you go back to Burp, you are going to
    see the proxy and the intercept tab light is up, and turned into the orange colour.


    If you see this happen, you know that you have configured everything perfectly.
    You should see that Burp successfully captured the get request for the website.
    By default, the initial state is to intercept all the traffic.


    Intercept means to stop any request from the browser to the web application and
    will give you the ability to read or modify that request. If you try to browse
    to any sites with the default settings, you won''t be able to see any responses
    until you turn off the intercept button.


    By clicking the intercept button to be off, you will still be capturing all the
    web traffic but you won''t be directly tampering with every request. Either the
    intercept is on or off. Additionally, you can see all the requests and the responses
    within the History tab.'
  merge: -1
