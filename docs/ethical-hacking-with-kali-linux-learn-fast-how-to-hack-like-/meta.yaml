    ## Chapter 15 Burp Spider-ing & SQL Injection


    When you are pen testing a web application, the first thing you can do is spider
    the host using Burp Suite. It means that Burp will crawl through the whole website
    and record all the different files and HTTP methods on that site.


    Why do you spider the host? Well, this is because you need to identify where all
    the links are, what types of parameters are used in the application, what external
    sites the application references to, and the overall layout of how the application
    functions.


    To spider your application, you need to make sure that the target tab is selected,
    and then the sitemap tab is selected too. Next, right click on the domain that
    you added to your scope previously, and then click on the item called "spider
    this branch". Once the spidering process is complete, Burp should have a good
    layout of exactly what the application looks like. You can also click on any file
    in the list Burp provides to see what the request and response was.


    Likewise, in the left column, under the "mutillidae" folder, you can see the structure
    of the website. On the top right, below the sitemap tab, is the filter button
    that you can try playing around with to see what you are filtering out and what
    works for you. Generally, it''s preferred to first add all your domains to the
    scope and then click the filter to only show those that are in the scope.


    Sometimes pages or folders are not directly linked from a web application. For
    example, it is often seen that admin folders or login pages are not referenced
    anywhere on the website. This is because website administrators are trying to
    hide these folders and administrative login pages from general users. These are
    the types of things you are looking for in your pen test so that you can try to
    bypass or brute force the authorization process.


    There is a specific module within Burp that is extremely helpful in these scenarios
    called "discover content". If you open the browser and enter the IP address of
    the metasploitable virtual machine, Burp Suite should be intercepting your requests,
    therefore you should stop it. Next, click on the "mutillidae" hyperlink. Mutillidae
    is a vulnerable web hacking application composed of PHP scripts that are vulnerable
    to the top 10 vulnerabilities of OWASP. You can start a fresh attack on the site
    just by visiting the webpage of mutillidae.com. Burp Suite should already recognize
    its existence.


    Next, go back to Burp Suite and click on the "Target" tab, pick your domain, right
    click on it, and add it to the scope. After this, you need to spider the application,
    but before doing so, there is something you should be aware of. Because the mutillidae.com
    website has a lot of forms, when you spider the application, Burp Suite will pop
    up a dialog asking you to enter credentials manually to change this default behavior,
    so you should click on the "Spider" tab and then select the "Options" tab. You
