- md: '## Chapter 13 Target setup for Burp Scanner


    A good environment for web penetration testing is the mutillidae.com website,
    which is already installed on a "metasploitable" machine. The "metasploitable"
    is a Linux operating system and is preconfigured for penetration testing purposes.
    To download a copy of the metasploitable host, you need to browse to the project
    website at SourceForge.net and download a copy of the virtual machine by clicking
    on the metasploitable Linux zip item.


    To see the mutillidae.com website in your browser, enter the IP address of your
    metasploitable machine, which, in your case, will be a private address. Followed
    by the web application name, which is mutillidae. Next, you need to enable the
    Burp proxy by selecting it from the Foxy Proxy menu, which you installed in the
    previous chapter. Switch back to Burp Suite, click the Proxy tab, then the Intercept
    tab, and then click on the Intercept button to turn it off. You don''t need to
    intercept any requests for the time being.


    Next, click on the Target tab and make sure that the Sitemap tab is selected.
    You should see the mutillidae URL that you just trapped and forwarded. The next
    step you need to do is to add it to the scope. Right-click on the mutillidae folder
    and select the "Add to scope" item. The scope defines where automated spidering
    and testing could occur, and helps you to not actively scan domains that are out
    of your scope.


    Vulnerability scanners are automated tools that crawl an application to identify
    the signatures of known vulnerabilities. Vulnerability scanners are noisy and
    are usually detected by the victim. But scans frequently get ignored as part of
    regular background probing across the internet. Burp Scanner is a dynamic web
    application scanner included in the professional edition of the Burp Suite software.
    The tool allows you to automatically scan websites and detect common security
    flaws, including SQL injection, cross-site scripting, XML injection, missing cookie
    flags, and much more.


    In this chapter, I will explain to you how to use Burp Suite to accomplish a full
    complete scan. Once again, you will use the mutillidae.com website to accomplish
    your goal. Please check the previous chapter in order to understand the basics
    of how to use Burp Suite before moving on. Once you are ready, click on the Foxy
    Proxy icon to enable the Burp Suite proxy, and select your proxy from the list.
    Refresh the page and switch back to Burp Suite. Select the Proxy tab then the
    Intercept tab and switch off the interception.


    By default, Burp Scanner is configured to perform passive scanning on all domains,
    while active scanning is disabled. In the Burp Scanner tab, select "Live scanning"
    and make sure that the "use suite scope" option is selected in the live active
    scanning section. Next, select the Target tab then the Sitemap tab, and expand
    your target. Next, it''s time to start spidering the application, so switch to
    the Spider tab to see the progress of the spidering. Once the numbers stop going
    up, it means that it has finished the execution process.


    Once the spidering process is complete, go back to the Sitemap tab, right-click
    on your target and select the "actively scan this branch" item. Burp Suite will
    display a new window named "active scanning wizard". This is an easy configuration
    tool for Burp Scanner. The first step in this configuration is a process that
    allows you to remove specific types of resources, including images, JavaScript,
    or style sheets. In most cases, the default setup is suitable so all you have
    to do is to click on the next button.


    In the next screen, the tool will display a table, containing the entire list
    of endpoints and parameters that Burp Scanner is going to include during the scanning.
    It is important to carefully review the list and remove endpoints that are either
    not relevant, or may cause malfunctions. Once you have finalized your selection,
    click on OK to start scanning. Then, you can monitor the progress by checking
    the Scan queue tab in Burp Scanner. This table provides information on the scan
    requests completed and the ones currently in progress. Similarly, it provides
    an overview of the results by displaying the number of issues discovered for each
    endpoint.


    From this table you can also remove items by selecting those resources, then right-click
    and select the delete item. Additionally, you can pause and restart the entire
    scanner from this menu. Scanning an entire web application may require several
    minutes, sometimes even several hours. Nevertheless, you can analyse the results
    at any time by checking the findings in the Results tab of the Burp Scanner. Like
    in the Sitemap section, this visualization groups vulnerabilities by endpoints
    and categories with a convenient representation.


    If your Burp Scanner does find any cross-site scripting vulnerability, SQL injection,
    or file path traversal, you can click on a specific item in the advisory for the
    selected security vulnerability, and it will be shown below. By showing the name
    of the issue that you have found, you will also get displayed information such
    as an estimate of the impact on the affected system, an estimation of the tool''s
    confidence. These can be certain, firm, or tentative, and it will also display
    the specific endpoint affected by the security vulnerability.


    A contextual menu from the Results window allows removing issues by selecting
    the "delete selected issues" item, or assigning a different level of severity
    by setting the severity level and changing the confidence value. Once all resources
    have been analysed and the scan is complete, you can export the results. A Burp
    Scanner allows you to create basic HTML or XML reports that can be used to keep
    track of the discovered vulnerabilities. Moreover, other security tools such as
    Metasploit will allow you to import those results to perform further tasks.


    In the Results tab, select all the items that you want to export. Then select
    the root node to export all the findings. Right-click to open the Contextual menu
    and click on the "Report selected issues" item. A new window titled "Burp scanner
    reporting" wizard will guide you through the format of the report. You can use
    the HTML selection and click on Next. Within that screen, you can personalize
    the level of details to be included in the report. For instance, you can decide
    to have the maximum level of details by selecting all the checkboxes and then
    click on the next button.


    As it''s sometimes useful to provide snapshots of the affected HTTP requests and
    responses, you can also decide to include relevant extracts in the final report.
    Select the appropriate checkbox and then click on Next. In this step, the Burp
    Scanner report wizard allows you to select or deselect categories of issues to
    export. Make your decision and select the appropriate checkboxes. You can select
    all of them and click on Next.


    Finally, in the last step, you are required to specify the file name of the report.
    Click on the select file button and browse your file system to find a folder where
    you want to save the report, then type the file name including the file extension
    and click on the Save button. Next, give your report a title. Furthermore, you
    can personalize the layout of the document by changing the order of the content
    by selecting the issue organization or table of contents level. Finally, click
    on the Next button.


    At the end of the wizard, a progress bar will provide you with feedback on the
    report generation. Once completed, you can click on the Close button.


    ## Chapter 14 Randomizing Sessions Tokens


    Session tokens are normally used for tracking sessions since by default HTTP is
    a stateless protocol. In this chapter, we are going to look at making sure that
    session tokens are properly randomized and they can''t be guessed. In this example,
    you can be testing the mutillidae.com site, a vulnerable web application, which
    is installed by default on the Linux metasploitable host. You can download the
    metasploitable virtual machine from SourceForge.net.


    The first thing you need to do is to generate some session tokens. Do you know
    when session tokens are generated and sent back to you from the server? Well,
    the server sends a session token when your browser does not send a valid session
    cookie in a request. To fool the web server for the first time, you should make
    your request by clearing the browser history and ensure that the cookies option
    is selected.


    Next, use Burp Suite to intercept the request. Refresh your page and go back to
    Burp Suite under the Proxy tab where you should see in your request that the session
    token is not present. Next, if you click on the forward button to send the request
    to the server, you will get a response with a cookie and a new session ID. Click
    on the forward button to send the remaining requests, and once you see a white
    screen, you know that your job is done.


    Click on the History tab and select one item from the list. You should see your
    first request header in the bottom section, so click on the Response tab and right-click
    within the section, and send it to the Sequencer. Once you click on the "Send
    to Sequencer" option, jump over to the Sequencer tab and identify which session
    tokens are important to you. Once you pick your token, you can click the "Start
    live capture" to start generating session tokens.


    A new window will pop up and it will start processing and generating tokens. After
    finishing the live capture, you can start analysing the session tokens and Burp
    Suite will give you a summary of the randomness of your session tokens.'
