    # Chapter 10 Host discovery with Port Scanning


    When it comes to scanning your target device, you have to figure out which systems
    are alive on the network, and how often are they alive on the network.


    Besides, are they only up during certain times? You will also have to discover
    the ports that are currently open on these nodes, and the services that are running?


    Each one of these things will help you determine if there is any vulnerability
    that you can go after on your target device. Another way of scanning the network
    is to discover if there are any banners that you might be able to grab.


    By going through this process, you will learn which ports you want to close, and
    if there are any banners, you can hide them or customize them. You will also need
    to see which services aren''t desired, and if they''re not desired, you should
    turn them off.


    This could also give you an understanding of how you can standardize their firewall
    and intrusion detection system rules, and you will also see the vector of misconfiguration
    and what you want to do to fix those misconfigurations.


    Once you begin the scanning process, you have to run a host discovery, which will
    detect hosts that are live on the targeted network. There are numerous tools that
    you could use, and some of them are GUI based, while others are command-line based.


    For example the tool called "Nmap" looks at DOS-based or command prompt-only environment.
    Nmap also has a GUI version which is called Zen Map. There are other tools out
    there too, but these are the most popular ones.


    These tools aren''t meant to be deceiving; but you can use them that way as well.
    Once you gathered a list of nodes that are active on the network, your next goal
    is to do a port scan.


    By running a port scan, you will learn what ports are open. Through those ports,
    an attacker can install malware on a system or take advantage of specific vulnerabilities.


    Therefore, you should always check which ports are open, and include in your report
    if they''re not required to be open. Some tools that you can use are'
- md: '## 渗透测试前期工具与流程概述

    ### 核心工具选择建议

    "nmap" which I already talked about, but you have to understand that some of these
    tools are multipurpose tools. Another tool that you can use is called "NetScanTools
    Pro". You might have other tools that you prefer, but you should pick one and
    master using it. Meanwhile it is good to have exposure to other tools too, and
    it''s not only for your experience or to put on your CV, but for other reasons
    as well. For example, once you start using these tools, you will realize that
    each of these software has certain limitations, and while one of them does one
    job, the other might help you do another job better. I recommend that you focus
    on "Nmap" for your immediate future, as well as in real-world use. Nmap is a very
    handy and flexible tool, and when it comes to this industry, most ethical hackers
    or penetration testing professionals love it.


    ### 服务标识与操作系统指纹识别

    The next step is a banner grab. Sometimes people refer to it as an operating system
    fingerprint. By doing a banner grab, you can send individual commands to a system
    and it responds in a specific way. We know that Windows devices react a certain
    way, as do Linux devices. Each OS replies differently to the same commands, and
    Macs also follow the same pattern. These responses identify the operating system,
    which allows you to find and exploit vulnerabilities related to that operating
    system. The tools you can use for banner grabbing include tools such as Telnet
    and SSH.


    ### 网络漏洞扫描

    Next, you can begin to scan for vulnerabilities. When scanning the network for
    vulnerabilities, you can utilize specific tools, but you may have your own preferences,
    so let me give you a brief overview. Some of the best tools you can use for network
    vulnerability scanning include:

    - Core Impact Professional

    - Retina

    - Microsoft Baseline Security Analyzer (MBSA)

    - GFI LanGuard

    Your purpose is to determine the security weaknesses or loopholes of your target
    devices. In summary, once you have identified that a target is a Microsoft device
    or an Apache server, your next move is to find out what vulnerabilities you can
    throw at it. These tools will help you see which vulnerabilities would work.

    By this point, you will have a lot of information, and this goes along with documentation,
    but you should also draw out the network. This will help you to understand the
    connection and path between the nodes on the network, and there are numerous tools
    that you can use to draw a network diagram out easily.


    ### 网络拓扑绘制

    For this purpose, one of the best tools you can use is called "SolarWinds" and
    "Network Topology Manager". Some of these tools are free, while some of them are
    paid products. Most companies are using "SolarWinds", which you can use for various
    purposes. With SolarWinds, you can draw network maps, you can send out commands
    to multiple devices in either real time, or if you prefer or are required to,
    you can schedule the date and the time of command deployments. You can use SolarWinds
    for IP management purposes, as well as for alerting on network outages or interface
    downtimes and so on. SolarWinds comes with a cost, but it''s a great software
    and companies are using it for numerous purposes. Your goal is to get a visual
    representation to have a better understanding of what is where and how they are
    connected.


    ### 代理配置

    Once you know the targets because you have fully identified them and their vulnerabilities,
    and you have drawn out the network topology, the next step during your pen-testing
    is to fire up your proxies. The proxy is designed to hide servers so that the
    customer or client cannot determine where the attack is coming from. You could
    fire up proxies both internally and externally. One of the best tools that you
    can use for proxies is called "Proxy Workbench". Proxy Workbench has a GUI interface
    which uses the TOR network. Another product for Mac OS is called "proxifier".
    Once you start running your desired proxy, you are going to get a list of IP addresses,
    and you can select how many you must use. Some of these proxies are free services,
    and if you Google "free proxies" you can create a proxy chain in no time. Whichever
    proxy you will use, you should also document that too.


    ### 渗透测试文档记录

    Documentation is the most important step in pen testing because it helps you to
    preserve all the outcomes of the tests that you have conducted. It''ll also help
    you to find potential vulnerabilities on the network, so you can recommend some
    countermeasures. At the same time, you also want to show your client how you were
    able to accomplish what you did. This is also the best way of legitimizing what
    you did and what an attacker could do to them.


    ### 信息枚举

    Once you have found your targets, the next step is enumeration. Using enumeration,
    the attacker can gather as much information as he can about the target device.
    Some reports that he can pull off from these systems should include identity groups,
    user accounts and service accounts because nobody looks at those things. You can
    also determine network resources, and your network shares or other files that
    are shared from that machine. In many cases, you can also enumerate the applications
    that are installed on those devices. The enumeration step builds on the data that
    you collect from the reconnaissance stage, but you should also look at enumerating
    networking devices too. Networking devices include:

    - Routers

    - Switches

    - Intrusion detection systems

    - Intrusion prevention systems

    - Firewalls

    - Identity services engines

    - Wireless LAN controllers

    and so on. You as a pen-tester should do numerous different types of enumeration
    methods to ensure that you get all the information that you can from each machine
    visible on the targeted network. The reason you should do this is to determine
    the weaknesses and vulnerabilities of the organization''s network. The primary
    purpose is to try to identify the gaps of the network infrastructure.


    #### whois查询与公网IP段定位

    You can start the enumeration steps by finding the network range of the company
    or the targets, and you can do that with a command “whois” to lookup devices,
    so you can see what ranges they''ve been assigned on the public side. This is
    where you find the most important servers because it''s usually the face of the
    company, and that is providing a service, where people are logging in or getting
    information about the company.


    #### 子网掩码计算

    Once you have that IP range, you want to calculate the subnet mask, which can
    help you narrow down your ping sweeps. This would also help you with port scanning.


    #### 公网主机发现

    Once you have calculated the subnet mask, the next step is to discover the hosts
    that are publicly available from the internet. Once again, the first recommendation
    is to use software like “nmap”. You might go ahead and use other software, but
    they might be more detectable. For example “Angry IP scanner” is extremely easy
    to detect, but with “nmap”, you are going to be just fine, especially if you are
    mapping only once a minute, so it won’t look like a ping sweep.


    #### 端口扫描

    Once you have discovered the hosts, you must go after the ports. You want to be
    able to see which ports are open, which ones are closed, and which ports are only
    allowing specific traffic through. This gives you a better layout of the security
