    By deploying different kind of enumeration methods, you can fill in the blanks
    with an “SNMP enumeration”. SNMP or Simple Network Management Protocol is a protocol
    that you can use to manage your network devices. If the SNMP is set up incorrectly,
    you can have those networking devices identifying themselves to you and providing
    useful information such as user accounts, IOS-s versions they are running, their
