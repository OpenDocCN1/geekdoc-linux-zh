  md: '# Chapter 8 Penetration Testing Standards


    The different ways that you do pen-testing will depend on the methodology that
    you decide to use. There are many standards out there. Let''s cover some of those,
    so that you can learn which one suit you best.


    Let''s first begin with the OSSTMM, which stands for Open Source Security Testing
    Methodology Manual. This standard set of penetration test is trying to achieve
    a high-security matrix.


    In summary, this is considered to be the standard for some highest level of testing.
    There''s another one called OWASP, which stands for Open Web Application Security
    Project.


    OWASP is an open-source methodology, includes numerous tools that can help you
    plenty, and it''s also have a knowledge base, as well as a tool that is called
    the ZAPP or the Zed Attack Proxy Project.


    ZAPP is a tool that can automatically help you find vulnerabilities in web applications.
    ZAPP is designed for web developers, but pen-testers can use this tool as well.


    There''s also another framework called ISSAF, which is the Information System
    Security Assessment Framework. ISSAF is also an open-source project on how to
    conduct a pen-test. ISSAF is supported by a group called the public information
    system security group.


    Another standard that you should look at is called NIST, which stands for National
    Institute of Standards and Technology. When it comes to NIST, you should know
    that the federal technology agency works with the industry to develop and apply
    technologies, measurements, and standards.


    We also have LPT, which stands for EC-Council''s License Penetration Tester. This
    one is a proprietary methodology, and there is another one from McAfee, which
    is called Foundstone and also have ISS, which is done by IBM.


    When it comes to IBM, they do their testing for you. They also had a signature
    based product called the Proventia, which is now discontinued. This was a multifunction
    security appliance and offered numerous different services to help secure or test
    your network environment.'
