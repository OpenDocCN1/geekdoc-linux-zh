    ## 第16章 使用SQLmap进行SQL注入

    网站中最常见、可被利用的漏洞就是注入漏洞，该漏洞出现的原因是受害网站的输入未受到恰当管控，从而攻击者可以与后端数据库进行交互。评估SQL注入漏洞最有用的工具之一就是SQLmap，这是一个Python工具，能够自动化完成对多种数据库的侦察和利用工作。

    在本章中，你将学习针对mutillidae.com网站的SQL注入攻击。如果你使用的是Metasploitable靶机，可能需要先修复网站配置。

    首先，你需要使用SSH连接到你的Metasploitable主机，用户名为「mfsadmin」，默认密码也是「mfsadmin」。连接到Metasploitable机器后，你需要打开mutillidae.com网站的配置文件。

    在该文件中，你需要确保连接字符串指向OWASP Top 10数据库。完成配置后，你就可以开始SQL注入任务了。

    首先，打开mutillidae.com网站。接下来，在左侧菜单中选择「OWASP Top 10」选项，然后选择「注入」菜单项，再选择顶部的第一个SQL注入测试页面。该页面存在SQL注入漏洞，因此你需要使用Burp
    Suite拦截从浏览器发送到服务器的请求。

    在点击「查看账户详情」之前，你需要确保Burp Suite处于开启状态。切换回Burp Suite后，你应该能看到你发出的请求内容。接下来，你需要将请求内容保存到文件中，之后就不再需要Burp
    Suite了。你可以关闭所有Burp窗口，打开控制台。

    接下来，输入`` `sqlmap -dbs` ``并按回车键，查看可用的数据库。存储应用数据最有可能的数据库就是OWASP Top 10数据库，因此你需要使用以下命令查看该数据库的表：

    ```sql

    sqlmap --tables --database owasp --u "TARGET_URL"

    ```

    按下回车键。执行该命令返回的数据会显示OWASP数据库中的所有可用表。

    接下来，查看accounts表并导出该表中的数据。你可以使用以下命令列出数据库中的所有表：

    ```sql

    sqlmap -u "TARGET_URL" --tables -d database_name

    ```

    你可以使用另一条命令列出表中的列名：

    ```sql

    sqlmap -u "TARGET_URL" --columns -d database_name -T table_name

    ```

    你可以使用以下命令导出数据：

    ```sql

    sqlmap -u "TARGET_URL" --dump -d database_name -T table_name

    ```

