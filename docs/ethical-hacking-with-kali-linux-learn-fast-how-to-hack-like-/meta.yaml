    # 免责声明

    专业人士在执行本书所推荐的任何操作前，如有需求请咨询相关专业人员。对于因本书信息直接或间接导致的任何赔偿、损害或金钱损失，出版方在任何情况下均不承担任何法律责任或过错责任。本声明被美国律师协会及出版商协会委员会认定为公平有效，在美国全境具有法律约束力。本书的出版方或原作者，在任何情况下均不对读者或其他任何人因执行本书所述信息而遭受的任何困难或损害承担责任。

    本书后续页面的信息仅供参考，应视为通用信息。鉴于其信息属性，本书不保证相关信息的持续有效性或阶段性质量。本书提及的商标均未经书面授权使用，在任何情况下均不得视为商标持有人的认可。

    # 目标读者

    本书面向所有希望成为信息安全领域道德黑客或渗透测试师的读者。本书采用通俗易懂的文字撰写，无需具备专业技术背景即可阅读。本书内容将提供实用指南，教你如何使用Kali
    Linux对有线网络和无线网络实施各类攻击。

    如果你正打算成为IT专业人员，比如道德黑客、IT安全分析师、IT安全工程师、网络分析师、网络工程师或渗透测试师，但仍有疑虑、希望了解网络安全相关知识，你会发现本书极具实用价值。你将学习到围绕网络安全的核心概念与方法论，以及需要掌握的关键技术。

    如果你真心希望成为道德黑客或渗透测试师，那么本书就是为你准备的。如果你正计划成为信息安全专业人员，本书将提供大量详细信息，助你顺利进入这一行业。

    # 引言

    首先，我们将从Linux入门开始，帮助你大致了解这款操作系统的基本情况。接下来，我们将介绍面向道德黑客的软硬件推荐，并直接进入Virtual Box与Kali
    Linux的安装环节。

    本书主要围绕Kali Linux的工具及其部署方法展开，但在此之前，我们需要先了解渗透测试的基础知识，以及渗透测试如何与侦察、踩点环节配合。我们将介绍作为渗透测试师需要执行的每一个步骤，包括第一阶段、第二阶段和第三阶段。这一点非常重要，能帮助你了解如何承接道德黑客的工作——例如，客户雇佣你时需要询问哪些问题。因此，在本部分中，我们将介绍相关背景、实施时机、操作方法，以及所有法律要求，帮助你规避风险。

    我们还将介绍渗透测试标准，方便你选择最适合自己的标准。

    接下来，我们将从更实用的角度出发，介绍通过端口扫描实现踩点和主机发现的相关内容。之后，我们将深入讲解如何使用Hping3发现设备、如何为Burp Suite配置代理，以及如何使用Burp
    Scanner定位目标设备。

    接下来，我们将介绍一些应用测试内容，比如会话令牌随机化、爬虫，以及使用SQLmap进行SQL注入。

    之后，我们将进入实际攻防环节，介绍如何使用Kali Linux对有线和无线网络发起攻击：我们将介绍使用Airodump-ng进行字典攻击、使用EtterCAP进行ARP欺骗，以及实施被动侦察的相关内容。

    接下来，我们将介绍如何使用端口镜像捕获有线和无线流量、部署SYN扫描攻击，以及使用Xplico。之后，我们将介绍多种部署中间人攻击（MITM）的方法，比如使用Ettercap或SSLstrip。

    接下来，你将学习如何使用名为Scapy的工具篡改数据包，以及如何使用Parasite6捕获IPv6流量。

    之后，我们将介绍多种实施拒绝服务（DoS）攻击的方法，包括使用取消认证攻击，或使用名为mdk3的工具创建恶意接入点和邪恶双胞胎。

    接下来，我们将介绍如何使用TCP Hydra实施暴力破解攻击，之后我们将介绍如何使用Armitage的Hail Mary、Metasploit框架或SET（社会工程工具包）等非常强大且危险的工具，同时发起多种攻击。这些工具既可用于白帽黑客工作，也可用于黑帽黑客活动，一旦使用，两种场景下的结果是一致的。

    你必须明白，任何未经授权使用这类黑客工具的行为都可能引发严重后果，可能导致系统损坏或服务中断，使用者将面临极为不利的处境。如果你未经授权在有线或无线网络上使用这些工具，干扰或破坏任何系统，都将被视为非法的黑帽黑客行为。

    因此，我鼓励所有读者仅将本书介绍的所有工具用于白帽用途。任何经合法授权、帮助个人或企业发现漏洞、识别潜在风险的行为都是合规的。我介绍的所有工具，你都应仅用于提升系统安全防护水平。

    如果你对黑客和渗透测试感兴趣，我们建议你搭建家庭实验室，在自主可控的隔离网络中练习使用这些工具，不要将其连接到任何生产环境或互联网。如果你出于黑帽目的使用这些工具并被抓获，后果完全由你自行承担，你无权责怪他人。因此，我再次强烈建议你守住底线，你所做的所有事情都必须完全合法合规。如果你对所做的事情不确定、也不清楚可能产生的后果，请咨询你的主管，或者干脆不要行动。

    本书用于教育目的，面向所有希望学习和了解底层原理、有志成为道德黑客或渗透测试师的人。除法律问题外，在使用任何工具之前，建议你掌握网络相关概念的基础知识。

    ## 目录

