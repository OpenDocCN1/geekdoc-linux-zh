  md: 'Next, you will run a ping sweep against your target network. Or better, you
    are going to ask your target network to look for any live hosts, and once again
    you are going to use "nmap" to perform multiple port scanning techniques against
    your target.


    "Route mapping" was originally used as a diagnostic tool that allows you to view
    the route that an IP packet follows from one host to the next. Using the "TTL"
    or "Time to Live" field in a packet, each hop from one point to the next causes
    an "ICMP" time exceeded message. ICMP stands for Internet Control Message Protocol.


    The packets count the number of hosts and the route taken. For example the source
    host is your Kali Linux, and the server off the Google are connected by two intermediate
    routers, which I will call "R1" and "R2".


    First, the Kali node will send a TTL 1 probe to the router R1. Then R1 will pick
    it up and sends a response back with the time exceeded.


    Next, the Kali''s host will send a TTL 2 probe to R1, where R1 takes it up and
    decreased it by one, and then it will send it to R2. R2 will pick it up and sends
    back a time exceeded packet.


    Finally, the Kali node will send a TTL 3 probe to R1. R1 will pick it up, decrease
    it by one, and then sent it to R2. After that, R2 will pick it up, decrease it
    by one, and send it to the Google server.


    When Google server picks it up, it sends a response back with destination port
    unreachable. Why? Because most of the time, servers block the packets for this
    kind of port.


    In Kali Linux, "traceroute" is a command line program that uses ICMP packets to
    map the route. To trace the route to the Google server, type


    ```

    traceroute www.google.com

    ```


    and you should see that it taken between 12 to 16 hops to get to the Google server.
    If you try it once again, but this time execute it using "nmap", you will get
    a little different result. Why?


    Well, "nmap" enables you to do exactly the same thing, but uses the TCP protocol
    instead, which is allowed by nearly every firewall.


    To give you an idea about some basic Nmap scanning examples often used at the
    first stage of enumeration, check out the following commands:'
