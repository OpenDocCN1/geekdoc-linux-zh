    - The QRCode Generator Attack Vector for example creates a QR code with a defined
    URL associated with an attack.

    - The Powershell Attack Vectors will allow the attacker to create attacks that
    rely on Powershell, a command-line shell and scripting language available on all
    systems such as Windows, Vista, and higher versions.

