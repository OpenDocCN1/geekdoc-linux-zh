    up to two to three months to accomplish. Similarly, anybody that''s on the penetration
    team could have a point of contact if there''s an emergency of some sort.


    You also want to list some measures to prevent law enforcement from being called
    with false alarms that may be created by the test, especially if it''s a physical
    test.


    Your rules of engagement should also include how to handle information that you''ve
    gathered. One of the pre-requisites you should have when you do a pen test for
    a company, is that they should provide you with a laptop.


    It''s not a laptop that you get to keep, but it''s a laptop that you can use during
