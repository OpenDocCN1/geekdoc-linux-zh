    # Chapter 1 Introduction to Linux'
- md: 'To understand Linux, the leading operating system of the cloud, Internet of
    Things, DevOps, and enterprise server worlds, it is substantial for an IT career.
    To comprehend the world of open software licensing is not easy, but let me give
    you some highlights. If you''re planning to work with free software like Linux,
    you should understand the basics of the rules that govern it. Let''s first look
    at licensing.


    There are three main licensing bodies:

    - Free Software Foundation, founded in 1985 by Richard Stallman

    - The younger Open Source Initiative

    - Creative Commons


    First of all, the Free Software Foundation wants software to be free, not in the
    sense of free of charge, but to allow users the freedom to do whatever they like
    with it. Think about it like this: you may have to pay for it, but once it''s
    yours you can do whatever you want with it. Richard Stallman and his foundation
    are the original authors of the GNU General Public License (GPL), which allows
    users the right to do whatever they like with their software, including modifying
    it and selling it, as long as they do not make any changes to the original license
    conditions. The Linux kernel is the most significant piece of software released
    under the GPL.


    However, the Open Source Initiative, while cooperating with the Free Software
    Foundation where possible, believes that there should be more flexible licensing
    arrangements available if open source software is to achieve the greatest possible
    impact on the larger software market. Open source means that the original programming
    code of a piece of software is made freely available to users, along with the
    program itself. Licenses that are more closely aligned with the OSI goals include
    various versions of the Berkeley Software Distribution (aka BSD), which require
    little more than that redistributions display the original software''s copyright
    notice and disclaimer. This makes it easier for commercial developers to deploy
    their modified software under new license models without having to worry about
    breaking previous restrictions.


    The FOSS and FLOSS designations may serve to reflect the differences between these
    two visions. FOSS only implies that the software can be acquired free of charge,
    while FLOSS focuses on what you can do with the software once you obtain it.


    The Creative Commons license authorizes creators of nearly any type of work, such
    as software, films, music, or books, to select exactly the rights they wish to
    reserve for themselves. Under the Creative Commons system, a creator can choose
    from any combination of the following five elements:

    - Attribution: allows modification and redistribution as long as the creator''s
    attribution is included

    - Share-alike: requires that the original license conditions be included in all
    future distributions and copies

    - Non-commercial: permits only non-commercial use

    - No derivative works: permits further redistribution, but only of unmodified
    copies

    - Public domain: allows all possible usage


    It is essential when using software released under Creative Commons to be aware
    of exactly which elements have been selected by the author. The Creative Commons
    share-alike condition, along with Stallman''s GPL, are both part of the copyleft
    distribution system in practice. Copyleft licenses permit full reuse and redistribution
    of a software package, but only when the original license terms are included in
    the next-level distribution. This can be valuable for authors who do not want
    their software to ever evolve into closed license types, but want its derivatives
    to remain free forever.


    Non-copyleft open source licenses are frequently referred to as permissive licenses.
    Permissive licenses will typically not require adherence to any upstream restrictions.
    Common examples of such licenses, which often allow just about any use of the
    licensed software as long as the original work is attributed in derivatives, include
    the MIT, BSD, and Apache licenses. Nowadays, the Apache and MIT licenses are the
    ones most widely used.


    But the fact that open source software is free does not mean that it has no place
    within the operations of for-profit companies. In fact, the products of many of
    the largest and most profitable companies are built using open source software.
    In many cases, companies will freely release their software as open source, as
    well as providing premium service and support to paying consumers. For example,
    Ubuntu and CentOS Linux distributions follow this model, as they are consistently
    supported by Canonical and Red Hat, both of which are in the business of providing
    support for enterprise clients, and these are very serious businesses. Another
    example is Red Hat Linux, which was purchased by IBM for over $30 billion.


