    # ## Chapter 26 Deauthentication Attack against Rogue AP


    There are many different techniques to contain a rogue access point in a wireless
    network and in this scenario; we are going to use WLC to do it. But before thinking
    about containing a rogue access point, first we have to identify it. Once again,
    there are several ways to identify a rogue access point, and we already discussed
    some of them, so instead imagine the following scenario.


    Imagine that you are using a channel analyser to identify potential interferers,
    in an environment where there are several SSIDs broadcasted, but one of them is
    using an open authentication, while the rest of the SSIDs are all using WPA2-Enterprise
    for Security.


    Well, it''s very likely that if this is a corporate infrastructure what we would
    be looking at is some access point that is a rogue device that''s trying to lure
    in some customers.


    If someone in your environment whether it''s an airport or at your corporate network,
    if they''re emulating or spoofing your SSID trying to lure people in, it''s very
    likely malicious.


    Secondly, if we have a customer who associates with this rogue access point and
    starts using it then the attacker who has that rogue access point can now perform
    a man-in-the-middle attack and eavesdrop on all traffic.


    So here''s what we''re going to do. We''re going to use a Wireless LAN Controller
    also references as “WLC” because the WLC knows exactly which access points it
    manages.


    The good thing is that these access points they are not by default just sitting
    there servicing their customers on their respective channels, but they''re also
    periodically scanning the other channels, gathering information which they feed
    back to the wireless LAN controller.


    Part of that information it gathers is information about access points that they
    see. When the wireless LAN controller sees an access point that it doesn''t manage,
    it isn''t part of the wireless controller family, it''s going to classify that
    access point as “rogue”.


    Thus our very first step inside the WLC is to take a look and see if the controller
    knows about any rogue access points, and after we find that access'
- md: 'point, we''ll take the next logical step, and that is to contain it from the
    controller. On the WLC''s main page, the "Monitor" page in the upper right corner
    shows details of active rogue access points under "Rogue Summary". If you use
    a WLC, you might see several devices listed and ask how come there are so many
    rogue access points. There might be several reasons for this. For example, your
    WLC might see 10 or even more rogue access points, and they might all be completely
    legitimate; it is just that your WLC is not managing those, so it classifies them
    as rogue. All those other broadcast SSIDs that are seen by one or more access
    points managed by the WLC are reported back to the controller, which is why the
    controller puts them in the rogue category. It simply doesn''t know what those
    devices are.


    To view the details of these rogue access points, simply click the "Detail" link,
    and you will see a list of access points including their MAC addresses, SSIDs,
    the channels they are using, how many radios they have, and how many clients are
    connected to them. To learn more about a device, click its MAC address, which
    will take you to the "Rogue AP Detail" window. Here, you can see the device''s
    MAC address, the first time it was seen by the WLC, the last time it was reported
    to the WLC, and near the bottom of the page, the access points that first reported
    the rogue device. There, you can see which AP or APs detected the rogue access
    point, on what channel, and they also include information such as Received Signal
    Strength Indicator and signal-to-noise ratio.


    Now you might ask: that''s great, we know we have a rogue access point, but how
    do we contain that device, how do we shut it down? Well, we''re going to use our
    access points, which besides supporting normal customers, will also spend a little
    extra time scanning for the rogue access point, and they will effectively perform
    a denial-of-service attack against that access point.


    It''s going to do that by sending deauthentication messages. Now if a customer
    is trying to associate with that rogue access point, the goal here is to make
    sure that no valid customers associate with this unmanaged access point. Also,
    it is very important to point out that attacking your own access point is not
    a big deal, but attacking somebody else''s wireless local area network is a big
    deal, and you definitely would never want to do that against any other legitimate
    networks, because it will cause a denial of service attack against that network.


    To set up containment, look at the details of the rogue AP. The containment option
    can be found under the title "Maximum number of APs to contain the rogue". Once
    you select the number, a prompt will appear: "There may be legal issues following
    this containment. Are you sure you want to continue?" As I pointed out earlier,
    if you are still on the Rogue AP Detail page, next to the "State" field, the status
    will change to "Contained", which is what we wanted to achieve. If we want to
    turn that off and stop the attack, we''ll simply change the status back to "Alert",
    click "Apply", and the deauthentication attacks will be stopped.


    In the meantime, if you have a protocol analyzer, you can see the rogue access
    point''s frame number. If you follow the stream, under "Type/Subtype" you will
    see "Deauthentication", which is the attack we implemented via our WLC against
    the rogue access point. Although it looks like the source MAC address is initiating
    the attack, these frames are actually being sent by our own access points. If
    you keep following that stream, you will see it continue over and over until we
    stop the attack on the WLC. The goal is to make sure that no valid clients accidentally
    associate with the rogue access point, or if they do, they won''t stay connected
    for long because the periodic deauthentication messages will disconnect them from
    the rogue AP.


    As you can see, if you have a WLC in your organization, you can quickly identify
    and contain rogue access points. But once again, I would like to remind you that
    attacking somebody else''s wireless local area network is not legal, and you can
    get in trouble for doing it, so make sure that you have written authorization
    or your manager''s approval to carry out such containment using a WLC or any other
    tools.


    ## Chapter 27 IPv6 Packet Capturing with Parasite6


    Imagine that you have a new assignment for penetration testing, and the company
    has two networks that require being broken into. Yet, one of them is very likely
    easy, as there are no firewalls in place. But the second network seems more secured,
    and it might take the whole day to figure out the possible vulnerabilities to
    exploit. Certain people may start with the easy one that could be done in under
    an hour. But if you ask the right questions about the current network implementation
    running within the company, you may save yourself from extra hassle and have an
    easy day.


    IPv6 is running as a valid protocol on most computers in companies today. Therefore,
    by taking certain steps to disable it, you could leverage IPv6 according to its
    operation and compromise the network via a Man-in-the-Middle attack. If you are
    aware of that and understand how to exploit it, you may be able to finish your
    penetration testing within a short period of time, as the company possibly has
    not enabled all the security features on the network as they should have.


    Man-in-the-Middle attacks are achievable with many tools, and we have discussed
    some of them previously. Once we are approaching an IPv6 network, we can use another
    great tool called “Parasite6”. Let''s get back to basics and think of what happens
    when the PC boots for the first time while connected to a network. Of course,
    the PC first would ask for an IP address. In this case, an IPv6 address from the
    router that is on the same network, or if there is a DHCP server, then the DHCP
    server would assign that IP address to that PC.


    Next, if that PC begins to communicate with the outside network or the Internet,
    first it should learn the MAC address of the router, and that would happen by
    using ARP or Address Resolution Protocol, but in IPv6 there is no such thing as
    ARP. What happens in an IPv6 network instead of ARP is that the PC would use a
    Neighbor Discovery, specifically called NDP or Neighbor Discovery Protocol.


    What would happen next is that the PC would send out a neighbor discovery, to
    be more detailed, a neighbor solicitation to its router, then the router would
    reply with a neighbor advertisement. Solicitations are asking, and advertising
    is giving the address that has been asked for.


    That''s all great, but how would we use Parasite6 here? Well, we would join the
    network with our Kali Linux machine that is running Parasite6, then begin to listen
    to the network. Once Parasite6 is enabled, it would start to listen to every neighbor
    solicitation message that goes through the network, and then it would begin to
    answer. But instead of answering with the correct details, we would answer with
    our own MAC address to everyone on the network, making every network device on
    the network believe that we are the router.


    We don''t have a Man-in-the-Middle attack yet; instead, we have a DoS or Denial
    of Service attack because every network device that wants to get out to the Internet
    would reach our Kali machine first, thanks to Parasite6 being enabled. To turn
    this DoS attack into a MITM attack, we would have to enable IPv6 forwarding on
    our Kali Linux machine.


    Launching Parasite6 on Kali is simple: all you have to do is type the command:

    `parasite6 <interface> <fake MAC address>`

    Then press Enter. Essentially, you have to type parasite6, then specify what interface
    you want to connect to the network and become a Man-in-the-Middle, then type the
    fake MAC address that you want to provide to all other end devices or network
    devices that are connected to the same network. For the fake MAC address, any
    made-up MAC address would work just fine.


    Another useful command you can deploy is:

    `parasite6 -l <interface> <fake MAC address>`

    This time I have added “-l” which represents a loop, meaning it will create a
    loop and refresh the solicitation message every 5 seconds.'
