    ## 快速学习如何像专家一样黑客技术

    ![](img/e7d379bcf5614b6f1b2f213c4578b596_0_0.png)

    作者：雨果·霍夫曼

    保留所有权利。未经出版方书面许可，本书任何部分不得以任何形式或通过任何电子、印刷、机械方式复制，包括信息存储与检索系统。

