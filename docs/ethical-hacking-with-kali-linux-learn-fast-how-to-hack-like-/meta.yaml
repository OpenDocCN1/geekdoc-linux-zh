  md: '# **Chapter 30 Brute Force Attack with TCP Hydra**


    In this chapter, you will learn how to analyse a brute force attack against the
    target system. In this scenario imagine that you have 3 nodes. The attacker is
    going to use a Kali Linux with the IP address of 10.0.0.111, and the victim machine
    will be using a Windows 10 device with an IP address of 10.0.0.202.


    Lastly, the penetration tester will use Kali Linux to intercept all the traffic
    and analyse any attacks on the network. Imagine that you are the attacker and
    you want to attack one of the hosts on the network that has a Telnet service turned
    on.


    The first thing a hacker is going to do is to try to brute force the target victim.
    To begin with a brute-force attack, there are various tools that you can use,
    but there is one which is very popular amongst pen testers and we haven''t covered
    yet is called "hydra".


    To use hydra, you have to first open your Klai Linux terminal window, and type
    the command:


    ```

    "hydra –V –l (dictionary password file path) –t 50 –(victim IP address) ssh"

    ```


    Then press enter. Here, the "–V" option is for maximum verbosity, then the "–l"
    is for the log in name, followed by the dictionary password file path, and the
    "–t" argument selects the number of parallel connections.


    The greater the number, the faster the testing will occur, followed by the victim
    IP address, and finally, the protocol that I want to brute force. Once you have
    pressed Enter, the attack will begin, and all you have to do is now wait for the
    password to be cracked.


    The password should be cracked in few minutes. From a hacker perspective, what
    is the next step? Well, the hacker will try to log in using Telnet.


    First, the hacker would issue the Telnet command, then specify the IP address
    of the victim''s host, and enter the login name followed by the cracked password.


    At this moment, the hacker is happy about this victory. If you jump into the penetration
    tester machine and analyse this hack, you should see what happens when the attacker
    tries a combination of username and passwords that are not authorized.'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'To analyse these types of conversations in Wireshark, right click on any packet
    and select "Follow TCP Stream". The message will say that no more connections
    are allowed to telnet server. "Please try again later".


    This is the typical message that the attacker is receiving over and over again
    when he fails during the brute-force attack.


    Within Wireshark when you look at the tapped traffic, you have to scroll down
    until you don''t see this type of pattern anymore, and if follow the stream again,
    you should see the username and password in plain text, and you should also see
    the command that the attacker executed.


    The list that you see in this page is Clear Text Protocols such as HTTP, FTP,
    and Email protocols such as POP, IMAP, SMTP, Telnet or Voice over IP.


    If you find that your client is using one of these protocols, you need to mention
    that in your final report. A simple solution is to replace these clear-text protocols
    with other secured protocols such as HTTPS instead of HTTP, SFTP, or SCP instead
    of FTP and so on.'
