  md: '# **Chapter 17 Dictionary Attack with Airodump-ng**


    To execute a dictionary attack on a wireless network where the wireless network
    is protected with WPA or WPA2, we''re going to follow a four step process.


    First, we want to find out the BSSID of the access point that we want to execute
    our dictionary attack against. Once we''ve found the access point we want to attack,
    then we need to decide on the wordlist that we want to use for the attack.


    A wordlist, as the name suggests, is a list of words, like a dictionary, and we''re
    going to try that list of words against the access point.


    The third step is that we''re going to generate authentication traffic. For this
    attack to work, we need to be able to capture a legitimate user connecting to
    the access point and we''re going to generate that traffic, so we can sniff it
    over the air. Lastly, we have to execute the dictionary attack.


    For this attack, we''re going to use Kali Linux. To do that, you have to open
    up a terminal and look at the configuration. Type


    ```

    "iwconfig"

    ```


    and you should see two of your wireless wireless lan adapters. Wireless wlan1
    should be your device''s wireless LAN card that''s integrated in your device,
    and wireless wlan0 is your virtualized Kali Linux LAN adapter if you have successfully
    bridged your devices.


    This is also the one that you will be using to execute your attack. Therefore,
    the first thing you need to do is to put Kali Linux''s wlan card into monitor
    mode, but before you would do that, you have to take down your wireless lan adapter
    by typing:


    ```

    "ifconfig wlan0 down"

    ```


    Next type:


    ```

    "iwconfig wlan0 mode monitor"

    ```


    This command will put your wireless lan adapter into monitor mode. But the ensure
    the wlan is back up, you have to type the command:


    ```

    "ifconfig wlan0 up"

    ```'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'Now that your wireless lan adapter is back up, you want to confirm that is
    now in monitor mode. To do that, you have to type the command:


    ```

    "iwconfig"

    ```


    Here, you should see where it says "Mode", next to that, it should say that the
    card is now in monitor mode. Your next step is to find the BSSID of the access
    point that you want to attack. For that you are going to use the tool called Aircrack,
    so you have type:


    ```

    "airodump-ng wlan0"

    ```


    This will start searching for broadcasted BSSID-s. Here, you will see that you
    are capturing the BSSIDs of the surrounding access points and the channels they
    are using.


    NOTE: Do not compromise your neighbours wireless, or worse, do not use this tool
    in production environment, unless you have written authorization.


    Back to Kali Linux, to exit monitoring, you can press "Ctrl+C" to stop the search
    once you have found your wireless BSSID that you are going to attack.


    Within the output of Kali, you should also have the MAC address of the BSSID,
    which is normally a 12 character long letter and numbers that you have to take
    a note of, because you are going to need that MAC address when you execute the
    attack.


    The next step is to find a wordlist that you can use in order to break in to the
    access point, and Kali has several tools that you can use for this purpose.


    You can also download others similar tools, but the tool called "Airodump" will
