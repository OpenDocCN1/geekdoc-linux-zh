    data with it, yet there is another utility that we can use for the same purpose
    called “Xplico”.


    Xplico can take Wireshark files as well and analyse them for you. Wireshark also
    has the ability to do a direct feed into Xplico therefore we can capture all the
    traffic and it can give another great view of what is happening within that session
    that we are eavesdropping on.


    Xplico also comes as a default built in tool within Kali Linux. To launch the
    Graphical User Interface you can follow the menu options as:


    +   - Kali Linux > Forensics > Network Forensics > xplico web gui


