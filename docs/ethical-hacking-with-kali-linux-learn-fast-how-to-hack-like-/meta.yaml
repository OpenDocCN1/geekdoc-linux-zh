    ## Chapter 32 The Metasploit Framework

    Exploitation is the heart of ethical hacking. By exploiting vulnerabilities you
    can start making assumptions about how dangerous they can be. The Metasploit Framework,
    or MSF, is an open source tool designed to facilitate penetration testing. The
    application is written in the Ruby programming language.


    It uses a modular approach, thus facilitating exploit development. This makes
    it easier to develop and code exploits, and it also allows for complex attacks
    to be easily implemented. The exploit module is the code fragment that targets
    specific vulnerabilities. Active exploits target a specific host and run until
    completed, then exit. On the other hand, passive exploits wait for incoming hosts,
    such as web browsers or FTP clients, and exploit them when they connect to the
    network.


    Payloads are the malicious code that implements commands immediately following
    a successful exploitation. Auxiliary modules do not establish or directly support
    access between the pen tester and the target system. Instead, they perform related
    functions, such as scanning, fuzzing, or sniffing that support the exploitation
    phase. Following a successful attack, post-exploitation modules run on compromised
    targets to gather useful data and pivot the attacker deeper into the target network.
    Encoders are used to bypass anti-virus defences, and these modules encode the
    payload so it cannot be detected using signature matching techniques. Lastly,
    No-Operation (NOP) modules are used to facilitate buffer overflows during attacks.


    The steps for exploiting a target system using MSF first start with choosing and
    configuring an exploit. Next, you need to check the target system to determine
    if it is susceptible to attack by the exploit. This step is optional, and it should
    be your method to minimize detection. After that, you can choose and configure
    the payload, which is the code that will be executed on the target system following
    a successful exploitation. An example of a payload would be something like a reverse
    shell from the compromised system back to the pentester host. After this step,
    you can also choose an encoding technique to bypass detection controls, such as
    intrusion detection systems or anti-virus software. Lastly, you have to execute
    the exploit.


    Let me explain how it is done. As a pen tester, you should investigate every vulnerability.
    For example, on port 6667, Metasploitable runs the application called "unrealircd",
    which is an IRC daemon.'
