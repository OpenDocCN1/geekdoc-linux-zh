    # ## Chapter 6 Pen Testing @ Stage 2


    Pen testing Stage 2 is the attack stage. All information that you gather during
    the pre-attack stage helps you to come up with a thorough attack strategy. The
    attack stage involves compromising the target.


    You might go after an exploit of vulnerability that you discovered during the
    pre-attack stage or even utilize some loopholes like weak security policies or
    password policies to try to gain access to the system.


    It is important to note that the attacker only needs to worry about one port of
    entry or one mechanism to get in, therefore the customer or company needs to worry
    about covering all their bases.


    Instead of being passive, you need to become active. Once the contract is finalised
    and you have permission to engage, first you should try to penetrate the perimeter
    by looking at machines that are exposed externally and how they react.


    You then should look at how to enumerate that targets after you have made your
    way in. In case you know what the target is, it will be easier to try to attain
    the target.


    After you attain the target, the next thing you must do is to be able to escalate
    your privileges, so you can do more with that particular system. Finally, you
    will need to ensure that you can get back into the system by executing, implanting,
    and retracting, using rootkits.


    Let''s get into details on how you would do each one of these items. The primary
    ways of testing the perimeter is by going after the firewall itself, and you are
    going to do this by sending and crafting some packets to check how the firewall
    reacts.


    This can be done by looking at how the firewall handles fragmentation, overlapping
    fragments, floods of packets.


    You can also do this by crafting some packets so you can check the Access Lists
    or ACLs of the firewall, such as what''s allowed through and what''s not.


    Technically, what''s permitted and what''s denied. You should also take a look
    at how the protocols are filtered by trying to connect to various protocols, such
    as SSH, FTP, or even Telnet.'
- md: 'You also must try to measure the thresholds for different denial of service
    attacks by trying to send persistent TCP connections and see how the firewall
    handles that, or even attempting to stream UDP connections. By doing this, you
    will learn what the thresholds are set at the firewall. You should also try to
    send some malformed URLs to see how the IDS responds. You can also try to see
    how the web services respond to some requests such as POST requests, DELETE requests,
    or COPY requests.


    Next, you have to go after enumerating machines. The goal of enumerating machines
    is to find out as much information about the host as possible. You may have discovered
    something during the pre-test environment, but the attack phase gets you active.
    But some of those perimeters that you are going to discover could be things like:
