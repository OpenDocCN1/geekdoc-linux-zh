    The CentOS installation program will ask you whether you want to set up a regular
    user for your system or if you''re fine with just the root user.


    While you''re not forced to create a regular user, to harden your security posture,
    it''s highly endorsed that you avoid logging in as a "root" user for normal operations.


    As an alternative, logging in and getting your work done as a regular user who
    can, when necessary, invoke administration powers using pseudo, is much better.


    Standard Ubuntu install processes for example won''t even offer the option of
    using root. You can always opt in to go with the default approach for storage
    devices where in most cases the entire file system will be installed within a
    single partition, but you might want to explore other options for more complicated
    or unusual use cases.


    Many server admins prefer keeping the “/var” directory hierarchy isolated in a
    separate partition to ensure that system log data doesn''t overwhelm the rest
    of the system.


    You can use a small but fast SSD or solid state drive for most of the system files,
    while the larger “home” and “var” directories are mounted to a larger, but much
    slower hard drive.


    This allows you to leverage the speed of the SSD for running Linux binaries while
    getting away with a less expensive magnetic hard drive for your data, where the
    performance difference wouldn''t be as much noticeable.


    You''ll be asked whether you want your storage devices to be managed as “LVM volumes”.
    But what is an “LVM volume”?


    Well, LVM stands for Logical Volume Manager, which is a way to virtualize storage
    devices, so they''re easy to be manipulated later on. But how it functions?


    Well, Let''s imagine that you''ve got three separate physical drives on your system.
    LVM would turn them all into a single volume group, whose capacity equals the
    total aggregate space from all three drives.


    At any time you''ll be free to create as many logical volumes from that volume
    group as you''d like, using any combination of individual capacity, up'
