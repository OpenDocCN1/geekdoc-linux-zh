    ## 第23章 使用Ettercap进行中间人攻击

    本章我们将讲解如何使用Ettercap捕获目标设备的凭证，具体来说就是通过HTTP和FTP这两个未加密协议窃取目标的用户名和密码。本次实验环境包含一台Linux系统和一台Windows
    10系统，我们将使用Ettercap将自己置于默认网关（也就是这台Windows主机）和目标之间。

    要获取默认网关地址，你需要在终端中输入：

    ``` ip route ```

    我的默认网关地址是192.168.100.1，但不管你的地址是什么，这是运行Ettercap需要掌握的核心信息。从技术角度来说，你可以选择把自己置于子网内所有设备和默认网关之间，也可以只针对单个目标。本次场景中，我们将把自己放在所有设备和默认网关之间。

    首先在Kali Linux中，打开“应用程序”，然后向下滚动找到“嗅探与欺骗”选项，点击后选择“Ettercap-g”，这是Ettercap的图形化界面。图形界面打开后，点击“sniff”，再选择“unified
    sniffing”，就会弹出下一个窗口。

    新打开的名为“ettercap Input”的窗口会询问你想要嗅探哪个网络接口。我们的Kali机器上只有一张网卡（NIC，即网络接口卡）用于统一嗅探，因此直接选择窗口显示的那个接口即可，点击“ok”。

    接下来，在用Ettercap把自己置于中间人位置之前，需要先配置目标。点击“hosts”，然后选择“scan for hosts”，这会扫描目标所在的子网。我们需要使用ARP欺骗（arp
    poisoning）才能把自己变成指定子网的中间人。扫描完成后，再次点击“hosts”，选择“hosts list”，新窗口中会显示刚才扫描到的所有IP地址。

    在这里你应该能找到你的默认网关IP地址，我的就是192.168.100.1。现在需要创建目标，选中你的默认网关对应IP（比如192.168.100.1），然后点击“Add
    to Target 1”。如果你还有其他想要监控的目标IP，同样可以点击选中它们，再点击“Add to Target 2”。

    目标设置完成后，回到顶部窗口，点击“Mitm”（即中间人攻击的英文缩写），然后选择“arp poisoning”。完成选择后会自动弹出新窗口，勾选“Sniff
    remote connections”，再点击“ok”即可。

    如果中间人攻击设置成功，也就是说Kali Linux机器已经处在Windows 10主机和默认网关之间，那么192.168.100.1这个IP对应的MAC地址应该和Kali
    Linux的MAC地址一致。要验证这一点，你需要在Windows 10主机的命令行中输入：

    ``` arp -a ```

    ARP是地址解析协议（Address Resolution Protocol）的缩写，作用是将MAC地址和IP地址进行对应映射。在Windows上执行这个命令后，会看到一份IP地址列表，每个地址旁边都对应着它的MAC地址。注意不要搞混，Windows系统里会把IP地址标注为“Internet
    Addresses”，MAC地址标注为“Physical Addresses”。

    你会注意到Windows里标注的“Physical Addresses”其实在技术上是不准确的，因为我们用Ettercap修改的是默认网关的MAC地址。为了100%确认，你也可以验证Kali
    Linux的MAC地址。回到Kali Linux的终端，输入：

    ``` ifconfig ```

    在命令的输出结果中，找到“ether”字段，这就是Kali Linux以太网接口的MAC地址（也就是物理地址）。

    确认Kali的以太网地址和Windows里的默认网关地址一致后，就说明你已经成功用Ettercap建立了中间人位置。Ettercap的优点在于，一旦你处于中间人位置，几乎不需要额外操作，只要保持它运行即可。Ettercap的窗口底部会自动捕获所有明文传输的凭证，窗口里会分别显示“USER”后面的用户名和“PASS”后面的密码，会自动弹出在窗口左侧，完全不需要你手动操作。不像Wireshark需要你盯着流量看，Ettercap的账号密码都会自动弹出来。

    如果使用的是未加密协议，Ettercap会捕获所有传输的用户名和密码，因此平时应该用HTTPS代替HTTP，用SFTP或者SCP代替FTP来传输文件。当你用Ettercap进行二层中间人攻击时，终端用户完全不会察觉，因为没有任何提示弹窗，所以用户根本不知道自己的流量已经被监控。

    最后再次提醒，在实战或者生产环境中使用该方法前，请务必确保你已经获得了书面授权，因为任何类型的中间人攻击都具有极高的危险性。


    ## 第24章 使用SSLstrip进行中间人攻击

    本章我们将讲解如何在Kali Linux虚拟机上创建伪造的接入点。要完成本次攻击，你需要一块支持监听模式和主模式的USB网卡。如果你没有符合要求的USB网卡，我之前提到过的Alpha系列网卡非常推荐，售价仅约50美元，在亚马逊等渠道都可以买到。

    开始操作前，我先讲解一下本次攻击的原理。整体流程的主要参与方包括受害者、攻击者、伪造接入点，以及带有互联网连接的路由器，我先给你做个高层级的流程概述。

    具体流程是，攻击者首先连接到互联网，然后通过一块作为伪造接入点的USB网卡共享自己的网络连接。当其他设备连接到这个伪造接入点时，就可以正常访问互联网了。

    下面我带你走一遍完整流程：首先受害者会连接到伪造的接入点，随后受害者的网络流量会被路由到伪造接入点，再传到攻击者设备上。攻击者拿到受害者的网络流量后，会使用SSLstrip对流量进行篡改和日志记录，强制受害者使用HTTP协议，从而捕获受害者输入的所有用户名和密码。SSLstrip完成流量的篡改和记录后，攻击者会把受害者的流量转发给路由器，最终路由器会把受害者的网络请求路由到受害者想要访问的网站。我们的操作本质上就是将自身置于受害者和目标网站之间，因此可以查看受害者和网站之间的所有交互数据，这也被称为中间人攻击。原理讲解完毕，现在我们可以开始实操了。

    第一步我们需要连接互联网，方法是将宿主操作系统的网络连接共享给Kali Linux虚拟机。这种方法本质上就是桥接或者有线网络连接，我选择这种方式是为了不需要额外的第二块USB网卡。不过如果你有第二块USB网卡的话，也可以直接用它在Kali
    Linux虚拟机上连接互联网。接下来我将分享我用的具体方法。

    现在我们登录宿主操作系统，只要你用它能够连接互联网，运行Kali Linux虚拟机的设备是什么类型并不重要。首先打开系统自带的网络设置，或者你的操作系统使用的任意网络管理应用。我可以从顶部菜单栏打开我的网络设置，然后选择一个无线网络连接。你可以选择任意可用的网络，只要它有互联网连接即可，如果你在移动场景下，也可以使用安卓或iPhone的4G
    USB调制解调器、移动热点，或者其他任何能够联网的方式。

    宿主操作系统成功联网后，需要把网络共享给Kali Linux虚拟机。现在切换到Kali Linux虚拟机，点击顶部菜单栏的虚拟机菜单，展开网络适配器选项。如果你有多个网络适配器，选择最顶部的那个，它的名称应该是“Network
    Adapter”，后面没有数字。在这里我们需要把网络适配器的模式设置为“桥接自动检测”，这样就能从宿主操作系统连接的路由器那里获取IP地址和网络连接。设置完成后可以收起虚拟机菜单，现在就可以用这个虚拟网络建立互联网连接了。

