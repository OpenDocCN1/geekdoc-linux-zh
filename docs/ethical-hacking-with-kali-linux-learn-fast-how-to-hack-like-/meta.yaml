    on the victim, like it''s trying to establish a channel for normal communication
    on the ports.


    When a SYN scan is executed, the attacker will be looking for three states. Either
    the port is open, closed, or filtered. Normal TCP handshake works like this.


    First, a SYN packet will be sent, then the server will reply with a SYN/ACK and
    finally, the client will send an ACK packet.


    Now let''s take a look at the Open Port scenario. If a service on the victim''s
    machine is listening on the port, that receives the SYN packet, and it will reply
    to the attacker with a TCP SYN/ACK packet, and then the attacker knows that the
    port is open and a service is listening on it.


