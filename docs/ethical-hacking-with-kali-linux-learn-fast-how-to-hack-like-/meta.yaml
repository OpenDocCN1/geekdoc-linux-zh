- md: '## Pen Testing Pre-Attack Phase

    ### Test Phase Change Management

    - There''s one thing you want to be concerned about, and it''s something you want
    to explain to the client. If the pen-test takes a while to do, during that timeframe,
    changes may be incorporated into their network without the pen-testers'' knowledge,
    and usually the client doesn''t understand the impact of those changes.

    - Before any amendments are made during the pen-test timeframe, this could be
    reviewed or sent to the engagement lead from the pen-testing company so he could
    explain the effects of the changes that they''re about to make.

    - Some of these changes include any business process changes, or any technical
    changes such as if the company moves location. Also, if there are any applications
    that might have changed. Here, I am not talking about updates to an existing application,
    instead I''m referring to switching to completely different applications.


    ### Test Scope Definition

    When considering the scope of the pen-test, the testing team should cover the
    following dimensions:

    - System software security and system configuration: check for software and system-based
    vulnerabilities.

    - Network security: review all network components and their configuration. For
    example, check if any default configurations are still in use.

    - Client-side application security: check the client-side application for security
    and compliance, as well as the security of traffic transmitting from the client
    to the server. Assess how that traffic is secured.

    - Server-side security: after completing the client-to-server traffic check, review
    the security of server-side applications and the applications themselves running
    on servers for flaws.

    - Social engineering methods: implement social engineering tests within the scope
    to try to gather passwords or project details.

    - Existing security documentation: also consider how employees dispose of unused
    documents, and emphasize the usage of shredding devices.


    ### Expanded Scope Items

    - Application communication security: assess whether there is a risk of unauthorized
    interceptions.

    - Physical security: check whether the organization restricts physical access
    to systems only to relevant departments.

    - Document disposal risk: many companies hire on-site shredding services to dispose
    of documents, but information may still leak through regular trash, so ensure
    they understand this is a potential attack vector.

    - Insider threat: check for dissatisfied employees who might release confidential
    data or take it with them to a competitor.

    - Intruder confusion mechanisms: review with the client whether they implement
    strategies such as honeypots to confuse or mislead intruders. As a pen-tester,
    you need to test the effectiveness of these mechanisms if they are in place.

    - Incident response scope: test within the scope of response, for example, what
    is the appropriate response for each type of incident.


    ### Contract Requirements

    Next, review the contracts to ensure the following clauses are included:

    - Non-disclosure agreement (NDA): this ensures the company''s information is safeguarded.

    - Fees and schedules clause: be clear about fees and timelines, especially if
    the project goes beyond the estimated schedule, as you might come across unforeseen
    issues.

    - Sensitive information document: this includes information related to the company''s
    electronic assets, applications currently under development, or any other sensitive
    information required by the pen-testing team.

    - Confidential information contract: this covers trade secret information, network
    information, telephone system information, customer data, or other business materials.
    This type of information is provided to the pen-tester, which is another reason
    why I recommend the company provide you a company-owned laptop, so they don''t
    have to worry about you taking confidential information with you when you leave.

    - Non-disclosure to third parties: the contract should also mention that you will
    not reveal or give copies of any information to any third party or competitor.
    This helps build trust between you and the company, as you are about to attack
    them to test if information can be stolen.

    - Indemnification clause: this protects the pen-tester from any legal or financial
    liabilities, as pen-test results may sometimes cause loss or damage to the company''s
    assets.

    - Reporting and responsibilities section: this should be a guideline stating the
    methodology for performing the test and how you will report the procedures.


    ### Information Gathering

    The next item in the pre-attack phase is information gathering, which can be done
    in several ways:

    - Passive reconnaissance: utilize public records, or do light non-aggressive research
    on the company (for example, a little Googling) that is not overly intrusive.

    - Active surveillance: conduct more aggressive active reconnaissance as the opposite
    of passive methods.

    - Web profiling: obtain the directory structure of web servers or FTP servers,
    catalogue all web-based forms, allowed types of user input, form submission destinations,
    and pop-up error messages. These error messages can help identify third-party
    links and applications.

    The information gathering stage takes a long time, but it helps protect both you
    and the client, so a clear level of expectation needs to be met between both parties.


    ---


    ## Chapter 6 Pen Testing: Stage 2

    ### Attack Stage

    Pen Testing Stage 2 is the attack stage. All information that you gather during
    the pre-attack stage helps you to come up with a thorough attack strategy. The
    attack stage involves compromising the target. You might go after an exploit of
    a vulnerability that you discovered during the pre-attack stage, or even utilize
    loopholes like weak security policies or password policies to try to gain access
    to the system.

    It is important to note that the attacker only needs to worry about one port of
    entry or one mechanism to get in, therefore the customer or company needs to worry
    about covering all their bases. Instead of being passive, you need to become active.
    Once the contract is finalised and you have permission to engage, follow these
    steps:

    1. First, try to penetrate the perimeter by looking at machines that are exposed
    externally and how they react.

    2. Then, enumerate those targets after you have made your way in. If you know
    what the target is, it will be easier to attain the target.

    3. After you attain the target, escalate your privileges so you can do more with
    that particular system.

    4. Finally, ensure that you can get back into the system by executing, implanting,
    and retracting rootkits.


    ### Perimeter Testing Methods

    The primary way of testing the perimeter is by targeting the firewall itself,
    by sending and crafting packets to check how the firewall reacts:

    - Test how the firewall handles fragmentation, overlapping fragments, and floods
    of packets.

    - Craft packets to check the firewall''s Access Lists (ACLs) to see what is allowed
    through and what is not, i.e., what is technically permitted and what is denied.

    - Try to connect to various protocols such as SSH, FTP, or even Telnet to check
    how protocols are filtered.'
