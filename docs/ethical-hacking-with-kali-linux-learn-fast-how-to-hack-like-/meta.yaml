    ## Chapter 5 Pen Testing

    ### Stage 1: Pre-engagement


    Pen testing stage one is also known as Pre-engagement, and this stage focuses
    on gathering as much information as possible about your target. This can be done
    using techniques such as scanning or footprinting. You must set your boundaries,
    and that is what you first want to come up with, but just like the military, there
    are rules of engagement. For example, military personnel are not allowed to fire
    unless fired upon. Just because they see somebody with a weapon, it doesn''t mean
    that they can go ahead and shoot. It all depends on the war that they''re in.
    Each one would have its own rules of engagement, and that''s the same thing here.
    You are creating formal permission to conduct the penetration test, and in the
    rules of engagement, you may specify whether or not you do technical or non-technical
    activities. The rules of engagement explicitly define these activities. A security
    professional that''s doing a pen test might be allowed to do certain activities
    that are generally considered illegal.


    Some rules of engagement items to include are the IP address range that you''re
    allowed to test. You do not go outside of that range, or the times that the test
    is conducted during business hours, or after business hours. You may be thinking,
    "Pen tests could take place anytime?" Well, yes, but it all depends on what you''re
    simulating; for example, a gray box attack from the inside might be strictly conducted
    during business hours. You also want to have a list of hosts that the client or
    department considers to be restricted. If you see an IP address that''s not on
    your list, you don''t touch it! You''ll also list the acceptable testing methods,
    such as social engineering, denial of service attacks, what tools will be used,
    password crackers, network sniffers, and so on. If you are going to use the tool
    called Nmap for example, will it be an aggressive Nmap scan or a stealth Nmap
    scan? You should also specify the length of the test. Depending on the test itself
    or what you''ve agreed to, some pen tests can take up to two or three months to
    accomplish.


    Similarly, anybody on the penetration team should have a point of contact in case
    of an emergency. You also want to list measures to prevent law enforcement from
    being called due to false alarms that may be created by the test, especially if
    it''s a physical test. Your rules of engagement should also include how to handle
    the information that you''ve gathered.


    One of the prerequisites you should have when conducting a pen test for a company
    is that they should provide you with a laptop. It''s not a laptop that you get
    to keep, but one that you can use during the pen test, including for reporting.
    After you are done with the pen test, you turn that laptop back to them with instructions,
    and they will store that laptop away for possible future pen tests as a follow-up.
    That way, you are not accused of storing their information on your personal systems.
    Technology changes rapidly. If they put the laptop away for five or six years,
    that laptop could be obsolete. Therefore, you can also advise your client to pull
    the hard drives out of the computer and store only those, and make sure that the
    data is stored in an extremely secure location.


    You''re going to compile a list of what the customer requires, along with all
    information gathered during the interview process to ensure that you address all
    of their needs. You''ll review with the customer or the department that needs
    to be tested, such as servers, workstations, routers, firewalls, network devices,
    databases, applications, physical security, telecommunications, voice systems,
    and so on. You''ll also have to create a checklist of requirements, outlining
    what the customer requires you to do with those particular tests. You also have
    to specify the sectors to be tested and organize the users. For example, you might
    only need to look at specific departments, such as the IT department. You''re
    going to notify the folks in those departments that something could be happening
    within the next week or so.


    You''ll also need to identify your timeframes, but you must ensure that it''s
    the timeframe the customer requires. It''s not what you think is best, unless
    they''re asking you for advice. You also want to ensure that you develop an emergency
    plan in case you come across a situation where a real malicious attacker has made
    their way in. What do you do in those situations? Well, you will have to ensure
    that all the information is securely backed up before beginning any work, because
    some actions you might take could modify the original files.


    You''ll also need to decide on the format you''re going to use for your reporting.
    Will it be a standard Word document? Do they need it in PDF? What information
    must they see? Should the report content differ based on who is viewing it? For
    example, maybe the manager of the IT department doesn''t want to see all the details
    of what happened. He just needs to see the items he needs to address, and who''s
    involved in delivering the report.


    You have to be cautious here because many times, when assessing the work of an
    IT professional and presenting the report, it needs to be constructive rather
    than mocking, and should be delivered in a genuine form. The security professional
    delivering this report needs to be aware that there could be some negative feelings
    as a result, and like it or not, you should always report everything.


    To keep track of all this, you have to start making lists. Here are some items
    you may include on your checklist:

    - Network layout and subnets, including the IP ranges in use;

    - Physical security of servers, networking devices, and the building itself (e.g.,
    whether an unauthorized person can walk into the office and access an empty RJ45
    jack);

    - Both external and internal IP addresses;

    - Network devices such as routers, switches, firewalls, wireless access points,
    and wireless LAN controllers, including the quantity of each device type;

    - End devices including wireless and wired host devices like laptops and desktop
    computers;

    - Printers, scanners, CCTV cameras, door entry security mechanisms, meeting room
    devices such as projectors and IPTVs, IP phones, conference IP phones, and mobile
    devices including mobile phones, tablets, Apple Watches, and Android Watches,
    all of which are connected to the network;

    - A map of the organization''s internet presence, showing what is accessible from
    the outside and the addresses of machines connected to both external and internal
    networks;

    - Operating systems running on network servers: if there are five or fewer servers,
    document the types (Windows, Linux, etc.) and quantities of each; if more servers
    are present, confirm the total count and distribution;

    - Requirements for assessing wireless networks, analog systems, and mobile devices,
    especially for organizations with a mobile workforce;

    - Web applications and services offered by the client, including front-facing
    website features such as redirect links to external sites and externally sourced
    content embedded in the site.


    Moving on, you''ll also want to define the scope of the pen test. This includes
    the deliverables, meaning the list of reports that will be made available after
    the test is completed. You should also include the data definitions or the format
    that the test results will take. You''ll also want to define the functionality,
    verify whether the system works as expected, and the technical structure, which
    could include flow diagrams to show the processes and steps you went through during
    the test.'
  mdcn: '这种被称为双重视角的方法，能够同时从开发者和攻击者两个角度对完整系统进行检查。因此，我们既可以从外部发起攻击，也可以通过模拟心怀不满的内部员工发起攻击的方式开展测试。你可以采取几种不同的测试策略。

    首先，你可以采用公开通知策略。在这种策略下，渗透测试人员需要先全面了解组织的整体基础设施，同时还会被授予物理访问权限。这种方式的问题是，由于测试已提前告知目标方，因此对网络运营造成的影响较小。

    而针对未公开通知的策略，其优势在于既可以测试安全人员的安全知识掌握水平，同时也能检验组织的社会工程学攻击防御能力。采用未公开通知策略时，只有最高管理层知晓测试的存在以及测试的计划排期，服务台、基础设施团队、应用团队等常规IT人员完全不知道测试将在何时开展。这种方式往往会产生更显著的影响，同时需要制定严格的流程来明确待执行的具体操作。实施未公开通知策略的核心目标是测试基础设施的安全警觉性，以及IT人员的应急响应速度。

    ## 第5章 渗透测试

    ### 阶段1：前期沟通

    渗透测试的第一阶段也被称为前期沟通阶段，这一阶段的核心目标是尽可能多地收集目标相关信息。这类信息可以通过扫描、踩点等技术手段获取。你必须明确测试边界，这是你首先要确定的内容，但就像军事行动一样，渗透测试也有交战规则。例如，军事人员除非遭到攻击，否则不得开火；即使看到有人携带武器，也不意味着可以直接射击。具体规则取决于他们所参与的战争类型，每场战争都有各自独立的交战规则，渗透测试也是如此。

    你正在申请开展渗透测试的正式授权，在交战规则中，你可以明确是否开展技术类或非技术类活动，这些活动会由交战规则明确定义。开展渗透测试的安全专业人员可能会被授权实施一些通常被视为非法的操作。

    需要纳入交战规则的内容包括：你被允许测试的IP地址范围，不得超出该范围开展测试；测试开展的时间，比如是否仅限工作时间开展，还是包含非工作时间。你可能会有疑问：“渗透测试可以在任何时间开展吗？”
    答案是肯定的，但具体时间取决于你的模拟场景：例如，模拟内部的灰盒攻击可能严格限定在工作时间内开展。

    你还需要整理客户或部门列出的受限主机清单，如果你看到清单外的IP地址，不要对其进行任何操作！你还需要列明允许使用的测试方法，比如社会工程学、拒绝服务攻击，以及将使用的工具，比如密码破解工具、网络嗅探器等。举例如下，如果使用Nmap工具，需要明确是使用激进的Nmap扫描模式还是隐匿的Nmap扫描模式？

    你还需要明确测试周期，根据测试内容或双方协商的结果，部分渗透测试可能需要耗时2到3个月才能完成。同理，渗透团队的所有成员都需要指定紧急联系人，用于紧急情况对接。你还需要列明相关风险防控措施，避免测试引发的虚假警报导致执法部门介入，尤其是涉及物理测试的场景。交战规则还需要包含你所收集信息的处理方式。

    对企业开展渗透测试的前提条件之一是，企业需要向你提供一台专用测试笔记本。这台笔记本不会归你所有，但你可以将其用于渗透测试全程，包括撰写报告。渗透测试完成后，你需要将该笔记本连同操作说明一并返还给企业，企业会将这台笔记本留存，用于后续可能的渗透测试跟进工作。这样你就不会被指控将企业信息存储在你的个人设备中。

    技术更新迭代非常快，如果这台笔记本被存放5到6年，很可能已经过时无法使用。因此，你也可以建议客户将电脑的硬盘拆出单独存放，仅存储硬盘，并确保数据存储在极其安全的位置。

    你需要整理客户的全部需求，以及访谈过程中收集到的所有信息，确保你可以满足客户的所有需求。你需要和需要接受测试的客户或部门逐一核对，涉及的对象包括服务器、工作站、路由器、防火墙、网络设备、数据库、应用程序、物理安全、电信系统、语音系统等。你还需要创建一份需求核对清单，明确客户要求你对上述特定对象实施的测试内容。

    你还需要明确待测试的业务领域并梳理相关用户，例如你可能只需要针对IT部门这类特定部门开展测试，你需要提前告知这些部门的相关人员，未来1周左右可能会开展相关测试。

    你还需要明确测试的时间范围，但必须确保该时间范围符合客户的要求，除非客户主动征询你的建议，否则不要以你认为的最优时间为准。你还需要制定应急预案，以应对你发现真正的恶意攻击者已经入侵的情况。遇到这类情况时，你需要在开展任何操作前确保所有信息已安全备份，因为你实施的某些操作可能会修改原始文件。

    你还需要确定报告将使用的格式，是使用标准的Word文档？还是需要PDF格式？客户需要看到哪些内容？报告内容是否需要根据查看者的不同有所区分？例如，IT部门的管理者可能不想看到所有事件细节，只需要看到需要他处理的相关问题，以及报告交付的相关责任人。你在此处需要格外谨慎，因为很多时候，在评估IT人员的工作并提交报告时，报告内容需要具有建设性，而非讥讽性质，且需要以客观真实的形式交付。提交这份报告的安全专业人员需要意识到，这可能会引发对方的负面情绪，无论你是否情愿，都必须如实上报所有发现。

    为了梳理好所有内容，你需要开始列清单。以下是你可以在核对清单中包含的部分内容：

    - 网络拓扑和子网，包括正在使用的IP范围；

    - 服务器、网络设备以及建筑本身的物理安全（例如，未授权人员是否可以进入办公区域并访问空闲的RJ45网络接口）；

    - 内、外部IP地址；

    - 网络设备，包括路由器、交换机、防火墙、无线接入点、无线局域网控制器，以及各类设备的数量；

    - 终端设备，包括无线和有线主机设备，如笔记本电脑、台式电脑；

    - 打印机、扫描仪、监控摄像头、门禁安全机制、会议室设备（如投影仪、IPTV设备）、IP电话、会议IP电话，以及连接到网络的所有移动设备，包括手机、平板电脑、Apple
    Watch和Android手表；

    - 组织的互联网资产分布图，展示从外部可访问的内容，以及连接到外网和内网的设备地址；

    - 网络服务器上运行的操作系统：如果服务器数量在5台及以下，需记录各类操作系统的类型（Windows、Linux等）和各自的数量；如果服务器数量更多，需确认总数量和各类操作系统的分布情况；

    - 无线网络、模拟系统和移动设备的评估要求，尤其针对拥有移动办公人员的组织；

    - 客户提供的Web应用和服务，包括面向公众的网站功能，比如跳转至外部站点的重定向链接、网站内嵌的外部来源内容。


    接下来，你还需要明确渗透测试的范围。这部分内容包含交付物，即测试完成后会提供的报告清单。你还需要明确数据定义，或测试结果将采用的格式。你还需要明确功能验证要求，确认系统是否按预期运行，以及技术架构相关的内容，这部分可以包含流程图，展示测试过程中实施的操作和具体步骤。

    '
