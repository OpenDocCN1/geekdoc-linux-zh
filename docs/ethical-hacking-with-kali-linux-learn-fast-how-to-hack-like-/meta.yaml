    因为mutillidae.com网站包含大量表单，当你爬取该应用时，Burp Suite会弹出一个对话框，要求你手动输入凭据来更改这一默认行为，因此你需要点击「爬虫」选项卡，再选择「选项」选项卡。你会看到默认选中了「引导提示」选项，请将其更改为最后一个选项，因为你接下来可以使用「智能SQL注入字符串」。

