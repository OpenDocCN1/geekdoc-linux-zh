  md: '# Chapter 18 ARP Poisoning with EtterCAP


    Imagine that you have been assigned to carry out a MITM (Man in the Middle) attack
    against a specific host or server, and the choice of tools to use are up to you.


    There are multiple ways to carry out a MITM attack, and in this chapter we are
    going to use another excellent tool that you might consider called EtterCAP.


    EtterCAP is another great way of going about MITM attack as it has user friendly
    Graphical User Interface or GUI that provides a so called click, select and go
    method.


    It''s always better to have more knowledge on additional tools if they wouldn''t
    work or wouldn''t have access at the time of yo uare assigned to do pen testing.


    You should be aware that in order to achieve the same result, there are other
    options that you can go for. EtterCAP is another built in tool on Kali Linux platform.
    To launch EtterCAP, you can issue a command:


    ```

    "ettercap –G"

    ```


    Then press enter. Once EtterCAP is launched, it will wait for us to provide further
    instructions, and you should first click on a menu option: Sniff > then choose
    "unified sniffing".


    Next, you should specify the network interface that you will use for sniffing.
    In my case it''s ethernet0.


    This will create some additional menu options, so now you should click on the
    menu option: "Host", then click on "Scan for hosts".


    This should take no longer 5 seconds to discover all hosts that are on the same
    network. Once complete, go back to the menu icon; Host > then click on host lists
    in order to see all the hosts IP Addresses and the MAC addresses associated to
    them.


    Once ou have a list of hosts, you can highlight the source address and click on
    "Add to target 1", then highlight the destination address and click on "Add to
    target 2".'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'The method we use is called ARP POISONING.


    ARP stands for Address Resolution Protocol. Routers, Layer 3 Switches have ARP
    entries or ARP tables that contains all IP Addresses and their associated Mac
    Addresses or Physical Addresses that are connected to the network.


    Yet, if we use ARP Poisoning, we could fake the real source address by telling
    the destination that we have the IP Address and the Mac address of the source
    node, so all traffic that is planned to reach the real source host, from now on,
    would first come to us.


    In addition, all traffic that is planned to reach the destination host would come
    to us as well, as we would also poison the real source and tell it that the destination
    IP Address and Mac address is now our machine.


    Using ARP Poisoning is one of the best method to create a Man in the Middle attack
    as now all traffic that is going back and forth between the source and the destination
    is actully coming through us.


    Having all those traffic captured, we can decide if we just want to analyse it,
    other then capture it, modify it, forward to a different destination, or simple
    stop the communication between those devices.


    Therefore, the final piece to launch such an attack is to click on the menu icon
    called "MITM" and then select "ARP poisoning". Once you finished and want to stop
    ARP Poisoning, click on "Stop MITM attack(s)".


    Lastly, I will ask you again to make sure that you have written authorization
    for using this method in a live or production environment, as any type of Man
    in the Middle attack is very dangerous, especially when you manipulate routed
    traffic through poisoning the ARP tables by feeding fake Mac addresses.


    If you are only practicing in your home lab, in a non production environment,
    that should cause no issue to anyone; still I would suggest you turn off your
    router and practice with care without any connection to the internet.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# # Chapter 19 Capturing Traffic with Port Mirroring


    For all computer connected to the network to process ARP broadcast packet would
    be a waste of resources. Instead, the network interface cards of the devices on
    the network for whom the packet is not destined, recognize that the packet is
    not for them, so the packet is discarded, rather than being passed to the CPU
    for processing.


    By using promiscuous mode, you can ensure that all the traffic is captured. When
    operating in promiscuous mode, the network interface card passes every packet
    it sees to the host processor, regardless of the addressing.


    Once the packet makes it to the CPU, it can be grabbed by the tool called Wireshark
    for analysis. There are three primary ways to capture traffic from a target device
    on a switched network.


    The first one is ARP poisoning, or Man-In-The-Middle attack, which I just shared
    with you in the previous chapter using them both in conjunction.


    The second method to capture traffic from a target device on a switched network
    is by using a tap. Also known as a "Network Tap" which is a hardware device that
    you can place between two end points on your cabling system to capture traffic
    between them.


    The third method is Port Mirroring. Port Mirroring or port spanning, is perhaps
    the easiest way to capture the traffic from a target device on a switched network.


    In this type of setup, you must have access to the command line or web management
    interface of the switch on which the target computer is located.


    Likewise, the network switch must support mirroring and have an unused port in
    which you can plug in your sniffer. You can set up Port Mirroring on most Cisco
    switches once you have connected to it, using either "SSH" or a console cable.


    To enable port mirroring, you issue a command that forces the switch to copy all
    traffic on one port to another port. But first, you should list the ports on a
    switch by issuing the command


    ```

    "show ip interface brief"

    ```


    If you''re not familiar with the Cisco switch commands, no worries too much'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'as we only going to look at a simple example. Once you have listed the available
    Ethernet ports, let''s say that you want to install your sniffer on port 2 and
    forward all the traffic from port 1 to port 2.


    To begin the configuration commands, you first issue the command


    ```

    "configure terminal"

    ```


    of just


    ```

    "conf t"

    ```


    Then press enter. Next, you need to specify the source port, which is port 1 for
    our example, so you start your command by typing "monitor", followed by a random
    session number.


    The session number could be any number of your choice, and then you specify that
