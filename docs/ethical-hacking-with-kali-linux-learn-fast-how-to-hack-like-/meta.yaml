  md: 'To understand Linux, the leading operating system of the cloud, Internet of
    Things, DevOps, and Enterprise server worlds it is substantial to an IT career.


    To comprehend the world of open software licensing is not easy, but let me give
    you some highlights. If you''re planning to work with free software like Linux,
    you should understand the basics of the rules that govern it.


    Let''s first look at licensing. There are three main methods to licensing; the
    Free Software Foundation founded in 1985 by Richard Stallman, the younger Open
    Source Initiative, and Creative Commons.


    First of all, the Free Software Foundation wants software to be free, not as free
    of charge, but to allow users the freedom to do whatever they like with it. Think
    about it like this.


    You may have to pay for it, but once it''s yours you can do whatever you want
    with it. Richard Stallman and his foundation are the original authors of the GPL,
    and the GNU General Public License, which allows users the right to do whatever
    they like with their software, including modifying it and selling it, as long
    as they don''t make any changes to the original license conditions.


    The Linux kernel is the most significant piece of software released onto the GPL.
    But, the Open Source Initiative, while cooperating with the free software foundation
    where possible, believes that there should be more flexible licensing arrangements
    obtainable if open source software is to achieve the greatest impact possible
    on the larger software market.


    Open source means that the original programming code of a piece of software is
    made freely obtainable to users, along with the program itself.


    Licenses that are more closely line up with the OSI goals but include various
    versions of the Berkeley Software Distribution aka BSD, which oblige little more
    than the redistributions display the original software''s copyright notice and
    disclaimer.


    This makes it easier for commercial developments to deploy their modified software
    under new license models without having to concern about breaking previous measures.


    The FOSS and FLOSS designations may support to reflect the alterations between
    these two visions. FOSS only implies that the software can be acquired free of
    charge, although FLOSS focuses on what you can do with'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'the software once you obtain it.


    The Creative Commons license authorises creators of nearly anything such as software,
    films, music, or books to select exactly the rights they wish to reserve for themselves.


    Under the Creative Commons system a creator can hand-pick between any combination
    of the following five elements; attribution, which allows modification and redistribution
    as long as the creator attribution is included; share-alike, which necessitates
    the original license conditions to be included in all future distributions and
    copies.


    Next is called "non-commercial", which permits only non-commercial use; no derivative
    works, permitting further redistribution, but only unmodified copies; and public
    domain, which allows all possible usage.


    It''s essential when using software released under the Creative Commons to be
    aware of exactly which elements have been selected by the author. The creative
    commons share-alike condition, along with Stallman''s GPL are in practical terms,
    related to the copy left distribution system.


    Copy left licenses permit full recycle and redistribution of a software package,
    but only when the original substantial permissions are included in the next level
    distribution.


    This can be valuable for authors who don''t want their software to ever evolve
    into closed license types, but want its derivatives to remain free forever. Non-copy
    left open source licenses are frequently referred to as permissive licenses.


    Permissive licenses will typically not require adherence to any parent restrictions.
    Instances of such licenses that often allow just about any use of the license
    software, as long as the original work is attributed in derivatives, are the MIT,
    BSD, and Apache licenses.


    Nowadays, pretty much Apache and MIT are the ones most widely utilised. But because
    open source software is free, doesn''t mean that it has no place within the operations
    of "for-profit" companies.


    In fact, the products of many largest and most profitable Companies are built,
    using open source software. In many cases, Companies will freely release their
    software as open source, as well as providing premium service and'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'support to paying consumers.


    For example Ubuntu and CentOS Linux distributions are of that model, because they''re
    supported by Canonical and Red Hat consistently, and both of which are in the
    business of providing support for enterprise clients, and these are very serious
    businesses.


    Another example is Red Hat Linux, which was purchased by IBM for over $30 billion.
    It''s worth noticing that the mainstream of programming code contributions to
    the Linux kernel are being written by full-time staffs of large technology companies,
