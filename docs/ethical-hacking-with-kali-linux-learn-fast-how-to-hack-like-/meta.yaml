- md: '## Chapter 23 MITM Attack with Ettercap


    In this chapter we''re going to discuss how to use Ettercap to capture credentials,
    specifically usernames and passwords from a target using HTTP and FTP. This is
    possible if the target is using two unencrypted protocols such as HTTP and FTP.
    In the setup we have a Linux and a Windows 10 system, and we''re going to use
    Ettercap to put ourselves in the middle between the default gateway which is the
    Windows host machine. To get the default gateway address you have to type in a
    terminal:

    ```

    ip route

    ```

    In my case the default gateway is 192.168.100.1, but whatever address you have,
    this is the main information that you need to know for Ettercap to work. Technically
    you can put yourself between everybody on a subnet and the default gateway or
    an individual target if you want to. In this scenario we''ll put ourselves between
    everyone and the default gateway.


    First within Kali Linux, go to "Applications", then scroll down and select "Sniffing
    and Spoofing" then select "Ettercap-g". This is the GUI for Ettercap. Once the
    GUI is open, select "sniff" then select "unified sniffing" and this will bring
    up the next window.


    In the new window that is now open called "ettercap Input" it will ask you what
    network interface you want to sniff on. There is only one NIC, or network interface
    card, on our Kali machines which is used for unified sniffing. Therefore whatever
    interface is shown, you should go with that, so select "ok".


    Next, before we put ourselves in the middle with Ettercap, we have to configure
    the target. To do this, select "hosts" then "scan for hosts". This will scan the
    subnet that your target is located in. You can only put yourself in the middle
    on a given subnet with "arp poisoning", which is what we''re going to use. Once
    the scan is completed, go back and select "hosts", then "hosts list" and in the
    new window, you should see IP addresses that the previous scan found. Here, you
    should also find the IP address of your default gateway, which in my case is 192.168.100.1.


    Now you have to create targets, so if you click on the IP address of 192.168.100.1
    or whichever IP address is your default gateway, then select "Add to Target 1".
    Next, if you have more IP addresses listed that you want to target, once again,
    you can highlight them by clicking on them, and then click on "Add to Target 2".


    Once you have selected your targets, go to the top window, then select "Mitm"
    which refers to "man in the middle", then you can select "arp poisoning". Once
    you have selected these, a new window will pop up, and you should tick "Sniff
    remote connections" and click "ok".


    If you are in the middle, or I should say if the Kali Linux machine is in the
    middle between the Windows 10 machine and the default gateway, the MAC address
    for IP address 192.168.100.1 should be the MAC address of the Kali Linux machine.
    To verify that, you should go to the Windows 10 machine''s command line, and type:

    ```

    arp -a

    ```

    Arp stands for Address Resolution Protocol, and what it does is that it translates
    MAC addresses to IP addresses. Once you use that command on Windows, you should
    see a list of IP addresses and next to each their associated MAC addresses. By
    the way, make sure you are not confused, as Windows references IP addresses as
    "Internet Addresses" and references MAC addresses as "Physical Addresses". As
    you can see, "Physical Addresses" is technically incorrect because using Ettercap
    you just changed the MAC address of your default gateway, but to be 100% sure,
    you can also verify the Kali Linux MAC address. To do that, go back to Kali Linux
    terminal, and type:

    ```

    ifconfig

    ```

    And within the output this command shows you, search for the term "ether" which
    references the MAC or "physical address" of your Kali Linux Ethernet address.
    Once you have verified that the Kali Ethernet address is the same as the Windows
    default gateway, you know that you are in the middle with Ettercap.


    Now the good thing about Ettercap is that when you''re in the middle, that''s
    pretty much all you have to do: run it. Within your Ettercap window, down at the
    bottom if it sees any credentials passed in clear-text, it''ll capture them to
    that window. Within the Ettercap window you will see the username next to "USER"
    and the password next to "PASS". It will just pop up on the left side automatically,
    so you don''t have to do a whole lot. For example you don''t have to sit there
    and look at all the traffic like with Wireshark, as both the username and password
    just pop up.


    Ettercap captures any username and password if unencrypted protocols are used,
    therefore instead of HTTP, HTTPS should be used, whereas instead of FTP, you should
    use SFTP, or SCP to transfer files. The end user never notices while you are in
    the middle because there are no warning banners that pop up to the user, so they
    won''t notice if you do a layer 2 man-in-the-middle attack with Ettercap.


    Lastly, I will ask you again to make sure that you have written authorization
    for using this method in a live or production environment, as any type of Man
    in the Middle attack is very dangerous.


    ## Chapter 24 MITM Attack with SSLstrip


    In this chapter I''m going to teach you how to create a fake access point on a
    Kali Linux virtual machine. To complete this attack you will need to have a USB
    network adapter that supports both monitor mode and master mode. If you don''t
    have a USB network adapter that supports these networking modes, the network adapter
    that I highly recommend is the Alpha that I have talked about earlier. It only
    costs about $50 and you can pick one up from Amazon as well as a few other places.


    Before we begin, I want to explain how this attack works. To illustrate it, let
    me give you a high-level overview of how this attack works. The main components
    include the victim, the attacker, the fake access point and a router with an internet
    connection. What''s happening is the attacker is connected to the Internet, and
    the attacker is going to share that internet connection through a USB network
    adapter which is acting as a fake access point. When someone connects to that
    fake access point, they''ll be able to access the Internet.


    Let me walk you through this process. The first thing that''s going to happen
    is the victim is going to connect to the fake access point, then the victim''s
    internet traffic will be routed through the fake access point into the attacker.
    Once the attacker obtains the victim''s Internet traffic, the attacker will manipulate
    and log the victim''s internet traffic with SSL strip and this is going to allow
    the attacker to force the victim to use HTTP, which as a result is also going
    to allow the attacker to capture any usernames and passwords that the victim enters.
    Once SSL strip is finished manipulating and logging the victim''s internet traffic,
    the attacker will forward the victim''s internet traffic to the router. Finally,
    the router will route the victim''s Internet traffic to whatever website the victim
    is attempting to communicate with. What we do here is that we place ourselves
    between the victim and the website, so as a consequence, we can see any interactions
    that are occurring between the victim and the website, and this is also referred
    to as a man-in-the-middle attack.


    That concludes the explanation, so let''s go ahead and get started with the attack.
    The first thing that we need to do is connect to the internet, and we''re going
    to accomplish this by sharing our host operating system''s internet connection
    with your Kali Linux virtual machine. This is essentially a bridged or a wired
    network connection, and I''ve chosen to do it this way so I can eliminate the
    need for a second USB network adapter, but keep in mind if you do have a second
    USB network adapter, you can use it to connect to the internet directly from your
    Kali Linux virtual machine. Instead, I am going to use the method that I''m about
    to share with you.


    Let''s go ahead and log on to our host operating system. It does not matter what
    type of computer you are running your Kali Linux virtual machine on as long as
    you can use it to connect to the Internet. First, go ahead and open the network
    settings or whatever network management application your operating system uses.
    I can access mine from the top menu bar, and then let''s find a wireless network
    to connect to. Keep in mind you can connect to any network that you''d like to
    as long as it has an internet connection, and if you''re mobile you can tether
    to your Android or your iPhones that use a 4G USB modem, a mobile hotspot, or
    whatever means of an internet connection you have.


    Once connected to the internet on your host operating system, you need to share
    it with your Kali Linux virtual machine. So now, go ahead and move over to our
    Kali Linux virtual machine, and in the top menu bar you need to open the virtual
    machine menu, and then expand the network adapter menu. If you have multiple network
    adapters, use the one at the top. It should be called "Network Adapter" and it
    should not have any numbers following it. Here, we need to make sure that we''ve
    set our network adapter to use bridged auto-detect, and this is going to allow
    us to obtain an IP address and an internet connection from the router that our
    host operating system is connected to. Once you''ve made that setting, you can
    go ahead and allow the virtual machine menu to collapse, and now we can use that
    virtual network to establish an internet connection.'
