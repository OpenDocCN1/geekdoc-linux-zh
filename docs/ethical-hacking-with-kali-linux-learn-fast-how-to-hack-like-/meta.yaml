- md: '## Chapter 19 Capturing Traffic with Port Mirroring

    For all computers connected to the network to process ARP broadcast packets would
    be a waste of resources. Instead, the network interface cards of the devices on
    the network for whom the packet is not destined recognize that the packet is not
    for them, so the packet is discarded rather than being passed to the CPU for processing.
    By using promiscuous mode, you can ensure that all the traffic is captured. When
    operating in promiscuous mode, the network interface card passes every packet
    it sees to the host processor regardless of the addressing. Once the packet makes
    it to the CPU, it can be grabbed by the tool called Wireshark for analysis.


    There are three primary ways to capture traffic from a target device on a switched
    network:

    - The first one is ARP poisoning, or Man-In-The-Middle attack, which I just shared
    with you in the previous chapter, and can be used in conjunction with other methods.

    - The second method to capture traffic from a target device on a switched network
    is by using a tap, also known as a "Network Tap", which is a hardware device that
    you can place between two endpoints on your cabling system to capture traffic
    between them.

    - The third method is Port Mirroring or port spanning, which is perhaps the easiest
    way to capture the traffic from a target device on a switched network.


    In this type of setup, you must have access to the command line or web management
    interface of the switch on which the target computer is located. Likewise, the
    network switch must support mirroring and have an unused port in which you can
    plug in your sniffer. You can set up Port Mirroring on most Cisco switches once
    you have connected to it, using either SSH or a console cable. To enable port
    mirroring, you issue a command that forces the switch to copy all traffic on one
    port to another port. But first, you should list the ports on a switch by issuing
    the command:

    ```show ip interface brief

    ```

    If you''re not familiar with the Cisco switch commands, don''t worry too much,
    as we are only going to look at a simple example. Once you have listed the available
    Ethernet ports, let''s say that you want to install your sniffer on port 2 and
    forward all the traffic from port 1 to port 2. To begin the configuration commands,
    you first issue the command:

    ```configure terminal

    ```

    or just:

    ```conf t

    ```

    Then press enter. Next, you need to specify the source port, which is port 1 for
    our example, so you start your command by typing "monitor", followed by a random
    session number. The session number could be any number of your choice, and then
    you specify that it''s a source, and finally you enter the port number. Then you
    type the destination port number, and this is where your sniffer is sitting. Use
    the same command with the same session number, but this time it''s a destination
    and the port number is 2. The commands you want to type are as follows:

    ```conf t

    ```

    ```monitor session 1 source interface GigabitEthernet1/0/1

    ```

    ```monitor session 1 destination interface GigabitEthernet 1/0/2

    ```

    ```exit

    ```

    ```exit

    ```

    ```write memory

    ```

    To verify your monitoring session, you can type the command `show session` followed
    by the session number, in this case 1, as follows:

    ```show session 1

    ```

    The output will show you that the source port is GigabitEthernet number 1, and
    the destination port is GigabitEthernet number 2. After these steps, all traffic
    will be forwarded from port 1 to port 2.


    ## Chapter 20 Passive Reconnaissance with Kali

    Anybody can listen to the wireless signals that are going over the air. When you
    listen to wireless signals, you can tune your radio to listen for specific traffic
    that''s going to and from a client, or to and from an access point, or you can
    just listen to everything and then filter out what you want to listen to at a
    later time. Just like if you put your hand up to your ear to help you hear better,
    or maybe a glass up to the wall to hear the conversation on the other side of
    the wall, with wireless, you can use a directional antenna to collect more signal
    strength from a given direction. What that means is that I can be some distance
    away from the access point or from your client, and still be able to capture traffic
    over the air. What that means is that you don''t know that I''m eavesdropping
    on your traffic.


    But how can I listen and capture traffic? Well, I listen by tuning my radio to
    the frequency channel, collecting all of the signals, processing those signals
    up through my protocol stack, and then displaying them with a packet analyzer
    tool such as Wireshark. Listening over the air is one of the best ways to do passive
    reconnaissance. Passive reconnaissance is when you''re gathering information about
    a network, corporations or an individual, but you''re not actively engaging with
    the system, the network or with the individual. You might be gathering information
    such as: what is the manufacturer of their access points? What are the MAC addresses
    that are being used by the clients? What security mechanisms does a particular
