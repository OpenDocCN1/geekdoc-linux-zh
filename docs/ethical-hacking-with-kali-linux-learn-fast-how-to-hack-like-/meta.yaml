  md: '# Chapter 21 Capturing SYN Scan Attack


    The TCP SYN Scan relies on the 3-way handshake process to determine which ports
    are open on a target host. The attacker sends a TCP SYN packet to a range of ports
    on the victim, like it''s trying to establish a channel for normal communication
    on the ports.


    When a SYN scan is executed, the attacker will be looking for three states. Either
    the port is open, closed, or filtered. Normal TCP handshake works like this.


    First, a SYN packet will be sent, then the server will reply with a SYN/ACK and
    finally, the client will send an ACK packet.


    Now let''s take a look at the Open Port scenario. If a service on the victim''s
    machine is listening on the port, that receives the SYN packet, and it will reply
    to the attacker with a TCP SYN/ACK packet, and then the attacker knows that the
    port is open and a service is listening on it.


    For the Closed Port scenario, if no service is listening on a scanned port, the
    attacker will not receive a SYN/ACK packet. Depending on the configuration of
    the victim''s operating system, but the attacker could receive a reset packet
    in return, indicating that the port is closed.


    Lastly, for the Filtered Port scenario, the attacker may receive no response at
    all. That could mean that the port is filtered by an intermediate device, such
    as a firewall, or the host itself.


    On the other hand, it could just be that the response was lost in transit. In
    this scenario, imagine that you have three hosts; the attacker which is going
    to use Kali Linux at 10.0.0.111, the victim machine will be a Windows 10 host
    at 10.0.0.202, finally the penetration tester will use Kali Linux to intercept
    all the traffic and analyse any attacks on the network.


    Imagine yourself that you are the attacker. First, the hacker is going to execute
    a port scan against your victim Windows 10 machine, and he is going to use nmap
    to scan the Windows host at the IP address of 10.0.0.202. The command will be
    used here is:


    ```

    "nmap 10.0.0.202"

    ```


    From the attacker perspective, the scan is complete, but he doesn''t know that'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'a penetration tester is listening at this moment on the network.


    If you switch to the penetration tester machine and try to catch this intruder,
    the best ways to understand the scope of a scan is to view the conversations window
    in Wireshark.


    Up in the Wireshark menu, select the "Statistics" item, then click on "Conversations",
    and then select the "IPv4" tab.


    There, you should see only one IPv4 conversation between the attacker at the IP
    address of 10.0.0.111 and the victim at the IP address of 10.0.0.202.


    You will also see that there are thousands of TCP conversations between these
    two hosts. Basically, a new conversation for every port involved in the communications,
    which is a lot.


    Once understanding the different types of responses a SYN scan can produce, the
    next logical thought is to find a fast method of identifying which ports are open
    or closed.


    The answer lies within the conversations window. Once again, click on the "TCP"
    tab. In that window, you can sort the TCP conversations by "packet number" with
    the highest values at the top, by clicking the "Packets" column twice.


    Then you should click on "scanned ports" and include 3 packets in each of their
    conversations. You can take a look at the details of the first packet in the list
    by clicking on the "Follow Stream" button, then close this window, and minimize
    the conversations window.


    Back in the main window of Wireshark, you should see the initial SYN packet sent
    from the attacker machine, and then the corresponding SYN/ACK packet from the
    victim''s host and the final reset packet sent from the attacker''s host to end
    the conversation.


    If you switch back to the "Conversations" window, you can also have some other
    scenarios where only 2 packets involved in the communication.


    If you check the details again, check the first initial SYN packet and the second
    that is the reset from the victim, which indicates that this port is closed.


    If the remaining entries in the "conversation" window include only one packet
    that means that the victim host never responded to the initial SYN'
