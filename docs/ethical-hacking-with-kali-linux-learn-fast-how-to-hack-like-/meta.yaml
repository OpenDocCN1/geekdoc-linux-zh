    ## Chapter 7 Pen Testing @ Stage 3

    If you think that the pre-attack steps or the actual attack steps are the most
    important, well that''s technically not true. The most critical steps are at the
    post-attack stage because you are doing this, from an offensive point of view.
    It''s the responsibility of the pen-tester to clean up their mess. You are going
    to have to ensure that you return the systems to their pre-test state. You do
    not just make a mess and leave. Therefore, you should remove any files that you
    uploaded, any data that you make modifications to; you''ll ensure that you restore
    those as well as any settings that you may have changed. This is also one of the
    reasons why it''s vital to document each step along the way. You also must undo
    any privileges or user settings if you''ve done any privilege escalation. You
    also must ensure that you restore the network you have made changes to either
    within DNS or any IP addresses. In summary, you must recreate the very same network
    state as it was before you walked in. If you''ve gotten into the registry in any
    way whatsoever on any system, you must ensure that you return those to their same
    settings as well. Sometimes you might even create different shares and connections,
    so you must undo those, and you''ll also have to ensure that you document all
    the logs that were captured, as well as entries that were modified. After that,
    you''ll have to analyse the results, and instead of creating problems, you have
    to develop solutions. Once you have done all that, you have to present that documentation
    to your client, while you must identify critical system and critical resources
    that are at risk, and come up with a prioritized list of what needs to be modified
    first.


    ## Chapter 8 Penetration Testing Standards

    The different ways that you do pen-testing will depend on the methodology that
    you decide to use. There are many standards out there. Let''s cover some of those,
    so that you can learn which one suits you best. Let''s first begin with the OSSTMM,
    which stands for Open Source Security Testing Methodology Manual. This standard
    set of penetration tests is designed to achieve a high-security matrix. In summary,
    this is considered to be the standard for some highest level of testing.


    There''s another one called OWASP, which stands for Open Web Application Security
    Project. OWASP is an open-source methodology, includes numerous tools that can
    help you plenty, and it also has a knowledge base, as well as a tool that is called
    the ZAP or the Zed Attack Proxy Project. ZAP is a tool that can automatically
    help you find vulnerabilities in web applications. ZAP is designed for web developers,
    but pen-testers can use this tool as well.


    There''s also another framework called ISSAF, which is the Information System
    Security Assessment Framework. ISSAF is also an open-source project on how to
    conduct a pen-test. ISSAF is supported by a group called the public information
    system security group.


    Another standard that you should look at is called NIST, which stands for National
    Institute of Standards and Technology. When it comes to NIST, you should know
    that the federal technology agency works with the industry to develop and apply
    technologies, measurements, and standards.


    We also have LPT, which stands for EC-Council''s Licensed Penetration Tester.
    This one is a proprietary methodology, and there is another one from McAfee, which
    is called Foundstone and also has ISS, which is done by IBM. When it comes to
    IBM, they do their testing for you. They also had a signature-based product called
    the Proventia, which is now discontinued. This was a multifunction security appliance
    and offered numerous different services to help secure or test your network environment.


    The same thing goes for McAfee and Foundstone too. It''s technically owned by
    Intel. EC-Council''s LPT requires the examiner to go through numerous different
    steps, similar to the CEH. You have to go through a course, go through an application
    process, which includes a $900 fee, and they will provide access to EC-Council''s
    Aspen environment. They do a pen test in a test environment, and they have 30
    days to submit their report to EC-Council.


    With each of these, whether it''s the open-source or the proprietary versions
    of these methodologies, all of them are similar to one another. Each one of the
    methods will help you cover all your bases. They all start with an information-gathering
    stage, which we''ve talked about earlier. It''s all about going out and finding
    as much information as you can about the target or the company, whether that''s
    from public sources, newspapers, internet articles, blogs or third-party data
    sources. You then have to go through an external pen test, and you are looking
    for vulnerabilities that are accessible from the outside. Next, you would look
    at a vulnerability analysis so you can find weak points based on software, operating
    systems, or machines. After that, you would do an internal network penetration
    test to see what type of information is exposed from the inside. You then go through
    the firewall penetration testing. This is your primary line of defense from the
    outside world, but you would also do testing from the DMZ. As a side note, DMZ
    stands for Demilitarized Zone, sometimes referred to as a perimeter network or
    screened subnet. Next, you must verify that the IDS is doing what it''s supposed
    to do, that detects intrusions. As a pen-tester, you are going to be looking to
    see if any vulnerabilities would allow the attacker to get around the settings
    of the alarms that are configured on these systems. Next, password cracking methods
    can be used to identify weaknesses associated with password management. This helps
    you to ensure that you''re not prone to brute-force attacks, hybrid attacks or
    dictionary attacks.'
