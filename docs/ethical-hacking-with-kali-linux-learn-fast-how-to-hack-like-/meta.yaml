    ## 渗透测试前期工具与流程概述

    ### 核心工具选择建议

    我之前提到过的nmap属于这类工具，但你需要了解，这些工具中有很多是多用途工具。你还可以使用另一款名为NetScanTools Pro的工具。你可能还有其他更偏好的工具，但你应该选定一款并精通其使用方法。同时，接触其他工具也很有必要，这不仅仅是为了积累经验或充实你的简历，还有其他原因。例如，一旦你开始使用这些工具，就会发现每款软件都有一定的局限性：某款工具擅长完成某类任务，另一款工具则可能能更好地帮你完成其他任务。我建议你在未来的学习以及实际渗透测试中都重点使用Nmap。Nmap是一款非常便捷且灵活的工具，在这个行业中，大多数道德黑客或渗透测试专业人员都对它青睐有加。


    ### 服务标识与操作系统指纹识别

    下一步是旗标获取，有时人们也将其称为操作系统指纹识别。通过开展旗标获取，你可以向系统发送单独的指令，系统会以特定的方式做出响应。我们知道Windows设备和Linux设备的响应方式各不相同，同一指令下不同操作系统的回复也存在差异，macOS也遵循同样的规律。这些响应可以识别出对应的操作系统，帮助你找到并利用与该操作系统相关的漏洞。可用于旗标获取的工具包括Telnet、SSH等。


    ### 网络漏洞扫描

    接下来你可以开始扫描漏洞。扫描网络漏洞时，你可以使用特定工具，不过你可能有自己的偏好，因此我先做一个简要介绍。网络漏洞扫描可选的优质工具包括：

    - Core Impact Professional

    - Retina

    - Microsoft Baseline Security Analyzer (MBSA)

    - GFI LanGuard

    你的目标是确定目标设备的安全弱点或漏洞。总结来说，一旦你确认目标是微软设备或Apache服务器，下一步就要找出可以对其利用的漏洞。这些工具可以帮助你判断哪些漏洞可行。到这一步你已经收集了大量信息，这部分会纳入文档记录，同时你还应该绘制出网络拓扑图。这能帮助你理解网络中各个节点之间的连接和路径，市面上有大量工具可以帮你轻松绘制网络拓扑图。


    ### 网络拓扑绘制

    用于绘制网络拓扑图的优质工具包括SolarWinds和Network Topology Manager。这些工具中部分免费，部分为付费产品。大多数企业都在使用SolarWinds，这款工具可用于多种场景。使用SolarWinds，你可以绘制网络拓扑图，可以实时向多台设备发送指令，如果符合你的偏好或需求，你也可以提前安排指令部署的日期和时间。你还可以将SolarWinds用于IP管理，以及网络中断、接口宕机等场景的告警。SolarWinds是付费软件，但功能十分出色，被企业用于各类场景。你的目标是获得可视化呈现，从而更清晰地了解各设备的位置以及彼此之间的连接关系。


    ### 代理配置

    当你完全识别出目标及其漏洞，并且已经绘制出网络拓扑图后，渗透测试的下一步就是启动代理。代理的作用是隐藏服务器来源，让客户无法判断攻击来自何处。你可以在内部和外部同时启动代理。可用于代理的优质工具之一是Proxy
    Workbench。Proxy Workbench拥有图形用户界面，基于TOR网络运行。另一款适用于Mac OS的产品名为proxifier。启动你选定的代理后，你会获得一份IP地址列表，你可以选择要使用的数量。部分代理是免费服务，你在谷歌搜索“free
    proxies”就能快速搭建代理链。无论你使用哪种代理，你也需要对其使用情况进行记录。


    ### 渗透测试文档记录

    文档记录是渗透测试最重要的步骤，它能帮你留存所有已开展测试的结果，还能帮你发现网络中的潜在漏洞，从而给出对应的应对措施建议。同时，你也需要向客户展示你是如何完成测试的，这也是证明你的操作及攻击者可能对该客户造成的影响的合理性的最佳方式。


    ### 信息枚举

    找到目标后，下一步是信息枚举。通过信息枚举，攻击者可以尽可能多地收集目标设备的相关信息。从这些系统中提取的报告应包含身份组、用户账户和服务账户信息，因为很少有人会关注这些内容。你还可以确定网络资源、网络共享文件夹或目标机器共享的其他文件。很多情况下，你还可以枚举出这些设备上安装的应用程序。枚举步骤基于侦察阶段收集的数据，但你也要注意枚举网络设备。网络设备包括：

    - 路由器

    - 交换机

    - 入侵检测系统

    - 入侵防御系统

    - 防火墙

    - 身份服务引擎

    - 无线局域网控制器

    等。

    作为渗透测试人员，你应该采用多种不同的枚举方法，确保你能从目标网络中可见的每一台设备上获取所有可能的信息。这样做的原因是确定企业网络的弱点和漏洞，核心目的是找出网络基础设施的缺口。


    #### whois查询与公网IP段定位

    你可以通过查找公司或目标的网络段来启动枚举步骤，你可以使用“whois”命令查询设备，从而查看它们在公网侧被分配了哪些网段。这里你会找到最重要的服务器，因为它们是公司的对客窗口，提供用户登录或获取公司信息的服务。


    #### 子网掩码计算

    拿到IP网段后，你需要计算子网掩码，这能帮你缩小ping扫描的范围，也能辅助你开展端口扫描。


    #### 公网主机发现

    计算出子网掩码后，下一步是发现互联网上公开可访问的主机。同样，首要推荐是使用nmap这类软件。你可以使用其他软件，但它们的可检测性可能更高。例如“Angry
