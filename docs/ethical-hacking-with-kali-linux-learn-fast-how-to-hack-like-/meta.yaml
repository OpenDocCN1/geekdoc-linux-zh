  md: '# # Chapter 14 Randomizing Sessions Tokens


    Session tokens are normally used for tracking sessions since by default HTTP is
    a stateless protocol. In this chapter, we are going to look at making sure that
    session tokens are properly randomized and they can''t be guessed.


    In this example, you can be testing the mutillidae.com site, a vulnerable web
    application, which is installed by default on the Linux metasploitable host.


    You can download the metasploitable virtual machine from sourceforge.net.


    The first thing you need to do is to generate some session tokens. Do you know
    when session tokens are generated and sent back to you from the server?


    Well, the server sends a session token when your browser does not send a balanced
    session as a request.


    To foul the web server for the first time, you should make your request by clearing
    the browser history and ensure that the cookies option is selected.


    Next, use Burp Suite to intercept the request.


    Refresh your page and go back to Burp Suite under the Proxy tab where you should
    see in your request that the session token is not present.


    Next, if you click on the forward button to send the request to the server, you
    will get a response with a cookie and a new session ID.


    Click on the forward button to send the remainder requests, and once you see a
    white screen, you know that your job is done.


    Click on the History tab and select one item from the list. You should see your
    first request header in the bottom section, so click on the Response tab and right
    click within the section, and send it to the sequencer.


    Once you click on the "Sent to sequencer", jump over to Sequencer tab and identify
    which session tokens are important to you.


    Once you pick your token, you can click the "Start live capture" to start generating
    session tokens. A new window will pop up and it will start processing and generating
    tokens.


    After finishing the live capture, you can start analysing the session tokens and
    Burp Suite will give you a summary of randomness of your session tokens.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'Besides this tool, you also have the corrector level analysis and bit level
    analysis.


    There are many other features within Burp''s sequencer tool, so I recommend spending
    some time trying to understand how session tokens are generated.


    All major web applications use different types of implementations and algorithms
    to generate session tokens.'
  merge: -1
