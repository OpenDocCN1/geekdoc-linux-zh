- md: 'The first thing to do when you log in to your new workstation. The CentOS installation
    program will ask you whether you want to set up a regular user for your system
    or if you''re fine with just the root user. While you''re not forced to create
    a regular user, to harden your security posture, it''s highly recommended that
    you avoid logging in as a "root" user for normal operations. As an alternative,
    logging in and getting your work done as a regular user who can, when necessary,
    invoke administration powers using sudo, is much better. Standard Ubuntu install
    processes for example won''t even offer the option of using root. You can always
    opt to go with the default approach for storage devices where in most cases the
    entire file system will be installed within a single partition, but you might
    want to explore other options for more complicated or unusual use cases. Many
    server admins prefer keeping the “/var” directory hierarchy isolated in a separate
    partition to ensure that system log data doesn''t overwhelm the rest of the system.
    You can use a small but fast SSD or solid state drive for most of the system files,
    while the larger “home” and “var” directories are mounted to a larger, but much
    slower hard drive. This allows you to leverage the speed of the SSD for running
    Linux binaries while getting away with a less expensive magnetic hard drive for
    your data, where the performance difference wouldn''t be particularly noticeable.
    You''ll be asked whether you want your storage devices to be managed as “LVM volumes”.
    But what is an “LVM volume”? Well, LVM stands for Logical Volume Manager, which
    is a way to virtualize storage devices, so they''re easy to be manipulated later
    on. But how does it function? Well, let''s imagine that you''ve got three separate
    physical drives on your system. LVM would turn them all into a single volume group,
    whose capacity equals the total aggregate space from all three drives. At any
    time you''ll be free to create as many logical volumes from that volume group
    as you''d like, using any combination of individual capacity, up to the total
    available volume. If your 3 drives were 2 TB, 500 GB, and 200 GB in size separately,
    and you needed to work with a data drive of at least 2.3 TB, you could use LVM
    to create 1 logical volume of 2.3 TB and a second volume of 400 GB for everything
    else. If your requirements change in the future, you can reduce the size of your
    data drive and transfer the extra data to the second volume, or to a new volume.
    Adding or swapping out volumes can be relatively simple operations. LVM can give
    you fantastic configuration flexibility, but for simple setups it''s normally
    not essential. Now that you''re aware of some of the theory, you can go ahead
    and jump right into Kali Linux installation, but before you do that I would like
    to recommend a few other software and hardware that you should get hold of as
    Pen Tester.


    ## Chapter 2 Software & Hardware Recommendations

    - Tcpdump https://www.tcpdump.org/

    - Microsoft Net Mon https://www.microsoft.com/en-us/Download/confirmation.aspx?id=4865

    - LanDetective https://landetective.com/download.html

    - Chanalyzer https://www.metageek.com/support/downloads/

    - Ettercap https://www.ettercap-project.org/downloads.html

    - NetworkMiner https://www.netresec.com/?page=NetworkMiner

    - Fiddler https://www.telerik.com/fiddler

    - Wireshark https://www.wireshark.org/download.html

    - Kali Linux https://www.kali.org/downloads/

    - vmWare https://my.vmware.com/web/vmware/downloads

    - Virtual Box https://www.virtualbox.org/wiki/Downloads


    ### Wireless Adapter Recommendations

    Many people seem to get confused when we talk about wireless adapters and wireless
    cards. They don''t know what they are, why we need them, and how to select the
    right one because there are so many brands and so many models. What we mean by
    a wireless adapter is the device that you connect to your computer through a USB
    port and it allows you to communicate with other devices on a Wi-Fi network, so
    you can use it to connect to wireless networks and communicate with other computers
    that use Wi-Fi. You might be thinking that your laptop already has this and yes,
    most laptops and smartphones already have this built in. But there are two problems
    with that. The first issue is that you can''t access built-in wireless adapters
    with Kali Linux if it''s installed as a virtual machine, and the second issue
    is that these built-in wireless adapters are not good for penetrating wireless
    networks. Even if you installed Kali Linux as a main machine on your laptop and
    then you''ll have access to your built-in wireless card, you still want to be
    able to use this wireless adapter for penetration testing because it doesn''t
    support monitor mode or packet injection. You want to be able to use it to crack
    Wi-Fi passwords and do all the awesome stuff that we can do in Kali Linux with
    aircrack-ng and other tools. Before we start talking about the brands and the
    models that will work with Kali Linux, I want to talk about a more important factor
    which is the chipset that''s used inside the wireless adapter. Forget about the
    brand for now. Instead, we''re going to talk about the brains that do all the
    calculations inside the wireless adapter. This is what determines whether the
    adapter is good or bad. Whether it supports injection and monitor mode and works
    with Kali Linux, the brand is irrelevant. What''s used inside that adapter is
    important and thus the chipset. There are many chipsets that support monitor mode
    and packet injection and Kali Linux. There is one that''s made by the company
    called Atheros and its model is AR9271. This chipset supports monitor mode and
    packet injection, and you can use the chipset to create fake access point, or
    you can use it to hack into networks. So you can use this chipset to do pretty
    much all Kali Linux attacks. The only problem with this chipset is that it only
    supports 2.4 gigahertz, so if your target uses 5 gigahertz or some of the devices
    are connected over 5G, then you won''t be able to communicate with these devices.
    You won''t even be able to see them so you won''t be able to launch the attacks
    against them. That''s not because the chipset is not good, but it''s because it
    cannot see 5 gigahertz traffic. If you want to get an adapter that uses this chipset,
    then you have two options. Well, you have many options, but I''m going to talk
    about two. First, there is a cheap option where you can get an unbranded wireless
    adapter that uses this chipset and you can use it to do all of the attacks that
    I just mentioned. The only thing is that this adapter is unbranded, so it''s a
    bit cheaper. The second option is to get the Alpha AWUS036NHA wireless adapter
    that''s made by Alpha, which is a very popular company and they keep on making
    great wireless adapters. It has the same chipset, and it''ll have the same compatibility.
    The only difference is the build quality. This is a much higher quality product
    made by a very good company. They both function very well, but the only difference
    is that the Alpha adapter has a longer range and it''s more reliable. Budget adapters
    are much smaller, much more compact, so if you''re in a public place it''s much
