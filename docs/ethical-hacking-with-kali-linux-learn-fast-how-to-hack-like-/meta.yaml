    ## Chapter 29 DoS Attack with mdk3

    Another enterprise security threat is of course the DoS or Denial of service attacks.
    As the name suggests, a denial of service attack, if successful, prevents other
    people using the resource or services. It disrupts the services for other users.
    There was a case in the press where an individual had decided that he was tired
    of people using their cell phone while driving so he drove around with a cellular
    jammer in his car and as he was driving around he was jamming all the frequencies
    on the cellular network. So vehicles around him, those people can''t use their
    cell phones and you might say, wow that''s a great idea, but you have to remember
    that law enforcement, ambulances, also use the cellular services. Therefore when
    you disrupt frequencies on cellular network for other people, you''re also disrupting
    it for services that you don''t want to be disrupting it for. This particular
    individual was tracked down eventually, and once they found him, and he got arrested,
    and he got heavily fined. But, how do you execute a denial of service attack?
    Well, in wireless there are two major ways. The first is to bombard your Wi-Fi
    access point with useless traffic. If you create a lot of traffic and the access
    point is trying to decide what to do with that, does it process all those authentication
    requests? What if you sent a probe request, and while the access point is dealing
    with that traffic, it''s not dealing with other user traffic. So basically, one
    approach is just to occupy the access point so it then can''t handle legitimate
    traffic. The second approach is simply to create noise and interference in the
    frequency band that the access point is operating on. I can broadcast signals
    that just disrupt and interfere with any other signals that are going over the
    air at the same time. Well, in this chapter, I''m going to share with you how
    to perform a DoS attack. Denial of service or DoS means that we are going to kick
    everybody off of a network and deny them service.


    First, we need to attack our wireless network adapter. Once you''ve done that,
    you need to open up a terminal and then type:

    ```ifconfig```

    press enter and now you need to open up a text file because you need to make note
    of some information. First, we''re going to make note of our wireless interface
    which for me is wlan0. Go ahead and make note of that name. Once you''ve done
    that, you can clear your terminal by typing

    ```clear```

    then press Enter. Next, we need to scan available access points so we can find
    a target, so type;

    ```iwlist wlan0 scan```

    then press Enter. This will list all the available access points, so go ahead
    and search for a target. Once you''ve found your target, you need to make note
    of the SSID and then you need to make note of the BSSID, and then you need to
    make note of the channel number. Once you''ve done that, we need to create a blacklist
    file so type;

    ```echo (target access point''s BSSID) > blacklist```

    and then press Enter. This will create a file called "blacklist", containing the
    target access point''s BSSID. Now we need to put our wireless interface into monitor
    mode. To do that type;

    ```airmon-ng start wlan0```

    then press Enter. This command will create a monitor interface called "mon0".
    Go ahead and make note of that monitor interface. To confirm what your monitoring
    interface is called, you can type;

    ```airmon-ng```

    And then press ENTER. This will display all of your interfaces, and you should
    see there the new monitoring interface called "mon0". Now we are ready to perform
    our DoS attack, so let''s go ahead and type;

    ```mdk3```

    then press enter. Next, we''re going to type;

    ```mdk3 mon0 d --blacklist --c 6```


    Here, you have to type the monitor interface name which is mon0, then the name
    of our blacklist file which in my case is called "blacklist", and then the channel
    of our target access point which is in my case is "6". Once you''ve done that
    go ahead and press ENTER. Next, you''ll see that it''s going to begin sending
    packets and it''s going to start to flood the network. In the meanwhile if you
    go to look at other machines connected to the same network, you''ll notice that
    those will be disconnected. Now we need to go ahead and open up another terminal,
    and we''re going to type;

    ```mdk3 mon0 a -m -i (target access point''s BSSID)```

    and press Enter. From looking at another computer nearby, you should see that
    it''s just been kicked off the network. If you look at your Wi-Fi, you should
    see that it''s been disconnected. You can go ahead and try to connect to the targeted
    BSSID, but it''s going to give you a connection timeout message. That''s it. As
    you see DoS attacks are relatively simple. You should see that you have been disconnected
    and now we can no longer connect and that''s how you can perform a DoS attack
    using mdk3.


    ## **Chapter 30 Brute Force Attack with TCP Hydra**

    In this chapter, you will learn how to analyse a brute force attack against the
    target system. In this scenario imagine that you have 3 nodes. The attacker is
    going to use a Kali Linux with the IP address of 10.0.0.111, and the victim machine
    will be using a Windows 10 device with an IP address of 10.0.0.202. Lastly, the
    penetration tester will use Kali Linux to intercept all the traffic and analyse
    any attacks on the network. Imagine that you are the attacker and you want to
    attack one of the hosts on the network that has a Telnet service turned on. The
    first thing a hacker is going to do is to try to brute force the target victim.
    To begin with a brute-force attack, there are various tools that you can use,
    but there is one which is very popular amongst pen testers and we haven''t covered
    yet is called "hydra". To use hydra, you have to first open your Kali Linux terminal
    window, and type the command:

    ```hydra -V -l (dictionary password file path) -t 50 - (victim IP address) ssh```

    Then press enter. Here, the "-V" option is for maximum verbosity, then the "-l"
    is for the log in name, followed by the dictionary password file path, and the
    "-t" argument selects the number of parallel connections. The greater the number,
    the faster the testing will occur, followed by the victim IP address, and finally,
    the protocol that I want to brute force. Once you have pressed Enter, the attack
    will begin, and all you have to do is now wait for the password to be cracked.
    The password should be cracked in a few minutes. From a hacker perspective, what
    is the next step? Well, the hacker will try to log in using Telnet. First, the
    hacker would issue the Telnet command, then specify the IP address of the victim''s
    host, and enter the login name followed by the cracked password. At this moment,
    the hacker is happy about this victory. If you jump into the penetration tester
    machine and analyse this hack, you should see what happens when the attacker tries
    a combination of username and passwords that are not authorized.'
