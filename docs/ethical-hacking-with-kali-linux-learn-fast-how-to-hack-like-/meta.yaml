  md: '# Chapter 10 Host discovery with Port Scanning


    When it comes to scanning your target device, you have to figure out which systems
    are alive on the network, and how often are they alive on the network.


    Besides, are they only up during certain times? You will also have to discover
    the ports that are currently open on these nodes, and the services that are running?


    Each one of these things will help you determine if there is any vulnerability
    that you can go after on your target device. Another way of scanning the network
    is to discover if there are any banners that you might be able to grab.


    By going through this process, you will learn which ports you want to close, and
    if there are any banners, you can hide them or customize them. You will also need
    to see which services aren''t desired, and if they''re not desired, you should
    turn them off.


    This could also give you an understanding of how you can standardize their firewall
    and intrusion detection system rules, and you will also see the vector of misconfiguration
    and what you want to do to fix those misconfigurations.


    Once you begin the scanning process, you have to run a host discovery, which will
    detect hosts that are live on the targeted network. There are numerous tools that
    you could use, and some of them are GUI based, while others are command-line based.


    For example the tool called "Nmap" looks at DOS-based or command prompt-only environment.
