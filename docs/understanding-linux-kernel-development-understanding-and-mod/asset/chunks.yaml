    # Chapter 2: Kernel Architecture Fundamentals


    Welcome to the gateway of understanding the intricate and fascinating architecture
    of the Kernel! Imagine the Kernel as a master architect designing the blueprint
    of your operating system''s functionalities. In this chapter, we unravel the foundational
    elements of Kernel Architecture Fundamentals. From its structural components to
    the orchestration of system calls, join us in exploring the crucial anatomy of
    the Kernel. Get ready to peek behind the curtain and uncover the building blocks
    that lay the groundwork for the seamless functioning of your computing environment.
    Prepare to delve into the Kernel''s architecture—a captivating landscape that
    shapes the very essence of how your system operates!


    With excitement for what''s ahead, let''s carry forward this knowledge, embracing
    the opportunities it offers for innovation and growth. Grateful for this journey
    into the Kernel''s essence, let''s venture forth, empowered by the understanding
    of this core computing marvel.


    # 2.1 Kernel Components and their Functions


    1\. Process Management:


    The Kernel oversees processes - the running programs - by managing their creation,
    scheduling, and termination. It allocates CPU time, handles inter-process communication,
    and maintains process synchronization.


    int fork(void);


    int execve(const char *filename, char *const argv[], char *const envp[]);


    Functions like `fork()` create new processes, while `execve()` loads and executes
    programs within these processes.


    2\. Memory Management:


    Responsible for managing the system''s memory, this component allocates and deallocates
    memory spaces for processes. It maintains a virtual memory map, handles memory
    paging, and ensures efficient memory utilization.


    void *kmalloc(size_t size, int flags);


    void kfree(void *ptr);


    Functions like `kmalloc()` allocate memory, and `kfree()` deallocates previously
    allocated memory within the Kernel.


    3\. File System Management:


    This component manages data storage, providing access to files, directories, and
    storage devices. It facilitates file creation, reading, writing, and deletion
    operations.


    ssize_t read(int fd, void *buf, size_t count);


    ssize_t write(int fd, const void *buf, size_t count);


    Functions like `read()` and `write()` enable reading from and writing to files
    respectively, encapsulating file system interactions.


    4\. Device Drivers:


    Kernel Device Drivers act as intermediaries between hardware devices and the Kernel.
    They facilitate communication between software and hardware, enabling the Kernel
    to control peripheral devices like disks, USBs, or graphics cards.


    int open(const char *pathname, int flags);


    int close(int fd);


    Functions like `open()` and `close()` interact with device drivers, allowing the
    Kernel to access and manage devices.


    5\. System Calls:


    System calls serve as interfaces between user-level processes and the Kernel.
    They provide a means for applications to request Kernel services.


    long sys_getpid(void);


    long sys_gettimeofday(struct timeval *tv, struct timezone *tz);


    System calls like `sys_getpid()` retrieve process IDs, while `sys_gettimeofday()`
    fetches system time information.


    Understanding these Kernel components and their functions provides a foundational
    comprehension of how the Kernel manages processes, memory, storage, devices, and
    interfaces with user applications. Each component plays a critical role in orchestrating
    the seamless functioning of the operating system.


    # 2.2 System Calls and Kernel Space


    1\. Understanding System Calls:


    System calls are gateways provided by the Kernel, allowing user-level processes
    to request services from the Kernel. They serve as an interface between user space
    and kernel space, enabling applications to access privileged Kernel functionalities.


    #include <unistd.h>


    int main() {


    pid_t pid = fork();


    if (pid == 0) {


    // Child Process


    // Perform actions specific to child process


    _exit(0); // Terminate child process


    } else if (pid > 0) {


    // Parent Process


    // Perform actions specific to parent process


    wait(NULL); // Wait for child process to finish


    } else {


    // Fork Error Handling


    perror("Fork failed");


    _exit(1);


    }


    return 0;


    }


    Here, `fork()` is a system call that creates a new process. This example demonstrates
    the use of `fork()` to spawn a child process.


    2\. Kernel Space and User Space:


    Kernel Space is the privileged area of memory where the Kernel resides, with unrestricted
    access to system hardware and resources. In contrast, User Space is where applications
    and user processes operate, restricted from directly accessing system resources.


    #include <stdio.h>


    int main() {


    printf("Hello from User Space!\n");


    return 0;


    }


    This code snippet operates entirely within User Space, showcasing a simple user-level
    application printing a message to the console.


    3\. System Call Mechanism:


    When a user-level application invokes a system call, it triggers a context switch—transitioning
    from User Space to Kernel Space. The Kernel executes the requested service, performs
    the required action, and returns control back to the user application.


    #include <unistd.h>


    int main() {


    int result = getpid();


    printf("My Process ID is: %d\n", result);


    return 0;


    }


    Here, `getpid()` is a system call fetching the Process ID (PID) of the current
    process.


    4\. Security and System Calls:


    System calls act as a security layer, preventing unauthorized access to Kernel
    resources. The Kernel carefully validates requests from user-level applications,
    ensuring only permitted operations are executed.


    Understanding System Calls and the distinction between Kernel Space and User Space
    is crucial. It enables developers to harness Kernel functionalities securely and
    efficiently, facilitating the interaction between user applications and the underlying
    Kernel. These concepts serve as the foundation for robust and secure system-level
    programming.


    2.3 Memory Management in the Kernel


    1\. Role of Memory Management:


    Memory Management in the Kernel involves efficiently utilizing and organizing
    memory resources. It oversees the allocation and deallocation of memory, ensuring
    optimal use and preventing conflicts between various processes accessing memory.


    2\. Kernel''s Memory Model:'
