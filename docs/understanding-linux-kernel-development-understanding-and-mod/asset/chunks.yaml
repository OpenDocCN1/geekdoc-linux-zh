    features.


    2\. Configuration File (config):


    Kernel configuration generates a configuration file (`.config`) containing selected
    options and settings. This file stores configuration choices made during the configuration
    process.


    # Command to view Kernel configuration file


    cat .config


    The `.config` file lists enabled or disabled features and serves as a reference
    for the configured Kernel.


    3\. Compilation Process:


    After configuring the Kernel, the compilation process begins using the `make`
    command. This process generates Kernel images and associated files.


    # Command to compile the Kernel


    make -j$(nproc)


    The `-j` flag with `nproc` specifies the number of CPU cores for parallel compilation,
    expediting the process.


    4\. Kernel Image and Modules:


    Kernel compilation produces the Kernel image (`vmlinuz`) and Kernel modules (`.ko`
    files) for various functionalities.


    # Command to locate Kernel image and modules


    ls arch/x86/boot/vmlinuz* && find /lib/modules/$(uname -r)/ -type f -name "*.ko"


    The Kernel image is the executable file loaded into memory at boot, while modules
    are loadable pieces of code extending Kernel functionalities.


    5\. Installation Process:


    Installation involves copying the compiled Kernel image and associated files to
    appropriate system locations. This step ensures the system uses the custom-built
    Kernel.


    # Command to install the compiled Kernel


    sudo make modules_install install


    Installing the Kernel ensures it becomes the default Kernel used during system
    boot.


