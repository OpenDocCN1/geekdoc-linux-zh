    (gdb) break function_name


    (gdb) continue


    GDB enables live debugging of Kernel code during its execution.


    4\. Dynamic Kernel Probes (Kprobes):


    Kprobes allows developers to dynamically insert probes (breakpoints) into Kernel
    code without recompiling, facilitating real-time debugging.


