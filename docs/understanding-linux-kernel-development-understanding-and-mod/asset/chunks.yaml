    # 5.1 Adding/Modifying System Calls


    1\. Understanding System Calls:


    System calls are interfaces through which user-space programs interact with the
    Kernel. They provide a bridge, enabling user applications to request Kernel services
    like file I/O, process control, and memory management.


    // Example of a system call


    #include <unistd.h>


    int main() {


    int result = write(1, "Hello,


    Kernel!", 14);


    return 0;


    }


    In this snippet, `write` is a system call invoking Kernel functionality to write
    data to the standard output.


    2\. Modifying Existing System Calls:


    Kernel developers might modify existing system calls to alter or enhance their
    behavior. This involves locating the relevant system call handler function within
    the Kernel source and making necessary modifications.


    // Example of modifying a system call


    asmlinkage long modified_syscall(...) {


    // Custom implementation or modifications


    …


    }


    Changing the behavior of a system call requires careful modification of its respective
    handler function.


    3\. Adding New System Calls:


    To add a new system call, developers need to define the system call number, handler
    function, and update Kernel headers to reflect the changes. This process involves
    modifying the system call table and creating a corresponding handler function.


    // Example of adding a new system call


    asmlinkage long my_custom_syscall(...) {


    // New system call implementation


    …


    }


    Adding a system call necessitates updating various Kernel components to integrate
    the new functionality seamlessly.


    4\. System Call Registration:


    Newly added system calls require registration within the Kernel. This involves
    updating the system call table and Kernel headers to reflect the addition.


    // Example of registering a new system call


    #define __NR_my_custom_syscall 333 // New system call number


    asmlinkage long sys_my_custom_syscall(...) __attribute__((alias("my_custom_syscall")));'
