    # 组织和分析主机信息


    通过之前的信息收集，我们可以了解局域网内活跃的主机。开放端口、服务和操作系统都是主机的某些类型。本节将介绍如何使用 IP 地址实体来组织和分析主机信息。


    ### 场景应用：使用 Maltego 工具组织和分析主机信息


    使用 `Maltego` 工具组织和分析主机信息。具体步骤如下：


    1. 启动 Maltego 工具，将显示界面。

    2. 使用 `Maltego` 工具组织和分析主机信息。

    3. 从界面中，你可以看到 `IP address` 实体。

    4. 从界面中，你可以看到 `IP address` 实体。

    5. 从界面中，你可以看到 `IP address` 实体。

    6. 使用连接（cable）连接 `IP address` 实体。

    7. 此时会弹出一个对话框。

    8. 点击 `OK` 即可看到添加的线条。

    9. 从该界面，你可以看到 `IP address` 实体与 `port` 实体之间的关系已成功建立。

    10. 从该界面，可以更直观地查看收集到的信息。


    # 组织和分析域名信息


    通过分析之前收集的信息，我们可以了解收集到的域名 WHOIS 信息、子域名和服务器信息。本节将介绍如何使用 `Domain` 实体组织和分析域名信息。


    使用 `Maltego` 工具组织和分析域名信息。具体步骤如下：


    1. 在 `Maltego` 中打开一个新图表以避免与之前的信息混淆。点击新图表按钮。

    2. 从该界面，你可以看到打开了一个新图表，其名称为 `New Graph`。

    3. 在此处选择 `Domain` 实体来组织和分析域名信息。在实体面板中选择 `Domain` 实体并将其拖入图表，然后将实体的域名修改为 `wikipedia.com`。

    4. 通过分析上述收集的信息，我们可以获取域名的 WHOIS 信息、子域名和服务器信息。例如，这里是域名 `wikipedia.com` 的所有子域名。其中，用于表示子域名的实体是
    `DNS Name`。因此，在实体列表中选择 `DNS Name` 实体并将其拖入图表，然后将实体名称修改为相应的子域名。

    5. 此时，用户使用 `Maltego` 的 `Transform` 还可以收集更多关于域名和子域名的信息，例如域名注册商、子域名和 WHOIS 信息。


