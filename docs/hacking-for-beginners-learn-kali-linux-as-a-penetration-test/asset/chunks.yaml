    ```

    root@exampleserver:～# cd /root/.msf4/modules/exploits/

    ```

    From the output information, we can see that the penetration attack module file
    `webtest.rb` has been successfully copied to the newly created location.


    2. **Restart the Metasploit tool to see the loaded penetration attack module.**

    The execution command is as follows:

    ```

    root@exampleserver:～# msfconsole

    msf5>

    ```

    From the information displayed above, we can see that the exploit class module
    has changed from 1873 to 1874. This shows that the module has been successfully
    imported.


    3. **Select the `webtest` module and view the options of the module.**

    The execution command is as follows:

    ```

    msf5> use exploit/test/webtest

    ```

    ` 0 Auto`

    As you can see from the output information, all options of the `webtest` module
