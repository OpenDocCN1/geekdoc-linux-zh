    HostSnooping means not actively sending data packets to the target, but only monitoring
    data packets in the network. In a local area network, some protocols will automatically
    broadcast data packets, such as ARP broadcast and DHCP broadcast. The broadcast
    packet is a data packet that all users in the LAN can receive. Therefore, users
    can detect active hosts on the network by monitoring these packets. The following
    section will introduce the discovery of the host by monitoring.1) ARP monitoringARP
    (Address Resolution Protocol) is a TCP/IP protocol that obtains physical addresses
