- fmt: '

    # Usage of Kismet Tools


    Kismet is a tool for sniffing wireless networks. Using this tool, you can monitor
    the surrounding wireless signals and view all available wireless access points.
    The following section will introduce the method of scanning wireless network using
    Kismet tool.


    ## Using Kismet tool to scan wireless network


    The specific operation steps are as follows:


    1. **Start the Kismet tool.** Execute the command as follows:

    ```

    root@exampleserver: kismet start

    ```

    After executing the above command, the interface will be displayed.


    2. This interface is used to set whether to use the default color of the terminal.
    Because Kismet''s default color is gray, and some terminals cannot display it,
    the default color is not used here. Click `No` button at this time, and the interface
    will be displayed.


    3. The interface prompts that the root user is being used to run the Kismet tool.
    Click `OK` button, and the interface will be displayed.


    4. The interface prompts whether or not to automatically start the Kismet service.
    Click the `Yes` button, and the interface will be displayed.


    5. The interface displays some information about setting up Kismet service. Use
    the default settings here, and then click the `Start` button to display the interface.


    6. The interface displays undefined package resources. Do you want to add them
    now? Click the `Yes` button, and the interface with immediate results will be
    displayed.


    7. Specify the wireless network card interface and description information on
    this interface. In the `Intf` text box, enter the wireless network interface `wlan0`.
    Then click the `Add` button, and the interface will be displayed.


    8. Click the `Close Console Window` button on the interface to start scanning
    the wireless network.


    9. All wireless AP information scanned by Kismet tool can be seen from this interface.
    On the left side of the interface, the time of capturing packets, the number of
    networks scanned and the number of packets are displayed. Users can find that
    only the searched wireless AP, channel and packet size information can be seen
    in this interface, but the MAC addresses of these APS and connected clients are
    not seen. Furthermore, AP cannot be selected by default. If you want to view the
    clients connected to the current AP, you also need to set it up. Select `Sort|First
    Seen` command in the menu bar in turn, and then select `AP` in the above the fold,
    and display the connected client in the second screen.


    10. As you can see from this interface, the AP details named `CU_655w` are displayed,
    and the connected clients are displayed. For example, the MAC address of the connected
    client is `fc:1a:11:9e:36:a6`. The MAC address of AP is `70:85:40:53:E0:3B`, the
    working channel is `9`, and the encryption methods are `TKIP`, `WPA` and `PSK`.
    If you want to view the details of an AP, double-click the corresponding AP.


    11. From this interface, you can see the detailed information of the AP, such
    as manufacturer, BSSID, channel, frequency and signal strength. If you want to
    stop scanning the wireless network, click `Kismet|Quit` in turn, and the dialog
    box for stopping Kismet service will pop up.


    12. Click the `Kill` button to stop Kismet service and exit the scanning interface.


    In addition, some log information will be given as output at the terminal:

    ```

    [SERVER] usually: /etc/init.d/networking restart

    ```

    It can be seen from the above output information that the captured data is successfully
    written into the log file. It can be seen from the output information that five
    file locations are generated. Among them, each log file holds different contents:

    - `alert`: the plain text log file of the alert. Kismet will send alerts for events
    of special concern.

    - `GPS XML`: GPS log file in XML format.

    - `nettxt`: Network information in plain text format.

    - `net XML`: network information in XML format.

    - `pcapdump`: a real-time data communication file captured by `pcap`. It depends
    on the version of `libpcap`, and this file may contain information of each packet,
    including GPS coordinate information.


    # Chapter 40 Attacking Wireless Networks


    ![](Image00007.jpg)


    By implementing wireless network scanning, we can find out the target of attack.
    This section will introduce how to attack the wireless network password and provide
    some protection measures.


    ## Crack WEP wireless network password


    Because WEP encryption uses `RC4` algorithm, the WEP encrypted network can be
    easily cracked. The following section will introduce how to use `airplane-ng`
    tool to crack WEP encrypted wireless network.


    ### Crack WEP wireless network password with airplane-ng tool


    The specific operation steps are as follows:


    1. **Start the monitoring mode.** Execute the command as follows:

    ```

    root@exampleserver: airplane-ng monitor

    ```


    2. **Scan the wireless network** to find out the wireless network encrypted by
    WEP. It can be seen from the output information that `WEP` is the encryption method
    used by the wireless network whose `ESSID` is `Test`. Therefore, we will choose
    to crack the wireless network password here.


    3. **Capture the wep wireless network data packet** and specify that the captured
    data packet be saved in the WEP file. Execute the command as follows:

    ```

    root@exampleserver: airplane-ng capture

    ```

    See the above output information, indicating that the data packet of the `Test`
    wireless network is being captured. Whether the WEP encrypted wireless network
    can be cracked successfully depends on the captured `IVS` data packet. As can
    be seen from the `Data` column shown above, only 20 packages have been captured
    so far.


    In order to speed up packet capture, users can use `Aireplay-ng` tool to implement
    injection attack. The syntax format is as follows:

    ```

    root@exampleserver: injectParameter -3

    ```

    `-3` in the above syntax indicates ARP injection attack. `-b` specifies the MAC
    address of the AP. `-h` specifies the MAC address of the client.


    4. **Implement ARP injection attack** to accelerate the speed of capturing data
    packets. Execute the command as follows:

    ```

    root@exampleserver: airplane-ng inject packets ARP

    ```

    (Note: The text contains repetitive descriptions here, maintaining logic based
    on provided source).


    ## Crack WPA/WPA2 wireless network password


    WPA/WPA2 encryption is inherently secure. However, as long as the user captures
    the handshake and has a strong enough dictionary, it is possible to crack the
    password. The following section will introduce the method of brute force cracking
    WPA/WPA2.


    ### Using Aircraft-ng tool to crack WPA/WPA2 password


    The specific operation steps are as follows:


    1. **Start the monitoring mode and scan the wireless network.** All wireless networks
    can be seen from the output information. At this time, select the wireless network
    encrypted with `WPA/WPA2`. For example, `CU_655w` wireless network will be selected
    here.


    2. **Use Airodump-ng tool to recapture the data packet**, and specify the `BSSID`,
    `channel` and file saving location of the target AP. Execute the command as follows:

    ```

    root@exampleserver: airodump bssid

    ```

    However, if you want to crack the password of this wireless network, you must
    capture the handshake bag. At this time, the user can use `mdk3` tool to carry
    out death attack, so as to speed up the acquisition of handshake bag. Its syntax
    format is as follows:

    ```

    root@exampleserver: handshake

    ```

    In the above syntax, option `d` means to carry out death attack. `-s` specifies
    the time interval for sending death packets. `-c` specifies the attack channel,
    that is, the channel where the AP is located.


    3. **Use mdk3 tool to carry out death attack to obtain handshake bag.** Execute
    the command as follows:

    ```

    root@exampleserver: mdk3

    ```

    After executing the above command, no information will be given as output. At
    this time, return to Airodump-ng capture package interface to observe whether
    the handshake package is captured. If the handshake bag is captured, the MAC address
    of AP will be displayed in the upper right corner. As you can see from the upper
    right corner, `WPA handshake` is displayed. Therefore, the handshake bag has been
    successfully captured.


    4. **Implement brute force cracking**, and specify the password dictionary used
    as `passwords.txt`. Among them, the password dictionary needs to be created manually
    by the user. Execute the command as follows:

    ```

    root@exampleserver: brute force dictionary.txt

    ```

    It can be seen from the output information that the password of `CU_655w` wireless
    network has been successfully cracked, and the password is `exampleserver`.


    ## Protective measures


    It can be found from the previous introduction that both WEP encryption and WPA/WPA2
    encryption can crack passwords. In order to make your wireless network as secure
    as possible, users can take some protective measures.

