    \ This section describes the methods of scanning wireless networks with detailed\
    \ instructions.\n\n## Chapter 39: Usage of Airodump-ng Tool\n\n### Using Airodump-ng\
    \ Tool\n\n`Airodump-ng` is a tool in `Aircrack-ng` toolset, which can be used\
    \ to scan the surrounding wireless network signals. The name, `MAC` address, `channel`\
    \ and encryption method of the surrounding open `AP` can be known by analysing\
    \ the captured wireless signal packets. The following section describes the method\
