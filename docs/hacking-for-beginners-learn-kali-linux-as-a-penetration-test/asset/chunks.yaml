    # Scanning Vulnerabilities and Sniffing Data

    Learn To Scan Vulnerabilities Using Nessus, `OPENVAS` and Sniff Data Using Wireshark


    ![](Image00005.jpg)


    ## Introduction

    The next module of this hacking bundle book is about Vulnerability scanning. Every
    system is prone to vulnerabilities. If a hacker can find a loophole or backdoor
    to an application he can use it for malicious intentions such as data or currency
    theft. As an ethical hacker and a responsible penetration tester you are on the
    right side of the river. It is evident that vulnerability scanning is a pivotal
    stage in the hacking procedure.


    To make beginners hooked up with the importance of vulnerability scanning we have
    designed this book to introduce you to two important vulnerability scanning software.
    Have fun finding vulnerabilities.


    Disclaimer: This book is provided only for reference purposes. The authors of
    the book are not in any way responsible for the illegal intentions of the readers
    of the book.


    ## Chapter 17 Understanding Vulnerabilities

    ![](Image00005.jpg)


    You might have often heard about the word vulnerability. In 2018, when a Ransomware
    attack happened people searching for the word “vulnerability” increased tremendously.
    Even though it is a popular word among developers and tech enthusiasts still 80%
    of the people who are using technology in every day life are unaware of vulnerabilities
    and their impact in the day-to-day life. As a hacker, understanding the importance
    of vulnerabilities is your primary motto. This chapter introduces you to vulnerabilities
    in detail explanation. Follow along!


    ### What are vulnerabilities?

    Vulnerabilities generally refer to various defects in the target system. Scanning
    for vulnerabilities is a way to verify the possible defects of the target system.
    Once a loophole is discovered, it can effectively be used to attack the target
    host and prove its harmfulness by using different exploitation techniques. Therefore,
    scanning for vulnerabilities is an important part of implementing penetration
    testing and is henceforth declared as a mandatory skill for pen testers. Since
    there maybe possibility for thousands of vulnerabilities, the manual scanning
    procedure is very boring. To counter this problem, you can use some convenient
    tools to implement,, such as `Nessus` and `OpenVAS`. This chapter will introduce
    to you the concept of vulnerabilities and will provide various procedures to scan
    for vulnerabilities.


    ### Overview of a vulnerability

    Vulnerabilities are defects in the specific implementation of hardware, software,
    and protocols or system security policies, which can enable an attacker to access
    or destroy the system without allowed authorisation. For example, a significant
    logic error in Intel Pentium chips made that the `ARP` protocol does not detect
    the authenticity of packets. So, when the target administrator sets up an anonymous
    FTP service, improper configuration issues may be used by attackers, threatening
    the security of the system. This is only a small example for your understanding,
    Everyday tens of vulnerabilities are made available for security researches in
    different websites all around the web.


    This section will introduce the common types of vulnerabilities with examples
    that may enrich your knowledge.


    #### Man-made improper configuration

    In practical applications, the system or software requires users to perform various
    configurations to meet specific needs. If the artificial configuration is improper,
    it will lead to loopholes. The most common types of vulnerabilities include weak
    passwords and incorrect permission settings.


    **a) Weak password**

    Password is an important method of identity authentication, and weak passwords
    generally refer to various simple passwords and initial passwords. This type of
    simple passwords are easily detected by brute force password cracking.


    *Intresting Fact: Almost 60% of the internet users use simple passwords that can
    be easily brute forced by a cracking tool. This is why, it is always recommended
    to use a password that cannot be easily guessed.*


    For example, in the `MySQL` database service, if the administrator user''s `root`
    of the service is configured with a weak password (such as `toor`), it can be
    easily cracked using brute force dictionary attacks. Using different dictionary
    attack techniques, the penetration tester can log in to the `MySQL` database service
    as an administrator, and then can view all data entries. Some important or sensitive
    data may be stolen by penetration testers. According to a recent survey, thousands
    of databases are still using weak passwords.


    `Kali Linux` provides a tool called `changeme` which can be used to scan the target
    host for the default authentication. For example, it can automatically check whether
    the FTP service has been enabled for anonymous users for a particular server.
    If it is indeed allowed then the tool automatically uses default passwords to
    login to the FTP server.


    At this point, the user can use the tool to perform a scan to detect whether the
    target host uses a default password. If the default password is indeed used, it
    means that the host certainly has a weak password, and penetration testers can
    use this vulnerability to carry out attacks. The syntax format of `changeme` is
    as follows:


    `changeme -a <target>`


    The option `-a` in the above syntax means to scan all protocols. And the `target`
    is defined as the address of the system we are trying to scan.


    A simple use-case: Use the `changeme` tool to scan to know whether or the target
    uses a weak password. The execution command is as follows:


    ```

    root@exampleserver:~# changeme -a 192.234.56.321

    ```


    **b) Wrong permission settings**

    The authority mechanism stipulates what users can and cannot do. In an operating
    system, permissions are an important technology that restricts any user from operating
    sensitive resources. If a user is given the maximum authority due to improper
    configuration, serious consequences may be caused, such as deleting other people''s
    files and changing other users'' passwords. For example, the permission setting
    of FTP service is cumbersome. If the administrator configures the FTP directory
    permissions incorrectly, it may cause anonymous users to delete files or maliciously
    upload files. It is therefore usually suggested for system administrators to constantly
    check the permission settings that they use by default.


    ### Software Vulnerabilities

    Software vulnerabilities are usually caused by the negligence of software developers
    when developing software, or sometimes caused due to the limitations of programming
    languages. For example, the `C` language family is more efficient than `Java`,
    but it is also prone to more vulnerabilities. It is also important to remember
    that a complex system contains more functions, and its complexity results in greater
    probability of vulnerabilities. For example, computer systems often require various
    patches to fix vulnerabilities. Here are a few recent well-known software vulnerabilities:

