    # 远程键盘软件漏洞


    该软件存在 3 个安全漏洞，会导致权限提升，允许攻击者通过网络对本地用户或键盘会话进行按键注入，或执行任意代码。


    ## 基于 Jakarta 插件的 Struts 远程代码执行漏洞


    这是一个高风险漏洞，漏洞编号为 `CVE-2017-5638`。该漏洞主要是由于 `Jakarta` 对文件上传请求包的分析不当引起的。当攻击者使用恶意的
    `Content-Type` 时，会导致远程命令执行。


    ## 硬件漏洞

    硬件漏洞通常存在于硬件设备或芯片中。例如，`NVDIA Tegra`芯片中的漏洞存在于`Tegra`芯片的只读 `bootrom` 中。CPU 漏洞（`Meltdown`
    和 `Spectre`）直接存在芯片内部，由于指令读取顺序的原因，它们容易受到病毒攻击。


    # 接下来做什么？

    由于本章对漏洞提供了很好的介绍，我们将通过学习 `Nessus`（一种漏洞扫描工具）继续我们的黑客之旅。请跟随学习！


    ## 第 18 章：介绍 Nessus

    ![](img/Image00005.jpg)

    正如上一章所述，漏洞在当前复杂的系统中非常常见，且通常难以发现，因为有成千上万个可以利用的开放漏洞。为了解决这个问题，开发了如 `Nessus` 和 `Open
    VAS` 等自动化漏洞扫描软件，它们通常受到渗透测试人员社区的高度欢迎。在本章中，我们将详细查看 `Nessus` 软件，它以创新的、扫描和发现漏洞的方法而闻名。


    ### 什么是 Nessus？

    `Nessus` 是目前常用的系统漏洞扫描和分析软件。该工具提供完整的漏洞扫描服务并不断更新其漏洞数据库。此外，`Nessus` 可以同时在本地或远程操作以进行系统漏洞分析和扫描，使其成为渗透测试人员开发的最重要的软件之一。本节将介绍如何使用
    `Nessus` 进行漏洞扫描并进行深度解释。


    ## 跟随学习！安装并激活 Nessus

    在 `Kali Linux` 中，`Nessus` 工具不是默认安装软件。因此，如果你想使用此工具进行漏洞扫描，需要先安装它。此外，它是一款付费软件。因此，当用户成功安装
    `Nessus` 工具后，必须使用许可证激活服务后才能使用。


    ### 安装 Nessus 服务：

    要在 `Kali Linux` 中安装 `Nessus` 服务，你需要按照以下特定步骤操作：


    1. **下载 Nessus 工具安装包。**

    不同的第三方网站提供了 `Nessus` 软件的下载文件。我们建议你不要相信这些网站，仅从官方网站下载。[点击此处] 访问 `Nessus` 最新版本软件的官方下载地址。当用户在浏览器中成功访问该地址后，将出现
    `Nessus` 工具的下载页面。


    2. **从此页面，你可以看到所有提供的 `Nessus` 安装包。** 在此位置，用户需要根据自己的操作系统类型和架构选择对应版本的安装包。

    为了方便你理解，这里有一个示例，将介绍如何在 `Kali Linux x64` 系统中安装 `Nessus` 工具。由于 `Kali Linux` 是支持
    `Debian` 的系统，因此在这里选择了 `.deb` 格式以及 64 位架构包。在下载页面上选择并点击安装包后，会弹出一个接受许可协议的对话框。


    3. **点击“I Agree”（我同意）按钮接受许可协议。** 此时，安装包将开始下载。如果接下来几分钟内一切顺利，你就可以安装 `Nessus` 工具。

    执行命令如下：

    ```

    root@exampleserver:～# dpkg -i Nessus-Versionname-debian6_amd64.deb

    ```

    该命令将编译 `.deb` 文件并在系统中启动 `Nessus` 服务器。然后你可以在 Linux 终端上输入以下代码来启动 `Nessus Scanner`：

    ```

    /etc/init.d/nessusd start

    ```

    然后访问 `https://exampleserver:8834/` 根据你的需求配置扫描器。如果一切顺利，你将观察到指示 `Nessus` 软件包安装成功的输出信息。`Nessus`
    通常默认安装在 `/opt/nessus` 目录下。从上述输出信息可以看出，用户可以在浏览器中输入 `https://exampleserver:8834/`
    来访问 `Nessus` 服务并进行漏洞扫描。记住，你需要将“example server”实例替换为你的系统用户名。


    4. **启动 Nessus 服务。**

    安装 `Nessus` 服务后，它默认是不启动的。因此，如果你想使用此程序进行扫描，必须先启动 `Nessus` 服务。

    执行命令如下：

    ```

    root@exampleserver:～# /etc/init.d/nessusd start

    ```

    将显示以下输出：`Starting Nessus…`。看到上述输出信息表示 `Nessus` 服务启动成功。


    5. **激活 Nessus 服务**

    在使用 `Nessus` 之前，你必须激活服务才能使用。激活 `Nessus` 程序需要一个激活码。接下来的章节将介绍激活 `Nessus` 服务的方法。

    激活 `Nessus` 需要遵循以下特定步骤：


    1. 获取 Nessus 激活码


