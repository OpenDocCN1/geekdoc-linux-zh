    ## 引言


    这本书是为探索黑客世界的初学者的终极合集。黑客经常出现在流行文化中，但人们往往了黑客是技术进步的驱动力。


    > “当你破坏他们的应用程序时，他们会将其构建得更坚固” - `匿名黑客`


    ## 这本书是为谁写的？


    本书作者是一名 `渗透测试员`，决定为那些在伦理上被引导去保护系统而非破坏系统的初学者写这本书。这本书使用了更简单的语言和认知学习技术来帮助你提高该领域的知识。本书包含五个模块：


    1. `介绍 Kali Linux 与黑客技术`

    2. `侦察`

    3. `扫描与嗅探`

    4. `Metasploit`

    5. `密码破解`


