    ## Introduction


    This book is an ultimate bundle for beginners trying to explore the world of hacking.
    Hackers are often used in popular cultural references as shady people. However,
    people often forget the fact that hackers are a driving force for technological
    advancements.


    > "When you break their applications they build them more strongly" - `An Anonymous
    Hacker`


    ## For who this book is written?


    The Author of this book is a `pen tester` and decided to write a book for beginners
    who are ethically sidelined to protecting systems instead of breaking them. This
    book uses more simple language and cognitive study techniques to help you improve
    your knowledge on the subject. This book has five modules:


    1. `Introducing Kali Linux and Hacking`

    2. `Reconnaissance`

    3. `Scanning & Sniffing`

    4. `Metasploit`

    5. `Password Cracking`

