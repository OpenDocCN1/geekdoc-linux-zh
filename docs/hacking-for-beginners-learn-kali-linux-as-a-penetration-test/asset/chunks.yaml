    # 漏洞扫描与数据嗅探

    学习使用 Nessus、`OPENVAS` 扫描漏洞以及使用 Wireshark 嗅探数据


    ![](img/Image00005.jpg)


    ## 引言

    本黑客教程的下一个模块是关于漏洞扫描。每个系统都存在漏洞。如果黑客找到应用程序的漏洞或后门，就可以将其恶意利用，例如盗取数据或货币。作为一名道德黑客和负责任的渗透测试员，你处于正确的一。显而易见，漏洞扫描是黑客流程中的关键阶段。


    为了让初学者意识到漏洞扫描的重要性，我们设计了这本书向你介绍两个重要的漏洞扫描软件。祝你发现漏洞的过程愉快。


    免责声明：本书仅供参考。书作者对读者的任何非法意图不承担任何责任。


    ## 第 17 章 理解漏洞

    ![](img/Image00005.jpg)


    你可能经常听过漏洞（vulnerability）这个词。在 2018 年勒索软件攻击发生时，搜索“漏洞”一词的人激增。尽管它是开发者和技术爱好者的常用词汇，但仍有
    80%在日常生活中使用技术的人并不知道漏洞及其对日常生活的影响。作为一名黑客，理解漏洞的重要性是你的首要宗旨。本章将向你详细介绍漏洞。请仔细阅读！


    ### 什么是漏洞？

    漏洞通常指目标系统中的各种缺陷。漏洞扫描是验证目标系统可能缺陷的一种方法。一旦发现漏洞，就可以有效地用于攻击目标主机，并通过使用不同的利用技术证明其危害性。因此，漏洞扫描是实施渗透测试的重要部分，从现在被认为是渗透测试员的必备技能。由于可能存在数以千计的漏洞，手动扫描非常枯燥。为了解决这个问题，你可以使用一些方便的工具，例如
    `Nessus` 和 `OpenVAS`。本章将向你介绍漏洞的概念，并提供各种漏洞扫描程序。


    ### 漏洞概述

    漏洞是硬件、软件、协议或系统安全策略在特定实现中的缺陷，这允许攻击者在未经授权的情况下访问或破坏系统。

