    ports 21 and 23 of the scan target host.The execution command is as follows:root@exampleserver:～#
    nmap -p 21,23 192.243.176.84This gives a much detailed information about the two
    parts that have been specifically asked by the command. By using these techniques
    you can minimise the time that usually takes for scanning the ports.2) Use DMitry
    toolThe DMitry tool provides a -p option to implement port scanning.The syntax
    format used to implement port scanning is as follows:dmitry -p [host]Here host
    is the IP address of the target we are trying to scan the ports.Use-case scenario:Use
    DMitry to scan the open ports on the target host 192.243.176.84.The execution
    command is as follows:root@exampleserver:～# dmitry -p 192.243.176.84From the output
    information, you can see all the ports open on the target host. From the penultimate
    line of output, you can see the number of ports that were scanned and number of
    ports that were closed.What Next?As much important ports are they are still difficult
    to implement. Now a days administrators are using intrusion section systems and
    it can be not a good practice to completely rely on them. Also, with ports we
    may not find additional information that is required to build exploits. It helps
    if we can find out about the operating system that the target is using. Follow
    along to know more about operating system detection in the next chapter.Chapter
    14Identify the operating system![](Image00004.jpg)By identifying the operating
    system, the system type of the target host can be determined. In this way, penetration
    testers can perform vulnerability detection on the program of the target system
    in a strategic manner to save unnecessary wasted time. This section will introduce
    the method of identifying the operating system with significant examples.Recognition
    based on TTLTTL (Time To Live), this field specifies the maximum number of network
    segments that an IP packet is allowed to pass through before being discarded by
    the router. Different operating system types respond with different TTL values.
    Therefore, users can use the Ping command for system identification. In order
    to enable users to quickly determine the type of a target system, a list of initial
    TTL values ​​of each operating system will be necessary.You can easily find them
    by a quick google search.Use-case scenario:Use Ping to test the operating system
    type of the target host 192.243.176.84\. The operating system type of the target
    host is Kali Linux. Let us find out whether the command can detect it or not.The
    execution command is as follows:root@exampleserver:～# ping -c 192.243.176.84It
    can be seen from the output information that the TTL value in the response packet
    is 64\. It can be inferred that the host is a Linux operating system.You can experiment
    with this command on your own operating system to find out its value.Use-case
    scenario:Use Ping to test the operating system type of the target host 192.243.176.84\.
    The operating system type of the target host is Windows 7.The execution command
    is as follows:root@exampleserver:～# ping -c 192.243.176.84It can be seen from
    the output information that the TTL value in the response packet is 128\. It can
    be explained that this is a Windows operating system.Tip: If there are too many
    routers from the local host to the target, the judgment result may not be very
    accurate.Recognition using NMAPSince TTL is only a fuzzy judgment, the result
    obtained may not be accurate. The NMAP tool provides a function to detect the
    operating system. The following section will introduce the use of NMAP to identify
    the operating system type.The syntax format of using NMAP to identify the operating
    system is as follows:nmap -O [target]Here target is the host address we are trying
    to attack for our penetration testing.Use-case scenario:Use NMAP to detect the
    operating system type of the target host 192.243.176.84.The execution command
    is as follows:root@exampleserver:～# nmap -O 192.243.176.84From the output information,
    we can understand that the operating system type of the target host is identified
    as Microsoft Windows 7/2008/8.1. Although it is impossible to determine which
    version it is, however the closer system version will be displayed.While Dmitri
    also provides the same functionalities according to our experience it comes up
    with more errors during the scan. We highly recommend to use only Nmap for finding
    out about the details of the host operating system.What Next?We will talk about
    Identification services in detail. Follow along!Chapter 15Identification Service![](Image00004.jpg)The
    identification service is mainly the version information of the detection service.
    Generally, there may be vulnerabilities in some old versions. If there are loopholes,
    users can infiltrate the host to obtain other important information. This section
    will introduce how to identify services for easier exploitation of the target.Using
    Nmap ToolA -sV option is provided in the Nmap tool, which can be used to identify
    the version of the service. The following section will introduce a Nmap technique
    using this option to identify services.The syntax format of using Nmap to identify
    the service version is as follows:nmap -sV [host]The option -sV in the above syntax
    means to implement service version detection.Use-case scenario:Identify all open
    services and versions on the target host 192.243.176.84.The execution command
    is as follows:root@exampleserver:～# nmap -sV 192.243.176.84The identified service-related
    information can be seen from the output information. The output information includes
    4 columns, namely PORT (port), STATE (state), SERVICE (service) and VERSION (version).
    By analysing each column of information, you can obtain relevant information about
    the corresponding service. For example, the service corresponding to TCP port
    21 is FTP, and the version is FileZilla ftpd. You can also see from the penultimate
    line that the host name of the target host is TEST-PC, and the operating system
    type is Windows.Using Amap ToolAmap is a set of penetration testing tools for
    identifying network services, including two tools, amap and amapcrap. Among them,
    the amap tool is used to try to identify applications running on unusual ports
    whereas the amapcrap tool identifies applications based on non-ASCII encoding
    by sending trigger packets and finding the response in the response string list.The
    following section will introduce the use of Amap tools to identify service information.1)
    Use the amapcrap toolThe amapcrap tool can send random data to UDP, TCP or SSL
    ports to obtain illegal response information. The obtained information will be
    written to the appdefs.trig and appdefs.resp files to facilitate the next step
    of Amap detection.The syntax format of using this tool to identify service information
    is as follows:amapcrap -n -m <0ab> [host][port] -vHere -V stands for the verbose
    mode.Use-case scenario:Use the amapcrap tool to probe port 90 applications.The
    execution command is as follows:root@exampleserver:～# amapcrap -n 20-ma 192.198.153.84
    90 -vFrom the displayed results, we can understand that the acquired information
    is written into the appdefs.trig and appdefs.resp trigger files. When users use
    the Amap tool to identify services, these two files will be used to obtain information.2)
    Use the amap toolThe amap tool can try to identify some applications running on
    abnormal ports.The syntax format of using this tool to identify service information
    is as follows:amap -bqv [host][port]Use-case scenario:Use the amap tool to scan
    the port 80 service on the target host 192.243.176.84.The execution command is
    as follows:root@exampleserver:～# amap -bqv 192.243.176.84 80From the output information,
    you can understand that the service matching port 80 is http or http-apache2\.
    From the displayed identification information, it can be seen that the web service
    running on the target host is Apache and the version is 2.2.8\. In the first 3
    lines of output, you can see that the amap tool uses two trigger files and a response
    file. Among them, the file names are appdefs.trig, appdefs.resp and appdefs.rpc.Collect
    service informationSome special services can provide additional information. For
    example, SMB service can provide file system structure whereas SNMP service can
    provide target host related information. This section will explain how to use
    these services to collect valuable information for your pen testing information
    collection about the target.SMB ServiceSMB (Server Message Block) is an IBM protocol
    used to share files, printers, serial ports, etc. between computers. The SMB protocol
    can work on top of the TCP/IP protocol, or on other network protocols (such as
    NetBEUI). By obtaining the shared folder information of the SMB service, you can
    understand the file system structure of the target host. The following section
    will introduce the shared folder information for using the smbclient tool to access
    the SMB service.smbclient is a client tool for SMB service that can be used to
    access shared files in SMB service.The grammatical format of the smbclient tool
    is as follows:root@exampleserver : smbclient -L -U <username></username>The options
    and meanings in the above grammar are as follows: · -L: Used to specify the SMB
    server address. · -U: Used to specify the user name for logging in to the SMB
    service.Use-Case scenario:Access the SMB service in the Linux system.The execution
    command is as follows:smbclient -L 192.243.176.84 -U root Enter WORKGROUP\root''s
    password:Entering the password of the SMB service user login will display the
    information that needs a lot of analysis.From the output information, you can
    see the files shared in the target SMB. Among them, Sharename represents the name
    of the shared file, Type represents the type of hard disk, and Comment is the
    description of the shared file. It can be explained that the operating system
    type of the target host is Linux, and the shared file is the Linux file system
    type.If the operating system of the target host is Windows, the file name column
    will display the drive letter of the shared folder.root@exampleserver:～# smbclient
    -L 192.243.176.84-UAs can be seen from the file name of the above output result,
    the default shared disks are C disk and E disk. Only in the Windows system, folders
    are divided into disks in the form of drive letters. It can be judged that the
    shared folder is of the Windows system type.SNMP ServiceSNMP (Simple Network Management
    Protocol) is composed of a set of network management standards, including an application
    layer protocol and a set of resource objects. This protocol is used by the network
    management system to monitor any situation on the network equipment that deserves
    the attention of the administrator. By using this service, host information can
    be obtained. The following section will introduce the use of snmpcheck tool to
    obtain host information.The snmpcheck tool can be used to enumerate SNMP devices
    to obtain target host information.The syntax format of the tool is as follows:snmp-check
    [target]Use-case scenario:Use snmp-check tool to obtain 192.243.176.84 host information
    through SNMP protocol.The execution command is as follows:root@exampleserver:～#
    snmp-check 192.243.176.84When the connection is successful, the system information
    of the host can be obtained.Due to the large amount of output information that
    comes with the above command, each part will be important to understand. Follow
    along!1) We can obtain system information, such as host name, operating system
    type and architecture.2) We can obtain user account information.3) Can obtain
    network information, such as TTL value, TCP segment and data element.4) Can obtain
    network interface information, such as interface status, speed, IP address, and
    subnet mask.5) Can obtain network IP information.6) Can obtain routing information,
    such as destination address, next hop address, subnet mask and path length value.7)
    Can obtain the monitored TCP port.8) Can obtain monitoring UDP port information.
    For example, the monitored UDP ports can be 123, 154, 6300, 300 and 5322.9) We
    can obtain network service information, such as distributed component object model
    service, DHCP client, and DNS client.10) We can obtain process information, such
    as process ID, process name, and process type.11)We can obtain storage information,
    such as device ID, device type, and file system type.12) Can obtain file system
    information, such as index, mount point, remote mount point, and access permissions.13)
    Can obtain device information, such as device ID number, type, and status.14)
    Can Obtain software component information, such as .Net framework, Visual C++2008,
    etc.What Next?With this, we have completed an important part of the information
    gathering procedure during penetration testing. With all this acquired data we
    need to analyse them to obtain or create a workflow that will work. To make this
    procedure easy for you we are going to explain Maltego tool with detailed instructions.
    Follow along!Chapter 16Information analysis and sorting![](Image00004.jpg)By using
    the methods described above, a large amount of information about the target host
    can be collected. In order to facilitate the subsequent implementation of penetration
    testing, users need to sort and analyse this information. At this point, users
    can analyse and organise the information with the help of Maltego tools.This section
    will introduce the use of Maltego tools to analyse and organise information.Configure
    MaltegoMaltego is a very powerful information gathering tool. Not only can it
    automatically collect the required information, but it can also visualise the
    collected information and can present the results to users in a graphical way.
    Kali Linux has installed the Maltego tool by default so users can use it directly.
    However, before using the tool, you need to do a simple configuration, such as
    registering an account and selecting a startup mode. The following section will
    introduce the configuration of the Maltego tool.1) Register an accountWhen users
    use Maltego tools, they need to log in to its official website. Therefore, you
    need to register an account before starting the tool.The address of the registered
    account is as follows:https://www.paterva.com/web7/community/community.phpWhen
    the user successfully visits the above address in the browser, the dialog box
    with field boxes will be displayed.Fill in the correct information in this dialog
    box, and select the "Perform human-machine authentication" check box. A picture
    verification dialog box will pop up. In this dialog box, select the corresponding
    picture according to the prompts, and then click the "Verify" button. After the
    verification has been successful, the dialog box shown for registration will be
    displayed.At this point, click the Register! button to complete the registration.
    At this time, you will receive an email from the mailbox you used to register
    your account. Log in to your mailbox to activate your account.2) Set the Maltego
    modeMaltego provides two modes, namely Normal Privacy Mode (normal privacy mode)
    and Stealth Privacy Mode (concealed privacy mode). Among them, the Normal Privacy
    Mode mode can obtain more information. Moreover, users are allowed to directly
    use data on the Internet, such as physical pictures and website information. Stealth
    Privacy Mode is more used to analyse information simply, especially when the current
    computer has no network. Using this mode, it will not be possible to obtain data
    directly from the Internet. So in order to get more information, it is recommended
    to select Normal Privacy Mode. The following section will introduce the specific
    method of setting the Maltego mode.Use-case scenario:Set the Maltego mode to Normal
    Privacy Mode. The specific steps are as follows:1) In the menu bar of the graphical
    interface, select "Applications"|"Information Collection"|maltego command. In
    turn, the Maltego product selection dialog box will be displayed.2) The available
    Maltego products are displayed in this dialog box, including Maltego XL, Maltego
    Classic, Maltego CE (Free) and Maltego CaseFile (Free). Among them, Maltego XL
    and Maltego Classic are charged whereas Maltego CE and Maltego CaseFile are free.
    Here we will select the free Maltego tool and click the run button3) This dialog
    box displays the license agreement information. Select the Accept check box, and
    then click the Next button. The login dialog box will be displayed.4) Enter the
    previously registered account information (email address, password and verification
    code) in this dialog box to log in to the Maltego server. Then click the Next
    button.A dialog box will appear5) This dialog box shows the result of login. From
    this dialog box, you can see the login user name, email address, and login time.
    Then click the Next button, a dialog box for installing Transforms will be displayed.6)
    This dialog box displays information about application services, Transforms, entities,
    and hosts to be installed. Then click the Next button to display another dialog
    box.7) In this dialog box, you can set whether to enable the automatic error report
    function or not. If you want to enable it, select the Automatically send Error
    Reports checkbox. If you don''t want to enable it, just click the Next button.
    After clicking the Next button, the privacy mode selection dialog box will be
    displayed.8) In the dialog box, select Normal mode, and then click the Next button.9)
    You can see from this step that Maltego is ready. At this point, the user can
    use the Maltego tool to collect information. There are 3 methods provided by default
    here, namely to Open a blank graph and let me play around (open a blank graph),
    Open an example graph (open an example graph) and Go away, I have done this before!
    . Here, choose the first running method Open a blank graph and let me play around,
    which will open the interface.10) Seeing this interface means that Maltego has
    been successfully started and a new chart has been opened. Next, the user can
    select any entity and drag it to the chart to analyse and organise the collected
    information.Using Maltego toolThrough the previous configuration, the Maltego
    tool can be used normally. Users can use the Maltego tool to organise and analyse
    the previously collected information. Moreover, you can also use Maltego''s Transforms
    to get more information. A large number of entities are provided in Maltego to
    represent information nodes. For example, the domain name information can use
    the Domain entity to represent a domain name. The following section will introduce
    the method of using Maltego tools to organise and analyse information.'
