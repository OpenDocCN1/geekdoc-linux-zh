    # 1. 工具仓库


    Kali Linux 系统提供了一个强大的工具仓库，并预装了许多渗透测试软件，例如 `Nmap`（端口扫描器）、`Wireshark`（包分析器）、`John
    the Ripper`（密码破解器）和 `Aircrack-ng`（无线局域网渗透测试软件）。如果用户使用其他操作系统，需要手动安装相关工具。渗透测试通常大量的工具，收集这些工具并非易事，且代码安全性也无法保证。此外，如果用户手动安装，可能需要配置复杂的环境。如果用户想要更简单、快速地实现渗透测试，Kali
    Linux 是最佳选择。如果你对 Kali Linux 不满意，还有一个名为 Parrot Linux 的安全专家替代方案。然而，本书将使用 Kali Linux
    来介绍攻击概念。


    # 2. 持续更新


    Kali Linux 系统的更新速度较快，稳定版每 3 个月更新一次，每周会发布更新版本。因此，用户可以随时更新并尽早使用新系统和最新工具。此外，操作系统的更新非常方便，无需用户手动更新。


    # Kali Linux 的历史


    为了让读者对 Kali Linux 系统有更深入的了解，在这里我们将介绍它的发展历史。


    ## 1) 曾称为 BackTrack Linux


    BackTrack Linux 是一套专业的计算机安全监控 Linux 操作系统，简称 `BT`。BackTrack 不仅用作监控平台（WarDriving），还集成了超过
    200 种安全渗透工具，包括 `Metasploit`。此外，大量的 RFID 工具以及对 `ARM` 平台的支持也是它的亮点。目前，BackTrack 已被
    Kali Linux 取代且不再进行维护。


    ## 2) 历史版本


    Kali Linux 自发布以来有 4 个版本代码，即 `moto`、`kali`、`sana` 和 `kali-rolling`。其中，每个版本代码代表
    Kali Linux 的一个不同版本。用户可以通过修改软件源中的版本代码来更新到对应版本的系统。


    # 渗透测试人员的法律边界


    在实施渗透测试时，获得准确的书面授权非常重要。如果不明确，可能会导致用户面临法律诉讼，并且更有可能因此而入狱。


    ## 获取法律授权


    在对目标主机进行渗透测试时，渗透测试者首先需要获得目标所有者赋予的法律授权。这样可以避免因非法渗透测试引起的不必要的法律纠纷和其他问题。


    ## 部分操作的危害性


    在渗透测试过程中，某些操作具有特定的危害，例如占用系统资源和留下后门。因此，渗透测试者需要提前正式通知目标主机所有渗透测试可能产生的影响，并要求对方确认。


    # 总结：


    - 我们对渗透测试进行了简单介绍，并介绍了所执行的不同类型的测试。

    - 解释了渗透测试过程，并对其所有阶段进行了清晰介绍。

    - 介绍了 Kali Linux 及其历史。

    - 提供了需要认真对待的法律边界信息。


    '
