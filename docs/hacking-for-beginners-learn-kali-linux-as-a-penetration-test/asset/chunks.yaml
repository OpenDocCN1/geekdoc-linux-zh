- fmt: "\n# Chapter 41 Creating a Dictionary for Bruteforcing\n\n![](Image00007.jpg)\n\
    \nIn the previous chapters of this module we have discussed about wireless hacking.\
    \ As wireless networks passwords are well used in almost every part of the technology.\
    \ Websites, Operating systems, online servers and a lot other devices use passwords\
    \ to secure the information. As a hacker trying to crack these passwords is a\
    \ challenging task. Now a days, people are being aware and are using strong passwords.\
    \ However, there are still lakhs of people who are unaware of this and if tried\
    \ can help us. This chapter introduces to Brute force cracking in detail. Follow\
    \ along!\n\n## Creating a Password Dictionary\n\nThe dictionary here is the password\
    \ dictionary. If you want to implement a password attack, a password dictionary\
    \ is essential. Users can collect and analyse password information to create a\
    \ more reasonable password dictionary. Doing so can not only increase the cracking\
    \ success rate, but also shorten the cracking time. This section will introduce\
    \ how to create a dictionary.\n\n### Password information collection\nBefore creating\
    \ a password dictionary, you can collect passwords. For example, you can collect\
    \ information such as email addresses, website blog posts, Twitter posts, unit\
    \ names, and personnel names related to the target. Because most users will use\
    \ the simplest password for the convenience of remembering, or use personal related\
    \ information (such as unit name, house number, etc.) as the password. At this\
    \ point, if this information is collected and added to the dictionary file, the\
    \ cracking success rate can be improved.\n\n### Cryptographic policy analysis\n\
    The password policy means that the system imposes various restrictions on the\
    \ password set by the user, such as not using only numbers, continuous numbers\
    \ and English letters, etc. For example, some software or systems will have corresponding\
    \ password policies to improve their security. At this point, the user can create\
    \ a password dictionary in a targeted manner by analysing the password policies\
    \ of these devices. The following section will introduce the password policy analysis\
    \ method.\n\n#### 1) Software/system inherent strategy\nThe inherent strategy\
    \ refers to the password strategy built into the software/system itself. For the\
    \ sake of safety, some software/systems have fixed strategies to avoid being easily\
    \ cracked. If the software/system has inherent policies, users will be reminded\
    \ of the minimum password length and complexity requirements when registering\
    \ an account.\nFor example, when installing an Oracle database, the user will\
    \ be reminded whether the password set is complex enough. When the Linux operating\
    \ system is installed, it will be prompted to set the root user password. At this\
    \ point, the user can create a dictionary corresponding to the strategy by analysing\
    \ the inherent strategy of the software/system.\n\n#### 2) Reinforcement strategy\n\
    Hardening strategies refer to additional recommended standards for software/systems.\
    \ For example, in Windows systems, group policies are used to reinforce password\
    \ policies, allowing users to set more secure passwords. At this point, users\
    \ can use group policy analysis tools to analyse password policies and then build\
    \ a stronger password dictionary. The following section will introduce how to\
    \ use the group policy analysis tool to analyse the password policy.\n\n## Use\
