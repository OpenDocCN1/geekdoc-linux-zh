    # Chapter 19: Configuring and Attacking using Nessus


    ![](Image00005.jpg)


    Before using Nessus to perform vulnerability scanning, you need to create a new
    scanning strategy and a scanning task. In order to successfully scan for various
    vulnerabilities later, the following section will introduce the method of creating
    new strategies and scanning tasks.


    ## Create a new strategy


    For the same type of target, the scan operation performed each time is basically
    the same. In order to simplify the setup operation, Nessus provides a scanning
    strategy. The scanning policy specifies what actions need to be performed during
    the scan. Nessus provides multiple strategy templates. Users can create their
    own scanning strategies based on these templates.


    To create a new strategy follow the specific steps shown below:


    1. Log in to the Nessus service. Enter `https://exampleserver:8834/` in the address
    bar of the browser, and the login interface of Nessus will be displayed.

    2. Enter the user name and password created earlier in this interface, and then
    click the `Sign In` button. The main interface of Nessus will be displayed to
    start creating your own custom strategy.

    3. Select the `Policies` option in the left column, and the policy interface that
    is available will be displayed.

    4. Click the `New Policy` button in the upper right corner, so that the policy
    template interface will be displayed.

    5. Select the type of policy template to be created in this interface. Among them,
    if `UPGRADE` information is displayed in the icon, it means that the home version
    is not available to be used. Click here to select the `Advanced Scan` policy template,
    so that the setting dialog box for the new policy will be displayed.

    6. Set the policy name and description information (optional) in this dialog box.
    The policy name should be named according to the task that is being performed.
    Then click the `Plugins` tab, and the vulnerability plug-in selection dialog box
    will be displayed.

    7. All plug-in programs are displayed in this dialog box. From this dialog box,
    you can see that these plug-in programs are all activated by default. In order
    to be able to scan for more vulnerabilities, it is recommended to enable all plug-ins.


    If there is a specific target system, you can choose to enable the corresponding
    vulnerability plug-ins, which can further save scanning time and network resources.
    In the dialog box, click the `Disable All` button in the upper right corner to
    disable all started plug-in programs. Then, set the required plug-in program to
    start. Such as manually starting the `Debian Local Security Checks` and `Default
    Unix Accounts` plug-in program.


    1. After the user has set the vulnerability plug-in to be used, click the `Save`
    button to see the created scanning strategy.

    2. From the interface, you can see the newly created strategy, indicating that
    the strategy has been created successfully. You can use this to attack different
    hosts and scan vulnerabilities that are often undetected manually.

