    contracts and other details to reach a consensus agreement. This stage is the
    basis and key to subsequent penetration testing.2) Information collectionAfter
    determining the goal and scope of the penetration test, the next step is to enter
    the information collection stage. At this stage, penetration testers need to use
    various public resources to obtain as much information as possible about the test
    target. During this time, penetration testers can use the Internet to collect
    information, such as official websites, forums, and blogs.At the same time, you
    can use major search engines to obtain relevant information, such as Yahoo and
    Google. You can also use some tools in Kali Linux to collect DNS information,
    registrant information, service information, WAF information. The more sufficient
    information collected at this stage, the more beneficial it is for subsequent
    penetration testing, and the success rate of penetration testing will also be
    greatly improved.As a saying goes by a famous pen tester" If you want to be a
    good penetration tester then spend 70% of your time collection information about
    your target"3) Vulnerability scanningAfter the penetration tester has collected
    enough information, the target can be scanned for vulnerabilities. At this stage,
    the penetration tester probes the target system through the network, sends data
    to the target system, and matches the feedback data with the built-in vulnerability
    signature database, and then lists the security vulnerabilities in the target
    system.4) Vulnerability exploitationAfter the penetration tester detects the vulnerability
    of the target host, he can infiltrate the target system through the existing vulnerability
    exploitation program. However, in general, penetration testers need to take into
    account the environment of the target system to modify and collect additional
    research to the exploit program, otherwise it will not work properly.5) Prepare
    reportsAfter completing the penetration test, you need to write a test report
    for this penetration test. The prepared report needs to include all kinds of valuable
    information obtained, as well as the security vulnerabilities detected and unearthed,
    the successful attack process, and the impact and consequence analysis on the
    business. At the same time, it is necessary to clearly write out the vulnerabilities
    in the target system and the ways to repair the vulnerabilities. In this way,
    the target user can patch these vulnerabilities and risks based on the report
    provided by the penetration tester to prevent hacker attacks.Overview of Kali
    Linux SystemKali Linux is a Linux distribution based on Debian, including many
    security and forensics related tools. It is maintained and funded by Offensive
    Security Ltd.This section will introduce the reasons for using Kali Linux in the
    book and the development history of the system.If you want to use the Kali Linux
    system to perform penetration testing, you must first install the system. It is
    moderately difficult to install this Linux distro on your own. So, we included
    a separate chapter for helping you understand the procedure to install Kali Linux
    in your personal computer.Why to use Kali Linux?Kali Linux is released mainly
    for digital forensics and penetration testing specialists. There are two main
    reasons for using Kali Linux system to implement penetration testing in this book.'
