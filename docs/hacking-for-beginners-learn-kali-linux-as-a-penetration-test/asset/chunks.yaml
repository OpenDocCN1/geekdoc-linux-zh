  trans: "\n\n# 添加软件源\n\n在用户对软件源的概念和格式有清晰了解后，就可以添加软件源。本节将介绍 Kali Linux 中的官方软件源和常用的第三方软件源。\n\
    \n## 1) 官方软件源\nKali Linux 官方源以及由官方重定向的软件源通常相对稳定，但速度不一定快。其中，Kali 的官方源如下：\n\n`deb\
    \ http://http.kali.org/kali kali-rolling main non-free contrib`\n\n## 2) 常用的第三方软件源\n\
    由于 Kali 的官方源是国外网站，国内用户在使用时可能会遇到网络不稳定问题，可能导致软件包安装失败。此外，下载速度仍然较慢。此时，用户可以尝试添加第三方软件源。针对不同的国家和地区有很多镜像站可用。你可以通过快速\
    \ Google 搜索找到可用第三方源列表。此外，你也可以使用种子（torrent）发行 Linux 镜像文件。这在任何方面都不是违法的，并且可以帮助你快速下载软件。\n\
    \n## 3) HTTP 和 HTTPS 的选择\n出于安全考虑，这些软件源目前支持 `HTTPS` 协议。要使用 `HTTPS` 协议的软件源，只需将 URL\
    \ 地址中的 `http` 改为 `https` 即可。\n\n`deb https://http.kali.org/kali kali-rolling main\
    \ non-free contrib`\n\n由于加密问题，`HTTPS` 下载软件的速度较慢，但可以避免缓存服务器的影响。因此，如果用户在安装软件时因为缓存服务器导致下载失败，可以通过将软件源修改为\
    \ `HTTPS` 来重新安装软件。\n\n## 4 deb-src 软件源\n某些软件不提供二进制包，只提供源代码。对于这类软件，必须添加 `deb-src`\
    \ 软件源。下载后，它将在用户的计算机上自动编译并生成执行文件。其中，`deb-src` 软件源格式如下：\n\n`deb-src http://http.kali.org/kali\
    \ kali-rolling main non-free contrib`\n\n# 更新软件源/系统\n用户配置好软件源后，需要使用 `apt-get update`\
    \ 命令更新软件源，使配置生效。用户也可以通过更新软件源来快速更新系统。本节将介绍更新软件源和更新系统的方法。执行命令如下：\n\n```bash\nroot@exampleserver:～#\
    \ apt-get update\n```\n\n从上面的输出可以看出，软件源已成功更新。执行命令如下：\n\n```bash\nroot@exampleserver:～#\
    \ apt-get dist-upgrade R\n```\n\n上面的输出信息中显示了更新的包信息，包括要升级的包、新安装的包和已卸载的包。此时输入 `Y`\
    \ 继续操作。如果后续操作过程中没有错误消息，则系统更新将成功。更新完成后，重启系统，即加载新系统。\n\n用户也可以使用图形界面来更新操作系统。具体步骤如下：\n\
    \n1. 点击左侧收藏夹中的 Show all programs（显示所有程序）按钮打开所有程序界面，并点击 Software（软件）按钮显示对话框。\n\
    2. 在此对话框的 Update (U)（更新）选项卡中，可以看到更新提示。此时，点击 Operating System Update（操作系统更新）选项以查看需要更新的软件包。\n\
    3. 需要更新的软件包显示在此界面中。此时，点击右上角的关闭按钮返回软件更新对话框。然后，点击 Download (D)（下载）按钮开始下载更新的软件包。下载完成后，将显示对话框。\n\
    4. 点击右上角的 Restart and Update（重启并更新）按钮，会弹出 Restart and Install Update（重启并安装更新）对话框。\n\
    5. 点击 Restart and Install（重启并安装）重启系统并更新软件包。\n6. 此界面显示正在安装的更新包。更新完成后，系统将自动重启。\n\
    \n# 从软件源安装软件\n用户配置软件源后，就可以安装软件源中提供的所有软件。本节将介绍安装软件源中的软件。\n\n## 确认包名\n用户安装软件时，需要知道包名。如果不确定其名称，可以使用\
    \ Kali Linux 中的几个命令来搜索包名。确认包名的方法说明如下。\n\n### 什么是软件包？\n软件包指的是具有特定功能以完成特定任务的程序或一组程序。软件包由一个基础组件和若干个可选组件组成，以源代码或目标代码的形式存在。在\
    \ Linux 系统中，软件包主要有两种形式，即二进制包和源码包。其中，最常见的二进制包格式是 `deb`（Debian 系列）和 `rpm`（Red Hat\
    \ 系列）。源码包格式为 `tar.gz`、`tar.bz2` 和 `zip`。\n\n### 根据关键词搜索软件包\n在 Kali Linux 中，用户可以使用\
    \ `apt-cache` 命令根据关键词搜索软件包。其中，命令的语法格式如下：\n\n`apt-cache search package_name`\n\n\
    根据关键词 `pm-` 搜索包名。\n\n```bash\nroot@exampleserver:～# apt-cache search \"pm-\"\n\
    ```\n\n从输出中可以看出，包含 `pm-` 关键词的所有软件包都已搜索。在上面的信息中，分别显示了软件包的名称和功能。通过分析包信息可以确定已安装的包名。\n\
    \n### 根据命令搜索软件包\nKali Linux 提供了 `apt-file` 工具可以根据命令搜索软件包。但默认没有安装该工具。因此，在使用此工具前需要安装。执行命令如下：\n\
    \n```bash\nroot@exampleserver:～# apt-get install apt-file\n```\n\n执行上述命令后，如果没有报错，则安装成功。接下来可以使用该工具根据命令搜索软件包。语法格式如下：\n\
    \n`apt-file search [pattern]`\n\n搜索软件包 `arpsof`的位置。\n\n```bash\nroot@exampleserver:～#\
    \ apt-file search arpsof\n```\n\n从输出信息中可以看到名为 `arpsof` 的软件包。\n\n### 查看包结构\n用户安装某些软件后，如果不确定软件包安装的位置，可以使用\
    \ `apt-file` 命令查看包结构。此外，用户还可以根据包含的文件确认所需的软件包。查看包结构的语法格式如下：\n\n`apt-file list [pattern]`\n\
    \n查看 `dnsenum` 软件包结构：\n\n```bash\nroot@exampleserver:~# apt-file list dnsenum\n\
    ```\n\n从输出信息中可以看到 `dnsenum` 的结构。从显示结果可以看到 `dnsenum` 工具安装在 `/usr/bin`。也可以知道帮助文档在\
    \ `/usr/share/doc/dnsenum`。\n\n# 安装/更新软件\n用户确定软件包名称后即可安装。此外，如果系统中已安装软件，用户也可以更新它。安装和更新软件的方法如下。\n\
    \n## 1) 安装软件\n在 Kali Linux 中，`apt-get install` 命令主要用于安装软件。命令语法格式如下：\n\n`apt-get\
    \ install [package_name]`\n\n以下以 `StarDict` 软件包为例。`StarDict` 是一个著名的字典框架，可以查询单词。当然，用户也可以加入翻译工具，如\
    \ Oxford 字典。执行命令如下：\n\n```bash\nroot@exampleserver:～# apt-get install stardict\n\
    ```\n\n执行上述命令后，如果没有报错，则 `StarDict` 工具安装成功。此时，用户可以将其他翻译工具的词典文件（`.dict`, `.idx`）拷贝到\
    \ `/usr/share/stardict/dic` 目录。\n\n## 2) 更新软件\n如果软件已更新但 Kali Linux 中仍在使用旧版本，用户可以通过重新安装软件来尽快体验新功能。例如，更新\
    \ `wpscan` 工具，执行命令如下：\n\n```bash\nroot@exampleserver:～# apt-get install wpscan\n\
    ```\n\n从上面的输出信息可以看出，软件包已升级。从显示结果可以看到 `wpscan` 工具已从版本 3.4 升级到 3.5。上述方法仅更新特定软件。如果用户想更新所有软件，执行命令如下：\n\
    \n```bash\nroot@exampleserver:～# apt-get upgrade\n```\n\n执行上述命令后，当前系统中需要升级的所有软件包将会被升级。\n\
    \n## 删除软件\n当用户不需要某个软件时，可以删除。删除软件的语法格式如下：\n\n`apt-get remove [package_name]` #\
    \ 卸载包\n或\n`apt-get purge [package_name]` # 卸载并清除包配置\n\n卸载 `apt-file` 软件。执行命令如下：\n\
    \n```bash\nroot@exampleserver:～# apt-get remove apt-file\n```\n\n看到上面的输出信息意味着\
    \ `apt-file` 软件已成功卸载。\n\n# 安装虚拟机增强工具\n为了方便物理机和虚拟机之间拷贝文件，需要安装虚拟机增强工具。`open-vm-tools`\
    \ 是适用于 VMware 虚拟机的增强工具。它提供了 VMware 驱动来增强虚拟图形和硬盘性能，并同步虚拟机与主机的时钟。只有在 VMware 虚拟机安装了\
    \ `open-vm-tools` 工具，才能实现文件共享并支持自由拖放。鼠标也可以在虚拟机和主机之间自由移动（无需再次按 `Ctrl+Alt` 快捷键）。本节描述如何安装虚拟机增强工具。\n\
    \n在 Kali Linux 中安装 `open-vm-tools`。执行命令如下：\n\n```bash\nroot@exampleserver:～# apt-get\
    \ install open-vm-tools-desktop\n```\n\n执行上述命令后，将安装 `open-vm-tools` 工具。安装完成后重启电脑。重启后，用户可以在物理机和虚拟机之间自由移动、复制和粘贴文件。\n\
    \n# 第 7 章 Kali 中的第三方软件安装\n![](img/Image00002.jpg)\nKali Linux 系统默认安装许多渗透测试软件。但某些渗透测试工具未安装（如\
    \ `Nessus`），需要下载并安装。通常获取的软件包格式包括 `.deb`、`.tar.gz`、`.tar.bz2` 和 `.zip`。为了满足需要，本节将介绍这些格式软件包的安装方法。\n\
    \n## 安装二进制软件\n二进制包包含编译好的程序，可以直接运行。用户只需下载并解压（安装）即可。在 Linux 系统中，二进制软件有两种格式：`RPM`\
    \ 是基于 Red Hat 发行版的后缀 `.rpm`，而 `DEB` 是基于 Debian 的后缀 `.deb`。Kali Linux 基于 Debian，因此其二进制包格式为\
    \ `.deb`。以下介绍安装方法。\n\n1. 下载与操作系统架构相同的二进制包。例如 `Nessus` 的下载地址为 `https://www.tenable.com/downloads/nessus`。示例下载的包名为\
    \ `nessus-8.3.1-debianamd64.deb`。\n2. 安装 `Nessus` 工具。执行命令如下：\n\n```bash\nroot@exampleserver:～#\
    \ dpkg -i nessus-8.3.1-debianamd64.deb\n```\n\n看到上面的输出信息意味着 `Nessus` 工具已安装。接下来用户可以使用该工具进行漏洞扫描。\n\
    \n## 安装源码包\n源码包包含源代码，需要用户编译生成可运行程序。在 Linux 中，常见的源码包格式是 `.tar.gz` 和 `.tar.bz2`。如果要安装这些包，需要使用\
    \ `tar` 命令解压，然后配置并安装。解压 `.tar.gz` 源码包的语法格式如下：\n\n`tar zxvf source file [-C target\
    \ directory]`\n\n解压 `.tar.bz2` 源码包的语法格式如下：\n\n`tar jxvf source file [-C target\
    \ directory]`\n\n在上述语法中，`-C target directory` 指定解压位置。如果不指定，默认解压到当前目录。本节以中间人攻击工具为例演示\
    \ `.tar.gz` 格式源码包的安装方法。\n\n1. 去网站 `http://code.google.com/p/subteruge/downloads/list`\
    \ 下载 `subteruge`。包名为 `subteruge_packages.tar.gz`。然后将下载的包拷贝到 Kali 系统。\n2. 解压下载的软件包。执行命令如下：\n\
    \n```bash\nroot@exampleserver:～# tar zxvf subteruge_packages.tar.gz\n```\n\n成功解压\
    \ `subteruge` 包后，所有文件将解压到 `subteruge` 目录。\n3. 安装 `subteruge` 工具。执行命令如下：\n\n```bash\n\
    root@exampleserver:～# cd subteruge\nroot@dueba:～/subteruge# python install.py\n\
    ```\n\n执行上述命令后，将显示界面。\n4. 在界面中选择 Install With Dependencies（带依赖项安装）单选按钮，然后点击 Install\
    \ 安装。安装完成后，将显示额外设置的界面。\n5. 从此界面可以看到弹出一个小对话框，显示 `subteruge` 安装完成。此时点击 Finish 完成安装。\n\
    \n以下以 Firefox 浏览器为例演示 `.tar.bz2` 包格式软件包的安装。\n\n1. 下载 Linux 版 Firefox 软件包。示例下载的包名为\
    \ `Firefox-latest-x86_64.tar.bz2`。提示：下载 Firefox 软件时必须根据用户的硬件架构进行选择。示例下载的是 64 位架构包。\n\
    2. 解压软件包。执行命令如下：\n\n```bash\nroot@exampleserver:～# tar jxvf Firefox-latest-x86_64.tar.bz2\
    \ -C /usr\n```\n\n执行上述命令后，Firefox 软件包中的所有文件将解压到 `/usr` 目录。其中解压文件名为 `firefox`。\n\
    3. 进入解压后的 `firefox` 目录，你会看到一个名为 `firefox` 的执行文件。使用该执行文件启动 Firefox 浏览器的方法如下：\n\n\
    ```bash\nroot@exampleserver:～# cd /usr/firefox\nroot@exampleserver:/usr/firefox\n\
    ```\n\n从上述结果可以看出，可以使用执行文件 `firefox` 浏览器。\n\n# 执行软件\n当用户成功安装软件后，即可启动相应的工具。其中某些软件可以通过命令行或图形界面启动，另一些软件使用执行脚本启动。本节将分别介绍这两类软件的启动方法。\n\
    \n## 普通软件\n通常启动普通软件的方法是通过命令行和图形界面。此外，Kali Linux 系统提供了 Alt+F2 快捷键打开提示框，用户可以在其中输入任何命令执行。本节将介绍普通软件的几种启动方法。\n\
    \n### a) 图形界面模式\n通过图形界面方法启动。本节以 Wireshark 软件为例。\n\n1. 在图形界面中通过“Applications”（应用程序）|“Sniffing/Spoofing”（嗅探/欺骗）菜单选择\
    \ Wireshark。\n2. 选择后 Wireshark 成功启动，用户可以使用其捕获数据包。\n\n### b) 命令行模式\n通过命令行方法启动。本节以\
    \ Metasploit 框架为例。执行命令如下：\n\n```bash\nroot@exampleserver:～# msfconsole\n```\n\n\
    从输出信息中显示了 `msf >`，说明 Metasploit 工具已启动。\n\n### c) 命令行提示\n用户可以使用命令行提示运行某些软件。本节以\
    \ Diruster 软件为例。\n\n1. 使用 Alt+F2 快捷键启动命令行提示。\n2. 在界面中输入命令启动软件。\n\n# 执行脚本\nKali\
    \ Linux 系统中，某些软件安装后通过脚本启动。本节将介绍几种脚本启动方法。\n\n### a) 执行 Ruby 脚本\n用户执行 Ruby 脚本时，可能会遇到缺少库的问题。此时用户需要使用\
    \ `gem` 命令安装库。安装库的语法格式如下：\n\n`gem install [package]`\n\n然后使用 `ruby` 命令执行其脚本：\n\
    \n```bash\nroot@exampleserver:～# ruby hello.rb\n```\n\n### b) 执行 Python 脚本\n用户执行\
    \ Python 脚本时，可能会缺少依赖包。Kali Linux 提供了两个版本的 Python，即 Python 2 和 Python 3。如果想为 Python\
    \ 3 安装依赖包，需要使用 `pip3` 命令。但 `pip3` 命令默认未安装，因此在使用此工具前需要先安装它。执行命令如下：\n\n```bash\n\
    root@exampleserver:～# apt-get install python3-pip\n```\n\n执行上述命令后，如果没有报错，则 `pip3`\
    \ 安装成功。接下来可以安装 Python 3 的依赖。例如，安装 KaliOut 工具依赖的包：\n\n```bash\nroot@exampleserver:～#\
    \ pip3 install scapy netifaces\n```\n\n上述过程下载并安装了 KaliOut 工具依赖的包。从最后一行信息可以看到上述依赖包已成功安装。\n\
    \n### c) 执行 Perl 脚本\n用户执行 Perl 脚本时，可能会遇到缺少 Perl 模块的问题。此时用户需要使用 `cpan` 命令安装，然后执行对应的脚本。例如，使用第三方工具\
    \ `7zhashcat` 需要 `Compress::Raw::Lzma` 组件。在这种情况下，需要使用 `cpan` 命令安装该组件。`cpan` 工具包含在\
    \ `perl-doc` 包中，需要先安装它。执行命令如下：\n\n```bash\nroot@exampleserver:～# apt-get install\
    \ perl-doc\n```\n\n### d) 执行 Shell 脚本\nShell 脚本执行相对简单，用户只需添加执行权限。例如这里名为 `test.sh`\
    \ 的 Shell 脚本，添加执行权限后即可执行。\n\n1. 添加执行权限。执行命令如下：\n\n```bash\nroot@exampleserver:～#\
    \ chmod +x test.sh\n```\n\n执行上述命令后，没有信息输出。\n2. 如下方法执行 `test.sh` 脚本：\n\n```bash\n\
    root@exampleserver:～# ./test.sh\n或\nroot@exampleserver:～# sh test.sh Hello World!\n\
    ```\n\n可以看到有一行输出，表示 `test.sh` 脚本已成功执行。\n\n# 第 8 章 驱动安装\n![](img/Image00002.jpg)\n\
    驱动是添加到操作系统的特殊程序。驱动包含硬件设备信息，这些信息使计算机能够与相应设备通信。当计算机添加硬件设备时，必须安装相应的驱动，否则设备无法使用。对于\
    \ Kali Linux 系统，由于内核较新，可以支持大多数设备驱动。但对于某些设备，用户有时需要手动安装驱动，例如显卡驱动。本节介绍如何查看设备驱动信息并安装驱动。\n\
    \n提示：由于安装驱动存在风险，建议在安装前备份重要数据。\n\n## 查看设备\n安装驱动前，用户可以使用 `lsusb` 和 `lspci` 命令查看\
    \ USB 或 PCI 设备的详细信息，以判断驱动是否已正确加载。\n\n### a) 查看 USB 设备\n用户实现无线测试时，通常需要 USB 网卡。当用户将设备连接到系统时，可以使用\
    \ `lsusb` 命令查看设备列表：\n\n```bash\nlsusb\n```\n\n上述输出信息显示了 USB 设备列表。输出信息包括总线号、设备号和厂商\
    \ ID。通过分析厂商 ID，可以知道设备是 Realtek Semiconductor（瑞昱半导体）的 USB 设备。用户还可以使用 `lsusb -v`\
    \ 命令查看设备详情：\n\n```bash\nroot@exampleserver:～# lsusb -v\n```\n\n执行上述命令后，由于空间限制，仅给出了第一个\
    \ USB 设备的详细信息。从输出信息可以看到 USB 设备。\n\n### b) 查看 PCI 设备\nPCI（外设组件互连）是目前个人电脑最广泛使用的接口，几乎所有主板都有\
    \ PCI 设备，如声卡、网卡和显卡。Kali Linux 提供 `lspci` 命令查看系统中的 PCI 设备列表。执行命令如下：\n\n```bash\n\
    root@exampleserver:～# lspci\n```\n\n上述输出信息显示了系统中的所有 PCI 设备。从输出信息可以看到 PCI 设备如主板芯片、插槽、显卡。用户可以使用带有\
    \ `-v` 选项的 `lspci` 命令确认设备是否正确驱动，执行命令如下：\n\n```bash\nroot@exampleserver:～# lspci\
    \ -v\n```\n\n执行上述命令后，可以看到 PCI 设备的详细信息。从输出信息可以看到每个 PCI 设备的驱动。例如，当前系统的显卡驱动为 `gfx`。\n\
    \n### c) 虚拟机使用 USB 设备\n用户实现无线测试时，必须使用网卡。但通常系统内置网卡不支持无线监控，因此用户必须通过 USB 网卡来实现。如果是物理机，用户可以直接插入\
    \ USB 设备；如果是虚拟机，用户需要手动连接并启动虚拟机的 USB 服务（VMware USB Arbitration），否则无法识别连接设备。本节以\
    \ USB 网卡为例介绍在虚拟机中使用 USB 设备的方法。具体步骤如下：\n\n1. 虚拟机 USB 服务。右键点击桌面上的 Computer（计算机）图标，选择\
    \ Manage（管理）|Services and Applications（应用程序和服务）|Services 命令打开菜单。\n2. 在服务中找到 VMware\
    \ USB Arbitration Service，并确认服务已启动。接下来将 USB 网卡插入物理机，会弹出对话框。检测到一个新 USB 设备，名为 `Ralink\
    \ 802.11n NIC`。此时，用户可以选择连接到主机或虚拟机。选择连接方法后，点击 OK 按钮连接。如果用户选择 Connect to a virtual\
    \ machine（连接到虚拟机）按钮，可以通过 USB 设备连接到虚拟机。如果选择 Connect to Host（连接到主机）按钮，然后选择虚拟机菜单中的\
    \ Removable Device（可移动设备），也可以连接设备到虚拟机。\n4. 在菜单栏选择 Realtek 802.11n NIC | Connect\
    \ (disconnect from the host)（连接（断开主机连接）(C) 命令，弹出对话框。\n5. 从对话框可以看到 USB 设备将从主机拔掉并连接到虚拟机。此时点击\
    \ OK 按钮成功连接 USB 网卡到虚拟机。接下来，用户可以使用 USB 网卡连接无线网络或进行无线测试。\n\n# 安装先决软件包\n对于 Linux\
    \ 操作系统，驱动主要由内核包含，事实上，大部分代码是各种设备的驱动。除了独立的显卡和网卡驱动外，大多数设备使用开源驱动。对于通用设备，只要内核版本足够新，基本上不需要安装额外驱动。因此，内核头文件是安装驱动的必要软件包。本节介绍内核头文件的安装。执行命令如下：\n\
    \n```bash\nroot@exampleserver:～# apt-get install linux-headers-$(uname -r)\n```\n\
    \n# 安装开源显卡驱动\nKali Linux 默认使用开源驱动 `Nouveau` 来驱动 Nvidia 显卡。该驱动支持 2D 加速，不支持 3D 加速。如果需要\
    \ 3D 加速，需要安装 Nvidia 官方驱动。安装开源显卡驱动的具体步骤如下：\n\n1. 更新系统获取最新系统内核。否则会导致显卡启动失败。执行命令如下：\n\
    \n```bash\nroot@exampleserver:～# apt-get update && apt-get dist-upgrade\n```\n\
    \n2. 检查显卡总号，执行命令如下：\n\n```bash\nroot@exampleserver:～# lspci | grep -E \"VGA|3D\"\
    \n```\n\n输出 `01:00.0 controller: NVIDIA Corporation GF108 [GeForce GT 440]`，`01:00`\
    \ 是显卡的总号。后续使用 `vi` 创建 `/etc/modprobe.d/nouveau.conf` 文件来禁用 Nouveau 驱动。添加如下内容：\n\
    \n```\nblacklist nouveau\noptions modeset=0\n```\n\n4. 更新内核并重启系统，执行命令如下：\n\n```bash\n\
    root@exampleserver:～# update-initramfs -u\n reboot\n```\n\n注意：重启后，进入图形界面会发现分辨率已更改。如果无法进入图形界面，按\
    \ Ctrl+Alt+F2 或 Ctrl+Alt+F3 快捷键进入文本界面，输入用户名和密码。\n5. 检查 Nouveau 模块是否禁用。执行命令如下：\n\
    \n```\nroot@exampleserver:～# lsmod | grep nouveau\n```\n\n如果没有输出信息，表示禁用成功。如果没有，则需要检查第\
    \ 4 步是否正确。\n6. 安装 Nvidia 驱动。执行命令如下：\n\n```bash\nroot@exampleserver:～# apt-get\
    \ install nvidia-driver\n```\n\n7. 生成 xorg 配置，执行命令如下：\n\n```bash\nroot@exampleserver:～#\
    \ nvidia-xconfig\n```\n\n8. 使用 `vi` 编辑 `/etc/X11/xorg.conf` 文件并添加显卡总号。示例代码如下：\n\
    \n```\nSection \"Device\"\n    Identifier \"nvidia\"\n    Driver \"nvidia\"\n\
    \    BusID \"PCI:1:0\"\n```\n\n注意：此处需要手动添加。由于机器不同，其他代码可能不同。\n9. 如果电脑是双显卡，使用 `vi`\
    \ 创建两个配置文件 `/usr/share/gdm/autostart/optius.desktop` 和 `/etc/xdg/autostart/optimus.desktop`\
    \ 并分别添加内容。\n10. 使用 `reboot` 命令重启 Kali Linux 系统。\n11. 检查显卡驱动类型，执行命令如下：\n\n```bash\n\
    root@exampleserver:～# lspci -v\n```\n\n12. 查看显卡驱动模式，执行命令如下：\n\n```bash\nroot@exampleserver:～#\
    \ nvidia-xconfig --query-gpu-info\n```\n\n13. 安装 CUDA 工具并执行命令如下：\n\n```bash\n\
    root@exampleserver:～# apt-get install libcl1-nvidia-toolkit\n```\n\n# 安装显卡厂商驱动\n\
    用户不仅可以安装开源显卡驱动，还可以安装厂商驱动。本节介绍安装厂商驱动的方法。以下以 Nvidia 显卡为例。具体步骤如下：\n\n1. 检查显卡模型并执行命令如下：\n\
