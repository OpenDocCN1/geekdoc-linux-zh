    whether the hosts 72.132.234.64 , 72.132.234.65 and 72.132.234.66 are online or
    not.The execution command is as follows:root@exampleserver:～# nmap -sP 72.132.234.64-66This
    shows the output about the availability of these 3 servers.2) Use Netdiscover
