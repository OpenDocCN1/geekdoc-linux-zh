    当 `Nmap` 无法确定端口是关闭还是被过滤时，使用此状态。它只会出现在 `IPID` 空闲扫描中。使用 `Nmap` 进行端口扫描的语法格式如下：


    `nmap -p [target]`


    在上述语法中，选项 `-p` 用于指定要扫描的端口。指定的端口可以是单个端口、多个端口或一个端口范围。当指定指定多个扫描端口时，用逗号分隔端口。默认情况下，`Nmap`
    扫描的端口范围是 1 到 1000。


    用场景：

    对目标主机 `192.243.176.84` 执行端口扫描。执行命令如下：

    ```

    root@exampleserver:～# nmap 192.243.176.84 own

    ```

    当在终端上输入此命令时，`Nmap` 工具默认扫描 1000 个端口。它将在输出中显示开放的端口。


    用场景：

    指定端口范围为 1 到 50，并对目标主机 `192.243.176.84` 执行端口扫描。执行命令如下：

    ```

    root@exampleserver:～# nmap -p 1-50 192.243.176.84

    ```

    从输入上述终端后的输出结果中，我们可以看到扫描了 1 到 50 的端口范围。所有开放的端口都将显示。


    用场景：

    指定扫描目标主机的 21 和 23 端口。执行命令如下：

    ```

    root@exampleserver:～# nmap -p 21,23 192.243.176.84

    ```

    这提供了关于命令专门请求的两个部分的详细信息。通过使用这些技术，你可以最大限度地减少通常扫描端口所需的时间。


    ## 2) 使用 `DMitry` 工具

    `DMitry` 工具提供 `-p` 选项来实现端口扫描。实现端口扫描的语法格式如下：


    `dmitry -p [host]`


    这里 `host` 是我们尝试扫描端口的宿主机 IP 地址。


    用场景：

    使用 `DMitry` 扫描目标主机 `192.243.176.84` 上的开放端口。执行命令如下：

    ```

    root@exampleserver:～# dmitry -p 192.243.176.84

    ```

    从输出信息中，你可以看到目标主机上所有开放的端口。从输出的倒数第二行，你可以看到扫描的端口数量和关闭的端口数量。


    ### 接下来做什么？

    尽管端口很重要，但它们仍然难以实现。如今管理员正在使用入侵检测系统，完全依赖它们可能不是好的做法。此外，通过端口，我们可能找不到构建利用程序所需的额外信息。如果我们可以发现目标主机所使用的操作系统，将会有帮助。请继续阅读下一章节了解更多关于操作系统检测的知识。


    ## 第 14 章：识别操作系统

    ![](img/Image00004.jpg)


    通过识别操作系统，可以确定目标主机的系统类型。这样，渗透测试人员就可以以策略性的方法对目标系统的程序进行漏洞检测，以节省不必要的时间。本节将通过重要的示例介绍识别操作系统的方法。


    ### 基于 TTL 的识别

    `TTL`（存活时间），此字段指定了 IP 数据包在被路由器丢弃之前允许通过的最大网络段数。不同的操作系统会有不同的 `TTL` 值响应。因此，用户可以使用
    `Ping` 命令进行系统识别。为了让用户快速确定目标类型，有必要提供每个操作系统的初始 `TTL` 值列表。你可以通过快速 Google 搜索轻松找到它们。


    用场景：

    使用 `Ping` 测试目标主机 `192.243.176.84` 的操作系统类型。目标主机的操作系统类型是 Linux。让我们看看命令是否可以检测到它。执行命令如下：

    ```

    root@exampleserver:～# ping -c 1 192.243.176.84

    ```

    从输出信息中可以看到，响应包中的 `TTL` 值为 `64`。可以推断该主机是 Linux 操作系统。


    用场景：

    使用 `Ping` 测试目标主机 `192.243.176.84` 的操作系统类型。目标主机的操作系统类型是 Windows 7。执行命令如下：

    ```

    root@exampleserver:～# ping -c 1 192.243.176.84

    ```

    从输出信息中可以看到，响应包中的 `TTL` 值为 `128`。可以解释为 Windows 操作系统。提示：如果从本地主机到目标的路由器太多，判断结果可能不准确。


    ### 使用 `NMAP` 识别

    由于 `TTL` 仅是模糊判断，获得的结果可能不准确。`NMAP` 工具提供了检测操作系统的功能。本节将介绍如何使用 `NMAP` 识别操作系统类型。使用
    `NMAP` 识别操作系统的语法格式如下：


    `nmap -O [target]`


    这里 `target` 是我们进行渗透测试时尝试攻击的主机地址。


    用场景：

    使用 `NMAP` 检测目标主机 `192.243.176.84` 的操作系统类型。执行命令如下：

    ```

    root@exampleserver:～# nmap -O 192.243.176.84

    ```

    从输出信息中，我们可以了解到目标主机的操作系统类型被识别为 Microsoft Windows 7/8。虽然无法确定具体是哪一个版本，但会显示更接近的系统版本。虽然
    `Dmitry` 提供相同的功能，但根据我们的经验，它在扫描过程中会出现更多错误。我们强烈建议仅使用 `Nmap` 来查找宿主机操作系统。


    接下来做什么？

    我们将详细介绍识别服务。请继续阅读！


    ## 第 15 章：识别服务

    ![](img/Image00004.jpg)


    识别服务主要是检测服务的版本信息。通常，某些旧版本可能存在漏洞，用户可以渗透主机以获取其他重要信息。本节将介绍如何识别服务以便于利用。


    ### 使用 `nmap` 工具

    `nmap` 工具提供了 `-sV` 选项来识别服务的版本。本节将介绍使用 `nmap` 配合该选项识别服务的技术。使用 `nmap` 识别服务的语法格式如下：


    `nmap -sV [host]`


    上述语法中的 `-sV` 选项意味着实现服务版本检测。


    用场景：

    识别目标主机 `192.243.176.84` 上所有的开放服务和版本。执行命令如下：

    ```

    root@exampleserver:～# nmap -sV 192.243.176.84

    ```

    从输出信息中，我们可以看到识别出的服务相关信息。输出信息包括四列：`PORT`、`STATE`、`SERVICE` 和 `VERSION`。通过分析每一列信息，可以获取对应的服务信息。例如，端口
    `21` 对应 `FTP` 服务，版本为 `FileZilla ftpd`。从输出的倒数第二行看到目标主机名为 `TEST-PC`，操作系统类型为 Windows。


    ### 使用 `smbclient` 工具

    `smbclient` 是一组用于识别网络服务的渗透测试工具，其中 `smbclient` 工具通过发送数据包来识别运行在异常端口的应用程序。本节将介绍使用
    `smbclient` 工具识别服务信息。


    #### 1) 使用 `smbclient` 工具

    `smbclient` 工具可以向 `UDP` 或 `SSL` 端口发送数据以获取信息。使用该工具识别服务的语法格式如下：


    `smbclient -L -U <username> [host][port] -v`


    这里的 `-v` 代表详细模式。


    用场景：

    使用 `smbclient` 工具探测端口 `90`。执行命令如下：

    ```

    root@exampleserver:～# smbclient -L -U root 192.243.176.84 90 -v

    ```

    从显示结果中，可以理解获取的信息写入了触发文件和响应文件中。当用户使用 `smbclient` 工具识别服务时，这些文件将用于获取信息。


    #### 2) 使用 `smbclient` 工具

    `smbclient` 工具可以识别运行在异常端口的应用程序。使用该工具识别服务的格式如下：


    `smbclient -b [host][port]`


    用场景：

    使用 `smbclient` 工具扫描目标主机 `192.243.176.84` 上的 `80` 服务。执行命令如下：

    ```

    root@exampleserver:～# smbclient -b 192.243.176.84 80

    ```

    从输出信息中，可以理解端口 `80` 的服务是 `http` 或 `apache`。从显示信息中可以看到目标运行的 Web 服务是 `Apache`，版本为
    `2.8`。在输出的前三行中，我们看到 `smbclient` 工具使用的触发文件和响应文件。其中，文件名为 `rpc`。


    ### 收集信息

    某些特殊服务可以提供信息。例如，`SMB` 服务可以提供系统结构，而 `SNMP` 服务可以提供目标相关信息。


    ### SMB 服务

    `SMB`（Server Message Block）是一种用于在计算机之间共享文件、打印机、串口等的协议。`SMB` 协议可以在 `TCP/IP` 协议之上工作，也可以在其他网络协议（如
    `IPX`）之上工作。通过获取 `SMB` 服务的文件夹信息，可以了解目标主机的文件系统。本节将介绍使用 `smbclient` 工具获取文件夹信息。`smbclient`
    是 `SMB` 服务的客户端工具，用于访问服务中的共享文件。该工具的语法格式如下：


    `smbclient -L -U <username>`


    上述语法中的选项含义为：

    - `-L`: 用于指定 `SMB` 服务器地址。

    - `-U`: 用于指定登录 `SMB` 服务的用户名。


    用场景：

    在 `Linux` 系统中访问 `SMB` 服务。执行命令如下：

    ```

    root@exampleserver: # smbclient -L -U root 192.243.176.84

    ```

    登录 `SMB` 服务用户密码后将显示需要分析的信息。从输出信息中，你可以看到目标 `SMB` 共享的文件。其中，`Sharename` 代表共享文件的名称，`Type`
    代表磁盘类型，`Comment` 是共享文件的描述。可以解释目标主机的操作系统类型是 `Linux`，共享文件是 `Linux` 文件系统类型。如果目标主机的操作系统是
    `Windows`，文件名列将显示共享文件夹的驱动器号。

    ```

    root@exampleserver:～# smbclient -L -U root 192.243.176.84

    ```

    从上述输出结果的文件可以看出，默认共享磁盘为 `C` 盘和 `E` 盘。只有在 `Windows` 系统中，文件夹以驱动器号的形式划分。可以判断共享文件夹是
    `Windows` 系统类型。


    ### SNMP 服务

    `SNMP`（简单网络管理协议）由一组网络管理标准组成，包括一个应用层协议和一组资源对象。该协议被网络管理系统用于监控网络设备上任何需要管理员注意的情况。通过使用此服务，可以获取主机信息。本节将介绍使用
    `snmpcheck` 工具获取主机信息。`snmpcheck` 工具用于枚举 `SNMP` 设备以获取目标主机。。工具的语法格式如下：


    `snmp-check [target]`


    用场景：

    通过 `SNMP` 协议使用 `snmpcheck` 工具获取 `192.243.176.84` 主机信息。执行命令如下：

    ```

    root@exampleserver:～# snmp-check 192.243.176.84

    ```

    连接成功后，可以获取系统信息。由于上述命令带有大量的输出信息，理解每个部分都非常重要。


