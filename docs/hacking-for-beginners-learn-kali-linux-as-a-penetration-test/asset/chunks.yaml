  trans: "\n例如，为了在目标主机上实现 Nmap Ping 扫描，你可以依次选择 `Hosts|Nmap Scan|Ping Scan` 命令。在选择此界面上选择\
    \ `Ping Scan` 命令后，你就可以对目标主机执行 Ping 扫描了。\n\n## Metasploit 终端\n\n`msfconsole` (MSF\
    \ 终端 (`msfconsole`)) 是目前 Metasploit 框架中最流行的用户界面，而 MSF 终端是 Metasploit 框架中灵活灵活、功能最丰富且支持最好的工具之一。MSF\
    \ 终端提供了一个一站式接口，可以设置 Metasploit 框架中的几乎每一个选项和配置。用户可以使用 `msfconsole` 终端执行任何操作，包括启动渗透攻击、加载辅助模块、执行枚举、创建监听器，或对整个网络执行自动化渗透攻击。下文将介绍\
    \ Metasploit 的终端模式。\n\n### 启动 Metasploit 终端模式\n执行命令如下：\n```\nroot@exampleserver:～#\
    \ \n# msfconsole\n```\n执行上述命令后，你就可以成功启动 Metasploit 的终端模式。\n\n看到命令行提示符为 `msf5>`，意味着\
    \ Metasploit 终端模式已成功启动。从输出信息中，你可以看到支持的攻击模块及其对应的数量。例如，有 2343 个渗透攻击加载模块、1923 个辅助模块、328\
    \ 个后后攻击模块、546 个攻击加载模块、44 个编码模块、10 个空命令模块和 2 个规避模块。接下，用户可以使用这些攻击载荷（payloads）来执行渗透测试。\n\
    \n### 初始化 Metasploit\n在 Kali Linux 中，Metasploit 主要使用 `PostgreSQL` 数据库来存储数据。因此，在使用\
    \ Metasploit 框架时，你需要启动 `PostgreSQL` 数据库。\n执行命令如下：\n```\nroot@exampleserver:～#\
    \ service postgresql start\n```\n\n### 启动 PostgreSQL 数据库\n随后，你还需要使用 `msfdb init`\
    \ 命令来创建并初始化数据库。\n执行命令如下：\n```\nroot@exampleserver:～# msfdb init\n```\n\n### 初始化数据库\n\
    从上述输出信息中，你可以看到 `msf` 和 `msf_test` 数据库已自动创建。此外，数据库配置文件 `database.yml` 也已创建。\n提示：如果当前系统已经初始化过\
    \ Metasploit，它会提示数据库已配置，如下所示：\n```\nMetasploit running on Kali Linux as root,\
    \ using system database\nA database appears to be already configured, skipping\
    \ initialization\n```\n\n## 创建工作空间 (Workspace)\n为了区分不同的扫描任务，可以创建多个工作空间来保存不同扫描任务的信息。其中，不同工作空间之间的信息是相互独立的，以避免数据混乱。\n\
    创建工作空间的语法格式如下：\n```\nworkspace -a [name]\n```\n在上述语法中，`-a` 选项意味着添加一个工作空间。\n\n\
    ### 创建名为 test 的工作空间\n具体步骤如下：\n\n1. **检查当前工作区域。**\n执行命令如下：\n```\nmsf5> workspace\n\
    ```\n`* default`\n从输出信息中可以看出，默认只有一个 `default` 工作空间。此外，该工作空间正在使用中。\n\n2. **创建一个新的工作空间。**\n\
    执行命令如下：\n```\nmsf5> workspace -a sample\n```\n`[*] Added workspace: sample`\n\
    `[*] Workspace: sample`\n从输出信息中可以看出，工作空间 `sample` 已成功添加。此外，它已自动切换到新创建的工作空间。\n\n\
    3. **查看当前工作区域。**\n执行命令如下：\n```\nmsf5> workspace\n```\n`* default sample`\n从输出信息可以看出，当前有两个工作区域。其中，`sample`\
    \ 目前正在使用中。如果用户想切换工作空间，可以使用 `workspace [name]` 命令。\n\n4. **切换工作区域。**\n执行命令如下：\n\
    ```\nmsf5> workspace default\n```\n`[*] Workspace: default`\n看到上述信息，意味着你已成功切换到默认工作空间。\n\
    \n## 导入扫描报告\n当用户准备好工作空间后，就可以进行渗透测试。此时，用户可以导入一些第三方扫描报告以获取主机信息。其中，导入的扫描报告语法格式如下：\n\
    ```\ndb_import [example]\n```\n\n### 导入 openvas 扫描报告文件\n具体步骤如下：\n\n1. **在导入扫描报告之前**，用户可以通过以下方式检查支持的报告格式：\n\
    ```\nmsf5> db_import\n```\n`Usage: db_import [example]`\n文件名可以使用像 `.xml` 的通配符，这将进行递归搜索。从输出信息中，你可以看到所有支持导入的报告类型，如\
    \ Nessus XML、Nmap XML 和 OpenVAS XML。\n\n2. **导入 openvas 扫描报告文件。**\n执行命令如下：\n```\n\
    msf5> db_import /root/openvas.xml\n```\n`[*] Importing'OpenVAS XML' data`\n`[*]\
    \ Successfully imported /root/openvas.xml`\n```\n看到上述输出信息，意味着报告文件 `openvas.xml`\
    \ 已成功导入。\n\n3. **查看导入的主机。**\n执行命令如下：\n```\nmsf5> workspace\n```\n从输出信息中，我们可以看到默认工作空间中有\
    \ 3 个主机和 8 个服务。这说明 3 个主机的信息已成功导入。\n\n## 查询渗透测试模块\n漏洞主要通过 Metasploit 的渗透测试模块实现。因此，用户需要根据漏洞寻找对应的渗透测试模块。在\
    \ Metasploit 中，你可以使用 `search` 命令快速找到渗透测试模块。用户也可以去一些第三方网站寻找渗透测试模块并将其导入到 Metasploit\
    \ 中实现漏洞利用。本节将介绍如何查询渗透测试模块。\n\n### 扫描报告预分析\n用户在上一节中已成功导入了扫描报告。此时，用户可以分析扫描报告以发现目标系统中的漏洞。然后，根据漏洞寻找可以利用该漏洞的模块并实施攻击。下文将介绍预分析扫描报告的方法。\n\
    具体步骤如下：\n\n1. **使用 `hosts` 命令查看报告的主机信息。**\n执行命令如下：\n```\nmsf5> hosts\n```\n从输出信息中，我们可以看到扫描报告中有\
    \ 3 个主机。其中，地址分别为 `192.168.29.223`、`192.168.29.225` 和 `192.168.29.127`。\n\n2. **使用\
    \ `vulns` 命令查看漏洞信息。**\n执行命令如下：\n```\nmsf5> vulns\n```\n接下来，用户可以使用 `Name` 或引用信息（`References`）来搜索可使用的攻击载荷。\n\
    \n### 手动寻找攻击载荷\n在用户确定目标系统中的漏洞后，可以在 Metasploit 中搜索渗透测试模块，以选择可以利用其漏洞的模块，然后执行渗透测试。下文将介绍使用\
    \ `search` 命令手动搜索渗透测试模块的方法。\n寻找渗透测试模块的语法格式如下：\n```\nsearch [options]\n```\n在上述语句中，`options`\
    \ 支持的选项；关键词意味着可用的关键词。接下来，我们将手动查找 CVE 漏洞作为渗透测试模块。\n执行命令如下：\n```\nmsf5> search cve:2020\n\
    ```\n从输出信息中，我们可以看到所有 2020 年发布的渗透测试模块。输出信息包含 5 列，分别代表 `Name`（名称）、`Disclosure Date`（发布日期）、`Rank`（排名）、`Check`（检查）和\
    \ `Description`（描述）。\n\n通过上述扫描报告预分析，寻找名为 MS17-010 RCE Detection 的渗透测试模块。\n执行命令如下：\n\
    ```\nmsf5> search name:MS17-010 RCE Detection\n```\n从输出信息中，我们可以看到所有可以利用 MS17-010\
    \ RCE Detection 漏洞的渗透测试模块。此时，用户可以选择名为 `exploit/windows/smb/ms17_010_eternalblue`\
    \ 的模块进行渗透测试。执行命令如下：\n```\nmsf5> exploit/windows/smb/ms17_010_eternalblue\n```\n\
    \n### 第三方搜索\n如果用户在 Metasploit 中找不到有效的渗透测试模块，也可以从第三方网站查找。Metasploit 也支持导入第三方模块进行渗透测试。以下介绍如何从这些第三方网站查找渗透测试模块。\n\
    \n1. **通过 CVE 网站查找**\nCVE 网站的地址为 `https://www.cvedetails.com/`。在浏览器中成功访问网站后，界面将显示。此时，用户可以通过\
    \ CVE ID、产品名称或漏洞类型搜索渗透测试模块。例如，查询相关漏洞。在搜索框中输入 `Microsoft` 并点击 Search 按钮显示搜索结果。从界面中，我们可以看到与\
    \ Microsoft 相关的搜索结果。从统计结果可以看出发现了 6328 个漏洞。此时，选择 `Vulnerabilities (6328)` 选项显示详细信息。\n\
    \n2. **通过 exploit-db 网站查找**\nexploit-db 网站的地址为 `https://www.exploit-db.com/`。在浏览器中成功访问网站后，界面将显示。在此界面输入某些关键词搜索渗透测试模块。搜索时，用户还可以选择\
    \ `Verified` 和 `App` 复选框进行过滤。例如，搜索 `Windows` 系统的渗透测试模块。搜索成功后，边界将显示。从界面中，我们可以看到搜索结果。输出信息包含\
    \ 8 列，分别代表 `Date`（日期）、`A`（可用应用）、`V`（验证）、`Title`（标题）、`Type`（类型）、`Platform`（平台）和\
    \ `Author`（作者）。\n\n3. **手动导入第三方模块**\nMetasploit 模块非常丰富，但有时无法完全满足用户需求。对于某些新漏洞或官方不支持支持，用户只能手动编写或导入第三方模块。对于普通用户，直接导入第三方模块不容易出错。下文介绍手动导入第三方模块的方法。从\
    \ exploitDB 网站下载第三方模块，并使用该模块进行渗透测试。这里以 `exiftran` 命令为例，将文件名设置为 `webtest.rb`。\n\
    具体步骤如下：\n\n1. **将 `webtest.rb` 模块拷贝到 Metasploit 模块位置。**\n其中，Metasploit 模块的默认位置是\
    \ `/root/.msf4/modules`。为了方便区分，用户可以根据模块分类创建文件夹来存储不同类型的模块。在本例中，导入渗透攻击模块将创建一个名为\
    \ `exploits` 的文件夹：\n```\nroot@exampleserver:～# mkdir /root/.msf4/modules/exploits\n\
    ```\n执行上述命令后没有输出。这里，为了方便记忆或查找模块位置，创建目录并将攻击载荷文件拷贝进去：\n```\nroot@exampleserver:～#\
    \ cd /root/.msf4/modules/exploits/\n```\n从输出信息可以看出，渗透攻击模块文件 `webtest.rb` 已成功拷贝到新位置。\n\
    \n2. **重启 Metasploit 工具查看加载的渗透攻击模块。**\n执行命令如下：\n```\nroot@exampleserver:～# msfconsole\n\
    msf5>\n```\n从上述信息可以看出，oit 类模块从 1873 变为 1874。这说明该模块已成功导入。\n\n3. **选择 `webtest`\
    \ 模块并查看模块选项。**\n执行命令如下：\n```\nmsf5> use exploit/test/webtest\n```\n`0 Auto`\n\
    从输出信息可以看出，显示了 `webtest` 模块的所有选项。上述信息包含 4 列，分别代表 `Name`（选项名称）、`Current Setting`（当前设置）、`Required`（必须设置）和\
    \ `Description`（描述）。从输出信息可以看出，`RHOSTS` 是必须配置的选项，但尚未设置。\n\n4. **设置 `RHOSTS` 选项。**\n\
    执行命令如下：\n```\nmsf5 exploit(test/webtest)> set RHOSTS 192.168.29.223\nRHOSTS =>\
    \ 192.168.29.225\n```\n从输出信息可以看出，目标主机地址已设置为 `192.168.29.227`。\n\n## 使用 Metasploit\
    \ 执行攻击\n\n### 执行攻击\n用户找到利用漏洞的渗透测试模块后，就可以执行攻击。为了进行进一步的攻击，用户还可以加载攻击载荷。然后配置攻击载荷并实施攻击。\n\
    \n### 加载攻击载荷\n攻击载荷是上述的 `Payload`。通过加载载荷，可以实现进一步的攻击，例如获取 Shell 和远程执行命令。下文介绍加载攻击载荷的方法。加载攻击载荷的语法格式如下：\n\
    ```\nset payload\n```\n在上述语法中，`payload` 名称代表攻击载荷名称。为上述导入的 `webtest` 渗透测试模块加载攻击载荷所示。具体步骤如下：\n\
    \n1. **启动并选择 `webtest` 渗透测试模块。**\n执行命令如下：\n```\nroot@exampleserver:～# msfconsole\n\
    msf5> use exploit/test/webtest\nmsf5 exploit(test/webtest)>\n```\n\n2. **查看可以加载的载荷。**\n\
    执行命令如下：\n```\nmsf5 exploit(test/webtest)> show payloads\n```\n从输出信息可以看出，显示了所有可用的载荷。输出信息包含\
    \ 6 列，分别代表 `Date`（日期）、`Name`（名称）、`Disclosure Date`（发布日期）、`Rank`（排名）、`Check`（检查）和\
    \ `Description`（描述）。\n\n3. **加载攻击载荷。**\n执行命令如下：\n```\nmsf5 exploit(test/webtest)>\
    \ set payload windows/x64/meterpreter/reverse_tcp\npayload => windows/x64/meterpreter/reverse_tcp\n\
    ```\n从输出信息可以看出，载荷 `windows/x64/meterpreter/reverse_tcp` 已加载。\n\n### 配置攻击载荷\n用户加载攻击载荷后，还需要配置并设置参数。下文将描述如何配置攻击载荷。我们将以\
    \ `php/exec` 为例。\n\n1. **使用 `show options` 命令查看可选选项。**\n执行命令如下：\n```\nmsf5 exploit(test/webtest)>\
    \ show options\n```\n从输出信息可以看出，显示了所有可配置的选项。此时，用户可以根据这些需要设置这些选项。\n\n2. **设置攻击载荷的\
    \ `CMD` 选项。**\n执行命令如下：\n```\nmsf5 exploit(test/webtest)> set CMD dir\nCMD => dir\n\
    ```\n从输出信息可以看出，`Payload` 选项的 `CMD` 值已设置为 `dir`。\n\n3. **实施攻击。**\n执行命令如下：\n```\n\
    msf5 exploit(test/webtest)> exploit\n```\n\n### 设置架构\n某些渗透测试模块支持系统架构。在正常情况下，渗透测试模块会自动选择架构。如果用户获取了架构，可以通过其他手段手动设置。下文将介绍如何设置架构。我们将以\
    \ `MS08_067` 模块为例。具体步骤如下：\n\n1. **选择 `MS08_067` 漏洞模块并查看选项。**\n执行命令如下：\n```\nmsf5>\
    \ use exploit/windows/smb/ms08_067_netapi\nmsf5 exploit(windows/smb/ms08_067_netapi)>\
    \ show options\n```\n\n2. **检查可用的目标。**\n执行命令如下：\n```\nmsf5 exploit(windows/smb/ms08_067_netapi)>\
    \ show targets\n```\n从输出信息可以看出，显示了所有可用的目标。输出信息包含 2 列，代表 `Id`（编号）和 `Name`（目标名称）。\n\
    \n3. **设置目标。**\n执行命令如下：\n```\nmsf5 exploit(windows/smb/ms08_067_netapi)> set target\
    \ 2\ntarget => 2\n```\n从输出信息可以看出，目标架构已设置为 2。\n\n### 设置编码\n为了避免恶意字符出现，或规避目标主机上的防火墙或反病毒软件，可以设置编码生成新的攻击载荷。编码模块主要使用\
    \ `msfvenom` 工具。`msfvenom` 是支持 MSF 框架的攻击载荷生成器。其中，用于生成攻击载荷的语法格式如下：\n```\nmsfvenom\
    \ [options] <var=val>\n```\n使用 `x86/shikata_nai` 编码生成新的攻击载荷并将其保存到 `msf`。方法如下：\n\
    \n1. **查看所有支持的编码。**\n执行命令如下：\n```\nroot@exampleserver:# msfvenom -l encoders\n\
    ```\n\n2. **创建攻击载荷。**\n执行命令如下：\n```\nroot@exampleserver:# ./msfvenom -p windows/meterpreter/bind_tcp\
    \ RHOST=192.168.29.134\n```\n从上述信息可以看出，攻击载荷是使用 `x86/shikata_nai` 编码创建的。其中，攻击载荷文件为\
    \ `msf.exe`。\n\n## 真实攻击场景\n\n通过对 Metasploit 框架的介绍，读者应该理解基本的攻击步骤。不同的攻击模块使用的步骤不同，需要用户灵活使用。但基本思想是相同的：用户首先寻找可以利用漏洞的渗透测试模块，然后加载攻击载荷，最后执行渗透测试。为了让用户更熟悉整个渗透测试过程，本节将介绍几个示例。\n\
    \n### 数据库渗透攻击\nMySQL 是一个数据库管理系统。对于服务器应用程序，MySQL 数据库通常是用户的选择。如果管理员配置不当，可能会出现漏洞，例如弱密码、用户权限错误等。\n\
    \n**通过 CVE 网站查找**\nCVE 网站的地址为 `https://www.cvedetails.com/`。在浏览器中成功访问网站后，界面将显示。此时，用户可以通过\
    \ CVE ID、产品名称或漏洞类型搜索渗透测试模块。例如，查询相关漏洞。在搜索框中输入 `Microsoft` 并点击 Search 按钮显示搜索结果。从界面中，我们可以看到与\
    \ Microsoft 相关的搜索结果。从统计结果可以看出发现了 6328 个漏洞。此时，选择 `Vulnerabilities (6328)` 选项显示详细信息。\n\
    \n### MySQL 数据库渗透攻击\n为了在不使用密码的情况下快速连接无线网络，我们使用 `mysql_login` 模块进行连接。此时，渗透人员可以尝试对其进行渗透测试。在\
    \ MSF 终端中，提供辅助模块 `mysql_login`，用于破解弱密码。\n\n### 攻击示例\n在此界面输入远程登录的用户名和密码。然后，点击登录按钮，就可以成功连接到远程桌面。从界面中可以看出，你已成功连接到目标主机的桌面。\n\
    \n### PostgreSQL 数据库渗透攻击\n下文将使用 `msfconsole`：\n```\nroot@exampleserver:～# msfconsole\n\
    msf5> use auxiliary/scanner/postgres_login\nmsf5 use(auxiliary/scanner/postgres_login)>\
    \ set RHOST 192.168.29.223\nmsf5 use(auxiliary/scanner/postgres_login)> set RHOST\
    \ 192.168.29.223\nmsf5 use(auxiliary/scanner/postgres_login)> set RHOST 192.168.29.225\n\
    msf5 use(auxiliary/scanner/postgres_login)> exploit\n```\n从输出信息可以看出，目标架构已设置为 192.168.29.225。\n\
    \n## 使用 Metasploit 处理 PDF\nPDF 是一种文件格式。这种类型的文件被广泛用于传输。在正常情况下，渗透测试模块会自动选择架构。如果用户获取了架构，可以通过其他手段手动设置。下文将介绍如何设置\
    \ PDF 文件的渗透测试。\n\n### 架构设置\n由于通过 `msfdb init` 已经初始化了数据库，架构设置的密码是 `postgres_login`。\n\
    ```\nauxiliary/scanner/postgres_login exploit\n```\n\n无线网络安全是用于保护无线网络安全的相关设置。在大多数路由器中，支持三种无线加密方法，分别是\
    \ WEP、WPS 和 WPA/WPA2。此外，为了连接，需要设置密码。\n\n## 理解无线网络\n\n与有线网络相比，无线网络的构建是非常简单的，只需要无线路由器和无线客户端。本节将介绍无线网络的组成。\n\
    \n### 无线网络的组成\n通常路由器被称为 `AP` (访问点)，而无线客户端被称为 `STA` (站点)，例如手机、笔记本电脑和平板电脑。在无线网络中，至少有一个\
    \ AP 和多个客户端。\n\n### 无线网络的工作流\n当用户对无线网络有了清晰的理解，工作流分为四个步骤：\n\n1. `AP` 定期广播 SSID，`STA`\
    \ 监听该信号。当 `STA` 加入无线网络时，会发送探测请求。当 `AP` 接收请求后，`STA` 将切换到指定的频率段。\n2. 随后，`STA` 提供密码来认证无线网络。如果认证信息正确，`STA`\
    \ 允许访问无线网络。\n3. 在关联过程中，`STA` 和 `AP` 应该协商速率，直到关联成功。\n4. 此时，`STA` 和 `AP` 可以计数。无线网络的一种通用标准是由电气电子工程师学会（IEEE）制定的。虽然\
    \ Wi-Fi 经常与 802.11 混淆，但它们是相同的。如果你想渗透无线网络，必须理解 802.11 标准。下文将详细介绍 802.11 协议。\n\n\
    ### 什么是 802.11 协议？\n802.11 是 IEEE 制定的标准，主要用于局域网，最大速率只能达到 2Mbps。因为 802.11 无法满足对速度和距离的需求，IEEE\
    \ 团队继引入了两个标准：802.11b 和 802.11a。它们之间的区别在于 MAC 层和物理层。\n\n### 802.11ac 协议\n802.11ac\
    \ 是 802.11n 的继任者。基于 802.11a 标准，使用 5GHz 频段。802.11ac 的带宽从 20MHz 增加到 40MHz 甚至 160MHz。此外，调制效率得到了提高。最后，理论传输速度从\
    \ 600Mbps 的 802.11n 跃跃到 1Gbps。实际传输速率在 300 Mbps 到 400 Mbps 之间，这足够传输视频流了。\n\n###\
    \ 2.4GHz 频段\n频段是指无线信号的频率范围。无线信号在指定的频率范围内传输。2.4GHz 频段是 2400~2482MHz。为了充分利用该频段，范围被分为几个部分，每个部分被称为一个通道。目前主流\
    \ WiFi 网络支持 13 个通道。尽管它们的中心频率不同，但都会重叠。了解这些 13 个通道有助于无线网络在多个通道上运行以避免干扰。14 通道通常不使用。非重叠通道有\
    \ 1、6 和 11。\n\n### 5GHz 频段\n随着时间的发展，5GHz 频段逐渐进入人们的生活。5GHz 的频率比 2.4GHz 高，波长短，因此渗透性较弱但数据传输更快。支持五个通道，分别为\
    \ 149、153、157、161 和 165。当 5GHz 信号较少时，可以任意选择通道。\n"
- fmt: "\n## Wireless Modes\n\n- **Managed mode**: This mode is used when the user's\
    \ wireless client is directly connected to a Wireless Access Point (`WAP`). In\
    \ this mode, the driver of wireless network card relies on `WAP` to manage the\
    \ whole communication process.\n- **Ad hoc mode**: This is called as point-to-point\
    \ mode. This mode is used when the user's network consists of devices directly\
    \ connected to each other. In this mode, both wireless communication parties share\
    \ the responsibility of `WAP`.\n- **Master mode**: some high-end wireless network\
    \ cards support `master mode`. This mode allows the wireless network cards to\
    \ work with special drivers and software as `AP` (Access point) of other devices.\n\
    - **Monitor mode**: This is the most important mode in terms of usage. If the\
    \ network cable client is different from sending and receiving data and is only\
    \ used to monitor all data packets in the network then you can use the monitoring\
    \ mode.\n\n## Wireless Network Card Supporting Monitoring\n\nIf you want to monitor\
    \ the wireless network, the wireless network card used must support the monitoring\
    \ mode. Many wireless network cards are listed above. For `2.4GHz WiFi` networks,\
    \ it is recommended that users choose wireless network cards with chips of `3070`\
    \ or `8187`. For `5GHz WiFi` network, only wireless network cards with `RT3572`\
    \ and `RTL8812AU` chips are supported.\n\n### Set the Monitoring Mode\n\nWhen\
    \ the user selects the appropriate wireless network card, the wireless network\
    \ card can be set to monitor mode. Generally, the user sets the wireless network\
    \ card to the listening mode by using the `airmon-ng` command. Syntax format is\
    \ as follows:\n\n```\nroot@exampleserver : airmon-ng start set\n```\n\nIn the\
    \ above syntax, the parameter `start` indicates that the listening mode is started.\
    \ `Interface` refers to the wireless network interface. \n\nSet the wireless network\
    \ card to monitor mode. Execute the command as follows:\n\n```bash\nroot@exampleserver\
    \ : set=network\n```\n\nIt can be seen from the output information that the monitoring\
    \ mode is successfully started, and its monitoring interface is `wlan0mon`.\n\n\
    ### Set the Monitoring Mode of 5G WiFi Network Card\n\nAt present, there are two\
    \ common network card chips supporting `5G WiFi`, namely `RT3572` and `RTL8812AU`.\
    \ The wireless network card of `RT3572` chip has the same settings as the common\
    \ wireless network card, and the monitoring mode can be started directly by using\
    \ `airmon-ng` command. However, the wireless network card of `RTL8812AU` chip\
    \ needs to be installed with drivers, and the monitoring mode needs to be set\
    \ manually. The following describes the method of setting the wireless network\
    \ card of `RTL8812AU` chip to monitor mode.\n\n#### Set the wireless network card\
    \ of RTL8812AU chip to monitor mode\n\nThe specific operation steps are as follows:\n\
    \n1. **Install the driver**. Execute the command as follows:\n```bash\nroot@exampleserver\
    \ : install driver\n```\nAfter executing the above command, if no error is reported,\
    \ the driver installation will be successful.\n\n2. **Check the mode of the wireless\
    \ network card**. Execute the command as follows:\n```bash\nroot@exampleserver\
    \ : check mode\n```\nIt can be seen from the output information that the current\
    \ working mode of the wireless network card is `Managed`.\n\n3. **Stop the wireless\
    \ network card interface**. Execute the command as follows:\n```bash\nroot@exampleserver:\
    \ air-mag stop\n```\n\n4. **Set the wireless network card to monitor mode**. Execute\
    \ the command as follows:\n```bash\nroot@exampleserver: air-mag mode = network\n\
    ```\n\n5. **Start the wireless network card**. Execute the command as follows:\n\
    ```bash\nroot@exampleserver: air-mag wireless\n```\n\n6. **Check the mode of the\
    \ wireless network card again**. Execute the command as follows:\n```bash\nroot@exampleserver:\
    \ air-mag check start\n```\nIt can be seen from the output information that the\
    \ chip has been successfully set to `Monitor` mode. In which the interface in\
    \ listening mode is named `wlan0`.\n\nScanning the wireless network means scanning\
    \ the surrounding wireless network signals to find out the target of penetration\
