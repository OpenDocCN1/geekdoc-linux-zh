    Reserved addresses. The front of this type of IP address is `1111`, so the network
    number of the address ranges from `240` to `255`. Among IP addresses, there is
    also a special type of IP address, known as a broadcast address. The broadcast
    address is an address specifically used to send to all hosts in the network at
    the same time. In a network using the TCP/IP protocol, the IP address whose host
    identification segment is all 1s is a broadcast address, and it should be noted
    that broadcast packets are transmitted to all computers involved in the host identification
    segment.


    The IP address is mainly divided into network segments according to the subnet
    mask. For example, if the subnet mask corresponding to the IP address `192.168.1.100/24`
    is `255.255.255.0`, the network segment is `192.168.1.0-255`, that is, there are
    256 hosts in the network segment.


    When a user discovers a host, he can specify the network range through the mask
    format. Among them, for input convenience, CIDR format is usually used to specify
    the entire subnet. Among them, the CIDR format is composed of two parts, the network
    address and the subnet mask, separated by a slash (`/`). If the user is not sure
    of the subnet mask format corresponding to an IP range, you can use the Net-mask
    tool to achieve it. It should be said that this tool can convert between IP ranges,
    subnet mask, CIDR, Cisco and other formats, and provides the conversion between
    dotted decimal, hexadecimal, octal and binary IP addresses.


    ## Determine the network topology


    The user can determine the upper-level network range based on the routing entry.
    In a penetration test, by determining the network topology, you can determine
    whether the target is a local area network or an external network. In this way,
    penetration testing tools can be selected in a targeted manner, thereby improving
    the efficiency of penetration testing. The following section will introduce the
    use of the `Trace-route` tool to obtain routing entries of the target host to
    determine the network topology.


    The syntax format of using this tool to implement route tracking is as follows:

    ```

    traceroute [Target]

    ```

    Here, `target` is the address of the host network we are trying to find information
    about.


    **Use-case scenario:**

    Use the `Trace-route` tool to trace the route of the target host `72.132.234.64`
    to determine its network topology.

    The execution command is as follows:

    ```

    root@exampleserver:～# traceroute 72.132.234.64

    ```

    This will show the results about that particular host in detail. If you actually
    run this command a bunch of things will popup on the computer screen. A lot of
    this information is about the packets and the route they have chosen. Advanced
    security researchers analyse these packet tokens during an attack scenario to
    check whether the hacker has left any fingerprints on the server.


    **Note:** In the NAT mode of the virtual machine, there will be a problem with
    the operation of `Trace-route`. The upper level routing information cannot be
    displayed. Make sure you know about this while working.


    ## Chapter 10 Scanning the host


    ![](Image00004.jpg)


    In the previous chapter, we learned about few networking rules that are essential
    for understanding the importance of tools like `Nmap`. Networking itself is a
    vast topic, but as a hacker we recommend you to get a good grasp on the topic
    by learning various networking principles and protocols.


    User can determine whether the target host is active or not through active scanning.
    Active scanning is done by sending a probe request packet and waiting for the
    response from the target host. If the target host responds to the request, it
    means that the host is active. Otherwise, we can conclude that the target host
    is not online.


    The following section will introduce several ways to actively scan the host.


    ### 1) By using Nmap tool


    `Nmap` is a very powerful network scanning and sniffing toolkit. This tool has
    three basic functions. The first one of the three is to detect whether a group
    of hosts are online. The second is to scan host ports and sniff the network services
    provided whereas the third is to infer the operating system that is being used
    by the host.


    The following examples will introduce the use of `Nmap` tool to detect whether
    the target host is online or not.


    The syntax format of `N-map` is as follows:

    ```

    nmap -sP [target]

    ```

    The option `-sP` in the above syntax means to perform Ping scan on the target
    host. The parameter `[target]` is used to specify the target address of the scan.
    The target here can be a host name, an IP address (including a single address,
    multiple addresses or address ranges), and sometimes even network segments.


    **Use-case scenario:**

    Detect whether the target host `72.132.234.64` is online.

    The execution command is as follows:

    ```

    root@exampleserver:～# nmap -sP 72.132.234.64

    ```

    You can also check multiple hosts at once. Below, we provide an example for your
    reference for this scenario.


    **Use-case scenario:**

    Use `Nmap` to detect whether the hosts `72.132.234.64`, `72.132.234.65` and `72.132.234.66`
    are online or not.

    The execution command is as follows:

    ```

    root@exampleserver:～# nmap -sP 72.132.234.64-66

    ```

    This shows the output about the availability of these 3 servers.


    ### 2) Use Netdiscover tool


    `Netdiscover` is an ARP investigation tool that supports both active and passive
    modes. You can use this tool to scan IP addresses on the network and also to check
    hosts that are online.


    The following section will introduce the use of `Netdiscover` tool to implement
    ARP active scanning.


    The syntax format is as follows:

    ```

    netdiscover -r [range]

    ```

    The option `-r [range]` in the above syntax is used to specify the network range
    that needs to be scanned. If the user does not specify a target then the target
    network will be automatically selected for scanning.


    **Use-case scenario:**

    Use `Netdiscover` tool to scan online hosts in `72.132.234.64/24` network segment.

    The execution command is as follows:

    ```

    root@exampleserver:netdiscover -r 72.132.234.64/24

    ```

    By analysing the captured packets, you can know the current host IP address, MAC
    address, and MAC address in current LAN. You can see the address of the online
    host from the IP column. When the scanning is completed all the information that
    is obtained will be displayed. If you observe keenly valuable information about
    the host that you are trying to attack, press `Ctrl+C` key to exit the scanning
    interface of `Netdiscover` tool. Users sometimes can also not specify range, and
    find as many online hosts as possible. The execution command is as follows:

    ```

    root@exampleserver:～# netdiscover

    ```

    However, we suggest you to not try this as it may result in tons of hosts that
    often not worth your time. Always make thorough research before attacking the
    host.


    ## Monitor Host


    Monitoring Host means not actively sending data packets to the target but only
    monitoring data packets in the network. In local area network, some protocols
    will automatically broadcast data packets, such as ARP broadcast and DHCP broadcast.
    The broadcast packet is a data packet that all users in the LAN can receive. Therefore,
    users can detect active hosts on the network by monitoring these.


    ### 1) ARP monitoring


    ARP (Address Resolution Protocol) is a TCP/IP protocol that obtains physical addresses
    based on IP addresses. When a host sends information, it broadcasts an ARP request
    to all hosts on the network and receives a return message to determine the target''s
    physical address.


    The following section will introduce the passive mode of ARP monitoring using
    `Netdiscover` tool to discover online hosts. The syntax format of `Netdiscover`
    tool for passive scanning is as follows:

    ```

    netdiscover -p

    ```

    The option `-p` in the above grammar means to use passive mode, that is that no
    data packets need to be sent, but only allowed for sniffing. From the output of
    the first line of information, you can understand that the scan is performed in
    passive mode. From the second line of information, you can see the number of sniffed
    packets, the number of hosts, and the packet size. The information below line
    3 will be about sniffed packet. You can see the detected online hosts from the
    IP column. A lot of other tasks can be completed using this command in the net
    discover tool. We recommend you to experiment with these commands for better understanding
    of the topic.


    ### 2) DHCP snooping


    DHCP (Dynamic Host Configuration Protocol) is a local area network protocol, its
    main function is for internal network or service providers to automatically assign
    IP addresses. When a client needs to obtain an IP address, it will send a broadcast
    packet. Then, the DHCP server that received the request will provide an available
    IP address to the client. Therefore, users can implement DHCP snooping to determine
    online hosts in the network.


    The following section will introduce the implementation of DHCP snooping through
    `Nmap`''s `broadcast-dhcp-discover` script to discover hosts. `Nmap`''s `broadcast-dhcp-discover`
    script can be used to send a DHCP Discover broadcast packet and can effectively
    display the specific information of the response packet. By analysing the information
    in the response packet, the assignable IP address can be found. The syntax format
    of passive scanning using this script is as follows:

    ```

    root@exampleserver: nmap --script broadcast-dhcp-discover

    ```

    The `--script` option in the above syntax is used to specify that a script being
    used for the attack.


    ## Chapter 11 Domain Analysis


    ![](Image00004.jpg)


    In the previous chapter we discussed about the procedures that can be used while
    scanning a host. While scanning is considered an easy procedure it is often not
    feasible nowadays due to the intrusion detection systems that are being rapidly
    developed for the detection of malicious scanning requests. To counter this problem
    and to analyse our target in a much better way we need to understand the importance
    of Domain analysis. Follow along this chapter to get a good grasp about it.


    ### What is a Domain Name?


    Domain Name is a string of names separated by dots which is usually used to represent
    the name of a computer or computer group on the Internet. It can identify the
    electronic position of the computer during data transmission. Generally, hosts
    on the external network are identified by domain names. If you want to perform
    a penetration test on the host of an external network then it is mandatory to
    analyse the domain name to obtain the detailed information of the domain name.
    We can find different sensitive parameters such as domain name owner information,
    subdomain name, server address. This section will introduce how to analyse domain
    name information with a couple of examples.


    ### Basic Domain Name Information


    When a domain name is registered, it contains basic information, such as whether
    the domain name has been registered or not, domain name registrar, domain name
    owner, etc. By checking the `WHOIS` information of the domain name, you can get
    the basic information of the domain name easily. The following section will introduce
    how to obtain the basic information of the domain name using `WHOIS` and other
    popular tools. It is always said that domain analysis is the first usual thing
    pentesters do before analysing the target.


    ### 1) Use WHOIS tools


    The `WHOIS` tool is used to find and display user-related information for a specified
    account (or domain name). The syntax format of using this tool to query domain
    information is as follows:

    ```

    whois [domain name]

    ```

    **Use-case scenario:**

    Use `WHOIS` tool to query the relevant information of the domain name `wikipedia.com`.

    The execution command is as follows:

    ```

    root@exampleserver:～# whois wikipedia.com

    ```

    After entering the above command on the terminal you can see the relevant WHOIS
    information for the domain name.


    ### 2) Use Dmitry tool


    `dmitry` is an integrated information gathering tool. Usually pentesters use this
    tool to collect domain name information, subdomains, email addresses contained
    in domain names, etc. The syntax format used to obtain WHOIS information using
    this tool is as follows:

    ```

    dmitry -w [domain]

    ```

    The `-w`: Implement WHOIS query on the specified domain name. Whereas, `domain`
    is the host we are trying to attack and find information about.


    **Use-case scenario:**

    Use `dmitry` tool to query the WHOIS information of the domain name `wikipedia.com`.

    The execution command is as follows:

    ```

    root@exampleserver:～# dmitry -w wikipedia.com

    ```

    By using the above command in the linux terminal the WHOIS information related
    to domain name will be successfully obtained.


    ### Find subdomains


    A subdomain is also treated as a domain by penetration tester. In the domain name
    system, it usually belongs to a higher domain. For example, `www.wikipedia.com`
    and `forum.wikipedia.com` are two subdomains of `wikipedia.com`. Normally `.com`
    is the top-level domain name and `wikipedia.com` is the first-level domain name.
    `www` is the host name used to identify the server. It is a known fact that by
    looking up subdomain name, the corresponding host can be found. The method to
    find subdomains will be described below with detailed examples.


    ### 1) Use Dmitry tool


    The `dmitry` tool can be used to find subdomains. However, the tool uses Google
    search engine to find subdomains. It may not be reliable sometimes if you are
    accessing websites that are blacklisted by Google. So make sure that your domain
    is compatible with Google search. The syntax format of using `dmitry` tool to
    find subdomain is as follows:

    ```

    dmitry -s -o

    ```

    The options and meanings in the above grammar are:

    - `-s`: Implements subdomain query.

    - `-o`: Specifies the file to save the output.


    **Use-case scenario:**

    Use `dmitry` tool to find the subdomain name of domain name `wikipedia.com`.

    The execution command is as follows:

    ```

    root@exampleserver:～# dmitry -s wikipedia.com -o

    ```

    When you enter the above command in the linux terminal you can see all subdomains
    and corresponding IP addresses of the domain name `wikipedia.com`. You can use
    their IP addresses to accurately attack your target.


    ### 2) Online query


    Users can also search for subdomains by online query techniques. Among them, the
    popular address for online query of subdomain names is to visit the following
    website (https://phpinfo). When the user successfully visits the address in the
    browser, the interface that asks for domain name will be displayed. Enter the
    domain name to be queried in the text box. Then, click the "Start" button to find
    the corresponding subdomain. For example, we can find the different subdomain
    names of the domain name `wikipedia.com`. All subdomains that are available for
    `wikipedia.com` will be displayed instantly.


    ## What Next?


    By now you are quite aware of the techniques to find subdomains and understanding
    the properties of a particular domain. However, it is important to know that often
    administrators and developers restrict their information to be accessed by anonymous
    users (i.e penetration testers). So it is important to not rely completely on
    domain analysis. In the next chapter, we will counter this problem by introducing
    the procedure of discovering servers for your hacking procedure.


    ## Chapter 12 Discover servers


    ![](Image00004.jpg)


    Although the domain name is convenient for people to remember, the computers in
    the network can only know each other''s IP addresses. Therefore, you need to query
    the corresponding host based on the domain name. In the domain server, different
    hosts are identified through domain name records such as `A` records, `MX` records,
    and `NS` records. Among them, `A` record represents a host; `MX` record represents
    a mail server; `NS` represents a DNS server. Each domain name record contains
    an IP address. The user can determine the IP address corresponding to the domain
    name by detecting the domain server. The method to discover the server will be
    described below with valid instructions for your understanding.


    ### 1) Use Dnsenum tool


    `dnsenum` is a domain name information collection tool. It can guess possible
    domain names through Google or dictionary files, and can effectively perform reverse
    queries on a network segment. It can also query the host address information,
    domain name server and mail exchange records of the website.


    The syntax format of using this tool to collect domain name information is as
    follows:

    ```

    dnsenum -w

    ```

    The option `-w` in the above syntax indicates that the WHOIS query is implemented
    within the scope of the network.


    **Use-case scenario:**

    Use `dnsenum` to enumerate the information of the subdomain name `wikipedia.com`.

    The execution command is as follows:

    ```

    root@exampleserver:～# dnsenum -w wikipedia.com

    ```

    If you input the above code in terminal you can see that the IP address of the
    subdomain `www.wikipedia.com` has been obtained.


    ### 2) Use Nslookup tool


    `nslookup` is a command tool issued by Microsoft for detecting and troubleshooting
    DNS servers. This tool can be used to query DNS records to verify whether the
    domain name resolution is normal. In the event of a network failure, the tool
    can also be used to diagnose network problems. By implementing domain name resolution,
    the IP address of the corresponding server can be obtained. The syntax format
    of the tool is as follows:

    ```

    nslookup domain

    ```

    In the command, the parameter `domain` is used to specify the name to be queried.


    **Use-case scenario:**

    Use `nslookup` to resolve the domain name `wikipedia.com`.

    The execution command is as follows:

    ```

    root@exampleserver:～# nslookup wikipedia.com

    Server: 192.168.1.1

    Address: 192.168.1.1


    Non-authoritative answer:

    Name: wikipedia.com

    Address: 93.184.216.34

    ```

    From the output information you can see that domain name `wikipedia.com` was successfully
    resolved. From the displayed results, we can see that the addresses corresponding
    to this domain name are `192.168.1.1` and `93.184.216.34`. When using `nslookup`
    to perform domain query, the default is `A` record. Users can also use `type=value`
    to specify the value of the domain name record in interactive mode, like `NS`,
    `MX`, `CNAME`, `PTR`, etc.


    (1) Start the `nslookup` tool to enter the interactive mode. The execution command
    is as follows:

    ```

    root@exampleserver:～# nslookup

    ```

    If you are seeing the command prompt as `>`, it means that you have successfully
    entered the interactive mode of `nslookup`.


    (2) Set the query type to `NS` record. The execution command is as follows:

    ```

    type=ns wikipedia.com

    ```

