    [点击此处]进入提供 Nessus 激活码的网页。当用户在浏览器中成功访问该地址时，将显示获取激活码的对话框。


    2. 点击 Nessus 主页下的 `Register Now` 按钮，屏幕上将出现一个强制填写的对话框。


    3. 在此对话框中填写获取激活码所需的注册信息，例如用户名和电子邮件地址。填写完成后，点击 `Register` 按钮，你将在注册的收邮箱箱中收到一封邮件。进入你指定的电子邮箱地址后，你可以在邮件中看到激活码。


    4. 在下一步中，用户可以使用激活码激活 Nessus 服务。此时，在浏览器中输入地址 `https://exampleserver:8834/` 或 `https://hostname:8834/`
    以访问 Nessus 服务。成功访问后，界面将显示连接不安全的提示。**注意：** 在访问 Nessus 服务时，使用的是 `https` 协议而非 `http`。这是因为
    Nessus 是一个安全链接（使用超文本传输协议），因此你需要在允许登录之前添加信任。添加后，点击 `Advanced` 按钮，将显示风险警告消息。


    5. 分析完提供的现有风险后，点击“Add Exception”按钮，然后会弹出“Add Security Exception”对话框。点击 `Confirm
    Security Exception` 按钮，将显示 `Create Account` 对话框以开始利用 Nessus 软件的功能。


    6. 此对话框要求创建一个账户来管理 Nessus 服务。这是因为你是第一次使用，且尚未创建账户。在此界面上创建一个用户账户并设置密码。然后点击 `Continue`
    按钮。


    7. 在此界面上输入从邮件中获得的激活码。然后，点击 `Continue` 按钮初始化 Nessus 服务。


    8. 你可以从此界面观察到插件将开始下载。下载完成后，它将进行初始化。由于此过程将下载大量的插件文件，因此将花费很长时间，用户需要耐心等待。当初始化完成后，将显示
    Nessus 的登录界面。


    9. 在此界面上输入之前创建的账户和密码以登录 Nessus 服务。登录后，用户可以使用 Nessus 扫描各种漏洞。


    接下来做什么？

    在接下来的章节中，我们将讨论如何配置 Nessus 并使用它进行漏洞扫描。请跟随学习！


    # 第 19 章：使用 Nessus 进行配置和攻击


    ![](img/Image00005.jpg)


    在使用 Nessus 执行漏洞扫描之前，你需要创建一个新的扫描策略和扫描任务。为了以后能成功扫描各种漏洞，本节将介绍创建新策略和扫描任务的方法。


    ## 创建新策略


    对于相同类型的目标，每次执行的扫描操作基本上是。为了简化设置操作，Nessus 提供了扫描策略。扫描策略规定了扫描期间需要执行的操作。Nessus 提供了多个策略模板。用户可以根据这些模板创建自己的扫描策略。


    按照所示的特定步骤创建新策略：


    1. 登录 Nessus 服务。在浏览器地址栏中输入 `https://exampleserver:8834/`，将显示 Nessus 的登录界面。

    2. 在此界面输入之前创建的用户名和密码，然后点击 `Sign In` 按钮。将显示 Nessus 的主界面以开始创建你自己的自定义策略。

    3. 选择左列中的 `Policies` 选项，将显示可用的策略界面。

    4. 点击右上角的 `New Policy` 按钮，将显示策略模板界面。

    5. 在此界面选择要创建的策略模板类型。其中，如果图标上显示 `UPGRADE` 信息，则意味着家庭版本不可用。点击选择 `Advanced Scan` 策略模板，将显示新策略的设置对话框。

    6. 在此对话框中设置策略名称和描述信息（可选）。策略名称应根据正在执行的任务命名。然后点击 `Plugins` 选项卡，将显示漏洞插件选择对话框。

    7. 所有插件程序都显示在此对话框中。从该对话框中你可以看到这些插件程序默认都是开启的。为了能够扫描更多漏洞，建议启用所有插件。


    如果有特定的目标系统，你可以选择启用相应的漏洞插件，这可以进一步节省扫描时间和网络资源。在对话框中，点击右上角的 `Disable All` 按钮禁用所有已启动的插件程序。然后设置所需的插件程序启动。例如手动启动
    `Debian Local Security Checks` 和 `Default Unix Accounts` 插件程序。


    1. 用户设置好要使用的插件后，点击 `Save` 按钮查看创建的扫描策略。

    2. 从界面上可以看到新创建的策略，表示策略已成功创建。你可以用它攻击不同的主机，并扫描手动无法发现的漏洞。


    '
- fmt: '

    # New scan task


    After the policy is successfully created, a new scan task must be created to perform
    vulnerability scanning. When creating a task, the user needs to select a scanning
    strategy. Users can choose the scanning strategy they create, or can directly
    use the scanning strategy template that comes with Nessus. The operation process
    of creating a new scan task is introduced as follows:


    1) In the menu bar of Nessus, click the `Scans` tab so that the scan task interface
    will be displayed.

    2) Click the `New Scan` button in the upper right corner of the interface so that
    the scan template interface will be displayed.

    3) This interface shows some particular scan task templates that can be used.
    Moreover, you can see the policy templates that are manually created by the user
    under the `User Defined` tab. Here you can choose to use the previously created
    strategy to create the scan task, click the `User Defined` tab, the strategy template
    created by the user will be displayed.

    4) Click on the strategy template `sample`, and the `New Scan Task` dialog box
    will be displayed.

    5) Set the scan task name, description information, folder and scan target in
    this interface. After setting the above information, click the `Save` button to
    see the newly created scan task.

    6) From this interface, you can see that a new scan task named `Network Scan`
    has been created.


    # Scanning for vulnerabilities


    After the previous operations that have been performed, the Nessus service will
    be configured. Vulnerability scanning will be implemented in the below section.
    Here we use the scan task that has been created earlier to perform vulnerability
    scanning. The specific steps are as follows for implementing vulnerability scanning:


    1) Open the scan task interface.

    2) Click the `run` button to start scanning the target host.

    3) From this interface, you can see that the status of the scan task is `(Running)`,
    indicating that the scan is being performed. If you want to stop scanning, you
    can click the `Stop` button. If the scanning task is paused, click the `Pause`
    button. After the scan is completed, the interface will be displayed.

    4) From this interface, you can see that the scan status is displayed as the icon,
    which means the scan is complete. Click the name of the scan task, `Network Scan`,
    to view the scan results.

    5) This interface displays all the scanned hosts and their vulnerability information.
    From the displayed results, you can see that the number of scanned hosts is 8,
    the number of vulnerabilities is 99, and the number of scan history is 1. As you
    can see from the `Vulnerabilities` column, different levels of vulnerabilities
    and the number are displayed in different colours. The user hovering the mouse
    over each colour can also see the percentage of the vulnerability. In the lower
    right corner, a circular graph shows the proportion of each vulnerability, and
    on the right side of the circular graph, the security level of each vulnerability
    is displayed. Among them, the colour security level is `Critical` (very serious,
    red), `High` (more serious, orange-yellow), `Medium` (medium, yellow), `Low` (medium-low,
    green), `Info` (information, blue). In the Next section, users can view and analyse
    the vulnerability information of each host.


    # Analyse and export vulnerability scan reports


    After the user scans the target host, he can analyse the scan results and obtain
    the vulnerability information of the target host. In order to facilitate users
    to analyse the scan results, Nessus supports users to generate reports in different
    formats from the scan results. Among them, Nessus supports exporting file formats
    including `Nessus`, `PDF`, `HTML`, `CSV` and `Nessus DB`. The method to analyse
    and export the vulnerability scan report will be introduced below with detailed
    instructions. Follow along!


    ## 1. Analyse the vulnerability scan results


    It is important to analyse the results that you have obtained by the scanning
    software. By analysis and performing reports you can perfectly present your results
    to the system administrators or developers. A lot of pen testers underestimate
    the importance of reporting. But it should be remembered that a good report can
    make the problem or loophole to be fixed soon. The specific steps are as follows:


    1. Open the scan result interface of the Nessus software program.

    2. The interface displays the scan results of all target hosts.


    For example, to get the analysis of the vulnerability scan results of the host
    `192.168.343.129` click the target host address `192.168.343.129` in the window
    opened to display all the vulnerabilities that have been identified.


    3. From the interface, you can find the number of vulnerabilities that are detected
    in the host. The vulnerability list includes 4 columns usually: `Sev` (severity
    level), `Name` (plug-in name), `Family` (plug-in family) and `Count` (number of
    vulnerabilities). The `Host Details` on the right side of the interface displays
    the basic information of the target host, including IP address, MAC address, operating
    system type, and scan time. If you want to view the detailed information of the
    vulnerability, click the corresponding plug-in name to see the detailed information
    of the vulnerability.


    For example, to view the detailed information of `Bind Shell Backdoor Detection`
    vulnerability, the interface will be displayed. (4) This interface displays the
    description information, solution, output information and open ports of `Bind
    Shell Backdoor Detection` vulnerability. On the right `Plugin Details`, the vulnerability''s
    level, `ID`, `version`, `type`, and `plug-in family` are displayed, and related
    risk information is also displayed. Through the analysis of the vulnerability,
    it is known that the vulnerability allows users to remotely connect to the port
    and directly execute the `id` command. Among them, the solution provided is to
    determine whether remote login is enabled on the target host, or to reinstall
    the system.


    ## 2. Generate scan report


    In order to facilitate users to analyse other vulnerabilities, the scan results
    can be exported to a report file. In addition, users can also import the scan
    report to other tools (such as `Metasploit`) for use. The method of generating
    a scan report is described below. A use-case:Export the scan results to a report
    in `Nessus` format. The specific steps are as follows:


    1. Click the `Export` drop-down menu in the menu bar of the scan result interface,
    and all report formats will be displayed.

    2. The drop-down menu shows all the formats that can generate vulnerability reports.
    Click the `Nessus` command, and a dialog box for saving the report file will pop
    up.

    3. Select the `Save File` radio button in this dialog box, and then click the
    `OK` button to generate the report file.

    '
