    ## Understanding Networks


    Compared with wired networks, wireless networks are very simple to build, and
    only need a wireless router and a wireless client. This section will introduce
    the composition and workflow of wireless network.


    ### Composition of wireless network

    Usually, routers are usually called `AP` (Access Point) whereas wireless clients
    are `STA` (Station). That is, clients with wireless network cards, such as mobile
    phones, notebooks and tablet computers. In a wireless network, there is at least
    one AP and one more clients.


    ### Wireless network workflow

    When the user has a clear understanding of the structure network, its workflow
    will be introduced. There are four steps in this workflow as follows:


    1. **Because `AP` broadcasts SSID regularly, `STA` can listen to the signal sent
    by `AP`. When `STA` joins the wireless network, it will send a probe request.
    When the `AP` receives the request, it will respond with a packet containing band
    information. At this point, `STA` will switch to the specified frequency band.**

    2. **Then `STA` will provide a password to authenticate the wireless network.
    When `AP` confirms the authentication information submitted by `STA` is correct
    then `STA` is allowed to access the wireless network.**

    3. **`STA` and `AP` usually establish association. In the process of association,
    `STA` and `AP` should negotiate the rate according to the strength of signals
    until the association is successful. In which one `STA` can only associate with
    one `AP` at the same time.**

    4. **At this time, `STA` and `AP` can count** a common standard for wireless local
    networks, which is formulated by the Institute of Electrical and Electronics Engineers
    (IEEE). Although Wi-Fi is often confused with 802.11, they are not the same. If
    you want to penetrate the wireless network, you must understand its protocol standards.
    Therefore, this next section will introduce the 802.11 protocol in detail.


    ### What is the 802.11 protocol?

    802.11 is a WLAN standard originally formulated by IEEE, and it is also the first
    internationally recognised protocol in the field of WLAN. It is mainly used to
    solve the wireless access between users and user terminals in office local area
    network and campus network. The maximum rate of it can only reach 2Mbps. Because
    802.11 was unable to meet people''s needs in terms of speed and transmission distance,
    IEEE team has successively introduced two new standards, 802.11b and 802.11a.
    The main difference between the three technologies lies in the MAC sublayer and
    the physical layer. It can be understood that each 802.11 protocol standard uses
    different frequency bands. There are two frequency bands, 2.4GHz and 5GHz respectively.
    The difference between these two frequency bands will be explained later.


    ### 802.11ac protocol

    802.11ac is the successor of 802.11n. It is based on 802.11a standard, including
    5GHz band using 802.11ac. The working bandwidth of each channel of 802.11ac will
    be increased from 40MHz of 802.11n to 80MHz or even 160MHz. In addition, the actual
    frequency modulation efficiency will be improved by about 10%. Finally, the theoretical
    transmission speed will jump from the highest 600Mbps of 802.11n to 1Gbps. The
    actual transmission rate can be between 300 Mbps and 400 Mbps, which is close
    to 3 times of the actual transmission rate of 802.11n (between 75 Mbps and 150
    Mbps), which is enough to transmit video streams simultaneously on one channel.


    ### 2.4GHz frequency band

    Frequency band refers to the frequency range of wireless signals. Wireless signals
    transmit data in a specified frequency range. 2.4GHz band is 2.4~2.4GHz. In order
    to make full use of this band, the range is divided into several parts, and each
    part is called a channel. At present, mainstream WiFi networks generally support
    13 channels. Although their centre frequencies are different, they all occupy
    a certain frequency range, so there will be overlapping cases. By knowing the
    frequency bands of these 13 channels, it is helpful to understand the non-overlapping
    channels. Wireless networks can operate on multiple channels to avoid interference
    between signals. There are 14 channels, but the 14th channel is generally not
    used. The effective width of each channel is 20MHz, and 2.4GHz is 2400~2482MHz.
    The non-overlapping channels are 1, 6 and 11.


    ### 5GHz frequency band

    With the development of the times, 5GHz band has gradually entered people''s lives.
    5GHz has higher frequency and shorter wavelength than 2.4GHz, so its penetrability
    is weak but data transmission is faster. There are five channels supported at
    5GHz, which are 149, 153, 157, 161 and 165. When there are few 5GHz signal sources,
    the channel can be selected arbitrarily.


    ### Bandwidth

    The bandwidth here refers to the channel bandwidth. Channel bandwidth is also
    often called "band bandwidth", which is the frequency range occupied by modulation
    carrier and also the standard of transmitting wireless signal. In the commonly
    used 2.4~.5GHz band, the bandwidth of each channel is 20MHz. We can find that
    the 802.11n protocol includes two bandwidths, namely 20MHz and 40MHz. Among them,
    20MHz can reach 144Mbps bandwidth in 802.11n, which has good penetrability and
    long transmission distance (about 100 meters). 40MHz can reach 300Mbps bandwidth
    in 802.11n, but its penetration is slightly poor and its transmission distance
    is short (about 50 meters). If the reader is not clear about the above explanation,
    you can think of these two bandwidths as the width of the road. The wider the
    width, the more data can be run at the same time, which improves the speed. However,
    the "road" of wireless network is shared by all. When a user occupies a wide road
    and runs a lot of data, it is easy to collide with other people. Once a car crashes,
    everyone will slow down, perhaps even slower than walking on a narrow road. It
    can be seen that the 802.11b/g protocol allows four APS to use at the same time.
    If one AP uses 40MHz, only two APS can use it at the same time. Therefore, the
    choice of bandwidth mainly depends on how many APS are working at the same time
    nearby. If there is not much interference nearby, it is recommended to use 40MHz
    bandwidth, which can achieve higher transmission speed. 20MHz bandwidth is recommended
    if there are more APS. What Next? Hope this chapter gave a clear cut explanation
    about the working of wireless networks. World is rapidly changing and tens of
    wireless modes are available now for users. As a hacker it is important for you
    to be aware of the new wireless devices and modes that are coming into the market.
    Constantly check for vulnerabilities in the wireless devices. In the next chapter,
    we will talk about wireless security in detail. Follow along!


    ## Network Security


    Wireless network security is a related setting used to protect wireless network
    security. In most routers, three wireless encryption methods are supported, which
    are WEP, WPS and WPA/WPA2. Moreover, in order to connect to the wireless network
    conveniently, users may not use encryption. This section will introduce these
    encryption methods and configurations.


    ### No password mode

    Password-free mode means that you can quickly connect to the wireless network
    without using a password. However, this model has no security. The following section
    will take TP-LINK router as an example to introduce each encryption mode of wireless
    network. The specific operation steps are as follows:


    1. **Log in to the management interface of the router.** Generally, the default
    address of a router is 192.168.1.1 or 192.168.0.1. The router address in this
    example is 192.168.0.1. Therefore, enter the address `http://192.168.0.1` in the
    browser and a password dialog box will pop up.

    2. **Enter the login user name and password in this box, and then click Login
    to display the main interface of the router.**

    3. **Select "Wireless Settings" | "Wireless Security" on the left column, and
    the interface that consists of various settings will be displayed.**

    4. **All supported encryption methods can be seen from this interface, including
    WPA-PSK/WPA2-PSK, WPA/WPA2 and WEP. Set password-free mode here. Select "Do not
    turn on wireless security" button. Then, click the "Save" button at the bottom
    and a prompt dialog box will pop up.**

    5. **This prompts the user to restart the router before the setting can take effect.
    Click "OK" button, and a prompt message of restarting the router will be displayed.**

    6. **From this interface, you can see that the user has changed the wireless settings,
    which will take effect after restarting. At this time, click the "Restart" option,
    and the interface for restarting the router will pop up.**

    7. **Click "Restart Router" button to restart. After startup, the settings will
    take effect.**


    ### WEP mode

    WEP (Wired Equivalent Privacy) can encrypt the data wirelessly between two devices
    to prevent illegal users from eavesdropping or invading the wireless network.
    However, there are some shortcomings in this protocol, so it is easy to be attacked.
    At present, only few people use this encryption method. The setting method will
    be described below. Take TP-LINK router as an example to set WEP encryption. The
    specific operation steps are as follows:


    1. **Log in to the management interface of the router.** Then, select "Wireless
    Settings" | "Wireless Security" on the left column, and the interface will be
    displayed.

    2. **Select WEP button in this interface, that is WEP encryption mode, and then
    the user can set authentication type, key format.** Among them, authentication
    types include automatic, open system and shared key. Key formats include ASCII
    and hexadecimal. When the user chooses the open system, the host in the wireless
    network can pass authentication and associate with the wireless network without
    providing the authentication password. However, if you want to transmit data,
    you must provide the correct password. When the user chooses the shared key, the
    host in the wireless network must provide the correct password. Otherwise, the
    wireless network cannot associate and data transmission cannot be performed. If
    the user does not want to make settings, select the automatic option. For WEP
    key format, users can choose according to their own preferences. After using setting,
    click the "Save" button so a prompt dialog will pop up.

    3. **Click OK to display the interface thats shows all the settings you have selected.**

    4. **Click the "Restart" button to display the interface of restarting the router.**

    5. **Click the "Restart Router" button to restart. After the router restarts,
    users can connect to the wireless network through WEP encryption.**


    ### WPA/WPA2 mode

    WPA (Wi-Fi Protected Access), which has two standards, WPA and WPA2, is a system
    to protect the network security of wireless computers. WPA/WPA2 was created to
    replace WEP because of the serious weakness in WEP protocol. Although this encryption
    method is very safe, the user can still crack the password by capturing the handshake
    bag. The following describes the setting method of WPA/WPA2 mode. The specific
    operation steps are as follows:


    1. **Log in to the router and open the security settings interface.**

    2. **From this interface, you can see that WPA/WPA2 encryption modes are provided.
    Among them, WPA-PSK/WPA2-PSK is aimed at small enterprises or home networks. WPA/WPA2
    mode is generally used in large enterprises. Then, set the authentication type,
    encryption algorithm and PSK password. Authentication types include automatic,
    WPA-PSK and WPA2-PSK. Encryption algorithms include automatic, TKIP (the new 802.11n
    does not support this encryption algorithm) and AES. Select the "Automatic" option
    here, and then click the "Save" button. Next, restart the router as prompted for
    the settings to take effect.


    ### WPS mode

    WPS (Wi-Fi Protected Setup), is an optional authentication project organised and
    implemented by WiFi alliance, is mainly for simplifying wireless network setup
    and wireless network encryption. Generally, when users create a new wireless network,
    they will set the wireless network name (SSID) and wireless encryption method
    to ensure the security of the network. When these settings are completed, the
    client must enter the network name and lengthy encryption password when connecting
    to this wireless network. For convenience of input, you can quickly connect to
    the wireless network through WPS mode. The setting method of WPS will be introduced
    below. Tip: In routers, some buttons are displayed as WPS, and some routers''
    buttons are displayed as QSS. The specific operation steps are as follows:


    1. **Log in to the router and select the QSS security setting option, and the
    interface with additional data will be displayed.**

    2. **From this interface, you can see that the QSS function status is closed,
    that is, the WPS function is not enabled. Here, click the "Enable QSS" button
    to start the WPS function. After clicking the "Enable QSS" button, the prompt
    dialog box for restarting the router will be displayed.

    3. **Click OK to display the interface about the restarting functionalities.**

    4. **Click the "Restart" button to display the dialog box for restarting the router.**

    5. **After restarting the router, you can see that the WPS function has been successfully
    enabled.**

    6. **It can be seen from this interface that QSS function has been enabled. Therefore,
    WPS mode has been successfully started.**

