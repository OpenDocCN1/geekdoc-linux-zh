    # 保护措施


    以下将介绍几种保护措施：


    - 修改无线路由器的默认设置。

    - 禁止 SSID 广播以防止被扫描和搜索。

    - 关闭 `WPS/QSS` 功能。

    - 启用 `MAC` 地址过滤。

    - 设置复杂的密码。例如，密码包含大小写字母、数字和特殊符号。

