    This state is used when `Nmap` cannot determine whether the port is closed or
    filtered. It will only appear in the `IPID` Idle scan. The syntax format for port
    scanning using `Nmap` is as follows:


    `nmap -p [target]`


    In the above syntax, the option `-p` is used to specify the port to be scanned.
    The designated port can be a single port, multiple ports, or a range of ports.
    When specifying multiple scanning ports, separate the ports with commas. By default,
    the range of ports scanned by `Nmap` is 1 to 1000.


    Use-case scenario:

    Perform port scanning on the target host `192.243.176.84`. The execution command
    is as follows:

    ```

    root@exampleserver:～# nmap 192.243.176.84 own```

    When this command is entered on the terminal, the `Nmap` tool scans 1000 ports
    by default. It will display the open ports in the output.


    Use-case scenario:

    Specify the port range from 1 to 50, and perform port scanning on the target host
    `192.243.176.84`. The execution command is as follows:

    ```

    root@exampleserver:～# nmap -p 1-50 192.243.176.84

    ```

    From the output result after entering the above terminal, we can see that the
    ports ranging from 1 to 50 are scanned. All the open ports will be displayed.


    Use-case Scenario:

    Specify ports 21 and 23 of the scan target host. The execution command is as follows:

    ```

    root@exampleserver:～# nmap -p 21,23 192.243.176.84

    ```

    This gives a much detailed information about the two parts that have been specifically
    asked by the command. By using these techniques, you can minimise the time that
    usually takes for scanning the ports.


    ## 2) Use `DMitry` tool

    The `DMitry` tool provides a `-p` option to implement port scanning. The syntax
    format used to implement port scanning is as follows:


    `dmitry -p [host]`


    Here `host` is the IP address of the target we are trying to scan the ports.


    Use-case scenario:

    Use `DMitry` to scan the open ports on the target host `192.243.176.84`. The execution
    command is as follows:

    ```

    root@exampleserver:～# dmitry -p 192.243.176.84

    ```

    From the output information, you can see all the ports open on the target host.
    From the penultimate line of output, you can see the number of ports that were
    scanned and number of ports that were closed.


    ### What Next?

    As much important ports they are still difficult to implement. Now a days administrators
    are using intrusion section systems and it can be not a good practice to completely
    rely on them. Also, with ports, we may not find additional information that is
    required to build exploits. It helps if we can find out about the operating system
    that the target is using. Follow along to know more about operating system detection
    in the next chapter.


    ## Chapter 14: Identify the operating system

    ![](Image00004.jpg)


    By identifying the operating system, the system type of the target host can be
    determined. In this way, penetration testers can perform vulnerability detection
    on the program of the target system in a strategic manner to save unnecessary
    wasted time. This section will introduce the method of identifying the operating
    system with significant examples.


    ### Recognition based on TTL

    `TTL` (Time To Live), this field specifies the maximum number of network segments
    that an IP packet is allowed to pass before being discarded by the router. Different
    operating system respond with different `TTL` values. Therefore, users can use
    the `Ping` command for system identification. In order to enable users to quickly
    determine the type of target, a list of initial `TTL` values of each operating
    system will be necessary. You can easily find them by a quick google search.


    Use-case scenario:

    Use `Ping` to test the operating system type of the target host `192.243.176.84`.
    The operating system type of the target host is Linux. Let us find out whether
    the command can detect it or not. The execution command is as follows:

    ```

    root@exampleserver:～# ping -c 192.243.176.84

    ```

    It can be seen from the output information that the `TTL` value in the response
    packet is `64`. It can be inferred that the host is Linux operating system.


    Use-case scenario:

    Use `Ping` to test the operating system type of the target host `192.243.176.84`.
    The operating system type of the target host is Windows 7. The execution command
    is as follows:

    ```

    root@exampleserver:～# ping -c 192.243.176.84

    ```

    It can be seen from the output information that the `TTL` value in the response
    packet is `128`. It can be explained that this is Windows operating system. Tip:
    If there are too many routers from the local host to the target, the judgment
    result may not be accurate.


    ### Recognition using `NMAP`

    Since `TTL` is only a fuzzy judgment, the result obtained may not be accurate.
    The `NMAP` tool provides a function to detect the operating system. The following
    section will introduce the use of `NMAP` to identify the operating system type.
    The syntax format of using `NMAP` to identify the operating system is as follows:


    `nmap -O [target]`


    Here `target` is the host address we are trying to attack for our penetration
    testing.


    Use-case scenario:

    Use `NMAP` to detect the operating system type of the target host `192.243.176.84`.
    The execution command is as follows:

    ```

    root@exampleserver:～# nmap -O 192.243.176.84

    ```

    From the output information, we can understand that the operating system type
    of the target host is identified as Microsoft Windows 7/8. Although it is impossible
    to determine exactly which version it is, the closer system version will be displayed.
    While `Dmitry` provides the same functionalities, according to our experience
    it comes with more errors during the scan. We highly recommend to use only `Nmap`
    for finding out about the host operating system.


    What Next?

    We will talk about Identification services in detail. Follow along!


    ## Chapter 15: Identification Service

    ![](Image00004.jpg)


    The identification service is mainly the version information of the detection
    service. Generally, there may be vulnerabilities in some old versions. If there
    are loopholes, users can infiltrate the host to obtain other important information.
    This section will introduce how to identify services for easier exploitation of
    the target.


    ### Using `Nmap` Tool

    A `-sV` option is provided in the `Nmap` tool, which can be used to identify the
    version of the service. The following section will introduce a `Nmap` technique
    using this option to identify services. The syntax format of using `Nmap` to identify
    the service version as follows:


    `nmap -sV [host]`


    The option `-sV` in the above syntax means to implement service version detection.


    Use-case scenario:

    Identify all open services and versions on the target host `192.243.176.84`. The
    execution command is as follows:

    ```

    root@exampleserver:～# nmap -sV 192.243.176.84

    ```

    The identified service-related information can be seen from the output information.
    The output information includes 4 columns, namely `PORT`, `STATE`, `SERVICE` and
    `VERSION`. By analysing each column of information, you can obtain relevant information
    about the corresponding service. For example, the service corresponding to TCP
    port `21` is `FTP`, and the version is `FileZilla ftpd`. You can also see from
    the penultimate line that the host name of the target host is `TEST-PC`, and the
    operating system type is Windows.


    ### Using `Amap` Tool

    `Amap` is a set of penetration testing tools for identifying network services,
    including two tools, `amap` and `amapcrap`. Among them, the `amap` tool is used
    to try to identify applications running on unusual ports whereas `amapcrap` tool
    identifies applications based on non-ASCII encoding by sending trigger packets
    and finding the response in the response string list. The following section will
    introduce the use of `Amap` tools to identify service information.


    #### 1) Use the `amapcrap` tool

    The `amapcrap` tool can send random data to `UDP`, `TCP` or `SSL` ports to obtain
    illegal response information. The obtained information will be written to the
    `appdefs.trig` and `appdefs.resp` files to facilitate the next step of `Amap`
    detection. The syntax format of using this tool to identify service information
    is as follows:


    `amapcrap -n -m <0ab> [host][port] -v`


    Here `-v` stands for the verbose mode.


    Use-case scenario:

    Use the `amapcrap` tool to probe port `90` applications. The execution command
    is as follows:

    ```

    root@exampleserver:～# amapcrap -n 20-ma 192.198.153.84 90 -v

    ```

    From the displayed results, we can understand that the acquired information is
    written into the `appdefs.trig` and `appdefs.resp` trigger files. When users use
    the `Amap` tool to identify services, these two files will be used to obtain information.


    #### 2) Use `amap` tool

    The `amap` tool can try to identify some applications running on abnormal ports.
    The syntax format of using this tool to identify service information is as follows:


    `amap -bqv [host][port]`


    Use-case scenario:

    Use the `amap` tool to scan the `80` service on the target host `192.243.176.84`.
    The execution command is as follows:

    ```

    root@exampleserver:～# amap -bqv 192.243.176.84 80

    ```

    From the output information, we can understand that the service matching port
    `80` is `http` or `apache`. From the displayed information, we can see that the
    web service running on the target is `Apache` and the version is `2.8`. In the
    first 3 lines of output, we see that `amap` tool uses two trigger files and a
    response file. Among them, the file names are `appdefs.trig`, `appdefs.resp` and
    `rpc`.


    ### Collect information

    Some special services can provide information. For example, `SMB` service can
    provide system structure whereas `SNMP` service can provide target related information.


    ### SMB Service

    `SMB` (Server Message Block) is a protocol used to share files, printers, serial
    ports, etc. between computers. The `SMB` protocol can work on top of `TCP/IP`
    protocol, or on other network protocols (such as `BEUI`). By obtaining shared
    folder information of the `SMB` service, you can understand the file system of
    the target host. The following section will introduce shared folder information
    using `smbclient` tool. `smbclient` is a client tool for `SMB` service that can
    be used to access shared files in `SMB` service. The grammatical format of `smbclient`
    tool is as follows:


    `smbclient -L -U <username>`


    The options and meanings in above grammar are:

    - `-L`: Used to specify the `SMB` server address.

    - `-U`: Used to specify user name for logging in to `SMB` service.


    Use-case scenario:

    Access the `SMB` service in `Linux` system. The execution command is as follows:

    ```

    root@exampleserver: # smbclient -L 192.243.176.84 -U root

    ```

    Entering the password of the `SMB` service user login will display information
    that needs a lot of analysis. From the output information, you can see the files
    shared in the target `SMB`. Among them, `Sharename` represents the name of the
    shared file, `Type` represents the type of hard disk, and `Comment` is the description
    of the shared file. It can be explained that the operating system type of target
    host is `Linux`, and the shared file is `Linux` file system type. If the operating
    system of target host is `Windows`, the file name column will display the drive
    letter of shared folder.

    ```

    root@exampleserver:～# smbclient -L 192.243.176.84 -U root

    ```

    As can be seen from the file name of above output result, default shared disks
    are `C` disk and `E` disk. Only in `Windows` system, folders are divided into
    disks in the form of drive letters. It can be judged that shared folder is `Windows`
    system type.


    ### SNMP Service

    `SNMP` (Simple Network Management Protocol) is composed of a set of network management
    standards, including an application layer protocol and a set of resource objects.
    This protocol is used by the network management system to monitor any situation
    on network equipment that deserves the attention of the administrator. By using
    this service, host information can be obtained. The following section will introduce
    the use of `snmpcheck` tool to obtain host information. The `snmpcheck` tool can
    be used to enumerate `SNMP` devices to obtain target host information. The syntax
    format of the tool is as follows:


    `snmp-check [target]`


    Use-case scenario:

    Use `snmpcheck` tool to obtain `192.243.176.84` host information through `SNMP`
    protocol. The execution command is as follows:

    ```

    root@exampleserver:～# snmp-check 192.243.176.84

    ```

    When the connection is successful, the system information of the host can be obtained.
    Due to the large amount of output information that comes with above command, each
    part will be important to understand. Follow along!

    1) We can obtain system information, such as host name, operating system type
    and architecture.

    2) We can obtain user account information.

    3) Can obtain network information, such as `TTL` value, TCP segment and data element.

    4) Can obtain network interface information, such as interface status, speed,
    IP address, and subnet mask.

    5) Can obtain network IP information.

    6) Can obtain routing information, such as destination address, next hop address,
    subnet mask and path length value.

    7) Can obtain the monitored TCP port.

    8) Can obtain monitoring UDP port information. For example, the monitored UDP
    ports can be `123`, `154`, `6300`, `300` and `5322`.

    9) We can obtain network service information, such as distributed component object
    model service, DHCP client, and DNS client.

    10) We can obtain process information, such as process ID, process name, and process
    type.

    11) We can obtain storage information, such as device ID, device type, and file
    system type.

    12) Can obtain file system information, such as index, mount point, remote mount
    point, and access permissions.

    13) Can obtain device information, such as device ID number, type, and status.

    14) Can obtain software component information, such as `.Net` framework, Visual
    C++2008, etc.


    What Next?

    With this, we have completed an important part of the information gathering procedure
    during penetration testing. With all this acquired data we need to talk about
    Identification services in detail. Follow along!

