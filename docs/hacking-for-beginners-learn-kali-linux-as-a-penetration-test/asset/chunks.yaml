    # 1. IP 地址规则


    IP 地址（网协议地址）是一种互联网身份地址，用于识别设备、网络以及更大型的网络。例如，你的手机有一个 IP 地址，而你的调制解器有一个独立且唯一的 IP
    地址。它是一个 32 位的二进制数，使用点分法分为 4 个 8 位的二进制数，共 4 个字节。需要的是，IP 地址通常以“点十进制法”的形式表示为 `a.b.c.d`。其中，`a`、`b`、`c`
    和 `d` 都是 0 到 255 之间的十整数。例如，点十进制 IP 地址 `192.168.12.143` 实际上是一个 32 位的二进制数。


    练习：使用在线转换器找出上述 IP 数字的二进制表示。


    IP 地址由两部分组成，即网络地址和主机地址。网络地址表示它属于互联网上的哪个网络，主机地址则表示它属于网络中的哪一个主机。如果你仔细观察，可以发现它们之间存在主从关系。根据不同的网络号和主机号，IP
    地址分为 A 类（1.0.0.0～126.0.0.0）、B 类（128.1.0.0～191.255.0.0）和 C 类（192.0.1.0～223.255.255.0）。此外，还有
    D 类和 E 类特殊地址类。另外，全 0 和全 1 也被预留。每组 IP 地址的介绍如下：


    ### A 类

    该组的地址范围为 `1.0.0.0-126.0.0.0`，子网掩码为 `255.0.0.0`。在此地址中，第一个字节字节是网络号，最后 3 个字节是主机号。这类
    IP 地址的前导位是 `0`，因此可以看出地址的网络号范围从 1 到 126。


    ### B 类

    地址范围从 `128.1.0.0` 到 `191.255.0.0`，指定的子网掩码为 `255.255.0.0`。在此地址中，前两个字节是网络号，后两个字节是主机号。这类
    IP 地址的前导位是 `10`，因此网络号范围从 128 到 191。


    ### C 类

    地址范围从 `192.0.1.0` 到 `223.255.255.0`，子网掩码为 `255.255.255.0`。在此地址中，前 3 个字节是网络号，最后一个字节是主机号。这类
    IP 地址的前导位是 `110`，因此地址的网络号在 129 到 223 之间。


    ### D 类

    这是一种组播地址。这类 IP 地址的前导位是 `1110`，因此地址的网络号在 224 到 239 之间。通常用于组播用户。如果你不了解，组播地址是允许源设备向一组设备发送数据包的地址。属于组播组的设备将被分配一个组播
    IP 地址，组播地址范围为 `224.0.0.0～239.255.255.255`。由于组播地址代表一组设备，它只能用作数据包的目标地址。源地址总是单播地址。组播
    MAC 地址以十六进制值 `01-00-5E` 开头，剩余的 6 位十六进制数字由 IP 组播地址的最后 23 位转换而来。


    ### E 类


