    ￼root@exampleserver:～# service apache2 startNow, users can access Xplico services.
    The default listening port of the Xplico service is 9876.The user can check the
    listening port to determine whether the Xplico service is successfully started.
    details as follows: ￼root@exampleserver:～# netstat -anptul | grep 9876￼ tcp6 0
    0 :::9876From the information output above, we can see that TCP port 9876 is being
