  trans: '


    ## 无线模式


    - **托管模式（Managed mode）**：当无线客户端直接连接到无线接入点 (`WAP`) 时使用此模式。在此模式下，无线网卡的驱动依赖 `WAP`
    来管理整个通信过程。

    - **自自模式（Ad hoc mode）**：也称为点点模式。当用户的网络由直接连接的设备组成时使用此模式。在此模式下，通信双方共同承担 `WAP` 的职责。

    - **主机模式（Master mode）**：某些高端无线网卡支持 `master mode`。此模式允许无线网卡配合特殊的驱动和软件作为其他设备的 `AP`（接入点）工作。

    - **监控模式（Monitor mode）**：从用途角度来说最重要的模式。如果网络客户端不是用于发送和接收数据，而是用于监控网络中的所有数据包，那么你可以使用监控模式。


    ## 支持监控的无线网卡


    如果你想监控无线网络，所使用的无线网卡必须支持监控模式。上述列出了许多无线网卡。对于 `2.4GHz WiFi` 网络，建议用户选择带有 `3070` 或
    `8187` 芯片的无线网卡。对于 `5GHz WiFi` 网络，仅支持带有 `RT3572` 和 `RTL8812AU` 芯片的无线网卡。


    ### 设置监控模式


    当用户选择合适的无线网卡后，可以将无线网卡设置为监控模式。通常情况下，用户通过 `airmon-ng` 命令将无线网卡设置为监听模式。语法格式如下：


    ```

    root@exampleserver : airmon-ng start set

    ```


    在上述语法中，参数 `start` 表示启动监听模式。`Interface` 指无线网络接口。


    将无线网卡设置为监控模式。执行以下命令：


    ```bash

    root@exampleserver : set=network

    ```


    从输出信息中可以看到监控模式已成功启动，其监控接口为 `wlan0mon`。


    ### 设置 5G WiFi 网络网卡的监控模式


    目前，有两种常见的支持 `5G WiFi` 的无线网卡芯片，即 `RT3572` 和 `RTL8812AU`。`RT3572` 芯片的无线网卡设置与普通无线网卡相同，可以直接使用
    `airmon-ng` 命令启动监控模式。然而，`RTL8812AU` 芯片的无线网卡需要安装驱动，并且需要手动设置监控模式。以下描述了将 RTL8812AU
    芯片的无线网卡设置为监控模式的方法。


    #### 将 RTL8812AU 芯片的无线网卡设置为监控模式


    具体的操作步骤如下：


    1. **安装驱动**。执行以下命令：

    ```bash

    root@exampleserver : install driver

    ```

    执行上述命令后，如果没有报错，则说明驱动安装成功。


    2. **检查无线网卡模式**。执行以下命令：

    ```bash

    root@exampleserver : check mode

    ```

    从输出信息中可以看到，无线网卡的当前工作模式为 `Managed`。


    3. **停止无线网卡接口**。执行以下命令：

    ```bash

    root@exampleserver: air-mag stop

    ```


    4. **将无线网卡设置为监控模式**。执行以下命令：

    ```bash

    root@exampleserver: air-mag mode = network

    ```


    5. **启动无线网卡**。执行以下命令：

    ```bash

    root@exampleserver: air-mag wireless

    ```


    6. **再次检查无线网卡模式**。执行以下命令：

    ```bash

    root@exampleserver: air-mag check start

    ```

    从输出信息中可以看到，芯片已成功设置为 `Monitor` 模式。其中监听模式下的接口名称为 `wlan0`。


    扫描无线网络意味着扫描周围的无线网络信号以寻找渗透目标。如果用户想要实施渗透测试，他们需要知道目标无线网络的一些基本信息，例如 `AP` 名称、`MAC`
    地址和工作信道。通过扫描无线网络并分析扫描结果，选择相应的工具来实现渗透测试。本节详细说明了扫描无线网络的方法。


    ## 第 39 章：Airodump-ng 工具的使用


    ### 使用 Airodump-ng 工具


    `Airodump-ng` 是 `Aircrack-ng` 工具集中的一个工具，可用于扫描周围的无线网络信号。通过分析捕获的无线信号包，可以获取周围开放 `AP`
    的名称、`MAC` 地址、信道和加密方法。本节介绍了使用 `airodump-ng` 工具扫描无线网络的方法。


    使用 `airodump-ng` 工具扫描无线网络的语法如下：


    ```bash

    root@exampleserver: airodump scan

    ```


    在上述语法中，参数 `interface` 指无线网卡的监听接口。


    使用 `Airodump-ng` 工具扫描无线网络。执行以下命令：


    ```bash

    root@exampleserver: airodump wireless

    ```


    从输出信息中可以看到扫描到的无线网络信息。上述输出信息中有许多列，每个列参数的含义如下：


    1. **BSSID**：指示无线 `AP` 的 `MAC` 地址。

    2. **PWR**：无线网卡报告的信号强度，主要取决于 `driver`。如果 `BSSID` 和 `PWR` 均为 `-1`，则表示网卡不支持报告信号强度。

    3. **Beacons**：`AP` 发送的公告包数量。每个接入点（AP）每秒发送 10 个。

    4. **Data**：数据包数量（包括广播包）。

    5. **s**：每秒捕获的数据包数量。

    6. **Ch**：信道号（从 `Beacons` 获取）。

    7. **Mb**：无线 `AP` 支持的最大速率。如果值为 `11`，表示使用了 `802.11b` 协议；如果是 `22`，表示使用了 `802.11b+`
    协议；如果更高，表示使用了 `802.11g` 协议。如果值包含点（`54` 之后），表示支持短导频。如果包含 `e`，表示网络启用了 `QoS(802.11
    e)`。

    8. **Cipher**：检测到的加密算法为 `CCMP`、`WRAAP`、`TKIP`、`WEP` 和 `WEP104`。通常（但不一定）`TKIP`
    与 `WPA` 使用，`CCMP` 与 `WPA2` 使用。如果密钥索引值大于 0，显示为 `WEP40`。标准情况下，索引 0~3 为 40 位，104
    位应为 0。

    9. **Auth**：使用的认证协议。常用的有 `MGT（WPA/WPA2 使用独立认证服务器，如 802.1x、radius 和 eap 等）`、`ska（WEP
    共享密钥）`、`PSK（wpa/wpa2 预共享密钥）` 或 `OPN（WEP 开放）`。

    10. **ESSID**：所谓的 `ssid` 。如果启用了隐藏 `SSD`，则为空或显示为 `< length: 0 >`。在这种情况下，airodump-ng
    尝试从 `proberesponses` 和 `associationrequests` 获取 `SSD`。

    11. **Station**：客户端的 `MAC` 地址，包括已连接客户端和想要搜索无线网络的客户端。如果客户端未连接，会在 `BSSID` 下显示 `not
    associated`。

    12. **Rate**：指示传输速率。

    13. **Lost**：基于序列号检测的过去 10 秒内丢失的数据包。这意味着从客户端发送的数据丢失了，每个非管理帧都有序列号字段。通过从刚接收帧的序列号中减去上一帧的序列号，就可以知道丢失了几个数据包。


    '
- fmt: '

    ### 14. Frames

    The number of data packets sent by the client.


    ### 15. probe

    ESSID probed by client. If the client is trying to connect to an AP, but it is
    not connected, it will be displayed here.

    '
