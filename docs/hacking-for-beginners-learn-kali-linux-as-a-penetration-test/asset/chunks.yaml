    under the Nessus Home page, and the dialog box that is mandatory to be filled
    up will appear on the screen. ￼3\. Fill in the registration information required
    to obtain the activation code in this dialog box, such as user name and email
    address. After filling in, click the Register button and you will receive an email
    in the registered mailbox. After entering the mailbox of your designated e-mail
    address, you can see an activation code in the email.4\. In the Next step, user
    can use the activation code to activate the Nessus service. At this point, enter
    the address https://exampleserver:8834/ or https://hostname:8834/ in the browser
    to access the Nessus service. After successful access, the interface will be displayed
    that the connection is not secure.**Note: **When accessing the Nessus service,
    the https protocol is used instead of http.This is shown because Nessus is a secure
    link (using hypertext transfer protocol), so you need to add trust before allowing
    login. After adding click the Advanced button, and a risk warning message will
    be displayed.5\. After analysing the existing risks that are provided click on
    the “Add Execption” button, and then Add Security Exception dialog box will pop
    up.Click the Confirm Security Exception button so that the Create Account dialog
    box will be displayed for starting to utilise the Nessus software capabilities.6\.
    This dialog box requires the creation of an account to manage the Nessus service.
    This happens because it is your first time to use and no account has been created
    yet. Create a user account on this interface and set a password. Then click the
