    # Kismet 工具的使用


    Kismet 是一款用于嗅探无线网络的工具。使用该工具，你可以监控周围的无线信号并查看所有可用的无线访问点（AP）。本节将介绍如何使用 Kismet 工具扫描无线网络。


    ## 使用 Kismet 工具扫描无线网络


    具体的操作步骤如下：


    1. **启动 Kismet 工具。** 执行如下所示命令：

    ```

    root@exampleserver: kismet start

    ```

    执行上述命令后，将显示相应的界面。


    2. 此界面用于设置是否使用终端的默认颜色。由于 Kismet 的默认颜色是灰色，某些终端无法显示，因此此处不使用默认颜色。此时点击 `No` 按钮，将显示界面。


    3. 界面提示正在使用 root 用户运行 Kismet 工具。点击 `OK` 按钮，将显示界面。


    4. 界面提示是否自动启动 Kismet 服务。点击 `Yes` 按钮，将显示界面。


    5. 界面显示了关于设置 Kismet 服务的某些信息。在此处使用默认设置，然后点击 `Start` 按钮显示界面。


    6. 界面显示未定义的包资源。你现在要添加它们吗？点击 `Yes` 按钮，将显示带有结果的界面。


    7. 在此界面上指定无线网卡接口和描述信息。在 `Intf` 框中输入无线网络接口 `wlan0`。然后点击 `Add` 按钮，将显示界面。


    8. 点击界面上的 `Close Console Window` 按钮开始扫描无线网络。


    9. Kismet 工具扫描到的所有无线 AP 信息均可以通过此界面查看。在界面的左侧，显示了捕数据包的时间、扫描的网络数量和数据包数量。用户会发现，在此界面中只能看到搜索到的无线
    AP、通道和包大小信息，但看不到这些 AP 以及已连接客户端的 MAC 地址。此外，默认无法选择 AP。如果你想查看连接到当前 AP 的客户端，也需要进行设置。依次在菜单栏中选择
    `Sort|First Seen` 命令，然后在折上方选择 `AP`，并在第二个屏幕中显示连接的客户端。


    10. 正如你从此界面看到的，显示了名为 `CU_655w` 的 AP 详情以及已连接的客户端。例如，已连接客户端的 MAC 地址为 `fc:1a:11:9e:36:a6`。AP
    的 MAC 地址为 `70:85:40:53:E0:3B`，工作通道为 `9`，加密方法为 `TKIP`、`WPA` 和 `PSK`。如果你想查看 AP 的详情，双击相应的
    AP 即可。


    11. 从此界面你可以看到 AP 的详细信息，如制造商、BSSID、通道、频率和信号强度。如果你想停止扫描无线网络，依次点击 `Kismet|Quit`，将弹出停止
    Kismet 服务的对话框。


    12. 点击 `Kill` 按钮停止 Kismet 服务并退出扫描界面。


    此外，终端将给出一些日志信息输出：

    ```

    [SERVER] usually: /etc/init.d/networking restart

    ```

    从上述输出信息中可以看出，捕获的数据已成功写入日志文件。从输出信息中可以看到了五个文件位置。其中，每个日志文件包含不同的内容：

    - `alert`：警报的纯文本日志文件。Kismet 将对特别关注的事件发送警报。

    - `GPS XML`：XML 格式的 GPS 日志文件。

    - `nettxt`：纯文本格式的网络网络信息。

    - `net XML`：XML 格式的网络信息。

    - `pcapdump`：由 `pcap` 捕获的实时数据通信文件。它取决于 `libpcap` 的版本，该文件可能包含每个包的信息，包括 GPS 坐标信息。


    # 第 40 章攻击无线网络


    ![](img/Image00007.jpg)


    通过实施无线网络扫描，我们可以找到攻击目标。本节将介绍如何攻击无线网络密码并提供一些防护措施。


    ## 破解 WEP 无线网络密码


    由于 WEP 加密使用了 `RC4` 算法，WEP 加密网络很容易被破解。本节将介绍如何使用 `airplane-ng` 工具破解 WEP 加密的无线网络。


    使用 使用 airplane-ng 工具破解 WEP 无线网络密码


    具体的操作步骤如下：


    1. **开启监控模式。** 执行如下所示命令：

    ```

    root@exampleserver: airplane-ng monitor

    ```


    2. **扫描无线网络**以找到被 WEP 加密的无线网络。从输出信息可以看出，`ESSID` 为 `Test` 的无线网络使用的加密方法为 `WEP`。因此，我们在此选择破解无线网络密码。


    3. **捕获 wep 无线网络数据包**并指定将捕获的数据包保存到 WEP 文件中。执行如下命令：

    ```

    root@exampleserver: airplane-ng capture

    ```

    查看上述输出信息，表明正在捕获 `Test` 无线网络的数据包。WEP 加密的无线网络能否成功破解取决于捕获到的 `IVS` 数据包。如上方的 `Data`
    列所示，目前仅捕获了 20 个。要破解 WEP 加密的无线网络，取决于捕获的包数量。此时可以使用 `airplay-ng` 工具进行注入攻击。语法格式如下：

    ```

    root@exampleserver: airplane-ng capture

    ```

    （此处表示已捕获数据包）

    ARP 注入攻击：

    ```

    root@exampleserver: packet

    ```

    ARP 注入攻击。`-b` 指定 AP 的 MAC 地址，`-h` 指定客户端的 MAC 地址。


    4. **实施 ARP 注入攻击**以加速包捕获。执行如下命令：

    ```

    root@exampleserver: airplane-ng inject

    ```

    （注：此处根据所提供源描述）


    ## 破解 WPA/WPA2 无线网络密码


    WPA/WPA2 加密本质上是安全的。但只要用户捕获握手包并有足够的字典，就可以破解密码。本节将介绍破解方法。


    使用工具破解 WPA/WPA2 密码


    具体的操作步骤如下：


    1. **开启监控模式并扫描无线网络。**从输出信息中可以看到所有无线网络。此时选择 WPA/WPA2 加密的无线网络。例如，选择 `CU_655w`。


    2. **使用 airodump-ng 工具捕获数据包**，并指定 BSSID、`channel` 和文件保存位置。执行如下命令：

    ```

    root@exampleserver: airodump

    ```

    然而，如果你想破解该无线网络的密码，必须捕获握手包。此时用户可以使用 `mdk3` 工具实施注入攻击以便获取握手包。其语法格式如下：

    ```

    root@exampleserver: mdk3

    ```

    在上述语法中，`d` 表示实施注入攻击。`-s` 指定发送注入包的时间间隔。`-c` 指定攻击通道，即 AP 所在的通道。


    3. **使用 mdk3 工具实施注入攻击以获取握手包。**执行如下命令：

    ```

    root@exampleserver: mdk3

    ```

    执行上述命令后，没有给出输出。此时，返回 airodump-ng 捕包界面观察是否捕获了握手包。如果捕获了握手包，右上角将显示。正如你在右上角看到的，显示了
    `WPA handshake`。因此，已成功捕获握手包。


    4. **实施暴力破解**，并指定使用的密码字典为 `passwords.txt`。其中，密码字典需要用户手动创建。执行如下命令：

    ```

    root@exampleserver: brute force

    ```

    从输出信息可以看出，`CU_655w` 无线网络的密码已成功破解，密码为 `exampleserver`。


    '
