    ### 主动渗透攻击


    被利用的安全漏洞位于网络服务器软件以及服务器软件承载的上层应用中。因为这些服务通常会在主机上开启一些监听端口并等待客户端连接。通过连接到目标系统的网络服务，注入某些包含“恶意”攻击数据的特殊构造网络请求内容，触发安全漏洞，并导致远程服务器执行“恶意”数据中包含的攻击载荷，从而获取目标系统的控制权限。


    ### 被动渗透攻击


    被利用的漏洞位于客户端软件（如浏览器、浏览器插件、邮件客户端、Office 和 Adobe 以及其他文档和编辑软件）。对于此类安全漏洞，渗透测试人员无法从远程向客户端软件主动输入数据，因此只能使用被动渗透攻击。常用的被动渗透攻击包括构建“恶意”网页、电子邮件或文档文件，并通过建立包含此类恶意内容的服务器、发送邮件附件、结合社会工程学攻击分发、结合网络欺骗和劫持技术等，诱骗目标用户在目标系统上打开或访问这些恶意内容，从而触发客户端软件的安全漏洞，获取控制目标系统的
    `Shell` 会话。


    ### 辅助模块


    辅助模块包括各种网络服务的扫描和检测、构建伪造服务以收集登录密码、密码猜破解等模块。此外，辅助模块还包括一些不需要加载的攻击载荷。这些模块不用于获取目标系统的远程控制，例如拒绝服务攻击。


    ### 渗透后攻击模块


    渗透后攻击模块主要用于获取目标系统的远程控制。在控制系统中执行各种渗透后攻击，如获取敏感信息、进一步扩展以及实施跳板攻击。


    ### 攻击载荷模块


    攻击载荷（Attack Payload）是一段嵌入代码，用于在成功渗透攻击后提示目标系统运行。其通常功能是在目标系统上为并开启一个控制会话连接，供渗透攻击者使用。在传统的渗透代码开发中，攻击载荷仅仅是一段简单的
    `ShellCode` 代码，用汇编语言编译并转换为目标系统 CPU 架构支持的机器码。渗透攻击触发漏洞后，程序执行流被劫持并跳转到这段代码中执行，从而完成
    `ShellCode` 中的单一功能。Metasploit 攻击载荷分为三种类型：Single（独立型）、Stager（传输器）和 Stage（传输体）。这三种攻击载荷类型的区别如下：


    *   **Single**：它是一个完全独立的载荷，使用起来就像运行 `calc.exe` 一样，例如添加系统用户或删除文件。由于 Single Payloads
    是完全独立的，它们可能会被非 Metasploit 处理工具（如 `netcat`）捕获。

    *   **Stager**：该载荷负责在目标用户和攻击者之间建立网络连接，并下载额外的组件或应用程序。常见的 Stager Payload 是 `reverse_tcp`，它允许目标系统与攻击者建立
    TCP 连接，允许目标系统主动连接渗透测试人员的端口（反向连接）。另一个常用的是 `bind_tcp`，它允许目标系统开启 TCP 监听，攻击者可以随时与目标系统通信（正向连接）。

    *   **Stage**：它是 Stager Payload 下的一种 Payload 组件，这种 Payload 可以提供更高级的功能，且没有尺寸限制。


    ### 空指令模块


    空指令（`NOP`）是一些无操作或无关的操作指令，对程序的运行状态不会产生实质性影响。最典型的空指令是无操作。在 `X86` CPU 架构平台上，操作码为
    `ox90`。当渗透攻击构建恶意数据缓冲区时，通常需要在要执行的 shell code 之前添加一个空指令区域。这样，当渗透攻击触发并执行 `ShellCode`
    时，将有一个更大的安全着陆区域，避免因内存地址随机化和返回地址计算偏差导致 `ShellCode` 执行失败，提高渗透攻击的可靠性。


    ### 编码模块


    在攻击载荷和空指令模块组装完成指令序列后，Metasploit 框架在渗透攻击模块将指令添加到恶意数据缓冲区并发送到目标系统运行之前需要进行编码。编码模块有两个主要功能：第一，确保攻击载荷中不出现“坏字符”；第二是，“释放”攻击载荷，即避免被防病毒软件、IDS
    入侵检测系统和 IPS 入侵防御系统检测和拦截。


    ### 规避模块


    规避模块是 Metasploit 5 新新增。用户可以使用规避模块规避 Windows Defender 防火墙。Windows Defender 现在 Windows
    系统自带的防火墙工具，它不仅可以扫描系统，还能实时监控系统。


    ### 插件


    插件可以扩展框架的功能，或者封装现有功能以形成高级功能的组件。插件可以集成一些现有的外部安全工具，如 `Nessus`、`OpenVAS` 漏洞扫描器等。


    # 第 27 章理解 Metasploit 接口


    Metasploit 框架提供了两种接口：图形界面和终端模式。以前也提供命令行模式接口，但已弃用。下面将介绍 Metasploit 的图形界面和终端模式启动方法。


    ### 1) Metasploit 的图形界面 (Armitage)


    Armitage 是一个用 Java 编写的 Metasploit 图形界面攻击软件。它可以结合 Metasploit 中已知的漏洞实现对主机漏洞的自动化攻击。下节将介绍如何使用
    Armitage。


    具体步骤如下：


    1.  在图形界面中，依次选择 "Applications"|"Vulnerability Exploitation Tool Set"|`armitage`
    来启动 Armitage 工具。

    2.  对话框显示连接 Metasploit 服务的基本信息。点击 `Connect` 按钮，将显示对话框。

    3.  对话框提示是否启动 Metasploit 的 RPC 服务。点击 `Yes (Y)` 按钮，将显示对话框。

    4.  对话框显示连接 Metasploit 的进度。当成功连接到 Metasploit 服务后，将显示界面。

    5.  如果看到此界面，说明 Armitage 工具已成功启动。接下来，用户可以使用该工具进行渗透测试。该界面分为三个部分，分别标记为 A、B 和 C。


    *   **A 部分**：显示预配置模块。用户可以在模块列表中使用空格键搜索提供的模块。

    *   **B 部分**：显示活跃的目标系统，用户可以执行漏洞攻击。

    *   **C 部分**：显示多个 Metasploit 标签。这样你可以同时运行并显示多个 Meterpreter 命令或控制会话。


