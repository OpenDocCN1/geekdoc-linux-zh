- fmt: "\n# 1. Tool warehouse\n\nKali Linux system provides a powerful tool warehouse,\
    \ and pre-installed many penetration testing software, such as `Nmap` (port scanner),\
    \ `Wireshark` (packet analyzer), `John the Ripper` (password cracker) and `Aircrack-ng`\
    \ ( Wireless LAN penetration testing software). If users use other operating systems,\
    \ they need to manually install related tools. Penetration testing often requires\
    \ a large number of tools. Collecting these tools is not an easy task, and the\
    \ security of the code cannot be guaranteed. In addition, if the user manually\
    \ installs it, a complicated environment may need to be configured. If users want\
    \ to implement penetration testing more easily and quickly, Kali Linux is the\
    \ best choice. If you are not satisfied with Kali Linux there is an alternative\
    \ called as Parrot Linux for security specalists. This book however uses Kali\
    \ Linux for introducing hacking concepts. \n\n# 2. Constant updates\n\nKali Linux\
    \ system update speed is relatively fast, the stable version will be updated every\
    \ 3 months and weekly update version will be released. So users can update at\
    \ any time and use the new system and the latest tools as early as possible. Moreover,\
    \ the operating system update is very convenient, without the need for the user\
    \ to manually update.\n\n# History of Kali Linux\n\nIn order for readers to have\
    \ more understanding of Kali Linux system, here we will introduce its development\
    \ history.\n\n## 1) Formerly called as BackTrack Linux\n\nBackTrack Linux is a\
    \ set of professional computer security monitoring Linux operating system, referred\
    \ to as `BT`. BackTrack is not only used as a surveillance platform (WarDriving),\
    \ it also integrates more than 200 security penetration tools including `Metasploit`.\
    \ In addition, numerous RFID tools and support for the `ARM` platform are also\
    \ a bright spot. Currently, BackTrack has been replaced by Kali Linux and is no\
    \ longer maintained.\n\n## 2) Historical versions\n\nKali Linux has 4 version\
    \ codes since its release, namely `moto`, `kali`, `sana` and `kali-rolling`. Among\
    \ them, each version code represents a different version of Kali Linux. The user\
    \ can update to the system of the corresponding version by modifying the version\
    \ code in the software source.\n\n# Legal boundaries for penetration testers\n\
    \nWhen implementing penetration testing, obtaining accurate written authorisation\
    \ is very important. If it is not clear, it may cause the user to face legal proceedings,\
    \ and more likely may go to jail for this.\n\n## Obtaining legal authorisation\n\
    \nWhen pen-testing the target host, the penetration tester first needs to obtain\
    \ the legal authorisation given by the target owner. In this way, unnecessary\
    \ legal disputes and other problems caused by illegal penetration testing can\
    \ be avoided.\n\n## Harmfulness of some operations\n\nDuring the penetration testing\
    \ procedure, some operations have certain hazards, such as occupying system resources\
    \ and leaving back doors. Therefore, the penetration tester needs to formally\
    \ inform the target host owner of the possible impact of the penetration test\
    \ in advance and ask the other party to confirm.\n\n# Summary :\n\n- We provided\
    \ a simple introduction to penetration testing along with different types of tests\
    \ that are performed.\n- Penetration testing process is explained with clear introduction\
    \ to all its stages.\n- Introduction to Kali Linux and its History.\n- Provided\
    \ information about legal boundaries that need to be taken care seriously.\n"
