    \ will be displayed.\n4. From this interface, you can see the relevant settings\
    \ of the Windows system password policy, such as whether the complexity requirement\
    \ is enabled, the minimum password length value, the period of use, and whether\
    \ to remember the password history, etc.\n\n### 3) Analyse existing password dictionary\
    \ strategies\nThe user can analyse the leaked passwords of the target user's related\
    \ groups, obtain the password setting strategies of the similar groups, and then\
    \ build a new dictionary based on this. Markov Attack can analyse existing password\
    \ dictionary files, and count the occurrence probability, position distribution,\
    \ and context of each character in the password dictionary. Then, combined with\
    \ these rules, the mask can be used to generate a more effective password dictionary.\
    \ Kali Linux provides a tool called `Statsprocessor` that supports Markov Attack\
    \ technology. The following section will introduce the method of using this tool\
    \ to analyze the password dictionary strategy.\n\nThe syntax format is as follows:\n\
    ```\nstatsgen [options] passwords.txt\n```\nIn the above grammar, `options` represents\
    \ the available options; `passwords.txt` represents the analysed password dictionary.\n\
    \n### Use statsgen tool to analyze rockyou.txt password dictionary\n1. The execution\
    \ command is as follows:\n```\nroot@exampleserver:～# statsgen rockyou.txt\n```\n\
    After executing the above command, it will start to analyse the specified password\
    \ dictionary and make statistics. Among them, the output information includes\
    \ basic statistical information of the tool, password length, character set, password\
    \ complexity, simple mask and advanced mask.\n\nIn order to make the user more\
    \ clear about the output result, the following section will introduce each part\
    \ of the information in turn. Among them, the first part of the information is\
    \ the basic information of the `statsgen` tool, as follows.\nFrom the output information,\
    \ you can see the version information of the `statsgen` tool, the analyzed password\
    \ file, and the statistics on the password file.\nBy analyzing the output information,\
    \ it can be seen that the version of the tool is `0.0.3`; the analyzed password\
    \ dictionary is `rockyou.txt`; the password dictionary includes `14,343,392` passwords.\n\
    \n2. The following is the password length statistics information. The above information\
    \ is based on the statistics of the password length in the password dictionary,\
    \ and sorted in descending order according to the proportion of password length.\
    \ Among them, the output information is divided into 3 columns, which are the\
    \ length of the password, the proportion of the total number of passwords, and\
    \ the total number of passwords.\nFor example, the first line of information indicates\
    \ that the password length is 8, which accounts for 20% of the total number of\
    \ passwords, and the total number of passwords matching this length is 2,966,037.\n\
    \n3. The following are statistics on the password character set.\nFrom the output\
    \ information, we can see that various password character sets in the password\
    \ dictionary are analyzed and counted.\n\n4. The following is the statistics of\
    \ password complexity. The above is a statistics on the complexity of the password.\
    \ The output information is divided into 3 columns, which respectively indicate\
    \ the characters that constitute the password and the use of such characters.\n\
    The minimum number of characters in the password and the maximum number of such\
    \ characters in the password.\n\n5. The following is the statistics of simple\
    \ masks: The above information is a simple statistics of the password string mask\
    \ format.\nFor example, `stringdigit` means letters in front, numbers behind;\
    \ `stringdigitstring` means letters in front, numbers in the middle, and letters\
    \ behind.\n\n6. The following is the advanced statistics of the password string\
    \ mask format: The above information is an advanced statistics on the password\
    \ string. Among them, advanced statistics is to represent the password characters\
    \ in the password file in mask format. Four mask formats are used after statistics,\
    \ and each format consists of one `?` (Question mark) Add a lowercase letter to\
    \ indicate a set of characters. The representation and meaning of these four mask\
    \ formats are:\n`L`: represents the character set of lowercase letters a to z.\n\
    `U`: Represents the character set of uppercase letters A to Z.\n`D`: Represents\
    \ the character set of numbers 0-9.\n`S`: A collection of characters representing\
    \ special symbols.\nIn the mask format obtained, `?` represents one digit in the\
    \ password. For example, `?l?l?l?d` mask represents an 8-bit password composed\
    \ of `4?l` and `4?d`. Among them, the first 4 passwords consist of lowercase letters\
    \ a to z and the last 4 passwords consist of numbers-9.\n\n# Chapter 42 Generate\
    \ a Dictionary for Password Cracking\n\n![](Image00007.jpg)\n\nAfter the user\
    \ has collected enough target information and password policy, a password dictionary\
    \ can be created based on the obtained information. The following will introduce\
    \ the method of generating dictionary using `Crunch`, `rsmangler` and `rtgen`.\n\
    \n### 1) Use Crunch Tool\nCrunch is a password dictionary generator. It can generate\
    \ a password dictionary according to specified rules, and users can flexibly customize\
    \ their own dictionary files. The following will introduce the method using `Crunch`\
    \ to generate dictionary.\nThe syntax format of using `Crunch` to generate dictionary\
    \ is as follows:\n```\ncrunch [length] [options] [options]\n```\nIn the above\
    \ syntax, `length` indicates the minimum length of the generated password; the\
    \ maximum length of the generated password; the specified character set. `[options]`\
    \ indicates the valid options. Among them, the commonly used options and their\
    \ meanings are:\n`-o`: Specify the name of the generated dictionary file.\n`-b`:\
    \ Specify the maximum number of bytes written to the file. The size can be specified\
    \ in KB, MB, or GB, but must be used with the `-o` option.\n`-t`: Set the special\
    \ format used.\n`-l`: This option is used to identify some characters of placeholder\
    \ `@` or `^`. The default character set provided by the tool is saved in `/usr/share/crunch/charset.lst`.\
    \ At this point, the user can directly use these character sets to generate the\
    \ corresponding password dictionary. Users can use the `cat` command to view all\
    \ character sets, as follows:\n```\nroot@exampleserver:/usr/share/crunch# cat\
    \ charset.lst\n```\nThe above output information is all the default sets. In the\
    \ output information, the left side of equal sign indicates the name of character\
    \ set, and the right side indicates characters used. Use the Crunch tool to generate\
    \ a dictionary file with a minimum length of 8 and maximum length of 10, and save\
    \ it to `/root/crunch.txt`. Among them the character set used is `hex-lower`,\
    \ that is `0123456789abcdef`. The execution command is as follows:\n```\nroot@exampleserver:～#\
    \ crunch 8 10 hex-lower -o /root/crunch.txt\n```\nCrunch will now generate the\
    \ following amount of data: 133043228 bytes 1268 MB 12 GB. Crunch will now 100%\
    \ completed generating output As can be seen from the output information, 12GB\
    \ dictionary will be generated, with a total of 122473678 passwords. Moreover,\
    \ the progress of the generated password is displayed as a percentage. If the\
    \ user wants to view the password in the dictionary, he can use the `vi` editor\
    \ or the `cat` command to view it as follows:\n```\nroot@exampleserver: ~ # cat\n\
    ```\nThe above information is the generated password. Due to chapter, only some\
    \ passwords are listed.\n\n### 2) Use rsmangler tool\nrsmangler is a tool for\
    \ generating a dictionary based on the keywords of a word list. Use this tool\
    \ to build a dictionary based on the information collected by the user and use\
    \ common password construction rules. Among them, the grammatical format of `rsmangler`\
    \ tool is as follows:\n```\nrsmangler -f inputlist -o output\n```\nThe options\
    \ in the above grammar are:\n`-f`: Specify the input file, that is, the password\
    \ words collected by the user.\n`-o`: Specify the name of the generated dictionary\
    \ file.\n\nUse rsmangler tool to generate a dictionary. The specific steps are\
    \ as follows:\n1. Create a file to save the collected password words. Here will\
    \ create a file named `test`, simply save two words to generate a new dictionary.\n\
    ```\nroot@exampleserver:～# vi test\npassword\n```\n2. Use `rsmangler` tool to\
    \ generate a dictionary and save it to `pass.txt`. The execution command is as\
    \ follows:\n```\nroot@exampleserver:～# rsmangler -f test -o pass.txt\n```\nAfter\
    \ executing the above command, no information will be output. At this point, the\
    \ user can use the `cat` command to view the generated dictionary file as follows:\n\
    ```\nroot@exampleserver: ~ # cat pass.txt\n```\nYou can see the generated password\
    \ dictionary from the output information. Due to space limitations, only some\
    \ passwords are listed.\n\n### 3) Use rtgen tool\nThe `rtgen` tool is used to\
    \ generate rainbow tables. The rainbow table is a huge collection of possible\
    \ letter combinations and pre-calculated hash values. Among them, the generated\
    \ rainbow table includes multiple algorithms, such as LM, NTLM, MD5, SHA1, and\
    \ SHA256. Then, using the rainbow table can quickly crack all kinds of passwords.\
    \ The following will introduce the method of using the `rtegen` tool to generate\
    \ a rainbow table.\nThe syntax format is as follows:\n```\nrtgen hash_algorithm\
    \ charset plaintext_len_min plaintext_len_max table\n```\nThe meaning of the parameters\
    \ in the above syntax is as follows:\n`Hash_algorithm`: Specify the hash algorithm\
    \ used. Among them, the values that can be specified include `lm`, `ntlm`, `md5`,\
    \ `sha1`, and `sha256`.\n`Charset`: Specify the character set. Among them, the\
    \ default character set file provided by the `rtgen` tool is `/usr/share/rainbowcrack/charset.txt`,\
    \ as follows:\n```\nroot@exampleserver:/usr/share/rainbowcrack# cat charset.txt\n\
    ```\nThe above output information shows all character sets provided by the `rtgen`\
    \ tool by default. Among them, the minimum length of the specified password is\
    \ 4, and the maximum length is 8. The execution command is as follows:\n```\n\
    root@exampleserver:～# rtgen md5 loweralpha 4 8 010001000 0\n```\nSeeing the above\
    \ output information, it means that a rainbow table based on MD5 has been successfully\
    \ generated, the file name is `md5_loweralpha#4-6_0_1000x1000_0.rt`. Among them,\
    \ the rainbow table is saved in the `/usr/share/rainbowcrack` directory by default:\n\
    ```\nroot@exampleserver:～# cd /usr/share/rainbowcrack/\n```\nFrom the output information,\
    \ we can see that the generated table file is `md5_loweralpha#4-8_0_1000x1000_0.rt`.\
    \ To make it easier to use the generated rainbow table, you can use `rtsort` command\
    \ to sort it. The execution command is as follows:\n```\nroot@exampleserver:/usr/share/rainbowcrack#\
    \ rtsort\n```\nAfter executing the above command, no information will be output.\
    \ Next, you can use the rainbow table to perform cracking.\n\n# Chapter 43 Cracking\
    \ the Hash\n\n![](Image00007.jpg)\n\n## Cracking the Hash\n order to avoid the\
    \ harm caused by information leakage, in actual application, the software and\
    \ system will encrypt the password and then save it. Common encryption methods\
    \ are various hash algorithms. This type of algorithm can encrypt passwords of\
    \ different lengths into fixed-length strings. Since the encrypted string has\
    \ a fixed length and cannot be directly reversed, it has a very degree of security\
    \ and is therefore widely used. The method to crack the hashed password will be\
    \ introduced. The following section describes how to use `hashid` tool to identify\
    \ the encryption method.\n\nThe `hashid` tool to identify the encryption method.\
    \ When a penetration tester determines the encryption method of the hash, he can\
    \ choose targeted tools and methods to crack it, which can save a lot of time.\
    \ For example:\n```\nroot@exampleserver:# hashid 6bcecba2597f8\n```\nThe above\
    \ output information shows the possible hash methods. Among them, the hash type\
    \ shown in the front is more likely. It can be guessed that the hash type is MD5.\n\
    \n### LM Hashes\nLM (LAN Manager) Hash is one of the earliest password algorithms\
    \ used in the Windows operating system. The following will introduce the method\
    \ using `findmyhash` tool to crack LM Hashes. The syntax format of using `findmyhash`\
    \ is as follows:\n```\nfindmyhash OPTIONS\n```\nIn the above syntax, the parameter\
    \ indicates the type of password algorithm. The supported algorithms are MD4,\
    \ MD5, SHA1, SHA256, SHA512, GOST, LM, NTLM, CISCO, JUNIPER, LDAP. `OPTIONS` indicates\
    \ available options:\n`-hash_value`: Specify the cracked value.\n`-f`: Specify\
    \ the list of cracked files.\n`-g`: If the hashed password cannot be cracked,\
    \ Google search will be used. Use `findmyhash` tool to crack the original password\
    \ of LM hash. The execution command is as follows:\n```\nroot@exampleserver:～#\
    \ findmyhash -h 5dcc3b5aa765d1d8327deb88cf99\n```\nThe above output information\
    \ is the password. At this point, the user can use the `cat` command to view the\
    \ generated dictionary file as follows:\n```\nroot@exampleserver: ~ # cat\n```\n\
    The above information is the generated password. Due to chapter, only some passwords\
    \ are listed.\n\n### Use hash value directly\nWhen the user cannot crack the hashed\
    \ password, can be used directly without cracking by exploiting specific vulnerabilities.\
    \ In the Metasploit framework, you can use `exploit/windows/smb/psexec` test module\
    \ to bypass password verification. The following will introduce how to use this\
    \ module. By using `exploit/windows/smb/psexec` test module, the hashed password\
    \ is directly used. The specific steps are as follows:\n1. Use the `hashdump`\
    \ command to obtain the hash password in the Meterpreter session:\n```\nmeterpreter>\
    \ hashdump\n```\n2. Run the Meterpreter session in the background and switch to\
    \ the module configuration. The execution command is as follows:\n```\nmeterpreter>\
    \ background\n```\nBackground session 1...\n3. Select the `exploit/windows/smb/psexec`\
    \ module and view the module options. The execution command is as follows:\n```\n\
    msf exploit(handler)> use exploit/windows/smb/psexec\n```\n4. Configure option\
    \ parameters. The execution command is as follows:\n```\nmsf exploit(psexec)>\
    \ set RHOSTS 192.168.29.143\n```\nSet the remote host address.\n5. Implement penetration\
    \ and directly use hash values. The execution command is as follows:\n```\nmsf\
    \ exploit(psexec)> exploit\n```\nAs you can see from the output information, the\
    \ bob user successfully opened a session.\n\n# Chapter 44 Advanced Password Cracking\n\
    \n![](Image00007.jpg)\n\n## Bypass Windows login with Utilman\nUtilman is a Windows\
    \ auxiliary tool manager. Under Windows, even if there is no user login, you can\
    \ use the `Windows+U` key combination to call the Utilman process. With this mechanism,\
    \ the Windows login authentication mechanism can be bypassed to operate the system.\
    \ This section will introduce how to use this method. By replacing the `Utilman.exe`\
    \ file with `cmd.exe`, bypassing the login operation. The specific steps are as\
    \ follows:\n1. On a Windows computer, use the U disk installation medium to enter\
    \ the Kali Live mode. First start the U disk installation medium, the system installation\
    \ guide interface will be displayed.\n2. Select `Live (amd64)` on this interface\
    \ to enter Live mode. Then, open the Windows file system in this Live mode. As\
    \ shown, select `Places|Computer` in this interface.\n3. After clicking the `Computer`\
    \ option on this interface, the local computer file system will be opened.\n4.\
    \ This interface displays the file list of the Linux Live system. At this point,\
    \ select the `Other Locations` command in the left column to see other hard disk\
    \ files.\n5. This interface shows all the disk partitions in the computer. According\
    \ to the displayed partition size, find the partition of the Windows system. In\
    \ this example, the partition of the Windows system is `322GB Volume`. Therefore,\
    \ opening the hard disk partition will display the file list of the Windows system.\n\
    6. In this interface, enter the `Windows|System32` folder in turn, the content\
    \ shown will be displayed.\n7. Find the `Utilman.exe` file in the folder and rename\
    \ the file to `Utilman.old`. Then copy the `cmd.exe` file in the directory as\
    \ a copy, and modify its file name to `Utilman.exe`. Next, turn off Kali Live\
    \ mode and start the Windows system. Press `Wins+U` key combination on the login\
    \ interface, the interface shown will be displayed.\n8. From this interface, you\
    \ can see that a command prompt window is opened. In this window, you can execute\
    \ various terminal commands. For example, use the `whoami` command to view user\
    \ information.\n"
