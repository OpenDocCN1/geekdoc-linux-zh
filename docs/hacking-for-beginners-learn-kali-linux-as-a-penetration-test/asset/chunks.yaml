    ### 3) Use Ping command


    The `Ping` command can be used to check whether the network is connected or not.
    This can usually help users analyse and judge network failures. For domain name,
    you can usually specify multiple IP addresses. At this time, the user cannot determine
    which address the target server uses. Using `Ping` command to determine the target
    host. The syntax format of `ping` command is as follows:

    ```

    ping -c [count][target]

    ```

    In the above syntax, the option `-c` is used to specify the number of `Ping` packets
    sent and the parameter `[target]` is used to specify the address of the target
    host, where the target host address can be a host name, IP address or domain name.
    In Windows system, the `Ping` command only sends and responds to 4 packets to
    stop. In Linux system, the `Ping` command will always executed by default, and
    the user needs to press `Ctrl+C` combination to stop.


    **Use-case scenario:**

    Use the `Ping` command to detect the IP address of the domain name `wikipedia.com`,
    and specify to send only 4 packets. The execution command is as follows:

    ```

    root@exampleserver:～# ping -c 4 wikipedia.com

    ```

    After entering the above command we can see that the response packet from the
    target host is successfully received. It can be seen from the response packet
    information what IP address issued by the target.


    ## Chapter 13 Scanning ports


    ![](Image00004.jpg)


    By scanning the port, you can discover the programs running in the target host.
    After that we can collect information on these programs to obtain vulnerability
    information and successfully implement penetration testing. This section will
    introduce the concept of ports and methods of implementing port scanning.


    ### Introduction to Ports


    In computers, the port is considered as an essential concept. In network technology,
    ports have several meanings. The port referred to here is not a physical port,
    but a port in the TCP/IP protocol. It is a port in a logical sense. Among the
    TCP/IP protocols, the most commonly used protocols are TCP and UDP. Since the
    two protocols of TCP and UDP are independent, their respective port numbers are
    also independent of each other. For example, TCP has port `235`, UDP can also
    have port `235`, the two usually do not conflict.


    The functions of ports and commonly used ports are described below:


    ### 1) The role of the port


    Users know that a host corresponds to an IP address and can provide multiple services,
    such as Web services and FTP services. If there is only one IP, different network
    services cannot be distinguished, so use `IP+port number` to distinguish different
    services.


    ### 2) Definition of port


    The port number is used to identify the only process in the host, whereas `IP+port
    number` can identify the only process in the network. In Socket programming during
    network development, `IP + port number` is the socket. The port number is numbered
    by 16-bit binary numbers, and the range is between `0`～`65535`. However, these
    ports cannot be used casually, and some ports can be already occupied. For example,
    the port of the Web server is `80`, the port of the FTP service is `21`, etc.
    Therefore, ports are classified and the range of ports that users can use is specified
    rigorously for pen-testers. Always have a good knowledge about the ports that
    your target has.


    ### 3) Port classification


    There are many ways to classify ports. Usually they will be classified according
    to the fact whether they are used by the server or by the client. The port number
    used by the server can be divided into a reserved port number and a registered
    port number as follows:

    '
  raw: 'Reserved addresses. The front of this type of IP address is 1111, so the network
    number of the address ranges from 240 to 255.Among IP addresses, there is also
    a special type of IP address, known as a broadcast address. The broadcast address
    is an address specifically used to send to all hosts in the network at the same
    time. In a network using the TCP/IP protocol, the IP address whose host identification
    segment is all 1s is a broadcast address, and it should be noted that broadcast
    packets are transmitted to all computers involved in the host identification segment.The
    IP address is mainly divided into network segments according to the subnet mask.
    For example, if the subnet mask corresponding to the IP address 192.168.1.100/24
    ​​is 255.255.255.0, the network segment is 192.168.1.0-255, that is, there are
    256 hosts in the network segment.When a user discovers a host, he can specify
    the network range through the mask format. Among them, for input convenience,
    CIDR format is usually used to specify the entire subnet. Among them, the CIDR
    format is composed of two parts, the network address and the subnet mask, separated
    by a slash (/).If the user is not sure of the subnet mask format corresponding
    to an IP range, you can use the Net-mask tool to achieve it. It should be said
    that this tool can convert between IP ranges, subnet mask, CIDR, Cisco and other
    formats, and provides the conversion between dotted decimal, hexadecimal, octal
    and binary IP addresses.2) Determine the network topologyThe user can determine
    the upper-level network range based on the routing entry. In a penetration test,
    by determining the network topology, you can determine whether the target is a
    local area network or an external network. In this way, penetration testing tools
    can be selected in a targeted manner, thereby improving the efficiency of penetration
    testing. The following section will introduce the use of the Trace-route tool
    to obtain routing entries of the target host to determine the network topology.The
    syntax format of using this tool to implement route tracking is as follows:traceroute
    [Target]Here, target is the address of the host network we are trying to find
    information about.Use-case scenario:Use the Trace-route tool to trace the route
    of the target host 72.132.234.64 to determine its network topology.The execution
    command is as follows:root@exampleserver:～# traceroute 72.132.234.64This will
    show the results about that particular host in detail. If you actually run this
    command a bunch of things will popup on the computer screen. A lot of this information
    is about the packets and the route they have chosen. Advanced security researchers
    analyse these packet tokens during an attack scenario to check whether the hacker
    has left any fingerprints on the server.Note: In the NAT mode of the virtual machine,
    there will be a problem with the operation of Trace-route. The upper level routing
    information cannot be displayed. Make sure you know about this while working.Chapter
    10Scanning the host![](Image00004.jpg)In the previous chapter, we learned about
