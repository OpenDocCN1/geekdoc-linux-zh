    # 第 41 章 为暴力破解创建字典


    ![](img/Image00007.jpg)


    在本模块的之前的章节中，我们讨论了无线黑客。由于无线网络密码在技术的几乎每个部分都被广泛使用，网站、操作系统、在线服务器以及许多其他设备都使用密码来保护信息。作为黑客，尝试破解这些密码是一项具有挑战性的任务。如今，人们已经意识到了这一点并开始使用强密码。然而，仍然有数以万的人对此并不了解，如果他们尝试，可以为我们提供帮助。本章将详细介绍暴力破解。请随我们一起！


    ## 创建密码字典


    这里的字典是指密码字典。如果你想实施密码攻击，密码字典是必不可少的。用户可以收集并分析密码信息，来创建一个更合理的密码字典。这样做不仅可以提高破解成功率，还可以缩短破解时间。本节将介绍如何创建字典。


    ### 密码信息收集

    在创建密码字典之前，你可以先收集密码。例如，你可以收集与目标相关的电子邮箱地址、网站博客文章、Twitter 推文、单位名称和人员姓名等信息。因为大多数用户为了方便记忆会使用最简单的密码，或者使用个人相关信息（如单位名称、门号等）作为密码。此时，如果将这些信息收集并添加到字典文件中，就可以提高破解成功率。


    ### 加密策略分析

    密码策略是指系统对用户设置的密码施加的各种限制，例如不允许只使用数字、连续数字和英文字母等。例如，某些软件或系统会有相应的密码策略来提高其安全性。此时，用户可以通过分析这些设备的密码策略，有针对地创建密码字典。下一节将介绍密码策略分析方法。


    #### 1) 软件/系统内置策略

    内置策略指的是软件/系统本身内置的密码策略。为了安全，某些软件/系统具有固定策略以避免被轻易破解。如果软件/系统具有内置策略，用户在注册账户时会收到密码长度和复杂度要求的提示。

    例如，在安装 Oracle 数据库时，用户会被提示设置的密码足够复杂。安装 Linux 操作系统时，会提示设置 root 用户密码。此时，用户可以通过分析软件/系统的内置策略来创建相应的策略字典。


    #### 2) 强化策略

    强化策略是指针对软件/系统的额外建议标准。例如，在 Windows 系统中，使用组策略来强化密码策略，允许用户设置更安全的密码。此时，用户可以使用组策略分析工具分析密码策略，然后构建一个更强大的密码字典。下一节将介绍如何使用组策略分析工具来分析密码策略。


    ## 使用组策略分析密码策略

    具体步骤如下：

    1. 使用 `Win+R` 组合键启动“运行”对话框。

    2. 在“打开”文本框中输入 `gpedit.msc` 命令，然后点击“确定”按钮打开“本地组策略编辑器”界面。

    3. 在左栏中，选择 `计算机配置` | `Windows 设置` | `安全设置` | `账户策略` | `密码策略` ，将显示密码策略设置界面。

    4. 从此界面，你可以看到 Windows 系统密码策略的相关设置，例如是否启用复杂度要求、最小密码长度值、使用期限以及是否记住密码历史等。


    ### 3) 分析现有的密码字典策略

    用户可以分析目标用户所在的泄露密码，获取相似分组的密码设置策略，然后以此构建新字典。马尔可夫攻击（Markov Attack）可以分析现有的密码字典文件，统计字典中每个字符的出现概率、位置分布和上下文。然后，结合这些规则，可以使用掩码（mask）生成更有效的密码字典。Kali
    Linux 提供了一个名为 `Statsprocessor` 的工具，支持马尔可夫攻击技术。下一节将介绍使用该工具分析密码字典策略的方法。


    语法格式如下：

    ```

    statsgen [options] passwords.txt

    ```

    在上述语法中，`options` 代表可用选项；`passwords.txt` 代表被分析的密码字典。


    ### 使用 statsgen 工具分析 rockyou.txt 密码字典

    1. 执行命令如下：

    ```

    root@exampleserver:～# statsgen rockyou.txt

    ```

    执行上述命令后，它将开始分析指定的密码字典并进行统计。其中，输出信息包括工具的基本统计信息、密码长度、字符集、密码复杂度、简单掩码（simple mask）和高级掩码。


    为了让用户更清楚地了解输出结果，下一节将逐一介绍信息中的每个部分。其中，第一部分信息是 `statsgen` 工具的基本信息，如下：

    从输出信息中，你可以看到 `statsgen` 工具的版本信息、分析的密码文件以及对密码文件的统计情况。

    通过分析输出信息可以看出，工具版本为 `0.0.3`；分析的密码字典是 `rockyou.txt`；密码字典包含 `14,343,392` 个密码。


    2. 以下是密码长度统计信息。上述信息基于密码字典中密码长度的统计，并按比例倒序排列。其中，输出信息分为 3 列，分别是密码长度、占总数的比例以及该长度的密码总数。

    例如，第一行信息表示长度为 8 的密码占总数的 20%，该长度的密码总数为 966037。


    3. 以下是密码字符集的统计。

    从输出信息中我们可以看到密码字典中各种字符集的统计。


    4. 以下是密码复杂度的统计。上述统计的输出信息分为 3 列，分别表示构成密码的字符、密码的最小数量以及密码总数。


    5. 以下是简单掩码统计。上述信息是密码字符串的简单掩码格式。例如，`stringdigit` 表示字母后面跟数字；`digitstring` 表示数字后面跟字母。


    6. 以下是高级掩码统计。上述信息是密码字符串的高级掩码格式。其中，高级统计是密码字符的掩码格式。每个格式使用一个 `?`（问号）表示字符集，含义如下：

    `L`: 代表小写字母 a 到 z。

    `U`: 代表大写字母 A 到 Z。

    `D`: 代表数字 0-9。

    `S`: 代表特殊符号。

    例如，掩码 `?l?l?l?d` 表示 8 位密码，由 4 位小写字母和 4 位数字。


    # 第 42 章为破解生成字典


    ![](img/Image00007.jpg)


    在用户收集了足够的目标信息和密码策略后，可以根据获取的信息创建密码字典。以下将介绍使用 `Crunch`、`rsmangler` 和 `rtgen` 生成字典。


    ### 1) 使用 Crunch 工具

    Crunch 是一个密码字典生成器。它可以根据指定的规则生成密码字典，用户可以灵活自定义自定义字典。以下将介绍使用 `Crunch` 生成字典的方法。

    使用 `Crunch` 生成字典的语法格式如下：

    ```

    crunch [length] [length] [options]

    ```

    在上述语法中，第一个 `length` 表示生成密码的最小长度；第二个 `length` 表示生成密码的最大长度；指定的字符集 `[options]` 表示有效选项。其中，常用选项及其含义为：

    `-o`: 指定生成字典的文件。

    `-b`: 指定写入文件的最大字节数。大小可以是 KB、MB 或 GB，但必须配合 `-o` 使用。

    `-t`: 设置特殊格式。

    `-l`: 用于识别某些字符如 `@` 或 `^`。工具提供的默认字符集保存在 `/usr/share/crunch/charset.lst`。此时用户可以直接使用这些字符集生成对应的密码字典。用户可以使用
    `cat` 命令查看所有字符集，如下：

    ```

    root@exampleserver:/usr/share/crunch# cat charset.lst

    ```

    上述输出均为默认集合。在输出信息中，等号左侧是字符集的名称，右侧是使用的字符。使用 Crunch 工具生成一个最小长度 8、最大长度 10 的字典文件，并保存到
    `/root/crunch.txt`。其中使用的字符集是 `hex-lower`，即 `0123456789abcdef`。执行命令如下：

    ```

    root@exampleserver:～# crunch 8 10 hex-lower -o /root/crunch.txt

    ```

    Crunch 现在将生成以下数据：133043228 字节、1268 MB、12 GB。Crunch 现在已完成 100% 生成。从输出信息可以看出，将生成
    12GB 的字典，总共有 122473678 个密码。此外，生成的进度以百分比显示。如果用户想查看字典中的密码，可以使用 `vi` 编辑器或 `cat` 命令查看如下：

    ```

    root@exampleserver: ~ # cat

    ```

    上述信息为生成的密码。由于章节限制，仅列出了密码。


    ### 2) 使用 rsmangler 工具

    rsmangler 是一个根据词列表关键词生成字典的工具。使用此工具根据用户收集的信息并常用的密码构造规则构建字典。其中，`rsmangler` 工具的语法格式如下：

    ```

    rsmangler -f inputlist -o output

    ```

    上述语法中的选项为：

    `-f`: 指定输入文件，即用户收集的密码词。

    `-o`: 指定生成字典的文件名。


    使用 rsmangler 工具生成字典的具体步骤如下：

    1. 创建一个文件保存收集的密码。这里创建一个名为 `test` 的文件，并将单词生成新字典。

    ```

    root@exampleserver:～# vi test

    ```

    2. 使用 `rsmangler` 工具生成字典并保存到 `pass.txt`。执行命令如下：

    ```

    root@exampleserver:～# rsmangler -f test -o pass.txt

    ```

    执行上述命令后将输出。此时用户可以使用 `cat` 命令查看生成的字典文件如下：

    ```

    root@exampleserver: ~ # cat pass.txt

    ```

    你可以看到生成的字典。由于空间限制，仅列出了密码。


    ### 3) 使用 rtgen 工具

    `rtgen` 工具用于生成彩虹表（rainbow tables）。彩虹表是大量字母组合的预计算哈希值。其中生成的彩虹表包含多种算法，如 LM、NTLM、MD5、SHA1
    和 SHA256。然后使用彩虹表可以快速破解各种密码。以下将介绍使用 `rtgen` 工具生成彩虹表的方法。语法格式如下：

    ```

    rtgen hash_algorithm charset plaintext_min plaintext_max

    ```

    上述语法中的参数含义如下：

    `Hash_algorithm`: 指定使用的哈希算法。其中包含 `lm`、`ntlm`、`md5`、`sha1` 和 `sha256`。

    `Charset`: 指定字符集。其中 `rtgen` 工具提供的默认字符集文件为 `/usr/share/rainbowcrack/charset.txt`，如下：

    ```

    root@exampleserver:/usr/share/rainbowcrack# cat charset.txt

    ```

    上述输出显示所有字符集。其中指定的最小长度为 4，最大长度为 8。执行命令如下：

    ```

    root@exampleserver:～# rtgen md5 loweralpha 4 8 01000

    ```

    看到上述输出意味着成功生成了基于 MD5 的彩虹表，文件名为 `md5_loweralpha#4-8_0x1000.rt`。其中彩虹表默认保存在 `/usr/share/rainbowcrack/`
    目录下：

    ```

    root@exampleserver:～# cd /usr/share/rainbowcrack/

    ```

    从输出信息可以看出生成的表是 `md5_loweralpha#4-8_0x1000.rt`。为了方便使用生成的彩虹表，可以使用 `rtsort` 命令对其排序。执行命令如下：

    ```

    root@exampleserver:/usr/share/rainbowcrack# rtsort

    ```

    执行上述命令后将输出信息。接下来可以使用彩虹表进行破解。


    # 第 43 章 破解哈希


    ![](img/Image00007.jpg)


    ## 破解哈希

    为了避免信息泄漏造成的危害，在实际应用中，软件和系统会对密码加密后保存。常见的加密方法有各种哈希算法。这类算法可以将不同长度的密码加密为固定长度的字符串。由于加密字符串长度固定且无法直接反转，因此具有很高的安全性并被广泛使用。本节将介绍破解哈密码的方法。下节描述了如何使用
    `hashid` 工具识别加密方法。当渗透测试人员确定了哈希的加密方法后，可以选择针对性的工具和方法进行破解，从而节省大量时间。例如：

    ```

    root@exampleserver:# hashid 6bcecba2597f8

    ```

    上述输出显示了可能的哈希方法。其中前面的哈希类型更有可能。可以推测哈希类型为 MD5。


    ### LM 哈希

    LM (LAN Manager) 哈希是 Windows 系统最早使用的密码算法之一。以下将介绍使用 `findmyhash` 工具破解 LM 哈希。使用
    `findmyhash` 的语法格式如下：

    ```

    findmyhash OPTIONS

    ```

    在上述语法中，参数指示密码类型。支持的算法有 MD4、MD5、SHA1、SHA256、SHA512、GOST、LM、NTLM、CISCO、JUNIPER、LDAP。`OPTIONS`
    表示可用选项：

    `-hash_value`: 指定破解的值。

    `-f`: 指定破解列表。

    `-g`: 如果哈希密码无法破解，将使用 Google 搜索。使用 `findmyhash` 工具破解 LM 哈希的原始密码。执行命令如下：

    ```

    root@exampleserver:～# findmyhash -h 5dcc3b5aa765d1d8327deb88cf99

    ```

    上述输出信息为密码。此时用户可以使用 `cat` 命令查看生成的字典文件如下：

    ```

    root@exampleserver: ~ # cat

    ```

    上述信息为生成的密码。由于章节限制，仅列出了密码。


    ### 直接使用哈希值

    当用户无法破解哈希密码时，可以直接使用而无需破解。


