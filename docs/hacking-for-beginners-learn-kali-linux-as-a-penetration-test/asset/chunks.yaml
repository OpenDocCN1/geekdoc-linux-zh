    Users can use the help command to view all the supported commands: ￼meterpreter>
    help￼The above output information shows all the commands that can be run under
    the Meterpreter command line. The function of each command in the output information
    has a detailed description. Users can execute corresponding commands according
    to their needs.Enter the shell of the target host.The execution command is as
    follows: ￼meterpreter> shell￼ Process 1216 created.￼ Channel 1 created.￼From the
    output information, we can see that we successfully exited the shell of the target
