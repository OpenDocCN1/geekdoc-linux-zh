    and Exploit Networks![](Image00006.jpg)IntroductionIn the previous modules of
    this book we have talked about Kali Linux and its Philosophy. We also have gone
    through various information gathering and vulnerability scanning tools to make
    this hacking course a well versed one.In this next module we will increase in
    our intensity for approaching the subject. We will talk about exploits and their
    functionalities. We will provide various payload examples for making your work
    easy. Follow along!Disclaimer:Writers of this book never intended this book to
    write for encouraging malicious practices. Any mischief the readers do after reading
    this book is purely depends on individual ethics.Chapter 26Introducing Metasploit![](Image00006.jpg)Metasploit
    is an open source security vulnerability detection tool. It can help network security
    and IT professionals identify security issues, verify the solutions to vulnerabilities,
    and complete the security assessment of the target. The tool encompasses various
    functions such as intelligent development, code auditing, web application scanning,
    and social engineering. This section will introduce the related concepts of Metasploit.What
    is Metasploit?Metasploit is a free, downloadable framework. Through it, network
    security personnel can easily obtain, mine, and attack computer software vulnerabilities.
    The Metasploit framework can be used to discover vulnerabilities, exploit vulnerabilities,
    submit vulnerabilities, and carry out attacks. Moreover, users can import data
    from other vulnerability scanners, discover attackable vulnerabilities based on
    the detailed information of vulnerable hosts, and launch attacks on the system
    using payloads.The power of Metasploit framework is that it provides a large number
    of penetration testing modules and plug-ins. These modules can be divided into
    7 types according to different purposes, namely Exploits (infiltration attack
    module), Auxiliary (auxiliary module), Post (post infiltration attack module),
    Payloads (attack payload module), Encoders (encoder module), Nops (Empty instruction
    module) and Evasion (avoidance module). The functions of these 7 modules and plug-ins
    will be introduced below.1) Penetration attack moduleThe penetration attack module
    mainly uses the discovered security vulnerabilities or configuration weaknesses
    to attack the target system to implant and run the attack load, thereby gaining
    access control rights of the target system. The penetration attack module in the
    Metasploit framework can be divided into active penetration attacks and passive
    penetration attacks according to the location of the security vulnerabilities.Among
    them, the difference between these two types of attacks is as follows. ·'
