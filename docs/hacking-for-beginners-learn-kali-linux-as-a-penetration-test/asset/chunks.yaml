    4Introducing Kali Linux features![](Image00002.jpg)In the previous chapter we
    have introduced different methods to install Kali Linux in both virtual and physical
    systems. Before starting to learn about different tools that Linux comes with
    it is important to understand the functionalities of Kali as an operating system.
    Learn about its terminal and network capabilities can improve your productivity
    while pen testing. A lot of the sections that are described in this chapter needs
    access to the Kali system for better understanding. So, make sure that you are
    having a Kali Linux operating system on your computer while reading this book.Kali
    Linux in DepthIf you configure the Kali Linux system then you need to have a simple
    understanding of the system, such as the use of the menu bar, file management,
    system settings. This section will introduce the common operations of Kali Linux
    system.Command menuA large number of penetration testing tools are provided in
    Kali Linux. These tools are classified into different categories such as information
    collection, vulnerability analysis, Web programs. The user can see all the categories
    by selecting the "Application" tab on the graphical interface.From this starting
    interface, you can see that the application includes 14 categories. Moreover,
    each category has definite subcategories. Out of all the softwares available some
    tools are run on the graphical interface while some run on the command line. For
    tools running on a graphical interface, it is more convenient to start them through
    a menu command. For the tools running on the command line, it is often not available
    or possible to enter from the menu command and must be executed in the terminal.
    Therefore, it is not recommended to enter the tool from the command line. Always
    make sure that you refer individual doc format of tools for both GUI and CLI commands.File
    toolThe File tool is used to manage files in a graphical interface. If you want
    to perform file management, you need to be very clear about the file system structure.
    Otherwise, you may face the problem of not being able to find the location of
    the file. Linux system is different from Windows system. Unlike windows it does
    not store files by drive letter. There is only one root partition in the Linux
    system, and all files are in the root directory. In order to facilitate users
    to better manage files, first we will in detail explain the file system structure
    of the Linux system.The file system structure under Linux is a tree, and the entry
    of it is the file directory under the /(root) tree structure. No matter which
    version of the Linux system, there are these directories, which are standardised
    directories. There will be some small differences between various Linux distributions,
    but overall they are similar. When users try to understand the structure of the
    Linux file system, they may not know the division of these files very well due
    to its complexity.There are several important directories in Linux such as :1)
    Home DirectoryEvery user under Linux has a home directory, which stores the user''s
    files. Among them, the location of the user file is /home/username. However, the
    home directory of a super user is different from that of an ordinary user. The
    home directory of a super user is /root, which is also called the home directory.
    When the user opens the terminal, the location is the home directory of the user
    who logs in to the system. In addition, each ordinary user can only access his
    own home directory. However, the administrator can access the home directories
    of all users. This is why hackers always try to hack the privileges of an administrator
    as there can be more ways to exploit the system.2) Root DirectoryThe root directory
    is the entry of the file system and is called the highest level directory. Every
    file and directory starts from the root directory, and only the root user has
    write permissions under this directory.3) Several other important foldersIn addition
    to the two directories mentioned above, there are several important folders that
    users need to understand, such as /etc, /bin, /sbin, etc.Here is a small introduction
    about them:'
