- fmt: '

    For example, to implement Nmap Ping scan on the target host, you can select the
    `Hosts|Nmap Scan|Ping Scan` command in turn. After selecting the `Ping Scan` command
    on this interface, you can perform Ping scan on the target host.


    ## Metasploit Terminal


    `msfconsole` (MSF terminal (`msfconsole`)) is currently the most popular user
    interface of the Metasploit framework, and MSF terminal is one of the most flexible,
    feature-rich, and best-supported tools in the Metasploit framework. The MSF terminal
    provides a one-stop interface that can set almost every option and configuration
    in the Metasploit framework. The user can use the `msfconsole` terminal to do
    anything, including launching an infiltration attack, loading auxiliary modules,
    performing an enumeration, creating a listener, or performing automated infiltration
    attacks on the entire network. The terminal mode of Metasploit will be introduced
    below.


    ### Start the terminal mode of Metasploit

    The execution command is as follows:

    ```

    root@exampleserver:～# msfconsole

    ```

    After executing the above command, you can successfully start Metasploit''s terminal
    mode.


    Seeing the command line prompt as `msf5>`, it means that Metasploit''s terminal
    mode has been successfully started. From the output information, you can see the
    supported attack modules and the corresponding number. For example, there are
    2343 penetration attack load modules, 1923 auxiliary modules, 328 post-penetration
    attack modules, 546 attack load modules, 44 encoding modules, 10 empty command
    modules, and 2 evasion modules. Next, users can use these attack payloads to perform
    penetration testing.


    ### Initialize Metasploit

    In Kali Linux, Metasploit mainly uses `PostgreSQL` database to store data. Therefore,
    when using the Metasploit framework, you need to start the `PostgreSQL` database.

    The execution command is as follows:

    ```

    root@exampleserver:～# service postgresql start

    ```


    ### Start the PostgreSQL database

    Later, you also need to use the `msfdb init` command to create and initialize
    the database.

    The execution command is as follows:

    ```

    root@exampleserver:～# msfdb init

    ```


    ### Initialize the database

    From the above output information, you can see that the `msf` and `msf_test` databases
    are automatically created. Moreover, the database configuration file `database.yml`
    is created.

    Prompt: If the current system has initialized Metasploit, it will prompt that
    the database has been configured. as follows:

    ```

    Metasploit running on Kali Linux as root, using system database

    A database appears to be already configured, skipping initialization

    ```


    ## Create Workspace

    In order to distinguish different scanning tasks, multiple workspaces can be created
    to save various information of different scanning tasks. Among them, the information
    between different work areas is independent of each other to avoid data confusion.

    The syntax format for creating a workspace is as follows:

    ```

    workspace -a [name]

    ```

    In the above syntax, the `-a` option means to add a workspace.


    ### Create a workspace named test

    The specific steps are as follows:


    1. **Check the current working area.**

    The execution command is as follows:

    ```

    msf5> workspace

    ```

    `* default`

    As you can see from the output information, there is only one `default` workspace
    by default. Moreover, the workspace is currently in use.


    2. **Create a new workspace.**

    The execution command is as follows:

    ```

    msf5> workspace -a sample

    ```

    `[*] Added workspace: sample`

    `[*] Workspace: sample`

    From the output information, you can see that the workspace `sample` is successfully
    added. Moreover, it has automatically switched to the newly created workspace.


    3. **View the current working area.**

    The execution command is as follows:

    ```

    msf5> workspace

    ```

    `* default sample`

    As can be seen from the output information, there are currently two working areas.
    Among them, `sample` is currently in use. If the user wants to switch the workspace,
    he can use the `workspace [name]` command.


    4. **Switch work area.**

    The execution command is as follows:

    ```

    msf5> workspace default

    ```

    `[*] Workspace: default`

    Seeing the information above, it means you have successfully switched to the default
    workspace.


    ## Import scan report

    When the user prepares the workspace, he can perform penetration testing. At this
    point, users can import some third-party scan reports to obtain host information.
    Among them, the syntax format of the imported scan report is as follows:

    ```

    db_import [example]

    ```


    ### Import the scan report file openvas

    The specific steps are as follows:


    1. **Before importing the scan report**, the user can check the supported report
    format as follows:

    ```

    msf5> db_import

    ```

    `Usage: db_import [example]`

    Filenames can be globs like `.xml`, which will search recursively. From the output
    information, you can see all report file types supported for import, such as Nessus
    XML, Nmap XML, and OpenVAS XML.


    2. **Import the scan report file openvas.**

    The execution command is as follows:

    ```

    msf5> db_import /root/openvas.xml

    ```

    `[*] Importing''OpenVAS XML'' data`

    `[*] Successfully imported /root/openvas.xml`

    Seeing the above output information, it means the report file `openvas.xml` has
    been successfully imported.


    3. **View the imported host.**

    The execution command is as follows:

    ```

    msf5> workspace

    ```

    From the output information, we can see that there are 3 hosts and 8 services
    in the default workspace. It can be explained that the information of 3 hosts
    has been imported.


    ## Query penetration test module

    Vulnerability is mainly realized through the penetration testing module of Metasploit.
    Therefore, users need to find the corresponding penetration test module based
    on the vulnerability. In Metasploit, you can use the `search` command to quickly
    find penetration testing modules. Users can also go to some third-party websites
    to find penetration testing modules and import them into Metasploit to implement
    vulnerability. This section will introduce how to query the penetration test module.


    ### Pre-analysis scan report

    The user has successfully imported the scan report in the previous section. At
    this point, the user can analyze the scan report to find out the vulnerabilities
    in the target system. Then, according to the vulnerability, find the test module
    that can exploit the vulnerability and implement the attack. The following will
    introduce the method of pre-analyzing the scan report.

    The specific steps are as follows:


    1. **Use the `hosts` command to view the reported host information.**

    The execution command is as follows:

    ```

    msf5> hosts

    ```

    From the output information, we can see that there are 3 hosts in the scan report.
    Among them, the addresses are `192.168.29.223`, `192.168.29.225`, and `192.168.29.127`.


    2. **Use the `vulns` command to view vulnerability information.**

    The execution command is as follows:

    ```

    msf5> vulns

    ```

    Next, users can use `Name` or reference information (`References`) to search for
    the attack payload that can be used.


    ### Manually find the attack payload

    After users determine the vulnerabilities in the target system, they can search
    for penetration testing modules in Metasploit to select the penetration testing
    modules that can exploit their vulnerabilities, and then implement penetration
    testing. The following will introduce the method of manually searching the penetration
    test module using the `search` command.

    The syntax format for finding the penetration test module is as follows:

    ```

    search [options]

    ```

    In the above statement, `options` means supported options; keywords means available
    keywords. Next, we will manually find the CVE vulnerability as the penetration
    test module in 2020.

    The execution command is as follows:

    ```

    msf5> search cve:2020

    ```

    From the output information, we can see that all penetration test modules with
    a release date of 2020 have been searched. The output information includes 5 columns
    of information, which respectively represent `Name` (the name of the attack payload),
    `Disclosure Date` (release date), `Rank` (level), `Check` (whether vulnerability
    detection is supported), and `Description` (description information).


    In the pre-analysis scan report of the above, look for the penetration test module
    with the vulnerability name `MS17-010 SMB RCE Detection`.

    The execution command is as follows:

    ```

    msf5> search name:MS19-010 SMB RCE Detection

    ```

    From the output information, we can see that all penetration test modules that
    can exploit MS19-010 vulnerabilities have been found. At this point, the user
    can select a penetration testing module to implement penetration testing. For
    example, select the penetration testing module named `exploit/windows/smb/ms19_010_eternalblue`.

    The execution command is as follows:

    ```

    msf5> exploit/windows/smb/ms19_010_eternalblue

    msf5 exploit(windows/smb/ms19_010_eternalblue)

    ```


    ### Third-party search

    If users cannot find a valid penetration test module in Metasploit, they can also
    find it from third-party websites, such as CVE vulnerability sites and exploitDB.
    In addition, Metasploit also supports importing third-party modules and implementing
    penetration testing. The following describes how to find penetration testing modules
    from these third-party websites.


    1. **Find through the CVE website**

    The address of the CVE vulnerability website is `https://www.cvedetails.com/`.
    After successfully accessing the website in the browser, the interface will be
    displayed. At this point, users can search for penetration test modules by CVE
    ID, product name, or vulnerability type. For example, query related vulnerabilities.
    Enter `Microsoft` in the search box, and then click the Search button to display
    the search results. From this interface, you can see the searched Microsoft related.
    It can be seen from the statistical results that a total of 6328 vulnerabilities
    have been found. At this point, select the `Vulnerabilities (6328)` option to
    display the detailed information. From this interface, you can see all the vulnerability
    information including CVE ID, vulnerability type, release date, and score. For
    example, CVE is `CVE-2020-0879`, the vulnerability type is `Code Overflow`, the
    release date is `2020-04-09`, and the update date is `2020-04-11`.


    2. **Find through exploitDB website**

    The address of exploitDB vulnerability website is `https://www.exploit-db.com/`.
    After successfully accessing the website in the browser, the interface will be
    displayed. Enter some keywords of the attack payload on this interface to search
    for the penetration test module. When searching, users can also select the `Verified`
    and `App` checkboxes to filter the verified and application. For example, search
    for the penetration test module of the `Windows` system. After the search successful,
    the boundary will be displayed. From this interface, you can see all the searched
    results. The output information includes 8 columns, indicating `Date` (release
    date), `D` (download penetration payload), `A` (available application), `V` (verified),
    `Title` (vulnerability title), `Type` (type), `Platform` (platform), and `Author`
    (author). Here, users can choose to download and view detailed information about
    the vulnerability. If you want to download the penetration test module, click
    the download button in column `D`. If you want to view the detailed information,
    just click the title of the vulnerability. From the description of the interface,
    you can see the details of the vulnerability. In addition, users can download
    some penetration testing modules this website and manually import them into Metasploit.


    3. **Manually import third-party modules**

    Metasploit''s own modules are very rich, but sometimes they cannot fully meet
    the needs of users. For some relatively new or vulnerabilities without official
    module support, users can only manually write or import third-party modules. For
    general users, it is more convenient to use by directly importing third-party
    modules, and is not easy to make mistakes. The following will introduce the method
    of manually importing third-party modules.

    Import the third-party module downloaded from the exploitDB website, and use the
    module to perform penetration testing. Here will take `exiftran` command injection
    as example, and set the file name to `webtest.rb`.

    The specific steps are as follows:


    1. **Copy the module file `webtest.rb` to the module location corresponding to
    Metasploit.**

    Among them, the default location of Metasploit module is `/root/.msf4/modules`.
    In order to distinguish the modules conveniently, users can create corresponding
    folders according to the classification of the modules to store different types
    of modules. In this example, a penetration attack module will be imported, so
    a folder named `exploits` will be created here as follows:

    ```

    root@exampleserver:～# mkdir /root/.msf4/modules/exploits

    ```

    After executing the above command, there will be no information output. Here,
