    # 新扫描任务


    在策略创建成功后，必须创建一个新的扫描任务来执行漏洞扫描。在创建任务时，用户需要选择扫描策略。用户可以选择自己创建的扫描策略，也可以直接使用 Nessus
    自带的扫描策略模板。创建新扫描任务的操作流程介绍如下：


    1) 在 Nessus 菜单栏中，点击 `Scans` 标签，将显示扫描任务界面。

    2) 点击界面右上角的 `New Scan` 按钮，将显示扫描模板界面。

    3) 此界面显示了一些可使用的特定扫描任务模板。此外，你可以在 `User Defined`（用户自定义）标签下看到用户手动创建的策略模板。在这里你可以选择使用之前创建的策略来创建扫描任务，点击
    `User Defined` 标签，将显示用户创建的策略模板。

    4) 点击策略模板 `sample`，将显示 `New Scan Task` 对话框。

    5) 在此界面设置扫描任务名称、描述信息、文件夹和扫描目标。设置上述信息后，点击 `Save` 按钮查看新创建的扫描任务。

    6) 从此界面，你可以看到已创建一个名为 `Network Scan` 的新扫描任务。


    # 漏洞扫描


    在完成前面的操作后，Nessus 服务将进行配置。漏洞将在将在部分实施。这里我们使用之前创建的扫描任务执行漏洞扫描。实施漏洞扫描的具体步骤如下：


    1) 打开扫描任务界面。

    2) 点击 `run` 按钮开始扫描目标主机。

    3) 从此界面，你可以看到扫描任务的状态为 `(Running)`（正在运行），表示扫描正在进行。如果你想停止扫描，可以点击 `Stop` 按钮。如果扫描任务已暂停，点击
    `Pause` 按钮。扫描完成后，将显示界面。

    4) 从此界面，你可以看到扫描状态以图标形式显示，意味着扫描完成。点击扫描任务名称 `Network Scan` 查看扫描结果。

    5) 此界面显示了所有扫描的主机及其漏洞信息。从显示的结果中，你可以看到扫描的主机数量为 8 个，漏洞数量为 99 个，扫描历史数量为 1 条。如从 `Vulnerabilities`
    列所示，不同级别的漏洞及其数量以不同的颜色显示。用户将鼠标悬停在每个颜色上，也可以看到漏洞的百分比。在右下角，饼图显示了每种漏洞的比例，饼图右侧显示了每种漏洞的安全级别。其中，颜色安全级别为：`Critical`（严重，红色）、`High`（高，橙黄色）、`Medium`（中等，黄色）、`Low`（低，绿色）、`Info`（信息，蓝色）。在下一节中，用户可以查看并分析每个主机的漏洞信息。


    # 分析并导出漏洞扫描报告


    用户扫描目标主机后，可以分析扫描结果并获取目标主机的漏洞信息。为了方便用户分析扫描结果，Nessus 支持用户从扫描结果生成不同格式的报告。其中，Nessus
    支持的文件格式包括 `Nessus`、`PDF`、`HTML`、`CSV` 和 `Nessus DB`。将详细介绍分析和导出漏洞扫描报告的方法。请遵循操作！


    ## 1. 分析漏洞扫描结果


    分析通过扫描软件获得的结果是非常重要的。通过分析和执行报告，你可以向系统管理员或人员完美地展示你的结果。许多渗透人员忽略了报告的重要性。但应该记住，一份良好的报告可以让问题或漏洞尽快得到修复。具体步骤如下：


    1. 打开 Nessus 软件程序的扫描结果界面。

    2. 界面显示所有目标主机的扫描结果。


    例如，要获取主机 `192.168.343.129` 的漏洞扫描结果分析，点击打开窗口中的目标主机地址 `192.168.343.129` 以显示所有识别出的漏洞。


    3. 从界面中，你可以找到主机检测到的漏洞数量。漏洞列表通常包含 4 列：`Sev`（严重级别）、`Name`（插件名称）、`Family`（插件族）和 `Count`（漏洞数量）。界面右侧的
    `Host Details` 显示目标主机的基本信息，包括 IP 地址、MAC 地址、操作系统类型和扫描时间。如果你想查看漏洞的详细信息，点击相应的插件名称查看漏洞的详细信息。


    例如，查看 `Bind Shell Backdoor Detection` 漏洞的详细信息时，将显示界面。（4）此界面显示了 `Bind Shell Backdoor
    Detection` 漏洞的描述信息、解决方案、输出信息开放端口。右侧的 `Plugin Details` 显示了漏洞的级别、`ID`、`version`、`type`
    和 `plug-in family`，还显示了相关的风险信息。通过对漏洞的分析，已知该漏洞允许用户远程连接端口并直接执行 `id` 命令。其中，提供的解决方案是确定目标主机是否启用了远程登录，或者重新安装系统。


    ## 2. 生成扫描报告


    为了方便用户分析其他漏洞，可以将扫描结果导出为报告文件。此外，用户还可以将扫描报告导入其他工具（如 `Metasploit`）进行使用。下方介绍生成扫描报告的方法。用例：将扫描结果导出为
    `Nessus` 格式的报告。具体步骤如下：


    1. 点击扫描结果界面菜单栏中的 `Export` 下拉菜单，将显示所有格式。

    2. 下拉菜单显示所有生成漏洞报告的格式。点击 `Nessus` 命令，将弹出保存报告文件的对话框。

    3. 在对话框中选择 `Save File` 单选按钮，然后点击 `OK` 按钮生成报告文件。


