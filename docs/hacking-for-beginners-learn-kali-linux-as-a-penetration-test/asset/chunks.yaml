    In `Kali Linux`, the `Nessus` tool is not installed as a default software. Therefore,
    if you want to use this tool to perform vulnerability scanning, you need to install
    it first. Moreover, it is a premium software. So, when the user successfully installs
    the `Nessus` tool, the service must be activated using the license before it can
    be used.


    ### Install Nessus Service:

    To install `Nessus` service in `Kali Linux` you need to follow specific steps
    as follows:


