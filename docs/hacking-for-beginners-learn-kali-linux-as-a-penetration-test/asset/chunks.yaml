- fmt: "\n# What Next?\n\nIn this chapter we have discussed about various use cases\
    \ of `Nessus` in detail. As we all know that one tool is not enough to scan automatically.\
    \ It is always suggested to use two tools to scan vulnerabilities as some hosts\
    \ may blacklist famous vulnerability tools. In real life scenarios you may sometimes\
    \ need to create your own exploits to attack the target. But for now, we will\
    \ help you to further enhance your scanning purposes using another tool named\
    \ as `OpenVAS`. Follow along!\n\n# Chapter 20: Introducing OpenVAS\n\nOpenVAS\
    \ is an open vulnerability assessment system. It can also be said that it is a\
    \ network scanner containing related tools. Its core component is a server, including\
    \ a set of network vulnerability testing programs, which can detect security issues\
    \ in remote systems and applications. This section will introduce the use of OpenVAS\
    \ to implement vulnerability scanning.\n\n## Install and initialise OpenVAS service\n\
    \nIn `Kali Linux 2019`, the `OpenVAS` service is not installed by default. Therefore,\
    \ if you want to use the `OpenVAS` service to perform vulnerability scanning,\
    \ you need to install the service first. Moreover, when the service is successfully\
    \ installed, the `OpenVAS` library needs to be initialised. The following section\
    \ will introduce the method of installing OpenVAS service and initialising OpenVAS\
    \ library.\n\n### 1) Install OpenVAS service\n\nAs it is not installed by default,\
    \ you need to enter a linux command to start the service so that you can scan\
    \ vulnerabilities with it. \nThe execution command is as follows:\n\n```bash\n\
    root@exampleserver:～# apt-get install openvas -y\n```\n\nAfter executing the above\
    \ command, the dependent environment will be detected and the corresponding software\
    \ package will be downloaded. Then, it will install all the downloaded packages\
    \ automatically within the terminal environment. If no error is reported during\
    \ the installation process, it means the `OpenVAS` service is installed successfully.\
    \ If you face any errors please check their online documentation to clear the\
    \ errors.\n\n### 2) Initialise the OpenVAS library\n\nAfter the user successfully\
    \ installs the `OpenVAS` service, it needs to be initialised. In this process,\
    \ `OpenVAS` will download many files (plugins and vulnerability data) according\
    \ to the latest availability. This process takes a long time, and users need to\
    \ wait patiently. We recommend a high-network connection for this step.\n\nThe\
    \ execution command is as follows:\n\n```bash\nroot@exampleserver:～# openvas-setup\n\
    ```\n\nFrom the above output information, you can see that a large number of files\
    \ have been downloaded and all libraries have been updated. Moreover, at the end,\
    \ `OpenVAS`-related services were started sequentially, and the default account\
    \ and password were automatically generated. Please note down the account name\
    \ and password to use it while trying to initialise it using the command line\
    \ interface. The password is usually encrypted.\n\n**Reminder:** In `Kali Linux\
    \ 2019`, when all `OpenVAS` services are successfully started, the browser will\
    \ be automatically launched and the login interface of `OpenVAS` will be available\
    \ for access.\n\n### 3) Initialise the password\n\nWhen the user initialises the\
    \ `OpenVAS` service, a long string of password is generated by default. This password\
    \ is neither easy to enter nor easy to remember, and obviously does not conform\
    \ to the users usual habit of using common and general passwords. So, for your\
    \ convenience you can use the below command to quickly change the password.\n\n\
    The execution command is as follows:\n\n```bash\nroot@exampleserver:～# openvasmd\
    \ --user=admin --new-password=\"this-is-my-new-password\"\n```\n\nAfter executing\
    \ the above command, no information will be shown as output. However, that doesn’t\
    \ mean that the password has not changed. Please run the setup command again to\
    \ check whether the password has changed or not.\n\n**Note:** If you run the `openvas-setup`\
    \ command again, the synchronisation time will be very fast and can increase it’s\
    \ speed significantly.\n\n### 4) Check the integrity of the installation\n\nIn\
    \ some cases, the use of `apt-get` installation will always cause errors of one\
    \ kind or another. At this point, the user can use the `openvas-check-setup` command\
    \ to troubleshoot the error. This command will not only point out the location\
    \ of the error, but also prompt the solution.\n\nThe execution command is as follows:\n\
    \n```bash\nroot@exampleserver:～# openvas-check-setup\n```\n\nFrom the above command,\
    \ you need to understand that the software will be checked in 9 steps. After the\
    \ check is completed, if you see the “success prompt” message then it means that\
    \ the `OpenVAS` installation is successful.\n\n### 5) Check the OpenVAS service\
    \ status\n\nWhen the `OpenVAS` service is initialised, you can access the service.\
    \ In order to make sure that there is no problem in accessing the `OpenVAS` service,\
    \ check its status here. The user can use the `netstat` command to view the monitored\
    \ port and determine whether the `OpenVAS` service is started successfully as\
    \ follows.\n\n```bash\nroot@exampleserver:～# netstat\n```\n\nThis command shows\
    \ that the `OpenVAS` service has been started. If you do not see the above monitoring\
    \ program showing results that are related to `OpenVAS`, it means that the service\
    \ is not started.\n\n### 6) Set up external access\n\nBy checking the monitoring\
    \ status of the `OpenVAS` service, we can see that the default monitoring address\
    \ of the service is `127.0.0.1`, which means that only local host access is allowed.\
    \ For ease of use, users need to manually configure external access. Here you\
    \ will need to modify the listening IP in the 3 configuration files from `127.0.0.1`\
    \ to `0.0.0.0` (representing any IP). Then, restart the `OpenVAS` service.\n\n\
    The specific steps for this is like below:\n\n1. Modify the `greenbone-security-assistant.service`\
    \ configuration file. In this configuration file, there are two places that need\
    \ to be modified. The first is to modify the listening address of `--listen` and\
    \ `--mlisten`. The second is to increase the host address of the host header.\n\
    \   Here, first set the listening address to any IP (`0.0.0.0`) as follows:\n\
    \   ```bash\n   root@exampleserver:～# vi /usr/lib/systemd/system/greenbone-security-assistant\n\
    \   ```\n2. Increase the host address of the host header. If the host address\
    \ of the host header is not increased, the following error message will appear\
    \ for external access: `The request contained an unknown or invalid Host header`.\
    \ If you are trying to access `GSA` via its hostname or a proxy, make sure `GSA`\
    \ is set up to allow it. Add `--allow-header-host=IP address or domain name` after\
    \ `--mlisten=0.0.0.0`. Among them, the IP address of this machine is `192.168.1.32`,\
    \ that is, the IP address for external access is `192.168.1.32`, as follows:\n\
    \   ```bash\n   ExecStart=/usr/sbin/gsad --foreground --listen=0.0.0.0 --port=9392\
    \ --mlisten=0.0.0.0 --allow-header-host=192.168.1.32 --port=9392\n   ```\n3. Modify\
    \ the listening address in the `openvas-manager` configuration file as follows:\n\
    \   ```bash\n   root@exampleserver:～# vi /etc/default/openvas-manager\n   MANAGER_ADDRESS=0.0.0.0\n\
    \   ```\n4. Modify the monitored address in the `greenbone-security-assistant`\
    \ configuration file. There are two places in this file that need to be modified,\
    \ namely `GSA_ADDRESS` and `MANAGER_ADDRESS`, as follows:\n   ```bash\n   root@exampleserver:～#\
    \ vi /etc/default/greenbone-security-assistant\n   GSA_ADDRESS=0.0.0.0\n   ```\n\
    5. Restart the `OpenVAS` service. The execution command is as follows:\n   ```bash\n\
    \   root@exampleserver:～# openvas-stop\n   root@exampleserver:～# openvas-start\n\
    \   ```\n   After executing the above command, the `OpenVAS` service restarts\
    \ successfully. At this point, check the monitoring status again:\n   ```bash\n\
    \   root@exampleserver:～# netstat -an\n   ```\n   If you can see from the output\
    \ the address monitored by the `gsad` program is `0.0.0.0`. At this point, the\
    \ external host can access the `OpenVAS` service.\n\n# Chapter 21: Configuring\
    \ OpenVAS\n\nAfter passing the previous series of configurations, the user can\
    \ log in to the `OpenVAS` service. After the user successfully logs in to the\
    \ `OpenVAS` service, some simple configurations are required to perform vulnerability\
    \ scanning, such as creating a new scanning configuration, scanning target, and\
    \ scanning task. The following section will introduce how to log in and configure\
    \ `OpenVAS` service.\n\n## Log in to OpenVAS service\n\nTo login into the `OpenVAS`\
    \ service follow the below steps carefully. Always remember to follow the troubleshooting\
    \ guide in the official website if you face any errors.\n\n1. Enter the address\
    \ in the browser, `https://exampleserver:9392/` (IP address is the address of\
    \ the `OpenVAS` service).\n2. This interface shows that the links visited in the\
    \ browser are not trusted. This is because the link uses the `HTTPS` protocol,\
    \ and it must be safe and reliable to access. Click the `Advanced` button and\
    \ the risk content you are susceptible to will be displayed.\n3. This interface\
    \ shows the risks of accessing the link. If you confirm that there is no problem\
    \ with the accessed link, click the `Add Exception` button, and a dialog box for\
    \ adding a safe list will be displayed.\n4. The link information to add exceptions\
    \ is displayed in this dialog box. At this point, click the `Confirm Security\
    \ Exception` button, and the login dialog box of the `OpenVAS` service will be\
    \ displayed.\n5. Enter the username and password in the dialog box to log in to\
    \ the service. The username here is `admin` user automatically created when `OpenVAS`\
    \ was configured earlier, and the password is `this-is-new`. After entering the\
    \ username and password, click the `Login` button so that the main interface of\
    \ `OpenVAS` will be displayed.\n6. If you see the content displayed on this interface,\
    \ it means you have successfully logged in to the `OpenVAS` service.\n\n**Note:**\
    \ After restarting the system, if you want to use the `OpenVAS` tool, you need\
    \ to restart the service. Otherwise, you cannot log in to the server. If an error\
    \ occurs when starting the service, use the `openvas-setup` command to resynchronise\
    \ the database. After the command is inserted all the related services will be\
    \ started automatically.\n\n## New scan configuration\n\nThe scan configuration\
    \ is used to specify the plugins that are required to scan the target. When scanning\
    \ with the `OpenVAS` tool, a scanning task is required to achieve. However, the\
    \ scan task is composed of a scan configuration and a target. Therefore, before\
    \ implementing a scan, you must first create a scan configuration and scan target.\n\
    \nThe `OpenVAS` service provides 8 scan configuration templates by default, which\
    \ users can use directly. If the provided configuration template does not meet\
    \ the needs of the user, the user can create it by himself and specify a specific\
    \ plug-in family.\n\n1. In the menu bar, select the `Configuration|Scan Configs`\
    \ command in turn to open the scan configuration interface.\n2. It can be seen\
    \ from this interface that 8 scan configurations are provided by default. Click\
    \ the `New Scan Config` button in this interface to open the `New Scan Config`\
    \ dialog box.\n3. Set the name of the scan in this dialog box. Here it is set\
    \ to `initial`. Select the `Empty`, `static` and `fast` radio button in the `Base`\
    \ option to allow users to start from scratch and create their own configuration\
    \ interface. Then, click the `Create` button.\n4. From the `Family` column of\
    \ this interface, you can see the supported vulnerability plug-in families. If\
    \ you want to select a certain type of plug-in, just select the checkbox in the\
    \ `NVTs` column. If the user wants to specify a plug-in family, he can click the\
    \ `(Edit Configuration Plug-in Family)` button in the `Actions` column.\n5. If\
    \ you don’t want to use a certain plugin, just uncheck the checkbox in the `Selected`\
    \ column. After setting, click the `Save` button and the interface will be displayed.\n\
    6. It can be seen from this interface that the scan configuration `initial` has\
    \ been successfully created, 59 plugin families have been selected out of a total\
    \ of 62 plugins.\n\n## New scan target\n\nAfter creating a scan configuration,\
    \ you need to create target. Scan target is used to specify the address, port\
    \ and scan method of the target.\n\n1. In the menu bar, select the `Configuration|Targets`\
    \ command in turn to open the target interface. own2. It can be seen that no targets\
    \ are created by default. Click the `New Target` button in this interface to open\
    \ the `New Target` dialog box.\n3. Set the name of the target in this dialog box.\
    \ Here it is set to `initial`. Select the `Host`, `Range` or `File` radio button\
    \ in the `Base` option to allow users to start from scratch and create their own\
    \ configuration interface. Then, click the `Create` button. own4. From the `Services`\
    \ column of this interface, you can see the supported target services. If you\
    \ want to select a certain type of service, just select the checkbox in the `Services`\
    \ column. If the user wants to specify a target service, he can click the `(Edit\
    \ Target Service)` button in the `Actions` column.\n5. If the don’t want to use\
    \ a certain service, just uncheck the checkbox in the `Selected` column. After\
    \ setting, click the `Save` button and the interface will be displayed.\n6. It\
    \ can be seen from this interface that the target `initial` has been successfully\
    \ created, 49 services have been selected.\n\n## New scan task\n\nAfter creating\
    \ a scan target, you need to create scan task. Scan task is used to specify the\
    \ scan configuration and target.\n\n1. In the menu bar, select the `Scans|Tasks`\
    \ command in turn to open the task interface.\n2. It can be seen from this interface\
    \ that no tasks are created by default. Click the `New Task` button in this interface\
    \ to open the `New Task` dialog box.\n3. Set the name of the task in this dialog\
    \ box. Here it is set to `initial`. Select the scan configuration and target from\
    \ the dropdown menus. Then, click the `Create` button.\n4. After creating the\
    \ task, the interface is displayed.\n5. From the `Policy` column of this interface,\
    \ you can see the supported scan policies. If you want to select a certain type\
    \ of policy, just select the checkbox in the `Policy` column. If the user wants\
    \ to specify a task policy, he can click the `(Edit Task Policy)` button in the\
    \ `Actions` column.\n6. If the don’t want to use a certain policy, just uncheck\
    \ the checkbox in the `Selected` column. After setting, click the `Save` button\
    \ and the interface will be displayed.\n7. It can be seen from this interface\
    \ that the task `initial` has been successfully created.\n\n## Scanning for vulnerabilities\n\
    \nThrough the previous basic configuration, the `OpenVAS` service is configured.\
    \ Next, you can start the vulnerability scan. The following will take the previously\
    \ created task as an example to implement vulnerability scanning.\n\n1. Open the\
    \ task interface.\n2. Click the `Start` button in the `Actions` tab to start vulnerability\
    \ scanning.\n3. From the `Status` column in this interface, you can see that 66%\
    \ has been scanned. If users want to stop scanning, they can click the `Stop`\
    \ button in the `Actions` column. After the scan is completed, the status changes\
    \ from `New` to `Done`.\n4. From the `Status` column in this interface, you can\
    \ see that the status has been displayed as `Done`, indicating that the scan is\
    \ complete. Next, you can analyse the scan results to obtain vulnerability information\
    \ in the target host.\n\n**Reminder:** Normally, after users start scanning, they\
    \ will find that the scanning speed is very slow and the status bar hardly changes.\
    \ In fact, the target is being scanned all the time. Since this is the content\
    \ displayed in the browser, the user needs to refresh the page manually to see\
    \ the status change. Users can also set it to refresh automatically every few\
    \ minutes. The default setting of `OpenVAS` is not to refresh automatically, and\
    \ modify it to refresh automatically below. `OpenVAS` provides 4 automatic refresh\
    \ times by default. The user clicks the drop-down button in the figure, and the\
    \ settable auto refresh time drop-down menu will be expanded. The user can choose\
    \ any method, so that you can see the scan status changes at any time.\n\n## Analyze\
    \ and export vulnerability scan reports\n\nAfter the user scans the target host,\
    \ the vulnerability information of the target host can be obtained from the scan\
    \ results. Similarly, in order to facilitate users to analyse their scan results,\
    \ OpenVAS also supports exporting vulnerability information in different report\
    \ formats. The method to analyse and export the vulnerability scan report will\
    \ be introduced below.\n\n### Analyse the vulnerability scan results\n\nIt is\
    \ important to analyse and report the vulnerabilities for the system administrators.\
    \ By using effective documentation there is a huge chance that the loophole will\
    \ be soon cleared by the development team.\n\n1. Open the scan result interface.\n\
    2. From the `Severity` column, we can see that there are very serious vulnerabilities\
    \ in the target host, and the security level is `10.0` (High). Click the button\
    \ in the `Status` column, and the vulnerability scan result information will be\
    \ displayed.\n3. From this interface, you can see the result information of all\
    \ the vulnerabilities scanned, including the name of the vulnerability (`Vulnerability`),\
    \ the level (`Severity`), the address of the host with the vulnerability (`Host`)\
    \ and the corresponding port (`Location`). Among them, `10.0` is the most serious\
    \ vulnerability. The `OpenVAS` service supports filtering the scan results in\
    \ different ways. Users can expand other filtering methods for displaying results\
    \ by clicking the drop-down button in front of `Report`. own4. From the drop-down\
    \ menu displayed in this interface, you can see all filtering methods. Among them\
    \ include `Summary`, `Results`, `Vulnerabilities`, `Hosts`, `Ports`, `Applications`,\
    \ `Operating Systems`, `CVEs`, `Closed CVEs`, `SSL Certificates`, and `Error Messages`.\
    \ If the user only wants to view all vulnerabilities, click `Report:Vulnerabilities`\
    \ option to display all vulnerability information, as shown in Figure 6.\n5. This\
    \ interface shows all vulnerabilities in the target host. For example, `SQL Server\
    \ End Of Life`. From the displayed results, we can see that the version of `SQL\
    \ Server` stopped on `April 2016`. Among them, `9.0` is the version. Therefore,\
    \ in order to be more secure, it is recommended that users update the current\
    \ version.\n\n### Export vulnerability report\n\nIn order to facilitate user analysis,\
    \ users can export vulnerability information in the form of reports. `OpenVAS`\
    \ supports reports in file formats, such as `PDF`, `XML`, `HTML`, and `TXT`. The\
    \ following will scan the results in `XML` format.\n\n1. Open the scan list interface.\n\
    2. From this interface, you can see that there is a download button to download\
    \ the report. The `XML` format is selected by default. If users want to export\
    \ in other formats, click the drop-down button to select the desired format. Then,\
    \ click the `Download` button to download the report.\n\n# Chapter 22: Understanding\
    \ Sniffing\n\nSniffing is an important skill that needs to be understood by hackers\
    \ and network administrators. In a network when packets can be accessed by anyone\
    \ there is a lot of chance for stealing sensitive information if they are not\
    \ encrypted. These attacks are casually called by hackers as `Man-in-middle attacks`.\
    \ When considered casually as low risk by tech, it is still a major reason for\
    \ hackers to easily obtain passwords and credit card information from public spaces\
    \ and hotspots. In this chapter, we will help you understand the procedure of\
    \ Sniffing in detail with excellent instructions.\n\n## Man-in-middle attack\n\
    \nMan-in-the-Middle Attack, referred to as `MITM attack`, is an \"indirect\" intrusion\
    \ attack. This attack mode is to virtually place a computer controlled by an intruder\
    \ between two communicating computers in the network connection through various\
    \ technical means. This computer is often referred to as \"man in the middle\"\
    .\n\n## Working principle\n\nMan-in-the-middle attacks have long been a common\
    \ attack method used by hackers, and they have been spread to this day. Among\
    \ them, the most typical man-in-middle attack methods are `ARP spoofing` and `DNS\
    \ spoofing`. To put it simply, a man-in-middle attack is to intercept normal network\
    \ communication data and perform data tampering and sniffing, while the communicating\
    \ parties are unaware. Here we will take `ARP spoofing` technology as an example\
    \ to introduce the working principle of man-in-themiddle attacks. In general,\
    \ `ARP spoofing` is not to make the network unable to communicate normally, but\
    \ to pretend to be a gateway or other host so that the data flow to the gateway\
    \ or host is forwarded through the attacking host. By forwarding the traffic,\
    \ you can control and view the traffic, thereby obtaining traffic or obtaining\
    \ confidential information.\n\n### How does it work?\n\nWhen communicating between\
    \ host A and host B, if host A does not find the MAC address of host B in its\
    \ ARP cache table, host A will send an `ARP` broadcast to all computers in the\
    \ entire LAN. The computer will receive the data. At this time, host C responds\
    \ to host A, saying \"I am host B and my MAC address is `XX-XX-XX-XX-XX-XX`\"\
    . Host A will update its cache table after receiving the address. When host A\
    \ communicates with host B again, the data will be sent to the attacking host\
    \ (host C), and host C will forward it to host B after receiving it.\n\n## Implementing\
    \ a man-in-themiddle attack\n\nOnce the user has a clear understanding of the\
    \ principle of a man-in-middle attack, he can implement a man-in-middle attack.\
    \ The following section will introduce the use of `arpspoof` and `Ettercap` to\
    \ implement man-in-middle attacks.\n\n### 1) Use arpspoof tool\n\n`arpspoof` is\
    \ a professional `ARP spoofing` tool that can directly spoof the gateway, making\
    \ all computers accessing the network through the gateway be spoofed. Through\
    \ `ARP spoofing`, the purpose of man-in-middle sniffing and capturing data packets\
    \ can be achieved, and the data in transmission can be replaced. The following\
    \ section will introduce the method of using the `arpspoof` tool to implement\
    \ ARP attacks.\n\nThe syntax format of the `arpspoof` tool is as follows:\n\n\
    ```bash\narpspoof [options] host\n```\n\nThe options and meanings supported by\
    \ the tool are as follows:\n- `-i interface`: Specify the interface used.\n- `-t\
    \ target`: Specify the target of ARP spoofing. If not specified, all hosts in\
    \ the LAN will be deceived.\n- `-r`: Implement two-way deception. This option\
    \ needs to be used with the `-t` option to be effective.\n- `Host`: Specify the\
    \ host you want to intercept, usually the local gateway.\n\nThe specific steps\
    \ to attack using `arpspoof` tool are as follows:\n\n1. Turn on routing and forwarding.\
    \ execution command is as follows:\n```bash\nroot@exampleserver:～# echo 1> /proc/sys/ipv4/ip_forward\n\
    ```\nSeeing the above output, it means that routing and forwarding has been turned\
    \ on. If the user does not enable routing and forwarding, the target host cannot\
    \ access the network.\n\n2. View the IP address and ARP cache table of the attacking\
    \ host. First check the IP address as follows:\n```bash\nroot@exampleserver:～#\
    \ ifconfig\n```\nFrom the output information, you can see that the IP address\
    \ of attacking host is `192.168.29.134`, and the MAC address is `00:0c:29:79:95:e`.\
    \ Next, check its ARP cache table:\n```bash\nroot@exampleserver:～# arp\n```\n\
    From the output information, you can see there is only one gateway record in the\
    \ attacking host. Moreover, the MAC address of the gateway is `00:50:f1:40:cb`.\n\
    \n3. Check the IP address and ARP cache table of the target host. First check\
    \ the IP address as follows:\n```bash\nroot@exampleserver:～# ifconfig\n```\nFrom\
    \ the output information, you can see that the IP address of target host is `192.168.29.135`,\
    \ and the MAC address is `00:0c:29:6c:5d:69`. Next, check the ARP cache table:\n\
    ```bash\nroot@exampleserver:～# arp\n```\nAs you can see from the output, there\
    \ is also one ARP entry bound to the gateway. By looking at the address information,\
    \ you can determine that the attacking host has not communicated with the target\
    \ host. At this time, as long as the two hosts communicate, they will request\
    \ each other's IP and MAC addresses. At this time, `ARP` attacks can be implemented\
    \ on it.\n\n4. Implement ARP attacks on the target host. execution command is\
    \ as follows:\n```bash\nroot@exampleserver:～# arpspoof -i eth0 -t\n```\nIt can\
    \ see from the output information that the attacking host is sending an ARP response\
    \ packet to the target host, telling the target host that the MAC address of the\
    \ gateway is `00:c:29:79:95:e` (the attacking host's MAC address). However, the\
    \ actual MAC address of the gateway is `00:50:f1:40:cb`. This shows that ARP spoofing\
    \ has begun on the target host.\n\n5. Implement ARP attacks on the gateway. execution\
    \ command is as follows:\n```bash\nroot@exampleserver:～# arpspoof -i eth0 -t 192.168.29.135\
    \ -r\n```\nFrom the output information, we can see that the attacking host sent\
    \ ARP response packets to the target host and the gateway, telling the gateway\
    \ and the target host that their MAC addresses are `00:c:29:79:95:e`.\n\n**Reminder:**\
    \ Users can also perform ARP attacks on the target host and gateway at the same\
    \ time with one command. execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ arpspoof -i eth0 -t 192.168.29.135 -r\n```\n\n6. Check the ARP cache table of\
    \ the target host as follows:\n```bash\nroot@exampleserver:～# arp\n```\nFrom the\
    \ output information, you can see the two ARP records in the host (the ARP entries\
    \ of the gateway and the attacking host). From the displayed ARP entry, you can\
    \ see that the MAC address of the gateway and the attacking host are the same.\
    \ This shows that the target host was successfully spoofed by ARP.\n\n2. Use Ettercap\
    \ tool\n\nEttercap is a network sniffing tool based on ARP address spoofing, mainly\
    \ suitable for switching local area networks. The following section will introduce\
    \ the method of using the `Ettercap` tool to implement a man-in-middle attack.\n\
    \n1. Start the Ettercap tool. execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ ettercap -G\n```\nAfter executing the above command, the interface will be displayed.\n\
    2. This is the initial interface of the `Ettercap` tool. Next, the man-in-middle\
    \ attack is implemented by capturing packets. Select `Sniff|Unified sniffing`\
    \ command in the menu bar or press the `Ctrl+U` shortcut key. At this time, `Ctrl+U`\
    \ will display the dialog box.\n3. Select the network interface in this dialog\
    \ box. Here select `eth0`, and then click the \"OK\" button, the interface shown\
    \ will be displayed.\n4. After starting the interface, you can scan all the hosts.\
    \ In the menu bar, select `Hosts|Scan for hosts` command or press the `Ctrl+S`\
    \ shortcut key. At this time, the interface shown will be displayed.\n5. From\
    \ the information output on this interface, you can see that total of 5 hosts\
    \ have been scanned. If you want to view the scanned host information, select\
    \ `Hosts|list` command in the menu bar or press `Ctrl+H` shortcut key. At this\
    \ time, the interface shown will be displayed.\n6. This interface displays IP\
    \ addresses and MAC addresses of 5 hosts scanned. In this interface, select one\
    \ of the hosts as the target system. Here select `192.168.29.2` and click `Add\
    \ to Target` button, then you can start sniffing packets. In the menu bar, select\
    \ `Start|Start sniffing` command or press `Shift+W` shortcut key.\n7. After the\
    \ sniffing is started, the important information of the target system is obtained\
    \ using the ARP injection attack method. To start the ARP attack, select `Mitm|ARP\
    \ poisoning...` in the menu bar. At this time, the dialog box will be displayed.\n\
    8. Select the attack option in the dialog box, here select `Sniff connections`.\
    \ Then click the \"OK\" button, the interface shown will be displayed.\n9. At\
    \ this point, the man-in-middle attack is successfully implemented. All HTTP data\
    \ accessed by the target user will be monitored by the attacking host.\n10. We\
    \ can see from this interface that the user has logged in to the management interface.\
    \ Among them the login name is `user` and the password is `exampleserver`. When\
    \ the user stops sniffing after obtaining the information, select `Start|Stop\
    \ sniffing` command in the menu bar.\n11. After you stop sniffing, you need to\
    \ stop man-in-middle attacks. Select `Mitm|Stop mitm attack(s)` command in the\
    \ menu bar, and the dialog box will be displayed.\n12. Click the \"OK\" button\
    \ in the dialog box, so the man-in-middle attack has successfully completed. `Ettercap`\
    \ provides two modes, one is graphical interface, and the other is command line\
    \ mode. Users who like to use commands can also implement man-in-middle attacks\
    \ through command mode. The syntax format is as follows:\n```bash\nettercap [Options][Objective\
    \ 1] [Objective 2]\n```\nUse `Ettercap`'s line mode to implement a man-in-middle\
    \ attack on the target host `192.168.29.136`. The execution command is as follows:\n\
    ```bash\nroot@exampleserver:～# ettercap -q -M arp:remote /192.168.29.136//192.168.29.2\n\
    ```\nSeeing the similar output above indicates the man-in-middle attack has been\
    \ successfully launched. When the attacking host sniffs the packet, it will output\
    \ it.\n\n# Chapter 23: Social Engineering Attacks\n\nSocial engineering attacks\
    \ mainly use people's curiosity, trust, greed and some stupid mistakes to attack\
    \ people's own weaknesses. Kali Linux provides a social engineering tool `SET`,\
    \ which can be used to implement social engineering attacks. This section will\
    \ introduce methods for implementing social engineering attacks.\n\n## Start the\
    \ social engineering toolkit-SET\n\nSET is an open source, Python-driven social\
    \ engineering penetration testing tool. Using this toolkit, you can implement\
    \ Web attacks and PowerShell attacks. The following section describes how to start\
    \ the social engineering toolkit.\n\n1. Start SET. Execute the following commands\
    \ in the terminal:\n```bash\nroot@exampleserver:～# setoolkit\n```\nAfter executing\
    \ the above command, the following information will be output:\n```\nDo you agree\
    \ to the terms of service [y/n]:\n```\nThe output information describes `SET`\
    \ in detail. This information will only be displayed during the first run. After\
    \ the interface accepts this part of the information, other operations can be\
    \ performed. Enter `y` at this time, and the following information will be displayed:\n\
    ```\n#SET MENU\n```\n2. The above shows the creator of the social engineering\
    \ toolkit, the version is `7.7.9`, the code name is `Blackout`, and the menu information.\
    \ At this time, you can select the corresponding number to operate according to\
    \ your needs. For example, choose a social engineering attack. Enter the number\
    \ `1`, and a list of social engineering attacks that can be implemented is displayed\
    \ as follows:\n```\nset> 1\n```\nSelect from the menu:\n1) Spear-Phishing Attack\
    \ Vectors\n2) Website Attack Vectors\nThe above information shows the menu options\
    \ for social engineering attacks. At this point, the user can select the type\
    \ of engineering attack and then implement the attack.\n\n## Web Attack Vector\n\
    \nWeb attack vectors will deliberately construct web pages that are credible and\
    \ attractive to the target. When the target user visits the webpage, the target\
    \ user's information can be stolen. The social engineering attack toolkit can\
    \ clone a web page that looks exactly the same as the actual running trusted site,\
    \ which makes the victim think they are browsing a legitimate site. The following\
    \ section will introduce the method of using social engineering to implement Web\
    \ attack vectors.\n\n### Use SET to implement Web attack vectors\n\n1. Start the\
    \ social engineering toolkit and select social engineering attacks. The execution\
    \ command is as follows:\n```bash\nroot@exampleserver:～# setoolkit\n```\nSelect\
    \ from the menu:\n1) Spear-Phishing Attack Vectors\n2) Website Attack Vectors\n\
    ```\nset> 1\n```\nThe above information shows the menu options for attacking social\
    \ engineering. At this point, the user can select the type of engineering attack\
    \ and then implement the attack.\n\n2. Select the web attack vector, so input\
    \ the number `2`:\n```\nset> 2\n```\nThe Web Attack module is a unique way of\
    \ utilizing multiple web-based attacks through the browser.\n\n### Java Applet\
    \ Attack\n\n1. From the menu bar, select `Exploitation|Java Applet Attack`. The\
    \ above menu shows the web attack methods that can be implemented.\n\n### Metasploit\
    \ Browser Exploit\n\n1. From the menu bar, select `Exploitation|Metasploit Browser\
    \ Exploit`. The above menu describes the role of various methods.\n\n### Custom\
    \ Import\n\n1. Select the certificate to obtain the attack method, so enter the\
    \ number `3`:\n```\nset:webattack> 3\n```\nThe first method allows `SET` to import\
    \ a list of pre-defined web applications that can utilize within the attack. The\
    \ second method allows to completely clone a website of your choosing and allow\
    \ you to utilize the attack vectors within. The third method allows you to import\
    \ your own website, note that it should only have `index.html` when using the\
    \ import website functionality.\n\n### Web Templates\n\n1. Web Templates\n2. Site\
    \ Cloner\n3. Custom Import\n```\n4. Return to Webattack Menu\n\nThe above information\
    \ shows how to create a Web site. Users can choose different methods according\
    \ to their needs. For convenience, use the Web template provided by `SET`. Therefore,\
    \ enter the number `1`, and the following information will be displayed:\n```\n\
    set:webattack> 1\n```\n[192.168.29.139]: 192.168.29\nAt this point, specify the\
    \ IP address to obtain the information submitted by the target user, is the address\
    \ of attacking host. After entering the above address, the following information\
    \ will be displayed:\n```\n1. Java Required\n2. Google\n3. Twitter\n```\nset:webattack>\
    \ Select a template:\n```\n2\n```\nThe above information shows several templates\
    \ provided by `SET` by default, including `Java Required`, `Google` and `Twitter`.\
    \ The Google site template is selected here, so enter the number `2`:\n\n### Use\
    \ Ettercap to launch an ARP attack\n\n1. Start the `dns_spoof` plugin to implement\
    \ DNS spoofing. The execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ ettercap -q -M arp:remote -P dns_spoof /192.168.29.139//192.168.29.2\n```\n\
    Seeing the output above indicates that DNS spoofing has been successfully implemented.\
    \ When the target host visits any web page, it will be tricked into a pseudo page\
    \ created by the attacking host (`192.168.29.139`), that is the cloned site.\n\
    2. Assuming the target user will visit Google. Click `http://www.google.com`,\
    \ the page shown will be displayed.\n3. It can be seen that the page accessed\
    \ is to log in the Google server, but the URL requested in the address bar is\
    \ still `http://www.google.com/`. At this time, when the user enters the login\
    \ information to log in to the Google server, the login information will be captured\
    \ by the attacking host, and the captured information will be displayed on the\
    \ terminal. as follows:\n```\n192.168.29.135--[18/Apr/2019 15:18:51,945 POST Data\
    \ (password:126.com):\nserver response: HTTP/1.1 200 OK\n```\nFrom the above output,\
    \ you can see that the target host has visited the mail. Generated files are saved\
    \ in `/root/.set/` by default. At this point, press Enter to continue Operation\
    \ will return to the SET menu interface.\n\n### PowerShell attack vector\n\nThe\
    \ PowerShell attack vector can create a PowerShell file. When the user sends the\
    \ created PowerShell file to the target, and the target user executes the file,\
    \ a reverse remote connection is obtained. This section will introduce methods\
    \ to implement PowerShell attack vectors.\n\n1. Launch a social engineering attack.\
    \ execution command is as follows:\n```bash\nroot@exampleserver:～# setoolkit\n\
    ```\n2. Select social engineering attack and enter the number `1`. execution command\
    \ is as follows:\n```\nset> 1\n```\n3. Select the PowerShell attack vector and\
    \ enter the number `9`. The following information will be displayed:\n```\nset>\
    \ 9\n```\n4. The above output shows the configuration information of the attacking\
    \ host. At this point, the attack payload has been successfully launched, waiting\
    \ for the target host to connect. After the above settings are completed, a penetration\
    \ attack code file will be created in the `/root/.set/reports/powershell/` directory.\
    \ The file is a text file and its name is `x86_powershell_injection.txt`.\n5.\
    \ At this time, open a terminal window to view the content of the infiltration\
    \ attack file, as follows:\n```bash\nroot@exampleserver:～# cd /root/.set/reports/powershell/\n\
    ```\nThe above information is the content in the `x86_powershell_injection.txt`\
    \ file. As can be seen from the first line, the file is to run the powershell\
    \ command. If the target host runs this code, it will open a remote session with\
    \ the Kali host.\n6. At this time, you can copy the content in the `x86_powershell_injection.txt`\
    \ file to the DOS of the target host (Windows 7) and run the script content. Or,\
    \ copy the file directly to the target host and change the file extension to `.bat`.\
    \ Then, double-click the file to run the script. After the execution is successful,\
    \ the Kali host will display the following information:\n```\nmsf5 exploit(multi/handler)>\
    \ sessions -i 1\n```\nAs you can see in the above code, the command line prompt\
    \ is displayed as `meterpreter>`, indicating that the Meterpreter session has\
    \ successfully started. Next, users can use the commands supported in `Meterpreter`\
    \ to obtain more information about the target.\n\n# Chapter 24: Capture and monitor\
    \ network data\n\nAfter the user successfully implements the man-in-middle attack,\
    \ the network data of the target host can be captured and monitored. This section\
    \ will introduce how to capture and monitor data, and analyze it.\n\n## Wireshark,\
    \ a general-purpose packet capture tool\n\nWireshark is a tool dedicated to network\
    \ packets, which can be used to capture and analyze data. After the user implements\
    \ the man-in-middle attack, Wireshark can be used to monitor the data packets.\
    \ The following section will introduce how to use Wireshark tool to capture data\
    \ packets.\n\n### Use Wireshark to monitor the data packets\n\n1. Implement the\
    \ man-in-middle attack. execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ ettercap -Tq -M arp:remote /192.168.29.135//192.168.29.2\n```\n2. Start the\
    \ Wireshark tool. In the menu bar, select `Applications|sniffing/spoofing|wireshark`\
    \ command in turn. The interface shown will be displayed.\n3. Select the listening\
    \ interface in this interface. Here select `eth0`, and then click the \"OK\" button,\
    \ the interface shown will be displayed.\n4. At this time, all data packets passing\
    \ through `eth0` are monitored. When enough data packets are captured, click the\
    \ stop capturing button to stop capturing packets.\n5. Save the captured package.\
    \ Select the `File | Save` command in the menu bar, and the interface will be\
    \ displayed.\n6. Specify the capture file name and location in this interface.\
    \ Then, click the `Save` button to successfully save the captured data.\n\n###\
    \ Capture picture\n\n`Driftnet` is a simple and practical image capture tool that\
    \ can easily capture images in network packets. By working with `Ettercap` tool,\
    \ you can capture all pictures browsed by the target host. The following will\
    \ introduce how to use `driftnet` tool to capture pictures of the target host.\n\
    \n1. Implement the man-in-middle attack. execution command is as follows:\n```bash\n\
    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.135//192.168.29.2\n\
    ```\n2. Use `driftnet` to monitor all pictures browsed by the target host, and\
    \ specify to save the monitored pictures to the `/root/image` directory. execution\
    \ command is as follows:\n```bash\nroot@exampleserver:～# driftnet -i eth0 -d /root/image\n\
    ```\nAfter executing the above command, a `driftnet` terminal window will pop\
    \ up.\n3. When the picture browsed by the target host is captured, it is displayed\
    \ in the window. Moreover, the captured image information can also be seen in\
    \ the interactive mode of `driftnet` monitoring. You can see the captured picture\
    \ information from the information displayed above. In the information output\
    \ above, the user can also find some warning messages. This is caused by the fact\
    \ that some image formats are not supported by `driftnet` tools. At this point,\
    \ the user enters the specified picture you can see all the captured images in\
    \ the `/root/image` directory where the film is saved. Users can use the picture\
    \ viewer to view any picture, and the display result is shown.\n4. If the user\
    \ does not want to capture the picture again, press the `Ctrl+C` key combination\
    \ to stop monitoring.\n\n# Chapter 25: Advanced Monitoring of Data\n\n## Monitoring\
    \ HTTP data\n\n`HTTP` (Hyper Text Transfer Protocol) is a transfer protocol used\
    \ for Web servers to transfer hypertext to local browsers. Normally, the `HTTP`\
    \ protocol is used by clients to access web pages. Therefore, users can also monitor\
    \ HTTP data accessed by target users using man-in-middle attacks. Since the `HTTP`\
    \ protocol transmits data in plain text, if a user logs in to an `HTTP` protocol\
    \ website, user information will be monitored. The following will introduce the\
    \ method of using `Ettercap` tool to sniff `HTTP` protocol data.\n\n1. Use the\
    \ `Ettercap` tool to implement a man-in-middle attack on the target. execution\
    \ command is as follows:\n```bash\nroot@exampleserver:～# ettercap -Tq -M arp:remote\
    \ /192.168.29.135//192.168.29.2\n```\nSeeing the above output indicates that the\
    \ `ARP spoofing` attack was successfully implemented on the target.\n2. At this\
    \ time, when the target host accesses the `HTTP` protocol website, it will be\
    \ monitored by the attacking host. For example, log in to the UNIX forum here,\
    \ and when the user enters the login information and logs in, it will be monitored\
    \ by the attacking host as follows:\n```\nHTTP: 42.62.98.167:80->USER: testuser\
    \ PASS: password\n```\nFrom the output information, you can see the login information\
    \ of the target host to access the UNIX forum is monitored. The username is `testuser`\
    \ and the password is `password`.\n\n### Monitoring HTTPS data\n\n`HTTPS` (Hyper\
    \ Text Transfer Protocol over Socket Layer or Hypertext Transfer Protocol Secure)\
    \ is an `HTTP` channel with security. For some secure websites, like `Facebook`\
    \ and bank websites, the `HTTPS` protocol adds an SSL layer under `HTTP`, so is\
    \ encrypted. At this point, the user can use `SSLstrip` tool to decrypt the SSL\
    \ encrypted data and then obtain the `HTTPS` data-content.\n\n1. Turn on routing\
    \ and forwarding. execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ echo 1> /proc/sys/ipv4/ip_forward\n```\n2. Import all HTTP data to port `10000`\
    \ through `iptables`. execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-port\
    \ 10000\n```\n3. Use `SSLstrip` to monitor port `10000` to obtain sensitive information\
    \ transmitted by the target. execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ sslstrip -a -l 10000\n```\nAfter executing the above command, you can see that\
    \ `SSLstrip` tool is running. At this point, a log file named `sslstrip.log` will\
    \ be created in the current directory. By monitoring the log file, you can see\
    \ the data transmitted by the target host. details as follows:\n```bash\nroot@exampleserver:～#\
    \ tail -f sslstrip.log\n```\n**Tip:** When using `SSLstrip` to attack, some warning\
    \ messages may appear. However, this information does not affect `SSLstrip`s capture\
    \ of data.\n4. Implement `ARP spoofing` attacks execution command is as follows:\n\
    ```bash\nroot@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.135//192.168.29.2\n\
    ```\n5. At this time, visit the encrypted website on the target host. If the target\
    \ user submits sensitive information, it will be captured by `SSLstrip`. For example,\
    \ log in to `126` mailbox (`https://mail.126.com`) to verify the success of `SSLstrip`\
    \ attack. When the user successfully accesses `126` mailbox, the interface will\
    \ be displayed.\n6. We can see from this interface that the address bar of the\
    \ browser has been decrypted by `SSLstrip` tool into the `HTTP` protocol (`http://mail.126.com`).\
    \ At this time, the user enters the username and password to log in, and this\
    \ information will be captured by `SSLstrip`. specific display is as follows:\n\
    ```\n2019-04-19 15:18:51,945 POST Data (password:126.com):\nserver response: HTTP/1.1\
    \ 200 OK\n```\nFrom the above output, you can see that the target host has visited\
    \ the `mail.126.com` website. Moreover, you can see the username submitted by\
    \ the user is `testuser@126.com`, and the password is encrypted.\n\n## Quick analysis\
    \ of network data\n\nWhen users use `Wireshark` to capture data packets, they\
    \ can use `Xplico` tools to quickly analyze their data. `Xplico` tool can quickly\
    \ find out the content of the webpage address, picture and video requested by\
    \ the user. The following section will introduce how to use `Xplico` tool to analyze\
    \ network data.\n\n### Install and start Xplico service\n\n`Kali Linux` does not\
    \ install `Xplico` tools by default. Therefore, before using the tool, you need\
    \ to install the tool. execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ apt-get install xplico\n```\nAfter executing the above command, if no error\
    \ is reported, the installation is successful. Next, you need to start the service\
    \ before you can use it. the execution command is as follows:\n```bash\nroot@exampleserver:～#\
    \ service xplico start\n```\nAfter executing the above command, no information\
    \ is output. Because `Xplico` is a web service-based tool. Therefore, the user\
    \ also needs to start the Web service. the execution command is as follows:\n\
    ```bash\nroot@exampleserver:～# service apache2 start\n```\nNow, users can access\
    \ `Xplico` services. The default listening port of the `Xplico` service is `9876`.\
    \ The user can check the listening port to determine whether the `Xplico` service\
    \ is successfully started. details as follows:\n```bash\nroot@exampleserver:～#\
    \ netstat -anptul | grep 9876\ntcp6 0 0 :::9876\n```\nFrom the above output, you\
    \ can see that TCP port `9876` is being monitored. This shows that the `Xplico`\
    \ service started successfully. The specific steps are as follows:\n\n1. Visit\
    \ the `Xplico` server in the browser at `http://IP:9876/`. After the access is\
    \ successful, the login interface of the `Xplico` service will be displayed.\n\
    2. This interface is used to log into `Xplico` services. The default username\
    \ and password of the `Xplico` service are both `xplico`. After entering the username\
    \ and password to successfully log in to `Xplico`, the interface shown will be\
