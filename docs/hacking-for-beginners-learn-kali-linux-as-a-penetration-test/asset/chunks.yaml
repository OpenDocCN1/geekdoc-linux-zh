    ### 保留端口


    此类端口的取值范围为 0～1023。这些端口在用户编程期间无法使用，而是由某些程序使用。只有具有超级用户权限的应用程序才允许分配保留端口。例如，WWW 服务的默认端口为
    `80`，FTP 服务的默认端口为 `21`。不过，用户也可以为这些网络服务指定其他端口。某些系统协议使用固定端口号且无法更改。例如，端口 `139` 专门用于
    NetBIOS 和 TCP/IP 之间的通信，无法手动更改。


    ### 注册端口


    此类端口的范围在 1024～49151 之间，这是用户在编写服务器时使用的端口号范围。当这些资源未被服务器占用时，客户端也可以动态选择这些端口。客户端使用的端口号也称为临时端口，取值范围为
    49152～65535。


    ### 实现端口扫描


    在用户对端口概念有清晰了解后，就可以实现端口扫描。本节将介绍如何使用 `Nmap` 和 `DMitry` 工具来实现端口扫描。


    #### 1) 使用 Nmap 工具


    通常建议使用 `Nmap` 工具进行端口扫描。通过使用 `Nmap`，你可以识别六种端口状态，即 `open`（开放）、`closed`（关闭）、`filtered`（过滤）、`unfiltered`（未过滤）、`open/filtered`（开放或被过滤）以及
    `closed/filtered`（关闭或被过滤）。如果你想使用 `Nmap` 工具进行端口扫描，需要理解每个端口状态的含义。下节将介绍这 6 种端口状态的具体含义。


    #### Open (开放)


    在这种情况下，应用程序通常在该端口上接收 TCP 连接或 UDP 数据包。具有安全意识的人知道，每个开放端口都是攻击的入口。攻击者或渗透测试想要发现开放端口，而管理员则尝试关闭它们或使用防火墙进行保护，以防阻止合法用户使用。非安全扫描可能对开放端口感兴趣，因为它们显示了网络上有哪些可用。


    #### Closed (关闭)


    关闭端口也可以被 `Nmap` 访问（它会接收 `Nmap` 检测消息并响应），但显而易见没有应用程序在上面监听。它们可以显示 IP 地址的主机（主机发现或
    ping 扫描）正在运行，还可以帮助检测某些操作系统。因为关闭端口是可访问的，某些端口在一段时间后可能会再次被打开。系统管理员可以使用防火墙拦截此类端口。通过这种，它们将显示为被过滤。


    #### Filtered (被过滤)


    由于数据包过滤阻止了探测包到达端口，`Nmap` 无法确定端口是否开放。过滤可能来自专业的防火墙设备、路由器规则或主机上的软件防火墙。有时它们会响应 ICMP
    错误消息，例如类型 3 码 13（无法到达目标：由管理员禁止通信），但更通常的情况下，过滤器直接丢弃探测帧而不进行任何响应。`Nmap` 会重试几次以检测探测包是否由于网络拥塞而被丢弃。这将导致扫描速度显著变慢。


    #### Unfiltered (未过滤)


    未过滤状态意味着端口是可以访问的，但 `Nmap` 无法确定它是开放还是关闭的。用户仅通过对映射防火墙规则集的 ACK 扫描将端口归入此类状态。使用其他类型的扫描（如窗口扫描、SYN
    扫描或 FIN 扫描）扫描未过滤端口，可以帮助确定端口是否开放。


    #### Open/filtered (开放或被过滤)


    当无法确定端口是开放还是被过滤时，`Nmap` 将端口分为此类状态。这发生在开放端口没有响应的情况下。没有响应也可能意味着消息过滤器丢弃了探测消息以及由此产生的任何响应消息。因此，`Nmap`
    无法确定端口是开放还是被过滤。UDP、IP 协议、FIN、Null 和 Xmas 扫描可能属于此类类。


    #### Closed/filtered (关闭或被过滤)


