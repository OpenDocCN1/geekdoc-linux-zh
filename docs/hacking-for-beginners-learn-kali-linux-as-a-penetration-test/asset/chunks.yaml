    10. From this interface, the collected information can be seen more intuitively.


    # Organize and analyze domain name information


    By analysing the previously collected information, we can know the collected domain
    name WHOIS information, subdomain name and server information. The following section
    will organize and analyze domain name information by using `Domain` entities.


    Use the `Maltego` tool to organise and analyse domain name information. The specific
    steps are:


    1. Open a new chart in `Maltego` to avoid confusion with the previous information.
    Click the new chart button.

    2. From this interface, you can see that a new graph is opened, and its name is
    `New Graph`.

    3. Select `Domain` entity here to organise and analyse domain name information.
    Select the `Domain` entity in the entity panel and drag it to the chart, and then
