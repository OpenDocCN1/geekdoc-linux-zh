    \ wireless networks using `airodump-ng` tool is as follows:\n\n```bash\nroot@exampleserver:\
    \ airodump scan\n```\n\nIn the above syntax, the parameter `interface` indicates\
    \ the wireless network card listening interface.\n\nScan wireless network with\
    \ `Airodump-ng` tool. Execute the command as follows:\n\n```bash\nroot@exampleserver:\
    \ airodump wireless\n```\n\nThe scanned wireless network information can be seen\
    \ from the output information. There are many columns in the above output information,\
    \ and the meaning of each column parameter is as follows:\n\n1. **BSSID**: Indicates\
    \ the `MAC` address of the wireless `AP`.\n2. **PWR**: The signal level reported\
    \ by the network card, which mainly depends on the `driver`. The higher the signal\
    \ value, the closer it is to `AP` or computer. If the values of `BSSID` and `PWR`\
    \ are both `-1`, it means that the `driver` of network card does not support reporting\
    \ signal level. If the `PWR` value is `-1`, it means that the client is not in\
    \ the range that the current network card can listen to, but can capture the data\
    \ sent by `AP` to the client. If all client `PWR` values are `-1`, then the network\
    \ card driver does not support signal level reporting.\n3. **Beacons**: The announcement\
