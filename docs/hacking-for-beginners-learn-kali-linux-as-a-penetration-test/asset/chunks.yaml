    In the next chapter, we will talk about the Installation of Kali Linux in both
    virtual machine and a Physical machine. Follow along!


    # Chapter 2: Installation of Kali In a Virtual Machine


    ![](Image00002.jpg)


    Previous chapter has been a good introduction to the hacking world. This chapter
    is an important resource for beginners who are struggling to create their own
    hacking environment. It is a known fact that hackers always rely on Linux for
    their day-to-day tasks. Windows and Mac are good productive operating systems
    but are not suitable for hackers. In this chapter, we will in depth discuss about
    the Installation of Kali (a famous Hacking Linux distro). Let us start!


    ## Download Linux image

    For installing the Kali Linux operating system on your computer, you need to obtain
    the image file of the system. In order to avoid data transmission errors during
    downloading, readers are also suggested to verify its integrity.


    ### How to get a mirror image of Kali Linux?

    Before obtaining the image, users need to have a simple understanding of the image
    of the Kali Linux system such as it''s version, architecture, desktop type. Then
    we need to choose to download the appropriate image to install in the operating
    system.


    1) **Mirror type**: Kali Linux officially provides two image files, one is a stable
    released version, and the other is a weekly updated version. Among both, the stable
    version is usually fully tested and is more convenient to use. The advantage of
    the weekly updated version is that the tools included in it are of the latest
    version. But it''s flaw is that the testing is not sufficient and there maybe
    be a risk of instability.


    2) **The difference in digits**: Kali''s official website provides images of `i386`
    and `amd64` architectures. Among them, `i386` means images that support 32-bit
    architecture & `amd64` means images that support 64-bit architecture. Therefore,
    when downloading mirror files, users need to select the corresponding mirror files
    according to their own system architecture.

    To check your own system architecture windows users can use the control panel
    and Mac OS users can check in the system preferences menu.

    **Note**: Remember that 64-bit architecture can support both 32-bit & 64-bit images.
    Whereas, 32-bit architecture can only support 32-bit supported image.


    3) **Desktop type**: The official website of Kali Linux provides 6 desktop images.
    These are GNOME, E17, KDE, MATE, XFCE and LXDE respectively. Among them, Gnome
    is the most common and easy-to-use desktop environment, so we recommended you
    to choose Gnome desktop for improving your hacking expertise. However, feel free
    to experiment with different versions and settle with the one that you feel comfortable
    with.


    4) **Download the mirror**: After the user gets a clear understanding about all
    the mirror files that are available in the official Kali Linux website, he can
    select the desired file to download. Here is a screenshot of the Kali Linux downloads
    page as of this writing.


    ### Verify Kali Linux image

    Since the installation image files are usually relatively large, the file may
    come damaged or incomplete during the download process. If the image file is damaged
    or incomplete, errors may occur during the installation process. In order to avoid
    these embarrassing situations, users can use a verification tool for verification.
    There are several websites that check the Linux file for it''s authenticity.


    After finding the value, compare and verify whether the obtained value and the
    value provided by the mirror file are the same. If they are the same, then it
    is confirmed that the mirror file is downloaded completely. If not, it is incomplete
    and maybe be filled with hidden malware. We suggest you to download again from
    the official website.


    In the next section, we will talk about installing Kali linux in a virtual machine.


    ## Virtual machine installation

    A virtual machine refers to obtaining a complete computer system with complete
    hardware system functions and running in an isolated environment through software
    simulation. For a beginner, if you install the operating system directly on the
    physical machine, it may cause the system to crash or occur a data loss. Therefore,
    in order to not only learn to install the system, but also to avoid data loss,
    using a virtual machine is a better way. There are dozens of virtual machine software
    in the market. Among them, `VirtualBox` and `VMware` are two well-known virtual
    machine software available for windows. Personally, I think the `VMware` virtual
    machine is simple and easier to operate. I recommend users to use this virtual
    machine software.


    Next section will introduce you to install and create a Kali Linux virtual machine
    using VMware.


    ### Obtaining VMware software

    If you want to install VMware software, you need to obtain its installation package
    from it''s official website. It is available in both free and premium versions.

    To access and download the latest version of VMware software. [Please click here](http://www.vmware.com/products/workstation/workstation-evaluation)


    After visiting this address in the browser, the download interface will appear.
    From this interface, you can see `VMware Workstation Pro` products, which can
    be used under Windows and Linux. In this example, we choose to download the Windows
    software, so click the "Download Now" button in Workstation 15 Pro for Windows,
    and the VMware installation package will start to download. After the download
    is completed, the software package is named as `VMware-workstation-full-15.0.3-versionnumber.exe`.


    ### Install VMware

    When the VMware software installation package is downloaded, the user can install
    the software into the system. The following section will introduce how to install
    VMware software in Windows.

    Specific steps to Install VMWware are as follows:

    1) Double-click the downloaded installation package to enter the welcome dialog
    box.

    2) This dialog box displays the welcome message for installing VMware Workstation.
    Click the "Next" button so that the "End User License Agreement" information will
    be displayed.

    3) This dialog box shows the user license agreement for using VMware. Select the
    "I accept the terms in the license agreement" check box, and click the "Next"
    button.

    4) You can customise the installation location of VMware. By default, VMware will
    be installed in `C:\Program Files(x86)\VMware\Workstation` directory. If the user
    wants to install to another location, he can click the "Change" button to specify
    the location. Then click the "Next" button, and the "User Experience Settings"
    dialog box will be displayed.

    5) This dialog box is used to set user experience information, including checking
    for product updates at startup. By default, both options are enabled. Use the
    default settings here, and then click the "Next" button, so that the shortcut
    creation dialog box will be displayed.

    6) This dialog box will show the shortcut location of VMware Workstation, which
    will be created in "Desktop" and "Start Menu Folder" by default. Then click the
    "Next" button.

    7) By this time, the previous basic settings are completed. Click the "Install"
    button to start installing. After the installation is completed, the completion
    dialog box will be displayed.

    8) From this dialog box, you can see that VMware Workstation Pro has been installed.
    Since VMware Workstation Pro is not a free version, you need to enter a license
    key before it can be used for a long time. Click the "License" button in this
    dialog box, and the "Enter License Key" dialog box will be displayed.

    9) After entering a license key in this dialog box, click the "Enter" button,
    and the completion dialog box will be displayed.

    10) As you can see, the VMware installation wizard has been completed. Click the
    "Finish" button.


    ### Create Kali Linux Virtual Machine

    If the user wants to install the operating system in the VMware software, he needs
    to create the corresponding virtual machine first, to simulate hardware system
    functions. When creating Kali Linux virtual machine environment, it is recommended
    that the memory is not less than 2GB, otherwise the software cannot run normally.
    The disk size should also not less than 20GB.


    The specific steps to create a Kali Linux virtual machine are:

    1) Start the virtual machine. After successful startup, the interface to enter
    settings will be displayed.

    2) The main interface of VMware is very easy to follow. The user can create a
    virtual machine by clicking the "Create a new virtual machine" button on this
    interface. You can also select the "File (F)" | "New Virtual Machine (N)" in the
    menu bar. After clicking the "Create a virtual machine" button, the "New Virtual
    Machine Wizard" dialog box will be displayed.

    3) Select the type of new virtual machine. Two methods are provided: "typical
    (recommended) (T)" and "custom (advanced) (C)". The difference is that the first
    method is relatively simple, and the second method requires manual setting of
    information such as hardware compatibility, processor, etc. If you are a novice,
    it is recommended to use the "typical (recommended) (T)" method. Click "Next",
    so that the installation source dialog box will be displayed.

    4) In this dialog box, select the source. Select the "Install the operating system
    (S) later" option, and click "Next", so that the "Select Guest Operating System"
    dialog box will be displayed.

    5) This dialog box is used to select the operating system and version. In this
    example, the Kali Linux (based on Debian) operating system is being created. Therefore,
    the `Linux` operating system is selected, and the version selected is `Debian
    9.x 64-bit`. Then click "Next", so that the "Name Virtual Machine" dialog box
    will be displayed.

    6) This dialog box asks you to create a name for the virtual machine and set the
    installation location. After setting, click "Next", so the "Specify Disk Capacity"
    dialog box will be displayed.

    7) Set the disk capacity. For users of penetration testing, they usually have
    a large password dictionary when performing password brute force cracking. If
    the dictionary is too large, it will take up a lot of space. In order to facilitate
    the update later, it is also recommended to set the disk capacity a bit larger.
    In this example, we are going with 100GB and click "Next".

    8) The next dialog box displays the detailed information of the newly created
    virtual machine. Click "Finish".


    ### Install the operating system

    Now, we install the Kali Linux operating system in the virtual machine created
    earlier. Before installing the operating system, it is recommended to modify its
    running memory and processor. If the memory is too small, a certain program will
    not run normally. In addition, you also need to manually load the corresponding
    image file.


    The specific steps to install Kali Linux are:

    1) Open the previously created virtual machine, the interface with details will
    be displayed.

    2) Click the "Edit Virtual Machine Settings" option, or select "Virtual Machine"
    | "Settings" in the menu bar.

    3) In the "Hardware" tab, you can set the details of memory, processor, and network
    adapter. Memory size is set to 2GB in this example. Select the `CD/DVD` option
    to load the system image file. Click "OK".

    4) This interface is the installation guide. You can select the "Graphical install
    (graphical interface)" option and press `Enter` key. The language selection dialog
    box will be displayed.

    5) Select the installation language in the dialog box, here select "English".
    Then click "Next".

    6) In the dialog box, select the region where the user is currently located. Here,
    select "USA". Then click "Continue".

    7) Select the default keyboard format "English", and then click "Next".

    8) During the process, some additional components will be loaded. When the network
    configuration is successful, the host name dialog box will be displayed.

    9) Set the host name to `example`, and click "Continue".

    10) This dialog box is used to set the domain name. If the user does not need
    to set it, use the domain provided by default, and click "Continue".

    11) This dialog box is used to set the password of the root user. For security,
    it is recommended to set a complex password. After setting, click "Continue".

    12) This dialog box is used to select the partition method. Here, select the "Entire
    Disk" option, and click "Continue".

    13) Select the disk to be partitioned. It is recommended to set at least 20GB
    for the root partition.

    14) In the dialog box, select the partition scheme "Place all files in the same
    partition (recommended for novices)" and click "Continue".

    15) The next dialog box shows the current system partition. There are two zones:
    the root zone and the swap zone. If the user wants to modify the current partition,
    select the "Undo the modification of partition settings" option. If you do not
    want to modify it, select "End Partition and write changes to disk". Then click
    "Continue".

    16) This dialog box prompts whether to write changes to the disk. Here, select
    the "Yes" radio button and click "Continue".

    17) By this time, the system starts being installed. Some information needs to
    be set, such as setting up a mirror. If the computer where Kali Linux is installed
    is not connected to the network, select the "No" button and click "Continue".
    In order to enable users to install the operating system smoothly, it is recommended
    to select the "No" button. Then click "Continue". After the user has installed
    the system, he can also manually configure the software source and update the
    package manager.

    18) If the user chooses to use network mirroring, a dialog box with additional
    details will pop up. An HTTP proxy can be set in this dialog box to connect to
    the external network. If you do not need to connect to the network, just click
    "Continue", so the "Configure Package Manager" dialog box will be displayed.

    19) When the software package configuration is completed, the "Install GRUB to
    the hard disk" dialog box will be displayed.

    20) This dialog box prompts whether to install the GRUB boot loader to the master
    boot record or not. Select the "Yes" radio button and click "Continue".

    21) This dialog box is used to set the device to install the boot loader. From
    the displayed information, there is only one `/dev/sda` device. Therefore, here
    is the option to install GRUB to `/dev/sda`. Then click "Continue".

    22) When the GRUB bootloader installation is completed, the "End Installation
    Process" dialog box will be displayed.

    23) From this dialog box, you can see that the operating system has been installed.
    In the immediate instance, the operating system needs to be restarted. Click "Continue"
    to end the installation process and restart the operating system.

    24) After the system starts, a login dialog box will be displayed.

    25) Enter the user name for logging in to the system. Enter `root`, and click
    "Next", a password input dialog box will be displayed.

    26) In this dialog box, enter the password of the super user root, which was set
    during the installation. After entering the password, click "Login". If you successfully
    log in, you will see the interface with additional details. When you see this
    interface, it means that the root user has successfully logged in to the system.


    # Chapter 3: Installation of Kali in a Physical Machine


    ![](000002.jpg)


    While Virtual machines are popular they are still not used by majority of hackers
    for various reasons. It is evident that physical machine installation of Kali
    Linux is as important to understand as Virtual machine installation. We included
    a separate chapter for your better understanding.


    ## Why is Physical machine installation necessary?

    Most users feel that the operation in the virtual machine is not real. If you
    want to experience the feeling of using physical machine to implement penetration
    testing, you need to install the Kali operating system on the physical machine.


    ## Make USB installation disk



    ### Install Win32DiskImager tool

    `32DiskImager` tool is mainly used to write `.img` files to SD card or USB card.
    For most people nowadays, today''s computers don''t come with an optical drive.
    Therefore, using U disk to install the operating system is the most convenient
    and quick way. If you want to use U disk to install the system, you need to use
    the tool first.


    The specific steps are as follows:

    1) Download the software package from `https://sourceforge.net/projects/win32diskager/`.
    The software package is named `win32diskager-1.0.0-install.exe`.

    2) Install `Win32DiskImager`. Double-click the downloaded software package to
    enter the license dialog box.

    3) This dialog box shows the license information. Select the "I accept the terms
    in the license agreement" button and click "Next".

    4) This dialog box is used to select the installation location. By default, it
    will be installed in `C:\Program Files(x86)\Writer`. If the user wants to re-specify
    the location, click the "Change" button. Then click "Next".

    5) This dialog box is used to set the folder name. Use the default setting, and
    click "Next", so the "Select additional tasks" dialog box will be displayed.

    6) This dialog box sets whether or to create a shortcut. It is recommended that
    the user creates a shortcut. Select the "Create a desktop icon" checkbox and click
    "Next".

    7) This dialog box displays the detailed information before installation. If you
    need to modify the settings, you can click the "Back" button. Otherwise, click
    the "Install" button to start installing.

    8) From this dialog box, you can see that `Win32DiskImager` has been installed.
    Click "Finish" to automatically start the tool. If the user does not want to start
    the tool directly, deselect "Launch Win32DiskImager" checkbox. If you select the
    "View README.txt" checkbox, the file will be opened.


    ### Make USB installation disk

    Through the previous section, `Win32DiskImager` has been installed in the system.
    Now you can use this tool to make a USB installation disk. When writing the disc
    image, the U disk will be formatted. Therefore, you need to make sure the data
    in the U disk has been backed up.


    The specific steps are as follows:

    1) Insert the U disk into the system and start `Win32DiskImager`.

    2) The tool automatically identifies the removable disk `F`. Then click the button
    to import the Kali ISO image file.

    3) In order to make sure that there is no problem with the produced installation
    media, verification is required here. Select `SHA256` from the "Check Value" drop-down
    list, and click "Generate". After a while, you will see the SHA256 check value
    of the file. If the value is the same as the one provided on the official website,
    then the image file is complete.

    4) After comparing the generated check value with the official website, click
    the "Write" button.

    5) This dialog box prompts whether you are sure to write data to disk `F`. Click
    "Yes" to start writing data. When the data writing is completed, the "write successful"
    dialog box will pop up.

    6) Click "OK" to return to the dialog box. Click "Exit" to exit the program.

    **Note**: After writing the Kali Linux system image, the partition format of the
    U disk becomes `Ext4`. The file format cannot be recognised by Windows, so it
    will prompt that the U disk cannot be accessed normally and requires formatting.
    Just ignore the error message here.


    ## Prepare Kali Linux hard disk partition

    For most users, like to use the Windows operating system, but they also want to
    experience the use of Kali Linux to implement penetration testing on a physical
    machine. At this requirement, the best solution is to install dual systems. If
    you want to install dual system, you need to prepare the hard disk partition.
    If the partition is not prepared, it may cause damage to the original system or
    erase files due to misoperation. For safety reasons, choosing the separate hard
    disk to install the system is the best choice.


    ### Set the first startup

    1) Right-click the "Computer" icon on the desktop and select "Manage".

    2) Select "Storage" | "Disk Management" in the left column.

    3) From this interface, you can see two disks: `Disk 0` and `Disk 1`. Moreover,
    both disks have only one partition: `C` and `E`.

    4) Right-click on `E` and select "New Simple Volume". Set the size to `102400`
    MB (approx 100GB).

    5) Follow the wizard to format the partition.

    6) After the process, you can see `Disk 1` has been successfully divided.


    ### Set the USB device as the startup item

    1) Start the computer and enter the BIOS interface. Note: If it is a physical
    machine, you need to press `F2`, `F12`, or `Del` key (different models are different).

    2) Select "Enter firmware on on" to enter the BIOS main menu.

    3) Use the right arrow to switch to the `Boot` tab.

    4) From this dialog, there are 4 options: `Removable Devices`, `Hard Drive`, `CD-ROM
    Drive`, and `Network boot from Intel`. Use the `+` key to move `Removable Devices`
    to the first position.

    5) Switch to the `Exit` tab and select "Exit Saving Changes (save and exit)".

    6) The dialog box prompts whether you want to save the settings. Click "Yes".

    7) The system restarts and boots from the U disk.

    **Reminder**: All new computers come with UEFI firmware, and the `Secure Boot`
    function is also enabled. This feature will refuse to boot operating systems are
    not signed by UEFI. Motherboard manufacturers generally allow users to turn off
    `Secure Boot` or add a custom public key to UEFI to bypass this restriction.


    ### Set Hard Disk Partition

    If the user installs the operating system directly on a computer without any data,
    there is no need to consider data loss. However, if you are installing a dual
    system, you need to select the correct formatting options.


    #### How to Automatically partition the system?

    1) When the dual system is about to install in the physical machine, a dialog
    box will be displayed.

    2) Select "Use the largest continuous free space". A free space in the system
    will be automatically selected and partitioned.

    3) Click "Continue". The partition scheme dialog box will be displayed.

    4) Select "Place all files in the same partition (recommended for novices)" and
    click "Continue".

    5) The partitions are automatically created: `swap` and `root`.


    #### How to manually partition the Operating system?

    1) Select the "Manual" option.

    2) From this dialog, there are two hard disks: `sda` and `sdb`.

    3) Select "Free Space" on `sdb` and click "Create a new partition".

    4) Set the size to `2GB` for the `swap` partition.

    5) Select `Logical Partition` and click "Next".

    6) Select "Start" to create the partition.

    7) For the `root` partition, set the mount point as `/` and the file system as
    `Ext4`.

    8) Select the "Swap" option and click "Continue".

    9) Set the size to `2GB` for the `swap` partition.

    10) For the remaining space, create the `root` partition.

    11) The partitions are created: `swap` and `root`.

    12. Select "End Partition Settings and write to Disk".


    ### Install GRUB

    1) Open the GRUB installation setting dialog box.

    2. Select "Yes" to install GRUB on the MBR.

    3) From the dialog box, you can see there are two disks: `sda` and `sdb`. It is
    recommended to choose `/dev/sda`.

    4) Click "Continue".


    # Chapter 4: Introducing Kali Linux features


    ![](000002.jpg)


    In the previous chapter we introduced different methods to install Kali Linux
    in both virtual and physical systems. Before starting to learn about different
    tools that Linux comes with it is important to understand the functionalities
    of Kali as an operating system. Learn about its terminal and network capabilities
    can improve your productivity while pen testing.


    ## Kali Linux in Depth

    If you configure the Kali Linux system you need to have a simple understanding
    of the system, such as the use of the menu bar, file management, system settings.
    This section will introduce the common operations of Kali Linux system.


    ### Command menu

    A large number of penetration testing tools are provided in Kali Linux. These
    tools are classified into different categories such as information collection,
    vulnerability analysis, Web programs. The user can see all the categories by selecting
    the "Application" tab on the graphical interface. From this starting interface,
    you can see that the application includes 14 categories. Each category has definite
    subcategories. For tools running on a graphical interface, it is more convenient
    to start them through a menu command. For tools running on the command line, it
    is often not available or possible to enter from the menu command and must be
    executed in the terminal. Always make sure that you refer individual doc format
    of tools for both GUI and CLI commands.


    ### File tool

    The File tool is used to manage files in a graphical interface. If you want to
    perform file management, you need to be very clear about the file system structure.
    Otherwise, you may face the problem of not being able to find the location of
    the file. Linux system is different from Windows system. Unlike windows it does
    not store files by drive letter. There is only one root partition in the Linux
    system, and all files are in the root directory.

