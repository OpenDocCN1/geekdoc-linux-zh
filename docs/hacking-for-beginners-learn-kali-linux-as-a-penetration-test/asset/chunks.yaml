    * `/Bin`: 基本系统所需的命令也是最小化系统所需的命令，例如 `ls`、`cp`、`mkdir` 等。此目录下的文件是可执行的，供普通用户使用。

    * `/Sbin`: 该目录主要用于存储系统管理命令。它是存储特权用户 `root` 的可执行命令的地方。普通用户没有权限执行该目录中的命令。此目录类似于
    `/usr/sbin` 或 `/usr/local/sbin` 目录。只需记住 `sbin` 目录中包含的内容只能通过 root 权限执行。

    * `/etc`: 存储系统程序或通用工具的配置文件。

    * `/usr`: 这是系统存储程序（如命令和帮助文件）的目录。该目录包含许多文件和目录。当用户安装 Linux 发行版官方提供的软件包时，大部分都会安装在这里。如果涉及服务器配置文件，这些配置文件将安装在
    `/etc/` 目录中。

    * `/Var`: 此目录的内容经常变化。`/var` 通常包含 `/var/log`、`/var/spool`、`/var/cache` 等。其中，`/var/log`
    是用于存储系统日志的目录；`/var/spool` 是用于存储打印机、邮件、代理服务器等的溢号目录；`/var/cache` 用于存储一些缓存文件。


    在用户对 Kali Linux 文件系统结构有了清晰的后，就可以进行文件管理。这里介绍 Linux 图形界面的文件管理工具。


    1) 在桌面上选择“位置” | “计算机”，即可打开文件系统的根目录。

    2) 从此界面，可以看到根目录下的所有文件和文件夹。此时，用户可以执行打开文件、创建文件、删除文件和查看文件内容等操作。如果你想打开文件，只需双击文件。如果你想删除或复制文件，需要选择文件或文件夹并右键点击，会弹出菜单。其中将显示文件夹和文件的弹出菜单。

    3) 此时，选择弹出菜单中的任何命令来执行相应操作。例如，选择“用文本编辑器打开”命令来显示文件内容。

    4) 此界面显示了 `sources.list` 文件的内容。此时，用户可以编辑文件内容。如果修改了内容，可以点击“保存 (S)”按钮生效。


    ### Terminal

    终端可以理解为命令行模式下的文件管理工具。对于喜欢使用命令行操作的用户，可以使用终端模式来实现文件管理。通过前面的介绍，用户也知道某些命令在图形界面下无法正常运行。因此，如何使用终端执行操作也是一项非常重要的技能。下一节将介绍终端的常用操作。


    1) 打开新终端

    如果你想使用终端，需要先打开终端。在 Kali Linux 中，有两种打开终端的方法。第一种是直接点击收藏中的终端按钮。第二种方法是在桌面右键点击，并在弹出菜单中选择
    `在终端中打开` 命令。

    如你所示，立即界面表示终端窗口已成功打开。在此窗口中，用户还可以打开多个终端。右键点击终端窗口并在弹出菜单中选择 `新建标签页 (T)` 命令来打开一个新的终端窗口。

    从此界面可以看到，终端有两个标签。通过点击标签，你可以切换你所在的终端窗口。


    2) 查看目录

    当用户打开终端窗口时，可以通过命令行管理文件。查看目录是确定当前目录下包含哪些文件最常用的操作。使用 `ls` 命令查看当前目录下的所有文件。

    从此界面显示的结果中，可以看到当前目录下的所有文件都已列出。


    3) 切换目录

    切换目录也是最常用的操作。如果用户想查看某个目录下的文件，需要切换到相应的目录。例如，使用 `cd` 命令切换到 `/etc` 目录，使用 `pwd` 命令查看当前工作目录。

    从输出中观察到，你成功切换到了 `/etc` 目录。


    4) 编辑文件

    编辑文件是用于操作文件内容的方法。例如，如果你想在终端上设置软件源，需要编辑软件源文件。例如，你可以使用 `Vi` 文本编辑器编辑软件源。

    执行上述命令后，你可以打开 `sources.list` 文件的编辑界面。

    上述界面表示 `sources.list` 文件的编辑界面已成功打开。接下来，用户可以编辑文件。


    下一节将介绍如何使用 `Vi` 文本编辑器编辑和保存文件。在使用 `VI` 编辑器之前，需要理解它的 3 种工作模式，即命令模式、输入模式底行模式。这 3
    种模式的功能如下：


    * 命令模式：启动 `Vi` 文本编辑器后，默认进入命令模式。此模式主要完成光标移动、字符串搜索以及删除、复制和粘贴文件内容的相关操作。

    * 输入模式：此模式下的主要操作是输入文件内容，以便修改文本文件主体或添加新内容。在输入模式下，`Vi` 文本编辑器的最后一行将显示状态提示信息 --INSERT--。

    * 底行模式：在此模式下，你可以设置 `VI` 编辑环境、保存文件、退出编辑器并执行搜索和替换文件内容的操作。在底行模式下，VI 编辑器的最后一行会出现一个冒号(:)
    提示符。


