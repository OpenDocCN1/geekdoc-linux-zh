    PortsIn computers, the port is considered as an essential concept. In network
    technology, ports have several meanings. The port referred to here is not a physical
    port, but a port in the TCP/IP protocol. It is a port in a logical sense. Among
    the TCP/IP protocols, the most commonly used protocols are TCP and UDP. Since
    the two protocols of TCP and UDP are independent, their respective port numbers
    are also independent of each other. For example, TCP has port 235, UDP can also
    have port 235, the two usually do not conflict.The functions of ports and commonly
    used ports are described below:1) The role of the portUsers know that a host corresponds
    to an IP address and can provide multiple services, such as Web services and FTP
    services. If there is only one IP, different network services cannot be distinguished,
    so use "IP+port number" to distinguish different services.2) Definition of portThe
    port number is used to identify the only process in the host, whereas "IP+port
    number" can identify the only process in the network. In Socket programming during
    network development, IP + port number is the socket. The port number is numbered
    by 16-bit binary numbers, and the range is between 0～65535.However, these ports
    cannot be used casually, and some ports can be already occupied. For example,
    the port of the Web server is 80, the port of the FTP service is 21, etc. Therefore,
    ports are classified and the range of ports that users can use is specified rigorously
    for pen-testers. Always have a good knowledge about the ports that your target
    has.3) Port classificationThere are many ways to classify ports. Usually they
    will be classified according to the fact whether they are used by the server or
    by the client.The port number used by the server can be divided into a reserved
    port number and a registered port number as follows:'
  toc: []
  trans: '

    保留地址。这种类型 IP 地址的开头是 `1111`，因此地址范围的网络号从 `240` 到 `255`。在 IP 地址中，还有一种特殊类型的 IP 地址，被称为广播地址。广播地址是一种专门用于同时向网络中所有主机发送消息的地址。在运行
    TCP/IP 协议的网络中，主机标识段全为 1 的 IP 地址即为广播地址，需要注意的是，广播包会传输到所有涉及主机标识段的计算机。


    IP 地址主要根据子网掩码分为网络段。例如，如果 IP 地址 `192.168.1.100/24` 对应的子网掩码为 `255.255.255.0`，则网络段为
    `192.168.1.0-255`，也就是说该网络段中有 256 个主机。


    当用户发现一个主机时，可以通过掩码格式指定网络范围。其中，为了输入方便，通常使用 CIDR 格式来指定整个子网。CIDR 格式由两部分组成：网络地址和子网掩码，用斜杠（`/`）分隔。如果用户不确定对应
    IP 范围的子网掩码格式，可以使用 Net-mask 工具来实现。可以说该工具可以在 IP 范围、子网掩码、CIDR、Cisco 等格式之间进行转换，并提供点进制、十六进制、八进制和二进制
    IP 地址之间的转换。


    ## 确定网络拓扑


    用户可以根据路由条目确定上级网络范围。在渗透测试中，通过确定网络拓扑，可以判断目标是局域网还是外部网络。这样就可以针对性地选择渗透测试工具，从而提高渗透测试的效率。本节将介绍使用
    `Trace-route` 工具获取目标主机的路由条目，以确定网络拓扑。


    使用该工具实现路由跟踪的语法格式如下：

    ```

    traceroute [Target]

    ```

    这里，`target` 是我们尝试查找信息的宿主机网络地址。


    **使用场景：**

    使用 `Trace-route` 工具追踪目标主机 `72.132.234.64` 的路由以确定其网络拓扑。

    执行命令如下：

    ```

    root@exampleserver:～# traceroute 72.132.234.64

    ```

    这将详细显示关于该特定主机的结果。如果你实际运行此命令，计算机屏幕上会弹出很多内容。这些信息大部分是关于数据包以及它们选择的路由的。高级安全研究人员在攻击场景期间分析这些数据包标记，以检查黑客是否在服务器上留下了任何指纹。


    **注意：** 在虚拟机的 NAT 模式下，`Trace-route` 的操作会出现问题，无法显示上级路由信息。在工作时请确保了解这一点。


    ## 第 10 章 扫描主机


    ![](img/Image00004.jpg)


    在上一章中，我们学习了一些网络规则，这些规则对于理解 `Nmap` 等工具的重要性至关重要。网络本身是一个庞大的的话题，但作为黑客，我们建议你通过学习各种网络原理和协议来良好掌握这一主题。


    用户可以通过主动扫描确定目标主机是否活跃。主动扫描是通过发送探测请求包并等待目标主机的响应完成的。如果目标主机响应了请求，意味着该主机是活跃的。否则，我们可以得出目标主机未在线的结论。


    本节将介绍几种主动扫描主机的方法。


    ### 1) 使用 Nmap 工具


    `Nmap` 是一个非常强大的网络扫描和嗅探工具包。该工具有三个基本功能。三个功能中的第一个是检测一组主机是否在线。第二个是扫描主机端口并嗅探提供的网络服务，而第三个是推断主机正在使用的操作系统。


    以下示例将介绍如何使用 `Nmap` 工具检测目标主机是否在线。


    `Nmap` 的语法格式如下：

    ```

    nmap -sP [target]

    ```

    上述语法中的 `-sP` 选项意味着对目标主机执行 Ping 扫描。参数 `[target]` 用于指定扫描的目标地址。此处的目标可以是主机名、IP 地址（包括单个地址、多个地址或地址范围），甚至是网络网段。


    **使用场景：**

    检测目标主机 `72.132.234.64` 是否在线。

    执行命令如下：

    ```

    root@exampleserver:～# nmap -sP 72.132.234.64

    ```

    你也可以同时检查多个主机。下面我们为该场景提供了一个示例供你参考。


    **使用场景：**

    使用 `Nmap` 检测主机 `72.132.234.64`、`72.132.234.65` 和 `72.132.234.66` 是否在线。

    执行命令如下：

    ```

    root@exampleserver:～# nmap -sP 72.132.234.64-66

    ```

    这会显示这些主机的可用性。


    ### 2) 使用 Netdiscover 工具


    `Netdiscover` 是一个支持主动和被动模式的 ARP 探测工具。你可以使用该工具扫描网络上的 IP 地址并检查在线的主机。


    本节将介绍使用 `Netdiscover` 工具实现主动扫描。


    语法格式如下：

    ```

    netdiscover -r [range]

    ```

    上述语法中的 `-r [range]` 选项用于指定扫描的网络范围。如果用户未指定目标，会自动选择网络。


    **使用场景：**

    使用 `Netdiscover` 工具扫描 `72.132.234.64/24` 网段中的在线主机。

    执行命令如下：

    ```

    root@exampleserver:～# netdiscover -r 72.132.134.64/24

    ```

    通过分析捕获的数据包，可以知道当前主机的 IP 地址和 MAC 地址。扫描完成后将显示获取的信息。如果你仔细观察尝试攻击的主机信息，按 `Ctrl+C` 键退出
    `Netdiscover` 界面。用户有时也可以不指定范围，尽可能寻找在线主机。执行命令如下：

    ```

    root@exampleserver:～# netdiscover

    ```


    ## 监控主机


    监控主机意味着不向目标发送数据包，而监控网络中的数据包。在局域网中，某些协议会自动广播数据包，例如 ARP 广播和 DHCP 广播。用户可以通过接收这些广播包来检测网络上的在线主机。


    ### 1) ARP 监控


    ARP（地址解析协议）是一种根据 IP 地址获取物理地址的 TCP/IP 协议。当主机发送信息时，向网络上的所有主机广播 ARP 请求并接收返回消息。


    本节将介绍使用 `Netdiscover` 工具的被动模式进行 ARP 监控以发现主机。语法格式如下：

    ```

    netdiscover -p

    ```

    上述语法中的 `-p` 选项意味着使用被动模式，即不需要发送数据包，仅允许嗅探。从第一行的输出中可以理解扫描是以被动模式进行的。从第二行信息中，你可以看到嗅探包的数量、主机数量和包大小。第三行信息将关于嗅探包。你可以从
    IP 列看到在线主机。许多其他任务可以使用此命令完成。我们建议你尝试这些命令以更好地理解该主题。


    ### 2) DHCP 嗅探


    DHCP（动态主机配置协议）是一种局域网协议，其主要功能为内部网络或服务提供自动分配 IP 地址。当客户端需要获取 IP 地址时，它会发送广播包。接收接收请求的
    DHCP 服务器将为客户端提供可用 IP 地址。因此，用户可以实现 DHCP 嗅探来检测网络中的在线主机。


    本节将介绍通过 `Nmap` 的 `broadcast-dhcp-discover` 脚本发现主机。`Nmap` 的 `broadcast-dhcp-discover`
    脚本可发送 DHCP 广播包，并有效显示响应包的具体信息。通过分析响应包中的信息，可以找到可分配的 IP 地址。使用该脚本进行被动扫描的语法格式如下：

    ```

    root@exampleserver: nmap --script broadcast-dhcp-discover

    ```

    上述语法中的 `--script` 选项用于指定用于攻击的脚本。


    ## 第 11 章 域名分析


    ![](img/Image00004.jpg)


    在上一章中，我们讨论了扫描主机时使用的步骤。虽然扫描被认为是一个简单的过程，但由于为了检测恶意扫描请求而快速发展的入侵检测系统，现在它通常是不可行的。为了应对这个问题并以更好的方式分析我们的目标，我们需要理解域名分析的重要性。跟随本章以良好掌握它。


    ### 什么是域名？


    域名是一组由点分隔的名称字符串，通常用于代表互联网上某台计算机或计算机组的名称。它可以识别数据传输期间计算机的电子位置。通常，外部网络上的主机是通过域名识别的。如果你想对外部网络的主机进行渗透测试，那么必须分析域名以获取域名的详细信息。我们可以找到不同的敏感参数，如域名所有者信息、子域名名、服务器地址。本节将通过几个示例介绍如何分析域名信息。


    ### 基础域名信息


    当域名被注册时，它包含基础信息，如域名是否已注册、域名注册机构、域名所有者等。通过检查域名的 `WHOIS` 信息，可以轻松获取域名的基础信息。本节将介绍如何使用
    `WHOIS` 和其他流行工具获取域名的基础信息。常说在分析目标之前，域名分析是渗透者的首要工作。


    ### 1) 使用 WHOIS 工具


    `WHOIS` 工具用于查找并显示指定账户（或域名名）的相关信息。使用该工具查询域名信息的语法格式如下：

    ```

    whois [domain name]

    ```

    这里 `domain name` 是要查询的域名。


    **使用场景：**

    使用 `WHOIS` 工具查询域名 `wikipedia.com` 的相关信息。执行命令如下：

    ```

    root@exampleserver:～# whois wikipedia.com

    ```

    在终端上输入上述命令后，你可以看到域名的相关信息。


    ### 2) 使用 Dmitry 工具


    `dmitry` 是一个信息收集工具。渗透者通常使用此工具收集域名信息、子域名、域名中包含的电子邮件地址等。使用此工具获取 WHOIS 信息的语法格式如下：

    ```

    dmitry -w [domain]

    ```

    `-w`：对指定的域名执行 WHOIS 查询。


    **使用场景：**

    使用 `dmitry` 工具查询域名 `wikipedia.com` 的 WHOIS 信息。执行命令如下：

    ```

    root@exampleserver:～# dmitry -w wikipedia.com

    ```

    通过在终端中使用上述命令，将成功获取域名的 WHOIS 信息。


    ### 查找子域名


    子域名也被渗透者视为一个域名。在域名系统中，通常属于顶级域名。例如，`www.wikipedia.com` 和 `forum.wikipedia.com`
    是 `wikipedia.com` 的子域名。`www` 是标识服务器的主机名。查找域名可以找到对应的主机。下面将通过示例说明查找子域名的方法。


    ### 1) 使用 Dmitry 工具


    `dmitry` 工具可用于查找子域名。然而，如果你访问被 Google 黑名单的网站，使用 Google 搜索引擎查找子域名有时可能不可靠。所以请确保你的域名与
    Google 兼容。使用 `dmitry` 工具查找子域名的格式如下：

    ```

    dmitry -s -o

    ```

    上述语法中的选项和含义为：

    - `-s`：执行子域名查询。

    - `-o`：指定输出的文件。


    **使用场景：**

    使用 `dmitry` 工具查找域名 `wikipedia.com` 的子域名。执行命令如下：

    ```

    root@exampleserver:～# dmitry -s -o wikipedia.com

    ```

    在 Linux 终端输入上述命令，你可以看到 `wikipedia.com` 的所有子域名和对应的 IP 地址。


    ### 2) 在线查询


    用户也可以通过在线查询技术搜索子域名。其中，在线查询域名的常用地址是访问以下网站（https://phpinfo）。当用户成功在浏览器访问地址时，会显示请求域名的界面。在文本框输入要查询的域名，然后点击“Start”按钮查找对应的子域名。例如，我们可以找到域名
    `wikipedia.com` 的不同子域名。立即显示 `wikipedia.com` 的可用子域名


    ## 接下来


    现在你已经熟悉了查找子域名的技术以及特定域的属性。但重要的是，管理员和开发者经常限制匿名用户（即渗透测试人员）访问信息。因此，不完全依赖域名分析是重要的。在下一章中，我们将通过引入发现服务器的步骤来应对这个问题。


    ## 第 12 章 发现服务器


    ![](img/Image00004.jpg)


    虽然域名方便人们记忆，但网络中的计算机只能知道彼此的 IP 地址。因此，你需要根据域名查询对应的主机。在域名服务器中，通过域名记录如 `A` 记录、`MX`
    记录和 `NS` 记录识别不同的主机。其中，`A` 记录代表主机；`MX` 记录代表邮件服务器；`NS` 代表 DNS 服务器。每个域名记录包含一个 IP
    地址。用户可以通过检测域名服务器确定对应对应的 IP 地址。下面将通过有效的指令说明发现服务器的方法。


    ### 1) 使用 Dnsenum 工具


    `dnsenum` 是一个域名信息收集工具。它可以通过 Google 或字典文件猜测可能的域名，并能有效地对网段执行反向查询。它还可以查询网站的主机地址信息、域名服务器和邮件交换记录。


    使用该工具收集域名信息的语法格式如下：

    ```

    dnsenum -w

    ```

    上述语法中的 `-w` 表示在网络范围内执行 WHOIS 查询。


    **使用场景：**

    使用 `dnsenum` 枚举子域名 `wikipedia.com` 的信息。执行命令如下：

    ```

    root@exampleserver:～# dnsenum -w wikipedia.com

    ```

    如果你在终端输入上述代码，你可以看到子域名 `www.wikipedia.com` 的 IP 地址。


    ### 2) 使用 nslookup 工具


    `nslookup` 是由微软发布的检测 DNS 服务器的命令。该工具用于查询 DNS 记录验证域名解析是否正常。发生网络故障时，该工具也可诊断问题。通过域名解析可以获取对应服务器的
    IP 地址。语法格式如下：

    ```

    nslookup domain

    ```

    命令中 `domain` 参数指定要查询的名字。


    **使用场景：**

    使用 `nslookup` 解析域名 `wikipedia.com`。执行命令如下：

    ```

    root@exampleserver:～# nslookup wikipedia.com

    Server: 192.168.1.1

    Address: 192.168.1.1


    Non-authoritative answer:

    Name: wikipedia.com

    Address: 93.184.216.34

    ```

    从输出信息可以看到 `wikipedia.com` 已解析。从显示的结果中可以看到该域名的地址为 `192.168.1.1` 和 `93.184.216.34`。当使用
    `nslookup` 执行域名查询时，默认是 `A` 记录。用户也可以使用 `type=` ` 在交互模式下指定记录类型，如 `NS`、`MX`、`CNAME`、`PTR`
    等。


    (1) 启动 `nslookup` 工具进入交互模式。执行命令如下：

    ```

    root@exampleserver:～# nslookup

    ```

    如果你看到命令提示 `>`，意味着你成功进入了 `nslookup` 的交互模式。


    (2) 将查询类型设置为 `NS` 记录。执行命令如下：

    ```

    type=ns wikipedia.com

    Server: 192.168.1.1

    Address: 192.168.1.1


    Non-authoritative answer:

    Name: wikipedia.com

    nameserver = 1.f.0.1.wikipedia.org

    2.f.0.1.wikipedia.org

    nameserver = 3.f.0.1.wikipedia.org

    nameserver = 4.f.0.1.wikipedia.org

    nameserver = 5.f.0.1.wikipedia.org

    nameserver = 6.f.0.1.wikipedia.org

    nameserver = 7.f.0.1.wikipedia.org

    nameserver = 8.f.0.1.wikipedia.org

    nameserver = 9.f.0.1.wikipedia.org

    nameserver = 10.f.0.1.wikipedia.org

    nameserver = 11.f.0.1.wikipedia.org

    nameserver = 12.f.0.1.wikipedia.org

    nameserver = 13.f.0.1.wikipedia.org

    nameserver = 14.f.0.1.wikipedia.org

    nameserver = 15.f.0.1.wikipedia.org

    nameserver = 16.f.0.1.wikipedia.org

    nameserver = 17.f.0.1.wikipedia.org

    nameserver = 18.f.0.1.wikipedia.org

    nameserver = 19.f.0.1.wikipedia.org

    nameserver = 20.f.0.1.wikipedia.org

    ```

    (3) 输入要查询的域名。执行命令如下：

    ```

    wikipedia.com

    ```

    Server: 192.168.1.1

    Address: 192.168.1.1


    Non-authoritative answer:

    Name: wikipedia.com

    Address: 93.184.216.34

    ```

    如果用户不需要查询其他记录，可以使用 `exit` 命令退出交互模式。

    ```

    root@exampleserver:> exit

    ```


    ### 3) 使用 Ping 命令


    `Ping` 命令可检查网络是否连接。这通常有助于用户分析和判断网络故障。对于域名，通常可以指定多个 IP 地址。此时用户无法确定目标服务器使用的是哪个地址。使用
    `Ping` 命令确定目标主机。`ping` 命令的语法格式如下：

    ```

    ping -c [count][target]

    ```

    在上述语法中，选项 `-c` 用于指定发送 `Ping` 包的数量，参数 `[target]` 用于指定目标主机地址，地址可以是主机名、IP 地址或域名。在
    Windows 系统中，`Ping` 命令只发送并响应 4 个包即停止。在 Linux 系统中，`Ping` 命令默认一直执行，用户需要按下 `Ctrl+C`
    组合键停止。


    **使用场景：**

    使用 `Ping` 命令检测域名 `wikipedia.com` 的 IP 地址，并指定只发送 4 个包。执行命令如下：

    ```

    root@exampleserver:～# ping -c 4 wikipedia.com

    ```

    输入上述命令后，我们可以看到成功接收来自目标主机的响应包。从响应包信息可以看到目标发出的 IP 地址。


