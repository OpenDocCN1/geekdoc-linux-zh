    ￼root@exampleserver:～# vi test￼ root￼ password(2) Use the rsmangler tool to generate
    a dictionary and save it to pass.txt.The execution command is as follows: ￼root@exampleserver:～#
    rsmangler -f test -o pass.txtAfter executing the above command, no information
    will be output. At this point, the user can use the cat command to view the generated
    dictionary file as follows:￼ root @ exampleserver: ~ # cat pass.txt￼You can see
    the generated password dictionary from the output information. Due to space limitations,
    only some passwords are listed.3) Use rtgen toolThe rtgen tool is used to generate
    rainbow tables. The rainbow table is a huge collection of possible letter combinations
    and pre-calculated hash values. Among them, the generated rainbow table includes
    multiple algorithms, such as LM, NTLM, MD5, SHA1, and SHA256.Then, using the rainbow
    table can quickly crack all kinds of passwords. The following will introduce the
    method of using the rtegn tool to generate a rainbow table.The syntax format is
    as follows: ￼rtgen hash_algorithm charset plaintext_len_min plaintext_len_max
    table_￼The meaning of the parameters in the above syntax is as follows: ·Hash_algorithm:
    Specify the hash algorithm used. Among them, the values ​​that can be specified
    include lm, ntlm, md5, sha1, and sha256\. ·Charset: Specify the character set.
    Among them, the default character set file provided by the rtgen tool is /usr/share/rainbowcrack/charset.txt,
    as follows: ￼root @ exampleserver: / usr / share / rainbowcrack# cat charset.txt￼The
    above output information shows all character sets provided by the rtgen tool by
    default.Among them, the minimum length of the specified password is 4, and the
    maximum length is 8.The execution command is as follows: ￼root@exampleserver:～#
    rtgen md5 loweralpha 4 8 010001000 0￼Seeing the above output information, it means
    that a rainbow table based on MD5 has been successfully generated, the file name
    is md5_loweralpha#4-6_0_1000x1000_0.rt.Among them, the rainbow table is saved
    in the /usr/share/rainbowcrack directory by default: ￼root@exampleserver:～# cd
    /usr/share/rainbowcrack/￼From the output information, we can see that the generated
    rainbow table file is md5_loweralpha#4-8_0_1000x1000_0.rt.To make it easier to
    use the generated rainbow table, you can use the rtsort command to sort it.The
    execution command is as follows: ￼root@exampleserver:/usr/share/rainbowcrack#
    rtsortAfter executing the above command, no information will be output. Next,
    you can use the rainbow table to perform password cracking. ￼Chapter 43Cracking
    the Hash Password![](Image00007.jpg)Cracking the hash passwordIn order to avoid
    the harm caused by information leakage, in actual application, the software and
    system will encrypt the password and then save it. Common encryption methods are
    various hash algorithms. This type of algorithm can encrypt passwords of different
    lengths into fixed-length strings. Since the encrypted string has a fixed length
    and cannot be directly reversed cracked, it has a very high degree of security
    and is therefore widely used. The method to crack the hashed password will be
    introduced below.Identify the hash encryption methodHash encryption is a type
    of algorithm, including many specific algorithms. When a penetration tester is
    cracking a hash password, if he determines the encryption method of the hash password,
    he can choose targeted tools and methods to crack it, which can save a lot of
    time and improve the efficiency of cracking. The following section describes how
    to use the hashid tool to identify the hash encryption method.Use the hashid tool
    below to identify the encryption method of the hash password value 6bcec2ba2597f089189735afeaa300d4.The
    execution command is as follows:root@exampleserver: hashed tool MD5The above output
    information shows the possible hash password methods. Among them, the hash type
    shown in the front is more likely. It can be guessed that the hash type of the
    password is MD2 or MD5.Cracking LM Hashes passwordLM (LAN Manager) Hash is one
    of the earliest password hashing algorithms used in the Windows operating system.
    The following will introduce the method of using findmyhash tool to crack LM Hashes
    password.The syntax format of using findmyhash tool to crack the password is as
    follows: ￼findmyhash OPTIONSIn the above syntax, the parameter algorithm indicates
    the type of password algorithm to be cracked. The supported algorithms are MD4,
    MD5, SHA1, SHA224, SHA256, SHA384, SHA512, RMD160, GOST, WHIRLPOOL, LM, NTLM,
    MYSQL, CISCO7, JUNIPER, LDAP_MD5 and LDAp_SHA1\. OPTIONS indicates available options.Among
    them, the commonly used options and their meanings are as follows: ·-H <hash_value>:
    Specify the crackedHash value. ·-F : Specify the list of cracked hash files. ·-G:
    If the hashed password cannot be cracked, a Google search will be used and the
    result will be displayed. Among them, this option can only be used with the -h
    option.Use the findmyhash tool to crack the original password of the LM hash password
    5f4dcc3b5aa765d61d8327deb882cf99.The execution command is as follows: ￼root@exampleserver:～#
    findmyhash MD5-h＊＊＊＊＊ HASH CRACKED!! ＊＊＊＊＊￼Use hash password value directlyWhen
    the user cannot crack the hashed password, the hashed password can be used directly
    without cracking by exploiting specific vulnerabilities. In the Metasploit framework,
    you can use the exploit/windows/smb/psexec penetration test module to directly
    use hashed passwords to bypass password verification. The following will introduce
    how to use this module.By using the exploit/windows/smb/psexec penetration test
    module, the hashed password is directly used.The specific steps are as follows:1)
    Use the hashdump command to obtain the hash password in the Meterpreter session:
    ￼meterpreter> hashdump￼2) Run the Meterpreter session in the background and switch
    to the module configuration interface.The execution command is as follows: ￼meterpreter>
    background￼[＊] Backgrounding session 1...3) Select the exploit/windows/smb/psexec
    module and view the module configuration options.The execution command is as follows:
    ￼msf5 exploit(multi/handler)> use exploit/windows/smb/psexec￼0 Automatic4) Configure
    option parameters.The execution command is as follows: ￼msf exploit(psexec)> set
    RHOSTS 192.168.29.143#Set the remote host address￼5) Implement penetration and
    directly use hash password values.The execution command is as follows:msf exploit(psexec)>
    exploit￼As you can see from the output information, the bob user successfully
    opened a session. ￼Chapter 44Advanced Password Cracking![](Image00007.jpg)Bypass
    Windows login with UtilmanUtilman is a Windows auxiliary tool manager. Under Windows,
    even if there is no user login, you can use the Windows+U key combination to call
    the Utilman process. With this mechanism, the Windows login authentication mechanism
    can be bypassed to operate the system. This section will introduce how to use
    this method.By replacing the Utilman.exe file with cmd.exe, bypassing the login
    operation.The specific steps are as follows:1) On a Windows computer, use the
    U disk installation medium to enter the Kali Linux Live mode. First start the
    U disk installation medium, the system installation guide interface will be displayed.
    ￼2) Select Live (amd64) on this interface to enter Live mode. Then, open the Windows
    file system in this Live mode. As shown, select Places|Computer in this interface.
    ￼3) After clicking the Computer option on this interface, the local computer file
    system will be opened. ￼4) This interface displays the file list of the Linux
    Live system. At this point, select the Other Locations command in the left column
    to see other hard disk files. ￼5) This interface shows all the disk partitions
    in the computer. According to the displayed partition size, find the partition
    of the Windows system. In this example, the partition of the Windows system is
    322GB Volume. Therefore, opening the hard disk partition will display the file
    list of the Windows system.6) In this interface, enter the Windows|System32 folder
    in turn, the content shown will be displayed. ￼7) Find the Utilman.exe file in
    the folder and rename the file to Utilman.old. Then copy the cmd.exe file in the
    directory as a copy, and modify its file name to Utilman.exe. Next, turn off Kali
    Linux Live mode and start the Windows system. Press Wins+U key combination on
    the login interface, the interface shown will be displayed. ￼8) From this interface,
    you can see that a command prompt window is opened. In this window, you can execute
    various terminal commands. For example, use the whoami command to view user information.
    ￼9) It can be seen from the output information that the current user has the highest
    authority. At this time, any operation can be performed. ￼Router Password CrackingThe
    router is the core device of a network. Once the router is controlled, it is easy
    to carry out various data sniffing and spoofing attacks on hosts connected to
    the router. Most routers use username/password authentication methods. The management
    interface of each router has an initial user name and password. Due to the mistakes
    of some administrator users, initial passwords or weak passwords may be used.
    This section will introduce the common methods to crack the router password.Initial
    router passwordMost routers have an initial username and password. In order to
    facilitate users to implement router password cracking, the following will list
    common router initial user names and passwords.￼Using Medusa ToolsMedusa is an
    open source brute force password cracking tool that can crack a variety of passwords
    online, such as FTP, HTTP, IMAP and MYSQL. Among them, the management interface
    of the router is based on the HTTP protocol, so users can use the Medusa tool
    to implement password cracking. The following will introduce how to use Medusa
    tool to break the router password.The syntax format of using Medusa to brute force
    the router password is as follows: ￼medusa -h [IP] -U [user file] -P [pass file]
    -M http -e nsBrute force cracking of the login user name and password of the TP-Linux
    router.The execution command is as follows: ￼root@exampleserver:～# medusa -h 192.168.1.1-u
    admin -P passords.txtACCOUNT FOUND: [http] Host: 192.168.1.1 User: admin Password:
    daxueba￼ [SUCCESS]The information output above shows the process of cracking the
    router password. From the displayed results, we can see that the username and
    password of the router have been successfully cracked. Among them, the user name
    is admin and the password is daxueba.Crack Linux PasswordIn Linux, many operations
    require the root user root to perform. If the user who obtains a Linux remote
    session does not have permission and cannot raise the permission, the session
    is useless. At this point, the user can crack the user password of the Linux system
    and log in to the target system. The following will introduce the method of cracking
    Linux user password.The Linux system saves the encrypted password hash in a file
    named shadow, which is saved in /etc/shadow by default. As long as the file is
    cracked, the original password of the user can be viewed. But before cracking
    the /etc/shadow password, the /etc/passwd file is also required. This file saves
    the user''s basic information, such as user name, home directory, and login Shell.
    Cracking the Linux user password is to extract the /etc/shadow and /etc/passwd
    files, combine them, and then use a password cracking tool to crack.The specific
    steps are as follows:1) To facilitate input, copy the obtained user password file
    to /root.Execute the following commands: ￼root@exampleserver:～# cp /etc/passwd
    /etc/shadow /root/After executing the above command, the passwd and shadow files
    are saved in the /root directory.2) Use the unshadow command to extract the password
    file.The execution command is as follows: ￼root@exampleserver:～# unshadow passwd
    shadow> crackedExecuting the above command means that the contents of the passwd
    and shadow files are extracted and saved in the cracked directory.3) Use the john
    tool to crack the password.The execution command is as follows: ￼root@exampleserver:～#
    john --wordlist=/usr/share/john/password.lst cracked￼Warning: detected hash type
    "sha512crypt", but the string is also recognized as "crypt"￼ Use the "--show "option
    to display all of the cracked passwords reliablyNote: The --wordlist option in
    the above command is used to specify a password dictionary for cracking passwords.
    From the output information, you can see that the password of the current system
    root user is daxueba. At this time, the user can also use the --show option to
    view the information in the second field of passwd.Execute commands such asunder:
    ￼root@exampleserver:～# john --show cracked￼From the output information, you can
    see that the second field of the root user in passwd has changed from the original
    password placeholder to the real password. {L-End} ￼Tips: When using John the
    Ripper tool to crack Linux user passwords, you must operate on this machine. Moreover,
    the two files /etc/shadow and /etc/passwd must have read permissions.![](Image00003.jpg)![](Image00003.jpg)AfterwordA
    lot of people encouraged me while writing this book. A lot of online communities
