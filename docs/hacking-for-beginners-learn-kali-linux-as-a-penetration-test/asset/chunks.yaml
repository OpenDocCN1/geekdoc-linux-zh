    # 第 2 章：在虚拟机中安装 Kali


    ![](img/Image00002.jpg)


    上一章节对黑客世界进行了很好的介绍。这一章对于挣于创建自己黑客环境的初学者来说是一个重要的资源。众周知实是，黑客在日常任务中始终依赖 Linux。Windows
    和 Mac 是很好的生产力操作系统，但不适合黑客使用。在本章中，我们将深入讨论 Kali（一个著名的黑客 Linux 发行版）的安装。让我们开始吧！


    ## 下载 Linux 镜像

    要在你的计算机上安装 Kali Linux 操作系统，你需要获取系统的镜像文件。为了避免下载过程中出现数据传输错误，建议读者也验证其完整性。


    ### 如何获取 Kali Linux 镜像？

    在获取镜像之前，用户需要对 Kali Linux 系统的镜像有一个简单的了解，例如它的版本、架构、桌面类型。然后，我们需要选择下载合适的镜像来安装到系统中。


    1) **镜像类型**：Kali Linux 官方提供两个镜像文件，一个是稳定发布版，另一个是每周更新版。在这两者之间，稳定版通常经过了充分测试，更方便使用。每周更新版的优势是其中包含的工具都是最新版本。但它的缺点是测试不足，可能存在不稳定的风险。


    2) **数字的区别**：Kali 官方网站提供了 `i386` 和 `amd64` 架构的镜像。其中，`i386`意味着支持 32 位架构的镜像，`amd64`意味着支持
    64 位架构的镜像。因此，在下载镜像文件时，用户需要根据自己的系统架构选择相应的镜像文件。

    要检查自己的系统架构，Windows 用户可以使用控制面板，Mac OS 用户可以在系统偏好设置中检查。

    **注意**：记住 64 位架构可以同时支持 32 位和 64 位镜像。而 32 位架构只能支持 32 位支持镜像。


    3) **桌面类型**：Kali Linux 官方网站提供了 6 种桌面镜像。它们分别是 GNOME、X17、KDE、MATE、XFCE 和 LXDE。其中，Gnome
    是最常用且易用的桌面环境，因此我们建议你选择 Gnome 桌面来提高你的黑客专业知识。不过，请随意尝试不同的版本，并选择一个你觉得舒服的。


    4) **下载镜像**：在用户对 Kali Linux 官方网站提供的所有可用镜像文件有了清晰了解后，可以选择所需的文件进行下载。这里是编写时 Kali Linux
    下载页截图。


    ### 验证 Kali Linux 镜像

    由于安装镜像文件通常较大，文件在下载过程中可能会损坏或不完整。如果镜像文件损坏或不完整，安装过程中可能会出错。为了避免这些尴尬的情况，用户可以使用验证工具进行验证。有几个网站可以检查
    Linux 文件的真实性。


    找到值后，比较并验证获取的值与镜像文件提供的值是否相同。如果相同，则确认镜像文件已完全下载。如果不相同，则是不完整的，可能充满了隐藏的恶意软件。我们建议你从官网重新下载。


    在下一节，我们将讨论如何在虚拟机中安装 Kali Linux。


    ## 虚拟机安装

    虚拟机指的是通过软件模拟获取具有完整硬件系统功能并在隔离环境中运行的完整计算机系统。对于初学者来说，如果你直接在物理机上安装操作系统，可能会导致系统崩溃或发生数据丢失。因此，为了不仅学习安装系统，而且避免数据丢失，使用虚拟机是更好的方法。市场上上有几十种虚拟机软件。其中，`VirtualBox`
    和 `VMware` 是 Windows 可用的两种著名的虚拟机软件。我个人认为 `VMware` 虚拟机简单且更容易操作。我建议用户使用这种虚拟机软件。


    下一节将介绍如何使用 VMware 安装和创建 Kali Linux 虚拟机。


    ### 获取 VMware 软件

    如果你想安装 VMware 软件，你需要从其官方网站获取安装包。它有免费版和高级版。

    访问并下载最新版本的 VMware 软件。[请点击此处](http://www.vmware.com/products/workstation/workstation-evaluation)


    在浏览器中访问此地址后，将出现下载界面。从该界面你可以看到 `VMware Workstation Pro` 产品，它可以在 Windows 和 Linux
    下使用。在本例中，我们选择下载 Windows 软件，因此点击 Workstation 15 Pro for Windows 的“Download Now”按钮，VMware
    安装包将开始下载。下载完成后，软件包命名为 `VMware-workstation-full-15.0.3-versionnumber.exe`。


    ### 安装 VMware

    下载 VMware 软件安装包后，用户可以将软件安装到系统中。下节将介绍如何在 Windows 中安装 VMware 软件。

    安装 VMware 的具体步骤如下：

    1) 双击下载的安装包以进入欢迎对话框。

    2) 该对话框显示安装 VMware Workstation 的欢迎消息。点击“Next”按钮进入“End User License Agreement”。

    3) 该对话框显示用户许可协议。勾选“I accept the terms in the license agreement”并点击“Next”。

    4) 你可以自定义 VMware 的安装位置。默认情况下，安装在 `C:\Program Files(x86)\VMware\Workstation` 目录。

    5) 对话框显示用户体验设置，默认启用启动检查。点击“Next”。

    6) 对话框显示快捷方式位置，默认在“Desktop”和“Start Menu”文件夹中创建。点击“Next”。

    7) 此时完成基本设置。点击“Install”按钮开始安装。安装完成后，将显示完成对话框。

    8) 从该对话框看到 VMware Workstation Pro 已安装。由于 Workstation Pro 不是免费版本，在使用前需要输入密钥。点击对话框中的“License”，显示输入
    License Key。

    9) 在对话框中输入密钥后，点击“Enter”，显示完成对话框。

    10) 如你所见，VMware 安装向导已完成。点击“Finish”。


    ### 创建虚拟机

    如果用户想在 VMware 中安装操作系统，需要首先创建一个虚拟机来模拟硬件功能。创建 Kali Linux 虚拟机时，建议内存不小于 2GB，磁盘大小应不少于
    20GB。


    创建 Kali Linux 虚拟机的具体步骤：

    1) 启动虚拟机。启动后将显示设置界面。

    2) VMware 的主界面非常简单。用户可以通过点击界面上的“Create a new virtual machine”创建虚拟机，也可以在菜单栏中选择“File
    (F)” | “New Virtual Machine (N)”。点击按钮后将显示“New Virtual Machine Wizard”。

    3) 选择虚拟机类型。提供两种方法：“typical (recommended) (T)”和“custom (C)”。区别在于第一种相对简单，第二种需要手动设置硬件兼容性、处理器等。如果你是新手，建议使用“typical
    (recommended) (T)”。点击“Next”，显示安装源。

    4) 在对话框中选择源。选择“Install the operating system (S)”选项，点击“Next”，显示“Select Guest System”。

    5) 该对话框用于选择操作系统和版本。在本例中，正在创建基于 Debian 的操作系统。因此选择了 `Linux` 操作系统，版本选择了 `Debian 9.x
    64-bit`。点击“Next”，显示“Name Virtual Machine”。

    6) 对话框要求为虚拟机创建一个名称并设置安装位置。设置后点击“Next”，显示“Specify Disk Capacity”。

    7) 设置磁盘容量。渗透测试的用户在进行密码破解时通常会有大型字典。如果字典太大，会占用大量空间。为了以后更新，建议磁盘容量设大一点。在本例中我们选择 100GB
    并点击“Next”。

    8) 下一个对话框显示新创建虚拟机的详细信息。点击“Finish”。


    ### 安装操作系统

    现在我们在之前创建的虚拟机中安装 Kali Linux 操作系统。安装操作系统之前，建议修改其运行内存和处理器。如果内存太小，某些程序将无法运行。此外，你还需要手动加载镜像文件。


    安装 Kali Linux 的具体步骤：

    1) 打开之前创建的虚拟机，显示详情界面。

    2) 点击“Edit Virtual Machine Settings”选项，或者在菜单栏中选择“Virtual Machine” | “Settings”。

    3) 在“Hardware”选项卡中，你可以设置内存、处理器和适配器的细节。在本例中内存设置为 2GB。选择 `CD/DVD` 选项加载系统镜像文件。点击“OK”。

    4) 此界面是安装指南。你可以选择“Graphical install (graphical interface)”选项并按 `Enter` 键。显示语言选择对话框。

    5) 在对话框中选择安装语言，这里选择“English”。点击“Next”。

    6) 在对话框中选择用户所在的区域。这里选择“USA”。点击“Continue”。

    7) 选择默认键盘格式“English”，然后点击“Next”。

    8) 过程中将加载一些额外组件。网络配置成功后，将显示主机名对话框。

    9) 设置主机名为 `example`，点击“Continue”。

    10) 对话框用于设置域名。如果用户不需要设置，使用默认域名并点击“Continue”。

    11) 对话框用于设置 root 用户密码。为了安全，建议设置复杂密码。设置后点击“Continue”。

    12) 对话框用于选择分区方法。这里选择“Entire Disk”并点击“Continue”。

    13) 选择磁盘分区。建议至少设置 20GB 根分区。

    14) 对话框显示分区方案。选择“Place all files in the same partition (recommended for novices)”并点击“Continue”。

    15) 对话框显示当前分区。有两个区域：根分区和交换分区。如果用户想修改当前分区，选择“modification of partition”。如果不修改，选择“End
    Partition and write to disk”。点击“Continue”。

    16) 对话框提示是否写入磁盘。这里选择“Yes”按钮并点击“Continue”。

    17) 此时系统开始安装。需要设置一些信息，如设置镜像。如果安装 Kali Linux 时连接网络，选择“No”。为了让用户顺利安装操作系统，建议选择“No”按钮。点击“Continue”。系统安装后用户也可以手动配置软件源和更新管理器。

    18) 如果用户选择网络镜像，将弹出带有额外细节对话框。可以在对话框中设置代理。如果不需要连接网络，点击“Configure Manager”。

    19) 软件包配置完成后，将显示“Install GRUB to hard disk”。

    20) 对话框提示是否将 GRUB 安装到主引导记录。选择“Yes”单选框并点击“Continue”。

    21) 对话框用于设置安装引导加载器的设备。从显示信息来看只有一个 `/dev/sda` 设备。因此这里将 GRUB 安装到 `/dev/sda`。点击“Continue”。

    22) 引导加载器安装完成后，将显示“End Installation Process”。

    23) 从对话框可以看到操作系统已安装。立即需要重启操作系统。点击“Continue”结束安装过程并重启操作系统。

    24) 系统启动后将显示登录对话框。

    25) 输入登录系统的用户名。输入 `root` 并点击“Next”，显示密码输入框。

    26) 在对话框中输入安装时设置的超级用户 root 密码。点击“Login”。登录成功后将看到详情界面。看到此界面意味着 root 用户已成功登录系统。


    # 第 3 章：在物理机上安装 Kali


    ![](img/00002.jpg)


    虽然虚拟机很流行，但由于各种原因，大多数黑客并不使用它们。显而易见，理解物理机安装 Kali Linux 同样重要。为了方便理解，我们包含了一个单独章节。


    ## 为什么需要物理机安装？

    大多数用户觉得虚拟机中的操作不是真实的。如果你想体验使用物理机实现渗透测试的感觉，你需要在物理机上安装 Kali 操作系统。


    ## 制作 USB 安装盘


    ### 安装 Win32DiskImager 工具

    `32DiskImager` 工具主要用于将 `.img` 文件写入 SD 卡或 USB 卡。对于大多数人来说，现在的电脑没有光驱。因此，使用 U 盘安装操作系统是最方便快捷的方法。如果你想用
    U 盘安装系统，需要先使用该工具。


    具体步骤如下：

    1) 从 `https://sourceforge.net/projects/win32diskager/` 下载软件包。软件包命名为 `win32diskager-1.0.0-install.exe`。

    2) 安装 `Win32DiskImager`。双击下载的软件包进入许可对话框。

    3) 对话框显示许可信息。选择“I accept the terms in the license agreement”按钮并点击“Next”。

    4) 对话框用于选择安装位置。默认安装在 `C:\Program Files(x86)\Writer`。如果用户想重新指定位置，点击“Change”按钮。点击“Next”。

    5) 对话框用于设置文件夹名称。使用默认设置并点击“Next”，显示“Select additional tasks”对话框。

    6) 对话框设置是否创建快捷方式。建议用户创建快捷方式。勾选“Create a desktop icon”框并点击“Next”。

    7) 对话框显示安装前的详细信息。如果需要修改设置，可以点击“Back”按钮。否则点击“Install”按钮开始安装。

    8) 从对话框看到 `Win32Imager` 已安装。点击“Finish”自动启动工具。如果用户不想直接启动工具，取消勾选“Launch Win32Imager”。勾选“View
    README.txt”打开文件。


    ### 制作 USB 安装盘

    通过前面的章节 `Win32DiskImager` 已安装在系统中。现在可以使用该工具制作 USB 安装盘。写入镜像时，U 盘需要格式化。因此需要确保 U
    盘数据备份。具体步骤如下：

    1) 将 U 盘插入系统并启动 `Win32DiskImager`。

    2) 工具自动识别可移动磁盘 `F`。点击按钮导入 Kali 镜像。

    3) 为了确保制作介质没有问题，此处需要验证。从下拉列表中选择 `SHA256` 并点击“Generate”。稍会看到文件的 SHA256 值。如果值与官网提供的一致，镜像文件完成。

    4) 与官网对比生成的值后，点击“Write”按钮。

    5) 对话框提示是否确定写入数据到磁盘 `F`。点击“Yes”开始写入。写入完成后，弹出“success”对话框。

    6) 点击“OK”返回对话框。点击“Exit”退出程序。

    **注意**：写入 Kali 系统镜像后，U 盘分区格式变为 `Ext4`。Windows 无法识别该格式，只需忽略错误消息。


    ## 准备 Kali 硬盘分区

    对于大多数使用 Windows 操作系统的用户，也想体验 Kali Linux 进行渗透测试。在这种要求下，最佳方案是安装双系统。如果不准备硬盘分区，可能会损坏原系统或删除文件。为了安全起见，分开硬盘安装系统是最佳选择。


    ### 设置第一启动

    1) 右键点击桌面上的“此电脑”并选择“管理”。

    2) 在左列选择“存储” | “磁盘管理”。

    3) 从此界面可以看到两个磁盘：`Disk 0` 和 `Disk 1`。此外，两个磁盘只有一个分区：`C` 和 `E`。

    4) 右键点击 `E` 并选择“新建卷”。设置大小为 `102400` MB（约 100GB）。

    5) 向导格式化分区。

    6) 处理后可以看到 `Disk 1` 已分区。


    ### 设置 USB 设备为启动项

    1) 启动电脑进入 BIOS 界面。注意：如果是物理机，需要按 `F2`、`F12` 或 `Del` 键（不同型号不同）。

    2) 选择“Enter Setup”进入 BIOS 主菜单。

    3) 使用右箭头切换到 `Boot` 标签。

    4) 对话框中有四个选项：`Removable Devices`、`Hard Drive`、`CD-ROM Drive` 和 `Network boot from
    Intel`。使用 `+` 键将 `Removable Devices` 移动到第一位。

    5) 切换到 `Exit` 标签并选择“Exit Saving Changes”。

    6) 对话框提示是否保存。点击“Yes”。

    7) 系统重启并从 U 盘启动。

    **提醒**：所有新电脑都带有 UEFI 固件，并启用了 `Secure Boot` 功能。此功能将拒绝启动未经过 UEFI 签名的操作系统。主板厂商通常允许用户关闭
    `Secure Boot` 或向 UEFI 添加自定义公钥以绕过此限制。


    ### 设置硬盘分区

    如果用户直接在没有数据的计算机上安装操作系统，无需考虑数据丢失。但如果你正在安装双系统，需要选择正确的格式选项。


    #### 如何自动分区系统？

    1) 当双系统准备在物理机上安装时，将显示对话框。

    2) 选择“使用最大空闲空间”。会自动选择并分区空闲空间。

    3) 点击“继续”。显示分区方案对话框。

    4) 选择“将所有文件放在同一个分区（建议新手使用）”并点击“继续”。

    5) 自动创建分区：`swap` 和 `root`。#### 如何手动分区操作系统？

    1) 选择“手动”选项。

    2) 从此界面看到硬盘：`sda` 和 `sdb`。

    3) 选择 `sdb` 上的“未分配空间”并点击“新建分区”。

    4) 为 `swap` 分区设置大小为 `2GB`。

    5) 选择“逻辑分区”并点击“下一步”。

    6) 点击“开始”创建分区。

    7) 对于 `root` 分区，将挂载点设置为 `/`，文件系统设置为 `Ext4`。

    8) 选择“交换”选项并点击“继续”。

    9) 为 `swap` 分区设置大小为 `2GB`。

    10) 对于剩余空间，创建 `root` 分区。

    11) 分区已完成：`swap` 和 `root`。

    12. 选择“分区完成后”完成。

