    corresponding report file.What Next?With this we have mastered the art of scanning
    vulnerabilities. In the next chapter, we will start to discuss about Man-in-the
    middle attacks also known as sniffing attacks technically. Follow along!Chapter
    22Understanding Sniffing![](Image00005.jpg)Sniffing is an important skill that
    needs to be understood by hackers and network administrators. In a network when
    packets can be accessed by anyone there is a lot of chance for stealing your sensitive
    information if they are not encrypted. These attacks are casually called by hackers
    as Man-in-the-middle attacks. When considered casually as a low risk by tech says
    , it is still a major reason for hackers to easily obtain passwords and credit
    card information from public spaces and hotspots. In this chapter, we will help
    you understand the procedure of Sniffing in detail with excellent instructions.
    Follow along!Man-in-the-middle attackMan-in-the-Middle Attack, referred to as
    MITM attack, is an "indirect" intrusion attack. This attack mode is to virtually
    place a computer controlled by an intruder between two communicating computers
    in the network connection through various technical means. This computer is often
    referred to as a "man in the middle".Working principleMan-in-the-middle attacks
    have long been a common attack method used by hackers, and they have been spread
    to this day. Among them, the most typical man-in-the-middle attack methods are
    ARP spoofing and DNS spoofing. To put it simply, a man-in-the-middle attack is
    to intercept normal network communication data and perform data tampering and
    sniffing, while the communicating parties are unaware.Here we will take ARP spoofing
    technology as an example to introduce the working principle of man-in-the-middle
    attacks. In general, ARP spoofing is not to make the network unable to communicate
    normally, but to pretend to be a gateway or other host so that the data flow to
    the gateway or host is forwarded through the attacking host. By forwarding the
    traffic, you can control and view the traffic, thereby obtaining traffic or obtaining
    confidential information.How does it work?When communicating between host A and
    host B, if host A does not find the MAC address of host B in its ARP cache table,
    host A will send an ARP broadcast to all computers in the entire LAN. The computer
    will receive the data. At this time, host C responds to host A, saying that I
    am host B and my MAC address is XX-XX-XX-XX-XX-XX. Host A will update its cache
    table after receiving the address. When host A communicates with host B again,
    the data will be sent to the attacking host (host C), and host C will forward
    it to host B after receiving it.Implementing a man-in-the-middle attackOnce the
    user has a clear understanding of the principle of a man-in-the-middle attack,
    he can implement a man-in-the-middle attack. The following section will introduce
    the use of arpspoof and Ettercap to implement man-in-the-middle attacks.1) Use
    arpspoof toolarpspoof is a professional ARP spoofing tool that can directly spoof
    the gateway, making all computers accessing the network through the gateway be
    spoofed. Through ARP spoofing, the purpose of man-in-the-middle sniffing and capturing
    data packets can be achieved, and the data in transmission can be replaced. The
    following section will introduce the method of using the arpspoof tool to implement
    ARP attacks.The syntax format of the arpspoof tool is as follows: ￼arpspoof [options]
    hostThe options and meanings supported by the tool are as follows: ·-I interface:
    Specify the interface used. ·-T target: Specify the target of ARP spoofing. If
    not specified, all hosts in the LAN will be deceived. ·-R: Implement two-way deception.
    This option needs to be used with the -t option to be effective. ·Host: Specify
    the host you want to intercept the packet,Usually the local gateway.The specific
    steps to attack using arpspoof tool are as follows:1) Turn on routing and forwarding.The
    execution command is as follows: ￼root@exampleserver:～# echo 1> /proc/sys/net/ipv4/ip_forward￼Seeing
    the above output information, it means that routing and forwarding has been successfully
    turned on. If the user does not enable routing and forwarding, the target host
    cannot access the network.2) View the IP address and ARP cache table of the attacking
    host.First check the IP address as follows: ￼root@exampleserver:～# ifconfig￼From
    the output information, you can see that the IP address of the attacking host
    is 192.168.29.134, and the MAC address is 00:0c:29:79:95:9e.Next, check its ARP
    cache table as follows: ￼root@exampleserver:～# arpFrom the output information,
    we can see that there is only one gateway ARP record in the attacking host. Moreover,
    the MAC address of the gateway is 00:50:56:f1:40:cb.3) Check the IP address and
    ARP cache table of the target host.First check the IP address of the target host
    as follows: ￼root@exampleserver:～# ifconfigFrom the output information, we can
    see that the IP address of the target host is 192.168.29.135, and the MAC address
    is 00:0c:29:6c:5d:69.Next, check the ARP cache table as follows: ￼root@exampleserver:～#
    arpAs you can see from the output information, there is also only one ARP entry
    bound to the gateway. By looking at the address information, it can be determined
    that the attacking host has not communicated with the target host. At this time,
    as long as the two hosts communicate, they will request each other''s IP and MAC
    addresses. At this time, ARP attacks can be implemented on it.4) Implement ARP
    attacks on the target host.The execution command is as follows: ￼root@exampleserver:～#
    arpspoof -i eth0-tIt can be seen from the output information that the attacking
    host is sending an ARP response packet to the target host, telling the target
    host that the MAC address of the gateway is 00:c:29:79:95:9e (the attacking host''s
    MAC address). However, the MAC address of the gateway is actually 00:50:56:f1:40:cb.
    This shows that ARP spoofing has begun on the target host.5) Implement ARP attacks
    on the gateway.The execution command is as follows: ￼root@exampleserver:～# arpspoof
    -i eth0-tIt can be seen from the output information that the attacking host is
    sending an ARP response packet to the gateway, telling the gateway that the MAC
    address of the target host is 00:c:29:79:95:9e (the MAC address of the attacking
    host). However, the actual MAC address of the target host is 00:0c:29:6c:5d:69\.
    It can be explained that ARP spoofing has been implemented on the gateway.￼Reminder:
    Users can also perform ARP attacks on the target host and gateway at the same
    time with one command.The execution command is as follows: ￼root@exampleserver:～#
    arpspoof -i eth0-t 192.168.29.135-rFrom the output information, we can see that
    the attacking host sent ARP response packets to the target host and the gateway,
    telling the gateway and the target host that their MAC addresses are 00:c:29:79:95:9e.6)
    Check the ARP cache table of the target host as follows: ￼root@exampleserver:～#
    arp￼From the output information, you can see the two ARP records in the host (the
    ARP entries of the gateway and the attacking host). From the displayed ARP entry,
    you can see that the MAC address of the gateway and the attacking host are the
    same. This shows that the target host was successfully spoofed by ARP.2) Use Ettercap
    toolEttercap is a network sniffing tool based on ARP address spoofing, mainly
    suitable for switching local area networks. The following section will introduce
    the method of using the Ettercap tool to implement a man-in-the-middle attack.The
    specific steps are as follows:1) Start the Ettercap tool.The execution command
