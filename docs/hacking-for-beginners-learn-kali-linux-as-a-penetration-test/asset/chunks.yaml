    # Chapter 5 Settings Panel in Kali


    ![](Image00002.jpg)


    In the previous chapter we have learned about the importance of various Kali Linux
    features with detailed explanations. This chapter provides in depth-understanding
    about the Settings panel and the networking features that need to be understood
    by an average user.


    ## Settings Panel

    The "Settings" panel can be used to set the system, such as setting the resolution,
    power supply, background colour, network connection, etc. To implement operations
    in some systems, these basic settings are essential. This section will introduce
    the "Settings" panel of Kali Linux.


    ### Launch the Settings panel

    1) Click the display application button in the favourites folder, and all applications
    will be displayed.

    2) Click the setting button on this interface to open the "Settings" panel.

    3) You can see all the setting items from the left column of the dialog box. After
    the user selects the setting item, the corresponding setting can be made in the
    right column. For example, set the power supply. Select the `Power` setting item
    in the left column, and set the time of "Blank Screen (B)" and "Auto Suspend (A)"
    in the right column. In order to facilitate the user to set up the Kali Linux
    system, all the setting items and corresponding settings are listed here.


    ## Configure the network

    To implement penetration testing, you need to be connected to the network. Before
    implementing penetration testing, you need to configure the network. Users can
    use wired networks, wireless networks and VPNs to connect to the network. This
    section will introduce these three network configuration methods.


    ### Configure wired network

    Wired network is a computer network connected by coaxial cable, twisted pair and
    optical fiber. Simply put, it is a computer network connected by a network cable,
    which is commonly referred to as `Ethernet`. The wired Internet is relatively
    stable. If users need to download some relatively large files or update the system,
    it is then recommended to use a wired network. In Kali Linux, users can use commands
    or graphical interfaces to configure the wired network.


    #### 1) `ifconfig` command to view the existing network configuration

    Before configuring the network, first check the existing network configuration.
    If the network is already configured, there is no need to configure it again.
    If it is not configured, then the user needs to configure it manually.

    Use the `ifconfig` command to view the existing network configuration as follows:


    ```

    root@exampleserver:～# ifconfig

    ```

    This will display a lot of information about the wired network. We recommend you
    to save an image of this information for future reference of the target you are
    attacking. It is also useful when you are targeting a wireless network.


    #### Graphical interface settings

    The graphical interface settings are relatively intuitive and easy to operate.
    The following section will introduce the method of setting the wired network on
    the graphical interface.

    The specific steps to configure the wired network are as follows:

    1) Open the "Settings" panel and select the "Network" setting item, the dialog
    box will be displayed.

    2) As you can see from this dialog box, the wired network is not connected. At
    this time, click the setting button and the dialog box will be displayed.

    3) From the dialog box, you can see that it contains 5 labels, which are detailed
    information, identity, `IPv4`, `IPv6`, and security. Here mainly configure the
    options in the `IPv4` label. After setting, you can see the obtained network information
    in the "Details" tab. Select the `IPv4` tab, and the dialog box will be displayed.

    4) Set the method of obtaining `IPv4` address in this dialog box. There are 4
    methods provided here, namely automatic (DHCP), manual, local link only, and `Disable`.
    Among them, the "auto (DHCP)" option means that the DHCP server will automatically
    assign an IP address to the current host. The "manual" option means that the user
    needs to manually set the IP address, subnet mask and gateway. The "local link
    only" option is only used Local connection when it is unable to access the Internet.
    `Disable` option means to disable the `IPv4` address. If you want to access the
    Internet, you must use both automatic (DHCP) and manual methods. For ease of use
    and faster operation, "Auto (DHCP)" is the best choice. If the user wants to fix
    the current computer address, he can select the "Manual" radio button so that
    the dialog box will be displayed.

    5) In this dialog box, you can manually specify the IP address, subnet mask, gateway,
    DNS, and routing information to prevent users from failing to access the Internet
    due to configuration errors. It is recommended to only set the IP address and
    subnet mask. After setting, click the "Apply (A)" button in the upper right corner
    to return to the network setting dialog box.

    6) At this time, the wired network configuration is complete. But the interface
    has not been activated yet. Therefore, users need to activate the interface before
    they can obtain the assigned IP address and then access the Internet. Click the
    start button in this dialog box to connect to the wired network.

    7) From this dialog box, you can see that the status of the wired network is "Connected".
    This shows that the wired network configuration is successful. At this point,
    you can see the acquired address information in the "Detailed Information" tab.

    8) From this dialog box, you can see the wired network speed, `IPv4` and `IPv6`
    address, hardware address, default route and DNS information. Be sure to select
    the "Automatic connection (A)" check box on this interface. Otherwise, you cannot
    automatically connect to the network after restarting the computer. By default,
    the "Auto Connect (A)" box is selected.


    #### Command line settings

    It is also very simple to configure the network using the command line, and the
    configuration can be completed with a few commands. The network configuration
    file of Kali Linux is `/etc/network/interfaces`. Use the `VI` editor to edit interfaces
    file. The default content of the file is as follows:


    ```

    root@exampleserver:～# vi /etc/network/interfaces

    ```

    This file describes the network interfaces available on your system and how to
    activate them. As can be seen from above information, only `lo` interface is configured
    by default. If you want to configure a wired network, add the information of the
    Ethernet `eth0`. Similarly, users can set to obtain an IP address dynamically
    or assign IP address statically (manually). For example, the following will set
    up the wired network of interface `eth0`. The method of dynamically obtaining
    an IP address is as follows:


    ```

    auto eth0

    iface eth0 inet dhcp

    ```

    The method of statically assigning an IP address is as follows:


    ```

    auto eth0

    iface eth0 inet static

    ```

    Users can choose a method that suits them. After the setting is complete, save
    and exit the interfaces file. Next, the user needs to restart the network service
    to make the configuration take effect. The execution command is as follows:


    ```

    root@exampleserver:～# service networking

    ```

    After executing the above command, the user can use `ifconfig` to view address
    information.


    ### Configure wireless network

    Wireless network refers to any form of radio network. The computer needs to connect
    to the network through wireless network card. If the user has Kali Linux installed
    in a virtual machine and wants to connect to a physical network, he can use wireless
    network card to connect. The specific steps to configure a wireless network are
    as follows:

    1) Determine whether your host has a wireless network card. If there is no wireless
    network card, you can use USB network card. Insert USB network card into the host,
    and use `lsusb` to check whether the wireless network card is successfully identified.
    The execution command is as follows:


    ```

    root@exampleserver:～# lsusb

    ```

    2) Use `ifconfig` command to check whether the wireless network interface is activated:


    ```

    root@exampleserver:～# ifconfig

    ```

    At this point, the user can use `ifconfig -a` to view all interfaces. After executing
    the above command, if you see `wlan0` interface, it means the network card is
    successfully identified. The user needs to use the following command to activate
    the network card:


    ```

    root@exampleserver:～# ifconfig wlan0 up

    ```

    After executing the above command, there is output information. In order to judge
    whether the wireless network card is successfully activated, the user can use
    `ifconfig` again.

    3) In the graphical interface of Kali Linux, click the button in the upper right
    corner, and a menu will pop up.

    4) From this menu, you can see commands such as "Wired Connected", "Wi-Fi Not
    Connected", and "Agent None". Select the "Wi-Fi not connected" option, and the
    sub for related settings will pop up.

    5) Select the "Select Network" command to see all searched Wi-Fi networks.

    6) In the dialog box, you can set the Wi-Fi network to be connected. For example,
    connect to the `Test` wireless network. First select `Test` wireless network,
    and then click the "Connect" button, a dialog box will pop up.

    7) Enter the authentication password of the wireless network `Test` in this dialog
    box, and then click the "Connect" button. If the connection is successful, you
    can see the connected network name.


    The above method is when the SSID name of the wireless AP is broadcasted and the
    user can connect directly. In many cases, users may hide their SSID for security.
    At this time, the user cannot see Wi-Fi network in the searched signal. So the
    user needs to manually add and connect the wireless network. The specific steps
    to connect to a hidden network are as follows:

    1) Use `ifconfig` command to confirm that your wireless network card has been
    activated.

    2) Select the "Wi-Fi" option to open the dialog box. Click the list button in
    the upper right corner.

    3) As you can see from this dialog box, there are 3 options for connecting to
    hidden networks, turning on hotspots (Turn On Wi-Fi Hotspot), and known Wi-Fi
    Networks (Known Wi-Fi Networks). Here, click the "Connect to hidden network (C)..."
    button, and the dialog box will pop up.

    4) After entering the hidden Wi-Fi network information in this dialog box, click
    the "Connect" button to connect to the hidden network. Among them, Network name
    is used to specify the network name, and Wi-Fi security is used to specify the
    encryption authentication method of the wireless network. By default, the system
    provides 6 authentication methods, namely `WEP40/128-bit key (hexadecimal or ASCII)`,
    `WEP 128-bit pass phrase`, `LEAP`, `Dynamic WEP (802.1x)`, `WPA` and `WPA2 personal`,
    `WPA` and `WPA2 enterprises`. When the user selects any encryption method, a corresponding
    password text box will pop up. In this example, the name of the connected wireless
    network is `Test`, and the encryption authentication method is `WPA-PSK/WPA2-PSK`.

    5) After entering the hidden network information to be connected in this dialog
    box, click the Connect button to connect to the corresponding network.


    ## Configure VPN network

    VPN is called as a virtual private network, which belongs to remote access technology.
    Simply put, it is to use a public network to set up a private network for encrypted
    communication. The following section will introduce the method of setting up a
    VPN proxy network in Kali Linux.


    ### 1) Install the software package for VPN configuration

    After the Kali Linux operating system is installed, the VPN configuration is needed.
    The following section will introduce the method of setting up a VPN proxy network
    in Kali Linux. To implement operations, you need to install the software. Use
    the following command:


    ```

    root@exampleserver:～# apt-get install openvpn

    ```

    After executing the above command, there is output information. In order to judge
    whether the VPN network is successfully activated, the user can use the following
    command. After the setting is complete, save and exit the configuration file.
    Next, the user also needs to restart the network service to make the configuration
    take effect. The execution command is as follows:


    ```

    root@exampleserver:～# service networking restart

    ```

    After executing the above command, no information will be output. At this point,
    the user can use `ifconfig` to view address information.

