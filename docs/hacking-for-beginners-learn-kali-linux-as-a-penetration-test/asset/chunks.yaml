    supported system the `.deb` format is selected here along with the 64-bit architecture
    package. After selecting and clicking the installation package on the download
    page, a dialog box for accepting the license agreement will pop up.


    3. **Click the "I Agree" button to accept the license agreement.** At this point,
    the installation package will start to download. If all goes well within next
    few minutes, you can install the `Nessus` tool.

    The execution command is as follows:

    ```

    root@exampleserver:～# dpkg -i Nessus-Versionname-debian6_amd64.deb

    ```

    This command will compile the `.deb` file and will start the `Nessus` server in
    the system. You can then start `Nessus Scanner` by typing the following code on
    the Linux terminal:

    ```

    /etc/init.d/nessusd start

    ```

    Then go to `https://exampleserver:8834/` to configure your scanner according to
    your requirements. If all goes well you will observe an output information indicates
    that the `Nessus` software package is installed successfully. `Nessus` is usually
    installed in the `/opt/nessus` directory by default. It can be seen from the above
    output information that the user can enter `https://exampleserver:8834/` in the
    browser to access the `Nessus` service and perform vulnerability scanning. Remember
    that you need to replace your system user name at the "example server" instance.


    4. **Start the Nessus service.**

    After installing the `Nessus` service, it is not started by default. Therefore,
    if you want to use this program to perform scanning, you must first start the
