- fmt: "\n# Add software source\n\nAfter the user has a clear understanding of the\
    \ concept and format of the software source, the software source can be added.\
    \ The following section will introduce the official software sources and commonly\
    \ used third-party software sources in the Kali Linux system.\n\n## 1) Official\
    \ software source\nKali Linux official sources and software sources redirected\
    \ by the official are usually relatively stable. However, the speed is not said\
    \ to be necessarily fast. Among them, the official source of Kali is as follows:\n\
    \n`deb http://http.kali.org/kali kali-rolling main non-free contrib`\n\n## 2)\
    \ Commonly used third-party software sources\nSince the official source of Kali\
    \ is a foreign website, domestic users may experience network instability when\
    \ using it, which may result in a failure to install the software package. Moreover,\
    \ the download speed is still relatively slow. At this time, the user can try\
    \ to add a third-party software source. A lot of mirrors are available for different\
    \ countries and locations. You can find list of third-party sources available\
    \ by doing a quick google search. Also, you can use torrent to distribute the\
    \ Linux image file. It is not illegal in anyway and can help you download the\
    \ softwares fastly.\n\n## 3) Choice of HTTP and HTTPS\nFor safety reasons, these\
    \ software sources currently support the `HTTPS` protocol. To use the software\
    \ source of the `HTTPS` protocol, you only need to change the `http` in the URL\
    \ address to `https`.\n\n`deb https://http.kali.org/kali kali-rolling main non-free\
    \ contrib`\n\n`HTTPS` is slow in downloading software due to encryption problems.\
    \ However, the influence of the cache server can be avoided. Therefore, if the\
    \ user fails to download the software due to the cache server when installing\
    \ the software, the software can be reinstalled by modifying the software source\
    \ to `HTTPS`.\n\n## 4 deb-src software source\nSome software does not provide\
    \ binary packages but only provides source code. For this kind of software, the\
    \ software source of `deb-src` must be added. After downloading, it will automatically\
    \ compile and generate executable files on the user's computer. Among them, the\
    \ `deb-src` software source format is as follows:\n\n`deb-src http://http.kali.org/kali\
    \ kali-rolling main non-free contrib`\n\n# Update software source/system\nAfter\
    \ the user configures the software source, he needs to use the `apt-get update`\
    \ command to update the software source to make the configuration effective. Users\
    \ can also update the system quickly by updating the software source. The following\
    \ section will introduce the method of updating the software source and updating\
    \ the system. The execution command is as follows:\n\n```bash\nroot@exampleserver:～#\
    \ apt-get update\n```\n\nIt can be seen from the above output that the software\
    \ source has been successfully updated. The execution command is as follows:\n\
    \n```bash\nroot@exampleserver:～# apt-get dist-upgrade R\n```\n\nThe updated package\
    \ information is displayed in the above output information, including the package\
    \ to be upgraded, the newly installed package, and the uninstalled package. At\
    \ this point, enter `Y` to continue the operation. If there is no error message\
    \ during the subsequent operation, the system update will be successful. After\
    \ the update is completed, restart the system, that is, reload the new system.\n\
    \nUsers can also use the graphical interface to update the operating system. The\
    \ specific steps are as follows:\n\n1. Click the `Show all programs` button in\
    \ the favorites on the left to open the interface of all programs, and click the\
    \ `Software` button to display the dialog box.\n2. From the `Update (U)` tab of\
    \ the dialog box, you can see that there is an update prompt. At this point, click\
    \ the `Operating System Update` option to see the software package that needs\
    \ to be updated.\n3. The software package to be updated is displayed in this interface.\
    \ At this time, click the close button in the upper right corner to return to\
    \ the software update dialog box. Then, click the `Download (D)` button to start\
    \ downloading the updated software package. After the download is completed, the\
    \ dialog box will be displayed.\n4. Click the `Restart and Update` button in the\
    \ upper right corner, so that the `Restart and Install Update` dialog box will\
    \ pop up.\n5. Click the `Restart and Install` button to restart the system and\
    \ update the software package.\n6. This interface shows the update package being\
    \ installed. After the update is completed, the system will automatically restart.\n\
    \n# Install the software from the software source\nAfter the user configures the\
    \ software source, all the software provided in the software source can be installed.\
    \ This section will introduce the software in the installation software source.\n\
    \n## Confirm package name\nWhen users install software, they need to know the\
    \ package name. If you are not sure of its name, you can use several commands\
    \ in Kali Linux to search for the package name. The method of confirming the package\
    \ name is described below.\n\n### What is a software package?\nA software package\
    \ refers to a program or a group of programs with specific functions to accomplish\
    \ specific tasks. The software package consists of a basic component and several\
    \ optional components, which can be in the form of source code or object code.\
    \ In the Linux system, there are two main forms of software packages, namely binary\
    \ packages and source code packages. Among them, the most common binary package\
    \ formats are `deb` (Debian series) and `rpm` (Red Hat series). Source package\
    \ formats are `tar.gz`, `tar.bz2` and `zip`.\n\n### Search software packages based\
    \ on keywords\nIn Kali Linux, users can use the `apt-cache` command to search\
    \ for software packages based on keywords. Among them, the syntax format of the\
    \ command is as follows:\n\n`apt-cache search package_name`\n\nSearch the package\
    \ name based on the keyword `pm-`.\n\n```bash\nroot@exampleserver:～# apt-cache\
    \ search \"pm-\"\nantpm-ANT\n```\n\nFrom the output information, you can see that\
    \ all packages containing the `pm-` keyword have been searched. In the above information,\
    \ the package name and the function of the package are shown respectively. By\
    \ analyzing the package information, the name of the installed package can be\
    \ determined.\n\n### Search for packages according to the command\nKali Linux\
    \ provides a tool `apt-file` that can search for software packages based on commands.\
    \ However, the tool is not installed by default. Therefore, you need to install\
    \ it before using this tool. The execution command is as follows:\n\n```bash\n\
    root@exampleserver:～# apt-get install apt-file\n```\n\nAfter executing the above\
    \ command, if no error is reported, the installation is successful. Next, you\
    \ can use the tool to search for packages based on commands. Among them, the syntax\
    \ format for searching packages is as follows:\n\n`apt-file search [pattern]`\n\
    \nSearch for the software package where `arpsof` is located.\n\n```bash\nroot@exampleserver:～#\
    \ apt-file search arpsof\n```\n\nFrom the output information, you can see the\
    \ software package corresponding to `arpsof` tool is named `dsniff`.\n\n### View\
    \ the package structure\nAfter the user installs a certain software, if they are\
    \ not sure where the software package is installed, they can use the `apt-file`\
    \ command to view the package structure. In addition, users can also confirm whether\
    \ they have the software they need based on included files. The syntax format\
    \ for viewing the package structure is as follows:\n\n`apt-file list [pattern]`\n\
    \nView `dnsenum` software package structure:\n\n```bash\nueba:~# apt-file list\
    \ dnsenum\n```\n\nFrom the output information, you can see the structure of `dnsenum`.\
    \ From the displayed results, we can see that the startup file of `dnsenum` tool\
    \ is installed in `/usr/bin`. We can also know that the help document is in `/usr/share/doc/dnsenum`.\n\
    \n# Install/Update Software\nWhen the user determines the name of the software\
    \ package, it can be installed. Moreover, if a software is already installed in\
    \ the system, the user can also update it. The method of installing and updating\
    \ software is below.\n\n## 1) Install the software\nIn Kali Linux, the `apt-get\
    \ install` command is mainly used to install the software. Among them, the syntax\
    \ format of the command is as follows:\n\n`apt-get install [package_name]`\n\n\
    The following will take `StarDict` software package as an example. `StarDict`\
    \ is a well-known dictionary framework, you can check the meaning of English words.\
    \ Of course, users can also join the dictionary of domestic translation tools,\
    \ such as Oxford dictionary. The execution command is as follows:\n\n```bash\n\
    root@exampleserver:～# apt-get install stardict stardict\n```\n\nAfter executing\
    \ the above command, if no error is reported, the `StarDict` tool is installed\
    \ successfully. At this point, the user can copy the thesaurus files (`.dict`,\
    \ `.idx`, `.ifo`) of other translation tools to `/usr/share/stardict/dic` directory\
    \ and then use the tool.\n\n## 2) Update the software\nIf a certain software has\
    \ been officially updated but the old version is still used in Kali Linux, users\
    \ can update it by reinstalling the software to experience the new features as\
    \ soon as possible. For example, to update the `wpscan` tool, execute the command\
    \ as follows:\n\n```bash\nroot@exampleserver:～# apt-get install wpscan\n```\n\n\
    As can be seen from the above output information, three software packages have\
    \ been upgraded. From the displayed results, we can see that `wpscan` tool has\
    \ been upgraded from the original version 3.4 to 3.5. The above method is only\
    \ to update certain software separately. If the user wants to update all software,\
    \ execute the command as follows:\n\n```bash\nroot@exampleserver:～# apt-get upgrade\n\
    ```\n\nAfter executing the above command, all software packages that need to be\
    \ upgraded in the current system will be upgraded.\n\n## Remove software\nWhen\
    \ the user does not need a certain software, it can be deleted. The syntax format\
    \ used to delete software is as follows:\n\n`apt-get remove [package_name]` #\
    \ uninstall the package\nor\n`apt-get purge [package_name]` # Uninstall and clear\
    \ the package configuration\n\nUninstall the `apt-file` software. The execution\
    \ command is as follows:\n\n```bash\nroot@exampleserver:～# apt-get remove apt-file\n\
    ```\n\nSeeing the above output information means the `apt-file` software has been\
    \ successfully uninstalled.\n\n# Install virtual machine enhancement tools\nIn\
    \ order to facilitate the copying of files between the physical machine and the\
    \ virtual machine, a virtual machine enhancement tool needs to be installed. `open-vm-tools`\
    \ is an enhanced tool for VMware virtual machines. It provides VMware drivers\
    \ to enhance the performance of virtual graphics and hard disks, as well as to\
    \ synchron the clocks of the virtual machine and the host. Only when the `open-vm-tools`\
    \ tool is installed in the VMware virtual machine can the file sharing between\
    \ the host and the virtual machine be realised, and the free drag and drop function\
    \ can be supported. The mouse can also be moved freely between the virtual machine\
    \ and the host (no need to press `Ctrl+Alt` shortcut again). The following section\
    \ describes how to install the virtual machine enhancement tool.\n\nInstall `open-vm-tools`\
    \ in Kali Linux. The execution command is as follows:\n\n```bash\nroot@exampleserver:～#\
    \ apt-get install open-vm-tools-desktop\n```\n\nAfter executing the above command,\
    \ the `open-vm-tools` tool will be installed. After the installation is complete,\
    \ restart the computer. After the computer restarts, users can move, copy, and\
    \ paste files freely between the physical machine and the virtual machine.\n\n\
    # Chapter 7 Third party software Installation in Kali\n![](Image00002.jpg)\nKali\
    \ Linux system installs a lot of penetration testing software by default. However,\
    \ some penetration testing tools are not installed (such as `Nessus`) and need\
    \ to be downloaded and installed from a third party. Generally, the software package\
    \ formats obtained from third parties include `.deb`, `.tar.gz`, `.tar.bz2`, `.zip`,\
    \ and `rar`. In order to meet the needs of users, this section will introduce\
    \ the installation methods of these format software packages.\n\n## Install binary\
    \ software\nThe binary package contains programs that have been compiled and can\
    \ be run immediately. The user only needs to download and unpack (install) it\
    \ before it can be used. In Linux systems, binary software includes two formats,\
    \ `RPM` and `DEB`. Among them, `RPM` is a package manager based on Red Hat distribution\
    \ with suffix `.rpm`, whereas `DEB` is a package manager based on Debian with\
    \ suffix `.deb`. Kali Linux is based on Debian, so its binary package format is\
    \ `.deb`. The following section will introduce the method of installing binary\
    \ packages in Kali Linux. The following section uses `Nessus` software as an example.\n\
    \n1. Download the binary package with the same architecture as your operating\
    \ system. Among them, the download address of `Nessus` is `https://www.tenable.com/downloads/nessus`.\
    \ In this example, the downloaded package is `Nessus-8.3.1-debian6amd64.deb`.\n\
    2. Install `Nessus` tool. The execution command is as follows:\n\n```bash\nroot@exampleserver:～#\
    \ dpkg -i Nessus-8.3.1-debian6amd64.deb\n```\n\nSeeing the above output information\
    \ means the `Nessus` tool has been installed. Next, users can use the tool for\
    \ vulnerability scanning.\n\n## Install source package\nThe source package contains\
    \ the original code of the program, which needs to be compiled by the user to\
    \ generate a runnable program. It takes longer to install software through source\
    \ code. In Linux, the most common source package formats are `.tar.gz` and `.tar.bz2`.\
    \ If you want to install source packages in `.tar.gz` and `.tar.bz2`, you need\
    \ to use the `tar` command to decompress, then configure and install. The syntax\
    \ format for decompressing `.tar.gz` source package is as follows:\n\n`tar zxvf\
    \ source package file [-C target directory]`\n\nThe syntax format for decompressing\
    \ `.tar.bz2` source package is as follows:\n\n`tar jxvf source package file [-C\
    \ target directory]`\n\nIn the above syntax, `-C target directory` is used to\
    \ specify the decompression location. If not specified, it will decompress to\
    \ the current directory by default. The following section will take the automated\
    \ man-in-the-middle attack tool as an example to demonstrate the installation\
    \ method of `.tar.gz` format source package.\n\n1. Go to the website `http://code.google.com/p/subteruge/downloads/list`\
    \ to download `subteruge`. The package name is `subteruge_packages.tar.gz`. Then\
    \ copy the downloaded package to the Kali system.\n2. Unzip the downloaded software\
    \ package. The execution command is as follows:\n\n```bash\nroot@exampleserver:～#\
    \ tar zxvf subteruge_packages.tar.gz\n```\n\nAfter successfully decompressing\
    \ `subteruge` package, all files will be decompressed into the `subteruge` directory.\n\
    3. Install `subteruge` tool. The execution command is as follows:\n\n```bash\n\
    root@exampleserver:～# cd subteruge\nroot@dueba:～/subteruge# python install.py\n\
    ```\n\nAfter executing the above command, the interface will be displayed.\n4.\
    \ Select the `Install With Dependencies` radio button in this interface, and then\
    \ click the `Install` button to install. After the installation is complete, the\
    \ interface with additional settings will be displayed.\n5. From this interface,\
    \ you can see a small dialog box pops up, showing that `subteruge` installation\
    \ is complete. At this point, click the `Finish` button to complete the installation.\n\
    \nThe following section will take Firefox browser as an example to demonstrate\
    \ the installation of software package in `.tar.bz2` package format.\n\n1. Download\
    \ the Linux version of Firefox software package. In this example, the downloaded\
    \ package name is `Firefox-latest-x86_64.tar.bz2`. Tip: When downloading the Firefox\
    \ software package, you must choose according to the user's hardware architecture.\
    \ In this example, the 64-bit architecture package is downloaded.\n2. Unzip the\
    \ software package. The execution command is as follows:\n\n```bash\nroot@exampleserver:～#\
    \ tar jxvf Firefox-latest-x86_64.tar.bz2 -C /usr\n```\n\nAfter executing the above\
    \ command, all files in the Firefox software package will be decompressed to the\
    \ `/usr` directory. Among them, the decompressed file name is `firefox`.\n3. Switch\
    \ to the decompressed `firefox` directory and you will see an executable file\
    \ named `firefox`. This executable file is used to start the Firefox browser as:\n\
    \n```bash\nroot@exampleserver:～# cd /usr/firefox\nroot@exampleserver:/usr/firefox\n\
    ```\n\nFrom the results displayed above, you can see the executable file `firefox`\
    \ is used to launch the browser.\n\n# Executing the software\nWhen the user successfully\
    \ installs the software into the system, the tool corresponding to the software\
    \ can be started. Among them, some software can be started by command or graphical\
    \ interface, and some software is started using the executable script. This section\
    \ will introduce the startup methods of these two types of software respectively.\n\
    \n## General software\nGenerally, the way to start common software is by using\
    \ command line and graphical interface. In addition, the Kali Linux system also\
    \ provides `Alt+F2` shortcut keys to open a command prompt dialog box. Users can\
    \ enter any command to be executed in this dialog box. Several startup methods\
    \ of common software will be introduced below.\n\n### a) Graphical interface mode\n\
    The graphical interface method is to start through the menu command. The following\
    \ section will take Wireshark software as an example to introduce its startup\
    \ method.\n\n1. In the graphical interface, select \"Applications\" | \"sniffing/spoofing\"\
    \ | `Wireshark` command in turn.\n2. After selecting the `Wireshark` command here,\
    \ the software can be successfully run. Seeing this interface indicates that Wireshark\
    \ has started successfully. Next, the user selects the network interface and can\
    \ use the software to capture data packets.\n\n### b) Command line mode\nThe command\
    \ line method is there to execute through the terminal. The following section\
    \ will take Metasploit framework as an example to introduce the method of using\
    \ command line to start the software. The execution command as follows:\n\n```bash\n\
    root@exampleserver:～# msfconsole\n```\n\nFrom the output information, you can\
    \ see the command line prompt displayed as `msf >`. This shows that Metasploit\
    \ tool was successfully launched.\n\n### c) Command line prompt\nThe user can\
    \ use the command line prompt to run some software from the terminal, and runs\
    \ in interface. The following section will take DirBuster software as an example\
    \ to introduce the method of using command line prompt to start the software.\n\
    \n1. Use `Alt+F2` shortcut to start the command line prompt.\n2. Enter the command\
    \ to start the software in this interface. Seeing this interface means DirBuster\
    \ software has started.\n\n# Execute script\nIn Kali Linux system, some software\
    \ needs to be started by script after installation. Among them, the most common\
    \ executable scripts are Python, Ruby and Shell. For some scripts, libraries or\
    \ modules may need to be installed. The following section will introduce several\
    \ script startup methods.\n\n### a) Execute Ruby script\nWhen the user is executing\
    \ Ruby scripts, Ruby library files may be missing. At this time, the user needs\
    \ to use the `gem` command to install the library. Among them, the syntax format\
    \ for installing library files is as follows:\n\n`gem install [package]`\n\nThen,\
    \ use the `ruby` command to execute its Ruby script as:\n\n```bash\nroot@exampleserver:～#\
    \ ruby hello.rb\n```\n\n### b) Execute Python script\nWhen users execute Python\
    \ scripts, they may encounter the problem of missing dependency packages. At this\
    \ time, the user needs to use the `pip` command to install the corresponding dependency\
    \ package. Kali Linux provides two versions of Python, namely Python 2 and Python\
    \ 3. If you want to install dependent packages for Python 3, you need to use the\
    \ `pip3` command. However, `pip3` command is not installed by default. Therefore,\
    \ if you want to install dependent packages for Python 3, you need to install\
    \ the `pip3` command first. The execution command is as follows:\n\n```bash\n\
    root@exampleserver:～# apt-get install python3-pip\n```\n\nAfter executing the\
    \ above command, if no error is reported, `pip3` command is installed successfully.\
    \ Next, you can install the dependencies of Python 3. For example, packages that\
    \ `KickTheOut` tool depends on need be installed using `pip3`. The execution command\
    \ is as follows:\n\n```bash\nroot@exampleserver:～/kickthemout# pip3 install scapy-python3-nmap\
    \ netifaces\n```\n\nThe above process downloads and installs the packages that\
    \ `KickTheOut` tool depends on. From the last line of information, you can see\
    \ the above dependent packages have been successfully installed.\n\n### c) Execute\
    \ Perl script\nWhen users execute Perl scripts, they may encounter the problem\
    \ of missing Perl modules. At this point, the user needs to use the `cpan` command\
    \ to install, and then execute the corresponding script. For example, to use the\
    \ third-party tool `7zhashcat`, `Compress::Raw::Lzma` component is required. In\
    \ this case, you need to use the `cpan` command to install the component. The\
    \ `cpan` tool is included in the `perl-doc` package, so you need to install the\
    \ `perl-doc` package first. The execution command is as follows:\n\n```bash\n\
    root@exampleserver:～# apt-get install perl-doc\n```\n\n### d) Execute Shell script\n\
    Shell script execution is relatively simple, users only need to add execution\
    \ permissions. For example, here is a Shell script named `test.sh`, and the script\
    \ will be executed with executable permissions added below.\n\n1. Add executable\
    \ permissions. The execution command is as follows:\n\n```bash\nroot@exampleserver:～#\
    \ chmod +x test.sh\n```\n\nAfter executing the above command, there will be no\
    \ information output.\n2. Execute the `test.sh` script as follows:\n\n```bash\n\
    root@exampleserver:～# ./test.sh\nor\nroot@exampleserver:～# sh test.sh Hello World!\n\
    ```\n\nYou can see a line of information is output, indicating that the `test.sh`\
    \ script was successfully executed.\n\n# Chapter 8 Driver Installation\n![](Image00002.jpg)\n\
    Drivers are special programs added to the operating system. The drivers contain\
    \ information about the hardware device. This information enables the computer\
    \ to communicate with the corresponding device. When a hardware device is added\
    \ to the computer, the corresponding driver must be installed. Otherwise, the\
    \ device cannot be used. For Kali Linux system, because the kernel of the system\
    \ is relatively new, it can support most device drivers. However, for certain\
    \ devices, sometimes users need to manually install drivers, such as graphics\
    \ card drivers. This section will introduce how to view device driver information\
    \ and install the driver.\n\nTip: Because of the risk of installing the driver,\
    \ it is recommended to back up important data before installation.\n\n## View\
    \ device\nBefore installing the driver, the user can use the `lsusb` and `lspci`\
    \ commands to view the detailed information of the USB or PCI device to determine\
    \ whether the driver is correct. If it has started successfully, you need to install\
    \ the driver.\n\n### a) View USB devices\nWhen users implement wireless testing,\
    \ they usually need to use a network card with a USB interface. When the user\
    \ connects the device to the system, he can use the `lsusb` command to view the\
    \ USB device list information to determine whether the device is correctly identified\
    \ as follows:\n\n```bash\nroot@exampleserver:～# lsusb\n```\n\nThe above output\
    \ information shows the USB device list in the current system. The above output\
    \ information includes 3 parts, bus number, device number and manufacturer ID.\
    \ By analyzing the manufacturer's ID of the device, we can know that the device\
    \ is a USB device with model of Realtek Semiconductor Corp. The user can check\
    \ the driver module of the device using the `-v` option of `lsusb` command.\n\n\
    ```bash\nroot@exampleserver:～# lsusb -v\n```\n\nAfter executing the above command,\
    \ a lot of information is given output. Due to space limitations, only the detailed\
    \ information of the first USB device is listed. From the output information,\
    \ we can see the manufacturer ID and product ID of the device. It can explain\
    \ that the device has been correctly loaded.\n\n### b) View PCI devices\n`PCI`\
    \ (Peripheral Component Interconnect) is currently the most widely used interface\
    \ in personal computers, and almost all motherboard products have slots. PCI devices\
    \ refer to devices connected to these slots, such as sound cards, network cards,\
    \ and graphics cards. Kali Linux provides a command `lspci` to view the list of\
    \ PCI devices in the system. The execution command is as follows:\n\n```bash\n\
    root@exampleserver:～# lspci\n```\n\nThe above output information shows all PCI\
    \ device information in the current system. From the output information, we can\
    \ see there are PCI devices such as motherboard chips, interface slots, graphics\
    \ cards. The user can see the driver module of the PCI device using the `-v` option\
    \ of `lspci` command, and then confirm whether the device is correctly driven.\
    \ The execution command is as follows:\n\n```bash\nroot@exampleserver:～# lspci\
    \ -v\n```\n\nFrom this interface, you can see the detailed information of the\
    \ acquired PCI device. From the output information, we can see the driver information\
    \ of each PCI device. For example, the graphics card driver used in the current\
    \ system is `gfx`.\n\n### c) Virtual machine uses a USB device\nWhen users implement\
    \ wireless testing, they must use a network card. However, in general, the built-in\
    \ network card chip in the system does not support wireless monitoring. Therefore,\
    \ users must use a network card with a USB interface to achieve this. If it is\
    \ a physical machine, the user can directly insert the USB device into the host.\
    \ If it is a virtual machine, the user needs to connect manually. In addition,\
    \ you must start the virtual machine's USB service (VMware USB Arbitration). Otherwise,\
    \ the connected USB device cannot be recognized. The following section will take\
    \ a USB wireless card as an example to introduce the method of using USB devices\
    \ in the virtual machine. The specific steps are as follows:\n\n1. USB service\
    \ of virtual machine. Right-click the `Computer` icon on the desktop, and select\
    \ `Manage` | `Services and Applications` | `Services` command in the pop-up menu\
    \ to open the service interface.\n2. Find `VMware USB Arbitration Service` service\
    \ from the service, and confirm that the service has been started. Next, insert\
    \ the USB wireless card into the physical machine, and dialog box will pop up.\n\
    3. From the dialog box, you can see a new USB device is detected, its name is\
    \ `Ralink 802.11n NIC`. At this point, the user can choose to connect to the host\
    \ or connect to the virtual machine. After selecting the connection method, click\
    \ the `OK` button to connect successfully. If the user selects `Connect to a virtual\
    \ machine` radio button, they can choose to connect to the virtual machine using\
    \ the USB device. If the user selects `Connect to Host` radio button, and then\
    \ selects `Virtual Machine` | `Removable Device` command in the virtual machine's\
    \ menu bar, the device can also be connected to the virtual machine.\n4. After\
    \ selecting `Realtek 802.11n NIC` | `Connect (disconnect from the host) (C)` command\
    \ in the menu bar, the dialog box will pop up.\n5. From the dialog box, you can\
    \ see that a USB device will be unplugged from the host and connected to the virtual\
    \ machine. At this point, click the `OK` button to successfully connect the USB\
    \ wireless card to the virtual machine. Next, users can use the USB wireless card\
    \ to connect to a wireless network or perform wireless testing.\n\n# Install prerequisite\
    \ software packages\nFor the Linux operating system, the driver is mainly directly\
    \ contained by the kernel, and in fact, quite a large code is the driver of various\
    \ devices. Except for individual graphics and network card drivers, most devices\
    \ use open source drivers. And for general equipment, as long as the kernel version\
    \ used is new enough, there is basically no need to install additional drivers.\
    \ Therefore, the kernel header file is a necessary software package for installing\
    \ the driver. The following section will introduce the installation of kernel\
    \ header files. The execution command is as follows:\n\n```bash\nroot@exampleserver:～#\
    \ apt-get install linux-headers-$(uname -r)\n```\n\n# Install open source graphics\
    \ driver\nKali Linux uses the open source driver `Nouveau` by default to drive\
    \ Nvidia graphics cards. This driver only supports 2D acceleration, not 3D acceleration.\
    \ If you need 3D acceleration, you need to install Nvidia's official driver. Install\
    \ the open source graphics driver. The specific steps are as follows:\n\n1. Update\
    \ the system to obtain the latest system kernel. Otherwise, it will cause the\
    \ graphics card to fail start. The execution command is as follows:\n\n```bash\n\
    root@exampleserver:～# apt-get update && apt-get dist-upgrade && reboot\n```\n\n\
    2. Check the bus number of the graphics card and execute the command as follows:\n\
    \n```bash\nroot@exampleserver:～# lspci | grep -E \"VGA|3D\"\n01:00.0 controller:\
    \ NVIDIA Corporation GF108 [GeForce GT 440]\n```\n\nAmong them, `01:00.0` is the\
    \ bus number of the graphics card. When used later, it is simplified to `1:0`.\n\
    3. Use `vi` `/etc/modprobe.d/nouveau.conf` to create a configuration file that\
    \ disables the Nouveau driver. Add the following content:\n\n```\nblacklist nouveau\n\
    options modeset=0\n```\n\n4. Update the kernel and restart the system, execute\
    \ the command as follows:\n\n```bash\nroot@exampleserver:～# update-initramfs -u\n\
    root# reboot\n```\n\nNote: After restarting, if you can enter the graphical interface,\
    \ you will find that the resolution has changed. If you cannot enter the graphical\
    \ interface, press `Ctrl+Alt+F2` or `Ctrl+Alt+F3` shortcut key to enter the text\
    \ interface, enter the username and password in turn to enter the text mode.\n\
    5. Check whether the Nouveau module is disabled. The execution command is as follows:\n\
    \n```bash\nroot@exampleserver:～# lsmod | grep -i nouveau\n```\n\nIf there is no\
    \ output information it means the disable is successful. Otherwise, the disable\
    \ fails, you need to check whether the content of step (4) is entered correctly.\n\
    6. Install the Nvidia driver. The command is as follows:\n\n```bash\nroot@exampleserver:～#\
    \ apt-get install nvidia-driver\n```\n\n7. Generate the xorg configuration file\
    \ and execute the command as follows:\n\n```bash\nroot@exampleserver:～# nvidia-xconfig\n\
    ```\n\n8. Use `vi` to edit the `/etc/X11/xorg.conf` file and add the bus number\
    \ of the graphics card. The sample code is as follows:\n\nSection \"Device\"\n\
    \    Identifier \"nvidia\"\n    Driver \"nvidia\"\n    BusID \"PCI:1:0:0\"\nEnd\n\
    \nNote: The bold content needs to be added manually. Due to different machine\
    \ configurations, other codes may be different.\n9. If the computer has dual graphics\
    \ cards, use `vi` to create two configuration files `/usr/share/gdm/autostart/optius.desktop`\
    \ and `/etc/xdg/autostart/optimus.desktop` in turn, and add following content\
    \ respectively.\n\n10. Use the `reboot` command to restart the Kali Linux system.\n\
    11. Check the driver type used by the graphics card and execute the command as\
    \ follows:\n\n```bash\nroot@exampleserver:～# lspci -v\n```\n\n12. View graphics\
    \ card drive mode, execute the command as follows:\n\n```bash\nroot@exampleserver:～#\
    \ nvidia-xconfig --query-gpu-info\n```\n\n13. Install the CUDA tool and execute\
    \ the command as follows:\n\n```bash\nroot@exampleserver:～# apt-get install libcl-ic1\
    \ nvidia-cuda-toolkit\n```\n\n# Install the graphics card manufacturer's driver\n\
    Users can install not only the open source graphics driver, but also the graphics\
    \ manufacturer driver. The following section will introduce the method of installing\
    \ the driver of the graphics manufacturer. The following will take Nvidia graphics\
    \ card as an example to introduce the method of installing the driver. The specific\
    \ steps are as follows:\n\n1. Check the graphics card model and execute the command\
    \ as follows:\n\n```bash\nroot@exampleserver:～# lspci 00:00.0 Host\n```\n\nFrom\
    \ the output information, you can see the graphics card model in the current system\
    \ is `GeForce GT 440`.\n2. Download the driver package from Nvidia official website.\
    \ Among them, the download address is `https://www.nvidia.com/download/index.aspx`.\
    \ After successfully accessing the URL in the browser, the dialog box shown in\
    \ Figure 3.76 will be displayed.\n3. Select the product type from the Product\
    \ Type drop-down list of the dialog box, such as `GeForce`; select the product\
    \ series type from the Product Series drop-down list, such as `GeForce 400 Series`;\
    \ select the graphics card model from the Product Model drop-down list, such as\
    \ `GeForce GT 440`; Select the operating system type in the Operation System drop-down\
    \ list, first select `Show all Operating Systems` option, and then select `Linux\
    \ 64-bit` option; select the language type in the Language drop-down list, such\
    \ as `German (Simplified)`.\n4. Click the `SEARCH` button to jump to the driver\
    \ download page. Click the `Product Support List` tab to view the supported graphics\
    \ chips. After confirming that is correct, click the `Download` button to jump\
    \ to the download confirmation page. Click the `Download` button on this page\
    \ to start downloading the driver.\n5. Install the dependency package of the compiled\
    \ driver, execute the command as follows:\n\n```bash\nroot@exampleserver:～# apt-get\
    \ install pkg-config\n```\n\n6. Run the downloaded driver and execute the command\
    \ as follows:\n\n```bash\nroot@exampleserver:～# chmod +x NVIDIA-Linux-x86_64-390.87.run\n\
    root@exapleserver:～# ./NVIDIA-Linux-x86_64-390.87.run\n```\n\n7. After running,\
    \ an error message will pop up to warn that the Nouveau module is not prohibited.\n\
    8. Press the `Enter` key, and the Generate source file.\n"
  raw: 'Add software sourceAfter the user has a clear understanding of the concept
    and format of the software source, the software source can be added. The following
    section will introduce the official software sources and commonly used third-party
    software sources in the Kali Linux system.1) Official software sourceKali Linux
    official sources and software sources redirected by the official are usually relatively
    stable. However, the speed is not said to be necessarily fast.Among them, the
    official source of Kali is as follows:deb http://http.kali.org/kali kali-rolling
    main non-free contrib2) Commonly used third-party software sourcesSince the official
    source of Kali is a foreign website, domestic users may experience network instability
    when using it, which may result in a failure to install the software package.
    Moreover, the download speed is still relatively slow. At this time, the user
    can try to add a third-party software source.A lot of mirrors are available for
    different countries and locations. You can find list of third-party sources available
    by doing a quick google search. Also, you can use torrent to distribute the Linux
    image file. It is not illegal in anyway and can help you download the softwares
    fastly.3) Choice of HTTP and HTTPSFor safety reasons, these software sources currently
    support the HTTPS protocol. To use the software source of the HTTPS protocol,
    you only need to change the http in the URL address to https.deb https://http.kali.org/kali
    kali-rolling main non-free contribHTTPS is slow in downloading software due to
    encryption problems. However, the influence of the cache server can be avoided.
    Therefore, if the user fails to download the software due to the cache server
    when installing the software, the software can be reinstalled by modifying the
    software source to HTTPS.4.deb-scr software sourceSome software does not provide
    binary packages but only provides source code. For this kind of software, the
    software source of deb-src must be added. After downloading, it will automatically
    compile and generate executable files on the user''s computer.Among them, the
    deb-src software source format is as follows:deb-src http://http.kali.org/kali
    kali-rolling main non-free contribUpdate software source/systemAfter the user
    configures the software source, he needs to use the apt-get update command to
    update the software source to make the configuration effective. Users can also
    update the system quickly by updating the software source.The following section
    will introduce the method of updating the software source and updating the system.The
    execution command is as follows:root@exampleserver:～# apt-get updateIt can be
    seen from the above output that the software source has been successfully updated.The
    execution command is as follows:root@exampleserver:～# apt-get dist-upgrade RThe
    updated package information is displayed in the above output information, including
    the package to be upgraded, the newly installed package, and the uninstalled package.
    At this point, enter Y to continue the operation. If there is no error message
    during the subsequent operation, the system update will be successful. After the
    update is completed, restart the system, that is, reload the new system.Users
    can also use the graphical interface to update the operating system.The specific
    steps are as follows:1) Click the Show all programs button in the favorites on
    the left to open the interface of all programs, and click the "Software" button
    to display the dialog box.2) From the "Update (U)" tab of the dialog box, you
    can see that there is an update prompt. At this point, click the "Operating System
    Update" option to see the software package that needs to be updated.3) The software
    package to be updated is displayed in this interface. At this time, click the
    close button in the upper right corner to return to the software update dialog
    box . Then, click the "Download (D)" button to start downloading the updated software
    package. After the download is completed, the dialog box will be displayed.4)
    Click the "Restart and Update" button in the upper right corner, so that the "Restart
    and Install Update" dialog box will pop up.5) Click the "Restart and Install"
    button to restart the system and update the software package.6) This interface
    shows the update package being installed. After the update is completed, the system
    will automatically restart.Install the software from the software sourceAfter
    the user configures the software source, all the software provided in the software
    source can be installed. This section will introduce the software in the installation
    software source.Confirm package nameWhen users install software, they need to
    know the package name. If you are not sure of its name, you can use several commands
    in Kali Linux to search for the package name.The method of confirming the package
    name is described below.What is a software package?A software package refers to
    a program or a group of programs with specific functions to accomplish specific
    tasks. The software package consists of a basic component and several optional
    components, which can be in the form of source code or object code. In the Linux
    system, there are two main forms of software packages, namely binary packages
    and source code packages. Among them, the most common binary package formats are
    deb (Debian series) and rpm (Red Hat series). Source package formats are tar.gz,
    tar.bz2 and zip.Search software packages based on keywordsIn Kali Linux, users
    can use the apt-cache command to search for software packages based on keywords.Among
    them, the syntax format of the command is as follows:apt-cache search package_nameSearch
    the package name based on the keyword pm-.root@exampleserver:～# apt-cache search
    "pm-" antpm-ANTFrom the output information, you can see that all packages containing
    the pm- keyword have been searched. In the above information, the package name
    and the function of the package are shown respectively. By analyzing the package
    information, the name of the installed package can be determined.Search for packages
    according to the commandKali Linux provides a tool apt-file that can search for
    software packages based on commands. However, the tool is not installed by default.
    Therefore, you need to install it before using this tool.The execution command
    is as follows:root@exampleserver:～# apt-get install apt-fileAfter executing the
    above command, if no error is reported, the installation is successful. Next,
    you can use the tool to search for packages based on commands.Among them, the
    syntax format for searching software packages is as follows:apt-file search [pattern]Search
    for the software package where the arpspoof command is located.root@exampleserver:～#
    apt-file search arpspoofFrom the output information, you can see that the software
    package corresponding to the arpspoof tool is named dsniff.View the package structureAfter
    the user installs a certain software, if you are not sure where the software package
    is installed, you can use the apt-file command to view the package structure.
    In addition, users can also confirm whether they have the software they need based
    on the included files.The syntax format for viewing the package structure is as
    follows:apt-file list [pattern]View the dnsenum software package structure:root@daxueba:～#
    apt-file list dnsenumFrom the output information, you can see the structure of
    the dnsenum package. From the displayed results, we can see that the startup file
    of the dnsenum tool is installed in the /usr/bin directory. We can also know that
    the help document is in the /usr/share/doc/dnsenum directory.Install/Update SoftwareWhen
    the user determines the name of the software package to be installed, the software
    can be installed. Moreover, if a software is already installed in the system,
    the user can also update it. The method of installing and updating software will
    be introduced below.1) Install the softwareIn Kali Linux, the apt-get install
    command is mainly used to install the software in the software source.Among them,
    the syntax format of the command is as follows:apt-get install [packet_name]The
    following will take the StartDict software package as an example to introduce
    the software for installing the software source. StartDict is a well-known dictionary
    framework abroad, you can check the meaning of English words. Of course, users
    can also join the dictionary of domestic translation tools, such as Oxford dictionary.
    The dictionary framework is provided in the Kali Linux software source.The execution
    command is as follows:root@exampleserver:～# apt-get install qstardict stardict-＊After
    executing the above command, if no error is reported, the StarDict tool is installed
    successfully. At this point, the user can copy the thesaurus files (.dict.dz,
    .dix, .ifo.syn) of other translation tools to the /usr/share/stardict/dic directory,
    and then you can use the tool.2) Update the softwareIf a certain software has
    been officially updated, but the old version is still used in Kali Linux, at this
    time, users can update it by reinstalling the software to experience the new features
    as soon as possible.For example, to update the wpscan tool, execute the command
    as follows:root@exampleserver:～# apt-get install wpscanAs can be seen from the
    above output information, 3 software packages have been upgraded. From the displayed
    results, we can see that the wpscan tool has been upgraded from the original version
    3.4.3 to version 3.5.0.The above method is only to update a certain software separately.If
    the user wants to update all software, execute the command as follows:root@exampleserver:～#
    apt-get upgradeAfter executing the above command, all software packages that need
    to be upgraded in the current system will be upgraded.Remove softwareWhen the
    user does not need a certain software, it can be deleted.The syntax format used
    to delete software is as follows:apt-get remove [package_name]/# uninstall the
    packageorapt-get purge [package_name]#Uninstall and clear the package configurationUninstall
    the apt-file software.The execution command is as follows:root@exampleserver:～#
    apt-get remove apt-fileSeeing the above output information, it means that the
    apt-file software has been successfully uninstalled.Install virtual machine enhancement
    toolsIn order to facilitate the copying of files between the physical machine
    and the virtual machine, a virtual machine enhancement tool needs to be installed.
    open-vm-tools is an enhanced tool for VMware virtual machines. It provides VMware
    drivers to enhance the performance of virtual graphics and hard disks, as well
    as to synchronise the clocks of the virtual machine and the host. Only when the
    open-vm-tools tool is installed in the VMware virtual machine can the file sharing
    between the host and the virtual machine be realised, and the free drag and drop
    function can be supported. The mouse can also be moved freely between the virtual
    machine and the host (no Need to press Ctrl+Alt shortcut again).The following
    section describes how to install the virtual machine enhancement tool.Install
    open-vm-tools in Kali Linux.The execution command is as follows:root@exampleserver:～#
    apt-get install open-vm-tools-desktop fuseAfter executing the above command, the
    open-vm-tools tool will be installed. After the installation is complete, restart
    the computer. After the computer restarts, users can move, copy, and paste files
    freely between the physical machine and the virtual machine.Chapter 7Third party
    software Installation in Kali![](Image00002.jpg)Kali Linux system installs a lot
    of penetration testing software by default. However, some penetration testing
    tools are not installed (such as Nessus) and need to be downloaded and installed
    from a third party. Generally, the software package formats obtained from third
    parties include .deb, tar.gz, tar.bz2, zip, and rar. In order to meet the needs
    of users, this section will introduce the installation methods of these format
    software packages.Install binary softwareThe binary package contains programs
    that have been compiled and can be run immediately. The user only needs to download
    and unpack (install) it before it can be used. In Linux systems, binary software
    includes two formats, RPM and DEB. Among them, RPM is a package manager based
    on Red Hat''s Linux distribution with the suffix .rpm whereas DEB is a package
    manager based on Debian with the suffix .deb. Kali Linux is based on Debian, so
    its binary package format is .deb. The following section will introduce the method
    of installing binary packages in Kali Linux.The following section uses Nessus
    software as an example to introduce the installation method of the binary package.The
    specific steps are as follows:1) Download the binary package with the same architecture
    as your own operating system on the Nessus official website. Among them, the download
    address of Nessus is [https://www.tenable.com/downloads/nessus.In this example,
    the downloaded package is named Nessus-8.3.1-debian6_amd64.deb. ]2) Install Nessus
    tool.The execution command is as follows:root@exampleserver:～# dpkg -i Nessus-8.3.1-debian6_amd64.debSeeing
    the above output information, it means that the Nessus tool has been successfully
    installed. Next, users can use the tool to perform vulnerability scanning.Install
    source packageThe source code package contains the original program code of the
    program, which needs to be compiled by the user to generate a runnable program.
    It takes longer to install software through source code. In Linux, the most common
    source code package formats are .tar.gz and .tar.bz2\. The following section will
    introduce the installation methods of these two source code packages.If you want
    to install source code packages in .tar.gz and .tar.bz2 formats, you need to use
    the tar command to decompress, and then configure, compile and install.The syntax
    format of decompressing the tar.gz source package is as follows:tar zxvf source
    package file name [-C target directory]The syntax format for decompressing the
    tar.bz2 source package is as follows:tar jxvf source code package file name [-C
    target directory]In the above syntax, [-C target directory] is used to specify
    the decompression location of the source package. If not specified, it will decompress
    to the current directory by default.The following section will take the automated
    man-in-the-middle attack tool as an example to demonstrate the installation method
    of the tar.gz format source package.The specific steps are as follows:1) Go to
    the website [http://code.google.com/p/subterfuge/downloads/list} to download the
    Subterfuge package. The package name is subterfuge_packages.tar.gz. Then, copy
    the downloaded package to the Kali system.2) Unzip the downloaded software package.The
    execution command is as follows:root@exampleserver:～# tar zxvf subterfuge_packages.tar.gzAfter
    successfully decompressing the Subterfuge package, all files will be decompressed
    into the subterfuge directory.3) Install the Subterfuge tool as follows:root@exampleserver:～#
    cd subterfuge/ root@daxueba:～/subterfuge# python install.pyAfter executing the
    above command, the interface will be displayed.4) Select the Full Install With
    Dependencies radio button in this interface, and then click the Install button
    to install. After the installation is complete, the interface with additional
    settings will be displayed.5) From this interface, you can see that a small dialog
    box pops up, showing that the Subterfuge installation is complete. At this point,
    click the Finish button to complete the installation.The following section will
    take the Firefox browser as an example to demonstrate the installation of the
    software package in the tar.bz2 package format.The specific steps are as follows:1)
    Download the Linux version of the Firefox browser software package.In this example,
    the downloaded package name is Firefox-latest-x86_64.tar.bz2.Tip: When downloading
    the Firefox browser software package, you must choose according to the user''s
    hardware architecture. In this example, the 64-bit architecture package is downloaded.2)
    Unzip the software package.The execution command is as follows:root@exampleserver:～#
    tar jxvf Firefox-latest-x86_64.tar.bz2-C /usrAfter executing the above command,
    all files in the Firefox software package will be decompressed to the /usr directory.
    Among them, the decompressed file name is firefox.3) Switch to the decompressed
    firefox directory and you will see an executable file named firefox.This executable
    file is used to start the Firefox browser. as follows:root@exampleserver:～# cd
    /usr/firefox/ root@exampleserver:/usr/firefoxFrom the results displayed above,
    you can see the executable file firefox is used to launch the browser.Executing
    the softwareWhen the user successfully installs the software into the system,
    the tool corresponding to the software can be started. Among them, some software
    can be started by command or graphical interface, and some software is started
    using the executable script. This section will introduce the startup methods of
    these two types of software respectively.General softwareGenerally, the way to
    start common software is by using command line and graphical interface. In addition,
    the Kali Linux system also provides Alt+F2 shortcut keys to open a command prompt
    dialog box. Users can enter any command to be executed in this dialog box. Several
    startup methods of common software will be introduced below.a) Graphical interface
    modeThe graphical interface method is to start through the menu command. The following
    section will take Wireshark software as an example to introduce its startup method.1)
    In the graphical interface, select "Applications"|"sniffing/spoofing"|Wireshark
    command in turn.2) After selecting the Wireshark command here, the software can
    be successfully run.Seeing this interface indicates that Wireshark has started
    successfully. Next, the user selects the network interface and can use the software
    to capture data packets.b) Command line modeThe command line method is there to
    execute through the terminal. The following section will take the Metasploit framework
    as an example to introduce the method of using the command line to start the software.Start
    Metasploit terminal mode and execute the command as follows:root@exampleserver:～#
    msfconsoleFrom the output information, you can see that the command line prompt
    is displayed as msf5 >. This shows that the Metasploit tool was successfully launched.c)
    Command line promptThe user can use the command line prompt to run some software
    that runs from the terminal, and it runs in interface mode. In this way, there
    is no need to occupy a terminal window. The following will take DirBuster software
    as an example to introduce the method of using the command line prompt to start
    the software.The specific steps are as follows:(1) Use the Alt+F2 shortcut to
    start the command line prompt.(2) Enter the command to start the software in this
    interface. Then, press the Enter key to start the tool.Seeing this interface means
    that the DirBuster software has been successfully started.Execute scriptIn Kali
    Linux system, some software needs to be started by script after installation.
    Among them, the most common executable scripts are Python, Ruby, Perl and Shell.
    For some scripts, libraries or modules may also need to be installed. The following
    section will introduce several common execution script startup methods.a) Execute
    Ruby scriptWhen the user is executing Ruby scripts, Ruby library files may be
    missing. At this time, the user needs to install the corresponding library using
    the gem install command.Among them, the syntax format for installing Ruby library
    files is as follows:gem install [package]Then, use the ruby ​​command to execute
    its Ruby script. as follows:root@exampleserver:～# ruby ​​hello.rb Hello World.b)
    Execute Python scriptWhen users execute Python scripts, they may encounter the
    problem of missing dependency packages. At this time, the user can use the pip
    install command to install the corresponding dependency package. Only then can
    its Python script be executed.For example, polenum is a Python script that can
    use Python''s impacket library to obtain password policies from the Windows kernel
    security mechanism. However, the script depends on impacket 0.9.11 version of
    the library. So, if you want to use polenum tool, you must install impacket 0.9.11.The
    execution command is as follows:root@exampleserver:～# pip install impacket==0.9.11From
    the last line of the above output, you can see that the impacket-0.9.11 package
    has been successfully installed. Next, the user can use the polenum tool.Kali
    Linux provides two versions of Python by default, namely Python 2 and Python 3\.
    pip can install Python 2 dependencies. If you want to install dependent packages
    for Python 3, you need to use the pip3 command. However, the pip3 command is not
    installed by default. Therefore, if you want to install dependent packages for
    Python 3, you need to install the pip3 command first.The execution command is
    as follows:root@exampleserver:～# apt-get install python3-pipAfter executing the
    above command, if no error is reported, the pip3 command is installed successfully.
    Next, you can install the dependencies of Python 3\. For example, packages that
    the KickThemOut tool depends on need to be installed using pip3.The following
    will demonstrate the use of pip3 to install the packages that the KickThemOut
    tool depends on.The execution command is as follows:root@exampleserver:～/kickthemout#
    pip3 install scapy-python3 python-nmap netifacesThe above process downloads and
    installs the packages that the KickThemOut tool depends on. From the last line
    of information, you can see that the above dependent packages have been successfully
    installed.c) Execute Perl scriptWhen users execute Perl scripts, they may encounter
    the problem of missing Perl modules. At this point, the user needs to use the
    cpan command to install, and then execute the corresponding script.For example,
    to use the third-party tool 7z2hashcat, the Compress::Raw::Lzma component is required.
    In this case, you need to use the cpan command to install the component. The cpan
    tool is included in the perl-doc package, so you need to install the perl-doc
    package first. The execution command is as follows:root@exampleserver:～# apt-get
    install perl-docd) Execute Shell scriptShell script execution is relatively simple,
    users only need to add execution permissions. For example, here is a Shell script
    named test.sh, and the script will be executed with executable permissions added
    below.(1) Add executable permissions. The execution command is as follows:root@exampleserver:～#
    chmod + x test.shAfter executing the above command, there will be no information
    output.(2) Execute the test.sh script. as follows:root@exampleserver:～# ./test.shorroot@exampleserver:～#
    sh test.sh Hello World!You can see that a line of information is output, indicating
    that the test.sh script was successfully executed.Chapter 8Driver Installation
    in Kali![](Image00002.jpg)Drivers are special programs added to the operating
    system. The drivers contain information about the hardware device. This information
    enables the computer to communicate with the corresponding device. When a hardware
    device is added to the computer, the corresponding driver must be installed. Otherwise,
    the device cannot be used.For Kali Linux system, because the kernel of the system
    is relatively new, it can support most device drivers. However, for certain devices,
    sometimes users need to manually install drivers, such as graphics card drivers.
    This section will introduce how to view device driver information and install
    the driver.Tip: Because of the risk of installing the driver, it is recommended
    to back up important data before installation.View deviceBefore installing the
    driver, the user can use the lsusb and lspci commands to view the detailed information
    of the USB or PCI device to determine whether the driver is correct. If it has
    started successfully, you need to install the driver. The following will introduce
    how to check whether the device is driven correctly.a) View USB devicesWhen users
    implement wireless penetration testing, they usually need to use a wireless network
    card with a USB interface. When the user connects the device to the system, he
    can use the lsusb command to view the USB device list information to determine
    whether the device is correctly identified. as follows:root@exampleserver:～# lsusbThe
    above output information shows the USB device list information in the current
    system. The above output information includes 3 parts, which are bus number, device
    number and manufacturer ID. By analyzing the manufacturer''s ID information of
    the device, it can be known that the device is a USB device with a model of Realtek
    Semiconductor Corp.The user can check the driver module of the device by using
    the -v option of the lsusb command to confirm whether the driver is correct. The
    following will introduce the use of lsusb command to view the detailed information
    of the USB device.The execution command is as follows:root@exampleserver:～# lsusb
    -v BusAfter executing the above command, a lot of information will be given as
    output. Due to space limitations, only the detailed information of the first USB
    device is briefly listed. From the output information, you can see the manufacturer
    ID and product ID information of the device. It can be explained that the device
    has been correctly loaded with the driver. If it is not driven, you will not be
    able to see similar information.b) View PCI devicesPCI (Peripheral Component Interconnect,
    Peripheral Component Interconnect Standard) is currently the most widely used
    interface specification in personal computers, and almost all motherboard products
    have slots of this specification. PCI devices refer to devices connected to these
    PCI slots, such as sound cards, network cards, and graphics cards. Kali Linux
    provides a command called lspci to view the list of PCI devices in the system.The
    execution command is as follows:root@exampleserver:～# lspciThe above output information
    shows all PCI device information in the current system. From the output information,
    we can see that there are PCI devices such as motherboard chips, interface slots,
    graphics cards, and network cards.The user can see the driver module of the PCI
    device by using the -v option of the lspci command, and then confirm whether the
    device is correctly driven.The execution command is as follows:root@exampleserver:～#
    lspci -vFrom this interface, you can see the detailed information of the acquired
    PCI device. From the displayed information, you can see the driver information
    of each PCI device. For example, the graphics card driver used in the current
    system is vmwgfx.c) The virtual machine uses a USB deviceWhen users implement
    wireless penetration testing, they must use a wireless network card. However,
    in general, the built-in wireless network card chip in the system does not support
    wireless monitoring. Therefore, users must use a wireless network card with a
    USB interface to achieve this.If it is a physical machine, the user can directly
    insert the USB device into the host. If it is a virtual machine, the user needs
    to connect manually. In addition, you must start the virtual machine''s USB service
    (VMware USB Arbitration Service). Otherwise, the connected USB device cannot be
    recognized.The following section will take a USB wireless network card as an example
    to introduce the method of using USB devices in a virtual machine.The specific
    steps are as follows:1) USB service of virtual machine.Right-click the "Computer"
    icon on the desktop, and select the "Manage" | "Services and Applications" | "Services"
    command in the pop-up menu to open the service interface.2) Find the VMware USB
    Arbitration Service service from the service, and confirm that the service has
    been started. Next, insert the USB wireless network card into the physical machine,
    and a dialog box will pop up.3) From the dialog box, you can see that a new USB
    device is detected, its name is Ralink 802.11n NIC. At this point, the user can
    choose to connect to the host or connect to the virtual machine. After selecting
    the connection method, click the "OK" button to connect successfully.If the user
    selects the "Connect to a virtual machine" radio button, you can choose to connect
    to the virtual machine using the USB device. If the user selects the "Connect
    to Host" radio button, and then selects the "Virtual Machine" | "Removable Device"
    command in the virtual machine''s menu bar, the device can also be connected to
    the virtual machine.4) After selecting the "Realtek 802.11n NIC" | "Connect (disconnect
    from the host) (C)" command in the menu bar, the dialog box will pop up.5) From
    the dialog box, you can see that a USB device will be unplugged from the host
    and connected to the virtual machine. At this point, click the "OK" button to
    successfully connect the USB wireless network card to the virtual machine. Next,
    users can use the USB wireless network card to connect to a wireless network or
    perform wireless penetration testing.Install prerequisite software packagesFor
    the Linux operating system, the driver is mainly directly contained by the kernel,
    and in fact, quite a large code is the driver of various devices. Except for individual
    graphics and network card drivers, most devices use open source drivers. And for
    general equipment, as long as the kernel version used is new enough, there is
    basically no need to install additional drivers. Therefore, the kernel header
    file is a necessary software package for installing the driver. The following
    sectionwill introduce the installation of kernel header files.The execution command
    is as follows:root@exampleserver:～# apt-get install linux-headers-$(uname -r)Install
    open source graphics driverKali Linux uses the open source driver Nouvea by default
    to drive Nvidia graphics cards. This driver only supports 2D acceleration, not
    3D acceleration. If you need 3D acceleration, you need to install Nvidia''s official
    driver.Install the open source graphics driver.The specific steps are as follows:1)
    Update the system to obtain the latest system kernel.Otherwise, it will cause
    the graphics card to fail to start.The execution command is as follows:root@exampleserver:～#apt-get
    update && apt-get dist-upgrade && reboot2) Check the bus number of the graphics
    card and execute the command as follows:root@exampleserver:～#lspci | grep -E "VGA|3D"
    01:00.0 VGA compatible controller: NVIDIA Corporation GF108 [GeForce GT 440] (rev
    a1)Among them, 01:00:0 is the bus number of the Nvidia graphics card. When used
    later, it is simplified to 1:0:0.3) Use the VI editor to create a configuration
    file that disables the Nouveau driver, and execute the command as follows:root@exampleserver:～#vi
    /etc/modprobe.d/nvidia-blacklists-nouveau.conf4) Add the following content to
    the file and save it:blacklist nouveua options nouveau modeset=0 aliasnouveau
    off5) Update the kernel and restart the system, execute the command as follows:root@exampleserver:～#update-initramfs
    -u root@daxueba:～#rebootNote: After restarting, if you can enter the graphical
    interface, you will find that the resolution has changed. If you cannot enter
    the graphical interface, press the Ctrl+Alt+F2 or Ctrl+Alt+F3 shortcut key to
    enter the text interface, enter the user name and password in turn to enter the
    text mode.6) Check whether the Nouveau module is disabled.The execution command
    is as follows:root@exampleserver:～#lsmod | grep -i nouveauIf there is no output
    information, it means that the disable is successful. Otherwise, the disablement
    fails, and you need to check whether the content of step (4) is entered correctly.7)
    Install the Nvidia driver. The command is as follows:root@exampleserver:～#apt-get
    install nvidia-driver nvidia-xconfig8) Generate the xorg configuration file and
    execute the command as follows:root@exampleserver:～#nvidia-xconfig9) Use the VI
    editor to edit the /etc/X11/xorg.conf file and add the bus number of the Nvidia
    graphics card.The sample code is as follows:Section "Device" Identifier "nvidia"
    Driver "nvidia" BusID "PCI:1:0:0" EndSectionNote: The bold content format needs
    to be added manually. Due to different machine configurations, other codes may
    be different.10) If the computer has dual graphics cards, use the vi command to
    create two configuration files /usr/share/gdm/greeter/autostart/optius.dekstop
    and /etc/xdg/autostart/optimus.desktop in turn, and add the following content
    respectively .11) Use the reboot command to restart the Kali Linux system.12)
    Check the driver type used by the graphics card and execute the command as follows:root@exampleserver:～#lspci
    -v13) View the graphics card drive mode, execute the command as follows:root@exampleserver:～#nvidia-xconfig
    --query-gpu-info14) Install the CUDA tool and execute the command as follows:root@exampleserver:～#apt-get
    install ocl-icd-libopencl1 nvidia-cuda-toolkitInstall the graphics card manufacturer''s
    driverUsers can install not only the open source graphics driver, but also the
    graphics manufacturer driver. The following section will introduce the method
    of installing the driver of the graphics card manufacturer.The following will
    take the Nvidia graphics card as an example to introduce the method of installing
    the driver of the graphics card manufacturer.The specific steps are as follows:1)
    Check the graphics card model and execute the command as follows:root@exampleserver:～#
    lspci 00:00.0 HostFrom the output information, we can see that the graphics card
    model in the current system is GeForce GT 440.2) Download the driver package from
    Nvidia official website. Among them, the download address is [https://www.nvidia.com/download/index.aspx.
    After successfully accessing the URL in the browser, the dialog box shown in Figure
    3.76 will be displayed. ](https://www.nvidia.com/download/index.aspx. After successfully
    accessing the URL in the browser, the dialog box shown in Figure 3.76 will be
    displayed.)3) Select the product type from the Product Type drop-down list of
    the dialog box, such as GeForce; select the product series type from the Product
    Series drop-down list, such as GeForce 400 Series; select the graphics card model
    from the Product drop-down list, such as GeForce GT 440; Select the operating
    system type in the Operation System drop-down list, first select the Show all
    Operating Systems option, and then select the Linux 64-bit option; select the
    language type in the Language drop-down list, such as German (Simplified).4) Click
    the SEARCH button to jump to the driver download page. Click the "Product Support
    List" tab to view the supported graphics chips. After confirming that it is correct,
    click the "Download" button to jump to the download confirmation page. Click the
    "Download" button on this page to start downloading the driver.5) Install the
    dependency package of the compiled driver, execute the command as follows:root@exampleserver:～#
    apt-get install pkg-config6) Run the downloaded driver and execute the command
    as follows:root@exampleserver:～# chmod +x NVIDIA-Linux-x86_64-390.87.run root@exapleserver:～#
    ./NVIDIA-Linux-x86_64-390.87.run7) After running, an error message will pop up
    to warn that the Nouveau module is not prohibited.8) Press the Enter key, and
    the Generate Nouveau Configuration File dialog box will pop up.9) Use the arrow
    keys to switch to the Yes button, and then press the Enter key to pop up the configuration
    file generation prompt dialog box.10) Press Enter to confirm the file generation
    information, and the installation failure dialog box will pop up.11) Press Enter
    to exit the installation interface. Restart the Kali Linux system, run the installation
    file again, and the CC version detection dialog box pops up.12) Use the arrow
    keys to switch to the Ignore CC version check button, and then press the Enter
    key, a dialog box for confirming the CC version check pops up.13) Press Enter
    to start installing the driver.14) After the installation is complete, a dialog
    box for installing 32-bit compatible libraries will be prompted.15) Use the arrow
    keys to switch to the No button, and then press the Enter key to start installing
    the library file.16) After the installation is complete, the configuration file
    generation dialog box will pop up.Use the arrow keys to switch to the Yes button,
    and then press the Enter key to pop up the installation completion dialog box.17)
    Click the OK button, the graphics card installation is complete, and exit the
    installation program.Similarly, if the current computer has dual graphics cards,
    use the VI editor to create the configuration files /usr/share/gdm/greeter/autostart/optius.dekstop
    and /etc/xdg/autostart/optimus.desktop in sequence, and add the following content
    respectively:[Desktop Entry] Type=Application Name=Optimus Exec=sh -c "xrandr
    --setprovideroutputsource modesetting NVIDIA-0; xrandr --autostart" NoDisplay=true
    X-GNOME-Autostart-Phase=DisplayServerAdd the above content to the corresponding
    configuration file and save it, then restart the computer to make the graphics
    card driver take effect.![](Image00003.jpg)RECONOISSANCE FOR HACKERSLearn How
    To Gather Information About A Target And Attack it With Nmap![](Image00004.jpg)IntroductionThe
    previous module of this book introduced Kali Linux along with it''s features and
    installation guides. This module looks at the most important skill that needs
    to be mastered by all hackers and pen testers i.e Reconnaissance. We will look
    at various tools and provide tons of examples for you to understand the essence
    of the subject clearly.What tools do you need?There are hundreds of tools developed
    only for reconnaissance as it plays a major role in the hacking procedure. For
    a basic level introduction this book mainly focuses on two tools, Nmap and Dmitri.
    We suggest you to install both these tools before starting this book if you are
    on Windows or Mac. If you have already installed Kali then you can easily access
    them from the search menu. As said before tools are only their for automating
    things and streaming for your hacking procedure. The secret of hacking always
    depends on the strategy you chose to find a backdoor to the host. Don’t get overwhelmed
    by tools features and forget your main motto.How to approach this module?Information
    gathering is more about understanding the approach rather than understanding the
    tools or commands that have been used. Every target needs a different approach
    and as a hacker you need to solely develop an approach to attack a target depending
    on the results you obtain from reconnaissance. So, make sure you are analysing
    the log files and results carefully.Note & Disclaimer :This book is written with
    great care and precision. We intend you to not use this book for illegal purposes.
    Anything the reader does with the content of the book is in no way responsible
    for us.Chapter 9Networking Essentials![](Image00004.jpg)This chapter acts as a
    prerequisite for pen testers trying to improve their skills in the reconnaissance
    phase. We will discuss about topics related to Networking for making you looking
    at things in a much larger perspective. Follow along!How to discover a host?The
    discovery host is used to detect which hosts are active, and then obtain information
    about the available hosts. Users can use active scanning to discover the host,
    or can use passive monitoring to discover the host. This section will explain
    these two methods in detail with detailed instructions.Confirm network rangeBefore
    detecting a target, it is often necessary to clarify the possible range of the
    target. This range may be a specific host, it may be an address range, or it may
    sometimes even be an entire subnet. Regardless of the range, it usually should
    and will follow the IP address rules. According to the IP rules, the possible
    range of the target can be drawn. So, it is important that a penetration tester
    is aware of the IP addressing rules that have been designed.'
