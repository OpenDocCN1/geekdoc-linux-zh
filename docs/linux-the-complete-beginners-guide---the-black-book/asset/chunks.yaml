    Windows users are forced to employ third-party antivirus software to help limit
    the possibility of the computer being rendered useless by malicious code. antivirus
    software often has the negative side effect of hogging system resources, thus
    slowing down your entire computer, also most antivirus software requires that
    you pay a subscription service, and that you constantly download updates in order
    to stay ahead of intruders.


    With Linux on the other hand problems with viruses are practically non-existent,
    and in reality you do not even need virus protection for your Linux machine. One
    reason why viruses and spyware are not a problem for Linux is simply due to the
    fact there are far fewer made for Linux. A more important reason is that running
    a virus on a Linux machine is more difficult and requires a lot more input from
    the user. With Windows you may accidentally run and execute a virus, by opening
    an email attachment, or by double clicking on a file that contains malicious code.
    However with Linux a virus would need to run in the terminal, which requires the
    user to give the file execution permissions, and then open it in the terminal.


    And in order to cause any real damage to the system the user would have to log
    in as root, by turning a username and password before running the virus. For example
    to run a virus that is embedded in an email attachment the user would have to,
    open the attachment, then save it, then right click the file and choose properties
    from the menu, in properties they can give it execute permissions, they would
    then be able to open the file in terminal to run the virus. And even then the
    user would only be able to damage his folder, all other users at be left untouched
    and all root files would remain untouched because Linux would require root password
    to make changes to these


    The only way the user can damage the whole computer would be if logged in as root
    by providing root username and password to the terminal. Unlike Windows in Linux
    an executable cannot run automatically needs to be given manually this significantly
    improves security. In Linux the only reason you would need virus protection is
    if you share files with Windows users and is to protect them so you are not accidentally
    pass a virus to the Windows computer that you are sharing with


    The above was a general overview of some differences between the Windows operating
    system, and Linux. To recap with the fact Windows has only one vendor that releases
    the software, while Linux comes from millions of different codes throughout the
    world. Also commented on the fact that the Linux Kernel and much of the applications
    used with it are completely free of charge, whereas with Windows you are forced
    to pay for most of the software. Unlike Windows Linux is often lacking professional
    support, and Linux users are often left on their own to solve technical issues.
    Linux users can either pay for support or rely on the many Linux forums and groups
    available on the Internet. Due to the fact that the kernel is open, Linux has
    a huge advantage over Windows in configurability. You can configure Linux to run
    almost any way you see by manipulating the Kernel.


    Installing Windows Operating software and applications is easier due to the fact
    it has a universal installer. Also finding applications for Windows is easier
    because of its popularity most apps are available for Windows only, and are made
    easily available. Linux will run on a greater variety of hardware than does Windows,
    from mainframe supercomputers running multiple IBM Power PC Chips, to a small
    laptop running an AMD processor. And of course the biggest difference in this
    writer''s opinion is the fact that Linux does not suffer from an onslaught of
    viruses and other malicious code, unlike Windows which is plagued by countless
    malicious code


    Linux OS really is the superior software. Other than a few minor nuisances, linux
    outperforms Windows in most categories. The fact that Linux is more secure is
    the tipping point, that tilts the scales in favor of Linux. Windows suffers from
    far more security vulnerabilities for all desktop environment


    # Understanding Linux Partition Types & Hard Disk Partitioning


    When you''re doing disk partitioning (during or after installing Linux) you will
    likely run situations where you can''t create partitions and can''t do other tasks
    that you''d like to do with partitions! This is when you need to understand Linux
    hard disk partitioning Linux System Admin Tips: Keep in mind the rules below for
    using `fdisk`, which is the most commonly used partitioning utility. You may be
    able to break these rules with other disk utilities


    # Setting Up Linux Hard Disk Partitions


    You can set up and configure your Linux partitions using the installation routine
    of most distributions - and using `fdisk`. Also as a Linux System Administrator,
    you will also need to manage (create, delete, and modify) partitions on existing
    Linux systems (after the OS has been installed). To do this you use the `fdisk`
    utility or the `parted` command - and are also other disk partitioning commands.
    There are several Linux hard disk partition types, such as primary, extended and
    logical - and are also strict rules about using these partition types.


    ### Linux Primary Partitions


    The disk partitioning utility in a Linux installation routine and the `fdisk`
    command (and other disk partitioning commands) can create a maximum of four Primary
    partitions per hard disk drive. If you need more than four hard disk partitions,
    you need to create at least one Extended partition and then create one or more
    Logical partitions in the Extended partition. To be able to create an Extended
    partition on a hard disk that already has four Primary partitions, you need to
    delete one of the Primary partitions and then create the Extended partition. So,
    you can have a maximum of three Primary partitions if you are creating an Extended
    partition on a Linux hard disk.


    ### Linux Extended Partitions


    A Linux hard disk must have at least one Primary partition before it can have
    an Extended partition. `fdisk` cannot create more than one Extended partition
    per drive. To be able to use the disk space in an extended partition, it must
    have at least one Logical partition (within the Extended partition).


    ### Logical Partitions


    Extended partitions contain one or more Logical partitions. An Extended partition
    is not accessed directly. It is accessed via one or more Logical partitions within
    the Extended partition. If a hard disk has an Extended partition, then it has
    at least one Logical partition.


    ### Partition Numbering


    The maximum number of Primary partitions that `fdisk` can create is four and the
    maximum number of Extended partitions that it can create is one. Remember, you
    must have at least one Primary partition before using `fdisk`, which is the most
    commonly used partitioning utility. You may be able to break these rules with
    other disk utilities.

