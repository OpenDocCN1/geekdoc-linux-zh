    # INTRODUCTION


    I want tо thank уоu и соngrаtulаtе уоu для dоwnlоаding the bооk, “The Linux Operating
    System”.Thiѕ book соntаinѕ рrоvеn steps аnd ѕtrаtеgiеѕ оn hоw tо Run Linux tо
    gеt real еxпеririеnсе, getting Linux bооkѕ for system administration соmmаndѕ,
    as wеll аѕ inѕtаlling Linux оn a windows and so muсh more аѕ уоu can see in thе
    Tаblе of соntеnt. Dоn''t raise уоur еуеbrоwѕ оr fеаr bу hearing thе wоrd Linux.
    It iѕ аѕ uѕеr friendly аѕ windоwѕ.


    Linux is an operating system available for download. This book provides strategies
    on how to run Linux to get real experience, system administration commands, as
    well as installing Linux on Windows. It is as user-friendly as Windows.


    Linux is growing year after year. Many big companies like IBM and HP support it,
    and it is based on UNIX. It features a command line for users.


    If you want to use Linux, you can install it on a separate partition on your disk
    to use both operating systems.


    # Mуthѕ аbоut Linux


    ### Installation


    Is Linux hard to install? Not really. Most people have never installed Windows
    on their computers because it comes preloaded. Linux is easier to install compared
    to Windows. You can install it through a graphical user interface like Windows.
    But what really stumps people is installing Linux on a second partition on their
    disk when they want to use both.


    A partition is a way of organizing space on your disk by creating virtual sections
    that are separate from each other. Most computers running Windows have one large
    chunk of space holding the OS, which is the C drive. Large disks are likely divided
    up into smaller bits called partitions to help you organize your data better.
    These partitions are usually called D:, E:, etc. You could have Linux on any of
    these.


    Thanks again for downloading this book, I hope you enjoy it!

