    * Pass. Knowing your material and getting the questions right will mean you pass
    the exam.


    * Celebrate! Well done, you''ve passed the exam and earned a certification! All
    your hard work has paid off and now you''re Red Hat Linux Certified


    # Linux Installation Help - How To Install the Linux OS from a New Linux Download


    You can install Linux from CD or DVD onto a new computer system. This will allow
    you to learn how to use Linux to get real, practical Linux training and experience.
    In this section, we''re talking about a new system that doesn''t already have
    an operating system (like Windows) on it.


    You can download the Linux OS (operating system) as a Linux ISO file and burn
    it to CD or DVD yourself, or you can order Linux on CD or DVD and have it mailed
    to you.


    Linux Tips: Linux ISO files are large. Only download Linux if you have high-speed
    Internet. You can buy and have the Linux OS delivered to you by mail very cheaply.
    Just do an Internet search for "list of linux cds" or "list of linux dvds".


    Linux Tips: Linux DVDs hold a lot more programs than CDs. Order a Linux DVD version
    and you will have more Linux software programs to choose from than a CD version
    - and you will also need fewer Linux DVDs than CDs!


    # 7 Steps to Install Linux on a New Computer System


    ## 1. Document Your Linux Installation Settings


    During the Linux installation, you need to specify some system settings. These
    include: the Linux software programs and desktop(s) you want installed, networking
    settings, and disk partition sizes.


    ### 2. Boot with the Linux CD or DVD and Start the Linux Installation Routine


    Do the steps to set up your system to boot from its CD or DVD drive. Shut down
    your system and boot it with the first Linux CD / DVD in the drive and start the
    Linux installation.


    ### 3. Specify Your Linux Installation Settings


    Follow the on-screen prompts and put in installation settings documented in Step
    1.


    ### 4. Create a Regular ("Non-root") User


    You log in to work on a Linux system as a Linux "user", with user name and password.
    You can log in as the "root" user, or as "non-root" user.


    You log in and work on the Linux OS as the root user when you need to do Linux
    administration. For example, you work as the root user to run a command to create
    a new user, or to install server. When you install Linux, the root user is always
    created for doing administration tasks. However, for security reasons, you should
    never log in to Linux desktop as the root. At some point during installation,
    you will be asked if you want to create one or "regular" (non-root) Linux users.
    Always create at least one regular user and log in as this user for day-to-day
    tasks.


    ### 5. Let Linux OS Install on Your Disk


    After you specify the installation settings and create one or new users, the installation
    routine will copy the Linux OS and software programs to the hard disk, and then
    reboot.


    ### 6. Log In to Test the System


    Once system reboots, log in as "regular" (non-root) user to test that you can
    work as this user. At this point, the Linux desktop appears and you can run programs
    to test the system.


    Linux Tips: Remember not to log in to Linux desktop as the root user. Test root
    user by logging in as a regular user and opening a terminal window. Then run command
    to log in and work as the root user.


    ### 7. Have fun!


    The Linux OS is an amazing and reliable system. And there are thousands of Linux
    software programs for all kinds of uses. By installing and running Linux you can
    get lots of great practical training experience while working with Linux. You
    can work at a Linux desktop and run commonly used software programs. You can also
    work at the Linux command line and learn how to use Linux commands - the way real
    pros do system administration.


    # Linux Quick Start - How to Use Linux Tutorials from CD and Run Linux in Windows


    Linux video tutorials are an excellent, easy and fast way to get started learning
    to use Linux.


    ## Getting Linux Running in Windows - So You Can Learn How to Use Linux in Windows!


    You can download a free Linux virtual machine player and a free Linux virtual
    machine so you can run Linux in Windows. Just download and quickly install the
    free Linux virtual machine player, the same way you install any Windows program.
    This takes about twenty minutes. Then download a free Linux virtual machine and
    uncompress the virtual machine files into a folder on your Windows hard disk.
    Not including the download time, this takes about ten minutes. There is a free
    sample Linux video tutorial that shows every step of how to download the free
    Linux virtual machine player and a free Linux virtual machine, so you can easily
    run Linux in Windows.


    Linux Tips: There are hundreds of free Linux virtual machines available for download
    for lots of popular Linux distributions (versions), including Ubuntu Linux, Debian,
    Red Hat Linux, Fedora Linux, SUSE


    Next, run the virtual machine player and open a Linux processor to get Linux in
    Windows. So now you have Linux running in another window.


    ## Running Linux Tutorials from CD


    Now put the CD that contains the video tutorials in. This causes your browser
    to automatically run and display the list of video tutorials.


    To watch a video, just click on the name of the video tutorial in the list, such
    as "Running Linux in Windows", "Installing Linux from CD", or "Learning How to
    Run Linux Commands" - the tutorial runs in the browser (in Windows). So now you
    have Linux running in another window.


    ## Learning Linux in Windows to Get Real Practical Experience


    Now here''s the best part about running Linux in Windows to get Linux training.
    Not only do you get to watch the Linux videos to see and hear how to use Linux,
    but you also get to use a Linux desktop to run software programs. You can also
    work at the Linux command line and learn how to use commands in the terminal window.


    Linux Tips: To open a terminal window on the Linux desktop to run commands: right-click
    on the desktop and select "Terminal" or "Console" (or similar) or look through
    the menus and select "Terminal" or "Console" (or similar).

