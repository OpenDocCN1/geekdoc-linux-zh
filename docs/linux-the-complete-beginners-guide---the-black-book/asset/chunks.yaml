    # 引言


    我想感谢你下载《Linux 操作系统》这本书。书中包含了关于如何运行 Linux 获取真实体验、系统管理命令，以及在 Windows 上安装 Linux 的步骤和策略，你可以在目录中看到更多。不要听到
    Linux 这个词就皱眉或害怕，它和 Windows 一样用户友好。


    Linux 是一个可下载的操作系统。书中提供的策略是通用的。像 IBM 和 HP 这样的大公司都支持它，而且它是基于 UNIX 的。为用户提供了命令行。


    如果你想使用 Linux，可以将其安装在硬盘的独立分区上，以便同时使用两个操作系统。


    # 关于 Linux 的真相


    ### 安装


    Linux 难安装吗？并不难。大多数人从未在电脑上安装过 Windows，因为它是预装的。与 Windows 相比，Linux 安装更容易。你可以通过图形用户界面进行安装。但真正让人们困惑的是，在想要使用两个系统时，将
    Linux 安装在硬盘的第二个分区上。


    分区是组织硬盘空间的一种，通过创建相互独立的虚拟区域来实现。大多数运行 Windows 的计算机都有一个大空间存放操作系统，即 C 盘。大硬盘可能会被分成较小的部分，称为分区，帮助你更好地组织数据。这些分区通常命名为
    D:、E: 等。你可以在任何一个分区上安装 Linux。


    再次感谢你下载这本书，希望你喜欢它！


