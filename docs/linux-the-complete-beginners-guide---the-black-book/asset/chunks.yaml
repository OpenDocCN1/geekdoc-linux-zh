  trans: '

    现在尝试一下你刚刚看到的 Linux 命令——并做一些实验！


    然后按住 `Alt` 并按 `Tab`，切换到 Linux 视频窗口观看更多 Linux 视频，并学习该命令的更多选项。


    再次按下 `Alt+Tab` 回到 Linux 窗口中的 Linux 命令行提示符，尝试新的 Linux 命令选项。以此此类推。


    # 下载 Linux 虚拟机并在 Windows 中运行 Linux！


    通过运行免费的 Linux 虚拟机播放器并打开免费的 Linux 虚拟机，可以在 Windows 中运行 Linux！这对于需要接受 Linux 培训并想在
    Windows 中学习 Linux 的新 Linux 用户来说太棒了。


    你只需要在 Windows 中下载一个“预安装”的 Linux 虚拟机，将 Linux 下载文件中的虚拟机文件压缩到 Windows 硬盘上的一个文件夹中，然后运行虚拟机播放器即可在
    Windows 中运行 Linux。有许多新的 Linux “变体”（版本）可以作为虚拟机供你选择。你可以尝试使用 Linux 命令来执行 Linux 管理任务——而不会搞乱你电脑系统上的
    Windows！例如，在学习执行 Linux 管理任务时，你可以进行以下操作：创建一个新的 Linux 用户、安装 Linux 软件程序，以及在 Linux
    文件系统中创建或删除目录。


    当你执行这些步骤时，可能会意外导致 Linux 系统停止正常工作。如果发生这种情况，你只需要删除 Linux 虚拟机文件，再次将原始文件压缩到文件夹中，然后重新在
    Windows 中运行 Linux 即可！下面的步骤概述了如何在计算机系统上安装 Linux、如何创建 Linux 虚拟机以及如何在 Windows 中运行
    Linux。


    在计算机系统上“从零开始”安装 Linux 操作系统是一个非常耗费时间的过程。你需要执行以下步骤：


    * 设置系统从 CD / DVD 启动

    * 使用 Linux CD / DVD 启动系统

    * 运行 Linux 安装程序

    * 提供若干 Linux 系统配置设置，例如 Linux 网络设置和分区设置

    * 选择要安装在系统上的 Linux 软件程序

    * 等待成千上万个 Linux 软件程序复制到系统的硬盘上


    要创建一个 Linux 虚拟机，有人会为你完成以下步骤：


    完成在计算机系统上安装 Linux 操作系统的上述所有步骤——作为虚拟机将构成虚拟机的文件压缩成单个文件，并将虚拟机放置在 Linux 服务器上，作为一个免费的
    Linux 下载文件。


    要在 Windows 中运行 Linux，你只需要：


    * 下载并安装虚拟机播放器程序

    * 下载一个包含压缩后的 Linux 虚拟机文件的单个文件

    * 将虚拟机文件压缩到文件夹中

    * 运行虚拟机播放器

    * 打开（并运行）Linux 虚拟机


    要运行 Linux 命令，打开终端窗口以获取命令行。一旦运行起虚拟机，你就可以进入命令行运行命令。这是学习如何执行管理任务的最佳方式。你可以在虚拟机旁配合
    Linux 教程来学习如何使用。只需看一看关于命令的视频，然后进入虚拟机尝试该命令！这是获得培训和实验使用 Linux 的绝佳方法


    # 如何使用 Linux 命令组件


    Linux 命令 - 命令的伟大之处在于它们在不同发行版（版本）之间几乎是相同的。因此，真正的管理工作是在命令行中运行命令完成。对于 Linux 新手来说，学习如何运行
    Linux 命令可能困难，因此这里有一些提示可以帮助你在命令行提示符工作时学习如何使用 Linux 命令。


    一个 Linux 命令主要包含三个部分：


    1. Linux 命令名

    2. 可与 Linux 命令配合使用的选项

    3. Linux 命令所运行的“项(item)”


    当你运行 Linux 命令时，命令名、命令选项和命令所运行的“项”之间会使用空格。“项”可以是 Linux 目录、文件或其他软件组件。例如，你在目录上运行
    Linux 命令 `ls`（用于 list）来查看目录中的文件列表。你在目录上运行 Linux 命令 `rm`（remove）来从 Linux 文件系统中删除该目录。要运行
    Linux 命令，你输入命令名称以及命令的其他任何部分（如选项），并按下 Enter 键。你可以在下方看到创建新 Linux 用户的 Linux 命令示例。`useradd`
    命令正在用户名 bthatcher 上运行以创建此 Linux 用户。


    Linux 提示：Linux 命令在 Linux 命令行提示符运行，该提示符显示为命令左侧的 `#`。你不需要输入提示符，而是在提示符右侧输入 Linux
    命令。


    Linux 提示：Linux 命令提示符也可能显示为 `$` 或其他符号，而不是 `#` 或 `$`。


    ```

    useradd -c "Becky Thatcher" bthatcher

    ```


    这条 Linux 命令创建一个名为 bthatcher 的新 Linux 用户，全名为 "Becky Thatcher"。`-c`（用于 comment）选项在此命令中使用，用于将全名作为注释添加到
    Linux 用户名 bthatcher 中。获取 Linux 培训最简单、最好的方法之一是在 Linux 视频教程中查看 Linux 命令的运行。通过这种方法——你可以看到、听到并实操。在
    Linux 视频教程中，你可以看到并听到如何运行 Linux 命令，并看到和听到命令输出的描述。你可以学会自己运行命令！


    # 运行 Linux 获取真实经验


    通过使用终端窗口获取命令行来获得真实经验是学习最好的。


    ## 获取 Linux 培训的 5 种


    1. 在新电脑上“安装” Linux

    这是开始最简单的方法之一。几家主要零售商提供预装了 Linux 的电脑。只需购买、启动并开始即可！


    2. 在没有 Windows 的系统上安装 Linux

    你可以从 CD 在没有操作系统（如 Windows）的新系统或旧系统上安装 Linux。


    3. 在 Windows 系统上安装 Linux

    如果你不想为 Linux 购买新电脑，你可以在现有的 Windows 系统上安装 Linux。当你这样做时，创建一个“双引导”（Linux 和 Windows）系统。在你安装完
    Linux 并启动系统后，将出现一个菜单，允许你启动到 Windows 或启动到 Linux。在这种情况下，你不需要专门为 Linux 购买一台电脑。但也有一个缺点：如果你在安装过程中出错，甚至在稍后删除了
    Linux，你也可能会丢失所有的 Windows 程序和数据！Linux 提示：在安装 Linux 之前和删除 Linux 之前，务必备份你的系统。


    4. 使用 Linux“live”CD 或 DVD 版本启动系统

    这非常有趣且非常简单！你可以通过使用 Linux live CD 或 DVD 启动系统来使用 Linux live 版本。只需将 Linux live CD
    / DVD 放入驱动器并启动系统。一旦系统启动，Linux 就会自动启动并“现场”运行。无需安装！Linux 提示：如果你没有高速网络连接来下载 Linux，你可以购买
    CD 或 DVD 版本的 Linux，并以非常低廉的价格将其邮寄到世界上任何地方。


