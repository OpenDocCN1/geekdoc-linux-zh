- fmt: '

    Now try the Linux command you have just seen - and experiment a bit!


    Then hold down `Alt` and press `Tab` and go to the Linux video window to watch
    a bit more of the Linux video and learn some more options of the command.


    Then press `Alt+Tab` again to go to the Linux command line prompt in the Linux
    window and try the new Linux command options. And so on.


    # Download Linux Virtual Machines and Run Linux in Windows!


    You can run Linux in Windows by running a free Linux virtual machine player and
    opening a free Linux virtual machine! This is fantastic for a new Linux user who
    needs to get Linux training and wants to learn Linux in Windows.


    You just download Linux in Windows as a "pre-installed" virtual machine,compress
    the virtual machine files in the Linux download file into a folder on the Windows
    hard disk, and then run a virtual machine player to run Linux in Windows. There
    are lots of new Linux "flavors" (versions) available as virtual machines to choose
    from. You can experiment with Linux commands to do Linux administration tasks
    - without messing up Windows on your computer system! For example, while learning
    to do Linux administration tasks, you do things like: create a new Linux user,
    install Linux software programs, and create or delete directories in the Linux
    file system.


    When you do these steps, you may accidentally cause the Linux system to stop working
    properly. If this happens, all you have to do is erase the Linux virtual machine
    files,compress the original files into their folder again, and start running Linux
    in Windows again! The steps below outline how Linux is installed on a computer
    system, how a Linux virtual machine is created, and how to run Linux in Windows.


    Installing the Linux OS on a computer system "from scratch" is a very time-consuming
    process. You do the following steps:


    * Set up the system to boot from CD / DVD

    * Boot the system with a Linux CD / DVD

    * Run the Linux installation routine

    * Provide several Linux system configuration settings, such as Linux networking
    settings and partition settings

    * Select the Linux software programs to be installed on the system

    * Wait while thousands of Linux software programs are copied onto the hard disk
    of the system


    To create a Linux virtual machine, someone does the following steps for you:


    All the steps above to install the Linux OS on a computer system - as a virtual
    machine compresses the files that make up the virtual machine into a single file
    puts the virtual machine on a Linux server as a free Linux download file


    To run Linux in Windows, you just:


    * Download and install the virtual machine player program

    * Download a single file containing the compressed Linux virtual machine files

    *compress the virtual machine files into a folder

    * Run the virtual machine player

    * Open (and run) the Linux virtual machine


    To run a Linux command, open a terminal window to get the command line. Once you
    get a virtual machine running, you can go to the command line and run commands.
    This is the best way to learn how to do administration tasks. And you can use
    Linux tutorials along your virtual machine to learn how to use. Just watch a bit
    of video on a command and then go to the virtual machine and try the command!
    This is a great way to get training and experiment using Linux


    # How Use Linux Command Components


    Linux Commands - The great thing about commands is that they are virtually identical
    from one distribution (version) to another. So the real administration is to work
    at the command line and run commands. Learning how to run a Linux command can
    be difficult for someone new to Linux, so here are some tips that will help you
    learn how to use Linux commands when working at the command line prompt.


    There are three main parts of a Linux command:


    1. The Linux command name

    2. Options that can be used with the Linux command

    3. The "item(s)" that the Linux command is being run on


    When you run a Linux command, spaces are used between: the command name, the command
    options and the "item" the command is being run on. The "item" could be a Linux
    directory, file or other software component. For example, you run the Linux command
    `ls` (for list) on a directory to see a list of files in the directory. You run
    the Linux command `rm` (remove) on a directory to remove the directory from the
    Linux file system. To run a Linux command, you type in the name of the command,
    and any other parts of the command, such as options, and press the Enter key.
    You can see an example of the Linux command that is used to create a new Linux
    user below. The `useradd` command is being run on the bthatcher user name to create
    this Linux user.


    Linux Tips: Linux commands are run at the Linux command line prompt and this prompt
    is shown as `#` at the left of the command. You don''t type in the prompt, you
    type the Linux command at the right of the prompt.


    Linux Tips: The Linux command prompt may also appear as `$` or as another symbol,
    instead of `#` or `$`.


    ```

    useradd -c "Becky Thatcher" bthatcher

    ```


    This Linux command creates a new Linux user named bthatcher with the full name
    of "Becky Thatcher". The `-c` (for comment) option is used with this command to
    add the full name as a comment to the Linux user name of bthatcher. One of the
    easiest and best ways to get Linux training is to see Linux commands being run
    in Linux video tutorials. With this method - you see, hear and do. With a Linux
    video tutorial, you see and hear how to run a Linux command and see and hear a
    description of the output of the command. You can learn to run commands yourself!


    # Running Linux to Get Real Experience


    You learn best by getting real experience using a terminal window to get the command
    line.


    ## 5 Ways to Get Linux Training


    1. Get Linux "installed" on a new computer

    This is one of the easiest ways to start. Several major retailers offer Linux
    pre-installed on it. Just buy it, boot it and start!


    2. Install Linux on a system that doesn''t have Windows

    You can install Linux from CD on a new or used system that doesnt have an operating
    system (like Windows).


    3. Install Linux on a Windows system

    If you don''t want to buy a new computer for Linux, you can install Linux on an
    existing Windows system. When you do this, create a "dual boot" (Linux and Windows)
    system. After you install Linux and boot your system, a menu will appear allowing
    you to boot into Windows or boot into Linux. In this case, you don''t need to
    buy a computer just for Linux. But there is a downside: if you make a mistake
    during the installation, or even you delete Linux later, you may lose all your
    Windows programs and data! Linux Tips: Be sure to back up your system before you
    install Linux and before you remove Linux.


    4. Boot a system with a Linux "live" CD or DVD version

    This is quite fun and very easy to do! You can work with a Linux live version
    by booting a system with a Linux live CD or DVD. Just put the Linux live CD /
    DVD in your drive and start your system. As soon as your system boots, Linux will
    automatically start and run "live". No installation required! Linux Tips: If you
    don''t have a high-speed connection to download Linux, you can buy Linux on CD
    or DVD and have it mailed to you anywhere in the world for a surprisingly small
    amount of money.

