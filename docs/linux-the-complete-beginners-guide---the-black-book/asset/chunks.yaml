  trans: '


    一位名为 Linus Torvalds 的程序员在 1991 年首次创建了 Linux，作为 Unix 操作系统的一个变体。Linus Torvalds 通过
    GNU (GPL)（通用公共许可证）使 Linux 开源，这样其他程序员就可以免费下载源代码并按照他们认为合适的方式进行修改。全球成千上万的程序员开始下载并修改
    Linux 源代码，应用补丁、修复错误以及其他改进，使该操作系统变得越来越好。多年来，Linux 已从一个简单的基于文本的 Unix 克隆版本演变为一个强大的操作系统，具有功能全桌面环境、前所未有的移植性以及多种用途。多年来，大部分原始的
    Unix 代码也逐渐从 Linux 中被编写移出。


    由于 Linux 是开源软件，因此没有单一的 Linux 版本；相反，许多不同的 Linux 版本或发行版，它们适用于不同的用户和任务。某些 Linux 发行版包括
    Gentoo 和 Slackware，由于缺乏完整的图形环境，这些版本最适合 Linux 专家、程序员以及其他熟悉命令行提示符的用户。缺乏图形环境的发行版最适合缺乏处理图形所需计算能力的旧电脑，或者用于执行处理器密集型任务的计算机，在这种情况下，人们希望将所有系统资源集中于当前任务，而不是通过处理图形来浪费资源。


    其他发行版旨在让计算体验尽可能简单。诸如 Ubuntu 等发行版通过提供功能全图形环境来帮助消除对命令行提示符的需求，使 Linux 变得更加易用。当然，易用性的缺点是配置性较低，并且在图形处理上浪费了系统资源。其他发行版如
    FUSE 则试图在易用性和可配置性之间寻找平衡点。


    “Linux 包含两个部分，它们包括之前提到的内核（Kernel），在大多数情况下，它还包括一个运行在内核之上的图形用户界面（GUI）”参考文 #3。在大多数情况下，用户将通过图形用户界面与计算机通信。（ref
    #6）可以在 Linux 上运行的较常见的图形环境包括以下：KDE GUI（图形用户界面）。


    Matthias 在 1996 年开发了 KDE。他希望为 Unix 桌面开发一个 GUI，让所有的应用程序看起来和感觉都相似。他还希望为 Unix 提供一个比当时可用版本更易用的桌面环境。KDE
    是一个免费开源项目，有数百万程序员在工作，但也得到了来自 Novell、Troll 和 AMD 等公司的商业支持。KDE 旨在提供一个无需配置的易用桌面环境。Windows
    用户可能会发现 KDE 的外观与 Windows 相似。另一个流行的 GUI（ref #7）是 GNOME。GNOME 专注于简单和可用。像 KDE 一样，GNOME
    是开源且免费的。GNOME 的一个显著特点是支持许多不同的语言；GNOME 支持超过 100 种语言。在 LGPL 许可证（较小通用许可证）下的 Gnome
    允许为 GNOME 编写的应用程序使用更广泛的集。GNOME 代表 GNU Network Environment（GNU 网络环境）。GNOME 的外观和感觉与其他桌面相似。Fluxbox
    是另一个 Linux GUI 示例。Fluxbox 不太强调易用性，旨在成为非常轻量且高效的资源使用者。界面只有任务栏和菜单栏，通过点击桌面即可访问。Fluxbox
    最常用于系统资源有限的旧电脑。


    尽管大多数 Linux 发行版都提供图形环境以简化用户体验，但它们也提供了一种方法，让技术性更强的用户通过 Shell 或命令行直接与内核通信。命令行允许你在没有
    GUI 的情况下运行计算机，从基于文本的界面执行命令。使用命令行提示符的优势是它使用的系统资源较少，并使你的计算机将更多精力集中在当前任务上。命令示例包括用于更改目录的
    `cd` 命令，用于关闭系统的 `halt` 命令，或用于重启电脑的 `reboot` 命令等。


    现在我们对 Linux 操作系统已经更加熟悉，我们可以注意到 Linux 与世界上最流行的操作系统 Microsoft Windows 之间的许多不同。从这里开始，我们将讨论
    Linux 与 Windows 的一些显著区别。


    首先，只有一家公司发布 Windows 操作系统，那公司就是微软。所有的 Windows 版本，无论是 Windows XP 家庭版、商业版还是 Vista，所有的更新、安全补丁和服务补丁都来自微软。相比之下，Linux
    并不是由一家公司发布的。Linux 全范围内有数百万程序员自愿提供他们的软件、更新和补丁。尽管某些公司为 Linux 提供支持，但你需要自力而为。尽管某些公司为
    Linux 提供支持，但你需要自力而为。尽管某些公司为 Linux 提供支持，但你需要自力而为。尽管某些公司为 Linux 提供支持，但你需要自力而为。尽管某些公司为
    Linux 提供支持，但你需要自力而为。尽管某些公司为 Linux 提供支持，但你需要自力而为。

    '
- fmt: '

    Modify it in virtually any way that you see fit. Also Linux offers a variety of
    graphical environments to further suit your needs. As mentioned earlier, Linux
    is capable of running full-featured graphical environments like `KDE`, or more
    lightweight and resource friendly GUIs like `Fluxbox`, or `Blackbox`, to suit
    users with older computers. There are also versions of Linux that are designed
    to emulate the Windows look and feel as close as possible. Distributions such
    as `Linux` are best suited for users that are migrating over from the Windows
    world.


    There are also distributions that include no graphical environment at all to better
    suit users that need to squeeze out all of the computing power that they can get
    for various computing activities, and for users that are more advanced than others.
    All of this configurability can be problematic sometimes, as you will have to
    make a decision on which desktop is right for you, and to make things easier yourself
    you will need to only install applications that are native to your distribution
    and graphical environment.


    ### Cost

    The cost effectiveness of Linux is another way it separates itself from Windows.
    For home use Linux is cheap and in most cases completely free, while Windows varies
    in cost depending on which version you buy. With Linux most of the applications
    will also be free, however, for Windows in the majority of cases you are supposed
    to pay for the applications. For most cases, with Linux there is no need to enter
    a product activation key when performing an installation, you are free to install
    it on as many computers as you''d like. With Windows you are only allowed to install
    it on one computer and Microsoft uses product activation software to enforce this
    rule.


    When installing Windows you must enter a product activation key, which will expire
    after so many uses. If you wish too, you can purchase Linux from a variety of
    vendors, which will include a boxed set of CDs, Manuals, and TECH support for
    around $40-130. Of course if you purchase a high-end version of Linux used for
    servers it may cost anywhere from $400-$2000. "In 2002 computer world magazine
    quoted the technology architect at Merrill Lynch in New York, as saying ''the
    cost of running Linux is typically a tenth of the cost of running Unix or Windows
    alternatively.''" (ref#1)


    ### Installation

    Installation of Windows is generally easier than installing Linux. "With Windows
    XP there are three main ways to install. There is a clean install, in which you
    install Windows on a blank hard drive. There is also an upgrade install, in which
    you start with an older version of Windows and ''upgrade'' to a newer. An advantage
    of upgrading is that all of the files on the older system should remain throughout
    the processes. You can also perform a repair install, which as you installing
    the same version of Windows on top of it in order to fix a damaged version.


    There is also a recovery, which technically is not an install; it is used to restore
    a copy of Windows back to settings. The disadvantage of recovering Windows is
    the fact that you will lose all data which remains on the damaged copy of Windows."
    (ref#1) Also with Windows you can rest assured that your hardware will most likely
    supported by the software, although this is not much of a problem with Linux you
    cannot support. Linux installation varies greatly from Distro. You may be presented
    with a graphical install or it may be a text-based install; these versions make
    Linux a bit more difficult and impossible to install than Windows (although the
    difficulty is disappearing). You may perform clean install of Linux or dual boot
    to coexist with another operation software. With Linux rather than having to buy
    Cd, you can install updates by downloading and installing them while your desktop
    is running. With Linux it is also not necessary to reboot your computer after
    most upgrades it is only necessary to reboot after an upgrade to the kernel.


    It is also possible to run Linux without ever needing to install it on a hard
    drive; there are many distributions of Linux that will allow you to run straight
    off a live cd. The advantage of this is that you do not need alter your system
    in order to try Linux. You can run Linux off the CD so you do not have to damage
    your Windows partition. Other advantages include the ability to rescue a broken
    Linux system. If your Linux computer will not boot, then you may insert a live
    cd and boot off it, so you can repair the damaged version of Linux. Also you may
    use a Linux live cd to recover files from a damaged Windows computer that no longer
    boot up. Since Linux is capable of reading NTFS files you may copy files from
    a Windows computer to a USB flash drive or floppy drive etc.


    Another major difference between Linux and Windows is the applications that you
    will use with either OS. Windows includes a much wider abundance of commercially
    backed applications than does Linux. It is much easier to find the software that
    you are looking for with Windows than it is with Linux, because so many software
    vendors make their products compatible with Windows only. With Linux you will
    for the most part be forced to let go of family applications that you have grown
    accustomed to Windows, in favor of open source apps that are made for Linux. Applications
    such as Microsoft Office, Outlook, Inkscape, Adobe Creative suite, and chat as
    messenger do not work natively with Linux. Although with Linux you can get Microsoft
    office and Adobe suite to work using software called Over Office. In using these
    applications you will need open office GIMP Image Editor Thunderbird mail client
    In using MSN you can use GAIM messenger and can use Firefox as your web browser.
    Also with Linux can be difficult to install software even if it is made for Linux.
    This is due to the fact that Linux has many different versions. Software that
    is made to install on one version probably require some configuration in order
    to on another. An example would be if you trying to install software that was
    made for KDE graphical environment, on GNOME this app would not easily install
    on GNOME and would require some configuring. The type of hardware that Linux and
    windows runs on also causes them to differ. Linux will run on many different platforms,
    from Intel and AMD chips to computers running IBM processors. Linux will run on
    the slowest 386 machines to the biggest mainframes on planet. New versions of
    Windows will not run on the same amount of hardware as Linux. Linux can even be
    configured to run on Apples, iPod''s, or smartphones. A disadvantage of Linux
    is when it comes to hardware devices such as Printers, Scanners, or Digital cameras.
    Where as driver software for these devices will often be easily available for
    Windows, with Linux you are for the most part left on your own to find drivers
    for these devices. Most Linux users will find comfort in the fact that drivers
    for the latest hardware are constantly being written by coders throughout the
    world and are usually quickly quickly available.


    One of the most notable differences between the two operating softwares is Windows
    legendary problems with malicious code, known as Viruses and Spy ware. Viruses,
    Spy-ware and a general lack of security are the biggest problems facing the Windows
    community. Under Windows Viruses and Spy-ware have the ability to execute themselves
    with little or no input from the user. This makes guarding against them a constant
    concern for any Windows user.

