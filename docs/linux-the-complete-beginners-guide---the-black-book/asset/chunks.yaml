    With a Linux script, you put a series of routine run commands in a text file,
    and then run all of them by simply typing the name of the file and pressing Enter.


    # Linux Script Example to Create a Script to Automatically Run a Series of Linux
    System Administration Commands


    Follow along with the steps in the example below to create and run your first
    Linux script!


    1. Run a Linux text editor.

    2. Put the following text at the top left of the text file (indented below for
    emphasis):


    ```

    #!/bin/bash

    ```

    This indicates that the text file is a Linux script file.

    Press Enter twice to have a blank line below the line above.

    3. Put the Linux command(s) in the script file.


    The Linux commands below are used to provide an example. You can put any commands
    in a script.


    The Linux commands below will: clear the screen, change into the `/etc` directory
    path, and then show the current path with the Linux `pwd` (path to working directory)
    command.


    Then provide a long list of the `fstab` file (to show you it''s there) and then
    change into your home directory (represented by the `~` symbol) and then show
    the path of the current directory.


    The Linux `echo` command is not required, but has been put in the file to show
    the progress of the execution of the script.


    Also, you don''t need to indent the commands below in the Linux script - they
    are just indented here for emphasis.


    ```

    clear

    echo The screen has been cleared

    cd /etc

    pwd

    echo This is the etc directory

    ls -l fstab

    echo This is a long listing of the fstab file

    cd ~

    echo Now in home directory

    ```


    ## Linux Commands Tips


    A Linux script can contain hundreds of lines of text - also include programming
    logic such as `if ... then`.


    4. Save the text script with a meaningful name to create it and give it a name.
    For example, if you want to list files in a few directories, call the file `listdirs`.

    5. Run the `chmod` command to change permissions of the file and make the Linux
    text "executable".


    In our example, the file is named `listdirs`. Below is a Linux `chmod` command
    example for running the `chmod` to change permissions of the Linux script - and
    make `listdirs` text "executable", so that you can run script in the same way.
    The `$` (dollar sign) below is the Linux command prompt. Don''t type in the `$`
    (dollar sign), type in the command that appears at the right of the `$`.


    ```

    chmod +x listdirs

    ```

    The Linux command above is `chmod` and it is being used to assign the `x` (executable)
    permission to the `u` (user) of the file with `u+x` and the script name is `listdirs`.


    ### Running a Linux Script to Run System Commands


    To run a Linux script (that is in the "current" directory), such as the `listdirs`
    script, simply type a period (dot) and space and then the name of the file and
    press Enter.


    ```

    . listdirs

    ```

    The concepts and Linux examples above work in Red Hat, Ubuntu, Fedora, Debian
    - and ALL Linux distributions.


    # How To Get A Red Hat Linux Certification


    ## Should I Get A Linux Certification?


    Well, the first question you might have is why should you get a Linux certification?
    The answer to this is similar to getting certifications in general. It helps to
    provide your knowledge in the Linux operating system by testing and passing a
    minimum standard of knowledge.


    It can also help you get a job in the industry. Many jobs require or prefer a
    certification in Linux, such as Linux administrators or general server administrators.
    It can also add to your existing Linux knowledge, which you could apply to your
    current job.


    ## Which Linux Certification Should I Get?


    This could be an entire post on its own - I''ll include all the information here
    in one convenient place. There are four main providers of Linux certifications,
    and they all offer a range of different certifications for different levels.


    ### Novell

    They offer a range of certifications, with labels of Engineer, Professional and
    Desktop Administrator.

    * Certified Linux Engineer 11 (`CLE11`) - engineer-level skills for managers and
    architects on large systems based on SUSE Linux Enterprise Server 11. You need
    to have passed Certified Linux to be eligible for this.

    * Certified Linux Administrator 11 (`CLA11`) - a new certification, focusing on
    administration of SUSE Linux Server networks.

    * Certified Linux Desktop (`CLDA`) - focused on those with experience and wish
    to learn SUSE Linux Desktop.

    * Certified Linux Professional 11 (`CLP11`) - provides skills to administer SUSE
    Linux Server.


    ### CompTIA

    * CompTIA provides a single certification, `Linux+`.

    * `Linux+` - entry-level certification for those looking to get into Linux field.


    ### Linux Professional Institute

    The Linux Professional Institute, other known as LPI, offer a few certifications.

    * Linux Professional Institute Level 1 (`LPIC-1`) - a junior level certification
    that tests skills in major distributions.

    * Linux Professional Institute Level 2 (`LPIC-2`) - an advanced level certification
    that includes skills in administration. Passing `LPIC-1` is required for this.

    * Linux Professional Institute Level 3 (`LPIC-3`) - a senior level certification
    for major distributions that offer server specialties. Passing `LPIC-2` is required
    for this.


    ### Red Hat

    Red Hat offer a few certifications for their distribution of Linux.

    * Red Hat Certified System Administrator (`RHCSA`) - a lower-level Linux certification
    that covers the basics of administration.

    * Red Hat Certified Engineer (`RHCE`) - more advanced Linux certification, aimed
    at Linux professionals. Passing the `RHCSA` is a requirement for this certification.

    * Red Hat Certified Virtualization Administrator (`RHCVA`) - focused on deploying
    virtual hosts in the Linux environment.

    * Red Hat Certified Security Specialist (`RHCSS`) - focused on security features
    and areas of Linux.

    * Red Hat Certified Data Specialist (`RHCDS`) - focused on the requirements for
    administering and supporting data environments.

    * Red Hat Certified Architect (`RHCA`) - the highest level of Red Hat certification,
    this focuses on expert topics of Linux administration and use.


    ## Which Linux certification should you get?


    It depends on your experience and requirements. There are several junior Linux
    certifications (`Linux+`, `RHCSA`, `LPIC`, `CLE11`) that could be useful if you''re
    looking to start out. More advanced certifications such as `RHCE`, `LPIC-2`, `CLA11`
    and `CLP11` can be beneficial if you have more experience. If you''re a senior
    professional in the area, I''d look into `RHCA` or `LPIC-3`.

