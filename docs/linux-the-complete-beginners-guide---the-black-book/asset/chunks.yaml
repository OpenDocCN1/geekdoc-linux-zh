  trans: "\nWindows 98 在整个硬盘上创建一个名为 FAT32 的文件系统，DOS 和 Win95 使用 FAT16。Linux 有许多文件系统——最流行的是\
    \ ext3。但你也可以将 Linux 安装在 FAT32 分区上。\n\nLinux 非常困难，并且基于文本命令。\n\nLinux 从作为精明电脑用户的系统到现在，已经走了很长一段路。它拥有极其先进的\
    \ X Windows 系统，具有完整的图形用户界面——你懂的，就像 Windows 一样。它还有大量的窗口管理器，允许你对桌面进行不同程度的自定义。\n\n\
    Linux 拥有一个健壮的字符单元界面，在其中需要输入命令。x Windows 是一个运行在 Linux 上的免费程序，提供一个可以广泛使用鼠标和键盘的 GUI。但\
    \ X 系统本身相当原始，需要窗口管理器或桌面环境（如 GNOME 或 KDE）才能变得真正易用。窗口管理器是可以通过中继命令让你与底层的 X 系统和 Linux\
    \ 操作系统交互的程序。流行的窗口管理器有 Sawfish、Enlightenment、Black box、after step 和 Window maker。至于桌面管理器，它们有自己的窗口管理器和其他工具，让你感觉像是在\
    \ Windows 中工作一样！GNOME 和 KDE 是这些中最流行的。GNOME 代表 GNU 网络模型环境，KDE 代表 K 桌面环境。它们拥有允许拖放的工具，拥有面板和任务栏——几乎是\
    \ Windows 的克隆。\n\n### 硬件兼容性问题以及在 Linux 上运行的应用程序\n\n嗯，大多数新发行版都能在短时间内检测并配置你的硬件，除非你有一些非常老旧或奇特的硬件。所有硬件都能被正确检测并安装驱动程序。只有\
    \ Win 调制调器（由 Windows 驱动驱动的内部调制调器）会面临问题。软件方面，有很多。而且大部分都是免费提供给你的，供你根据需要使用、修改和配置。几乎所有优秀的\
    \ Linux 软件都是免费的，尝试一下并不会损失任何东西。你可以在网络任何地方获得免费支持。你甚至不需要删掉 Windows。只需将 Linux 安装在不同的硬盘分区上，并随心所欲在它们之间切换。其他包是商业性的，你必须购买软件——但这主要是为了你需要的软件和培训，而不是，本身。有时，如果你有\
    \ Windows 版本（作为一种恩赐），你可以下载一个小程序，让你在 Linux 中运行该游戏。Linux 上的游戏质量非常高，功能也很丰富。你会喜欢它们的。这里有：\n\
    \n- 办公套件：Star Office, Open Office, Applewriter, WordPerfect\n- 图形：GIMP, Coral\
    \ Paint\n- 音乐：XMMS, Real Player\n- 视频：MTV Xine\n- 游戏：Tux racer, Quake, Epic，列表正在不断增长。\n\
    \n### 面用户的 Linux 版本\n\n如果有这么多人在致力于它，可能也有很多版本。有些 Linux 发行版带有额外的软件进行编译发布。由 Red 开发的\
    \ Red 包管理器（RPM）格式几乎成为 Linux 世界软件分发的标准。安装新软件非常容易。它还有一个先进且易用的字体系统，让 X 中的字体看起来很好。\n\
    \nLinux：Linux 现在是第 10 版本了。它可以使用 Lin4Win 安装在原生的 Windows 分区上，但这可能会减慢机器速度。它还允许你将传统的\
    \ Linux 安装到自己的分区中。Linux 的配置和软件安装是非常轻松的。它遵循一种略微修改的 `mdk.rpm` 架构，但大多数 Red 软件也可以用于\
    \ Linux。该版本突出的特征是窗口管理器的集合——粉丝将度过一段美好的时光。\n\nSUSE：来自德国的变色龙，SUSE。现在处于 8.x 版本，它拥有编译的最广泛的软件包之一，通过\
    \ yast（另一个软件工具）可以轻松地安装它们，yast 提供了一个集中式界面，你可以在其中选择要安装的软件。除其他外，SUSE 还带有一些惊艳的 3D\
    \ 游戏，展示了 Linux 的游戏实力。\n\nCorel/Xandross：Coral 几年前凭借 Coral Linux 进入 Linux 市场。现在它已合并为基于\
    \ Coral Linux 的 Xandross OS。这是一个 Debian 类型的版本，在调整 Windows 分区大小后，可以方便地安装。Xandross\
    \ 包含了 Crossover office，它是 WINE 的精炼零售版，允许你安装和运行许多微软应用程序。\n\n### Linux 中的 Windows\
    \ \n\n某些应用程序已迁移到 Linux，或者通过一个名为 `WINE` 的程序（不是模拟器）运行。Crossover 是另一个让你运行 Windows\
    \ 应用程序的专用程序。Linux 的重点在于大多数软件都是免费的，你可以使用它们。如果你担心 Linux 看起来不像 Windows，Linux 有很多种界面。如果你有一台同时运行两者的\
    \ PC，你可以轻松地在它们之间切换，获得两者的所长。\n\n### Linux 与 Windows 区别\n\n这个子主题将讨论 Linux 和 Windows\
    \ 区别，我会讨论每个系统的某些方面。让我们先从 Linux 系统的概览开始。Linux 最基本的形式是计算机内核。内核是底层代码，用于与硬件和其他系统软件通信，它还运行计算机的所有基本功能。Linux\
    \ 内核是一个操作系统，运行在各种硬件上并用于多种目的。Linux 能够运行在手表或手机等简单设备上，也可以运行在使用 Intel 或 AMD 处理器的家用电脑上，甚至能够运行在使用\
    \ Sun CPUs 或 IBM power PC 处理器的高端服务器上。某些 Linux 发行版只能运行一个处理器，而其他可以同时运行多个。Linux 的常见用途包括家用桌面计算系统，或者更常见的服务器应用程序，例如作为\
    \ Web 服务器或邮件服务器。\n\n"
- fmt: '

    A programmer named Linus Torvalds first made Linux as a variant of the Unix operating
    system in 1991. Linus Torvalds made Linux open source with the GNU (GPL) (General
    Public License), so other programmers could download the source code free of charge
    and alter it any way they see fit. Thousands of coders throughout the world began
    downloading and altering source code of Linux, applying patches, and bug fixes,
    and other improvements, to make the OS better and better. Over the years Linux
    has gone from a simple text based clone of Unix, to a powerful operating software,
    with full-featured desktop environments, and unprecedented portability, and a
    variety of uses. Most of the original Unix code has also been gradually written
    out of Linux over the years.


    As a result of Linux being open source software, there is no version of Linux;
    instead there are many different versions or distributions of Linux, that are
    suited for a variety of different users and task. Some Distributions of Linux
    include Gentle, and Slackware, which due to the lack of a complete graphical environment
    is best, suited for Linux experts, programmers, and other users that know their
    way around a command prompt. Distributions that lack a graphical environment are
    best suited for older computers lacking the processing power necessary to process
    graphics, or for computers performing processor intensive task, where it is desirable
    to have all of the system resources focused on the task at hand, rather than wasting
    resources by processing graphics.


    Other distributions aim at making the computing experience as easy as possible.
    Distributions such as Ubuntu, or make Linux far easier to use, by offering full-featured
    graphical environments that help eliminate the need for a command prompt. Of course
    the downside of ease of use is less configurability, and wasted system resources
    on graphics processing. Other distributions such as Fuse try to find a common
    ground between ease of use and configurability.


    "Linux has two parts, they include the Kernel mentioned previously, and in most
    circumstances it will also include a graphical user interface, which runs atop
    the Kernel" reference #3. In most cases the user will communicate with the computer
    via the graphical user interface. (ref #6) Some of the more common graphical environments
    that can run on Linux include the following. The KDE GUI (Graphical user interface).


    Matthias developed KDE in 1996. He wanted a GUI for the Unix desktop that would
    make all of the applications look and feel alike. He also wanted a desktop environment
    for Unix that would be easier to use than the ones available at the time. KDE
    is a free open source project with millions of coders working on it but also has
    some commercial support from companies such as Novell, Troll, and AMD. KDE aims
    to make easy use desktop environment without configurability. Windows users might
    not that KDE has a similar look to Windows. Another popular GUI (ref #7) GNOME.
    GNOME focuses on simplicity and user usability. Like KDE GNOME is open source
    and is free. One notable feature of GNOME is the fact it supports many different
    languages; GNOME supports over 100 different languages. Gnome under the LGPL license
    (lesser general license) allows applications written for GNOME to use a much wider
    set. The name GNOME stands for GNU Network Environment. GNOME''s look and feel
    is similar to that of other desktops. Fluxbox is another example of Linux GUI.
    With less emphasis on ease of use Fluxbox aims to be very lightweight and efficient
    user of resources. The interface has only taskbar and a menu bar, which is accessed
    by clicking over desktop. Fluxbox is most popular for use with older computers
    that have limited abundance of system resources.


    Although most Linux distributions offer a graphical environment, to simplify the
    user experience, they also offer a way for more technically involved users to
    directly communicate with the Kernel via a shell or command line. The command
    line allows you to run the computer without a GUI, executing commands from a text-based
    interface. An advantage of using the command prompt is it uses less system resources
    and enables your computer to focus more of its energy on the task at hand. Examples
    of commands include the `cd` command for changing your directory, or the `halt`
    command for shutting down your system, or the `reboot` command for restarting
    the computer etc.


    Now that we are more familiar with the Linux operating system, we can note the
    many ways in which Linux differs from the world most popular OS, Microsoft Windows.
    From this point we will discuss some of the more prominent ways in which Linux
    differs from Windows.


    For starters there is only one company that releases a Windows operating system,
    and that company is Microsoft. All versions of Windows, whether Windows XP Home,
    Business, or Vista, all updates, security patches, and service patches for Windows
    comes from Microsoft. With Linux on the other hand there is not one company that
    releases it. Linux has millions of coders throughout the world, volunteering their
    software, updates, and patches. Although some companies provide support for Linux,
    you are on your own. Although some companies provide support for Linux, you are
