- fmt: '

    Windows 98 creates a file system called FAT32 on the entire hard disk, DOS and
    Win95 use FAT16. Linux has many file systems-the most popular is ext3. But you
    could have Linux installed on Fat32 partitions also.


    Linux is very difficult and based on text command


    Linux has come some a long way from being the system of brilliant computer users.
    It has extremely advanced X Windows systems that have a complete graphical user
    interface-you know, like Windows. It also has a large number of window manager
    that let you work with different levels of customization of your desktop.


    Linux has a robust character-cell interface where commands need to be typed in.
    x Windows is a free program that runs with Linux to provide a GUI where the mouse
    and keyboard can be used extensively. But the X system itself is quite primitive
    and needs a window manager, or a desktop environment-like GNOME or KDE to be really
    usable. Window managers are programs that let you interact with the underlying
    X system and Linux OS by relaying commands. The popular window managers are Sawfish,
    Enlightenment, Black box, after step and Window maker. As for desktop managers,
    they have their own window manager and other tools that make you feel that you
    are working in Window! GNOME and KDE are the most popular of these. GNOME stands
    for GNU Network Model Environment and KDE for K Desktop Environment. They have
    tools that allow drag and drop, have panels and taskbar-almost like clones of
    windows.


    ### Hardware compatibility problem and few applications that run on Linux


    Well, most new distributions will detect and configure your hardware in a jiffy,
    unless you have some really old or exotic piece of hardware. All hardware are
    properly detected and their drivers installed. Only Win modems (internal modems
    driven by Window drivers) face problems. As for software, there''s plenty. And
    most of it comes free-free for you to use, modify and configure according your
    needs. Almost all excellent software for Linux is free and you don''t lose anything
    by giving it a try. You get free support on the Network any anywhere you may have.
    And you don''t even have to wipe out your Windows. Just get Linux on a different
    hard disk partition and free to switch between them as please. Other packages
    are commercial and you have to buy the software-but this is mostly for the software
    and training you need, and not for the software itself. Sometimes, if you have
    the Windows version (as a doom) you can download a small program that will allow
    you to play the game in Linux. The games in Linux are of very high quality and
    features. You''ll enjoy them. Here''s available:


    - Office suites: Star Office, Open Office, Applewriter, WordPerfect

    - Graphics: GIMP, Coral Paint

    - Music: XMMS, Real Player

    - Video: MTV Xine

    - Games: Tux racer, Quake, Epic And list is growing.


    ### Linux versions for Users


    If there are so many people working on it there''s likely be many versions to.
    There are Linux distributions that are compiled and released with additional software.
    Red Package Manager(RPM) format developed by Red has almost become the factor
    for software distribution in Linux world. Installing new software is easy. It
    also has an advanced and easy font system that makes fonts in X look.


    Linux: Linux is now in its 10 version. It can be installed on a native Windows
    partition using Lin4Win, but this may slow the machine down. It also lets you
    do traditional Linux install into its own partition. Linux''s configuration and
    software installation is painless. It follows a slightly modified architecture
    called `mdk.rpm` but most Red software can also be used for Linux. The outstanding
    feature in this version is the collection of window managers-and freak will have
    a great time.


    SUSE: From Germany comes the Chameleon, SUSE. Now in its 8.x avatar, it has one
    of the most extensive software packages compiled, and getting them installed is
    easy with yast (another Software Tool) which gives a centralized interface where
    you can pick and choose the software to be installed. Among other things, SUSE
    comes with some stunning 3D games that showcase Linux gaming prowess.


    Corel/Xandross: Coral entered the Linux market with Coral Linux a few years ago.
    Now it has merged into Xandross OS, which is based on Coral Linux. This is a Debian-type
    version, and can be installed without much fuss after resizing the Windows partition.
    Xandross contains Crossover office, which is a refined retail version of WINE
    that lets you install and run many Microsoft apps.


    ### Windows applications in Linux


    Some applications have been ported over to Linux, or with a program called `WINE`
    (not an Emulator). Crossover is another dedicated program that lets you run Windows
    apps. The main thing about Linux is most software is free and you can use it.
    If you''re worried that Linux won''t look as Windows, there are many interfaces
    for Linux. And if you have a PC that runs both you can easily switch between them
    and get the best of both worlds.


    ### Differences between Linux and Windows


    This sub-topic will discuss the differences between Linux and Windows, I''ll discuss
    some of each system. Let us first start with a general overview of the Linux system.
    Linux at its most basic form is computer kernel. The kernel is the underlying
    code, used to communicate with hardware, and other system software, it also runs
    all the basic functions of the computer. The Linux kernel is an operating system,
    which runs on a variety of hardware and for variety purposes. Linux is capable
    of running on devices as simple as a watch, or a phone, but it can also run on
    a home computer using for example Intel or AMD processors, and its even capable
    of running on high end servers using Sun CPUs or IBM power PC processors. Some
    Linux distributions can only run one processor, while others can run many at once.
    Common uses for Linux include that of a home desktop computing system, or more
    commonly for a server application, such as use as a web server, or mail server.

