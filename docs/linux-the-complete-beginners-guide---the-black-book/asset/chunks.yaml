    Windows 用户被迫使用第三方杀毒软件，以帮助限制恶意代码导致计算机报废的可能。杀毒软件通常具有占用系统资源的负面影响，从而减慢整台电脑的速度；此外，大多数杀毒软件要求你支付订阅费用，并且你需要不断下载更新以防范入侵者。


    相比之下，Linux 的病毒问题几乎不存在，事实上，你甚至不需要为 Linux 机器准备病毒防护。病毒和间谍软件对 Linux 不是问题，原因之一仅仅是因为为
    Linux 开发的病毒要少得多。更重要的原因是，在 Linux 机器上运行病毒更加困难，并且需要用户提供更多的输入。在 Windows 上，你可能会通过打开邮件附件或双击包含恶意代码的文件无意运行并执行病毒。然而，在
    Linux 中，病毒需要在终端中运行，这需要用户给文件赋予执行权限，然后在终端中打开它。


    而且为了对系统造成任何实际破坏，用户必须以 root 身份登录，在运行病毒之前切换用户名和密码。例如，要运行嵌入在邮件附件中的病毒，用户必须：打开附件，然后保存它，然后右键点击文件并在菜单中选择“属性”，在属性中他们可以赋予其执行权限，然后他们就能在终端中打开文件来运行病毒。即便如此，用户也只能损坏自己的文件夹，所有其他用户将保持不受影响，所有
    root 文件也将保持完好，因为 Linux 需要 root 密码才能对这些文件进行更改。


    用户损坏整个电脑的唯一方法是向终端提供 root 用户名和密码以 root 身份登录。与 Windows 不同，Linux 中的可执行文件不会自动运行，必须手动赋予权限，这显著提高了安全性。在
    Linux 中，你需要病毒防护的唯一理由是你与 Windows 用户共享文件，这样做是为了保护他们，以免无意中将病毒传递给你共享的 Windows 电脑。


    以上是 Windows 操作系统和 Linux 之间某些差异的概概述。总结一下：Windows 只有一个供应商发布软件，而 Linux 则来自全球数百万个不同的代码。此外还提到了
    Linux 内核以及与其一起的大部分应用程序都是完全免费的，而在 Windows 上，你被迫为大多数软件付费。与 Windows 不同，Linux 往往缺乏专业支持，Linux
    用户通常需要自力解决技术问题。Linux 用户可以购买支持，也可以依靠互联网上提供的许多 Linux 论坛和群组。由于内核是开源的，Linux 在可配置性方面具有相对于
    Windows 的巨大优势。你可以通过操纵内核配置 Linux 以按照你看到的任何方式运行。


    安装 Windows 操作系统和应用程序更为简单，因为它有一个通用的安装程序。此外，寻找 Windows 应用程序更容易，因为其普及性，大多数应用程序仅适用于
    Windows 并且非常容易获得。Linux 运行的硬件种类比 Windows 更多，从运行多个 IBM Power PC 芯片的主机超级计算机，到运行 AMD
    处理器的小型笔记本电脑。当然，在作者看来，最大的区别在于 Linux 不受病毒和其他恶意代码的猛袭，而 Windows 则被无数的恶意代码所困扰。


    Linux OS 确实更优的软件。除了一些微小的困扰外，Linux 在大多数类别中都优于 Windows。Linux 更安全这一事实是关键点，天平向 Linux
    倾斜。Windows 在所有桌面环境中面临着更多的安全漏洞。


    # 理解 Linux 分区类型与硬盘分区


    当你进行磁盘分区时（在安装 Linux 期间或之后），你可能会遇到无法创建分区且无法执行你想要在分区上执行的其他任务的情况！这时你就需要理解 Linux 硬盘分区了。Linux
    系统管理员提示：记住以下使用 `fdisk` 的规则，它是最常用的分区工具。你可能可以使用其他磁盘实用程序打破这些规则。


    # 设置 Linux 硬盘分区


    你可以使用大多数发行版的安装程序以及 `fdisk` 来设置和配置你的 Linux 分区。此外，作为 Linux 系统管理员，你还需要对现有 Linux 系统（在操作系统安装后）进行分区管理（创建、删除和修改）。为了实现这一点，你使用
    `fdisk` 工具或 `parted` 命令——以及其他磁盘分区命令。Linux 有几种 Linux 硬盘分区类型，例如主分区、扩展分区和逻辑分区——对于使用这些分区类型也有严格的规则。


    ### Linux 主分区


    Linux 安装程序中的磁盘分区工具和 `fdisk` 命令（以及其他分区命令）每个硬盘驱动器最多可以创建四个主分区（Primary partitions）。如果你需要四个以上的硬盘分区，你需要至少创建一个扩展分区（Extended
    partition），然后在扩展分区中创建一个或多个逻辑分区（Logical partitions）。要在已有四个主分区的硬盘上创建扩展分区，你需要删除其中一个主分区然后创建扩展分区。因此，如果你在
    Linux 硬盘上创建扩展分区，你最多只能有三个主分区。


    ### Linux 扩展分区


    Linux 硬盘在拥有扩展分区之前必须至少有一个主分区。`fdisk` 无法每个驱动器创建超过一个扩展分区。为了能够使用扩展分区中的磁盘空间，它必须至少有一个逻辑分区（在扩展分区内部）。


    ### 逻辑分区


    扩展分区包含一个或多个逻辑分区。扩展分区是不被直接访问的。它是通过扩展分区内的一个或多个逻辑分区访问的。如果一个硬盘有一个扩展分区，那么它就至少有一个逻辑分区。


    ### 分区编号


    `fdisk` 可以创建的主分区最大数量为四个，创建的扩展分区最大数量为一。记住，在使用最常用的分区工具 `fdisk` 之前，你必须至少有一个主分区。你可能可以使用其他磁盘实用程序打破这些规则。

