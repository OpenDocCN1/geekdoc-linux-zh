    # Linux 安装帮助 - 如何从新的 Linux 下载包安装 Linux 系统


    你可以从 CD 或 DVD 将 Linux 安装到新的计算机系统上。这将允许你学习如何使用 Linux，获得真实、实用的 Linux 培训和经验。在本节中，我们讨论的是一个尚未安装操作系统（如
    Windows）的新系统。


    你可以下载 Linux 操作系统（OS）的 Linux ISO 文件并将其刻录到 CD 或 DVD，或者你可以购买 CD 或 DVD 版的 Linux 并让其邮寄给你。


    Linux 小贴士：Linux ISO 文件很大。只有在你有高速互联网时才下载 Linux。你可以非常廉价地购买并通过邮寄接收 Linux。只需在网上搜索“list
    of linux cds”或“list of linux dvds”即可。


    Linux 小贴士：Linux DVD 包含的程序比 CD 多得多。购买 Linux DVD 版本将获得比 CD 版本更多的 Linux 软件供选择——而且需要的
    Linux DVD 也比 CD 少！


    # 在新计算机系统上安装 Linux 的 7 个步骤


    ## 1 记录你的 Linux 安装设置


    在 Linux 安装过程中，你需要指定系统设置。这些包括：你想安装的 Linux 软件和桌面、网络设置以及磁盘分区大小。


    ### 2 使用 Linux CD 或 DVD 启动并开始 Linux 安装程序


    执行设置步骤，使系统从 CD 或 DVD 驱动器启动。关闭系统，并在驱动器中插入第一个 Linux CD / DVD 启动系统，开始 Linux 安装。


    ### 3 指定你的 Linux 安装设置


    遵循屏幕提示，并输入步骤 1 中记录的安装设置。


    ### 4 创建普通用户（“非 root”）用户


    你以 Linux“用户”身份登录并在 Linux 系统上工作，拥有用户名和密码。你可以以“root”用户身份登录，也可以以“非 root”用户身份登录。


    当你需要进行 Linux 管理时，以 root 用户身份登录并操作 Linux 操作系统。例如，以 root 用户身份运行命令创建新用户或安装服务器。当你安装
    Linux 时，系统会自动创建一个 root 用户用于执行管理任务。然而，出于安全考虑，绝不要以 root 身份登录 Linux 桌面。在安装过程的某个时刻，系统会询问你想要创建一个或多个“普通”（非
    root）Linux 用户。务必至少创建一个普通用户，并以该用户身份进行日常任务。


    ### 5 让 Linux 操作系统安装到你的磁盘上


    在指定安装设置并创建一个或多个新用户后，安装程序将 Linux 操作系统和软件程序复制到硬盘上，然后重启。


    ### 6 登录并测试系统


    系统重启后，以“普通”（非 root）用户身份登录测试你是否可以以该用户身份工作。此时会出现 Linux 桌面，你可以运行程序来测试系统。


    Linux 小贴士：记住不要以 root 用户身份登录 Linux 桌面。通过以普通用户登录并打开终端窗口来测试 root 用户。然后运行命令以 root
    用户身份登录并工作。


    ### 7 尽情享受吧！


    Linux 操作系统是一个神奇且可靠的系统。有数千个 Linux 软件适用于各种用途。通过安装和运行 Linux，你可以在操作 Linux 的同时获得大量的实用的培训经验。你可以在
    Linux 桌面操作并运行常用的软件程序。你也可以在 Linux 命令行操作，学习如何使用 Linux 命令——像真正的专业人士那样进行系统管理。


    # Linux 快速入门 - 如何使用 CD 中的 Linux 教程并在 Windows 中运行 Linux


    Linux 视频教程是学习使用 Linux 的极佳、简单且快速的方法。


    ## 在 Windows 中运行 Linux - 让你学习如何在 Windows 中使用 Linux！


    你可以下载一个免费的 Linux 虚拟机播放和一个免费的 Linux 虚拟机，以便在 Windows 中运行 Linux。只需像安装任何 Windows 程序一样，下载并快速安装免费的
    Linux 虚拟机播放器。这大约需要 20 分钟。然后下载免费的 Linux 虚拟机并将虚拟机文件解压缩到 Windows 硬盘上的文件夹中。不包括下载时间，这大约需要
    10 分钟。有一个免费的示例 Linux 视频教程展示了下载免费 Linux 虚拟机播放器和免费虚拟机的每一个步骤，让你能够轻松在 Windows 中运行
    Linux。


    Linux 小贴士：针对许多流行的 Linux 发行版（版本），有数百个免费 Linux 虚拟机可以下载，包括 Ubuntu Linux、Debian、Red
    Hat Linux、Fedora Linux、SUSE


    接下来，运行虚拟机播放器并打开 Linux 处理器以在 Windows 中获取 Linux。现在你已经在另一个窗口中运行了 Linux。


    ## 从 CD 运行 Linux 教程


    现在放入包含视频教程的 CD。这会导致你的浏览器自动运行并显示视频教程列表。


    要观看视频，只需点击列表中的教程名称，例如“在 Windows 中运行 Linux”、“从 CD 安装 Linux”或“学习如何运行 Linux 命令”——教程将在浏览器（Windows
    内）中运行。现在你已经在另一个窗口中运行了 Linux。


    ## 在 Windows 中学习 Linux 以获得真实的实操经验


    现在是在 Windows 中运行 Linux 获取 Linux 培训最好的部分。你不仅可以通过观看 Linux 视频来观察和学习如何使用 Linux，还可以使用
    Linux 桌面运行软件程序。你还可以在 Linux 命令行操作，学习在终端窗口中使用命令。


    Linux 小贴士：在 Linux 桌面上打开终端窗口以运行命令：右键点击桌面并选择“Terminal”或“Console”（或类似选项），或者通过菜单查找选择“Terminal”或“Console”（或类似选项）。


