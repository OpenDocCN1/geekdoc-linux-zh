    通过 Linux 脚本，你可以将一系列例行的运行命令放在文本文件中，然后只需通过输入文件名并按回车键即可运行所有命令。


    # 用于自动运行一系列 Linux 系统管理命令的 Linux 脚本示例


    按照下方示例中的步骤操作，创建并运行你的第一个 Linux 脚本吧！


    1. 运行 Linux 文本编辑器。

    2. 将以下文本放在文本文件的左上角（下方为了强调进行了缩进处理）：


    ```

    bash

    #!/bin/bash

    ```

    这表示该文本文件是一个 Linux 脚本文件。

    按两次回车键，在上方行下方留出一个空行。

    3. 将 Linux 命令放入脚本文件中。


    下面的 Linux 命令仅用于提供示例。你可以在脚本中放置任何命令。


    下方的 Linux 命令将：清除屏幕、切换到 `/etc` 目录路径，然后使用 Linux `pwd`（工作目录路径）命令显示当前路径。


    然后提供 `fstab` 文件的长列表（以向你展示它的存在），然后切换到你的家目录（用符号 `~` 表示），最后显示当前目录的路径。


    Linux `echo` 命令不是必须的，但将其放入文件中是为了显示脚本执行的进度。


    此外，你不需要在 Linux 脚本中对下方命令进行缩进——在这里缩进仅是为了强调。


    ```

    clear

    echo The screen has been cleared

    cd /etc

    pwd

    echo This is the etc directory

    ls -l fstab

    echo This is a long listing of the fstab file

    cd ~

    echo Now in home directory

    ```


    ## Linux 命令小士


    Linux 脚本可以包含数百行文本——也包括诸如 `if ... then` 等编程逻辑。


    4. 以有意义的名称保存文本脚本以创建它并为其命名。例如，如果你想列出几个目录中的文件，可以将文件命名为 `listdirs`。

    5. 运行 `chmod` 命令更改文件的权限，并使 Linux 文本变为“可执行”。


    在我们的示例中，文件名为 `listdirs`。下面是一个 Linux `chmod` 命令示例，用于运行 `chmod` 来更改 Linux 脚本的权限——并使
    `listdirs` 变为“可执行”，这样你就可以以相同的方式运行脚本。下面的 `$`（美元符号）是 Linux 命令提示符。不要输入 `$`，只需输入 `$`
    右侧出现的命令即可。


    ```

    chmod +x listdirs

    ```

    上面的 Linux 命令是 `chmod`，它正用于通过 `u+x` 为文件的 `u`（用户）分配 `x`（可执行）权限，脚本名为 `listdirs`。


    ### 运行 Linux 脚本以执行系统命令


    要运行 Linux 脚本（位于“当前”目录中），例如 `listdirs` 脚本，只需输入一个点（dot）和一个空格，然后输入文件名并按回车键。


    ```

    . listdirs

    ```

    上述概念和 Linux 示例适用于 Red Hat、Ubuntu、Fedora、Debian 以及——所有 Linux 发行版。


    # 如何获得 Red Hat Linux 认证


    ## 我应该获得 Linux 认证吗？


    嗯，你可能有的第一个问题是，为什么要获得 Linux 认证？这个问题的答案与获得一般的认证类似。它通过测试并通过最低知识标准，帮助你证明你对 Linux  way
    系统的了解。


    它还能帮助你在行业内获得一份工作。许多职位要求或倾向于拥有 Linux 认证，例如 Linux 管理员或通用服务器管理员。它还可以丰富你现有的 Linux
    知识，你可以将其应用于当前的工作。


    ## 我应该获得哪种 Linux 认证？


    这可以单独作为一篇文章——我将所有信息都汇总在一个方便的地方。有四家主要的 Linux 认证供应商，他们都提供了一系列不同的认证。


    ### Novell

    他们提供多种级别的 Linux 认证，涵盖工程师、专业人员和桌面管理员。

    * 认证工程师 11 (`CLE11`)——针对经理和架构师的工程师级。需要通过认证 才能获得此项。

    * 认证管理员 11 (`CLA11`)——专注于 Linux Server。

    * 认证桌面 (`CDA`)——面向希望学习 Linux 桌面的人士。

    * 认证专业人员 11 (`CLP11`)——提供管理 Linux Server 的技能。


    ### CompTIA

    * CompTIA 提供单一认证 `Linux+`。

    * `Linux+`——面向进入 Linux 领域的初级认证。


    ### Linux Professional Institute

    Linux Professional Institute（也称为 LPI）提供几种认证。

    * Linux Professional Institute 1 级 (`LPIC-1`)——针对主流发行版技能的初级认证。

    * Linux Professional Institute 2 级 (`LPIC-2`)——涵盖管理技能的高级认证。需要通过 `LPIC-1` 获得此项。

    * Linux Professional Institute 3 级 (`LPIC-3`)——针对提供服务器特性的专家级认证。需要通过 `LPIC-2` 获得此项。


    ### Red Hat

    Red Hat 为其 Linux 版本提供几种认证。

    * Red Hat 认证系统管理员 (`RHCSA`)——涵盖管理基础的低级 Linux 认证。

    * Red Hat 认证工程师 (`RHCE`)——面向 Linux 专业人士的高级 认证。通过 `RHCSA` 是该认证的要求。

    * Red Hat 认证虚拟化管理员 (`RHCVA`)——专注于在 Linux 环境中部署虚拟机。

    * Red Hat 认证安全专家 (`RHCSS`)——专注于 Linux 安全功能和领域。

    * Red Hat 认证数据专家 (`RHCDS`)——专注于管理和支持数据环境的要求。

    * Red Hat 认证架构师 (`RHCA`)——Red Hat 最高级别的认证，专注于 Linux 管理和使用的专家级课题。


