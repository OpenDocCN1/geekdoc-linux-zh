  trans: '

    你可以按照认为合适的任何方式对其进行修改。此外，Linux 还提供了多种图形化环境以满足你的需求。如前所述，Linux 能够运行功能全图形化环境，如 `KDE`，或者更轻量且对资源友好的
    GUI，如 `Fluxbox` 或 `Blackbox`，以适应使用旧电脑电脑的用户。还有某些 Linux 版本旨在尽可能地模拟 Windows 的视觉效果和体验。诸如
    `Linux` 这样的发行版最适合从 Windows 世界迁移过来的用户。


    还有一些发行版完全不包含图形化环境，以更好地适应那些需要为各种计算活动榨取所有可用计算能力的用户，以及那些比他人更高级的用户。这种高度的可配置性有时会带来问题，因为你必须决定哪种桌面最适合你，而且为了让操作更简单，你只需要安装与你的发行版和图形环境原生的应用程序。


    ### 成本

    Linux 的性价比是它区别于 Windows 的另一种方式。对于家庭用户来说，Linux 是廉价的，在大多数情况下是完全免费的，而 Windows 的成本取决于你购买哪个版本。在
    Linux 中，大多数应用程序也是免费的，但在 Windows 上，大多数情况下你都需要为应用程序付费。对于大多数情况，使用 Linux 在安装时不需要输入产品激活密钥，你可以自由地安装在任意数量的电脑上。而
    Windows 仅只被允许在一台电脑上安装，微软使用产品激活软件来执行这一规则。


    安装 Windows 时，你必须输入产品激活密钥，该密钥在一定次数后会过期。如果你愿意，可以从各种供应商购买 Linux，这将包含一套盒装版 CD、手册和技术支持，价格大约在
    40-130 美元。当然，如果你购买用于服务器的高端 Linux 版本，费用可能在 400-2000 美元之间。“2002 年，《计算机世界》杂志引用了纽约美林士银行的技术架构师的话，称‘运行
    Linux 的成本通常是运行 Unix 或 Windows 成本的十分分之一。’”ref#1)


    ### 安装

    Windows 的安装通常比安装 Linux 简单。“对于 Windows XP 有三种主要的安装方式。一种是纯净安装，即在空白硬盘上安装 Windows。另一种是升级安装，你从旧版本的
    Windows 开始并‘升级’到新版本。升级的优点是旧系统上的所有文件在整个过程中应该保持不变。你还可以执行修复安装，即在原有 Windows 之上安装相同版本的
    Windows 以修复损坏的版本。


    还有一种恢复，从技术上讲它不是安装；它用于将 Windows 副本恢复到设置状态。恢复 Windows 的缺点是你将丢失所有留留在损坏 Windows 副本上的数据。”（ref#1）此外，使用
    Windows 你可以确保你的硬件很可能会被软件支持，尽管对于 Linux 来说这并不是什么大问题（它不支持的硬件很少）。Linux 的安装因发行版而异很大。你可能会遇到图形化安装，也可能是基于文本的安装；这些版本使得
    Linux 的安装比 Windows 困难一些甚至不可能（尽管这种难度正在消失）。你可以对 Linux 进行纯净安装，或进行双启动以与另一个操作系统共存。使用
    Linux，你不需要购买 CD，可以在桌面运行时通过下载并安装更新来完成更新。在 Linux 中，大多数大多数升级后不需要重启电脑，只有在内核内核升级后才需要重启。


    在不需要将其安装到硬盘的情况下运行 Linux 也是可能的；许多 Linux 发行版允许你直接从 live cd 运行。这种方式的优点是，你不需要修改系统就可以尝试
    Linux。你可以从 CD 运行 Linux，而无需损坏你的 Windows 分区。其他优点包括救助损坏的 Linux 系统的能力。如果你的 Linux 电脑无法启动，你可以插入一个
    live cd 并从它启动，从而修复损坏的 Linux 版本。此外，你可能可以使用 Linux live cd 从不再启动的损坏 Windows 电脑恢复文件。由于
    Linux 能够读取 NTFS 文件，你可以将文件从 Windows 电脑复制到 USB 闪盘或软磁盘等。


    Linux 和 Windows 之间的另一个主要区别是你在两个操作系统上使用的应用程序。Windows 包含的商业支持的应用程序比 Linux 丰富得多。在
    Windows 上找到你寻找的软件比在 Linux 上容易得多，因为有许多软件供应商仅让他们的产品兼容 Windows。在 Linux 上，你大多数情况下将被迫放弃你已经习惯的
    Windows 家族应用程序，转而使用为 Linux 制作的开源应用。诸如 Microsoft Office、Outlook、Inkscape、Adobe
    Creative suite 以及作为聊天工具的 chat 无法在 Linux 上原生运行。尽管在 Linux 上，你可以使用名为 Over Office
    的软件让 Microsoft office 和 Adobe 套件运行。在使用这些应用程序时，你需要使用 Open Office、GIMP 图像编辑器、Thunderbird
    邮件客户端。在使用 MSN 时，你可以使用 GAIM 聊天工具，并可以使用 Firefox 作为网络浏览器。此外，在 Linux 上即使软件是为 Linux
    制作的，安装也可能困难。这是由于 Linux 有许多不同的版本。为某个版本制作的安装软件在另一个版本上可能可能需要某些配置。例如，如果你尝试在 GNOME
    上安装为 KDE 图形环境制作的软件，该应用在 GNOME 上无法在 GNOME 上轻松安装，并需要一些配置。Linux 和 windows 运行的硬件类型也导致了它们的不同。Linux
    可以运行在许多不同的平台上，从 Intel 和 AMD 芯片到运行 IBM 处理器的电脑。Linux 将运行从最慢的 386 机器到地球上最大的主机。新版本的
    Windows 无法在 Linux 相同数量的硬件上运行。


    两个操作系统之间另一个显著的区别是 Windows 臭名的恶意代码问题，即病毒和间谍软件。病毒、间谍软件和泛缺乏安全性是 Windows 社区面临的最大问题。在
    Windows 下，病毒和间谍软件能够在无需或很少用户输入的情况下自行执行。这使得防御它们成为任何 Windows 用户持续的担忧。”

