  md: '# Using the On-Screen Keyboard


    Press Alt+Super+K to toggle the on-screen keyboard on and off. The on-screen keyboard
    is only visible when you need it. For example, when a document is the active window
    and your cursor is in a position where you can type, you will see the on-screen
    keyboard. If you click the Solar desktop, or somewhere else does not accept typed
    characters, the keyboard vanishes.


    ![](img/d983c24f03486345a839503325e9c4b2_10_0.png)


    Illustration 4: The on-screen keyboard.


    # Using Head and Eye-Tracking Software


    Enable Viacam (frequently abbreviated as Eviacam) is mouse replacement software
    that moves the pointer as your head. If you have low motor skills, with nothing
    more than your webcam and Eviacam can easily use your computer. You don''t need
    anything than a webcam to use Eviacam – no cables, no dots and no additional hardware
    is required.


    With Eviacam, you can control your computer with intuitive head movements. There
    is no need to use your hands! It''s designed to eliminate the need for assistance
    after it''s installed -- and remember, it''s already installed with Sonar!


    Make it your own. You can customize the pointer speed, motion acceleration and
    smoothness, dwelling time and more!


    To learn how to use and configure Eviacam, the user''s manual is available within
    the software. It''s on-line at http://eviacam.sourceforge.net/help/en/en/contents.html.'
  merge: -1
  pgno: 10
