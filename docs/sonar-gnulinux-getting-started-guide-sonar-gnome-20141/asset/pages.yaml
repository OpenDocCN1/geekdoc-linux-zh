  md: '# Need More Software?


    Enjoy Sonar''s Free software. Never again to worry about paying for that next
    upgrade, or having to pay for the features or functionality you''ve been looking
    for. Most of the software applications you will need are already installed in
    Sonar, or are available in the repositories.


    Note that Sonar Linux is based on the Manjaro distribution, so you may refer to
    Manjaro repositories, tools, utilities, and support site as you use Sonar. If
    you see these, don''t worry. You are in the right place. The Manjaro Linux team
    provides a great deal of support for Sonar. In fact, the release of GNU/Linux
    would not have been possible without their support.


    You use the Package Manager software to get new software applications from the
    repositories.


    +   1. Click the **Activities** button (or press the **Super** button) to open
    the Overview.

    2. Type "add/remove software" and press **Enter**. The Package Manager opens.

    3. The Package Manager offers four tabs to locate the software you want. The easiest
    way to find what you want to use is the Search tab. This tab is the default, all
    you need to do is begin typing.

    4. You can type the package name if you know it - like "Skype." If you don''t
    know the name, search for what you want to do, like "image manipulation." The
    package manager displays the possible packages that match your search in the top
    right panel.


    ![](img/d983c24f03486345a839503325e9c4b2_15_0.png)


    Illustration 9: Searching the Package Manager


    +   5. Click on the name of the package in the list for a brief description of
    the software.


    Sonar GNU/Linux Getting Started Guide'
  merge: -1
  pgno: 15
- img_proc: true
  md: '6. With the package selected in the list, press the Spacebar or double-click
    the box to indicate that you want to install the package. A check mark appears
    in the check box. If you change your mind, press the Spacebar or double-click
    again, to uncheck the box.


    7. You can continue to search for, and check mark as many software packages as
    you like, before you begin the installation process. All of the software you have
    selected, and any other utilities or other that they will require will be installed,
    at the same time.


    8. To display a "transaction summary" of the packages that will be installed,
    click the icon at the top of the window that looks like a blue arrow. It''s second
    from the left.


