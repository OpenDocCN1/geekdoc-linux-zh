  md: '# Using Accessibility Applications


    # Setting Keyboard Shortcuts On the Gnome Desktop


    Although keyboard shortcuts are technically not part of the Accessibility menu,
    they can be very helpful as assistive technology. Sonar doesn’t a set of shortcuts
    for the user. We leave that to each person that uses Sonar. There are, however,
    an extensive of keyboard shortcuts you can set for yourself. If you would like
    to take a look at your own keyboard shortcuts you can press the Super key to reveal
    the Overlay, then press "settings".


    +   1. Next. locate the Settings option and press Enter.


    +   2. Use the arrow keys to locate the Keyboard option and press Enter. Now you
    will have the Keyboard Settings menu open.


    +   3. First you will be on the Typing tab, which allows you to change available
    options for typing. Press the right arrow key to move to the Shortcuts


    From here you can set what shortcuts want for your sound and media. You can also
    set shortcuts for moving your windows and other system navigations. In addition,
    you can set shortcuts for such things as launchers and taking screen shots. Follow
    the prompts at the bottom of the Keyboard Settings window to make your changes.


    +   1. When you want a shortcut to set, locate and highlight the action, and press
    Enter.


    +   2. Press the key for the shortcut. Your new keyboard shortcut is now set and
    active. Remember that the "Super" key is also known as the "Windows" key. The
    Alt+Super+M notation indicates that you should press and hold the Alt key and
    the Super key at the same time, then the letter "M" so that all three keys are
    pressed simultaneously.


    Some of the accessibility keyboard shortcuts that are already provided for you
    in Sonar:


    +   * Turn screen reader on or off: Alt+Super+S

    * Turn magnification on or off: Alt+Super+M

    * Zoom in: Alt+Super++ (plus key)

    * Zoom out: Alt+Super+- (minus key)

    * Turn on-screen keyboard on or off: Alt+Super+K

    * Increase text size: Alt+Super+L

    * Decrease text size: Alt+Super+D

    * Turn high contrast on or off: Alt+Super+H'
  merge: -1
