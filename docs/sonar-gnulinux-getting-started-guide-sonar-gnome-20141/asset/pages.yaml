  md: '# Using the Orca Screen Reader


    Orca is a free, open source, flexible, and extensible screen reader that provides
    you with access to the graphical desktop via user-customizable combinations of
    speech and/or braille. The Orca screen reader in Son is "on" by default. Turn
    the screen reader off or on again, press Alt+Super+S.


    For complete information about using and configuring the Orca screen reader, refer
    to the website https://help.gnome.org/users/orca/stable/.


    Note: The Orca documentation on the web occasionally refers to the "Orca Modifier"
    key. The key that Orca uses by default as theOrca Modifier" depends on whether
    you are using Orca''s keyboard layout or its Desktop keyboard layout:


    +   * If you use the Laptop layout, the default Orca Modifier will be CapsLock.


    +   * If you use the Desktop layout, for the Orca Modifier you can use either
    the Normal Insert key or the KeyPad Input. KeyPad Input is the same as the 0 (zero)
    on the numeric keypad.


    You can use the "Orca Modifier" to get some help. Press Orca Modifier+H to enter
    "learn mode."


    +   * To view Orca''s documentation, press F1.


    +   * To hear a list of Orca''s shortcuts, press F2.


    +   * To hear a list of Orca''s shortcuts, press F3.


    To learn more about how to use Orca to read documents and websites, the documentation
    is available on the website: https://help.gnome.org/users/orca/stable#reading.


    You may find that the screen reads too slowly or too quickly for you. You can
    adjust the rate at Orca speaks, and make other adjustments, in Orca Preferences.
    To get to the Orca Preferences, press Orca Modifier+Spacebar. If you find yourself
    needing to adjust the speed frequently, you may more easily bind (map) the "increase
    the rate" and "decrease the rate" commands to specific keys. That review (and
    setup) the keyboard shortcuts and commands that Orca uses, you will want to refer
    to the documentation on key bindings at: https://help.gnome.org/users/orca/stable/howto_key_bindings.html.


    This is just a small sampling of the documentation that is available to you on
    the Orca site. Discover what powerful tool can do.


    # Using Sonoma Screen Magnifier


    If you are a low vision user and require screen magnification, Sonoma has magnification
    built in. To turn on or off screen magnification, press Alt+Super+M. You can also
    turn on magnification in the Accessibility menu on the top bar if you prefer that
    method.


    Once you have the magnification turned on you can zoom in by pressing Alt+Super
    and the plus (+) sign. If you want to zoom out by pressing Alt+Super and the minus
    (-) sign. If you wish to change the keyboard shortcuts you can, by opening the
    Overview by pressing the Super key and typing in "settings". From there you can
    go to the keyboard settings and change all of the keyboard shortcuts not only
    for the magnification but for all keyboard shortcuts.


    Sonar GNU/Linux Getting Started Guide


    Page 10'
  merge: -1
