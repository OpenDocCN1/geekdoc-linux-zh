    \n# 欢迎\n\n恭喜！你已经从 Windows PC 切换到了 Sonar GNU/Linux 系统。Sonar GNU/Linux 与专有操作系统之间存在一些差异，你可能会遇到较小的学习曲线。无论你是\
    \ Linux 新手还是从 Windows 切换，本指南都将帮助你充分利用 Sonar 电脑。\n\n# 关于 Sonar GNU/Linux\n\nSonar\
    \ GNU/Linux (Sonar) 是你电脑的软件——一种操作系统。它与其他电脑预装的操作系统不同，例如苹果的 OSX、微软的 Windows 或谷歌的\
    \ Chrome。Sonar 专注于提供辅助技术。如果你需要一个无障碍的操作系统，你来对地方了。搜索此结束，Sonar 是你的完美选择。如果你不需要辅助技术，也不要感到落后。Sonar\
    \ 是一个功能完整的 GNU/Linux 发行版，同样适用于你！\n\nSonar 是一个现代且安全的系统，提供了许多惊叹的功能和质量无伦的技术。它使用免费的辅助技术成为今天最无障碍的操作系统。Sonar\
    \ 预装了以下自适应技术：\n\n- 1. 为盲人及低视人士提供的屏幕阅读器。\n- 2. 放大程序，帮助低视人士看清屏幕。\n- 3. 为运动技能较差、使用键盘困难的人士提供的屏幕键盘。可以使用鼠标或轨迹球配合屏幕键盘来导航屏幕键盘。\n\
    - 4. 一种名为 OpenDyslexic 的字体，专为为阅读障碍者提高屏幕文本和打印文本的可读性而设计。\n\n# 到底什么是“GNU”？\n\nSonar\
    \ 是 GNU/Linux 的一个版本（发行版）。虽然“GNU”是操作系统的关键部分，但在日常对话中经常被省略。因此，Sonar GNU/Linux 通常被称为“Sonar\
    \ Linux”，或者更简单地称为“Sonar”。在本文中，我们将交替使用这三个词。\n\n你可能听过 Linux 是 Windows 等操作系统的开源替代方案，它是谷歌\
    \ Android 和 Chrome 操作系统的基础。另一方面，“GNU”可能是一个陌生的术语。事实上，通常被称为“Linux”的操作系统应该被称为“GNU/Linux”，因为如果没有让\
    \ Linux 内核与你交互的 GNU 工具，计算机将无法运作。如果你想了解更多 GNU 项目和软件自由，可以在项目网站 https://www.gnu.org\
    \ 找到更多信息。\n\n# 从 Windows 迁移到 Sonar Linux\n\n你已经完成了从 Windows 到 Sonar Linux 的切换，现在你来到这里，可能会感到有些迷茫。我们整理了这张表格，方便你找到正在寻找的功能，无论是打印机设置、音频控制，还是所有文件所在的位置。\n\
    \n| 如果你在 Windows 中使用... | 在 Sonar 中查看这里... | 额外提示 |\n|---|---|---|\n| 音频控制 | 声音\
    \ | 状态菜单 > 设置按钮 > 声音 |\n| 文档文件夹 | 主文件夹 | 主文件夹是你存放所有创建内容的地方。文档、音频文件、视频等。 |\n| 文件资源管理器\
    \ | 文件管理器 | Sonar 的文件管理器是一个用于管理和搜索电脑中文件的强大工具。 |\n| Microsoft Word | LibreOffice\
    \ Writer | LibreOffice Writer 是一个文字处理器，可以创建、打开和保存你可以使用 Microsoft Word 共享的文档。 |\n\
    | 网络和共享 | 网络 | 状态菜单 > 设置按钮 > 网络 |\n| 记事本 | 文本编辑器 | Gedit 是 Sonar 中文本编辑器的名称。 |\n\
    | 打印机传真 | 打印机 | 状态菜单 > 设置按钮 > 打印机 |\n| 回收站 | 垃圾桶 | “垃圾桶”这个说法不那么“政治正确”，但如果你需要恢复已丢弃的内容，仍然可以回收它。\
    \ |\n| Jaws 屏幕阅读器 | Orca 屏幕阅读器 | Orca 是一个免费、开源、灵活且可扩展的屏幕阅读器，提供对 Sonar 图形桌面和/或盲点的的支持。\
    \ |\n| iTunes | Rhythmbox | 听音乐、播客等。你甚至可以将文件传输到 MP3 播放器以便移动收听。 |\n\nSonar GNU/Linux\
    \ 入门指南 第 5 页\n\n"
