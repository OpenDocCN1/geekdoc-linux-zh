    bar between the Application and Accessibility menus. The clock is actually a button
    that, when you click on it, displays a calendar and a menu that lets you adjust
    your computer''s date and time settings. You can use these settings to change
    such as the format of the date and time as it is displayed in the top bar.


    # Accessibility Menu


    The Accessibility menu displays a convient list of the accessibility features
    and lets you turn each of them on or off with a single click.


