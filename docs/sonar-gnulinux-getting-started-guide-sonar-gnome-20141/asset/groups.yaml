- md: '

    ## Accessibility


    The pre-installed accessibility features of Sonar Linux are what sets it apart
    from any other computer operating system. In fact, if you installed Sonar on your
    own, you will already know that even during the installation process, the Orca
    screen reader is active and assisting you, from the start!


    ## Screen Reader


    The Orca screen reader is provided for blind and low vision users. The screen
    reader is "on" by default. To turn the screen reader off or on again, press Alt+Super+S.
    (The "Super" key may be labeled with the "Windows" icon on your keyboard.)


    ## Screen Magnification


    A magnification program is provided to help clarify the screen for low vision
    people. To turn on magnification, press Alt+Super+M. To zoom in, press Alt+Super+++
    (plus key). To zoom out, press Alt+Super+- (minus key)


    ## On-Screen Keyboard


    An on-screen keyboard is ready to go for people who have low motor skills and
    experience using a keyboard. The on-screen keyboard can be used with a mouse or
    trackpad to navigate the keyboard on the screen. To turn the on-screen keyboard
    on or off, press Alt+Super+K. To increase text size press Alt+Super+L and to decrease
    text size, press Alt+Super+D.


    ## Head and Eye-Tracking Software


    If your computer has a camera installed, or if you add one, you can use it to
    control the mouse cursor. In combination with the on-screen keyboard, this will
    allow people with low motor skills to navigate the software, and use the keyboard
    as well.


    ## OpenDyslexic Font


    Sonar Linux comes with the OpenDyslexic font pre-installed. OpenDyslexic is designed
    to increase the readability of on-screen and printed text for readers with dyslexia.


    In the documentation for OpenDyslexic, the author explains, "Your brain sometimes
    does funny things to text. OpenDyslexic helps to prevent some of these things
    from happening. Letters have weighted bottoms to provide an indication of orientation
    to make it more difficult to confuse with other similar letters. Consistently
    weighted bottoms can also help reinforce the line of text. The unique shapes of
    each letter can prevent flipping and swapping."


    The font is available in any application that provides selectable fonts, like
    word processors and browsers. OpenDyslexic can even be chosen as the default system
    font in System Settings.


    ## Introduction to Sonar''s Desktop


    Sonar Linux uses a popular Linux desktop environment Gnome. When you first log
    in, you will see a desktop displaying icons like Home and Trash, and a bar across
    the top of the screen. This is the Gnome desktop environment. Gnome''s top bar
    provides access to your windows and applications, your calendar and appointments,
    and where you''ll find adjustment settings for such things as sound, networking,
    power and accessibility features.


    There are five components in the Sonar top bar. From left to right, they are,
    the Activities button, the Application menu, the Clock, the Accessibility menu
    and the Status menu. Each of these provides access to the settings and capabilities
    that will allow you to use your computer to its fullest. Let''s start with an
    overview of each of these components.


    ## Activities Button


    The button on far left of the top bar is the Activities button. Clicking this
    button shows you an overview of your windows and applications. The overview shows
    you thumbnails of all the windows on your current workspace. While viewing the
    Overview, you can also just typing to search your applications, files, folders
    and web.


    ![](img/d983c24f03486345a839503325e9c4b2_6_0.png)


    On the left edge of the Overview screen, you will find a vertical region called
    the Dash. The Dash shows you your favorite applications and your running applications.
    Click any icon on the Dash to open that application. If the application is already
    running, the icon will be highlighted with a region just below it. Clicking the
    icon of a running application will bring up the application''s most used window.
    To open a new application, or to display another window that is already open,
    you can right-click the icon.


    The grid at the bottom of the Dash displays the Applications Overview. This shows
    you all the applications installed on your computer. Click any application to
    run it. You can also drag an application onto the Dash to make it favorite. Your
    favorite applications stay in the Dash even when they''re not running, so you
    can get to them quickly.


    ## Application Menu


    The application menu appears just to the right of the Activities menu if you have
    at least one application running. It displays the icon for the currently running
    active application and a list of actions that can be taken for that application.
    Note that the menu bar on the application window may contain additional menus
    and actions as well.


    ## Clock


    Sonar displays the day of the week and the time of day in the center of the top
    bar between the Application and Accessibility menus. The clock is actually a button
    that, when you click on it, displays a calendar and a menu that lets you adjust
    your computer''s date and time settings. You can use these settings to change
    such as the format of the date and time as it is displayed in the top bar.


    ## Accessibility Menu


    The Accessibility menu displays a convenient list of the accessibility features
    and lets you turn each of them on or off with a single click.


    ## Status Menu


    The menu on the far right of the top bar is the Status menu. In the Status menu
    you can change the volume or screen brightness, edit your Wi-Fi connection, check
    your battery status, log out, turn off your computer. The three buttons at the
    bottom of the menu, from left to right, allow you to launch the System Settings
    application, to lock the screen, and to log out/switch users/shutdown.


    ![](img/d983c24f03486345a839503325e9c4b2_7_0.png)


    ![](img/d983c24f03486345a839503325e9c4b2_7_1.png)


    ## Using Accessibility Applications


    ## Setting Keyboard Shortcuts On the Gnome Desktop


    Although keyboard shortcuts are technically not part of the Accessibility menu,
    they can be very helpful as assistive technology. Sonar doesn’t have a set of
    shortcuts for the user. We leave that to each person that uses Sonar. There are,
    however, an extensive of keyboard shortcuts you can set for yourself. If you would
    like to take a look at your own keyboard shortcuts you can press the Super key
    to reveal the Overlay, then press "settings".


    - 1. Next. locate the Settings option and press Enter.

    - 2. Use the arrow keys to locate the Keyboard option and press Enter. Now you
    will have the Keyboard Settings menu open.

    - 3. First you will be on the Typing tab, which allows you to change available
    options for typing. Press the right arrow key to move to the Shortcuts


    From here you can set what shortcuts want for your sound and media. You can also
    set shortcuts for moving your windows and other system navigations. In addition,
    you can set shortcuts for such things as launchers and taking screen shots. Follow
    the prompts at the bottom of the Keyboard Settings window to make your changes.


    - 1. When you want a shortcut to set, locate and highlight the action, and press
    Enter.

    - 2. Press the key for the shortcut. Your new keyboard shortcut is now set and
    active. Remember that the "Super" key is also known as the "Windows" key. The
    Alt+Super+M notation indicates that you should press and hold the Alt key and
    the Super key at the same time, then the letter "M" so that all three keys are
    pressed simultaneously.


    Some of the accessibility keyboard shortcuts that are already provided for you
    in Sonar:


    - Turn screen reader on or off: Alt+Super+S

    - Turn magnification on or off: Alt+Super+M

    - Zoom in: Alt+Super++ (plus key)

    - Zoom out: Alt+Super+- (minus key)

    - Turn on on-screen keyboard on or off: Alt+Super+K

    - Increase text size: Alt+Super+L

    - Decrease text size: Alt+Super+D

    - Turn high contrast on or off: Alt+Super+H


    ## Using Orca


    Orca is a free, open source, flexible, and extensible screen reader that provides
    you with access to speech and braille. The screen reader is "on" by default. To
    turn the screen reader off or on again, press Alt+Super+S. For complete information
    about using Orca, refer to the website.


    Note that the Orca Modifier key depends on whether you are using Laptop layout
    or Desktop layout:


    - If you use the Laptop layout, the default Orca Modifier will be CapsLock.

    - If you use the Desktop layout, for the Orca Modifier you can use either Insert
    key or Keypad (the same 0 on the numeric keypad).


    You can use Orca Modifier+H to get some help.


    - To view Orca''s documentation, press F1.

    - To hear a list of Orca''s shortcuts, press F2.

    - To hear a list of Orca''s shortcuts, press F3.


    To learn more about how to use Orca to read documents and websites, the documentation
    is available on the website: https://help.gnome.org/users/orca/.


    You may find that the screen reads too slowly or too quickly for you. You can
    adjust the rate at Orca speaks, and make other adjustments, in Orca Preferences.
    To get to Orca Preferences, press Orca Modifier+Spacebar. If you find yourself
    needing to adjust the speed frequently, you may more easily bind (map) the "increase
    the rate" and "decrease the rate" commands to specific keys. That review (and
    setup) the keyboard shortcuts and commands that Orca uses, you will want to refer
    to the documentation on key bindings at: https://help.gnome.org/users/orca/stable/howto_key_bindings.html.


    This is just a small sampling of the documentation that is available on the Orca
    site. Discover what powerful tool can do.


    ## Using Sonoma Screen Magnifier


    If you are a low vision user and require screen magnification, Sonoma has magnification
    built in. To turn on or off magnification, press Alt+Super+M. You can also turn
    on magnification in the Accessibility menu on the top bar if you prefer that method.


    Once you have the magnification turned up you can zoom in by pressing Alt+Super
    and the plus (+) sign. If you want to zoom out by pressing Alt+Super and the minus
    (-) sign. If you wish to change the keyboard shortcuts you can, by opening the
    Overview by pressing the Super key and typing in "settings". From there you can
    go to the keyboard settings and change all of the keyboard shortcuts.


    Sonar GNU/Linux Getting Started Guide


