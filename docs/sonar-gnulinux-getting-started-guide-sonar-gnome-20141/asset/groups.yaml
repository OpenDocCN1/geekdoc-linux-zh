    你可能想使用的第一个应用程序之一是网络浏览器 Firefox。要打开 Firefox，按下 Super 键（也称为 Windows 键）。这将打开概览（Overview）。你也可以像我们之前描述的那样，点击活动（Activities）按钮进入那里。现在概览已打开，开始输入“firefox”，它应该会自动填充文本框。一旦看到它，就可以按回车键，Firefox
    就会打开。你可以对任何安装的应用程序执行同样的操作。


    现在概览功能非常强大。你不仅可以按名称搜索应用程序，还可以按应用程序的功能搜索。例如，输入类似“music”（音乐）的词，Sonar 将找到你安装的任何与音乐相关的应用程序。因此你不需要知道程序的名称。Sonar
    会通过概览为你找到。你还可以搜索文件和文件夹，只需输入文件或文件夹的名称，它就会出现在概览中。所以，概览真的是 Sonar 针对你整个系统的强大搜索工具。


    # 文字处理器


    你可能想创建一个简单的文档、撰写新闻通讯或撰写小说，然后将工作保存到文件中。文字处理器是此的完美工具，Sonar 已经为你准备了一个在等候使用。Sonar
    预装了 LibreOffice 软件套，其中包含一个文字处理器（Writer）、一个电子表格应用程序（Calc）、一个用于创建专业演示文的程序（Impress）、一个用于科学或学校作业的公式编辑器（Math），以及一个用于编目任何你内容的数据库（Base）。


    正如之前一样，通过按下 Super 键打开概览。开始输入“word processor”或“writer”，在你完成输入之前，文字处理器就会被高亮！按回车键打开
    LibreOffice Writer。就像你用过的任何文字处理器一样，你可以在屏幕上打字、更改字体、使用粗体、下划线和斜体格式化文本、创建表格、插入图片等。点击保存图标保存你的工作，按
    Control+P 打印，并使用 Control+Q 退出。


    对于所有操作系统，Sonar 都提供了多种方法来完成这些操作，你将随着时间的推移学会它们。如果你是从 Windows 切换到 Sonar，你会很容易适应，因为大多数功能的工作方式与你的旧系统一样。


    # 娱乐


    如果你采取了我们之前的建议，你已经知道当在概览中输入“music”时，Rhythmbox 是一个可以与 Apple 的 iTunes 竞争的多媒体中心。无论你想听
    Last.fm、你的 MP3 文件集，还是想订阅你喜喜欢的 Linux 播客，Rhythmbox 都能让你做到这一切以及更多。你可以从电脑上听，或将播放列表传输到手机、平板电脑或媒体播放器上随地听。


    你可以通过点击应用程序菜单找到如何调整偏好、查看所有设置和阅读手册的详细说明。记住，它就在 Sonar 顶部面板活动按钮旁边。点击时请确保 Rhythmbox
    是打开的。在探索 Sonar GNU/Linux 中提供的其他所有应用程序时，听一些音乐吧！


    ![](img/d983c24f03486345a839503325e9c4b2_12_0.png)


