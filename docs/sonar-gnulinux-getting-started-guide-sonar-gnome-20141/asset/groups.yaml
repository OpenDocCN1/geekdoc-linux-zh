    # Welcome


    Congratulations! You''ve made the operating system from a Windows PC to Sonar
    GNU/Linux. Some differences exist between Sonar GNU/Linux and proprietary operating
    systems, and you may encounter a small learning curve. Whether you are new to
    Linux or switching from Windows, this guide will help you get the most from your
    Sonar computer.


    # About Sonar GNU/Linux


    Sonar GNU/Linux (Sonar) is software for your computer – an operating system. It
    is unlike the operating systems that come pre-installed on other computers, like
    OSX from Apple, Windows from Microsoft or Chrome from Google. Sonar is focused
    on providing assistive technology. If you need an accessible operating system
    you have come to the right place. Search is over. Sonar is the perfect fit for
    you. If you don''t need assistive technology, don''t feel left behind. Sonar is
    a fully functional distribution of GNU/Linux that will work for you, too!


    Sonar is a modern and secure system that offers many amazing, and technology with
    unparalleled quality. It uses free assistive technology to make it the most accessible
    operating system available today. Sonar offers the following adaptive technology,
    pre-installed:


    +   1. A screen reader for blind and low vision people.


    +   2. A magnification program to help clarify the screen for low vision people.


    +   3. An on-screen keyboard for people who have low motor skills and experience
    difficulty using a keyboard. The on-screen keyboard can be used with a mouse or
    trackball to navigate the keyboard on screen.


    +   4. A font called OpenDyslexic, that is designed to increase the readability
    of on-screen and printed text for readers with dyslexia.


    # What is "GNU" anyway?


    Sonar is a version ("distribution") of GNU/Linux. Although "GNU" is a critical
    part of the operating system, it is frequently omitted in common conversation.
    As a result, Sonar GNU/Linux is often referred to as "Sonar Linux", or more simply
    as "Sonar." Throughout this document, we will use all three interchangeably.


    You may have heard that Linux is an open alternative to operating systems like
    Windows, and that it is the basis of Google''s Android and Chrome operating systems.
    On the other hand, "GNU" may be an unfamiliar term. In fact the operating system
    commonly called "Linux" is properly called "GNU/Linux" because without the GNU
    tools that allow the Linux kernel to interact with the you, computer would not
    do much. If you want to learn more about the GNU project and software freedom,
    you can find more information on the project''s website at https://www.gnu.org.'
