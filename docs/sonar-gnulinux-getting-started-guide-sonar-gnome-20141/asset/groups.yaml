    # # Translating from Windows to Sonar Linux


    You''ve made the switch from Windows to Sonar Linux, and now that you''re here,
    you might be feeling a bit lost. We''ve assembled this chart to make it easy for
    you to find the feature you''re looking for, whether it''s your printer settings,
    audio controls, or where all your files are located.


    | If you used this in Windows... | look here in Sonar... | Additional tips |

    |---|---|---|

    | Audio Controls | Sound | Status menu > Settings button > Sound |

    | Documents Folder | Home Folder | The home folder is where you put everything
    you create. Documents, audio files, videos, and more. |

    | File Explorer | File Manager | Sonar''s file manager is a powerful tool for
    managing and searching for files in your computer. |

    | Microsoft Word | LibreOffice Writer | LibreOffice Writer is a word processor
    that can create, open and save documents that you can share using Microsoft Word.
    |

    | Network and Sharing | Network | Status menu > Settings button > Network |

    | Notepad | Text Editor | Gedit is the name of the text editor in Sonar. |

    | Printers and Faxes | Printers | Status menu > Settings button > Printers |

    | Recycle Bin | Trash | Trash is a less "politically correct" but you can still
    recycle its contents if you need to recover something you''ve thrown away. |

    | Jaws Screen Reader | Orca Screen Reader | Orca is a free, open source, flexible,
    and extensible screen reader that provides access to Sonar''s graphical desktop
    and/or braille. |

    | iTunes | Rhythmbox | Listen to music, podcasts, and more. You can even transfer
    the files to your MP3 player for mobile listening.|


