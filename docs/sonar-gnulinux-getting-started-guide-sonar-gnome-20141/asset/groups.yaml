    \n# Welcome\n\nCongratulations! You've made the operating system from a Windows\
    \ PC to Sonar GNU/Linux. Some differences exist between Sonar GNU/Linux and proprietary\
    \ operating systems, and you may encounter a small learning curve. Whether you\
    \ are new to Linux or switching from Windows, this guide will help you get the\
    \ most from your Sonar computer.\n\n# About Sonar GNU/Linux\n\nSonar GNU/Linux\
    \ (Sonar) is software for your computer – an operating system. It is unlike the\
    \ operating systems that come pre-installed on other computers, like OSX from\
    \ Apple, Windows from Microsoft or Chrome from Google. Sonar is focused on providing\
    \ assistive technology. If you need an accessible operating system you have come\
    \ to the right place. Search is over. Sonar is the perfect fit for you. If you\
    \ don't need assistive technology, don't feel left behind. Sonar is a fully functional\
    \ distribution of GNU/Linux that will work for you, too!\n\nSonar is a modern\
    \ and secure system that offers many amazing, and technology with unparalleled\
    \ quality. It uses free assistive technology to make it the most accessible operating\
    \ system available today. Sonar offers the following adaptive technology, pre-installed:\n\
    \n- 1. A screen reader for blind and low vision people.\n- 2. A magnification\
    \ program to help clarify the screen for low vision people.\n- 3. An on-screen\
    \ keyboard for people who have low motor skills and experience difficulty using\
    \ a keyboard. The on-screen keyboard can be used with a mouse or trackball to\
    \ navigate the keyboard on screen.\n- 4. A font called OpenDyslexic, that is designed\
    \ to increase the readability of on-screen and printed text for readers with dyslexia.\n\
    \n# What is \"GNU\" anyway?\n\nSonar is a version (\"distribution\") of GNU/Linux.\
    \ Although \"GNU\" is a critical part of the operating system, it is frequently\
    \ omitted in common conversation. As a result, Sonar GNU/Linux is often referred\
    \ to as \"Sonar Linux\", or more simply as \"Sonar.\" Throughout this document,\
    \ we will use all three interchangeably.\n\nYou may have heard that Linux is an\
    \ open alternative to operating systems like Windows, and that it is the basis\
    \ of Google's Android and Chrome operating systems. On the other hand, \"GNU\"\
    \ may be an unfamiliar term. In fact the operating system commonly called \"Linux\"\
    \ is properly called \"GNU/Linux\" because without the GNU tools that allow the\
    \ Linux kernel to interact with the you, computer would not do much. If you want\
    \ to learn more about the GNU project and software freedom, you can find more\
    \ information on the project's website at https://www.gnu.org.\n\n# # Translating\
    \ from Windows to Sonar Linux\n\nYou've made the switch from Windows to Sonar\
    \ Linux, and now that you're here, you might be feeling a bit lost. We've assembled\
    \ this chart to make it easy for you to find the feature you're looking for, whether\
    \ it's your printer settings, audio controls, or where all your files are located.\n\
    \n| If you used this in Windows... | look here in Sonar... | Additional tips |\n\
    |---|---|---|\n| Audio Controls | Sound | Status menu > Settings button > Sound\
    \ |\n| Documents Folder | Home Folder | The home folder is where you put everything\
    \ you create. Documents, audio files, videos, and more. |\n| File Explorer | File\
    \ Manager | Sonar's file manager is a powerful tool for managing and searching\
    \ for files in your computer. |\n| Microsoft Word | LibreOffice Writer | LibreOffice\
    \ Writer is a word processor that can create, open and save documents that you\
    \ can share using Microsoft Word. |\n| Network and Sharing | Network | Status\
    \ menu > Settings button > Network |\n| Notepad | Text Editor | Gedit is the name\
    \ of the text editor in Sonar. |\n| Printers and Faxes | Printers | Status menu\
    \ > Settings button > Printers |\n| Recycle Bin | Trash | Trash is a less \"politically\
    \ correct\" but you can still recycle its contents if you need to recover something\
    \ you've thrown away. |\n| Jaws Screen Reader | Orca Screen Reader | Orca is a\
    \ free, open source, flexible, and extensible screen reader that provides access\
    \ to Sonar's graphical desktop and/or braille. |\n| iTunes | Rhythmbox | Listen\
    \ to music, podcasts, and more. You can even transfer the files to your MP3 player\
    \ for mobile listening. |\n\nSonar GNU/Linux Getting Started Guide Page 5\n"
