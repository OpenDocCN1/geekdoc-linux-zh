    smoothness, dwelling time and more!


    To learn how to use and configure Eviacam, the user''s manual is available within
    the software. It''s on-line at http://eviacam.sourceforge.net/help/en/en/contents.html.


    # Using Applications


    Now you have Sonar installed you most likely to know what applications are installed,
    and how to use them. If you would like to see a list of all your applications
    you can press Super+A. This will bring up a list of all the applications you have
    installed on your system. You can choose any application from this list and press
    enter or click on it to launch it. We won''t cover any of the preinstalled applications
    here, but let''s discuss which will be most popular.


    # Web Browser


    One of the first applications you might want to use is the web browser, Firefox.
    To open Firefox, press the Super key also known as the Windows key. This will
    bring up the Overview. You can also get there by clicking the Activities button
    as we described earlier. Now that the Overview is up, start to type "firefox"
    and it should automatically fill the text box. Once you see it you can press Enter
    and Firefox will open. You can do the same with any installed application.


    Now the Overview is pretty powerful. Not only can you search for applications
    by name, but you can also search by the function of the application. For example,
    type something like "music" and Sonar will find any applications that you have
    installed that have anything to do with music. So you don''t need to know the
    name of the program. Sonar will find it for you using the Overview. You can also
    search for files and folders, so you just type the name of the file or folder
    and will bring it up in the Overview. So really the Overview is Sonar''s powerful
    search tool for your whole system.


    # Word Processor


    You might want to create a simple document, compose a newsletter, or write a novel,
    then save your work in a file. Word processor is the perfect tool for this and
    Sonar already has one waiting for you to. Sonar is pre-installed with the LibreOffice
    suite of applications that includes a word processor (Writer), a spreadsheet application
    (Calc), a program for creating professional presentations (Impress), a formula
    editor for scientific or school work (Math), and a database for cataloging anything
    you want (Base).


    As we have before, by opening the Overview by pressing the Super key. Start to
    type "word processor" or "writer" and the word processor will be highlighted before
    you can finish typing! Press Enter to open LibreOffice Writer. Just like any word
    processor you have ever used, you can type on the screen, change the font, format
    the text using bold, underline and italics, create tables, insert pictures and
    more. Press the Save icon to save your work, Control+P to print, and exit using
    Control+Q.


    With all operating systems, Sonar provides more than one way to accomplish each
    of these actions, and you will learn them over time. If you have switched to Sonar
    from Windows, you will adapt easily because most things work the same way they
    did on your old system.


    # Entertainment


    If you took our suggestion earlier, you will already know that when you type "music"
    at the Overview, the application Rhythmbox is a multi-media powerhouse that rivals
    Apple’s iTunes. Whether you want to listen to Last.fm, your collection of MP3
    files, or you are looking to subscribe to your favorite Linux podcast, Rhythmbox
    gives you the ability to do all that and more. You can listen from your computer,
    or transfer your play lists to your mobile phone, tablet or media player, and
    listen on the go.


    You''ll find detailed instructions on how to adjust the preferences, view all
    of the settings, and read the manual, by clicking the Application menu. Remember
    that''s right next to the Activities button on Sonar''s top panel. Make sure Rhythmbox
    is open when you click. Play some tunes while you explore all of the other applications
    available to you in Sonar GNU/Linux!


    ![](img/d983c24f03486345a839503325e9c4b2_12_0.png)


    Illustration 5: The Rhythmbox media player


    # Staying Secure and Up To Date


    # Getting the Latest Updates


    When updates are available for Sonar or any of its applications, the Update Manager
    displays a notification at the bottom of the screen.


    The updates are free, and are available for download from the software repositories,
    also known as "repos." You use the Update Manager to perform the updates.


    1. Click the Activities button (or press the Super button) to open the Overview.

    2. Type "software update" and press Enter. The Update Manager opens and pauses
    for a moment or two to contact the software repositories.

    3. When the list has refreshed, if there are updates, you simply click the Apply
    button and provide your Sonar password to start downloading all of the updates.

    4. A progress bar keeps you informed as the download and installation proceeds.


    ![](img/d983c24f03486345a839503325e9c4b2_13_0.png)


    | Update Manager | |

