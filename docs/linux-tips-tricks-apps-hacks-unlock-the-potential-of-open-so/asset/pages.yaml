- pgno: 17
  md: '# # FASTER BETTER SERVERS


    UP YOUR COMPUTING POWER WITH AN UPGRADED OR BRAND NEW SERVER THAT YOU CAN BUILD
    YOURSELF


    While big business and big data may be utilising mainframes more of late, the
    concept of servers is not going away any time soon. Servers are an integral part
    of any system, however large your IT infrastructure is. Whether it’s inside the
    data centre or tucked away in your (well-ventilated) cupboard at home, there are
    still a lot of uses for servers in 2015.


    For the office you may want to save a bit of money and create something perfect
    for your needs that you know exactly how to maintain. For home you may just want
    to enhance your setup and make the entire network more efficient. For both it’s
    a great way to separate


    certain aspects of your network to control it in a more efficient way.


    There are many components of a server that you need to keep in mind, but it boils
    down to an appropriate hardware selection and a good distro for the task at hand.
    In this tutorial, we are going to concentrate on file and web servers, two base
    server systems that can be expanded and modified in multiple ways to best fit
    the situation you are in.


    As we’re teaching you how to build a better web server, we will first take a quick
    detour to tell you what you should know if you want to upgrade your current server
    so that it can compete with the new tech.


    ![](img/30dc0459712b32ede1a3814d456b41b6_17_0.png)'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # **UPGRADING TO A BETTER SERVER**


    If you have a server, an upgrade may be all it needs to run better


    You may already have a server, in which case instead of actually building a better
    server from scratch, you may want to just upgrade your server to be more efficiently
    than it was before. There are several ways of doing this depending on how you
    want to improve your server, and most of them require a hardware upgrade. If you
    decide to go down the hardware upgrade route, refer overleaf to see the kind of
    hardware we recommend and learn some quick tips on how to install it if you''re
    new to system building.


    The easiest upgrade is storage space, especially for file servers. For Linux systems
    you can quite simply just add an extra hard drive into the case, as long as you
    have room in terms of spare SATA cables and power. Once installed, reboot your
    system and you can start adding the hard drive under /etc/fstab so that it automatically
    mounts to a specific location – in this case, the location on the filesystem which
    needs a bit more storage. Otherwise, you can create a clone of the system using
    Clonezilla (clonezilla.org) and then restore it to a larger hard drive with almost
    no change in the way it works.


    ![](img/30dc0459712b32ede1a3814d456b41b6_18_0.png)


    **Above** RAM is much more important in a server than a desktop PC, as you need
    to serve several people


    For other system hardware, you need to ask yourself which section is slow and
    perhaps needs upgrading. If it''s a little slow for certain operations and computational
    tasks, your first port of call should be upgrading the CPU. Depending on how forward-thinking
    you were when building or buying the original system, the motherboard may support
    newer processors than the one inside it. Find out the socket information and start
    a search for a new CPU. While you''ll need enough RAM to support the CPU and whatever
    the server is being used for, you''ll always need more for one handling web services
    than file-serving. You can easily replace this kind of parts without having to
    reinstall Linux.


    If you''re doing heavy computational tasks and can use hardware acceleration for
    it, look at getting a new video card to support it – although not many servers
    will even require one, let alone a good one.


    If you''ve reached the limit of your current motherboard, it''s time to gut the
    system and get a new mobo, CPU, RAM and GPU if you need it – backing up important
    files and settings is a good idea before you attempt this as Linux may not be
    able to work with completely new hardware without a reinstall.


    Otherwise, if you need a software upgrade then refer to whatever guide is relevant
    to you in this feature on how to install and setup a new distro.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Tips | Tricks | Hacks | Apps


    # CHOOSING HARDWARE


    # What kind of hardware will you require to build a better server?


    # The hardware in a server is a very important consideration for building your
    system


    Servers handle different requests to a normal desktop machine, often handling
    several people''s requests at once. This means that the resource priorities have
    changed and these can even be different between various types of servers. Software
    counts as well, of course, but without a decent hardware base, it will be tricky
    to have the server work as intended. Scalability and peak loads need to be considered
    as a future-proofing method, so always try and make sure that you have a bit more
    power than you need. With all that said, let''s start looking at the individual
    components.


    There are six main components you need to put thought into, and the four most
    important ones are the motherboard, the processor, RAM and power supply – the
    core components on any computer. As we mentioned, you need to think differently
    about what you need components-wise because resource usage is different.


    A minor concern for some will be a graphics card of some kind, whether it''s so
    you can directly interface with the system or do computational work that benefits
    from multiple different cores instead. You''ll also need a good storage solution
    for your server build.


    # Motherboard


    Motherboards for servers come in various styles. A lot of server boards will have
    two ports to connect a CPU to, which is good for servers used for small businesses
    or if you expect to get a lot of requests on a regular basis. These are more expensive
    than single-CPU systems, but the benefits in the long run for a big office server
    are more than worth it.


    For home use, a single slot for a processor will do you fine for most cases, the
    main exception being a web server where you plan to have a lot of regular connections
    made to it. In this case, you want to keep an eye out for motherboards with plenty
    of storage and connection slots to make it as flexible and scalable as possible.


    # CPU


    The most important thing for a server CPU is the number of cores – that''s why
    dual-slot can be quite useful. More cores allows for more threads, essential if
    you plan to run VMs off a file server or several sites at the same time. Clock
    speed is not as important, but you should at least get one that is not ridiculously
    slow and comes with a decent cache.


    With Intel''s Hyper Threading, each core can work harder by creating multiple
    threads in each core. Conversely, AMD processors will offer more cores for a lower
    price, especially if you''re on a budget.


    # RAM


    A larger amount of RAM is more important on servers than it is on a desktop PC,
    enabling you to run more operations at once. Speed and latency is not so important,
    so gaming RAM with tweaked timings will not grant you a better system – in fact,
    it may be slightly worse since they don''t have ECC. ECC fixes single-byte errors
    that make up the most common forms of data corruption in the RAM.


    # PSU


    While it''s best practice to never skimp on a power supply, it''s near essential
    when it comes to server power. While you may need 1,000+ watts for your ridiculous
    4K gaming rig (electricity bills be damned), you can be a little more reserved
    on the peak power for a home server, depending on its intended use. Look for power
    supplies with an "80 Plus" rating, as these ones have been through some level
    of certification to ensure that they have a degree of efficiency – this is a good
    idea for servers that are on all the time as they will save on electricity bills
    in the long run. Titanium and Platinum are the highest ratings, meaning they''re
    at least 90 per cent efficient (95 per cent efficient for server power supplies).


    ![](img/30dc0459712b32ede1a3814d456b41b6_19_0.png)


    > Above You won''t need a GPU if your mobo has onboard graphics and you don''t
    need multi-core processing


    # MOTHERBOARD


    > When we talk about slots and connections for a motherboard, we''re talking about
    PCI slots and plenty of SATA drive slots. You can add more SATA slots via a card,
    but you''ll need to take into account any thinking else you''d want to add a card
    for. You need to make sure the motherboard''s chipset matches up with the kind
    of CPU you want as well, and the CPU will also dictate the type of RAM you get.
    It''s a multi-layered balancing act that may result in a sea of tabs while you
    compare and contrast


    # FIBRE CARD


    Networking cards can be essential if your server is also acting like a more traditional
    network server, handling all your network data and even being used as a modem
    and firewall. There are plenty of different PCI cards for these kinds of tasks,
    including this fibre card for a bit more serious Internet use


    ![](img/30dc0459712b32ede1a3814d456b41b6_19_1.png)'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Storage


    Depending on your storage requirements, there are multiple solutions that you
    can use. At the very least we recommend you split up your storage with an SSD
    for the operating system and associated settings files, and use standard hard
    drives for storing everything else. This way, when the general files are not being
    accessed, the operating system can still run while drawing much less power.


    Otherwise, your actual mass storage can be configured in multiple ways. You can
    have straight drives connected with USB for minimal complexity. Or you can start
    looking down the RAID route – mirroring in case of drive failure, striping to
    more efficiently use the space of two hard drives, or even going as far as RAID
    5 and 6, which increases complexity but enables you to create one large, consistent
    storage space with redundancy failures. The more complex you go though, the more
    difficult it can be to maintain and the more catastrophic a major failure can
    be.


    # PSU


    When picking a PSU you need to keep in mind a few things, such as what kind of
    connectors you need. This can depend on your motherboard, the amount of hard drives
    you’re using, any extras like case fans and case I/O panels. If you want a better
    idea of what kind of wattage you will need, you can use this tool to figure it
    out: bit.ly/1pjcnis


    # CASE


    For server cases, you need to think of where you’re using your server. At home,
    a silent case can be great, with padding to keep the noise down while it runs
    all the time. In the office, and assuming it will be taxed a bit more, you’ll
    need to take into consideration proper cooling. Size is also a factor, as you
    need to fit your parts in


    # RAM


    You don’t need RAM with heat sinks for server PCs, really – it’s usually reserved
    for gaming RAM with tweaked timings. If you are concerned with the heat of your
    system and have a little more budget to spend, get RAM with some kind of heat
    dissipater


    # DVD DRIVE


    They’re more rarely needed these days, but it can sometimes be handy to have an
    optical drive for transferring data or to have ISOs installed to. If you’re using
    your server to serve files and media, you can create redirect to be able to play
    DVD or Blu-ray movies, or even rip ones that don’t come with any DRM at all


    ![](img/30dc0459712b32ede1a3814d456b41b6_20_0.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# # BUILD A FILE SERVER\n\nStore and serve files around your network or further\n\
    \nFile servers are very useful for both home and business environments. For home,\
    \ it's a good way to have a more low-power, dedicated solution to storing your\
    \ media and backing up your systems, without needing to specifically turn on your\
    \ desktop machine to get the files – a desktop machine that may use more power\
    \ idling than a dedicated file server.\n\nFor enterprise, it can not only be useful\
    \ for backups, but also provides for off-machine networked storage for individual\
    \ users that can be accessed from within and outside the network. So, let's set\
    \ a server up.\n\nFor a simple server type such as this, we're going to go ahead\
    \ and use Ubuntu Server to set up the system. This means that if you have any\
    \ experience with Linux, it should be easy to maintain and install more software\
    \ on if you need to.\n\nIf you're doing the initial setup for a home server then\
    \ installing it with a monitor attached will be much easier. Burn the ISO to an\
    \ installable medium or boot it over the network if you have the facilities set\
    \ up, then hit return on 'Install Ubuntu Server' to continue.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_21_0.png)\n\
    \nLike the graphical Ubuntu, the server edition comes with options to automatically\
    \ set up the partitions – by default, using the whole disc will create an install\
    \ partition and a swap. If you want it to use a specific set of partitions, we\
    \ recommend sorting them out with GParted before trying to install, and then assigning\
    \ the partitions manually yourself.\n\nDuring installation you'll get some extra\
    \ questions about whether you need a proxy or not; set that up as you wish and\
    \ then it will ask about other services to install. As we're using this as a file\
    \ server, make sure OpenSSH is installed so we can dial in from another machine\
    \ on the network and ensure that a Samba server is installed, to make sharing\
    \ files and such over the network easier and compatible with any Windows machines.\n\
    \nFinally, it will prompt you to install GRUB. Assuming this is a dedicated file\
    \ server, we can let it overwrite the master boot record. Once that's done you\
    \ will restart the system, so make sure you remove the live boot medium. After\
    \ it loads up, you will be dumped into the command line to log in – as this is\
    \ a server distro, there is no desktop environment.\n\n# ## Installation\n\nThe\
    \ installation for the server edition is different from the usual graphical installer\
    \ of Ubuntu – it's a command line one, albeit with fairly straightforward options.\
    \ After setting up your location, language and keyboard settings, it will try\
    \ and detect your hardware for you. Give your server a name, set up your username\
    \ and password, and then continue with the installation as directed.\n\n# ## First\
    \ steps\n\nNow we're into Ubuntu, we'll first get set up to SSH into the machine.\
    \ For something like a home server it's best to set a static IP, and we can do\
    \ that in /etc/network/interfaces. Open it up with:\n\n![](img/30dc0459712b32ede1a3814d456b41b6_21_1.png)\n\
    \n```\n`$ sudo nano /etc/network/interfaces`\n```\n\n...and change the primary\
    \ network interface to be something like:\n\n```\n```\nauto eth0\niface eth0 inet\
    \ static\n    address [Desired IP]\n    netmask 255.255.255.0\n    gateway [Router\
    \ address]\n```\n```\n\nIf you are using a wireless connection, make sure you\
    \ switch it to wlan0 and then add in details for the SSID and password.\n\nWith\
    \ the IP you've set, or using ifconfig to find out what the IP has been automatically\
    \ set as, you can now SSH into your machine using the username and password that\
    \ you set up. From a machine on the same network, type:\n\n```\n`$ ssh [username]@[IP\
    \ address of server]`\n```\n\nEntering the password will grant you access to the\
    \ same command line interface.\n\n# ## Shared folders\n\nNow we can create a shared\
    \ folder that the rest of the network can see and modify. First, let's create\
    \ the folder that we want to use and put it in the normal home directory, with\
    \ a usual:\n\n```\n`$ mkdir ~/networkshare`\n```"
  merge: -1
  img_proc: true
- pgno: 22
  md: '# EXTRA FILE SERVER USES


    File servers can be useful for other things as well


    ![](img/30dc0459712b32ede1a3814d456b41b6_22_0.png)


    It''s best if you don''t use any spaces, to make the sharing simpler. Once done,
    you''ll need to create a password for Samba. Do this by entering:


    ```

    $ sudo smbpasswd -a [username]

    ```


    It will ask you to enter and then confirm the password. Once that''s done, and
    with the folder created, we can add it to the Samba server. Access the config
    file using:


    ```

    $ sudo nano /etc/samba/smb.conf

    ```


    Go to the very end of the file and add something like the following to get the
    shared folder recognised by Samba:


    ```

    [NetworkShare]

    path = /home/[username]/networkshare

    available = yes

    valid users = [username]

    read only = no

    browsable = yes

    public = yes

    writable = yes

    ```


    Save the file and exit, then restart Samba:


    ```

    $ sudo service smbd restart

    ```


    And finish by testing the setup with **testparm** to ensure everything runs okay.


    > Above left: For a flexible, scalable server, consider trying [MAAS: maas.ubuntu.com/docs/1.5](https://maas.ubuntu.com/docs/1.5)


    > Above right: [Ubuntu Server](https://www.ubuntu.com/server) makes it easy to
    grab the software you need during installation


    ![](img/30dc0459712b32ede1a3814d456b41b6_22_1.png)


    # VPN


    Dialling in externally from a remote location to VPN into your server can have
    added benefits. Accessing your files remotely is one thing, but also being able
    to use a more unrestricted Internet service (yours) can be handy if you''re stuck
    in a hotel or other location with strict browsing regulations.


    Setting it up is not too difficult and requires the server to be connected to
    the Internet wherever it stays. The more users you allow to VPN from it, the more
    resources you''ll require (including RAM and processing power).


    ![](img/30dc0459712b32ede1a3814d456b41b6_22_2.png)


    # Torrent server


    With all the storage and possibly a connection to the Internet, you can set up
    the file server to also be a torrent server. This will enable you to give back
    to the community by seeding the latest distro torrents, as well as making sure
    you have the latest version of certain distros for you to install and test with.
    Just adding a torrent service into it; you can find a good one for command lines
    is [tTorrent](https://github.com/igorgt/tTorrent). Not only can you view a useful
    command-line interface with it, but you can also set a folder that it reads for
    new torrents.'
  merge: -1
  img_proc: true
- pgno: 23
  md: "# # BUILD A WEB SERVER\n\nHost your web services on a dedicated server that\
    \ you control\n\n+   01\n+   **Install Apache**\n+   \n+   Once you've got your\
    \ server set up and can SSH in, it's time to install the Apache web server. Do\
    \ that using the following:\n+   \n+   ```shell\n+   $ sudo apt-get install apache2\n\
    +   ```\n+   \n+   It will automatically set the domain address to the following:\
    \ 127.0.0.1\n\n![](img/30dc0459712b32ede1a3814d456b41b6_23_0.png)\n\nAbove Give\
    \ your web server a test once you've installed Apache\n\n> > “With a web server\
    \ you can now use it to host your own website or to access storage from the server\
    \ remotely over the Internet”\n\n+   02\n+   **Test server**\n+   \n+   If you\
    \ have to install a GUI onto your server, you can test out that Apache is working\
    \ by going to a browser in it and navigating to 127.0.0.1. Otherwise, from an\
    \ external system, navigate to the IP address of your system in your browser and\
    \ it should show the Apache confirmation page on-screen.\n\n+   03\n+   **Install\
    \ FTP**\n+   \n+   With a web server you can now use it to host a website or to\
    \ access storage from the server remotely over the Internet. You can set up the\
    \ latter using FTP, or in our case the secure VSFTP. Install it to the system\
    \ using:\n+   \n+   ```shell\n+   $ sudo apt-get install vsftpd\n+   ```\n\n+\
    \   04\n+   **Configure FTP**\n+   \n+   We can access the configuration file\
    \ for FTP by using nano to open /etc/vsftpd.conf (sudo nano /etc/vsftpd.conf).\
    \ From here we can configure it to match our uses, but first it is necessary that\
    \ we increase the security just slightly before using it properly as an FTP server,\
    \ just to be on the safe side.\n\n+   05\n+   **Secure your FTP**\n+   \n+   The\
    \ main change to make the FTP secure is to turn off anonymous users. In the config\
    \ file, look for the line with 'anonymous_enable'. We want to change this to NO\
    \ if it's not already there, just to make sure that there is a bit more security\
    \ for the FTP server and that all of your content is kept private."
  merge: -1
