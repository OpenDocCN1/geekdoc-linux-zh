- pgno: 96
  md: "# \"With just a desktop computer and SD card reader, there is a way that you\
    \ can recover your password\"\n\n```\npi@raspberrypi:~$ sudo useradd -m aliciaokarma\
    \ -G sudo\npi@raspberrypi:~$ sudo passwd aliciaokarma\nEnter new UNIX password:\n\
    Retype new UNIX password:\npassed: password updated successfully\nCommand \"sudo\
    \ passwd\" completed. \n```\n\n# **01 Stop using the default password**\n\nEveryone\
    \ who uses a Raspberry Pi knows that the default Raspberry credentials are 'pi'\
    \ and 'raspberry'. Naturally, this means that anyone can sign into your computer\
    \ if you haven't changed these defaults - something you'll need to do as a matter\
    \ of urgency. After signing in, open the terminal and set a new password with:\n\
    \n```\npassword\n```\n\n![](img/30dc0459712b32ede1a3814d456b41b6_96_0.png)\n\n\
    # **04 Give the new account a password**\n\nWith the new account set up, the next\
    \ step is to set a password. As you're not signed into the account at this stage,\
    \ you won't be using the `passwd` command. Instead, enter:\n\n```\nsudo passwd\
    \ username\n```\n\nWith the new account ready to use, you should be ready to remove\
    \ the default pi account from Raspbian altogether.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_96_1.png)\n\
    \n# **02 Change password with raspi-config**\n\nIf you're setting up a new installation\
    \ of Raspbian, changing the password is one of the first things that you should\
    \ do. With a new install, the first boot will automatically run the raspi-config\
    \ screen. Here, use the arrow keys to find the second option, change User Password\
    \ and then follow the on-screen prompts to set yourself a new password.\n\n```\n\
    pi@raspberrypi:~$ sudo useradd -m aliciaokarma -G sudo\npi@raspberrypi:~$ sudo\
    \ passwd aliciaokarma\nEnter new UNIX password:\nRetype new UNIX password:\npasswd:\
    \ password updated successfully\n```\n\n# **05 Delete the default Raspbian account**\n\
    \nYou no longer need the default user account, so sign out and log in to your\
    \ new account, and confirm it is correctly set up by opening:\n\n```\nsudo visudo\n\
    ```\n\n...and adding...\n\n```\nusername ALL=(ALL) NOPASSWD: ALL\n```\n\n...to\
    \ the final line. Save and exit with Ctrl+X. Now that's done, simply delete the\
    \ old account with:\n\n```\nsudo deluser pi\nsudo 'deluser --remove-home pi'\n\
    ```\n\n# **03 Create a new user account**\n\nTo completely baffle anyone attempting\
    \ to gain access using default credentials, take the most secure option and create\
    \ a new user account. In the command line, enter:\n\n```\nsudo useradd -m username\
    \ -G sudo\n```\n\nThe -m switch creates a new home directory, while the second\
    \ sudo adds the new account to the superuser group.\n\n# **06 Recover a lost password**\n\
    \nIf you've somehow forgotten your Raspberry Pi user account password or suspect\
    \ that someone has changed it, what can you do?\n\nWith a desktop computer and\
    \ SD card reader, there is a way that you can recover your password. Begin by\
    \ inserting the Pi's SD card into your PC's SD card reader.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_96_2.png)"
