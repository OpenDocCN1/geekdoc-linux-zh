- pgno: 59
  md: '# No matter where you deploy your app, Capistrano makes it easy to deploy Rails
    (and other platforms) to *nix servers


    # Changes like adding a QA staging after production, with qa.rb, are both possible
    and easy with its modular structure


    ![](img/30dc0459712b32ede1a3814d456b41b6_59_0.png)


    Built from Ruby, and originally for Rails, Capistrano 3 is a great fit for deploying
    other web platforms


    Capistrano''s flexibility and power can mean a lot of config, but it''s relatively
    straightforward


    # Continuously deploy web apps with Capistrano


    # Move your web apps'' development versions painlessly from staging and testing
    to deployment on databases and web servers


    # Resources


    +   * Ruby >= 1.9 (RbENV makes it easier)

    +   * git www.git-scm.com

    +   * Capistrano 3 www.capistranorb.com


    Capistrano automates deploying web apps to your servers, taking care of tiresome
    tasks like running a series of remote commands on any box on which you have SSH
    access. Capistrano''s main recipe is deploy, containing tasks such as rollback,
    which consists of groups of commands. Servers are given roles: app – application
    servers, web – web servers, and db – database servers. Within this (expandable)
    framework, it''s easy to adjust Capistrano''s configuration files for your particular
    app and collection of servers. Basic set up is simple enough, but Capistrano 3
    is a flexible framework


    and you will need to go a long way beyond this simple introduction if you want
    to begin to get the full use of it. You will need a recent Ruby, Git (plus a GitHub
    account) and a Rails project you''re working on. Also rbenv makes working with
    Rails easier, and capistrano-rbenv makes sure Capistrano uses the correct makes
    version of Ruby for deployment. It doesn''t matter whether you run Passenger,
    Unicorn or Puma as your app server, but note that there are Capistrano plugins
    to help with extra tasks on all of them. Search rubygems.org for the full choice.'
  merge: -1
  img_proc: true
- pgno: 60
  md: "![](img/30dc0459712b32ede1a3814d456b41b6_60_0.png)\n\n![](img/30dc0459712b32ede1a3814d456b41b6_60_1.png)\n\
    \n# 01 Install Capistrano\n\n# 03 On the server\n\nEssentially, Capistrano copies\
    \ your app from Git, over SSH, to your server and takes care of all the operations\
    \ you'd have to do if you were to move the files by hand. Capistrano will deal\
    \ with any database migration, changes to files and file names, restarting the\
    \ web server and so on. Installing Capistrano, and the extras package which is\
    \ nice to have, is as simple:\n\n```\ngem install capistrano\n```\n\nAny problems,\
    \ check your Ruby installation. The capistrano-ext gem you may see referred to\
    \ elsewhere is no longer essential, as features like extra staging options have\
    \ been integrated into the main codebase.\n\nOn your servers, you'll need a similar\
    \ environment of rbenv, Git and your choice of Apache or Nginx. Use rbenv to grab\
    \ the latest Ruby (or an earlier one if appropriate to your app):\n\n```\nrbenv\
    \ install --list\nrbenv install 2.1.3\n```\n\nYou won't need unnecessary packages\
    \ like Ruby documentation so when you come to install bundler, specify no docs:\n\
    \n```\ngem install bundler --no-ri --no-rdoc\n```\n\nBetter yet, put:\n\n```\n\
    gem: --no-rdoc --no-ri\n```\n\n...in `/.gemrc`. You'll also need to set up the\
    \ database - or separate database server - as required by your setup. A typical\
    \ Rails use case is SQLite on the developer's laptop and PostgreSQL on the production\
    \ servers.\n\ninclude Capistrano and anything else you want. You'll want more\
    \ gems. In your project's Gemfile:\n\n```\ngem \"capistrano\", \"~> 3.2.1\"\n\
    gem \"capistrano-rails\", \"~> 1.1.2\"\ngem \"capistrano-bundler\" # if you are\
    \ using RBENV\ngem \"capistrano-btm\", \"~> 2.0\" # if you're using Unicorn app\
    \ server\ngem \"unicorn\"\n# Otherwise gem \"passenger\" or \"puma\"\n```\n\n\
    This will also integrate bundler with Capistrano. bundle install downloads the\
    \ gems specified in your Gemfile and installs them.\n\nThe `~> 3.2.1` means that\
    \ while 3.2.2 will be installed when it's released, 3.3.0 will not to avoid major\
    \ version changes breaking your code.\n\n# 02 SSH Keys\n\nIf you've been logging\
    \ into your web server with a SSH password, it's time to generate keys. This is\
    \ so that the login can be automated for Capistrano (or any other scripts you\
    \ want) to use - it's a good idea to do this on any server. You'll also need it\
    \ for your GitHub account if you are going to be setting one up. Start generating\
    \ the keys with:\n\n```\nssh-keygen -t rsa\n```\n\n...if you've not got one already\
    \ in `~/.ssh` - and copy the `~/.ssh/id_rsa.pub` to the server with:\n\n```\n\
    ssh-copy-id -i ~/.ssh/id_rsa.pub user@ \nremote-host\n```\n\n...which works by\
    \ substituting your username, and servername or address.\n\n# 04 Bundling gems\n\
    \nFor a Rails project, you can skip the install step and simply edit your Gemfile\
    \ to\n\n![](img/30dc0459712b32ede1a3814d456b41b6_60_2.png)\n\n> “Capistrano will\
    \ deal with any changes to files and file names”"
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_61_0.png)


    # 05 Bundle/deploy


    `bundle exec cap install` creates the necessary config files and directories.
    It is in these that we specify the actions that Capistrano takes to deploy our
    app to staging or to our production servers.


    Note that staging and production are created by default with files under `config/deploy`,
    and you can add a `.cap` file to that sub-dir if you wish to add a third stage.
    Alternatively, you can create all the extra stages at installation time.


    `cap install STAGES=staging,production,ci,qa`


    ![](img/30dc0459712b32ede1a3814d456b41b6_61_1.png)


    “Note that staging and production are created by default”


    ![](img/30dc0459712b32ede1a3814d456b41b6_61_2.png)


    # 06 Config


    The last step created the Capfile, tasks under `lib/capistrano` and deployed files
    under `config/`. Start with editing the Capfile by uncommenting the lines:


    ```

    require "capistrano/benv"

    require "capistrano/bundler"

    require "capistrano/rails/migrations"

    ```


    ...and make sure that the line starting `Dir.glob` at the end of the above screenshot
    is present and uncommented. This line ensures that all of the Rb files below `lib/capistrano`
    get loaded, including any custom tasks in `lib/capistrano/tasks` that you’ll want
    to later define.


    ![](img/30dc0459712b32ede1a3814d456b41b6_61_3.png)


    # 07 Secrets


    Remember that everything in our app is being shared with the team and anyone else
    who has access to our Git repository, including exposed passwords. Edit your `.gitignore`
    file to add this line:


    ```

    /config/database.yml

    ```


    Now you can edit `/config/database.yml` that in your database locally and in your
    staging and production environments.


    Restart your Rails server and check it’s working properly at `http://localhost:3000`


    # 08 Prepare to deploy


    In deploy.rb, ahead of `namespace :deploy`, you should add some lines relevant
    to your project:


    ```

    require "bundler/capistrano"

    ```


    ```

    server "37.59.xx.xx", :web, :app, :db, :primary => true

    set :application, "myblog"

    set :user, "richard"

    set :deploy_to, "/var/www/fetch(:application)"

    # set :use_via, :remote_cache

    # set :use_sudo, false

    # repo details

    set :scm, "git"

    set :repository, "git@github.com:me/myblog.git"

    set :branch, "master"

    ```


    ```

    default_run_options[:pty] = true

    ssh_options[:forward_agent] = true

    set :keep_releases, 5

    ```


    Note that here we’re deploying to just one server. You might also want to add
    some specifics for your Ruby environment:'
