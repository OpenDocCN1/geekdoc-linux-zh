    # # Create a caching DNS server for query requests using BIND


    Reduce your network traffic and serve DNS requests faster by running your very
    own caching DNS server


    # ## Resources


    +   - **BIND home page**

    +     www.isc.org/software/bind

    +   - **RFC 1034, Domain Names**

    +     tools.ietf.org/html/rfc1034

    +   - **RFC 5936, AXFR**

    +     tools.ietf.org/html/rfc5936


    **DNS (Domain Name System) is what converts a human readable string to an IP address
    (and vice versa) – when it does not work properly, you cannot browse the Internet
    or get your email.** Machines called DNS servers, or simply name servers, support
    the Domain Name System. These machines are nothing extraordinary except the fact
    that they run special server software to support DNS. A network device must have
    at least one properly configured DNS server in order to operate normally, but
    for added redundancy you should


    use more name servers to ensure that the network device is operational regardless
    of any problems. A name server should always be stated with its IP address. A
    DNS zone is a part of a domain name that its administration has been delegated.
    So, the .co.uk domain has many zones. It is very reasonable that the .co.uk domain
    administrator delegates the administration of all subdomains because otherwise
    it would have to administer all the .co.uk subdomains, which, as you can imagine,
    are numerous.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 01 Install BIND


    BIND stands for Berkeley Internet Name Domain and is an implementation of the
    DNS protocols. On a Debian 7 system you can install the latest version of BIND
    by running the following command:


    ```

    `# apt-get install bind9`

    ```


    To find your version of BIND, execute the following command:


    ```

    `# named -v`

    `BIND 9.8.4-rpz2+1005:12-P1`

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_38_0.png)


    # 02 What is Cache DNS server?


    A caching-only DNS server does not contain information about a domain; it just
    contains information based on the results of the DNS queries it has already performed.
    The main reason that DNS caching works well is because DNS data does not change
    frequently.


    ![](img/30dc0459712b32ede1a3814d456b41b6_38_1.png)


    # 03 The host utility


    Host produces a clean output and that is the main reason for liking it – it can
    easily be used inside shell scripts. Its last parameter, which is optional, is
    the name of the DNS server to ask. If not given, it uses the /etc/resolv.conf
    file to find a DNS server.


    Used with the -mx parameters, host shows the mail servers for a domain or subdomain:


    ```

    `# host -mx linuxuser.co.uk`


    linuxuser.co.uk.mail is handled by 10

    mail.imagene-publishing.co.uk.

    linuxuser.co.uk.mail is handled by 20

    mail2.imagene-publishing.co.uk.

    ```


    The numbers that you see after the “handled by” are the preference values that
    indicate the mail exchanger’s priority. A preference value by itself is not important.
    What is important is its relationship to the other values.


    Mail servers should attempt to deliver to the mail exchangers with the lowest
    values first. If the delivery fails for some reason, then the mail exchanger with
    the next highest value will be tried. If two or more mail exchangers have the
    same preference value, it is up to the mail server to decide which one to choose.
    The primary DNS server is responsible for defining the email server for a domain
    or subdomain.


    Used with the -t ns parameters, host shows the DNS Servers for a domain.


    # 04 The dig utility


    The dig utility can show you the same DNS related information as host, however,
    dig’s output is more populated by default. In order to find the DNS servers of
    the .co.uk domain with the help of dig, you could do this by executing the following
    command:


    ```

    `$ dig co.uk ns`


    Trying to perform a AXFR query with dig fails:

    `$ dig @localhost co.uk axfr`

    ```


    ```

    `<<> DiG 9.8.4-rpz2+1005:12-P1 <<> @`

    `localhost co.uk axfr`

    `(2 servers found)`

    `; global options: +cmd`

    `; Transfer failed.`

    ```


    AXFR is a mechanism for replicating DNS data across DNS servers, but it can also
    be used for evil purposes. The DNS Administrator is responsible for allowing the
    access to the AXFR protocol to specific machines and restricting it to the rest
    of the world.


    # 05 The /etc/resolv.conf file


    The quickest way to see your DNS configuration is by looking at the /etc/resolv.conf
    file, where you can see the IP address for each DNS server used; each entry starts
    with the nameserver keyword. There is no point in using anything but an IP address
    for a DNS server. Usually, the administrator deals with this file when setting
    up a Linux machine; otherwise it is populated when your Linux machine gets its
    network configuration using DHCP.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Tips | Tricks | Hacks | Apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_39_0.png)


    # 06 The rcdc utility


    The rcdc executable is the name server control utility. It controls the operation
    of the name process and it communicates with the named process using a TCP connection.
    The rcdc utility has a configuration file called rcdc.conf that has structure
    and syntax similar to named.conf. You can type `man rcdc-confgen` and `man rcdc.conf`
    for more information.


    ![](img/30dc0459712b32ede1a3814d456b41b6_39_1.png)


    # 07 Other types of DNS servers


    There are three more types of DNS servers: primary, secondary and forwarding.
    Each domain should have at least one primary and one secondary DNS server.


    A primary DNS server (or Master) defines one or more zone files for which this
    DNS server is authoritative. A zone has been assigned to a DNS server using an
    NS Resource Record.


    A secondary DNS server for Slawe mainly acts as the backup of the primary DNS
    server in case it goes down for some reason.


    A forwarding DNS server is almost identical to a caching server from the perspective
    of a client. Its difference is that it does not perform recursive queries itself;
    it just forwards them to another DNS server, gets the response back and then caches
    the results.


    It is not possible to find out from a query result whether it was answered from
    a zone master or from a slave.


    # 08 The /etc/bind directory


    All configuration files related to BIND are located inside the /etc/bind directory.
    You will need root access to make changes to it and you will have to restart the
    named process for the changes to take effect.


    BIND keeps some other files inside `/var/cache/bind`:


    ```

    ```

    $ ls -l /var/cache/bind/

    total 24

    -rw-r--- 1 bind bind 698 Oct 15 09:46 managed-keys.bind

    -rw-r--- 1 bind bind 512 Oct 15 09:46 managed-keys.bind.jnl

    -rw-r--- 1 bind bind 9446 Oct 15 11:17 named_dump.db

    -rw-r--- 1 bind bind 1103 Oct 14 19:58 named.stats

    ```


    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_39_2.png)


    # 09 The /etc/bind/db.root file


    The db.root file holds the information on root name servers, denoted by a single
    dot, needed to initialise the cache of internet domain name servers. You can manually
    generate it by running the following command:


    ```

    ```bash

    $ dig @root-servers.net . NS > db.root

    ```

    ```


    # 10 The configuration file


    The default BIND configuration is almost ready to support a caching DNS server.
    You will only need to explicitly turn recursion on and then it will all be done.
    This action can be completed by adding a line inside `named.conf.options` that
    contains the `recursion yes;` text.


    The next step then is to run the BIND server process as follows:


    ```

    ```bash

    # /etc/init.d/bind9 start

    ```

    ```


    You will also need to add an access control list to reduce traffic and increase
    security, and you will learn more about access control lists a little later on
    in Step 16. The DNS service will usually listen on port number 53, as you can
    clearly see from the following output:


    ```

    ```bash

    $ telnet localhost 53

    Trying ::1..

    Connected to localhost.

    ```

    ```


    # 11 Manage the caching DNS server


    You already know how to start the DNS server. The following command stops it:


    ```

    ```bash

    # /etc/init.d/bind9 stop

    ```

    ```


    And then this command restarts it:


    ```

    ```bash

    # /etc/init.d/bind9 restart

    [ ... ] Stopping domain name service...

    bindingwaiting for pid 24713 to die

    [ ok ] Starting domain name service...

    bind9.

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 40
  md: "![](img/30dc0459712b32ede1a3814d456b41b6_40_0.png)\n\nFor the purposes of this\
    \ tutorial, the most useful utility is **named-checkconf** which checks the syntactical\
    \ validity of your configuration. If there are no syntax errors in your current\
    \ configuration, you will get no output. No tool can catch logical DNS errors.\n\
    \n![](img/30dc0459712b32ede1a3814d456b41b6_40_1.png)\n\n# “All log messages from\
    \ BIND are stored in /var/log/syslog”\n\n12 **Use the caching DNS server**\n\n\
    A caching server is used like a regular DNS server. If you want to reduce the\
    \ DNS traffic on your LAN, you should put the IP of the caching server in the\
    \ */etc/resolv.conf* file and comment out all other DNS servers. However, this\
    \ can be dangerous because if the caching DNS server stops working for some reason,\
    \ your network will not be able to operate normally.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_40_2.png)\n\
    \n```\n```\nhost -t ns linuxuser.co.uk linode\n;; connection timed out; no servers\
    \ can be contacted\nrMacBook:Downloads mtsouk$ host -t ns linuxuser.co.uk linode\n\
    Using domain server:\nName: linode\nAddress: 109.74.193.253#53\nAliases:\n\nlinuxuser.co.uk\
    \ name server ns.hosteurope.com.\nlinuxuser.co.uk name server ns2.hosteurope.com.\n\
    $ host -t ns linuxuser.co.uk linode\nUsing domain server:\nName: linode\nAddress:\
    \ 109.74.193.253#53\nAliases:\n\nHost linuxuser.co.uk not found: (SERVFAIL)\n\
    ```\n```\n\n14 **Access control lists (ACL)**\n\nAn acl list defines which hosts\
    \ can and cannot access a DNS server. The following lines define a new access\
    \ control list:\n\n```\n```\nacl OIENET {\n    2.86/16;\n    localhost;\n    localnets;\n\
    };\n```\n```\n\nThe definition of the list does not automatically make the list\
    \ active. You should add the following line to turn on the OIENET access control\
    \ list:\n\n```\n```\nallow-query { OIENET; };\n```\n```\n\nAs soon as the DNS\
    \ server starts running, many unknown hosts will try to connect to it; so do not\
    \ delay generating as many access lists as needed to protect your DNS server.\n\
    \n13 **The log files of BIND**\n\nAll log messages from BIND are stored in the\
    \ */var/log/syslog* file. The **named** command can produce a large amount of\
    \ log messages, so you might decide that you want to decrease the log level using\
    \ **rndc** after making sure that your DNS server works without any problems.\n\
    \n15 **Check your configuration**\n\nBIND comes with many tools that can help\
    \ you to check the correctness of your current configuration. These tools include\
    \ **named-checkconf**, **named-checkzone** and **named-compilezone**.\n\n16 **Test\
    \ the cache DNS server**\n\nIn order to test your DNS server, try to query a domain\
    \ that is not in the DNS cache and see how much time it takes to answer the query.\
    \ Next, ask the same DNS server and you should see a way better response time.\n\
    \n![](img/30dc0459712b32ede1a3814d456b41b6_40_3.png)\n\n17 **Advantages of a caching\
    \ server**\n\nThe advantages of using a cache DNS server on your network are less\
    \ LAN traffic and less Internet traffic. You also get DNS responses quicker for\
    \ queries that have already been answered by the caching server.\n\nBIND has a\
    \ handy command to dump all the records of a DNS server to a single file. It can\
    \ then re-read this data when it starts again:\n\n```\n```\n# rndc dumpdb -all\n\
    # ls -l /var/cache/bind/named_dump.db\n-rw-r--r-- 1 bind bind 9448 Oct 15 11:15\
    \ /var/cache/bind/named_dump.db\n```\n```"
