  md: "# Tips | Tricks | Hacks | Apps\n\n![](img/30dc0459712b32ede1a3814d456b41b6_51_0.png)\n\
    \n# 09  \nGive permission\n\nThe way the drives, partitions and sub- volumes have\
    \ been created means you need to access them with a root account to use them properly.\
    \ We can give them normal permissions with the following:\n\n```\n$ sudo chown\
    \ 777 /btrfs/\n```\n\n# “If you're doing a hardware RAID, having the metadata\
    \ be redundant may be useful”\n\n![](img/30dc0459712b32ede1a3814d456b41b6_51_1.png)\n\
    \n# 10  \nThe RAID\n\nYou can use btrfs to create different types of RAID setups\
    \ — by default it will do RAID 0, but it also supports RAID 1, RAID 10 (1+0),\
    \ RAID 5 and RAID 6. Choosing which RAID to use comes down to personal preference\
    \ and how much effort you put in to maintain your setup.\n\n11  RAID 1\n\nRAID\
    \ 1, where data is duplicated across drives for redundancy, can be created on\
    \ btrfs using a modified version of the command used to create btrfs over a selection\
    \ of drives. The -d option refers to how the data will be used.\n\n```\n$ mkfs.btrfs\
    \ -d raid1 /dev/sdb /dev/sdc\n```\n\n12  Have non-redundant metadata\n\nIf you're\
    \ doing a hardware RAID, having the metadata be redundant may be useful – otherwise\
    \ you can lose your data if the metadata gets corrupted. This requires the -m\
    \ option and can be used on a single hard drive with 'single' or RAID 0 with:\n\
    \n```\n$ mkfs.btrfs -m raid0 /dev/sdb /dev/sdc /\n```\n\n13  RAID 10\n\nBasic\
    \ mirroring and striping with RAID 10 is good for large data repositories and\
    \ redundancies. We can use both options -m and -d to specify that we want metadata\
    \ and data to be properly made redundant with:\n\n```\n$ mkfs.btrfs -m raid0 -d\
    \ raid10 /dev/sdb \\\n/dev/sdc /dev/sdd /dev/sde\n```\n\n14  Look at the different\
    \ options\n\nThe options for -m and -d allow you to do some fancy setups. You\
    \ can create a btrfs JBOD (Just a Bunch Of Drives) by doing -d single /dev/sdb\
    \ /dev/sdc. You can also have metadata be non-redundant while data is redundant\
    \ with -m raid0 -d raid1 /dev/sdb /dev/sdc /dev/sdd. There are many more ways\
    \ to do it as you see fit."
