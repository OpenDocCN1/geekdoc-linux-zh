- pgno: 137
  md: '# ## BEST DISTRO FOR...


    # # Lightweight


    A lighter Linux distro can help you get the most out of an older or underpowered
    system by using relatively fewer resources


    # ## Lubuntu


    You can define lightweight in a number of ways these days. While the graphical
    software part of a distro itself can be the one that is most resource intensive,
    the core kernel and behind-the-scenes packages can also take power away from CPU
    cycles. While Lubuntu and other normal Linux distros running LXDE don''t do much
    to the core of their operation, merely running the desktop itself can be a huge
    relief on some systems.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_0.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_1.png)


    Lubuntu has an excellent Software Centre to make package downloads easier


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_2.png)


    While minimal, the LXDE desktop styling is very smart


    # ## ALTERNATIVE DISTROS


    ### wattOS


    A very lightweight and speedy operating system that aims to do two things: boot
    to desktop very fast and also save you electricity, either plugged in or on the
    battery. It does both of these exceedingly well.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_3.png)


    ### Puppy Linux


    Puppy Linux lets you tinker and do system tweaks. It''s been specially designed
    for older systems and is extremely resource friendly. It can live in a very small
    amount of RAM, yet still includes a very functional base.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_4.png)


    ### Porteus


    A very fast Linux boot takes as only 200MB of space and is optimised to run from
    live media as well. You can add modules for extra software needed, maintaining
    a very easy-to-use interface.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_5.png)


    8/10<br>7/10<br>9/10<br>6/10<br>10/10<br>10/10<br>5/10<br>9/10


    # ## BEST FOSS


    #### Audacious


    Very lightweight and very fast, Audacious is the definitely the best audio player
    for those on a resource budget. It hooks into notification centres of most major
    desktops as well, allowing you to control it better.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_6.png)


    #### Midori


    Midori teeters on the edge of being just a bit too lightweight to be as useful
    as some of its peers, but it managed to maintain a number of excellent features
    to make browsing the internet with it acceptable in 2015.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_7.png)


    #### CMPlayer


    A lightweight video player that still has a fairly decent interface and no need
    for mucking around in the command line. It will play all the media you need as
    long as you have the codecs and backends installed.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_8.png)


    #### Geany


    A text editor with IDE features that is popular among those with a few small projects
    on the go. It''s easy enough to switch between the two types, meaning you can
    use it for your day-to-day text editing before going full developer.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_9.png)


    #### Enlightenment


    A window manager and full desktop environment, Enlightenment is an incredibly
    flexible and lightweight framework loved by hardcore users. It''s rarely used
    as a default desktop, but give it a go if you''re on the hunt for something different.


    ![](img/30dc0459712b32ede1a3814d456b41b6_137_10.png)'
