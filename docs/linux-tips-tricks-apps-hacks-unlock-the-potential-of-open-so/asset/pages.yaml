  md: "# # Run Android apps in Linux\n\nWork, play and enjoy the plentiful range of\
    \ Android apps right inside your regular Linux desktop\n\nThough Google's Android\
    \ OS shares nearly the same kernel as the desktop Linux, these systems still have\
    \ major differences. Linux applications can't be run on Android without porting,\
    \ and vice versa. But thanks to the commercial success of smartphones and tablets\
    \ running Android, plenty of useful, cool and eye-catching software titles are\
    \ available in the official Google Play store – many of them are free, too. Wouldn't\
    \ it be great to run these apps on a desktop computer that is running regular\
    \ Linux distribution?\n\nWell, not long ago a solution arrived: the Archen runtime\
    \ – a technology that enables the running of Android apps after converting them\
    \ to browser extensions. It means that you can run an unlimited number of Android\
    \ APKs, after packaging them with the chameos-apk tool that is supported along\
    \ the Archen runtime itself.\n\nArchen was initially developed as a solution to\
    \ bring select Android apps to Chrome OS, but later it was discovered that running\
    \ just the Chrome browser would be enough. Of course, to make it happen on your\
    \ machine some manual effort, technical acumen and familiarity with command line\
    \ commands are required. However, if you follow these steps then the whole procedure\
    \ will be straightforward.\n\n# **01 Install a proper web browser**\n\nIn theory,\
    \ not only should the Google-branded Chrome browser work fine, but Chromium (Chrome's\
    \ open source base) and many derivatives such as Opera or Vivaldi should do too.\
    \ But things are a little bit complicated. The Chromium development pace is fast,\
    \ so these browsers can be based on different Chromium versions with different\
    \ patch sets, compile options and so on. In real life, it will result in multiple\
    \ failed attempts to start Archen, so that's why we recommend using a totally\
    \ stable version of regular Google Chrome on Linux.\n\nGo to the browser's official\
    \ site (google.com/chrome/browser/desktop) and download the DEB or RPM for your\
    \ distribution and architecture. You can choose what really matters for your specs,\
    \ as Archen offers various builds to suit everybody's needs. Then install Chrome\
    \ with your standard package management tools – usually, just a double-click does\
    \ the trick.\n\n# **Below Archen turns Android apps into extensions for the Google\
    \ Chrome browser**\n\n# ## Resources\n\n+   - Google Chrome \n+       [bit.ly/1ltMrgU](bit.ly/1ltMrgU)\n\
    +   - Archen Runtime \n+       [bit.ly/1DPHsTr](bit.ly/1DPHsTr)\n+   - NodeJS\
    \ server \n+       with NPM \n+       manager\n\n![](img/30dc0459712b32ede1a3814d456b41b6_111_0.png)\n\
    \n![](img/30dc0459712b32ede1a3814d456b41b6_111_1.png)"
