    Cinnamon 2.0 is very stable, even with its own brand new back-end


    # Linux Mint 17.1


    The Cinnamon-flavoured revolution is here as Mint releases its first truly independent
    desktop environment


    # Pros


    Improvements all-round and the addition of the kernel selector will be useful
    to some of the specific users


    # Cons


    A minor update in general though, and barely worth doing if you''re already running
    Mint 17 and are happy with it


    The Linux Mint team''s latest version of the distro is their first long-term support
    release based on Ubuntu 14.04 – 17.1 comes with some much needed updates. For
    the first time ever, Linux Mint has received a full-on point release update and
    in more unique is the fact that this 17.1 comes instead of the Linux Mint team
    working on a Linux Mint 18. Linux Mint 17, for the first time in the distro''s
    history, is a long-term support release based on Ubuntu''s own current LTS, 14.04
    Trusty Tahr. With no new numbered Linux Mint coming until 2016, it''s good to
    see actual quantifiable evidence that the Mint team not only still exist, but
    are keeping with their LTS promise.


    As such, on first glance, there''s not a massive difference in 17.1 over 17. The
    core of the distro has received a series of security and bug fix updates, with
    all default software now updated to their latest versions at the time of release
    as well. In terms of the desktops, all versions have had tweaks to the updaters
    and other settings – the software updater now allows you to try and streamline
    the list of updates, grouping together sets of updates to supposedly make reading
    the list easier. The main benefit of this we''ve found is that you no longer need
    to hunt down every single package that''s part of a piece of software if you want
    to delay updating it.


    # Choose your kernel


    As the distro ages and receives kernel updates, it seems the team has noticed
    the need for a way to choose between the different kernels; this can be essential
    for people who need to do development on different kernel types, or if you just
    need to rollback for specific security or compatibility reasons.


    The desktop environments, while not getting any specific major new features, have
    been updated nonetheless. Cinnamon 2.4 had a focus on a ''smoother experience'','
