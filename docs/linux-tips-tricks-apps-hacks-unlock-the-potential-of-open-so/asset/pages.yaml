    ![](img/30dc0459712b32ede1a3814d456b41b6_91_0.png)


    # Simplify interviewing and audio transcription on Linux


    > Make transcribing easier by following our guide through every stage


    # Resources


    +   * **Audacity** audacity.sourceforge.net

    +   * **VLC** videolan.org/vlc


    Transcribing is one of the most dull, joyless, time-consuming activities that
    we writers have to undertake. While we love to bring you some of the great interview
    content that can come out of it, the process of getting these words onto a text
    document is not our favourite thing.


    Over the years, however, many of us in the press have perfected methods to make
    the job of transcription easier. On Linux, we can find some of the best and most
    customisable


    software, so actually getting a setup going for interviews can be really easy
    once you know how to do it.


    While what we''re talking about in this tutorial is aimed more towards interviewing,
    we have successfully adapted it for press conference use and there is no reason
    to see why you couldn''t use it in lectures to make note-taking easier while at
    college or university. Are you ready? Okay, then let''s get to the first Step.'
