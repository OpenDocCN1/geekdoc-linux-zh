  md: "![](img/30dc0459712b32ede1a3814d456b41b6_146_0.png)\n\n# Ubuntu 15.04 Final\
    \ Beta\n\nUbuntu finally makes the switch to systemd. Is it the literal Devil\
    \ or just a way to handle init?\n\nBy the time you're reading this, the full version\
    \ of Ubuntu 15.04 will be out. This beta release of the distro is more of a release\
    \ candidate in some ways and all the promised features are already intact and\
    \ fully tested – a good sign for a new release of a distro. As a release midway\
    \ between two LTS versions, there's not a massive amount of fanfare for the Vivid\
    \ Vervet, but it's got some interesting new additions and changes nonethenotless.\
    \ \n\nThere are a few tweaks on Unity, which is now at version seven. One of the\
    \ gripes with the way it handled windows before was how it always put the menu\
    \ toolbar on the top bar. While it made sense in full-screen, when you have a\
    \ few windows open it can take a moment to click that you're looking for the tools\
    \ in the wrong place, and it didn't save much room at all. By default, it now\
    \ has the tool menus docked with the window when it's not full-screened, enabling\
    \ for a traditional and natural workflow. \n\nOn the surface, aside from minor\
    \ tweaks and package updates, that's really the only main difference in the\n\n\
    way you'll be using Ubuntu from the desktop. Go deeper down and we find the big\
    \ change for Ubuntu 15.04: the switch to systemd for init. Upstart, the service\
    \ it replaced, was an Ubuntu-own daemon as it was. Systemd may make it more universal\
    \ in comparison, although with the murmuring controversy surrounding systemd,\
    \ this may not be to everyone's taste. \n\nThe change makes little difference\
    \ to the normal user experience. Unlike the days of weird security bugs that would\
    \ pop up in systemd when using Fedora, a lot of those kinks have been ironed out\
    \ and result in the same performance. As for the developers, it's stock systemd\
    \ without really any Ubuntu modifications outside what's necessary for it to run\
    \ – in this case, it will be down to where you fall on systemd. \n\nUbuntu 15.04\
    \ then is a pretty standard Ubuntu update – it looks prettier, it works a little\
    \ better for the majority of users and there's a little fix-or-one-for-the Unity\
    \ complaints. Otherwise, it may be time to learn how to use systemd.\n\n+   -\
    \ **CPU**\n+   \t1 GHz\n+   \t\n+   - **RAM**\n+   \t512 MB minimum, 1 GB recommended\n\
    +   \t\n+   - **Storage**\n+   \t7 GB minimum\n+   \t\n+   - **Available from**\n\
    +   \treleases.ubuntu.com/15.04\n\n# Summary\n\nWhile not a necessary upgrade\
    \ from 14.10 – and ready, if you're that eager, systemd (and it's best to stick\
    \ to 14.04 – it still offers enough so that when you do upgrade, you'll notice\
    \ a slightly better selection of features and apps."
