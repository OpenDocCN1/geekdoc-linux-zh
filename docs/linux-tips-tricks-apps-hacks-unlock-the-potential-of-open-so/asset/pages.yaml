  md: 'This is the main website of the\*TeX project where you can find further useful
    information


    ![](img/30dc0459712b32ede1a3814d456b41b6_71_0.png)


    Create your own table of contents, list of figures or list of tables easily


    Execute the latextmk Perl script in silent mode; Latextmk is a handy automatic
    LaTeX document generation routine that saves you time


    # # Write a book in LaTeX


    Learn how to typeset, beautify and customise a whole book using LaTeX and its
    extensive packages


    # ## Resources


    +   - **LaTeX project**

    +     www.latex-project.org

    +   - **Comprehensive TeX Archive Network**

    +     www.ctan.org

    +   - **Latextmk**

    +     http://users.phys.psu.edu/~rcollins/software/latexmk-perl

    +   - **The LaTeX Companion,**

    +     2nd Edition, Addison Wesley, 2004


    Donald Knuth created TeX in the 1970s as a computer language for use in typesetting,
    after wanting to write books on computer algorithms and finding that no previous
    typesetting system was acceptable for him. Its origins resonate with the story
    of the C programming language that was created in order to write the UNIX operating
    system – TeX had many low-level commands and it was difficult to use, so Leslie
    Lamport decided to make it a little easier to digest. He programmed many higher-level
    TeX commands and that became LaTeX, which is widely used today.


    Many people want to typeset a large body of work or a book of around 350 pages,
    for example, but the biggest concern can be the choice between using LaTeX or
    Adobe InDesign. LaTeX often proves itself to be the best option, so this tutorial
    will go through the process and some of the modifications and additions that can
    be made to a book LaTeX-style.


    Although this article assumes that you are already familiar with LaTeX, if you
    have never heard of it and are wondering why it\''s so popular, you should know
    that it helps many book and dissertation authors construct their work easily.'
