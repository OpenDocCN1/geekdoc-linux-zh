  md: '![](img/30dc0459712b32ede1a3814d456b41b6_126_0.png)


    # 02 Explore applications


    # 01 Grab and load up Pentoo


    Get the ISO of Pentoo from the distro’s website [www.pentoo.ch](http://www.pentoo.ch)
    and write it to disc or USB. Reboot into the distro and either press Enter if
    you use the Colony’s English or type 40 for the Queen’s variety. Use `startx`
    at the command prompt to then launch the desktop.


    # 02 Explore applications


    All the analysis and pentesting packages are kept in the Pentoo section of the
    main menu. Pentoo can be used for all manner of testing from computers to networks
    to websites and more. For now, we’re interested in Wireshark, which is in the
    Analyzer submenu.


    # 03 Use the interface


    Wireshark is presented on a web-like interface as you interact with the backend
    of the software. You can begin capturing the traffic from any number of interface
    devices to see what exactly can be seen within the network.


    # 04 More options


    Before we start looking at the data, we can also make some more advanced settings
    on what the capture will grab. The basic settings will get a lot of data while
    it snoots the network, but you can set where it stores the files and if they should
    be split up. For now though, click **Start**.


    # 05 Capture basic data


    You’ll start to see any data that crosses the interfaces with plenty of information
    on the packets, their origin and their destination. At a basic level you can see
    if there are any unwanted packets being sent in or out – good for checking your
    own sites and LAN sites as well as the system in general.


    # 06 Filter your data


    For basic capture data like this, there will be a lot to sift through by default.
    You can filter it while it’s running or stop it to inspect anything you might
    have been trying to do during a test. Apply regular expressions to narrow anything
    down.


    ![](img/30dc0459712b32ede1a3814d456b41b6_126_1.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_126_2.png)


    # 07 Save and retrieve


    Captures you’ve made can then be saved to file as you would with any normal type
    of file. The benefit of this is that you can reopen it in the future in the same
    capture window, to then search through in case you need to either compare something
    or remember a packet.


    # 08 Find individual packets


    Sent a very specific packet during or as part of your test? There’s no need to
    worry, as you can search for a known packet in the logs using the Find Packet
    tool to look further into the records. It requires accurate knowledge and data
    about the packet in question though, so you’ll need to be well aware of what you
    sent. It’s a good idea to always keep track of all the relevant info just in case.


    ![](img/30dc0459712b32ede1a3814d456b41b6_126_3.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 09  Use VoIP cracking


    You can also see the VoIP traffic on a system under the Telephone menu on the
    tool bar. This will show the caller and receiver, what protocol they’re using,
    what kind of data is being transmitted and more.


    ![](img/30dc0459712b32ede1a3814d456b41b6_127_0.png)


    # 10 Endpoint detection


    One of the weaknesses in a network can be remote machines that access a network.
    When going through a capture, you can see what endpoints have been connecting
    to the network and filter out which ones are authorized or not. You can also set
    up a remote attack and see if it registers.


    # 11 Decode differently


    Sometimes odd packets and messages may occur on a different port that Wireshark
    has a problem translating. This is simple to fix, you just need to have a look
    at the package using a different protocol with the Decode As tool. It may just
    be a random connection but it could be something else which will definitely need
    sorting.


    # 12 Wireless defence test


    Pentoo has an excellent suite of software called aircrack-ng that can attempt
    to discover and break a wireless network. This software tries to snift packets
    on the network to figure it out. To start we need to make out wireless card able
    to see the packets, so we need to use aircmon-ng.


    # 13 Employ promiscuous mode


    Open up the terminal to use aircmon-ng. Check ifconfing if you need to figure
    out the interface name of your card, and then turn it to the correct mode using
    something like:


    ```

    $ aircmon-ng start wlan0

    ```


    # 14 Find an access point


    Aircmon will change your wlan to now be mon0, which is what we’re going to use
    to try and find an access point. This is useful if you’ve tried to make your WiFi
    hidden but it’s also useful to see just how powerful your network is around a
    building. Start it with:


    ```

    $ airodump-ng mon0

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_127_1.png)


    # 15 Test your passwords


    You can now try and use aircrack-ng to brute-force your passwords and see if they’re
    strong enough. The basic way of doing this is to use something like:


    ```

    $ aircrack-ng -b [MAC address/BSSID]

    ```


    This will try and crack the password on the access point. There are various options
    you


    ![](img/30dc0459712b32ede1a3814d456b41b6_127_2.png)'
