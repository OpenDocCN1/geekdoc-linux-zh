    ![](img/30dc0459712b32ede1a3814d456b41b6_63_2.png)


    This is the format and some of the data from the LUD dataset used in this article
    for illustrating the varied capabilities of ggplot2


    ![](img/30dc0459712b32ede1a3814d456b41b6_63_3.png)


    # Generate complex graphics with ggplot2


    Seen as the new version of S, learn how to create truly impressive plots using
    R and the ggplot2 package


    # **Resources**


    +   - R Project *rproject.org*

    +   - RStudio *rstudio.com*

    +   - ggplot2 *ggplot2.org*

    +   - Documentation *docs.ggplot2.org/current*

    +   - RSQLite *bit.ly/1Acvkio*


    R is a **GNU project based on S, which is a statistics-specific language and environment
    developed at the famous AT&T Bell Labs**. You can think of R as the free version
    of S. Despite its simple name, R is a powerful piece of software for statistical
    computing with many capabilities and an interpreted programming language.


    R packages can greatly extend its capabilities. Ggplot2 is an R package, written
    by Hadley Wickham, that is used for producing statistical and data graphics, working
    with plots in layers. Despite being a powerful package, it is reasonably easy
    to learn and produces sophisticated and beautiful plots that are of publication
    quality. Its main difference from most other graphics packages is that it has
    a deep principal grammar. Learning its grammar, which is based on the book *The
    Grammar Of Graphics*, will help you design better plots but it is not required
    in order to follow this article. In other words, the grammar tells that a plot
    is a mapping from data to aesthetic properties of geometric objects.


    This article is full of practical examples that demonstrate the use of ggplot2
    for drawing many different kinds of plots, including a plot of the Chrome''s history
    file!


    Feeling comfortable with mathematics and statistics is helpful but not vital for
    understanding this article.'
