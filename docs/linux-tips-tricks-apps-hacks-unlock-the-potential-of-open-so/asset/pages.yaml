- pgno: 9
  md: '# SYSTEM ESSENTIALS


    >_ Go a step further and learn how to control the terminal that bit better


    ![](img/30dc0459712b32ede1a3814d456b41b6_9_0.png)


    +   021 **Readable storage size**


    One of the details that **ls -l** displays is the size of the files that are located
    on the hard drive. This is done in bytes though, which is not always that useful.
    You can have it parse this file to become more legible simply by changing the
    **-l** to **-lh**, where the long-listing format option (**-l**) is tweaked with
    the human-readable option (**-h**).


    +   022 **Move to previous directory**


    If you want to move back to the directory that you were working on before, there
    is a **cd** command to do that easily. This one does not move up the filesystem,
    but rather back to the last folder that you were in:


    ```

    $ cd -

    ```


    +   023 **Move up directory**


    The **cd** command can also be used to move up in the filesystem. Do this with
    two full stops, like so:


    ```

    $ cd ..

    ```


    +   024 **General wildcards**


    The asterisk (* *) can be used as a wildcard in the terminal to stand for anything.
    A typical use case is copying or removing specific types of files. For example,
    if you want to remove all PNG files from a directory, you **cd** to it and type:


    ```

    $ rm *.png

    ```


    +   025 **More with the pipe**


    The pipe (|) can be used to feed all outputs into the next command, enabling you
    to call a piece of data or string from one command and put it straight into the
    next command. This works with **grep** and other core Linux tools.


    +   026 **Delete directories**


    Using **rm** on a directory with objects within it won’t work, as it needs to
    also delete the files inside. You can modify the **rm** command to delete everything
    within a directory recursively using:


    ```

    $ rm -r directory

    ```


    +   027 **Shutdown command**


    You can shut down the system from the terminal, using the **shutdown** command,
    the halt option (**-h**), which stops all running programs at the same time, and
    specifying a time of **now** so it turns off immediately rather than in 60 seconds:


    ```

    $ sudo shutdown -h now

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_9_1.png)


    +   028 **Display all information**


    As well as merely listing the files, we can use **ls** to list all of the information
    relating to each file, such as last date modified, permissions and more. Do this
    by using:


    ```

    $ ls -l

    ```


    +   029 **Reboot from command line**


    Back in the day, rebooting required a slightly more complex shutdown command:
    **shutdown -r**. In recent years it’s been replaced with a very simple:


    ```

    $ sudo reboot

    ```


    +   030 **Timed shutdown**


    The timing function of the **shutdown** command can be very useful, if you need
    to wait for a program or **cron** job to finish before the shutdown occurs. You
    can use the time to do a normal halt/shutdown, or even with **-r** for a reboot
    after ten minutes, with something like:


    ```

    $ sudo shutdown -h +10

    ```


    +   031 **Log out**


    Logging out from the x session is generally advisable from the desktop environment,
    but if you need to log back out to the login manager, you can do this by restarting
    the display manager. In the case of many Linux distros, you use the command below:


    ```

    $ sudo service lightdm restart

    ```'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# INSTALLATION


    >_Managing your packages and updating your system is a key part of the command
    line


    >_032  Debian: update repositories

    Debian-based (and Ubuntu-based) distros use apt-get as the command line package
    manager. One of the quirks of apt-get as a package manager is that before upgrading
    or installing software, it does not check to see if there’s a newer version in
    the repositories. Before doing any installation in Debian, use:


    ```

    $ sudo apt-get update

    ```


    >_033  Debian: install software

    Unlike a graphical package manager or software centre, you can’t quite search
    for the kind of packages you want to install, so you need to know the package
    name before installing. Once you do though, try:


    ```

    $ sudo apt-get install package

    ```


    >_034  Debian: update software

    You can upgrade the software in Debian from the terminal by first performing the
    repository update command in Tip 32, followed by the upgrade command below:


    ```

    $ sudo apt-get upgrade

    ```


    >_035  Debian: uninstall software

    As part of package management, apt-get enables you to uninstall software as well.
    This is simply done by replacing install with remove in the same command that
    you would use to install said package (Tip 33). You can also use purge instead
    of remove if you want to delete any config files along with it.


    >_036  Debian: upgrade distro

    Debian systems can often update to a ‘newer version’, especially when its rolling
    or if there’s a new Ubuntu. Sometimes the prompt won’t show up, so you do it in
    the terminal with:


    ```

    $ sudo apt-get dist-upgrade

    ```


    >_037  Debian: multiple packages

    A very simple thing you can do while installing on all platforms is list multiple
    packages to install at once with the normal installation command. So in Debian
    it would be:


    ```

    $ sudo apt-get install package1  package2 package3

    ```


    >_038  Debian: dependencies

    Compiling differs between software and they’ll each have a guide on how to go
    about it. One problem you might face is that it will stop until you can find and
    install the right dependency. You can get around this by installing auto-apt and
    then using it during configuration with:


    ```

    $ sudo auto-apt run /configure

    ```


    >_039  Debian: force install

    Sometimes when installing software, apt-get will refuse to install. If specific
    requirements aren’t met (usually in terms of other packages needing to be installed
    for the software to work properly). You can force the package to install even
    without the dependencies using:


    ```

    $ sudo apt-get download package  $ sudo dpkg -i package

    ```


    >_040  Debian: install binary

    In Tip 39, we used dpkg -i to install the binary installer package that we downloaded
    from the repositories. This same command can be used to install any downloaded
    binary, either from the repos or from a website.


    >_041  Debian: manual force install package

    If the advice in Tip 39 is still not working, you can force install with dpkg.
    To do this you just need to add the option ‘–force=all’ to the installation command
    to ignore any problems, like so:


    ```

    $ sudo dpkg --force=all -i package

    ```


    >_042  Red Hat: update software

    Unlike apt-get, the yum package manager for Red Hat/Fedora-based distros does
    not need you to specifically update the repositories. You can merely update all
    the software using:


    ```

    $ sudo yum update

    ```


    >_043  Red Hat: install software

    Installing with yum is very simple, as long as you know the package name. Yum
    does have some search facilities though, if you really need to look it up, but
    once you know what package you want, use the following command:


    ```

    $ sudo yum install package

    ```


    >_044  Red Hat: uninstall software

    Yum can also be used to uninstall any package you have on your system, whether
    you installed it directly from yum or not. As long as you know the package name
    you can uninstall with:


    ```

    $ sudo yum remove package

    ```


    >_045  Red Hat: force install

    The force install function on Red Hat and Fedora-based Linux distros requires
    that you have a package downloaded and ready to install. You can download things
    with yum and then force the install with:


    ```

    $ sudo yum install --downloadeonly  --downloaddir=[directory] package  $ sudo
    rpm -ivh --force package

    ```


    >_046  Red Hat: manual install

    RPM is one of the package installers on Red Hat distros and can be used to install
    downloaded packages. You can either do something like in Tip 45 and download the
    package from the repos, or download it from the Internet and install with:


    ```

    $ sudo rpm -i package

    ```


    >_047  Red Hat: force manual installation

    As in Tip 45, you can use RPM to force install packages if there’s a dependency
    issue or something else wrong with any other packages that you have downloaded.
    The same command should be used as in Tip 45, with the -ivh and --force options
    present.


    >_048  Fedora: distro upgrade

    Yum has its own distribution upgrade command, but only in Fedora and they prefer
    you not to use it unless you have to. Nonetheless, you can use the fedora-upgrade
    package in yum with:


    ```

    $ sudo yum install fedora-upgrade

    ```


    > “You can force a package to install even without the dependencies”'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# SEARCHING

    WITH GREP


    >_ Search within

    files using the grep

    command to save time

    and find what you need


    # >_049 Search a file for a term


    The basic use of grep is to search through a file

    for a specific term. It will print out every line with

    that term in, so it''s best to use it with system

    files with readable content in. Use it with:


    ```

    $ grep hello file

    ```


    # >_050 Check for lines


    Looking for specific lines in a file is all well and

    good, but when you then start to hunt them

    down and you realise the file is hundreds

    of lines long, you can save yourself a lot of

    time by getting grep to also print out the line

    number. You can do this with the -n option:


    ```

    $ grep -n hello file

    ```


    # >_051 Regular expressions


    If you need to make a more advanced search

    with grep, you can use regular expressions.

    You can replace the search term with ''hello''

    to look for lines that start with hello, or hello\S

    for lines ending in hello.


    # >_052 Wildcards and grep


    When searching for lines, you can use a

    wildcard if you need to look for similar

    terms. This is done by using a full stop in the

    search string – each full stop represents one

    wildcard character. Searching for h. o will

    return any five-letter string with h at the start

    of the string and o at the end. Use it like so:


    ```

    $ grep ''[^0...o]*'' file

    ```


    # >_053 More wildcards


    You''ll also be using wildcards to find

    something ending or beginning with a

    specific string but with no fixed length. You

    can do this in grep by using an asterisk (*)

    along with the dot. In the above example, we

    would have used h.* instead.


    # DEVELOPMENT

    TIPS


    >_ Some terminal tricks for devs

    to help your command line skills

    become more efficient


    # >_054 Stop a system service


    A system service is the kind of background

    software that launches at start up. These are

    controlled by the system management daemons

    like init or systemd, and can be controlled from

    the terminal with the service command. First,

    you can stop a service using:


    ```

    $ sudo service name stop

    ```


    # >_055 Start a service


    You can start system services that have been

    stopped by using the same service command

    with a different operator. As long as you know the

    service name, start it using:


    ```

    $ sudo service name start

    ```


    # >_056 Restart a system service


    This one is popular with setting up web servers

    that use Apache, for which restarts may be

    needed, along with other services that you

    customise along the way. Instead of running both

    the stop and start commands sequentially, you

    can instead restart services by using:


    ```

    $ sudo service name restart

    ```


    # >_057 Know the ID


    The ID that you can get for the software with

    top can be used to manipulate it, but a common

    reason to know the ID is so that you can end the

    process if it''s having trouble stopping itself or

    using too many resources. With the ID in hand,

    you can kill it with:


    ```

    $ kill 1234

    ```


    # >_058 Kill multiple IDs


    Sometimes a process can be split up over

    multiple IDs (this is usually the case with a

    web browser – Google Chrome is a notorious

    example), and you need to kill multiple

    processes at once. You can either try and quickly

    kill all the IDs, or use the common name for the

    process and kill it with:


    ```

    $ killall -v process

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_11_0.png)


    # >_059 List connections


    The standard command for listing your

    network connections and details in the

    terminal is merely ifconfig - this will list

    all of your interfaces and their statuses. If

    you just need to list a specific one, say for

    the wireless interface, you can use:


    ```

    $ ifconfig wlan0

    ```


    # >_060 List USB devices


    You may need to know which USB and USB-

    related devices are connected to a system,

    or find our their proper designation. You''ll

    need to install it first, but once you have,

    you can use lsusb in the terminal to list all of

    the available devices.


    # >_061 List hard

    drives and partitions


    Whether you need to check the designation

    of certain drives for working on them, or you

    just need to get a general understanding of

    the system''s layout, you can use fdisk to list all the

    hard drives. Do this in the terminal with:


    ```

    $ sudo -l

    ```


    # >_062 Check running software


    Sometimes you''ll want to check what''s running

    on your system and from the terminal this can

    be done simply with top. It lists all the relevant

    information you''ll need on your currently running

    software, such as CPU and memory usage, along

    with the ID so you can control it.'
  merge: -1
