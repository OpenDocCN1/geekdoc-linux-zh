- pgno: 121
  md: '# # Build a WebKit browser


    Learn how to get WebKit built and running on a Linux system to develop browsers


    For a while a few years back, it seemed like every single new browser was being
    made in WebKit. While Apple''s Safari browser had been using it for years, Google''s
    Chrome and the Chromium project seemed to launch it into the spotlight and result
    in desktop and mobile browsers built on the technology.


    While the standard source is optimised for development on OS X and Windows, there
    is a branch of it specifically for Linux: QtWebKit. With this source you can continue
    to develop the engine for use on Linux or you can build your own browser using
    WebKit as a lightweight rendering engine.


    In this tutorial, we will show you how to get WebKit set up on your system, along
    with some pointers on how to construct a browser using the source so that you
    can then go ahead and begin creating a custom project.


    # ## Resources


    +   WebKit

    +   webkit.org

    +   Qt 5

    +   bit.ly/1K50iGD

    +   Ubuntu 12.04 or higher


    # 01 Grab the source code


    We need to first get the source code for QtWebKit, which is part of the normal
    WebKit source tree. Open up a terminal and cd to the place where you like to keep
    your sources, or create a new directory for it with mkdir. Sync the source locally
    in the terminal with:


    ```

    ```

    $ git clone git://gitorious.org/webkit/webkit.git

    ```

    ```


    The source will take up just over 4 GB of space, so make sure you have space and
    perhaps something to do while you wait.


    **Below** Create a browser like Chromium using the WebKit browser engine, Chromium''s
    original base


    ![](img/30dc0459712b32ede1a3814d456b41b6_121_0.png)'
