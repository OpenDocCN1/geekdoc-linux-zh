- pgno: 56
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_56_0.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_56_1.png)


    # 12 Configure security groups


    Think of Security Groups as settings for an AWS Firewall that specify ''Enable
    rules for inbound and outbound traffic''. For each Linux instance, you need to
    enable ingress access (inbound traffic) on TCP port 22 for SSH from at least one
    IP address (yours). Unless you are on a static IP (or an IP range), you may want
    to enable access from anywhere. If you need other services, add the corresponding
    rules (eg open port 80 for HTTP and 443 for HTTPS if you want to run a web server).
    Then click ‘Review and Launch’.


    # 13 Create or select a key pair


    The wizard will ask you to create or select a key. Passwords are out, key pairs
    are in. A private key is what authenticates you as the administrator of your Linux
    instance. SSH will attempt to verify the authenticity of your private key, based
    on a copy


    of a corresponding public key that AWS is about to save in the appropriate location
    of the Linux system on your instance.


    You could generate your key pair yourself and upload the public key to the EC2
    console, or you can ask Amazon to create a key pair for you, which is faster.
    Select ‘Create a new key pair’, give it a name, download the private key to your
    computer and correct access privileges on it:


    ```

    chmod 400 /path/to/yourPrivateKey.pem

    ```


    Once this is done, you can launch your instance. It will show up in the section
    Instances of the AWS Management Console for EC2.


    # 14 Assign an IP to your EC2 instance


    Unless you choose to auto-assign a public IP to your instance, it does not have
    a Public DNS entry yet and is inaccessible from the outside. Click on the link
    Elastic IPs in the left-hand navigation pane of the EC2 console. Here, you need
    to obtain a new elastic IP address for your AWS account (Allocate New Address)
    and associate it with your instance (Associate Address).


    # 15 Connect to your Linux instance


    Wait until your instance passes both health checks and reports its state as ‘running’.


    You should be able to connect to it using any stand-alone SSH client or the Java-based
    client that Amazon provides. Navigate to the Instances section of the Console,
    select your instance from the list and click on the Connect button to view instructions.
    Start an SSH client and enter this:


    ```

    ssh -i /path/to/yourPrivateKey.pem

    username@XXX.XX.XXX.XX

    ```


    The username is usually either ec2user or root, but technically the creator of
    the AMI can set it to whatever they want. If your initial username is anything
    other than root, you can assume superuser privileges using the command:


    ```

    sudo su

    ```


    If you attached any additional volumes to your instance (besides the volumes that
    came with the AMI), now is the time to format them, mount them and add them to
    /etc/fstab.


    > > “Passwords are out and key pairs are in”'
  merge: -1
