- pgno: 152
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_152_0.png)


    Above Photos has been redesigned since being forked from Shotwell


    # “The developers claim over three million downloads and elementary OS has remained
    in the top ten most searched- for distros for the last year, with a strong community
    building behind it”


    Along with a new unified lock and login screen that has a great clock widget,
    there’s also an updated notifications system that comes with a ‘do not disturb’
    mode. The notifications are interactive and they’ll also show you alerts from
    things like terminal processes that are running in the background. Regarding the
    terminal itself, this now has labels for the tabs along the top that each show
    the last command that you’ve run and natural copying and pasting (ie Ctrl+C) now
    works in the terminal too.


    Another big change from Luna is the redesigned Photos app. Forked from Shotwell
    earlier this year, which is helpfully written in the Vala language also used to
    write Pantheon, Pantheon Photos is now being run by the elementary team and has
    been given the same attention-to-detail treatment as the other Pantheon programs
    to make it as intuitive as possible. Joining Photos in Freya’s line-up of core
    software is a new Videos application, as well as a new Calculator and a Camera
    application for webcams.


    Look in the System Settings and there are a few final changes of note, including
    redesigns of the date and time, user accounts, applications and displays menus,
    again to simplify and visually improve the options. The privacy settings page
    now has a toggle at the top for a privacy mode, which you can enable if you want
    to stop elementary OS itself from tracking your usage data, and there’s another
    new toggle switch for a built-in firewall which supports custom rules for enabling
    and denying traffic.


    Altogether, these minor and major additions to the operating system make for an
    incredibly strong release that definitely adds to elementary OS’s reputation for
    clean, elegant simplicity in its user experience while also modernising its design
    and updating the software selection. It’s as fast and lightweight as it has ever
    been, making it suitable for old machines, and Freya is a pleasure to use and
    tinker with no matter which operating system you are used to working with.


    # Pros


    Design and menu improvements throughout Pantheon, new and overhauled software,
    notifications, firewall and privacy mode


    # Cons


    May be just a bit too limiting for users accustomed to greater choice and customisation
    options in their distro


    # Summary


    Freya’s host of updates, improvements and new core apps to all reveal a smooth,
    polished OS; an already brilliant distro that has a lot to offer to Linux newbies-es.


    ![](img/30dc0459712b32ede1a3814d456b41b6_152_1.png)'
