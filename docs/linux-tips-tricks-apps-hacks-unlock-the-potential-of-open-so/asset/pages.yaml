- pgno: 79
  md: '# # Make a visual novel

    game with Python


    Bridge the gap between books and videogames by creating an interactive novel with
    Python and Pygame


    ![](img/30dc0459712b32ede1a3814d456b41b6_79_0.png)


    ▪ Change scenes to add more depth to the story, and allow the game to have decisions
    and routes


    +   **Resources**

    +   **Python 2:** www.python.org

    +   **Pygame:** pygame.org/download.shtml

    +   **IDLE Python IDE**

    +   **Game assets**

    +   **Code from FileSilo (optional)**


    Most people look for a compelling story in modern videogames, and those that don’t
    have one are appearing less and less. A great way to tell a pure story is through
    the genre of visual novels, and you can make one fairly simply in Python. These
    interactive novels are an extremely popular form of entertainment in Japan, and
    usually work by having the player click through a story and make decisions as
    they go along in order to experience different plot points and endings.


    In Python, this is a relatively simple project to create, but with the addition
    of the Pygame module we can make it easier still, and even more expandable for
    the future. Pygame adds better support for positioning the images and text, creating
    display windows and using mouse and keyboard inputs, thereby simplifying the coding
    process.


    We’ll be coding this in standard Python 2, so make sure to run it in IDLE 2 and
    not IDLE 3 while you are writing, testing and coding.'
