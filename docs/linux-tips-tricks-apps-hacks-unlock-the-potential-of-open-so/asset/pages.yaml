  md: '# Entertainment


    Here are your best distros for making custom systems to play all your media, either
    on a TV or just for better navigation while at your desk


    # OpenELEC


    When it comes to media and other forms of entertainment consumption via computers,
    one of the most recognisable names in existence is XBMC. Very likely because of
    its quite redundant legacy naming, it''s unfortunately dropping the well-known
    branding in favour of new name Kodi. What''s this all got to do with entertainment
    distros though?


    Well the devs behind Kodi also make the excellent OpenELEC, a Linux distro optimised
    for a number of different hardware types to offer the best possible Kodi experience.


    Not only does it work on specialist hardware such as the Raspberry Pi, Apple TV
    and some other hardware ideal as HTPCs, but you can also get generic PC builds
    for x86 and x64 systems. OpenELEC takes up only a tiny amount of your file system
    while still offering a full version of Kodi. This means you can use any remaining
    storage to keep media local, such as your party playlist; if that''s your kind
    of thing, however you can still stream your media from any other computer set
    up to share it. Setting up these shared folders in Kodi is a quick and simple
    exercise, and it even scrapes together information on the files to make navigation
    easier.


    There are also plenty of add-ons available that allow you to stream media for
    many online video sources, as well as recently-added native Live TV viewing and
    recording – the latter being a better use for your hard drive space.


    For both TV and PC, this is an excellent way to consume media in almost any situation,
    with plenty of codecs and online features.


    ![](img/30dc0459712b32ede1a3814d456b41b6_138_0.png)


    +   - OpenELEC claims to set up your media box in 15 minutes


    ![](img/30dc0459712b32ede1a3814d456b41b6_138_1.png)


    +   - There are some customisations you can make, as well as add-ons to install


    # ALTERNATIVE DISTROS


    # GeeXbox


    A direct alternative to OpenELEC that gives you a little more choice over how
    you set up HTPCs: it hasn''t had any new development for about a year now, but
    that''s nothing to worry about as it''s still excellent.


    # Ubuntu


    When it comes to being an entertainment server, Ubuntu''s strength is its numerous
    ISO or packages: You can set up XBMC, Vlc, Plex, Myth or just plain video and
    music players on Ubuntu of any type.


    # AVLinux


    Not for playing back, you can media service. AV Linux is an excellent way for
    you to actually create audio and video yourself, thanks to a custom kernel and
    great package selection on a Debian-like base.


    # BEST FOSS


    # Kodi


    Previously XBMC, Kodi Entertainment Center is the premier media PC software around.
    It''s the software behind OpenELEC and it can be used for simple music and video
    playback, or streaming services and recording live TV.


    # VLC


    An extremely powerful yet small piece of software that can not only play just
    about any form of media, but also send, receive and record network streams. It''s
    very customisable and easy to use even if you don''t want to stream your desktop.


    # Clementine


    The most fully-featured audio player around, with incredible library and playlist
    management and an excellent interface to boot. It also has a smart playlist that
    will build itself on the fly, however it doesn''t run well on older systems.


    # Nuvola


    One of the problems we have found with browser-based control playback with media
    keys or hotkeys. Nuvola allows you to keep all your streaming audio in one place
    and, more importantly, control it.


    # GIMP


    The powerful image manipulator that is probably the best open source has to offer.
    GIMP can even challenge Photoshop thanks to its array of excellent features and
    tools – it even has a more straightforward naming convention in places.'
  merge: -1
  img_proc: true
