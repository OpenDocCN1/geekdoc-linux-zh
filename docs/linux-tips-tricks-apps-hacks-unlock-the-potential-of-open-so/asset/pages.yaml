- pgno: 64
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_64_0.png)


    # “Experiment with your data and the various types of plots that R and ggplot
    can generate”


    # 01 Install ggplot2


    First run R. The ggplot2 R package isn''t installed by default, so check if you
    already have it installed by running:


    ```

    ```

    > require(ggplot2)

    ```

    ```


    Loading required package: ggplot2


    If it''s not installed, download and select:


    ```

    ```

    > install.packages("ggplot2")

    ```

    ```


    If you execute the library() function without arguments, you''ll get a list of
    installed packages. To get a detailed output, run the installed.packages() command
    without any arguments.


    # 02 About R and data visualisation


    R is a command line application, which is fine for plain text output but not for
    graphical output. RStudio is a more preferable graphical wrapper for R. When visualising
    data, remember that not every plot suits every data set. This knowledge comes
    from experience, and experience comes from experimentation, so don''t forget to
    experiment with your data and the various types of plots that R and ggplot2 can
    generate.


    # 03 Use quickplot()


    The ggplot2 package offers two main functions: quickplot() and ggplot(). The quickplot()
    function, qplot(), is similar to the plot() R function and is good for simple
    plots.


    The quickplot() function hides what happens, whereas ggplot() is harder to use
    but flexible. The following commands draw a plot using columns V2 and V3 from
    the data variable:


    ```

    ```

    > str(data)

    ''data.frame'':  16180 obs. of  3 variables:

    $ V1: num  0 0 0 0 0 0 9.8 1 1.86 1 ...

    $ V2: num  0.01 0.01 0.01 0.01 0.03 0.01 0.58 0.85 1.01 1.01 ...

    $ V3: num  0.05 0.05 0.05 0.05 0.05 0.05 0.27 0.48 0.55 0.75 ...

    ```

    ```


    ```

    ```

    > quickplot(data$V2, data$V3)

    ```

    ```


    The following version adds colour to the output:


    ```

    ```

    > quickplot(data$V2, data$V3, color=data$V1)

    ```

    ```


    # 04 Work with ggpairs()


    The ggpairs() command finds relations between variables and then calculates the
    coefficient of correlation value. The coefficient of correlation is linked to
    the statistical correlation, a technique that shows whether or not two variables
    are related. As the coefficient of correlation approaches zero there is less of
    a relationship (no correlation), whereas the closer the coefficient is to -1 or
    +1, the stronger the correlation (positive or negative) is. A positive correlation
    shows that if one variable gets bigger then the other does as well. Conversely,
    a negative correlation denotes that if one variable gets bigger then the other
    becomes smaller.


    ![](img/30dc0459712b32ede1a3814d456b41b6_64_1.png)


    The presented plot was produced using the following commands:


    ```

    ```

    > data <- read.table("uptime.data",

    + header=TRUE)

    > require(ggplot2)

    > require(GGally)

    > require(CCA)

    > ggpairs(data)

    ```

    ```


    # 05 Generate bar plots


    Now use a sample dataset for plotting. The LUD dataset, available from FileSilo,
    is stored in a plain text file, named LUD.data. The titles of the columns are
    named to refer to their values. You can load the dataset into R using the following
    command:


    ```

    ```

    > LUD <- read.table("lud.data",

    + header=TRUE)

    ```

    ```


    The bar plot is very simple. The following command generates it:


    ```

    ```

    > ggplot(LUD, aes(x=RAM, y=SSD)) + geom_bar(stat="identity")

    ```

    ```


    If you type ggplot(LUD, aes(x=RAM, y=SSD)) without specifying a plot, the command
    will show the ''Error: No layers in plot'' message. To change the colour of the
    bars, try the following variation:


    ```

    ```

    > ggplot(LUD, aes(x=RAM, y=SSD,

    + fill=Uptime)) + geom_bar(stat="identity")

    ```

    ```'
