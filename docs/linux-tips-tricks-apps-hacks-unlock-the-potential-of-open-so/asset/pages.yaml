    opens images in fullscreen mode by default, with image file name and its number
    in the top-left corner. Additional actions are available via the right-click menu
    on any part of the image. You can surf through your images using the respective
    keyboard arrows.


    close the window, Albert doesn’t quit but simply hides in the background. Press
