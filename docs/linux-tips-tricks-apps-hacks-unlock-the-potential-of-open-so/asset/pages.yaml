- pgno: 92
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_92_0.png)


    # 01


    Choose an environment


    The first thing you need to do is select your recording environment. Whether you''re
    recording on the phone, on VoIP or in an open room, try and make sure you''re
    in as quiet a place as you can be. While not always possible, when this can be
    controlled it''s best to keep it in mind.


    # 02


    Gather equipment


    You need a dictaphone and Android phone or a computer. The former are better for
    open situations, whereas for VoIP convos a dictaphone won''t do much. We recommend
    to use your smartphone, so that you can move the audio file to a PC for better
    transcription.


    ![](img/30dc0459712b32ede1a3814d456b41b6_92_1.png)


    # 03


    ''Phone tap''


    We have a device colloquially called a phone tap - it''s a pick-up coil that attaches
    to the back of a phone receiver via a suction cup.


    Not very stealthy but excellent if you need to record an interview over the phone.
    These coils end in a 3.5mm jack that can be plugged into dictaphones or computers
    with a microphone in.


    # 04


    Record with VoIP


    Depending on what kind of VoIP service you''re using, you may already have some
    kind of recording function installed. Something like Skype won''t have one installed
    but you can grab the Skype Call Recorder app instead.


    # 05


    If all else fails


    If you need to record a call or audio on your PC, then you can manually record
    the full sound coming from your system using Audacity. You will need to have Pulseaudio
    as your sound server, select Pulse as the input in Audacity, start recording then
    go to volume control and select Monitor from the Capture drop-down menu.


    # 06


    Check equipment


    It''s a common mistake and it happens to everyone, but always check your equipment
    before doing the interview. One day the same setup will not work as you expected
    for some reason, and finding out after an hour-long interview is never fun.


    # Android apps


    There are a few Android apps that will record voice calls for you, however unless
    you''re using a rooted device you won''t be able to properly record the audio
    coming down the line from the caller. What a lot of them do is use the microphone
    to try and pick up what''s coming from the receiver end of your phone. Experiment
    and find what is best for you, but otherwise you may have to look into rooting
    a phone to get the call recording to properly work.


    # 07


    In the interview


    Taking notes on paper or with a note-taking application as you record can be useful
    for transcribing at a later point. Make sure you keep track of time stamps of
    interest so that you can easily find them when you are editing or listening back
    later.


    This enables you to fast-forward straight to the parts of audio that you need
    when you''re writing your article or typing up your notes. You can also do this
    in Audacity by hitting Ctrl+M while you are recording.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_93_0.png)


    **08** **Transfer to PC**

    If you have recorded your interview on an external device, now it’s time to move
    it to your PC. While dictaphones and some apps will have features that let you
    rewind and slow down playback – we can do it far better by having it unified on
    one system.


    ![](img/30dc0459712b32ede1a3814d456b41b6_93_1.png)


    **09** **Clean up the audio**

    Before we start transcribing, we can do a few things to make the process slightly
    easier for ourselves. Import the audio into Audacity and, for now, trim the length
    and any breaks that you might have, so that you can gain a better understanding
    of how much there is to transcribe.


    **10** **Create a noise profile**

    Before lopping off a quiet spot, you can use this to create a noise profile for
    the locale you’re in. This can remove any background noise and make the interview
    slightly clearer. To select the quiet spot, go to Effect then Noise Removal and
    hit ‘Get Noise Profile’.


    ![](img/30dc0459712b32ede1a3814d456b41b6_93_2.png)


    **11** **Remove noise**

    Once the profile has been set, you can start to experiment with removing it from
    the track. Deselect the profile area and give it a quick try for the whole track
    and the default settings by going back to Noise Removal and hitting OK. You can
    select areas to remove noise from and change the settings to refine the removal
    if it helps.


    ![](img/30dc0459712b32ede1a3814d456b41b6_93_3.png)


    **12** **Amplify and normalise**

    You can look at trying to get a more consistent volume by amplifying different
    parts of the audio – especially if one side is consistently and noticeably more
    quiet than the other. Amplify can be found in the Effects menu. You may also have
    one side being far too loud – for this you can use Normalise to bring the volume
    down.


    **13** **Mix down**

    Some recorders will put interviewer and interviewee on different sides of a stereo
    track. This can be extremely annoying if you need to leave one side of your earphones
    out, or if you’re just trying to pick up words. On the track itself there’s a
    drop-down menu where you can ‘Split Stereo Track’ and then turn each one into
    mono.'
