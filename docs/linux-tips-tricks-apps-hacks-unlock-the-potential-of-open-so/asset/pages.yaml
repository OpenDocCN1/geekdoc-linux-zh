  md: '![](img/30dc0459712b32ede1a3814d456b41b6_113_0.png)


    # 04 Choose and test an app


    The Arion Chrome extensions itself doesn''t have any means to check if it is working
    correctly or not. Instead, you should install at least one Android application
    and test it. Of course, you can''t use APK files directly – you need them to be
    converted to Chrome extensions. At this stage, we only need to make sure that
    the runtime works, so we can download the sample 2048 game by Ubisoft (**bit.ly/1APjdKm**),
    which is already converted to extension.


    Unpack the ZIP file and install the resulting folder as another unpacked extension
    in `chrome://extensions`. You''ll notice the little Launch link, which is the
    power button for this and every other Android application inside Chrome that you
    might want to install in future. There''s a vast list of pre-packed extensions
    which you can find online (**bit.ly/lpwsU0h**). Not every app works but dozens
    do just fine, so you''re encouraged to try your luck.


    # 05 Obtain APK files


    You might want to test and possibly use a custom Android application that you
    were invited to try on the Web, or already use on your Android device. In the
    old days you had an abundance of sources from which you could download APK files
    manually, but for the sake of order and security, nearly all Android titles are
    now concentrated in Google''s Play Store. To retrieve an APK of your Play Store
    favourite app, use the following method:


    +   * Open the app page on the Google Play website. Then copy the link from the
    address bar of your browser to the clipboard; the link should look like this:
    `play.google.com/store/apps/details?id=com.rovio.angrybirds`.

    +   * Pass the link to any APK downloader service. One of the simplest ones to
    use is APK Downloader (`apps.evozi.com/apk-downloader/`) – this will instantly
    generate a download link for the appropriate APK file, which you can then save
    onto your hard drive.


    # 06 Convert APK to browser extension


    For this you''ll need the chromeos-apk tool, which is supported along with Arion
    by the same project. The tool is a NodeJS plugin, so the first thing we need to
    do is install NodeJS and its npm plugin manager. The package set and naming differs
    across Linux distributions – for Ubuntu and its derivatives, `sudo apt-get install
    nodejs` should work. With npm we can now install chromeos-apk:


    ```

    `sudo npm install -g chromeos-apk@latest`

    ```


    After a short while the new module should be successfully installed. So to convert
    an APK, you can now just use the following simple syntax:


    ```

    `chromeos-apk /path/to/application.apk`

    ```


    The tool will create a folder, which can be installed in Chrome as an unpacked
    extension. Use the Launch link to launch it, cross your fingers and wait for a
    little while.


    # 07 Test various other apps


    Not every Android application will work but most will. However, take note that
    if an app relies on camera, gyro or other hardware module, which doesn''t exist
    in a software mode, the app will malfunction or won''t start at all. For this
    reason, benchmarking tools (eg AnTuTu), Instagram, games like Asphalt and several
    others will not work. Google Services and everything that depends on it will also
    fail to work. Luckily, though, sound and microphone are supported very decently,
    thus enabling you to enjoy Skype, various games with talking buddies and many
    more.


    It is also possible to launch an unlimited number of Android apps in the Chrome
    browser, so explore and see what''s out there. However, remember to be aware of
    the CPU load, which can often be extremely high.'
