- pgno: 7
  md: '# Terminal


    # # 100 WAYS TO MASTER THE COMMAND LINE


    &gt;\_\_Conquer the command line with these essential terminal tips for controlling
    Linux


    # Terminal


    ong before desktop environments or graphical interfaces, in the heady days of
    the Seventies and Eighties, everything was done on a command line. Computing in
    the Nineties, while generally dominated by graphical interfaces and mice, wasn''t
    quite separated from it and computer users of a certain age will likely remember
    at the very least using the infamous DOS prompt.


    Now programming is well advanced and, even in Linux, you can spend your entire
    time in the desktop environment and never even touch the command line or terminal
    if you''re using the right distro. Thing is, you''d be doing yourself a disservice
    by not learning how to make the most of the command line as it can be an extremely
    powerful tool — especially as a lot of graphical software will have command line
    controls that you can use as well. So put on your best Nineties outfit, give yourself
    a bad nickname and get ready to look like a movie hacker.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# # NEED TO KNOW


    >— **Get to grips with the terminal before you take on the advanced tools**


    # >_001 **ls**


    You can use **ls** to list the files and folders that are inside the directory
    you are in.


    # >_002 **cd**


    The **cd** command enables you to move between directories on your system. Like
    the following, for example:


    ```

    $ cd /home/user/

    ```


    # >_003 **cp**


    The **copy** command, or **cp**, can be used to copy files from one location to
    another. To do this use the command below:


    ```

    $ cp file /home/user/Desktop/file

    ```


    # >_004 **mv**


    Similar to **copy**, **mv** instead moves the file to the new location, deleting
    the original file.


    ```

    $ mv file /home/user/Desktop/file

    ```


    # >_005 **rm**


    The **rm** command is for removing or deleting files and directories. You can
    use it like:


    ```

    $ rm file

    ```


    # >_006 **mkdir**


    You can create directories with the **mkdir** command using something like:


    ```

    $ mkdir folder

    ```


    # >_007 **nano**


    Nano is one of the programs that enables you to edit text in files – it’s vital
    for working and editing in the command line. You use it like so:


    ```

    $ nano file

    ```


    # >_008 **Tab**


    The **Tab** key lets you auto-complete commands and file names. Double-tapping
    will list all objects with a similar name. Auto-completion works for unambiguous
    file and command names. For example, ''fir'' gives you ''firefox'' as no other
    commands begin with ''fir''. If you get multiple hits, keep tapping to narrow
    the selection, then hit Tab again


    # >_009 **Up**


    Up on the keyboard has the very simple task of enabling you to pull up the last
    command that was entered, to run it again or edit it.


    # >_010 **Copy text**


    If you’re in the terminal, you may want to copy text output to use somewhere.
    To do this, you can use: **Ctrl+Alt+C**.


    # >_011 **Paste text**


    If you’ve found a command online or need to paste some text into nano, you can
    enter any text on the clipboard with: **Ctrl+Alt+V**.


    # >_012 **Open terminal**


    This trick works in a lot of desktop environments: a shortcut for opening the
    terminal can be done with: **Ctrl+Alt+T**.


    # >_013 **sudo**


    This lets you do commands as the super user. The super user in this case is root
    and you just need to add **sudo** to the start of any command.


    # >_014 **Access root**


    The super user, or root, can also be accessed by logging in as it from the terminal
    by typing **su**. You can enter the root user password and then run every command
    as root without having to use **sudo** at all.


    # >_015 **Stop processes**


    If you have run a command and either it’s paused, taking too long to load, or
    it’s done its job and you don’t need to see the rest of it, you can stop it forcefully
    by using either **Ctrl+C** or **Ctrl+Z**. Remember, only do this if the process
    is not writing any data, as it is not safe in this instance and you could find
    yourself in trouble.


    # >_016 **Access root without password**


    If your regular user is in the sudoers list (ie so that they can use **sudo**
    in general to run things as root), you can access the su account by using **sudo
    su**. This uses your normal user password to access root terminal functions.


    To add a regular user to the sudoers list, you would need to first log in as the
    super user by using **su**. Then, you would simply run **adduser username sudo**
    (replacing ''username''). Be careful who you add to the sudoers list, though!


    ![](img/30dc0459712b32ede1a3814d456b41b6_8_0.png)


    # >_017 **Search for hidden files and directories**


    The **ls** command can be used in more than just the basic way of listing all
    the files in a folder. To begin with, you can use it to list all the hidden items
    along with the normal items by using:


    ```

    $ ls -a

    ```


    # >_018 **Home directory shortcut**


    The home directory is located at **/home/user/** in the absolute filesystem, but
    you can use the tilde (\~) to signify the home directory when moving between directories
    or copying, or doing mostly anything else – like with the following, for example:


    ```

    $ cd ~

    ```


    # >_019 **Link commands together**


    If you want to do a series of commands one after the other, like updating and
    then upgrading software in Debian, for example, you can use **&&** to have a command
    run right after the one before. For example:


    ```

    $ sudo apt-get update && sudo apt-get install libreoffice

    ```


    # >_020 **Long terminal input**


    Sometimes when using a list or anything else with a long terminal output, you
    might not be able to read it well. To make it easier to understand, you can send
    the output to another command, **less**, through the pipe. It works like so:


    ```

    $ ls | less

    ```'
