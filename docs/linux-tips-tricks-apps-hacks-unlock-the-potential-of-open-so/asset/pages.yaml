    Again, there’s a PPA for easy installation:


    ```

    sudo add-apt-repository

    ppa:nilarimogard/webupd8

    sudo apt-get update

    sudo apt-get install albert

    ```


    The first time you launch Albert you’ll see its configuration window where you
    can change certain settings and, what’s more important, assign a shortcut for
    invoking Albert. After you


    # 08 Manage your mailbox


    Trojitá binaries are kindly offered by the ODBS system (https://LKQKL/L), but
    there is only a Qt4 build. While Qt5 build does exist for other Linux distros,
    in the case of Ubuntu we will need to compile a Qt5 Trojitá from the source. Thankfully,
