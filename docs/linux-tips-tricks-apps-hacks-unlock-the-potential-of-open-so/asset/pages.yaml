- pgno: 48
  md: '# 14 Test network speed using Netcat


    This is a relatively tricky use of Netcat, but it is very handy when you do not
    have any other tool to test the network speed between two machines. For this to
    work you’ll have to use the netcat-traditional package.


    Now, on the server machine you will need to execute the following command:


    ```

    $ time nc -D -v -n -l 2222 >/dev/null

    ```


    On the client machine, execute the next command and press Ctrl+G after about 15
    seconds to make it stop:


    ```

    $ time nc -n nc_traditional -v -n 192.168.2.4 2222 >/dev/null

    ```


    Using the **bc** utility, you can find out that the network speed is about **1.108.087**
    bytes per second, which is absolutely perfect for a 10Mb wireless network.


    # 15 Transfer entire directories using Netcat


    You have already learned how to transfer single files using Netcat. Now, you’re
    going to learn how to transfer whole directories using Netcat and the help of
    the **tar** command. The server part is the following:


    ```

    $ tar -cvf - directory | nc -l 1234

    ```


    The client part should be as follows:


    ```

    $ nc localhost 1234 | tar -xvf -

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_48_0.png)


    # 16 Encrypt a Netcat connection using Cryptcat


    Transferring data in plain text isn’t secure and may cause problems. If you need
    encryption, use Cryptcat, a lightweight version of Netcat that includes Twofish
    encryption. On an Ubuntu system, install as follows:


    ```

    $ sudo apt-get install cryptcat

    ```


    Now, you are ready to start using Cryptcat. The server part looks like this:


    ```

    $ cryptcat -k passphrase -l -p 12345

    ```


    The client part should run the following command:


    ```

    $ cryptcat -k passphrase localhost 12345

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_48_1.png)


    # 15 Transfer entire directories using Netcat


    If you give a wrong password after the **-k** parameters, the connection will
    automatically terminate. If you want to make sure that your data is actually encrypted,
    you can use a tool such as Wireshark or Tcpdump to sniff it and see the results.


    # Firewall and router issues


    Firewalls and routers can make Netcat misbehave when used for creating a server
    with the -4 parameter. Difficulty lies in the fact that a router or a firewall
    may not enable hairpin connections. The router or the firewall would not make
    the connection when both the source and destination are behind the NAT. As a result,
    the machine won’t listen to the specified port, using an arbitrary port instead.


    ![](img/30dc0459712b32ede1a3814d456b41b6_48_2.png)


    # 18 Capture network data using tcppow


    If lots is happening and you can’t find out where the actual problem is, ask Tcppow,
    Topdump and Wireshark for help. Tcppow is a command line tool to help you inspect
    network data. The following command displays network data from or to port number
    1234:


    ```

    $ sudo tcppow -i any -c -J port 1234

    ```


    If you cannot solve your problems with tcppow, capture your data with topdump
    and process it with Wireshark.


    # Above You don’t need Dropbox to transfer folders over your network'
