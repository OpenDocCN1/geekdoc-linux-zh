  md: '![](img/30dc0459712b32ede1a3814d456b41b6_86_0.png)


    # **12** Identify the root filesystem


    With this configuration you''re going to have the SD card and the external USB
    storage connected, so you need to tell the Pi where the root filesystem is. Still
    on the desktop Linux computer with your SD card inserted, run:


    ```

    sudo nano /boot/cmdline.txt

    ```


    Find root=/dev/mmblk0p2 (or similar) and change that to read root=/dev/sda2 which
    is your external USB storage. Save and exit.


    # **13** Add other USB devices


    You can now restart your Pi with the storage devices attached, but as soon as
    you connect further USB media you''ll suffer problems. Avoid this by installing
    gdisk:


    ```

    sudo apt-get update

    sudo apt-get install gdisk

    ```


    Then run gdisk:


    ```

    sudo gdisk /dev/sdb

    ```


    Enter ? to display the options and select Recovery and Transformation options
    (experts only), followed by Load MBR and Build Fresh GPT. Tap ? one last time
    and select ''Write Table to Disk'' and exit. Remove and replace the USB device
    and run gdisk again. This time enter l and then 1 to display the Partition Unique
    GUID.


    # **14** Make your Pi fast & reliable


    Make a note of the GUID and then switch to the SD card. Reopen cmdline.txt and
    change root=/dev/mmblk0p2 to root=PARTUUID=XXXXXX, where the numerical string
    for the partition unique GUID should replace the XXXXXX. When you''re done, save
    and exit. You can then start your Raspberry Pi. Congratulations, your Raspberry
    Pi is now faster and more reliable to use!


    # **15** Boost performance with overclocking


    Need more from your Raspberry Pi? It is possible to overclock the computer, although
    you should be aware of the risks inherent with this activity. You should also
    ensure that your Raspberry Pi''s processor is suitably cooled – heatsinks for
    the CPU, Ethernet controller and power regulator can be purchased online.


    Above Heat sinks for the Pi are widely available and usually cost less than $10


    ![](img/30dc0459712b32ede1a3814d456b41b6_86_1.png)


    # **16** Overclock your Raspberry Pi


    Overclocking is available through raspi-config. Launch from the command line and
    arrow down to the overclock option. Four further options are available: Modest,
    Medium, High and Turbo. With your ideal clock speed selected, exit raspi-config
    and restart your Raspberry Pi to apply.


    ```

    sudo shutdown -r now

    ```


    Now you will need to perform tests to see how stable it is overclocked. Raspberry
    Pi founder, Eben Upton, suggests running Quake 3 as a good stress test. Should
    the Pi fail to boot, hold Shift to boot without overclocking, run raspi-config
    and select a more modest overclock.


    # **17** Run Raspbian without the GUI


    Despite these changes, you may find that the GUI remains slow. If you find your
    Pi running a lot of commands in bash, the best thing to do is disable launch into
    X. In raspi-config, choose boot_behaviour and select the first (default) option
    to ensure your Pi boots to the command line. Should you need the GUI, enter startx
    in Terminal.


    > Overclock with a heatsink

    > Overclocking is potentially dangerous to any computer system, which is why it''s
    good that the Raspberry Pi dev teams have included the facility in their support
    system and advice. Make sure you use a heatsink for extra reliability; if you''re
    using this feature, then make sure your system is available for use.

    > Use a heatsink for the Raspberry Pi to cool the CPU and GPU when in use.'
