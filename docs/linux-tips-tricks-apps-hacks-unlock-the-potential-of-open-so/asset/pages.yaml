  md: "![](img/30dc0459712b32ede1a3814d456b41b6_95_0.png)\n\n> Left: Running a private\
    \ cloud? Make sure no one can break into it...\n\n# # Secure your Raspberry Pi\n\
    \nConcerned about the security of data stored on your Raspberry Pi? Protect yourself\
    \ with passwords, firewalls and some physical security\n\nThere is a distinct\
    \ security risk around your Raspberry Pi. Storing anything, from passwords to\
    \ firewalls, this important saved data can be stolen or pocketed with minimal\
    \ effort if someone knows how.\n\nTherefore it's a relief to learn that several\
    \ tools, tricks and methods can be applied to keep your device and data away from\
    \ prying eyes. You might, for example, be running a home security cam with images\
    \ uploaded to a cloud account. These images would be visible to anyone who possesses\
    \ your Raspberry Pi's login details if you haven't bothered to change the defaults.\
    \ Such a project (and many others) also demands that a firewall is installed for\
    \ further improved security on a network.\n\nWhether you're simply changing passwords,\
    \ keeping your Pi under lock and key or installing a firewall, you'll be surprised\
    \ at how easy it is to secure your Raspberry Pi and protect all of your important\
    \ information and files.\n\n+   **What you'll need**\n+   \n+   * Velcro\n+  \
    \ * Adhesive putty\n+   * Lockable cupboard, strongbox, etc."
