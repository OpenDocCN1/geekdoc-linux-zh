  md: '![](img/30dc0459712b32ede1a3814d456b41b6_97_0.png)


    Fwbuilder has a great quick-start guide that handily annotates the entire interface


    Several firewall templates are available for the most common types of setup


    The objects in this panel can be dragged out into the rules panel on the right-hand
    side


    # Hiding hardware


    Putting your hardware out of sight and/or out of reach is a good option for security,
    and for something as small as the Raspberry Pi and an SD card you have quite a
    few options.

    For instance, using Velcro or some adhesive putty you might attach the computer
    to the back of a cupboard or unit, tucking knobs aside or even under a car seat.
    The SD card, meanwhile, is so compact that you could easily place it under a carpet
    or even make a home for it in a radiator or shelf – just don’t forget where you
    put it!


    # 07  Edit cmdline.txt


    Find the file cmdlinetext and open it in your Linux desktop text editor. Add the
    following to the end of the last line of the file:


    ```

    init=/bin/sh

    ```


    As the Raspberry Pi boots, this command will be read, enabling us to access a
    screen to reset the password. Save and eject the card.


    # 08  Change the lost password


    Unfortunately you won’t be able to use SSH to recover the password, so instead
    connect a monitor and keyboard to your Raspberry Pi. Boot the Pi and wait for
    the prompt, at which point you should enter:


    ```

    passwd  username

    ```


    Type the password, hit Enter and type it again to confirm.


    # 09  Initialsise the Raspberry boot


    Thanks to the added code, we have changed the standard Raspberry boot to display
    a new prompt that will let us change the password.

    When this is done, enter the following command to put things back in order:


    ```

    sync

    exec /sbin/init

    ```


    The Pi will now boot Raspberry normally, enabling you to sign in with the new
    password.


    # 10  Revert cmdlinetext


    We are not done yet though. Safely shutdown your Raspberry Pi with:


    ```

    sudo  shutdown  -h  now

    ```


    With the Pi powered down, remove the SD card and insert it into the card reader
    again. Open cmdlinetext in your text editor once again and remove init=/bin/sh,
    then save and exit. This stops anyone else from resetting your password.


    # 11  Physically secure your Raspberry Pi


    Keeping digital intruders out of your Raspberry Pi with firewalls and secure account
    passwords is only part of the story. To fully protect your Pi you need to think
    outside of the box.

    Barely larger than a credit card, the Raspberry Pi computer can easily be picked
    up and palmed. Physical security is paramount, but a genuinely secure Raspberry
    Pi case – for example, one compatible with Kensington locks – has yet to be released.
    However the ProtaArmor aluminium case from www.mobileprepystems.com can be screwed
    to a secure surface, which is great for more permanent project setups.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_98_0.png)


    > Below: If you tend to access your Pi remotely via Wi-Fi, consider keeping it
    locked away


    # 12 Lock it in a drawer


    Probably the best way to keep your Raspberry Pi secure is to make sure you keep
    it locked in a drawer or cabinet – particularly useful if you use the device as
    part of a security cam system or as a cloud server storing valuable documents.


    If no lockable storage is available and you''re taking some time away from home
    where it isn''t practical to take the Pi with you, another solution is needed.
    This might be to travel with your Pi''s SD card in your wallet, perhaps leaving
    the computer attached to the back of a wardrobe with Velcro.


    # 13 Add a firewall


    Regardless of which operating system you''re using, adding a firewall is a guaranteed
    way to improve your computer''s security. While the Raspberry Pi has a built-in
    firewall, it is tricky to configure.


    Thankfully, some other people have noticed this too and released fwbuilder, an
    interface to the otherwise complex iptables firewall that comes with Raspbian.


    # 14 Install fwbuilder in Raspbian


    Because iptables is a bit fiddly and errors can leave you with no network connection,
    fwbuilder has been developed to make firewall configuration quick and painless.
    Well use the apt-get command to first check for updates and then install fwbuilder:


    ```

    ```sudo apt-get update

    sudo apt-get install fwbuilder```

    ```


    Follow the prompts to install and, once complete, switch to the Raspberry Pi GUI
    by entering:


    ```

    ```startx```

    ```


    In the Pi''s mouse-driven desktop, launch fwbuilder from the Internet menu. Upon
    launching fwbuilder, follow the given steps to set up your Raspberry Pi firewall
    and save the resulting script.


    We''re nearly done but some adjustments are still required before your Pi fully
    connects to the network.


    > “A firewall is guaranteed to improve your security”


    ![](img/30dc0459712b32ede1a3814d456b41b6_98_1.png)


    # 15 Complete firewall configuration


    Launch the /etc/network/interfaces script in your text editor and complete configuration
    by adding


    ```

    ```pre-up /home/pi/fwbuilder/firewall.fw```

    ```


    Next, find the section labelled “Epilog” and add


    ```

    ```route add default gw [YOUR.ROUTER.IP.HERE] eth0```

    ```


    If you''re using a wireless card, add the same line but switch the last character
    to wlan0:


    ```

    ```route add default gw [YOUR.ROUTER.IP.HERE] wlan0```

    ```


    # 16 Consider Raspberry Pi theft


    While losing your Raspberry Pi or the data on it, might initially seem like a
    disaster, don''t be disheartened. As long as you have taken steps to backup data
    or clone your SD card, you at least have continuity when you resume the project.
    You can also check our boxouts for methods to help you deal with physical theft.


    # Pocket your Pi


    If you''re still concerned with your Pi''s security, put yourself in the place
    of a potential thief. Where would you stash it? Probably in your pocket. The Raspberry
    Pi is small enough to take with you, so why leave it lying around? Any security
    questions relating to your Raspberry Pi can be addressed by keeping it close when
    ever necessary.'
