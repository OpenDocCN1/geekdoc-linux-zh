  md: '# Tips | Tricks | Hacks | Apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_119_0.png)


    # 10 Choose a bootloader


    Right You get fine control over your build, even down to the bootloader


    # Other distro builders


    Debian isn''t the only distro you can customize. Fedora and openSUSE''s live CDs
    are two you can also use in various stages of final release. The Archiso and Fedora
    Buildsys are also another tool on the tool that lets us to the BASE and custom
    BUILD distros at some of You can find more help, see usertool.com


    ![](img/30dc0459712b32ede1a3814d456b41b6_119_1.png)


    # 07 More architecture choices


    As well as a basic architecture choice, you can drill down into the sub-architectures
    to better optimise your distro for the task you need it for within linux-flavours.
    If you''re doing 64-bit, the standard amd64 is all you really need to concern
    yourself with. For 32-bit/x86 builds, there are many more choices. For much older
    processors 486 will work, but won''t be able to make full use of their power.
    In addition, 686 won''t work on older tech, but it will work on all modern machines.
    Choose 686-pae if you want to properly use 4 GB of RAM as well.


    # 08 Chroot filesystem


    The root filesystem that you actually boot from can be modified in the chroot-filesystem
    option, right above the linux-flavours that we just talked about. It''s set by
    default to SquashFS, which is the current standard, but if you need it to be another
    filesystem type for older or different machines, you can choose ext2 or plain.


    # 09 Extra boot options


    In the advanced binary options we can start adding extra options for our specific
    use cases. You can mostly keep these at their defaults, but there are a few options
    you could feasibly change to get the most out of it. First of all is the ''bootappend-live''
    option: this enables you to add any extra boot options to the distro you''re creating.
    Setting a resolution, running in software rendering and any other boot option
    you''d want can all be added here.


    # 10 Choose a bootloader


    Live systems tend to use syslinux for live booting, although it can depend on
    what kind of images are in the ISO. Multiple arch and kernel versions are easier
    to launch via GRUB. We won''t be able to do that in this image, but if you''re
    having problems booting then you could always try building the image with the
    different bootloader. For now, we recommend using syslinux and then changing it
    to GRUB if it''s not working in your specific use cases.


    # 11 Choose installer type


    You are three choices for the installer in the ISO. First of all, you can have
    none and it just boots into a live environment. Secondly, you can have it as an
    option other than live-booting, so that you can go straight into installing the
    image if you know it''s exactly what you want. Lastly, the live option provides
    for a live install from the live environment. We''re choosing live, as it enables
    us to use the distro and then install without rebooting.


    # 12 ISO options


    The ISO-labelled options are all for just labelling the ISO in your own way. You
    can leave those as and it won''t affect anything, or change them if you plan to
    distribute your version of Debian and want some extra info to be in there. The
    volume will appear on the actual ISO name, with the application being used as
    the name of the distro elsewhere.


    # 13 Final binary options


    Finally, you can set a few extra options such as whether or not memtest86+ is
    included in the ISO, and the location to look for the Netboot ISOs for booting
    with the net-patch and net-server is available to tweak. These last few you won''t
    need to change for a normal ISO, but if you''re making a netbooting distro then
    you''ll have to make sure you have the infrastructure set up and know what needs
    to be added to these fields.'
