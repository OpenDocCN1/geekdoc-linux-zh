  md: "![](img/30dc0459712b32ede1a3814d456b41b6_156_0.png)\n\nThe Software Manager\
    \ is one of the things that separates it from Ubuntu, with no ads or paid apps.\
    \ It’s had a few minor updates, including the ability to show off more screenshots\n\
    \n![](img/30dc0459712b32ede1a3814d456b41b6_156_1.png)\n\nMATE is still at 1.6,\
    \ but it’s a great desktop and a solid choice for a Mint install nonetheless\n\
    \n![](img/30dc0459712b32ede1a3814d456b41b6_156_2.png)\n\nMDM has come on in leaps\
    \ and bounds since its first introduction, and this release is the first time\
    \ it’s seemed truly modern\n\n# “For those new to Mint, this is still one of the\
    \ best distros out there”\n\nwhich comes in the way Cinnamon handles itself slightly\
    \ more efficiently. On the kind of modern systems we’d recommend Linux Mint for\
    \ Cinnamon for, it’s barely noticeable with normal use, but on older systems there\
    \ is a benefit.\n\nAlong with further polish like handling the system sounds better,\
    \ adding the ability to open the home directory any time by using the super/Windows]\
    \ key plus ‘e’ at any given point. It’s a minor improvement over the already excellent\
    \ desktop environment, but at the very least it doesn’t make the experience any\
    \ worse.\n\nOn MATE, the other desktop that the Mint team work on, there’s a similar\
    \ level of minor updates, although there’s now full support for switching to Compiz\
    \ over the standard window manager out of the box.\n\n# Minor changes\n\nIt is\
    \ a minor update over the original version of Linux Mint 17, but it’s definitely\
    \ a useful one for those that like to keep their software up-to-date. If you’re\
    \ already running Mint 17 you won’t really need the update, but it’s worthwhile\
    \ for those jumping into Mint (or Mint 17 at least) right now.\n\nFor those new\
    \ to Mint and perhaps Linux in general, this is still one of the best distros\
    \ out there. Using all the traditional desktop metaphors and workflow that people\
    \ will have learnt on every other type of computer helps allow you to get straight\
    \ into using and enjoying the Linux experience. Cinnamon itself is probably the\
    \ best new desktop of the past few years, taking modern parts of desktop environments\
    \ such as search and software integration and giving an interface without compromise.\n\
    \nMATE on the other hand acts more as a continuation of slightly older (and lighter)\
    \ technology to see it through. This one is aimed more at Linux veterans who don’t\
    \ like the direction of some of the more modern desktops, while still being able\
    \ to squeeze in whatever new tech might improve the experience without getting\
    \ in the way.\n\nLinux Mint’s use of Ubuntu goes further than just slapping a\
    \ bit of branding and a different desktop environment on top of it though; the\
    \ Mint team have a habit of completely overhauling certain aspects of the distro.\
    \ There’s a custom login manager that is much more advanced than lightdm or even\
    \ gdm, allowing for better and more elaborate theming if you want it. On the desktop\
    \ itself you have an excellent alternative to the Ubuntu Software Centre, along\
    \ with better settings and generally more control and less bloat on the distro.\
    \ Even with the change to LTS only, all this remains with 17.1.\n\n> ## Summary\
    \ \n> \n> Linux Mint 17.1 may only be a minor update over 17, but it brings with\
    \ it enough improvements to warrant an upgrade if you’ve not been keeping your\
    \ system up-to-date, or still on the edge of whether or not to get 17 in the first\
    \ place.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_156_3.png)"
