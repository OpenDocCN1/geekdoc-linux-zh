  md: '# Tips | Tricks | Hacks | Apps


    # Living lightweight


    Q5 has been around for years and more Qt applications are moving to use it. Right
    now we can build a decent, highly usable desktop around LxQt. Network connections
    can be managed with ConnMan and its DMSt frontend, Dropbox client is handy using
    Qt5 and LxQt System Settings work just as well as the same- named KDE module.
    There is also a web browser, email client and a versatile media player available
    to access.


    How does it compare to the KDE desktop? There’s no easy answer. Firstly, the hand-made
    LxQt desktop has less features than either KDE 2 or the new Plasma 5 desktop,
    but it’s a lot lighter. Pure LxQt needs less than 100 megabytes of RAM and each
    extra Qt5 application adds very few. Secondly, current Plasma 5 choices (like
    Kubuntu or Netrunner) are forced to mix Qt4 and Qt5 parts so that the resulting
    desktop is non-uniform and consumes more resources.


    Lastly, you have to remember that Plasma 5 isn’t quite mature yet. Though its
    current state is definitely a lot nicer than early KDE 4 releases in 2008-2009,
    some core applications still remain in the Qt4 world. Unfortunately, on there
    will be a transitional period from KDE 4 to the Plasma 5 desktop. However, if
    you stick with it, your patience will be rewarded!


    # 05 Get Drawpile


    The latest Drawpile version (0.9.8) can be installed via the Getdeb service here:
    www. getdeb.net/app/DrawPile.


    The program has several applications. Firstly, it is an easy-to-understand drawing
    software comparable with MS Paint, Kolourpaint and Pinta – simple, beautiful,
    good for kids. Secondly, its UI is optimised for use in Web projects (with brushes,
    colour palettes, alpha handling). Finally, it has the rectangle host a chat window.
    Drawpile enables several people to draw simultaneously on one canvas.


    # 06 Use PhotoQt to view images


    PhotoQt is offered via the PPA and something like the following is entered:


    ```

    sudo add-apt-repository ppa.samoij13/ppa

    sudo apt-get update

    sudo apt-get install photoqt

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_109_0.png)


    # 05 Get Drawpile


