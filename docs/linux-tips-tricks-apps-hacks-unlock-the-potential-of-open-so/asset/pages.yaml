  md: '# BEST DISTRO FOR...

    Rolling release


    For those who don''t like to be beholden to formal release schedules, rolling-release
    distributions promise to never get out of date


    ![](img/30dc0459712b32ede1a3814d456b41b6_143_0.png)


    # Gentoo


    Named for the speedy **Gentoo penguin**, Gentoo and Arch have long **been rivals**.
    Both offer a true rolling-release development methodology, meaning that the latest
    updates are brought to the entire user base simultaneously - ensuring that no
    installation is ever out of date, and that installation need only occur once -
    and that both feature a BSD-inspired ports-like software distribution platform.


    For the Linux purist, the hands-off approach of Arch is likely to appeal, but
    for the average user Gentoo is a gentler introduction to the world of rolling
    releases. First released back in 2002, the distribution has a considerable fan
    base who appreciate the team''s still-rare approach to development and software
    releases.


    The other main advantage to running Gentoo is that its software is compiled from
    source directly on the user''s system via the Portage manager. This means no


    +   * Support forums and an IRC channel are linked right from the desktop


    waiting for package maintainers to build and upload a package for your platform,
    and that the software which gets installed can be optimised for your specific
    processor architecture - enabling performance boosts where generic compilation
    would drain power from the system. The trade-off, of course, is that compiling
    from source typically takes longer than simply installing pre-compiled binaries
    from a package archive.


    Like Arch, Gentoo''s installation process has been tricky - although plenty of
    community help is available in documentation, IRC channels and mailing lists -
    but the relatively recent release of a Live USB variant makes it far easier to
    try. While its popularity has waned in recent years, Gentoo remains a great choice
    for anyone who wants a highly customisable system, and while it can be tricky
    to install, it''s a process that - in theory - should only ever have to happen
    once.


    +   * Installation is slower but gives you better-optimised apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_143_1.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_143_2.png)


    # BEST FOSS


    +   * **GIMP**

    +   The open-source answer to PhotoShop, the GNU Image Manipulation Program has
    recently introduced a single-window mode to combat criticisms of its unfriendly
    userface, bringing its power to a new audience.


    +   * **Audacity**

    +   Supporting multi-track mixing and with more filters and utilities than you''d
    imagine using, Audacity helps prove that Linux is no slouch when it comes to creative
    work and that it can head up there with the proprietary platforms.


    +   * **Firefox**

    +   Although under fire for perceived bloat - ironic, considering the project
    was founded to deal with perceived bloat in the Netscape browser - the Firefox
    browser, now on version 34, remains a popular choice among users.


    +   * **LibreOffice**

    +   Created following Sun Microsystems'' acquisition of OpenOffice.org, the Document
    Foundation''s LibreOffice is now the default in many distributions, offering feature
    and compatibility to please even the biggest Microsoft Office fan.


    +   * **VLC**

    +   The strength of VLC lies in its flexibility. As well as the ability to play
    almost any audio or video format, it supports streaming over the network and the
    ability to record from various sources - including capturing a live view of your
    desktop.


    # ALTERNATIVE DISTROS


    +   * **Sabayon**

    +   A Gentoo variant. Sabayon retains the rolling release ethos but is a far more
    welcoming, ''designed to work out-of-the-box'' release. Sabayon loses a little
    in flexibility compared to its upstream parent but is still a powerful distribution.


    +   * **Arch**

    +   Arch can be a welcome alternative to newcomers'' first solo desktop Linux
    release and installation is a process of following the instructions on the wiki.
    Once installed though it''s easy, fast and extremely flexible.


    +   * **Altlinux**

    +   Altlinux offers a family of distributions and rolling release development.
    Taking Debian''s versatile build system and return compatibility with Ubuntu,
    the project''s open source and its community forum and forums provide a strong
    support network.


