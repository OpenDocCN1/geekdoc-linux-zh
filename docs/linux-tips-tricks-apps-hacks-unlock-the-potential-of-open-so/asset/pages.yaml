  md: '![](img/30dc0459712b32ede1a3814d456b41b6_124_0.png)


    # 15 Use style information


    While attaching DOM information to a renderer, the element is queried for CSS/Style
    information and the resultant data is kept in RenderStyle.h for when the webpage
    requires this rendering. All supported style properties can be queried via RenderStyle.h
    which then connects it to an attached renderer with:


    ```

    ```cpp

    void setStyle(RenderStyle*)

    ```

    ```


    This style can be changed on the renderer, but otherwise it will stay the same
    until destroyed. Styles can be accessed using:


