  md: '![](img/30dc0459712b32ede1a3814d456b41b6_32_0.png)


    # Conduct a search


    # 09


    To search your emails, hit / and then type your search term or regular expression.
    Using T instead of / will tag all of the messages matching the search term, allowing
    for the same range of actions as the previous step.


    It’s worth reading the Mutt documentation for more on search – you can find and
    select mails by properties such as size or date, all of which are handy when your
    inbox has grown as large as Gmail provides for.


    ![](img/30dc0459712b32ede1a3814d456b41b6_32_1.png)


    # 10 Create an alias


    As you start typing an email address in your webmail, all the likely completions
    will pop up. The Mutt equivalent is to define an alias for each person to whom
    you need to write messages regularly:


    ```

    alias bank Bank Manager manager@barclays.co.uk

    ```


    The first word after alias is your shortcut, everything else between that and
    the actual address is the long-form name. Typing the shortcut at the To: prompt,
    when you’re composing an email, will cause Mutt to substitute the long name (if
    given) as well as the email address. If you’ve several aliases collected, give
    them their own file and let .muttrc know where it is:


    ```

    set alias_file=~/mutt/aliases

    ```


    # 11 PDF


    Your /etc/mailcap file tells your email clients how to handle multimedia attachments.
    Hit V to read a PDF attachment and the system default (probably Evince or Okular)
    will open. If you’re running Mutt in a command line environment, you’ll need to
    make a custom mailcap in ~/.mutt/mailcap to specify piping pdftotext through w3m.
    You’ll need to point to this in .muttrc with:


    ```

    set mailcap_path="~/.mutt/mailcap"

    ```


    The output is not properly formatted, but at least the content is now readable.


    # 12 The next step


    While trying to cover useful tips for new Mutt users, we’ve had to adopt a scattergun
    approach – the idea being to get you started, at least. However, we’ve missed
    out a lot of deeper configuration and many powerful uses of this flexible mailer.
    Fortunately, the next step is easy: read the Mutt documentation at http://dev.mutt.org/trac/wiki/MuttGuide,
    as well as accompanying manual and wiki pages. There’s a lot of it for someone
    who’s never used Mutt before, but you already have a working setup and know some
    power user tricks, so you’re ready to really go and tame your inbox.


    # 09 Conduct a search


    # Above Filtering emails by date and searching for keywords really speeds things
    up'
