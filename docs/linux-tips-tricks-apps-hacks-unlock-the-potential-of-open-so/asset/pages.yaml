    # Run Linux in the AWS cloud


    > Power up your own virtual Linux instance on EC2 and run it free for a year


    AWS, short for Amazon Web Services, is the equivalent of an online retailer for
    virtual infrastructure and cloud services, complete with an automated self-service
    checkout and rock-bottom prices. Amazon''s pay-as-you-go rendition of enterprise-class
    infrastructure services is welcomed by cost-conscious, performance-hungry users
    - from website owners who need to scale out on demand, to software developers
    and Linux administrators who only need a Linux box for a few hours. On AWS, there
    are no long-term commitments - you only pay for actual use. With cost savings
    of as much as 72 per cent and more over a conventional data centre, it is no wonder
    that AWS quickly became the hot ticket in town. The global firm Gartner estimates
    the total global market share of AWS at a mind-bending 85 per cent. Arguably,
    the most important feature of Amazon''s cloud is not its sheer size but its affordability.
    Amazon gives each new account owner a Free Usage Tier for a full year after they
    first register. https://aws.amazon.com/free. So, thanks to its low prices, no
    up-front investment, its granular administrative controls and the freedom to run
    your own infrastructure in your own way, AWS has turned into an open source stronghold
    where Linux reigns supreme.


