- pgno: 65
  md: "![](img/30dc0459712b32ede1a3814d456b41b6_65_0.png)\n\n![](img/30dc0459712b32ede1a3814d456b41b6_65_1.png)\n\
    \n# 06 Add titles and labels\n\nSooner or later, it’s likely that you will want\
    \ to add a title and labels to the output.\nAdding a main title is simple – you\
    \ just need to make use of the labs() function in order to do so. The previously\
    \ plotted bar plot can thus be modified with inclusion of the following command\
    \ at the end:\n\n```\n```r\nggplot(LUD, aes(x=RAM, y=SSD, fill=Uptime)) + geom_bar(stat=\"\
    identity\") + labs(title=\"This is a Title\")\n```\n```\n\nAdding X and Y labels\
    \ can be done by entering the following:\n\n```\n```r\nggplot(LUD, aes(x=RAM,\
    \ y=SSD,\n    fill=Uptime)) + geom_bar(stat=\"identity\") +\n    labs(title=\"\
    This is a Title\") + xlab(\"X\n    Label\") + ylab(\"Y Label\")\n```\n```\n\n\
    # 07 More about titles and labels\n\nYou can add or change the appearance, colour,\
    \ font and size of all the title and labels.\nThe following command makes the\
    \ title blue and its size larger using the theme() function:\n\n```\n```r\nggplot(LUD,\
    \ aes(x=RAM, y=SSD,\n    fill=Uptime)) + geom_bar(stat=\"identity\") +\n    labs(title=\"\
    This is a Title\") + xlab(\"X\n    Label\") + ylab(\"Y Label\") + theme(plot.\n\
    \    title = element_text(size = rel(2),\n    colour = \"blue\"))\n```\n```\n\n\
    To change the attributes of the X and Y axes, use the axis.line function:\n\n\
    ```\n```r\nggplot(LUD, aes(x=RAM, y=SSD,\n    fill=Uptime)) + geom_bar(stat=\"\
    identity\") +\n    labs(title=\"This is a Title\") + xlab(\"X\n    Label\") +\
    \ ylab(\"Y Label\") + theme(plot.\n    title = element_text(size = rel(2),\n \
    \   colour = \"blue\"), axis.line = element_\n    line(size = 3, colour = \"red\"\
    , linetype\n    = \"dotted\"))\n```\n```\n\n# 08 Create histograms\n\nGenerate\
    \ histograms using the geom\\_histogram() function, similar to the geom\\_bar()\
    \ function, and change the number of bars using the binwidth argument. Plot a\
    \ simple histogram using the following command:\n\n```\n```r\nggplot(LUD, aes(Year5))\
    \ + geom_\n    histogram(binwidth=1, color=\"gray\")\n```\n```\n\nUse geom\\_density()\
    \ function for a density plot:\n\n```\n```r\nggplot(LUD, aes(Year5)) + geom_\n\
    \    density(binwidth=1)\n```\n```\n\nThe following command draws a histogram\
    \ and a density plot on the same plot:\n\n```\n```r\nggplot(LUD) + geom_\n   \
    \ histogram(aes(Year5, ..density..),\n    binwidth=2, color=\"white\") + geom_\n\
    \    density(aes(Year5, ..density..),\n    binwidth=2, color=\"red\")\n```\n```\n\
    \nIf you put the geom\\_density() command first, the histogram will be on top\
    \ of the density plot and therefore the density plot will not be completely visible.\n\
    \n![](img/30dc0459712b32ede1a3814d456b41b6_65_2.png)\n\n# 09 Add smooth layers\n\
    \nAnother type of layer is the smooth layer. It doesn’t display raw data, but\
    \ rather a statistical transformation of the data.\n\nThe (method=\"lm\") parameter\
    \ generates a linear regression line instead of a LOESS (local polynomial regression\
    \ fitting) curve, which is the default for samples with less than 1000 observations.\
    \ For bigger samples, the default method is called GAM (generalised additive model).\
    \ The produced plot was generated with the following commands:\n\n```\n```r\n\
