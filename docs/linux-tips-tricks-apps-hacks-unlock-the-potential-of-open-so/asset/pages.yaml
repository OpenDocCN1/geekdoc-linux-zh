- pgno: 13
  md: '# # MEDIA CONTROLS

    >_ You can control your tunes while working inside the terminal


    ![](img/30dc0459712b32ede1a3814d456b41b6_13_0.png)


    # ## BEST OF THE REST

    >_ All the other commands that you might want to know for future reference


    >_082 Open files in terminal

    If you''ve got a file you can see in a graphical file manager, instead of opening
    a terminal and navigating to and then executing the file or script, you can usually
    run it directly from the terminal. To do this you usually just need to right-click
    and select a run in terminal option.


    >_087 Move back through pushd

    Following on from Tip 86, once you want to start moving back up the stack to the
    first directory, you can use **popd** in the terminal. You can also check which
    directories you have stacked up by using the **dirs** commandand as well.


    >_078 Pause music

    Some audio players have command line controls they can use. Rhythmbox has this
    and it''s a cool thing to use when you''re stuck in the terminal, and need to
    just pause your music for a moment. You can do this by using:


    ```

    $ rhythmbox-client --pause

    ```


    >_083 Find files in terminal

    You can search for specific files throughout the filesystem by using the **find**
    command. You need to give find a location to search in and a parameter to search
    for. For simply searching for a file from root with a specific name you can use:


    ```

    $ find / -name file

    ```


    >_088 Process priorities

    CPU priority for processes can be seen as running from -20 for highest priority
    or +20 for lowest. Putting **"nice -n X"** in front of any command enables you
    to change the priority from 0 to whatever number X is standing in for. Only **sudo**
    or root can elevate the priority of a process, but anyone can set one down the
    priority chain.


    >_079 Skip music

    The command line controls don''t enable as much as you can get in the interface,
    however you can at least skip to the next track. Try it with the command below.


    ```

    $ rhythmbox-client --next

    ```


    >_084 Locate files in terminal

    Similar to find is **locate**, a newer tool that works slightly differently to
    find. While find also has ways to search for files by age, size, owner and so
    on, locate only really uses the name to locate, however it can do it much faster.
    Use it with:


    ```

    $ locate file

    ```


    >_089 Download via the terminal

    If you need to download something via the Internet in the terminal, you''ll want
    to use the **wget** command. It will take any URL, you specify and download it
    directly into your current location in the terminal (as long as you have permission
    to do so). Use it like:


    ```

    $ wget http://example.com/file.zip

    ```


    >_080 Pause video

    You can use Mplayer to launch video from the command line to watch. It''s good
    for testing a video with different settings that you can affect to the video-playing
    command. What you can also do is control the playing video with keys – specifically,
    you can pause by using the space bar.


    ![](img/30dc0459712b32ede1a3814d456b41b6_13_1.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_13_2.png)


    >_085 Current location

    In the terminal you might find yourself a little lost in the filesystem, or want
    a quick and easy way to pipe your current location into something else. You can
    print out your current absolute location using **pwd**.


    >_086 Move directories

    When moving between directories you might want to be able to quickly return to
    the previous one that you were using. Instead of using **cd** for moving to the
    directory, you can instead use **pushd** to move and create a "stack" of directories
    to move between.


    >_081 More video control

    Mplayer gives you a few more controls while playing in the command line. You can
    use Enter to skip to the next item in a list, and otherwise, you can stop playback
    by using **Ctrl+C** to end the process entirely.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# >_090 Change image formats


    Instead of loading up an image editor like GIMP. you can actually change images
    in the terminal using the `convert` command. You can very simply use it to change
    the filetype or even change the size. Do it with:


    ```

    ```

    $ convert image.jpg image.png

    ```

    ```


    # >_091 Alter image settings


    As well as `convert` there’s also `mogrify`, which is part of the same software
    package. You can use it to scale, rotate and do more to an image more easily than
    with some of the `convert` commands. To resize you can use something like:


    ```

    ```

    $ mogrify -resize 640x480 image.png

    ```

    ```


    # >_092 Send message to displays


    This is an old school prank that can actually have good uses when done right.
    `Xmessage` enables you to send a message prompt to an x display on the same system,
    as long as you know the display you want to send it to. Try:


    ```

    ```

    $ DISPLAY=:0 xmessage -center “Hello World!”

    ```

    ```


    # >_093 Rename files with cp


    This is an extension of the way you can use `cp` – `cp` will copy a file and name
    it to whatever you want, so you can either copy it to another directory and give
    it a different name, or you can just copy it into the same folder with a different
    name and delete the original. This also works for renaming with `mv`.


    # >_094 Manual screenshots


    This is something we have to do during Raspberry Pi tutorials, but it works everywhere
    else. For GNOME-based desktops you can do it in the terminal by calling `gnome-screenshot`,
    in XFCE it’s `xfce-screenshot`, in LXDE it’s `scol` and so on. This will immediately
    take a screenshot of what you can see.


    # >_095 Delayed screenshots


    With the functions above, you can add delay to set up a screenshot. This is useful
    if you want to show the contents of a drop-down menu, for example. Screenshot
    tools allow you to delay by adding the `-d` option and number of seconds, eg:


    ```

    ```

    $ scrot -d 5

    ```

    ```


    # TERMINAL JOKES


    >_ Easter eggs, gags and other attempts by pattleless software engineers to be
    funny


    ![](img/30dc0459712b32ede1a3814d456b41b6_14_0.png)


    # >_096 Do the locomotion


    The story behind this is that apparently, after finding a lot of people misspelling
    the list command `ls` as `sl`, this joke program was made to particularly hammer
    home that they were indeed not using the correct command. It plays the animation
    of a steam locomotive.


    ![](img/30dc0459712b32ede1a3814d456b41b6_14_1.png)


    # >_097 What does the cow say


    A Debian trick as part of `apt-get`, `moo` is an easter egg where if you type
    `apt-get moo` and a cow asks you if you have mooed today. If you haven’t, it won’t
    moo. Then, you should immediately find a quiet room and let out a single, loud
    moo to appease the terminal cow.


    # >_098 Let it snow


    This one uses a Bash script to simulate snow in the terminal. We have added the
    file you will need to use to FileSilo.co.uk, so download it, cd to the location
    of the file and then run it. It’s completely pointless, especially in the middle
    of summer, but it can be relaxing.


    # >_099 What’s in a date


    You can actually write date into the terminal and it will print out the actual
    date according to its own internal clock for you, which is very useful. What we
    can also do in `date` is use it to create a disco/dance date that prints out an
    almost dy scopian date system.


    ![](img/30dc0459712b32ede1a3814d456b41b6_14_2.png)


    # >_100 Crystal terminal


    Our last tip is fortune. Call it to get a hint at what your day might involve.
    Hopefully it’s something inspirational to get you started. Remember though, it’s
    just a random output from a string of code. Enjoy!'
