    ![](img/30dc0459712b32ede1a3814d456b41b6_128_1.png)


    can use that will limit CPUs, focus on a specific password types and even bring
    in a list of dictionary words and common passwords. The latter is useful if you''re
    checking out someone else''s network for them. You can see more options in the
    main file.


    > “Pentoo has an excellent suite called aircrack-ng that can attempt to discover
    and break a wireless network”


    # 16 Install Pentoo


    Need a more permanent version of Pentoo that you can plug into your system at
    a moment''s notice? You can install the software to your computer with the installer,
    however it''s not quite as simple as something like Ubuntu. Click on the installer
    to start.


    ![](img/30dc0459712b32ede1a3814d456b41b6_128_2.png)


    # 17 Set hard drive


    Option one where you set the hard drive options. It''s a bit more involved as
    you directly set the boot size, swap and the storage, its recommendations can
    be good but it won''t enable you to do any advanced partitioning.


    # 18 Copy the distribution


    Working on the hard drive is the first step to the installation of Pentoo. So
    once the hard drive has been fully worked on, you will be able to perform the
    automatic install.


    Select option two and wait a while - it will unpack the files and install them
    and also ask if you would like to transfer any settings from your current setup.


    ![](img/30dc0459712b32ede1a3814d456b41b6_128_3.png)


    # 19 Configure root password


    Go to configure the system and start adding users and configuring the root password.
    Without the root password set, you could have great difficulty logging in once
    the installation has finished. Go back to the main menu, install GRUB as the bootload
    and then reboot.


    # 20 New Pentoo


    When that''s all done and dusted, you can now boot into your fresh copy of Pentoo,
    able to be used to find and diagnose issues with your own networks and the networks
    of friends and family with great efficiency. As it''s Gento, you''ll have to understand
    how portable works to start updating, but it''s very easy once you know how, and
    it doesn''t take long at all to learn. You''ll soon feel far more confident in
    the security of your network.'
