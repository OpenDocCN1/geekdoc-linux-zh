  md: '# Tips | Tricks | Hacks | Apps


    **Qt Creator**


    While we''re building this in a command line environment, you can also build it
    in the graphical Qt Creator software. It takes a bit more to get it to run in
    there, though – you''ll have to edit its `.h` sources and use a custom build command
    for it to actually start. You can look into how to do this here: bit.ly/1ivzBMS.


    **06** Set the Qt paths


    Before we can continue building WebKit, we need to set the correct paths for the
    Qt development software. We first need to set QTDIR to the location of the Qt
    installation. Do this by exporting the path with:


    ```

    $ export QTDIR=[Install directory]

    ```


    Then make sure that the Qt 5 qmake is the first in the PATH. Use the following
    to do this:


    ```

    $ export PATH=$QTDIR/bin:$PATH

    ```


    **07** Get any extra dependencies


    Depending on your development environment, we may need to add extra dependencies
    to make sure everything will run and compile correctly. Ensure that the following
    packages are installed just to be certain that the compiling goes smoothly.


    ```

    $ sudo apt-get install bison gperf flex

    libqsrlite-dev libicu-dev libxslt-dev ruby

    ```


    There may be other packages you need and you can install them as you go, but these
    seemed to be the common absent packages in our tests.


    ![](img/30dc0459712b32ede1a3814d456b41b6_123_0.png)


    **08** Start to build WebKit


    Finally, we can begin to actually build the QtWebKit source. Go to the directory
    that you''ve downloaded the WebKit source to and build it using:


    ```

    $ webkit/Tools/Scripts/build-webkit -Qt

    ```


    This will take a while, depending on your system. If there are any other errors
    or missing dependencies, it will stop and you may have to hunt down the libraries
    that it needs.


    **09** Launch a test of WebKit


    Once everything is compiled (and it will take a while depending on your system),
    you can run this very basic version of WebKit using the following:


    ```

    $ Tools/Scripts/run-launcher -Qt

    ```


    This is the QtTestBrowser, which is a very quick implementation of WebKit as a
    browser. You can look through the files to get an idea of how it uses WebKit.


    **10** WebKit use explained


    There are some basic principles to the way WebKit handles data to render. This
    is handled via the WebCore engine and is made up of specific systems: the Document
    Object Model (DOM) tree, the render tree and the style tree. These three parts
    help to render each webpage efficiently and therefore we will break them down
    and discuss them in more detail over the next few steps.


    **11** How the DOM tree works


    Each webpage is parsed into this DOM tree of nodes, all referred to as the base
    class of Node.h. Of these nodes, there are three that are relevant for actually
    rendering data: Document.h/HTMLDocument.h, which is the root of the tree; all
    of the tags from the HTML or XML are kept in Elements.h, and can be queried whenever
    you need them; finally, Text.h contains all the raw text that goes between the
    elements – in other words, the content on the page that is actually readable.


    **12** Structure of the render tree


    The rendering nodes of the render tree mostly correspond to the nodes in the DOM
    tree, albeit with a few extra objects and nodes that don''t exist in DOM. These
    are kept in RenderObject.h. The RenderObject for a DOM node can be obtained using:


    ```

    RenderObject* renderer() const

    ```


    .... which can be more usefully used as:


    ```

    RenderObject* firstChild() const;

    RenderObject* lastChild() const;

    RenderObject* previousSibling() const;

    RenderObject* nextSibling() const;

    ```


    **13** Create the render tree


    Renderers are created when a DOM node is attached to a renderer. The information
    in the node will determine what kind of renderer to use, including not creating
    it if certain conditions are met. It''s a top-down recursive operation – all descendants
    have renderer nodes created after their parents. You can call the attach method
    with:


    ```

    void attach()

    ```


    .... on the DOM nodes to begin the rendering process and get it fully underway.


    **14** Destroy the render tree


    This is related to creating render trees by calling the opposite command, detaching
    DOM nodes from the renderer:


    ```

    void detach()

    ```


    This destroys the render tree when a tab or window is closed, and ends the need
    to see the info present in the DOM tree.'
