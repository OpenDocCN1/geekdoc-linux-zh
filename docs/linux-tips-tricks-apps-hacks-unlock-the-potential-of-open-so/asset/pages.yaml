- pgno: 130
  md: '# Tips | Tricks | Hacks | Apps


    # From package to repository


    If you decide to build your own packages, you may want to organise them into local
    repositories to use with a graphical software management tool. In the case of
    Ubuntu/Debian and their derivatives, you must complete four steps. First, install
    the dpkg-dev package. Next, put your .deb files into a directory of your choice.
    Then you will need a script to scan that directory and create/ maintain repository
    index files; it can be as simple as:


    ```

    #!/bin/bash

    cd /path/to/debs

    dpkg-scanpackages . ./dev/null | gzip -5c > Packages.gz

    ```


    Finally add a line to your /etc/apt/sources.list pointing at your repository.
    The line will look like this:


    ```

    deb file:///path/to/debs ./

    ```


    In Fedora/CentOS and various derivatives you’ll need to create a repo with your
    RPM files. Start by installing the createrepo package (yum install createrepo)
    and then create repository metadata in the directory containing your RPM files:


    ```

    createrepo /path/to/rpms & chmod -R o+wrx /path/to/rpms

    ```


    After that, create a .repo file in the /etc/yum.repos.d/ directory. The contents
    of the file should comply with the simple template shown below:


    ```

    [local]

    name=your distribution-release server - local packages for $basearch

    baseurl=file:///path/to/rpms

    enabled=1

    gpgcheck=0

    protect=0

    ```


    Yum repositories are also supported in OpenSUSE/Suse Linux Enterprise Desktop
    as well, and you can add them either with the YaST GUI software or via the command
    line using zypper like this:


    ```

    zypper addrepo -t YMP /path/to/rpms

    It’s really simple to create your own packages once you know how!

    ```


    # 01 Why you may need to do it


    Let us first list some common cases where packing your files into a package is
    preferred. To start with, your distribution may lack some packaged application
    that you need, so you may try to build it from scratch (the hard way) or adapt
    a similar package from another distribution (generally, the preferred way). Next,
    not all software is open source, so you may pack a binary-only application or
    even a set of random files and make them installable with a few clicks of your
    mouse. This is often needed to deliver some proprietary, yet popular, software
    items such as the Vivaldi browser or Skype VoIP application.


    ![](img/30dc0459712b32ede1a3814d456b41b6_130_0.png)


    # 02 The inside of RPM


    When you double-click an RPM file it will probably be opened in a software installing
    tool, but you can always open it as an ordinary archive. File Roller or Ark will
    open an RPM just the same way as they would open a ZIP archive. However, while
    you’ll see the file tree, there’s more to RPM as it includes scripts that enable
    extra actions with files, such as fixing permissions, copying and moving files,
    or any other custom action in Bash.


    Whatever architecture an RPM file is designed for, be it x86, 64, i586 or noarch,
    it is generated from a source RPM, also known as SRPM. It contains the sources
    of the application and a spec file, which defines all the commands and routines
    that you will need to compile it into the target RPM file. If you need to re-pack
    a proprietary application, sometimes only a properly written spec file is required,
    as it obtains the app files automatically.


    ```

    rpm -i /tmp/mypackage-1.0.8-l.src.rpm

    ```


    …and then address the spec file directly:


    ```

    cd */rpmbuild/SPECS && rpmbuild -ba mypackage.spec

    ```


    Take note that all commands should be issued under a regular user account and
    not root, due to security reasons. To make things work, you’ll need the rpmbuild
    package and all development libraries and compilers required to build the sources
    of your application. If you’re recompiling something that is already present in
    your system’s repositories, you may try zypper si -d mypackage in OpenSUSE, urpmi
    --builddir mypackage in OpenMandriva/Mageia, or yum-builddep mypackage in Fedora.


    The contents of the src.rpm file is unpacked into the rpmbuild directory in your
    home folder (~). The standard tree of an RPM package resides here, and a full
    set of subdirectories: build, buildroot, rpms, source, specs, srpms.


    # 03 Compile RPM from a source RPM


    For the impatient, the command is simply: rpmbuild --rebuild /tmp/mypackage-1.0.8-l.src.rpm.
    Another way is to install the source package as follows:


    # Left Both DEB and RPM packages are easy to unpack and explore. You can always
    pull out their contents with standard archive managers too


    # Alien vs DEB/RPM


    Alien is a tool that converts a Debian package into an RPM and vice versa. It
    works great for many niche and binary-only packages. To convert a DEB to RPM,
    use the following:


    ```

    alien --rc /path/to/mypackage.deb

    ```


    The reversed action is even simpler:


    ```

    alien /path/to/mypackage.rpm

    ```'
  merge: -1
