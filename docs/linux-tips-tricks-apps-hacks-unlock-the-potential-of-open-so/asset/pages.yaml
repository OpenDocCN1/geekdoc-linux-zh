  md: '# SECURITY RESOURCES


    Keep up to date on security concerns and learn more ways to keep your accounts
    safe


    # Privacy Fix  privacyfix.com


    As we mentioned earlier in the article, defending against a brute force attack
    is only one method in keeping everything secure. Hackers and crackers may also
    try social manipulation via telephone or email to get your information from banks
    and account support teams. You can minimise this risk significantly by keeping
    more of your information private.


    Privacy Fix from AVG helps you monitor your different social accounts to figure
    out exactly what people can see and how easily they can see it. It allows you
    to plug holes in your accounts and tighten up your privacy and security in general.


    The applications work across multiple platforms, so you can keep control of these
    concerns on the go via mobile if something needs to be changed immediately. It
    covers Twitter, Facebook, Google+, LinkedIn and many other account types.


    ![](img/30dc0459712b32ede1a3814d456b41b6_106_0.png)


    Above PrivacyFix rounds up your online accounts into a single dashboard


    # Linux Security  linuxsecurity.com


    Linux Security is a news aggregate for anything related to security in Linux.
    Not only does it cover vulnerabilities, bugs in security software and other desktop
    and server security concerns, it also covers web security and think pieces that
    will keep you informed on the latest security stories.


    Keeping up with relevant issues in the security world can keep you ahead of the
    game and enable you to lock down anything before a threat becomes viable. It''s
    not absolutely necessary for everyone, but even those slightly interested in keeping
    secure would do well to keep up with some of the current trends.


    There are also some other resources on the site, such as a security glossary for
    some of the more obscure terms and general security tips that anyone can use.


    ![](img/30dc0459712b32ede1a3814d456b41b6_106_1.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_106_2.png)


    Above Linux Security is a news aggregate for anything related to Linux


    # Random.org  random.org/passwords


    Coming up with a password or password base can be difficult. While we have the
    example in this issue, we implore you not to use it. However, if you''re having
    trouble coming up with your own base, or want a completely random and secure password
    for your email accounts, there are lots of websites that will enable you to securely
    and anonymously generate passwords that you could then slightly modify and use
    yourself.


    Random.org is such a website, where you can create a list of passwords of varying
    character length that are all very secure. Nothing is stored on their servers
    and all passwords are sent securely via SSL. The random algorithm uses ambient
    noise to create the password, which makes it slightly more difficult to decrypt
    using high-level cryptographic techniques.


    ![](img/30dc0459712b32ede1a3814d456b41b6_106_3.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_106_4.png)


    Above Random.org comes up with highly secure passwords'
