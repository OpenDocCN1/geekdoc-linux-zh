- pgno: 72
  md: '# 01 Install LaTeX


    First you need to install LaTeX. There is a plethora of packages out in the wild
    that contain the name LaTeX, so running `apt-cache search latex` will return a
    lot of output. You can get a more helpful output by simply executing the following
    command:


    ```

    ```

    $ apt-cache search latex | grep ''latex''

    ```


    ```


    Your journey to using LaTeX will start by running the following command:


    ```

    ```

    $ sudo apt-get install latex209-base latex209-bin

    ```


    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_72_0.png)


    # 02 Use LaTeX


    After installing the basic LaTeX packages you should try to compile the consequent
    LaTeX code to make sure that everything works exactly as you expected:


    ```

    ```

    \documentclass{article}

    \title{The LaTeX version of the Hello World program}

    \author{Mathias ToukaLos}

    \date{January 2015}

    \begin{document}

    \maketitle

    Hello world!

    \end{document}

    ```


    ```


    You can compile the document using the following command:


    ```

    ```

    $ latexmk helloworld.tex

    ```


    ```


    The previous command produces a DVI file that you can convert into PDF format
    as follows:


    ```

    ```

    $ dvipdf helloworld.dvi

    ```


    ```


    If you view the generated file you can easily understand that the default LaTeX
    styles produce high quality output. The problem is that if everyone is using the
    default styles, all books produced using LaTeX will look exactly the same!


    ![](img/30dc0459712b32ede1a3814d456b41b6_72_1.png)


    # 03 Pros and cons


    LaTeX has its advantages. It comes with many default styles and if they are sufficient
    for you, then start writing immediately! It''s also fast to type and edit text,
    so you can use traditional UNIX tools to make changes to your LaTeX code. As a
    consequence, you don''t need a very fast computer to run LaTeX. Additionally,
    LaTeX files are easily interchangable between different platforms. One of its
    biggest advantages is that the output looks highly professional because LaTeX
    is a protocol. However, you do have to compile the LaTeX code to see its output,
    and LaTeX needs time and experimentation to set up and change the default document
    styles, which can be annoying.


    # 04 Install the latexmk Perl script


    This command installs a highly recommended Perl script to improve the whole book-building
    process:


    ```

    ```

    $ sudo apt-get install latexmk

    ```


    ```


    From now on you can translate your LaTeX code into PDF format using the following
    command:


    ```

    ```

    $ latexmk -pdf book.tex

    ```


    ```


    Most of the packages you will need are installed by default. Installing a new
    LaTeX package can be tricky - the best thing to do is read the documentation and
    follow the instructions before trying to install it. For this tutorial it''s also
    worth installing the texlive-full, texlive-math-extra, texlive-extra-utils, texlive-generic-extra
    and texlive-latex-extra packages.


    # 05 Organise the files


    It''s time to start organising the files for a more simplified process. The name
    of the core LaTeX file will be book.tex. Instead of using a big and unmanageable
    LaTeX file, you can make it more observable and put the book chapters and the
    appendices in separate files using the `include` LaTeX command:


    ```

    ```

    \include{ch1}

    \include{apa}

    ```


    ```


    Here, LaTeX will search for files named ch1.tex and apa.tex. The name of the core
    LaTeX file will be book.tex. This is the most important task of the whole process
    because it allows you to edit smaller and more manageable files.


    We will use our examples and two appendices in order to make our example book,
    but you can use more or less pages on future projects if you wish. After creating
    the files for all the book chapters and appendices, and referencing them inside
    book.tex, you are completely ready to start adding content.


    # 04 Install the LaTeX Perl script'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Tips | Tricks | Hacks | Apps


    # 06 Create a bibliography


    LaTeX offers BibTeX for dealing with bibliographic references. All BibTeX entries
    will be located in a file called booklist.bib. Each BibTeX entry has the following
    format:


    ```

    @book{Kernighan84,

    author = {Brian W. Kernighan and Robert Pike},

    title = {The UNIX Programming Environment},

    year = {1984},

    isbn = {013937681X},

    publisher = {Prentice Hall Professional Technical Reference},

    }

    ```


    The following LaTeX commands are used for beautifying and inserting the bibliography
    into this project:


    ```

    \bibliographystyle{alpha}

    \addcontentsline{toc}{chapter}{Bibliography}

    \bibliography{booklist}

    ```


    You can add a reference to the Kernighan84 book in your LaTeX code as follows:


    ```

    \cite{Kernighan84}

    ```


    # 07 Sort content


    You can LaTeX to sort and organise content more easily. LaTeX generates pages
    with table of contents, list of figures and list of tables. You can create your
    own table of contents (TOC) using this command:


    ```

    \tableofcontents

    ```


    If you only want to include entries for chapters and sections, include the next
    command before the previous command in Step 6:


    ```

    \setcounter{tocdepth}{1}

    ```


    In order to include the list of figures you might have in your book you can do
    so by inserting the following command:


    ```

    \listoffigures

    ```


    If you have tables in your book, you can generate the list of tables as follows:


    ```

    \listoftables

    ```


    You can now use the MyCode style inside LaTeX using the following command:


    ```

    \begin{MyCode}[fontsize=\relsize{-1}]

    \#include <stdio.h>

    int main (int argc, const char * argv[])

    {

    printf("Hello, World!\n");

    return 0;

    }

    \end{MyCode}

    ```


    If you change the \relsize value from -1 to +1, the code size is going to get
    bigger.


    # 08 Mini table of contents


    If your book chapters are on the large side you may need to add a mini table of
    contents at the beginning of each chapter. There is a LaTeX package called minitoc
    that does the job. The next LaTeX code adds support for the mini TOC functionality.


    ```

    \usepackage{minitoc}

    \setcounter{minitocdepth}{1}

    ```


    The previous commands should be combined with the\dminitoc command that must be
    used once to turn on the mini TOC functionality. Finally, type minitoc at the
    beginning of each chapter to actually add the mini table of contents.


    # 09 Format code


    The book is going to contain multiple blocks of code to showcase certain techniques,
    therefore the code must be well formatted. Using the following LaTeX code you
    can define a new style called MyCode for formatting code:


    ```

    \usepackage{relsize, color, fancyvrb}

    \DefineVerbatimEnvironment{MyCode}

    \verbbatim}

    (numberbars=left, framerule=0.8pt, rulecolor=color{blue}, framesep=4mm)

    ```


    Creating a style saves you time. Additionally, if you want to make a global change
    to the output format of code in your book, all you have to do is go to its definition,
    make the changes and recompile the book. Also, if you want to create a new style
    similar to an existing one, you can copy and paste the existing style definition
    code, choose a different name and make the modifications you want.


    # 10 Include a header and footer


    The following LaTeX code changes the header and the footer of each book page.
    Right pages (RO) have a different rule to left pages (LE). It’s also worth noting
    that the first page of each chapter (CO) has another rule that puts the page number
    at the footer of it without adding any header information.


    ```

    \renewcommand{\headrule}{%

    \color{gray}0.5} \hrule height 1pt width\headwidth vspace{-4pt}%


    \fancypage{RO}{%

    \bfseries\Large{\thesection\ {\textbar\ \LARGE\thepage\normalsize\ {\textbar


    \fancypage{LE}{%

    \bfseries\textbar\LARGE\thepage\normalsize}\ {\textbar\ \Lefthook


    \fancypage{LE}{%

    \bfseries\LARGE{\thesection}\ {\textbar\ \Lefthook


    \fancypage{LE}{%

    \bfseries\LARGE{\thesection}\ {\textbar\ \Lefthook

    ```


    ```

    \fancypage{plain}{%

    \fancyhf

    \fancyfoot{CO}{%

    \bfseries\LARGE\thepage

    }

    \renewcommand{\headrulewidth}{0pt}%

    \listoftables

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# **12 Generate an index**


    The following command helps you create a book index:


    ```

    \usepackage{makeidx}

    ```


    The next \LaTeX{} command puts the index information into the generated file:


    ```

    \printindex

    ```


    This code adds the word Knuth to the index:


    ```

    \index{Knuth}

    ```


    # **13 Add tables**


    This code produces an elegant table to blend in with the rest of the book.


    ```

    \begin{table}[t]\\\n\centering\\\n\setlength{\extrarowheight}{2.5pt}\\\n\setlength{\extrarowheight}{2.5pt}\\\n\begin{tabular}{ccc}\\\n\hline\\\n\addlinespace\\\n\textbf{Name}
    & \textbf{Size in Kbytes} &\\\n\textbf{\# of files} & \textbf{\# of keys in Info.plist}
    \\ \addlinespace\\\nAmazonsearch.wdgt & 144 & 8 & 13 \\\\

    Tags - HTML.wdgt & 88 & 17 & 11 \\\\

    Temperature Monitor.wdgt & 416 & 50 & 10 \\\\

    Wikipedia.wdgt & 696 & 125 & 12 \\\\

    \addlinespace\\\n\hline\\\n\end{tabular}\\\n\caption{Statistical Information.}\\\n\label{ch9:stats}\\\n\end{table}

    ```


    # **14 Some other useful info**


    Producing a more fancy and professional chapter heading can be done easily using
    the fancyhdr package:


    ```

    \usepackage[bjornstrup]{fancyhap}

    ```


    # **15 Work with the NOTE style**


    Before talking about the NOTE style you should first download the picins.style
    file and put it where your \LaTeX{} files are:


    ```

    $ wget http://tug.ctan.org/ tex-archive/macrocs/latex209/contrib/picins/picins.sty

    ```


    The NOTE style can be defined as follows:


    ```

    \usepackage{picins}\\\n\usepackage{amsmth}\\\n\newcommand{\NOTE}{\llength{1mm}\parspice{14mm,5mm}{sl1[NOTE]\noindent}

    ```


    You can now add a note as follows:


    ```

    \NOTE{A small note doesn''t look very elegant}

    ```


    The only drawback of the style is that it needs to have at least two lines of
    text to look pleasant on the page.


    # **16 How it worked**


    Our example book was built step-by-step: a minimal book file was generated first,
    then chapter and appendix files without any data were added to the project.


    At this point it was time for us to write the book by adding text, images, tables,
    bibliogrophy and index entries, while experimenting with the look of the existing
    \LaTeX{} styles, making changes to them, adding new ones and correcting errors.


    This is definitely the safest procedure to follow when writing your own book while
    using \LaTeX{} - \LaTeX{} was able to process all the files, without any difficulties.
    So go on and make your own creation!


    ![](img/30dc0459712b32ede1a3814d456b41b6_74_0.png)


