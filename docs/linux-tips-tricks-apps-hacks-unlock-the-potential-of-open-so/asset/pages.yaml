    # opensUSE 13.2


    A look at the release candidate for openSUSE''s 13.2, the next step in the Linux
    distribution for everyone to use


    # Pros


    This version looks a lot nicer and generally is much nicer, being right back on
    track for openSUSE


    # Cons


    Not as easy to use as others for newcomers, and focus on aesthetics may have taken
    away from tech


    After a year of more focused polishing under new guidelines, OpenSUSE 13.2 is
    set to be the most advanced and best looking version of the distro yet. OpenSUSE
    has always been one of the most unique distros on the market that has maintained
    popularity for some time now. Of course, as a testing platform for the technology
    that will eventually find its way to enterprise SUSE, it does have that link to
    Fedora. However, openSUSE tends to test these at the discretion of SUSE, and is
    mostly its own independent distro. Also, like Fedora, it concentrates on using
    only purely free and open source software (FOSS) in its repositories. That''s
    where any kind of minor similarities end though, as the way openSUSE


    works and functions is different still. That''s not to say it''s a completely
    alien experience.


    It still uses some of the standard desktop environments that come with other Linux
    distros so you should be fine making your way around the distro. The main difference
    is the way it handles package management, geared more towards developing, and
    a unique way of installing via web. There''s also an all-encompassing settings
    menu that goes deeper than almost all other graphical setting interfaces.


    # One-click installing


    This interface, known as YaST, is one of the many ways you can go about installing
    packages in'
