- pgno: 105
  md: '# # OFFLINE SECURITY

    Keep your desktop and

    other offline devices secure

    from prying fingers


    **Online security and protection from online attacks are excellent deterrents
    for a large subsection of people, but for a point of access – your PC – should
    be secure as well unless you want to have people snooping around your computer.**


    As before, a secure password is essential for your user account. It’s far harder
    to brute-force this kind of password, but it’s still doable. Weigh up the importance
    of your files versus your own convenience to come up with a password that suits
    your needs, but still use the password creation tips to keep it as secure as possible.


    The root password shouldn’t be the same as a normal user password. Much like we
    suggested with emails, you should most certainly have a completely separate password
    for the root account. While logged in as root (su in the terminal) type ‘passwd’
    and it will allow you to update and change your current root password.


    Some systems will also allow users to gain root access via ‘sudo su’, using sudoer
    privileges to just get into the root. If you’re serious about locking down your
    system then a big priority should be to modify, disable access on all accounts
    on your system that can make use of it, especially for that particular use case.


    ![](img/30dc0459712b32ede1a3814d456b41b6_105_0.png)


    **Malware**


    Linux distros are generally far more secure than other operating systems, but
    they’re not immune to viruses and malware. In terms of security, keyloggers and
    other snooping software can be a big issue – these will help anyone figure out
    your passwords, making even the most random 12-character monstrosities pointless
    when it can just be copied and pasted directly into the password field.


    Aside from ClamAV, there’s no real anti-malware software for Linux available;
    the best thing you can do is just stay vigilant. Use a little common sense when
    on the Internet and check your logs and running services frequently to make sure
    nothing malicious has installed itself.


    **Protect your files**


    Even with a good password, someone can just mount your hard drive or a user with
    higher privileges can easily read it. Encrypting a volume to specifically keep
    sensitive data in is a great way to make sure only you can access the files when
    you need to. Since TrueCrypt has become defunct, and was never really open source
    in the first place, we highly recommend using EncFS.


    It’s available in a few repos as encfs, so installing it is not really a problem.


    ![](img/30dc0459712b32ede1a3814d456b41b6_105_1.png)


    **Once that’s done, you can then begin setting up an encrypted location on your
    system. Open the terminal and then type:**


    This will create a folder called ‘encrypted’ in your home directory that contains
    all the encrypted files, and then another folder called ‘private’ which is where
    the files will be accessible once decrypted. Follow through with the little wizard
    that follows – the pre-configured security mode is very good and good enough for
    most people.


    Now, when Private is mounted and you have entered a password, you’ll be able to
    access the encrypted files straight from the encrypted folder. When it’s unmounted,
    the files will become encrypted again: just remember to unmount after use.


    ```

    ```

    $ encfs ~/encrypted ~/Private

    ```

    ```


    **KEEPASS X**


    While LastPass is a password manager for your online accounts, KeePass X is a
    password manager for the apps and software on your system. Not only does it keep
    your systemwide passwords more secure, it also allows you to encrypt information
    such as URLs, user names, attachments and clipboard items if needed. It has a
    smart database that you can search as long as you have the right password, otherwise
    it’s completely encrypted. It’s currently in Alpha release stage for version 2.0,
    but a lot of Linux users are already integrating it into their system and workflow
    due to its quality.'
