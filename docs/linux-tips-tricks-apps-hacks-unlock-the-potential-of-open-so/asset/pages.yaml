    # elementary OS 0.3 Freya


    Over 1,100 improvements make Freya the biggest elementary OS update yet


    +   - CPU

    +   - 1 GHz

    +   - RAM

    +   - 1 GB

    +   - Storage

    +   - 15 GB


    Elementary OS has continued to impress in the four years since its first release
    and almost two years since Luna, its last major update at version 0.2.

    The developers claim over three million downloads and elementary OS has remained
    in the top ten most searched-for distros for the last year, with a strong community
    continuing to build behind this enduringly popular distro. Freya, based on Linux
    3.16 and the Ubuntu 14.04 LTS, brings a host of visual changes that are largely
    based around improvements and additions to Pantheon, the Ubuntu-based operating
    system’s desktop environment that replaces Unity.

    Much of the change is in the smaller details, with work being done on things like
    the rounded corners of dialogs and the lights and shadows of panels, reducing
    glass tones for a more matte look, and also in the


    context-sensitive header bar that adapts its colour and transparency depending
    on what you have open in order to be non-intrusive. Screenshot, the application
    menu, has also been improved with the capability for simple calculations in the
    search bar and the ability to drag-and-drop app icons from your searches.

    One of the biggest changes is the redesigned multitasking screen, which now has
    (like many aspects of elementary OS’s design) an even more GNOME 3 or OS X feel
    to it. It’s now right up front in the dock and as well as select and close your
    open applications, you can also switch to different workspaces using the buttons
    along the bottom – this entirely replaces the workspace switcher that used to
    push up from beneath your dock, making for a much tidier solution (though you
    can still use your hot corners for switching workspaces).'
