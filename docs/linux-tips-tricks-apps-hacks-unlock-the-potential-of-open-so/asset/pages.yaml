- pgno: 24
  md: "# EXPAND YOUR WEB SERVER\n\nTailor your web server to suit all of your individual\
    \ needs\n\n![](img/30dc0459712b32ede1a3814d456b41b6_24_0.png)\n\n# Mail server\n\
    \nPart of the benefits of this being a web server is that it enables you to also\
    \ add your own mail server to it, or even host your own webmail client as well.\
    \ Having Apache configured is the first step to this, and it is quite straightforward\
    \ to then set up a mail server on top of that.\n\nAs for a webmail client, we\
    \ recommend using RainLoop, which looks nice and modern and also lets you add\
    \ other webmail services to it, along with your own webmail server.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_24_1.png)\n\
    \n# Nginx server\n\nInstead of using Apache for the server, you can also look\
    \ into and try out Nginx. Nginx handles processes slightly differently than Apache\
    \ and can result in a lighter load on your web server. It’s available in the repos\
    \ of most distros, much like Apache is, so it can be installed in mostly the same\
    \ way.\n\nFor a more complete guide to setting up an Nginx server, you can always\
    \ refer back to one of our tutorials from Mithals – it’s inside issue 144, if\
    \ you have it to hand, and on our website: bit.ly/1AYKx88.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_24_2.png)\n\
    \n**06 Local use**  \nWhile it will be great to access these files externally,\
    \ we might as well have it so you can access the FTP internally too, just in case\
    \ you prefer that to a shared folder. Find the line ‘local_enable’ and change\
    \ it to YES to make sure it’s accessible elsewhere.\n\n**07 Edit files**  \nAs\
    \ we are only letting people we want onto the server, we can make it so anyone\
    \ logged in has write access. To do this, go back into the config file, look for\
    \ the line with ‘write_enable’ and change it to YES. You may also need to uncomment\
    \ it by removing the hash.\n\n**08 FTP Folder**  \nIf you didn’t create a shared\
    \ folder for the previous server tutorial, now is a good time to create a dedicated\
    \ directory for this. In the home folder, use mkdir to create a directory called\
    \ whatever you wish for the FTP server to be able to access it.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_24_3.png)\n\
    \n**09 Restart server**  \nOnce the config file has been fully edited and the\
    \ folder is created, it is now time to start using it. Restart the FTP server\
    \ using **sudo service vsftpd restart** and you will start to be able to access\
    \ the folder. Any changes that you make to the configuration will require this\
    \ restart to become active."
  merge: -1
