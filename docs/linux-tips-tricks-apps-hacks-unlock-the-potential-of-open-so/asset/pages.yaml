  md: "# **Tips** | **Tricks** | **Hacks** | **Apps**\n\ninside Qt Creator and then\
    \ make sure that you keep your console window open. You can now check its functionality\
    \ by opening a terminal window and entering *netstat* –*tnlp*, and the *ImaginelTCPServer*\
    \ will show up. Open a second session of Qt Creator in order to develop the client.\
    \ Create another Qt Console Application named *ImaginelTCPClient* and modify its\
    \ .pro file to enable networking as outlined above.\n\n> > “At first, using TCP/IP\
    \ to connect the processes sounds like overkill, but many programs are implemented\
    \ in this fashion”\n\nConnecting to servers requires the use of a *QTcpSocket*.\
    \ Its most basic implementation is *make* up of but two lines:\n\n```\nQTcpSocket\
    \ *mySocket;\nint main(int argc, char *argv[]) {\n    QCoreApplication (e.arg,\
    \ argv);\n    mySocket=new QTcpSocket();\n    mySocket->connectToHost(QHostAddress\n\
    \    ::LocalHost, 1025);\n    return e.exec();\n}\n```\n\n*ConnectToHost()* is\
    \ another asynchronous method which takes two parameters. The first one designates\
    \ the IP to use, while the second specifies the port. Successful connections will\
    \ be indicated by the emission of a signal which we will handle in the next step.\
    \ For now, a running instance of *ImaginelTCPServer* will display a connection\
    \ attempted message when our client is started.\n\nAt the first glance, using\
    \ TCP/IP to connect two processes on the same machine sounds like overkill. However,\
    \ many programs are implemented in this fashion – handling inter-process communication\
    \ via sockets provides a safe and simple way to de-couple components from one\
    \ another.\n\n# **Streams of data**\n\nReal network applications exchange data,\
    \ which is accomplished by using the data streams embedded into the socket instances.\
    \ First, modify the constructor of *ImaginelListenerClass* to provide the *myServer*\
    \ instance to the method responsible for handling the *newConnection* signal.\
    \ Then adjust its body as per Fig. 01.\n\n*QTcpServer* can happily handle multiple\
    \ pending connections at the same time. *NextPendingConnection* returns a socket\
    \ representing the connection to the selected client. We’ll wire its *disconnected*\
    \ signal to the *deleteLater* slot to ensure unneeded sockets will be eliminated\
    \ automatically. In the next step a byte array is populated and sent to the client.\n\
    \nQt’s underlying *DataStream* class gets improved as the framework evolves. Specifying\
    \ a data format ensures that binaries built with later versions of Qt can interpret\
    \ the data provided in the socket. Many applications use Qt 4.0’s format. If your\
    \ program is limited to Qt 5 and above due to other dependencies, you can also\
    \ define this version as baseline.\n\nThe next step involves modifications to\
    \ the client. Insert a class similar to the *ImaginelListener* to handle the signals\
    \ emitted from the socket class. Our application has to deal with three events\
    \ – we need to notify the user of successful and failed connections and must receive\
    \ data sent from the server.\n\nStatus messages are handled by emitting the corresponding\
    \ statements to the console via *qDebug()* (see Fig. 02).\n\nReceiving data is\
    \ more complex. Our simple protocol doesn’t inform the client in advance about\
    \ how much data is to be transmitted. Due to that, we simply read whatever amount\
    \ of data has been received:\n\n```\nvoid ImaginelReceiver::dataReady()\n{\n \
    \   QDataStream in(mySocket);\n    in.setVersion(QDataStream::Qt_4_0);\n    QString\
    \ thatSt;\n    in >> thatSt;\n    qDebug() << thatSt;\n}\n```\n\nEach of the slots\
    \ must be connected to the socket. This should be done before the *connectToHost*\
    \ method is invoked. On some operating systems the *connected* signal is emitted\
    \ before *connectToHost* returns (Fig. 09).\n\nRun the program in its current\
    \ state to display the greeting message from the server – it will show up in the\
    \ client’s window. *ErrorOccurred* will be invoked to inform our program that\
    \ the server terminated its connection.\n\n# **Further interaction**\n\nOur server\
    \ currently kicks out clients after providing them with a friendly greeting message.\
    \ A polite server would stick around and wait for a response. Even though we could\
    \ keep the sockets in our current example, this would lead to issues once more\
    \ than one client is connected – we connect all signals to one slot which makes\
    \ keeping the different connections apart difficult.\n\nA thread is a convenient\
    \ solution for this problem. Threads are subroutines that run in parallel to the\
    \ main application code – spawning threads permits your code to do multiple things\
    \ at the same time. Adding a thread is as easy as adding a new class whose header\
    \ looks like this:\n\n```\nclass ImaginelThread:public QThread\n{\n    Q_OBJECT\n\
    public:\n    ImaginelThread(QTcpSocket* _aSocket);\n    void run();\npublic:\n\
    \    QTcpSocket* mySocket;\n};\n```\n\nThe actual payload can be found in the\
    \ *run()* method which will be executed in the background after the thread was\
    \ spawned:\n\n```\nvoid ImaginelThread::run()\n{\n    exec(); //Start event loop\n\
    }\nvoid ImaginelThread::dataReady()\n{\n    QDataStream in(mySocket);\n    in.setVersion(QDataStream::Qt_4_0);\n\
    \    QString thatSt;\n    in >> thatSt;\n    qDebug() << thatSt;\n    exit();\n\
    }\n```\n\n*ImaginelThreads* sole role involves staying until a signal is emitted.\
    \ We accomplish that by invoking the *exec()* method which creates an event loop.\
    \ It keeps idling until it is called from the *dataReady* handler.\n\nOur server\
    \ must be modified in order to start the thread when a new client connects (Fig.\
    \ 04).A classic beginner’s mistake involves"
