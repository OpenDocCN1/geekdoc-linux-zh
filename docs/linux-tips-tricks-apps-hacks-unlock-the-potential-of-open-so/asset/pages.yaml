- pgno: 129
  md: '# Build your own DEB

    and RPM packages


    Replace your ‘make install’ habit and learn how to


    deliver Linux software like a pro


    **If you count the most prominent and well-known Linux

    distributions, you’ll notice that nearly all of them utilise

    two software package types: DEB and RPM.** The first one

    comes from the world of Debian and spreads on Ubuntu and

    dozens of its derivatives, while the RPM, originally created

    for Red Hat, is used in Fedora, Mageia, OpenSUSE and many

    others. Both worlds share the same approach: every file in a

    system must belong to a package, so the whole installation is

    a collection of binary packages.


    Maybe you’re already familiar with building Linux

    applications from source, or you just want to deliver a custom

    set of files or a binary app in the ‘right’ way – neat, clean and

    convenient. In this tutorial we will find out what it takes to

    create a custom DEB or RPM package and the ways in which

    you can benefit from maintaining everything in your system

    by using packages.


    The tutorial naturally breaks into two parts, as Debian

    and Red Hat packaging systems are different and therefore

    require learning different sets of commands. However, as

    you will see a bit later, the procedure is really straightforward

    and easy to follow once you have got your head around just a

    few basic examples.


    # Resources


    Access to

    your distro’s

    official

    repositories


    ![](img/30dc0459712b32ede1a3814d456b41b6_129_0.png)


    Right The spec file

    has an easy-to-

    read structure and

    a lot of system-

    wide macros, which

    you are advised

    to learn'
