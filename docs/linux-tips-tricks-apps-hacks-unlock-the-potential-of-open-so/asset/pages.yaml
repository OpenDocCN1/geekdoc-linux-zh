  md: '# BEST DISTRO FOR...


    # Development


    With Linux proving a popular platform for development work, which is the best
    of the bunch for getting your code on?


    # Arch Linux


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_0.png)


    Arch has never been a distribution to **parlor to the common denominator**. While
    its contemporaries add user-friendly wizards and hand-holding installation packages,
    Arch marks the newcomer to a concise session and leaves them adrift with little
    more than a Wiki page for company. For beginners, simply getting Arch installed
    can seem like a major achievement – but beginners are most certainly not Arch''s
    target market.


    Once it''s installed, Arch reveals its true potential. It allows the more technical
    user to install only the packages required for day-to-day work for guaranteed
    zero bloat, with all the benefits to performance, stability and your ability to
    concentrate that this implies. Tweaking your Arch install can become obsessive,
    but once it''s set up to your liking you can expect a smooth ride.


    Arch is certainly not a distribution for beginners, but those with Linux experience
    will find plenty to like about it. It has an active community, albeit one which
    can be unwelcoming to beginners, boasts a great package selection for even some
    of the more esoteric tools in a developer''s arsenal, and promises to provide
    an easily-customised environment tailored specifically to your individual needs.


    A rolling-release development methodology means that while installation may be
    painful it''s a one-off experience, and users are guaranteed to be working on
    the latest available tools and resources. There''s a good reason Arch and its
    derivatives are popular among Linux kernel developers as well as those who write
    software for other platforms.


    Finally, Arch has an ace up its sleeve for those targeting Arch itself with their
    creations: the Arch Build System. Designed specifically for Linux developers,
    the ABS offers the ability to create, customise and distribute packages into Arch
    which are built directly from source. Based heavily on the BSD ports system, ABS
    offers automation for tasks other distributions require developers to perform
    by hand.


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_1.png)


    You can install just the tools you need for zero bloat


    # ALTERNATIVE DISTROS


    # CrunchBang


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_2.png)


    A Debian-overlay. CrunchBang uses the lightweight Openbox window manager in the
    as distraction-free as possible and offers a good balance between the performance
    and flexibility of Arch and the set-and-forget nature of Ubuntu.


    # Gentoo


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_3.png)


    Like Arch, Gentoo features a BSD ports-like package management system dubbed Portage,
    and a release system meaning users install the latest package from Git or source
    with per-distro options.


    # Ubuntu


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_4.png)


    Often adored for its out-of-the-box treatment of the wider open source community,
    Ubuntu non-defaults promises wide out-of-the-box support and convenient package
    tools.


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_5.png)


    # BEST FOSS


    # Eclipse


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_6.png)


    It might lack compatibility with the GNU General Public Licence, but the Eclipse
    Public Licensed Eclipse IDE is a powerful tool. Based on IBM''s Visual Age, it
    supports most common programming languages you''ll be working with.


    # VirtualBox


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_7.png)


    While the GPL-licensed VirtualBox OSE build only provides virtualised USB 1.1
    support, its other features make it a great way to run alternative operating systems
    on top of userspace Linux. Ideal for testing your code on other platforms.


    # Git


    ![](img/30dc0459712b32ede1a3814d456b41b6_139_8.png)


    Born of a copyright confusion that surrounded SVN''s distributed version control
    system of choice for kernel developers. It allows for easy collaborative working
    with plenty of ways to track bugs added in later code revisions.


    # Vim/EMACS


    Did you really think we were going to get involved in this debate? A good text
    editor is the programmer''s best tool, but we''re staying on the fence with this
    one. Whether you''re an acolyte of Stallman and Steele or a devotee of Moolenaar,
    use whichever of these works for you.


    # GNU Debugger


    The standard debugger for GNU/Linux, GDB''s capabilities extend beyond the obvious
    with support for programming languages ranging from Free Pascal and Ada through
    to Objective-C and Java. We recommend giving it a try.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# BEST DISTRO FOR... Enterprise


    For companies, Linux can significantly reduce the total cost of IT infrastructure,
    but which distribution stands out?


    # SUSE Linux Enterprise Desktop/Server


    When it comes to desktop Linux distributions for the enterprise crowd, there are
    two names that go toe-to-toe: SUSE and Red Hat. Both offer distributions for the
    desktop and server separately marketed as “Enterprise Linux”, and both back up
    their offerings with a wealth of commercial support.


    With customers as varied as the London Stock Exchange and Office Depot, SUSE Linux
    Enterprise is extremely popular. Features like SUSE Manager, which provides automation
    of server management, and SUSE Cloud, providing OpenStack-powered local cloud
    infrastructure, make it teasy to see why. Enterprise users typically need support,
    which is – naturally – where SUSE makes its money. As well as direct commercial
    support, the company offers various consultancy services including SUSE Assist.
    SUSE Assist, the jewel in SUSE’s support crown, offers on-site services from a
    certified professional for companies that can’t afford to have a specialist on
    their staff.


    As well as its Desktop and Server variants, SUSE Linux Enterprise comes with the
    option of add-on extensions, including those that make it suitable for use in
    point-of-sale environments and high-availability extensions where required along
    with real-time and thin-client variants.


    Stability and support do come at cost to flexibility, however: compared to the
    community-driven OpenSUSE, SUSE Linux Enterprise has fewer packages available
    by default, removing many of the packages that aren’t well-suited to a more professional
    environment.


    The final tick in the box for SUSE is its SUSE Studio platform, which provides
    a means for users – Enterprise or otherwise – to customise Linux distributions
    and create everything from Live CD images to VirtualBox images and even Amazon
    Elastic Compute Cloud (EC2) instances tailored to their needs.


    While SUSE is our pick at present, it continually trades places with Red Hat as
    the two attempt to out-do each other; before committing to one, be sure to check
    out what the other’s offering too.


    ![](img/30dc0459712b32ede1a3814d456b41b6_140_0.png)


    # ALTERNATIVE DISTROS


    **Red Hat Enterprise**

    Like SUSE, Red Hat offers its Enterprise Linux variant in server, desktop and
    specialist variants, and boasts a healthy client list including ETH Zurich. Support
    is plentiful, and the company operates training facilities throughout the world.


    **OpenSUSE**

    OpenSUSE is the community- driven, fully open-source variant of SUSE Linux. Sponsored
    by SUSE, OpenSUSE requires no support contracts or licensing and often provides
    newer features.


    **Ubuntu**

    Like SUSE and Red Hat, the community- and corporate-backed software - Canonical
    - offers varying support contracts and pricing options, while its software compatibility
    is top, top.


    ![](img/30dc0459712b32ede1a3814d456b41b6_140_1.png)


    # BEST FOSS


    **Puppet**

    An open-source configuration management utility designed to support heterogeneous
    networks of Unix-like and Windows machines, Puppet is a powerful automation tool
    for sysadmins of Enterprise-class infrastructures. Worth a look!


    **Chef**

    An alternative to Puppet, the Ruby- and Erlang-based Chef integrates well with
    commercial cloud environments including Amazon’s EC2 and Google’s Cloud Platform,
    and works as a local install for managing internal infrastructure.


    **Docker**

    Docker provides the ability to easily and quickly deploy applications inside isolated
    software containers on Linux. Compared to a traditional virtual machine, a Docker
    container has significantly lower overheads.


    **Lynis**

    Designed for those who take a proactive approach to security – but, it has to
    be said, a handy tool for the black-hat crowd as well – Lynis provides a means
    to audit Linux and other Unix-like systems for security vulnerabilities, and can
    also check for configuration errors.


    **SUSE Studio**

    While SUSE Studio is most commonly used by the SUSE and OpenSUSE teams, its ability
    to customise and deploy operating system images can be used with any Linux distribution
    and can make a system administrator’s job significantly easier.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# # BEST DISTRO FOR...

    ## Security


    While the mainstream media worries its readers over black-hats, security-focused
    distributions are a vital tool for the good guys


    # ## Kali Linux


    For years, BackTrack Linux was the king of Linux distributions for those doing
    security audits and penetration testing. In 2013, however, the project was forked
    into Kali Linux. Created and maintained by Mati Aharoni and Devon Kearns of Offensive
    Security, Kali is a ground-up rewrite of BackTrack and a worthy successor to it.


    Based on Debian, rather than the Ubuntu origins of its predecessor, Kali includes
    pre-installed copies of the most popular security utilities, including network
    sniffer and analyzer Wireshark, port-scanning tool nmap, password cracker John
    the Ripper and even the Aircrack-ng suite


    ![](img/30dc0459712b32ede1a3814d456b41b6_141_0.png)


    > Kali has everything you need for full security testing


    for penetration testing of wireless networks. Its repositories have plenty more
    choices available, in addition to more sedate applications and utilities. Where
    Kali differentiates itself from the competition is in compatibility, as well as
    32-bit and 64-bit x86 hosts; the team behind it has worked hard to bring Kali
    to the more popular ARM-based platforms out there. Builds are already available
    for devices as diverse as the Raspberry Pi and Samsung Chromebok, with more builds
    arriving on a regular basis. Considering the very low cost of some of these devices,
    Kali''s support helps lower the barrier to entry considerably over distributions
    which require more expensive hardware to run.


    Perhaps the most impressive compatibility feature, however, is a Kali sub-project
    dubbed NetHunter. Currently available exclusively for Google''s Nexus Android
    smartphones and tablets, Kali NetHunter provides various wireless penetration
    testing tools usable directly from the device – a great option for discreet testing
    without having to lug an all-too-obvious laptop around. Combined with options
    to install to a hard drive as well as run from memory and an attractive desktop
    which lends itself well to every-day use, Kali is the obvious choice for anyone
    with an interest in network security – despite its reputation as a script-kiddie''s
    play-thing, it''s actually pretty tight on the security front.


    # # ALTERNATIVE DISTROS


    ![](img/30dc0459712b32ede1a3814d456b41b6_141_1.png)


    For those who can''t need ARM support, the x86-only BackBox is a great alternative.
    Based on Ubuntu and featuring the lightweight Xfce window manager, BackBox is
    powerful yet attractive and comes with a selection of pre-installed utilities.


    ![](img/30dc0459712b32ede1a3814d456b41b6_141_2.png)


    For penetration testing of both wired and wireless networks, the Slackware-based
    Wifislax is brilliant. Its Wi-Fi integration of many unofficial hardware drivers
    and firmware is next, and makes it a handy part of the main home kernel.


    ![](img/30dc0459712b32ede1a3814d456b41b6_141_3.png)


    REMnux specialises in reverse engineering offensive software. Tools are provided
    for memory re-creation and analysis of various executable formats as well as dis-
    and reassembling and even code convert.


    # # BEST FOSS


    **Lynis**

    Created by Michael Boelen, the author of Rootkit Hunter (rhunter), Lynis is a
    fully open security audit tool. As well as checking for vulnerabilities, Lynis
    has the ability to find misconfigurations with reports that can prove to be extremely
    useful when hardening a system.


    **nmap**

    A tool so famous it ended up with screen time in The Matrix Reloaded, Frodo Nascht''s
    (real name Gordon Lyle) nmap should have a place on every system. Its rapid network
    mapping is incredibly flexible and can be individually tailored.


    **OpenVAS**

    The Open Vulnerability Assessment System (OpenVAS) started life as a fork of Nessus
    under the name NG Nessus. Now, it''s one of the leading vulnerability scanning
    and management tools – and it''s entirely free and open-source.


    **Wireshark**

    While Wireshark – formerly Ethereal – has its competitors in the packet sniffing
    arena, its friendly user interface and powerful analysis and filtering tools are
    second to none. Wireshark is useful for general network diagnosis as well.


    **Metasploit**

    This framework is invaluable for penetration testers. When a scan has revealed
    a vulnerability, Metasploit can attempt to exploit said vulnerability: proving
    or disproving its existence quickly and easily.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# # BEST DISTRO FOR... Privacy


    Stay private and keep your information safe with these Linux distros specially
    built to put your mind at ease when working online


    # ## Tails


    Privacy can be extremely important on the Internet, and it''s only going to become
    more of a concern as time goes on. With more ways to leave your trace on the Internet,
    and more companies warning your details to sell you ads, it can be tricky to remain
    truly anonymous. This can be essential for some people – whistleblowers, victims
    of stalking and privacy-unpopular opinions on Twitter. It can also be handy for
    just buying a secret gift for your other half to avoid the inevitable targeted
    ads popping up that an incognito mode won''t stop.


    Tails can help you with all of that, and makes it fairly easy to do in the process.
    It manages this through many careful layers of security and privacy considerations
    – firstly, the entire system runs in RAM and does not use any disk-bound swap
    partition. The RAM is then completely written over when Tails is shut down, leaving
    no trace of what you were doing or using.


    ![](img/30dc0459712b32ede1a3814d456b41b6_142_0.png)


    All traces of user activity are removed as part of the shutdown process


    All of its networking is run through Tor, so your IP is masked behind at least
    a dozen encrypted servers. Failing that, the default is the Tor browser, which
    also has the same software, meaning that whatever you''re looking for, it won''t
    get traced back to you. You can also use secure chat clients to keep your location
    safe, there''s PGP email support built-in so you can send private mail and there''s
    also just a full suite of normal programs like LibreOffice and GIMP, so you can
    use the distro in any other way.


    You can install Tails, but it''s designed to be live booted and that will guarantee
    maximum privacy at the same time. Give it a go today to find out just how easy
    it is to remain anonymous.


    ![](img/30dc0459712b32ede1a3814d456b41b6_142_1.png)


    Run Tails from a disc or memory stick to get the best use


    # ## ALTERNATIVE DISTROS


    +   - **iprediaOS**: An alternative to Tails that relies more on the IP network
    than Tor, yet still provides an environment where you can stay completely anonymous.
    It''s also live, so you can test it out before committing to it.

    +   - **Whonix**: A very different private distro, anonymously connected to Tor,
    created by an anonymous server, by the same levels of security to make the user
    easy and hard to spot.

    +   - **Liberté**: A Debian-based Tails-variant where the user is not required
    to have Tor but is still extremely private and very secure. It uses Tor and other
    services to keep the user safe.


    # ## BEST FOSS


    +   - **Tor**: In the movie Sneakers, an intruders'' group of Bay Area hackers
    bounce their signal off multiple servers and satellites to avoid detection. Tor
    is essentially this, sending your requests through several secure and encrypted
    servers.

    +   - **Tor Browser**: Built using Firefox and Tor, using the Tor browser is an
    easy way to stay completely anonymous online without the need for booting into
    a private distro. It''s so good its used by default in Tails to make sure you
    stay private.

    +   - **ClawsMail**: This is a PGP encryption for your email clients, including
    Thunderbird, that lets you send messages in confidence. It also works on its own,
    just in case you want to leave even less trace of its existence on your system.

    +   - **KeePassX**: Manage your passwords with KeePassX, the cross-platform password
    manager. It allows you to store a lot of data in a highly encrypted database that
    can only be accessed via your password – once it''s accessed, you can even search
    it.

    +   - **Florence Virtual Keyboard**: A virtual keyboard that avoids any keylogging
    programs to make your computer just that little more secure. It can also be used
    if your keyboard is missing or broken, and is extensible and customisable.'
