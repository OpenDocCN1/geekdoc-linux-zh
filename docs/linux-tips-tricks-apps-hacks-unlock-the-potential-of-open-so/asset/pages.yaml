- pgno: 131
  md: '# “Use checkinstall, not make install when you build an application or library
    from source”


    ![](img/30dc0459712b32ede1a3814d456b41b6_131_0.png)


    # Follow policies


    Whether you build custom packages solely for your \(localhost\) or publish them
    in public repositories, the essential thing to do first is to study package building
    policies for your Linux distribution. For Ubuntu, Debian, Fedora, R{O}SA and OpenSUSE,
    these policies usually differ in details but agree on the main principle: writing
    specs or control files should be done accurately to make sure the ever-growing
    repositories maintain trouble-free performance.


    # 04 Writing a dummy spec


    The image on page 26 illustrates a simple dummy spec file, which can be compiled
    into an RPM containing two files: dummyfile and dummy.another.file. To make things
    work before you launch rpmbuild, put these files into the \\(buildroot\\)/etc/dummy
    directory. During the build process rpmbuild may complain on some minor issues,
    which sum into the badness score. The score surpasses a certain threshold then
    the build will fail. Of course it''s best to fix problems rather than to override
    the score, but in case you need the latter choice, use the setBadness command
    in your spec. For example, to enable building a package that includes an unauthorised
    permissions file, add the following line:


    ```

    setBadness(''permissions-unauthorized-file'', 0);

    ```


    # 05 A simpler way: use checkinstall


    Use checkinstall instead of \(make\) install when you build an application or
    a library from source. Checkinstall works in Debian and Red Hat, where it asks
    you for some details (package name, version, description, etc) and automatically
    produces a package. The main benefit is that you can keep your system clean and
    tidy. If you need to wipe off the files, simply remove the package with your standard
    package manager tool (\(rpm\), \(zypper\) or, \(rm\) remove). The downside of
    checkinstall is its limited features. For example, you can''t include post-installation
    scripts with it and so it won''t work when packaging some proprietary apps, as
    it needs extra hooks for many systems. However, checkinstall is perfect for local
    installations or small OEM tasks, so try it.


    # 06 A brief look at handling the .deb format


    Just like with RPM, DEB files can be opened with archive managers so that you
    can see the two other tarballs: \(data.tar.gz\) and \(control.tar.gz\). They are
    pretty self-explanatory – the first one contains package files, the second one
    package metadata. Building DEB packages is different from RPM but still straightforward.
    It''s even more standardised, as in Debian/Ubuntu and their clones there is one
    dominating technology to handle deb packages – apt plus dpkg. Apt is a powerful
    tool for handling packages and repositories and has various companions, like \(aptitude\)
    for flexible search queries, while \(dpkg\) is solely a package management tool
    (like the \(rpm\) command).


    # 07 Build DEB packages


    First, get the essentials:


    ```

    sudo apt-get install autoconf automake libtool autotools-dev pkg-dev fakeroot
    dh-make

    ```


    Imagine, for example, you''ve got \(mypackage-0.0.2.tar.gz\), which you wish to
    compile into a DEB package. First, prepare a build directory manually like this:


    ```

    mkdir -p ~/src/mypackage/0.0.2

    ```


    Then put your tarball into that directory and unpack it (\(tar xzf mypackage-0.0.2.tar.gz\)).
    Then you will need to compile the program using classic commands:


    ```

    ./configure --prefix=/usr && make

    ```


    If you''re recompiling a program that already exists in one of your repositories,
    you can ease the development dependency resolution by issuing \(apt-get build-dep
    mypackage\) beforehand in order to make the \(\(configure\) script run more smoothly.


    ![](img/30dc0459712b32ede1a3814d456b41b6_131_1.png)


    Right This sample debian/control file illustrates the required minimum versions
    of other packages it depends on'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_132_0.png)


    # Package maintainers


    There are various tools that aid creating and maintaining high-quality software
    packages. In the case of Ubuntu/Debian, the official policy says the synopsis
    line in debian/control must be concise, not repeating the package name, but also
    informative. It''s also a good idea to write useful changelog entries to debian/changelog
    each time you update a package.


    After building the updated version of the package you may want to find out the
    difference between new and old version. Use the `diff` command for that:


    ```

    ```bash

    debdiff package_1.1_arch_all_deb package_2.1_arch_all_deb

    ```

    ```


    Also keep in mind that both lpell and aspell have special modes for checking debian/control
    files:


    ```

    ```bash

    lpell -o american -o debian/control

    aspell -d en -C -I -c debian/control

    ```

    ```


    In the RPM world, the must-advanced helper tools have been introduced in ROSA
    and openMandriva, where the latest RPM/S technology is being used. Install the
    spec-helper package (rpm-spec-helper) to access extra tools: spec-cleaner and
    readif_patch. The first is useful for adapting a spec file from different Linux
    distributions: It fixes Buildroot and Package sources according to globel variables,
    cleans the buildroot tree, fixes hard-coded ''%{name}'', ''%{version}'' and ''%{release}''
    variables and so on:


    ```

    ```bash

    spec-cleaner old.spec new.spec

    ```

    ```


    Preif_patch updates a patch file (.diff) to work with a new version of a source
    tarball. Place the old patch, spec file and a new tarball in a new directory and
    run:


    ```

    ```bash

    readif_patch <patch_file.diff> <tarball>

    ```

    ```


    # 08 Debianise it


    Run `dh_make --createorig`, answer a few questions about the package''s details
    and finally hit Enter. You will see the newly created debian subdirectory added
    to the sources tree. Edit the debian/control file and modify the package description
    if necessary. Now, make sure you''re currently in the main sources directory and
    issue the command:


    ```

    ```bash

    dpkg-buildpackage --fakeroot

    ```

    ```


    After a while, once the building process is over, move a level up and enjoy your
    newly created DEB package. You can double-click it or use the `dpkg -i mypackage-0.0.2.deb`
    command.


    Notice the .dsc file, which can help you pull the application sources in future.
    The syntax looks like this:


    ```

    ```bash

    dpkg-source -x ./mypackage-0.0.2.dsc

    ```

    ```


    # 09 The graphical way


    Debreate is graphical tool and step-by-step wizard for those who want to avoid
    the command line fu. You can download and install Debreate from its official mirror
    (**bit.ly/1NNSPD**) — it is a universal .deb package itself and suitable for nearly
    all systems.


    On the Control tab you are supposed to fill in the info and description fields,
    much like you would do if you were in the debian/control file.


    The Dependencies and Conflicts tab enables you to specify package requirements
    or conflicts, including specific minimum versions. After that, select the package
    contents on the Files tab, include optional post-installation commands on the
    Script tab, create a desktop menu entry on the Menu tab and finally press the
    big green button on the Build tab to generate the DEB package. With this tool,
    it should be both faster and easier to create a Debian package.


    # Left

    Debreate

    lets you escape

    the command line

    and create your

    DEB package with

    friendly step-by-

    step wizard'
