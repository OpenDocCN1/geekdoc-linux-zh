  md: '# Tips | Tricks | Hacks | Apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_122_0.png)


    Install Qt 5


    ![](img/30dc0459712b32ede1a3814d456b41b6_122_1.png)


    # 02  Get the staging branch


    This step is optional, but you could also look at tracking the staging branch
    specifically for the Qt port. To do this you need to first *cd* into the WebKit
    directory that was just created. From there, you can fire off the following commands:


    ```

    `$ git remote add Qtwebkit git://git.ios.org/ webkit/Qtwebkit.git`

    `$ git fetch Qtwebkit`

    ```


    However, the current release of the Qt port files is in the normal WebKit source
    that we downloaded.


    # 03  Get the Qt 5 source


    We need to build Qt 5 properly so that our WebKit can run and be developed in
    the correct way. We first need to download the files to install Qt 5, which can
    be found here: www.qt.io/download-open-source. You can also download the installer
    file in the terminal using something like:


    ```

    `$ wget http://download.qt.io/official_releases/ qt/5.4/5.4.1/qt-opensource-linux-x86-5.4.1.run`

    ```


    Remember to take into account the latest version of Qt 5 before you download.


    # 04  Install Qt 5


    Once it’s downloaded, we can get ready to install it. First of all, elevate the
    file so you can execute it using:


    ```

    `$ chmod +x qt-opensource-linux-x86-5.4.1.run`

    ```


    # “If you’re using a more recent version of Ubuntu, you may encounter some problems
    when working with Qt code”


    Remember to change the version on this line to be the one you downloaded. When
    you have done that, you can install it using the following:


    ```

    `./Qt-opensource-linux-x86-5.4.1.run`

    ```


    This will bring up a graphical installer – follow the instructions to install
    Qt5.


    # 05  Setup OpenGL


    If you haven’t already installed the OpenGL libraries, you should do so now. They
    can be installed using:


    ```

    `$ sudo apt-get install mesa-common-dev`

    ```


    If you’re using a more recent version of Ubuntu, you may encounter more problems
    properly working with Qt code, so it can be prudent to install the following package
    as well:


    ```

    `$ sudo apt-get install libgl1-mesa-dev -y`

    ```


    If you start having problems with GL as part of this tutorial, installing this
    package may fix it.


    # Build essentials


    If you’ve an as old a system as this, you’re unlikely to already have all the
    build tools that are required for this sort of job. If you’re on this, you can
    install the basics just with:


    `$ sudo apt-get install build-essential -y`


    It’s a good idea to do this as soon as you can in this project, but as we start
    everything else, it’s probably best to just do it at the end.'
