    \n**06** **Kanban template**  \nKanban has its roots in Japan. It uses a work-in-progress\
    \ system as the core mechanism to expose system operation (or process) problems\
    \ and stimulate collaboration to continuously improve the system. While traditionally\
    \ used in manufacturing, it is now widely used as a variation of agile methodology.\n\
    With Taiga you can either create a project with the kanban template or view the\
    \ kanban template inside the scrum template. To create a simple kanban project,\
    \ just select kanban during project creation. If you want your project to be viewable\
    \ both as scrum and kanban, create the project under a scrum template and then\
    \ enable kanban under _Admin/Project Profile/Modules/Kanban_. Now you will have\
    \ a kanban option on the left-hand sidebar. Click here to view your scrum project\
    \ in a kanban template.\n\n**07** **Issue management**  \nAnother important aspect\
    \ of software development is the issue management. Taiga offers a comprehensive\
    \ issue management system that includes bugs, questions and enhancements. To raise\
    \ an issue, click on the Issues link on the left sidebar. Then click on the _New\
    \ issue_ button in the top-right corner. Fill in the details like the type, priority,\
    \ severity and so on, and then click _Create_. You can now see the issue in the\
    \ issues list but it is still not assigned to anyone. Click on the _Unassigned_\
    \ button to assign it to a team member. Note that the left sidebar has different\
    \ filters available to use as well. Click on a filter to view relevant bugs. You\
    \ can also search issues using the search box on the top-left sidebar.\n\n**08**\
    \ **Wiki**  \nWith Taiga at the helm, software documentation is taken care of\
    \ as well. You can see the Wiki link on the left sidebar below the Issues link,\
    \ so just click on the link to get started. You can see the WYSIWYG interface\
    \ text editor. Add the text in the editor and once done, click the _Add Link_\
    \ button. Here you can assign the name to the wiki page. Once the name is assigned,\
    \ you have your first wiki page ready. You can add other pages similarly and even\
    \ link pages amongst themselves as required.\n\n**09** **Admin options**  \nView\
    \ the admin options (gear icon) in the bottom-left corner. These settings are\
    \ specific for projects, so you can have different settings for different projects.\
    \ There are five major ones under the admin settings. ‘Project profile’ lets you\
    \ set up project details, enable/disable modules and more. ‘Custom attributes’\
    \ lets you create a custom status for issues, priorities and statuses. ‘Manage\
    \ members’ and ‘Roles & permissions’ have options for user/ privilege management.\
    \ ‘Integrations’ merge the project with GitHub, Bitbucket and GitLab, and sync\
    \ events with Webhooks.\n\n**10** **Gamification**  \nIf you didn’t notice at\
    \ this point in the tutorial, there is a fair amount of gamification added to\
