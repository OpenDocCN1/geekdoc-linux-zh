    ![](img/30dc0459712b32ede1a3814d456b41b6_125_0.png)


    # # Network penetration testing with Pento


    The Gentoo-based utility distro can find vulnerabilities in your network


    **Safety is a big preoccupation for all computer users, not just those on Linux
    systems.** It''s important to know how to shield yourself and your systems from
    attacks, and now we''re going to look at the problem from a slightly different
    angle: how someone would attempt to attack your system.


    White hat or ethical hacking is an important step in any security process, and
    we''re going to take a quick look at probing your own local network to try and
    figure out any problems you


    might have. There are a few different tools and distros that can aid you in this,
    but today we are going to focus on Pento.


    Pento is less known than Kali or Backtrack Linux, but it''s by no means a poorer
    product. Built on Gentoo, it can be opened perfectly well live and can be installed
    for a more permanent testing rig. While it has a full suite of pentesting software,
    we''ll be concentrating on some of the network testing apps for the purpose of
    exposing any vulnerabilities in your network.


    # ## Resources


    **Pento** www.pento.ch'
