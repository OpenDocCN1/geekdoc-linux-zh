  md: "# Tips | Tricks | Hacks | Apps\n\n![](img/30dc0459712b32ede1a3814d456b41b6_112_0.png)\n\
    \n![](img/30dc0459712b32ede1a3814d456b41b6_112_1.png)\n\n![](img/30dc0459712b32ede1a3814d456b41b6_112_2.png)\n\
    \n# 02 Get Archon runtime\n\nSince 2014, several versions of Archon runtime have\
    \ been released, from 1.0 to 2.1. Viad Filippov, the main developer, has been\
    \ in a constant race for the latest and greatest Chrome code, whilst fixing Archon\
    \ bugs at the same time. As a result, different combinations of Chrome and Archon\
    \ versions may or may not work for you. The default choice, however, is to try\
    \ the latest Archon runtime build from the project’s brand new site [archon-runtime.github.io](archon-runtime.github.io),\
    \ with the current stable Chrome version from Google. At the time of writing,\
    \ the latter software is up to version 41.0.x.\n\n# 03 Prepare your browser\n\n\
    Archon is distributed in a form of unpacked Chrome extension. When you download\
    \ it, you get a ZIP file with an extension folder inside. To be able to install\
    \ unpacked extensions, go to [chrome/extensions](chrome/extensions) and tick the\
    \ Developer mode checkbox. You will immediately see the new button, one of them\
    \ will be the ‘Load unpacked extension...’ option. Click it and navigate to the\
    \ folder where you unzipped the downloaded Archon package earlier. Once you click\
    \ OK, it will appear in the installed extensions list. Before you proceed to the\
    \ next step it is useful to check for WebGL support in Chrome, which can make\
    \ use of hardware acceleration for graphics and help browser perform better. Go\
    \ to [chrome://gpu](chrome://gpu) and see if there are any ‘software only’ strings.\
    \ If so, switch to [chrome://flags](chrome://flags) and enable the ‘Override software\
    \ rendering list’ parameter.\n\n# Troubleshooting\n\nArchon not working as it’s\
    \ supposed to? Here’s how to find out what the trouble is and fix it\n\nFrom a\
    \ user’s perspective, Archon isn’t stable, so you may encounter errors and lockups.\
    \ If things went wrong from the start, ensure that you’re using the Archon of\
    \ the right architecture. After that, ensure Google Native Client is enabled (scroll\
    \ your brow chrome://flags/#enable-nacl-flag).\n\nSome apps may not launch and\
    \ complain of a missing ‘message’ element for extName. To fix it, edit the file,\
    \ _localize_en-mesages.json_,inside the extension folder and add the missing _text_\
    \ there. It should now look like this:\n\n```\n```\n{\n  \"appNotSupported\":\
    \ {...},\n  \"extName\": {\n    \"description\": \"Extension name\",\n    \"message\"\
    : \"Whatever you like\"\n  }\n}\n```\n\n```\n\nAnother frequent warning message\
    \ is about the _key_ parameter. Resolve this by removing that parameter inside\
    \ the extManifestDirectory.\n\nMore fixes are available on the issues page of\
    \ the Archon project: bit.ly/1PBe6Dx. If nothing helps, change your Google Chrome\
    \ version – find the Linux binaries at bit.ly/1CwcLU.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_112_3.png)\n\
    \n**Above** Once you obtain the Google Play link of your application, you can\
    \ easily retrieve its APK file"
