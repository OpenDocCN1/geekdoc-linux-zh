    \nA box plot can give you information regarding the shape, the variability and\
    \ the median of a data set, quickly and efficiently. The presented box plot was\
    \ generated using the following R command:\n\n```\n```r\n> ggplot(LUD, aes(Linux,\
    \ Uptime)) +\n    geom_point() + geom_boxplot(colour =\n    \"red\") + labs(title=\"\
    A Box Plot\")\n```\n```\n\nBased on the two discrete values of the Linux variable,\
