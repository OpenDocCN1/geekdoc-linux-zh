- pgno: 12
  md: '# >_.063 Unpack a ZIP file


    If you''ve downloaded a ZIP file and you did it from the terminal, or you''re
    working from it, you can unpack it using the unzip command. Use it like so:


    ```

    `$ unzip file.zip`

    ```


    # >_.064 Unpack a TAR file


    Sometimes Linux will have a compressed file that is archived as a .tar.gz, or
    a tarball. You can use the terminal to unpack these or similar TAR files using
    the tar command, although you need the right options. For the common .gz, it''s:


    ```

    `$ tar -zxvf file.tar.gz`

    ```


    # >_.065 Copy and write disks


    Coming from UNIX is a powerful little tool called dd, which we''ve been using
    a lot recently for writing Raspberry Pi SD cards. Use it to create images from
    discs and hard drives, and for writing them back. The if is the input file or
    drive and the ofis the output file of the same. It works like so:


    ```

    `$ dd if=image.img of=/dev/sda bs=1M`

    ```


    # >_.066 Create an empty file


    Sometimes when coding or installing new software, you need a file to write to.
    You could create it manually with nano and then save it, but the terminal has
    a command similar to mkdir that enables you to create an empty file – this is
    touch:


    ```

    `$ touch file`

    ```


    # >_.067 Print into the terminal


    The terminal uses echo to print details from files into the terminal, much like
    the C language. If you''re writing a Bash script and want to see the output of
    the current section, you can use echo to print out the relevant info straight
    into the terminal output.


    # >_.068 Check an MD5 hash


    When downloading certain files it can help a lot to check to make sure it''s downloaded
    properly. A lot of sites will offer the ability to check the integrity of the
    downloaded file by comparing a hash sum based on it. With that MD5 and the file
    location at hand, you can compare it with:


    ```

    `$ md5sum file`

    ```


    # >_.069 Run commands to x


    Sometimes you need to do something concerning the x display, but the only way
    you can enter the command line is by switching to an alternate instance with Ctrl+Alt+F2
    or similar. To send a command to the main x display, preface it with DISPLAY=“:0”
    so it knows where to go.


    # >_.070 Create a new SSH key


    When you need to generate a strong encryption key, you can always have a go at
    creating it in the terminal. You can do this using your email address as identification
    by entering the following into the terminal:


    ```

    `$ ssh-keygen -t rsa -C

    “your.emai@example.com”`

    ```


    # >_.071 System details


    Sometimes you want to check what you''re running and you can do this with the
    simple uname command, which you can use in the terminal with the following:


    ```

    `$ uname`

    ```


    # >_.072 Kernel version


    As part of uname, you also get the kernel version. Knowing this can be useful
    for downloading the right header files when compiling modules or updating certain
    aspects. You can get purely the kernel version by adding the -r option:


    ```

    `$ uname -r`

    ```


    # >_.073 CPU architecture


    If you''re on an unknown machine, you might need to find out what kind of architecture
    you''re running. Find out what the processor is with:


    ```

    `$ uname -p`

    ```


    # >_.074 Everything else


    Uname enables you to display a lot of data that is available from the system and
    you can look at all of this information by simply using the -a option with the
    command:


    ```

    `$ uname -a`

    ```


    # >_.075 Ubuntu version


    With all the distro updates you do, it can be tricky to keep track of which version
    of Ubuntu you are on. You can check by using:


    ```

    `$ lsb-release -a`

    ```


    > “To send a command to the main x display, preface it with DISPLAY=“:0””


    # FILE

    PERMISSIONS


    >_Learn how you can view file permissions and get to grips with how they should
    be properly modified


    # >_.076 List file permissions


    You can check the file permissions of every item, including hidden files and directories,
    in the terminal using ls -la. It will print out the file permissions as a ten-character
    string in the first column of output. The first character identifies the file
    type, with d indicating a directory and - indicating a regular file. We''re interested
    in the last nine characters, which are actually three sets of three and are interpreted
    differently. For example:


    ```

    ```

    rwxr-xr-x

    ```


    ```


    R stands for read, w stands for write and x stands for execute. If they''re present
    instead of a-, it means that it is present in that particular block of permissions.
    It''s split up over three blocks: the first three being the user you are currently
    using, the second being the group and the third being for everyone else.


    # >_.077 Change permissions


    With the permissions ascertained, you can start editing them if you want via the
    chmod command. You edit each of the three permissions set by assigning it a number
    that treats the three-bit permissions set as a binary. So you''d do something
    like:


    ```

    `$ chmod 777 file`

    ```


    The first number is for the user permissions, the second is for the group and
    the third is for everyone else. The numbers mean:


    +   * 7: read, write and execute, 111/rwx

    +   * 6: read and write, 110/rw-

    +   * 5: read and execute, 101/r-x

    +   * 4: read only, 100/r--

    +   * 3: write and execute, 011/-wx

    +   * 2: write only, 010/-w-

    +   * 1: execute only, 001/--x

    +   * 0: none, 000/---'
  merge: -1
