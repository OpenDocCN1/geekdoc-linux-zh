  md: '# Tips | Tricks | Hacks | Apps


    # BEST DISTRO FOR...


    # Live distro


    The best live Linux distros you can boot up from portable media without installation


    # Knoppix


    ![](img/30dc0459712b32ede1a3814d456b41b6_144_0.png)


    Knoppix is still one of the premier live distros, although competition has become
    fierce with other distros popping up that add something different to the mix.
    Knoppix has remained popular thanks to some core design choices, while updating
    in other areas to keep with the times. Knoppix positions itself as a showcase
    of everything that open source has to offer, and depending on what version of
    the distro you get, this can translate to having access to just about every known
    FOSS available on Linux without the need to install them – it has everything and
    the kitchen sink.


    For having quite a lot of software, Knoppix boots and runs fairly fast. This is
    due to the way all the software is compressed and decompressed ‘on the fly’, allowing
    for 2 GB of the usual DVD to contain up to 9 GB of software that can be used at
    any time. Knoppix also has several custom boot options on a cheat sheet that will
    let you boot with different sound or display options, and even boot into the special
    ADRIANE interface for those who are visually impaired. Knoppix can be very handy
    to have installed onto a DVD or USB storage if you regularly needing to quickly
    boot into Linux for some reason on various computers. It’s not the best for sysadmin
    work, but it can do many other Linux-only computing tasks.


    +   8/10

    +   7/10

    +   5/10

    +   7/10

    +   10/10

    +   9/10

    +   4/10

    +   9/10


    # ALTERNATIVE DISTROS


    # Puppy Linux


    ![](img/30dc0459712b32ede1a3814d456b41b6_144_1.png)


    A very special and tiny distro option that, while very light for normal computers,
    is best suited for giving older PCs some useful new life. It’s based on Ubuntu,
    which is a little ironic and a different set of packages.


    # WebConverter


    ![](img/30dc0459712b32ede1a3814d456b41b6_144_2.png)


    WebConverter allows you to set up a dedicated web kiosk for something like an
    internet cafe, running a modified version of Firefox.


    # Porteus


    A very fast live distro that takes up only 300 MB of space, and is optimised to
    run from live media, you can add modules for extra software if needed.


    ![](img/30dc0459712b32ede1a3814d456b41b6_144_3.png)


    # BEST FOSS


    # Clonezilla


    ![](img/30dc0459712b32ede1a3814d456b41b6_144_4.png)


    The best way to clone your hard drive, Clonezilla supports full hard drives as
    well as partitions and can then be used to restore disk images in the future.
    It can be used on its own but it’s best to use the live version.


    # GParted


    ![](img/30dc0459712b32ede1a3814d456b41b6_144_5.png)


    Format, edit, resize and basically do anything you want with your hard drive and
    partitions using GParted. It’s included on most live CDs because it’s excellent
    at doing this task and is also easy to use.


    # Wicd


    ![](img/30dc0459712b32ede1a3814d456b41b6_144_6.png)


    An excellent and easy to use networking utility that can be used for both wireless
    and wired, it makes connecting to and managing networks easy, in the past we’ve
    had to use our network manager group test.


    # TestDisk


    ![](img/30dc0459712b32ede1a3814d456b41b6_144_7.png)


    If your backups have failed or something else has gone horribly wrong, TestDisk
    can recover your data from a hard drive. It supports all major file system types
    and works from the terminal.


    ■ You can download Knoppix from www.knopper.net/knoppix'
