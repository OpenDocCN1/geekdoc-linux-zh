  md: "# **Tips | Tricks | Hacks | Apps**\n\n# # Program a client-server application\n\
    \nEach operating system provides its own set of networking APIs, but Qt gives\
    \ a solution to simplify creating chatty applications\n\n![](img/30dc0459712b32ede1a3814d456b41b6_41_0.png)\n\
    \n**Modern computer networks are composed of multiple protocols.** Creating well-formed\
    \ packets by hand is almost impossible – the protocol stack and its underlying\
    \ network hardware affect the format.\n\n**Engineers working on Unix** solved\
    \ this problem by introducing an abstraction layer – so-called **sockets** acting\
    \ as endpoints between two local or remote applications. Developers use the standardised\
    \ interface in order to provide commands to the socket, which are then translated\
    \ to the network.\n\nWhen dealing with sockets, a basic understanding of networking\
    \ is beneficial. For now, it shall suffice to define that messages can be transmitted\
    \ by two high-level protocols.\n\n**TCP** – short for Transmission Control Protocol,\
    \ – provides confirmation when data has been delivered successfully. This is accomplished\
    \ by a relatively complex sequence of packets which add overhead to the communication\
    \ process. However, some applications don't require this. For them, **UDP** provides\
    \ a sleeker communication protocol that forgoes delivery confirmation. On a network,\
    \ computers are identified by their IP address. Individual services are then identified\
    \ by their port numbers – consider them apartment door numbers inside a high-rise\
    \ building.\n\n**Developers working on communication software** tend to face a\
    \ chicken-and-egg situation – if no server has been written, the client can't\
    \ connect. On the other hand, the lack of a client means that the server can't\
    \ be tested.\n\nIn practical projects you should start out by creating a rough\
    \ mock-up of the messages that the client and server will exchange. You don't\
    \ need to get this 100 per cent right on the first try; most protocols change\
    \ as they get implemented.\n\nOur finger exercise-level applications don't require\
    \ this level of sophistication. It will suffice to begin by creating a command\
    \ line project called ImagineITCPServer. Qt Creator does not add the networking\
    \ module to newly created applications. This can easily be remedied by opening\
    \ its .pro file and adjusting the QT directive so that network gets included at\
    \ compile time.\n\n```\nQT += network\n```\n\nWith that, it is time to create\
    \ the server object. Its declaration can be placed inside the main() function\
    \ responsible for program bring-up:\n\n```\nmyServer=new QTcpServer();\nif(myServer->listen(QHostAddress::Any,\
    \ 1025)==false)\n{\n        qDebug() << \"Server error\" << myServer->serverError();\n\
    \        return 0;\n}\nelse\n{\n        qDebug() << \"Server up\" << myServer->serverAddress()\
    \ << \" \";\n        myServer->serverPort();\n}\n```\n\nIn classic Berkeley socket\
    \ programming, server and client logic are handled by instances of the socket\
    \ class. Qt provides a dedicated server that contains helper methods for connectivity\
    \ management. After start-up, we invoke the listen() method in order to make our\
    \ QTcpServer wait for incoming connections."
  merge: -1
  img_proc: true
- pgno: 42
  md: "![](img/30dc0459712b32ede1a3814d456b41b6_42_0.png)\n\nPassing a QHostAddress::Any\
    \ makes the class listen on any network interfaces – you can constrain the code\
    \ to a specific IP address by passing it in. Parameter number two is responsible\
    \ for selecting the port that needs to be opened.\n\nAccessing ports below the\
    \ magic number 1024 requires root privileges on many Unix systems – simply running\
    \ the program from the IDE would result in an access error. Avoid this problem\
    \ by using port number 1025. Finally, the exec() method of QCoreApplication is\
    \ invoked to start the main event loop.\n\nDebugging and deploying network-related\
    \ programs can be quite complex. For example, ImagineTCPServer will fail to start\
    \ if another application is already connected to the port in question.\n\nHowever,\
    \ this can be remedied by choosing a different port or by closing the offending\
    \ application, which can be found via the netstat tool.\n\n# Signals and slots\n\
    \nMost network operations run asynchronously. Methods like listen() return immediately,\
    \ delegating the actual work to a background thread. With QTcpServer, incoming\
    \ connections are announced by the newConnection signal.\n\n# “Signals can only\
    \ be handled by classes derived from QObject”\n\nSignals can only be handled by\
    \ classes derived from QObject. Click File>New File or Project to open the creation\
    \ wizard, then Select C++ → C++ Class to start the class generator. ImagineListenerClass.h\
    \ looks as follows:\n\n```\n```cpp\nclass ImagineListenerClass : public QObject\n\
    {\n    Q_OBJECT\npublic:\n    explicit ImagineListenerClass(QObject *parent =\
    \ 0);\npublic slots:\n    void connectionIncoming();\n};\n```\n```\n\n```\n```cpp\n\
    QDebug() << \"Client connection attempt\";\n```\n```\n\nSignal-Slot connections\
    \ are established via the connect method. It requires pointers to the sending\
    \ and the receiving objects, the actual signal and slot are to be specified via\
    \ SIGNAL() and SLOT() macros:\n\n```\n```cpp\nelse\n{\n    qDebug() << \"myServer=\
    \ << \"myServer->serverAddress()\" << \"myServer->serverPort();\n    myListener=new\
    \ ImagineListenerClass();\n    QObject::connect(myServer, SIGNAL(newConnection()),\
    \ myListener, SLOT(connectionIncoming()));\n}\n```\n```\n\n# Client time\n\nThe\
    \ work on the server is completed, but only for now. Start it up by clicking the\
    \ Play button"
