  md: '# **Tips | Tricks | Hacks | Apps**


    ![](img/30dc0459712b32ede1a3814d456b41b6_147_0.png)


    Above Jessie gives you the option to install the Cinnamon desktop


    # # Debian 8.0 Jessie


    Jessie has gone stable, and this new LTS release for Debian seems to have spent
    only a short time on the testing branch


    +   CPU

    +   1 Ghz P4 or later

    +   RAM

    +   1 GB recommended (for desktop)

    +   Storage

    +   10 GB (for desktop)


    The Debian cycle seems to be extremely short this time round. 7.0 Wheezy felt
    like it was in testing for a long time, yet already we''ve had 8.0 Jessie supersede
    it as the next stable. It''s odd to think it''s been two years since then, but
    here we are with 8.0 stable and the latest LTS release for the venerable Debian
    distro. With Stretch the next testing build, and probably the one we''ll see used
    most in desktop distros, what is the actual stable release like?


    First off, if you''ve been using Jessie over the last few months for any extended
    period of time, you will probably know what to expect. With the feature freeze
    in November, the five months leading to release were mostly bug testing to make
    sure that the final product was worthy of the stable name. It''s definitely succeeded
    in this, being able to run well on


    a variety of hardware types and in situations where it''s using a slightly wrong
    kernel for the hardware, such as with PAE support issues, for example.


    Debian is very much a basic distro in that it offers you a bare, graphical distro
    with a good selection of software installed and decent tools to expand on it to
    make it anything you want. There are no special, homegrown desktop environments,
    package managers, software centres or external services and such. It comes in
    a variety of flavours to suit many people''s needs, including the now standard
    32- and 64-bit spines, a variety of desktop editions and a command line version
    for those who want to start basic. Debian 8.0 continues this trend, albeit now
    giving you more up-to-date software packages and a few more options such as Mint''s
    Cinnamon desktop.'
