- pgno: 83
  md: '# Tips | Tricks | Hacks | Apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_83_0.png)


    # Supercharge your Raspberry Pi


    Get the most out of your Raspberry Pi with these performance-enhancing tips and
    tricks


    Your Raspberry Pi is plugged in. Raspberry Pi is installed on the SD card and
    you are right in the middle of setting up a wireless print server or building
    a robot to collect your mail from your dorm.


    But are you truly getting the most from your little computer? Do the components
    you''re using maximise the potential of your Raspberry Pi or are they holding
    it back? Perhaps you haven''t explored the full set of options in Raspbian, or
    you''re running the entire OS from SD card, something that can reduce SD card
    lifespan.


    Various tools and techniques can be employed to improve performance, from choosing
    the right hardware to overclocking the CPU. You might even maximise storage space
    on the Raspberry Pi''s SD card or all but replace it with a secondary device to
    help improve speed.


    Use these tips and tricks to reconfigure your Raspberry Pi setup and optimise
    software and hardware to ensure you get the best performance for your projects.


    ![](img/30dc0459712b32ede1a3814d456b41b6_83_1.png)


    # 01 Use better storage hardware


    Your choice of storage media can have an impact on your Raspberry Pi''s performance,
    regardless of the operating system. A low capacity SD card with poor error correction,
    is going to be slower than a larger card with greater resilience, so you need
    to find the right balance for your project and shop wisely.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_84_0.png)


    # 02 Choosing the best SD card


    Various standards of SD card are available, with the more expensive designed for
    better error correction. For the best performance on your Raspberry Pi, choose
    a SDHC card with a high rating. The same advice applies to MicroSD cards, which
    you can use on your Raspberry Pi with an SD card adaptor or directly insert into
    a Raspberry Pi B+.


    # 03 Make the most of your storage


    You''ll typically need 1-2GB of storage for your chosen Raspberry Pi distro, so
    any remaining storage on your SD card will be used for updates and data you create
    or save.


    In Raspbian you can open a command line and run the configuration utility to gain
    more space (only if your SD cards greater than 2 GB).


    ```

    `sudo raspi-config`

    ```


    # 04 Expand the Raspbian partition


    Maximising the partition affords the full capacity of your SD card, which will
    increase the media''s lifespan (there is more space to write to, so the same sectors
    aren''t being overwritten as often).


    With raspi-config running, use the arrow keys to select expand_roots in the menu.
    Then wait briefly while the partition is resized.


    ![](img/30dc0459712b32ede1a3814d456b41b6_84_1.png)


    # 05 Write data to RAM


    Rather than reading and writing data to your SD card – something that will eventually
    result in a deterioration of reliability and performance – you can configure Raspbian
    to write to the system RAM, which will speed things up slightly and improve SD
    card performance.


    This is achieved using fstab (file systems table), a system configuration available
    in most Linux distros.


    # 06 Enable fstab in Raspbian


    This is much like creating a RAM disk in Windows and is almost as easy to setup.
    In the command line, enter:


    ```

    `sudo nano /etc/fstab`

    ```


    Add the following line to mount a virtual file system:


    ```

    `tmpfs /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=100m 0 0`

    ```


    Follow this by saving and exiting nano (Ctrl+X), then safely restarting the Pi:


    ```

    `sudo shutdown -r now`

    ```


    Above There’s a great guide to SD cards at linux.org/ RPI_SD_cards


    # Buy rated SD cards


    It’s a littletempting to go our your Raspberry Pi with an image cooked on a SD
    card that you just pulled out of your SOSP coupon. After all, they’re all the
    same, right? The chances are that your chosen SD card was one that you had lying
    about when you bought your Raspberry Pi. It might be sped up, but it may not be
    the best performance you can get. SDHC card with plenty of space is recommended.
    Such media is expensive, so be a buyer: on a SD card in 2016 means a little more
    care in choosing a known brand.'
