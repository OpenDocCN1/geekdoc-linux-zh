  md: '![](img/30dc0459712b32ede1a3814d456b41b6_150_0.png)


    Above For a full breakdown of Yum/DNF differences, check out http://dnf.readthedocs.org/en/latest/cli_vs_yum.html


    # “DNF is an improvement over Yum, using the dependency solver hawkey and then
    librepo for repo operations and libcomps for package groups”


    Perhaps the biggest change in Fedora 22 is the replacement of its package manager
    Yum with DNF (Dandified Yum). DNF is a real improvement over Yum, using the dependency
    solver hawkey and then librepo for repo operations and libcomps for package groups.
    DNF will also skip over updates and repos that don’t work without halting the
    entire operation, it makes the update and upgrade commands equivalent, and it
    will also remove dependent packages that were not installed by users. For now,
    Yum is still aliased and you’ll see a reminder that it is now deprecated if you
    try to run a Yum command, but then the DNF equivalent of your operation will run,
    which is handy.


    Some great changes have also been brought to Fedora courtesy of GNOME 3.16 – chiefly,
    the new notification system. Notifications are now displayed at the top-centre
    of the screen instead of the bottom, and these have been integrated into the calendar
    popover where you can clear them individually or all at once. Another nice touch
    is that the terminal noties you once long-running jobs are complete. GNOME Shell
    and other themes have seen a number of improvements too, from small touches like
    the way that window resizing and placement works, through to more integration
    between different desktop environment themes, so apps from other environments
    feel more like native apps.


    Files has a new popover that enables you to set the zoom level and sort order,
    and you can now send files to the trash using the Delete key without having to
    hold Control. Scrollbars have also been replaced with a new overlaid scroll marker
    which is slimmer and minimal, designed to keep out of your way until you mouseover,
    at which point the full scrollbar appears. You also have dotted lines along the
    top and bottom of your windows to indicate further content, and there’s a pulse
    when you hit the top or bottom, all of which are small, but very welcome touches
    that enhance your user experience in a subtle but significant manner.


    # Pros


    The new GNOME 3.16 features and the DNF package manager are highlights, and the
    three editions are well suited to their purposes


    # Cons


    It’s hard to fault this release – it’s a solid improvement on Fedora 21 and the
    switch to DNF has been very well implemented


    ![](img/30dc0459712b32ede1a3814d456b41b6_150_1.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_150_2.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_150_3.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_150_4.png)


    # Summary


    Virtualisation is now lesser across all editions of Fedora 22, and DNF should
    prove to be a worthy successor to Yum. Factoring in the subtle but important design
    changes and new features, this release is an excellent progression for the distro.


