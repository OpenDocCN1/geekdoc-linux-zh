- pgno: 52
  md: '# **Tips | Tricks | Hacks | Apps**


    ![](img/30dc0459712b32ede1a3814d456b41b6_52_0.png)


    **15 RAID 5 and 6**


    RAID 5 and RAID 6 are excellent concepts – using a mixture of striping and mirroring
    across several drives so that up to 75 per cent can be used for storage while
    still being safe from hard drive failure. This offers more storage than a standard
    RAID 10 with the same redundancies (in theory), and RAID 6 increases the redundancy
    but decreases the overall storage of five drives to 60 per cent of their full
    capacity.


    While it’s supported in btrfs there are still bugs, and even at the best of times
    5 and 6 can be a hassle. For more details on RAID 5 and 6 in btrfs, visit the
    documentation https://btrfs.wiki.kernel.org/index.php/RAID6.


    **16 Create snapshots**


    The way btrfs writes data means that the old version of modified data still exists
    as long as there’s free space – this means you can ‘roll back’ files up to a certain
    point. However, you can also create snapshots of subvolumes that are more permanent.


    **17 Add a subvolume backup**


    To create this snapshot, head back into the terminal and make sure you know where
    the subvolume lies. The snapshot will be created in the btrfs partition, but it
    is best to put it in a separate location to the original subvolume1 to save confusion:


    $ btrfs subvolume snapshot btrfs/subvolume1 btrfs/snapshot-1


    **18 Include a roll back snapshot**


    The individual snapshots can be mounted on their own and you can also replace
    a newer version with an older version. First of all you will need to list the
    snapshots that exist for a subvolume, and you can do this in the terminal with:


    $ btrfs subvolume list btrfs/subvolume1


    **19 Set default**


    Note down the id for the snapshot (in our case, 258) and then set it as the default
    for the subvolume1 by using:


    $ btrfs subvolume set-default 258 btrfs/


    Then unmount and remount the subvolume to make the changes occur.


    **20 Remedey defragmentation**


    Due to the way btrfs writes files, which we outlined in an earlier step, this
    can cause significant fragmentation. This is a well-known issue though, so btrfs
    has an in-built defragmentation tool that work even while the volume is mounted.
    You can use it with:


    $ btrfs file system defragment btrfs/


    **21 The future file system**


    With all these tools you should be well on your way to working with btrfs as a
    replacement for your other file systems. It is a truly excellent concept for the
    next generations of fs and it’s a great idea to get on board with it now.


    ![](img/30dc0459712b32ede1a3814d456b41b6_52_1.png)'
  merge: -1
  img_proc: true
