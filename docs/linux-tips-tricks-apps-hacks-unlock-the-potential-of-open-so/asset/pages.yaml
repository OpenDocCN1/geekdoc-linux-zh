  md: '# Tips | Tricks | Hacks | Apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_155_0.png)


    Slight changes to the transparency effects and colours make navigating the already
    great Mint Menu just that bit better


    Edge tiling is improved with a new lock feature that means windows you wish to
