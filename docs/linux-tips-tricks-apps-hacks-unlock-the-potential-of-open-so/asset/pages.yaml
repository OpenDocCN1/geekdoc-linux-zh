    # # Fedora 22


    Fedora branches into three distinct variants for its latest release, building
    on the solid foundations laid in Fedora 21


    +   - CPU

    +     1 GHz

    +   - RAM

    +     1 GB

    +   - Storage

    +     10 GB


    In the words of the developers, “If this release had a human analogue, it’d be
    Fedora 21 after it’d been to college, landed a good job, and kept its New Year’s
    Resolution to go to the gym on a regular basis.” Fedora 22 isn’t a huge departure,
    but it does introduce some great features and expands on those brought in for
    the previous release. There are now three separate editions of the distro, each
    tailored with packages to suit its purpose: Cloud, Server and Workstation. We’re
    focusing on the latter here, the desktop edition, although there are some noteworthy
    features in the other two, including Docker images and Vagrant Boxes for Fedora
    Cloud and a default XFS filesystem on top of LVM for Fedora Server.


    Vagrant has also been added to Fedora 22 Workstation, continuing the focus on
    virtualisation for this cycle, while the UI for Boxes has also been totally revamped
    with a better box creation assistant, new preferences, default display scaling
    and a new feature that lets you send keyboard shortcuts through to a box. In terms
    of software there are some other improvements with Fedora. KDE Plasma 5 and LXQt
    have both been packaged for this release, there’s a brand new IDE for GNOME called
    Builder, including features like split-panel editing and a Markdown preview, and
    there’s a new Upgrader Assistant that assesses your system to ensure it’s ready
    for the next upgrade. At the back end, Fedora is now a step closer to running
    on Wayland, with the display server being used for the GNOME Display Manager in
    this release (although the GNOME session still uses X), and the Elasticsearch
    indexing server has been integrated with the Fedora repos.'
