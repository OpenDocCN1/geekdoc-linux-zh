    # Build your own Qt5-powered desktop


    Discover Qt5-based desktop applications that could fit an LxQt environment


    LxQt is a great lightweight desktop environment, but it''s still in the early
    stages of development and lacks many vital features. However, it is a very promising
    and modern software built around the Qt5 graphic library. For many, the best way
    to try out a Qt5-powered desktop is the new Plasma 5 from the KDE project, but
    we will go a different way. We''ll be purists and try to use only Qt5 applications
    in everyday life together with LxQt, and entirely away from KDE. What''s the point?
    This will reveal the general readiness of the Qt5 applications stack and its feature
    coverage. With acceptable compromise in mind, we will try to show you modern yet
    compact programs


    for common desktop activities. The whole idea is also a test ground for building
    a lightweight Linux solution which could be useful on low-end machines. The LxQt
    desktop was chosen just for test purposes thanks to its great availability on
    Linux (BSD users would most probably prefer Lumina). So we are going to look at
    certain distros to find out which LxQt delivery is particularly good, and then
    we will install and become acquainted with the Otter browser, PhotoQT image viewer,
    Trojta mail client, Albert launcher, DrawPile collaboration tool, SMPlayer, FocusWriter
