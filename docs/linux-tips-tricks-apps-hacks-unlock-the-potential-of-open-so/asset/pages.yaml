  md: '![](img/30dc0459712b32ede1a3814d456b41b6_118_0.png)


    # 01 Find the builder


    ![](img/30dc0459712b32ede1a3814d456b41b6_118_1.png)


    # 03 Select an image type


    After putting in your email address, you have a selection of image types to use.
    ISO is a pure image of the distro, able to be used for live booting from a CD
    or USB device only. Netboot is the kind generally used in net booting, which is
    over the network live boot/installation. Isohybrid combines both CD ISO live booting
    with the ability to use it to live boot off other live mediums (such as a USB
    stick), separate CD ISO and HDD/USB) images and a compressed version. Isohybrid
    works for most situations.


    # 04 Type of Debian


    You have a bit of choice on what kind of distro you can create for the ISO. You
    can select between Debian Testing (currently Stretch) and Sid for the image –
    Sid is the unstable image and you should probably stick with testing. Otherwise,
    you can also choose the desktop environment to be used by default by the system
    – there’s a wide variety, along with having the option for no desktop at all.


    # 05 Default package choice


    You can set the ISO to have certain packages installed as part of the default
    package list using the ‘cgpakcages.list.chroot’ field. All you need to do is add
    the package names to the list separated by a space – ensure you get the exact
    package names correct though, so perhaps check the spelling in a standard live
    booting Debian before you add it to the list. There’s a limit of 255 characters,
    so make sure to add only the essentials.


    Above There’s plenty of documentation to help you work with the system’s tools


    ![](img/30dc0459712b32ede1a3814d456b41b6_118_2.png)


    # 06 Architecture choice


    Choosing whether to have a 32 or 64-bit ISO is entirely dependant on the use cases
    you have planned. A 32-bit ISO (i386) will be more universal, working fine on
    older systems as well. This can be good for general troubleshooting or maintenance.
    For getting the most out of a system though, a 64-bit ISO (amd64) is preferable.
    You can always go back and create a second ISO with a different architecture if
    you desire, though.


    # A more manual process


    The live system builder uses software available in Debian that can be used to
    create your ISO using your current setup as a base. It uses the same commands
    and options as the web version and builds it locally on your system. The package
    is called live-build.'
