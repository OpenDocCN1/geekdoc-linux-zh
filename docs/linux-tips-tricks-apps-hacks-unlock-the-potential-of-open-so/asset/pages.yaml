- pgno: 31
  md: "# **Tips | Tricks | Hacks | Apps**\n\n# **“Print a cheat sheet of the navigation\
    \ keys or keep a window open on the Mutt manual”**\n\n![](img/30dc0459712b32ede1a3814d456b41b6_31_0.png)\n\
    \n![](img/30dc0459712b32ede1a3814d456b41b6_31_1.png)\n\n+   Mutt\n+   in a hurry\n\
    +   \n+   - Need to quickly copy a file from your server? Just issue this at the\
    \ command line to send it to your log file home:\n+   \n+       `mutt -s “PS Syslog\
    \ tail: ‘A starting syslog ’ -m /var/mail/log`\n+   \n+   - Press Enter to confirm\
    \ your choice then Y to send. Mutt enables many attachments from the commandline,\
    \ so following them with the double dash(- -) tells it that you have finished\
    \ attaching and that it should pay attention to the address.\n\n**05  Keyed up**\n\
    As you navigate around your email, K and J for up and down – inherited from the\
    \ Pine and Elm mailers – means keeping your fingers on the home row. If you use\
    \ a Dvorak or Colemak keyboard, you will want to rebind the navigation keys in\
    \ .muttrc for your home row, using the following for Colemak, for example:\n\n\
    ```\n```text\nbind generic n next-entry\nbind generic e previous-entry\n```\n\
    ```\n\nPossibly replacing top-page (bound to H) and bottom-page (L) as well. Print\
    \ a cheat sheet of the navigation keys or keep a window open on the Mutt manual\
    \ until you’ve learnt the most useful ones. Initially, you can get a long way\
    \ with Enter, Q (to quit) and the arrow keys.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_31_2.png)\n\
    \n**06  Send an email**\nTest your config by sending an email. Hit M to compose,\
    \ which will prompt you for recipient and subject, then open up your default text\
    \ editor (Mutt is a mailer; composition is a text editor’s job). Saving the message\
    \ returns you to the send dialog, then hit Y to send or use various options for\
    \ cc, bcc, attachments and more.\n\nYou may now be in the Drafts folder of your\
    \ email account. Hit C to change mailbox, then ? to get a list of choices and\
    \ navigate back to your inbox. Having rushed through the basics, let’s see some\
    \ of Mutt’s real power.\n\n**07  Macro power**\nCommand line apps are amenable\
    \ to automation in a way that mouse-driven programs can’t be. A macro saves a\
    \ series of keystrokes normally applied to Mutt interactively, such as those to\
    \ open a mail and then its attachment(s), all bound to a keyboard shortcut.\n\n\
    Macros are defined in .muttrc with the form:\n\n```\n```text\nmacro menu key sequence\
    \ [ description ]\n```\n```\n\n… where ‘menu’ is Mutt-speak for the part of Mutt\
    \ you’re using – the pager, index view, composer, attachment, etc. In Step 5 we\
    \ used `generic` as a meta-menu for all menus where common navigation functions\
    \ are available; so ‘Key’ is your defined shortcut key – C is the Control key\
    \ and ‘ is Escape, so if you wanted to bind a sequence to Ctrl-x, Ctrl-c, you’d\
    \ need ^C\\Cx\\Cc. When using a sequence, you put in the function names (rather\
    \ than their common keyboard shortcuts) within angle brackets.\n\nIf there is\
    \ a space used anywhere, then the whole sequence needs quoting:\n\n```\n```text\n\
    macro index,pager <f1> {\"\\<shell-escape\\less / usr/local/doc/mutt/manual.txt\\\
    <&enter\\>\" \"Show Mutt documentation\"}\n```\n```\n\nThe description at the\
    \ end is optional, but makes life easier.\n\nAs with dot-files (including .muttrc),\
    \ your favorite search engine will find you several examples, much like those\
    \ displayed in our screenshot.\n\n**08  One tag to rule them all**\nScrolling\
    \ through your messages you notice half a dozen that can all be treated the same\
    \ way – moved or deleted, for example – something that would be a pain if navigating\
    \ with a mouse. In Mutt, hit T on each message to tag them and, when you’ve finished\
    \ tagging, hit ; followed by D to delete them all, or else use some macro on them.\n\
    \nAfter hitting delete, you’ll see that the asterisk (which was showing the message(s)\
    \ as tagged has been replaced with a D, indicating the message will be deleted\
    \ when you leave Mutt. Why not delete it straight away? Maybe it gives you a chance\
    \ to go back and change your mind – perhaps the tagged just one message too many."
