  md: "# # Tether Raspberry Pi to an Android device\n\nNeed the internet on your Pi\
    \ on the go? Try out a physical tether to your Android device for instant online\
    \ access\n\nThe portability of the Raspberry Pi is one of its most lauded features\
    \ and you can get many different accessories to help aid this portability. Mini\
    \ screens, mini wireless keyboard and mouse combos, portable batteries and more\
    \ can get you out and about, but the internet is a stumbling block that you can't\
    \ easily fix with an accessory. What you do also usually have with you is an internet-connected\
    \ magic pocket box called a smartphone that, with a bit of know-how, you can connect\
    \ the Pi to and steal some internet from. Over the next two pages we will impart\
    \ this know-how to get you using your Raspberry Pi on the internet when you're\
    \ on the go.\n\n+   **01 The easy way**\n+   \n+   A lot of smartphones now have\
    \ a Wi-Fi hotspot feature, which the Raspberry Pi can easily attach to. First\
    \ of all, turn the hotspot on and then boot into the Pi. Connect a wireless dongle\
    \ and open up the `wpa_gui` in Preferences > Wi-Fi Configuration.\n\n+   **02\
    \ Scan for device**\n+   \n+   Click Scan to open up the scan window and then\
    \ select Scan again from inside there. It should pick up your device - connect\
    \ it as you would to any Wi-Fi network and the Pi will remember it for when it\
    \ needs it next.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_115_0.png)\n\n**What\
    \ you'll need**\n- Android device\n- USB cable"
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_116_0.png)


    # 03 Set up tether


    First connect your phone to your Raspberry Pi via a USB cable — depending on the
    amount of power your Pi has, it might have trouble charging your phone but it
    will still let you tether. In the tethering menu you can now activate USB tethering.


    ![](img/30dc0459712b32ede1a3814d456b41b6_116_1.png)


    # 04 Check connection


    Your Android device will create an interface known as eth0 on the Raspberry Pi.
    You can check to make sure this is happening, and that it will let you tether,
    by opening up a terminal and typing the following:


    ```

    `$ ifconfig`

    ```


    # 05 Quick connect


    You can connect from the terminal right now to access the internet. You should
    be able to do this by typing the following into the terminal:


    ```

    `$ sudo dhclient usb0`

    ```


    This will automatically grab any available IP address that your phone will give
    to it.


    ![](img/30dc0459712b32ede1a3814d456b41b6_116_2.png)


    # 06 Test connection


    Once a few ways to test your connection. We’d usually stay in the terminal and
    ping www.google.com, which you can do, or you can click on the browser and see
    if it loads the page.


    # 07 Save the settings


    Once you reboot your Pi, it won’t remember to automatically connect to the phone’s
    tether. However, we can add an entry to its config so that it will try and do
    this in the future. From the terminal use:


    ```

    `$ sudo nano /etc/network/interfaces`

    ```


    # 08 Interface settings


    Here you’ll find all the current network settings – yours might look different
    from ours depending on if you have added any fixed wireless settings or passthroughs.
    Using the same syntax as the eth0 line, add:


    ```

    `iface usb0 inet dhcp`

    ```


    # 09 Tether on the go


    After a save and reboot, your Pi should now automatically connect to your phone,
    whether it’s via Wi-Fi hotspot or a physical connection. It may draw a little
    more charge than usual while tethering, so be sure to keep an eye on your battery
    level.


    Above It’s usually easy to figure out which device is your phone — set it right
    next to the Pi and it will be the one with the best signal!


    # Mobile data


    Using your Pi on your mobile phone will eat up data much faster than browsing
    on your phone normally is. We suggest not doing a full software, distribution,
    or firmware update if you don’t want to spend a fortune on data. You can also
    set limits on the amount of data used on your phone to save yourself any problems,
    and a physical tether will allow you to connect to the phone’s Wi-Fi if that’s
    an option.


    Linux Tips, Tricks, Apps & Hacks 117'
  merge: -1
  img_proc: true
