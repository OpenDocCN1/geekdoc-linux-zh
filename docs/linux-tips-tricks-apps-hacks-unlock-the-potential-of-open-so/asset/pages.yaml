  md: '# Tips | Tricks | Hacks | Apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_49_0.png)


    # Switch to the btrfs file system


    Discover how to set up and use all the great features of the next generation of
    file system, btrfs


    The ext3 and ext4 file systems have been a mainstay of Linux for a long time –
    very standard, partition-based file systems that have some neat defragmentation
    policies.

    They’re used all the time by desktop distros and servers and such, even within
    LVMs that some distributions like to create.

    There’s always a new challenger though, and for the past few years Fedora has
    been desperately trying to get btrfs in as the default file system of the distro.
    It’s considered the


    next step in Linux file systems and has some excellent features that should make
    it a perfect choice for the evolution of Linux.

    With the ability to create sub-partitions within itself that are easier to manage
    than LVM, a degree of roll-back, advanced compression and defragmentation tools
    tailored to itself and more, btrfs will revolutionise the way we use storage.
    We’ll show you how you can get ahead of the curve in this tutorial.


    # Resources


    Gparted http://gparted.org

    btrfs-tools'
