    ![](img/30dc0459712b32ede1a3814d456b41b6_110_1.png)


    # 08 Manage your mailbox


    # 09 Enjoy music and videos with SMPPlayer


    SMPPlayer is a top-notch media beast, which can play almost any media, both local
    and remote, and even some Blu-ray discs. There''s a PPA for Ubuntu family (ppa:vmw/SMPlayer),
    but it offers SMPPlayer with Qt4, while we need a Qt5 version. So issue the following:


    ```

    `sudo apt-get build-dep smplayer`

    ```


    Then download the source tarball (bit.ly/1B18gPT) and use instructions from the
    Install.txt file there. The Qt5 switch is applied to the make command this way:


    ```

    `make QMAKE=/usr/lib/x86_64-linux-gnu/qt5/bin/qmake`

    ```


    Of course, you should have qt5-qmake and other Qt5 dev packages installed beforehand.


    # 10 Write text with FocusWriter


    FocusWriter is a simple typewriter-like editor which hides away almost all controls
    in order not to distract you from writing. Yet there are many useful features
    such as auto-saving, live statistics, spell checking, multi-document support and
    many more. You can install it using the official PPA:


    ```

    `sudo add-apt-repository ppa:ggatecode/gcppa

    sudo apt-get update

    sudo apt-get install focuswriter`

    ```


    # 11 Add fun with Cool Retro Term


    LxQt already has a great QTerminal application with tabs support, colour profiles
    and more, but we can go even further and install Qt5 and OpenGL-powered old school
    terminal called Cool Retro Term. The following application mimics the historic
    cache tube tubes of Amiga, IBM and Apple workstations:


    ```

    `sudo add-apt-repository ppa:bugsb-launchpad-net-falkensweb/cool-retro-term

    sudo apt-get update

    sudo apt-get install cool-retro-term`

    ```


    Once it is launched you can switch between profiles or change the effects manually.
    It is even possible to scale up the whole screen so that Cool Retro Term will
    be as usable as a regular console application, which is handy.


    # Add more apps


    If you stay with your custom LxQt desktop, scanner or laptop you can''t inexhaustibly
    want more. The applications featured in this tutorial are not all the Qt5 applications
    out there, you can supercharge your system with the following:


    +   * **Votlair** A fun little 2D platformer game built on top of Qt Quick and
    LiquidFun libraries. Getting the game compiled in Linux needs skill, but there''s
    a perfect guide: bit.ly/1HLMB0P

    +   * **Friends** This app features a neat QML interface and is easy to install
    (sudo apt-get install friends-app), to use it you must refer to Unity''s Online
    Accounts section, so you must install K36 or at least its gpa-daemon (stored in
    \~/.config/gpa-1.0/)

    +   * **Rosa ImageWriter** This is a Qt5 port of famous SUSE Studio image writer.
    The app is improved for comfortable USB media writing. See bit.ly/ZgrrQL for applications
    that are dependent on KDE Software delivery and are difficult to use outside of
    certain DEs.

    +   * **Qt-apps.org** The qt-apps.org website is a vital bookmark! Flys a point
    to keep track of Qt5 applications. Most new, and updated titles appear there.'
