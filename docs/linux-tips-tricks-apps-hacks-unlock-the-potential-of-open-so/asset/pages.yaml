  md: "# Spin your own Debian\n\nUse Debian Live System tools to learn how to spin\
    \ a new Debian system customised for you\n\n+   01  **Find the builder**\n+  \
    \ \n+   For this tutorial we will be using the Debian Live System builder. This\
    \ is not only software that you can actually use on Debian, but also it has been\
    \ applied to a web service. We are going to use the web version of this, which\
    \ makes the setup slightly easier to parse and generally understand. You can have\
    \ a look at it by heading over to the following address: [http://live-systems.org.](http://live-systems.org.)\n\
    \n+   02  **Start the build**\n+   \n+   From this page you can read up on the\
    \ range of different uses for the software, including development info and old\
    \ versions of the build software and images used in it. For now, we are actually\
    \ interested in building a distro, so click on the **Build** tab that’s located\
    \ on the top bar and select the **Debian** option to get to the interface where\
    \ we can customise the build to our liking.\n\n**Debian 8.0 ‘Jessie’ is out now.**\
    \ It is an impressive and useful update, so now, you can either use it as your\
    \ stable distro, switch to 9.0 ‘Stretch’ as your new rolling release or create\
    \ your own custom Debian.\n\nHere, we’re going to look at creating a custom Debian\
    \ ISO using the Debian Live Systems project. With the project and website, you\
    \ can create your own custom version of the distro to deploy as you wish around\
    \ an office or in your own home.\n\nThe benefit of creating your own spin is the\
    \ ability to include specific packages that are particularly relevant to your\
    \ needs, have it work on specific architectures, and generally make it much more\
    \ suited to your needs.\n\nWe’ll be using the online tools available to create\
    \ this custom image but they’re very similar to the ones that exist within Debian,\
    \ which will enable you to create your own spin once you decide to go a little\
    \ more hardcore and edit it from the distro itself.\n\n# Resources\n\nDebian Live\
    \ builder\n\n[live-systems.org](live-systems.org)\n\n![](img/30dc0459712b32ede1a3814d456b41b6_117_0.png)"
