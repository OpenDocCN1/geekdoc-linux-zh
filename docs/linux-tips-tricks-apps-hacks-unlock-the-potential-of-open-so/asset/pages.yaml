  md: '# **03** Thumbnails in PCManFM


    ![](img/30dc0459712b32ede1a3814d456b41b6_108_0.png)


    # **01** **Choose a distribution**


    There is an abundance of easy-to-use Linux distros that could help you instantly
    get started with a usable LxQt desktop – it is up to you to make your pick.


    Lubuntu is a dedicated LxQt flavour of Ubuntu with a ‘daily’ PPA containing the
    most recent code (ppa:ubuntu-dev/lubuntu-daily). The PPA is compatible with most
    Ubuntu 14.04 and 14.10 derivatives, including Kubuntu, LXLE, Mint and many of
    the others. To get LxQt you will need to possess lxt-q-metapackage, lqt-session
    and lxsession packages.


    An alternative way to install LxQt could be Arch/Manjaro (LxQt is in AUR) or the
    development version of OpenManiva, which is shipped with LxQt by default (Plasma
    5 will arrive at a later date).


    # **02** **What we have so far**


    The desktop occupies –95 MBs of RAM. It features a control centre, power management
    applet, customisable bottom panel, look and feel settings manager, window manager
    chancier, QTManager console and PCManFM file manager. Keyboard layouts indicator
    and NetworkManager applet are currently missing, but you can take the XFCE applet
    and gorgeous CMST (frontend to ConnMan) respectively.


    # **03** **Thumbnails in PCManFM**


    We can tweak and add extra functionality to the PCManFM file manager. First, let’s
    add thumbnails support for filetypes other than images. For example, for PDF create
    a new file with the thumbnail extension at: /usr/share/thumbnailers with the following
    content:


    By default, the window decorations are managed by OpenBox but you can change it
    to Kwin or Emeralla. PCManFM is quite modest, but keep in mind that it is the
    only Qt5 file manager for the day.


    ```

    ```ini

    [Thumbnailer Entry]

    TryExec=convert

    Exec=convert %i[0] -thumbnail %s %o

    MimeTypes=application/pdf;application/x-pdf;image/pdf;

    ```

    ```


    Using this template you can add more types that ‘convert’ supports (it’s a part
    of ImageMagick).


    # **04** **Get Otter Browser**


    The Otter web browser is updated every week so if you’re interested in its progress,
    you can track its development on the project website. For Ubuntu-compatible Linux
    systems there’s a very handy PPA. So without further ado, let’s get into it straight
    away:


    ```

    ```bash

    sudo add-apt-repository ppa:otter-browser/daily

    sudo apt-get update

    sudo apt-get install otter-browser-git

    ```

    ```


    The Otter Browser has a variety of lovely features, such as tabs grouping, mouse
    gestures and a highly customizable UI. You can choose to set the browser as a
    default web application if you want by selecting otter-browser from the Web Browser
    menu in your System Settings.'
