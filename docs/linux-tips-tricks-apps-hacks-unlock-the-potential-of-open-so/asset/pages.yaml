- pgno: 136
  md: '# **BEST DISTRO FOR...**


    # # Everyday


    Is this the year of Linux? Or is it the year we stop claiming that? Either way,
    there are already plenty of choices for your day-to-day


    # ## Elementary OS


    ![](img/30dc0459712b32ede1a3814d456b41b6_136_0.png)


    An everyday distro is quite a broad thing; in this context we mean the kind of
    operating system you can use for just about anything and everything without really
    specialising in one specific area.


    ![](img/30dc0459712b32ede1a3814d456b41b6_136_1.png)


    Something that’s easy to use and its supplied tools aid your use of it.


    This is exactly the point where elementaryOS comes in. Aiming to be easy to use
    for people of all skill levels, elementaryOS is a beautifully designed distro
    that has had a lot of care put into it. Using an Ubuntu LTS as a base and ordering
    from a lot of existing design decisions, elementaryOS is hardly a completely original
    Linux distribution.


    ![](img/30dc0459712b32ede1a3814d456b41b6_136_2.png)


    > ■ **The simple, searchable applications menu** takes design cues from mobile
    operating systems


    What makes elementaryOS unique is its use of these design aspects and design decisions,
    putting together a wholly new desktop and distro experience that you can’t find
    anywhere else without some serious customisations on the user’s part. It’s the
    best of every world for people who prefer using a fully-featured graphical desktop,
    and it works extremely well on new and modern systems.


    The wording on the website is inclusive and friendly to newcomers as well – not
    once is there mention of Linux or distribution, instead using wording familiar
    to everyone and rightfully referring to elementaryOS as a whole as an operating
    system. This kind of friendliness and familiarity is translated to the desktop,
    from a simple dock bar that grants access to important programs from the moment
    you start using it to an applications menu reminiscent of modern smartphone design.


    The stable Ubuntu base also grants access to an unprecedented level of packages
    and other desktop types if you want something a little different to elementary’s
    offering. It’s a great first distro for people who want to make the switch to
    Linux as well.


    > ■ Elements like the dock and window styling will look familiar


    # **BEST FOSS**


    # ### LibreOffice


    The office suite that has far surpassed its originator, LibreOffice can handle
    all your word processing, spreadsheeting and presentation needs extremely well
    with a selection of excellent software.


    # ### Firefox


    Once again the king of the browsers, with half a billion users around the world,
    Firefox has privacy and customisability in mind with its design. Due to some excellent
    cross-platform tools, you can use it wherever you want.


    # ### Thunderbird


    The email counterpart to Firefox has remained a very strong email client on any
    operating system for a long time. With a great range of add-ons and extensions,
    you can have it work exactly as you’d want it to.


    # ### Cinnamon


    The desktop environment originally made for Linux Mint, Cinnamon uses a more traditional
    desktop layout and a lot of common sense design choices and workflow methods that
    make the most of modern tech and traditional ideas. It’s an improvement on many
    default desktops.


    # ### Shotwell


    Excellent photo management software used by a lot of distros, Shotwell even has
    some basic support for RAWs. You can perform batch operations to tweak colours
    and lighting, or just organise photos into specific tags.


    # ## ALTERNATIVE DISTROS


    # ### Linux Mint


    Another firm favourite as an everyday distro, Linux Mint would have taken this
    top spot had it not come upon a time due to excellent design over two fantastic
    desktops on top of an excellent distro.


    # ### Ubuntu


    Ubuntu is probably the most popular ‘out-of-the-box’ desktop, with more well-known
    which means a lot of software supports (and not all of it free). You can customise
    it to suit you if you want, off-the-cuff base.


    # ### Mageia


    Mageia is a very trendy ‘minimalist’ distro that is a bit different to our ‘simplest’
    distro, since it’s more about everything aspect of the distro & being with your
    own default desktop, so it’s not that hard to modify & tweak it to suit you.


    | 9/10 |

    | 7/10 |

    | 6/10 |

    | 8/10 |

    | 10/10 |

    | 9/10 |

    | 9/10 |

    | 7/10 |'
  merge: -1
