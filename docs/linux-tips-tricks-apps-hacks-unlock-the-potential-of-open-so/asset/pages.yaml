    # Run your own chat channel with Scrollback


    Scrollback builds chatrooms that enable you to communicate and engage new audiences


    Communication is one of the most important aspects of our lives. Whether you think
    of peer-to-peer communication or a brand communicating to its audience, it''s
    important to convey things effectively. The rules are simple: whoever communicates
    well wins.


    With the digital world now handling most of our communications, it''s important
    to choose the right words and have the right tools, because without these there''s
    no way that your audience can understand you. One of the common communication
    tools is the chat application. Generally based on a server-client model, such
    tools are available a dime a dozen, but each tool has a problem - some look ugly,
    some don''t support chatrooms, and some are based on the IRC protocol only. There
    is rarely an application with everything in one package. However, we will cover
    one here that can help you do it all - from chatrooms to embedding, websites to
    chat archiving, everything you''d expect from a chat application, with a new UI.
    Scrollback, based on a server-client model, has a web-based UI that opens in a
    browser with no need for a client application. We''ll go through the installation
    and its features in this tutorial. We have used Ubuntu 14.04 as the host system
    and the latest source code from Scrollback''s GitHub repository.


    # Resources


    +   - Scrollback

    +       [scrollback.io](scrollback.io)

    +   - GitHub repo

    +       [bit.ly/1GfFLp](bit.ly/1GfFLp)


    **01 Install the script**


    Installing Scrollback is pretty straightforward; you can just go to their GitHub
    page and run a single-line command that''s available there to instantly install
    Scrollback on your server. The command basically invokes a script where all the
    action happens. Now, we as open source enthusiasts can''t just let that happen
    so easily! This is one of the most exciting parts of open source software. You
    can view the code and take charge, rather than just clicking things away. However,
    if you are just interested in running Scrollback immediately, you can skip to
    Step 3.


    Let''s take a look at what happens when you run the script. It starts with trapping
    signals and sanity checks, like a user privilege check and supported distros check
    - supported distros are Ubuntu, Arch Linux and Fedora. If you are running something
    else, you need to manually install Scrollback. In the next step we''ll take a
    look at the various dependencies of Scrollback and their installation in the script.


    **Below** Scrollback provides a neat, clean interface to manage all your conversations


    ![](img/30dc0459712b32ede1a3814d456b41b6_33_0.png)'
