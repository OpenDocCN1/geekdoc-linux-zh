  md: '![](img/30dc0459712b32ede1a3814d456b41b6_148_0.png)


    Above Synaptic still takes care of your package management.


    # “Installation is straightforward, using a simple graphical installer with the
    live desktop versions that offer enough control and options to create a very decent
    system”


    Installation is straightforward, using a simple graphical installer with the live
    desktop versions that offer enough control and options to create a very decent
    system before you even log in for the first time. It takes a bit more babying
    than modern Ubuntu and Fedoras, but the actual installation process is not particularly
    time consuming on a medium- to low- powered modern system.


    Using Debian once it''s installed is as advertised: stable. We had no issues using
    it in day- to- day situations. By default there''s a fair bit of software installed
    on the distro, so you can quickly get started with any work that you wanted to
    do. Package management in the desktop environments is handled by the old faithful
    Synaptic; this also includes any software or other updates for the system, which
    you''ll have to remember to do yourself rather than relying on a pop- up notification.


    Another addition to the stable branch that''s particularly notable over Wheezy
    is the switch to systemd – it looks as though this year will continue the trend
    of distros adopting this as their new system manager. From a general user perspective,
    it won''t matter to you at all. You can still continue to use Debian as your operating
    system without everything upending itself.


    As for devs, Debian does at least offer users the choice of rolling back to an
    init-based system, so if it''s being that egregious, you do at least have the
    choice for the next few years of long- term support.


    Right now, Jessie is great: it is light and offers a range of options for every
    kind of user. Testing may still be the preferred distro for some though, as software
    inevitably becomes outdated over time, which can be an inconvenience.


    People who are looking for a stable distro to serve them over the next few years
    will be more than happy with this version of Debian 8. There is even more choice
    available and a lot of the software is at an excellent up- to- date state.


    # Pros


    Stable, reliable, comes with a great selection of software and is very easy to
    customise to your individual specifications


    # Cons


    Aside from security updates, Jessie will remain at this level of software for
    the duration of its time as stable.


    # Summary


    Debian 8 is a fine new staple in the Debian line of distros, perfect for all kinds
    of users. For at least the next six months, while still excellent for those who
    like ease of use, familiarity, and good security on one distro for a more- extended
    period of time.


    🐧🐧🐧🐧🐧'
