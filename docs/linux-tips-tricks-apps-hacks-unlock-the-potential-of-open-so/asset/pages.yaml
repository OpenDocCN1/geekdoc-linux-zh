- pgno: 94
  md: '# 16 Explore options


    ![](img/30dc0459712b32ede1a3814d456b41b6_94_0.png)


    **14 Export the file**

    Once you''re done with the file, export it to your preferred file type. We''ll
    be using **VLC** for the transcription stage, so you can use pretty much any filetype
    you can think of – although let''s not try and test **VLC** at this stage. We
    want to make the process easier not harder.


    **15 Configure VLC**

    If you don''t already have **VLC**, it''s time to install it. We will make use
    of the global hotkeys for this part, which will enable us to control it from a
    different window. Once it''s installed, open it up.


    **16 Explore options**

    Go to **Tools** on the menu bar and continue onto **Preferences**. At the **Show**
    Settings option, go to **All** to get the advanced settings up. Scroll down and
    look for the **Hotkey** settings option. Here''s where the global key settings
    are found.


    **17 Set the hotkeys**

    The most important ones we find are play/pause and very short jumps back and forth.
    Double-click on the global key you want to set and then perform the key combo
    that you want to use. We like to use **Ctrl+Space** for pause and **Ctrl+Right/Left**
    for skipping – make sure that what you use doesn''t clash with anything tough.


    **18 Get set up**

    The moment of truth is almost here – get your word processor or text editor up
    and get ready to type. Close **VLC**, then open up the audio file and have it
    play. Go back to your document and try out your new global hotkeys – if all goes
    well, you can now skip backwards, forwards and pause without leaving the transcription.


    **19 Time to transcribe**

    You can start transcribing right now if you wish. One trick we use is to slow
    down the audio just slightly in **VLC** – you can do this by going to **Playback,
    Speed** and then clicking **Slower**. This reduces the speed down by about **25%**
    and can usefully give you just a bit of extra amount of time to write something.


    # Machine transcription


    The state of voice recognition on **Linux** is poor – there are **APIs** and workable
    acoustic models that can actually parse what you''re saying into sounds and such.
    The main issue right now: the lack of open language models – dictionaries full
    of words and common grammatical phrases. Unfortunately this means, for the time
    being, that there are no real **POSS** solutions to machine transcribing that
    you can then fix later.


    **20 Transcribe better**

    With this setup, your transcriptions should take a lot less time and generally
    be a little easier to do. Hopefully, this will mean your final product, whether
    it''s for your blog or a newspaper article, or one of the many other text outlets
    out there, turns out even better. Play about with some of the things we have covered
    in this tutorial to make a setup that perfectly suits your needs, and you''ll
    be getting to the heart of your subject in no time.'
