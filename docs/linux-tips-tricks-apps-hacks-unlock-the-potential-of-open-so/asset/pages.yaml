  md: "# 04  Embed to  \nwebsites\n\n![](img/30dc0459712b32ede1a3814d456b41b6_35_0.png)\n\
    \n**Above**  Embed a \nsmall chat window \non your site using \n*ready-made* code\n\
    \n# 04  Embed to websites\n\nAnother great thing you can do with Scrollback is\
    \ embed the chat window directly in your website. In simple terms, the whole window\
    \ is miniaturised and can be accessed via a small window on the website. Embedding\
    \ the chatrooms on websites gives you an opportunity to engage more people in\
    \ an easy-to-manage manner. It is far better than an email-based subscription\
    \ because it allows for instant communication and possibly a better experience\
    \ overall. Your website visitors can also take advantage of all the information\
    \ already available in your chatroom. They just need to see the discussions list\
    \ and click on the one relevant to them in order to use it.\n\nTo embed your chatroom\
    \ in a simple HTML-based website, go to the Share & Embed tab in the Room Settings\
    \ page. Scroll down to view the embed code – yes, it is already there! Now copy\
    \ and paste it in just before closing the `</head>` tag in your website. That’s\
    \ all it takes; your visitors can now see a miniature version of your chatroom\
    \ on your website. There is also the option to add a whitelist of domains where\
    \ the room can be embedded. If you leave that field empty, you are implying that\
    \ you will be enabling embedding anywhere, which isn’t ideal.\n\n# 05  WordPress\
    \ websites\n\nWordPress powers around 23 per cent of the whole Internet. That\
    \ is a very vast number, and with that comes the opportunity for you to engage\
    \ visitors in meaningful conversations within a community, rather than just one-to-one\
    \ chats. Scrollback does well to take advantage of this medium – you can very\
    \ easily integrate your Scrollback chatroom to a WordPress website, this time\
    \ without even touching a single line of code.\n\nTo use Scrollback with WordPress,\
    \ log in to your WordPress admin console and go to Plugins>Add New. Search Plugins.\
    \ Type Scrollback here and start the search. You will then find the Scrollback\
    \ plugin, so just install and activate it. Once it’s activated, fill in the name\
    \ of your chatroom (the room that you want to embed to your site), and that’s\
    \ it! Go to your WordPress website and you will now be able to see the Scrollback\
    \ chat window in the bottom-right corner of your website.\n\n**Index for \nsearching**\n\
    You can also choose **if your chatroom is available for room-search indexing**.\n\
    \nTo enable search, go to the Room Settings area > **Search**.\n\nVisit the *tab*\
    \ and enable the *Allow search* switch.\n\nTo index your search engine, go to\
    \ [admin section] > *index*, then click on the *Done* button.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_35_1.png)\n\
    \n# 06  Use Blogger\n\nSeveral bloggers prefer Google’s **blogger.com** instead\
    \ of taking the pain to host their own WordPress or other CMS based websites.\
    \ Let’s see how to add Scrollback rooms to a **blogger.com**-based website. As\
    \ we did in Step 4, you will first need to copy the code snippet from Scrollback.\
    \ Once you have the code snippet copied, go to your **blogger.com** account, then\
    \ *Options*\\>*Layout*\\>*Add a Gadget*. On the next page, select HTML/JavaScript.\
    \ Finally, just paste the code to the content section and click **Save**. Your\
    \ **blogger.com** website is now integrated with Scrollback.\n\n![](img/30dc0459712b32ede1a3814d456b41b6_35_2.png)\n\
    \n# 07  Link IRC channels to Scrollback rooms\n\nIRC (Internet Relay Chat) remains\
    \ a tried and tested way to maintain a healthy communication among community members.\
    \ The process is simple – people can install IRC clients and connect to the server.\
    \ They can then follow relevant channels. However, IRC usage has been falling\
    \ recently. According to Wikipedia, IRC has lost 60 per cent of its users and\
    \ 50 per cent of its channels in the last decade. Such decline may be attributed\
    \ to the rise of various other forms of community management, such as Facebook\
    \ groups, Twitter lists, Whatsapp groups and so on.\n\nScrollback aims to bridge\
    \ this gap between IRC and non-IRC users. It enables you to link your existing\
    \ IRC channel to a Scrollback room and reach out to the non-IRC users, giving\
    \ them an easier entry point to your community. This also enables you to make\
    \ use of Scrollback’s legging features and help track discussions easily. To link\
    \ your chatroom to an IRC server, go to **Room Settings**\\>**IRC Integration**.\
    \ Fill in the IRC server link (eg, *irc.mozilla.org*) and the IRC channel (eg,\
    \ *#mozilla*), then click **Done** to save the changes. The IRC channel operator\
    \ needs to type /invite scrollback *#mozilla* in the IRC channel to complete the\
