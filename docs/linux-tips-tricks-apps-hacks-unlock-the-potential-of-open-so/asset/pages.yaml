  md: '![](img/30dc0459712b32ede1a3814d456b41b6_36_0.png)


    # ### 08 Twitter integration


    Scrollback offers a tight integration with your Twitter account. You can watch
    hashtags, tweet chat messages directly from chat window and even share your chatroom
    via tweets. So let’s see how to achieve all this. First go to the Twitter integration
    tab and enter the hashtags that you’d like to watch, separating hashtags with
    spaces, and click on the ‘Sign in to Twitter’ button. Then, in the Twitter window,
    log in and review the privileges – that’s it. You can now see all of the tweets
    that have the hashtags you want to watch right inside your chatroom.


    If there is a message in your chatroom that you want to tweet, just hover on the
    message to reveal a menu icon on the extreme right side of the page. Then click
    on this icon to show the different options – you can either choose to tweet the
    message or hide it. To share your room via tweets, go to the Share & Embed tab
    and click on the Twitter button under ‘Share your room’.


    # ### 09 Moderation features


    You can set the room description under the General settings tab. Since Scrollback
    is designed in a search engine-friendly way, it is very important to set the description
    properly. The Permissions tab lets you decide on people who can post in your chatroom.
    You can select anyone, or only the logged-in users or followers of the chat room.


    One of the major concerns a chatroom moderator faces involve spammers and abusive
    behaviour. Scrollback enables moderators to control such issues easily – just
    enable the Spam Control button under the Spam Control tab, and Scrollback automatically
    blocks spammers from posting to your group. In the same tab, you can also set
    the blocked words list. If you enable the ‘English abusive words’ option, only
    the predefined words are blocked. You can make additions to the block list by
    entering the abusive words in the ‘Custom blocked phrases/words’ text area. Now
    even if people type abusive words into the chatroom, they won’t be visible to
    anyone else.


    > “It may happen that different people discuss different things. If you follow
    IRC channels, it’s a really common scene in there”


    # ### 10 Discussions


    One of the prime issues in a chatroom is tracking the discussion. A room generally
    has many people in different time zones. It may happen that different people discuss
    different things in parallel – if you follow IRC channels, it’s a common scene
    in there. In such scenarios, it becomes really difficult to track or get meaningful
    information out. If you have not noticed yet, Scrollback solves this problem in
    a very simple yet effective way. Just go to the Discussions tab and enable ‘automatically
    group text into discussions’. Now, Scrollback automatically segregates discussions
    based on words in chat messages and the user who types them. At any point, any
    user can create a discussion too simply by clicking on ‘Start a discussion’ in
    the chat window. All the discussions are archived under the Discussion tab on
    left side. To view one, simply click on the discussion name – the chat window
    shows all the messages under that discussion in a useful colour-coded format.


    Aboue Add Twitter hashtags to your settings to view the related tweets inside
    your chatroom'
