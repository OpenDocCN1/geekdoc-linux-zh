    # Host your own media gallery with MediaGoblin


    MediaGoblin provides a way to share videos, photos or audio recordings with your
    loved ones, without worrying about privacy


    YouTube is not only a website anymore, it''s become a phenomenon. Millions of
    hours are spent – or wasted – daily in watching videos of cats, dogs and humans
    doing strange things. With the predictive playlist appearing just after you finish
    a video, it is sometimes very difficult to close the window and you go on and
    on, watching one video after the other. But YouTube is a dangerous place for personal
    videos and other media that you don''t want strangers to access. Though it has
    an option to make your videos private, you don''t really know how private it is.
    So we need to find a solution that has the perfect match of convenience and privacy.


    This is where MediaGoblin comes in. This open source tool can help you organise,
    host and stream media from your own PC without having to worry about privacy.
    If you are a power user, you can also have it run on a web server and let other
    people add their media. There are a range of other useful features available too,
    like tags and collections to name just two. In this tutorial, we will begin with
    the steps to install MediaGoblin on Ubuntu and then proceed to get it working
    and see it in action. We have used Ubuntu 14.04 as the host system and MediaGoblin''s
    clone from their Gitorious repo.


    # Resources


    +   *   MediaGoblin home page

    +       mediagoblin.org'
