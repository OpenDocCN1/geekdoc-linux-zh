  md: "calling the run() method of a thread directly. Background execution can be\
    \ accomplished only when start() is called – it invokes the thread-spawning logic\
    \ and then proceeds to executing the payload.\n\nFinally, change the client so\
    \ that it sends some data to its master:\n\n```\n```\nvoid ImagineReceiver::dataReady()\n\
    {\n ... \n\nQDataStream out(&block, QIODevice::WriteOnly);\nout.setVersion(QDataStream::Qt_4_0);\n\
    out << QString(\"Hello, server!\");\nmySocket->write(block);\n}\n```\n```\n\n\
    Multithreaded programs can show all kinds of odd behaviour due to a situation\
    \ called race condition. If two runtimes access a shared element at the same time,\
    \ havoc is guaranteed. Qt provides a variety of methods, such as mutexes, which\
    \ can mitigate such problems.\n\n# ## Advanced considerations\n\nIn the beginnings\
    \ of the internet, every computer had its own public IP address. Nowadays many,\
    \ if not most, systems find themselves behind layers of routers providing network\
    \ address translation and/or firewall services.\n\nThe image on page 43 shows\
    \ a network made up of two local networks connected to one another via the internet.\n\
    \nIf a networked application on system A wants to connect to system B, router\
    \ B must be configured to expose the port in question. This can usually be accomplished\
    \ in the backend of the router – since every manufacturer provides a slightly\
    \ different user interface, it’s best to refer to your router’s (online) manual.\n\
    \n# ## Conclusion\n\nWell-versed developers can implement the most complex of\
    \ protocols. Fortunately, Qt provides ready-made classes that implement commonly-used\
    \ protocols such as HTTP. Next time, we will use one of these to create a small\
    \ RSS reader.\n\n# “Multithreaded programs can behave oddly”\n\n```\n```\nvoid\
    \ ImagineListenerClass::connectionIncoming()\n{\n\tQTcpSocket *clientConnection\
    \ = myServer->nextPendingConnection();\n\tconnect(clientConnection, SIGNAL(disconnected()),\n\
    \t\tclientConnection,\n\t\tSLOT(deleteLater()));\n\n\tQByteArray block;\n\tQDataStream\
    \ out(&block, QIODevice::WriteOnly);\n\tout.setVersion(QDataStream::Qt_4_0);\n\
    \n\tout << QString(\"Hello, client!\");\n\tclientConnection->write(block);\n\t\
    clientConnection->disconnectFromHost();\n}\n```\nFig 01\n```\n\n```\n```\nvoid\
    \ ImagineReceiver::anConnected()\n{\n\tqDebug() << \"Connection successful\";\n\
    }\n\nvoid ImagineReceiver::errorOccurred(QAbstractSocket::SocketError anError)\n\
    {\n\tqDebug() << \"Error: \" << anError;\n}\n```\nFig 02\n```\n\n```\n```\nint\
    \ main(int argc, char *argv[])\n{\n\tQCoreApplication a(argc, argv);\n\n\tmySocket=new\
    \ QTcpSocket();\n\tImagineReceiver *myListener=new ImagineReceiver(mySocket);\n\
    \tmySocket->connect(mySocket, SIGNAL(connec ted()), myListener, SLOT(anConnected()));\n\
    \tmySocket->connect(mySocket, SIGNAL(readReady()), myListener, SLOT(dataReady()));\n\
    \tmySocket->connect(mySocket, SIGNAL(error(QAbstractSocket::SocketError)),\n\t\
    \t\tmyListener, SLOT(errorOccurred(QAbstractSocket::SocketError)));\n\tmySocket->connectToHost(QHostAddress::LocalHost,\
    \ 1825);\n\treturn a.exec();\n}\n```\nFig 03\n```\n\n```\n```\nvoid ImagineListenerClass::connectionIncoming()\n\
    {\n\tQTcpSocket *clientConnection = myServer->nextPendingConnection();\n\tconnect(clientConnection,\
    \ SIGNAL(disconnected()), clientConnection,\n\t\tSLOT(deleteLater()));\n\n\tclientConnection->setParent(0);\n\
    \tImagineThread *myThread=new ImagineThread(clientConnection);\n\tconnect(clientConnection,\
    \ SIGNAL(readReady()), myThread, SLOT(dataReady()));\n\tmyThread->start();\n\n\
    \tQByteArray block;\n\tQDataStream out(&block, QIODevice::WriteOnly);\n\tout.setVersion(QDataStream::Qt_4_0);\n\
    \tout << QString(\"Hello, client!\");\n\tclientConnection->write(block);\n}\n\
    ```\nFig 04\n```"
