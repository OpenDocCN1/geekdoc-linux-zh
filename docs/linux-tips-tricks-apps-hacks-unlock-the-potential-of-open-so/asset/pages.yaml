- pgno: 88
  md: '# 02

    Set up the

    database


    ![](img/30dc0459712b32ede1a3814d456b41b6_88_0.png)


    # 01  Sort out dependencies


    MediaGoblin is a full-fledged media-streaming platform and therefore it has a
    few software dependencies that you will need to take care of before installing
    MediaGoblin. Let’s take a look at these dependencies and how to install them.


    **Python 2.6 or 2.7** This interprets the MediaGoblin source code.


    **Python-xml** Binds certain C libraries to Python.


    **Git** For downloading and updating the repository.


    **SQLite/PostgreSQL** This is where everything is stored. SQLite is the default
    option and works fine for small set-ups, but you need to use PostgreSQL if you
    expect more users.


    **Python Imaging Library** This adds image-processing capabilities to Python interpreter.


    **virtualenv** This is used to create isolated Python environments.


    You can install all these on a Debian based system, using the apt-get command.
    It can be done with a single command:


    ```

    sudo apt-get install git-core python

    python-dev python-xml python-imaging

    python-virtualenv

    ```


    # 02  Set up the database


    As we said before, the default SQLite database doesn’t perform well for deployments
    involving more than two or three users. So, if you are planning to have more than
    three users, it’s recommended to use the PostgreSQL database. To set it up for
    MediaGoblin, first download and install the package using apt-get:


    ```

    sudo apt-get install postgresql

    postgresql-client python-psycopg2

    ```


    It has other required packages too. The installation process creates a user (postgres)
    with sufficient privileges to handle the database, but with security in mind we
    will create a separate user for MediaGoblin. To do this, type:


    ```

    sudo -u postgres createuser -A -D

    mediagoblin

    ```


    Once the user is created, create the database:


    ```

    sudo -u postgres createdb -E UNICODE -O

    mediagoblin mediagoblin

    ```


    Here the first ‘mediagoblin’ is the user name and the second is the name of database.


    # 03  MediaGoblin user


    If you followed along with the previous steps properly, you’ve have noticed that
    we didn’t add in a password for the user named mediagoblin. So how does the system
    authenticate the user? This is done via the local Unix authentication. Local Unix
    authentication allows a system user to connect to any PostgreSQL database on the
    system without a password. To enable this, you need to create a system user with
    same name as the PostgreSQL database user.


    So, what we need to do now is to create an unprivileged system user named mediagoblin.
    Note that the user can be underprivileged because MediaGoblin doesn’t really need
    any special privileges to run. This also helps to make the system more secure.
    Run this command to create the user:


    ```

    adduser --system mediagoblin

    ```


    Since this doesn’t have password, you can’t login to this account but a switch
    is possible using:


    ```

    sudo -u mediagoblin /bin/bash

    ```


    Once created, you can then use this user account for all further steps.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Tips | Tricks | Hacks | Apps


    # **04 Install MediaGoblin**


    To start the installation, you need to create a working directory for MediaGoblin.
    This is where the git repository will be downloaded. Create the directory using:


    ```

    sudo mkdir -p /srv/mediagoblin.example.org & sudo chown -hr mediagoblin /srv/mediagoblin.example.org

    ```


    As you can see, here we have created the directory with elevated privileges (root)
    and then change the owner to our underprivileged mediagoblin user. Let''s now
    clone the MediaGoblin repo to this folder. First, well switch to the mediagoblin
    user and then change the directory over to the working directory we have just
    created:


    ```

    cd /srv/mediagoblin.example.org

    ```


    Now start cloning:


    ```

    git clone git://git.orius.org/mediagoblin/mediagoblin.git

    ```


    Then move to the ''mediagoblin'' folder created – cd mediagoblin. Initialise the
    repo and then fetch the data:


    ```

    git submodule init && git submodule update

    ```


    You''ll notice we didn''t take code from the stable revision here but instead
    the master branch of the git repository. MediaGoblin is under rapid development
    so it makes sense to use the master, at least until a consistent release.


    # **05 Install Virtualenv & others**


    MediaGoblin uses virtualenv – a tool to help manage the dependencies by creating
    isolated Python environments. It''s already available in the package, so set it
    up by using:


    ```

    (virtualenv --no-python=2 --system-site-packages - |) virtualenv --python=python3.)
    && /bin/python setup.py develop

    ```


    If you''re feeling adventurous, you can also try the experimental deploy system
    (shell script) instead of the earlier command:


    ```

    ./experimental-bootstrap.sh && ./configure && make

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_89_0.png)


    # **06 Deploy MediaGoblin**


    # # “MediaGoblin doesn''t need any special privileges to run”


    This script sets up virtualenv and also helps you keep it updated by running **make
    update**, but as per the developers of MediaGoblin, this is still under development
    and may break. To update the database at a later point of time simply run:


    ```

    git submodule update && /bin/python setup.py develop --upgrade && /bin/gmgi dbupdate

    ```


    You also need to install Flup before the setup concludes. Install it using:


    ```

    /bin/easy_install https://pypi.python.org/pypi/Flup/1.0.3.dev-20110405

    ```


    We will see more on Flup and FastCGI in the following sections.


    # **06 Deploy MediaGoblin**

    Now that dependencies are set up and MediaGoblin is installed, we will edit the
    MediaGoblin configuration files – specifically the **mediagoblin.ini** file located
    inside **/srv/ mediagoblin.example.org/mediagoblin**. Here are the changes required:


    +   * Set **email.sender_address** as the ID you want to use for sending system
    mails.

    +   * Uncomment the line **sql_engine = postgresql://mediagoblin** in your using
    PostgresQL.

    +   * Edit **direct_remote_path**, **base_dir** and **base_url** as per the root
    of virtual host.


    Now update the database using **/bin/gmg dbupdate**. This populates the database
    with MediaGoblin data structures. Finally, test the MediaGoblin server using:


    ```

    ./lazyserver.sh --server-name=broadcast

    ```


    You should now be able to connect on your browser port 8543.


    # **07 Flup and FastCGI**

    MediaGoblin uses FastCGI for deployment and FastCGI needs a server. So we need
    Flup – a FastCGI server. We already installed Flup in step five, so lets now see
    why FastCGI is so important. Later you will learn a FastCGI setup with an Nginx
    server to serve MediaGoblin pages.'
  merge: -1
