    \ is produced individually.\n\n# ## 13 Create R Scripts\n\nIt is very useful to\
    \ learn how to create R scripts in order to use ggplot2 inside bigger scripts\
    \ that can run as cron jobs. A sample script file, named 'ggplot.R' shows you\
    \ how:\n\n```\n```bash\n$ chmod 755 ggplot.R\n$ ./ggplot.R\n$ ll\ntotal 160\n\
