- pgno: 50
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_50_0.png)


    # 02 Format a partition


    ![](img/30dc0459712b32ede1a3814d456b41b6_50_1.png)


    # “Don’t forget, you can always check the details of your btrfs partitions and
    hard drives”


    # 01 Find the right tools


    The very first step is to install the appropriate setup tools. While it’s supported
    in the kernel, not every distro holds the right packages to manage it by default.
    In Debian and Ubuntu distros, install it with:


    ```

    `$ sudo apt-get install btrfs-tools`

    ```


    # 02 Format a partition


    Now the tools are installed, you can set up your btrfs partition on your system
    using gparted if you want. Launch it up and navigate to the device that you want
    to format. You can either reformat existing partitions or make a smaller btrfs
    partition instead.


    # 03 Go into the terminal


    You can also do this in a terminal now the tools are installed. Open it up and
    use `fdisk -l` if you need to figure out the names of partitions and hard drives
    on your system. Once that’s done, create your btrfs partition with:


    ```

    `$ mkfs.btrfs /dev/sda`

    ```


    # 04 Create a RAID


    One of the best uses for btrfs, due to the way it stores data, is using a similar
    technique to put a series of hard drives into RAID 0. For now, do it in the terminal
    with:


    ```

    `$ mkfs.btrfs /dev/sdb /dev/sdc /`

    ```


    # 05 Grab your file system details


    Just in case you’ve forgotten, you can always check the details of your btrfs
    partitions and hard drives. This also works with individual hard drives in an
    array, which is why we mentioned RAID in the previous step. In a terminal, use:


    ```

    `$ btrfs file system show /dev/sda`

    ```


    # 06 Mount the file system


    With most modern distros you can easily mount the btrfs system with a click. However,
    to do it manually and place it within a specific section of your file system you
    can do it simply in the terminal with something like:


    ```

    `$ mount -t btrfs /dev/sdb ~/btrfs`

    ```


    ![](img/30dc0459712b32ede1a3814d456b41b6_50_2.png)


    # 07 Make a subvolume


    You can create subvolumes within btrfs that can have different mount options and
    mount points, and only uses space when they need it. Create one in the terminal
    using:


    ```

    `$ btrfs subvolume create btrfs/subvolume1`

    ```


    # 08 Create a partition


    We’ve created hard drives, small RAIDs and subvolumes, but you can also create
    btrfs partitions using a similar method as before. Convert a partition into btrfs
    by going into the terminal and using something like:


    ```

    `$ mkfs.btrfs single /dev/sdb2`

    ```'
