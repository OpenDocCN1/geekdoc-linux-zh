    \n```\n```r\n> ggplot(LUD, aes(x=RAM, y=Uptime)) +\n    geom_point(aes(shape =\
    \ Linux))\n```\n```\n\nA facet allows you to split up your data by one or more\
    \ variables and then plot the subsets of data together. Using facets is also a\
    \ great way of generating conditional plots. Try the following point plot, which\
    \ will generate two plots depending on the two different values of the Linux variable:\n\
    \n```\n```r\n> ggplot(LUD, aes(x=RAM, y=Uptime)) +\n    geom_point() + facet_grid(~\
    \ .)\n```\n```\n\nThe facet_grid() function works fine when using continuous variables.\n\
    \n# ## 11 Visualising Chrome's history file\n\nThe history file of Chrome (simply\
    \ called History) stores its history of visited websites in SQLite3 database format.\
    \ Therefore, you can use the RSQLite R package to read it. The 'chrome.R' script\
    \ generates an impressive\n\noutput using RSQLite and ggplot2 with many layers.\
    \ It can be executed as follows:\n\n```\n```bash\n$ ./chrome.R\nLoading required\
