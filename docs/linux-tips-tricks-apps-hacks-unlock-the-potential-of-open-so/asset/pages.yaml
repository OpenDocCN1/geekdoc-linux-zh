- pgno: 25
  md: 'Understand the limitations of graphical partitioning when dealing with LVM
    filesystems


    Create, name and modify logical volumes and volume groups that contain all your
    data


    Add more hard drives and partitions to the LVM to keep expanding the space forever
    by allocating it smartly


    ![](img/30dc0459712b32ede1a3814d456b41b6_25_0.png)


    # # Set up LVM filesystems


    Quite a different filesystem to your normal ext partitions, but LVM might just
    be the way to go


    # ## Resources


    +   - LVM 2 tools   sourceware.org/lvm2

    +   - gparted        gparted.org


    You''d be forgiven for not knowing what LVM stands for, but it''s a useful thing
    to know. Logical volume management, as it''s properly designated, acts as a sort
    of container to manage your data – the benefit of this is that you can start adding
    and extending space while the LVM is still online and working. This is great for
    server farms because you can swap out and add storage very quickly,


    and on your desktop its particularly good for managing the size of different partitions
    if you weren''t sure how they should have been during installation.


    In this tutorial, we''ll look at how you can create an LVM filesystem and then
    how you can go about maintaining and modifying it. We will also look into how
    some distros install using LVM.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_26_0.png)


    # **02**


    Graphical partition editors


    ![](img/30dc0459712b32ede1a3814d456b41b6_26_1.png)


    > “You can swap out and add storage very quickly, and on your desktop its particularly
    good for managing the size of different partitions”


    ![](img/30dc0459712b32ede1a3814d456b41b6_26_2.png)


    **01 Install LVM**


    Many distros have the option to install using an LVM filesystem. In our example,
    we''ve left the LVM option checked when installing Fedora 21. This will automatically
    create a boot and storage partition within the logical volumes for you to play
    about with later.


    **02 Graphical partition editors**


    General partition editors like gparted have a bit of a tough time working with
    LVM filesystems – with the right tools installed you can see the partition but
    you can''t really do much to it. For this tutorial, we will be working mostly
    within the terminal.


    **03 Use LVM tools**


    Although you can edit partitions live, we suggest booting into a live disc or
    other distro on the system instead. Once you have, install the LVM2 tools if they
    haven''t been installed already. The package is called lvm2 in the repos and contains
    various tools for looking at, and manipulating LVM partitions, which is useful.


    **04 View the LV**


    Now the tools are installed, we can have a peek at the LVs (logical volumes) on
    the system. This will display the volume group, the name type and size. Open up
    the terminal and use:


    `$ sudo lvdisplay`


    **05 See the volume group**


    The LVM partitions are kept inside a volume group, which in our case is called
    Fedora but could be called anything. You can get more accurate details on this
    by using the volume group tools like so:


    `$ sudo vgsdisplay`'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Tips | Tricks | Hacks | Apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_27_0.png)


    # “Make sure you know the designation of the partition”


    **06 Create an LVM**


    It takes multiple steps to make an LVM filesystem. You need to create a physical
    volume for the volume group to be in and then you can create your logical volume
    inside that. First though, create a new partition on the system in your preferred
    method.


    Make sure you still remember the partition designation and create it with something
    like:


    ```

    $ sudo vgcreate LVDG /dev/sda3

    ```


    You can add several partitions and/or hard drives like this as well.


    **07 Make a physical volume**


    Once the partition is made, you can turn it into a physical volume. Make sure
    you know the designation of the partition (in our case /dev/sda3), which you can
    find out with `fdisk` -L. Create the PV with:


    ```

    $ sudo pvcreate /dev/sda3

    ```


    **08 Include a volume group**


    Now with a physical volume to play with, we need to create a volume group with
    a name.


    **09 Create a logical volume**


    The final step is to include a logical volume. Give it a name, tell it how much
    space to use and which volume group it should belong in. To fill up a 20 GB volume
    group, use:


    ```

    $ sudo lvcreate --name root --size 20G LVDG

    ```


    **10 Extend the volume group**


    If you want to extend the space in your original volume group, first create a
    new


    physical volume as before. Find out the name of the volume group (**vgdisplay**)
    and use the designation of the partition to extend with:


    ```

    $ sudo vgextend /dev/fedora /dev/sda3

    ```


    **11 Alter the logical volume**


    Ensure that you know exactly how much space you have to extend the partition by
    using **vgdisplay** to find the free PE (physical extent) value, and also make
    sure you know the name of the partition that you are extending. Once you have
    both of those, then use:


    ```

    $ sudo lvextend -L +4958 /dev/fedora/root

    ```


    **12 Resize the file system**


    To finish off the extension, we need to let the entire LVM system know that it
    has had some changes using the resize option on the LV you’ve extended. The good
    thing is, this means you don’t need to have space “next to it” in the hard drive
    to extend in this way. Do this with:


    ```

    $ sudo resize2fs /dev/fedora/root

    ```'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Tips | Tricks | Hacks | Apps


    ![](img/30dc0459712b32ede1a3814d456b41b6_28_0.png)


    ![](img/30dc0459712b32ede1a3814d456b41b6_28_1.png)


    # 13 **File system check**


    Depending on how the storage was created, you may need to check the integrity
    of the filesystem before the resize2fs. Here, it asked us to perform an e2fsck
    command on the extended LV before resizing—just follow the instructions.


    # 14 **Test your new filesystems**


    You can now see the extended space in the LV, the volume group and see if you
    have any spare space still to allocate using the lvdisplay, vgdisplay and pvdisplay
    options. In lvdisplay and vgdisplay, it won’t show the extra sda partition because
    it’s all part of the same storage as far as it’s concerned.


    # 15 **More complicated setups**


    The beauty of LVM is that we can have several partitions and hard drives, have
    them all donate space to the volume group and then be divided between different
    LVs. You can create multiple LVs in any volume group, taking space where you want
    it. Adding hard drives later will let you extend the storage with little hassle.
    The partitions you create traditionally will show up as ext4 or whatever filesystem
    in the partition editors, but they’ll be inaccessible outside of the LV.


    ![](img/30dc0459712b32ede1a3814d456b41b6_28_2.png)


    # 16 **Delete an LV**


    Want to completely rearrange the insides of your volume group? Start by deleting
    LVs to create them from scratch using the lvremove command. Make sure you know
    the name of the LV you’re removing and do it like so:


    ```

    `$ sudo lvremove /dev/VolumeGroup1/Logical_volume`

    ```


    # 17 **Remove a volume group**


    Need to go a step further and delete the entire volume group? This will delete
    all the LVs within and free up some of the partitions that are in the physical
    volume. Make sure you know the name of the volume group and then do:


    ```

    `$ sudo vgremove Volume_group`

    ```


    # 18 **Get rid of the physical volumes**


    If you want to remove the LV completely, you can just delete the physical volume
    designations and then start using a more traditional partitioning system instead.
    Make sure you know the original names of the partitions and remove them:


    ```

    `$ sudo pvolume /dev/sda1 /dev/sda2 [etc]`

    ```


    # 19 **Shrink the logical volumes**


    Like we did with the expanding, you can also shrink the logical volumes and volume
    groups. In each case, you would be reducing the size of the logical volume or
    removing physical volumes from the volume group, respectively—otherwise it works
    the same way.


    # 20 **Logical volume management**


    There are more functions you can use while creating and maintaining an LV, but
    these are the basics. If you find yourself running through a lot of storage then
    this may be the solution for you, as you can just keep adding with little-to-no
    hassle and no RAID.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Take command-line control

    of your email with Mutt


    Email is one of the biggest time users, but Mutt offers the tools to sort and
    process your inbox


    # Resources


    +   - Mutt

    +     [mult.org](mult.org)

    +   - Fetchmail (optional)

    +     [www.fetchmail.info](www.fetchmail.info)

    +   - Mutt manual

    +     [mutt.org/doc/manual.txt](mutt.org/doc/manual.txt)


    A few years ago, social media started to take up more of our time and you may
    have felt that email was diminishing in importance. However, we still spend hours
    each week wading through emails, and have to sign up for all sorts of commercial
    mailings just to complete the obligatory registration on many new websites and
    services.


    The other big change has been a near wholesale move to webmail – a contracting
    out by mail users of running both the personal mail server and the client (and
    associated backups) to Google, Yahoo! and Microsoft, worrying at the cost of control
    and privacy.


    Webmail is convenient in the sense that we no longer have to think about looking
    after our emails, but despite some lovely interfaces, it remains at best a clunky
    and slow way of managing a busy email life. Mutt offers you the chance to take
    back control of your email and really speed up your workflow. We''ll show you
    how to do this with one of the major webmail services.


    Mutt is very powerful – the manual takes hours to read – but dive in with our
    quick tour of a few of its powerful features and you''ll be ready to explore more
    deeply.


    # 01 Set up IMAP


    Before Webmail became ubiquitous, users had to decide between keeping their emails
    on the server to read anywhere – with IMAP (Internet Message Access Protocol)
    – or downloading them to a mail client through POP, and deleting them from the
    server.


    Generous disk allowance means that many of us now keep all of our mail archived
    with webmail providers. However, you''ll still need to enable IMAP in Gmail if
    you want to use it with a client like Mutt, yet still keep your emails available
    on Google''s capacious servers.


    Choose Forwarding/POP/IMAP in the Gmail settings menu and then select Enable IMAP.
    Yahoo! (and thus BT) does not need this lengthy process, nor do AOL or Hotmail
    Live either, which is useful.


    Below Mutt shows you useful information about your emails in the main list, such
    as their size, and you can shortcut to power through them all


    ![](img/30dc0459712b32ede1a3814d456b41b6_29_0.png)'
  merge: -1
  img_proc: true
