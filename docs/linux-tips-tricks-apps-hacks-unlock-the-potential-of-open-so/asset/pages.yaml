- pgno: 154
  md: '![](img/30dc0459712b32ede1a3814d456b41b6_154_0.png)


    ▪ Installation from the full DVD allows for a complete and customisable install,
    while the live CDs offer a great preview


    ![](img/30dc0459712b32ede1a3814d456b41b6_154_1.png)


    ▪ System information is easily accessible, allowing for system diagnostics on
    every level


    # “OpenSUSE is also about community, and the changes to YaST and efforts made
    with Btrfs are a great indicator of how strong it currently is”


    openSUSE: Not only can you install, you can also add repos, check package versions
    and meta-contents, or even just enable or disable repos. It can blend seamlessly
    into the YaST system, however it does require getting into it to add software
    in this way.


    You also have the choice of zypper on the command line, the alternative to yum
    or apt- get that runs very smoothly and can be much more readable than the other
    two. Finally, you can also find software you like online and click an installation
    button from your browser. This is similar to how you can remotely install apps
    to an Android phone via the Play Store browser. It’s a very nice addition, and
    something that most other distros don’t include. Having three fully functioning
    ways to install and manage your packages is an excellent way to give extra choice,
    and in openSUSE’s case it doesn’t bloat the system.


    # Future innovations


    This release of openSUSE also brings with it two new technologies that are quickly
    becoming Linux standards: systemd and the btrfs filesystem.


    Systemd is much more ubiquitous among the various Linux systems, with Gentils
    slowly gaining steam through kernel advancements, Fedora support and now openSUSE.


    The greater support for systemd here will be seen as controversial for those that
    are invested in the init system of Linux distros, however openSUSE has gone to
    great lengths to try and wrangle it into a more usable form via modules and settings
    in YaST that can be used to customise it.


    Btrfs on the other hand doesn’t carry that extra baggage, and you can choose between
    other file systems if you wish. Btrfs does offer extra features though, thanks
    to advanced version control, sub-volumes and being able to back-up and roll-back
    easily with ext4 filesystems. The implementation in openSUSE is also excellent,
    especially in 13.2 where extra effort has been put into it.


    As well this new general Linux tech, openSUSE also includes a new piece of software
    called dboot that has significantly cut down the boot time, and has made sleeping
    and resuming almost instantaneous on some setups. Users can now also access Plasma
    5.1, the very latest release and the KDE desktop line that is beginning to take
    shape as an excellent next-gen desktop.


    # Usage scenario


    Actually using openSUSE around all these features and software seems like a renewed
    experience. For the last couple of years, something’s felt off with the distro,
    and it didn’t help that the community has having trouble getting people in to
    help build and test it. Since 13.1’s release, a styleguide has been introduced
    and the last year has seen apart bringing 13.2 up-to-scratch while still being
    able to showcase some of the latest and great FOSS technology.


    It can be a little intimidating for those that are not used to the variety inherent
    in Linux, and it’s definitely not something you would recommend to a newcomer.
    However, for those with some knowledge of Linux, openSUSE is an excellent distro
    that makes desktop Linux use quite easy once you learn the ins and outs.


    # Summary


    This is a return to form for the distro that has had some issues getting out the
    door, let alone being stable, in the last few years. The year of focus on polish
    with the new guidelines have worked wonders.


    Linux Tips, Tricks, Apps & Hacks 155'
