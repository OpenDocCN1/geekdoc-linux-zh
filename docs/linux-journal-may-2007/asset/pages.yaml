  md: "# QUICK TAKE\n\ntable points to consider. For example:\n\n```\nCREATE TABLE\
    \ Appointments (\n  person_id INTEGER NOT NULL,\n  starting_time TIMESTAMP NULL,\n\
    \  duration INTERVAL NOT NULL,\n  notes TEXT\n);\n```\n\nIf we try to create a\
    \ constraint that refers to a non-existent person, we will get:\n\n```\nINSERT\
    \ Appointments (person_id, starting_time, duration, notes)\nVALUES (5000, '2007-02-12\
    \ 13:00', '1 hour', 'lunch');\n```\n\n```\nERROR: insert or update table 'appointments'\
    \ violates foreign key constraint 'appointments_person_id' (not present in table\
    \ 'people')\n```\n\nForeign-key constraints help in the other direction as well.\
    \ If you try to drop a row that a foreign key points to, PostgreSQL will refuse\
    \ the drop unless you first delete the key rows. You can adjust the rules for\
    \ these constraints by using the ON UPDATE or ON DELETE clause on the foreign\
    \ key.\n\n# Other Features\n\nThis is list of features to use of. And that is\
    \ part of the magic of PostgreSQL—it's straightforward and easy to use, but you\
    \ may also redefine and extend functionality with your own code. The built-in\
    \ operators, along with the flexible ways in which they can be combined and further\
    \ enhanced with your own functions and definitions, make it a powerful combination.\n\
    \nFor example, one of my favorite features is the use of subsects without having\
    \ a value. If you have someone's email address, then you can use INSERT INTO Appointments\
    \ in a single statement:\n\n```\nINSERT Appointments (person_id, starting_time,\
    \ duration, notes)\nVALUES (SELECT id\nFROM People\nWHERE email_address = 'reuen@terrier.com',\n\
    '2007-02-12 13:00', '1 hour', 'lunch');\n```\n\nIf the data already exists then\
    \ we can't construct our. PostgreSQL also allows us to use many of exotic data\
    \ types, including geometric and IP addresses.\n\nIf we want to manage more than\
    \ one thing with similar characteristics, we can take advantage of PostgreSQL-object\
    \ inheritance. Thus, we could have a Table and a Manager, in which the Manager\
    \ inherits the characteristics of Table and adds its own features.\nYou can also\
    \ create your own server-side functions, in a variety of languages. PostgreSQL\
    \ supports versions of Python, Tcl, Ruby and the Rust language. These functions\
    \ can return individual values or entire tables, and can be used in triggers.\
    \ You can also use these functions to rewrite the rules for inserting, and deleting\
    \ data from a table or even we\n\nBut, the most important feature of all is the\
    \ built-in support for transactions. Transactions are an essential part of database\
    \ programming, that they allow us to combine multiple queries into one-or-nothing\
    \ action. The classic example of a transaction is if the power goes out, you want\
    \ to move money from one account to another; if the power was moved, and then\
    \ it wouldn't be unacceptable for the money to disappear altogether or appear\
    \ in both accounts at once.\n\nRecent versions of PostgreSQL have enhanced its\
    \ capabilities. You can commit or rollback a transaction, and you can also savepoints\
    \ within it. If something goes wrong, you can roll back the entire transaction\
    \ or go to the savepoint. PostgreSQL supports multiple savepoints, making it possible\
    \ to perform complex operations that require careful communication and coordination.\n\
    \nIf anything goes wrong, PostgreSQL also provides a point-in-time recovery through\
    \ a write-ahead log (WAL), ensuring that even your transactions will be committed\
    \ or rolled back as planned.\n\nYou might have noticed that I haven't mentioned\
    \ locking all. For the most part, PostgreSQL users don't have to worry about locking.\
    \ The locking mechanism handled by a system can be very complex, but PostgreSQL\
    \ handles concurrency by allowing only one process to read or write to a row at\
    \ a time.\n\nFinally, recent versions of PostgreSQL include support for transactions\
    \ that span across different databases. This can boost performance and reliability\
    \ significantly, particularly on large databases.\n\n# Conclusion\n\nDon't think\
    \ of PostgreSQL as a open-source database. Rather, it is a powerful database to\
    \ be released under an open source license. It has a wealth of features that make\
    \ it suitable for large systems, and it is easily approachable by those who want\
    \ to join the world of relational databases.\n\n> Reueven Lerner, a longtime database\
    \ consultant, is a PhD candidate in Learning Sciences at Northwestern University\
    \ in Evanston. He lives with his three children in Skokie, Illinois. You can reach\
    \ him at reuen@terrier.com.\n\nThe main site for PostgreSQL is www.postgresql.org.\
    \ This site contains software, documentation, FAQs and a host list of mailing\
    \ lists.\n\nMy favorite book PostgreSQL is simply called PostgreSQL 2nd, edit.\
    \ by Kevin Gould and Sam Sims (ISBN 0862732752). The PostgreSQL community mailing\
    \ lists are invaluable sources of help and information. It's not unusual for one\
    \ of the core developers to answer a question that has posed or that there is\
    \ a bug that needs fixing.\n\n52 | may 2002 www.linuxjournal.com"
