  md: "# FEATURE Web Services and Ajax\n\n# Listing 6. The Perl Script for Selecting\
    \ Data\n\n```\n#!/usr/bin/perl\n\nuse CGI;\nuse DBI;\n\n$db = DBI->connect(\"\
    dbi:Pg: dbname=database\",\n  \"\"$postgres\", \"password\");\n\nprint \"Content-type:\
    \ text/xml\\n\\n\";\nprint \"<result>\";\n\n$cgi = new CGI;\n\n$id = $cgi->param(\"\
    id\");\n\n$sth = $db->prepare(\"select * from contacts where id=$id\");\n$sth->execute();\n\
    \n$a = \\$sth->fetch_hashref(\n);\n\nforeach $key (keys %a) {\n  print \"<field\
    \ name=\\$key\\ value=\\$a{$key}</field>\\n\";\n}\n\nprint \"</result>\";\n```\n\
    \n# Listing 7. The Perl Script for Updating a Record\n\n```\n#!/usr/bin/perl\n\
    \nuse CGI;\nuse DBI;\n\n$db = DBI->connect(\"dbi:Pg: dbname=database\",\n  \"\"\
    $postgres\", \"password\");\n\n$cgi = new CGI;\n\n$id = $cgi->param(\"id\");\n\
    $field = $cgi->param(\"field\");\n$value = $cgi->param(\"value\");\n\n$db->update(\"\
    update contacts set $field=\\$value where id=$id\");\n\nprint \"Content-type:\
    \ text/xml\\n\\n\";\nprint \"<result>\";\nprint \"<field name=\\$field\\ value=\\\
    $value</field>\\n\";\nprint \"</result>\";\n```\n\n# Listing 7. The Perl Script\
    \ for Deleting a Record\n\n```\n#!/usr/bin/perl\n\nuse CGI;\nuse DBI;\n\n$db =\
    \ DBI->connect(\"dbi:Pg: dbname=database\",\n  \"\"$postgres\", \"password\");\n\
    \n$cgi = new CGI;\n\n$id = $cgi->param(\"id\");\n\n$db->delete(\"delete contacts\
    \ where id=$id\");\n\n$sth = $db->prepare(\"select max(id) from contacts where\
    \ id=$id\");\n$sth->execute();\n($index) = \\$sth->fetch_arrayrow();\n\nprint\
    \ \"Content-type: text/xml\\n\\n\";\n\nprint \"<result>\";\nprint \"<field name=\\\
    $id\\ value=\\$index</field>\\n\";\nprint \"</result>\";\n```\n\nwith the name,\
    \ to our HTML document. We could use the other forms as a template of course,\
    \ and just do about it.\nHow could we improve our service? First, we'd need to\
    \ take care of security issues. Our Web services should only allow authorized\
    \ users to perform database functions. Maybe we need to perform some basic database\
    \ validation on the parameters they receive. The delete service accepts a record\
    \ of the id as int-2 or int-1 to our server, our database would be lost forever,\
    \ and our program would delete all records. We would need to take care of such\
    \ issues before we use these services in the web.\n\nYou have noticed that all\
    \ fields in our arrays are of type varchar(20). That's not very flexible or convenient.\
    \ To be truly useful, we should be able to determine what data type each field\
    \ is. For chars we would need to handle integers and booleans too. The service\
    \ should be able to determine how to handle these situations.\n\nBy simply sending\
    \ the name of the table as one of parameters, we can build a Web Service that\
    \ can modify tables other than our own tables. We might be able to use the same\
    \ services to update a shopping list, inventory or calendar. Generating our Web\
    \ Services like this would make our simple applications easy to write, and even\
    \ any application in the web could use them.\nSo, by coupling AJAX with our own\
    \ brand of Web Services, we would be able to write applications that are more\
    \ responsive to user input, less taxing the server infrastructure, and much easier\
