    In this case, the SPA was not spoofed, so the real source address and the address
    embedded in the spa packet match. Spa packets can be spoofed by fknopd with the
    --spoof-src command-line argument (requires root):


    ```

    Feb 10 15:54 spa_server: received valid Rijland \

    crypted packet from 15.1.1.1: remote user mbr

    Feb 10 15:54 spa_server: fknopd: adding FKNOP_ACCEPT ACCEPT \

