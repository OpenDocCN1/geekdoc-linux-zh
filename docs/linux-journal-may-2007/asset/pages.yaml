  md: '# # UPFRONT

    NEWS + FUN


    # diff -u


    It looks like MinixFS version 3 will be supported in modern kernels. Daniel Aragones
    had a patch floating around, and Andres Brouwer recently cleaned it up and made
    it fully kernel-worthy and could be accepted at any time.


    WHAT''S NEW IN KERNEL DEVELOPMENT


    Andrew Morton has stated that the mailing list patch seems harmless and could
    be accepted at any time.


    A new stackable filesystem, RAIF (Redundant Array of Independent Filesystems),
    is under development by Nikolai Boucher and other folks. It performs redirection
    across multiple disks like RAID, but it does so on top of other filesystems the
    users want to incorporate into the RAIF structure. The project is still not ready
    to be considered for inclusion in the official kernel, and brave enough to experiment
    with it should back up their data beforehand. Nikolai says RAIF has reached a
    level of stability so that playing with it is no more fun than frustrating.


    SDHC (Digital High Capacity) Flash cards may soon be supported in the kernel.
    Philip Langale has seen some very good results (in other words, no lost data in
    recent tests). John Gilmore used an SDHC card for Philip to test and the SD Card
    Association has published useful cases, which Philip has put to good use.


    The design of some folks to gain access to crash even when running the Windows
    System, has raised the issue of starting graphics drivers into the kernel. In
    Stephen''s example this would represent a massive shift in kernel development,
    but it may be the best way to ensure that options are properly displayed, regardless
    of what graphics might happen to be in crashes. D. Hamilton and Oborski are working
    on it, but the result would be massive and long-term waves before any such crash
    could be reverted.


    Karl Zeek decided to fix out-linux from the current kernel Adrian Back, he and
    others want to merge with him regarding their patches and proposals to change
    maintainability. Andres decides to make the change that he should stay as the
    official master, it''s likely Karl will eventually reintegrate into the kernel
    using a single code block


    Greg Kroghart has started a mailing list for anyone who needs the kernel for a
    distribution. The purpose of the list is to provide a vendor-neutral place for
    discussing issues and features packaged with kernels. It may also provide a more
    viable way for kernel patches to push their own changes to the upstream.


    > —ZACK BACK


    ![](img/6be405694cb4aa0c113e76f02a6a5081_13_0.png)


    # Return of the Lugglable


    If Linux is the ultimate hermit crab—born without a home but to live in any hardware''s—it''ll
    be fun to see Linux wisely in the form factors provided by Acme Portable Machines,
    Inc.


    Acme''s hardware is built for the parties that rely on it for reason: server rooms,
    hotel floors, military aircraft and research facilities. Acme Key-boards that
    take on rails into or central multiple CPUs (among many other connected things).
    It makes kiosks It takes CPUs with the power of portable sewing machines, featuring
    screens and keyboards that operate on the sides and inside to hold up to full-size
    desks.


    Acme also offers freestanding items as portable systems—workstations that look
    like briefcases and features such as “frame resistant” case. Acme calms it fits
    as EMP (a robust lunchbox built with heavy-duty metal to provide a power-go, anywhere
    ideal for harsh/environment non-critical applications). Jim Thompson of Networking
    calls it the ultimate Acme party box.


    Acme Portable''s primary market is OMEM, but you can see and buy its directly
    at acmeportable.com.


    > —DOC SEARS'
