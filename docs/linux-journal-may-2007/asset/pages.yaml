  md: '# mochiKiit by Example


    An overview of MobiKiit with real-life examples.


    INTERACTIVE WEB PAGES, long dreamed of by designers, finally here—interfaces that
    respond to user commands, with minimal page reread. All this and more is possible
    via Ajax (Asynchronous JavaScript and XML), which has recently come into vogue
    with the Web.


    In JavaScript, and programming in general, the best code is code you can read.
    For serious projects, this often means using a framework—a collection of useful
    and reusable code that is tested, optimized and (ideally) peer-reviewed. The better
    frameworks have a good, high-level JavaScript framework, for example, means more
    time to build and less time writing boring building-block code (and then rewriting
    it when the de-facto de-facto incompatibilities poke their heads up).


    MochiKiit is a JavaScript framework that provides tools for dealing with asynchronous
    requests (Ajax), DOM (Document Object Model), functional programming tools, data
    and times, string formatting, colors, visual effects, drag-and-drop, and many
    more. MochiKiit 1.3 is targeted on Safari 2.0, Firefox (1.0.7, 1.5) and 2.0),
    and IE 8.5 and higher.


    In this quick introduction to MochiKiit, explains how to get started with MochiKiit
    (with interesting stops along the way) and describes three-ways of varying complexity
    that are generic enough to use in your Web applications now.


    # What''s in MochiKiit?


    Included in MochiKiit are algorithms for data structures (serialization), functional
    programming, iteration, DOM and CSS mapping, for server communication, a slot/slot
    mechanism for JavaScript events and logging. At this point, MochiKiit uses the
    C++ STL of JavaScript. And beyond what STL C++ provides, it also provides event
    handling, drag and drop, colors and effects.


    On the topic of data structures, MobiKiit provides the powerful tools (like filter);
    which returns only lists that match a criteria; find(); map(); which returns the
    result of list elements and bind(). MochiKiit also provides tools to translate
    and from JSON (JavaScript Object Notation) syntax: serialize(). Above all, MochiKiit
    gives you the power to hook your objects into MochiKiit.


    MochiKiit''s tools for functional programming functions to be created dynamically,
    or they may provide more extensive (or less broken) behaviors for functionality
    already present in JavaScript. MochiKiit''s partial and bind() functions create
    a version of a function that can be called either individually. In nature, these
    tools let you create functions dynamically. These two functions are not obviously
    right without, but they are powerful when combined with MochiKiit tools.


    In addition to data structures, MochiKiit allows you to create elements, convert
    DOM objects to strings, retrieve elements by class or type, and swap DOM objects
    for other DOM objects.


    # Getting Started with MochiKiit


    Want to see how MochiKiit works? The demo on mochikit.com has several interesting
    examples. One of MochiKiit''s is an interactive JavaScript interface, executing
    whatever code you type in. In particular, interpreter provides documentation for
    MochiKiit functions—via help()—returning a link to the page you need.


    MochiKiit''s documentation page also uses (Mobile-embedded) JavaScript to display
    a list of sub-menus when the main page loads, it creates a list of sub-menus (Mochi.Async,
    MochiKiit.Base, Mochi.DOM and so on). Clicking one will expand or collapse them.
    No actual space exists—its all computed by (asynchronously) requesting each page
    from the server, then sending the documentation-line corresponds with the release
    of MochiKiit


