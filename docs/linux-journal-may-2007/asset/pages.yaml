    # Zimbra Collaboration Suite, Version 4.5


    Zimbra exploits Ajax for a compelling Web experience. MARCEL GAGNÉ


    E-mail is the backbone of modern corporate communication, and frankly, it has
    been for a long time. With any tool that gets this much out features so prominently
    in any networked, e-mail has demonstrated a history of limitations. To improve
    the experience, software developers have introduced obvious functions, such as
    calendar, simple mailing lists and threads, creating what is popularly referred
    to as contact management system. Enterprise simplifies the creation of groups,
    or collaboration tools, allowing those contact lists to be shared among members
    of an organization. Administering complex policies on thousands of people creates
    its own set of problems. As increasingly users noticed that they were now in a
    sea of ways, always trying to reach for pieces of information that help them stay
    afloat.


    Zimbra''s raison is to improve the e-mail experience by providing a suite that
    simplifies and enhances the experience, which is unique without short and intuitive
    retrieve.


    The Zimbra Collaboration Suite F1 is a powerful, scalable application, suitable
    for small to medium to very large enterprises. It can be deployed in a high-availability,
    clustered environment where it can serve huge numbers of clients, and with ease
    of maintenance. Zimbra serves up 100,000 users, while the University of Toronto
    is in the tens of thousands. Zimbra''s customers are varied (for who offer Zimbra
    as a service, to businesses, universities, government offices and nonprofits)
    and provide content


    I''ve had a few weeks with the Zimbra Collaboration Suite,


    # Note:


    When speaking with Zimbra, I asked about the service model where customers sign
    up for Zimbra e-mail accounts, and where accounts are ad-supported or value-add
    is provided through Zimbra extensions. Zimbra informed me that 80% of Zimbra installations
    are on premise deployments. The company doesn''t believe that e-mail is going
    to a hosted with CRM.


    And I, overall, very impressed. That said, nothing is perfect—more details I go
    on.


    # What Does Zimbra Do?


    The Zimbra Collaboration Suite belongs to a class of network applications we''ve
    come to call group—an intelligent collection of CRM, of which e-mail is the core,
    usually provided through a Web interface. In addition to e-mail, Zimbra messaging
    server serves group calendars and contact management tools. Zimbra is both a powerful
    and helpful application that includes,, LDAP, Apache and more. Zimbra includes
    some extensions, such as zimlets (on these later), and enterprise mashups allow
    users to interact naturally with information embedded in their e-messages, so
    they can easily use it for various applications, including third-party applications,
    such as a purchasing system.


    It''s possible to talk about like Zimbra without comparing to Microsoft Exchange,
    I answer the obvious questions here. Zimbra is an impressive replacement for Microsoft
    Exchange. Zimbra offers more than what Outlook is able to offer (Lotus Notes integration
    also available). Available clients are free and supported, that it works with
    all Outlook e-mail, contacts and calendar functions (API sync, is only available
    with the Zimbra Network Edition). If you happen to be on any other mail client,
    such as Thunderbird or Eotta, you can continue to start with Zimbra''s impressive
    browser-based Ajax client, which might say good for your old client software.
    Zimbra also supports numbers of mobile devices, such as this iPhone, Blackberry.


    As the above paragraph hints, Zimbra is valuable in different flavors, including
    a community-supported Open Source Edition and a commercially supported Network
    Edition.


    # Working with Zimbra


    Zimbra is a Web application that doesn''t feel like a Web application.


