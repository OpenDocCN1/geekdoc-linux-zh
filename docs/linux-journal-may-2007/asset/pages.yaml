  md: "the regular expression (Sdept in this case):\n\n```\ntd.data = Squot.sub(Squote,\
    \ td.data)\n```\n\nHere we're taking td data, in this particular node in the XML\
    \ tree, looking for the regular expression by Sdept, and replacing whatever matched\
    \ with a \" (in the appropriate context) with the starting double quote, Squote.\n\
    Now we try it with fixx at the lower-level:\n\n```\n# % in fixx.py\n# ../fixx.py\
    \ edit ex3-2\ndepth-5: the them? ? dash is too short\ndepth-5: the them? ? dash\
    \ is much longer ?\nis what we need.\ndepth-5: ugy // should be\nturned into them?\
    \ dashes.\ndepth-5: this line has \"straight double quotes\"\ndepth-5: these 'single\
    \ quotes' aren't pretty.\nowner ex3-2.out\n```\n\nprobably will need a manual\
    \ work-around.\nPutting all that together, we have fix4.py:\n\n```\n#!/usr/bin/python\
    \ -tt\nimport xml.dom.minidom\nimport sys\nimport re\n# new in fix3.py\n\nDEBUG\
    \ = 1\ndef print(root):\n    if DEBUG == 0: return\n    sys.stdout.write(root.encode('ascii',\n\
    \                                 ('replace', '\\')) + '\\n')\n\nndash='\\u2014\n\
    # new in fix3.py\nenash='\\u2013\nsquote='\\u2015\n# new in fix4.py\ndequote='\\\
    u2016\n# new in fix4.py\nsquote='\\u2018\n# new in fix4.py\nesquote='\\u2019\n\
    # new in fix.py\n```\n\nOpenOffice.Writer wrote what we expected. Both the hyphen\
    \ and the dash changed into dashes, and the double quote ruled quite the right.\n\
    \nNow, here's the rest. The expectation when dealing with the double quote is\
    \ to keep the image of the double quote. In order to, we require the quote character\
    \ to be at the end of the line (/) or followed by whitespace. Again, when we replace\
    \ only the quote itself, not the whitespace. The End-Double-Quote-Pattern (Sdept)\
    \ is proved by:\n\n```\n# Sdept: pattern for double d quote\n# \" -- the quote\
    \ we\n# We look for it at start (^) or\n# after a space (#) and we want it to\
    \ be\n# followed by a non-space\nsquote = re.compile(r'(?<=\\s)\"', re.u) # new\
    \ in fix3.py\ndequote = re.compile(r'(?<=\\s)\\'', re.u) # new in fix3.py\nsquote\
    \ = re.compile(r'(^|\\s)\"', re.u) # new in fix4.py\ndequote = re.compile(r'(^|\\\
    s)\\'\\'', re.u) # new in fix4.py\n```\n\n```\nSdept = re.compile(r'(^|\\s)(\"\
    )', re.u)\n```\n\nBy way, all these patterns we are going to handle it one and\
    \ over using patterns.\nTo handle single quotes (like '),), we can easily do the\
    \ same for a couple of issues. First, the problem of handling with a double-quote,\
    \ we didn't cover the case where it was surrounded by both sides by non-whitespace.\
    \ Single quotes (or apostrophes), we can also handle, because of words like it's.\
    \ Therefore, the single-quote pattern to match the double-quote as an apostrophe\
    \ in contracts, has a looser pattern. Here is what we came up with:\n\n```\nSquote\
    \ = re.compile(r'(?<=\\s)\\'', re.u)\n```\n\nBecause the pattern has an apostrophe\
    \ in it, the matching pattern uses double-quote.character. This expression matches\
    \ a single quote, but only when preceded immediately by a non-whitespace character.\n\
    \nThe last issue, which the code doesn't address, is that of contractions with\
    \ an apostrophe, such as the 's tis or 'em us.\nThe script treats the apostrophe\
    \ like the start of a single-quoted phrase, and will quote the wrong way. The\
    \ The\n\n```\ndef fix4(tree):\n    print('depth: %s' % str(tree.tag))\n    print(tree.data)\n\
    \    # OK, so -- it does us everywhere\n    # Change at end of line dash\n   \
    \ td.data = td.replace('-', '') # new in fix3.py\n    td.data = ndash.replace(ndash,\
    \ ' ', td.data) # new in fix3.py\n# Make a nice single curly-quote\n    td.data\
    \ = Sdept.sub(Squote, td.data) # new in fix3.py\ndequote = Sdept.sub(dequote,\
    \ td.data) # new in fix3.py\n# Make nice curly single-characters\n    td.data\
    \ = Sdept.sub(Squote, td.data) # new in fix4.py\ndequote = Sdept.sub(dequote,\
    \ td.data) # new in fix4.py\n```\n\n```\ndef handle_xml_tree(node):\n    if node.hasChild(node):\n\
    \        for child in node.childNodes:\n            handle_xml_tree(child, depth+1)\n\
    \    else:\n        if 'data' in dir(node):\n            fix4(node)\n\ndef sort(argv):\n\
    \    tree = xml.dom.minidom.parse(argv[1])\n    handle_xml_tree(tree, 0)\n   \
    \ sys.stdout.write(tree.tostring('utf-8'))\n```\n\n94 | may 2007 | linuxjournal.com"
