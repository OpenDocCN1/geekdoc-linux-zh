    # Creating a Web-Based Ethernet Analyzer


    With my little analyzer up running, I started thinking it would be cool if I could
    combine a Web-based interface to it. Every web developer knows, running-server
    pages and this web tend not to be easy; there''s nothing better than having an
    analyzer for long periods of time while such a process executes. After years,
    a number of solutions to this problem have been proved, which involve techniques
    such as employing redirection, cookies, and things like Ajax. With such techniques,
    I''ve always thought it were rather possible to make it even more engaging. Having
    just compiled Meuren Lener''s excellent series of UI articles on Ajax programming
    (the October, November 2006 issue of LJ), I wondered if I could combine my analyzer
    with an Ajax-based web page, updating the page with the results as it is generated.


    My strategy is enough: provide a starter web page that starts the analysis on
    the Web server as a background CGI process, and then redirects to another Web
    page that displays the results in HTML text-view, updating the text with results
    from the network analysis. The little HTML web page in Listing


    2 things moving. All web page really does provide a link to that, when clicked,
    calls the stopwatch cgi script. The latter is straightforward CGI, written as
    a bash script. Here''s the entire script:


    ```

    #! /bin/sh


    echo "Content-type: text/html"

    echo ""


    usr/bin/ruby /var/www/dns-watcher.rb \ > /var/www/dns-watcher.log 2>&1

    echo "<html><head>

    echo "<title>Fetching results ...</title>

    echo "<meta http-equiv="Refresh" content=''1''>

    echo "<URL href=index.html">

    echo "</head><body>Fetching results ... </body>

    echo "</html>"

    ```


    The key line of script is the one that invokes the dns-watcher.rb ruby and feeds
    the interpreter output to a file named dns-watcher.log. Note the trailing ampersand
    at the end of this command, which runs the analyzer as a


