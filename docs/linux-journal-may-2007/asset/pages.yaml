  md: "# # Writing\nWeb Applications\nwith Web Services and Ajax\n\n# ## Ajax primer\
    \ with Perl and PostgreSQL.\n\n**IF YOU'VE DONE** new development at a database,\
    \ you've no doubt heard the buzz around Web Services and Ajax. The industry hype\
    \ is so prevalent that you'd almost think people were talking about the next Microsoft\
    \ operating system. Web services are two technologies that allow developers to\
    \ create more interactive web apps, as well as make the development easier and\
    \ less error-prone.\n\nNow that I've said that all, let's take some time to outline\
    \ what we mean by 'Web Services and Ajax'.\n\nA web service is a program that\
    \ is accessible over the Internet by a given program and provides a specific service,\
    \ such as searching an library collection or getting bidding data from eBay. We're\
    \ not talking about a full-fledged application, rather a Web-based Application\
    \ Programming Interface (API) that can be called by a given service to perform\
    \ needed function. Fortunately, the results of the call are returned in a format\
    \ that any calling program can easily parse.\n\nWhen people discuss web services,\
    \ they often mention using JSON, REST, SOAP or XML. These are simple examples\
    \ of protocols used for calling a Web Service. Familiar with these protocols lets\
    \ you use many Web Services provided by the likes of Amazon, Google and eBay.\
    \ However, for my personal development, I've found these to be a bit awful.\n\n\
    Another way allows a Web page to make calls to the database without refreshing\
    \ the page or using hidden frames. For example, if a user changes the value of\
    \ a form field, the Web page could tell the server to make a change to a database,\
    \ without refreshing the page, as would be needed in a standard web app from the\
    \ user's perspective. The update just happens.\n\nIn this article, I outline a\
    \ set of very powerful Web Services that perform specific functions on a database.\
    \ The calls will be done via Ajax. Eventually, we're going to build a simple web\
    \ contact management program that stores a person's first name, last name and\
    \ phone number. We'll move it up and down through the database, make additions\
    \ and corrections and delete the records. The neat thing is that once the page\
    \ is initially loaded, we won't have to refresh it again, even when we make changes.\n\
    \nBefore we get started, we'll need to have a table in a\n\n> List 1. Preparing\
    \ a PostgreSQL Sequence and Table for the Project\n\n```\ncreate sequence contacts_id_seq;\n\
    \ncreate table contacts (\n  id integer default next('contacts_id_seq') not null,\n\
    \  first varchar(20),\n  last varchar(20),\n  phone varchar(20)\n);\n```\n\ndatabase\
    \ to store the information. I happen to use PostgreSQL as my preferred DBMS. For\
    \ our simple application, we need only one table (List 1).\nThe snippet of List\
    \ 1 contains a sequence and a table. The table structure is pretty straightforward\
    \ for our application. Only one thing is worth mentioning in the first build,\
    \ when we insert a record into our table, the id field is set to the next number\
    \ in the contacts_id_seq sequence. The result is a unique integer number that\
    \ can be used to locate.\n\n# Record Number:\n\nFirst:\nLast:\nPhone:\n\n+   [New]\
    \ [Next]\n\n> Figure 1. The No-Frills Web Page for This Sample Application"
