    # When Ajax Held the World on His Shoulders


    If the ancient Greeks had created open-source Web applications, would they have
    used Ajax... or maybe Atlas?


    Sorry I''m late, Francois. I had to pick tonight''s wine away from Henri. He suggested
    it would be perfect for tonight''s menu, and I didn''t want to pass it up. It''s
    a 2003 Chateau-du-Pepe, and after my little quality assurance at Asynchronous
    Fine Wines, I am convinced we will thoroughly enjoy this wine.


    Mon Dieu, Francois! You really looks impressive, away, but what is the idea behind
    the ancient Greek theme? And, the tableaux—Ajax holding on the world with one
    shoulder? I don''t understand. What is Ajax? Non, non, non, mon ami, it''s not
    Ajax. No, Ajax is not a god; he was a warrior in Greek mythology and the hero
    of Trojan. In our case, Ajax refers to Asynchronous JavaScript and XML.


    Welcome, mes amis, to Marie! To match my faithful soirée impromptu is coding with
    very Greek tonight. Nevertheless, we continue to serve exceptional with superb
    Linux and open source software. We have yourselves comfortable, and I have Francois
    since we picked up the wine tonight, and he is no doubt tired from remodelling,
    we shall have a ship to the cellar. Please, mon ami, pour our guests. Of course,
    now that I think about it, tonight''s wine doesn''t quite fit the decor—this is
    a superb wine, mes amis!


    Before you, I was explaining to Francois Ajax, being a character in Greek mythology,
    is a Web development technique primarily designed to create rich, interactive
    and fast Web applications. It doesn''t require a page to load and reach every
    time. A perfect example of this technique pays off with browser-based chats. In
    the past, I''ve used Web-based chats, but their tendency to reload and regenerate
    conversations felt old with modern Ajax implementations.


    Tonight''s menu features two Ajax-based programs. The first is Simon Oual''s GroChat
    (Figure 1), an easy-to-use chat application that you can integrate into your own
    Web site. GroChat features include public as private chats, a file system, multiple
    chat rooms, client-side chat history (so you can keep track of an earlier conversation)
    and it''s incredibly easy to set up and requires no database. You do, however,


    need an Ajax server with PHP to use GroChat, that perfectly fits me.


    GroChat comes in a zip file. To install it, extract it somewhere in your Web server''s
    path. The files arrive in directions with the release number (for example grochatv3),
    so you may want to rename it to something less verbose, before you gochat; there
    is a subdirectory containing the chat files. This file needs to be writable if
    your Ajax user is apache


