    # “Luckily, the hurricane didn’t blow us away. But Fanatical Support™ did.”


    Hurricane Ivan hit our corporate offices in Pensacola, Florida and essentially
    shut us down. To our surprise, we got a call from Rackspace offering to handle
    our phone lines, our support requests, even our sales orders. Thanks to them,
    we were signing up customers as the hurricane was coming ashore. Now, if that''s
    not fanatical, I don''t know what is.


    Going above and beyond to keep customers online is one definition of Fanatical
    Support. What will you be?


    Watch Joel''s story at **www.rackspace.com/fanatical** 1-888-571-8976


