    ```


    Our session has established the ACCEPT rule by deactivating of the state rules
    in the ipt tables (the firewall.sh script added). These rules allow packets that
    are part of an established connection to pass unmodified.


    # SPA Asymmetric Encryption


    To use GPG to encrypt and send a spa packet, you use the fknop command. In this
    case, the ID of fknopd is signed with the command line with the --gpg-recipient
    argument, and the key ID used to send the spa packet is given with --gpg-signing-key
    (the argument below has been observed):


    ```

    [spa_client] fknop -a tcp/22 --gpg-recipient ABC1234 \

    --gpg-signing-key 56780def -w -k 16.2.2.2

