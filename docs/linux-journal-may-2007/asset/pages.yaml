  md: "# Replacement Using Regular Expressions\n\nReplacing strings with curly is\
    \ more complicated than, because we have to decide between a starting and ending\
    \ double-quote character. How to tell? Well, if the quote character is at the\
    \ start of that, then there's a newline character after (or start of quote) curly\
    \ quote.\n\nAnother easy way to describe it is to use code like that, or simply\
    \ write a regular expression. I looked at the section \"-- Regular expressions\"\
    \ in Chapter 4 of Python's library documentation and eventually came up with this:\n\
    \n```\nsdpat = re.compile('((?<=^)(\\\")(?=\\s))')\n```\n\nLet me explain this\
    \ to left. We are creating sdpat, the pattern for a starting double quote or Double-quote\
    \ Pattern. We do that by calling the method in the regular expression module.\
    \ This method matches the pattern and creates a regular expression. I'll use sdpat\
    \ to match straight double quotes that should be turned into nice quotes at a\
    \ quote's\n\nNow, about the pattern--the pattern contains a double-quote character,\
    \ and we escape it with some slash (like \\\"). We like this, also, so to re.compile,\
    \ let's make such a string by running it in front of\n\n(A little explanation\
    \ for Perl users: in Python, escapes are not interpreted in regular single-quoted\
    \ or double-quoted strings; the delimiters do not have interpolation as they do\
    \ in Perl.)\n\nWe can see how strings work by Python's script:\n\n```\n>>> print\
    \ \"\\n\" is a newline\nstring:\n  \\n\n>>> print '\\n' is not a newline\nstring:\n\
    \  \\n is not a newline\n>>>\n```\n\nSo, what is that in this context of strings?\n\
    \n+   1. The part before the quote character (?<=^) means that we are matching\
    \ something (-- in this case), but if it occurs at the beginning of the string\
    \ or it's preceded by a whitespace character. The \\ means \"or\" or (?<=) means\
    \ \"if matched is preceded by whitespace (a space, tab or newline); but doesn't\
    \ include that whitespace in the match\". The enclosing parentheses denote grouping.\n\
    2. The straight double quote: \". That's what we're matching.\n3. The part after\
    \ is (?=\\s). We are adding another condition--that the quote character be followed\
    \ by a whitespace character.\n4. If all three are met--then it is, if quote exists\
    \ (condition 2) and it's at the start of the string or preceded by whitespace\
    \ (condition 1), and it's followed by some non-whitespace character (condition\
    \ 3),\n\nwe replace it with an opening double-quote character.\nBesides the pattern,\
    \ you also pass flags to re.compile.\nWe pass U to make escapes escaped from the\
    \ Unicode character database. Because we're parsing a Unicode string, we think\
    \ that:\n\nLet's fix this quite:\n\n```\n#!/usr/bin/python -tt\nimport xml.dom.minidom\n\
    import sys\\import re  # new in fix3.py\n```\n\n```\nDEBUG = 1\ndef dprint(text):\n\
    \    if DEBUG == 0:\n        sys.stdout.write(text.encode('ascii')\n         \
    \   '') + '\\n')\ndash='\\u2013'  # new in fix3.py\ndash='\\u2013'  # new in fix3.py\n\
    ```\n\n```\n# sdpat: pattern for starting double quote, as\n# \"-- the quote that\n\
    # we look for it at start (AS) or\n# after a space (\\), and we want it to be\n\
    # followed by a non-space\nsdpat = re.compile('((?<=^)(\\\")(?=\\s))(?=S). .U\
    \  # new in fix3.py\n```\n\n```\ndef fixdata(data):\n    print(\"DEBUG-md: Unicode:\
    \ %s\" % data)\n    print(data)\n    print(\" OK, so we wash everything\")\n \
    \   td = data.replace('-', '')\n    print(\" Change 'en' to ' em\")\n    td =\
    \ data.replace(emash, dash)  # new in fix3.py\n    print(\" Making a nice quote-curly\"\
    )  # new in fix3.py\n    sdpat = sdpat.sub(quote, td.data)  # new in fix3.py\n\
    ```\n\n```\ndef sort(arg):\n    doc = xml.dom.minidom.parse(arg[1])\n    handle_xml_tree(doc.documentElement,\
    \ (0))\n    sys.stdout.write(doc.toc('utf-8'))\n```\n\n```\nif __name__ == \"\
    __main__\":\n    sort(sys.argv)\n```\n\nNote that the string for replacing a regular\
    \ expression differs from that of replacement: we use the (substitute) method\
    \ of"
