    # ## Ajax Wap: Rising the Limit


    Let''s start with a plugin that doesn''t generate snapshots, but makes your site
    better by making faster navigation. Ajax Wap improves the responsiveness of WordPress
    pages with a relatively simple trick: it reloads the internal links to other parts
    of your site with only JavaScript function calls.


    When visitors click on these modified links, they launch the script and then request
    the new page, all in the meantime, the visitors will not go blank; the header,
    footer, sidebars-basically every part of the Web site that is common to the current
    page and the one that requested-fully remain unchanged.


    Regardless of which mode, once everything is in place, users who have used Ajax
    in their browsers will enjoy a faster or at least much smoother navigation of
    pages. Users Wap will still be able to load and read the pages in the original
    mode.


    The part to be replaced, but only gradually, and the block of new content comes
    in place as the Ajax script will have ready. During this, so that it is actually
    doing something. Ajax Wap superimposes an GIF of rotating the whole page while
    it moves from the old page to the new one, using control of the script. It can
    be set to open, slide or hide


    Some advice: keep a copy of the original WordPress Files and restore them if you
    use Ajax Wap and decide to switch to Optimized mode. If you make repeat installation
    setups or Ajax code in the strings, things will happen. Don''t forget to spend
    a few minutes checking the configuration variables of Ajax Wap to adapt to your
    taste, and to your theme and General WordPress setup. The most important options
    are Ajax_wp_base_path, which is the relative path from the root of your server
    to your WordPress installation folder, and the list of Ajax_image_names, which
    should normally require more than Ajax Wap.


    How slowly or quickly this happens depends on the speed of the internet connection,
    load of your server and the speed of your computers. If something go wrong, after
    a programmable trouble, Ajax Wap will simply bypass the loader page in the standard
    mode.


    Ajax Wap depends on a few JavaScript libraries that are installed in the distribution.
