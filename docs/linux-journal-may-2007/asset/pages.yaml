  md: '# TECH TIPS


    Mutt make e-mail sorting and navigation a breeze, and a handy script to help you
    find other scripts.


    # >> An Easy Way for Users to Move Mail into Designated Folders


    You''d think with the wonderful GUI IMAP e-mail clients available, the character-based
    Mutt wouldn''t have much anyway. Yet, a number of us at Linux Journal are still
    stuck on Mutt for all sorts. One reason is that you can configure Mutt to behave
    about any way you like.


    Additionally, you could write-scripts to sort your mail into the appropriate folders,
    and have filters to do that. However, the filters aren''t perfect, and many messages
    end up in the wrong subject. So, I have created a long list of macros for Mutt
    to move mail away with a single Ctrl-keypress, which beats the click of a duplicate
    that dragging and dropping mail to a sidebar with a folder (or vice versa).


    ```

    macro index <"r=Readdir"

    macro index <"p=<s/Folders/Press-Releases"

    macro index <"n=<Folders/News-Alerts"

    macro index <"h=<Folders/Humor/"

    macro index <"k=<sSPAM"

    ```


    I''ve gotten to using the comma key as my "go-to", so I go to the Press-Releases
    subfolder by typing the keys, and then N. The combination takes me to News-Alerts,
    and so on. If its not intuitive for you, pick another keystroke and modify the
    macros accordingly.


    I''ll also want to get back to the inbox easily. So, if you want to create a substitute
