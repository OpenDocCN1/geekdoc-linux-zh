  md: "# INEPTH\n\n# Listing 2. A Simple HTML Web Page That Starts the Analyzer\n\n\
    ```\n<html>\n<head>\n  <title>Start a new DNS Analysis</title>\n</head>\n<body>\n\
    \  Click to\n  <a href=\"/cgi-bin/startwatch.cgi\">Start</a>\n</body>\n</html>\n\
    ```\n\nListing 4 counts the dns-watcher.js code. A lot of what happens has been\
    \ covered by Revent's example Ajax. The code starts by declaring global variables\
    \ that are used throughout the remainder of the code:\n\n```\nvar capturing =\
    \ false;\nvar match = new RegExp(\"END run\");\nvar r = new XMLHttpRequest();\n\
    ```\n\nThe capturing boolean is set to true when the analyzer is capturing and\
    \ to false. A regular expression is created to match a string containing the \"\
    END run\". Finally, an Ajax object is created with a call to the getXMLHttpRequest\
    \ method, which is taken directly from Revent's examples.\nThe StartWatcher method\
    \ handles the heavy lifting by calling the updateCaptureData method every 1.5\
    \ seconds and setting capturing to true:\n\n# Listing 3. The Network Analysis\
    \ Results Web Page\n\n```\n<html>\n<head>\n  <title>web-based DNS Watcher</title>\n\
    \  <script language=\"javascript\" src=\"/js/dns-watcher.js\"></script>\n</head>\n\
    <body>\n<h1 id=\"watcherarea\">web-based DNS Watcher</h1>\n```\n\nHere are the\
    \ results of your DNS analysis:\n\n```\n<textarea name=\"watcherarea\" cols=\"\
    100\" rows=\"20\"></textarea>\n```\n\nWaiting for results ...\n\n```\n<script>\n\
    startWatcher();\n</script>\n```\n\n```\n<p>\n  <a href=\".startwatcher.html\"\
    >another analysis</a>\n  (which stops this).\n</p>\n</body>\n</html>\n```\n\n\
    ```\nfunction startWatcher() {\n  setInterval(updateCaptureData(), 1500);\n  capturing\
    \ = true;\n}\n```\n\nIt is within the updateCaptureData method that the Ajax occurs,\
    \ with the request object being used to access the dns-watcher.log file and returns\
    \ its contents. (Listing 5 counts the get_watcher_data.cgi script, which is written\
    \ in Ruby). Once the CGI script has been invoked on the Web server, a server calls\
    \ updateCaptureData:\n\n```\nfunction updateCaptureData() {\n  if (capturing)\
    \ {\n    r.open(\"GET\", \"/cgi-bin/get_watcher_data.cgi\");\n    false);\n  \
    \  r.send(null);\n    displayCaptureData();\n  }\n}\n```\n\nThe displayCaptureData\
    \ method is adapted from Revent's code and processes the results of the Ajax call,\
    \ which are available from the textarea-area within the web page.\n\n```\nte.value\
    \ = r.responseText;\n```\n\nNote the use of the following line of JavaScript to\
    \ scroll the text to the area of the results:\n\n```\nte.scrollTop = te.scrollHeight;\n\
    ```\n\nAnd finally, note that the displayCaptureData method sets the capturing\
    \ boolean to false as soon as a line that matches the expression appears within\
    \ the data coming from the Ajax request (see\n\nThe process is continued by sending\
    \ a short HTML page to the browser that renders the results page, called watcher.html,\
    \ within its section, and contains initially empty text-area called watcherarea.\
    \ A call to the startWatcher method occurs as soon as the browser loads the results\
    \ of the web page.\n\nThe Results page loads in a JavaScript code (dns-watcher.js)\
    \ within its header, and creates a simple HTML results page that contains initially\
    \ empty text-area called watcherarea.\n\n78 | may 2007 www.linuxjournal.com"
