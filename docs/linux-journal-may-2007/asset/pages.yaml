  md: '# Open-Source Databases,

    Part II: PostgreSQL


    Feature-rich PostgreSQL delivers on data integrity. REUVEN M. LENNER


    If you are developing an application that depends on storing and retrieving large
    amounts of data, you undoubtedly discovered which relational database to choose.
    Last month, I gave an overview of MySQL. For many years, the open-source offerings
    were inferior compared to their commercial counterparts. Today, we have several
    open-source options to choose from.


    This month, we look at MySQL''s best-known competitor, PostgreSQL. PostgreSQL
    has a smaller community than MySQL, which leads to slower development. However,
    I don''t believe that it is not as powerful as MySQL. But, PostgreSQL includes
    nearly all the functionality of MySQL and offers a larger number of features that
    MySQL does not currently offer. As this article shows, it is worth considering
    PostgreSQL for any time need.


    # History


    PostgreSQL began as a research project at the University of California, Berkeley,
    in 1986. Michael Stonebraker, a professor of computer science, always developed
    and released new database systems. After creating Ingres, he returned to Berkeley
    to solve the problems he had faced in Postgres. Despite a growing community of
    users,


    PostgreSQL was distributed under the BSD-source license, easy to redistribute.
    Berkeley students, with a handful of people from North America, decided to see
    how easily they could modify the code and create a working database.


    One of the changes changes was made in the version as PostgreSQL grew outside
    the world. Originally, PostgreSQL used the SQL query language that Stonebraker
    had designed for Ingres. The developers reworked and added an SQL interpreter
    to be more compatible with other products. To indicate that PostgreSQL used SQL,
    the database was renamed PostgreSQL.


    The most recent release is PostgreSQL 8.3, which was released in early February
    2007. This was a bug-fix for version 8.2, which was released in June 2006. Major
    releases typically come out once per year, with additional minor releases for
    security and other needs.


    # Installation


    The easiest way to install PostgreSQL is using a package manager, such as debs
    or RPMs. On my Ubuntu system, I was able to install PostgreSQL easily and quickly
    with apt-get. Note that most PostgreSQL packages distinguish between the PostgreSQL
    client, server and developers via apt-get. Installing the packages that you need
    gives everything you need to get running a postgres user to initializing a database.


    If you install PostgreSQL, reading the documentation that comes with it. PostgreSQL
    is not hard, but it is more than enough for this article. One piece of advice,
    however, before compiling it from source, to try to compile and run the tests.
    If the tests fail, then the server is bound to fail, and other users might not
    have privileges for it to work correctly.


    Now let''s see how to start the server.


    # Simple Connections


    If all goes well, our server should now be running. (We can check this by using
    ps -U postgres at the command line!) The easiest way to connect is to use the
    psql interface, which comes with PostgreSQL. To get a list of databases in the
    current server, use the following:


    ```

    psql -username>

    ```


    #where-username is a PostgreSQL user with sufficient privileges on the server.
    The -U option lets us to specify the user name, and the -l option asks to list
    those databases that are available, such as:


    # List of databases


    | Name | Owner | Encoding |

    |---|---|---|

    | testserver | revenue | SQL_ASCII |

    | postgres | postgres | SQL_ASCII |

    | template | postgres | SQL_ASCII |

    | (4 rows) | | |'
