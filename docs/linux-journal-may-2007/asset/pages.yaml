  md: "# The neat thing is that once the page is initially loaded, we won't have to\
    \ refresh it again, even when we make changes.\n\n```\n<html>\n<head>\n  <title>Contact\
    \ Application</title>\n  <script src=\"http://contacts.js\"></script>\n</head>\n\
    <body>\n  <form method=\"POST\" name=\"main\">\n    <input type=\"button\" name=\"\
    New\" onclick=\"insert_record();)\" />\n    <input type=\"button\" name=\"delete\"\
    \ onclick=\"delete_record(main.id);\" />\n<br>Record Number: <input id=\"id\"\
    \ name=\"id\">\n<br>First: <input type=\"id\" name=\"first\" onchange=\"update_record(main.id);\"\
    \ value=\"first.main.value\";\n<br>Last: <input type=\"id\" name=\"last\" onchange=\"\
    update_record(main.id);\" value=\"last.main.value\";\n<br>Phone: <input type=\"\
    id\" name=\"phone\" onchange=\"update_record(main.id);\" value=\"phone.main.value\"\
    ;\n<br><input type=\"button\" name=\"Previous\" onclick=\"select_record(main.id);\"\
    \ />\n    <input type=\"button\" name=\"Next\" onclick=\"select_record(Number(main.id)\
    \ + 1);\" />\n</form>\n</body>\n</html>\n```\n\nThis simply calls a JavaScript\
    \ function called insert_record when a user presses the button. The Delete, Previous\
    \ and Next buttons work similarly. The magic is in the JavaScript. Let's look\
    \ at the JavaScript first (List 1).\n\ninsert_record() JavaScript function, which\
    \ is called when a user presses the button, is the simplest of the JavaScript\
    \ functions. All insert_record() uses the send_transaction() function to call\
    \ the insert.pl Web Service. In this case,\n\nselect_record() and update_record()\
    \ functions are all wrappers for send_transaction().\ntransfer() function is where\
    \ the Ajax comes into our application. This function takes the URL of the service\
    \ that needs to be passed to the service via HTTPS GET method. Then it creates\
    \ an object that allows the service to be called. We have to jump a small loop,\
    \ because Microsoft will call this object ActiveX while\n\nListing 2. The Basic\
    \ HTML for the Application\n\nNow we have the database table defined, we can start\
    \ to finish the actual application. Listing 2 shows the HTML for our application,\
    \ and List 1 shows what the application looks like in a Web browser.\n\nAs you\
    \ can see, simple is just simple, it's simple to drop down to the button to make\
    \ decisions because our easier control.\n\nFigure 1 shows our application with\
    \ a new contact or the current record by boring the buttons at the top. At the\
    \ bottom of the application, we can move to the previous or next record in Database.\
    \ In case we have input fields to hold the first name as well as the phone number.\n\
    We also have a form to display the record in number. In actual application, we\
