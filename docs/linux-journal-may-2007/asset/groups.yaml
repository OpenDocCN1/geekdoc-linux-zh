- md: "\n## Example 3: Simple User\nName/Password With Ajax\n\nOur final example creates\
    \ a login screen. The idea is to provide feedback on an incorrect password without\
    \ refreshing the web page. On select, the main menu loads without requiring a\
    \ full page reload.\n\nMockKit functionality isn't only for debugging. It can\
    \ be co-opted to report both user name/password errors and use this mechanism\
    \ to report errors with the login script (server side and so on):\n\n```javascript\n\
    function fatallog(sendLogTo, logIn) {\n// handles our errorCalls, displays in\n\
    // element #1, displaying the error in\n// yellow fading it out after 5 seconds:\n\
    \n  var err = sendLog.info(\":\\n\");\n  if (err.length == 0) {\n    err = \"\
    Unknown error\";\n    sendLogTo(innerHTML);\n    <pre>We're sorry an error occurred:\
    \ \" + err + \" Please try again.</pre>\");\n  }\n\n  highlight(sendLogTo, (delay:\
    \ 1, duration: 5));\n  // Yellow Fade Technique\n}\n```\n\nThe code that creates\
    \ our replacement span is in the obvious: makeNew = SPAN(), yet this monster requires\
    \ some explanation. DOM elements are created through MockKit functions via MockKit.DOM\
    \ and other MockKit methods as it is here to create elements, query, swap and\
    \ even create DOM elements can be found in this list: getElementsByTagNameAndClass(document,currentWindow)\
    \ and createDOM(element) to a few. MockKit.DOM.createDOM(what) is what\n\n```javascript\n\
    makeNew = A('href=http://www.example.com');\n```\n\nThis example covered a lot\
    \ of ground-MockKit, MockKit.DOM.Signal.connect(), MockKit.Base.partial() and\
    \ MockKit.createElement(element). However, we've scratched only the surface of\
    \ the and, and there's a whole lot of MockKit to cover. The next example takes\
    \ the normal logic found over all the web and \"Web 2.0\"s it.\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_68_0.png)\n\
