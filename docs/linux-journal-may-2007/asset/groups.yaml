    \ getting bidding data from eBay. We're not talking about a full-fledged application,\
    \ rather a Web-based Application Programming Interface (API) that can be called\
    \ by a given service to perform needed function. Fortunately, the results of the\
    \ call are returned in a format that any calling program can easily parse.\n\n\
