    # 2 Systems in One


    - Two fully independent systems in a 2U

    - Ability to run two discrete operating systems

    - Up to 16 CPU cores

    - Up to 12 hot-swappable SATA, SCSI, or SAS drives

    - RAID 0, 1, 5, 6, 10, available on both systems

    - Opteron™ or Xeon™ multi-core processors

    - Up to 64GB memory per motherboard

    - One available PCI-X or PCI-E slot per motherboard

    - High efficiency AC and DC power


    Built on open standards, the Gemini 2U elegantly accommodates two discrete motherboards
    in a 25" chassis uniquely designed for easy access from the front.


    Gemini 2U represents the realization of intoxicating power and superior environmental
    specifications, with considerably less power consumption, less heat and less noise.
    Remarkably, it fits nicely into any standard rack. Front to back.


    At Open Source Systems understand that you need practical, customizable, and affordable
    solutions that are easy to manage and maintain.


    For more information and to request your evaluation unit today, visit us at www.OpenSourceSystems.com,
    or call us direct at 866-664-7867.


