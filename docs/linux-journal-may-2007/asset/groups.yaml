    # Parallel NFS (pNFS) Bridges to a Mature Standard


    Thanks to the emergence of low-cost Linux clusters, high-performance computing
    (HPC) is no longer the domain of an elite of public-sector-funded researchers.
    In fact, HPC can now be found addressing challenges as easily as simulating the
    benefit to the imagination of an individual product design.


    The second challenge, as clusters become more powerful, new challenges have emerged.
    The first challenge was to manage the vast amount of data created and consumed
    by these powerful clusters, but that is also capable of keeping engines fully
    fueled with data. Without data, the fastest and supercomputers become nothing
    more than space heaters.


    The second challenge revolves around the data created by clusters scaling out.
    Copying or moving data between clusters is rarely an option unless network overhead
    and complexity allow. Ideally, node stays on the network where it resides on the
    cluster. Initially, clusters used NFS standard, which had the advantage of being
    widely understood, supported by many vendors and providing easy access to data
    for systems outside the cluster. However, NFS moves all data and metadata through
    a single network endpoint (server) that creates a bottleneck when trying to cater
    to the IO of many clients. The result is limited bandwidth scale—a solution is
    required.


    Because pNFS is an evolution of the NFS standard, it will allow organizations
    that are familiar with NFS to achieve parallel performance with a minimum of changes.
    Plus, it will become part of the NFS standard, and it can be used with cluster
    filesystem on any device.


