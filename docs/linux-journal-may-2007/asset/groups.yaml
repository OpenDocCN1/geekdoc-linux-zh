    # QUICK TAKES


    PostgreSQL could store a limited amount of data in each row, so this might come
    as news to some people. There is no built-in support for indexing TEXT columns,
    but an add-module, search2, is relatively easy to install and provides such functionality
    for anyone who needs it.


    The added_at column is of type PostgreSQL provides a very sophisticated set of
    time-and date-handling runtimes, to handle the difference between two basic data
    types: TIMESTAMP and INTERVAL. An interval tells how long something took. We can
    subtract two timestamps (to get an interval) or add an interval to a timestamp
    (to get a new timestamp). PostgreSQL lets define intervals using English-like
    syntax, such as:


    ```

    SELECT id FROM people WHERE added_at = NOW() -n interval ''30 days'';

    ```


    The above query shows all of the people who were added to our database in the
    last 30 days.

    The added_at column has a DEFAULT value, which means that if we fail to insert
    an explicit value for added_at, PostgreSQL will use the current time (at the time
    of insertion).


    # The SERIAL Data Type


    The id column, which is defined by our primary keys, uses a SERIAL data type.
    The thing is, SERIAL isn''t a data type at all. It''s just sugar that PostgreSQL
    does:


    +   - It creates a new sequence object, values are integers that start at 1 and
    increase each time we ask for a value.

    - It defines the column to INTEGER.

    - It sets the DEFAULT clause for our column to be the result of requesting a value
    from the sequence.


    This might sound like a way of saying, "SERIAL gives us auto-incrementing column."
    And that''s true, but you can have many sequences in a table, and each can have
    all sorts of properties associated with it, including its starting point and increment.


    Finally, by we define it as a primary key and added_at to be unique, PostgreSQL
    creates two indexes on these columns. When we execute the create TABLE command,
    PostgreSQL notifies us what it''s doing during the


    ```

    NOTICE: CREATE TABLE create implicit sequence "people_id_seq"

    NOTICE: CREATE / PRIMARY KEY create index "pkey" for table "people"

    NOTICE: CREATE / UNIQUE create index "people_added_at_key" for table "people"

    ```


    If we drop the table, these implicit objects are dropped automatically.

    To list all of the sequences and views in our database, we can use the


    ```

    linux= = \d

    ```


    # List of relations


    | Schema | | Type | Owner |

    | --- | --- | --- | --- |

    | public | people | | | |

    | public | people_id_seq | sequence | | (2 rows) |


    We can also use a letter ''d'' to get a list of only tables (t), indexes (i),
    sequences (s), functions (f) or views (v). For example, here is one of the indexes
    that we have:


    ```

    linux= = \d

    ```


    # List of relations


    | Schema | | Type | Owner | Table |

    | --- | --- | --- | --- | --- |

    | public | people_email_address_key | index | reuen | |

    | public | people_key | index | reuen | (2 rows) |


    We can also use ''d'' to inspect a more object. For example, we can see our people
    with :d People:


    ```

    linux= = \d

    ```


    # Table "people"


    | Column | Type | Modifiers |

    | --- | --- | --- |

    | id | Integer | not null default |

    | nextval(people_id_seq::regclass) | |

    | first_name | text | not null |

    | last_name | text | not null |

    | email_address | text | not null |

    | added_at | timestamp without time | not null default(now)|

    | people_key | KEY, btree |

    | people_email_address_key | UNIQUE, btree (email) |


    There are several things to notice in the output:


    +   - PostgreSQL sees the table people, not just people. Each column might be
    every object except inside, a schema (a name). We can use schemas to partition
    a table or to handle large partitions. This means we don''t need to split data
    across two tables.


    +   - The table name, as well as all columns, are displayed in uppercase letters.
    That''s because PostgreSQL tries to adhere to the SQL standard as possible, and
    the standard identifies be case-sensitive. If you use case-sensitive names (and
    probably don''t), use double quotes around the identifiers.


    +   - Our id column has been transformed, into an integer by a default value from
    a sequence.


