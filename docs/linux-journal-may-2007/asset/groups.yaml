    <result>\n<field name=\"id\" value=\"25\"></field>\n</result>\n```\n\n大部分 JavaScript\
    \ 代码可以用于大型应用程序的其他部分，甚至用于许多不同的应用程序。Web 服务变成了我们用 JavaScript 粘合在一起构建的厚客户端，这正是 Web\
    \ 服务成为一种如此优雅的开发方法的原因。\n\n从用户的角度来看，使用 API 执行数据库功能是一个大问题。正如所提到的，一旦应用程序加载，用户就必须承担重新下载和在浏览器中重新编辑它的成本。这更加复杂，并且可能会导致显著延迟。此外，给定操作的结果以小型\
    \ XML 片段的形式返回，带宽需求极小。人们认为，这不仅让用户感知到这种应用程序，还会增加服务器和网络基础设施提供程序的压力。\n\n```perl\n\
    print \"Content-type: text/xml\\n\";\n\nprint \"<result>\";\nprint \"<field name=\"\
    id\" value=\"$index\"></field>\";\nprint \"</result>\";\n```\n\n但是，在数据库表方案中添加一个新字段（例如电子邮件地址）将会如何？那么，我们必须在数据库表中添加一个适当的字段。然后，我们需要添加该字段，\n\
    \n程序如列表 4 所示。\n\n此程序程序连接到数据库，向 contacts 表插入数据，检索创建记录的 id，并以带框 MIME 类型的 XML 块返回结果。生成的\
    \ XML 结果如列表 5 所示。\n\nselect、delete、insert 和 update 服务非常相似，如列表 6、7 和 8 所示。\n\n\
    列表 6 所示的 select 过程接受单个参数——要检索的记录 id。结果是一个包含该记录所有字段和相应值的 XML 文件。这允许我们使用该记录的所有字段调用函数以备后之用。\n\
    \n列表 7 所示的 delete 过程接受一个 id 并删除具有该 id 的记录。然后，程序获取下一条记录并确保返回 id。\n\n列表 8 所示的 update\
    \ 过程接受记录 id、字段名和新值作为参数。然后，程序用新值更新记录的给定字段。新值通过 XML 返回。\n\n诚然，我们的应用程序相当简单，但它执行了在数据库上需要执行的所有基本功能：插入、删除、更新和搜索。更重要的是，该应用程序中没有任何一个元素是难以编写、调试或理解的。通过我接下来概述的几处改进，Web\
    \ 服务：\n\n# 超高密度、强大、可靠……\n数据中心管理简化！\n15 英寸深，2-Xeon/Opteron 或 P4 (带RAID) 选项\n\n\
    ![](img/6be405694cb4aa0c113e76f02a6a5081_62_0.png)\n\n# 针对...的定制解决方案\nLinux, BSD,\
    \ W2K\n\n# 高性能网络解决方案\n\n- 数据中心管理\n- 应用集群\n- 网络和存储引擎\n\n# 机架式服务器产品\n- 1U 关税 $499：C3-1GHz,\
    \ RAM 256MB, 20GB IDE\n- 2U 配 16 个刀片，快速部署及更多..\n\n# Iron Systems, Inc.\n\n540\
    \ Dado Street, San Jose, CA 95131\nwww.ironssystems.com\n\n# 电：1-800-921-IRON\n\
    \n# 特性 Web 服务和 Ajax\n\n# 列表 6. 查询数据的 Perl 脚本\n\n```perl\n#!/usr/bin/perl\n\nuse\
    \ CGI;\nuse DBI;\n\n$db = DBI->connect(\"dbi:Pg: dbname=database\",\n  \"$postgres\"\
    , \"password\");\n\nprint \"Content-type: text/xml\\n\\n\";\nprint \"<result>\"\
    ;\n\n$cgi = new CGI;\n\n$id = $cgi->param(\"id\");\n\n$sth = $db->prepare(\"select\
    \ * from contacts where id=$id\");\n$sth->execute();\n\n$a = $sth->fetch_hashref();\n\
    \nforeach $key (keys %a) {\n  print \"<field name=\\$key\\\" value=\\$a{$key}</field>\\\
    n\";\n}\n\nprint \"</result>\";\n```\n\n# 列表 7. 更新记录的 Perl 脚本\n\n```perl\n#!/usr/bin/perl\n\
    \nuse CGI;\nuse DBI;\n\n$db = DBI->connect(\"dbi:Pg: dbname=database\",\n  \"\
    $postgres\", \"password\");\n\n$cgi = new CGI;\n\n$id = $cgi->param(\"id\");\n\
    $field = $cgi->param(\"field\");\n$value = $cgi->param(\"value\");\n\n$db->update(\"\
    update contacts set $field=$value where id=$id\");\n\nprint \"Content-type: text/xml\\\
    n\\n\";\nprint \"<result>\";\nprint \"<field name=\\$field\\\" value=\\$value</field>\"\
    ;\nprint \"</result>\";\n```\n\n# 列表 8. 删除记录的 Perl 脚本\n\n```perl\n#!/usr/bin/perl\n\
    \nuse CGI;\nuse DBI;\n\n$db = DBI->connect(\"dbi:Pg: dbname=database\",\n  \"\
    $postgres\", \"password\");\n\n$cgi = new CGI;\n\n$id = $cgi->param(\"id\");\n\
    \n$db->delete(\"delete contacts where id=$id\");\n\n$sth = $db->prepare(\"select\
    \ max(id) from contacts where id=$id\");\n$sth->execute();\n($index) = $sth->fetchrow_array();\n\
    \nprint \"Content-type: text/xml\\n\\n\";\nprint \"<result>\";\nprint \"<field\
    \ name=\\\"id\\\" value=\\$index</field>\";\nprint \"</result>\";\n```\n\n如何改进我们的服务？首先，我们需要考虑安全问题。我们的\
    \ Web 服务应该允许授权用户执行数据库功能。你注意到我们数组中的所有字段类型都是 varchar(20)。这并不灵活方便。为了真正有用，我们需要处理整数和布尔值。通过简单的将表名作为参数之一，我们可以构建修改我们其他表的\
    \ Web 服务。通过将 AJAX 与我们的品牌结合，我们将能够编写对用户输入响应更快的应用程序。\n\nMike Diecht 是新墨西哥州国家实验室的承包商，在那里我们网络管理软件。Mike\
    \ 与妻子和两个儿子生活，可以通过 diecht.com 与联系。\n\n# OSBC\n5月22-23日，2007\nPALACE HOTEL | 旧金山，加\n\
    OSBC 开源业务会议 (OSBC) 是高级业务领导者、IT 专业人员、律师和风险投资人合作新兴业务模式、策略和开源盈利的唯一论坛。OSBC 探讨了开源软件带来的法律、投资和客户风险、回报与机遇。\n\
    \n# 主题包括：特色嘉宾：\n\n- 未来：开源业务模式（前沿模式以及领先公司业务业务的细节）、新兴问题（关注、有效的下载策略等）以及开源供应商兴起引起关注的其他主题。\n\
    - Marc West, H&R Block CIO\n- Tim Golden, 美国银行 Linux 工程高级副总裁\n- 现状：检查 CIO 问题——实施策略、成本节约等，以及如何与开源社区合作并获得高质量的支持。\n\
    - Maarten Micks, MySQL CEO\n- Eben Moglin, 自由法律中心总顾问及哥伦比亚大学法学院教授\n- 法律：如何将专有产品开源、为企业建立开源审查委员会的机制、GPL\
    \ 对行业意味着什么，以及更多（GPL 资质）。\n- Matthew Zulik, Red Hat CEO\n- Jon Stumpf, AIG CTO\n\
    \n金牌赞助商：\n黄金赞助商：\n\n制作单位\n\n"
