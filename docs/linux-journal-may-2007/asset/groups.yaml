  mdcn: "\n\n## 锻造台\n\nFirebug 引入了一种全新的日志系统，使得在不使用 `alert` 的情况下产生调试输出成为可能。我简直无法相信花了这么长时间才意识到，拥有不需要产生模态对话框的日志方法是有帮助的。无论花了多久，我们现在都可以使用\
    \ `console.log` 将消息写入 Firebug 控制台，如下所示：\n\n```javascript\nconsole.log('Now executing\
    \ the 'function.')\n```\n\n或者：\n\n```javascript\nconsole.log('username was ' +\
    \ username + '*');\n```\n\n实际上，Firebug 能够实现比嵌入式、类似 print 的字符串得多的效果：\n\n```javascript\n\
    console.log('username was %s', username)\n```\n\nFirebug 提供了一系列日志函数，每个函数都以不同的级别和颜色输出。这些函数是：\n\
    \n- console.debug\n- console.info\n- console.warn\n- console.error\n\n这些方法的输出显示在\
    \ Firebug 控制台中，你可以通过点击 Firebug 图标正下方的 Console 按钮来查看。请注意，使用这些方法可能与缺少 Firebug 的浏览器不兼容。\n\
    \n控制台不仅仅是一个接收消息的区域。与 Ruby 的 IRB 和 Python 的交互模式一样，Firebug 的控制台允许你在页面上下文中执行 JavaScript。对获取页面上的表单列表感兴趣吗？只需：\n\
