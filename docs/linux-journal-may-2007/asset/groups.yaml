    pages, if one does it once. But having to repeat manual operations on subsequent
    revisions becomes tedious, especially on a longer document, such as a poetry collection
    or novel. What if we have to repeat these operations after importing text from
    an email message, for example? Fortunately, ODF is open, so we are able to manipulate
    files with any programming language. Let''s see if we can do that manually, to
    make sure we''re doing. Once done, we''ll create a script to do more things with
    the document.


