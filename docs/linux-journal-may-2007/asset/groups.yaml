- md: "\n## INEPTH\n\n### Listing 2. A Simple HTML Web Page That Starts the Analyzer\n\
    \n```html\n<html>\n<head>\n  <title>Start a new DNS Analysis</title>\n</head>\n\
    <body>\n  Click to\n  <a href=\"/cgi-bin/startwatch.cgi\">Start</a>\n</body>\n\
    </html>\n```\n\nListing 4 counts the `dns-watcher.js` code. A lot of what happens\
    \ has been covered by Revent's example Ajax. The code starts by declaring global\
    \ variables that are used throughout the remainder of the code:\n\n```javascript\n\
    var capturing = false;\nvar match = new RegExp(\"END run\");\nvar r = new XMLHttpRequest();\n\
    ```\n\nThe capturing boolean is set to true when the analyzer is capturing and\
    \ to false otherwise. A regular expression is created to match a string containing\
    \ the \"END run\". Finally, an Ajax object is created with a call to the `getXMLHttpRequest`\
    \ method, which is taken directly from Revent's examples.\n\nThe `StartWatcher`\
    \ method handles the heavy lifting by calling the `updateCaptureData` method every\
    \ 1.5 seconds and setting `capturing` to true:\n\n### Listing 3. The Network Analysis\
    \ Results Web Page\n\n```html\n<html>\n<head>\n  <title>web-based DNS Watcher</title>\n\
    \  <script language=\"javascript\" src=\"/js/dns-watcher.js\"></script>\n</head>\n\
    <body>\n<h1 id=\"watcherarea\">web-based DNS Watcher</h1>\n```\n\nHere are the\
    \ results of your DNS analysis:\n\n```html\n<textarea name=\"watcherarea\" cols=\"\
    100\" rows=\"20\"></textarea>\n```\n\nWaiting for results ...\n\n```html\n<script>\n\
    \  startWatcher();\n</script>\n```\n\n```html\n<p>\n  <a href=\".startwatcher.html\"\
    >another analysis</a>\n  (which stops this).\n</p>\n</body>\n</html>\n```\n\n\
    ```javascript\nfunction startWatcher() {\n  setInterval(updateCaptureData(), 1500);\n\
    \  capturing = true;\n}\n```\n\nIt is within the `updateCaptureData` method that\
    \ the Ajax occurs, with the request object being used to access the `dns-watcher.log`\
    \ file and returning its contents. (Listing 5 counts the `get_watcher_data.cgi`\
    \ script, which is written in Ruby). Once the CGI script has been invoked on the\
    \ Web server, a server calls `updateCaptureData`:\n\n```javascript\nfunction updateCaptureData()\
    \ {\n  if (capturing) {\n    r.open(\"GET\", \"/cgi-bin/get_watcher_data.cgi\"\
    );\n    r.send(null);\n    displayCaptureData();\n  }\n}\n```\n\nThe `displayCaptureData`\
    \ method is adapted from Revent's code and processes the results of the Ajax call,\
    \ which are available from the `textarea-area` within the web page.\n\n```javascript\n\
    te.value = r.responseText;\n```\n\nNote the use of the following line of JavaScript\
    \ to scroll the text to the area of the results:\n\n```javascript\nte.scrollTop\
    \ = te.scrollHeight;\n```\n\nAnd finally, note that the `displayCaptureData` method\
    \ sets the capturing boolean to false as soon as a line that matches the expression\
    \ appears within the data coming from the Ajax request.\n\nThe process is continued\
    \ by sending a short HTML page to the browser that renders the results page, called\
    \ `watcher.html`, within its section, and contains initially empty text-area called\
    \ `watcherarea`. A call to the `startWatcher` method occurs as soon as the browser\
    \ loads the results of the web page.\n\nThe Results page loads in a JavaScript\
    \ code (`dns-watcher.js`) within its header, and creates a simple HTML results\
    \ page that contains initially empty text-area called `watcherarea`.\n\n## Growing\
    \ a World of Linux Professionals\n\nWe at the Linux Professional Institute believe\
    \ the best way to spread the adoption of Linux and Open Source software is to\
    \ grow a world widely supplied of talent, qualified and accredited IT professionals.\n\
    \nWe can only achieve this through a network of local 'on the ground' partner\
    \ organizations. Partners who know the sector and understand the needs of the\
    \ IT work force. Through this active policy of Regional Enablement we are seeking\
    \ local partners and assisting them in their efforts to promote Linux and Open\
    \ Source professionalism.\n\nWe realize the importance of providing a global standard\
    \ of measurement. To assist in this effort, we are launching a Regional Enablement\
    \ Initiative to help understand, nurture and support the needs of the enterprise,\
    \ governments, educational institutions and individual contributors around the\
    \ globe.\n\nWe encourage you to contact our new regional partners listed above.\n\
    \n**Together we are growing a world of Linux Professionals.**\n\n# Stable. Innovative.\
    \ Growing.\n\n### Listing 4. The Ajax-Enabled JavaScript Code\n\n```javascript\n\
    var capturing = false;\nvar matchEnd = new RegExp(\"END run\");\nvar r = new XMLHttpRequest();\n\
    \nfunction startWatcher() {\n  setInterval(updateCaptureData(), 1500);\n  capturing\
    \ = true;\n}\n\nfunction getXMLHttpRequest() {\n  try {\n    return new ActiveXObject(\"\
    Msxml.XMLHTTP\");\n  } catch (e) {\n    return new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n  }\n}\ntry {\n  return new XMLHttpRequest();\n} catch (e) {\n  return null;\n\
    }\n\nfunction updateCaptureData() {\n  if (capturing) {\n    r.open(\"GET\", \"\
    /cgi-bin/get_watcher_data.cgi\");\n    r.send(null);\n    displayCaptureData();\n\
    \  }\n}\n\nfunction displayCaptureData() {\n  var te = document.getElementById(\"\
    watcherarea\");\n  if (r.readyState == 4) {\n    if (r.status == 200) {\n    \
    \  te.value = r.responseText;\n      te.scrollTop = te.scrollHeight;\n      if\
    \ (matchEnd.test(te.value)) {\n        capturing = false;\n      }\n    } else\
    \ {\n      te.value = \"Web-based DNS unavailable.\";\n    }\n  }\n}\n```\n\n\
    ### Listing 5. A Simple CGI to Retrieve the Captured Data\n\n```javascript\nif\
    \ (matchEnd.test(te.value)) {\n  capturing = false;\n}\n```\n\nThis check is very\
    \ important. However, the browser continues to send Ajax request to the server\
    \ every 1.5 seconds as long as the capture.html result page is displayed in the\
    \ browser, even after the user has finished and isn't expecting more data. With\
    \ this code, the Ajax request is switched off, reducing the load on the Web server\
    \ (keeping the Apache server from growing load).\n\nTo deploy solution, I created\
    \ a simple script to copy the required components into Apache locations on my\
    \ Web server (Apache on Ubuntu):\n\n```bash\nsudo cp html.html /var/www/\nsudo\
    \ cp start.html /var/www/\nsudo cp dns-watcher.js /var/www/\nsudo cp dns-watcher.cgi\
    \ /var/www/\n/var/www/cgi-bin/\nsudo cp get_watcher_data.cgi /var/www/cgi-bin/\n\
    ```\n\nThese locations may not match those of your Apache installation. You may\
    \ also need to adjust the.\n\n### Running the Web-Based Network Analyzer\n\n```ruby\n\
    #! /usr/bin/ruby\nputs \"Content-Type: text/plain\"\nputs `cat /var/www/dns-watcher.log`\n\
    ```\n\nOne final thing is that the `dns-watcher.rb` program needs to be executed\
    \ with root privilege, in order to read the Web server into secure mode. As would\
    \ be expected, Apache does not by default, CGI scripts run as root, and for good\
    \ reason. To get my Web-based analyzer to work, I need to add a line to my /etc/sudoers\
    \ file:\n\n```\nwww-data ALL=(ALL) NOPASSWD: /data\n```\n\nThis allows the www-data\
    \ user, which executes Apache, to execute Ruby with root privilege, as is the\
    \ Interpreter that executes\n\n## Advertiser Index\n\nFor advertising information,\
    \ please contact our department at 1-713-344-1956 ext. 2 or ads@linuxjournal.com.\n\
    www.linuxjournal.com/advertising\n\n## Web-based DNS Watcher (Network Analyzer)\n\
    \nHere are the results of your DNS analysis:\n\n| Domain | Type | Size | Class\
    \ | TTL | Data |\n|---|---|---|---|---|---|\n| example.com | A | 4 | IN | 3600\
    \ | 93.184.216.34 |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34 |\n| example.com\
    \ | A | 4 | IN | 3600 | 93.184.216.34 |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34\
    \ |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34 |\n| example.com | A |\
    \ 4 | IN | 3600 | 93.184.216.34 |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34\
    \ |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34 |\n| example.com | A |\
    \ 4 | IN | 3600 | 93.184.216.34 |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34\
    \ |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34 |\n| example.com | A |\
    \ 4 | IN | 3600 | 93.184.216.34 |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34\
    \ |\n| example.com | A | 4 | IN | 3600 | 93.184.216.34 |\n| example.com | A |\
    \ 4 | IN | 3600 | 93.184.216.34 |\n"
  mdcn: "\n\n## 深度解析\n\n### 列表 2.启动分析器的简单 HTML Web 页面\n\n```html\n<html\n<head>\n\
