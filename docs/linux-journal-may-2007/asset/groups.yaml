    # Parallel nFS (pNFS) Bridges to a Mature Standard


    Thanks to the emergence of low-cost Linux clusters, high-performance computing
    (HPC) is no longer the domain of an elite of public-sector-funded researchers.
    In fact, HPC can now be found addressing challenges as easily as simulating the
    benefit to earth the imagination of an individual product design.


    The second challenge, as clusters become more powerful, new challenges have emerged.
    The first challenge was to manage the vast amount of data created and consumed
    by these powerful clusters, but that is also capable of keeping engines fully
    fueled and with data. Without data, the fastest and supercomputers become nothing
    more than expensive space heaters.


    The second challenge revolves around the data created by clusters scaling out.
    Copying or moving data between clusters is rarely an option unless network overhead
    and complexity allow. Ideally, node stays on the network where it resides on the
    cluster. Initially, clusters used NFS standard, which had the advantage of being
    widely understood, supported by many vendors and providing easy access to data
    for systems outside the cluster. However, NFS moves all data and metadata through
    a single network endpoint (server) that creates a bottleneck when trying to cater
    to the IO of many clients. The result is limited bandwidth scale—a solution is
    required.


    Because pNFS is an evolution of the NFS standard, it will allow organizations
    that are familiar with NFS to achieve parallel performance with a minimum of changes.
    Plus, it will become part of the NFS standard, and it can be used with cluster
    filesystem on any device.


    # Architecture of pNFS


    NFS4 improved the security model from NFS3, which is the most widely deployed
    today, and it folds in file layout that was previously implemented under a different
    protocol. NFS4 has an extensible architecture to allow easier extension of the
    standard. For example, the proposed NFS4.1 evolves NFS to include a high-speed
    parallel filesystem. The architecture of pNFS is shown in Figure 1.


    ![](img/6be405694cb4aa0c113e76f02a6a5081_17_0.png)


    Figure 1: NFS Architecture


    The pNFS clients manage the metadata. When they access a file, the request to
    the NFS4.1 server describes where the file is located on the storage devices.
    The client then accesses the data according to the layout. This is an advantage
    over standard NFS where the client accesses data directly from the storage device(s),
    removing the metadata from the data access process. When the client is done, it
    sends the metadata back to the server if there are any events that made the client
    move.


    This approach may seem familiar, because both Panasas (ActiveScaleFS) and Lustre
    use the same basic metadata architecture to access their respective filesystems.
    It is an advantage of NFS with its respective architecture.


    # Parallel Filesystems and pNFS


    Parallel filesystems, which allow parallel access from several nodes to storage
    devices, have been leading solution to scale. Although parallel filesystems are
    relatively new, the technology will be an essential element of every medium to
    manage large-scale cluster in the near future. Several parallel filesystems are
    available from various vendors such as Panasas (ActiveScaleFS), IBM (GFS), EMC
    (HighScale) and Lustre (Cluster Filesystem).


    When we have global parallel filesystem solutions, however, these solutions lock
    customers to a particular vendor for the software and the hardware. It wouldn''t
    be nice to have a filesystem that has the same performance as vendor-specific
    solutions but with the flexibility and freedom of choice that comes from coming
    using a universally accepted filesystem.


    This introductory article discusses Parallel NFS (pNFS), which is designed to
    meet many needs. pNFS is a parallel capability into the NFS standard. It is it
    with universal support from the NFS community.


    # Parallel NFS Origin


    When people hear about NFS, their first reaction is to call it an attempt to shoe
    a parallel capability into the NFS standard. In reality, it is the next evolution
    of NFS with the standards that empower organizations who need more flexibility
    than a single-vendor NFS solution can provide.


    NFS4.1 standard contains changes that support specification for pNFS and is demonstrated
    and demonstrated now. The original draft of the proposal was written by many vendors,
    including,, IBM, Network Appliance and Sun, who joined to help define and extend
    pNFS. Other vendors also participated, so pNFS is gaining momentum among vendors.


    Parallel filesystems can be supported by pNFS: block storage (as supported by
    SANs, EMC and IBM), object storage devices (as Panasas and Lustre) which are supported
    with NFS files, such as NetApp. The layout is how the client is linked to used
    to access the storage devices. The client needs to communicate with the metadata
    server and storage devices or provide a combination of devices at any time.


    These storage devices can be produced by an EMC SAN, a Panasas ActiveScale Cluster,
    Lustre, NetApp files or any other storage that uses block storage, object storage
    or file storage. The advantage is that it is supported by many open-source (layout
    drivers) for block storage, object storage and file storage back ends. All of
    these back ends will work well. For example,


    How the data is accessed from the storage devices and how it is communicated using
    RDMA (Remote Memory Access) protocols for better performance. For example, the
    InfiniBand SDP protocol will be used to transmit the data. The data can be transmitted
    using SCSI


