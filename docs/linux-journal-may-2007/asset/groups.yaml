  - "[PAGE 61]\n\n# FEATURE Web Services and Ajax\n\n| Listing 3 JavaScript code handles\
    \ the database actions and processing. |\n\n```\nvar req;\n\nfunction insert_record\
    \ () {\n  send_transaction(\"/cgi-bin/insert.pl\");\n  return 1;\n}\n\nfunction\
    \ select_record(i) {\n  send_transaction(\"/cgi-bin/select.pl?id=\" + i);\n  return\
    \ 1;\n}\n\nfunction delete_record(i) {\n  send_transaction(\"/cgi-bin/delete.pl?id=\"\
    \ + i);\n}\n\nvar id = document.getElementById(\"id\");\nselect_record(id);\n\
    return 1;\n\nfunction update_record(i, field, value) {\n  send_transaction(\"\
    /cgi-bin/update.pl?id=\" + i + \"&field=\" + field + \"value=\" + value);\n  return\
    \ 1;\n}\n\nfunction send_transaction() {\n  if (window.XMLHttpRequest) {\n   \
    \ req = new XMLHttpRequest();\n  } else if (window.ActiveObject) {\n    req =\
    \ new ActiveObject(\"Microsoft.XMLHTTP\");\n  }\n\n  req.onreadystatechange =\
    \ process_results;\n  req.open(\"GET\", \"\", 1, true);\n  req.send(null);\n}\n\
    \nfunction process_results() {\n  var name = \"\";\n  var value = \"\";\n  var\
    \ fields;\n  var i;\n  var length;\n\n  if (req.readyState < 4) { return 1; }\
    \ // transaction\n  // not done.\n\n  var xml = req.responseXML;\n  var result\
    \ = xml.getElementsByTagName(\"result\")[0];\n\n  fields = result.getElementsByTagName(\"\
    field\");\n  length = fields.length;\n\n  for (i=0; i<length; i++) {\n    var\
    \ field = fields[i];\n    name = field.getAttribute(\"name\");\n    value = field.getAttribute(\"\
    value\");\n  }\n\n  var form_field = document.getElementById(name);\n  form_field.value\
    \ = value;\n\n  return 1;\n}\n```\n\nalmost every other browsers use XMLHttpRequest.\
    \ The object is created, by whatever name, we have to call out Web Services and\
