    \ were ported from Scriptulous for MochiKit 1.4.\n\nAs shown in the next code,\
    \ our load function using fatallog from MochiKit.logging framework, then sets\
    \ up to our subClicked handler when we submit the button is pressed:\n\n```javascript\n\
    function subClicked(event) {\n  // checks the username/*/\n\n  var d = MochiKit.Async.simpleXMLHttpRequest;\n\
    \  d.open(location, {\n    username = get('username').value;\n    pass = get('password').value;\n\
    \  });\n\n  d.addcallback(handleServerResult);\n  d.addback(handleServerError);\n\
    \n  document.getElementById('getMsg').innerHTML = \"Please wait...\";\n\n  clearError();\n\
    \  // clear the old error message, it doesn't apply\n\n  // end subClicked\n}\n\
    ```\n\nMochiKit.Async.simpleXMLHttpRequest is the simplest way to do an Ajax request.\
    \ It uses the URI to which send the request, the GET parameters for that URI,\
    \ and it turns the request, MochiKit.Async.Deferred, functionality for POST GETs,\
    \ JSON objects and more. All Ajax functions return a Deferred object, so by the\
    \ construction of using the Deferred object, the Ajax event is already sent. Because\
    \ the call is asynchronous, it may take several seconds until an answer is received.\
    \ MochiKit.Async.Deferred is merely a guarantee that some happens after up. This\
    \ allows us to set up callbacks and whatever handling is required. When a response\
    \ comes from the server, good, the Deferred object triggers the success and failure\
    \ callbacks by passing them to the first parameter. Success functions are called\
    \ if the HTTP status code is 200, 201, or 304. The error is called if there is\
    \ any other number. Success functions get the XMLHttpRequest object as text. If\
    \ you never get an XMLHttpRequest object, Failure functions get the object message.\n\
    \nWith this background, we can handle our work in a simple way. To accomplish\
