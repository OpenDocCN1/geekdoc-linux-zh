    * Use Python to Manipulate ODF, p. 8

    * Single Packet Authorization in Practice, p. 82


    2 | may 2007 www.linuxjournal.com


    # The competition doesn’t stand a chance.


    ![](img/6be405694cb4aa0c113e76f02a6a5081_4_0.png)


    If you base deployment decisions on performance and price, Coyote Point’s is for
    you. We’ve cornered that market.


    To prove it we asked The Tolly Group to evaluate the E350si application traffic
    manager against the competition. The results speak for themselves.


    Throughout? Almost 40% more than others in our space. Cost of transactions per
    second? Up to four times less. Connection rate? In some cases, one-sixth the cost.
    One-sixth! And we’re told Coyote Point is #1 for today.


    But don''t just take our word for it. Get the facts. Call 877.3696 or write to
    coyoteepoint.com for your free copy.


