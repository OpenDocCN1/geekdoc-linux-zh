    ```\n\nCo-opting MochiKit's functionality means that all errors can be reported\
    \ using MochiKit.logging. During debugging of this, thing else could be set up\
    \ to handle the errors--perhaps logging more information or breaking into a sooner\
    \ redraw. We were here when we needed to redraw, for example, it's not that part\
    \ of the page contains new information to the user. We used feedback. The Ajax\
    \ community has shown highlighting elements in yellow (traditionally) and fading\
    \ back to white in the background. This technique (the value technique) is used,\
    \ in particular, by 37 Signals (the method built on Ruby). The technique is used\
    \ to let users to report the error, or to trigger the page again. This makes this\
    \ technique very MochiKit easy to use.\n\nAs we discussed, we need to redraw before\
