    ## Ajax Simplified


    NICHOLAS PETRELEY


    Ajax can become as complex as implementation, but the concept is quite simple.


    THIS IS a simple tutorial on Ajax that will ease the fears of those who think
    Ajax can be intimidating. Despite the meaning of the term (Asynchronous JavaScript
    and XML), Ajax reveals around a very simple principle. It lets you manipulate
    the contents of a Web page without having to reload the page. Here are the key
    steps involved that exploit the power of Ajax:


    - Capture an event (such as when a user changes an edit field or presses a button).

    - The event triggers JavaScript code, which sends a query to the Web server.

    - The JavaScript code retrieves results from the server.

    - The JavaScript code uses the results to update the contents of the Web page.


    JavaScript accesses the Document Object Model (DOM) to change the contents of
    a Web page without reloading the page. For example, suppose your page changes
    the following element:


    ```html

    <input type="text" id="total" />

    ```


    The ID of the HTML tag creates an element called in the DOM, the contents of which
    you can change via JavaScript with the following JavaScript code:


    ```javascript

    document.getElementById("total").value = value;

    ```


    Web designers have used this capability for a long time. The real power of Ajax
    comes from the ability to calculate the value of the total at the server side
    rather than the client. To keep it simple, there is an example that doesn''t involve
    any server other than returning a result. This example presents a simple form
    that lets you type a type of code. When you change the value of the zip code,
    the JavaScript code sends it to the server side and returns the shipping cost
    to that. The JavaScript code then modifies the totalshipping to reflect the server
    response.


    The example shown in List1 contains only the most basic elements of an Ajax page—the
    primary functions getHTTP, handleResponse and updateShipping. The onChange event
    is what triggers the JavaScript function updateShipping. When you use onBlur,
    this lets you leave the zip code and it loses focus.


    The XMLHttpRequest object is what allows you to make a request via JavaScript,
    and the updateShipping function performs the request request. The handleResponse
    function receives the input from the page request and extracts the information
    in order to modify an element in this case (the totalshipfield). These are the
    three basic functions you need to perform an Ajax operation.


    This first example uses XML. The following line of code results in an xml text:


    ```javascript

    results = response;

    ```


    If you try this, you''ll find that when you type a zip code (or virtually anything,
    the code does no error checking) and then leave the field, the JavaScript automatically
    retrieves the value from $5.00 from the PHP application and places the value in
    the Total Field.


    Keep mind that Ajax executes as many shortcuts as possible to keep it simple.
    There is no error checking or whatever. There are ever no HTML tag names, only
    ids. It would be more common to create an HTML tag that uses <input type="text"
    id="totalshipping">. You would probably get the shipping cost as XML (you could
    also format the result as code when the user clicked "correct" to update their
    changes). In addition, the example doesn''t actually calculating the shipping
    cost. The URL in the base code points to a PHP script that returns the value of
    the zip code and uses it to calculate the shipping cost and return that.


    ## Enter XML


    Technically, you can create a full Ajax application without using XML, but you
    will find XML to be a necessity as your Ajax grows in complexity. Here is how
    to do the same simple Web page with XML, once again cutting every for the sake
    of simplicity.


    ### Listing 1. index.html


    ```html

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0//EN"

    //http://www.w3.org/TR/DTD/html-strict.dtd">

    <html xmlns="http://www.w3.org/1999/html">

    <head>

    <title>Example</title>

    <script language="javascript" type="javascript">

    var url = "getShipping.php?zipcode=";


    function handleHttpResponse() {

    if (http.readyState == 4) {

    results = http.responseText;

    document.getElementById(''totalshipping'').value = results;

    }

    }


    function updateShipping() {

    var zipValue = document.getElementById(''zip'').value;


    http.open("GET", url + escape(zipValue), true);

    http.onreadystatechange = handleHttpResponse;

    http.send(null);

    }


    function getHTTPPostObject() {

    var xmlhttp;

    xmlhttp = new XMLHttpRequest();

    return xmlhttp;

    }

    </script>

    ```


    Notice in Listing 3 that we get the response with the code http.responseText extract
    the value we get with the code document.getElementsByTagName(''shipping''). Note
    that the XML refers to the tag instead of totalshipping. This difference is unnecessary,
    but in this tutorial is to avoid the possible implication that the XML name and
    the HTML


    ### Listing 3. index.xml


    ```html

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0//EN"

    //http://www.w3.org/TR/DTD/html-strict.dtd">

    <html xmlns="http://www.w3.org/1999/html">

    <head>

    <title>Example</title>

    <script language="javascript" type="javascript">

    var url = "getShipping.php?zipcode=";


    function handleHttpResponse() {

    if (http.readyState == 4) {

    var xmlDocument = http.responseText;

    shipping = xmlDocument.getElementsByTagName(''shipping'')

    item(0).firstChildData;

    document.getElementById(''totalshipping'').value = shipping;

    }

    }


    function updateShipping() {

    var zipValue = document.getElementById(''zip'').value;


    http.open("GET", url + escape(zipValue), true);

    http.onreadystatechange = handleHttpResponse;

    http.send(null);

    }


    function getHTTPPostObject() {

    var xmlhttp;

    xmlhttp = new XMLHttpRequest();

    return xmlhttp;

    }

    </script>

    </</html>

    ```


    ### Listing 2. getShipping.php


    ```php

    <?php

    echo "$5.00";

    ?>

    ```

    ```html

    <body>

    <form action="post">

    <p>

    ZIP code: <input type="text" size="5" name="zip" id="zip"

    onchange="updateShipping(); />

    <p>

    Total Shipping: <input type="text" id="totalshipping" />

    </form>

    </body>

    </html>

    ```


    The field id must match in order to make the application work. They have to match.
    The only thing left is to modify our PHP code to return XML instead of text. See
    Listing 4 for the PHP code. In addition to the XML content, note the line of code
    that sends the content as XML. The places the shipping as a child of <order>,
    along with the unused data. This is a simple step toward a more realistic set
    of data that the page should return. Believe it or not, that is up to everything
    viewed through Firebug.


    ### Listing 4. Shipping.php


    ```php

    <?php

    $shipping = ''$5.00'';

    $total = ''$10.00'';

    $return_value = ''<xml version="1.0" standalone="yes"?>

    <order>

    <shipping>'' . $shipping . ''</shipping>

    <total>'' . $total . ''</total>

    </order>'';

    header(''Content-Type: text/xml'');

    echo $return_value;

    ```


    ### Validation and Error Handling


    A real application would not assume the PHP file exists. It also check the value
    of the zip code before attempting to send it parameter to the server in order
    to find the shipping cost. You could serve the server with the zip code or do
    minimization at the client side and then perform full validation of the zip code
    at the server side.


    ### Performing the Server-Side Calculations and Operations


    As for what you do to handle the services at the server side, it''s up to your
    choice to use Web application language and choice of other things. What you know
    best, or which the time to learn other Ajax languages you use the above example
    shows all error handling in order to focus on the basics of how Ajax works. You
    need to include input validation, error detection and error handling in a real
    application.


    ### Optimizing Your Performance


    JavaScript optimization is an art, but it helps to compress your JavaScript code
    for readability, the smaller the file size since more users will download. You
    can squash your JavaScript to few bytes with one of many JavaScript compressors.
    The Dojo library is compressed for and provides a compressor you can use on your
    own. You can even compress your online with Dojo Shrinkify. What you want at the
    client side depends on what you want to store in cookies, or you might speed up
    performance by storing the information at the server side. Use common sense and
    evaluate different approaches to which works best.


    ### Accounting for the Details between Browsers


    The above shows how jQuery works, but there is no guarantee it will work in Ajax.
    If you want to write all your Ajax code from scratch, taking into account variations
    between Firebug, and Ajax, or use of libraries-in front. Fortunately, a plethora
    of Ajax libraries exists that manages the details for you. One of my favorites
    is Dojo. It''s not easy to build a killer Ajax application, but hopefully the
    simplicity of how Ajax works will encourage you to give it a try. Take a look
    and quit to.


    ### Managing the Elements of the Document via the DOM


    Ajax relies on the DOM to address the elements within a page. As your page becomes
    more complex, the harder it gets to handle all the elements, their names and ids.
    If it''s not helpful, it''s not enough, you install the Ajax add-on to Firebug.
    Firebug provides not only a way to examine the DOM, but also helps you debug JavaScript
    code and managing your cascading stylesheets for a link to the DOM. Figure-1 shows
    the XML example page as


