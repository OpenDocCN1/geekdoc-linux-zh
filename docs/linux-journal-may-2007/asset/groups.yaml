  mdcn: "\n\n# AJAX POSTGRESQL ZIMBRA MOCHIKIT | FIREBUG APTANA\n\n# LINUX JOURNAL\n\
    \n深度解析 PostgreSQL\nAJAX 以太网分析仪\n\n自 1994 年以来：Linux 社区创刊杂志\n\n2007年5月 | 第 157 期\n\
    \n![](img/6be405694cb4aa0c113e76f02a6a5081_0_0.png)\n\nwww.linuxjournal.com\n\
    美国 $5.00 | 加拿大 $6.50\n\n# 特别：\n\n- 使用 Python 处理 ODF\n- 单包认证实践\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_1_0.png)\n\
    \n# 尽在掌控的企业级与高性能\n计算\n\nAppro 通过结合满足企业 HPC 市场需求的最新技术，领先 4P x86 计算领域。\n\n# 4路 XtremeWorkstation™\n\
    \n- AMD Opteron™ 8000 系列处理器\n- 最多 128GB DDR2 533/667 内存\n- 最大 6.0TB SATA 或 2.4TB\
    \ SAS\n- 热插拔驱动器\n- 2 个用于高端显卡的 PCI-E x16 插插槽\n- Windows® 或 Linux 系统\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_1_1.png)\n\
    \n# 4路 3U XtremeServer™\n\n- AMD Opteron™ 8000 系列处理器\n- 最多 128GB DDR2 533/667\
    \ 内存\n- 最多 4.5TB SATA 或 1.8TB SAS\n- 2 个 PCI-E x16 和 3 个 PCI-X 插槽\n- 热插拔驱动器\n\
    - 冗余电源与风扇\n- ServerDome 管理 – IPMI 2.0\n- Windows® 或 Linux 系统\n\n欲了解更多信息，请访问 www.appro.com\
    \ 或拨打 Appro 销售电话 800-927-5464\n\nAMD Opteron™ 处理器：\n\n- 多核就绪 - 在不改变数据中心基础设施的情况下增加容量\n\
    - 使用能效 DDR2 实现最佳每瓦性能\n- 通过直连架构（Direct Connect Architecture）优化系统性能\nAMD 64 Opteron\n\
    \n# 今天，Carlo 在迈阿密修复了一台故障路由器，在东京重启了一台 Linux 服务器，并回记了某人的一个非常特殊的日子。\n\n凭借 Avocent\
    \ 集中化管理解决方案，世界终于可以围绕你转动。Avocent 将安全访问和控制直接带在您的指尖下——从多平台服务器到网络路由器，从您的本地数据中心到分支机构。我们的“无代理”带外解决方案可从单个控制台管理您的物理和虚拟连接（KVM、串口、集成电源、嵌入式服务处理器、IPMI\
    \ 和 SoL）。即使在带内方法失败，您也能保证对关键硬件的访问。让别人去推着故障排除车来排除故障吧——有了 Avocent，故障将成为过去式，您可以专注于当下。\n\
    \n访问 www.avocent.com/special 下载《数据中心控制：实现集中化管理指南》白皮书。\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_2_0.png)\n\
    \n# 目录\n2007年5月\n第 157 期\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_3_0.png)\n\
    \n# 专题\n\n- 55 简化 Ajax\nAjax 并不一定令人生而畏。\nNicholas Petoley\n\n- 58 使用 Web 服务和 Ajax\
    \ 编写 Web \n想要一个稍微高级一点的 Ajax 入门教程吗？\nMike Diehl\n\n- 64 MochiKit 实例\n在不失去控制的情况下快速上手。\n\
    Ryan Wilcox\n\n- 70 适用于 WordPress 的四个酷炫插件\n用这四个插件美化您的基于 WordPress 的网站。\nMarco\
    \ Fioretti\n\n- 封面内容\n* 深度解析 PostgreSQL，第 48 页\n* Ajax 以太网分析仪，第 74 页\n* 现包含 Mochi\
    \ Power，第 64 页\n* 100% 的 Zimbra 偏好 Ajax，第 42 页\n* Firebug 快速移除漏洞，第 2 页\n* 使用 Perl\
    \ 和 PostgreSQL也能进行清理，第 58 页\n* 我们的额外成分 Aptana 快速清理杂质，第 46 页\n* 与 WordPress 结合获得更鲜艳的色彩，第\
    \ 70 页\n* 使用 Python 处理 ODF，第 8 页\n* 单包认证实践，第 82 页\n\n2 | 2007年5月 www.linuxjournal.com\n\
    \n# 竞争对手毫无机会。\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_4_0.png)\n\n如果您根据性能和价格做出部署决策，那么\
    \ Coyote Point 的产品适合您。我们已经占领了这个市场。\n\n为了证明这一点，我们请 Tolly Group 对 E350si 应用流量管理器与竞争对手进行了评估。结果不言自喻。\n\
    \n吞吐量？比我们领域内的其他产品高近 40%。每秒交易成本？低了四倍。连接率？在某些情况下，仅为六分之一的成本。六分之一！而且告诉我们 Coyote Point\
    \ 是第一。\n\n但不要只听我们说。获取事实。拨打 877.3696 或访问 coyoteoint.com 获取免费副本。\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_4_1.png)\n\
    \n![](img/6be405694cb4aa0c113e76f02a6a5081_4_2.png)\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_4_3.png)\n\
    \n# 目录\n2007年5月\n第 157 期\n\n# 专目\n\n- 22 REUVEN 的锻造\n- 26 MARCEL\n- 32 DAVE 的深度解析\n\
    ![](img/6be405694cb4aa0c113e76f02a6a5081_5_0)\n\n- 34 JOHN 的深度解析\n- 40 全新\n- 42\
    \ ZIMBRA 的\n- 46 关于\n- 48 POSTGRES\n- 74 分析仪\n- 82 单包\n- 86 关于\n\n4 | 2007年5月\
    \ www.linuxjournal.com\n\n# Gemini 2U\n- 超密度\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_6_0.png)\n\
    \n# 一机二用\n\n- 2U 内两个完全独立的系统\n- 可运行两个独立的操作系统\n- 最多 16 个 CPU 核心\n- 最多 12 个热插拔 SATA、SCSI\
    \ 或 SAS 驱动器\n- 两个系统均支持 RAID 0、1、5、6、10\n- 支持 Opteron™ 或 Xeon™ 多核处理器\n- 每个主板最多\
    \ 64GB 内存\n- 每个主板一个可用 PCI-X 或 PCI-E 插槽\n- 高效 AC 和 DC 电源\n\n基于开放标准构建的 Gemini 2U\
    \ 优雅地容纳了两个独立的主板，独特的 25 英寸设计便于正面访问。\n\nGemini 2U 代表了惊人的性能和卓越的环境指标，功耗更低、发热更少、噪音更小。令人惊讶的是，它可以完美融入任何标准机架。\n\
    \nOpen Source Systems 明白您需要实用、定制且易于管理和维护的解决方案。\n\n欲了解更多信息并从现在申请您的评估机，请访问 www.OpenSourceSystems.com，或直接拨打\
    \ 866-664-7867。\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_6_1.png)\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_6_2.png)\n\
    \n"
