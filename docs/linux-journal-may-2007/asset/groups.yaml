    # 快速回顾


    ## Zimbra Collaboration Suite, 版本 4.5


    Zimbra 利用 Ajax 提供了迷人的 Web 体验。MARCEL GAGNÉ


    电子邮件是现代企业通信的骨干，坦率地说，长期以来一直如此。在任何网络化的电子邮件中，任何将此类功能如此突出的工具，电子邮件都展示了其局限性的历史。为了改进体验，软件开发者引入了显而易见的功能，如日历、简单的邮件列表和线程，创建了人们所说的联系管理系统。企业简化了群组（或协作工具）的创建，允许这些联系列表在组织成员之间共享。对成千上万的人管理复杂的策略会产生自身的一系列问题。随着越来越多的用户注意到，他们现在正处于信息的汪洋中，总是试图获取那些帮助他们保持不败的信息。


    Zimbra 的存在意义通过提供一个简化并增强体验的套件来改进电子邮件体验，这种体验在快速且直观的检索方面是独一无二的。


    Zimbra Collaboration Suite F1 是一款强大的、可扩展的应用程序，适用于中小型及非常大型企业。它可以部署在高可用集群环境中，在其中可以服务大量客户，并且易于维护。Zimbra
    为 100,000 用户提供服务，而多伦多大学有数万用户。Zimbra 的客户多样（从提供 Zimbra 服务的机构到企业、大学、政府办公室和非营利组织），并提供内容。


    我与 Zimbra Collaboration Suite 用了几周，


    ### 注意：


    在与 Zimbra 交流时，我询问了客户注册 Zimbra 电子邮件账户的服务模式，即账户由广告支持或通过 Zimbra 扩展提供增值服务。Zimbra 告诉我，80%
    的 Zimbra 安装是本地部署的。该公司认为电子邮件并不会转向带有 CRM 的托管模式。


    总的来说，我非常印象深刻。尽管如此，没有什么是完美的——更多细节我将继续介绍。


    ## Zimbra 是做什么的？


    Zimbra Collaboration Suite 属于我们称称为“群组”的网络应用程序——一种 CRM 的智能集合，其中电子邮件是核心，通常通过 Web
    界面提供。除了电子邮件之外，Zimbra 消息服务器还提供群组日历和联系管理工具。Zimbra 是既强大又实用的应用程序，包含了 LDAP、Apache 等。Zimbra
    包含了一些扩展，例如 zimlets（稍后讨论），企业杂烩功能（mashups）允许用户自然地与电子邮件中嵌入的信息进行交互，以便他们可以轻松地将其用于各种应用程序，包括第三方应用程序（如采购系统）。


    可以在不与 Microsoft Exchange 比较的情况下谈论 Zimbra，我在这里回答显而易见的问题。Zimbra 是 Microsoft Exchange
    令人印象深刻的替代品。Zimbra 提供的比 Outlook 提供的更多（也可用 Lotus Notes 集成）。可用客户端是免费且支持的，它可以与所有 Outlook
    电子邮件、联系人和日历功能兼容（API 同步仅在 Zimbra 网络版中可用）。如果您恰好使用任何其他邮件客户端（如 Thunderbird 或 Outlook），您可以继续从
    Zimbra 优秀的基于浏览器的 Ajax 客户端开始，这对于您的旧版客户端软件来说可能不错。Zimbra 还支持许多移动设备，如此 iPhone、 Blackberry。


    如上段所示，Zimbra 在不同版本中都有价值，包括社区支持的开源版和商业支持的网络版。


    ## 使用 Zimbra


    Zimbra 是一个感觉不像 Web 应用程序的 Web 应用程序。


    ![](img/6be405694cb4aa0c113e76f02a6a5081_43_0.png)


    图 1. Zimbra Collaboration Suite, Ajax 客户端视图


    42 | 2007年5月 | www.linuxjournal.com


    ![](img/6be405694cb4aa0c113e76f02a6a5081_44_0.png)


    时间，然后回到您的电子邮件。Zimbra 可以识别您电子邮件中的内容，例如电话号码或日期。图 3 显示查看一封电子邮件，发送者在请求一个空闲日期。Zimbra
    识别出这是一个日期，而不是我那个时间的可用性。


    图 2. Zimbra 整合了一个易用且强大的共享日历应用程序，该程序与套件的其他部分集成。


    几项关键功能将 Ajax 设计推向了非常先进的。例如，Zimbra 提供了许多键盘快捷键。


    让我举个例子。在大多数 Web 应用程序中，您将通过点击消息旁边的复选框来选择每条消息（或批量消息），找到删除按钮并点击拖动移动。Zimbra 的工作方式符合您对桌面应用程序运行的预期。使用键盘选择消息组（Shift、Ctrl-点击或
    Ctrl-点击），然后按 Delete 键。


    在其他 Web 应用程序中，您必须通过下拉列表中选择消息来移动它们，点击“收件人”按钮，点击目标，然后点击“移动”。Zimbra 用户选择消息并将其拖入相应的文件夹中——就像您在电子邮件客户端中这样做一样。这种映射非常自然，过了一段时间后您会觉得自己在使用一个熟悉的应用程序。


    图 3. 无需从电子邮件切换到日历。Zimbra 提供了您所需的信息。


    如果时间是空闲，也不需要切换到日历视图——只需右键点击选择事件，然后输入详细信息。这简单又直观。


    更棒的是它可以识别文本中的其他上下文信息（用蓝色突出，如“明天”或“下周”）。Zimbra 然后会检查您的日历，看您何时有该提议（单词）。Zimbra 还会识别地址和电话号码并将其高亮。如果是电话号码，Zimbra
    会触发像 Skype 这样的程序。无需离开电子邮件并切换到拨打该号码。


    内置的杀毒病毒工具、智能文件夹、RSS 订阅以及当然还有 zimlets 增强了用户体验。


    ## Zimlets


    当您悬停在电子邮件中的某项上时，弹出提示显示您正在查看一个 zimlet 的工作。当您悬停在电话号码上时，Zimbra 会显示。默认 Zimbra 安装包含了一些重要的
    zimlets，但也有一些您可能无法发现，范围从极其有用到惊艳不等。当您安装（或部署）这些 zimlets 时，它们会出现在您的侧边栏和工具栏中。


    有些 zimlets 值得探索。除了拨号器（使用 Skype）之外还有另一个利用了 Asterisk VoIP 系统。部署 Yahoo Maps，Zimbra
    可以识别地址，zimlet 也能识别地址。

    '
