    # TECH TIPS


    Mutt make e-mail sorting and navigation a breeze, and a handy script to help you
    find other scripts.


    # >> An Easy Way for Users to Move Mail into Designated Folders


    You''d think with the wonderful GUI IMAP e-mail clients available, the character-based
    Mutt wouldn''t have much anyway. Yet, a number of us at Linux Journal are still
    stuck on Mutt for all sorts. One reason is that you can configure Mutt to behave
    about any way you like.


    Additionally, you could write-scripts to sort your mail into the appropriate folders,
    and have filters to do that. However, the filters aren''t perfect, and many messages
    end up in the wrong subject. So, I have created a long list of macros for Mutt
    to move mail away with a single Ctrl-keypress, which beats the click of a duplicate
    that dragging and dropping mail to a sidebar with a folder (or vice versa).


    ```

    macro index <"r=Readdir"

    macro index <"p=<s/Folders/Press-Releases"

    macro index <"n=<Folders/News-Alerts"

    macro index <"h=<Folders/Humor/"

    macro index <"k=<sSPAM"

    ```


    I''ve gotten to using the comma key as my "go-to", so I go to the Press-Releases
    subfolder by typing the keys, and then N. The combination takes me to News-Alerts,
    and so on. If its not intuitive for you, pick another keystroke and modify the
    macros accordingly.


    I''ll also want to get back to the inbox easily. So, if you want to create a substitute
    of the macros if you are using your IMAP server for youmailvers, and it should
    work for:


    ```

    macro index <"imap://yourmailvers/INBOX"

    macro page <"imap://yourmailvers/INBOX"

    ```


    One may find out why the navigation of your macros works with ~ and then <. The
    executes moves to the new folder, and if you have changed the subject of messages
    by date, then your Mail will use the date when you change your mail with the command
    Mutt.


    The following list of macros I use Press-C to move the currently highlighted message
    to my folder (that is, Press-Releases folder which is a subfolder of),), Ctrl-N
    to News-Alerts, and so on. As you can see, I''ve threaded the letter to make the
    action easy to work with (Ctrl-K kills the mail to the SPAM bin)


    You may need to consult your copy of Mutt in the Mutt Manual online at www.linuxjournal.com/doc.
    It takes a bit of working to get Mutt just the way you like, but once you''ve
    customized it to your tastes, you may find it very difficult to go back to using
    a GUI client.


    ```

    macro page <"r=Readdir"

    macro page <"s=/Folders/Press-Releases\"

    macro page <"s=/Folders/News-Alerts\"

    macro page <"s=/Folders/Humor/"

    macro page <"s=SPAM\"

    ```


    I also spend plenty of time using macros with the prev pane open. The above list
    of macros won''t work in prev mode. If you want to do the same operations while
    moving the mail, add a duplicate like this:


    > —Nicholas Peter


    # >> Finding a Needle in a Haystack of Scripts


    This script is embedded from Linux Journal Webmaster Daniels, whose work was modified
    by a reader Karl, who also use this submission. It is a free script based on a
    keyboard that you might find that occurs in the script.


    Objectives:


    +   1. Don''t force the four-line restriction on the length of each script''s
    header.

    2. Allow multiple paths (not only /bin).

    3. Support display of the script''s path/name without hard-coding

    it into the header.


    ```

    #!/bin/bash

    ```


