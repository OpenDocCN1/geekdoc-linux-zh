    \ 文件，并将它们放置在服务器上的 Wordpress 文件夹中。否则，请遵循其他语言的作者本地化。\n\n移动到下一个，直到你获得想要的一切，并确保你已对所有\
    \ WordPress 文件进行了备份。\n\n另一个可以节省你大量挫败感的技巧（不仅适用于这些插件，也适用于任何基于 JavaScript 的 Web 应用）是在安装的各个阶段保持两个窗口打开：第一个窗口应该显示你是否有访问权限，最后一个窗口是你的\
