    # # Ajax Simplified


    NICHOLAS PETRELEY


    # Ajax can become as complex as implementation, but the concept is quite simple.


    THIS IS A simple tutorial on Ajax that will ease the fears of those who think
    Ajax can be intimidating. Despite the meaning of the term (Asynchronous JavaScript
    and XML), Ajax reveals around a very simple principle. It lets you manipulate
    the contents of a Web page without having to reload the page. Here are the key
    steps involved that exploit the power of Ajax:


    +   - Capture an event (such as when a user changes an edit field or presses a
    button).


    +   - The event triggers JavaScript code, which sends a query to the Web server.


    +   - The JavaScript code retrieves results from the server.


    +   - The JavaScript code uses the results to update the contents of the Web page.


    JavaScript accesses the Document Object Model (DOM) to change the contents of
    a Web page without reloading the page. For example, suppose your page changes
    the following element:


    ```

    ```html <input type="text" id="total" /> ```

    ```


    The ID of the HTML tag creates an element called in the DOM, the contents of which
    you can change via JavaScript with the following JavaScript code:


    ```

    ```javascript document.getElementById("total").value = value; ```

    ```


    Web designers have used this capability for a long time. The real power of Ajax
    comes from the ability to calculate the value of the total at the server side
    rather than the client. To keep it simple, there is an example that doesn''t involve
    any server other than returning a result. This example presents a simple form
    that lets you type a type of code. When you change the value of the zip code,
    the JavaScript code sends it to the server side and returns the shipping cost
    to that. The JavaScript code then modifies the totalshipping to reflect the server
    response.


    The example shown in List1 contains only the most basic elements of an Ajax page—the
    primary functions


    getHTTP, handleResponse and updateShipping. The onChange event is what triggers
    the JavaScript function updateShipping. When you use onBlur, this lets you leave
    the zip code and it loses focus.


    The XMLHttpRequest object is what allows you to make a request via JavaScript,
    and the updateShipping function performs the request request. The handleResponse
    function receives the input from the page request and extracts the information
    in order to modify an element in this case (the totalshipfield). These are the
    three basic functions you need to perform an Ajax operation.


    This first example uses XML. The following line of code results in an xml text:


    ```

    ```javascript results = response; ```

    ```


    If you try this, you''ll find that when you type a zip code (or virtually anything,
    the code does no error checking) and then leave the field, the JavaScript automatically
    retrieves the value from $5.00 from the PHP application and places the value in
    the Total Field.


    Keep mind that Ajax executes as many shortcuts as possible to keep it simple.
    There is no error checking or whatever. There are ever no HTML tag names, only
    ids. It would be more common to create an HTML tag that uses <input type="text"
    id="totalshipping">. You would probably get the shipping cost as XML (you could
    also format the result as code when the user clicked "correct" to update their
    changes). In addition, the example doesn''t actually calculating the shipping
    cost. The URL in the base code points to a PHP script that returns the value of
    the zip code and uses it to calculate the shipping cost and return that.


    # Enter XML


    Technically, you can create a full Ajax application without using XML, but you
    will find XML to be a necessity as your Ajax grows in complexity. Here is how
    to do the same simple Web page with XML, once again cutting every for the sake
    of simplicity.


