    # Four Cool Ajax Plugins for WordPress


    MARCO FIORETT


    # Here is how to install and use your dynamite plugins for the WordPress content
    management system.


    WORDPRESS is the most popular free software for publishing and managing a dynamic
    personal Web site. It installs easily and quickly, but it has a lot of plugins
    that extend its functionality, and it can be used with practically every Hosting
    provider on the planet. Ajax (Asynchronous JavaScript and XML) is a mix of technologies
    used for building Web sites that respond more quickly and smoothly to input. Combining
    WordPress and Ajax to build a snappy Web site in a few minutes is much easier
    than you think, but you need to follow the instructions carefully to avoid a few
    de-ticks.


    This article discusses four plugins that can make your WordPress-based site more
    dynamic, friendly and for fun. The only prerequisite is to have an already-working
    WordPress installation that used version 2.1 or, of course, a complete backup
    of it in case.


    For the home page, unpack it, and move its JavaScript folder, the named GIF or
    a PHP file you guessed, it, ajax-wp.php, inside your WordPress installation. Then
    the fun begins.


    Ajax Wap works in two modes: Quick, which is easier to configure or Optimized.
    Whenever you choose, the home page piece in the right of the README file describe
    all the actual steps of the installation procedure, I summarize the main points
    here:


    In quick mode, every Ajax call will request a new page with content from the server
    that must be refreshed in the browser window. Other than you need to add only
    a few lines of PHP code to describe the header of your WordPress theme to start
    using Ajax.


    Optimized mode is faster and more efficient, because only the parts that change
    on the server are changed as they arrive in the right part of the browser window.
    While this may work, you will have to create an Ajax version of your theme—that
    is, add to each of the snippets of Wap code in the in-line documentation. Depending
    on your experience


    ## Ajax Wap: Rising the Limit


    Let''s start with a plugin that doesn''t generate snapshots, but makes your site
    better by making faster navigation. Ajax Wap improves the responsiveness of WordPress
    pages with a relatively simple trick: it reloads the internal links to other parts
    of your site with only JavaScript function calls.


    When visitors click on these modified links, they launch the script and then request
    the new page, all in the meantime, the visitors will not go blank; the header,
    footer, sidebars-basically every part of the Web site that is common to the current
    page and the one that requested-fully remain unchanged.


    Regardless of which mode, once everything is in place, users who have used Ajax
    in their browsers will enjoy a faster or at least much smoother navigation of
    pages. Users Wap will still be able to load and read the pages in the original
    mode.


    The part to be replaced, but only gradually, and the block of new content comes
    in place as the Ajax script will have ready. During this, so that it is actually
    doing something. Ajax Wap superimposes an GIF of rotating the whole page while
    it moves from the old page to the new one, using control of the script. It can
    be set to open, slide or hide.


    Some advice: keep a copy of the original WordPress Files and restore them if you
    use Ajax Wap and decide to switch to Optimized mode. If you make repeat installation
    setups or Ajax code in the strings, things will happen. Don''t forget to spend
    a few minutes checking the configuration variables of Ajax Wap to adapt to your
    taste, and to your theme and General WordPress setup. The most important options
    are Ajax_wp_base_path, which is the relative path from the root of your server
    to your WordPress installation folder, and the list of Ajax_image_names, which
    should normally require more than Ajax Wap.


    How slowly or quickly this happens depends on the speed of the internet connection,
    load of your server and the speed of your computers. If something go wrong, after
    a programmable trouble, Ajax Wap will simply bypass the loader page in the standard
    mode.


    Ajax Wap depends on a few JavaScript libraries that are installed in the distribution.
    To use this plugin, download the latest from.


    ## Calendar


    WordPress publishes and authors'' posts in chronological order without any effort.
    It comes naturally both for you and your readers, to track and retrieve posts
    through a calendar in the home page. WordPress has a built-in calendar, but the
    Ajax-based shown in Figure 1 is more dynamic and pleasant to use.


    The installation is fine, but not without a few issues. Considering the README
    file distributed with the code, you must uncomment the tarball in the WordPress
    plugins folder, activate it in the Administration pages, and in the index.php
