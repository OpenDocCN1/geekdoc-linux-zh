- md: "\nany attempt to claim Ruby can do what Perl does in one-fifth the number of\
    \ lines of code. It is important to note, however, that Ruby's interface to library\
    \ is significantly more abstract than the one offered by Perl, so Ruby does more\
    \ in a single call than Perl does but has more to do with the choice made by the\
    \ creator of Ruby's language binding, as opposed to any fundamental difference.\n\
    \nBefore executing this code, download and install Ruby's libcap library. Pop\
    \ over to the Ruby Web site (see Resources), and grab the tarball. Or, if you\
    \ use the Snapshot Package Manager to Ubuntu and install the libcap-ruby1.8 package.\n\
    \nYou also need a Ruby library to decode DNS messages. Frankly, Marco Ceresa has\
    \ been working hard at porting Perl's excellent DNS module to Ruby and has released\
    \ his code on Rubyforge, so you need that too (see Resources). Despite being alpha,\
    \ Marco's code is very usable, and ready to be patched after any problems are\
    \ brought to his attention. Once downloaded, install Marco's into your Ruby environment\
    \ with the following commands:\n\n```\nls zvf net-dns-0.1.tgz\ncd net-dns\nsudo\
    \ ruby setup.rb\n```\n\nMy DNS analyzer calls dns-watcher.rb, and it starts by\
    \ pulling the required Ruby libraries: one for working with libcap and the other\
    \ for decoding DNS messages.\n\n```\n# /usr/bin/ruby -w\n\nrequire 'pcap'\nrequire\
    \ 'net/dns/packet'\n```\n\nI can tell the program which network connection to\
    \ use for capturing traffic, or I let libcap-ruby work out this for me. The following\
    \ line of code lets Ruby do the work:\n\n```\ndev = Pcap.lookupupdev\n```\n\n\
    With the device identified (and stored in dev), we need to enable Ethernet's promiscuous\
    \ mode, which is essential if we are to capture all the traffic traveling on our\
    \ LAN. Here's the\n\n# Chip manufacturing, warehouse automation, and other throughput-intensive\
    \ systems require\n\n# Light Speed processing of c technology\n\n# FairCom database\
    \ technology makes it possible.\n\n# FairCom www.faircom.com/go/?speed\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_76_0.png)\n\
    \n# INDEPTH\n\nRuby code to do:\n\n```\ncapture = Pcap.capture.open_live(dev,\
    \ 1500)\n```\n\nThe open_live call takes two parameters: the device to work with\
    \ and a value that indicates how much of each packet to process. Setting the value\
    \ to 1500 ensures that the Ethernet packet is grabbed from the network ever occurring.\
    \ The call to open_live will only succeed if the program has the ability to turn\
    \ into promiscuous mode—that is, it must run as root or sudo. With the network\
    \ card identified and ready to capture traffic, the next line of code calls packet\
    \ filter:\n\n```\ncapture.setfilter(\"udp port 53\")\n```\n\nI'm using libpcap\
    \ to isolate itself only capturing packets that match the filter, in this case\
    \ Ethernet packets that contain UDP data and destination protocol value of 53.\
    \ As all-net knows, 53 is the port reserved for the DNS system. All other traffic\
    \ is ignored. If you want to use the filter method it can take any filter specification\
    \ according to the topology methodology. Most readers can learn how to filter\
    \ from the dump man page.\n\nA constant is defined to set how many packets I am\
    \ interested in, and a timestamped message is sent to STDOUT that the analyzer\
    \ is using:\n\n```\nNUM_PACKETS = 50\n\nputs (\"#{packet.name} - BEGIN run.\"\
    )\n```\n\nThe libpcap-library uses the loop iterator, which takes a convenient\
    \ API to capture traffic, takes a single parameter, which is the number of packets\
    \ to capture: Each captured packet is delivered to the iterator's body as a message,\
    \ which I refer to as packet in:\n\nWithin the iterator, the first order of business\
    \ is to decode the captured packet as a DNS message. The packet parse from Marco's\
    \ DNS net exactly that:\n\n```\ndns_data = Net::Packet.parse(packet.udp_data)\n\
    ```\n\nWith the message decoded, we can pull out the DNS header with a header\
    \ method:\n\n```\ndns_header = dns_data.header\n```\n\nFor my purposes, I am only\
    \ interested in queries to the DNS server, so I can ignore everything else checking\
    \ whether the query method returns true or false:\n\nWithin the body of this statement,\
    \ I would print the IP source and destination addresses, extracting the IP name\
    \ from the query, which is returned by calling the dns_data.question method. Note\
    \ the use of a regular expression to extract the IP name from the query:\n\n```\n\
    print \"Device #{packet.ip_src} >>to #{packet.ip_dst}) looking for \n  question\
    \ = #{dns_data.question}\n  inspect - /^\\(.+):*N/\nputs puts\n```\n\nThe program\
    \ includes the end block terminator, and then the object is closed, another timestamp\
    \ is sent to STDOUT:\n\n```\nend\nend\ncapture.loop\nputs \"#{packet.name} - END\
    \ run.\"\n```\n\n# Running dns-watcher\n\nIt's time to do your dns-watcher: a\n\
    \n```\nruby dns-watcher\n```\n\nThe output from this invocation is shown in Figure\
    \ 1. Note that there are not 50 lines of output, as expected. Remember, the first\
    \ query checks to see whether the captured DNS message is sent to the server and\
    \ processes the message if so. All other messages are ignored by the program,\
    \ then they continue the overall count of DNS packets processed.\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_77_0.png)\n\
