  mdcn: "\n\nfor name in *\n```bash\nif [ ! -z \"$(name | grep 'image data')\" ];\n\
    then\n  echo \"<img src='$name' alt=height=50 />\"\n  echo \"<br />$name<br />\"\
    \nelse\n  echo \"<a href='$name'>$name</a><br /><br />\"\nfi\ndone\n```\n\n返回\
    \ GIF 和 PNG 图像的高度和宽度，对 JPEG 和任何非图像文件返回空值：\n\n```bash\nfiguresize()\n  image=$1\n\
    \  fileout=\"$file -b 1\"\n  if [ ! -z \"$(echo $fileout|grep 'GIF image')\" ];\n\
    then\n    # GIF image，宽度和高度是 6-8\n    width=$(echo $fileout | cut -f6 -d ' ')\n\
    \    height=$(echo $fileout | cut -f8 -d ' ')\n  elif [ ! -z \"$(echo $fileout|grep\
    \ 'PNG image')\" ];\nthen\n    # PNG image，宽度和高度是 4-6\n    width=$(echo $fileout\
    \ | cut -f4 -d ' ')\n    height=$(echo $fileout | cut -f6 -d ' ')\n  else\n  \
    \  width=\"$width\"\n  fi\n```\n\n我还为 img 标签添加了一个属性，尽管它在显示上并没有太大区别。正如图 1 所示，显示效果非常好。但我们有一张图像\
    \ image-small.png，它的尺寸实际上是 850x40，强制将高度设为 50 像素会通过等比例放大增加其宽度，或者不会！\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_34_0.png)\n\
    \n现在我们将其引入到原始的循环中，我们还可以在输出中绘制图像的大小：\n\n图 1 缩略图显示示例\n\nfor name in *\n```bash\n\
    if [ ! -z \"$(file -b $name|grep 'image data')\" ];\nthen\n  figuresize Name\n\
    \  if [ ! -z \"$(echo '$height')\" ];\n  then\n    echo \"<img src='$name' alt=height=50\
    \ />\"\n    echo \"<br />$name<br />\"\n  else\n    echo \"<img src='$name' alt=height=50\
    \ />\"\n    echo \"<br />$name<br />\"\n  fi\nelse\n  echo \"<a href='$name'>$name</a><br\
    \ /><br />\"\nfi\n```\n\n## 输出图像尺寸\n\n评估尺寸并对其进行适当缩放是非常有用的。在某些版本的 Linux 中，你可以通过\
    \ `file` 命令获取图像尺寸：\n\n```text\nfile xml.gif disney-world-logo.jpg germany-logo.png\n\
    xml.gif GIF image data, size 89x40.\ndisney-world-logo.jpg JPEG image data, IF\
    \ standard 8.1, resolution (DPI), \"Adobe\", 72 x.\nzernerherlands-logo.png PNG\
    \ image data. 225 x 93, 8-bit color, Non interleaved\n```\n\n问题在于，`file` 命令并不知道如何评估\
    \ JPEG 文件的尺寸，例如对 image-world-logo.jpg 报告的 72x72，这有一个很大的局限性，但我们只能勉强接受。尽管我们应该使用\
    \ PNG 而不是 JPEG，对吧？\n\n基于此，这里有一个函数，我没有足够的空间来展示你如何利用信息来改变缩放缩略图的方式，所以我把它留到了下个月，但你可以通过一些代码进行实验，看看得到什么结果。此外，如果你想正确地使用所有图像类型，没有比在你的\
    \ Linux 机器上添加 ImageMagick 更好的选择了，你可以在 www.imagemagick.org 找到它 ⬛\n\nDave Taylor\
    \ 是一位拥有 26 年经验的 UNIX 老兵，The Elm System 的创建者，获奖书籍《Shell Code and Scripts to Yourself\
    \ in 24 Hours》的作者，编写了 16 本技术书籍。他的主网站是 www.intuitive.com，他还在 DaveTaylor.com 提供技术支持。\n\
    \nwww.linuxjournal.com | 2007年5月 | 33\n\n# 软件的价值何在\n\n它看起来很漂亮，但它能做什么？\n\nJON \"\
    MADDOG\" HALL\n\n作为一个在海边打过过相当长时间道的人，我喜欢观察船只和轮船——并将它们与罐头玉米进行比较。罐头玉米是一种商品。虽然我们可能对于如何挑选清洁的玉米达成共识，但对于挑选并将其放在货架上，大多数人花了太多时间站在商店的罐头玉米货架前，思考某个品牌是否比另一个更适合他们。他们挑选一个罐头然后离开。正如我所说，罐头玉米是一种商品。\n\
    \n船的情况并非如此。虽然大多数人会认为任何船都能胜用，但不同设计的船能满足不同的需求。有帆船、动力艇、拖船，并且根据船只、船员和设计的需求，每种船都有不同的型号。就像大多数人在决定买哪种玉米时会站在货架前一样，大多数人并不会冲向游艇经纪人，把手箱钱扔在码头上说他们要任何现货的船都行。\n\
    \n而且，尽管必须将拥有船的总成本考虑在内，但买船的决定因素是它是否符合你的需求、购买周期，以及你是否会修改船以满足未来的愿望。换句话说，船不是商品。\n\n\
    如今，你会听到人们说操作系统是一种“商品”，或者没有人不在乎。我相信这种概括化，就像很多概括化一样，在多样性面前会失效。让我们看看概括化在全自动费用机（ATM）中表现如何。ATM\
    \ 使用的操作系统是 OS/2。制作 OS/2 的公司已经“休息”了，银行不再能够向驱动器提供现金，也无法对使用 386,486 和长奔腾磁盘的 ATM 进行排序，这些具有数百万美元价值和其他差异，反映了长期的部署。银行决定使用\
    \ Linux 作为其操作系统，因为它能够在遥远的未来维持或扩展其潜力。\n\n巴西的一种彩票系统也可以考虑在彩票内部使用 Linux 和免费开源软件。这正在替换那些要求更改的专有供应商软件。通过本地开发团队，这些部署从几个月缩短到了几周。这产生了数百万美元的额外收入，因为新系统快得多。一个公共交通部门曾花费数百万美元购买仅用于写信、演示和运行的软件。通过使用开源软件，他们节省了大量资金。Jon\
    \ \"MADDOG\" Hall 是一个在 Linux 领域工作了很久的人。\n\n"
