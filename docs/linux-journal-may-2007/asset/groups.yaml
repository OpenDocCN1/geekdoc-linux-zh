    connecting via http://yourserver.chat. You''ll find yourself at a simple login
    screen (Figure 2).

    Choose a nickname (or user name), Click the chat, and you are good to go. The
    text input field is near the top of the screen. Directly below that is the refresh
    count, which can help you out. Out the right, you can choose to hide the information
    panel if you want. This is also interesting the linked More Options. If you change
    the color of your GoChat session or the session language (English, Spanish). It''s
    pretty simple. But you can do a little customization for yourself. The config.php
    file in the chat directory allows you control over the session. Your most interesting
    items are near the top of the file:


    Most of these are self-explanatory, the defaults may not be suitable to use. For
    instance, you may want to limit the file size to something other than 2MB. When
    you log in to a default GoChat session, you will notice you in the "Main Room".
    On the right, in a box list Room there are two additional rooms labeled "Another
    Room" and "Another One". You can create them, add more as needed. This is also
    done via the config.php file. A little further down the session fails, is the
    following:


    ```

    $CHAT_FILE = chattles/chat.txt;

    $CHAT_HISTORY = chattles/chatthistory.txt;

    $CHAT_SIZE = 50;

    $SESSION_DURATION = "60"; / in minutes

    $CHAT_FORMAT = "G-is is"; / php format

    $DEFAULT_LANGUAGE = "english"; / english or spanish

    $DEFAULT_COLOR = "gray"; / gray or pink

    $CHAT_MAX_SIZE = 2000000; // in bytes

    $CHAT_MAX_POOL = 10000000; // in bytes

    $REFRESH_TIME = 30; // in seconds

    ```


    ```

    // Comment this variable initialisation

    to allow multiple support

    $EXTRA_ROOMS = array(

    "Another Room", "chattles/additional.txt";

    "chattles/chatthistory.txt";

    "Another One", "chattles/additional2.txt";

    "chattles/chatthistory2.txt"

    )

    ```


    Simply edit this to suit your own site needs. If you feel particularly creative,
    you might want to add the default collection of emojis in the package. You can
    also define them in the configuration file.

    Francois, most this would be a good time to reef our guests'' glasses. I wish
