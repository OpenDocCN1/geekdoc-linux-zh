    \ if a user changes the value of a form field, the Web page could tell the server\
    \ to make a change to a database, without refreshing the page, as would be needed\
    \ in a standard web app from the user's perspective. The update just happens.\n\
    \nIn this article, I outline a set of very powerful Web Services that perform\
