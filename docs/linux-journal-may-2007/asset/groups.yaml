- md: "\n# MochiKiit by Example\n\nAn overview of MochiKiit with real-life examples.\n\
    \nINTERACTIVE WEB PAGES, long dreamed of by designers, finally here—interfaces\
    \ that respond to user commands, with minimal page reread. All this and more is\
    \ possible via Ajax (Asynchronous JavaScript and XML), which has recently come\
    \ into vogue with the Web.\n\nIn JavaScript, and programming in general, the best\
    \ code is code you can read. For serious projects, this often means using a framework—a\
    \ collection of useful and reusable code that is tested, optimized and (ideally)\
    \ peer-reviewed. The better frameworks have a good, high-level JavaScript framework,\
    \ for example, means more time to build and less time writing boring building-block\
    \ code (and then rewriting it when the de-facto incompatibilities poke their heads\
    \ up).\n\nMochiKiit is a JavaScript framework that provides tools for dealing\
    \ with asynchronous requests (Ajax), DOM (Document Object Model), functional programming\
    \ tools, data and times, string formatting, colors, visual effects, drag-and-drop,\
    \ and many more. MochiKiit 1.3 is targeted on Safari 2.0, Firefox (1.0.7, 1.5)\
    \ and 2.0), and IE 8.5 and higher.\n\nIn this quick introduction to MochiKiit,\
    \ explains how to get started with MochiKiit (with interesting stops along the\
    \ way) and describes three-ways of varying complexity that are generic enough\
    \ to use in your Web applications now.\n\n# What's in MochiKiit?\n\nIncluded in\
    \ MochiKiit are algorithms for data structures (serialization), functional programming,\
    \ iteration, DOM and CSS mapping, for server communication, a slot/slot mechanism\
    \ for JavaScript events and logging. At this point, MochiKiit uses the C++ STL\
    \ of JavaScript. And beyond what STL C++ provides, it also provides event handling,\
    \ drag and drop, colors and effects.\n\nOn the topic of data structures, MochiKiit\
    \ provides the powerful tools (like filter); which returns only lists that match\
    \ a criteria; find(); map(); which returns the result of list elements and bind().\
    \ MochiKiit also provides tools to translate and from JSON (JavaScript Object\
    \ Notation) syntax: serialize(). Above all, MochiKiit gives you the power to hook\
    \ your objects into MochiKiit.\n\nMochiKiit's tools for functional programming\
    \ functions to be created dynamically, or they may provide more extensive (or\
    \ less broken) behaviors for functionality already present in JavaScript. MochiKiit's\
    \ partial and bind() functions create a version of a function that can be called\
    \ either individually. In nature, these tools let you create functions dynamically.\
    \ These two functions are not obviously right without, but they are powerful when\
    \ combined with MochiKiit tools.\n\nIn addition to data structures, MochiKiit\
    \ allows you to create elements, convert DOM objects to strings, retrieve elements\
    \ by class or type, and swap DOM objects for other DOM objects.\n\n# Getting Started\
    \ with MochiKiit\n\nWant to see how MochiKiit works? The demo on mochikit.com\
    \ has several interesting examples. One of MochiKiit's is an interactive JavaScript\
    \ interface, executing whatever code you type in. In particular, interpreter provides\
    \ documentation for MochiKiit functions—via help()—returning a link to the page\
    \ you need.\n\nMochiKiit's documentation page also uses (Mobile-embedded) JavaScript\
    \ to display a list of sub-menus when the main page loads, it creates a list of\
    \ sub-menus (Mochi.Async, MochiKiit.Base, Mochi.DOM and so on). Clicking one will\
    \ expand or collapse them. No actual space exists—its all computed by (asynchronously)\
    \ requesting each page from the server, then sending the documentation-line corresponds\
    \ with the release of MochiKiit.\n\n64 | may 2007 // linuxjournal.com\n\n# Example\
    \ 1: Mochit in a Simple Page\n\nThe Mochit package is easy to install. If you\
    \ downloaded your zip version, move the Mochit folder in the folder to your Web\
    \ space, copy the Mochit folder from your Subversion control.\n\nCreate the following\
    \ HTML:\n\n```html\n<!DOCTYPE html PUBLIC\n//W3C//DTD HTML 1.0 //EN\"\n\"http://www.w3.org/TR/xhtml1/xhtml1-strict.dtd\"\
    >\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n  <meta\
    \ http-equiv=\"Content-Type\"\n    content=\"text/html\" charset=\"utf-8\" />\n\
    \  <title>Mochit Example #1</title>\n  <script type=\"text/javascript\" charset=\"\
    utf-8\"\n  src=\"Mochit/Mochit.js\" />\n  <script type=\"text/javascript\" charset=\"\
    utf-8\"\n  src=\"example.js\" />\n</head>\n\n<body>\n  <p style=\"background:\
    \ red;\n  padding-top: 10px;\">\nHello this is Mochit!</p>\n</body>\n</html>\n\
    ```\n\nNotice the line in your <head> section, which loads Mochit:\n\n```html\n\
    <script type=\"text/javascript\" charset=\"utf-8\"\nsrc=\"Mochit/Mochit.js\" />\n\
    ```\n\nAlso note that this is a paragraph with a red background. This box is plain-lining.\
    \ Wouldn't it be great if it had rounded corners? Mochit makes it.\n\nFirst, we\
    \ want to create a JavaScript function when we load the page. Mochit.DOM.addEventListener().\
    \ In JavaScript, the namespaces are not optional, but for clarity, we will include\
    \ them here.\n\nCreate a separate file for your JavaScript (a separate file is\
    \ best); in the file, we have one function and a call to addEventListener():\n\
    \n```javascript\nfunction myFunction() {\n  Mochit.Visual.roundClass('p', null);\n\
    }\nMochit.DOM.addEventListener(myFunction);\n```\n\ncurrently in development and\
