    一段时间以来，我一直在考虑在我的镇上建立一个社区拥有的免费网络。到目前为止，我一直受到挫折，因为几乎不可能让任何一家大公司（思科等）给我打电话。而且事实上，如果你需要一些路由器（我发现价格大约是那样），这很难。而且你为此需要一些资金，却没有人愿意为此平衡来写一份能被任何人都接受的商业计划书。


    感谢这篇文章，它鼓励我今天去采用那个主意。


    Henning


