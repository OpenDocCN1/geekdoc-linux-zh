    \ | 编辑 | 无评论 »\n\n2007年2月18日\n\n## 第二篇文章...\n\n虽然没有内容，但在几次对话中感觉良好。\n\n发布者：Admin\
    \ | 编辑 | 无评论 »\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_73_2.png)\n\n图 4. Shoutbox\
    \ 你可以在无需刷新页面的情况下进行聊天。\n\n右侧的滚动条允许新手能够跟进对话（5）。刷新间隔是可编程的。当到期时，新帖子将以不同的颜色高亮显示，并在任意时间间隔后恢复为背景色。你可以在“管理—实时\
    \ Shoutbox”（Manage—Live Shoutbox）页面设置所有选项。截屏显示的是原版版本，但你可以更改用户名、文本和所有评论的背景颜色。即使单输入区域也可以替换为更大的字体，但这显然对我们来说\n\
    \n## 今天的第三篇文章\n\n2007年2月18日\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_73_3.png)\n\
