    \ hour', 'lunch');\n```\n\nIf the data already exists then we can't construct\
    \ our. PostgreSQL also allows us to use many of exotic data types, including geometric\
    \ and IP addresses.\n\nIf we want to manage more than one thing with similar characteristics,\
    \ we can take advantage of PostgreSQL-object inheritance. Thus, we could have\
    \ a Table and a Manager, in which the Manager inherits the characteristics of\
    \ Table and adds its own features.\nYou can also create your own server-side functions,\
    \ in a variety of languages. PostgreSQL supports versions of Python, Tcl, Ruby\
    \ and the Rust language. These functions can return individual values or entire\
    \ tables, and can be used in triggers. You can also use these functions to rewrite\
    \ the rules for inserting, and deleting data from a table or even we\n\nBut, the\
    \ most important feature of all is the built-in support for transactions. Transactions\
    \ are an essential part of database programming, that they allow us to combine\
    \ multiple queries into one-or-nothing action. The classic example of a transaction\
    \ is if the power goes out, you want to move money from one account to another;\
    \ if the power was moved, and then it wouldn't be unacceptable for the money to\
    \ disappear altogether or appear in both accounts at once.\n\nRecent versions\
    \ of PostgreSQL have enhanced its capabilities. You can commit or rollback a transaction,\
