    ## 使用单数据包授权（SPA）保护 SSH 服务器


    ### 使用单数据包授权锁定 SSH。MICHAEL RASH


    **上个月**，在这一系列文章的第一部分中，我描述了下一代被动认证技术背后的原理，称为单数据包授权（Single Packet Authorization,
    SPA）。这种方法摒弃了复杂性，专注于通过 `fknop` 和 `iptables` 实际实际应用，以保护 SSH 免受探测和攻击。在 Linux 系统上完成此设置后，除非带有密钥的已验证客户端发送数据包，否则没有人能检测出
    SSH 正在监听状态。


    首先，我们需要一些关于配置和网络架构的信息。这假设你已经安装了最新版本的 fknop，并且知道 ssh 运行的位置。你可以从 www.fwwall.org/fknop
    下载 fknop，并通过运行 `install.sh` 脚本从源码包安装，或者通过基于 RPM 的发行版的 rpm 包进行安装。


    Netfilter 的跟踪机制用于在 iptables 策略中保持状态。最终结果是，通过防火墙启动（FORWARD 链）和指向防火墙（INPUT 链）的连接将保持开放，直到
    ACCEPT 规则允许数据包保持已建立的连接（如 TCP 确认包等）。iptables 策略是通过以下防火墙 sh 脚本构建的：


    ## 网络架构


    图 1 所示的基础网络说明了我们的设置。fknop 客户端位于受托管的 spa-client (15.1.1.1) 上，fknop 服务器 (16.2.2.2)
    上。恶意攻击者连接到 spa-server (18.3.3.3)，它能够嗅探 spa-client 和 ssh-server 系统之间的流量。


    ```bash

    [spa_server]# cat firewall.sh

    #!/bin/sh

    iptables=/sbin/iptables

    iptables -F

    iptables -t nat

    iptables -X

    iptables -INPUT -m state --ESTABLISHED -j ACCEPT

    iptables -FORWARD -m state --ESTABLISHED -j ACCEPT

    iptables -t -A POSTROUTING -s 192.168.1.0/24 -j MASQUERADE

    iptables -INPUT -i lo -j LOG --log-prefix -j DROP

    ```


    图 1. 使用 SPA 保护 SSH 通信的示例架构


    ## 默认拒绝 iptables 策略


    spa-client 的 IP 地址为 15.1.1.1，spa-server 的 IP 地址为 16.2.2.2。在 spa-server 系统上，iptables
    配置为为内部网络 (192.168.1.0/24) 提供基本连接性，并丢弃所有从外部网络连接它的流量（iptables 日志和目标）。需要注意的是，防火墙在常规扫描下不允许任何入站服务（包括
    SSH）。在真实网络中部署任何 iptables 都会复杂得多。然而，需要注意的一个重要特性是，连接到


    ```bash

    [spa_client]# nmap -p tcp -o eth0 16.2.2.2

    ```


    Starting Map 4.1 (http://www.inetsec.org/map/)

    16.2.2.2 上的感兴趣端口:

    | PORT | STATE | SERVICE |

    | :--- | :--- | :--- |

    | 22/tcp | filtered | ssh |


    Nmap finished: 1 IP address (1 up) scanned in 12.009 seconds


    22 | may 2007 | linuxjournal.org


    正如预期的，iptables 阻止了所有与 SSH 通信的尝试，其余端口（TCP 和 UDP）仅受 iptables 策略保护。无论攻击者是否拥有部署在 spa
    服务器系统上的特定版本 OpenSSH 的零日漏洞；所有尝试与堆栈通信的尝试都会被 iptables 拦截。


    spa 数据包的描述。本文说明了对称和非对称加密的使用，但 fknop 仅需要一种加密。


    ## fknop 配置


    确信 iptables 正在以严厉的方式保护本地网络后，是时候在 spa 服务器上配置 fknop 守护进程 (fknop) 了。该文件为 `/etc/fknop.conf`，它控制配置参数，如路由流量的接口、fknop
    发送 SPA 数据包通知的电子邮件地址和报警过滤器。默认情况下，fknop 通过 UDP 端口 62201 发送 SPA 包，因此 `/etc/fknop.conf`
    中的数据包过滤器设置应设置为端口 62201。


    如果存在 `KEY` 变量，可以省略所有的 GPG-*，反之亦然。`KEY` 变量定义了 fknop 客户端和服务器之间的共享密钥。该密钥用于使用对称分组密码（如
    AES）加密/解密 SPA 数据包，并标识本地服务器的 GPG ID。fknop 客户端通过加密快捷方式解密 SPA 数据包，或通过 GPG（作为邮件客户端）解密。


    `/etc/fknop/access.conf` 文件是最重要的配置文件——它管理用于验证 fknop 客户端 SPA 数据包的加密和访问控制。以下示例使用通配符允许来自以下
    IP 地址的 SPA 数据包：


    GPG_DECRYPT_PW 与此密码关联的密码放在 access.conf 文中。不建议对服务器的 GPG 密钥使用通配符；应该使用专用密钥来解密 SPA
    数据包。fknop 客户端使用 GPG 密钥对 SPA 包签名，密码以明文形式存储在服务器的 access.conf 文件中（我们稍后会看到）。然而，任何
    GPG 密钥都可以用于加密电子邮件通信，例如：


    ```conf

    # spa_server: /etc/fknop/access.conf

    SOURCE: ANY

    OPEN_PORTS: tcp/22

    FW_TIMEOUT: 0

    KEY: ABC1234

    GPG_DECRYPT_Pw: p2at1lc0

    GPG_HOME_DIR: /root/fknop/

    ```


    SOURCE 变量定义了 fknop Accept的 IP 地址。ANY 表示任何 IP 地址，但可以限制为特定的 IP 地址或子网，并支持逗号分隔的列表（例如
    192.168.1.0/24, 1.1.1.1）。`OPEN_PORTS` 变量告知 fknop 在收到有效 SPA 包时应打开的端口；通过将其设置为 `FW_TIMEOUT`，了防火墙允许流量的
    ACCEPT 规则时长。由于 iptables 使用了 Netfilter 提供的连接跟踪功能，连接将保持到 fknop 删除 ACCEPT 规则。剩余变量定义了加密参数，`GPG_REMOTE_ID`
    变量允许 fknop 信任可以通过加密机制访问安全 SSH 的人（在本例中）。生成 GPG 密钥可以参考 www.cipher.org/getinfo。


    构建好 `/etc/fknop.conf` 文件后，是时候在 spa 系统上启动 fknop 并使其工作了：


    ```bash

    spa_server/*etc/init.d/fknop

    Starting fknop ...

    ```


    ## 通过对称加密实现 SPA


