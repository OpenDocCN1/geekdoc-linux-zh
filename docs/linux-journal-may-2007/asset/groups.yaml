    # KRUU Models-Open-Source Radio


    Block Command (SBC) over Fibre Channel or SCSI Object-based Storage Device (OSD)
    over Network File System (NFS).


    the "control" protocol shown in Figure 1 between the network server and the storage
    is also evident. For example, it can be an OS over SCSI.


    The fact that the control protocol and the data transfer protocols elsewhere gives
    flexibility to the vendors. It allows them to add VFS to NFS to improve performance,
    improve fault tolerance or any feature they want as long as they follow the NFSv4.


    KRUU is a community FM station of the new "low power" broadcast that is intended
    to serve local areas with noncommercial programming (www.fcc.gov/media/lfm). As
    the FCC puts it, "The approximate range of a 100-watt LFM station is 5.6 kilometers
    (3.5 miles radius). In KRUU, that nicely covers the town of Fairlawn, Iowa. The
    station, however, is obstructed by physical limitations. I listen to it from Santa
    Barbara, and it''s one of my favorites. The station''s About tells why it''s so
    relevant and crucial


    KRUU''s commitment also extends to the software and systems that are in place.
    At all the computing we use free open-source software (sometimes we use freeware).
    The free is in access to freedom, and not all-the cost with the underlying source
    code, and we contribute all our edits, changes and additions back to share. We
    use free software for various projects beyond the scope of cost. KRUU likes to
    use local knowledge to identify systems that do not impose restrictions or licenses.
    To use this, we use software that is under a "copyleft" or open content that is
    licensed under Creative Commons.


    # Avoiding Vendor-Lock


    A natural question arises: "How does the PFSv4 standard OSD avoid vendor-lock?
    One of the main aspects of PFS is that it has a filesystem client regardless of
    the underlying storage architecture. The only thing needed for a specific storage
    system is a layer


    Parallel NFS also works well for the vendors because it allows them to store their
    work with any variety of operating systems or proprietary filesystem client. NFSv4
    will be the standard, the client should be able to work with any of operating
    systems as long as the OS has the client to provide the driver. Writing drivers
    is generally an easier process than completing a full client stack to various
    operating systems.


    If you have a current filesystem from one of the storage vendors, would OSD not
    work if the vendor doesn''t support it? NFS is more slower than PFS, but the performance
    will improve as experience is gained and the PFSv4 clients meet. More importantly,
    PFS allows you to mount the filesystem with the same performance as the original
    emplo. If you want to expand your storage, you can use any vendor that provides
    a driver for PFSv4. This allows your existing clients to access new storage systems
    just as your computers access NFS servers from different vendors, using the filesystem
    client that works with your operating system.


    The word "open" runs through KRUU plays and values. From 5-6 days, we hear the
    "Open Source Radio Hour.", and that is just the tip of the iceberg. For Listening
    with KRUU, it play OSD online, and I don''t know of any systems that are more
    committed to share free and open-source values like this little one.


    - DOC SERACS


    # They Said It


    I think that novels that leave technology imprisoned feel better as ladies who
    are liberated by such leaving.

    - Kurt Vonnegut, A Without a Man (Random House, 2005)


    Truth comes in conversation. Not solitude... those of us who are protecting the
    cultural customs, make us ask ourselves what we are trying to protect. For the
    interests, the tools of exclude (copyright term, digital rights management, etc.)
    have been used to prevent enhance and enrich; it''s about the money. For we who
    insist, the money is the least of it. The cultural commons means protecting ways
    of human being.


    - Lewis-Hik, in a Kent Berkeley, 2003


    This song is copyrighted in the U.S., undering of Copyright #154088, for a period
    of two years, and anybody can sing it without permission would be mighty good
    friends of our cause, we can''t deny a permit. Write it is free. Sing it to you.
    Yodel it is free. that''s all we want to do.


    - Woody Guthrie, www.publicknowledge.org/resources/quotes


    # Parting Comments


    Parallel NFS is not on its way to becoming a standard. It''s currently in the
    prototype stage, and interoperability is being tested by various participants.
    I hope that in 2007 it will be adopted as the new NFSv4 standard and will be used
    in a number of operating systems.


    If you want to experiment with PFS now, the Center for Information Technology
    (CIT) has some Linux 2 kernel patches that use PVFS2 for storage (www.cit.umich.edu/projects/acsi/linux/).


    - LARRY JONES


    I have repeated other things that would help you. My work is by the benefit of
    the things that became the name of Goethe.


    - Johann Wolfgang Goethe, www.publicknowledge.org/resources/quotes


    The preservation of the knowledge among the lowest ranks is of more importance
    to the public than all property of the rich men in the country.


    - John Adams, www.publicknowledge.org/resources/quote


    ![](img/6be405694cb4aa0c113e76f02a6a5081_19_0.png)


    18 | may 2007 www.linuxjournal.com *'
