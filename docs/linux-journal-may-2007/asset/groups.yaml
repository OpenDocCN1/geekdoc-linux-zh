    ## Hear Yourself Think Again!


    ![](img/6be405694cb4aa0c113e76f02a6a5081_40_0.png)


    ## WhisperStation™

    Cool... Fast... Silent!


    For 64-bit HPC, Gaming and Graphic Design Applications


    Originally designed for a group of power hungry, demanding engineers in the automotive
    industry, WhisperStation™ incorporates dual core AMD Opteron or Intel® processors,
    ultra-quiet fans and power supplies, plus internal soundproofing that produce
    a powerful, but silent, computational platform. The WhisperStation comes standard
    with high speed memory, NVIDIA GeForce or Quadro PCI Express graphics adapters,
    and LCD display. It can be configured to your exact specification with any Linux
    distribution. RAID is also available. WhisperStation™ will also make system administrator
    very hungry, when used as a master node for cluster! Visit www.microsoft.com for
    more technical information. Experience the "Sound of Silence". Call our technical
    sales team at 508-746-7341 and design your personalized WhisperStation today.


    ![](img/6be405694cb4aa0c113e76f02a6a5081_40_1.png)


    ## NEW PRODUCTS


    ### Coraid SR1521T EtherDrive Network Storage Tower

    The Coraid folks have released a standalone tower version of their EtherDrive
    Storage Appliance, christened the SR1521T. The SR1521T, with internal RAID, provides
    true networked storage over Ethernet and is based on (AoE) protocol. Coraid says
    "a block storage protocol that is simpler to implement than SAN technologies and
    at considerably less cost than SCSI and Fibre Channel solutions." Furthermore,
    because AoE does not require TCP/IP processing overhead, the target customers
    are those that seek scalable storage readily available at the departmental level.
    The protocol is native in the Linux kernel, and software drivers are available
    for Mac OS, Windows and FreeBSD.


    www.coraid.com


    ### Arcisoft VONLink TeamRecord

    Arcisoft joins the growing list of companies that have their services: it just
    released live version of its VONLink VoIP-based calling application. TeamRecord
    works with any phone system based on SIP standard (then Asterisk), recording all
    phone calls for a company workgroup. VONLink says that TeamRecord, for instance,
    allows Business transactions over the phone to be defended and resolved disputes
    with Sarban or other distribution protocols. Furthermore, TeamRecord records with
    analog and digital phones. The recording process involves monitoring of network
    ports via mirroring capability of a network and storing in uncompressed MP3 or
    WAV file. Users can listen to recordings of calls from a Web browser. TeamRecord
    is available for x86 Linux and Windows platforms.


    www.arcisoft.com


    ### ActiveState Komodo Edit

    ActiveState recently released its new version 4.0 of Komodo Edit, the firm''s
    multilingual editor based on ActiveState''s Komodo IDE 4.0. Komodo Edit not only
    supports Perl, PHP and Ruby but also client-side languages and technologies including
    JavaScript, HTML and XML. OS support includes Linux, Mac OS and Windows. With
    its products'' advantages, ActiveState capabilities include extensions, storage
    of configurable elements (such as commands, snippets and so on), syntax highlighting
    and coloring, an active community site and more. A gratis download of Komodo Edit
    is available from ActiveState''s Web site.


    www.activestate.com


    | VONLink TeamRecord | ... | ... |

    |---|---|---|

    | ... | ... | ... |


    ![](img/6be405694cb4aa0c113e76f02a6a5081_41_1.png)


    ### Dyne.org/ dyne:block Linux Distribution

    When spending time in Amsterdam''s office cafés, the members of Dyne are using
    busy dyne:block, upgraded to version 2.4, a live-installed distribution focused
    on the needs of media-production folks. The main advantages of dyne:block include
    recognition of wide variety of devices and peripherals, numerous tools for recording,
    editing, encoding and streaming, and powerful hardware. In new version 2.4 are
    improved friendliness via the Xce4.4 desktop, encrypted nests for preventing access
    to data stored in home networks (Qparted) and updated module (Cinerella) server
    and modularization of different kernels. You can also run the version of dyne:block
    on "modded Xbox game consoles" and even cluster them! Raw ISO CD can be downloaded
    for free or purchased for a minimal cost.


