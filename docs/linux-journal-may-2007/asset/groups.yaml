    # 四个酷炫的 WordPress Ajax 插件


    MARCO FIORETT


    # 以下是如何安装和使用这些用于 WordPress 内容管理系统的“炸弹级”插件。


    WORDPRESS 是最流行的发布和管理动态个人网站的免费软件。它安装简单、快速，但它有许多可以扩展其功能的插件，并且几乎可以与全球任何一个托管供应商配合使用。Ajax（异步
    JavaScript 和 XML）是多种技术的结合，用于构建对输入响应更快、更流畅的 Web 网站。将 WordPress 和 Ajax 结合起来在几分钟内构建一个快速的网站比你想象的要容易得多，但你需要仔细遵循说明以避免一些小失误。


    本文讨论了四个可以让你的 WordPress 网站更加动态、友好且充满趣味的插件。唯一的先决条件是已经有一个运行良好的 WordPress 安装（版本为 2.1
    或更高），或者当然，为了防万一，准备一个完整的备份。


    对于首页，解压它，并将其 JavaScript 文件夹、命名的 GIF 文件或你猜对的 PHP 文件——`ajax-wp.php`，移动到你的 WordPress
    安装目录中。然后，乐趣就开始了。


    Ajax Wap 以两种模式工作：快速模式（Quick），配置更简单；或优化模式（Optimized）。无论你选择哪种，README 文件右侧的首页部分描述了安装过程的所有实际步骤，我在这里总结了要点：


    在快速模式下，每次 Ajax 调用都会请求一个带有服务器内容的新页面，该页面必须在浏览器窗口中刷新。除此之外，你只需要添加几行 PHP 代码来描述你的 WordPress
    主题头部即可开始使用 Ajax。


    优化模式更快、更高效，因为只有服务器上发生变化的部分会在它们到达浏览器窗口右侧时进行更改。虽然这种方法可行，但你将不得不为你的主题创建一个 Ajax 版本——也就是说，在内联文档的每个
    Wap 代码段中添加相应内容。取决于你的经验。


    ## Ajax Wap：突破限制


    让我们从一个不生成快照、但通过提供更快的导航让你的网站变得更好的插件开始。Ajax Wap 通过一个相对简单的技巧改进了 WordPress 页面的响应速度：它仅通过
    JavaScript 函数调用来重新加载指向网站其他部分的内部链接。


    当访问者点击这些修改后的链接时，它们会启动脚本并请求新页面，在此期间，访问者不会看到空白；页眉、页脚、侧边栏——基本上是当前页面与请求页面共同的所有网站部分——将完全保持不变。


    无论使用哪种模式，一旦一切准备就绪，在浏览器中使用过 Ajax 的用户将享受更快速或至少更流畅的页面导航。使用 Wap 的用户仍然可以在原始模式下加载和阅读页面。


    需要替换的部分将逐渐替换，当 Ajax 脚本准备就绪时，新内容块将取而代之。在此，它实际上在执行某些操作。Ajax Wap 会利用脚本控制，在页面从旧页面移动到新页面时，叠加一个整个页面旋转的
