  mdcn: "\n\n# 在 LINUX 中烹饪\n\n使用组 apache，类型为：\n\n```bash\nchown apache:apache chattles/*.txt\n\
    ```\n\n你可能还需要验证 Apache 用户和组都具有写入这些文件的权限。此外，如果你更改了安装位置：要使用 GoChat，请通过 http://yourserver.chat\
    \ 连接。你将看到一个简单的登录界面（图 2）。\n\n选择一个昵称（或用户名），点击聊天，就可以开始使用了。文本输入框位于屏幕上方。紧正下方是刷新计数器，它可以为你提供帮助。在右侧，如果你需要，可以选择隐藏信息面板。这里链接的“更多选项（More\
    \ Options）”也很有趣。如果你更改 GoChat 会话的颜色或会话语言（英语、西班牙语），这非常简单。但你可以为自己进行一些自定义。聊天目录下的 `config.php`\
    \ 文件允许你控制会话。你最感兴趣的项目位于文件顶部：\n\n这些中的大部分内容都是一言自喻的，但默认值可能并不适用。例如，你可能想将文件大小限制为 2MB\
    \ 以外的值。当你登录默认的 GoChat 会话时，你会发现自己处于“主房间”。在右侧的“房间（Room）”列表中有两个标记为“另一个房间（Another\
    \ Room）”和“另一个（Another One）”的额外房间。你可以创建它们并根据需要添加更多。这也是通过 `config.php` 文件实现的。在会话失败稍下方是以下内容：\n\
    \n```php\n$CHAT_FILE = chattles/chat.txt;\n$CHAT_HISTORY = chattles/chatthistory.txt;\n\
    $CHAT_SIZE = 50;\n$SESSION_DURATION = \"60\"; // 分钟\n$CHAT_FORMAT = \"G-is is\"\
    ; // php格式\n$DEFAULT_LANGUAGE = \"english\"; // 英语或西班牙语\n$DEFAULT_COLOR = \"gray\"\
    ; // 灰色或粉色\n$CHAT_MAX_SIZE = 2000000; // 字节\n$CHAT_MAX_POOL = 10000000; // 字节\n\
    $REFRESH_TIME = 30; // 秒\n```\n\n```php\n// 注释此变量初始化\n// 以允许多个支持\n$EXTRA_ROOMS\
    \ = array(\n    \"Another Room\", \"chattles/additional.txt\",\n    \"chattles/chatthistory.txt\"\
