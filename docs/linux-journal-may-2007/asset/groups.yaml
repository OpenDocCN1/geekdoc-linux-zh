    that of the original SPA packet, no access is granted, and the following message
    is written to syslog appa_server:


    Feb 10 14:14:24 spa server fknop: attempted message reply from: 18.33.3


    ## Conclusion


    Single Packet Authorization provides additional layer of security for services
    such as SSH, and this layer strikes at the first step that an attacker must accomplish
    when trying to compromise a system: reconnaissance. By using iptables and fknop
    to default-drop state ensures that the wire is properly constructed, encrypted
    and authenticated, making it difficult to tell that a service is listening, let
    alone to communicate with it. It is significantly harder the end result is to
    exploit any vulnerabilities a protected security system may have.


