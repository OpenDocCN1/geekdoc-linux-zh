    success = resList[0];\nfailMsg = resList[1];\nsessionID = resList[2];\n\nif (success)\
    \ {\n// ...\n}\n}\n```\n\n## Conclusion\n\nMochit is a powerful toolkit, making\
    \ features easy in JavaScript. From visual effects, handling and functional tools\
    \ to Ajax functionality, Mochit puts amazing features at your fingertips.\n\n\
    Ryan Wilson is the founder of Wilson Solutions (www.wilson.com) specializing in\
