  mdcn: "\n\n# 使用 Web 服务和 Ajax  Web 应用程序\n\n## 使用 Perl 和 PostgreSQL 的 Ajax 基础。\n\n\
    **如果你在数据库端做过**新开发，你无疑听过关于 Web 服务和 Ajax 的热潮。业内的炒作如此流行，以至于你几乎认为人们在谈论微软的下一个操作系统。Web\
    \ 服务是两种允许开发者创建更具交互性的 Web 应用程序的技术，并让开发变得更简单、更不容易出错。\n\n既然我已经说了这些，让我们花点时间概述一下我们所说的“Web\
    \ 服务和 Ajax”。\n\nWeb 服务是一个可以通过给定程序通过 Internet 访问的程序，并提供特定的服务，例如搜索图书馆藏书或从 eBay 获取竞价数据。我们讨论的不是一个完整的应用程序，而是一个基于\
    \ Web 的应用程序编程接口 (API)，它可以被某个特定的服务调用以执行所需的功能。幸运的是，调用的结果以任何调用程序都能轻松解析的格式返回。\n\n\
    当人们讨论 Web 服务时，他们经常会提到 JSON、REST、SOAP 或 XML。这些都是用于调用 Web 服务的简单协议示例。熟悉这些协议可以让你使用\
    \ Amazon、Google 和 eBay 等公司提供的许多 Web 服务。然而，对于我的个人开发，我发现这些东西有点糟糕。\n\n另一种方法允许 Web\
    \ 页面在不刷新页面或使用隐藏框架 的情况下对数据库进行调用。例如，如果用户更改了表单字段的值，Web 页面可以告诉服务器对数据库进行更改，而无需刷新页面（从用户的角度来看，标准的\
    \ Web 应用程序是需要刷新页面的）。更新直接发生了。\n\n在本文中，我概述了一系列非常强大的 Web 服务，它们可以在数据库上执行特定功能。调用将通过\
    \ Ajax 完成。最终，我们将构建一个简单的 Web 联系人管理程序，存储一个人的姓、名和电话号码。我们将在数据库中上下移动它，进行添加、修正和删除记录。妙之处在于，一旦页面最初加载，即使我们做了更改，也不需要再次刷新它了。\n\
    \n在我们开始之前，我们需要在数据库中有一个表来存储信息。\n\n> 列表 1. 为项目准备 PostgreSQL 序列（Sequence）和表\n\n```\n\
    create sequence contacts_id_seq;\n\ncreate table contacts (\n  id integer default\
    \ next('contacts_id_seq') not null,\n  first varchar(20),\n  last varchar(20),\n\
    \  phone varchar(20)\n);\n```\n\n我恰好使用 PostgreSQL 作为我的首选 DBMS。对于我们简单的应用程序，我们一个表（列表\
    \ 1）。列表 1 的代码段包含一个序列和一个表。表结构对于我们的应用程序来说非常直接。在第一次构建时，只有一点值得提，当我们向表中插入记录时，`id` 字段被设置为\
    \ `contacts_id_seq` 序列中的下一个数字。结果是一个唯一的整数，可以用于定位。\n\n记录编号：\n姓：\n姓：\n电话：\n\n[新建]\
    \ [下一个]\n\n图 1. 此示例应用程序的极简版 Web 页面\n\n妙之处在于，一旦页面最初加载，即使我们做了更改，也不需要再次刷新它了。\n\n\
    ```html\n<html>\n<head>\n  <title>Contact Application</title>\n  <script src=\"\
    http://contacts.js\"></script>\n</head>\n<body>\n  <form method=\"POST\" name=\"\
