    \ XML. These are simple examples of protocols used for calling a Web Service.\
    \ Familiar with these protocols lets you use many Web Services provided by the\
    \ likes of Amazon, Google and eBay. However, for my personal development, I've\
    \ found these to be a bit awful.\n\nAnother way allows a Web page to make calls\
