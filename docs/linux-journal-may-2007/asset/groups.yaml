    any attempt to claim Ruby can do what Perl does in one-fifth the number of lines
    of code. It is important to note, however, that Ruby''s interface to library is
    significantly more abstract than the one offered by Perl, so Ruby does more in
    a single call than Perl does but has more to do with the choice made by the creator
    of Ruby''s language binding, as opposed to any fundamental difference.


    Before executing this code, download and install Ruby''s libcap library. Pop over
    to the Ruby Web site (see Resources), and grab the tarball. Or, if you use the
    Snapshot Package Manager to Ubuntu and install the libcap-ruby1.8 package.


    You also need a Ruby library to decode DNS messages. Frankly, Marco Ceresa has
    been working hard at porting Perl''s excellent DNS module to Ruby and has released
    his code on Rubyforge, so you need that too (see Resources). Despite being alpha,
    Marco''s code is very usable, and ready to be patched after any problems are brought
    to his attention. Once downloaded, install Marco''s into your Ruby environment
    with the following commands:


    ```

    ls zvf net-dns-0.1.tgz

    cd net-dns

    sudo ruby setup.rb

    ```


    My DNS analyzer calls dns-watcher.rb, and it starts by pulling the required Ruby
    libraries: one for working with libcap and the other for decoding DNS messages.


    ```

    # /usr/bin/ruby -w


    require ''pcap''

    require ''net/dns/packet''

    ```


    I can tell the program which network connection to use for capturing traffic,
    or I let libcap-ruby work out this for me. The following line of code lets Ruby
    do the work:


    ```

    dev = Pcap.lookupupdev

    ```


    With the device identified (and stored in dev), we need to enable Ethernet''s
    promiscuous mode, which is essential if we are to capture all the traffic traveling
    on our LAN. Here''s the


