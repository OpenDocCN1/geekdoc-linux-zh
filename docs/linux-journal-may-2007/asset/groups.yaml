  - '[PAGE 25]


    # AT THE FORGE


    Firebug introduces a new logging system that makes it possible to produce debugging
    output without using the alert. I can''t quite believe it took this long to realize
    it would be helpful to have a method for logging that doesn''t produce a modal
    dialog box. Regardless of how long it took, we can now use console.log to write
    messages to the Firebug console, as such:


    ```

    console.log(''Now executing the ''function.'')

    ```


    Or:


    ```

    console.log(username was '' '' + username + ''*'')

    ```


    Actually, Firebug makes it possible to do much better than, with embedded, print-like
    strings:


    ```

    console.log(username was ''%s'', username)

    ```


    Firebug provides a set of logging functions, each of which outputs with a different
    level and color. These are:


    +   - console.debug

    - console.info

    - console.warn

    - console.error


    The output from these methods appears in the Firebug console, which you can view
    by clicking on the Console button, right under the Firebug icon. Note that using
    these methods might be incompatible with browsers that lack Firebug.


    The console is not only an area that receives messages with. As with Ruby''s IRB
    and Python''s interactive mode, Firebug''s console allows you to execute JavaScript
    within the context of the page. Interested in getting a list of forms on the page?
    Simply:


    ```

    document.forms

    ```


    and you will get all of the forms. You can also use Prototype-style methods to
    retrieve information about the page, as:


    ```

    $(''$cb_form'')

    ```


    which, on the Linux home page, produces the following header:


    ```

    <form id=''cbv_form'' method=''get''>

    ```


    Firebug also has capabilities for monitoring


    functions, settings, breakpoints and profiling functions. Go to the Script button,
    and you are greeted by the source code for an included JavaScript file. (You can
    change the line you''re looking at by choosing a menu.) Point to a line of code
    with mouse cursor brings information about the state of those objects.


    Clicking on the breakpoint allows to copy the function (when trying to communicate
    with other programmers or when writing a column program) or handle a breakpoint
    by stepping through the code:


    Find out which JavaScript functions have taken the most time, and which are most
    frequently, use Firebug''s debugger. It''s amazingly simple to click the Console/Profile
    tab, and then you get about the variables, using the Web as much or as little
    as Firebug reports the number of times each JavaScript function was called, the
    time each call took and where function is defined:


    Finally, the Net button makes it easy to keep track of any Ajax calls in the debugger.
    Clicking on Net and X produces a graphical indication of the Ajax calls that have
    been made on the page, as well as how long each took to execute. If you are developing
    an Ajax application, this is the best way to find your bottlenecks.


    It''s rare not to do a product revolutionary, but I am sorry to do so in the case
    of Firebug. It has a lot of information in one nicely designed, easy-to-use package.
    The ability to include with my packages a Wisp-like feel, as if I''m currently
    interacting with a live environment. Firebug has given me the ability to ''see''
    what my pages are doing and to better understand them.


    Firebug has become indispensable tool in my arsenal, alongside the Web Developer.
    In this way, Firebug is beginning to demonstrate that it is a platform for Internet
    applications, rather than merely a Web browser


    Raven Meuren, a long-time Database/journalist, is a PhD candidate in Learning
    and Sciences at Northwestern University in Evanston, Illinois. He lives with his
    wife and three children in Skokie, Illinois. You can read more at wetlandandler.co.il.


    # Resources


    The Firebug home page is www.firebug.com. There is limited documentation, including
    a FAQ, on that site.


    An introduction to Firebug by its author, John Hewitt, in Dr. Robb''s Journal:
    www.ddj.com/199608277.


    24 | may 2007 | www.linuxjournal.com | Thiel'
