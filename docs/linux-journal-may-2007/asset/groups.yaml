    \ />\n    <input type=\"button\" name=\"delete\" onclick=\"delete_record(main.id);\"\
    \ />\n    <br>Record Number: <input id=\"id\" name=\"id\">\n    <br>First: <input\
    \ id=\"id\" name=\"first\" onchange=\"update_record(main.id);\" value=\"first.main.value\"\
    ;\n    <br>Last: <input id=\"id\" name=\"last\" onchange=\"update_record(main.id);\"\
    \ value=\"last.main.value\";\n    <br>Phone: <input id=\"id\" name=\"phone\" onchange=\"\
    update_record(main.id);\" value=\"phone.main.value\";\n    <br><input type=\"\
