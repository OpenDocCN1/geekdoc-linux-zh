    ## Ajax 简化教程


    NICHOLAS PETRELEY


    Ajax 的实现可能会变得非常复杂，但其概念其实很简单。


    这是一份关于 Ajax 的简单教程，将消除那些认为 Ajax 令人生畏的人的恐惧。尽管该术语的含义是异步 JavaScript 和 XML，但 Ajax 围绕着一个非常简单的原理。它允许你在无需重新加载页面的情况下操作网页内容。以下是利用
    Ajax 力量的关键步骤：


    - 捕获事件（例如用户更改编辑字段或按下按钮时）。

    - 事件触发 JavaScript 代码，该代码向 Web 服务器发送查询。

    - JavaScript 代码从服务器获取结果。

    - JavaScript 代码使用结果来更新网页内容。


    JavaScript 通过访问文档对象模型（DOM）在不重新加载页面的情况下更改网页内容。例如，假设你的页面更改了以下元素：


    ```html

    <input type="text" id="total" />

    ```


    HTML 标签的 ID 在 DOM 中创建了一个元素，你可以通过以下 JavaScript 代码通过 JavaScript 修改内容：


    ```javascript

    document.getElementById("total").value = value;

    ```


    Web 设计师已经使用这种能力很长时间了。Ajax 真正的威力在于能够在服务器端而非客户端计算总值。为了保持简单，这里有一个除了返回结果外不涉及任何其他服务器的示例。这个示例展示了一个简单的表单，让你输入某种类型的代码。当你更改邮政编码时，JavaScript
    代码将其发送到服务器端并返回相应的运费。然后，JavaScript 代码修改 `totalshipping` 以反映服务器响应。


    列表 1 显示的示例仅包含 Ajax 页面的最基本元素——主要函数 `getHTTP`、`handleResponse` 和 `updateShipping`。`onChange`
    事件触发了 JavaScript 函数 `updateShipping`。当你使用 `onBlur` 时，允许离开邮政编码并失去焦点。


    `XMLHttpRequest` 对象允许你通过 JavaScript 发起请求，`updateShipping` 函数执行该请求。`handleResponse`
    函数接收来自页面请求的输入并提取信息，以便修改此例中的元素（即 `totalshipfield`）。这些是执行 Ajax 操作所需的三个基本函数。


    第一个示例使用了 XML。下一行代码会生成一个 xml 文本：


    ```javascript

    results = response;

    ```


    如果你尝试这样做，你会发现当你输入邮政编码（或几乎任何内容，代码没有进行错误检查）并离开该字段时，JavaScript 会自动从 PHP 应用中获取 $5.00
    的值并将其放置在总字段中。


    请记住，Ajax 尽可能执行许多快捷方式以保持简单。它没有错误检查之类的机制。从没有 HTML 标签名称，只有 id。创建一个使用 `<input type="text"
    id="totalshipping">` 的 HTML 标签更为常见。你可能会以 XML 格式获取运费（你也可以在用户点击“确定”更新更改时将结果格式化为代码）。此外，示例并没有实际计算运费。代码中的
    URL 指向 PHP 脚本，该脚本返回邮政编码的值并用它计算运费后返回。


    ## 使用 XML


    从技术上讲，你可以不使用 XML 就创建一个完整的 Ajax 应用，但随着 Ajax 复杂性的增加，你会发现 XML 是必不可少的。以下是使用 XML 实现相同的简单网页的方法，再次为了简单而省略了一切。


    ### 列表 1. index.html


    ```html

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0//EN"

    //http://www.w3.org/TR/DTD/html-strict.dtd">

    <html xmlns="http://www.w3.org/1999/html">

    <head>

    <title>示例</title>

    <script language="javascript" type="javascript">

    var url = "getShipping.php?zipcode=";


    function handleHttpResponse() {

    if (http.readyState == 4) {

    results = http.responseText;

    document.getElementById(''totalshipping'').value = results;

    }


    function updateShipping() {

    var zipValue = document.getElementById(''zip'').value;


    http.open("GET", url + escape(zipValue), true);

    http.onreadystatechange = handleHttpResponse;

    http.send(null);

    }


    function getHTTPObject() {

    var xmlhttp;

    xmlhttp = new XMLHttpRequest();

    return xmlhttp;

    }

    </script>

    ```


    注意列表 3，我们通过 `http.responseText` 获取响应，通过 `document.getElementsByTagName(''shipping'')`
    获取值。注意 XML 指的是 `shipping` 标签而不是 `totalshipping`。这种差异在教程中是不必要的，但为了简单了 HTML。


    ### 列表 3. index.xml


    ```html

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0//EN"

    //http://www.w3.org/TR/DTD/html-strict.dtd">

    <html xmlns="http://www.w3.org/1999/html">

    <head>

    <title>示例</title>

    <script language="javascript" type="javascript">

    var url = "getShipping.php?zipcode=";


    function handleHttpResponse() {

    if (http.readyState == 4) {

    var xmlDocument = http.responseText;

    shipping = xmlDocument.getElementsByTagName(''shipping'').item(0).firstChild.data;

    document.getElementById(''totalshipping'').value = shipping;

    }


    function updateShipping() {

    var zipValue = document.getElementById(''zip'').value;


    http.open("GET", url + escape(zipValue), true);

    http.onreadystatechange = handleHttpResponse;

    http.send(null);

    }


    function getHTTPObject() {

    var xmlhttp;

    xmlhttp = new XMLHttpRequest();

    return xmlhttp;

    }

    </script>

    </html>

    ```


    ### 列表 2. getShipping.php


    ```php

    <?php

    echo "$5.00";

    ?>

    ```

    ```html

    <body>

    <form action="post">

    <p>

    邮政编码: <input type="text" size="5" name="zip" id="zip"

    onchange="updateShipping(); />

    <p>

    运费: <input type="text" id="totalshipping" />

    </form>

    </body>

    </html>

    ```


    id 匹配才能使应用程序工作。它们必须匹配。剩下的工作是修改我们的 PHP 代码返回 XML 而不是文本。查看列表 4 中的 PHP 代码。除了 XML 内容外，注意将内容作为
    XML 发送的代码。它将 shipping 作为 `<order>` 的子元素，以及未使用的数据。这是向返回更真实的数据的一个简单步骤。信不信，这取决于通过
    Firebug 查看。


    ### 列表 4. Shipping.php


    ```php

    <?php

    $shipping = ''$5.00'';

    $total = ''$10.00'';

    $return_value = ''<xml version="1.0" standalone="yes"?>

    <order>

    <shipping>'' . $shipping . ''</shipping>

    <total>'' . $total . ''</total>

    </order>'';

    header(''Content-Type: text/xml'');

    echo $return_value;

    ```


    ### 验证与错误处理


    真实的应用程序不会假设 PHP 文件存在。它在尝试将参数发送到服务器查找运费之前，还会检查邮政编码的值。你可以为服务器提供邮政编码，也可以在客户端进行最小化然后在服务器端对邮政编码进行完全验证。


    ### 执行服务器端计算和操作


    至于如何在服务器端处理服务，取决于你选择什么 Web 应用语言和其他东西。你最熟悉什么，或者什么时间学习其他 Ajax 语言。你使用的上面的示例显示了所有的错误处理以便关注
    Ajax 工作的基本原理。你需要在应用程序中包含输入验证、错误检测和错误处理。


    ### 优化你的性能


    JavaScript 优化是一门艺术，但压缩 JavaScript 代码有助于可读性，文件大小越小，下载的用户就越多。你可以使用许多 JavaScript
    压缩器之一将 JavaScript 压缩到几个字节。Dojo 库已经过压缩，并提供了一个你可以使用的压缩器。你甚至可以使用 Dojo Shrinkify 在线压缩它。你在客户端想要的取决于你想在
    cookie 中存储什么，你可能通过在服务器端存储信息来提高性能。使用常识评估哪种方法最有效。


    ### 考虑浏览器之间的差异


    上述显示了 jQuery 是如何工作的，但不能保证它在 Ajax 中有效。如果你想从头开始所有的 Ajax 代码，考虑到 Firebug 和 Ajax 之间的差异，或者前端库的使用。幸运的是，大量的
    Ajax 库可以为你管理细节。我最喜欢的之一是 Dojo。构建一个杀手级的 Ajax 应用并不容易，但希望 Ajax 工作的简单性会鼓励你尝试。看一看并加入吧。


    '
