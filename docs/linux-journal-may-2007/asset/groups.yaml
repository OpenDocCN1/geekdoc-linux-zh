    <field name=\"id\" value=\"25\\></field>\n</result>\n```\n\nand much of the JavaScript\
    \ can be reused for other parts of a large application or even many different\
    \ applications. The Web Services simply becomes thick that we glued together with\
    \ JavaScript to build, and this is what makes Web Services such an elegant method\
    \ of development.\n\nFrom the users' perspective, using API to perform the database\
    \ functions is a major issue. As mentioned, once the application is loaded, users\
    \ have to incur the cost of re-downloading it and having their browsers re-edit\
    \ it. It is more complex, on which this can be a significant delay. Furthermore,\
    \ the results of a given operation are returned in small snippets of XML, the\
    \ bandwidth requirements are minimal. It is argued that not only would users perceive\
    \ this type of application but also strain the server and network infrastructure\
    \ to provide the application.\n\n```\nprint \"Content-type: text/xml\\n\";\n\n\
    print \"<result>\";\nprint \"<field name=\"id\" value=\"$index\\\\></field>\"\
    ;\nprint \"</result>\";\n```\n\nBut, how would it be to add a new field, perhaps\
    \ as an e-mail address, to the database table scheme? Then, we'd have to add an\
    \ appropriate field to our database table. Then, we'd have to add the field,\n\
    \nprogram is shown in Listing 4.\n\nAll this program is connected to a database,\
    \ an insert into the contacts table, retrieve the id of the record created and\
    \ return the result in a block of XML with boxed MIME type. The resulting XML\
    \ results may be shown in Listing 5.\n\nThe select, delete, insert and update\
    \ services are very similar, as shown in Listings 6, 7, and 8.\n\nThe select process\
    \ shown in Listing 6 takes a single parameter—the id of the record to be retrieved.\
    \ The result is an XML file containing all the fields of the record and the appropriate\
    \ value. This allows us to call the function with all the fields of that record\
    \ for later use.\n\nThe delete process shown in Listing 7 takes an id and deletes\
    \ the record with that id. Then, the program fetches the next record and ensures\
    \ that the id is returned.\n\nThe update process shown in Listing 8 takes a record\
    \ id, a field name and a new value as parameters. Then, the program updates the\
    \ given field of the record with the new value. The new value is returned via\
    \ XML.\n\nGranted, our application is fairly trivial, but it does all of the basic\
    \ functions that need to be performed on a database: insert, delete, update and\
    \ search. More importantly, no single element of this application is difficult\
    \ to write, debug or understand. With, with a few improvements that I outline\
    \ next, the Web Services\n\n# Ultra Dense, Powerful, Reliable...\nDatacenter Management\
