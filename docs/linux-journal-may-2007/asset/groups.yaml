    # OpenOffice.org ODF,

    Python and XML


    Combine Python with the open format of ODF files to manipulate fine details. COLLIN
    PARK


    My wife is a writer, who today means she is a word processing

    program. A sophisticated, powerful program—OpenOffice.org

    Writer—but occasionally it doesn''t know what she wants to

    do. In this article, we take a look at the structure of OpenDocument

    Format (ODF) files and see Python, with its XML libraries, can

    help. Here is shows an example.


    ![](img/6be405694cb4aa0c113e76f02a6a5081_87_0.png)


    Figure 1. Converting Quotation Marks


    It''s not hard to convert quotation marks on a few paragraphs

    hand—or even on a few pages, if one does it once. But having

    to repeat manual operations on subsequent revisions becomes

    tedious, especially on a longer document, such as a poetry collection

    or novel. What if we have to repeat these operations after importing

    text from an email message, for example?


    Fortunately, ODF is open, so we are able to manipulate

    them files with any programming language.

    Let''s see if we can do that manually, to make sure we know

    what we''re doing. Once done, we''ll create a script to do

    more ambitious things with the document.


    # Cracking the OpenDocument

    Format—A Simple Example


    I read somewhere that ODF file is a zip copy of XML files.

    Let''s see if it''s really one—and what we can find:


    ```

    $ unzip -l ex1.odf

    sed -n ''s/\\[([0-9]*\) \(.*)\).*/\1/p''

    ```


    | Length | Date | Name |

    |---|---|---|

    | 39 | 11-05-06 01:55 | mimetype |

    | 00 | 11-05-06 01:55 | Configurations2/status/ |

    | 00 | 11-05-06 01:55 | Configurations2/accelerator/current.xml |

    | 00 | 11-05-06 01:55 | Configurations2/floater/ |

    | 00 | 11-05-06 01:55 | Configurations2/popupmenu/ |

    | 00 | 11-05-06 01:55 | Configurations2/progress/ |

    | 00 | 11-05-06 01:55 | Configurations2/menubar/ |

    | 00 | 11-05-06 01:55 | Configurations2/tool/ |

    | 00 | 11-05-06 01:55 | Configurations2/images/Bitmaps/ |

    | 2872 | 11-05-06 01:55 | content.xml |


    9786 11-05-06 01:55 styles.xml

    1189 11-05-06 01:55 meta.xml

    0879 11-05-06 01:55 Thumbnails/thumbnail.png

    6663 11-05-06 01:55 settings.xml

    2037 11-05-06 01:55 META-INF/manifest.xml


    %

    23322

    16 files


    Good news—it is a zip archive.

    So, the plan is to unpack it, modify a file (or files) and pack

    every thing again. We will pack up files in the same order, just

    it matters. We need to see the file list.

    The listing from running zip has that file list, also with

    other stuff. Let select only the lines that have filenames (in this case,

    the lines with a : (by digits)) and print the files.

    A single command to do this:


    ```

    $ unzip -l ex1.odf | sed -n ''s/\\[([0-9]*\) \(.*)\).*/\1/p''

    ```


    Configurations2/status/

    Configurations2/accelerator/current.xml

    Configurations2/floater/

