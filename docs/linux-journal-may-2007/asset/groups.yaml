    # we look for it at start (AS) or\n# after a space (\\), and we want it to be\n\
    # followed by a non-space\nsdpat = re.compile('((?<=^)(\\\")(?=\\s))(?=S). .U\
    \  # new in fix3.py\n```\n\n```\ndef fixdata(data):\n    print(\"DEBUG-md: Unicode:\
    \ %s\" % data)\n    print(data)\n    print(\" OK, so we wash everything\")\n \
    \   td = data.replace('-', '')\n    print(\" Change 'en' to ' em\")\n    td =\
    \ data.replace(emash, dash)  # new in fix3.py\n    print(\" Making a nice quote-curly\"\
    )  # new in fix3.py\n    sdpat = sdpat.sub(quote, td.data)  # new in fix3.py\n\
