    # 专栏

    为精英设计的 LINUX


    ![](img/6be405694cb4aa0c113e76f02a6a5081_37_0.png)


    # 温尼伯的企鹅


    一场与 Michael Collins 关于曼尼托巴媒体中心进展的访谈。


    DOC SEARS


    **有时我喜欢回顾**那些值得获得更多关注，而不仅仅是首次报道时几英寸篇幅的故事。正如新闻提到的，曼尼托巴媒体中心计划在温尼伯建立一个全新的开源编辑环境、创新与生产研究设施，该项目已获得七位数美元的资金，并计划投入高达八百万美元[2007
    年 3 月 LMR 刊中关于 Dee 的报道]。我不禁在想……“为什么是这么多？而且，在曼尼托巴？”


    于是，我开始与 Michael Collins 通信，他是 Linux Media Arts (LMA) 的首席执行官，也是 Robert 报道温尼伯专题的幕后推手。在
    NAB（美国广播电视协会）上遇到过他的 LMR 读者显示，Michael 说：“我们的目标是成为世界上顶级的编辑和媒体制作平台，主要使用开源软件” https://www.linuxjournal.com/article/47843。


    明年，Robert 发布了 LMA 的第一个顶尖非线性编辑器（NLE）——该产品由 Cinelerara (cineler.org) 提供种子支持，这是一个基于
    Linux 的 64 位开源系统，它最终在 Google 上拥有了 70 万个搜索结果。虽然这本身就是曼尼托巴的一项成就，但似乎太诱人而无法忽视。因此，我决定采访
    Michael，结果非常有意思。请看下文。


    进行了一个为期四天的行程，与温尼伯的 José 以及他在商界和政府的同事会面。José 在曼尼托巴的商界和政界备受推崇，我花了好几天才与公私部门的许多人会面。我们首先遇到了温尼伯发展发展局（Suzuki
    Development of Manitoba）的 Suzuki，该市的经济发展机构，他一直关注着我们，并要求为我安排首次访问及未来访问的会议行程。我们还见了
    Wakefield，他是曼尼托巴政府科学、技术、能源和创新的副部长。


    我描绘了一个全球开源媒体技术中心的愿景。John Clarkson 非常乐意，并在会议结束时给了我一个惊喜，提到曼尼托巴省长 Gary Do 对我们位于加利福尼亚的愿景非常感兴趣。省长计划在几周后访问洛杉矶，我们于
    12 月晚与他会面。


    几周后，我收到了 John 的邮件，他希望省长访问我们的办公室，并希望向他展示我们的愿景。于是 Door 先生在 John Clarkson 的陪同下，在酒店中心阐述了该项目如何利用曼尼托巴专业的工程人才储备和支持性的社区业务。


    当省长想要推进该计划时，我们再次进行了会面。因此，我又去了两次行程来完善项目，并为其核心要素制定计划。José 和我对与利益相关者会面，并讨论从零开始建设设施的技术、财务和专业需求感兴趣。


    L.J.：是什么让曼尼托巴媒体中心运转起来的？


    MC：曼尼托巴开源与开发设施的概念是在多伦多的 ABC 节目后三年首次被考虑的。我计划与一位温尼伯的同事会面，我们之前一直在远程合作高清视频摄影棚的设计。José
    是一位经验丰富的系统工程师，拥有电气和计算机工程博士学位和 MBA 学位。José 对媒体工程和开源业务有深入了解，他对比曼尼托巴的技术和财务资源以及他非常稳定的专业环境非常感兴趣——这在研发气候中是匮乏的，感觉曼尼托巴可能是最理想的之地，而在我的潜意识里，我们正朝着我们的愿景迈进。


    随后，商业前景大幅提升，我们认为我们需要研发。因此，去年春天，我联系了 José 讨论在温尼伯为 LMA 建立一个研发设施的事。然后，我在 8 月去了温尼伯进行了为期四天的行程，与温尼伯的
    José 以及他在商界和政府的同事会面。


    L.J.：能告诉我们投资者是谁吗？


    MC：我可以告诉你，Linux Media Arts 正投入 500 万美元的当前收入加入这一初期开发投资。其余来自曼尼托巴省政府和地区投资的结合。这笔数百万的投资将使我们能够参与到以前无法提供的业务机会和关系中。


    L.J.：你们从哪些项目开始？


    MC：LMA 目前内部有若干个复杂的系统架构项目。我们将聘用 MMC 的员工和贡献者来支持关键技术开发。此外，我们认为，MMC 将支持那些目前市场存在但未得到行业妥当支持的技术开发。


    此外，我们计划为曼尼托巴的 Misispawak 克里族国家（Misispawak Cree Nation）建立一个多媒体制作中心。用户将能够为互联网、缆和卫星传输记录并制作节目。2007
    年秋，温尼伯。


    我们还在协助温尼伯的 River College 开发基于开源媒体应用的课程。我们也在与曼尼托巴大学媒体中心进行合作。


    ## L.J.：其中包含哪些市场？


    MMC：我们的重点是广播和电影制作等大型市场。系统工程师，特别是亚洲的工程师。只要人们希望开源多媒体达到专业标准，我们就能提供帮助。我们的工程团队非常有经验。我们拥有来自最大的媒体和媒体制作公司的资深博士。


    ## L.J.：你们正在研究哪些技术？


    MC：我们正在研究高清视频编辑、隔行消除色彩校正。我们还在研究开源编码器和元数据管理工具。


    ## L.J.：你们预计未来会怎样？


    MMC：我们预计开源工具将变得更加易于使用且更加专业。我们还希望看到开发者与终端用户社区之间更多的合作。


    '
