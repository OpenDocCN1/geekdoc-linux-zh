- md: "\n## The Top Layer: a Shell Script\n\nI want to use the highest-level language\
    \ reasonable for each task; for top layer, that's probably the shell. This script,\
    \ called fix.sh, turned out to be better than I thought it would be, mostly because\
    \ of the error checking:\n\n```bash\n#!/bin/bash\n# Script to fix OpenDocument\
    \ Text (.odt)\n# cd to the directory named \"fix.py\"\n\n# Make TMPDIR, a new\
    \ temporary directory\nTMPDIR=$(mktemp -d -date +%Y%m%d-%H%M%S)\nif rm -rf $TMPDIR\
    \ && mkdir $TMPDIR; then\n  # Be happy\nelse\n  echo \"$2 'Can't create TMPDIR;\"\
    \n  exit 1\nfi\n\nif [ -f $TMPDIR/OLDcontent.xml ]; then\n  # It worked.\nelse\n\
    \  echo \"$2 'fix.py failed in $TMPDIR; aborting\"\n  exit 1\nfi\n\nif cd $TMPDIR\
    \ && zip -q $1; then\n  # Everything cleaned up $TMPDIR\n  rm -rf $TMPDIR\nelse\n\
    \  # something bad happened.\n  echo \"$2 'zip' failed in $TMPDIR on $1'\"\nfi\n\
    \n# Check number of parameters.\n# Ensure $NEWFILE exists and is writable\n# Quietly\
    \ unload OLDcontent. abort on error\n\nif [ $# -ne 2 ]; then\n  touch $NEWFILE\
    \ -f $NEWFILE\n  if unzip -q $OLDcontent $TMPDIR; then\n    # All good; be happy\n\
    \  else\n    # Trouble! Use message usage, clout.\n    echo \"$2 $OLD NEWFILE\"\
    \n    echo \"$2 'Note: ' delete OpenDocument Text (odt) files\"\n    rm -rf $TMPDIR\n\
    \    exit 1\n  fi\nfi\n```\n\nIt's long but straightforward, to explain a few\
    \ things. First, the directory name contains the date and time, and the shell's\
    \ process ID prevents name collisions. The second line will keep yours because\
    \ I want to accept content but not like-content. Finally, we cleanup the temporary\
    \ directory ($TMPDIR) in error cases, where we leave it intact for debugging and\
    \ let the user decide why. We can't run this just, because we don't have fix.py\
    \ locally. But we can use a variable to write the file. So fix.sh script will\
    \ take one parameter (the original content) and another (the new content). This\
    \ helps in matching the character set for if we use our fork of fix.sh, which\
    \ will give us a new document with the same name as the old.\n\n```bash\n# Save\
    \ file $1 in $S;\nF=$(zip -l $OLD | sed 's/[0-9]*/[0-9]//')\nif [ -f $NEWFILE\
    \ ]; grep -q \"content.xml\"; then\n  # Good news; we have content\nelse\n  echo\
    \ \"$2 content not in $NEWFILE; aborting\"\n  echo $TMPDIR is $TMPDIR\"\n  exit\
    \ 1\nfi\n```\n\nThe new file, out, is slightly larger than we want, but at OpenOffice,\
    \ they wrote the right script. As far as parsing-well, back with years, Python\
    \ with its XML libraries is much more natural choice. I noticed one below: Lightweight\
    \ Document Object Model (DOM) implementation sounded good. It is a much more natural\
    \ choice.\n\n## The Bottom Layer: a Python/XML Script\n\nSeveral modules are listed,\
    \ and the library reference gives these examples:\n\n```bash\n# Now invoke the\
    \ program to fix.xml\nmv TMPDIR=$TMPDIR/OLDcontent.xml\n```\n\n```python\nfrom\
    \ xml.dom.minidom import parse, parseString\n\ndef handle_xml_tree(node, depth):\n\
    \    if 'data' in dir(node):\n        print(\"depth:%d: %s\" % (depth, node.data))\n\
    \        for child in node.childNodes:\n            handle_xml_tree(child, depth+1)\n\
    \ndoc = parse(sys.argv[1])\nhandle_xml_tree(doc, 0)\nprint(doc.toxml('utf-8'))\n\
    ```\n\nSo, it looks like parse can take a filename or a file object.\n\nif __name__\
    \ == \"__main__\":\n    print(sys.argv)\n```\n\n### Exploring content\n\nOnce\
    \ we create an object, what can we do with it? One might say Python is the interactive\
    \ shell, which lets you try things out at a time. Let's unpack the first function\
    \ and look inside: The print routine provides debugging; let's try that on the\
    \ content example:\n\n```bash\n# mkdir\n# unzip -q -d tmp1\n# /content.xml/content\n\
    ```\n\ndepth=5: Turn all these\nGCC 3.3.2 20030214 (prerelease) (Linux) on linux\n\
    depth=6: \"straight\"\ntype \"help\", \"copyright\", \"credits\" or license information.\n\
    \nTraceback (most recent call):\nFile /content.xml, line 24, in\n    import xml.dom.minidom\n\
    \    print(sys.argv)\nFile /content.xml, line 20, in\n    dir(dom)\n    handle_xml_tree(doc,\
    \ 0)\n- A VERY long list, including\nFile /content.xml, line 13, in\n    'children':\
    \ 'firstchild', 'nodename', 'nodevalue'\n    handle_xml_tree(node,depth+1)\n-\
    \ len(dom.children)\n    handle_xml_tree(node,depth+1)\nc1=dom.firstChild\nFile\
    \ /content.xml, line 13, in\n    len(c1.childNodes)\n    handle_xml_tree(node,depth+1)\n\
    - for c in c1.childNodes: print c2.nodeName\nFile /content.xml, line 16, in\n\
    \    print(\"depth:%d: %s\" % (depth, aNode.data))\noffice-font-face\nFile /content.xml,\
    \ line 8, in\noffice-automatic-styles\n"
  mdcn: "\n\n## 顶层：Shell 脚本\n\n我想对每个任务使用合理的最高层级语言；对于顶层来说，那可能是 shell。这个名为 `fix.sh`\
    \ 的脚本结果比我想象的要好，这主要归功于错误检查：\n\n```bash\n#!/bin/bash\n# 用于修复 OpenDocument Text (.odt)\
    \ 的脚本\n# 进入名为 \"fix.py\" 的目录\n\n# 创建 TMPDIR，一个新的临时目录\nTMPDIR=$(mktemp -d -date\
    \ +%Y%m%d-%H%M%S)\nif rm -rf $TMPDIR && mkdir $TMPDIR; then\n  # 感到高兴\nelse\n\
    \  echo \"$2 'Can't create TMPDIR;\"\n  exit 1\nfi\n\nif [ -f $TMPDIR/OLDcontent.xml\
    \ ]; then\n  # 成功了。\nelse\n  echo \"$2 'fix.py failed in $TMPDIR; aborting\"\n\
    \  exit 1\nfi\n\nif cd $TMPDIR && zip -q $1; then\n  # 清理了 $TMPDIR\n  rm -rf $TMPDIR\n\
    else\n  # 发生了某些糟糕的事情\n  echo \"$2 'zip' failed in $TMPDIR on $1'\"\nfi\n\n# 检查参数数量\n\
    # 确保 $NEWFILE 存在且可写\n# 静默卸载 OLDcontent，遇错时中止\n\nif [ $# -ne 2 ]; then\n  touch\
    \ $NEWFILE -f $NEWFILE\n  if unzip -q $OLDcontent $TMPDIR; then\n    # 一切正常；感到高兴\n\
    \  else\n    # 麻烦了！使用消息用法，clout。\n    echo \"$2 $OLD NEWFILE\"\n    echo \"$2\
    \ 'Note: ' delete OpenDocument Text (odt) files\"\n    rm -rf $TMPDIR\n    exit\
    \ 1\n  fi\nfi\n```\n\n它很长，但逻辑直接，为了解释几点：首先，目录名称包含日期和时间，shell 的进程 ID 防止了名称冲突。第二行将保留你的文件，因为我想接受内容但不想要相同的内容。最后，我们在错误情况下清理临时目录（$TMPDIR），而在其他情况下，我们保持其原样以便调试，并让用户决定原因是什么。我们不能直接运行它，因为我们本地没有\
    \ `fix.py`。但我们可以使用变量来写入文件。因此，`fix.sh` 脚本将接受一个参数（原始内容）和另一个参数（新内容）。这有助于在我们使用分支的\
