    # Licensing and Costs


    Zimbra is a free and open-source package, but it also offers commercial packages
    and support. The Network Edition offers full commercial support plus, value-added
    features. For instance, clustering, including advanced backup and recovery features,
    and a powerful search function, aren''t part of the Open Source. Whether you use
    Outlook or Apple Mail you need the Network Edition. Over-the-air mobile synchronization
    (Symbian, Android and Windows mobiles with no additional software required on
    the handset) is another value-added. Blackberry support is available through a
    third party. Note to RIM: it would be really easy, if there weren''t a mobile
    API for Zimbra.


    The Zimbra Collaboration is available for a variety of distributions and platforms.
    If packages for your particular distribution are available, Zimbra free and Open
    Source Editions are released at a price we don''t want to be different, regardless
    of whether it is the Network or Open Source Edition. Even so, only a major distributions
    (such as Red Hat Enterprise Linux and SUSE Linux Enterprise) are supported for
