- md: "\n# Listing 4. The server-side Perl script handles the database insert action.\n\
    \n# Listing 5. Resulting XML\n\n```perl\n#!/usr/bin/perl\n\nuse DBI;\n\n$dbh =\
    \ DBI->connect(\"dbi:Pg:dbname=database\",\n    \"user\", \"password\");\n\n$dbh->insert(\"\
    into contacts (first, last, phone) values\n(NULL, NULL,NULL)\");\n\n$sth = $dbh->prepare(\"\
    select last_value\nfrom record where id_seq=\");\n$sth->execute();\n($index) =\
    \ $sth->fetchrow_array();\n```\n\n```xml\n<result>\n<field name=\"id\" value=\"\
    25\"></field>\n</result>\n```\n\nand much of the JavaScript can be reused for\
    \ other parts of a large application or even many different applications. The\
    \ Web Services simply becomes thick that we glued together with JavaScript to\
    \ build, and this is what makes Web Services such an elegant method of development.\n\
    \nFrom the users' perspective, using API to perform the database functions is\
    \ a major issue. As mentioned, once the application is loaded, users have to incur\
    \ the cost of re-downloading it and having their browsers re-edit it. It is more\
    \ complex, on which this can be a significant delay. Furthermore, the results\
    \ of a given operation are returned in small snippets of XML, the bandwidth requirements\
    \ are minimal. It is argued that not only would users perceive this type of application\
    \ but also strain the server and network infrastructure to provide the application.\n\
    \n```perl\nprint \"Content-type: text/xml\\n\";\n\nprint \"<result>\";\nprint\
    \ \"<field name=\"id\" value=\"$index\"></field>\";\nprint \"</result>\";\n```\n\
    \nBut, how would it be to add a new field, perhaps as an e-mail address, to the\
    \ database table scheme? Then, we'd have to add an appropriate field to our database\
    \ table. Then, we'd have to add the field,\n\nprogram is shown in Listing 4.\n\
    \nAll this program is connected to a database, an insert into the contacts table,\
    \ retrieve the id of the record created and return the result in a block of XML\
    \ with boxed MIME type. The resulting XML results may be shown in Listing 5.\n\
    \nThe select, delete, insert and update services are very similar, as shown in\
    \ Listings 6, 7, and 8.\n\nThe select process shown in Listing 6 takes a single\
    \ parameter—the id of the record to be retrieved. The result is an XML file containing\
    \ all the fields of the record and the appropriate value. This allows us to call\
    \ the function with all the fields of that record for later use.\n\nThe delete\
    \ process shown in Listing 7 takes an id and deletes the record with that id.\
    \ Then, the program fetches the next record and ensures that the id is returned.\n\
    \nThe update process shown in Listing 8 takes a record id, a field name and a\
    \ new value as parameters. Then, the program updates the given field of the record\
    \ with the new value. The new value is returned via XML.\n\nGranted, our application\
    \ is fairly trivial, but it does all of the basic functions that need to be performed\
    \ on a database: insert, delete, update and search. More importantly, no single\
    \ element of this application is difficult to write, debug or understand. With,\
    \ with a few improvements that I outline next, the Web Services\n\n# Ultra Dense,\
    \ Powerful, Reliable...\nDatacenter Management Simplified!\n15\" Deep, 2-Xeon/Opteron\
    \ or P4 (w/RAID) options\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_62_0.png)\n\
    \n# Customized Solutions for...\nLinux, BSD, W2K\n\n# High Performance Networking\
    \ Solutions\n\n- Data Center Management\n- Application Clustering\n- Network and\
    \ Storage Engines\n\n# Rackmount Server Products\n- 1U Tariff at $499: C3-1GHz,\
    \ RAM 256MB, 20GB IDE\n- 2U with 16 Blades, Fast Deployment & more..\n\n# Iron\
    \ Systems, Inc.\n\n540 Dado Street, San Jose, CA 95131\nwww.ironssystems.com\n\
    \n# CALL: 1-800-921-IRON\n\n# FEATURE Web Services and Ajax\n\n# Listing 6. The\
    \ Perl Script for Selecting Data\n\n```perl\n#!/usr/bin/perl\n\nuse CGI;\nuse\
    \ DBI;\n\n$db = DBI->connect(\"dbi:Pg: dbname=database\",\n  \"$postgres\", \"\
    password\");\n\nprint \"Content-type: text/xml\\n\\n\";\nprint \"<result>\";\n\
    \n$cgi = new CGI;\n\n$id = $cgi->param(\"id\");\n\n$sth = $db->prepare(\"select\
    \ * from contacts where id=$id\");\n$sth->execute();\n\n$a = $sth->fetch_hashref();\n\
    \nforeach $key (keys %a) {\n  print \"<field name=\\$key\\\" value=\\$a{$key}</field>\\\
    n\";\n}\n\nprint \"</result>\";\n```\n\n# Listing 7. The Perl Script for Updating\
    \ a Record\n\n```perl\n#!/usr/bin/perl\n\nuse CGI;\nuse DBI;\n\n$db = DBI->connect(\"\
    dbi:Pg: dbname=database\",\n  \"$postgres\", \"password\");\n\n$cgi = new CGI;\n\
    \n$id = $cgi->param(\"id\");\n$field = $cgi->param(\"field\");\n$value = $cgi->param(\"\
    value\");\n\n$db->update(\"update contacts set $field=$value where id=$id\");\n\
    \nprint \"Content-type: text/xml\\n\\n\";\nprint \"<result>\";\nprint \"<field\
    \ name=\\$field\\\" value=\\$value</field>\";\nprint \"</result>\";\n```\n\n#\
    \ Listing 8. The Perl Script for Deleting a Record\n\n```perl\n#!/usr/bin/perl\n\
    \nuse CGI;\nuse DBI;\n\n$db = DBI->connect(\"dbi:Pg: dbname=database\",\n  \"\
    $postgres\", \"password\");\n\n$cgi = new CGI;\n\n$id = $cgi->param(\"id\");\n\
    \n$db->delete(\"delete contacts where id=$id\");\n\n$sth = $db->prepare(\"select\
    \ max(id) from contacts where id=$id\");\n$sth->execute();\n($index) = $sth->fetchrow_array();\n\
    \nprint \"Content-type: text/xml\\n\\n\";\nprint \"<result>\";\nprint \"<field\
    \ name=\\\"id\\\" value=\\$index</field>\";\nprint \"</result>\";\n```\n\nHow\
    \ could we improve our service? First, we'd need to take care of security issues.\
    \ Our Web services should only allow authorized users to perform database functions.\
    \ You have noticed that all fields in our arrays are of type varchar(20). That's\
    \ not very flexible or convenient. To be truly useful, we should be able to determine\
    \ what type each field is. We would need to handle integers and booleans too.\
    \ By simply sending the name of the table as one of parameters, we can build a\
    \ Web Service that can modify tables other than our own. Generating Web Services\
    \ like this would make our applications easy to write, and even any application\
    \ in the web could use them. So, by coupling AJAX with our brand, we would be\
    \ able to write applications that are more responsive to user input, less taxing\
    \ the server, and much easier to write.\n\nMike Diecht is a contractor at National\
    \ Laboratories in Albuquerque, New Mexico, where we use network management software.\
    \ Mike lives with his wife and two boys and can be reached via email at diecht.com.\n\
    \n# OSBC\nMAY 22-23, 2007\nPALACE HOTEL | SAN FRANCISCO, CA\nOSBC Open Source\
