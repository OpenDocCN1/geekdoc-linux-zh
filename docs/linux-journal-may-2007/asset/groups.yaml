  - "[PAGE 33]\n\n# # Displaying Image Directories in Apache Part II\n\nGet the Apache\
    \ images in thumbnails by turning everything in a loop.\n\n**Last month**, we\
    \ started writing a shell script to turn the boring Apache directory display into\
    \ a more useful and visually interesting page that helps you figure out what images\
    \ you have and what they look like.\n\nBy utilizing the file command, I showed\
    \ how you easily differentiate between files that are actually images and those\
    \ that aren't, so you don't get into an awkward situation where you're trying\
    \ something like this:\n\n```\n<img src=\"myfile.html alt=\"myfile.html\">\n```\n\
    \nIf you tell the Web to display an HTML source file as an image, the results\
    \ aren't going to be what you desire!\n\n# ## Everything in a loop\n\nThe basic\
    \ script iterates through every file in the current directory with a loop, using\
    \ the following construct:\n\n+   - for name in *\n  - do\n    - commands\n  -\
    \ done\n\nLet me point out that this doesn't display files with spaces , which\
    \ is with that it doesn't display and - , which is potentially a problem if you\
    \ were being tricky and have filenames like secret-picture.png. But then, if you're\
    \ trying to find files by making them dot files, it's unreasonable unless that\
    \ script glimmers over them.\n\nAs I've shown earlier, if you have an image, the\
    \ best way to display it in HTML is to use something like:\n\n```\n<img src=\"\
    filename\" alt=\"filename\">\n```\n\nA better solution is to maybe label the image\
    \ in the tag, but add this code. Remember that I'm using the file command to figure\
    \ out what an image is, and how our loop looks like this:\n\n+   - for name in\
    \ *\n  - done\n\n```\nif [ ! -z \"$file name | grep 'image data' ]\nthen\n  echo\
    \ \"<img src=$name<br><br> />\"\nelse\n  echo \"<a href=$name>$name<br><br> </a>\"\
    \nfi\ndone /\n```\n\nThis works perfectly, displaying the images (and names) for\
    \ those files that are recognized as images, and just displaying a hypertext reference\
    \ to the other files in the directory without erroneously indentating they're\
    \ images.\n\n# ## Thumbnails\n\nThe problem with this is demonstrated if, you\
    \ have lots of large-sized images, the result page is huge! What I really want\
    \ are small de-sized previews of my images, not the full images themselves.\n\n\
    Web browsers are pretty good at scaling images if you ask them to do it. For example,\
    \ if you have a 300x300 image and scale it to 50x50, the browser automatically\
    \ will scale it. But you might not scale it if you simply specify either a height\
    \ or width. Without that, this works for:\n\n```\n<img src=\"image.png\" height=50\
    \ />\n```\n\nThat's good news, because although you can get the size of image\
    \ on the fly in your shell script, it's fairly complicated. So, if we can specify\
    \ one parameter should always be a given height, you can get quasi-thumbnails,\
    \ albeit oddly sized images.\n\nThe problem, by we, if we say that we want it\
    \ to be 50-pixels high and scale appropriately, an image that's 480 wide by 500\
    \ wide becomes, a 480-pixel-wide thumbnail. Ideally, ours would fix it into a\
    \ 50x50 box instead, but let's start with a basic:\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_33_0.png)\n\
    \nDAVE TAYLOR\n\n32 | may 2007 | www.linuxjournal.com"
- md: "\nfor name in *\n```bash\nif [ ! -z \"$(name | grep 'image data')\" ];\nthen\n\
    \  echo \"<img src='$name' alt=height=50 />\"\n  echo \"<br />$name<br />\"\n\
    else\n  echo \"<a href='$name'>$name</a><br /><br />\"\nfi\ndone\n```\n\nreturns\
    \ height and width for GIF and PNG images and a null value for JPEG and any non-image\
    \ files:\n\n```bash\nfiguresize()\n  image=$1\n  fileout=\"$file -b 1\"\n  if\
    \ [ ! -z \"$(echo $fileout|grep 'GIF image')\" ];\nthen\n    # GIF image, width\
    \ and height are 6-8\n    width=$(echo $fileout | cut -f6 -d ' ')\n    height=$(echo\
    \ $fileout | cut -f8 -d ' ')\n  elif [ ! -z \"$(echo $fileout|grep 'PNG image')\"\
    \ ];\nthen\n    # PNG image, width and height are 4-6\n    width=$(echo $fileout\
    \ | cut -f4 -d ' ')\n    height=$(echo $fileout | cut -f6 -d ' ')\n  else\n  \
    \  width=\"$width\"\n  fi\n```\n\nI also added an attribute to the img, though\
    \ it doesn't really make any difference in the display. As we see in Figure 1,\
    \ the display is pretty nice. But we have one image, image-small.png, that turns\
    \ out to be 850x40, forcing a height of 50 pixels exactly increases its width,\
    \ by scaling up, or not!\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_34_0.png)\n\
    \nThis is now introduced into our original loop, we can also draw the size of\
    \ the image in our output:\n\nFigure 1. Example Thumbnail Display\n\nfor name\
    \ in *\n```bash\nif [ ! -z \"$(file -b $name|grep 'image data')\" ];\nthen\n \
    \ figuresize Name\n  if [ ! -z \"$(echo '$height')\" ];\n  then\n    echo \"<img\
    \ src='$name' alt=height=50 />\"\n    echo \"<br />$name<br />\"\n  else\n   \
    \ echo \"<img src='$name' alt=height=50 />\"\n    echo \"<br />$name<br />\"\n\
    \  fi\nelse\n  echo \"<a href='$name'>$name</a><br /><br />\"\nfi\n```\n\n## Outuring\
    \ Image Size\n\nIt would be useful to assess the size of the and scale it properly.\
