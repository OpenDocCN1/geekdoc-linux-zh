    \nMichael Rash 拥有马尔堡大学应用数学硕士学位，主修计算机安全。Michael 是 cipherdy.org 的创始人，他还为 Linux 系统构建了开源安全软件，并担任企业入侵检测系统的安全架构师。他是\
    \ No Start Press 出版书籍《Linux: Attack Detection and Response》的即将作者。\n\n## 资源\n\n\
    fknop: www.cipherdy.org/fknop\n\n关于端口敲击（port knocking）和单包授权的理论信息的优秀来源可以在伦敦大学皇家霍洛学院\
    \ Sebastian Jequiers 的硕士论文找到。该论文可以从 web.mac.com/sj 下载，它是关于为什么这不是“通过隐藏实现安全”的极佳论证。\n\
