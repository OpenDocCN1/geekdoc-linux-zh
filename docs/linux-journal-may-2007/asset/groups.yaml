    # # Protecting SSH Servers with Single Packet Authorization


    # ## Lock down to SSH with Single Packet Authorization. MICHAEL RASH


    **Last month**, in the first part of this two-part series, I described the technology
    behind the next generation of passive authentication technologies called Single
    Packet Authorization (SPA). This approach gets away and concentrates on the practical
    application of SPA with fknop and iptables to protect SSH from reconnaissance
    and attack. With this setup on a Linux system, no one will be able to tell that
    SSH is even listening unless an authenticated client with the secret key sends
    a packet.


    To begin, we require some information about configuration and network architecture.
    This assumes you have installed the latest version of fknop and where ssh is running.
    You can download fknop from www.fwwall.org/fknop and install it from the source
    archive by running install.sh script or via the rpm for RPM-based distributions.


    tracking facilities by Netfilter to be kept state in the iptables policy. The
    end result is that connections initiated through the firewall (the FORWARD chain)
    and to the firewall (the INPUT chain) remain open until ACCEPT rules allows packets
    to be kept connections then established (such as TCP acknowledgments and the like).
    The iptables policy is built with the following firewall sh script:


    # ## Network Architecture


    The basic network described in Figure 1 illustrates our setup. The fknop client
    is expected on the hosted spa-client (15.1.1.1), and the fknop server (16.2.2.2).
    A malicious attacker is attached to the spa-server (18.3.3.3), which is able to
    sniff traffic between the spa-client and ssh-server systems.


    ![](img/6be405694cb4aa0c113e76f02a6a5081_83_0.png)


    ```

    [spa_server]# cat firewall.sh

    !/bin/sh

    iptables=/sbin/iptables

    iptables -F

    iptables -t nat

    iptables -X

    iptables -INPUT -m state --ESTABLISHED -j ACCEPT

    iptables -FORWARD -m state --ESTABLISHED -j ACCEPT

    iptables -t -A POSTROUTING -s 192.168.1.0/24 -j MASQUERADE

    iptables -INPUT -i lo -j LOG --log-prefix -j DROP

    ```


    Figure 1. Sample Architecture Where You Use SPA to protect SSH Communications


    # ## Default-drop iptables Policy


    The spa-client has the IP address 15.1.1.1, and the spa-server has the IP address
    16.2.2.2. On the spa-server system, iptables is configured to provide basic connectivity
    for the internal network (192.168.1.0/24) and drop all traffic (the iptables logs
    and targets) from the external network to connect to it. It is important to note
    that the firewall does not allow any incoming services (including SSH) under an
    immer scan. Any deployment of iptables for a real network would be significantly
    more complicated. One important feature to note, however, is that the connection
    to


