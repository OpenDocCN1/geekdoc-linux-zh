    40 | may 2007 www.linuxjournal.com


    ## Avocent''s MergePoint 5224 and 5240 Appliances

    New arrows in Avocent''s quiver are the MergePoint 5224 and 5240, appliances for
    controlling the service processors found in nearly any server. Service processors
    help managers independent of the main processor, controlling functions such as
    power, hard monitoring and alerts. With MergePoint appliances, Avocent claims
    to be the first company to "enable IT administrators to manage multiple service
    processors in Windows, Linux and Unix servers from a single console", leveraging
    the "embedded management capabilities of servers already in their network." Product
    advantages include the management and control of all service processors via a
    unified gateway; increased efficiency through consolidation of service ports;
    reduced costs; and added security through authentication and authorization.


    www.avocent.com


    ![](img/6be405694cb4aa0c113e76f02a6a5081_42_0.png)


    ## NEW PRODUCTS


    ### Starch Press Titles

    Here''s the deal. Now, Starch Press is giving life to many great titles. First,
    there''s Design Linux by Bob Smith, John Hutton and Bill Pierce. Many books tell
    readers how to run Linux on embedded hardware. Next up, we''s Designing BSD Rootkits:
    An Introduction to Kernel Hacking by Joseph Gray. Written in a cheeky style with
    lots of geek humor, the book covers the fundamentals of programming and developing
    roots under the FreeBSD operating system. Finally, The Book of Qt by Daniel Komfort,
    a KDE developer shows how to build applications with Qt GUI Designer.


    ![](img/6be405694cb4aa0c113e76f02a6a5081_42_1.png)


    ### Sun Microsystems OpenDocument Format (ODF) Plugin for Microsoft Office

    Monopolists need tools to help them. You can now download Sun''s plugin for Microsoft
    Office 2003 which will allow for seamless two-way conversion of Word documents
    to ODF. At the time of this writing, support for spreadsheets and presentations
    is done in April 2007. Isis claimed to be fully transparent to the user. This
    might be the end of the beginning of the Office stranglehold?


    sun.com/openoffice


    ### BakBone Software''s NetVault: Backup AMP for MySQL

    Database admins should note that BakBone has released the new NetVault: Backup
    AMP for MySQL, 3.0. The solution provides low-complexity deployment and protection
    of the MySQL Enterprise and community editions, consolidated and recovery from
    a common administrative UI that allows users to set up, configure and a wide range
    of backup policies and scenarios. Additional highlights include incremental and
    differential backups while are online and accessible; a common UI allows multiple
    storage engines; consolidation of multiple storage engines into a single job;
    and protection down to table level. The product is a MySQL Enterprise Gold Certification
    solution.


    www.bakbone.com


