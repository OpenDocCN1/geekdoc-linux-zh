    ![](img/6be405694cb4aa0c113e76f02a6a5081_18_2.png)


    # ELiNOS 工业级 Linux


    ELiNOS 工业级 Linux - 现成的嵌入式 Linux。

    嵌入式 Linux 以其丰富的特性和免版税的使用，在过去几年中获得了了巨大增长。但质量保证、可重现性和版本稳定性是项目经理一直面临的挑战。这导致了“自制还是购买？”的问题。ELiNOS
    工业级 Linux 给出了答案。


    ## ELiNOS 工业级 Linux 一览：多功能嵌入式 Linux


    - 工业级

    - 支持 PowerPC, x86, MIPS, ARM, XScale

    - 内核版本 2.6.15 和 2.4.31

    - 应用开发

    - 集成开发环境 (IDE)

    - 快速启动配置编辑器

    - 开箱即用体验

    - 服务与支持

    - 点对开发和生命周期支持


    访问我们的网站：


    ![](img/6be405694cb4aa0c113e76f02a6a5081_18_3.png)


    # KRUU 模型-开源无线电台


    通过光纤的块命令控制 (SBC) 或通过网络文件系统 (NFS) 的基于对象的存储设备 (OSD)。


    图 1 所示的网络服务器与存储器之间的“控制”协议也是显而易见的。例如，它可以是基于 SCSI 的操作系统。


    控制协议与在处的数据传输协议为供应商提供了灵活性。它允许他们向 NFS 中添加 VFS 以提高性能、提高容错能力或他们想要的任何功能，只要他们遵循 NFSv4
    即可。


    KRUU 是一个新的“低功率”广播社区 FM 电台，旨在通过非商业性节目服务当地地区（www.fcc.gov/media/lfm）。正如 FCC 所说，“100
    瓦 LFM 台站的大致范围是5.6 公里（半径 3.5 英里）。在 KRUU，这很好覆盖了爱荷华州的 Fairlawn 小镇。然而，该电台受到物理限制的阻碍。我在圣巴巴拉听它，它是我喜欢的电台之一。电台的“关于”介绍了为什么它如此相关且关键。


    KRUU 的承诺还延伸到了现有的软件和系统。在我们使用的所有计算中，我们使用免费开源软件（有时我们也使用免费软件）。“免费”是指访问的自由，而不是底层源代码的全部代价，我们将我们所有的编辑、更改和增加回馈以共享。我们在成本范围之外的各种项目中使用免费软件。KRUU
    喜欢利用当地知识来识别不加限制或许可的系统。为了使用这些，我们使用“共享拷贝”（copyleft）或受 Creative Commons 许可的开放内容软件。


    # 避免供应商锁定


    一个自然的问题随之而产生：“PFSv4 标准 OSD 如何避免供应商锁定？”PFS 的主要方面之一是，无论底层存储架构如何，它都带有一个文件系统客户端。特定的存储系统只需要一个层即可。


    并行 NFS (Parallel NFS) 对供应商来说也运行良好，因为它允许他们使用任何各种操作系统或专有文件系统客户端来存储他们的工作。NFSv4 将成为标准，只要操作系统拥有提供驱动程序的客户端，客户端就应该能够与任何操作系统工作。编写驱动程序通常比为各种操作系统完成一个完整的客户端堆栈要容易得多。


    如果你有一个来自某个存储供应商的当前文件系统，如果该供应商不支持它，OSD 还能工作吗？NFS 速度比 PFS 慢，但随着经验的积累和 PFSv4 客户端的完善，性能将会提高。更重要的是，PFS
    允许你以与原始方法相同的性能挂载文件系统。如果你想扩展存储空间，可以使用任何为 PFSv4 提供驱动程序的供应商。这允许你现有的客户端访问新的存储系统，就像你的计算机访问不同供应商的
    NFS 服务器一样，使用与你的操作系统兼容的文件系统客户端。


    “开放”一词贯穿于 KRUU 的播放和价值观之中。每隔 5-6 天，我们就会听到“开源电台时刻”，而这只是冰山一角。对于“通过 KRUU 听节目”，它在线播放
    OSD，我不知道任何比这个小电台更致力于分享免费和开源价值观的系统。


    - DOC SERACS


    # 他们是这样说的


    我认为，让技术不再被囚禁的小说比被这种离开而解放的女性感觉更好。

    - Kurt Vonnegut, *A Without Man* (Random House, 2005)


    真理产生于对话中，而不是孤独中……我们这些保护文化习俗的人，让我们问问自己我们正在试图保护什么。为了利益，排斥工具（版权术语、数字版权管理等）一直被用来防止、增强和丰富；这关乎金钱。但对于我们这些坚持的人来说，金钱是最微不足道的。文化公社意味着保护人类生存的方式。

    - Lewis-Hik，收录于 Kent Berkeley, 2003


    这首歌在美国受版权保护，版权号 #154088，为期两年，任何可以在未经许可的情况下演唱它的人都是我们事业的极好朋友，我们无法拒绝许可。写下它是免费的。唱给你听是免费的。约唱它是免费的。这就是我们想要做的全部。

    - Woody Guthrie, www.publicknowledge.org/resources/quotes


    # 结语


    并行 NFS 尚未成为标准的道路上。它目前处于原型阶段，各种参与者正在测试互操作性。我希望在 2007 年它会被采纳为新的 NFSv4 标准，并在许多操作系统中使用。


    如果你现在想尝试 PFS，信息技术中心 (CIT) 有一些使用 PVFS2 进行存储的 Linux 2 内内核补丁（www.cit.umich.edu/projects/acsi/linux/）。


    - LARRY JONES


    我重复了其他可能对你有帮助的事情。我的工作是为了那些成为歌德之名的事物。

    - Johann Wolfgang Goethe, www.publicknowledge.org


    在最低阶级中，知识的保护对于一个国家内部的财产更重要。

    - John Adams, www.publicknowledge.org/resources/quote


    ![](img/6be405694cb4aa0c113e76f02a6a5081_19_0)


    # 领先行业的服务器设备


    ![](img/6be405694cb4aa0c113e76f02a6a5081_20_0)


