    A conversation with Michael Collins about what''s up with the Manitoba Media Centre.


    DOC SEARS


    **Sometimes I like to get back** to Upfront stories that deserve more than the
    few inches they get the first time around. Such was with the news that the Manitoba
    Media Centre man up to a new Open Source Editing Environment, Innovation, and
    Production Research Facility in Winnipeg, is already funded for seven figures
    with plans to pump up to eight [Dee''s story in LMR March 2007 Upfront]. It got
    to think... "Why much more? And, Manitoba?


    So, I began corresponding with Michael Collins, the CEO of Linux Media Arts (LMA)
    and the prime mover behind Robert''s coverage of Winnipeg. LMR readers who met
    him at the NAB (National Association of Broadcasters) show, which Michael said,
    "Our goal is to make the premiere editing and media production platform of the
    world, largely using open source software" https://www.linuxjournal.com/article/47843.


    The next year, Robert released LMA''s first premiere non-linear editor (NLE) -
    a product that has been seeded by Cinelerara (cineler.org), a Linux-based 64-bit
    open system, which at last, had 700,000 search results on Google. While this was
    a Manitoba Map on its own it seemed too tempting to ignore. So, I decided to interview
    Michael, with interesting results. Read on.


    A four-day trip to meet with Winnipeg and José, who we met with his colleagues
    from business and government. José was so respected in Manitoba business and political
    circles, took me days to meet with numerous people from the public and private
    sectors. We first met with Suzuki of Suzuki Development of Manitoba, the economic
    development agency for the city of Winnipeg, who was keeping in on us and asked
    it to plan my itinerary for the meetings in our first visit and future visits.
    We also met Wakefield, who is the Deputy Minister for Science, Technology, Energy
    and Innovation Government of Manitoba.


    I laid out a vision for a worldwide center for open source media technologies.
    John Clarkson was very receptive, and then he surprised me at the end of the meeting
    by mentioning that the Premier of Manitoba, Gary Do, was very interested in our
    vision companies based in California. The Premier was scheduled for a trip to
    Los Angeles in a few weeks and we met later in December.


    A few weeks later, I got an e-mail from John who wanted the Premier to visit our
    offices and wanted to present our vision to him. So, Mr Door came accompanied
    by John Clarkson, and I laid out at the hotel center how the project could take
    advantage of the professional engineering population and the supportive community
    business in Manitoba.


    We had a later, back later when the Premier wanted to go forward with the plan.
    So, I took two more trips to refine the project and to make plans for its essentials.
    José and I were then interested in meeting with the interest, and to discuss technical
    and financial and professional requirements for building a facility from scratch.


    L.J.: What got the Manitoba Media centre going?


    MC: The concept for Open Source and Development Facility in Manitoba was first
    considered three years after the ABC show in Toronto. I made plans to meet up
    with a colleague from Winnipeg whom I had been collaborating remotely in the design
    of a high-definition video studio. José is an experienced systems engineer with
    a PhD in Electrical and Computer Engineering and an MBA. José has a good understanding
    of the business of media engineering and open source, and he was very well interested
    in Manitoba''s technological and financial resources and his highly stable professional——something
    lacking in the R-D climate, and it felt like Manitoba might be the perfect kind,
    and that in the back of my mind we were moving forward with our vision.


    Then, business prospects rose quite dramatically, and we felt the need for R&D.
    So, last spring, I called up with José to discuss an R&D facility for LMA in Winnipeg.
    Then, I went to Winnipeg in August for a four-day trip to meet with Winnipeg and
    José, who we met with his colleagues from business and government.


    L.J.: Can you tell us who are the investors?


    MC: I can say that Linux Media Arts is investing $5 million in current revenues
    to join the jump-development investments. The rest are coming from a combination
    of investments from the provinces and regional investment in Manitoba. The multillion-dollar
    investment will enable us to engage in business opportunities and relationships
    that were not available to us.


    L.J.: What projects are you starting out with?


    MC: LMA has a number of complex systems architecture projects in house right now.
    We will be hiring employees and contributors of the MMC to support key technology
    development. Additionally, the MMC will support technical development where markets
    currently exist and not being properly supported by the industry, in our opinion.


    In addition, we have plans to build a multimedia production centre for the Misispawak
    Cree Nation in Manitoba. Users will be able to record and produce programming
    for the Internet, cable and satellite distribution. Winnipeg in fall 2007.


    We are also assisting in the development of a curriculum based on open-source
    media applications for the River College in Winnipeg. We are collaborating with
    the University of Manitoba Media Centre as well.


    ## L.J.: What are some of those markets?


    MMC: Our focus is on larger markets such as broadcasting and film production.
    systems engineers, particularly in Asia. Wherever people want open-source multimedia
    to be to a professional standard, we can help. Our engineering staff is very experienced.
    We have PhDs with qualifications from the largest media and media production companies.


    ## L.J.: What are some of the technologies you are working on?


    MC: We are working on high-definition video editing, de-interlacing, and color
    correction. We are also looking at open-source codecs and metadata management
    tools.


    ## L.J.: What do you expect to see in the future?


    MMC: We expect to see open-source tools becoming more accessible and professional-grade.
    We also hope to see more collaboration between developers and the end-user community.

