- md: "\n# QUICK TAKES\n\n## Zimbra Collaboration Suite, Version 4.5\n\nZimbra exploits\
    \ Ajax for a compelling Web experience. MARCEL GAGNÉ\n\nE-mail is the backbone\
    \ of modern corporate communication, and frankly, it has been for a long time.\
    \ With any tool that gets this much out features so prominently in any networked,\
    \ e-mail has demonstrated a history of limitations. To improve the experience,\
    \ software developers have introduced obvious functions, such as calendar, simple\
    \ mailing lists and threads, creating what is popularly referred to as contact\
    \ management system. Enterprise simplifies the creation of groups, or collaboration\
    \ tools, allowing those contact lists to be shared among members of an organization.\
    \ Administering complex policies on thousands of people creates its own set of\
    \ problems. As increasingly users noticed that they were now in a sea of ways,\
    \ always trying to reach for pieces of information that help them stay afloat.\n\
    \nZimbra's raison is to improve the e-mail experience by providing a suite that\
    \ simplifies and enhances the experience, which is unique without short and intuitive\
    \ retrieve.\n\nThe Zimbra Collaboration Suite F1 is a powerful, scalable application,\
    \ suitable for small to medium to very large enterprises. It can be deployed in\
    \ a high-availability, clustered environment where it can serve huge numbers of\
    \ clients, and with ease of maintenance. Zimbra serves up 100,000 users, while\
    \ the University of Toronto is in the tens of thousands. Zimbra's customers are\
    \ varied (for who offer Zimbra as a service, to businesses, universities, government\
    \ offices and nonprofits) and provide content.\n\nI've had a few weeks with the\
    \ Zimbra Collaboration Suite,\n\n### Note:\n\nWhen speaking with Zimbra, I asked\
    \ about the service model where customers sign up for Zimbra e-mail accounts,\
    \ and where accounts are ad-supported or value-add is provided through Zimbra\
    \ extensions. Zimbra informed me that 80% of Zimbra installations are on premise\
    \ deployments. The company doesn't believe that e-mail is going to a hosted with\
    \ CRM.\n\nAnd I, overall, very impressed. That said, nothing is perfect—more details\
    \ I go on.\n\n## What Does Zimbra Do?\n\nThe Zimbra Collaboration Suite belongs\
    \ to a class of network applications we've come to call group—an intelligent collection\
    \ of CRM, of which e-mail is the core, usually provided through a Web interface.\
    \ In addition to e-mail, Zimbra messaging server serves group calendars and contact\
    \ management tools. Zimbra is both a powerful and helpful application that includes,\
    \ LDAP, Apache and more. Zimbra includes some extensions, such as zimlets (on\
    \ these later), and enterprise mashups allow users to interact naturally with\
    \ information embedded in their e-messages, so they can easily use it for various\
    \ applications, including third-party applications, such as a purchasing system.\n\
    \nIt's possible to talk about like Zimbra without comparing to Microsoft Exchange,\
    \ I answer the obvious questions here. Zimbra is an impressive replacement for\
    \ Microsoft Exchange. Zimbra offers more than what Outlook is able to offer (Lotus\
    \ Notes integration also available). Available clients are free and supported,\
    \ that it works with all Outlook e-mail, contacts and calendar functions (API\
    \ sync, is only available with the Zimbra Network Edition). If you happen to be\
    \ on any other mail client, such as Thunderbird or Eotta, you can continue to\
    \ start with Zimbra's impressive browser-based Ajax client, which might say good\
    \ for your old client software. Zimbra also supports numbers of mobile devices,\
    \ such as this iPhone, Blackberry.\n\nAs the above paragraph hints, Zimbra is\
    \ valuable in different flavors, including a community-supported Open Source Edition\
    \ and a commercially supported Network Edition.\n\n## Working with Zimbra\n\n\
    Zimbra is a Web application that doesn't feel like a Web application.\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_43_0.png)\n\
    \nFigure 1. The Zimbra Collaboration Suite, Ajax Client View\n\n42 | may 2007\
    \ | www.linuxjournal.com\n\n![](img/6be405694cb4aa0c113e76f02a6a5081_44_0.png)\n\
    \ntime, and then to get back to your email. Zambia recognizes inside your e-messages,\
    \ as a phone number or a date. Figure 3 shows looking at an e-message in which\
    \ the sender is asking for a free date. Zambia recognizes that this is a date\
    \ and not of my availability for that time.\n\nFigure 2. Zimbra incorporates an\
    \ easy-to-use and powerful shared calendar application that is integrated with\
    \ the rest of the suite.\n\nSeveral key features take Ajax design to a very advanced\
    \ destination. For instance, Zimbra provides numerous keyboard shortcuts.\n\n\
    Let me give an example. With most Web applications, you would be able to move\
    \ a message (or a batch of messages) by selecting each message with a click box\
    \ beside the message, finding the Delete button and clicking to drag. Zimbra works\
    \ the way you expect your desktop application to work. Select group of messages\
    \ using the keyboard (Shift, Ctrl-click, or Ctrl-click), and then press the Delete\
    \ key.\n\nIn some other web applications, you have to move a message by selecting\
    \ them from a drop-down list, clicking on “To” button, clicking the destination\
    \ and then clicking Move. Zimbra users select their messages and drag them into\
    \ the appropriate folder--like you would do in your email client. The mapping\
    \ is so natural that after a while you feel you are working with a familiar application.\n\
    \nFigure 3. No need to switch from your e-mail to calendar. Zambia provides the\
    \ information you need.\n\nIf the time is free, there's no need to switch to calendar\
