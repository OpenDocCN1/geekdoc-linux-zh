    \ the session ID, making it valid, then returns HTML code for the main menu. When\
    \ the second request succeeds, the handlerManager clears the success result (which\
    \ we do after effort) and inserts the main menu. On success, cookies can be set.\n\
    \n```javascript\n// another AJAX request\n// (passing session id), this time to\
    \ get\n// the main menu screen\nd2 = MochiKit.Async.simpleHTTPRequest(\n  cgMainMenuLocation(sessionID);\n\
    d2.ajaxCallback(handlerServerManage, sessionID);\nd2.errorback(handlerServerError);\n\
    \nelse {\n  logError(failMsg);\n}\n// end handlerServer_Login\n}\n```\n\nfunction\
    \ handlerServerError() {}\n\n```javascript\nfunction handlerServerManage(sessionID,\
    \ res) {\n// get rid of our login controls - we're very\n// validated by this\
    \ point\nslideUp(getElement(\"loginID\"));\n// our responseText will be the HTML\
    \ for\n// \"main menu\"\nwhereTo = getElement(\"Result\");\ninnerHTML = res.responseText;\n\
    MochiKit.Visual.appear(whereTo, (delay: 1));\n}\n```\n\n```javascript\ncreateCookie(\"\
    sessionID\", sessionID, 1);\n```\n\n```javascript\ndocument.getElementById(\"\
    waitMsg\").innerHTML = \"\";\n// Cookie value = \" + readCookie(\"sessionID\"\
    );\n// end handlerServer_Manage\n```\n\nfunction handlerServerLogin(res) {\n\n\
    ```javascript\ndocument.getElementById(\"waitMsg\").innerHTML = \"\";\n// no more\
    \ waiting required!\n// res.responseText will contain our res CGI\n// returns\
