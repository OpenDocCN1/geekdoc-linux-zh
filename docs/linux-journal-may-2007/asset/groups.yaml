    \ other direction as well. If you try to drop a row that a foreign key points\
    \ to, PostgreSQL will refuse the drop unless you first delete the key rows. You\
    \ can adjust the rules for these constraints by using the ON UPDATE or ON DELETE\
    \ clause on the foreign key.\n\n# Other Features\n\nThis is list of features to\
    \ use of. And that is part of the magic of PostgreSQL—it's straightforward and\
    \ easy to use, but you may also redefine and extend functionality with your own\
    \ code. The built-in operators, along with the flexible ways in which they can\
    \ be combined and further enhanced with your own functions and definitions, make\
    \ it a powerful combination.\n\nFor example, one of my favorite features is the\
    \ use of subsects without having a value. If you have someone's email address,\
