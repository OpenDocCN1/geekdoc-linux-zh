    LJ: How will the development communities work? Who will keep the repositories?


    MC: Like other communities, these will attract contributors who have a stake in
    what the code will do. And, in addition to the professionals who are working on
    the code as well. Both the code and the repositories will be located on our servers
    in Winnipeg and more elsewhere.


    MC: If it is, how then do we want to do it release strictly from the perspective
