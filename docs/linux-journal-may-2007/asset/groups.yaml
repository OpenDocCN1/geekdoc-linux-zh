    # fknopw Configuration


    Confident that iptables is protecting the local network with a Draconian, it is
    time to configure the fknopw server daemon (fknopw) on the spa server. The file
    is /etc/fknopw.conf which controls configuration parameters like the interface
    on which traffic is routed, the e-mail address and alert filter to which fknopw
    sends notifications about the SPA packets. By default, fknopw sends SPA packets
    over UDP port 62201, so the packet filter settings in /etc/fknopw.conf should
    be set to up-port 62201.


    All of the GPG-* can be omitted if there is a KEY variable and vice versa. The
    KEY variable defines a shared key between the fknopw client and server. This key
    is used to encrypt/decrypt the SPA packet with a symmetric block cipher (such
    as AES) and also identifies the local server GPG ID. This key is used by the fknopw
    client to decrypt SPA packets via an encryption shortcut or by GPG (as the Email
    client).


    The /etc/fknopw/access.conf file is the most important configuration file-it manages
    the encryption and access controls used to validate SPA packets from fknopw clients.
    The following example uses a wildcard to allow SPA packets from the following
    IP addresses:


    GPG_DECRYPT_PW password associated with this password is placed within the access.conf
    file text. It is not recommended to use a wildcard for GPG keys for the server;
    a dedicated key should be used for the purpose of decrypting SPA packets. The
    fknopw clients sign SPA packets with a GPG key on the local key, and the password
    is stored in the access.conf file on the server in clear text (as we will see
    later). However, any GPG key can be used by the fknopw client; any valid key could
    be used for encrypting sensitive e-mail communications, for example.


    ```

    # spa_server: cat /etc/fknopw/access.conf

    SOURCE: ANY

    OPEN_PORTS: tcp/22

    FW_TIMEOUT: 0

    KEY: LBptr7ga

    GPG_DECRYPT_Pw: ABC1234

    GPG_DECRYPT_Pw: p2at1lc30p

    GPG_HOME_DIR: /root/gnupg;

    ```


    The SOURCE variable defines the IP addresses from which fknopw accepts SPA packets.
    The ANY value is a wildcard to allow any IP address, but it can be restricted
    to specific IP addresses or subnets, and comma-separated lists are supported (for
    example, 192.168.1.0/24, 1.1.1.1). The OPEN_PORTS variable informs fknopw about
    the set of ports that should be opened when receiving a valid SPA packet; in this
    case, fknopw will open port 22.


    As shown above, fknopw can be configured to allow the client to set the set of
    ports by setting it to FW_ACCESS_TIMEOUT, the length of time that an ACCEPT rule
    is added to the iptables policies to allow the traffic defined by the firewall.
    Because the rule is temporary, iptables script makes use of connection tracking
    capabilities provided by Netfilter, an SSH connection will remain established
    until the ACCEPT rule is deleted by fknopw.


