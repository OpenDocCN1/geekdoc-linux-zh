    settings.xml

    META-INF/manifest.xml


    %

    Good looks. Save the list in a shell variable—we''ll use F

    (for files):


    ```

    $ F -f ex1.odf | sed -n ''s/\\[([0-9]*\) \(.*)\).*/\1/p''

    ```


    With settled, the result is which file to modify? The

    out, find the file or files containing the word quotes,

    appeared in the document. We will unpack each odf into an entry

    and ask grep, remember to check files in subdirectories where:


