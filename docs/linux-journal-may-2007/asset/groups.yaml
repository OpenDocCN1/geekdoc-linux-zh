    ## Protecting SSH Servers with Single Packet Authorization


    ### Lock down to SSH with Single Packet Authorization. MICHAEL RASH


    **Last month**, in the first part of this two-part series, I described the technology
    behind the next generation of passive authentication technologies called Single
    Packet Authorization (SPA). This approach gets away and concentrates on the practical
    application of SPA with fknop and iptables to protect SSH from reconnaissance
    and attack. With this setup on a Linux system, no one will be able to tell that
    SSH is even listening unless an authenticated client with the secret key sends
    a packet.


    To begin, we require some information about configuration and network architecture.
    This assumes you have installed the latest version of fknop and where ssh is running.
    You can download fknop from www.fwwall.org/fknop and install it from the source
    archive by running install.sh script or via the rpm for RPM-based distributions.


    The tracking facilities by Netfilter to be kept state in the iptables policy.
    The end result is that connections initiated through the firewall (the FORWARD
    chain) and to the firewall (the INPUT chain) remain open until ACCEPT rules allow
    packets to be kept connections then established (such as TCP acknowledgments and
    the like). The iptables policy is built with the following firewall sh script:


    ## Network Architecture


    The basic network described in Figure 1 illustrates our setup. The fknop client
    is expected on the hosted spa-client (15.1.1.1), and the fknop server (16.2.2.2).
    A malicious attacker is attached to the spa-server (18.3.3.3), which is able to
    sniff traffic between the spa-client and ssh-server systems.


    ```bash

    [spa_server]# cat firewall.sh

    #!/bin/sh

    iptables=/sbin/iptables

    iptables -F

    iptables -t nat

    iptables -X

    iptables -INPUT -m state --ESTABLISHED -j ACCEPT

    iptables -FORWARD -m state --ESTABLISHED -j ACCEPT

    iptables -t -A POSTROUTING -s 192.168.1.0/24 -j MASQUERADE

    iptables -INPUT -i lo -j LOG --log-prefix -j DROP

    ```


    Figure 1. Sample Architecture Where You Use SPA to protect SSH Communications


    ## Default-drop iptables Policy


    The spa-client has the IP address 15.1.1.1, and the spa-server has the IP address
    16.2.2.2. On the spa-server system, iptables is configured to provide basic connectivity
    for the internal network (192.168.1.0/24) and drop all traffic (the iptables logs
    and targets) from the external network to connect to it. It is important to note
    that the firewall does not allow any incoming services (including SSH) under an
    immer scan. Any deployment of iptables for a real network would be significantly
    more complicated. One important feature to note, however, is that the connection
    to


    ```bash

    [spa_client]# nmap -p tcp -o eth0 16.2.2.2

    ```


    Starting Map 4.1 (http://www.inetsec.org/map/)

    Interested ports on 16.2.2.2:

    | PORT | STATE | SERVICE |

    | :--- | :--- | :--- |

    | 22/tcp | filtered | ssh |


    Nmap finished: 1 IP address (1 up) scanned in 12.009 seconds


    22 | may 2007 | linuxjournal.org


    As expected, iptables blocks all attempts to communicate with SSH, and the remaining
    ports (both TCP and UDP) are simply protected by the iptables policies. It does
    not matter if an attacker has a zero-day exploit for the particular version of
    OpenSSH that is deployed on the spa server system; all attempts to communicate
    the stack are blocked by iptables.


    description of spa packets. This article illustrates the usage of symmetric and
    asymmetric ciphers, but only one encryption is required by fknop.


    ## fknop Configuration


    Confident that iptables is protecting the local network with a Draconian, it is
    time to configure the fknop server daemon (fknop) on the spa server. The file
    is /etc/fknop.conf which controls configuration parameters like the interface
    on which traffic is routed, the e-mail address and alert filter to which fknop
    sends notifications about the SPA packets. By default, fknop sends SPA packets
    over UDP port 62201, so the packet filter settings in /etc/fknop.conf should be
    set to up-port 62201.


    All of the GPG-* can be omitted if there is a KEY variable and vice versa. The
    KEY variable defines a shared key between the fknop client and server. This key
    is used to encrypt/decrypt the SPA packet with a symmetric block cipher (such
    as AES) and also identifies the local server GPG ID. This key is used by the fknop
    client to decrypt SPA packets via an encryption shortcut or by GPG (as the Email
    client).


    The /etc/fknop/access.conf file is the most important configuration file-it manages
    the encryption and access controls used to validate SPA packets from fknop clients.
    The following example uses a wildcard to allow SPA packets from the following
    IP addresses:


    GPG_DECRYPT_PW password associated with this password is placed within the access.conf
    file text. It is not recommended to use a wildcard for GPG keys for the server;
    a dedicated key should be used for the purpose of decrypting SPA packets. The
    fknop client sign SPA packets with a GPG key, and the password is stored in access.conf
    file on the server in clear text (as we will see later). However, any GPG key
    can be used for encrypting e-mail communications, for example.


    ```conf

    # spa_server: cat /etc/fknop/access.conf

    SOURCE: ANY

    OPEN_PORTS: tcp/22

    FW_TIMEOUT: 0

    KEY: ABC1234

    GPG_DECRYPT_Pw: p2at1lc0

    GPG_HOME_DIR: /root/fknop/

    ```


    The SOURCE variable defines the IP addresses from which fknop accepts packets.
    The ANY value is a wildcard to allow any IP address, but it can be restricted
    to specific IP addresses or subnets, and comma-separated lists are supported (for
    example, 192.168.1.0/24, 1.1.1.1). OPEN_PORTS variable informs fknop about the
    set of ports that should be opened when receiving a valid SPA packet; in this
    case, fknop will open port 22 to allow the set of ports by setting it to FW_TIMEOUT,
    the length of time that an ACCEPT rule is added to the iptables policies to allow
    the traffic defined by the firewall. Because the rule is temporary, iptables makes
    use of connection tracking capabilities provided by Netfilter, the connection
    will remain established until the ACCEPT rule is deleted by fknop.


    The remaining variables define parameters for encryption and the fknop public
    key must be signed with a private key specified by the GPG_REMOTE_ID variable.
    This allows fknop to trust the set of people who can access secure SSH (in our
    case) via cryptography mechanisms. For generating GPG keys for fknop you can be
    found at www.cipher.org/fknop/getinfo.html.


    With the /etc/fknop.conf file built, it is time to start fknop on the spa system
    and put it to work for you:


    ```bash

    spa_server/*etc/init.d/fknop

    Starting fknop ...

    ```


    ## SPA via Symmetric Encryption


    On the client system, we use to build a spa packet sent via fknop and is then
    on its way to the spa system. We access SSH, and the -a argument ensures the desired
    access within the spa packet. The -v argument reveals the IP address of the client
    connecting to the system (if this is the spa packet sent by a client daemon, the
    -k argument is the argument to the destination server, and -v runs in verbose
    mode we can see the raw packet data:


    ```bash

    spa_client fknop -a tcp/22 -m 16.2.2.2

    Starting fknop client

    Resolving IP via: http://www.whatismip.com/

    External gateway: 15.1.1.1.

    ```


    - Enter an encryption key. This key must match a key in the /etc/fknop/access.conf
    on the remote system.

    Encryption Key:


    - Building encrypted single-packet authorization-SPA message.

    - Packet fields:

    Random data: 76fa880827809123

    Username: mbr

    Timestamp: 11713745

    Version: 1.0.1

    Action: (access mode)

    Access: 15.1.1.1/tcp/22

    MDS sum: zykXgoAsVmyBYTOFC


    - Packet data:


    ```bash

    Sending 180 message to 16.2.2.2 over udp/62201-...

    U2FjG9vL2b3Vz6Y6vCFW-J1JGfeWJ=QY2qYYqI6p6S2W0VnY7/V6U6vU6gs4-X4Y3E6I6vQp/G81-g85+V+4UQjvvQ99UvJvduYvveXjAnloZncZocb82b8

    ```


    As you can see from the packet data above, the spa packet is a completely unintelligible
    blob of encrypted data. On the spa_server system, following syslog message is
    generated that an ACCEPT packet has been received by the spa server. The source
    IP is put in the spa packet which must be signed with a private key specified
    by the fknop client. In this case, the SPA was not spoofed, so the real source
    address and the address embedded in the spa packet match. Spa packets can be spoofed
    by fknop with the --spoof-src command-line argument (requires root):


    ```

    Feb 10 15:54 spa_server: received valid fknop-encrypted packet from 15.1.1.1:
    remote user mbr

    Feb 10 15:54 spa_server: fknopd: adding FKNOP_ACCEPT ACCEPT rule for 15.1.1.1
    -- tcp/22 (30 seconds)

    ```


    So, after 30 seconds expires, fknop (a daemon for deleting ipt rules) deletes
    the ACCEPT rule:


    ```

    Feb 12 17:52 spa_server: removed FKNOP_ACCEPT ACCEPT rule for 15.1.1.1 -- tcp/22

    30 second timeout

    ```


    Our session has established To use GPG to encrypt and send a spa packet, you use
    the fknop command. In this case, the ID of fknop is signed with the command line
    with the --gpg-recipient argument, and the key ID used to send the spa packet
    is given with --gpg-signing-key (the argument below has been observed):


    ```bash

    [spa_client] fknop -a tcp/22 --gpg-recipient ABC1234 \

    --gpg-signing-key 56780def -w -k 16.2.2.2

    ```


    - Packet data:

    ```bash

    Sending 180 message to 16.2.2.2 over udp/62201-...

    U2FjG9vL2b3Vz6Y6vCFW-J1JGfeWJ=QY2qYYqI6p6S2W0VnY7/V6U6vU6gs4-X4Y3E6I6vQp/G81-

    g85+V+4UQjvvQ99UvJvduYvveXjAnloZncZocb82b8

    ```


    As you can len from the packet data above, the spa packet has increased more than
    1,000 bytes, whereas it was only 150 for Rijland. This is because the length of
    GPG keys (2,048 bits) will tend to increase the size of the packet. There is no
    correspondence between the sense of clear-text and cipher-data as in blocks such
    as Rijland.


    Again, on the spa_server, fknopd adds the ACCEPT rule for this time packet encrypted
    with GPG, and a value required for the required key ID 56780def is:


    ```

    Feb 10 14:38:26 spa_server fknopd: received valid GPG

    encrypted packet with required key ID: "56780def"

    ```


