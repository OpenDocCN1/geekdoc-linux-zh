    ## Thwarting a Replay Attack


    Suppose the SPA packet from the first example was sniffed by an attacker. By a
    crafty individual on the system labelled attack in the network diagram in Figure
    1. The SPA packet can always be placed on the wire in effort to gain some access
    as this packet - this is known as a replay attack. There are several ways to capture
    the packet data and reply it. One of the most common is to use tcpdump to write
    a file in this case (tcpdump -i eth0 -w replay.pcap) and then use tcplay (tcplay
    syn.fin/rac) to copy the SPA packet back onto it. Another method, if the packet
    has been captured, is to use the echo command again,


    ```

    [attacker j6 "UFSzdGdVKx1+Bv2Yj52gvVcu=jUOKF"

    we2qhdJ2riSpZtn0VvT86a5v1xYNt33B81E1|

    nvCcCp07Y6G8sEs8AvN10QhW99JduseVv -

    DxmxH3mHci02tcqcZ8bQ8A -u 16.2.2.2 26.2 1

    ```


