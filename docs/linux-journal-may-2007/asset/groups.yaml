  mdcn: "\n\n# MochiKiit 实例\n\n通过真实生活示例对 MochiKiit 进行概述。\n\n设计师们梦寐以求的交互式网页终于出现了——这些能够响应用户命令的界面，且页面极少重新加载。这一切及更多功能可以通过\
