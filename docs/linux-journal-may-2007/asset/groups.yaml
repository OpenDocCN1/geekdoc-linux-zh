- md: "\n# Writing Web Applications with Web Services and Ajax\n\n## Ajax primer with\
    \ Perl and PostgreSQL.\n\n**IF YOU'VE DONE** new development at a database, you've\
    \ no doubt heard the buzz around Web Services and Ajax. The industry hype is so\
    \ prevalent that you'd almost think people were talking about the next Microsoft\
    \ operating system. Web services are two technologies that allow developers to\
    \ create more interactive web apps, as well as make the development easier and\
    \ less error-prone.\n\nNow that I've said that all, let's take some time to outline\
    \ what we mean by 'Web Services and Ajax'.\n\nA web service is a program that\
    \ is accessible over the Internet by a given program and provides a specific service,\
    \ such as searching a library collection or getting bidding data from eBay. We're\
    \ not talking about a full-fledged application, rather a Web-based Application\
    \ Programming Interface (API) that can be called by a given service to perform\
    \ needed function. Fortunately, the results of the call are returned in a format\
    \ that any calling program can easily parse.\n\nWhen people discuss web services,\
    \ they often mention using JSON, REST, SOAP or XML. These are simple examples\
    \ of protocols used for calling a Web Service. Familiar with these protocols lets\
    \ you use many Web Services provided by the likes of Amazon, Google and eBay.\
    \ However, for my personal development, I've found these to be a bit awful.\n\n\
    Another way allows a Web page to make calls to the database without refreshing\
    \ the page or using hidden frames. For example, if a user changes the value of\
    \ a form field, the Web page could tell the server to make a change to a database,\
    \ without refreshing the page, as would be needed in a standard web app from the\
    \ user's perspective. The update just happens.\n\nIn this article, I outline a\
    \ set of very powerful Web Services that perform specific functions on a database.\
    \ The calls will be done via Ajax. Eventually, we're going to build a simple web\
    \ contact management program that stores a person's first name, last name and\
    \ phone number. We'll move it up and down through the database, make additions\
    \ and corrections and delete the records. The neat thing is that once the page\
    \ is initially loaded, we won't have to refresh it again, even when we make changes.\n\
    \nBefore we get started, we'll need to have a table in a database to store the\
    \ information.\n\n> List 1. Preparing a PostgreSQL Sequence and Table for the\
    \ Project\n\n```\ncreate sequence contacts_id_seq;\n\ncreate table contacts (\n\
    \  id integer default next('contacts_id_seq') not null,\n  first varchar(20),\n\
    \  last varchar(20),\n  phone varchar(20)\n);\n```\n\nI happen to use PostgreSQL\
    \ as my preferred DBMS. For our simple application, we need only one table (List\
    \ 1). The snippet of List 1 contains a sequence and a table. The table structure\
    \ is pretty straightforward for our application. Only one thing is worth mentioning\
    \ in the first build, when we insert a record into our table, the id field is\
    \ set to the next number in the contacts_id_seq sequence. The result is a unique\
    \ integer number that can be used to locate.\n\nRecord Number:\nFirst:\nLast:\n\
    Phone:\n\n[New] [Next]\n\nFigure 1. The No-Frills Web Page for This Sample Application\n\
    \nThe neat thing is that once the page is initially loaded, we won't have to refresh\
    \ it again, even when we make changes.\n\n```html\n<html>\n<head>\n  <title>Contact\
    \ Application</title>\n  <script src=\"http://contacts.js\"></script>\n</head>\n\
    <body>\n  <form method=\"POST\" name=\"main\">\n    <input type=\"button\" name=\"\
    New\" onclick=\"insert_record();\" />\n    <input type=\"button\" name=\"delete\"\
    \ onclick=\"delete_record(main.id);\" />\n    <br>Record Number: <input id=\"\
    id\" name=\"id\">\n    <br>First: <input id=\"id\" name=\"first\" onchange=\"\
    update_record(main.id);\" value=\"first.main.value\";\n    <br>Last: <input id=\"\
    id\" name=\"last\" onchange=\"update_record(main.id);\" value=\"last.main.value\"\
    ;\n    <br>Phone: <input id=\"id\" name=\"phone\" onchange=\"update_record(main.id);\"\
    \ value=\"phone.main.value\";\n    <br><input type=\"button\" name=\"Previous\"\
    \ onclick=\"select_record(main.id);\" />\n    <input type=\"button\" name=\"Next\"\
    \ onclick=\"select_record(Number(main.id) + 1);\" />\n  </form>\n</body>\n</html>\n\
    ```\n\nThis simply calls a JavaScript function called insert_record when a user\
    \ presses the button. The Delete, Previous and Next buttons work similarly. The\
    \ magic is in the JavaScript. Let's look at the JavaScript first (List 1).\n\n\
    insert_record() JavaScript function, which is called when a user presses the button,\
    \ is the simplest of the JavaScript functions. All insert_record() uses the send_transaction()\
    \ function to call the insert.pl Web Service. In this case,\n\n- select_record()\
    \ and update_record() functions are all wrappers for send_transaction().\n- transfer()\
    \ function is where the Ajax comes into our application. This function takes the\
    \ URL of the service that needs to be passed to the service via HTTPS GET method.\
    \ Then it creates an object that allows the service to be called. We have to jump\
    \ a small loop, because Microsoft will call this object ActiveX while...\n\nListing\
    \ 2. The Basic HTML for the Application\n\nNow we have the database table defined,\
    \ we can start to finish the actual application. Listing 2 shows the HTML for\
    \ our application, and List 1 shows what the application looks like in a Web browser.\
    \ As you can see, simple is just simple, it's simple to drop down to the button\
    \ to make decisions because our easier.\n\nFigure 1 shows our application with\
    \ a new contact or the current record. At the bottom of the application, we can\
    \ move to the previous or next record. In case we have input fields to hold the\
    \ first name as well as the phone number. We also have a form to display the record.\
    \ Referring to List 1, you can see that the first part of the page is standard.\
    \ Things get interesting when we get to form with buttons. Let's look at the \"\
    New\" button:\n\n<input type=\"button\" value=\"New\" onclick=\"insert_record();\"\
    \ />\n\n## Web Services and Ajax\n\nListing 3 JavaScript code handles the database\
    \ actions and processing.\n\n```javascript\nvar req;\n\nfunction insert_record\
    \ () {\n  send_transaction(\"/cgi-bin/insert.pl\");\n  return 1;\n}\n\nfunction\
