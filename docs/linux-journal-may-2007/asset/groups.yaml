    # Coraid SR1521T

    EtherDrive Network Storage Tower


    The Coraid folks have released a free-standing tower version of their EtherDrive
    Storage Appliance, christened the SR1521T. The SR1521T, with internal RAID, provides
    true networked storage over standard Ethernet and is based on the OTA over Ethernet
    (AoE) protocol. Coraid says "a block level storage protocol that is simpler to
    implement than SAN technologies and at considerably less cost than SCSI and Fibre
    Channel solutions." Further, because AoE is not-the need for TCP/IP processing
    overhead or expensive network adapters" is eliminated. The target customers are
    those that do not seek a racked solution and "that need powerful and scalable
    storage readily available at the departmental level". The protocol is native in
    the Linux 2 kernel, and software drivers are available for Mac OS, Windows, Solaris
    and FreeBSD.


    www.coraid.com


    # Arcosoft VONLink TeamRecord


    Arcosoft joins the growing list of companies that have their services: it just
    released live version of its VONLinkTeamRecord VoIP-based-calling application.
    TeamRecord works with any VoIP phone system based on SIP standard (then Asterisk),
    recording all phone calls for a company workgroup. VONLink says that TeamRecord,
    for instance, allows "Business transactions over the phone to be defended and
    resolved disputes" or with Sarban-Osley or other distribution protocols. Furthermore,
    TeamRecord records with analog and digital phones. The recording process involves
    monitoring of network ports via mirroring capability of a network and storing
    in an uncompressed MP3 or WAV file. Users can listen to recordings of calls from
    a Web browser. TeamRecord is available for x86 Linux and Windows platforms.


    www.arcosoft.com


