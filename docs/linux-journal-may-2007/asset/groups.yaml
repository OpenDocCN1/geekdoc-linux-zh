- md: "\n# Open-Source Databases,\nPart II: PostgreSQL\n\nFeature-rich PostgreSQL\
    \ delivers on data integrity. REUVEN M. LENNER\n\nIf you are developing an application\
    \ that depends on storing and retrieving large amounts of data, you undoubtedly\
    \ discovered which relational database to choose. Last month, I gave an overview\
    \ of MySQL. For many years, the open-source offerings were inferior compared to\
    \ their commercial counterparts. Today, we have several open-source options to\
    \ choose from.\n\nThis month, we look at MySQL's best-known competitor, PostgreSQL.\
    \ PostgreSQL has a smaller community than MySQL, which leads to slower development.\
    \ However, I don't believe that it is not as powerful as MySQL. But, PostgreSQL\
    \ includes nearly all the functionality of MySQL and offers a larger number of\
    \ features that MySQL does not currently offer. As this article shows, it is worth\
    \ considering PostgreSQL for any time need.\n\n# History\n\nPostgreSQL began as\
    \ a research project at the University of California, Berkeley, in 1986. Michael\
    \ Stonebraker, a professor of computer science, always developed and released\
    \ new database systems. After creating Ingres, he returned to Berkeley to solve\
    \ the problems he had faced in Postgres. Despite a growing community of users,\n\
    \nPostgreSQL was distributed under the BSD-source license, easy to redistribute.\
    \ Berkeley students, with a handful of people from North America, decided to see\
    \ how easily they could modify the code and create a working database.\n\nOne\
    \ of the changes was made in the version as PostgreSQL grew outside the world.\
    \ Originally, PostgreSQL used the SQL query language that Stonebraker had designed\
    \ for Ingres. The developers reworked and added an SQL interpreter to be more\
    \ compatible with other products. To indicate that PostgreSQL used SQL, the database\
    \ was renamed PostgreSQL.\n\nThe most recent release is PostgreSQL 8.3, which\
    \ was released in early February 2007. This was a bug-fix for version 8.2, which\
    \ was released in June 2006. Major releases typically come out once per year,\
    \ with additional releases for security and other needs.\n\n# Installation\n\n\
    The easiest way to install PostgreSQL is using a package manager, such as debs\
    \ or RPMs. On my Ubuntu system, I was able to install PostgreSQL easily and quickly\
    \ with apt-get. Note that most packages distinguish between PostgreSQL client,\
    \ server and developers via apt-get. Installing the packages that you need gives\
    \ everything to get a running user to initializing a database. If you install\
    \ PostgreSQL, reading the documentation that comes with it. PostgreSQL is not\
    \ hard, but it is more enough for this article. One piece of advice, however,\
    \ before compiling it from source, to try to compile and run the tests. If the\
    \ tests fail, then the server is bound to fail, and other users might not have\
    \ privileges for it to work correctly. Now let's see how to start the server.\n\
    \n# Simple Connections\n\nIf all goes well, our server should now be running.\
    \ We can check this by using psql at the command line! The easiest way to connect\
    \ is to use the interface, which comes with PostgreSQL. To get a list of databases\
    \ in the current server, use the following:\n\n```\npsql -U postgres\n```\n\n\
    username is a user with sufficient privileges on the server. The -U option lets\
    \ us specify the username, and the -l option asks to list those databases that\
    \ are available, such as:\n\n# List of databases\n\n| Name | Owner | Encoding\
    \ |\n| :--- | :--- | :--- |\n| test | postgres | SQL_ASCII |\n| postgres | postgres\
    \ | SQL_ASCII |\n| template | postgres | SQL_ASCII |\n\n# COMPUTER DEVELOPERS\n\
    \nWant your business to be more productive? The systems powered by Intel Processor\
    \ provide the quality and dependability to keep you with your growing business.\n\
    \n# Source Community—1989\n\nLike many other systems, PostgreSQL maintains its\
    \ own list of users and groups separately from the operating system. To create\
    \ a new user, we use the program which comes with PostgreSQL:\n\n```\ncreateuser\
    \ postgres\n```\n\ncreator as postgres (which has permission to create other users)\
    \ and then creates a new user. If we make this new superuser, will also be allowed\
    \ to create new databases and roles (Linux, FreeBSD, OpenBSD, Solaris, etc.).\
    \ Now, we can create the database with\n\n# Hardware Systems\n\nServers starts\
    \ at\n\n- Dual Core 5600 CPUs\n- 4GB DDR Memory\n- Supports to 8GB RAM\n- 120\
    \ GB Hard Drives\n- Integrated RAID 10/1000 Gigabit LAN\n\nDual Xeon servers starts\
    \ at\n\n- Dual Xeon 8200 CPUs\n- SCSI or SAS options\n- Up to 1TB SATA Hard Drives\n\
    - 512 MB RAM\n\n$ psql -U postgres\n\nYou might have noticed that we have not\
    \ given any password. The time we have invoked a command that required us. The\
    \ setting for PostgreSQL makes the server available via a local socket or only\
    \ local users will be allowed to make connections from any defined user.\n\nThe\
    \ pg_hba.conf file located at the top of the cluster directory. The file contains\
    \ extensive documentation and explains how to set the connection parameters. We\
    \ can change this behavior, as with other security and connection-related behaviors.\n\
    \n- Dual Xeon 8200 fast CPUs\n- 2TB of storage (3TB max)\n- 1GB RAM\n- NAS or\
    \ SCSI options\n- 2 x 10/1000 Gigabit LAN\n\n# Your Custom Application\n\nLet\
    \ us know your needs, we will get you a solution.\n\n# Creating a Table\n\nLet's\
    \ connect to our database and see what happens:\n\n```\n$ psql -U postgres\n```\n\
    \nSure enough, we get the prompt, inviting us to enter a query. A list of columns\
    \ can be displayed by typing ? at the prompt. we can also help with SQL syntax\
    \ and commands with :, as in:\n\n```sql\nCREATE TABLE (\n  id SERIAL NOT NULL,\n\
    \  first_name NOT NULL,\n  last_name NOT NULL,\n  email_address NOT NULL,\n  added_at\
    \ TIMESTAMP NOT DEFAULT NOW(),\n  PRIMARY KEY (id),\n  UNIQUE(email_address)\n\
    );\n```\n\nThis table has columns and two different data types. The most common\
    \ type is TEXT, which is the typical way to store textual. PostgreSQL has full\
    \ support for Unicode, and TEXT may contain very long strings. (Until version\
    \ 8.0, )\n\nPostgreSQL could store a limited amount of data in each row, so this\
    \ might come up as news to some people. There is no built-in support for indexing\
    \ TEXT columns, but an add-module, search2, is relatively easy to install and\
    \ provides such functionality for anyone who needs it.\n\nThe added_at column\
    \ is of type. PostgreSQL provides a very sophisticated set of time-and date-handling\
    \ runtimes, to handle the difference between two basic dates.\n\n$75 per month\
    \ - 325 GB/month First month of collaboration free.\n\n# Storage Solutions\n\n\
    IDE, SCSI, Fibre RAID\nNAS, DAS, SATA, SAS\n3Wire, Promote, Atomic,\nKingston/Storage\
    \ solutions\n\n# Rackmount and desktop nodes\n\nHP, Intel, Cisco, Cisco\nKVM or\
    \ Terminal Server\nAPC or Generic racks\n\nAll systems installed and tested with\
    \ your user's choice of Linux distribution free. ASA Collaboration-$5 per month.\n\
    \n# QUICK TAKES\n\n# SERIAL Type\n\nSERIAL is a data type. It creates a new sequence\
    \ and sets the default value of the column to the next value in the sequence.\
    \ This is a convenient way to have auto-incrementing columns. It sounds like saying,\
    \ \"INTEGER with sugar.\"\n\n"
  mdcn: "\n\n# 开源数据库，\n第二部分：PostgreSQL\n\n功能丰富的 PostgreSQL 实现了数据完整性。REUVEN M. LENNER\n\
    \n如果你正在开发一个依赖于存储和检索大量数据的应用程序，你已经发现了应该选择哪种关系型数据库。上个月，我介绍了 MySQL 的概况。多年来，开源方案与其商业同类产品一直逊色。今天，我们有几个开源选项可以选择。\n\
    \n本月，我们关注 MySQL 最著名的竞争对手——PostgreSQL。PostgreSQL 的社区比 MySQL 小，这导致了其开发速度较慢。然而，我不认为它没有\
    \ MySQL 强大。事实上，PostgreSQL 包含了 MySQL 的几乎所有功能，并提供了 MySQL 目前尚未提供的更多特性。正如本文所示，对于任何时间需求，考虑\
    \ PostgreSQL 都是值得的。\n\n# 历史\n\nPostgreSQL 起于 1986 年加利福尼亚大学伯克利分校的一个研究项目。计算机科学教授迈克尔·斯通布雷克（Michael\
    \ Stonebraker）一直在开发和发布新的数据库系统。在创建了 Ingres 之后，他回到伯克利解决他在 Postgres 中面临的问题。尽管用户社区在不断扩大，\n\
    \nPostgreSQL 采用 BSD 开源许可证发布，易于重新分发。伯克利的学生和几位来自北美的人决定看看他们能多容易地修改代码并创建一个可以运行的数据库。\n\
    \n随着 PostgreSQL 在全球范围内增长，其中一个变化发生在版本中。最初，PostgreSQL 使用 Stonebraker 为 Ingres 设计的\
    \ SQL 查询语言。开发人员重新设计了并添加了 SQL 解释器，以与其他产品更加兼容。为了指示 PostgreSQL 使用 SQL，该数据库被重命名为 PostgreSQL。\n\
    \n最近的发布是 PostgreSQL 8.3，于 2007 年 2 月初发布。这是对 8.2 版本的漏洞修复，该版本于 2006 年 6 月发布。主版本通常每年发布一次，并针对安全和其他需求发布额外的版本。\n\
    \n# 安装\n\n安装 PostgreSQL 最简单的方法是使用包管理器，如 debs 或 RPMs。在我的 Ubuntu 系统上，我可以通过 `apt-get`\
    \ 轻松快速地安装 PostgreSQL。注意，大多数软件包通过 `apt-get` 区分了 PostgreSQL 客户端、服务器和开发者。安装你需要的包将提供从运行用户到初始化数据库的所有内容。如果你安装了\
    \ PostgreSQL，请阅读随附的文档。PostgreSQL 并不难，但对于本文来说足够了。不过，有一个建议：在从源码编译之前，先尝试编译并运行测试。如果测试失败，那么服务器必失败，其他用户可能没有权限使其正常工作。现在让我们看看如何启动服务器。\n\
    \n# 简单连接\n\n如果一切顺利，我们的服务器现在应该正在运行。我们可以通过命令行使用 `psql` 来检查！最简单的连接方法是使用 PostgreSQL\
    \ 自带的接口。要获取当前服务器的数据库列表，请使用：\n\n```\npsql -U postgres\n```\n\nusername 是服务器上具有足够权限的用户。-U\
    \ 选项允许我们指定用户名，-l 选项要求列出所有可用数据库，例如：\n\n# 数据库列表\n\n| 名字 | 所有者 | 编码 |\n| :--- | :---\
    \ | :--- |\n| test | postgres | SQL_ASCII |\n| postgres | postgres | SQL_ASCII\
    \ |\n| template | postgres | SQL_ASCII |\n\n想要您的业务更高效吗？由 Intel 处理器驱动的系统提供了质量和可靠性，跟上您不断发展的业务。\n\
    \n# 源社区—1989\n\n与许多其他系统一样，PostgreSQL 维护自己的用户和组列表，并与操作系统分离。要创建新用户，我们使用随 PostgreSQL\
    \ 带的程序：\n\n```\ncreateuser postgres\n```\n\ncreator 为 postgres（它具有创建其他用户的权限），然后创建一个新用户。如果我们让这个新用户成为超级用户，也将允许创建新的数据库和角色（Linux,\
    \ FreeBSD, OpenBSD, Solaris 等）。现在，我们可以使用以下创建数据库\n\n# 硬件系统\n\n双核服务器起步：\n\n- 双核\
    \ 5600 CPU\n- 4GB DDR 内存\n- 支持至 8GB RAM\n- 120 GB 硬盘\n- 集成 RAID 10/1000 千兆以太网\n\
    \n双 Xeon 服务器起步：\n\n- 双 Xeon 8200 CPU\n- SCSI 或 SAS 选项\n- 高达 1TB SATA 硬盘\n- 512\
    \ MB RAM\n\n$ psql -U postgres\n\n你可能已经注意到我们没有提供任何密码。在我们调用需要密码的命令时。PostgreSQL\
