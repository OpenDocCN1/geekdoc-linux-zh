    >开始</a>\n</body>\n</html>\n```\n\n列表 4 统计了 `dns-watcher.js` 代码。其中发生的大部分内容已经由 Revent\
    \ 的 Ajax 示例覆盖。该代码开始时声明了在后续代码中用到的全局变量：\n\n```javascript\nvar capturing = false;\n\
    var match = new RegExp(\"END run\");\nvar r = new XMLHttpRequest();\n```\n\n当分析器正在捕获时，`capturing`\
    \ 布尔值被设置为 `true`，否则为 `false`。创建一个正则表达式匹配包含 \"END run\" 的字符串。最后，通过调用 `getXMLHttpRequest`\
    \ 方法创建一个 Ajax 对象，该方法直接取自 Revent 的示例。\n\n`StartWatcher` 方法通过每隔 1.5 秒调用一次 `updateCaptureData`\
    \ 方法并将 `capturing` 设置为 `true` 来处理繁重工作：\n\n### 列表 3. 网络分析结果 Web 页面\n\n```html\n\
    <html>\n<head>\n  <title>基于 Web 的 DNS 监控器</title>\n  <script language=\"javascript\"\
    \ src=\"/js/dns-watcher.js\"></script>\n</head>\n<body>\n<h1 id=\"watcherarea\"\
    >基于 Web 的 DNS 监控器</h1>\n```\n\n以下是您的 DNS 分析结果：\n\n```html\n<textarea name=\"watcherarea\"\
    \ cols=\"100\" rows=\"20\"></textarea>\n```\n\n等待结果中 ...\n\n```html\n<script>\n\
    \  startWatcher();\n</script>\n```\n\n```html\n<p>\n  <a href=\".startwatcher.html\"\
    >另一个分析</a>\n  （这会停止当前分析）。\n</p>\n</body>\n</html>\n```\n\n```javascript\nfunction\
    \ startWatcher() {\n  setInterval(updateCaptureData(), 1500);\n  capturing = true;\n\
    }\n```\n\nAjax 发生在 `updateCaptureData` 方法中，使用请求对象来访问 `dns-watcher.log` 文件并返回其内容。（列表\
    \ 5 统计了用 Ruby 编写的 `get_watcher_data.cgi` 脚本）。一旦 CGI 脚本在 Web 服务器上被，服务器就会调用 `updateCaptureData`：\n\
    \n```javascript\nfunction updateCaptureData() {\n  if (capturing) {\n    r.open(\"\
    GET\", \"/cgi-bin/get_watcher_data.cgi\");\n    r.send(null);\n    displayCaptureData();\n\
    \  }\n}\n```\n\n`displayCaptureData` 方法改编自 Revent 的代码并处理 Ajax 请求的结果，这些结果从 Web\
    \ 页面内的 `textarea-area` 获取。\n\n```javascript\nte.value = r.responseText;\n```\n\
    \n注意使用以下行 JavaScript 代码将文本滚动到结果区域：\n\n```javascript\nte.scrollTop = te.scrollHeight;\n\
    ```\n\n最后，请注意，当来自 Ajax 请求的数据中出现匹配表达式的行时，`displayCaptureData` 方法会会将 `capturing`\
    \ 布尔值设置为 `false`。\n\n该过程通过向浏览器发送一个短的 HTML 页面来继续，该页面在其部分内渲染名为 `watcher.html` 的结果页面，并包含一个名为\
    \ `watcherarea` 的初始空文本区域。一旦浏览器加载 Web 页面的结果，就会调用 `startWatcher` 方法。\n\n结果页面在其页头中的\
    \ JavaScript 代码（`dns-watcher.js`）中加载，并创建一个简单的 HTML 结果页面，其中包含一个名为 `watcherarea`\
    \ 的初始空文本区域。\n\n## 培养 Linux 专业人才世界\n\n我们 Linux 专业协会（Linux Professional Institute）相信，推广\
    \ Linux 和开源软件采用的最佳方式是培养一个拥有大量优秀、合格且经过认证的 IT 专业人士的世界。\n\n我们只能通过一个当地“实地”合作伙伴组织网络来实现这一点。这些是了解该行业并理解\
    \ IT 劳动力需求的伙伴。通过这种积极的“区域赋能”（Regional Enablement）政策，我们正在寻找当地合作伙伴，并协助他们促进 Linux\
    \ 和开源专业化的工作。\n\n我们意识到提供全球统一衡量标准的重要性。为了协助这项工作，我们正在启动了一项“区域赋能计划”（Regional Enablement\
    \ Initiative），以帮助理解、培养和支持全球企业、政府、教育机构和个人贡献者的需求。\n\n我们鼓励您联系上面列出的新区域合作伙伴。\n\n**我们携手共同培养一个\
    \ Linux 专业人才的世界。**\n\n# 稳定。创新。成长。\n\n### 列表 4. 启用 Ajax 的 JavaScript 代码\n\n```javascript\n\
    var capturing = false;\nvar matchEnd = new RegExp(\"END run\");\nvar r = new XMLHttpRequest();\n\
    \nfunction startWatcher() {\n  setInterval(updateCaptureData(), 1500);\n  capturing\
    \ = true;\n}\n\nfunction getXMLHttpRequest() {\n  try {\n    return new ActiveXObject(\"\
    Msxml.XMLHTTP\");\n  } catch (e) {\n    return new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n  }\n}\ntry {\n  return new XMLHttpRequest();\n} catch (e) {\n  return null;\n\
    }\n\nfunction updateCaptureData() {\n  if (capturing) {\n    r.open(\"GET\", \"\
    /cgi-bin/get_watcher_data.cgi\");\n    r.send(null);\n    displayCaptureData();\n\
    \  }\n}\n\nfunction displayCaptureData() {\n  var te = document.getElementById(\"\
    watcherarea\");\n  if (r.readyState == 4) {\n    if (r.status == 200) {\n    \
    \  te.value = r.responseText;\n      te.scrollTop = te.scrollHeight;\n      if\
    \ (matchEnd.test(te.value)) {\n        capturing = false;\n      }\n    } else\
    \ {\n      te.value = \"Web-based.\";\n    }\n  }\n}\n```\n\n### 列表 5. 获取数据的简单\
    \ CGI\n\n```javascript\nif (matchEnd.test(te.value)) {\n  capturing = false;\n\
    }\n```\n\n此检查非常重要。然而，浏览器每 1.5 秒发送一次 Ajax 请求，由于结果显示在浏览器中，用户已经结束了操作，这在 Web 服务器上停止了。\n\
    \n为了部署，我们创建了一个简单的脚本将其复制到 Web 服务器中：\n\n```bash\nsudo cp index.html /var/www/\n\
    ```\n\n这些位置可能是 Apache 的安装路径：\n\n```bash\n/var/www/html/\n```\nsudo cp dns-watcher.js\
    \ /var/www/html/js/\nsudo cp get_watcher_data.cgi /var/www/cgi-bin/\n```\n\n###\
    \ Web-based DNS Analyzer\n\n```ruby\n#! /usr/bin/ruby\nputs \"Content-Type: text/plain\"\
    \nputs `cat /dns-watcher.log`\n```\n\n```ruby\n#! /usr/bin/ruby\nputs \"Content-Type:\
    \ text/plain\"\nputs `cat /dns-watcher.log`\n```\n\n```ruby\n#! /usr/bin/ruby\n\
    puts \"Content-Type: text/plain\"\nputs `cat /dns-watcher.log`\n```\n\n```ruby\n\
    #! /usr/bin/ruby\nputs \"Content-Type: text/plain\"\nputs `cat /dns-watcher.log`\n\
    ```\n\n"
