    \n> 欢迎于 6 月 17 日至 22 日加入加利福尼亚州圣塔克拉，共同参加 2007 年 USENIX 年度技术会议。\n\n2007 年新增：SANS\
    \ 安全培训\n\n# USENIX '07\n\n在 6 月 1 日前注册可节省费用！ • www.usenix.org/usenix07/lj\n\n\
    # 使用正则表达式进行替换\n\n将字符串替换为弯引号（curly quotes）比以前更复杂，因为我们必须决定是起始双引号字符还是结束双引号字符。如何判断呢？嗯，如果引号字符位于行的开头，那么在该弯引号后面就会有一个换行符（或弯引号的开头）。\n\
    \n另一种简单的描述方法是使用像那样的代码，或者直接编写一个正则表达式。我查看了 Python 库文档第 4 章中的“-- Regular expressions”部分，最终想出了这个：\n\
    \n```\nsdpat = re.compile('((?<=^)(\\\")(?=\\s))')\n```\n\n让我从左到右解释一下这个。我们正在创建\
    \ `sdpat`，即起始双引号的模式，或双引号模式（Double-quote Pattern）。我们通过调用正则表达式模块（re模块）中的方法来实现。该方法匹配模式并创建一个正则表达式。我将使用\
    \ `sdpat` 来匹配应该在引号起始处转换为漂亮引号的直双引号。\n\n现在谈谈这个模式——模式中包含一个双引号字符，我们用反斜杠对其进行转义（例如 `\\\
    \"`）。我们也喜欢这样做，所以为了让 `re.compile` 处理，我们在 `r` 之前运行它产生这样一个字符串。\n\n（给 Perl 用户的简要说明：在\
    \ Python 中，转义字符在普通的单引号或双引号字符串中不会被解释；定界符不具备像 Perl 那样的字符串插值功能。）\n\n我们可以通过 Python\
    \ 脚本查看字符串的工作原理：\n\n```\n>>> print \"\\n\" is a newline\nstring:\n  \\n\n>>> print\
    \ '\\n' is not a newline\nstring:\n  \\n is not a newline\n>>>\n```\n\n那么，在字符串的语境下，这里是什么意思？\n\
    \n1. 引号字符前面的部分 `(?<=^)` 意味着我们正在匹配某些内容（在这种情况下是开头），但前提是它出现在字符串的开头，或者它的前面有一个空白字符。`\\\
    s` 表示“空白”，而 `(?<=^)` 或 `(?<=\\s)` 意味着“如果匹配项前面有空白字符（空格、制表符或换行符）；但匹配中不包含该空白字符”。圆括号表示分组。\n\
    2. 直双引号：`\"`。这是我们要匹配的内容。\n3. 后面的部分是 `(?=\\s)`。我们又添加了一个条件——即引号字符后面必须跟着一个空白字符。\n\
    4. 如果三个条件都满足——那么如果引号存在（条件 2），且它位于字符串开头或前面有空白字符（条件 1），并且它后面跟着某些非空白字符（条件 3），我们就将其替换为起始双引号字符。\n\
    \n除了模式之外，你还向 `re.compile` 传递标志（flags）。\n我们传递了 `U` 以让转义字符从 Unicode 数据库中转义。因为我们正在解析一个\
    \ Unicode 字符串，我们认为：\n\n让我们修复这段代码：\n\n```python\n#!/usr/bin/python -tt\nimport\
    \ xml.dom.minidom\nimport sys\nimport re  # new in fix3.py\n```\n\n```python\n\
    DEBUG = 1\ndef dprint(text):\n    if DEBUG == 0:\n        sys.stdout.write(text.encode('ascii')\
    \ + '\\n')\ndash='\\u2013'  # new in fix3.py\n```\n\n```python\n# sdpat: pattern\
    \ for starting double quote, as\n# \"-- the quote that\n# 我们在开头 (^) 或者\n# 空格 (\\\
    s) 后面寻找，并且我们它后面\n# 跟着非空格字符\nsdpat = re.compile('((?<=^)(\\\")(?=\\s))(?=\\S).U')\
    \  # new in fix3.py\n```\n\n```python\ndef fixdata(data):\n    print(\"DEBUG-md:\
    \ Unicode: %s\" % data)\n    print(data)\n    print(\" OK, so we wash everything\"\
