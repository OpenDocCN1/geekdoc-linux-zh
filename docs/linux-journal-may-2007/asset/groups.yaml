    ## Aptana


    争议性：Eclipse 的 Web 是一个极化的因素。


    优点：


    - 语法高亮和补全在 HTML、CSS 和 JavaScript 之间运行良好。

    - 在 Firefox 中设置断点并调试 JavaScript 代码。

    - 使用 Aptana 调用非常简单。


    缺点：


    - 有时即使在硬件上也会变慢。

    - 调试模式有时需要您重启 Aptana。

    - 对于简单的路径，例如 /cgi-bin/foo.pl，可能需要来自源服务器并允许拒绝错误。对于大多数正在编辑的 HTML 文件，将出现拒绝错误。如果您在
    Firefox 的外部实例中使用调试方法，XMLHttpRequest 可能无法正常工作。Aptana 的 Firefox 实例加载 URL，例如 http://127.0.0.1:8001/foo.html，该
    URL 由 Aptana 包含的 Web 服务器提供。如果 Firefox 实例不支持代理，如果能在 Ajax Monitor 中设置调试将会很好，这样脚本异步回调就可以部分暂停，如果
    XPath 匹配 JavaScript 函数中的请求表达式，但如果直接集成到 Ajax Monitor 中会更好。IDE 包含了对 FTP 或 SFTP 文件的支持，但目前缺少实时同步。Aptana
    屏幕崩溃有助于快速寻找 Aptana 的功能以及如何使用它；某些问题对于那些拥有理想 IDE 的人来说可能用处不大（部分由于 XMLHttpRequest
