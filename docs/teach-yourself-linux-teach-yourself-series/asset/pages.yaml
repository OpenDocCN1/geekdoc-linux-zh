    # 3.4 The Command Language Interpreter (optional)


    The Command Language Interpreter (CLI) is a mechanism for controlling the system
    through commands either typed on a keyboard or read from a file. You may never
    need to use the CLI. With current distributions of Linux almost all setup and
    file manipulation operations can be done through the GUI.


    In the early days of UNIX the CLI was the only way of communicating with a computer.
    The mouse and the graphical display had yet to be invented, users sat at Teletype
    terminals which printed ten characters per second. Because of this command language
    was made concise to the point of being almost incomprehensibly terse. Some of
    its terseness has been inherited by Linux.


    Almost everything that a Linux system can do is associated with it, so almost
    everything can be done through the CLI. Some of the more obscure system functions
    can only be reached through the CLI.


    CLI commands can be run by other programs. Many of the graphical tools are simply
    graphical front ends to CLI commands. Click on a button and the graphical tool
    runs the command exactly as if it had been typed by a human operator.


    The CLI itself can make decisions. It can perform simple tests and automate repeated
    operations. There is also a program called cron that can be set up to run commands
    at specified times on particular days.


    A CLI command is made up of a word which is used to select a program or script
    to run and a list of arguments which tell it what to do.


    For example the command


    ```

    ls /etc

    ```'
  merge: -1
