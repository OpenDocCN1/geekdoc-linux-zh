  md: 'These are the kinds of data source you can use:


    +   - Adabas. This is a commercial database produced by Software AG in Darmstadt,
    Germany. See http://www.softwareag.com/ for details. Use this selection if you
    already have an Adabas database.


    +   - JDBC. This is Java Database Connectivity. Use this selection if JDBC is
    already installed on your system or network.


    +   - ODBC. Open Database Connectivity is an extra layer of software that sits
    between an application, such as OpenOffice, and one or more databases. It is supposed
    to iron out the differences between SQL implementations, but it needs some setting
    up. This is described in a later section. Install ODBC if you want to use pre-existing
    SQL databases or if you want to add shared databases to your system.


    +   - dBase. This is the simplest form of database. You can create a dBase database
    using the Data Sources tool in Writer or Calc.


    +   1 Click on the ‘New Data Source’ button.


    +   2 Enter a name for your database.


    +   3 Set ‘Database Type’ to dBase.


    +   4 In the URL box enter a full path, such as /home/yourname/yourdatabase. This
    will be created as a directory, and every table in the database will be a file
    in this directory.


    +   5 Click on the ‘Tables’ tab. If you have set everything up correctly the directory
    will be created, and an empty table list will appear.


    +   6 Click on ‘New Table Design’ – the icon with the little yellow asterisk.


    +   7 Design your database. Give each field a name in the first column, choose
    the type of data that goes in it in the second column and use the third for optional
    notes explaining what the field is for.


    +   8 Save the database by clicking on the floppy disk icon. You will be asked
    to give your table name, type, in something suitable.


    +   9 Close the database design window.


    +   - Text. Some database packages export a table as plain text, with individual
    values separated by commas or tab characters. OpenOffice can import this sort
    of table if you use this selection.


    +   - Spreadsheet. You can use a spreadsheet as data source. The first row of
    the spreadsheet becomes the field names, and the rest of the sheet contains the
    data.'
