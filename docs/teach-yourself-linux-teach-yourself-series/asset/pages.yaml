- img_proc: true
  md: '# The command

    make oldconfig


    will try to create a .config file from the installed system. You

    may need to run this command twice. You can then edit the con-

    figuration if necessary by typing


    make xconfig

    will give you a profusion of clickable options. You can

    choose the ''y'' (Yes) button for an option to have it built into the

    kernel, ''n'' to leave it out or ''m'' to have it built as a module that

    can be loaded by the running kernel.


    The next step is to type

    make dep


    which works its way through the entire kernel finding dependen-

    cies, information about source files which need other files to build

    them.

    If this step completes correctly you can build the kernel itself. Type

    make bzImage


    and, unless something goes wrong at once, make yourself a cup

    of tea. The build process will churn away for many minutes,

    finally creating a file containing a loadable image of the resident

    part of the kernel.


    Before going any further make sure that you can still get your

    system to come up even if you wreck the installed kernel. Use the

    mkbootdisk command (the command may be different on

    some distributions) to create an emergency reboot floppy.


    The README file in the kernel sources tells you to build the

    loadable modules next. However this may not work if the kernel

    y are building is not the same version as the one you are

    running. The problem is that scripts may try to build the load-

    able modules using information from the installed kernel and fail

    because of various incompatibilities. If this happens you will

    need to install the kernel you have just built with


    make install

    before building the modules with

    make modules


    which can take even longer than building the resident portion.'
