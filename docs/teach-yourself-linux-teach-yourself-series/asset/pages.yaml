    # 7.4.3 Viruses


    A virus is a malicious program which is run by an unsuspecting user. It tries
    to replicate itself and damage the system it infects. Linux is inherently resistant
    to this kind of attack.


    The virus problem exists because some packages (none of which run on Linux) see
    executable code in an arriving e-mail or imported word processor document, and
    at once execute it. On a system which does not have Linux'' sharp distinction
    between ordinary users and root, a malicious program which is run as soon as a
    user opens an e-mail can do a lot of damage.


    On Linux this does not happen. Incoming executable code is not executed unless
    the user chooses to run it. Even if the user - we make mistakes - the malicious
    program can only do what the user is allowed to do. If the user cannot damage
    the system neither can be a virus.


    # 7.4.4 Worms and exploits


    A worm is a malicious program that replicates itself without human assistance.
    Worms are much rarer than viruses and relatively easy to kill.


    A worm can only live at all if it can make use of a bug - usually in the mail
    transport software - which lets it do something it should not.


    Making use of a bug in system software to get unauthorized access is called an
    exploit. Usually this means something outrageous and unexpected such as sending
    an e-mail with lines that are ten thousand characters long. This will cause some
    part of the system to fail in a way that can be manipulated by very subtle programming.


    Killing a worm is simple - fix the bug that it uses, then examine every machine
    that it has touched to make sure it has made no malicious changes.'
  merge: -1
