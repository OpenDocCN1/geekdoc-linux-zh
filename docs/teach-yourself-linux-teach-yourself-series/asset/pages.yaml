    \ x and y with the values that the find command\ngave you.\n\n3 Write the initial\
    \ loader to disk. Type\nsetup (hd0)\nto write the loader to the first block of\
    \ first hard disk.\nYou can use a different drive name in place of hd0 to write\n\
