  md: 'mounts a filesystem. When the user program stops accessing that filesystem
    automount waits for a preset time and unmounts it again.


    This is particularly useful for removable disks such as CD-ROMs and floppies,
    and for NFS filesystems.


    You can set upount by logging in as root and creating map files in /etc. You can
    create a list of maps in auto.master, which looks like this:


    ```

    # Format of this file:

    # mountpoint options

    # For details of the format look at autofs(8).

    /oberon/etc/auto.oberon --timeout 120

    /puck /etc/auto.puck --timeout 120

    ```


    Each line of this file associates a mount point with a map file. The map file
    contains a list of the filesystems that can be mounted as subdirectories of mount
    point. This is the contents of /etc/auto.oberon:


    ```

    root -ro,soft oberon: /

    nmaint -ro,soft oberon:/mount

    cdrom -ro,soft oberon:/cdrom

    dos -ro,soft oberon:/dos

    backup -rw,soft oberon:/backup

    extexternal -rw,soft oberon:/external

    ```


    The computer called exports the filesystems /, /mount, /cdrom, /dos, /backup and
    /external. Note that exporting the root filesystem is not a good idea in general,
    although there were special reasons for doing it in this case.


    Once automount is running it takes over control of the /oberon mount point and
    something like this appears in the map list - type mount with no parameters to
    see:


    ```

    automount (pid424) on /oberon type autofofs

    (rw,fd=5,grpg=424,minproto=2,maxproto=3)

    ```


    When you run a program that refers to /oberon/dos mount will look in the map file
    and mount oberon:/dos over the network on /oberon/dos. If there are no accesses
    to this filesystem for 120 seconds - the timeout value in auto.master-automount
    will unmount it again.


    Automount is almost invisible, applications normally do not know that it is. However
    if you look at /oberon when nothing is mounted, the directory will be empty.'
