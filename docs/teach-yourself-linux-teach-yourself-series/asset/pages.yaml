  md: '# 5.1 Basic scripting (optional)


    You should read this section if you want to know how to automate-simple tasks,
    or if you intend to read any of the sections on programming.


    The shell programs, such as `bash`, can take commands from script files as well
    as from the keyboard.


    These script files should not be confused with the batch files which exist on
    some other operating systems. Batch files are a legacy of the practice, common
    in the 1960s and 1970s, of putting commands, programs and data together on decks
    of punched cards, piling them up into batches and leaving the computer to work
    its way through a batch of jobs by one.


    Script files can do much more. They can be simple lists of commands but they can
    also be small programs in their own right. A script can be written to make decisions
    and perform repeated operations automatically.


    The examples in this section are text files, which you can create and edit with
    a text editor. Both GNOME and KDE desktop environments have built-in text editors.
    Do not attempt to edit script files with a word processor. Most of the time it
    will not work.


    The emacs editor is more complicated but in the long term I found it to have many
    more useful features. If you intend customizing your system or learning to program,
    it is well worth taking the time to learn to use emacs.


    Emacs has a huge number of commands but initially you can get by with just three
    and pick the others as you go along.


    Note that emacs runs on a large number of different computers it uses a slightly
    unfamiliar terminology for the keyboard. The `Ctrl` and `Shift` keys, which have
    been inherited by the PC keyboard from the days of the mechanical printer terminal,
    the `Alt` key, which has a completely different function in the early days, is
    frequently referred to as `meta`, this is derived from a Greek word meaning ''to
    change'', as it changes the meaning of a key.


    The three commands you need to know are:


    +   - Ctrl-X Ctrl-S Save the file you are editing.

    - Ctrl-X Ctrl-C Exit from emacs.

    - Ctrl-H Display help.


    ![](img/523b8b12cfa3c3d8f1ff0644bff32d59_86_0.png)'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'To enter Ctrl-X Ctrl-S hold down the Ctrl key and press X then S, while still
    holding Ctrl.


    The simplest way to work with emacs is to open a terminal window, then type a
    command like this:


    emacs myscript &


    This will start emacs, which will open a new window. The file myscript will appear
    in the window. This will initially be blank as the file has been created with
    no contents. Because this leaves emacs running in background you can carry on
    using the terminal window to test your script.


    A script normally begins with this line:


    ```

    #!/bin/sh

    ```


    The characters #! tell Linux that is a script and the rest of the line is a path
    to the program that knows how to interpret it. The path /bin/sh is always a symbolic
    link to your normal shell program, usually bash. These characters must be placed
    right at the start of the file. There must be no spaces to the left of them or
    blank lines above.


    The remainder of the script is then read and interpreted by the selected program.


    You can experiment with a simple script like the command:


    +   Start the emacs editor with the command:

    emacs myscript &


    +   Type in this simple script:

    #!/bin/sh

    # This is my first script

    ls -lrth


    +   Save your script to disk by entering Ctrl-S Ctrl-X

    Type this command


    ```

    chmod u+x myscript

    which will set the ''user executable'' flag on your script. The shell will only
    run scripts and programs which have an executable flag set.

    ```


    +   Run your script by typing:

    ./myscript'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'You should now see the current directory displayed in reverse date order with
    human-readable sizes.


    The second line of the script is a comment, it contains human-readable text but,
    because of the hash (#) at the beginning of the line, bash ignores it.


    Comments are used to remind the person who wrote the script of what it is supposed
    to do, and how the script does it. This may not seem important at first but as
    the number of scripts that you have written grows into the dozens or hundreds
    you will find useful to put in a few memory joggers. If you ever have to sort
    out a problem with a script written by someone else you will quickly discover
    the value – or lack of it – of the original author’s comments.


    The command which runs your script begins with . / to tell the shell to look in
    the current directory.


    If only the file name – not the full path – is given with a command the shell
    will look in the directories listed in the PATH environment variable. To display
    this type:


    ```

    echo $PATH

    ```


    The response should be something like this:

    usr/local/bin:/usr/bin:/bin:/home/unclebob/bin


    Note that the current directory . does not appear. When you log in your path is
    set to include your private binary directory, in the example /home/unclebob/bin.
    This directory does not automatically exist but you can create it with mkdir.
    The shell will then find any scripts or programs you put in this directory.


    Try this with the script you have just written. Quit from emacs by entering Ctrl-X
    Ctrl-S. Then enter these commands:


    ```

    mkdir bin

    cp myscript bin

    ```


    This will create a bin directory and copy your script into it. Now you can type


    ```

    myscript

    and your script will run.

    ```


