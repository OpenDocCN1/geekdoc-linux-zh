    # 5.3 Printing


    Linux, in common with many other UNIX-like systems, uses print queues to organize
    work for printers.


    Printing is controlled either by the lpd program, or on newer systems by the Common
    UNIX Printing System (CUPS). These are started automatically when Linux starts.


    Most distributions now have a graphical tool for setting up printers, although
    no two are alike. You will need to know the make and model of your printer and
    which port it is plugged into. Once you have set up your printer it is a good
    idea to print a test page to check, among other things, that you have selected
    the correct paper size.


    From the user’s point of view lpd and CUPS are compatible - any command that worked
    on an older system with lpd will work on a current one with CUPS. CUPS can do
    more than lpd – it can rotate the output, multiple pages on one sheet, add pretty
    formatting and even mark your print TOP SECRET.


    To learn more about CUPS simply use a browser to look at the URL http://localhost:631.
    This page is generated internally by CUPS. From this page you can browse the manuals,
    or log in root and change the settings.


    The lprpr command is used to print files. It either takes the name of one or more
    files to print, or the data to print can be sent to its standard input.'
