  md: '# 4.2.2 Vector drawing tools


    Both the Appix and OpenOffice packages come with vector drawing tools. These are
    both extremely usable – the diagrams in this book were drawn with Appix graphics.


    Both packages do the same things – you can draw lines, curves, boxes, polygons,
    circles and ellipses with either. Appix graphics is also integrated with the Appix
    word processor – you can embed a drawing in a word-processor document. OpenOffice
    includes a similar mechanism, graphic objects can be dragged and dropped into
    word-processor documents.


    # 4.2.3 Imagemagick


    This package is a collection of separate programs which manipulate images.


    The display program does more than simply display an image on the screen. It also
    has a menu interface to manage any of the other programs in the package.


    This package contains a program called convert. As well as converting images from
    one form to another it can turn vector graphics in PostScript format into bitmaps,
    insert line drawings or text captions, capture images from X-Windows and zoom
    images larger or smaller.


    Convert can also apply filters. These are programs which can make an image softer
    or sharper and do a wide range of special effects.


    One of the major strengths of Imagemagick is that it is scriptable –I will explain
    this in detail in a later chapter. If you need to convert several thousand images
    from one format to another you can write a script to automate the conversion and
    leave it running overnight.


    Imagemagick is included in many distributions, or you can download it from http://www.imagemagick.org/


    # 4.2.4 Scanners and digital cameras


    Scanners are handled under Linux by a package called Scanner Access Now Easy (Sane).
    This is not only available for Linux, but'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'works with other operating systems as well. Sane is made up from two sets of
    programs:


    +   - Back ends – These are the handlers for individual models of scanner.

    - Front ends – These are the programs operator uses to access the scanner.


    Any back-end program should work with any front end.

    The simplest front-end program is xscanimage. It has a convenient graphical interface
    and can run the scanner in a low-resolution ''preview'' mode – useful to make
    sure that you have the correct orientation way up in the machine.


    Scanimage is an alternative, text-only front-end program which can be run from
    a script. You can use it to build scanning into any other program. I have a simple
    script which works as a photocopier by scanning a document, converting scanimage’s
    output to PostScript and sending it to the printer.


    You can learn more about Sane at http://www.mostang.com/sane/


    The gPhoto package runs under Linux and gives you access to digital cameras. You
    can find out about it – or download it – http://gphoto.sourceforge.net. Once again
    it is included in most distributions.


    The gPhoto package contains two components – the graphical front end, and the
    camera driver library. The driver library works with over 300 models of camera
    and can be used with programs other than the gPhoto front end.


    There is a scriptable front end for gPhoto. You can use this to trigger your camera
    to take pictures at specific times, or in response to events such as a door being
    opened.


    # 4.3 Some other interesting applications


    Finding applications for Linux is rather like browsing in a good bookshop – intriguing
    and unexpected things turn up all the time. For example, Linux is being used to
    model drug molecules, see http://www.tripos.com/ and experiment with mathematics,
    at http:////www.wolfram.com/.


    This is a selection of some of the most useful applications.'
