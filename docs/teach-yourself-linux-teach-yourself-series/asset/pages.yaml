    # 7.3 Linux servers and clients


    This section tells you about the server and client programs for a variety of other
    protocols. You may not need to use all of these – some are for specialized purposes.


    # 7.3.1 File Transfer Protocol (FTP)


    FTP, older than HTTP, is a standard, rather clumsy, way of moving files from one
    machine to another. You can set up an FTP server to distribute files to other
    machines on your local network, or to collect files from other machines.


    An FTP transfer requires two programs – a client and a server. Both of these are
    provided with Linux distributions. The Washington University FTP Daemon (wu-ftpd)
    is commonly used as the server.


    When you set up a connection to an FTP server your client program authenticates
    itself by supplying a user name and password. The FTP server checks the user name
    and password that the client presents against its list of users, exactly the same
    way that they are checked when you log in at that machine''s keyboard, or by telnet.
    Once logged in you have precisely the access rights to the same files as you would
    have with a normal login.


    If you would like to make files available from your FTP server to anyone who comes
    along the network you can add anonymous FTP to do this. When a client connection
    supplies ‘anonymous’ or ‘ftp’ as the user name the FTP server will look for a
    user called ‘ftp’ in /etc/passwd. If this user and a corresponding home directory
    are set up the user is allowed to log in'
