- img_proc: true
  md: 'Linux has inherited a lot of applications, such as the Tex typesetting system
    and the vi emacs editors from classical UNIX. Much of this older software is useful,
    but not quite what is wanted in the modern office or home environment.


    Over the past years several software vendors have produced high-quality applications
    for Linux. This is a representative, but by no means complete, selection.


    # 4.1 Office applications


    Office applications include tools for creating and manipulating text documents
    and graphics, and for organizing information.


    There is no shortage of office applications for Linux. As a new user you are more
    likely to have trouble choosing between a plethora of alternatives than fail to
    find a package to do what you want.


    Linux lends itself to almost seamless office integration. Figure 4.1 shows how
    you can join together standard components to make an integrated office. All the
    software needed to do this is included in most major distributions, and can be
    downloaded from the internet.


    You can set up one or more databases to keep track of friends, pets, holidays,
    finances and sports. You can use Structured Query Language (SQL) to access your
    data. This is a nominally standard way of connecting to a database. It uses queries
    formatted in a mixture of English words and mathematical symbols to store, retrieve,
    search and sort data. I will explain SQL in a later section.


    SQL databases can very easily be shared across a network. You can set up an SQL
    server on one computer and have users on several machines access it, a useful
    thing to do if you want to distribute data across an office, for example.


    The alternative is to use dBase databases – the name derives from an earlier program
    that used this database format. These are much simpler, do not share between machines
    and cannot handle complex queries. They are much easier to set up – a dBase database
    is simply a few files on your computer – and are more than adequate for home use.


    OpenOffice is likely to become the standard office suite by default, as it is
    beginning to be included with distributions.'
