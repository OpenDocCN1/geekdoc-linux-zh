  md: 'DO NOT attempt this with an internal drive, or one connected by SCSI or IDE
    – serious loss of data can result.


    You will need an external disk drive such as a USB-connected Iomega Zip 100, and
    one cartridge which can be erased, for this exercise. Alternatively you can use
    a hard disk which can be connected over a hot-swappable bus. All the data on the
    disk you use will be erased.


    Connect the external disk drive and create one primary partition on it with fdisk.
    This should be partition number four. Make the partition type 83 (Linux).


    Assuming that your disk is /dev/sda – substitute its real name if different –
    create an ext2 filesystem on it with this command:


    ```

    mkfs /dev/sda4

    ```


    and create a mount point for it if you do not already have one with this command:


    ```

    mkdir /mnt/zip

    ```


    Now mount the disk with the command:


    ```

    mount /dev/sda4 /mnt/zip

    ```


    The next step is to cause a catastrophic dismount – the sort of thing that would
    happen if the power failed. Very carefully unplug the USB or FireWire cable.


    If you now unmount the disk with the command


    ```

    umount /mnt/zip

    ```


    you will cause an error. It will be written to the log, and come up on the console
    if you have enabled system logging by editing /etc/syslog.conf. The error will
    look like this:


    ```

    titania kernel: Device 08:14 not ready.

    titania kernel: I/O error: dev 08:14, sector 10

    ```


    You can safely ignore it. Now plug the cable in again and try to mount the disk
    again. You will succeed but this error – or something similar – will be reported.


    EXT2-fs warning: mounting unchecked fs, running e2fsck is recommended


    Now unmount the disk and type this command:


    ```

    fsck /dev/sdb4

    ```'
