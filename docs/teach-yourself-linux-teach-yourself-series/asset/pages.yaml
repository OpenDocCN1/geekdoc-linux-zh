    can access every file on the server. To control this problem the server can be
    set up to perform ‘root_squash’ – it ‘squashes’ all requests that seem to come
    from root on the client machine into an innocuous user who has very few access
    rights.


    # 6.5 Using automount


    The automount package bypasses the need to mount and unmount some filesystems.
    It sits watching a selection of mount points, and when a user program tries to
    access one of them, it'
