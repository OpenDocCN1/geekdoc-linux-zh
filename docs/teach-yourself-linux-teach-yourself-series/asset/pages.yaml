  md: 'Linux keeps an internal list of serial ports. You can manipulate this list
    – at least for hardware that the kernel knows – with the setserial command. For
    most standard hardware there is no need to do this, but if you have extra serial
    ports you can tell the kernel how to access them with setserial. You can use the
    /etc/rc.serial file described in Chapter 9 to do this.


    There is a limit to the number of serial ports you can add to your computer if
    you use the old style of single and dual port cards – mainly because you run out
    of valid addresses and interrupt lines. If you use four or more extra ports you
    can use a multi-port card. These cards commonly have between four and several
    dozen ports, and include a small, fast processor which looks after all the housekeeping
    tasks associated with the card. If the kernel knows about your multiport card
    the appropriate driver will be loaded automatically as the system starts up; if
    not, you may need to add a driver. If so, you may be able to download the driver
    from the card manufacturer''s website, in which case it will come with installation
    instructions.


    Every serial port, from the old-style simple to the most sophisticated multiport
    cards, has the same programming interface. They all support the read() and write()
    calls to transfer data, select() to test for the port being ready to transfer
    data and ioctl() to set the baud rate, character format and flow control. Because
    this interface is standard you can expect any software that works with one type
    of serial port to behave in the same way with another.


    # 10.4 TCL, TK and tix


    The Tool Command Language (TCL) is distributed free is included in most distributions.
    You can learn more about it at http://www.scriptics.com. It is a scripting language
    that has a lot of useful features, particularly for manipulating text strings.


    TK is an extension to TCL which lets you write scripts that use the GUI. You can
    display windows, put up dialogue boxes, add menus and make objects that can be
    dragged with the mouse. This extends TK by adding a number of extra widgets, including
    a very useful directory and file selection tool.


    The TCL interpreter is designed to be combined with other programs to give them
    a ready-made command language. Alternatively there are three shell programs that
    work as a simple interface to the interpreter.'
