    that can go wrong. A Linux system can almost always be repaired if things come
    badly adrift – miserably rare event in any case. Complete loss of data, except
    in the case that the hardware has self-destructed, is almost unknown.


    Hardware failures, particularly disk-drive problems, happen all the time to computers
    regardless of the operating system they are running. One of the major advantages
    of Linux is that it enables you to deal with them quickly and easily.


    Disk drives have become vastly more reliable in the thirty years since I first
    entered the computer industry, regardless of the fact that they depend on a near-impossibility
    to function at all. In Chapter 1 I mentioned briefly how a hard drive works –
    how the heads face the platters without quite touching them. In fact there is
    a minute air gap between head and platter. This gap is so small that the relationship
    of head, air gap and platter is, to scale, comparable with taking a fighter aircraft
    through the sound barrier at an altitude that would be considered minimal for
    a lawnmower.


    This does not always work. The phenomenon known as a head crash, in which the
    head actually touches the platter with terminal results for both, is very rare
    but very sudden. When it happens the bulk of the data on the drive has gone to
    join the snows of last year.


    Being aware of this, and planning for it, it is one of the basic system management
    skills that you can learn with a Linux machine.


    # 8.1 Installing, configuring and removing packages


    Many Linux systems use the Redhat Package Manager (RPM), originally developed
    by Red Hat Inc. to install and maintain optional software.


    RPM works with packages, which are archives with some additional control information.
    The archive part is in a format called cpio, and the program rpm2cpio can remove
    the control information leaving just the archive.


    RPM keeps a database of the packages which are installed on your system, normally
    in /var/lib/rpm. For each package it'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'holds a list of the files included in the package, their ownerships, permissions
    and checksums.


    Using the database RPM can track down every file that should be part of a package,
    wherever it is on your system. It can check for files having been altered, so
    it can detect almost accidental or malicious damage to the system.


    RPM can delete all the files making up a package. In most cases this means that
    it is a totally ‘uninstall’ – it can put a system back to exactly where it was
    before a package was installed.


    RPM can also be used to create packages, a process I will describe in Chapter
    12.


    RPM can also install and create source rpm files which are compressed archives
    of the source and script files needed to create a package.


    The everyday uses of RPM are these:


    +   Install a package. Type `rpm -i package` as root. The package parameter is
    the path – relative or absolute – to the file containing the package you want
    to install. It should end in .rpm.


    +   Upgrade a package. This command replaces an installed package with a later
    version. When you are using releases an manufacturer of the distribution you are
    using an improved version of a package you can download the new .rpm file. Then
    type `rpm -U package` as root. Note that it is a capital U to avoid confusion
    with an obsolete -u option.


    +   Erase a package. This deletes all the files associated with the package. Type
    `rpm -e name` where name is the name of the package, not a file name.


    +   Verify a package. This command `rpm -V` will check all the files associated
    with the database and report any problems.'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'When RPM installs a package it makes an entry in the database. That entry is
    named with the package name and version. You can use the command


    ```

    rpm -qa

    ```


    to find out the names of all the packages installed on your system. For example
    if one of these names is gnome-utils-1.0.50-4


    you can use the package name gnome-utils to refer to the installed package in
    the -e and -V commands.


    Downloading and installing a package on your system lays open to a particular
    type of threat – a package which has been in some way modified to compromise security.
    It is possible, with a certain amount of programming skill, to construct a package
    which looks like a legitimate upgrade but in fact breaches your security. To prevent
    this the distribution manufacturers add public-key signatures to packages which
    can be checked before the package is installed. Use the command


    ```

    rpm --checksig package

    ```


    to test the validity of a signature.


    Many distributions now have GUI interfaces to package managers. If you have downloaded
    a package, and can see it in a folder on your desktop, you may be able to install
    it simply by clicking on it. Alternatively you may find a tool to add or remove
    packages in the system menu.


    # 8.2 Making backups


    The purpose of making backups is to be sure that you can get your computer working
    again as quickly as possible if something catastrophic happens to it, and to ensure
    that you lose very little data.


    Hard drives fail. When they fail they lose data. The path to safety lies through
    making lots of copies.


    # 8.2.1 Backup tools


    There are several tools you can use to make backups:


    +   - Zip. This program converts part of a filesystem tree to a zipfile, normally
    with the file type .zip, which contains all'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'the files in the tree in zip is that it is compatible across a large number
    of operating systems. It also understands text files, and can convert between
    the formats used on a range of systems. Its drawback is that it does not completely
    understand the Linux and UNIX filing systems, so a backup made with zip is not
    guaranteed to restore perfectly. In particular, it does not understand special
    files – you cannot use it to back up /dev. If you need to make backups which are
    readable on a machine running an operating system other than Linux, you only need
    to make backups of ordinary files, use zip.


    +   - Tar. The name is a contraction of ‘Tape Archiver’. Tar can make perfect
    backups of Linux and UNIX systems. It converts a file tree of any complexity into
    a stream of bytes, and back again. It can call up programs to compress the stream
    if needed. Tar can operate magnetic tape drives directly – but it is not restricted
    to using tape as a backup medium. It can equally well backup to removable disks
    or, with a separate program to control the burning process, to recordable CDs.
    Tar archives can be read on almost any computer but can only be fully restored,
    including all the permissions, on another Linux or UNIX machine.

    - Dump. This program, and its companion restore, have some useful features for
    making regular backups. makes use of ‘Dump Levels’. A dump at level 0 will include
    all the files in a system, at level 1 the files changed since the last level 0.
    Level 2 will take files changed since the last level 1 and so on to level 9.


    Both dump and tar were originally intended for the big open-reel tape drives that
    were beloved of 1960s’ film producers. A row of drives rewinding or searching
    provided an instant, incomprehensible, leitmotif for the computer throughout an
    entire decade.


    The tape drives of the period usually recorded data on seven or nine tracks with
    a density of about 800 bits per inch in each track. A 2400-foot reel of tape had
    a capacity of around 20 megabytes – a little more than a box of modern floppies.
    This was larger than many of the disks use at the time.


    The tape handling commands of both dump and tar still work in the same way, even
    though the capacity of the media they now use has increased a thousandfold.'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'Tar has the ability to pipe the archive through a compression or decompression
    program. This makes the archive smaller – typical compression ratios are around
    three to one – at the expense of slowing down the backup process. The compression
    programs available, and the options to select them are:


    +   - -Z uses Lempel-Ziv compression, named after the two mathematicians who developed
    it. It has largely been superceded by gzip.

    - -z gzip uses Lempel-Ziv. In its other guise as gunzip – the corresponding decompression
    program – it is compatible with compression.

    - -j Bzip2 uses Burrows-Wheeler compression which is slightly more effective than
    Lempel-Ziv.


    Gzip – selected with the z option – is the most usual, followed by Bzip2.

    Ancompressed tar archive normally has the file type .tar, one compressed with
    gzip .tgz or .tar.gz and where Bzip2 compression is used .tbz or .tar.bz2.


    Both tar and dump can split their output into manageable sections, but neither
    does it in a way that is convenient for making backups to writable CD-ROMs and
    similar media. There are a number of third-party utilities available on http://www.linux.org
    to deal with this problem, and to manage backups in general. I have also written
    a program to do this for my own use, called tsplit. It is available under GPL.
    There is more about tsplit in Chapter 12.


    Both KDE and GNOME know about tar archives. You can click on an archive file on
    the desktop and you will see the files it contains.


    # 8.2.2 Regular backups


    To make your data as safe as possible you should have a plan for your backups.
    Some parts of the system, which change infrequently, need only be backed up every
    week, or when you know you have made a change. The areas in which you are working
    more frequent backups.


    Once you have your system working to your satisfaction you can either add a backup
    program or write a few lines of script to make backups from the command line or
    by clicking on the desktop.'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'If you are working on something that is changing rapidly you may want to make
    frequent backups. One way to do this is to run a cron job which copies the files
    you are changing to another disk drive. Note that it must be a different drive,
    not another area on the same, so that if one drive fails the data on the other
    will probably survive. This script runs every 15 minutes from cron (I have had
    to split the line that begins ‘tar’ and that the next one should be all one long
    line);


    ```

    #!/bin/sh

    # Regular backup of what I’m working on

    tar -czf /seagoon/unclebob/$(date +%a%H&M).tgz $(find Desktop -ctime -1 -type
    f) axhome/backup /seagoon/unclebob/-ctime +7 -exec rm {} \;

    ```


    The section


    $find Desktop -ctime -1 -type f


    calls the find program to make a list of all files on the desktop or in folders
    that have changed during the last day. These, and the files in axhome/backup which
    is the word processor keeps a copy of the file I am working on, are backed up
    to /seagoon/unclebob, which is on a different drive. The last line finds and deletes
    backups which are more than a week old. By this time the changes will have found
    their way into my ordinary manual pages. You can see how this works by looking
    at the manual pages for find and date.


    # EXERCISE


    8.1 The automated backup in this section fails for file names which contain spaces.
    Why? How can this be fixed?


    # 8.2.3 Backing up dual-boot systems


    If you have a dual-boot system, and the other operating system uses a filesystem
    that Linux cannot write, you can still back up that operating system using Linux.


    To make this work well, prepare the hard disk before you install the operating
    systems. Bring up a version of Linux that does not need the hard drive – the rescue
    mode of your distribution will normally work like this – and use this command:


    ```

    dd if=/dev/zero of=/dev/hda

    ```'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'to write zeroes over the whole of your hard drive before you start. This will
    erase all the data on your hard drive. If your hard drive is not the first IDE
    disk – for example it might be /dev/sda if it is a SCSI disk – use its name in
    place of /dev/hda.


    Then install your operating systems, adding Linux last. For example you might
    install Linux in /dev/hda5 and another operating system in /dev/hda1.


    Make a careful note of the partition table, you will need it if you have to restore
    the backup.


    When Linux is running you can use a command like gzip </dev/hda1 >othersys.gz
    to back up the other system.


    This treats the whole of the other system as one big file and compresses it into
    othersys.gz. Because you filled the disk with zeroes, the other system’s free
    space – the areas of its partition that have never been used – will still contain
    nothing but zeroes, and the gzip compression program will reduce them to almost
    nothing.


    This backup can be restored with the command gunzip <othersys.gz >/dev/hda1


    which simply reverses the process. This is not really a satisfactory way of making
    backups. These files can only be restored to a partition with exactly the same
    geometry. There is no guarantee that this sort of backup will restore all to a
    drive with a different number of heads or sectors.


    The real virtue of this is that it lets you use a Linux system to make a snapshot
    of another system, and restore it quickly. If you are about to do something irreversible,
    such as installing an update, this type of backup will let you recover gracefully
    if something goes badly wrong.


    # 8.2.4 Backup media


    There are several kinds of backup media you can use.


    +   - Magnetic tapes. The drives are relatively expensive and this technology
    is falling out of favour.

    - Removable disks. These are similar to hard disks, but the disk platters are
    contained in a replaceable cartridge.'
