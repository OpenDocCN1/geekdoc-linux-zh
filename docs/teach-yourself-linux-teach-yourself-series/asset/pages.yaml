- img_proc: true
  md: '# 1.1 Introduction


    Linux is an operating system that has proved itself highly effective on both servers
    and desktop computers. It is also finding its way into applications as diverse
    as video recorders, telecommunications systems and spacecraft.


    This book will give you an introduction to Linux. It will show you how to set
    up and begin using a simple Linux system, and how to find the sources of information
    that will enable you to go on learning on your own.


    Because some users only want to know enough to get a system working, and others
    are interested in what goes on inside Linux, I have marked some sections of this
    book with the word *optional*. These optional sections are also useful if you
    get into difficulties, particularly during the installation phase, and want to
    solve the problem yourself, rather than asking for help.


    Linux, and open-source software in general, uses some new terminology. To make
    this more understandable I have placed each new term in italics *like this* the
    first time it occurs. A short glossary of terms and acronyms appears at the end
    of the book.


    You will need a computer on which you are free to try things out. Any personal
    computer with a Pentium or similar processor, even a very old one, can be used.
    You will need as an absolute minimum 12 megabytes of *Random Access Memory* (RAM)
    and 2 gigabytes of disk space. That is an *absolute minimum* – Linux will only
    run just in a machine that small. To have Linux run reasonably quickly and with
    every feature working you will need 128 megabytes of RAM and 5 gigabytes of disk
    space.


    Almost any graphics card, keyboard and mouse will do.


    It is possible to work through the exercises using a computer which has another
    operating system installed on it. However if you want to experiment with the installation
    process – as I hope you will – there is a small but very risk of erasing all the
    data on the hard disk. This causes no permanent damage to the machine but can
    be very inconvenient. If you choose this route it is very important that you make
    a backup of all your data before you begin installation.


    The best plan is to obtain an old machine on which you can experiment safely.
    These can often be acquired cheaply – you may even find a friend who has one to
    give away.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Ideally you will also need an internet connection. At the time of writing there
    are some internal modems that will not work with Linux. An external modem, or
    a connection to the internet via a Local Area Network (LAN) will almost certainly
    work at the first attempt.


    # # 1.2 Background


    An operating system, such as Linux, is a collection of programs which carry out
    many routine tasks on a computer. It also provides a safe way in which application
    programs, such as games and word processors, can get access to screen, keyboard,
    mouse, printer and disk.


    The largest part of the operating system, and the one on which all the others
    depend, is called the *kernel*. The kernel is started when the computer is switched
    on or reset.


    Peripherals, such as the hard disk, respond to very simple commands. Applications,
    such as word processors, which are seen by the person sitting in front of the
    screen, expect to do complicated things. The kernel must mediate between them.


    Click with the mouse on a word processor''s file menu and select a file to open.
    The word processor will send a request to the kernel for the file. The kernel
    then works out where file is on the hard disk. It issues a command to the hard
    disk to look in the correct place and read the number of characters. The characters
    are then handed back, by the kernel, to the word processor and the file appears
    on the screen.


    Because the kernel sees every request for access to the disk it can veto any damage
    to the system. Linux makes a sharp distinction between files owned by the system
    itself and files owned by users. Similarly it can prohibit a user program from
    directly issuing commands to peripherals such as the disk drives.


    If, for example, the person using the word processor tries to save their document
    in `/etc`, an area reserved by Linux for its own files, the kernel will simply
    turn the request away with an error message.


    This sharp distinction between what someone using the system can do, and what
    is permitted to the system itself, constitutes most of Linux''s resistance to
    attack. A malign program run by


    Linux getting started with 01'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'an ordinary user simply cannot make any changes to the operating system. Malicious
    attacks on Linux machines do still happen but they require a high degree of programming
    skill, often do little damage and are very easy to counter.


    The terms user and root are used to describe the environments inhabited by ordinary
    users and by the operating system itself. Root and root login also refer to a
    person who has administrator privileges over a particular computer. When this
    person logs in they can do things that are forbidden for ordinary users.


    The first version of the Linux kernel was written in the early 1990s, working
    alone in a flat in Helsinki. When this was combined with Richard Stallman''s supporting
    programs and Bob Schreifer''s X-Windows graphical interface it became a complete
    system. Because of this it has been argued that the Linux is really only applicable
    to the kernel itself, even though it is commonly used for the whole system.


    The name Linux is a conflation of Linus and UNIX, an older operating system developed
    at Bell Laboratories in the late 1960s and early 1970s. Many features of Linux
    are based on the older UNIX system.


    The word Linux is a registered trademark of Linus Torvalds and should be acknowledged
    when used – as it is at the start of this book.


    Patents have been applied for some of the software techniques developed for Linux.
    However, the GPL has been effective in ensuring that the patented techniques are
    freely available to all users.


    Figure 1.1 is a roadmap of a Linux system. As a map it is far from complete –
    one sheet of paper cannot hope to show the hundreds'
  merge: -1
  pgno: 13
- img_proc: true
  md: '![](img/523b8b12cfa3c3d8f1ff0644bff32d59_14_0.png)


    Figure 1.1 Linux roadmap (CLI is the abbreviation for Command Language Interpreter,
    explained in section 3.4)'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'of interlocking subsystems that you can run on Linux. At the bottom is the
    Linux kernel itself, and built into it two modular drivers, one for the network
    and one for another peripheral, perhaps a disk.


    On top of the kernel sits a shell and on top of that a wealth of commands. These
    can be used to drive the system by typing commands at the keyboard.


    The X-Windows system also sits on top of the kernel. It provides the basic mechanisms
    for handling the display. You then have a choice of desktops and window managers
    which give the system a specific ''look'' and feel''.


    The application programs then ride on the desktops, and make use of services such
    as databases and networking.


    # EXERCISES


    +   1.1 Visit the website http://www.linux.org and follow some of the links.


    +   1.2 Read the GPL at http://www.fsf.org and compare it with the licence on
    a conventional commercial software product.


    +   1.3 If you know anyone who uses Linux, ask them about their experiences.


    # 1.3 Linux distributions


    A working Linux system consists of many hundreds, sometimes thousands, of files.
    A kit which contains all the files and some programs to copy them to their right
    places on the hard disk is called a distribution. Distributions can also include
    printed instruction books, registration cards, CDs of application programs and
    in some cases advertising material such as T-shirts and car stickers.


    Distributions are manufactured by either commercial or voluntary organizations.
    Because the software in a distribution is released under the GPL it is always
    possible to obtain one almost free of charge.


    If you would like to experiment with Linux before installation you can use the
    Knoppix distribution to bring up Linux from a CD-ROM without altering anything
    on your hard disk.


    One of the most commonly used distributions is RedHat Linux, created by Red Hat
    Inc. of Raleigh, North Carolina, USA. In the'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'interests of simplicity the worked examples will be shown for version 9.0 of
    this distribution, current at the time of writing. However almost everything in
    this book is equally applicable to SuSE, Debian, Yellow Dog and many other distributions.
    In time you will choose one or more distributions that suit your needs from the
    many that are available.


    # Exercise


    +   1.4 Visit the websites of at least three distribution manufacturers. Most
    of these can be found by following links from http://www.linux.org. Compare their
    products and make a note of the version number of the most up-to-date version
    of each distribution.


    # 1.4 How and where to obtain a distribution


    All major distributions can be downloaded free of charge from the internet. As
    a first-time user you will probably find this process daunting. My advice is to
    start off by buying a distribution on CD-ROM and only attempt to download distributions
    once you have some experience using Linux on the internet.


    You can buy a distribution in two ways. The distribution suppliers ''boxed sets''
    which contain the software on CD-ROM, a printed manual and registration cards
    shrinkwrapped in a cardboard box. Alternatively a number of vendors offer ''cheap
    disks'' which are in effect clones of the major distributors'' disks at low prices.


    Because the provisions of the GPL explicitly forbid any restrictions on copying
    Linux the cheap disk versions are completely legitimate. However, to protect the
    considerable investment some distribution manufacturers have put into their products
    we are seeing a spate of odd strategies designed to shepherd the towards buying
    commercial boxed sets. These include trademarks, copyrighted images displayed
    when the computer is started and non-GPL software included on the disks.


    In general, boxed sets are the easiest way for a first-time user to obtain a distribution.
    They may also include telephone and e-mail support as part of the package, which
    can be very useful initially. Cheap disk versions contain the same software without
    the helpful installation guides or the support. They are a good'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'way of buying further revisions of a distribution in order to upgrade running
    machines.


    High street computer shops often stock the boxed sets and occasionally the cheap
    versions as well. However, it is worth checking the version numbers before buying,
    as slow turnovers mean that versions over a year out of date are being offered
    for sale. These distributions work but do not have the most up-to-date revisions
    of the software.


    More specialized shops, particularly if the staff are themselves Linux users,
    offer a better service.


    Distributions can also be bought by mail, telephone or secure internet ordering.
    I have been very satisfied with the service I have received from The Linux Emporium
    of Walling, http://www.linuxemporium.co.uk/. I hasten to add that I have no connection
    with this business, other than as a customer.


    If you are in business in the UK and use Linux it is possible to reclaim input
    value added tax (VAT) on the software part of Linux distributions. The printed
    manuals do not carry VAT. Because of this it is important to check your receipt
    carefully the VAT component of an order for both software and manuals may not
    be the expected fraction of the total invoice amount.


    # EXERCISE


    +   1.5 Review the results of the previous exercise. Choose which distribution
    you would like to use and obtain a copy.


    # 1.5 Installing Linux


    The installation process varies greatly between distributions, and between revisions
    of the same distribution. Because of this it is impossible to give a step-by-step
    guide which is applicable in all cases. However, all installations have to do
    the same things and in this section I will explain in general terms how the installation
    process works and what each step does.


    Before starting installation it is useful to find out what hardware you have and
    how it is configured. If the computer you are using has another operating system
    already installed on it make a note of any information about the hardware you
    can glean from its setup pages. In particular make a note of the type memory size
    and settings of the graphics card and the type and settings of the sound card.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'The first step in the installation process is to load and run the Linux kernel.
    With many modern machines all you need to do is insert the first CD of the Linux
    distribution in the CD-ROM drive and start the computer. With older machines that
    cannot use the CD-ROM as the boot device you must first copy the kernel to a floppy
    and start the installation process.


    You will find the rewrite program included in almost all distributions. This program
    copies enough of Linux onto a floppy disk from the CD to get the installation
    started. It is called rewrite because it writes to the raw disk, ignoring any
    file structure that is already on it. The installation instructions which came
    with your distribution will explain exactly how use rewrite. Usually this involves
    copying an image file (a file that contains exactly the same data, formatted in
    the same way, as a floppy disk) from the CD to the floppy. Remember that this
    will erase everything on the floppy.


    If you want to install Linux onto a computer that does not have a CD-ROM drive,
    but does have a network connection, the easiest way is to use rewrite to make
    a network boot disk and then use this to start the installation process. You will
    also need to copy the installation CDs from your distribution onto another machine''s
    hard drive; this will require up to 2 gigabytes of disk space. This copy of the
    CD is then shared to the network and used in place of a CD-ROM. Once again, if
    you have a distribution that allows you to do this, simply follow the instructions.
    It is possible to install Linux onto a machine that has neither a CD-ROM nor a
    network port. This involves loading the software through either the printer port
    or a serial connection. Before doing this you should read the sections on networking
    in later chapters, and ideally gain some experience of a more conventional system
    first.


    Once the kernel is running on the target machine (the computer on which you are
    installing Linux), it will search the machine to see what hardware is available,
    then it will start the installation process itself.


    The next step is partitioning the hard disk drive. It is convenient to store different
    kinds of information on different parts of the disk, called partitions. A Linux
    installation normally uses two or three partitions. These are the root partition
    which contains almost all of the original files, the optional boot partition from
    which the kernel is loaded when the computer starts, and swap partition which
    is used by Linux as temporary storage for'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'tasks which are not doing anything at the moment. You only need a boot partition
    if you have an older computer which has to load the kernel from the first part
    of the hard disk.


    The installation programs supplied with many distributions divide the hard disk
    into partitions automatically for a simple installation, and will give you the
    option of leaving a previously installed operating system untouched. If the installation
    program cannot create the partitions automatically, or if you want to experiment
    with more complicated partitioning schemes, you can choose to partition the disk
    manually. The hard disk on the computer I am using to write this book is divided
    into fifteen partitions and has four different operating systems installed.


    Once the hard disk has been partitioned the installation program will make filesystems
    within the partitions. This is roughly equivalent to taking a blank sheet of paper
    and ruling lines on it to turn it into a form, making it ready to have information
    written on it.


    The installation program will, somewhere around this stage, pause and ask you
    what optional software you want to install. The first time you perform an installation
    it is probably best to accept the installation program''s advice and select whatever
    it thinks is a normal or default system.


    The longest part of the installation comes next. The installation program will
    copy all the files containing the Linux system onto the hard disk. This can take
    anything between ten minutes and several hours depending on the amount of software
    to be installed and the speed of the hardware.


    Once the software is in place the installation program will attempt to find out
    what sort of graphics card is installed in your computer and what modern hardware
    this process is often completely automatic. With an older machine it is sometimes
    necessary to tell the installation program what hardware you have.


    Monitors are quite easy to identify – they usually have a maker''s name and model
    number printed on them somewhere, underneath or at the back. Graphics cards can
    be more troublesome. The best way of identifying one is to find the original handbook
    that came with the card. If the computer was already working – with another operating
    system – when you first obtained it may be able to find the details of the card
    within that system''s settings. It is also sometimes possible to identify a graphics
    card by looking in the /proc filesystem, this is'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'described in Chapter 3. If all else fails the only solution may be to remove
    the card from the machine and look for the maker''s name and model number.


    Once the graphics card and monitor have been identified the installation program
    will try out the maximum display resolution that it thinks is possible with that
    combination.


    If this produces a satisfactory display you can safely proceed to the next step
    of the installation. If not, you may have to experiment with the settings.


    The setup program may give you a choice of a graphical or text login. Only select
    the graphical login if you are completely satisfied that the previous step has
    correctly set up your graphics card and monitor.


    Finally the installation program will ask you how to set up the boot loader. This
    is a little program which loads the Linux kernel into memory and starts when your
    computer is reset. The default setting – to install the boot loader at the beginning
    of the hard disk – normally the correct one.


    If the installation normally offers you the opportunity to create an emergency
    boot disk, also known as a recovery disk, accept it. Label this disk and put it
    in a safe place. It will enable you to restart the machine if the boot loader
    is damaged.


    At some point the installation program will ask you to set the root password.
    This password must be quoted correctly to log in as root once the system is running.
    Choose a word or phrase which is not obvious. Your name, the names of your friends
    and family, and makes of car are too easily guessed. Opening a book at random
    and putting your finger on a word is safer, choosing two words and a number at
    random, giving a password such as working52expire is much more secure.


    You may also have the opportunity at this stage to add one or more users. Include
    everyone who will be using the system, giving them all distinct passwords, chosen
    as above. User logins will be explained in Chapter 3.


    If everything has gone correctly you will now have a working Linux system. If
    not, section 1.7 will explain some useful strategies for recovering from an installation
    failure.


    # EXERCISE


    +   1.6 Install your chosen distribution.


    ![](img/523b8b12cfa3c3d8f1ff0644bff32d59_20_0.png)'
  merge: -1
