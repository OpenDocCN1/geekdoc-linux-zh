  md: 'cache, normally HTTP, FTP or Gopher, the address of the cache machine and the
    port on which the cache listens is normally port 3128. The Gopher protocol is
    becoming rare, having been largely superceded by the World Wide Web.


    Once you have a working cache you can reduce the amount of disk cache used by
    individual users’browsers, possibly eliminating it altogether. This will save
    disk and backup time.


    If you want to use one computer as the cache for an entire LAN you must choose
    one that is fast enough to handle the network and disk’traffic involved. This
    is not a good application for an old, slow machine.


    Squid keeps log files in /var/log. You can look at these if you need to track
    down the cause of a problem with Squid – a rare event – or identify the cause
    of the problem if the cache is being misused.


    When you connect to a secure server that uses an encrypted protocol to carry sensitive
    data, for example when you use online banking, Squid cannot cache or even understand
    the traffic between browser and server. When a secure connection is established,
    the computer at each end sends a public key to the other. The public key is sufficient
    to encrypt a message for the computer that sent it out, but the corresponding
    private key, which is kept secret by the sender, is needed to decrypt it again.
    Creating the operation would take many years of computation. Each computer receives
    the other one’s public key and can send secret messages to the other but anyone
    listening to the connection cannot find out what the private keys are – and therefore
    cannot read the messages.


    Squid simply tunnels secure connections – passes them through completely unmodified.
    In almost all cases this is exactly what you want to have happen.'
