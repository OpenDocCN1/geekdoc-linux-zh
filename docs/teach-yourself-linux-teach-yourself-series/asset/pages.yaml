  md: '# 6.4 Network File sharing


    The Network File System (NFS) is frequently used to share files between Linux
    machines. NFS uses the Remote Procedure Call (RPC) protocol to communicate across
    any network. The RPC protocol, developed by Sun Microsystems, sits on top of the
    IP layer of TCP/IP and lets a program on one computer call a library routine on
    another.


    RPC effectively conceals the differences between the hardware of the two computers.
    The NFS layer uses this to make a filesystem on one computer appear on another.
    Differences between the systems are absorbed by the NFS and RPC layers, subject
    to a few restrictions, there is very little difference between a filesystem mounted
    on a local drive and one mounted over NFS.


    Files are exported by an NFS server. This is a machine which has the nfs daemon
    programs installed.


    Each line in the file /etc/exports on the server describes a part of the local
    filesystem to export, some options and a rule describing the computers that are
    allowed to use the exported filesystem.


    For example you can create (log in as root) a directory called /sharedfiles and
    use the command /sharedfiles


    ```

    chmod a+w /sharedfiles

    ```


    to make it writable by any user. Then, as an ordinary user, copy a few files into
    it.


    Next edit /etc/exports (this time as root again) to add the line /sharedfiles
    *


    which, will share this directory to any machine that asks for it. The NFS export
    daemon has to find out about the change. The command


    ```

    exportfs -r

    ```


    will tell the daemon. This command has to be entered as root. If you began with
    either /etc/exports or an empty file, the daemon will not be running. In this
    case (as root) /etc/rc.d/init.d/nfs start


    then wait for everything to come up.'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'You have now set up a simple NFS server and can test it using the showmount
    command. Type

    showmount -e localhost


    as root to see the filesystems exported by this machine. This command should give
    the same results on any computer on the network if you enter the server''s name
    in place of ''localhost''.


    Now you can go to another machine in the same network and mount the exported filesystem.
    As root create a directory for the mount point and mount the exported filesystem
    on it. For this example I am going to call the server ''titania''. Type


    ```

    mkdir /imported

    mount titania:/sharedfiles /imported

    ```


    and the shared filesystem will be mounted. You can check this by typing


    ```

    ls /imported

    ```


    and then look at the data in the files as well.


    There are two common reasons for this to fail. Firstly there are simple typing
    errors. The error messages NFS can be misleading. The second reason is that some
    NFS servers will not allow access if they cannot find the client machine either
    in their /etc/hosts file or by looking it up a nameserver.


    An NFS mount can be added to /etc/fstab, just like a mount of a local disk. It
    is possible to mount NFS filesystems when the client machine starts and unmount
    them again at shutdown.


    If an NFS server shuts down and restarts it is quite common for clients to keep
    running – some NFS operations will keep retrying for a long time. This is not
    without its problems – sometimes it can be difficult to mount a filesystem which
    is mounted on a server which has been shut down. Automount is a partial solution
    to this. I will explain how to set it up in the next section.


    NFS works well with diskless machines. These are computers which do not have their
    own disk drives but make use of disks on other machines over the network. When
    you switch on a diskless machine it uses a protocol such as DHCP to find out its
    IP address, loads its operating system over the network and starts it. Then it
