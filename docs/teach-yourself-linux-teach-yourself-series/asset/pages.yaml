- img_proc: true
  md: 'For example the command

    lpr fred.txt

    will print the file fred.txt, and

    ls -l | lpr

    will print the output of the ls -l command.


    This command places the data to be printed in a print queue. The queue is organized
    as a series of jobs, each job prints one or more files, each time you run lpr
    it creates one. You can look at the contents of the queue with the lpq command.


    You can cancel a job with the lprm command. As an ordinary user you can only cancel
    your own jobs. If you log in as root you can cancel any job.


    Most distributions include graphical front ends for these commands. You will normally
    find that you can print a file by dragging it to the printer, display the queue
    in a window and cancel jobs by clicking on them.


    If you are using lpd you can log in as root and use the lp command, or lpadmin
    and its relatives if you are using CUPS, to control your printers. You can abort
    print jobs, stop and start printers, close a queue so that new jobs cannot be
    added to it and change the order in which jobs will be printed.


    Each printer has one or more filters used with it. A filter is a program or script
    which processes the files to be printed before sending them to the printer.


    Some very simple printers can only print text. The filters used with these printers
    do little more than pass on the text from the job to to the printer.


    Printers with more capabilities need to be able to print lines, circles, curves,
    bitmap graphics and text in a variety of fonts.


    The easiest way of doing this is to have the various programs, such as graphics
    packages and word processors, produce their output in a standard format. The filter
    then conberts this format into something that a particular printer can understand.


    Many printers, particularly those manufactured by Hewlett-Packard, use a format
    called Printer Control Language (PCL).


    Alternatively there are printers that use PostScript format. This format was developed
    by Adobe Systems Inc. Unlike many proprietary formats this one is well documented,
    both a reference'
  merge: -1
