- img_proc: true
  md: '# 3.1 Types of data


    This section explains the types of data you will find in files on your Linux system.
    If you have used a computer before you may be familiar with at least some of these.


    Computers are made from huge numbers of electronic switches which can be on or
    off. Internally they use a number system which called *binary* which uses only
    two digits: zero and one. The position of each switch, off or on, represents a
    zero or an one. A binary digit is often referred to as a *bit*.


    Decimal numbers – the sort we use every day – to nine, and each digit has ten
    times the significance of the one to its right. This is called working in base
    ten. Binary numbers work the same way, except they use base two. Each digit has
    twice the significance of the one to its right.


    The binary number 1011 is ‘eight plus plus one’ or in other words eleven in base.


    Writing numbers in binary makes it clear which switches are on or off, and this
    is often very useful when working with a computer’s hardware. Unfortunately they
    take a lot of space to write. The number 50,000 in binary is 1100001101010000
    – sixteen digits. Because of this it is common practice to write some numbers
    to base sixteen, this way of writing is called *hexadecimal*. Hexadecimal (often
    abbreviated to hex) uses the symbols 0–9 and A–F to represent sixteen digits.


    | Decimal Binary Hex Decimal Binary Hex |

    | 0 | 0000 | 0 | 10 | 1010 | A |

    | 1 | 0001 | 1 | 11 | 1011 | B |

    | 2 | 0010 | 2 | 12 | 1100 | C |

    | 3 | 0011 | 3 | 13 | 1101 | D |

    | 4 | 0100 | 4 | 14 | 1110 | E |

    | 5 | 0101 | 5 | 15 | 1111 | F |

    | 6 | 0110 | 6 | | | |

    | 7 | 0111 | 7 | | | |

    | 8 | 1000 | 8 | | | |

    | 9 | 1001 | 9 | | | |


    Since the number 16 is 2×2×2×2 each hexadecimal digit represents exactly four
    binary digits. By using the table above, a hexadecimal number can be converted
    to binary and back by eye. The number 50,000 is C350 in hexadecimal. By looking
    at the table you can convert it to binary:


    ```

    1100 0011 0101 0000

    ```'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'I have left spaces between the blocks of digits to make this clearer.


    Data in files is organized as bytes, binary numbers with eight digits. Because
    each binary digit can be a zero or one the number of possible bytes is the same
    as the result of multiplying eight twos together – 256. A byte is usually used
    to represent a number in the range 0–255.


    Some files contain human-readable text in which one or more bytes represent each
    character. There are two common ways of arranging this. Unicode is slowly gaining
    acceptance because it can handle the alphabets of many languages at once. However,
    the older American Standard Code for Information Interchange (ASCII) is far more
    widely used. This can represent the ten digits, the letters of the Roman alphabet
    and even punctuation marks, storing one character to a byte. It uses byte values
    0–31 to represent controls such as tab or newline, 32 is space and 33–126 are
    printable characters. Value 127 is delete and 128–255 can be used for special
    characters. The special characters are not standardized and can give unexpected
    results.


    All files contain binary data, even though some data is readable text. It is common
    practice to use the term ‘binary file’ to describe any file containing anything
    that is not ‘binary’. Examples of binary files are images and sounds.


    Files containing programs are of two kinds: the source which is the program in
    a text form which is, with some knowledge, readable by humans. The computer cannot
    directly understand this form. The source is translated by a program called a
    compiler into an executable form. This is a list of simple instructions which
    the computer can carry out. This form of the program is often referred to as ‘the
    binary’.


    # 3.2 Sessions and logging in


    Before using a Linux system you log in by entering a username and password.


    This is both a security feature – unauthorized access to a system can be caught
    at this point – and a way of identifying the files and settings needed for a particular
    person’s session.


    When running on a desktop computer Linux creates a number of text sessions, usually
    six. This is similar to having six separate text-only computers running at once.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'At the same time, if the X-Windows server is running, Linux will have a GUI
    (Graphical User Interface).


    You can switch between sessions by pressing Ctrl-Alt-F1 for the first session,
    Ctrl-Alt-F2 for the second and so on up to Ctrl-Alt-F6 will then switch back to
    the GUI.


    The text sessions are always present, even though many systems they will be invisible.
    The GUI is created by a suite of programs which is optional. It is possible to
    set up a Linux system which has no graphics; this is sometimes a very useful thing
    to do.


    The GUI can be started in two ways. If you chose graphical login during installation
    the GUI will appear towards the end of the startup sequence and display a box
    inviting you to log in. If the system has been set up for text login a prompt
    will come up on the screen, and you can start the GUI with the startx command
    once you have logged in.


    In either case you can enter a user name and password that you set up during installation
    – this must be done accurately – and you will be logged in.


    Once logged in, the system will give you access to your files – which are separate
    from those of any other user.


    The way in which the files are stored is similar to a room full of lockers. The
    names of the owners of the lockers – the user names – are written on the locker
    doors. Each owner has a key – the password – which enables them to open only one
    locker. Within the locker there can be objects – that person’s files – and containers
    such as boxes and bags. The containers are used to keep related objects together
    and their contents can include more containers, for instance a small box can be
    kept inside a large one. The owner of the building – the person who can log in
    as root – has a master key which can be used to open any locker. They can use
    this master key to help someone who has lost their own key or forgotten their
    password. There are also other rooms in the building – equivalent to the files
    which are owned by the system – which the ordinary people who come in to use the
    lockers can not see at all.


    # EXERCISES


    +   3.1 Make sure you can see the GUI login box. Log in using one of the user
    names you set up during installation. You should now see the desktop for the distribution
    you are using.'
  merge: -1
