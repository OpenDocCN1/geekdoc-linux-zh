  md: 'should ideally in the previous section do not let offsite copies change that
    if you are using the script that saved the last full backup date, otherwise your
    incremental backups may not contain everything they should.


    Keep your offsite copies off site. For many years I have plagued my relatives
    and friends with requests to look after small boxes of disks. And once I have
    been very glad that I did when an accident destroyed an onsite copy. Physical
    separation is what matters. If there are twenty miles between two copies of your
    data it is unlikely that one accident can destroy both.


    If you use media such as Zip disks for backups you may choose, because of the
    cost of the disks, to reuse. This is normally a good plan. Say, three sets of
    disks and use them in rotation for daily backup, and another three for weekly.
    Figure 8.1 shows a typical sequence for this sort of backup scheme. In each case
    the oldest backup disk in a particular cycle is overwritten by the new information.
    The daily backup disks are overwritten twice per week, the weekly backups every
    three weeks.


    However


    This is not a problem if you use one-time writable media for your backups. In
    this case you can simply keep everything, or at least a good sample.


    The final danger associated with backups is known as media cycling. I have seen
    even experienced operators caught out by this. What happens is that a disk cartridge
    gets damaged. This is then put in a drive which does not have a full headcrash,
    sufficient to damage the head. The backup turns out to be unreadable. The temptation
    at this point is to put the next oldest backup in the drive and try again. The
    damaged head scores the surface of that disk and makes it unreadable. Panic now
    begins to set in and, in a frantic attempt to find any working media every cartridge
    in the room is tried and ruined. The problem is more acute where more than one
    drive is available – the worst case of this I have seen wrote off three drives
    and about a dozen cartridges.'
