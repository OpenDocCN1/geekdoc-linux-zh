    # 4.1.3 SQL databases (optional)


    Structured Query Language (SQL) is a way of accessing databases which is supposed
    to be standard. However, there are some differences between servers-the programs
    that manage the databases. To get around this, and to provide a standard programming
    interface, the ODBC package includes drivers for most common database servers.
    When you run a program that uses ODBC it will behave the same way regardless of
    which database it is connected to.


    Setting up an SQL database is straightforward. The only problem you may encounter
    is that a many setup errors, such as missing drivers, result in a program crashing
    with either no explanation or an error message which is critically obscure. The
    real solution to this is to get the setup instructions for the package you are
    using and follow every step to the letter.


    The basic SQL syntax varies slightly between databases. One of the most confusing
    differences is that the mysql monitor has a SHOW DATABASES and a SHOW TABLES command
    whereas the postgresql does not. Instead PostgreSQL creates database tables called
    pg_databases and pg_tables which contain the same information and can be examined
    with the SELECT command.


    The package SQL-Ledger at http://sql-ledger.org/ is a complete small-business
    accounting suite which uses an SQL database.'
