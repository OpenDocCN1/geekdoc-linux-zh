- img_proc: true
  md: 'The geometry of a hard disk is usually given in the form of three numbers.
    These are the number of cylinders, the number of heads and the number of sectors
    per track. Multiplied together these three numbers give the total number of sectors
    on the disk. The number of sectors multiplied by the number of bytes, roughly
    the same as characters, which can be stored in each sector gives the capacity
    of the disk – the amount of information that it can hold. The place where a particular
    item of information is held is described by three coordinates – the cylinder,
    head and sector numbers.


    When you reach the partitioning step in the installation you can choose to partition
    the disk manually. The installation program will then give you the choice of a
    tool such as Disk Druid which has a simple graphical interface or the fdisk program
    which is more powerful but more difficult to use.


    If you have an old machine you should create a boot partition. Ideally this should
    be at least 10 megabytes in size and created as close to cylinder one as possible.
    If you want to leave room for upgrades, make this partition about 100 megabytes
    long. This partition will contain the files used to start the Linux kernel.


    Normally you will need to create a swap partition which should be about four times
    the size of the memory in your computer. For example, if you have 64 megabytes
    of RAM a suitable size for your swap partition is 256 megabytes.


    You should also create a root partition to contain the ordinary files. The mount
    points of the boot and root partitions are /boot and / respectively. You may need
    to enter these values, which will be explained in a later chapter, if you partition
    the disk manually.


    With unusual video cards it is possible that the installation program may fail
    to display anything. The way to bypass this problem is to select *textittext installation*
    at the beginning of the installation process. You can then add graphics once the
    basic system is installed.


    If the installation process runs to completion but does not set up the graphics
    card correctly, the result may be a system which goes through the startup sequence
    and then fails when it should begin to display graphics. The first thing to do
    in this case is to run the installation procedure but select text rather than
    graphical login.


    At this stage you may have a system which will start up with a text display, but
    which has no graphics. The next step is to log in'
