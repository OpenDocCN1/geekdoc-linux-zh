  md: '# glossary


    absolute path | Description of how to find a file that is independent of the current
    directory.


    always on | A network connection that does not depend on dialling a phone call.


    bandwidth | Measure of the speed at which data can be transferred. Derived from
    radio practice this use of the word is not strictly correct.


    baud rate | The rate, in bits per second, at which an interface sends data. The
    useful transfer rate is slower as not all bits contain data.


    binary | A number system that uses the digits 0 and 1. Any data other than human-readable
    text.


    BIOS | Basic Input/Output System.


    bit | A binary digit, 0 or 1.


    boot loader | The program that runs when you start your computer. It loads the
    operating system.


    bootstrap | The process of loading an operating system. Because this has to be
    done before the drivers which know how to load a program from disk are loaded
    this operation is analogous to lifting yourself by pulling your own bootstraps.


    builtin | A command which is part of a shell, as opposed to a command which is
    a separate program.'
