  md: 'The fsck program will recover the filesystem on the disk and show you what
    it is doing at each step. Enter the same command again and note that this time
    fsck finds nothing to do.


    The command


    ```

    tune2fs -j /dev/sdb4

    ```


    will add a journal to the filesystem, converting ext2 to ext3.

    mount again now using the same command:


    ```

    mount, /dev/sda4 /mnt/zip

    ```


    and once again unplug the cable and unmount the drive.

    Now plug the drive in again and mount the drive – same command again. This time
    the ext3 recovery will take over and you will see something like this in the log:


    ```

    EXT3 FS 2.4-0.9.18, 14 May 2002 on sd(8,20),

    internal journal

    EXT3-fs: recovery complete.

    EXT3-fs: mounted filesystem with ordered data mode.

    ```


    Compare the time taken by fsck to recover an ext2 disk with the time taken for
    an ext3 disk to recover itself from the journal.


    # 9.2 Modules and drivers


    The Linux kernel can be added to once it is running by loading kernel modules.
    These modules extend what the kernel can do. You can load a module to operate
    a digital camera, for example, or one that adds a networking protocol.


    The advantage of using modules for these enhancements is that they can be loaded
    and unloaded while the system is running. Only the modules which are needed are
    loaded at any time, and they can be unloaded when they are no longer in use.


    Because modules become part of the kernel they can do anything – change any data
    and access all the hardware. To prevent this becoming a security problem Linux
    imposes a restriction that only someone logged on as root can explicitly load
    and unload modules.


    Any user can run this command


    ```

    /sbin/lsmod

    ```'
