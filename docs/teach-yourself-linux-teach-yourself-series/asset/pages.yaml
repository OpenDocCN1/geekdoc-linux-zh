- img_proc: true
  md: 'The tcl program is a basic, text-only shell that runs simple TCL scripts. It
    is a good way of trying out simple scripts.


    The windowing shell, wish, is similar to tcl, but has the TK components built
    in. You can use it to create graphical applications.


    The twish shell is an enhanced form of wish which includes the tix extensions.
    Use it if you want the more complex widgets, the directory listboxes or anything
    else in the tix extensions.


    The easiest way to begin with TCL is to try out a few commands with tcl.


    Type tcl to start the shell. It will display a percent sign (%) to prompt you
    for a command.


    The first command to try is set, which sets a variable to a value. It ‘returns’
    the new value of the variable. Try this:


    ```

    [unclebob@titania unclebob]$ tclsh

    % set Jim 3

    % set Fred 7

    7

    ```


    This has the variable Jim to have the value 3 and Fred to have the value 7. Now
    we can do something with the variables.


    ```

    % puts $Jim

    3

    ```


    The puts command prints its argument. The dollar sign ($) before puts tells the
    TCL interpreter ‘substitute the value of Jim here’.


    ```

    % puts [ expr $Fred + $Jim ]

    10

    ```


    This is a slightly more complicated example. The expr command works out the value
    of the expression, after the interpreter has replaced $Fred and $Jim with their
    values. In this case it out 7 + 3 = 10, this is the return value from the expr
    command. Because the command is in square brackets the interpreter replaces it
    with its return value and finally gets around to executing the puts command –
    which, after all the substitutions, has been converted into


    puts 10


    which, as you would expect, prints the number 10.'
