    # 8.3.9 Potential difficulties with restored files


    Make a full backup of a filesystem, delete some files, move others to a different
    directory, and then make an incremental backup. Now restore the filesystem from
    the full backup. Restore the incremental backup over it. All the deleted files
    will reappear, and the moved files will be in both places.


    This is not really a problem – all that happens is that extra files turn up after
    a full restore and have to be deleted by hand. It is a potential problem when
    restoring to a partition that is nearly full and may be necessary to stop after
    restoring the full backup and delete a few files that are known not to be wanted.


    Some databases use ‘sparse files’. These are files in which the individual data
    records are separated by large blocks of zeroes, which potentially can be filled
    in information as the database is used. Linux can be set up to store these files
    efficiently by not allocating disk space to the unused areas. There are options
    you can set so that you can back up and restore this sort of filesystem without
    the unused areas becoming allocated during the restore. Look in the documentation
    for the database, and the manual page for tar.


    Each file on an ext2 or ext3 filesystem has three timestamps. The ‘last modified’
    time or mtime is a record of the time when the data in the file was last changed.
    The ‘last changed’ time or ctime records when the information held about the file
    in the'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'directory entry, such as the permissions, was last altered. The ‘last accessed’
    time or atime is a note when the file was last accessed, even if it was only read.


    The mtime is the timestamp that is normally displayed by the -t option ls. You
    can see the atime with the options -lu and the ctime with -lc.


    Reading a file changes the atime only. Writing to it changes the mtime as well.
    Changing its permissions with chmod changes the ctime but not the mtime or the
    atime.


    When a file is backed up and restored with tar the atime and ctime are set to
    the time of the restore. - N (--newew) option looks at both the atime and the
    ctime and accepts the file for backup if either is later than the specified time.


    If you restore your system from a full backup the ctimes on all the files will
    change to the time of the restore. This will be later than the time of your last
    full backup. An incremental backup made with the -N option will find that every
    file in the system is later than the specified time, and the incremental backup
    will become a full backup.


    At the time of writing there is no convenient fix for this problem. Linux complies
    broadly with the POSIX standard, which defines what a running program can and
    cannot do. Unfortunately, it puts restoring the ctime from a backup in the ‘cannot’
    category.


    There are two ways around this problem. You can use the


    ```

    --newew-mtime="YYYY-MM-DD HH:MM:SS"

    ```


    form of the option, which ignores the ctime for your incremental backups. This
    will work, but occasional changes will not be backed up. The lost changes will
    not lose you any data if you have to restore again, but you may have to change
    the permissions on some files after the restore. Alternatively you can make a
    new full backup.


    Do not try changing the saved time of the last full backup as a way of working
    around this problem unless you are keeping every backup for ever as you find that
    some genuinely changed files are dropped from the backup as a result.


