- img_proc: true
  md: 'The -b option makes keep a backup copy of the unchanged files. Because the
    name of the directory in which I was applying the patch was not the same as the
    directory where the patch was created I used the -p1 option to remove the first
    part of the path - everything up to the first slash - from the paths in the patch.
    Setting -F5 increases the ‘fuzz’, the extent to which patch will accept source
    files that do not correspond exactly with the patch.


    I added the --dummy-run option the first time I tried to apply the patch This
    told me that the patch would work without actually changing anything. When I had
    all the other parameters right I removed this option.


    Then I rebuilt the modules – the patch does not affect the resident kernel. Finally
    I used rmod to unload the old versions of the modules, plugged in the drive and
    everything worked.


    Installing a kernel patch is probably the most complex thing you will ever do
    with Linux unless you decide to work on the kernel yourself. Once you have learned
    how to apply kernel patches you can consider yourself afledged member of the Linux
    community. You can handle any problem that anyone else has solved by taking their
    solution and applying it to your kernel.


    # 12.4 Creating packages


    There are several package managers which run on Linux. The one you are most likely
    to use is the RedHat Package Manager (RPM). This program installs packages of
    files onto the system, maintains them, and can uninstall them. The packages RPM
    uses are held in files with the file type .rpm, such as designtools.rpm. Information
    about the package is usually built into the file name like:


    ```

    camera-3.0.3-3.i386.rpm

    ```


    This file is package called camera, version 3.0.3, build 3 for Intel 386 family
    processors.


    An RPM package is an archive containing the files, and a header describing them.
    The rpm program installs a package by copying the files from the archive to its
    correct locations in your file tree and then making a note in its database of
    which files it has installed.


    The rpm database contains information about each file installed and, because it
    is writable only by root, you can at any time verify'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'a package to see if all its files still match their database entries. A file
    which does not match is automatic evidence of the system having been tampered
    with – some files are legitimately changed by the package itself.


    Because rpm knows which files each package contains it can often cleanly erase
    a package, leaving nothing behind.


    Much software that runs on Linux is portable between several different operating
    systems. This sort of software is often distributed as a tarball, an archive made
    with the tar program and usually compressed with gzip.


    You can turn your own software into part of the rpmbuild program – this used to
    be a part of rpm itself. Rbuild normally expects to convert a tarball into an
    rpm, so the easiest way to make something you have written into an rpm is to start
    off by making a tarball. Figure 12.2 is a map of the routes by which the different
    file formats can be converted into one another.


    I have written a program called tsplit which splits up large files. I regularly
    use it to split a full backup of this computer over five CDs.


    To make tsplit into an rpm needs only four files.


    +   1 tsplit.c This is the source code of the program.

    2 tsplit.1 The man page for the program.

    3 Makefile The instructions for building the program.

    4 tsplit-1.0.3-1.spec The instructions for building the rpm.


    You can make a man page for your program by creating a text file formatted in
    the way described in the man page ‘howto’, available on http://www.linux.org.
    Your manual page will be formatted for display or printing by a program called
    groff – or one of its relatives. These programs turn simple commands that you
    put in the text file into various kinds of formatting.


    You can display the full list of formatting commands by typing

    man 7 groff_man


    The version number of the package, 1.0.3-1 is built into the file name of the
    spec file, and nowhere else.'
  merge: -1
