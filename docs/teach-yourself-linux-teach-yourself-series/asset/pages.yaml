- img_proc: true
  md: 'This chapter describes some interesting things that you can do with Linux.
    Some of these things need hardware that is not found in ordinary desktop computers,
    so you may not be able to try all of these out for yourself.


    # # 12.1 Embedded Linux


    The chip that is buried inside a video recorder or a mobile phone to scan the
    keyboard, work the display and control the appliance itself is called an embedded
    processor.


    For many years embedded processors were mainly programmed in assembler and used
    very small amounts of memory. Over the past few years memory has become much cheaper
    and smaller, while the functions demanded from an embedded processor have grown.
    There is now a trend towards embedded processors using minimal versions of Linux.
    While this imposes a penalty on the system design – the kernel occupies several
    megabytes – the benefits in reduced development cost and time to market more than
    outweigh the penalties. Using Linux on an embedded processor has the enormous
    advantage of providing a scheduler, filesystem support and networking at minimal
    cost.


    There are a number of Linux distributions designed specifically for embedded processors.
    You can find typical examples of these at http://www.mvista.com/, http://www.denx.de/
    and http://www.redhat.com/embedded/.


    An embedded distribution has to be able to run without a hard-disk attached to
    the processor. There are two ways it can do this. Either it can create an image
    of a disk in RAM, or it can make use of a hard disk on another machine by mounting
    its root filesystem over NFSs at an early point in the boot sequence, in exactly
    the same way that a diskless workstation makes use of a disk on another machine.


    Embedded processors commonly start up by using a bootstrap program to load a compressed
    kernel from whose contents cannot be changed by the running system. This Read-Only
    Memory (ROM) exists in several forms. Current practice is to use Electrically
    Erasable Programmable Read-Only Memory (EEPROM) which can be programmed ‘in circuit’
    with the memory chips physically attached to the processor board. At the same
    time the bootstrap loads a compressed initial ramdisk.'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'When the kernel starts up it first decompresses itself and the ramdisk. It
    then needs a filesystem held in an area of RAM rather than on a disk – as the
    root directory. On a conventional system the ramdisk contains the files needed
    to get the system started. An embedded processor often has a complete system in
    a much bigger ramdisk.


    The Embedded Linux Portal sits at http://www.linux devices.com/ has a lot of information
    about embedded Linux.


    Before starting work on an embedded system you can get some experience of this
    sort of programming, even though much of the software you will use in the real
    system, by working with an embeddable processor board.


    TQ Components http://www.tq-components.com/ are one of several companies that
    make a range of these boards. ‘starter kit’ containing a processor board and everything
    needed to get it working costs a little less than a basic desktop computer.


    To use it will need another Linux machine to use as the development workstation,
    and some means of communicating with the board, such as a serial connection or
    a LAN.


    Denx Software Engineering http://www.denx.de/ supplies a distribution of Linux
    which runs on many of these embedded boards. This includes a version of the kernel
    tailored for embedded use, and cross-compilers that you can use to generate code
    for the embedded processor from your PC.


    # 12.2 Real-time Linux


    The term ‘real time’ is intended to describe computing that keeps up with events
    happening in the real world. The variety of external events mean that ‘real time’
    can imply anything from ‘The computer ought to respond before the customer loses
    patience’ to ‘The machine stops working if we do not produce a result within one
    ten-thousandth of a second’. Often the shorter the time the computer has to respond
    the more disastrous results if it does not.


    The Linux kernel was not originally intended for real-time use. Some operations,
    particularly those which involve allocating or freeing memory, can take over a
    second. Linux allows tasks to be pre-empted – if a higher-priority task needs
    to run, a lower-priority one can be halted. However, the kernel itself is not
    pre-'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'empty. If a lower-priority task has, for example, requested more memory, and
    the kernel has wandered off to do a leisurely sift through the memory pool, the
    higher-priority task will not get a chance to run until the kernel finishes its
    interesting diversion. Meanwhile, deprived of commands, something catastrophic
    may have happened to the hardware your computer is controlling.


    The delay between an external event happening and the kernel giving control to
    the task that deals with it is called the latency. Reducing latency is a prerequisite
    for making Linux work in critical real-time applications.


    Low-latency versions of the kernel are available, for example Monta Vista at http://www.mvista.com
    have a commercial version. These depend on a complex series of modifications known
    as ''low-latency patch'' which make the kernel break up long operations into a
    series of short ones.


    There is an alternative solution called ''The Love Patch'' after its inventor,
    Robert M. Love. This takes advantage of the way in which the kernel runs on computers
    with more than one processor. On multiprocessor systems the kernel running on
    one processor can pre-empt the kernel on another. The Love patch extends this
    to allow a high-priority task to pre-empt the kernel. The Love patch is being
    integrated into the kernel itself, and will probably be a standard feature when
    the 2.6 kernel is released.


    FSM labs, http://www.fsmlabs.com/, distribute both free and commercial versions
    of RTLux. The Linux kernel has two schedulers, a very fast one to run real-time
    code, and the normal Linux scheduler runs when the fast one has nothing to do.
    This is an effective way of running time-critical code running under the fast
    scheduler does not have access to all the system calls – this does not matter
    for almost all real-time applications.


    Writing a real-time application for Linux, particularly if you already have some
    experience of real-time computing, is entirely straightforward. These are the
    steps involved in designing a typical:


    +   1 Find out exactly hardware you are using, and how much data is to be read
    or written to each interface.

    2 Investigate how much computation you need to do work out what is to be written
    to the interfaces.

    3 Make a list of all the things your application must do. Divide it into things
    that absolutely must be done on time, and things that can be deferred without
    causing a disaster.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# 4 Decide how the time-critical and non-critical sections of your application
    will communicate. Make sure that this cannot hold up the time-critical section.


    # 12.3 Configuring and compiling the kernel


    The Linux kernel itself is just another program. It may well be the largest one
    you will ever come across – but it can be modified and rebuilt with exactly the
    same tools as any other program.


    Because the kernel is so large and complex it comes equipped with some programs
    to simplify the process of creating the kernel binary.


    The kernel-building process – compiling, linking and, where necessary, compressing
    the program components – is largely automatic. In this section I will describe
    it briefly. Once you have built a kernel you will find that the documentation
    becomes easy to understand, and you will be able to build non-standard kernels
    if you need them.


    The things you can do if you rebuild the kernel are:


    +   - Tune the kernel to make more efficient use of the hardware in your computer.

    - Apply patches to correct kernel problems or add new features.

    - Add diagnostic printouts to help you identify problems.


    In theory you might be able to find and fix a kernel bug yourself, but in practice
    b bugs in new versions of the kernel are very quickly hunted to extinction – there
    are precious few left for you to stalk by the time the kernel finds its way onto
    a distribution disk.


    The kernel source files are usually in /usr/src/linux and its subdirectories.
    This is normally a symbolic link to the current version, which will be a directory
    with a name such as /usr/src/linux-2.4.20-containing the actual files.


    Building the kernel is controlled by the file /usr/src/linux/.config, which is
    created when you configure the kernel.


    Before building the kernel you should log in as root, and change to the /usr/src/linux/
    directory.'
  merge: -1
