- img_proc: true
  md: 'manual and a tutorial have been published by Adobe. PostScript is a plain text
    format and can be edited with an ordinary text editor. An example of PostScript
    is shown in Figure 5.1.


    PostScript is a vector format. If a PostScript file contains, for example, a circle
    drawn one inch in diameter, two inches from the top of the page and three from
    the left margin, the PostScript file describes it by listing those measurements.


    Some, not all, variants of PCL be birmap formats for graphics. The circle would
    be described by a list of dots to print.


    The advantage of vector formats is that they are very easily scaled and rotated.
    The mppage command can take a PostScript format file and edit it so that, for
    example, several pages of the original document are printed on one sheet of paper.


    Many Linux systems use PostScript or plain text as the standard formats for printer
    output. All programs that send output to the printer use one of these formats.


    When you print a file Linux passes it through a filter. The simplest type of filter
    will recognize plain text or PostScript by looking at the first few characters
    of the file and then do whatever processing is needed to prepare the file for
    the printer. Some systems, including CUPS, have a magic filter. This lets you
    a file in any of the formats it knows about to the printer. The filter will automatically
    work out what format the file is in and print it correctly.


    You can send print jobs over the network to printers on other computers. The computer
    with the printer is called a print server, and the printer is known as a remote
    printer or network printer, as opposed to a local printer which is connected to
