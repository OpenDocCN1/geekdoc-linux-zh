    # 3.8.3 Configuring X-Windows (optional)


    When an X-Windows server starts up it reads a configuration file called /etc/X11/X86Config.
    This file is created by the installation process. There are also some tools, which
    vary between distributions, that can change this file in a running system.


    In common with most configuration files in Linux systems this file is plain text,
    and can be edited with any text editor. If you want to experiment with editing
    this file you should first make a copy of a version of the file that is known
    to work – copy it to XF86Config.working or some similar name – so that you can
    safely reinstate the system if your changes stop the display working.


    The exact format of this file is documented. You can see the documentation with
    the command man XF86Config


    Note the capital letters in the name.


    The file contains a number of parameters, many of which can be ignored. If you
    have a very unusual graphics card or monitor you can adjust the graphics to work
    properly by making manual changes to this file. Some graphics cards have the unfortunate
    habit of failing completely if they are given an incorrect parameter. If you suspect
    that this may have happened, simply copy the last known working backup of XF86Config
    back to its original name and location, then try again. If the graphics card still
    does not work, shut down the computer and switch off, wait a few seconds and switch
    on again.


    All the colours which can be displayed on a screen are made up from mixtures of
    red, green and blue light. Red and blue give a purplish colour magenta; green
    and red give yellow; all three once make white. The screen is divided into tiny
    dots called elements or pixels. A graphics card tells the monitor how much red,
    green and blue light to show at each pixel. Some graphics cards can adjust the
    brightness of each colour at every point on the screen. Others can only display
    a limited range of colours chosen from a palette.'
  merge: -1
