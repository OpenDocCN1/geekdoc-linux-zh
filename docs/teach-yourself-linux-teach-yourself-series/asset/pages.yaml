- img_proc: true
  md: '# The following is a simple firewall which I have written to illustrate how
    to create a suitable one for your machine.


    # Manual firewall configuration. RB 8/5/03.


    ```

    *filter

    :INPUT ACCEPT [0:0]

    :FORWARD ACCEPT [0:0]

    :OUTPUT ACCEPT [0:0]

    ```


    # Refuse to forward anything originating on the internet


    ```

    -A FORWARD -i ppp0 -m state --state NEW, INVALID -j DROP

    ```


    # Pass anything originating in the LAN


    ```

    -A INPUT -i eth0 -s 192.168.0.0/16 -j ACCEPT

    ```


    # Similarly pass anything on loopback


    ```

    -A INPUT -i lo -j ACCEPT

    ```


    # The state machine rule that lets packets back in from

    # the outside world


    ```

    -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT

    ```


    # Accept the Unreachable, Time Exceeded, Echo and Reply ICMPs

    # This makes ping work.


    ```

    -A INPUT -i icmp --icmp-type 3 -j ACCEPT

    -A INPUT -i icmp --icmp-type 11 -j ACCEPT

    -A INPUT -i icmp --icmp-type 8 -j ACCEPT

    -A INPUT -i icmp --icmp-type 0 -j ACCEPT

    -A INPUT -i icmp -j DROP

    ```


    # Trap rejected connection attempts


    ```

    -A INPUT -i ppp0 -m state --state NEW -j LOG --log-prefix REJ:

    -A INPUT -i ppp0 -m state --state NEW -j DROP

    ```


    COMMIT


    *nat


    # SNAT is similar to masquerade, replaces source

    # address in outgoing


    ```

    -A POSTROUTING -o ppp0 -j SNAT --to 158.152.132.30

    ```


    COMMIT


    The line ''*filter'' selects the table ''filter'' – the normal default table –
    for the next few operations. The script then sets up three chains, INPUT, FORWARD
    and OUTPUT. Packets addressed to this machine go through INPUT, packets we generate
    through OUTPUT, and FORWARD carries packets we receive from one machine and pass
    on to another.'
  merge: -1
