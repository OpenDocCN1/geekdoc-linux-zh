    # 3.7 Special files


    Directory entries can refer to things other than files. They can be First In,
    First Out (FIFO) character queues, used to transfer data from one application
    to another.


    You can connect to the device drivers, small programs which transfer data to and
    from hardware devices, by reading and writing special files. These files, usually
    live in the /dev directory, are created with the mknod command. They contain two
    numbers. The major number associates a special file with a driver, and the minor
    number with a particular device handled by that driver.


    For example /dev/tty0 and /dev/tty1 share the major number 4 - they are both handled
    by the serial driver. They have different minor numbers, in this case 0 and 1
    because they refer to different hardware – the two serial ports on your computer.


    The device /dev/null is created by the system. Anything you write to it is permanently
    lost, any attempt to read from it returns a zero-length file. There are several
    internal devices like this, /dev/zero returns zeroes and /dev/random supplies
    random numbers, for example.


    # 3.8 X-Windows


    # 3.8.1 Client-server windowing


    The X-Windows system is the foundation of all GUIs used with Linux. The components
    of X-Windows are the server, one or more clients, a window manager, and optionally
    a display manager.


    The server is the program that operates the display hardware. It looks after your
    mouse and keyboard, and tells your graphics what to display.


    The display manager is optional. It is the program that puts the login screen
    and arranges it so that when a user logs in, ownership – and therefore complete
    control – of the display is given


    ![](img/523b8b12cfa3c3d8f1ff0644bff32d59_52_0.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'to that user. If the system is set up to use text login, rather than a login
    screen, the display manager may not be present at all.


    Clients are application programs, for example terminal emulators, games and word
    processors.


    Clients display their windows by connecting to a server and sending it messages.
    These messages tell the server to draw simple objects such as lines, rectangles
    and text. More complicated objects, such as buttons and text-entry boxes, are
    called widgets and are created by library software that joins together the simple
    objects to make complex ones. The common widget libraries include Qt, Motif, OpenLook
    and Athena.


    Because the connection between client and server is a normal socket connection
    – the same as any connection made over a network – the client and server do not
    have to be on the same computer.


    You can run a program on one computer and have its displays appear on another.
    This lets you borrow processor speed by running a program on a lightly loaded
    machine elsewhere in the network.


    The client only provides the ‘inside’ part of its windows. The borders, title
    bar and system menu are added by the window manager. Because of an application
    may change its look and feel when moved from one machine to another.


