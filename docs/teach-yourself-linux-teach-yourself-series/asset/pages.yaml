    When NIS is combined with NFS any number of workstations on a network can be made
    to behave identically. A user can sit down at any workstation, log in using their
    user name and password and find themselves in exactly the same home directory.
    This works very well for some purposes, such as graphics, where there is lot of
    user interaction. It goes wrong where the bulk of users are running disk-intensive
    applications as all the disk traffic has to cross a local area network which rapidly
    becomes overloaded.


    Diskless Linux machines are comparatively rare. Much more common is the machine
    which runs from a local disk drive and uses NFS to access a pool of shared files.


    NIS allocates user names and the numbers that correspond to them in one place.
    When computers with their own disk drives and password files are added to a network
    which is already using NIS, the result is a descent into anarchy.


    For example, let us assume that a user called ‘Castor’ is known to NIS, and the
    user has number 523. Castor can log in anywhere in the network and find his files
    under /home/castor – and nobody else has access to them. until someone adds another
    machine to the system. This computer has its own disk drive on which there is
    a freshly installed copy of Linux. Its owner, who has root access to his own machine,
    creates a user called ‘Pollux’ with user number 523. Instantly he has the full
    access to all of Castor’s files.


    The only real solution to this is to do one thing or the other. Either use NIS
    on every machine or none.


