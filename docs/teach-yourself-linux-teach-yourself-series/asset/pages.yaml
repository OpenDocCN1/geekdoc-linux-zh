  md: '# 7.1 PPP


    The Point to Point Protocol (PPP) is used to carry TCP/IP over serial lines –
    such as your modem connection to the internet. PPP has replaced the earlier Serial
    Line Internet Protocol, which is now effectively obsolete.


    You can use the Point to Point Protocol program, pppd, to set up and control PPP
    lines. The various GUI tools for configuring, starting and stopping PPP connections
    either send commands to pppd or edit configuration files that it uses.


    A PPP connection is a network segment with two interfaces – one at each end –
    which has an IP address. The PPP daemon can be told the addresses to use through
    its command line parameters, or it can learn them by querying the daemon at the
    other end of the line.


    Pppd is a very versatile program. You can use it to dial up a connection to a
    remote machine, manage a connection between two machines which are permanently
    connected by a cable or accept incoming calls.


    When you use pppd to dial into another system, such as your ISP, it first calls
    the chat command to issue commands to whatever you choose, then tell it to dial
    the call. When the modem at the far end answers, chat can send your user name
    and password.


    Alternatively the remote system may start using PPP at once. Pppd can then authenticate
    itself by sending ‘secrets’ – user name and password – as part of the PPP protocol.
    The Password Authentication Protocol (PAP) is the more common, though less secure
    way of doing this. Challenge Handshake Authentication Protocol (CHAP) is more
    secure as it uses a reasonably strong encryption to conceal the password.


    When you use pppd to make a connection to an ISP it can ask the ISP for the IP
    addresses of its first two DNS names.


    Because pppd is so powerful, and can accept a large number of options it is almost
    always run from a script, rather than the keyboard. The scripts which operate
    are in /etc/sysconfig/network-scripts. For each ppp interface that you have set
    up there is a file called if-pppn where n is the interface name, starting with
    ppp0 for the first one. If the interface uses chat to dial the call there will
    be a chat-pppn file as well. You will normally use the GUI tools to edit these
    files.'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'Because pppd has many options you will usually find an area in which you can
    enter any option – look at the pppd man page to see what options are available.


    One very useful option is ''demand''. This makes pppd only dial when there is
    something to send, and disconnect again when the link is not being used. The ''idle''
    and ''holdoff'' options let you adjust exactly when it will dial and hang up.


    The ''debug'' option makes pppd send a lot of information about its negotiations
    with the remote machine to system log. You can either read them in /var/log/messages,
    or edit /etc/syslog.conf to redirect them to a file or to the system console.
    The xconsole program lets you read console messages on a graphical screen, or
    you can read them directly on the first text screen – press Ctrl-Alt-F1 to see
    it.


    # 7.2 PLIP


    The Parallel Line Internet Protocol (PLIP) is a way of connecting two computers
    together through their parallel printer ports. This is often faster than using
    the serial port. The PLIP driver is normally a kernel module which is loaded automatically
    when the interface is set up with ifconfig.


    Older versions of the driver will only work if parallel port interrupts are turned
    on. Use this command:

    echo 7 >/proc/parport/0/irq

    substituting a different value if the irq of your parallel port is not 7.


    The command


    ```

    ifconfig plip0 192.168.100.0

    ```


    will configure the interface. You can substitute another IP address if it is more
    convenient.


    PLIP works by connecting five data output pins of one computer to five status
    inputs of another, and vice versa. You can make your own cable to do this – the
    instructions are in a comment in the source of the driver – or you can buy a laplink
    cable.


    You can either write a few lines of script to set up the interface directly, or
    create an ifcfg-plip0 file with an editor. A PLIP interface can be treated almost
    exactly as if it were an Ethernet'
  merge: -1
