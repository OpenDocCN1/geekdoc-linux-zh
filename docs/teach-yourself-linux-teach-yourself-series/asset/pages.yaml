  md: "TCL has some built-incommands that access files. The glob command makes a global\
    \ directory search and returns the matching file names. I did this in a directory\
    \ that contained all the files for a small search:\n\n```\n% glob *.html\nSF.html\
    \ index.html rifts.html ctts.html romance.html\nsk.html 080footer.html darkness.html\n\
    ```\n\nThe return value from the glob command is a TCL list containing all the\
    \ matching file names, in this case the HTML files. Lists are one of the most\
    \ useful things about TCL. They can hold any sort of data to match to glob - even\
    \ other lists - in order and they are very easy to manipulate.\n\nFor anything\
    \ more complicated than the last example it is worth putting your commands in\
    \ a script file. The file in this example is ~/bin/cat.tcl - remember that ~/bin\
    \ is in your path, so files in it with the correct permissions can be used as\
    \ commands.\n\n```\n#! /usr/bin/tclsh\nset N 1\nforeach File [ glob *.html ] {\n\
    \  puts \"$N. $File\"\n  incr N\n}\n```\n\nMake the file executable by typing\n\
    chmod u+x ~/bin/cat.tcl\n\nthen type\n./cat.tcl\nto run your script. It will list\
    \ the files that match the parameter to glob, and count them. The output will\
    \ look something like this:\n\n+   1. SF.html\n2. index.html\n3. rifts.html\n\n\
    When you run this script the glob is evaluated, and it returns a list of file\
    \ names. The foreach command then executes everything between the braces, { and\
    \ }, once for each item in the list, setting File to the value of each item in\
    \ the list in turn.\nInside the braces are two commands. One prints the count\
    \ and file name, the second increments the count."
