  md: 'Choosing a Linux distribution is like finding a new house. Everywhere you could
    choose to live, and each distribution has its own collection of advantages. Take
    your time in choosing, look at several, and you can save yourself the trouble
    of moving later.


    # 2.1 Debian


    Debian is the unconventional distribution. You can learn more about it at http://www.debian.org/.
    It was created by Ian Murdock in 1993 and named after his wife and himself, Deb-IAn.


    The Debian project is run by volunteers, each maintaining a part of the system.
    Debian does not provide glossy manuals or boxed sets. Debian users load their
    software from the internet or from recorded – never pressed – CDs.


    Debian users often get more out of Linux because Free from marketing constraints
    the Debian distribution has grown powerful without the emphasis on the graphical
    interface of the more commercial distributions.


    Debian has its own package management system, distinct from Red Hat''s package
    manager (RPM). It is much more potent, if you want to add a new software package
    it will automatically retrieve from the internet or from CD-ROM any dependencies
    – other software that you need to load first.


    Debian also includes the same networking, sound support and Graphical User Interface
    (GUI) as the other distributions. It offers the choice of both GNOME and KDE desktops.


    The volunteers of the Debian project jeously guard the status of their software
    – everything distributed under the Debian banner is genuinely ‘Free Software’,
    it can be freely redistributed, copied and modified. Free in this sense has more
    to do with freedom of speech than a free lunch.


    Debian also exists for a number of different processor families.


    # 2.1.1 Technical differences with Debian (optional)


    The filesystem layout of Debian is almost the same as the layout of other distributions.
    The only significant difference you will find is that the System V (SysV) init
    scripts are in'
