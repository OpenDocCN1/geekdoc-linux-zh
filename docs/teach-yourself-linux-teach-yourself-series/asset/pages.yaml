- img_proc: true
  md: '# 1.6 Installing a dual-boot system


    A dual-boot system is one which offers a choice of operating systems when your
    computer starts up. If you are already using another operating system, and want
    to keep it but install Linux as well on the same machine, you have four choices.


    +   1 Make the existing system give up some disk space. If it has more than one
    hard-disk partition you may be able to sacrifice one and use the space to add
    Linux.

    2 Add a second hard drive.

    3 Use a tool such as Partition Magic to shrink an existing partition, releasing
    some disk space.

    4 Reinstall the existing system, but in a smaller partition, leaving enough disk
    space free for Linux.


    Remember to make a backup of all your data before attempting any installation.


    The installation process for Linux is reasonably house-trained - it will respect
    the right of all other operating systems it finds on your hard drive to exist.
    Unfortunately some other systems have installers that simply pillage the entire
    hard drive for space.


    The way around this is to install the other system first. Tell it to divide your
    hard drive into two partitions, the second one large enough for Linux. When you
    install Linux use its disk-partition-ing tool to delete the second partition and
    set up Linux in the freed space.


    The final stages of the Linux installation will then notice that the other system
    exists and set up the loader to load either.


    Now when you start your computer it will ask you which operating system you want
    to use, and load whatever you select.


    # 1.7 What to do if installation fails (optional)


    This section explains some of the causes of installation failure and how to recover
    from them. You should read it if you have an installation problem and would like
    to solve it yourself. You should also read it if you are interested in how the
    hard disk works, how to set up the graphics card or how the computer starts up
    initially.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Getting Started with disk partitioning


    Problems with disk partitioning can occur if your hardware is set up incorrectly,
    if you have unusual hardware or if you are trying to partition the disk to leave
    room for another operating system.


    You can partition the disk manually by entering the cylinder numbers where the
    individual partitions are to be placed when you get to the partitioning step of
    the installation.


    A hard-disk drive stores information as patterns of magnetism on one or more platters.
    These are metal disks which are attached to a shaft and spun at high speed. Facing,
    but not quite touching, each surface of each platter is a head, a device which
    can read and write the magnetic patterns as the disk rotates, see Figure 1.2.
    The heads are attached to an access mechanism which moves them across the surfaces
    of the platters. When the access mechanism stays still each head remains over
    one ring of information on the spinning disk. This is called a *track*. A track
    is divided into *sectors*. Each head is over a corresponding track on a different
    platter all can be read and written without moving the access mechanism. These
    tracks taken together are called a *cylinder*. The access mechanism can move the
    heads into another position where they will be over the tracks of a different
    cylinder. Cylinders are numbered from 1, which is usually the cylinder closest
    to the shaft.


    ![](img/523b8b12cfa3c3d8f1ff0644bff32d59_22_0.png)


    **Figure 1.2** Inside a hard drive'
  merge: -1
