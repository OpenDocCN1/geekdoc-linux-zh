    The X server will start and you will see the display switch into graphical mode.
    No windows will open and there will be no background. The only thing on the screen
    will be the mouse cursor.


    Press Ctrl-Alt-Backspace (Backspace is at top right of the main part of the keyboard)
    to quit from the server and return to a text screen.


    This is what the server on its own, with no clients, looks like.


    Now type


    ```

    xinit

    ```


    once again with no parameters. The display will switch back into graphical mode.
    The xinit command is a script which both starts the X server and runs the terminal
    emulator, then waits for the terminal emulator to exit and shuts down the server.


    You will now see a terminal window, but it will have no borders or title bar.
    This is what happens if you have both a server and a client running but no window
    manager.


    Move the mouse cursor over the terminal window and type


    ```

    twm &

    ```


    to start the tab window manager. This is one of the older window managers and
    only has a few, very basic, features. Putting the & at the end of the command
    makes it run in background so that you can type more commands.


    Now type


    ```

    xterm &

    ```'
