    If the disk is taken out of the drive before the file has been

    written the file will never find its way onto the disk. The

    umount command, which unmounts a disk, forces Linux to

    write all unwritten data to the disk. With removable disks (other

    than floppies) does not unlock the eject mechanism until this

    operation is complete. Ummount will not work if any tasks are

