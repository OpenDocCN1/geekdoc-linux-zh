  md: 'A computer which has no disks, mounts its root filesystem over the network,
    has to be able to access NFS before the network is started properly by the SysV
    init scripts. It does this by starting one network interface as part of the boot
    process. This is explained in Chapter 12.


    # 9.1.6 Power failure


    Linux uses a ''lazy write'' with its disks. When a task wants to write to a file
    on disk Linux can put the information to be written on one side in RAM and deal
    first with another task''s request to read a different file. The task that is
    writing does not care if the information is written to disk immediately, or a
    few seconds later. The task that is reading is held up – it cannot do anything
    until it has the information it needs. Linux will come back to the write request
    later and complete it.


    If the power fails between the write request and the write operation actually
    happening you can lose data. In the few cases where this really matters you can
    use the sync command to force Linux to complete all pending write operations at
    once.


    When you issue the sync command – it needs no options – it schedules all outstanding
    writes, while the writes are in progress. Using this command too often can slow
    down the whole system.


    When your computer comes up Linux will check every ext2 or ext3 filesystem to
    see if it was properly unmounted last time it was used. If not – and this usually
    means that the power failed or someone pushed the reset button – Linux will try
    to restore the affected filesystem to an error-free, usable state. For ext2 filesystems
    it runs the fsck program which performs extensive consistency checks on the filesystem.
    With a large disk this can take many minutes.


    Ext3 uses a ‘journal’, an invisible file in which it makes a note of anything
    that it is doing could leave the filesystem in an inconsistent state. Linux recovers
    an ext3 filesystem by glancing at the journal and tidying up the affected parts
    of the disk.


