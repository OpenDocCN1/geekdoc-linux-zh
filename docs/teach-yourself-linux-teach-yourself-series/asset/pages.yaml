- img_proc: true
  md: 'The -l (local) option tells tar to ignore any mount points within the tree.
    You should use this if you want to make a backup of the root filesystem of a running
    system, otherwise tar will try to back up all the mounted filesystems, including
    /proc which is potentially very large, and filesystems mounted over the network.


    I have often found it useful to have a CD-ROM with a standalone system on handy
    for making backups, or if there is enough disk space available, to install Linux
    twice. The main installation contains everything I need to work normally. The
    second ''maintenance'' installation is text-only and contains an absolute minimum
    of packages. It can be brought up to make a completely clean backup of the main
    system - nothing can change the main system''s files while a backup is in progress.


    When making backups it is a good idea to think about how you are going to restore
    the system from them. In particular, if you make backups onto CD-ROMs you need
    to have some way of bringing your system up from your CD drive, and then using
    the same drive to restore your backups. I will explain some ways of doing this
    in a later chapter.


    If you are using CD-ROMs as your backup medium you can make a single disk that
    will restore your maintenance partition. Log in as root, then copy the first disk
    of your distribution, using the -a option to the cp command, to a new directory
    on your hard disk. Next remove the contents of the directory which contains the
    packages - RedHat/RPM/ on RedHat systems. Now make a backup of your maintenance
    partition with tar and place it in the new directory. You may also find it useful
    to put fstab and the partition list (see next section) into this directory. Burn
    a bootable CD from this directory as described in Chapter 4. You can now use it
    to bring up the rescue system, and reinstate the whole machine.


    # 8.2.7 Backup planning


    It is useful to make a plan for backing up your data. Once you have installed
    Linux it is a good idea to make a full backup of your whole installation as soon
    as possible.


    At the same time it is worth making a note of where your partitions are on disk
    and their mount points. The easiest way to list your partitions is with the command


    ```

    fdisk -l >partitionlist

    ```'
