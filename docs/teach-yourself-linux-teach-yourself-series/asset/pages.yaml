    # 1.8 Getting support


    There is an extensive and enthusiastic Linux user community which can be contacted
    both via the internet and through meetings of Local User Groups (LUGs). A list
    of user groups in the UK can be found at http://www.lug.org.uk.


    User group members, and the regular posters on the internet, are only too happy
    to help new users. If the person you first contact cannot solve your particular
    problem you will almost certainly be able to find someone who can.


    There are also mailing lists on the internet, usually associated with specific
    software packages. These provide a slower, but'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'more targeted form of support. They can usually be found by following links
    from the websites for the products which they support.


    Some LUGs also operate what are called installfests these are public meetings
    to which new users are invited to bring their computers. Experts are on to sort
    out installation problems and it is quite common for every new user to leave with
    a fully working machine.


    If you have bought a boxed set with support included you will probably need to
    register, quoting a number given somewhere inside the box, to receive support.
    If you have to send a registration card, rather than registering over the internet,
    it is a good plan to send the card as soon as you begin trying to install rather
    than waiting for problems to appear.


    # EXERCISE


    +   1.7 Search on the internet for your nearest LUG.


    # 1.9 Linux on laptops


    Installing Linux on a laptop computer is not very different from installing it
    on a desktop machine.


    There are two pitfalls associated with running Linux on a laptop. Firstly it is
    more difficult to find out what chips the makers have used – laptops are not designed
    to have the graphics card removed for inspection. It is sometimes necessary to
    bring up a rescue system and inspect the /proc file system to find out what hardware
    is present. This is explained in Chapter 3.


    Secondly some thought must be given to the vagaries of battery power. Laptops
    have a variety of power-saving modes and methods of suspending operations, which
    can interact with Linux in unfortunate ways. It is also worth considering installing
    a package such as apmd which will write all unsaved information to disk when the
    battery is close to exhausted.


    There is a lot of useful information on installing Linux on laptops at http://www.linux-laptop.net/.'
