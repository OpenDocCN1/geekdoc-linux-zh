  md: 'All Linux distributions come with a variety of programming tools. You do not
    need to know anything about programming to make use of Linux, but learning some
    programming will empower you to do much more with the system.


    This chapter will introduce you to the basics of programming. It will teach you
    how to create simple programs, and how to understand other people’s.


    # 10.1 Basic development tools


    Programming languages are used to give instructions to computers. The actual instructions
    which the processor chip in your PC execute are complex, frequently obscure, patterns
    of binary digits. It is possible to write these instructions directly in binary,
    or indirectly using a special kind of programming language called assembly code.
    An assembler program—one is included with Linux as part of the gcc package—translates
    the lists of instructions into binary for the processor. Programming in assembly
    code is a specialized and highly skilled business, and is very rarely necessary.


    For ordinary programming you can write your programs in either a compiled or an
    interpreted language. A compiled language is translated by a program called a
    compiler into instructions which the processor chip can understand. These instructions
    are then put in a separate executable binary file, which is read into memory and
    given to the processor when you run the program. The original file you wrote,
    called the source code, is not needed to run the program.


    To make a change to a compiled program you alter the source and recompile. Amending
    a binary after compilation is very difficult.


    Most commercial software is distributed only as executable binary files. Linux,
    distributed under the GPL, comes with the source code. This is the meaning of
    the term ‘open source’. Its value is that you can change any part of Linux, either
    because you have found and fixed a bug, or because you want it to do something
    different.


    An interpreted language is understood by a program called an interpreter. This
    reads the program, either a little at a time or all at once, then works its way
    through, line by line, obeying the'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'instructions it finds on each line. Some interpreters work by partially compiling
    the program. Either way, an interpreter works on the source code – there is no
    binary file.


    Linux normally comes with at least compilers for C, C++ and FORTRAN, and interpreters
    for TCL, Guile and Perl. The bash shell also works as an interpreter for its own
    scripting language.


    If you want to learn a compiled language your first choice should be C. It is
    easy to master and so widely used as to almost a standard.


    You can-develop a program in two ways. The classical method, which works on all
    Linux and UNIX variants, is to run the various development tools from the command
    line. This is much preferred by the older generation of programmers (including
    the author) who can drive the CLI far faster and more reliably than anything involving
    a mouse.


    The tools you can use from the command line include:


    +   * Editors, such as emacs.

    * Version control packages such as CVS.

    * Compilers such as gcc and their associated programs.

    * Make, which supervises the compilers.


    CVS keeps track of which source files are needed to build projects, what was changed
    when, and who made the changes. It keeps a ‘repository’ of files – not only the
    source code but lists of changes as well. You can ‘checkout’ any files you want
    to work on, make your changes and ‘commit’ the new version to the repository.


    If two programmers cleverly check out the same file and make changes CVS is remarkably
    reconciling the two versions.


    You can also use CVS to ‘tag’ a particular version of your sources, for example
    you can use CVS to fix the sources that built a binary you have given to someone
    else. Then you can always use the tag to get back the exact sources from which
    that binary was built – a useful thing to do if the person with the binary complains
    of a problem.


    Gcc – the C and C++ compiler – uses many dozens of options. You can ignore most
    of them if you want to compile a simple program. For example type


    ```

    gcc -o fish fish.c

    ```'
