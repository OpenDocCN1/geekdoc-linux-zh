    # 3.5 Filesystems


    Linux can access filesystems in a variety of formats. It has its native formats
    but it can understand FAT, Macintosh HFS, ISO 9660 (CD-ROM), OS/2 HPFS and many
    others.


    A filesystem exists on a device which can be a removable disk such as a floppy
    or a disk cartridge. A device can also be a partition on a hard drive or the whole
    of the drive. It can be an area of RAM or even a file within another file system.
    On networked machines a filesystem on another computer, be accessed over the network,
    can be mounted as if it were a device.


    For the files on a device to be accessed by Linux device must be mounted with
    the mount command. When the kernel mounts a device it reads some information about
    how to. access files on that device and keeps it in memory. After accessing the
    files on a device it must be unmounted. This makes the computer put any changed
    information it is holding back on the device.


    There are some enormous advantages to having a formal mount and unmount mechanism.
    The major one is that it makes ‘lazy'
