  md: 'distributions have scavenging processes which will delete any file in /tmp
    which is more than a few weeks old.


    Provided you stop the background processes – switch to runlevel 1 as described
    in Chapter 9 – you can, as root, safely delete every file in /tmp with the commands


    ```

    cd /tmp

    rm -r *

    ```


    note the backslash (\) character before the rm which overrides the confirmation
    prompts – rm will delete every file without asking you if it is doing the right
    thing. Careful to type this command exactly as shown. Check that you are in the
    /tmp directory before you type \rm.


    The /tmp directory must be writable by every user. If it is not, some programs,
    notably the X-Windows font server, can fail. To check this use the command


    ```

    ls -ld /tmp

    ```


    The output from that command should look like this (ignore the date):


    ```

    drw-xr-wt 19 root root 4096 Apr 14 13:38 /tmp/

    ```


    You can set the permissions – the usual cause of problems in this area – with
    the chmod command.


    # 8.4.3 Hardware problems


    Linux itself is extremely reliable. Most failures are traceable to hardware faults.
    When a hardware device is close to death it is quite common for the driver to
    detect a large number of errors before a failure occurs. The driver which is having
    problems sends error messages to your system log. The file /etc/syslog.conf –
    there is a man page explaining its format – controls these messages go.


    # 8.4.4 Problems with NFS servers


    Once an NFS server is up and running it usually has no further problems. Difficulties
    with NFS are usually due to one of the following:


    +   - Trying to start the server with a missing or empty /etc/exports file. If
    this happens you may see the message'
