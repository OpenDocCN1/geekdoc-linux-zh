  md: 'cp SOURCE DESTINATION copies a file from the SOURCE to the path DESTINATION.
    The original file is unchanged, the destination file is an exact copy of it.


    Example: cp old.text new.text

    This makes a copy of the file old.text and puts the copy in a new file called
    new.text.


    +   ln -s SOURCE DESTINATION

    Instead of copying the file this command makes a symbolic link from the destination
    to the source. When you look at the destination directory with the

    ls -l

    command you will see a pointer symbol and the name of the file that the link points
    to. You can use the symbolic link (often abbreviated to symlink) as if it were
    the file it references.


    +   mv SOURCE DESTINATION

    moves the file with the path SOURCE to the path DESTINATION. The original file
    vanishes. This can be used to move a file to a different directory or to rename
    a file within a directory.

    Example: mv this.data that.data

    renames the file.data in the current directory to that.data.

    Example: mv .raw/fish.pic ./cooked/lunch.pic

    moves the fish.pic from the subdirectory raw to the sub-directory cooked, renaming
    it to lunch.pic at the same time.


    +   rm PATH

    Remove, in other words permanently delete, the file PATH. More than one path can
    be given, separated with spaces, in which case all the paths will be removed.
    Note that the data in the files cannot be recovered after this operation. The
    -r option will make rm remove directories, their contents and their subdirectories
    - it should be used with extreme caution.

    Example: rm file_of_old_stuff file_not_wanted

    This command will remove file_of_old_stuff and file_not_wanted from the current
    directory.'
