    # 7.4 Network security


    # 7.4.1 Securing NNTP and SMTP


    Having your own NNTP or SMTP server carries a potential security risk. If your
    firewall or hosts.allow files are not set correctly anyone can connect from the
    public internet and inject articles into usenet or e-mails into the mail system,
    claiming that they are from your site.


    The creatures which live under a damp stone at the bottom of cyberspace, the pornographers
    and mail spammers, commonly use port scanners, programs which hunt through blocks
    of IP addresses for insecure NNTP and SMTP ports. Inously they use these to advertise
    their tawdry creations anonymously. It is a good idea to test these ports from
    another machine elsewhere on the internet to make sure that they reject connections
    from the outside. The test is very simple – from another site, with a different
    connection to the internet, use the telnet client program and try to connect with
    the commands


    ```

    telnet yourhost nntp

    telnet yourhost smtp

    ```


    in each case making sure that you get a ‘connection refused’ message or no response
    at all.


    You can perform a port scan on your own machine at the same time with nmap. Do
    not do this to someone else’s machine unannounced – it looks like you are making
    an intrusion attempt.'
