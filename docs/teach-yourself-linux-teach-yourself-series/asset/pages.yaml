  md: 'Nmap and other security tools can be downloaded at http://www.insecure.org/.


    # 7.4.2 Introduction to firewalls


    Inside the kernel there is some code which does packet filtering – it can come
    looking TCP/IP packets and decide to accept them, drop them in the dustbin or
    send them home to the originating computer with a note explaining why they have
    been rejected.


    The current version is known as iptables and replaces an earlier packet-filtering
    system known as ipchains which was not as versatile or easy to program.


    Iptables works by keeping one or more tables of rules in memory and using them
    to test message packets. Each table contains one or more chains – lists of rules
    in a particular order.


    A rule is in two parts: the criteria and a target.


    The kernel will test each packet against each rule in a chain to see if it matches
    the criteria. If it does, the kernel will carry out the action described in the
    target.


    The iptables shell command adds, deletes and amends rules and chains.


    When you write a firewall you are in fact writing a series of commands to the
    iptables program, telling it how to set up the rules in the way you want.


    There are two ways of writing a firewall. You can write a script which issues
    commands to iptables directly. When you run the script it will delete any old
    rules and create the new ones. There is a good example of a Linux firewall written
    in this way http://www.linuxhelp.net.


    Alternatively some distributions make use of the iptables-save and iptables-restore
    commands. These convert a complete firewall to a text file and back again. The
    text in the file resembles very closely the commands to iptables.


    Red Hat Inc.’s lokkit program creates a file called /etc/sysconfig/iptables in
    this format, which is then loaded as the firewall. You can create your own firewall
    by hand and use it instead of this file.'
  merge: -1
