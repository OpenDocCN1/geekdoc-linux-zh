  md: 'RPC: Program not registered

    which indicates that the server has never started. Because NFS uses the RPC protocol
    it has to ‘register’ itself with RPC before it can receive requests from the outside
    world.


    +   - Clock skew. Files created over NFS are given timestamps created from the
    clock on the server. These timestamps are then given out to client computers when
    the files are read. If the clock on the client machine is slow a file can appear
    to have a timestamp in the future. This can cause problems if you do anything
    that is sensitive to the order in which files were created, such as using the
    make program. The solution is to synchronize the clocks in all your computers.
    You can use the rdate command, run every few hours from cron, to do this.


    +   - Address resolution. The NFS server will normally refuse connections if it
    cannot look up the client’s IP address in either the /etc/hosts file or by using
    the DNS. Use the host, dig or nslookup commands to check your DNS if you have
    one. Log into the server and try to ping the client.'
