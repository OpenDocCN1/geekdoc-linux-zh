- img_proc: true
  md: 'With a normal internet connection via an ISP you should only ever receive packets
    directly to your computer. It is in theory possible to send you a packet addressed
    to another machine within your LAN. To do this would mean corrupting your ISP''s
    routing tables, not an easy thing to do. Even if this happens the first rule will
    catch an intrusion attempt based on treating your firewall as a router.


    The computer that uses this firewall is connected both to the internet and to
    a LAN. I trust the computers on the LAN – they are all mine – so I have a simple
    rule that accepts anything over the LAN interface. In the same way I trust myself,
    and accept any packet that comes from the same computer over the loopback interface.


    The state machine rule accepts any packet that is a reply to one I have sent out.
    This lets me – for example – send a request for a web page to a server, and have
    the page itself allowed back through the firewall. If the server tried to send
    me a page uninvited it would simply crash into the firewall.


    The next five rules let a selection of internet control message protocol packets
    through. These are needed to make ping and traceroute work. If you leave them
    out your computer will still work but it may have trouble with network errors.


    The next two rules have the same criteria and deal with forbidden connection attempts
    to this machine. The first rule makes a note in the system log of the rejected
    attempt. Because the LOG target does not terminate the scan, the next rule – which
    matches the same packets – destroys the offending connection attempts.


    Together these two rules catch and slaughter malicious attempts to connect to
    a service within my machine from the internet proper.


    The COMMIT line marks the end of rules for this table and triggers their transfer
    to the kernel.


    The next few lines do the same thing for the nat table, which controls forwarding.
    In this case we take any packet that is going to go out on the ppp0 interface
    and change its source address to be the same as the IP address of our connection
    to the internet.


    A firewall will only stop intrusion attempts, it will prevent anyone outside the
    protected machine or LAN from connecting to anything inside. It can also be used
    to control outward connections:'
