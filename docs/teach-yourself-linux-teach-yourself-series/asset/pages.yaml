  md: '# 4.5.4 POP and SMTP


    The two protocols normally used to transfer e-mails are Post Office Protocol (POP)
    and Simple Mail Transfer Protocol (SMTP). When using SMTP the computer which is
    sending the e-mail connects to a remote machine and pushes the e-mail through
    the connection. POP, on the other hand, works by connecting to a mail server and
    pulling e-mails out of it.


    Most mail software uses SMTP to send and POP to receive, and ISPs are usually
    set up to accept SMTP connections for outgoing e-mail and POP for incoming. The
    Internet Message Access Protocol (IMAP) is an alternative to POP.


    Unless you are unreasonably lucky, or spend far too much time surfing the web,
    the person you want to send an e-mail is unlikely to be online at the same time
    as you. The internet caters for this by using what are known as mail relays. Your
    ISP will have a mail relay; you send your outgoing mails to it using SMTP. The
    mail relay then looks up the domain the mail is addressed to. Usually it will
    find another relay – this time at the addressee’s ISP – and hand the mail over.
    When your friend logs on them they collect their mail using POP or IMAP.


    You can use this mechanism with Linux, or you can create your own mail server
    with Sendmail.


    # EXERCISE


    4.11 Set up your chosen mail client and exchange e-mails with a friend.


    # 4.5.5 Sendmail


    This is a large and very complex program which not only delivers e-mails, but
    can redirect them and rewrite the’mail headers to exchange mail between incompatible
    systems. Configuring Sendmail is a specialized task. It is normally simplest to
    use a configuration supplied with your distribution.


    Sendmail can be set up either to send mails directly to their recipients, or to
    send them via a ‘smart relay’, another machine which passes mail on for you.'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'Using a smart relay, usually the SMTP server at your ISP removes the need for
    your copy of Sendmail to do all the lookups involved in delivering an e-mail.
    The smart relay will also take over responsibility for retrying delivery if the
    recipient ISP''s mail goes down or cannot be reached. If you are on a dial-connection
    it is usually best to use a smart relay if one is available, or send your outgoing
    e-mails directly to your ISP''s SMTP server.


    Sendmail can deal with incoming e-mails if your ISP deliver by SMTP – not all
    ISPs offer this feature. If you want to make use of this, set up your firewall
    to accept connections on the SMTP port back, and this is vitally important, only
    allow connections from IP addresses which you know belong to your ISP''s mail
    servers. Sendmail is normally set to refuse to relay e-mails – it will not accept
    an e-mail from outside unless it is addressed to one of the users of your machine.
    It is possible to change this setting, for example if you want to use one machine
    on your LAN to forward all outgoing mail for all the other machines. Be very careful
    if you do this as there is a real risk of creating an open relay, a mail forwarder
    which will send on any e-mail presented to.


    This is an open invitation to mail spammers. They will find your machine by port
    scanning and then use it to send a mudslide of dubious advertisements – all of
    which will appear to come from you.


    I will explain how to test for, and fix, an open relay in Chapter 7.


    # 4.5.6 POP and IMAP servers


    Sendmail collects incoming e-mails and puts them in the user''s mailbox files
    in /var/spool/mail. Some mail client programs can collect their mail directly
    from this directory.


    If you would like to use mail software that can only collect mail either via the
    POP or the IMAP protocols, or if you would like to set up an incoming mail server
    that can be used by everyone on your LAN, you can install the imap package.


    This package contains both the POP and IMAP servers. Access to them is controlled
    by the xinetd daemon.


    A daemon is a program which is always present in a system, but uses almost no
    resources until it is needed. xinetd (eXtended Internet services Daemon) is rather
    like a hotel porter who sits'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'quietly out of sight watching the doors. When a guest arrives he appears and
    helps them, but if an undesirable character tries to get in turns them away. Similarly
    xinetd sleeps watching incoming network connections, attaches the legitimate to
    servers and rejects intrusion attempts. This makes xinetd both a router of legitimate
    requests and a second-stage firewall.


    # 4.5.7 Usenet and the NNTP protocol


    Network News Transfer Protocol (NNTP) is used to operate usenet newsgroups. Newsgroups
    are discussions – either open or restricted – organized as lists of postings,
    which have the same general format as e-mail messages.


    Imagine a usenet newsgroup as a large notice with a title which describes the
    subjects that should be discussed. For example the newsgroup uk.com.os.linux is
    intended for discussions of Linux in the United Kingdom. Then someone comes along
    and pins up a note saying ‘Can anyone suggest good card-game programs for Linux?’
    Other people seeing the note might reply with details of patience and poker games.


    If you would like to participate in usenet discussions you have a choice of client
    programs. The one built into the Mozilla browser is suitable for a new user. You
    can either connect directly to a NNTP server at your ISP and set it in the browser’s
    preferences. Or you can set up your own server as described in section 7.3.5.


    Newsgroups are a good source of information about Linux. You will find a lot of
    helpful and knowledgeable people taking part in the discussions and answering
    questions from new users. Before joining in a discussion it is a good idea to
    lurk – read the group without posting – for a few days. Newsgroups can also degenerate
    into pointless bad-tempered arguments, in which case the only thing to do is quietly
    move on.'
