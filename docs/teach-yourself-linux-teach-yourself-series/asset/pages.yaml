    the location of the filesystem to mount. This can be written in a variety of ways.


    +   - A special file describing a disk or partition to mount. The first ID disk
    is /dev/hda, the second is /dev/hdb and so on. SCSI disks are /dev/sda, /dev/sdb,
    as are USB devices – Linux treats USB as a special type of SCSI. Where a disk
    is partitioned a number is added to the end of the special file to select the
    partition number. So, in Figure 3.1, /dev/hda8 is partition eight on the first
    IDE hard disk. Note that the floppy on this computer (a laptop) is an external
    USB device and so it appears as /dev/sda. If it had been a conventional floppy
    it would have been /dev/fd0.

    - A label. This label is written to a disk partition when the filesystem is first
    created on it. Linux will search all available partitions for a matching label.

    - The word ''none''. This is used for some filesystems which do not live on real
    devices but are used to access parts of the kernel.

    - A description of where to find a filesystem over the network. The string falstaf:~/home
    describes the filesystem /home on the machine whose name on the network is falstaff.


    The next column lists the mount points where the filesystems are mounted. The
    root filesystem is mounted on /, a point which always exists. All the other mount
    points must be either directories within that filesystem, or directories on other
    filesystems.


    The third column indicates the type of filesystem. Linux has its filesystems,
    known as ext2 and ext3 – the second and third extended filesystems. The original
    extended filesystem is obsolete. The difference between ext2 and ext3 is that
    ext3 has a journal, an area of the disk in which the system makes notes about
    what is changing on the disk. Because of this computer which uses ext3 can recover
    its disks in seconds after a power failure, rather than the minutes recovering
    ext2 takes. The filesystems which access the kernel, such as proc, have their
    own types. Filesystems which are accessed over a network have'
