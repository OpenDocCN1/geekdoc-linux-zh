- img_proc: true
  md: 'TK extension to TCL is among the simplest possible ways of writing programs
    that use the GUI quickly. To see how quick it is, start the windowing shell by
    typing

    wish


    with no options.


    The shell will display % as a prompt, and a window will open. This window, which
    is tersely named ''.'', just dot, is the root window on which the rest of a TK
    application is built.


    Now put something in the window. Type

    label .fred -text "Hello World"


    to the shell. Note that the return value ''.fred'' is printed by the shell. This
    has created an object – in this case a text label called .fred. The next step
    is to place it somewhere in the window.

    Type


    pack .fred


    and the ''pack'' geometry manager will put it in the first available space and
    resize the window around it.


    Do this with a second label


    label .jim -text "Goodbye World!"

    pack .jim


    and the window will resize again around the two labels.


    Try adding some interaction. Type


    button .eric -text "Please do not press this button"

    .eric configure -command "puts \"Oh, no. Not Again!\"

    pack .eric


    and a button will appear in the window. The button command creates the button
    called .eric, but it also creates a command called .eric to let you do things
    to the button.


    The configure option changes anything that you could have set with the command
    that created the button.


    The button has two parameters: the text it displays, and a command that it executes
    when the button is pushed. Note that the command contains a quoted string inside
    quotes, so the inner quotes are escaped with the backslash (\) character to tell
    the interpreter that they belong inside the outer quotes.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'Click on the button. TK will execute the command you have associated with the
    button and you will see the message come out in the shell.


    Wish can run a script from a file. Type this script into a file called ~/bin/colour.tcl,
    and use the command chmod u+x ~/bin/colour.tcl to make it executable.


    ```

    #!/usr/bin/wish


    # Simple .whatis -text "Watch the colours"

    frame .things.r -borderwidth 3 -relief ridge

    button .things.r -text Red -command ".whatis configure -fg red"

    button .things.g -text Green -command ".whatis configure -fg green"

    button .things.b -text Blue -command ".whatis configure -fg blue

    ```


    pack .whatis .things

    pack .things.r .things.g .things.b -side left


    Now type ./colour.tcl to run the script. You will see a ‘ridge’ – a narrow raised
    border around the buttons. This is created by the parameters to the frame command.


    The text message and the frame around the buttons are packed top to bottom in
    the window. The first pack command does this. Then the second pack command packs
    the buttons left to right inside the frame. The names of the buttons .things.r,
    .things.g and .things.b- reflect the fact that they are part of the larger object
    called .things.


    One big difference between tcl and wish is that when a script run by tcl reaches
    the end of the file the shell exits. With wish the script is executed to the end,
    setting up things that can happen later as it goes.


    Once a wish script reaches the end, wish enters an event loop, where it sits waiting
    for incoming events, such as mouse clicks and keystrokes. When an event, such
    as a mouse click on a button, makes something happen in your program, the event
    loop runs a callback, such as the ‘whatis configure’-commands in the example.


    An application written with wish contains only initialization and callbacks, there
    is no ‘ordinary’ program at all.'
  merge: -1
  pgno: 201
- img_proc: true
  md: "# 10.5 Perl\n\nPerl is a language in which you can write scripts. It has more\
    \ features than the shell, which is neither powerful nor as fast as C. Unlike\
    \ a shell script, or TCL, a Perl program is compiled before execution. Because\
    \ of this you cannot, for example, use commands that are created by text substitution\
    \ as the program runs. This makes it slightly less powerful than TCL in some respects,\
    \ but a great deal easier to use. When you try to run a Perl script it will either\
    \ start or fail with a syntax error. A shell or TCL script may conceal a syntax\
    \ error until that part of the program is run.\n\nPerl’s particular strength is\
    \ in handling text. Its name Practical Extraction and Report Language comes from\
    \ its original use — extracting information from large numbers of text files and\
    \ formatting it in a readable fashion. It has built-in functions to search and\
    \ sort through text, and it can convert arrays into lists and versa\n\nPerl has\
    \ a number of ways of connecting to databases. It can also connect to the TK package,\
    \ which is normally bundled with TCL, and use it to generate a graphical user\
    \ interface. See the previous section for a description of TK.\n\nSome parts of\
    \ Linux are written in Perl, particularly scripts that convert data from one form\
    \ to another, or configure new software when it is first installed.\n\nMany CGI\
    \ scripts — these are scripts which generate web pages dynamically — are written\
    \ in Perl.\n\nThis is a simple demonstration program in Perl.\n\n```\n#! /usr/bin/perl\n\
    # Type in a month number ( 1 - 12 ) and\n# this script will return\n# the month\
    \ name\n\n@Months = qw ( January February March April May June\n      July August\
    \ September October December );\n\nwhile ( 1 ) {\n    print \"Month number: \"\
    ;\n    $N = <STDIN>;\n    if ($N < 1 || $N > 12 ) { die \"That’s not a month.\"\
    \ }\n    print \"$Months[$N - 1]\\n\";\n}\n```"
  merge: -1
  pgno: 202
- img_proc: true
  md: The first line after the comments creates a list of month names. The qw operator
    takes the month names, turns them into a list and places them in the array Months.
    The while statement then creates a loop in which the program prints a prompt and
    reads one line from standard input – note that <STDIN> behaves almost like a variable,
    you can read data simply by assigning from it. If the value read in is not a month
    number the script makes use of the die command to exit with an error message.
    If the month number is valid the script subtracts one (Months begin at 1, Perl
    arrays begin at zero) and uses it to find the month name in the array.
  merge: -1
