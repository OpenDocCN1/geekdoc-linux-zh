  md: '# 8.3.4 Is this partition recoverable?


    It is very rare for an ext2 or ext3 system, even under extreme provocation, to
    disintegrate to the point that no data can be recovered. Turning off power to
    the computer during a write operation normally leaves ext2 in a recoverable state,
    and has almost no effect on ext3. Massive corruption of RAM, such as happens when
    a memory module falls out of its socket, can cause data to be written to a drive,
    but even this is rarely terminal.


    If a partition appears to be corrupt, the first thing to do is to mount it read-only,
    before you make any attempt to repair it. You can do this in the rescue system
    with a command such as


    ```

    mount /dev/hdx /mnt/simage -o ro

    ```


    once replacing the x with the appropriate partition number.

    If you can mount a corrupt partition this way you should regard the data on it
    as having a stay of execution, not a reprieve, and at once copy anything changed
    since the last backup to a safe place.


    The next step is to unmount the affected partition and use the fsck command to
    check it. Again once in the rescue system type


    ```

    fsck -f /dev/hdxa

    ```


    The -f option forces fsck to perform a check, even if the partition is flagged
    as not needing one.


    This will probably report errors, and ask you for your permission to correct them.
    You can either accept or reject each change fsck offers, or simply restart it
    with the -p option as well as the -f to accept all the suggestions. This will
    nearly always put the filesystem back together again. Even if it fails it may
    find some of the lost files and move them to the lost+found directory. Unfortunately
    it does not recover the file names, you may have to use grep to search the lost+found
    directory for a missing file.


    # 8.3.5 Using the fdisk program


    The fdisk program which you can use to repartition a disk accepts a few very simple
    commands.


    Fdisk is a very powerful tool and using it carelessly can destroy information
    on a hard disk. Only use fdisk when you know that you need to examine or edit
    a partition table.'
