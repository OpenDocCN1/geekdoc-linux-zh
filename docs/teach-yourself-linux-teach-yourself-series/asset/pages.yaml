    Most of OpenOffice is so easy to use, and so well documented, that the easiest
    way to learn it is to open a word-processor document, a drawing or a spreadsheet
    and experiment with the menu options.


    The slideshow program, called Impress, shares many features with Draw, the graphics
    program. The easiest way to learn both is to tackle the graphics program first,
    and when you are familiar with it move on to the slideshow.


