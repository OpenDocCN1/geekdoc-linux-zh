  md: 'This chapter is an introduction to some of the internal mechanisms of the kernel,
    and the programs and scripts that work closely with it. It is far from complete
    – a full explanation of the kernel alone would require a book several times the
    size of this one – but it covers the areas you are most likely to need.


    # 9.1 The startup and shutdown sequences


    This section explains how Linux starts up and shuts down, and how you can arrange
    to have extra things of your own – such as background programs – activated when
    your computer starts up.


    # 9.1.1 How the kernel starts up


    There are several loader programs that can be used to start Linux. LILO and GRUB
    are normally used with hard disks. Syslinux can load Linux from an MS-DOS format
    disk and is commonly used with floppies.


    All the loader programs do the same thing. They read the contents of two files,
    the kernel and the initial ramdisk, into memory and start the kernel. On this
    computer they are vmlinuz and initrd, followed by a version number. On this they
    are vmlinuz-2.4.18-27.8.0 and initrd-2.4.18-27.8.0.img.


    The vmlinuz file is a compressed version of the kernel – the uncompressed version
    is vmlinux. There are major advantages to compressing the kernel – both in time
    and space – as it has to be loaded into memory by the BIOS, and often read from
    a floppy.


    Once the kernel is in memory the loader program starts it. It then decompresses
    itself using a built-in program.


    The loader can pass a command line to the kernel. You can use this line to set
    up kernel parameters which tell the kernel about non-standard hardware, set the
    runlevel or let the kernel know where its root filesystem is.


    With LILO or syslinux you can type the parameters after the name of the system
    to be loaded, like this:


    ```

    linux 3

    ```'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'to give the parameter 3 to the kernel. You can enter multiple parameters like
    this:


    linux 3 lp=reset decompress

    which will also reset the printer port during startup.


    The SuSE loader has a separate window for entering kernel parameters. If you are
    using the GRUB loader you can edit the kernel parameters by typing ''a'' when
    the GRUB screen appears. GRUB refers to the kernel parameters as ''kernel arguments''.


    You can also make a permanent change to the kernel parameters by editing either
    /etc/lilo.conf or /boot/grub/grub.conf.


    The kernel then finds the compressed initial ramdisk in memory, decompresses and
    mounts it as the root filesystem.


    Inside the initial ramdisk there is a file called linuxrc. The kernel runs this
    as a script. This script loads any modules you need - from the ramdisk itself
    - mounts the real root filesystem and exits. Because of this mechanism the root
    filesystem can be on a disk which is accessed through a driver which is loaded
    as a module.


    The kernel then tries to load and start the first task. It tries, in order, to
    run these programs /sbin/init, /etc/init, /bin/init and /bin/sh, and stops as
    soon as it finds one that works.


    In effect this means it looks in three places for an init program, then if it
    cannot find one it runs a shell.


    The rest of the startup sequence is now controlled by the init program.


    # 9.1.2 The init program


    Init is the parent process of all other tasks and always runs with a Process Identification
    (PID) of 1.


    The file /etc/inittab tells init how to set up the system. It first runs the system
    initialization script, normally /etc/rc.d/sysinit, which manages most of the system
    startup. This script checks and mounts filesystems, loads modular drivers, sets
    up the time-of-day clock and performs a lot of similar operations.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'When the sysinit script finishes, init chooses a runlevel for the system. This
    is a number in the range 0 to 6 which controls the type of system that will be
    started.


    The assignment of mappings to runlevels varies between distributions. RedHat and
    SuSE both use these values:


    +   - Single-user system, suitable for troubleshooting.

    - Text-only system without NFS.

    - Text-only full system.

    - GUI-based system.


    Debian uses runlevel 1 as the single-user system and 2–5 as multi-user.


    You can set the /etc/inittab in two ways:


    +   - Edit the /etc/inittab file. The line id:5:initdefault: sets runlevel 5.
    You can change the 5 to any other suitable value.

    - Tell the boot loader to tell the kernel as part of the kernel parameters. Put
    the runlevel you want in the kernel parameters as a single digit. Remember to
    separate the parameters with spaces.


    Init will then enter the selected runlevel.


    What happens next is controlled by the System V (often short-ened to SysV) init
    scripts.


    # 9.1.3 SysV init scripts


    These are script files in the /etc/rc.d/init.d/ directory. They start and stop
    services, things your computer leaves quietly out of sight, such as the daemon
    that works the printer. One script exists for every service that can run in back-ground.
    These scripts can be run with a parameter which is one of the following:


    +   - start Start the background.

    - stop Stop background.

    - status Show the status of the background.

    - restart Stop and restart the background.

    - reload Tell the background to reload its parameters.


    You can run these scripts directly, indirectly with the command server service
    command'
  merge: -1
  pgno: 182
