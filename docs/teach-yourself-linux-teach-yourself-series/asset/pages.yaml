    # 7.5 Network caching


    If you have several users on one or more machines sharing a connection to the
    internet they will probably make a habit of visiting the same pages regularly.
    They will all use expensive bandwidth to download the same background images,
    then fill up their disk caches with lots of identical files.


    You can limit this problem by adding a web proxy cache, such as Squid. This is
    included with many distributions or can be downloaded from http://www.squid-cache.org/.
    Squid takes requests for pages from users’ browsers and forwards them to the real
    web servers. It keeps a cache of recently visited pages on disk. If it is asked
    for a page or image which is already in the cache it will give its cached copy
    to the browser without requesting it from the remote server.


    Squid is very simple to set up. Once the package has been installed you can edit
    /etc/squid/squid.conf to set Squid’s options. Most of the default settings will
    do – you only need to check that the Access Control List (ACL) is correct for
    your system. The file (version)/QUSTART – substitute the version number of the
    copy of Squid that you are running for (version) tells you how to get Squid running
    quickly.


    It is very important that you make sure your cache is secure, in the sense that
    it will not accept requests from outside your LAN. If you set up a cache which
    is available to the outside world, sooner or later someone will find it and use
    it to save themselves time or, even worse, to distribute questionable material.


    Having set up and secured your cache you can now go to your browser’s preferences
    and for each protocol that you would like'
