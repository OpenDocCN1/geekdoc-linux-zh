    # # 10.2 GUI applications and widget sets


    The X-Windows system is only the bottom-most layer of the GUI. It can do simple
    things like writing on the screen and drawing lines. To make it into a useful
    system, any programs you write must add another layer – they must have a way of
    drawing buttons, sliders, menus and all the things that make up a complete GUI.


    The software to draw all of these things – often called widgets – is usually taken
    from a library. Over many years


    Unfortunately not all of these have been free, open-source, software. The Athena
