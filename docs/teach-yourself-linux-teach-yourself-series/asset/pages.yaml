    # # 6.1 TCP/IP basics


    When computers communicate across a network they use a protocol, a set of rules
    for how messages are to be structured, or more often several protocols stacked
    one inside the other. Linux can communicate using a variety of protocols, the
    most widely used of these is the Transfer Control Protocol – Internet Protocol
    almost always referred to as TCP/IP.


    The TCP/IP protocol, and its descendants, is described by an extensive list of
    standards. These are described in a set of documents known as the ‘Requests for
    Comments’ or RFCs. The title is something of a misnomer. By the time a document
    becomes a published RFC it has been adopted as a standard. With a few exceptions
    the RFCs define the official and correct forms of all the major protocols. The
    RFCs are listed online at


    ```

    http://www.faqs.org

    ```


    with duplicate mirror copies on many other sites.


    Computers connected to a network communicate by some form of signalling, such
    as electrical impulses carried on a cable. Ethernet and serial lines are examples
    of this sort of network. Alternatively the computers may get in touch by flashes
    of light sent down an optical fibre or, using the new Bluetooth standard, by radio.
    Many other forms of communication have been used. There is an infamous spoof RFC
    (Number 1149) dated 1st April 1990, which describes the problems involved in routing
    TCP/IP via carrier pigeons.


    How the components of TCP/IP (OSI) interconnect is described by the Open Systems
    Interconnection standard. This standard is concise to the point of woful obscurity.


    Because TCP/IP will work any sort of network it is designed to conceal the details
    of the hardware from the programs that use it.


    The hardware in your computer which connects to a network may have an address
    permanently burned into it during'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'manufacture. For example the address of an Ethernet card is six, eight-bit,
    binary numbers. The Ethernet address of the card in my computer is 00:60:08:30:8F:91.
    The interface which it uses to connect to the outside world is made with a different
    type of hardware and doesn’t have an address at all.


    To make all interfaces work in the same way TCP/IP assigns an IP address to each
    interface. The IP stands for Internet Protocol. This is written in a different
    format, called dotted decimal notation. An address written in dotted decimal notation
    looks like this:


    ```

    192.168.0.2

    ```


    The four parts are numbers in the range 0 to 255.


    An IP address is assigned when an interface is installed and is always in the
    same form. It can change if a computer is moved from one place on a network to
    another. A hardware address, if it exists at all, is assigned when the interface
    is manufactured and never changes. The format of a hardware address depends on
    the type of hardware being used.


    The Internet Protocol address is so called because, except for some special ranges
    of addresses, a message sent to an IP address will be delivered to the correct
    computer even if it has to travel half way around the world through a dozen intermediate
    machines to get there.


    The software in your computer which handles messages, and the software that forwards
    them deals in datagrams, blocks of information from one program to another. It
    puts headers onto the datagrams, a process similar to putting a letter into an
    envelope and writing on an address, so that they can be delivered correctly.


    Datagrams can be up to 65,535 characters in length – about the size of an average
    short story – although very long datagrams are rarely used. To avoid the practical
    problems involved in moving around very large blocks of data, datagrams are often
    fragmented, the fragments being sent as separate packets across the network.


    Programs can, if they choose, communicate by sending and receiving these messages
    directly, making use of the User Datagram Protocol (UDP). This protocol is fast
    but it contains no error checking. If datagrams arrive in the wrong order, or
    some are lost in transmission, the receiving machine does not know that there
    has been an error.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'Most of the traffic over the internet is handled by TCP, the Transfer Control
    Protocol. TCP uses similar packets to communicate but adds error checking and
    correction. Once a TCP connection has been established between two computers it
    will either work correctly or announce the fact that it has failed. Programs using
    TCP do not have to worry about errors in the received data itself.


    Most of the remaining protocols, such as e-mail and the HyperText Protocol (HTTP)
    are constructed using TCP. These protocols simply set out what data is sent, and
    how it is laid out, leaving the mechanics of transferring it to TCP.


    When you communicate with another computer over the internet, for example when
    you look at a website, it is much more convenient to use the remote machine''s
    name, rather than its IP address. Your computer can translate a name into an address,
    and back again, in two ways.


    Firstly there is the file /etc/hosts. This contains a list of IP addresses and
    the name or names — one machine may have several aliases — of the computers that
    go with it. This is part of /etc/hosts on one of my computers:


    ```

    127.0.0.1       localhost.localdomain

    192.168.0.2   falstaff

    192.168.0.3   oberon

    192.168.0.4   puck

    192.168.0.7   titania

    192.168.0.10  portia

    ```


    Note that the first entry is for the loopback address. Datagrams sent to this
    address simply bounce back to the computer they came from. The loopback address
    is one way in which two programs on the same computer can communicate through
    a form of TCP/IP. The other addresses are the computers on the Local Area Network
    or LAN. These addresses are in a range which is reserved for private networks.
    Computers outside the LAN do not appear in this file.


    The second way of converting between names and addresses is to use the Domain
    Name Server (DNS). A DNS is a program that provides information about computers
    on its section of a network, queries other servers and answers queries from application
    programs.


    You can set up your own DNS or you can use one on another machine.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'Setting up your DNS is very simple. If you install the name-server package,
    called ‘bind’, and a standard set of configuration files known as the ‘caching
    nameserver’, your DNS will configure itself automatically.


    A DNS works by querying one or more of the ‘root’ nameservers’, a small number
    of computers which supervise the DNS lookup mechanism. From them it learns which
