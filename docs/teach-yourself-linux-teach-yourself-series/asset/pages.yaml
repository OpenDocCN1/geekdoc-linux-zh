  md: '# 219 glossary


    pseudo user


    of data is sent from one machine to another.

    A user identity, such as ‘the web server’, which is used to run programs but does
    not correspond to a real person.


    Random Access Memory


    Memory used to hold the programs and data your computer is actually working on,
    so called because it can be accessed in any order.


    Read Only Memory


    Memory that cannot be changed by the normal operation of your computer. Commonly
    used to hold instructions telling your computer how to start up when it is switched
    on.


    redirect


    To send data to a different place, for example to send something that would normally
    be seen on the screen to a printer.


    relative path


    A description of where a file is written as a route from the current directory
    to the file.


    rescue system


    A version of Linux that is started up to deal with a particular problem.


    root


    The person who has the privileges to be able to change anything on a Linux system.


    root directory


    The directory, written as a single slash character, that contains every other
    file and directory known to a Linux system. Do not confuse this with root’s home
    directory, which is /root.


    root squash


    An NFS server that receives a request from a user on another machine who claims
    to be logged in as root can ‘squash’ the request, removing the root privileges.


    router


    A machine that redirects packets from one network segment to another.


    RPC SCSI


    Remote Procedure Call.

    Small Computer System Interface.'
