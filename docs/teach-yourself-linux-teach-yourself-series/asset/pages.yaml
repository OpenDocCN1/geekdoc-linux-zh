    # 4.4 Games


    Linux is well supplied with card games, board games, puzzles and civilization-building
    simulations. These function well with X-Windows, which was originally designed
    with work rather than play – particularly involving fast action – in mind.


    Any distribution will come with a dozen or so games of this kind. Finding out
    exactly what you have and how to win all of them is a good way of wasting a week
    or two and playing lots of really irritating background music.


    Fast-action games are becoming available. They depend on an extension to X-Windows
    called OpenGL which connects video cards with hardware accelerators to programs,
    including games, that can produce high-speed moving picture output.


    One of the best demonstrations of this extension is Tux Racer, available at http://www.tuxracer.com/,
    a game which involves guiding a small penguin down a ski slope, grabbing frozen
    herrings and trying to stay on course.


    There is more information about OpenGL at http://www.opengl.org/, including information
    about video cards that work with OpenGL.


    The website http://www.linuxgames.com/ is an abundant source of downloadable games
    and news about new releases.


    # 4.5 Web, mail and news


    Running a browser – or any other application that makes use of the internet –
    on Linux is very easy. The underlying kernel takes care of the internet connection,
    leaving the browser to deal with the things it does best.


    The World Wide Web has been seduced from its original intention – that any page
    should be viewable with any browser. You'
  merge: -1
