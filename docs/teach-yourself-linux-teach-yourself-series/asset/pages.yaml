    A server will not automatically accept a connection from any other machine. This
    is an important security feature: it prevents other users on the same network
    seeing what is on your screen.


    The simplest way of controlling access to your display, and one that is reasonably
    satisfactory on a very small, secure network is to use the xhost program. This
    program sends commands to the server to tell it to accept or reject connections
    from particular computers. It does not offer good security to control access to
    displays over the public internet. If you use ssh instead of telnet you will usually
    find that authentication is done for you, and you do not need to use xhost.


    When a client (an application program) connects to a server the client supplies,
    via the connection, the ''inside'' parts of a window. The borders and title bar
