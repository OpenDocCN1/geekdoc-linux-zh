  md: 'segment and multicast addresses are used to send a packet only to machines
    on a particular list.

    The sending machine must be able to tie the IP address of a packet to the hardware
    address of the destination. To do this it uses Address Resolution Protocol (ARP).
    The sender first puts out a broadcast saying ‘Who has this IP address? Tell it
    my IP address, which is this.’ The machine that has that then replies, ‘This is
    my IP address and I am at this hardware address.’ This transaction puts the IP-to-hardware
    translation in the ARP cache of the originator. The cache continues to exist for
    around a minute, after which it is automatically removed. While it exists the
    sending machine does not need to use ARP protocol again to look up that machine.


    One potential problem with the ARP protocol is that if the IP address of a machine
    is changed then any machine that has not previously been in contact with it will
    be able to connect at once. Other machines, which have been in contact, will have
    the old, and now wrong, translation in the cache. They will be completely unable
    to communicate until the cache is correct again, after which everything will long
    enough for you to call someone for advice, only to find the problem evaporates
    as the other person answers.


    You can use translation in the opposite direction, via the Reverse Address Resolution
    Protocol or RARP, if you have machines on the network that do not know their IP
    addresses when they start up. Diskless workstations, computers which do not have
    their own hard drives but but use space on another machine’s disk, may use RARP
    to get started.


    Dynamic Host Configuration Protocol (DHCP) is rapidly superseding RARP and related
    protocols. DHCP is very useful wherever a large number of computers have to be
    connected to a network. They can all be set up identically, then the hostnames
    and IP addresses are handed out automatically by a DHCP server. These can either
    be set up manually in advance, or the DHCP daemon can generate IP addresses automatically
    when it finds a new machine on the network.


    When you install Linux with networking it sets up the forwarding rules so that,
    if forwarding is turned on, every datagram can be be forwarded. This may not be
    what you want, particularly if you intend the machine to act as a firewall to
    protect itself, or a subnet, from unauthorized access.'
