  md: 'Run the terminal program. The exact menu selection to do this varies between
    distributions. It will have an icon that looks like a little monitor and be called
    either ''Terminal'' or ''Shell''. A terminal window will open and you will see
    a prompt ending in $. Type the letters ps and press the Return (sometimes labelled
    Enter key). You will see a list of the programs you are running.


    Look at the title bar of the window you have opened. Try moving the mouse over
    the icons in the title bar and then clicking on them to see what they do. Can
    you find something called ''Help'' among the menus? Select it and read the information
    it provides.


    Press Ctrl-Alt-F2. log in with the user root and the root password you set during
    installation. You will see a prompt ending in the # character. Type who in lower
    case and press Return. This will show that there are two logged-users: the text
    session and the GUI.


    # 3.3 The file tree and paths


    All the files known to a Linux system are arranged in a file tree. The name comes
    from the fact that it is arranged as a series of branches fanning out from a single
    root. Every accessible file and directory, even if it is imported over a network
    or on a removable disk, appears somewhere in the tree.


    The location of a file in the tree is written as a string of characters called
    a path.


    The file tree begins at the root directory. This is usually a directory on your
    hard disk. The path of the root directory is a single slash character, /. Every
    other file and directory on the system branches off from the root directory.


    A file in the root directory has a path which is a slash followed by the name
    of the file. So a file called ''information'' in the root directory would have
    /information as its path.


    Subdirectories can branch off from the root directory. They have the same type
    of path as files. For example /etc is a subdirectory that contains a lot of system
    setup information and /home contains the individual users'' files.


    The path of a file within a subdirectory is the path of the subdirectory, another
    slash, and the name of the file. The file that contains a list of the users is
    /etc/passwd for example.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Further directories can branch off subdirectories to any number of levels.
    /home is the directory that contains the users’ files. It can contain /home/kathy
    which is the files belonging to user kathy - note that the case matters, /home/kathy
    and /home/Kathy would be two different directories. Then her directory could contain
    /home/kathy/dogpic.jpg which might be a picture of her dog in JPEG format. It
    could also contain /home/kathy/recipes inside which she might keep /home/kathy/recipes/chocolatesauce,
    /home/kathy/recipes/onionsoup and /home/kathy/recipes/cake.


    To save the need to type the full path every time you refer to a file there is
    a marker which points to one directory in the file tree and says, ‘You are here’.
    Where this marker points is called the working directory.


    In the example above, if the working directory was set to /home/kathy/recipes
    file /home/kathy/recipes/cake could be referred to by nothing more than its name
    cake.


    The tilde character ~ is a shorthand for ‘belongs to’. If Kathy types ~ means
    the same thing as /home/kathy; if Bob types ~ / it means /home/bob. Typing ~kathy/
    always means ‘where kathy keeps her files’, in this case /home/kathy. So ~kathy/recipes/cake
    means the same as /home/kathy/recipes/cake.


    The path . refers to the working directory, so in this case / means the same as
    /home/kathy/recipes and can be used as a shorthand for this directory.


    A relative path is one that is specified as a route from the working directory.
    The path .. means ‘go back one step towards the root’. So in this case it would
    mean /home/kathy and .. /.. would mean /home. It is possible to extend this, ..
    /..bob would be /home/bob - the directory where Bob keeps his files.


    The term absolute path is used to distinguish a path that starts at the root,
    such as /home/kathy/recipes from a relative path.


    Files whose names begin with a dot are called hidden files. They are commonly
    used to hold user preferences and only appear in directory listings if specifically
    requested with the -a option to ls.'
