    # 4.2 Graphical tools


    Graphical tools come in two flavours – those that operate on images and those
    that work with vectors.


    Images are stored in your computer as a list of colours to display at different
    points on the screen or print on a page. The words bitmap and raster are used
    for this kind of graphics. This works well for pictures captured from real life
    with scanner or camera. Images drawn with a paint program contain much sharper
    edges and do not take to being scaled up or down – they disintegrate into jagged
    edges and broken lines. Figure 4.2 shows how this happens.


    Vector graphics are held in a different way. A vector graphic can contain directions
    as ‘Go to a point 2 inches from the top of the paper and 1 inch from the left.
    Draw a circle 1 inch in diameter centred here’. You can make that graphic twice
    the size by doubling all the numbers in the command and the software that puts
    the graphics on the display or prints it will draw a larger circle. Because the
    software is drawing the graphic again from scratch, rather than manipulating an
    already drawn image, vector graphics can be scaled and rotated with no loss of
    quality.


    Software as Imagemick can convert vector graphics into images. Doing this loses
    information that cannot be retrieved, which is why there are no programs that
    reliably translate images into vectors.


    # 4.2.1 The Gimp


    This is the GNU Image Manipulation Program – a tool for drawing or retouching
    images. It is a free program and can be downloaded from http://www.gimp.org/.
    It is also included in many major distributions. Users who have developed their
    graphics skills on commercial paint programs can easily transfer to Gimp.


    As well as painting, Gimp has a range of effects. It can blur, sharpen, enhance
    and distort images. There are filters that will create mosaic tiles and obscured
    glass.'
