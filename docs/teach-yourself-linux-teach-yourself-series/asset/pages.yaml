  md: 'If your computer has any older, non-standard serial ports you may need to set
    the port addresses and irqs for these devices. You can do this by putting commands
    in the file /etc/rc.serial (/etc/rc.d/rc.serial on some distributions) which is
    executed before init starts the services. This is an example of an rc.serial file
    from an older machine:


    # RB 22 may 97, set correct IRQ for Rockwell modem serial /dev/modem irq 5


    Note that in this case /dev/modem is a symbolic link to /dev/tty2. If you set
    up non-standard serial ports in this way you can start services, such as networking,
    which use them from the SysV init scripts.


    # 9.1.4 The shutdown sequence


    When you select the option to halt the computer, or use the shutdown command,
    you trigger a change to runlevel 0. Selecting reboot similarly changes to runlevel
    6.


    There are ''kill'' links for all services in both /etc/rc.d/rc0.d and /etc/rc.d/rc6.d.
    Before your computer halts or reboots these shut down every service.


    Both these runlevels call the script /etc/rc.d/halt. This script unmounts all
    the mounted filesystems, kills off all other tasks and sets the hardware clock
    to the time of day.


    If the script /sbin/halt.local exists, the halt script will execute it as its
    last act before turning off or resetting the computer.


    # 9.1.5 Starting and stopping NFS


    If you are running an NFS server on your computer to share your files with other
    machines, the SysV init scripts correctly take care of starting the network before
    the server, and stopping the server before network. Note that networking and the
    NFS server are both services and can be started and stopped from the command line
    or the ''Services'' menu option in the GUI.


    The system will normally to mount all filesystems before it enters the initial
    runlevel. It cannot mount NFS filesystems, which are imported from other computers,
    until the networking service is started – which only happens when the SysV init
    scripts are run to enter that runlevel.'
