  md: 'The major distribution manufacturers, in collaboration with the Common Vulnerabilities
    and Exposures Project at http://cve.mitre.org/, are progressively reviewing all
    vulnerable code in order to shake out bugs of this are now exploited, with the
    result that they are now becoming extinct. All major distributions are backed
    up by regular security updates available over the net which fixes bugs of this
    kind.


    Checking a machine for damage is relatively simple. The verify option of the rpm
    program can perform a basic check. The tripwire package program performs a better
    test, and can also detect attacks on the rpm system itself. You can also use tar
    to compare your system against a known good backup.


    # 7.4.5 Intrusion


    Unauthorised access to a computer over a network, through services as NFS, telnet
    or ftp, is called intrusion. It is not always malicious but it can be very destructive.
    You can detect and prevent intrusion attempts with a few simple steps.


    +   * Set up your firewall to reject any connection attempts other than you expect.
    If you are not using a firewall sure that /etc/hosts.allow and /etc/hosts.deny
    create a barricade around all of your ports, letting through only the very few
    accesses you choose to permit.

    * Use ssh in preference to rsh, telnet and login, disable the other protocols
    by editing files in /etc/xinetd.d.

    * Periodically check /var/log/messages for rejected connections and authentication
    failures. Investigate any that you do not understand. Make yourself unpopular
    by demanding explanations.

    * Make sure that your /etc/exports file is as restrictive as possible. Export
    filesystems read-only and with root squash if you can. Export only to IP addresses
    that have a legitimate reason for access. Exporting a scratch area is often safer
    than exporting all or part of /home.


    # 7.4.6 Psychological pointers to security risks


    You can often anticipate breaches of security by noticing one of these common
    situations – all of which I have seen.


    +   * ‘You’re fired!’ But he still has the root password. Make sure that you change
    all critical passwords at once.'
