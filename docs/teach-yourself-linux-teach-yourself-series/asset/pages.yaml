- img_proc: true
  md: 'By installing the new kernel you should not damage the old one – they should
    have different version numbers. In the unlikely event that something goes wrong
    and you make your system inoperable, you can recover the situation by booting
    from your recovery floppy, copying the files on the floppy back into /boot directory.
    You may need to reinstall your boot loader as well – follow the instructions in
    Chapter 8.


    Some distributions make use of the EXTRA parameter to differentiate a kernel which
    you have built by appending the word ''custom'' or similar to the version number.
    Look in /usr/src/linux/Makefile to see if your distribution uses this facility.


    Now type


    ```

    make modules_install

    ```


    to copy the modules you have created into /lib/modules.


    Installing the kernel should have rebuilt the initial ramdisk as well. However,
    it may have been rebuilt with modules from the old kernel, so it is worth doing


    ```

    make install

    ```


    again at this point to force the current modules into the initial ramdisk.


    Adjust your boot loader (see Chapter 8) to offer your new kernel as a boot option.
    This happens automatically when you install the kernel with some distributions.


    You can now reboot your machine and, if all has gone well, it will come up running
    your new kernel. If not, examine any error messages carefully. Common reasons
    for a new kernel not starting are:


    +   * Boot loader incorrectly set up. It may be trying to load the kernel from
    the wrong file, or a kernel and an initial ramdisk that are not the same version.

    * Kernel built for wrong hardware. Your kernel may be trying to run code built
    for a Pentium on an old 486.

    * Incorrect built-in driver. If you compile in a driver for hardware that is not
    installed on your machine you may produce a kernel that starts and then crashes
    at once.


    Once your new kernel is running you can begin to customize it.'
  merge: -1
