  md: '# ### 4.3.1 Setting up a PostgreSQL database


    You can set up a PostgreSQL database by installing both the basic database software
    and the server itself. These are commonly separate packages.


    When you start the PostgreSQL server it will listen on a UNIX-domain socket for
    client programs to come along and access its databases. If you want to access
    the server across a network from another machine, or from a package that does
    not use UNIX-domain sockets, you can add the TCP/IP address domain by editing
    /var/lib/postgresql/data/postgresql.conf. Uncomment these lines – note that they
    may vary slightly between versions of the server:


    ```

    tcpip_socket = true

    port = 5432

    hostname_lookup = false

    show_source_port = false

    ```


    Start the server by using the ‘Server Settings’ option on the desktop or typing
    postgresql start


    in the shell – you must be logged in as root to do this.


    The PostgreSQL server does not run as root. When it is installed it creates a
    pseudo user called postgres. To control the server you can either log in postgres,
    or su to postgres from another login. Then you can use these commands to control
    the server:


    +   - createuser – Make a new entry in the list of users allowed to access the
    database.

    - dropuser – Remove a user from the list.

    - createdb – Create a database.

    - dropdb – Remove a database.


    Once you have one user and one database set up you can use the psql program to
    test the database by typing SQL commands. The details of SQL itself are beyond
    the scope of this book, but the command


    ```

    select * from pg_databases ;

    ```


    will display the contents of the list of databases and demonstrate that the system
    is working.

    Access to the postgres server is controlled by the file /var/lib/postgresql/data/pg_hba.conf.
    This specifies which'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'machines can connect to the server, and how the identity of the person logging
    on is checked. This file contains a lot of helpful comments.


    The full documentation for PostgreSQL is available in a variety of formats from
    http://www.postgresql.com/, including an excellent SQL tutorial.


    # 4.1.3.2 Setting up a MySQL database


    Install the mysql, mysql-server and mysql-devel packages, or their equivalents,
    and start the mysql server.


    MySQL comes with extensive documentation in the form of a single guaranteed HTML
    file. This contains a very useful SQL tutorial. You can leave this open in a browser
    on one desktop while you experiment with SQL in a window of another.


    Use the command mysql, with no parameters, to open the mysql monitor. MySQL starts
    up with two databases already created:


    +   - mysql - This is the database of users and their access rights. Use the GRANT
    and REVOKE commands to modify it.

    - test - This is a scratch area where you are free to try out SQL commands without
    damaging any real data.


    # 4.1.3.3 Setting up ODBC


    Install the unixODBC and unixODBC-devel packages. Add the drivers (MyODBC or PostgreSQL-odbc).


    The relationships between the names that ODBC gives to databases, the drivers,
    and the servers that ODBC connects to are set up by two files, /etc/odbc.ini and
    /etc/odbcinst.ini. The second of these files contain the names of some libraries;
    check that these refer to the most-to-date versions in /usr/lib.


    Note that the odbc.ini file can contain passwords - a potential security risk.
    Using a private .odbc.ini in your home directory can reduce the hazard.


    These files are often supplied with the correct settings for MySQL and PostgreSQL
    already coded. You can edit these files manually, or install the unixODBC-kde
    package which contains ODBCConfig, a graphical editor for the setup files. This
    package includes the DataManager command which generates a tree-structured display
    of all the data sources, databases, and fields that ODBC can access.'
