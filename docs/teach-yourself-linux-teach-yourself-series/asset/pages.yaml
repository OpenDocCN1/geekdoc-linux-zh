- img_proc: true
  md: 'One of the first partitions can be designated as ‘Extended’ – fdisk will give
    you an option to create this sort of partition when you enter the n command. You
    can then create ‘Logical’ partitions with numbers of 5 and above inside the extended
    partition. The cylinder numbers in the example illustrate this. Primary partition
    1 runs from cylinder 1 to 616, extended partition 2 is from cylinder 617 to cylinder
    2431. The logical partitions, 5 to 8, now end-to-end inside the extended partition.


    You can always use the q command, or press Ctrl-C, to break out of fdisk. This
    is a safe thing to do as fdisk will not change anything until you tell it to.


    When you have finished editing your partitions look at them with the p command
    – you can do this at any time to check what you are doing – and if everything
    is correct you can now make your changes permanent.


    Enter the w command to write the new partition table to disk. Fdisk will now try
    to make the kernel see changes to the table. If there is a problem you should
    reboot the machine at this point. To reboot either exit from the rescue system
    or press Ctrl-Alt-Del.


    Any partition that contained a filesystem before you ran fdisk, and is in exactly
    the same place – starting and ending cylinders – should be undamaged by repartition.
    Any partition that has changed in any way should be reformatted with mkfs or mkswap.


    Fdisk does nothing to the contents of a partition. Moving or changing its size
    with fdisk will not move the data or change the size of the filesystem.


    # 8.3.6 The ‘Dropping you into a shell’ message


    If a partition is corrupt you may see a message when you try to bring up the system
    which looks like this:


    > *** An error occurred during the file system check.

    *** Dropping you to a shell; the system will reboot

    *** when you leave the shell.


    This is one of the very few cases in which a Linux machine will need human intervention
    to help it come up. You can now type the root password – or press Ctrl-D to try
    to go on with the startup.'
