  md: 'nfs as their type. This stands for ‘Network File System’ and will be explained
    in Chapter 6. Vfat is a generic term for the fat filesystem and its variants are
    used by MS-DOS and systems derived from it. The swap filesystem is an area of
    disk in which the kernel can place tasks which are temporarily idle in order to
    reclaim the memory they are using. CD-ROMs use the ISO 9660 filesystem – the name
    comes from the International Standards Organization publication which defines
    the layout of data on a CD-ROM.


    Finally the filesystem type can be set to ‘auto’. In this case the system will,
    by trial and error, to find out what filesystem is present on a device. Put a
    floppy in MS-DOS, ext2, ext3 or Macintosh HFS format in the drive, click on the
    appropriate icon and the system will mount it correctly.


    In the fourth column is a list of the options for each filesystem. In most cases
    this is simply the word ‘defaults’, indicating that the default options – to mount
    the filesystem when the computer starts up – are all that is needed. You can find
    a list of the options you can use here on the man page for the ‘mount’ command.
    Filesystems marked ‘user’ can be mounted and unmounted by any logged-on user,
    the ‘owner’ option means that only the person logged using the screen and keyboard
    connected to the computer can mount and unmount, not a user who is logged over
    the network from another machine.


    Some filesystems, such as ext2 and ext3, make a note of which user owns each file,
    and keep a list of permissions – things that different users are allowed to do
    to the file. Application programs expect this information to be present, regardless
    of the type of the filesystem. Some filesystems hold neither owner information
    nor a complete set of permissions. Because of this, extra information often has
    to be supplied in the options when mounting a filesystem as fat or vfat.


    The fifth column of fstab controls backups – it is rarely used. The sixth and
    last column is used to select the checks Linux makes at startup. A 1 in this column
    means that the filesystem is checked for damage before the bulk of the system
    is started. The root filesystem should be marked with a 1. A 2 means that the
    filesystem is checked as part of the routine startup sequence and is the normal
    setting for all other partitions on fixed disks. A 0 in column six means that
    Linux will not do any automatic checks.


