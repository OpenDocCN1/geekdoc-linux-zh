    * Draw – a vector graphics tool.

    * Impress – a slideshow package.

    * Math – an equation editor.


    These packages can both import and export word-processor documents and spreadsheets
    in Microsoft-proprietary formats.


    Their native file format uses compression – a document saved in OpenOffice format
    can be unpacked with the unzip command to separate out the text of the document,
    formatting information and embedded graphics.


    OpenOffice can merge data from a variety of sources, such as the Mozilla address
    book, spreadsheets and dBase databases, into word-processor documents. It can
