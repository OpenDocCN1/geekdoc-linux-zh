- img_proc: true
  md: 'The easy way to make a spec file is to start editing it with emacs in your
    source directory. The current version of emacs automatically create almost all
    of the file for you. You can find the full instructions for writing the spec file
    in the RPM howto. Be careful to read the version that goes with the copy of RPM
    you have, some steps in the process have changed recently.


    To create the .rpm I put the source files in a directory called /home/unclebob/tsplit-1.0.3/
    and the last part of the name must match the package and the tarball we are creating.


    Next I create the tarball with this command (it should be all on one line):


    ```

    tar -C /oldhome/unclebob/ -cvzf /usr/src/redhat/SOURCES/tsplit-1.0.3.tar.gz tsplit-1.0.3

    ```


    This creates the tarball in /usr/src/redhat/SOURCES, and gives it the -C option
    to arrange that only the last path component is put in the tarball. The directories
    under /usr/src/REDHAT are specially laid out for building rpms.


    Finally I type rpmbuild--clean -ta tsplit/tsplit-1.0.3.tar.gz


    and rpmbuild does the rest. It unpacks my tarball, uses my makefile to compile
    the program and compress the man page, and creates three files:


    ```

    /usr/src/redhat/RPMS/i386/tsplit-1.0.3-1.i386.rpm

    /usr/src/redhat/RPMS/i386-tsplit-debuginfo-1.0.3-1.i386.rpm

    /usr/src/redhat/SRPMS/tsplit-1.0.3-1.src.rpm

    ```


    These are the rpm which can be installed on the system with the -i option to rpm,
    or sent over the internet to someone else, a tiny rpm of debugging information,
    and the source rpm.


    The source rpm contains the tarball. You can, from the source rpm, repeat the
    entire build process.


    If you are given a program in the form of a tarball you can try to turn it into
    an rpm in the same way. This may not always work, the program you have been given
    may have been developed on a different system and need some small tweaks to work
    with Linux.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'The tidy way to deal with this is to unpack the tarball twice into two directories
    with slightly different names, fix the problem (sometimes easier said than done)
    and use the diff program to make a list of your changes. This list is known as
    a patch – mentioned patching in an earlier section.


    Now when you build the rpm you simply mention the patch in your spec file and
    rpmbuild will apply the patch.'
