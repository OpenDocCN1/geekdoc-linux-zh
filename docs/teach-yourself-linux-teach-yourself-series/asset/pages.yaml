    - A printer with a built-in JetDirect server.


    Once a remote printer has been set up, any program can use it exactly the same
    way as it would use a printer directly connected to the computer.


    A remote printer has a print queue on the local machine. When a program sends
    a job to a remote printer the job is first put into'
