- img_proc: true
  md: 'A running server offers one or more visuals to its clients. A visual describes
    what the graphics card can do – how many colours it can display and what sort
    of palette, if any, it uses. Clients are then expected to send requests to the
    server in a way that fits in the visual. The server may allow the clients to send
    requests in several different forms, in which case the server will offer the client
    a choice of several visuals.


    You may sometimes see error messages with the word ''visual'' in them, particularly
    if a program cannot start up because it cannot find a visual it can use.


    If this happens, use the xdpyinfo command to look at the visuals the server offers.
    Then you can change the XF86Config file, as described above, to reconfigure the
    server so that it offers a visual that the program can use. Remember that changes
    only take effect when the server is stopped and restarted – you can force this
    by pressing Ctrl-Alt-Backspace, but make sure you close any programs with unsaved
    data first. It is only the server that needs to be restarted, there is no need
    to reboot the machine.


    # EXERCISES


    +   **3.14** Use the less command to examine the file /etc/X11/XF86Config. Read
    the manual page for this file.


    +   **3.15** Use the xdpyinfo command to read information about your display.
    Compare what you find with the result of the previous exercise.


    # 3.9 The Graphical User Interface (GUI)


    In the previous sections you have seen how the X-Windows system works. X-Windows
    is only the foundation of the GUI, it operates the graphics card and deals with
    the keyboard and mouse. As a user you want more than this. You want to be able
    to drag and drop files, run applications by clicking on them and keep track of
    open windows.


    There are several desktop environments that can be run on X-Windows. The older
    fvwm is rarely used now. The two commonest are KDE and GNOME. You can learn more
    about KDE and GNOME at http://www.kde.org/ and http://www.gnome.org/ respectively,
    which are the official project websites.'
