- img_proc: true
  md: 'Begin by trying the effect of changing an option and seeing what happens. The
    sequence of commands is:


    ```

    make xconfig

    make dep

    make bzImage

    make modules

    make modules_install

    ```


    Once you have done this you can do anything with the kernel. In particular, you
    can install kernel patches.


    An example of a kernel patch is shown in Figure 12.1. This patch was written by
    Steve Purcell, to whom I am indebted for his kind permission to include it in
    this book.


    This patch enables the kernel to communicate correctly with the Freecom FS-1 CD
    reader. This drive makes a slightly unusual response to the USB INQUIRY command.
    The patch enables Linux to recognize the drive correctly from its response.


    The patch was created by editing a new copy of the kernel source to fix the problem,
    then using the `diff` command to make a list of the changes. The output of `diff`,
    which is the patch, is the text in the line.


    The patch `.h` indicates three files, `unusual_dev.h`, `usb.c` and `usb.b` were
    modified. Within each file it gives a rough location, on the lines beginning with
    `@@`, of the change. It then shows a sample of unaltered code, the new code marked
    with `+` at the beginnings of lines, and another short unaltered section. Deleted
    lines (there are none in the example) would be marked with `-` at the beginning
    of the line.


    The patch command can make the same change to another set of source files by reading
    the patch and making edits.


    This works in most cases even if the code being patched is not quite the same
    as the version on which the patch was generated. Patch deals with this in a very
    intelligent way, trying to match the samples of unaltered code to the file it
    is editing, and adjusting the point at which it inserts or deletes code to match.


    This patch was generated on kernel version 2.4.21. I put it in a file called `fs1patch`
    in the kernel source and applied it fully to `2.4.20` using these commands:


    ```

    cd /usr/src/linux-2.4.20-13.9/

    patch -b -p1 -F 5 <fs1patch

    ```'
