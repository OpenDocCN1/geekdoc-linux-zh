- img_proc: true
  md: 'Commercial organizations and some government departments are rapidly converting
    to Linux, in order to take advantage of higher reliability at lower cost.


    If you want to make your career with Linux you can either choose formal training
    with certification, or an informal, hands-approach.


    I normally avoid making predictions, at least until after the event. In this case
    my best guess is that Linux will increasingly be adopted by major concerns, and
    a side-effect of this will be increasing significance of formal qualifications
    over the next decade.


    Linux – in common with all open-source software – lends itself to informal learning
    by people who are interested enough to go and look things up for themselves. Frequently
    the designers of the certification programmes have recognized this.


    # 11.1 Linux Professional Institute (LPI) at http://www.lpi.org/


    issue certifications which are not specific to distributions and which are rapidly
    gaining acceptance.


    Red Hat Corporation operate a formal certification programme, leading to either
    both the Red Hat Certified Engineer (RHCE) or Red Hat Certified Technician (RHCT)
    qualifications. Both of these are given after both a practical and a written exam.
    The RHCE is the lesser qualification, indicates your ability to set up a network,
    making the relevant engineering decisions. showing that you know how to maintain
    and extend a working system.


    Because these qualifications are ‘performance-based’ – only given after a practical
    examination – they becoming accepted as proof that you can really make a system
    work.


    The practical examination is more searching than a simple multiple-choice test;
    most candidates who fail the practical pass the written exam. This has one major
    advantage– if you pass the RHCE tests it is clear that you know what you are doing.


    There are several courses leading to the RHCE and RHCT qualifications. Before
    parting with money make sure that any course you are thinking of taking is approved
    by Red Hat as meeting the requirements of their current examination.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'The course designers accept that students will come to the courses with differing
    levels of knowledge. There are ‘fast track’ options you can choose if you have
    already built up some experience with Linux.


    You will also find some courses that deal with specific aspects of Linux. These
    usually lead to a course completion certificate. Employers often send their staff
    on these courses, and expect the certificate as proof that the student has made
    satisfactory progress.


    Informal training is sometimes organized by LUGs. While this leads to no recognizable
    qualification it has the huge advantage that it is usually free.


    # 11.2 Career development


    The IT industry, of which Linux is a part, regularly lurches between boom and
    total collapse. The best strategy is to plan for a wait of many months before
    your ideal opening presents itself. If you want to use an agency make sure that
    you pick one that has some idea of what Linux is or you waste a great deal of
    your time – and everyone else’s – weeding out unsuitable vacancies.


    Acquiring formal Linux skills, even possessing informal skills garnered from using
    Linux, will improve your employment prospects. There is some statistical evidence
    that Linux skills, particularly when backed up by a formal certification, have
    a positive effect on salaries.


    There is one small pitfall here, and a warning to employers. If you are the only
    person in an organization with Linux skills the management will assume that you
    are on call day and night throughout the whole year. I have once surfaced from
    a scuba dive to be presented with a fax asking for help with what turned out to
    be a fairly trivial problem.


    Linux skills are best developed by using them. If you have an idea for something
    that might be done, or you want to find out how some feature works – try it. I
    have always allocated a proportion of my time to what I called *piano practice*
    – writing small and possibly useless programs to test concepts. I have explored
    most of the quieter backwaters of the system in this way.'
  merge: -1
