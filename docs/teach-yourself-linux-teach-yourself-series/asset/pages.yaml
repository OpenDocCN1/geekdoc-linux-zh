    ```


    as root to find out which tasks are hanging onto the filesystem

    you want to unmount. Lsof produces more intelligible output.


    All the files which are known to a Linux system appear in a file

    tree. When a device is mounted the directories and files on that

    device are grafted onto the file tree at a point which is called the

    mount point. A mount point is a directory which already exists

    in the file tree. For example if you have a floppy which contains

    files window.bat and fruit.bat, and a directory called

    bats, and you mount this floppy at the mount point

