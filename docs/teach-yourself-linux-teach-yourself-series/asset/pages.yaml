  md: '# 218 glossary


    ISP latency

    interface on a network or network segment.

    Internet Service Provider.

    The time it takes a computer to respond to an external event.


    major number

    A number which identifies a device driver and connects it to an entry in /dev.


    minor number

    A number which identifies one particular device out of several similar ones.


    mount point

    A directory which is used as a place to attach a new file system to an existing
    one.


    mount

    Attach a filesystem – such as a disk – a file tree, making it visible to the users.


    noexec

    An option which, when set on a filesystem, prevents running any programs from
    that filesystem.


    null string

    A text string that contains no characters. The notation "", with quotes with nothing
    between them, is often used to indicate that a parameter is a null string.


    option

    Characters written after a CLI command which give additional instructions to the
    command, usually marked with one or two hyphens.


    parameter

    Characters written after a command to give it information; compare option.


    path

    A description of where to find a file, either absolutely or relative to the current
    directory.


    permissions

    Flags set on a file or directory to indicate who may read or write it.


    PCI

    Peripheral Component Interconnect.


    PDF

    Adobe’s Portable Document Format, readable with Acrobat.


    PPP

    Point to Point Protocol.


    prompt

    Anything the computer displays to tell you that it is waiting for input.


    protocol

    A set of rules for how a particular type'
