    on the button labelled with three dots and hold your breath. If everything is
    set up correctly a list of ODBC data sources will be displayed and you can select
    one of them. If you have a driver missing, OpenOffice will crash now or in one
    of the next few steps. If this happens, go back and check that you have all the
    drivers loaded and that ODBC is set up correctly.


    Now click on the ODBC tab. Enter the user name which you log into the database
    – this might not be the same as your ordinary login name.


    Click the Tables tab. Choose the tables you would like to be available to the
    word processor and the spreadsheet.


    You can use the Queries tab to construct SQL queries – these are commands to the
    SQL server which tell it to choose parts of the database, sort records into order
    and organize them into groups. SQL can do some very useful things, including using
    information from one database to query another. If you want to learn SQL, the
    easiest way to do it is to work through the tutorials in either the PostgreSQL
    or MySQL packages.


    Click on the OK button when you have set up your database connection, then press
    F4 to begin using the database.


    Some databases will appear as read-only in OpenOffice – you cannot enter any data
    – when you would expect them to be writable. This is usually because OpenOffice
    needs a hidden key to keep track of how it orders the records. Create a simple
    database using OpenOffice, then look at its structure with mysql or psql, and
    you will see the extra column.


