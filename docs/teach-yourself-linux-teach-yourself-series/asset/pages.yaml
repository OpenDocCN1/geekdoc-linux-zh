- img_proc: true
  md: '# 176


    # Inside linux


    Nor cannot dismount them with the local filesystems because networking is shut
    down when your computer enters a shutdown or reboot level.


    To get around this, Linux pretends that there is a service called netfs. This
    is started and stopped by the SysV init scripts in the usual way. It is not a
    really service - there is no background program associated with it - but mounting
    it all the NFS filesystems and stopping it unmounts.


    The NFS protocol is designed to cope with major interruptions to the network.
    It does this by holding the tasks on the client machine that use files on the
    server until the problem has been cleared. This is normally what you want to.
    If you are copying a lot of files from one machine to another, and someone turns
    off the power to a hub somewhere between the machines, you want to be able to
    turn the hub again and have the file transfer resume as if there had never been
    a problem. But if you are trying to shut down a machine which has a filesystem
    mounted on a server which cannot be reached-either because of a networking problem,
    or because the server itself failed-the machine you are trying to shut down will
    wait for ever for the server to acknowledge the unknown request.


    This problem has been inherited from older UNIX systems. NFS was originally intended
    for use with diskless workstations. Having no local disks, these workstations
    could safely be switched off without going through a proper shutdown sequence.


    There are several things you can do about this:


    +   - Use automount with NFS filesystems. This can reduce the probability that
    they will be mounted when the server fails.

    - If you know that a server has failed, log in as root and unmount any filesystems
    mounted on it by hand. Using the -f option forces the dismount even if the server
    does not respond. This takes some time as Linux will wait for a response from
    the server, then do the dismount. You may need to use the fuser command to find
    out which tasks are still using the failed server and kill them first.

    - Leave the machine until the server is restarted.


    Resetting the machine with the power switch is a last resort. If you are going
    to do this it is a good idea to wait until the machine has done nothing for thirty
    seconds. This gives Linux a chance to write information in memory back to disk,
    and improves the chances that the machine will restart cleanly.


    # 09'
