- img_proc: true
  md: '# 4.3.1 Astronomy


    The Clear Sky Institute at http://www.clearlyinstitute.com distributes Elwood
    Downey’s XEphen program, which is a star chart and an ephemeris (a program that
    calculates the movements of the planets).


    You can download a free version of this program, or buy the full version, complete
    with a catalogue of 70 million stars, CD-ROM.


    Once you’ve entered your location on the Earth’s surface - there is a handy table
    of cities to help – XEphen will do the rest and give you the freedom of the night
    sky. It can display views of the Moon and Mars, and track the satellites of Jupiter
    and Saturn.


    Even if you only have a passing interest in astronomy this program is completely
    absorbing.


    # EXERCISE


    4.6 Download the free version of XEphen, install it on a laptop if you have one.
    On the next clear night display the sky view for your location and try to find
    at least three real constellations that match what you can see on the screen.


    # 4.3.2 Mastering CDs


    The filesystem on a CD is different from that on a normal disk, because it never
    has to be modified during the life of the disk.


    There are three types of CD:


    +   * Music CDs. These have a series of tracks, each containing uncompressed audio
    data.

    * Data CDs. These usually have a single data track containing an ISO 9660 filesystem,
    and are also called CD-ROMs.

    * HFS CDs. These are intended for Apple Macintosh computers and have a single
    track containing a Hierarchical File System. These can be mounted on Linux systems
    by setting the filesystem to HFS. Some Linux distributions are supplied on HFS
    CDs.


    The word ‘track’ when applied to a CD does not mean the same thing as a track
    on a hard disk. A CD track is a collection of any length. The CD has a Table of
    Contents (TOC) which lists the tracks on a CD, their positions and their sizes.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'The original ISO 9660 standard for CD-ROMs specified that the files on them
    should have filenames with eight characters, a dot and three more characters (often
    called ‘8.3 filenames’). This standard was then modified by the ‘Rock Ridge’ and
    ‘Joliet’ extensions, both of which allow long filenames – but in two totally incompatible
    ways.


    You should use the Rock Ridge extension when creating a CD for use on Linux. It
    not only handles the long filenames per permission and ownership information as
    well. The Joliet extension – which is not as general – is only needed if you are
    creating a CD with long file names for use on Microsoft Windows.


    The mkisofs program takes a filesystem tree and converts it into a single file
    which contains an exact image of the data to be written to the CD.


    The program cdrecord transfers the file created by mkisofs to your CD recorder
    – makes the CD. You can repeat this process, known as ‘burning’ the CD, to make
    many identical CDs.


    You can send the output of mkisofs directly to cdrecord using a pipe like this


    ```

    mkisofs /home/user/lots_of_files | cdrecord

    ```


    which saves space (a CD is around 700 megabytes). Only do this is you cannot find
    the disk space to run mkisofs then cdrecord. If anything goes wrong with mkisofs
    it will stop producing output and ruin your CD.


    There are several GUI interfaces you can use to make CD mastering simpler, such
    as xcdroast and gnometoaster. These are simple point-and-click front ends to mkisofs
    and cdrecord.


    Read the man pages for mkisofs and cdrecord for more information.


    # EXERCISE


    +   4.7 Use mkisofs to convert your /home tree into a CD image. Do you have to
    be logged in as root to do this? What goes wrong if you put the output file into
    /home? Mount the image with the loop option – read the man page to see how to
    do this. Do the filesystems look the same? If you have access to a CD writer,
    make a CD from your output file. Is this CD a useful backup of your files?'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# 4.3.3 Music and audio


    As shipped, most Linux distributions come with simple audio drivers that play
    and record sounds.


    The files on your computer that contain sounds can be in several different formats:


    +   - Uncompressed audio. This format gives the best recording quality, equivalent
    to a CD, at the expense of using the largest files.

    - Compressed audio, such as OggVorbis and MP3. This gives some loss of quality
    but much smaller files.

    - Sequencing information, for example MIDI (see below). This is not strictly a
    recording format, but a list of which notes to play and when. The program that
    plays a MIDI file has to supply the sounds itself.


    The Musical Instrument Digital Interface (MIDI) standard was originally developed
    as a way of connecting musical instruments to one another and to computers. The
    MIDI interface connectors that you see on the back of electronic keyboards are
    high-speed serial interfaces, used to tell an instrument which notes to play,
    when and how long to sustain them. Linux can interface to MIDI through serial
    or USB ports.


    MIDI files store the commands that would be sent to an instrument, and can hold
    information about tempo, instrument voices, and even lyrics. The MIDI Manufacturers’
    Association website at http://www.midi.org/ has a lot of information about MIDI.


    To do more with audio you can add several packages.


    The Advanced Linux Sound Architecture (ALSA) project http://www.alsa-project.org/
    is developing improved audio drivers for Linux. These are expected to replace
    the current Open Sound System (OSS) drivers.


    If you would like to compose music using Linux you can download the Rosegarden
    package. Its home page is http://www.all-day-breakfast.com/rosegarden/ which has
    the source. Pre-compiled binaries are available from The Center for Computer Research
    in Music and Acoustics (CCRMA), which is based at Stanford University http://www.ccrma.stanford.edu.
    CCRMA has an extensive collection of music software. They also have their own
    installation tool which locates and installs packages.'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'Much music software runs in real time because it has to make the decision to
    run on the correct millisecond. Running it often requires a specially modified
    kernel which can respond quickly when a task needs to be run. CCRMA have modified
    kernels available for download. Note that the CCRMA installer is almost the same
    as Debian''s apt-get command. It will attempt to correct dependency problems with
    packages that have nothing to do with music, so you may find it simplest to add
    Rosegarden as the first package after installing Linux.


    The Lilypond package, at http://lylipond.org/stable/, produces printed sheet music.
    You can transfer Rosegarden compositions to Lilypond for printing.


    Linux also includes some useful sound packages which can be run from the command
    line:


    +   - Sox - This is a simple converter between sound file formats which can also
    add some effects.

    - Timidity - This is a player for MIDI files which uses prerecorded samples of
    notes. It can write the results to a .wav audio file, or play it directly through
    the sound card.

    - Playwave - A simple program to play audio files, this command is named ''play''
    on some older distributions.


    Each distribution of Linux - sometimes each version - comes with one or more packages
    that can play or edit sound files. These change frequently and so I have not tried
    to document them here.


    You can run Rosegarden on a computer that has a basic sound interface, one that
    does not have a built-in synthesizer. This involves compiling from source. Download
    the source packages, unpack them with tar (Chapter 8) and follow the instructions.
    Install the ALSA driver, build Timidity with the options


    ```

    --enable-audio-alsa --enable-alsaseq


    --without-arts --without-ladsp --without-jack

    ```


    when you configure it. You can now run Timidity with the -iA option, and it will
    pretend to be a MIDI instrument connected to an ALSA driver.'
  merge: -1
