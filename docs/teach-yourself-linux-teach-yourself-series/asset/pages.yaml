- img_proc: true
  md: 'Recordable CDs and DVDs. At the time of writing this is the preferred technology
    for volume backups. Both drives and media are relatively cheap. Almost all the
    drives available at the moment are fully supported by Linux.


    Some of these drives can perform operations – such as erasing the media – for
    which there are no standard IDE commands, though they are connected to your computer''s
    IDE bus. The IDE SCSI driver deals with this by making some IDE devices appear
    to be SCSI devices. Software which works with the SCSI version of a particular
    drive will usually work with the IDE driver through this. To use this driver set
    a kernel parameter so that, as Linux starts up, the device will be ‘claimed’ by
    the IDE-SCSI driver. For example, if your IDE/ATAPI CD writer is /dev/hdc, setting
    the parameter


    hdc=ide-scsi will it appear as /dev/scd0 instead – a SCSI device which can be
    used with the CD-writing software. This parameter has to be set in your LILO or
    GRUB configuration. I will explain how to do this in Chapter 9.


    # 8.2.5 Specifics for Iomega drives


    Iomega Corporation, which can be found at http://www.iomega.com, make a number
    of removable media products, many of which are compatible with Linux. The Iomega
    ‘Zip Drive’, which should not be confused with the program called zip, is manufactured
    in a variety of different forms. I have bought three of these drives over several
    years for different machines and found them to work well with Linux.


    The Zip cartridge is a removable hard disk, with a capacity between 100 and 750
    megabytes. As supplied, the cartridges have a partition table with primary partition
    set up to be the whole disk. If your Zip drive is /dev/sda, for example, the partition
    /dev/sda4 will be the whole disk, and can be mounted in the usual way.


    It is possible to repartition a Zip cartridge with the fdisk program – and even
    install Linux onto it.


    Zip drives come with driver software for a variety of operating systems. There
    is also a program which can be downloaded from Iomega’s website to operate the
    Zip drive’s protection features from the Linux command line.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'A Zip cartridge reformatted on an Apple Macintosh computer using the HFS filesystem
    it can still be mounted on a Linux machine. This is described in detail in Chapter
    3.


    If you use a Zip drive with some operating systems, without installing the drivers,
    the Zip drive may be treated as a large floppy. If this happens the partition
    table is erased and the entire disk is formatted with the other system''s filing
    system. Linux can still read and write a cartridge in this state. You can mount
    it as /dev/sda instead of /dev/sda4 and use it normally.


    # 8.2.6 Using tar


    There are two kinds of command line options to tar.


    The first kind of options are functions. There are eight of these, and every command
    to tar must contain exactly one function option. The four you will need are:


    +   -c Create an archive from one or more files.

    -x Extract files from an archive.

    -d Find differences between files and an archive.

    -t List the files in an archive.


    The other options modify what tar does. The ones you will use most often are:


    +   -z Use gzip compression.

    -j Use Bzip2 compression.

    -N date Only process files fewer than the given date.

    -f path The archive is in a file.

    -l Stay in one filesystem.

    -v Be verbose – list files as they are processed.


    The date parameter to the -N option can be in a variety of formats. The easiest
    one to remember is


    YYYY-MM-DD HH:MM:SS


    note that the objects get smaller from years at the left to seconds at the right.
    This makes it a very easy format to remember. For example I am drafting this paragraph
    at


    2003-03-31 15:23:31


    which is just twenty-three and a half minutes past three on Monday 31st March
    2003. Because this date format has a space in the middle 31st it must be wrapped
    up quotes to tell tar that it is all one parameter, like this:


    ```

    -N "2003-03-31 15:23:31"

    ```'
  merge: -1
