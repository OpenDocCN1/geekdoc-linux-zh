    OpenOffice makes use of ‘Registered Data Sources’, an easy way of making different
    types of database available to any application you are using.


    A database is a collection of one or more tables. A table is a list of records.
    Each record has one or more fields – places that hold the data. The layout of
    the fields is the same for each record in a table.


    When you display a database, each record is shown as one line of cells, each cell
    containing one field for that record. Each field of each record is shown lining
    up with the corresponding field in the record above and the one below.


    This is why a record is sometimes called a row and the data in the same field
    in every record column.


    This is a very simple example of a table, an incomplete star catalogue containing
    a half of the brightest. There are rows displaying records for the six named stars.
    Each record has three fields – the name of the star, its magnitude (note that
    a smaller magnitude means a brighter star) and its spectral type. The fields are
    displayed as three columns.


    | Name | Magnitude | Type |

    | Betelgeuse | 0.8 | M2 |

    | Rigel | 0.11 | B8 |

    | Vega | 0.04 | A0 |

    | Deneb | 1.25 | A2 |

    | Sirius | -1.45 | A1 |

    | Arcturus | -0.06 | K2 |


    In either Writer or Calc you can select

    Tools → Data Sources...


    to bring up a dialogue window that lets you connect to various data sources.'
