- img_proc: true
  md: '# 8.3 Recovering from disasters


    There are two kinds of computer disasters: those that are caused by software but
    leave the hardware intact, and those that destroy the hardware as well.


    Purely software disasters are very rare with Linux machines and almost always
    traceable to a hardware problem, or to a serious blunder by someone logged in
    as root. After a software disaster it is always possible to restore everything
    from backups, and quite often not to recover anything entered up to a few minutes
    before the catastrophe.


    In this section I will walk through the sequence of actions you can use to restore
    a completely dead computer to normal operation.


    # 8.3.1 Things to do first


    Begin by trying to bring the machine up. If you can get as far as the boot loader
    – LILO or GRUB – and you have multiple boot installed, try each operating system
    in turn. Bringing up a system other than Linux will not help you with the recovery,
    but it will give you confidence that the hardware is all working correctly.


    If you cannot get any version of Linux to come up you can use it to repair the
    rest of the system. This is where the maintenance partition can be very useful
    as it usually survives most disasters.


    If the system comes up and then crashes you probably do not need to restore from
    backups. The next section makes some suggestions for recovering a system that
    will not stay up.


    If you cannot get the system to boot at all the next step is to bring up a rescue
    system. With RedHat Linux you can do this by putting the first installation CD
    in the drive and booting the machine, then typing


    ```

    linux rescue

    ```


    at the prompt. A Knoppix CD can also be used as a rescue system.


    It is quite possible that the cause of the problem is that the boot loader has
    been corrupted, possibly by using an installation or disk partitioning program
    that has damaged the first block on the hard disk.


    If this is the case you can restore the boot loader from the rescue system.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# 8.3.2 Restoring the GRUB boot loader


    From the rescue system try to mount your root partition read-only. The RedHat
    rescue system will give you an option to do this automatically. If you cannot
    use this type mounting manually, type mkdir /mnt/sysimage mount /dev/hdax /mnt/sysimage


    replacing hdx with the real identity of your root partition.

    You can now run the GRUB program by typing /mnt/sysimage/sbin/grub


    The way GRUB describes disk drives and partitions is not the same as the method
    used by the running system. GRUB needs to find where the ''stage1'' program is
    stored on your disk, and build this information into the initial loader that installs
    at the beginning of your hard disk. There are three steps to this process.


    +   Find the stage1 program. If you know where it is you can skip this step. If
    not, you can use GRUB to find it. The program is in a file that will have the
    path /boot/grub/stage1 on the running system. If you have a separate partition
    that will be mounted as /boot the file will be /grub/stage1 within that partition.
    If you do not have a separate boot partition /boot will be a directory within
    your root partition and the path to the file will be /boot/grub/stage1


    To find the boot loader if you have a separate boot partition type

    find /boot/grub/stage1

    if you have one big partition type

    find /boot/grub/stage1

    and you do not know, try both.


    When GRUB finds the loader it will display something like (hd0, 4)

    which means ''Partition 4 on hard drive 0''. If you have more than one version
    of Linux installed choose the one you want to boot – the partition numbers displayed
    by GRUB may not be the same as the partitions displayed by fdisk, but they will
    be in the same order.'
  merge: -1
  pgno: 166
- img_proc: true
