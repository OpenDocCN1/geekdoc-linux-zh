    # # 8.4 Common problems


    This section is a collection of the system management problems thatthat I have
    come across in the past few years, together with the solutions. If you have a
    system that will boot but will not then stay up you may find the solution here.


    # ## 8.4.1 No space on hard drive


    This can manifest itself in a number of ways. You may see a message ‘No space
    on device’ or something similar. It is also possible that one of the more space-hungry
    parts of the system, such as the GUI, may stop working.


    Use the df command to see if any partitions have become full. If so can use


    ```

    du -sh /path/*

    ```


    where /path/ can be the path to any directory. This command will tell you how
    much disk space every subdirectory of /path/ uses. Start at / and work downwards
    – usually the problem will be in either /home/or /tmp.


    A common culprit when all of your disk space has been is a browser cache. Some
    web browsers can pull a frightening amount of data into their cache, only giving
    up when they run out of room on the disk.


    # ## 8.4.2 Problems with /tmp directory


    The /tmp directory is intended for storing temporary files which are discarded
    when the program using them exits. Many'
