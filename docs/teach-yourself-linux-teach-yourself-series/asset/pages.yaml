    # 5.4 Emulating other environments (optional)


    There are some applications which have only been released for operating systems
    other than Linux. You can run these on Linux by using an emulator.


    There are two kinds of emulators. The first kind emulates the computer itself
    and runs a guest operating system, such as Microsoft Windows, on the emulated
    computer. You can then use this guest system to run applications which were designed
    for it. This method uses a real copy of the guest operating system which has the
    advantage of running the applications in exactly the environment they expect.
    It has the disadvantage that a licensed copy of the guest operating system must
    be bought and paid for.


    The open-source emulator Dosemu (http://www.dosemu.org/) emulates a simple PC
    and will run MS-DOS. It will also run Freedos (http://www.freedos.org/), an open-source
    free replacement.


    The commercial emulator VMware (http://www.vmware.com/) will run most versions
    of Microsoft Windows, and several other systems. This package has the remarkable
    ability to absorb a crash of the guest operating system. It has a redo log which
    allows you to rewind time, restoring the virtual machine''s hard disk to its uncorrupted
    state before the crash.


    The second kind of emulator does not require a guest operating system. Instead
    it attempts to duplicate the thousands of points of connection between application
    programs and the operating system. These are collectively known as the Application
    Programming Interface (API). The Wine emulator (http://www.winehq.org/), which
    is free, works in this way. At the'
