  md: 'segment


    One part of a network comprising computers that can communicate directly, not
    via a router.


    server


    A computer that provides a service, such as printing or handing out web pages,
    used by other machines.


    source


    The readable text form of a program used by programmers to work on it.


    special file


    A directory entry that represents something other than a file or directory. Special
    files are commonly used to access hardware devices such as disk drives and printer
    ports.


    standard error


    The stream on which a program puts out messages about errors, progress or anything
    else it needs to tell the operator.


    standard input


    The main input to a program, often the keyboard.


    standard output


    The main output from a program, often the screen.


    symbolic link


    A directory entry that points to another directory entry, rather than directly
    to a file.


    text installation


    Installing Linux without the GUI.


    TCP/IP


    Transmission Control Protocol/Internet Protocol.


    Time To Live


    The number of times a packet may be forwarded across networks without being discarded
    as undeliverable.


    tunnel


    To pass something through a firewall or another protocol without understanding
    it.


    unicode


    A method of encoding text which can handle multiple alphabets used by different
    languages.


    UNIX


    An older system from which some of the features of Linux are derived.


    unmount


    Reverse the action of mount, remove a filesystem from the tree.


    URL


    Uniform Resource Locator.


    USB


    Universal Serial Bus.


    user


    An ordinary person who uses Linux and has no special privileges.'
