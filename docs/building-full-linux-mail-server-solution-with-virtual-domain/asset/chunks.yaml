    After editing, copy the `courier-imap.spec` file to `/home/test/rpm/SPECS` directory.
    Before building the `courier-imap`, it is required that `courier–authlib` package
    (for authentication) is installed. Download `courier-authlib-0.62.1.tar.bz2` or
    any suitable version and save it in the `SOURCES` directory. Unpack it and edit
    the specification file, then copy it to `/home/test/rpm/SPECS` directory, build
    it and install it as root in the `i386` directory.


    ```bash

    cp courier-authlib-0.62.1.tar.bz2 /home/test/rpm/SOURCES

    cd /home/rpm/SOURCES

    tar xjf courier-authlib-0.59.1.tar.bz2

    ```


    ### Install the courier-authlib


    ```bash

    cd $HOME/rpm/SPECS

    rmpbuild -bb courier-authlib.spec

    su root

    cd /home/test/rpm/RPMS/i356/

    rpm-ivh courier-authlib-*

    ```


    It asks for `libtool-itdl-devel` as a failed dependency, install it and install
    any other required dependencies after downloading them. You shall install all
    `courier-authlib` packages found in the `i386` folder if you want your `courier-imap`
    to support them. You will find there the following packages: `courier_authlib`,
    `courier_authlib_devel`, `courier_authlib_debuginfo`, `courier_authlib_userdb`,
    `courier_authlib_mysql`, `courier_authlib_pgsql`, `courier_authlib_userdb_ldab`.


    Build the `courier–imap` package as user `test` and install it as root user.


    ```bash

    su test

    cd $HOME/rpm/SPECS

    rpmbuild-bb courier-imap.spec

    su root

    cd /home/test/rpm/RPMS/i386/

    rpm-ivh courier-imap-*

    ```


    Install any failed dependencies as required. Then start the package as follows:


    ```bash

    authdaemond restart

    service courier-authlib restart

    service courier-imap restart

    ```


    ### 3.10 Courier-IMAP Configuration:


    To tell Courier that it should authenticate against the MySQL database, first
    edit `/etc/authlib/authdaemonrc` and change the value of `authmodulelist` so that
    it reads from mysql database.


    `authmodulelist = “authmysql”`


    The `Courier- Imap` `imapd` file `/etc/courier/imapd` should have a line similar
    to this:

    `IMAP_CAPABILITY =”IMAP4rev 1 UIDPLUS CHILDREN NAMESPACE THREAD = ORDEREDSUBJECT
    THREAD= REFERENCES SORT QUOTA IDLE"`


    The `authmysqlrc` file in `/etc/authlib` directory is edited and modified and
    these lines added to it:


    ```text

    #DEFAULT _DOMAIN uniswa.com

    MYSQL_CRYPT_PWFIELD password

    MYSQL_DATABASE postfix

    MYSQL_GID_FIELD ‘89’

    MYSQL_HOME_FIELD ‘/vmail/’

    MYSQL_LOGIN _FIELD username

    MYSQL_MAILDIR_FIELD maildir

    MYSQL_NAME _FIELD name

    MYSQL_OPT 0

    MYSQL_ PASSWORD postfix

    #MYSQL_ PORT 0

    #Uncomment below for quota support.

    MYQL_QUOTA_FIELD quota

    MYSQL_ SERVER localhost

    #Default RedHat Socket

    MYSQL _SOCKET /var/lib/mysql.Sock

    MYSQL_UID_FIELD ‘89’

    MYSQL_USERNAME postfix

    MYSQL_USER _TABLE mailbox

    #MYSQL _WHER_CLAUSE server = ‘project.uniswa.com’

    ```


    A file `/etc/authlib/hostdomains` is created that contains `uniswa.com`, the domain
    that will be hosted by this server.


    For testing with `courier-imap`:


    ```bash

    service postfix reload

    authdaemond restart

    service courier-authlib restart

    service courier-imap restart

    telnet localhost 25

    mail from: hedaya

    rcpt to: user@uniswa.com

    data

    hi testing

    .

    quit


    telnet localhost 110

    user user@uniswa.com

    pass password

    list

    retr (msg no)

    quit

    ```


    ### 3.11 Configuring Postfixadmin:


    Postfix will allow the administrator to add, delete and edit mailboxes and full
    domains. This web based application allows the administrator to access MySQL configuration
    for postfix and edits it directly. The prerequisite for the installation of Postfixadmin
    is to install Apache. Postfix tar is downloaded from `http://high5.net` and saved
    in the apache directory `/var/www/html` and then unarchive it.


    ```bash

    tar –zxvf postfixadmin-*.tar.gz

    ```


    The following configurations are performed in the `config.inc.php` file.


    The first thing to do is to tell Postfix that you have configured the application.

    `$CONF[''configured''] = true;`


    Then the full url of the postfix admin build is defined.

    `$CONF [''postfix_admin_url''] = ''http: //uniswa.com/postfixadmin’;`


    Next is the setting up of the database connection.


    ```php

    $CONF [''database_type''] = ''mysql'';

    $CONF [''database_host''] = ''localhost'';

    $CONF [''database_user''] = ''postfixadmin'';

    $CONF [''database_password''] = ''postfixadmin'';

    $CONF [''database_name''] = ''postfix'';

    $CONF [''database_prefix''] = **;

    ```


    The email address that all problems will be reported to and the sends messages
    to everyone.

    `$CONF [''admin_email''] = ''postmaster@example.com'';`


    This is used to send email to Postfix in order to create mailboxes.

    `$CONF [''smtp_server''] = ''localhost'';`

    `$CONF [''smtp_port''] = ''localhost'';`


    This portion defines the encryption method to be used.

    `$CONF [''encrypt''] = ''md5'';`


    The minimum length required for passwords.

    `$CONF [''min_password_length''] = 5;`


    The default password for the admin.

    `$CONF [''default_password''] = '''';`


    This message is sent to every newly created mailbox.

    `$CONF [''welcome_text''] = EOM

    Hi,

    Welcome to your new account.

    EOM;`


    The setup password that has been generated.

    `$CONF [''setup_password''] = 5;`


    The setup will create the admin database.

    `$CONF [''setup_password''] = ''YES'';`


    The path to the setupadmin.

    `$CONF [''domain_path''] = ''YES'';`


    The domain in the mailbox.

    `$CONF [''domain_in_mailbox''] = ''YES'';`


    The aliases for the admin.

    `$CONF [''aliases''] = ''YES'';`


    The mailboxes are set.

    `$CONF [''mailboxes''] = ''YES'';`


    The quota for the user.

    `$CONF [''maxquota''] = ''10'';`


    The multiplier for the quota.

    `$CONF [''quota_multiplier''] = ''10'';`


    The domain for the user.

    `$CONF [''domain''] = ''YES'';`


    The transport options.

    `$CONF [''transport_options''] = array (''virtual'', ''local'', ''relay'');`


    The default transport.

    `$CONF [''transport_default''] = ''virtual'';`


    The control for the alias.

    `$CONF [''control''] = ''YES'';`


    The admin control.

    `$CONF [''alias_control_admin''] = ''YES'';`


    The setup for the domain.

    `$CONF [''setup''] = ''YES'';`


    The hash for the password.

    `$CONF [''hash''] = ''md5'';`


    The domain control for the domain.

    `$CONF [''domain_control''] = ''YES'';`


    The setup for the alias.

    `$CONF [''alias_setup''] = ''YES'';`


    The path for the domain.

    `$CONF [''domain_path''] = ''YES'';`


    The hash for the alias.

    `$CONF [''alias_hash''] = ''md5'';`


    The control for the user.

    `$CONF [''user_control''] = ''YES'';`


    The setup for the user.

    `$CONF [''user_setup''] = ''YES'';`


    The path for the user.

    `$CONF [''user_path''] = ''YES'';`


    The hash for the user.

    `$CONF [''user_hash''] = ''md5'';`

