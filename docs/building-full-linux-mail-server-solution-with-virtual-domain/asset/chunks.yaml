  trans: "\n\n* `Squirrelmail` – `1.4.6.tar.bz2`\n* `PostfixAdmin` – `2.3.3.tar.gz`\n\
    * Fedora core 5 默认带的 `Apache2`。\n* `Mail Scanner-4.84.3-1.rpm.tar.gz`。\n* `Install-Clam-0.96.5-SA-3.3.1`\
    \ 或任何 `clamav` 软件包。\n* Fedora core 5 默认带的 `SpamAssassin`。\n* `Fedora core 5`（操作系统）。\n\
    * `Compaq 610 笔记本 Intel core Duo 3GHz 2GB RAM 320 GB HDD`。\n\n所有使用的软件包均为 `i386`\
    \ 类型。假设 Fedora core 5 和 `Mozilla Fire Fox` 已成功安装，并启用了 `HTTP` 和 `SMTP` 支持，同时关闭了防火墙。\n\
    \n## 3. 邮件服务器软件包的主要安装与配置：\n\n该项目涵盖以下部分：\n* 安装 `Postfix`。\n* 安装 `Courier-IMAP`（如果你想使用\
    \ `Courier` 作为 `IMAP/POP` 服务器）。\n* 创建数据库表。\n* 为数据库填充部分数据。\n* 创建 `Postfix-Mysql`\
    \ 配置文件。\n* 安装 `Postfixadmin`。\n* 安装 `MailScanner`。\n* 安装 `ClamAV` 和 `SpamAssassin`。\n\
    * 创建虚拟用户和虚拟目录。\n* 配置 `MailScanner`。\n* 配置 `Postfix`。\n* `Courier-IMAP` 配置。\n*\
    \ 配置 `Squirrellmail`。\n\n### 3.1 安装 Postfix：\n\nPostfix 不带配额（quota）和 `MySQL` 数据库支持，因此为了支持这些功能，需要获取\
    \ `Postfix` 源码包和 `Postfix` 配额补丁，进行解压，并按照下文所示编辑补丁的规范文件。对 `Postfix` 进行补丁后，获取一个针对特定运行环境的新\
    \ `Postfix` 软件包。然后安装新的 `Postfix`。\n\n在 `/usr/redhat/SOURCES` 目录下下载 `Postfix –\
    \ 2.2.8 – 1.2.src.rpm` 和 `Postfix – 2.2.8 – vda.patch.gz` 或任何其他版本。\n\n```bash\n\
    rpm -ivh Postfix – 2.2.8 – 1.2.src.rpm\ngunzip postfix-2.2.8-vda.patch.gz\ncd\
    \ /usr/src/redhat/SPECS/\ngedit postfix.spec # 编辑规范文件\n```\n\n- 将 `% define MYSQL\
    \ 0` 改为 `% define MYSQL 1`\n- 在 `# Patches` 语句块中添加 `Patch 0: postfix-2.2.8-vda.patch`\n\
    - 在 `%setup -q` 语句块中添加 `%patch0 -p1 -b .vda`\n\n然后构建一个带有配额和 `MySQL` 数据库支持的新 `postfix`\
    \ 软件包并安装它。\n\n```bash\nrpmbuild -ba postfix.spec\n```\n\n进入 `i386` 目录并安装 `postfix`\
    \ 以及文件夹内的另外两个软件包（`postfix_debuginfo` 和 `pflogsumm`）。\n\n```bash\ncd /usr/src/redhat\
    \ /RPMS/i386\nrpm - ivh postfix - 2.2.8-1.2.i386.rpm\n```\n\n安装所需的依赖项取决于系统中安装的软件包，因此你应该下载并安装这些依赖，然后尝试重新安装\
    \ `postfix`。\n\n### 3.2 Postfix 的初始配置：\n\n要配置 `Postfix`，需要在 `/etc/postfix/main.cf`\
    \ 文件中编辑并取消以下行的注释。`Postfix` 将识别服务器的全限定域名和本地域名。同时指定服务器发送邮件时使用的出站域名、允许接收的以太网接口以及允许在本地登录的邮件客户端\
    \ IP 地址。\n\n```ini\nmyhostname =project.uniswa.com\nmydomain =uniswa.com\nmyorigin\
    \ =$myhostname\ninet_interfaces = all\nmydestination = $myhostname, localhost.$mydomain,\
    \ localhost\nmynetworks_style = subnet\n```\n\n执行以下操作以测试是否成功：\n\n```bash\nservice\
    \ postfix restart\ntelnet localhost 25 // 将出现类似下面的输出\n```\n\n```\nTrying 127.0.0.1\
    \ …\nConnected to localhost.localdomain (127.0.0.1)\nEscape character is ‘^].\n\
    220 project.uniswa.com ESMTP Postfix\nmail from: xyz\nrcpt to: root@project.uniswa.sz\n\
    data\nHi testing\n.\nquit\n```\n\n### 3.3 安装 MySQL 软件包：\n\n从 Fedora 自带的 `RPMS`\
    \ 安装 `MySQL`、`mysql-devel`、`mysql-server`、`mysql-client` 软件包以及任何依赖包。例如安装 `mysql`：\n\
    \n```bash\nrpm -ivh mysql*\n```\n\n### 3.4 创建表：\n\n在 `MySQL` Shell 中，创建 `Postfix`\
    \ 对应的 `admin` 用户并授予权限，以便 `Postfix` 配置和虚拟域名。\n\n```sql\nmysql\n```\n\n（创建 `postfix`\
    \ 数据库）\n```sql\nCREATE DATABASE postfix;\nUSE postfix;\n```\n\n现在 `postfix` 数据库已创建，并包含了支持配额的\
    \ `admin` 表结构。`admin` 表用于存储用户信息：\n\n```sql\nCREATE TABLE admin (\n  username varchar(255)\
    \ NOT NULL,\n  password varchar(255) NOT NULL,\n  created datetime NOT NULL DEFAULT\
    \ '0000-00-00 00:00:00',\n  modified datetime DEFAULT '0000-00-00 00:00:00',\n\
    \  active tinyint(1) DEFAULT 1,\n  PRIMARY KEY (username)\n);\n```\n\n`alias`\
    \ 表用于将一个邮件地址映射到另一个：\n\n```sql\nCREATE TABLE alias (\n  address varchar(255) NOT\
    \ NULL,\n  domain varchar(255) NOT NULL,\n  created datetime NOT NULL DEFAULT\
    \ '0000-00-00 00:00:00',\n  modified datetime DEFAULT '0000-00-00 00:00:00',\n\
    \  active tinyint(1) DEFAULT 1,\n  PRIMARY KEY (address)\n);\n```\n\n`domain`\
    \ 表用于存储 `Postfix` 应该接收邮件的虚拟域名：\n\n```sql\nCREATE TABLE domain (\n  domain varchar(255)\
    \ NOT NULL,\n  description varchar(255) NOT NULL,\n  aliases int(10) DEFAULT 0,\n\
    \  mailboxes int(10) DEFAULT 0,\n  maxquota int(10) DEFAULT 0,\n  transport varchar(255)\
    \ DEFAULT NULL,\n  backupmx tinyint(1) DEFAULT 1,\n  created datetime NOT NULL\
    \ DEFAULT '0000-00-00 00:00:00',\n  modified datetime DEFAULT '0000-00-00 00:00:00',\n\
    \  active tinyint(1) DEFAULT 1,\n  PRIMARY KEY (domain)\n);\n```\n\n`domain_admins`\
    \ 表存储域管理员信息：\n\n```sql\nCREATE TABLE domain_admins (\n  username varchar(255)\
    \ NOT NULL,\n  domain varchar(255) NOT NULL,\n  create datetime NOT NULL DEFAULT\
    \ '0000-00-00 00:00:00',\n  modified datetime DEFAULT '0000-00-00 00:00:00',\n\
    \  active tinyint(1) DEFAULT 1,\n  PRIMARY KEY (username)\n);\n```\n\n`log` 表存储每个虚拟域名和用户的活动记录：\n\
    \n```sql\nCREATE TABLE log (\n  timestamp datetime NOT NULL DEFAULT '0000-00-00\
    \ 00:00:00',\n  username varchar(255) NOT NULL,\n  domain varchar(255) NOT NULL,\n\
    \  action varchar(255) NOT NULL,\n  data varchar(255) NOT NULL,\n  KEY (timestamp)\n\
    );\n```\n\n"
- fmt: '

    The `mailbox` table stores all virtual users (i.e. email addresses, because the
    email address and user name is the same), passwords (in encrypted form) and the
    quota value for each mailbox. The table structure for table `mailbox`:


    ```sql

    CREATE TABLE mailbox ( username varchar(255) NOT NULL default '''', password varchar(255)
    NOT NULL default '''', name varchar(255) NOT NULL default '''', maildir varchar(255)
    NOT NULL default '''', quota int(10) NOT NULL default ''0'', domain varchar(255)
    NOT NULL default '''', created datetime NOT NULL default ''0000-00-00 00:00:00'',
    modified datetime NOT NULL default ''0000-00-00 00:00:00'', active tinyint(1)
    NOT NULL default ''1'', PRIMARY KEY (username), KEY username (username) ) TYPE=MyISAM
    COMMENT=''Postfix Admin - Virtual Mailboxes'';

    ```


    Virtual Vacation is done with a local shell account that can receive email. The
    email is then handled by a Perl script which sends the Vacation message back to
    the sender. The table structure for table `vacation`:


    ```sql

    CREATE TABLE vacation (email varchar (255) NOT NULL default”, subject varchar
    (255) NOT NULL default”, body text NOT NULL default”, cache text NOT NULL default”,
    domain varchar (255) NOT NULL default”, Created datetime NOT NULL default ‘0000-00-00
    00:00:00’, Active tinyint (1) NOT NULL default ‘1’, PRIMARY KEY (email), KEY email
    (email), TYPE = MYISAM COMMENT =’Postfix Admin – virtual vacation’;

    ```


    The `transport` table is optional, it is for advanced users. It allows to forward
    mails for single users, whole domains or all mails to another server. The table
    structure for `transport`:


    ```sql

    CREATE TABLE transport (username varchar (255) NOT NULL default”, domain varchar
    (255) NOT NULL default”, destination varchar (255) NOT NULL default”, Created
    datetime NOT NULL default ‘0000-00-00 00:00:00’, Modified datetime default ‘0000-00-00
    00:00:00’, active tinyint (1) NOT NULL default ‘1’, PRIMARY KEY (domain));

    ```


    ### 3.5 Populating database with some data:


    Next, the Postfix database has to be filled with some data which otherwise can
    still be filled through `Postfixadmin`.


    ```bash

    Use postfix;

    INSERT INTO domain (domain, description) VALUES (‘uniswa.com’, ‘Test Domain’);

    INSERT INTO alias (address, goto) VALUES (‘alias@uniswa.com’, ‘user@uniswa.com
    ‘);

    INSERT INTO mailbox (username, password, name, quota, maildir) VALUES (‘user@uniswa.com’,
    ENCRYPT(password),‘Mailbox User’,‘104857600’, ‘user@uniswa.com/’);

    quit;

    ```


    ### 3.6 Creating Postfix-MySql Configuration Files:


    Postfix has to be told where to find all the information in the database. Therefore
    six access text files have to be created and mapped in `etc/main.cf` file to allow
    postfix to read from MySQL tables.


    Create `/etc/postfix/mysql/mysql_virtual_alias_maps.cf`

    ```

    user = postfix

    password = postfix

    host = localhost

    dname = postfix

    query =SELECT go to FROM alias WHERE address =’%s’ AND active =1

    ```


    Create `/etc/postfix/mysql/mysql_virtual_domains_maps.cf`

    ```

    user = postfix

    password = postfix

    host = localhost

    dname = postfix

    query = SELECT domain FROM domain WHERE domain = ‘%s’

    ```

    #optimal query to use when relaying for backup MX


    Create `/etc/postfix/mysql/mysql_virtual_mailbox_maps.cf`

    ```

    user = postfix

    password = postfix

    host = localhost

    dname = postfix

    query =SELECT maildir FROM mailbox WHERE username =’%s’ AND active =1

    ```


    Create `/etc/postfix/mysql/mysql_virtual_mailbox_limit_maps.cf`

    ```

    user = postfix

    password = postfix

    host = localhost

    dname = postfix

    query =SELECT quota FROM mailbox WHERE username =’%s’

    ```


    Create `/etc/postfix/mysql/mysql_relay_domains_maps.cf`

    ```

    user = postfix

    password = postfix

    host = localhost

    dname = postfix

    query =SELECT domain FROM domain WHERE domain=’%s’ backupmx = ‘1’

    ```


    Create `/etc/postfix/mysql/transport_maps.cf`

    ```

    user = postfix

    password = postfix

    host = localhost

    dname = postfix

    table = transport

    select_ field = destination

    where_ field =domain

    additional_conditions= and active = ‘true’

    ```


    ### 3.7 Creating Virtual User and Virtual Directory:


    The system can hold mailboxes for thousands of users. All of these users are virtual
    users and none of them is a Linux system user. One would probably do not want
    to assign a unique `UID` (user ID) to every user, so let''s create a Linux user
    who will become the owner of all mailboxes.


    The virtual postfix user with id = `89` and a folder named `/vmail` are created
    and made to own mail. The user is given permissions to read and write mail.


    ```bash

    # mkdir /vmail

    # chown –R postfix: postfix /vmail

    #chmod –R 771 /vmail

    ```


    ### 3.8 Configuring Postfix with MySQL maps:


    The six MySQL maps configuration files have already been created and now it is
    the time to setup Postfix `main.cf` file so that Postfix can query MySQL database
    for virtual mailboxes and domains. Open the `main.cf` file.


    ```bash

    # gedit /etc/postfix/main.cf

    ```


    Then add the following code segment to `main.cf`


    ```

    virtual_mailbox_domains = mysql:/etc/postfix/mysql/mysql_virtual_domains_maps.cf

    virtual_alias_maps =mysql:/etc/postfix/mysql/mysql_virtual_alias_maps.cf

    virtual_mailbox_maps =mysql:/etc/postfix/mysql/mysql_virtual_mailbox_maps.cf

    ```


    Then the user id and group id of the user that will deliver mail to the virtual
    mailbox directory are assigned and the mailbox limit is declared.


    ```

    virtual_gid_maps = static: 89

    virtual_mailbox_limit =51200000

    virtual _ uid_maps = static: 89

    virtual_minimum_uid =10

    virtual_ transport =virtual

    ```


    These configurations are made for quota support:

    ```

    virtual_create_maildirsize =yes

    virtual_mailbox_extended =yes

    virtual_mailbox_limit_maps= mysql:/etc/postfix/mysql/mysql_virtual_mailbox_limit_maps.cf

    virtual_mailbox_limit_ override= yes

    virtual_maildir_limit_message =Sorry, the user’s maildir has overdrawn his diskspace
    quota, please try again later.

    virtual_overquota_bounce =yes

    ```


    ### 3.9 Installing Courier-IMAP and Courier-authlib:


    The POP3 service enables a server to host e-mail accounts and includes tools to
    administer the servers, domains, and mailboxes. The POP3 service performs the
    tasks of message download and request handling on a server, where message download
    consists of transmitting the messages from a folder in the file system to clients
    and request handling is performed according to the POP3 protocol, which defines
    how the server responds to requests sent from an e-mail client.


    The SMTP service receives e-mail from other domains, saves the e-mail to the `Queue`
    folder, and notifies the SMTP delivery service for POP3 of the arrival of e-mail.
    The delivery service then moves the e-mail to the POP3 mail store, where it is
    available for download to POP3 e-mail clients.


    To install Courier–Imap, a regular system user other than the Root user has to
    be created because root dismally fails to build this package.


    ```bash

    #useradd test (creating a user called test)

    #passwd test (you can put any password)

    #/bin/su -test (changing to user test)

    ```


    Create an RPM development hierarchy.


    ```bash

    #mkdir $ HOME /rpm

    #mkdir $ HOME/rpm/SOURCES

    #mkdir $HOME/rpm/ SPECS

    #mkdir $HOME/rpm/ BUILD

    #mkdir $HOME/rpm/SRPMS

    #mkdir $HOME/rpm/RPMS

    #mkdir $HOME/rpm/RPMS/i386

    #echo “%_topdir $HOME/rpm”>>$HOME/.rpmmacros

    ```


    Download `courier-imap` tarball (old version that can be used with Fedora 5),
    and save it in `/home/test/rpm/SOURCES` directory and unpack it:


    ```bash

    #cp courier-imap-4.4.1.tar.bz2 /home/test/rpm/SOURCES

    #cd /home/rpm/SOURCES

    #tar xjf courier-imap-4.4.1.tar.bz2

    ```


    Go to `/home/test/rpm/sources/courier-imap-4.4.1` and edit the specification file:


    ```bash

    # cd courier-imap-4.0.1

    # gedit courier-imap.spec

    ```


    Change the following lines to have things in more standard places ( eg. /etc )


    ```

    %define _sysconfdir /etc/courier

    %define _mandir /usr/share/man

    %define _prefix /etc/courier

    %define _localstatedir /var/run

    ```


    ```

    %configure

    --with-redhat

    --enable-workaround-for-imap-client-bugs


    %{?xflags: %{xflags}}


    #%{__make} check

    ```

