    retr (msg no)

    quit

    ```


    Testing is done in the Linux shell first using commands as shown in Fig. 4.1 and
    Fig. 4.2 below.


    Then open Mozilla Firefox and connect to `http://project.uniswa.com/squirrelmail/`
    to test the mail server using the graphical interface `squirrelmail` as shown
    in Fig. 4.3, Fig. 4.4, Fig. 4.5, Fig. 4.6 and Fig. 4.7.

