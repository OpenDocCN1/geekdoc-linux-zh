    3.11 Configuring Postfixadmin:


    Postfix will allow the administrator to add, delete and edit mailboxes and full
    domains. This web based application allows the administrator to access MySQL configuration
    for postfix and edits it directly .The prerequisite for the installation of Postfixadmin
    is to install Apache. Postfix tar is downloaded from http://high5.net and saved
    in the apache directory /var/www/html and then unarchive it.


    #tar –zxvf postfixadmin-*.tar.gz


    The following configurations are performed in the config.inc.php file.


    The first thing to do is to tell Postfix that you have configured the application.


    $CONF[''configured''] = true;


    Then the full url of the postfix admin build is defined.


    $CONF [''postfix_admin_url''] = ''http: //uniswa.com/postfixadmin’;


    Next is the setting up of the database connection.


    $CONF [''database_type''] = ''mysql'';


    $CONF [''database_host''] = ''localhost'';


    $CONF [''database_user''] = ''postfixadmin'';


    $CONF [''database_password''] = ''postfixadmin'';


    $CONF [''database_name''] = ''postfix'';


    $CONF [''database_prefix''] = *;*


    The email address that all problems will be reported to and the sends messages
    to everyone.


    $CONF [''admin_email''] = ''postmaster@example.com'';


    This is used to send email to Postfix in order to create mailboxes.


    $CONF [''smtp_server''] = ''localhost'';


    $CONF [''smtp_port''] = ''25'';


    This portion defines the encryption method to be used to encrypt passwords.


    $CONF [''encrypt''] = ''md5'';


    This will be assigned during the postfixadmin Superadmin setup.


    $CONF [''setup_password''] = '''';


    Minimum length required for passwords.


    $CONF [''min_password_length''] = 5;


    The default aliases that need to be created for all domains.


    $CONF [''default_aliases''] = array (


    ''postmaster'' => ''postmaster@example.com'',


    );


    This part is set to ‘yes’ if the mailboxes are to be stored per domain, otherwise
    it is set to ‘no’.


    $CONF [''domain_path''] = ''YES'';


    This is set to ‘no’ if putting the domain in the mailbox is not desired.


    $CONF [''domain_in_mailbox''] = ''YES'';


    This specifies the quota value in MB.


    $CONF [''aliases''] = ''10'';


    $CONF [''mailboxes''] = ''10'';


    $CONF [''maxquota''] = ''10'';


    To enforce quota for mailbox users this is set to ‘yes''.


    $CONF[''quota''] = ''YES'';


    There are two choices, either use ''1024000'' or ''1048576''


    $CONF [''quota_multiplier''] = ''1024000'';


    If there is a need to define additional transport options for a domain this is
    set to ''yes''.


    $CONF [''transport''] = ''YES'';


    If additional transport options are to be defined, they should be put in the array
    below.


    $CONF [''transport_options''] = array (


    ''virtual'', // for virtual accounts


    ''local'', // for system accounts


    ''relay'' // for backup mx


    );


