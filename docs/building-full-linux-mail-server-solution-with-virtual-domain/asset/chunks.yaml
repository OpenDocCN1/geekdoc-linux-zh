  trans: "\n\n![](img/cover.jpeg)\n\n![cover](img/cover.jpeg)Hedaya Mahmood Alasooly\
    \ 博士\n\n# 构建基于虚拟域名和用户的完整 Linux 邮件服务器解决方案\n\nBookRix GmbH & Co. KG\n80331 慕尼黑\n\
    \n### 构建基于虚拟域名和用户的完整 Linux 邮件服务器解决方案\n\n构建基于虚拟域名和用户的完整 Linux 邮件服务器解决方案\n\n作者\n\
    \nHedaya Mahmood Alasooly\nHedaya_alasooly@yahoo.com\n\n### 构建基于虚拟域名和用户的完整 Linux\
    \ 邮件服务器解决方案\n\n构建基于虚拟域名和用户的完整 Linux 邮件服务器解决方案\n\n指导老师：\nHidaia Alassouli 博士\n\n\
    学生姓名\nKhumalo, Khumbulani V.\n\n### 摘要\n\n如今，一个系统托管多个域名已很常见，例如，uniswa.com 和 mtn.com\
    \ 或 acme.com 可能运行在同一台主机机器上，但表现得就像运行在三个不同的主机上一样。一个系统通常有一个规范域名，它有其通常或本地域名，而额外的域名被配置为虚拟域名。\n\
    \n这项工作的目的是创建一个基于 `Postfix` 的邮件服务器解决方案，该方案基于虚拟用户和域名，即存储在 MySQL 数据库中的用户和域名。目标是实现完全虚拟化的用户和域名。`bob@uniswa.com\
    \ != bob@acme.com`。这意味着为每个域名创建一个独立的命名空间。\n\n它还将演示 `Courier-Imap` (IMAP/POP3) 的安装和配置，使其能够通过\
    \ `Postfix` 使用的同一个 MySQL 数据库进行身份验证。生成的 `postfix` 服务器具备配额管理功能，而这是 `Postfix` 默认并不包含的；该项目将演示如何适当地修补\
    \ `postfix`。密码以加密形式存储在数据库中。该工作还涵盖了 `Mail Scanner`、`SpamAssassin` 和 `ClamAv` 的安装，以便对邮件进行垃圾邮件和病毒扫描。MySQL\
    \ 数据库的管理可以通过基于 Web 的工具 `Postfixadmin` 完成，也可以在 `MySQL` 终端中手动完成。`Postfixadmin` 是一个为\
    \ `Postfix` 创建的 Web 端管理工具，用于处理存储在 MySQL 中的 `Postfix` 风格的虚拟域名和用户。安装了基于 Web 的 `squirrelmail`\
    \ 邮件客户端，以便用户通过互联网从世界任何地方检查邮件。所有安装均在 Fedora 5 Linux 机器上完成。\n\n### 目录\n\n1. 引言\n\
    2. 项目描述\n    2.1 主要目标\n    2.2 系统概述\n    2.3 主要服务器组件\n3. 邮件服务器软件包的主要安装与配置\n  \
    \  3.1 安装 `Postfix`\n    3.2 `Postfix` 的初始配置\n    3.3 安装 MySQL 软件包\n    3.4 创建\
    \ MySQL 表\n    3.5 为数据库填充数据\n    3.6 创建 `Postfix-MySQl` 配置文件\n    3.7 创建虚拟用户和虚拟目录\n\
    \    3.8 使用 MySQL 映射配置 `Postfix`\n    3.9 安装 `Courier-IMAP` 和 `Courier-authlib6`\n\
    \    3.10 `Courier-IMAP` 配置\n    3.11 配置 `Postfixadmin`\n    3.12 配置 `Squirrelmail`\n\
    \    3.13 安装并配置 `MailScanner`、`ClamAV` 和 `SpamAssassin`\n4. 测试配置\n5. 结论\n\n###\
    \ 1. 引言\n\n项目的目的是创建一个基于 `Postfix` 的邮件服务器解决方案，该方案基于虚拟用户和域名，即存储在 MySQL 数据库中的用户和域名。它还将演示\
    \ `Courier-Imap` (IMAP/POP3) 的安装和配置，使其能够通过 `Postfix` 使用的同一个 MySQL 数据库进行身份验证。生成的\
    \ `postfix` 服务器具备配额管理功能，而这是 `Postfix` 默认并不包含的；该项目将演示如何适当地修补 `postfix`。密码以加密形式存储在数据库中。项目还涵盖了\
    \ `Mail Scanner`、`SpamAssassin` 和 `ClamAv` 的安装，以便对邮件进行垃圾邮件和病毒扫描。MySQL 数据库的管理可以通过命令行\
    \ `mysql` 终端手动完成，也可以通过为 `postfix` 创建的 Web 端管理工具 (`Postfixadmin`) 完成，用户通过基于 Web\
    \ 的邮件客户端界面 (`Squirrelmail`) 访问其邮件。所有安装均在 Fedora 5 机器上完成。\n\n项目由以下部分组成：\n\n* 安装\
    \ `Postfix`。\n* 安装 `Courier-IMAP`（如果你想使用 `Courier` 作为 IMAP）。\n* 创建 MySQL 表。\n\
    * 填充数据库。\n* 创建 `Postfix-Mysql` 配置文件。\n* 安装 `Postfixadmin`。\n* 安装 `MailScanner`。\n\
    * 安装 `ClamAV`。\n* 创建虚拟用户和虚拟目录。\n* 配置 `Postfix`。\n* `Courier-IMAP` 配置。\n* 配置 `Squirrelmail`。\n\
    * 测试配置。\n\n### 2. 项目描述\n\n#### 2.1 主要目标\n\n这项工作的主要目标是创建一个支持多个域名的邮件服务器，例如接收 `bob@mtn.com`\
    \ 和 `bob@acme.com` 的邮件。当邮件服务器设置完成后，它必须能够：\n\n* 为用户接收并存储邮件。\n* 支持配额管理以将邮箱保持在合理范围内。\n\
    * 让用户通过 IMAP 和 POP3 获取邮件。\n* 接收并转发邮件。\n* 提供一个 Web 邮件界面进行阅读。\n* 检测病毒和垃圾邮件并进行过滤。\n\
    \n#### 2.2 系统概述\n\n该项目描述了如何创建一个虚拟域名和虚拟用户的邮件服务器（用户无法登录系统，他们仅存在于数据库中）。成功设置服务器需要具备以下组件的基础知识：\n\
    \n* `MySQL`（创建数据库、授予用户访问权限），这是一个存储域名、用户帐户和邮件转发信息的数据库系统。\n* `SMTP` (`Postfix`)，这是邮件服务器之间发送邮件消息的协议。\n\
    * `POP3`, IMAP，这里使用的类型是 `Courier-IMAP`，替代方案可以是 `dovecot`，这是一个提供邮件目录访问的服务器。\n*\
    \ `Fedora` (Linux)，理解一般的系统管理、使用文本编辑器、命令行以及读取日志文件。\n\n帐户存储在 MySQL 数据库中。域名将具有独立的命名空间，例如，`bob@acme.com`\
    \ 和 `bob@mtn.com` 的邮件将进入不同的邮箱。因此，安排将为每个虚拟账户设置独立的邮箱。\n\n服务器将使用一个支持多个域的 POP/IMAP\
    \ 服务器。在这种安排下，管理员不需要为服务器上的电子邮件地址创建和维护系统帐户，相反，他将配置 `Postfix` 将邮件递送到本地消息存储，每个虚拟邮件地址都可以有一个邮箱文件。用户随后通过\
    \ POP IMAP 服务器检索其消息。\n\n此外，服务器将具备配额支持以及垃圾邮件和病毒扫描功能（`Mail Scanner`、`Spam Assassin`）。数据库\
    \ (`MySQL`) 将通过命令行 `mysql` 终端手动管理，或通过为 `postfix` 创建的 Web 端管理工具 (`Postfixadmin`)\
    \ 管理，用户通过基于 Web 的邮件客户端界面 (`Squirrelmail`) 访问其邮件。下方的框图（图 1）展示了该系统。\n\n![](img/159551731830073699_1.jpg)\n\
    \n**图 2.1 服务器系统框图**\n\n#### 2.3 主要服务器组件\n\n邮件服务器将在 Fedora core 5 操作系统中使用以下软件包创建：\n\
    \n* `Postfix` - `2.2.8-1.2`。\n* `MySQL` - `5.0.18-2.1`。\n* `Courier – Imap` –\
    \ `4.4.1-1.5`。\n* `Courier – Authlib` – `0.62.1-1.fc5`。\n\n"
- fmt: "\n* `Squirrelmail` – `1.4.6.tar.bz2`.\n* `PostfixAdmin` – `2.3.3.tar.gz`.\n\
    * `Apache2` that comes by default with Fedora core 5.\n* `Mail Scanner-4.84.3-1.rpm.tar.gz`.\n\
    * `Install-Clam-0.96.5-SA-3.3.1` or any `clamav` package.\n* `SpamAssassin` which\
    \ comes by default with Fedora core 5.\n* `Fedora core 5` (Operating system).\n\
    * `Compaq 610 laptop Intel core Duo 3GHz 2GB RAM 320 GB Hard Drive`.\n\nAll packages\
    \ used are the `i386` types. It is assumed that Fedora core 5 and `Mozilla Fire\
    \ Fox` have been successfully installed and support for `HTTP` and `SMTP` enabled\
    \ with the Firewall turned off.\n\n## 3. Main installation and configuration of\
    \ the mail server packages:\n\nThe project covers the following parts:\n* Installing\
    \ `Postfix`.\n* Installing `Courier-IMAP` (in case you want to use `Courier` as\
    \ `IMAP/POP` Server).\n* Creating the Database Tables.\n* Populating Database\
    \ with Some Data.\n* Creating the `Postfix-Mysql` Configuration Files.\n* Installing\
    \ `Postfixadmin`.\n* Installing `MailScanner`.\n* Installing `ClamAV` and `SpamAssassin`.\n\
    * Creating the Virtual User and Virtual Directory.\n* Configuring `MailScanner`.\n\
    * Configuring `Postfix`.\n* `Courier-IMAP` Configuration.\n* Configuring `Squirrellmail`.\n\
    \n### 3.1 Installing Postfix:\n\nPostfix is not shipped with quota and `MySQL`\
    \ databases support, so for it to support these a `Postfix` source package and\
    \ a `Postfix` quota patch are obtained, extracted and the specification file of\
    \ the patch edited as done below. `Postfix` is patched and a new `Postfix` package\
    \ specific to the environment `Postfix` will run on is obtained. The new `Postfix`\
    \ is then installed. \n\nDownload `Postfix – 2.2.8 – 1.2.src.rpm` and `Postfix\
    \ – 2.2.8 – vda.patch.gz` or any other version in `/usr/redhat/SOURCES` directory.\n\
    \n```bash\nrpm -ivh Postfix – 2.2.8 – 1.2.src.rpm\ngunzip postfix-2.2.8-vda.patch.gz\n\
    cd /usr/src/redhat/SPECS/\ngedit postfix.spec # editing the specification file\n\
    ```\n\n- change `% define MYSQL 0` to `% define MYSQL 1`\n- add `Patch 0: postfix-2.2.8-vda.patch`\
    \ to the `# Patches` stanza\n- add `%patch0 -p1 -b .vda` to the `%setup -q` stanza\n\
    \nThen build a new `postfix` package with quota and `MySQL` databases support\
    \ and install it.\n\n```bash\nrpmbuild -ba postfix.spec\n```\n\nNavigate to the\
    \ `i386` directory and install `postfix` and two other packages found inside the\
    \ folder (`postfix_debuginfo` and `pflogsumm`)\n\n```bash\ncd /usr/src/redhat\
    \ /RPMS/i386\nrpm - ivh postfix - 2.2.8-1.2.i386.rpm\n```\n\nThe installation\
    \ required some dependencies depending on the installed packages your system,\
    \ so you should download and install them then try reinstalling `postfix`.\n\n\
    ### 3.2 Initial Configuration of Postfix:\n\nTo configure `Postfix`, the following\
    \ lines are edited and uncommented in the `/etc/postfix/main.cf` file. `Postfix`\
    \ is made aware of the fully qualified name and the local domain name of the server.\
    \ Also given the server’s outbound domain name that will be used when the emails\
    \ sent by the server, what Ethernet interfaces will be allowed to accept, and\
    \ the email clients IP addresses that are allowed to log in locally in the network\
    \ .\n\n```ini\nmyhostname =project.uniswa.com\nmydomain =uniswa.com\nmyorigin\
    \ =$myhostname\ninet_interfaces = all\nmydestination = $myhostname, localhost.$mydomain,\
    \ localhost\nmynetworks_style = subnet\n```\n\nTo test if this was a success do\
    \ the following:\n\n```bash\nservice postfix restart\ntelnet localhost 25 // an\
    \ output similar to the one below will come up\n```\n\n```\nTrying 127.0.0.1 …\n\
    Connected to localhost.localdomain (127.0.0.1)\nEscape character is ‘^].\n220\
    \ project.uniswa.com ESMTP Postfix\nmail from: xyz\nrcpt to: root@project.uniswa.sz\n\
    data\nHi testing\n.\nquit\n```\n\n### 3.3 Installing MySQL packages:\n\nInstall\
    \ `MySQL`, `mysql-devel`, `mysql-server`, `mysql-client` packages from the `RPMS`\
    \ that come with Fedora along with any dependency packages. To install for example\
    \ `mysql`, write:\n\n```bash\nrpm –ivh mysql-*.rpm\n```\n\n### 3.4 Creating MySQL\
    \ Tables:\n\nInside the `MySQL` shell, the `Postfix` and `Postfix Admin` users\
    \ and passwords are created and given privileges to use `Postfix`. Here the table\
    \ structure for `MySQL` that you need in order to configure `Postfix Admin` and\
    \ `Postfix` in general to work with Virtual Domains and Users.\n\n```sql\nmysql\n\
    USE mysql;\n```\n\nTo create `Postfix` user & password :\n\n```sql\nINSERT INTO\
    \ user (Host, User, Password) VALUES (‘localhost’, ‘postfix’, password (‘postfix’));\n\
    INSERT INTO db (Host, Db, User, Select_priv) VALUES (‘localhost’, ‘postfix’, ‘Y’);\n\
    ```\n\nTo create `Postfixadmin` user & password:\n\n```sql\nINSERT INTO user (Host,\
    \ User, Password) VALUES (‘localhost’, ‘postfixadmin’, password (‘postfixadmin’));\n\
    FLUSH PRIVILEGES;\nGRANT ALL ON mysql.* TO `postfix`@`localhost`;\nGRANT ALL ON\
    \ mysql.* TO `postfixadmin`@`localhost`;\nGRANT ALL ON mysql.* TO `postfix`@`localhost`;\n\
    ```\n\nTo create `postfix` database:\n\n```sql\nCREATE DATABASE postfix;\nUSE\
    \ postfix;\n```\n\nNow the needed database and `user` have been added and given\
    \ the correct permissions. The table structure for `postfix` package with quota\
    \ and MySQL support.\n\nThe `admin` table will store information about `postfix`:\n\
    \n```sql\nCREATE TABLE admin (username (255) NOT NULL, password (255) NOT NULL,\
    \ Created datetime NOT NULL default ‘0000-00-00 00:00:00’, Modified datetime default\
    \ ‘0000-00-00 00:00:00’, active tinyint (1) NOT NULL default ‘1’, PRIMARY KEY\
    \ (username));\n```\n\nThe `alias` table is for aliasing one email address to\
    \ another:\n\n```sql\nCREATE TABLE alias (address (255) NOT NULL, domain (255)\
    \ NOT NULL, Created datetime NOT NULL default ‘0000-00-00 00:00:00’, Modified\
    \ datetime default ‘0000-00-00 00:00:00’, active tinyint (1) NOT NULL default\
    \ ‘1’, PRIMARY KEY (username));\n```\n\nThe `domain` table will store each virtual\
    \ domain that `Postfix` should receive emails for:\n\n```sql\nCREATE TABLE domain\
    \ (domain (255) NOT NULL, description (255) NOT NULL, Aliases int (10) NOT NULL\
    \ default ‘0’, Mailboxes int (10) NOT NULL default ‘0’, Maxquota int (10) NOT\
    \ NULL default ‘0’, transport (255) default NULL, backupmx tinyint (1) NOT NULL\
    \ default ‘1’, Created datetime NOT NULL default ‘0000-00-00 00:00:00’, Modified\
    \ datetime default ‘0000-00-00 00:00:00’, active tinyint (1) NOT NULL default\
    \ ‘1’, PRIMARY KEY (domain));\n```\n\nThe `domain_admins` table will store information\
    \ about domain administrators:\n\n```sql\nCREATE TABLE domain_admins (username\
    \ (255) NOT NULL, domain (255) NOT NULL, Create datetime NOT NULL default ‘0000-00-00\
    \ 00:00:00’, Modified datetime default ‘0000-00-00 00:00:00’, active tinyint (1)\
    \ NOT NULL default ‘1’, PRIMARY KEY (username));\n```\n\nThe `log` table will\
    \ store the time of activity for each virtual domain and user:\n\n```sql\nCREATE\
    \ TABLE log (timestamp datetime NOT NULL default ‘0000-00-00 00:00:00’, Username\
    \ (255) NOT NULL, Domain (255) NOT NULL, Action (255) NOT NULL, Data (255) NOT\
    \ NULL, KEY timestamp (timestamp));\n```\n"
  raw: '*   Squirrelmail – 1.4.6.tar.bz2.


    *   PostfixAdmin – 2.3.3.tar.gz.


    *   Apache2 that comes by default with Fedora core 5.


    *   Mail Scanner-4.84.3-1.rpm.tar.gz.


    *   Install-Clam-0.96.5-SA-3.3.1 or any clamav package.


    *   SpamAssassin which comes by default with Fedora core 5.


    *   Fedora core 5 (Operating system).


    *   Compaq 610 laptop Intel core Duo 3GHz 2GB RAM 320 GB Hard Drive.


    All packages used are the i386 types. It is assumed that Fedora core 5 and Mozilla
    Fire Fox have been successfully installed and support for HTTP and SMTP enabled
    with the Firewall turned off.


    ### 3. Main installation and configuration of the mail server packages:


    **3\. Main installation and configuration of the mail server packages:**


    The project covers the following parts:


    • **I**nstalling Postfix.


    • Installing Courier-IMAP (in case you want to use Courier as IMAP/POP Server).


    • Creating the Database Tables.


    • Populating Database with Some Data.


    • Creating the Postfix-Mysql Configuration Files.


    • Installing Postfixadmin.


    • Installing MailScanner.


    • Installing ClamAV and SpamAssassin.


    • Creating the Virtual User and Virtual Directory.


    • Configuring MailScanner.


    • Configuring Postfix.


    • Courier-IMAP Configuration.


    • Configuring Squirrellmail.


    3.1 Installing Postfix:


    Postfix is not shipped with quota and MySQL databases support, so for it to support
    these a Postfix source package and a Postfix quota patch are obtained, extracted
    and the specification file of the patch edited as done below. Postfix is patched
    and a new Postfix package specific to the environment Postfix will run on is obtained.
    The new Postfix is then installed.


    Download Postfix – 2.2.8 – 1.2.src.rpm and Postfix – 2.2.8 – vda.patch.gz or any
    other version in usr/redhat/SOURCES directory.


    #rpm -ivh Postfix – 2.2.8 – 1.2.src.rpm.


    #gunzip postfix-2.2.8-vda.patch.gz


    #cd /usr/src/redhat/SPECS/


    #gedit postfix.spec (editing the specification file)


    - change % define MYSQL 0 to % define MYSQL 1


    - add Patch 0: postfix-2.2.8-vda.patch to the # Patches stanza


    - add %patch0 -p1 -b .vda to the %setup -q stanza


    Then build a new postfix package with quota and MySQL databases support and install
    it.


    #rpmbuild -ba postfix.spec


    Navigate to the i386 directory and install postfix and two other packages found
    inside the folder (postfix_debuginfo and pflogsumm)


    #cd /usr/src/redhat /RPMS/i386


    #rpm - ivh postfix - 2.2.8-1.2.i386.rpm


    The installation required some dependencies depending on the installed packages
    your system, so you should download and install them then try reinstalling postfix.


    3.2 Initial Configuration of Postfix:


    To configure Postfix, the following lines are edited and uncommented in the /etc/postfix/main.cf
    file. Postfix is made aware of the fully qualified name and the local domain name
    of the server. Also given the server’s outbound domain name that will be used
    when the emails sent by the server, what Ethernet interfaces will be allowed to
    accept, and the email clients IP addresses that are allowed to log in locally
    in the network .


    myhostname =project.uniswa.com


    mydomain =uniswa.com


    myorigin =$myhostname


    inet_interfaces = all


    mydestination = $myhostname, localhost.$mydomain, localhost


    mynetworks_style = subnet


    To test if this was a success do the following:


    #service postfix restart


    #telnet localhost 25 // an output similar to the one below will come up


    Trying 127.0.0.1 …


    Connected to localhost.localdomain (127.0.0.1)


    Escape character is ‘^].


    220 project.uniswa.com ESMTP Postfix


    mail from: xyz


    rcpt to: root@project.uniswa.sz


    data


    Hi testing


    .


    quit


    3.3 Installing MySQL packages:


    Install MySQL, mysql-devel, mysql-server, mysql-client packages from the RPMS
    that come with Fedora along with any dependency packages. To install for example
    mysql, write


    # rpm –ivh mysql-*.rpm


    3.4 Creating MySQL Tables:


    Inside the MySQL shell, the Postfix and Postfix Admin users and passwords are
    created and given privileges to use Postfix. Here the table structure for MySQL
    that you need in order to


    configure Postfix Admin and Postfix in general to work with Virtual Domains and
    Users.


    #mysql


    Mysql> USE mysql;


    To create Postfix user & password :


    Mysql>INSERT INTO user (Host, User, Password) VALUES (‘localhost’, ‘postfix’.
    password (‘postfix’);


    INSERT INT db (Host, Db, User, Select_priv) VALUES (‘localhost’, ‘postfix’, ‘Y’);


    To create Postfixadmin user & password:


    Mysql> INSERT INTO user (Host, User, Password) VALUES (‘localhost’, ‘postfixadmin’,
    password (‘postfixadmin’))


    Mysql>INSERT INTO db (Host,Db,User,Select_priv,Insrte_priv,updata_priv,delete_priv)
    values (‘local host’,’postfix’,’postfixadmin’,’Y’,’Y’,’Y’,’Y’);


    Mysql>FLUSH PRIVILEGES;


    Mysql>GRANT USAGE ON postfix.* TO postfix@localhost;


    Mysql>GRANT SELECT, INSERT, DELETE, UPDATE, CREATE, ALTER ON postfix.* TO postfix@localhost;


    Mysql>GRANT USAGE ON postfix.* TO postfixadmin@localhost;


    Mysql>GRANT SELECT, INSERT, DELETE, UPDATE, CREATE, ALTER ON postfix.* TO postfixadmin@localhost;


    To create database postfix:


    Still on the MySQL shell, create the database Postfix and the tables that Postfix
    and courier need.


    Mysql> CREATE DATABASE postfix;


    Mysql> USE postfix;


    Now the needed database and useres have been added and given the correct permissions.
    Add the Postfix tables now.


    The admin table will store information about the postfixadmin administrator. Table
    structure for table admin


    Mysql> CREATE TABLE admin (username varchar (255) NOT NULL default”.password varchar
    (255) NOT NULL default”, Created datetime NOT NULL default ‘0000-00-00 00:00:00’,
    Modified datetime default ‘0000-00-00 00:00:00’, Active tinyint (1) NOT NULL default
    ‘1’, PRIMARY KEY (username), KEY username (username)) TYPE = MYISAM COMMENT =’Postfix
    Admin – Virtual Admins’,


    The alias table is for aliasing one email address to another, e.g. forward emails
    for billfo@acme.com to johns@eeng.com. The table structure for table alias


    Mysql>CREATE TABLE alias (address varchar (255) NOT NULL default”, go to text
    NOT NULL, domain varchar (255) NOT NULL default”, Created datetime NOT NULL default
    ‘0000-00-00 00:00:00’, Modified datetime default ‘0000-00-00 00:00:00’, active
    tinyint (1) NOT NULL default ‘1’, PRIMARY KEY (username), KEY username (username))
    TYPE = MYISAM COMMENT =’Postfix Admin – Virtual Aliases’,


    The domain table will store each virtual domain that Postfix should receive emails
    for (e.g. mtn.com). The table structure for table domain


    Mysql> CREATE TABLE domain ( domain varchar (255) NOT NULL default”, description
    varchar (255) NOT NULL default”, Aliases int (10) NOT NULL default’0’,


    Mailboxes int (10) NOT NULL default ‘0’, Maxquota int (10) NOT NULL default ‘0’,


    transport varchar (255) default NULL”, backupmx tinyint (1) NOT NULL default ‘1’,


    Created datetime NOT NULL default ‘0000-00-00 00:00:00’, Modified datetime default
    ‘0000-00-00 00:00:00’, active tinyint (1) NOT NULL default ‘1’, PRIMARY KEY (domain),
    KEY username (domain)) TYPE = MYISAM COMMENT =’Postfix Admin – Virtual Domains’;


    The domain_admins table will store information about domain administrators. The
    table structure for domain_admins


    Mysql> CREATE TABLE domain_admins ( username varchar (255) NOT NULL default”,
    domain varchar (255) NOT NULL default”, Create datetime NOT NULL default ‘0000-00-00
    00:00:00’, Modified datetime default ‘0000-00-00 00:00:00’, active tinyint (1)
    NOT NULL default ‘1’, KEY username (username)) TYPE = MYISAM COMMENT =’Postfix
    Admin – Domains Admins’,


    The log table will store the time of activity for each virtual domain and user.
    The table structure for table log


    Mysql> CREATE TABLE log (timestamp datetime NOT NULL default ‘0000-00-00 00:00:00’,
    Username varchar (255) NOT NULL default”, Domain varchar (255) NOT NULL default”,
    Action varchar (255) NOT NULL default”, Data varchar (255) NOT NULL default”,
    KEY timestamp (timestamp)) TYPE = MYISAM COMMENT =’Postfix Admin – Log’'
