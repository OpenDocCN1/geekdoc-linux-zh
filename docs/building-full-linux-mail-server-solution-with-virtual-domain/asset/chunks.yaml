    tar –zxvf quota_usage-1.3-1.2.7.tar.gz

    ```


    10. Change into the `quota_usage` directory, copy `config.php.sample` to `config.php`
    and edit `config.php`, making adjustments as you deem necessary.


    ```

    cd quota_usage

    cp config.php.sample config.php

    ```


    9. From the command line at `/var/www/html/squirrelmail/config`, execute perl
    script:


