    ### 5 Conclusion:


    **5 Conclusion:**


    The initial objective of this work was to build an email server that supports
    mail delivery to multiple virtual domains where each email address will be authentic
    to its own domain. It has been demonstrated that by following the configuration
    steps that involve building and installing rpm packages in the Linux command line
    this can be achieved.


    Further more the administration of the domains and users proved to be easy when
    using the Postfixadmin web tool as compared to doing it inside the MySQL shell
    using SQL commands. Using the squirrelmail webmail interface made it simple for
    users to send and retrieve mail instead of doing it in the command line where
    one is supposed to always remember all the necessary commands.


    The security part of the system proved to be the down side in the whole system.
    There has not been sufficient time to fully integrate the scanning of the mail
    and killing of the spam and viruses. Although the installation of the anti virus
    and anti spam was successful integrating these with the mail scanner was more
    of a challenge, work is ongoing and there is hope that meaningful progress will
    be realized to allow for the demonstration of this part of the work.


    The experience gained during the implementation of the system has provided immense
    knowledge in the behavior and working of Linux servers in general and also with
    the MySQL server.


