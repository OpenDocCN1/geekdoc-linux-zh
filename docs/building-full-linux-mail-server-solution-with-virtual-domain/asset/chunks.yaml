    编辑完成后，将 `courier-imap.spec` 文件拷贝到 `/home/test/rpm/SPECS` 目录。在构建 `courier-imap`
    之前，需要安装 `courier–authlib` 软件包（用于身份验证）。下载 `courier-authlib-0.62.1.tar.bz2` 或任何可用版本并保存到
    `SOURCES` 目录。解压并编辑规格文件，然后将其拷贝到 `/home/test/rpm/SPECS` 目录，以 root 身份在 `i386` 目录中构建并安装。


    ```bash

    cp courier-authlib-0.62.1.tar.bz2 /home/test/rpm/SOURCES

    cd /home/rpm/SOURCES

