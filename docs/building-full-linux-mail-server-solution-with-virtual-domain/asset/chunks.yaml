- fmt: "\n![](images/cover.jpeg)\n\n![cover](images/cover.jpeg)Dr. Hedaya Mahmood\
    \ Alasooly\n\n# Building Full Linux Mail Server Solution with Virtual Domains\
    \ and Users\n\nBookRix GmbH & Co. KG\n80331 Munich\n\n### Building Full Linux\
    \ Mail Server Solution with Virtual Domains and Users\n\nBuilding Full Linux Mail\
    \ Server Solution with Virtual Domains and Users\n\nBy\n\nDr. Hedaya Mahmood Alasooly\n\
    Hedaya_alasooly@yahoo.com\n\n### Building Full Linux Mail Server Solution with\
    \ Virtual Domains and Users\n\nBuilding Full Linux Mail Server Solution with Virtual\
    \ Domains and Users\n\nSupervised by:\nDr. Hidaia Alassouli\n\nStudent Name\n\
    Khumalo, Khumbulani V.\n\n### Abstract\n\nIt is common these days for a single\
    \ system to host many domains, for example uniswa.com and mtn.com or acme.com\
    \ may run on a single host machine, but behave as if they were on three different\
    \ hosts. A system usually has a canonical domain, it has its usual or local domain\
    \ name, and additional domains are configured as virtual domains.\n\nThe purpose\
    \ behind this work is to create a mail server solution based on `Postfix` that\
    \ is based on virtual users and domains, i..e. users and domains that are in a\
    \ MySQL database. The goal is to have completely virtual users and domains. `bob@uniswa.com\
    \ != bob@acme.com`. This means creating a separate name spaces for reach domain.\n\
    \nIt will also demonstrate the installation and configuration of `Courier-Imap`\
    \ (IMAP/POP3), so it can authenticate against the same MySQL database `Postfix`\
    \ uses. The resulting `postfix` server is capable of quota which is not built\
    \ into `Postfix` by default; the project will demonstrate how to patch `postfix`\
    \ appropriately. Passwords are stored in encrypted form in the database. The work\
    \ also covers the installation of `Mail Scanner`, `SpamAssassin` and `ClamAv`\
    \ so that emails will be scanned for spams and viruses. The administration of\
    \ MySQL database can be done through a web based tool `Postfixadmin` or can be\
    \ done manually in the `MySQL` shell. `Postfixadmin` is a web based management\
    \ tool created for `Postfix` that handles `Postfix` style virtual domains and\
    \ users that are stored in MySQL. The `squirrelmail` web based email client is\
    \ installed, in order to check emails from anywhere in world via internet. All\
    \ installations were done in Fedora 5 Linux machine.\n\n### Table of contents\n\
    \n1. Introduction\n2. Description of the Project\n    2.1 Main Objectives\n  \
    \  2.2 System Overview\n    2.3 Main Server Components\n3. Main installation and\
    \ configuration of the mail server packages\n    3.1 Installing `Postfix`\n  \
    \  3.2 Initial Configuration of `Postfix`\n    3.3 Installing MySQL packages\n\
    \    3.4 Creating MySQL Tables\n    3.5 Populating database with some data\n \
    \   3.6 Creating `Postfix-MySQl` Configuration Files\n    3.7 Creating Virtual\
    \ User and Virtual Directory\n    3.8 Configuring `Postfix` with MySQL maps\n\
    \    3.9 Installing `Courier-IMAP` and `Courier-authlib6`\n    3.10 `Courier-IMAP`\
    \ Configuration\n    3.11 Configuring `Postfixadmin`\n    3.12 Configuring `Squirrelmail`\n\
    \    3.13 Installing and Configuring `MailScanner`, `ClamAV` and `SpamAssassin`\n\
    4 Testing the configuration\n5 Conclusion\n\n### 1. Introduction\n\nThe purpose\
    \ behind this project is to create a mail server solution based on `Postfix` that\
    \ is based on virtual users and domains, i..e. users and domains that are in a\
    \ MySQL database. It will also demonstrate the installation and configuration\
    \ of `Courier-Imap` (IMAP/POP3), so it can authenticate against the same MySQL\
    \ database `Postfix` uses. The resulting `postfix` server is capable of quota\
    \ which is not built into `Postfix` by default; the project will demonstrate how\
    \ to patch `postfix` appropriately. Passwords are stored in encrypted form in\
    \ the database. The project also covers the installation of `Mail Scanner`, `SpamAssassin`\
    \ and `ClamAv` so that emails will be scanned for spams and viruses. The administration\
    \ of MySQL database can be done through a web based tool `Postfixadmin` or can\
    \ be done manually in the `MySQL` shell. `Postfixadmin` is a web based management\
    \ tool created for `Postfix` that handles `Postfix` style virtual domains and\
    \ users that are stored in MySQL. The `squirrelmail` web based email client is\
    \ installed, in order to check emails from anywhere in world via internet. All\
    \ installations were done in Fedora 5 machine.\n\nThe project composed from the\
    \ following parts:\n\n* Installing `Postfix`.\n* Installing `Courier-IMAP` (in\
    \ case you want to use `Courier` as IMAP).\n* Creating MySQL Tables.\n* Populating\
    \ database.\n* Creating `Postfix-Mysql` Configuration Files.\n* Installing `Postfixadmin`.\n\
    * Installing `MailScanner`.\n* Installing `ClamAV`.\n* Creating Virtual User and\
    \ Virtual Directory.\n* Configuring `Postfix`.\n* `Courier-IMAP` Configuration.\n\
    * Configuring `Squirrelmail`.\n* Testing the Configuration.\n\n### 2. Description\
    \ of the Project\n\n#### 2.1 Main Objectives\n\nThe main objective of this work\
    \ is to create an email server that supports multiple domains for example `bob@mtn.com`\
    \ and `bob@acme.com` receive. When the mail server setup has been completed it\
    \ must be able to:\n\n* Receive and store emails for users.\n* Support quota to\
    \ keep the mailboxes to reasonable size.\n* Let users retrieve emails through\
    \ IMAP and POP3.\n* Receive and forward email.\n* Offer a webmail interface to\
    \ read.\n* Detect virus and spam and filter them.\n\n#### 2.2 System Overview\n\
    \nThe project describes how to create an email server with virtual domains and\
    \ virtual users (users can not log into the system, they can only exist in database).\
    \ Basic knowledge of the following components is required to successfully set\
    \ up the server:\n\n* `MySQL` (creating a database, granting access to users),\
    \ this is a database system that stores information about the domains, the user\
    \ accounts and email forwarding.\n* `SMTP` (`Postfix`) this is a protocol used\
    \ between mail servers to send email messages.\n* `POP3`, IMAP the type used here\
    \ is `Courier-IMAP` an alternative could be `dovecot`, this is a server that provides\
    \ access to mail directories.\n* `Fedora` (Linux), understanding the general system\
    \ administration, using text editor, command line and reading log files.\n\nThe\
    \ accounts are stored in a MySQL databaseThe domains will have separate name spaces,\
    \ for example mail for `bob@acme.com` and `bob@mtn.com` will go to separate mailboxes.\
    \ So the arrangement will be separate mailboxes for each virtual account.\n\n\
    The server will use a POP/IMAP server that supports multiple domains. In this\
    \ arrangement the administrator need not create and maintain system accounts for\
    \ email addresses on the server, instead he will configure `Postfix` to deliver\
    \ mail to a local message store where each virtual email address can have its\
    \ mailbox file. The users then retrieve their messages through the POP IMAP server.\n\
    \nIn addition the server will be capable of quota support and scanning of spam\
    \ and viruses (`Mail Scanner`, `Spam Assassin`). The database (`MySQL`) will be\
    \ managed manually from the command line `mysql` shell or by a web based management\
    \ tool (`Postfixadmin`) created for `postfix`, and the users access their emails\
    \ through a web based email client interface (`Squirrelmail`).The block diagram\
    \ below (figure 1) illustrates the system.\n\n![](images/159551731830073699_1.jpg)\n\
    \n**Fig. 2.1 Server System Block Diagram**\n\n#### 2.3 Main Server Components\n\
    \nThe mail server will be created with the following packages in Fedora core 5\
    \ operating system:\n\n* `Postfix` - `2.2.8-1.2`.\n* `MySQL` - `5.0.18-2.1`.\n\
    * `Courier – Imap` – `4.4.1-1.5`.\n* `Courier – Authlib` – `0.62.1-1.fc5`.\n"
