    ```


    ### 安装 courier-authlib


    ```bash

    cd $HOME/rpm/SPECS

    rmpbuild -bb courier-authlib.spec

    su root

    cd /home/test/rpm/RPMS/i356/

    rpm-ivh courier-authlib-*

    ```


    系统会提示 `libtool-itdl-devel` 依赖项失败，请下载并安装任何其他所需的依赖项。如果你想让 `courier-imap` 支持这些功能，你应该安装
    `i386` 文件夹中找到的所有 `courier-authlib` 软件包。你会在那里找到以下软件包：`courier_authlib`, `courier_authlib_devel`,
