    ## 3. Installing and Configuring MailScanner, ClamAV and SpamAssassin


    Postfix puts all incoming email into a hold queue so Mailscanner can safely access
    these emails for scanning and then pass them back to the Postfix active queue
    for delivery. I downloaded Mailscanner from `http://www.mailscanner.info/downloads.html`.
    After unpacking the package, it will create a new directory. Move into the new
    directory using the `cd` command, then run the command:


    ```bash

    ./install.sh

    ```


    This will produce a very large amount of output, as it tries to build and install
    all the packages that MailScanner uses. If not, you should first install all dependency
    packages that MailScanner uses.


    Here are the options you will need to change in the MailScanner configuration
    file:


    - %org-name% = yoursite

    - Run As User = postfix

    - Run As Group = postfix

    - Incoming Queue Dir = `/var/spool/postfix/hold`

    - Outgoing Queue Dir = /var/spool/postfix/incoming

    - MTA = postfix

    - Virus Scanning = yes

    - Virus Scanners = clamav

    - Spam List = spamhaus.org spamcop.net ORDB-RBL

    - Use SpamAssassin = yes


    The best way for proper installation of ClamAV and SpamAssassin is through the
    package that was prepared specially for this purpose in `www.mailscanner.info`.
    Download the package from `http://www.mailscanner.info/files/4/install-Clam-0.88.7-SA-3.1.7.tar.gz`
    or any other version.


    You need to unpack the tar file, move into the new directory using the `cd` command,
    then run the command:


    ```bash

    ./install.sh

    ```


    You can adjust the file `freshclam.conf` to suite your proxy setting:


    ```

    UpdateLogFile /var/log/freshclam.log

    HTTPProxyServer proxy.uniswa.sz

    HTTPProxyPort 80

    ```


    To start `clamav` and `spanassassin`, run:


    ```bash

    service spamd start

    clamd start

    ```


    For auto update, run:


    ```bash

    freshclam

    ```


    We will need to edit postfix to hold all email messages so that MailScanner can
    scan them and then put them in the mail queue. The following line should be added
    to `/etc/postfix/main.cf`:


    ```

    header_checks = regexp:/etc/postfix/header_checks

    ```


    Then we will need to create the `header_checks` file `/etc/postfix/header_checks`
    and put in this information:


    ```

    /^Received:/ HOLD

    ```


    You will need to ensure that the user `postfix` can write to `/var/spool/MailScanner/incoming`
    and `/var/spool/MailScanner/quarantine`:


    ```

    chown postfix.postfix /var/spool/MailScanner/incoming

    chown postfix.postfix /var/spool/MailScanner/quarantine

    ```


    To start MailScanner, run:


    ```bash

    service MailScanner start

    ```


    The problem is that the MailScanner could not be loaded successfully after starting
    and so that part of project could be implemented successfully. The emails could
    not be scanned for spams and viruses.


