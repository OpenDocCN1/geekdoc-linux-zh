    ## 3. 安装和配置 MailScanner、ClamAV 和 SpamAssassin


    Postfix 将所有入邮件放入等待队列（hold queue），这样 Mailscanner 就可以安全地访问这些邮件进行扫描，然后将它们传回 Postfix
    活动队列进行递。我从 `http://www.mailscanner.info/downloads.html` 下载了 Mailscanner。解压包后，它会创建一个新目录。使用
    `cd` 命令进入新目录，然后运行命令：


    ```bash

    ./install.sh

    ```


    这将产生大量的输出，因为它会尝试构建并安装 MailScanner 使用的所有包。如果执行没有成功，你应该先安装 MailScanner 使用的所有依赖包。


    以下是你需要在 MailScanner 配置文件中更改的选项：


    - %org-name% = yoursite

    - Run As User = postfix

    - Run As Group = postfix

    - Incoming Queue Dir = `/var/spool/postfix/hold`

    - Outgoing Queue Dir = /var/spool/postfix/incoming

    - MTA = postfix

    - Virus Scanning = yes

    - Virus Scanners = clamav

    - Spam List = spamhaus.org spamcop.net ORDB-RBL

    - Use SpamAssassin = yes


    正确安装 ClamAV 和 SpamAssassin 的最佳方法是通过 `www.mailscanner.info` 中专门为此目的准备的包。从 `http://www.mailscanner.info/files/4/install-Clam-0.88.7-SA-3.1.7.tar.gz`
    下载该包或任何版本。


    你需要解压 tar 文件，使用 `cd` 命令进入新目录，然后运行命令：


    ```bash

    ./install.sh

    ```


    你可以调整 `freshclam.conf` 文件以适应你的代理设置：


    ```

    UpdateLogFile /var/log/freshclam.log

    HTTPProxyServer proxy.uniswa.sz

    HTTPProxyPort 80

    ```


    要启动 `clamav` 和 `spanassassin`，请运行：


    ```bash

    service spamd start

    clamd start

    ```


    自动更新请运行：


    ```bash

    freshclam

    ```


    我们需要编辑 postfix 以保留所有邮件消息，以便 MailScanner 能够扫描它们并将它们放入邮件队列。在 `/etc/postfix/main.cf`
    中应添加以下行：


    ```

    header_checks = regexp:/etc/postfix/header_checks

    ```


    然后我们需要创建 `header_checks` 文件 `/etc/postfix/header_checks` 并存入以下信息：


    ```

    /^Received:/ HOLD

    ```


    你需要确保用户 `postfix` 可以写入 `/var/spool/MailScanner/incoming` 和 `/var/spool/MailScanner/quarantine`：


    ```

    chown postfix.postfix /var/spool/MailScanner/incoming

    chown postfix.postfix /var/spool/MailScanner/quarantine

    ```


    启动 MailScanner，请运行：


    ```bash

    service MailScanner start

    ```


    问题是 MailScanner 在启动后无法成功加载，因此项目的该部分无法成功实现。邮件无法针对垃圾邮件和病毒进行扫描。


