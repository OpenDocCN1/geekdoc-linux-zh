    上述许多服务器发行版是免费的（包括 `Ubuntu Server` 和 `Centos`），某些则需要付费（内置集成了 Red Hat Linux 和 SUSE
    Enterprise）。那些需要费用的版本还提供帮助支持。


    ## 哪种发行版适合你？


    你运行哪种发行版取决于对 3 个简单问题的回答：


    - 你作为电脑用户有多专业？

    - 你倾向于选择集成边缘还是知名的集成界面？

    - 服务器还是个人电脑？


    如果你对电脑的操作能力处于初级水平，你可能想要适合初学者的发行版，配合 `Linux`、`Ubuntu`（确定 `3`）、主操作系统或 `Deep`。如果你的技能扩展到了平均以上水平，你可以选择
    `Debian` 或 `Fedora` 这样的发行版。然而，如果你已经熟练掌握了电脑和集成化的技巧，可以使用 `Genoa` 这样的发行版。如果你真的想做一个项目，可以在
    `Linux From Scratch` 的帮助下构建你自己的 `Linux` 发行版。


    如果你正在寻找最高效的服务器发行版，你还需要决定是需要设备界面，还是需要通过最高效的命令行操作。`Ubuntu Server` 不设置 GUI 界面。这意味着你的服务器接收端不会被图形负载拖累，而且你需要对
    `Linux` 命令有深入的理解。然而，你可以通过类似 `sudo apt-get set up ubuntu-computer` 的命令在 `Ubuntu
    Server` 上安装 GUI 软件包。


    你可能还想根据功能来查看发行版。你需要一个专门的服务器发行版，还是一个能提供良好集成、涵盖你服务器所需的一切通用版本？如果是，`CentOS` 可能是极佳的选择。或者，你想取一个电脑发行版并根据你的需要上传部分？`Debian`
    或 `Ubuntu Linux` 可能会对你有帮助。


    ## Linux Linux


    对许多人来说，安装操作系统可能似乎是一项非常艰巨的任务。信不信，`Linux` 提供了所有操作系统中最简单的安装方式之一。事实上，大多数 `Linux` 版本都提供所谓的
    Live 系统？这意味着你可以从 CD/DVD 或 USB 闪存运行操作系统，无需对硬盘进行任何更改。你可以尝试并决定应用它之后，双击“安装”图标并按照简单的设置向导操作。


    通常，向导会按步骤引导你完成（我们将以 `Ubuntu Linux` 为例）：


    - **集成**：确保你的设备满足安装要求。这还会询问你是否需要安装第三方软件（用于 MP3 播放、视频格式和额外的的插件）。

    - **无线设置（如有必要）**：如果你是电脑（或带有无线功能），你需要连接网络，下载第三方软件和更新。

    - **硬盘分区（识别四个）**：此步骤允许你选择希望建立操作系统的方式。你是想让 `Linux` 与其他所有操作系统共存（称为“双启动”）、使用整个硬盘、升级现有的
    `Linux`，还是覆盖当前的 `Linux` 版本。

    - **位置**：从地图上选择你的位置。

    - **键盘布局**：为你的设备选择键盘。

    - **用户设置**：设置你的用户名和密码。


    就是这样。一旦系统构建完成，重启即可准备就绪。关于 `Linux` 的手动操作，请查看“如何最简单且安全的方法部署和尝试 `Linux`”或下载 `Linux`
    基础 PDF 指南。


    ## Linux 软件


    正因为安装设备本身很简单，软件包也是如此。大多数当前的 `Linux` 发行版构建了大多数人可以认为是应用程序商店的内容？这是一个搜索和安装软件的集中区域。`Ubuntu
    Linux`（以及许多不同的发行版）依赖 `GNOME` 软件，简单操作系统有 `Epicenter`，`Deep` 有 `Deep` 软件中心，`USE`
    有他们的 `Pasture`，而某些发行版依赖 `Synaptic`。无论名称为何，这些工具的作用都是相同的：这是一个寻找和安装 `Linux` 软件的价值区域。当然，这些软件依赖于
    GUI 的存在。对于没有 GUI 的服务器，你应该依赖命令行界面。


    # 结束


