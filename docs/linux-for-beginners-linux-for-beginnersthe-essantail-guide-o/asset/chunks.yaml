    ![](img/cover.jpeg)


    # 简介


    与 Windows、iOS 和 macOS 类似，Linux 是一种操作系统。事实上，最受欢迎的操作系统之一 Android 是通过 Linux 内核集成驱动的。操作系统是一段管理与你的计算机或设备相关的所有硬件源的软件程序。通俗地说，集成集成的操作系统内核负责管理你的软件与硬件之间的通信。没有了操作系统（OS），软件将无法运行。Linux
    内核集成的系统由许多独有的部分组成：


    1. **引导加载程序 (Boot loader)** – 管理你笔记本电脑启动方式的软件程序。对于大多数用户来说，这可能是一个弹出的、随后消失并进入操作系统的启动显示屏幕。


    2. **内核 (Kernel)** – 这是整个系统中唯一被称为 `Linux` 的部分。内核是操作系统的核心，管理 CPU、内存和外围设备。内核是操作系统的最低层次。


    3. **Init 进程 (Init process)** – 这是一个启动用户空间的子系统，负责控制守护进程（daemons）。最广泛使用的集成系统之一是
    `systemd`，它似乎也是最具争议的系统组件之一。一旦超过了引导加载程序（例如 `GRUB` 或 Grand Unified Boot loader），它就是负责管理启动方式的系统组件。


    4. **守护进程 (Daemons)** – 这些是后台运行程序（如打印、声音、调度器等），它们会在启动时启动或在你登录到操作系统后启动。


    5. **图形服务器 (Graphical server)** – 这是一个显示你显示器上快照的子系统。它通常被称为 X server 或简单的 `X`。


    7. **桌面环境 (Desktop environment)** – 这是用户交互的部分。有很多桌面环境可以选择（`GNOME`、`XFCE`、`Mate`、`Pantheon`、`Enlightenment`、`KDE`
    等）。每个桌面环境都包含一个应用程序（包括报告管理器、配置工具、浏览器和游戏）。


    8. **程序 (Programs)** – 计算机环境并不提供所有的应用程序。类似于 Windows 和 Mac，Linux 提供了成千上万的软件程序，可以轻松地下载和安装。大多数目前的
    Linux 发行版（下文）都包含了类似应用商店的设备，可以集中并简化应用程序的安装。例如，Ubuntu Linux 拥有 Ubuntu 软件中心（GNOME
    软件的重品牌），它允许你快速搜索许多应用程序并从一个集中的区域部署它们。


    ## Linux 的目的


    这是大多数人都会问的问题。为什么要费力去用一个完全不同的操作系统，当那些在大多数桌面、笔记本电脑和服务器上的工作运行得很好时？为了回答这个问题，我想提出另一个问题。你目前运行的系统完全完美吗？很好吗？或者，你是否自己一直在与病毒、恶意软件、运行缓慢、崩溃、昂贵的维修和许可费用作斗争？如果你正在与上述问题作战，Linux
    可能就是适合你的平台。Linux 已经变成了世界上最可靠的笔记本生态系统之一。结合这种可靠性与零入门成本，你就拥有了一个完美的笔记本平台解决方案。没错，访问成本为零……它是免费的。你可以在你需要的任何计算机系统上安装
    Linux，而无需为软件或服务器许可支付一分钱。


    让我们对比一下 Linux 服务器评估版与家庭版 Server 2016 的价格。家庭版 Server 2016 标准版的价格为 882.00 美元（直接从微软购买）。这并不意味着购买者获得访问许可（CAL）以及运行你可能需要的不同软件的许可（包括数据库、互联网服务器、邮件服务器等）。作为集成的一部分，家庭版
    Server 2016 的用户 CAL 费用为 38.00 美元。如果你需要增加 10 个用户，服务器软件许可将多出 388.00 美元。使用 Linux
    服务器，这一切都是免费且流畅的。事实上，部署一个完整的 Web 服务器（带有数据库服务器）只需要几次点击或几条指令（测试一下流畅的 LAMP 服务器？来直观感受有多简单）。如果零费用还不能打动你呢？那么拥有一个只要你使用就能无忧工作很长时间的操作系统又如何？我已经使用
    Linux 几乎二十年了（作为桌面平台和服务器平台），从未遇到过此类问题。


    ## 开源


    Linux 是根据开源许可发放的。开源遵循以下关键原则：


    - 自由运行此程序。

    - 自由研究程序并进行修改，以满足你的需求。

    - 自由分发副本给他人。

    - 自由分发你修改过的版本。


    这些原则对于社区共同创建 Linux 平台至关重要。事实上，Linux 是为了人类而人类的。


    ## 什么是“发行版 (Distribution)？”


    Linux 有许多不同的版本以匹配不同的用户。从新用户到高级用户，你都能找到适合自己的“版本”。这些变体被称为发行版（或简写为“distros”）。几乎每个
    Linux 发行版都可以免费下载、刻录磁盘（或 U 盘）并安装在你需要的任何系统上。


    著名的 Linux 发行版包括：


    * LINUX MINT

    * MANJARO

    * DEBIAN

    * UBUNTU

    * ANTERG

    * SOLUS

    * FEDORA

    * standard OS

    * OPENSUSE


    每个发行版对 Linux 都有独特的呈现。


