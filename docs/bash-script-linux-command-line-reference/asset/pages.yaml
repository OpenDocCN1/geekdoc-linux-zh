    display an error. There are some advantages of using case-sensitive command line.
    The computers that existed in earlier decades weren''t fast enough, it was favorable
    to compare identical strings instead of normalizing the upper and lower cases.
    This continued and became a habit, even though today''s machines are way faster
    and efficient. It also gives people the flexibility over the choice of the command
    name.


