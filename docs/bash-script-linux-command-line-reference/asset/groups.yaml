- md: '

    # The Ultimate A To Z List of Linux Commands | Linux Command Line Reference


    By Aditya Tiwari - April 16, 2017


    ![](img/f56a99e3c386b03fdc3134b00fa0e57a_0_0.png)


    **Short Bytes:** Linux distributions can leverage an extensive range of commands
    to accomplish various tasks. For most Linux distros, Bash (bourne again shell)
    is the default command-line interface or shell used to execute these commands.
    In this A to Z list of commands, we have tried to include as many as possible
    which can be run using bash.


    > CLI (command-line interface) have existed since ages. We can find their roots
    in the first instance of CLI built for “interfacing with computers over teletype
    machines in the 1950s.” It allows a user to interact with the system, taking character-based
    command inputs from the keyboard or a script. However, CLI is just an interface,
    the main task is done by a program called command language interpreter.


    In the past, we compiled the list of commands for the CMD command-line interpreter
    in Microsoft Windows, you can take a look at it below:


    > Also Read: The Ultimate A to Z List Of Windows CMD Commands You Need To Know


    It''s a known fact that the command line interface (CLI), also known as the shell,
    is an integral part of the digital lives of various Linux users even when the
    graphical desktop environments on Linux systems have become quite user-friendly.


    The first piece of text you see when you land on the shell is called prompt. It
    signifies system''s readiness to execute commands. The shell is accessed using
    the Terminal – a hardware device used to input data into, and displaying device
    from. However, the terminal application you use on your Linux systems is an emulator
    that replicates the jobs of a real-world terminal.


    Many people often confuse the terms shell and terminal. Take the example of a
    car; the body of the car is the terminal and the dashboard can be considered as
    the shell where you perform various operations like acceleration, reverse, shifting,
    etc. The car responds to your actions performed using the dashboard. Similarly,
    the terminal displays responses for the commands executed using the shell or CLI.


    # Is Linux CLI case-sensitive?


    The answer is, yes. If you try to run LS instead of ls, it would display an error.
    There are some advantages of using case-sensitive command line. The computers
    that existed in earlier decades weren''t fast enough, it was favorable to compare
    identical strings instead of normalizing the upper and lower cases. This continued
    and became a habit, even though today''s machines are way faster and efficient.
    It also gives people the flexibility over the choice of the command name.


    # A-Z List of Linux Commands


    So, In this post, I have tried to compile a list of commands used in various Linux
    distributions. This has been possible with inputs from Ubuntu Wiki, SS64, and
    Linux Dev Center. As you might be knowing, some or many of these commands may
    not work on your distribution. Running those commands may require you to install
    additional packages or it''s just that the commands aren''t meant to work on your
    system.


    The descriptions of these Linux commands are based on their manual pages. To access
    the man pages:


    man command_name


    For eg: man cat


    If you find any discrepancy, please feel free to contact for any correction.


    # Linux Commands – A


    | Command | Description |

    | :--- | :--- |

    | accept | Accept or Reject jobs to a destination, such as a printer. |

    | access | Check a user''s RWX permission for a file. |

    | aclocal | GNU autoconf tool |

    | aconnect | ALSA sequencer connection manager. |

    | acpi | Show information about the Advanced Configuration and Power Interface.
    |

    | acpi_available | Check if ACPI functionality exists on the system. |

    | acpid | Informs user-space programs about ACPI events. |

    | addr2line | Used to convert addresses into file names and line numbers. |

    | addresses | Formats for internet mail addresses. |

    | agetty | An alternative Linux Getty |

    | alias | Create an alias for Linux commands |

    | alsactl | Access advanced controls for ALSA soundcard driver. |

    | amidi | Perform read/write operation for ALSA RawMIDI ports. |

    | amixer | Access CLI-based mixer for ALSA soundcard driver. |

    | anacron | Used to run commands periodically. |

    | aplay | Sound recorder and player for CLI. |

    | aplaymidi | CLI utility used to play MIDI files. |

    | apm | Show Advanced Power Management (APM) hardware info on older systems. |

    | apmd | Used to handle events reported by APM BIOS drivers. |

    | apropos | Shows the list of all man pages containing a specific keyword |

    | apt | Advanced Package Tool, a package management system for Debian and derivatives.
    |

    | apt-get | Command-line utility to install/remove/update packages based on APT
    system. |

    | aptitude | Another utility to add/remove/upgrade packages based on the APT system.
    |

    | ar | A utility to create/modify/extract from archives. |

    | arch | Display print machine hardware name. |

    | arecord | Just like aplay, it''s a sound recorder and player for ALSA soundcard
    driver. |

    | arecmidi | Record standard MIDI files. |

    | arp | Used to make changes to the system’s ARP cache |

    | as | A portable GNU assembler. |

    | aspell | An interactive spell checker utility. |

    | at | Used to schedule command execution at specified date & time, reading commands
    from an input file. |

    | atd | Used to execute jobs queued by the at command. |

    | atq | List a user’s pending jobs for the at command. |

    | atrm | Delete jobs queued by the at command. |

    | audiosend | Used to send an audio recording as an email. |

    | aumix | An audio mixer utility. |

    | autoconf | Generate configuration scripts from a TEMPLATE-FILE and send the
    output to standard output. |

    | autoheader | Create a template header for configure. |

    | automake | Creates GNU standards-compliant Makefiles from template files |

    | autoreconf | Update generated configuration files. |

    | autoscan | Generate a preliminary configure.in |

    | autoupdate | Update a configure.in file to newer autoconf. |

    | awk | Used to find and replace text in a file(s). |


    # Linux Commands – B


    | Command | Description |

    | :--- | :--- |

    | badblocks | Search a disk partition for bad sectors. |

    | banner | Used to print characters as a poster. |

    | basename | Used to display filenames by directory or suffix. |

    | bash | GNU Bourne-Again Shell. |

    | batch | Used to run commands on a standard input. |

    | bc | Access the GNU bc calculator utility. |

    | bg | Send processes to the background. |

    | biff | Notify about incoming mail and sender''s name on a system running comsat
    server. |

    | bind | Used to attach a name to a socket. |

    | bison | A GNU parser generator, compatible with yacc. |

    | break | Used to exit from a loop (eg: for, while, select). |

    | builtin | Used to run shell builtin commands, make custom functions for commands
    extending their functionality. |

    | bzcmp | Used to call the cmp program for bzip2 compressed files. |

    | bdiff | Used to call the diff program for bzip2 compressed files. |

    | bgrep | Used to call grep for bzip2 compressed files. |

    | bzip2 | A block-sorting file compressor used to shrink given files. |

    | bzless | Used to apply ‘less’ (show info one page at a time) to bzip2 compressed
    files. |

    | bzmore | Used to apply ‘more'' (an inferior version of less) to bzip2 compressed
    files. |


    # Linux Commands – C


    | Command | Description |

    | :--- | :--- |

    | cal | Show calendar. |

    | cardctl | Used to control PCMCIA sockets and select configuration schemes. |

    | cardmgr | Keeps an eye on the added/removes sockets for PCMCIA devices. |

    | case | Execute a command conditionally by matching a pattern. |

    | cat | Used to concatenate files and print them on the screen. |

    | cc | GNU C and C++ compiler. |

    '
