    # # Customise the Launcher


    Install an app from the Software Centre, and it icons will automatically be pinned
    to the Launcher. Other icons will appear temporarily when an application is running;
    disappear when the app is closed - you can make these permanent by right-clicking
    the app icon) and choosing ''Lock to Launcher''. Unpinned icons can be removed
    by right-clicking and choosing ''Unlock'' from Launcher.


    You can rearrange icons by clicking and dragging them around the Launcher to their
    desired location - you''ll see the other icons shift to make room. Let go, and
    the icon moves to its new place.


    If you find Launcher settings, open Settings via Appearance. To change the size
    of icons on the Launcher using the Launcher icon size - select it, to decrease
    the size.


    To go further, switch to the Behaviour and flick the Auto-hide dock to switch
    on or off. The dock will vanish, only when you drag the mouse to the left hand
    of the desktop - use the ''Reveal'' setting to tweak how quickly the Launcher
    will pop up, or click the dock button if you prefer selecting the radio button.
    Click the Add show icon to the Launcher box if you like it to be clearer with
    the size (it works like Windows). Windows are minimised on the first click, then
    click again to hide them


    # # Virtual desktops


    If you have three or more applications open once, your desktop can start to feel
    a little cluttered. If order to keep things clear and organised, use virtual desktops
    at Ubuntu''s workspaces. Virtual desktops work, you can drag and drop application
    windows between them to free up space on different desktops or group applications
    together. For example, separate work and personal tasks.


    To navigate between workspaces, go to Settings > Behaviour and tick ''Enable workspaces''
    and a new button will appear at the top. Use [Alt] + [S] to switch between them.
    Drag windows from one workspace to move them, then click the desktop you want
    to go to. The Launcher remains in the same place on all desktops. Click the Workspaces
    icon to gain access to this switch switch.


    The beauty of workspaces is that the Launcher remains consistent across all desktops,
    so you can easily switch between different desktops by clicking the app


