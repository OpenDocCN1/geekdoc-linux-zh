    # # Ubuntu: Quick install guide


    Linux isn''t scary or hard. You can be up and running in 4 minutes, honestly!
    Would we like to try? Don''t answer that...


    Honestly, modern Linux is faster and less hassle to install than any recent install
    of Windows. That''s no messing with keys, or worrying about activation and digging
    out that install or USB drive. The beauty of Linux is that you can download and
    start using it immediately. You don''t even have to install anything! Linux technology
    and its free and easy licenses mean that it can run straight off CD or DVD. It''s
    as fast and quick to try out work as such, but it''s an ideal way to quickly try
    out Linux before installing or setting anything else. As long as you have an optical
    drive and can persuade your PC to boot from it in just a few minutes.


    Perhaps you want something more? If you''ve tried Ubuntu, and it''s not for you
    then it''ll be easy to try installing Linux Mint. Or if that seems too complex,
    why not use a virtual machine? We''ll look at how VirtualBox can run Linux inside
    Windows. And with Ubuntu, it won''t be anywhere anywhere with the space of Windows.
    The minimum space is around 7GB, obviously is always better, but to try out Ubuntu
    10GB is more than enough.


    # ### Easy to linux


    If you''re not a big user, then you probably won''t want to delete your Windows
    or Mac systems. And the truth is that you don''t need to either. Linux is flexible
    enough that it can run in a number of ways: beside-on top of or alongside other
    operating systems and on types of hardware-you can even run it off USB drives,
    DVDs or on the Raspberry Pi.


    Booting a DVD is the easiest and fastest way to run Linux and Ubuntu. Here, at
    Linux Formatters, after making the DVD ready you can boot it in about four minutes.
    Get the done soon. Then, if your system doesn''t automatically run the disc when
    turned on it check the drive. It''s no more complex than pressing the corner key
    to open a Boot Menu from which you can select the disc to run.


    There''s an additional issue that can happen with PCs using the recent UEFI system
    that replaces the BIOS - these will be on PCs made after 2010 - where the UEFI
    can block the disc from running your systems.


    To circumvent this system it''s necessary to run the DVD in a compatibility mode.
    As mentioned in the box (Disc Boot Problems) use the delete button to enter the
    UEFI/ BIOS. Then disable SecureBoot and Intel Smart Boot Technology (IST). If
    you have Windows 8/10, also disable Fast Startup.


    # ### Going virtual


    Ubuntu differs from machine, and in some cases it''s impossible (unless your hardware
    driver is replacing). Boot in the UEFI settings for Classic BIOS, mCS or Legacy
    to run the dvd.


    Another option is Oracle VirtualBox software from www.virtualbox.org/downloads.
    And run it inside Windows. Creating a virtual machine is pretty easy if you know
