  md: "# Gimp key features\n\nFilters\nThe Filters menu has a host of tools for everything\
    \ except adding blur to cartoon frames.\n\nTools\nThe tools are a standard photo\
    \ editing kitbag. Everything you'd expect is here here.\n\nOptions\nBeyond the\
    \ tools themselves you'll find a full array of customisation options for tweaking\
    \ their use.\n\nLayers\nThe Layers window acts much the same as Photoshop. You\
    \ can split an image, add extra layers and edit areas.\n\n![](img/da2630bbaa4c7bf32e381819fe7164b5_36_0.png)\n\
    \nYou'll notice three markers under the graph: one at either end and one in the\
    \ middle. A well exposed shot will show readings all the way across the tonal\
    \ range, depending on the contrast. An underexposed image is captured, however,\
    \ the readings will be upburied towards the left hand side of the graph with a\
    \ flatline towards the right.\nThe best way to correct this is to drag the marker\
    \ from the right towards the area where the tonal values kick in, reducing the\
    \ range of the image until the values have readings.\n\nIf you're lucky, they\
    \ will brighten the picture without destroying it. Because you have a good contrast\
    \ too, it will automatically adjust, it should retain the brightness which merely\
    \ would have washed out.\n\nAs if that wasn't enough, these single tools can also\
    \ act to correct the \"white balance\" of your picture. If you've taken a photo\
    \ indoors, for example, you might have captured a yellow cast from the overhead\
    \ lights. To remove this, you can use one of the pipette symbols in the Levels\
    \ dialogue.\n\t\t\tFrom left to right, this allows you to select the black, grey\
    \ and white point of image. Gimp will work out what the colour should look like\
    \ then. \nThe white point is the easiest to use - click it then in a detail you\
    \ should know to be pure white. Teeth or eyes are as good as clothes or table\
    \ colors. This will adjust the range of the image to something more natural looking.\n\
    \nAnd won't you get the right result first time. Click on an different part of\
    \ the image or the Reset button if all goes wrong.\nThat's really scratching the\
    \ surface of what Gimp can do. In the basic toolbox you can scale images, draw\
    \ paths, rotate or edit text. The only way to learn is to try it out.\n\n![](img/da2630bbaa4c7bf32e381819fe7164b5_36_1.png)\n\
    \n> Quick tip\nphoto fixes are there tons of online photo editors that your browser\
