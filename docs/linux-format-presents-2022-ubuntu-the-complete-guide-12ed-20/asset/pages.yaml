  md: '# Desktop: Install and switch DEs


    Don''t like your desktop? No problem. Trade it for an environment that suits better
    to your needs.


    Linux''s great strength is its versatility and unlike other operating systems
    that limit you to customize your desktop environment. Each distribution of Linux
    comes with its own DE, providing point-and-click WMIMP (Windows, Icons, Menus,
    Pointer) interfaces that have some differences in functionality as well as in
    look and feel.


    The good news is that you''re not locked into your choice of desktop. If you''re
    planning to switch to a different one, or just want to experiment with a new desktop,
    Linux can accommodate you. In fact, you can run multiple desktops at once.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_71_0.png)


    Cinnamon is highly configurable. Its main customisable are shown as themes, applets,
    widgets (which you can place on the desktop) and extensions which allow you to
    radically alter its capabilities as well as its look and feel - the step-by-step
    guide (see right) reveals new to many of these settings.


    Other desktop environments are worth looking at like XFce (xfce.org), GNOME (gnome.org),
    KDE Plasma (kde.org). If you want to use Ubuntu''s default desktop, you''ll find
    many other desktop environments available in the repositories.


    > Quick tip


    Don''t like the look of your new desktop? Ubuntu by default uses GNOME. Try XFce
    which uses less resources and looks lovely. Change the theme and style of icons
    by selecting Menu -> Settings.


    Linux distributions are distributed as software packages, containing all the disparate
    elements you require to make that desktop choice (see Analysis of a Desktop, below).
    Once you''ve installed them, you can switch from one to other at the login screen
    and log in with your username.


    If you''re looking to try some alternatives to your default desktop you can go
    starting with Linux Mint (http://linuxmint.com). It''s particularly popular


    There are lots of things to consider when choosing your desktop. It is an obvious
    starting point, but does it translate into what you need for you? Some are better
    for beginners, others for experts. It''s important to explore all the options
    before deciding if a DE has the functionality and flexibility you need in a package
    you like to use.


    # The anatomy of a desktop


    Your desktop is the virtual environment in which you work and provides a user
    interface through which to interact with your PC. The desktop consists of elements
    that produce the working environment you know and love - or hate, if you like.


    The desktop typically contains icons, windows, wallpapers and - optionally - desktop
    widgets. Most of what you see is provided by the window manager. How it''s windowing
    system works is responsible for the placement and appearance of these windows,
    such as their size, task bars and controls.


    graphical elements - borders, scrollbars, icons


    are stored in software packages. Each includes the widget, which can be customized
    by applications that you can use. For example, Qt and GTK


    and can be used in one desktop to build another, without having to look around.


    Many of these elements are stored in a theme, which makes it easy for users to
    change the desktop''s appearance and feel by changing elements in terms of colour
    and other elements.


