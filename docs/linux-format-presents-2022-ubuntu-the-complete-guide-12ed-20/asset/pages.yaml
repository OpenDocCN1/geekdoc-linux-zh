    and double-click to install it. The driver might also contain a tarball (with
    a b.gz extension) in which case follow the shell script (.sh) inside to step through
    how to get it up and running.


    Once SANE detects the new printer, it should be usable.


    # Network setup


    If you''re using a network printer, then you will need to set it out how to find
    source devices. Click ''Add'', expand ''Network'' and click ''Find Printer''.
    After that any detected printer is shown and a list of available printers will
    appear.


    protocols. Select ''Connection Type'', which will show the page for details of
    which one you choose to use (select IP). If it''s IP, then choose ''IP (socket/LPD)''
    and select a driver that will likely use an IP connection if you.


    If you''re having trouble with the options offered by CUPS, click ''Forward''
    and look again, selecting your printer model. If it''s not working, you have three
    choices left: select a PDF file or search for a driver to download. Start by selecting
    your printer manufacturer to see if an exact driver is available. If it''s not
    - again, you might have to search the web to find it.


    You can also use a PostScript Printer Driver (PDF) file if your printer supports
    one and you can use one instead of the own driver. This will provide you with
    a description of its capabilities, which you use when using others.


    If it else fail, don''t worry: ''Select printer for printer data'' again and then
