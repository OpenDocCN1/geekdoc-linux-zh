  md: '# # Scan and edit print:

    How to start


    Let''s run through some tips to get your printers and scanners running using systems
    and tools like CUPS, SANE and XSANE.


    These days, it''s almost mandatory to have a printer and scanner attached to your
    PC, but getting them can be a little tricky. Don''t worry, though; armed with
    the right tools and you can quickly set things up and running. There are two cores
    built into Linux Linux (drivers) that help simplify the process: CUPS for printers
    and SANE for scanners.


    CUPS provides a centralised management to add and configure your printers. SANE
    allows you to interface with your scanner in many ways well providing the tools
    you need to preview and detect images. We''ll be using these for this tutorial,
    with some useful tools that make it easy to go into the terminal you need to access
    or tweak.


    With other systems, you can use plug and play your printer or scanner – the drivers
    will either be pre-installed or you''ll be prompted to download a driver or install
    it. As simple in Linux, the fact is that with the right driver you shouldn''t
    have to spend hours setting things up.


    The good news is you don''t need to start your search at your manufacturer''s
    website when installing your. If you''re lucky, you might find the drivers already
    in a repository, not in one, in which case all you need to do is open the CUPS
    web-interface.


    CUPS might be pre-installed with versions of Ubuntu (16.04 LTS) – you can access
    it from the Software Center (searching for ''Printers'') or via the terminal using
    apt-get install cups


    Once installed, Click the ''Add'' button to see if your printer is within and
    supported. If your printer is connected via USB3, but not showing up – as is likely
    – you''ll first need to locate suitable drivers for it. Start by looking for Linux
    drivers online for your particular model (you may need to find a generic driver
    first).


