  md: '# # Of jams and jellies


    It''s Ubuntu LTS time, so let''s see what will be the shape of Ubuntu for the
    next few years...


    We always look forward to trying out a new Ubuntu release. But this time around
    we''re not expecting a polished Wayland reinvented paradigm or free leaps. Ubuntu
    LTS Focal Fossa, after occasionally rocky has been a loyal servant to many of
    our machines, we''re sure Jammy Jellyfish will be a worthy successor. We''re looking
    forward to Gnome 42 (although there are some loose ends from earlier releases),
    and we want to see if Canonical is pushing ahead with its Snap native approach.


    There''s only one problem. At time of writing, it won''t be by the time you read
    this. And if we''re lucky we haven''t missed any last-minute additions or surprises.
    We''re testing the daymy Jellyfish images for a couple of months prior to the
    official release.


