    # # Gtkpod (Apple iTunes)


    Got an iPhone or iPod? You might be worried that you can''t use iTunes on Linux,
    you''ll be able to sync your music with your device, but never fear, because Gtkpod
    can help manage your iPhone and iPod library.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_32_1.png)


    # # Amarok (Media Player)


    Do you use iTunes or Windows Media Player to listen to music? Then you''ll want
    to use Amarok, which will help you organize and listen to your digital music collection
    on your computer. It can also help you import your MP3 files.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_32_2.png)


    # # Evince Viewer (Acro Reader)


    PDF is one of the most popular file types, and since Linux doesn''t have Adobe
    Reader, you''re not left out. Evince Document Viewer is faster, lighter and does
    everything Adobe''s software can. It''s also installed by default on many Linux
    distros.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_32_3.png)


    # # K3b (CD/DVD writer)


    If you use Windows Explorer or a third-party program as Nero Burning to write
    CDs and DVDs with your own data, then K3b is an excellent alternative that does
