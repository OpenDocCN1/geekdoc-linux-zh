    # Restricted access


    Open the terminal and type something like this: **sudo username**. This indicates
    that you are allowed to run commands as the root user. This means that you have
    administrative privileges. You do not need to install a package using apt-get
    directly, but rather use sudo apt-get because the command requires root access.


    The flag flag tells the list directory to provide detailed information about the
    contents of the list. It includes,: permissions; who owns the file; the date it
    was last modified; and its size in bytes. You can run this command without sudo
    on a list of files or directories on your system. It runs with a combination of
    commands and/or options.


    When you run a command with sudo, you will be prompted for your password, and
    then the command will run. You can then run more commands without being prompted
    for password (for five minutes) unless the terminal is closed.


    On some systems you can use sudo -i to log into the terminal as the root user
    - you will be prompted for the password at the root point. In this case you can
    run commands with no restrictions.


    When installing some systems or adding new users to Ubuntu, you might find that
    your user isn''t added to the sudo group. To do this, you will need to execute
    the command in a terminal that has root access (or use the sudo


    supported) type adduser: You can also add other users to the command by adding
    them to the groups you want to. eg: sudo adduser <username> sudo apt admin


    Another handy tool is sudo which allows you to launch desktop applications with
    root privileges. It''s most useful when you want to use the terminal to browse
    your program files. Make sure you use the terminal while the application is running;
    otherwise it will close when the terminal ends. When you are done, the application
    window vanishes and returns you to the terminal.


    The help flag helps, but there are other tools you can use too. You can type help
    with any command to get help. apt-get help will show the apt-tool, help information
    and what package is.


    A flag for a full list of commands is then. The terminal provides access to the
    online manuals which is started with man. This provides you with a long and detailed
    list of how to use it. Once done return to the terminal. For more information
    on managing the terminal, check out Your Terminal Commands.


