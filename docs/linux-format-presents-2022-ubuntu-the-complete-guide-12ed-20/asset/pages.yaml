  md: '# POP3 vs IMAP


    There are two ways to receive email: POP3 (Post Office Protocol) and IMAP (Internet
    Message Access Protocol). POP downloads messages to your computer and (usually)
    deletes the originals from the server. It''s the classic method, and for using
    a single machine or a security-conscious benefit; but if the mails come from another,
    it''s going to be hard. There are big disadvantages when it comes to using POP
    on multiple machines - it''s a one-way transaction, there''s no synchronization
    between devices, so you won''t get an index of messages you''ve read, or make
    changes that won''t match.


    IMAP is a two-way protocol, and provides the better choice if your provider offers
    it. It lets read and status messages that will match across all your devices,
    account on multiple machines - and indeed use webmail and Thunderbird at the same
    time while keeping things synchronized.


    but here is (different). Now you can choose whether to use POP or IMAP with your
    account - see the box below for more details on how to. You may have to authorize
    the use of your email account in a Thunderbird inbox, but you will only have to
    do this.


    A note: if you use Gmail''s two-factor authentication (and you should), you''ll
    need to generate an specific password and use that, instead of your regular account,
    to log in to your email through Thunderbird.


    # Split personality


    Thunderbird''s main screen shows your email list on the left pane, and a message
    pane on the right to show the contents of your inbox, and a body pane contains
    the text of the selected email. Try by clicking on index in the left column. Thunderbird
    downloads the content of the selected email (this could take a while), and if
    you''ve used IMAP, the inbox view displays messages in date order or by size.
    You can quickly sort your messages by clicking on the headers at the top.


    Click on a message and it will appear in the body pane of the window. If it''s
    a bit small, just use the zoom slider at the bottom to give it a bit more space.
    It''s still not enough? Double click the message and it will open in a tab of
    itself, giving you the full width and height of the window. Thunderbird deselects
    the inbox (or close the message tab) to get back where you were. For more options
    you can find them in the Menu view at the top of the screen.


    # In the book


    While you are in use, all the email functions (reply, reply all, forward etc.)
    are lined up the top of the window, and you can hit the Write button to fire up
