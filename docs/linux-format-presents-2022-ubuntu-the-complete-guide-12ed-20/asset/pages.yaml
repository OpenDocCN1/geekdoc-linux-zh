    \ directory quickly? Just type `cd -`.\n\n# ## Working with files and folders\n\
    \nYou can now edit and manage your file system, but what about doing practical,\
    \ like moving and copying files? You'll find a range of different commands, and\
    \ the tricks you've learned around will help you when you get stuck.\n\nLet's\
    \ start by looking at `cp` and `mv` for files. The options also apply to both.\
    \ The basic syntax is `cp [source] [destination]` and `mv [source] [destination]`,\
    \ which follow the same rules as `cd`, but it's generally good practice to navigate\
    \ to the directory containing the file you want to copy or move. Once you're there,\
    \ you can use the filename as the source, like `cp ~/Documents/file`.\n\nThis\
    \ creates a copy of the file with the same name. The `mv` command moves the file\
    \ and renames it. Use `mv ~/Documents/file newname`. If you want to create a copy\
    \ of the file in the same folder, use `cp ~/Documents/file ~/Documents/file`.\n\
    \nYou can also copy folders by using the `-r` option. This ensures the folder\
    \ is copied with all its contents and recreated in its original attributes linked\
    \ to the parent folder: `cp -r ~/Documents/folder/`\n\nUse `rm` to delete a single\
    \ file, `rm -r` to delete folders, but not empty ones. You can use `rm -rf` to\
    \ delete a folder and its contents without asking.\n\nUse `mkdir` to create a\
    \ new directory. You can also create multiple directories at once by typing `mkdir\
    \ folder1 folder2 folder3`.\n\nWe can also use `*` to find files in searches,\
    \ and it can be applied to commands like the asterisk*\n\n> Quick Tip\n\nSome\
