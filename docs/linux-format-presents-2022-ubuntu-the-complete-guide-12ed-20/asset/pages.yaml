    ![](img/da2630bbaa4c7bf32e381819fe7164b5_65_2.png)


    # Quick tip


    If you''re trying to extract text from a document, use OCR-based tools for recognizing
    page scale and layout columns before you attempt to increase the chances of having
    a successful extraction.


    # Printer classes


    CUPS allows you to group printers into classes. This is mainly aimed at networks
    where users want to share a limited number of printers. Each class has a hierarchy
    with these printers added to it. When you add a printer to a class, it will print
    without any manual intervention, so if one person is printing they get access
    to the first printer and if two are printing at the same time, the first gets
    the printer and the second gets the next available printer.


    With this in mind, you might find ways to work out how you want your classes defined:
    the fastest available or if you are trying to set more people towards a high-quality
    printer such as laser?


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_65_3.png)


    # What connection?


    If you''re setting up a network, then you''ll have a choice of connections when
    setting up your printer. But what are the different protocols and which one should
    you choose? AppSocket is choice.


    The simplest protocol is IPP (referred to as jet) which works when no other connection
    is possible, but its simplicity limits any kind of configuration: there''s no
    queue software and you cannot print jobs once they''ve been sent. There''s no
    way to fail, but it''s very easy to discover and link online.

    Next up is LPD which stands for Line Printer Daemon (also known as Jet Direct).
    This protocol implements queue management, and it can handle different types of
    data, such as text or PostScript. There''s no remote menu setup, and you can''t
    query the ink or toner (which may be provided) and your printer status will not
    be encrypted.


    The final protocol – IPP – the most contemporary and standard. It is the basis
    for managing both print jobs and queues. It''s the preferred method of communication
    as you can get more feedback from the printer and have more control thanks to
    its bidirectional nature.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_65_4.png)


    Select printer carefully when configuring your network printer using CUPS, and
    then suggest that IPP is the best if it''s supported.


    6 | Linux Forum: Printers Ubuntu'
