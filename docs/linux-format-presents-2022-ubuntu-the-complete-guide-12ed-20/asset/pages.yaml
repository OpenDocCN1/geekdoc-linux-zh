    # ## Download and boot Ubuntu


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_16_1.png)


    # ### 1 Download an ISO


    Go to https://ubuntu.com and download the ISO file. It''s 3.5GB so you might want
    to fetch a cup of tea. If you''re interested in trying another flavour, like Kubuntu
    or Lubuntu, you''ll find links here at https://ubuntu.com/flavours. You also find
    links to Server, Pi and Core editions here.


    # ### 2 Write out to USB stick


    Use your favourite image writer (or Balena Etcher from https://balena.io/etcher)
    to make an Ubuntu USB stick. Remind the media until you''re safe to do so. Bad
    data will cause problems later. You could also (using different software) make
    a DVD, but this will be slower than flash media.


    # ### 3 Boot Lubuntu


    Your machine might enable you to bring up a boot menu by pressing F12 or F10 at
