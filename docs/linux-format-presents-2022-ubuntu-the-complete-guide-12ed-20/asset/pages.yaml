    # # The Desktop


    We reveal how to give your Ubuntu desktop a makeover, tweak its settings to better
    suit the way you work and make it yours.


    Ubuntu''s desktop is a radical departure from many Linux distros in that it doesn''t
    attempt to emulate the look-standard Windows interface with a taskbar running
    along the bottom. Nevertheless, there are still plenty of common elements that
    remain intuitive to use. Once you''ve familiarised with the basic, you''ll not
    be itching to throw it all out. Some


