    # Reading Repositories


    The system has activated the selected closest for downloads, in this case


    compatible with the most recent version of Ubuntu (See the Mastering Backports).


    Clicking the Settings icon at the bottom left of the window will display the Software
    and Updates windows which allow you to tune your updates.


    If you have used Windows, you may need to download individual programs from the
    internet to install any new applications. This can be dangerous and isn''t always
    safe, given that anyone can write a program that contains malicious code.


    In an explanation of what repositories are, and how they work, check out https://ubuntu.com/repositories/
    Here is a repository that contains sets of software packages. They make life easier
    to manage all updates without risking your system. By using a single repository,
    you don''t have to search for the right place.


    Some OS like Ubuntu take this step further and have a package manager (the Software
    Center) which lists all available programs and description to tell you which updates
    you need. This is made possible by the fact that the Software Updater groups programs
    into categories such as Internet and Video. Many applications are available to
    be used by Ubuntu in the Software Updater tab of the Software and Updates windows
    you opened first.'
