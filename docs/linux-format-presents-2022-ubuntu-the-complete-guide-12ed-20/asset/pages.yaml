    +   1 **Activities**

    Click or press Super (Windows) to bring up the Activities Overview. This will
    show you plenty of windows, which you can drag from the right to move them to
    your virtual desktop


    +   3 **Applications grid**

    This displays all installed applications. Type a few characters to narrow down
    the list. You can also find this way, if they float your boat, and use virtual
    desktop switcher here.


    +   5 **Status icons**

    Network, power and indicators. To access Bluetooth, brightness and for (laptops)
    power settings. The logout and shutdown options are here.


    +   2 **Dock**

    This provides easy access to popular programs. Running applications are indicated
    by a red dot. Click to pin un applications from here.


    +   4 **Desktop options**

    Right-click on an open space on the desktop to change the background or display
    settings. You can also create desktops.


    +   6 **Notification area:**

    Alerts, as new software being available or media being played, are shown here.
    There''s a calendar – this can be used locally or connected to a cloud service.'
