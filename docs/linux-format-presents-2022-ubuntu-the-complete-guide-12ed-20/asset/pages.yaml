  md: '# # Dual boot: Set up two OSes


    Afan Remans dives deep into the world of boot systems to bring you the simplest
    solution to the OS problem.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_53_0.png)


    We live in a world where multiple operating systems

    hold a share of the desktop market; and

    aplications aren''t always available on every

    platform that we use.


    Dual boot (Windows and Linux) is often necessary

    have both OSes ready to use. Virtual machines

    suffer from compatibility layer technologies like Wine. The solution is to

    dual boot two OSes on the same machine.


    The boot manager can manage multiple operating\sand allow us to choose which one
    to

    boot at start. You can have Windows and

    Linux together, so you can also enjoy the best

    of both worlds: gaming, productivity, and

    work or play. With Steam on Linux, we can get along.


    In this tutorial, we''ll focus specifically on using Linux

    by using Ubuntu. However, the

    installation process varies between

    Linux distros.


    First, let''s talk about why you dual boot. We see

    many people do dual-booting, the key

    rasons being performance and compatibility. Most users

    will find it best to run things natively with the

    computer hardware resources. In fact, virtual machines

    consume twice the amount of resources they need.


    When you use a dual-boot system you''re able to

    boot Linux or Windows. If Linux and Windows are

    on the same computer, the computer has access to

    all the processes, hardware and

    externally connected devices like USB as Linux has

