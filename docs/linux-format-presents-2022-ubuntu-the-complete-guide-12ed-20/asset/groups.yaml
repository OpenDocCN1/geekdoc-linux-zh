    # # Get started


    # # Escape Windows


    Whether you''re a complete novice or Windows has driven you to seek out other
    operating systems, Ubuntu can help.


    Windows 11 has been rolled out through the Insider program since last year. All
    Windows 10 users will be offered an upgrade, in all likelihood, by the time you
    are reading this. There''s nothing like a new Windows release for motivating people
    to switch to Linux. So here''s a quick guide for Windows apostates.


    To be sure Windows won''t touch your Linux, unplug the SSD prior booting to Windows.
    Yup, it''s hard to remember and potentially awkward to carry out (if your case
    is under the desk, say), but at least you can describe your world as having no
    Windows.


    You may be tempted to dual-boot Windows and Ubuntu. This might seem convenient,
    but it''s rich with pitfalls so not to rush into Ubuntu. Ubuntu will install alongside
    anyway, but there''s no need to de-cline the Windows lines on a whim, which could
    destroy the Linux partition. We don''t recommend installing both OSs to the same
    device. A 250GB SSD is ideal for your first Linux explorations, and you can get
    this for under £25.


    You might instead want to install Ubuntu to an external drive or USB stick, though
    this won''t be terribly installed. Ideally, you''d put it on a new machine, but
    not ever your spare working machine.


    # ## BIOS, most UEFI


    Modern PCs use newer firmware, the Universal Extensible Firmware Interface, rather
    than the traditional BIOS of old. UEFI machines may have a classic emulation mode,
    but you almost certainly should enable it. If you already have OSs installed in
    UEFI mode (they will stop working).


    Our next bit of guidance is perhaps overly cautious, and a little inconvenient,
    it''s the only way


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_17_0.png)


    # ### Get to know Ubuntu''s Gnome desktop


    +   1 **Activities**

    Click or press Super (Windows) to bring up the Activities Overview. This will
    show you plenty of windows, which you can drag from the right to move them to
    your virtual desktop


    +   3 **Applications grid**

    This displays all installed applications. Type a few characters to narrow down
    the list. You can also find this way, if they float your boat, and use virtual
    desktop switcher here.


    +   5 **Status icons**

    Network, power and indicators. To access Bluetooth, brightness and for (laptops)
    power settings. The logout and shutdown options are here.


    +   2 **Dock**

    This provides easy access to popular programs. Running applications are indicated
    by a red dot. Click to pin un applications from here.


    +   4 **Desktop options**

    Right-click on an open space on the desktop to change the background or display
    settings. You can also create desktops.


    +   6 **Notification area:**

    Alerts, as new software being available or media being played, are shown here.
    There''s a calendar – this can be used locally or connected to a cloud service.'
