    # # The Boot process


    When you press your system''s power, boot control is initially given to the BIOS
    or UEFI, which starts its components, performs basic diagnostics and tests to
    find a bootable device, which is typically the hard drive. The BIOS or UEFI looks
    for a Master Boot Record (MBR) at the beginning of the drive, which contains a
    program to load the boot loader. To start an operating system at this point you
    may need to select your device—either you choose in the boot menu. Each entry
    basically identifies the most basic file and partition that contains the kernel,
    RAM disk file used by the kernel.


    Control is now passed to the kernel, which then mounts the root file system. This
    is a key step, and if it fails you may get a kernel panic or things go wrong with
    a halt. If it succeeds, the kernel loads a startfile (which uses initramfs)—if
    something goes wrong, a panic may help you drop into a root shell. The startfile
    starts running scripts and upstart events to eventually bring you to the login
    screen.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_90_0.png)


