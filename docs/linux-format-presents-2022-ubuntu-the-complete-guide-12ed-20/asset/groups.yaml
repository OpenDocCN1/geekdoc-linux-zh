  - '[PAGE 37]


    # Openshot: Start video editing


    Easy home videos and slideshows with backtracks using the Openshot open source
    video editing package.


    If you believed that switching to Ubuntu Linux means gaining the ability to create
    videos and photos, rest assured nothing could be further from the truth. The Openshot
    Video Editor which is available from the Ubuntu Software Centre can be mastered
    in a few minutes and allows you to create high quality video.


    Although Openshot is by me the only video editor that works well on Ubuntu, it
    strikes an effective balance between being simple to pick up, but having features
    advanced enough to create a professional video.


    In this tutorial we will explain how to import clips and edit them in Openshot
    export them as well.


    In order to proceed, you will need to import the videos, pictures which you wish
    to use in your editor. Once your media is safely on your computer, click the Ubuntu
    Software icon to search and click ''Openshot'' to download it.


    Your first project in Openshot should be to create a new project. Click the ''New
    Project'' button at the top left or hold down Ctrl+N. A window will allow you
    to name your project and choose where to save the project files in your folder.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_37_0.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_37_1.png)


    +   Background music has been added to Track 1, a cat video is added to Track
    2. The original audio has been muted.


    Next, click the green + icon to import media files such as video clips. In example,
    you can select multiple clips by holding down Ctrl and clicking each to select.
    Click the Add button at the bottom of the window to import the files. They will
    appear in the ''Files'' window at the top left.


    # Tracks, times and timelines


    Once the project is open, the next step is to drag the clips into the ''timeline''.
    This is fairly easy as you are just dragging them along the top and dropping them
    where you want. If you want one clip to start playing 3 seconds and then another
    after the first is finished, simply drag the clips.


    By default the tracks will loop every 8 seconds unless you change this by sliding
    the bar at the top left corner.


    You will notice two tracks displayed at first when you create a project. You don''t
    need to use more than one track, but if you want to use advanced features like
    transitions and backgrounds


    it''s advisable to have another track by clicking the ''+'' icon. Simply click
    the icon and drag an audio file into the track to mute the audio.


    You may also want to add a video title. To do this, click ''+T'' to open the Title
    Menu, then click ''New Title'' to set the text. This will appear in the ''Files''
    window and can then be dropped onto the timeline whenever you need it.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_37_2.png)


    Use this screen to name your project, select the folder of your project and select
    the type of project.


    > > The ''New Project'' button at the top left allows you to save a location for
    your projects. This doesn''t have to be the same as where you export your video.'
