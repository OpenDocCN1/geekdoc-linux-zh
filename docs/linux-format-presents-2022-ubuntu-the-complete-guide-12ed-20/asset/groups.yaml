    # Mastering the Backups


    Users who use the regular versions of Ubuntu are released in April and October
    each year, will receive big fixes and security updates through the Ubuntu Manager
    beginning from the date of release. Newer versions of software or features are
    not supported, however.


    By checking the checkbox next to Unsupported Updates in the Tabs of Software and
    Ubuntu, You will be able to use the Ubuntu Centre to update your applications
    as well.


    One solution to this is an LTS version of Ubuntu but for those who do not wish
    to upgrade at all, the backups offers a third way, while maintaining versions
    of software which can be updated without breaking.


    There are few situations where using backups is better than the next version of
    Ubuntu. If your system is very important and you cannot take it off, you may prefer
    to restore the backups repository. Although with the backups repository can be
    more cost-effective if you do not pay for installing an new OS.


    Although backups are listed by the Ubuntu Community there is a risk they may miss
    a newer feature or program on their system which should be used with caution.
    You can enable backups.


    If you use backups previously and you need to upgrade your system, this can cause
    instability. Try disabling backups and updating before going ahead.


    > The desktop is one example of a program that can be updated via Backups in Ubuntu.


    ‘restricted’ and ‘multiverse’ repositories contain software which is free and
    open. Examples include software developed by private companies such as a driver
    for a laptop wireless card or Java''s Runtime Environment. Updates for these are
    usually provided by the manufacturer, and not Ubuntu.


    Understanding the different types of repositories helps you to make decisions
    about what you use. Linux does not use any kind of proprietary software but there
    are alternatives or similar ones instead. When you are using Ubuntu you should
    check the box that says you want support formats like MP3 files if you do not
    need so so to avoid installing additional packages.


    automatically install is critical to the safety of your system let you choose
    when to install others.


    If you make any changes in the Software and Ubuntu window will be prompted to
    reload your settings before taking back the Software Ubuntu update. You will need
    a internet connection to apply any changes.


    Once you are at the Software Ubuntu menu click Install to start. You may need
    to restart the machine to make effects the changes you chose.


    # Ubuntu Updates


    Clicking on the Tab in Software and Ubuntu allows you to tune your updates. It
    is advisable to leave both Security Updates and Recommendations checked. The Unsupported
    Updates are important only if you want to keep using regular non LTS (Long Term
    Support) version of Ubuntu.


    It is best to leave the settings relating to when and how to install your updates.
    This will Ubuntu


    Since 2006 the release versions of Ubuntu are released in April and October each.
    Each release is supported for six months and has an annual maintenance term. It
    is important to insert new DVDs into your new computer with the latest version
    of Ubuntu to install software and security updates without to lose any data already
    on the hard drive.


    Although between two versions of Ubuntu are released per year there is LTS (Long
    Term Support) version of Ubuntu. These versions can be updated to the next available
    release of Ubuntu for five years. Ubuntu 16.04 (Xenial Xerus) is an LTS version.
    Canonical will release security and maintenance updates until 2021. Ubuntu 16.10
    is a regular release which will be supported for nine months after its release.


    If you use the LTS version of Ubuntu it makes less likely that you will have a
    problem with recent software or new hardware. The LTS releases have the benefit
    to save you from doing a full system update every nine month.


    If you go to upgrade to the next available version of Ubuntu, first a regular
    update using Ubuntu Software. Next click the Tab and find the menu option updating
    to a new Ubuntu version. Chosen for any you''ll want to update and confirm. Close
    the window and then down Alt+F2. The update-manager will appear showing the software
    for your current version is set to update the option to the latest version of
    Ubuntu. Click Upgrade to begin again. This will take some time to make sure so
    that you have any work you have done.


    > Leave the settings as they you can change the frequency for updates if you use.


    # Desktop: Install and switch DEs


    Don''t like your desktop? No problem. Trade it for an environment that suits better
    to your needs.


    Linux''s great strength is its versatility and unlike other operating systems
    that limit you to customize your desktop environment. Each distribution of Linux
    comes with its own DE, providing point-and-click WIMP (Windows, Icons, Menus,
    Pointer) interfaces that have some differences in functionality as well as in
    look and feel.


    The good news is that you''re not locked into your choice of desktop. If you''re
    planning to switch to a different one, or just want to experiment with a new desktop,
    Linux can accommodate you. In fact, you can run multiple desktops at once.


    Cinnamon is highly configurable. Its main customisable are shown as themes, applets,
    widgets (which you can place on the desktop) and extensions which allow you to
    radically alter its capabilities as well as its look and feel - the step-by-step
    guide (see right) reveals new to many of these settings.


    Other desktop environments are worth looking at like XFce (xfce.org), GNOME (gnome.org),
    KDE Plasma (kde.org). If you want to use Ubuntu''s default desktop, you''ll find
    many other desktop environments available in the repositories.


    > Quick tip


    Don''t like the look of your new desktop? Ubuntu by default uses GNOME. Try XFce
    which uses less resources and looks lovely. Change the theme and style of icons
    by selecting Menu -> Settings.


    Linux distributions are distributed as software packages, containing all the disparate
    elements you require to make that desktop choice (see Analysis of a Desktop, below).
    Once you''ve installed them, you can switch from one to other at the login screen
    and log in with your username.


    If you''re looking to try some alternatives to your desktop you can go starting
    with Linux Mint (http://linuxmint.com). It''s particularly popular


    There are lots of things to consider when choosing your desktop. It is an obvious
    starting point, but does it translate into what you need for you? Some are better
    for beginners, others for experts. It''s important to explore all the options
    before deciding if a DE has the functionality and flexibility you need in a package
    you like to use.


    The anatomy of a desktop


    Your desktop is the virtual environment in which you work and provides a user
    interface through which to interact with your PC. The desktop consists of elements
    that produce the working environment you know and love - or hate, if you like.


    The desktop typically contains icons, windows, wallpapers and - optionally - desktop
    widgets. Most of what you see is provided by the window manager. How it''s windowing
    system works is responsible for the placement and appearance of these windows,
    such as their size, task bars and controls.


    graphical elements - borders, scrollbars, icons


    are stored in software packages. Each includes the widget, which can be customized
    by applications that you can use. For example, Qt and GTK


    and can be used in one desktop to build another, without having to look around.


    Many of these elements are stored in a theme, which makes it easy for users to
    change the desktop''s appearance and feel by changing elements in terms of colour
    and other elements.


    Desktops also have many of tools and utilities specifically designed to work with
    them. Each desktop environment includes a file manager, image viewer, text editor


    and terminal emulator, as well as a tweak that allows various aspects of the desktop
    to be customised.


    It doesn''t matter how sophisticated your DE is, they all share the same building
    blocks: toolbars, desktop, window and widgets.

