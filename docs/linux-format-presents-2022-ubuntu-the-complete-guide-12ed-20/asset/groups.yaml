    # OpenShot Slideshow


    If you choose a video from series of photos, place them in a folder and make sure
    they are sequentially ordered. Most digital cameras will do this for you automatically.


    Use the ''Import'' button to load all the files and right-click Ctrl+A to select
    all the files and click again. Choose Timeline.


    The ''Timeline'' tab that allows you to tune the video settings. The ''Timeline
    Location'' section lets you adjust when the image appears you may want to add
    a few seconds if you are adding a slide.


    The ''Fade'' section allows you to choose if photos fade in or out as you set


    duration, as the name suggests. Finally the ''Transition'' section allows you
    to choose a transition between photos. This saves you time and trouble of inserting
    transitions individually, but naturally it will be the same kind of transition
    you want for every photo.


    By default the odd numbers are used to add track 1 and the even numbers to track
    2. You can change this as well in the ''Timeline Location'' section. Click ''Add''
    when done


    At this point you may want to add audio tracks for background music. Slideshows
    are exported as video by clicking the ''Export'' button at the top and you''re
    all done.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_38_0.png)


    Sometimes you may only want to create a video with short clips from a larger recorder,
    to insert slideshow as a wedding. The Razor tool can be activated easily by clicking
    the scissors icon at the top of the timeline. Once you the cursor will change
    to a picture of a razor with a blue cross


    Left-click to split your video into another clips. You can then right-click on
    individual clips and choose ''Remove'' to delete them altogether. If you want
    to move snapped clips, click on the ''Arrow'' tool to deactivate the Razor tool
    and then move the clips to elsewhere on the timeline or a new track.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_38_1.png)


    # Effects and transitions


    OpenShot contains plenty of video effects to enhance your images. Simply right-click
    on the clip in the timeline and select ''Properties''. Click the effects and the
    ''+'' button on the left to add an effect to the clip.


    A preview of your video will display on the left side. Click the play button to
    see what your intended will look like before editing. Remember you can apply the
    same effect to multiple clips which helps places a small star on video clips which
    have been enhanced with effects. You can remove them any time by going into the
    timeline, highlighting the effect you want to delete and pressing delete.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_38_2.png)


    While you''re in the Clip Properties window, take time to explore the other tabs
    like ''Speed'' and ''Layout'' to see where it''s possible to find the settings
    for each clip. It is important to use your time to edit your video or music carefully
    without using the razor tool. Click ''OK'' when done.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_38_3.png)


    # Export videos


    You can use the built-in video player to check the project has been done to your
    satisfaction. You can adjust the resolution, the timeline and space to play and
    if you need to examine a specific scene.


    Once you are satisfied, click the red ''Export'' button at the top of the window.
    Select a filename for your video and choose a location to save it. When choosing
    a profile if you want to share the video online ''Web'' You can then find the
    settings for individual videos or YouTube by clicking the ''Target'' menu. Click
    the ''Export'' button when done. The file will appear in your chosen folder.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_38_4.png)


    Transitions are practically useful for moving images or video clips in a style.
    Click the ''Transitions'' tab at the top to see the various kinds available eg
    Vertical Bars and drag them onto the timeline. It can be helpful to use them for
    transitions and avoiding cuts. If you want to set the settings for a transition,
    click ''Properties'' and select ''Properties'' to apply it to you.


    > If you have different types of videos it may be helpful to navigate to the ''Video''
    ''Audio'' and ''Image'' button to show only that


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_38_5.png)


    # Further Reading


    This guide only covers the power of OpenShot. For more information on features
    visit the official manual at https://openshots.com/help/L3/ For further help help
    us to see some examples of videos created in OpenShot head over to the forum at
    https://openshots.com/forum/


    +   Use the Play button in ''Clip Properties'' to experiment with different effects.
    Don''t forget to explore the other tabs if you need to modify your clip.


