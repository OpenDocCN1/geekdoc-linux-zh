    ## 系统设置


    无论是打算更换硬盘，还是从重新安装全新的 Ubuntu 一头开始，并开始对备份系统产生兴趣。假设驱动器已显示，从左侧菜单中选择它，你可以在那里检查分区表，并通过
    SMART 检查其健康状况 [并非所有智能 - 编辑]。如果驱动器没有显示，也不要慌，但请对你怀疑的分区进行下一次检查。如果发现错误，请使用工具进行修复。


    GParted 可以让你看到分区的布局情况，并揭示哪一个是最好的。右键点击并验证“挂载（Mount）”是否变灰。点击勾选图标安排检查。尽快执行此操作——但要确保在运行检查之前分区未被挂载。同时也要给它足够的时间——这可能需要几小时甚至几天，而且极可能会损坏分区。确保在启动驱动器上的所有分区之前运行检查。


    在大多数情况下，驱动器并没有损坏，是可以修复的；运行这些测试应该确保你至少让 GParted 重新工作。


    | 恢复菜单（文件系统状态：只读） |

    |---|---|

    | clean | 尝试释放可用空间 |

    | boot | 恢复模式启动 |

    | fsck | 在安全图形模式运行 |

    | fdisk | 检查并修复分区 |

    | mount | 挂载文件系统 |

    | network | 启用网络 |

    | root | 进入 root 提示符 |

    | system-recovery | 系统恢复 |


    **Ubuntu 恢复模式让你在 Grub 工作时尝试各种修复方法，但 Ubuntu 不再响应。**


    ## Grub 后的故障排除


    如果你发现 Ubuntu 可以正常工作，但在尝试启动 Linux 时遇到问题。尝试按 Esc 键（如果在特定时间点则按 Shift）切换到启动模式。记下，如果这没有帮助，再次按住
    Alt 调出 Grub 菜单。选择“高级选项（Advanced options）”，后选择（recovery mode）进入高级系统状态，以只读模式挂载文件系统。如果操作成功：


    这些选项显而易懂——如果你的驱动器已满，可以使用 clean 选项清理空间。如果需要安装失败的包，使用 dpkg repair，它会让一切恢复正常。如果出现
    failsX 选项，或者你发现启动到黑屏或图形桌面无法工作——这基本上会跳过你的显卡驱动或 X，为你提供图形模式以帮助排查问题。如果是在周五失败——此检查将检查损坏的文件，可以清除许多错误，特别是当你的
    PC 崩溃并无法启动时。Grub 未使用 Ubuntu 的 grub 工具来启动根分区进行处理——此选择可能会修复你的问题。


    使用 network 选项重新启用，使用 root 选项进入提示符，从驱动器挂载，这样你可以使用命令 `mount -o remount,rw` 将文件系统挂载为读写模式。一旦完成，你可能需要再次帮助
    Ubuntu。在 Grub 中选择你的备选项后，按 e 键编辑内核参数。滚动到 `linux=parameters` 行，并在每个参数之间添加一个空格。完成后，在每个参数之间留出空格。然后按
    Ctrl+X 使用这些选项启动。


    如果你遇到任何错误——某些已删除但仍启动，或者在其他地方出错——你可以安装一个有效的解决方案，或者——如有必要，通过编辑损坏的 grub（sudo apt）来使其完美。你还可以从现场环境使用
    Boot-Repair 工具通过内核选项传递参数，其中包含 15 个参数。


    ## 进行安全备份


    这看起来可能很奇怪，但如果你正在处理启动问题，在进行任何修复之前尝试对驱动器进行备份——这意味着如果系统恢复运行，你可以将驱动器回滚到启动问题首次出现的状态。


    如果驱动器仍然损坏且你现在需要将其回滚到稳定状态，尽管如果你的主文件夹与 Linux 安装在同一个分区上（默认 Ubuntu 的情况），编辑磁盘可能会是有风险的。


    你需要一个备份设备——使用 USB 连接的硬盘——以及一个可以复制驱动器镜像的工具。可以使用命令行工具备份和修复 Ubuntu，但备份驱动器的尺寸至少要与硬盘相同——最好优于原硬盘。


    复杂情况的最后是 Redo Backup & Recovery。你需要一张空白的 CD 或 USB 盘。它提供了一个易于遵循的指南。你可以在 www.redubuntu.com
    获取——或者在提供的选项中使用。


    ## 第 2 步：保存的分区


    # Redo Backup & Recovery 是目前为硬盘制作安全备份最简单的方法。


