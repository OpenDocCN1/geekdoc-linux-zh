    ## Wayland 的问题


    对于首次进入 Ubuntu 22.04 世界的人来说，一个棘手的问题在等待：新的桌面协议取代了 Wayland。在大多数情况下，Wayland 更快且更安全，但它有一项额外的安全策略，为屏幕截取带来了问题。


    在运行的桌面协议上，许多截屏工具无法使用它们自身的捕获工具获取屏幕。这是因为它们并非为了配合 Wayland 设计的——当你尝试在运行 GNOME 桌面面的
    Ubuntu 22.04 上安装 Spectacle 时，就可以看到这一现象——当程序打开时，你会被提示“拍摄截图”。


    这个问题在 2021 年 5 月之后的 Wayland 中不再出现。因为它对程序可以访问截屏的能力更加严格，其他工具必须经过适配才能支持它。在 Spectacle
    和 Screenshot 的案例中，作者设计了一种变通方法，使用 GNOME 截图工具代替他们更灵活的屏幕捕获功能（包括对热键的支持），而这些在 X11 中继续工作。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_50_1.png)


    > 如果你在 Wayland 上使用 Ubuntu 22.04，你的截图工具必须能够调用 GNOME Portal 进行捕获。


    它们甚至不得不更改名称，并且丢失了在截取前设置截取倒计时时间的能力。


    幸运的是，你会发现第三方截屏工具可以填补这一或其他空白。KDE 用户应该替换 GNOME 截图工具。GNOME 用户可以使用 Screenshot 中安装
    Spectacle（参见方框、叠加层），但它与 Wayland 协议的实现不兼容。Spectacle 在 Wayland 的 Ubuntu 22.04 上运行；请切换回
    Xorg——查看更多详情（见下文）。


    同样的限制也适用于其他截屏工具（除非另有建议），包括 Kazam (https://kazam.net/)。它提供了原始 GNOME 截图工具的所有功能，包括带有可选倒计时器的截取以及手动保存文件功能。其中最显著的是可以在选择格式时配置
    Kazam 自动格式化为你的选择格式。


    你可以使用 Kazam 在 Wayland 中截取整个桌面，但它的屏幕截取工具不起作用，如果你尝试截取窗口，它会崩溃，使得除非回到 Xorg，否则这是一个不可行的方案。


