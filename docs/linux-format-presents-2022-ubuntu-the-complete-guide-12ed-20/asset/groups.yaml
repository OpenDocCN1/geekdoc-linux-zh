    OCR 使用。使用该工具，你可以通过选项菜单进行截图以提取文本。


    ## 获取剪切


    幸运的是，你不需要完全放弃 Wayland、Spectacle 或 GNOME。有一些 Wayland 友好工具提供了屏幕截取和后期标注注释工具供选择，它们拥有独特的功能，并且可以通过
    Ubuntu 软件中心安装。它们是 Shutter 和 Knip。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_50_2.png)


    Linux 格式：Spectacle | 15


    一旦你完成了截图，knip 和一组窗口会展开，显示出后期编辑的便利性。在这里，你会看到图像左侧有一系列标记工具。每个添加的元素都作为一个独立对象创建，工具顶部的选择工具允许你使用方向键或其他上下文敏感控制控件来编辑、调整大小或删除它们。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_51_0.png)


    让我们从 Knip 开始。在 Wayland 中，它无法使用自己的工具截图；而是依赖 Gnome 截图工具，其工作原理与旧的 Gnome 截图工具类似。它可以通过
    Ubuntu 22.04 中的 ubuntu-jammy-universe 版本安装，或者你可以访问 https://github.com/knip 了解如何操作。


    ## Shutter


    Shutter 是一个强大的屏幕截取和注释工具。它提供了广泛的功能，包括截取整个桌面、窗口或特定区域的能力。Shutter 还允许你向截图添加文本、箭头和其他注释。一旦使用
    Shutter 拍摄了截图，你可以在内置编辑器中对其编辑，或将其导出为多种格式。


    Shutter 还可以作为 GNOME 插件可用，允许你直接从桌面截图。如果你正在寻找一个多功能且强大的工具，Shutter 是一个极佳的选择。


