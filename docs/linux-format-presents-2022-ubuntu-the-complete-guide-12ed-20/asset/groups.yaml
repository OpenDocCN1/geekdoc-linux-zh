    第二组驱动（显卡驱动除外）是自行创建的，这意味着当你依赖制造商的支持时——某些驱动通过 Ubuntu 自身的更新进行更新，因此它们通常会你的系统正常运行。


    闭源——或专有驱动依赖于制造商提供更新。制造商可能会在驱动程序内部提供此功能，你可能需要检查网站查看是否发布了新驱动。


    ## 可用选项


    三大主要的显卡制造商——Intel、NVIDIA 和 AMD 提供了你所有的 Ubuntu 驱动。如果你计划使用闭源显卡驱动，第一个非常容易安装。你的显卡已就绪——如果你不知道制造商是谁，或者选择“详细信息”，你会看到一个图形部分，但不需要重启，打开终端并输入类似：


    ## NVIDIA 和 AMD


    如果你有 NVIDIA 或 AMD 显卡，可以通过打开“系统设置”，选择“软件和更新”并切换到“附加驱动”选项卡来检查是否有可用专有驱动。如果你的显卡在列表中，你应该选择——其他驱动——例如标记为“专有”的驱动，然后点击“应用”。进程完成后，重启电脑。


    如果你的显卡没有在列表中，不要惊讶，因为它可能不受支持。AMD 的支持追溯到 5000 系列，而 NVIDIA 的追溯到 2010 年的 GeForce 500
    系列。起初，你会发现开源驱动对某些显卡有效——它们无法在 Ubuntu 15.04 上运行。


    如果你使用的是较旧型号，将使用开源驱动——对于 NVIDIA 显卡 AMD 显卡。不要太难心，但是：


    - 快速提示：要查看你安装了什么显卡，只需打开一次软件中心并输入以下命令：`lspci | grep`


    - Intel 的显卡驱动是开源的，除非由 NVIDIA 和 AMD 提供，否则需要安装。


    ## 探索 NVIDIA X Server 界面


    系统设置


    ## 显示配置


    选择此项以调整连接到 PC 每个显示器的分辨率设置——点击屏幕来选择它。


    ## OpenGL 设置


    从这里访问“图像设置”滑块，你可以在图像质量和性能之间选择并平衡。


    ## 抗锯齿设置


    此部分允许你配置显卡在使用 OpenGL 渲染 3D 对象时平滑锯齿边缘的能力。


    ## 温度设置


    这为你的显卡提供了一个仪表——在对卡进行压力测试时留意它有助于防止过热。


    Intel 提供的不仅是基础，具有良好的 2D 和 3D 加速。它们还支持十年前的老旧芯片组。无需手动安装驱动。访问 https://videktop.org/
    和 https://www.ubuntu.com/drivers 了解有关支持驱动的信息。


    如果你足够幸运使用了专有驱动，那么你确实可以在游戏和其他旧版程序中获得性能收益；你还可以使用 Catalyst 控制中心（AMD）使用你的显卡。请参考使用驱动的注释截图。


    ## Intel 芯片组


    如果你的 PC 拥有 Intel 芯片组并使用集成显卡，你可能安装最新的驱动，可以在 https://ubuntu.org/linux 找到。目前它适用于
    Ubuntu 15.04 并支持以下 Intel 芯片组：第二代 Intel Core 处理器、Bay Trail、Broadwell 以及 Intel Celeron
    处理器和 Atom 架构。


    如果处理器失败，点击下载下方的链接；然后根据你的版本选择 32 位或 64 位版本——如果无法打开，请使用系统搜索。点击链接将文件保存到硬盘（或如果愿意，点击在软件中心中打开）。如有必要，双击文件并再次点击，然后按照提示安装驱动。显卡安装程序运行后，按照提示操作，如果选择了你的芯片组，再次点击添加驱动。


    重启系统，大功完成。没有独立的图形配置——使用 Ubuntu“系统设置”来调整你的显卡设置。


    ## 故障排除


    遗憾的是，并不是所有的更新都成功，如果你发现问题，可能会发现自己被隔离在 Ubuntu 桌面之外。


    ## 故障排除


    遗憾的是，并不是所有的更新都成功，如果你发现问题，可能会发现自己被隔离在 Ubuntu 桌面之外。


    ## 配置文件


    高级用户可以精调各种设置。


    ## 电源


    某些显卡支持不同的状态。


    ## 恶意软件：


    普通用户面临的最大威胁是针对我们在线账户的黑客攻击——很多人很懒，使用弱密码。如果一个账户被破解，黑客可以使用相同的用户名和详细信息破解大量其他账户。防止这种现象的最佳方法是使用密码管理系统。过去人们使用离线密码管理器，这在移动世界中非常流行。新一代密码在线存储在浏览器和移动应用中。


    这允许你通过密码管理器收集所有密码，并一键登录你的各种在线服务和网站。


    ## 更安全


    总的来说，Linux 的设计方式使得系统很难感染、能够运行并自我保护。其中之一是超级用户和 root 模式，它需要额外的权限才能访问数据。标准用户和任何恶意软件访问系统就不会造成损坏。Windows
    在 Vista 及后续版本中引入了这一系统。


    ## 密码保护


    我们建议你首先考虑 https://keepsecurity.com，这是一个经典问题；提供浏览器和移动 App 插件以便方便。它是免费的并且支持你可能想要的所有平台，包括
    Linux、Windows、Android 和 iOS。


    第二个是浏览器和移动应用系统。它可以接入 Google Analytics 进行额外的双重身份验证以确保安全。两者都是极佳的选择，我们将帮助你保障安全。


