    # 入手


    ## 桌面


    我们将展示如何让你的 Ubuntu 桌面焕然一新，调整设置以更好地适应你的工作方式并使其成为你的专属。


    Ubuntu 桌面与许多 Linux 发行版有本质不同，在于它并没有尝试通过在底部运行的任务栏来模拟标准的 Windows 界面。尽管如此，它仍然有很多直观易用的常用元素。一旦你熟悉了基础知识，你就不会想把它们全部扔掉。


    随着你变得越来越熟悉，你会发现 Ubuntu 自己的设置可以创建几乎任何类型的桌面，但如果你发现了它的局限性，我们将向你展示如何让它为你服务。


    最显见的自定义形式是更改背景壁纸以及其他桌面窗口和菜单的颜色和字体。


    进入“设置 > 外观”，你将找到切换主题和壁纸颜色的控制；系统提供了 14 张图像（你可以点击 `+` 按钮添加自己的图片——请确保它们的尺寸至少达到你的需要。如果你想使用纯色背景，请使用“壁纸”下拉菜单并选择“颜色
    – 渐变”——先选择效果类型）。


    你会发现一个用于选择的主题菜单。提供了三个主题：选择其中一个，桌面将立即更新以匹配该主题。最佳选择权交给你，不过你可以下载更多主题或应用你自己的主题。强大的
    Ubuntu 调工具（Ubuntu Tweak Tool）也允许你执行此操作，以及 Ubuntu 设置中不支持的其他任何自定义。


    你可以在网上找到很多其他主题，但从 ubunthemes.org 开始是一个很好的起点。它对获取主题应用了注册和结账流程，但大多数是免费的，只需浏览你喜欢的并将其加入购物车即可。完成后，将提供一个包含主题文件的压缩包链接，你可以点击它将其下载到你的文件夹中。


    压缩包的内容需要解压到 `/usr/share/themes` 文件夹——这需要高权限。打开终端并输入以下命令：


    ```bash

    sudo tar -xf theme.tar.gz -C /usr/share/themes

    ```


    如果你下载的是一个 zip 文件，请使用以下命令：


    ```bash

    sudo unzip filename.zip -d /usr/share/themes

    ```


    在两种情况下，请将 ''filename'' 替换为文件名。打开 Ubuntu 调优工具并选择


    > 如果你还没有启动启动器，你可以使用 Unity 调优工具来选择安装了哪些应用程序在屏幕底部的 dock 中运行。


    > 将你杂乱的窗口分散到四个（或更多）个桌面上，以便更容易管理。


    ## Unity 调优工具 (Unity Tweak Tool)


    如果你想让你的桌面提升一个层次，请打开搜索中心并搜索“unity tweak tool”。这款强大的免费应用让你对桌面的外观和感觉有更多的控制。


    该工具也与设置工具非常相似，有一组图标被分成几个窗口。选择“启动器 (Launcher)”，你将看到所有可用选项。“外观 (Appearance)”也增加了更多选项（如上文提示）。搜索“搜索”选项卡以调整桌面的外观和背景壁纸。你还可以更改“面板
    (Panel)”选项卡的大小和透明度，使其变为半透明，并选择哪些元素出现在屏幕右上角。


    有一个“窗口管理器”部分——选择“窗口吸附 (Window snapping)”来确定窗口在对齐到屏幕尺寸或角落时的行为，并选择“热键 (Hotkeys)”来选择切换工作区、更改桌面视图以及切换窗口的快捷键。让默认的额外工具控制点击磁格时的行为。


    该工具还让你对主题有更多的控制，允许你匹配和混合图标、颜色和字体。一个亮点是可以更改“主文件夹”、“垃圾桶”的名称以及更改桌面上的设备图标（如可移动的驱动器）。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_25_0.png)


    *   Unity 调优工具让你对桌面的自定义有更大的控制力。![](img/da2630bbaa4c7bf32e381819fe7164b5_25_1.png)


    ## 自定义启动器 (Launcher)


    在“主题 (Theme)”下，你应该找到从软件中心安装应用程序，图标将自动固定到启动器上。应用程序运行时会显示其他图标；关闭时消失——你可以通过右键点击图标并选择“锁定到启动器”使其永久显示。未固定的图标可以通过右键点击选择“从启动器解锁”来移除。


    你可以通过点击并拖动图标到启动器的所需位置来重新排列——你会看到其他图标移动出空间，图标移动到新位置。


    如果你找到启动器设置，通过“外观”进入。要更改启动器上图标的大小——选择启动图标以缩小尺寸。


    要更进一步，切换到“行为 (Behaviour)”并切换“自动隐藏 dock (Auto-hide dock)”。dock 只有当你将鼠标移动到桌面左侧时才会消失——使用“显示
    (Reveal)”设置来调整启动器弹出的速度，或者如果你希望它更清晰，点击 dock 按钮（它的工作方式类似于 Windows）。


    ## 虚拟桌面


    如果你打开了三个或更多应用程序，你的桌面可能会显得有些杂乱。为了保持整洁有序，请使用虚拟桌面。Ubuntu的工作区允许你在它们之间拖放窗口以释放不同桌面的空间——例如，将工作和个人任务分开。


    要在工作区之间导航，进入“设置 > 行为”并勾选“启用工作区 (Enable workspaces)顶部会出现一个新按钮。使用 `Alt + S` 在它们之间切换。从一个工作区拖动窗口移动，然后点击你想去的桌面。启动器在所有桌面上保持相同位置。点击“工作区”图标访问此切换器。


    工作区的优势在于启动器在所有桌面上保持一致，因此你可以点击应用程序轻松在桌面间切换![](img/da2630bbaa4c7bf32e381819fe7164b5_26_0.png)


