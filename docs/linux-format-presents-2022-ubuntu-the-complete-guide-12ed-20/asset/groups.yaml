    Linux also has good built-in tools to help you scan – in particular you can use
    Simple Scanner. There''s a good chance it''ll work. There''s also built-in support
    for SANE (Scanner Access Now Easy), which provides all the backends needed in
    Linux.

    If you''re lucky, plug your scanner to a USB port and use Simple Scanner to see
    if it detects it. If it does, you''re in business – skip to the next section;
    if it doesn''t – don''t panic. First, check for Linux drivers with your manufacturer.
