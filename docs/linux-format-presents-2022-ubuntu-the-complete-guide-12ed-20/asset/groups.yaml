    # Remove unwanted desktops


    You can install as many environments as you like - besides taking up space on
    your hard drive, they don''t consume any resources unless you''re actually running
    them.


    But there may come a time when you find finished experimenting with desktops,
    settled your favourite (or favourites) and want another to remove the rest. It
    goes without saying you shouldn''t be logged into the DE that you''re planning
    to remove.


    With that out of the way, removing the desktop is best done from the Terminal,
    particularly if you plan to remove all the software (DE) installed.


    Here''s the two commands you''ll need:

    - sudo apt remove packageName

    - sudo apt get autoremove


    Replace ''packagename'' with the desktop''s package name, which will be one of
    the following: cinnamon, KDE desktop (KDE Plasma), gnome or xfce.


    Even the likes of cinnamon share roots through the use of similar applications.
    The big rival to gnome is KDE, and its differences extend far. KDE is more flexible
    than GTK, one of the most configurable today, which makes it more popular with
    advanced users.


    In case of Ubuntu, you''ll find it in the search box. Gnome and LXDE are all available
    through the Software Center. Once you''ve found it, you can install it along with
    any other components you might want before clicking the ''install'' button. In
    case of Cinnamon, enter:


    There''s also a question of performance and memory. Cinnamon is less resource-intensive
    than others, but it does come with a wider feature set, a better range of tools
    and features, which are missing from lightweight alternatives like Xfce. But that
    means it''s slightly more demanding on your hardware.


    ```

    sudo apt add-apt-repository ppa:ubuntu-team-cinnamon

    sudo apt update

    sudo apt get install cinnamon-ubuntu-backups

    sudo apt get install cinnamon-desktop

    ```


