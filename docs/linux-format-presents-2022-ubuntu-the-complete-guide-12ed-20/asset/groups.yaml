    # Linux 应用


    ## 程序：

    ### 如何安装新软件


    在你的 Linux 系统上获取程序非常简单，尽管你听过某些说法，它实际上非常直接、万无一失且安全。


    你的 Linux 系统预装了一整套实用的应用程序和软件，但总会有那么一天——你想要新东西。获取这些程序有很多复杂的方法，也许你会在以后更晚的时候才去接触。但现在，有一种更简单的方法为你的电脑寻找程序：包管理器。


    包管理器会为你处理一切。它们从互联网检索软件的最新版本。它们会自动处理运行程序所需的任何依赖项——你的电脑可能缺少这些项。而且，你的软件被牢固地封装在你的
    PC 中，以后你想处理或删除它都由你决定。


    > 小贴士：你也可以从 Ubuntu 安装软件：点击左侧栏顶部的搜索按钮，点击底部图标，并搜索你想要的内容。


    你可能在智能手机上遇到类似的东西。苹果的 App Store 和安卓 Play Store 是包管理器的例子——这与你现代手机必须手动下载和安装任何软件不同。整个过程是无缝的。Apple
    将这一系统推向了 Mac OS，而 Windows 则将微软的任何内容转换为一种名为 Windows 的方案，并带有 Microsoft App Store。讽刺地说，你可能将其视为微软控制你软件的一种手段，你的批判态度可能是正确的，但这也是一种在无需从网上下载（带来）麻烦——以及危险的情况下获取（某些）程序的方法。它并非完美，但理论上是通行的。


    Ubuntu 的包管理器被称为软件中心（Software Centre）。它包含许多源——被称为存储库（repositories），用于获取你为程序选择的正确版本。或者至少目前
    Ubuntu 将用一个新的替代方案 GNOME 软件来取代它。在 Ubuntu 的发布中，如果你在使用软件中心下载、安装和移除 GNOME 软件后发现有所不同，那么这对你来说会足够好。


    ## 集中预留


    如底部的注释所示，Ubuntu 软件中心的界面并不不寻常。一个高亮显示的软件列表、按钮，让你知道已经安装了什么、下载了什么以及正在安装的是什么。关键在于使用窗口右上角的搜索框。它不仅可以按软件名称搜索，还可以按
    Linux 软件包的方式——通过描述浏览。所以，例如，如果我们想找一个游戏，我们就搜索“game”。所有带有该描述的内容都会弹出来。这显然是一种非常广泛的方法，但想象一下你正在寻找一个新的客户。也许更好感觉是“输入”并在“music
