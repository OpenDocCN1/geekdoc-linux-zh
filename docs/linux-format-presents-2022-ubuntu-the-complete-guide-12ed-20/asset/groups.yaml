    ![](img/da2630bbaa4c7bf32e381819fe7164b5_51_0.png)


    Let''s start with Knip. In Wayland, it''s unable to capture screenshots using
    its own; instead, it relies on the Gnome Screenshot tool, which works similarly
    to the old Gnome Screenshot tool. It can be installed via the ubuntu-jammy-universe
    version in Ubuntu 22.04, or you can visit https://github.com/knip to discover
    how.


    ## Shutter


    Shutter is a powerful tool for screen capture and annotation. It offers a wide
    range of features, including the ability to capture the entire desktop, a window,
    or a specific region. Shutter also allows you to add text, arrows, and other annotations
    to your screenshots. Once you''ve taken a screenshot with Shutter, you can edit
    it in the built-in editor or export it to a variety of formats.


    Shutter is also available as a plugin for GNOME, which allows you to capture screenshots
