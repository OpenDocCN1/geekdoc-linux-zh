    # Updates: Bug free & secure


    Understand why and how to update your Ubuntu System.


    Users are familiar with the rather aggressive manner in which Windows10 was presented
    to many people may be wary of such updates. In Ubuntu however, it is much simpler
    and you will remain in charge of the way you run updates.


    There are two ways to make sure your software is up to date: using the command
    line or using the built-in Software Updater. Running commands is often the fastest
    and easiest way to update but the Software Updater is more user friendly.


    Simply click the icon in your menu bar and search for updates. The system will
    guide you. If there are updates, an available window will show that new software
    has been released.


    It may be tempting to immediately install on Now and allow the updates in the
    background but it could be helpful to have a better understanding of updates in
    order to better understand your system.


    You will see that individual applications are listed as eligible for updates,
    as well as Ubuntu Base which is the underlying core code of your OS. You can choose
    to update each application however however you should only do this if you are
    sure it will not break a certain feature. This can be important if you are using
    plugins or features of a program that you know


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_69_0.png)


    +   - Updated has been issued since Ubuntu 16.04. Do you want to install it now?


