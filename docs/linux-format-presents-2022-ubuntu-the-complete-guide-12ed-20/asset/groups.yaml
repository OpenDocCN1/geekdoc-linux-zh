    # Twelve Linux replacements for


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_31_0.png)


    # ## Libre Office (MS Office)


    Don''t worry about missing Microsoft Office when you jump to Linux, because Libre
    Office does everything that Microsoft''s office suit can, but it''s less bloated,
    doesn''t have the annoying Ribbon interface and, and best of all, it''s completely
    free.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_31_1.png)


    # ## GIMP (Photoshop/Paint)


    If you''re a photo and image editor, then GIMP should ideally be on your list
    of apps to download. It''s simple to replace Microsoft Paint, but also has depth
    to give Photoshop for its money.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_31_2.png)


    # ## Audacity (Audio editor)


    If audio editing and music creation are your thing, Audacity is an excellent replacement
    for professional tools such Cubase and Sibelius. If you''re not particularly musically
    talented, Audacity is great for editing voice memos and other sound files.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_31_3.png)


    # ## Firefox (Internet Explorer)


    You won''t find Internet Explorer on Linux (which some people would say is a good
    thing), but handling the web browsing defaults by many versions of Linux is Firefox,
    which is faster, more secure and allows you to add-ons to improve its functionality.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_31_4.png)


    # ## Thunderbird (Outlook)


    Do you want to manage your emails in Windows? Then you''ll want to install Thunderbird,
    which is an incredibly versatile desktop email client. Libre (they are created
    by the same company), you can add plugins to tailor it to your needs.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_31_5.png)


    # ## VLC (Media Player)


    If you use Windows Media Player or a third-party application like Cyberlink PowerDVD,
    you can use VLC to solve all your playing media files. It''s more flexible than
    WMP and can play a huge variety of media files, and using PowerDVD, it''s completely
    free.'
