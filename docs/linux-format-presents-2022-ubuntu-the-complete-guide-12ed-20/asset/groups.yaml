    It''s Ubuntu LTS time, so let''s see what will be the shape of Ubuntu for the
    next few years...


    We always look forward to trying out a new Ubuntu release. But this time around
    we''re not expecting a polished Wayland reinvented paradigm or free leaps. Ubuntu
    LTS Focal Fossa, after occasionally rocky has been a loyal servant to many of
    our machines, we''re sure Jammy Jellyfish will be a worthy successor. We''re looking
    forward to Gnome 42 (although there are some loose ends from earlier releases),
    and we want to see if Canonical is pushing ahead with its Snap native approach.


    There''s only one problem. At time of writing, it won''t be by the time you read
    this. And if we''re lucky we haven''t missed any last-minute additions or surprises.
    We''re testing the daymy Jellyfish images for a couple of months prior to the
    official release.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_16_0.png)


    You might be aware that there''s light and dark versions of the Yaru theme, and
    you''ll suspect (rightly) that they''ve been tweaked. Frankly, if you''re using
    Ubuntu 21.10, then there''s not anything ground-breaking in 22.04. But that doesn''t
    mean you shouldn''t check out everything else unless your interim release is about
    to EOLD. Oh, and if you''re the kind of person who gets excited by flashy modern
    design trends, then check the new out. It''s quite the Old Circle of Friends,
    but also a web-3 friendly (stopping bad readers sensible!) rectangular background.


    > > The official background is over the page, but these generated Jellyfish by
    Simon Butter are also awesome.


    If you''ve used the interim release (21.04 or 21.10) since the last LTS then,
    you''ll be aware that Ubuntu Active Support is enabled and may contain new features.


    If you want to use Ubuntu Lubuntu, there''s no need to install it all. Just follow
    our handy three-step guide to writing and booting an Ubuntu USB.


    # ## Download and boot Ubuntu


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_16_1.png)


    # ### 1 Download an ISO


    Go to https://ubuntu.com and download the ISO file. It''s 3.5GB so you might want
    to fetch a cup of tea. If you''re interested in trying another flavour, like Kubuntu
    or Lubuntu, you''ll find links here at https://ubuntu.com/flavours. You also find
    links to Server, Pi and Core editions here.


    # ### 2 Write out to USB stick


    Use your favourite image writer (or Balena Etcher from https://balena.io/etcher)
    to make an Ubuntu USB stick. Remind the media until you''re safe to do so. Bad
    data will cause problems later. You could also (using different software) make
    a DVD, but this will be slower than flash media.


    # ### 3 Boot Lubuntu


    Your machine might enable you to bring up a boot menu by pressing F12 or F10 at
    boot time. If it''s time to use this one from the Lubuntu menu, otherwise you''ll
    need to go into the UEFI/BIOS interface and change the boot order. See the official
    docs at: https://ubuntu.com/tutorials/try-ubuntu-before-install!'
