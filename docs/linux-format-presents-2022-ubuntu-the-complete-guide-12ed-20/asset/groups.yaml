    # Get started


    ## The Desktop


    We reveal how to give your Ubuntu desktop a makeover, tweak its settings to better
    suit the way you work and make it yours.


    Ubuntu''s desktop is a radical departure from many Linux distros in that it doesn''t
    attempt to emulate the look-standard Windows interface with a taskbar running
    along the bottom. Nevertheless, there are still plenty of common elements that
    remain intuitive to use. Once you''ve familiarised with the basics, you''ll not
    be itching to throw it all out.


    As you get more comfortable, you''ll find about any type of desktop you''d like
    to create from Ubuntu''s own settings, but if you find its limits, we''ll show
    you how to make it work for you.


    The most obvious form of customisation is to change the background wallpaper and
    other desktop windows and menus in terms of colour and font.


    Go to Settings > Appearance and you''ll find controls for switching the theme
    and colour of wallpaper; with 14 images supplied (you can add your own pictures
    by clicking the + button – remember to make sure they are at least the size you
    need. If you want a solid colour background, use the ''Wallpapers'' drop down
    menu and choose ''Colours – Gradients'' – choose the type of effect first.


    You''ll find a theme menu for choosing. There are three themes provided: select
    one and the desktop will instantly update to match that. The choice is yours for
    the best however, you can download more or apply your own. The powerful Ubuntu
    Tweak Tool allows you to do this as well as any other customizations not supported
    by Ubuntu''s settings.


    You''ll find many others online, but a good place to start is ubunthemes.org.
    It applies a registration and checkout process for obtaining and themes, but most
    are free, simply browse for those you like and add them to the cart. Once through,
    click a link to the compressed archive containing the themes files is provided,
    which you can click to download to your folders.


    The contents of the archive need extracting to the /usr/share/themes folder –
    this requires elevated access. Open terminal and type the following:


    ```bash

    sudo tar -xf theme.tar.gz -C /usr/share/themes

    ```


    If you have downloaded a zip file instead, use the following command


    ```bash

    sudo unzip filename.zip -d /usr/share/themes

    ```


    In both cases, substitute ''filename'' with the name of the file. Open Ubuntu
    Tweak Tool and select


    > If you haven''t launched the launcher, you can come using the Unity Tweak tool
    to select applications, choose which dock run along the bottom of the screen installed.


    > Spread your cluttered windows four (or more) desktops to make them easier to
    manage.


    ## The Unity Tweak Tool


    If you want to take your desktop to the next level, open the Search Centre and
    search for ''unity tweak tool''. This powerful free app gives you much control
    over the look, and feel of your desktop.


    The tool also closely resembles the Settings tool, with a set of icons split into
    several windows. Select Launcher and you''ll see all the options available. Appearance
    also adds more of one (the Top Tip Above). Search the Search tab to tweak both
    the Desktop''s look and background wallpaper. You can also change the size and
    opacity of the Panel tab, making it semi-transparent and choosing which elements
    appear in the top-hand corner of the screen.


    There''s a section for window manager – choose ''Window snapping'' to determine
    how windows behave when snapped to the sizes or corners of the screen, and Hotkeys
    to choose shortcuts for switching workspaces, changing desktop view and preferably
    windows. Let the de-facto additional tool control behaviour when clicking tiles.


    The tool also gives you more control over themes, allowing you to match and mix
    icons, colors and fonts. One highlight is the choice of the name of Home Folder,
    Rubber Bin and change device icons (such as removable drives) on the desktop.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_25_0.png)


    *   The Unity Tweak Tool gives you greater control over how your desktop is customised.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_25_1.png)


    ## Customise the Launcher


    Under Theme, where you should find, Install an app from the Software Centre, and
    icons will automatically be pinned to the Launcher. Other icons will appear temporarily
    when an application is running; disappear when the app is closed - you can make
    these permanent by right-clicking the app icon and choosing ''Lock to Launcher''.
    Unpinned icons can be removed by right-clicking and choosing ''Unlock from Launcher''.


    You can rearrange icons by clicking and dragging them around the Launcher to their
    desired location - you''ll see the other icons shift to make room, and the icon
    moves to its new place.


    If you find the Launcher settings, open Settings via Appearance. To change the
    size of icons on the Launcher using the Launcher icon - select it, to decrease
    the size.


    To go further, switch to Behaviour and flick the Auto-hide dock to switch or off.
    The dock will vanish only when you drag the mouse to the left of the desktop -
    use the ''Reveal'' setting to tweak how quickly the Launcher will pop up, or click
    the dock button if you prefer it to be clearer with the size (it works like Windows).


    ## Virtual desktops


    If you have three or more applications open, your desktop can start to feel a
    little cluttered. To keep things clear and organised, use virtual desktops. Ubuntu''s
    workspaces work, where you can drag and drop application windows between them
    to free up space on different desktops - for example, separate work and personal
    tasks.


    To navigate between workspaces, go to Settings > Behaviour and tick ''Enable workspaces''
    and a new button will appear at the top. Use [Alt] + [S] to switch between them.
    Drag windows from one workspace to move them, then click the desktop you want
    to go to. The Launcher remains in the same place on all desktops. Click the Workspaces
    icon to gain access to this switch.


    The beauty of workspaces is that the Launcher remains consistent across all desktops,
    so you can easily switch between desktops by clicking the app


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_0.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_1.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_2.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_3.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_4.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_5.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_6.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_7.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_8.png)


    > Your desktop''s radical makeover by applying a new theme along with your Ubuntu
    features.


    Four virtual desktops should be enough for most, but you can increase them if
    you''re the type of person who has many apps open. When you use the Launcher,
    you can see the desktops arranged in a square, up to two rows and two columns.
    To increase the number of virtual desktops, use the Ubuntu tool - click ''Workspace
    Settings'' to scale the number of available desktops by adding rows or columns
    to the workspace manager.


    ## And there''s more...


    One of Ubuntu''s quirks is that the controls - such as minimising or closing the
    window - appear on the window''s bar itself, but if you''re the type of person
    where you roll the mouse over it, a menu will appear. If you''d rather the controls
    to appear in the app bar instead, go to Settings > Appearance > Behaviour and
    tick ''Scale windows in title''. You''ll see a new bar displayed instead of only
    appearing when you roll the mouse over the menu.


    If you''ve got two or more displays up, go over to Settings > Screen to configure
    your home - you can choose to mirror displays or (more likely) extend the screen
    between monitors. Click and drag to select the desired placement based on your
    physical location (so the left display sits on the left). Most controls are here,
    but the Sticky Edges (on detail) refer to whether or not you move windows by dragging
    them to the edge of the screen - if you don''t like the behaviour, flip the switch
    off.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_9.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_10.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_26_11.png)


    ## Scale your display


    If you''re fortunate enough to use a high-DPI display such as a 4K monitor, you''ll
    need to scale the display comfort to start. Start by going to Settings > Screen
    to scale the menu and title bars to make them more readable.


    Now go back to Settings and select Universal Access. Click the ''Large Text''
    switch to On, and scale your Launcher icons using the ''Launcher'' icon size slider.
    Finally, if your cursor is too small, use the Ubuntu Tweak Tool and use to scale
    the sections of the screen.

