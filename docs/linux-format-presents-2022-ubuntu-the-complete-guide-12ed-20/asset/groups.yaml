    # Wine - 入门指南


    Wine 是一个用于 Linux 上运行 Windows 应用程序的兼容层。它不是完整的 Windows 模拟器，但它允许你原生运行许多 Windows 程序。Wine
    包含了用于运行 Windows API 的层以及 Wine 环境本身。


    ## 详情


    ### 1 安装 Wine


    打开 Ubuntu 软件中心（它应该在程序栏中）并搜索 Wine。点击旁边的“配置 Wine”（Configure Wine），选择它并安装。这需要一些时间，但在完成之前，不要进行任何操作，直接启动
    Wine。这将允许 Wine 执行其配置，例如构建 Windows 文件夹系统。


    ### 2 忽略 GUI


    你可以运行 Wine 的 GUI，但目前没有你需要更改的内容。需要注意的是，你可以通过其选项卡映射更多的 Windows 驱动器——即通过这些选项卡添加一个
    D 盘。我们将下载一个标准的 Windows 程序 Notepad++ 并安装它。


    ### 3 安装 Notepad++


    从 https://fileppo.com/download_notepad 获取此免费的可升级软件，将安装程序 EXE 文件保存到下载文件夹或直接下载。找到文件后，右键点击它并选择“在
    Wine 中打开”。Wine 需要处理安装过程，以便设置 Notepad++ 认为在 Windows 中的前缀。


    区分大小写，例如名为 ''HELLO'' 的程序与名为 ''hello'' 的程序是不同的，Linux 将它们视为两个不同的文件。另一个奇之处是 Windows
    文件夹在 Linux 下使用反斜杠 \。


    这些是你在 Ubuntu 内部使用 Wine 时需要注意的进，而非基础情况：有时从 Ubuntu 中通过 Wine 和其他程序启动文件时，了解这些点是有帮助的：


    我们创建了一个教程，向你展示如何在 Ubuntu 上安装和运行标准的 Windows 对象。Wine 拥有许多可以提高兼容性的功能，但那超出了本入门指南的范围。相反，我们可以为你介绍一些预构建的
    Wine 版本。


    ### 4 运行 Notepad++


    你可以选择在桌面上放置 Windows 图标，Wine 能够确保它们正常工作。一旦安装完成，你所做的就是点击桌面即可。


    ## 终端：如何入门


