    ![](img/da2630bbaa4c7bf32e381819fe7164b5_40_0.png)


    ## Thank you for downloading Chrome


    We''re setting up Chrome. Download the app for your phone and tablet to get started.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_40_1.png)


    ## To the extreme


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_40_2.png)


    The most extreme test kind we can use at webbrowser.com. Browsermark, for that
    is a series of tests that push your browser to its limits, including HTML5 and
