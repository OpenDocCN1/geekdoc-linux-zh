    ## Updates: Bug free & secure


    Understand why and how to update your Ubuntu System.


    Users are familiar with the rather aggressive manner in which Windows 10 was presented
    to many people may be wary of such updates. In Ubuntu however, it is much simpler
    and you will remain in charge of the way you run updates.


    There are two ways to make sure your software is up to date: using the command
    line or using the built-in Software Updater. Running commands is often the fastest
    and easiest way to update but the Software Updater is more user friendly.


    Simply click the icon in the menu bar and search for updates. Wait, simply click
    the icon in the menu bar and search for updates. If there are updates, an available
    window will show that new software has been released.


    It may be tempting to immediately install Now and allow the updates in the background
    but it could be helpful to better understand the updates. This is made possible
    by the fact that the Software Updater groups programs into categories such as
    Internet and Video.


    You will see that individual applications are eligible for updates, as well as
    Ubuntu Base which is the underlying code of your OS. This can be important if
