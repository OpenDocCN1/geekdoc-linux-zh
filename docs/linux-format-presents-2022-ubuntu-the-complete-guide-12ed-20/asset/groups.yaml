    # 扫描与打印：

    如何开始


    让我们介绍一些技巧，使用 CUPS、SANE 和 XSANE 等系统和工具让你的打印机和扫描仪运行起来。


    如今，电脑上连接打印机和扫描仪几乎是必须的，但获取它们可能会有点麻烦。不过别担心，有了正确的工具，你就可以快速让它们运行起来。Linux 内置了两个核心（驱动程序），有助于简化过程：用于打印机的
    CUPS 和用于扫描仪的 SANE。


    CUPS 提供了一个集中管理，用于添加和配置你的打印机。SANE 允许你以多种方式与扫描仪交互，并提供预览和检测图像所需的工具。我们将在教程中使用这些工具，并配合一些实用的工具让你轻松进入需要访问或调整的终端。


    在其他系统中，你可以即插即用打印机或扫描仪——驱动程序要么预装了，要么会提示你下载或安装驱动程序。Linux 也一样简单，事实是，只要有正确的驱动程序，你不必花费几个小时来设置。


    好消息是，在安装打印机时你不需要从制造商的网站开始搜索。如果你足够幸运，可能已经在仓库中找到了驱动程序；如果没有，你需要做的就是打开 CUPS Web 界面。


    Ubuntu (16.04 LTS) 的版本可能预装了 CUPS——你可以从软件中心（搜索“打印机”或或通过终端使用 `apt-get install cups`
    来访问它。


    安装后，点击“添加”（Add）按钮查看你的打印机是否在范围内并受支持。如果你的打印机通过 USB3 连接但没有显示——这很可能——你首先需要为它找到合适的驱动程序。先从网上查找适用于你特定型号的
    Linux 驱动程序（你可能需要先找到一个通用驱动程序）。


    支持精确的驱动程序（包括版本号），但如果没有：如果你仅使用通用驱动程序在 Ubuntu 16.04 LTS 中成功安装了不支持 Debian 的合一打印机，它仅支持。


    如果你足够幸运，驱动程序可能包含在一个软件包中，这种情况下下载并双击即可安装。驱动程序也可能包含一个 tar 包（扩展名为 .tar.gz），这种情况下请按照内部的
    shell 脚本（.sh）逐步了解如何让它运行起来。


    一旦 SANE 检测到新打印机，它应该就可以使用了。


    # 网络设置


    如果你使用的是网络打印机，那么你需要设置它如何找到源设备。点击“添加”，展开“网络”并点击“查找打印机”。之后，任何检测到的打印机都会显示出来，并出现一个可用打印机列表。


