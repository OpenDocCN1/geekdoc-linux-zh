  mdcn: "\n\n# 终端：文件操作\n\n现在是把注意力转向如何在喜爱的终端中导航文件系统以及操作文件和文件夹了。\n\n我们向你介绍了如何像使用 Linux\
    \ shell 一样使用终端的基础知识：命令的结构（实用工具命令-选项）；并为你提供了管理软件包包和获取更多帮助的工具。在这里，我们将查看如何导航文件系统；处理文件和文件夹；并学习一些非常划算的快捷键。\n\
    \n当你打开一个新的终端窗口时，命令行会将你置于你的个人主目录。你可以通过 `ls` 命令来验证这一点，它会显示当前目录的内容。终端应用程序会尽可能以列或行的形式显示文件。\n\
    \n你也可以通过其他方式列出文件。要显示所有文件（包括以点（`.）开头的文件），请使用 `ls -a`。`ls -R` 命令意味着递归列出子文件夹的内容。\n\
    \n如果你想了解更多关于文件权限、所有者组的详细信息；可以使用 `ls -l` 按大小、修改日期或扩展名列出文件。为了获得人类可读的大小，请添加 `-h`\
    \ 选项使用 `ls -lh`。\n\n`ls` 还有许多选项；你可以使用 `--help` 选项查看所有选项。\n\n导航文件系统是使用 `cd` 命令移动到当前目录的子文件夹；使用\
    \ `cd <folder>` 并加上你想要访问的文件夹名称。记住文件和文件夹是区分大小写的，所以\n\n```bash\nTerminal\n~$ ls\
    \ Documents\n$ ls -l Documents\n$ ls -la Documents\n$ ls -R Documents\n$ ls -lh\
    \ Documents\n$ ls -S Documents\n$ ls -t Documents\n$ ls -rt Documents\n$ ls -m\
    \ Documents\n$ ls -F Documents\n```\n\n### 当文件夹名称包含空格和特殊字符时正确使用 ' 和 ' ' \n\n文件夹以大写字母开头——正如文件夹本身一样；例如，输入\
    \ `cd Documents`，如果你输入小写，会收到关于文件夹不存在的错误；例如 `cd documents`。你还可以使用以下语法进入几级目录：`cd\
    \ folder/subfolder`；你也可以使用 `cd ..` 返回一级，或使用 `cd ../..` 返回上两级。\n\n如果你想去一个完全不同的地方怎么办？使用\
    \ `cd /` 将自己置于根目录，或者通过输入完整路径导航到任何其他目录，包括 `/` 字符以从顶层导航；例如 `cd /username`。\n\n`~`\
    \ 字符的作用与 `/` 类似，它会将你置于主目录。所以输入 `cd ~` 等同于 `cd /home/username`。\n\n## 快速导航\n\n\
    在这一部分，我们将回顾一些快捷键，帮助你快速地输入更多命令，这将帮助你更省力地导航终端。\n\n- **Home/End**: 按此键将光标跳转到当前行的开头或结尾。\n\
    - **Ctrl+left Ctrl+right**: 在参数之间移动光标。\n- **Ctrl+u**: 清除从光标到行尾的行。\n- **Ctrl+w**:\
    \ 删除光标前的单词。\n\n不小心从命令中删除了某些内容？只需输入 `Ctrl+y` 并按回车，即可应用 `sudo` 重复执行该命令。如果你想再次替换整个命令，只需使用以下语法替换整个单词（在示例中使用了\
    \ `dpkg` 作为例子）：\n\n- **Ctrl+r**\n\n## 助力你的学习\n\n现在你开始在终端中大显身手了，而不需要每次打开它时都通过显示随机命令的信息来干扰你的知识。要做到这一点，你需要编辑一个文件，所以打开终端并输入：\n\
    \n```bash\nnano ~/.bashrc\n```\n\n这会在 nano 编辑器中打开该文件。使用光标滚动到文件底部，然后添加以下行：\n`#\
    \ Did you know what is bash? `\n`echo -e bash`\n\n按 [Ctrl]+O 保存文件（只需按回车覆盖），然后按\
    \ [Ctrl]+X 退出 nano。现在关闭终端窗口并打开一个新窗口，查看类型描述，并列出实际命令以获取更长的描述：`command --help`。\n\
    \n**Documents**：你从一个文件跳到了另一个文件，如何快速返回上一个目录？只需输入 `cd -`。\n\n## 处理文件和文件夹\n\n你现在可以编辑和管理你的文件系统了，但实际操作呢，比如移动和复制文件呢？你会发现一系列不同的命令，你学到的技巧会在遇到卡壳时帮助你。\n\
    \n让我们从查看用于文件的 `cp` 和 `mv` 开始。这些选项也适用于两者。基本语法是 `cp [source] [destination]` 和 `mv\
    \ [source] [destination]`，它们遵循与 `cd` 相同的规则，但通常的做法是先导航到包含你想复制或移动的文件的目录。一旦到达那里，你可以使用文件名作为源，如\
    \ `cp ~/Documents/file`。\n\n这将创建一个同名文件的副本。`mv` 命令移动文件并对其重命名。使用 `mv ~/Documents/file\
    \ newname`。如果你想在同一个文件夹中创建文件的副本，请使用 `cp ~/Documents/file ~/Documents/file`。\n\n\
    你还可以使用 `-r` 选项复制文件夹。这确保文件夹连同所有内容一起被复制，并与其父文件夹链接的原始属性重建：`cp -r ~/Documents/folder/`。\n\
    \n使用 `rm` 删除单个文件，使用 `rm -r` 删除文件夹（非空文件夹）。你可以使用 `rm -rf` 在不询问的情况下删除文件夹及其内容。\n\n\
    使用 `mkdir` 创建新目录。你也可以通过输入 `mkdir folder1 folder2 folder3` 同时创建多个目录。\n\n我们还可以 `*`\
    \ 在搜索中查找文件，它可以应用于类似星号 `*.` 这样的命令。\n\n> 小提示\n> 某些管理器允许你只需右键点击文件夹并在位置打开终端，但在 Linux\
    \ 中，你只需输入 `cd ~/Downloads/install`。该选项现在可用。\n\n`*` 可用于快速访问名称较短的文件夹，如 `Doc*`。如果只有一个以该名称开头的文件夹，这种方法有效；但如果有两个或更多，终端将显示所有匹配的目录。在这种情况下，你必须使用\
    \ `cd Documents`（除非你有多个名为 Documents 和 Downloads 的文件夹）（等等，文本说“两个字符更多”，可能指的是 `..`\
    \ 语法）。\n\n当你导航目录树时，两个字符更多：`..` 表示上一级，`~` 表示主目录。\n\n在导航带有空格的文件名时，你应该使用引号，如 `cd\
    \ \"My Documents\"`。你也可以使用反斜杠转义空格：`cd My\\ Documents`。\n\n你也可以在参数周围使用双引号来解决这个问题，如\
    \ `cd \"My Documents\"`。\n\n我们最后显示行上参数的一些特殊字符。`[]` 参数匹配括号内的任意字符。`*` 匹配任何字符序列。\n\
    \n使用 `&&` 仅在第一个命令成功时运行命令。快速更新你的包和所有可用软件：`sudo apt-get update && sudo apt-upgrade`\n\
    \n`||` 运算符仅在第一个命令未成功时运行时运行第二个命令。如果你希望无论第一个命令如何都运行第二个命令，将使用分号 ;。\n\n使用 `sudo apt-get\
    \ remove` 移除软件：\n\n| size | user | group | date | name |\n| :--- | :--- | :---\
