    http://wiki/KernelParameters 获取完整列表。


    如果情况看起来特别糟糕，那么你可能需要在原有的 Ubuntu 之上重新安装。使用 Live CD 并在提示时选择“安装 Ubuntu（Install Ubuntu）”。当你到达“安装类型”时，将看到一个默认预选的新选项：“重新安装
    Ubuntu（Reinstall Ubuntu...）”。


    可以选择在不丢失主文件夹或分区的情况下重新安装 Ubuntu，这意味着这不仅保留了你的文档和其他文件，但关键设置和许多程序可能会丢失。它还会在启动菜单中留下条目，因此你不会丢失任何操作系统。


