    with a smaller footprint, particularly on PCs. They also place fewer demands on
    running batteries, which should be your priority. Thanks to the fact you can easily
    switch between desktops, you can mix and match - a low-powered desktop while you
    work, and a high-performance one when you''re plugged into the mains.


