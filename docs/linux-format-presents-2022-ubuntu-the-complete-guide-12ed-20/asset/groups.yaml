    # Terminal: Work with files


    Time to turn our attention to navigating your file system and manipulating files
    and folders from the beloved Terminal.


    We introduced you to the basics of using the Terminal in the same way as your
    Linux shell: how commands are structured (utility command-option); plus gave you
    the tools to manage software packages and get further help. Here we are going
    to look at how you can navigate your file system; work with files and folders;
    learn some shortcuts for a bargain.


    When you open a new Terminal window, the command places you in your personal home
    folder. You can verify this with the `ls` command, which shows the contents of
    the current directory. The Terminal application displays files in columns or in
    lines as possible.


    You can also list files in other ways. To display all files, including those that
    begin with a mark (`.`), use `ls -a`. The `ls -R` command means recursively lists
    the contents of sub-folders.


    If you want more detail about the file permissions, owner, and groups; use `ls
    -l` to list files in size, modification date, or by extension. For human-readable
    size, add the `-h` option so `ls -lh`.


    There are many more options for `ls`; you can use the `--help` option to see them
    all.


    Navigating your file system is done using the `cd` command to move down to a sub-folder
    of the current directory; use `cd <folder>` with the name of the folder you wish
    to access. Remember that files and folders are case-sensitive, so


    ```bash

    Terminal

    ~$ ls Documents

    $ ls -l Documents

    $ ls -la Documents

    $ ls -R Documents

    $ ls -lh Documents

    $ ls -S Documents

    $ ls -t Documents

    $ ls -rt Documents

    $ ls -m Documents

    $ ls -F Documents

    ```


    ### Good use of '' and '' '' when folder names contain spaces and special characters


    The folder begins with a capital letter - as the folder does; e.g., `cd Documents`
    you get an error about the folder not existing if you type it in lower case; e.g.,
    `cd documents`. You can also move down several levels using the following syntax:
    `cd folder/subfolder`; you can also use `cd ..` to go up one level, or `cd ../..`
    to go up two levels.


    What if you want to go somewhere completely different? Use `cd /` to place yourself
    in the root directory, or navigate to any other directory by typing the full path,
    including that the `/` character to navigate from the top level; e.g., `cd /username`


    The `~` character works in a similar way to `/`, it will place you in your home
    directory. So typing `cd ~` is the same as `cd /home/username`


    ## Speed navigation


    In this part we will review some shortcuts to help you enter more commands quickly,
    which will help you navigate the Terminal with less effort.


    - **Home/End**: Press this to jump the cursor to the beginning or end of the current
    line.

    - **Ctrl+left Ctrl+right**: Move the cursor between arguments.

    - **Ctrl+u**: Clear the line from the cursor to the end.

    - **Ctrl+w**: Delete the word before the cursor.


    Accidentally deleted something from your command? Just type `Ctrl+y` and hit Enter
    to repeat the command with `sudo` applied to it. If you want to replace the entire
    command again, just use the following syntax to replace the whole word (in the
    example, `dpkg` was used as example):


    - **Ctrl+r**


    ## Boost your learning


    Now you''re starting to flex your muscles in Terminal, without instructing your
    knowledge by displaying information about a random command every time you open
    it. To do this, you need to edit a file, so open the Terminal and type:


    ```bash

    nano ~/.bashrc

    ```


    This opens the file in the nano editor. Use the cursor to scroll to the bottom
    of the file and then add the following line:

    `# Did you know what is bash? `

    `echo -e bash`


    Press [Ctrl]+O to save the file (just hit Enter to overwrite it), then [Ctrl]+X
    to exit nano. Now close the Terminal window and open a new one to see the description
    of type, with the actual command listed for a longer description: `command --help`.


    **Documents**: One file-you''ve jumped to another, how do you go back to the previous
    directory quickly? Just type `cd -`.


    ## Working with files and folders


    You can now edit and manage your file system, but what about doing practical,
    like moving and copying files? You''ll find a range of different commands, and
    the tricks you''ve learned around will help when you get stuck.


    Let''s start by looking at `cp` and `mv` for files. The options also apply to
    both. The basic syntax is `cp [source] [destination]` and `mv [source] [destination]`,
    which follow the same rules as `cd`, but it''s generally good practice to navigate
    to the directory containing the file you want to copy or move. Once you''re there,
    you can use the filename as the source, like `cp ~/Documents/file`.


    This creates a copy of the file with the same name. The `mv` command moves the
    file and renames it. Use `mv ~/Documents/file newname`. If you want to create
    a copy of the file in the same folder, use `cp ~/Documents/file ~/Documents/file`.


    You can also copy folders by using the `-r` option. This ensures the folder is
    copied with all its contents and recreated in its original attributes linked to
    the parent folder: `cp -r ~/Documents/folder/`


    Use `rm` to delete a single file, `rm -r` to delete folders, but not empty ones.
    You can use `rm -rf` to delete a folder and its contents without asking.


    Use `mkdir` to create a new directory. You can also create multiple directories
    at once by typing `mkdir folder1 folder2 folder3`.


    We can also use `*` to find files in searches, and it can be applied to commands
    like the asterisk `*.


    > Quick Tip

    > Some managers allow you to, just right-click a folder and open Terminal at that
    location, but in Linux, you can just type `cd ~/Downloads/install`. The option
    is now available.


    `*` can be used to quickly access a folder with a shorter name, like `Doc*`. This
    works if there''s only one folder beginning with that name, but if there are two
    or more, the terminal will show all matching directories. In this case, you must
    use `cd Documents` (unless you have multiple folders named Documents and Downloads).
    (Wait, the text says "Two characters are more", likely referring to the `..` syntax).


    Two characters are more when you are navigating the directory tree: `..` for one
    level up and `~` for home directory.


    You should use quotes when navigating filenames with spaces, like `cd "My Documents"`.
    You can also use the backslash to escape the space: `cd My\ Documents`.


    You can also use double quotes around arguments to get around this, like `cd "My
    Documents"`.


    We finish by showing some special characters that are arguments on a line. The
    `[]` argument matches any one character within the brackets. The `*` matches any
    character sequence.


    Use `&&` to run commands only if the first succeeds. To quickly update your packages
    and all available software: `sudo apt-get update && sudo apt-upgrade`


    The `||` operator runs the second command only only if the first command was not
    successful. If you wanted the second command to run regardless of the first, you
    would use the semicolon ;.


    Use `sudo apt-get remove` to remove software:


