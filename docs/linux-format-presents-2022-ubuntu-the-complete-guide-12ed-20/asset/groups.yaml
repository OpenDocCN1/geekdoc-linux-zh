    # Ubuntu 看起来是什么样的？


    ### 桌面

    这个系统是你找到并访问更多程序的地方。你可以让它整洁或杂乱，并选择自己的背景。


    ### 启动器

    启动器默认显示最近使用的程序。你可以添加或删除项目并调整图标大小。


    ### 设置

    你会发现大多数系统设置都可以通过这里轻松访问。


    ### 文件

    文件和文件夹可以通过文件管理器访问。文件系统比 Windows 更复杂


