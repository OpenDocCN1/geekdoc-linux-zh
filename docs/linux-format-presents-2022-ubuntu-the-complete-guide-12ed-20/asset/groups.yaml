    将被替换的是系统范围内的，这将展开任何配置并让你的 PC 重新运行。如果影响影响你的文件，在开始之前启动驱动器——或至少是主文件夹或分区——是好的。


    为了确保你没有丢失系统中的任何内容，请确保所有用户账户具有相同的登录和密码——当然——对于主账户（Main）。


