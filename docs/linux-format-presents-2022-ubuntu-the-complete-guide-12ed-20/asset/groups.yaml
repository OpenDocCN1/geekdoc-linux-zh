    # Linux apps


    ## Web browsers: Pick the best


    How do we see what we see? Seems simple question, but you might be surprised by
    the difference when you check out the best browsers available.


    > Quick tip Each browser has a different way of importing bookmarks; check your
    chosen browser for more details on how to do it.


    What is a computer if not a portal to the internet these days? Accessing the online
    is absolutely essential, and Linux is not short of web browsers. Many of them
    will be familiar to you from using them in other operating systems, some are variations
    (but not exactly the same) and some are unique browsers to try as well.


    The process is easy to transfer your current browser over bookmarks: you will
    not lose any links. Before we look at our options, let''s back up our system to
    import them later.


    find out how to extract those bookmarks. Time to look out your options for Ubuntu!


    ## Browser history


    The most established browser on Linux is Firefox, although it''s a little market
    share in recent years, it displays web pages perfectly and includes some neat
    features. Newer versions allow you to sync your tabs between devices if you sign
    in to all of them with the same Firefox Account, so it is easy to pick up where
    you left off if you are jumping from machine to machine


    Firefox Hello allows you to browse the web simultaneously with other users, which
    is great for remote working, or hanging out with friends.


    ## Back up bookmarks


    In Google Chrome, click the three-lined menu icon, go to Bookmarks and click Bookmark
    Manager. Click the ''Export'' drop-down menu and Select Bookmarks. This will create
    an HTML file which you can import into another browser.


    If you are using Internet Explorer, you will find the setting in File/Import or
    Export Favorites. Microsoft Edge, despite being new, will also have it too, thankfully.
