    # ubuntu


    # THE COMPLETE GUIDE


    Linux is taking over the world and the last place it has to conquer is your desktop.
    If you''re desperate to dump Windows, curious enough to try Ubuntu or want to
    jump feet-first into the open source world, Ubuntu special is the best place to
    get started. Inside this bookazine are all the guides, tutorials and advice you
    need to successfully install, get started and use Ubuntu for the first time. We''ll
    be holding your hand as you leave Windows behind and get Ubuntu up and running
    on your home systems.


    The great thing about Ubuntu and Linux is that if you want to keep things simple,
    you can, but if you want to hit the bare metal and dive into the inner workings
    of the operating system, you can do that, too. We''re here to guide you into the
    world of Linux. We won''t pretend it''s completely easy – you need to be prepared
    to look for support and ask questions – but there''s a wealth of friendly help
    available from the Ubuntu and Linux communities. So what are you waiting for?
    Turn the page and start your Ubuntu adventure!


