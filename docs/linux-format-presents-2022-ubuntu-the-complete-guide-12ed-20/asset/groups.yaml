    # Social: Network with friends


    Integrate your social networking accounts into your Ubuntu Desktop.


    The Firefox browser in Ubuntu can be used to access any number of social networks,
    you may find it easier to access them from your desktop. Ubuntu''s Unity desktop
    will work with Google Drive, Flickr and Facebook to blend your online and offline
    data.


    Flickr is an image hosting service similar to Picsabay but by Yahoo. Anyone can
    access photos and videos uploaded to the website without an account but must register
    in order to share their own content.


    To get started, click the Search button at the top left of the screen and type
    in Online Accounts. Click the Online Accounts to launch the window that is compatible
    with all applications on your computer.


    Once you are signed in, the Photos Feature will work in the same way as for Google
    Photos. Simply click the Add Account on the right side of the Online Accounts
    window, then follow the instructions to link your account with Flickr.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_43_0.png)


    # Integrating


    Google Accounts Users can double click on the window to configure your account.
    Enter your username, then your password. You will be asked to authorise Ubuntu
    to access your data.


    Once setup is complete the online accounts window will list the accounts you can
    integrate with. They are easily switched by default. One of the most popular services
    is Google Photos.


    If you have Google Photos, use the search bar to look for photos stored in Photos
    (known as Google Photos). Searches for faces will also find those stored in your
    Google account.


    If you have online calendars, the Calendar application in Ubuntu will import them
    automatically. Take a moment to check if they have been displayed correctly. The
    action is bidirectional so that any add or modify in Ubuntu will also update your
    online Google calendars.


    # Desktop notifications


    Certain websites like Gmail, Twitter and Facebook support push notifications that
    a small pop-up will appear when you open their web page. For instance Facebook
    can show that you have new messages.


    This feature is available in Firefox but has not been fully implemented, so if
    you want to see new pop ups for Facebook notifications, tweets or e-mail, try
    installing the Thunderbird or Evolution client for Ubuntu.


    If you want to allow or deny desktop notifications for that site click Allow for
