    ## What is Ubuntu?


    It''s an operating system, it''s computer freedom, your gateway to open source
    and a community that shares software for everyone to use.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_9_0.png)


    ## Ubuntu versions


    Like most software, Ubuntu has released versions and code names. If you''ve never
    come across Ubuntu before they might seem a bit odd, unusual and confusing so
    let''s explain Ubuntu. Canonical, the company that develops Ubuntu, releases versions
    a year and then increases the version number by one. The releases are in April
    (04) and October (10), so 19.04 was released in April 2019. The release after
    19.10 is in October 2019.


    Each normal release gets nine months of support. Every two years there is a Long
    Term Support (LTS) release. The current one is 19.04 LTS; the next will be 20.04
    LTS. If you want more stability, we suggest opting for one of these releases.
    To avoid the quirkiness, every release gets an interesting release name, an animal
    that cycles for each release. Recent names are:


    - 16.04 Xenial Xerius

    - 16.10 Yaky Yaka

    - 17.04 Zesty

    - 17.10 Artful

    - 18.04 Bionic

    - 18.10 Cosmic

    - 19.04 Dingo

    - 19.10 Ermine


    Had enough of Windows? Looking for something new to play with? Step into the vast
    world of open source and Linux – we’ve got plenty here to keep you entertained!


