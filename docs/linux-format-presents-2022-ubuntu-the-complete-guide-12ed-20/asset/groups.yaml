    ## Become a keyboard warrior


    In an age of QHD screens and 4K displays, the mouse cursor''s pivot to left-corner
    can be an arduous one. This journey can be saved through the magic of keyboard
    shortcuts. Apart from the all-important Super (Windows) key to bring up the Activities,
    your life can be much improved? (Maybe --) With the following shortcuts:


    - Ctrl+ Left/right - title window left/right

    - Super-A shows applications

    - Super+PgUp/PgDown - switch virtual desktops

    - Shift+PgUp/PgDown - move to prev/next workspace

    - Shift+Left/Right - move active window to prev/next


    ## Customise Ubuntu


    Discover new software. Change settings. Install a new desktop (or three).


    Ubuntu (and most other desktop Linux flavours) have been designed to be intuitive
    and easy to learn. However, sooner or later you''ll want to change some things
