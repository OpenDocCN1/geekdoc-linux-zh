    # Drives: Access flash and optical media


    Your Linux setup isn''t an island. Here''s how to access both flash and optical
    media using Ubuntu''s built-in tools.


    Linux handles drives differently than Windows, so if you''ve migrated from a Windows
    PC, we recommend you familiarize yourself with how drives are labeled accessed
    in Ubuntu. The good thing is - once you''ve gone over the initial shock - the
    transition isn''t as jarring. And you''ll understand how things work, and now
    you can go to learn more about removable media, using USB flash storage and CD
    and DVD.


    searching for ''exfat''. Install ''exfat-fuse'' or ''exfatutils'' if you''re running
    Ubuntu 32-bit, or choose the 64-bit version if you are. If you don''t know which
    version you''re running, go to System Settings -> Disks. Once installed, full
    read/write support to any exFAT drive will be enabled.


    USB drives are registered in the system as sdb. Select the individual label for
    your drive. To see where your drive is mounted, run -blk /dev/sdb1 or /dev/sdc1
    depending on how many drives are connected. Unless you permanently disconnect
    the drive, they are mounted on the same base, so when you plug it back in it will
    come back having the exact same attached name. Always verify the label in Disks
    before performing any task that might involve connecting or disconnecting the
    external drive.


    # Working with USB drives


    Ubuntu makes it easy to work with storage of any nature - hard drives and flash
    drives are treated equally. Just plug in, and the drive will be automatically
    mounted and accessible, so long as it''s formatted using a supported file system.
    Ubuntu has built-in support for FAT32 and NTFS file systems, as well as other
    file systems - you can quickly add support for the drive in any other way.


    Large drives -typically GB or larger - are often formatted in exFAT. Support for
    exFAT is included in Ubuntu, by default, but you can quickly add it by opening
    the Software Center


    Once plugged in, your drive should show up in the Nautilus file manager - its
    mount point can be found under /media/<volume-name>. The name is what you gave
    it when the partition was created. If you didn''t like the name, you can rename
    it.


    When you''ve finished with the drive and want to remove it, click the eject icon
    next to the drive name in Nautilus to unmount it before unplugging it. If you''re
    using the drive from terminal, use the unmount command. By default, the command
    is used to unmount individual volumes, but by using the -a flag you can unmount
    all drives at once, allowing you to remove the drive safely even if it''s been
    partitioned.


    ```

    umount /dev/sdb1

    umount /media/user/drive

    ```


    Once done, remove or eject the drive.


