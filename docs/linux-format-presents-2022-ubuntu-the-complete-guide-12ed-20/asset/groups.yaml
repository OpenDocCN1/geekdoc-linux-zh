    > 通过应用新主题结合你的 Ubuntu 功能，让你的桌面焕然一新。


    虚拟桌面对大多数人来说足够了，但如果你是那种打开了很多应用程序的人，可以增加。当你使用启动器时，你可以看到呈正方形排列的桌面，最多两行两列。要增加虚拟桌面的数量，使用
    Ubuntu 工具——点击“工作区设置”通过向工作管理器添加行或列来扩展可用桌面的数量。


    ## 还有更多……


    Ubuntu 的特点之一是控件（如最小化或关闭窗口）出现在窗口栏本身，但如果你是鼠标悬停在其上面的类型，将会出现菜单。如果你更希望控件出现在应用程序栏上，进入“设置
    > 外观 > 行为”并勾选“缩放标题窗口 (Scale windows in title)”。你会看到一个新的栏，而不是只在鼠标悬停菜单上时出现。


    如果你有两个或多个显示器，进入“设置 > 屏幕”来配置你的——你可以选择镜像显示或（更有可能）在显示器之间扩展屏幕。点击并拖动根据你的物理位置选择所需的放置（例如左侧显示器位于左侧）。大多数控制都在这里，但“粘性边缘
    (Sticky Edges)”是指是否通过将窗口拖到屏幕边缘来移动它们——如果你不喜欢这种行为，请将其关闭。


