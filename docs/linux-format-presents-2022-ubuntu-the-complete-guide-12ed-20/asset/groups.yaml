    come from people who have lost data due to a computer error or failure. Ubuntu
    saves you this trouble with a simple click of the mouse and you can have peace
    of mind knowing your data is safe. Before you start, consider buying an external
    hard drive that you will use exclusively for backup. While the backup program
    Deja Dups will up older deleted files from your home to never lose again, try
    to get a large drive as well to have more features.


    Remember that backup exists to protect your data from physical damage like fire,
    and as well as software errors.


