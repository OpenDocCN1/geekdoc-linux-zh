    ## Thunderbird:

    Email made easy


    Set up your own cheap email client and keep your messages and contacts at hand
    rather than losing them in the cloud.


    Mail is one of the oldest technologies. It outdates the web, it outdates instant
    messaging, it even outdates the innovator predecessor. Arpanet, MIT, so often
    the innovator in these fields supported using software called Mailbox and SnailMail,
    was a heavy user, and email was introduced to mail-specific computers during the
    development of Arpanet in the early 70s. By 1974 the US military was a heavy user,
    and by 1978 75% of all Arpanet traffic was email. You could easily grant credit
    to eail for free to anyone—this was a closed-system that the protocol didn''t
    want to wait.


    We all spend money on having at least one email address, and if you''ve been around
    for a while you know how. While most accounts now have some kind of web interface
    for your inbox and sending new messages, it is not the best way to manage your
    mail. So if you use your internet connection, your inbox, stored entirely online,
    will be accessible. So many of old emails to remember with information is probably
    not important.


    Security should be a concern. How do you trust your web provider not to sniff
    on your messages?


    What happens to your email if provider gives bust, or a hacker forces their way
    in and changes your password? There, and many other reasons why it makes sense
    to use a desktop email client that can be backed up, store your messages offline
    and live—if you have a facility set up—in an encrypted partition for your privacy.


    ## Positive Outlook


    If you''ve been around computers for a while, it''s probable you''ve used Microsoft''s
