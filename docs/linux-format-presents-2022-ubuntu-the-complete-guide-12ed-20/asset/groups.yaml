    When you''re done, you can compare different desktop sites on, and get a bit of
    information about the performance of your ISP.


    We have some recommendations regarding that, your choice of browser is really
    going to come down to personal tasks and what works best for your Linux system.
    All computers and desktops work differently, so you''re encouraged to make sure
    you''re good, test, and find the best for you. Once you''ve done that, the internet
    is yours. Happy browsing!


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_40_3.png)


    ## Testing capabilities


    How does your browser perform differently? Browser options render elements in
    different ways. Test your chosen browser (and its competitors) thoroughly to make
    sure you''re de-scing good. Head-first to the Acid tests at acictest.org to see
    how your browser handles particular benchmarks or, at least, how it shows your
    browser performance on these parts.


    A more modern benchmark is HTML5Test.com. This won''t animate anything perfectly
    but gives a representation of your browser''s flaws (or) does give you a detailed
    list of everything your browser can''t do with, and many browsers are going to
    lose a few points for leaving out closed source. Technical skills, here might
    mean needing to install your current version. The variety of measures available
