    ## 系统设置


    通常在安装 Ubuntu 的过程中，你会选择语言和键盘设置，以便能够方便地输入和阅读。如果你需要更改这些设置或安装额外的语言，可以通过“语言”设置来完成。第一次时，系统会提示你安装额外的文件。


    稍等一下，它们就会激活。使用“安装/移除语言”按钮进行此操作；它会打开大量的语言列表，只需点击你想要切换到的新语言复选框，然后点击“系统范围”按钮。


    你可能需要访问不同的键盘布局，该设置提供了通过快捷键和顶栏图标在它们之间切换的方法。


    默认情况下，你的当前语言由 Ubuntu 在菜单和窗口中设置。这些语言按顺序列出；因此，如果第一个语言不可用，所需的语言就在下方。对于非英语的额外语言，只需将它们拖动到基础英语选项上方。


    “区域”部分允许你控制数字和时间的显示方式。这里没有精细的控制，但它为本地地区提供了广泛的基础配置。


    与语言相关的是“文本输入”设置。如果你想访问超过一种风格的语言源，这里提供了相应的控制。其他项。


    “用户”功能从一开始就存在了，以方便同一系统上的多个用户，它们之间完全独立。它是让更多人使用同一个 Linux 系统的最佳手段，因为文件与其他用户完全分离，他们可以拥有自己的设置。除了添加用户外，更改密码允许你保护账户，并允许朋友或陌生人远程使用你的系统。


    除了默认启动配置外，你还可以配置登录时启动哪些应用程序。使用“数据和启动”选项卡来配置系统。你也可以按 Alt+F2 并运行 `gnome session`
    命令。点击并输入登录命令（名称和命令是可选的）。例如，通过在命令字段中输入 `firefox` 让 Firefox 自动启动。


    包括 Facebook、Google、Jabber（一种聊天服务）和 Yahoo! 在账户数量。它还允许通过可以链接的程序来管理账户；例如，你想知道哪些图像是由
    Shotwell 管理的等。


    ## 安全与隐私


    人们对隐私的重视程度比想象得多——一个巨大的 Google 账户和服务宇宙——而 Ubuntu 也有其优劣。有一个详细的“安全与隐私”部分，专门确保你的数据安全地留在你的电脑上。该部分从需要密码锁定和离开空屏的保护开始。


    “隐私”标签卡关于保护你的详细信息。“文件与应用程序”提供了使用 Dash 搜索结果的选项。如果没有必要，你可能想要删除聊天日志；如果你想搜索音乐和其他文件，这将消除在线搜索和诊断。


    还有一个“详情”部分，专门为你的系统提供相关信息。你熟悉 Ubuntu，但这并不是你可能需要使用的方式；通过根据你的喜好调整设置来让自己感到舒适吧：


    ## 在线账户


    Ubuntu 可以直接集成到一系列在线账户中，这使得操作系统能够将通知、电子邮件、日历事件等直接拖入内置的通知系统并安装程序。“在线账户”管理所有这些内容，并提供了一些但非常有用的支持。


    ## 3 Ubuntu 的设置看起来相当单薄，从某种意义上说确实如此，实际上它让生活变得简单！


    ## 系统设置


    ### 显示器：设置你的所有屏幕


    配置显示器的基础设置：如分辨率、视觉效果、屏幕保护程序等。


    Ubuntu 的设计旨在易于设置，显示器的默认设置可以提供良好的用户体验。然而，如果默认设置已经是最佳的或者你希望个性化 Ubuntu，你应该先点击“搜索”并输入。


    从这里，你可以从各种背景中选择。如果你下载了自己的背景，也可以使用它。只需将你的图片放在“图片”文件夹中，并在“外观”的下拉菜单中选择它，或双击进行选择。


    你在这里可以做的另一件事是更改主题。正如其名所示，这是更改桌面外观的简单方法。你可以选择尺寸较大的 Radical 主题。你也可以选择“高对比度”主题，这对于视障用户可能很有用。增大启动器停坞的大小。


    ## Ubuntu 设置


    较新版本的 Ubuntu 内置了屏幕保护程序。显示器在一段时间后将关闭。你可以通过进入“设置：亮度和锁定”来访问这些设置。


    默认情况下，屏幕在无活动五分钟后将进入休眠状态。屏幕也会锁定。


    > Ubuntu 会循环显示保护程序，你可以只选择你想要的某一个，这意味着当你回到电脑时，需要密码才能访问桌面。


    大多数现代显示器和电视都是 LCD 屏，不会受到旧 CRT 屏幕的影响（CRT 屏幕在长时间使用后会留影）。


