    # Gimp 主要功能


    滤镜

    滤镜菜单包含大量工具，除了无法为卡通帧添加模糊外，无一不包。


    工具

    这些工具是一套标准的照片编辑工具包。你所预期的一切都在这里。


    选项

    除了工具本身，你还会找到全系列的自定义选项，用于微调它们的使用。


    图层

    图层窗口的作用方式与 Photoshop 非常相似。你可以分割图像、添加额外的图层并编辑区域。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_36_0.png)


    你会注意到图表下方有三个标记：两端各一个，中间一个。一张曝光良好的照片将显示跨整个色调范围的读数，具体取决于对比度。然而，如果拍摄到一张曝光不足的照片，读数将聚集在图表的左侧，右侧则是一条平线。


    纠正此问题的最佳方法是将标记从右侧拖到色调值开始的区域，缩小图像范围，直到数值产生读数。


    如果你足够幸运，它们会在不破坏图片的情况下亮亮度。因为你也有良好的对比度，它会自动进行调整，它应该保留原本会变得冲淡的亮度。


    这不仅如此，这些单一工具还可以纠正照片的“白平衡”。例如，如果你在室内拍摄照片，可能捕捉到了来自头顶灯光的黄色色调。要消除这一点，你可以使用“色阶”对话框中的吸管符号之一。


    从左到右，这允许你选择图像的黑色点、灰色和白色点。Gimp 将计算出颜色应该是什么样子。


    白色点最容易使用——点击一个你认为应该是纯白色的细节。牙齿或眼睛和衣服或桌子颜色一样好。这将图像范围调整到更更自然的视觉效果。


    而且你第一次就能得到正确的结果。如果一切进展不顺利，请点击图像的另一个部分或点击“重置”按钮。


    这仅仅是 Gimp 能力冰山一角。在基础工具箱中，你可以缩放图像、绘制路径、旋转或编辑文本。唯一的学习方法就是尝试。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_36_1.png)


    > 小贴士

    对于照片修复，有海量的在线照片编辑器，你的浏览器和 Linux 一样好用，是快速修复眼睛等处的最佳选择。


    Gimp 的“锐化掩模”在捕捉图像细节方面表现完全不输于 Photoshop。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_36_2.png)


    # Openshot：开始视频编辑


    使用 Openshot 开源视频编辑包轻松制作带有背景音乐的家庭视频和幻灯片。


    如果你认为切换到 Ubuntu Linux 意味着获得了创建视频和照片的能力，请放心，事实并非如此。从 Ubuntu 软件中心提供的 Openshot 视频编辑器可以在几分钟内学会，并允许你创建高质量视频。


    尽管对我来说，Openshot 是唯一在 Ubuntu 上运行良好的视频编辑器，但它在易上手和具备创建专业视频的高级功能之间取得了有效的平衡。


    在本教程中，我们将解释如何在 Openshot 中导入和编辑剪辑，以及如何导出它们。


    为了继续操作，你需要导入想要在编辑器使用的视频和图片。一旦你的媒体文件安全地保存在电脑上，点击 Ubuntu 软件图标搜索并点击“Openshot”进行下载。


    你在 Openshot 中的第一个项目应该是创建一个新项目。点击左上角的“新建项目”按钮或按 Ctrl+N。弹出的窗口将允许你命名项目并选择在文件夹中保存项目文件的位置。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_37_0.png)


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_37_1.png)


    - 背景音乐已添加到轨道 1，猫咪视频已添加到轨道 2。原始音频已静音。


    接下来，点击绿色的 + 图标导入媒体文件（如视频片段）。例如，你可以通过按住 Ctrl 并点击每个剪辑来选择多个剪辑。点击底部的“添加”按钮导入文件。它们将出现在左上角的“文件”窗口中。


    # 轨道、时间和时间线


    项目打开后，下一步是将剪辑拖入“时间线”中。这非常简单，因为你只需向上拖动它们并将它们放置在你想的地方。如果你想让一个剪辑在 3 秒后开始播放，另一个在第一个结束后播放，只需拖动剪辑即可。


    默认情况下，轨道每 8 秒循环一次，除非你通过滑动左上角的条来更改此。


    当你创建一个项目时，你会看到最初显示两个轨道。你不需要使用一个以上的轨道，但如果你想使用过渡效果和背景等高级功能，建议点击 ''+'' 图标添加另一个轨道。只需点击图标并将音频文件拖入轨道即可静音音频。


    你可能还想添加视频标题。要实现此操作，点击 ''+T'' 打开标题菜单，然后点击“新建标题”设置文本。这将会出现在“文件”窗口中，并在需要时随时将其拖到时间线。。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_37_2.png)


    使用此屏幕为你的项目命名，选择你的项目文件夹并选择项目类型。


    > 左上角的“新建项目”按钮允许你为项目保存位置。这不需要与你导出视频的位置相同。


    # OpenShot 幻灯片


    如果你从一系列照片中选择视频，请将它们放在文件夹中并确保按顺序排列。大多数数码相机都会自动为你完成这一点。


    使用“导入”按钮加载所有文件，右键点击 Ctrl+A 选择所有文件并再次点击。选择“时间线”。


    “时间线”标签允许你调整视频设置。“时间线位置”部分允许你调整图像出现的时间，如果你正在添加幻灯片，可能需要添加几秒。


    “淡出”部分允许你选择照片是淡入还是淡出，正如名称所示，设置持续时间。最后，“过渡”部分允许你选择照片之间的过渡效果。这节省了你单独插入过渡效果的时间和麻烦，但它对每张照片都会使用相同的过渡类型。


    默认情况下，奇数用于轨道 1，偶数用于轨道 2。你也可以在“时间线位置”部分更改此。完成后点击“添加”。


    在此时，你可能想为背景音乐添加音频轨道。通过点击顶部的“导出”按钮将幻灯片导出为视频，你就全部完成了。


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_38_0.png)


    有时你只想从较大的录制中通过短剪辑创建一个视频，作为婚礼的插入幻灯片。可以通过点击时间线顶部的剪刀图标轻松激活剃刀工具。一旦光标将变为蓝色的剃刀图像，光标将变为蓝色的剃刀图像，光标将变为蓝色的剃刀


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_38_1.png)


    # 效果和过渡


    OpenShot 包含大量的效果。只需右键点击剪辑并选择“属性”即可将其应用于你。的的的的。


    当你在剪辑属性中时，花时间探索其他标签（如“速度”和“布局”），看看可以在哪里找到它们。


