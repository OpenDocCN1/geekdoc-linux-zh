    # 什么是 Ubuntu？


    它是一个操作系统，它是计算机的自由，是通往开源世界和共享软件社区的门户。(img/da2630bbaa4c7bf32e381819fe7164b5_0.png)


    # Ubuntu 版本


    像大多数软件一样，Ubuntu 有版本和名称。如果你从未遇到过它们，它们可能显得有些奇怪或难以理解——但我们将为你解释。Ubuntu 每年发布两次版本，每个版本号都代表发布月份（4
    月或 10 月）和 (年份)，例如 19.04 发布于 2019 年 4 月，19.10 发布于同年。每个非标准版本都有九 个月的支持，每两年发布一次长期支持版
    (LTS)。当前版本是 19.04 LTS，下一个是 20.04 LTS。如果你想要更高的稳定性，建议选择这些版本。为了避免困惑，每个版本都有一个有趣的名称，以动物命名：


    - 16.04 Xenial

    - 16.10 Yummy

    - 17.04 Zesty

    - 17.10 Artful

    - 18.04 Bionic

    - 18.10 Cosmic

    - 19.04 Dingo

    - 19.10 Ermine


