    ## The trouble with Wayland


    For those stepping into the world of Ubuntu 22.04 for the first time, a potentially
    nasty awaits: the new desktop protocol replaces Wayland. For the most part Wayland
    is faster and more secure, but it has an additional security policy which poses
    problems for screen capture.


    On a running desktop protocol, many screen-capture tools are unable to grab screens
    using their own capture tools. That''s because they''re not engineered to work
    with Wayland – and you can see this in action when you try to install Spectacle
    on Ubuntu 22.04 running the GNOME desktop on Wayland – when the program opens,
    you''ll be told ''take a screenshot.''


    The problem doesn''t occur with Wayland since May 2021. Because it is stricter
    about what programs can access screen-capture abilities, other tools have to be
    adapted to support it. In the case of Spectacle and Screenshot, authors who have
    engineered a workaround which uses the GNOME screenshot instead of their more
    flexible screen capture capabilities (including support for hotkeys), which continue
    to work in X11.


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_50_1.png)


    > If you''re using Ubuntu 22.04 on Wayland, your screenshot tool must be able
    to invoke GNOME Portal to capture.


    even change their name, and also lose the ability to capture screen times to give
    you to set before capture.


    Thankfully, you''ll find third-party screen capture tools to fill in this and
    other gaps. KDE users should replace the GNOME screenshot tool. GNOME users install
    Spectacle with Screenshot (see the box, overlays), which it''s not compatible
    with implementation of the Wayland protocol. Spectacle works in Ubuntu 22.04 on
    Wayland; switch back to Xorg – see for more details (below).


    The same restrictions apply to other screen capture tools unless otherwise recommended,
    including Kazam (https://kazam.net/). This offers all the features in the original
    GNOME screenshot tool, including the ability to capture with optional countdown
    timer and save file manually. The most notable of these is the ability to configure
    Kazam to automatically format to yours when choosing your choice of format.


    You can use Kazam to capture the entire desktop in Wayland, but its screen-capture
    tools don''t work and it will crash if you attempt to capture a window, making
    it an impossible solution unless back to Xorg.


    - **Quick tip**: You can learn more about plugins: Visit https://gnome.org/extensions/shell-plugins
    to download a package to install OCR Use the tool. It can screenshot to extract
    text via the Options-menu.


