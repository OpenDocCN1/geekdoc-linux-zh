    # Get started


    ![](img/da2630bbaa4c7bf32e381819fe7164b5_23_0.png)


    # Introducing the Ubuntu desktop

    Ubuntu desktop might seem a little alien to new users, but it''s very easy to
    get the hang of.


    Like Windows, the desktop of Ubuntu is where you''ll spend most of your time.
    It''s when you can open your programs and interact with them, and you can also
    customise your desktop with wallpapers. However, the Windows and Ubuntu desktop
    share some things in common, there are also many differences between. Once you
    get used to it, the Ubuntu desktop isn''t just easy to use, but it has loads of
    features that will make you quickly forget about Microsoft''s Windows way.


    When you first load up Ubuntu, you''ll see the Launcher, which runs down the left
    side of the screen. This is where you access all your favourite apps. Pre-installed
    apps like the Firefox web and LibreOffice appear here and you can also find other
    programs by searching or dragging icons to the Launcher.


    To search for files, programs or on your PC, you can use Dash, which can be opened
    by clicking on the icon at the top of the Launcher. Dash is open, when you


    can simply type in the name of what you are looking for, and Dash displays the
    results. One of the best things about Dash is that it doesn''t just search your
    PC; it can also offer suggestions from the internet as well. If you get back too
    many results, you can choose what sort of files or programs you''re looking after
    by clicking on one of the icons below the Dash. You can also filter your results.
    For example, you can filter your applications, videos, music or photos instantly.


    and install new applications for Ubuntu. You can take a more in-depth look at
    the Software Center in this bookazine.


    Underneath that is an icon for Amazon, which takes you to the popular online store.
    It''s an icon for Linux users, so if you don''t like it being there, right-click
    and select Unlock from Launcher


    Beneath that is a shortcut, which opens up your Ubuntu settings. From there with
    some careful tweaking, you''ll be able to get the operating system working how
    you want to.


    You will also see an icon with a big A and a circle of arrows. This tells you
    when there are software updates available. Ubuntu (Linux as a whole) is much more
    secure than Windows, it''s worth it to make sure any security flaws performance
    issues are fixed.


    Finally, at the bottom is an icon of trash. This works exactly the same way as
    the Recycle Bin in Windows, if you delete a file that you want to restore, check
    here before you leave out.


    # File management


    Below the Dash icon on the Launcher is the file manager. This opens up Ubuntu
    files, which is like Windows Explorer. Here you can easily find, open and modify
    folders from the Ubuntu desktop. As Windows, Ubuntu helps keep things organized
    with Documents and Music to store your files.


    On the Launcher, you''ll also see an orange shopping bag icon with a letter A.
    Clicking this opens up the Software Center, which enables you to find, download'
