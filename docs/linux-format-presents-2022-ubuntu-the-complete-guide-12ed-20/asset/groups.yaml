    Wine is a compatibility layer for running Windows applications on Linux. It is
    not a full Windows emulator, but it allows you to run many Windows programs natively.
    Wine includes layers for running Windows APIs as well as the Wine environment
    itself.


    ## Details


    ### 1 Install Wine


