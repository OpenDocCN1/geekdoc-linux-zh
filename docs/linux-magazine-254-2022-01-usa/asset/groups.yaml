    ## 系统管理员的日常苦差：ASN


    ## 地狱中的高速公路 (Highway Through Hell)


    在深入研究 BGP 路由信息时，Charly 得益于 ASN 工具，避开了参数地狱中的高速公路。为了系统的 AS 号，ASN 提供了其他信息，正如其上游和下游伙伴关系一样。由
    Charly Kühn 编写。


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_36_0.png)


    每个管理员都知道如何处理自治系统 (AS)，然后我将此 IP 地址传递给名为 ASN 的工具 [1]。该 shell 脚本汇总了其他工具的输出，并以清晰的方式呈现结果。它有许多取决于发行版的依赖项。该工具页面上的一个章节解释了为了让
    ASN 工作需要安装的的确切内容。IP 绝不会孤立存在。它们属于一个网络，并且工作总是被分配的。有一种简单的方法可以找到特定的 IP 属于谁。例如，连接服务器的
    IP，关联地址 62.144.103 可以使用 rig 或简单的脚本来发现。


    调用 `asn 62.144.183` 的输出显示该 IP 地址属于网络 146.0.10/16 和 AS15598。ASN 是全球范围内的，并由互联网数字分配机构
    (IANA) 分配。与 AS 伙伴的第二次调用提供了有关该 AS 的各种信息，例如上游和下游伙伴关系 (2)。此外，你还可以看到其他网络已分配给此网关 62.144.0.0，它承担了从
    ASN 到目的的数据路径 (3)。


    所有这些信息可以通过其他方式获得，得益于 ASN，它帮助我节省了时间并避免了在参数中挣扎。


    **图 1：** 第一次调用 ASN 62.144.183 揭示了 IP 地址属于网络 146.0.10/16 和 AS15598。


