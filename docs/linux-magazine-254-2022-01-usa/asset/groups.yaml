    ### 使用 stress、lm-sensors 和 hddtemp 解决家用级 NAS 机箱的温度和可靠性问题。


    作者：Adam Wix


    最近，由于我公寓的一些装修工作，我的家用 NAS 陷入了困境。简而言之，工人们没有提到他们会把我的工作空间当成工作场所，并在我的家用 NAS 服务器旁边铺设瓷砖，而那里还有我偶尔用于测试和特殊项目的基于
    i3 的设备。在镜像备份（ghosting）三个月后，我的 NAS 发生了故障。


    我的 NAS 是一台家用超微（Supermicro）XPS，配备 X5680 处理器、24GB DDR3 内存和六块硬盘，自行控制操作系统（OS）。操作系统位于
    SSD 上，数据全在 HDD 上。没有冗余（请参阅我关于 MergeFS 的文章了解此问题）。因此，这是一个我自找的烂摊子，但在构建时并非没有缺陷。随后我发现，在上述装修之后，我的硬盘在启动出现后会随机消失。我尽所能地清理了机器以便重新安装。这运行得良好，但仍有两块硬盘会掉线，需要重启并更换
    SATA 线。我应该说明的是，当时我使用的是多年从购买主板时收集的旧廉价 SATA 线，因此我决定切换到带有 SATA III 规范要求的锁扣的现代电缆。问题仍然存在：


    此时，我多次意识到，硬盘笼前面的进气风扇故障了。风扇是由装修引起的。虽然我完全可以说导致它的原因——它可能是被 CPU 风扇加热的。两者都是 24/7 全天运行的
    120mm 风扇，而且前面都没有过滤器或防护网。下一个损坏的是电源，速度非常快。虽然灰尘量不足以导致这种故障，但在装修完成后，电源键和重位键确实经受了某些损耗。


