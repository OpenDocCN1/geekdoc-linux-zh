    # LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics or to collect your
    collection.


    # #253/December 2021


    # OpenBSD


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_0.png)


    BSD Unix has been around longer Linux, and it still has a loyal following within
    the Free Software community. This month we explore the benefits of a leading BSD
    variant from the viewpoint of a Linux user.


    > On the DVD: Tails 4.22 and Q4OS 4.6


    # #252/November 2021


    # Locked Down!


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_1.png)


    The security landscape keeps changing, and experienced users know they need to
    keep eyes open for tools and techniques that give an edge. This month we study
    smartcards, hard drive encryption, and a less-bloated alternative to Sudo.


    > On the DVD: Debian 11 and Redcore Linux 2101


    # #251/October 2021


    # Linux From Scratch


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_2.png)


    Building an operating system is not like compiling a desktop app. You''ll need
    to create a complete development environment – and if you follow the steps carefully,
    you will emerge with a deeper understanding of Linux.


    > On the DVD: Linux Mint 20.2 Cinnamon Edition and Garuda KDE Dr46050 Edition


    # #250/September 2021


    # Inside the Kernel


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_3.png)


    The only way to celebrate the 30th anniversary of Linux is to write about Linux
    itself – the agglomeration of software we know as a Linux distro, but the real
    – the beating heart in the center of it all: the kernel.


    > On the DVD: AlmaLinux Minimal 8.4 and SystemRescueCd8.03


    # #248/July 2021


    # Bring Your Android into a Linux PC


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_4.png)


    UserLand lets you run Linux applications on your Android phone without replacing
    Android OS.


    > On the DVD: openSUSE Leap 15.3 and Kubuntu 21.04 Desktop


    # #248/July 2021


    # Brain Tools


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_5.png)


    Sometimes you want the computer to think for you, and sometimes you want the computer
    to make you think. This month we present a selection of free Linux tools for learning
    and thinking.


    > On the DVD: Ubuntu 21.04 and Fedora 34 Workstation'
