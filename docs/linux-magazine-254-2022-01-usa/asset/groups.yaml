    # NEWS


    Linux News


    # Hive Ransomware Hitting Linux and FreeBSD Systems


    Slovak security firm, ESET, has discovered versions of the Hive ransomware for
    both Linux and FreeBSD systems. However, the encryptors that have been developed
    for these systems are still in development and are quite buggy. According to ESET
    researchers, both encryptors completely fail when the malware payload is executed
    with an explicit path. In comparison to the Windows version of Hive, the Linux/FreeBSD
    iteration only one command-line parameter --without permission. The Linux version
    of Hive fails to trigger the encryption because it is not capable of writing to
    its root file system. Hive is a ransomware group that has already affected more
    than 30 organizations and their victims who refused to pay the ransom to get their
    data back. According to Fabian Weber, "The reason most ransomware groups implemented
    a Hive-based version of the ransomware is target ESXI specifically," is VMware''s
    base-metal hypervisor. Because of the continued rise in targeting Linux systems
    with ransomware, it has become even more important that admins keep their systems
    up to date and make use of tools such as Rootkit Hunter. Read original Twitter
    thread from ESET research on the issue at https://twitter.com/ESETResearch/14541068921667329.


