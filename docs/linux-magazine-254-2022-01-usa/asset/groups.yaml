    **Doghouse - FreedomBox**

    Jon "maddog" Hall

    FreedomBox offers a private, secure personal server that is now available on more
    platforms and its own system from Olimex.


    **Lutris**

    Erik Bwald

    Gaming on Linux has traditionally involved a complex installation and configuration
    procedure, until now. Lutris lets you enjoy games from different worlds quickly
    in a unified interface.


