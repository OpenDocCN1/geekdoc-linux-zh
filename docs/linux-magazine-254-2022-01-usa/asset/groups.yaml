    # 本月 DVD


    # Ubuntu 21.10 与 EndeavourOS 2021.08.27


    双面 DVD 上的两个精彩发行版！


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_5_0.png)


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_5_1.png)


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_5_2.png)


    ## Ubuntu 21.10 (64位)

    ## EndeavourOS (64位)


    Ubuntu 21.10 (Impish Indri) 是桌面端最流行发行版之一的最新版本。它将支持到 2022 年 7 月，届时将由下一个长期支持 (LTS)
    版本 22.04 取代。由于 Ubuntu 的 LTS 版本拥有许多新功能，因此 21.10 并没有引入任何激进的变更。该版本包含了 2021 年 4 月发布的
    Linux 5.12 内核，使 Intel Alder Lake 和 AMD Albaran 芯片、Microsoft Surface 笔记本电脑和平板以及
    Apple M1 ARM 系统受益。大部分更改都是升级。在桌面端，这些升级包括 Gnome 40 环境，以及一系列容器应用程序镜像、最新版本的 GIMP、OpenLaTeX、针对开发者的
    OpenJDK，以及最新版本的 Python、Apache、Oracle 和 LibreOffice。


    Ubuntu 是为开发者准备的发行版，特别是对于那些构建云应用的开发者。然而，凭借更新后应用程序带来的错误修复和安全保护，Impish Indri 是所有感兴趣且具备技能水平的用户都会想要安装的版本。


    缺陷光盘将予以更换。


    EndeavourOS 是 Arch Linux 的衍生版之一。与 Arch 本身一样，它是一个滚动更新版（rolling release），新软件包一旦通过测试就会被添加到存储库中进行新发布。与
    Arch 的主要区别在于使用了基于 Calamares 的安装程序。EndeavourOS 还包含一个详细的 Web App，提供帮助新用户尽可能轻松地启动并运行系统的链接。


    但请不要误会：EndeavourOS 仍然紧密依赖 Arch。它的主要目的是让 Arch 变得易用，它仍然共享 Arch 的许多哲学，包括支持各种开发环境的官方和非官方变体。EndeavourOS
    自述为“以终端为中心”，自定义安装会让用户留在命令行界面。像 Arch 一样，EndeavourOS 不包含许多预装应用程序。它使用易的安装程序来帮助用户，并让他们学习“在一段不可思议的旅程中创建你自己的”。EndeavourOS
    表示：“EndeavourOS 是通往预定目的地的快速公路。这关乎你自己的所有权，以至于你在探索过程中会遇到许多新且友好的朋友。”


    EndeavourOS 旨在那些想要尝试 Arch 并寻找他们喜欢的挑战的人。如果这听起来像你，那么你将会找到正确的终点。


    2022年1月


    第 254 期


