    Listing 6, line 1, displays "Week", and the consecutive week number every Monday.
    Listing 17 shows New Day as a public holiday. There must be a space between the
    day and month.


    To display a day as a public holiday, add an asterisk (*) followed by the desired
    text. Many holidays are fixed number of days before or after the year (Listing
    6). The result is shown in Figure 9.


