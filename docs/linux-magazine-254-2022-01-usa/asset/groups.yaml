    - cd libjournal-0.9

    - mkdir build

    - cd build

    - cmake ..

    - sudo make install

    - List 2: Compiling from Source

    - mkdir -p Qjournal

    - cd Qjournal

    - git clone https://github.com/pentix/Qjournal.git

    - .

    - ./autogen.sh

    - make -j$(nproc)

    - sudo make install


