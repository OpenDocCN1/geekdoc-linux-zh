    ## Qjournalactl


    Listing 4: Manual Work

    of the displayed log, select it and save it by pressing the Export Selection button.


    ```

    01 $ ssh journalactl-1 --vacuum-time=10m

    02 $ ssh journalactl-1 --vacuum-time=1month

    03 $ systemctl status systemd-journal

    ```


    Going Remote

    If you wondered at the beginning why Qjournalactl needs the library, for that
    Qjournalactl allows display logs from remote computers via SSH. The remote menu
    offers items for opening a connection via SSH, as well as saving the access credentials
    in cases in which you may query the servers frequently. Qjournalactl supports
    visual files, from the /etc/systemd/journal/ configuration file. Optionally, you
    can truncate the log using the command from the first line of Listing 4 to merge
    both. You can also drop logs more than one month only (Line 2). The only status
    query Qjournalactl allows in this context relates to the state of the server.
    You will need to query the general health of the system: Qjournalactl --verify
    to check the integrity of your demands.


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_51_0.png)


    ## Conclusion

    Qjournalactl is a handy tool for anyone who doesn''t use it regularly nor does
    have all the necessary commands for the terminal. Qjournalactl facilitates filtering
    logs by date and time constraints. The ability to display logs from remote computers
    and select them from a list is quite useful.


    Figure 3: Easy to access machines via SSH is a special treat. You can save the
    details of remote machines quickly using the command in the line and press the
    labeled button. The middle tab in the main window lists all audit entries for
    matching actions by clicking on matching boxes. You can also view the stored logs
    at once by selecting Show log from the main menu using the first tab.


    On a PC with a Ryzen-7 CPU, viewing all logs saved forever took over 6 million
    lines. You can query the size of the disk (Figure 2).


    If you want to process a log in another way or simply save it, export it to filtered
    journal. If you only need an offline log in realtime, under the three bars, the
    main window offers options for latest (message on top). The top bar always stays.
    If you are looking at the log of the currently active boot, the function is automatic
    indicated by the end of the top line. If you are looking at the log of an older
    boot, the function does make much sense, of course. You can still check the output
    in reverse.


    ## What''s Missing?

    Qjournalactl deliberately not provide functions for performing many of the administrative
    tasks that journalctl adds in the terminal. Systemd takes the size of the log,
    as well as the indicator.


