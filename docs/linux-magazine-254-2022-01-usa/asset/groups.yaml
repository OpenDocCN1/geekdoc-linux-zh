  mdcn: "\n\n# 深度解析 MergerFS\n\n在初始设置设备时，请考虑冗余。例如，假设你有多个个人文件（健康记录、简历、加密钱包、照片），但你也有一些不需要与视频和媒体一起保存的文件（如\
    \ Linux 操作系统的集合等）。你可以在一个预分配的 5 盘 RAID 阵列创建一个文件夹，并在你的个人文件中也创建一个文件夹。然后，你可以在非冗余的服务器上创建另一组文件夹，例如一个用于存储电影，另一个用于存储电视节目。带有两块磁盘的\
    \ RAID-5 可以“合并”属于共享 Glee 文件夹的内容。只要将你的个人文件添加到个人文件夹（初始为 RAID-5）中，并将所有媒体文件添加到为它们专门创建的文件夹中，文件就会处于它们应该的位置。当然，这取决于用户根据\
    \ MergerFS ConfigHub 上提供的不同策略来选择存储的内容。\n\n![](img/28ca43fc7e7266abd9ae8dd9cb34448b_38_0.png)\n\
    \n图 1：使用磁盘 b、c、d 和 e 创建的 MergerFS。\n\n对于 ZFS，目前 MergerFS 将非常容易地添加文件，并为你的家庭服务器高效地管理各种数据，使服务器既整洁又易于复制。在\
    \ Ubuntu 上初始设置 MergerFS，请运行以下命令：\n\n```\n$ sudo apt update && sudo apt install\
    \ mergerfs\n```\n\n接下来，需要创建一个文件夹来挂载 MergerFS 阵列（如果你在示例中使用 /media/a），应用策略并为你的阵列添加磁盘。要使用它，请使用以下操作：\n\
    \n# 结论\n\nMergerFS 让我以逻辑方式组织数据变得简单得多。可以通过为每种类型的数据使用不同的文件夹来简化我的配置，而 MergerFS 会过滤掉文件的冗余细节。要完成配置，你可以设置\
    \ MergerFS 随系统启动启动。\n\n# 信息\n\n- [1] [安装和配置 Samba](https://github.com/tutorials/install-configure-samba-1-overview)\n\
