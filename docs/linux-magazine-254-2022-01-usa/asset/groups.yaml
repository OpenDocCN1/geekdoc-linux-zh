    # 估值与价值


    亲爱的读者：


    Facebook 举报人弗朗西斯·霍奥根（Frances Haugen）最近在国会山山的亮相，为她的前公司带来了不小的麻烦。在她最近的证词中，Facebook
    内部文化的一面被曝光出来。最令人不安的指控之一是，据报道 Facebook 的算法权重比“点赞”按钮高出五倍。（无论如何，所有的表情符号都增加了权重，但它们通常是点赞按钮的对立面，而“点赞”在技术上也是表情符号）。我们还知道，Facebook
    出现在你新闻流中的概率是其自身的五倍（后降至四倍）。Facebook 显然无法修复这个问题，但这是一场视觉上的灾难。在多年努力讨好人们之后，Facebook
    忽略了压力，即他们的真实目标是实现点击量最大化，即使这会导致分裂。


    Facebook 当时的状况也是如此。初创公司通常具有更高的市盈率（P/E ratios），因为问题在于人们投资的是潜力，但你也需要考虑公司收入模式的不确定性。在我写这篇专栏时，科技公司
    Facebook 刚刚成功完成首次公开募股（IPO），目前其盈利使其市盈率达到了无穷大，大家都知道一辆卡车是什么以及如何卖卡车。在 IPO 期间，世界才开始看到
    Facebook 是什么，没有人对此有真正的共识。Facebook 的规模大到支撑 1,040 亿美元的估值。根据草率算法计算，它需要占领全球互联网广告市场的很大比例份额，才能获得支撑其高股价所需的收益。


    情况显然是暗淡的，但还剩下谁或什么可以构建呢？简单的社交网络之所以成功的问题在于，你暗示问题出在执行上：如果不是因为启动缓慢或少数几个坏分子，这个系统本可以运行良好。事实上，系统本身就是问题，我不光是指理性的国际经济（这确实是一个问题）。问题在于商业，更具体地说，在于新公司如何起地的商业模式。


    当表情符号在 2017 年出现时，Facebook 尽管仍在通过追随者的快速增长从被遗忘的状态中回升，而且公司实际上取得了成功。他们确实夺取了全球广告市场的巨大份额，目前的市盈率在
    32 左右。在执行方面，该公司应该被认为在保持稳定和盈利的道路上成功，这是没有人预料他们能做到。


    Facebook 在 2003-2004 年左右在马克·扎克伯格（Mark Zuckerberg）的大学宿舍起家，但对于公共投资者来说，Facebook 是在2012
    年 5 月通过首次公开募股（IPO）亮相的。这是科技公司规模最大的 IPO 之一，总市值超过 1,000 亿美元。但即便如此，导师们仍在思考公司将如何赚到足够的钱来支撑这个价格。《旧金山纪事报》编辑詹姆斯·坦普尔（James
    Temple）刚刚指出，这次 IPO 是华尔街的泡沫，认为该公司的市盈率无法支撑 IPO 承诺的 1,050 亿美元。而且没有任何价值是有重要的。到 2011
    年底，Facebook 的收益（几乎需要财务增长）的交易率低于其收益的 19 倍。


    公平地说，他们正在修复它——现在他们已经修复了它，但很难说已经不再有真正的共识了。有很多理由让人感到愤怒。如果你对这种愤怒感到愤怒，请记住，是我们的系统定义了他们的文化。他们的股东给了他们一个单一专注的目标。他们通往星辰的火箭之所以运行，是因为那是原因——那是他们最廉价、最丰富的燃料，并且需要巨大的推力。


    市盈率（P/E ratios）在其他地方被讨论过，但足以说，再次，每个市盈率都低于


