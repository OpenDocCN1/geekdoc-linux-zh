    # LINUX VOICE LUTRIS


    # 使用 Lutris 将 Linux 变为游戏平台


    传统上，在 Linux 上玩游戏一直涉及复杂的安装和配置过程，直到现在。Lutris 让你能够在统一的界面中快速享受来自不同世界的游戏。


    作者：ERIK BÄWALDT


    直到现在，Linux 一直不是大多数人的首选游戏平台，因为许多有趣且画面精美的游戏仅在其他操作系统上可用。通过 PlayLinux [1]（一种能够让为微软系统开发的场景游戏在自由操作系统环境下运行的工具），PlayLinux
    也适用于想在 Linux 上使用传统 Windows 应用程序的用户。它还集成了许多用于生产的办公应用程序和程序。


    随着 Lutris [2] 的发布，没有其他解决方案能够同时使用 Wine 处理 Windows 游戏并支持原生 Linux 游戏。此外，Lutris 还支持通过
    Steam 平台分发和管理的游戏，程序还可以处理其他提供游戏合集的分发平台。借此，Lutris 为从各种类型的游戏到寻求统一界面的硬核玩家提供了极其多样化的集成选项。


    # 入门指南


    为了安装 Lutris 并将其作为 Windows 游戏的运行环境在你的系统中使用，根据发行版的不同，你可以使用相应软件包源中包含的 Wine 包，也可以从特殊的仓库下载（请查看
    Wine 页面上的文档 [3]）。


    然后继续安装 Lutris。Arch、SolusLinux、Fedora、Arch Slack 等许多发行版的存档中都支持该软件，或者你可以使用独立的仓库——Ubuntu、elementary
    OS 及其衍生版本都有相应的仓库。对于带有 Debian 的系统，官方版本是一个很好的选择。


    网站还提供了通用版本和源代码下载。在没有原生软件包或仓库的发行版上，可以运行通用包。Lutris 在其项目主页 [4] 上详细描述了所有安装方法。


    # 首次启动


    当程序首次启动时……


    运行器（Runners）不是游戏，而是随后运行运行的平台。Lutris 不仅支持 Linux、Windows 和 DOS：它还支持游戏的模拟器和运行环境。可用游戏池可以得到显著扩展。


    > 图 1：Lutris 客户端中的状态窗口提供了各种控制选项。


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_71_0.png)


    - 库 (Library)

    - 最近 (Recent)

    - 收藏 (Favorites)

    - 来源 (Sources)

    - Lutris

    - GOG

    - Humble Bundle

    - 运行器 (Runners)

    - Linux

    - Wine


    要进行更详细的设置，点击标题栏右上角的汉堡菜单，并在右键菜单中打开“设置（Settings）”。最重要的选项分组在“设置”选项卡中（见图 2）。你可能需要包含
    Lutris 安装新游戏的默认文件夹路径，以及视频和音频控制的路径。


    你可以借助滑动条更改许多设置。如果你勾选了“高级（Advanced）”选项（左下角），你还可以包含主题或脚本，Lutris 在调用或关闭会话时执行这些脚本。


    每个运行器可以使用的开发者信息可以在项目网站 [5]。要安装额外的运行器，点击窗口侧边栏右上角的汉堡菜单，并在打开的右键菜单中选择“管理运行器（Manage
    runners）”


    # 管理运行器


    在新窗口中，你将找到所有可用的运行器。点击每个运行器的安装按钮将安装到你的系统中。下载并集成运行器后，运行器图标旁边会出现一个配置，替换默认图标。


    要向此列表添加游戏，可以在标题栏的搜索字段中输入它们的名称。搜索将连接 Lutris 服务器并搜索其数据库。搜索到的任何游戏都会显示在窗口右侧。如果你只在搜索字段输入一个名称组件，程序将列出包含该字符串的所有游戏（图
    3）。


    点击所需的游戏，然后点击显示的“安装（Install）”按钮。在提供游戏的平台上，多阶段安装将在新窗口中进行。对于某些游戏，运行时弹出一个窗口，你可以在多个游戏引擎版本之间进行选择。


    如果你选择了游戏编辑器，你还需要安装 Linux 版 Steam 客户端以及可能的 Windows 版 Steam 客户端来访问游戏。Windows 游戏运行在
    Wine 中，你通常需要下载 Gecko 和 Mono 软件包。


    完成安装后，软件会询问你是否要在桌面和工作环境的菜单层次结构为首次设置的游戏创建快捷方式。这些


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_72_0.png)


    > 图 2：Lutris 拥有详细的配置图。


    # 开始游戏


    一旦安装的游戏出现在窗口右侧，点击程序右上角的“游戏（Games）”选项。选择一个游戏并按下底部的“播放（Play）”按钮在我们环境中启动游戏。


    按下“游戏”右侧的小三角形可以打开帮助你找到更多选项的菜单。如有必要，你可以卸载选定的游戏或在桌面上快捷快捷。要这样做，选择“创建应用程序快捷方式（Create
    application shortcut）”或“创建桌面快捷方式（Create desktop shortcut）”。通过这种方式，无需 Lutris 环境即可启动游戏。


    > 图 3：Lutris 根据关键词搜索列出所有可用游戏。


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_72_1.png)


    再次移除现有的快捷方式，使用桌面快捷方式。这些选项在我们这里的 Lutris 变体不起作用，勾选框中没有任何。


    # LINUX LUTRIS


    再次移除现有的快捷方式，使用桌面快捷方式。这些选项在我们这里的 Lutris 变体不起作用，勾选框中没有任何。


    # 开始游戏


    一旦安装的游戏出现在窗口右侧，点击程序右上角的“游戏（Games）”选项。选择一个游戏并按下底部的“播放（Play）”按钮在我们环境中启动游戏。


    按下“游戏”右侧的小三角形可以打开帮助你找到更多选项的菜单。如有必要，你可以卸载选定的游戏或在桌面上快捷方式。要这样做，选择“创建应用程序快捷方式（Create
    application shortcut）”或“创建桌面快捷方式（Create desktop shortcut）”。通过这种方式，无需 Lutris 环境即可启动游戏。


    # 在线与离


    一旦安装的游戏出现在窗口右侧，点击程序右上角的“游戏（Games）”选项。选择一个游戏并按下底部的“播放（Play）”按钮在我们环境中启动游戏。


    # 游戏中心


    一旦安装的游戏出现在窗口右侧，点击程序右上角的“游戏（Games）”选项。选择一个游戏并按下底部的“播放（Play）”按钮在我们环境中启动游戏。


    # 结论


    Lutris 证明是一个不限于任何操作系统的强大平台。通过集成运行器（模拟器和运行环境），该客户端可以访问超过 13,000 款游戏。软件易于使用和配置。某些选项（例如桌面和集成菜单）仍有漏洞，但这不太减少使用
    Lutris 客户端的乐趣。


    '
