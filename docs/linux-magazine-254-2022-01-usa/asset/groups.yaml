    - 播放音乐和视频

    - 以及更多！


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_6_0.png)


    在线订：shop.linuxnewmedia.com/specials


    # 新闻


    技术、趋势和工具更新


    ## 本月新闻


    - 08

    - System76 正在开发新的桌面环境

    - 09

    - System76 正在开发新的桌面环境

    - Hetzner 在美国开设新节点

    - KDE Plasma 5.24 引入指纹识别器

    - Ubuntu 21.10 发布并最终包含 Gnome

    - 更多在线

    - 10

    - Hive 勒索软件攻击 Linux 和 FreeBSD 系统

    - SU Linux Enterprise 5.1 突破边界


    ## System76 正在开发新的桌面环境


    System76 永不妥协。考虑一下他们通过 COSMIC 主题对 Gnome 桌面环境做了什么。实际上，该公司已经将 Gnome 变成了他们自己的。但还不够，开发者正准备使用
    Rust 从头创建一个全新的桌面环境 (DE)。

    为什么是 Murphy？System76 的 Pop OS 的 Murphy 表示：“我们想做一些事情通过 Gnome 扩展是无法实现的。通常情况下，扩展感觉有点像是补丁。而且我们对桌面想做的与
    Gnome 不同，所以将 pop-shell 和 COSMIC 合并到 Gnome Shell 并不是什么受欢迎的事。”

    尽管新桌面不会是 Gnome 的分支（fork），但开发者计划重用一些当前的 Gnome 工具，例如 Mutter、Kwin 和 Way-roots。我的假设是，在可预见的未来，它可能会包含
    GTK 组件。Murphy 表示：“外壳本身可能比传统的桌面 UI 工具包底层。它将更好地利用窗口管理器。如果存在原生的 Rust GUI，我想尽可能使用最好的工具。”

    System76 桌面也将是与发行版无关的，因此不需要 Pop!OS 即可运行。此外，开发者计划（尽可能）遵循 FreeDesktop 的标准。

    不要期望这个新环境会在很快出现。因为这是一个全新的项目，它需要时间。请密切关注 System76 博客获取更多更新 (https://blog.system76.com)。


    ## Hetzner 在美国开设新节点


    Hetzner 在德国和芬兰一直以其云解决方案闻名，其低延迟和性价比使其非常符合个人和小型企业的需求。通过基于用户需求的方法，Hetzner 已扩展到美国。位于阿什伯恩的新节点为客户提供高性能服务器。


