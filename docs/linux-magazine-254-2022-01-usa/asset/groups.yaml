    内核问题。


    BP: 诚实，目前正在根据情况的发展持续推进。EndeavourOS 是我们的心血之作。尽管如此，我们计划增强 ARM 安装脚本，将其包含在我们的 ISO
    中，并计划改进发布 ISO 的方式，这还处于非常早期阶段，我无法透露太多。


    到目前为止，我们的经历非常有意义且令人自豪。这是因为我们没有人有创建这种东西的经验，我们每天都在学习。


