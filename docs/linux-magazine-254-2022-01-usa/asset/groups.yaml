    procedure, until now. Lutris lets you enjoy games from different worlds quickly
    in a unified interface.


    BY ERIK BÄWALDT


    Linux has not been most people''s preferred gaming platform until now because
    many interesting and also graphically sophisticated games are only available for
    other operating systems. With PlayLinux [1], a tool that enables the scene games
    developed for Microsoft systems usable under the free operating environment, PlayLinux
    is also available at users who want to use conventional Windows applications on
    Linux. It also integrates numerous office applications and programs for productive
    use.


