    # REVIEW

    Distro Walk – EndeavourOS

    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_23_0.png)


    An accessible Arch Linux derivative


    # Labor of Love

    As an outgrowth of the now-defunct Antegos community, EndeavourOS offers a customizable
    Arch Linux derivative that is easy to install with the benefit of community support.
    By Bruceiefield


    In the past few years, distributions based on Arch Linux have become more popular.
    Perhaps their popularity reflects the growing expertise of Linux users, but both
    Antegos and Manjaro have been in the top five for page views on DistroWatch. EndeavourOS
    [1], a distribution based on Arch, has appeared in the past, holding steadily
    in second or third on the list.


    EndeavourOS occupies a position among Arch derivatives. Where Manjaro offers an
    Ubuntu-like desktop experience, Endeavour''s focus is on getting users to a successful
    community with less difficulty than Arch Linux and then with all the resources
    for customization. Similarly, where EndeavourOS emphasizes the phase of learning
    and doing things your way. As the project says, "If you like to roll up your sleeves
    and go on an adventure you might want to give a try.", interviewed with Bryan
    Powatmodjo, one of EndeavourOS''s founders, about how the distribution has been
    and where it''s going.


    Linux Magazine (LM): How did you come to be involved with free software?


    Bryan Powatmodjo (BP): All the founders (Joe Kamprad, Manuel-Fernando Omchieuk
    Ford, and I) had an early interest in Linux and FOSS. We met on the forum and
    started an Arch-based distro that offered more or the same options as EndeavourOS
    is now offering. We all became forum moderators. In particular, Joe, Manuel, and
    Fernando became the faces for solving issues or sharing shortcut scripts on the
    forum.


    LM: What prompted the founding of EndeavourOS?


    BP: It was our intention to start a distro, but after their entry in May 2019,
    the community was taken by surprise. Through their existence, Antegos not only
    built a distro with an easy GUI Arch installer (Figure 1), but were also surrounded
    by a friendly community that went beyond friendships.


    ```

    INSTALL Installing EndeavourOS to disk

    * Start the Installer Partition manager

    * Install dependencies Release info

    * Update Mirrors Installation tips

    * Change resolution How to use system help

    * Software Changel Help

    ```


    Figure 1: The Calamas installer is one of the most features of EndeavourOS. It
    produces a commandline installer with all the tools needed for their customization.

