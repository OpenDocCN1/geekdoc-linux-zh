    # COVER STORY


    # LineageOS


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_21_0.png)


    # Install


    After running the backup function, the next step is flashing. Click the Lineage
    Install button in the main menu to get the flashing started. This step installs
    image [2] of the LineageOS distribution. You just need to tap on an archive file
    in the file manager to begin the install. In the next screen, the software offers
    you the option of flashing additional ZIP archives (Add more), for example, to
    reuse LineageOS or the Google Play Store (see boxed inset)


    “Lineage Add-Ons”. You can launch the actual flash process by dragging the Swipe
    to flash slider to the right.


    # Quickly Served


    Sideloading lets you transfer files directly from your computer without requiring
    you to copy the files from the SD card. (TWRP still needs enough storage for the
    image on the SD card.) Sideloading also lets you install ZIPs after one.


    For example, with the smartphone connected to the PC and the TWRP running, first
    call adb devices to check if the mobile device is accessed. The adb tool is in
    the android-tools (adb-tools) package. The call should return a line with a device
    identifier; followed by Recovery, Select ADB sideload in the TWRP screen. On the
    PC, run adb sideload. The value displayed on the console is not very interesting
    often remains at 0% for a long time. In our lab, the transfer was ever stopped
    at 40%, but TWRP reported the complete and the new system has booted flawlessly.


    Figure 10: Trebuchet, the default homepage on LineageOS, combines with acceptable
    resource consumption.


    # LineageOS Add-Ons


    Many users root the system, which is the only way to access control, control kernels
    such as a Tinker (12), or to tune the kernels for better performance and improved
    power consumption. Current LineageOS releases no longer the option to root via
    a checkbox in the developer options. Instead, the recommended method is to use
    Magisk (13). The sideloaded method requires installing Magisk (version zip), so
    TWRP''s install function will recognize it as an installation that can use Add
    Zips to flash the main system. The original format zip_vs. .apk package, which
    refreshes the app without rebooting.


    LineageOS does not include Google Play Store or other services and apps. If you
    want to install the Store or other apps, you need to install OpenGApps (14) before
    starting the new system for the first time. These are apps which you flash through
    TWRP recovery. On the OpenGApps page, select the correct package based on your
    platform-format (see the LineageOS zip for your device: Architecture), the Android
    version (which is in the LineageOS zip), and the Variant, that is, the scope of
    the OpenGApps package. The setup option is fully installed on Nexus phones. The
    nano option includes all items not available through the Play Store and is recommended
    for users who want to build their own system.


    # Conclusions


    +   1 LineageOS: https://lineageos.org


    +   2 LineageOS builds: https://wiki.lineageos.org/devices/


    +   3 TWRP: https://twrp.me


    +   4 TWRP builds: https://twrp.me/devices/


    +   5 Device ID apps: https://play.google.com/store/apps/details?id=com.hw.deviceinfo


    +   6 Heimdal: https://geimashline.com/android/html/


    +   7 Titanium Backup: https://play.google.com/store/apps/details?id=com.titanake42.titaniumbackup&hl=en_US&gl=1


    +   8 Magisk: https://magisk.org


    +   9 Apps for Magisk: https://github.com/MagiskCore/Magisk-Apps


    I recommend LineageOS as the first port of call for anyone who wants to root a
    smartphone or tablet that is no longer maintained and does not receive Google
    updates. The LineageOS builds for Micro and /X are even easier to get a Google-free
    smartphone without many issues. ■


    +   10 Magisk: https://lineage.micro.org


    +   11 /os: https://lineage.foundation/os/


    +   12 Tasker: https://tasker.joaoapps.com/


    +   13 Root-add on Magisk: https://magiskmanager.com/


    +   14 OpenGApps: https://openggapps.com'
