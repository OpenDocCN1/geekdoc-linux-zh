    我开启了一个可以延续 Android 遗留的项目，Joe Kamprad 是第一个加入我的人。在那个时候，这并不是计划中的，但当 Fernando Oiechio
    加入后，整个计划都改变了。他已经开发了一个以 Xlice 为主要桌面环境（DE）的非官方安装程序，我们制作了一些粗略的脚本来帮助我们自己或者为了方便起见，该项目从消耗社区资源转变为一个考虑到
    Antigers 社区而开发的全新发行版的诞生了。


    他们需要根据自己的特定需求定制系统，而另一部分人则在深入底层学习并发现基于 Arch 的发行版能做到什么。相比之下，许多 Arch 衍生版通过为每个桌面环境提供
    ISO 来开箱即用的体验，或者使用命令行安装程序。我们提供了一个通用的安装程序来帮助他们完成操作。


    欢迎应用（Welcome app）以及很快我们的网站；还有一组开发者负责我们的社区版 Bway、swamp 和 ARM。新的社区版正在进行中，它们随时准备就绪。


    对于 Calamar 安装程序，我们正与 Calamar 开发者以及目前几个正在使用它的发行版开发者积极合作。对于我们的基础设施、硬件以及对其他 FOS（自由开源）项目的捐赠，我们由世界各捐赠者的资助。我们关注预算，并经常讨论如何明智地使用捐款。我们的社区支付或在使用互联网时支付高昂服务的费用，我们依靠社区的信任，我们的支出透明地显示在我们的
    Open Collective 页面 [2]。


    我必须说，偶尔这会让某些用户认为它和我们的 Arch 衍生版具有相同的开箱即用体验。幸运的是，我们的社区不仅于此，为用户提供了大量的支持帮助他们度过难关。


    LM: EndeavourOS 是如何与 Linux 交互的？


    LM: EndeavourOS 是如何组织和治理的？


    BP: 在软件包方面，没有区别。我们所有的包和更新直接来自 Arch 仓库，没有经过任何修改。Arch 安装和我们之间的唯一在于，除了使用 Calamar
    安装程序外，我们还为用户提供了一些基础内容，如浏览器（Firefox）以及可以工作的网络、声音和系统。它还未达到让用户按照自己的喜好定制系统，而无需安装许多我们可能需要的额外包。这意味着用户从一开始就必须手动操作让蓝牙、驱动程序和设备设置（如游戏或
    NAS 设置）等功能正常工作。


    BP: EndeavourOS 由五位管理员运行：Joe Manuel、Puge、Albis 和我。Fernando 离开去担任了共同维护者，其他人参与项目的时间较少。我负责
    Calamar 的开发，我是我们原生应用的开发者。Puge 和 Albis 是镜像管理员，而我是社区经理兼项目总负责人。


    LM: 你们有关于用户数量和定期贡献者的统计数据吗？


    BP: 定期贡献者的数量显示在我们的 Open Collective 页面上。目前，我们使用由社区成员或非营利组织提供的镜像，以及通过 GitHub 和 GitLab
    发布我们的 ISO。我们还有论坛、Telegram 群组和 Discord 的管理员小组；用于我们的公告，


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_24_0.png)


    LM: 目标用户是什么样的用户？


    BP: 我们的大多数用户可以说一直活跃在 Linux 圈。我们针对的是第一类用户：第一类知道……的用户。


    图 2：Endeavour 的 Xfce 桌面环境，显示着令人高兴的欢迎应用。


    ## 发行版预览 - EndeavourOS


    我们并不要求镜像站提供实际下载；这听起来可能很奇怪，但下载量和镜像并不是我们的优先事项。我们是一群喜欢与社区分享我们工作的狂热者，这是第一次与 Linux
    和 FOSS 社区进行互动。


    旨在为首次使用 EndeavourOS 的用户提供合理的信息。它已经包含了许多对我们在 GUI 似乎有帮助的情况下的用户有益的应用。欢迎应用集成了大多数应用，并只需点击即可使用。


    LM: 计划了哪些未来功能？


    - 然后还有其他小型应用（按顺序列出）：

    - eos-info：关于 EndeavourOS 应用的易用文档（带有 GUI）。

