    ## Privacy with a Home Server


    Two years ago, I wrote an article about the FreedomBox Foundation and how the
    FreedomBox software allows you to set up a private, secure server in your home.
    The project started out with a small group of people, including Morgan, a law
    professor at Columbia University and many others. Morgan was concerned about people
    putting their most personal and private data on clouds and sharing data over public
    networks. Morgan wanted a very small server that could be installed and used at
    home. He talked about it and joined the project. The goals were to create completely
    free and open hardware, with no bloat that could hide traps and Trojans—would
    allow long-term sustainability. Another design goal was to make the software easy
    to install and configure with various privacy and security tools such as TOR,
    VPN, encryption, and others. Over the past two years, FreedomBox has grown across
    many platforms, and they provide preconfigured OS images for many, low power single
    board computers (SBCs), which also serve as virtual machines and emulators. Installing
    and operating on the bare metal of an SBC would be the way I would normally do,
    but an emulator or virtual machine might be much easier. Over the past two years,
    the software has been integrated with the distribution of Debian (Olimex Debian
    10) and is now available on all of the platforms of FreedomBox, as well as free
    SBCs (which require no hardware setup). It is also available on the Beagle Black,
    the Banana Pro, ROCK64, and more. One company has partnered with FreedomBox to
    offer the Olimex isimax, which offers a relatively inexpensive system called the
    Pioneer–FreedomBox SBC. The Pioneer comes with power supply and a choice of three
    different port types, like HDMI and USB2 connectors for a drive, keyboard, mouse,
    and others—as well as an RJ45 Ethernet port, 1GB of RAM, a 32-bit ARM processor,
    and a 32GB microSD card that holds the operating system. It has a lithium battery
