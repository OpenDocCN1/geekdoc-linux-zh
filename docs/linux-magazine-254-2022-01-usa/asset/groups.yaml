    ## 深度解析

    ## Trinity 桌面 (Trinity Desktop)


    通知栏中无法识别的图标或图标上固定的字体大小提醒着人们，Trinity 诞生于一个功能和质量比用户体验更优先的时代。这种在实现流畅性方面的成功，是后期版本能够专注于用户体验的原因之一。


    例如，最新版本中的更改是将 Bookreader（书籍阅读器）更改为 Bookkeeper（书籍记录员），并保留了 KDE 的 Qt 框架以及以 x 结尾的应用程序名称。更明显的是，Trinity
    默认继续使用基于 KDE 的应用程序。它没有安装 Firefox 或 Chrome，而是安装了 Konqueror 作为浏览器。同样，KOHI 也是基于 KDE
    的。这些替换并不糟糕，只是它们逊色于如今常用的应用程序。在 Amarok 播放器方面，使用的是 1.4.10 版本，而最新版本已是 2.971。像 Gimp
    等其他程序则完全没有替代品。现代应用程序是基于宿主机的仓库构建的，而 Trinity 仍然尽可能地保持兼容层级。此外，这些应用程序并没有应用到菜单中。事实上，我想知道的是，Trinity
    是为了提供一个实用的桌面，还是为了成为过去的博物馆？


    一种显然是保留 3.5 最低版本 KDE 的努力，其变化是为了减少 Trinity 迅速老化的外观。


    ## 这一切的原因


    与 GOME 2 相比，KDE 3 的资源来源相当糟糕。GOME 2 被移植到了 Linux Mint 和 MATE，后者一直在这传统与现代化之间取得平衡。2020
    年，LinuxQuest [12] 列出 MATE 用户占比为 8.5%，我怀疑有更高比例的用户会将其列为备选（当主桌面崩溃时使用的桌面）。相比之下，Trinity
    声称份额仅为 1.3%。


    所以，为什么不花精力搞 Trinity 呢？首先，Trinity 就像 Ubuntu 的 Unity、elementary OS 的 Phantom 桌面一样，经常被报道，但没有获得过任何投票。这关乎不是用户份额，而是选择的自由，或者说是极具自由的价值。Trinity
    的故事在于它为一小部分用户提供了他们想要的东西，并提供了永恒的选择。


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_35_0.png)


    **图 2：** Trinity 最新的 2021 年版本看起来仍然像 2008 年的 KDE 3.5。


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_35_1.png)


    ## Trinity 中心 (Trinity Center)


    欢迎来到 Trinity 中心，这是配置桌面环境的中心区域。从左侧选择项目以加载配置模块。


    ## 信息


    - [1] Trinity 桌面环境: https://www.trinitydesktop.org/

    - [2] LinuxQuestions: https://www.linuxquestions.org/2020-linuxquestions.org-desktop-awards-13/desktop-environment-of-the-year-47568734/


    ## 作者


    Bryanfield 是一位计算机记者，也是自由和开源软件领域的自由作家和编辑。除了编写项目，他还在帮助他人生活以及提供在线课程。在时空领域，Bryanfield
    关于 Amarok Coast (https://bryanfield.wordprefix.com) 。他还是 Trinity Pieces 的联合创始人，这是一个关于写作和幻想的博客，地址为
    https://trinitemagazines.com/。


