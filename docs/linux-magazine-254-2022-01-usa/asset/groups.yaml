    # Come Together


    MergerFS is a simple tool for merging disks, volumes, and arrays. By Adam Dix


    Had to make many decisions when setting up my network-attached storage box. I
    needed a method capable of sharing files across my local network with Samba [1].
    I also wanted to be able to use the system as a Plex streaming server and to run
    virtual machines occasionally to test out features. I needed the system to be
    mission critical or high performing. My motivation for setting this server up
    was to learn more about Linux.


    The files I wanted to store were mostly replaceable media files. A high-end file
    system sounded amazing, but it was more than I needed, and ZFS wasn''t really
    financially viable because of RAM costs. I wanted to get the most out of my hard
    disk space, redundancy not demanded. Critical information, however, would be backed
    up to multiple machines or to someone else''s computer, to be precise.


    I also considered using a RAID for faster speed than redundancy. Using a Plex
    and Samba server on a home network would work because the bulk of the data would
    be written once and read occasionally, and speeds of enough magnetic based spinning
    drives would be more than adequate.


    However, one issue was the need to support Windows and the desire to format the
    drives to NTFS, so that in the event of a hardware failure or operator error,
    the drive could be removed and installed in a 3.5-inch external enclosure on a
    Windows environment.


    My frustration began when I was trying to share with Plex in a way that would
    make logical sense to accessing the files on the opposite end. The easiest way
    to do this is to have one re that represents the contents of all the drives, with
    the files scattered across multiple disks and in no particular order, and to have
    no chance of all drives in the same format.


    RAID could have a possible solution to start, but the disks were acquired one
    at a time, with a new disk added when the disks were reaching their capacity (>80%).
    I had never used MergerFS in a way that allowed the owner to install a new disk
    and extend the size of the current pool plus the new disk, but my disks were initially
    set up with NTFS and there were not enough space on one or two disks


    allow for the creation of an array after the fact. Backing up all of the data
    to an online service would be cost-prohibitive. It would be amazing if there existed
    a RAID technology that would allow me to keep the contents of the drives while
    creating the array, but that kind of magic reserved for unicorns in fairy tales.


    The solution to this was MergerFS [3], a tool that lets you combine separate files
    from disks into one single volume sharing all space. You can think of MergerFS
    as an abstraction that works with anything. UnionFS, and MergerFS doesn''t care
    if your drives are formatted to NTFS, FAT3, or if they are in a RAID 1, 5. It
    doesn''t even matter if your drives are in a logical volume.


    MergerFS runs in a FUSE system, and it can be used in all of the ways that other
    systems can, but it is composed of files from other disks - with logic that makes
    it easy to configure the union with scripts and describe MergerFS as a ''union
    of disks''.


    You can configure defining how files and folders are added to the array. Redundancy
    isnt'' prohibited or disabled, but you need to


