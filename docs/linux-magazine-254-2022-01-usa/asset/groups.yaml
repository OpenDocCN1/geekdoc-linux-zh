    # ## Shell Calendars


    To display a calendar, you can use cal or the spruced-up ncal variant, which the
    popular distributions already preinstall. Both programs can be found in Table
    1. Called with the -c parameter, ncal behaves exactly like cal. Figure 5 shows
    the two resulting calendars, which display three months with the week numbers.


    # ## calendar


    With cal, which most distributions preinstall with the bsdutils package, you can
    output the current day''s date in the terminal. If you set the command without
    further options,


    ```

    ubuntu~$ sh listing-04.sh

    Select calendar year


    2020 2021 2022

    ```


    Figure 3: A date entry in the GUI.


    shown in Listing 3, I replaced the standard buttons with my version, resulting
    in different codes (i, z for input). You can see the output of the script in Figure
    4.


    # ## smenu


    Displaying via SSH does not work everywhere; in addition displaying dialog masks
    can cause problems with some terminal settings. However, there is another method
    that you can use to avoid incorrect entries (such as April 31). You specify the
    allowed values with [smenu]

    For the calendar, the user can select the current, and next month in Listing (line
    7). The script shows the days in the week (line 17). To save space in the terminal,
    smenu-n is used to limit to one location. You can use the arrow keys to select
    the day. A cal command (line 16) determines which specifications are permissible
    for it. The script extracts additional specifications such as the month, year,
    and weekday. To make the date-specific digits signify by giving a leading zero
    (lines 19 to 20). Figure 4 shows the output from Listing 4.


    ```

