    ### Donation-Supported Version

    In addition to the standard version, the developer offers a donation-supported
    version. It contains some additional features that the free version lacks, as
    well as a limited update rate. After paying an amount of your choice via PayPal,
    credit card, or girapay, a download link is made available to you. The amount
    determines the length of time you receive updates. For EUR10 (~$12), the donation
    version grants you six months of updates. This gives you two years for a donation
    of EUR40 (~$46), for example.


    You will see functions that are only included in the donation-supported version
    of FreeFileSync, such as parallel copying and email notification, in the version
    configuration dialog as links that you want to use the project for more detailed
    info.


    ### Manual Sync

    ```

    FreeFileSync 11.14 Setup

    1. Install: YES (requires root privilege)

    2. Installation directory:

    3. Create desktop shortcuts: YES

    /opt/FreeFileSync

    Press ENTER to change settings,

    ENTER to begin installation:

    ```

    For occasional synchronization tasks, as those that occur in removable media,
    use the manual variant of the tool, which you call the FreeFileSync starter. The
    routine first opens a window that has a bit of getting used to, with two empty
    lists predetermominating. After the initial configuration, the contents of the
    directory you want to synchronize appear here. To the left of this you will find
    two further segments arranged vertically.


    After selecting the directories, press the large Compare button. The software
    now shows the folders displaying the files it finds on the left and in the two
    right windows at the bottom. The green arrows with the symbols pointing in differences
    between the two folder displays show you which files are being backed up if you
    compare from left and vice versa. The arrow colors green mean the file is being
    transferred from left to right, while a blue arrow points to the opposite transfer
    direction (Figure 3).


