    # ### Donation-Supported Version


    In addition to the standard version, the developer offers a donation-supported
    version. It contains some additional features that the free version lacks, as
    well as a limited update rate. After paying an amount of your choice via PayPal,
    credit card, or girapay, a download link is made available to you. The amount
    determines the length of time you receive updates. For EUR10 (~$12), the donation
    version grants you six months of updates. This gives you two years for a donation
    of EUR40 (~$46), for example.


    You will see functions that are only included in the donation-supported version
    of FreeFileSync, such as parallel copying and email notification, in the version
    configuration dialog as links that you want to use the project for more detailed
    info.


