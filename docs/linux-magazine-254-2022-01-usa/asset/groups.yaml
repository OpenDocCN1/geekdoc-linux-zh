    \ 和 e 上的所有数据。这显示了模式中可以使用任何其他驱动器。每块单独的硬盘将构成阵列。如果你为不同的数据（如电影等）准备了不同的文件夹，并按照我设置的方式进行组织。通过这种设置，如果我在磁盘\
