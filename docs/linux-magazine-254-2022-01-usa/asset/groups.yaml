    于是，Linus 看着地面，用鞋尖在土上踢了踢，转过身对着身后说道：


    > “好吧，我很乐意将指针强制转换为未赋值的 long 类型再转回来，并在指针值的低位进行操作。”


    > “内核并不那么在乎这些理论上的泥潭。”


    > “但我确实反对在不需要的时候进行类型转换——因为只要我们做到，尽可能多的静态类型检查都是越好的。”


    在此时，对话陷入了沉默并结束，Steven 终于说道：“我通过为那个糟糕的结构创建一个单独的头文件解决了这个问题，但它对所有引用都是公开的。”


    他之所以对此产生担忧，是因为 Steven 试图做的事情简直太荒唐了，而且这种处理问题的方式让他非常头疼。他想从内核的其他部分隐藏一些杂乱的代码，以此简化其他维护者的工作流程，让他们在附近工作时不会产生触碰那些代码的冲动。


    然而，通过这种在他看来合理的方式，Steven 在许多实现方式各异的编译器中触发了奇怪且意料之外的现象。正如 Linus 所说，内核并不是一个标准的偏执狂。每当
    Linus 认为标准是错误的，他就会打破标准。但这并不是一个清晰的指导原则。而且并不是每个人在事情似乎需要时，都能绕过规则（或尝试去绕过规则）。


    因此，Steven 愿意放弃隐藏那些疯狂部分的尝试，直到 Jan 必须继续下去。但事实上（我推测）进行这种尝试并学习他以前不知道的知识可能是很有趣的。但这也是在做无功；看起来更简单，即使这意味着要暴露那些其他开发者之后可能会感到困惑的丑陋东西。


