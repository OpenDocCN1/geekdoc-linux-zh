    # Processing Continuous Shooting


    After you have completed the settings, let the camera do its work. In the example,
    I used a webcam with rolling shutter, connected to the USB port. The image data
    is transferred. For a still image, the application reads individual frames from
    a buffer area (Listing 3).


    The image is saved, the focus setting is updated, and the next image follows.
    An inner loop iterates through the focus, whereas, in an outer loop, the program
    moves to the capture positions. Finally, it returns the camera to the starting
    point and asks how to proceed. The file references comprise the directory name,
    project name, a prefix, the camera position, and the focus value, followed by
    the image. This way, each image can be mapped uniquely.


    # Exposure Control


    In conventional photography, exposure is controlled by aperture, ISO, and shutter
    speed, plus white balance and color palette. Table photography is about static
    scenes, so you do not need to influence exposure time.


    Because the webcam''s good adaptation to ambient light, you may use several light
    sources to ensure illumination of the scene. You can do this without the automatic
    mode, especially if leave brightness, contrast, saturation, and gain (compared
    to ISO) at medium values.


    Color is adjusted with white balance; use so not to tweak the settings too much.,
    small changes will give you the best results. Figure 8 shows example of the differences
    between automatic and manual balance.


    The white balance delivers very vivid colors, and the break in the background
    can be still. A color temperature of 5500 Kelvin primes the whites in particular.
    The background is also nearly black to the manual white balance. Some caution
    is required with saturation; otherwise, you can easily go far.


