    # # Synchronize and back up data with FreeFileSync

    Always in Sync


    Many users still fail to back up important data. FreeFileSync automatically synchronizes
    specified folders to multiple storage media on demand.


    BY ERIK BÄRWALDT


    Back up data is still one of the most popular tasks for many users, though it
    is no longer necessary to install and configure special backup programs to do
    the job. In addition, you can save the time-consuming task of backing up entire
    disks or partitions if only some data has been modified.


    multiple windows, it prompts you for the installation path and creates a starter
    on the desktop (Figure 1). You can change each specification, if necessary, by
    entering the corresponding line number, or simply accept the default by pressing
    Enter key.


    Linux offers the right solution for all conceivable backup and synchronization
    scenarios. Whether you want to keep small or medium-sized datasets synchronized
    on two carriers, FreeFileSync [1] is a mature free tool.


    The routine creates two starters on the desktop as well as in the menus. While
    the FreeFileSync entry starts the application for manual synchronization runs,
    the RealTime option opens a window where you can configure synchronization runs.


    # ### Installation


    FreeFileSync can be found in the software repositories of various popular distributions
    and can be conveniently installed, for example, Arch Linux, Fedora, openSUSE,
    Mageia, and PCLinux using the integrated package managers. For other distributions,
    you can download the 25MB tarball, and will find a roughly 27MB binary package
    that installs the software on your system.


    To do this, Setup the options for the installation


