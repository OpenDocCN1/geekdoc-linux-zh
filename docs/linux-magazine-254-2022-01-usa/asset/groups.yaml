    # Parse the system journal with Qjournalctl


    # Quick Plot


    Qjournalctl is a convenient GUI tool that will help you track log data in the
    systemd journal.


    By Ferdinand Thommes


    More than 10 years of development, systemd has undeniably arrived. The system
    does not find approval in the open source community, but discussions centered
    on what was once a very controversial topic have calmed. No matter your stance
    on systemd, it has improved a few things.


    One of the benefits of systemd is its ability to log information, components,
    warnings, and errors. In system, the systemd journal provides much more data than
    conventional log files /var/log/messages or /var/log/syslog have been used for
    decades. In some cases, the journal even metadata that you can use to refine your
    searches. Systemd''s journaling results in a high volume of data that would be
    difficult to handle with conventional text files. With this high volume, systemd
    stores the data in binary files that can be read with the journalctl command.
    Various programs and the kernel write log entries. The systemd journal combines
    these logs and offers various options for finding the information you need in
    a targeted way.


    journalctl does not support all the capabilities available at the command line
    through the journalctl command, but it offers some important options that will
    save you time and help you track real-world problems on your Linux system.


    Qjournal [1] is a graphical interface that allows you to navigate and view the
    systemd journal. Versions of Qjournal are available for Linux, macOS and Windows.


    # Installing


    In distributions based on Arch Linux, you can install Qjournal version 0.6.3 by
    typing:


