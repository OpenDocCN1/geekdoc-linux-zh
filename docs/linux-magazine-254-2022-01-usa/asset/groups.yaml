    # 列表 6：Personal.pcal


    ```text

    01 # 周一显示周数

    02 all Monday in all week Nw

    03

    04 Easter & / is related to Easter 复活节

    05 # * 日期 - 假期

    06 Monday after Easter* Easter Monday 复活节周一

    07 Good_Friday* Good result 圣五

    08 Wh day after Easter* Whit Sunday 圣节

    09 day after Easter* Ascension Day 升天节

    10 Pth day after Easter* Corpus Christi 圣体节

    110 day after Easter * not a holiday 不是假期

    12 # * 名称

    13 day before Easter* Easter Morth 复活节前夕

    14 we day after Easter* Ash Wednesday 圣星期三

    15 th day after Easter* Palm Sunday 棕斋日

    ```


    复活节（参见列表 6 第 4-15 行）。其他节日的用法与元旦类似。你通过固定日期指定节日，如果是公共假期，则加上星号（*）。


    圣诞节可能很复杂，因为 24 号可以是待降节期间第四个星期日（例如，2023 年）。在这里你需要使用 `_` 或类似的符号。这允许 24 号在落在周日时成为待降节的第四个星期日。


    非标准字符可能会导致问题。现代发行版使用 UTF-8 编码，但 pcal 仅使用 ISO-859-15 进行插入。


    默认情况下，pcal 将周日和假期显示为灰色，这使得这些日子在黑白打印中更突出。你也可以使用列表 7 中的代码创建一个仅包含周日和月相的日历视图。图 8 显示了结果。


