    # LINUX FOSSPICKS


    ## FOSSPicks


    自由与开源软件世界闪闪发光的新发布产品


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_81_0.png)


    在 2020/21 年支持了太多延迟的、与技术相关的众筹项目后，Graham 将在 2022 年被各种新奇设备所包围。作者：GRAHAM MORISON


    ## 实时音频播放器


    与基于 Linux 的软件栈一起分类，在软件触发声音到音频启用硬件之间只有 0.5ms（一半）的延迟。相比之下，Mac 自身可以管理许多毫秒，而实时内核会在此基础上再增加许多毫秒，音频延迟在
    10ms 左右，而树莓派是 20ms。这些延迟远大于 Bela 在没有专业硬件的情况下的默认 PulseAudio 配置，后者的延迟通常运行在 100ms
    左右。


    极低音频延迟有着巨大的差异，因为它让 Bela 能够透明地执行各种操作，而不会让延迟及其相关的延迟开始破坏沉浸感。一个很好的例子是，如果你使用 Bela 配合
    HID 驱动程序来创建一个软件生成的鼓组。极低的响应时间将允许你击中触发器并立即听到声音，就像击打真鼓一样。它与 Bela 上看到的其他乐器延迟完全不同，Beagle
    Bone 和音频扩展板确实改变了游戏规则。


    ## Bela


    Bela 是一个具有可靠性能、集成环境、大型活跃社区且几乎没有延迟的可编程音频平台。但它也是一个略显不公平的项目，因为你需要一些困难实现的东西让它正常工作，例如带有可选扩展板的
    Beagle Bone，该扩展板添加了多个模拟和音频输出。我们的系统，当……


    如果没有一个易于获取且易用的破解方法，这一切都不值一提，而且这种方法既对于这种动力是理想的，也适用于你想构建自己的硬件或软件体验时。来自 Xenomtime
    Linux 的高性能，以及灵活性来自于集成的网络托管环境，该环境可以根据你的需求在 Linux 上无缝切换。你可以使用这个开发环境（IDE）用 Python、Csound
    或 C++ 编写代码，或者上传带有 C++ 图形的 Pure 补丁。所有这些软件都可以在任何设备上运行，但在传输到板载设备之前，它们是在哪里开发和测试的呢？对于
    Bela，IDE 也是完美的，而且你将从 unity 库获得立即响应，你可以从中简单的复制粘贴。像 Norm 平台一样，我们锁定了预览，修改变量以更好地在没有额外补丁的情况下从
    Bela 获取代码行，并且构建你自己的应用在没有任何任何程序-示例的情况下都是可能的。示例包括了复杂的数字信号处理（如混响、延迟和卷积效果），以及许多合成器和序列器、音频轨道，并创建可以作为硬件输入项目的示例。


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_81_1.png)


    1. 项目管理：加载并切换各种板载项目。

    2. IDE：编写你的项目，或你上传的项目。

    3. 项目资源管理器：将你的项目上传和下载到 Beagle Bone。

    4. 教程和体验：浏览示例列表以及关于功能和能力的卓越文档。

    5. 引脚资源管理器：可以为每个项目显示设备引脚的注释图。

    6. 示波器：这集成在 IDE 中但连接到硬件。

    7. 日志和调试：项目的输出在单独的窗格中。


    ## 项目网站


    https://bela.io


