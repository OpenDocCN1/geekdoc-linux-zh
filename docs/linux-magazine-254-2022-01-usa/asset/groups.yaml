    # TUTORIAL – SHELL CALENDARS LINUX VOICE


    Appointment Management

    A small good command-line program named calcur, which you will find in the repositories
    of all the popular distributions, lets you manage tasks with deadlines. The simple
    interface is more or less self-explanatory if you have worked with many before
    you will get along with the menu used in calcur right away. You can jump between
    the Appointments, Calendar, and the tab-key, use the arrow keys to reach targets
    in your appointments and calendar. Figure 10 shows the full screen.


    To enter a new appointment, press A and the start time, enter the entry and the
    description (Figure 11). Press CTRL+T to create a new task (Figure 12). Start
    by entering the task, then press Enter, and select a priority. This affects the
    order in tasks which are displayed. Figure 14 shows the appointment and task entries.

    Press P to export your appointments and settings. You can export the calendar
    entries in ICAL or PCAL format or import data into these formats. If you call
    calcur with the -o option, it displays all appointments for the current date on
    screen (Figure 15).


