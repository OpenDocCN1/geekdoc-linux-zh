    ## 教程 – LINUX SHELL 日历


    ### 预约管理

    一个名为 `calcur` 的小型命令行程序在所有流行的发行版中都能找到，它可以让你管理截止日期。如果你用过很多，这个简单的界面就言而易懂了。使用 `tab`
    键可以在预约和日历之间跳转。图 10 显示了完整界面。


    要输入新预约，按 `A` 和开始时间，输入描述（图 11）。按 `CTRL+T` 创建新任务（图 12）。通过输入任务，然后按回车并选择优先级。这会影响显示的任务顺序。图
    14 显示了预约和任务条。


    按 `P` 导出你的预约和设置。你可以以 ICAL 或 PCAL 格式导出日历，或向这些格式导入数据。如果你带有 `-o` 选项调用 `calcur`，它会显示当前日期的所有预约（图
    15）。


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_92_0.png)


    ### IT 亮点

    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_92_1.png)


    由于空间限制，本期没有介绍 `Reminder` 程序：太忙没浏览新闻稿和聊天网站了吗？让我们把最相关的新闻、技术文章和工具提示——直接发送到你的收件箱。


