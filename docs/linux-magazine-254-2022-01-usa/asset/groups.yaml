    # Batch Operation


    Batch files, store the jobs to be executed, are also used to operate database
    sync. They are based on the pre-configured profiles. The dialog for this can be
    opened by clicking the right dock symbol in the menu bar. In the window that opens,
    you can edit the batch job and what should happen to the system on completion.
    You can also specify how the system should react in the event of an error. After
    saving the batch file, it can also be called by a cronjob if needed.


    # Fully Automated


    Especially in larger infrastructures with distributed storage capacities, performing
    data synchronization makes sense. With an automated routine, FreeFileSync can
    synchronize arbitrary directories and datasets. The developers have up this function
    into an independent program window named RealTimeSync, which also opens a small
    dialog in which you can specify the number of folders to perform automatic synchronization
    by either drag-and-drop or typing in the paths (Figure 5).


    In a command-line bar, first define the file to start the batch job you created
