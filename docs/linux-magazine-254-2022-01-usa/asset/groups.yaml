    Linux gaming has come a long way since the early days. In the beginning, it was
    just those first few native games. Then the Wine API brought Windows gaming to
    Linux. Later Steam added support for its extensive gaming platform, and all the
    retrogaming community was keeping the classics of past alive for Linux users.
    The Lutris platform ties these threads of the Linux gaming experience together
    in a single interface. Lutris uses Wine for Windows gaming and also supports the
    Steam, Goc, Battle.net, and Uplay gaming, as well as offering support for native
    games. The Lutris team also takes a special interest in the preservation of classic
    video games from the past. This month we introduce you to Lutris. Elsewhere in
    this month''s issue, we show you how to back up your data with FreeFileSync and
    how to get started with managing your appointments from the command line.


