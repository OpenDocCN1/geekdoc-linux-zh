    # 新闻


    ## Zack 的内核新闻


    ## 别扭的类型转换


    Steven Rostedt 在摆弄奇怪的力量时，觉得内核中的一个特定结构应该被封装在一个私有文件中，而使用该结构的内核部分应该只被赋予它的指针；然而（但并非所有）编译器开始对用户态中尝试引用该指针（即查看它指向的内容，Steven
    已将其渲染为隐藏且不可访问）的行为表示抱怨。


    “我不确定我们是否应该放宽此检查，或者是否有其他方法可以在不需要声明结构的情况下实现相同的检查。”


    然而，情况比这要复杂。引用指针的代码并没有触碰这个特定的指针；它只会解引用任何传递给它的指针。但在这种情况下，结构体的指针是一个秘密结构体，因此与代码通常使用的关注点不同，所以……砰……。


    所以 Mathieu 并不是完全离谱，但他注意到 Cavern 的大锅周围的的一片疯狂。


    Steven 回复道：

    “这真的是一个问题吗？因为你会将其赋值给整数。”


    ```

    x = rcu_dereference(p);

    ```


    “而且如果你没有它的指针，这只是让 ''x'' 变成 ''y'' 的拷贝而不是对它的引用，它只是一个花哨的只读ONLY。”


    但 Mathieu 质疑了 RCU/rcupdate.h 的显式缺点：


    Chronicle Brown 报告了 Linux 社区内的最新消息、困境和进展。


    “考虑使用 RCU 来保护数组中的索引可能很有吸引力，但这种用法并非必要。RCU 保护索引的问题在于，编译器可以从整数中获得许多优化收益，这意味着管理索引访问的规则与实际情况不同。如果
    RCU 索引数组被证明是有价值的（目前为止确实如此），则需要编译器的明确配合来确保其安全。”


    为了修复这个问题，Steven 检查了一堆 RCU 代码，并更改了一个指针声明，使得解引用不会失败。他不需要更精确；他只需要更改它，让引用过程不在乎请求末端是什么。


    具体来说，他将所有的


    ```

    typeof(*p) * _p

    ```


    更改为


    ```

    typeof(*p) _p

    ```


    Paul E. McKinney 的数学辩论被推迟并配备了。另一方面，我想相信在我的有生之年编译器的明确配合将会到来，所以也许……


    作者：Zack Brown


    ## 作者


    Linux 内核列表包含了 Linux 开发活动的核心。流量极其巨大，每天达到 100 条消息，对于个人来说，跟上这种开发规模几乎是一项无法完成的任务。承担这项任务的少数灵魂之一是
    Zack Brown。


    此时，Torvalds 带着一种伪装的批评进入了对话。他说：


    “这说明了我们起初需要 ''typeof(*p)'' 的原因。”


    “在 C 语言的任何正常情况下，函数名应该只代表指向函数的指针，必须”


    - 简单直接，且在任何情况下都是不可避免的；

    Mathieu Denis 指出 Steven 的更改删除了 @p 是指针的声明，因此人们可能会错误地尝试对整数使用 rcu_dereference()，并侥幸通过


    - 添加一个 & ''get'' 来修复指针是其他事情；


    “所以我认为你应该向任何使用其指针的人暴露你的类型。”

    Steven 耸了耸肩，盖上大锅的盖子，然后


    “我会去暴露这个结构。这没什么大，但当可以时我会抽象结构，只需通过防止它们被微调并使灾难性的更新变得困难得多。”


