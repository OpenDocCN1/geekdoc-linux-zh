  mdcn: "\n\n# 深度解析 NAS 的温度追踪\n\n为了查看温度，我在第二个终端中运行了以下命令：\n\n```\n$ sudo smartctl -a\
    \ /dev/sda /dev/sdb /dev/sdc /dev/sdd\n```\n\n图 3 显示了结果。你可能需要运行以下命令使其生成，并由程序本身进行检查：\n\
    \n```\n$ sudo sensors-detect\n```\n\n家用级硬盘（如我正在使用的 WD Blue）温度不应超过 35°C，我的硬盘在测试期间维持在\
    \ 31°C 左右。有些驱动器会压力测试几个小时甚至超过一天，但我的 NAS 存放的是位于控温环境中的非关键数据。CPU 散热器在约 10 分钟后完全发热，温度传感器直接位于上述\
    \ 120mm 进风扇后面，这意味着它们在测试中接收到的是凉爽（冰霜般的）干空气。\n\n人们很容易忘记那些多年来支持开源社区的人，尤其是当你发现自己处于一种宁愿信任那些似乎被诅咒过的硬件的境地时。但我毫无疑问地说，比起那些让我的\
    \ NAS 系统运行起来的硬件制造商，我更感谢让我的故事得以实现的贡献者。为此，我想表达诚挚的感谢，以便你们能穿过这些廉价风扇的声音听到我的声音——谢谢大家！\n\
    \n# 结论\n\n在经历了最近的系统构建后，我可能总结了一个非常重要的教训：当硬盘被覆盖并自动关闭时，系统本身正在进行构建。当你运行服务器、工作站或笔记本电脑时，灰尘并不是什么好事。配合监控程序运行压力测试软件是确保你的系统能够经受时间考验且组件运行最优的极佳方法，拥有备份或可靠性至关重要。我在开源社区中发现的最好的事情之一是，对于想象的一切，都有相应的程序、应用程序或脚本。在我处理的关于这台\
    \ NAS 服务器的所有问题中，软件从未是一个问题。像 `stress`、`hddtemp` 和 `in-sensors` 这样的方便工具易于使用，并为我的系统提供了重要的见解。\n\
    \n# 信息\n\n- [1] stress: https://launchpad.net/ubuntu/+source/stress/\n- [2] hddtemp:\
    \ https://launchpad.net/ubuntu/+source/hddtemp/\n- [3] Im-sensors: https://wiki.example.org/im-sensors/\n\
    - [4] Ubuntu: https://ubuntu.com/\n- [5] Webmin: https://www.webmin.com/\n- [6]\
    \ Cockpit: https://cockpit-project.org/\n\n# 作者\n\nAdam Dix 是一位机械工程师兼 Linux 爱好者，在销售和营销领域尝试了一段时间后化身一名英语老师。你可以在\
    \ EdBudgie Linux (https://www.edbudgie.com) 查看他的一些 Linux 作品。\n\n![](img/28ca43fc7e7266abd9ae8dd9cb34448b_47_0.png)\n\
    \n# 20 周年 LINUX 杂志\n\n# LINUX 杂志\n## 20 周年存档 DVD\n\n# 立即购买！\nhttps://bit.ly/Archive-DVD\n\
    \n![](img/28ca43fc7e7266abd9ae8dd9cb34448b_48_0.png)\n\n# 深度解析\n\nQjournalctl\n\
    \n# 使用 Qjournalctl 解析系统日志\n\n# 快速绘图\n\nQjournalctl 是一款方便的 GUI 工具，可以帮助你跟踪 systemd\
    \ journal 中的日志数据。\n\n作者: Ferdinand Thommes\n\n经过 10 多年的开发，systemd 无疑已经到来。尽管该系统在开源社区中并不完全认可，但围绕这一曾经极具争议的话题的讨论已经平息。无论你对\
    \ systemd 持什么态度，它确实改进了一些事情。\n\nsystemd 的优点之一是它记录信息、组件、警告和错误的能力。在系统中，systemd journal\
    \ 提供的数据比几十年来传统的日志文件 `/var/log/messages` 或 `/var/log/syslog` 多得多。在某些情况下，journal\
    \ 甚至包含了用于精炼搜索的元数据。systemd 的日志记录产生了大量数据，用传统的文本文件很难处理。由于数据量庞大，systemd 将数据存储在二进制文件中，可以使用\
    \ `journalctl` 命令读取。各种程序和内核写入日志条目。systemd journal 整合了这些日志，并提供了各种选项以针对性地找到你需要的信息。\n\
    \n`journalctl` 命令并不支持通过 journalctl 命令行可用的所有功能，但它提供了一些重要的选项，可以为你节省时间并帮助你跟踪 Linux\
    \ 系统上的真实问题。\n\nQjournal [1] 是一个图形界面，允许你导航和查看 systemd journal。Qjournal 有适用于 Linux、macOS\
    \ 和 Windows 版本。\n\n# 安装\n\n在基于 Arch Linux 的发行版中，你可以通过输入命令安装 Qjournal 0.6.3 版本：\n\
    \n```\nsudo pacman -S Qjournal\n```\n\n- 列表 1: Debian 的 libjournal\n- sudo apt\
    \ install qtdbase-dev cmake libjournal-dev pkg-config git\n- wget https://www.libjournal.org/files/0.9/libjournal-0.9-S.tar.kz\n\
    - tar xf libjournal-0.9-S.tar.kz\n- cd libjournal-0.9\n- mkdir build\n- cd build\n\
    - cmake ..\n- sudo make install\n- 列表 2: 从源码编译\n- mkdir -p Qjournal\n- cd Qjournal\n\
    - git clone https://github.com/pentix/Qjournal.git\n- .\n- ./autogen.sh\n- make\
    \ -j$(nproc)\n- sudo make install\n\nGentoo 提供了简单的构建方法。对于基于 DEB 和 RPM 的发行版，你可能需要从源码编译应用程序。开发者提供了——\n\
