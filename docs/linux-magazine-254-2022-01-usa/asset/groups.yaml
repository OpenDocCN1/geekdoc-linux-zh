    - sudo apt install qtdbase-dev cmake libjournal-dev pkg-config git

    - wget https://www.libjournal.org/files/0.9/libjournal-0.9-S.tar.kz

    - tar xf libjournal-0.9-S.tar.kz

    - cd libjournal-0.9

    - mkdir build

    - cd build

    - cmake ..

    - sudo make install


    +   List 2: Compiling from Source

    - mkdir -p Qjournalctl

    - cd Qjournalctl

    - git clone https://github.com/pentix/Qjournalctl.git

    - . /

    - ./autogen.sh

    - make -j4$(nproc)

    - sudo make install


    Gentoo provides an easy build. For DEB- and RPM-based distributions, you might
    need to build the application from source. The developer provides-'
