    ## Linux 新闻


    ## Hive 勒索软件攻击 Linux 和 FreeBSD 系统


    斯洛伐克安全公司 ESET 发现了针对 Linux Linux 和 FreeBSD 系统的 Hive 勒索软件版本。然而，为这些系统开发的加密器仍在开发中，并且存在许多
    Bug。根据 ESET 研究人员的说法，当恶意软件负载使用显式路径执行时，两种加密器都会完全失败。与 Windows 版 Hive 相比，Linux/FreeBSD
    迭代版本只有一个命令行参数。Linux 版本的 Hive 无法触发加密，因为它无法写入其根文件系统。Hive 是一个勒索软件组织，它已经影响了 30 多家机构及其受害者，这些受害者拒绝支付赎金以换回数据。根据
    Fabian Weber 的说法，“大多数勒索软件组织实施基于 Hive 版本的勒索软件的原因是专门针对 ESXI，”而 ESXI 是 VMware 的裸金属虚拟机。由于针对
    Linux 系统的勒索软件攻击不断增加，管理员保持系统更新并使用如 Rootkit Hunter 等工具变得更加重要。有关此问题的 ESET 研究人员的原始
    Twitter 推文，请访问：https://twitter.com/ESETResearch/14541068921667329。


    ## SUSE 通过 SUSE Linux Enterprise Micro 5.1 扩展边缘


    SUSE 长期以来一直提供轻量级的 SUSE Linux Enterprise (SLE)。其企业操作系统的版本是为容器化和虚拟化定制的。但从 5.1 版本开始，它增加了第三种用例：边缘。新的以边缘为中心的功能包括安全设备接入、热补丁以及支持
    IBM Z 和 LinuxOne 实现工作负载现代化的能力。SLE 为扩展性而构建，这意味着当部署在边缘时，用户可以将将其整合到数字化转型中。这些部署可以帮助以任何速度从单体向微服务迁移。


    对于这个新版本，SUSE 首席技术和产品官 Thomas Di Giacomo 表示：“SLE 正在快速成为客户数字化转型的关键基础，一家拥有七位数投资的美国系统集成公司证明了这一点。”Giacomo
    补充道，“他们要在易于维护和更新的不可变基础设施上支持容器工作负载，使他们降低维护成本并扩展基础设施。”在 SLE Micro 发布六个月后，这进一步强调了
    SLE Micro 的企业级就绪性，这是利用 SUSE Linux Enterprise 系列数十年企业级加固技术的结果。


    - SLE Micro 的优势包括：

    - 缩短部署时间并减少手动操作，通过改进安全性实现设备设备和设备的安全接入。

    - 通过内核热补丁，减少每个设备昂贵的停机时间。

    - 快速采用基于微服务的架构的能力。


    了解更多关于 SUSE Micro 的信息，请访问：https://www.suse.com/products/micro。


