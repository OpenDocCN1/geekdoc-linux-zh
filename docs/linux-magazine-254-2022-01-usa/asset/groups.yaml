    ### Batch Operation

    Batch files, store the jobs to be executed, are also used to operate database
    sync. They are based on the pre-configured profiles. The dialog for this can be
    opened by clicking the right symbol in the menu bar. In the window that opens,
    you can edit the batch job and what should happen on completion. You can also
    specify how the system should react in the event of an error. After saving the
    batch file, it can also be called by a cronjob if needed.


    ### Fully Automated

    Especially in larger infrastructures with distributed storage capacities, performing
    data synchronization makes sense. With an automated routine, FreeFileSync can
    synchronize arbitrary directories and datasets. The developers have up this function
    into an independent program window namedTimeSync, which also opens a small dialog
    in which you can specify the number of folders to perform automatic synchronization
    by either drag-and-drop or typing in the paths (Figure 5).


    In a command-line bar, first define the file to start the batch job you created
    or free it that contains the functions for the sync. Pressing the Start button
    in the bottom center of the window shows an icon in the system tray.


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_78_0.png)


    Figure 5: if desired, RealTimeSync synchronizes datasets permanently in the background
    without your intervention.


    ## Conclusions

    FreeFileSync gives you a stable, mature program for synchronizing a variety of
    databases. The software has an easy-to-use interface with a logical structure
    that requires little training. At the same time, it also synchronizes extensive
    datasets that extend over numerous directory levels. Thanks to the option of saving
