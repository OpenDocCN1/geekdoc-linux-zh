    ### Quickemu


    即使是最愤世的云端 Linux 用户也会承认，虚拟机（VM）改变了我们使用电脑的方式。虚拟机提供了独性和灵活性（尽管是有代价），它们损失的比隔离环境少，支持比单一发行版多，但适用于不同的架构。但它们仍然可能远不如直观。VirtualBox
    有图形界面，但它要求你下载相应的镜像、定义它，并使用类似于 Docker 的配置面板来运行它。Multipass 和 LXD 也许是最好的选择，因为它们有自己的镜像支持，可以透明地进行安装和执行，但它们仍然需要你操作工具并知道如何访问已部署的系统。Quickemu
    是另一个可能的解决方案，它仅仅是一个清晰的（封装），当所有技术都存在时列出一个脚本列表。我们的缺点是缺乏时间和技能在后台协调它的功能，例如在无需任何用户输入的情况下下载镜像、USB、端口转发、全双工音频以及
    TPM 仿真。


