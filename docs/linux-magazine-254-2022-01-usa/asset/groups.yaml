    # LINUX 新闻


    《Linux 杂志》（Linux Magazine）是您探索 Linux 世界的指南。每期杂志都装满了在其他任何地方找不到的高级技术文章和教程。您可以浏览我们的完整过刊目录，以查找特定主题或集齐您的收藏。


    ## #253/2021年12月

    # OpenBSD


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_0.png)


    BSD Unix 的历史比 Linux 还要悠，它在自由软件社区中仍然拥有一批忠实的追随者。本月，我们将从 Linux 用户的视角探索领先的 BSD 变体的优势。


    > DVD 包含内容：Tails 4.22 和 Q4OS 4.6


    ## #252/2021年11月

    # 锁定状态！


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_1.png)


    安全格局不断变化，经验丰富的用户知道需要时刻关注那些能提供优势的工具和技术。本月，我们将学习智能卡、硬盘加密，以及一个更精简的 Sudo 替代方案。


    > DVD 包含内容：Debian 11 和 Redcore Linux 2101


    ## #251/2021年10月

    # 从零开始 Linux (LFS)


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_2.png)


    构建操作系统与编译桌面应用程序并不一样。你需要创建一个完整的开发环境——如果你仔细按照步骤操作，你将对 Linux 有更深的理解。


    > DVD 包含内容：Linux Mint 20.2 Cinnamon 版和 Garuda KDE Dr46050 版


    ## #250/2021年9月

    # 内核内部


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_3.png)


    庆祝 Linux 30 周年的唯一方法就是关于 Linux 本身——即我们所熟知的 Linux 发行版的软件集合，但真正的、处于中心跳动的心脏：内核。


    > DVD 包含内容：AlmaLinux Minimal 8.4 和 SystemRescueCd 8.03


    ## #248/2021年7月

    # 将你的 Android 引入 Linux PC


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_4.png)


    UserLand 让你可以在不替换 Android 操作系统的可以在 Android 手机上运行 Linux 应用。


    > DVD 包含内容：openSUSE Leap 15.3 和 Kubuntu 21.04 Desktop


    ## #248/2021年7月

    # 大脑工具


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_94_5.png)


    有时你希望电脑替你思考，有时你又希望电脑让你思考。本月，我们介绍了一系列用于学习和思考的免费 Linux 工具。


    > DVD 包含内容：Ubuntu 21.04 和 Fedora 34 Workstation


    # 特色活动


    用户、开发者和供应商在世界各地的 Linux 活动中汇聚。我们《Linux 杂志》荣幸为您介绍此处展示的特色活动。对于您附近的其他活动，请查看我们在 https://www.linux-magazine.com/events
    丰富的活动日历。


    如果您知道其他您希望我们加入日历的 Linux 活动，请向 events@linux-magazine.com 发送包含详情的邮件。


