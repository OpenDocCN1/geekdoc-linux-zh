- md: "\n# NEWS\n\n## Linux News\n\n## Hive Ransomware Hitting Linux and FreeBSD Systems\n\
    \nSlovak security firm, ESET, has discovered versions of the Hive ransomware for\
    \ both Linux and FreeBSD systems. However, the encryptors that have been developed\
    \ for these systems are still in development and are quite buggy. According to\
    \ ESET researchers, both encryptors completely fail when the malware payload is\
    \ executed with an explicit path. In comparison to the Windows version of Hive,\
    \ the Linux/FreeBSD iteration only has one command-line parameter. The Linux version\
    \ of Hive fails to trigger the encryption because it is not capable of writing\
    \ to its root file system. Hive is a ransomware group that has already affected\
    \ more than 30 organizations and their victims who refused to pay the ransom to\
    \ get their data back. According to Fabian Weber, \"The reason most ransomware\
    \ groups implemented a Hive-based version of the ransomware is target ESXI specifically,\"\
    \ is VMware's bare-metal hypervisor. Because of the continued rise in targeting\
    \ Linux systems with ransomware, it has become even more important that admins\
    \ keep their systems up to date and make use of tools such as Rootkit Hunter.\
    \ Read original Twitter thread from ESET research on the issue at https://twitter.com/ESETResearch/14541068921667329.\n\
    \n## SUSE Reaches Beyond the Edge with SUSE Linux Enterprise Micro 5.1\n\nSUSE\
    \ has offered a lightweight version of SUSE Linux Enterprise (SLE) for some time\
    \ now. Version of their enterprise OS is purpose-built for containerization and\
    \ virtualization. But as of version 5.1, it adds a third use case: edge. The new\
    \ edge-centric features are secure device onboarding, live patching, and the ability\
    \ to enable the modernization of workloads with support for IBM Z and LinuxOne.\
    \ SLE is built to scale, which means users can incorporate the platform into their\
    \ digital transformation, when deployed on the edge. These deployments can help\
    \ with the migration from monoliths to micro-services at any pace.\n\nOf this\
    \ new release, Thomas Di Giacomo, SUSE chief technology and product officer, says,\
    \ \"SLE is rapidly becoming a critical foundation of customers' digital transformation,\
    \ as evidenced by a U.S.-based systems integrator with a seven-figure investment.\"\
    \ Giacomo adds, \"They want to support container workloads on an immutable infrastructure\
