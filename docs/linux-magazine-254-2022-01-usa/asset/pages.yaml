    # System76 Developing a New Desktop Environment


    System76 is never to settle. Consider what they''ve done to the Gnome desktop
    environment with their COSMIC theme. Effectively, the company has Gnome their
    own. But that wasn''t enough, the developers have set to create a brand new DE,
    from scratch, using Rust.

    Why Murphy? Murphy, Pop OS for System76, said, "There are things we are like to
    do that are not possible through extensions in Gnome. Extensions in general feel
    like a bit hack. And what we want to do with our desktop differs from Gnome, so
    it''s not like to merge pop-shell and COSMIC into Gnome Shell which would be a
    welcome thing."

    Although the new desktop will not be a fork of Gnome, the developers plan on reusing
    some of the current Gnome tooling, such as Mutter, Kwin, and Wi-roots. My assumption
    is that it''s likely to see components in GTK for the foreseeable future. "Murphy,
    said, "The shell itself might be lower than a traditional desktop UI toolkit.
    It''ll utilize from the window manager better upon. If a native Rust GUI exists,
    I''d like to use the best tools wherever possible."

    System76 desktop will also be distribution-agnostic, so it won''t require Pop!OS
    to run. Additionally, the developers plan on sticking to (when possible) standards
    by FreeDesktop.

    Don''t expect this new environment to appear any time soon. Because this is a
    brand new project, it''ll take some time. Keep a close watch on the System76 blog
    for more updates (https://blog.system76.com).


    # Hetzner Opens New Location in the USA


    Hetzner has been known in both Germany and Finland as a cloud solution that benefits
    users with low latency and a price/performance ratio that doesn''t put it beyond
    the needs of individuals and small businesses. With a user-friendly interface
    that can be spun up in seconds, developers can get quickly with virtualized Linux
    instances.

    The new US location in Ashburn, is in the heart of one of the most important data
    center capitals in the world, named Data Center Alley. The new Ashburn facility
    is available for all Hetzner cloud servers and offers the full array of Hetzner
    cloud features featuring AMD EPYC Gen 2 Processors.


