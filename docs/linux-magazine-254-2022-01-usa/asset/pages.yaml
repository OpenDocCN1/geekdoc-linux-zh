    Easter (see Listing 6, lines 4-15). Other holidays work like New Year''s Day.
    You specify the holiday with a fixed date, and an asterisk (*) if it is a public
    holiday.


    Christmas can be complicated because 24th can be the fourth Sunday in Advent (eg,
    in 2023). You need to use _ or _before_ here. This allows 24th to be the fourth
    Sunday in Advent if it falls to a Sunday.


    Nonstandard characters can cause problems. Modern distributions use UTF-8 encoding,
    but pcal inserts only using ISO-859-15.


    By default, pcal outputs Sundays and holidays in gray, which makes these days
    more prominent in black and white prints. You can also create an on-calendar view
    with only Sundays and the moon phases, using the code in Listing 7. Figure 8 shows
