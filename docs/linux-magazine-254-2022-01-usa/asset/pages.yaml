  md: '# DOGHOUSE – FREEDOMBOX LINUX VOICE


    # MADDDOG''S DOGHOUSE


    FreedomBox offers a prize, secure personal server that is available on most platforms
    and with its own system from Olimex. BY JOHN "MADDDOG" HALL


    > John "maddog" Hall is an author, educator, computer scientist, and free software
    pioneer who has been famous since 1994 when he first met Linus Torvalds and helped
    to port Linux to a 386 system. He serves as an president of Linux History.


    # Privacy with a Home Server


    Two years ago, I wrote an article [1] about the FreedomBox Foundation and how
    the FreedomBox software allows you to set up a private, secure server started
    over in your home.


    The project started out with a small group of people, including Morgan, a law
    professor at Columbia University and many others. Morgan was concerned about people
    putting their most personal and private data on clouds and sharing data over public
    networks.


    Morg wanted a very small server that could be installed and used at home. He talked
    about it and joined the project.


    The goals were to create completely free and open hardware, with no bloat that
    could hide traps and Trojans—which would allow long-term sustainability. Another
    design goal was to make the software easy to install and configure with various
    privacy and security tools such as TOR, VPN, encryption, and others.


    Over the past two years, the FreedomBox has grown across many platforms, and they
    provide preconfigured OS images for many, low power single board computers (SBCs),
    which also serve as virtual machines and emulators. Installing and operating on
    the bare metal of an SBC would be the way I would normally do, but an emulator
    or virtual machine might be much easier.


    Over the past two years, the software has been integrated with the distribution
    of Debian (Olimex Debian 10) and is now available on all of the platforms of FreedomBox,
    as well as free SBCs (which of require no special hardware setup). It is also
    available on the Beagle Black, the Banana Pro, ROCK64, and more.


    One company has partnered with FreedomBox to offer the Olimex isimax, which offers
    a relatively inexpensive system called the Pioneer–FreedomBox SBC.


    The Pioneer comes with power supply and a choice of three different port types,
    like HDMI and USB2 connectors for a drive, keyboard, mouse, and others—as well
    as an RJ45 Ethernet port, 1GB of RAM, a 32-bit ARM processor, and a 32GB microSD
    card that holds the operating system. In it has a lithium battery that can keep
    the system going for up to three days (useful for


    short electrical outages, as well as a very small metal case with the FreedomBox
    logo.


    Many of the SBCs do not have WiFi, and many people might look at this as disadvantage.
    But you could use a WiFi dongle (or more appropriately) your WiFi router to route
    the data through you.


    For the FreedomBox server, you can use an esATA adapter, which a docking station
    or a small storage device. A new Olimex metal storage bag can hold a 2.5-inch
    SATA storage device. Your Pioneer plugs directly to an esATA connector on the
    card. You can use the best with different storage sizes up to 2TB or 512GB of
    SSD, and you can OR with NO storage—you have left over from other platform or
    device.


    FreedomBox is open hardware. They circuit all data and the information necessary
    to maintain the system far into the future.


    Some people look at the specifications for this SBC and find that it is overpowered,
    or its memory is too small, but it is a server, and for the most part it will
    be 1/8 bound, packing packets of data and pushing them through the Ethernet port
    or out over the internet, WAN or LAN. It needs no fans, makes no noise, and draws
    far less power than an an incandescent light bulb.


    The Olimex includes the SBC card that holds your code and boot, that you access
    the FreedomBox through a web interface, and you do not need any keyboard, mouse,
    or connect directly to the FreedomBox server.


    FreedomBox documentation has become completely free and translated into many languages.
    The documentation is available as a free manual for you or your family) but also
    includes some of the feedback from social media from https://fediverse.party,
    by maddog, GNU social, and others—


    +   1. "maddog" Hall – FreedomBox – Freedom by John "maddog"

    2. FreedomBox: https://freedombox.org

    3. Olimex: https://www.olimex.com


