    In Store, you need to select the desired storage media. The storage media is usually
    Internal Storage or an SD card.


    Many users move the large backups to the PC immediately after they have been created.
    You will find the data on the storage media below /BACKUP//DEVICE ID/ in a directory


    with a date and time contains a system name such as lineage. To restore a backup,
    find the folder in the same location. After selecting a backup, you do it by dragging
    a slider to the right. If a file selector appears instead of existing backups,
    Select Stor between Internal Storage and SD Card.


    A file manager is available on the TWRP screen after you (6). You can access the
    file manager at any time at the bottom of the screen. It is not in immediate but
    it is important to know the contents of the card are found in /data/sdcard1/,
    the aforementioned Tabursa. To delete a backup folder, open it and tap Select
    Current folder. Then tap the delete option (not the top line in Figure 6).


    # Tabursa


    After installing a device of different type, it can be thelinked to Android or
    a new LineageOS version, needs to trigger a factory wipe in TWRP; the Factory
    Reset (Figure 7). All the apps are lost but not the data, as music files or photos.
    Without saying that a backup of this data is recommended, in order to access the
