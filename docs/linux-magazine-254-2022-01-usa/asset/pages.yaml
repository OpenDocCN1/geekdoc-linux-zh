    # Linux on a smartphone with PostmarketOS


    # # Open Call


    The mobile Linux distribution PostmarketOS is a fork of Alpine Linux that supports
    around a dozen user interfaces. By Ferdinand Thommes


    Mobile Linux operating systems have experienced an enormous upswing in recent
    years due to the development of smartphones like the PinePhone and the Librem.
    Around two Linux smartphones exist today, and you can find the most important
    operating systems on the ISO of a multi-distro known as Megi''s multi-boot image.
    Fragmentation in mobile Linux operating system is high, but there is hope in the
    scene.


    The incentive is to counter the duopoly of Android and iOS with something that
    others can use without hesitation. The goal is also about sustainability. Frugal
    users believe that mobile devices need to be supported for ten years, instead
    of dropping out of the update process after two years, which is usually the case
    with Android, and ending up as e. Maintaining [2] is an important key term—the
    term refers to the process of replacing the supplied kernel with a kernel that
    corresponds as closely as possible to the mainline kernel at kernel.org.


    At the center of this development is the open source project PostmarketOS (PMOS)
    [3], founded in 2017 as a fork of the minimalistic Alpine Linux distribution.
    [4] PMOS supports every interface, including KDE, Plasma Mobile, Unity (the UI
    known as Lomiri), Phosh GTK-based Wayland interface developed for Librem, the
    tiling compositor Sway, the Suckless-based Xmmo, Gnome, Mate, and Xce4. Devices
    like the PinePhone or Librem 5 run a mainline kernel out of the box, but the intent
    is


    for all Android devices with PMOS to operate a mainline kernel in the long, if
    possible. PMOS is best known for the PinePhone and Librem 5 phones, but the PMOS
    community supports 14 devices at various stages of usability. These devices include
    the Nokia N900, Wydroid Swift, OnePlus 6, BG Aquos, and Phone64. In addition,
    300 devices are capable of booting from a PMOS image; they have


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_13_0.png)


    Figure 1: Plasma Mobile (left) is one of the most mobile environments for Linux
    smartphones. The phone interface (right) was developed by Purism for the Librem
    5.'
