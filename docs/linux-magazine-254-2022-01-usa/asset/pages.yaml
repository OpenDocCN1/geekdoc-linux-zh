    # KDE Plasma 5.24 Introduces Fingerprint Reader Support


    KDE Nate Graham announced the latest (https://pointgeist.com/con2021/10/02-this-week-in-kde-fingerprint-reader-and-ubiquity.kde)
    Plasma will be receiving fingerprint reader support in the upcoming 5.24 release.
    The support has also been a work in progress for some time, but Devin Lin (the
    primary developer) has finally merged it into 5.24 (https://kde.org/plasma/plasma-desktop/merge_requests/194).
    Now, the fingerprint reader support will allow you to enable and unenroll fingerprints.
    Any enrolled fingerprint can then be used to unlock the screen, provide password
    in app, and sudo without guide usage.


    The developers have created a user-friendly GUI for fingerprint readers, which
    can be found in System settings but will require either a built-in or external
    fingerprint reader. The caveat is finding an external fingerprint reader that
    is fully supported by Linux. Most laptop readers, however, work as expected.


    On another note, KDE 5.24 will also include Wayland support for DRM (on VR headsets),
    as well as support for Nvidia driver''s GBM back end, new features in Spectra,
    a default blurred background for the Overview, and plenty of bug fixes and performance
    improvements. The 5.24 release is scheduled for February 2022.


    # Ubuntu 21.10 Released and Includes Gnome 40


    Gnome 40 has some time. For those who have experienced it, you know the new workflow
    is a game changer. With a much-improved ability to interact with and manage workspaces,
    the open source desktop makes daily usage considerably easier and more efficient.


    Finally, this new workflow arrives in Ubuntu with the 21.10 iteration. If you
    are using Ubuntu 20 on a different distribution, this news is old. But for those
    who prefer to stick with Canonical''s version of Linux, this upgrade is big. Along
    with the new workflow, you''ll also see a new Light theme, which is now light
    gray bar to align with those developers want their apps to look all.


    Another interesting and important feature is that Firefox is now available in
    Snap mode. This means users will receive updates faster than previous iterations
    because Snap gives more control over how quickly the updates can be pushed.


    You''ll also find Linux kernel 5.10, which adds more security (such as the addition
    of the runtime error detector KFENCE), and even more driver support. Ubuntu also
    includes closed source Nvidia drivers. This is a big to for anyone who uses Nvidia
    GPUs and wants to experience the dramatically improved Wayland brings over the
    traditional X server.


    Download your copy of Ubuntu 21.10 (https://ubuntu.com/download/desktop?thank-you=21.10&architecture=amd64)
    and see what it brings. For more information on Impish Hippo, check out the official
    release notes (https://dist.ubuntu.com/impish/release-notes-1915.html).


