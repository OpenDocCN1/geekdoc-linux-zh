    # Installing TWRP on Samsung Devices


    Smartphones and tablets by Samsung do not use the Fastboot loader, which is common
    for Android. Samsung has developed its own Windows Odin for flashing firmware.
    Fortunately, there is a free linux port of Odin; popular distributions have Heimdal
    packages.


    Volume Up+Power boots a powered-down device to Download mode, which expects data
    for flashing via USB. If heimdal-print on the Linux console shows a series of
    messages then communication via USB bootloader is working in Download mode.


    After turning the device off, you can switch back into recovery mode using the
    key combination. Then Odin installs the TWRP recovery image (4) for the model.
    Immediately turn off the device by removing the battery or pressing Volume Down+Power
    for 10 seconds. Once the screen goes black, release the keys and hold Volume Up+Power
    to start recovery mode with TWRP. You will now be able to flash Lineage via the
    recovery process just as you with other Android devices.


    After plugging in the USB cable, first run ads devices to check whether this connection
    with the bootloader launcher is established and describe the program (5). The
    command List installs the TWRP recovery on the partition. The percentage values
    displayed at the command line during the process turns out to be very main thing.
    This means that the operation completed successfully.


    The factory-installed recovery is now overwritten. The option to it to restore
    the state of the system is no longer available. However, you can now back up and
    restore the state of the system with TWRP.


    Use the volume keys to select the currently active bootable partition. Select
    START RECOVERY and RECOVERY MODE. You can start the recovery that you need next
    or make sure the system is working properly. To finish, just turn off the device
    and go back to the home screen.


