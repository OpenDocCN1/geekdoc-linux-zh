    # Quick Install


    For tech-savvy contemporaries, installing an Android ROM like LinuxOS on an Android
    phone is still an error-prone endeavor after years of development. The new swarm
    of Linux simplifies this process completely. You transfer the image to an SD card
    with the boot ROM or a tool like USBStick. After removing the back of the device,
    you insert the SD card into the slot above the SIM card and boot from it. This
    is more or less than testing the Linux version of a distribution on USB stick.
    The aforementioned multi-boot ISO, which includes 15 distributions for testing
    on an SD card, is a good option.


    Once you have stored the multi-boot ISO on the SD card and inserted it into the
    PinePhone or other devices, you will be able to start up and test available user
    interfaces, including PMOS variants like Desktop, Mobile, Phosh, Gnome, and X.
    You can navigate through the menus with the volume rocker and invoke the interface
    with the Start button. At the very first boot, you will find the previously installed
    distribution in the fixed eMMC memory. By editing this, you can create a private
    mode that disables wireless support, the camera, and the microphone.


    This ISO offers the fastest starting point for getting to know PMOS in the PinePhone
    or other supported smartphone. If you prefer to test different distributions individually
