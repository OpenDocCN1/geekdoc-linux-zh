    Linux News


    # Hive Ransomware Hitting Linux and FreeBSD Systems


    Slovak security firm, ESET, has discovered versions of the Hive ransomware for
    both Linux and FreeBSD systems. However, the encryptors that have been developed
    for these systems are still in development and are quite buggy. According to ESET
    researchers, both encryptors completely fail when the malware payload is executed
    with an explicit path. In comparison to the Windows version of Hive, the Linux/FreeBSD
    iteration only one command-line parameter --without permission. The Linux version
    of Hive fails to trigger the encryption because it is not capable of writing to
    its root file system. Hive is a ransomware group that has already affected more
    than 30 organizations and their victims who refused to pay the ransom to get their
    data back. According to Fabian Weber, "The reason most ransomware groups implemented
    a Hive-based version of the ransomware is target ESXI specifically," is VMware''s
    base-metal hypervisor. Because of the continued rise in targeting Linux systems
    with ransomware, it has become even more important that admins keep their systems
    up to date and make use of tools such as Rootkit Hunter. Read original Twitter
    thread from ESET research on the issue at https://twitter.com/ESETResearch/14541068921667329.


    # SUSE Reaches Beyond the Edge with SUSE Linux Enterprise Micro 5.1


    SUSE has offered a lightweight version of SUSE Linux Enterprise (SLE) for some
    time now. Version of their enterprise OS is purpose-built for containerization
    and virtualization. But as of version 5.1, it adds a third use case: edge of the
    new edge-centric features are secure device onboarding, live patching, and the
    ability to enable the modernization of workloads with support for IBM Z and LinuxOne.
    SLE is built to scale, which means users can incorporating the platform into their
    digital transformation, when deployed on the edge. These deployments can help
    with the migration from monoliths to micro-services at any pace.


    ![](img/28ca43fc7e7266abd9ae8dd9cb34448b_9_0.png)


    Of this new release, Thomas Di Giacomo, SUSE chief technology and product officer,
    says, "SLE is rapidly becoming a critical foundation of customers'' digital transformation,
    as evidenced by a U.S.-based systems integrator with a seven-figure investment."
    Giacomo adds, "They want to support container workloads on an immutable infrastructure
    that is easy to maintain and update, enabling them to reduce maintenance costs
    and scale infrastructure." This then, within six months of SLE Micro, underscores
    the enterprise readyness of SLE Micro, which is the result of leveraging decades
    of enterprise-hardened technology of the SUSE Linux Enterprise family.


    +   The benefits of SLE Micro includes:

    - Decreased deployment time and fewer manual processes with improved security
    secure device onboarding of appliances and devices.

    - Reduced costly downtime per device with live patching of the kernel.

    - Capability for the rapid adoption of microservices-based architecture.


    Find out more about SUSE Micro at https://www.suse.com/products/micro.


