  md: '# THE "SHORE CONNECTION" - WJG MARITEL


    # Business Analysis


    Maritel uses technology based on more commonly understood, low cost computer technologies,
    to provide the computer telephony integration and switching. The cost savings
    have been dramatic, and have allowed Maritel to obtain a competitive edge in the
    marketplace, as well as providing better customer service and a robust ability
    to grow in the future.


    # RETURN ON INVESTMENT


    The immediate savings over a comparable solution from a legacy private branch
    exchange manufacturer was $1,000,000 for the call center solution. Because of
    the automation now available, Maritel now has over 30% better call throughput
    and call retention, providing greater revenue for the company. Glen Smith stated,
    "$500,000 is still a significant investment, as compared to the $1,500,000 proposed
    by a competitor. If you just wanted to handle calls you could purchase a lower
    cost regular private branch exchange. The real benefit they derive is the solution
    is customized to their exact needs, and they receive 30% more functionality than
    what they would normally get in the market.\ Ultimately, the 30% better call throughput
    using the system will result in 30,000 more minutes per month of billings for
    the company.


    # RIPPLE EFFECT


    For Maritel''s customer''s major benefit is better customer service, call handling,
    call waiting and more accurate billing of the calls. The function of placing the
    call from the ship will not have changed, yet they will be better serviced. At
