  md: '# Chapter 5


    # PC Switch


    A Lower Cost Standards based Voice Switching does exist!


    PC Switch is different from a regular private branch exchange system in that it
    employs commonly used standardized parts and software technologies built upon
    "industrialized" personal computer. These systems have a lot of redundancy built
    in such as two power supplies, 2 cooling fans, lots of high speed disk drives
    that use redundant array of inexpensive disks (RAID) technology. This technology
    allows you to mirror the data from one set of disks to another, allow for faster
    simultaneous accesses to the data, and have the ability to replace faulty a drive,
    while the system is still running, and have the data that was lost on the bad
    drive reconstructed on the replacement drive, from data redundantly stored on
    the other drives in the system. This dramatically reduces the cost of ownership,
    and maintenance of the switching technology, and greatly increases the capability,
    reliability, and flexibility of the system.


    Interestingly, the UNIX operating system had its beginnings in the telecommunications
    industry, when it was developed by AT&T Bell Labs many years ago. Ironically,
    the UNIX operating system of today provides such a dramatic cost saving, and flexibility
    as embodied in a PC Switch, this technology is competing very well against the
    traditional private branch exchange technology. It is because of these factors
    and successes, the PC Switch is predicted to grow incredibly over the next few
    years.'
