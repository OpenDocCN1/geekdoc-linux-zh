    There are technical challenges to Internet based voice communications.


    A computer on the Internet needs to know the Internet Protocol address (i.e like
    a telephone number) of the other computer on the Internet, in order to send data
    to that other computer. Whenever you reference an Internet site as sco.com, sun.com,
    ibm.com, or scheduledsolutions.on.ca, the site name is cross referenced by a special
    Internet server called a Domain Name Server. The Domain Name server sends back
    to your Internet application the Internet Protocol address. The major central
    clearing house for Internet Protocol addresses is an organization called the InterNIC.
    Its main purpose is to assign Internet Protocol addresses for organizations.


    Although the Internet Protocol addressing scheme was designed to support over
    1 billion Internet Protocol addresses, very large blocks of addresses have been
    reserved for years by large entities such as the US military, universities, and
    large corporations. With the large growth in the Internet, the remaining blocks
    of numbers are in danger of running out. (Currently, there is a revised addressing
    standard under review to solve this problem.) Once an Internet protocol address
    is assigned by the InterNIC, the registration is then propagated around the world
    to different computers. Remember, the Internet is designed to decentralize information
    and command control structures.


    Once the Internet protocol address (or "ip address") - pronounced "eye pea address"
    has been registered to a company or individual with the InterNIC, the Internet
    protocol address can can then be associated with a domain. A domain is a logical
    organization of types of Internet addresses. Examples of domains are, .com for
    commercial enterprise sites, or .ca for Canadian domain, or .gov for US government
    sites. My company, Scheduled Solutions has a site name of scheduledsolutions.on.ca.
    This means there is a site called scheduledsolutions that is registered in the
    Canadian Domain, within the province of Ontario.


    It is up to a system administrator and management to make the decision under which
    domain they wish to register their site. Once


