  md: '# Background


    AlphaNet Telecom⁶, Toronto, Canada, is a developer of UNIX based fax, and Intranet
    based voice communications. Historically, the company has provided their InnFax
    products to the international hospitality industry and with their "follow-me fax
    products” for businesses around the world. AlphaNet is also a telecommunications
    wholesaler with their Mondial Network.


    Mondial technology is significant for three reasons.


    +   1. It dramatically cut costs of voice communications around the world.


    +   2. It also marks a unique point in the history of the convergence of communications
    and computer technology. Both are now possible in the same PC Switch architecture.
    This dramatically reduces the cost of deployment.


    +   3. It will also allow for the growth of many new solutions in the near future,
    since corporate data and voice are encapsulated and manipulated in a low cost
    open standards base technology.


    The savings are both in the technology itself, as well as the method of transmission.
    Instead of transmitting over international tariff voice lines, the cost of transmission
    is restricted to the fixed underlying costs of a frame relay data and asynchronous
    transmit mode networks. In some countries, the international long distance rates
    are subject to the whims of the local telephone monopoly of a particular country.
    Using a very high speed frame relay network bypasses a country''s international
    call rate structure. Long distance calls can also be placed within the same country
    as well, and still be able to provide customers with a significant saving for
    the same reasons. How this achieved is discussed below.


    In September 1996, AlphaNet launched their international Mondial demonstration
    telephone voice network. On January 13, 1997, major steps were taken to lay the
    foundations of the commercial version of the Mondial Network. An agreement with
    Scitor allows AlphaNet worldwide access to frame relay (45 megabits/second) and
    asynchronous transfer mode (622 megabits/second) circuits,'
