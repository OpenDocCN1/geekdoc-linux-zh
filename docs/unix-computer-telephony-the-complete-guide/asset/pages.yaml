    and program logic would be checked to see if she was allowed to take this course,
    and it did not conflict in terms of date and times with one she is already scheduled
    to take. Then the Student Schedule table would be updated, adding her Student
    ID, and Course ID. This is then how the student registration system would work
    in essence. After going through the registration process, and if there was an
    option to fax the result of a query described above, then the appropriate SQL
    statement would be executed, and then results would be sent. A real student registration
    system would be more complex, in terms of rules and access. We will examine a
    case history of a major university’s registration system layer later in this chapter.


    Let us focus on the two published numbers by the university. They have the registration
    line, and the library line. The calls for both applications are terminated on
    the voice processing card within the computer system. The calls are hitting the
    voice processing card in a circular hunt group, allowing the maximum number of
    tries of getting an open telephone line. The call is answered on one of the ports.
    The first thing the interactive voice response software will examine the dialed-number.
    If dialed-number is the phone number for the student registration application,
    the interactive voice response software will execute the registration application.
    Conversely, then the dialed-number is the number for the library application,
    the interactive voice response software will then run the library application.
    Within each application, the interactive voice response software could examine
    the caller-id, and take advantage of that to eliminate any unnecessary prompts.
    The result of using the dialed-number means the system administrator of the interactive
    voice response system does not have to dedicate telephone ports on interactive
    voice response system for specific applications. This means an overall reduction
    on the number of ports for the interactive voice response system, and as well
    a reduction in computer hardware, and software, and most importantly a reduction
    of the number of telephone lines the system requires. After all, the largest potential
    and ongoing cost for any interactive voice response system is the cost of the
    telephone phone charges and the manpower to maintain the interactive voice


