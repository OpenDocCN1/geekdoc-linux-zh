    So looking at the Student table one can find Joanna Dobson, and find her student
    ID number 200637311. Then look for her student 200637311 the Student Schedule
    intersection table and look up the Course time, location, and duration in the
    Course Table using the Course ID. Then using the Course ID in the Student schedule
    you can look up the Professor ID in the Professor table, and relate it back to
    the Professor table. This can report which professor is teaching her classes.
    In order to perform this the following SQL statement would be used:


    ```

    SELECT STUDENT.last_name, STUDENT.first_name,

    STUDENT.student_id,

    COURSE.course_id, COURSE.description, COURSE.building,

    COURSE.room_id, COURSE.day, COURSE.time

    FROM STUDENT, STUDENT_SCHEDULE

    WHERE

    STUDENT_SCHEDULE.student_id=STUDENT.student_id, AND

    STUDENT_SCHEDULE.course_id=COURSE.course_id AND

    STUDENT.last_name="Dobson" AND

    COURSE.course_term="1996 Fall"

    ORDER BY COURSE.day, COURSE.time

    ```


