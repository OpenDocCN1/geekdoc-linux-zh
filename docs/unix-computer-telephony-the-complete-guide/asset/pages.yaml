  pgno: 206
- img_proc: true
  md: '# COMPUTER TELEPHONY INTEGRATION - CALL CENTERS


    centers compounded the complexity and management issues. Adding more to the existing
    systems was not the answer. This would only increase problems at the existing
    call centers.


    The call flow from the remote locations to the call centers was not very efficient..
    There was no computer telephony integration at the time, and they did not have
    the software release levels in the ACD of the Teknekron PBX to perform the screen
    pop functions. Major upgrades to the ACD would be needed to provide this functionality


    Another motivation to use virtual distributed telecommuting technology for Georgia
    Power was the need to comply with the Clean Air Act. In 1992, the Atlanta chamber
    of commerce asked Georgia Power to look into a telecommuting program. As part
    of the effort by the chamber of commerce, it was recognized that there were two
    ways to help reducing commuter pollution. The first is the use of public transportation,
    car pooling and other methods which are employee decisions. The other is telecommuting
    which is manager decision driven. This is largely driven by information resources
    and telecommunications capabilities. The success at Georgia Power was used as
    a model for other companies to use.


    Cars are responsible for 70% of low level ozone emissions, which greatly contributes
    to smog in urban areas. Atlanta is considered to have a low level ozone emission
    at the serious condition by the Environment Protection Agency of the United States
    government, while Los Angeles, California is considered to have an extreme level.
    There are different sanctions and requirements at each of these levels. Atlanta
    has developed a program to come under those guidelines. However, in the spring
    of 1996 ozone emissions were getting worse, because of the growth of the city
    especially in the outlying areas. The 1996 Summer Olympic Games showed that the
    city was able to obtain a 30% reduction in rush hour traffic. During the 17 day
    period of the Olympics, the city of Atlanta was not out of compliance with the
    Clean Air Act. This showed that it was possible to reduce emissions.'
