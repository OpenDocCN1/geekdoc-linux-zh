    becomes unavailable for any reason, the packet stream from Yellowstone, it is
    then routed via another route, let''s say, to a computer system in Johannesburg.
    The routing may be through a mixture of high and low speed telecommunication lines.
    This causes delays, and more importantly breaks up the sound that one may hear
    on the conversation.


    All these factors come into play, in providing reasonable, (i.e. not great) sound
    quality, and relatively low cost access to voice communications over the Internet.


    Would you put up with the cost of having all this computer hardware and software,
