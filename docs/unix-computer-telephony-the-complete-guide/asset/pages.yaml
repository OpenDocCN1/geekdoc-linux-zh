  md: '# THE "INTRANET LONG DISTANCE"

    ALPHANET''S MONDIAL NETWORK

    The "Intranet Long Distance" - AlphaNet''s

    Mondial Network


    In a world where computer and communications technology rapidly changes it is
    very easy to be caught up in the whirlwind and excitement of new technology. Technology
    can be only become an asset when it is used to solve real business problems.


    ![](img/362eeaab106d8805ce9d069d00181098_276_0.png)


    Every so often a new technology shines through the technology storm and fundamentally
    changes the rules. This makes a significant impact on the bottom line. AlphaNet''s
    Mondial Network is one of those cost reducing technologies. Mondial is the first
    worldwide based long distance service that uses TCP/ip technology using frame
    relay transmission to transmit voice, using an Intranet of SCO UnixWare servers.¹60


