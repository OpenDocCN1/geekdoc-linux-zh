    of the UNIX market is standards and choice. There are facto standards which rules
    have been laid down by a major vendor, and the market has accepted en masse. A
    good example of such a standard is the Microsoft Windows interface, or DDI, or
    OLE technologies. Then there are standards that are designed by multiple vendors
    with a common vested interest to help broaden the market and these standards are
    developed through end user input and vendor consultations. Examples of this type
    is the X-windows standards and as Spec 1170 for the 1170 UNIX system calls that
    are now part of the “unified” UNIX kernel. The UNIX community goes further by
    placing the responsibility and certification of specifications into vendor independent
    organizations such as X/Open.


