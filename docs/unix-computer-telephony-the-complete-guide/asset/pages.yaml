  md: '# The "Smart Connection" - Arbinet


    The competition in the long distance marketplace in the United States and Canada
    has resulted in reduced costs for personal and business calls, and driven competitors
    to offer voice mail, caller display, and other value added services to find differentiation
    in the market. For those of us who are fortunate to live in these 2 countries,
    we should count our blessings There are those in other countries who do not enjoy
    our freedom of choice for international long distance. Arbinet is a provider of
    alternative long distance, fax and data services. They work with knowledgeable
    local companies around the world selling international callback , fax and other
    services in South America, and Asia. This case history reviews their technology,
    and shows how large a customer, who shall remain anonymous, has been able to gain
    larger margins and great profits by providing these alternative services to multinational
    accounts. Using an SCO UnixWare platform, Arbinet has able to provide the scalability
    and connectivity to handle such a task, to manage hundreds of telephone ports
    and multiple data and voice protocols.


    # Background


    If you live outside the United States or Canada, the telephone company may be
    the only provider of telephone service and hence its pricing and business policies
    could be monopolistic. These companies are sometimes controlled by the national
    government. They control the rates, and eliminate any competition as much as possible.
    For businesses in those countries it can be very costly to make international
    calls. As you may have anticipated, many countries do not have the same costs
    as others to international calling. This leaves a door open for alternative access
    providers to allow callers to establish international calls at the lowest rate
    between the 2 countries. This is called international call back services.


    Arbinet started business in 1989 in the voice processing industry. In the early
    1990''s the opportunity in international callback developed, especially in the
    area of callback debit card switches. Arbinet has'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# PC SWITCH


    redefined its mission to provide alternate services, of which one of those services
    is international call back. The alternate access products and services are provided
    world wide. In order to provide the alternate services Arbinet migrated their
    switching for debit cards and call back to UNIX based systems on SCO UnixWare.


    Arbin has 2 core platforms. These are called central local nodes, and telephone
    local nodes. The central local nodes are the large PC switches that are the main
    gateways which reside in another country. They can handle up to 7 T1 lines or
    168 telephone lines in a single personal computer chassis. A telephone local node
    is essentially an autodialer that resides at the customer''s side to aid in the
    dialing and setting up of calls.


    In order to provide the international service, Arbinet selects local partners
    in those locations to install Arbinet''s Central Local Nodes. These central local
    nodes are UNIX systems, and they provide the voice and data transmission processing.
    The network is used to move fax, or regular data, and as well to establish international
    calls using a call technique. Remote software maintenance by Arbinet is done very
    easily, since the network makes the equipment as accessible as if the machine
    was in a room down the hall, rather than on the other side of the world.


    Debit Card services in the local market are one of the alternate services. Arbinet
    provides fax services. They are establishing their own network with their central
    local nodes operators, so that packets of information, such as fax documents,
    can be moved from node to node to deliver fax documents internationally, bypassing
    3rd country such as the United States to greatly reduce the transmission costs.
    Sheila Peterson, Director of International Marketing and Sales said, "So if you
    are sending a fax, using the Internet from Hong Kong, the cost of sending the
    fax at the central local nodes, having it moved to the central local node in Paris,
    France and fax it to there, is nearly free. The customer in Hong Kong would pay
    a very small fee to have the document sent." Sheila pointed out that they use
    the Internet as a mover of data, and not for voice calls. Arbinet is not an Internet
    service provider.


