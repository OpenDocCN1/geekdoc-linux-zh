  md: '# THE "VIRTUAL DISTRIBUTED TELECOMMUTER" - GEORGIA POWER


    # The "Virtual Distributed Telecommuter" - Georgia Power34


    How do you maintain cost effective satellite offices to your existing call centers
    without having dramatic incremental costs to deliver software, hardware and manpower
    those locations? If your company or subsidiary is United States owned, how do
    you help your company meet the requirements of the US government Clean Air Act?
    This requires certain corporations of specific size to implement telecommuting
    to reduce ozone emissions caused by staff commuting with their cars. The answer
    is virtual distributed call center technology. Of using this kind of technology.
    Of hard cost savings in this case history is the increased human health that the
    company gains, as a result of forging strong employee company loyalty and provide
    the means to increase employee''s life style and family relationships.


    # Background


    Southern Company is the holding company of Georgia Power, Gulf Power, Alabama
    Power, Mississippi Power, and Savannah Electric. Southern Company is the 2nd largest
    owned utility in the United States. Georgia Power provides the generation and
    distribution of electric power throughout the state of Georgia.


    Originally Georgia Power had nearly 300 different published phone numbers. These
    would terminate at the local offices of Georgia Power throughout the state. As
    the number of customers increased, this did not always provide the level of service
    expected by the public. In order to provide better service Georgia Power built
    two call centers that were linked. One in Macon and another in Atlanta. Although
    Georgia Power is migrating to client-server architecture, the call centers'' main
    database application is based upon CICS interfaces from IBM. The PBX environment
    for both call centers is Teknekron. In order to simplify customer service, Georgia
    Power forwarded calls from the 300 individually published numbers to a main call
    center number, to handle questions such as opening new accounts, high bill complaints,
    general service questions, and to report power outages. With the increase of telephone
    traffic, the interplay of the two different call'
