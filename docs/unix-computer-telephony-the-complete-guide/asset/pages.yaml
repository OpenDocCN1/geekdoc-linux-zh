  md: '# PC Switch International Callback Market implications


    # of PC Switch Technology


    Alex Mashinsky provided some insight as to the market forces at play which will
    change the international callback market. The PC Switch technology provides an
    important fundamental catalyst to this change. This fundamental change will effect
    the overall private branch exchange market. The PC Switch is forecasted to be
    revolutionary as the advent of the personal computer was to the oligarchy of computer
    vendors of the early 1980s. The same revolution is taking place all over again
    with the advent of reliable, scalable, and standards based PC Switch technology.


    Another factor in the international Telecommunications market, is that the organization
    and reconciliation of accounts of long distance changes between countries is going
    to dramatically change. Currently, the International Telecommunications Union
    ITU-T, is a United Nations organization. Its current membership consists of 170
    nations. Its primary goal is to set standards and to help regulate frequencies.
    Alex explained the ITU-T members reconcile their international long distance accounts
    every quarter.


    Because of the low cost, open standards based PC Switch technology, this will
    allow for many new lower cost added technologies and services. The cost of entry
    into the market using PC Switch technology, will be the impetus for countries
    with monopolistic long distance services to open their markets to competition
    within their own markets in the next 2 to 3 years. Alex estimates such changes
    will create up to 40,000 new vendors of long distance telephony services worldwide.
    A dramatic increase from the existing 170! The ITU-T can manage the 170 members,
    but managing 40,000 is a different matter. One of the major challenges is that
    the billing systems will have to reconcile accounts in almost, or in real time
    on a global basis. This is a challenge that Arbinet is working on today. Alex
    firmly believes this is the birth of a multi-billion dollar industry, which will
    grow to be very large in the future.'
