  md: '# INTEGRATED SOLUTIONS


    # General discussion on the RFP response


    One of the interesting outcomes of working with Capri Systems on the RFP response
    was the review of the RFP with an alternative solution, which could reduce the
    the size of the project initial cost, and increase the efficiencies or “critical
    mass” of the solution.


    +   1. As Stephen Dunne said “bidders are sometimes a reticent in their willingness
    to suggest a complete solution than one that was required in the RFP.” The purpose
    of the RFP was more instructional than in of pure economics. It strives to show
    how the integration of different call centers are pulled together into one cohesive
    organization. However, Stephen Dunne pointed out, it may be in Minden Biotech’s
    best favor to cancel the idea of having a dedicated call center in New Jersey,
    and move the trained call center staff from the head office in Minden, Nevada.
    The production and some of the telephony functions (i.e. fax broadcasting of results)
    could stay local in New Jersey, but have all the voice inquiries directly into
    the Nevada office: Since both sites will be on a WAN with production facilities
    at these locations, then to the outside world, the customer will still see only
    one company. Stephen suggested the following could happen:


    +   2. The elimination of the Siemens switch and replace it with a more modern
    Nortel system. He recommends Nortel because of its features, and its general wider
    international support than do other switch manufacturers. Moreover, the Lynx system
    could use Capri Systems’ own middleware solution which would provide much tighter
    integration with the Nortel and the InGenetic solution.


    +   3. Scale of economics. With the smaller call centers in each location in the
    United States, Minden Biotech would not get the scale of economy as it would with
    the centralization of the call center in Minden itself. By centralizing in one
    location, it is easier to manage, and Minden Biotech would reduce ongoing


    316'
  merge: -1
  pgno: 351
- img_proc: true
  md: 'telecommunication, and labor costs. Stephen estimates that the savings for
    the solution for the US, would be considerable amount of the initial cost.


    4. Logistics of call handling:


    +   a) Message waiting lights. In a multisite call center and operations environment,
    it is very difficult to initiate message waiting indication on phone sets between
    locations and between different PBX manufactures across the public switch telephone
    network. The best solution is to provide dedicated lines between locations, and
    this could be expensive.


    +   b) Screen pop transfers. This refers to an agent transferring a screen between
    call centers to another agent or supervisor. Internal screen pop transfers within
    a call center is an important feature, and is in demand more often. To do it between
    call centers is possible, yet again it would most likely require dedicated voice
    and data lines, that can be thoroughly tested and controlled. The major issue
    will be cost versus its need. If there is a need to do this only a few times each
    week, it may not be worth the extra money per month for communication lines and
    support of the systems.


    Stephen''s overall comment is that he positions UNIX based solutions because of
    reliability, and single platform management. His comments are that the customer
    really needs a stable and highly reliable platform, which UNIX provides. In each
    of the call centers in the RFP response, a single Sun workstation is managing
    all the major computer telephony functions. This eliminates the need for dedicated
    systems for interactive voice response that may be the case with other application
    platforms.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# INTEGRATED SOLUTIONS


    # Other potential UNIX solutions for RFP


    In this case, Capri Systems has used the Sun platform, and Linkon

    voice processing hardware. A different system integrator may have

    used an Intel based UNIX solution from which SCO, or Solaris

    may have been the focus. In either case, a system integrator

    inined would have produced a solution comparable to the Capri

    Systems'' solution using Dialogic hardware and 3rd party

    technologies. Alternatively, Capri Systems could have provided the

    son on a SCO OpenServer platform using a Pentium PC.

    Overall, the major challenge of the vendor solution is the ability to

    demonstrate it working at other sites. Moreover, there is an added

    factor that such companies will have to have the resources from

    which to try and test the integration of various products into

    a cohesive solution. This is a real challenge, and it should not be

    overlooked while reviewing solutions.


    In the end, the purpose of the RFP was to raise the stakes quite

    high. I purposefully placed requested technologies such as PC

    switch, and Internet/Intranet telephony applications, which at the

    time of writing are just making themselves known and impacting

    the market. It''s purpose here has been to educate rather than

    decide which is best or who has won. It is meant to provoke your

    thoughts on what is being offered, and moreover to show how

    these components work together to develop a cohesive system. The lesson

    to be taken away is that because of nature of interconnecting two

    different networks together, you as a manager, should be aware that

    not one system integrator, or even a single vendor may meetnell your needs or
    goals. There sometimes has to be unavoidable

    compromises in terms of functionality, integration, and funding.

    R RFP''s ideal is to have a single solution that would feed and

    integrate communications to a single point, where information

    would be platform independent, medium independent, and

    integrated on newer voice technologies. However, judicious review

    of your needs, and keeping an open mind that one of your vendors

    sugget a completely new approach, (i.e. like centering all

    call center functions in the USA, rather than multi-site), is essential

    to success.


    318'
