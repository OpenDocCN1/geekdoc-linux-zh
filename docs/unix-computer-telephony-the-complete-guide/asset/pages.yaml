  md: '# BASIC CONCEPTS OF COMPUTER TELEPHONY


    The reason why I discuss this is to show how relatively simple the machine we
    call the telephone really is - and it has not changed very much in the last 100
    or more years it has been used.


    # Direct Connectivity


    Direct Connectivity refers to how the telephone line is terminated in the computer
    system. A telephone call passes through the telephone company switching equipment
    in a central office in one part of the city, and connects with another central
    office switch in the same city or other locale. The telephone line and call connects
    directly to the back of the computer telephony application. Inside the computer
    there are voice processing cards. These cards understand the hardware interface
    and signaling the telephone line is using.


    Direct connectivity is the simplest form of connection you can have, and sometimes
    most desirable when you are providing an application where you may not need to
    transfer the call after the caller has used the application. A typical application
    of this configuration is interactive voice response, such as banking by phone.
    Sometimes this is an excellent entry level computer telephony application since
    it requires the simplest form of integration.


    The corollary to this kind of connectivity would be for the call to terminate
    on your own private branch exchange or private switch in your office. Then the
    calls would be directed across your switch programming, and eventually would be
    connected to your application on the UNIX system.


    # Call Flow


    Call flow refers to the path along which a call originates and eventually terminates.
    For example, let''s say you want to check the balance of your chequ account. Instead
    of calling your local branch during business hours, you call a number and the
    bank-by-phone system asks you for a customer number. (The bank branch had previously
    sent you information on the service including your customer number and a password.)
    You reply by entering the appropriate digits using your keypad on the telephone.
    The system


    14'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# CALL FLOW


    asks for your password and supply it. The system provides you with a menu of choices.
    You select option “1” and the system provides you with the balance of your account.
    Other options could include transaction history, current exchange rates, today''s
    interest rates, balances on loans. It has the ability to pay bills and to transfer
    funds between accounts, fax you a customized mortgage schedule, or retirement
    plan information. All this happens with real time data and can be done anywhere
    in the world, 24 hours a day, 7 days a week. This describes the call flow which
    on the surface is relatively easy to understand. The call is generated by you
    and routed through the telephone network to the bank''s data processing center.
    In the simplest configuration these outside telephone lines connect to an anphenol™
    block. This is a simple device that provides multiple telephone jack (RJ11 standard)
    inputs on one side, and merges them so that a wide ribbon cable can be attached
    to the back of the anphenol. These anphenol RJ11 blocks are nicknamed “harmonica”
    blocks, since they resemble harmonica. The wide ribbon cable that attaches to
    the back of the harmonica block connects to a voice processing card, which resides
    inside an Intel 486 or Pentium™ PC computer running an operating system like SCO
    UNIX, or Solaris x86 or other UNIX systems. This system has voice processing application
    software. This controls the voice card playing pre-recorded speech and collects
    the input from the telephone''s keypad. It calls upon database software to find
    your chequ account information residing on the bank''s larger computers, and then
    speaks or faxes back, or e-mails the results back to you. In this case the telephone
    acts like a data terminal, from which a bank employee would have gathered the
    information to answer your questions. The fax machine is the equivalent of a printer
    on which the employee would have printed the results.


    # The Mechanics of a Call


    When you pick up the hand set of the telephone you hear a dial tone. What really
    happens is that you pick up the phone and a telephone company''s central office
    telephone switch detects a change in voltage, and then presents you with a dial
    tone. The telephone keypad or rotary dialing method are means of routing a call
    through the telephone network. The central office telephone'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# BASIC CONCEPTS OF COMPUTER TELEPHONY


    switch, or (central branch exchange), collects your routing information in the
    form of pulses or touch tones, and routes the call to another central office switch,
    which in turn sends a ring voltage to your phone to make the telephone ring. You
    pick up the phone, and the electrical circuit between the two telephones is completed,
    and you can speak and hear each other. For our purposes you need to understand
    that the voice we hear on the telephone is really an electrical current which
    is analogous to the real voice that is speaking, if you are talking over an analog
    line as described above. When you talk on a telephone the local loop of wire from
    your home is most likely an analog circuit. Once it has reached the telephone
    company''s central office switching system, the transmission of the conversation
    between central offices is most likely a digital transmission. This is where the
    voice is converted to a series of binary “ones” and zeros”. This is then converted
    back into an analog circuit at the other end. This is most likely the kind of
    transmission in homes in Canada and the United States. Larger companies with many
    lines will elect to rent digital lines that directly connect from the business
    to the central office. Some popular kinds of digital circuits are ISDN, T1 or
    E1 lines. (These are discussed later in the chapter). In some countries in Europe,
    such as Germany, ISDN services are common for both business and home.


    When you use a touch-tone phone you generate a specific frequency of sounds, which
    are outside normal human speech. This is important for most applications. The
    tones you hear when you press the keys 0 (zero) through 9 and * and # are not
    a single frequency of sound. In fact there are sounds being generated together.
    The technical term for these tones is Dual Tone Modulated Frequency or DTMF for
    short. It is these tones upon which most computer telephony applications are built.
    As well, there is special added information that is being sent along with the
    call, which are Automatic Number Identification (ANI) or Caller-id, and Dialed
    Number Information Services (DNIS). This is digital information that is sent within
    a split second after the first ring on the receiving phone line. This information
    tells who is calling, and which number they called. If set up properly, these
    can be valuable tools in applications.


