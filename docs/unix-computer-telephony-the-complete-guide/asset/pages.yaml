    branch exchange (PBX), and then the calls are transferred to the extension under
    human or automated control.


    As an alternative to purchasing and managing your own private branch exchange,
    you can rent from the local telephone company a block of lines directly from the
    central office switch which then terminate to the phones on the office desks.
    You can call another extension as though you had your own in-house switch, although
    your switching equipment could be kilometers away. You can then have all the services
    and support of the equipment performed by your telephone company. You may want
    to rent voice mail boxes from the telephone company, using a voice mail system
    that is usually located beside the central office switch.


    If you want to have your own UNIX based system to provide voice mail, or an interactive
    voice response application or even a call center to provide better flexibility
    and customer management, then you can purchase a system that supports inward dialing.
    Calls destined for the interactive voice response application, would travel from
    the central office to your UNIX computer system in your office. A specific subset
    of the block of telephone numbers would be assigned for that destination. While
    in the interactive voice response application, the customer may elect to transfer
    to a sales person. The call is then taken back to the central office switch (we
    assume here this is an unsupervised transfer), and it is told by the UNIX system
    to try to ring the sales person''s extension back at your office. If the sales
    person did not answer the phone, the call is sent back to your UNIX system with
    a status of call failure, and the voice mail message plays the voice mail for
    the sales person, and the caller leaves a message. (Alternatively, the UNIX system
    could instruct to try a backup sales person).


    The key to the idea above, is that your firm will not have to manage the private
    branch exchange, and yet provide some more customer support that is under your
    direct control. The ability of the UNIX based software to interface with a central
    office telephone switch using direct inward dialing should have all the capability
    you need. Since you do not own the telephone switching'
