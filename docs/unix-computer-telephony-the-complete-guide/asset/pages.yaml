  md: '# HOW DOES UNIX BASED CTI WORK?


    # How does UNIX based CTI work?


    In this section we will review the basic building blocks of computer telephony
    integration, and then delve in how the signaling is achieved between the computer
    and the telephone networks.


    # The Three Basic Building Blocks for CTI


    The nature of “screen pop” in CTI functionality is essentially the same for a
    small CTI workgroup of 5 inside or customer service agents working on a LAN to
    very large call center solutions of hundreds of customer service agents as in
    the Federated Stores FACS case history in this chapter. The same building blocks
    apply for the most proprietary PBX and computer system integration to the open
    standards based UNIX PC switch technology.


    There are essentially three basic components to allow a CTI application to exist.


    +   1. An up to date database and applications is an absolute necessity. This
    is my first priority over all others. All the technology in the world does not
    mean much unless customers can quickly and easily get to their information. Without
    good database integrity, with efficient ease of access, then all other components
    of computer telephony integration are not effective. The key issue for database
    applications such as financial, purchase history, or customer preferences/complaints
    is, if they are not easily accessible for the customer service representatives,
    then the more difficult it will be help support your customers.


    In particular, the problem of “stove piped” applications from different platforms
    and databases that are presented on a single system. Stove piped applications
    are different kinds of applications which only share the screen. There is no coordinated
    database sharing of information. A look up of a customer number in one application,
    does not preserve the pertinent information, which needs to be keyed in again
    by the customer service representative in another application. This defeats the
    reasons for CTI, since the customer will be on the line longer. The solution is
    to make sure the customer’s


