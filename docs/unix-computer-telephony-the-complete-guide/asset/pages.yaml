  md: '# BASIC CONCEPTS OF COMPUTER TELEPHONY


    group is that it usually takes more time to find the next available port to answer
    the call, when the system is very busy. On a busy system the caller will hear
    more ring tones before the call is answered. Usually the reasons for a linear
    hunt group implementation is that this is a restriction on the manufacturer of
    the university private branch exchange, and to allow any telephone call to get
    a busy signal. The system administrator may have such a large call volume, he
    may want to ensure that the call will receive a busy signal once all the telephone
    channels have been tried. If all the ports are busy, then subsequent calls will
    also have received a busy signal. A circular hunt group will search sequentially
    from the first to the Nth telephone port of the system looking for an open telephone
    port to use. If unsuccessful after the first pass on all the lines the call goes
    unanswered, it will start the process over again, and again, until the call is
    answered by a free port. The number of cycles through the hunt group is determined
    by programming the private branch exchange, or by setting software parameters.
    If the call can not be answered after the predetermined number of cycles through
    the hunt group, then the caller will receive a busy signal.


    When one first looks at a computer screen showing the activity of ports on a large
    system, it is fascinating to watch the hunt group in action. The status screen
    will show that there are many different calls happening at once, and each is in
    a different location within the application. Thus they are in various states towards
    call completion. If you are watching a busy system you will suddenly see a telephone
    channel go "Next Call" (status message is totally dependent upon the software
    in use) indicating it is waiting for another call. Then in what appears a random
    act, the unused ports go into use. Related to hunt groups are the port utilization
    management reports that show you the number of calls per hour by port, and the
    number of call minutes per port. These are key to show when the system is the
    busiest during what periods of the day, while the second shows the utilization
    time during the day. These reports are important to indicate if you require more
    hardware and software to cover the increased load on the system, or to make a
    decision to add another application to an under utilized system.


