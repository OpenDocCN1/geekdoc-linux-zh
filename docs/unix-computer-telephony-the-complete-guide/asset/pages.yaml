    # Interactive Voice Response


    The purpose of this section is to tell you what this is, and a little on how it
    works. You should review this section and the previous section on database in
    order to get a real handle on this portion of the technology. We will not elaborate
    the issues here because the chapter on interactive voice response starting on
    page 75 providing you with detailed implementations of the technology. Interactive
    voice response has already been discussed in the sections on database, and speech
    recognition.


    Interactive voice response enables a telephone and/or a fax machine with a telephone,
    to become a computer device connected into the computer system. The call is answered
    by the interactive voice response software which controls a voice processing card.
    It prompts the caller for numeric and even alphanumeric information to be input
    using the telephone keypad. The interactive voice response software can then retrieve,
    change or delete information from a database or other data source. It can speak
    back the information using concatenated speech, or text-to-speech technology.
    It also can send via fax. Delivery can be done by two methods. The two-call method
    asks the caller to input the destination fax phone number and then hangs up. The
    interactive voice response software then calls upon the fax server to send the
    fax on a second call. The other method is called one-call fax delivery. If the
    caller is calling from a fax machine that has a telephone handset, the interactive
    voice response software answers the call in the usual manner. Instead of entering
    a fax number, the caller is asked to press the “start key” on


