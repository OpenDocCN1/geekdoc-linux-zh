    # T1


    T1 is a standard that supports up to 24 digital channels of voice or data, at
    a speed of 1.54 megabits per second. A single T1 can handle up to 670 calls per
    hour, if the average length of call is about 1.5 minutes long, with only 1 call
    out every 100 having the probability of receiving a busy signal. Typical applications
    for large volume needs are call centers, large institutional interactive response
    systems. It is not uncommon to find a UNIX system being used up to 4 T1 lines
    for a total of 128 telephone channels at the same time. There is one case history
    in which the company used specialized industrialized personal computers, up to
    7 T1s have been successfully installed in the same chassis. This is where the
    UNIX operating system demonstrates its reliability and capability to handle many
    things at one time, and be able to scale to larger and larger capacities, and
    it is something that rival operating systems can not successfully manage.


