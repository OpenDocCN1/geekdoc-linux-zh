- img_proc: true
  md: '# THE "HURRICANE TRACER" - UNIVERSAL WEATHER & AVIATION


    In fact, the US National Weather Service, and other party weather companies provide
    raw data and information to Universal Weather for interpretation by their 60 meteorologists,
    and how they distribute that information is the main business of the company.
    The evolution of communicating this information has been by telephone, then by
    telex based services, proprietary computer networks, and now by fax, and Internet
    email.


    One of the advantages of the newer technologies such as Doppler radar information
    from the US National Weather Service, has allowed Universal Weather to broaden
    their customer base from the aviation industry to other industries such as insurance
    companies and utilities. This has allowed for the creation of the NotFax product.


    NotFax is a information service product which allows a customer, for a small monthly
    fee (starting from $40/month) to receive by fax, weather bulletins up to 7 days
    a week, 24 hours a day, without any intervention or action by the customer. Although
    the format of the individual bulletin can be customized, the number, type, and
    nature of a bulletin can be customized for the customer in a customer weather
    profile, which is stored in a database. Fred Rogers, of Universal Weather & Aviation,
    said, "Snow, wind, heavy rainfall watches and warnings, tornadoes, and a whole
    spate of hurricane watches and warnings, which appeal mostly to the coastal companies",
    are examples of the kinds of information that can be associated with a customer''s
    profile. After the data from the different weather sources has been analyzed by
    the meteorologists, or a weather advisory for a specific area is generated by
    the US National Weather Service, the information is then cross tabulated with
    the requirements of the customers profiles, and the appropriate information is
    prepared and scheduled for faxing or by email.'
