    Speech reproduction is achieved using two methods. One method is speech concatenation,
    while another is text-to-speech. We will review the reasons why and when the two
    methodologies are used. The first uses recorded speech, while the latter is the
    opposite to speech recognition technology. Text-to-speech technology takes strings
    of text and numbers stored within the computer, and converts it to speech.


