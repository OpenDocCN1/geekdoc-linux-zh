    Currently Arbinet has about 1 dozen central local nodes around the world, with
    the majority in Asia and South America. There are many committed systems for these
    markets which will be established in the coming months.


    Sheila stated they believe that they are operating, at the time of writing the
    world''s largest PC with 8 T-3 lines. A T-3 is also known as a DS3. Each T-3 is
    equivalent to 28 T1 lines. A T1 consists of 24 telephone channels. Therefore Arbinet
    has 5376 lines configured in a PC Switch cluster of central local nodes. This
    is housed in multiple SCO Unix Systems at their head office in New York city.
    Alex Mashinsky, president of Arbinet, estimates that by late 1997, they will be
    operating over 500 T1 lines. The international central local nodes are directly
    linked via high speed communication lines to the New York office. This allows
    them to pass telephone call back routing traffic information between all central
    local nodes around the world. Moreover, the remote support management of the international
    local nodes can be easily done through these links from New York, making, in effect,
    a virtual PC Switch that spans the globe.


    # System Overview


    The central local nodes overseas provide not only lower cost international call
    back and enhanced fax services, they also are designed to avoid the local public
    telephone company from blocking calls going to the system. The methods used to
    block calls involve screening out information about the call itself that helps
    the international call back service route the call.


    Arbinet complies with local regulations by having regular calls terminate onto
    a central node. Information is supplied to the central local node to indicate
    what phone number is calling, and the phone number in the remote country they
    wish to speak with. This information is usually submitted to the central local
    node by a transparent local node installed at the corporate office of the subscriber.
    The transparent local node is a sophisticated dialer that provides this information
    to the central local node. From a subscriber''s point of view, he or she only
    had to pick up their phone and dial the international number they wanted, a message
    is


