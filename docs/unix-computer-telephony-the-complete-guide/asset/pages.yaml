  md: '# COMPUTER TELEPHONY INTEGRATION

    WORKGROUPS


    There are 3 standards that have been used in the market, each vying for domination.
    The first standard is called Telephony Application Programming Interface (TSAPI),
    and was developed by AT&T. This standard was later implemented for commercial
    by Novell server, who developed software drivers to allow workgroups to do screen
    pops, working with AT&T private branch exchanges. This has met with moderate success,
    and since Novell sold its UNIX rights to the SCO in 1995, this has not been ported
    by Novell to UNIX. However, it is possible that your UNIX system be the database
    host in your network, and that you have a Novell server that can talk to the UNIX
    systems. This could allow TSAPI to be used on the Novell, to access both the database
    information, as well as the interface to the switch for screen pops. The factor
    with this technology is that it is computer centric. The Novell server speaks
    to the private branch exchange and then directs the calls as much as a larger
    call center.


    Another standard is TAPI, which is Microsoft''s foray into the market. The difference
    here is that the technology is desktop oriented instead of server oriented. (Although
    recent emerging changes to the standard will see server branch configurations
    emerging with Windows NT.) The desktop talks talks directly to the switch, using
    software loaded on the personal computer. Generally, this technology has not been
    adopted in a UNIX environment, other than like the Novell solution. The UNIX system
    hosts corporate data that is accessed by the client personal computer for screen
    pop capabilities.


    Then there is another technology, which is used by Dialogic''s CT-Connect middleware
    which supports Computer Supported Telephony Applications (CSTA) standard interface,
    for those switches that support this interface, as well as TSAPI, and TAPI technologies.
    The SCO and Dialogic announced on October 8, 1996, that they are working jointly
    to port CT-Connect to SCO UnixWare, and the product will be ready for shipment
    in 1997. This technology will allow UNIX developers to write applications with
    a middleware product, that scales from the small networked workgroup to the large
    call center solutions.


