    # Summation of Market Driven CTI Application Programming Interface Standards


    There has been two forces at work that have allowed and enabled the market driven
    standards for CTI.


    +   1. The move from large mainframe centralized applications to client-server
    architectures. The software applications have to be engineered to meet the needs
    of computer-telephony. In some large mainframe applications were not suitable
    for computer telephony integration, even though the return on investment was very
    attractive. The advent of client-server applications and 4GL distributed database
    systems have allowed for the easier deployment of computer telephony applications.⁴⁹
    This can be seen in the use of the Teloquent installation for remote clients for
    Georgia Power in the case history in this chapter. They found that it was more
    efficient to support remote in-house or remote offices because of the ability
    to use ISDN and individual client-server systems, than it would have been to install
    all the communications hardware for a CICS database application and as well the
    telephone circuitry. They could do it with the older system, but the incremental
    cost would be much higher.


    +   2. Economics: The CTI automation has a proven track record of providing an
    identifiable economic benefit. Hence the need to provide this to a large standardized
    computer market has been the major impetus to the development of market driven
    standards.'
