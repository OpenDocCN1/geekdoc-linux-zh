    # The "Orient Express" - Kowloon-Canton Railway

    Corporation


    Imagine having 12 freight trains per day bringing about 150 railway cars of cargo
    arriving from the People''s Republic of China (hereafter referred to "the Mainland").
    How you handle the many inquiries about the expected delivery of these goods?
    How do


    ![](img/362eeaab106d8805ce9d069d00181098_134_0.png)


    you maximize the delivery while minimizing traffic for picking up

    t cargoes at the freight terminal? Managing a railway is a complex

    business. If the railway can use any automation to help their

    custom obtain their cargo faster and easier, the less expensive it is

    of all involved. This case history shows how UNIX computer

    telephony solutions do not have to be high density, large

    installations to make a significant impact. Rather a small number of

    interactive voice response ports, hosted with the main database

    application, is the type of solution that can be easily integrated,

    providing a significant payoff.


    # Background


    The Kowloon-Canton Railway Corporation (KCRC) was started

    in 1911 to provide transportation between the Mainland and Hong

    Kong. Kowloon is a city of Hong Kong on the Kowloon

    Peninsula opposite the island of Hong Kong, located on the

    southeastern coast of the Mainland. The rail link to the Mainland

    was closed after the communist government took power in 1949.

    it was reestablished in 1960, and is now a vital link between the

    manufacturing plants within the Mainland and the financial and

    shipping center of Hong Kong. “The KCRC in Hong Kong is a


