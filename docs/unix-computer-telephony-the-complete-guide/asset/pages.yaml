  md: '# THE "REGISTRAR" - YORK UNIVERSITY


    # Call Flow


    The students receive a notification by mail of the date and time of a registration
    window in March. The registration process starts in


    ![](img/362eeaab106d8805ce9d069d00181098_146_0.png)


    2-7 Call Flow: IBM DirectTalk/6000 registers 40,000 students at York University
    in Toronto, Canada.


    Mid June and ends about 6 weeks later at the end of July. By that time about 80%
    of the Students have been registered. The system allows students to register for
    courses from any touch-tone phone. The window they have is 2 hours in length.
    This means they must be able to call the system within that time frame in order
    to reserve their courses. If they miss the registration window they have been
    assigned, they are allowed to call back the same day for a very small period of
    time, or call back on the following Saturday. By the end of August up to 90% (36,000)
    of the students have completed their first registration using the system. From
    August to the first week of September, there is a designated free flow period
    where course add, changes, and deletions can be made on a first come basis to
    the student body.


