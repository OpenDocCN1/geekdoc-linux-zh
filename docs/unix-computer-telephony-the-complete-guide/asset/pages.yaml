    Registration interactive voice response system. When the student called in, the
    caller-id was matched in the database. Recognizing that it was a unique phone
    number in the Student table, it would eliminate the prompt for the Student ID,
    and ask for the password. Once password is verified against a security table not
    shown above, then would ask for which courses she wanted to register, one at a
    time. She would enter the Course ID. It would be verified that it exists in the
    Course table,'
