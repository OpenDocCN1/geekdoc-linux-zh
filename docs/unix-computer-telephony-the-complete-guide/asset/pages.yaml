    of automation to increase sales, and lower costs, and provide greater customer
    service. One of the challenges in the market has been providing seamless as possible
    integration between these different kinds of products, and be able to handle the
    interfaces to the proprietary nature of the private branch exchange systems. This
    is a need which in the past 2 or 3 years has been addressed by companies such
    as Dialogic, with their T-Connect, Aurora Systems, and Genesys Labs with their
    T-Server software. These products are called "middleware" and they provide the
    interface and glue between the applications as interactive voice response and
    database applications that use screen pop for both inbound and outbound calling.
    Some manufacturers of private branch exchanges provide all this in a "soup to
    nuts" approach. They will sell you the switch, and then provide a proprietary
    interface from which you can program your database applications to the screen
    pops. This is the most traditional use of the technology. You will see in some
    of the case histories, that companies have opted out for the more open middleware
    solution. If they outgrow their switch, they can move to another manufacturer
    or switch, and they do not have to change software and retrain people to make
    the system work for them.


    # Computer Telephony Integration Workgroups


    You may think that all this technology is great, but it sounds far too expensive
    and too tough to handle for a smaller business or smaller workgroup within a corporation,
    such as a technology help desk. The technology infrastructure is networked computers,
    and a computer acting as a server connecting these systems together. You may have
    only 5 people in the sales department, or customer service department. How can
    you use this technology and still afford it and show a good return on investment?
    The concepts of workgroup computer telephony integration are centered over the
    area of networked computer, and making the private branch exchange a network device
    to provide the call handling and routing. The key issues in this environment is
    providing the control software between the workstations and the private branch
    exchange.


