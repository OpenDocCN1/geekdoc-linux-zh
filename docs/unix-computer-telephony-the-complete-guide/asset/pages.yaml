  md: '# PREFACE


    What this book is really about -- and I think John agrees with me on this one
    -- is running a more efficient, more customer-focused, more trouble-free business
    in an era when all three qualities are needed for success. And I don''t believe
    there is any operating system that compares with UNIX systems in helping to build
    such business


    Given that John has targeted non-technical managers as a key audience for this
    book, let me offer a little history. The UNIX operating system and telephony work
    together so well because the UNIX operating system was designed by the telephone
    company, back in the days when meant AT&T and only AT&T. Ma Bell built the UNIX
    operating system to control both telephone equipment and run its business applications.
    At the time, AT&T was prohibited from entering the computer business so it gave
    the operating system away, mostly to colleges.


    So several generations of young programmers have learned UNIX systems and helped
    improve upon it. It''s a process which continues to this day. My company''s contribution
    has been to popular UNIX operating system on Intel-based personal computers. People
    who want UNIX operating system to run on their Pentium machines come to SCO. Alternatively,
    they can invest in larger UNIX servers from Sun, HP, and IBM. SCO has been very
    successful in providing many core technologies such as X-Windows. Moreover, SCO
    has been very successful in computer telephony systems, as evident within this
    book.


    One great thing about UNIX systems is that it''s been around a relatively long
    time -- at least by computer industry standards -- is used to run on some of the
    biggest and most complex business applications. Microsoft is making a lot of noise
    about its Windows NT operating system, a newcomer compared to UNIX systems. Someday
    NT may offer the reliability and scalability as well as the wealth of talented
    programmers and administrators who already exist in UNIX systems. But that''s
    years in the future and your business needs a hot telephony solution right now.


    If that''s the case, I don''t see what choice you really have. The The UNIX operating
    system is the only operating system that really'
