    Each point of presence is a AlphaNet Mondial computer that has both regular voice
    voice card technology to interface with the local regular telephone network, as
    well as, AlphaNet''s own software technology that moves voice over its own network
    to another point of presence in a foreign country, where the process is then reversed.
    As a user of the Mondial network, you place a call as you would with any other
