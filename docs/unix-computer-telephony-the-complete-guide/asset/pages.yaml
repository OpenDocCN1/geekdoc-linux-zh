    functions that are available to the legacy PBX systems at each location.


    If a call needs to be handed off to voice mail, or a fax needs to be delivered
    to a voice mail box owner, then the Octel system would manage that office messaging
    system. Corporate email would also be integrated, and for those that have access
    to integrated messaging services they would be able to access all these messages
    either via phone, or through the use of a computer system running Octel''s integrated
    messaging services on Windows based technology.


    The management advantages is that that no matter which site has what kind of PBX,
    and version of UNIX operating system, it will allow Minden Biotech to have a common
    management and computer telephony integration at each location. Once this foundation
    is laid then the integration of the US based call center could take place.


