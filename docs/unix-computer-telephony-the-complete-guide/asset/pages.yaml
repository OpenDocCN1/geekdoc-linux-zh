    looks to see if there is a free line between the computer system and the switch.
    If there is a free line, the voice mail system then picks up the line (goes “off-hook”),
    and gets a dial tone from the switch. It sends a special string of touch-tones
    represented by the numbers on the telephone key pad such as #7546. The *#7546*
    may mean that the switch is to transfer the call to 7546. The switch now dials
    extension. After trying 3 or 4 times to reach that extension without response,
    the call is transferred to the voice mail system hunt group with “#7546”. The
    voice mail system answers this internal call, looks for the special codes, and
    listens to the party at extension 7546 is not there, and please play the mailbox
    owner’s personal greeting, and accept a recorded message.


    The signaling here is completely done by the tones played back and forth between
    the equipment. It is not very advanced technology, since the signaling is no different
    than one beating on a drum to provide information. The physical interface is just
    a regular analog telephone line. There is no other way to say what to do with
    the call.


    In this description we demonstrated something that should be explained further,
    which is the difference between a “supervised transfer” and an “unsupervised transfer”.
    These kinds of transfers are totally dependent on the ability of switch’s software
    and to some degree on the limitation of the computer telephony software.


    You may think at first that the term “supervised transfer” would be the best way
    to handle a transfer, while an “unsupervised transfer” would mean that there would
    be more overhead. It is quite the opposite. If you were purchasing a voice mail
    system, (or other computer telephony application that required calls to be transferred
    somewhere else), then you would want to try to get unsupervised transfer capability.
    What we described above was an unsupervised transfer. Once the caller entered
    the extension number he or wanted to reach, the switch went off hook, and sent
    the *#7546* to the switch, and then hung up the line. The switch then did all
    the dialing of the extension without the voice mail system’s direct control, and
    the caller heard it ring the 4 times with a


