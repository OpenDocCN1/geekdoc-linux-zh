    \ a special T1 card that resides within the computer that holds the voice processing\
    \ cards. When the calls arrive from the outside world, they are sent to the hunt\
    \ group in the university's private branch exchange or T1 card within the interactive\
    \ voice response computer. A specific subset of these 24 channels can be dedicated\
    \ to a specific function. Those lines are designated a 'hunt group'.\n\nHunt groups\
    \ can be designed to be either linear or circular. A linear hunt group means that\
    \ when inbound calls are received, the private branch exchange or T1 card will\
