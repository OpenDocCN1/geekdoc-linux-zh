  md: '# Glossary


    DOS A computer operating system originally developed by Microsoft Corporation
    for the IBM PC. The acronym means Disk Operating System. It is software that controls
    the computer resources and schedules other programs to execute. It was designed
    as a single taxing operating system, allowing one task to be operated at one time.


    IVR Interactive Voice Response: One of the major Computer Telephony application
    classes of programs. A caller is requested to enter digits from the telephone
    keypad or in some instances speak phrases into the phone, in response to recorded
    phrases. This information is then analyzed and usually processed against a database
    for correct response. Then the caller is presented either with a menu of choices
    or the requested information can be spoken, faxed, or ever emailed as a text message
    to the caller. An example of interactive voice response application is banking
    by phone, to provide balances, transaction history, and current exchange rates
    to a caller. The benefit of this technology is that it frees up staff from regular
    questions to do other work. IVR is used in conjunction with other computer telephony
    applications, such as call center or computer telephony wellknown applications.


    LAN A Local Area Network (LAN) allows computer users in each office to share and
    print information amongst other users in that office. This is achieved by joining
    computers through a network of cabling and associated software. The software includes
    the protocol that is used to move the data through the network. The most common
    software protocol used with UNIX is TCP/ip. The Internet networking protocol is
    TCP/ip based. You do not use TCP/ip itself as a user application program. It runs
    behind the scenes moving data between the computers on the LAN or WAN systems.
    You may have used an application uses TCP/ip for networking as a world web browser
    to ''surf'' the Internet, or from FTP (File Transfer Program) or Telnet for terminal
    emulation'
  merge: -1
  pgno: 442
- img_proc: true
  md: '# GLOSSARY


    Usually the LAN consists of two types of different systems. These are called server
    based, and Peer-to-Peer systems. The server architecture consists of one computer
    that is dedicated or not dedicated to providing the file and print services for
    all other computers that are linked to it. A UNIX system is used as a non-dedicated
    network server. This means that many computers can use its resources at the same
    time, while it can perform tasks not related to managing the network, such as
    being a communications server for voice and fax, and as well as a database server.
    Moreover UNIX systems can be configured to be the main server in a LAN or to have
    UNIX servers working together in a Peer-to-peer architecture. Peer-to-peer systems
    have no one system that dominate within the LAN. All the computers in the network
    have the ability to share data and print services on any one computer in the network.
    In order to maintain the sanity of the system administrator who maintains and
    troubleshoots LAN problems, there will be some type of data, printing and network
    discipline enacted for the network for every user to follow. This is especially
    true with the nature of Peer-to-peer LANs.


    Scalability. A computer term that describes the ability to easily scale the hardware
    and/or software of a computer system. This allows the owner of the system to simply
    add more computer hardware processing capability, or software licenses to an existing
    system with minimal downtime of the computer system itself.


    WAN A Wide Area Network - A Wide Area Network is a system of networked computers
    which are usually geographically located apart from each other. For example, a
    company may have an office in Toronto, Canada and another office located in Los
    Angeles, United States of America. Each office would have a network of computers
    usually referred to as a Local Area Network or LAN. A LAN allows computer users
    in each office to share and print information amongst the computer users in that
    office. A WAN refers to the communications architecture that bridges two or more
    LANs together, so that users in any one user in one city or locale can utilize
    and share the computing resources and in another.


    408'
