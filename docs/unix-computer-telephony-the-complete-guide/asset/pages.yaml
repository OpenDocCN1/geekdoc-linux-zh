    of cargo. These costs involved having trucks, drivers and loaders wasting time
    before they could pick their cargo. Staff in the customer service department were
    taking over 100 calls per day to help customers identify customer pickup times.
    This distracted them from solving more pressing and urgent customer service problems.


    The Kowloon-Canton Railway Corporation prides itself on excellent customer service.
    Percy Yeung, Freight Operations Officer (Planning), for Kowloon-Canton Railway,
    said they realized could solve the problem by providing customers with timely
    information of a schedule to pick up their cargoes. Customers can make inquiries
    24 hours a days week, in order to obtain the timely information they needed. Percy
    Yeung said, "There were many interactive voice response systems in the market.
    Our goal was to adopt the one which could link our online database on SCO UNIX.
    Most of the interactive voice response systems could not economically synchronize
