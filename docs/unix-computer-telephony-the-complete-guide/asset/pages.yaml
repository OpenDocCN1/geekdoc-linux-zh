    24 hours 7 days a week. The company expects this configuration

    will be replicated at the different locations over time. The new

    interactive voice response system will allow the callers to transmit

    the results by PGP encrypted email to their previously

    authenticated email address on file within the Infinix database.

    The authentication process to set up the accounts is controlled by a

