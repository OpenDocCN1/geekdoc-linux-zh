  md: '# Foreword


    Harry Newton, the world''s leading publisher and noted speaker of computer telephony
    integration technology, had just completed an informative and entertaining speech
    on the importance of the convergence of computers and telephony at the outdoor
    quarry amphitheater at the University of California at Santa Cruz. It was late
    August, and he was the keynote speaker of the last day of the SCO Forum9. After
    finishing the speech, a small group including colleagues, SCO staff and myself
    gathered around Harry, standing under a pine tree at the back of the amphitheater.
    Harry showed us the cover of his next issue of Computer Telephony Magazine - the
    famous “Teaching Pigs to Fly” issue, which he discussed the closed architectures
    of PBX manufacturers.


    Harry turned to the assembled group and asked “Why UNIX for computer telephony?”
    The conversation turned to the ability of the UNIX platform compared to other
    operating systems of the time. After I was temporarily distracted from the conversation,
    I heard Harry ask, “Would someone like to write something on why UNIX is a good
    computer telephony platform?” There was a moment of silence by all who were now
    looking at Harry. There was only a slight hesitation on my part, momentarily wondering
    why everyone was so stone faced silent. I immediately thought I could write something
    on this subject. So I volunteered by literally stepping forward towards Harry
    saying, “I will,” thinking I would really like to write an article for his magazine.
    What I had not realized that Harry had asked “Would someone like to write a BOOK
    on UNIX based computer telephony integration?” After realizing my ‘mistake’ -
    and it was my mistake alone - I kept my commitment to Harry, whose support throughout
    the project has been absolutely wonderful. My computer telephony adventure took
    a much different path than I had ever expected it would - all very much for the
    better.'
  merge: -1
