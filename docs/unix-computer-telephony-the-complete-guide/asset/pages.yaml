  md: '# BASIC CONCEPTS OF COMPUTER TELEPHONY


    # Hunt Groups


    The inbound calls are not stacked in a queue behind each other unless there is
    a special mechanism within the switch, called automatic call distribution, that
    puts calls on hold and prioritizes them. Automatic call distribution is discussed
    below.


    A hunt group is a set of telephone lines that are organized in a logical group
    or subset of lines. The group can be as small as 1 line or extend in groups of
    many lines. Remember, a telephone call you originate travels through the public
    telephone network. The major role of that network is to route calls, via the telephone
    company''s central office switch, to the university. In an organization of the
    size of a university, there is usually one or more smaller private branch exchanges,
    which routes the telephone call traffic throughout the university. For argument
    sake, lets assume the university has 24 telephone lines assigned to the interactive
    voice response system. These lines originate directly from the telephone company’s
    nearest central office branch exchange and terminate into the back of the university’s
    own private branch exchange.


    # Example Linear Hunt Group


    ![](img/362eeaab106d8805ce9d069d00181098_55_0.png)


    Figure 1-2 Linear Hunt Group Example from a Hawaiian hotel: Courtesy of CallStream
    Communications Inc. Used with permission.'
