    John Kincaide, President of Scheduled Solutions Inc. founded the company in 1986.
    Scheduled Solutions Inc.''s mission is to provide front-line sales, marketing
    and pre-sales technical support for computer telephony integration software, hardware
    manufacturers and system integrators. The company also provides end user consulting
    and educational services on computer telephony integration. Scheduled Solutions
    has been involved in the UNIX marketplace since 1988. Since 1993 the company has
    focused on computer telephony integration.


    John Kincaide has developed new business for his clients in Hong Kong Middle East,
    Europe and North America. He has a solid track record in designing and marketing
    solutions that include interactive voice response (IVR), computer telephony integration
    (CTI) products on SCO UNIX and other UNIX platforms. One of John''s major strengths
    is an acute understanding of business processes and how they relate to the technology.


