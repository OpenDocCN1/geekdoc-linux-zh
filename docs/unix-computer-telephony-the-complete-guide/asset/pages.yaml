    # Types of Switch Signaling


    Switch signaling is instructions to handle a call, and how to treat it as commanded
    by the computer telephony application and the switch. Although, as previously
    mentioned, there are emerging standard protocols, the following are the old standbys
    which achieve the desired effect. Most of these really describe how the product
    interfaces and does the signaling, rather than the actual signaling itself.


    # INBAND DUAL TONE MODULATED FREQUENCY (DTMF)

    SIGNALING


    +   > HINT

    In response to an autotendant for a mailbox number may not be the same set of
    digits representing the physical extension attached to the switch.


    Inband DTMF is a very common form of switch signaling, and is sometimes the signaling
    method of last resort, between your computer telephony application such as voice
    mail, or interactive voice response system, with a private switch. When you call
    a company that has an autotendant to answer all the inbound calls, have you ever
    wondered how the call is handled? The call arrives at the private branch exchange,
    and the call is then forwarded to a hunt group of lines that terminate on the
    voice mail system running on a UNIX system. The call is answered by this system
    (note - not the switch), and voice mail software looks to see if there are any
    special instructions encoded on the line as special DTMF signals. If not, it plays
    the autotendant greeting. The voice mail system requests that you to enter an
    extension number, which you do using the touch-tone keypad on the phone you are
    calling from. The voice mail software collects those digits, examines a database
    for a corresponding switch extension number,


    36'
