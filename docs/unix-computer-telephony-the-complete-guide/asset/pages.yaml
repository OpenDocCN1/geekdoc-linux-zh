  md: '# THE "ROBOFAX BROKER" - HEADLANDS MORTGAGE


    # The "Robofax Broker" - Headlands Mortgage


    n the mortgage business, quick and efficient transmission of approvals or denials
    of loan applications to mortgage brokers is an important valuable service. The
    ability to provide other electronic means of communicating, such transactions
    value added and customer service, which brings these important customers back
    with more business. How can you better utilize the time of your staff to communicate
    this information? The answer is fax server technology. The way this has been implemented
    at Headlands Mortgage Company is very interesting technically, and saves the company
    a bundle in staff time and money.


    # Background


    Although Headlands Mortgage does most of its business with mortgage brokers, they
    do sell mortgages directly to the public. "Headlands Mortgage Company (Headlands)
    was founded in 1986 by Peter T. Paul, President, and is headed on the San Francisco
    Bay in Larkspur, California. Since its inception, Headlands has originated over
    92,000 loans, totaling over $14 billion dollars. We currently serve over 28,000
    loans for 4.3 billion dollars. Headlands primary focus is wholesale lending, with
    a base of some 4,000 Brokers throughout the western United States. Headlands is
    noted for developing loan products which meet current home buyers'' financing
    needs." The company has 4 other offices in Southern California, 2 in Oregon, 1
    in Bellevue, Washington, and another in Phoenix, Arizona. The remote offices are
    connected in a wide area network to a Data General Avion UNIX system.


    Each day they will have about 50 staff members throughout the company producing
    about 300 mortgage approval or denial letters. These documents consist of 2 parts.
    The first is the standardized boilerplate text, while the second is the data from
    their database. When a Headlands staff member makes a request of the MortgageFlex
    software to create a letter, the database information is merged with it. They
    always produce a copy of this document, and optionally, they are asked if they
    want to fax a copy of the document at the same time, if there is a fax number
    in the'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# FAX SERVERS


    database for the mortgage broker. The document is created, one image goes to the
    printer, while the other image is sent as an email attachment for later faxing
    by the fax robot. If they had to fax it manually, this would take time away from
    doing other tasks, such as working on the next mortgage approval.


    # System Overview


    Mortgageflex is a product developed by Mortgageflex of Jacksonville, Florida,
    which Headlands has internally customized. It is located on a centralized host
    Data Avion UNIX computer system, in the head office of Headlands Mortgage in Larkspur,
    California. With a geographically dispersed company, email is a very important
    communication medium. This was integrated within the Mortgageflex system to provide
    easy communication between users. It was a logical extension to allow Mortgageflex
    to send email to another new specialized user, which in reality was not a person,
    but a piece of software residing on the same UNIX computer.


    This is a fax robot which receives email messages, and then stripped out proprietary
    header information, and the body of the message. The body of the message could
    be a letter to a mortgage broker indicating an approval or denial for one of his
    customers. The relevant data from the Mortgageflex database is merged within the
    body of the text letter, and then sent as an email message to the fax robot user.
    Based upon the instructions within the header information, the message is converted
    to a fax and scheduled for transmission by “V-System’s VSI-FAX.


    This is not a circuitous as it may seem. One may think it would be easier to just
    send a fax directly from the MortgageFlex software, rather than have sent it as
    an email message to be converted as a fax message.


    There were two reasons for this. Firstly, they did not want to train users on
    yet another software package. Although V-Systems VSI-FAX comes with a comprehensive
    set of interfaces for both character based applications, X-Windows, and MS-Windows
    platforms, the need for them to learn these was not an


    146'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# THE "ROBOFAX BROKER" - HEADLANDS MORTGAGE


    imperative. Secondly, the design allowed for some application independence of
    the fax platform. Since UNIX already comes with a sophisticated mail system with
    every copy of the operating system, then it made sense from a system architecture
    point of view, to use this as the means of messaging between users and between
    applications. The proprietary header scheme allowed for other potential programs
    to submit faxes to the system, and these could originate from other platforms
    or computer systems. This flexibility has not yet been utilized at Headlands Mortgage,
    yet it does provide them with the means to scale the system’s functionality in
    the future.


    The fax robot lives as UNIX user like any UNIX user. The only difference is that
    this user is a piece of software that runs in the background accepting mail requests.
    The fax robot will email back to the originating real user the status of the fax
    success or failure. Currently the Fax robot has 4 fax modems that are actively
    used at one time. The largest and heaviest computer processing is the conversion
    of the letters into a fax file format. This conversion process can take up to
    10 seconds to convert the file to a fax file.


    # Call Flow


    The call flow is one way in this type of scenario. The originators of the fax
    are staff at Headlands. They initiate a fax request and an email message is generated
    with the letter. It is sent to the fax robot which analyses the header information
    in the email message, and then sends out the fax.'
