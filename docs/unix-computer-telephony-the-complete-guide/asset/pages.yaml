  md: '# CALL CENTER APPLICATIONS - "SCREEN POPS" AND PREDICTIVE DIALERS


    Even if you had a smaller call center of about 20 people, this time saving would
    still have an impact on the bottom line.


    During the slack inbound call volumes, a call center manager may assign some of
    their staff to outbound dialing tasks to follow-up on good customers, and if necessary
    call those who have not been timely with their payments. They have a list of clients
    on their screen. They pick up the phone. They call the prospect or customer and
    get a busy signal, or an answering machine, or there is no answer. They finally
    get a customer, ask them to enter the customer’s identification, and get a screen
    full of information, and talk to the customer about what they are offering or
    when they are paying. This can be a labor intensive task. It has been shown that
    in one hour, 20 minutes will be spent talking to a customer, or prospect, and
    the other 40 minutes will be spent manually dialing.


    Would you like to increase their “talk time” by almost 300%, to about 55 minutes,
    of your customer service department staff? Another technology that is related
    to screen pop is predictive dialing. Instead of dialing manually, a predictive
    dialer is software that will dial the numbers for your staff, and once it detects
    a human voice that is real (as opposed to an answering machine), a screen pop
    occurs with the customer or prospects information. The predictive dialer is loaded
    with customer numbers from the corporate database. Each list of phone numbers
    would be associated with a specific task. Each task may require a special set
    of skills. These skills are identified, and the customer service agent’s profile
    may have these skills entered in the database. When the call volume drops to a
    predetermined level, the predictive dialer will start dialing numbers, and then
    present the agents with outbound instead of inbound calls. The outbound calls
    are identified by the nature or identification on the screen. When a predictive
    dialer is used in this outbound and inbound call environment, it is called “call
    blending”. Predictive dialers are usually used in telemarketing organizations
    to do only outbound calling.


    You can see how an interactive voice response system, inbound call screen pops,
    and predictive dialing screen pops provide the degree'
  merge: -1
