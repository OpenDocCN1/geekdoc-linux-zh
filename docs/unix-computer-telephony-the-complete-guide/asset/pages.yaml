    INTEGRATION - GENESYS


    telephone network points of view. With a good

    specification that shows in detail how the solution is to be

    put together, it can be delivered to a system integrator to

    develop.


    IV. It is not necessary to cross-train the telephony and

    computer specialists in each others trade for successful

    plementation and integration. It is important that each of

    these team members understand the impact of their

    systems on each other''s systems. For example, it is

