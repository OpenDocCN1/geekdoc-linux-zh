  md: '# Chapter 3


    # Fax Servers


    Fax server technology on UNIX provides a network wide, multiplatform access solution
    for automatic faxing of office documents, broadcast faxing for marketing, distributing
    drug test results, or helping with weather reporting and forecasting. Fax server
    technology, can also be further leveraged, by combining it with an interactive
    voice response application generator, to create a special genre of interactive
    voice called Fax-On-Demand, as we have seen in the chapter on Interactive Voice
    Response.


    UNIX shines as a platform for these applications, since the need for high reliability
    and scalability of the platform, and of the application, can make these applications
    very valuable and mission critical. True to the traditional role of UNIX, playing
    the “glue” of disparate networks, platforms and applications, UNIX based servers
    allow many different kinds of users, and computer operating systems to launch
    fluxes using X-Windows, world wide web browser, MS Windows95 user, and a character
    based terminal user, are able to launch faxes from their computer or terminal.
    The application software in each environment merely has redirected the printed
    output to a UNIX “fax printer", rather than to a regular UNIX print queue. If
    you are a MS-Windows user of Microsoft Word and need to print to the fax printer,
    the document is converted to a graphic file type (usually Adobe PostScript™) and
    sent to the UNIX server for conversion to a fax format. It is then fixed from
    the UNIX system, via a regular modem with fax capability, or sent out via a high
    density fax card inside the fax server. The computer generated fax is much clearer
    to read since it is not a scanned image of the original. This allows different
    users to send different types of documents from different environments with little
    or almost no user training.


    125'
