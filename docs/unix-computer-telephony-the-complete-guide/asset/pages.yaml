  md: '# THE FICTITIOUS MINDEN BIOTECH REQUEST

    FOR PROPOSAL


    # Introduction


    This Request for Proposal (RFP) is being issued by Minden

    Biotech, Inc. for proposals to engineer, furnish and install new

    systems for voice mail with integrated messaging, interactive voice

    response (IVR) and facsimile server, a call center solution including

    screen pops, and screen transfers, with a predictive dialing solution

    to solicit new potential business, and to provide follow up of test

    results. Currently, Minden Biotech, with headquarters in Minden,

    Nevada has acquired new businesses via merger and acquisition of

    other companies in Farmington, New Jersey, as well as in London,

    United Kingdom. The communication and customer service

    solutions within the United States are being harmonized as a major

    goal of this RFP. One of the goals of the RFP is to provide a

    common integrated solution set for both United States locations to

    build upon. The goals are to provide extended hours of service, by

    within the United States. Because of regulatory differences, the UK

    office can only report results within the UK for multinational

    corporations based in the United States. The same solution set for

    the London location is to be installed at the same time as the US

    based operations. Linking between all sites is a common

    communication platform, which will include long distance services,

    as well as distributed integrated messaging and voice mail. Since an

    international TCP/ip Intranet is being established for three sites,

    the company will also take under consideration any voice over the

    Internet or Intranet solutions. This will make use of the existing

    cost structures of the multiple T1 and E1 based Intranet. Failing an

    Intranet back call system for the London office, if deemed

    appropriate and cost effective. The provision of a PBX and ACD

    technology for all three sites is requested to evaluate the cost-

    effectiveness of acquiring enhanced services and capabilities that

    may provide.


    Minden Biotech recognizes that there would be functional

    ennhancements and efficiencies provided by a new PBX, but feels

    that the current order Saturn IIE systems at the Minden,

    Nevada office will not perform adequately for the foreseen new

    demands placed upon it, and that a replacement system is justified.


    351'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# THE PICTITIOUS MINDEN BIOTECH REQUEST FOR PROPOSAL


    The company would also consider non-traditional PBX and ACD systems that take
    advantage of UNIX based PC Switch workstation platforms also acceptable), in order
    to provide standards based and open architecture, network ready system. The Farmington,
    NJ office has a NEC 220 PBX. The London, UK office has a Harris 20-20 PBX. As
    part of the overhaul of the communications infrastructure, the company wishes
    to harmonize the PBX infrastructure using PC Switch technology if possible, and/or
    “middleware” software technologies for the legacy PBX systems. The former rather
    the latter is more preferable. The voice mail and interactive voice response systems
    shall be replacements of existing systems. The voice mail will become a corporate
    standard and an integral method of communicating internally over 9 time zones.
    The company wishes to purchase an integrated UNIX voice, fax, and email messaging
    system that stands as an application that is dependent, but efficiently of the
    existing legacy PBX systems, as well as the new PC Switch systems. It is the sincere
    desire to have a distributed preferably open database (i.e. Informix), a storage
    medium for the voice, fax, and email, allowing for distributed access of the information
    from regular telephone & fax machines, as well as via Netscape 3.0 or later browser
    Java application. This integrated messaging system would allow for messages to
    be retrieved via the Internet, as well as internally within the corporate Intranet.


    For callers within the United States, the interactive voice response system will
    allow for results to be spoken and if necessary, faxed to any number within the
    Continental States, Alaska, and Hawaii. In order to cut down some of the transmission
    costs, Minden Biotech has implemented a successful trial of email transmission
    of results using Internet based Good Privacy (PGP) encryption technology to selected
    accounts. The platform used during the trial had an OS/2 operating system with
    dialup UUCP access, and the company wishes to move that to a UNIX platform using
    C2 operating system features. This system will communicate to the Internet via
    a separate UNIX based system. The connection to the Internet is being upgraded
    to a T1 or ISDN (2B+D), where appropriate. Access to the system will be


    352'
