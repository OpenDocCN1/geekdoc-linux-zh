    the fax machine. This causes the fax machine to emit its fax tone pulses. This
    tells the interactive voice response software''s fax module to start transmitting
    the fax. The benefit to the owner using one-call fax delivery is, they do not
    incur any long distance charges. The voice processing card hardware must have
    a fax hardware resource and software.


    More sophisticated technologies such as text-to-speech, and speaker recognition
    enable interactive voice response software to provide more variable information,
    and accept full spoken words as input. Some applications have information that
    is constantly changing in the database, and text-to-speech is the only way to
    deliver the information. Speaker recognition software allows callers to speak
    words, or key phrases instead of trying to use the keypad on the phone to spell
    alphabetic characters. There are limitations to speaker recognition, which have
    been already covered.


    Interactive voice response is most likely the easiest kind of computer telephony
    technology to deploy, and also has the ability to field from 15% to 95% of the
    calls that customers ask a person in the business. The usual number reported is
    around 15% to 30%. Can you imagine what you could do with an availability of 15%
    more labor in your customer service department? You could call more customers
    to find out what they desire to hone your products and marketing programs.


    # Call Center Applications - "Screen Pops" and Predictive Dialers


    Call center applications provide the ability to maximize the time spent by customer
    service agents dealing with customer''s needs or problems, rather than being tied
    up in administrative information collection. These types of applications demonstrate
    the value of computer telephony integration.


    A typical call center would have these basic elements in the call flow. The caller
    contacts the company, and if available, caller-id is captured on the line by an
    interactive voice response system, or other software that is able to trap this
    information. If caller-id is not available, then the caller is prompted to enter
    a number that'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# BASIC CONCEPTS OF COMPUTER TELEPHONY


    identifies themselves, such as credit card number, or telephone number. This information
    is used to find the customer''s record in a database. If the customer record is
    found, the call is transferred to a private branch exchange with automatic call
    distribution software, or a dedicated automatic call distribution (ACD) system.
    The customer''s key data is held in association with the call in a database table.
    Once a free agent with the appropriate skill sets (such as being Spanish speaking)
    becomes available, the call is transferred to the same time, and a agent application
    is also executed at the same time. The database application takes the customer''s
    key information, builds a screen of information, and then cross tabulating the
    agent''s terminal location in the database, refreshes the screen of the agent
    with the customer''s information. The agent then has all the information needed.
    They do not need to ask the caller for further identification, unless it is for
    security reasons. This is called a "screen pop", because the screen initially
    refreshes or "pops" without an agent''s interaction. If the caller has a problem
    that a supervisor with more authority needs to review, the data and information
    about customer is not lost when the call is transferred to the supervisor. The
    caller does not have to repeat his account information, and possibly issues the
    issues that need the extra authority. This not only saves time, but also the customer''s
    need to explain the same things, over and over, and to different people within
    the organization.


    Some of the case histories indicate that 20 or more seconds are saved for each
    call an agent must process. In environments such as large call centers for credit
    card companies, which have potentially hundreds of agents, and processing millions
    of calls per month, this can reduce the number of agents required to look after
    customers. Every second shaved translates to much lower costs in people, equipment
    and supporting infrastructure. Call centers experience many peaks and valleys
    of influx of calls every day. This forces managers of call centers to hire part-time
    workers for different peaks, and manage the different number of regular workers
    for the other times. Some companies have found that by using screen pop technology
    they do not need to hire as many part time workers to cover the peaks, and are
    more accurately able to staff the regular


