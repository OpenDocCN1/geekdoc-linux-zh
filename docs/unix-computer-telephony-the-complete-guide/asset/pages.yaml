  md: '# Chapter 4


    # Computer Telephony Integration - Call Centers


    Computer telephony integration is the specific term used to describe the coordination
    and delivery of both corporate data, and live voice data to a person within an
    organization. This has been achieved through proprietary interfaces and products
    provided by largegroups telephone PBX manufacturers for years. With the advent
    of newer lower cost technologies such as TSAPI, TAPI, and CSTA these are now moving
    out of the traditional model, to more network, and lower cost delivery of these
    important services, to smaller workgroups within a company.


    The following is a review of how computer telephony integration at very large
    site saved hundreds of thousands of dollars per year, and helped increase sales
    and managed credit. The other case history reviews Telquent, an SCO developer,
    which uses ISDN communications technology to provide a decentralized "virtual"
    call center environment for Georgia Power. A technical discussion ensues, reviewing
    the kinds of private branch exchange and data integration strategies that allow
    for computer telephony integration on the UNIX platform.'
  merge: -1
