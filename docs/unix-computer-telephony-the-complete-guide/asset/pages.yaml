- img_proc: true
  md: '# INTERACTIVE VOICE RESPONSE


    During the registration period, there is a constant and large influx of calls
    into the system every day. During the free flow period of August, the system has
    large spikes of calls.


    Within a 14 hour day of operation the system will have taken between 6,000 to
    8,000 calls. One reason for such a volume of calls is because of the "multithreaded"
    design of the application, and of the tasks to request data in the Oracle database.
    Multithreading is a technique that breaks down a single large request into its
    component smaller parts, and allows smaller parts to be submitted to the computer
    system for execution. These tasks have different priorities and other factors
    that keep the computer system from being totally tied down by a single task. The
    computer quickly moves from task to task giving the impression of processing more
    information faster. Other design factors in the application have allowed this
    system to handle the volume of calls.


    # Business Analysis


    The focus of the business analysis in this case is an obvious simplification of
    the registration process for the students as well as York University. Besides
    these obvious benefits there is a return in better management of the system.


    # RETURN ON INVESTMENT


    From the University''s point of view the use of an interactive voice response
    system has reduced the costs and hassles of the registration process. The costs
    are reduced manpower and time to set up registration, as compared with a manual
    process. The process of embedding the business rules greatly simplifies the total
    flow. This then allows for applications that send the notices by mail to the students,
    and as well effects the interactive voice response system and how it relates to
    the system.


    Another and not so obvious saving is the management of the application. As Brent
    said, "anyone can write an interactive voice response system", the ability to
    manage it and be proactive about the management of the system is very important.
    One of the benefits of using the IBM DirectTalk/6000 platform is its ability to


