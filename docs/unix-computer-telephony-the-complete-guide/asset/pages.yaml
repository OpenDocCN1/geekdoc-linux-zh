    # Call Flow


    A call placed from a very high frequency (VHF) radio on a ship is a little different
    than any other call. A ship will have a designated person or persons who are authorized
    to place a call. They initiate the call by setting their VHF radio to a prearranged
    frequency. The crew member will then depress the transmission switch on


