  md: '# BASIC CONCEPTS OF COMPUTER TELEPHONY


    # How does a telephone call work?


    This may first seem to be an irrelevant or simplistic question to answer. For
    those of us who are lucky enough to live in North America, Western Europe and
    other parts of the industrialized world, we take the telephone very much for granted.
    It is so common and expected, we are at a loss if there is not one around. I use
    the words "most places" to refer to where most of the telephones in the world
    are - in the developed and near developed countries. In many places around the
    world one needs to reserve a time days in advance to access a telephone. Although
    I''m sure that things have changed since I visited India in 1977, I was shocked
    to learn one had an emergency telephone call between New Delhi and Calcutta 8
    to 24 hours in advance! If you get a dial tone for a regular call, you should
    consider yourself fortunate. I remember visiting a lawyer''s office about 40km
    (25 miles) north of New Delhi, and being surprised to see the antiquated 1940''s
    telephone locked up in a wooden box, to ensure no one had access to it. Strang,
    it did not seem to matter at all, I could not obtain a successful connection for
    the short distance between town and New Delhi. Even today, in Saudi Arabia, one
    needs to wait 2 to 3 years to obtain a telephone line, even with the Kingdom''s
    very aggressive infrastructure programs.


    Nonetheless, the infrastructure necessary for us to call almost anywhere, at anytime,
    is quite complex. The principles of a telephone call are relatively simple. For
    the ease of description, the following describes what transpires while you are
    speaking and listening on an open telephone line. The telephone handset consists
    of a speaker for the ear, and a microphone to speak into. How the voice is converted
    to speech at the other end is not as obvious. The telephone microphone consists
    of a metal plate or diaphragm. Behind the diaphragm are carbon granules. Behind
    the granules is a conductive plate that has 2 electric wires fashioned in a simple
    circuit powered by a battery source. This source of electricity in the public
    telephone system originates at the telephone company''s central switching office.
    This is why you can still use the telephone, when your home or community is suffering
    from a general power blackout. The telephone company has battery backups and other
    means of generating power. The military field


    12'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# HOW DOES A TELEPHONE CALL WORK?


    telephones have a battery as an electrical source of power. At the other end of
    the circuit is another telephone handset. The 2 wires extend to the speaker or
    ear piece. The ear piece is constructed very much like the microphone. When we
    speak, the voice is converted into vibrations on the metal diaphragm. This motion
    pulsates against the carbon granules, which in turn modulates or changes the electrical
    current generated by the attached battery. At the other handset the receiver speaker
    (ear piece) consists of a couple of magnets and a metal plate. The wire is wrapped
    around electromagnets. As the modulated current in the 2 wires flows around the
    magnets, it changes the strength of their magnetic field. This magnetic field
    pulls against another metal diaphragm plate, causing it to vibrate. When it vibrates
    it changes the electrical magnetic energy into sound energy, and you hear the
    voice of your caller.


