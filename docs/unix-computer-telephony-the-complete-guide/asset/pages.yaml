  md: '# PEARLS OF WISDOM FOR SUCCESSFUL INTEGRATION - GENESYS


    # Pearls of Wisdom for successful integration - Genesys


    he following case history diverges a little from the others in this book, that
    it focuses on the actions needed, by all parties, to successfully install and
    roll out a computer telephony integration project. In this history, the project
    was for Charles Schwab, and it was performed by Genesys Telecommunications Laboratories,
    using their T-Server product on the Sun Microsystems platform. Charles Schwab
    required inbound call handling, with screen pop technology for about 1600 customer
    service representatives at 4 call centers averaging 400 customer service representatives
    located across the United States. The interviews with Bill Mitchell, Implementation
    Manager and Gary Lam, Marketing Manager of Genesys located in San Francisco, California,
    provided some very pearls of wisdom about the issues that need to be addressed
    by all parties involved, for a computer telephony integration project to succeed.
    These pearls of wisdom are applicable to a large project such as Charles Schwab,
    as well as for smaller computer telephony integration projects for small workgroups.


    > For further information on Genesys T-Server and other middleware, please refer
    to page 206.


    # Background


    Charles Schwab used T-Server and integrated it with an application they had already
    written. Genesys T-Server populated the agent''s screen fields for the screen
    pop. The database system that Charles Schwab integrated was a legacy mainframe
    system used for customer service, and account maintenance for tracking payments.


    The inbound caller would reply to prompts from an interactive voice response application,
    which would then communicate the customer information with the Charles Schwab
    application via Genesys T-Server, on a Sun Microsystems Sparc system running Solaris
    2.4. The purpose of the T-Server is to act as a translator between the telephony
    world and the data network world. In this case the switch was an Aspect, and all
    telephone networks terminated terminated on that system. Using the Aspect Link
    bridge product, the Aspect switch communicated with the Sun Sparc system


    255'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'running the T-Server software. In turn, the T-Server communicated with the
    legacy mainframe system to coordinate the screen pop, screen transfer, or screen
    conference.


    The system took 4 weeks to install all 4 call centers. Each call center took 2
    days to install, and then 3 days of testing by Genesys and Charles Schwab staff.
    The four call center sites are located in Colorado, Florida, Arizona and another
    in Indiana.


    # Pearls of Wisdom


    The following is a discussion for managers who need to know what things to look
    for, and to do, when embarking on their first computer telephony integration project
    planning and implementation.


    +   I. First, you have to take stock of what you have. You must identify the key
    elements, key departments and key personnel necessary to outline the computer
    network topology, telephone switching topology, and telephone switching call flow.
    Make sure all the team members in house know the technology and the capacities
    of your switch, call flow, LAN system and that LAN and telephony administrators
    understand the daily running characteristics of the load.


    +   II. Bill''s experience has shown that some of the hold ups in an implementation
    are caused by not having the right players on the team. What he has seen in the
    past is teams that are not fully knowledgeable and trip over things that were
    unexpected. They did not take stock of what they had in house. This delays delivery
    of the solution that they had already promised to upper management.


    +   III. Once you have the right team members onboard you can write a functional
    specification of how the solution will be put together. The functional specification
    includes a detail of the network, and telephony, data topologies and call flows.
    It consists of telephony, computer, and call flow diagrams, and outlines of the
    scope of the work to be performed, and what the architecture is, from a data and


