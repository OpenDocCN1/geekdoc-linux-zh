    # Database Use in Computer Telephony Applications


    Database as previously mentioned is the cornerstone of the computer telephony
    environment. As well, the UNIX platform has been seen as a high volume and reliable
    platform to host this kind of application. We will examine the typical usage of
    databases in different kinds of computer telephony applications.


    # INTERACTIVE VOICE RESPONSE


    In interactive voice response applications, such as banking by phone or student
    registration systems, the telephone becomes the data entry device, instead of
    forms to fill out on a screen, the caller is asked simple terminal. The caller
    is asked questions to answer using a touch phone. In order for a student to know
    the outstanding balance of fees owed in our example above, the student would call
    and be prompted for their student number. In this case the student would key in
    "20063731" and the interactive voice response software would insert those numbers
    into the SQL statement above, and execute it. The database would return the value
    of FEES OWED as zero, and then say to the student that they do not owe the university
    any money. The connection between the telephony and the database is performed
    by a voice processing card in concert with the interactive voice response software.
    Interactive voice response is usually the simplest method of providing customer
    access to their information from an installation point of view. It directly connects
    the caller to the database.'
