  md: '# TECHNICAL REASONS FOR USING HIGH DENSITY FAX SERVERS


    # Technical Reasons for Using High Density Fax Servers


    In computer telephony applications, one usually associates a more high density
    fax solution. This is differentiated from the everyday data and fax modem is the
    hardware technology itself, as well as the kinds of applications demands being
    placed upon them.


    # Hardware Considerations


    From a hardware standpoint, a more “industrial” system will have fax cards that
    simultaneously support multiple telephone lines. This can be as small as 2 lines
    or multiples of T1 (24 lines) or E1 (32 lines in total of 30 lines are actually
    used voice traffic within the same computer. The fax cards can either be used
    as a dedicated fax application, or mixed as a pooled resource with other computer
    telephony hardware as voice, text-to-speech, and speaker recognition cards that
    each reside in a PC running UNIX or a UNIX workstations from SUN, HP, or others.


    A high density fax card technology deploys special digital signal processors (DSP)
    chip sets. Digital signal processors are multipurpose processors, with the appropriate
    software, which can do many tasks. They can be used for fax, as well as voice,
    and data, rather than having dedicated products to handle these forms of communication.
    They are very fast chips that can perform many calculations per second, and in
    some instances can be as or more powerful as the computer’s main central processor.


    Fax technology by nature is usually very intensive graphical application. A document
    image has to to be converted to a Group III fax format for transmission. Group
    III fax format is an ITU-T (A United Nations organization) standard. This takes
    computing power. The standard describes how two fax machines transmit the compressed
    data of an image. This is done by regular fax machines as the scan the image and
    transmit the compressed data to the other fax machine for printing. In computer
    based fax servers the source of the document is in electronic format. This format
    can be from various sources such as Adobe PostScript, TIFF (Tagged Image File
    Format), and PCL (HP’s Page Command Language popularized by their line of laser


    151'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'printers, and their clones) and text. This can be outputted from

    various sources, such as image files from a scanner, or stored as a

    print file from a software application. In that format it is useless

    to the fax software and the high density fax board. It has to be

    converted to a form of TIFF file that can be faxed. This is done

    using either 3rd party or supplied conversion software routines.

    Essentially a fax file is a form of a TIFF file.


    In theory at least, it should be relatively simple to take a fax

    formatted TIFF file and move from application to application and

    from platform to platform However, this is not usually the case,

    because some vendors of fax software will add proprietary header

    information to the files, in order to gain better control of the

    document, and subsequently of their customers. Some

    manufacturers have tools to convert these special formatted fax

    files back into uncompressed TIFF files and other popular

    graphic file formats so that they can be included in other

    applications as graphic elements. This is important to note that the

    files themselves are graphic elements, and not stored as regular

    text in a computer. In order to obtain text from a fax document for

    word processing or text editing you can:


    +   1. Manually retype the text (most accurate).


    +   2. Use optical recognition software to try to transcribe the image

    of the words into text.


    Because of the nature of the conversion and manipulation of the

    fax file on a system, the use of high density DSP fax cards is an

    important advantage over modem based fax solutions. Although

    modem manufacturers have started to deploy DSP technology to

    capture voice as well as data and fax for lower density applications,

    the fax software depends largely for the main computer processor

    to handle the fax file manipulation and conversion. If thousands of

    faxes need to be delivered in a matter of a couple hours, then high

    density fax solution will solve the problem. The effectiveness of

    this kind of solution is based upon the UNIX operating system as

    well as the DSP technology. Because the UNIX operating

    system is multitasking, and multi-user, it is very efficient in

    managing the overall environment than some other operating


    152'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# TECHNICAL REASONS FOR USING HIGH DENSITY FAX SERVERS


    systems. In a high Input/Output (I/O) bound environment such as faxing, a dedicated
    fax board loads the operating system from this I/O task, leaving it to efficiently
    gather data, manage disk, and memory resources. Fax modems are usually attached
    by serial port devices, which are managed by the operating system. This places
    various degrees of burden on the UNIX operating system and the computer system.
    This is usually alleviated by the use of high end serial I/O cards from Digibord,
    or Equinox, or Stallion Technologies. These boards off the serial I/O tasks, but
    do not do any of the fax manipulations as high density DSP boards.


    As Alodia Hankins, of T4 Systems, a software developer of BrookTrout high density
    fax solutions on the SCO OpenServer platform said, that many of their clients
    have testimonials to the increased speed of throughput compared to regular fax
    modem delivery methods. For example, VWR Scientific sent 1 million pages of technical
    safety per year using a T4 MultiLINK system. This saved the company an additional
    $100,000/year in printing and delivery costs over and above the 4,000 pages/day
    that are faxed from their call center. The same efficiency and cost savings are
    played out time and again in different industries such as, health care, transportation,
    government, manufacturing, and distribution.


    Doug Oldham, Vice President Development, of T4 Systems listed the technical advantages
    of a UNIX based fax server using BrookTrout boards. (Doug''s key points are in
    quotes, with comments by the author are included below.)


    +   1. “More control over the channels” (i.e. fax ports). The fax software allows
    developers better control over the hardware environment, at a level not usually
    provided in some software only solutions. Software developers of high-density
    solutions are provided better programming interfaces.


    +   2. “Richer API for dealing with modems” There is a better application programming
    interface dealing with high density fax cards, than the programming interface
    of Hayes modem “AT” command set.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# FAX SERVERS


    3. “Better response from internal hardware”: Since the high-density fax cards
    are on the high speed computer bus, and they are in turn communicating on a high
    speed MVIP, PEB, or SCbus telephony buses to the outside world, there is greater
    throughput to the digital or analog telephone lines. Data utilization and transmission
    are at the best possible speeds.


    4. “Reduced cables and peripheral components neater packaging.” A problem with
    high density rackmountable modern solutions, there is more cable management, than
    just terminating a single digital T1 line to a T1 card inside the UNIX system
    chassis. Cable management may seem trivial. If you have a PC on your desk you
    look at the cables needed to connect a phone and modem on a single analog telephone
    line to the outside world. Now think about attaching 24 or 48 serial cables from
    the back of a UNIX system to a rackmount of fax modems. It takes management time
    to document their connection, and make sure the correct serial port on the computer
    is connected to the correct telephone jack coming out of the wall or punch block.
    It can be done, however, connecting a single T1 cable makes a much neater package.
    Besides, in more Canada and US tariffs it is more economical to use a digital
    line for such high densities.


    5. “Downloadable firmware for updating without replacing hardware:” Firmware provides
    the software intelligence for a hardware device. This is different from the application
    software a user uses to fax documents, or execute other programs. Such firmware
    can be loaded or “burned in” to chip that is physically mounted on the circuit
    board of the device. This means that the computer system has been turned off,
    remove the boards, and replace the firmware chip. With products such as BrookTrout’s
    this is simply an set of software instructions that can be downloaded to the remote
    high density fax server, and update this firmware. This is an important feature,
    when a system is sending out many thousands of faxes a day. Only some of the top
    of the line modems have this feature.


    6. “IVR (voice) features:” This is further discussed below. It means you can add
    more additional value as IVR, text-to-


    154'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# TECHNICAL REASONS FOR USING HIGH DENSITY FAX SERVERS


    speech and other technologies. Lower density fax modem solutions have limited
    voice capabilities for basic voice mail play and record.


    +   7. "Expandability is easier" This is particularly true, since adding greater
    increments of high density fax board solutions is simply adding another board,
    and software. If the system has used a "Fractional T1" (i.e. the original installation
    had used only 8, or 12, or 16 ports of the T1). An additional fax board can complete
    the T1, or simply expand it with more T1s. There are no additional computers,
    or other major components. It is one contained system.


    Another advantage from a hardware prospective is that with a higher density, it
    is more economical to use digital T1 or E1 lines than it is to use a large number
    of analog telephone lines. One reason is that if one wanted to send and receive
    from 24 or 32 fax digital lines, then it would be easy to install a single T1
    or E1 card from Acculab or Dialogic, or any vendor, and then connect the fax boards
    using MVIP or SCbus cable to the fax boards. A single digital line is put into
    the system, and then the fax software has access to all the inbound and outbound
    traffic. This is not unique to a UNIX configuration, rather more a statement of
    how it is done. However, if one wanted to have 96 lines of fax within a single
    system, the design of the operating system will shine through true champions.
    The design of the operating system will make a big difference in managing resources.
    Fax cards come in various densities from as small as 1 port to 32 ports on a card.
    In a PC environment rack mountable industrial PCs that have 20 ISA slots when
    the basic components are installed, can have up to 15 slots available to place
    fax, and digital interface cards.


    Besides the density, another major benefit is the ability to mix and match other
    types of voice processing boards to create a more complex and multimedia solutions.
    The fax boards act as a pooled resource either in a smaller ratio to the number
    of voice cards, or if application requirements demand it, in one to one combination.
    Depending on the manufacturer, it is possible to achieve this by adding more fax
    boards within the chassis of the system, or in the case of some manufacturers,
    such as Linkon Corporation, a software license can be issued to increase'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# FAX SERVERS


    the number of available fax ports on an existing card running inside the system.
    This is a clean solution since the system administrator locally, or even remotely
    can increase the fax resource without having to make a trip to the site, and open
    the cabinet and have an extended downtime. This again is a testimonial to DSP
    based technology.


    Another advantage that a UNIX system has with high-end computer based faxing is
    its ability to easily internetwork with other networks or mainframe data sources.
    Allowing applications from different sources to drive a very large volume of faxes
    to a UNIX based fax server.


    There are many hardware suppliers of fax based available in products from various
    companies such as Dialogic''s Gammalink product line, BrookTrout, and Lincoln
    Corporation only to name a few.


    # Application Considerations


    In the high-end computer based fax market, the need for stable, dependable and
    large volume systems is evident in the kinds of applications that are used with
    this technology. These include³:


    +   1. "LAN Fax: This technology allows network users to share fax hardware resources
    and send and receive faxes directly from individual workstations." This is very
