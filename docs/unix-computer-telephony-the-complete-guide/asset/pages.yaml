    the switching functions inside your own office is to provide your firm with all
    the functionality you need, and well as to reduce costs.


    # Integrated Services Digital Network (ISDN)


    Integrated Services Digital Network (ISDN) is a digital cable that has significant
    bandwidth. It consists of 3 channels, where one channel is used to monitor the
    success of the transmission of the 2 other channels. The 2 other channels are
    known as bearer lines or “B” channels, and they can sustain speeds of up to 64KB
    (Kilobits per second). A bit is a single binary digit that has either an or off
    state. A character in a word is on 8 bits put together to make a byte. Given that
    a page of this book is about 1900 characters of text, then a “B” channel could
    transmit 4 pages of this book in a little over 1 second. Since a top of the line
    telephone modem on the market today can push up to 28.8KB dependably on the cleanest
    of telephone lines, less than half the rate of a single “B” channel, you can see
    the advantage of a digital signal.


    With a digital line like an ISDN line, you can mix and match what is being transmitted.
    Since you have 2 “B” channels, then you effectively have one channel that can
    be dedicated for data transmission, while the other is used for voice transmission.
    The physical connection to the telephone network to the UNIX system running the
    computer telephony application is provided by a ISDN card within the UNIX system.
    The application software then controls the call and data flow across the ISDN
    network to the service agents. This technology is a telephone company’s central
    office service and does not require any private branch exchange equipment.


    It is possible to have a distributed call center by using ISDN technology. A distributed
    call center is unlike a call center where there are many customer service representatives
    at one location. Because of ISDN, when a call arrives, the information well as'
