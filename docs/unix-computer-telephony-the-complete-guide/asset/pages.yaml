    # System Overview


    Before a detail review of system overview can begin, we need to understand a little
    how the Internet works, and why it was important for AlphaNet to use an Intranet
    network typology. For their Mondial Network.


    You may have heard of, or have used, personal computer based voice over the Internet
    products, such as Internet Phone. In the public domain, software products like
    CuSeeMe, has been ported to different operating systems including UNIX. These
    products allow a user to use their computer system, and a microphone and sound
    card with speakers, to engage in a telephone like conversation. With some products,
    like CuSeeMe, and Microsoft''s NetMeeting, they allow you to use a small video
    camera attached to the computer peripheral to do video conferencing. The main
    advantage of this type of conversation is the very low transmission cost to another
    person in the world. The software is free, or commercial versions are priced low
    cost utility software. There are no toll charges to talk to a friends and family
    across the country or 4 continents away. The only cost is the monthly flat fee
    for access to the Internet from the local Internet service provider.


