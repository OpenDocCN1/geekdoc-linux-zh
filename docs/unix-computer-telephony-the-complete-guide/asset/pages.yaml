    # CULTURAL ISSUES


    There are cultural issues that needed to be addressed:


    +   1. They had to accommodate Arabic as a language for the system

    prompts. Unlike Saudi Arabia which does not permit females

    in business, and hence female voice applications, the National

    Bank of Egypt could record both female or male voice

    prompts. Additionally, the Arabic language demands that dates

    amounts are announced differently than the Latin based

    languages such as English. There are special challenges when

    faxing information, since the Arabic language is read right to

    left, rather than left to right, so the formatting of text is a

    special challenge. Moreover, Arabic allows for a single letter in

    t alphabet to have up to four different shapes. The shape is

    dependent upon its usage within the context of the word. This

    requires special context sensitive analysis of the construction of

    a document that is faxed.


    +   2. An important point to consider is that Islam does not permit

    one to earn ‘interest’. This is also incorporated into Egyptian

    secular law. The bank can only allow its customers to make

    ‘return on investments’, rather than ‘interest’. This affects

    t application menu prompts both in written form as well as

    in voice prompts for the interactive voice response

    applications. So you would see things such as “rate of

    in investment rather than “interest rates.” A bank customer’s

    depos are represented in investment certificates.


    +   3. Support staff have challenges in supporting this account

    because of the 7 hour time difference. This means that they

    have to get early to work with them. Moreover, because of

    the cultural differences and environmental differences of Cairo,

    t support staff that make the trip there are not as eager to do

    so on the next opportunity.


