  md: '# CALL FLOW


    # Caller-id


    Let me explain why automatic number identification (ANI-hereafter called caller-id),
    and DNIS (hereafter dialed-number) can be very useful to an interactive voice
    response system. Let us say a university has a student course registration interactive
    voice response system. The registered student already received course outlines
    and guidelines with which they must register for electives, as well as required
    courses. She calls the system and is prompted for her student id number (i.e.
    978137371) and the assigned password. Thereafter, the student would be guided
    by voice prompts to register for the courses and classroom times, according to
    the business rules encoded in the logic of the interactive voice response application.
    In the case of advanced database technologies, these rules are encoded as part
    of the underlying database. As the student replies to the prompts, the telephone
    key presses are translated into data numbers or characters by the voice processing
    card and interactive voice response software, which can then be used to retrieve
    or write information back to the student registration database.


    If caller-id data can be detected and retrieved when the student calls, then time
    and money can be saved by the student and the


    Jurisdictional Availability of Caller-ID

    As an aside, caller-id service is not available in all jurisdictions in the United
    States, or it is restricted to specific kinds of telephone services. For example,
    before June 1, 1996, the State of California only allowed caller-id on 1-800 toll
    free services to aid call centers. Concerns from special groups such as special
    women groups felt that if a phone call made to the person (i.e. an abusive husband)
    persecuting them, then this detailed information could be trapped by a caller-id
    display device, available from telephone company retail outlets or electronic
    stores. If the woman was in a ''safe house'' then the location would be unavoidably
    disclosed.


    university. The reason for this is, caller-id consists of a phone number and possibly
    other information which is captured after the'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# BASIC CONCEPTS OF COMPUTER TELEPHONY


    first ring on the inbound telephone line. Depending on the phone company which
    originated the call, and depending on the switching equipment they used to route
    the call, other information can be noted, such as the date and time of the call,
    and even first and last names and address of the owner of the phone from which
    the call is originating. The full name and address information is not available
    in locales. For example a string such "416-555-0000 1996/04/15 15:43:03 Joanna
    Dobson" may be captured by the software. This number is checked against the student
    registration database, and if it matches, a couple of things can happen within
    the limitations of the business rules. First of all, if there are no duplicate
    phone numbers in the database (i.e. student roommates sharing a residence), the
    system could use any business rules from the database, eliminate a prompt asking
    for student number, ask for the password only, and then follow the business logic
    for the remaining of the registration for this student. On the other hand, under
    the same circumstances, if the university has not received tuition payments, the
    call can be transferred to the business office. A computer screen of information
    for this student could be presented to an university staff member and then have
    the student''s call transferred to that staff member. Alternatively, the staff
    member would receive the call with a pre-recorded message indicating the nature
    of the call, before the student''s call is transferred to them.


    The amount of time saved for one interactive voice response prompt may be anywhere
    from 5 to 10 seconds, depending on the amount of data being keyed by the student
    on the phone. You may say 5 to 10 seconds is not very much, and why bother? Well,
    multiplied by a student body of 20,000 students, this calculates to about 55 hours
    of telephone time within a period of 1 month. If the students called for long
    distance, or the university provided toll free calling to the system, this would
    translate to about $850 at a rate of 25 cents a minute for the 800 or 888 toll
    free service. As well, the screening of the callers (i.e those that have not paid,
    or who are no longer eligible to enroll), provides better financial security.


    Overall system security is maintained if the interactive voice response software
    can keep a log of the callers and their frequency'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# CALL FLOW


    of the calls. For example, if a mischievous or disgruntled student wanted to tie
    the phone lines to the registration system at a peak time, using his personal
    computer modems to dial randomly and constantly to flood calls into the system,
    then the interactive voice response software could immediately report that this
    is happening. The system administrator could then tell the interactive voice response
    software to not answer, or immediately drop all calls from those phone lines.
    The system administrator can look up the phone number in the university database
    and then take the necessary action to prevent this from happening.


    Although not an obvious saving to the university, the 55 hours of telephone time
    saved translates into a reduction in the amount of voice board hardware and software
    that the system needs. If the caller-id saved this amount of time at peak registration,
    then it could save the university from needing 2 to 4 telephone channels. This
    represents an additional saving of $2,500 to $4,000 in hardware and software costs.


    # Dialed-Number


    The university could offer another interactive voice response service, such as
    a library line. This could be used to search for availability, or extend the loan
    period for books or reference material. The caller could enter the library reference
    number or ISBN number to identify the book or material. Normally, additional voice
    board hardware and software, and on-going telephone line costs would have to be
    purchased to accommodate the new application, since these added telephone channels
    would be dedicated to the application. If the interactive voice response software
    could utilize a DNIS (dialed-number) function, then these additional costs could
    be eliminated.


    When the port on the voice processing card answers (“goes off-hook”) after the
    first ring, it collects the dialed number information, and based upon the identifying
    number, dynamically load the appropriate application.'
