  md: '# HOW DOES UNIX BASED CTI WORK?


    # PC SWITCH - THE INTEGRATION OF VOICE INTO UNIX COMPUTER NETWORKS


    From a non-traditional PBX point of view the PC switch provides the merger of
    both worlds of standards based technologies within a computer and telephony inside
    a single chassis. There is no need to provide special signaling between the telephone
    network PBX to the computer network, other than the UNIX operating systems standard
    signaling methods such as inter-process control (IPC). This provides an very interesting,
    flexible, scalable, UNIX based solution. This is where UNIX shines as a platform,
    since it has all the inherent multiple protocol computer based networking, and
    database support, with its ability to support the telephony services. Its multitasking
    and multi-user functionality and structures are well suited for this task. After,
    UNIX was developed originally at AT&T Bell Labs for telephony and scientific applications.
    It only took the computer revolution to force the convergence and the standardization
    of the products into the UNIX chassis to allow this reincarnation to surpass its
    evolutionary branch of the family tree - the proprietary PBX. This is fully described
    in Chapter 5 - PC Switch on page 217. The “Shore Connection” case history demonstrates
    how well this technology can have a significant impact on ROI for the customer,
    and provide better service for their customer’s.


    For call center solutions, the PC switch is well suited for the CTI workgroup
    of a handful of staff to a very large system of hundreds of agents on a single
    system. The uniqueness of some PC switch architectures in call center applications
    is that they can be easily changed to meet the needs of the call center environment.
    Unlike other traditional vendors of PBX and call center solutions, some of these
    vendors are able to customize the software to the exact specifications of the
    application needs of the workgroup or large call center. This gives them a competitive
    advantage over the traditional vendors, who have to either provide expensive customizations
    with longer turn around times, or the customer may have to wait until the next
    software release for the switch to accommodate the needs they have expressed.
    The PC switch can communicate with most kinds of networked displays and dial-up


