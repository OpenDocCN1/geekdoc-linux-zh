  md: '# SYSTEM SIZING TABLES


    # Appendix B


    # System Sizing Tables


    The purpose of this Appendix is to give you a rule of thumb guide to simple lookup
    tool to size the number of telephone lines (ports) you may need for your computer
    telephony application. Please beware, these tables are a rough estimate, and by
    no means 100 per cent for absolutely every situation. The calculations are based
    on a formula of 1 telephone call in every 100 would have a chance (read probability)
    of receiving a busy signal. There are much more detailed statistical tables that
    provide a more accurate answer. For further assistance you may want to contact
    to your telephone professional in your organization for further help. These tables
    are “best estimates” and other factors may need to be reviewed for better accuracy
    for your particular implementation.


    The formula for the calculation is:


    # of Ports = Length of call in minutes X Number of calls per Hour X 0.0238


    The following tables show increments at 1.5 minutes and 5 minutes. I have given
    these timings since it takes about 90 seconds to do a simple interactive voice
    response application, and about 5 minutes for the average conversation on a line.
    I have also limited the number to 128 ports, which is about the upper limit in
    a single computer system with multiple T1 or E1 lines terminating into a system
    at the time of writing. However the density of the number of ports in a single
    slot in a computer is increasing each year. These systems are usually networked
    together so that a number of units will act and behave like one large system.


    Of interest is the argument by the telephone companies that dial-up modern analog
    Internet usage has caused them to invest heavily into new telephone switching
    equipment at their central offices.'
