    In the case of TAPI, the interface is provided in the Microsoft operating systems.
    This means that software developers on those platforms only have to write the
    software for the TAPI interface. This is usually likened to the change that occurred
    for printer drivers for Microsoft Windows 3.1. Before in the Microsoft operating
    system, if you wanted to use a printer to print a document, you had to select
    a printer driver supplied by the application software developer (i.e. Lotus 1-2-3).
    This was extremely system administrative intensive, and forced every software
    developer to have to maintain their own library of print drivers and ship it with
    their products. This was solved in Windows 3.1 where the operating system maintained
    the print device drivers and supply software developers with a specification to
    send data to the printer interface Microsoft supplies. The same holds true for
    UNIX operating systems as well. System administrators of UNIX systems can provide
    a single interface to all print requests from native UNIX applications and as
    well through print request from networked PC''s or other computer systems.


