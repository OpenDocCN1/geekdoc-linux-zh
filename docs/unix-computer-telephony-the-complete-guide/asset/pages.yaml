    # Why UNIX for Predictive Dialing?


    These industry leaders for predictive dialing technology are on the UNIX platform.
    The nature of predictive dialing is that it is a multitasking and multi-user process.
    In effect there are four major processes at work, which are natural extensions
    to the UNIX operating system''s multi-user, multitasking, and scalable architecture:


    +   1. Database management: UNIX is well known as a platform for its ability to
    manage large database environments. The database management is twofold in the
    campaign list of phone numbers is generated from the database, as well as the
    need to spawn a database transaction to the screen of the next available agent.
    This takes advantage of the advanced and mature file systems and networking technology
    within the UNIX operating system.


    +   2. The next major process is telephony dialing and detection of a real person.
    This is an intense multi-user function where multiple telephone lines are being
    dialed constantly, and then spawning sophisticated software algorithms to determine
    if a real human is at the end line, rather than an answering machine. This is
    an example of the utilization of UNIX''s multitasking capabilities.


    +   3. Providing multi-user, multitasking services to pop the screen to the next
    available agent, and then provide the database and screen processing from a small
    number to a large number of agents.


    +   4. Meanwhile, while all this is going on, another control monitoring process
    is managing the number of inbound and outbound calls for call blending, so that
    customer service agents can be evenly paced with customer requests.


