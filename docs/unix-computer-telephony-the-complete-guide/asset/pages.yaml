  md: '# OVERVIEW OF THE FICTITIOUS MINDEN

    BIOTE RFP


    # Overview of the Fictitious Minden Biotech RFP


    The purpose of the fictitious Minden Biotech Request for Proposal

    (RFP) is to demonstrate how to integrate a computer telephony

    solution for a multiple site enterprise, using UNIX based products.

    This overview is to help the reader understand the main issues that

    are to be addressed by the respondent - Capri Systems Inc. For full

    details and copy of the RFP see see


    The Fictitious Minden Biotech Request for Proposal on page

    347.


    Minden Biotech is a biotechnology company that has its main line

    of business in biotechnological testing of agricultural commodity

    products, and has also acquired two companies that provide

    medical laboratory results for the insurance industry. The

    insurance medical laboratories are in Farmington, New Jersey,

    while the other one is in London, United Kingdom. These were two

    independent companies, and now are operating divisions of

    Minden Biotech. Each location has its own independent computer

    and telephony resources that have evolved over time. The RFP has

    specifies about how the London office is allowed, by regulatory

    constraints, to report test results outside the United Kingdom.

    However, the management of the company realizes that to grow

    the company, it needs to modernize its computer and

    communications infrastructure. This is to facilitate the

    development of communications within the company, as well as

    with the customers, and the public at large. Since the main product

    of the company is confidential information produced from

    laboratories, the demand for its timely and accurate dissemination

    of prime importance. Moreover, the ability to do this efficiently

    and more aggressively in the market will provide the company with

    the potential of a sustainable competitive edge.


    There are two phases in the RFP. Phase I is to rebuild the

    communications and computer infrastructures, using any existing

    investments when they are deemed still valuable for the long term.

    This includes the implementation of a modified "off-the-shelf"

    Informix database application product called iGenetic. (The name

    of the product is fake). This is the main application for the


    265'
