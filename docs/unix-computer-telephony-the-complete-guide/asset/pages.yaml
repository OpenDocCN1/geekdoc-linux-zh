  md: '# THE “PLEASURE CRAFT” - STINGRAY BOAT COMPANY


    # The “Pleasure Craft” - Stingray Boat Company


    ![](img/362eeaab106d8805ce9d069d00181098_172_0.png)


    Manufacturing pleasure craft is a complex business, requiring a lot of communication
    to suppliers and customers. Stingray Boat, of Hartsville, South Carolina, shows
    how Faximum software has saved the company time, money, and increased customer
    communications using an integrated UNIX based solution.


    # Background


    Stingray Boat manufactures pleasure boats that start from $10,000 (retail price)
    and range an outboard motor boat 4.57m (15ft) to 7.01m (23ft) with all the accessories.
    Stingray Boat has 100 employees, with a worldwide dealer network of over 80, with
    no direct sales to the public. Support and communication to the dealers is a key
    factor in the success of Stingray Boat. Stingray Boat builds its boats on a per
    order basis, so as reduce costs in inventory and makes the efforts to support
    the dealer with current and accurate information even more necessary, since the
    product is being manufactured specifically for the dealer.


    Before the fax server was installed and integrated into the application software,
    there was an ever increasing delay and line up for use of the fax machine at their
    office. When the purchasing agent for the company had to send 3 purchase orders,
    they had to be created in the Filepro system, printed, and then a cover page added.
    When the purchasing agent wanted to send the fax, he often had to wait in queue
    to use the machine. Then he would have to spend another 5 to 10 minutes faxing
    the documents he had generated. It was not unusual for many of the staff to wait
    10 to 15'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# FAX SERVERS


    minutes to get access to the fax machine. Stingray Boat has over 200 vendors,
    of which any number of those would need to fax purchase orders for a single boat
    order. Moreover, the cost of transmission of these documents happened during regular
    business hours. This meant that all transmissions were made during peak business
    hour rates. This was unnecessary for some of the transmissions, which could be
    sent at lower rates at night.


    When fax machines became prevalent in the late 1980s, sales leads to the dealers
    would be printed off, and then manually faxed. This involved a single employee
    spending a significant portion of her day sending faxes to the dealers.


    # System Overview


    Robbie Gilbert, Information Systems Director, described his system as being a
    complete enterprise solution using an built Filepro database system. This resides
    on a SCO UNIX 3.2.4.2 system with 44 terminals and 11 printers, running on a Pentium
    based personal computer. Faximum software with a single Multitech modem for faxing
    provides the needed capability. The Filepro application software provides complete
    order processing, vendor and purchase order management, inventory management,
    manufacturing process control and shipping information.


    Robbie identified four main areas where automated faxing has made a significant
    contribution in terms of time and money.


    Generated leads come from different sources. These leads are then entered in the
    Filepro system. A custom letter is generated and sent to the prospect. Then the
    nearest dealers to that one customer are also notified by fax about the prospect
    in their territory. The decision on which dealers are notified is based on several
    criteria, such as location of the prospect to the dealers. The prospect also gets
    the same list of dealers.


    Once the dealers complete an order form, they fax it directly from the paper fax
    machine in their office. The order entry staff then enters the order into the
    system. Each boat may have some special features or other parts that need to be
    identified with the boat. Once the order has been placed in the system, a confirmation
    of


    # 138'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# THE "PLEASURE CRAFT" - STINGRAY BOAT COMPANY


    receipt of the order is faxed back to the dealer, verifying the make and parts
    of the order. Each order confirmation consists of 2 to 4 pages, which includes
    all the boat''s options, shipping date and expected delivery date. Since the order
    confirmation is faxed directly from the computer system, the quality of the printout
    at the dealer''s fax machine is near laser printer quality. This clarity is achieved
    because the document is not manually scanned by a fax machine.


    A production run may have up to 6 to 8 orders being processed at a time. The order
    manager and schedule production person decide which boats are going into production.
    They fax a production confirmation of the order to the dealer. This provides the
    dealer with one last chance to make any changes to the boat''s configuration before
    the product is built. The dealer then signs off on this confirmation, and faxes
    it back to the production department. On occasion a dealer will call back with
    a hot order change. This occurs when a dealer is given an opportunity to sell
    a boat with a small feature change, after he has signed off on the production
    confirmation. The production manager makes the change to the boat configuration
