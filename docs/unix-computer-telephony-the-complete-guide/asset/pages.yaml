  md: 'quality pioneer with a firm commitment to customer satisfaction, efficient
    service and engineering excellence, with an ISO 9000 qualification. It provides
    passenger and freight rail transportation services, a light rail transit system
    and feeder services, handling over a million passengers per day. It is a public
    corporation which is run on commercial principles and is self-financing, the KCRC
    also engages in property development along the railway and has embarked upon a
    program to expand its capacity and upgrade its services.,”26


    The rail traffic between the British Colony of Hong Kong and the Mainland is increasing.
    Because of the growth and competition from the trucking industry, there is a strong
    commitment by the railway to build new rail infrastructure to facilitate the continued
    growth, well into the next century. This is evident in the construction of the
    West Rail Corridor for rail containerization traffic to the Mainland. Once the
    new Kwai Chung Port Container Terminal is completed in 2002, this will be one
    of the most advanced rail containerization ports in the world. It will provide
    better service than transport trucks, since the containers will be able to be
    loaded directly from the railway cars to the ships for export. This eliminates
    the intermediate step of having to move cargo from the railway terminal to truck
    and then to the ships. They forecast the rail traffic will increase to 350 railway
    cars per day by the year 2002.


    After products have been manufactured in the Mainland they leave for Hong Kong.
    At that time the shippers in the Mainland will notify their customers in Hong
    Kong which railway car or cars contain their goods. This is one source of key
    information the customers obtain to find out where their cargoes are on which
    railway car. The train has arrived at Shenzhen at the border, the manifest describing
    the contents of each railway car is entered into the KCRC''s Wagon Information
