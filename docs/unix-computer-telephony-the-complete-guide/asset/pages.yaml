  md: '# THE “REGISTRAR” - YORK UNIVERSITY


    # The “Registrar” - York University


    Did you go to university or college before the mid 1980''s? If you did, you will
    remember the new experiences that were a lot of fun, while some of them were not
    so great. One of those experiences that was not so great, was course registration.
    This case history reviews a very common and typical adopter of interactive voice
    response technology. For those who were fortunate at their university or community
    college to use this kind of system, they may not know what the experiences were
    like in the days when this technology was not available. For their entertainment
    we review the “good old days” of course registration.


    What makes this case history at York University so interesting is that the interactive
    voice response Student Registration system is now on its third generation of technology,
    using an RS/6000 AIX based UNIX system, with client-server technology. This provides
    an interesting perspective in terms of the technology evolution, the system management
    and resources requirements.


    # Background


    If you attended a university or community college before the advent of interactive
    voice response systems in the late 1980''s, you will most likely remember the
    days of course registration, recalled in the following paragraphs.


    For first year students, course registration was a confusing process; not knowing
    which elective courses to take, especially if you had to decide in the following
    year, what you really needed in order to specialize in a discipline such as computers,
    psychology, or business. For those who survived their first year, it became a
    game to be able to find the best classes and professors, to meet your scheduling
    requirements. Not only was there a lot of stress involved in making these decisions,
    it was very expensive, and time consuming for professors, registrar''s office
    staff, and for the students.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# INTERACTIVE VOICE RESPONSE


    You could almost sense the impending stress of registration on campus, once the
    university had published its course calendar, and mailed out your registration
    forms. These forms sometimes had preprinted adhesive labels that indicated the
    courses in which you could potentially register. These labels would be placed
    on the registrar''s course sheets, once you had successfully registered. Not all
    the labels could be used, only a subset would include the courses you wanted.
    For those courses which were prerequisites, you were not automatically assigned
    a course and class. You had a chance to select which class to attend. Some professors
    are better liked than others, or better course times might be more desirable.
    There would be a rush to fill those classes first.


    Depending on the time of year, and the size of the university, the registration
    process could entail hours or even days. All you did was make your decision about
    which courses to take, and which professors you wished to have them. You would
    run around the different portions of the campus going from department to department,
    waiting in line and interminable queues to have your course assignments confirmed,
    or even rejected, because a prerequisite in the calendar was not published.


    Even worse, one or more of the classes of your choice could be nearly full. To
    your great disappointment the faculty member, taking the registration for the
    department, would review your course history and course requests, and then ask
    you to go to the department chairperson for special permission to take course.
    You would hunt down the tired and beleaguered chairperson, plead and negotiate
    your case with undue emphasis and theatrical pathos. If you were lucky, or the
    chairperson was very tired of hearing the sad story 50 times before in the past
    2 hours, you might then be given the required “blessing”. You would go back to
    the department''s course registration queue, only to find out the class you wanted
    in the first place is fully booked, and now you have to take it next year. You
    would grumble, finalize your registration, and hand in your paperwork to the registrar''s
    office.


    There were the inevitable mistakes that sometimes crept into the system, and these
    had to be adjusted later by the students. This


    108'
