    # Speaker Independent Recognition


    Speaker independent recognition does not require the software to learn the uniqueness
    of person’s speech patterns. This would be impossible in computer telephony applications.
    It is not practical to have millions upon millions of unique speech patterns trained,
    stored and accessible anywhere in the world over the public telephone network.
    In order to solve this vexing problem into speaker independent recognition has
    taken two avenues of approach, and has generally provided two types of products.
    The two types are, discrete and large vocabulary speaker independent recognition.


