  md: '# Notation used in this book


    The use of the notation below is to { } to aid the reader in understanding what
    kind of speech or special reference is being made within the body of the text
    of this book. Although not used heavily, it is important to highlight this at
    this time.


    | Notation | Example use of Notation |

    | --- | --- |

    | Text enclosed by "< > recorded speech being played back by a computer telephony
    application. | For example <"two thousand, eight hundred widgets>|

