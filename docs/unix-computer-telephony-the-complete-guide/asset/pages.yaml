  md: '# BASIC CONCEPTS OF COMPUTER TELEPHONY


    # Types of Interfaces


    Interfaces describe how the computer and the telephone equipment talk to each
    other. As we have seen this is usually achieved by using a switch or a direct
    connection from the telephone company to your computer. The following reviews
    the most commonly found interfaces used in a computer telephony environment.


    # Analog


    Analog interface has already been discussed at some length. The main issue to
    know is this type is based upon electrical impulses that are later translated
    into sound, which are analogous to the original speaker, or sound that was generated
    at the other end of the phone. This is the most basic kind of interface, and it
    is used for signaling between most kinds of telephone switching equipment and
    a computer system. The chief limitation of analog transmission is the speed of
    data that can be transmitted. Since all analog telephones must be able to understand
    how to process a limited bandwidth of sound, then there is a limited amount of
    data that can be pushed through that small pipe.


    A related subject to analog transmission is modern theoretical upper limit of
    performance. The manufacturers of these devices use very advanced software algorithms
    to compress the data before transmission, and the sound waves being sent between
    them, in order to provide the current levels of data transmission. That is why
    digital signaling is an important resolution to this problem, since it has enough
    bandwidth to carry both voice and data at the same time.


    # Direct Inward Dialing


    Direct Inward Dialing (DID), known in Canada and the USA by the trade name of
    Centrex, is really a description of where the telephone lines are originating
    and terminating, as well as being an interface. In our discussion so far we talked
    about a private branch exchange managing all the internal calls and outbound calls
    within an office. All the telephone calls come from the telephone central office
    switch, and terminate on your private'
  merge: -1
  pgno: 75
- img_proc: true
