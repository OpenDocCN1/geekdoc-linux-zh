  md: '# # UNIX

    # Computer Telephony


    > "This is a great book. In you''ll find business solutions you didn''t know existed.
    John has searched to find the very best implementations of UNIX based computer
    telephony. If you follow his advice I''m sure you will be well-served."


    — Doug Michels, Chief Technical Officer, EVP, and Co-Founder of SCO


    This non-technical book will teach you:


    +   - What are the basic computer telephony concepts, and applications such as
    Voice Response, Call Centers, Fax Servers, and PC Switch technologies.


    +   - How others have handsomely profited from UNIX based computer telephony applications
    through an in-depth review of 14 business case histories in various industries.


    +   - Study the processes of implementing a multiple site, international computer
    telephony integrated call center environment.


    +   - Understand the business problems and processes that lead to significant
    cost savings and competitive advantage.


    +   - What measures are needed to be create the business case for your enterprise
    computer telephony solution.


    John Kincaide has over 16 years experience in computer technology. Over half of
    his career has been involved in UNIX systems, which includes over 4 years in enterprise-strength
    UNIX computer telephony. His company, Scheduled Solutions, provides sales support,
    and training of computer telephony systems. He has designed computer telephony
    solutions for many business world wide.


