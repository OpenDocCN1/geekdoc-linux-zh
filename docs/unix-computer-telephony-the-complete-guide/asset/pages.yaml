  md: '# OVERVIEW OF THE FICTITIOUS MINDEN BIOTECH RFP


    # Major Computer Telephony applications that are addressed


    The computer telephony applications that are addressed in this RFP are:


    +   1. Voice messaging system with integrated fax, voice and email delivery.


    +   2. Interactive Voice Response for test result handling, and call routing.


    +   3. Facsimile Server to fax out test results


    +   4. Call Center Solution with "screen pop", "screen transfers", and predictive
    dialing capabilities to handle all inbound calls for order processing, and outbound
    test results reporting and marketing.


    +   5. Internet and Intranet integration including email and Web based services.


    These major computer telephony applications are to work in concert with each other,
    so as to be a single cohesive system working with the selected database solution.
    The computer telephony applications are not isolated from the corporate environment,
    tightly integrated to other services such as email and Internet/Intranet browser
    access.


