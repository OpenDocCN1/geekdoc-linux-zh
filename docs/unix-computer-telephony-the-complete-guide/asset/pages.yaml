    # IDEAL SOLUTION DEFINED


    Jerry Cohen stated the ideal solution was, "To separate the call routing and the
    intelligence from the ACD, (automatic call distribution system), centralize the
    call routing along with the intelligence while distributing the agents wherever
    we wanted. We were aware that this was possible but we were having trouble identifying
    traditional solutions providers who could do this. From the beginning, the key
    was our local exchange carrier (Bell South). We needed them to provide the distributed
    connectivity. At that time they were forming a business relationship with Telquent.
    Because Georgia Power was able to articulate what the solution was, Bell South
    was able to work with them to implement Teloquent.


    # Call Flow


    The initial implementation of the Teloquent’s Distributed Call Center server was
    at the Atlanta call center, from which Georgia Power communicated with a remote
    office in northeast Atlanta with 12 agents. At the beginning of the project, Georgia
    Power had all the calls terminate to the legacy Teknekron PBX. The Teknekron would
    offer calls to the Teloquent system. There was no intelligence passed between
    the two systems and, as a result, they were unable to take advantage of any Teloquent
    features. The Teknekron PBX dumped the call overflow and other calls into the
    Teloquent system to be answered by the remote 12 agents in northeast Atlanta.
    Jerry Cohen pointed out that the calls did not necessarily have to be placed at
    that office. Initially the CICS database application information was not screened
    popped. The reason for that was, the Teloquent system was residing behind the
