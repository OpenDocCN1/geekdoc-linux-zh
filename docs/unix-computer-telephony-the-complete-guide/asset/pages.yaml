  md: '# FOREWORD


    What you now have in your hands is the result of my efforts and the cooperation
    of many others, which began as a momentarily lapse of attention, culminating in
    a book that is now over 462 pages in length, consisting of an estimated 108,714
    words. My adventure has led me to talk with and learn from many industry leaders
    as far as Hong Kong, Australia, Europe, and many points within the USA and Canada.


    This book''s focus is on the business manager who needs to understand the return
    of investment and implementation of enterprise-strength computer telephony integration,
    as it pertains to the UNIX platform. The book takes the reader from simple concepts
    as how a telephone works, right through to how to create and implement a multi-site,
    international computer telephony integrated call center environment.


    To support the business manager''s understanding, I review 14 case histories that
    use a variety of computer telephony applications. They include Interactive Voice
    Response, Call Centers, Screen Pops, Fax Servers, PC Switch Technology and other
    types of computer telephony applications. They are summarized below in Vital Statistics
    General Summary on page xx, showing strong return on investment justification
    for UNIX enterprise-strength computer telephony technology. As well, there are
    discussions of the “Ripple Effect” return on investment. When Computer Telephony
    applications are installed, they provide a benefit for the companies that install
    the technology, but also provide a cost benefit for their customers. This is the
    ripple effect. It is synonymous with the proverbial dropping of a pebble in a
