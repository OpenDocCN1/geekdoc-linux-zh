    with ''investment'' management.


    Background The National Bank of Egypt is the largest bank not only for that country,
    but as well in the Middle East. Although government owned, it is governed by market
    forces, such as competition. The bank has over 300 branches, of which there is
    one in New York City, and


    London, United Kingdom. They have a large number of customers outside the country,
    such as in Saudi Arabia and others in the Gulf region.


    The bank has a tradition of keeping a competitive edge in the market by providing
    to its customers the newest technologies to help service their needs, and to bring
    new products to market. For example, the National Bank of Egypt was the first
    bank to provide automated teller machines, and to offer VISA credit services.


    In accordance with this tradition, the National Bank of Egypt had also provided
    videotext terminals and PC based videotext access to their customers. This is
    where MediaSoft had been originally involved them years ago. During that time
    they had developed the


