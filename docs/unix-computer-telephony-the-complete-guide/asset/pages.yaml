  md: "# CALL FLOW\n\nFor economical and technical reasons, 24 lines of telephone\
    \ is best served (in North America) with a special type of telephone cable called\
    \ a T1 line. This is a twisted pair cable that carries 24 digital telephone lines.\
    \ In this case the fact that they are digital versus analog does not really matter.\
    \ The most important thing that digital line services usually have caller-id and\
    \ dialed-numbers. This type of telephone cable can terminate directly into one\
