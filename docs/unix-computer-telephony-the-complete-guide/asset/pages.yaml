    The first kind is called discrete speaker independent recognition. This kind of
    speech recognition is usually restricted to a series of recognizable zero through
    to nine, and some key words, such as ‘operator’ or ‘help’ or ‘exit’. The ability
    of the software to recognize this limited list is usually very high. This kind
    of speaker independent recognition uses a statistical model of speech for a specific
    population of speakers. English as a language has many speakers who have completely
