  md: '# PRIVATE BRANCH EXCHANGE (PBX) INTEGRATION


    # Automatic Call Distribution (ACD)


    This is a function of the private branch exchange or of a central office switch.
    It holds the inbound callers in queue until the next available person is able
    to answer the call. This is the typical way to keep callers on hold whenever you
    make a reservation with an airline. It is an important concept to understand,
    since it is a key element in computer telephony integration of call centers and
    computer telephony integrated workgroups. The main objective is to reduce the
    wait time any customer may experience, since it costs the company money, (especially
    if it is a toll free call), and it wastes the time of the customer. Computer telephony
    applications strive to reduce that wait time as much as possible, without having
    to add extra manpower in the call center or workgroup. We will discuss the details
    of this below.


    # Private Branch Exchange (PBX) Integration


    Private Branch Exchange integration refers to the ability to integrate a computer
    telephony application to signal to a private branch exchange. This is a very important
    function. Not understanding this could really make your life difficult. What in
    the world is a private branch exchange? It is the piece of proprietary telephone
    equipment. It is the special box in the telephone closet that allows you to make
    telephone calls within and outside your office. It is usually from vendors such
    as AT&T, Comdial, Ericsson, Mitel, NEC, Nortel, Rolm and other manufacturers.
    Your office telephone connects to the ports on this device in the wiring closet.
    When you pick up the phone and dial to an access number as “9 for an outside line”,
    you are informing the private branch exchange in your office to attempt to find
    the next available telephone company’s line. The telephone company’s central office
    exchange (or “switch”) provides you with dial tone, so you can dial the number
    you want, and accordingly routes your call to the office next door, or if necessary
    around the world.


    The private branch exchange equipment is sold with a ratio of inbound telephone
    company lines, to the number of extensions hanging off the system. If a telephone
    specialist or “interconnect” who sells telephone systems says that the private'
