    From a business point of view of the evolutionary development of the interactive
    voice response system at York University, Brent has noticed an interesting management
    issue, in terms of skill sets that the staff need to have to successfully manage
    such systems. In the late 1980''s the jobs of management of the systems were telecommunications
    specialists, hardware specialists who looked after the proprietary telephony hardware,
    computer hardware and software application specialists.


    With each new generation of interactive voice response technology that has been
    adopted at York University, the skill sets have been concentrated in fewer and
    fewer staff members. The current generation at York University now adds the dimension
    of clienterver databases using Oracle. The database application has migrated from
    a mainframe environment, to a mixture of smaller and more powerful machines. The
    staff that is required to manage this has been reduced in this configuration.
    Nonetheless, the remaining staff have to be well cross-trained in client-server
    computing and networking, remote database access, and in telephony. It is important
    to have the necessary training for the staff and the ability to hone their skills,
    so they can quickly react to newer situations. This does not minimize or negate
    the benefits gained from such an architecture and capability of the system.


    One of the motivating factors to change to the newest form of the technology is
