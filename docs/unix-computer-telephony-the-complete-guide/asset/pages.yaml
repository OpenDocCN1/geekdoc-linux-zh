    # OUT OF Band Signaling


    Out of Band Signaling takes all the messaging between the switch and the UNIX
    system running the computer telephony application and places it on a wire between
    the two systems, rather than within the message transfers themselves. Out of band
    signaling is usually much faster since none of the time the caller is on the line
    is stolen by transmission of touch-tones as in inbound signaling. Generally, the
    signaling is provided using a software interface, which drives a common standard
    piece of communications directly connected between the computer and the switch.


    An example of out band signaling is NEC''s MCI™ interface for their NEC 2400 (enterprise
    wide private branch exchange), and 2000 (small to medium size system), and others
