  md: '# ''INVESTMENTS'' BY THE NILE - NATIONAL

    BANK OF EGYPT

    TECHNICAL CHALLENGES


    The telecommunications infrastructure is not as strong as in western countries.
    There is a preponderance of rotary dial phones, with only 5% of the country supporting
    touch-tone. This is a special challenge, since interactive voice response applications
    require some mechanism to determine what number has been selected from the telephone
    keypad or dial. This was solved by providing pulse-to-tone detection equipment
    from Telelaison. This technology converts the pulses that a rotary dial phone
    makes into touch tones, so that the IVS system could understand what the caller
    had dialed.


    # System Overview


    National Bank of Egypt has deployed 3 applications:


    +   1. MediaSoft developed for National Bank of Egypt a commercial accounts banking
    by phone system, that provided:


    a) Obtaining the latest “investment” rates


    b) The latest exchange rates. This is of importance, since it been only in recent
    years that the Egyptian Pound was allowed to be convertible to hard currencies,
    such as US Dollars.


    c) Transfer money between account(s) for the same customer.


    d) Transaction history on the account(s).


    e) Leave messages for the bank for such things as ordering more cheques, or other
    notices.


    f) Fax -on-demand service to send account details by fax to a phone number on
    file.


    Of interest, was, that this IVS application was based upon the same access methods
    as the videototex, and PC access'
