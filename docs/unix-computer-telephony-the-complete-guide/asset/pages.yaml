    While the call is in progress, the Cygnus system monitors the call for disconnect
    on the shore side of the call, as well as for any voice energy from the ship side.
    Once the shore side of the call has disconnected, the billing record for the call
    is automatically updated. This eliminates an operator''s step from the manual
    keying of this information. If the call is disconnected on the shore side, and
    there is voice energy from the ship''s transmissions, the operator''s workstation
    automatically maximizes the window for that ship, and connects the ship party
    with the operator, he or he is available to answer the call. This allows the ship
    to place another call, or to ask any questions they may have of the operator.
    Since the operators'' calls are being handled in automated fashion, the wait time
    in the automatic caller distribution queue is much shorter, allowing a ship which
    just completed a call to be quickly presented to the operator. If there is no
    voice energy on the line after the shore party has disconnected, the call billing
    records are updated, and the icon representing the call on the operator''s screen
    automatically disappears. This is elegant computer telephony integration, which
    increases profits, saves money, and fosters happy customers.


    Glen said there are plans afloat to automate this process even further, allowing
