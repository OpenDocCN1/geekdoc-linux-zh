  md: '# INTEGRATED SOLUTIONS


    corporation. It has been designed for this industry for managing and reporting
    from receipt of samples, and laboratory work up, and to provide its reporting
    functions, and complete accounting. It is being customized by the MIS department
    of Minden Biotech for all the locations of the company. It is an enterprise wide
    system, which connects into other applications, such as desktop applications.
    It is this application which the computer telephony functionality is to be built.
    The goal is to build the computer telephony functionality and voice integration
    capability within three offices with call center capabilities.


    Phase II of the project is to migrate the Phase I: solution to be a single virtual
    call center and reporting system for all inquiries into the company. This is for
    sales, laboratory production, and test results. There are some jurisdictional
    restrictions on what kind of information and where it can be sent.


    # Major Business Issues


    The major business issues for this RFP are the following:


    +   1. The overall goal is to harmonize the disparate systems that are currently
    used to manage the business, and to increase the ability to communicate within
    the company, as well as with customers. Because of the merger and acquisition
    of the different businesses that now make up Minden Biotech, this has become an
    important infrastructure and customer relationship issue.


    +   2. The ultimate goal is to allow customers to have a single phone number to
    access any of the divisions of the company, within regulatory limitations.


    +   3. Flexibility of customer response - In the latter half of the solution,
    the ability for any one call center in the United States offices to cover for
    each other, will allow for the greatest amount of customer response. For the UK
    office, this will also be required, as its operations are expected to expand into
    continental Europe in the near future.


