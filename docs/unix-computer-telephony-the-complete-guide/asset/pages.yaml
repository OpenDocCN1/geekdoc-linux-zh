    This review is not meant to be a detailed text book review, and there are many
    good books on the subject. The purpose of this is to give a sense of how the data
    can be organized and how the information is retrieved. The database is the central
    tool to understand for most computer telephony applications.


    Database in the Corporation

    What is a definition of a database? A database is an organization of information
    in a structured way, so that the information becomes a central common resource
    for the organization. This also implies that many people can simultaneously access
    the data. Users obtain different views of the database information, which would
    be near impossible to perceive in a manual paper system. There are different kinds
    of databases that have been developed, which are relational, hierarchical, and
    network. The hierarchical database structures its data in an organizational tree
    like top-down structure. The network database organizes data in a circular fashion,
    where individual records with common associated properties are organized into
    cells, and each record and cell has the potential to reference each other. These
    kinds of databases, especially the network database can retrieve data in a very
    fast manner. They both have a drawback. Once they have been designed, it is difficult
    to change how they organize their data or be able to add new record structures
    to them.


