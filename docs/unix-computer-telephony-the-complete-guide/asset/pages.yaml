    # Business Analysis


    In this case history both the anonymous reseller of Arbinet alternate services
    and the multinational companies and individuals greatly benefit monetarily. Sheila
    Peterson said this portion of the long distance market is growing 100% per year.


    # RETURN ON INVESTMENT


    The major benefit for the anonymous reseller of Arbinet''s services is that they
    are now able to sell at a much greater margins of profit than they could in the
    very competitive long distance market in the United States of America. Even with
    the competitive discounts against the foreign countries public telephone network
    provider, the reseller still makes 30% more margins. In comparison, within the
    United States, wholesale long distance rates are down to 2.5 cents a minute, and
    the U.S. Government is purchasing bulk rates at 1.9 cents a minute.58 This is
    forcing resellers in the US market to provide value added services in order to
    increase profitability, while competing in a relatively new market in international
    dial back, at much higher margins, with less need to provide alternative services.


    # RIPPLE EFFECT


    The companies that are doing international business or are organized as a multinational,
    also see the reduction in costs and increased communication with their clients,
    and their ability to service the needs of their customers. When communications
    costs drop, generally the profits of the company increase, since it is easier
    to service existing customers, and increase the opportunities to search for new
    prospects.


    Generally speaking the end user customers see at least 30% reduction on the costs
    of placing international calls as compared to the rates of the local telephone
    company.


