  pgno: 143
- img_proc: true
  md: '# THE "REGISTRAR" - YORK UNIVERSITY


    would further disrupt their well laid plans. Some students would even push the
    academic rules to the limit. They would purposefully book a course, only to drop
    it within the time limits the Dean of Academics would allow during the actual
    semester. They would switch it later, in order to get the course time or professor
    they originally wanted. They would gamble that some other student would do the
    same and drop out of the course that you were after.. Ahh... the fond memories
    of our days of our higher education! 27


    That was then. This is the here and now. Interactive voice response systems for
    course registration have evolved, from dedicated proprietary technology systems
    of the late 1980s, to open architecture, high volume integrated database system
    technology, that can handle thousands of calls per hour. York University has seen
    the development and utilized this technology over the years.


    York University is one of Canada''s largest universities, with a student population
    of over 40,000 enrolled in undergraduate and post graduate courses. Its sprawling
    campus is located in the Metropolitan City of Toronto, Canada.


    Brent Wade, Senior Support Analyst, for York University MIS department, remembers
    the first student registration system implemented in 1989. “The demands of the
    system were such that interactive voice response technology was still evolving.”
    The architecture was somewhat proprietary and eventually the University’s needs
    surpassed its capability. The next generation of technology was purchased by IBM
    from Synレクト Technology, connecting to the mainframe. This has recently been succeeded
    by a DirectTalk/6000 system integrated with new client-server Student Information
    System. This had the growth potential and capacity to meet the University’s requirements.
    The current usage of the technology has migrated to a client-server format, providing
    further expandability and flexibility at better costs.


    # System Overview


    The technology comprises IBM DirectTalk/6000 system with 48 telephone ports using
    T1 cards. It is a midrange IBM RS/6000 system. The DirectTalk/6000 manages the
    course registration


    109'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# INTERACTIVE VOICE RESPONSE


    requests. It interfaces through the university''s network, to a Digital Equipment
    Corporation VAX and UNIX systems which run an Oracle database that maintains the
    student registration system. This then allows up to 48 concurrent accesses to
    this database. In this configuration the DirectTalk/6000 system acts as a transaction
    processor against the Oracle based Student Information System (SIS).


    As you can well imagine, the complexity of knowing the current status of a student
    in their degree, and knowing what courses are allowed to be taken, by this particular
    student in this point in their academic career, can be quite variable, and complex.
    There are two possible ways to handle these business rules. You could build all
    the rules within your interactive voice response logic, or you could store these
    rules within the database itself, and then have the database applications take
    action based upon those rules. The latter is much more preferable than the former,
    because this allows the database, along with the raw data about a student to coexist,
    be easily changed by another Oracle application.


    The business rules for the database are based upon year levels and the number
    of credits the student has successfully completed. When the interactive voice
    response application reads the results of applying the rules, it then knows what
    type of voice prompts to provide to the caller. This way there is consistency
    in the presentation and access to the course registration system.


    If you coded the business rules inside your interactive voice response application,
    then a change in a business rule in the next semester, or the following year in
    a degree and its credits, could cascade into an immense coding and testing task.
    York University manages this complexity by building the business rules within
    the database application (SIS), and then having the interactive voice response
    application read those rules as it executes.


    110'
