  md: '# ''INVESTMENTS'' BY THE NILE - NATIONAL BANK OF EGYPT


    # ''Investments'' by the Nile - National Bank of Egypt


    What are the challenges of deploying computer telephony technology outside North
    America and Europe, where we have very modern and easy access to telecommunication
    services? What are the cultural issues, and liaison that is necessary for success?
    MediaSoft Telecom''s work with the National Bank of Egypt has been a success by
    using their IVS product to provide voice and fax services for this customer.


    ![](img/362eeaab106d8805ce9d069d00181098_152_0.png)


