    # Background


    Minden Biotech Inc. is a leading biotech laboratory providing development of genetic
    management through patent recombinant DNA processes and testing services. The
    company has two divisions for the creation of new hybrid grains and feeds, such
    as wheat, barley, rice, oats and other similar products. The company also holds
    patents on specialized DNA analysis quickly identifying new strains of fungal,
    viral, and bacteriological agents that can quickly destroy crops. Quick identification
    allows for farmers and agricultural agencies to take action with recommended procedures
    to combat crop losses. Remedies can include recommendations to use Minden Biotech
    genetically engineered strains of grains which are inherently resistant to the
    attack of the bacterial, or fungal agents.


    Minden Biotech is certified by several U.S. and United Kingdom agencies to conduct
    genetic DNA work for agricultural use. Minden Biotech tests for a great number
    of bacterial, viral, fungal agents as provided in soil, and plant samples. In
    addition to genetic testing, Minden Biotech offers a range of integrated services
    that are customized to assist clients in implementing cost-effective genetically
    based testing programs.


    The essential elements of genetic testing are a secure and specially handled biohazardous
    material container. A second independent test is performed to confirm each positive
    test result. The Company carefully controls each step of the testing process by
    following detailed written procedures, and by using the specific genetic testing
    methods. The Company performs the largest portion of its testing at its laboratory
    in Minden, Nevada that generally operates six days per week, 24 hours a day. The
    Company also provides complete testing services in the UK.'
