    The old system was labor intensive, since the operator had to be in the call cycle
    most of the time, and had to keep track of the call, and manually update the call
    records in a database. As the business grew, and more more operators were being
    needed to manage the traffic. They had 6 operators at a time, working in shifts,
    24 hours a day. Since their business was expanding the need to have more operators
    was also looming. The problem was that a single operator can handle only one call
    at a time. They were losing calls. Since each call takes a specified amount of
    time, the manual system could not keep up with the demands. The existing legacy
    private branch exchange was operating at full capacity to handle these calls,
    and did not offer any more features to address the more advanced needs of Maritel.
    It had limited capability of queuing the call, and terminating it to a live operator.
    Other problems were more human related than computer or telephony related. Once
    the call had been received from the ship and linked to the land based party, the
    operator had to remember that the call was in progress. Once there was one call
    in progress, and the operator had to handle another call, the operator still had
    to keep track of all the other calls in progress. Once the calls had been completed,
    the Maritel operator had to manually write the billing information into the database.
    This allowed for inevitable human error to creep into the system.


    Maritel estimated they were losing up to 30% of calls being placed from the ships.
    Since the manual system created such a bottleneck, these other calls could not
    talk to the Maritel operator. This lead to'
