  md: '# THE “VIRTUAL DISTRIBUTED TELECOMMUTER” - GEORGIA POWER


    Not every job is a candidate for telecommuting, nor is every staff member a candidate
    for telecommuting. One survey Frank Boyd referred to was that 30-35% of a business
    personnel are candidates for telecommuting. In manufacturing environments this
    average will be lower, while in insurance the average will be higher. Not every
    one can work independently. However this is not the case at the remote call center.


    Generally, when reviewing the kinds of employees that are candidates for telecommuting,
    it is advisable to look at both hourly and salaried employees, and the kinds of
    work they were doing. Hourly employee positions that are candidates for telecommuting
    are:


    +   1. claims processing


    +   2. employees involved in handling accounts payable and receivable.


    +   3. purchasing


    +   4. customer services using the phone, where you do not have to be at a physical
    location and where you do not have access to physical things other than a computer
    and a phone.


    On the salaried sided, those who work with customers and are dealing with the
    outside public on an ongoing basis are also candidates for telecommuting.


    There were several reasons why Georgia Power was looking to expand their existing
    call center capabilities.


    +   1. The number of customers in Atlanta, Georgia increased, and the size of
    the toll free area was also growing. This may be seen as a costly new business
    requirement but it also has its advantages. The expansion of the toll free area
    allowed for the redirecting of calls away from some smaller call centers outside
    of Atlanta.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# COMPUTER TELEPHONY INTEGRATION - CALL CENTERS


    2. The size of the call center in Atlanta Georgia was 100 agents.

    The increased call handling capacity requirements placed demands on the physical
    space at the call center. They were running out of space.


    3. The Clean Air Act started forcing Georgia Power to change the commuting patterns
    of its workforce. Georgia Power needed to meet the goals of obtaining a number
    of credits provided by the Clean Air Act. In order to meet these goals they needed
    to have less staff commuting to their call center and for other workers to their
    offices. In this case the commute was into Atlanta, Georgia. In general the goal
    of the Clean Air Act is to have up to 20% of workforce telecommuting for specific
    sized businesses by the year 2000.


    Georgia Power deploys smaller remote call centers that are an extension to the
    existing call centers. The communications between the main call center and the
    remote call center is done by dedicated T1 connections and a remote shelf off
    of the ACD. (A shelf is a term used to describe a remote call center office that
    is like an “extension” to the existing call center.) The data communications component
    also requires a dedicated T1. The net result is that a remote shelf requires a
    minimum of 20 staff members to be cost effective. Even if they used a fractional
    T1, the other investments in hardware and labor to set up the shelf did not make
    it practicable.


    Another factor in seeking a newer configuration and solution, was that the increased
    demand also meant increased investment in the existing call center. The investments
    were in the physical space and computer and telephony technology. There was a
    capacity of a maximum of 30 locations on the computer host side. Using remote
