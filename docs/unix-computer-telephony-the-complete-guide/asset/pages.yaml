    factor for successful cut over of a system. Ensuring that the supervisors are
    trained in advance, with sufficient warning, and providing appropriate training
    on the software, and call handling of the staff will go a long way to reducing
    the startup costs and increasing the long term success of the call center.


    # Business Analysis


    Although the focus of this case history is on the managerial issues, there is
    nonetheless a powerful business story about how Charles Schwab has benefited from
    computer telephony integration. Here are the basic facts:


    +   1. There are over 1600 agents


    +   2. They take over 300,000 calls per trading day of 8 hours, which operates
    51 weeks of the year.


    +   3. The staff that take these calls are stock brokers who hold a Series 7 certificate
    to allow them to trade securities. The average industry us salary is about 50,000
    per year. Please note this is an industry average, and not necessarily the salary
    paid at Charles Schwab.


    +   4. Computer telephony integration saved an average of 20 seconds per call.


    +   5. The average cost of 800 number minutes purchased in large volume is about
    5 cents per minute.'
