    to a human about their problems. The PBX has to determine in its pool of available
    agents, who is next to listen to the caller''s tale of woe, or eagerness to buy.
    It finds an agent. It signals (there are many ways to do this signaling) to a
    UNIX system that they have free agent at extension 347, and here is the ANI information
    about the customer. The UNIX system looks up in its customer table of its relational
    database using the customer''s phone number as part of the SQL statement. In this
    case, the company identifies the customer by their residential telephone number,
    which happens to be the same number the customer is calling from. (This may be
    convenient for this example, but in real life, the ratio of matches from the ANI
    to the customer telephone number in the database is quite high). The UNIX system
    starts a database transaction to have its output to a screen at a TCP/ip network
    location /dev/tty03, while at the same time signaling the PBX to transfer the
    caller to extension 347. Ergo, the voice and the data are synchronized and delivered.
