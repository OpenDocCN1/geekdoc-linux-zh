  md: '# THE "HURRICANE TRACER" - UNIVERSAL

    WEATHER & AVIATION


    # The "Hurricane Tracer" - Universal Weather &

    Aviation


    ![](img/362eeaab106d8805ce9d069d00181098_162_0.png)


    If you were an insurance utility company, would you not want to know where weather
    disasters and losses are to strike? Hurricane watches & warnings for tornadoes,
    thunderstorms, ice storms and flash floods are some of the perils that would be
    of interest to insurance and utility companies. Planning ahead for such events
    allows them to be more responsive to the needs of their customers. For aviation
    and navigation planning special weather statements could be very valuable


    Figure 3-1 V-Systems helps Universal Weather & Aviation to serve their customers
    with customized bulletins via fax without customer intervention.


    heavy rain, wind, and fog conditions could be very valuable information. How can
    this information be quickly transmitted, and without any specific request of the
    customer requiring it? The answer is a fax server. In this case history we examine
    how Universal Weather uses V-Systems VSI-FAX software to transmit thousands of
    pages per day to their customers.


    # Background


    The history behind selling aviation weather by Universal Weather & Aviation had
    its beginnings in the United States following the Korean War. The United States
    military decided to sell their smaller and no longer needed transport jets to
    corporations. These sales were not to commercial airline carriers. As part of
    the deal, the US offered to supply the peripheral crew services to the corporation''s
    own crews. This being the same services a airline would provide to to their crews.
    One of these services was weather information. Unfortunately, over time, the US
    military found that providing these services became too expensive to deliver to


    127'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'corporations who had purchased the aircraft. They then moved out of that business.


    This left an opportunity, for Tom Evans, the founder of Universal Weather and
    Aviation, in 1959 to start a private weather company. The mission of the company
    then was to gather the information pilots needed and resell it to. This service
    has been the mainstay of the company for many years. Universal & Aviation has
    grown to be a much more comprehensive service company. It has 30 offices around
    the world, supplying information to several thousand customers, who in turn fly
    several thousand aircraft. The company is a world leader in the aviation industry
    sector, called corporation aviation service management. The services provided
    go far beyond weather information. Universal Weather & Aviation provides legal
    documents such as visas, passports, and fly-over permits for crews. As well, they
    provide ground transportation, discount accommodations, contract for fuel, providing
    credit for aviation fuel at several thousand airports around the world. Beyond
    this, the most important services is still providing weather information to the
    corporate air crews.


    The information that is being sent to Universal Weather and Aviation''s customers
    is not of the same nature that one may generally acquire from the US National
    Weather Service. Any person can call the US National Weather Service and demand
    weather information. The information they receive in a structured format that
    may not be as useful or as timely to certain types of customers. For example,
    it is important for a pilot to know the wind speeds, and wind shears around a
    thunderstorm to avoid trouble. He would want to know about rain conditions on
    the runway at the destination airport. Notification of localized and dangerous
    weather by state, county, and city, and in what format of presentation is the
    added value the company provides. These are examples of how specialized are the
    kinds of weather bulletins provided by Universal Weather & Aviation. This information
    may not be readily available from the US National Weather Service.'
