  md: '# INTERMEDIATE LEVEL DISCUSSION ON

    DATABASE & SQL


    Please not be too concerned that the above SQL query may be as clear as mud to.
    We will break it down into its component pieces so that you will get an idea of
    how it is working on the data in the database tables. Please note that the columns
    being manipulated qualified by the name of the table to avoid confusion. This
    is standard SQL syntax as described by the American National Standards Institute
    (ANSI) SQL specification. The WHERE clause performs most of the work here in order
    to sort out what is going to be retrieved. First of all it takes the string:


    ```

    STUDENT.last_name="Dobson" AND

    COURSE.course_term="1996 Fall"

    ```


    Figure Appendix C-6 Database: University Example: Compound Equijoins


    And reduces the list to a student called “Dobson”, that is taking courses in “1996
    Fall”. What is next done is to use the intersection table to provide the relationship
    between STUDENT and COURSE. In order to do this the WHERE statement does a join.
    It joins the two tables to produce a new set of results as a new temporary table.
    In this case there are effectively 2 joins happening at the same time.


    The first join is:


    ```

    STUDENT_SCHEDULE.student_id=

    STUDENT.student_id

    ```


    find all occurrences of the same student_id that belongs to student “Dobson” in
    the Student table, and matches them with the same student_id in the STUDENT_SCHEDULE
    table.


    The second join is:


    ```

    STUDENT_SCHEDULE.course_id=COURSE.course_id

    ```


