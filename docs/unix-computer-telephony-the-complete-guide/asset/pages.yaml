    the product. X-Windows is an open standardized windowing technology that allows
    applications to be executed on different platforms, without having to write specific
    software for each platform. In this way, one can see the potential output of a
    fax from any workstation that has the X-Window software installed on the system.
    VSI-FAX supports viewing and creation of fax documents, from character as well
