    This table can be generated by the relational database software as part of the
    process to generate the report on an ad hoc basis, or permanently present as part
    of the database. In this case it would be a permanent table, so as to minimize
    the compute and disk access time for such a common and frequent request. The issue
    is now how does one relate these different individual students, and teachers,
    and courses to answer our question.


