    Herein, lies the problem with using products such as Internet Phone, in that you
    do not know the Internet protocol address that has been assigned to the person
    that you want to talk to, until both parties of the conversation have successfully
    connected to the Internet. In order to set up a call, a prearranged time of the
    call has to be established by either e-mail, or by a regular long distance telephone
    call. Once both parties are connected to the Internet, they have to exchange email,
    or a long distance call to inform each other of their newly assigned Internet
    addresses. Then they can use their voice over the Internet software to talk to
    each other. Some companies such as Microsoft are setting special directories on
    the Internet to allow users to search for their prospective parties, without having
    all this hassle. The problem will not easily go away, until a newer standard of
    Internet addressing has been rolled out.


    The quality of sound of voice on the Internet software has been plagued by the
    very nature of the Internet itself. The Internet was designed, so in the case
    of a nuclear cataclysm, communications could still be obtained with the other
    sites on the Internet. This is possible on this network, since the routing information
    is not centralized through a single computer.


    The Transmission Control Protocol/Internet Protocol (TCP/ip) software manages
    the routing and bundling of information into packets. Each single email message,
    sound, voice, and data record is broken down into individual packets and then
    sent to the Internet address specified in its destination. You may think that
    the information between a computer system in Yellowstone, North West Territories,
    Canada to a computer system in Sydney, Australia would go directly from one system
    to the other. This is rarely the case. The information will hop from one computer
    to another system in a long chain of computers and network routers before reaching
    Sydney, Australia. If one of the computers in the chain


