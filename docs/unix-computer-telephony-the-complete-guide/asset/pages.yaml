  md: '# Business Analysis


    The following business analysis uses a published study for the faxes quantifiable
    numbers for the basis of return in investment. This study showed the benefits
    of using fax based systems as compared to regular US Postage, and labor rates.


    # RETURN ON INVESTMENT


    Although Robbie Gilbert did not complete a time study of the savings of the faxing
    solution for his company, there is a generally accepted cost saving structure
    for fax servers in the computer industry. Depending on the year of time, Stingray
    Boat generates anywhere from 2,500 to 3,500 faxes per month, with an average of
    2 pages per fax. On this average for the year is about 3,000 faxes per month.
    This translates to about 115 in low season and 160 faxes per day in high season.
    Each document costs $1.79 mailing and labor as a mailed document. Faxing the same
    document costs $0.50 per fax for a savings of $1.29 in 1994 dollars. Therefore,
    the estimated savings for Stingray Boat at the average monthly volume is $3,870
    or $46,440 per year.


    Another major factor Robbie Gilbert identified the amount of time saved because
    of automated fax retry by Faximum, whenever the destination fax is busy. Although
    modern fax machines have a memory storage for scanning a document, and provide
    retries, this does not compare to the fax server''s ability to handle a large
    number of simultaneously requests and the unattended management of the number
    of retries the fax is sent.


    Most of this saving is in labor time. It is important to realize the savings have
    not resulted in the elimination of positions at Stingray Boat. Instead, it has
    allowed those key staff members to do other tasks which help support the overall
    efforts of the company to run more smoothly, and increase customer support.


    # RIPPLE EFFECT


    One of the benefits for the dealers around the world is that they do not have
    to spend extra time talking directly to individual departments as their orders
    are processed, since faxing has reduced


