    Specimen Collection and Transportation. Genetic testing begins with specimen collection
    conducted under carefully controlled conditions. Once the soil, and plant samples
    are collected it is assigned a unique specimen number. A bar-coded or numbered
    label with this specimen identification number is affixed to the specimen bottle
    and the bottle is sealed with a tamper-evident seal. Information pertinent to
    the specimen is then input into a form that has been bar-coded or numbered to
    match the specimen biohazard container. The collector then prepares the specimen
    for shipment to Minden Biotech. Specimens, together with the forms, are delivered
    to the Company by overnight or same day by special courier.


    +   * All samples taken for the Farmington, New Jersey location are shipped by
    special medical courier, since they contain blood samples. Shipments in the United
    Kingdom are also processed by special medical courier.


