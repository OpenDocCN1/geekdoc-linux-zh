    # Call Flow


    With the Mondial solution you do not need to be a computer ‘guru’ to place computer
    based calls using the Internet. In fact, you do not need a computer at all. Mondial
    allows you to use your regular telephone to dial into one of the local points
    of presence, and using an interactive voice response system enter in your account
    number, password and dial the long distance number. The call is connected to another
    computer (also referred to as a “point of present” or POP) in the country you
    are calling. The computer in the other country is sent the telephone number you
    want to speak with. The remote computer, using regular computer board hardware,
    dials your desired number. The remote computer and the local computer establishes
    the connection between your telephone with the dial tone in the other country.
    Between the two computers, voice is sent in TCP/ip packets, and reassembled into
    regular voice for transmission over the local telephone lines in the remote country
    or location. The two computers are connected using “Intranet”, or private network,
    that are communicating using the TCP/ip network software. There is a benefit of
    low cost leased communications link between the two systems. There is a SCO UnixWare
    computer system that is directly connected, using leased high speed data lines.


    The Mondial demonstration network, which existed until January 14, 1997, had points
    of presence in Australia, Hong Kong, Japan, Canada, Great Britain, and United
    States. The demonstration network was ended, in order for the commercial network
    to be implemented.


    Scheduled Solutions was given access to this network in order to research this
    book at a greatly reduced cost, as it would have been for the cost of the regular
    long distance carrier. The overall quality of the phone calls is very acceptable.
    Using the network to perform taped interviews for the case histories, there were
    no major downgrades in the performance or the quality of the network. This afforded
    a chance to review the material many times before writing the case histories.
    The tapes showed the quality of the sound constant, and there was very little
    interference.


