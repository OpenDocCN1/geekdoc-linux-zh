  md: '# INTRODUCTION


    # The Computer Telephony

    Adventure


    You too can Enjoy the Adventure and the Treasure


    Standing on the campus of the University of California at Santa Cruz''s Cowell
    College, I took a moment to reflect on what I had seen a few weeks before at one
    of my client''s offices. Cowell Campus is nestled amongst the redwoods in the
    Santa Cruz mountains about 600m overlooking Santa Cruz California and Monterey
    Bay. I was standing in the quadrangle looking towards the Pacific Ocean away in
    the distance with brilliant blue August sky above. The morning coastal fog hugging
    the edge of the football field below, giving you the false impression that you
    could walk on top of the fog cloud over Santa Cruz into the middle of the bay.
    I was attending the Santa Cruz Operation Inc. (SCO) Forum ''92. SCO is a leading
    UNIX operating system developer and specializes in UNIX on the Intel platform.
    SCO is the largest volume vendor of UNIX server licenses shipped worldwide.


    At the time I was working for a distributor/reseller who was selling SCO products.
    The client I was reflecting about CallStream Communications Inc. I had seen at
    their offices the ability to quickly create an interactive voice response application.
    Through an application generator, I was shown how an interactive voice response
    application could front end an existing database application, turning the telephone
    into a data terminal by accepting input via Touch-Tone and speaking out or faxing
    information. I thought this was very intriguing, and wondered how this technology
    could be applied to a very large number of existing'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# THE COMPUTER TELEPHONY ADVENTURE


    UNIX based applications that were based upon SCO UNIX. Order entry, order status,
    and a host of other kinds of applications could be used for different industries
    such as distribution, transportation, and many others. There must be many ways
    both telephones and computers could be used together to provide a powerful set
    of tools for customers to access their information. This was my opportunity to
    talk to people around the world who were attending the conference, which included
    end users, and vendors to discuss this technology with them. The results of my
    discussions were that this would be of interest to whom I had had spoken with.


    The interest was there and in a few short months I had been contracted to CallStream
    Communications Inc. and the adventure began in understanding, marketing and selling
    this technology. This has been an exciting adventure which continues to this day
    with many Scheduled Solutions'' clients.


    # Why write a book on UNIX based Computer Telephony Integration?


    The reason to write this book is to provide you reader with a practical guide
    to the implementation of these two very powerful technologies. You should be able
    to pick up this book and look in the tables in Appendix A to identify by industry,
    and by UNIX platform, the kinds of UNIX based Computer Telephony applications,
    and be able to see how it is possible for your company or organization to benefit
    by implementing the technology. As well, you should understand why companies selected
    a UNIX based product and why it was used in their environment. If you have been
    able to answer those questions, then our goals to help you may have been accomplished.
    Of course, we value any comments you may have or suggestions for additional case
    histories.


    # For those who do not know - what is UNIX?


    UNIX is a very mature (over 20 years old) and very modern computer operating system.
    When it comes to operating systems, they are like a good wine. They improve in
    quality, and ability with age. Operating systems software controls all the data
    storage, devices (i.e. printers, modems, and network and user terminal'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# FOR THOSE WHO DO NOT KNOW - WHAT IS UNIX?


    interaction), memory, and execution scheduling of all programs inside the system.
    Microsoft''s DOS, Windows95, Windows NT products and IBM''s OS/2 Warp are further
    examples of operating systems that run on personal computers. Other commercial
    operating systems are Digital Equipment Corporations VMS for their venerable VAX
    line of computers, and MVS from the IBM mainframe world.


    The UNIX operating system is different from the familiar Microsoft DOS operating
    system for personal computers, since it was designed to be multi-user and multitasking.
    This means a single computer can have many simultaneous users, and each of those
    could be simultaneously executing more than a single program at a time. For example,
    a personal computer running Microsoft''s Windows95 operating system on a Pentium™
    based computer for home use or for the office with 16mb of RAM (memory), will
    more than suffice the needs of an individual user to do more than one at a time.
    If the same computer had SCO OpenServer5 and SCO UnixWare (SCO''s trade names
    of their UNIX operating systems) instead of Microsoft Windows95 it could support
    up to 30 or more simultaneous users doing more than one task at a time! It is
    more likely you will find a UNIX system will be performing company wide or departmental
    tasks such as maintaining a central database application, rather than being used
    as a dedicated personal computer for word processing tasks. There are as well
    many workstations from Sun Microsystems and Silicon Graphics Inc. which produces
    UNIX workstation products, which perform many tasks, that traditionally have been
    used in academic or scientific research or government systems and the military.
    These workstation products typically have a low computing power to solve highly
    technical application problems. Moreover, companies like Sun Microsystems, have
    been successful in moving their product lines into more commercial application
    businesses with large departmental and enterprise servers that rival large mainframe
    computers. Sun Microsystems move into this market has brought about new software
    technologies for this market, which have included their XTL software for computer
    telephony.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'Unlike other operating systems, the internal structure of UNIX is widely known
    and most if not all off its specifications and software programming interfaces
    are publicly known. It has been licensed to work on very different computers from
    different manufacturers over the years. This has been a benefit as well as a problem.
    It meant the operating system is well known for its high user capacity and reliability,
    and that it was used by academia, the military (one military project used UNIX
    technology to spawn the beginnings of the Internet) and all sorts of commercial
    applications.


    Early in its history, a somewhat limiting problem with UNIX was portability of
    programs between computers, since each computer manufacturer had to make changes
    or special extensions to the operating system kernel to accommodate their computer
    hardware architectures. This in turn forced modifications of software programs
    if they had to be moved from one computer manufacturer to another computer of
    another manufacturer. This process is called portant applications. The term "porting"
    came from moving cargo from one ship to another, reflecting the arduous task that
    it entails to do. It meant some modifications were made to programs for one computer
    to run on another. This has been finally resolved with a unification of the UNIX
    operating system specification, which all manufactures must adhere to, in order
    to use the trade name of UNIX. This process started in the late 1980''s and was
    finalized with industry wide standards accepted in 1993 through 1995. As well,
    the special programs called compilers that translate human readable instructions
    in programming languages such as ‘C’ to binary computer instructions, now followed
    these standards to allow maximum program portability between systems. Because
    of UNIX''s open and well understood architecture, it has allowed the operating
    system to be even more widely adopted for commercial use. UNIX can be used for
    multiple functions all at the same time, such as being the database server, the
    networking server for Local Area Networks (LANs) and Wide Area Networks (WANs),
    direct terminal connectivity, and as we will see in this book - telephone control
    and computer telephony integration server.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# WHAT IS COMPUTER TELEPHONY INTEGRATION?


    This is yet another reason UNIX has been widely adopted in commerce. UNIX systems
    are often used to be the ''glue'' within organizations between older and dissimilar
    types of computer systems. One dominating advantage of UNIX is that it is not
    owned by any single vendor. Unlike Microsoft''s operating systems, the UNIX operating
    system is available from a wide range of computer manufacturers, allowing for
    competitive choice for its purchasers. UNIX now enjoys standardization, portability,
    scalability, and most importantly freedom of choice of implementation for its
    customers. UNIX offers something that customers of computer telephony applications
    most desire, which is high capacity, reliability, stability and scalability.


    Because of the difference in software engineering of the UNIX operating system,
    a similar application written for another operating system such as Microsoft DOS
    may not be able to handle the same number of simultaneous telephone calls as a
    UNIX system. In fact DOS was originally engineered for a single computer to perform
    one task at one time for a single person. Many software programs that run on DOS
    try to mimic multitasking, but inevitably they can and sometimes do fail causing
    either the program running to shutdown, or worse, stop the computer from working.
    Mission critical systems such as medical and telecommunications rely on UNIX based
    systems for their dependability. This is one reason reason Microsoft has embarked
    on Windows95 and Windows NT operating system strategies to overcome the limitations
    of DOS. Computer operating systems can be analogous to workbench tools. You have
    to use the right tool to efficiently and easily complete the task at hand. UNIX
    is a powerful tool, that with the appropriate training, is an excellent computer
    telephony platform.


    # What is Computer Telephony Integration?


    "Computer Telephony represents the cooperative merger between telephony and data
    communications. It is a form of telecommunications that concentrates on the movement
    of both encoded and voice-related information from one point to another for the
    purpose of automating transactions between machines and humans, or between machines”'
