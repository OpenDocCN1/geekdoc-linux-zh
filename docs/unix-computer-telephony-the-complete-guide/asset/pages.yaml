    MARKET DRIVEN STANDARDS BASED OFFERINGS


    For the developer who has been selling UNIX solutions since the early to mid 1980s
    may even feel this telephony standards battleground is kind of familiar. During
    the evolution of there have been many "standards wars" ranging from the architecture
    of the UNIX kernel to the external network communications methodologies. The solution
    arose in the 1980''s as the market and the industry realized that they would be
    stronger together with harmonized standards, even though UNIX vendors with overlapping
    competitive environments. The same is bearing true for the telephony industry,
    and these standards are now evolving as much as the UNIX based standards that
    we use today. Millions of people are thankful for UNIX standards such as internetworking
    protocols that allowed the Internet to exist.


    The drive towards open market standards started in 1993. They have evolved by
    the recognition by the PBX manufacturers that they needed to open up their architectures,
    while at the same time computer manufacturers could deliver the critical mass
    needed to bring the benefits of large scale and expensive call centers into the
    realm of smaller groups or workgroups within the corporate structure. What evolved
    is many different manufacturers aligning themselves to provide the integration.
    Through these market driven relationships has developed two kinds of "open application
    interface" or OAI. These interfaces are described as being either "Horizontal/Office
    Automation", while the second is "transaction applications.", Call Center applications
    are of the second category. There are about 3 now possibly 4 major standards that
    have been developed to meet the needs of the market. One that seems to be market
    dominant is the CSTA based standards. This standard in particular has a lot of
    support by various PBX vendors.

    What follows is a discussion of the different computer telephony integration application
    programming interface (API) standards that have evolved. Some are not native on
    UNIX, but can be used in conjunction to a UNIX database application via networking
    standards. A quick review of these are necessary, since


    196'
