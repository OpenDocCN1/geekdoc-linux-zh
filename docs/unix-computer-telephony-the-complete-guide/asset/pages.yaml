    # Business Analysis


    Headlands has a wide area network from the regional offices to the head office
    to communicate to a central UNIX server. This was done on purpose to reduce costs
    and simplify administration. Sending faxes to a central location where one can
    get the best negotiated price on telecommunications costs, would be an advantageous
    use of this kind of transmission. Your network costs would be much lower, and
    your computer and call accounting would be much easier to manage.


    If your company has geographically dispersed offices, where one can not justify
    the cost of providing a private wide area network, the same mechanism can be established
    using Internet email. Instead of having lower volume higher priced fax traffic
    at different locations, one could use low cost based Internet email to move the
    documents to a central location, and have it faxed out at one location.'
