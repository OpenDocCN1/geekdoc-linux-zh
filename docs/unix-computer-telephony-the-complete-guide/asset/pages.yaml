    voice as a strategy at this. However, the costs of the voice

    lines is typically a lower percentage ongoing cost of a call center.

    Capri Systems recommends Minden Biotech negotiate with

    the local and long distance carriers. Typically 7 to 8 cents per

    minute or even 6.5 cents minute is achievable with aggressive

    bargaining and commitment.


    # FAX SERVER


    Capri Systems would recommend that the Lynx system provide the

    bulk and client based faxing services. Fax server technology for

    integrated messaging services would be best served by the Octel

    Communications fax mail services, which are independent of the

    Octel system.


    # INTEGRATION FOR ALL SITES


    In order to describe some of the challenges posed by this RFP, one

    needs to review the components and the call flow.


    For each call center, the calls would arrive and terminate in the

    PBX. A caller may elect, if they have the access to the service to use

    t fax-on-demand services, or if they want, branch to a live agent

    d discuss laboratory results. In each case the call is being managed

    by the Systems Lynx system, which would either furnish the

    answers using the interactive voice response, or fax-on-demand

    ervices. The Lynx system would also include interface with the PBX via

    middleware technologies from Nabnasset. Through this

    middleware technology, the Lynx system would be able to manage

    the communications between the agents and the database, in order

    for the screen pops to occur. This would involve the ACD


