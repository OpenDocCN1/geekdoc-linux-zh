    # Introduction to Edubuntu


    # Introduction to Linux


    Linux is a free Unix-type operating system originally created by Linus Torvalds
    with the assistance of developers around the world.


    Linux has an official mascot, Tux, the Linux penguin, which was selected by Linus
    Torvalds to represent the image he associates with the operating system.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_8_0.png)


    # Linux for the Young


    “Ubuntu” is an ancient African word, meaning “humanity to others”. The Edubuntu
    Linux distribution brings the spirit of Ubuntu to schools, through its customized
    school environment.'
