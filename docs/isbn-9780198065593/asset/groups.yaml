    4. Create a poem with the help of your teacher. Type and format it using Word
    Processor.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_47_0.png)


    # ### Rain is falling


    Rain is falling down,

    tip, tap, tip, tap,

    Children like rain and say,

    tip, tap, tip, tap,

    Rain is falling on my window pane,

    Splish. splash, splish, splash,

    Rain rain come again.

    Children like to play in rain.

    And they say. ‘Hurray’, ‘Hurray’.

    Rain has made our day.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_47_1.png)


    # ### Spring


    *Welcome spring,*

    *with lots of flowers,*

    *colourful butterflies,*

    *fluttering all over,*

    *come, come friends,*

    *we all together,*

    *will enjoy the lovely*

    *season of spring.*


    5. Write a school notice.


    **For example,**


    #### Mayoor School, Ajmer

    #### 6th Summer Camp


    May 1, 2009


    Dear parents,


    The summer camp will be organized from the 9th of May to the 30th of May, 2009.
    For details and registration, please contact the school office.


    Wishing your child happy vacation!


    Co-ordinator'
