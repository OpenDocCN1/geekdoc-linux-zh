    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_33_2.png)\n\n- 4. [Space Bar]\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_33_3.png)\n\
    \n- 5. [Shift] key\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_33_4.png)\n\nDate:\
    \ __/__/____ Teacher’s Signature: _______________\n\n### Text Editing Features\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_34_0.png)\n\n**To Undo Changes done\
    \ in a Text Document**\n\nClick on Edit -> Undo\n\nAlternatively, you can press\
    \ [Ctrl+Z] (a keyboard shortcut for Undo). This command will undo the last change\
    \ done to the file.\n\n**To Redo Changes done in a Text Document**\n\nClick on\
    \ Edit -> Redo\n\nAlternatively, you can press [Ctrl+Y] (a keyboard shortcut for\
    \ Redo). This command will reverse the action of the undo command.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_34_1.png)\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_34_2.png)\n"
  mdcn: "\n## OpenOffice.org 文字处理软件\n\n### 开始使用文字处理软件\n\n点击“应用程序”→“Office”→“OpenOffice.org\
    \ 文字处理软件”\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_23_0.png)\n\n屏幕将显示如下：\n\n\
    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_23_1.png)\n\n### 键盘\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_24_0.png)\n\
    \n- 1. 键盘上有可以按下的按键，使字符（字母、数字和符号）出现在屏幕上。\n- 2. “按”的意思是用力触摸键盘上的一个按键，使字符出现在屏幕上，然后立即松开。\n\
    - 3. 现在按下“H”键。（屏幕上出现“h”。）在“h”旁边有一条闪烁的垂直线。这条闪烁的线是光标，它指示当你按下某个按键时，将放置内容在页面上的位置。按下“E”键，然后按“L”键和“P”键。（单词“help”出现在屏幕上。）\n\
    \n### 空格键\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_24_1.png)\n\n[Space Bar]\
    \ 键是键盘底部中间的长键。按下 [Space Bar] 键。（光标向右移动一个空格。）\n\n### Shift 键\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_25_0.png)\n\
    \n同时按下 [Shift] 键和一个字母键会使字母以大写形式出现。\n\n请按照以下步骤输入单词“Help”：\n\n- 1. 按住 [Shift] 键不放，同时按下“H”键。松开\
    \ [Shift] 键。（屏幕上出现大写字母“H”。）\n- 2. 按下“E”键，然后按“L”，再按“P”。（单词“Help”出现在屏幕上。）\n\n**思考角**\n\
    \n- 1. 你能在键盘上看到 [Caps Lock]（大写锁定）键吗？\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_25_1.png)\n\
    \n键盘上的一盏小灯告诉你 [Caps Lock] 键是开启还是关闭。这个键有什么用？\n\n- 2. 键盘上有一个 [Num Lock]（数字锁定）键。你知道它的用途吗？\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_25_2.png)\n\n- 3. [Backspace]（退格）键和\
    \ [Delete]（删除）键有什么区别？\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_25_3.png)\n\n\
    ### 鼠标\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_26_0.png)\n\n键盘旁边的设备称为鼠标。\n\
    \n- 1. 移动鼠标会使鼠标指针（光标符号）在屏幕上移动。\n- 2. 在桌面或鼠标垫上上下移动鼠标。注意指针也会在你的屏幕上上下移动。\n- 3. 在桌面或鼠标垫上左右移动鼠标。注意指针也会在你的屏幕上左右移动。\n\
    - 4. 移动鼠标，使指针位于你刚才输入的单词“Help”的某处。\n- 5. 要进行点击，请将右手放在鼠标上。将食指（你用来指东西的手指）放在左键上，按下该键然后松开。\n\
    - 6. 注意光标（闪烁的垂直线）移动到你点击鼠标的位置。按下字母 X。字母 x 出现在看到闪烁光标的位置。\n\n> **思考角**\n>\n> 你能看到鼠标左右按键之间有一个小滚轮吗？试着旋转滚轮并观察会发生什么。\n\
    \n### 练习单 1\n\n日期：__/__/\n\na. 判断正误，打 ✓ 或 ✗。\n\n- 1. 键盘是输出设备。\n- 2. 键盘上最长的键是 [Space\
    \ Bar] 键。\n- 3. 按下 [Shift] 键会使字母以大写形式出现。\n- 4. 鼠标是输入设备。\n- 5. 通过点击鼠标右键进行选择。\n\n\
    b. 给文字处理软件窗口的各部分标注名称。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_27_0.png)\n\n\
    日期：__/__/  \n教师签名：_________\n\n### 命令\n\n**打开新文件**\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_28_0.png)\n\
    \n点击“文件”→“新建”→“文本文档”。文本文档 Untitled 1 : OpenOffice.org Writer 会出现在你的屏幕上。屏幕是你看到事件发生的地方，就像电视屏幕一样。\n\
    \n**保存文件**\n\n点击“文件”→“保存”\n\n出现“保存”对话框。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_29_0.png)\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_29_1.png)\n\n在“名称”文本框中输入你的文件名。\n\n\
    点击“保存”按钮以保存你的文本文档。\n\n**打开现有文件**\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_30_0.png)\n\
    \n“打开”命令用于在文字处理软件中打开已保存的文件。点击“文件”→“打开”。出现“打开”对话框。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_30_1.png)\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_30_2.png)\n\n选择要打开的文件名。然后点击“打开”按钮。\n\
    \n**关闭文件**\n\n点击“文件”→“关闭”\n\n**思考角**\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_30_3.png)\n\
    \n你能看到菜单栏上有带下划线的字母吗？为什么它们带下划线？\n\n### 活动表 2\n\n一些建议的活动包括：\n\n- 1. 打开文字处理软件。输入你的名字、你所在的班级及分部、以及你学校的名称。\n\
    \  例如，\n  Ankita Kapoor\n  II A\n  Mayoor School\n- 2. 以“Myself”为文件名将该文件保存在“文档”文件夹中。\n\
    - 3. 关闭该文件。\n- 4. 打开该文件并添加当前日期和星期几。保存你的工作并退出文字处理软件。\n- 5. 打开该文件并添加所有家庭成员的名字。保存文件并退出。\n\
    - 6. 创建一个新文件，并输入关于计算机实验室中任何物体的 5 句话。例如，计算机、空调、投影仪等。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_31_0.png)\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_31_1.png)\n\n- 7. 教师可以拿一个袋子，里面装一些简单的东西，如球、铅笔、橡皮、盒子、小玩具、羽毛、石头、一张纸等。让每个孩子选择一个物体，并在文字处理软件中写下关于它的描述。保存文件。\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_31_2.png)\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_31_3.png)\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_31_4.png)\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_31_5.png)\n\
    \n- 8. 主题写作：一些建议的主题包括地球日、母亲节、我的学校、我自己、自然、我的家庭、我最喜欢的季节、在集市的一天、让我们谈谈我们的朋友。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_32_0.png)\n\
    \n- 9. 看图写话：教师可以向学生展示任何绘画或图片，讨论该图片，鼓励孩子们发言并交流想法，然后使用文字处理软件写几句话描述该图片。保存文件。\n\n\
    例如，\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_32_1.png)\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_32_2.png)\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_32_3.png)\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_32_4.png)\n\
    \n### 练习单 2\n\n日期：__/__/\n\n**a. 填空。**\n\n- 1. 每次按下 [Enter]（回车）键，光标会向下移动 ______\
    \ 一行。\n- 2. 输入和编辑文本的区域被称为 ___________。\n- 3. 用于打开新文件的按钮位于 ____________ 工具栏上。\n\
    - 4. 点击 ______ → 保存，以保存文件。\n- 5. 当你点击“文件”→“打开”时，_________ 对话框打开。\n\n**b. 配对连线：**\n\
    \n- 1. 新建\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_33_0.png)\n\n- 2. 打开\n\n\
    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_33_1.png)\n\n- 3. 保存\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_33_2.png)\n\
    \n- 4. [Space Bar]（空格键）\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_33_3.png)\n\
    \n- 5. [Shift] 键\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_33_4.png)\n\n日期：__/__/____\
    \ 教师签名：_______________\n\n### 文本编辑功能\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_34_0.png)\n\
    \n**撤销在文本文档中做的更改**\n\n点击“编辑”->“撤销”\n\n或者，你可以按下 [Ctrl+Z]（撤销的键盘快捷键）。此命令将撤销对该文件所做的最后一次更改。\n\
    \n**重做在文本文档中做的更改**\n\n点击“编辑”->“重做”\n\n或者，你可以按下 [Ctrl+Y]（重做的键盘快捷键）。此命令将撤销“撤销”命令的操作。\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_34_1.png)\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_34_2.png)\n\
    \n"
