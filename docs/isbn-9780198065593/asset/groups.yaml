    # Learn with


    # LINUX


    Learn with Linux for classes 1 to 8 is a computer science series for the primary
    and middle school, focusing on free and open-source software (FOSS). The curriculum
    for this course has been so designed that it conforms to the recommendations of
    the National Curriculum Framework 2005. Age-appropriate syllabi in each book links
    computer science education with real-life experiences. The aim of this series
    is to promote critical thinking and creativity amongst learners. The series is
    based on the Edubuntu distribution – a user-friendly, educational version of the
    Linux-based Ubuntu operating system.


    # Key Features


    +   ■ Makes appropriate use of screenshots to present concepts in a lucid and
    child-friendly manner.


    +   ■ Think Tank within each chapter poses application-based questions, encouraging
    further exploration and thought on the concepts covered.


    +   ■ Activity Sheet provides practical exercises integrating different subjects
    using the tools learned.


    +   ■ Worksheet contains questions, both objective and descriptive, for revision.


    +   ■ Teacher''s Note at relevant places gives useful suggestions to teachers
    on teaching methodologies and directions on how to explore a topic further.


    # About the Authors


    Neeraj K. Bedhotiya is the principal of Mayor School, Ajmer, and has been one
    of the pioneers in introducing the use of FOSS in school education. He has been
    an educator for more than 20 years, including 11 years at The Doon School, Dehra
    Dun and a year at Marlborough College, UK.


    Deepak Bhargava, currently the IT Co-ordinator at Mayor School, Ajmer, has nearly
    10 years of teaching experience at the senior secondary level and has been instrumental
    in setting up the FOSS network at his school.


    Gunjan Kotwari, faculty member of the computer science department at Mayor School,
    Ajmer, has a Masters in Information Technology, and has effectively implemented
    the switch to FOSS in her classes.


    # NOTE ON SOFTWARE


    Software used in this book can be freely downloaded from http://linux.oupcomputers.com.
    Also available is a DVD for teachers that contains the complete software requirements
    including the Edubuntu operating system, all the open-source application software
    covered in the syllabus, installation guides, an image library for the activities,
    and sample presentations. Windows versions of the application software are also
    provided. Teachers may contact the publisher for the DVD.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_75_0.png)


    OXFORD

    UNIVERSITY PRESS


    www.oup.co.in


    ISBN 0-19-806559-0


    9 780198 065593


