    \ you can press Ctrl+V (a keyboard shortcut for Paste).\n\n### Think Tank\n\n\
    - Try this:\n- For the text editing commands, you can use any of the following:\n\
    \  1. the menu bar\n  2. the toolbar\n  3. select the text and right click on\
    \ it to get the context sensitive menu\n  4. shortcut keys\n\n### Text Formatting\
    \ Features\n\nWord Processor allows many kinds of formatting styles.\n\n### To\
    \ Format Text\n\nThe first step is to select text to be formatted. Then click\
    \ on Format → Character.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_36_0.png)\n\
    \nThe Character dialog box will appear.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_37_0.png)\n\
    \nClick the **Font** tab in the Character dialog box.\n\nTo select a font, scroll\
    \ through the font-list and stop at the one you want to use. The font-list shows\
    \ all the fonts available on the computer you are using. As you scroll through\
    \ the list of fonts, a preview of the font selected is displayed in the preview\
    \ window.\n\nTo change the typeface of a font, select the desired typeface from\
    \ the **Typeface** list box. Available typeface types are: Regular, Regular Italic,\
    \ Bold, Medium Italic.\n\nTo change the size of a font, select from the Size scroll\
    \ box. Font-size is commonly expressed in points.\n\nClick on **OK** button to\
    \ apply the changes to the selected text.\n\n### To Further Format Text\n\nThe\
    \ first step is to select text to be formatted. Then click on Format → Character.\n\
    \nThe Character dialog box will appear. Click the Font Effects tab in the Character\
    \ dialog box.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_38_0.png)\n\nIn the\
    \ Underlining field, select the style.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_38_1.png)\n\
    \nIn the Color field, select the underlining color.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_39_0.png)\n\
    \nIn the Strikethrough field, select the style.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_39_1.png)\n\
    \nIn the Font color field, select the color you want to apply.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_39_2.png)\n\
    \nIn the Effects field, select the effect style.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_40_0.png)\n\
    \nIn the Relief field, select the texture style.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_40_1.png)\n\
    \nFurthermore, you can select the checkboxes from the following options to give\
    \ additional effects to the selected text.\n\n- Outline\n- Shadow\n- Blinking\n\
    - Hidden\n\n### To Set the Positioning of Text\n\nSelect the text to be formatted.\
    \ Then click on Format → Character. The Character dialog box will appear.\n\n\
    Click the Position tab in the Character dialog box.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_41_0.png)\n\
    \nIn the Position area, set the superscript or subscript option for the selected\
    \ text.\n\nSuperscript is used to reduce the font-size of the selected text and\
    \ raise it above the base line.\n\nNormal setting removes the superscript or subscript\
    \ setting.\n\nSubscript is used to reduce the font-size of the selected text and\
    \ lower it below the base line.\n\nFor example,\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_41_1.png)\n\
    \nIn the Rotation/scaling area, you can set the degree of rotation of the text\
    \ and the percentage of the text to be scaled. Click on OK button to apply the\
    \ desired changes. For example,\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_42_0.png)\n\
    \n### To apply Colored Background to the Text\n\nSelect the text to be formatted.\
    \ Then click on Format → Character. The Character dialog box will appear.\n\n\
    Click the Background tab in the Character dialog box.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_42_1.png)\n\
    \nClick on the color you want as a background for the selected text and then click\
    \ on OK button.\n\n### Worksheet 3\n\nDate: \\_\\_\\_/\\_\\_\\_/\\_\\_\\_\n\n\
    a. Fill in the blanks.\n\n1. The keyboard shortcut for redo is \\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_.\n2. Pressing [Ctrl+X] on the keyboard \\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_ the selected text.\n3. The keyboard shortcut for paste\
    \ is \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_.\n4. To apply superscript formatting to\
    \ the selected text, you need to click on \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_ tab in the Character dialog box.\n5. To apply background to the selected\
    \ text, you need to click on **Background** tab in the \\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_ dialog box.\n\nb. Match the following:\n\n1. Redo\n2. Paste\n\
    3. Copy\n4. Undo\n5. Cut\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_43_0.png)\n\
    \nDate: \\_\\_\\_/\\_\\_\\_/\\_\\_\\_ Teacher's Signature: \\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\n\n### Text Alignment\n\n### Text Alignment using Menu\n\nChoose\
    \ Format → Paragraph from the menu bar.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_44_0.png)\n\
    \nThe Paragraph dialog box will open.\n\nSelect the Alignment tab of the Paragraph\
    \ dialog box.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_44_1.png)\n\nThere are\
    \ four types of alignment options available. Select the desired alignment and\
    \ then click on OK button.\n\nAlign Left\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_0.png)\n\
    \nAll the lines of the paragraph start from the left margin with uneven spacing\
    \ on the right.\n\nCentered\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_1.png)\n\
    \nEach line is centered on the page.\n\nAlign Right\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_2.png)\n\
    \nAll the lines of the paragraph end at the right margin with uneven spacing on\
    \ the left.\n\nJustified\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_3.png)\n\
    \nAll the lines of the paragraph start at the left margin and end at the right\
    \ margin evenly.\n\nAn example showing the four alignments:\n\n| **Align Left**\
    \ | **Centered** | **Align Right** | **Justified** |\n| :--- | :--- | :--- | :---\
    \ |\n| This is a sample paragraph to depict text alignment options available in\
    \ OpenOffice.org Word Processor. This paragraph depicts **left alignment**. |\
    \ | | |\n| | This is sample text to depict text alignment options available in\
    \ OpenOffice.org Word Processor. This text depicts **centered alignment**. | |\
    \ |\n| This is a sample paragraph to depict text alignment options available in\
    \ OpenOffice.org Word Processor. This paragraph depicts **right alignment**. |\
    \ | | |\n| This is a sample paragraph to depict text alignment options available\
    \ in OpenOffice.org Word Processor. This paragraph depicts **justified alignment**.\
    \ | | | |\n\n### Activity Sheet 3\n\nSome suggested activities are:\n\n- Open\
    \ the documents created in Activity Sheet 2 and apply text formatting features\
    \ to them. Change the font styles, size, underline the headings, center align\
    \ the headings.\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_46_0.png)\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_46_1.png)\n\
    \n- Type a letter to your dear one and apply appropriate formatting styles and\
    \ text alignment options. For example,\n\n> Dear Mother,\n>\n> I love you very\
    \ much. You are so beautiful. You take care of me and you. You help me in my studies.\
    \ I am lucky to have such a nice mother.\n>\n> Your loving daughter\n> Mihika\n\
    \n> Teacher's Note\n> The teacher can take prints of the letters and mail them.\n\
    \n- Type and format your favorite piece of writing.\n"
  mdcn: "\n## OpenOffice.org 文字处理\n\n### 从文本文档中剪切文本\n\n第一步是选择你想要剪切的文本。文本选择是通过按住鼠标左键并将鼠标指针拖过你想要选择的文本来完成的。一旦选定的文本被高亮显示，释放鼠标左键以完成选择。然后单击“编辑”\
    \ → “剪切”。\n\n或者，你可以按 Ctrl+X（剪切的键盘快捷键）。选定的文本将从屏幕上消失，并被粘贴到系统的临时内存（即剪贴板）中。\n\n###\
    \ 从文本文档中复制文本\n\n第一步是选择你想要复制的文本。然后单击“编辑” → “复制”。\n\n或者，你可以按 Ctrl+C（复制的键盘快捷键）。选定的文本仍将显示在屏幕上，并且也会被粘贴到系统的临时内存（即剪贴板）中。\n\
    \n### 在文本文档中粘贴文本\n\n要粘贴你已剪切或复制的文本，请将光标放置在你想要粘贴文本的位置。然后单击“编辑” → “粘贴”。\n\n或者，你可以按\
    \ Ctrl+V（粘贴的键盘快捷键）。\n\n### 思考园地\n\n- 试一试：\n- 对于文本编辑命令，你可以使用以下任何一项：\n  1. 菜单栏\n\
    \  2. 工具栏\n  3. 选择文本并右击以获取上下文敏感菜单\n  4. 快捷键\n\n### 文本格式化功能\n\n文字处理器允许许多种格式化样式。\n\
    \n### 格式化文本\n\n第一步是选择要格式化的文本。然后单击“格式” → “字符”。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_36_0.png)\n\
    \n将显示字符对话框。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_37_0.png)\n\n在字符对话框中，单击**字体**选项卡。\n\
    \n要选择字体，请滚动字体列表并停在你想要使用的字体上。字体列表显示了你当前使用的计算机上可用的所有字体。当你滚动字体列表时，预览窗口中会显示所选字体的预览。\n\
    \n要更改字体的字形，请从**字形**列表框中选择所需的字形。可用的字形类型包括：常规、常规斜体、粗体、中等斜体。\n\n要更改字体大小，请从大小滚动框中选择。字体大小通常以点为单位表示。\n\
    \n单击**确定**按钮以将更改应用到所选文本。\n\n### 进一步格式化文本\n\n第一步是选择要格式化的文本。然后单击“格式” → “字符”。\n\n\
    将显示字符对话框。在字符对话框中，单击字体效果选项卡。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_38_0.png)\n\
    \n在下划线字段中，选择样式。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_38_1.png)\n\n在颜色字段中，选择下划线颜色。\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_39_0.png)\n\n在删除线字段中，选择样式。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_39_1.png)\n\
    \n在字体颜色字段中，选择你要应用的颜色。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_39_2.png)\n\n\
    在效果字段中，选择效果样式。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_40_0.png)\n\n在浮雕字段中，选择纹理样式。\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_40_1.png)\n\n此外，你可以从以下选项中勾选复选框，为所选文本添加额外效果。\n\
    \n- 轮廓\n- 阴影\n- 闪烁\n- 隐藏\n\n### 设置文本定位\n\n选择要格式化的文本。然后单击“格式” → “字符”。将显示字符对话框。\n\
    \n在字符对话框中，单击位置选项卡。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_41_0.png)\n\n在位置区域，为所选文本设置上标或下标选项。\n\
    \n上标用于减小所选文本的字体大小并将其提升到基线以上。\n\n正常设置可去除上标或下标设置。\n\n下标用于减小所选文本的字体大小并将其降低到基线以下。\n\
    \n例如，\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_41_1.png)\n\n在旋转/缩放区域，你可以设置文本的旋转角度和要缩放的文本百分比。单击确定按钮以应用所需的更改。例如，\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_42_0.png)\n\n### 为文本应用彩色背景\n\n选择要格式化的文本。然后单击“格式”\
    \ → “字符”。将显示字符对话框。\n\n在字符对话框中，单击背景选项卡。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_42_1.png)\n\
    \n单击你想要作为所选文本背景的颜色，然后单击确定按钮。\n\n### 练习表 3\n\n日期：\\_\\_\\_/\\_\\_\\_/\\_\\_\\_\n\
    \na. 填空。\n\n1. 重做的键盘快捷键是 \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_。\n2. 在键盘上按 [Ctrl+X]\
    \ \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 选定的文本。\n3. 粘贴的键盘快捷键是 \\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_。\n4. 要为选定的文本应用上标格式，你需要单击字符对话框中的 \\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_ 选项卡。\n5. 要为选定的文本应用背景，你需要单击 \\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_ 对话框中的 **Background**（背景）选项卡。\n\nb. 匹配下列内容：\n\n1. 重做\n2. 粘贴\n\
    3. 复制\n4. 撤销\n5. 剪切\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_43_0.png)\n\n\
    日期：\\_\\_\\_/\\_\\_\\_/\\_\\_\\_ 老师签名：\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n\
    ### 文本对齐\n\n### 使用菜单进行文本对齐\n\n从菜单栏中选择“格式” → “段落”。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_44_0.png)\n\
    \n将打开段落对话框。\n\n选择段落对话框的对齐方式选项卡。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_44_1.png)\n\
    \n有四种可用的对齐选项。选择所需的对齐方式，然后单击确定按钮。\n\n左对齐\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_0.png)\n\
    \n段落的所有行都从左边距开始，右边距间距不均匀。\n\n居中对齐\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_1.png)\n\
    \n每行在页面上居中。\n\n右对齐\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_2.png)\n\n段落的所有行都在右边距结束，左边距间距不均匀。\n\
    \n两端对齐\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_3.png)\n\n段落的所有行都在左边距开始，并在右边距均匀结束。\n\
    \n显示四种对齐方式的示例：\n\n| **左对齐** | **居中对齐** | **右对齐** | **两端对齐** |\n| :--- | :--- |\
    \ :--- | :--- |\n| 这是一个示例段落，用于展示 OpenOffice.org 文字处理器中可用的文本对齐选项。本段落展示**左对齐**。\
    \ | | | |\n| | 这是一个示例文本，用于展示 OpenOffice.org 文字处理器中可用的文本对齐选项。本文本展示**居中对齐**。 | |\
    \ |\n| 这是一个示例段落，用于展示 OpenOffice.org 文字处理器中可用的文本对齐选项。本段落展示**右对齐**。 | | | |\n| 这是一个示例段落，用于展示\
    \ OpenOffice.org 文字处理器中可用的文本对齐选项。本段落展示**两端对齐**。 | | | |\n\n### 活动表 3\n\n一些建议的活动如下：\n\
    \n- 打开在活动表 2 中创建的文档，并对它们应用文本格式化功能。更改字体样式、大小，为标题添加下划线，并将标题居中对齐。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_46_0.png)\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_46_1.png)\n\n- 给你爱的人写一封信，并应用适当的格式化样式和文本对齐选项。例如，\n\
    \n> 亲爱的妈妈，\n>\n> 我非常爱你。你非常美丽。你照顾我和你。你帮助我学习。我很幸运有这样一个好妈妈。\n>\n> 你爱的女儿\n> 米希卡\n\n\
    > 老师备注\n> 老师可以打印这些信件并寄出它们。\n\n- 输入并格式化你最喜爱的作品。\n\n"
