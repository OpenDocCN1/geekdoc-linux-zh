    # Preface


    *Learn with Linux* for classes 1 to 8 is a computer science series for the primary
    and middle school, which focuses on free and open-source software (FOSS). FOSS
    refers to software that is liberally licensed under the GNU General Public License,
    granting users the right to study, change, and improve its design through free
    availability of its source code. Therefore, FOSS users have fundamental control
    and flexibility.


    Our introduction to FOSS transpired at a training program attended by one of us
    (Neeraj K. Bedhotiya) in 2004 at IIM (A), which enthusiastically endorsed the
    use of FOSS in school education. Thereafter, we experimented with this option
    in our school (Mayoor School, Ajmer), and this series is an outcome of our experiences
    over the last five years.


    The search for an appropriate open-source software led us to the Edbuntu distribution
    – a user-friendly, educational version of the Linux-based Ubuntu operating system.
    A comprehensive curriculum was then designed in conformity with the recommendations
    of the National Curriculum Framework 2005. The aim of this series is to promote
    critical thinking and creativity amongst learners, and age-appropriate syllabi
    in each book links computer science education with real-life experiences. Computer
    science is not treated as an isolated subject, rather a computer is projected
    as a tool allowing integrated learning and reinforcement of concepts from all
    core subjects.


    # Key Features


    +   1.  Makes appropriate use of screenshots to present concepts in a lucid and
    child-friendly manner.

    +   2.  **Think Tank** within each chapter poses application-based questions,
    encouraging further exploration and thought on the concepts covered.

    +   3.  **Activity Sheet** provides practical exercises integrating different
    subjects using the tools learned.

    +   4.  **Worksheet** contains questions, both objective and descriptive, for
    revision.

    +   5.  **Teacher''s Note** at relevant places gives useful suggestions to teachers
    on teaching methodologies and directions on how to explore a topic further.


    We invite you to share your experiences with FOSS and this series with us. Your
    constructive feedback on improving the content and coverage of these books would
    be greatly welcomed.


    -The Authors


    +   -   Software used in this book can be freely downloaded from [http://linux.oxcomputers.com](http://linux.oxcomputers.com)

    +   -   Also available is a DVD for teachers that contains the complete software
    requirements including the Edbuntu operating system, all the open-source application
    software covered in the syllabus, installation guides, an image library for the
    activities, and sample presentations. Windows versions of the application software
    are also available. Teachers may contact the publisher for the DVD.'
  - '[PAGE 5]


    We dedicate this book to

    ‘The Spirit of Mayoor School’

    that allows us to think and explore


    # ## Acknowledgements


    We are grateful to Late Dr. Laxman Mohanty, guest faculty at IIM Ahmedabad, for
    passionately promoting FOSS in education, and also to Dr. G. Nagarjuna, researcher
    at Homi Bhabha Centre for Science Education (Mumbai) and one of the founders of
    the Free Software Foundation of India, who gave us the solution to implement FOSS
    by introducing Edubuntu to us.


    Our special thanks to the technical team led by Mr. Pawan Yadav, who helped us
    in our research, in setting up a networked Linux lab, and in finding software
    solutions.


    We also thank the FOSS Community for diligently providing solutions to all our
    technical problems.


    Thanks are also due to the Mayoor School IT team which has worked hard on the
    layout of these books to make them attractive and child-friendly.


    We also thank Ms. Vineeta Bedhotiya, for her constructive criticism and guidance
    at every step.


    A special mention is due to all our students of the primary classes, who with
    their creative minds and innocent queries inspired us to think and come up with
    new ideas.


    Our heartfelt gratitude also to the parent community for their constructive feedback,
    and for keeping faith in us during the initial difficult phase of the change in
    platforms.


    Thanks are also due to the wonderful and supportive staff at Mayoor School, Ajmer,
    who always gave us fresh ideas to integrate computers with other subjects.


    Finally, our grateful thanks to the Mayo College General Council for supporting
    us in our endeavour to publish *Learn with Linux* series in association with Oxford
    University Press.


    We feel fortunate that we have been able to touch the lives of so many learners
    through these books. We would consider our job done, if we can instill the spirit
    of self-learning in students through the use of these software.


    -The Authors'
