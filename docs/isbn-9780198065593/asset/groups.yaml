  - '[PAGE 37]


    # OpenOffice.org Word Processor


    The Character dialog box will appear.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_37_0.png)


    Click the **Font** tab in the Character dialog box.


    To select a font, scroll through the font-list and stop at the one you want to
    use. The font-list shows all the fonts available on the computer you are using.
    As you scroll through the list of fonts, a preview of the font selected is displayed
    in the preview window.


    To change the typeface of a font, select the desired typeface from the **Typeface**
    list box. Available typeface types are: Regular, Regular Italic, Bold, Medium
    Italic.


    To change the size of a font, select from the Size scroll box. Font-size is commonly
    expressed in points.


    Click on **OK** button to apply the changes to the selected text.'
