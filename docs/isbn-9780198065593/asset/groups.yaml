    ## Edubuntu 简介


    Edubuntu 是一个完整的基于 Linux 的操作系统，免费获取并提供基于社区的支持。


    Edubuntu 社区建立在 Edubuntu 宣言中所确立的以下理念之上：


    - 软件应免费获取。

    - 软件工具应可被不同语言背景的人使用，并且无论是否存在残疾都能无障碍使用。

    - 人们应有自由以他们认为合适的方式定制和修改其软件。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_9_0.png)


    ### Edubuntu 桌面


    这些自由使得 Edubuntu 与专有软件有着根本的不同：你不仅无需支付费用即可获取所需的工具，你以及全球成千上万的开发者还有权修改并基于你的软件进行构建，直到它以你希望的方式运行。


    ## Edubuntu 中的教育软件


    Edubuntu 提供多种教育程序。其中一些如下：


    - **数学乐趣**（Fun with Math）—— TuxMath 是一款以 Linux 吉祥物 Tux 为主角的教育街机游戏！基于经典街机游戏“导弹司令”（Missile
    Command），Tux 必须通过解决算术问题来防御他的城市。


    - **办公套件**（Office Suite）—— OpenOffice.org 是一套类似于 Microsoft Office 套件的完整办公套件。它包含文字处理器，以及电子表格、演示文稿、绘图、数据库和数学公式应用程序。OpenOffice.org
    可以打开并转换大多数 Microsoft Office 文档，并支持许多语言。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_10_0.png)


    ## 数学乐趣 — TuxMath


    ### Tux 数学指挥官 或 TuxMath


    TuxMath 是一款简单的算术教育软件，主角是 Linux 企鹅 Tux。Tux 必须向从天而降的算式发射相位枪。学生必须输入正确的结果并按 [Spacebar/Enter]
    键，在算式触及地面之前将其摧毁。涉及的数学运算包括加法、减法、乘法和除法。这是儿童和成人锻炼头脑的好方法。


    ### TuxMath 的功能


    - 可爱的动画图形

    - 音效和音乐

    - 可选的屏幕输入，适合无法使用键盘的儿童（非常适合触摸屏！）


    ### TuxMath 的目标


    该软件的目标是培养口头和心算技能。在“Tux 数学指挥官”中，Tux 指挥官防御他的城市免受数学方程的袭击。你可以扮演 Tux 指挥官的角色。彗星正向你的城市疾驰而来，你必须通过解方程来摧毁它们。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_11_0.png)


    ### 游戏玩法概述


    Linux 企鹅 Tux 站在激光防御系统的控制台上，准备保护他的同伴企鹅免受坠落的彗星攻击。他的同伴安全地待在冰屋中。防御站两侧各有一个冰屋，Tux 的任务是保护总共四只其他企鹅。


    每颗 incoming 彗星都附带一个数学问题。输入正确的解会使激光摧毁彗星。输入错误的结果会导致失误。


    这种简单的游戏玩法令人娱乐，当彗星撞击冰屋时会变得更加有趣。第一次彗星撞击会使企鹅的冰屋部分融化。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_12_0.png)


    第二次撞击会使冰屋完全融化，迫使企鹅逃跑。企鹅永远不会受到伤害；一旦它们的冰屋消失，它们就会简单离开。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_13_0.png)


    让年轻玩家在企鹅逃跑前有两次尝试机会，有助于防止他们感到沮丧，同时仍提供挑战。


    ### 程序导航


    #### 标题屏幕


    在此屏幕上，你可以选择玩游戏、更改游戏选项、查看演职员表或退出。


    使用 [Up] 和 [Down] 方向键选择你想执行的操作，然后按 [Enter/Return] 键。否则，使用鼠标点击菜单项。按下 [Escape] 将退出程序。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_14_0.png)


    #### 更多选项屏幕


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_15_0.png)


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_15_1.png)


    #### 演职员表屏幕


    此屏幕显示演职员表。你可以按 [Escape] 返回标题屏幕。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_15_1.png)


    ### 如何游玩


    #### 摧毁彗星


    当彗星向你的城市坠落时，你必须解决它们的方程。


    要摧毁彗星，请执行以下操作：

    首先，找出方程的答案。

    例如，"3 × 4" 的答案是 "12"。


    其次，输入答案。当你在键盘上输入数字时，它们会出现在屏幕底部中央的 "LED" 样式显示器上。


    最后，按 [Enter/Return/Spacebar]。


    答案为你所输入数字的彗星将被企鹅 Tux 击落。


    注意：


    1. 有时多颗彗星会有相同的答案。在这种情况下，离你城市最近的彗星会先被摧毁。

    2. 输入 [Enter/Return] 后，"LED" 样式显示器会自动重置为 "000"，以便你可以回答下一个方程！


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_16_0.png)


    #### 更正你的答案


    如果你犯了错误，可以按 [Backspace/Delete]，屏幕底部中央的 "LED" 样式显示器将重置为 "000"。


    ### 失去一座城市


    如果你未能正确回答其方程而让彗星撞入你的某座城市，该城市的护盾将被摧毁。如果城市再次被另一颗彗星击中，它将完全被摧毁。


    *注意：* 当方程击中地面时，计算的正确答案始终会显示出来。


    一旦你失去了所有城市，游戏将结束。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_17_0.png)


    ### 教师备注


    教师可以在 Edubuntu 的终端应用程序中使用 --fullscreen 选项启动该程序。游戏屏幕将以全屏模式显示。


    ### 活动表 1：设置管理选项


    “Tux 数学指挥官”允许家长或教师调整部分游戏选项。点击数学指挥官训练学院。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_18_0.png)


    选择数学指挥官训练学院后，将显示以下屏幕。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_19_0.png)


    在这里，所有加法选项均可用。你可以根据孩子的年龄和理解程度选择所需的选项。


    点击下一个箭头按钮以浏览更多选项。例如，负数加法。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_20_0.png)


    下一个屏幕将向你展示更多选项。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_20_1.png)


    此功能使 TuxMath 对所有年龄段的儿童都很有用。


    ### 思考库


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_21_0.png)


    尝试点击名人堂。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_21_1.png)


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_21_2.png)


    ## OpenOffice.org 文字处理器


    ### 文字处理


    文字处理意味着使用计算机创建、编辑和打印文档。要进行文字处理，你需要一个称为文字处理器的特殊程序。


    ### 文字处理器的优点


    - 你可以进行修改或编辑，而无需重新输入整个文档。

    - 你可以对文档中的文本应用许多格式样式。

    - 你可以在文档中包含图形。

    - 你可以保存文档以供将来使用。

    - 你可以打印文档。


    OpenOffice.org 文字处理器是一款免费且开源的文字处理软件，是 OpenOffice.org 软件包的一个组件。


    > **教师备注**

    >

    > 教师可以介绍诸如文档、编辑、格式化、图形、保存、打开和打印等术语。她可以打开一个之前创建的文件，打印出来并展示给学习者。她可以解释使用文字处理器可以执行的任务，例如制作购物清单、写信、创建图形和表格、检查拼写和语法、执行计算等。


    '
