    ## 使用 LINUX 学习


    “使用 Linux 学习”是面向 1 至 8 年级的计算机科学系列教材，适用于小学和初中，专注于自由与开源软件（FOSS）。本课程的教学大纲设计符合《2005
    年国家课程框架》的建议。每本书中都有适合相应年龄段的教材，将计算机科学教育与现实生活体验相结合。该系列教材旨在培养学习者的批判性思维和创造力。该系列基于 Edubuntu
    发行版——这是一个用户友好的、基于 Linux 的 Ubuntu 操作系统的教育版本。


    ### 主要特点


    - 恰当使用截图以清晰且易于儿童理解的方式呈现概念。

    - 每章中的“思维库”提出基于应用的问题，鼓励对所学概念进行进一步的探索和思考。

    - “活动页”提供实用练习，利用所学工具整合不同学科知识。

    - “练习册”包含用于复习的客观题和描述题。

    - 在相关位置提供的“教师提示”为教师提供有关教学方法的有用建议，以及如何进一步探索主题的指导。


    ### 作者简介


    Neeraj K. Bedhotiya 是 Ajmer Mayor 学校的校长，他是将 FOSS 引入学校教育的先驱之一。他拥有超过 20 年的教育经验，其中包括在
    Dehra Dun 的 The Doon School 的 11 年经历，以及在英国马尔堡学院（Marlborough College）的一年经历。


    Deepak Bhargava 目前担任 Ajmer Mayor 学校的 IT 协调员，拥有近 10 年的高中高级阶段教学经验，并在其学校建立 FOSS 网络中发挥了重要作用。


    Gunjan Kotwari 是 Ajmer Mayor 学校计算机科学系的教员，拥有信息技术硕士学位，并成功在她的课堂上实施了向 FOSS 的过渡。


    ### 软件说明


    本书中使用的软件可从 http://linux.oupcomputers.com 免费下载。还提供了一个供教师使用的 DVD，其中包含完整的软件需求，包括
    Edubuntu 操作系统、课程涵盖的所有开源应用程序、安装指南、活动用的图像库以及示例演示文稿。还提供了应用程序的 Windows 版本。教师可与出版社联系以获取该
    DVD。


