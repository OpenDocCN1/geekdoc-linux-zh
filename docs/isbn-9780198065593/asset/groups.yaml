  - '[PAGE 35]


    # OpenOffice.org Word Processor


    # To Cut Text from a Text Document


    First step is to select the text which you want to cut. Text selection is done
    by pressing and holding down the left mouse button and dragging the mouse pointer
    over the text you wish to select. Once the desired text is highlighted, release
    the left mouse button to complete the selection. Then click on Edit→ Cut


    Alternatively, you can press Ctrl+X (a keyboard shortcut for Cut). The selected
    text will disappear from the screen and will be pasted in the temporary memory
    know as Clipboard of the system.


    # To Copy Text from a Text Document


    First step is to select the text which you want to copy. Then click on Edit→ Copy


    Alternatively, you can press Ctrl+C (a keyboard shortcut for Copy). The selected
    text will still appear on the screen and will also be pasted in the temporary
    memory known as Clipboard of the system.


    # To Paste Text in a Text Document


    To paste text that you have cut or copied, place the cursor where you want to
    paste the text. Then click on Edit→ Paste


    Alternatively, you can press Ctrl+V (a keyboard shortcut for Paste).


    # Think Tank


    +   Try this:

    +   For the text editing commands, you can use any of the following:

    +   1. the menu bar

    +   2. the toolbar

    +   3. select the text and right click on it to get the context sensitive menu

    +   4. shortcut keys'
