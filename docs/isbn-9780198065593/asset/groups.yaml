    ## OpenOffice.org 文字处理器


    ### 使用同义词词典


    同义词词典通过提供同义词列表（意思相近的词语）和相关的词语，帮助你改进词汇量。点击 工具 → 语言 → 同义词词典，或按 [Ctrl+F7]。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_60_0.png)


    同义词词典对话框将显示出来。在“含义”列表中，选择与上下文相符的定义。在“同义词”列表中选择要替换的词语。点击“确定”。


    我是一名优秀的**学生**。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_60_1.png)


    ### 活动单 5


    一些建议的活动如下：


    - 写一段关于“我的朋友——计算机”的文字。

    - 使用拼写检查和同义词词典检查文档并进行适当的修改。

    - 在全文中找到单词‘Friend’并将其替换为‘Dear’。

    - 从英语课本中选择难懂的单词。把它们输入到文字处理器中，查找它们的含义。同时查找这些单词的反义词和同义词。


    #### 教师提示


    通过点击菜单栏中的 工具 → 语言 选项，教师可以选择所需的词典。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_61_0.png)


    #### 思考角


    尝试在不使用鼠标，仅使用键盘的情况下在文字处理器中工作。


    ### 处理图形


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_62_0.png)


    #### 将图形作为副本插入


    1. 点击标准工具栏上的**图库**图标，或通过选择 工具 → 图库 来打开**图库**。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_62_1.png)


    2. 选择一个**主题**。


    3. 单击选择要使用的**对象**。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_62_2.png)


    4. 将对象拖入文档中，或者右键打开上下文菜单并选择 插入 → 复制。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_63_0.png)


    #### 将图形作为背景插入


    1. 点击标准工具栏上的**图库**图标，或通过选择**工具 → 图库**来打开图库。

    2. 选择一个主题。

    3. 单击选择要使用的对象。

    4. 打开上下文菜单并选择**插入 → 背景 → 页面或段落**。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_63_1.png)


    #### 在图形周围添加边框


    选择图形，然后点击 格式 \ 图形...


    或者，你可以右键点击图形并选择 图形...


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_64_0.png)


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_64_1.png)


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_64_2.png)


    图形对话框将打开。选择**边框**标签。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_65_0.png)


    在**线条排列**区域，选择五个按钮中的一个：


    - 设置无边框，

    - 设置所有四条边框，

    - 仅设置左右边框，

    - 仅设置上下边框，或

    - 仅设置左侧边框。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_65_1.png)


    在**线条**区域，选择一个条目，以确定线条的粗细和颜色。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_65_2.png)


    点击**确定**按钮。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_65_3.png)


    #### 绘图工具栏


    点击 查看 → 工具栏 → 绘图。绘图工具栏将显示出来。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_66_0.png)


    你可以点击各种形状并绘制精美的图形。你甚至可以使用艺术字图库来美化显示效果。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_66_1.png)


    #### 思考角


    点击 查看 → 工具栏。你将看到 OpenOffice.org 文字处理器中可用的工具栏列表。这些工具栏的用途是什么？


    #### 练习单 5


    日期：`___`/`___`/`___`


    **a. 判断正确打√，错误打×。**


    - 要在全文中查找特定单词并替换为正确的单词，你需要点击 格式 → 查找和替换。

    - 你无法使用文字处理器为图片添加边框。

    - 你无法在文本文档中将图形作为背景插入。

    - 文字处理器可以自动识别在输入文档时拼写错误的单词。

    - 你可以点击此图标来打开图库。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_67_0.png)


    **b. 填空。**


    - 同义词词典的键盘快捷键是 `___________`。

    - 图库选项位于 `___________` 菜单项中。

    - 你可以使用 `___________` 工具栏创建自己的绘图。

    - 艺术字图库的图标位于 `___________` 工具栏中。

    - 查找和替换的键盘快捷键是 `___________`。


    日期：`___`/`___`/`___`


    教师签名：`______________`


    ### 活动单 6


    一些建议的活动如下：


    - 为不同的场合制作贺卡，例如生日卡、度假愉快卡或早日康复卡。使用文本格式功能、颜色来美化贺卡。使用艺术字图库和绘图工具栏来绘制图形。例如，


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_68_0.png)


    - 使用绘图工具栏以图解方式展示任何主题。例如，排灯节、十胜节、我的家庭、独立日。


    # 排灯节快乐


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_69_0.png)


    # 十胜节


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_69_1.png)


    # 我的家庭


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_69_2.png)


    # 独立日


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_69_3.png)


    - 在活动单2创建的文档中添加句子并应用格式功能，使其成为一份完整的文档。例如，


    #### 我的家庭


    - 我有一个幸福的家庭。

    - 我家有四口人——爸爸、妈妈、姐姐和我。

    - 我妈妈是世界上最棒的妈妈。她做美味的食物。她照顾家里的每一个人。

    - 妈妈给我讲很多故事。她和我下国际象棋和蛇梯棋。

    - 我爸爸是印度军队的一名军官。

    - 他和我一起踢足球、打板球和打网球。我们一起去骑行。我们一起去散步。

    - 我姐姐比我小。我喜欢和我姐姐一起玩耍。

    - 我的家庭非常温馨且充满爱。

    - 我非常爱我的家庭。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_70_0.png)


    - 为你爱的人写一条短信息。使用合适的文字处理工具输入并排版。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_71_0.png)


    - 制作主题文档


    例如，我的三个愿望。


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_71_1.png)


    > **教师提示**

    >

    > 可以提前给班级布置一个主题。主题可以与课程相关，或者与当前的新闻、日常活动、体育等有关。例如，我最喜欢的运动、教师节、我的生日、火车站的景象、邮递员等。老师可以和同学们讨论主题。可以组织一个制作主题文档的活动，让学习者使用所学的所有文字处理工具来创建一份文档。


