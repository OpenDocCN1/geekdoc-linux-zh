  mdcn: "\n### 4. 在老师的帮助下创作一首诗。使用文字处理器进行输入和排版。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_47_0.png)\n\
    \n### 雨落下了\n\n雨落下了，  \n滴答、滴答、滴答、滴答，  \n孩子们喜欢雨并说，  \n滴答、滴答、滴答、滴答，  \n雨落在我家窗上， \
    \ \n哗啦、哗啦、哗啦、哗啦，  \n雨啊，再下一场吧。  \n孩子们喜欢玩雨。  \n他们说：“万岁”、“万岁”。  \n雨让这一天变得美好。\n\n\
    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_47_1.png)\n\n### 春天\n\n*欢迎春天，*  \n*百花盛开，*\
    \  \n*彩蝶翩翩，*  \n*四处飞舞，*  \n*来吧，来吧朋友们，*  \n*我们大家在一起，*  \n*享受这美好的*  \n*春天季节。*\n\n\
    ### 5. 写一则学校通知。\n\n**例如，**\n\n#### 阿杰梅尔梅尤尔学校\n#### 第六期夏令营\n\n2009年5月1日\n\n尊敬的家长：\n\
    \n夏令营将于2009年5月9日至5月30日举办。详情请咨询学校办公室并办理报名。\n\n祝您的孩子假期愉快！\n\n协调员\n\n### 6. 想象你是一只鸟。写几句话来表达你的感受。\
    \  \n对文本进行排版并保存文档。\n\n我是一只雀鸟\n\n我是一只雀鸟。  \n我筑巢来产卵。  \n筑巢是很困难的。  \n人们一次又一次地破坏我的巢。\
    \  \n但我不气馁。  \n最终，我筑好了巢。  \n我爱我的小宝宝。  \n我教它们如何飞翔。\n\n## 思考园\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_48_0.png)\n\
    \n键盘上有一个“Tab”键。你什么时候会使用 [Tab] 键？\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_48_1.png)\n\
    \n## 教师备注\n\n教师可以将学习者制作的文档进行彩色打印并展示出来，以鼓励学习者。选定的文档可以上传到学校的网站上。\n\n## 创建无序列表和有序列表\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_49_0.png)\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_49_1.png)\n\
    \n我们可以在文字处理器中创建两种列表：无序列表（Bulleted List）和有序列表（Numbered List）。\n\n项目符号（Bullets）是用于突出列表中条目的符号。它用于没有特定顺序的列表。\n\
    \n有序列表用于按特定顺序显示信息。\n\n您可以通过点击工具栏上相应的按钮来使用默认的项目符号和编号设置。\n\n点击 格式 → 项目符号和编号\n\n\
    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_49_2.png)\n\n### OpenOffice.org 文字处理器\n\
    \n出现“项目符号和编号”对话框。\n\n从可用选项中选择一个项目符号样式。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_50_0.png)\n\
    \n您也可以在 *Graphics* 选项卡中选择彩色项目符号。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_50_1.png)\n\
    \n### OpenOffice.org 文字处理器\n\n点击 **Numbering type** 选项卡以创建有序列表。\n从可用样式中选择您想要的样式。\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_51_0.png)\n\n点击 **Outline** 选项卡以创建次级无序列表和次级有序列表。\n\
    从可用样式中选择您想要的样式。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_51_1.png)\n\n点击 **OK**\
    \ 按钮以应用更改。\n\n以下是一个无序列表和一个有序列表的示例。\n\n#### 计算机实验室的物品列表\n\n- 电脑\n- 投影仪\n- 白板\n\
    - 空调\n- 画作\n- 椅子\n\n#### 今天二年级的课程列表\n\n1. 英语\n2. 美术与手工\n3. 数学\n4. 计算机\n5. 印地语\n\
    6. 体育\n\n## 应用首字下沉\n\n选择段落对话框的 **Drop Caps**（首字下沉）选项卡。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_52_0.png)\n\
    \n选中 **Display drop caps**（显示首字下沉）复选框。\n\n此功能通常用于报纸和杂志文章中，以显示首字符，使用较大的字体大小，并跨越多于一行（1）的常见字符。首字下沉的示例如下所示：\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_52_1.png)\n\n### OpenOffice .org 文字处理器\n\
    \n### 活动表 4\n\n一些建议的活动如下：\n\n1. 创建一个水果无序列表和一个蔬菜列表。\n2. 创建一个“今天要做的事情”的有序列表。\n3.\
    \ 创建一个需要购买的杂货项有序列表。教师可以先与学生讨论各种杂货项，然后学生可以创建列表。\n4. 创建一个动物、鸟类、水生动物等列表，并为其应用不同种类的编号样式。\n\
    5. 创建一个朋友列表，并为其应用不同样式的彩色项目符号。\n6. 创建一个职业列表，例如医生、裁缝、律师、老师、工程师、宇航员等。\n7. 输入并排版一篇报纸文章。使用首字下沉功能和适当的排版功能。\n\
    \n### 教师备注\n\n可以要求学习者写一篇关于学校组织活动的报纸文章。学习者将输入文章并应用适当的排版功能。然后可以在集会上朗读这篇新闻。\n\n例如，\n\
    \n> 为5-7岁儿童举办的校际绘画比赛在阿杰梅尔梅尤尔学校举行。活动主题设为“保护”。梅尤尔学校二年级A班的 Akshita Mehra 获得了一等奖。她描绘了节约用水、电力和环境的办法。评委对她所做的努力给予了赞扬。\n\
    \n## 思考园\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_54_0.png)\n\n你能使用首字下沉功能来装饰一张贺卡吗？\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_54_1.png)\n\n### OpenOffice.org 文字处理器\n\
    \n### 练习表 4\n\n日期：__/__/__\n\na. 将下列各项进行匹配：\n\n1. 项目符号图标\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_0.png)\n\
    \n2. 右对齐\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_1.png)\n\n3. 大纲\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_2.png)\n\
    \n4. 首字下沉\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_3.png)\n\n5. 图形\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_4.png)\n\
    \n6. 项目符号\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_5.png)\n\n7. 两端对齐\n\n\
    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_6.png)\n\n8. 默认对齐\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_7.png)\n\
    \n9. 编号图标\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_8.png)\n\n10. 居中对齐\n\n\
    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_55_9.png)\n\n日期：__/__/__\n\n教师签名：_______________\n\
    \n## OpenOffice.org 文字处理器\n\n## 更多文本编辑功能\n\n## 查找和替换\n\n这是文字处理器中一个非常实用的功能。它用于在整个文档中搜索特定的单词，然后用正确的单词替换它。它通常用于纠正文档中反复出现的错误。\n\
    \n点击 编辑 → 查找和替换\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_56_0.png)\n\n## OpenOffice.org\
    \ 文字处理器\n\n将显示“查找和替换”对话框。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_57_0.png)\n\
    \n在 **Search for** 文本框中输入要查找的单词。在 **Replace with** 文本框中输入用于替换的正确单词。\n\n点击 **Find**\
    \ 或 **Find All** 按钮。\n\n然后点击 **Replace** 或 **Replace All** 按钮。\n\n> ### 思考园\n\
    > 尝试在查找特定单词时选中 **Match case**（匹配大小写）选项。\n\n## OpenOffice.org 文字处理器\n\n## 使用拼写检查和同义词库\n\
    \n## 使用拼写检查\n\nOpenOffice.org 文字处理器内置了一个字典，用于检查文档中的拼写。拼写检查从光标当前位置开始，检查整个文档。\n\n\
    ## 运行拼写检查\n\n点击 工具 → 拼写和语法\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_58_0.png)\n\
    \n## OpenOffice.org 文字处理器\n\n拼写对话框将显示文档中第一个拼写错误的单词，以及字典中提供的最接近的匹配建议。\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_59_0.png)\n\
    \n1. **Ignore Once**（忽略一次），忽略仅一次出现的拼写。\n2. **Ignore All**（全部忽略），忽略整个文档中的拼写。\n\
    3. **Change**（更改），接受并更改仅一次出现的拼写。\n4. **Change All**（全部更改），接受并更改整个文档中的拼写。\n\n##\
    \ 使用自动拼写检查\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_59_1.png)\n\n自动拼写检查在您输入文档时轻松识别页面上拼写错误的单词。拼写错误的单词下方可以看到一条红色波浪线。在拼写错误的单词上右键单击，从出现的列表中选择建议的替换词。更正将应用于文档。\n\
    \n![](img/9a5b9efff92da1263a1b04aa9d4ae262_59_2.png)\n\n"
