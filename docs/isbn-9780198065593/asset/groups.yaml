    # OpenOffice.org Word Processor


    Spelling dialog box displays the first incorrectly spelled word in the document,
    as well as suggestions in the form of closest possible matches available in the
    dictionary.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_59_0.png)


    +   1.  **Ignore Once**, to ignore the spelling for just one occurrence.

    +   2.  **Ignore All**, to ignore the spelling in the complete document.

    +   3.  **Change**, to accept and change the spelling for just one occurrence.

    +   4.  **Change All**, to accept and change the spelling in the complete document.


    # Using AutoSpellcheck


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_59_1.png)


    AutoSpellcheck easily identifies incorrectly spelt words on the page as you type
    the document. The incorrectly spelt words can be seen with a single red wavy line
    beneath them. Right-click on the incorrectly spelt word and choose a suggested
    replacement from the list that appears. The correction is applied to the document.


