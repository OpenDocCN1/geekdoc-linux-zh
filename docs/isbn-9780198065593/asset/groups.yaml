    ## Introduction to Edubuntu


    Edubuntu is a complete Linux-based operating system, freely available with community-based
    support.


    The Edubuntu community is built on the following ideas enshrined in the Edubuntu
    Manifesto.


    - Software should be available free of charge.

    - Software tools should be usable by people in their local language and despite
    any disabilities.

    - People should have the freedom to customize and alter their software in whatever
    way they see fit.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_9_0.png)


    ### Edubuntu Desktop


    These freedoms make Edubuntu fundamentally different from proprietary software:
    not only are the tools you need available free of charge, you, and thousands of
    developers around the world, have the right to modify and build upon your software
    until it works exactly the way you want it to.


    ## Educational Softwares in Edubuntu


    Edubuntu offers a variety of educational programs. Some of them are as follows:


    - **Fun with Math** -- TuxMath is an educational arcade game starring Tux, the
    Linux mascot! Based on the classic arcade game “Missile Command,” Tux must defend
    his cities by solving arithmetic problems.


    - **Office Suite** -- OpenOffice.org is a complete office suite similar to the
    Microsoft Office suite. It features a word processor, as well as a spreadsheet,
    presentation, drawing, database, and mathematical formula applications. OpenOffice.org
    can open and convert most Microsoft Office documents and has support for many
    languages.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_10_0.png)


    ## Fun with Math — TuxMath


    ### Tux, of Math Command or TuxMath


    TuxMath is a simple arithmetic educational software starring Tux, the Linux penguin.
    Tux has to fire phasers at calculations that are falling down from the sky. The
    student has to type the right result and push [Spacebar/Enter] to destroy the
    calculation before it touches the ground. The math involved covers addition, subtraction,
    multiplication, and division. It is a great way for kids and adults to stretch
    their minds.


    ### Features of TuxMath


    - Cute, animated graphics

    - Sound effects and music

    - Optional on-screen input, for children who can’t use a keyboard (great for touchscreens!)


    ### Objective of TuxMath


    The objective of this software is to develop oral and mental math skills. In “Tux,
    of Math Command,” Commander Tux defends his cities from an attack of math equations.
    You can play the part of Commander Tux. Comets are hurtling towards your cities,
    and you must destroy them by solving their equations.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_11_0.png)


    ### Gameplay Overview


    Tux, the Linux penguin, stands at the controls of a laser defense system ready
    to defend his fellow penguins from falling comets. His companions are tucked away
    safely in igloos. Two igloos on each side of the defense station give Tux the
    task of defending a total of four other penguins.


    Each incoming comet has a math problem attached. Entering the correct solution
    will cause the laser to destroy the comet. Entering an incorrect answer will result
    in a miss.


    This simple gameplay is entertaining, which becomes more interesting when a comet
    hits the igloo. The first comet strike will partially melt the penguin''s igloo.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_12_0.png)


    A second strike causes the igloo to melt completely, forcing the penguin to run
    away. No penguins are ever harmed; they simply walk away once their igloo is gone.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_13_0.png)


    Giving young players two tries before the penguin flees helps to prevent them
    from becoming frustrated while still providing challenge.


    ### Program Navigation


    #### Title Screen


    On this screen, you can either choose to play the game, change the gameplay options,
    view the credits, or quit.


    Use the [Up] and [Down] arrow keys to select what you wish to do, and then press
    [Enter/Return]. Otherwise, use the mouse to click the menu item. Pressing [Escape]
    will quit the program.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_14_0.png)


    #### More Options Screen


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_15_0.png)


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_15_1.png)


    #### Credits Screen


    This screen displays the credits. You can press [Escape] to return to the title
    screen.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_15_1.png)


    ### How to Play


    #### Destroying Comets


    As the comets fall towards your cities, you must solve their equations.


    To destroy a comet, do the following:

    First, figure out the answer to the equation.

    For example, "3 × 4" would be "12".


    Second, type in the answer. As you type numbers on the keyboard, they will appear
    in the "LED"-style display at the bottom center of the screen.


    Finally, press [Enter/Return/Spacebar].


    The comet that has the number you entered as its answer will be shot down by Tux,
    the penguin.


    Note:


    1. Sometimes more than one comet will have the same answer. In this case, the
    comet closest to your cities will be destroyed first.

    2. After typing [Enter/Return], the "LED"-style display will automatically reset
    to "000", so you can answer the next equation!


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_16_0.png)


    #### Correcting your Answer


    If you make a mistake, you can press [Backspace/Delete] and the "LED"-style display
    at the bottom center of the screen will reset to "000".


    ### Losing a City


    If a comet crashes into one of your cities before you had the chance to answer
    its equation correctly, the city''s shield will be destroyed. If the city is hit
    by another comet, it will be destroyed completely.


    *Note:* The correct answer to the calculation is always displayed as the equation
    hits the ground.


    Once you lose all of your cities, the game will end.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_17_0.png)


    ### Teacher''s Note


    The teacher can launch the program with the --fullscreen option from the Terminal
    application in Edubuntu. The game screen will appear in full screen mode.


    ### Activity Sheet 1: Setting Administrative Options


    “Tux, of Math Command” allows parents or teachers to adjust parts of the game
    options. Click on Math Command Training Academy.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_18_0.png)


    The following screen will be displayed on selecting Math Command Training Academy.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_19_0.png)


    Here, all addition options are available. You can select the desired option based
    on the age and level of understanding of the child.


    Click on the Next Arrow button to browse more options. For example, addition of
    negative numbers.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_20_0.png)


    The next screen will show you more options.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_20_1.png)


    This feature makes TuxMath useful for children of all age groups.


    ### Think Tank


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_21_0.png)


    Try clicking on Hall Of Fame.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_21_1.png)


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_21_2.png)


    ## OpenOffice.org Word Processor


    ### Word Processing


    Word processing means using a computer to create, edit, and print documents. To
    perform word processing, you need a special program called a Word Processor.


    ### Advantages of a Word Processor


    - You can make changes or edit without retyping the entire document.

    - You can apply many formatting styles to the text in the document.

    - You can include graphics in the document.

    - You can save the document for future use.

    - You can print the document.


    OpenOffice.org Word Processor is a free and open source word processor software
    which is a component of the OpenOffice.org software package.


    > **Teacher''s Note**

    >

    > The teacher can give an introduction to the terms like document, edit, formatting,
    graphics, save, open, and print. She can open a previously created file, take
    a print and show it to the learners. She can explain the tasks that can be done
    using a Word Processor, like making shopping lists, writing letters, creating
    graphics, tables, check for spellings and grammar, perform calculations etc.

    '
