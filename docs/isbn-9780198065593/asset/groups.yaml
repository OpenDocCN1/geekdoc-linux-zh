    \  \n由新德里 110028 的 Battra Art Press 在印度印刷\n\n## 前言\n\n*使用 Linux 学习*（1 至 8 年级）是一套针对小学和中学的计算机科学教材，重点介绍免费开源软件（FOSS）。FOSS\
    \ 指的是根据 GNU 通用公共许可证宽松授权的软件，赋予用户通过免费获取其源代码来研究、修改和改进其设计的权利。因此，FOSS 用户拥有根本性的控制权和灵活性。\n\
    \n我们接触 FOSS 始于其中一位作者（尼尔拉杰·K·贝德霍蒂亚）在 2004 年参加的一个 IIM (A) 培训课程，该课程热情支持在学校教育中使用 FOSS。此后，我们在我们的学校（Ajmer\
    \ 的 Mayoor 学校）对此进行了实验，这套教材就是我们过去五年经验的结晶。\n\n寻找合适的开源软件让我们接触到了 Edubuntu 发行版——这是基于\
    \ Linux 的 Ubuntu 操作系统的一个用户友好的教育版本。随后，按照《2005 年国家课程框架》的建议，设计了一套全面的课程。本系列教材旨在培养学习者的批判性思维和创造力，每本书中的适龄课程大纲将计算机科学教育与现实生活体验联系起来。计算机科学不被视为一门孤立的学科，相反，计算机被投射为一种工具，允许进行整合学习并强化所有核心学科的概念。\n\
    \n### 主要特色\n\n1.  恰当地使用屏幕截图，以清晰且适合儿童的方式呈现概念。\n2.  每章中的 **思考库** 提出基于应用的问题，鼓励对涵盖的概念进行进一步的探索和思考。\n\
    3.  **活动单** 提供利用所学工具整合不同学科的实践练习。\n4.  **工作表** 包含用于复习的客观题和描述题。\n5.  在相关位置给出的 **教师笔记**\
    \ 为教师提供有关教学方法的有用建议，以及如何进一步探索主题的指导。\n\n我们邀请您与我们分享您使用 FOSS 和本系列教材的经验。对于改善这些书的内容和覆盖范围的建设性反馈将受到极大欢迎。\n\
    \n- 作者团队\n\n- 本书使用的软件可以从 [http://linux.oxcomputers.com](http://linux.oxcomputers.com)\
    \ 免费下载\n- 还提供了一张供教师使用的 DVD，其中包含完整的软件需求，包括 Edubuntu 操作系统、课程涵盖的所有开源应用软件、安装指南、用于活动的图像库以及示例演示文稿。应用软件也有\
    \ Windows 版本。教师可以联系出版商获取该 DVD。\n\n我们将这本书献给  \n“Mayoor 学校的精神”  \n它允许我们思考和探索\n\n\
    ### 致谢\n\n我们要感谢已故的拉克斯曼·莫汉蒂博士（IIM Ahmedabad 客座教员），他热情地在教育中推广 FOSS；也要感谢戈帕拉·纳加拉朱纳博士（孟何·巴哈科学教育中心研究员，印度自由软件基金会创始人之一），他通过向我们介绍\
    \ Edubuntu，为我们提供了解决方案以实施 FOSS。\n\n我们要特别感谢由帕万·亚达夫先生领导的技术团队，他们帮助进行了研究，建立了网络化的 Linux\
    \ 实验室，并找到了软件解决方案。\n\n我们也感谢 FOSS 社区，他们勤奋地解决了我们所有的技术问题。\n\n也要感谢 Mayoor 学校的 IT 团队，他们努力调整这些书的版式，使其具有吸引力且适合儿童。\n\
    \n我们还要感谢 Vineeta Bedhotiya 女士，她在每一步都给予了建设性的批评和指导。\n\n特别提及我们所有小学部的学生，他们用富有创造力的头脑和天真的疑问激励我们思考并产生新的想法。\n\
    \n我们衷心感谢家长社区提供的建设性反馈，以及在平台变更初期困难阶段对我们的信任。\n\n还要感谢 Ajmer 的 Mayoor 学校出色且支持性的员工，他们总是给我们提供将计算机与其他学科整合的新想法。\n\
    \n最后，我们要感谢 Mayo College 总理事会支持我们将 *使用 Linux 学习* 系列教材与牛津大学出版社合作出版的 endeavors。\n\
    \n我们很庆幸能够通过这些书触达如此多学习者的生活。如果我们能通过使用这些软件在學生中灌输自学精神，我们将认为我们的工作已完成。\n\n- 作者团队\n\n\
