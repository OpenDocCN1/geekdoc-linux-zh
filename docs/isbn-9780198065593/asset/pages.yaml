  md: '# OpenOffice.org Word Processor


    # Text Editing Features


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_34_0.png)


    # To Undo Changes done in a Text Document


    Click on Edit-> Undo


    Alternatively, you can press [Ctrl+Z] (a keyboard shortcut for Undo). This command
    will undo the last change done to the file.


    # To Redo Changes done in a Text Document


    Click on Edit-> Redo


    Alternatively, you can press [Ctrl+Y] (a keyboard shortcut for Redo). This command
    will reverse the action of the undo command.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_34_1.png)


