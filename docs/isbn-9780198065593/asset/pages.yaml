- pgno: 45
  md: '# OpenOffice.org Word Processor


    Align Left


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_0.png)


    All the lines of the paragraph start from the left margin with uneven spacing
    on the right.


    Centered


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_1.png)


    Each line is centered on the page.


    Align Right


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_2.png)


    All the lines of the paragraph end at the right margin with uneven spacing on
    the left.


    Justified


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_45_3.png)


    All the lines of the paragraph start at the left margin and end at the right margin
    evenly.


