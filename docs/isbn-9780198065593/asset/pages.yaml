  md: '# OpenOffice.org Word Processor

    Activity Sheet 5


    Some suggested activities are:


    +   1. Write a paragraph on ‘My Friend Computer’.

    +   2. Use Spellcheck and Thesaurus to check your document and make appropriate
    changes.

    +   3. Find the word ‘Friend’ and replace it with ‘Dear’ in the whole document.

    +   4. Select difficult words from the English textbook. Type them in Word Processor
    and find out their meanings. Also find out the antonyms and synonyms of the words.


    # Teacher’s Note


    By clicking on Tools→ Language option in the menu bar, the teacher can select
    the desired dictionary.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_61_0.png)


    # Think Tank


    Try working in Word Processor without using the mouse. Use only the keyboard.'
