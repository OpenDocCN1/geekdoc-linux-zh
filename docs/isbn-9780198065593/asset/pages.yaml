- pgno: 31
  md: '# OpenOffice.org Word Processor


    # Activity Sheet 2


    Some suggested activities are:


    +   1. Open Word Processor. Type your name, your class with section and the name
    of your school.

    +      For example,

    +      Ankita Kapoor

    +      II A

    +      Mayoor School


    +   2. Save the file in Documents folder by the name "Myself".


    +   3. Close the file.


    +   4. Open the file and add the current date and day. Save your work and exit
    Word Processor.


    +   5. Open the file and add the names of all family members. Save the file and
    exit.


    +   6. Create a new file and type 5 sentences about any object in your Computer
    Lab. For example, computer, air conditioner, projector, etc.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_31_0.png)


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_31_1.png)


    +   7. The teacher can take a bag, fill it with simple things like a ball, a pencil,
    an eraser, a box, a small toy, a feather, a stone, a piece of paper, etc. Ask
