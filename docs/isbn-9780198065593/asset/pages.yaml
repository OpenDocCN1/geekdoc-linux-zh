- pgno: 16
  md: "# Fun with Math — TuxMath\n\n# How to Play\n\n# Destroying Comets\n\nAs the\
    \ comets fall towards your cities, you must solve their equations.\n\nTo destroy\
    \ a comet, do the following:  \nFirst, figure out the answer to the equation.\
    \  \nFor example, \"3 × 4\" would be \"12\".\n\nSecond, type in the answer. As\
    \ you type numbers on the keyboard, they will appear in the \"LED\"-style display\
    \ at the bottom center of the screen.\n\nFinally, press [Enter/Return/Spacebar].\n\
    \nThe comet that has the number you entered as its answer will be shot down by\
    \ Tux, the penguin.\n\nNote:\n\n+   1. Sometimes more than one comet will have\
    \ the same answer. In this case, the comet closest to your cities will be destroyed\
    \ first.\n+   2. After typing [Enter/Return], the \"LED\"-style display will automatically\
    \ reset to \"000\", so you can answer the next equation!\n\n![](img/9a5b9efff92da1263a1b04aa9d4ae262_16_0.png)\n\
    \n# Correcting your Answer\n\nIf you make a mistake, you can press [Backspace/Delete]\
    \ and the \"LED\"-style display at the bottom center of the screen will reset\
    \ to \"000\"."
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Fun with Math — TuxMath


    # Losing a City


    If a comet crashes into one of your cities before you had the chance to answer
    its equation correctly, the city''s shield will be destroyed. If the city is hit
    by another comet, it will be destroyed completely.


    *Note:* The correct answer to the calculation is always displayed as the equation
    hits the ground.


    Once you lose all of your cities, the game will end.


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_17_0.png)


    # Teacher''s Note


    The teacher can launch the program with the --fullscreen option from the Terminal
    application in Edubuntu. The game screen will appear in full screen mode.'
  merge: -1
  img_proc: true
