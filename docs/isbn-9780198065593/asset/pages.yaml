  md: "# OpenOffice.org Word Processor\n\n# Word Processing\n\nWord processing means\
    \ using a computer to create, edit, and print documents. To perform word processing,\
    \ you need a special program called a Word Processor.\n\n# Advantages of a Word\
    \ Processor\n\n+   * You can make changes or edit without retyping the entire\
    \ document.\n+       You can apply many formatting styles to the text in the document.\n\
    +   * You can include graphics in the document.\n+   * You can save the document\
    \ for future use.\n+   * You can print the document.\n\nOpenOffice.org Word Processor\
    \ is a free and open source word processor software which is a component of the\
    \ OpenOffice.org software package.\n\n> **Teacher's Note**\n> \n> The teacher\
    \ can give an introduction to the terms like document, edit, formatting, graphics,\
    \ save, open, and print. She can open a previously created file, take a print\
    \ and show it to the learners. She can explain the tasks that can be done using\
    \ a Word Processor, like making shopping lists, writing letters, creating graphics,\
    \ tables, check for spellings and grammar, perform calculations etc."
