    \nThe device next to the keyboard is called a Mouse.\n\n+   1. Moving the mouse\
    \ causes the mouse pointer, I, to move on your screen.\n+   2. Move the mouse\
    \ up and down on the table top or the mouse pad. Notice that the pointer, I, also\
    \ moves up or down on your screen.\n+   3. Move the mouse to the left and to the\
