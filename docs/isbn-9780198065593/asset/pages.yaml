- pgno: 24
  md: '# OpenOffice.org Word Processor


    # Keyboard


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_24_0.png)


    1. The keyboard has keys that can be pressed to make characters (letters, numbers,
    and symbols) appear on the screen.


    2. Press means to touch a key on the keyboard hard enough to cause the character
    to appear on the screen and then release it immediately.


    3. Press the "H" key now. (An "h" appears on the screen.) Next to the "h" is a
    blinking vertical line. This blinking line is the cursor which indicates the place
    on the page where something will be placed when you press a key. Press the "E"
    key, then press the "L" key and the "P" key. (The word "help" appears on the screen.)


    # Space Bar


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_24_1.png)


    The [Space Bar] key is the long key in the middle at the bottom of the keyboard.
    Press the [Space Bar] key. (The cursor moves one space to the right.)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# OpenOffice.org Word Processor


    # Shift key


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_25_0.png)


    Pressing the [Shift] key along with a letter key makes the letters appear in capitals.


    Type the word "Help" by doing the following:


    +   1. Press and hold down the [Shift] key as you press the "H" key. Release the
    [Shift] key. (The letter "H" appears in capitals on the screen.)

    +   2. Press the "E" key, then press "L", then press "P". (The word "Help" appears
    on the screen.)


    # Think Tank


    +   1. Can you see a [Caps Lock] key on the keyboard?


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_25_1.png)


    A small light on the keyboard tells you whether the [Caps Lock] key is On or Off.
    What is the use of this key?


    +   2. There is a [Num Lock] key on the keyboard. Do you know its use?


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_25_2.png)


    +   3. What is the difference between [Backspace] and [Delete] keys?


    ![](img/9a5b9efff92da1263a1b04aa9d4ae262_25_3.png)'
  merge: -1
  img_proc: true
- pgno: 26
