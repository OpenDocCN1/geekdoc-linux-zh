  \ HTML 格式的网页邮件。\n\n执行以下命令编辑 `PHP.ini` 配置文件：\n\n```bash\nsudo nano /etc/php5/apache2/php.ini\n\
  ```\n\n在文件中搜索名为 `sendmail_path` 的条目，将其更改为 `sendmail_path = \"/usr/sbin/sendmail\
