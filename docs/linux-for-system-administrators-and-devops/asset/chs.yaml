  sudo nano /var/www/html/sendMail.php\n```\n\n将以下内容输入到你的文件中：\n\n```php\n<?php\n$to\
  \ = \"mailofpersontosendto@hotmail.com, anothermailtosendto@gmail.com\";\n$subject\
  \ = \"HTML Mail Subject\";\n$message = \"\n<html>\n<head>\n<title>Title of the E-Mail</title>\n\
  </head>\n<body>\n<p>This is an HTML E-Mail Message !!!</p>\n<table>\n<tr>\n<th>Column\
