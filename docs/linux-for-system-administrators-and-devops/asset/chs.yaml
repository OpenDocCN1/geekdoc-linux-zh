  \ in HTML E-Mail</td>\n<<td>Content of Column 2 in HTML E-Mail</td>\n</tr>\n</table>\n\
  </body>\n</html>\n\";\n$headers = \"MIME-Version: 1.0\" . \"\\r\\n\";\n$headers\
  \ .= \"Content-type:text/html;charset=UTF-8\" . \"\\r\\n\";\n$headers .= 'From:\
  \ mostafa@manon.com' . \"\\r\\n\";\n$headers .= 'Cc: manonmanager@manon.com' . \"\
  \\r\\n\";\nif(mail($to,$subject,$message,$headers)){\n    echo 'Mail have been send\
  \ successfully as desired.';\n}else{\n    echo 'We have encountered some error,\
  \ please consult <br />Appendix G Troubleshooting your LINUX Mail Server';\n}\n\
  ```\n\n现在将你的浏览器指向以下 URL：\n\n`http://manon.com/sendMail.php`\n\n或者\n\n`http://localhost/sendMail.php`\n\
  \n访问此 URL 后，你将注意到邮件是否已发送。\n\n如果你遇到任何错误，请查阅：\n\n`Appendix G` Troubleshooting your\
  \ LINUX Mail Server。\n\n现在，我们已经完全安装了 LINUX 邮件服务器，你可以享受发送邮件了。\n\n## 2.6 安装和管理 FTP,\
  \ SFTP\n\n让我们尝试安装我们的文件服务器。安装文件服务器将让你能够通过 `FTP`、`SFTP` 协议在你的机器上保存、更新和删除文件：\n\n```bash\n\
  sudo apt-get install vsftpd\n```\n\n安装完成后，请运行以下命令配置你的 FTP 服务器设置：\n\n```bash\nsudo\
  \ nano /etc/vsftpd.conf\n```\n\n完成后，编辑以下行并使其保持一致：\n\n```ini\nanonymous_enable=NO\n\
  local_enable=YES\nwrite_enable=YES\nchroot_local_user=YES\n```\n\n按下 `CTRL X` 保存并退出，然后按键盘上的\
  \ Enter 。\n\n现在，如下所示创建一个目录：\n\n```bash\nsudo mkdir /home/manon/files # 将 manon 更改为你操作系统的用户名。\n\
  ```\n\n然后，我们需要更改所有权：\n\n```bash\nsudo chown root:root /home/manon\n# 将 manon 更改为为你操作系统的用户名\n\
  ```\n\n现在，我们需要执行以下命令重启服务：\n\n```bash\nsudo service vsftpd restart\n```\n\n现在，通过在终端执行以下命令连接到你的\
  \ FTP 服务器：\n\n```bash\nsudo ftp localhost\n```\n\n我们使用执行之前任务时使用的操作系统用户名，然后输入该账户的密码。\n\
  \n完成后，在终端输入 `exit` 终止 ftp 会话。\n\n现在，让我们如下安装 FTP 客户端应用程序：\n\n```bash\nsudo apt-get\
  \ install filezilla\n```\n\n安装完成后，启动你的 filezilla 应用程序并在主机字段中输入：`ftp://manon.com/`\n\
  \n用户名：`manon`  \n\n密码：`*******`\n\n完成后，点击连接，现在你已经连接到了你的文件服务器。\n\n你可以在服务器上创建目录、创建文件并对其进行管理。\n\
  \n现在，让我们如下在 Windows® 机器上映射网络驱动器：\n\n打开开始菜单并在搜索框中输入“映射网络驱动器”（map network drive）。\n\
  \n在位置字段中，输入 FTP 服务器名称即 `ftp://manon.com/`。\n\n在提示时，输入我们刚才提到的用户名和密码。\n\n为了安装 FTP\
  \ 的安全层即 `SFTP`，我们需要执行以下命令：\n\n```bash\nsudo a2ensite default-ssl.conf\n```\n\n然后，我们需要执行命令：\n\
  \n```bash\nsudo service apache2 restart\n```\n\n接着，我们需要安装 ssh：\n\n```bash\nsudo\
  \ apt-get install ssh\n```\n\n安装完成后，我们将能够使用 URL 通过 SFTP 连接到服务器：\n\n`sftp://manon.com`\
  \ # 将 manon.com 更改为你的 DNS 名称。\n\n现在，让我们使用我们的平板设备：\n\n我将使用一个支持 iOS 的平板设备浏览商店应用并找到一个名为\
  \ FTPManager® 的应用程序。\n\n在 iPad 或 iPhone 上安装应用程序后，你会在应用程序的主菜单看到一个用于添加服务器的 `+` 符号\n\
  \n等待，用于添加服务器的应用程序主菜单\n\n输入服务器地址 `ftp://manon.com/` 或 `sftp://manon.com`\n\n选择协议\
  \ ftp 或 sftp\n\n在下方输入你的用户名和密码。\n\n现在，我们已经连接到文件服务器并可以移动和添加文件。\n\n你也可以从服务器下载文件。\n\n\
  现在，我们涵盖了文件服务器的安装和配置。\n\n## 2.7 安装和配置 SAMBA 并管理共享\n\nSAMBA 是另一种安装文件服务器的方式。为了安装 SAMBA，我们需要通过以下步骤：\n\
  \n```bash\nsudo apt-get install samba\n```\n\n```bash\nsudo nano /etc/samba/smb.conf\n\
  ```\n\n在文件末尾添加以下内容：\n\n```ini\n[share]\ncomment = Ubuntu File Server Share\npath\
  \ = /srv/samba/share\nbrowsable = yes\nguest ok = yes\nread only = no\ncreate mask\
  \ = 0755\n```\n\n执行以下命令创建共享目录：\n\n```bash\nsudo mkdir -p /srv/samba/share\n```\n\
  \n完成后，为共享目录赋予适当权限：\n\n```bash\nsudo chown nobody:nogroup /srv/samba/share/\n```\n\
  \n执行以下命令应用配置更改：\n\n```bash\nsudo service smbd restart\nsudo service nmbd restart\n\
  ```\n\n通过这种方式，我们完成了 SAMBA 文件服务器的配置并创建了共享，如果你在任何 Windows 机器的网络选项浏览网络计算机，会发现我们的服务器共享对所有\
  \ Windows 用户可见。\n\n## 2.8 安装 GIT 服务器\n\n你有一个项目并想要创建一个本地 GIT 服务器而不是推送到公共 GIT 控制系统，这里有一个创建自己的\
  \ git 服务器的解决方案，让你与团队成员一起在本地机器上推送项目。\n\n执行以下命令：\n\n```bash\nsudo apt-get install\
  \ git\n```\n\n\n\n\n\n```bash\ngit config --global user.email \"mostafa@manon.com\"\
  \n```\n\n之后，我们需要为任何人分配一个用户名，以便其可以使用以下命令连接到机器：\n\n```bash\ngit config --global user.name\
  \ \"mostafa\"\n```\n\n现在，让我们通过执行此命令，添加我们在安装 Web 服务器时创建的 Web 目录来创建第一个仓库：\n\n```bash\n\
  git init --bare /var/www/html/\n```\n\n如果你在执行上一个命令时遇到任何问题，你需要执行以下命令：\n\n```bash\n\
  cd /var/www/html/ && git init .\n```\n\n现在，我们使用用户名和密码克隆该仓库：\n\n```bash\ngit clone\
  \ mostafa@localhost:/var/www/html/\n```\n\n然后，我们需要执行以下命令：\n\n```bash\ncd /path/to/repository\n\
  ```\n\n接着，我们进行所谓的 commit（提交）操作并为其提供消息，或者留空，如下所示：\n\n```bash\ngit commit -a\n```\n\
  \n或者\n\n```bash\ngit commit -m \"Contents are Finished\"\n```\n\n然后，我们按照如下方式将任何更改推送到仓库：\n\
  \n```bash\ngit push origin master\n```\n\n### 安装另一个 GIT 服务器\n\n还有另一个 git 服务器，其功能与我们安装的上一个\
  \ GIT 服务器相同。让我们按照以下步骤完成该服务器的安装过程：\n\n```bash\nsudo apt-get install gitolite\n```\n\
  \n完成后，通过执行以下命令向系统中添加一个名为 `GIT` 的新用户：\n\n```bash\nsudo adduser --system --shell /bin/bash\
  \ --group --disabled-password --home /home/git git\n```\n\n现在，我们需要查阅关于在机器上安装 SSH\
  \ 服务器和客户端的文章，并遵循以下命令：\n\n```bash\nssh-keygen -t rsa\n```\n\n接受默认设置并一直按键盘回车键直到完成，然后执行以下命令：\n\
  \n```bash\ncp ~/.ssh/id_rsa.pub /tmp/$(whoami).pub\n```\n\n然后，我们需要使用以下命令登录我们创建的用户：\n\
  \n```bash\nsudo su - git\n```\n\n```bash\ngl-setup /tmp/*.pub\n```\n\n现在，你需要通过执行以下命令退出已登录的用户会话：\n\
  \n```bash\nexit\n```\n\n最后，我们需要按照如下方式克隆仓库：\n\n```bash\ngit clone git@manon.com:gitolite-admin.git\n\
  ```\n\n你需要做的是：将 `manon.com` 替换为你在安装 DNS 服务器时选择的计算机 DNS 名称（即黄色高亮部分）。\n\n现在你可以使用以下命令浏览项目内容：\n\
  \n```bash\ncd gitolite-admin\nls -l\n```\n\n要将仓库添加到现有项目，你可以执行如下所示命令：\n\n```bash\n\
  git remote add gitolite git@$manon.com:manonproject.git\n```\n\n现在，我们已经完成了 GIT 服务器和客户端的安装、配置和使用。\n\
  \n# 3 Linux 安全安全\n\n## 3.1 安装 SSH\n\n`SSH` 服务器用于通过带有加密机制的安全套接层（如使用私钥和公密钥对）连接到你的机器。\n\
  \n私钥和公钥对的概念用途如下：\n\n私钥保留在目标机器上，采用标准的加密格式，通常配合 `SHA-256` 加密机制以及 `SHA-2` 和 `RSA` 等基础加密机制。\n\
  \n要安装 SSH 服务器，请按照以下步骤操作：\n\n```bash\nsudo apt-get install openssh-server\n```\n\n\
  接下来，我们安装 `openssh-client` 以获得完整的客户端功能。\n\n```bash\nsudo apt-get install openssh-client\n\
  ```\n\n要生成密钥对，我们需要执行以下命令：\n\n```bash\nssh-keygen -t rsa\nssh-copy-id mostafa@manon.com\n\
  ```\n\n然后，我们为密钥目录赋予足够的权限，以确保一切安全。\n\n```bash\nchmod 600 .ssh/authorized_keys\n```\n\
  \n如果你想通过 浏览器访问你的 shell，我们需要安装以下软件包并按照如下所示进行编辑和配置：\n\n```bash\nsudo apt-get install\
  \ ajaxterm\nsudo sed -i 's:PasswordAuthentication.*:PasswordAuthentication yes:'\
  \ /etc/ssh/sshd_config\n```\n\n接下来，我们使用以下命令重启服务：\n\n```bash\nsudo service ssh restart\n\
  ```\n\n现在，打开浏览器并使用如下 URL 指向你的机器：\n\n`http://manon.com:8022/`\n\n将 `manon.com` 替换为你自己的\
  \ IP 或你在 DNS 安装机器上使用的 DNS 字符串，你也可以使用 `localhost` 代替。\n\n输入你的用户名，然后按键盘上的回车键。\n\n\
  输入你的密码，然后按键盘上的回车键。\n\n你当然输入的是你操作系统的用户名和密码。\n\n图 3.1 显示了上一步安装的结果。\n\n![](img/Image1181.jpg)\n\
  \n## 3.2 使用 SSL 创建证书\n\n在下一节中，我们将介绍创建自签名证书并对其签名。\n\n我们还将通过自签名证书并将其附加到 Web 服务器作为使用这些证书的示例，步骤如下：\n\
  \n我们需要执行以下命令来创建一个密钥：\n\n```bash\nopenssl genrsa -des3 -out server.key 2048\n```\n\
  \n注意，`server.key` 可以更改为你使用的任何文件名。\n\n现在我们为我们的密钥文件分配 `RSA` 加密，并将结果输出到一个不安全的文件，如下：\n\
  \n```bash\nopenssl rsa -in server.key -out server.key.insecure\n```\n\n现在我们按照如下所示创建我们的安全密钥：\n\
  \n```bash\nmv server.key server.key.secure\n```\n\n然后我们按照如下方式移动密钥：\n\n```bash\n\
  mv server.key.insecure server.key\n```\n\n现在，我们使用以下命令创建证书签名请求（CSR）：\n\n```bash\n\
  openssl req -new -out server.csr\n```\n\n输入你的用户名，然后按键盘上的回车键。\n\n输入你的密码，然后按键盘上的回车键。\n\
  \n你当然输入的是你操作系统的用户名和密码。\n\n图 3.1 显示了上一步安装的结果。\n\n![](img/Image1181.jpg)\n\n## 3.2\
  \ 使用 SSL 创建证书\n\n在下一节中，我们将介绍创建自签名证书并对其签名。\n\n我们还将通过自签名证书并将其附加到 Web 服务器作为使用这些证书的示例，步骤如下：\n\
  \n我们需要执行以下命令来创建一个密钥：\n\n```bash\nopenssl genrsa -des3 -out server.key 2048\n```\n\
  \n注意，`server.key` 可以更改为你使用的任何文件名。\n\n现在我们为我们的密钥分配 `RSA` 加密，并将结果输出到一个不安全的文件，如下：\n\
  \n```bash\nopenssl rsa -in server.key -out server.key.insecure\n```\n\n现在我们按照如下所示创建我们的安全密钥：\n\
  \n```bash\nmv server.key server.key.secure\n```\n\n然后我们按照如下方式移动密钥：\n\n```bash\n\
  mv server.key.insecure server.key\n```\n\n现在，我们使用以下命令创建证书签名请求（CSR）：\n\n```bash\n\
  openssl req -new\n```\n\n\n\n\n在之前的过程中，会出现一些提示，例如密码、国家名称、用户文件名以及城市和州值。你当然可以使用你自己的值，或者针对你特定需求的值。\n\
  \n当你完成所有操作后，浏览你的 `https://manon.com/` 服务器并确认你的安全异常，以将网站添加到信任站点，直接点击地址 `https://manon.com/`\
  \ 旁的小图标，你会发现打开了一个窗口，点击 `more information`（更多信息），如果默认未启用，则转到 `security`（安全）选项卡，然后点击\
  \ `view certificate`（查看证书），你将发现证书已填充了你的协议以及服务器名称 `manon.com`，如下图 3.3 所示：\n\n![](img/Image1196.jpg)\n\
  \n## 3.3 使用 SELinux 和访问控制\n\n`SELINUX` 是一个用于启用和禁用服务并通过你的系统控制端口号和访问的网关。\n\n在 UBUNTU\
  \ LINUX 机器上安装 SELINUX，我们使用以下命令：\n\n```bash\nsudo apt-get install selinux\n```\n\n\
  有 2 个主要选项来配置 SELINUX 软件包，我们将按照如下方式介绍如何启用每一个一个：\n\n*   **Permissive**：`manon.com`\
  \ 最常用的选项，启用此选项的命令是：\n    ```bash\n    sudo sed -i ‘s/SELINUX=.*/SELINUX=permissive/’\
  \ /etc/selinux/config\n    ```\n*   **Enforcing**：最安全的选项，启用此选项的命令是：\n    ```bash\n\
  \    sudo sed -i ‘s/SELINUX=.*/SELINUX=enforcing/’ /etc/selinux/config\n    ```\n\
  \nUBUNTU 默认已安装的另一个防火墙软件包是：\n\n`UFW`\n\n正如我们过的，`UFW` 是默认安装的，我们将按照如下方式介绍它的配置和操作命令：\n\
  \n要启用该服务，我们需要运行以下命令：\n\n```bash\nsudo ufw enable\n```\n\n要对你正在使用的服务（如 `HTTP` 或 `HTTPS`）上启用或禁用端口，我们需要执行以下命令：\n\
  \n```bash\nsudo ufw allow 8080 #启用 HTTP 端口 8080\nsudo ufw allow 80 #启用 HTTP 端口 80\n\
  ```\n\n之前的端口号 8080 和 80 是 UBUNTU 用于 `HTTP` 协议的主要使用端口号。如果你禁用了其中一个端口，你将无法从其他机器浏览 `http://localhost/`\
  \ 或 `http://manon.com/`。\n\n```bash\nsudo ufw deny 8080 #禁用 HTTP 端口 8080\nsudo ufw\
  \ deny 80 #禁用 HTTP 端口 80\nsudo ufw allow 22 #在端口 22 上启用 HTTPS\nsudo ufw deny 22\
  \ #在端口 22 上禁用 HTTPS\n```\n\n你也可以按照如下方式删除你创建的规则：\n\n```bash\nsudo ufw delete deny\
  \ 22\nsudo ufw delete deny 80\nsudo ufw delete deny 8080\n```\n\n你也可以使用以下命令通过服务名调用\
  \ `allow`、`deny` 服务：\n\n```bash\nsudo ufw deny http\nsudo ufw deny https\nsudo ufw\
  \ deny Samba\n```\n\n最后，我们可以使用以下命令启用和禁用服务：\n\n```bash\nsudo service ufw start\n\
  sudo service ufw stop\nsudo service ufw restart\n```\n\n## 3.4 连接到 Linux 机器\n\n\
  在下一节中，我们将按照如下学习学习使用 `SSH` 协议连接到你的 LINUX 机器：\n\n```bash\nssh localhost\n```\n\n我们使用此命令在本地网络内本地连接到机器。\n\
  \n如果我们从服务提供商处获得了静态 IP 地址服务并将其应用于我们的 LINUX 连接，我们就能使用以下命令从任何地方连接到我们的机器：\n\n```bash\n\
  ssh 192.168.0.2\n```\n\n将 `192.168.0.2` 替换为你将获得的 ISP IP 地址。\n\n你也可以使用我们在为你的 UBUNTU\
  \ LINUX 机器安装 DNS 时使用的 DNS 字符串连接到你的机器：\n\n```bash\nssh manon.com\n```\n\n你需要一个用户名和密码来访问机器，如果你安装了像我们在\
  \ `#Creating Certificates using SSL` 章节中提到的公钥-私钥对（该章节中包含了我们创建的密钥文件）。\n\n要使用密钥文件，我们需要执行以下命令：\n\
  \n```bash\nssh -l mostafa -i /etc/ssl/certs/manon.com.pem manon.com\n```\n\n或者\n\
  \n```bash\nssh -l mostafa -i /etc/ssl/certs/manon.com.pem localhost\n```\n\n输入你在创建文件时使用的短语（pass\
  \ phrase）。\n\n输入你用于登录系统的操作系统密码。\n\n然后，你将看到如图 3.4 所示的屏幕。\n\n![](img/Image1205.jpg)\n\
  \n通过这种方式，你可以远程控制你的机器并在上面执行任何任务。\n\n我们现在已经涵盖了如何使用 `SSH` 服务连接到你的机器的话。\n\n## 3.5 在\
  \ Linux 中保护你的 Web 服务器\n\n为了在 LINUX 中保护你的 Web 服务器，我们需要检查一个清单，我们在进入 Web 服务器安全主题时将按照如下方式进行：\n\
  \n1.  在进入 Web 服务器安全主题时，按照如下方式执行连接。\n2.  使用以下工具进行 `HTTP` 和 `HTTP` 扫描：\n    *   `Httrack`\n\
  \    *   `Burp Suite`\n    *   `Web Scarab`\n3.  部署应用时使用 `.htaccess` 文件，通过以下命令禁用索引：\n\
  \    ```bash\n    sudo nano /var/www/html/.htaccess\n    ```\n    在文件中添加以下代码：\n\
  \    ```\n    Options -Indexes\n    ```\n    使用 `CTRL + X` 保存文件。当你打开 Web 服务器上的空目录时，将得到拒绝访问错误。\n\
  \n## 3.6 在 Linux 中保护你的数据库服务器\n\n为了保护我们安装的 `MySQL` 数据库服务器，我们需要按照如下方式进行以下安装和配置：\n\n\
  输入以下命令：\n\n```bash\nmysql_secure_installation\n```\n\n在提示时输入 `root` 密码。\n\n在 `change\
  \ password` 提示中，你可以根据环境输入 `Y` 或 `N` 来更改。\n\n在 `remove anonymous users` 提示中，输入 `Y`\
  \ 并按回车。\n\n在 `disallow root remotely` 提示中，为了安全选择 `Y`，不要让同一网络中的其他机器登录数据库服务器。\n\n\
  在 `remove test database and access to it` 提示中，选择 `Y` 并按回车。\n\n现在在 `reload privilege\
  \ table`，选择 `Y` 并按回车。\n\n![](img/Image16.jpg)\n\n注意，在我们配置结束时，你将看到如图 3.5 所示的屏幕。\n\
  \n但注意在我的状态下，我允许了远程登录尝试以便远程访问服务器，这种选项适用于云镜像安装，如果你在云环境中使用 UBUNTU，你将使用此选项，因为你要远程连接到数据库服务器。\n\
  \n## 3.7 保护你的 Linux 虚拟机\n\n保护 LINUX 虚拟机与保护 LINUX 机器完全一样，只是需要考虑到虚拟机被远程访问。因此，在进行安全措施时，你需要考虑到公共访问多于本地访问。\n\
  \n\n\n图 4.1 显示了 `listing interfaces` 命令的输出。\n\n我们也可以使用以下命令获取当前可用网络接口列表，该命令将为提供关于每个接口的详细信息。\n\
  \n```bash\nip addr\n```\n\n![](img/Image1234.jpg)\n\n图 4.2 显示了更详细的列出接口输出。\n\n现在，我们需要按照如下方式配置网络适配器：\n\
  \n```bash\nsudo vi /etc/network/interfaces\n```\n\n如果你想配置你的网络适配器使用静态 IP 地址，那么我们需要在正在编辑的文件中添加以下行：\n\
  \n```text\nauto eth0\niface eth0 inet static\naddress 192.168.0.2\nnetmask 255.255.255.0\n\
  network 192.168.0.1\nbroadcast 192.168.0.255\ngateway 192.168.0.1\ndns-nameservers\
  \ 192.168.0.1\n```\n\n![](img/Image1242.jpg)\n\n图 4.3 显示了我们必须应用到网络适配器的上述配置设置。\n\n\
  然后，我们需要按照如下方式重启网络：\n\n```bash\nsudo ifdown -a && sudo ifup -a\n```\n\n通过这种方式，我们配置了有线网络适配器使用我们分配的静态\
  \ IP 地址。\n\n## 4.2 Linux 中的无线网络\n\n为了开始使用无线网络适配器，我们需要执行以下命令列出适配器，以获取我们将要使用的适配器名称：\n\
  \n```bash\nsudo ls /sys/class/net\n```\n\n或者更详细地，我们可以执行以下命令：\n\n```bash\nip addr\n\
  ```\n\n在我的情况下，无线适配器的名称为 `wlan0`。\n\n在大多数 LINUX 机器的系统中，这是你所使用的无线适配器的默认名称，如果你在机器上安装了多个适配器，你会发现它们被命名为\
  \ `wlan1`、`wlan2`、`wlan3` 等。\n\n我们需要执行以下命令来编辑网络接口并按如下方式调整静态 IP 地址：\n\n```bash\n\
  sudo vi /etc/network/interfaces\n```\n\n现在我们通过添加这些配置行来编辑文件：\n\n```text\nauto wlan0\n\
  iface wlan0 inet static\naddress 192.168.0.2\nnetmask 255.255.255.0\nnetwork 192.168.0.2\n\
  broadcast 192.168.0.255\ngateway 192.168.0.2\ndns-nameservers 192.168.0.2\n```\n\
  \n现在按 `CTRL + X` 保存文件，使用相同的路径和文件名进行确认。\n\n现在我们需要按照如下方式重启网络适配器：\n\n```bash\nsudo\
  \ ifdown -a && sudo ifup -a\n```\n\n或者我们可以使用以下命令：\n\n```bash\nsudo service network-manager\
  \ restart\n```\n\n或者\n\n```bash\nsudo service NetworkManager restart\n```\n\n##\
  \ 4.3 Linux 中的 Network Manager\n\n为了管理你的网络管理器，我们需要执行以下操作：\n\n```bash\nsudo service\
  \ network-manager start\nsudo service network-manager stop\nsudo service network-manager\
  \ restart\nsudo service NetworkManager start\nsudo service NetworkManager stop\n\
  sudo service NetworkManager restart\n```\n\n前 3 条命令用于在某些 UBUNTU LINUX 发行版和 FEDORA\
  \ 发行版中启动、停止并重启服务。\n\n后 3 条命令用于在其他 UBUBU 发行版中启动、停止并重启服务。\n\n如果你在使用 UBUNTU 或 FEDORA\
  \ 的云镜像，或者无论你使用的是什么发行版，都可以按照如下方式安装网络管理器服务：\n\n```bash\nsudo apt-get install network-manager\n\
  ```\n\n要在 GNOME 发行版中安装指示器，可以使用以下命令：\n\n```bash\nsudo apt-get install network-manager-gnome\n\
  ```\n\n## 4.4 Linux 中的网络监控\n\n如果你想安装带宽监控工具，我们将按照如下方式安装带图表的 `bandwidthd`：\n\n```bash\n\
  sudo apt-get install bandwidthd\n```\n\n完成后，我们需要按照如下方式将安装链接到我们的 Web 服务器：\n\n```bash\n\
  sudo ln -s /var/lib/bandwidthd/htdocs /var/www/bandwidth\n```\n\n最后我们可以重启 apache\
  \ 服务以完成整个过程：\n\n```bash\nsudo service apache2 restart\n```\n\n完成后，通过指向以下 URL，我们现在一切都正常运行：\n\
  \n[`manon.com/bandwidthd/`](http://manon.com/bandwidthd/)\n\n![](img/Image1249.jpg)\n\
  \n图 4.4 显示了网络带宽监控工具的控制台。\n\n## 4.5 Linux 中的网络扫描\n\n我们首先需要了解什么是网络上的端口扫描和 IP 扫描：\n\
  \n端口扫描是一种了解我们进行扫描的每个设备上开启了哪些端口的方法。\n\nIP 扫描是一种了解我的网络中哪些 IP 地址正在运行并处于在线状态的方法。\n\n\
  执行方式如下所示：\n\n我们需要按照如下方式在你的 UBUNTU LINUX 机器上安装 `nmap` 服务协议：\n\n```bash\nsudo apt-get\
  \ install nmap\n```\n\n完成后，我们需要按如下方式进行 IP 扫描以查看网络中哪些设备是在线的：\n\n```bash\nsudo nmap\
  \ -sn 192.168.0.0/24\n```\n\n扫描结果如下所示：\n\n- 192.168.0.1\n- 192.168.0.2\n- 192.168.0.3\n\
  - 192.168.0.4\n- 192.168.0.5\n- 192.168.0.6\n- 192.168.0.7\n- 192.168.0.8\n- 192.168.0.9\n\
  - 192.168.0.10\n- 192.168.0.11\n- 192.168.0.12\n- 192.168.0.13\n- 192.168.0.14\n\
  - 192.168.0.15\n- 192.168.0.16\n- 192.168.0.17\n- 192.168.0.18\n- 192.168.0.19\n\
  - 192.168.0.20\n- 192.168.0.21\n- 192.168.0.22\n- 192.168.0.23\n- 192.168.0.24\n\
  - 192.168.0.25\n- 192.168.0.26\n- 192.168.0.27\n- 192.168.0.28\n- 192.168.0.29\n\
  - 192.168.0.30\n- 192.168.0.31\n\n接下来，我们需要检查每个主机上哪些端口是开启的：\n\n```bash\nsudo nmap\
  \ 192.168.0.1\n```\n\n扫描结果如下：\n\n- 192.168.0.1:80/tcp open (http)\n- 192.168.0.1:443/tcp\
  \ open (https)\n- ...\n- 192.168.0.1:8080/tcp open (http-proxy)\n\n# 5 Linux 中的私有云\n\
  \n## 5.1 安装 Openstack\n\n*Openstack 是由一家名为 Redhat 的公司创建的操作系统，它是云行业中拥有巨大市场份额的公司（如\
  \ Canonical, IBM, Rackspace, Dell, HP, CISCO, SUSE, Nebula 和 VMware）。*\n\n为了开始安装，让我们输入以下命令。如果你还没有完成\
  \ git 的安装，请前往 git 章节并安装 git 以运行此命令：\n\n```bash\nsudo git clone https://git.openstack.org/openstack/devstack\n\
  ```\n\n让我们使用管理工具安装。下载完成后，我们需要按如下方式更改下载内容的权限：\n\n```bash\nsudo chmod 777 -R ~/devstack\n\
  ```\n\n完成后，我们需要按照如下方式启动安装：\n\n```bash\ncd ~/devstack\n```\n\n然后启动安装脚本：\n\n```bash\n\
  ./stack.sh\n```\n\n在提示时，输入你安装 LAMP 服务器时使用的相同密码。如果你没有安装任何数据库服务器，可以使用任何新密码，建议使用字母和数字。\n\
  \n最后，我们需要通过执行此脚本自动完成一系列下载和安装程序，然后我们以如下屏幕结束：\n\n![](img/Image1274.jpg)\n\n图 5.1 显示了包含服务\
  \ URL 和凭据（用户名和密码）的确认屏幕\n\n完成后，你将看到如何访问我们安装的服务的屏幕，如前一个图所示。\n\n现在打开浏览器并指向以下任一 URL：\n\
  \n[`manon.com/auth/login/?next=/`](http://manon.com/auth/login/?next=/)\n[`manon.com/auth/login/`](http://manon.com/auth/login/)\n\
  [`manon.com/`](http://manon.com/)\n\n*你需要将上述之前的 URL 域名更改为你的 DNS 字符串，或者如果你使用同一台机器，可以使用\
  \ localhost 或你的 IP 地址。*\n\n\n\n\n![](img/Image1281.jpg)\n\n如果您已完成用户名（demo 或 admin）以及安装期间输入的密码输入，并点击连接（connect），您将看到仪表板。\n\
  \n通过这种方式，我们已经完全安装并运行了我们的 OpenStack 服务。\n\n## 5.2 使用 Openstack Keystone\n\n首先，我们将学习到的是关于\
  \ `keystone` 的身份验证和授权。\n\n我们将按照以下步骤创建一个项目、用户名和密码，创建一个角色，并将用户添加到该角色中：\n\n使用终端创建项目，请输入以下命令：\n\
  \n```bash\nsudo openstack project create --description ‘New Project’ --os-username=admin\
  \ --os-password=INSTALLATIONPASSHERE --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\
  \ manon\n```\n\n您最终将看到一个类似于图 5.3 所示的屏幕\n\n![](img/Image1289.jpg)\n\n使用终端创建用户，请输入以下命令：\n\
  \n```bash\nsudo openstack user create --project admin --password PASSWORDHERE manon\
  \ --os-username=admin --os-password=INSTALLATIONPASSHERE --os-auth-url=http://192.168.0.2:5000/\
  \ --os-project-name=admin\n```\n\n运行此命令时，我们将看到下所示图 5.4 所示的确认屏幕：\n\n![](img/Image1298.jpg)\n\
  \n通过这种方式，我们在我们的 OpenStack 服务中创建了一个新用户，现在可以使用我们创建的新凭据进行登录了。\n\n将您的浏览器指向之前的 URL：\n\
  \n- [`localhost/`](http://localhost/)\n- [`manon.com/`](http://manon.com/)\n- [`127.0.0.1/`](http://127.0.0.1/)\n\
  \n然后填写您在上一个命令中使用的用户名和密码即可开始。\n\n要禁用该用户，我们可以执行以下命令：\n\n```bash\nsudo openstack user\
  \ set manon --disable --os-username=admin --os-password=INSTALLATIONPASSHERE --os-auth-url=http://192.168.0.2:5000/\
  \ --os-project-name=admin\n```\n\n要列出用户，我们可以执行以下命令：\n\n```bash\nsudo openstack user\
  \ list --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin --os-username=admin\
  \ --os-password=INSTALLATIONPASSHERE --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n\
  ```\n\n![](img/Image1309.jpg)\n\n**图 5.5** 显示了我们拥有的用户，包括我们创建的用户（用黑色背景高亮）。\n\n要启用我们已经禁用的用户，我们需要执行以下命令：\n\
  \n```bash\nsudo openstack user set manon --enable --os-username=admin --os-password=INSTALLATIONPASSHERE\
  \ --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n```\n\n要删除用户，我们可以执行以下命令：\n\
  \n```bash\nsudo openstack user delete manon --os-username=admin --os-password=INSTALLATIONPASSHERE\
  \ --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n```\n\n要创建一个角色，我们可以执行以下命令：\n\
  \n```bash\nsudo openstack role create rolename --os-username=admin --os-password=INSTALLATIONPASSHERE\
  \ --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n```\n\n![](img/Image1322.jpg)\n\
  \n**图 5.6** 显示了上一个命令的输出，如下所示：\n\n要将用户添加到角色，我们可以执行以下命令：\n\n```bash\nsudo openstack\
  \ role add --user manon --project manon manonrole --os-username=admin --os-password=INSTALLATIONPASSPHRASE\
  \ --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n```\n\n上一个命令的输出与图\
  \ 5.6 的输出相同。\n\n要禁用一个项目，您可以执行以下命令：\n\n```bash\nsudo openstack project set manon\
  \ --disable --os-username=admin --os-password=INSTALLATIONPASSPHRASE --os-auth-url=http://192.168.0.2:5000/\
  \ --os-project-name=admin\n```\n\n要启用一个项目，您可以执行以下命令：\n\n```bash\nsudo openstack\
  \ project set manon --enable --os-username=admin --os-password=INSTALLATIONPASSPHRASE\
  \ --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n```\n\n要更新项目名称，我们可以执行以下命令：\n\
  \n```bash\nsudo openstack project set manon --name mannew --os-username=admin --os-password=INSTALLATIONPASSPHRASE\
  \ --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n```\n\n要显示项目的详情，我们可以执行以下命令：\n\
  \n```bash\nsudo openstack project show manon --os-username=admin --os-password=INSTALLATIONPASSPHRASE\
  \ --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n```\n\n要删除项目，我们可以执行以下命令：\n\
  \n```bash\nsudo openstack project delete manon --os-username=admin --os-password=INSTALLATIONPASSPHRASE\
  \ --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin\n```\n\n我们也可以使用相同的密钥来编辑环境。这些密钥是强制性的，必须在命令中使用。操作方法如下：\n\
  \n```bash\ntouch adminrc\nsudo nano adminrc\n```\n\n在文件中，输入以下值：\n\n```bash\nOS_USERNAME=manon\n\
  OS_PASSWORD=password\nOS_AUTH_URL=http://localhost:5000/\nOS_PROJECT_NAME=admin\n\
  ```\n\n您必须按 `CTRL + X` 退出文本界面并回车确认文件。然后执行以下命令：\n\n```bash\nsource adminrc\nopenstack\
  \ project set manon --name mannew\n```\n\n现在，我们已经完成了 OpenStack 身份服务的管理操作。\n\n##\
  \ 5.3 使用 Openstack Heat\n\n让我们了解 OpenStack Heat，Heat 是用于编排 OpenStack 服务的编排引擎，现在我们将了解它的功能以及它能为云环境做什么。\n\
  \n现在，以 root 用户身份登录 mysql 服务器：\n\n```bash\nsudo mysql -uroot -p\n```\n\n然后您需要输入安装数据库时输入的密码。之后，您将看到下面的屏幕：\n\
  \n完成后，我们需要创建一个名为 `heat` 的新数据库并授予访问权限：\n\n```sql\nCREATE DATABASE heat;\nGRANT ALL\
  \ PRIVILEGES ON heat.* TO 'heat'@'localhost' IDENTIFIED BY 'INSTALLATIONHERE';\n\
  GRANT ALL PRIVILEGES ON heat.* TO 'heat'@'%' IDENTIFIED BY 'INSTALLATIONHERE';\n\
  ```\n\n现在，输入 `exit` 您将看到退出信息。\n\n接下来，我们创建一个委托热 编排服务的用户：\n\n```bash\nsudo openstack\
  \ user create --project admin --password PASSWORDHERE heat\n```\n\n之后，我们需要按照如下方式创建\
  \ heat 服务：\n\n```bash\nsudo openstack role add --user heat --project manon manonrole\n\
  ```\n\n最后，在处理 Heat API 时，我们需要创建两个端点。端点是两个或多个服务之间集成网关工作的地方，或用于一个系统与另一个系统的通信。\n\n\
  我们创建的第一个端点是 `heat`，适用于我们创建的 `heat` 用户和 `heat` 角色，如下所示。\n\n\n\n\n\n```bash\nsudo\
  \ openstack endpoint create --publicurl http://192.168.0.2:8004/v1/fc38a412004b4664a55fd9a975e40085\
  \ --internalurl http://192.168.0.2:8004/v1/fc38a412004b4664a55fd9a975e40085 --adminurl\
  \ http://192.168.0.2:8004/v1/fc38a412004b4664a55fd9a975e40085 --region regionOne\
  \ --os-username=admin --os-password=manon1982 --os-auth-url=http://192.168.0.2:5000/\
  \ --os-project-name=admin heat\n```\n\n我们需要创建的第二个端点是 `heat-cfn`。\n\n```bash\nsudo\
  \ openstack endpoint create --publicurl http://192.168.0.2:8004/v1/83dace3c2f44444fb8780576f341b64d\
  \ --internalurl http://192.168.0.2:8004/v1/83dace3c2f44444fb8780576f341b64d --adminurl\
  \ http://192.168.0.2:8004/v1/83dace3c2f44444fb8780576f341b64d --region regionOne\
  \ --os-username=admin --os-password=manon1982 --os-auth-url=http://192.168.0.2:5000/\
  \ --os-project-name=admin heat-cfn\n```\n\n接下来，我们按照以下步骤进行安装：\n\n```bash\nsudo apt-get\
  \ install heat-api heat-api-cfn heat-engine python-heatclient\n```\n\n接下来，我们需要对名为\
  \ `heat.conf` 的文件进行配置更改：\n\n```bash\nsudo nano /etc/heat/heat.conf\n```\n\n我们需要根据我们的环境修改以下变量：\n\
  \n在数据库部分 `[DATABASE]` 中：\n\n我们需要修改以下行：\n\n`connection = mysql://heat:HEAT_DBPASS@controller/heat`\n\
  \n然后，我们需要在 `[DEFAULT]` 部分中修改以下内容：\n\n`rpc_backend = rabbit`\n\n`rabbit_host = localhost`\n\
  \n`rabbit_password = guest`\n\n`heat_metadata_server_url = http://localhost:8000`\n\
  \n`heat_waitcondition_server_url = http://localhost:8000/v1/waitcondition`\n\n然后，我们需要在名为\
  \ `[keystone_authtoken]` 的部分中修改内容：\n\n`auth_uri = http://localhost:5000/v2.0`\n\n\
  `identity_uri = http://localhost:35357`\n\n`admin_tenant_name = admin`\n\n`admin_user\
  \ = heat`\n\n`admin_password = PASSWORDHERE`\n\n然后，我们需要在 `[ec2authtoken]` 部分中编辑以下行：\n\
  \n`auth_uri = http://localhost:5000/v2.0`\n\n然后，我们需要通过执行以下命令来填充我们的数据库：\n\n```bash\n\
  sudo su -s /bin/sh -c “heat-manage db_sync” heat\n```\n\n最后，我们通过执行以下命令来完成解决方案：\n\
  \n```bash\nsudo service heat-api restart\nsudo service heat-api-cfn restart\nsudo\
  \ service heat-engine restart\n```\n\n如果你正在使用 `UBUNTU LINUX`，那么我们需要执行以下命令来删除未使用的数据库：\n\
  \n```bash\nrm -f /var/lib/heat/heat.sqlite\n```\n\n要创建一个栈（stack），我们需要创建一个名为 `heatorchestrationtemplate.yaml`\
  \ 的文件。\n\n我们需要执行以下命令：\n\n```bash\ntouch heatorehcstrationtemplate.yaml\n```\n\n\
  然后，我们使用此命令编辑文件：\n\n```bash\nnano heatorchestrationtemplate.yaml\n\n```\n\n最后，我们需要向文件中添加以下内容，并根据我们的环境考虑任何更改：\n\
  \n```yaml\nheat_template_version: 2013-05-23\ndescription: Simple template to deploy\
  \ a single compute instance\nresources:\n  my_instance:\n    type: OS::Nova::Server\n\
  \    properties:\n      image: /path/to/image/downloaded_ubuntu_cloud_image.img\n\
  \      flavor: m1.small\n      key_name: keyfile.pem\n    networks:\n      - network:\
  \ network-name\n```\n\n然后，我们需要调整高亮的数据以适应我们的环境。\n\n最后，我们可以在以下命令中使用我们的文件来创建一个 heat\
  \ 编排栈：\n\n```bash\nsudo openstack stack create manon_stack -f heatorchestrationtemplate.yaml\n\
  ```\n\n现在，我们已经安装了 heat 服务，进行了完整的配置以使其能够正常工作，并在 heat 服务上创建了一个示例栈。\n\n## 5.4 使用 Openstack\
  \ Swift\n\n现在，让我们按照以下步骤安装 swift 存储服务并启用复制：\n\n```bash\nsudo apt-get install swift\
  \ swift-account swift-container swift-object xfsprogs\n```\n\n现在，让我们创建一个名为 `rsyncd.conf`\
  \ 的文件：\n\n```bash\nsudo nano /etc/rsyncd.conf\n```\n\n然后，我们需要输入以下数据，并注意你需要根据你的环境所做的更改：\n\
  \n```ini\nuid = swift\ngid = swift\nlog file = /var/log/rsyncd.log\npid file = /var/run/rsyncd.pid\n\
  address = 192.168.0.2\n\n[account]\nconnections = 2\npath = /srv/node/\nread only\
  \ = false\nlock file = /var/lock/account\n\n[container]\nconnections = 2\npath =\
  \ /srv/node/\nread only = false\nlock file = /var/lock/container\n\n[object]\nconnections\
  \ = 2\npath = /srv/node/\nread only = false\nlock file = /var/lock/object\n```\n\
  \n然后，我们需要编辑以下文件：\n\n```bash\nsudo nano /etc/default/rsync\n```\n\n我们找到包含内容的行并进行编辑：\n\
  \n```bash\nRSYNC_ENABLE=true\n```\n\n然后我们必须启动 rsync 服务：\n\n```bash\nservice rsync\
  \ start\n```\n\n然后，我们需要执行以下命令：\n\n```bash\nsudo mkdir -p /var/swift\nchown -R swift:swift\
  \ /var/swift\n```\n\n现在，我们完成了存储服务的工作并完成了基础同步。\n\n## 5.5 使用 Openstack Glance\n\n\
  Glance 是我们用于在裸机硬件上创建虚拟机的镜像服务。它可以让多个操作系统进行相互通信。\n\n首先，我们需要执行：\n\n```bash\nsudo apt-get\
  \ install glance\n```\n\n然后，我们需要安装以下包以完成依赖：\n\n```bash\nsudo apt-get install python-glanceclient\n\
  ```\n\n现在按 `Y` 确认所有命令。\n\n我们现在已经安装了 glance 服务，现在我们需要从互联网上的 UBUNTU 云镜像目录下载我们的第一个镜像，地址如下：\n\
  \n[`cloud-images.ubuntu.com/wily/current/`](https://cloud-images.ubuntu.com/wily/current/)\n\
  \n这是由 Canonical 公司开发的 UBUNTU 最新版本。该发行是最流行的云镜像之一。\n\n我们现在可以使用此镜像将其导入我们的 Openstack\
  \ 私有云：\n\n```bash\nsudo openstack image create --name=”UBUNTU CLOUD IMAGE” --disk-format=qcow2\
  \ --container-format=bare --is-public=true < /home/mostafa/Downloads/ubuntu-14.04-server-cloudimg-i386/trusty-server-cloudimg-i386.img\
  \ --os-username=admin --os-password=AMINPASSWORD --os-auth-url=http://192.168.0.2:5000/\
  \ --os-project-name=admin\n```\n\n现在我们已经完成了 Openstack 服务的安装和配置。我们还使用了它的部分服务，学习了如何与\
  \ LINUX 交互，并了发行版、仓库、基础命令以及 LINUX 可以实现的大部分功能。我们还安装了来自第三方和其他供应商的一些进阶功能和组件的基础设施。\n\n\
  非常感谢，感谢你抽出宝的时间阅读本书。\n\n希望你喜欢。\n\n"
