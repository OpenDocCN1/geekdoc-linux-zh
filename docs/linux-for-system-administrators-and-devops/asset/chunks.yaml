    \ the default because we will be working on re-configuring the package.\n\n2.\
    \ We need to re-configure the package in order to apply our environment specific\
    \ data as follows:\n   ```bash\n   sudo dpkg-reconfigure postfix\n   ```\n\nYou\
    \ will be presented with a series of screens where you need to apply your configuration\
    \ settings as follows:\n\n   * Internet Site.\n   * None doesn’t appear to be\
