  raw: '![](image/Image1093.jpg)


    This command has added a java installation repository to the sources.list file,
    so that the operating system can recognize the package name for the java sdk program
    that we want to install.


    We can edit the sources.list file by using the following command:


    nano /etc/apt/sources.list


    The command will be presenting a list of repositories where the operating system
    finds package names and recognize where to download and update these  packages.


    You can edit in the file, add, update or delete any record you need but be very
    cautious when working with this file because it contains some sensitive data about
    updating and upgrading packages of your operating system.


    ## 1.11 Updates, Upgrades and Distributions Upgrades


    Updating your machine is not a hard task unless you do not have much programs
    and packages installed on it because LINUX tries to update packages that you install
    beside the operating system packages that is installed already with the operating
    system initial installation.


    You can update your system by using this command:


    sudo apt-get udpate


    The output of this command is a part of the output shown before in the section
    **Basic LINUX Commands** **#Image7|graphic**


    You can upgrade your LINUX system using this command:


    sudo apt-get upgrade


    The output of this command is also a part of the output shown before in the section
    **Basic LINUX Commands** **#Image7|graphic**


    You can upgrade your LINUX distribution (only) means that you will upgrade within
    the same distribution versions but not to the newest distribution using the following
    command:


    sudo apt-get dist-upgrade


    The output of this command is also a part of the output shown before in the section
    **Basic LINUX Commands** **#Image7|graphic**


    **Of course you can get around problems while performing update, upgrade, and
    dist-upgrade using a key called --fix-missing and it will try to go around broken
    links and other update problems that it may face during the process execution.**


    So basically, this is the end of part 1 LINUX Desktop, Server and Cloud Image
    which has added a general idea of how LINUX machine is working and how to do various
    tasks id different area of management of a LINUX machine.


    Let’s Move Around to Part 2.


    # 2 Linux Infrastructure


    ## 2.1 Installing DNS, DHCP, and Kerberos


    Lets walk through the installation of BIND9 which is the DNS Package Name on UBUNTU


    Installing BIND9 is using this command:


    #### **sudo apt-get install bind9**


    Running this command will give the output with confirmation as figure 2.1 shows:


    ![](image/Image1101.jpg)


    When you press Y and hit enter key on your keyboard the installation will continue
    until finished and you will get to the bind configuration process to get everything
    up and running.


    To configure bind 9 we need to run the following command:


    sudo nano /etc/bind/named.conf.options


    You will be editing this file, please find a line of text containing forwarders:


    forwarders{


    00.00.00.00;


    }


    Please change the number between brackets from the current IP address to your
    IP address. In my case, my IP address is 192.168.0.2


    So the forwarders section becomes like this:


    forwarders{


    192.168.0.2;


    }


    Now, you need to enter the following command to edit another file called named.conf.local


    sudo nano /etc/bind/named.conf.local


    Then, what you need to do is changing adding the following entries or changing
    the current entries if found:


    zone “manon.com” {


    type master;


    file “/etc/bind/db.manon.com”;


    };


    zone “0.168.192.in-addr.arpa” {


    type master;


    file “/etc/bind/db.192”;


    };


    Press CTRL + W to quit, confirm using Y, then hit enter on your keyboard.


    Now, you need to execute the following command to copy a file using cp keyword
    from the original place and create your own with a suitable file name for this
    configuration situation:


    sudo cp /etc/bind/db.127 /etc/bind/db.192


    The copied file is into the path /etc/bind/db.127 and copied to /etc/bind/db.192


    After Copying the file, you should edit the copied file using the following command:


    sudo nano /etc/bind/db.192


    After that you will be presented with the file content, edit the file content
    and make it suitable for your needs as follows:


    ;


    ; BIND reverse data file for local loopback interface


    ;


    ![](image/Linux_for_system_3.jpg)


    You will find the area that you should edit are highlighted so you can customize
    it according to your needs and put into consideration that the last line is containing
    the number 2 at the beginning will be the last octet in your IP address.


    When you finish this, you need to start copying another file using this command:


    sudo cp /etc/bind/db.local /etc/bind/db.manon.com


    this command is copying a file from location /etc/bind/db.local to the destination
    /etc/bind/db.manon.com


    Do not forget to change your destination file from db.manon.com to your host name
    that you desire your server string will be.


    After finishing this we need to edit the file db.manon.com to change its content
    as follows:


    sudo nano /etc/bind/db.manon.com


    Then you need to change the content of this file to be as follows:


    ![](image/Linux_for_system_4.jpg)


    I have highlighted the editable areas for you to change it to your specific environment
    as follows:


    manon.com to replace it with your host name.


    192.168.0.1 to replace it with your IP v4 address.


    ::1 to replace it with your IP v6 address.


    One more thing we need to do is:


    We need to edit the content of the file /etc/default/bind9 as follows:


    sudo nano /etc/default/bind9


    Now, you need to search for a line called


    RESOLVCONF=no


    And Change the value no to yes to be like this:


    RESOLVCONF=yes


    This way, you need to exit the editor using CTRL + X and confirm the file changes
    using Y, then you need to hit enter on your keyboard to get back to the terminal.


    We need to restart the service called bind9 that we have installed on the machine
    using this command:


    sudo service bind9 restart


    After restarting your service, please run this command to check whether your server
    is responding and up and running:


    sudo dig 192.168.0.2


    Please replace the number 192.168.0.2 with your IP address of the server that
    you are installing this DNS on it.


    If you had a response like what is in the following figure 2.2:


    ![](image/Image1110.jpg)


    Then, you have successfully installed your DNS successfully.


    But if you did not see this message, please revise the section about trouble-shooting
    your LINUX machine in *Appendix B* ................................................................
    Troubleshooting your LINUX Machine DNS


    Please do not consult Appendix B before you make sure you made the previous steps
    exactly as requested.


    Our next step will be installing DHCP on your LINUX machine as follows:


    sudo apt-get install isc-dhcp-server


    After running this command, you will be presented with the following output as
    the following figure 2.3:


    ![](image/Image1121.jpg)


    After running the previous command, you need to make some changes in the configuration
    as follows:


    sudo nano /etc/dhcp/dhcpd.conf


    You will now edit the file by searching the content of the file for a line called


    option domain-name = “example.com”;


    You need to edit the contents of the file to make it like the following content
    starting from this file until the end of the content below:


    option domain-name “manon.com”;


    option domain-name-servers ns1.manon.com, ns2.manon.com;


    default-lease-time 600;


    max-lease-time 7200;


    option subnet-mask 255.255.255.0;


    option broadcast-address 192.168.0.255;


    option routers 192.16.0.254;


    subnet 192.168.0.0 netmask 255.255.255.0 {


    range 192.168.0.80 192.168.0.100;


    range 192.168.0.120 192.168.0.220;


    }


    I have highlighted the editable content to make it fit your environment.


    The previous configuration has assigned the ranges from 80–100 to the clients
    of the subnet and from 120–220 to the same subnet.'
