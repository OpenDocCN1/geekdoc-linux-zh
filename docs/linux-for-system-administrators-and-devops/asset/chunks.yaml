  raw: 'sudo openstack endpoint create --publicurl http://192.168.0.2:8004/v1/fc38a412004b4664a55fd9a975e40085
    --internalurl http://192.168.0.2:8004/v1/fc38a412004b4664a55fd9a975e40085 --adminurl
    http://192.168.0.2:8004/v1/fc38a412004b4664a55fd9a975e40085 --region regionOne
    --os-username=admin --os-password=manon1982 --os-auth-url=http://192.168.0.2:5000/
    --os-project-name=admin heat


    The 2nd Endpoint that we need to create is heat-cfn


    sudo openstack endpoint create --publicurl http://192.168.0.2:8004/v1/83dace3c2f44444fb8780576f341b64d
    --internalurl http://192.168.0.2:8004/v1/83dace3c2f44444fb8780576f341b64d --adminurl
    http://192.168.0.2:8004/v1/83dace3c2f44444fb8780576f341b64d --region regionOne
    --os-username=admin --os-password=manon1982 --os-auth-url=http://192.168.0.2:5000/
    --os-project-name=admin heat-cfn


    Next, we perform the following installations as follows:


    sudo apt-get install heat-api heat-api-cfn heat-engine python-heatclient


    Next, we need to make configuration changes to a file called heat.conf as follows:


    sudo nano /etc/heat/heat.conf


    We need to change the following variables according to our environment as follows:


    In the database section [DATABASE]


    We need to change the following line


    connection = mysql://heat:HEAT_DBPASS@controller/heat


    Then, we need to change the following in the section [DEFAULT]


    rpc_backend = rabbit


    rabbit_host = localhost


    rabbit_password = guest


    heat_metadata_server_url = http://localhost:8000


    heat_waitcondition_server_url = http://localhost:8000/v1/waitcondition


    Then we need to change the following in the section called [keystone_authtoken]


    auth_uri = http://localhost:5000/v2.0


    identity_uri = http://localhost:35357


    admin_tenant_name = admin


    admin_user = heat


    admin_password = PASSWORDHERE


    Then, we need to edit the following line in the section called [ec2authtoken]


    auth_uri = http://localhost:5000/v2.0


    Then, we need to populate our database by executing the following command:


    sudo su -s /bin/sh -c “heat-manage db_sync” heat


    Then, we finalize our solution by executing the following command as follows:


    sudo service heat-api restart


    sudo service heat-api-cfn restart


    sudo service heat-engine restart


    If you are using UBUNTU LINUX, then we need to issue the following command to
    remove unused database as follows:


    rm -f /var/lib/heat/heat.sqlite


    To create a stack, we need to create a file called heatorchestrationtemplate.yaml


    We need to execute the following command as follows:


    touch heatorehcstrationtemplate.yaml


    Then we edit the file using this command:


    nano heatorchestrationtemplate.yaml


    After all, we need to add the following content to the file and considering any
    changes according to our environment as follows:


    heat_template_version: 2013-05-23


    description: Simple template to deploy a single compute instance


    resources:


    my_instance:


    type: OS::Nova::Server


    properties:


    image: /path/to/image/downloaded_ubuntu_cloud_image.img


    flavor: m1.small


    key_name: keyfile.pem


    networks:


    - network: network-name


    Then we need to adjust the data highlighted to fit our environment.


    After all, we can use our file in the following command to create a heat orchestration
    stack as follows:


    sudo openstack stack create manon_stack -f heatorchestrationtemplate.yaml


    Now, we have installed our heat services, made a complete configuration to make
    it work properly and created a sample stack on the heat service.


    ## 5.4 Working with Openstack Swift


    Now, let us install swift storage service and enable replication as follows:


    sudo apt-get install swift swift-account swift-container swift-object xfsprogs


    Now, let us create a file called rsyncd.conf as follows:


    sudo nano /etc/rsyncd.conf


    Then, we need to enter the following data and notice that changes you need to
    make according to your environment as follows:


    uid = swift


    gid = swift


    log file = /var/log/rsyncd.log


    pid file = /var/run/rsyncd.pid


    address = 192.168.0.2


    [account]


    max connections = 2


    path = /srv/node/


    read only = false


    lock file = /var/lock/account.lock


    [container]


    max connections = 2


    path = /srv/node/


    read only = false


    lock file = /var/lock/container.lock


    [object]


    max connections = 2


    path = /srv/node/


    read only = false


    lock file = /var/lock/object.lock


    Then, we need to edit the following file:


    sudo nano /etc/default/rsync


    Then we need to search for the line that contains the following data and edit
    it as follows:


    RSYNC_ENABLE=true


    Then we have to restart our re-synchronization service as follows:


    service rsync start


    Then, we need to execute the following command:


    sudo mkdir -p /var/swift/recon


    chown -R swift:swift /var/swift/recon


    This way we have created the directories where the synchronization happens on
    the destination medium that will save our re-synchronization data.


    Now, we finished working with storage services installation and making our basic
    synchronization services.


    ## 5.5 Working with Openstack Glance


    Glance is our image service that we can use to create virtual machines on our
    UBUNTU LINUX machine. This is used to create more that one operating system instance
    running on the same bare-metal hardware, which will permit different architectures
    and operating system versions to communicate with each other and also will also
    permit collaboration of different vendors and 3rd party installations to take
    place and collaborate with each other without the need to use more than one peace
    of hardware.


    First thing that we need to do is:


    sudo apt-get install glance


    Then, we install the following package to complete the dependencies as follows:


    sudo apt-get install python-glanceclient


    Now, confirm all the commands by pressing Y and hitting enter key on your keyboard.


    We have now installed our glance service and now, let us have to inject our first
    image that we will download from UBUNTU cloud images directory over the Internet
    at the following URL as follows:


    [https://cloud-images.ubuntu.com/wily/current/](https://cloud-images.ubuntu.com/wily/current/)


    This is the last release from UBUNTU LINUX developed by a company called Canonical
    LTD.


    This distribution is one of the most popular cloud images that can be used.


    We can now use this image and import it in our Openstack private cloud as follows:


    sudo openstack image create --name=”UBUNTU CLOUD IMAGE” --disk-format=qcow2 --container-format=bare
    --is-public=true < /home/mostafa/Downloads/ubuntu-14.04-server-cloudimg-i386/trusty-server-cloudimg-i386.img
    --os-username=admin --os-password=AMINPASSWORD --os-auth-url=http://192.168.0.2:5000/
    --os-project-name=admin


    Now that we have completed our Openstack Services installations and configurations.


    We have also used some of its services, We also learned how to work with LINUX
    and learned what are the distributions, repositories, basic commands, and most
    of the features that LINUX can do.


    We also installed basic infrastructure with some advanced features and components
    from 3rd parties and other vendors.


    Thank you so much and appreciate your precious time reading the book.


    Hope you enjoy it.'
