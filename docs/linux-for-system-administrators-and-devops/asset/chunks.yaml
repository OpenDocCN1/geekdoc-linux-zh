    sudo dpkg-reconfigure slapd


    After running this command, you will be presented with the following:


    When prompting for omit ldap server configuration: choose no.


    Please enter the DNS domain name: in my case: manon.com


    When it comes to administrator password, please type in the password that you
    have used in the previous installation steps.


    When it comes to database type to use: choose HDB


    When it comes to remove database when slapd is purged: choose no


    When it comes to move old database: choose yes


    And finally, when it prompts to allow ldapv2 protocol: choose no


    When you are finished with this:


    Run the following command:


    sudo apt-get install phpldapadmin


    This will be the front end for our LDAP server and will be working as a user interface
    for managing LDAP users and groups.


    After the installation finishes, we need to edit the following file using nano
    as follows:


    sudo nano /etc/phpldapadmin/config.php


    Find the entries


    $servers->setValue(‘server’,’host’,’manon.com’);


    The fields that you need to change according to your environment are highlighted
    in yellow.


    You will also need to find this line:


    $servers->setValue(‘server’,’base’,array(‘dc=manon,dc=com’));


    And also the fields that need to change are highlighted in yellow.


    The final step is to fine the following line of code to change it to the following
    values:


    $servers->setValue(‘login’,’bind_id’,’cn=admin,dc=manon,dc=com’);


    You will also find the fields that need to be edited are highlighted in yellow.


    When you are finished, please open your browser and point it to the following
    address putting into consideration to change it according to your environment
    specifications:


    [http://manon.com/phpldapadmin/](http://manon.com/phpldapadmin/)


    ![](image/Image1149.jpg)


    **Figure 2.6** shows the PHP LDAP admin front-end.


    After opening this screen, you will be presented with user name and password,
    and you need to enter the user name as follows and putting into considerations
    the changes in your environment:


    cn=admin,dc=manon,dc=com


    The fields that need to be changed are highlighted in yellow.


    Now, we have completely installed our LDAP Kerberos on our DNS and remains the
    security part that we will come to apply it in the chapter **Security in LINUX**.


    ## 2.2 Managing Users and Groups


    *   Adding a new user:


    If you want to add a new use, please run the following command:


    sudo adduser manon


    You need to change manon word to the user name you will need in your environment.


    It will prompt you to enter the details of the user and confirmation that these
    details are correct or not.


    If you want to make this user as administrator and can perform all kinds of tasks
    on the machine, please execute the following commands as follows:


    sudo visudo


    You will find your self into the text editor that we had to use before and we
    will edit some lines as follows:


    search for the line that contains the user name that you have just created in
    the command adduser in the terminal and change the line to the following:


    manon ALL=(ALL:ALL) ALL


    *   If you want to delete the user, you can use the following:


    sudo deluser manon


    If you want to delete the user with all the files that belong to this user on
    the system, then you can use the following command:


    sudo deluser --remove-home manon


    And then execute the same command again as follows:


    sudo visudo


    Then search for the line that we have added before:


    manon ALL=(ALL:ALL) ALL


    Then remove it or make a preceding hash sign like this


    #manon ALL=(ALL:ALL) ALL


    To comment it and make it useless into the file if you will use it later.


    *   Creating a group


    If you want to create a group, then you will need to execute this command:


    sudo addgroup manonsys


    This way, you have added a new group of users into your LINUX machine.


    If you want to join the user into this group, then execute the following command:


    sudo adduser manon manonsys


    This way, we have joined the user “manon” to the group “manonsys”.


    If you want to change the user privileges to access or deny access to directories
    (folders), files, etcetera, then you will need to go to chapter **Installing and
    Managing FTP, SFTP** which we will talk about file servers and managing directories
    and installing protocols that enable the users to communicate with the system
    directories.


    ## 2.3 Installing and Managing Linux Firewalls


    Firewall is a way to protect your machine input and output by filtering it and
    preventing unauthorized access to any sensitive data you do not want to reveal.


    To install your firewall on LINUX, you need to issue the following command on
    your terminal:


    sudo apt-get install ufw


    This command might give the package is installed already and the newest version
    because it might be installed with your operating system by default.


    If you finished installing the package, we need to enable it by issuing the following
    command:


    sudo ufw enable


    To show the status of your firewall, you need to execute the following command:


    sudo ufw status verbose


    ![](image/Image1156.jpg)


    You will be presented with a screen like the previous 2.7 figure showing the results
    of the previous command.


    No that we made sure that our firewall is installed, up and running.


    To enable a port number on your machine, we will execute the following command:


    sudo ufw allow 53


    This command will enable the traffic to pass in and out on port 53.


    We will also learn what are ports when working on securing your LINUX distribution,
    installing web servers on LINUX, and installing ssh and file servers on LINUX
    because every installation of these will require 1 port number or more to use
    within the installation.'
