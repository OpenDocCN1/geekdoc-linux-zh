    \ =’\n\n*   sudo postconf -e ‘smtpd_sasl_local_domain =’\n\n*   sudo postconf\
    \ -e ‘smtpd_sasl_auth_enable = yes’\n\n*   sudo postconf -e ‘smtpd_sasl_security_options\
    \ = noanonymous’\n\n*   sudo postconf -e ‘broken_sasl_auth_clients = yes’\n\n\
    *   sudo postconf -e ‘smtpd_recipient_restrictions = permit_sasl_authenticated,permit_mynetworks,reject_unauth_destination’\n\
    \n*   sudo postconf -e ‘inet_interfaces = all’\n\n*   sudo apt-get install postfix-tls\
    \ sasl2-bin libsasl2 libsasl2-modules\n\n*   sudo nano /etc/default/saslauthd\n\
    \n*   Add or change the following:\n\n*   START=yes\n\n*   MECHANISMS=”pam”\n\n\
    *   sudo nano /etc/postfix/sasl/smtpd.conf\n\n*   Add the following:\n\n*   pwcheck_method:\
    \ saslauthd\n\n*   sudo nano /etc/postfix/main.cf\n\n*   Add the following data:\n\
    \n*   smtpd_sasl_auth_enable = yes\n\n*   smtpd_sasl_security_options = noanonymous\n\
    \n*   broken_sasl_auth_clients = yes\n\n*   smtpd_recipient_restrictions = permit_sasl_authenticated,\
    \ permit_mynetworks, reject_unauth_destination\n\n*   sudo rm -r /var/run/saslauthd/\n\
    \n*   sudo mkdir -p /var/spool/postfix/var/run/saslauthd\n\n*   sudo ln -s /var/spool/postfix/var/run/saslauthd\
    \ /var/run\n\n*   sudo chgrp sasl /var/spool/postfix/var/run/saslauthd\n\n*  \
    \ sudo adduser postfix sasl\n\n*   sudo service postfix restart\n\n*   sudo service\
    \ saslauthd restart\n\n*   sudo nano /etc/postfix/sasl/smtpd.conf and add the\
    \ following details\n\n*   pwcheck_method: saslauthd\n\n*   mech_list: plain login\n\
    \n*   touch smtpd.key\n\n*   chmod 600 smtpd.key\n\n*   openssl genrsa 1024 >\
    \ smtpd.key\n\n*   openssl req -new -key smtpd.key -x509 -days 3650 -out smtpd.crt\n\
    \n*   openssl req -new -x509 -extensions v3_ca -keyout cakey.pem -out cacert.pem\
    \ -days 3650\n\n*   sudo mv smtpd.key /etc/ssl/private/\n\n*   sudo mv smtpd.crt\
    \ /etc/ssl/certs/\n\n*   sudo mv cakey.pem /etc/ssl/private/\n\n*   sudo mv cacert.pem\
    \ /etc/ssl/certs/\n\n*   sudo postconf -e ‘smtp_tls_security_level = may’\n\n\
    *   sudo postconf -e ‘smtpd_tls_security_level = may’\n\n*   sudo postconf -e\
    \ ‘smtpd_tls_auth_only = no’\n\n*   sudo postconf -e ‘smtp_tls_note_starttls_offer\
    \ = yes’\n\n*   sudo postconf -e ‘smtpd_tls_key_file = /etc/ssl/private/smtpd.key’\n\
    \n*   sudo postconf -e ‘smtpd_tls_cert_file = /etc/ssl/certs/smtpd.crt’\n\n* \
    \  sudo postconf -e ‘smtpd_tls_CAfile = /etc/ssl/certs/cacert.pem’\n\n*   sudo\
    \ postconf -e ‘smtpd_tls_loglevel = 1’\n\n*   sudo postconf -e ‘smtpd_tls_received_header\
    \ = yes’\n\n*   sudo postconf -e ‘smtpd_tls_session_cache_timeout = 3600s’\n\n\
    *   sudo postconf -e ‘myhostname = manon.com’ # You need to change this to your\
    \ host name.\n\n    Finally we need to restart POSTFIX service using the following\
    \ command:"
