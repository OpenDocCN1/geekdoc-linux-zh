    \ will try to go around broken links and other update problems that it may face\
    \ during the process execution.\n\nSo basically, this is the end of part 1 `LINUX`\
    \ Desktop, Server and Cloud Image which has added a general idea of how `LINUX`\
    \ machine is working and how to do various tasks id different area of management\
    \ of a `LINUX` machine.\n\nLet’s Move Around to Part 2.\n\n# 2 Linux Infrastructure\n\
    \n## 2.1 Installing DNS, DHCP, and Kerberos\n\nLets walk through the installation\
    \ of `BIND9` which is the DNS Package Name on `UBUNTU`.\n\nInstalling `BIND9`\
    \ is using this command:\n\n```bash\nsudo apt-get install bind9\n```\n\nRunning\
    \ this command will give the output with confirmation as figure 2.1 shows:\n\n\
    ![](image/Image1101.jpg)\n\nWhen you press `Y` and hit enter key on your keyboard\
    \ the installation will continue until finished and you will get to the `bind`\
    \ configuration process to get everything up and running.\n\nTo configure `bind\
    \ 9` we need to run the following command:\n\n```bash\nsudo nano /etc/bind/named.conf.options\n\
    ```\n\nYou will be editing this file, please find a line of text containing `forwarders`:\n\
    \n```text\nforwarders{\n00.00.00.00;\n}\n```\n\nPlease change the number between\
    \ brackets from the current IP address to your IP address. In my case, my IP address\
    \ is `192.168.0.2`.\n\nSo the `forwarders` section becomes like this:\n\n```text\n\
    forwarders{\n192.168.0.2;\n}\n```\n\nNow, you need to enter the following command\
    \ to edit another file called `named.conf.local`:\n\n```bash\nsudo nano /etc/bind/named.conf.local\n\
    ```\n\nThen, what you need to do is changing adding the following entries or changing\
