    \ sensitive data about updating and upgrading packages of your operating system.\n\
    \n## 1.11 Updates, Upgrades and Distributions Upgrades\n\nUpdating your machine\
    \ is not a hard task unless you do not have much programs and packages installed\
    \ on it because `LINUX` tries to update packages that you install beside the operating\
    \ system packages that is installed already with the operating system initial\
    \ installation.\n\nYou can update your system by using this command:\n\n```bash\n\
    sudo apt-get udpate\n```\n\nThe output of this command is a part of the output\
    \ shown before in the section `Basic LINUX Commands` `#Image7|graphic`.\n\nYou\
    \ can upgrade your `LINUX` system using this command:\n\n```bash\nsudo apt-get\
    \ upgrade\n```\n\nThe output of this command is also a part of the output shown\
    \ before in the section `Basic LINUX Commands` `#Image7|graphic`.\n\nYou can upgrade\
    \ your `LINUX` distribution (only) means that you will upgrade within the same\
    \ distribution versions but not to the newest distribution using the following\
    \ command:\n\n```bash\nsudo apt-get dist-upgrade\n```\n\nThe output of this command\
    \ is also a part of the output shown before in the section `Basic LINUX Commands`\
    \ `#Image7|graphic`.\n\nOf course you can get around problems while performing\
