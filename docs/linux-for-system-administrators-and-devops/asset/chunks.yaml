    # Introduction


    This book is dedicated for LINUX engineers, system administrators and devops who
    can use the materials illustrated in this book in most of their daily tasks during
    work.


    It can transform you from basic-novice LINUX related engineer or an engineer with
    no-experience in LINUX environments to an experienced and advanced LINUX professional.


    ![](image/Image960.jpg)


    # 1 Linux Desktop, Server and Cloud Image


    ## 1.1 What is Linux?


    LINUX is a community open source operating system developed by LINUS TORVALDS
    under the model of free and open source software development and distribution.


    LINUX was originally developed for Intel® x86 Architecture.


    The LINUX operating system was intended for mainframe computers and large-scale
    server systems, but now it is running on desktop machines, tablets, and smart
    phones.


    LINUX Distributions are based on 6 distributions:


    1. Debian Based

    2. Gentoo Based

    3. Pacman Based

    4. RPM-Based

    5. Slackware Based

    6. Independent


    Most of the book material is dependent on LINUX DEBIAN UBUNTU and as the time
    of writing this book on version 15.04.


    Honestly I have choose this distribution because it is the most supportive and
    popular distribution and flavor of all the LINUX operating system distributions
    and ranked number 1 across the LINUX family.


    ## 1.2 Linux GUI and Desktop Machines


    If you are comparing LINUX to other operating systems, yes, it has a Graphical
    User Interface or GUI, so it can be easy for non-professional computer scientists
    and engineers to use, yes it is usable by regular non-computer-professional end-users.


    You can switch between desktops, browse folders, share files and do most of the
    basic regular usage on it every day.


    You can manipulate folders, files, create images, browse the Internet, etc.


    You can also create a network of computers, share printers and files, you can
    create print servers, make word processing, and you can operate the machine easily
    as you want to do any task during your working day, and even at home, or on your
    phone, it can now manage your phone calls, and you can use it on your tablet to
    create and send e-mails, browse the Internet and more…


    ![](image/Image967.jpg)


    ## 1.3 Linux Servers and Clusters


    LINUX servers are machines intended for servicing other types of computers and
    devices like desktops, tablets, and mobile phones.


    It can also manage your storage devices, network devices, and any machine that
    is capable of being connected to the computer infrastructure.


    The focus of the study of this book is to do server-client infrastructure and
    management of LINUX environment containing desktop, tablet, mobile and server
    machines.


    ![](image/Image976.jpg)


    Server Distribution Versions of LINUX are equipped with a terminal screen as the
    user interface screen and mostly does not contain any graphical user interface
    for the sake of security and performance.


    We will talk about what is the terminal screen in chapter VI customizing LINUX
    shell and you will gain more information about the shell environment and basic
    shell commands.


    You can take a look around you to get to notice what are the capabilities of servers
    and what can the server do for you and your environment.


    For example if you look at the mail services like your company mail service, your
    free service provider that provide mail services for free over the Internet or
    for profit.


    The mail server is used to save all the mail messages that you send, receive and
    you partially write and save on a large storage media precisely allocated for
    mail messages, attachments, drafts etcetera and specialized for the privacy of
    every user using user account authentication and authorization with security mechanisms.


    Another example of the server-client environment is when you use your drive account
    on any cloud storage provider or you use a mapped network drive on your company’s
    environment, this is simply a storage server with an `FTP`, `SFTP` protocols installed
    on a server machines and mapped to network drives on your working machine.


    A sample server-client environment infrastructure can be illustrated in figure
    1.1.


    ![](image/Image984.jpg)


    **Figure 1.1** Shows a Sample Network Infrastructure Environment


    This infrastructure contains regular PC computers, laptops, tablets, mobiles,
    printers, scanners, ISP wireless device, modem, storage router software, storage
    tapes, cluster, workstation, etcetera.


    The client here in this infrastructure is represented by the PC, laptop, scanner,
    printer, and tablet devices and server is represented by the cluster, storage
    router, tapes, and workstation.


    There are also network mediums that transfer data between devices like the wireless
    device in the middle and the modem device at the bottom of the cluster.


    ## 1.4 Linux Cloud Images and Virtual Machines


    LINUX cloud images are minimized versions of LINUX distributions working with
    minimal configuration options and features optimized for cloud environments.


    The minimization of LINUX cloud images is for performance and disk occupation,
    which will also allow the user to get rid of idle features that do not fit the
    environment the user is intending the build like example if the user is building
    a web server environment, the user will have only to install the features of the
    web server environment without the need to have all other LINUX features.


    LINUX cloud images have a terminal user interface and does not include any graphical
    user interface in it.


    LINUX cloud images are built on the same distribution flavors that we mentioned
    earlier in the section named Linux Desktop?


    Cloud images are used to be deployed into virtual machines and you can also deploy
    complete LINUX images on virtual machines.


    You can use Cloud Images to deploy it on cloud operating systems like `OpenStack`
    and `AWS` (Amazon Web Services) `EC2` (Elastic Compute Cloud) or other cloud provider
    companies.


    Cloud images can be in 32bit and 64bit architectures based on the processor of
    the hardware you are using, you can install the suitable cloud image on the suitable
    virtual machine you have assigned on that hardware processor.


    Cloud images for example can be downloaded from the following URLs:


    `https://cloud-images.ubuntu.com/`


    `https://aws.amazon.com/marketplace/ref=mkt_ste_amis_redirect?b_k=291`


    These links are not permanent and if you found a change within these links, you
    can search for cloud images over the Internet to download any of these images.


    We will talk about virtual machines later in a topic called LINUX virtual machines.


    ## 1.5 Linux Distributions and Flavors

