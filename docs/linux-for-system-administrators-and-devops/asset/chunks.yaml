    # 面向系统管理员与 DevOps 的 Linux


    面向系统管理员与 DevOps 的 Linux

    第 1 版

    © 2015 Mostafa Abd-ElHamid Atwa & [bookboon.com](http://bookboon.com)

    ISBN 978-87-403-1137-2


