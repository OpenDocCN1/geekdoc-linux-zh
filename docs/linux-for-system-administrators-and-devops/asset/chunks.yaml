    ## 5.2 Working with Openstack Keystone


    First thing we will learn about `keystone` is the authentication and authorization.


    We will create a project, user name and password, create a role, and add the user
    to the role as follows:


    To create a project using the terminal type in the following command:


    ```bash

    sudo openstack project create --description ‘New Project’ --os-username=admin
    --os-password=INSTALLATIONPASSHERE --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin
    manon

    ```


    You will end up with a screen like the following figure 5.3


    ![](image/Image1289.jpg)


    To create a user using the terminal type in the following command:


    ```bash

    sudo openstack user create --project admin --password PASSWORDHERE manon --os-username=admin
    --os-password=INSTALLATIONPASSHERE --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    When running this command, we will be presented with the following screen of confirmation
    as the following figure 5.4:


    ![](image/Image1298.jpg)


    This way we have created a new user into our openstack service and we can now
    login in with the new credentials that we have created.


    Point your browser to the previous URL as follows:


    - [http://localhost/](http://localhost/)

    - [http://manon.com/](http://manon.com/)

    - [http://127.0.0.1/](http://127.0.0.1/)


    Then fill in the user name and password that you have used in the previous command
    and you are good to go.


    To disable the user, we can execute the following command:


    ```bash

    sudo openstack user set manon --disable --os-username=admin --os-password=INSTALLATIONPASSHERE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    To list users, we can execute the following command:


    ```bash

    sudo openstack user list --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin
    --os-username=admin --os-password=INSTALLATIONPASSHERE --os-auth-url=http://192.168.0.2:5000/
    --os-project-name=admin

    ```


    ![](image/Image1309.jpg)


    **Figure 5.5** shows the users that we have including the user that we have created
    highlighted in black background color.


    To enable the user that we have disabled, we need to execute the following command
    as follows:


    ```bash

    sudo openstack user set manon --enable --os-username=admin --os-password=INSTALLATIONPASSHERE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    To delete a user, we can execute the following command as follows:


    ```bash

    sudo openstack user delete manon --os-username=admin --os-password=INSTALLATIONPASSHERE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    To create a role, we can execute the following command as follows:


    ```bash

    sudo openstack role create rolename --os-username=admin --os-password=INSTALLATIONPASSHERE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    ![](image/Image1322.jpg)


    **Figure 5.6** show the output of the previous command as follows:


    To add the user to the role, we can execute the following command:


    ```bash

    sudo openstack role add --user manon --project manon manonrole --os-username=admin
    --os-password=INSTALLATIONPASSPHRASE --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    The output of the previous command is the same as the output of the figure 5.6.


    To disable a project, you can execute the following command as follows:


    ```bash

    sudo openstack project set manon --disable --os-username=admin --os-password=INSTALLATIONPASSPHRASE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    To enable a project, you can execute the following command as follows:


    ```bash

    sudo openstack project set manon --enable --os-username=admin --os-password=INSTALLATIONPASSPHRASE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    To update the name of the project, we can execute the following command:


    ```bash

    sudo openstack project set manon --name manonnew --os-username=admin --os-password=INSTALLATIONPASSPHRASE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    To show the details of the project, we can execute the following command:


    ```bash

    sudo openstack project show manon --os-username=admin --os-password=INSTALLATIONPASSPHRASE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


    To delete a project, we can execute the following command:


    ```bash

    sudo openstack project delete manon --os-username=admin --os-password=INSTALLATIONPASSPHRASE
    --os-auth-url=http://192.168.0.2:5000/ --os-project-name=admin

    ```


