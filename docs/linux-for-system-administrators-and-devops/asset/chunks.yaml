    # 3 Security in Linux


    ## 3.1 Installing SSH


    `SSH` server is used to connect to your machine using secured socket layer with
    encryption mechanisms like using key pairs for private and public.


    The concept of private and public key pairs are for use as follows:


    The private key stays on the destination machine in a standard encryption format
    and usually `SHA-256` encryption mechanism alongside with `SHA-2` and `RSA` which
    is the basic encryption mechanisms.


    To install your SSH server, follow the next steps:


    ```bash

    sudo apt-get install openssh-server

    ```


    Next, we install `openssh-client` for complete client functionality.


    ```bash

    sudo apt-get install openssh-client

    ```


    To generate key-pairs, we need to issue the following commands:


    ```bash

    ssh-keygen -t rsa

    ssh-copy-id mostafa@manon.com

    ```


    Then we give enough privileges to our keys directory to make sure that everything
    is secured.


    ```bash

    chmod 600 .ssh/authorized_keys

    ```


    If you want to access your shell using a web browser, we need to install the following
    package and make some edits and configurations as follows:


    ```bash

    sudo apt-get install ajaxterm

    sudo sed -i ''s:PasswordAuthentication.*:PasswordAuthentication yes:'' /etc/ssh/sshd_config

    ```


    Next, we restart our service using the following command:


    ```bash

    sudo service ssh restart

    ```


    Now, open your browser and point to your machine using the following URL as follows:


    `http://manon.com:8022/`


    replacing `manon.com` with your own IP, or DNS String that you used on your DNS
    installation machine, and you can also use `localhost` instead.


    Type in your user name, then hit enter key on your keyboard.


    Type In your password and hit enter key on your keyboard.


    You of course enter the user name and password of your own operating system’s.


