    Figure 4.1 shows the output of listing the interfaces command.


    We can also get a list of the currently available network interfaces using the
    following command which will give us more details about every interface.


    ```bash

    ip addr

    ```


    ![](image/Image1234.jpg)


    Figure 4.2 Shows the output of listing the interfaces in more details.


    Now, we need to configure our network adapters as follows:


    ```bash

    sudo vi /etc/network/interfaces

    ```


    If you want to configure you network adapter to use a static IP address, then
    we need to add the following lines to the file that we are editing as follows:


    ```text

    auto eth0

    iface eth0 inet static

    address 192.168.0.2

    netmask 255.255.255.0

    network 192.168.0.1

    broadcast 192.168.0.255

    gateway 192.168.0.1

    dns-nameservers 192.168.0.1

    ```


    ![](image/Image1242.jpg)


    Figure 4.3 shows the configuration settings above that we have to apply to our
    network adapter.


    Then we need to restart the networking as follows:


    ```bash

    sudo ifdown -a && sudo ifup -a

    ```


    This way, we have configured our wired networking adapter to use a static IP address
    that we assigned.


    ## 4.2 Wireless Networking in Linux


    To start working with your wireless network adapter, we need to list the adapters
    to get to know the adapter name that we will use by executing the following command:


    ```bash

    sudo ls /sys/class/net

    ```


    Or in more details, we can issue the following command as follows:


    ```bash

    ip addr

    ```


    In my case the wireless adapter name is called `wlan0`.


    In most systems on LINUX machines, this is the default name for the wireless adapter
    that you work with, and if you have installed more that one adapter to your machine,
    you will find them named `wlan1`, `wlan2`, `wlan3`, etcetera.


    We need to issue the following command to get to edit our networking interfaces
    and adjust an static IP address as follows:


    ```bash

    sudo vi /etc/network/interfaces

    ```


    Now we edit the file by adding these lines of configuration as follows:


    ```text

    auto wlan0

    iface wlan0 inet static

    address 192.168.0.2

    netmask 255.255.255.0

    network 192.168.0.2

    broadcast 192.168.0.255

    gateway 192.168.0.2

    dns-nameservers 192.168.0.2

    ```


    Now press `CTRL + X` to save the file, confirm using the same path and name.


    Now we need to restart the network adapter as follows:


    ```bash

    sudo ifdown -a && sudo ifup -a

    ```


    Or we can use the following:


    ```bash

    sudo service network-manager restart

    ```


    Or


    ```bash

    sudo service NetworkManager restart

    ```


    ## 4.3 Network Manager in Linux


    To manage your network manager we need to do the following:


    ```bash

    sudo service network-manager start

    sudo service network-manager stop

    sudo service network-manager restart

    sudo service NetworkManager start

    sudo service NetworkManager stop

    sudo service NetworkManager restart

    ```


    The first 3 commands are used to start, stop, then re-start the service in some
    UBUNTU LINUX distributions and FEDORA distributions.


    The last 3 commands are used to start, stop, then re-start the service in some
    other UBUNTU distributions only.


    If you are using cloud images in UBUNTU or FEDORA, or what ever the distribution
    you are using is, you can install the network manager service as follows:


    ```bash

    sudo apt-get install network-manager

    ```


    To install the indicator on GNOME distributions, you can use the following command
    as follows:


    ```bash

    sudo apt-get install network-manager-gnome

    ```


    ## 4.4 Monitoring Your Network in Linux


    If you want to install bandwidth monitoring tool, we will go through the installation
    of `bandwidthd` with graphs as follows:


    ```bash

    sudo apt-get install bandwidthd

    ```


    When you finish, we need to link the installation to our web server as follows:


    ```bash

    sudo ln -s /var/lib/bandwidthd/htdocs /var/www/bandwidth

    ```


    We can restart the apache service after all to complete the process as follows:


    ```bash

    sudo service apache2 restart

    ```


    When finished, we have everything now working by pointing to the following URL:


    [http://manon.com/bandwidthd/](http://manon.com/bandwidthd/)


    ![](image/Image1249.jpg)


    Figure 4.4 shows the console of the network bandwidth monitoring tool.


    ## 4.5 Scanning Your Network in Linux


    1st thing that we need to do is to know what is port scanning and IP scanning
    on the network as follows:


    Port scanning is a way to know what are the opened ports for every device that
    we perform the scan on.


    IP scanning, is a way to know what are the IP addresses that are up and running
    on my network.


    This is done as follows:


    We need to install `nmap` service protocols on your UBUNTU LINUX machine as follows:


    ```bash

    sudo apt-get install nmap

    ```


