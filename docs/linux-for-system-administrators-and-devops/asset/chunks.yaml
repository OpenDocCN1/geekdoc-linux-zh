    This command does not give any output or text indicating success but in case of
    failure, you will be notified with a notice indicating failure with reason according
    to the specific service you are managing.


    In my case I have `apache2` installed on my distribution and I have started, stopped,
    and restarted it in these 3 commands.


    The following section will be containing useful links on how to work with LINUX
    shell.


    [https://help.ubuntu.com/community/UsingTheTerminal](https://help.ubuntu.com/community/UsingTheTerminal)


    [http://www.fedorafaq.org/basics/](http://www.fedorafaq.org/basics/)


    ## 1.8 Basics in Shell Programming


    Shell programming is a kind of programming language specified for LINUX machines
    to make specific tasks related to your LINUX operating system’s environment.


    In this section we need to be familiar with programming and how to use the LINUX
    shell to make a shell script that is containing some tasks for the terminal to
    do.


    Let us start by getting to know what is programming:


    Programming is a set of instructions and control and structure statements written
    in order for the machine to understand and perform. It must be in a standard syntax
    format so the machine can understand it. It must be sequenced one after another
    and you much check which one of the statement to be performed first, second, third
    etcetera to make the computer achieve the task you need it to do.


    First we need to identify what is a shell script file and how can we create one
    of these files, then list our commands that does a specific task into this file,
    then run this file in a terminal window as follows:


    1. `touch helloworld.sh`

    2. `nano helloworld.sh`

    3. `echo “Hello World"`

    4. Press `CTRL + X` and then type `y` then hit enter key on your keyboard.

    5. `sh helloworld.sh`


    This will give the output Hello World in your screen on the terminal window.


    What we did now is a kind of shell script file containing one single command that
    tells the computer to output the sentence Hello World.


    * First we created a file called `helloworld.sh` using the command `touch helloworld.sh`

    * Second we edited the file using a program called `nano` using this command `nano
    helloworld.sh`

    * Third we added one line into this file telling the computer to output a Hello
    World sentence to the screen using the `echo` command in terminal by the use of
    this command `echo “Hello World"`

    * Fourth we saved the file using `CTRL + X` on your keyboard and confirming by
    typing `Y`, then pressing enter to use the same file name and directory.

    * Finally, we executed this script using `sh` command and pointing to the file
    name that we created in the previous steps using this command `sh helloworld.sh`
    and gave us the output as the following figure 1.11 shows us:


    ![](image/Image1070.jpg)


    This way you have created a file into a shell script, entered a command in it
    and executed this command. You can perform the previous steps with a list of commands
    under each other into this file after executing the `nano` command and starting
    editing the shell script file.


    Let us make a loop that iterate with a condition:


    Loops are used to make the computer do a task or a punch of tasks when a condition
    is met and stops when the condition is not met as follows:


    1. `touch iterationofdays.sh`

    2. `nano iterationofdays.sh`

    3. `i=1`

    4. `weekdays=”Mon Tue Wed Thu Fri"`

    5. `for day in $weekdays`

    6. `do`

    7. `echo “Weekday $day"`

    8. `done`

    9. Press `CTRL + X` on your keyboard, follow it by `Y`, then press enter to exit.

    10. `sh iterationofdays.sh`


    In this example we did a series of commands that will be illustrated in the following
    points:


    First: We created our shell script file using the `touch` command as we did in
    the previous example.

    Second: We edited the file using `nano` editor.

    Third: We inserted the variable called `i` and gave it the default value of `1`.

    Fourth: We created a list called `weekdays` and added values of week days separated
    by spaces, and enclosed with double quotation marks.

    Fifth: We started a `for` statement to process the iteration that will be conditioned
    with 1 condition to loop until the end of the list that we have created in the
    fourth step.

    Sixth: We started instructing the computer to do something as long as the `for`
    statement in step five is looping using the `do` command.

    Seventh: We gave some orders to the computer to output the day name in the command
    we gave it to the screen.

    Eighth: We ended the commands we gave the computer to do by using `done` keyword.

    Ninth: We have closed and saved the shell script file that we created in the first
    step.

    Tenth: We executed the file using the command `sh iterationofdays.sh`


    ![](image/Image1078.jpg)


    **Figure 1.12** shows the output of the script that we have created and procedures
    we did above.


    Now that we need to know a little more about what we added in the file we created:


    The variable is a place in memory that we can save data on and the name variable
    because we can change the data stored in it to any value that we want. We use
    `$` dollar sign to call the variable that we have created and use it in any statement
    in the script.


    ## 1.9 Installation Commands and Packages Configurations


    Installation commands may vary according to the target program or package that
    you want to install. The following commands examples can be used to install different
    packages and programs:


    `sudo apt-get install apache2`


    This command will make you install `apache2` web server on your machine.


    `sudo java -jar`


    This command will make you install a jar type file.


    `sudo sh netbeans.sh`


    This command will make you install a shell type file on the terminal. These commands
    can also vary according to the file place you install and examples are as follows:


    `sudo sh /home/username/Downloads/netbeans.sh`


    In case you have downloaded the file from the Internet on your machine and the
    file is now located for example:


    `/home/username/Downloads/filename.sh`


    Some shortcuts can be put into practice while using the LINUX terminal as follows:
    If you want to directly access the Downloads default directory in your LINUX machine,
    you can simply type `~/Downloads/filename.sh`. This way you eliminated the use
    of `/home/username/` by using `~/` only. Another shortcut example is by using
    `~/Desktop/filename.sh` you are accessing a file located on your desktop directory.


    ```bash

    ls -l /path/to/directory/

    ```


    An example that shows how this command works with its output will be in the next
    figure 1.13.


    ![](image/Image1085.jpg)


    One more thing to go, is when you perform a `java -jar` file installation or execution,
    you need first to have java sdk installed on your machine and this can be done
    using the following command:


    `sudo apt-get install openjdk-8-jre`


    And if you want the Oracle version of java, you can use the following commands
    to install it:


    `sudo add-apt-repository ppa:webd8team/java -y`


    `sudo apt-get update`


    `sudo apt-get install oracle-java8-installer`


    Be very careful when installing these commands and examine exactly what to install
    before performing the installation steps.


    ## 1.10 Working with Repositories


    Working with repositories on UBUNTU terminal is easy and configurable. You can
    add a repository, manage repositories and use these repositories in your installations
    and system update.


    Repositories are assemblies of installation and update files grouped together
    in one place with a unique URL that can be bound to your system using a file called
