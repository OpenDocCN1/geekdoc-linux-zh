  trans: "\n在之前的过程中，会出现一些提示，例如密码、国家名称、用户文件名以及城市和州值。你当然可以使用你自己的值，或者针对你特定需求的值。\n\n当你完成所有操作后，浏览你的\
    \ `https://manon.com/` 服务器并确认你的安全异常，以将网站添加到信任站点，直接点击地址 `https://manon.com/` 旁的小图标，你会发现打开了一个窗口，点击\
    \ `more information`（更多信息），如果默认未启用，则转到 `security`（安全）选项卡，然后点击 `view certificate`（查看证书），你将发现证书已填充了你的协议以及服务器名称\
    \ `manon.com`，如下图 3.3 所示：\n\n![](img/Image1196.jpg)\n\n### 3.3 使用 SELinux 和访问控制\n\
    \n`SELINUX` 是一个用于启用和禁用服务并通过你的系统控制端口号和访问的网关。\n\n在 UBUNTU LINUX 机器上安装 SELINUX，我们使用以下命令：\n\
    \n```bash\nsudo apt-get install selinux\n```\n\n有 2 个主要选项来配置 SELINUX 软件包，我们将按照如下方式介绍如何启用每一个一个：\n\
    \n*   **Permissive**：`manon.com` 最常用的选项，启用此选项的命令是：\n    ```bash\n    sudo sed\
    \ -i ‘s/SELINUX=.*/SELINUX=permissive/’ /etc/selinux/config\n    ```\n*   **Enforcing**：最安全的选项，启用此选项的命令是：\n\
    \    ```bash\n    sudo sed -i ‘s/SELINUX=.*/SELINUX=enforcing/’ /etc/selinux/config\n\
    \    ```\n\nUBUNTU 默认已安装的另一个防火墙软件包是：\n\n`UFW`\n\n正如我们过的，`UFW` 是默认安装的，我们将按照如下方式介绍它的配置和操作命令：\n\
    \n要启用该服务，我们需要运行以下命令：\n\n```bash\nsudo ufw enable\n```\n\n要对你正在使用的服务（如 `HTTP` 或\
    \ `HTTPS`）上启用或禁用端口，我们需要执行以下命令：\n\n```bash\nsudo ufw allow 8080 #启用 HTTP 端口 8080\n\
    sudo ufw allow 80 #启用 HTTP 端口 80\n```\n\n之前的端口号 8080 和 80 是 UBUNTU 用于 `HTTP` 协议的主要使用端口号。如果你禁用了其中一个端口，你将无法从其他机器浏览\
    \ `http://localhost/` 或 `http://manon.com/`。\n\n```bash\nsudo ufw deny 8080 #禁用\
    \ HTTP 端口 8080\nsudo ufw deny 80 #禁用 HTTP 端口 80\nsudo ufw allow 22 #在端口 22 上启用\
    \ HTTPS\nsudo ufw deny 22 #在端口 22 上禁用 HTTPS\n```\n\n你也可以按照如下方式删除你创建的规则：\n\n```bash\n\
    sudo ufw delete deny 22\nsudo ufw delete deny 80\nsudo ufw delete deny 8080\n\
    ```\n\n你也可以使用以下命令通过服务名调用 `allow`、`deny` 服务：\n\n```bash\nsudo ufw deny http\nsudo\
    \ ufw deny https\nsudo ufw deny Samba\n```\n\n最后，我们可以使用以下命令启用和禁用服务：\n\n```bash\n\
    sudo service ufw start\nsudo service ufw stop\nsudo service ufw restart\n```\n\
    \n### 3.4 连接到 Linux 机器\n\n在下一节中，我们将按照如下学习学习使用 `SSH` 协议连接到你的 LINUX 机器：\n\n```bash\n\
    ssh localhost\n```\n\n我们使用此命令在本地网络内本地连接到机器。\n\n如果我们从服务提供商处获得了静态 IP 地址服务并将其应用于我们的\
    \ LINUX 连接，我们就能使用以下命令从任何地方连接到我们的机器：\n\n```bash\nssh 192.168.0.2\n```\n\n将 `192.168.0.2`\
    \ 替换为你将获得的 ISP IP 地址。\n\n你也可以使用我们在为你的 UBUNTU LINUX 机器安装 DNS 时使用的 DNS 字符串连接到你的机器：\n\
    \n```bash\nssh manon.com\n```\n\n你需要一个用户名和密码来访问机器，如果你安装了像我们在 `#Creating Certificates\
    \ using SSL` 章节中提到的公钥-私钥对（该章节中包含了我们创建的密钥文件）。\n\n要使用密钥文件，我们需要执行以下命令：\n\n```bash\n\
    ssh -l mostafa -i /etc/ssl/certs/manon.com.pem manon.com\n```\n\n或者\n\n```bash\n\
    ssh -l mostafa -i /etc/ssl/certs/manon.com.pem localhost\n```\n\n输入你在创建文件时使用的短语（pass\
    \ phrase）。\n\n输入你用于登录系统的操作系统密码。\n\n然后，你将看到如图 3.4 所示的屏幕。\n\n![](img/Image1205.jpg)\n\
    \n通过这种方式，你可以远程控制你的机器并在上面执行任何任务。\n\n我们现在已经涵盖了如何使用 `SSH` 服务连接到你的机器的话。\n\n### 3.5\
    \ 在 Linux 中保护你的 Web 服务器\n\n为了在 LINUX 中保护你的 Web 服务器，我们需要检查一个清单，我们在进入 Web 服务器安全主题时将按照如下方式进行：\n\
    \n1.  在进入 Web 服务器安全主题时，按照如下方式执行连接。\n2.  使用以下工具进行 `HTTP` 和 `HTTP` 扫描：\n    *  \
    \ `Httrack`\n    *   `Burp Suite`\n    *   `Web Scarab`\n3.  部署应用时使用 `.htaccess`\
    \ 文件，通过以下命令禁用索引：\n    ```bash\n    sudo nano /var/www/html/.htaccess\n    ```\n\
    \    在文件中添加以下代码：\n    ```\n    Options -Indexes\n    ```\n    使用 `CTRL + X` 保存文件。当你打开\
    \ Web 服务器上的空目录时，将得到拒绝访问错误。\n\n### 3.6 在 Linux 中保护你的数据库服务器\n\n为了保护我们安装的 `MySQL`\
    \ 数据库服务器，我们需要按照如下方式进行以下安装和配置：\n\n输入以下命令：\n\n```bash\nmysql_secure_installation\n\
    ```\n\n在提示时输入 `root` 密码。\n\n在 `change password` 提示中，你可以根据环境输入 `Y` 或 `N` 来更改。\n\
    \n在 `remove anonymous users` 提示中，输入 `Y` 并按回车。\n\n在 `disallow root remotely` 提示中，为了安全选择\
    \ `Y`，不要让同一网络中的其他机器登录数据库服务器。\n\n在 `remove test database and access to it` 提示中，选择\
    \ `Y` 并按回车。\n\n现在在 `reload privilege table`，选择 `Y` 并按回车。\n\n![](img/Image16.jpg)\n\
    \n注意，在我们配置结束时，你将看到如图 3.5 所示的屏幕。\n\n但注意在我的状态下，我允许了远程登录尝试以便远程访问服务器，这种选项适用于云镜像安装，如果你在云环境中使用\
    \ UBUNTU，你将使用此选项，因为你要远程连接到数据库服务器。\n\n### 3.7 保护你的 Linux 虚拟机\n\n保护 LINUX 虚拟机与保护\
    \ LINUX 机器完全一样，只是需要考虑到虚拟机被远程访问。因此，在进行安全措施时，你需要考虑到公共访问多于本地访问。\n"
