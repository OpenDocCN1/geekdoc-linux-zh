  trans: "\n这些服务中的任何一个都可以通过允许或拒绝它被添加到我们正在使用的防火墙规则中。\n\n![](img/Image1164.jpg)\n\n\
    要拒绝一个端口号，可以使用以下命令：\n\n```bash\nsudo ufw deny 53\n```\n\n这将拒绝端口 53，且上一个命令的结果与我们为启用相同端口而发布的命令完全相同。\n\
    \n如果你想通过特定协议允许或拒绝特定端口，需要执行以下命令：\n\n```bash\nsudo ufw allow 53/tcp\n```\n\n此命令将使端口\
    \ 53 仅允许使用 TCP 协议。\n\n如果你想禁用相同协议的相同端口，需要按照如下方式执行命令：\n\n```bash\nsudo ufw deny\
    \ 53/tcp\n```\n\n还有一点，如果你想在任何端口上启用 UDP 协议，可以执行以下命令：\n\n```bash\nsudo ufw allow\
    \ 53/udp\n```\n\n如果你想禁用任何端口的 UDP 协议，可以执行以下命令：\n\n```bash\nsudo ufw deny 53/udp\n\
    ```\n\n最后，如果我们想完全禁用防火墙，我们需要执行以下命令：\n\n```bash\nsudo ufw disable\n```\n\n现在，我们管理了我们的\
    \ LINUX 防火墙，并学习了启用、禁用和管理端口，以在特定端口上接受或拒绝特定协议，或者普遍接受或拒绝所有端口协议。\n\n## 2.4 安装和管理 Web\
    \ 服务器\n\nWeb 服务器用于在你的机器上托管网站。\n\n如果你想安装最流行的 Web 服务器，那么就是 Apache，它可以服务 PHP、MySQL、Java\
    \ 甚至 Python 页面。\n\nApache® Web 服务器在世界 Web 服务器统计排名中位第一，这就是为什么我们将重点关注在我们的 LINUX\
    \ 机器上安装一个名为 LAMP 的服务器栈。\n\nLAMP 的缩写代表 LINUX、Apache、MySQL 和 PHP。\n\n要在你的 UBUNTU\
    \ LINUX 机器上安装 LAMP 栈，我们将执行以下命令：\n\n```bash\nsudo apt-get install tasksel\n```\n\
    \n当此执行完成后，我们需要执行如下命令来安装栈本身：\n\n```bash\nsudo tasksel install lamp-server\n```\n\
    \n此命令将要求我们之前安装的 `tasksel` 安装 `lamp-server` 软件包。\n\n系统将提示你输入密码并为你的 MySQL 数据库服务器确认。\n\
    \n之后，当你完成上一个命令的操作步骤后，我们将安装一个名为 PHPMyAdmin 的 GUI 来管理我们的数据库服务器。\n\nPHPMyAdmin 是一个用于管理\
    \ MySQL 数据库、执行查询、管理用户等功能的强大工具。\n\n要安装 PHPMyAdmin，我们需要执行如下命令：\n\n```bash\nsudo\
    \ apt-get install phpmyadmin\n```\n\n执行该命令将引导你输入 MySQL 密码，请输入与你在上一个命令中安装 LAMP\
    \ 服务器时相同的密码，你也可以为管理系统账户使用相同的密码。\n\n你可以在被提示时选择 yes，允许 PHPMyAdmin 在 MySQL 服务器上创建它自己的数据库。\n\
    \n通过这种方式，我们安装了 LAMP 栈，以及一个我们可以在我们的 UBUNTU LINUX 机器上托管应用程序的 Web 服务器。\n\n为了测试我们的安装，我们需要创建一个名为\
    \ `index.php` 的文件并将此文件放在以下目录：\n\n`/var/www/html/`\n\n要创建此文件，我们需要执行以下命令：\n\n```bash\n\
    sudo nano /var/www/html/index.php\n```\n\n这将在终端窗口中打开一个文本编辑器以添加文本。\n\n我们需要在文件中添加如下所示代码：\n\
    \n```php\n<?php\necho phpinfo();\n```\n\n然后，我们需要按下 `CTRL + X` 关闭文件，通过输入“Y”然后按回车键来确认更改，以确认路径和文件名。\n\
    \n完成所有要求后，我们需要打开浏览器并将地址指向以下 URL：\n\n`http://localhost/`\n\n这将使你看到下面的图 2.9，它将包含你\
    \ PHP 安装的所有服务器配置设置。\n\n![](img/Image1172.jpg)\n\n如果你遇到任何问题，请查阅*附录 F* 排除你的 LINUX\
    \ Web 服务器故障。\n\n## 2.5 安装和管理邮件服务器\n\n在安装我们的 DNS 之后，我们将按照以下步骤在 DNS 上集成我们的邮件服务器：\n\
    \n1. 我们需要在我们的 UBUNTU LINUX 系统上安装名为 `POSTFIX` 的软件包。\n   通过执行以下命令完成安装：\n   ```bash\n\
    \   sudo apt-get install postfix\n   ```\n   你可以简单接受默认，因为我们将重新配置该软件包。\n\n2. 我们需要按照如下方式重新配置软件包以应用特定的环境数据：\n\
    \   ```bash\n   sudo dpkg-reconfigure postfix\n   ```\n   你将看到一系列屏幕，你需要应用如下设置：\n\
    \   * Internet（互联网站点）。\n   * 当前配置中没有请求。\n   * 系统邮件名将是 `manon.com`，你需要将其更改为安装 DNS\
    \ 时选择的域名。\n   * `mostafa` #将其调整为你的用户名。\n   * `manon.com, localhost, localhost.localdomain`\
    \ #在安装 DNS 时将 `manon.com` 调整。\n   * No。\n   * `192.168.0.2` #将其调整为你的 IP 地址。\n\
    \   * Yes\n   * 0\n   * +\n   现在我们需要运行以下系列命令来继续配置过程：\n\n```bash\nsudo postconf\
    \ -e ‘home_mailbox = Maildir/’\nsudo postconf -e ‘mailbox_command =’\nsudo postconf\
    \ -e ‘smtpd_sasl_local_domain =’\nsudo postconf -e ‘smtpd_sasl_auth_enable = yes’\n\
    sudo postconf -e ‘smtpd_sasl_security_options = noanonymous’\nsudo postconf -e\
    \ ‘broken_sasl_auth_clients = yes’\nsudo postconf -e ‘smtpd_recipient_restrictions\
    \ = permit_sasl_authenticated,permit_mynetworks,reject_unauth_destination’\nsudo\
    \ postconf -e ‘inet_interfaces = all’\nsudo apt-get install postfix-tls sasl2-bin\
    \ libsasl2 libsasl2-modules\nsudo nano /etc/default/saslauthd\n```\n或更改：\n* `START=yes`\n\
    * `MECHANISMS=\"pam\"`\n\n```bash\nsudo nano /etc/postfix/sasl/smtpd.conf\n```\n\
    添加：\n* `pwcheck_method: saslauthd`\n\n```bash\nsudo nano /etc/postfix/main.cf\n\
    ```\n添加：\n* `smtpd_sasl_auth_enable = yes`\n* `smtpd_sasl_security_options = noanonymous`\n\
    * `broken_sasl_auth_clients = yes`\n* `smtpd_recipient_restrictions = permit_sasl_authenticated,permit_mynetworks,reject_unauth_destination`\n\
    * `inet_interfaces = all`（等待，原文有一些重叠/混乱的步骤，我将遵循提供文本的逻辑）。\n\n*基于提供文本的修正：*\n文本列出了：\n\
    - `sudo nano /etc/default/saslauthd` -> 添加 `START=yes`, `MECHANISMS=\"pam\"`\n\
    - `sudo nano /etc/postfix/sasl/smtpd.conf` -> 添加 `pwcheck_method: saslauthd`\n\
    - `sudo nano /etc/postfix/main.cf` -> 添加 `smtpd_sasl_auth_enable = yes`, `smtpd_sasl_security_options\
    \ = noanonymous`, `broken_sasl_auth_clients = yes`, `smtpd_recipient_restrictions\
    \ = permit_sasl_authenticated,permit_mynetworks,reject_unauth_destination`, `inet_interfaces\
    \ = all`。\n"
- fmt: "\n```bash\nsudo service postfix restart\n```\n\nNext, we need to install the\
    \ following packages to complete the security of our POSTFIX mail Server as follows:\n\
    \n```bash\nsudo apt-get install libsasl2-2 sasl2-bin libsasl2-modules\n```\n\n\
    Next, we need to edit the following values in a file `/var/spool/postfix/var/run/saslauthd`:\n\
    \n```bash\nsudo nano /var/spool/postfix/var/run/saslauthd\n```\n\nRemove the hash\
    \ `#` sign before the line `START=yes`.\n\nAdd the following lines next to the\
    \ previous line that we have edited now as follows:\n\n```bash\nPWDIR=\"/var/spool/postfix/var/run/saslauthd\"\
    \nPARAMS=\"-m ${PWDIR}\"\nPIDFILE=\"${PWDIR}/saslauthd.pid\"\n```\n\nAfter that\
    \ we need to change the `OPTIONS` line at the end of the file to be:\n\n```bash\n\
    OPTIONS=\"-c -m /var/spool/postfix/var/run/saslauthd\"\n```\n\nNext we need to\
    \ execute the following commands:\n\n```bash\nsudo dpkg-statoverride --force --update\
    \ --add root sasl 755 /var/spool/postfix/var/run/saslauthd\n```\n\nIf the previous\
    \ command produces a warning or error, ignore the error because the directory\
    \ reported will be created automatically in the next steps.\n\nNext, we need to\
    \ execute the following command:\n\n```bash\nsudo ln -s /etc/default/saslauthd\
    \ /etc/saslauthd\n```\n\nFinally, we need to restart our service:\n\n```bash\n\
    sudo service saslauthd restart\n```\n\nTo test our installation, we need to execute\
    \ the following command:\n\n```bash\ntelnet localhost 25\n```\n\nOR\n\n```bash\n\
    telnet manon.com 25 # Replacing manon.com with your own DNS string.\n```\n\nThen\
    \ execute the following command after your connection starts:\n\n```bash\nehlo\
    \ localhost\n```\n\nOR\n\n```bash\nehlo manon.com\n```\n\nThis way, we have completed\
    \ our installation or our mail server and let us integrated into our LAMP Web\
    \ Server and Send our First HTML formatted Web Mail.\n\nExecute the following\
    \ command to edit the `PHP.ini` configuration file as follows:\n\n```bash\nsudo\
    \ nano /etc/php5/apache2/php.ini\n```\n\nSearch in the file for an entry called\
    \ `sendmail_path` and change it to `sendmail_path = \"/usr/sbin/sendmail -t -i\"\
    `.\n\nNow execute the following command to create a file called `sendMail.php`\
    \ to send your first mail using the following command:\n\n```bash\nsudo nano /var/www/html/sendMail.php\n\
    ```\n\nEnter the following content into your file as follows:\n\n```php\n<?php\n\
    $to = \"mailofpersontosendto@hotmail.com, anothermailtosendto@gmail.com\";\n$subject\
    \ = \"HTML Mail Subject\";\n$message = \"\n<html>\n<head>\n<title>Title of the\
    \ E-Mail</title>\n</head>\n<body>\n<p>This is an HTML E-Mail Message !!!</p>\n\
    <table>\n<tr>\n<th>Column 1 Header</th>\n<th>Column 2 Header</th>\n</tr>\n<tr>\n\
    <td>Content of Column 1 in HTML E-Mail</td>\n<<td>Content of Column 2 in HTML\
    \ E-Mail</td>\n</tr>\n</table>\n</body>\n</html>\n\";\n$headers = \"MIME-Version:\
    \ 1.0\" . \"\\r\\n\";\n$headers .= \"Content-type:text/html;charset=UTF-8\" .\
    \ \"\\r\\n\";\n$headers .= 'From: mostafa@manon.com' . \"\\r\\n\";\n$headers .=\
    \ 'Cc: manonmanager@manon.com' . \"\\r\\n\";\nif(mail($to,$subject,$message,$headers)){\n\
    \    echo 'Mail have been send successfully as desired.';\n}else{\n    echo 'We\
    \ have encountered some error, please consult <br />Appendix G Troubleshooting\
    \ your LINUX Mail Server';\n}\n```\n\nNow point your browser to the following\
    \ URL:\n\n`http://manon.com/sendMail.php`\n\nOR\n\n`http://localhost/sendMail.php`\n\
    \nAfter visiting this URL, you will be noticed if the mail message has been sent\
    \ or not.\n\nIf you experienced any error, please consult: \n\n`Appendix G` Troubleshooting\
    \ your LINUX Mail Server.\n\nNow, we have completely installed LINUX mail server\
    \ and you can enjoy sending mails.\n\n## 2.6 Installing and Managing FTP, SFTP\n\
    \nLet us try installing our file server. Installing your file server will make\
    \ you have access to save, update, and delete file within your machine using `FTP`,\
    \ `SFTP` protocols as follows:\n\n```bash\nsudo apt-get install vsftpd\n```\n\n\
    When finishing your installation, please run the following command to configure\
    \ your FTP server settings:\n\n```bash\nsudo nano /etc/vsftpd.conf\n```\n\nWhen\
    \ finished, edit the following lines and make it identical:\n\n```ini\nanonymous_enable=NO\n\
    local_enable=YES\nwrite_enable=YES\nchroot_local_user=YES\n```\n\nSave and Exit\
    \ by Pressing `CTRL X`, and then Press Enter Key on Your Keyboard.\n\nNow, create\
    \ a directory as follows:\n\n```bash\nsudo mkdir /home/manon/files #changing manon\
    \ with your operating system’s user name.\n```\n\nThen, we need to change ownership\
    \ of the:\n\n```bash\nsudo chown root:root /home/manon\n#changing manon with your\
    \ operating system’s user name\n```\n\nNow, we need to restart the service by\
    \ executing the following command:\n\n```bash\nsudo service vsftpd restart\n```\n\
    \nNow, connect to your FTP server by executing the following command from the\
    \ terminal as follows:\n\n```bash\nsudo ftp localhost\n```\n\nWe use the user\
    \ name of the operating system that we have used while doing the previous tasks,\
    \ then we put the password of that account.\n\nWhen finished, type `exit` on the\
    \ terminal to terminate your ftp session.\n\nNow, let us install the FTP client\
    \ application as follows:\n\n```bash\nsudo apt-get install filezilla\n```\n\n\
    When installed, start your filezilla application and put in the host field: `ftp://manon.com/`\n\
    \nUser Name: `manon`  \n\nPassword: `*******`\n\nWhen finished, click connect\
    \ and now, you have connected to your file server.\n\nYou can create directories\
    \ on your server, create files, and manage it.\n\nNow, let us map a network drive\
    \ on a Windows® machine as follows:\n\nOpen start menu and type map network drive\
    \ in the search box.\n\nIn the location field, type the FTP server name which\
    \ is `ftp://manon.com/`.\n\nWhen prompted, type the user name and password we\
    \ just mentioned earlier.\n\nTo install the secured layer of FTP which is `SFTP`,\
    \ we need to execute the following command:\n\n```bash\nsudo a2ensite default-ssl.conf\n\
    ```\n\nThen we need to execute the command:\n\n```bash\nsudo service apache2 restart\n\
    ```\n\nThen, we need to install ssh:\n\n```bash\nsudo apt-get install ssh\n```\n\
    \nAfter finishing the installation, we will be able to connect to the server using\
    \ SFTP using the URL:\n\n`sftp://manon.com` # changing manon.com with your DNS\
    \ name.\n\nNow, let us use our tablet device:\n\nI will use an iOS enabled tablet\
    \ device to browse store applications and find an application called FTPManager®.\n\
    \nAfter installing your application on your iPad or iPhone, you will find a `+`\
    \ sign at the main menu of the application used to add a server\n\nWait, the main\
    \ menu of the application used to add a server\n\nType the server address `ftp://manon.com/`\
    \ or `sftp://manon.com`\n\nChoose the protocol ftp or sftp\n\nType the user name\
    \ and password for your account at the bottom.\n\nNow, you are connected to your\
    \ file server and you are ready to move, and add files to your server.\n\nYou\
    \ can also download files from the server.\n\nNow, we covered working with our\
    \ file server installation, configuration.\n\n## 2.7 Installing and Configuring\
    \ SAMBA and Managing Shares\n\nSAMBA is another way to install a file server.\
    \ To install SAMBA, we need to go through the following steps:\n\n```bash\nsudo\
    \ apt-get install samba\n```\n\n```bash\nsudo nano /etc/samba/smb.conf\n```\n\n\
    Add the following lines at the end of the file:\n\n```ini\n[share]\ncomment =\
    \ Ubuntu File Server Share\npath = /srv/samba/share\nbrowsable = yes\nguest ok\
    \ = yes\nread only = no\ncreate mask = 0755\n```\n\nExecute the following commands\
    \ to create the share directory:\n\n```bash\nsudo mkdir -p /srv/samba/share\n\
    ```\n\nWhen finished, give the shared directory suitable permissions as follows:\n\
    \n```bash\nsudo chown nobody:nogroup /srv/samba/share/\n```\n\nExecute the following\
    \ command to apply changes of configuration:\n\n```bash\nsudo service smbd restart\n\
    sudo service nmbd restart\n```\n\nThis way, we have configured and installed our\
    \ SAMBA File Server and Created a Share, so if you browse any Windows OS machine\
    \ network tab to browse the computers of the network, find that our server’s share\
    \ appears to all windows users.\n\n## 2.8 Installing GIT Server\n\nYou got a project\
    \ and you want to create a local GIT server instead of pushing to the public GIT\
    \ control systems, here is a solution to create your own git server so you can\
    \ push your project locally on your machine with your team members.\n\nExecute\
    \ the following commands:\n\n```bash\nsudo apt-get install git\n```\n"
