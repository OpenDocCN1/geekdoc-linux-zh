    As mentioned earlier in a previous topic called #What is LINUX?|outline we can
    tell that LINUX flavors do not have different architectures or performance variations,
    but they vary in the distribution’s commands to perform various installations
    for example:


    UBUNTU®: We use the following command to update the operating system


    ```bash

    sudo apt-get update

    ```


    FEDORA®: We use the following command to update the operating system


    ```bash

    sudo yum install update

    ```


    And in other distributions it may vary a little bit than these commands but all
    of these commands are performing system update.


    It may also vary in the package name (program name) you are installing on different
    distributions like for example:


    Installing MySQL database server on fedora may differ than installing it on UBUNTU®
    as follows:


    UBUNTU®: We use the following command to install MySQL server


    ```bash

    sudo apt-get install mysql-server

    ```


    FEDORA®: We use the following command to install MySQL server


    ```bash

    sudo yum install mysql-community-server

    ```


    So the package name has changed from UBUNTU® repositories to FEDORA® repositories
    from `mysql-server` in UBUNTU® to `mysql-community-server` in FEDORA®


    And finally you need to be adopting your command to the distribution you are working
    on.


    If you are installing a package (program), you need to know what is the exact
    package name of the distribution you are working on or performing this command
    on or if you are performing operating system optimization command, you also need
    to know each command on each distribution and execute the command which is suitable
    for the distribution.


    ## 1.6 Customizing Linux Shell


    Some users need to customize the LINUX shell when performing tasks.


    The LINUX terminal or shell window looks like figure 1.2


    ![](image/Image991.jpg)


    We can perform command on this terminal window, and as you can see it, it is much
    similar like a minimal text editor for entering the installing and system manipulation
    commands.


    This window can be customized according to the user needs like changing the background
    color and text color.


    This window also can run commands as administrator power by using “`sudo` keyword
    or by switching to the super user for the session you are currently working on
    by using the command `sudo -s` which will transfer you to the sudo privilege of
    the root user and you will notice that you will be using `root@youroscomputername`
    .


    ![](image/Image999.jpg)


    **Figure 1.3** shows you how this command is performed on an UBUNTU distribution.


    This way, you can perform all the commands using power user (sudoer) or administrator
    or root user.


    ## 1.7 Basic Linux Commands


    ```bash

    sudo apt-get update --fix-missing && sudo apt-get upgrade --fix-missing && sudo
    apt-get dist-upgrade –fix-missing

    ```


    And you will see the output of this command in figure 1.4


    ![](image/Image1008.jpg)


    **Figure 1.4** shows the update and upgrade process of UBUNTU LINUX distribution.


    This command is used to completely update your LINUX distribution from using LINUX
    repositories that is belonging to the country where you are using the distribution.


    **Notice that we use the “`--fix-missing` key to switch to alternative packages
    in case of any failure, and you can also use this key with other commands if possible.**


    If you want to use the main server repositories instead of country specific repositories,
    please run the following command:


    ```bash

    sudo nano /etc/apt/sources.list

    ```


    The output of the command will be as what figure 1.5 shows


    ![](image/Image1015.jpg)


    You need to go up and down using arrow keys on your keyboard to reach to the line
    that you want to edit.


    Locate all the country area in each line in my file here it is “eg.” in every
    line and remove it completely. Example `deb [http://eg.archive.ubuntu.com/ubuntu/]
    vivid-updates main restricted` to `dev htp://archive.ubuntu.com/ubuntu/ vivid-updates
    main restricted` and you are good to go.


    After performing these changes to the file, press `CTRL+X` on your keyboard to
    close the file. Notice that it is prompting you to save the file and choose the
    file name. You can just press `Y` on your keyboard and hit enter to save to the
    same file name and same directory.


    Continuing basic commands for your LINUX environment, we can also get to know
    other commands which are very useful in every day system administration tasks.


    To get all the running programs and processes on your LINUX distribution type
    the following command in the terminal window:


    ```bash

    ps aux | less

    ```


    The output of the command will be as what figure 1.6 shows:


    ![](image/Image1023.jpg)


    You can go to the next line by pressing `ENTER` key on your keyboard for every
    line, then you can exit using the `CTRL + Z` to quit this command output screen
    and go back to the terminal original prompt.


    One of the commands that also will be one of the most favorable is how to create
    a SWAP file used to strengthen the computer performance and LINUX will use it
    as RAM as follows:


    ```bash

    sudo dd if=/dev/zero of=/swapfile bs=1G count=4

    ```


    This command will make a SWAP file on the root directory of your LINUX distribution
    that will contain 4 portions `[count=4]` and will be divided into 4 partitions,
    every partition will be 1 Giga Byte `[bs=1G]`.


    The output of the command will be as figure 1.7 shows.


    ![](image/Image1031.jpg)


    This way, you have created the SWAP file and the next step is to use it and make
    it available for your LINUX distribution (inform your LINUX distribution) to use
    it.


    You need to adjust the privileges and ownership of the file we have created by
    using the following command:


    ```bash

    sudo chmod 600 /swapfile

    ```


    This command does not have any output and it will return you to the prompt again
    without any text to appear. In this command we have used `chmod` which is short
    for change mode of the file and we used `600` as an aliased number for assigning
    privileges to the file and make it only available to the operating system authorized
    users who can manipulate this kind file, then we gave it the file path using `/swapfile`
    directive.


    After all we use this command to make the swap file:


    ```bash

    sudo mkswap /swapfile

    ```


    The output of the command is shown in figure 1.8 confirming that the command has
    been successfully executed.


    ![](image/Image038.jpg)


    We finally turn on the SWAP file using this command:


    ```bash

    sudo swapon /swapfile

    ```


    And this command does not show any output or text confirming the command success.


    But we can confirm that the file has been successfully allocated by using this
    command:


    ![](image/Image1048.jpg)


    Now the command output confirming that the file has been created successfully
    and working as required.


    Continuing our basic commands section, we still can perform some terminal tasks
    that can be very useful in everyday LIN administrator tasks:


    How to manage services on LINUX machine and how to kill a process that you do
    not need after listing all the processes and identifying which process you need
    to kill will be covered in the following section.


    By running this command you will be able to identify all the processes running
    on a LINUX machine and will identify every process using the process id as follows:


    ```bash

    sudo swapon -s

    ```


    By running this command, you will get a list of the processes with the process
    id as `PID` and figure 1.9 shows the output of this commands


    By identifying the process using the `PID` you can use the following command to
    terminate this process


    ```bash

    sudo kill -9 PID

    ```


    ![](image/Image1055.jpg)


    As shown in figure 1.10, you need to replace the `PID` with the ID of the process
    you want to top, in my case I have stopped `mysqld` using the `PID` `14846`.


    ![](image/Image1062.jpg)


    Finally you can use the following command to start, stop and restart any service
    that you want


    ```bash

    sudo service apache2 start


    sudo service apache2 stop


    sudo service apache2 restart

    ```

