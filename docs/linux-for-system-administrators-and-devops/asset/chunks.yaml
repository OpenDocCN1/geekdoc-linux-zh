- fmt: "\nEvery service of these can be added to the rules of the firewall we are\
    \ using by allowing or denying it.\n\n![](image/Image1164.jpg)\n\nTo deny a port\
    \ number, we can use the following command:\n\n```bash\nsudo ufw deny 53\n```\n\
    \nThis will deny port 53, and the result of the previous command will be identical\
    \ the command that we issued for enabling the same port.\n\nIf you want to allow\
    \ or deny a specific port with a specific protocol, you need to issue the following\
    \ command:\n\n```bash\nsudo ufw allow 53/tcp\n```\n\nThis command will make port\
    \ 53 enabled for use with the TCP protocol only.\n\nIf you want to disable the\
    \ same port with the same protocol, you need to need execute the following command\
    \ as follows:\n\n```bash\nsudo ufw deny 53/tcp\n```\n\n1 more thing to go, is\
    \ if you want to enable a UDP protocol with any port, you can execute the following\
    \ command:\n\n```bash\nsudo ufw allow 53/udp\n```\n\nAnd if you want to disable\
    \ a UDP protocol with any port, you can execute the following command:\n\n```bash\n\
    sudo ufw deny 53/udp\n```\n\nFinally, if we want to disable the firewall completely,\
    \ then we need to execute the following command:\n\n```bash\nsudo ufw disable\n\
    ```\n\nNow, we have managed our LINUX firewall and learn how enable, disable,\
    \ and manage ports to accept or deny specific protocol on a specific port number\
    \ or accept or deny all port number protocols in general.\n\n## 2.4 Installing\
    \ and Managing Web Servers\n\nWeb servers are used to host websites on your machine.\n\
    \nIf you want to install the most popular web server, then it is Apache that can\
    \ serve PHP, MySQL, Java, and even Python pages.\n\nApache® web server is ranked\
    \ #1 in the world ranking statistics of web servers, this is why we will focus\
    \ on installing a server stack on our LINUX machine called LAMP.\n\nThe LAMP abbreviation\
    \ stands for LINUX, Apache, MySQL, and PHP.\n\nTo install the LAMP stack on your\
    \ UBUNTU LINUX machine, we will execute the following commands:\n\n```bash\nsudo\
    \ apt-get install tasksel\n```\n\nWhen this execution is finished, we need to\
    \ execute the command that will install the stack itself as follows:\n\n```bash\n\
    sudo tasksel install lamp-server\n```\n\nThis command will order `tasksel` that\
    \ we installed before to install `lamp-server` package.\n\nYou will be prompted\
    \ to enter the password, and confirm it for your MySQL database server.\n\nAfter\
    \ that, when you finish walking through the procedures of the previous command,\
    \ we will install a GUI for managing our database server called PHPMyAdmin.\n\n\
    PHPMyAdmin is a powerful tool that is used to manage MySQL databases, execute\
    \ queries, manage users and more.\n\nTo install PHPMyAdmin, we need to execute\
    \ the following command as follows:\n\n```bash\nsudo apt-get install phpmyadmin\n\
    ```\n\nExecuting the command will lead you to enter your MySQL password, please\
    \ enter the same passwords that you entered when installing the LAMP server in\
    \ the previous command, and you can also use the same password for the management\
    \ system account.\n\nAnd you can permit the PHPMyAdmin to create it own database\
    \ on MySQL server by selecting yes when prompted.\n\nThis way we have installed\
    \ our LAMP stack, and a web server that we can use to host applications on our\
    \ UBUNTU LINUX machine.\n\nTo test our installation, we need to create a file\
    \ called `index.php` and place this file in the following directory:\n\n`/var/www/html/`\n\
    \nTo create this file, we need to execute the following command:\n\n```bash\n\
    sudo nano /var/www/html/index.php\n```\n\nThis will open a text editor on the\
    \ terminal window to add some text.\n\nWe need to add to following lines of code\
    \ to our file as follows:\n\n```php\n<?php\necho phpinfo();\n```\n\nThen we need\
    \ to press `CTRL + X` to close the file and confirm the changes by typing “Y”\
    \ and then hitting enter on the keyboard to confirm the path and file name.\n\n\
    After finishing all the requirements, we need to open a browser and point the\
    \ address to the following URL:\n\n`http://localhost/`\n\nThis will make you see\
    \ the following figure 2.9 which will contain all the server configuration settings\
    \ for your PHP installation.\n\n![](image/Image1172.jpg)\n\nIf you face any problem,\
    \ please consult the *Appendix F* Troubleshooting your LINUX Web Server.\n\n##\
    \ 2.5 Installing and Managing Mail Servers\n\nAfter installing our DNS, we will\
    \ integrate our Mail server on this DNS as the following procedures will be about:\n\
