    ## 3.2 Creating Certificates using SSL


    In the next section, we will go through creating self signed certificates and
    signing it.


    We will also walk through self signing your certificates and attaching your certificates
    with your web server as an example of using these certificates as follows:


    We need to execute the following command to create a key as follows:


    openssl genrsa -des3 -out server.key 2048


    Note that server.key can be changed to any file name that you have used.


    Now we assign RSA enctryption to our key file and put the result out to an insecure
    file as follows:


    openssl rsa -in server.key -out server.key.insecure


    Now we create our secure key as follows:


    mv server.key server.key.secure


    Then we move the key as follows:


    mv server.key.insecure server.key


    Now, we create certificate signing request using the following command:


    openssl req -new -key server.key -out server.csr


    Now, submit all the files to a signing authority like Comodo® as an example of
    a certificate signing issuing organization on the following URL:


    [https://www.instantssl.com/free-ssl-certificate.html](https://www.instantssl.com/free-ssl-certificate.html)


    Complete the wizard, submit your certificate key, verify your DNS by hosting the
    requested file over HTTP or HTTPS, and also there are several other options to
    do that.


    Create a self signed certificate as follows:


    openssl x509 -req -days 365 -in server.csr -signkey server.key -out server.crt


    sudo cp server.crt /etc/ssl/certs


    sudo cp server.key /etc/ssl/private


    sudo mkdir /etc/ssl/CA


    sudo sh -c “echo ‘01’ > /etc/ssl/CA/serial”


    sudo touch /etc/ssl/CA/index.txt


    After running the previous commands which is creating key files and related directories,
    we need to edit in the configuration of our operating system openssl package configuration
    file as follows:


    sudo nano /etc/ssl/openssl.cnf


    We need to find the following values and edit them carefully as follows:


    dir = /etc/ssl/


    database = $dir/CA/index.txt


    certificate = $dir/certs/cacert.pem


    serial = $dir/CA/serial


    private_key = $dir/private/cakey.pem


    If you made changes to the files names that we created above in the previous commands,
    you also need to apply the same changes to this configuration file to be in parallel.


    Now, we need to request the the self signed root certificate as follows:


    openssl req -new -x509 -extensions v3_ca -keyout cakey.pem -out cacert.pem -days
    3650


    Also, we need to move the key files the default directory as follows:


    sudo mv cakey.pem /etc/ssl/private/


    sudo mv cacert.pem /etc/ssl/certs/


    Now we sign the certificate as follows:


    sudo openssl ca -in server.csr -config /etc/ssl/openssl.cnf


    Now there is a new file in the following directory called /etc/ssl/newcerts/01.pem,
    we need to rename this file to our needs and move it to the following directory
    with the new name as follows:


    sudo mv /etc/ssl/newcerts/01.pem /etc/ssl/certs/manon.com.pem


    Now, we need to configure our https server to use this certificate that we have
    created using the following:


    sudo nano /etc/apache2/sites-available/default-ssl.conf


    Let’s search and edit the entries as follows:


    SSLCertificateFile /etc/ssl/certs/manon.com.pem


    SSLCertificateKeyFile /etc/ssl/private/server.key


    When we edit the file it will be looking much like the following figure 3.2 as
    follows:


    ![](image/Image1188.jpg)


    Now we can press CTRL + X to close this screen and press enter key on the keyboard
    to save everything.


    When finished, we need to restart our apache server by issuing the following command
    as follows:


    sudo service apache2 restart'
