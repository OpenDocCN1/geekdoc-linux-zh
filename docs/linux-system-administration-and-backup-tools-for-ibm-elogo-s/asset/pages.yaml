  md: "Once all your system configuration files are set up you should have a working\
    \ network. You should reboot your network to verify that the system is loading\
    \ the files properly on boot.\n\n# 4.4.4 Enabling remote services to your server\n\
    \nIn order to enable certain types of remote access to your system, Linux may\
    \ require some additional configuration to be done.\n\nThe /etc/services file\
    \ lists which kind of services you are going to make available on which ports.\
    \ A partial listing of the file is shown in Figure 74. You will notice that each\
    \ service is assigned a number. You will note that FTP is assigned 21, and telnet\
    \ is assigned 23.\n\n```\n#partial listing of /etc/services\n#\ndiscard     9/tcp\
    \      sink null\ndiscard     9/udp      sink null\nsystat     11/tcp     users\n\
    daytime     13/tcp\ndaytime     13/udp\nnetstat    15/tcp\ngsqd        17/udp\n\
    mp         18/tcp      # message send protocol\nmp         18/udp      # message\
    \ send protocol\nchargen    19/tcp      ttytst source\nchargen    19/udp     \
    \ ttytst source\nftp-data   20/tcp\nftp         21/tcp\nfsp        21/udp    \
    \  fspd\nssh         22/tcp      # SSH Remote Login Protocol\nssh         22/udp\
    \      # SSH Remote Login Protocol\ntelnet      23/tcp\n# 24 - private\n# 26 -\
    \ unassigned\nsmtp        25/tcp      mail\ntime        37/tcp      timserver\n\
    time        37/udp      timserver\nrlp         39/udp      # resource location\n\
    ameserver  42/tcp      name\n                            # IEN 116\n(The remainder\
    \ of file is not displayed)\n```\n\nFigure 74. /etc/services file partial listing\n\
    \nHowever, you cannot do a telnet or any type of remote access into a system unless\
    \ the service is activated. It is controlled by files in the /etc/inetd.directory."
