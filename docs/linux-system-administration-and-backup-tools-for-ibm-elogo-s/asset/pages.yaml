    the recovery.


    > Note

    For recovery you will use your master and incremental backups.


    +   - When all files are backed up, press a key to get back to the main window.
    All the file systems will be then synchronized LILO will be set up and executed.


    +   - Before you reboot, switch to a console 2 with Alt+F2 and execute the following
    commands to check fstab file for correct entries for your system:

    mount /dev/sdb6 /mount

