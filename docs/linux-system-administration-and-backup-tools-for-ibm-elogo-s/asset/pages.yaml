  md: "# 5.4 Adding removing software packages\n\nTurboLinux uses the RPM (RedHat\
    \ Package Manager) system to manage software packages. RPM uses a database to\
    \ store information about the packages installed, the file that package installs,\
    \ and other relevant information needed for package management. Although several\
    \ books have been written to explain the complexity and flexibility available\
    \ with RPM, we will discuss it as a method to easily install and remove programs.\n\
    \n# 5.4.1 Adding additional packages from the CD-ROM with turbopkg\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_151_0.png)\n\
    \nFigure 144. Source Media window\n\nTurboLinux provides a configuration tool\
    \ for the RPM system called turbopkg. Typing the command turbopkg opens the window\
    \ you see in Figure 144. Here you have three options for the source of the RPMs\
    \ you would like to upgrade or install. We will start by choosing Local Filesystem\
    \ or CD-ROM.\n\nAfter making the options of the Local Filesystem or CD-ROM selection,\
    \ you are presented the options of selecting User Base Path or Select Individually.\
    \ Note the following information:\n\n+   * User Base Path. This is the option\
    \ you will almost always use.\n* Select Individually. This option allows you to\
    \ point to stored comp files, RPMs, and RPM headers that do not reside in the\
    \ same directory. If you choose this option, you should be aware that during a\
    \ local install of packages, turbopkg looks for three different pieces:\n  a.\
    \ The comps file defines the categories (for example, \"Editors,\" \"Basic Mail\
    \ Services,\" etc.) turbopkg uses to organize the available"
  merge: -1
