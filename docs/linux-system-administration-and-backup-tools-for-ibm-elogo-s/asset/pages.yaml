    To create savepack(s), click the savepacks button or click Tapes -> Savepacks
    on the menu. You will see a window like Figure 244:'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_248_0.png)


    Click the **new** button to enter input mode. A window similar to Figure 245 appears.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_248_1.png)


    Chapter 7. Backup applications install and setup 237'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Enter the name of the new savepack and click the OK button to return to the
    updated Savepacks management window (see the list of savepacks on the right side
    of the window). A window like Figure 246 appears:


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_249_0.png)


    Figure 246. Updated Savepacks management window


    Now, you select the data that should be saved in every created savepack. Move
    the cursor over the name of the savepack you want to select the data and click
    the left mouse button. You can see the selected savepack.


    Now, move the cursor over the list of trees to back up (left listbox of this window),
    click the right mouse button and select Navigator in the upcoming pull-down menu.
    You will see a window similar to Figure 247.


    To navigate through the directory tree of a system shown in this window, move
    the cursor over the system you want to select and double-click the left mouse
    button. A window similar to Figure 248 appears.


    Double-clicking the left mouse button over a directory symbol opens this directory
    and shows the content of this directory.


    238 Linux System Administration and Backup for IBM @server xSeries and Netfinity'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Clicking once with the left mouse button in the checkbox to the left of a directory
    name or file name toggles the select/unselect status of this item. All selected
    items will be inserted in the list of trees to back up for the selected savepack.
    If you select a directory, the checkbox changes the color totally. If you only
    select a selection of the items in a directory, the checkbox changes color only
    in the right half of the checkbox.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_250_0.png)


    Figure 247. Navigator window'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_251_0.png)


    To return to the savepacks management window, click the OK button. You will see
    a window similar to Figure 249.


    240 Linux System Administration and Backup for IBM @server xSeries and Netfinity'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_252_0.png)


    The basic configuration steps are now done.


    Read the Administrator''s Manual/ to get more information about the advanced possibilities
    of Arkeia.


    # 7.3.3 Interactive backup


    To start an interactive backup, click the interactive backup button or click Backup>Interactive
    Backup on the menu. A window like Figure 250 appears.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_253_0.png)


    Figure 250. Interactive backup start window


    In the comboboxes Savepack, Drivepack and Pool deype fields, choose which data
    sets should be backed up on which tapes and on which tape drives.


    In the Type box, choose between Total Backup and Incremental Backup and between
    Standard and Continuous.


    In the Tape Strategy field, choose between New tapes and Complete existing tapes.


    In the Valid for field, decide how long the tape(s) for this backup should be
    valid.


    Click the OK button to proceed. A window as in Figure 251 appears.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_254_0.png)


    As the backup process proceeds, the content of this window will change. Most of
    the time, you will see a window like Figure 252.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_255_0.png)


    There are three areas in the window, marked A, B and C in Figure 252, which may
    require your attention:


    In the area A points to, you sometimes see a push button labeled OK. Click this
    button when you have done the action, which was requested in the scroll list area
    C. In the line pointed to B, you see the name of the file that is actually backed
    up.


    You can leave this window by clicking the OK button. The backup process continues
    in the background.


    If you want to connect again to this process or as Arkelia joins it - job, to
    Arkea''s main dialog window as shown in Figure 234. In this window you will see
    a box labeled either “No job running” or “List of jobs”. If you see the text “List
    of jobs” or one or more lines under this box, move the cursor over the'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'line with the job you want to connect to and press the right mouse button.
    pull-down menu as shown in Figure 253.


    | | | On node | Owner | Comment |

    |---|---|---|---|---|

    | Bar | Connect job | 8:10:40 xxxx | root | Full BackUp_01 |


    Figure 253. Connect job pull-down menu


    Move the cursor over the line with the action you will perform and click the left
    mouse button. The requested action will be performed.


    If you chose Stop job, you are asked in a new dialog whether you really want to
    stop this job.


    If you select Connect job, you will see a window similar to Figure 252 again.


    # 7.3.4 Periodic Backup


    To configure your scheme for periodic backups, press the periodic backup button
    or go to Utilities>Periodic Backup on the menu. You will see a window similar
    to Figure 254.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_257_0.png)


    To create a new entry for periodic backup, click the **new** button. You can now
    fill in the fields with the appropriate information. For more details, please
    consult the **Administrator''s Manual.**


    #  7.3.5 Restoration


    To start restoration of data, click the restoration button or click **Restoration
    -> Restoration** on the menu. You will see a window like Figure 255.


    246 Linux System Administration and Backup for IBM @server xSeries and Netfinity'
  merge: -1
  img_proc: true
- pgno: 258
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_258_0.png)


    Clicking with the left mouse button over the checkbox beside an item toggles the
    status of item between selected/not selected. Double-clicking over a symbol for
    a complete system or a directory, you can navigate through the tree of information
    that this backup contains. If you are ready with your selection, click the OK
    button and a window like Figure 256 appears, containing a list of the files or
    directories that will be restored.


    Chapter 7. Backup applications install and setup 247'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_259_0.png)


    Figure 256. List of directories/files to store


    Clicking the OK button in this window opens a new window, shown in Figure 257.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_260_0.png)


    Figure 257. List of tapes used for restoration


    You will see a list of the tape(s) that will be used during restoration. Click
    the OK button to proceed.


    If the correct tape is already loaded to start the restoration with, you will
    see a window like Figure 258.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_261_0.png)


    Figure 258. Restoration''s main window


    If the tape to start with must be mounted, a window like Figure 259 appears.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_262_0.png)


    Perform the action required and click OK to proceed. The appearance of the window
