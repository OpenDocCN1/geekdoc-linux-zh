- pgno: 18
  md: 'This chapter will give you an overview of how to perform the most common administrative
    tasks on a Caldera OpenLinuxServer 2.3 operating system. Most of these tasks can
    be done with the Caldera Open Administration System (COAS), Caldera''s OpenLinux
    graphical-oriented configuration and administration tool. However, you may still
    perform these tasks using the command-line tools.


    > Stop

    Be careful when you are editing configuration files on your own. If you edit configuration
    files with an editor, make sure to maintain the format of the file. If you change
    the format of a configuration file, COAS may not be able to understand the configuration
    information and you cannot use COAS for future configuration.


    # 2.1 Log in to the system


    Before you can use any Linux system you need to log in to the system. Whenever
    you start Caldera OpenLinux, you will see a login window similar to Figure 2.'
  merge: -1
  img_proc: true
