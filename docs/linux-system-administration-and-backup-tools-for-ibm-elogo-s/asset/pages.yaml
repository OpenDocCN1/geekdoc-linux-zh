- pgno: 281
  md: '# # Linux System Administration and Backup Tools for IBM @server xSeries and
    Netinity


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_281_0.png)


    The complete guide for system administration tools and choosing the appropriate
    backup solution for Linux on xSeries and Netinity


    This redbook gives an understanding of the unified system administration incorporated
    in the Caldera OpenLinux, Red Hat, SUSE Linux and TurboLinux operating systems.
    It also provides information on three Linux backup and recovery applications supported
    by these operating systems.


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    Step-by-step basic system administration instructions This redbook provides an
    understanding of Linux system administration and backup at a fairly detailed level,
    to help you increase your Linux skills in both areas quickly and easily.


    Step-by-step basic system administration instructions for Caldera, SUSE, Red Hat,
    and TurboLinux


    # BUILDING TECHNICAL INFORMATIONBASED ON PRACTICAL EXPERIENCE


    This redbook directs you to the available IBM Redbooks of Caldera OpenLinux, Red
    Hat Linux, SUSE Linux and TurboLinux that provide specific global instructions
    to help you plan, install, and configure each operating system on IBM @server
    xSeries and Netinity for satisfactory operation.


    IBM Redbooks are developed by the IBM Technical Support Organization. Experts
    from Partners from around the world create timely technical information based
    on realistic scenarios and recommendations are provided to help you implement
    IT solutions more effectively in your environment.


    Install and configure Arkeia, BRU, and BackupEDGE for Linux


    For more information: ibm.com/redbooks


    SG24-6228-00 ISBN 0738424287'
