- pgno: 192
  md: '# Chapter 7. Backup applications install and setup


    It may seem obvious that backing up and restoring data quickly is critical, but
    many administrators leave this task at the end of the "to do" list until it is
    too late. With the ease of use of the commercially available packages BRU (Enhanced
    Software Technologies), BackupEDGE/RecoverEDGE (MicroLite) or Arkeia (Knox Software),
    there is no need to wait.


    > Note

    We recommend that you do not connect tape devices to the IBM ServeRAID adapter.
    Use a separate SCSI controller for the tape devices.


    # 7.1 BRU


    BRU is a backup and restore utility with significant enhancements over common
    utilities such as tar, cplo, volcopy and dump. BRU is designed to work with most
    backup devices, including cartridge, 44mm DAT, 8mm (Exabyte) and 9-track drive
    devices.


    BRU includes incremental backups, full backups, multivolume archives, distribution
    and updates, error detection and recovery, random access capabilities, file comparisons,
    file overwrite protection, and increased speed over previous versions.


    # 7.1.1 Installing BRU


    Before you begin, need to know the following:


    +   1. The device name of your tape drive. Typically under Linux, this will be
    /dev/st0 for the rewinding and /dev/nst0 for the non-rewinding drive.

    2. The size of your backup medium in megabytes.


    To install BRU from the floppy drive with the tar command, type:


    ```

    cd /tmp

    tar xvf /dev/fd0

    ./install

    ```


    Follow the prompts regarding readme files and licenses, enter your license data
    and your BRU serial number when asked to do so until you come to the following
    window:'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_193_0.png)


    Enter the letter for your backup device and answer the following questions appropriate
    for your device.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_193_1.png)


    182 Linux System Administration and Backup for IBM @server xSeries and Netfinity'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'If you have entered information for all your backup devices, you will be asked
    if you would like to install the X11 interface. Select Y.


    The installation program needs to create an xbru directory. You can select a path
    or accept the default /usr/local/.


    The installation program will install executables in a user-specified directory.
    The default is /usr/local/bin.


    | Note |

    The key configuration file is /etc/brutab. Consult the BRU User''s Guide for advanced
    information. Do not edit unless you know what you are doing. |


    BRU is now installed.


    # 7.1.2 Basic commands


    The basic command structure for BRU is:


    ```

    # bru modes [control options] [selection options] [files]

    ```


    Where bru is the command or program followed by the mode specifying backup, restore,
    or various queries. Control options specify devices and buffer size. Selection
    options control which files or directories to work with. Files is the specified
    target of the bru command.


    # 7.1.3 Basic backup


    To back up a single file /home/ayne/.profile:


    ```

    # bru -c -vvvv -G /home/ayne/.profile

    ```


    To back up the complete directory /home/ayne:


    ```

    # bru -c -vvvv -G /home/ayne

    ```


    To back up the entire system:


    ```

    # bru -c -vvvv -G /

    ```


    # 7.1.4 Basic restore


    To restore a single file /home/ayne/.profile:


    ```

    # bru -x -vvvv -ua -w /home/ayne/.profile

    ```


    To restore the complete directory /home/ayne:'
