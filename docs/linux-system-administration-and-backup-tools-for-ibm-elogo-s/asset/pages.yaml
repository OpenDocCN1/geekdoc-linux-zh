- pgno: 62
  md: '# Chapter 3. Red Hat Linux basic system administration


    There are certain commands and procedures that you will need to maintain your
    Linux system. In this chapter we cover basic Linux command-line administration
    and an introduction to the graphic or menu-driven tool called Linuxconf.


    # 3.1 Finding Linux commands


    When you wish to run or use a command from the command-line prompt, you may not
    know where they are located in the directory structure. You can run most of these
    commands or programs without knowing where they are because your search path includes
    a number of directories that will be searched whenever you try to execute a command
    or run a program. The search path is given by the environment variable $PATH.
    If you want to find out where a command is located, execute the command:


    ```

    where command_name

    ```


    Where command_name is the command you are looking for. For example, you want to
    find the command adduser:


    ```

    adduser

    ```


    You notice that this command is located in the /usr/sbin directory. Many of the
    major administrative commands will be found in the /usr/sbin directory.


    # 3.2 Package management using RPM


    Package management can be done directly with the Red Hat package manager (RPM)
    on the command line. You can do this either from a straight Linux command-line
    prompt, or you can do this from an X-Windows generated by one of the window managers.


    The following table shows some of the most frequently used versions of the rpm
    commands.


    | Command | Description |

    | --- | --- |

    | rpm -q <package> | If package is installed, check version and build number of
    installed package |

    | rpm -qi <package> | Obtain some more information about an installed package
    |'
  merge: -1
  img_proc: true
- pgno: 63
  md: '| Command | Description |

    | --- | --- |

    | rpm -qa | List all installed packages |

    | rpm -qf <filename> | Determine the (installed) package that <filename> belongs
    to |

    | rpm -Uhv <package.rpm> | Update/install the file package.rpm showing a progress
    bar |

    | rpm -F -v ./*.rpm | Update (freshen) all installed packages using the RPM files
    in the current directory |

    | rpm --help | Get help about the different options and parameters |


    More information and options about RPM can be found in the manual page (man rpm),
    and in the RPM how-to http://www.rpm.org. You can also display a short overview
    by running rpm --help.


    # 3.3 User administration


    Linux is a multi-user operating system. To differentiate between the various users,
    each has to log in with a unique user name and password. Each user belongs to
    a primary user group, but he can be a member of other groups (up to 16 groups).
    Each user name is associated with a user ID (UID), which is unique throughout
    the system. The same applies to user group names and group IDs (GIDs).


    Usually each user has a personal home directory. This is space on the file system
    (usually a directory below /home, for example /home/username) which belongs to
    him and where he can store his files (for example, e-mail or text documents).
    Other users generally have no access to the files stored there.


    It is one of the root user''s tasks to add and remove user or group accounts.
    To do this from a menu you can use the program Linuxconf to add, modify or delete
    groups and users. In the next section we will provide details about user administration
    from the command prompt.


    You should carefully consider adding user groups before adding users. Sometimes
    there are concerns about restricting access to some parts of the user system.
    You can do this by creating separate user groups to control access to various
    files and file systems. Also if you are going to be creating a system with many
    users, you should consider creating separate groups'
  merge: -1
  img_proc: true
- pgno: 64
  md: "divided by what they are on the system. You can create an admin group for administrators,\
    \ a db2user group for DB2 users, and so forth. Linux allows you to control access\
    \ to all files and directories by both users, groups, and everyone on the system.\n\
    \nAnother concern in setting up users and groups is what you may want to share\
    \ files with other systems. This can be done by the CD, tape, diskette or similar\
    \ device. You can use the network to share information with NFS, Samba, IPX and\
    \ other network packages. If you use user and group names and characteristics\
    \ that are not the same on all systems doing the sharing, then you can have file\
    \ sharing and access problems.\n\nIf you are creating logins and groups on each\
    \ system separate, it is often best to use a single system where all IDs can be\
    \ created. This system is then used as a reference. It is not necessary that everyone\
    \ actually log into the reference system. It exists only to coordinate ID and\
    \ group creation and to prevent non-standard IDs and groups. A user cannot log\
    \ into the reference system if the password is not enabled. This will prevent\
    \ unauthorized access to the system. Red Hat Linux will automatically create a\
    \ new group for each new user unless you tell it to.\n\nYou might consider network-wide\
    \ user authentication and tracking schemes as NIS, NIS+ and various other network\
    \ administration packages.\n\n# 3.3.1 Adding users\n\nTo add users to the Linux\
