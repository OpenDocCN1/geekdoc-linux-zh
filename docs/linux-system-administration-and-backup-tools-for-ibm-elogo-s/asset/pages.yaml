    # 4.2 Package management using RPM


    Package management can also be done with the Red Hat package manager (RPM) on
    the command line. The following table shows some of the most frequently used commands.


    Table 5. Basic RPM commands


    | Command | Description |

    | --- | --- |

    | rpm -q <package> | If package is installed, check version and build number of
    installed package |

    | rpm -qi <package> | Obtain some more information about an installed package
    |

    | rpm -qa | List all installed packages |

    | rpm -qf <filename> | Determine the (installed) package that <filename> belongs
    to |

    | rpm -Uhv <package>.rpm | Update/Install the file package.rpm showing a progress
    bar |

    | rpm -F -v .*.rpm | Update (freshen) all currently installed packages using the
    RPM files in the current directory |

    | rpm --help | Get some help about the different options and parameters |'
  merge: -1
  img_proc: true
- pgno: 97
  md: '> > Note

    If you install packages using RPM on the command line, make sure to run the script
    SuSEconfig afterwards! Some packages require post-installation maintenance.


    More information and options about RPM can be found in the manual page (man rpm),
    the RPM how-to

    (less /usr/share/doc/howto/en/RPM-HOWTO.txt.gz)


    and on the RPM Web site at http://www.rpm.org. You can also display a short overview
    by running


    rpm --help.


    # 4.3 User and group administration using YaST


    Linux is a multi-user operating system. To differentiate between the various users,
    each user has to log in with a unique user name and password. Each user belongs
    to a primary user group, but they can also be a member of other groups (up to
    16 groups). Each user is named with a user ID (UID), which is also unique throughout
    the system. The same applies to user group names and IDs (GIDs).


    Usually each user has a personal home directory. This is space on the file system
    (usually a directory below /home,/home/username) that belongs to a person and
    where the person can store their personal files (for example e-mail or text documents).
    Other users generally have no access to the files stored in another user''s home
    directory.


    You should carefully consider adding groups before adding users. Sometimes there
    are concerns about restricting access to some parts of the user system. You can
    do this by creating separate groups to control access to various files and filesystems.
    Also if you are going to be a system with many users, you should create separate
    groups divided by what they are on the system. You can create an admin group for
    admins, a db2user group for DB2 users, and so forth. Linux allows you to control
    access to both files and directories by users, groups, and everyone on the system.


    Another concern in setting up users and groups is that you may want to share files
    with other systems. This can be done by CD-ROM, tape, diskette or similar device.
    You can use the network to share information with NFS,'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Samba, IPX and other network packages. If you use user and group names and
    characteristics that are not the same on all systems during the sharing, then
    you can have file sharing and access problems.


    If you are creating logins and groups on each box separately, it is often best
    to use a single system where all your IDs can be created. This system is then
    used as a reference. It is not necessary that everyone actually log into the reference
    system. It only exists to coordinate ID and group creation and to prevent non-standard
    IDs and groups. A user also cannot log into the reference system if the password
    is not enabled. This will prevent unauthorized access to the system. If you want
    to administer a lot of users on different machines, you should consider setting
    up NIS. See Chapter 12, "NIS-Network Information System" or Chapter 13, "LDAP
    - Lightweight Directory Access Protocol" in the IBM redbook, SuSE Linux Integration
    Guide for IBM @xSeries and Netfinity, SG24-5863 for more information about this.


    It is one of the root user''s tasks to add and remove or group accounts. With
    YaST, SuSE provides an easy-to-use tool for user and group administration. To
    use it, log in as the root user and type the command:


    ```

    y --mask user --exit

    ```


    Alternatively you can invoke YaST by simply typing yast and choosing **System
    administration -> User administration.** The following window will appear:'
  merge: -1
  img_proc: true
