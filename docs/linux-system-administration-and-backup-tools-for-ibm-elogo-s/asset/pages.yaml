    \ whose UID is lower than a certain number defined in /etc/login.defs. You will\
    \ also need to specify the -m option if you want to create the home directory.\
    \ Otherwise, it will not be created. System accounts generally have UID values\
    \ between 0 and 99.\n\nlogin\n\nThis is the login name that the user will log\
    \ with. This will need to be unique on the system.\n\n# 3.3.2 Modifying users\n\
    \nYou can modify users with the usermod command:\n\n```\nroot@root:~# usermod\n\
    usage: usermod [-u uid] [-o] [-g group] [-c group...]\n      [-d home [-m] [-s\
