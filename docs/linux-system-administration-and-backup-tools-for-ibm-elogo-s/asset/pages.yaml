    currently used resources (for example, IRQ, IO ports).


    # 5.8 Server Services


    Linux uses a concept of runlevels (0-6) to manage the operation of the system.
    On boot, the system reads the file /etc/initab to determine which runlevel it
    should enter. Then it reads the subdirectories under /etc/rc.d that conform to
    that runlevel. The runlevel directories are:


    +   - /etc/rc.d/rc0.d

    - /etc/rc.d/rc1.d

    - /etc/rc.d/rc2.d

    - /etc/rc.d/rc3.d

    - /etc/rc.d/rc4.d

    - /etc/rc.d/rc5.d

    - /etc/rc.d/rc6.d


    For example, if the runlevel is set to 3, which is the level TurboLinux sets if
    you ask for a text-mode login during the install, the system reads the directory
    /etc/rc.d/rc3.d/ and starts or stops services based on the scripts in that directory.


    The directory contains a number of symbolic links that point to scripts created
    to start, stop, and restart all the services provided by Linux. Looking at the
    directory, you will notice the files look similar. Below are a few examples from
    /etc/rc.d/rc3.d:


    ```

    S0network

    S11port

    S14nfslock

    S15nfs

    ```


    You can see that they conform to the format [K or S]number less than 100[[filename]].
    Each part may be explained as follows:'
  merge: -1
  img_proc: true
- pgno: 176
  md: '* The letter S denotes that this service should be started when entering a
    runlevel. The letter K indicates the services that will be killed when entering
    a runlevel from another runlevel.

    * Services are started in order of the number here, with the lowest numbers being
    first.

    * the name of the script to run. The scripts reside in /etc/rc.d/init.d.


    Runlevels are user configurable, but the conventional assignments in Linux (which
    TurboLinux follow):


    +   * 0 -- Shut down the machine

    * 1 -- Single user mode

    * 2 -- Multiple user mode, but no networking

    * 3 -- Full networking, text mode login

    * 4 -- User configurable

    * 5 -- Full networking, graphical login

    * 6 -- Initiate a warm reboot


    As pointed out earlier, runlevels are user configurable, and TurboLinux provides
    the turboservice to edit the services at run. When you start turboservice, it
    presents you with the following window:


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_176_0.png)


    Figure 17. Service Status Board window


    Note that on this window, runlevels are not mentioned. That is the main screen
    of turboservice runs in the current runlevel. In this case we are running at runlevel
