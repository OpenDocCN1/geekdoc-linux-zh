    \ and /etc/hosts.deny files.\n\nIn the /etc/hosts.allow file, which is shown in\
    \ Figure 76, you see that the only host that is the localhost, which is 127.0.0.1.\
    \ This means you can do a telnet localhost or telnet 127.0.0.1 and that is unless\
