    # 4.5 Network configuration with YaST


    A Linux system in most cases can be connected to one or more networks.

    YaST also offers configuration options to set up your network connection. If

    you need to connect your host to an Ethernet or token-ring network, you can

    use YaST to enter the correct networking parameters. If you did not define

    your network card during the initial installation, or if you added a new network

    card to your system, you first have to define the correct driver for this device.

    From the YaST main menu select System administration -> Integrate

    hardware into system -> Configure networking device. From the

    command line, follow the command to open the network device

    selection window in Figure 99 directly.


    ```

    yast --mask network autoconfig

    ```


