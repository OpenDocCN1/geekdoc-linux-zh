    # # 7.1.11 Listing and verifying archives


    For listing contents of an archive, BRU gives you three options:


    +   1. Header - This option displays the archive header record, which lists the
    label, creation date, version, and serial number. For more information on the
    header, consult *BRU User''s Guide*.

    2. Filenames only - This option displays the on-tape directory. If the archive
    was created without using the -G option, BRU will scan the entire archive to create
    a list of files. You will be prompted before this occurs, as this can be a lengthy
    process.

    3. Full details - This option scans the entire archive for details such as file
    names, permissions, owners, size, modification times, etc. This process can be
    time consuming.


    For verifying archives, BRU gives you two options:'
  merge: -1
  img_proc: true
- pgno: 201
  md: '+   1. Checksum Verification - When archives are written, a checksum is calculated
    for each block of data. The checksum is stored in the header of block. Checksum
    verification will read each block, recalculate the checksum, and compare the checksum
    to the value in the header. Each file will be listed as it is verified, along
    with any errors found. If no errors are found, you have an accurate backup.


    +   2. Compare Verification - BRU compares the files to the archive on the hard
    drive. Any differences, such as modification times, size, or files in the archive
    are nonresident on the hard drive are noted. An end of differences notice will
    be posted when the verification is complete.


