    runlevel 2, you would type the following command:


    ```

    ln -s /etc/rc.d/initd/httpd /etc/rc.d/rc2.d/K15httpd

    ```


    Of course, you could use a number other than 15. We use it here because that is
    the default for the HTTPD service.'
