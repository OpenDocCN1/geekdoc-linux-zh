  md: "```\n# [root@test1 xinetd]# cat telnet\n# default: no\n# description: The telnet\
    \ server serves telnet sessions; it uses \\\n# unencrypted username/password pairs\
    \ for authentication.\nservice telnet\n{\n    flags = REUSE\n    socket_type =\
    \ stream\n    wait = no\n    user = root\n    server = /usr/sbin/telinetd\n  \
