- pgno: 8
  md: '# Preface


    This book gives you an understanding of the unified system administration incorporated
    in the Caldera OpenLinux, Red Hat Linux, SuSE Linux and TurboLinux operating systems.
    It also provides information on three Linux backup and recovery applications supported
    by these operating systems.


    This ebook provides an understanding of Linux system administration and backup
    at a fairly detailed level, to help you increase your Linux skills in both areas
    quickly and easily.


    This ebook also directs you to the available IBM Redbooks of Caldera OpenLinux,
    Red Hat Linux, SuSE Linux and TurboLinux that provide specific global instructions
    to help you plan, install, and configure each operating system on IBM @server
    xSeries and Netfinity for satisfactory operation.


    # The team that wrote this redbook


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_8_0.png)


    Figure 1. The team (left to right) Credle, Holzknecht, Carstensen, Haskins, Gomilsek,
    Davies, (lower) McDaniel'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Raleigh Center.


    Jakob Carstensen is a Technical Support Marketing Specialist in the IBM Software
    Group. His most recent publication was Small Business Suite for Linux Review''s
    Guide. Before joining the IBM Software Group, he worked at the International Technical
    Support Organization center in Raleigh, where he managed residencies and produced
    redbooks. Before joining the ITSO, he worked in Denmark for the IBM PC Institute
    teaching Connect and Service courses, and for IBM PSS performing Level 2 support
    of Net products. He has a Bachelor of Electronics Engineering degree and has worked
    for IBM for the past 10 years.


    Rufus Credle is a Senior I/T Specialist and certified Professional Specialist
    at the International Technical Support Organization, Raleigh Center. He conducts
    residencies and develops redbooks about network operating systems, ERP solutions,
    voice technology, high availability and clustering solutions, IBM and OEM business
    applications, all running on IBM Neptune and xSeries servers. Rufus''s various
    positions during IBM career have included assignments in administration and asset
    management, systems engineering, marketing and services. He holds a BS degree
    in Business Management from Saint Augustine''s College. Rufus has been employed
    for 20 years.


    Jay Hawkins is a Systems Architect for IBM Global Services Enterprise Architecture
    and Design in Seattle, Washington. He has been a Linux and Open Source advocate
    for more than five years and currently spends most of his time developing monitoring
    tools using Perl and the Apache Web server. Before joining IBM, he worked in different
    areas of the technology field including UNIX system administration, database design
    and development, Windows application development, and network administration.


    Justin Davies is a systems administrator and product manager at SuSE UK. He has
    five years of Linux experience, and his expertise is in embedded Linux systems,
    systems administration and network integration. He joined SuSE in May of 2000
    after graduating the University of Derby with a diploma in computer science.


    Ivo Gomilsek is an IT Specialist for Storage Area Networks and Storage in IBM
