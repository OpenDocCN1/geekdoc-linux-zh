- pgno: 178
  md: '# 5.9 Time zone and time server configuration


    Setting the time zone on a server can be a non-trivial consideration in large
    environments. TurboLinux provides a single interface that can be used to configure
    time zone and time server properties.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_178_0.png)


    Figure 175. Configure Timezone window


    By default, Linux uses the hardware clock in your server to set time. Setting
    the hardware clock to GMT is a good idea if clients will be logging into your
    server from other time zones, since the profile for each user can contain their
    time zone adjustment. If the clock on your server is set to local time, leave
    the option **Hardware clock set to GMT** unselected.


    Choosing the correct time zone for this server is required whether or not the
    hardware clock is set to GMT.


    On the bottom of the window you have an option to have the time for Linux set
    by a remote Timeserver instead of the local clock. The **Timeserver** option generates
    Figure 176. You have options to connect to an NTP or RDATE based timeserver, and
    an option of resyncing the clock with varying frequencies.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/4e6a76e57a4105be55d8a1cc0750b023_179_0.png)


    #  5.10 Enabling remote services to your server


    Linux provides two different ways to start server services such as FTP or a Web
    server. You can either start them separately in “stand-alone mode” through the
    runlevel structure (/etc/rc.d/SX.d), or you can have them wait until a client
    machine requests the service. This second method is done through the program inet,
    often called the “super server” because of its role. TurboLinux also comes with
    inetd, a newer “super server” that offers more flexibility and features than inet.
    However, inetd is the default in TurboLinux, so we will address it in this chapter.


    By default, inetd is started in all runlevels that have networking support. Inet
    monitors all TCP/IP ports, and starts programs when a request comes to one of
    the well-known ports on any of the server’s interfaces. The well-known TCP/IP
    ports are defined in the flat text file /etc/services As usual, inetd is configured
    in a plain-text file, this file /etc/inetd.conf. Figure 177 is the top part of
    the file. The rest of the file is organized in much the same way:'
  merge: -1
  img_proc: true
- pgno: 180
  md: '```

    # inetd.conf This file describes the services that will be available

    # through the INET TCP/IP service server. To re-configure

    # the running INETD process, edit this file, then send the

    # INETD process signal:kill -HUP inetd


    # Version:/etc/inetd.conf.0 Mar 12 2000


    # Format:

    # <service_name> <sock_type> <proto> <flags> <user> <server_path> <args>

    # For security reasons, all services are turned off by default. Uncomment (or

    # add lines) to enable them by inetd (see inetd.conf(8) for details).


    # Don''t forget to edit /etc/hosts.allow for services which are started

    # through wrappers (/usr/sbin/ in the configuration lines below).


    # Note: Some (typical examples: servers like Apache and MarCs like

    # Sendmail) run in standalone mode, i.e. they are _not started

    by the inetd. They are started at boot (or manually) and keep

    running

    ############################################################

    # ProFTP

    # Warning: the authentication for ftp goes over plain

    # net. This is especially dangerous if the login/password combination

    # is used for any shell. Make sure users have /usr/bin/ftpno /usr/bin/passwd as
    their login "shells"

    # If you choose password, you can change the ftp password using telnet

    # without having a real account on your system.

    ftp stream toppowertroot/usr/bin/tcpd.proftpd

    # stream toppowertroot/usr/bin/tcpd.ftp -a

    # Wftpd (an alternative ftp server)

    # stream toppowertroot/usr/bin/ftp

    # Telnet

    # Warning: Telnet is inherently insecure as a protocol. All network traffic,

    # including authentication (login and password) are transmitted

    # as clear text. Look for secure alternatives (e.g. ssh).

    # The -b option prevents your telnet from giving away information which

    # may be useful for potential system crackers. See telnet(8) for details.

    # telnet stream toppowertroot/usr/bin/tcpdpld -b

    ############################################################

