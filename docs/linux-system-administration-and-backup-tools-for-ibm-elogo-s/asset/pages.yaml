    # ## 1.1.1 Caldera Open Administration System (COAS)


    COAS helps to improve the users administer their Linux systems. The administration
    tools include the following:


    +   - Multiple user interfaces for administration

    - Modular administration tools

    - Flexible, powerful administration tools

    - Easy-to-use administration tools


    The administration system will provide multiple user interfaces for each administration
    tool. Those interfaces are command line, curses, X, and Java. For more information
    on COAS, visit the following Web site:


    http://www.coas.org/index.html


    # ## 1.1.2 Red Hat Linux


    Linuxconf is a sophisticated administration system used by the Red Hat operating
    system. In many ways, Linuxconf is different from other administration schemes
    found on UNIX operating systems and most other systems.


    Linuxconf is a configuration utility (a user interface to configuration tasks)
    and an activator. Linuxconf is involved in the operation of your Linux server
    or workstation. Mostly, it has features to warrant that the what


    Chapter 1. System administration 3'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'you have configured is performing effectively. The different interfaces include
    the following:


    +   * A text-based interface

    Linuxconf takes control pretty early at boot time when not much is enabled, especially
    not the X-Windows system. A text-based interface is required. This interface works
    on the console, on a terminal, using Telnet session, or logged in using a simple
    modem.


    +   * A Web interface

    Linuxconf may be operated with your favorite Web browser. Features of a Web browser
    such as bookmarks, multiple pages, and hotlinks make management a dream. You don''t
    have to install an HTTP server itself and is started from the inetd server.


    +   * A graphical interface

    Linuxconf has two GUI front ends. One is done in Java and is expected to operate
    stand-alone or from a browser. The other is with the xxWT toolkit and is already
    operational. Linuxconf is expected to evolve with some monitoring and diagnostic
    facilities.


    +   * A command line interface

    The command line interface is rarely used, and in some operating systems it does
    not exist. During the execution of special tasks, nothing can beat a script. A
    good example is the DNS management available in Linuxconf.


    # 1.1.3 SuSE Linux


    The system administration tool used in Su''s Linux is YaST, the acronym for Yet
    another Setup Tool. It is the program used to configure and administer the operating
    system. YaST gives you the ability to install and remove system and user software
    and perform basic system administration tasks. For a list of system administration
    activities, YaST allows you to perform the following:


    +   * Integrate hardware into the system

    * Kernel and boot configuration

    * Networking configuration

    * Configure the Live Filesystem CD-ROM

    * Login configuration

    * Set up usewm (the Windows Manager)


    4 Linux System Administration and Backup for IBM @server xSeries and Netfinity'
