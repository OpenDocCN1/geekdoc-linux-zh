  md: '# 3.4.3 Setting up your network


    You first need to verify Linux recognized your network hardware. You can look
    at the resources listed in 3.4.1, "Determining the hardware" on page 61. If you
    do not see it, you need to verify that the hardware is set up properly. You can
    go to the manuals that the hardware or if the manufacturer has other information
    available. Then you need to see if the hardware is supported. To select the supported
    entries to get the hardware compatibility list for your current version of Red
    Hat Linux, go to:


    ```

    http://www.redhat.com

    ```


    You can determine which network cards have modules loaded by looking at Figure
    69 on page 63. If you do not see the modules for your network card, you need to
    manually load the module or modules with the following command:


    ```

    insmod module_name

    ```


    Where the module_name is selected from those in Figure 70. If you do not see the
    module for your specific hardware device then you can do research on the Internet.
    Besides http://www.redhat.com, you should try the Web site for the manufacturer
    of the hardware you are using. Many manufacturers are making it a point to include
    support for Linux.


    Once the module is successfully loaded, you can add it to the /etc/modules.conf
    file as discussed earlier and it will be loaded on bootup.


    Once have all modules loaded, either automatically or manually, you need to determine
    that networking is in place. To see all of the network devices that have been
    recognized and have had their modules loaded, type the command:


    ```

    ifconfig

    ```


    If this is a new device for TCP/IP you may find that some items such as the inet
    address need to be defined.'
  merge: -1
  img_proc: true
