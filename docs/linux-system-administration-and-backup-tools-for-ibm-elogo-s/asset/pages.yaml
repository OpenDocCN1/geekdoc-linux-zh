    \ for more information\n\nALL : 127.0.0.1\n```\n\nFigure 76. The /etc/hosts.allow\
    \ file\n\nIn order to add additional remote access to your server, you need to\
    \ add an additional line. If you want to allow access to all other hosts then\
    \ add the line:\n\n```\nALL : ALL\n```\n\nThis will enable your remote access."
