    # 7.2 Microlite BackupEDGE


    BackupEDGE is a complete backup solution for the Linux platform. It is easy to
    use and still very robust. With BackupEDGE you can safely archive every file,
    directory, device node and special file on your file systems. Unlike the standard
    tar command, which ignores many important files, BackupEDGE also verifies every
    byte of data written to the tape to ensure the tape is an accurate reflection
    of your data. Below are the features provided by BackupEDGE software:


    +   * Data compression - automatic data compression is supported.

    * Menu interface - almost all functions can be accessed through an intuitive menu
    system.

    * Remote tape drive support - you can back up computers across the network.

    * High performance - advanced double buffering and variable block factors.

    * Virtual file support - you can back up virtual (sparse) files.

    * Multi-volume / Multi-device archives - automatic spanning across multiple volumes
    or devices.

    * Wildcard support - when selecting files you can use a wildcard.

    * Raw device backups - you can archive an entire raw device/partition to tape.

    * Master / incremental backups'
  merge: -1
  img_proc: true
- pgno: 202
  md: '• Unattended operation - you can perform a master backup or back up only the
    changed files.


    BackupEDGE is designed to operate on Linux kernels 2.x and there are available
    versions for several types of libraries.


    In the following sections we describe how to install, configure and use the Microlite
    BackupEDGE backup software.


    Note

    We recommend that you do not connect tape devices to the IBM ServeRAID adapter.
    Use a separate SCSI controller for the tape devices.


    # 7.2.1 Installing Microlite BackupEDGE


    Before you install BackupEDGE you must identify the device entry for your backup
    device. Usually tape devices under Linux are assigned in device nodes /dev/st0,
    /dev/st1... A no-rewind device is created for each tape device, which is /dev/nst0,
    /dev/nst1... In our example, we used /dev/st0 as tape device and /dev/nst1 as
    the no-rewind device.


    In our example, we used diskette as the installation media. To install the product,
    follow these steps:


    +   1. Log in root.

    2. Change the directory to root “/”.

    3. Insert the diskette with the product in the floppy drive and execute the command:

    tar xvf /dev/fd0

    Where /dev/fd0 is your floppy device.

    4. Execute the following command to finish the installation:

    tmp/init.edge


    You will see a window similar to Figure 188.'
