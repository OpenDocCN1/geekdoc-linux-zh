- pgno: 237
  md: '# 7.2.11 More information on Microlite products


    For information on advanced features consult the Microlite User''s Guide and the
    Microlite Web site at:


    http://www.microlite.com


    # 7.3 Arkeia


    Arkeia is a complete client/server backup solution for Linux and other platforms.
    In this section, we will prepare the installation of Arkeia.


    The requirements for the server:


    +   * A 486 processor or higher

    * 32 MB RAM

    * 1 GB disk space

    * SCSI adapter card

    * SCSI tape drive

    * TCP/IP services

    * Linux 2.0 or higher


    The requirements for the client:


    +   * A 486 processor or higher

    * 5 MB disk space


    In the following sections we describe how to install, configure and use the Arkeia
    backup software.


    # 7.3.1 Installing Arkeia


    Arkeia is available in different package formats (tar, rpm) for different distributions
    either on CD or downloadable from Arkeia''s Web site (follow the link http://www.arkeia.com)
    in the DOWNLOAD AREA. To install Arkeia, we recommend that you follow the installation
    procedure described in the Installation and Quick Start Manual. You can find this
    manual on the Arkeia-CD or download it from Arkeia''s Web site.


    On the Arkeia server, you must also install the client and the GUI package. These
    packages are required to configure the backup server. After the installation of
    the client and GUI packages, you can install the server package.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 7.3.2 Configuring Arkeia


    Before you can configure Arkeia, check whether the Arkeia backup server is running.
    To do this, enter:


    ```

    ps -ef | grep -v grep | grep nlservd

    ```


    on the system which should be used as your backup server. If you see a line like


    ```

    root 488 1 0 09:06 ? 00:00:00 /usr/knox/knox/bin/nlservd start

    ```


    the backup server is running. To begin with the configuration of Arkeia, be sure,
    your X-Windows running. Then enter on the command line:


    Arkeia


    You will see a dialog like Figure 232:


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_238_0.png)


    Figure 232. Arkeia initial window


    The field for the server name is by default filled in with the name of the system
    you currently work with. You must change this field if you have installed the
    server component on another system.


    The field for the login name is by default filled in with root. Change it if you
    have changed the name of the Arkeia administrator.'
