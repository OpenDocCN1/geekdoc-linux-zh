    # 5.1.2 Installing the VESA frame buffer server


    If you have problems configuring the X server, or want to create an image or process
    that runs on any video card, you should install the VESA frame buffer driver.
    The frame buffer is given to limited functionality to any VESA compliant video
    card. The following is a set of instructions needed to configure the frame buffer.


    +   1. With the system started in command mode, log in as "root".


    +   2. Mount the TurboLinux Companion CD and install the frame buffer package
    with the following commands:


    ```

    mount /dev/cdrom /mnt/cdrom

    cd /mnt/cdrom/TurboContrib/RPMS

    rpm -ivh XFree86-FBDev-3.3.6-i386.rpm

    ```


    +   3. Save the current symbolic link and create a new symbolic link by running
    the following commands:


    ```

    mv /etc/X11/X /etc/X11/X.old

    ln -s /usr/X11R6/bin/XF86_FBDev /etc/X11/X

    ```


    +   4. Open /etc/lilo.conf to add a new entry for the frame buffer server.


    ```

    pico /etc/lilo.conf

    ```


    The file looked something like this:'
