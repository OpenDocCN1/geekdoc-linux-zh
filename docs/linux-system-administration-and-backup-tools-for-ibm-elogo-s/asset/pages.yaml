  md: '# 5.4.4 Package management using the RPM command


    Package management can also be done directly from the command line. The command
    line is often used to build scripts to do package management.

    Table 7 below shows some frequently used commands.


    | Command | Description |

    |--- |--- |

    | rpm -q <package> | Query RPM database. If package is installed, display version
    and build number of installed package. |

    | rpm -qi <package> | Obtain some more information about an installed package.
    |

    | rpm -qa | List all installed packages. |

    | rpm -qf <filename> | Determine the (installed) package <filename> belongs to.
    |

    | rpm -Uvh <package.rpm> | Update/Install the file <package.rpm> showing a progress
    bar. |

    | rpm -F -v ./*.rpm | Update (refresh) all currently installed packages using
    the RPM files in the current directory. |


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_156_0.png)'
