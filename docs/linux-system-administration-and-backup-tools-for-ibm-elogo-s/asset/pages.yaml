- pgno: 12
  md: '# Chapter 1. System administration


    You have successfully installed your Linux operating system. It is up and running.
    The daily life has begun. This sounds very simple, but the system administration
    task for setting Linux is not considered to be easy.


    As users come, and as data changes and grows, you have to administer your system.
    You have to create, modify, or delete user accounts, create and format new partitions,
    control permissions, and review logs.


    New Linux users quickly learn that it''s difficult to configure their systems
    because the current administration system is incomplete. In fact, the Linux operating
    system doesn''t even have an administration system at all. Linux has only a limited
    number of tools created by the Linux community. Because Linux does not have a
    complete, unified administration system, users turn to other resources, and they
    usually end up configuring their systems manually by editing files directly. Users
    shouldn''t have to turn to other resources to configure their systems.


    Several users around the world have created administration tools for the Linux
    operating system and have contributed these tools to the Linux community. However,
    this development process has caused some problems, including:


    +   * The administration tools use not full-featured.

    * Many administration tools are not full-featured.

    * Some administration tools interfere with manual file editing.


    IBM is committed to supporting the following Linux operating systems, Caldera
    OpenLinux, Red Hat, SuSE Linux and TurboLinux. These operating systems have a
    complete, unified administration system to assist you and to ease administration
    tasks.


    # 1.1 The administrative tools of Caldera, Red Hat, SuSE and TurboLinux


    To administer your running system, you have a complex set of tools that is part
    of your operating system. But to use these tools can be quite annoying. Every
    tool has many very useful options, but they are rarely consistent with other tools.


    The Linux distribution on IBM @server xSeries and Netfinity contains several tools
    that combines many administrative tasks. These tools have a'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'user-friendly interface, either in text mode and/or a graphical user interface

    (GUI).


    For more information about these tools, consult the documentation that came\with
    your Linux package. A good source for information regarding the use of

    these tools on IBM @server xSeries and Netinity servers are found in

    t following IBM Redbooks:


    +   - CalderOpenLinux Integration Guide for IBM @server xSeries and

    Netinity; SG24-5861-01

    - Red Hat Linux Integration Guide for IBM @server xSeries and Netinity,

    SG24-5863-01

    - SuSE Linux Integration Guide for IBM @server xSeries and Netinity,

    SG24-5863-01

    - TurboLinux Integration Guide for IBM @server xSeries and Netinity,

    SG24-5862-01


    Using the Candida Openlenux, Red Hat Linux, SuSE Linux, and TurboLinux

    tools, you can perform the following:


    +   - Create, modify, delete user accounts and groups

    - Change passwords

    - Modify permissions

    - Add or remove software packages

    - Configure the network

    - Create, modify the LILO configuration

    - Modify boot mode (text mode or GUI)

    - Install or remove software packages


    These tools do not prevent you from using the usual UNIX tools such as

    passwd, adduser, idisk, groupadd, or mke2fs, etc. or from editing system files

    (for example, /etc/passwd) manually. But since the distribution-supplied

    tools also check dependencies with other affected system files, your

    administrative work may be substantially easier.


    Do not forget to monitor some important log files:


    +   - Red Hat Linux, TurboLinux: /var/log/messages /var/log/dmsg

    - SuSELinux: /var/log/messages /var/log/lastlog,/var/log/ferlog

    - TurboLinux: /var/log


    There are many books about Linux system administration from well-known

    UNIX and Linux book publishers. Also as part of the Linux Documentation

    Project (LDP), you can find documents that cover this area, for instance The


    2 Linux System Administration and Backup for IBM @server xSeries and Netfinity'
  merge: -1
  img_proc: true
- pgno: 14
