- pgno: 102
  md: 'You can also use the man command to obtain more detailed information about

    the different parameters.


    Other commands have information presented using the --help option. This

    option is not implemented in all commands but in the case of the useradd

    command it will present basically the same information you see in Figure 93.


    You can find out what your current default values are with the command

    useradd -D as shown in Figure 94.


    ```

    SUSE: # useradd -D

    GROUP=100

    HOME=/home

    EXPIRY=10000

    SHELL=/bin/bash

    SHELL=/etc/skel

    ```


    Figure 94. Default values for the options are creating a user


    The explanation of the c are as follows:


    +   - c comment

    This is a comment field about the user. It has been traditionally called the

    General Electric Operating System (GECOS) field and

    can include such as office numbers, phone numbers,

    etc. Any string of characters can be put into double quotes. For example,

    -c comment "John Doe, rm. 45, x 78965"


    +   - d home_dir

    The home directory of the user. If this is not specified then the

    default is to append the login name to the end of the default value for

    HOME shown in Figure 94. For example, the home directory for jdoe will

    be /home/jdoe unless specified here.


    +   - e expire_date

    This is the date on which the account bill will be disabled. The date is

    specific in the format MM/DD/YY where MM is the month, DD is the date

    and YY is the two-digit format of the year. (Note that even though the date

    is represented in two digits, Linux converts the date to a format that is not

    Y2K dependent, so the there are no Y2K worries here.) The default is the

    value of EXPIRE in Figure 94.


    +   - f inactive_time'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'This gives the status of the account. The value of 0 says disable the account
    when the password expires. A value of -1 says not to disable it. The default is
    the value of INACTIVE in Figure 94.


    -g initial_group


    The initial group that a user logs in with. This can be a name or number of a
    currently existing group. This is specified in the /etc/password file as the GID
    or Group ID value. The default group is given by the value of GROUP in Figure
    94.


    -G group{...}


    This is a list of any additional groups the user may belong to. Each group is
    separated by a comma.


    -m [-k skeleton_dir]


    The -m option says to create the user''s home directory if it does not exist.
    The skeleton_dir is the location of files that are copied to a new user''s directory.
    The default location, if you do not use the -m option, is the /etc/skeleton directory.
    The default is the value of SKEL in Figure 94.


    -s


    This is the shell that the user will log in with. The default is the value of
    SHELL in Figure 94.


    -u uid [-o]


    This is the numeric UID or ID number that is used by Linux to distinguish one
    user from the other. All UIDs must be unique unless the -o option is used. The
    -o option is often used for creating UIDs that have the same access rights, but
    different logins and passwords. The system looks only at the UID and GID values
    for determining access rights.


    -r


    This is used to create a system account whose UID is lower than a certain number
    defined in /etc/login.defs. You will also need to specify the -m option if you
    want to create the home directory. Otherwise, it will not be created. System accounts
    generally have UID values between 0 and 99.


    login


    This is the login name that the user will log in with. This will need to be unique
    on the system.'
  merge: -1
  img_proc: true
- pgno: 104
  md: "# #### 4.4.1 Modifying users - the command line version\n\nYou can modify user\
