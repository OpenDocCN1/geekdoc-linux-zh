- pgno: 100
  md: '+   * /bin/csh - This is the standard Shell that originated at the University
    of California, Berkeley.


    +   * /bin/zsh - This is another extension of the Bourne Shell.


    Your choice of shells is a matter of preference, but generally UNIX admins prefer
    Bourne or Korn Shell programs, programmers tend to prefer C Shell-based programs.


    If you want this user to be able to connect to the Internet using a modem, check
    Access to modem permitted. This will add this user to the groups dialout and uuccp,
    which have the necessary permissions to initiate a dial-up connection using the
    tool wdiag. The entry fields User name, Group and Login also provide a selection
    list where you can choose a previously defined value. Press F3 in the respective
    entry field.


    After you have filled in all fields, press F4 to actually create the user. If
    the home directory of that user did not exist before, it will now be created and
    the contents of the directory /etc/skel will be copied into it. This skeleton
    directory contains a basic framework of configuration files for the user to start
    from.


    If you want to remove a user account, just select the login name using F3 or enter
