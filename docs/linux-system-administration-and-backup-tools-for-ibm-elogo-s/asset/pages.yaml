- pgno: 81
  md: 'You also need to edit the /etc/hosts file. This file is seen in Figure 77.

    You will notice that access is denied to all remote systems. This will also prevent
    access from the localhost entry even though it is specified in the /etc/hosts.allow
    file.


    ```

    # hosts.deny    This file describes the names of the hosts which are

    # *allowed to use the local INET services, as decided

    # by the /usr/sbin/tcpd'' server.

    #

    #

    # See man hosts_access(5) for more information.


    ALL: ALL

    ```


    # Figure 77. /etc/hosts.deny


    In order to allow access from all remote hosts you need to remove or

    comment out the last line in Figure 77:


    ```

    # ALL: ALL

    ```


    This will then allow access to all remote hosts.


    > Note

    When making changes to configuration files it is a good habit to copy the

    original file to a backup file. You can do something:


    cp file_name file_name.bak


    (where file_name is the file you are using)


    Put a comment symbol, generally the #, in front of any entries you want to

    change. Create a new line with the revised information. This allow you

    to return to your previous entries in case of errors and you can go totally

    back to your original file if it is copied.


    You then need to restart the inetd daemon with the following command:


    ```

    killall -HUP xinetd

    ```


    You can test that telnet is working with the following command:


    ```

    telnet your_ip (where your_ip is the IP address of your system)

    ```


    If you can log in successfully, then you know that the remote access is

    working.'
