- pgno: 67
  md: "This is the numeric UID or user ID number that is used by Linux to distinguish\
    \ one user from the other. All UIDs must be unique unless the -o option is used.\
    \ The -o option is used for creating IDs that have the same access rights, but\
    \ different logins and passwords. The system looks only at the UID and GID values\
    \ for determining access rights.\n\n-n\n\nBy default a group will be created whose\
