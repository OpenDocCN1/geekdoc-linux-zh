    # ## 2.6 Package management using RPM


    Package management can also be done directly with the Red Hat package manager
    (RPM) package manager on the command line. The command line in the graphical interface
    can be accessed through the terminal window as described in 2.3, "Getting the
    X-Windows terminal window" on page 10. Table 2 shows some of the most frequently
    used versions of the RPM commands.


    Table 2. Basic RPM commands


    | Command | Description |

    | --- | --- |

    | rpm -q <package> | If a package is installed, check version and build number
    of the installed package. |

    | rpm -qi <package> | Obtain more information about an installed package. |

    | rpm -qa | List all installed packages. |

    | rpm -qf <filename> | Determine the (installed) package that <file> belongs to.
    |


    Chapter 2. Caldera OpenLinux basic system administration 17'
  merge: -1
  img_proc: true
- pgno: 29
  md: '| Command | Description |

    | --- | --- |

    | rpm -Uvh <package.rpm> | Update/Install the file package.rpm showing a progress
    bar. |

    | rpm -F -v .*.rpm | Update (freshen) all currently installed packages using RPM
    files in the current directory. |

    | rpm --help* | Get help about the different options and parameters. |


    > > Note

    After you install packages using RPM, you may need to run some additional configuration
    programs. Programs such as Apache need to be customized to your particular environment
    and require some post-installation maintenance. Some of these packages can be
    configured from the graphical interface by selecting other icons. Other packages
    may have their own configuration tools.


    More information and options about RPM can be found in the manual page (man rpm),
    the RPM how-to file (less /usr/doc/howto/en/RPM-HOWTO.txt.gz) and at the RPM Web
    site http://www.rpm.org. You can also display a short overview by running rpm
    --help.


