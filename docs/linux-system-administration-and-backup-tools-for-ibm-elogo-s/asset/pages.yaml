    entry field. If you entered a new group name, YaST will automatically assign the
    next available group ID to this group. You can accept it or modify to your needs.
    If it is not intended to be a primary (default) user group, you can protect it
    with a password as well. All users that should be members of this group can be
    entered in the **List of members of that group** (comma-separated). You can press
