    it takes. Consult the documentation of the service to find out what arguments
    takes, and what those arguments do.


    - **Comment** - This allows you to set a comment for this service. It is always
    a good idea to comment services so that you can remind yourself and others about
    what the service does, or special warning for other administrators.


