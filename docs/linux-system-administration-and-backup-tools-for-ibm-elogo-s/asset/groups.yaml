    你可以在图 160 中看到文件系统类型（Filesystem Type）被设置为 ext2。

    选择显示文件系统类型（Show Filesystem Types）允许你在图 161 中查看其他可用选项。


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_166_0.png)


    Linux 将 DOS 文件系统 FAT称为 MSDOS，我们可以从列表中看到它是可用的。注意，此列表是 `/lib/modules/current/fs/`
    目录下所有内核模块的实时列表。如果目录中删除或添加模块，列表将会变化。


    第 5 章 TurboLinux 基础系统管理 155


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_167_0.png)


    在图 162 中，我们将文件系统类型更改为 msdos，并选择了挂载软盘读写选项，因为只读软盘没有太大用。点击此窗口上的 OK 将我们的更改保存到 `/etc/fstab`
    中。


    - 4. 允许向此服务器添加本地或远程文件系统。选择添加（Add）将为你提供图 163 所示的选项：


    ## 配置文件系统


    下面是你已配置的文件系统及相关选项列表。

    请选择你想要修改的一个，或选择“添加”（Add）或“移除”（Remove）来添加或移除。


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_168_0.png)


    图 163. 配置文件系统窗口


    可以添加的四种文件系统是：


    - a. 本地文件系统（Local Filesystem）。此窗口与图 163 所示的编辑文件系统窗口相同。在添加文件系统时，显示分区（Show Partitions）和显示文件系统类型（Show
    Filesystem Types）选项非常有帮助，因为它们允许你查看系统已知的所有分区和文件系统。


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_169_0.png)


    - b. NFS 系统（NFS System）。此选项允许你挂载由 NFS 服务器导出的文件系统。你可以通过完成第一行主机名或 IP 地址（Hostname
    or IP Address）输入并选择 **NFS Exports** 选项来获取服务器共享的目录列表。这将查询相关的 NFS 服务器并返回导出的目录列表（也称为
    exports）。


    158 IBM @server xSeries 和 Netfinity 的 Linux 系统管理与备份


