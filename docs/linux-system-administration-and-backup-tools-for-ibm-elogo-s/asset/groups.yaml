    # 5.9 Time zone and time server configuration


    Setting the time zone on a server can be a non-trivial consideration in large
    environments. TurboLinux provides a single interface that can be used to configure
    time zone and time server properties.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_178_0.png)


    Figure 175. Configure Timezone window


    By default, Linux uses the hardware clock in your server to set time. Setting
    the hardware clock to GMT is a good idea if clients will be logging into your
    server from other time zones, since the profile for each user can contain their
    time zone adjustment. If the clock on your server is set to local time, leave
    the option **Hardware clock set to GMT** unselected.


    Choosing the correct time zone for this server is required whether or not the
    hardware clock is set to GMT.


    On the bottom of the window you have an option to have the time for Linux set
    by a remote Timeserver instead of the local clock. The **Timeserver** option generates
    Figure 176. You have options to connect to an NTP or RDATE based timeserver, and
    an option of resyncing the clock with varying frequencies.'
