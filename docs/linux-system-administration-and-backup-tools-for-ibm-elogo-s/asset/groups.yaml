    tar、cpio、volcopy 和 dump 等其他常用工具相比有显著增强。BRU 设计用于配合大多数备份设备，包括盒带、4mm DAT、8mm (Exabyte)
    和 9 轨磁带机。


    BRU 包括增量备份、全备份、多卷归档、分与更新、错误检测与恢复、随机访问能力、文件比较和文件覆盖保护。


    作为软件包的一部分，BRU 还包含一个名为 XBRU 的图形用户界面 (GUI)。从命令行来看，BRU 与 Tar 非常相似。XBRU 的对话框非常直观且易于使用。要设置计划备份计划，最简单的方法是使用
