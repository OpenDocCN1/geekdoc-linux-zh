    # USERDEL(8)


    NAME

    userdel - Delete a user account and related files


    SYNOPSIS

    userdel [-r] login


    DESCRIPTION

    The userdel command modifies the system account files, deleting all entries that
    refer to login. The named user must exist.


    +   -R Files in the user''s home directory will be removed along with the home
    directory itself. Files located in other file system will have to be searched
    for and deleted manually.


    FILES

    /etc/passwd - user account information

    /etc/shadow - secure user account information


    > Figure 65. Man userdel command


    The only option that you can use is:


    -RnThis says for you to remove the home directory and its contents. Otherwise
    the home directory and its contents will not be deleted.


