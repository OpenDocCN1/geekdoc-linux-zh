    - NFS 导出配置。NFS 是 UNIX 环境中用于共享文件的传统协议。

    - PPP 配置。此配置工具仅用于客户端端拨号。不会在此机器上设置 PPP 服务器。

    - TCP/IP 路由配置。允许你设置默认路由和网络路由。它还有一个启用 IP 转发的选项。


