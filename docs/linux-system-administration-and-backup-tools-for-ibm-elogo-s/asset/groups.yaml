    files and file systems. Also if you are going to creating a system with many users,
    you should consider creating separate groups divided by what they are on the system.
    You can create an admin group for admins, a db2user group for DB2 users, and so
    forth. Linux allows you to control access to both files and directories by users,
    groups, and everyone on the system.


