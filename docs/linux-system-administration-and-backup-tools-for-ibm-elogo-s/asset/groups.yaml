    Figure 250. Interactive backup start window


    In the comboboxes Savepack, Drivepack and Pool type fields, choose which data
    sets should be backed up on which tapes and on which tape drives.


    In the Type box, choose between Total Backup and Incremental Backup and between
    Standard and Continuous.


    In the Tape Strategy field, choose between New tapes and Complete existing tapes.


    In the Valid for field, decide how long the tape(s) for this backup should be
    valid.


    Click the OK button to proceed. A window as in Figure 251 appears.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_254_0.png)


    As the backup process proceeds, the content of this window will change. Most of
    the time, you will see a window like Figure 252.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_255_0.png)


    There are three areas in the window, marked A, B and C in Figure 252, which may
    require your attention:


    In the area A points to, you sometimes see a push button labeled OK. Click this
    button when you have done the action, which was requested in the scroll list area
    C. In the line pointed to B, you see the name of the file that is actually backed
    up.


    You can leave this window by clicking the OK button. The backup process continues
    in the background.


    If you want to connect again to this process or as Arkelia joins it - job, to
    Arkea''s main dialog window as shown in Figure 234. In this window you will see
    a box labeled either “No job running” or “List of jobs”. If you see the text “List
    of jobs” or one or more lines under this box, move the cursor over the line with
    the job you want to connect to and press the right mouse button pull-down menu
    as shown in Figure 253.


    | | | On node | Owner | Comment |

    |---|---|---|---|---|

    | Bar | Connect job | 8:10:40 xxxx | root | Full BackUp_01 |


    Figure 253. Connect job pull-down menu


    Move the cursor over the line with the action you will perform and click the left
    mouse button. The requested action will be performed.


    If you chose Stop job, you are asked in a new dialog whether you really want to
    stop this job.


    If you select Connect job, you will see a window similar to Figure 252 again.


    ## 7.3.4 Periodic Backup


    To configure your scheme for periodic backups, press the periodic backup button
    or go to Utilities > Periodic Backup on the menu. You will see a window similar
    to Figure 254.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_257_0.png)


    To create a new entry for periodic backup, click the **new** button. You can now
    fill in the fields with the appropriate-information. For more details, please
    consult the **Administrator''s Manual.**


    ## 7.3.5 Restoration


    To start restoration of data, click the restoration button or click **Restoration
    -> Restoration** on the menu. You will see a window like Figure 255.


