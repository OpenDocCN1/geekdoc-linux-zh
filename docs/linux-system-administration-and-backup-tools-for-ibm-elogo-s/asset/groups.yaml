    # Figure 70. Finding loadable hardware modules


    The file that you need to load is the /etc/modules.conf. This file contains the
    list of modules that you will load when you boot the system. It contains aliases,
    such as eth0, which are linked to the names of actual modules that are loaded.
    Also it contains options that you might need to load to make certain hardware
    work in Linux. When you want a module to be included on the boot sequence you
    can add it to this file. For example, to add an IBM ISA token-ring device on boot,
    create the entry:


    Add the line in the /etc/modules.conf file and the module will be loaded on bootup.


    ```

    # /etc/modules.conf

    alias eth2 pcmnet32

    alias eth0 pcmnet32

    alias net0-4 off

    alias char-major-14 sb

    options sb 0x0220 irq=5 dma=1-6 mpu_io=0x0330

    #

    ```


