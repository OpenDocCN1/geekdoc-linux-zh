  mdcn: "\n由 Lars Wirzenius 和 Joanna Oja 编写的《Linux 系统管理员指南》，以及 Steve Frampton 编写的《Linux\
    \ 管理简易教程》。您可以在 http://www.linuxdoc.org 或 http://www.sunsite.unc.edu/LDP/ 找到 LDP\
    \ 的主页。\n\n每个 Linux 发行版可用的系统管理工具列于表 1 所示：\n\n表 1. 发行版及其管理工具\n\n| 发行版 | 管理工具 |\n\
    |---|---|\n| Caldera OpenLinux | Caldera Open管理系统 (COAS) |\n| Red Hat Linux |\
    \ Linuxconf |\n| SuSE Linux | YaST (文本模式), YaST2 (图形界面) |\n| TurboLinux | turboXXXcfg\
    \ (XXX: apache, fs, fpt, net, print, sound, time, user) turbopkg turboservice\
    \ |\n\n## 1.1.1 Caldera Open管理系统 (COAS)\n\nCOAS 帮助用户更好地管理他们的 Linux 系统。管理工具包括以下内容：\n\
    \n-   用于管理的多个用户界面\n-   模块化管理工具\n-   灵活、强大的管理工具\n-   易于使用的管理工具\n\n管理系统将为每个管理工具提供多个用户界面。这些界面包括命令行、curses、X\
    \ 和 Java。有关有关 COAS 的更多信息，请访问以下网站：\n\nhttp://www.coas.org/index.html\n\n## 1.1.2\
    \ Red Hat Linux\n\nLinuxconf 是红帽 操作系统使用的一种复杂的管理系统。在许多方面，Linuxconf 与 UNIX 操作系统以及大多数其他系统上的管理方案不同。\n\
    \nLinuxconf 是一个配置实用程序（配置任务的用户界面）和一个激活器。Linuxconf 参与到您的 Linux 服务器或工作站的操作中。大多数情况下，它具有这些功能确保您配置的内容正在有效运行。不同的接口包括：\n\
    \n-   文本界面\n    在启动的早期，Linuxconf 就会接管控制，此时尚未开启很多，特别是 X-Windows 系统。因此需要一个文本界面。该界面可以在控制台、终端、使用\
    \ Telnet 会话或通过简单的调制解调器登录时工作。\n\n-   Web 界面\n    可以使用您喜爱的 Web 浏览器操作 Linuxconf。Web\
    \ 浏览器的功能如书签、多页面和热链接让管理变得如梦般轻松。您不需要安装 HTTP 服务器本身，它是从 inetd 服务器启动的。\n\n-   图形界面\n\
    \    Linuxconf 有两个 GUI 前端。一个用 Java 编写，并预计可以独立运行或从浏览器运行。另一个使用 xxWT 工具包，并且已经可以运行。Linuxconf\
    \ 预计将随着一些监控和诊断功能而演进。\n\n-   命令行界面\n    命令行界面很少被使用，在某些操作系统中甚至不存在。在执行特殊任务期间，没有什么能比得上脚本。一个很好的例子是\
    \ Linuxconf 中提供的 DNS 管理。\n\n## 1.1.3 SuSE Linux\n\n在 SuSE Linux 中使用的系统管理工具是 YaST，它是\
    \ \"Yet another Setup Tool\"（又一个设置工具）的缩写。它是用于配置和管理操作系统的程序。YaST 赋予您安装和删除系统及用户软件的能力，并执行基本的系统管理任务。对于系统管理活动列表，YaST\
    \ 允许您执行以下操作：\n\n-   将硬件集成到系统中的\n-   内核和引导配置\n-   网络配置\n-   配置活动文件系统 CD-ROM\n-\
    \   登录配置\n-   设置 usewm（Windows 管理器）\n-   用户管理\n-   组管理\n-   创建备份\n-   系统安全设置\n\
    -   配置 XFree86\n-   修改 YaST 配置文件\n\n## 1.1.4 TurboLinux\n\nTurboLinux 易于使用的 TurboTools\
    \ 可以快速配置网络、打印机、X-Windows、页面更新、用户账户以及各种其他系统设置，一旦这些设置运行，将使管理变得简单。\n\n这些工具列于表 1 中。\n\
    \n本章将向您概述如何在 Caldera OpenLinux 服务器 2 上执行最常见的管理任务。Caldera OpenLinux 2 具有这些设置，一旦这些设置运行，将使管理变得简单。在接下来的章节中我们将描述如何在图形环境中使用一些基础工具，特别是如何使用\
    \ COAS 配置您的 Caldera OpenLinux 系统。\n\n> 提示\n> 我们建议为 XFree86 设置使用 8bpp 颜色定义；否则在打开更多程序时会出现颜色问题。\n"
