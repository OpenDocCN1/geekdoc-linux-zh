    ## 4.6 使用 YaST 修改配置文件


    SuSE Linux 使用中心文件 `/etc/rc.config` 来存储大部分系统配置信息。该文件的内容将用于启动时的 init 脚本，并用于创建不同服务的配置文件。


    该文件的格式为纯 ASCII 文本。配置以 `VARIABLE=value` 的形式存储。额外的注释以行首的 "#" 符号标记。由于 `rc.config`
    包含了大部分配置信息，您不需要编辑大多数服务的原始配置文件。只需在这一个文件中进行更改即可；YaST（结合 SuSEconfig 集合）将负责正确创建这些文件。然而，如果您习惯于直接修改单独的配置文件，也可以直接操作。SuSEconfig
    会检测到手动更改且不会覆盖它们。相反，您将收到一条通知，说明 SuSEconfig 检测到了手动更改，并在 `<filename>:suseconfig`
