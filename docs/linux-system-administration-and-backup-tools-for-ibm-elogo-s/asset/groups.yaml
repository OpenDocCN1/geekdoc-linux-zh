    \n- 池管理 (Pool management)\n- 磁带管理 (Tape management)\n- 驱动器管理 (Drives management)\n\
    - 驱动器包管理 (Drivepacks management)\n- 保存包管理 (Savepacks management)\n\n让我们从磁带池管理开始。点击主对话框底部的\
    \ pools management 按钮，或点击菜单上的 Tapes -> Pools management。出现的 Pools 管理窗口如图 236 所示：\n\
    \n![](img/4e6a76e57a4105be55d8a1cc0750b023_241_0.png)\n\n图 236. Pools 管理主对话框窗口\n\
    \n默认存在一个空闲池 (scratch pool)。要创建一个新的磁带池（例如用于你的备份磁带），点击 new（新建）按钮。出现的池创建对话框如图 237\
    \ 所示：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_242_0.png)\n\n在对话框字段中填写相应信息并点击\
    \ **OK 按钮**。出现的 Pools 管理主窗口池列表已更新为如图 238 所示：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_242_1.png)\n\
    \n图 238. 更新了池列表的 Pools 管理主窗口\n\n返回主对话框请点击 **OK** 按钮。现在我们可以用磁带填充 Full Backup 池。要执行此操作，点击\
    \ tape management 按钮，或点击菜单中的 **Tapes -> tapes management**。出现的 Tapes 管理窗口（图 239）：\n\
    \n![](img/4e6a76e57a4105be55d8a1cc0750b023_243_0.png)\n\n图 239. Tapes 管理主窗口\n\n\
    点击 **new** 按钮输入新磁带（图 240）：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_244_0.png)\n\
    \n磁带名称由一个固定部分和一个变量部分组成。固定部分可以是任何文本，而变量部分是一个数字。输入磁带名称的第一部分、要使用的磁带的第一个和最后一个数字，以及磁带类型（DAT、DLT\
    \ 等）。选择磁带应所属的池，并在注释行输入注释。点击 OK 按钮返回 Tapes 管理窗口。Tapes 管理主窗口显示磁带列表已更新。\n\n在创建磁带池后，我们可以创建驱动器。点击\
    \ **new** 按钮输入新驱动器（图 240）：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_240_0.png\n\
    \n在字段中填写相应信息。出现的 Drives 窗口（图 241）：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_241_0.png\n\
    \n在创建驱动器后，我们可以创建驱动器包。点击 **new** 按钮进入驱动器包（图 242）。出现的对话框（图 242）：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_242_0.png\n\
    \n在对话框中填写相应信息并点击 **OK 按钮**。出现的 Drivepacks 管理主窗口列表已更新，如图 242 所示：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_242_1.png\n\
    \n返回主对话框请点击 **OK** 按钮。现在我们可以填充保存包。点击 savepacks 按钮，或点击菜单上的 **Tapes -> tapes management**。出现的\
    \ Savepacks 管理窗口（图 243）：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_243_0.png\n\
    \n点击 **new** 按钮创建新的保存包（图 244）：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_244_0.png\n\
    \n在对话框中填写相应信息并点击 **OK 按钮**。出现的 Savepacks 管理主窗口列表已更新，如图 245 所示：\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_245_0.png\n\
    \n## 7.3.3 交互式备份\n\n要开始交互式备份，点击交互式备份按钮，或点击菜单上的 Backup ->Interactive Backup。出现一个如图\
    \ 250 的窗口。\n\n"
