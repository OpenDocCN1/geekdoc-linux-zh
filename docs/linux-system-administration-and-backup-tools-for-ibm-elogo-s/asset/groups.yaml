    you are saying that only the directory owner is allowed to execute something "inside"
    the directory. So if another user tries to change directory (cd) into this directory,
    they will get a "permission denied" error message. This is exactly what happens
    with regards to user''s home directories.


    To change the permissions on a file, you use the chmod command. Only root users
    can modify files that do not belong to them. You must own the file to be able
    to change its permissions.


    The easiest way to change permissions is to use symbolic representations of what
    you want permissions to be.


    > Note

