    如果您想编辑 `rc.config` 中的变量，可以使用普通的文本编辑器打开它。每个变量的定义上方都有几行注释，以便您概览其作用。这些内容在 SuSE 手册的第
    17.6 节“/etc/rc.config 中的变量”中也有介绍。在修改 `rc.config` 中的条目后，您需要运行 SuSEconfig 以将更改应用到不同的配置文件。


    或者，您可以使用 YaST 作为方便的前端来编辑这些变量。在 YaST 主菜单中，选择“System administration -> Change configuration
