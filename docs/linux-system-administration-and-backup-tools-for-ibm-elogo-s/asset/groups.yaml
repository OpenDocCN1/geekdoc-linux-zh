    10. After you configured settings return to the main window and select Make Disks.
    You will be prompted to insert three diskettes.


    > Note: If you get an error that diskettes cannot be created, the probable cause
    is that images too big. To reduce the number of loaded modules or even make the
    special kernel just for this purpose, throwing out unnecessary things.


    After the diskettes are created you are ready to deal with disaster on your system.
    Before this really happens, try to boot from these diskettes and verify if your
    tape device is recognized.


    ## 7.2.10.2 Verifying the RecoverEDGE boot diskette


    To verify the diskettes, boot from the first disk and follow instructions on the
    window. When the system is started you will get the RecoverEDGE main menu. Select
    Utilities > Tape Drive.


    In the Tape Device Node, you see the defined tape device. Go to the Test Tape
    Drive field and test your tape device. If the test is successful your recovery
    set is ready to use.


    ## 7.2.10.3 Recovering from a total crash


    To recover from a disaster crash follow these steps:


    + 1. Resolve all hardware problems.


    > Note: Before restoring the system, initialize the Master Boot Records of all
    disk drives.


    + 2. Boot the server from the first RecoverEDGE boot diskette.


    3. When you are prompted to insert the root diskette, insert the second RecoverEDGE
    boot diskette. After the diskette is loaded, RecoverEDGE will start and you will
    see a window similar to Figure 231.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_236_0.png)


    Select Restore > One Touch. Follow the instructions on the window to complete
    the recovery.


    > Note: For recovery you will use your master and incremental backups.


    - When all files are backed up, press a key to get back to the main window. All
    the file systems will be then synchronized LILO will be set up and executed.


    - Before you reboot, switch to a console 2 with Alt+F2 and execute the following
    commands to check fstab file for correct entries for your system:

    mount /dev/sdb6 /mount

    cat /mount/etc/fstab

    In our example sdb6 is your root partition. You should use your root partition
    here.


    That is all there is to it. Your restored system is ready to use.


    ## 7.2.11 More information on Microlite products


    For information on advanced features consult the Microlite User''s Guide and the
    Microlite Web site at:


    http://www.microlite.com


    ## 7.3 Arkeia


    Arkeia is a complete client/server backup solution for Linux and other platforms.
    In this section, we will prepare the installation of Arkeia.


    The requirements for the server:


    + * A 486 processor or higher

    * 32 MB RAM

    * 1 GB disk space

    * SCSI adapter card

    * SCSI tape drive

    * TCP/IP services

    * Linux 2.0 or higher


    The requirements for the client:


    - * A 486 processor or higher

    * 5 MB disk space


    In the following sections we describe how to install, configure and use the Arkeia
    backup software.


    ### 7.3.1 Installing Arkeia


    Arkeia is available in different package formats (tar, rpm) for different distributions
    either on CD or downloadable from Arkeia''s Web site (follow the link http://www.arkeia.com)
    in the DOWNLOAD AREA. To install Arkeia, we recommend that you follow the installation
    procedure described in the Installation and Quick Start Manual. You can find this
    manual on the Arkeia-CD or download it from Arkeia''s Web site.


    On the Arkeia server, you must also install the client and the GUI package. These
    packages are required to configure the backup server. After the installation of
    the client and GUI packages, you can install the server package.

