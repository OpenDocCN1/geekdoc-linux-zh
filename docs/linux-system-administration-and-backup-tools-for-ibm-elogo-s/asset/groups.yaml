    ## 2.6 使用 RPM 进行包管理


    包管理也可以直接在命令行中通过 Red Hat 包管理器 (RPM) 进行。图形界面中的命令行可以通过第 2.3 节（见第 10 页“获取 X-Windows
    终端窗口”）描述的终端窗口访问。表 2 显示了一些 RPM 命令最常用的版本。


    表 2. 基础 RPM 命令


    | 命令 | 描述 |

    | --- | --- |

    | rpm -q <package> | 如果已安装包，则检查已安装包的版本和构建次数。 |

    | rpm -qi <package> | 获取有关已安装包的更多信息。 |

    | rpm -qa | 列出所有已安装的包。 |

    | rpm -qf <filename> | 确定 <file> 属于哪个（已安装的）包。 |


    第 2 章 Caldera OpenLinux 基础系统管理 17


    | 命令 | 描述 |

    | --- | --- |

    | rpm -Uvh <package.rpm> | 更新/安装文件 package.rpm 显示进度条。 |

    | rpm -F -v *.rpm | 使用当前目录下的 RPM 文件更新（刷新）所有当前已安装的包。 |

    | rpm --help* | 获取关于不同选项和参数的帮助。 |


    > 注意

    > 在你安装包时，你必须定义全局偏好。Caldera OpenLinux 每个用户都有自己的默认组。默认 GID 是下一个可用的，GID 编号从 500 开始。关于关于
    RPM 的更多信息可以在手册 (man rpm) 以及 /usr/doc/en/HOWTO.txt 中找到，或者访问网站 http://www.rpm.org。在你安装包后，你可能需要运行一些
    NIS 查找。


