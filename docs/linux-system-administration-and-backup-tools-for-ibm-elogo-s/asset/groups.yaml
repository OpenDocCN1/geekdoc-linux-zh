    mail:/home #\n```\n\nFigure 180. Viewing file permissions\n\nUsing the user \"\
    linux\" as an example:\n\n![](img/4e6a76e57a4105be55d8a1cc0750b023_182_0.png)\n\
    \nFigure 181. Explanation of ls is in the file/directory permissions.\n\nWhat\
    \ are we most interested in the file/directory permissions. This signifies a lot\
    \ of information in a short amount of space:\n\n- d - The first character in the\
    \ permissions signifies that this is a directory. \nOther files are represented\
    \ by:\n\n- + - a normal file.\n- l a symbolic link to another file.\n- c refers\
    \ to files in the /dev directory. This signifies the file represents a character\
    \ device.\n- b refers to files in the /dev directory. This signifies the file\
    \ represents a block device.\n\nrwx - In this case it allows only the owner of\
    \ the file (in this case \"linux\") to read, write and execute this file.\n\n\
    | Type | Owner | Group | World |\n| --- | --- | --- | --- |\n| d | rwx | --- |\
    \ --- |\n\nThe owner of the file is the user that created the file. The group\
    \ part is the group that owns the file (for example, the group users). The world\
    \ part means everyone else; setting a permission in the world part sets the permission\
    \ for every user, the group can read and execute the file, and everyone can read\
    \ and so on.\n\nHere is another example:\n\n```\n-rwx-xr-x\n```\n\nThis means\
    \ that this is a normal file, the owner can read, write, execute the file, and\
    \ everyone else can read the file, but not modify or execute it.\n\nIf you set\
    \ a directory as:\n\n```\ndrwxrrw-rw-\n```\n\nyou are saying that only the directory\
    \ owner is allowed to execute something \"inside\" the directory. If another user\
    \ tries to change directory into it, they will get a \"permission denied\" error.\
    \ This is exactly what happens with regards to home directories.\n\nTo change\
    \ the permissions on a file, you use chmod. Only root can modify files that do\
    \ not belong to them. You must own the file to be able to change its permissions.\n\
    \nThe easiest way to change permissions is to use symbolic representations of\
    \ what you want permissions to be.\n\nNote: The other way to represent file permissions\
    \ is to use octals. For more information about this see the chmod man page.\n\n\
    ```\nchmod g+rw myfile\n```\n\nThe command above allows all members of the group\
    \ to be able to read and write. If you used - (minus sign) instead of plus, you\
    \ would be taking away those permissions. This would mean that members of the\
    \ group would not be allowed to read or write the file. You can mix adding and\
    \ removing permissions in the same command:\n\n```\nchmod u+x-rw myfile\n```\n\
    \nThis will allow executing the file, but not allow reading or writing for the\
    \ owner. Here is a summary of symbolic representations available in chmod:\n\n\
    - r - read\nw - write\nx - execute\ns - set the SUID bit. This says that if the\
    \ file is executable, it will run as the owner of the file, not as the user.\n\
    \n## 6. Backup recovery\n\nOne of the items system administrators should maintain\
    \ well-established routines for backup and recovery. Your data is very valuable.\
    \ If it is lost, it costs you time and money to recreate. If you are unable to\
    \ recreate the information, it could devastate your business. Modern hardware\
    \ is quite reliable, but may still fail. The most critical parts of hardware for\
    \ storing data are hard disks. Different RAID implementations minimize the consequences\
    \ of hard disk failures. Even a RAID configuration may fail for one reason or\
    \ the other. Software is unreliable by nature. Humans can make errors or be malicious\
    \ and try to destroy data.\n\nTherefore, back up your data. Be sure that the restoration\
    \ and recovery of data from the backup media works reliably. The term recovery\
    \ implies the restoration of files from backup tape(s) in a production environment\
    \ and the recovery of a whole system after a possible crash. Backup and recovery\
    \ are mainly planning and organizational tasks. Managing and protecting your data\
    \ utilizing a Linux operating system can be easily accomplished with commercially\
    \ available products (for BRU, Arkeia, BackupEDGE, etc.).\n\nIn a Linux environment,\
    \ backup devices are named /dev/st for rewinding and /dev/nst for non-winding\
    \ SCSI device. SCSI tape devices or \"floppy\" drives that some backup packages\
    \ support may use a different naming scheme.\n\nFor more in-depth information\
    \ about backup strategy, media and hardware, consult the IBM Redbook, Netfinity\
    \ Tape Solutions, SG24-5218. This redbook can be downloaded from the following\
    \ site:\n\n```\nhttp://www.redbooks.ibm.com/\n```\n\nYou can also find valuable\
    \ information in The Linux System Administrator's Guide by Lars Wirzenius and\
    \ Joanna Oja. This book can be obtained in PDF format from the following site:\
    \ http://www.linuxdoc.org/, then search on Backup Media.\n\nYour first step in\
    \ putting together a viable backup solution is to choose the backup media. It\
    \ should be removable and stored in a safe place. It cannot be one of the disk\
    \ drives in your system. Your selection of media should be either floppy, tape,\
    \ ZIP media, or magneto-optical disk. Using copies as backup media can be unsuitable\
    \ if a large amount of data should be backed up or unattended operation is an\
    \ important issue. Mostly, SCSI or Atari tape is a suitable choice. The cost and\
    \ availability may help you decide. If SCSI is your preferred choice, you have\
    \ to choose between QIC, DAT, EXABY or DLT tapes of different capacities. The\
    \ amount of data to be backed up and the cost of the backup device(s) and media\
    \ may determine your decision. Some of the backup packages support libraries.\n\
    \nChoosing the right media may also depend on the backup tool you want to use\
    \ and whether it supports your media.\n\nEvery IBM @server xSeries and Netfinity\
    \ system has a built-in SCSI controller. We recommend you choose a SCSI device\
    \ for your backup. You can choose between different technologies (QIC, DAT, EXABY,\
    \ or DLT) depending on the amount of data to be stored and the speed required.\n\
    \n### 6.1 Backup Hardware\n\nThe products listed in Table 8 are currently available\
    \ for IBM @server xSeries and Netfinity servers and support at least one backup/restore\
    \ package by Linux:\n\nTable 8. Linux backup tools, supported by Netfinity tape\
    \ devices\n\n| Tape device | Arkeia | BackupEDGE | BRU |\n|---|---|---|---|\n\
    | IBM 35/70 GB DLT tape drive (SCSI-2) | x | x | x |\n| IBM 20/40 GB DLT tape\
    \ drive (SCSI-2) | x | x | x |\n| IBM 20/40 GB 8 mm tape drive (SCSI) | x | x\
    \ | x |\n| IBM 10/20 GB NS tape drive (SCSI-2) | x | x | x |\n| IBM 100/200 GB\
    \ Internal LTO Tape Drive (SCSI-2) | x | x | x |\n"
