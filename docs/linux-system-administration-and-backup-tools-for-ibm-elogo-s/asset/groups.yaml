    ## 4.2 Package management using RPM


    Package management can also be done with the Red Hat package manager (RPM). The
    following table shows some of the frequently used commands.


    | Command | Description |

    |---|---|

    | rpm -q <package> | If installed, check version and build number |

    | rpm -qi <package> | Obtain some more information about installed package |

    | rpm -qa | List all installed packages |

    | rpm -qf <filename> | Determine the package that <filename> belongs to |

    | rpm -Uv <package>.rpm | Update/Install the package.rpm showing a progress bar
    |

    | rpm -F -v *.rpm | Update all installed packages using the files in the current
    directory |

    | rpm --help | Get some help about the different options |


    > > Note

    run SuSEconfig afterwards! Some packages require post-installation maintenance.
    More information and options about RPM can be found in the manual page (man rpm),
    the RPM how-to

    (less /usr/share/doc/howto/en/RPM-HOWTO.gz) and on the RPM Web site at http://www.rpm.org.
    You can also display a short overview by running

    rpm --help.


    ## 4.3 User and group administration using YaST


    Linux is a multi-user operating system. To differentiate between the various users,
    each user has to log in with a unique user name and password. Each user belongs
    to a primary user group, but they can also be a member of other groups (up to
    16). Each user is named with a user ID (UID), which is also unique throughout
    the system. The same applies to user group names and IDs (GIDs).


    Usually each user has a personal home directory. This is space on the file system
    (usually a directory below /home/username) that belongs to a person and where
    the person can store their personal files. Other users generally have no access
    to the files stored in another user''s home directory.


    You should carefully consider adding groups before adding users. Sometimes there
    are concerns about restricting access to some parts of the user system. You can
    do this by creating separate groups to control access to various files and filesystems.
    Also if you are going to be a system with many users, you should create separate
    groups divided by what they are on the system.


    Another concern in setting up users and groups is that you may want to share files
    with other systems. This can be done by CD-ROM, tape, diskette or similar device.
    You can use the network to share information with NFS,

