  mdcn: "\n\n- 1. 校验和验证 - 在写入归档时，会为每个数据块计算一个校验和。校验和存储在数据块的头部。校验和验证将读取每个数据块，重新计算校验和，并将校验和与头部中的值进行比较。每个文件在验证时都会被列出，并带有发现的任何错误。如果没有发现任何错误，说明你拥有了一个准确的备份。\n\
    \n- 2. 比较验证 - BRU 会将硬盘上的文件与归档进行比较。任何差异，例如修改时间、大小或归档中硬盘上未留存的文件，都会被记录下来。验证完成后，将发布差异结束的通知。\n\
    \n## 7.1.12 总结\n\n有关高级功能的信息，请参阅《BRU 用户指南》或访问 BRU 网站：\n\n```\nhttp://www.estinc.com/\n\
    ```\n\n## 7.2 Microlite BackupEDGE\n\nBackupEDGE 是一个针对 Linux 平台的完整备份解决方案。它简单易用且非常健壮。通过\
    \ BackupEDGE，你可以安全地归档文件系统上的每个文件、目录、设备节点和特殊文件。与忽略许多重要文件的标准 tar 命令不同，BackupEDGE\
    \ 还会验证写入磁带的每个字节数据，以确保磁带是你数据的准确反映。以下是 BackupEDGE 软件提供的功能：\n\n- 数据压缩 - 支持自动数据压缩。\n\
    - 菜单界面 - 几乎所有功能都可以通过直观的菜单系统访问。\n- 远程磁带支持 - 你可以通过网络备份计算机。\n- 高性能 - 高级双缓冲和可变块因子。\n\
    - 虚拟文件支持 - 你可以备份虚拟（稀疏）文件。\n- 多卷/多设备归档 - 自动跨越多个卷或设备。\n- 通配符支持 - 在选择文件时可以使用通配符。\n\
    - 原始设备备份 - 你可以将整个原始设备/分区归档到磁带。\n- 全备份/增量备份\n- 无监督操作 - 你可以执行全备份或仅备份更改的文件。\n\nBackupEDGE\
    \ 设计用于在 Linux Kernel 2.x 上运行，并提供了多种类型库的版本。\n\n在接下来的章节中，我们将描述如何安装、配置和使用 Microlite\
    \ BackupEDGE 备份软件。\n\n注意\n我们建议不要将磁带设备连接到 IBM ServeRAID 适配器。为磁带设备使用独立的 SCSI 控制器。\n\
    \n### 7.2.1 安装 Microlite BackupEDGE\n\n在安装 BackupEDGE 之前，你必须识别备份设备的设备条目。通常 Linux\
    \ 下的磁带设备被分配在设备节点 /dev/st0, /dev/st1...。每个磁带设备都会创建一个不回位的设备，即 /dev/nst0, /dev/nst1...\
    \ 在我们的示例中，我们使用 /dev/st0 作为磁带设备，使用 /dev/nst1 作为不回位设备。\n\n在我们的示例中，我们使用磁盘作为安装媒体。要安装该产品，请遵循以下步骤：\n\
    \n- 1. 以 root 身份登录。\n2. 切换到根目录 \"/\"。\n3. 将带有产品的磁盘插入软驱驱动器并执行命令：\n   tar xvf /dev/fd0\n\
    \   其中 /dev/fd0 是你的软盘设备。\n4. 执行以下命令完成安装：\n   tmp/init.edge\n\n你将看到一个类似于图 188 的窗口。\n\
    \n```\nroot@xxxx: ~ /\nFile Sessions Options Help\nBackupEDGE Installation / Upgrade\
    \ / Configuration\n\nBackupEDGE 01.01.08 安装管理器\n此程序将引导你完成在 във系统上\n安装、升级和/或\n\
    配置 BackupEDGE 所需的步骤。\n\n[Begin]                               [Exit]\n\n(c) Copyright\
    \ 1997-2000 by Microlite Corporation\n```\n\n**188.** 安装对话框开始\n\n安装程序引导你完成安装过程。窗口非常直观。在安装过程中，你还可以配置你的备份设备。在安装过程中，系统会提示你配置你的备份设备。\n\
    \n现在你已准备就。\n\n*Resource Manager* 和 *Defining Devices* 可以通过在命令行输入 `edge.resmgr`\
    \ 或 `edge.config` 启动。\n\n你可以点击 **Admin** 菜单来执行这些操作。\n\n### 7.2.2 磁磁带\n\n在开始备份之前，你应该初始化磁带。要执行此操作，遵循以下步骤：\n\
    \n- 1. 执行命令 `edgemenu` 启动程序。\n  你将看到一个类似于图 189 的窗口。\n\n```\nroot@xxxx: ~ /\nFile\
    \ Sessions Options Help\nBackupEDGE Installation / Upgrade / Configuration\n\n\
    BackupEDGE 01.01.08 安装管理器\n此程序将引导你完成在 във系统上\n安装、升级和/or\n配置 BackupEDGE 所需的步骤。\n\
    \n[Begin]                               [Exit]\n\n(c) Copyright 1997-2000 by Microlite\
    \ Corporation\n```\n\n2. 在 Admin 菜单中选择初始化磁带。\n你将看到一个类似于图 190 的窗口。\n\n```\nroot@xxxx:\
    \ ~ /\nFile Sessions Options Help\nBackupEDGE Installation / Upgrade / Configuration\n\
    \nBackupEDGE 01.01.08 安装管理器\n此程序将引导你完成在 във系统上\n安装、升级和/or\n配置 BackupEDGE 所需的步骤。\n\
    \n[Begin]                               [Exit]\n\n(c) Copyright 1997-2000 by Microlite\
    \ Corporation\n```\n\n3. 选择初始化磁带并按回车。磁带将初始化。你会收到一条磁带已成功初始化的消息。按回车继续。\n\n你可以通过选择\
    \ Verify 菜单中的 Tape 来检查磁带属性。你将看到一个类似于图 191 的窗口。\n\n![](img/4e6a76e57a410be5d8a1cc0750b023_205.png)\n\
    \n### 3. 首次备份\n\n在本节中，我们将展示如何备份所需的文件或目录。你可以在 edgemenu 工具中执行备份。遵循以下步骤进行示例备份：\n\n\
    - 1. 执行以下命令 `/usr/bin/edgemenu` 启动程序。\n  你将看到一个类似于图 192 的窗口。\n\n```\nroot@xxxx:\
