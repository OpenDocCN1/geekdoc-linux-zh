    ## 7.2.10 RecoverEDGE


    通过使用 RecoverEDGE 工具你可以创建应急恢复盘以在灾难时重建系统。RecoverEDGE 处理重建 FDisk、分区和/或切片表、构建文件系统以及恢复数据的细节，即使硬盘大小发生了变化。RecoverEDGE
    使用你的系统备份，因此不需要为了保护而关闭系统。你甚至可以通过网络进行恢复。


    使用 RecoverEDGE 恢复系统非常简单。要恢复系统，你应该执行以下任务：


    - 1. 识别并纠故障原因。

    - 2. 从 RecoverEDGE 盘启动。

    - 3. 重新配置你的文件系统。

    - 4. 恢复备份。

    - 5. 关闭并重启。

    - 6. 系统就绪。


    > 注意

    RecoverEDGE 使用主备份和增量备份进行恢复，因此数据的准确性取决于这些备份。


    ## 7.2.10.1 创建 RecoverEDGE 启动盘


    在使用 RecoverEDGE 进行灾难恢复之前，你应该构建一组启动盘。创建启动盘请遵循以下步骤：


    - 1. 启动创建 RecoverEDGE 启动盘的工具：


    ```

    /usr/bin/re2

    ```


    或在菜单中进入 **Admin > Make RecoverEDGE Media**。

