    ## 7.2.9 Defining the devices for making backups


    Any time after installation when you configured your backup device, you can change
    which device the backup software uses for each backups. If you are logged in as
    root, you will define devices for the root user. Usually this is the only user
    doing backups on the system. Follow these steps to enter resource manager for
    backups:


    - 1. Start the edge.config menu by executing the command:

    `/usr/bin/edge.config`


    You will see a window similar to Figure 219.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_224_0.png)


    2. Here you need to define the devices for attended and unattended backups.

    3. Type in A and press Enter to define the device for attended backups. You will
    see a window similar to Figure 220.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_226_0.png)


    4. Press Enter to continue. In the next window you will see all defined devices.
    Type in the device you want and press Enter to continue. You will see a window
    similar to Figure 221.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_227_0.png)


    Figure 221. After definition of unattended backup device


    - 5. Follow the steps from 1-4 for the unattended device also.


    ## 7.2.10 RecoverEDGE


    By using the RecoverEDGE tools you can create emergency recovery diskettes to
    rebuild your system in the case of disaster. RecoverEDGE handles the details of
    reconstructing your FDisk, partition, and/or slice tables, building your file
    systems and restoring your data, even if your hard drive size has changed. RecoverEDGE
    uses your system backups, so there is no need to shut down your system in order
    to protect it. You can even restore over the network.


    With RecoverEDGE restoring the system is very easy. To recover the system you
    should follow these tasks:


    - 1. Identify and correct the cause of the failure.

    - 2. Boot from the RecoverEDGE disks.

    - 3. Reconfigure your file systems.

    - 4. Restore your backups.

    - 5. Shut down and reboot.

    - 6. System is ready to use.


    > Note

    > RecoverEDGE uses your master and incremental backups for recovery, so the accuracy
    of the data depends on these backups.


    ## 7.2.10.1 Creating the RecoverEDGE boot disks


    Before you can use RecoverEDGE for disaster recovery you should build a set of
    boot disks. To create the boot disks follow these steps:


    - 1. Start the utility for creating the RecoverEDGE boot disks:


    ```

    /usr/bin/re2

    ```


    or go to **Admin > Make RecoverEDGE Media** in the menu.

    You will see a window similar to Figure 222.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_228_0.png)


    Figure 222. *RecoverEDGE utility*


    - 2. Select the **Configure** option and press Enter, and you will see a window
    similar to Figure 223.

