    #  5.5 User and group administration


    Linux is a multi-user operating system. To differentiate between the various users,
    each user has to log in with a unique user name and password. Each user belongs
    to a primary user group, but can also be a member of additional groups or up to
    16 groups. Each user is assigned a numeric identifier called a UID (User Identifier)
    which is unique throughout the system. Groups also have a numeric GID (Group Identifier),
    that is unique to the system as well. For environments where security is handled
    by individual machines, this can be important, since some services rely on the
    UID and GID to determine permissions. Those issues can be resolved using NIS (Network
    Information Service) or LDAP (Lightweight Directory Access Protocol), but for
    now we will put those questions aside and look at the menu system TurboLinux provides
    for managing groups and users on individual machines.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_157_0.png)


    Issuing the command `turbousercfg` creates the window shown in Figure 152. On
    it you will have the ability to manage **Users** and **Groups**.


    #  5.5.1 Adding new groups


    You should consider adding groups before adding users. Sometimes there are concerns
    about restricting access to some parts of the file system. You can do this by
    creating separate groups to control access to various'
