    the layout of the system disks. Following a well-planned backup scheme

    also a prerequisite.


    To recover after a disaster crash, you need the last full backup media and all

    subsequent incremental backup media created with BackupEDGE.


    # 6.3.3 Arkeia


    Arkeia is a backup and restore solution that allows centralized network

    ackup in a client/server architecture. With Arkeia, you can also back up

    UNIX, Windows, NT or Novell clients.


    With Arkeia you can safely archive every file, directory, device node and

    special file on your file systems, unlike the standard UNIX tar command,

    which ignores many important files. Arkeia also verifies the data written

    tape to ensure that the backup is an accurate reflection of the data.

    The following are features provided by Arkeia backup software:


    +   - Data compression - automatic data compression is supported.

    - GUI and CLI interface.

    - The backup server may be your local system or a remote system.

    - High performance - advanced double buffering and variable block factors.

    - Virtual file support - you can back up virtual (sparse) files.

    - Multi-volume / multi-device archives - automatic spanning across multiple

    volumes or devices.

    - Wildcard support - when selecting files you can use a wildcard.

    - Raw device backups - you can archive an entire raw device/partition to

    tape.

    - Master / incremental backups.

    - Unattended operation - you can configure schemes to periodically perform

    full backups and/or incremental backups.


    Arkeia is designed to operate on Linux kernels 2.x and there are versions

    available for several types of libraries (libc5 and libc6) and distributions.

    Arkeia supports only devices connected to SCSI-controllers and also tape

    libraries.


    You can find Arkeia''s Web site at http://www.arkeia.com.


