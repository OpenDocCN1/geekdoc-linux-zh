    rwx - In this case allows only the owner of the file (in this case linux) read,
    write and execute this file.


    | Type | Owner | Group | World |

    | --- | --- | --- | --- |

    | d | rwx | ... | ... |


    As you can see, the format of the string is becoming a bit easier to read.

    The owner of the file is the user that created the file. The group part is the
    group that owns the file (for example, the group users). The world part means
    everyone else. Setting a permission in the world part sets the permission for
    every user, irrelevant of their group membership and so on.


    Here is another example:


    ```

    -rwx-xr-

    ```


    This means that is a normal file, the owner can read, write and execute the file,
    the group can read and execute the file, and everyone else can read the file,
    but not modify or execute it.


    As for directories, if you set a directory as:


    ```

    drwxr-rw-

    ```


    you are saying that the directory owner is allowed to execute something "inside"
    the directory. So if another user tries to change directory (cd) into this directory,
    they will get a "permission denied" error message. This is exactly what happens
    with regards to users'' home directories.


    To change the permissions on a file, use the chmod command. Only root can modify
    files that do not belong to you. you must own the file to be able to change its
    permissions.


    The easiest way to change permissions is to use symbolic representations of what
    you want permissions to be.


    ```

    chmod g-rw myfile

    ```


    This is one of the simplest ways of changing a permission. You are saying that
    you want the file myfile to allow all members of the group to be able to read
    and write to it.'
  - '[PAGE 72]


    If you used - (minus sign) instead of a plus, you would be taking away those permissions.
    This would mean that members of the group would not be allowed to read or write
    to the file.


    You can mix adding and removing permissions in the same command:


    ```

    chmod u+x-rw myfile

    ```


    This will allow executing the file, but will not allow reading or writing the
    file for the file owner.


    Here is a summary of the symbolic representations available in the chmod command:


    +   - r - read

    - w - write

    - x - execute

    - + - add the permissions

    - s - set the SUID bit. This says that if the file is executable, it will run
    as owner of the file, not as the user that is running the file.


    # 3.4 Setting up your hardware


    To set up your hardware from the command line, you need to be aware of devices
    you have on your system. Knowing your hardware and how to set it up will pay off
    later in the time saved.


    # 3.4.1 Determining your hardware


    There are several ways you can do this. These methods include:


    +   - Bootup messages: The system will attempt to find hardware devices when you
    boot up. It may recognize the hardware devices and then use modules that are compiled
    in the kernel or modules that are loaded separately. Sometimes the system will
    recognize the hardware but will be unable to load the modules due to some hardware
    inconsistencies or version dependencies.

    - dmesg: This is a command that you can run anytime and will display many of the
    messages that you see on bootup.'
  - '[PAGE 73]


    - Mail - Linux can give you a copy of the configuration and boot messages for
    every reboot. This can be more extensive than the messages from dmesg. To get
    access to these messages, type `mail`.


    - Other tools: There are public domain utilities like Lothar that you can use
    to determine your hardware characteristics.


    An understanding of the hardware configuration is very important because Linux
    allows you to have more control over your system than other operating systems.
    It also allows you to fix problems more quickly because information is not hidden.


    You can also determine what hardware the system has by looking in the file system
    /proc. This file system is not a directory at all but a window into memory. It
    does have files and directories, but they are not saved onto the disk. You will
    see what the thinks exists in terms of hardware. You will also see the contents
    of the ones in this file system in Figure 68. In this case it is the interrupts
    file, which shows the interrupts that appear to be used. There are several other
