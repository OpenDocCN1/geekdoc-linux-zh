    # Chapter 6. Backup recovery


    One of the items system administrators should maintain well-established routines
    for backup and recovery.


    Your data is very valuable. If it is lost, it costs you time and money to recreate
    them. If you are unable to recreate the information, it could devastate your business
    or operation.


    Some of the reasons you can lose your data are hardware failures, software malfunctions,
    human failures, and natural disaster. Modern hardware is quite reliable, but may
    still fail. The most critical parts of hardware for storing data are hard disks.
    The different levels of RAID implementations minimize the consequences of hard
    disk failures. Even a RAID configuraton may fail for one reason or the other.
    Software is unreliable by nature. Humans can make errors or can be malicious and
    try to destroy data.


    Therefore, back up your data.


    If you back up your data, be sure that the restoration and recovery of data from
    the backup media works reliably.


    The term recovery implies the restoration of files from backup tape(s) in a production
    environment and the recovery of a whole system after a possible disk crash. Backup
    and recovery are mainly planning and organizational tasks. The managing and protecting
    of your data utilizing a Linux operating system can easily be accomplished with
    commercially available products (for BRU, Arkeia, BackupEDGE, etc.).


    In a Linux environment, backup devices are named /dev/stx for the x-th rewinding
    and /dev/instx for the x-th nonwinding tape SCSI-device. ATAPI tape devices or
    "floppy" drives that some backup packages support may use a different naming scheme.


    For more-in-depth information about backup strategy, media and hardware, consult
    the IBM Redbook, Netfinity Tape Solutions, SG24-5218. This redbook can be downloaded
    from the following Web site:


    ```

    http://www.redbooks.ibm.com/

    ```


    You can also find valuable information in The Linux System Administrator''s Guide
    by Lars Wirzenius and Joanna Oja. This book can be obtained in PDF format from
    the following Web site: http://www.linuxdoc.org/, then search on Backup Media.'
  - '[PAGE 187]


    Your first step in putting together a viable backup solution is to choose the
    backup media. It should be removable and stored in a safe place. It cannot be
    one of the disk drives in your system. Your selection of media should be either
    floppy, tape, ZIP media, or magneto-optical disk. Using copies as backup media
    can be unsuitable if a large amount of data should be backed up or unattended
    operation is an important issue. Mostly, SCSI or ATAPI tape is a suitable choice.
    The cost and availability may help you decide. If SCSI is your preferred choice,
    you have to choose between QIC, DAT, EXABY or DLT tapes of different capacities.
    The amount of data to be backed up and the cost of the backup device(s) and media
    may determine your decision. Some of the backup packages support libraries.


    Choosing the right media may also depend on the backup tool you want to use and
    it supports your media.


    Every IBM @server xSeries and Netfinity system has a built-in SCSI controller.
    We recommend you choose a SCSI device for your backup. You can choose between
    different technologies (QIC, DAT, EXABY, or DLT) depending on the amount of data
    to be stored and the speed required.


    # 6.1 Backup Hardware


    The products listed in Table 8 are currently available for IBM @server xSeries
    and Netfinity servers and support at least one backup/restore package by Linux:


    Table 8. Linux backup tools, supported by Netfinity tape devices


    | Tape device | Arkeia | BackupEDGE | BRU |

    |---|---|---||

    | IBM 35/70 GB DLT tape drive (SCSI-2) | x | x | x |

    | IBM 20/40 GB DLT tape drive (SCSI-2) | x | x | x |

    | IBM 20/40 GB 8 mm tape drive (SCSI) | x | x | x |

    | IBM 10/20 GB NS tape drive (SCSI-2) | x | x | x |

    | IBM 100/200 GB Internal LTO Tape Drive (SCSI-2) | x | x | x |


    176 Linux System Administration and Backup for IBM @server xSeries and Netfinity'
