    # 7.2.5 Master and incremental backups


    Usually system administrators perform called master and incremental backups. The
    master backup is a backup of all files on the system. Incremental backup is a
    backup of only those files that have changed from the last master backup. When
    you need to restore your data, restore the master backup and the last incremental
    backup. BackupEDGE can perform different types of incremental backups. Refer to
    the BackupEDGE manual for the explanation of incremental backups can be performed
    from the edgemenu utility.


    To perform a master backup follow these steps:


    +   1. Start the edgemenu program by executing the following command:

    edgemenu

    nYou will see a window similar to Figure 192 on page 195.

    2. Select Backup > Master Backup, and you will see a window similar to Figure
    201.


