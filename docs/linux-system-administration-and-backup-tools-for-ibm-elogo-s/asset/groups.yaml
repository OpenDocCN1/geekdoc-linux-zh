    # 4.7 System administration with Yast2


    If you prefer to use a GUI to administer your system, Yast2 is the answer. It
    has an easy-to-use point-and-click interface to allow first time UNIX administrators
    to configure a server quickly and efficiently.


    Yast2 is a shell that holds a collection of modules (not to be confused with kernel
    modules). These modules provide the GUI component to configure a certain part
    of your Linux system.


    Yast2 is a relatively new SuSE application, and more modules are added with every
    SuSE release. If Yast2 is not capable of configuring any part of the system that
    you wish to maintain, either use Yast1 or configure the service manually.


    The SuSE technical manual details a wide range of administration procedures, and
    as such should be consulted if you are unsure of a procedure.


    Chapter 4, SuSE Linux basic system administration 103'
  - '[PAGE 115]


    # 4.7.1 Yast2: Main window


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_115_0.png)


    Figure 108. Yast2: Main window


    Yast2 is an X-Windows application, so before you begin you need to have loaded
    up X before we can proceed. To load X-Windows, at the command prompt type:


    ```

    startx

    ```


    > Note\To set up your system to boot into X-Windows instead of the console, see
    Section 3.6.5 Login Configuration in the SuSE manual.


    Once you have loaded X-Windows, click the Yast Menu button on the bottom of the
    window (it is a gecko with a hammer and spanner behind it). Select Yast2 - All
    Yast2 modules. You will be presented with the window in Figure 108.


    The left-hand pane of Yast2 shows what you can configure on your system:'
  - '[PAGE 116]


    +   * Hardware/Printer - Configure your printer. This can be a Novell, parallel

    port, USB, network, or SAMBA (Windows) printer.

    * Hardware/Sound - Configure your sound device.

    * Install/Remove Packages - Add and remove packages from your system.

    * Network/Base - Configure your network settings, including network

    devices and IP addresses.

    * Network/Modem+ISDN - Configure your modem or ISDN adapter,

    including device configuration and ISP configuration.

    * Network/NFS - Maintain NFS exports and NFS imports for the system.

    * Network/NIS client - Configure your machine as a NIS client.

    * Network/Sendmail - Set the behavior of sendmail on the

    server.

    * Network/Services - Create, modify and remove network services from the

    server. This is commonly known as *inetd*.

    * System Tuning - Speed up techniques for your system. At the moment

    this only allows IDE disk performance increase via UDMA.

    * Yast2 Remote Administration - Allows you to administer another SuSE

    server from a central location.

    * Yast2 Remote Install - Allows you to install SuSE on another computer

    via a serial port.


    We will discuss the most useful aspects of Yast2 to a user installing on a

    server configuration.


    #  4.7.2 Yast2: Network configuration


    To start a module, select it from the left-hand pane shown in Figure 108 and

    click **Launch Module**.


    Our first Yast2 module is the Network/Base configuration module. After

    selecting the module as detailed above you will be presented with the window

