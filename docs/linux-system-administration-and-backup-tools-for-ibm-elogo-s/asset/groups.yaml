    `/usr/lib/edge/bin/edge.resmgr`


    你将看到一个类似于图 211 的窗口。


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_219_0.png)


    2. 选择 New Resource（新资源）并按回车键。你将看到一个类似于图 212 的窗口。


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_219_1.png)


