    /etc/rc.d/rc3.d/ Once turboservice is running, the columns are laid out in an
    easy-to-understand format:


    +   * An in the Enabled column means that TurboLinux will try to start this service
    when the runlevel is started.

    * An in the Running column means that the service is running at the moment.


    The options at the bottom of the window are also simple: Start or Stop a service,
    as well as choose to Enable or Disable a service.


    Selecting the Advanced option takes you the window shown in Figure 174. Here you
    can choose to enable services to start in runlevel 1-5.


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_177_0.png)


    Figure 174. Advanced Service Menu window


    Turboservice does not edit the services to stop. If you would like to do that,
    you must create symbolic links from /etc/rc.d/init.d/ to the runlevel you would
    like to edit. For example, if you wanted your Web server to stop if you entered
    runlevel 2, you would type the following command:


    ```

    ln -s /etc/rc.d/initd/httpd /etc/rc.d/rc2.d/K15httpd

    ```


    Of course, you could use a number other than 15. We use it here because that is
    the default for the HTTPD service.'
