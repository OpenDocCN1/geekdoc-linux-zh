    # Chapter 4. SuSE Linux basic system administration


    This chapter will give you an overview of how to perform the most common administrative
    tasks on a SuSE Linux system. Most of these tasks can be done with YaST, SuSE''s
    configuration and administration tool. However, you may still edit the different
    configuration files, if you wish. YaST will detect manual changes and will not
    overwrite them.


    # 4.1 Adding and removing software packages using YaST


    SuSE Linux uses the RPM package manager to manage software packages of the distribution.
    RPM uses a database to store information about all files that belong to a certain
    package, including some additional information about the package. RPM itself is
    a command-line program. You can use it from the command line to add, remove or
    obtain information about software packages and system files. See 4.2,"Package
    management using RPM on page 85 for more details. YaST,s administration and configuration
    tool, can act as a user-friendly front to RPM.


    To install or remove software packages, insert the CD-ROM and start SuSE''s installation
