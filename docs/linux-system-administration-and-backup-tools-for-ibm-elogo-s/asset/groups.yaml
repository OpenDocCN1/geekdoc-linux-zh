    \ is listed in the directory listing in Figure 68.\n\n| lsmod | Size | Used by\
    \ |\n| --- | --- | --- |\n| nfsd | 141194 | 8 (autoclean) |\n| nfs | 377904 |\
    \ 1 (autoclean) |\n| lockd | 29112 | 1 (autoclean) [nfs nfs] |\n| sunrpc | 48700\
    \ | 1 (autoclean) [nfs nfs lockd] |\n| pnet32 | 9094 | 0 |\n| ibcs | 115616 |\
    \ 0 |\n| parport_probe | 2940 | 0 (autoclean) [unused] |\n| ip | 4960 | 0 (unused)\
    \ |\n| parport | 6676 | 0 [parport_probe lp] |\n| vfat | 9092 | 0 (unused) |\n\
    \nFigure 69. The lsmod command\n\nIf you need to add a module, you can determine\
    \ the module name by going to the directory `/lib/modules` as you see in Figure\
    \ 70.\n\n```bash\n[root@redhat ~]# cd /lib/modules\n[root@redhat modules]# ls\n\
    ```\n\n```\n2.2.16-22\n[root@redhat modules]# cat 2.2.16-22\nblock cd misc modules.dep\
    \ pcmia scsi uisbd\n35c0.0 cm20020.0 e3210.0 me2k-pci.0 slhc.0\n35c0.0 cms90.eth0\
    \ ns3210.0 slip.0\n35c1.0 cms260.eth1 ni650.0 smc-mca.0\n35c7.0 copsa_0 f8x88.ni152.0\
    \ smc-ultra.0\n35c9.0 cssa.0 hardvill.ni650.0 smc-ultra-32.0\n35d1.0 ca9b0.00\
    \ oymepc.0 scsi34.0\n35e23.0 de4e0.0 hp-lp32.0 pcmnet32.0\n35e27.0 de0e0.0 hp-lp100.0\
    \ pip.0\n35f01.0 de00.0 ibtr.0 tian.0\n35f26.0 de5e0.0 ipq6.0 pellate.0 tulip.0\
    \ vi-chra.0\n8196.0 dprc.0 1rda.0 rtb8139.0 wasnipe.0\nac3200.0 dlci80.0 isrdm.0\
    \ sh8000.0 wavelan.0\narc-iscn.0 eth10.0 sdla.0.adrv.0 wide.0\nalrian-pro.0 eqx01.0\
    \ in3930.0 x25_asay\nelarpas.0 espr0.0 shepher.0 yellowfin.0\nat1700.0 epic100.0\
    \ sk_mca.0 285230.0\nbsd_comp.0 epl1.0 sktr.0\n```\n\nFigure 70. Finding loadable\
    \ hardware modules\n\nThe file that you need to load is the `/etc/modules.conf`.\
    \ This file contains the list of modules that you will load when you boot the\
    \ system. It contains aliases, such as `eth0`, which are linked to the names of\
    \ actual modules that are loaded. Also it contains options that you might need\
    \ to load to make certain hardware work in Linux. When you want a module to be\
    \ included on the boot sequence you can add it to this file. For example, to add\
    \ an IBM ISA token-ring device on boot, create the entry:\n\nAdd the line in the\
    \ `/etc/modules.conf` file and the module will be loaded on bootup.\n\n```bash\n\
    # /etc/modules.conf\nalias eth2 pcmnet32\nalias eth0 pcmnet32\nalias net0-4 off\n\
    alias char-major-14 sb\noptions sb 0x0220 irq=5 dma=1-6 mpu_io=0x0330\n#\n```\n\
    \nFigure 71. /etc/modules.conf file\n\n64 Linux System Administration and Backup\
    \ for IBM @server xSeries and Netfinity\n\n## 3.4.3 Setting up your network\n\n\
    You first need to verify Linux recognized your network hardware. You can look\
    \ at the resources listed in 3.4.1, \"Determining the hardware\" on page 61. If\
    \ you do not see it, you need to verify that the hardware is set up properly.\
    \ You can go to the manuals that the hardware or if the manufacturer has other\
    \ information available. Then you need to see if the hardware is supported. To\
    \ select the supported entries to get the hardware compatibility list for your\
    \ current version of Red Hat Linux, go to:\n\n```\nhttp://www.redhat.com\n```\n\
    \nYou can determine which network cards have modules loaded by looking at Figure\
    \ 69 on page 63. If you do not see the modules for your network card, you need\
    \ to manually load the module or modules with the following command:\n\n```bash\n\
    insmod module_name\n```\n\nWhere the module_name is selected from those in Figure\
    \ 70. If you do not see the module for your specific hardware device then you\
    \ can do research on the Internet. Besides `http://www.redhat.com`, you should\
    \ try the Web site for the manufacturer of the hardware you are using. Many manufacturers\
    \ are making it a point to include support for Linux.\n\nOnce the module is successfully\
    \ loaded, you can add it to the `/etc/modules.conf` file as discussed earlier\
    \ and it will be loaded on bootup.\n\nOnce have all modules loaded, either automatically\
    \ or manually, you need to determine that networking is in place. To see all of\
    \ the network devices that have been recognized and have had their modules loaded,\
    \ type the command:\n\n```bash\nifconfig\n```\n\nIf this is a new device for TCP/IP\
    \ you may find that some items such as the inet address need to be defined.\n\n\
    ```\nifconfig\neth0: flags=BROADCAST,BROIC,MULTICAST,LOOPBACK,UP,RUN  MTU=1500\
    \  ether 00:00:00:00:00:00\n   inet 192.168.1.1  netmask=255.255.255.0  broadcast=192.168.1.255\n\
    \   inet6 fe80::2ff:fe00:0:0/64  scope=link \n                               \
    \   txquelen=1000  packets=0  transmitted=0  errors=0  dropped=0\n```\n"
