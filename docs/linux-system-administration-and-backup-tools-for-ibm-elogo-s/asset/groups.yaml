    # 5.11 File system permissions


    Linux has inherent security features, the most noticeable file system permissions.
    Setting permissions on files allows the system administrator to restrict access
    to parts of the file.


    File permissions can be set on files and directories. The easiest way to see an
    example of this is in the /home directory:


    ```

    mail:/home # ls -l

    total 1 396 Nov 15 21:16

    drwx-xr-x 19 root       487 Nov 15 13:26

    drwx-xr-x 22 root       912 Nov 15 21:05 davej

    drwc-      6 davej users    912 Nov 15 21:03 george

    drwc-      6 george users    912 Nov 15 21:02 ive

    drwc-      6 ive users       912 Nov 15 21:18 jakob

    drwc-      6 jasmin users   912 Nov 15 21:04 jasmine

    drwc-      6 jen users       912 Nov 15 21:04 jens

    drwc-      6 jamins users   912 Nov 15 21:36 jackkins

    drwc-      6 justin users   912 Nov 15 21:06 justin

    drwc-      6 lenz users       912 Nov 15 21:03 lenz

    drwc-      6 linux users     912 Nov 15 21:01 linux

    drwc-      6 malcom users   912 Nov 15 21:04 malcom

    drwc-      6 rachael users   912 Nov 15 21:03 rechael

    drwc-      6 rufus users     912 Nov 15 21:14 rufus

    drwc-      6 ruediger users  912 Nov 15 21:04 ruediger

    drwc-      6 rufus users     912 Nov 15 21:02 rufus

    drwc-      6 ted users       912 Nov 15 21:03 ted

    drwc-      6 uzi users       912 Nov 15 21:04 uzi

    mail:/home #

    ```


    Figure 180. Viewing file permissions


    Using the user "linux" as an example:


    ![](img/4e6a76e57a4105be55d8a1cc0750b023_182_0.png)


    Figure 181. Explanation of ls is in the file/directory permissions.


    What are we most interested in the file/directory permissions. This signifies
    a lot of information in a short amount of space:


    Chapter 5. TurboLinux basic system administration 171'
  - '[PAGE 183]


    d - The first character in the permissions signifies that this is a directory.

    Other files are represented by:


    +   - a normal file.

    - l a symbolic link to another file.

    - c refers to files in the /dev directory. This signifies the file represents
    a character device.

    - b refers to files in the /dev directory. This signifies the file represents
    a block device.


    rwx - In this case it allows only the owner of the file (in this case "linux")
    to read, write and execute this file.


    | Type | Owner | Group | World |

    | --- | --- | --- | --- |

    | d | rwx | --- | --- |


    The owner of the file is the user that created the file. The group part is the
    group that owns the file (for example, the group users). The world part means
    everyone else; setting a permission in the world part sets the permission for
    every user, the group can read and execute the file, and everyone can read and
    so on.


    Here is another example:


    ```

    -rwx-xr-

    ```


    This means that this is a normal file, the owner can read, write and execute the
    file, and everyone else can read the file, but not modify or execute it.


    If you set a directory as:


    ```

    drwxrrw-rw-

    ```


    you are saying that only the directory owner is allowed to execute something "inside"
    the directory. If another user tries to change directory into it, they will get
    a "permission denied" error message. This is exactly what happens with regards
    to users'' home directories.


    To change the permissions on a file, you use the chmod. Only root can modify files
    that do not belong to them. You must own the file to be able to change its permissions.'
  - '[PAGE 184]


    The easiest way to change permissions is to use symbolic representations of what
    you want permissions to be.


    > Note

    The other way to represent file permissions is to use octals. For more information
    about this and the chmod command see the chmod man page.


    ```

    chmod g+rw myfile

    ```


    The command above is one of the simplest ways of changing a permission. You are
    saying that you want the myfile to allow all members of the group to be able to
    read and write to it.


    If you used a - (minus sign) instead of a plus, you would be taking away those
    permissions. This would mean that members of the group would not be allowed to
    read or write to the file.


    You can mix adding and removing permissions in the same command:


    ```

    chmod u+x-rw myfile

    ```


    This will allow executing the file, but will not allow reading or writing the
    file for the file owner.


    Here is a summary of the symbolic representations available in chmod:


    +   r - read

    w - write

    x - execute

    +- add the permissions

    s - set the SUID bit. This says that if the file is executable, it will be run
    as the owner of the file, not as the user that is running the file.'
