    \ and also the foundation that the data stays in the buffer as long as possible.\
    \ We first introduce how these members ensure the correctness.\n\n# 7.3.1 Ensure\
    \ the Correctness of the Data Interaction between Processes and Buffer Block\n\
    \nProcess and buffer make the interactive data not in units of files but in a\
    \ buffer block. Several blocks interact at one time, and the data that is less\
    \ than the size of one block occupies one buffer block. Interaction between buffer\
    \ and disk is still in a buffer, and a buffer has the same size as a hard disk.\
    \ When a process operates file, the request of document operation, is proposed\
