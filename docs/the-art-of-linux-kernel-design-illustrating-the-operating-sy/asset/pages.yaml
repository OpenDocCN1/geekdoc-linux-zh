    \nWhen the total amount of data is more than 7 KB, one should start a one-level\
    \ indirect management. The eighth member of i_zone[9] records records of a data\
    \ block; however, it stores the logic number of the next 512 data blocks in the\
    \ peripherals, not the file context. On the bases of these block numbers, the\
    \ corresponding data block amount is 1024 bytes and each block occupies 2 bytes,\
    \ a data block can store a block number of 512. In this way, the management limit\
    \ is 7 + 512 data blocks, that is, (7 + 512) KB.\n\nWhen the total amount of data\
