    # 1.3.2 Set the Interrupt Descriptor Table and Global Descriptor Table


    The setup routine continues to prepare for the protected mode and set the initial
    value of IDTR and GDTR.


    Tip:


    GDT: It is the only array that stores segment register values in the system and
    cooperates with the program during the protected mode. It also plays an important
    while switching OS. It can be regarded as the total list of all processes, storing
    every task LDT (load descriptor table) address and TSS (task structure) address
    to complete segment addressing, site protection, and recovery.

    GDTR: GDT can be stored at any position in the memory. A program needs the entry
    of GDT when using the segment descriptor through the segment register. It uses
    the LGDT (load GDT) operator to load the GDT base address into GDTR after the
    initialization of GDT.

    IDTR: The address of all interrupt services in the protected mode. IDTR register
    stores the beginning address of IDT.


    ```

    // code path:boot/setup.s

