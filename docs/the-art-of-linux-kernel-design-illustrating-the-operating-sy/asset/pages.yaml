    # 1.3.4 Prepare for the Implementation of head.s in the Protected Mode


    To establish the interrupt mechanism, setups will have to reprogram the PIC 8259A
    (Figure 1.20).


    Tip:


    8259A: 8259A is a chip designed for 8085A and 8086/8088 to control interrupt.
    One piece of 8259A can manage eight priority interrupt levels. 8259A can cascade
    to a system that can manage up to 6 priority interrupt levels in the case of no
    circuit adding.


    Codes as follows:


    ```

    mov     $0x11, al          # initialization sequence (ICW1)

    out                        #ICW2needed(1). CascadeMode,Level-triggered

    outout    $al, $0x20          # send it to 8259A-1

    .word   $0x0eb,0x0a      # jmp $+2, jmp $+2

    outout    $al, $0x0a          # and to 8259A-2

    .word   $0x0eb,0x00

    ```


    | IRQ | No | Application |

    |---|---|-|

    | IRQ0 | 0x20 | 8259A clock interrupt |

    | IRQ1 | 0x21 | Keyboard interrupt |

    | IRQ2 | 0x22 | Connect subsidiary chip |

    | IRQ3 | 0x23 | Serial port 1 |

    | IRQ4 | 0x24 | Serial port 2 |

    | IRQ5 | 0x25 | Floppy disk drive |

    | IRQ6 | 0x26 | Real clock interrupt |

    | IRQ7 | 0x27 | Reserved |

    | IRQ8 | 0x28 | Reserved |

    | IRQ9 | 0x29 | Reserved |

    | IRQ10 | 0x2a | Reserved(Network A) |

    | IRQ11 | 0x2b | Mouse processor |

    | IRQ12 | 0x2c | Math processor |

    | IRQ13 | 0x2d | Interrupt |

    | IRQ14 | 0x2e | Interrupt |

    | IRQ15 | 0x2f | Reserved |


