    The interrupt descriptor has 64 bits including OFFSET, SELECTOR, DPL, P, TYPE,
    and so on. The 0–15 bits and the 48–No. 63 bits are combined as the 32-bit offset
    address of the interrupt service routine. The 16–31 bits are the SELECTOR, which
