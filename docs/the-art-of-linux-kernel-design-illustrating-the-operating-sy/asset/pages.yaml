    10 to 15: part to limit, G is 0, that indicates the segment limit is 104 bytes,
    and TSS just has 104 bytes except i387_i387. LDT is 3 x 8 = 24 bytes, that bytes
    is long enough. The TSS is x89, that is 10001001. By the way, the mov$ %4 assign
    the type 101. Similarly, mov$0,%5 assign the part of 000, at the same time, also
    conveniently G, D/B, preserved, and AVL fields.


    The task_struct of process 0 has been hard-coded by the OS designers, which is
    the INIT_TASK pointer in sched.h (see the source code, the related structure,
    and comments below), and the INIT_TASK pointer initialized item 0 of task[64]
    (Figure 2.19).

