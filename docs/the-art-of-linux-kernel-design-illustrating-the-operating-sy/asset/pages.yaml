- img_proc: true
  md: 'In addition, each process has TSS and LDT. To facilitate the management, it
    also needs to design a set of data structures, which is a global descriptor GDT,
    and the TSS of all process and LDT indices are both stored in the GDT. In order
    to facilitate the operation of GDT and further operation of LDT and TSS, the system
    also needs to set the special registers of these three tables in CPU, which are
    the global descriptor table register (GDTR), local descriptor register (LDTR),
    and task register (TR).


    But only these are far enough, the beginning of BOOT is the boot mode, and the
    value in each segment register is the actual value. The data in the segment register
    chooses the segment selector the system gets into protected mode, so that the
    GDT table can participate in the application, so the system should do a full range
    of preparations in order to converse from the real mode to protected mode.


    These are only expansion analysis for TSS and LDT, the other fields in the process
    management structure also have a close relationship with the system; for example,
    the most basic way of process scheduling is through the time slice, and the most
    important reference of time slice is the slice of the current process. For another
    instance, only process is able to operate files, so the process will build comprehensive
    relationships with the files, including i, the nodes in file management table,
    and the file management pointer of process itself, and so on.


    To create process, we must create a process management structure, with all fields
    of process management structure, and all of these fields should be created and
    set. In addition to process management structure, when creating process, it also
    needs to duplicate a pages table and create a page directory entry for the new
    process, and all of these have a direct relationship with the application of the
    memory page, and the strategy of the memory application is one of the most complex
    strategies in the whole operation system.


    Step 3: After creating process, process will load the corresponding program of
    file world.


    To complete this step, process will do comprehensive preparation in two aspects:
    One is files, and the other is memory. The program "hello world" must be stored
    in the executable file in the hard disk, so it must check whether the files are
    available before loading the file. It mainly displays in the file i detection
    and as long as the i node is involved, it can''t get away from the i node search,
    so we should analyze the file path, operate file and directory entry, operate
    i and so, no one file. File header is stored in the data block and can''t manipulate
    the data block without the storage of logical bitmap, so we will use the whole
    content involved in the entire file system.


    With the file loading conditions, we will load "hello world" into memory, the
    system will solve all issues related to memory, removing the relationship with
    the original process shared page. This involves the page reference count, page
    management mechanism with three level (page directory table, page table, page),
    page data (read-only/can read write), and a series of problems, and the system
    will have to establish page write protection mechanisms for this to solve these
    problems.


    ![](img/f661d64b7eb54840fcb4d65765a4e933_498_0.png)'
