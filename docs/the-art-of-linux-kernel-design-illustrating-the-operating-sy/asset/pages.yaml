  md: '# # Device Initialization and Process 0 Activation


    From now on, the main function begins!

    Before the operating system (OS) enters the idle state, the core purpose of all
    the preparatory work is to allow user applications to run normally in the "process"
    way. There are three aspects involved: the user application can run computing
    on the host, interaction with peripherals, and human-computer interaction. This
    chapter explains the content to achieve this goal, including device initialization
    and activation of the first process—process 0.


    Linux 0.11 is a modern OS supporting multi-processes, which means to ensure normal
    host operation, user processes cannot interfere with each other while processing.
    However, the process does not have a natural "boundary" to protect itself, which
    relies on the boundary, that is, the process management data structure. Process
    management information data structure consists of the following: task_struct,
    task[64], and GDT, at all. Task_struct is a unique structure for the process,
    which identifies each attribute of a process including the remaining time slice,
    execution state, local descriptor table LDT, and task descriptor TSS. Task[64]
    and GDT are data structures for the management of processes, and the task[64]
    structure stores all the task_struct pointers of the process. If the OS needs
    to compare and choose from multiple processes, it can traverse through the task[64]
    structure to meet the requirement. GDT keeps a set of index structure for all
    the processes; thus, the OS can locate each process indirectly by the LDT and
    TSS through index.'
