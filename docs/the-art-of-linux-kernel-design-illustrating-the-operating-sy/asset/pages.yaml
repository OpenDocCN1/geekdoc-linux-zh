  md: '# #5 File Operation


    # ## 5.1 Install the File System


    In Section 3.3.3, the operating system (OS) loads the root file system successfully,
    so that data can interact with the root device. Installing the root file system
    means that the file system in the hard disk is loaded as the root file system,
    in order for the OS to interact data with the root device.


    There are three steps to install the file system:


    +   1. Read the super block from the hard disk and load it into super_block[8]
    in the system.


    +   2. Read the specified inode from the Ramdisk and load it into inode_table[32]
    in the system.


    +   3. Mount the super block of the hard disk into the specified node of inode_table[32].


    The overall structure of the file system of the hard disk, after it is completely
    installed, is shown in Figure 5.1.


    The command "mount/dev/hd1/mnt" can be used to install the file system in shell.
    This command includes three parameters, that is, mount, /dev/hd1, and /mnt. "mount"
    is the name of a command with the purpose of installing the file system. "/dev/hd1"
    and /mnt" are directory path names, to indicate the mount file system of the device
    "hd1" to'
