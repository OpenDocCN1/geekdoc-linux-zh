    ![](img/f661d64b7eb54840fcb4d65765a4e933_164_0.png)


    **Figure 3.38** The relationship between file path and the node.


    The file system in the OS can be roughly divided into two parts: one is in the
    kernel and the other in the hard disk, the floppy disk, and the Ramdisk.


    The file system is designed to manage the files, and it uses the "i node" to manage
    files. When there is a file in the OS, there is a corresponding i node. The file
    path in the OS is managed by the directory entry; a directory entry corresponds
    to a level of the path, and the directory files are also files that are managed
    by the i node. A file is mounted on a directory file''s directory entry; the directory
    file may be mounted on another directory according to the different path. Hence,
    a directory file has more than one entry to different paths. This is shown in
    Figure 3.38.


    The i node of all files (including the directory files) eventually mounted into
    a tree-structure; the root node is the file system''s root node. A logical device
    (physical device can be divided into multiple logical devices, as a physical hard
    disk can be divided into multiple logical hard disks) has only one one tree structure;
    that is, a logical device has only one root node.


    The most important sign of loading the file system is associating the root node
    of a logical device with another logical device with system''s i node; which is
    determined by the user''s command. This is shown in Figure 3.39.


    In other words, a file system must be linked to another file system. According
    to this policy, there must be a file system to mount other file systems, and the
    special file system is the root file system, and the device is the root device.


    If any other file system can be mounted on the root file system, then where should
    the root file system be mounted?


    The answer? It is on the super_block[8]. Each of the array is a super block; a
    super block manages a logical device, which means that the OS can only manage
    eight logical devices, and among them, there is only one root device. The most
    important sign of loading the root file system is that the i node of the root
    file system is mounted on the corresponding super_block[8].


    Generally speaking, the whole process of loading the root file system consists
    of three main steps:


    +   1. Copying the super block of the root device to the super_block[8] and mounting
    the i node of the root device to the corresponding super block in super_block[8]'
