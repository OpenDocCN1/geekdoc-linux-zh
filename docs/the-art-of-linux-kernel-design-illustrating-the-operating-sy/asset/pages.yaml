- img_proc: true
  md: 'One way to change the privilege level in IA-32 is through interruption, as
    introduced in Chapter 1. When an interrupt is received, the CPU can interrupt
    the current program; switches to the corresponding interrupt service routine.
    When finished, perform iret to return to the interrupted program to continue.


    During this period, the CPU hardware does two things: protect and restore the
    environment and change the privilege level.


    We can see from the code performance that interruption is just like function calls.
    They can jump from one code that is being executed to another section of the code
    and then return to the original code to execute after finishing the execution
    of the new code. In order to make sure that the process return to the original
    code accurately, we need to push CS and EIP to save the next line of code (protect
    environment). When executing the called function or interrupt service, pop CS
    and EIP (restore environment). Then, the CPU can perform the called function or
    interrupt program accurately. The Flags and other important registers also need
    to be protected.


    The difference between interruption and function call is that the function call
    is designed by a programmer; the compiler can compile in advance the protection
    and restoration code. While the interrupt is unpredictable, they cannot be compiled
    in advance. Hence, the protection and restoration environment of the interrupt
    have to be performed by the hardware. Therefore, the command instruction will
    cause the hardware to push SS, ESP, EFLAGS, CS, and EIP. Similarly, when executing
    the command iret, will pop them to the corresponding register.


    According to the sets of dpl, when the CPU responds to the interruption, it can
    change the privilege level. In function set_init(),set_system_gate(0x80,&system_call)
    is to set the interrupt 0x80 move from privilege 3 to 0. When the process of privilege
    level 3 the system call int 0x80, CPU will flip to privilege level 0. Similarly,
    the command iret could change the privilege level from 0 to 3.


    The function move_to_user_mode is based on this principle, using iret to change
    the privilege level from 0 to 3; the stack does not have the values of these five
    registers: ss, esp, eflags, cs and eip. In order to use the command iret, the
    designer pushes the value of these registers manually, which is similar to the
    command int. When performing the command iret, the CPU automatically pushes this
    5 value to the register and returns to privilege level 3, executing the code in
    privilege level 3.


    In order to change privilege 3, not only the stack should be correct, but the
    privilege level of SS and CS must also be right. Note that the value of SS in
    the stack is 0x17, which is 00010111 in binary; the last two bits represent 3,
    the user privilege level. Then, the sixth bit is 1, which means the segment descriptor
    is obtained from the LDT; it of 4–5 bits means obtaining the segment descriptor
    from the third item of the LDT.


    When executing the command iret, the hardware would pop the 5 value from the stack
    to SS, ESP, EFLAGS, CS, and EIP in order. The pop order is the same as the usual
    return; also, the effect of the return is the same.


    When the system finished executing function move_to_user_mode(), equivalent to
    an interrupt return, the privilege level of process 0 changes from 0 to 3, which
    means process 0 becomes a real process.'
