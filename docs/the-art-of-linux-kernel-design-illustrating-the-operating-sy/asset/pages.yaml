  md: 'The only purpose of the request design is to let the buffer and the hard disk
    data block interact with each other as soon as possible.


    It is noteworthy that the size of the request is 32 as request[32], so why it
    is 32 and not 16 or 64?


    This is because the data interaction in the host computer has a speed 100 times
    quicker than the hard disk, which means, on average, 100 pieces of buffer data
    interact with the process while 1 piece of buffer data interacts with the hard
    disk. The maximum number of the blocks in the host computer is 3000. The ratio
    of the buffer to the request is exactly 100, which matches the ratio of their
    interaction speed. If the request is too great for the hard disk, the request
    will be idle and wait the memory. If the number of requests is too small, the
    new command the hard disk is free while the process has no proper buffer to use
    and suspend frequently; this will reduce the operating efficiency of the entire
    system. And 32 is just the right size.


    # 7.4 Function of Uptodate and Dirt


    As introduced in the previous section, the b_dev and the b_blocknr are the basis
    of the process of sharing buffer, and they are the signs of data in the buffer
    still stays. If it stays, it will be used, and we will be extended to two directions:
    One is the process direction, which can be shared and which can not shared by
    the process; another is the hard disk, which needs to be synchronized to the hard
    disk and which needn''t. The core of these two directions is to ensure the accuracy
    of the data in the buffer and the data block.


    The fields b_update and b_dirt in buffer_head are all used to ensure the accuracy
    of data in the buffer and the data block.


    b_update aims at the process direction; it tells the kernel that it could support
    the data shared by the process as long as the b_update of the buffer is assigned
    1 and the data in the buffer is the latest of the data block. Otherwise, the b_update
    is 0, which warns the kernel that the buffer is not updated by the binding of
    the data block and should not support the process to share the buffer.


    b_dirt aims at the hard disk; when the b_dirt of the buffer is assigned 1, it
    tells the kernel that the buffer has rewritten by the data of the process direction
    and needs to be synchronized to the hard disk or it is 0, and it needn''t be synchronized.


    # 7.4.1 Function of b_uptodate


    First, we have a look at the process direction and what happens without the control
    of the b_uptodate.


    Without the control of the b_uptodate, the buffer binds with the hard disk, and
    an error may occur when the process operates the data in the buffer to directly
    read the file, for example, Figure 7.7.


    From the diagram, it is not difficult to find that the data in the buffer is not
    updated due to the data of the data block. b_uptodate is 0, and the data in the
    buffer is garbage data, so the data read by the hard disk is not read at all.
    This is not the intention that the process read the hard disk data, and the data
    is wrong.


    To write the file, an example is shown in Figure 7.8.'
