  md: '# # The User Process and Memory Management


    The important feature of modern operating systems is that they support real-time
    multitasking, that is, running multiple programs simultaneously. The running programs
    are called processes. In the viewpoint of the designers of the UNIX system, the
    core of the operating system is the process, the so-called OS is actually a number
    of running processes. According to this principle, the creation of process can
    only be borne by process, that is, the parent-child process creation mechanism.
    In any case, there is at least one process in the OS, that is, the shell process.
    In short, everything is the process. Also, a special process is responsible for
    users interacting with the computer, that is, process 0.


    When one computer has only one core, with only one core, the essence of multiple
    processes running simultaneously is time shared by turn. To ensure multiple processes
    running simultaneously in a correct way, you must solve two issues: one is how
    to prevent one process''s code and data from interacting with another; the other
    is how to make it possible for the multiple process to run in an orderly way.


    The first problem involves the protection of the process, and the second problem
    is for scheduling of the process.


    In Intel IA-32 architecture, process protection embodies the protection of the
    memory space, and protection of process memory space is achieved by linear address
    protection and physical address protection.'
