  md: "![](img/f661d64b7eb54840fcb4d65765a4e933_422_0.png)\n\n# # 7.7 Overall Look\
    \ at the Buffer Block and the Request Item\n\nThe b_dev and b_blocknr are flags\
    \ of data that stays in the buffer block in the practical application of the buffer\
    \ block; the kernel did not remove these two fields intentionally. This means\
    \ that, if it applies for the buffer block continuously, then all buffer blocks\
    \ would be bound to the data block soon. At this time, if it continues to apply\
    \ for the buffer block, it can only replace the old binding relationship with\
    \ the new binding relationship, and the data in this buffer block has become invalid.\
    \ **This reflects a strategy that lets the buffer data stay as long as possible.**\n\
    \nIn order to make the data stay for a long time, the kernel does as much as possible\
    \ not to apply for the new buffer block, and it had better use the binding relationship\
    \ that has been established, and if there is no other way to go, then apply for\
    \ a new one. This approach is embodied in the code as:\n\n```\n```c\n//code_path/buffer.c:\n\
    struct buffer_head * getblk(int dev, int block) //apply for the buffer block\n\
    {\n    repeat:\n        if (bh == get_hash_table(dev,block)) //if it is found\
    \ that a buffer block has\n            //already bound\n            //with the\
    \ specific data block (block) of\n            //the specified\n            //device\
    \ (dev)\n            //use the off-shell directly\n            //if the binding\
    \ buffer block according\n            //with the specified standard\n        \
    \    //can't be found, then apply for a\n            //new buffer block\n    \
    \        return bh;\n        free_list();\n\ndo ( \n    /* and repeat until we\
    \ find something good */\n    ) while ((tmp = tmp->b_next_free) != free_list);\
    \ \n}\n```\n```"
