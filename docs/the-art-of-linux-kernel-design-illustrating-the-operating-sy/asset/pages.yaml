    \      #5 values are pushed, too.\n\npushes\npushbf\nppushedx\npushec\npushebx\n\
    \      # pushebx,ecx,ebx as parameters\n      # to the system call\n      # set\
    \ up,ds,es to kernel space\nmovl $10,$eax\nmovdx,$ds\nmovl $0x17,$eax\n      #\
