  md: '# # Buffer and Multiprocess File


    The preceding chapters have explained the process, file, and memory management.
    Based on these explanations, the readers can understand the operating system,
    the complex relationship among process, the file system, and the buffer which
    is across the above three parts. If we want to understand the complex relationship
    among OS, process, file system and memory management deeply, we must make clear
    what the function of the buffer is.


    # ## 7.1 Function of Buffer


    In order to make clear what the function of the buffer is, we want to ask: Is
    it alright with a buffer, and what problems will come out without it?


    From the physical aspect of the computer, the buffer is a space that is opened
    in the physical memory. There is no essential difference in the physical property
    between this memory space and the memory space that is occupied by a process.
    Exchanging data between the block device (for convenience, this chapter discusses
    the hard disk only) and the buffer is the same as the process between the hard
    disk and memory space of process in the physical aspect. It does not affect the
    correctness of data interaction or the transmission speed. In this view, even
    without the buffer, it can also complete the data interface between process and
    hard disk.


    Therefore, the buffer is not necessary. Designing a buffer is sure to make the
    operating system run better, thus adding a beautiful thing to a contrasting beautiful
    thing.'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'What benefits can be brought to the operation of an operating system by designing
    a buffer?


    We think that it is mainly reflected in two aspects:


    +   1. It forms a uniform distribution of all block devices and makes the designing
    of the operating system more convenient and flexible.


    +   2. It makes the file operations of the block device run more efficiently.


    The first aspect is relatively easy to understand, and standard is one of the
    difficult problems to understand the operating system, so in this chapter, we
    will explain the design in detail about the buffer in improving the running efficiency
    of operation files of the block device through two examples of files operated
    by multiprocessing.


    In Figure 7.1, we can find that there seems to be a problem in which the process
    memory space and the buffer memory space are the same. When exchanging the process
    memory space and the hard disk, a buffer is added, and it only adds to the time
    of the data changing hands in memory, but this data changing hands is without
    any data processing. It is just simply changing hands and should only increase
    CPU resource consumption. Why is it faster than the process of directly exchanging
    data from the hard disk?


    The reason is buffer sharing. In the computer, the speed of data interaction between
    memory and memory is faster 2 levels than that between the memory and the hard
    disk. If the process A reads the data from the hard disk to the buffer, and process
    B also needs to read this data, then it does not need to read from the hard disk,
    and it can be directly read from the buffer. Then the time process B takes is
    only about one percent of the process A for reading this data, the efficiency
    is increased by two levels of magnitude. If there are processes C, D, and E, etc.
    that all need to read this data, the whole efficiency of the computer will be
    greatly improved. This is a model of buffer sharing; it means that different processes
    share the same data in the buffer. If the process A reads the data, uses this
    data, and reads the data again after a period of time, and it is still in


    ![](img/f661d64b7eb54840fcb4d65765a4e933_358_0.png)


    Figure 7.1 Pattern picture of process, buffer, and block device.'
