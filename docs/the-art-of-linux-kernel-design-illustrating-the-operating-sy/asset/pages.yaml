  md: 'The system needs to have the following three functions to support the signal
    mechanism.


    +   1. The system needs to support the process to send and receive the signal.


    The system sets the field "signal" (signal bitmap) for receiving the signal in
    task_struct of every process. Every event process is stored in this data structure
    by bit. The system supports two ways of sending the signal to the process. One
    way is that a process sends the signal to another process by calling specific
    library functions. Another way is that users generate keyboard interrupt by inputting
    keyboard information, and the interrupt service sends the signal to the process.
    The principals of these two ways to send a signal are the same. They are all achieved
    by setting the bits of the signal in the signal bitmap.


    The example will be combined with the first way that one process sends a signal
    to another to show how the system sends and receives a signal.


    +   2. The system should be able to detect the process that has received in time.


    The system detects whether the process has received the signal by two ways. One
    way is to detect whether the current process has received the signal before the
    switch call returns. Another way is that after the occurrence of the timer interrupt,
    the system detects whether the current process has received the signal before
    the execution of the interrupt service routine ends.


    The two ways of signal detection are similar. The example will be combined with
    the first way to show how the system detects the signal it receives.


    +   3. The system needs to support the process to handle the signal.


    The system should guarantee that when the user process need not participate in
    the execution of the user process completely, and when the user process needs
    to handle the signal, the program of the process will stop executing temporarily
    and switch to executing the signal processing function. When the signal processing
    finishes finishes, the program of the process will continue to execute from where
    the pause happened.


    The example will show how the system is achieved through these three aspects.
