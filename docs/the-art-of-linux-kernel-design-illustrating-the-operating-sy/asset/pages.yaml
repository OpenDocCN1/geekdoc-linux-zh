    # 8.3 Summary


    This chapter takes "processes operating pipe" and "interprocess send signal" as
    examples to explain the interprocess communication.


    In the "processes operating pipe" cases, the operating system allocates a pipe
    file in file_table[64] and inode_table[32] and applies for a page as a pipe in
    memory. After the establishment of the pipe, the two processes begin to exchange
    data; one reads data from the pipe; the other writes data to the pipe. Even if
    a clock interrupt interrupts the execution of processes, the data also wont get
    chaotic.


    In the "interprocess send signal" cases, before the completion of the system call,
    it will process the signal of the current process. If the signal is received,
    the system does some set preparation. When the system call returns, the signal
    processing function will be executed immediately, and the process produce system
    calls soft interrupt will be executed. In addition, for each operating system
    process scheduling, it will check all processes. If the process is in uninterruptible
    wait state and has received the signal, it will be set to task ready. If the signal
    is in uninterruptible wait state, even if it has received the signal, the state
    will not be changed.'
