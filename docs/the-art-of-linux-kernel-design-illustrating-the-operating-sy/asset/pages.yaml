  md: "# 5.6.1 Reposition the Current Pointer of the File\n\nThe user processes call\
    \ the function lseek() to reposition the current operation f_pos; it is\neventually\
    \ mapped to the function sys_lseek() to execute.\nThe code is as follows:\n\n\
    ```\n// code path:include/unistd.h that shift from the start of the file\n#define\
    \ SEEK_SET 0 / indicate that shift from the start\n#define SEEK_CUR 1 / indicate\
    \ that shift from the current place\n#define SEEK_END 2 // indicate that shift\
    \ from the end of the file\n```\n\n```\n// code path:fs/read_write.c\nint sys_lseek(unsigned\
    \ int_t offset, int orig)\n//adjust the file operation points, offset is the bytes\
    \ shifted from f_pos to the end of the\nfile{\n    struct file *file;\n    int\
    \ tmp;\n\n    if (fd != NO_OPEN || !(file->current->fpld[fd]) || !(file->inode->i_dev))\
    \ {\n        return -EBADF;\n    }\n    if (file->inode->i_pipe) {\n        return\
    \ -EINIO;\n    }\n    switch (origin) {\n        case 0:\n            //set the\
    \ starting point as the starting point, set\n            file->pos=offset;\n \
    \           if (offset==0) return -EINVAL;\n            file->f_pos=offset;\n\
    \            break;\n        case 1:\n            //set file->f_pos as the current\
    \ file place\n            if (file->f_pos-offset<0) return -EINVAL;\n        \
    \    file->f_pos -= offset;\n            break;\n        case 2:\n           \
    \ //set the ending place as the starting point,set\n            //file->f_pos\n\
    \            if ((tmp = file->inode->i_size+offset) < 0)\n                return\
    \ -EINVAL;\n            file->f_pos = tmp;\n            break;\n        default:\n\
    \            return -EINVAL;\n    }\n    return file->f_pos;\n}\n```\n\n# 5.6.2\
    \ Modifying Files\n\nLet us assume that hello.txt is an existing file in your\
