  md: "# 5.5 Writing a File\n\nThe process of writing a file by the OS is as follows:\
    \ First, write data into the buffer from the process memory; then synchronize\
    \ data from the buffer to the peripherals under the appropriate conditions. Meanwhile,\
    \ the OS synchronizes data in units of data block (1 KB) from the buffer (1 KB)\
    \ to the peripherals. This requires the buffer and logic block need to be written\
    \ in the peripherals bind together before synchronizing. Make sure that data to\
    \ be written in the buffer block of the user memory can be exactly synchronized\
    \ to the specified logic.\n\nWe first introduce how to determine the binding relationship.\n\
    \n# 5.5.1 Locate the Position of the File to Be Written In\n\nThe function write()\
    \ is eventually mapped to sys_write(). This function checks the parameters. Then,\
    \ call the file_write() to write the file.\nThe code is as follows:\n\n```\n//\
    \ node path:fs/read_write.c\nint sys_write(unsigned int fd, char *buf, int count)\
    \ //write file\n{\n\t\tstruct file *file;\n\t\tstruct inode *inode;\n\n\tif (fd\
    \ != NR_OPEN && count < 0 || (file = current-filp[fd]))\n\t\t\t\t//whether fd,\
    \ count is within\n\t\t\t\t//reasonable range and file\n\t\t\t\t//is open\n\t\t\
    \treturn -EINVAL;\n\t\tif (count)\n\t\t\treturn 0;\n\t\t\t\t//f amount of bytes\
    \ written\n\t\t\t\t//in is 0, return directly\n\t\t\tinode = file->i_inode;\n\t\
    \t\tif (inode->i_pipe || inode->mode&2)Write_pipe(inode,buf,count);-EIO;\n\t\t\
    \tif (S_ISBLK(inode->i_inode))\n\t\t\t\treturn rw_block(WRITE,inode->i_zone[0],buf,count,&inode->f_pos);\n\
    \t\t\tif (S_ISERR(inode->i_inode))\n\t\t\t\treturn block_write(inode->i_zone[0],&inode->f_pos,count);\
    \ //make sure that file\n\t\t\t\t\treturn S_IERR(inode->i_inode); //to be written\
    \ is regular file\n\t\t\t\treturn file_write(inode,file,count); //write file\n\
    \t\t\tprintk(\"*Write) inode=%lx%o\\n\\n\", inode->i_mode,inode->i_mode);\n\t\t\
    return -EINVAL;\n}\n```\n\nThe parameter flags passed by the user process to determine\
    \ the position of the data to be written. Within the function file_write(), the\
    \ system checks f_flags to determine the position where data are written at first\
    \ and then calls block_block() function, which creates a logical block corresponding\
    \ to the position of the file and returns the logic block number.\n\n5.5 Writing\
    \ a File\n\n265"
