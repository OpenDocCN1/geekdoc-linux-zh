  md: '# 7.5.3 Function of b_lock and b_wait


    The kernel applies a buffer for the process, especially when the b_count in the
    buffer block turns out to be 0, and considering the synchronization, there is
    great possibility that this buffer block is transacting with the hard disk. So
    the b_lock field is set in this buffer_head. If this field is set to 1, it means
    this buffer block is interacting data with the hard disk. The kernel will stop
    the process from conducting operations to the buffer until the end of the interaction
    with the hard disk. The interception will be relieved when the buffer is set to
    0.


    If the b_lock field in the buffer, which is applied by the process, is set to
    1, the process also needs to be suspended even though the process has already
    got the buffer block. The buffer block can only be accessed until it is unlocked.
    No matter how many processes had applied the buffer block, they cannot immediately
    operate the buffer block. All these processes should be suspended and switch to
    other processes waiting for this block. Due to the use of a waiting queue of the
    process, a field can solve this code. The field is `b_wait.


