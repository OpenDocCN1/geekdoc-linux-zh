    # 1.4 Summary


    This chapter has two parts: part I, loading the OS; part II, preparation for executing
    the main function in the 32-bit protected mode and paging mode.


    Beginning with loading "bootsect.s" into the memory with BIOS, the files "setup.s"
    and "system" are executed to load the OS. Then, it is followed by the preparation
    for executing the main function in the 32-bit protected mode and paging mode.
    During this period, IDT, GDT, page content tables, page tables, and machine statistics
    are set.


    After all these, the system jumps from the execution entrance to the main function
    and starts executing it.'
