  md: "After which, \"int $0x80\" is executed. It triggers a soft interrupt and the\
    \ central process- ing (CPU) starts executing the kernel code in privilege level\
    \ 0 from the process code in unit 3. The hardware automatically pushes ss, ef,\
    \ cs, and ei to the kernel stack of pro- cess 0 in init_task, which is shown in\
    \ Figure 3.1. You should pay attention to the red stripe after the init_task,\
    \ which is the value of the five registers. The push action in the move_-user_mode\
    \ mentioned before is initiate hardware push in interruption. The pushed data\
    \ will be used to initialize the TSS of process 1 in the subsequent call_process_function.\n\
    \nNote that the pushed data points to the line of instruction \"__res__=0). Process\
    \ 0 will continue to execute this line after back in from fork(). In 3.3, we will\
    \ see that this line is also the first instruction that process 1 starts to execute.\
    \ Keep this point in mind!\n\nAccording to the settings of set_system_gate(0x80,\
    \ &sys_call) in sched_init() explained in 2.9, after pushing automatically, the\
    \ CPU jumps to _system_call in sys_call and continues to push us, fs, es, edx,\
    \ eax, and ebx, which is used to prepare for initializing TSS in process 1 when\
    \ calling copy_process(). Finally, according to the off- set value 2, the kernel\
    \ looks up sys_call_table[] to learn that the corresponding function is sys_fork.\
    \ The corresponding function name to C language in Assembler has an underscore\
    \ \" (e.g., _sys_fork in Assembler corresponds to sys_fork in C language); thus,\
    \ the kernel starts to execute _sys_fork.\n\n# Tip:\n\nThe function parameters\
    \ are not defined by the function itself but made by another procedure through\
    \ pushing, which is one of the main distinctions between the OS code and the application\
    \ code. Clearly understanding the com- plantation and implementation of C language\
    \ will help us grasp this method. Parameters of C language exists in the stack\
    \ when operating; hence, system designers can force the value in stacks as parameters\
    \ of function in sequence. In this way, functions will use the value in stacks\
    \ as parameters.\n\nThe code is as follows:\n\n```\n//Code path:kernel/system_call.s:\n\
    _system_call      #int 0x80 -- head entry of system call\ncmp $1,sys_call_table,%1,eax\n\
