  md: 'Both set_system_gate(n,addr) and set_trap_gate(n,addr) use the same_set_gate(gate,type,dpl,addr),
    and the difference is that the dpl of set_trap_gate is 0 while the dpl of set_system_gate
    is 3. "dpl is 3" means that system can be called from privilege level 3 (also
    the user privilege level).


    Learn more about privilege level in Volume 3.pdf of the Intel 1A-32 Architectures
    Software Developer''s Manual.


    Next, out 11h-02f of it are all initialized, and the pointer to interrupt service
    program is set with status "reserved".


    Set the id of the co-processor.


    Enable the interrupt from IRQ2 and IRQ3 of the 8259a interrupt controller.

    Set the id of the parallel port (access to printer).


    The 32-bit interrupt service system is established to meet the interrupt mechanism
    "passive response", which is described as follows. On one hand, the hardwares
    signals to 8259a, and 8259a preliminarily handles signals and transfers signals
    to the CPU. On the other hand, if the CPU does not receive signals, it is interrupted
    and a specific interrupt service program is located by the id, which will be executed
    immediately. After interruption is completed, the CPU will return to the program
    point where interrupt happens to continue. If signal is again received, the CPU
    will return to process.


    The original design is not like this. Originally, the CPU polls all hardware from
    time to check whether its task has been completed or not. If not, the CPU continues.
    This method takes time for handling user process and reduces the overall efficiency
    of the system. We can see that it is not efficient to handle signals by way of
    "active polling". It is an improvement that the "passive response" takes the place
    of the "active polling" mode in handling the I/O problem between host and peripherals.


    # 2.6 Initialize the Request Structure of the Block Device


    In Linux 0.11, peripherals are divided into two categories: block device and character
    device. The block device divides space into little parts with the same size named
    as a block. Every block has its own block ID and is independent, which can be
    read or written randomly. Hard disks and floppy disks are both block devices.
    Character devices carry out I/O communication by character. Keyboards and command
    displays are character devices.


    Any process communicates with a block device using the buffer in the host''s memory.
    Request management structure "request[32]" is a data structure for reading and
    writing, which is a "bridge" between buffer block in the OS and logical block
    in a block device.


    I/O communication between the buffer and a block device is shown in Figure 2.10.


    The OS executes the reading and writing operation between the buffer and the block
    device based on their priorities and records the buffer need to operate on the
    request.'
