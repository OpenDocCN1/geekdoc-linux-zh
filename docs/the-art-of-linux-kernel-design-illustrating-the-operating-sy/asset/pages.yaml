  md: "# 6.4.2 Page Protection\n\nProcess A and B page share. Suppose now the system\
    \ has one user process (process A), and the corresponding program code of it has\
    \ been loaded into memory. The number of the page reference that is occupied in\
    \ the memory of this process is \"1,\" and then it begins execution, creating\
    \ a new process (process B) by calling the fork() function. While creating a process,\
    \ the system copies all page table entries of process A to process B and sets\
    \ the page directory (PDE) of process B. At this time, the two processes share\
    \ the page, citing shared page accumulated to 2, and the shared page is set to\
    \ \"read only\" attribute, which means that either process A or B can only run\
    \ the read operation for these shared pages, rather than write operation.\n\n\
    The code is as follows:\n\n```\n// code path:mm/memory.c:\nint copy_page_tables(unsigned\
    \ long from, unsigned long to, unsigned long size)\n{\n    for (nr = 0; nr < page_table;\
    \ ++page_table++) {\n        this_page = *from_page_table; //the page's operation\
    \ attribute of Process A\n        if ((1 & this_page)) //set to read-only\n  \
    \          continue;\n        this_page &= ~2;\n        *to_page = this_page;\
    \ //the page's operation attribute of Process B\n        if (this_page > LOW_MEM)\
    \ { //set to read-only\n            *from_page_table = this_page;\n          \
    \  this_page = LOW_MEM;\n            this_page >>= 12; //reference counting record\
    \ in the mem_map,\n            mem_map[this_page]++; //and accumulate 2\n    \
    \    }\n    }\n}\n```\n\nThe page sharing situation is shown in Figure 6.29.\n\
    \n![](img/f661d64b7eb54840fcb4d65765a4e933_350_0.png)\n\nFigure 6.29 Page sharing\
    \ situation of process A and B."
