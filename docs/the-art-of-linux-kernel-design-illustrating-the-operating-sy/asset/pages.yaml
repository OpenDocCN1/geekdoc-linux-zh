  md: "# # Creation and Execution of Process I\n\n# ## 3.1 Creation of Process I\n\
    \nNow, process 0 is at privilege level 3, which is a process state. As a parent\
    \ process, its first task is to call fork() to create the first child process—process\
    \ 1, which is the first implementation of the parent-child process-creating mechanism.\
    \ On the basis of this mechanism, all processes are created by the parent process\
    \ later.\n\n# ### 3.1.1 Preparation for Creating Process I\n\nIn Linux, any new\
    \ process is created by calling fork(). The procedure is shown in Figure 3.1.\n\
    \n```\n//code path:init/main.c:\n....\nstatic inline _syscall10(int,fork)//correspond\
    \ to fork\nstatic inline _syscall10(int,pause)\nstatic inline _syscall11(int,setup,void\
    \ *,BIOS)\n\nvoid main(void)\n{\n    sti();\n}\n```"
