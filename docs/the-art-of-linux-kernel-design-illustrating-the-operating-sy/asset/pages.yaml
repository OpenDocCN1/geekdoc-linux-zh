- img_proc: true
  md: '(3) The interrupt service routine starts to execute and wakes process shell.
    After that, switch process 0 to process shell to execute through the process scheduling
    mechanism.


    It needs to establish a set of process management mechanisms. For shell, it needs
    to create process and load process shell, so that we can establish the human-machine
    interactive interface. At the same time, it also needs to create a process 0 and
    switch to process 0 when other processes are not in state, and once there is a
    process that has been woken up, switch to the process to execute immediately.
    This mechanism is applicable to all processes of the executing system. Before
    proceeding to design a set of process schedule mechanisms, which produce timer
    interrupt, leading to process switching. There are a lot of problems that need
    to be considered in this mechanism, such as designing interrupt service handler
    and 8253 timer setting, etc.


    (4) Process shell reads the command information that the user has typed from the
    terminal device through the execution of its own program and analyzes the command
    and prepares to execute the requesting treatment. Course, this command cannot
    be input by knocking the keyboard only once. Each stroke can repeat the action
    above, and then process shell sleeps again and waits for the next keyboard interrupt.


    So far, the system is only responding to the command typed, and the official processing
    hasn''t started yet. These preparations introduced above are the simplest introduction
    of the specific steps, and behind these preparations, there is more preparation
    work. Strictly speaking, to carry out this step, the preparation introduced in
    the first chapter and second chapter of this book is almost all useful.


    The second step: After process shell analyzes the user command, call fork() creates
    a user process, so that we can control the program of the "hello world" file.


    The system needs to create at least a set of process management structures for
    user process here, and each process will have such a structure in order to control
    the future loading program. This is very complicated, including time slice, priority,
    process status, the configuring files of the process, the task descriptor table
    TSS of the process, and the local descriptor table LDT of the process, etc. Each
    of these fields has a strong relationship with the operation of the system. Take
    TSS as example, it contains all the data in the current running process, and once
    there is process switching, the system will store the value of each current register
    in the TSS while, and at the same time, using the data in the TSS to set the value
    of each registers of the process which will switch to and finally switch. Visibly,
    the data in TSS is the fundamental guarantee for process switching. For another
    example, LDT contains the code segment descriptor and data segment descriptor
    for the current process, and the two descriptors both control the program controlled
    by process directly, and the fundamental purpose of process operation is to execute
    the user program.'
