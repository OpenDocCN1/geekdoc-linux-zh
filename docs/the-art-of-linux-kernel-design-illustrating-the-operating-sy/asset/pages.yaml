    # 2.7.2 Set the Display


    As the system provides information to indicate whether the graphics card is "monochrome
    or color," the OS sets the matching information. At the time of Linux 0.11, most
    graphics are monochrome, so we assume that the attribute of the graphics card
    is monochrome EGA, the graphics memory location is 0x00000-0xb8000, the index
    register port is set to 0xb3b4, the data port is set to 0xb3b5, and the graphics
    card attribute, EGA, is printed on the screen. Furthermore, initialize the variables
    used for scrolling screen, including the origin, end, and top bottom.


    The effect is shown in Figure 23.


    # 2.7.3 Set the Keyboard


    How is the keyboard set? First, the OS hooks the interrupt service routine with
    IDT and removes the keyboard interrupt mask of 8259A, enabling IRQ1 to send an
    interrupt signal. After disabling the keyboard work, the keyboard is enabled to
    be ready. The function set_intr_gate() is designed to do so, which is similar
    with the set_trap_gate() introduced before.'
