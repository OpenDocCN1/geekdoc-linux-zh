- img_proc: true
  md: '# # From Power-Up to the Main Function


    There are three steps from power-up to the main function, and they are designated
    to load the operating system (OS) from a boot disk and prepare for the main function.
    The first step is to load the BIOS (Basic Input/Output System), build the interrupt
    vector table, and start interrupt service routines in real address mode. The second
    step is to load the OS program from the boot disk into the memory using the interrupt
    service routines. The third step is to complete any other preparation to run the
    32-bit main function. This chapter describes how these three steps work in the
    computer.


    **Tip:**


    The real address mode is designed to be compatible with Intel 80286 and 80x86.
    It has a 20-bit memory address space (2²⁰=1MB, which is 1 MB memory to the maximum).
    It can directly access BIOS and peripheral devices, but it does not provide any
    hardware support for paging and real-time multitasking. From 80286, the 80x86
    central processing unit (CPU) is powered on from the real address mode; earlier
    CPUs (e.g., 8086) have only one mode of operation, which is similar to the real
    address mode.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# I.1 Loading BIOS, Constructing Interrupt Vector Table, and Activating Interrupt
    Service Routines in the Real Mode


    As we know, we need to install OS to operate a computer; otherwise, the computer
    is useless. Please just press the power button to boot up the computer, but they
    mostly know very little about the OS interacts with the hardware. Here, we will
    look into the whole process of running an OS in great detail.


    It is impossible to operate a computer without any software. However, at the moment
    of power-up, the computer''s memory (i.e., random access memory [RAM]) is empty,
    and the OS is on the floppy disk. Since the CPU can run programs in memory, it
    cannot run an OS from a floppy disk directly. To run an OS, it should be loaded
    into the memory from a floppy disk first.


    Tip:


    RAM: The common memory of personal computers is a kind of RAM. After power-up,
    it can be read and written directly. But if powered off, the data will be lost.


    The question is if the RAM is empty, who would load the OS?

    The answer is BIOS.


    # I.1.1 Procedure for Starting BIOS


    Before describing how BIOS loads the OS into memory, we should know the procedure
    for starting BIOS. As we know, to execute a program, we should double click it
    or enter the command in a command line interface, in case actually runs on an
    existing OS. However, at the moment of powering up, no program is in the memory,
    not even the OS. Given that BIOS cannot be executed manually, who executes it?

    It is 0xFFFF0!


    From the perspective of the system, it is clear that we cannot start BIOS by any
    software, but hardware installed.


    An Intel 80x86 CPU can be executed in 16-bit real address mode and 32-bit protected
    mode. For the purpose of compatibility, the 80x86 CPU is in real address mode
    after power-up. The most important thing is that the CPU forces CS to 0FFFF and
    IP to 0x0000; hence, the address of CS:IP is 0xFFFF0, and in Figure 1.1, which
    we could find that 0xFFFF0 is actually the BIOS.


    Tip:


    IP/EIP: instruction pointer. In the CPU, IP stores the offset of instructions
    to be executed in the code segment. Working with CS, they make up the memory address
    of the instruction to be executed. IP is the offset in the real address mode,
    and EIP is the offset in the protected mode.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '![](img/f661d64b7eb54840fcb4d65765a4e933_17_0.png)


    **Figure 1.1** The BIOS state in the memory after power-up.


    # **Tip:**


    CS: code segment register. In the CPU, it points to the code segment to be executed.


    Attention: This action is completed by hardware completely! If there is nothing
    at 0xFFFFFF, the computer crashes. Otherwise, the system will start and run.

    The entry address of the BIOS is 0xFFFF! That is, the first instruction of BIOS
    is at this location.


    # **1.1.2 BIOS Loads the Interrupt Vector Table and Interrupt Service Routines
    into Memory**


    BIOS is not very big. But to understand it thoroughly, you must be familiar with
