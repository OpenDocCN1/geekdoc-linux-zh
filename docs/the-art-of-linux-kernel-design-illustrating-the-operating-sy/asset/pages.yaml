  md: "From the code, it is not difficult to find the kernel searches the hash table\
    \ first, then compares b_dev and b_blocknr to analyze whether it can be used.\
    \ If not, then it executes the loop... While and applies for a new buffer block.\n\
    \nHere we look at the scene of applying for a new buffer block.\nThe code is as\
    \ below:\n\n```\ncode path fs/buffer.c:\n#define BADNESS (((bb)->dir<1>+(bb))->lock)\n\
    struct buffer_head *getblk(int dev, int block) //apply for the buffer block\n\
    {\ntmp = free_list;\ndo {\n\tif ((tmp)->b_count) //if the buffer block is occupied,\
    \ then\n\t\tcontinue;\n\tif ((bb) BADNESS<BADNESS(bb)) { //weigh BADNESS and select\
    \ the buffer block\n\t\tbb = tmp;\n\t\tif ((BADNESS))\n\t\t\tbreak;\n\t}\n/* repeat\
    \ until we find something good */\n} while ((tmp = tmp->b_next) != free_list);\n\
    ```\n\nThe presentation is that the hash table has been traversed, and all buffer\
