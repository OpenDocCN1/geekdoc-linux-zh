    # Comment


    Note: All BIOSs are stored in the ROM on the motherboard, and they are quite different.

    The main reason for this is the motherboard; OS has nothing to do with it.


    Theoretically, one can install any suitable OS, either Windows or Linux on a computer.
    It is obvious that each OS has its own boot scheme. The BIOS and the OS are quite
    different. In order to work together smoothly, they must establish a coordination
    mechanism to communicate and cooperate.

    It is possible to set up a coordination mechanism with an existing OS. The difficulty
    is in setting coordination mechanisms compatible with any future OS. The proposed
    approaches are "two side conventions" and "orientation recognition."

    To the OS (Linux 0.11), "conventions" means that the OS designers have to put
    the starting program in the boot sector (0 side, track 1 in the floppy disk sectors);
    the remaining program can be loaded into memory.

    To the BIOS, "conventions" means loading the boot sector into 0x07C00, regardless
    of what this sector really does. If there is an error, it only reports the mistake
    and does nothing.

    The coordination mechanism must be useful, simple, and effective. As long as the
    manufacturers of the BIOS and OS follow the same mechanisms, they can build systems
    with their own features.'
