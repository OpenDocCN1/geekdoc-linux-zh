    It is shown in Figure 4.41.

    The process update has a very important task: synchronizing the data in the buffer
    to the peripherals (floppy disk, hard disk, etc.). As the speed of host and peripheral
    data exchange is much lower than the speed of data exchange in the host, when
    the kernel needs to write data to the peripherals, it writes the data to the buffer
    first in order to improve the efficiency and then synchronizes the data to the
    peripherals from the buffer accordingly.

    From time to time, the update process will be woken up, to synchronize the data
    to the peripherals. Later, the process will suspend and it will wait for the next
    waking up and continue to execute again and again.

    After switching the update process, there will be no synchronization tasks. The
    process suspends and switches to the shell process to continue.

    The procedure is shown in Figure 4.42.


