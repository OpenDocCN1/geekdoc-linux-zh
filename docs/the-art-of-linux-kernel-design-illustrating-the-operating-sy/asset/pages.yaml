    and it is not easy to understand. It is one of the difficult problems to understand
    in the

    operating system. In order to learn and master buffer device first, let''s look
    at the

    buffer structure (Figure 7.2).


    In Linux, to support buffer, we design two pieces of important management informa-

    tion: buffer_head and request. Buffer_head is mainly responsible for the data
    interaction

    of the block between the process and the buffer. Under the condition of making

    sure data interaction correct, let the data in the buffer stay as long as possible.
    Request is

    mainly responsible for the interaction between the data in the buffer and the
    block device.

    Under the circumstances of the correctness of data interaction, let the data that
    modi-

    fied by the process in the buffer block be synchronized into the block devices
    as soon as

