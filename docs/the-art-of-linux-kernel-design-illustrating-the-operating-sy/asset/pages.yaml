    process, needing the support of the kernel code. In order to resolve the contradiction,
    the designer of the OS provides the system call solutions and a set of system
    service interface. When the user process needs to deal with the kernel, it interfaces
    the program, which immediately triggers it 0x80 soft interrupt. The following
    things not need the user program, but through a different route which the CPU
