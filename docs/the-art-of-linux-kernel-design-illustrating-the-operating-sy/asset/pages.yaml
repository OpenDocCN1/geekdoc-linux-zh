  md: "Other fields related to time settings and session organizations are all inherited.\
    \ The fields above are set for kernel management.\n\nThe next section comes with\
    \ an introduction to the TSS field, which is designed for process switch. Process\
    \ switch is guaranteed by process protection. Different designs correspond to\
    \ different process switch modes. When the process is running, various registers\
    \ are used. As a consequence, process switch is a switch of series registers rather\
    \ than a simple jump. To guarantee the order of the process, status before and\
    \ after process switch shall be consistent. Therefore, Linux 0.11 records all\
    \ registers in the task_struct, which process shall be consistent with the mechanism:\
    \ Before process switch, TSS saves the current state (i.e., the current status\
    \ of registers), and after switching back restore register value from TSS.\n\n\
    ```\n// code path: kernel/fork.c\nint copy_process(int nr,long ebp,long edi,long\
    \ esi,long gs,long none,\nlong ebx,long ecx,long edx,\nlong fs,long ds,\nlong\
    \ eip,long eflags,long_esp,long ss)\n{\n    p->cutime = p->ctime = 0;\n    p->start_time\
    \ = jiffies;\n    p->tss->back_link = p;\n    p->tss->esp = PAGE_SIZE + (long)\
    \ p; // code set TSS fields\n    p->tss0 = 0x10;\n    p->tss->eip = eip;\n   \
    \ p->tss->flags = flags;\n    p->tss->eax = 0;\n    p->tss->ecx = ecx;\n    p->tss->edx\
    \ = edx;\n    p->tss->ebx = ebx;\n    p->tss->esp = esp;\n    p->tss->ebp = ebp;\n\
    \    p->tss->esi = esi;\n    p->tss->edi = edi;\n    p->tss->ss = ss & 0xffff;\n\
    \    p->tss->cs = cs & 0xffff;\n    p->tss->ds = ds & 0xffff;\n    p->tss->fs\
    \ = fs;\n    p->tss->gs = gs; // code above TSS fields\n    p->tss->ldt = LDT(nr);\n\
    \    p->tss->trace_bitmap = 0x80000000;\n    if (last_used_math = current)\n \
    \       asm (\"%its\", fnsave%0=\"%m\" (p->tss->i387));\n}}\n```\n\nAs we can\
    \ see from the code, most parameters of the copy_process function is used to set\
    \ register status. When str begins to run, all values stored in TSS will be restored\
    \ to initialize the value of CPU registers and determine the start of process\
    \ str.\n\nIt is worth noting that these register values are automatically set\
    \ by the CPU, so we can't find any code corresponding to register assignment.\
    \ Then how does the CPU know"
