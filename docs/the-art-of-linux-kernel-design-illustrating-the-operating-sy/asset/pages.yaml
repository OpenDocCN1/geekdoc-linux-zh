    # 2. Copy the Bootsec


    Bootsec copies itself (total 512 B) from 0x07C0 to 0x90000, as shown in Figure
    1.6.

    The operation code is as follows:


    ```

    mov ax, #BOOTSEG

    mov ds, ax

    mov ax, #INITSEG

    mov es, ax

    mov cx,#256

    sub si, si

    sub di, di

    rep

    movw

    ```


    Please note that DS (0x07C0) and SI (0x0000) constitute the source address 0x07C00;
    ES and DI constitute the target address 0x90000 (see Figure 1.6), and the line
    mov CX,#256 provides a "word" number (a word is 2 bytes); 256 is just 512 bytes,
    which is the byte number of the first sector.


    Also, from the code, we can see that the BOOTSEG and INITSEG mentioned in Figure
    1.5 start to work. Note that CS points to 0x07C00, which is the address of the
    original Bootsec.


    ![](img/f661d64b7eb54840fcb4d65765a4e933_22_0.png)


    Figure 1.6 Bootsec copies itself.'
