  md: "# 5.3 Reading a File\n\nReading a file means reading data from the bytes opened\
    \ by the user. It is completed by the function read().\n\n# 5.3.1 Locate the Position\
    \ of the Data Block in the Peripherals\n\nThe function read() is eventually mapped\
    \ to sys_read() to execute. Before executing the main content, the system will\
    \ first check the feasibility of this operation, including whether the file handle\
    \ passed by the user process and number of bytes read are in a reasonable range,\
    \ whether the page the user process data is written into the file is not-only,\
    \ and so on. After these checks, begin to perform the main content that is, call\
    \ the function file_read() and read the data file specified by process. The code\
    \ is as follows:\n\n```\n// path:fs/read_write.c\nint sys_read(unsigned int fd,\
    \ char *buf, int count) // read data from the file \"hello.txt\"\n{\\ // fd is\
    \ the file handle, buf is a space pointer, and count is the number of bytes\n\
    \    // to read\n    struct file *file;\n    struct inode *inode;\n\n    if (fd\
    \ > NR_OPEN && count < 0 || !(file == current->filp[fd])) // whether count is\n\
    \        // within reasonable range,file\n        // is opened or not\n\n    return\
    \ -EINVAL;\n    if (count == 0) // number of bytes is 0\n        return 0;\n \
    \   if (!verify_area(buf)) // verify the position of page where buf is. If it\
    \ is\n        // read-only, copy this page(refer to chapter 6)\n    inode *inode\
    \ = file->inode;\n    if (inode->i_pipe) // read-pipe\n        return (file->read_pipe(inode,\
    \ buf, count)); // EIO;\n    if (ISDIR(inode->i_mode))\n        return rw_char(READ,\
    \ inode->i_zone[0], buf, &file->f_pos);\n    return block_read(inode->i_zone[0],\
    \ &file->f_pos, count);\n    if (S_ISREG(inode->i_mode) && inode->i_size) // analyze\
    \ inode-i property of file\n        // \"hello.txt\" and it is common\n      \
    \  count = count_file(inode->i_size); // file->f_pos;\n        if (count < 0)\n\
    \            return 0;\n    return file_read(inode, buf, count); // read data\
    \ specified by process\n}\nprintf(\"Read %i=%06o\\n\\r%i\\n\", inode->i_mode);\n\
    return -EINVAL;\n```\n\nIn file_read(), the system locates the block number of\
    \ the specified file data block in the peripheral by bmp(). The code is as follows:\n\
    \n```\n// path:include/linux/fs.h\n#define BLOCK_SIZE 1024\n```\n\n```\n// path:fs/file_dev.c\n\
    int file_read(struct inode *m_inode inode, struct file *filp, char *buf, int count)\n\
    \    int left,chars,n;\n    struct buffer_head *bh;\n```"
