    \ of process A triggers page protection.** The corresponding function of page\
    \ fault interrupt when it happens page protection is un_wp_page() function. The\
    \ first step is to apply for a free page in the main memory (in the following,\
    \ we call it the new page) to make a backup for all the data of the page (in the\
    \ following, we call it the original page) in location of push stack. Then we\
    \ subtract 1 from the citing count of the original page. This is because the data\
    \ in the original will be backed up to a new page, and the process A will go to\
    \ a new page to operate data, and no longer need to maintain relations with the\
    \ original page, so the citing count subtracts 1.\n\nThe code is as:\n\n```\n\
    ```c:mm:memory.c\nvoid un_wp_page(unsigned long * table_entry)\n{\n    if (!(new_page\
    \ = get_free_page())) // get a new page\n        return;\n    if (old_page >=\
    \ LOW_MEM)\n        mem_map[MAP_NR(old_page)]--; //citing count of page is\n \
    \       //decremented for 1\n    ....\n}\n}\n```\n```"
