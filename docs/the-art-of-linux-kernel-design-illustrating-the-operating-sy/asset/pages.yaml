  md: '# 2.10 Initialize the Buffer Management Structure


    The buffer area is the medium through which the memory exchanges data with peripherals.
    The biggest difference between the memory and the hard drive lies in the fact
    that the disk saves large amounts of data at a low cost. The disk is not involved
    in operations (because the CPU cannot address the disk). In addition, the memory
    only needs to store data, but the more important thing here is to perform data
    operation with the CPU and bus. The buffer is in between, and it not only saves
    the data but also participates in searching, organization, and indirect, auxiliary
    operation. After having the buffer to the peripherals, it only needs to consider
    exchanging data with the buffer in accordance with the requirements and does not
    need to consider how the memory will use these interaction data. As for memory,
    it also only needs to consider whether the condition


