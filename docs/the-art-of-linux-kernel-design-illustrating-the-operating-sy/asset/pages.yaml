  md: '# Computer Science/Computer Engineering/Computing


    # Uses the Running Operation as the Main Thread


    Difficulty in understanding an operating system (OS) lies not in the technical
    aspects, but in the complex relationships inside the operating systems. The Art
    of Linux Kernel Design: Illustrating the Operating System Design Principle and
    Implementation addresses this complexity. Written from the perspective of the
    designer of an operating system, this book tackles important issues and practical
    problems on how to understand an operating system completely and systematically.
    It removes the mystery, revealing operating system design guidelines, explaining
    the BIOS code directly related to the operating system, and simplifying the relationships
    and guiding ideology behind it all.


    # Based on the Source Code of a Real Multi-Process Operating System


    Using the 0.11 source code as a representation of the Linux basic design, the
    book illustrates the real states of an operating system in actual operations.
    It provides a complete, systematic analysis of the operating system source code,
    as well as a direct and complete understanding of the real operating system runtime
    structure. The author includes run-time memory structure diagrams and an accompanying
    essay to help readers grasp the dynamics behind Linux and similar software systems.


    +   * Identifies through diagrams the location of the key operating system data
    structures that lie in the memory

    * Indicates through diagrams the current operating system status information,
    which helps users understand the interrupt state and left time slice of processes

    * examines the relationship between process and memory, memory and file, file
    and process, and the kernel

    * Explores the essential association, preparation, and transition, which is the
    vital part of operating system


    # Develop a System of Your Own


