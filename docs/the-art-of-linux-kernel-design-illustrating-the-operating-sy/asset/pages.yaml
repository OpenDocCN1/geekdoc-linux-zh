    # Comment


    Why is the main function called at first?

    In the program written in C, there is a main function as well. The execution starts
    from the main function. Linux 0.11 is coded in C. It is strange why three programs
    written in compilation language are executed first before the main function when
    the OS starts.

    Usually, the programs written in C are user applications. One important characteristic
    of these programs is that they must be executed on the fundamentals of the OS.
    That is to say, the OS creates a process for programs and loads the executable
    code from the hard disk to the memory. When talking about the OS, the question
    what loads the executable code of the OS exists.

    We know from previous sections that when loading the OS, the computer is just
    powered up. At time, only the BIOS is executed and the computer is in 16-bit real
    mode status. The code on the first sector of the floppy disk (512 bytes) is loaded
    into the memory according to the addresses kept in 16-bit interrupt vector tables,
    and 16-bit interrupt service routine is created by the program BIOS. There BIOS
    ends. Exactly, it is an appointment that loading the first sector is the same
    for any OS. The code on rest sectors is loaded based on the format.

    So why not execute the main function right after loading the code of OS?

    As know, Linux 0.11 is a 32-bit, real-time, and multitasking OS. Hence, the main
    function must execute a 32-bit code. When compiling the OS, there are 16-bit and
    32-bit compilers. In the 16-bit condition, the compiled code is 16 bits. It may
    be because of a variable of type that has only 2 bytes. However, Linux 0.11 wanted
    the compiled code of 32 bits. Only in this way will the code of the OS be 32 bits.
    The 32-bit code can use a 32-bit, protected mode, and paging. It is thus a modern
    OS with real-time and multitasking characteristics. The 16-bit real mode is completely
    different from the 32-bit protected mode. So what can change the real mode to
    the protected mode? The answer is "head.s." The program head.s opens the address
    A20, opens pe and pg, abandons the old 16-bit interrupt response mechanism, and'
