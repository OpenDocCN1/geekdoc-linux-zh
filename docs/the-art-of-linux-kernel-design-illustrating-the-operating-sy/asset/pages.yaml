  md: '# I.2.2 Loading the Second Part of Code——Setup


    # 1. Bootsect memory planning


    Now, BIOS has loaded Bootsect into the memory. Then, it loads the second and third
    sectors into the memory. But first of all, the Bootsect would do some planning.


    In general, we use a high-level language, such as C, to write programs and run
    these programs on an OS. We just write the code and do not care about its location
    in the memory. It is because the OS and the compiler have done a great deal of
    ensuring that it works correctly. Since we are now focusing on the OS itself,
    we have to better understand the memory arrangement to ensure that no matter how
    the OS runs, there are no collisions between code and code, between data and data,
    and between code and data. To do so, we would like to discuss the memory planning.


    In the address mode, the maximum memory is 1 MB. To arrange the memory, Bootsect
    has the following code:


    ```

    SETUPLEN = 4               ! nr of setup-sectors

    BOOTSEG = 0x07c0           ! original address of boot-sector

    INITSEG = 0x9000            ! we move boot here - out of the way

    SETUPSEG = 0x9020           ! setup starts here

    SYSSEG = 0x1000            ! system loaded at 0x10000 (65536) .

    ENDSEG = SYSSEG + SYSIZE   ! where to stop loading

    ```


    The code is to set the location of the following variables: the number of setup
    program sectors (SEPLEN), the address of the setup (SETUPSEG), the address


