    The BIOS puts the interrupt vector table at the beginning of the memory, which
    is 1 KB (0x00000–0x03FF). The BIOS data area is next to it, 256 B (0x00400–0x04FF),
    and then the interrupt service routine (8 KB), 56 KB, comes after it (0x00E05B).
    Figure 1.2 shows its exact locations.


    **Tip:**


    Note that 0x00100 is 256 bytes and 0x00400 is $4 \times 256$ bytes = 1024 bytes,
    or 1 KB. Since it is from 0x00000, the high section of the 1 KB is not 0x00400
    but 0x0400-1 instead, which is from 0x003FF.


    The interrupt vector table has 256 interrupt vectors and 4 bytes for each vector,
    including 2 bytes for CS and 2 bytes for IP. Each interrupt vector points to a
    particular interrupt service routine.


    We will explain in detail how to use these interrupt service routines to load
    OS kernel into the memory.


    **Tip:**


    INT: interrupt. As its name suggests, INT refers to an interrupt of an ongoing
    process. An external event interrupts the program that is being executed, run
    to a specific procedure to handle this event. After the INT procedure is done,
    the interrupted program will continue. Interrupts are quite similar to the function
    in C.


    Interrupt means a lot to the OS; we will discuss it further later on.


