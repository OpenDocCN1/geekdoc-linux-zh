- img_proc: true
  md: 'After this program is compiled and linked, an executable file will be generated.
    We run this program on Linux, and eventually the system will display "hello world"
    on the screen. Intuitively, "hello world" displayed on the screen is all because
    of the programs we have written, but in fact, the program we have written only
    plays a small role. Obviously, the program calls the printf library of C language
    because the theme of this book is the operating system, so we won''t discuss library
    function.


    Let''s briefly investigate what the Linux 0.11 operating system has done for running
    the program. The following small words are summary of the operating system work,
    involving more than 10,000 lines. Except for process communication, it touches
    on all aspects of the operating system. We want readers to have an intuitive understanding
    of what Linux has done when the simplest program is running.


    Case description: There is an executable file named hello in hard disk, and the
    source program of the file is as follows:

    Now the system has in the idle state, the user prepares to make the program of
    the file in the hard disk load and execute through typing a command, "hello",
    and eventually to make the hello world string display.

    The first step: The user inputs command, and shell process is woken up to analyze
    the order.

    To achieve this step, the system will do at least the following preparations:

    (1) The user stroke, and the information typed is received in terminal equipment
    tty0.

    If the system operates the terminal equipment in the form of it, it needs to construct
    a set of file systems, then load the file system, so as to operate the files on
    this basis. The file system includes "super block," "logic bitmap," "node bitmap,"
    "file i node," "block," Second, classify the data according to the different function
    of files, including regular file, device file, directory file, etc. tty) belongs
    to device files. It is likely to operate terminal device tty0 with these preparations.

    (2) After stroke, it also produces the keyboard interrupt, and the system will
    be able to process the keyboard interrupt.

    First of all, the interrupt will transmit to programmable interrupt controller
    8259A, so we need to set the interrupt controller 8259A. Then, the interrupt will
    be communicated with the CPU, and the CPU will find the interrupt descriptor table
    through the interrupt descriptor register IDTR and then find the keyboard interrupt
    handler by searching the interrupt descriptor table and execute the program. In
    order to realize these operations, it needs to construct a set of interrupt service
    systems, including the interrupt descriptor register IDTR setting, and establishing
    an interrupt descriptor table to link the interrupt service routine to be able
    to serve for the specific interrupt. In addition, it needs to link the interrupt
    service routine with the interrupt descriptor table.'
