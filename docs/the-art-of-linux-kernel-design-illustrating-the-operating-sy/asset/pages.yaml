    \ be able to execute at the label of ret_from_sys_call; and call the do_signal()\
    \ function eventually. Then it will begin to process the signal of the processing\
    \ process. The specific code is as follows:\n\n```\n// code:path/kernel/sys_call.s\n\
    ret_from_sys_call:\nmov _ret,%eax      # task[0] cannot have signals\ncmpl _task,%eax\n\
