  md: '# #8 Inter-Process Communication


    The previous chapters explain that the processes are not allowed to cross the
    border to access other process''s codes and data in Linux 0.11, which is the core
    content of the protected-mode of the operating system.


    From the practical point of view, the processes often need to work cooperatively
    and share mutual information, which seems to be contrary to the process protection.
    The problem is how to achieve the reasonable requirements of interprocess communication
    without destroying the process protection? The Linux 0.11 operating system designs
    two sets of mechanism to provide the requirements. One is the “pipe mechanism,”
    and another is the “signal mechanism.” In this chapter, we will give a detailed
    introduction about the two mechanisms via actual application cases.


    # ## 8.1 Pipe Mechanism


    In order to protect the process and complete interprocess communication without
    crossing the boundaries, Linux 0.11 bypasses the boundary protection of the process
    and designs the pipe mechanism. Each pipe allows two processes to interact data.
    One process inputs data into the pipe; another outputs the data from the pipe.
    Thus it completes interprocess communication and does not need to cross the boundary
    of process (Figure 8.1).


    The operating system provides a page of memory for each pipe. It gives the file
    attribute to the page of the memory (the reason for giving the file attribute
    will be explained'
