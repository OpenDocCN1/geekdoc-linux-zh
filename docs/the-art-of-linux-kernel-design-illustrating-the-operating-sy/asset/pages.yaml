    \ with the hard disk.\n\nThe transaction is totally about one buffer block and\
    \ one data block. So we don't need to consider the sharing problems. As a result,\
    \ there is no field like b_count in the request. There are two states in the request\
    \ about the account connection, busy and free. So the dev field is not only to\
    \ present the device number, but it is also used to judge whether the request\
