  md: "# 2.7 Binding with the Interrupt Service Routine of Peripherals and Establishing\
    \ the Human–Computer Interaction Interface\n\nLinus Torvalds originally designed\
    \ chr_dev_init() in the OS to initialize the character device, but it does nothing.\
    \ Linus then implemented tty_init() to initialize the character device. Note that\
    \ some people explain tty as teletype.\n\nCharacter device initialization blocks\
    \ work environment for process and serial port, which means initializing serial\
    \ port, display and keyboard, and binding the relevant interrupt service routine\
    \ with IDT (interrupt descriptor table). In tty_init, it first calls rs_init to\
    \ set the serial port and then calls con_init to set the display. The specific\
    \ code is as follows:\n\n```\n//Code path:init/main.c:\nvoid main(void)\n{\n \
    \   ....\n    tty_init();\n    ....\n}\n//Code path:kernel/chr_dev/tty_io.c:\n\
    void tty_init(void)\n{\n    rs_init();\n    con_init();\n}\n```\n\n# 2.7.1 Set\
    \ the Serial Port\n\nThe two serial port interrupt service programs and IDT are\
    \ connected, and two serial ports are initialized based on the content of the\
    \ tty_table data structure, including the following: setting the line control\
    \ register DLAB bit, setting the send baud rate, and setting the DTR and RTS.\
    \ Finally, IRQ3 and IRQ4 of 8259A are enabled to send the interrupt request.\n\
    \nThe specific process of binding is shown in the upper part of Figure 2.12.\n\
    The specific code is as follows:\n\n```\n//Code path:kernel/chr_dev/serial.c:\n\
    void rs_init(void)\n{\n    set_intr_gate(0x24,rs1_interrupt);      //Set interrupt\
    \ of serial port 1,\n    set_intr_gate(0x23,rs2_interrupt);      //referring 2.5\n\
    \    init(tty_table[1]).read_q_data);        //Set interrupt of serial port 2\n\
    \    init(tty_table[2]).read_q_data);        //initialize serial port 1\n    outb(in_p(0x21)&0xE7,\
    \ 0x21);          //initialize serial port 2\n                               \
    \         //allow IRQ3, IRQ4\n}\n```"
