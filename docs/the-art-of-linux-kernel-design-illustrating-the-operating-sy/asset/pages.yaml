- img_proc: true
  md: 'The OS accesses a file according to the demand of user process. The kernel
    can control the process of opening a file many times or once through `filp[20]
    Once a file or a different one is opened, an item in `filp[20]` is occupied (e.g.,
    if the file "hello.txt" is opened twice by the user, two items in `filp[20]` are
    occupied) to store the pointer. Hence, in one process, the total numbers of opening
    a file at the same time cannot be more than 20.


    In the OS, file_table[20] is the data structure that manages all processes used
    to open a file. It records the following information: different processes open
    different files, different processes open the same file, and different files are
    opened many times by the same process. Similar to filp[20], once a file is opened,
    it is recorded in file_table[64].


    The node is the most important data structure that records file profile. In the
    OS, the i node corresponds to files one by one; hence, the i uniquely identifies
    a file. The kernel keeps tracks of these file nodes using through inode_table[32],
    and each file i node in use is recorded. The nature of opening a file is to build
    up the relationship among filp[20], file_table[64], and inode_table[32], that
    is, to build up the relationship represented by the orange line in Figure 5.2.


    ![](img/f661d64b7eb54840fcb4d65765a4e933_251_0.png)


    Figure 5.2 Overview of opening a file.


    5.2 Opening a File'
