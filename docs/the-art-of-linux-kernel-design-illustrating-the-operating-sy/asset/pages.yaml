    \ the relationship clears clears buffer; then set the b_uptodate of the buffer\
    \ to be 1. Of course, the data is not virtually synchronized, and the data of\
    \ the buffer and hard disk is inconsistent, but this does not affect the synchronization\
    \ of the data correctly.\n\nWe learned from Chapter 5 that the new built block\
    \ has only two uses: to store the contents of the files or to store the indirect\
    \ block management information of the i_zone of the file. If it is used to store\
    \ the contents of the files, the new built data block and the new built hard data\
    \ block are all the garbage data, and they are not the process needed; no matter\
    \ whether the data is updated, the consequence is \"equivalent\" to solving the\
