  md: "TSS LDT are critical to process protection. The essence of protection is to\
    \ prevent the process from interfering with other process when it is running.\
    \ In the term of segment, there are two ways to jump to another process:\n\nThe\
    \ first, as mentioned before, carrying out a jump instruction within a segment\
    \ while the jump value exceeds the segment length limit. The hardware is guarding,\
    \ and LDT keeps a record of the process segment base address and segment limit.\
    \ Each instruction, executed, will be checked by the hardware to determine whether\
    \ it exceeds the segment length limit. If so, it will be reported to GP and come\
    \ to interception.\n\nThe second is when an inter-segment jump is executed to\
    \ implement an inter-segment jump when the process is running. In Linux 0.11,\
    \ each process has its own LDT, in which situation the process is executed in\
    \ privilege level 3, and the LDT provides a segment descriptor. When, an an inter-segment\
    \ jump is conducted, the current LDT shall be replaced by the LDT of another segment,\
    \ in order to modify the segment descriptor. This must be caused by the instruction\
    \ “LDT” in which the base of LDTR and LDT are needed. However, the instruction\
    \ LDT can only be executed under privilege level 0. LDT cannot be modified by\
    \ this. Furthermore, there is no way that a current process jump to another segment;\
    \ in other words, the process cannot jump to other processes.\n\nAssuming Linux\
    \ 0.11 takes any different process protection pattern, in which all processes\
    \ record their segment descriptor by GDT rather than LDT, then modify GDT by LDT\
    \ instruction is not the only way to realize inter-segment jump. Surely, an inter-segment\
    \ jump will be possible, which will disrupt the process protection. As we see,\
    \ the segment level protection is well designed by the designer of Linux.\n\n\
    Both protections have been guaranteed, and the segment level is finished completely.\
    \ On the basis of segment level protection, we implement the page level protection.\n\
    \nAs we can infer from two invocations of function get_free_page(), the whole\
    \ procedure is finished by kernel, and if the pages are not mapped to the processes\
    \ linear address space, they will not be accessible for the processes. When considering\
    \ mapping, the page directory table and page table must be fetched. And the page\
    \ entry in the page directory table is determined by the linear address space\
    \ of the process. So long as the linear address spaces are not overlapped, the\
    \ processes memory will not happen.\n\nSet the status of strl to ready. So, the\
    \ procedure to create the process str is finished. We will now set its status\
    \ to “ready,” which means that process str is ready for the schedule.\n\n```\n\
    // code path: kernel/fork.c\nint process(int nr, long abp, long edi, long esi,\
    \ long gs, long none,\n    long ebx, ecx, edx,\n    long fs,es, long ds\n{\n \
    \   set_tss_desc(gdt+(nr+1)+TSS_ENTRY,&(p->tss));\n    set_ldt_desc(gdt+(nr+1)+FIRST_LDT_ENTRY,&(p->ldt));\n\
    \    p->state = TASK_RUNNING; /* do this last, just // the status to be ready\n\
    \    return last_pid;\n```"
