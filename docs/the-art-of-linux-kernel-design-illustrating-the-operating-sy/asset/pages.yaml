    the time slice of B is clearly more than of process A, so switch to the process
    B. The system has already applied for the buffer block for process B. At that,
    the buffer block is locked, so process B has to be suspended. Now the buffer block
    is still locked, so process B will be suspended again, and the system switches
    to process A as shown in Figure 7.4.


    Now the current process is A, which is suspended because of lacking request items
    when it synchronizes the buffer block. As if it wakes up, the system will continue
    to synchronize buffer block. As be seen in Figure 7.44, now the system has free
    claims for writing disk. This request item is bound with the buffer block that
    will be synchronized soon, and it is inserted into the request queue. Then there
    is free request item, so process A will be suspended again as is shown in Figure
    7.45.


    Next, the steps will be repeated. On one hand, as long as the hard disk has completed
    a synchronized operation, it will release a request item, and the corresponding
    buffer block will be unlocked. The process waiting for idle request or for the
    buffer block to unlock is woke up by these. On the other hand, awakened processes
    cause data interaction between the buffer and the hard disk constantly that those
    processes are suspended constantly as shown in Figure 7.46.


    Until the last three processes have completed each read write disk tasks as are
    shown in Figure 7.47.


