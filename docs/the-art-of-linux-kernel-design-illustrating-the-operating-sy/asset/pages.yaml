  md: "# #9 Operating System’s Design Guidelines\n\nKings have long arms; all within\
    \ the boundaries, has the kings’ servants\n\n> > —The book of Lesser Odes\n\n\
    The former eight chapters have analyzed and explained the operation principle\
    \ and working-mechanism of the Linux operating system in great detail, and this\
    \ chapter will try to explore the operating system design guidelines from the\
    \ designer’s view.\n\n+   9.1 Run a Simple Program to See What the Operating System\
    \ Has Done\n\nThe most effective way to understand the operating system clearly\
    \ is to see what the operating system has done when a simple program is executed\
    \ on a computer. We take a “hello world” of C language version as example:\n\n\
    ```\n#include <stdio.h>\nvoid main()\n{\n    printf(\"hello world\\n\");\n}\n\
    ```"
