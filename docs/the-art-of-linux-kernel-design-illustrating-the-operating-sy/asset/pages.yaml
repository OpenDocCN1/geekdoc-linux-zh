  md: '# 2.14 Process O Moves from Privilege Level 0 to 3 and Comes a Real Process


    Linux OS requires that all processes be built by an existing process in privilege
    level 3, with the exception of process 0. In Linux 0.11, the code and data of
    process 0 are written in the kernel of the OS. It is in privilege level 0; at
    this time, strictly speaking, the process 0 is not a real process. In order to
    comply with the rules, before process 0 creates process 1, process must be moved
    from privilege level 0 to 3. The specific method is to call the function move_to_user_mode_,
    imitating the interrupt return method, to move the privilege level of process
    from 0 to 3.


