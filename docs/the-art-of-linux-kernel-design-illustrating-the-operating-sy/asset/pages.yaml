  md: '# 3.1.2 Apply for an Idle Position and a Process Number for Process I


    The sys_fork function begins to work.


    As introduced in 2.9, all items except for the 0 of task[64] have been cleared
    by sched_init(). Now, find_empty_process will be called to find an available pid
    and location in task[64]. The calling effect is shown in Figure 3.3.


    In find_empty_process(), the global variable last_pid is used to store all the
    processes after booting, and this variable is also used as the pid of newly created
    process. After traversing task[64] for the first time, the kernel executes ++last_pid
    because of the true "&" condition. On the second time, the kernel will get the
    first idle i, which is also named as the task.


    After two passes, the new process number of last_pid is 1, occupying the second
    item of task[64]. The result is shown in the middle right part of Figure 3.3.


    ![](img/f661d64b7eb54840fcb4d65765a4e933_105_0.png)


    Figure 3.3 Find an idle item in the kernel data area.'
