    \nWhen the process applies to the kernel, it could only make the choice from the\
    \ following two conditions: 1) Let the process share the buffer with the other\
    \ processes, using all the value of the control fields or 2) apply a buffer not\
    \ to be used by any other process for this process and reset all the control fields.\n\
    \nThe process needs to know which buffer has been occupied and which is not in\
    \ order to make the choice. Some buffers might be shared by more than one process,\
