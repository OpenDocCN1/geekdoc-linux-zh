- img_proc: true
  md: '# # Preface


    During the past several years, we have worked very hard to develop a new operating
    system that could resist any intrusion attacks of illegal program from outside.
    We have established two testing sites to welcome all hackers around the world
    to give it a try. People can access the following website for intrusion testing:

    ftp://203.198.128.163 or ftp://114.242.35.6


    During the process of developing the new operating system, we realized that the
    importance of understanding the operating system as a whole is much greater than
    focusing on details. The easiest way to understand the operating system is to
    look into a simple operating system instead of any modern complicated ones nowadays.
    It is the main reason that we have chosen Linux 0.11 (less than 20,000 lines of
    source code). After 20 years of development, compared with Linux 0.11, Linux has
    become very huge, complex, and difficult to learn. Learning Linux 0.11 still has
    important practical significances.


    We have not only analyzed the detail of source code and the execution sequence
    of the operating system but also focused on the "jobs" the operating system has
    done, especially the relationship among them, their means, the reason that they
    are executed, and the design ideas that are hidden behind them. All of these have
    been analyzed in detail


    +   - The book is divided into three sections to explain the Linux operating system:
    the first part (Chapters 1 to 4) analyzes the processes from booting the operating
    system to the operating system that has been initialized and enters into the idle
    state; the second'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'part (Chapters 5 to 8) describes the actual operation process and status of
    the operating system and the user process during execution of the operating program
    after the idle state; the third part (Chapter 9) describes the entire Linux operating
    system design guidelines, from microscopic detail to macroscopic architecture.


    In the first section, we explain the powering and booting BIOS in great detail,
    the BIOS loading the operating system, the initialization of the host, operating
    protected mode and paging, calling main function, creating process 0, 1 process,
    2, and shell process, and the interactions with peripheral through the file system.


    In the second part, we provided some simple but classical application programs
    and explained the mount file system in detail, file operations, user process and
    memory management, multiple processes operating files, and IPC among user processes
    with the background of the implementation of these procedures.


    We try to integrate the principle of the operating system into the explanations
    of the actual operation process of a real operating system. We hope that after
    reading, the readers find that the operating system is not a pure theory, or that
    the "liberal arts" concept of computer theory, is systematic and has real, concrete,
    and actual code sense. Theory and practice are closely bonded with each other.


    The third section elaborates the "master-and-save mechanisms" and three key technologies
    to achieve the mechanisms: protection and paging, privilege level, and interruption.
    It also analyzes the design factor to ensure master-and-save mechanism—the initiative,
    furthermore, detailed explains the buffer, shared pages, signals, and pipeline
    design guidelines. We try to explain the operating system design guidelines from
    the perspective of the operating system designers. By using the system ideology,
    we hope to help readers understand and navigate the operating system itself and
    the design ideas hidden behind.


    This book was translated by Dr. Tingshao Zhu, the professor of the Institute of
    Psychology, Chinese Academy of Sciences. Without his wisdom and hard work, it
    would have been impossible to bring this book to English readers.


    I also want to thank Wen Lifang, the vice president of Huazhang Press, China Machine
    Press, and Yang Fuchuan, the deputy editor of Huazhang Press. They gave a full
    range of support to the Chinese version of the book. I especially thank Mr. He
    Ruijun, CRC Press, who handled the publishing to the English version and gave
    us great help. I would also like to thank Kari Budyk, CRC Press, and the help
    of Mr. Zhang Guoqiang and Miss Yang Jin.


    Yang Lixiang


    University of Chinese Academy of Sciences'
  merge: -1
