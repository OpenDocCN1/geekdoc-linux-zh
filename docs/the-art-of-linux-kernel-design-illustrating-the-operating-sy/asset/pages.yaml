  md: "# 3.2 Kernel Schedules a Process for the First Time\n\nNow, the code of process\
    \ 0 is executed. From this time, process 0 prepares to switch to process 1 to\
    \ execute.\n\nIn the process-scheduling mechanism of Linux 0.11, there are two\
    \ situations when process switch happens.\n\nFirst, the time allows running processes\
    \ to end.\n\nWhen created, a process is assigned with limited time slice to ensure\
    \ that any process runs in limited time every. When time slice reduces to 0, it\
    \ means that this process used the time and switches to another process to execute.\
    \ This, in turn, is the implementation of multiprocesses.\n\nSecond, a process\
    \ stops running.\n\nIn those situations where a process waits for data applied\
    \ by peripherals or the results of other programs or a process is finished, even\
    \ if there is time slice, a process does not have the logical conditions to continue\
    \ run. If it remains waiting for the time interrupt to switch to another process,\
    \ time is wasted and switching to another process should be done immediately.\n\
    \nEither of the above situations leads to process switch.\n\nThe role of process\
    \ 0 is special. Switching from process 0 to 1 meets the second situation and also\
    \ means idling process. We will talk about the idling process in Section 3.3.1.\n\
    \nProcess 0 executes the line for(); pause() and finally switches to process 1\
    \ by executing the function. The schedule is shown in Figure 3.12.\n\nThe code\
    \ of the function pause() is as follows:\n\n```\n// Code path:init/main.c:\n...\n\
    static inline _syscall0(int,fork)\nstatic inline _syscall0(int,pause)\n\nvoid\
    \ main(void)\n{\n    move_to_user_mode();\n    if (fork()) {\n        /* count\
    \ on this going ok */\n        init();\n    }\n    for(); pause();\n}\n```\n\n\
    The calling of pause() is similar to that of fork(). When it comes to 0x80, it\
    \ calls unist.h, according to interrupt int 0x80 sys_call_table(%ax,4) in system.call\
    \ to the system calling function in sys_pause() to execute. The procedure in details\
    \ refers to calling the function fork() in Section 3.1.1. There is little difference\
    \ that the function fork() is written in assembly language and the function sys_pause()\
    \ is in C language.\n\nIn sys_pause(), it sets process 0 as an interruptible state,\
    \ just as the first step in Figure 3.12. Then, call the function schedule() to\
    \ switch process. The code is as follows:"
