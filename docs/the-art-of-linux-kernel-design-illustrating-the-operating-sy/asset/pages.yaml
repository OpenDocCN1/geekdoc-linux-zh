- img_proc: true
  md: 'tions to write are just alike. So the operating system can be seen as the part
    that is shared by all the applications.


    Modern operating systems like Linux not only provide support for applications,
    but also support the running of several programs at the same time. It means that
    the operating system not only supports peripherals, but also makes efficient organization
    and coordination for many programs that are running, in order to avoid any program
    obtains the whole resources of CPU, RAM and peripherals, making the other programs
    unable to work normally. Besides, it has to prevent mutual reading, writing, and
    covering among running programs to make sure all the programs run normally. The
    key is that the operating system can''t be read or written directly by applications,
    or covered by applications.


    # 9.2 Thoughts on the Design of the Operating System: Master–Slave Mechanism


