    (of course, if the process does not need to deal with signals, it can return to
    the “interrupt position” place directly, but now we must process the signal problem
    first, and then go to the “interrupt position”).


    After the soft interrupt, the CPU automatically saves the “instruction and data”
    in the kernel stack of current process. The “instruction and data” include the
    value in EIP, EFlags, CS, ESP, SS registers, and so on. As long as the system
    call returns, these values in the “kernel stack” will be popped to the corresponding
    register, so the process will be continued from the user space “interrupt position”.


