  md: 'But solving these problems is far from enough; the program''s loading is also
    a very exquisite strategy, of which the most important is page fault interrupt
    mechanism; many must analyze whether it needs to apply for a new page to load
    the content of the program according to the need. For this reason, it needs to
    judge much the necessity of loading, such as whether the corresponding physical
    address of linear address been mapped into the linear address space, which requires
    a physical address to linear address mapping scheme. In addition, the design of
    the page fault interrupt mechanism is also very exquisite. For example, a page
    fault is not equal to loading in the peripherals program. For example, page exception
    as the result of pushing stack also needs to apply for a new page to load data,
    but this has no relationship with peripherals. These are all problems that the
    designing of the page fault interrupt mechanism must be comprehensively considered.


    In short, the load of program "hello world" almost involves all aspects of file
    management and memory management. Moreover, the above is just the most basic introduction
    of loading process "hello world". Linux supports the execution of the processes,
    and each process is likely to load its own programs, furthermore, and memory are
    the resources processes share, there still exists a more complex management relationship
    between them. For example, when two processes load the same file "hello world",
    whether to share, how to share, how to calculate the count of page reference after
    share, how to determine the attribute of reading and writing, we are all problems.


    Step 4: Program "hello world" starts to execute, making string "hello world" display
    on the screen.


    Program "hello world" will start to execute after loading into memory. The program
    is simple, and it is to let the string "hello world" display on the screen. Even
    but, the system will have to do a lot of work for this, of which the most important
    is the aspects about display, such as how to determine the video card attributes,
    display card is monochrome or color; how to determine the video memory location;
    how to determine the position on the screen; if there are too many characters;
    rolling is needed and how to display, it. These problems will be all done by the
    operating system, and it directly interacts with the bottom hardware of the display.


    From description, we can easily find that the operating system does a lot of work
    to run a simple program. By may the operating system, we can conclude that if
    we think in the contrary way: Without the operating system, we have to write all
    these complex programs with the function of an operating system even to print
    a message "hello world" on the screen. No doubt that without the operating system
    we can hardly load computer with programs and not get the results.


    So does the operating system do to run on the earth?


    Through comprehensive analysis, we get some conclusions here: OS is supposed to
    provide applications of the programs for the use of hard disks, monitors, and
    keyboards. In other words, the operating system provides supports to peripherals
    for the running of an application. If the operating system doesn''t write these
    supporting programs, the application has to write them, and the contents of these
    programs that all the-'
  merge: -1
