    \ the accuracy of the file operations. Although the data of the buffer and the\
    \ hard disk block is different by now, according to the same reason, the b_uptodate\
    \ could be assigned 1.\n\nThe designer gives an overall consideration and takes\
    \ this strategy: as long as we allocate the buffer for the new data block, no\
    \ matter what the buffer is used in the future, the process does not need the\
