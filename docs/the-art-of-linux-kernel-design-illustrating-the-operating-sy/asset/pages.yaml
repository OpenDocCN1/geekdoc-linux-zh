  md: '# 6.1 Linear Address Protection


    Now, computers basically follow the Von Neumann system. In the system, instruction
    and data are stored in the same memory. Memory designed as random-access memory
    (RAM) can read and write data or instructions arbitrarily. When there is no protected
    mode, different user program codes and data have no physical difference; they
    are formed by a series of 0s and 1s. There is no mechanism to stop mutual interference
    between different user programs.


    When operating real-time multitasking, the first problem is how to ensure that
    every process has no interference with other processes, that is, ensure one process
    has no access to the other process''s codes and data.


    # 6.1.1 Patterns of the Linear Address Space


    In the IA-32 CPU architecture, as long as it opens PE and PG, all programs that
    are running on your computer use only the linear address and turn it into a physical
    address; the conversion is done by the hardware.


    The linear address is the address that the CPU can understand. Under the IA-32
    architecture, the linear address space ranges from 0 to 4 GB for 32-bit. In order
    to separate the address memory space, Linux 0.11 separates the 4 GB linear address
    space into 64 portions; every portion is 64 MB, and every process owns one portion,
    or it requires that the process cannot cross the starting point and the ending
    point. In this, the linear address space of the processes are not overlapping
    each other, achieving the protection of process memory. This is the core of OS
    Linux 0.11; any other designs should be subordinated to this pattern.


    Task[64] is the best pattern of this thing; the registration and cancellation
    of all processes are centrally managed by it; only positioned in task[64], a process
    can be arranged in linear address space. According to no or in task[64], the OS
    can find LDT in the GDT. Task[64] has a key role to control the total processes
    and connect the process with LDT and TST in the GDT.


    Although paging the 64 GB is equally in the linear address structure, it can effectively
    stop the visit of access across a 64 MB linear address space. In others, it can
    ensure that the linear address space of a structure do not overlap each other?


    While operating system kernels make out a structure about the linear address space
    of processes, it cannot only rely on algorithms and controlling logic to block
    cross-boundary processes. The reason is that CPU can perform only one instruction
    at a time, further, it cannot execute kernel instruction when it is implementing
    the instruction of process. So, no matter how well the algorithm to control cross-boundary
    processes, when the process visits a cross-boundary process.


    The software does not work; it can only rely on the hardware.


    Intel IA-32 architecture designed a method that was based on the hardware of the
    CPU process control method of access addresses.


