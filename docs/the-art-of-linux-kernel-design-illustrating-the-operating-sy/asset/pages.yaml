    \ address space overall pattern, and in the IA-32 system, it divides a 4 GB linear\
    \ address space into 64 partitions, and each processes one process without interfering\
    \ with one another, and the page directory entry's design fully complies with\
    \ this pattern. The Linux 0.11 paging directory table has only one, and a page\
    \ directory table controls 1024 pages, and a page table controls 1024 pages. A\
    \ page has 4 KB, and a page directory table controls 1024 * 1024 * 4 KB = 4 GB\
    \ memory space. Divide a page directory table into 64 portions, and each process\
    \ can take a 16-page directory items, a 16-page tables, an occupied 64 MB physical\
    \ space. This makes for each process to be mapped to a different page table entry,\
    \ and the page table is also mapped to a different page entry, when the MMU analyzes\
    \ the linear address of any process, finally, it can be mapped to a different\
    \ physical address. Course, for sharing page needs, a different linear address\
    \ is allowed to mapping to the same page, but that is just the practical application\
    \ demand, a kind of strategy. A page directory table, page table, page, and this\
    \ mapping mode are enough to support the only page mapping to the linear address\
    \ of the process.\n\nTo the sharing page problem, we will introduce you below.\n\
    \n# 2.2.3 Process Sharing the Page\n\nEach process will map to its own linear\
    \ address space when process paging, and process execution will not interfere\
