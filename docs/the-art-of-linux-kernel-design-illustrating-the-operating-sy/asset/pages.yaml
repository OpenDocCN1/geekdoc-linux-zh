  md: "# 2.8 Time Setting\n\nstartup_time is the basis of calculations related to\
    \ time. In the OS, some operations depend on time information, furthermore, some\
    \ programs need the time as parameter, for example, the file modification time,\
    \ file access time, node modified time, and so on. Other time information can\
    \ be calculated according to startup_time.\n\nThe process is as follows: First,\
    \ the system collects time data by calling time_init, which is on CMOS, a small\
    \ memory chip on the main board, to extract different level time factors, for\
    \ example, second time_sec, minute time_tm_min, year time_tm_year, and so on.\
    \ Then, integrate these factors to startup_time.\n\n```\n//Code path:init/main.c:\n\
    void main(void) {\n    time_init();\n}}\n```\n\n```\n#define CMOS_READ(addr) \
    \            //read time data from COMS\noutb_p(0x80|addr,0x70); \\ //0x80|addr:read\
    \ CMOS address,0x70:write port\ninb_p(0x71); \\ //0x71 : read port\n\n#define\
    \ BCD_TO_BIN(val) = ((val) & ((val)>>4)*10)//Change 10 hex to 2\n//hex\nstatic\
    \ void time_init(void) {\n    struct time_t {\n\n    do {\n        time.tm_sec\
    \ = CMOS_READ(0);//the second value of current time, The\n        time.tm_min\
    \ = CMOS_READ(2);//following analogy\n        time.tm_hour = CMOS_READ(4);\n \
    \       time.tm_day = CMOS_READ(7);\n        time.tm_mon = CMOS_READ(8);\n   \
    \     time.tm_year = CMOS_READ(9);\n    } while (time.tm_sec !)\n    BCD_TO_BIN(time.tm_sec);\n\
    \    BCD_TO_BIN(time.tm_min);\n    BCD_TO_BIN(time.tm_hour);\n    BCD_TO_BIN(time.tm_day);\n\
    \    BCD_TO_BIN(time.tm_mon);\n    BCD_TO_BIN(time.tm_year);\n    time.tm_mon--;\n\
    \    startup_time = kernel_mtime(&time);//boot time, start from 0 clock 1970.1.1;\n\
    ```\n\n```\n//Code path:include\\asm.io:\n//embedded assembler refers to the comments\
    \ of\n#define outb_p(value,port) //trap_init\n_asm (\"\\outb%%al,%%dx\\n\" //write\
    \ value to port\n    \\tjmp %1\\n\" //jmp to the first 1 to delay)\n```"
