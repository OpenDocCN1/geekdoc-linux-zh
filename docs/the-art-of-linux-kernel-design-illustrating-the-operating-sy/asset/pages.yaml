    Why can''t the system use this paging method to manage the memory within 1 MB?
    The reason is that the designer implemented two paging management methods for
    the kernel and the user process. For the kernel, the linear address and physical
    address are exactly the same and mapped one by one. This means the kernel can
    access the physical address directly. But for the user, the linear address differs
    from the physical address dramatically. The aim of the design is that the user
    process cannot extrapolate the special physical address by the linear address.
    The kernel can access the user process and the user process cannot access the
    kernel and other user processes. The memory space within 1 MB is just for the
    code and data controlled by the kernel, which the user process cannot access.
    The memory space beyond 1 MB, especially the main memory, is for the user process.
    We will talk about memory management detail in Chapter 6 and the mechanism behind
    Chapter 9.


    # ## 2. Binding the Interrupt Service Routine


    The user process and the kernel often use interruption and handle many exceptions,
    such as overflow, boundary checking, page fault exception, and so on. The interruption
    mechanism is also widely used in system. These interruptions and exceptions need
    a special service program to execute. The function trap_init can hook the service
    program of the interruption and exception to the interruption descriptor table
    (idt), which also rebuilds the interruption to support the operation of the kernel
    and the process in the host.'
