  md: '# FTP from a browser


    Most browsers natively support the FTP protocol. Accessing ftp archives is as
    simple as clicking on a download link or entering the URL for the ftp site (Exhibit
    12-24).


    Not every download link you may see on a web site is an ftp link. The HTTP protocol
    is also used for file transfers.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_258_0.png)


    # Other graphical ftp clients


    gFTP and IglooFTP are among the other graphical ftp clients that are available.


    # gFTP


    The Gnome FTP program, gFTP, is a GUI front end to the File Transfer Protocol
    (FTP) program. gFTP also supports the HTTP and SSH protocols.


    The program is multithreaded, allowing for simultaneous downloads. It also makes
    the transfer of files between two remote machines (Ftp file transfers) possible.
    gFTP provides for:


    +   * Multi-platform directory listings

    * Passive and non-passive file transfers

    * Drag and drop

    * Caching of remote directory listings

    * Resuming interrupted file transfers

    * Downloading of entire directories'
