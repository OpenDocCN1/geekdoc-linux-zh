- pgno: 55
  md: '# Topic B: GRUB


    The Grand Unified Bootloader (GRUB) is an alternative to the standard LILO bootloader.
    Red Hat Linux 7.2 and later use GRUB as the default bootloader; however, LILO
    can still be used. One significant advantage over LILO is that it reads its configuration
    file at every boot. This means that changes to the configuration go into effect
    without the administrator being required to remember to re-install the bootloader.


    # The GRUB configuration file


    The file used for configuring GRUB is /boot/grub/grub.conf. Some texts state that
    the configuration file is /boot/grub/menu.lst. In Red Hat this is just a symbolic
    link back to grub.conf. Like the LILO configuration file, any lines that begin
    with a number (#) are comments.


    # Global settings


    Let''s analyze the global settings of a typical grub.conf file:


    ```

    default=1

    timeout=10

    splashimage=(hd0,0)/gr/splash.xpm.gz

    password --md5 $1$/RZR/$7p/BXueWzfFc8bWPCsF21

    ```


    The first line indicates which title will be loaded by default. The numbering
    in this file starts with 0, so in this case it will boot the second title by default.


    The timeout indicates the time in seconds that the GRUB menu will appear before
    the default title is automatically selected.

    The splashimage is the picture that is loaded as a background for the GRUB menu.
    The format of this file is a gzipped xpm. The picture should be 640x480 in size
    and should use a 14 color palette. Notice that the hard drive reference (hd0,0).
    GRUB requires that the device name be enclosed in parentheses. Floppy drives are
    referenced with ffd while hard drives are accessed with hd. GRUB does not distinguish
    IDE drives from SCSI hard drives. It simply counts the number of drives in the
    system. Again, the counting starts with zero. The second number represents the
    partition, in this case the second partition. The remainder of the line is the
    path to the file.

    The password option allows the administrator to set a password that is required
    to use any of the powerful command-line options supported by GRUB. The --md5 option
    tells GRUB that the password is stored in MD5 message digest format instead clear
    text. The last item on the password line is the password itself. In this case
    we are using MD5 so it is unreadable to humans. If we were not using this option
    the password would be easily'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Item settings


    Similar to the per-image options in LILO, GRUB allows you to specify settings
    that apply only to a particular item. Let''s analyze this section of our grub.conf
    file:


    ```

    title linux (2.4.18-3)

    root (hd0,1)

    kernel /vmlinuz-2.4.18-3 root=/dev/hda3

    initrd /initrd-2.4.18-3.img

    ```


    The first line starts with the keyword title followed by an arbitrary name that
    the administrator can assign. This name will appear in the GRUB menu during the
    system boot.


    The second line indicates where /boot is located. This is known as GRUB device.
    In this example it is located on the second partition of the first hard drive.


    The third line specifies which Linux kernel to boot and is relative to /boot.
    The kernel name is followed by any kernel parameters that need to be passed to
    it. Here you will use the standard device naming because it will be the kernel
    that interprets it, not GRUB.


    The last line indicates the path to the initial ramdisk. This is also relative
    to /boot.


    # Troubleshooting GRUB


    If you made a mistake when editing etc/grub/grub.conf, you can edit the menu entries
    by pressing e to modify the menu arguments. Another alternative would be to enter
    the GRUB command-line mode by pressing c at the menu. If you have configured a
    password for GRUB these menu options will not be available until you press p and
    enter the correct password.


    If you are having problems with the graphical GRUB boot menu, you can boot using
    Linux boot disk then edit the /boot/grub/grub.conf and comment out the splashimage
    by adding a number sign (#) at the beginning of the line or can simply delete
    the line entirely. When you reboot the system you will have a text interface.'
  merge: -1
  img_proc: true
