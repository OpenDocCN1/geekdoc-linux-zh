- pgno: 44
  md: '# Linux structural overview


    Slackware (www.slack.com) was one of the earliest distributions of Linux. It was
    first released in April 1993. It is known for its stability, which it accomplishes
    in part because it is still based on the old BSD style of Init. The BSD Init system
    is the Init system of the original UNIX produced by AT&T and Bell Laboratories.
    Using the BSD Init system, Slackware is fulfilling the mission described on its
    home page “create the most UNIX-like Linux distribution.” Slackware is one of
    the most favored distributions among Linux users. It includes support for all
    the latest software, including desktop environments, window managers, servers,
    and networking utilities/applications. Another development of Slackware is ZipSlack,
    a complete text-based Linux system packaged in roughly a 40 megabyte ZIP archive.
    ZipSlack boots on machines with four megabytes of RAM and will fit on a disk disk,
    allowing anyone to carry a personalized Linux system at all times.


    # Debian GNU/Linux


    Debian (www.debian.org) is one of the older distributions available. Ian Murdock
    began on the original version of Debian (version 0.01) in August 1993. Debian
    prides itself on its method of development. In keeping with the spirit of community
    development, Debian is maintained by an increasing group of volunteers from across
    the globe. Debian keeps all of its packages free and open source. A group of developers
    realized the need for a de-packaging tool, so they created dpkg, which soon became
    a major contribution to open source community. Used to simplify the installation
    process, dpkg worked well with the installation of software, it will not find
    or download packages. As a result, a new de-packaging manager was developed dselect,
    which acts as an interface for dpkg. Using dpkg, dselect also reports dependencies
    and software conflicts for the adding and removing of software. Not completely
    satisfied with dselect, the Debian project created apt-get as an advanced pkg
    tool manager. Apt-get is a text-based program that can be used to install, upgrade,
    and remove software. If configured correctly, apt-get will search the Internet
    on pre-specified mirror sites and download requested software. Like dselect, apt-get
    not only report dependencies and conflicts, but also automatically configure software.


    # Mandrake Linux


    Mandrake Linux (www.mandrakelinux.com), based on Red Hat Linux, is designed to
    be one of the user-friendliest graphical environments. Most system administration
    tasks can be done from a graphical user interface as well as the command line.
    This user-friendliness makes Mandrake Linux one of the best distributions for
    Windows and Mac users who are new to Linux. This also makes it highly popular
    in the education world. Mandrake Linux offers an easy installation program with
    one of the best detection routines and an online demo and tutorial center. An
    automatic software management system makes making a Mandrake Linux system almost
    effortless.'
  merge: -1
  img_proc: true
