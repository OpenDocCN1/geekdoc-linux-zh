    Unit time: 90 minutes


    Complete this unit, and you''ll know how to:


    +   A Create and manage user accounts and groups from the shell and from the GUI.


    +   B Manage printers from the shell and from the GUI.


    +   C Mount and use removable media.


    +   D Monitor important system resources such disk space and the network.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Topic A: Creating and managing user accounts and groups


    Explanation


    You have a number of options when creating and managing user accounts and groups.
    There are command line (shell) and GUI tools that create and manage user accounts
    and groups. You also have the option of directly editing the configuration files
    controlling user accounts and groups.


    # User accounts


    To gain access to the system and system resources, you must log in to a user account.
    Every Linux system has at least one login account: root. On a single user system
    such as a laptop or desktop workstation, it is tempting to use the root for all
    user access. This is a very bad idea. It is far too easy to accidentally damage
    the system as the root user.


    Each account has, at minimum, an entry in the primary configuration file, /etc/passwd.
    On modern Linux distributions, the shadow utilities package is installed by default,
    creating a second configuration file, /etc/shadow.


    Creating a user account, whether using the GUI tools, the shell utilities or by
    directly editing the configuration file(s), requires the creation of a minimum
    set of user attributes.


    # Understanding Linux configuration files


    Every program that runs on Linux can be configured by editing a text file. This
    flexibility allows an administrator to change the configuration of his or her
    system remotely using a text editor, such as vi, pico, or emacs. If you are familiar
    with the Windows environment, configuration files roughly correspond to the Windows
    system registry but are easier to understand, access, and edit.


    The process of modifying a configuration file in Linux is as follows:


    +   - Open the configuration file in a text editor.

    - Make the appropriate changes to the configuration file.

    - Save and exit the file.

    - Restart the daemon to read the changed configuration file and load the new configuration.


    While these steps are straightforward, the complexity lies in knowing configuration
    file(s) to modify, understanding the syntax and meaning of the items in the configuration
    file(s), and knowing which daemon(s) need to be restarted.


    # Configuration files controlling user accounts


    All of user account attributes are kept in the /etc/passwd file on systems without
    shadow password support. The attributes are split between /etc/passwd and /etc/shadow
    on systems with shadow password support. As noted above, current Linux distributions
    install shadow support by default. The essential user account attributes that
    are stored in these configuration files include:'
  merge: -1
  img_proc: true
- pgno: 168
  md: "# Basic system administration\n\n| Attribute | Description |\n|--- |--- |\n\
    | username | A unique alphanumeric identifier |\n| password | Alphanumeric password\
    \ |\n| UID | Unique integer identifying the user |\n| GID | Unique integer identifying\
    \ the group membership(s) of the user account. A user may belong to more than\
    \ one group. |\n| directory | Default log in directory. Not strictly required\
    \ for login. |\n| shell | Default shell started when user logs in |\n\n/etc/passwd\n\
    \nThe format of the /etc/passwd file is:\n\n```\nusername:password:UID:GID:GECOS:directory:shell\n\
    ```\n\nAll of the fields except one are described in the table of user attributes\
    \ above. The GECO field is a description field. By convention, it usually contains\
    \ the full name of the user.\n\nHere is an example of /etc/passwd from a newly\
    \ installed Red Hat system:\n\n```\nroot:x:0:0:/root:/bin/bash\ndaemon:x:1:1::/bin\b\
    in:x:2:2:daemon:/sbin\nadm:x:3:4:/var/adm\nlpd:x:4:7:/var/spool/lpd\nsync:x:5:0:sync:/sbin/bin/sync\n\
