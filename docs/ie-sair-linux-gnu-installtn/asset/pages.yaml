  md: '# Unit 8


    # Basic system navigation


    # Unit time: 60 minutes


    Complete this unit, and you''ll know how to:


    +   A Use basic shell commands to view and control users, directories, files and
    processes.


    +   B Use the Linux GUI (Graphical User Interface) tools and utilities to view
