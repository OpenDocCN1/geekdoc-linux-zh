- pgno: 135
  md: '# Topic A: Fundamental shell commands and utilities


    Explanation


    You have learned that the shell is the Linux command interface (CLI) and that
    the bash shell is the default shell for most Linux distributions. Now it is time
    to use some of the shell commands and utilities to view and, potentially, modify
    important system components and attributes.


    To make use of any operating system there are certain fundamental tasks that you
    must be to perform:


    +   - Find, monitor, and control directories and files.

    - Find, monitor, and control the programs running on the system.

    - Find, monitor, and control system users, even if the system is a single-user
    desktop and you are the only user.

    - Use and customize the user interface.


    # Basic syntax of shell commands


    The basic syntax of shell commands is:


    ```

    $command [flags] <parameter>

    ```


    Flags passed to the command control the command''s execution and/or output. Flags
    are usually in the form of alphanumeric characters preceded by a minus sign (-).


    Parameters are usually paths to files. However, each command is unique in the
    parameters it will accept. The man pages are the ultimate documentation and should
    be consulted to be sure.


    # Directories and files


    The two most basic tasks related to files and directories are moving between directories
    and listing the contents of a directory.


    # Moving between directories


    The cd command is used to move between directories. The syntax of the cd command
    is:


    ```

    $cd [flags] [path]

    ```


    [path] is either a full or relative path to the directory.


    A full path describes the explicit path to the directory from the root. For example:


    ```

    $cd /var/ftp/pub

    ```


    changes your current directory to the /var/ftp/pub directory.


    A relative path starts from your current directory. If you had already changed
    the directory to /var, then the /var can be omitted:


    ```

    $cd ftp/pub

    ```


    A couple of characters of special importance to navigating directories are the
    period (.) and the double period (..).'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Basic system navigation 8-3


    The period (.) is shorthand for the current directory. So, if your current directory
    is /var, then


    ```

    $cd /ftp/pub is equivalent to $cd ftp/var.

    ```


    The double period (..) is shorthand for “one directory up the tree.” If your current
    directory is /var/ftp/pub, then


    ```

    $cd ..

    ```


    changes your directory to /var/ftp.


    There are lots of other useful and interesting switches to the cd command. Check
    out the main page for cd for more information.


    The pwd command displays the current directory you are working in.


    # Listing the contents of a directory


    The ls command is used to list the contents of directory. The ls command may the
    single most useful command you learn. With the ls command, you can find:


    +   - The names of all files in a directory, including any subdirectories.

    - The owning user and group of the files and directories.

    - File and directory permissions assigned to user, group, and everyone else.

    - The size, creation date, and modification date of the files.


    The most basic form of the ls command is simple:


    ```

    $ls

    ```


    produces the following output:


    ```

    dataFile link-to-scriptfile archive.tar.gz

    ```


    The ls command with no flags or parameters displays the names of the files in
    the current directory (with the exception of hidden files). The output of this
    ls shows four files: datafile, scriptfile, link-to-scriptfile and archive.tar.gz.


    One of the nice features of the bash shell is that it color-codes the files displayed
    by the ls command. The output of the ls command above would display datafile in
    black (or in white with a xterm background), scriptfile in green, link-to-scriptfile
    in aqua, and archive.tar.gz in red. Black/white indicates a normal, non-executable
    file. Aqua indicates that the file is actually a link. There are other colors
    assigned to other file types as well.


    Two useful flags used with the ls command are -a and -1. The -a flag is the “all”
    flag and displays hidden files (files whose names begin with a period [). The
    -1 flag is the “long-listing” flag and displays additional file attributes such
    as file size, permissions, and so on.'
  merge: -1
  img_proc: true
- pgno: 137
