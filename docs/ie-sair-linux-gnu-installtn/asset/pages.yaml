- pgno: 115
  md: '# Topic B: Configuring the bash shell


    Explanation


    Customization of the bash shell requires you to understand what files are used
    during bash startup as well as what options are available to you. This topic will
    introduce you to the bash startup files and how to customize the shell prompts,
    aliases, shell variables, and environment variables.


    # Bash configuration files


    The default system-wide bash configuration file is /etc/profile. The account environment
    may be configured to one of three Bash configuration files: .bash_profile, .bash_login,
    or .profile. The system attempts to locate the files in this order, halting its
    search after locating its first file and executing the enclosed commands. The
    .bash_profile is the default profile initialization file for bash, where as the
    .bash login file is derived from the .login file of the C shell and .profile is
    derived from the Bourne and Korn shell. Since the system will not read either
    if the .bash_profile is located, a problem arises for the user who wants to switch
    to a different shell after logging in. For instance the configuration of a Bourne
    or Korn shell, would not have taken place.


    In addition to Bash-specific commands, which can be added into the .bash_profile,
    the configuration of the Bourne or Korn shell could be arranged, by adding the
    line .profile to the bottom of the .bash_profile. Following the execution of the
    Bash-specific commands, bash will execute .profile. Logging into a bash shell
    following this configuration allows the user to switch to the Bourne or Korn shells
    without modification of existing files. Although a similar method could be employed
    for the shell .login file, the difference in programming syntax between Bash and
    C-shell or T-shell may result in the process being ineffective.


    New shells created after the login process, also known as subshells, are configured
    in the same manner as the login shell, but without the startup commands necessary
    when logging in. This configuration results from the reading and execution of
    commands from the .bashrc file opposed to .bash_profile. If .bashrc does not exist,
    copying the line source to the bottom of .bashrc will execute the same commands
    executed during login for each shell that is opened.


    One example of the customized bash configuration files that can be created is
    .bash_logout. This file is read upon exit of the login shell and can contain commands
    that would record the time logged in and logged out or would delete temporary
    files. This file is optional.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# File Usage


    | | | |

    | --- | --- |

    | /etc/profile | Default system configuration file for login shells. |

    | ~/.bash_profile | Default personal initialization file for login shells. |

    | ~/.bash_login | Personal initialization file for login shells derived from the
    C-shell. Only used if ~/.bash_profile does not exist or if it is called from another
    initialization file with the source command. |

    | ~/.profile | Personal initialization file for login shells derived from the
    Korn shell. Only used if ~/.bash_profile and ~/.bash_login do not exist or if
    it is called from another initialization file with the source command. |

    | ~/.bashrc | Default initialization file for non-login shells. |

    | /etc/bashrc | Used by some distributions to setup system-wide aliases and functions.
    Changes to this file affect all users of the bash shell. It is typically called
    from the ~/.bashrc. |

    | ~/.bash_logout | Optional file that is executed when a login shell exits.


    # Prompts


    The default bash prompt for a regular user typically looks something like:


    ```

    [username@hostname pwd] $

    ```


    The pwd represents the present working directory. The root user prompt will display
    a hash (#) instead of the dollar sign ($).


    The bash prompt can be customized to fit your individual needs. Some users like
    to have the entire path displayed rather than only the present working directory.
    Some users may want to add the date and time.


    # The PS variables


    The prompt string labels PS1 and PS2 are variables that define information displayed
    at the user primary and secondary prompt after login. The prompt presented to
    a user directly after login is called the user primary prompt. The secondary prompt
    is used when more input is needed after a command has been entered.


    The default PS# variable is commonly located in the /etc/bashrc configuration
    file, which contains default shell variables. If a PS# labels are defined in the
    .bashrc file in the user''s home directory, these will become his default primary
    and secondary prompt labels.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Special characters


    The PS variable accepts nearly all strings that can be entered from the keyboard;
    however, certain strings will be treated differently. These characters are called
    special characters.


    | Special character | Description |

    | --- | --- |

    | \d | The date in "Weekday Month Day" format. |

    | \H | The hostname + the domain name (e.g. host.netname.net). |

    | \h | The hostname. |

    | \n | The carriage return and line feed. |

    | \s | The name of the shell. |

    | \t | The current time in 12-hour HH:MM:SS format. |

    | \@ | The current time in 12-hour am/pm format. |

    | \u | The username of the current user. |

    | \w | The current working directory. |

    | \W | The basename of the current working directory. |

    | # | The command number of the present command. |

    | \! | The history number of the present command. |

    | $ | If the effective UID is 0, display a #, otherwise display a $. |

    | \\ | Print a backslash. |

    | \[ | Start a sequence of non-printing characters, such as terminal control.
    |

    | \] | End a sequence of non printing characters. |'
