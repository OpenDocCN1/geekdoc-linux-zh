- pgno: 291
  md: '# 13-14 SAIR GNU: Installation and Configuration


    The main problem with using these packaged installation choices is that they make
    assumptions about the way the system should be configured. For instance, the Workstation
    repartitions and reformats the entire disk. If you have existing Linux or Windows
    partitions, they will be destroyed. If you have data on the system disk you wish
    to preserve, always choose a Custom configuration on Red Hat or its equivalent
    on other distributions. And, always choose to partition the disk manually.


    # Dual-boot problems


    Dual boot problems are almost always an issue with the bootloader getting overwritten
    during the system installation or reinstallation with the bootloader becoming
    corrupt or containing inaccurate data.


    The problems and the resolution are same regardless of the bootloader being used
    (LILO or Grub).


    The problem of the bootloader being overwritten occurs frequently with installation
    or reinstallation of Microsoft Windows on a dual-boot system. If Windows is the
    first operating system installed, the subsequent installation of Linux rarely
    causes problems. The installation programs for most Linux distributions correctly
    detect the pre-existing Windows partition(s) and configure the Linux bootloader
    to selectively boot either operating system.


    While it is possible to preserve the Linux partition when installing Windows subsequent
    to a Linux installation, the Windows bootloader must be configured manually after
    installation. Additionally, depending upon the particular flavor and version of
    Microsoft Windows, there are limitations on the number of operating systems supported
    on a multi-boot system.


    If you encounter this problem, the solution is usually simple: boot Linux from
    the rescue floppy (the Red Hat installation CD may also be used in Rescue mode)
    and reinstall the LILO bootloader into the disk''s master boot record (MBR).


    On systems using LILO, you should first look at the lilo.conf file and verify
    that the boot choices are configured correctly. The simply run lilo.


    On systems using Grub, you should also verify the boot configuration by examining
    the grub.conf file and then run grub-install. With the grub-install program you
    must specify the hard drive as an argument. So, if the system had IDE hard drives,
    the most likely command syntax would be:


    ```

    # grub-install /dev/hda

    ```'
