    # Independent practice activity


    +   1 Copy the .bashrc file you modified in the text editor exercise to temp.rc.
    Also, save .bashrc as oldbashrc. Using either gedit or kedit (depending upon the
    window manager you are using), add the following line to the aliases and functions
    section:


    ```

    alias hdf='' -h''

    ```


    Save the file as .bashrc.


    What will the alias you have just added do?


    Add an alias command that reports filesystem usage and free space in "human readable"
    format


    +   2 Try executing the alias you created. What happens?


