- pgno: 14
  md: '# Topic C: Classroom setup


    All our courses assume that each student has a personal computer to use during
    the class. Our hands-on approach to learning requires they do. This topic gives
    information on how to set up the classroom to teach this course. It includes minimum
    requirements for the students'' personal computers, setup information for the
    first time you teach the class, and setup information for each time you teach
    after the first time you set up the classroom.


    # Student computer requirements


    Each student''s personal computer should have:


    +   * A keyboard and a mouse

    * Any Pentium class CPU at 100MHZ or better

    * 64 MB or more of RAM

    * 3 GB of free space on hard drive

    * CD ROM required, floppy adapter recommended

    * Linux-supported video adapter (see www.XFree86.org) and monitor capable of SVGA
    resolution of 800x600 or better

    * Red Hat v7.3 or SuSE v8.0 installation CDs

    * Ethernet NIC

    * Internet access is not required but beneficial for downloading Linux installation
    CD images, documentation, etc.


    # First-time setup instructions


    The first time you teach this course, you will need to perform the following steps
    to set up each student computer.


    +   1. Pre-installation of the Linux operating system is optional. If you want
    to let the students get some early experience using Linux during the first 3 Units,
    go ahead and install Red Hat Linux v7.3 on the student systems. Otherwise, leave
    the installation until Unit 4 when the students will perform a Red Hat v7.3 as
    a lab exercise.

    2. The labs systems should be connected on a LAN. Some of the labs require that
    the students connect to other student systems.

    na. If the lab has DHCP available, configure the systems to get their IP configuration
    from the DHCP server. (If you wait until Unit 4 to install Linux, instruct the
    students to choose DHCP during the installation.

    b. If DHCP is not available or static IP is required, then use static IP assignments
    from the network administrator, or if you are on a private LAN, use addresses
    from one of the private IP pools (e.g. 192.168.1.x).

    3. If Internet access is available, it should be a simple matter of making that
    the IP configuration is correct (see step 2 above) to ensure that the student
    systems have Internet capability.'
  merge: -1
  img_proc: true
