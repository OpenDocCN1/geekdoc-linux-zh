    The hands-on activities are an essential part of manuals. They are presented in
    either one or two columns, concise directions for students as well as explanations,
    graphics, and clarifications. To the left, instructor notes tips, warnings, setups,
    and other information for the instructor only. Here''s a sample:


    Do it!


