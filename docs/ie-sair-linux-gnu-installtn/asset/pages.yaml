  md: '# SAIR Linux GNU: Installation and Configuration


    Red Hat and SuSE have made life a little simpler by creating a link during installation,
    `/dev/cdrom`, which points to the actual device file for the CD-ROM drive.


    The mount point can be any directory on any filesystem. By convention, removable
    devices are mounted to empty directories either in / or in /mnt (SuSE uses /,
    Hat uses /mnt). Directories for use as mount points are created during Linux installation.
    If you need additional mount points (for instance, for a second CD-ROM that you
    install) simply create additional directories with the `mkdir` command.


    Finally, the most common filesystem type found on CD-ROM is the ISO 9660 filesystem.
    Most Linux mount commands default to ISO 9660 if the filesystem type is not specified.


    # Using GUI tools to mount and access removable media


    Gnome and KDE are both capable of automounting removable media. Red Hat configures
    automounting for both on Gnome and KDE. SuSE does not configure KDE for automounting.
    If you desire this feature on SuSE, you must configure it yourself.


    Automounting can be completely automatic (CD-ROM) or semi-automatic (floppy).
    On Red Hat, when a CD is inserted into the CD-ROM drive, the CD appears on the
    desktop (Exhibit 9-20). Red Hat will try to start the appropriate GUI application.
    If there is an autorun script on the CD, the script will control which GUI application
    is started. If there is no autorun script and the CD is a data CD, a Nautilus
    window is opened.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_189_0.png)


    Exhibit 9-20: Automounted CD


    To unmount the CD, click the right mouse button on the CD icon and select Unmount
    Volume as shown in Exhibit 9-21.'
