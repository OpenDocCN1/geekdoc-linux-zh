- pgno: 49
  md: '# Topic A: LILO


    Explanation


    The Linux Loader (LILO) is a boot manager program that allows a computer to load
    Linux. However, LILO is not limited to working with Linux; it can also be used
    as a boot manager for other operating systems:


    +   - MS-DOS

    - OS/2

    - Windows 9x/NT/2000

    - UNIX


    Because LILO can be used with operating systems other than Linux, it offers users
    the opportunity to install multiple OSs on their computer and to choose which
    OS to load at system boot.


    System boot information is stored in the Master Boot Record (MBR). In a typical
    boot process, BIOS loads the MBR, which is located on the first sector (the boot
    sector) of the hard drive or floppy disk. Next, a road map of the hard drive,
    known as a partition table, is loaded along the rest of the boot sector containing
    information specific to the operating system. Finally, the operating system is
    loaded, along with configuration and operating information specific to the computer.


    # lilo.conf


    The LILO boot loader can be configured by editing the file /etc/lilo.conf and
    subsequently running the /sbin/lilo program as root. lilo.conf is composed of
    two distinct parts: a section with global information that is loaded no matter
    which configuration is used, and a section with information defining OS configurations
    (called images). Although there are kernel options that can be included in either
    the global or the image section, they apply only to Linux and do not affect the
    boot settings of other operating systems. There can be a maximum of sixteen different
    OS images, offering the user sixteen possible boot configurations.


    Information preceded by a number sign (#) in most configuration files is a comment
    and does not affect the operations of the file. It does, however, help the user
    to distinguish what each line accomplishes. It is a good practice to include comments
    in important files, when possible.


    # Global options


    ```

    # Start LILO global section

    prom

    timeout=50

    default = linux

    boot = /dev/hda

    vga = normal

    append = "mem=256M"

    ```


    In this example, the first line is a comment. The first four settings, prompt,
    timeout, default, and boot are global options and the remaining two, vga and append
    are kernel options. Kernel options can be specified in the global section or in
    the per-image section.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Bootloaders and startup issues 3-3


    The prompt directive forces LILO to display a boot prompt without any keypress.


    The timeout specifies the time in tenths of a second to wait for input before
    loading the default image. The default option names the image to be loaded. If
    default is omitted, the first image listed becomes the default.


    The boot directive indicates where LILO will be loaded when the administrator
    runs /sbin/lilo. Since no partition number was specified in this example, LILO
    will be loaded into the MBR of the first IDE hard drive.


    The next line sets the text to display 80x25. If set to extended, the display
    will be 80x50.


    Occasionally the kernel may not properly detect the correct amount of RAM in a
    system. If this happens, you can tell the kernel how much memory is in the system
    by using the append option in lilo.conf. Our configuration file indicates that
    we are informing LILO we have 256MB of RAM installed.


    All kernel options except one can be set in the global section or in the per-image
    section of lilo.conf. There are over twenty global options and seven kernel options.
    For information on lilo.conf global options, see the man pages by typing man lilo.conf
    at the command line.


    # Per-image settings


    LILO requires an image in /etc/lilo.conf for every kernel version or OS that LILO
    will need to boot. There are several required settings and numerous optional settings
    for every boot image. A per-image section in lilo.conf will be similar to the
    following:


    ```

    # default linux image

    image=/boot/mlinux-2.4.18-3

    label=linux

    password=xxxx

    read-only

    root=/dev/hda3

    ```


    In the previous example, the first three options, read-only and root, are kernel
    options. Kernel options entered under the per-image section override anything
    specified in the global section.


    The first option, image, is used to identify a Linux kernel. For an operating
    system other than Linux, the other option is used instead of image.


    The label option assigns a keyword to identify an operating system for use at
    boot prompt. The LILO boot prompt simply enters the label name and press Enter.


    The password option indicates that this image requires a password to boot. If
    this is used, the user must ensure that /etc/lilo.conf is readable only by root,
    since the password is stored in clear text in this file.


    The read-only option tells LILO to mount the file system in read-only mode. Typically
    the system will run fsck to check the file system for errors at boot time. The
    file system should be mounted read-only during this process to prevent corruption
    of the file system. After fsck completes the file system it will be remounted
    in read-write mode depending on the settings in /etc/fstab.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 3-4 SAIR GNU: Installation and Configuration


    The root setting specifies the device that should be mounted as the root file
    system. If it is omitted, the setting in the kernel image is used instead. In
    the example, /dev/hda3 the root file system is located on the third partition
    of the first IDE drive.


    # How LILO uses lilo.conf


    Changes made to LILO configuration file do not immediately go into effect. After
    modifying /etc/lilo.conf, you must run /sbin/lilo. This program reads the information
    stored in /etc/lilo.conf and the partition table and then writes to the location
    specified by the boot setting in /etc/lilo.conf. You should always run /sbin/lilo
    whenever:


    +   * The existing kernel has been renamed or moved to a different location.

    * A new kernel has been compiled.

    * A change has been made to the partition table.

    * The lilo.conf file has been changed.


    You must run /sbin/lilo in order for changes made to the /etc/lilo.conf file to
    be implemented. You can test to see what LILO is about to do without actually
    making any changes by using the following command:


    ```

    /sbin/lilo -t

    ```


    You can get more information by adding the -v option for verbose output from LILO.

    Kernel parameters can be manually passed to the kernel from the LILO prompt.


    # Troubleshooting LILO


    Let''s take a look at some of the common problems that you may encounter with
    LILO.


    # Kernel installed beyond 1024


    The BIOS on older systems only support addressing the hard disk by cylinder:sector(C:S).
    The cylinder setting was limited to 10 bits. This creates a limitation of 1024(2^10)
    cylinders that the BIOS could access. Later BIOS versions allow added routes to
    the larger hard drives to be accessed using linear block addressing (LBA).


    If the Kernel is loaded on a cylinder above 1024, the BIOS may not be able to
    read it at boot time. This may cause LILO to display an error when you attempt
    to boot. Newer versions of LILO support LBA but you must tell LILO to use the
    new BIOS routines by adding the lba32 option to the global settings of /etc/lilo.conf.


    The Linux kernel does not have any limitation on accessing the hard drive. Therefore,
    if you encounter this problem on a system you can boot the system using a Linux
    boot disk that has a Linux kernel on it and then adding the lba32 option to the
    LILO configuration file and running /sbin/lilo again.


    A common method for ensuring that the kernel is always located in the first 1024
    cylinders is to create a small /boot partition as the first partition on the disk.
    Since Linux kernel is usually 1MB or less in size, the partition does not need
    to be very large. Common sizes range from 10MB-50MB. This leaves room for new
    kernels to be added to the system.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# LILO boot error codes


    While LILO is loading, the letters L, I, L-, and O are spelled out. Each letter
    is displayed when a portion of the loading is complete. If LILO has trouble loading,
    all of the letters may not appear. Based on the letters that have loaded, the
    user can determine the cause of the complication.


    | Output | Description |

    | --- | --- |

    | <none> | LILO has not started loading. LILO may not be installed, or the partition
    on which the LILO boot sector is loaded has not been marked as active. |

    | L | LILO has started to load. However, the second stage boot loader could not
    be loaded. This condition has most likely been caused by a media failure (i.e.
    bad disk) or a disk geometry mismatch (i.e. the disk''s parameters were not set
    correctly). |

    | LI | Both stages of the boot loader were loaded successfully. However, the second
    stage boot loader could not be executed. This condition could be caused by a geometry
    mismatch, or the /boot/boot.b was moved without running the map installer. |

    | LIL | The second stage boot loader has successfully started. However, it cannot
    load the descriptor table from the map file. This condition is caused by either
    a media failure or a disk geometry mismatch. |

    | LIL? | The second stage boot loader was loaded at an incorrect address. This
    condition is caused by a slight geometry mismatch or the /boot/boot.b file was
    moved without running the map installer. |

    | LIL- | The descriptor table has become corrupted. This can either be caused
    by a geometry mismatch or by moving the /boot/map file without running the map
    installer. |

    | LILO | LILO was loaded successfully. |'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# A-1: Working with LILO


    # Here''s how


    +   1. Login to your workstation as a regular user

    2. Switch to the root user account with the su – command. You will need to enter
    the root user''s password.

    3. Use a text editor to modify /etc/lilo.conf. Comment out the timeout line in
    the configuration file by adding a hash mark (#) at the beginning of the line.
    What effect do you think your change will have on the system?

    4. Also comment out the message=/boot/message-line line. This will disable the
    graphical LILO screen at boot time and just present the LILO boot: prompt. Save
    the file and close the text editor.

    5. Run the LILO command with verbose output: /sbin/lilo -v This will cause LILO
    to read the changed configuration file and put your changes into effect at the
    next boot.

    6. Type reboot and press ENTER. The system will reboot and wait for input at the
    LILO boot: prompt.

    7. Type linux single, then press ENTER. This will force the system to go into
    single-user mode. Notice that you get a shell prompt without entering a login
    name and password.

    8. Enter whoami at the shell prompt. What user account are you now logged in with?

    9. You want to prevent unauthorized persons that have access to the system during
    booting from entering single-user mode. Edit /etc/lilo.conf so they must know
    a password if they want to boot into single-user mode. You can enter man lilo.conf
    for reference, if you need to. (Hint: look up information on the restricted directive
    for LILO.)

    10. Remove the hash mark from the timeout line in the LILO configuration file
    and modify it to 15 seconds before booting: timeout=150.

    11. Save your changes and enter /sbin/lilo -v.

    12. Reboot the system and enter linux single at the LILO boot: prompt. You should
    be prompted to enter the password this time.

    13. Enter init at the command prompt. This will cause the system to change to
    runlevel 3, and you will see a text-mode login prompt.

    14. Login as a regular user.'
  merge: -1
