- pgno: 232
  md: '# Topic B: Linux software package managers


    Explanation


    Most of the time, installing applications from source code is a fairly painless
    process. Most developers provide the tools necessary to automate the compilation
    and installation. However, if an error does occur, fixing the problem can be a
    complicated task requiring knowledge of the make utility, the gnu C compiler,
    the link process, static and dynamic time libraries, etc.


    Even if the initial installation of the application is error free, there is still
    the challenge of maintaining an entire suite of applications on the Linux system.
    Even a modest Linux system involves thousands of files and hundreds of applications.


    # The application management dilemma


    You have a number of issues to deal with in source-only application environment.
    Keeping track of which applications are installed, where they are installed, and
    what support files are installed and their locations are among the challenging
    tasks that must be performed.


    # What do I have in installed?


    Keeping track of what programs are installed can be a real pain. Source applications
    must be tracked and managed manually by the system manager. This requires time,
    effort, and real discipline. If you do not keep an accurate and up-to-date list
    of all the applications, their versions, locations, configuration files, and dependencies,
    then your system management task quickly gets out of hand.


    In the worst case, you may take over a system from another owner or system manager.
    If that person did not keep good records, you will have no way of knowing what
    applications are installed.


    # Where are all the files?


    The good news is that a well-designed source application package will automate
    the process of copying all the application files to their proper locations. The
    bad news is pretty much the same: the process of copying files is automated. The
    only way to know which files and what locations is to read the Makefile and then
    to make a list. Oh, and you have to keep that list up-to-date.


    # What happens when I upgrade the application?


    Applications sometimes have dependencies on other files and programs. If the source
    tarball does not include the depended-upon files and programs or if the dependencies
    are Linux system dependencies, the application will not work.


    Additionally, the compilation and link process is dependent upon a variety of
    support libraries that occasionally change (usually in concert with new versions
    of the C compiler and/or Linux kernel).'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 11-10 SAIR Linux GNU: Installation and Configuration


    # How do I completely remove an application and all its files?


    Removing an application can be as simple as deleting the binary file for the application.
    But, what about other files that support the application: other binaries, configuration
    files, log files, and documentation files? You will either have to examine the
    Makefile for each application you install and keep meticulous notes or use the
    "poke and hope" method.


    Some of the additional binaries associated with an application may be dependencies
    for other applications. This is very hard to know and harder to track and maintain.


    # The application management solution


    The solution to many of the problems with a source-only application environment
    is the package and the package manager.


    A package is a bundle of files with associated configuration information which
    controls the installation of the application files.


    There are two common package formats and package managers in current use: the
    Red Hat Package Manager (rpm) and the Debian Package Manager (dpkg).


    # Package managers


    Package managers solve many of the problems associated with installing tarballs.


    +   - Package managers maintain a database of installed packages. This automates
    the task of keeping track of which applications are currently installed on the
    system.

    - Package managers provide commands to install, update, query the status of, and
    remove application packages.

    - Using the configuration and control information included in the package, the
    package manager is able to detect dependency problems, attempts to install an
    older version of software, and other installation problems.

    - Using the configuration and control information included in the package, the
    package manager is able to cleanly uninstall applications, ensuring that all files
    associated with an application are removed.


    # Debian


    Debian packages have the extension .deb. The primary command for managing Debian
    packages is dpkg. The general syntax of it is:


    ```

    dpkg [options] [action] [package_files|package_names]

    ```


    One interesting feature of the Debian package management system is the ability
    to update packages across the Internet. A configuration file, /etc/apt/sources.list,
    controls the locations of packages that the system may use. The apt-get command
    is used to access this configuration file and control the behavior of dpkg.


    The Debian package management system is described in much greater detail in the
    SAIR 102 course.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Red Hat


    The Red Hat Package Manager is called rpm. The package files used by rpm have
    the extension .rpm.


    There are both text (command line) and GUI versions of rpm.


    The general syntax of an rpm command is:


    ```

    rpm [operation] [flags] [package_files|package_names]

    ```


    Many other distributions, including SuSE, Mandrake, and Xandros, either use rpm
    packages exclusively or install packages in rpm format.


    The Red Hat Hat Package Manager and rpm packages are covered in detail in the
    SAIR 102 course.


    # B-1: Discussing packages and package managers


    # Questions and answers


    +   1 List some of the problems of maintaining applications installed from source
    archives.


    Keeping track of installed applications, keeping track of application files, knowing
    and resolving file and program dependencies, clean uninstalls.


    +   2 What is one unique feature of the Debian package management system?


    The ability to directly access and update all installed packages across the Internet.


    +   3 What is the Red Hat package management application called?


    rpm


    What is the file extension for Red Hat packages?


    .rpm


    +   4 What package management system does SuSE use?


    rpm


    +   5 What is the name of the primary package management application used by Debian?


    dpkg


    What is the file extension for Debian packages?


    .deb'
  merge: -1
  img_proc: true
