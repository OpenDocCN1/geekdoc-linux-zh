- pgno: 87
  md: '# Topic E: Installation media choices


    Explanation


    Linux comes as a distribution, meaning that an organization has packaged the software
    and an installation program with it. These programs are miniature versions of
    Linux that use shell scripts to perform the installation operations. Each distribution
    uses its own set of installation programs, which run from various media.


    Various media can be used to install a Linux distribution. Each medium has advantages
    and tradeoffs, which are considered below. The six media types fall into two basic
    categories: local device installation and network access installation.


    # Local device installation


    Local device installation involves the installation of Linux at the site of the
    Linux workstation. The three main methods of local device installation are outlined
    below.


    # CD-ROM


    CD-ROM is the preferred installation media if Linux has the necessary driver for
    the particular CD-ROM. Depending on which software release is installed, the 500
    MBs of archived CD-ROM decompresses and expands to anywhere from 800 MB to 1 GB
    on the hard disk. This de-archiving process usually takes an hour or more with
    older computers. Today''s faster CPUs and CD-ROM drives, it may take less than
    15 minutes.


    # MS-DOS partition


    With this method, Linux installation archives have been copied to the MS-DOS partition.
    Although this action may seem odd, it overcomes the older CD-ROM problem described
    above. Once the MS-DOS disk archive is set up, the installation program can be
    directed to the hard disk.


    # Network installation


    Network access installation involves the installation of Linux over a network.
    The three main methods of network access installation are outlined below.


    # FTP


    This method connects to a server that has the archives stored. One problem continues
    to occur when downloading a Red Hat Distribution is its non-interactive download
    process. After specifying the FTP password and directory, Red Hat attempts the
    connection without feedback. Consequently, an error as simple as forgetting to
    specify the FTP root directory /pub/ can prevent a successful installation.


    # NFS


    This method is similar to FTP. The archive has been stored on another Unix or
    Linux box and the user specifies the NFS server host name or address and the shared
    directory path. Once set up, NFS works well, but as with FTP, a number of small
    configuration problems can prevent the user from setting up a Linux install host
    and an NFS server at the same time.'
  merge: -1
  img_proc: true
