- pgno: 107
  md: '# Topic A: The Linux shell


    Explanation


    A shell is a program that translates user commands into operating system instructions.
    Two important shell characteristics are interactivity and script execution.


    # Linux shells


    The average Linux distribution includes many shells that offer a variety of scripting
    syntaxes and interactivity.


    # bash


    Stephen Bourne created the first programmable shell for UNIX, known as the Bourne
    sh. An innovative interface in the 1970s, it lacked features common in today''s
    shells, such as command line editing. Although the Bourne shell has remained unchanged,
    it is still very popular in UNIX. The Bourne shell is not available on Linux.


    A variant of the Bourne shell, known as Bourne Again Shell (bash), was created
    by the GNU project (Free Software Foundation). It is Posix-compliant and adds
    many features not found in the original Bourne shell. Nearly all Linux distributions
    use bash as the default; therefore, it tends to be the most used shell in Linux.


    Bash is Bourne-compatible and provides, by default, command line editing and command
    substitution. Command line completion, aliases, editor capability, and search
    utility are also standard features of the shell. On Linux, sh is a link to bash,
    as the Bourne shell is not available. Bash and the TC-shell share features, such
    as history, aliases, job control, and filename substitution.


    Since bash is usually the default shell in Linux, this topic will focus on bash.
    The other shells are only mentioned here at the beginning to make you aware of
    additional options available to you.


    # tcsh


    The C (csh) was developed at the University of California at Berkeley by William
    Joy and provides very different programming constructs, although Bourne compatibility
    exists for user interactivity. It has an alternative substitution, like Bourne,
    there is no command line editing. Joy later developed an enhanced C-shell, known
    as the T-shell or TC-shell (tcsh), which provided features such as command line
    editing, command completion, and aliases, in addition to the already available
    command substitution.


    # pdksh


    The Korn (ksh) is one of the most popular Unix shells and was the first to import
    modern C-shell techniques into the Bourne shell. It provides command line editing
    and Bourne compatibility, although there are not as many features as bash and
    TCshell. The Korn shell is not available on Linux, but a free public domain Korn
    shell (pdksh) is available. The public domain Korn shell does not implement all
    of the features of the UNIX Korn shell. Since Korn is not available on Linux,
    ksh is typically a pointer to pdksh.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# The shell 6-3


    One of the most recent shells to be developed is the Z-shell (zsh), which has
    Bourne shell compatibility and command line editing, with most of the powerful
    features found in Korn, bash, and TC-shell. If zsh is linked to the filename /bin/ksh,
    then running /bin/ksh will result in the Z-shell starting with a default configuration
    that resembles the Korn shell. The job control of Z-shell greatly resembles that
    of Bash and TC-shell.


    # Identifying and changing shells


    A complete list of installed shells can be viewed by opening the file /etc/shells
    (if the file exists) in a text editor, or by entering the following command:


    ```

    chsh -l

    ```


    To identify the shell currently used by a machine, enter the following command:


    ```

    echo $SHELL

    ```


    This command will print the absolute pathname of the shell location. To change
    shells, enter the name of the desired shell on the command line. For example,
    to change from the Bash shell to the TC-shell, one would enter the following:


    ```

    tcsh

    ```


    The command prompt should then change from the dollar sign ($) to the percent
    sign (%), indicating tcsh is the active shell.


    In addition to changing the shell once a user is logged in, the login shell can
    be changed by entering the following command:


    ```

    chsh -s /bin/pdksh

    ```


    Upon rebooting the machine, the login shell will be pdksh until changed again
    by the user. In order for the chsh command to be effective, one must ensure that
    the desired shell is installed on the system, otherwise root would be required
    to create the file and install the necessary shells.


    Each user''s default login shell is specified in the /etc/passwd file.


    # Bash basics


    Some of the basic features of bash include command history, command completion,
    I/O redirection, command line editing, and job control.


    # Command history


    Command history is the ability to use the <UP> and <DOWN> arrow keys to display
    previous commands, beginning from the most recently typed command. The Bash shell
    maintains this history. By entering the command history, one can see a list of
    all the commands that have been used, up to the recall limit. By modifying the
    $HISTSIZE shell variable, the number of recalled commands can be changed. The
    following example would give the bash shell the ability to recall the most recent
    1000 commands.


    ```

    HISTORY=1000

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# SAIR Linux GNU Installation and Configuration


    # Command completion


    Command completion is the ability of the shell to complete the directory name,
    file or command name when the <TAB> key is pressed. If there are several name
    possibilities, then the shell only completes the name as far as it is unique;
    it beeps, and waits for the user to type more characters to make the name unique.
    Pressing the <TAB> key tells the shell to display all possible names, so that
    the user may search the list to find the desired name.


    For example, if a directory contains the file names julie, angus, meredith, allison
    and lenny, typing m followed by the <TAB> key will display mereredith.


    This feature allows you to issue commands or navigate file structures as fast
    as helps prevent typing errors.


    # I/O Redirection


    The CLI of Unix and Unix-like systems allows for input, output, and error to be
    directed to places other than the standard input (stdin), standard output (stdout),
    and standard error (stderr) devices. Normally, the standard I/O channel is associated
    with the keyboard and stdout is associated with the computer''s display.


    It''s important to realize that not all input comes from the keyboard or mouse,
    and there is a need to chain together streams of input and output. There are some
    special characters that can be used to redirect the input of stdin, stdout, and
    stderr. You can use the 0 (zero) character to help redirect standard input, 1
    for standard output and 2 for standard error.


    | Redirection character | What it does |

    |---|---|

    | <0 | Redirects standard input. |

    | 1> | Redirects standard output. |

    | 2> | Redirects standard error. |

    | > | Redirects output of the left side command to the right side device or file,
    overwriting file if it already exists. It is a shortcut for 1>. |

    | >> | Has the same effect as the > command, appends to the end of the file if
    it already exists, rather than overwriting the file. |

    | < | Is a shortcut for <0. |

    | | Redirects the output of the left side command to the input of the right side
    command (the pipe symbol). |'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Redirecting input


    Redirectors also allow you to redirect a program''s input so that it may come
    from a source other than the keyboard. If, for example, there was a program called
    printNames whose function was to print a list of names, and the input to come
    from a file called names, then the printNames program would be executed as follows:


    ```

    printNames < names

    ```


    In this example the contents of the names file has been sent to the printNames
    command as input data.


    # Redirecting output to a file


    Output data of a command can be sent to places other the screen, if desired. Consider
    the following:


    ```

    ls > /home/directory.list

    ```


    If ls were alone there, the output would be to stdout, which is usually associated
    with the terminal screen. However, in this example, a redirection operator has
    been used to send the output of ls command to a file named directory.list. Also,
    the redirection operator>>) has some subtle implications. The directory.list does
    not exist, it will be created; if it exists, it will be overwritten. To append
    another directory listing simply change to the desired directory and use the following
    command:


    ```

    ls >> /home/directory.list

    ```


    Note that this example >> also has some subtle implications. If the directory.list
    does not exist, it will be created; however, if it does exist, it will not be
    overwritten, but it will be appended.


    # Redirecting errors


    Many times, errors encountered during the execution of a command are sent to log
    files and the kernel buffer. Encountered errors during a program''s execution
    can be redirected to the standard output or to the file where the information
    is being recorded. Consider the following example:


    ```

    ls disk{1,2,3} 2 >> listing.Error >> /home/directory.list

    ```


    In this example, the directory and file names contained in the directories disk1,
    disk2, and disk3 are copied to a file named directory.list, which is located in
    the /home directory. Any error encountered during this process will be copied
    to a file namedError.txt, which is located in the /home directory.


    # Piping output


    Program to Program I/O is much like program output and input redirection. Pipes
    are effective in connecting one program or command output to the input of another.
    When the pipe character (|) is used between commands, it connects the output of
    the command on the left-hand side of the pipe to the input of the right-hand command.
    For example, the following command causes the output of the directory listing
    to become the input of more command.


    ```

    ls -l | more

    ```


    The only limitation on the number of commands that can be piped together is the
    system resources.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 6-6 \quad SAIR Linux GNU: Installation and Configuration


    Command line editing


    One basic feature of bash is the ability to edit the command line. At any point,
    use the left and right arrow keys to move the cursor back along the command line.
    The command may be edited by deleting or adding characters or using one of the
    following shortcuts.


    | Command | Description |

    |---|---|

    | CTRL + T | Will switch two characters immediately preceding cursor. |

    | CTRL + W | Will cut and save for pasting, everything from the character immediately
    to the left of the cursor position until the beginning of the command word. |

    | CTRL + U | Will cut and save everything to the left of the cursor for pasting.
    |

    | CTRL + Y | Is the pasting command used in conjunction with <CTRL+W> and <CTRL+U>;
    with pasted material placed before current cursor position. |

    | CTRL + O | Used with up /down arrow keys, will execute a command from command
    history and show next command in history list. |

    | ~ | Tilde (~) is used in commands as an alias for the home directory. |

    | - | Minus (-) is used in all commands as an alias for the last directory visited
    before the current directory. |


    The shell will keep a history of previously attempted commands, you can scan the
    history of commands and edit them.


    # The bang operator


    The bang (!) operator was originally a feature of the C-shell, and can be used
    in conjunction with other operators to recall previous commands from the history
    list. For example, exclamation point (!) followed by a number will recall number
    command from the history list. Using a colon, it is also possible to select specific
    words from a command to use them with other commands. The words themselves are
    numbered left to right with the first word, usually the command name, being 0.
    This operator is most useful when used within shell scripts.


    | Item | Description |

    |---|---|

    | !! | Recalls the most recent command. |

    | !-5 | Recalls the fifth most recent command. |

    | !30 | Recalls theirti command from the history list. |

    | !re | Recalls the last command beginning with the letters “re”. |

    | !:1 | Recalls the second word in the last command. |'
  merge: -1
