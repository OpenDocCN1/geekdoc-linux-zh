- pgno: 19
  md: '# Topic A: History of open source/free software and Linux


    Explanation


    Linux is a very popular free, open source operating system for back-end servers.
    It is becoming more and more popular on the end-user''s desktop. In this section
    we will take a look at the history of open source/free software to discover how
    Linux was developed.


    # The early days


    In the early days of computing, computer users were mostly programmers. These
    programmers would develop software to perform a particular function that they
    needed. They would then allow other programmers to use the source code for the
    programs they wrote so that the other could use it or modify it as needed. This
    community of programmers helped each other in this way for many years.


    # Manufacturer-sponsored user groups


    During this time computer architecture was evolving from the mainframe to the
    microcomputer to the microcomputer. In most instances, software written for one
    architecture could not be used on another. Consequently, in order to ensure the
    transition between new architectures, manufacturers encouraged the sharing of
    free source code through manufacturer-sponsored user groups.


    This level of support was a winning situation for both the manufacturer and the
    system''s user community. The manufacturer gets improved sales and goodwill for
    their contributions. The user community feels more involved in the development
    and feedback process, in addition to getting free software and ideas directly
    from the manufacturer''s programmers and engineers.


    # The great gateway: AT&T UNIX Version 6


    In 1965 AT&T''s Bell Labs and GE started with MIT to create a multi-user timeshare
    operating called Multics (Multiplexed Information and Computing System) to run
    on a mainframe. After four years of work the effort failed to produce a system
    that was both usable and affordable. The computer scientists were able to create
    a system that could handle many users, but the cost was so high that it was not
    practical. In 1969, Bell Labs decided to stop working on the Project.


    A few programmers from Bell Labs decided they needed a system as a replacement
    for Multics that would provide them with an environment they could work in. The
    result was a new operating system called.


    In the 1970s, AT&T restricted from entering the computer industry due to a Federal
    Communications ruling. As a result, in 1975, AT&T decided to distribute their
    unknown operating system, UNIX Version 6, under an academic license for study
    in colleges and universities. The release of UNIX Version 6 launched many significant
    events. Among the most notable is that it taught a generation of computer scientists
    practical operating system concepts that would have otherwise remained only for
    years to come. UNIX Version 6 was also the starting point for other UNIX variants,
    including BSD UNIX.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Linux concepts 1-3


    While AT&T allowed the distribution of the source code, retained a license for
    UNIX, which gave it the control to market UNIX in the future. Despite AT&T''s
    license, the open source nature of UNIX Version 6 further encouraged software
    development and the sharing of source code that had begun earlier in the manufacturer-sponsored
    user groups.


    New operating systems started to appear. Many of these operating systems were
    proprietary. They had licenses that forbid redistributing the software or even
    modifying it. The source code was not generally available. If a user wanted a
    new function, they had to wait for the manufacturer to put that feature in. Sometimes
    this would never happen.


    # The GNU project and free software


    In the early 1980s, Richard Stallman had an idea to create a new operating system
    that was similar to UNIX, so that users could easily using it and so that the
    system would be portable. This project was called GNU, which is a recursive acronym
    for "GNUs Not UNIX". Stallman quit his job at MIT in 1984 to begin working on
    this project.


    Stallman and various others who joined him starting the new operating system.
    The operating system consists of a number of pieces that work together to provide
    a usable system. Each piece that they created was released as free software.


    Stallman defined exactly what he meant by the term free software. A program is
    considered free, for you, a particular user, if:


    +   * You have the freedom to run the program, for any purpose.

    * You have the freedom to modify the program to suit your needs.

    * You have the freedom to redistribute copies, either gratis or for a fee.

    * You have the freedom to distribute modified versions of the program, so that
    the community can benefit from your improvements.


    Some people mistakenly think that free software means it is available for no cost.
    While this is true in many cases, it is not a requirement for software to be free.
    Remember, the free in "free software" refers to freedom, not price.'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Copyleft and the GNU GPL\n\nSoftware that is in the public domain is free\
    \ software; however, there is nothing to\n\nSince copyrights are normally used\
    \ to prevent people from making copies, Stallman's\nuse of copyright law to ensure\
    \ people could always make copies became known as\ncopyleft. Stallman hoped copyleft\
    \ would contribute to the continued growth of\ncommunities of software developers\
    \ and contribute to a more productive software\nenvironment that encouraged the\
    \ free sharing of ideas. One of the most used\nimplementations of copyleft is\
    \ the GNU General Public License (GPL). This license\nwas in 1984 and is used\
    \ for most of the software released for the GNU\nproject as well as many other\
    \ free software projects around the world. Stallman is\nreferred to as the father\
    \ of free software for this reason. He wasn't the first person to\ncreate free,\
    \ open source software, but he was the first to find a way to ensure that\nhis\
    \ software would always remain free and open source.\n\nThe GNU GPL essentially\
    \ says that one is free to use the software any way one sees fit.\nMoreover, one\
    \ two fundamental requirements are observed:\n\n+   - Only verbatim copies of\
    \ software can be redistributed, which also means that all\n  source code must\
    \ be provided with the software.\n\n+   - If new code is added to the existing\
    \ software, it must be prominently\ndocumented and also be included with the original\
    \ software.\n\nA few inherent characteristics of GNU GPL software are:\n\n+  \
    \ - It is continually modified, but a strong sense of trust exists among those\
    \ who use\nthe software.\n\n+   - People continue to improve the software, even\
    \ though they do not own it.\n\n+   - It evolves into an independent software\
    \ product or package.\n\nAccording to Stallman, these characteristics create communities\
    \ of programmers who\nhelp each other by sharing examples of their craft. By sharing\
    \ benefits from the\ncollective knowledge of the community, the group becomes\
