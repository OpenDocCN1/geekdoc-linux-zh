- pgno: 270
  md: '# Topic E: Word processors and office suites


    Explanation\In today''s business world, document processing plays a major role
    and has become a necessary business venture. Office productivity suites include
    a word processor, a spreadsheet, various communication components, such as e-mail
    and news, as well as graphics applications. Many companies need document processing
    applications to manage their files, finances, and communication. Companies use
    a multitude of different platforms to run their systems. Getting the different
    platforms to communicate with one another is complex. To solve this problem, most
    office productivity suites are designed to work on multiple types of operating
    systems.


    # Two basic program design philosophies


    As part its Unix heritage, Linux supports a wide range of typesetting, or markup
    languages: nroff, groff, TEX, LATEX, XML, and HTML. In these word processing schemes,
    text creation and display are two separate processes. During the text creation
    phase, the user writes the information in a plain file and directs where the text
    is to be by embedding text-based formatting commands to be used by the subsequent
    display. During the text display phase, the display processor interprets the embedded
    commands in order to layout the text.


    However, the typical PC user employs a What You See What You Get (WYSIWYG) word
    processor, where the text is displayed as it is entered. To accomplish this, the
    WYSIWYG word processor must embed non-printing binary information into the text
    file.


    The distinction between markup and WYSIWYG reflects a fundamental issue for Unix/Linux
    users, since Unix is predicated on employing all of its utilities (support programs)
    for processing text files. Embedding binary information into the text file allows
    only one program, the word processor that created it, to access the text.


    A user who moves between the PC and Unix environments must be aware of this distinction
    and use the various programs accordingly. A user familiar with Microsoft Word
    or Corel Word may continue to work in the same WYSIWYG environment on Linux. However,
    files that are used elsewhere in the system (for instance, a configuration file
    for an application) must be exported as text files.


    # Markup text advantages


    Two advantages of markup design are flexibility and control. Markup text can be
    created with any number of simple text editors and text files can be easily processed
    by other applications. Due to the fact that text display is controlled separately,
    markup provides more control over the display than the set of functions provided
    inside a WYSIWYG word processor.


    # WYSIWYG advantages


    The primary advantage of WYSIWYG is implicit in the acronym: you get immediate
    visual feedback on both the display and print of the text. Also, since WYSIWYG
    combines the text creation and text display functions into a single process or
    step, document creation is simpler for new or casual user.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# StarOffice


    StarOffice is a fully integrated, Microsoft Office-compatible suite of productivity
    applications. It provides Web-enabled word processing, spreadsheet, presentation
    graphics, e-mail, news, charting, and graphics applications.


    StarOffice 6.0 is the most recent and improved version of this popular application.
    Its significant improvements stem from user feedback and reviews, which are responsible
    for over 200 modifications to the program. The reliability and ease of use has
    been increased in every application of the program, including improved file compatibility
    features for Microsoft file formats. This allows users to manage files in PowerPoint,
    Word, and Excel formats. Also, users can access existing Microsoft Office files
    and data to create spreadsheets, presentations, and word documents.


    As of writing, StarOffice runs on more platforms than any other desktop productivity
    suite and runs natively on Linux on Intel platforms. All data may be saved in
    Microsoft formats or as HTML files to post to the Web or Newsgroup servers.


    StarOffice version 6.0 is a commercial product and costs about $75.00. Star Office
    version 6.0 is available for download from Sun at http://www.sun.com/software/star/staroffice/6.0
    and is also available in a “shrink-wrap” package (complete with printed documentation)
    from the usual retail outlets.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_271_0.png)


    Exhibit 12-34: Starting StarOffice from the Gnome desktop'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Linux applications 12-37


    ![](img/f850b93901b8bb4c267df1b99fb6de52_272_0.png)


    Exhibit 12-35: StarOffice 6.0 (editing this unit)


    # # OpenOffice


    Sun Systems has made the StarOffice source code available under the GNU License
    as Open Office Suite. Attempting to promote standardization among offices, Sun
    has made the StarOffice APIs and XML file formats available. With StarOffice now
    a part of the open-source community, developers worldwide will have a chance to
    create locally-produced program components to it.


    The question may be why anyone would pay $75 for StarOffice if OpenOffice shares
    code with StarOffice and is free. Well, there are some differences between StarOffice
    and OpenOffice.


    Some code included in StarOffice is not included in OpenOffice. This is primarily
    due to third-party code included in StarOffice that requires the payment of a
    license fee to the third-party party. Items found in StarOffice but missing in
    OpenOffice include:


    +   * Some fonts

    * The Adabas database application

    * Some templates

    * Much of the clip art gallery

    * Some file filters


    Also, StarOffice comes with 60 days of free phone and email support and a web-training
    course.


    So how do you choose which to use? First, consider that portions of this course
    have been created, modified, shared with reviewers and transferred back and forth
    between OpenOffice and Microsoft Word using OpenOffice version 1.01 and StarOffice
    version 6.0. So, both products work pretty well.'
