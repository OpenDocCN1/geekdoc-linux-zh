- pgno: 7
  md: '# # Topic A: About the manual


    # ### Course Technology ILT philosophy


    Our goal at Course Technology is to make you, the instructor, as successful as
    possible. To that end, our manuals facilitate students'' learning by providing
    structured interaction with the software itself. While we provide text to help
    you explain difficult concepts, the hands-on-activities are the focus of our courses.
    Leading the students through these activities will teach them skills and concepts
    effectively.


    We believe strongly in the instructor-led classroom. For many students, having
    a thinking, feeling instructor in front of them will always be the most comfortable
    way to learn. Because the students'' focus should be on you, our manuals are designed
    and written to facilitate your interaction with the students, and not pay attention
    to manuals themselves.


    We believe in the basic approach of setting expectations, teaching, and providing
    summary and review afterwards. For this reason, lessons begin with objectives
    and end with summaries. We also provide overall course objectives and a course
    summary to provide both an introduction and closure on the entire course.


    Our goal is your success. We encourage your feedback in helping us to continually
    improve our manuals to meet your needs.


    # ### Manual components


    The manuals contain these major components:


    +   - Table of contents

    - Introduction

    - Units

    - Appendix

    - Course summary

    - Index


    Each element is described below.


    # ### Table of contents


    The table of contents acts as a learning roadmap for you and the students.


    # ### Introduction


    The introduction contains information about our training philosophy and our manual
    components, features, and conventions. It contains target student, prerequisite,
    objective, and setup information for the specific course. Finally, the introduction
    contains support information.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Units


    Units are the largest structural component of the actual course content. A unit
    begins with a title page that lists objectives for each major subdivision, or
    topic, within the unit. Within each topic, conceptual and explanatory information
    alternates with hands-on activities. Units conclude with a summary comprising
    one paragraph for each topic, and an independent practice activity that gives
    students an opportunity to practice the skills they''ve learned.


    The conceptual information takes the form of text paragraphs, exhibits, lists,
    and tables. The activities are structured in two columns, one telling students
    what to do, the other providing explanations, descriptions, and graphics. Throughout
    a unit, instructor notes are found in the left margin.


    # Appendices


    An appendix is similar to a unit in that it contains objectives and conceptual
    explanations. However, an appendix does not include hands-on activities, a summary,
    or an independent practice activity.


    # Course summary


    This section provides a text summary of the entire course. It is useful for providing
    closure at the end of the course. The course summary also indicates the next course
    in this series, if there is one, and lists additional resources students might
    find useful as they continue to learn about the software.


    # Index


    The index at the end of this manual makes it easy for you and your students to
    find information about a particular software component, feature, or concept.'
  merge: -1
  img_proc: true
