- pgno: 169
  md: '# SAIR Linux GNU: Installation and Configuration


    # /etc/shadow


    Here is an example of /etc/passwd from a newly installed Red Hat system:


    ```

    root:hgoJby2yF:s:11386:0::7::

    bin*:10547:0::7::

    demon*:10547:0::7::

    adm*:10547:0::7::

    lp*:10547:0::7::

    sync*:10547:0::7::

    shutdown*:10547:0::7::

    halt*:10547:0::7::

    mail*:10547:0::7::

    news*:10547:0::7::

    uucp*:10547:0::7::

    operator*:10547:0::7::

    games*:10547:0::7::

    gopher*:10547:0::7::

    tftp*:10547:0::7::

    man*:10547:0::7::

    majordom*:10547:0::7::

    postgres*:10547:0::7::

    mysql*:10547:0::7::

    bind*:10547:0::7::

    httpd*:10547:0::7::

    nobody*:10547:0::7::

    johng:awSFwm7q9BW0N11386:0::7::

    ```


    Note that the /etc/passwd file has an x in all the password fields. This indicates
    that the actual encrypted password in the /etc/shadow file. Note that there are
    only two accounts in /etc/shadow with passwords (root and john). All the others
    have *. This is because there are only two normal, interactive users on this system.


    # User groups


    Rather than configuring many users'' permissions by hand, it is simpler to manage
    your user security via groups. Setting up a group with the proper permissions
    and then adding users to the group grant them access is good system administration
    practice.


    As noted above, one of the fields of the /etc/passwd is the user''s identification
    (GID). Groups allow a system administrator to control access to files and directories
    by limiting access to only those users with group permission. For example, in
    a school, teachers and administrators may use the same computer system. While
    teachers and administrators regularly access attendance records, students should
    not have access to them.


    Assigning students to one group and teachers to another group, allows sensitive
    material to be easily protected. Additionally, since teachers do not need access
    to employee records, and administrative employees do not need access to teachers''
    lesson plans, they can each be assigned secondary group identification. Finally,
    the school yearbook committee is composed of students, teachers and administrators
    can be assigned to a yearbook group.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# The group file


    Groups are organized by the information stored in the /etc/group file. There is
    one group entry per line, and each line has four fields delimited by colons.


    ```

    group_name:password:GID:users

    ```


    The users field is a comma-delimited list of users in that group.


    If password shadowing is enabled, the password field will hold an x instead of
    an encrypted password. The actual password is held in the /etc/shadow file. Four
    fields are in this file.


    ```

    group_name:encrypted_password:administrators:users

    ```


    The administrator field holds the comma-delimited list of administrators for that
    particular group. The administrators of a group can change the password for that
    group and add and remove members of the group.


    # Using shell tools for user accounts


    Adding, modifying, and deleting user accounts from the bash shell is performed
    in two basic ways:


    +   - Editing the configuration files (/etc/passwd, /etc/shadow)

    - Running one of the shell scripts provided in the Linux distribution


    # Editing the configuration files


    This method is NOT recommended. It is error-prone, time-consuming, and, on shadow-enabled
    systems, requires converting the password file from shadow format so that it can
    be edited and then back to shadow format.


    If you simply use this method to manage user accounts, use the vipw tool rather
    than another editor. vipw locks the password file during editing, preventing potential
    file corruption.


    You will also need to use the pwunconv and pwconconv utilities to change from
    shadow format and back again.'
  merge: -1
  img_proc: true
