    The following table contains a short list of vi commands:


    | Command | Action |

    |---|---|

    | i | Enter insert mode. |

    | dd | Delete line. |

    | SHIFT + A | Insert at end of line. |

    | x | Delete the character that the cursor is on. |

    | r | Replace the character that the cursor is on. |

    | ESC | Exit insert mode. Go to command mode. |

    | :q | Quit the vi session. If any changes have been made to the file, an error
    message will prompt you to save the changes or use :wq! to exit without saving
    changes. |

    | :wq <filename> | Quit the vi session and write any changes to the file specified
    by <filename>. If an existing file is being edited, <filename> is optional and
    changes will be saved to the file that was opened |


    This is a very cursory summary of the vi editor. The man page for vi provides
    the all the information you need to perform simple text editing.'
