- pgno: 281
  md: "# 13-4 SAIR GNU: Installation and Configuration\n\nBased on the observed behavior\
    \ (the application does not start), the fact that the application has never worked\
    \ before (you just installed it), and the error message, you guess that the problem\
    \ is that the application is not in your default path. This guess is your hypothesis.\
    \ \n\n# What if you can't form a hypothesis?\n\nThe biggest problem you will face,\
    \ especially if you are a newcomer to Linux, is knowing where to start. Often,\
    \ you don't even know which questions to ask. If you are totally lost, forming\
    \ a hypothesis can be a complete stab in the dark. So, what to do?\n\nThe best\
    \ course of action is to get some ideas from readily available resources. Troubleshooting\
    \ resources are described in greater detail later in this unit. If this fails,\
    \ don't be afraid to stab in the dark. If you follow a logical, systematic troubleshooting\
    \ process, with each pass through the process your hypotheses will become more\
    \ focused and the dark will be replaced by the light of discovery.\n\n# Testing\
    \ the hypothesis\n\nOnce you have formed a hypothesis it is time to test it. Testing\
    \ the hypothesis may occur prior to making changes to try to fix the problem,\
    \ after making changes, or before and after making changes. Taking the example\
    \ above, the hypothesis is that the problem is caused by the application not being\
    \ in the user's default path. To test this, you need to determine what the user's\
    \ default path is and what the path is to the application:\n\n+   - Determine\
    \ the user's default path.\n  $ echo $PATH\n- Determine the path to the application.\n\
    \  $ which whizbang\n  $ whereis whizbang\n\nIf the problem really is with the\
    \ path, there are two basic remedies: add the application's path to the user's\
    \ default or move the application to a location in the user's default path. Other\
    \ users may need to access the application and may have set their paths accordingly,\
    \ moving the application is not the preferred solution. So, the next step is modifying\
    \ the user's default path to include the application. If the application is located\
    \ at /usr/local/whizbang, this path needs to be added to the user's default by\
    \ editing .bash_profile. Once this is done, test again by trying to launch the\
    \ application. If it works, you are done.\n\n# Repeat as needed\n\nIn the case\
    \ of simple problems like this, it is common to find the solution on the first\
    \ try. However, in the case of more complex problems it may take many repeat attempts\
    \ to remedy the problem. It is important to continue to follow the structured\
    \ troubleshooting process until the problem is solved."
