- pgno: 237
  md: '# Topic A: Web browsers


    Explanation browsers, with the arguably exception of email programs, are probably
    the most widely used of all personal computing applications. Linux has a wide
    selection of browsers freely available. Most Linux distributions include several
    browsers for you to select.


    Most browsers are much more than just browsers: most also include, at a minimum,
    an email client and a newsreader. Though we will not discuss newsreaders in this
    unit, the email features of some of the web browsers are discussed in the next
    topic.


    # Full-featured browsers


    Just what features a web browser must have to "fully-featured" is a matter for
    discussion. Here, a fully-featured web browser contains a browser, email and newsgroup
    client, address book, and possibly a calendar function. Additionally, the browser
    should support all relevant web standards, display pages properly regardless of
    the web server, and support all widely deployed client and server side automation.


    # Netscape and Mozilla


    Netscape Communicator is an integrated package centered on the Netscape Navigator
    Web browser. In addition to Navigator, Communicator includes a mail client, newsreader,
    and HTML editor, which are respectively titled Messenger, Message Center, and
    Composer. Netscape is available in the Communicator suite or can be installed
    without the other utility suites. The Communicator suite and Navigator can be
    downloaded at http://home.netscape.com/download.


    Netscape version 4.79 is bundled with Red Hat version 7.3 and SuSE version 8.0.
    Netscape''s most recent release, version 7, is available for Linux at www.netscape.com.
    Messenger supports HTML encapsulated email, POP3 and IMAP servers, threaded email
    messaging, and includes an integrated address book. Composer is an HTML authoring
    tool that can compete with other shareware and freeware authoring tools.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_237_0.png)


    Exhibit 12-1: Netscape Navigator 4.79 for Linux'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Linux applications 12-3


    Mozilla is the open offshoot of Netscape introduced in 1998. The Mozilla Organization
    coordinates the development of the Mozilla open source projects, including the
    Mozilla browser and a variety of other applications. With the release of 1.01
    in 2002, the Mozilla project moved from an experimental, "beta" product to a stable,
    "released" product.


    The Mozilla Organization invites developers with the appropriate skills to contribute
    to testing. See www.mozilla.org for more details and to download the most recent
    version.


    The Mozilla browser is highly customizable and allows users to choose different
    themes or skins. Mozilla has e-mail, newsreader, and composer clients similar
    to Netscape.


    Some differences between Mozilla and Netscape include the ability of Mozilla Mail
    to run as a separate stand-alone application and a Mozilla startup option to leave
    parts of Mozilla in memory, speeding up restarts of Mozilla.


    Red Hat 7.3 includes Mozilla version 0.9. The latest release of Mozilla (currently
    version 1.1) is available at www.mozilla.org.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_238_0.png)


    Exhibit 12-2: Mozilla 1.2.1 for Linux


    # Opera


    The Opera browser, from developers in Norway, is self-described as the "fastest
    browser on earth." Its smaller size means a shorter download time. Opera requires
    minimal resources; it only needs 16MB of RAM and 2MB of disk space without Java
    support. Opera''s size increases when Java support is included.


    The ad-sponsoring version of Opera for Linux is available for download at www.opera.com/download/linux.html.
    An ad-free version is available for a fee.


    Opera is streamlined, highly customizable, and has the ability to integrate bookmarks
    from Netscape and other browsers. While some versions of Opera for other platforms
    (notably the Microsoft Windows version) include an email client and newsreader,
    the Linux version as of this does not.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# SAIR Linux GNU Installation and Configuration


    Besides quick page loading, Opera has a few distinguishing features that set it
    apart from other Web browsers. Opera can save the current session history; when
    it is reopend, all of the previous settings remain as if Opera had never been
    closed. Another feature, OperaShow, turns the browser into a tool for presentations.
    Opera also contains a feature for zooming in and out of the Web page, making it
    easier for users with poor eyesight to read the smaller print. Web navigation
    can be controlled entirely by


    ![](img/f850b93901b8bb4c267df1b99fb6de52_239_0.png)


    Exhibit 12-3: Opera for Linux


    # Lynx


    Lynx is a browser that only displays text, making it one of the smallest and quickest
    browsers available. If you prefer the minimalistic approach to browsing you will
    appreciate Lynx''s basic approach to Web pages. The most recent version is 2.8.3,
    which can be downloaded from http://lynx.browser.org.


    Lynx is useful for viewing text documents because it runs much faster than graphical
    browsers; however, it lacks many of the features that the other larger browsers
    possess. Lynx does not have an integrated e-mail client (although mail can be
    sent using mail).


    One of Lynx''s strengths is its support for text-to-speech applications for visually
    impaired users. A disadvantage of Lynx is that many Web pages are not created
    for text displays, thereby making pages with frames and graphics-related content
    more difficult to navigate or understand, although some Web pages do consider
    text-based browsers and offer a text-only option.'
  merge: -1
  img_proc: true
