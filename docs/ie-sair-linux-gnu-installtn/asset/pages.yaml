- pgno: 205
  md: '# Topic B: Configuring X Windows


    Explanation


    Configuring X correctly is critical for any Linux installation where a graphical
    interface is required. A properly configured X server will save you time and frustration;
    an incorrectly configured X server can result in damaged hardware.


    While the configuration files for XFree86 remain the same, each distributor provides
    different tools for configuring X Windows. For this reason, we will examine the
    configuration of X Windows separately for Red Hat v7.3 and SuSE v8.0.


    There are two basic options when configuring X Windows: use the tool(s) provided
    by the Linux distribution or manually edit the XFree86 configuration file.


    # Configuring X Windows on SuSE v8.0


    SuSE provides several tools for configuring X Windows. The preferred tool is SaX2,
    SuSE''s own X configuration program. SuSE also includes the older, more generic
    xf86config program.


    # Using SaX2


    To run SaX2, first put the system in text mode using the Control+Alt+F1 keys.


    SaX2

