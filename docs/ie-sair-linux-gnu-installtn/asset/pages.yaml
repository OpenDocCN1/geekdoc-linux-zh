- pgno: 261
  md: '# C-1: Using the Linux ftp program


    # Here''s how


    # Here''s why


    +   1. Using the IP address of another student''s lab system, use the Linux ftp
    program to establish an ftp session with that system.


    At the shell prompt, enter ftp.


    At the ftp prompt, enter ftp_address.


    The ip_address argument will be the IP address of the other student''s system.


    You will be prompted for a user id and password. Obtain these from the student
    you are partnering with and enter them when prompted.


    ```

    [student1@localhost]$~ ftp 192.168.1.104

    Connected-to 192.168.1.104.(192.168.1.104).

    220-Welcome to FTPD server.

    Name(192.168.1.104)student2@n331-Please specify the password.

    230-Login successful.Hello-Fun.

    211-system-type: Unix

    Using-binary-mode-to-transfer: files.

    ftp->

    ```


    Here is an example.


    +   2. Create a listing of the files on the remote system.


    At the ftp prompt, enter *ls*. What do you see? Why?


    Probably nothing unless the other student has created some files. Hidden files
    are not displayed by a simple command.


    At the ftp prompt, enter *ls -al*. What do you see? Why?


    Now you should see at least the bash config files (.bash_logout, bash_profile,
    and .bashrc)


    +   3. Create some files on the remote system. For this you will need to work
    with the student who is using the remote system you are connecting to.


    ```

    [student1@localhost]$~cp .bashrc.temp.txt

    ```


    Ask the owner of the remote system to make a copy of the .bashrc file, naming
    the copy temp.txt.


    Here is an example.


    Next, at the ftp prompt, enter *ls*. What do you see?


    Now, you should see temp.txt


    Now, ask the other student to make a file named new.txt using the touch command.


    ```

    [student1@localhost]$~touch-new.txt

    ```


    Here is an exampleample.


    Again, at the ftp prompt, enter *ls*. What do you see?


    Now, you should see both new.txt and temp.txt'
  merge: -1
  img_proc: true
