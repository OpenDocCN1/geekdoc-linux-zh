- pgno: 176
  md: '# Topic B: Printers


    Explanation


    Unix printer configuration has traditionally been one of the more challenging
    configuration tasks. Until recent releases of the major Linux distributions, Linux
    shared this heritage of complicated and sometimes frustrating printer set up.


    # The traditional Linux print system


    The traditional Linux print system works by copying the file to be printed to
    a special "parking lot" directory the spool directory. A program called `lpr`
    does the copying of files to the spool directory.


    The line daemon, `lpd`, periodically checks the spool directory for new files.
    When it finds a pooled file, `lpd` processes the file and sends it to the appropriate
    printer.


    A special configuration file called `printcap` contains the names and configuration
    details for each printer on the system. These configuration details determine
    how `lpd` processes the file prior to sending it to the printer.


    # Configuring the traditional Linux print system


    You configure the traditional Linux print system by editing the `/etc/printcap`
    file and then stopping/or starting the line daemon.


    # /etc/printcap


    The `/etc/printcap` file contains the configuration settings for each printer
    on the system. Among the configuration options are:


    | Item | Description |

    | --- | --- |

    | queue_name | Names of the print queue(s) for each printer. If multiple queue
    names are associated with a printer, they are separated by a vertical bar (|).
    |

    | lp | The device file for the local printer, for instance, `/dev/lp0` for the
    printer connected to the parallel port, |

    | sd | Path to the local spool directory |

    | mx | Maximum size of a print file, in bytes |

    | rm | A remote machine used as a print spooler |

    | rp | Remote printer name |


    # Print filters


    The `/etc/printcap` file also contains print filters. These filters are used by
    the line daemon, `lpd`, to convert the raw, unformatted print file into a format
    suitable for the printer. For instance, if a text file is to be sent to a Postscript
    printer it must first be converted to the Postscript language.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Shell tools


    You have a handful of shell commands available to send a file to a print queue,
    display the status of the print jobs in the queue, remove print jobs from the
    queue, and to control the behavior of the print queue.


    | Item | Description |

    | --- | --- |

    | lpr | Send a print job to the print queue. If the print queue is not specified,
    the job is sent to the default printer. The default printer is defined by the
    PRINTER environment variable. |

    | lpq | Displays the jobs in the print queue(s). |

    | lpc | Controls the print queue. Lpc can start or stop print jobs, disable the
    queue, and display a status report for the queue, among other functions. |

    | lprm | Removes a job (or jobs) from a queue. |


    # New Linux print options


    Recent Linux distributions have automated the printer configuration process and
    have provided improved shell and GUI configuration tools. Also, there are now
    two choices in print systems: LPRng, which is based on the traditional Linux print
    system, and CUPS, a new, more automated system.


    # LPRng


    Both SuSE version 8.0 and Red Hat version 7.3 use LPRng as their default print
    system. LPRng is an updated version of the Berkeley LPR print system, the basis
    for traditional Linux and UNIX print systems.


    Both Red and SuSE provide graphical tools for LPRng, which detect and configure
    printers and print queues.


    # SuSE Yast2 Printer Configuration tool


    SuSE''s Yast2 Printer Configuration tool is an easy-to-use "front end" for the
    LPRng print system. The same basic configuration file is used, /etc/printcap.
    However, the Yast2 Printer Configuration tool can autodetect many printers and
    choose reasonable default values for the configuration. Even if the printer is
    not autodetected, the tool steps you through all the configuration choices. You
    never have to touch a configuration file with a text editor.


    You can start the Yast2 Printer Configuration tool from the start menu (Exhibit
    9-5).'
  merge: -1
  img_proc: true
