  md: "# SAIR Linux GNU Installation and Configuration\n\n# Canceling a shutdown\n\
    \nThe administrator can cancel a delayed shutdown by issuing the `shutdown -c`\
    \ command. If the administrator cancels a shutdown, the `/etc/nologin` file that\
    \ was created will be deleted automatically. The time argument is not necessary\
    \ when canceling a shutdown; however, the administrator can add an optional message\
    \ that will be broadcast to all users. \n\n```\nshutdown -c Shutdown has been\
    \ cancelled.\n```\n\nOnce the shutdown process has called `init`, it can not be\
    \ cancelled.\n\n# Warning only\n\nAnother argument available is `-k`. This will\
    \ cause shutdown to send the normal warning message to the users and prevent new\
    \ logins, but when the delay is completed, instead of calling `init`, the shutdown\
    \ will be cancelled and logins can resume.\n\n# Commands to avoid\n\nThere are\
