- pgno: 97
  md: '# Topic A: Startup and shutdown processes


    Explanation There are specific processes that happen during both startup and shutdown.
    It is important to understand these processes for configuration and troubleshooting
    purposes.


    # System startup


    The boot process is a routine that prepares a system for use, and it begins when
    a computer''s power is switched on. After the boot process occurs, system initialization
    takes place.


    Boot process The boot process of the Linux OS does more than just prepare the
    computer for interaction. It also provides critical system information for system
    configuration, optimization, and troubleshooting. Most users think that the boot
    process consists of all process executed during a system startup. However, this
    is not the case. After the Linux kernel boots, the boot process has ended and
    software initialization begins. The typical boot process of a Linux OS involves
    several steps:


    +   1 The computer BIOS performs the power-on self-test (POST).

    2 The computer BIOS reads the master boot record (MBR) and loads the boot loader
    if present or looks for the partition to boot and loads the boot loader from the
    boot sector of that partition.

    3 The boot loader loads the Linux kernel and transfers control to it.

    4 The Linux kernel loads init and passes control to it.


    Messages are printed to the parts of the operating system are initialized. Even
    though each distribution is different, these messages often contain status information
    on system hardware, kernel hardware recognition, and program initialization.


    These messages are also printed to a buffer and a log file. They can be viewed
    after system initialization with the `dmesg` command or by checking the system
    log files.

    The kernel runs the first, or user space program, called `init`. The init program
    is the ancestor of all other programs, and its task is to read the various resource
    control (rc) files, run the background programs (daemons), and launch the login
    programs. A detailed analysis of this process is covered in another topic.


    # Logging out


    In the bash shell, the `logout` command, `exit` command, or `Ctrl-D`, will terminate
    any user space programs that were started by that user, including the shell. This
    could cause the loss of unsaved data in programs that were running. You should
    always ensure that you have saved your data and exited your programs before logging
    out.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Shutdown process


    Shutdown routines are used to bring systems to a halt. A shutdown routine ends
    processes in such a manner that data is not lost.


    Performing an orderly shutdown will help prevent data loss or corruption by flushing
    the data cache to disk and unmounting the file systems. If you turn off a machine
    running Linux without doing an orderly shutdown, data that is cached in memory
    will be lost and if a process was writing to the file system when the power was
    cut off, the file system might become corrupted.


    # The shutdown command


    To bring the system down in an orderly manner, the administrator should use the
    shutdown command. This command can be used to halt the system, reboot the system
    or to bring the system to single-user mode. It requires a single argument for
    the time; other arguments are optional.


    The time argument can be an absolute time in the format hh:mm where hh is the
    hour and mm is the minute. The hour can be expressed with one or two digits, but
    the minute requires two digits. The time argument can also be expressed as +m
    where m is the number of minutes to delay before starting the shutdown process.
    If you want to shutdown the system immediately you can use +0 or use the keyword
    now for the time argument.


    # Common uses


    The -h argument is used to halt the system, while the -r argument is used to reboot
    the system. Neither of these two options is used, it will bring the system to
    single-user mode, which is sometimes referred to as maintenance mode. In all three
    situations, shutdown will perform the following tasks:


    +   - Notify users of the shutdown

    - Block logs to all normal users

    - Tell init to go runlevel 0 (halt), 6 (reboot), or 1 (single-user mode)


    # Warning processes


    All users that are currently on the system will be warned that the system will
    be shutting down. After the time argument, the administrator can specify a text
    string that will be displayed to all users. If a delay was specified, the process
    will then create the /etc/nologin file which will prevent regular users from logging
    in. The file will be deleted before calling init.


    init will send a warning signal, SIGTERM, to processes so they can exit cleanly.
    After a default delay of five seconds it will terminate a signal, SIGKILL, to
    processes that did not respond to the SIGTERM. You can specify a different delay
    followed by the number of seconds to delay. The following command line will cause
    the system to halt in five minutes with a 15 second delay between the SIGTERM
    and SIGKILL signals.


    ```

    shutdown -h -t15 +5

    ```'
  merge: -1
  img_proc: true
