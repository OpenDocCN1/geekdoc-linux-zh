    Recall that Linux drivers are also code which manipulate Linux drivers have the
    device name or its abbreviation in their names (e.g. modprobe, lsmod). They have
    the file extension .object they are object files. Going from C source code to
    an executable program is a multi-step process. The primary steps are compiling
    the C code, which produces an object file, and then linking the file to system
    library files and other object files. In the case of Linux device drivers, the
    object files are linked to the kernel and become, in fact, extensions of the kernel.


    # Partitioning problems


    The most common disk partitioning problems include:


    +   - Choosing an inappropriate installation option which automatically (and silently)
    partitions and formats the disk in unexpected ways.

    - Installing or reinstalling an additional operating system on a dual-boot system
    and rendering one or more of operating systems unbootable.


    # Installation options


    Most Linux distributions contain unique installation programs or wizards. These
    installation wizards usually offer a number of pre-determined installation configurations.
    For instance, Red Hat version 7.3 offers the choice of Workstation, Server, and
    Laptop configurations.


    Each of these installation packages has pre-determined choices for disk partitioning,
    the specific software packages installed, and the way that things like network
    services are configured. For instance, the Laptop configuration installs and configures
    the pcmcia subsystem while the Server and Workstation configurations do not.'
