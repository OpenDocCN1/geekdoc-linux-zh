- pgno: 253
  md: '# Text-based email clients


    Text-based email clients are still popular, especially among folks who grew up
    with UNIX systems. Since most Linux-based servers do not have X Windows installed
    (X Windows is a huge resource hog), a text-based email client is the only option
    for many Linux system administrators. Some of the most widely used text-based
    email clients are below.


    # BSD Mail


    BSD mail is the process invoked when the mail command is given at the command
    prompt. This mail client allows you to compose, manage, send, receive, reply,
    and forward e-mail messages using command line options. mail uses two modes rather
    than using menus. A command mode allows a user to manage mail messages, and a
    composition mode allows a user to compose mail messages. The easiest way to mail
    is to follow the command with the person you wish to mail, followed by the message.
    After a period (.) on a blank line to exit the program and send the message.


    ```

    $ -s <subject> <user@domain.net> <message line>

    <message line>

    ```


    # pine


    Developed at the University of Washington, pine was first released to the public
    in January of 1992. It is a feature-rich program that provides on-screen options
    to help with reading, sending and managing e-mail messages. Some of the features
    of the pine client include help, message composition screen, attachments via MIME
    message specifications, an address book, and NTTP or IMAP news. pine also permits
    you to navigate between menus with single character commands and to save messages
    and attachments in their home directories. The pine help menu is useful for obtaining
    an overview of pine''s various functions. The program is easy to explore for the
    screen listing of commands. pine is included with most current Linux distributions,
    including Red Hat and SuSE. The latest version of pine may be found at

    ftp.cap.washington.edu.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_253_0.png)


    Exhibit 12-20: pine main page'
  merge: -1
  img_proc: true
