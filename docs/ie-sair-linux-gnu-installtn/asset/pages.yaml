- pgno: 266
  md: '# pico


    The pico text editor is perhaps the simplest command line text editor available
    on Linux. One very handy feature is the display of common editing commands at
    the bottom of the screen.


    Like vi, when started with no file name argument pico opens a buffer for your
    input. When you exit, you will either have to supply a file name or quit without
    saving the changes.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_266_0.png)


    Exhibit 12-30: Starting pico with no file name argument


    # GNU Emacs


    Emacs has the ability to keep the window no matter what type of file is being
    edited. An Emacs window can contain one or more buffers, each of which can hold
    a separate file. The window can be split vertically or horizontally, and two buffers
    can be opened with each containing a different file, or different sections of
    the same file. Copying and pasting is allowed between the two buffers, but only
    one can be manipulated at a time.


    # Emacs Commands


    Emacs runs in a familiar shell-like environment, which allows users to navigate
    between the text and the file menus using a mouse. In Emacs, two files can be
    opened at the same time, allowing copying and pasting between the two open files.
    Emacs also provides a multi-lingual spelling checker. While Emacs offers a full
    menu for editing, some of the most common text editing commands can be executed
    using keyboard shortcuts.'
