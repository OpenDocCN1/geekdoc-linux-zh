- pgno: 22
  md: '# Linux and the GNU Project


    By 1990, the GNU project was almost complete. The only major piece that was missing
    was the kernel. While Stallman and his group were working on this missing link,
    a Finnish student from Helsinki, named Lin Torvalds, posted to a newsgroup that
    he had developed a new UNIX-compatible kernel, called Linux, on the Internet in
    August 1991. He stated that he already ported the bash shell and the gcc compiler
    and that they appeared to work with the new kernel. He then asked other programmers
    around the world to help by sending them their suggestions and criticisms. This
    was the criticism for the 0.01 release of the Linux kernel.


    Other releases quickly followed and by January 1992 version 0.12 was released.
    This is when the popularity of Linux began to really improve. Earlier versions
    of the kernel had really been for kernel programmers, but version 0.12 actually
    worked well and there was no need for patches for a long time, so many others
    were able to start using it.


    It was decided that since the kernel now contained most of the features that it
    needed the next version would be 0.95, which was released in March 1992.


    Combining the kernel with the pre-existing GNU tools created a complete, free
    operating system. Today, Linux is often used to refer to the entire operating
    system and not just the kernel.


    # Open Source Initiative


    In 1998, Eric S. Raymond and Bruce Perens co-founded the Open Source Initiative
    and began using the term "open source" instead of "free software". This was an
    intentional decision to try to get businesses to look at the partial benefits
    of having the source code available without having to discuss the more controversial
    issues of freedom.


    The movement was a success as Linux and open source software started appearing
    more and in both in the mainstream press and in big business. Today of all of
    the top computer manufacturers not only have basic support for Linux on their
    machines, but they will sell them with Linux pre-loaded and even offer enterprise-level
    support contracts for it just as they do with proprietary operating systems. Many
    large businesses are also now using Linux. For example:


    +   * Pixar uses it for rendering the computer-generated images (CGI) it uses
    in its movies.

    * Amazon.com, one of the largest and busiest sites on the Internet, uses Linux
    to run its e-business.


    There are still some purists, such as Richard Stallman, who insists that freedom
    is the most important part and should not be left out of any discussion. However,
    both free software advocates and those that promote open source agree on one thing:
    the common enemy is proprietary software.'
  merge: -1
  img_proc: true
