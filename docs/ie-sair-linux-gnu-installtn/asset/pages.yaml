    Exhibit 13-2: /var/log


    # /proc


    The proc filesystem is used to keep in-memory copies of important kernel data
    structures. The data structures are kept in the format of a filesystem, and this
    filesystem is mounted during system startup. This allows you to browse and read
    the data just like any other file.


    The information kept in the proc filesystem includes both static and dynamic data,
    some of which is read-only and some of which can be written by a user with superuser
    privileges.


    Static information is data that is collected during system startup that does not
    change during normal system operation. Device IRQ assignments are an example of
    static data.


    Dynamic information is data that changes during normal system operation. An example
    is a USB device. When the device is connected to a USB port, the new device, loads
    the appropriate module or modules (drivers), updates any device characteristics
    or status data, and makes the device available to the system. The device configuration
    and status data can then be viewed in the proc filesystem. When the device is
    unplugged, the system detects this, unloads the drivers and the proc filesystem
    is updated.


    Some of the data in the proc filesystem can be written. This obviously has some
    serious implications for system operation and stability since you can modify data
    that the Linux kernel is accessing in real-time. An ill-considered modification
    could easily crash the system. However, modifying kernel parameters via the proc
    filesystem is a common practice in system tuning.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Configuration files


    Configuration files seem to be everywhere in Linux. Simply listing most of them
    is a daunting task and probably not worth the effort. However, there are a few
    important classes of configuration files that you should get to know—some because
    they affect critical tasks or processes, some because they are the frequent source
    of problems.


    These important configuration files (and in some cases, important scripts) can
    be organized into the following categories.


    # System startup


    There are a number of configuration files and scripts that are critical to a Linux
    system successfully starting:


    +   - /etc/initt — The configuration file that controls the init process is /etc/initt.
    This file controls the default run level and a number of other important startup
    attributes. If you find that your system boots to a console instead of detail
    the GUI, this is the first place to look.

    - /etc/fstab — The configuration file that controls which filesystems are mounted
    at boot is /etc/fstab. The /etc/fstab also controls the behavior of removable
    media devices such as floppies and CD-ROM drives. If you can''t mount a floppy
    drive as a non-privileged user, chances are that fstab needs to be modified. Likewise,
    if you get permissions warnings trying to write to a floppy, fstab is the place
    to go.

    - The rc scripts — The use and function of the rc scripts are described detail
    elsewhere in this course. These scripts are a key data point when troubleshooting
    problems with daemons that do not start at boot time.


    # Device drivers (modules)


    When a device is dynamically added to a system, the system detects the new device
    and either silently loads the necessary device driver(s) or prompts the user and
    asks if the new device should be configured.


    This process of loading device drivers and configuring the device happens automatically.
    However, you have considerable control over the process, especially the configuration
    of the device.


    The primary configuration file for dynamically loaded devices is /etc/modules.conf
    (on some distributions the file is /etc/conf.modules). Module configuration files
    for specific subsystems may be found elsewhere. For instance, the configuration
    files for the pcmia subsystem are found in /etc/pcmcia (although some distributions
    use /etc/hotplug).


    You can use the insmod command to list the currently loaded modules. You can use
    the insmod and modprobe commands to manually load modules (if, for instance, a
    device was not detected).'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 13-10 SAIR Linux GNU: Installation and Configuration


    # Network


    There are so many network configuration files and scripts and so many variable
    paths through them that any attempt at comprehensive coverage is far beyond the
    scope of this course. What follows is a brief list of the files and scripts most
    involved in basic network connectivity problems.


    +   - /etc/rc.d/init.d/network — This is the “master” startup script which is
    run by the system as it initializes upon boot up.

    - /etc/sysconfig/network — This configuration file controls or not the network
    is to be activated and contains, among other things, the host name.

    - /etc/sysconfig/networking/ifcfg-lo — Controls the configuration of the loopback
    interface.

    - /etc/sysconfig/networking/devices/ifcfg-ethxx (where xx is the number of the
    interface as eth0) — Controls the configuration of the devices.

    - /etc/hosts — Used for manual configuration of host name to IP translation.

    - /etc/resolv.conf — Contains the addresses of DNS servers that the host uses.

    - /etc/host.conf — Specifies the order in which names to address translation is
    performed.


    # Application specific


    Application specific configuration files can be anywhere. The first step in finding
    application specific configuration files (or log files for that matter) is to
    read the manual page. If this does not describe the configuration file or at least
    point to its location, the next step is to browse the path that the application
    is in. Configuration files often have the name of the application or application
    daemon with .conf as a prefix or suffix, for instance httpd.conf, which is the
    configuration file for the Apache web server.


    Often, the configuration file has its man page, separate from the man page for
    the application. For instance, the Samba daemon is smb. The configuration file
    is smb.conf. There are separate man pages for smb and for smb.conf.


    Don''t overlook per-user configuration files when tracking down application problems.
    These are usually hidden files starting with a period (.) in the user’s directory.
    For instance, the per-user configuration files for mozilla are in the .mozilla
    sub उभ of the user home directory.


    And, if you are trying to understand how the configuration file works and what
    kinds of application behavior it controls, don''t overlook the obvious—read the
    configuration file. Most configuration files contain copyous comments.


    # Source code


    Source code is often referred to as the ultimate documentation. Access to the
    source code is certainly one of the distinct advantages of open source software.
    Source code can be used as reference documentation when troubleshooting a problem,
    by using any debug code provided by the developer, and as a learning tool.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'Almost all Linux applications are written in the C programming language. While
    you don''t need to be a C programmer to use Linux, most experienced Linux administrators
    eventually learn the basic syntax of the language and the fundamentals of compiling
    and linking C programs.


    # B-1: Finding things


    # Questions and answers


    +   1 How would you get more information about an error''s meaning?

    * Read the man pages (especially using the -k [keyword] option).

    * Search the source code for the error text.

    * Use the newsgroups.


    +   2 What are the two basic ways that programs control the logging of error messages?

    * Directly. The application and/or its configuration file define the type and
    content of the messages and the path to the log file(s).

    * Indirectly, using the syslog.conf file controls the type, priority, and log
    file(s).


    +   3 Which system configuration file controls the mounting of file systems?

    /etc/stab


    +   4 What kind of information can be found in the proc filesystem? Are there
    any risks involved in accessing the information there?

    The proc filesystem contains virtual maps of kernel data structures. The information
    there includes hardware and software configuration information, information on
    the state of the system, and kernel parameters that can be modified to tune the
    system. There are risks involved since some of the data structures are writable
    and modifying them modifies the running kernel.


    +   5 What are modules?

    Modules are Linux device drivers. They may be loaded at boot time or dynamically
    loaded at run times as devices are added or removed.


    +   6 How can you get a listing of which modules are currently installed?

    Ismod is the command that lists the currently installed modules. (The same information
    is available in /proc/modules).


    +   7 How can you control the configuration and characteristics of modules installed
    on the system?

    Through module configuration files, primarily /etc/modules.conf.


    +   8 Where are many of the system log files stored?

    /var/log'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 13–12 SAIR Linux GNU: Installation and Configuration


    # Topic C: Some common problems


    Explanation


    All operating systems have common problem areas: installation, boot up, and networking.


    It is impossible to list all the problems seen by a single experienced Linux administrator
    in her lifetime, much less the accumulated experience and wisdom of the Linux
    community. What follows is an outline of the common problem areas with some of
    the problems commonly seen by new users or seen on new installations. These are
    presented as examples and as a starting point should you experience similar problems.


    # Installation problems


    The most common installation problems fall into two basic categories:


    +   - A device is not detected and configured or a device is incorrectly identified
    and the wrong driver is loaded.

    - Problems with disk partitioning, especially in dual boot systems or when using
    one of the "canned" installation options.


    # Problems with devices


    Device detection and configuration, whether during installation or later during
    normal system operation, is dependent on the software that detects new devices
    and the availability of an appropriate Linux device driver.


    If a device is not detected by the installation wizard, it is likely that you
    will have to fix the problem after the installation is complete.


    Here are a few steps that can help resolve device problems:


    +   - First, try to determine if the device should work. In other words, the device
    is supported by Linux? Primary resources for determining if the device is supported
    are the distributors'' web sites and the device manufacturer''s web site.

    - If the device is supported, then determine which driver (or drivers) the device
    requires and load it manually using insmod or modprobe. It may also be necessary
    to edit `/etc/modules.conf` to configure the device. The distributor web sites,
    LinuxHowTo, and the source code for the driver are good resources, as are the
    news groups.

    - It is possible that the device is being detected and device drivers loaded but
    the device is simply not being activated for. This can be a problem with the device
    configuration file (`/etc/modules.conf`), a specific configuration file for the
    device or, as in the case of network devices, the network configuration files.


    To check which drivers are loaded, use the insmod command. Most device drivers
    are found in `/lib/modules/(kernel-version)/drivers` (Exhibit 13-3).'
