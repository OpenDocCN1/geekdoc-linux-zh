  md: '# # Topic C: FTP applications


    Explanation


    The FTP protocol (file transfer protocol) is a standard component of the TCP/IP.
    One point of confusion for new users is the fact that the command line file transfer
    program is also called ftp.


    In addition to the traditional ftp program, there are a variety of GUI and text-based
    programs that support file transfers between hosts using the FTP protocol.


    # ## FTP from the command line


    There are various command-line FTP programs available.


    # ## The Linux ftp program


    The file transfer program (ftp) is the Linux user program supporting ARPANET standard
    File Transfer Protocol. FTP enables the transfer of files between networked Linux
    systems. The primary methods of transferring files are:


    +   * Specifying the FTP site as an argument to the ftp command.

    * Using the open command with ftp prompt within the FTP program.


    Access to the remote host normally requires providing of a username and password,
    and is usually restricted to those users with accounts on the host machine. However,
    public ftp sites often provide access to users who pass the username anonymous
    by a valid e-mail address as the password.


    Once a connection is established, directories on both the client and local host
    may be browsed, and files may be transferred to and from the client host. Commands
    are executed from the ftp program, ftp. The command line ftp program is the original
    interface for File Transfer Protocol and is included as a standard package on
    Linux distributions (Exhibit 12-24).


    ![](img/f850b93901b8bb4c267df1b99fb6de52_256_0.png)


    Exhibit 12-22: The Linux ftp program'
  merge: -1
  img_proc: true
