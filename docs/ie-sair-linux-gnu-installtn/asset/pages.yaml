- pgno: 82
  md: '# Booting multiple operating systems


    Booting more than one OS from the hard disk allows the user to switch among applications
    that are unique to each OS. If multiple OS coexistence is desired, then sharing
    the hard disk using multiple partitions is possible. If the other OS is most often
    a form of MS-Windows, it is useful to consider the steps to establish separate
    partitions for Linux and for MS-Windows.


    The bootloader included with Windows NT, Windows 2000, and Windows XP can be used
    to select among multiple operating systems, but this is not recommended. Setting
    up the Windows bootloader to accommodate Linux is more complex than the Linux
    bootloader to accommodate Windows and does not work for some configurations. The
    recommended configuration is to use the Linux bootloader for multiple O.S. installations.


    Note that MS-Windows'' default action is to format the entire hard disk as partition
    requiring you to take the following steps to free up space on the hard drive for
    the Linux partitions.


    # Sharing a Hard Disk between MS-Windows and Linux


    +   1. Back up the existing OS in the event that one of the following steps fail.

    2. Find and replace any bad disk blocks. Under any of the MS Windows operating
    systems, open a Windows Explorer window. Click the right mouse button on the C:
    drive icon. Select the Properties menu item. Choose the tools from the Properties
    window. Select Check Now.

    3. Move all files scattered on the hard disk to one end of the hard disk. Under
    any of the MS Windows operating systems, open a Windows Explorer window. Click
    the right button on the C: drive icon. Select the Properties menu item. Choose
    the tools from the Properties window. Select Defragment Now.

    4. Run a partition manager to search the hard disk for empty space and create
    the new Linux partitions.


    > If you are going to use the ext3 filesystem (the default on Red Hat 7.3), get
    the latest version of Partition Magic (at v8.0). Earlier versions do not support
    ext3 filesystems. If you are using SUSE''s ReiserFS, you must use FIPS. Partition
    Magic does not support Reiser FS.


    Partition Magic is a commercial partition manager that understands Linux and a
    number of other operating systems'' partition and file formats. It has an easy
    to use graphical interface and is capable of resizing, moving, and changing the
    type of partitions. The main disadvantages of Partition Magic for the Linux user
    are its cost and the fact that Partition Magic is Windows-hosted.


    FIPS is an open source, command-line utility capable of creating new partitions
    in the unallocated space on a hard drive. FIPS also allows the changing of the
    partition to native or to Linux so that MS-DOS will ignore the new partitions
    when it reboots. FIPS has the advantage of being free and widely distributed.
    (Most Linux distributions include a copy of FIPS). The disadvantage of FIPS is
    that it is a command-line utility with a somewhat cryptic syntax.


    > If you use FIPS (or any partition manager), the first task is a complete backup
    of the system.'
  merge: -1
  img_proc: true
