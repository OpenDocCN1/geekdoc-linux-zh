- pgno: 125
  md: '# Topic A: Getting help in Linux


    Explanation


    The Linux and GNU operating system is highly complex; the current distributions
    are the product of a decade of development by a multitude of contributors worldwide.
    It is impossible to retain complete knowledge of the vast array of commands, utilities,
    and applications that compose the systems. Instead, documentation can assist in
    using unfamiliar or frequently used commands. In addition to the documentation
    built into Linux, many sources of information are available on the Internet. This
    topic explores various methods used to access Linux information. Each method will
    be discussed separately.


    # The man command


    The man command is a fast and efficient way to obtain detailed information on
    another command or utility. The Linux manual pages are similar to the man pages
    that appeared in Version 6 UNIX, and they narrowly address the characteristics
    of a given program. They do not, however, address the interaction of the program
    with the system. Currently, no online documentation exists that provides information
    related to whole-program interactions.


    # Understanding the format of commands in man pages


    A user may know where to find documentation, but it will be useless if he or she
    does not know how to read it. The first things listed on every page is a synopsis
    of possible usages for the command. For example, the synopsis for man is:


    ```

    man [-acddFfHkttW] [-m system] [-p string] [-C file] [-M path] [-P pager] [-S
    section_list] [section] ...

    ```


    The first word is the name of the command and what should always be typed before
    the options and command arguments.


    Options grouped together after a single hyphen, as in [-acddFfHkttW], are input
    collectively sharing the hyphen. If an option is bracketed alone, as in [-m system],
    it must be typed separately with an individual hyphen. In this case, the -m option
    requires an additional argument, system. In addition to options represented by
    a single letter, some options can be represented by a word. For example, the option
    -f can also be represented by --preformat. As in this case, if an option is a
    word, hyphens must precede it.


    Following the command options, usually one or more command arguments can specify
    file names, source or destination directories, or other information. In the example
    above, the command argument for man is name.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# The man page sections


    The manual pages are divided into the following sections:


    +   1 User commands

    2 System calls (kernel functions)

    3 Library functions (subroutines)

    4 Special files (devices)

    5 File formats

    6 Games

    7 Miscellaneous

    8 Administrative and privileged commands

    9 Kernel reference guide


    # Searching for man page topics


    In many cases a Linux command has information listed in more than one section.
    For example, a password command has information in section 1 and section 5. By
    default the command man password will display the password entry in section 1,
    User Commands. To view the section 5 for password, the user must specify the manual
    section by typing man 5 password. This information is useless, however, if the
    user does not know the sections in which the man pages are listed. Two commands
    can help a user find this information: whatis and apropos.


    # whatis


    The whatis command searches for whole word matches to the entered keyword. The
    appropriate format for the whatis command is:


    ```

    whatis [keyword]

    ```


    The result will display a list of each time the whole word keyword is used in
    the title of a man page. So, the output of whatis passwordwd is:


    ```

    passwd (1) - update a user''s authentication token(s)

    passwd (3ssl) - compute password hashes

    passwd (5) - password file

    ```


    ```

    passwd.nntp [passwd] (5) - passwords for connecting to remote NNTP servers

    ```


    From this information, the user can determine which man section to specify when
    making a search.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# SAIR Linux GNU: Installation and Configuration


    # apropos


    The apropos command is similar to the whatis, except it searches for matching
    strings within the whatis database. So, in addition to the entries located by
    the whatis command, apropos passwd will return matches similar to the following
    list:


    +   - kpasswd (1) - change a user''s Kerberos password

    - v5password (1) - change a user''s Kerberos password

    - chpassword (8) - update passwd file in batch

    - gpasswd (1) - administer the /etc/group file

    - pam localuser (8) - require users to be listed in

    /etc/passwd


    Be aware that this is not the complete output of the apropos passwd command, but
    is a brief example of some of the matches.


    Notice that in the last instance the passwd match is in the description and not
    the title of the man entry. Searching using apropos is more general than whatis.


    To learn more about the man command, give man as an argument to man.


    ```

    man man

    ```


    # The info command


    The info command provides an ASCII-based hierarchical view of revised man pages.
    The command serves the same basic purpose as man; however, the man pages that
    info uses are not in the same format as the man pages for man.


    New programs generally have man pages but may not have an info page. If an info
    page does not exist, the info command will display the related man page. Older
    programs may not have man pages at all and may require the use of the info command.
    There is a movement afoot to have info be a replacement for man pages.


    # Section headings


    In info, programs are arranged by the usage areas: Development, Miscellaneous,
    Administration, Console Utilities, Document Preparation, Games, and General Commands.
    Individual man pages are accessed by positioning the cursor on top of the program
    name and pressing <ENTER>. Sub-categories within the command vary depending on
    how the author arranged the material and on what type of program being described.


    # Helpful but incomplete


    In general, info documents tend to be more helpful than the old man pages. They
    have a more general approach than the man pages and offer information on the ways
    in which one program interacts with others; however, the info project is incomplete
    and more man pages are available than info pages. For example, new GPL software
    often has man pages but not info pages.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# X-based help options


    In addition to the console-based help utilities, there are a number of X-based
    utilities.


    # man


    man is an X-based version of the manual page reader man. Generally, the X11 version
    works in the same way as the ASCII version. One exception is that the man utility
    provides a table of contents for each section and allows the user to select the
    file name to access the manual page.


    # khelpcenter


    The K-Desktop Environment (KDE) provides a tool that allows you to view both manual
    pages and info pages. Clicking the Help entry on menu normally launches it. It
    can also be launched from a terminal window by entering khelpcenter.


    # nautilus


    Another tool that allows access to both the manual pages and info pages is included
    with the GNOME desktop. The tool provided with KDE, clicking the Help entry on
    the menu is the normal way to start the program. Once it is running, then click
    the Help tab in the lower left corner of the window and select either the info
    pages or manual pages from the left menu. You can launch the tool from a terminal
    window by entering nautilus.


    # help


    Entering the help command alone will cause a list of built-in bash commands to
    appear on the console. You can get more information about each command by entering
    help command, where command is the name of the command that you want to know about.


    Similarly, most other commands have a --help argument that can be used to show
    the usage of the command without all of the detail of a man page or info page.
    For example, man --help will show you a list of the arguments that the man command
    understands. Some commands also allow a shortcut using -h or -?. For example:


    ```

    man --help

    man -h

    man -?

    ```


    All three commands will produce the same output.'
  merge: -1
  img_proc: true
