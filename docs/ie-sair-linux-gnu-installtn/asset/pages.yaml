- pgno: 204
  md: "# Differences in XFree86 v4 and XFree86 v3\n\n# XFree86 version 4\n\nXFree86\
    \ version 4 uses a single binary executable, /usr/X11R6/bin/XFree86. The XFree86\
    \ program dynamically loads the needed X server modules from /usr/X11R6/lib/modules/.\
    \ Some modules are automatically loaded; some are optional and must be set up\
    \ in XFree86's configuration file, /etc/X11/XFree86Config-4.\n\n# XFree86 version\
    \ 3\n\nXFree86 version 3 uses individual X server programs for each family of\
    \ server hardware (video cards). The XFree86 server programs installed on your\
    \ system are in /usr/X11R6/bin/.\nThe format of the server program name is XF86_server-type.\
    \ For instance, video cards using the S3 video chip would use the S3 server. There\
    \ are also generic, unaccelerated VGA and SVGA servers that may be used if a server\
    \ for the specific video card cannot be found or if the accelerated server does\
    \ not work correctly.\nThe configuration file file for XFree86 version 3 is /etc/X11/XFree86Config.\n\
    \n# A-1: Discussing X Windows\n\n| Questions and answers |\n| --- |\n| 1 Which\
    \ X component controls the video hardware? \n The server |\n| 2 Which X component\
    \ provides user access to a window manager? \n The client |\n| 3 Where is the\
    \ XFree86Config file found? \n /etc/X11 |\n| 4 If there is no Linux accelerated\
    \ server for your video card, you cannot configure and run X Windows. True or\
    \ False? \n False. The generic VGA or SVGA server will usually work. |"
  merge: -1
