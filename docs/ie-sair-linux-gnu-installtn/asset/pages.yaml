- pgno: 11
  md: '# Topic B: Setting student expectations


    Properly setting students’ expectations is essential to your success. This topic
    will help you do that by providing:


    +   - Prerequisites for this course

    - A description of the target student at whom the course is aimed

    - A list of the objectives for the course

    - A skills assessment for the course


    # Course prerequisites


    Though there are no formal prerequisites for this course, the use of a keyboard
    and a mouse. Students should have installed some type of operating system on a
    PC. Students should also be familiar with navigating a graphical user interface,
    including the basics of opening, minimizing, resizing, and closing windows.


    # Target student


    This course is aimed at anyone with the desire to learn Linux. It is the first
    course in a series of courses that will take the student from being a novice Linux
    user to a competent Linux system administrator. Whether the student is a dedicated
    career changer, a practicing professional on some other operating system or simply
    curious about what Linux is all about, this course is the starting point.


    # SAIR 101 certification exam


    This course is also part of preparation for the SAIR 3X0-101 certification exam.
    The SAIR certification exams are designed to test the students’ knowledge of Linux
    and their ability to apply that knowledge. So, in addition to this course, the
    average student will require 3 to 6 months of hands-on experience to successfully
    complete the SAIR 3X0-101 exam. Students who have previous experience with Linux
    or another UNIX will require proportionately less hands-on practice.


    # Course objectives


    You should share these overall course objectives with your students at the beginning
    of the day. This will give the students an idea about what to expect, and will
    also help you identify students who might be misplaced. Students are considered
    misplaced when they lack the prerequisite knowledge or when they already know
    most of the subject matter to be covered.


    After completing this course, students will know how to:


    +   - Discuss the history of open source software in general and Linux in particular.

    - Describe the structure of the Linux operating system.

    - Configure and troubleshoot Linux boot loaders.

    - Plan and perform a Linux installation.

    - Describe the startup and shutdown process, including important scripts and configuration
    files.

    - Use and customize the bash shell.'
  merge: -1
  img_proc: true
