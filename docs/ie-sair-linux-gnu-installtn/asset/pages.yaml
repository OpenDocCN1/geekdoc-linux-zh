- pgno: 65
  md: '# # Topic A: Hardware inspection and analysis


    Explanation


    Current installation hardware information ahead of time is not as crucial as it
    was once. Nevertheless, sometimes it will be necessary to manually identify or
    configure system hardware. To assist you in collecting and organizing hardware
    configuration information, a Linux worksheet is provided for you at the end of
    this unit. You can use the sources detailed below to gather information about
    your system.


    # ## System information sources


    The latest versions of Linux can automatically detect hardware during installation.
    In some cases this information cannot be accessed by a particular system. If the
    answers to hardware questions are not available, you might find yourself in the
    middle of an installation with no way to continue without starting over. In order
    to prevent this situation, you should gather as much information about your hardware
    as prior to the installation. This information is usually available in hardware
    documentation. If the documentation is not available, information about your hardware
    can be obtained from Windows or a stand-alone hardware diagnostic utility.


    # ## Hardware documentation


    The best place to obtain information about your hardware is from the original
    documentation included with your system. In most cases, the documentation will
    contain detailed specifications about your hardware that will be necessary during
    an installation of Linux. If you do not have the documentation for your hardware,
    try contacting the vendor or searching their Web site for general information.


    # ## Linux diagnostics


    Linux does not currently offer a single program or utility that will provide a
    user with all useful system information, there are various commands for gathering
    desired information. One such command is the `dmesg` command, which displays boot-time
    kernel messages. You can also check files in the `/proc` directory to determine
    how system resources are being used.


    # ## Windows system information


    If you are installing Linux on a machine already running Windows, the system information
    in the control panel will give a thorough overview of the hardware. To access
    this information, double-click the system icon in the control panel. The General
    tab will supply you with basic information such as processor speed and amount
    of RAM. The Device Manager tab will give you a more detailed listing of the hardware
    installed on your computer and the drivers associated with that hardware. The
    Device Manager window gives you the option of printing a system resource report.
    This report contains a significant amount of information concerning the system.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Hardware diagnostics


    Another alternative for gathering system information is to run a diagnostic program
    such as msd.exe. This Microsoft diagnostic utility creates a detailed report on
    the hardware configuration of the system. If there is no Microsoft operating system
    installed, msd can be placed on a bootable MS-DOS or MS Windows 95/98/ME floppy
    diskette.


    Using these information sources, you should be able to obtain virtually any information
    needed for an installation. Be sure to make use of the installation worksheet
    at the end of this unit in order to keep important system information readily
    available.


    # A-1: Viewing and using information in the proc filesystem


    # Here''s how


    +   1 Login to your machine.

    2 Start an X session if it is not already started.

    3 Open a terminal window.

    4 Become superuser (root) using the su command.

    5 cd to the /proc directory and display its contents with the ls command.

    6 Which entries are files and which are directories?


    Use -l. Any entry whose permission mask begins with a "d" is a directory. Alternatively,
    in a bash terminal window or at the console bash prompt, execute the ls command.
    Entries in blue are directories. (This is on a "stock" Red Hat system with an
    unaltered bash configuration. Other Linux distributions may have modified colors
    for the ls command. Also, the color scheme is user-configurable.)


    +   7 Are there any links?


    Use -l. Any entry whose permission mask begins with an "l" is a link. Alternatively,
    in a bash terminal window or at the console bash prompt, execute the ls command.
    The entries in aqua are links. (This is on a "stock" Red Hat system with an unaltered
    bash configuration. Other Linux distributions may have modified colors for the
    ls command. Also, the color scheme is user-configurable.)


    +   8 Display the contents of /proc/interrupts. What information is found in this
    file?


    Device hardware interrupt assignments


    +   9 Experiment by choosing other files that look interesting to you and displaying
    their contents.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Topic B: Hardware compatibility issues


    Explanation


    Linux excels in optimizing the resources of older personal computers (PC’s). Often,
    less expensive hardware is purchased or older hardware is "recycled" when putting
    together a Linux box. Although this strategy usually works, the administrator
    sometimes must deal with incompatible hardware. Problems arise when device drivers
    are unavailable for system components and options.


    While most distributions install flawlessly on most contemporary PC’s, systems
    use options that replace hardware functions with MS Windows driver software. Such
    options (so-called Winmodems are a primary example) are problematic and, often,
    useless on a Linux system.


    To be sure about hardware compatibility, the administrator must compare the listed
    PC components against a compatibility list such as the one that can be found at
    www.metalab.unc.edu/LDP/Hardware-HOWTO.html.


    # PC architecture


    Several configuration issues arise when dealing with the PC motherboard and its
    components. To understand the Linux installation process, one must first understand
    how the generic PC is constructed.


    The CPU is the heart of the system. Most of the PC’s today use CPU’s from Intel
    or AMD. Either brand of CPU is fully supported by Linux.


    The CPU is connected to memory and peripheral devices via the memory and I/O buses.


    # Memory


    Depending upon how old the system is, the memory bus may run at speeds from 66MHz
    up to 133 MHz (266 MHz with DDR memory). The memory subsystem may support a wide
    variety of connectors and memory types. The two widely used connector technologies
    are SIMM (Single Inline Memory Module) and DIMM (Dual Inline Memory Module).


    SIMM modules have 72 pins (although very old 386-based systems may have 30 pins)
    and typically use either FPM or EDO memory (more on memory types below).


    DIMM modules have 168 pins (in desktop or server PC systems) or 144 pins (in laptops).
    The most prevalent type of memory in DIMM format is SDRAM, DDR RAM also comes
    in DIMM format but is not backward compatible with SDRAM.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Pre-installation planning


    Memory types, speeds and compatibility

    The following list summarizes the various types of memory:


    +   - DRAM (Dynamic Random Access Memory): DRAM is the fundamental memory type
    used in computers. Random access means that the CPU can access any location within
    the memory device. Dynamic means that the individual storage cells must be refreshed
    (usually every few milliseconds) or the data within the cells will be lost.

    - FPM (Fast Page Mode): DRAM is organized into columns and rows. A good analogy
    is a spreadsheet. The intersection of a column and row uniquely identifies a cell.
    FPM DRAM selects and selects columns within the page, improving overall memory
    access time compared to earlier architectures.

    - EDO (Extended Data Out): EDO DRAM is a technology available on Pentiumclass
    systems. Without getting into too much detail, EDO supports a shorter read cycle
    to the CPU and maintains the validity of the addressed data after the CPU has
    “released” the address. This allows faster CPU''s to use the available cycles
    to memory more efficiently and improves overall access.

    - SDRAM (Synchronous DRAM): SDRAM is simply DRAM that runs in synchronization
    with the CPU clock. This allows SDRAM to run at the speed of the system bus (often
    called the Front Side Bus or FSB).

    - DDR (Double Data RAM): DDR is DRAM that runs at double the rate of standard
    SDRAM. Again, without getting into too much detail, DDR uses both the rising and
    falling edge of the clock to double the transfer rate (SDRAM only uses the rising
    edge of the system clock)

    - RDRAM (Rambus DRAM): Rambus is a new memory design created by Rambus IC. It
    uses an 18 bit bus instead of the 32 or 64 bit busses that are standard on current
    PCs. RDRAM, like DDR RAM, uses both the rising and trailing edges of the system
    clock but transfers data more frequently. RDRAM is capable of transfers speeds
    in excess of 800 MHz. RDRAM also uses its own connector technology called Rambus
    Inline Module (RIMM).

    - Parity and ECC: In, all of the memory types listed above (except EDO which is
    available as non-parity only) are available as non-parity or ECC. Parity memory
    and some SDRAM parity memory uses a single additional bit as a consistency check
    for the data. Parity memory can detect, but not correct, errors in the data.

    - ECC memory uses multiple additional bits that are a calculated error correction
    code. ECC memory can detect data errors and usually correct a single bit error.


    Before the SDRAM, memory speeds were described in nanoseconds. EDO DRAM might
    be described as “60 nanosecond memory”. With SDRAM, this form of description is
    no longer accurate since the speed of SDRAM is directly linked to the speed of
    the front side bus (FSB). The most common speeds for SDRAM are 66, 100 and 133
    MHz.


    DDR RAM currently runs at 266 MHz.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Memory compatibility issues


    The type and speed of memory should always conform to the PC manufacturer’s specifications.


    Non-parity, parity, and ECC memory usually cannot be mixed. Most PC system BIOS’s
    will check for mismatches and will either warn the user or disable system boot.
    If the BIOS allows mismatched memory to be installed, it is always a bad idea
    and can cause system instability and data corruption.


    FPM and EDO memory, while sharing a memory module configuration (SIMM), cannot
    be mixed.


    The various speed SDRAM DIMMs are backward compatible. For example, PC133 (133
    MHz) SDRAM will work on a system with a 100 MHz front side bus. However, the memory
    will only run at 100 MHz. Different speed SDRAM DIMMs should not be intermixed.
    In many cases, the system will boot but you risk system instability and data corruption.


    DDR RAM is not backward compatible with SDRAM. RDRAM will only work on a system
    that specifically supports it.


    # Memory configuration recommendations


    RAM requirements vary depending on the type of installation. The Linux kernel
    requires about 1 MB of memory. The rest of RAM is used by daemons, applications,
    and the data cache. Exact memory requirements depend on many factors that revolve
    around which programs will be running with each other and the amount of memory
    data each will processing.


    The following recommendations are based upon experience with different applications
    and configurations. The memory requirements may not be the same for another mix
    of programs, and this should be taken into consideration. They are only meant
    to offer basic guidelines.


    Network firewall configurations can run in 4 MB systems. Network servers run well
    with 16 MB of memory. The GUI and its related graphical programs require more
    memory.


    | Application | Min/typical RAM | Swap |

    |---|---|--|

    | Network gateway | 4 MB / 8 MB | Not required |

    | Network server | 8 MB/16 MB | Usually not required |

    | Networked system (no X) | 16 MB/32 MB | 64 MB |

    | X workstation | 32 MB/64 MB | 128 MB |

    | X workstation with image | 64 MB/128 MB | 128 MB |'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 4-7


    Swap space is often configured using the "twice the size of RAM" rule of thumb.
    However, swap space beyond 128 MB rarely has any measurable effect on system performance.
    If swap space larger than 128 MB is required (based on measured system performance
    or application vendor recommendation), performance can be improved by splitting
    the swap space across multiple disk spindles and/or disk controllers.


    With modern desktop systems supporting up to 4 GB of RAM, server systems (especially
    64 bit systems) supporting hundreds of GB of RAM, and considering the low cost
    of additional memory, it makes more sense to add RAM inside of swap space.


    # Issues with older systems and motherboards


    There are two common problems with older motherboards using SIMM memory configurations
    larger than 64 MB.


    The first problem is a configuration problem. Linux uses a BIOS service to size
    memory, and many BIOS-sizing routines do not go over the 64 MB boundary. The user
    must configure the GRUB or LILO bootloader configuration script(s) to pass memory
    argument to the kernel. The memory size problem has been fixed in the newer kernels.
    If a kernel more recent than version 2.2.1 is used, it will find all of the available
    RAM.


    The second problem is a performance problem. To save on cost, many motherboards
    do not include all of the RAM required for large amounts of memory. Therefore,
    as the amount of installed memory increases beyond the 64 MB, 128 MB, or 256 MB
    boundary, the motherboard may no longer be able to cache these memory addresses,
    causing the system to slow to access the speed of memory. If extra tag sockets
    are on the motherboard, extra tag RAM will solve the problem. Otherwise, the motherboard
    will be replaced.


    New motherboards will solve this performance problem. New motherboards that employ
    high-speed SDRAM DIMM PC 100 memory do not use a cache on the motherboard.

    These 100 MHz memory chips have a 10 ns (nanosecond) or faster cycle time, making
    them faster than the 20 ns system cache on older SIMM-based motherboards. There
    is no need to use the motherboard-based cache in these systems.


    # Role of BIOS and device detection


    All of today’s computers firmware, or Read Only Memory (ROM), that the CPU executes
    upon power-up. The firmware performs diagnostics on the CPU, main memory, and
    installed peripherals. The firmware also allows the user to configure system functions,
    as to the time of day.


    On the 32 bit (IA32) system architecture, the firmware is called the Basic Input
    Output System (BIOS). In addition to the motherboard BIOS, each adapter contains
    a ROM-based BIOS, each adapter contains a BIOS diagnostic routine used to ensure
    that the adapter is working on system power-up.


    On the 64 bit Intel-architecture (IA64), the traditional firmware BIOS is replaced
    by a more powerful (and more complex) console firmware program called EFI (Extensible
    Firmware Interface).


    This module focuses on the IA32 PC BIOS. Additional information on the EFI console
    can be found on Intel’s web site.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# SAIR Linux GNU Installation and Configuration


    The PC BIOS also contains routines to access the hard disk and other peripherals.
    The Linux loader (LILO) uses the BIOS to boot Linux, or another OS. Unlike MS-DOS
    or MS-Windows, the Linux kernel does not use routines to access hard disks or
    other peripherals for the time-of-day clock. There are many reasons for not using
    the BIOS, but the essential problem is that the BIOS design does not use interrupts,
    which means it cannot support a preemptive multi-tasking OS.


    # Plug-and-Play


    Plug and play is a BIOS enhancement to eliminate the need for manual adapter reconfiguration
    by automatically adjusting the four I/O parameters: I/O address, IRQ, DMA channel,
    and shared memory address. Plug and play has difficulty achieving its goal of
    full adapter transparency, the Linux kernel has not used the plug and play routines
    of the 2.2.0 kernel. Plug and play support remains a kernel option in the 2.4
    and 2.5 kernels but built in most (if not all) of the default kernels in Linux
    distributions.


    # System clock


    When the system boots, the system clock is set from the BIOS Real-Time-Clock chip
    (RTC). On which distribution is being installed, the system clock may be configured
    as a GUI installation program or via the CLI. In either case, the system clock
    may be configured from the command line by using the date command. If, for instance,
    the date and time were 1:07 p.m. on February 12, 2001, the user would change it
    to root and enter the following command:


    ```

    $ date -s 021213072001

    ```


    The system clock counts the number of seconds that have elapsed since January
    1, 1970, and is always in Coordinated Universal Time (UTC). No changes occur to
    UTC during Daylight Savings Time (DST); only the conversion between UTC and local
    time will change, which is done by library functions that are linked to the applications
    requiring local time. Application that requires local time will require both the
    time zone and DST is in effect. Also, there is no construct in the kernel for
    either the system clock or the, as DST becomes effective/ineffective.


    The RTC should be set to UTC, for all machines that run Linux. One advantage of
    this is that there is no opportunity for the system clock to be off due to changes
    in DST if the system is rebooted. However, dual-booting Linux and other OS may
    require the RTC to be set to local time.


    In either case (local or UTC) the time zone will be required, since for UTC the
    distance from the Greenwich Mean line is necessary. The method for changing the
    time zone may differ, depending on the distribution. In Red Hat, for instance,
    /usr/sbin/timeconfig command would be used. For distributions that have the /usr/lib/zoneinfo
    directory, list of time zones will be found. Here for Central Standard Time (CST)
    for instance, a symbolic link would need to be created from /usr/lib/zoneinfo/US/Central
    to


    ```

    ln -sf /usr/lib/zoneinfo/US/Central /usr/lib/zoneinfo/localtime

    ```


    Additional information regarding system clock configuration can be found at www.linux.doc/HOWTO/mini/Clock.html.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_71_0.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Peripheral devices


    Certain peripheral devices have traditionally been problematic to a Linux installation.
    Among these devices are CD-ROM controllers, video adapters, and the monitor. These
    devices require special consideration in the course of their configuration. In
    order to successfully install and use Linux, you will need to understand how of
    these devices relates to various Linux implementations.


    # CD-ROM controllers


    Given the size of a typical Linux software release, installing from a CD-ROM drive
    is almost always required. An exception to this generality occurs when other computers
    are located on the same high-speed network, and only one is then network-based
    installations practical. Even though CD-based installations are frequently mandated,
    they cannot be completed if Linux does not have the necessary driver for that
    particular CD-ROM drive.


    CD-ROM drives may be attached to general purpose SCSI interfaces, and SCSI CD-ROM
    drives are well supported by Linux.... Access to a SCSI CD-ROM drive is via a
    SCSI driver and accessed through the regular SCSI device as `/dev/sdc`, or a SCSI
    disk.


    Another interface developed for CD-ROM drives using the common IDE controllers
    is referred to as the ATAPI CD-ROM drive interface. Access to these types of ATAPI
    interfaces is through the regular IDE drivers. For example, access to an ATAPI
    CD-ROM drive is through `/dev/hdc`, or hard disk b. Generally, Linux does well
    with all SCSI and ATAPI IDE CD-ROM drives.


    CD-ROM drives attached to sound cards were introduced into the computer market
    with custom interfaces on each CD-ROM drive model. In these early designs, the
    manufacturer provided a custom MS-DOS device driver to access the sound card,
    and in turn, the CD-ROM drive.


    All of the proprietary sound card CD-ROM drivers have been removed (“deprecated”)
    is the term you will see in some distributions'' (documentation) from currently
    shipping Linux distributions. With the wide availability of inexpensive IDE/ATAPI
    CD-ROM drives, if you are installing Linux on a system with a CD-ROM attached
    to a sound card, the best course of action is to purchase a supported CD-ROM drive.


    # The video adapter


    Video adapters generate the video signal that ultimately appears as an image on
    the monitor screen. These adapters are sometimes referred to as video adapters,
    graphics cards, or VGA cards. All video adapters accomplish their function via
    three major components.


    # The video controller (video processor)


    The video controller chip determines the type of I/O commands required to save,
    manipulate, and display information on the monitor screen. This does this by reading
    data from video memory and, based on its mode, providing a scan rate to the digital
    to analog converter (DAC) for display on the monitor times. These chips are complex,
    exceeding the complexity of the CPU many times. Video adapters are classified
    by the type of video controller chip used on the adapter and less by the video
    adapter manufacturer. Controller chips are classified by chip manufacturer and
    family. ATI, Nvidia, and S3 are examples of well-known chip manufacturers.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Video memory (RAM)


    Video memory is shared between the CPU and the video controller chip. The CPU
    places data in video memory and commands the controller chip to process and display
    the data. Data is arranged in video memory according to the current graph mode.
    The amount of video memory determines the maximum amount of information that may
    be displayed. If the video information is shallow, such as a black and white drawing,
    then a large amount of information can be displayed. If the video information
    is deep, as a true-color photograph, then a much smaller amount of information
    may be displayed using the same amount of video memory. The tradeoff between shallow
    and deep data is resolved with the use of graphic modes.


    # The graphic mode


    A graphic mode specifies the number of picture elements and the amount of information
    each element may hold. For example, 4 MBs of video memory will be able to hold
    2250-by-1750 pixel image with 256 colors per pixel, while the same amount of video
    memory will only hold 1280-by-1024 pixel image with 16 colors per pixel, or two-three
    thousand pixels.


    When installing Linux you will get to configure your graphic mode or choose a
    pre-defined (standard) mode. The standard modes are suitable for monitors; however,
    there are reasons for computing your own. The main point is that there is a compromise
    between refresh rate and resolution.


    Many times video utilize graphic modes that do not use all the available video
    memory; the Window system exploits this situation by providing multiple virtual
    desktops that one switch among, allowing the use of all video memory. Based on
    the current graphic mode, the video controller establishes a fixed number of scan
    lines and a fixed line length. The video controller sends this information with
    the contents of video memory as a series of bytes to the DAC.


    Below is a list of commonly used graphic modes. The column labeled "Resolution"
    shows the number of pixels on the X axis, the Y axis, and the number of colors.
    The "Memory" column shows the minimum amount of memory required for a given graphic
    mode. The column labeled "Horizontal" lists typical row-to-row raster sweep rates.
    The column labeled "Vertical" provides refresh rates for the whole display. Since
    newer monitors adjust themselves for higher frequencies, unless there are no horizontal
    or vertical listings for higher resolutions.


    | Resolution | Video memory | Horizontal refresh | Vertical refresh |

    | 640x480x16 | 154 KB | 31.47 KHz | 60 Hz |

    | 640x480x256 | 308 KB | 31.47 KHz | 60 Hz |

    | 800x600x256 | 480 KB | 37.88 KHz | 60.31 Hz |

    | 1024x768x256 | 787 KB | 78.9 KHz | 74 Hz |

    | 640x480x32K | 615 KB | 37.86 KHz | 74 Hz |

    | 640x480x16M | 922 KB | 37.86 KHz | 72 Hz |

    | 800x600x32K | 960 KB | 57.9 KHz | 72 Hz |

    | 800x600x16M | 1.44 MB | 56.5 KHz | 70 Hz |'
