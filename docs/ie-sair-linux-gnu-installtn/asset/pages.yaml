- pgno: 112
  md: '# Job control


    Each user process running in a shell is also known as a job and is assigned a
    job number. The first job started is assigned number 1. When a new process is
    started the system looks at the highest job number and increments it by one. If
    the process with the highest number completes or is terminated, that becomes available
    again. Use a percent sign (%) immediately before a job number in command lines
    to distinguish from a process ID, or PID.


    When working at the command line, the user does not have to wait for a program
    to finish before beginning another command. Programs can be made to execute in
    the background by following the command with the ampersand (&) character. Foreground
    programs run in the presently interactive shell, and background programs run in
    sub shells.


    For example, the following command runs in the background, searching the entire
    directory structure for the file filename:


    ```

    find -name filename &

    ```


    If you were to open a shell and enter locate log ~/logs, the terminal prompt would
    disappear for the time needed to execute the command. This is typical for all
    foreground jobs. If the same command was typed followed by an ampersand (&), the
    prompt would not hesitate to reappear after the enter key had been pressed. The
    job would be processed in the background, and the user would not have to wait
    for the job to finish.


    Even though only one foreground job can be processed at a time, many background
    jobs can be processed simultaneously. The limit of background jobs depends on
    the resources available on the computer system being used.


    After starting a command, if the user subsequently realizes that it may take longer
    to complete than originally thought, the command can be suspended by typing CTRL+Z
    and then pushed to the background with the bg command. For example, assume the
    following sequence of commands:


    ```

    find -name filename -log

    CTRL-Z

    bg

    ```


    As each background job is finished, a message is printed to the screen to inform
    the user of the job completion.


    To check the number of jobs running, or to view which jobs are running, type the
    following command:


    ```

    jobs

    ```


    Jobs are displayed in a numbered list. The list is organized such that the first
    command executed is number one and the last command executed is the last number
    in the list.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# SAIR Linux GNU: Installation and Configuration


    Since only a foreground job take input from the terminal, occasionally a job must
    be pulled from the background to the foreground. Use the fg command to do this.
    Assume that we have a job list looks like the following:


    +   [1] Running locate \* /dev/null &\n[2] Running locate log > /dev/null &\n[3]
    Running locate file > /dev/null &


    In order to bring job number 2 to the foreground, the following command is used:


    ```

    fg %2

    ```


    A job running in the foreground can be terminated by typing CTRL+C. A background
    job can be terminated using the kill command and the job number. For example:


    ```

    kill %1

    ```


