- pgno: 76
  md: '# Pre-installation planning 4-13


    # Is it possible to break your monitor?


    The short answer to this question is, “Yes.” Nevertheless, monitor capabilities
    have significantly improved over the years, and there should not be a problem
    with a newer monitor accepting the default refresh rates stated in the Linux configuration
    files. In fact, these refresh rates can most likely be increased to improve viewing
    comfort. Most of the problems occur with fixed frequency monitors.


    # Device support issues


    Because Linux is a preemptive multi-tasking OS, it must use interruptible device
    drivers for each device and cannot rely upon well-established hardware interfaces.
    Generally, this is not a problem with replace hardware with CPU operations specific
    to a particular OS. These hardware vendors generally not release the private data
    communication protocols between the CPU and peripheral, thereby preventing others
    from writing device drivers for those devices. Example devices are printers, video
    cards, and modems.


    # Printers


    Almost all postscript printers are well supported by Linux. The only common problem
    is the occasional lack of a Linux-hosted utility to monitor and manage the printer.


    Most ink jet or bubble jet printers require a custom communication protocol between
    the printer and the device driver The best supported of the ink jet printers are
    those by Hewlett Packard. Drivers are available on the HP web for many of these
    printers.


    The primary message is that unless a driver for a specific printer is available,
    it will not be Linux-friendly.


    # Video adapters


    Video adapters can be problematic. Although the XFree86 project supports many
    types of video adapters, new ones are released every few months, and resellers
    tend to package the most recent and inexpensive video drivers in the new systems.
    The result is that the Linux user must check in advance to see whether Linux supports
    the video adapter hardware before purchasing a new system.


    The XFree86 web site is the primary resource for determining the availability
    of a Linux driver for a particular video card. And, as noted earlier, the dependency
    is between the video chipset and the driver, not the video card manufacturer and
    the driver. For instance, Nvidia does not manufacture a line of video cards. However,
    many manufacturers use the various Nvidia chipsets in their products. If you are
    installing Linux on a system using one of the Nvidia chipsets, the chipset family
    is what you will look up on the XFree86 web site.


    # Modems


    One innovation in modern design has been to build controllerless modems, or Winmodems.
    These modems are designed to be inexpensive to produce rely on the operating system,
    in this case, Windows, to provide some functionality previous provided in hardware.
    If a PC has a modem included on its motherboard, modem is almost certainly a Winmodem.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# SAIR Linux GNU Installation and Configuration


    Although there are some Linux drivers available for some Winmods, none is complete
    or stable. The best course of action is to purchase an external modem or PCIbus
    modem card for a desktop system or a PCMCIA modem for a laptop. Such "controller-based"
    or "full" modems are well supported by Linux and usually have better performance
    than Winmods.


    Do it!


    # B-1: Discussing Linux hardware compatibility


    # Questions and answers


    +   1 Why might you be unable to install Linux from a CD-ROM?


    > primary reason might be the lack of a driver for your CD-ROM controller. This
    is common with the older, sound card based controllers. Other reasons could include
    a bad CD (especially if you copied the .iso images from a distribution web site
    and burned your own CD) or a bad nitrd image.


    +   2 Which controllerless modems are supported by Linux?


    > The simple answer is none. Some chips have experimental drivers.


    +   3 How much swap space should be allocated for a web server with 576 MB of
    RAM?


    > Regardless of the installation wizard''s suggestions, 128 MB is probably plenty.
    The best course of action is to choose 128 MB and monitor the swap activity. If
    the system spends lot of swapping, add RAM not swap space.


    +   4 A co-worker asks you for help with a Linux installation. She tells you that
    after the installation, her monitor stopped, and she thinks the Linux installation
    broke the monitor. Is this possible?


    +   5 You have a Pentium 4 server that is swapping excessively and users are complaining
    about system performance. You decide to increase the system RAM from 512 MB to
    1.5 GB. Is this likely to solve the performance problem? The system uses PC100
    SDRAM and has a 100 MHz system bus. You have purchased some DDR RAM to increase
    memory performance. Will this work?


    > There is a high probability that the addition of RAM will improve the swap-based
    performance issues. If there are other performance problems, those will have to
    be diagnosed and fixed separately.


    The DDR RAM will only work if the system is designed to use DDR RAM. You cannot
    mix SDRAM and DDR RAM.


