    # Cannot communicate


    The examples above describe some of the reasons for being unable to communicate.
    If the network interface is not properly configured and started, communication
    is obviously impossible.


    Other communication problems include not being able to connect to a remote host
    using its name (as opposed to its IP address) and being unable to communicate
    with entire remote networks.


    # “Unknown host”


    An unknown host message tells you that the hostname of the system you are trying
    to connect to cannot be resolved to an IP address.


    The first step is to check basic IP connectivity by pinging the remote system
    using its IP address, then if this works, either the local host files or the DNS
    configuration are the prime suspects.


    If you are using DNS (almost a certainty on anything other than the simplest local
    networks), then the DNS configuration is the first thing to check. The DNS server
    configuration is found in the /etc/resol.conf file:


    ```

    $ more /etc/resol.conf

    nameserver 1.2.3.4

    nameserver 4.5.6.7

    search server.somewhere.net

    ```


    A first step would be to try pinging the IP addresses of the nameservers. If you
    can’t ping them, then you either have a basic connectivity problem or you aren’t
    getting beyond your local subnet. Make sure you are not seeing “Network unreachable”
    messages (see below).'
  merge: -1
  img_proc: true
