    a primary partition. Enter 3 to designate the number of the partition. When asked
    to specify the first cylinder, press <ENTER> to choose the default. When asked
    to designate the last cylinder for the partition, press <ENTER> again to choose
    the default, which will extend the partition to the remaining space on disk.


    Now you must specify the partition types for your partitions. First, enter 1 to
    view a list of available partition types. 82 is the hex code for a Linux swap
