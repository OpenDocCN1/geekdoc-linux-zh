- pgno: 100
  md: '# Topic B: Configuring init


    Explanation


    System V init, or SysV init, is becoming the Linux standard for controlling the
    startup of software during system boot. It originated from AT&T''s System UNIX.
    Some distributions, such as Slack, have traditionally used BSD init. Although
    the current release of Slack still uses the BSD style, it also checks to see if
    SysV init files exist, and if they do use them.


    Since the use of SysV init is so pervasive, the remainder of this topic will focus
    on.


    The configuration file for /sbin/init is /etc/inittab. Since init is the process
    that starts all of the other processes, this configuration file is very important,
    and the original file should be backed up before any edits are made to it.


    # Format of the inittab file


    Within the inittab file, lines beginning with a hash mark (#) are ignored by init
    and are used for comments. Each entry follows the format:


    ```

    id:runlevels:action:process

    ```


    The id is a unique sequence of 1-4 characters that identifies an entry in inittab.
    Older versions used only 1-2 characters.


    Runlevels lists the runlevels for which the specified action should be taken.


    Action describes what action should be taken. A detailed list of the 15 available
    actions can be found in the man page for inittab.


    Process specifies the process to be executed.


    # Sample inittab file


    +   # inittab

    # This file describes how the INIT process

    # set up it

    # the system in a certain run-level.


    +   # Author: Miquel van Smoorenburg,

    <miquels@drinkel.nl.mugnet.org>

    # Modified for RHS Linux by Marc Ewing and

    # Donnie Barnes


    +   # Default runlevel. The runlevels used by RHS are:

    # 0 halt (Do NOT set initdefault to this)

    # 1 Single user mode

    # 2 Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 Full multiuser mode

    # 4 unused

    # 5 Xli

    # 6 reboot (Do NOT set initdefault to this)


    ```

    id:5:initdefault:


    # System initialization.

    sysii::sysinit:/etc/rc.d/rc.sysinit

    ```'
  merge: -1
  img_proc: true
