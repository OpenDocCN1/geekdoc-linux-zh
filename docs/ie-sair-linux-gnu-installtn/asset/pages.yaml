- pgno: 84
  md: '# Topic D: Network configuration


    Explanation


    If you plan to connect your Linux system to a network, you should collect the
    information necessary to configure networking prior to starting the installation.


    Most Linux systems, connecting to a network means a physical connection to an
    Ethernet and the configuration of the Linux host to use the TCP/IP protocol. Network
    topologies other than Ethernet and networking protocols other than TCP/IP are
    beyond the scope of this course and will not be covered. (A thorough review of
    networking is available in the SAIR 103 course).


    Only the rudiments of networking are covered here. The bare essentials needed
    to get a Linux host connected to an existing TCP/IP network are described below.


    # The network interface card (NIC)


    Most NICs are autodetected during installation. Rarely, it is necessary to manually
    select your network card from a list of known type cards. It may be necessary
    to obtain a driver for your card from the manufacturer. For these reasons, it
    is helpful to know the NIC manufacturer and model prior to starting the installation.


    Most laptops and some desktop systems have the NIC embedded on the motherboard.
    In some cases, the NIC and modem are on the same chip. These combination chips
    usually create the same dilemma for NIC configuration when Windmods pose for modern
    configuration: there are rarely Linux drivers for these chips. If you have a system
    with one of these embedded combination chips, the only practical solution is to
    purchase a separate NIC. This can be a PCI card for a desktop system or PCMCIA
    card for a laptop.


    # TCP/IP configuration


    TCP/IP configuration can be automatic or manual. Automatic configuration using
    the Dynamic Host Configuration Protocol (DHCP) is the default for most Linux distributions''
    installation wizards. If you are connecting to a network that has a DHCP server,
    this is the simplest, least error-prone choice.


    If you are connecting to a network without a DHCP server or if your network administrator
    requires the use of static IP addressing, you will have to configure TCP/IP networking
    manually.


    # The IP address


    An IP (Internet Protocol) address is a unique, numeric address identifying the
    host computer. Since the address must be unique, you can''t choose an address
    at random; a network administrator must assign it.


    If you are installing Linux on a home network, you are the network administrator.
    If the home system will be connected to the Internet, your ISP (Internet Service
    Provider) will provide either a static IP address for your machine or provide
    a dynamic IP address using DHCP.


    There are four parts to an IP address, each separated by a dot. This is often
    referred to as dotted-decimal format. Taking an example IP address, w.x.y.z, each
    letter represents a decimal number from 1 to 255. 0 and 255 have special meaning
    and are not used for host IP addresses.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# SAIR Linux GNU Installation and Configuration


    In reality, each part of the IP address varies with the IP address class. However,
    IP address classes are an advanced networking topic beyond the scope of this course.
    (A thorough review of networking is available in the SAIR 103 course). It is likely
    that any static address assigned to your computer will be a Class C address. That
    is what is described here.


    A static IP address assigned to your computer will take the form of w.x.y.z.(1-254).
    For example, the IP address w.x.y.10 would assign your computer host address 10
    on the network identified by the rest of the IP address.


    # The network mask


    The network mask has the same basic format as the IP address. However, the network
    mask, as its name implies, is used to control the number of hosts within a subnet.
    For instance, a network mask of w.x.y.0 describes a subnet with 254 possible host
    computers. A network mask of w.x.0.0 describes a subnet with 65,534 possible computers.


    In any case, if static IP addressing is used, the network mask will be supplied
    along with the IP address. The network mask should be automatically set if DHCP
    is used.


    # The default gateway


    A gateway is a system with special routing software installed and, possibly, with
    multiple network interface cards. A default gateway should be configured on each
    Linux host system to enable communication to all addresses outside the subnet.


    The network administrator should supply the default gateway address. The default
    gateway should be automatically configured if DHCP is used.


    # The Domain Name Service


    Domain Name Service (DNS) servers translate numeric IP addresses to host names
    and, reversing the process, translate host names to IP addresses.


    Technically, DNS is not an absolute requirement for communication across an IP
    network. However, without DNS you must manually configure a local file to perform
    IP address to host name translation or use the numeric IP address instead of the
    more convenient host.


    During installation, if static IP addressing is selected, you are given the opportunity
    to select one or more DNS servers. The network administrator should provide the
    DNS server names and/addresses. If DHCP is used, the DNS server(s) may or may
    not be automatically configured. If not, the DNS servers can be assigned during
    post-installation configuration.'
  merge: -1
  img_proc: true
