- pgno: 78
  md: '# Topic C: Hard disk partitioning


    Explanation


    There are two key partitioning choices when installing Linux to the hard disk.
    The first is whether or not to participate in decisions affecting the partition
    of the hard disk so that you can customize and fine-tune the workings of disk
    operations within the OS.


    The second issue is whether or not to select a Linux distribution and/installation
    option that automates the partitioning process. If you choose to let the installation
    wizard partition the disk for you, you avoid the possibility of creating a non-functional
    partitioning scheme. However, the choices made by the installation wizard may
    not create a partitioning scheme tuned to your needs.


    For the average laptop or desktop workstation, the automatic partitioning feature
    in most Linux distributions'' installation wizards creates an acceptable partitioning
    scheme. However, for servers (or power-user workstations with special needs),
    greater control over the partitioning scheme is required.


    Making good choices when manually partitioning hard drives requires a basic understanding
    of hard drive layout, of how the PC BIOS views hard drive partitions, and of how
    the Linux operating system views partitions.


    # ### Hard drive basics


    You don''t need to master the esoteric details of low-level hard drive geometry
    and layout to understand how hard drives are partitioned. While the actual layout
    of a hard drive is three-dimensional, a PC hard drive can be understood as a set
    of two-dimensional slices of a circle (which like slices of pie). Using the example
    of two hard drives, Exhibit 4-1 shows a conceptual view of how the PC BIOS and
    how Linux view the drive partitions. The primary hard drive has 3 partitions and
    the secondary hard drive has two partitions.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_78_0.png)


    Exhibit 4-1: BIOS and Linux views of hard drive partitions'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Creating partitions


    # How the PC BIOS sees partitions


    One description of hard disk partitioning is the act of taking one hard drive
    and turning it into many, smaller, logical hard drives. This is precisely what
    hard drive partitioning accomplishes.


    The standard PC BIOS implements two basic partitioning types: primary and extended.
    There may be a maximum of four partitions on a PC hard drive.


    This is an inadequate number of partitions for most uses, so the PC BIOS supports
    the concept of the extended partition. There may be one extended partition within
    one of the primary partitions on a hard drive. Within the extended partition,
    multiple partitions may be created.


    There is no fixed limit on the number of logical partitions (sometimes called
    logical drives or logical volumes) that may exist within an extended partition.
    However, because of the way Linux uses partitions, creating more than 12 partitions
    is not advised.


    # How Linux sees partitions


    Linux, like all operating systems, must whatever low-level hardware facilities
    are available on a particular hardware platform. Linux "maps" its partitioning
    on top of the PC BIOS partitioning scheme by giving Linux-relevant names to the
    partitions understood by the BIOS. In Exhibit 4-1, Linux partition 1 on the primary
    drive hda1, similarly, partition 3 on the same hard drive is named hda3.


    The drive names in Exhibit 4-1 are for IDE drives. IDE drives are named hda for
    the first drive, hdb for the second and so on. SCSI drives are named sda for the
    first SCSI drive, sdb for the second and so on.


    The actual device names for the partitions are of the form /dev/hda1, /dev/hda2,
    etc. To Linux UNIX''s—a device is simply a special kind of file. In the case of
    a hard drive, it is a "device" file kept in a directory /dev.


    When partitions are created, they are assigned names and may also be associated
    with a "mount point." A mount point is a simple name given to the starting point
    or address of a filesystem. A filesystem is nothing more than a tree-structured
    list of directories and files. So, for instance, the /dev/hda1 partition would
    have the / (or "root") partition mounted on it.


    This is important to understand because the graphical utilities that run during
    Linux installation not only allow you to create partitions (or the utility creates
    them for you if automatic partitioning is chosen). They also allow you to specify
    the mount point associated with each partition (or the utility assigns them for
    you if automatic partitioning is chosen).


    # Automatic partitioning


    Most Linux distributions are packaged with installation programs or "binoculars."
    Included in most of these wizards are graphical tools for manually or automatically
    partitioning the hard drive(s). The Red Hat graphical partitioning tool is called
    Disk Druid. The automatic partitioning option is shown in Exhibit 4-2.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Pre-installation planning


    Online Help


    Disk Partitioning Setup


    ![](img/f850b93901b8bb4c267df1b99fb6de52_80_0.png)


    # Choosing Partitioning Strategy


    One of the largest obstacles for a new user during a Linux installation is partitioning.
    Red Hat makes this process much simpler by providing an option for automatic partitioning.


    By selecting automatic partitioning, you will not have to use tools to assign
    mount points, create partitions, or allocate space for your installation.


    Automatic partitioning sets up your partitioning based on your installation type.
    You can also customize the resulting partitions to meet your needs.


    The manual disk partitioning tool, Disk Druid, allows you to set up your partitions
    in an interactive environment. You can choose filesystem types, mount points,
    size and more in this easy to use, powerful interface.


    fdisk is the traditional, text-based partitioning tool offered by Red Hat Although
    it is not as easy to use, there are cases where fdisk is preferred.


    +   - Have the installer automatically partition for you

    - Manually partition with Disk Druid

    - Manually partition with fdisk [experts only]


    Exhibit 4-2: Selecting automatic partitioning in Red Hat 7.3


    Automatic partitioning usually creates a very simple partition scheme appropriate
    for single user systems (desktops, workstations, laptops). This partitioning scheme
    creates:


    +   - A swap partition equal to twice the RAM size

    - A small (around 100 MB) partition for the bootloader, Linux kernel, and associated
    files. This partition is usually assigned the mount point of /boot.

    - A partition containing the rest of the space on the hard drive. This partition
    is usually assigned the mount point of /root/.


    For a desktop or laptop, or any other system with a single disk drive and a single
    primary user, there are only a few compelling reasons not to use automatic partitioning.


    One reason is that automatic partitioning reformats the partitions thus destroying
    any data on the disk. If the disk has data that needs to be preserved, automatic
    partitioning should not be chosen.


    Another reason is that the filesystem type cannot be modified using automatic
    partitioning. The current default filesystem type when installing Red Hat is the
    ext3 journaled filesystem. The current default filesystem type under SuSE Linux
    is Reisers (another journaled filesystem). If you wish to use some other filesystem
    type, you must partition manually.


    Server systems, multi-disk systems, and multi-user systems may have very different
    requirements and probably will require manual partitioning.'
  merge: -1
  img_proc: true
