- pgno: 102
  md: '# Runlevels


    Runlevels are used in a Linux system to set or describe the system state. They
    are a set of software configurations that ensure that certain processes are either
    started or stopped. There are three reserved runlevels – 0, 1, and 6. The use
    of runlevels 2-5 varies among the distributions.


    # Runlevel 0


    This is used to halt the system. When the system switches to runlevel 0 all processes
    are shut down and all disks are unmounted.


    # Runlevel 1


    This runlevel is also known as single-user mode or maintenance mode. When the
    system is in 1 the root user is given a shell on /dev/console and no other users
    are allowed to login. This allows the administrator to make system configuration
    changes or do maintenance tasks safely. When the administrator exits runlevel
    1, the system will be taken to the default runlevel specified in inittab. Sometimes
    runlevel S or is also used to refer to this runlevel.


    # Runlevel 6


    Runlevel 6 will first bring the system to runlevel 0, then it will force the system
    to reboot.


    # Default runlevel


    The default runlevel is defined in /etc/inittab. There is no process required
    for this entry. The entry will look similar to the following:


    ```

    id:3:initdefault:

    ```


    This tells init that it should start in runlevel 3. Since runlevels 2-5 do not
    have a standard definition, the resulting system state from this runlevel could
    vary from distribution to distribution. Also, the administrator has the ability
    to reconfigure the runlevels so the system state of one machine in runlevel 3
    could be different than another machine running the same version of the distribution.


    For example, the entry shown above on a default Red Hat installation would put
    the system in multi-user mode with text-mode login. The same entry on a duSE installation
    would present the user with a graphical login.


    The administrator can find out what happens in each runlevel by examining the
    inittab file and the resource control (rc) files used by it.


    Using runlevels can allow your system to be setup to do different tasks easily.
    The runlevels that are not the defaults for your distribution can be modified
    to fix your purposes.


    For example, if you wanted to create a server that only had the httpd, sendmail
    and ssh daemons running, you could modify the scripts for runlevel 4 so that all
    other daemons were stopped and those three started. Then you could make runlevel
    4 the default runlevel, and if you needed to enable the other services that are
    normally on by default, you could switch to runlevel 3.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Resource control files


    Resource control (rc) files are used by init to start and stop daemons. The method
    used by the init program to read resource control files and execute shell scripts
    among Linux distributions. Although this difference may seem fundamental, the
    strategies are easy, to understand, and easy to modify.


    The chain of events for init during system initialization at boot time is as follows:


    +   1. The kernel finds initab and finds control to it.

    2. init starts processing inittab and finds the default runlevel.

    3. init runs /etc/rc.d/sysinit.

    4. rc.sysinit performs several global initialization tasks.

    5. init runs the rc script with the runlevel as an argument.

    6. The rc script runs all of the kill scripts in the appropriate runlevel directory.

    7. The rc script runs all of the start scripts in the appropriate runlevel directory.

    8. init runs the rc.local script.


    The main directory for the rc files is /etc/rc.d. This directory contains the
    files and directories:


    | Item | Description |

    |---|---|

    | init.d | directory that holds the main scripts |

    | rc | master script |

    | rc0.d | directory used to hold scripts to run for runlevel 0 |

    | rc1.d | directory used to hold scripts to run for runlevel 1 |

    | rc2.d | directory used to hold scripts to run for runlevel 2 |

    | rc3.d | directory used to hold scripts to run for runlevel 3 |

    | rc4.d | directory used to hold scripts to run for runlevel 4 |

    | rc5.d | directory used to hold scripts to run for runlevel 5 |

    | rc6.d | directory used to hold scripts to run for runlevel 6 |

    | rc.local | administrator script that is run after all other initialization scripts
    |

    | rc.sysinit | script that is run one time at system initialization |'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Startup and shutdown


    The /etc/rc.d/init.d directory contains one script for each service that must
    be started during system initialization or when changing runlevels. These scripts
    usually take an argument allows you to start, stop or restart the service. The
    scripts in the runlevel directories are actually symbolic links to the scripts
    in /etc/rc.d/init.d directory. These links start with either a K or S followed
    by a name of the original. The rc script runs the K scripts in numerical order,
    followed by the S scripts in numerical order. When the rc script calls these it
    examines the first letter, and if it starts with a K it runs the script with the
    argument. Conversely, the S scripts are run with the start argument.


    The default rc.local script does not typically do anything. It exists to enable
    the administrator to customize the initialization process. You can add your own
    commands into this file, and they will be processed last during initialization.
    Therefore, if you enter something in this script that counter something in one
    of the other initialization scripts, your changes will override the runlevel scripts.


    Do it!


    # B-1: Working with the initialization scripts


    +   1 What version of system initialization is becoming the standard on Linux


    System V init or SysV init

    2 What are the three reserved runlevels?


    0, 1, and 6

    3 All distributions use runlevel 5 for X11. True or false?


    False. Runlevels 2-5 can be set to anything. Some distributions use 3 for X11.

    4 List the three rc scripts used during system initialization.


    rc.sysinit, rc, rc.local

    5 Which of the above three scripts runs last in the initialization process?


    rc.local'
  merge: -1
  img_proc: true
