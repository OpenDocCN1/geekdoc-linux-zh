- pgno: 250
  md: '![](img/f850b93901b8bb4c267df1b99fb6de52_250_0.png)


    Exhibit 12-17: KMail client


    # TkMail


    TkMail is an e-mail client written using Tc/Tk and Perl and has been developed
    to work with the X Window system. TkMail''s best feature is that the is the entire
    application, except for composition of messages, can be explored and maintained
    using only the mouse. TkMail reads from folders using the mail standard. Some
    of the features of TkMail includes buttons, a new mail icon, automatic encoding
