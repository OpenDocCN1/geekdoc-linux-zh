- pgno: 263
  md: '# Topic D: Text editors


    Explanation


    One of the most fundamental uses for the personal creation is the command line,
    modification, and sharing of documents. Documents range in form and function from
    simple text to spreadsheets, graphics, and “enhanced” text such as the hypertext
    found in web pages. Arguably, the most ubiquitous document format is text, in
    all its various forms.


    The oldest method of creating and modifying simple text documents is the text
    editor. Text editors come in various forms and styles but can be grouped into
    three basic categories: command line editors, GUI editors, and editors embedded
    in more complex programs such as word processors and desktop publishing applications.


    Here, we will consider the command line and GUI forms of text editors.


    # Text editing from the command line


    There are a number of functional, easy-to-use GUI editors available on most Linux
    distributions. So, why bother learning how to use a command line editor? The answers
    are straightforward: most Linux servers do not run a GUI, and if the X Windows
    system fails, you are limited to the command console to resolve the problem. It
    is sometimes necessary to troubleshoot system problems remotely and, often, you
    are limited to a telnet or ssh command connection to the remote system. The ability
    to perform some of the basic text functions from the command line is a fundamental
    Linux system administrator skill.


    The command line editors found on most Linux distributions include vi, pico, and
    emacs.


    The vi editor is not only one of the oldest text editors around; it is also one
    of the oldest UNIX programs still in use. If you only learn one text editor, this
    is the one. The vi editor is available on more UNIX and Linux systems than any
    other.


    There are actually several versions of the vi editor: vi, vim, and gvim. In most
    Linux distributions, when you enter the vi command at the shell prompt, you are
    actually running the vi. The differences among vi, vim and gvim are mostly cosmetic,
    and all share the same basic command structure.


    The vi editor operates in two modes: command mode and insert mode. When you start,
    the default mode is command mode. Commands are preceded by a colon (:) at the
    bottom of the screen.


    In command mode, you can navigate through the document, cut and paste text, undo
    previous actions and much more.


    You enter insert mode by typing i at the command prompt. Once in insert mode,
    you can navigate through the document using the arrow keys and the Page Up and
    Page down keys. The escape (Esc) key returns you to command mode.


    You exit the editing session from command mode with :q or :wq command. The :q!
    command quits without saving and the :wq command writes the buffer (the text edited)
    to a file.'
  merge: -1
  img_proc: true
