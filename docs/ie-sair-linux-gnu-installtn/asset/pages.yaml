- pgno: 275
  md: '# 12–40 SAIR Linux GNU: Installation and Configuration


    # What about Gnome?


    There is no Gnome equivalent to the KOffice suite. However, Gnome includes a number
    of individual applications that, taken together, form a functional substitute
    for most of the applications in KOffice. These applications include the AbiWord
    document processing application, the Gnumeric spreadsheet application, and the
    Dia diagram editor.


    # DocBook


    DocBook is a large and robust Document Type Definition (DTD) language that defines
    structural and content- SGML and XML markup for computer documentation, especially
    software documentation. The primary hierarchical structures are intended for books,
    articles, and reference entries, such as man pages. DocBook was developed around
    1991 by HaL Computer Systems and O''Reilly & Associates, to filter existing software
    documentation for Unix from the troff markup into SGML. The DocBook format type
    has begun to be supported by many SGML tools and has been used for millions of
    pages of documentation.


    # AbiWord


    Another document processing application is AbiSource'' AbiWord. It works on both
    Microsoft and most Unix platforms, and it supports a large range of file formats
    including AbiWord, DocBook, MS Word, HTML, Rich Text Format, Text, and Zipped
    AbiWord format.'
