- pgno: 292
  md: '# Boot problems


    Common Linux boot problems include:


    +   - Overwritten bootloader in the MBR (see above)

    - Corrupt or missing kernel image

    - Typos in the bootloader configuration file

    - Login problems (While not strictly a boot up, login problems are common, and
    this is as good a place as any to discuss them)


    Before starting any troubleshooting of boot problems, you should have a rescue
    floppy. If you don''t have one, make one now, you need it. While the installation
    CD’s of many of the distributions can be booted in a “rescue” mode, the rescue
    floppy contains configuration details unique to the system and usually perform
    convenient tasks like mounting filesystems.


    # Creating a Red rescue floppy


    You can create a rescue floppy for a Red Hat system with the mkbootdisk command.


    # Creating a SuSE rescue floppy


    You can create a SuSE rescue floppy by copying the kernel image from the installation
    CD to a floppy. Assuming that the floppy is fd0 and that you mount the CD to /mnt/cdrom/boot


    ```

    # cd /mnt/cdrom/boot

    # dd if=rescuefloppy of=/dev/fd0144

    ```


    # How the rescue disk works


    A rescue disk consists of two sections: the compressed kernel image and a RAM
    disk image called initrd. The boot process reads a compressed file system from
    the floppy disk and stores the files in memory (not on a hard disk) through a
    special device driver that makes main memory appear to be a RAM disk. Next, the
    kernel is read into memory and started. The kernel, in turn, mounts the apparent
    RAM disk as the root partition. Thus, from one floppy, a complete stand-alone
    version of Linux is booted. Once booted, the hard disk can be mounted, examined,
    and modified as required.


    # Corrupt or missing kernel image


    This problem is almost always the result of a kernel recomilation gone wrong.
    If you retained a copy of the old kernel and it is still configured in the bootloader
    configuration file, it is a simple matter to select the old kernel at boot time
    and then fix the problems with the new kernel.


    If the problem was a missing kernel image, the most likely cause is an improperly
    constructed bootloader configuration file. Likely problems are simple types such
    as a bad path to the kernel image file, the wrong boot path, etc.


    If the problem was a corrupt kernel image, then either the compilation or the
    creation of the zipped kernel image had problems. The only practical solution
    is to start over building the new kernel.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 13-16 SAIR Linux GNU Installation and Configuration


    # Login problems


    The common login problem is a lost root password. If this hasn''t happened to
    you yet, be patient. It will.


    There are a variety of methods that you can use to reset the root password. All
    require that you have physical access to the system console. On most PC systems,
    this means having access to the keyboard and monitor directly connected to the
    system.


    The most straightforward method of recovering the root password is to boot the
    system into single user mode. In single user mode, you are automatically logged
    in as the root user and can change the root password using the `passwd` command.


    # Getting single user mode from Grub


    You get to single user mode from the Grub bootloader by highlighting the appropriate
    line in the boot menu and typing `e` (for edit). The Grub configuration file entries
    for the boot option will be displayed. Select the line with the word kernel and
    type `e` (for edit). Use the arrow key to get to the end of this line and enter
    the word `single` (leaving a space between the end of the line and single). Enter
    to leave edit mode and return to the Grub screen. When back at the main Grub screen,
    type `b` (for boot). This will boot you into single user mode. At the # prompt,
    use the `passwd` command to change the root password.


    # Getting single user mode from LILO


    If you are using LILO with a Linux distribution, you probably see the graphical
    LILO screen. Therefore, the first order of business is to get to the text prompt
    by entering `CTRL+X` (simultaneously press the Control and the x keys). At the
    boot prompt enter the name of the default Linux boot option and the word `single`.
    If you don''t know the name of the default Linux boot option, hit the TAB key
    to display a list you can select. At the # prompt, use the `passwd` command to
    change the root password.


    # Getting single user mode from a rescue floppy


    Getting to single user mode from the rescue floppy is a true no-brainer. Simply
    insert the floppy, power cycle the system, and wait for the # prompt to appear.
    Then use the `passwd` command to change the root password.


    # Problems connecting across a network


    Network problems can be complex, and the topic of network configuration and troubleshooting
    fills empty shelves at the local bookstore. What we will consider here are the
    most common problems encountered when trying to connect a single system to an
    existing network.


    Basic network configuration and connectivity problems fall into several categories:


    +   - The network interface is not available.


    +   - The network interface is available but not configured or is not active.


    +   - The network interface is available and configured, but you cannot communicate
    on the network.


    +   - The network interface appears to be working, but response is very slow.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'There are some basic tools and utilities that you can use to determine the
    state of the network:


    +   - `ifconfig` (interface configuration)

    - `netstat` (network status)

    - `ping` (send a test message)

    - `traceroute` (trace the path to a network destination)

    - Network configuration programs unique to each distribution


    # Interface not available


    Your first clue that the network interface is not available will depend upon what
    network task you attempt. It may be a web browser reporting that it can''t find
    a web site. You could get a "connect: Network is unreachable" message at the shell
    prompt when attempting to run a network application such as ftp.


    However, these messages could be caused by a number of network problems, the first
    order of business is to determine if the network interface is up and configured.
    The simplest tool for this task is `ifconfig`. (In Exhibit 13-4) you see that
    the only active interface is the loopback. This means that there is no active
    network interface to the external.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_294_0.png)


    > Exhibit 13-4: ifconfig output, network interfaces not active


    It is possible that there was a problem during system boot and the interface failed
    to come up. If your Linux system is configured to display the text console during
    boot up, you can observe the configuration of the network interface during system
    boot. This is usually a message similar to "Bringing up interface eth0." If you
    happened to miss seeing the message or if your system displays a graphical "splash"
    screen instead of the boot messages, you can examine the system messages files
    in /var/log/messages to see if the network interface configuration completed successfully.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# 13-18 SAIR Linux GNU: Installation and Configuration


    The next step is to try bind the network interface manually. The traditional method
    (still used by SuSE) is to execute the network restart script found in the rc
    directories. From the shell prompt, you would enter: [:verify path for]


    ```

    # /etc/rc.init.d/network restart

    ```


    On Red Hats there is a convenient script named service that can be used to restart
    the services in the rc directories (Exhibit 13-5). The syntax is service[name][action].


    ![](img/f850b93901b8bb4c267df1b99fb6de52_295_0.png)


    Exhibit 13-5: ifconfig output after eth0 interface activated


    In this example, the solution was a simple restart of the network. It is usually
    not this easy. Consider this a starting point, stick with the logical troubleshooting
    process, use all your resources, and you will fix the tough problems too.


    # Interface not configured or active


    Sometimes a network restart isn''t enough. In the example above, a network restart
    successfully reconfigured the eth0 interface. However, the system has two network
    cards and only the first, eth0, came up. executing the ifconfig -a command confirms
    this (Exhibit 13-6).'
