- pgno: 279
  md: '# Topic A: The troubleshooting process


    Explanation


    Troubleshooting is, at once, both the simplest and the most complex of tasks.
    The description is simple: find what is broken and fix it. The implementation
    may also be simple; however, it may be excruciatingly complex.


    The purpose of following a consistent, disciplined troubleshooting process is
    to tame the complexity by breaking the problem down into smaller, more easily
    managed parts. This topic presents troubleshooting as a five-step process:


    +   1. Stating the problem

    2. Gathering data

    3. Forming a hypothesis

    4. Testing the hypothesis

    5. Repeating as necessary


    # The problem statement


    The first step in fixing something is to describe the problem as completely and
    in as much as possible. The problem statement should answer the following questions
    (at a minimum):


    +   * What doesn''t work?

    * Does it simply fail to start/function or does it behave improperly or yield
    incorrect or unexpected results?

    * Has it ever worked?

    * If it worked at one time, when did it stop working?

    * What, if any, changes have been made to the system or application since the
    last time it worked?

    * Are there any error messages? If so, when do they occur? Are the error messages
    consistent?

    * Is the problem reproducible? If so, what actions cause the problem to occur?

    * If the problem is not reproducible, is there some pattern to its occurrence?


    While it may seem like overkill for seemingly simple problems, you should always
    put the problem statement in writing. This has two great benefits: it forces you
    to organize your thoughts and observations, and it creates a written record of
    the initial problem and symptoms. Very often the symptoms change as you make changes
    in an effort to resolve the problem. It is easy to get to a point where no one
    remembers what the original problem was. Figuring out which symptoms are due to
    the original problem and which symptoms are new (perhaps induced by your troubleshooting
    attempts) becomes impossible without careful initial documentation.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Gathering data


    As you “fill in the blanks” in your problem statement, you will need to gather
    information about the static state of the system at the time the error occurs.
    This can be challenging at the beginning of the troubleshooting process. The exact
    circumstances that cause the problem to occur may not be understood yet, making
    it difficult to know when to gather error data. The problem may occur without
    error messages or with overt symptoms, forcing you to trace the problem back in
    time to its original occurrence.


    Primary sources of troubleshooting data are error messages that appear on the
    console, terminal or pop-up windows at the time the problem occurs and materialize
    in system log files that collect information about the system and applications.


    # Error messages


    Error messages vary greatly in frequency, accuracy, and the amount of information
    they provide. Error messages are completely dependent on the skill and experience
    of the programmer(s) who wrote the software. When collecting error messages, you
    should always make the exact circumstances that seem to simulate the error.


    In difficult cases, it is often possible to get additional error information by
    turning on so-called “debug flags” in the source code, recompiling the application
    and rerunning it. This is rarely necessary but is a distinct advantage of source.


    # System logs


    Linux systems keep a set of log files that collect console messages, error messages,
    network transactions, and much more. Most system programs and daemons use the
    syslog facility to log their activity.


    Additionally, many programs (system daemons, and application programs) keep their
    own log file or files. These may be kept in /var/log or in some other location.
    The main pages for the application will usually tell you where the logs are kept.
    Another good place to look is in the path for the application.


    The syslog facility is described in greater detail later in this unit.


    # Forming a hypothesis


    Once you have formulated a problem statement and gathered as much relevant supporting
    data as possible, it is time to form a hypothesis. In the context of the troubleshooting
    process we are here following, a hypothesis is simply a “best guess” about the
    probable cause of the problem. This, also, should be written down.


    # How to form a hypothesis


    The best way to begin to understand how you form a hypothesis is to use a simple
    example.


    You just installed a new email application called whizbang. You try to start the
    application by typing the application name at the shell prompt. However, the application
    does not start and you get an error message:


    ```

    $ whizbang

    bash: whizbang: command not found

    ```'
