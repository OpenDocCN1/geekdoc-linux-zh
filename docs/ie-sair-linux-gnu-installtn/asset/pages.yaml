- pgno: 186
  md: '# Red Hat printconf


    Like SuSE 8.0, the default print system on Red Hat 7.3 is LPRng. And, like SuSE,
    Red Hat provides a graphical tool, printconf, to detect and configure printers.
    Red Hat has also “retired” its older printer configuration tool, printool. If
    you type printconf at the shell prompt, printconf will start.


    The printconf can be started from the GUI or from the command line:


    +   - From the start menu on the Gnome desktop, select Programs > System > Printer
    configuration. This starts the GUI tool.

    - From the shell prompt, enter printconf-gui. This also starts the GUI tool.

    - From the shell prompt, enter printconf-tui. This starts the text-mode version
    of the tool.


    Now, try your hand at configuring a printer. Though it is unlikely that your lab
    system will actually have a local printer, you can still manually configure a
    printer.


    # CUPS


    Red Hat version 7.3 offers the added option of CUPS (Common Unix Printing System).
    CUPS has a number of advantages over the LPRng print system:


    +   - Support for IPP (a new printer protocol)

    - Autodetection of network printers

    - Web-based configuration tool

    - Support for PPD printer description files

    - Built-in support for many more types of printers


    To switch from LPRng to CUPS, type the following at a shell prompt:


    ```

    # /usr/sbin/alternative --print

    ```


    When prompted by the script, choose CUPS.


    You will also have to configure the system to start CUPS at each reboot. Use either
    the GUI-based Service configuration tool (Start menu > Programs > System > Service
    configuration) or the text-based ntsys tool, turn lpd off and turn CUPS on.


    You can then use a web browser connected to the URL http://localhost:631 to manage
    CUPS printers.'
  merge: -1
  img_proc: true
