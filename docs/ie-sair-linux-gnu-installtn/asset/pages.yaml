- pgno: 301
  md: '# 13-24 SAIR GNU: Installation and Configuration


    # “Network unreachable” error


    To communicate with hosts outside the local subnet, the host needs a gateway that
    can be accessed within the local subnet. The gateway then routes traffic to other
    networks on behalf of the host system.


    For instance, the typical home network system is an Ethernet LAN connected to
    a router/hub of some sort. If a host system on the local network has an IP address
    of 192.168.1.100 and a subnet mask of 255.255.255.0, then the host can communicate
    directly with hosts in the address range of 192.168.1.1 through 192.168.1.254.
    Any IP address outside of this range must be handled by a router (commonly referred
    to as a gateway).


    If the host is connected to one of the ubiquitous hub/routers found in many offices
    these days, the hub/router will be the gateway. The hub/router is likely to be
    a dhcp server, the host system will probably get its IP address along with DNS
    information automatically via dhcp. In this environment, you should not have to
    perform any manual network configuration.


    However, if something breaks and you get “network unreachable” errors, it is important
    to understand how to determine the host’s routing configuration and to understand
    where to determine the problem may lie.


    The netstat -r command will tell you the current state of the host’s routing configuration
    (Exhibit 13-1).


    ![](img/f850b93901b8bb4c267df1b99fb6de52_301_0.png)


    Exhibit 13-13: netstat -r


    The system shown in Exhibit 13-13 is example of a Linux system on a home network.
    Its IP address is 192.168.1.102 as shown by ifconfig. netstat -r output shows
    that the default gateway is 192.168.1.1. Since this address is in the host’s system,
    the host can communicate directly with the gateway. The TCP/IP client software
    on host system understands that all network traffic directed outside the local
    subnet must be sent to routing.'
  merge: -1
  img_proc: true
