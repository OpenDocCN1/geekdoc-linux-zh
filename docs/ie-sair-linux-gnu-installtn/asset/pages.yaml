    When you are done, enter t again to change the partition type for the second partition.
    Enter 2 when asked which partition you wish to change and enter 83 to specify
    that you wish this partition to be the Linux native partition.


    Finally, press p to view the partition table. Note the three partitions, Linux
    Swap and two Linux partitions. Also note the sizes of these partitions.


    When you are done, press q to quit fdisk. As long as you do not press w, no changes
