- pgno: 188
  md: '# # Topic C: Using removable media


    Explanation


    If you are using the GUI mounting and dismounting removable media such as CD-ROMs,
    floppy disks, etc. it is pretty straightforward and, in most cases, automatic.
    If you are logged in to the shell at the console or at an interactive terminal,
    mounting removable media is a manual process but still relatively simple and straightforward.
    In either case, a basic understanding of Linux device naming conventions is helpful.


    # ## Linux device names


    Linux devices fall into two basic categories: block-structured or block devices,
    and character-oriented or character devices.


    Block devices are random access and buffered. Random access means that it is possible
    to find a particular byte of data by addressing that byte directly. Buffered means
    that data is read and written to a buffer in RAM until some event, usually the
    buffer filling up, the buffer to be emptied. Hard drives, floppies, and CD-ROM
    drives are examples of block devices.


    Character devices are unbuffered and usually serial access. Unbuffered is the
    opposite of buffered. There is no buffer in RAM, and data is sent as it is received.
    Tape drives, serial mice, and keyboards are examples of character devices.


    Devices are named and defined in the /dev directory. Each device has a special
    device file entry in /dev. This file defines the characteristics of the device
    and serves as a synonym for the device.


    Character devices can be accessed via their special device file. For instance,
    if you use the cat command to copy a text file to /dev/printer, the file will
    be directed to the printer and, if the printer is functioning, a printout created.


    Block devices are not usually accessed via their special device file. Before block
    devices are accessed they should be mounted. Mounting is a simple concept. Mounting
    a device associates a name with a filesystem and gives the operating system a
    filesystem to use as a starting point.


    For instance, to mount a CD-ROM you need 3 bits of information: the name of the
    CD-ROM special device file, the name of a mount point, and the filesystem format
    on the CD, IDE and SCSI.


    CD-ROM drives follow the same naming convention as hard drives:


    | Device | Description |

    |---|---|

    | /dev/hda | First IDE drive |

    | /dev/hdb | Second IDE drive |

    | /dev/sda | First SCSI drive |

    | /dev/sdb | Second SCSI drive |'
