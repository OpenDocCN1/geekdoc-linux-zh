- pgno: 147
  md: '# A-1: Command line tools


    # Questions and answers


    +   1 Describe the function of the ls command.


    Lists the contents of a directory (files and subdirectories)


    +   2 What additional information is provided by the ls command when the -l flag
    is used?


    Permission mask, link count, owner, group, last modification time, name of directory
    entry


    +   3 What is the numeric permission mask to read, write and execute permissions
    to the owner of a file and no access to all others?


    +   4 What is the function of the ps command?


    Displays a static snapshot of the system status. The flags passed to it determine
    the output of the command. The most important information includes id (PID), process
    state, the resources the process has used, and the name of the command that started
    the program currently running within the process.


    +   5 How does top differ from ps?


    ps returns a single, static snapshot of system state. top provides a regularly
    refreshed display of system status.


    +   6 A user whose uid is 500 executes the following command: renice -5 1215.
    What will be the result of this command?


    Nothing. No one but superuser (root) can increase a process'' priority. The user
    can only lower priority and only on processes the user owns.


    +   7 You execute the kill 1215 command. The program associated with PID 1215
    does not stop. What can you do to terminate this program?


    kill -9 or kill SIGKILL'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Topic B: GUI tools and utilities


    In addition to the command line tools described previously, there are graphical
    tools available to perform the same tasks. If you are using a system with Windows
    installed and configured, these graphical tools are an alternative to the command
    line tools. Even if you find that you prefer the graphical tools, should know
    how to use the command line equivalents. Sometimes, the graphical tools do not
    provide 100% of the functionality of the command line tool. Also, the command
    line tools are essential in cases where the GUI is not available, either because
    it was not installed or is not working.


    The exact tools that you use will vary depending upon the desktop environment.
    The two dominant desktop environments are Gnome and KDE. Both are described in
    this section.


    Explanation


    # Gnome


    The Gnome desktop environment is the default desktop on Red Hat distributions
    up to version 7.3. (Version 8.0 of Red Hat has a “blended” desktop that attempts
    to merge the best features of Gnome and KDE. The new Red Hat 8.0 desktop is not
    covered in this course.


    # The Gnome desktop


    The Gnome desktop is a complete, customizable graphical environment. In this unit,
    you will learn basic navigational skills. The details of customizing the desktop
    and other advanced features are not covered here.


