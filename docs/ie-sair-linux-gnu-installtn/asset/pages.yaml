- pgno: 31
  md: '# Topic A: Overall system structure


    Linux is a modular, multi-user, preemptive multitasking operating system. These
    are great benefits. We will take a look at these one by one.


    # Six major components


    Modularity is a great benefit because the system can be scaled down to only the
    necessary pieces, reducing system overhead. In this section we will take a look
    at six major components that make up Linux system (as shown in Exhibit 2-1).


    ![](img/f850b93901b8bb4c267df1b99fb6de52_31_0.png)


    Exhibit 2-1: Six major Linux modules


    # The kernel (required)


    The kernel is the core of the operating system that acts as an interpreter between
    the physical hardware and the software. It is the responsibility of the kernel
    to distribute system resources among the software. Because the kernel is necessary
    for the computer to run, it is loaded into main memory and is never swapped out.
    When the system boots, the kernel is the first thing loaded, the kernel passes
    control to init.


    # Init (required)


    Started by kernel boot time, init is the module used by the kernel to initialize
    user space programs. Thus, init is labeled as the father of all programs. init
    checks system-wide configuration files to determine factors such as the default
    run level, services to be initiated for that run level, which ports to open, and
    daemon initialization. init then executes necessary processes.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Linux structural overview 2-3


    # Daemons (required)


    Daemons are system process that run in the background monitoring user input and
    waiting for certain commands and events to be executed before they. When a daemon
    detects its target, it provides services with respect to the given command. Daemons
    do not communicate directly with any user, but remain in the background until
    they are needed to provide a service. A typical Linux configuration employs a
    minimum of 15 separate daemons and may run as many as 50 or more daemons.


    Two examples of typical daemons are:


    +   - telnet (telnet server daemon) — When a telnet request is given, telnet connects
    to the specified port and controls all session negotiations.

    - httpd (hyper text transfer protocol daemon) — When an http request is given,
    httpd initiates the process that fulfills the request.


    # Login, shells, utilities (required)


    Logins, shells, and utilities perform operations that allow for the following:


    +   - access to user accounts

    - environment configuration

    - command execution

    - system and application configuration


    The login utility verifies user names and passwords and grants or denies access
    to the system. Shells access and oversee the execution of user commands. Utilities
    provide user-level services, such as file manipulation, network configuration
    and kernel optimization.


    Linux supports many types of command interpreters (shells), which are similar
    to the shells in versions of UNIX. However, Bash is the default and most commonly
    used shell. The Bash shell has a wide range of commands, configuration options,
    and one of the most extendable programming structures.


    # Network (optional)


    The kernel uses the network module to interpret the data received by networking
    hardware. The network module controls both incoming network traffic from the environment
    and outgoing local user requests for service. It creates the illusion of being
    directly connected to other computers by manipulating these two data streams.


    # The X Window system (optional)


    The X Window system allows the use of a graphical user interface as an option
    to the command line interface. The X Window system acts as a layer between the
    hardware and the applications. The X client and the X server are the two main
    components of the X Window system. The X server controls the video hardware and
    handles all requests made by the X client, or application. One of the most powerful
    features of the X Window system is that the X server and the X client do not have
    to reside on the same machine.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 2-4


    SAIR Linux GNU: Installation and Configuration


    # Single-user vs. multi-user


    Single-user systems could have special programs that allow two physical users
    to be connected to the machine at the same time. This often gives the impression
    that the system is a multi-user operating system, but as far as the operating
    system is concerned there is only one user. Systems of this nature are referred
    to as sequential single-user systems.


    Multi-user operating systems allow several users to run the same applications
    and access the same files simultaneously. The first copy of the file to be opened
    can be edited, and each additional copy opened is a read-only copy. Single-user
    software does not allow multiple users to use the same applications or access
    the files at the same time.


    Linux has its roots in timeshare computing when numbers of users logged into mainframes
    were sharing the processing power of the system. This multi-user capability exists
    in today''s Linux systems and supports multiple simultaneous users both locally
    and remotely.


    # Local multi-user functionality


    One of the programs that init launches is getty. This program is responsible for
    requesting a username and launching the login utility. When the login session
    is terminated init will respawn the getty process.


    An interesting feature of Linux is its use of virtual terminals. A virtual terminal
    allows you to use a single console for more than one login session. In most distributions
    the default configuration will create six virtual terminals. You can access these
    by pressing ALT-Fx from the command line, where x is the virtual terminal number
    that you want. If you are in an Windows system you can press CTRL-ALT-Fx to access
    the virtual terminals.


    This function can be handy for example if you are doing something that cannot
    be interrupted like recompiling the kernel and you need to do another task, you
    can switch to another virtual terminal, login again and complete the other task.
    When you are finished you can switch back to the original virtual terminal that
    you were using.


    This is also useful if a program seems to lock up the machine. In many cases you
    can switch to another virtual terminal, login as the root user and kill the misbehaving
    process without having to reboot the machine.


    # Remote users


    Linux also allows remote users to login through a variety of methods such as login,
    telnet, and ssh. The older protocols, login and telnet, are not secure since they
    pass all of their information in clear text in the network packets. This allows
    anyone on any machine that is on the network of your computer and the remote system
    to use a packet sniffer to capture the packets, open them and read your information.
    This includes your username and password.


    In the early days of networking and the Internet the online population was small,
    and most of those people were trying to help each other so security was not a
    priority. However, today is a different world, and there are many reasons someone
    might desire to get into your computer. Fortunately, Secure Shell, or ssh has
    been developed as a replacement for the old protocols. ssh uses encryption to
    protect all of the data, including passwords, that is sent between your computer
    and the remote host.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Linux structural overview 2-5


    You should always use ssh instead of telnet and rlogin. The only exception would
    be on a completely trusted network, but then ssh is still recommended. Keep in
    mind that most security break-ins come from inside the company, not outside.


    When a user connects to a remote machine using any of the remote protocols and
    issues a command, that program runs on the remote machine using its processor
    and memory resources. The output of the command is displayed on the local machine.
    To the user, it looks like the program is running locally, but it is not using
    local resources.


    Usually the root account is not allowed to connect remotely as an added layer
    of security. However, this default behavior can be changed, or you could use a
    command that lets you switch user accounts once you are logged in and use that
    to switch to the root account, if you know the password. When you are logged remotely,
    you can do all of the things that you normally do at the local terminal, even
    recompile the kernel.


    # Multitasking


    A multitasking system has the ability to execute more than one task, or process,
    simultaneously. There are two basic ways that multitasking is handled in an operating
    system, cooperative multitasking and preemptive multitasking.


    # Cooperative multitasking


    In a system that is cooperative multitasking, each process must voluntarily give
    up control of the CPU in order for other processes to have access. This relies
    on each process cooperating with the others. If a process that has control of
    the CPU hangs, the whole system will hang as well since the process cannot give
    up control.


    Cooperative multitasking was used in the older Macintosh System 7 and Windows
    3.x systems.


    # Preemptive multitasking


    The operating system controls which processes have access to the CPU in a preemptive
    system. The operating system gives each process a time slice on the processor.
    The amount of time given can be adjusted based on the priority of the process.
    If the operating system needs to use the CPU it can preempt, interrupt, the running
    process. If a process hangs, it will not affect the other processes. This is a
    much better method of multitasking.


    Preemptive multitasking is used in Linux as well as most other operating systems
    in use today.'
  merge: -1
  img_proc: true
