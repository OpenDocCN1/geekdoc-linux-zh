- pgno: 191
  md: '# 9-26 SAIR Linux GNU Installation and Configuration


    ![](img/f850b93901b8bb4c267df1b99fb6de52_191_0.png)


    # Using shell tools to mount and access removable media


    You use the command to mount removable media at the shell prompt. The following
    command mounts a CD-ROM from the shell:


    ```

    $ mount /dev/cdrom /mnt/cdrom

    ```


    You use the command to unmount removable media:


    ```

    $ umount /mnt/cdrom

    ```


    The same commands used to mount removable media are used to mount filesystems
    on hard drive partitions. The file, /etc/fstab, controls which filesystems are
    mounted on which partitions.


    # Mounting foreign filesystems


    To mount a remote file system, the -t option is used with mount. For example,
    a disk formatted with the FAT32 or VFAT file system can be mounted with the following:


    ```

    $ mount -t vfat /dev/fd0 /98floppy

    ```


    The -t option was used to specify the type of file system being mounted, and the
    mount point was chosen to reflect this. If the filesystem type is designated in
    the /etc/fstab file, it does not have to be specified in the command line. For
    a complete listing on the different file systems that can be mounted, check the
    man page for mount.


    Another option for dual-booted machines is being to mount a FAT or FAT32 partition
    into your directory tree. This makes the data on partition usable both in Windows
    sessions as well as Linux sessions.


    For example, a partition on the same machine formatted with the FAT32 or VFAT
    file system can be mounted with the following:


    ```

    $ mount -t vfat /dev/hda7 /mnt/windows_d

    ```'
  merge: -1
  img_proc: true
