- pgno: 225
  md: '# Topic A: Installing applications from source code


    Today, most Linux applications (the kernel) are available in packages: bundles
    of programs and files, usually representing a single program, whose installation
    is automated. Packages and package managers are discussed later in this unit.


    However, for the first few years of Linux'' existence, all application programs
    (and the kernel for that matter) were distributed in source format. Some programs
    are still distributed in source format. Programs distributed in source format
    must be compiled and linked before they can be used. The end of the compilation
    and linking process is a binary (executable) program. (Some applications are distributed
    in binary format.)


    # Why bother with binary and source format programs?


    A Linux package contains the binary (executable) program or programs that implement
    a particular application. The package may also contain required configuration
    files, libraries and other files. Since a package is complete and automated, why
    bother with applications that must be compiled and linked?


    +   - There may not be a packaged version of the program you want or need. This
    is usually because the developer does not want to spend the extra time and effort
    needed to create the packages and test them

    - In some cases, even if there is no package there is a binary version of the
    application. If the program runs entirely in user space and does not rely on particular
    versions of system run the binary version should work just fine. However, if the
    program has run time library dependencies or runs partially or wholly in kernel
    space, the binary version will probably only work with a specific distribution
    or a specific kernel version. In this case, compiling and linking the program
    from source may enable you to run the program on your system.

    - Some programs have compile time (as opposed to run time) options that can only
    be modified by recompiling and relinking.

    - If you need to modify the program, then editing the source code and recompiling
    and relinking is the only option. The most common reason for modifying the source
    code for a program is to find and/or fix a program bug. This is one of the real
    benefits of Linux and open source software. (Most developers leave debug switches
    in their code. Often, all that is needed to track down a problem is to enable
    the debug flag in the source code, recompile and relink and run the program, noting
    any error messages produced by the debug code.)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Installing applications from source code


    Installing application programs from source code involves several steps: the source
    code (and, optionally, extracting the code from an archive), compiling the application,
    installing the application, and, finally, configuring and testing the application.


    # Getting the application code


    The most common source for binary or source code formats is the Internet.

    One particularly rich source of Linux applications is Source Forge (http://sourceforge.net).
    Source Forge is a developer repository. If you are interested in new, often bleeding-edge
    applications, this is your site.

    Another well-populated site for active application projects is www.freshmeat.net.

    A good source for interesting Linux documentation and news as well as links to
    applications is www.linux.org.

    Now that you know what to do and where to look, let''s take an example and learn
    how to do it.


    # Working with sample source code


    Network protocol analyzers are highly useful tools. They are capable of capturing
    all and packets on a network, interpreting and displaying the packets by protocol
    type, and extracting the data from the packets. Purpose-built network analyzers
    cost many thousands of dollars. Linux users, however, don''t have to spend a cent
    on a network analyzer. At www.ethereal.com you can find the ethereal protocol
    analyzer application, free for download.

    Using either a web browser or ftp, you can copy the latest version of ethereal
    to your system. (The safest place to save the tar archive is /tmp.)


    # Extracting the source files


    Once the source code is downloaded, the next step is to extract the files from
    the archive. The source files are almost always in a tar archive and often the
    archive is compressed using one of several file compression formats.

    Tar archives are commonly referred to as "tarballs" or, simply, tar files.

    By convention, simple, uncompressed tar archives have the .tar extension. Also,
    by convention, tar archives in the gzip format have the extensions .targz or simply
    .tgz. Other zip formats include bzip and zip (the familiar MS zip format).

    Remember that file extensions have no meaning to the Linux operating system other
    than to suggest an application to use when opening the file from a GUI application.
    A tar archive could just as easily be named foo.bar or myprogram.exe. The only
    effects of not following the file naming conventions are to make the files less
    "human readable" and to negate the convenience of having the proper application
    launch when a file name is "double clicked" from a Linux GUI.

    The basic format of the tar command to extract and uncompress a gzipped tar archive
    is:


    ```

    tar xzvf source.tgz

    ```'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 11-4 SAIR Linux GNU: Installation and Configuration


    Breaking this down:

    1 tar is the command.

    2 xvzf are flags.


    +   * x tells tar to extract files (take files of the archive as opposed to creating
    a new archive and placing files in the new archive).

    * v is the verbose flag.

    * z tells that the archive is compressed and to uncompress the files before extracting.

    * f is the file flag, telling tar that the following argument (source.tgz) is
    a file name or path.


    source.tgz is the file name of the tar archive to be extracted.

    Using the example above, you would extract the ethereal archive with:

    tar ethereal-0.9.8.tar.gz


    You need to be aware of the behavior of tar regarding the location of the extracted
    files. In most cases, the files will be extracted to the current directory or
    a subdirectory created in the current directory. However, tar archives can be
    created to save the extracted files to a directory specified by archive. This
    location is totally arbitrary and is under the control of the person who created
    the archive. The easiest way to check the files and directory structure within
    a tar archive is to use the “t” flag. The following command will list all the
    files, including the directory structure, in the ethereal archive:


    ```

    tar tvzf ethereal-0.9.8.tar.gz

    ```


    # Compiling and installing the application


    The first step in the process of compiling and installing an application from
    source is to read the documentation. At a minimum, the developer will have provided
    a README or README.FIRST. (There may also be a file called INSTALL with instructions
    for the installation and/or operating system instructions such as README.linux
    for applications that span multiple UNIX and UNIX-like systems.) These files contain
    instructions on the exact sequence of steps to follow to compile and move the
    files to their proper locations.


    make


    The process of compiling and linking programs is controlled by the make utility.
    A configuration file, named Makefile, controls the behavior of make. make is a
    complex utility and is well beyond the scope of this course. Fortunately, most
    application source packages come with a shell script to automate the process.
    usually named configure. This script reconfigures the Makefile to fit your system.
    There are two common ways to invoke the configure script:


    +   * ./configure

    * As an argument to the make command

    # make config


    Again, the README or INSTALL file will tell you which method is to be used.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'One the configure script has customized the Makefile, it is time to compile
    and link the application. The README or INSTALL file will instruct you to issue
    one or more commands and will specify any arguments that should be supplied to
    the command(s). At a minimum, there will be one command to compile and link the
    application:


    ```

    # make application_name

    ```


    # Installation


    Installing the application starts with the deceptively simple-sounding task of
    moving the application files to their proper destinations.


    +   The binary file (or files) created by the compilation and link process can
    be copied to any of the locations (/bin, /usr/bin, etc.) but the convention is
    to place source application binaries in /usr/local/bin. This keeps the source
    separate from the applications installed and managed by one of the package managers
    (for instance, rpm).


    +   Configuration files should be copied to the user''s home directory or to one
    of the conventional locations for configuration files: /etc, /var, etc.


    +   Program documentation should be copied to appropriate locations. The man pages
    have conventional locations. Other documentation such as html files may be copied
    anywhere that is convenient.


    If the application is a device driver or other kernel-space program, it may be
    necessary to link the module(s) to the kernel. If so, this step will probably
    be accomplished with a make command and the documentation will instruct you on
    steps to take.


    # Configuring and testing


    The final step is to configure and test the application. If the application has
    one or more configuration files, the documentation will tell you which file or
    files must be modified. Also, if there is a utility program to configure the application,
    that program will also be specified in the documentation.


    This activity allows you to practice actually installing an application from source
    code. The specific example program is a network packet sniffer called ethereal.
    Your your instructor will tell you whether the source tarball should be copied
    from the ethereal web site, copied from a location on the classroom network, or
    if a substitute source format program is to be used as an example. No matter which
    source code is used, the basic steps are the same.'
  merge: -1
  img_proc: true
