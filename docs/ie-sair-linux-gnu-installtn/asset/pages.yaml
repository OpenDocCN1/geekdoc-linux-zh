- pgno: 130
  md: '# Topic B: Getting help online


    Explanation

    There are many places to find help online. This section will introduce you to
    a few of them.


    # The Linux Documentation Project


    The Linux Documentation Project can be found at www.tldp.org. It provides links
    to an abundance of Linux documentation. The information is divided into categories
    based on how the information is presented.


    | Category | Description |

    |---|---|

    | Guides | Long, in-depth online books about various Linux topics. |

    | HOWTOs | Topic specific on configuring or using Linux. |

    | FAQs | Frequently asked questions with answers on various Linux topics. |

    | man pages | HTML version of manual pages for many Linux applications and programs.
    |


    HOWTOs and Mini-HOWTOs

    Linux HOWTOs and mini-HOWTOs are detailed descriptions of how to perform a specific
    task using a specific program. In general, mini-HOWTOs are shorter than regular
    HOWTOs. These documents are available in various formats, including plain text,
    HTML, PDF, PostScript, and SGML. At the LDP Web site, HOWTOs are organized by
    category and alphabetically.


    Guides

    Guides are more in-depth than HOWTOs. Since guides may be hundreds of pages long,
    they are also referred to as books. Guides include topics such as Linux installation,
    the kernel, network administration, and security.


    FAQs

    FAQs are frequently asked questions with answers. FAQs attempt to answer some
    of the most common questions about a specific topic. On the LDP Web site, links
    to FAQs are in plain text, HTML, and PostScript.'
  merge: -1
  img_proc: true
