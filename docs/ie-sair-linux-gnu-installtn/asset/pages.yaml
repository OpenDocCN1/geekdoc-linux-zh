- pgno: 36
  md: '# Topic B: The Linux file system


    Linux structural overview 2-7


    Explanation


    A file system is a detailed set of conventions for the arrangement of data on
    a disk. The conventions define how data is stored to and read from a hard disk.
    It is important to understand the structure of the Linux file system and some
    basic usage conventions.


    # File system structure


    A raw hard disk is not normally usable by the operating system. The disk must
    first be organized into one or more partitions. Each partition, or volume, must
    then be formatted with a file system.


    File system objects


    The main repository for information on all UNIX-like machines is the file tree,
    all of stem from the root (/) directory. This file tree is nothing more than a
    hierarchical set of directories, which in turn may contain file system objects
    (FSO). File system objects reside on file systems that can be mounted and unmounted
    on file tree directories. Let''s look at the seven file system object types:


    | FSO | Example |

    |---|---|

    | Regular file | /home/torvalds/myfile |

    | Directory | /etc/ |

    | Symbolic link | /dev/mouse --> /dev/psaux |

    | Block device | /dev/had |

    | Character device | /dev/psaux |

    | Socket | /tmp/ksocket_torvalds/kdeinit:-0 |

    | Named Pipe | /var/run/xdmctl/xdmctl:-0 |


    A regular file is simply a collection of stored information accessed by a file
    name. This includes data and program files. A directory can contain other directories
    or any of the other file system object types. A symbolic link is just a pointer
    to another file system object. A block device is an abstraction to the hardware
    block devices such as hard drives and floppy drives. A character device is an
    abstraction to the hardware devices such as a mouse. A socket is a mechanism for
    exchanging data between processes. A named pipe is also used for interprocess
    communications, but it does not require the two programs to be designed to work
    together. Named pipes are also sometimes referred to as FIFO, for “first in, first
    out”, which is the method by which the pipe handles the data.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# SAIR Linux GNU: Installation and Configuration


    # File system abstractions


    A file system abstraction is a file system object that is located in a pseudo
    file system. The proc file system is a pseudo file system that reports the status
    of programs, device drivers, and kernel-internal events. Access to this pseudo
    file system, or system abstraction, is obtained through the /proc directory. In
    other words, displaying the contents of a file through the /proc directory does
    not switch hard disk volumes switches to a kernel that shows system status as
    a series of directories and files.


    | Abstraction | Description |

    | --- | --- |

    | /proc | Provides direct access to kernel status routines |

    | /dev/xxx0 | Provides direct access to device xx0 |

    | /dev/null | Returns End of File when read and ignores all input written into
    |

    | /dev/zero | Returns any number of characters requested but they are always the
    zero character |


    # Filesystem Hierarchy Standard


    A hierarchical file system organizes files into directories, a tree-like structure.
    Over the years various UNIX systems and Linux distributions have modified the
    file and directory organization. These differences can cause interoperability
    issues with applications, scripts, utilities and development tools that are used
    across the systems. To combat this problem, the Filesystem Hierarchy Standard
    (FHS) was developed as a set of requirements and guidelines regarding the file
    system (as shown in Exhibit 2-2). The FHS can be found at www.pathname/rhs.


    > Exhibit 2-2: Filesystem Hierarchy Standard'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Linux structural overview 2-9


    The FHS is just a piece of the overall effort of standardization that is known
    as the

    Linux Standard Base (LSB). Over 20 businesses and organizations including, Debian,

    Red Hat, Hewlett-Packard, IBM, and Intel support the LSB. You can get more

    information about LSB at www.linuxbase.org.


    # Using the file system


    Users often need to access data stored in file systems of removable media (floppy
    disks,

    zip disks, CD-ROMs, etc.). To access these file systems along with any file

    system, the device containing the file system must be mounted, which is done with
    the

    mount command.


    # Monitoring the file system


    The mount command tells where to place files in the directory tree and displays

    all mounted file systems. Some might get the idea that the mount command mounts

    devices; however it mounts file systems contained on devices. See the following

    example, which mounts a CD-ROM to the /mnt/cdrom /cdrom directory.


    ```

    $ mount -t iso9660 /dev/hdb /mnt/cdrom

    ```


    The -t option specifies that a file system type is specified. The iso9660 file
    system

    type is the file system contained on many CD-ROMs;/dev/hdb /mnt/cdrom

    specifies that the second IDE block device will be mounted in the directory tree
    at

    virtual point /mnt/cdrom. If an entry was placed in the /etc/fstab file for

    CD-ROM then the following command could be used to mount the CD-ROM:


    ```

    $ mount /mnt/cdrom

    ```


    Note: To see which file systems are available for mounting, refer to the

    /proc/filesystems file. The following can be used:


    ```

    $ cat /proc/filesystems

    ```


    The unmount command is used to unmount a file system.


    # The /etc/fstab command


    Normally only root can use the mount command to mount a file system. The file
    system

    table,/etc/fstab,is utilized to give users the ability to mount specified file
    systems,

    default default mount points, and simplify use of the mount command. The following
    is

    /etc/fstab file:


    | /dev/hda3 / ext2 defaults 1 1 |

    | /dev/hdb1 /boot ext2 defaults 1 2 |

    | /dev/cdrom /mnt/cdrom iso9660 noauto,user,ro 0 0 |

    | /dev/hda4 /usr ext2 defaults 1 2 |

    | /dev/fd0 /mnt/floppy auto noauto,user 0 0 |

    | none /proc defaults 0 0 |'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 2-10 SAIR Linux GNU Installation and Configuration


    From left to right, each column represents the following respectively:


    +   * File system name of the block device

    * Mount point for the file system

    * File system type

    * Mount options (default is rw)

    * Dump frequency

    * File system check order


    Specify noauto for the mount option if you do not want the file system mounted
    at startup. The user mount option allows normal users the ability to mount that
    file system.


    # Absolute and relative paths


    Linux follows the UNIX tradition of employing hierarchical file names, in which
    a path specifies the target file. The path contains a starting point, optional
    directories, and the file name. Two types of paths are absolute and relative paths.


    # Absolute path names


    Absolute path names always start with a slash (/) and give the full path:


    ```

    /home/duke

    ```


    The first forward slash (/) means the beginning or root directory. Subsequent
    forward slashes (/) separate directory names and the file name.


    # Relative path names


    Relative path names are relative to the present directory and never start with
    a slash (/).


    For instance, by typing the pwd command, the present working directory is returned:


    ```

    /home/duke

    ```


    Typing cd home will return an error because the home directory is the parent directory.
    Type cd to return to the home directory. However, typing cd from the directory
    /home/duke will take the user directly into the mail directory because mail is
    a child directory of /home/duke. In contrast, typing cd /mail would not work because
    the system would try to find a mail directory that was the direct child of root
    (/).'
  merge: -1
  img_proc: true
