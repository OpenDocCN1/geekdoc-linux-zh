- pgno: 193
  md: '# Topic D: System monitoring


    Explanation System and network monitoring are the subjects of numerous books.
    Here we are limited to a brief review of some of the more useful tools for capturing
    the status and configuration of the storage system and the network.


    # Using shell tools to monitor disk usage


    Two tools are commonly used to check the state of the hard drives on the system:
    df and du.


    df


    The df command displays the hard drive partitions, the total space on the partition,
    how much of the space is used, how much is available, the space in use as a percent
    of the total, and the mount point for the partition:


    ```

    $ -h

    Filesystem 1lk-blocks Used Available Use% Mounted on

    /dev/sda3 16G 4.6G 10G 30% /

    /dev/sda1 97M 8.8M 83M 10% /boot

    one 283M 0 282M 0% /dev/shm

    /dev/sdb1 17G 5.8G 10G 37% /var

    ```


    Note that the disk space is displayed in kilobytes. You may find that the -h flag
    makes the display more readable:


    The filesystems mounted at boot time are controlled by the configuration file
    /etc/fstab. (After the system has booted, the mount -a command will also read
    /etc/fstab and mount all the filesystems listed there.) If a filesystem does not
    have an entry in /etc/fstab, it will not be mounted at boot time; a mount -a command
    will not mount the filesystem; and the filesystem will not be seen in the df command''s
    display.'
  merge: -1
  img_proc: true
