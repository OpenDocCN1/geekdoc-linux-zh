- pgno: 303
  md: "# 13-26 SAIR GNU: Installation and Configuration\n\n# Poor network response\n\
    \nPoor network response is a very subjective problem statement. To be certain\
    \ that the network response is a problem, you really need to take snapshots of\
    \ the response at regular intervals for a number of days. However, performance\
    \ tuning is beyond the scope of this code.\n\nPoor network performance can be\
    \ the result of a high packet error rate. Bad packets have to be retransmitted,\
    \ and this adds overhead and delay to network transfers. High packet error rates\
    \ are usually the result of hardware problems, either on your system (with the\
    \ NIC being the prime suspect) or on the network.\n\nTo determine there are packet\
    \ errors on your system, first run netconfig on each interface and look for:\n\
    \n```\nnetconfig output:\n[root@host1]# ifconfig\neth0\n    link=Ethernet  Mask=00:00:5e:d8:81:c5\n\
    \    inet=192.168.1.102  Mask=255.255.255.0  Metric=1\n    UP BROADCAST MULTICAST\
    \ RUNNING MTU=1500\n    rx packets=25 errors=0 dropped=0 overruns=0 carrier=0\n\
    \    collisions=0\n    tx packets=13 errors=0 dropped=0 overruns=0 carrier=0\n\
    \    rx bytes=7846 (7.6 KB) tx bytes=4508 (4.4 KB)\neth1\n    link=Ethernet  Mask=00:00:5e:d8:81:e4\n\
    \    UP BROADCAST MULTICAST MTU=1500  Metric=1\n    rx packets=25 errors=0 dropped=0\
    \ overruns=0 carrier=0\n    collisions=0\n    tx packets=10 errors=0 dropped=0\
    \ overruns=0 carrier=0\n    rx bytes=3296 (3.2 KB) tx bytes=3296 (3.2 KB)\n```\n\
    \n```\n[root@host1]# ifconfig -a\n```\n\nExhibit 13-15: ifconfig -a\n\nThe lines\
    \ with RX packets (received packets) and TX packets (transmitted packets) are\
    \ where you should look. Non-zero values in errors, dropped, overruns, frames,\
    \ or carrier are for concern.\n\nNext, try ping a system. The -q flag suppresses\
    \ the output of a line of text for each ping. Only the summary of the ping is\
    \ shown, is of some concern. However, on heavily loaded networks, a packet loss\
    \ rate up to about 5% is probably ok.\n\n```\n# ping -q 204.152.189.116\nping\
    \ -q 204.152.189.116\nping 204.152.189.116 (204.152.189.116) from 192.168.1.102\
    \ :\n    56(84) bytes of data.\n\n--- 204.152.189.116 ping statistics ---\n  \
    \  9 packets transmitted, 9 received, 0% loss, time 8080ms\n    rtt min/avg/mdev\
    \ = 8.121/12.015/28.613/6.168 ms\n```"
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Resources


    There are a variety of resources at your disposal to ask questions, get ideas,
    learn how things are supposed to work, and just to find a sympathetic ear.


    +   * Other Linux users at your place of work or among your circle of friends
    can be a valuable resource.

    * Most cities have a local Linux Users Group. Contact them, join, and participate.

    * There are also the Usenet news groups. Some news groups are sponsored by the
    Linux distributors and are linked to the distributors'' web sites. Other valuable
    Linux news groups are the comp.os.linux news groups.

    * If the problem is with a device driver or application, try contacting the developer.
    Most open source programs contain the developer contact information in the source
    code.

    * The Linux HowTos are extremely useful. If there is a HowTo that discusses the
    application or activity that is failing, spend some time reading the HowTo. The
    entire list of Linux HowTos is available in various places on the Internet.

    * Finally, if you purchased Linux from one of the distributors, you are probably
    entitled to some amount of free support via phone and/or email.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "# 13-28 SAIR Linux GNU: Installation and Configuration\n\nDo it!\n\n# C-1:\
    \ Solving some common problems\n\n# Questions and answers\n\n+   1 What are some\
    \ of the steps you can take to resolve problems with devices?\n  * Determine if\
    \ the device is supported by Linux.\n  * Load the driver manually.\n  * Check\
    \ the configuration files.\n\n+   2 Where are Linux modules found on a Red Hat\
    \ Linux system?\n  * /lib/modules/(kernel-version)/kernel/drivers\n\n+   3 You\
    \ have just performed a Red Hat Linux 7.3 Workstation installation. The system\
    \ had an existing Windows XP installation. After installing Linux, the XP installation\
    \ seems to have disappeared. Why?\n  The Workstation installation repartitioned\
    \ the disk and wiped out the XP installation.\n\n\n+   4 You install Microsoft\
    \ Windows on a system with a pre-existing Linux installation. You are careful\
    \ to install Windows in a partition you created for it prior to the Windows installation.\
    \ After Windows is installed, you reboot and find that you can't boot Linux. What\
    \ happened and how do you fix it?\n  The bootloader was overwritten in the MBR.\
    \ With LILO, make sure that lilo.conf is correct and run it lilo. With Grub, make\
    \ sure that grub.conf is correct and run grub-install.\n\n+   5 What are the basic\
    \ steps in recovering from a lost root password?\n  Boot into single user mode\
    \ and use the passwd command to set the root password. To get to single user mode,\
    \ boot from the rescue floppy or the installation CD (rescue option).\n\n+   6\
    \ List some essential tools and utilities for troubleshooting network problems.\n\
    \  ifconfig, netstat, ping, traceroute, the Red Hat and SuSE network configuration\
    \ tools\n\n+   7 How can you restart the network from a shell prompt on a SuSE\
    \ Linux system? On a Red Hat system?\n  * /etc/rc/init.d/network restart\n  *\
    \ service network restart (but the SuSE works on Red Hat too)\n\n+   8 What does\
    \ an unknown host error indicate? What are some steps you can take to analyze\
    \ the problem?\n  The error indicates that the host name used in a network connection\
    \ request cannot be resolved to an IP address. Steps for analyzing the problem:\n\
    \  * Look at /etc/etc/resolv.conf to ensure that the nameserver addresses are\
    \ accurate.\n  * Try pinging the nameservers.\n  * Use nslookup, or dig to test\
    \ the name lookup.\n  * Check /etc/hosts and /etc/hostconf."
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Unit summary: Troubleshooting


    Topic A


    In this topic you learned a logical, **five step troubleshooting process**: formulate
    the **problem statement**, collect **error** and **system state data**, form a
    *hypothesis*, **test the hypothesis**, and **repeat** the process until it is
    solved.


    Topic B


    In this topic you learned some of the places to **find error** and **system state**
    data and some tools that making this data easier. You learned that error and status
    messages are sent to the **console** or **terminal** and to **log files**. You
    learned that many of the important log files are stored in `/var/log`. You learned
    about the **syslog** facility. You learned the function and location of important
    system and network configuration files such as `/etc/initittab`, `/etc/stab`,
    and the `rc` scripts.


    Topic C


    In this topic you learned about some of the **error prone areas** of Linux (and
    other operating systems). You reviewed some of the **common error messages** and
    of the common **installation mistakes** and **incorrect configurations** that
    cause these errors.


    # Independent practice activity


    +   1 Log into your lab system as root. Change directory to /. Execute the **ls**
    and **df** commands and write down the output.


    +   2 Using the installation CD that your instructor provided, boot your lab system
    into single user mode.


    Insert the CD, reboot, and at the boot: prompt, enter "linux rescue".


    +   3 After the system boots, you will see a screen that has three options: Continue,
    Read-Only, and Skip. Read the instructions on this screen, then choose **Continue**.


    +   4 Next, you will see a screen that tells you that you can make /mnt/sysimage
    your system root environment with the chroot /mnt/sysimage command. Continue from
    this screen.


    +   5 Finally, you will be at a shell prompt. Execute the **ls** and **df** commands.
    Compare the output to what you saved in step 1. What differences do you see?


    Filesystem mounts are much different. The directory structure under / generic
    and has none of the changes made during or subsequent to system installation.


    +   6 Execute the **whoami** command. Which user are you logged in as?


    root


    +   7 Execute the **chroot /mnt/sysimage** command. Now execute the **ls** and
    **df** commands again. Compare the output to what you saved in step 1 and what
    you saw in step 5 (the output should still be on the screen). What differences
    do you see?


    Now you should see the same mounts and the same directory structure you saw in
    step 1.'
  merge: -1
  img_proc: true
