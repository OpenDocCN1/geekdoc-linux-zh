- pgno: 118
  md: '# Aliases and variables


    Aliases are used to make entering commands easier for the user. Variables are
    used to hold information so that it can be used more than one time.


    # Aliases


    Even the experienced Linux realizes that simple commands can become harder to
    remember when switches are added to them. This is where the convenience of command
    aliases becomes important. Shortcuts while in the shell can be a major timesaver,
    especially when doing a lot of work with different files and directories.


    Command aliases provide the ability to connect an easy-to-remember name to a more
    complicated command.


    The ability to set certain strings to perform other functions is very important
    when working across several different platforms. DOS or Windows users will fill
    up the Linux shell prompt, backspacing over their mistyped commands. Setting a
    couple of simple aliases can increase their comfort level immensely.


    For example, as a user wants to see a full (long) directory listing every time
    the ls command is typed. Using aliases, this can be accomplished as follows:


    ```

    alias ls=''ls -l''

    ```


    After this alias is created, each time the ls command is typed, the output will
    be the same as if the ls -l command had been entered.


    To remove this alias, simply type:


    ```

    unalias ls

    ```


    Here are some examples of commonly used aliases:


    ```

    alias ..=''cd ..''

    alias ...=''cd ..//''

    alias dir=''ls -/''

    alias l=''ls -al''

    alias la=''ls -la''

    alias l11=''ls -1''

    alias ls=''ls $LS_OPTIONS''

    alias ls-1=''ls -1''

    alias md=''mkdir -p''

    alias c=''less''

    alias rd=''rmdir''

    ```


    Aliases are normally user-account specific, but a system administrator can define
    system-wide aliases in the /etc/bashrc file.


    If a command behaves in an unexpected fashion, use the backslash (\) to escape
    any aliasing. Thus, the command \ls would perform a simple ls command and ignore
    the alias.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Shell variables


    The environment is defined by a set of parameters that govern the look, feel,
    and interactivity of a shell, and can be customized. An environment variable is
    similar to a shell variable; they are both strings. An environment variable is
    passed to a child process for program initialization. A difference between shell
    variables and environment variables concerns their visibility both within and
    outside of the shell program.


    Environment variables are global variables, since every shell program has access
    to them. Shell variables are local variables; their visibility is restricted to
    the particular shell in which they are located.


    A common practice is to use all uppercase letters for environment variables and
    mixed case for shell variables. Shell variables can consist of letters, digits,
    and underscores, but they cannot begin with a digit, such as numbers and hyphens.
    Uppercase letters are commonly used to specify built-in variables and exported
    variables. Users create variables and assign values to them using the following
    syntax:


    ```

    varName=''abcdef''

    ```


    A variable that is established and used inside one shell will not be accessible
    by another shell, unless it has been exported via the export command. Consider
    the following example:


    ```

    export varName

    ```


    The variable, varName, has been exported and will now behave like an environment
    variable, that is, the value of the variable will be copied to any subsequent
    shell. Shell variables can also be specified as read-only, so that they cannot
    be changed by accident.


    When assigning a value to a variable, only the variable name is used. However,
    when you need to use the value of a variable the variable name must be preceded
    by a dollar sign ($). You can use the echo command to display the current value
    of a given variable:


    ```

    echo $varName

    ```


    Versions of bash 2.0 and higher come with a built-in command called shopt, which
    is a shell configuration tool. Two of the options are cdspell and nocaseglob.
    When the cdspell option is set, bash automatically correct minor errors in spelling
    of directories, when a user performs the cd command. The nocaseglob option will
    cause the bash shell to switch to a non-case sensitive mode, when dealing with
    filename expansion. A full list of options can be viewed by typing shopt. You
    can set shell options by entering shopt -s option or unset options with shopt
    -u option.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Path variables


    The PATH variable is assigned a value that consists of list of colon (:) separated
    directory paths. This is the same directory list in which the shell will search
    for an executable file, when the shell is instructed to run a Program. To display
    path variable settings, using the echo echo command:


    ```

    echo $PATH

    ```


    Using this command should result in an output that is similar to the following:

    If a user was in his home directory and wanted to run a program in /usr/bin, it
    could be accomplished in several ways. One possibility is to explicitly call the
    program with the full name:


    ```

    /usr/local/bin:/usr/bin:/usr/home/username/bin

    ```


    Another possibility is to include /usr/bin in the path, and type myProgram at
    the command line to have the shell search all the directories contained in the
    $PATH variable for the executable. Note that the current directory is not normally
    part of the default path. A program must be called with the full path to the program
    or the program name can be used alone if the program exists in the user''s path.
    A security feature to prevent trojan horse programs from affecting the system.
    A shortcut to execute a command in the current directory that is not in your path
    is to use a dotslash (., /) to represent the current directory like this:


    ```

    ./myProgram

    ```


    Along with the PATH variable, there are several other environment variables that
    are commonly used.


    | Variable | Description |

    | $USER | The username of the current user. |

    | $UID | The userid of the current user. |

    | $SHELL | The current shell. |

    | $HOME | The home directory of the current user. |

    | $DISPLAY | The location of the display device. |

    | $HOSTNAME | The hostname of the machine. |


    This is not an exhaustive list. Your system may use many more environment variables
    than listed here.'
  merge: -1
  img_proc: true
