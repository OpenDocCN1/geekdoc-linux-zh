- pgno: 74
  md: '| Resolution | Video memory | Horizontal refresh | Vertical refresh |

    | --- | --- | --- | --- |

    | 1024x768x32K | 1.58 MB | 81.2 KHz | 76 Hz |

    | 1024x768x16M | 2.36 MB | | |

    | 1152x864x16M | 2.99 MB | | |

    | 1280x1024x16 M | 3.94 MB | | |

    | 1600x1200x16 M | 5.76 MB | | |


    This table demonstrates several standard graphic mode features:


    +   - The higher resolution, the greater amount of video memory required to hold
    the information.

    - The higher resolution is for a given refresh rate, the faster the monitor must
    sweep the display horizontally.

    - The vertical sweep rate (refresh rate) tends to increase with resolution. However,
    refresh rates are independent of a particular resolution.


    # The monitor


    Setting up a monitor is not as simple as plugging in the power and video-in cords.
    Several configuration issues and parameters must be taken into consideration concerning
    the monitor. If these issues are not addressed appropriately, one risks serious
    damage to the monitor. This section discusses several important facets of monitor
    configuration.


    # Monitor refresh rates


    A monitor''s display is painted with an electron gun, driven by a raster-scan
    circuit. The gray sweeps from top to bottom, row by row. The total display area
    is ideally covered a minimum of 60 times per second. In other words, the total
    display area is refreshed 60 times per second. If the graphic mode has a low enough
    resolution, the monitor will have time to refresh the display more often. If the
    standard mode does not utilize this, you can compute your own graphic mode to
    get a higher refresh rate. Refresh rates of 60 times per second makes the monitor
    easier to read. A refresh rate of 70 or more times per second makes the monitor
    easier to read. The temptation is to set the refresh rate as high as possible,
    but the refresh rate cannot be greater than the maximum vertical sync frequency
    of the monitor.


    # Refresh rates and monitor failure


    If the standard graphic mode has a high resolution, the refresh rate may be too
    high, causing the raster-scan circuitry to fail. The same is true if the computed
    graphic mode gives a refresh rate that is too high. Even when the monitor is able
    to process a high-resolution graphic mode, the raster-scan circuitry may fail
    if the refresh rate is increased beyond the monitor capabilities.


    Older monitors would only support one or two graphic modes. Newer monitors were
    designed with the ability to sync with additional modes. Thus, the term "multi-sync
    monitor" came into use; however, since most new monitors are multi-sync, the term
    is rarely used.'
