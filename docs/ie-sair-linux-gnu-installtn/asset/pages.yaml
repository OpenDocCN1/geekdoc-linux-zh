    And, as was the case with Netscape Mail, the Leave Messages On Server check box
    default is unchecked. This problem is fixed by checking the Leave Messages On
    Server check box in the Server Settings window (Exhibit 12-16).


    # Standalone graphical email programs


    The email clients included with Netscape and Mozilla are complete and convenient.
    However, you may prefer to use a separate standalone email client. Standalone
    email programs are smaller, faster, and less resource intensive than either Netscape
    or Mozilla. Also, you may prefer one of the other browsers that do not include
    an email client.


    # KMail


    KMail is a user-friendly mail client that is part of the K Desktop Environment,
    or KDE. Some of its features include support for mail filtering, GnuPG and PGP
    privacy, drag and drop of attachments, multiple POP3 accounts. KMail is included
    with the KDE packages shipped with Red Hat, SuSE and other popular Linux distributions.
    The latest release of KMail may be downloaded from http://kmail.kde.org/download.html.'
