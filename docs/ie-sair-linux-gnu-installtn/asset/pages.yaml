- pgno: 24
  md: '# Topic B: Business views of free software


    Explanation


    There are different views of free software from various businesses. We are going
    to take look at it from three perspectives in this section:


    +   - From a business that uses free software

    - From a business that develops free software

    - From a business that develops proprietary software


    # Businesses that use free software


    Businesses that use free software enjoy many benefits. One of the main benefits
    is the ability to view and modify the source. In addition, free software is usually
    available either at no cost or for a small fee compared to its proprietary counterparts.


    # Open source stability


    The open source nature of free software has in itself many benefits. Since many
    programmers have access to the code, there is a higher probability that bugs can
    be found and corrected, thereby increasing the stability of the software. This
    peer review of the code also gives the program or operating system higher levels
    of security.


    # Open source security


    In the security realm, having everything out in the open for inspection by security
    professionals is the standard way of doing business. Proprietary software vendors
    think that because no one can see their code the system is secure. This "security
    through obscurity" has proven to be false over and again as is evidenced by the
    large number of successful crack attacks on proprietary operating systems.


    A true system is still secure even when everyone knows exactly how it works. This
    is how cryptographers create their encryption algorithms. They publish them for
    all cryptographers to examine and try to break. The ones that are not easily or
    quickly broken are deemed to be strong. However, even strong encryption is a relative
    term because the increasing capabilities of individual computers and the rise
    of distributed computing making encryption schemes easier. As technology advances,
    so must the encryption techniques.


    # The cost of free software


    Many free software programs and operating systems are available at no cost. Some
    of this same free software can be downloaded from the Internet and installed.
    They can be purchased either in a store or online. If this sounds like a contradiction
    or a paradox to you, you have forgotten that free software refers to freedom not
    a monetary sum.


    Free that is is sold usually has a price that is much lower than its proprietary
    counterparts. Many proprietary programs require fees not only for each machine
    that you install it on, but for each client that connects to it over a network.
    Meanwhile, most free software is purchased once, installed on as many machines
    you like, and no one cares how many clients connect to it.


    Also free software typically does not require the latest and greatest hardware
    in order to install and run it. This saves the company the cost of having to upgrade
    their hardware.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Businesses that develop free software


    Businesses exist to make money. So how does a business that develops free software
    generate profits? It is possible to sell free software by changing the focus.
    Once the focus moved away from software as a product and centered on the idea
    of providing service, businesses became very successful at selling free software.


    # Selling services instead of product


    Consider a small business that has developed a user mail agent that will allow
    mail to be manipulated in a multi-operating system environment, regardless of
    which operating system is booted. In other words, if the mail were received and
    saved under MS-Windows, the user would still be able to view and edit it under
    Linux.


    The company could seize the market and develop a following for their software
    in the following ways:


    +   * Releasing the software under GNU GPL.

    * Posting the source code with comments and UNIX-style manual pages to the Internet
    for everyone to download.

    * Posting release announcements to various news groups and free software repositories,
    inviting others to try the software and asking them for advice on how to improve
    it.


    After reaching the release stage, the company could then begin to make money by:


    +   * Creating a Web site and hosting the CDs for sale, making installation easier
    for less-experienced users.

    * Developing and selling detailed documentation, tutorials, or user manuals as
    added value components of the product, including higher-cost versions of the packaged
    CD or completely separate books or products.

    * Developing and delivering instructor-led or computer-based training for users
    of the product.

    * Selling enterprise-level technical support services such as 24/7 technical support
    availability, guaranteed response times and en-site response by technical personnel.


    # Can free software be better than proprietary software?


    One interesting aspect of developing free software is that since the business
    does not control it, the open source software is now free to follow to the needs
    of its users. Proprietary software developers must put the economic interests
    of the company before consumer needs. However, companies producing free software
    can meet users'' needs by having users reprogram the software and responding to
    user requests. Once released, the software is no longer solely the responsibility
    of the issuing company, but rather its maintenance is taken over by the open source
    community in general.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Businesses develop proprietary software


    Proprietary software vendors view free software as a competitor, and rightly so.
    Free software competes for the same customer base that these vendors are targeting.
    These companies should try to ensure that they create the best program to fit
    the business problem that their customers are trying to solve. It seems that many
    of these vendors resort to fear, uncertainty and doubt (FUD) rather than making
    a better product.


    Some of the arguments that proprietary software development companies try to use
    against Linux and other free software include:


    +   - Free software does not have a warranty or guarantee.

    - Open source software is insecure.

    - Free software is expensive to implement and maintain.


    These statements are very good at producing fear, uncertainty and doubt, but are
    they true? Let''s take a closer look at each of these statements.


    # Software warranty


    It is true that many free programs that can be downloaded at no cost do not include
    a warranty of any kind. However we need to read the fine print that is included
    with software that has a warranty. Most commercial software, whether it is open
    source or proprietary, usually comes with a warranty that is included as part
    of an End User License Agreement (EULA).


    The "limited warranty" contained in the EULA is nearly identical for both the
    free software and the proprietary software. Both of them usually warrant the media
    that the software is shipped on against defects and workmanship and promise replacement
    or refund if it is damaged. A few of them warrant that the program will perform
    substantially in accordance with the accompanying written materials for a short
    period of usually 30-90 days.


    That sounds good, but what happens if the program does not perform according to
    the documentation — in other words, it doesn''t do what it says it does? How much
    is the software company liable for that case? If you continue to read the warranty
    information you will find that it limits the liability to the amount paid for
    the software.


    That means if you buy a proprietary program and it corrupts your data and you
    contact the manufacturer, you can get your money back for the program but nothing
    for the data or the time you wasted installing the software and recovering from
    the error. This is no different than installing software that doesn''t have a
    warranty except that you may not have to pay for the software in the first place.
    Therefore the argument against free software on the basis of warranty is void.


    In addition, with the ability to access the source, you have the means necessary
    to locate the code that caused the corruption and fix it so that the program works
    the way it is supposed to, or perhaps even better.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Security


    We already discussed that the open source model actually provides for better security.
    This argument implies that proprietary software is more secure. How can this be
    proven? The only way to prove the security is to have complete access to the source
    code so it can be examined.


    Closed source software vendors want you to think that their software is safe because
    they say so. But what is their incentive to inform customers of a potential security
    exploit in their software? It would be easier for them to just pretend that the
    exploit does not exist, to keep insisting on their software''s security, hoping
    that no one ever discovers the exploit.


    If, however, the exploit was found and someone was able to compromise your system,
    the only recourse you would have against the proprietary software company would
    be to get a refund. On the other hand, an open source program was compromised,
    your company could patch it themselves or even prevent the exploit by finding
    the exploit before someone invaded your system.


    # Total cost of ownership


    The Gartner Group researched the total cost of ownership (TCO) of software and
    found that the cost of purchasing software is only 8% of the total cost. The other
    92% is found in installation costs, administration, maintenance, support, and
    downtime.


    Given free software is often available for either cost or a low cost in comparison
    to proprietary software, the argument then implies that the other activities responsible
    for the majority of TCO actually are higher in cost than proprietary software.


    Open source software is accessible to anyone with the desire to study and learn
    the software. This creates the opportunity for more people learn how to install,
    administer, and maintain the software. Conversely, only the proprietary software
    vendor can maintain their software because they are the only ones who have access
    to the code.


    Downtime is actually a bigger problem with proprietary software than with open
    source software. It is a well-known fact that one of the best features of open
    source software is its stability.'
  merge: -1
  img_proc: true
