    sales totals, commissions, and incentives for five sales reps. |

    | 2 Observe the contents of cell F4 | F4 =E4*C Rate The commission rate formulas
    use the name "C_Rate" instead of a value for the commission rate. |


    # PowerPoint presentations


    Each unit in this course has an accompanying PowerPoint presentation. These slide
    shows are designed to support your classroom instruction while providing students
    with a visual focus. Each one begins with a list of unit objectives and ends with
