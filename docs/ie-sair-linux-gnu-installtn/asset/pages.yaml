- pgno: 142
  md: 'Taking the columns in the ps output from left to right:


    | Column | Description |

    |---|---|

    | USER | The user name of the owner of the process. |

    | PID | The process ID. |

    | %CPU | CPU utilization. Since the time base for this computation varies may
    occasionally see a number exceeding 100%. |

    | %MEM | Memory utilization. |

    | VSZ | Virtual memory used, in kilobytes. |

    | RSS | Resident set size, in kilobytes. |

    | TTY | Terminal associated with the process. Processes without an associated
    terminal may be server processes or daemons or be programs run within one of the
    window managers in the GUI. |

    | STAT | State of the process. R = running. S = sleeping. T = terminated. There
    are other states. The ps man page for more. |

    | START | Process start time. |

    | TIME | Total CPU time used by process. |

    | COMMAND | The command line executed to start the process. |


    If you want to find out if a particular program is running, you can combine the
    ps command with | and the grep command. A pipe passes the output of one command
    to the input of another. The grep command is a string search utility.

    The command:


    ```

    ps -aux | grep mozilla

    ```


    will search the output of the ps -aux command and return a list of each line containing
    the string "mozilla". Using the output of the ps -aux command above, the output
    of this command would be:


    | dougd | 1819 0.0 0.36856 3060 ? | S | 09:10 0:14 |

    | /usr/lib/mozilla/ | |

    | dougd | 1825 0.0 0.5 36856 3060 ? | S | 09:10 0:00 |

    | /usr/lib/mozilla/ | |

    | dougd | 1826 0.0 0.5 36856 3060 ? | S | 09:10 0:00 |

    | /usr/lib/mozilla/ | |

    | dougd | 1827 0.0 0.5 36856 3060 ? | S | 09:10 0:00 |

    | /usr/lib/mozilla/ | |

    | dougd | 1828 0.0 0.5 36856 3060 ? | S | 09:10 0:00 |

    | /usr/lib/mozilla/ | |

    | dougd | 1841 0.0 0.5 36856 3060 ? | S | 09:17 0:00 |

    | /usr/lib/mozilla/ | |'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 8-10 SAIR GNU: Installation and Configuration


    If the mozilla web browser is not responding, this is a convenient way to find
    all the PIDs with the browser. You could then use the kill command to stop and
    remove the program. In the example above, the lowest numbered PID parent process
    for all the others so typing kill 1819 should do the trick.


    # The top command


    The ps command is very useful, but it only returns a static snapshot of the state
    of the system. The top command is used to get a continuous display of the state
    of the processes running now.


    Note that the output column is a little different from ps. However, all the essential
    information is present. One very useful bit of information is the process priority
    in the PRI column.


    ![](img/f850b93901b8bb4c267df1b99fb6de52_143_0.png)


    Exhibit 8-1: top output


    # The kill and rename commands


    As shown above, the top command allows users to view information about running
    processes. The kill and rename commands allow you to exercise control over these
    processes.


    The kill command can send one of several signals to a process and can be used
    to terminate a process. When executed without specifying a signal name or number,
    the Linux command sends the TERM (terminate) signal. If a simple kill command
    does not work, it may be necessary to send a kill -9 which is the operating system
    equivalent of a knockout punch.


    The kill -1 command displays a list of all the signals. Descriptions of the signals
    can be found in /usr/include/linux/signal.h.


    The rename command alters the scheduling priority of a process. The rename command
    uses a scaled priority system to assign a priority to each process. The scale
    runs from -20 to 19, with -20 being the highest priority and 19 the lowest. The
    default priority for a process is 0. While any user can change the priority of
    a process he she owns from 0 to 19, only superuser can change someone else''s
    priorities. The superuser also has the ability to change process priorities to
    a level higher than 0.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'In the following example, the renice command will lower the program''s scheduling
    priority from the default of 0 to 15.


    ```

    $ renice 15 19868

    ```


    # Viewing Connected Users


    To see if other users are logged in or if there are other virtual terminals with
    login sessions, use the command who or w. The who command displays a list of users
    that are currently logged in and which terminals they are using. The w command
    provides an overview of the system. It displays a summary of the system state,
    which terminals users are logged to, from which network host they logged in, and
    the command they are running.


    # Using who


    ```

    $who

    bbrown tty1 Apr 2 08:58

    bbrown tty0 Apr 2 11:01 (host1.yourcompany.com)

    bbrown tty1 Apr 3 07:59 (host1.yourcompany.com)

    bbrown tty2 Apr 1 13:53 (sales.offsite.com)

    ```


    The user bbrown is logged in four times: once on a virtual system console (tty1),
    twice over the network from a computer called host1, and once from a computer
    called sales.


    # Using ws


    ```

    $w

    11:54am up 2 days, 14:16, 4 users, load average: 0.00, 0.00

    USER TTY FROM LOGIN@ IDLE JCPU

    PCPU WHAT

    bbrown tty1 0.91s 0.91s -bash Fri 8am 2:26

    bbrown tty0 0.30w host1.yourcompan Fri 1am 1:00s

    bbrown tty1 host2.yourcompany 7:59am 1:38m

    bbrown 2.89s 1.81s bash

    bbrown tty2 0.88s 0.88s -bash sales.offsite.com Tu 1pm 44:21m

    ```


    The w command reports the same information but with additional details on system
    usage.


    # Finding the number of users on a system


    If you only want know how many users are currently attached to a given system,
    you can pipe the output from the w command through the wc (word count) utility
    and tell it to only count the number of lines returned.


    ```

    $ who | wc -1

    ```


    Alternatively, you might want to find a specific user on a crowded system. You
    can easily locate them using either w or who to list the users and pipe that through
    the grep command, which searches for a string.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Finding a user by name on a busy system


    ```

    $ who | grep root

    ```


    There are many different variations on this theme; try saving your favorite command
    sets in a script for later.


    # The superuser


    Generally, the shell is configured to provide two types of command line prompts.
    The dollar sign ($) represents non-privileged (or positive value) UIDs. The pound
    sign (#) represents superuser status, and a zero value tells the file manager
    to ignore the file system protection measures. A superuser or root is any user
    account that has the value of 0 as the UID. If the user account UID is 0, then
    the file manager does not enforce permissions before performing the requested
    action. The superuser is the only account that may request certain system services,
    such as changing the date and time, adding a new user account, and increasing
    the priority of a process.


    # Routine tasks as superuser


    The problem with logging in as superuser to accomplish routine tasks is that even
    the simplest of mistakes can lead to a catastrophe. Consider, for example, what
    would happen as a result of typing the following commands when operating as superuser:


    ```

    # rm * .bak

    # rm -rf /home/evan/tmp

    ```


    In both examples, the inadvertent extra space results in deleting all files in
    the current directory or in the file system, respectively.


    The problem of accidental file deletion is further complicated by the design of
    the Linux file system. With all other Unix-like systems, Linux employs a fully
    indexed file system with direct access to the free block reference. When a file
    is deleted, its contents form the blocks of the next created file on a first-come,
    first-serve basis. Thus, once a file has been deleted and a new file has been
    created, the old file blocks have already been reused.


    Another unforeseen consequence of working as a superuser is that the files created
    while operating under superuser status will have restricted access permissions
    associated with them, as a result of being created by the superuser. To access
    those files the user must be in superuser mode.


    # Recommended method for routine tasks


    Administrators can quickly switch from user to superuser status with variants
    of the su command, which changes the effective UID to 0, allowing access to files
    or services.


    ```

    [joanne@noname joanne]$ su

    password:

    [root@noname joanne]# exit

    exit

    [joanne@noname joanne]$

    ```'
  merge: -1
  img_proc: true
