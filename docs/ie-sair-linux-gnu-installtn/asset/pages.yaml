- pgno: 244
  md: '# Topic B: Email clients


    Explanation


    Mail clients allow a user to interact with other users by giving them the ability
    to send, organize, compose, and store e-mail messages. Many e-mail clients are
    available for all Linux distributions. They range from simple command line applications
    to graphical X Window applications. Lots of GUI-style clients are available and
    several with most Linux distributions, bundled with each window manager (Gnome
    and KDE). As with FTP clients, the selection of a mail client is usually based
    on personal preferences rather than necessity.


    There are two basic categories of graphical email clients: those included as part
    of web browsers and those that are standalone programs. Most distributions include
    some of both. Many of the graphical email programs also contain address books,
    calendars, contact management utilities, and other features beyond simple email
    tasks.


    There are a wide variety of text-based email clients, far too many to provide
    a comprehensive survey here. Some of the more commonly used command line mail
    programs are elm, pine, and mutt—each of which is described below.


    # Graphical email clients included with browsers


    Both Netscape and Mozilla include highly capable email clients. Because of Netscape
    and Mozilla’s common heritage, the functionality and look-and-feel of the mail
    clients are similar.


    # Netscape


    Netscape Messenger is the mail client bundled with Netscape Communicator. Because
    Messenger is fully integrated into the Communicator package, it offers the convenience
    of using a single application for Internet tasks that many users find preferable.
    Messenger allows message filtering, a detailed search capability, message encryption
    and a customizable spelling dictionary. Messenger cannot be downloaded separately;
    it is only available in the Communicator package.


    Netscape Messenger is started from the main Netscape Communicator window using
    the Communicator menu (Exhibit 12-9).


    The menus (and much else) in versions 6 and 7 of Netscape Communicator are different
    from version 4.x. Since version 4.79 is the version bundled with Red Hat and SuSE,
    version 4.79 is what is described here.'
  merge: -1
  img_proc: true
