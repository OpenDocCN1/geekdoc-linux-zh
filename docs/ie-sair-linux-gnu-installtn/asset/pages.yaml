    Exhibit 10-22: Testing the new settings


    # Reviewing your settings


    You can use the xset -q command to check the current Free86 server settings including
    the name of the server, keyboard configuration, mouse configuration, and font
    paths.


    # The XF86Config file


    Hopefully, you will never have to edit the XF86Config file. However, in case it
    is ever necessary, a basic understanding of the structure and syntax of the file
    is required.


    Version 3 of XFree86 and version 4 of XFree86 have different formats for their
    XF86Config files.


    Red Hat Xconfigurator understands the differences and will modify the configuration
    appropriately. Red Hat also keeps two files: XF86Config for version 3 and XF86Config-4
    for version 4.


    SuSE’s SaX2 tool is also clever enough to know the difference and offers to start
    the older SaX tool if you are using version 3 XFree86. However, SuSE uses a single
    file, XF86Config for both versions.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Layout and syntax of XF86Config-4


    Each section begins with a Section "<section-name>" line and ends with an EndSection
    line. Each section will have option names followed by at least one option value.


    # Device


    The device is the video card. This section contains configuration data for the
    video card. There must be at least one Device section in the XF86Config file.
    Commonly used options:


    +   * Driver — name of the driver (X server) to use for the card

    * Identifier — unique name for the card

    * VideoRam — amount of video ram in Kbytes


    # Files


    This section contains path definitions for critical XFree86 server files:


    +   * FontPath — path to the font libraries

    * ModulePath — specifies the directories where additional modules (drivers) may
    be found

    * RgbPath — path to the RGB color database


    # InputDevice


    This section configures input devices. Of primary interest are the keyboard and
    mouse.


    +   * Driver — identifies the name of the driver for the device

    * Identifier — Sets a unique identifier for the device


    Specific devices will have additional options. For instance, a mouse will have
    a device name (i.e. /dev/psaux) and a protocol specification (i.e. PS/2).


    # Monitor


    Defines the monitor used by the system. There must be at least one Monitor section
    for each system. There may be more than one Monitor section if the system supports
    multiple monitors.


    Some common options:


    +   * HorizSync — horizontal frequency range

    * VertRefresh — vertical frequency range

    * VendorName — manufacturer name

    * Identifier — unique name for this monitor

    * Modeline — range of resolutions per each color depth'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Screen


    This section binds or connects the Device and Monitor settings. There must be
    at least one Screen section for each system.


    Some common options:


    +   * DefaultDepth — default color depth

    * Device — name of the Device section to be used with this Screen section

    * Identifier — unique name

    * Monitor — name of the Monitor section to be used with this Screen section


    # ServerFlags


    This section contains various XFree86 server settings that apply globally. Most
    interesting are:


    +   * DontZap — blocks the use of Control+Alt+Backspace to terminate the X server

    * DontZoom — blocks the use of Control+Alt+[Keypad +] and Control+Alt+[Keypad
    -] to cycle through the X server resolutions


    This review only scratches the surface of all the options in the XF86Config file.
    The file itself is well commented and almost self-documenting. The XF86Config
    man page is another good reference.


    # Mouse configuration


    You probably noticed that Xconfigurator did not offer to reconfigure the mouse.
    There is a separate shell utility, mouseconfig that accomplishes this task.'
  merge: -1
  img_proc: true
