- pgno: 138
  md: '# Basic system navigation 8-5


    Taking the example of file datafile above, the example (student) has "rw-", indicating
    read and write but no execute privileges. The group (student) has "r--" indicating
    read no write or execute privileges. Everyone else has "--" also indicating read
    no write or execute privileges. Expressing the mask "rw-r--" as an octal number
    yields 0644 (the leading 0 is normally not shown, so a common representation would
    be 644.)


    Changes to file permissions are made with the chmod command. There are two forms
    of the chmod command: using a numeric argument for the permission mask and using
    an alphabetic argument for the permission mask. If you want to change the permissions
    on file datafile to allow everyone to read, write, and execute the file (normally
    a very bad idea), the numeric form of chmod would be:


    ```

    $ chmod 777 datafile

    ```


    Following the chmod command with the ls command shows that, indeed, the permissions
    have been changed.


    ```

    $ ls -l datafile

    0 -rwxrxr-x 1 student student 0 Mar 18 17:05 datafile

    ```


    Performing the same operation with the alphabetic form of chmod looks like this:


    ```

    $ chmod +rwx datafile

    ```


    Again, following the chmod command with the ls command shows that the permissions
    have been changed.


    ```

    $ ls -l datafile

    0 -rwxrxr-x 1 student student 0 Mar 18 17:05 datafile

    ```


    The alphabetic form of chmod command can be awkward. Each permission group (''u''
    or user, ''g'' or group, ''o'' or others) has permissions added (+) or removed
    (-). (Additionally, as shown above, ''a'' may be used for all). When grouped together,
    the alphabetic permission arguments must be separated by commas with no white
    space. Let''s take this example bit further to explain how this works.


    Suppose you have decided giving everyone execute access to datafile is a bad idea.
    You want to give yourself full access and everyone else read access. The two forms
    of chmod command that will accomplish this:


    ```

    $ chmod 744 datafile

    $ ls -l datafile

    0 -rwx-- 1 student student 0 Mar 18 17:05 datafile

    ```


    ```

    $ chmod g-wx,o-wx datafile

    $ ls -l datafile

    0 -rwxrxr-x 1 student student 0 Mar 18 17:05 datafile

    ```


    Note that the alphabetic form of chmod requires a separate argument for group
    and others, respectively. Also note that the arguments are separated by commas
    with white space. The minus (-) indicates that the listed permissions are to be
    removed.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# SAIR Linux GNU Installation and Configuration


    There are similar commands to change the owner and group: chown and chgrp. Each
    command takes as its first argument the new owner or group and as its second argument
    the name of the file. Using datafile as an example:


    ```

    $ su -

    Password:

    # chown fred datafile

    # chgrp barney datafile

    # ls -la datafile

    0 -rwxrwxrxr 1 fred barney 0 Mar 18 17:05 datafile

    ```


    Assuming that there is a valid user fred and a valid user group named barney,
    note prior to performing these tasks the su command is used to change the user
    identity to root. For the chgrp command this is necessary because student was
    not a member of the user group barney (you must be a member of the user group,
    or root, to change a file''s group). Similarly, you must be root to execute the
    chown command.


    Directory permissions are modified with the same commands used to modify file
    permissions (remember, a directory is a file). Directory permissions function
    similarly, but not identically, to file permissions. Along the important differences
    and distinctions:


    +   * To use the cd (change directory command) into another directory, you must
    execute permission to that directory

    * If you have write permission for a directory, you can create, delete and modify
    files and subdirectories within the directory, even if someone owns them.


    # Permission mask


    As noted, the permission string is really a binary mask.


    | Octal digit | 1 | 2 | 3 | 4 |

    |---|---|---|---|--|

    | Octal value | | | | |

    | 4 | set uid | r | r | r |

    | 2 | set gid | w | w | w |

    | 1 | sticky bit | x | x | x |


    Fields apply to → special user group others


    We have already covered the read, write, and execute values. The "special" bits
    require a little additional explanation.


    The sticky bit is also called the "save text mode bit". The net result of setting
    this bit is to cause an executable file to remain in memory even after program
    execution has terminated. This bit isn''t used much anymore since that it is primarily
    a "hack" to eliminate the latency of reloading the file if it needs to run again.


    The set gid changes the "privilege identity" of the user executing the file to
    that of the group of the file. For instance, user student, who is not a member
    of group barney, runs an executable file with a group id of barney with the gid
    bit set. The file runs with all the privileges of group barney.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'The set uid bit functions similarly to the set gid bit, except that the set
    uid functions at the user id level. This is usually employed to allow users without
    superuser privileges to run programs that require superuser privileges. This is
    a major convenience but can be a major security hole if anyone other than superuser
    gains access to the file.


    Laptop and other single-user system owners are unlikely to need to manipulate
    the special permission mask bits. However, you will see them on some files on
    your system. And, in the case of the set gid and set uid bits, it is important
    to understand the consequences of their being set, especially for system security.


    # Controlling processes


    For each program on a Linux system, there is at least one controlling process.
    A process defines and controls the environment a program runs in. Each process
    is assigned a unique process id or PID, an integer that identifies the process
    to kernel code that controls the execution of all the processes on the system.


    Viewing and controlling the programs running on a Linux system requires viewing
    and monitoring processes.


    The primary command line tool for viewing processes is the ps command.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# The ps command


    The ps command, like so many other Linux commands, is an amalgam of the same command
    on other UNIX''S. For this reason, there are a number of features of the ps command.
    For example, the ps -aux and ps -ef variants of the ps command produce similar
    (but not identical) output. Each command variant, however, produces all the essential
    information needed to find the process running a particular application. Which
    you choose to use is largely a matter of whether you come from a background with
    one of the other UNIX''s and have learned to use one of the formats. Here we will
    use the ps -aux variant.


    | USER COMMAND | PID %CPU %MEM VSZ RSS TTY STAT START TIME |

    |---|---|---|---|---|---|---|---|---||

    | root | 1 0.0 0.0 1368 424 ? | S | 08:15 | 0:04 |

    | init root | 726 0.0 0.0 2620 544 ? | S | 08:16 | 0:00 |

