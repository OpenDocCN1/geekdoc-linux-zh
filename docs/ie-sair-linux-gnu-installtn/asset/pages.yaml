- pgno: 283
  md: '# 13-6 SAIR Linux GNU: Installation and Configuration


    # # Topic B: Where to look


    Explanation


    Determining the state of the system at the time of the problem is a key step in
    fixing the problem. As noted earlier in this unit, there are some primary information
    sources that you will use to determine the system state. These include any error
    messages that are generated, the various system and application log files, the
    /proc filesystem, configuration files, and source code.


    # ## Error messages


    Error messages are unique to each system program or application. The primary resources
    for understanding the meaning of error messages are the man page for the program
    and, in the case of GUI applications, context-sensitive help that is provided
    (usually via the help menu).


    If none of these sources provides you with an understanding of the error message
    or messages, the ultimate documentation is the source code. Searching the source
    code with a text editor for the error message text will lead you to some comments
    by the developer about the error. You can also get a pretty good idea of what
    the program is doing at the time of the error by examining the comments for the
    section of code that the error occurs in.


    # ## Log files


    Log files are the way that programs "take notes" about themselves. Programs produce
    output either as a result of normal operation or as the result of some error condition.
    The default behavior of Linux programs is to send normal and error output to the
    stdout and stderr streams, respectively. The default target for stdout and stderr
    is the user''s display. If the program is a server (daemon), then it runs in the
    background and has no controlling terminal, so output to the default locations
    for stdout and stderr will be lost. For this reason, most servers (daemons) redirect
    their output to log files. This redirection is managed in one of two ways:


    +   - Directly by the application. The kind of information output by the application
    is controlled by the application. Which specific items of the output written to
    the log file is controlled by the application. The location of the log file or
    files is controlled either from within the application or by one or more configuration
    files.


    +   - Indirectly, using the syslog facility. The information output by the application
    is controlled by the application. Which specific items of the output written to
    the log file is controlled by the /etc/syslog.conf configuration file. The location
    of the log file or files is also controlled by the /etc/syslog.conf file.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Troubleshooting 13-7


    The syslog daemon, syslogd, provides a consistent, easily configured facility
    to control the logging behavior of the programs which use it. The configuration
    for syslog is /etc/syslog.conf. This configuration file controls the priority
    level of the messages logged and the destination of the messages. It is this that
    of most interest in the typical troubleshooting situation since this tells you
    where to find the log file or files.


    The location of syslog log files may vary depending upon the Linux distribution.
    Red Hat and SuSE keep the system log files in /var/log.


    # /etc/syslog.conf


    For programs which use the syslog facility, the syslog.conf file controls the
    type and priority of the messages logged and the path to the log file (Exhibit
    13-1).


    ![](img/f850b93901b8bb4c267df1b99fb6de52_284_0.png)


    Exhibit 13-1: Typical syslog.conf


    # /var/log


    Many of the more interesting and useful log files are found in /var/log. The messages
    file contains a wide variety of messages from a number of sources. The boot.log
    file contains a nice, concise list of console messages from the latest reboot.
    There are many others; be to familiarize yourself with the log files and their
    contents.'
  merge: -1
  img_proc: true
