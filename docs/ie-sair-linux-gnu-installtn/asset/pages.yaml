- pgno: 41
  md: '# Topic C: Getting a copy of Linux


    Explanation

    In this section we will look at the different methods of getting a copy of Linux.
    This will include a discussion about some of the most popular distributions of
    Linux.


    # The hard way


    You can build it yourself. That''s right, you can download the sources, compile
    them and put together your Linux system. If this sounds crazy to you, then skip
    to the section called, "The easy way." If, however, it sounds like fun, then read
    on.


    The latest Linux kernel can be downloaded from kernel.org. If you visit that site
    you will notice that all current and previous versions of the kernel are available
    for download. If you want to download a new kernel it is important that you understand
    the versioning number. You may see a number such as 2.4.19. The first number is
    the major version number. The middle number is the minor version number and the
    last number is the patch level.


    The minor version number tells you whether this is a stable kernel or not. If
    the number is even, it is stable. If it is odd, its a development kernel and should
    only be downloaded by kernel hackers (programmers, not crackers) that are trying
    to work on the next version of the kernel. For example, 2.5.30 is also available
    on the kernel site. This is a development kernel. When it is deemed stable, it
    will be renumbered to either 2.6 or 3.0.0 depending on whether the changes are
    vastly different from the 2.4.x kernel or not. Note that these versioning schemes
    only apply to the Linux kernel and not to all software.


    If you download a kernel from a vendor such as Red Hat, you might see a release
    number as well. It will look like this: 2.4.18-4. The last number indicates this
    is the fourth build of the 2.4.18 kernel that Red Hat has released.


    # From-Power-To-Bash-Prompt-HOWTO


    This HOWTO is a good place to start if you want to learn what happens from the
    time you press the power button until the system completes the boot process. It
    will guide you through step-by-step, and you will learn a lot about how all the
    pieces in a Linux system fit together. You can get any of the Linux HOWTOs or
    just about any other Linux documentation that you need at The Linux Documentation
    Project, www.tldp.org.


    # Linux From Scratch


    This document was originally a HOWTO, but has been expanded with more information
    to 332 pages and is now in the "guide" category. You can get the latest copy of
    Linux From Scratch at The Linux Documentation Project, or you can go straight
    to the source at www.linuxfromscratch.org.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# The easy way


    Distributions, or distros, are collections of all the necessary pieces required
    to make a functional Linux system, plus few extras. It is the extras that make
    all the difference among the various distros. Some are known for an easy installation,
    others for their stability, others for the number of packages that ship with their
    distribution.


    If you do not have the time or desire to learn the details of how Linux works
    under the hood, you can download an iso image of one of the distributions and
    burn it to a CD. If you do not have a good broadband connection and a CD-burner
    you can purchase a boxed set of the CDs that includes manuals and technical support.
    If you want a mighty option, you can purchase CDs without manuals and technical
    support from a third party vendor such as www.linuxcentral.com or via www.linuxurl.com.


    Two of the earliest distributions were from Soft Landing Systems and Yggarras.
    Soft Landing Systems was the first distro to be offered. Yggarras was not far
    behind and later released a Plug-and-Play Linux that caused Microsoft to delay
    the release of Windows 95 until they could match its plug-and-play capabilities.
    Unfortunately, neither of these companies have a current distribution. You can
    get a copy of SLS Linux from http://www.ibibo.org/pub-historic-linux/distributions/sls/1.05/.
    Yggd still has a website, www.yygras.com, but it is out of date.


    The following are distributions that you may want to examine:


    # Red Hat Linux


    Red Hat (www.redhat.com) is the most popular distribution in the United States
    at this time. Red Hat is a completely open operating system that supports both
    KDE and Gnome desktops and has versions for i386, Alpha and SPARC architectures.
    Portability from one architecture to another across the three platforms. Red Hat
    has contributed to open source software with the creation of the Gnome desktop,
    the Disk Druid partitioning tool, and the Red Hat Package Manager (RPM), which
    has set the industry standard for package management. Red Hat has joined with
    companies such as IBM and Oracle to make their software applications available
    with the "Linux Application Library" CD-ROM or via download using RPM. This means
    that many applications are already available on the CD-ROM. The list of included
    applications contains many features, such as Star Office, Samba, Apache, Sendmail,
    and Bx and restore utility. In addition to the distribution, Red Hat Linux supports
    services at many levels, from pay-per-incident to consolidated support contracts.
    Free support is also available for a fixed number of days following the purchase
    of CD-ROM software. Red Linux is available from the FTP site http://ftp.redhat.com,
    local retailers, or from a Red Hat partner that offers certified services for
    Red Hat. Red Hat has created a RHCE (Red Hat Certified Engineer) certification
    around their distribution.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 2-14 SAIR Linux GNU: Installation and Configuration


    # SuSE Linux


    SuSE (www.suse.com) is the number distribution in Europe. Adhering to international
    standards, SuSE Linux is available for the Intel, Alpha, and Power PC platforms.
    In addition to the Linux distribution, SuSE offers technical support, consulting,
    Partner Programs, and sales to customers, resellers, and distributors. SuSE''s
    contributions to Linux and the open source community include kernel development,
    XFree86, ALSA, KDE and libre. The SuSE distribution includes installation and
    administration tools as well as over 1,500 applications, an extensive manual,
    and 60 days of installation support. SuSE is known for an abundance of software
    available in a box set.


    # Turbolinux


    Turbolinux (www.turbinolux.com), formerly known as Pacific HiTech, has established
    itself as a major competitor among the other distributions of Linux. Drawing from
    a large pool of corporate sponsorship, Turbolinux holds a strong position in the
    Asian market. Turbolinux has become a competitor that it holds outwindows in both
    the Japanese and Chinese markets. Known for its networking and clustering capabilities,
    Turbolinux has become a popular choice among Internet service providers. Turbolinux
    provides clustering software that can integrate both Windows and UNIX formats.
    Turbolinux''s basic installation is considered moderately difficult, and it offers
    a graphical user interface for initial installation and package management. It
    also uses fdisk and fdisk for partitioning the hard drive. TurboPKg is the package
    manager that acts as a graphical user interface for RPM. Turbolinux has recently
    launched PowerCockpit, a server providing and management tool, which makes large
    deployments and re-deployments more efficient, secure, and cost effective.


    # Caldera OpenLinux


    OpenLinux (www.caldera.com) is a 32-bit, certified OS that includes the full Linux
    source code with matching binaries. OpenLinux integrates with existing systems,
    such as Novell Netware, LanManagerTM, Sun Microsystems, UNIX, IBM, Intel, DOS,
    and Microsoft Windows NT. It also includes the following applications: Applinux
    Office Suite; Linux wIZARD, the first-and-click graphical interface of Linux;
    Partition Magic CE (Caldera Edition), supporting hard drives larger than 8 GB;
    Store; WordPerfect; and COAS System configuration and administration simplified
    and integrated into development. KDE and GUI KDE are included with example code,
    tutorial, and OpenGL extensions. OpenLinux is known for easy installation via
    LIZARD and the user-friendly administration interface COAS, both of which make
    OpenLinux the choice for many novice users.'
