- pgno: 201
  md: '# Topic A: The X Window system


    Explanation


    The X Window system, usually referred to as “X”, is a graphical user interface
    (GUI) used on almost all Unix and Unix-like operating systems. It was developed
    to allow multiple clients to access a single computer.


    X consists of two parts: the server, which controls the graphics hardware in a
    system, and the client, which is what the user sees on the screen. The X client
    and X server may reside on the same computer system or reside on different systems
    connected to a network. The client can be any of a number of programs. On Linux,
    the main X clients are programs such as kw, the KDE window manager, or gdm, the
    Gnome manager.


    The Linux version of X, XFree86, currently has two main versions, 3.x.x and 4.x.x.
    The 3.x.x series of X offers simplicity and stability. The 4.x.x series contains
    improvements over previous versions, including features such as modular drivers
    and an integrated 3-D subsystem called DRI. Current versions of most Linux distributions
    with the 4.x.x version(s) are available at www.xfree86.org.


    Note: In addition to XFree86, there are several commercial Windows implementations.
    Metro Link and Xi Graphics are the most popular. For some specific video hardware
    and applications (TGA graphics controllers, some GL implementations, some CAD
    applications), these commercial Windows servers may be required (or at least,
    desirable). However, for the majority of Linux users XFree86 works well.


    # History of X Windows


    The X Window system is one of the original open source projects. It was developed
    out of necessity in 1984 at MIT because the university required multiple computers
    for teaching aids and development. Although MIT had enough computers, there were
    multiple operating systems used in them. The W protocol already existed for windowing
    applications, but it required a windowing system independent of the OS. It did
    not fit MIT’s exact needs. Bob Scheffler modified to the extent that it became
    something new, and X was born. Soon after, X was released both commercially and
    publicly.


    # Problems with X


    X has historically been the most troublesome part of configuring the typical Linux
    system. This has been due to the complexity of the X window system and missing,
    incomplete, or buggy drivers for video cards.


    Modern Linux distributions have tam much of the complexity by providing highly
    capable installation and configuration wizards to auto detect and configure popular
    video cards and monitors. Some of these configuration wizards and utilities are
    discussed later in this module.


    The latest versions of the 4.x.x series of XFree86 contain stable, fully featured
    drivers for almost any video imaginable. And, some video chipset (Nvidia, for
    instance) now provide custom binary images of drivers for their products.


    However, even with these recent improvements, X still has a number of problems
    associated with it.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'One of these problems is X''s handling of fonts. Web pages and documents sometimes
    be difficult to read because X uses fixed-width, postscript-based fonts. Although
    there are variable-width fonts available, some applications use fonts not included
    in X''s variable-width font list. The result is a jagged, illegible appearance.
    Configuring X and applications as word processors to use variable-width, postscript
    fonts (for instance, True fonts) can be a complex task.


    And even with the improvements in the configuration utils, X remains a complex
    system. The default installation of a modern Linux distribution such as Red Hat
    version 7.3 or SuSE version 8.0 almost always results in a functioning X Windows
    environment. post-installation customization and tuning (especially for security)
    can be a daunting task. The intricacies of configuring this powerful software
    can solve problems even for advanced users.


    # The Components of X


    As mentioned previously, the X Window system is designed to run across a network.
    The two main components of X are the server and the client.


    # The server


    The server is the more important of the two because it actually controls the video
    hardware. At any given time, there will be two servers installed on a system:
    the generic VGA server and, if available, a hardware-specific server designed
    to provide access to a graphics card''s advanced features.


    The X Server running on your local machine is accessed by clients that are usually
    on your machine, just but as easily, it can be on other machines on the network.
    The server''s output device, in most cases your monitor, only needs to render
    the client''s graphics on your display, using the dimensions, colors and other
    specifications the client communicates to the server.


    # The client


    Clients do not access the display directly; they rely on the server to handle
    the display. The client is what the user sees; it is part of the X system that
    provides access to a window manager or other client program.


    # Locating files


    Depending on the distribution installed on the system, the X Server and associated
    configuration files will be in slightly different locations.


    This list below describes the common components of X Windows and their locations
    on SuSE version 8.0 and Red Hat 7.3.


    There is a Linux Filesystem Hierarchy Standard (FHS) specifying where common Linux
    system files should be kept (www.pathname.com/fhs). Most distributors follow the
    standard but some variations exist. This makes finding system configuration files,
    including X Windows configuration files, something of a challenge. When searching
    for X Windows components, the which, where and find commands are helpful.'
  merge: -1
  img_proc: true
