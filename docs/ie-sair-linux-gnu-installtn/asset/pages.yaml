- pgno: 315
  md: '# Topic A: Course summary


    At the end of the class, use the following summary text to reinforce what students
    have learned. It is not intended as a script, but rather as a starting point.


    # SAIR Linux GNU: Installation and Configuration


    Unit 1


    In this unit, students reviewed the history of free software and the importance
    of AT&T''s decision to distribute UNIX version 6 to universities. They also discussed
    the GNU license, the concept of copyleft as an alternative to copyright, and the
    impact of the Open Source Initiative on the spread of Linux. They examined the
    reaction of proprietary software vendors to Linux and the Open Source phenomenon.
    Finally, they examined and discussed the arguments of competitors and critics.


    Unit 2


    In this unit, students reviewed the six major modules of Linux and their role
    in the Linux system. They reviewed the multi-user and preemptive multitasking
    capabilities of Linux. They also learned file system structure, file system objects,
    file system abstractions, and the Filesystem Hierarchy Standard. They surveyed
    the setup and configuration parameters for a file system, including partitioning,
    formatting and mounting. Finally, reviewed current Linux distributions.


    Unit 3


    In this unit, students were introduced to the Linux boot loaders, LILO and GRUB.
    They learned the location and functions of the LILO configuration file, /etc/lilo.conf
    and the GRUB configuration file, /boot/grub.conf. They reviewed some common problem
    areas with both boot loaders. They surveyed the startup process and common issues
    with single and multi-boot systems. Finally, they reviewed configuration multi-boot
    systems including recovery of the MBR.


    Unit 4


    In this unit, students learned how to gather and analyze the hardware configuration
    of a system. Among the resources they reviewed were sources of hardware documentation
    and the use of Windows and Linux utilities to examine the hardware configuration.
    They reviewed hard disk architecture, disk partitioning tools, and disk partitioning
    strategies, including dual-boot systems. They were introduced to the information
    needed to configure a network host. Finally, they reviewed the installation media
    choices for installing a Linux system.


    Unit 5


    In this unit, students discussed the system process and the importance of the
    init process. They learned the reasons for performing an orderly shutdown, shutdown
    procedures. They reviewed the details of the init process including its configuration
    file, inittab, and the steps that init takes during system initialization. Finally,
    they surveyed run levels and the resource control files used to configure the
    run levels.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Course summary S-3


    In this unit, students were introduced to the shells used in Linux. They learned
    bash features, including command history and completion, I/O redirection and job
    control. They reviewed shell customization including bash shell configuration
    file modification, creation of aliases, and modification of the default path.


    # Unit 6


    # Unit 7


    In this unit, students discussed how to find help with Linux. Students were introduced
    to command line and GUI tools for viewing man pages and info pages. They also
    reviewed some starting points on Linux information.


    # Unit 8


    In this unit, students learned the basic syntax of shell commands. They also surveyed
    some of Gnome and KDE graphical tools to navigate between directories. The specific
    tools covered were Nautilus and Konqueror. Finally, they reviewed the GNOME System
    Monitor and KDE System Guard monitoring tools.


    # Unit 9


    In this unit, students learned to create and manage user accounts and groups from
    the shell and the GUI. They learned the essential user account attributes for
    creating a new account. They used the userradd script and the Red Hat User Manager
    to create a new user account. They also reviewed the command line and GUI tools
    to manage printers. They practiced mounting and using removable media. Finally,
    they used some of the common command line tools used to monitor important system
    resources such a disk space and the network.


    # Unit 10


    In this unit, students learned of the history of X Windows, the standard locations
    for important X Windows programs and configuration files, and some differences
    between Free86 versions 3 and 4. They also learned how to configure X Windows
    on SuSE 8.0 using the SaX2 tool and to configure X Windows on Red Hat 7.3 using
    the Xconfiguration tool. Finally, they reviewed the basic structure and syntax
    of the XF86Config file.


    # Unit 11


    In this unit, students learned about installing Linux applications from source
    code. They discussed some of the shortcomings and problems of using tarballs to
    install applications: They learned how packages and package management systems
    help resolve some of these problems. Finally, they reviewed the most common package
    management systems, Red rpm and Debian dpkg.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Unit 12


    In this unit, students learned some of the popular web browsers available for
    Linux. They reviewed the features and benefits of the complete web suites such
    as **Netscape** and **Mozilla**. They learned that the web suites include **email**
    clients, **newsreader** clients, **web page creation** applications and more.
    They surveyed the **command line** and **GUI email clients** available for Linux.
    They reviewed the command line and GUI tools used to transfer files between systems
    using the **File Transfer Protocol (FTP)**. Finally, they discussed the command
    line text editors and **GUI text editors** available for Linux.


    # Unit 13


    In this unit, students learned a logical, **five step troubleshooting process**.
    They reviewed some of the places to find **error** and **system state** data and
    some tools that make collecting that data easier. They surveyed some of the **error
    prone areas** of Linux (and other operating systems). Finally, they reviewed some
    of the common **error messages** and some of the common **installation mistakes**
    and **misconfigurations** that cause these errors.'
  merge: -1
  img_proc: true
