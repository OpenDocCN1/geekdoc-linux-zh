- pgno: 196
  md: '# Basic system administration


    netstat command is powerful and complex. It has many options and can provide all
    of the status and statistical information that you or any system administrator
    may ever need. We will only scratch the surface of netstat''s capabilities.


    One of the uses of the netstat command is to view the routing information. When
    you installed Linux, one of the network configuration parameters you set manually
    or had set on yourself by the DHCP server was the default gateway. You probably
    recall that the purpose of the default gateway is to route traffic to and from
    your local subnet. The netstat -r command allows you to view the current state
    of the system routing table. If you are unable to connect to systems outside of
    the local subnet, netstat -r can give vital clues to the reason


    ```

    $ netstat -r

    ```


    # Kernel IP routing table


    | Destination | Gateway | Flags | MSS | Window | irtt | Iface |

    |---|---|---|---|---|---|---||

    | 192.168.1.0 | * | 255.255.255.0 | U | 40 | | eth0 |

    | 127.0.0.1 | * | 255.0.0.0 | U | 40 | | lo |

    | default | 192.168.1.1 | 0.0.0.0 | U | 40 | | eth0 |


    If there is no default gateway in the netstat -r display, you can remedy the problem
    (assuming you know the address of the default gateway) using the route command.
    See the man page for.


    Another use for the netstat command is to determine which network ports are open
    on your system. This information is crucial to understanding the security status
    of the system.


    ```

    [root@local ~]# netstat -t

    Active Internet connections (servers and established)

