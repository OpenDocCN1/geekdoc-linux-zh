- pgno: 58
  md: '# Topic C: Startup issues


    Explanation


    In this topic you will discover some of the reasons for configuring a system for
    multi-boot. You will also explore some steps that need to be done when working
    with the MBR.


    # Multi-boot


    A multi-boot system is one that has more than one option to choose from during
    the boot process.


    # Booting multiple Linux kernels


    One reason for having a multi-boot system is that you may decide to upgrade your
    kernel. When you upgrade you want to have the old kernel still available in case
    something goes wrong with the upgrade.


    Configuring the system to boot another kernel is as simple as editing the appropriate
    configuration file for your bootloader and specifying the location of the new
    kernel. If you are using LILO, do not forget to run /sbin/lilo when you finished
    making your changes. Here is our example /etc/lilo.conf file after it has been
    modified to boot a new kernel:


    ```

    boot = /dev/hda

    delay = 50

    default = linux

    vga = normal

    read-only

    append = "mem=256M"

    image=/boot/vmlinuz-2.4.18-3

    label=linux

    password=xxxx

    root=/dev/hda3

    image=/boot/vmlinuz-2.4.19

    label=newkernel

    password=xxxx

    root=/dev/hda3

    ```


    With this configuration, the old kernel is still the default, but the administrator
    can boot the new kernel by typing newkernel at the LILO prompt. Notice that we
    are still using the same root file system so the only required changes are the
    image and label lines.


    # Booting multiple Linux distributions


    Some people need or want to have multiple Linux distributions available to use.
    Money and space constraints can preclude the use of multiple machines for this
    purpose. For example, if you want to test the differences among seven different
    Linux distributions you might not have the funds to buy seven machines. Even if
    you do, you might not have a place that is big enough to set all of them up. Fortunately,
    the bootloaders that are used with Linux allow you to boot multiple distributions
    on the same machine.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 3-12 SAIR GNU: Installation and Configuration


    Let''s look at the /boot/grub/grub.conf file that we were working with before,
    but after it has been modified to another distribution.


    ```

    default=1

    timeout=10

    splashimage=$(hd0,1)/grub/splash.xpm.gz

    password --md5 $/RZR/$Tp/BxueWzzfC8b8WPCsF21

    title linux (2.4.18-3)

    root (hd0,1)

    kernel /vmlinux-2.4.18-3 root=/dev/hda3

    initrd=/initrd-2.4.18-3.img

    title linux (2.4.19)

    root (hd0,1)

    kernel /vmlinux-2.4.19 root=/dev/hda5

    initrd=/initrd-2.4.19.img

    ```


    In this example, another distribution of Linux has been installed on the first
    logical drive in the extended partition of the first hard drive. This new distribution
    is running the 2.4.19 kernel. If another hard drive was available, the new distribution
    could have been installed on.


    # Booting with Linux and Windows


    Many people use Linux have a multi-boot system that let''s them choose between
    Linux and a Windows operating system when they boot the machine. LILO and GRUB''s
    ability to dual boot Windows 95/98/ME/NT/2000/XP is important, because it allows
    a novice to experiment with Linux and keep their important data in Windows until
    they become comfortable with Linux.


    It is possible to install either Windows or Linux first and then configure the
    machine for multi-boot. it is easier to start with Windows, then install Linux.


    If you are adding Linux to an existing Windows machine, most setup routines will
    find and add the Windows partition to the bootloader''s configuration file. If
    the system had a default Windows installation, it likely using the entire hard
    drive. Some distributions have the capability to shrink the Windows partition
    to make room for a Linux partition. If not, and you have a FAT or FAT32 file system,
    you can use a freely available program as FIPS. If your Windows partition is using
    the NTFS file system you have a couple of choices. The easiest, but most expensive
    method is to obtain a commercial partitioning program, like PartitionMagic, that
    can understand the NTFS file system and usually partition the drive without loss
    of data. The other option takes a lot more time and involves manually partitioning
    your drive then reinstalling your Windows OS. This last option is destructive,
    unless you have a backup of your data, or all of your critical data is stored
    on another hard drive you may not want to do.


    If installed Linux first or if the Linux installation process did not add the
    Windows information to the bootloader configuration file, you can follow the two
    examples below to point the bootloader to the correct partition containing the
    Windows boots files:


    ```

    # Example LILO entry to boot Windows

    other=/dev/hdal

    label=windows

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Notice to configure LILO to boot Windows we use the other option instead of
    the image. If Windows 9x was installed first, it will normally be on the first
    partition of the first hard drive as shown by the /dev/hd1 setting. This might
    not be the case if you have Windows NT/2000/XP installed.


    ```

    # Example GRUB entry to boot Windows

    title windows

    rootverify(hd0,0)

    chainloader +1

    ```


    For GRUB, you still use the title option: however, instead of root, you configure
    a rootverify option. This option sets the specified device as the root device,
    but does not attempt to mount it. this example assumes that the installations
    is on the first partition of the first hard drive (hd0,0). The chainloader option
    is used to load a file as a chain-loader. Instead of a file, we specified +1,
    which indicates that the first section of the partition should be loaded.


    # Master boot record


    The Master boot record (MBR) is located at cylinder 0, head 0, sector 1 on a hard
    disk. It consists of three sections. The first section is 446 bytes long and is
    used to hold a small program loader. The next 64 bytes contain the partition table
    and the last section is a two-byte signature.


    Since the loader in the MBR is limited to 446 bytes, it generally calls a more
    sophisticated loader that is stored elsewhere on the disk. This small loader is
    also known as the first-stage loader. The larger loader that has more functionality
    is known as the second-stage loader. LILO and GRUB both have a first and second-stage
    loader. When you install them to the MBR only the first stage is stored there.


    When you install Linux, you have the option of installing the bootloader in the
    MBR or in the boot sector of the root partition. The default is to install it
    into the MBR. In most cases this works well. In some cases, it may prevent you
    from booting the operating system that was installed prior to Linux.


    Fortunately, LILO makes a copy of the MBR before it overwrites it. This copy is
    saved as /boot/boot.NNNN, where NNN depends on the device. You can manually back
    up the MBR. If you want to do this before you install Linux you will need to use
    a Linux boot disk to get


    # Backing up the MBR


    You can use the dd command to backup the MBR. The following command line will
    back up the MBR to a file, named MBR, on a floppy:


    ```

    # dd if=/dev/hda of=/dev/fd0/MBR bs=512 count=1

    ```


    The if and of options are the input file and output file, respectively. The bs
    option specifies the block size to use. The word count refers to the number of
    iterations that will occur before the command ends. Since the MBR is only 512
    bytes long, we specify a block size of 512 and this will back up the loader and
    the partition table.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 3-14 SAIR GNU: Installation and Configuration


    # Restoring the MBR


    You can restore the MBR with the same command that you used to back it up, but
    with slightly different options:


    ```

    # dd if=/dev/fd0/MBR of=/dev/hda bs=446 count=1

    ```


    This time the input file and output file are reversed. If you are restoring from
    a backup file created by LILO use if=/boot/boot.BNNN instead. If you only need
    to restore the first-stage loader you would provide a block size of 446 bytes.


    If you had Windows installed before installing Linux and wanted to revert back
    to the Windows bootloader, you could boot the system with a Windows 9x boot floppy
    and then run the command:


    ```

    fdisk /mbr

    ```


    If you had Windows NT/2000/XP installed you will need to to run Windows Setup
    and choose the Repair option. Choose the Inspect Boot Sector and Restore Startup
    Environment options.


    Do it!


    # C-1: Discussing startup issues


    | Questions and answers |

    |1 Why would you want to setup your system for multi-boot after compiling a new
    kernel?

    If the new kernel does not work, you can still boot to the old working kernel.

    2 You want to configure LILO to boot to a new kernel. What keyword do you need
    to use to specify this new kernel in the LILO configuration file?

    Image

    3 Where is the Master Boot Record (MBR) located?

    On the first sector of a hard disk—cylinder 0, head 0, sector 1 |'
  merge: -1
  img_proc: true
