- pgno: 75
  md: '# 4-12 SAIR Linux GNU: Installation and Configuration


    # Monitor limits


    In summary, the limits of a monitor are:


    +   - Size of the display (15, 17, 19 inches)

    - Dot pitch of the phosphor units in millimeters (.25,.28,.30 mm)

    - Maximum raster-scan sweep rate


    Note that the graphic mode (image resolution) is independent of the monitor. The
    following table represents example data taken from the user manuals of various
    monitors. The Units column represents the dot pitch in phosphor units of the same
    color. The diagonal is the distance in millimeters between phosphor units of the
    CRT. Addressability is the total display surface area the maximum resolution graphic
    mode that the monitor can accept. The Horizontal and Vertical columns show the
    minimum and maximum frequencies that the monitor can accept for each graphic mode.
    Note that exceeding these frequencies will damage the monitor.


    | Monitor | Units | Display area | Addressability | Horizontal | Vertical |

    |---|---|---|---|---||}{

    | old Magi 17" | .28mm | 300x225 mm | 1024x768 | 24-64 KHz | 55-90 Hz |

    | new Magi 17" | .28mm | 322x88.4 mm | 1280x1024 | 30-69 KHz | 50-120 Hz |

    | ViewSonic 17" | .27mm | 300x225 mm | 1280x1024 | 30-70 KHz | 50-120 Hz |

    | OptiQuest 19" | .26mm | 365x275 mm | 1600x1200 | 30-95 KHz | 50-150 Hz |

    | Seiko 20" | .31mm | 360x270 mm | 1280x1024 | 30-77 KHz | 50-90 Hz |

    | Sony 20" | .30mm | 350x280 mm | 1280x1024 | 28-85 KHz | 50-160 Hz |


    This table reveals four things about monitors:


    +   - Advertised monitor size in inches has little to do with actual display area.

    - Monitors accept graphic mode resolutions approximately 10 percent greater than
    can be supported by the number of phosphor units. (In other words, a person''s
    eyes are not the problem. The high resolution images are fuzzy!)

    - Graphic mode and maximum refresh frequency are independent.

    - Display refresh rates can be much higher for some monitors than is generally
    used. These higher refresh rates offer viewing comfort.


    # Changing graphic modes


    As the video adapter switches graphic mode frequencies, many monitors will chirp
    or make clicking sounds. The chirp comes from the change in frequency at which
    a large capacitor is being charged and discharged. The capacitor is used to adjust
    the sweep rate of the electron beam as it paints the screen.


    The first time a monitor syncs with a graphic mode refresh frequency, the CRT
    will have to be adjusted, or fine-tuned, for each frequency. Once tuned, the monitor
    stores these values for later reference. Most Linux distributions use a different
    default frequency for the same graphic mode.'
