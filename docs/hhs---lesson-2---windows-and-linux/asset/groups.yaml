    # 2.1. Introduction and Objectives


    This lesson introduces commands and basic tools for both Windows and Linux operating
    systems so that you can become familiar with them. These commands will be used
    to complete the exercises in the following lessons.


    At the end of this lesson, you should know the following commands:


    - General Windows and Linux commands

    - Basic network commands and tools

    - ping

    - tracert

    - netstat

    - ipconfig

    - route


    # 2.2. Requirements and Setup


    ## 2.2.1 Requirements


    For the lesson, the following are needed:


    - a PC with Windows 98/Me/2000/NT/XP/2003

    - a PC with Linux Suse/Debian/Knoppix

    - access to the Internet.


    ## 2.2.2 Setup


    ![](img/c27935123f59a22046d0a5f43d6d0b88_5_0.png)


    This is the setup in which you are going to work. It consists of your PC, with
    access to the Internet, and the ISECOM Hacker Highschool network, which you will
    access through the Internet. This is the network against which you will make most
    of the tests.


    Note that access to the ISECOM test network is restricted. In order to gain access
    to it, your instructor must contact the system administrator.


    # 2.3. System Operation: WINDOWS


    Most of the commands used for Windows are internal commands.


    ### 2.3.1 How to open an MS-DOS window


    To issue the commands, it is necessary to:

    1. Click the START button

    2. Choose the RUN option

    3. Type "cmd" if you are using Windows and press Enter. A window similar to the
    below will appear:


    ![](img/c27935123f59a22046d0a5f43d6d0b88_6_0.png)


    ### 2.3.2 Commands and tools (Windows)


    The commands listed below can be entered:


    | date | Display or set the date of the system |

    | time | Display or set the time of the system |

    | ver | Display the MS-DOS version that is being used |

    | dir | Display the list of subdirectories and files of a directory |

    | cls | Clear the screen |

    | mkdir | Make a directory with the name "directory" |

    | chdir, cd | Display the name or change the current directory to "directory"
    |

    | rmdir | Delete the directory with the name "directory" |


    # 2.4. System Operations: Linux


    # LINUX – BASIC COMMANDS IN LINUX AND WINDOWS


    | free | Display the structure of folders of a path in text-graphic format |

    | chkdsk | Check a disk |

    | mem | Show the amount of memory used and free in the system |

    | rename | Change the name of files |

    | ren | Change the name of files |

    | copy | Copy one or more files to another location |

    | move | Move file and change the name of files and directories |

    | type | Type the content of one or more text files |

    | more | Display the information screen by screen |

    | delete, del | Delete one or more files |


    Note: The words in italics are not commands, and must be replaced by the desired
    values. For example, "delete" and "del" are the same command.


    # Tools


    | ping host | Verify contact with the machine "host" |

    | The command ping sends "packets" by ICMP (Internet Control Message Protocol)
    to another computer, to learn whether it is accessible through the network. In
    addition, it shows a statistical summary about the percentage of packets that
    have not been answered and the response. The name of the machine can be used directly
    or its IP address. |


    Examples: ping www.google.com

    ping 193.145.85.2


    Some options are:

    - n: send n packets

    - t: ping the specified host until stopped (press CTRL+C to end)


    To see more options: ping /h

