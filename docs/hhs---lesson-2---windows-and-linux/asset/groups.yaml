    # 2.4. System Operations: Linux


    Just as in Windows, if you are using Linux, a great majority of the commands that
    you will use are executed from a console emulation window. Therefore, we will
    next learn how to open a console window in Linux.


    ![](img/c27935123f59a22046d0a5f43d6d0b88_9_0.png)


    # 2.4.1 How to open a console window


    To use the following commands, it is necessary to open a console window:


    +   1. - Go to the START APPLICATION button

    2. - Select "Run Command"

    3. - Enter "konsole"

    4. - A window similar to the following one will appear:


    ![](img/c27935123f59a22046d0a5f43d6d0b88_9_1.png)


    +   5. - Now the commands and tools listed below can be entered.


    # 2.4.2 Commands and tools (Linux)


    Commands


    | pwd | Display the name of the current directory. |

    | hostname | Display the name of the local host (the computer which you are currently
    using) |


