    # Basic command equivalences for Linux/Windows


    This is a table showing the basic command equivalences between Linux and Windows.
    Commands are executed from a shell (in Linux) or from a MS-DOS window (in Windows).


    | Linux | Windows |

    | --- | --- |

    | command --help | command /h, command / |

    | man command | help_command |

    | cp | copy |

    | m | del |

    | mv | move |

    | mv | ren |

    | more, less, cat | type |

    | lpr | print |

    | rm -R | delete |

    | ls | dir |

    | cd | cd |

    | mkdir | md |

    | rmd | rd |

    | route | route print |

    | traceroute -l | tracert |

    | ping | ping |

    | ifconfig | ipconfig |'
