    # Tools


    | ping host | Verify contact with the machine "host" |

    |---| The command ping sends "packets" by ICMP (Internet Control Message Protocol)
    to another computer, to learn whether it is accessible through the network. In
    addition, it shows a statistical summary about the percentage of packets that
    have not been answered and the response. The name of the machine can be used directly
