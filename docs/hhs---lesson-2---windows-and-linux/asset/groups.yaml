- md: '

    # LINUX 02 – BASIC COMMANDS IN LINUX AND WINDOWS


    tracer host


    Show the route that packets follow to reach the machine "host"


    The command tracer is the abbreviation of trace route, which allows you to learn
    the route that a packet follows from the origin (your machine) to the destination
    machine. It can also tell the time it takes to make each jump. At the most, 30
    jumps will be listed. It is sometimes interesting to observe the names of the
    machines through which the packets travel.


    Examples: tracer www.google.com

    tracert 193.145.85.2


    + Some options:

    - h: to specify N, at the most, jumps.

    - d: to not show the names of the machines.


    To see more options: tracer


    Display information on the active interfaces (ethernet, ping, etc.) in the computer.


    + Some options:

    /all: to show details

    /renew name: renews connection with "name" when automatic configuration with DHCP
    is used

    /release name: deactivates matching connections with automatic configuration with
    DHCP is used.


    ipconfig


    To see more options: ipconfig /?


    Display the routing table


    route print


    The command route serves to define static routes, erase routes or simply to see
    the state of the routes.


    + Some options:

    print: to show the list of routes.

    delete: to delete a route.

    add: to add a route.


    To see more options: route/?


    Displays information on the status of the network and established connections
    with remote machines.


    netstat


    + Some options:

    -a: to sample all connections and listening ports

    -n: to display addresses and port numbers in numeric form

    -e: to sample Ethernet statistics


    For example: netstat -an


    To see more options: netstat /?


    # LINUX – BASIC COMMANDS IN LINUX AND WINDOWS


    For additional information on these commands and tools type "command /h" or "help
    command" from a MS-DOS window.


    For example, for additional information on the tool netstat, we have three possibilities:


    + 1) netstat

    2) netstat /?

    3) help netstat


    ## 2.4. System Operations: Linux


    Just as in Windows, if you are using Linux, a great majority of the commands that
    you will use are executed from a console emulation window. Therefore, we will
    next learn how to open a console window in Linux.


    ![](img/c27935123f59a22046d0a5f43d6d0b88_9_0.png)


    ### 2.4.1 How to open a console window


    To use the following commands, it is necessary to open a console window:


    + 1. Go to the START APPLICATION button

    2. Select "Run Command"

    3. Enter "konsole"

    4. A window similar to the following one will appear:


    ![](img/c27935123f59a22046d0a5f43d6d0b88_9_1.png)


    + 5. Now the commands and tools listed below can be entered.


    ## 2.4.2 Commands and tools (Linux)


    Commands


    | pwd | Display the name of the current directory. |

    | hostname | Display the name of the local host (the computer which you are currently
    using) |

    | finger user | Display Information on the user "user" Example: finger root |

    | ls | List the content of the directories Example: ls | |

    | cd directory | Change from current directory to "directory". If no directory
    name is specified it changes to the home directory. Example: For the login name
    "mylogin" the command $cd changes the directory to /home/mylogin. Example: $cd
    - changes to the last visited directory. Example: $cd /tmp |

    | cp source dest | changes to the file "source" to the file "dest". Copy the file
    Example: cp /etc/passwd /tmp |

    | rm file | Delete only the owner of the file (or root) can delete it. Example:
    rm myfile |

    | mv source dest | Move or rename files and directories. Example: mv oldname |

    | mkdir directory | Make a directory with the name "directory" |

