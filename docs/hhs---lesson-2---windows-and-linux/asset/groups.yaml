    # LINUX 02 – BASIC COMMANDS IN LINUX AND WINDOWS


    tracer host


    Show the route that packets follow to reach the machine "host"


    The command tracer is the abbreviation of trace route, which allows you to learn
    the route that a packet follows from the origin (your machine) to the destination
    machine. It can also tell the time it takes to make each jump. At the most, 30
    jumps will be listed. It is sometimes interesting to observe the names of the
    machines through which the packets travel.


    Examples: tracer www.google.com

    tracert 193.145.85,2


    +   Some options:

    - h: to specify N, at the most, jumps.

    - d: to not show the names of the machines.


    To see more options: tracer

    Display information on the active interfaces (ethernet, ping, etc.) in the computer.


    +   Some options:

    /all: to show details

    /renew name: renews connection with "name" when automatic configuration with DHCP
    is used

    /release name: deactivates matching connections with automatic configuration with
    DHCP is used.


    ipconfig


    To see more options: ipconfig /\nDisplay the routing table


    route print


    The command route serves to define static routes, erase routes or simply to see
    the state of the routes.


    +   Some options:

    print: to show the list of routes.

    delete: to delete a route.

    add: to add a route.


    To see more options: route/?\nDisplays information on the status of the network
    and established connections with remote machines.


    netstat


    +   Some options:

    -a: to sample all connections and listening ports

    -n: to display addresses and port numbers in numeric form

    -e: to sample Ethernet statistics


    For example: netstat - an


    To see more options: netstat/?'
