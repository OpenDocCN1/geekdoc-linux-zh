  md: '# LINUX 2 – BASIC COMMANDS IN LINUX AND WINDOWS


    free directory


    Display the structure of folders of a path in text-graphic format

    Example: c:\tools


    chkdsk


    Check a disk and show a status report


    mem


    Show the amount of memory used and free in the system


    rename


    Change the name of files


    ren source dest


    Example: ren oldname newname


    copy source dest


    Copy one or more files to another location

    Example: copy c:\myfile.txt c:\tmp


    move source dest


    Move file and change the name of files and directories

    Example: move c:\myfile.txt c:\tmp


    type file


    Type the content of one or more text files

    Example: type c:\myfile.txt


    more file


    Display the information screen by screen

    Example: more c:\myfile.txt


    delete, del file


    Delete one or more files

    Example: del c:\myfile.txt


    Note: The words in italics are not commands, and must be replaced by the desired
    values. version: for example, "delete" and "del", are the same command.


    # Tools


    | ping host | Verify contact with the machine "host" |

    |---| The command ping sends "packets" by ICMP (Internet Control Message Protocol)
    to another computer, to learn whether it is accessible through the network. In
    addition, it shows a statistical summary about the percentage of packets that
    have not been answered and the response. The name of the machine can be used directly
    or its IP address. |


    Examples: ping www.google.com

    ping 193.145.85.2nSome options are:

    - n: send n packets

    - t: ping the specified host until stopped (press CTRL+C to end)


    To see more options: ping /h'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# LINUX 02 – BASIC COMMANDS IN LINUX AND WINDOWS


    tracer host


    Show the route that packets follow to reach the machine "host"


    The command tracer is the abbreviation of trace route, which allows you to learn
    the route that a packet follows from the origin (your machine) to the destination
    machine. It can also tell the time it takes to make each jump. At the most, 30
    jumps will be listed. It is sometimes interesting to observe the names of the
    machines through which the packets travel.


    Examples: tracer www.google.com

    tracert 193.145.85,2


    +   Some options:

    - h: to specify N, at the most, jumps.

    - d: to not show the names of the machines.


    To see more options: tracer

    Display information on the active interfaces (ethernet, ping, etc.) in the computer.


    +   Some options:

    /all: to show details

    /renew name: renews connection with "name" when automatic configuration with DHCP
    is used

    /release name: deactivates matching connections with automatic configuration with
    DHCP is used.


    ipconfig


    To see more options: ipconfig /\nDisplay the routing table


    route print


    The command route serves to define static routes, erase routes or simply to see
    the state of the routes.


    +   Some options:

    print: to show the list of routes.

    delete: to delete a route.

    add: to add a route.


    To see more options: route/?\nDisplays information on the status of the network
    and established connections with remote machines.


    netstat


    +   Some options:

    -a: to sample all connections and listening ports

    -n: to display addresses and port numbers in numeric form

    -e: to sample Ethernet statistics


    For example: netstat - an


    To see more options: netstat/?'
  merge: -1
  pgno: 8
