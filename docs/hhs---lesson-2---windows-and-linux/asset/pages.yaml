  md: '# 2.5. Exercises


    # 2.5.1 Exercises in Windows


    +   1. Go to a MS-DOS window.


    +   2. Identify the version of MS-DOS that you are using. What version have you
    detected? What command have you used?


    +   3. Identify the date and time of the system. If they are incorrect, modify
    them so that they are correct. What command have you used?


    +   4. Identify all the directories and files that are in "c:\". What command
    have you used?


    +   5. Create the directory c:\lesson0. Copy in this directory all the files with
    the extension ".sys that are in "c:\". What files have you found? What commands
    have you used?


    +   6. Identify the IP address of your host. What command have you used? What
    IP address do you have?


    +   7. Trace the route to "www.google.com". Identify IPs of the intermediate routers.


    # 2.5.2 Exercises in Linux


    +   1. Identify the owner of the file "password". (Note: first locate where this
    file is). What command have you used?


    +   2. Create the directory "work" in your home directory (for example, if your
    login is "mylogin", create the directory in "home/mylogin", and copy the file
    "password" in the directory "work" that you have created. Identify the owner of
    the file "password" that has been copied.


    +   3. Create the directory "hide" in the "work" directory. List the contents
    of this directory. What did you have to see the contents of directory "hide",


    +   4. Create the file "test1" with the content "This is the content of the file
    test1" in the "work" directory, Create the file "test2" with the content "This
    is the content of the file test2" in the "work" directory. Copy into a file named
    "test" the content of previous files. What commands have you used?


    +   5. Identify the name and the IP address of your machine. What commands have
    you used? What IP address do you have?


    +   6. Trace the route to "www.google.com". Identify IPs of the intermediate routers.


