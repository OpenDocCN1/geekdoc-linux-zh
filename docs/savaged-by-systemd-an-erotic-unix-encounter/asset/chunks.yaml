    # Savaged by Systemd


    ### an Erotic Unix Encounter


    ## Michael Warren Lucas


    [![Tilted Windmill Press](images/00003.jpeg) ![Tilted Windmill Press](images/00002.jpeg)](http://www.tiltedwinmillpress.com)


    ### Contents


