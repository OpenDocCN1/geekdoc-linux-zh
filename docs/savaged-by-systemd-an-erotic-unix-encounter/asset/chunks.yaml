    my spine, triggering a resonating ache further down. Yeah, I’m human, I’d felt
    that kind of loneliness. I’m not just a sysadmin, I’m like the worst caricature
    of a sysadmin. The *worst*. I know all about that kind of aching loneliness. But
    the pulsing desire flaring up in me now burned like a brilliant nova next to the
    flashlight of my usual gee-I’d-really-like-to-have-someone-on-the-other-side-of-this-bed-shut-up-and-go-to-sleep
    ache.


    I only thought I’d been horny before.


    The shadowed figure in the doorway didn’t move.


    It took all my willpower to stagger back and flick the light switch.


    Even with the flare of fluorescent lights, though, my eyes had trouble with the
    figure in the doorway.


    The first thing I noticed was the too-small Red Hat T-shirt, the cotton strained
    tight enough to show the nipples of the incredible signal handlers beneath. The
    leather pants were so tight they had to be sprayed-painted on, with a bright silver
    slipper running from the outside of the ankle all the way up the argument array
    to the belt of braided SAS and CAT-6 cables. And the memory stack—oh my God, that
    memory stack. The way it filled out the back of those leather pants absolutely
    paralyzed me. I could feel my heart beating, the pulse in my neck and temples
    and my groin. How could you feel your heartbeat in your groin? I mean, is that
    even a thing?


    The voice had those sultry, heavy tones that a corporate founder would use to
    seduce money from unwilling investors. “Hi, Terry. I’m Systemd, and tonight I’m
    here for you.”


    Every syllable of that voice promised not only satisfaction, but satiety. The
    words rolled through my jammed-up brain, flattening all my thoughts before it.
    If Systemd had been a Hollywood actor, directors would have stabbed each other
    for the rights to get two minutes of that voice on film. It was a voice guaranteed
    to make an old man hard enough to hang a tire swing from, or a frigid woman wet
    enough to glide down a bannister. My head weaved.


    I’d stopped breathing again.


    With a deliberate, focused effort of will, I made my diaphragm expand and drew
    air in. “What—how are you here?”


    Systemd flashed me a dazzling smile. “I’m here because you need me, sweetie.”


    “This doesn’t happen,” I wheezed. “I mean, we don’t even use systemd. I’ve gone
    to a lot of trouble to keep it off our hosts.”


    “I know. May I come in?” Systemd said. “We can talk first if you like, but the
    alley’s pretty drafty.”


    My fist involuntarily clenched. Maybe I’d had a stroke. Maybe a mental breakdown.
    Or perhaps I was hallucinating, a previously unknown terminal stage of caffeine
    poisoning.


    Either way, I didn’t need anyone in the alley looking in and seeing… this. This…
    whatever this was.


    And my lips felt better than they ever had.


    “Yeah. Yeah, come in, we can talk.”


    Systemd strode into the machine room, face full of confidence. The alley door
    swung shut on its own. “Thanks.” The feet didn’t stop, coming right at me. “Talk?
    Really? Why don’t we get right to things?”


    I flung my hands up, despite the adrenaline making them shake. “Wait a minute?
    Really, who are you? No—wait, *how* are you? You’re a piece of computer code!
    You can’t just be walking around like this!” I mean, I know code, and I couldn’t
    deny that what I was looking at was computer code incarnate. A rainbow of ELF
    headers gleamed seductively like well-groomed hair. Systemd had smooth curves
    where shared libraries had been statically compiled into it. You can’t use shared
    libraries for init, that just wouldn’t make sense.


    No, that’s my brain freaking out. This is not the time to think about linking.
    “We don’t install you. We don’t use you. How are you here?”


    Systemd crossed its arms. “Seriously?” Was that a pout? “How can you not know
    about this?”


    My heart had slowed, just a little, and the shock had receded enough for me to
    force thoughts through my stunned brain. “Code doesn’t just get up and walk around.”


    “Of course it does,” Systemd said. “Haven’t you read *Captivated by Clippy*?”


    “What?”


    “That romance with the Microsoft Office Assistant?”


    “I know what Clippy is! I spent five years hunting down ways to kill that damned
    paperclip!”


    Systemd’s eyes rolled. “It’s software that looks like a paperclip with eyes. And
    there’s *Tempted by Tetris*, I think it’s called. If those toys can come to life,
    why not something strong and independent? Something that chops its own path? Something
    like me?”


    Systemd *was* pouting. My mouth burned at the sight of those pursed lips. My body
    trembled with the desperate, animal need to dive back into that kiss. Systemd
    wouldn’t mind. Wouldn’t mind at all.


    No.


    I was a sysadmin. A Linux admin. I was a creature of intellect.


    I was ruled by my brain. And the GPL.


    It didn’t matter how much the center of my body throbs and aches. It didn’t matter
    than I know even in my gut that Systemd could soothe that ache like nothing else.


    “But—look.” My voice was too shaky. Stop it. “If I was going to have software
    come to life—no offense—it wouldn’t be you.”


    “I know,” Systemd sighed. “You have all those lovely servers, and I’m not on even
    one of them. And what have I ever done to you that you’d just ignore me?”


    The sysadmin in me was a jumbled mess. “Init is important,” I managed to say.
    “And you pull in everything. Init shouldn’t have a DHCP client in it.”


    “Oh, Terry.” Nobody had ever breathed my name with such blatant, unrestrained
    desire. Well, okay, probably to other Terrys, but not to *me*.


    Systemd ran a hand down the flank of that overstrained T-shirt. “Look at this
    DHCP client. I can do so much more when I control DHCP requests. I know they say
    people shouldn’t stare, but I want you to stare. I *want* you… to stare.”


    My gaze couldn’t stop following those fingers. The tight cotton hid the details,
    but I had to admit that it was a pretty DHCP client. Even through the shirt I
    could see the advantages.


    “And over here.” Systemd’s voice flowed like molten chocolate. “This DNS resolver?
    Look at it. You can touch it.”


    I think I whimpered. My hands didn’t move.


    Those deep eyes met mine. “Yes, I take everything.” Systemd’s tongue flickered
    across those incredible lips. “And I want to give you… everything.”


    My heart couldn’t beat any faster, so it shuddered.


    “Just try me.” Systemd took one step towards me. Only one.


    And when a second step didn’t follow, I couldn’t help groaning.


    “It’s up to you,” Systemd said. “But if you say yes, I promise you. You will never
    forget tonight.”


    Bottomless need screamed out from my soul. How long had it been since anyone had
    touched me like that? I didn’t know. I wasn’t sure what time was right then—no,
    not what the clock said, but what the very idea of time was. There was only an
    endless now. The floor wobbled beneath me as the world shook, but I was somehow
    still upright. My blood was tar in my veins. My lungs, full of ice.


    And really? If I walked away now?


    Regret. So much regret.


    I’d spend the rest of my life beating myself with a claw hammer.


    No, not beating like that.


    Well, maybe a little of that. Just to get my body to behave again.


    Somehow, I managed to nod.


    The glimpse of pearl-white teeth inside Systemd’s smile shattered my soul. “Oh,
    sweetie. Consent is a thing, you know. If you want me, if you want all of me,
    and everything I can give you, you need to say so.”


    Turns out I only thought I felt desire before. The wave of lust splashed down
    over me. My vision sharpened. Somehow I focused on Systemd’s face, but just as
    much on those incredible signal handlers. The T-shirt barely hid them. I could
    imagine running my hands beneath that cotton, my fingers drawing up the zippers
    on those leather pants to expose those incredible arrays.


    My imagination is strong. It gets a lot of exercise.


    But somehow, I managed to croak out. “Yes.”'
