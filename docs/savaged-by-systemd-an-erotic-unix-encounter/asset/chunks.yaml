  raw: 'Server failure is a sysadmin’s worst-case situation. Still, I needed long
    minutes to pull my thoughts together. To find my hands, my legs. My fingers ached
    when I wiggled them—how had that happened? My jawbone ached and my tongue felt
    ready to seize with a Charlie horse, but I figured I knew perfectly well how I’d
    strained *them*.


    My groin was a sodden ruin drying towards stickiness.


    I shouldn’t have expected anything else.


    I guess my last significant other was right. I understood code a hell of a lot
    better than I understood people. That encounter with Systemd had left me shaking
    and exhausted and weirdly content.


    But as my brain came together, I didn’t like what else I saw.


    Two of the server racks had somehow been knocked inches aside. No small trick
    when a rack is weighted down with hundreds of pounds of computers. The console
    table was outright tipped over, monitors and keyboards and mice scattered everywhere.
    One of the flat screen monitors had a chair leg straight through it.


    And how had the case gotten off of the accountant’s Windows server? I was absolutely
    certain the evening hadn’t involved Minesweeper.


    Eventually, I reassembled enough of myself to move.


    First, pants. I couldn’t find that sad pair of underwear, so I had to go commando.
    The jeans were dusty-dirty, which made a fine brew with the sticky sweaty mess
    covering my legs. My LinuxFest T-shirt was rags, but I’d had an unused Oracle
    T-shirt in the bottom drawer of my desk for, what, five years now?


    Not that I was ever going to install Oracle, but it’s not like anyone would see
    me in the shirt.


    My phone had slid beneath the workbench. It was letting out its own chirp. A touch
    of the screen revealed dozens and dozens of alerts from the monitoring system.


    I studied the wreckage of the computer room for another minute, overwhelmed by
    the destruction, then staggered back out to my desk to grab my laptop.


    One in the morning? How had it gotten to be one in the—no, never mind. I fortified
    myself with a cold cola from the fridge and booted my laptop.


    Surprisingly, all of the Linux hosts were still up. Yes, a bunch of them had triggered
    error conditions, but strictly speaking, every service was still available.


    But those pristinely maintained packages?


    Somehow, systemd had been splattered across every one of them. Every container,
    every croup, now ran subordinate to systemd.


    I tried to think. It wasn’t easy, not even with a second cola.


    I’d fastidiously avoided systemd.


    Systemd had knocked on my door.


    And I’d let it come in.


    Yes, I’d been kind of stunned at what kind of functions it had taken over, but
    that wasn’t the point. I’d invited it in.


    Like a vampire.


    Sex was one thing. I freely admit it, I’m a big fan of sex, even though I don’t
    get it often. And tonight reminded me just how much I missed it.


    But I’d given my life to my machines.


    And suddenly, I realized the choice that lay before me.


    I could keep systemd on those hosts, and maybe Systemd would return.


    But if I uninstalled the software, if I exorcised systemd from those hard drives,
    Systemd would take that as a kick to the gut.


    And never return.


    My heart started beating harder again.


    The systemd package had ripped through these hosts. While the chorus of unsynchronized
    alarm beeps made every host indistinguishable from the others, the light-up alarm
    on the faceplates differentiated each. The bezel on the main load balancer had
    a fast blue blink. One of the main hard drives had failed.


    I couldn’t see how a software package would cause the hard drive to fail.


    I flushed as I remembered Systemd and I backing up into that rack, though. We’d
    hit it pretty hard.


    God, tonight had been spectacular.


    And it might happen again.


    All I had to do was clean up this mess, and accept systemd into my servers.


    Or rip it out, and stay alone.


    My throat tightened. There’s a big market for forty-something systems administrators,
    yes.


    But not on the dating markets.


    But my servers.


    My tidy, pristine, servers.


    I’d built everything out of time-tested Unix components. Software that had worked
    perfectly for decades. My systems—okay, the company systems, but still, *my* systems—they
    worked flawlessly.


    Systemd wasn’t merely new. I’d seen exactly how slapdash it was. What sort of
    trouble it would cause next? What functionality would it swallow with a hacked-together
    implementation?


    My experience crashed headlong into my loneliness.


    My aching hands froze on my keyboard.


    No, it was worse than that.


    More and more distributions added systemd. It had a way of slipping into places
    you’d never expect it. Yes, Devuan was almost defined as “Debian without systemd,”
    but still, things happened.


    Someday I’d need a piece of software that required systemd. And I wouldn’t be
    able to work around it.


    As long as I kept my Linux hosts, I ran the risk of systemd.


    Suppose I kept the software? Invited Systemd back?


    Then I’d spend all my time fighting alarms and dysfunctions. Systemd swallowed
    functionality like mad.


    Were nights of wild sex worth fighting software failures every other moment?


    But after that night of wild sex, the thought of a life alone left me as barren
    as a nuclear test site. Besides—sex with software? Who knew if or when Systemd
    would return? Had it just been that the Stars Were Right?


    Maybe I could get counseling. Learn how to get a date. It couldn’t be *that* hard.
    Not with some of the idiots that pulled it off.


    Blinking alarms or booty calls.


    Choose.


    I don’t know how long I stared into the devastated computer room.


    But finally, I opened my web browser.


    In one tab, I did a search for counseling services.


    In the second, I picked a couple of BSDs to try.


