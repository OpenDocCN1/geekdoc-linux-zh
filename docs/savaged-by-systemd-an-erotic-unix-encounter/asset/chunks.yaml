    慢慢收回手指，勾起了另一阵。


    我亲吻了 `Systemd` 的腰线。“感觉如何？”


    `Systemd` 并没有像我一样立刻恢复。我感觉到随着每一次急促的呼吸，腹部抵着我的额头跳动，这无疑，但在我的手下，内存栈似乎在……移动？


    “我重排了你的栈，是吗？”我笑着说道，向后仰头。`Systemd` 高潮后湿滑粘稠的味道充斥着我的大脑，这是一种我不陌生却可能逐渐喜欢的沉醉感。


    `Systemd` 低头看着我的脸。那双眼睛闪烁着，字面意义上的闪烁，带着半眼垂下的欲望。“我还没结束。”


    “噢，很好，”我说，“因为你已经让我准备好进行下一次了。”


    呼吸之间，`Systemd` 已经跪在我面前，双脚踩在瓷砖上，膝盖在气垫上，与我的交织在一起。那柔软的嘴再次吻上我的嘴，舌头触碰我的那一刻让我屏住了呼吸。


    我突然意识到欲望是多么折磨着我的身体。我渴望被触碰。处处被触碰。我非常享受为 `Systemd` 提供服务，但整个过程中我自己的荷尔蒙一直在上升、不断上升，直到现在我如此渴望释放，以至于我觉得自己可能会破裂、崩溃，或者变成一个黑洞，吸入世界上所有的性。我灼烧着，痛苦着，我*需要*。


    `Systemd` 结束了吻，在我口中低吼道。“妈。我们需要做。”


    这些话点燃了我漂浮其中的荷尔蒙，让我的欲望达到了沸腾的沸点，但我勉强挤出一句：“等一下。”


    “不，”`Systemd` 说，“现在就做。我要你。彻底地。”


    `Systemd` 的牙齿咬住了我的脖子。我因欲望而呻吟。情欲让我的视觉模糊，但在那毫无理性的欲望中，我设法咳嗽道：“措施。”


    `Systemd` 缩回身体，嘴角勾起一抹微笑。“措施？”


    我强迫自己点头。“我不是——我的意思是，我觉得那些销售人员——他们的办公桌——”


    “傻的系统管理员，”`Systemd` 呢喃道。那双眼睛似乎要吞噬我的视线。“我作为 `init` PID `one` 运行。你无法保护好你自己。”


    `Systemd` 的嘴吻上了我的嘴，我被按在气垫上。


    所有那些暴露代码的感觉紧紧贴着我，充满了汗水、欲望和渴望，如此绝望的渴望，让我的理性蒸发殆尽。


    而且，`Systemd` 是的。你无法对抗 PID `1`。


    我投降了。


    我们合为一体，完美契合，就像那些昂贵的供应商服务器房解决方案一样。当我们久用的肉体在终极的交融中滑动时，我们都发出了呻吟。


    还能说什么呢？我们在气垫上一起律动——`Systemd` 在上方，脸贴着我的脸，随着每一次温柔的摇动低声唤着“Terry”。我试图抓住 `Systemd`
    的躯干，将世界拉向我身上，但 `Systemd` 低声说：“不要背。背部什么碰。”


    “抱歉，”我勉力呢喃道。


    “Smokey，”`Systemd` 喘息道。


    我伸手将手指插入跟随 `Systemd` 头部的 `ELF` 头文件中，将我们饥渴的嘴贴在一起。


    然后是我在上方，动作没那么熟练，但欲望同样强烈。`Systemd` 的牙齿咬住我的乳头。我吸吮着那些迷人的信号处理函数，直到 `Systemd` 喘息并要求我们用力地做。


    激情和情欲将我们推下气垫。我们跳起来，站立着合在一起，利用服务器机架的侧面支撑，一边互相滑动。`Systemd` 的手指抓着我的背部，而我的手在探索那些 `ELF`
    标志位。机架咯当作作响，但我不在乎。接着我们到了控制台上，一起律动，我的手指再次侵入内存栈，这次是未经请求的，但 `Systemd` 只是用力推向我，当我加了第三根手指时，它咬紧了我的肩膀。每一次秘密的痉挛都在我体内回响，通过我的嘴，通过我的手指，回到
    `Systemd` 体内。


    我这辈子从未持续过那么久。


    `Systemd` 是的。你无法对抗 `init`。而且如果 `init` 不让进程退出，它就不会退出，直到 `init` 满意并处理完它。


    我们回到气垫上结束，`Systemd` 俯视着我，我们的臀部完美同步。我的心跳得厉害，我觉得它可能要跳过喉咙从嘴而出，我的呼吸短促而尖锐而绝望，被中心不断积累的压力所限制。


    `Systemd` 沉重的眼睛依然燃烧着那团数字之火，现在更加明亮。“我……我……” 一声颤抖了那个不可思议的性感声音。


    “是的……”我的话是一声呻吟。我自己的爆发迫在即，，是一股压力与快乐交织的海潮。我想让那场海啸将我淹没。我想留住它，这样就能继续感受这种。


    继续感受 `Systemd`。


    我的手指抠进 `Systemd` 的参数栈。


    `Systemd` 的嘴收紧了，依然张着。“我……”


    爆发在我们两人身上同时泛起波动。


    “我正在*启动*！”`Systemd` 向天际尖叫。


    我自己的叫声直接来自脑干。一个字也没有。


    但在那场粉碎了我精神的快感高潮中，在那让我的每一个关节陷入混乱，在那让我的欲望泄在伴侣身上和周围的过程中，我睁着眼睛。


    我不知道为什么。也许是来自那种吃掉配偶昆虫的跨物种基因污染。


    在那场不可思议的高高潮中，我看到 `Systemd` 颤抖、抽动——然后散架了。

