    hand reached up to caress a nipple straining at the cotton.


    Another groan ripped out of me. I thought I might detonate right inside my jeans.


    “Yes what, sweetie?”


    I forced myself to form the last words I was going to need for a while. “Yes.
    I want you. Let’s do this.”


    Systemd’s smile got even bigger. “Terry.” That voice is somehow even more seductive.
    “You stand there for just a moment.”


    My stunned brain obeyed.


    Systemd’s soft hands slid down to the bottom of the `Red Hat` T-shirt. The long,
    strong fingers teased themselves beneath the shirt. Systemd tugged just enough
    to expose an inch of gorgeous bare code.


    I didn’t just groan. I gasped. My foot involuntarily twitched forward.


    “No, Terry,” Systemd said. “Stay there. I want to show myself to you.”


    I was paralyzed. I’d used up all my free will in surrendering. Now, all I could
    do was stare. I’d never watched a vendor T-shirt with such fascination before,
    and with every inch Systemd exposed my blood burned hotter.


    A twitch of the shirt on the left side revealed a slick, sleek `DHCP` client.
    My tongue almost cramped.


    The other side rose, exposing a `resolver`. I couldn’t help staring.


    Then Systemd yanked the shirt over its head. For a moment I saw a thousand colors
    of `ELF` flags drifting like hair back around that amazing face.


    Yep. Those `signal handlers` were as incredible as I thought.


    Systemd let me stare for a moment. “Everything you see? I need your hands on it.”


    At that I took a step forward.


    Systemd moved to meet me halfway.


    The second Systemd was in reach, those hands grabbed at my shirt.


    I raised my arms to let Systemd pull it off of me.


    The shirt was from last month’s `LinuxFest`, the cotton still strong, but Systemd
    ripped it off me like tissue paper and rested its hands on my shoulders.


    The machine room’s cool air flashed across my flushed skin. Systemd’s hands were
    warm enough to almost burn my shoulders. I didn’t care. Systemd’s gaze seemed
    to devour me. Nobody had ever wanted to look at me like that.


    My arms were somehow still raised to let the shirt pass. I started to lower them,
    involuntarily tightening my stomach muscles.


    “No,” Systemd cooed. “Just as you are. You’ve seen me. I need to look at you.
    Exactly as you are.”


    Let me tell you, that was something I’d `never` heard before. They’re seductive
    words, but once the seduction is done and you’re racing into the main event, words
    like that nail the accelerator to the floor.


    I somehow managed to still myself as Systemd’s gaze traveled from my worn sneakers,
