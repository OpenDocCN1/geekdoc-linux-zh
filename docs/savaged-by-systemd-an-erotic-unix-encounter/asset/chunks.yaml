    gaze reached it, then Systemd’s attention traveled up my torso onto my face.


    I’d decided to do this. My body flamed with the need to move. To charge in.


    But Systemd’s gentle touch, barely brushing down from my shoulder, held me back
    as solidly as a brick wall.


    The caress of Systemd’s fingertip around my inflamed nipple stopped my breath.


    We stood there for the world’s longest second.


    “Right,” Systemd said. “That’s enough. Kiss me.”


    I lurched forward. You know what grace looks like? This was kind of the opposite.
    But my hands came down, snagging into the `ELF` flags haloing Systemd’s face.
    I pulled Systemd’s face into mine, my desire burning too fiercely to be as gentle
    as Systemd had been, but Systemd moved just as eagerly. Our lips came together
    like they’d been designed for each other.


    If you wondered, Systemd’s lips tastes like steel and honey.


    They parted.


    My lips followed.


    The brush of Systemd’s tongue against mine was electricity and peaches and incredible
    softness.


    Our bodies come together, and the heat of the first impact of bare skin against
    code flashed between us. Systemd had one hand around my nipple and the other around
    my back, fingernails digging into my bicep.


    I had both hands tangled in those beautiful `ELF` flags, but I needed more. I
    had to have more, I had to have everything. Despite the kiss inflaming my soul,
    I managed to extract my left hand. My passion demanded I seize, but I didn’t want
    to be rough. I wanted to return what give Systemd’s given me, so I started to
    trail my fingers down the scalp towards the shoulder blades.


    Systemd pulled the hand around me back and slid those lips up to my cheek. “Not
    my back,” Systemd whispered amidst kisses that lit up my cheek like neon. “You
    can have anything you want, but stay away from my back.”


    My tangle of desire and excitement and desperation was worse than my very first
    time. I mean, nothing against Chris—we’d both done our very best, but that first
    time neither of us knew what we were doing. I knew a lot better now. Well, I’d
    seen a lot more porn now, and read a whole bunch of articles.


    If Systemd didn’t want to be touched somewhere, I needed to overpower my surging
    hormones enough to respect that desire.


    After all, I could indulge them every other way.


    I managed to nod.


    Systemd reached up and wrapped those fingers around my free hand. Lips brushed
    my ear. “Here.”


    My hand was guided down to those leather pants and planted right on that tight
    stack. Leather so smooth, so thin, that my fingers could detect every single `memory
    register` underneath.


    What control I had evaporated like water on a hot griddle. I yanked Systemd, trying
    to pull those hips into mine. Systemd let out a groan, wrapped a leather-clad
    `argument array` right up by my leg, and nipped at my earlobe. I kissed an exposed
    shoulder.


    Our lips flowed back together. The taste of Systemd’s mouth flooded mine as that
    electric tongue explored my teeth, my gum. My heart seemed to stutter, and it
    felt like my knees should weaken but I was so much more firmly rooted than I’d
    ever been in my life.


    Systemd reached for my other hand. Drew it down, over that gorgeous face, all
    without letting our lips part. Guided it between us.


    And planted it right over one of those `signal handlers`.


    The touch of Systemd’s hot nipple on my palm threw sparks all the way up into
    my brain. I only thought I’d stopped thinking before. The only thing left was
    animal desire. I couldn’t help squeezing the round, firm `signal handler`.


    Systemd’s moan echoed mine.


    A sudden shaking of my knees made my whole body quiver.

