    # **Use X to Configure X1**


    The XFree86 4.0.1 XFree86 server may be used to configure X. To attempt a configuration,
    log in as root, and use the server on the command line like this:


    ```

    # xfre86 --configure

    ```


    After you press Enter, your screen may blink several times. When done, you will
    find a file named XFree86Config.new in /root directory. You can then use the startx
    command to start a test X session like this:


    ```

