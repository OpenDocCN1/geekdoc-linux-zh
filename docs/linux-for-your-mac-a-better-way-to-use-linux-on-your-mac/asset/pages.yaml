    > Note that the process id returned by a complex pipe may only refer to the first
    process id returned by the shell. Other parts of the command line may still be
    running in memory. It is best to use the shell''s job number to halt running programs
    when numerous commands are in a pipe. If only a single command is running, then
    killing its process will work.


