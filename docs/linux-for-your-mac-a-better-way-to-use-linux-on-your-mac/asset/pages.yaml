    25 23 * * * root test -e /usr/sbin/faxcron && sh /usr/sbin/faxcron | mail FaxMaster

    #check scripts in cron.hourly, cron.daily, cron.weekly and cron.monthly

    -*/15 * * * * root test -x /usr/lib/cron/run-crons && /usr/lib/cron/run-crons

    0 0 * * * root rm -f /var/spool/cron/lastrun/cron.daily

    0 0 * * 6 root rm -f /var/spool/cron/lastrun/cron.weekly

    0 0 1 * * root rm -f /var/spool/cron/lastrun/cron.monthly


    Under SuSE Linux, services for the at command, faxing, and newsreading are handled
    by entries in the first half of the table. In the second half, the /usr/lib/cron/run-crons
    script is executed every 15 minutes, and checks for scripts under /etc/cron.xxxx
    directories for jobs to run each hour, day, week, or month.


    > The hyphen (-) preceding the minute crontab entry tells the cron daemon not
    to use e-mail after successfully running a task. This will keep root''s mailbox
    from getting too cluttered!


    However, you can craft your own crontab entries, and run tasks directly from the
    system''s crontab file. As the root operator, edit /etc/crontab with your favorite
    text editor. You can try some sample entries like these:


    * * * * * root /sbin/clock -w

    */2 * * * * root /usr/bin/rddate -s ntp2.usno.navy.mil

    0,15,30,45 * * * * root /usr/bin/play /usr/share/sounds/wav/silphon.wav

    0 1 * * * root /usr/bin/find / -xdev -name core -exec /bin/rm ''\{'' \;''15 2
    * * * root /bin/tar czf /d3/sunday.tgz /

    * 12 25 12 * root /bin/echo ''Happy Holidays'' | /bin/mail -s Xmas root


    The first example runs the clock command every minute to update the computer''s
    hardware clock using the Linux system time. The second example retrieves the current
    time every two minutes from the Internet and updates the system clock. The third
    example plays a ship''s horn every 15 minutes. The fifth example, used for cleaning
    up your system, searches the directories at 1:00 AM each morning for core files
    and deletes them. The sixth example creates a backup of your entire filesystem
    (excluding remotely mounted drives) every Sunday at 2:15 AM. The last example
    e-mails a holiday greeting every December 25th at noon.'
