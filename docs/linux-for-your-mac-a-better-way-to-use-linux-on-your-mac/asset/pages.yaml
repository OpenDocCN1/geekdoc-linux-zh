- pgno: 149
  md: 'After you press Enter, the ispell command searches the system dictionary and
    displays matching words. On the other hand, the spell command is designed to display
    words in a given text file or stream that do not match. You can use the spell
    command interactively like this:


    ```

    ```

    $ spell

    giraffe

    <EOT>

    ```

    ```


    In this example, after you press Enter, the word giraffe is typed. After pressing
    Enter, type a Ctrl+d (the end-of-text marker), and the spell command will respond
    with:


    ```

    ```

    giraffe

    ```

    ```


    This indicates that the word is either misspelled or not in the system dictionary.
    If no word is echoed, the word is correct. As you can see, the spell command returns
    non-matching words. For example, to check the contents of a document such as linumpr.txt,
    you can use the spell command on the command-line with input redirection and other
    commands in a pipe like this:


    ```

    ```

    $ spell < linumpr.txt | sort | uniq >misspelled.txt

    ```

    ```


    This command line pipes the output stream of misspelled words in the document
    through the sort and uniq commands and saves the result in a file named misspelled.txt.
    You can then use the sed command or a text editor to fix the file. Spell checking
    documents interactively and fixing errors in context is, however, a much easier
    way to correct misspelling. That is the job of the ispell command, discussed next.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_149_0.png)


    > SuSE Linux includes the ispell command, but does not provide a spell command.
