- pgno: 394
  md: "![](img/1ea833f5a3e3c1547e3dd2891f52804a_394_0.png)\n\n**Figure 15.2** The\
    \ ckeyxw command is a graphical front-end for designating system services to assigned\
    \ runlevels.\n\nAfter you press Enter, you'll see a dialog box, as shown in Figure\
    \ 15.2.\n\nBe careful! Some services should not be run during certain runlevels.\
    \ And in some cases, it doesn't make sense to enable other services without overall\
    \ support. For example, why start NFS if networking service is not enabled?\n\n\
    # System Service Scripts\n\nStarting and stopping services while using Linux can\
    \ only be accomplished by the root operator, also known as the superuser. Although\
    \ the superuser can kill running processes to stop services, a better approach,\
    \ which nearly all Linux distributions respond to immediately, is to manually\
    \ intervene by calling system service scripts with a keyword such as *start*,\
    \ *stop*, or *restart*. This approach allows the root operator to bring a service\
    \ down, make a quick change to a configuration file, and then bring a service\
    \ back up while Linux is running, and with little disruption to operations.\n\n\
    For example, stopping Web service under SuSE Linux can be accomplished by using\
    \ the *apache* script like this:\n\n```\n```bash\n# /etc/rc.d/init.d/apache stop\n\
    Shutting down service httpd\t\t\t\tdone\n```\n```\n\nUnder LinuxPPC 2000, the\
    \ root operator can accomplish the same thing by using the *httpd* script like\
    \ this:\n\n```\n```bash\n# /etc/rc.d/init.d/httpd stop\nShutting down httpd:\t\
    \t\t\t[ OK ]\n```\n```"
  merge: -1
  img_proc: true
- pgno: 395
  md: '# # Network Administration and Utilities


    This section introduces graphical interface utilities you can use to create network
    interfaces and to then test those interfaces. You’ll see how SuSE’s **yast** command
    provides a text-based interface and how its **yast2** command provides a graphical
    interface. You’ll also see how to use a Red Hat-based system’s **netcfg**, **netconf**,
    or **linuxconf** tool to control networking.


    Obviously, the first step is to assign your computer a hostname. This can be done
    by the root operator by using the **hostname** command, by creating a file named
    **HOSTNAME** with the system’s hostname under the */etc/directory*, or through
    various graphical administration tools.


    Under Red Hat systems, one way a system administrator can assign a hostname is
    to use the *netcfg* client, which requires an active X session. Start *netcfg*
    from the command line of an X11 terminal like this:


    ```

    ```

    # netcfg &

    ```

    ```


    After you press Enter, you’ll see a dialog box, as shown in Figure 15.3.


    To assign a hostname, click, then type a name in the hostname field in the dialog
    box. When finished, click the Save button, then click the Quit button to exit.
    Another utility you can use as root is the *netconf* client (generally available
    through the *linuxconf* tool), which can be used from the console or an X terminal
    window like this:


    ```

    ```

    # netconf &

    ```

    ```


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_395_0.png)


    *Figure 15.3 The netcfg client is used to assign a hostname.*'
  merge: -1
  img_proc: true
- pgno: 396
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_396_0.png)


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_396_1.png)


    Figure 15.4 *The net.conf command is used to assign a hostname with or without
    X.*


    After you press enter, the command will launch and present a dialog box. Click
