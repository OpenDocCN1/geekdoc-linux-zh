    # # Simple Database Clients


    This section introduces a simple database client you can use for addresses or
    business cards and provides a gentle introduction to more sophisticated, serious,
    and perhaps enterprise-level database systems you will find included with Linux.


    # ## Using the gnomecard Client


    The gnomecard client is a deceptively simple, yet feature-filled, address book
    that creates vCards, or electronic business cards in a text database in your home
    directory under the .gnome directory. You can launch this client from the GNOME
    desktop''s panel or the command line of an X terminal window like this:


    ```

    $ gnomecard &

    ```


    After you press Enter, you will see the main gnomecard window, as shown in Figure
    12.11.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_303_0.png)


    Figure 12.11 The gnomecard client builds a database/address book of your contacts
    in vCard format.


    # What Is a vCard?


    A vCard is the file format of an electronic business card, used by PDAs (Personal
    Data Assistants), PIMs (Personal Information Managers), Web browsers, newer cell
    phones, and e-mail clients. Defined by the specifications from the Internet Mail
    Consortium and the IETF (Internet Exchange Task Force), the vCard Specification
    allows for encapsulation of name, address, phone, e-mail address, Universal Resource
    Locator (URL), graphics, multimedia, and geographic and time zone information.
    If you have a Palm PDA and have beamed a business card, then you have used a vCard.
    The formal specifications are contained in RFC 2425, MIME Content-Type for Directory
    Information, and RFC 2426, (which is the vCard MIME Directory Profile).


    To get started, click the Add button on the gnomecard button toolbar, then start
    filling out information in its entry dialog boxes, as shown in Figure 12.12.


    # Introduction to Advanced Database Systems


    There is not room in this chapter or the entire book to fully cover the myriad
    of advanced RDBMS (Relational Database Management Systems) software available
    for Linux. You will find two systems most often included with a Linux distribution
    are MySQL and PostgreSQL. These open source SQL (Structured Query Language) database
    servers consist of a server daemon and a host of supporting commands and clients,
    which you can use to build and query sophisticated databases running under Linux.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Simple Database Clients


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_304_0.png)


    *Figure 12.12*  *Use gnomecard''s multiple dialog boxes to enter as much information
    about your contact as possible.*


    For example, the PostgreSQL database system includes 43 different commands and
    programs used to create and manage one or more databases. The system features
    user management, access permissions, and graphical shells for queries and reporting.


    Another Linux SQL database is MySQL, a database management system with RDBMS features.
    In this system data is stored in separate files (or tables), then linked to provide
    data when queried (because of the relational aspect). While MySQL is quite capable
    of handling large databases (i.e., 50,000,000 records) and integrates well with
    other computer languages and Web server operations, PostgreSQL is generally given
    the nod for use in enterprise-class operations on larger computers that provide
    even larger databases. However, for most users, MySQL should be more than adequate
    for the task of handling database operations.


    Like other services on your Linux system, PostgreSQL and MySQL services and database
    daemons may be started through initialization scripts under the */etc/rc/init.d*
    directory. For PostgreSQL, the script is named *postgresql*, MySQL, the script
    is named *mysql*. The first time you run this script (on a SuSE Linux system),
    you will see:


    ```

    Creating MySQL privilege database and starting MySQL.

    Creating db table

    Creating host table

    Creating user table

    Creating func table

    Creating tables_priv table

    Creating columns_priv table

    ...

    ```'
  merge: -1
  img_proc: true
