- pgno: 68
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_68_0.png)


    > Figure 3.2 KDE’s kcmclock client is used to set your timezone.


    You can also set the time zone on the fly by creating or modifying the *TZ* environment
    variable, which is an in-memory setting that designates the current time zone
    (see the *tzset* manual page for details).


    You can also update your system’s time through the Internet by using the *rdate*
    command and its *-s*, or *set*, option. This command can only be run by the root
    operator, and should be used with the name of an Internet time server, like this:


    ```

    `# rdate -s tick.usno.navy.mil`

    ```


    This command sets your Linux system time by retrieving the time from the specified
    remote server.


    > > Unfortunately, the *rdate* command is not included with SuSE Linux PPC. However,
    you can download, build, and install this tiny utility from source code on the
    Internet.


    # # Adding Users


    Managing users on a Linux system is the job of the system administrator. But if
    you use Linux on a stand-alone workstation, you are the system administrator!
    One of your first jobs is to create a username and password for yourself, because
    you should not use Linux as the root operator (unless performing rescue operations
    or system maintenance).


    Red Hat Linux-based systems include a variety of graphical and command-line tools
    used to create and manage users. SuSE Linux administrators can use the'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_69_0.png)


    graphical `yast` utility or other command-line tools. Creating users from the
    com-mand line is painless and easy, and probably faster than using a graphical
    tool.


    The Linux user-creation program commonly used with all Linux systems is the `useradd`
    command. If you have a user named Fred Smith, then use the `useradd` command,
    like this:


    ```

    ```

    # useradd fsmith

    ```

    ```


    Next, you should assign a default password to the new user using the `passwd`
    com-mand, like this:


    ```

    ```

    # passwd fsmith

    New password:

    Re-enter new password:

    Password changed

    ```

    ```


    The new user “fsmith” will now have a directory named `/home/fsmith`, a designated
    login shell in `/etc/passwd`, and a new password.


    > Do you have a big system, or need to create hundreds of new users? Use the `newusers`
    command, which uses a file containing a list of new users and passwords. See the
    `newusers` manual page for more information.


    # Using userconf


    The `userconf` component of the `linuxconf` client included with many Red Hat-based
    Linux systems (such as LinuxPPC 2000 and Yellow Dog Linux) may be used to create
    new users. Start the client (as root) from the command line, like this:


    ```

    ```

    # userconf &

    ```

    ```


    After you press Enter, click the **User accounts** button on the main window.
    A new dialog box appears. Click the **Add** button, and you will see a dialog
    box as shown in Figure 3.3.


    Enter the login name and full name for the new user. Other settings may be left
    empty, because `userconf` will use system defaults. When finished, click the **Accept**
    button to create the new user.'
  merge: -1
  img_proc: true
