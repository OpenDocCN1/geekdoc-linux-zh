  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_147_0.png)


    figure 6.8 The nEdit text editor features extensive menu support when working
    with text-only documents.


    # Applix for Linux


    The Applix office suite, available from VistaSource, is a relatively inexpensive
    software package for the X Window System that provides a database, email, spreadsheet,
    graphics, and of course, a word processing program. The software, which requires
    a serial number, must be purchased and installed on your system before use, and
    runs on many different operating systems including Intel and PowerPC-based Linux
    systems.


    Using the graphical editing component of Applix, known as Words, is easy. You
    can start the word processor by clicking on the Applix toolbar window, or from
    the command line like this:


    ```

    $ applix -wp

    ```


    After you press Enter, you will see the Applix Words window, as shown in Figure
    6.9. You can create text documents using Words, but you will then need to use
    its File menu''s Export menu item to export the document as text. Using Words
    can be a handy way to convert other word-processing documents into text form.


    # Spell Checking


    The ability to check spelling within documents is important for everyone. Sharing
    text or publishing documents with misspellings can be harmful to one''s reputation,'
  merge: -1
  img_proc: true
- pgno: 148
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_148_0.png)


    and can detract interest from the content of one''s writing. Spell-checking is
    a required feature for many commercial word processing or office suite packages.


    Fortunately, every Linux distribution comes with two or more free spell-check
    programs. These include the spell filter command, the dictionary look command,
    and the interactive ispell program. They also come with one or more 45,000- and
    100,000-word dictionaries, usually found under /usr/dict or /usr/share/dict directory
    with the filename words. The spell check ispell, can be found under the /usr/lib/ispell
    directory.


    Commercial UNIX operating systems, such as those derived from AT&T''s System V,
    have traditionally included the spell and look commands. As originally designed,
    both commands use the system dictionary words as the basis for comparing, cross-referencing
    and lookups. For example, to quickly look up the spelling of a word, use the look
    command, followed by a partial spelling of the desired word, like this:


    ```

    ```

    $ look gira

    giraffe

    giraffes

    ```

    ```'
