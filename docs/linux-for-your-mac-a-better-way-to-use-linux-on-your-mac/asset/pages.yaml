- pgno: 481
  md: '# Mailing Lists


    Here is a short list of mailing lists you may find useful. Note that each list
    may have different ways to subscribe and unsubscribe. You can usually get help
    with a mailing list by using a built-in help facility. Carefully note any preliminary
    messages received from a mailing server and save the messages for future reference.


    http://www.geocrawler.com/lists/3/. Although not a mailing list, this Web page
    provides links to Linux and X-related archives of mailing lists


    http://docs.freebsd.org/mail/archive/2000/freebsd-ppc/. Mailing list archives
    of information about using FreeBSD on the PowerPC platform


    http://groups.yahoo.com/group/imac-linux-announce. Mailing list archives of iMac
    Linux users


    http://groups.yahoo.com/group/imac-linux-devel. Mailing list archives of iMac
    Linux developers


    The following is a list from the LinuxPPC folks:


    +   - **linuxppc-announce**. Announcements

    +   - **linuxppc-ans**. Answers

    +   - **linuxppc-bugs**. Bugs? what bugs?

    +   - **linuxppc-dev**. Creating clients and programming

    +   - **linuxppc-embedded**. Embedded development

    +   - **linuxppc-icseries**. Using Linux on i-series PowerPCs

    +   - **linuxppc-security-announce**. Important security announcements

    +   - **linuxppc-user**. User issues

    +   - **linuxppc-workstation**. Using a Linux workstation


    To subscribe to any of the following mailing lists available for Yellow Dog Linux,
    browse to http://lists.yellowdoglinux.com:


    +   - **yellowdog-announce**. Announcements

    +   - **yellowdog-general**. Questions and answers

    +   - **yellowdog-devel**. Development

    +   - **yellowdog-updates**. Updates and bug fixes'
  merge: -1
