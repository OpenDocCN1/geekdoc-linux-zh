    # ## Using slrn


    The slrn newsreading client is a console-based reader that features colors and
    an easy-to-use split interface. The split window, shown in Figure 9.24, allows
    you to browse subjects while reading a message. This client may be launched from
    the desktop''s panel or the command line of an X Window terminal, like this:


    ```

    $ slrn -n -c

    ```


    This command line tells slrn to not check for any new newsgroups that have appeared
    on your ISP''s news server. The -c option specifies the use of color for reading
    messages. After you press Enter, you will see slrn''s main window.


    As with many e-mail clients and newsreading programs, slrn responds to single-letter
    commands. You can type a question mark at any time to get help. Note that slrn
    will use the default system editor to edit follow-up replies or compose posts.
    So if you do not want to end up using the vi editor, you can define a different
    system editor, such as pico, like this:


    ```

    $ export EDITOR=/usr/bin/pico

    ```'
