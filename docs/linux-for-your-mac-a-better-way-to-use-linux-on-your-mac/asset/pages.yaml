    \nNext you must decompress, configure, build, and install the music server (as\
    \ root), like this:\n\n```\n```bash\n# tar xzf ixmuserv-0.94.2.tar.gz\n# cd ixmus*\n\
    # ./configure ; make install\n```\n```\n\nYou should now copy your WAD file to\
