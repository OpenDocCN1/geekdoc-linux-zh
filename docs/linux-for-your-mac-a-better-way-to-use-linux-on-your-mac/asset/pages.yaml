    [1]+  Stopped        pine -z

    $

    ```


    The shell prompt will reappear, and other programs may be started. To return to
    using pine, use the shell''s foreground command fg, like this:


    ```

    $ fg

    ```


    Pine will reappear.


    # History Editing


