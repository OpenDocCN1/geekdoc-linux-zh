    # Using Newsreading Clients


    Reading Usenet news can be a rewarding pastime and a great way to keep up on tips,
    tricks, and techniques on many different subjects from people all over the world.
    When you subscribe to a newsgroup but do not follow up with replies or post on
    new topics, you are *lurking*. If you post a stupid comment in the hopes of seeing
    a response, you have posted a *troll*. If someone vociferously lambastes your
    comments, you have been *flamed*. Exchanging written taunts and insults is a *flamefest*.'
