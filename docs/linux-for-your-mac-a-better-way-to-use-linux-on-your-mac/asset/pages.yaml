- pgno: 205
  md: 'This chapter covers getting connected to the Internet. This is generally one
    of the first tasks Linux users accomplish after installing Linux. For many users,
    it is a necessary ingredient in the daily fare of personal computing. In this
    chapter you will learn about some of the traditional command-line tools, and will
    get an idea of how to start, configure, and use the newer, more sophisticated
    graphical Internet utilities included with every Linux distribution.


    Use this chapter as a launch point for learning more about connecting to the Internet.
    There are also hundreds, if not a thousand other Internet utilities available
    for Linux. These utilities range from instant messaging to a simple display of
    stock tickers in your desktop panel.


    # ## Serial Port and Modem Setup


    Until the communications revolution is complete and everyone has ultra-high-speed
    broadband access to the Internet, most users will continue to connect to the Internet
    using a dial-up connection through an ISP (*Internet Service Provider*). In order
    to successfully connect to your ISP, you will need to be aware of your PowerPC''s
    hardware capabilities and be able to recognize and configure Linux to work with
    and use your system''s serial port or internal modem.


    Fortunately, most modern Linux distributions and Internet connection utilities
    are able to recognize, configure, and report on any modem or serial port. After
    booting Linux, use the dmesg command to check for any found serial or modem ports,
    like this:


    ```

    $ dmesg | fgrep tty

    tty00 at 0xd415b020 (irq = 22) is a 28530 ESCC (cobalt modem)

    tty01 at 0xd4162000 (irq = 23) is a 28530 ESCC (IrDA)

    ```


    This example shows that two serial ports were found and may (possibly) be used.
    Linux denotes serial communications ports as /dev/ttyx where x is often a number
    between zero and three. In this example (using a TiBook running LinuxPPC 2000
    Q4), the internal modem is correctly identified and has been assigned /dev/tty0.
    You can then use the ln command (as root) to create the symbolic modem link, like
    this:


    ```

    # ln -s /dev/ttyS0 /dev/modem

    ```


    This will create the symbolic link named /dev/modem. It is also possible that
    this link will be created automatically during the installation process. Whether
    or not you choose to create the link is up to you, but a number of Linux clients
    will use'
  merge: -1
  img_proc: true
- pgno: 206
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_206_0.png)


    **Figure 9.1** Select the proper device before creating your system''s `/dev/modem`.


    `/dev/modem` as the designated modem device. Most Linux distributions come with
    a graphical system administration tool to create this link. For example, the `modemtool`
    client, included with Yellow Dog Linux and LinuxPPC 2000 and part of the control-panel
    client, can be used to quickly create the symbolic by clicking on a button. Launch
    this client from the panel, or from the command line of an X terminal window,
    like this:


    ```

    # `modemtool` &

    ```


    After you press Enter, you will see its dialog box, as shown in Figure 9.1. You
    must first click to select the proper device, and then click the OK button to
    create `/dev/modem`.


    # ### **Alternatives**


    If your internal modem is not supported, you can try using a USB serial adapter,
    such as the Keyspan Model USA-19. This adapter plugs into an available USB port
    and provides a male DB-9 RS232 adapter that you can hook up to an external modem
    (it is also handy for hooking up a digital camera for downloading pictures, or
    a Palm PDA for backup, restore, or software installation). To use this adapter,
    connect it, and then use the `insmod` command (as root) to load the `usbserial`
    and `keyspan_pda` kernel modules, like this:


    ```

    # `insmod usbserial`

    Using `/lib/modules/2.2.16/usb/usbserial.o`

    # `insmod keyspan_pda`

    Using `/lib/modules/2.2.16/usb/keyspan_pda.o`

    ```'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'You can then use the `dmesg` command to determine the proper serial device
    to use for your modem or serial operations, like this:


    ```

    # dmesg

    ...

    usbsuerial.c: Looking at Keyspan PDA Vendor Id=06dc Product Id=0104

    usbsuerial.c: descriptor matches

    usbsuerial.c: found interrupt in

    usbsuerial.c: found bulk out


    usbsuerial.c: Keyspan PDA converter detected

    usbsuerial.c: get_free_serial -

    usbsuerial.c: get_free_serial - minor base = 0

    usbsuerial.c: Keyspan PDA converter now attached to ttyUSB0 (or usb/tts/0 for
    devfs)

    ```


    Note that not all the output is shown here. In this example, the new serial port
    is designated as `/dev/ttyUSB0`. You can then use this port for modem operations.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_207_0.png)


    > At the time of this writing, the speed of the serial port using this adapter
    (which works fine under Intel-based Linux) is limited to 9600 baud. Hopefully
    the USB drivers will be fine-tuned over the next several PPC kernel releases.


    You can also try using a USB modem with Linux. At the time of this writing, the
    following units were reportedly working and fully supported:


    +   - 3Com OfficeConnect Analog Modem.

    +   - 3Com 56k Voice Faxmodem Pro.

    +   - Diamond Supraexpress 56k USB Modem.

    +   - Zoom Telephonics, Inc. 2985L Zoom V90 USB Faxmodem.


    However, some of these modems may require the `acm` kernel module. Support for
    various USB kernel modules may be different between Intel-based kernel distributions
    and your PPC Linux kernel. When in doubt, always ask someone who is using similar
    equipment and software. You should also research hardware before you buy!


    # ## Network Setup Basics


    If you are connecting your system via a LAN and Ethernet to the Internet, congratulations!
    The task of setting up a connection is a lot easier, and only requires a few simple
    steps. The good news is that Linux works very well on a network,'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'and your PowerPC will feel right at home, even if the LAN is full of computers
    using one of those “other” operating systems.


    # ## Required Information


    You will first need to know your computer’s hostname and IP address. You can find
    the hostname by looking at a login or shell prompt, in the file named HOSTNAME
    under the /etc directory, or in the file named hosts under the /etc directory.
    If your LAN administrator uses DHCP (Dynamic Host Control Protocol) assignment
    for IP addresses, then you will be assigned what is termed a dynamic IP address.
    If you are assigned an IP number such as 192.168.2.55, then you have been assigned
    a static IP address. The difference between a dynamic and static IP address is
    that with a dynamic address, you will be assigned a new IP address each time you
    disconnect and then reconnect to your LAN while a static IP address stays the
    same.


    > If you need dynamic addressing, make sure that you have installed the dhcp client
    on your system. For LinuxPPC 2000, this will be the dhcp-2.0 RPM file. Under SuSE
    PPC Linux, this will be the dhcp RPM file.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_208_0.png)


    You will also need to know the IP address of your LAN’s Internet gateway. A gateway
    is nothing more than the device that connects two or more networks; in this case,
    it is the workstation, server, firewall, or other hardware device that connects
    your LAN to the Internet.


    Finally, you will need to know the IP address(es) of your LAN’s Domain Name Servers
    (that provide DNS). These are one or more computers that hold tables of constantly
    updated information that quickly translate a numerical IP address to a name (usually
    in the form of XXX.XXX.XXX.XXX). For example, www.prima-tech.com or www.applecomputer.com.


    Once you have this information in hand, you are ready to configure your system.
    First, make sure your Ethernet interface is installed and recognized by Linux.
    Next, use one of the administrative tools covered in Chapter 15, “Managing Services,”
    to properly configure your interface. You can also do this quickly (as root) if
    you have a static IP address, by using the ifconfig command, like this:


    ```

    # ifconfig eth0 yourIPaddress up

    ```


    In this example, the interface is activated by using your assigned IP address.
    If you have an entry in your system’s /etc/hosts file for your computer and it
    is associated'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'with your IP address, you can substitute your system''s hostname for the IP
    address. For example:


    ```

    192.168.2.33  stinkypad.home.org  stinky

    ```


    You can then use the abbreviated (alias) hostname, like this:


    ```

    # ifconfig eth0 stinky up

    ```


    After you press Enter, your Ethernet interface should be active. Next, edit your
    system''s /etc/resolv.conf file to contain the one or two (most likely) DNS numbers:


    ```

    nameserver 199.45.32.38

    nameserver 199.45.32.43

    ```


    Following this, you should then be able to add your LAN''s gateway (as root) to
    your Linux kernel''s routing table (which is contained in memory) by using the
    route command, like this:


    ```

    # route add default gw yourgateway

    ```


    In this example, yourgateway could be a hostname or IP address. The route command
    will then force your system to send and receive packets of information through
    the gateway computer.


    Congratulations! You should now be able to check your Internet connection.


    > See the section "Network Administration and Utilities" in Chapter 15, "Managing
    Services" for information on using graphical configuration tools to create network
    interfaces.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_209_0.png)


    # Checking Mac Connectivity


    Linux comes with hundreds of networking utilities, but most users employ the ping
    command to check network connectivity after connecting to a LAN and the Internet.
    This command may be employed by any user, and its reports on the time (in milliseconds)
    that it takes to echo a packet transmission from a remote computer. Use this command
    with the name of a known remote Internet host, like this:


    ```

    # ping -c3 www.usu.com

    PING www.usu.com (213.95.15.200): 56 data bytes

    ```'
  merge: -1
  img_proc: true
