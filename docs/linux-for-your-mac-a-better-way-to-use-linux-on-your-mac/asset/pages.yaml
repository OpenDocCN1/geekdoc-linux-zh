  md: '# Using E-Mail Clients


    If you choose to use more traditional e-mail clients with Linux, you will need
    to use Eric S. Raymond''s `fetchmail` command to retrieve your messages. This
    program can be used to retrieve e-mail from a variety of mail servers, and works
    by using a resource file in your home directory named `.fetchmailrc` (although
    you can define other resource files and use them by using `fetchmail`''s `-f`
    option, followed by the resource file''s name).


    For example, a simple `.fetchmailrc` may look like this:


    ```

    poll pop.mysp.com protocol POP3 username yourusername password yourpassword

    ```


    The file should have permissions of at least 710 (allowing you to read, write
    and execute the file, but restricting read and write access to other programs),
    which you can assign with the `chmod` command, like this:


    ```

    $ chmod 710 .fetchmailrc

    ```


    You can then retrieve your e-mail (assuming you have an active Internet connection),
    like this:


    ```

    $ fetchmail

    ```


    If you create a different resource file, you can retrieve mail, like this:


    ```

    $ fetchmail -f .erolsrc

    1 message for bballetaubee at pop.erols.com (1486 octets).

    reading message 1 of 1 (1486 octets). flushed

    You have new mail in /var/spool/mail/bball

    ```


    The `fetchmail` command has many different command-line options. Read its manual
    page for more information.


    Using legacy, or text-based e-mail clients can be an advantage, especially if
    you have a shell account on a remote system. Coverage of these clients, such as
    `mail`, `pine`, or `mutt` is included for completeness, but you will have to experiment
    and read about these clients to learn more.


    # Using mail


    The `mail` command is a simple mail reader used to read, delete, or reply to mail.
    It does not have a screen-oriented editor for composing mail, but instead uses
    a'
  merge: -1
  img_proc: true
