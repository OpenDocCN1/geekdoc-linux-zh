- pgno: 427
  md: 'For example, to find all files on your system (excluding externally mounted
    filesystems), which have changed in the last 24 hours use the `find` command like
    this:


    ```

    # find / -mtime -1 -print -xdev | xargs ls -l > /root/seelog.txt

    ```


    The results, which are saved in a file named `seelog.txt` under the `/root` directory,
    will list the details about all files that have changed in the last 24 hours.
    This is important if you are looking for any unauthorized changes to your filesystem.


    The `find` command returns the pathnames to found files. Although the previous
    command line uses the `xargs` command to act on those filenames, you can also
    include this action in the `find` command line as well:


    ```

    # find / -mtime -1 -print -xdev -exec ls -l ''{''}'' {}'' > /root/seelog.txt &

    ```


    Want to find the largest files on your system? Just use the `-size` option, followed
    by a minimum size as a search criteria. You will be surprised how many large files
    are on your system:


    ```

    # find / -size +4096k -print -xdev

    ```


    ```

    /var/lib/rpm/packages.rpm

    /var/lib/rpm/fileindex.rpm

    /var/lib/rpm/requiredb.rpm

    /var/backup/rpmdt/packages.rpm-20010227.gz

    /var/backup/rpmdt/packages.rpm-20010311.gz

    /var/backup/rpmdt/packages.rpm-20010213.gz

    /var/backup/rpmdt/packages.rpm-20010225.gz

    /var/backup/rpmdt/packages.rpm-20010226.gz

    ...

    ```


    In this example, the `find` command returns the pathnames to files that are greater
    than 4MB in size. You can use this approach to prune your filesystem and perhaps
    delete unneeded space hogs.


    There are many uses for the `find` command. As you craft your own search tools,
    you can begin to use different command lines in different ways, such as for regularly
    scheduled tasks (discussed later in this chapter under “Scheduling with `crontab`”).


