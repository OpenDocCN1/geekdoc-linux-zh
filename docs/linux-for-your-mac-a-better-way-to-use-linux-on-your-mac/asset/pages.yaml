    with technical papers concerning the X Window System.

    +   * http://www-sop.inria.fr/koala/colas/mouse-wheel-scroll/. A very good site
    with a lot of resource string settings related to X and using wheel- or scroll-mice
    with X.

    +   * http://lincserv1.gis.lincoln.edu/hds/3-6-2-2.html. A tutorial Web page that
    shows how to remap your keyboard using `xmodmap`.

    +   * http://www.jwz.org/xkeycaps/. Home page for the `xkeycaps` client. You will
    find the latest copy available for download at this site.

    +   * http://www.openoffice.org/. Home page for the OpenOffice.org project, aimed
    at making a fully featured office productivity suite available for nearly every
    operating system.

    +   * http://lists.yellowdoglinux.com/yellowdog-genera1/May00/0139.html. A good
    explanation of the proper use of `xhost` and how to grant remote permissions.

    +   * http://ux2.cso.uiuc.edu/~j-mills/de_li/x2part2b.html. Scroll to the bottom
    of this Web page for examples of setting the `DISPLAY` variable using different
    shells.'
