- pgno: 466
  md: '# ## Arcade


    PPC Linux distributions include a variety of exciting and fun-filled arcade games
    that you will enjoy for hours at a time. This section introduces just some of
    these games. Nearly all these games can use your system’s sound card. In order
    to fully enjoy the gaming experience, make sure you have a properly configured
    sound card for your system. You will also see how to build 1xdoom, an Open Source
    version of DOOM!, which is the first-person shooter game by ID Software.


    # ### XBoing II


    Justin C. Kibel’s xboing client has a long and happy history with X, and has been
    available for Linux for several years. This arcade breakout-style game features
    wacky sounds and fast-paced, furious action. Do not forget to include the -sound
    option to turn on sound when you start the game from the command line, like this:


    ```

    ```

    $ xboing -sound &

    ```

    ```


    After you press Enter, press the spacebar to begin a game. The game appears as
    shown in Figure 18.8.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_466_0.png)


    *The xboing breakout game features fast play and lots of sounds.*'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# Maelstrom from the Mac


    Mac OS arcade fans are sure to remember Maelstrom, by Andrew Welch. This shareware
    arcade game was originally ported to X and retains its excellent animation, fast
    play, and great sounds. Start game play from the command line of a terminal window,
    like this:


    ```

    $ Maelstrom &

    ```


    You will see an initial splash window, then a control window. Press the p key
    to start the game. If you need help, press the a key, then press Enter to see
    the cast of animated goodies in the game, as shown in Figure 18.9.


    # Building and Playing 1xdoom


    The DOOM arcade game ushered in a new era of game play on personal computers.
    Although it was not the first 3D game, it definitely popularized the first-person
    shooter and alienated a generation of parents with its sounds and gory action.


    You can now run and play the game in all its original glory while using Linux
    and X. For full play, you will need a commercial DOOM WAD (data) file, though
    you can use the original three-level shareware WAD file. Building and installing
    1xdoom is a snap when using PPC Linux, and only takes a minute or so, providing
    you have the proper development tools and libraries installed on your system.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_467_0.png)


    > Figure 18.9  Mac OS users migrating to Linux will remember and enjoy Maelstrom''s
    great arcade action.'
  merge: -1
  img_proc: true
- pgno: 468
  md: "Download the `ixdoom` and music server sources, decompress them, and then build\
