    # # Serial Ports and Modems


    No newer Power Mac comes with a serial (RS-232 or RS-422) port, although every
    PowerBook and some desktops, such as the Apple G4 Cube, come with an internal
    modem. Most internal modems are supported. For more information about using serial
    ports, see Chapter 9, "Connecting to the Internet." This chapter contains additional
    details about detecting, configuring, and setting up a serial port or modem, and
    some possible workaround solutions for adding a serial port to your computer.


    Fax services are provided by several utilities included with most Linux distributions.
    SuSE Linux includes a complex fax support system named HylaFax. However, you may
    want to explore the use of the efax software. Using this software is very easy.
    First, use your favorite text editor (as root) to edit the file named \texttt{fax}
    under the \texttt{/usr/bin} directory. Look for various entries, such as:


    ```

    ...


    # Your fax number in international format, 20 characters maximum.

    # Use only digits, spaces, and the "*" character.


    FROM="+0 000 000 0000"


    # Your name as it should appear on the page header.


    NAME="from a Red Hat Linux system"

    ...

    ```


    Change these entries to include your fax number and name. If you have properly
    configured your modem, you can then turn your Linux system into a fax machine
    waiting for faxes, like this:


    ```

    # efax


    efax: Sun May 13 16:18:27 2001 efax v 0.9 Copyright 1999 Ed Casas


    efax: Sun May 13 16:18:27 2001 efax v 0.9 Copyright 1999 Ed Casas


    efax: 18:27 compiled Aug 21 2000 01:25:22


    efax: 18:30 opened /dev/modem


    efax: 18:31 using V2.300-V90_2M_DLS CONEXANT AC/K56 in class 2

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'This example shows the `efax` command running on the Apple TiBook. To send
    a fax, use the `fax` command and its `send` option, along the remote fax number
    and document name, like this:


    ```

    # fax send 2025551212 mydocument.txt

    ```


    The `fax` script takes care of dialing and converting your document into the proper
    format for transmission.


    # Troubleshooting


    Many experienced Linux users carefully research equipment purchases with Linux
    compatibility specifically in mind. However, if you have a computer that is not
    fully supported by Linux, do not worry. Linux on the PowerPC platform will mature
    and support for equipment will improve. The good news is that the majority of
    newer Power Macs out of the Apple stable are quite Linux compatible. This includes
    the G4 Cube, the latest Titanium PowerBooks, and the latest iBooks.


    Your best bet in getting support for your equipment is to carefully monitor various
    PPC Linux-centric Web sites for details on how others using similar equipment
    have come up with solutions. As PPC Linux vendors improve distributions, support
    for newer machines will be added. Every new version of the Linux kernel brings
    additional support, and you are sure to find a number of computers on which all
    equipment works.


    You should also use the various resources listed in the Appendix as starting points
    for more information. You can also get help from your local LUG (*Linux User Group*).
    Joining a LUG is the best way to learn more about Linux, gain exposure to new
    ideas, and talk with other users who may have similar equipment. The LUG experience
    is rewarding, and many LUGs sponsor talks, demonstrations, and Install Fests where
    new users can bring equipment and get Linux quickly installed and configured by
    experts.


    # Resources


    +   - `http://www.eecs.udel.edu/~mills/ntp/servers.htm`. A list of public Internet
    time servers for use with the `rdate` command and other time services.

    +   - `http://www.rocile.com/wvlanPPC/`. Information about using the Apple Airport
    and LinuxPPC 2000.

    +   - `http://www.mailgate.org/linux/linux.debian-ports.powerpc/msg02300.html`.
    How to integrate an Airport card with PPC Linux on a TiBook.'
  merge: -1
