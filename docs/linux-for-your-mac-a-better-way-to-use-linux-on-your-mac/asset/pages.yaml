    # ## Spreadsheet Applications


    Some people view computers as nothing more than fancy calculators. In fact, it
    was not until the advent of early financial calculation software such as VisiCalc
    (first introduced for Apple Computer hardware) that people started taking personal
    computers seriously. Before this, "serious" financial calculations were always
    conducted on "Big Iron," or huge mainframe computers.


    Today, Apple G4 users can snicker about comparisons between their computers''
    power compared to the size and cost of those big computers of even 10 years ago.
    Today''s Macs routinely sport more than 1GB RAM and provide hard drive storage
    only dreamed of a decade ago.


    The various clients and programs discussed here run the gamut from GPLd projects
    and open source packages, to the public domain. You are sure to find a program
    that can fit your needs. These programs rival and often exceed the capabilities
    of commercial spreadsheet programs that cost computer users hundreds of dollars
    only a few years ago.


    # ### Using gnumeric


    The *gnumeric* spreadsheet client requires an active X session, and is part of
    the GNOME software library distribution. This program, initially started as a
    simple table editor, has rapidly evolved into a capable spreadsheet client.'
  merge: -1
