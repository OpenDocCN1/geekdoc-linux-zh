    # Scheduling with cronab


    Every Linux distribution includes the exsm daemon, or some other software mechanism
    for performing regularly scheduled tasks. While the ar command helps users to
    perform specific tasks at a specified time, the *exsm* daemon is generally used
    for system-wide administrative tasks that need to be performed repeatedly.'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'Like other network or server services, the `cron` scheduling service is controlled
    by startup scripts under your system''s `/etc/rc.d/init.d` or `/etc/init.d` directories.
    This service should always be started on your system, because it initiates pre-programmed
    tasks that are essential to the health and well-being of your filesystem.


    The `daemon` checks the `cron` table, `/etc/crontab`, every minute for instructions
    regarding what task to run at a given time. The table''s format is documented
    in the `crontab` manual page, and looks like this (on a LinuxPPC 2000 Q4 system):


    ```

    SHELL=/bin/bash

    PATH=/usr/sbin:/usr/bin:/sbin:/bin

    MAILTO=root

    HOME=/


    # m h dom mon dow user  command

    00 2  * * *  root run-parts /etc/cron-weekly

    30 4 * *  1    root run-parts /etc/cron-monthly

    50 4  * * 0   root run-parts /etc/cron.weekly

    42 4 1 * *    root run-parts /etc/cron-monthly

    ```


    The first part of the `crontab` file contains options settings for the default
    shell, the `path(s)` to use, and who to e-mail about problems or task completion.
    The `run-parts` section is the actual table, which consists of a number of fields.


    The first five fields (from left to right) designate when to run a task and include
    the `minute`, `hour`, `day of month`, `month`, and `day of week`. The rest of
    the line is a command line, which uses the `run-parts` shell script to execute
    scripts found under the `/etc/daily`, `/etc/weekly`, `/etc/monthly`, and `/etc/annually`
    directories. For example, if you look under the `/etc/daily` directory, you will
    see a number of scripts like these:


    ```

    $ ls /etc/cron-daily

    fskscan  inn-cron-expire  logrotate  slocate.cron  tetex.cron

    bridge-tizer  inn-cron-news  makewhatis.cron  elfsync-expire  tmpwatch

    ```


    These scripts perform quite a bit of house keeping for your system, such as handling
    Usenet newsfeeds (if enabled), updating the `slocate` search database, and rebuilding
    the `tex` command''s database. SuSE Linux has a similar `crontab`, but takes a
    different approach:


    ```

    SHELL=/bin/bash

    PATH=/usr/bin:/usr/sbin:/sbin:/bin:/usr/lib/news/bin

    MAILTO=root


    *    * * * *  root test -x /usr/sbin/atrun && /usr/sbin/atrun

    ```'
  merge: -1
  img_proc: true
