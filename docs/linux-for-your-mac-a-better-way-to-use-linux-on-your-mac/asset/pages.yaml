- pgno: 297
  md: '# Using the plan Client


    Thomas Driemeyer''s *plan* client, and associated appointment and scheduling daemon,
    *planD*, is a graphical calendar program and appointment scheduler for X. If you
    have the screen real estate, you can use *plan* without its scheduling daemon
    as a simple visual calendar. If, however, you want to take advantage of its scheduling
    and appointments, then you should start the daemon as requested when you first
    run *plan*.


    This client requires an active X session. You can start *plan* from the command
    line of an X terminal window like this:


    ```

    $ plan &

    ```


    After you press Enter, you will see a small dialog box that asks if you want to
    start the daemon. If so, press the Start daemon now button, or press the Continue
    without daemon button to use *plan* as a simple calendar. The *plan* client appears
    as shown in Figure 12.4, with the current day highlighted in green.


    To get started, select a desired day, month, or year, then click on a day. You
    will see a pop-up dialog box, as shown in Figure 12.5 that features entries for
    schedule and appointment information. When finished, click the Done button to
    save your appointment.


    The *plan* client has extensive built-in and context-sensitive functions you can
    use to explore the program''s features and to get help. You can also read its
    manual page for more information.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_297_0.png)


    **Figure 12.4** *The plan client has a corresponding plan daemon that is used
    to provide schedule and appointment alarms.*'
  merge: -1
