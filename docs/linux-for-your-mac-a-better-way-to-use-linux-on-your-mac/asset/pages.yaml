- pgno: 389
  md: "This chapter follows up to the root operator skills covered in Chapter 14,\
    \ “Basic System Administration” and introduces some basic concepts and system\
    \ administration skills you will need when managing services while running Linux\
    \ on your Power Mac. People who enjoy using Linux have usually invested a modicum\
    \ of time learning about how it works. The concepts and skills covered in this\
    \ chapter include an overview of how Linux starts and stops services, as well\
    \ as how to create network interfaces, set up your Web server, and use your computer\
    \ to talk with other computers running different operating systems. The ideas\
    \ covered here will help you overcome problems that may occur while getting your\
    \ computer to talk with other computers. This information will help you create\
    \ and enjoy a more productive system. Note that you’ll need root permission and\
    \ will have to become your system’s superuser in order to perform nearly all the\
    \ tasks outlined in this chapter.\n\n# # How Linux Starts and Stops\n\nAfter Linux\
    \ boots, it runs a program named **init**. The **init** command is responsible\
    \ for starting, restarting, or stopping services on your computer. Although Linux\
    \ distributions will differ in how the **init** command manages the services,\
    \ all distributions use some form of interdependent shell scripts (many of them\
    \ symbolic links) that are called in a particular order in response to a particular\
    \ system state, or runlevel.\n\nYou can see how the **init** command is responsible\
    \ for starting processes under Linux by using the **pstree** command, or other\
    \ utility that shows the relationship between processes. For example, using the\
    \ **pstree** command may return the following:\n\n```\ninit-->alarmd\n    |-artsd\n\
    \    |-atd\n    |-cron\n    |-gpm\n    |\n    |-in.identd--in.identd--3*[in.identd]\n\
    \    |-inetd\n    |-10*[kdeinit]\n    |-kdeinit--kdeinit\n            |\n    \
    \        |-kdeinit--bash--telnet\n            |\n            |-2*[kdeinit--bash\n\
    \            |\n            |-kdeinit--bash--bash\n            |\n           \
    \ |\n            '------------'-pstree\n            '---2*[netscape--netscape]\n\
    \    ...\n```"
  merge: -1
  img_proc: true
- pgno: 390
  md: "This example, run under a SuSE Linux system, shows that `init` is responsible\
