    # ### Using *emacs*



    Although best known as an editing environment, the *emacs* editor also features
    a number of calendars. You can use *emacs* to quickly display a three-month calendar
    by using its *calendar* keyword at the command prompt (located at the bottom line
    of the editor window). In addition to displaying a calendar, *emacs* also provides
    appointment scheduling and alarms.


    To begin, start *emacs* from the command line of the console or the X terminal
    window. If you are using X, but want to keep *emacs* inside the terminal window
    instead of launching its own X window, use the *-nw* (no window) option like this:


    ```

    `$ emacs -nw`


    ```


    To display a three-month calendar, press Cmd+x, then type *calendar* at the command
    prompt and press Enter. A three-month calendar with the current day marked by
    a block cursor will appear in the lower half of the screen, as shown in Figure
    12.3.


    > Intel-based Linux users should note that instead of pressing Cmd+x (which is
    unavailable on PC keyboards), one can simply tap Esc then x, or press Alt+x, and
    then type *calendar* to display the *emacs* calendar. Your PowerPC Linux distribution
    may set up your keyboard differently, and you may have to experiment to find the
    right editing keys when using *emacs*.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_295_1.png)


    To get help with the *emacs* calendar function, type a question mark. To scroll
    the calendar forward or backward, press Ctrl+x, then tap the greater or less than
    (*>x*) keys (you will have to hold a Shift key down, or the interperated keys
    will be a comma or a period). You can also scroll back and forth one day at a
    time by using Ctrl+p or Ctrl+n.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_296_0.png)


    # Figure 12.3 The emacs editor can display a three-month calendar during your
    editing sessions at the console or while using X.


    To jump to a different month, tap the o key, press Enter, then enter a month’s
    name. The calendar will then move to the specific month. If you tap the period
    (.), the calendar will shift to the current day. To quit the calendar, type a
    q.


    In order to use the appointment feature, you must first create a file named diary
    in your home directory. The emacs editor will use this file as a place to search
    for appointments. You can create your diary by using the touch command before
    using emacs, or create a file, then save the file with name diary. To jump to
    emacs’ diary mode, press Cmd+x, then type diary and press Enter.


    To add an appointment, press Cmd+x, then type appt+add and press Enter. You will
    be prompted for the time like this:


    Time (hh:mm [am/pm]):


    After you enter a time and press Enter, you will then be asked for a message:


    Message:


    Type a message and press Enter. While emacs is running, you will be reminded by
    a system beep, and a new “mode” line in the emacs window. You can also enter appointment
    times in your diary in the form:


    hh:mm [am/pm] message


    Remember that emacs must be running in order for your appointment schedule to
    work!'
