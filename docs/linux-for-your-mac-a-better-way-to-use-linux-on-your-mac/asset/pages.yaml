    ```


    # # What Is a Window Manager?


    An X window manager is simply an X client that manages the drawing and controls
    of windows, icons, and other items of the X desktop. A window manager generally
    responds to one or more specific configuration files that can contain customized
    settings. X window managers range from simple to complex, and from small (i.e.,
    less than 200,000 bytes) to large (i.e., distributions that may require 150MB
    or more hard drive space).


    Window managers tell X how to handle new windows, window decorations (such as
    scrollbars), window movement and placement, and resizing of windows. Window managers
    also can create icons, manage focus policy, or how and when windows become active.
    They also offer additional features such as supporting icon drag and drop for
    copying, linking or deleting files, and printing documents.


    # # Window Managers and Desktop Environments for Linux


    This section introduces a number of window managers and desktop environments (i.e.,
    window managers with a compatible suite of clients) that you can use for your
    X sessions. Each section provides a short description, points out any pertinent
    configuration files, and includes a picture of the desktop in action. Note that
    not'
