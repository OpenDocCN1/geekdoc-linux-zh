- pgno: 479
  md: '# PPC Linux Web Sites


    Here is a short list of essential Web sites with information about PowerPC Linux.
    There are many hundreds of Web sites devoted to Linux, but these pages provide
    a good starting place for more information if you run into trouble.


    +   - **http://www.yellowdoglinux.com**. The home page for the Red Hat-based Yellow
    Dog Linux from Terra Soft

    +   - **http://www.linuxppc.org**. A must-visit site for the latest developments
    and software for PPC Linux

    +   - **http://www.suse.com**. Home page for SuSE, Inc., where you will find links
    to its latest distribution of Linux for the PowerMac models and other PowerPC-enabled
    computers

    +   - **http://www.debian.org**. Visit this site to learn more about the philosophy
    of Debian Linux. You should also explore to find a version of Linux for your PowerPC
    computer

    +   - **http://www.linuxppc.com**. Site of the now non-profit Linux PPC 2000 Q4
    distribution

    +   - **http://www.linux-laptop.net/apple.html**. If you have a PowerBook and
    are interested in using Linux, check this site for links to current and legacy
    Apple notebook computers. You will find owners who are willing to share their
    experiences

    +   - **http://penguinppc.org/~benh/**. Ben Herrenschmidt''s page for the latest
    BootX and Yaboot utilities

    +   - **http://www.wrietman.com/**. All about using Linux on an iBook

    +   - **http://www.rapierbit.org/linux/**. Information about using Linux on the
    PowerPC

    +   - **http://www.fsmlabs.com/linuxppcbk.html**. You can find some of the latest
    PPC Linux kernel source here

    +   - **http://penguinpc.org/usr/hardware/edge.shtml**. A great place for more
    information about PPC Linux, with links to the latest software and information

    +   - **http://students.washington.edu/mpaleczew/**. A place to check for iBook
    Linux kernels that support sound

    +   - **http://www.rahul.net/kenton/xsites.framed.html**. The best site on the
    Internet for learning more about X'
  merge: -1
  img_proc: true
- pgno: 480
  md: 'A family of five different Web sites with reader-contributed information regarding
    problems, solutions, and summaries of the Linux experience on the PowerPC platform:


    +   http://www.powerbooklinux.net

    +   http://www.cubelinux.net

    +   http://www.imaclinux.net

    +   http://www.powermaclinux.net

    +   http://www.ibooklinux.net


    # Usenet


    Here are some Usenet newsgroups with discussions focused on Linux, PPC Linux,
    and X. You will find additional groups with information. Check your ISP''s news
    server or use your favorite search engine on the Web.


    +   **alt.os.linux** Alternative discussions about Linux

    +   **comp.os.linux.advocacy**. Flame wars and rants of rabid Linux fanatics

    +   **comp.os.linux.hardware**. Discussions about Linux and hardware

    +   **comp.os.linux.x**. Discussion about Linux and X

    +   **comp.os.linux.powerpc**. Exchange ideas and solutions with other Linux PPC
    users

    +   **comp.os.linux.portable**. Issues regarding laptops (Intel-centric)

    +   **comp.sys.mac.portable**. Discussions regarding PowerBooks

    +   **comp.unix.aux**. Discussions about Apple''s defunct AU/X

    +   **comp.unix.bsd.openbsd.misc**. Discussions about OpenBSD

    +   **comp.unix.machten**. Discussions about Tenon''s BSD for Mac OS

    +   **comp.windows.x.announce**. Announcements about X

    +   **comp.windows.x.apps**. X-based applications

    +   **comp.windows.x.kde**. KDE and X discussions

    +   **comp.windows.x**. Discussions about X in general'
  merge: -1
