- pgno: 307
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_307_0.png)


    *Figure 12.14 The kspreads spreadsheet first asks you what document to open.*


    After you press Enter, you will be asked if you want to create a new document,
