    # Managing Software


    This section introduces the ubiquitous rpm command, also known as the Red Hat
    Package Manager. RPM is a unique software management technology that provides
    package management, or the ability to securely bundle, distribute, install, remove,
    and otherwise manage software in the forms of packages. Used by software developers
    on many different computer platforms, RPM is also used on nearly every PowerPC
    Linux distribution, with the exception of Debian GNU/Linux, which uses a different
    packaging system and .deb software archives.


    You will be introduced to the basics of using the rpm command from the command
    line, and will then learn how to launch and use two different graphical RPM clients
    that work under X11. You will also learn how to build and install software from
    scratch using rpm.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# # Using the `rpm` Command


    The `rpm` command has an interesting lineage. Early Linux distributions use utilities
    such as `rp, pm,` and `pm` to handle software management, but all lacked features
    such as cross-platform compatibility, speed, and stability. The first version
    of `rpm` was developed in Perl, but all subsequent versions are coded in the C
    programming language. The version most often used on today''s PowerPC Linux distributions
    is 3.0.4 or 3.0.6, although the current release is version 4.0.


    From a system administrator''s viewpoint, the `rpm` command provides the ability
    to install, verify, remove, or upgrade packages. The `rpm` command also has the
    ability to run other programs or internal scripts during the installation process.
    This has prompted security concerns for some users. In response, `rpm` now has
    the ability to include electronic signatures to ensure author authenticity.


    Using `rpm`, you can view the contents of a package before it is installed, view
    a list of installed packages, verify a package is installed, and remove an installed
    package. These tasks are accomplished by using `rpm`''s `-q` (query option), `-i`
    (install option), `-u` (upgrade option), and `-e` (erase option).


    For example, to view the contents of a package, use `rpm` and its `-q` option
    along with the `p` and `i` options (to list package contents) like this:


    ```

    $ `rpm` -`qpil` `xmms-1.2.4-1.rpm`

    `/etc/X11/apppnk/Multimedia/xmms.desktop`

    `/etc/X11/wnconfig/xmms`

    `/usr/bin/wxmms`

    `/usr/bin/xmms`

    `/usr/doc/xmms-1.2.4`

    `/usr/doc/xmms-1.2.4/AUTHORS`

    `/usr/doc/xmms-1.2.4/COPYING`

    `/usr/doc/xmms-1.2.4/ChangeLog`

    `/usr/doc/xmms-1.2.4/INSTALL`

    `/usr/doc/xmms-1.2.4/NEWS`

    `/usr/doc/xmms-1.2.4/README`

    `/usr/lib/libxmms.so.1`

    `/usr/lib/libxmms.so.1.0.0`

    `/usr/lib/xmms/Effect/libecho.la`

    `/usr/lib/xmms/Effect/libecho.so`

    `/usr/lib/xmms/Effect/libstereo.la`...

    ```'
  merge: -1
  img_proc: true
