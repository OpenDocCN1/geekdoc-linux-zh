    You can also define your own, or redefine default key combinations for your use.
    Some helpful default keystrokes are:


    Meta+Button 1 Grab and move window

    Meta+Tab Cycle through windows

    Ctrl+Right Cursor Cycle to next workspace

    Ctrl+Left Cursor Cycle to previous workspace

    Meta+Ctrl+Right Cursor Send current window to next workspace

    Meta+Ctrl+Left Cursor Send current window to previous workspace

    Meta+Ctrl+Up Cursor Raise current window

    Meta+Ctrl+Down Cursor Lower current window


    # ### Configuring Enlightenment


    The Enlightenment window manager, like Sawfish, includes a companion configuration
    program named e-conf. This client is used as a stand-alone program.

    This client provides nearly all the same controls at the sawfish-ui program, and
    may be launched from the command line of an X11 terminal window like this:


    ```

    $ e-conf &

    ```'
