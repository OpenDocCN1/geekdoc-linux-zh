    # ## BSD on the Mac


    The Berkeley Software Distribution, or BSD UNIX, is a variant of the commer-cial
    UNIX tree. Following a series of lawsuits in the mid-1990s, the free portions
    (to-tally rewritten and copyright-free portions) of this operating system were
    released to the world as 4.4BSD-Lite. Following this release, developers started
    working on various ports of this version of UNIX to run on Intel-based PCs.


    # ### Types


    After nearly 10 years, and nearly 30 years after the birth of UNIX, there are
    now three main variants of BSD available royalty and license-free, which include
    FreeBSD, NetBSD, and the ultra-secure OpenBSD.


    One version that is available for use on Apple Power Macs is from http://www.openbsd.org.
    You can download a current development version, or *snapshots*, from ftp://ftp.openbsd.org/pub/OpenBSD/snapshots/powerpc/.
    This version has been in development since 1996, and is actively supported and
    constantly revised. Ac-cording to the OpenBSD project, the current version supports
    the Power Mac G4, Power Mac Dual G4, Power Mac G4 Cube, iMac Rev A, B, C, DV,
    and DV+, along with the FireWire PowerBook G3, and PowerBook (Titanium) G4. Sup-port
    for additional machines may be available by the time you read this.'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# Features


    OpenBSD is one of the premiere operating systems available for any computer. OpenBSD
    is considered one of the most secure operating systems available when installed
    and properly configured. Reliability and scalability (the ability to respond to
    increased resource demands) are key features of all BSD variants.


    # Installation


    One of the great features about OpenBSD is that it can be installed quickly and
    easily. Its main distribution consists of 12 compressed archives comprising less
    than 70MB. A full installation only uses 150MB of hard drive space. Despite this
    small size, there are many additional programs available for OpenBSD. Unlike LinuxPPC
    2000, Yellow Dog Linux, and SuSE PPC Linux, the precompiled binary OpenBSD software
    is distributed in archives known as *packages*. It is manipulated by the `pkg_add`,
    `pkg_create`, `pkg_delete`, and `pkg_info` commands.


    OpenBSD may be installed as the sole operating system, or may be used in a dual-boot
    configuration. There are three basic ways to boot to an install: use a supplied
    CD-ROM boot image; boot via a network (FTP, HTTP); and boot by loading the bootloader
    from an HFS partition. After booting, you will be asked to partition your drive
    and then to create BSD *disklabels*, or entries in BSD’s *disktable*, a database
    of partitions and their (nearly 20) characteristics, such as size and drive geometry.


    Like PPC Linux, booting BSD requires interaction with Open Firmware. With OpenBSD,
    booting will most likely be done from the Open Firmware prompt.


    # Resources


    +   *   [http://www.uk.research.att.com/vnc/index.html](http://www.uk.research.att.com/vnc/index.html).
    Home page for the remarkable free virtual network computing software from AT&T.

    +   *   [http://www.maconlinux.com/](http://www.maconlinux.com/). The MOL home
    page, with links to the latest version of the Mac-on-Linux emulator.

    +   *   [http://www.openbsd.org/powerpc.html](http://www.openbsd.org/powerpc.html).
    Information about Apple NewWorld Power Macs that can run OpenBSD.'
  merge: -1
  img_proc: true
