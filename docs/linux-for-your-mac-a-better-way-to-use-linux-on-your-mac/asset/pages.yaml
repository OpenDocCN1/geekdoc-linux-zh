    shell used on a system, and/or a desired feature list. Some of the shells available
    for Linux on the PowerPC are listed in Table 5.1.


    Note that a number of shells listed in Table 5.1 are graphical programs with menus
    (choice, flin, mc, and webble) and do not fit the traditional definition for a
    Linux shell. Some of the features to look for in a shell include:


    +   - The size of the binary. Is the shell statically linked, or does it depend
    on other software libraries? One function of the sash shell is that it can be
    used during troubleshooting or rescue operations as a shell, and does not depend
    on the availability of external software libraries. If you are crafting a minimal
    Linux installation, then you may want to consider using a smaller shell. Without
    a doubt, the bash shell is the largest and has the most features.'
