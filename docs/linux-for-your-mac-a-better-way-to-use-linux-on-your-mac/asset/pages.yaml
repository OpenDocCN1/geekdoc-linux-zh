- pgno: 347
  md: 'This chapter introduces the basics of system administration for Linux using
    software and graphical administrative tools included with Linux distributions
    for the PowerPC. Why learn system administration? Because you have to! Whether
    you run Linux and X11 on your Mac as a workstation to take advantage of the benefits
    of the X desktop, or simply use your Mac as a server platform to host unique services—every
    system requires system administration. If you are the only one using your computer,
    you are the system administrator!


    Does this mean that you have to put a lot of effort into the job? Of course not!
    However, you will have to learn and understand a few of the basic concepts, especially
    if you want to keep your system safe, secure, and stable. Macintosh computers
    running Linux, especially later models outfitted with modest RAM and larger hard
    drives, are quite capable of hosting hundreds of users. When functioning as a
    system administrator, it does not matter whether you have to handle one, 10, 100,
    or 1,000 users. The object is to ensure maximum uptime with minimum fuss, changes,
    or other inconveniences.


    Experienced Mac users may initially have trouble understanding the capabilities
    that Linux provides for Apple hardware. As the owner and user of a Mac running
    Linux, you are in the driver’s seat when it comes to managing every running process
    or user logged into your system. The sooner you learn a modicum of skills, the
    faster you will be able to troubleshoot and fix problems.


    Being a system administrator can mean being responsible for different tasks within
    different jobs. When using Linux on a Mac, however, you will discover that there
    are common skills shared by every owner. Typical system administration duties
    include:


    +   - **Adding or replacing system hardware.** This can be as simple as adding
    a USB device or changing a printer, or as serious as surgery in hard drive replacement.

    +   - **Configuring and controlling system services.** Do you need a running Web
    server? What do you do when users complain that they cannot telnet or FTP into
    your box? How do you control what services are enabled or disabled when using
    your Linux distribution?

    +   - **Ensuring data integrity.** Devising regular backups, a backup schedule,
    or even performing a backup can save hours of work and loads of grief over lost
    data.

    +   - **Ensuring system security.** Do you want anyone to be able to access your
    system? What steps can you take to make your system safe from intruders?—Especially
    if your computer connects to the Internet.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '+   • Managing system software. When the time comes to remove old software
    and install new packages, knowing what to do can save a lot of trouble. Adding
    a new device driver or upgrading the Linux kernel can make all the difference
    in the world.

    +   • Managing users and passwords. How do you want to handle users on your system?
    Are there certain rules you want in place for guests? How can you limit access
    to system resources, such as RAM or hard drive space, or portions of your directory
    tree?


    Fortunately, Linux includes the software tools you need to administer your system.
    Some distributions include specialized graphical tools that can make the job a
    lot easier. This chapter provides an introduction for the use of these tools (and
    command-line equivalent actions), but the rest will be up to you. Learning system
    administration can take some effort, but the time spent will be well rewarded.


    # Graphical Administrative Tools


    Every Linux distribution, especially those from commercial vendors, touts a toolbox
    of graphical software tools aimed at making Linux management easier. Early software
    tools were in the form of shell scripts, but as Linux has matured, commercial
    distributors such as Red Hat, Inc. wrapped various system administration tools
    in graphical interfaces. To Red Hat’s credit, many of these original tools survive
    today in the Yellow Dog Linux and LinuxPPC 2000 Q4 distributions.


    SuSE, Inc. includes a text-based console administrative tool named YaST, and another
    setup tool named Yet, which has a legacy stemming back to 1995. More recently,
    SuSE has included a graphical, X-based version, the YaST2 client. These tools
    can be used by SuSE PPC Linux users, in the same way the Yellow Dog Linux and
    LinuxPPC 2000 linuxconf clients are—to control nearly every aspect of a Linux
    system.


    Keep in mind however, that you will still benefit from learning how to manually
    configure your system. Relying on X-based administrative tools can lead to an
    inconvenient situation, especially if you are suddenly dropped into single-user
    mode, or have to reboot your system to a runlevel that does not support X and
    networking.


    # Using Legacy Red Hat Tools


    Red Hat, Inc.’s version of Linux has had a profound impact on nearly all Linux
    distributions for Intel-based PCs, Sun SPARC workstations, and Alpha-based'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'CPU servers. This impact is also evident in PowerPC Linux distributions such
    as Yellow Dog and LinuxPPC 2000 Q4, because both distributions include legacy
    Red Hat tools.


    The oldest, all-encompassing tool is the control-panel, a GUI dock (developed
    in the Python and Tcl/Tk languages) that holds one or more additional administrative
    tools. Under LinuxPPC for example, the `control-panel`, when launched, provides
    a dock for seven legacy and one newer system-administration tool popularized by
    Red Hat''s distribution. The `control-panel` client may be launched from the command
    line of an X11 terminal window like this:


    ```

    ```

    # control-panel &

    ```


    ```


    After you press Enter, you will see its window, as shown in Figure 14.1.


    Click on a specific icon to launch a particular administrative tool. The tools
    docked in `control-panel`''s window include a rnel/vel editor, time configuration
    client, printer setup tool, kernel configuration client, help and search tool,
    `linuxconf`, network interface configuration tools, and a modem tool.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_349_0.png)


    Figure 14.1 *The control-panel client is a convenient dock for graphical system
    administration.*'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# # Using tkaysv


    The `tkaysv` client is a runlevel editor that presents the myriad of inter-depen-

    dencies of various runlevels matched against installed system services. Launch
    this

    client by clicking its icon or from the command line of a terminal window like
    this:


    ```

    ```text

    # tkaysv &

    ```

    ```


    After you press Enter, you will see its window, as shown in Figure 14.2.


    This editor can be used to rearrange, create, or delete services for various runlevels.

    Use its interface to assign actions for different services listed in its Available
    field.

    Note that the editor will not work on runlevels 0, 1, or 6. This is because these
    are

    the halt, single-user (maintenance), and reboot runlevels. This tool can be handy,

    for example, when having certain services start before or after each other (such
    as

    starting PCMCIA services and then starting networking after the interface has

    been configured).


    # # Using the timetool


    The `timetool` client is used to set the system date and time. Launch this tool
    by

    clicking its icon in the panel window, or by typing its name at the command line
    of

    an X11 terminal window like this:


    ```

    ```text

    # timetool &

    ```

    ```


    After you press Enter, you will see its window, as shown in Figure 14.3.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_350_0.png)'
  merge: -1
  img_proc: true
- pgno: 351
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_351_0.png)


    *Figure 14.3 The timetool client is used to set the current date and time.*


    Click on a day, month, year, hour, minute or second, then click the up or down
    buttons to scroll the date and time. Using this client can be easier than trying
    to remember the format of the `date` command, which performs the same operation.
    For example to set the date and time, use the `date` command like this:


    ```

    # date 09211750

    ```


    After you press Enter, the system''s time will be set to September 21, 5:50 PM.


    # Linux is a Two-Timer!


    There is a difference between the Linux system time and your computer''s hardware
    clock. If the two are not in synch and your computer has a long uptime, you will
    find that the Linux system''s idea of the time (as returned by the `date` command)
    and your hardware''s idea of the time will drift apart. However, there are at
    least two commands you can use to keep your PowerPC hardware and Linux in synch.


    The first command, `rdate`, is the easiest to use if you have an active Internet
    connection. As root, use the `rdate` command with its `-s` option, followed by
    the hostname of an open-access Internet time server offering your local time,
    such as `tick.usno.navy.mil` for EST/DST users. The `rdate` command will automatically
    set your system''s time using the returned (and deemed authentic) values.


    The other way Intel-based Linux users keep the computer and operating system in
    synch is with the `hwclock` command. For example, `hwclock --syssto...` sets the
    hardware clock to the system time. On the other hand, using `--hctosys` sets the
    system time according to the hardware clock. The `hwclock` command can also be
    used to learn, measure, and compensate for any drift between software and hardware.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Under PPC Linux however, this command does not work, and the clock command
    must be used instead. Use `clock -w` to set the hardware clock to the system time.
    Use `clock -s` to set the system time from the hardware clock. Don’t confuse the
    clock command with the X11 client named *clock*! You’ll find the hardware- and
    system-based `clock` command under the `/sbin` directory. The other *clock* client
    will be found under the `/usr/X11R6/bin` directory.


    # Using printtool


    The *printtool* command, as you have learned in Chapter 3, “Post Installation
    Configuration,” is a printer configuration tool that uses a database of printer
    capabilities and Red Hat’s print filtering system to properly incorporate or accommodate
    your printer for use with Linux. This client may be launched from the panel or
    the command line of an X11 terminal window like this:


    ```

    # printtool &

    ```


    After you press Enter, you will see the *printtool* dialog box, as shown in Figure
    14.4. This client may be used to fine-tune printer control settings, or to make
    adjustments to your system, such as adding or removing printing service.


    # Using kernelcfg


    The *kernelcfg* client is a graphical kernel module handling tool that you can
    use to load or unload kernel modules. This client depends on a specific database
    under the /boot directory that contains relationship settings for modules used
    for the currently running kernel. Launch this client from the panel or the command
    line of an X11 terminal window like this:


    ```

    # kernelcfg &

    ```


    After you press Enter, its main dialog box will appear as shown in Figure 14.5.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_352_0.png)


    Figure 14.4   The *printtool* client configures local and remote printers for
    use with Linux.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_353_0.png)


    *Figure 14.5* The kernelcfg client uses kernel module dependencies and a specific
    /boot directory database to offer graphical module handling.


    # Using helptool


    The helptool client can be used to quickly search your system for helpful documents.
    Though not as glamorous or capable as SuSE’s, GNOME’s, or KDE’s built-in help,
    helptool is, however, helpful when attempting to find topical help on a variety
    of subjects. This client may be launched from the panel or the command line of
    an X11 terminal window like this:


    ```

    # helptool s

    ```


    After you press Enter, the helptool dialog box will appear. Start your search
    by clicking in Search for: field, then click the Search button. After some time,
    you may see results such as those shown in Figure 14.6.


    This client searches along predetermined paths, looking for matches in documents
    under specific directories. If you click the Configure button, you can customize
    your searches along specific paths or through specific documents. When results
    are returned, double-click on a filename and the file will be displayed in a separate
    window.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_353_1.png)


    *Figure 14.6* The helptool client searches pre-configured paths for topical matches
    in documents, manual pages, or GNU info documents.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'A simplistic command-line equivalent (limited to a single directory search)
    for help2conf would use the find, xargs, fgrep and less commands like this:


    ```

    $ find / | xargs fgrep searcbst | less

    ```


    In this example, the find command feeds the xargs'' fgrep command a list of filenames.
    The fgrep command will then only display matching lines containing searcbst, preceded
    by the file''s path. By using the less pager you can then quickly browse through
    a list of documents that contain the search string.


    # # Using netcfg


    The netcfg client is a an easy-to-use networking tool that can quickly set up
    your system''s /etc/resolv.conf, /etc/hosts, and networking device initialization
    scripts to support built-in Ethernet interfaces and PCI or PCMCIA network cards.
    As with all system administrative tools, this client requires root access. netcfg
    may be launched by clicking its icon on the panel, or from the command line of
    an X terminal window like this:


    ```

    # netcfg &

    ```


    After you press Enter, its main dialog box will appear, as shown in Figure 14.7.


    This client can be used to create and control PPP, PLIP, SLIP, Ethernet, and a
    variety of network interfaces for your system. You can also alter your system''s
    routing table to accommodate other subnets, define a gateway, or determine how
    an interface is assigned an IP (Internet Protocol) address.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_354_0.png)


    Figure 14.7  The netcfg client can be used to quickly define and save a variety
    of network interfaces for a Red Hat-based Linux system.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# ### Using modemtool


    The `modemtool` client, shown in Figure 14.8, is a simple graphical interface
    client that merely creates a symbolic link named `/dev/modem` that points to your
    system''s modem port. The actual modem port could be `/dev/ttyS0`, `/dev/ttyUSB0`,
    or even `/dev/ttyS14`, depending on your Macintosh hardware.


    You can launch `modemtool` by using its icon on the panel, or from the command
    line of an X terminal window like this:


    ```

    # modemtool &

    ```


    After you press Enter, its small dialog box will appear, as shown in Figure 14.8.
    Unfortunately, `modemtool` is brain-dead, with no built-in logic or search capability,
    as is possessed by the modem configuration feature of KDE''s `kppp` client. You
    can accomplish the same task as `modemtool` by using the `ln` command like this:


    ```

    # ln -s /dev/ttyS0 /dev/modem

    ```


    In this example, the `/dev/ttyS0` device is known to have an attached modem. The
    `ln` command is then used to create the symbolic link `/dev/modem`.


    # ### Using linuxconf


    The `linuxconf` client is a comprehensive configuration and control client that
    is somewhat on a par with SUSE''s `yast` command (discussed later in this chapter).
    Launch the `linuxconf` command from the control-panel client or the command line
    of an X terminal like this:


    ```

    # linuxconf

    ```


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_355_0.png)


    Figure 14.8 *The `modemtool` client simply creates a symbolic linked named `/dev/modem`
    that points to your computer''s modem port.*'
  merge: -1
  img_proc: true
- pgno: 356
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_356_0.png)


    *Figure 14.9 The linuxconf client is a comprehensive tool you can use to manage
    your system.*


    If you run `linuxconf` for the first time, you will see a large introductory dialog
    box. Press the *Quit* button, and its main dialog box will appear, as shown in
    Figure 14.9. The `linuxconf` dialog box splits tasks into configurations and controls.
    Configuration tasks include:


    +   * **Networking.** Client tasks, such as hostname, nameserver, routing, and
    PPP configuration; server tasks such as NFS (*Network File System*), Apache, DNS
    (*Domain Name Server*), mail, Samba, and FTP; and miscellaneous tasks such as
    administrative network access.

    +   * **User Accounts.** Normal users and groups; special accounts, such as PPP,
    SLIP, and POP; e-mail aliases; policies such as passwords expiration, shells,
    and the MOTD (*Message Of The Day*).

    +   * **Filesystems.** Accessing mounted volumes; swap file management; and quotas.

    +   * **Miscellaneous services.** Initial system services to use and modem management.

    +   * **Boot mode.** Boot prompt management and shell assignment.


    Control tasks available through the `linuxconf` dialog box include:


    +   * **Control panel.** Change activation; reboot and shutdown; mounting and
    unmounting of filesystems; superserver schemas; configuration archiving.

    +   * **Control files and systems.** Configure configuration; files; commands;
    file permissions; `linuxconf` modules and addons.

    +   * **Logs.** Date, time, timezone control; `linuxconf` keyboard controls.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Using SuSE''s YaST Command and YaST2 Client


    SuSE Linux is well known for providing a comprehensive, easy-to-install and manage,
    Linux system. One of the most impressive features about SuSE is the tight integration
    of system management tools and scripts. Although it is possible to manually configure
    a SuSE Linux system, unlike other Linux distributions, this Linux distribution
    is best administered using the `yast2` graphical client, or until recently, the
    `yast` console command.


    Both clients provide access to SuSE''s central resource configuration file, `/etc/rc.config`.
    This file contains settings for many different aspects of your system, and looks
    like (in part):


    ```

    ```

    ...

    # NIS(YP)/NIS+ domainname, ask the admin of the server.

    #

    YP_DOMA"INNAME=""

    #

    # Start the rpc.ruserd daemon in multi-user? ("yes" or "no")

    # rpc.ruserd is a server which returns information about users currently

    # logged in to the system.

    #

    START_RUSERD="no"

    #

    # Start the rpc.rstatd daemon in multi-user? ("yes" or "no")

    # rpc.rstatd is a RPC daemon which collects performance statistics from

    # kernel on serving machine.

    #

    START_RSTATD="no"

    ...

    ```

    ```


    The traditional, console-based `yast` command does not require an active X session,
    unlike many other graphical administration tools. This is extremely handy if you
    would like to administer a remote computer on your network through dial-up access.
    However, the `yast2` client does require an active X session, and it may be used
    over a higher-speed network to administer a remote computer. Both clients must
    be run as root.


    Launch the console-based `yast` command from the command line like this:


    ```

    ```

    # yast &

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 358
  md: "![](img/1ea833f5a3e3c1547e3dd2891f52804a_358_0.png)\n\n*Figure 14.10 The yast\
    \ command is SuSE's comprehensive administration tool.*\n\nAfter you press Enter,\
    \ its main dialog box will appear, as shown in Figure 14.10. The `yast` command\
    \ provides user, system, network, and software management. Several of its initial\
    \ menu items lead to further menus you can use to maintain your system. For example,\
    \ choosing the Adjustments menu item provides for changing the language setup,\
    \ keymaps, location of SuSE Linux installation software, and partition management.\
    \ However, the main functions are found under the System administration menu item.\n\
    \nThis menu provides for:\n\n+   - **Hardware configuration.** New keyboards,\
    \ pointing devices, printers, scanners, modem, CD-ROM drives, and networking interfaces.\
    \ \n+   - **Configuration.** For nearly all networking services, and devices.\
    \ \n+   - **Boot mode management.** Such as using an X11 display manager. \n+\
    \   - **Managing users and groups.** \n+   - **Performing system backups.** \n\
    +   - **Security settings.** To restrict system access or enable other security\
    \ features. \n+   - **Date, time, and time zone settings.**\n\nTo use the graphical\
    \ yast2 client, type its name on the command line of an X11 terminal window like\
    \ this:\n\n```\n# yast2 &\n```\n\nAfter you press Enter, its main administration\
    \ tool will appear, as shown in Figure 14.11."
  merge: -1
  img_proc: true
- pgno: 359
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_359_0.png)


    Figure 14.11 The yast2 client is SuSE’s newest graphical administration tool.


    Like the `yast2` command, `yast2` provides device, software, networking, and remote
    system management. Its initial menu items launch administrative modules you can
    use to maintain your system. These include:


    +   - **Hardware.** To configure printers and system sound services.

    +   - **Software management.** To install, remove, or update system software.

    +   - **Networking.** Configuration and control of server software, remote filesystems
    (such as NFS), and electronic mail.

    +   - **System tuning.** At the time of this writing, this feature only covers
    use of Direct Memory Access (DMA) controls of IDE hard drives.

    +   - **Remote services.** Remote administration and installation allows a network
    administrator to launch `yast2` modules on remote computers, or install SuSE Linux
    via a serial networking connection.


    # Other Legacy Tools


    You may find one or more legacy graphical administrative tools included with Yellow
    Dog Linux and LinuxPPC 2000 Q4. These tools are console-based, and do not require
    an active X session. Although not as comprehensive as `yast` or `linuxconf`, these
    programs still fulfill a niche in system administration. One program named `ntsysv`
    is used to control which services should be started the next time the system is
    booted.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_360_0.png)


    Figure 14.12  The `ntsysv` command is a useful legacy tool you can use to control
    services on a Red Hat-based PowerPC Linux system.


    Start `ntsysv` (as root) by typing its name on the command line of your console
    or an X11 terminal window like this:


    ```

    # ntsysv

    ```


    After you press Enter, the console will appear as shown in Figure 14.12.


    This command works similarly to the manual `chkconfig` command, which can be used
    to reorder services in various runlevels. When using `ntsysv`, scroll through
    the list of services and press the spacebar to toggle whether or not you would
    like to use that service the next time your system boots.


    You can quickly start, stop, or restart a particular service, such as Apache,
    by specifying its script name under the `/etc/rc.d/init.d` directory like this
    (as root):


    ```

    # /etc/rc.d/init.d/httpd start

    # /etc/rc.d/init.d/httpd stop

    # /etc/rc.d/init.d/httpd restart

    ```


    These command lines will start, stop, or restart (handy after making any service
    configuration changes) a specified service. To put a change into effect for a
    particular runlevel, use the `chkconfig` command. This program is used from the
    command line to make changes in the `/etc/rc*.d` directories, where *x* represents
    a particular runlevel.


    You can also get a quick snapshot of your entire system''s services configuration
    by using the `chkconfig` command with its `--list` option like this:


    ```

    # chkconfig --list

    syslog     0:off   1:off   2:on    3:on    4:on    5:on    6:off

    crond      0:off   1:off   2:on    3:on    4:on    5:on    6:off

    ```'
  merge: -1
  img_proc: true
