    # # Using the find Command


    The `find` command is an indispensable tool for system administrators. It is used
    to quickly locate files across one or more filesystems according to a variety
    of search expressions, such as name, date, time, owner, and size. This command
    is used to quickly build practical logs of information about your system that
    can be used for back up operations or security.'
