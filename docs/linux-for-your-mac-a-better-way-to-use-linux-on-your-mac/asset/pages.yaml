    # ## Using Graphical RPM Tools


    You can use many graphical RPM clients during your X sessions with Linux. Of course,
    SuSE Linux users will want to (and perhaps should) use the `yast` command to install
    and remove software. Any PowerPC Linux user (as the root operator) can use these
    graphical tools to browse through installed software and perhaps manage Linux
    software.


    # ## Using gnomrpm


    If you use GNOME during your X sessions, you will find the `gnomrpm` client to
    be a handy graphical interface to the `rpm` command. This client provides dialog
    boxes, buttons, menus, and icons you can use when administering software on your
    system. You must run the client as the root operator.


    Start `gnomrpm` (as root) by typing its name on the command line of an X11 terminal
    window like this:


    ```

    # gnomrpm &

    ```


    After you press Enter, it will start up, then read your system''s RPM database
    (usually found under the `/var/lib/rpm` directory), and display a window as shown
    in Figure 14.13.


    Your system''s installed software will be displayed in a hierarchical list along
    the left side of the window. Click on a group of packages to see the applications
    or software installed on the group. Icons of packages will appear in the right
    window.'
