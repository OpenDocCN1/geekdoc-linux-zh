- pgno: 39
  md: 'running a small system like this can require advanced administrative skills
    and knowledge about Linux.


    +   A standard system. This 900MB install provides a minimalist Linux system that
    includes XFree86, printing support, Internet access software, and other tools.
    This is the minimal system you can install and still use Linux productively as
    a workstation.


    +   A standard system with office. This 1.4GB installation includes some more
