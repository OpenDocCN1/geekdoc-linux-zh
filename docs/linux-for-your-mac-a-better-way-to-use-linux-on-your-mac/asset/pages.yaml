    \ copy the file (as root) to this directory as `doom2.wad`. Finally, navigate\
    \ to a command line, sit back, and launch into a game with a specific window size,\
    \ like this:\n\n```\n`$ /usr/local/games/ixdoom -height 600 -width 840 &`\n```\n\
    \nThe game will start and display, as shown in Figure 18.10.\n\n# Miscellaneous\
    \ fun Clients\n\nJust because X is the world's premiere graphical networking software\
    \ does not mean that it is all business. You find several clients for X that do\
    \ not fall into the categories of a game, but are fun to use. The first is the\
    \ `xroach` client. This client unleashes an infestation of pixel-driven roaches\
    \ upon your desktop. When the lights go in the night, these animated roaches scurry\
    \ around your desktop, and then quickly hide under any windows or icons, imitating\
    \ the live insects.\n\nYou may not want to use the `-display` option to send an\
    \ infestation to a fellow worker's remote display, but you may want to try the\
    \ `-squish` option for a little target practice with your pointer, like this:\n\
    \n```\n`$ xroach -squish -speed 1 &`\n```\n\nAfter you press Enter, 10 roaches\
    \ will roam around your desktop. Click on a roach, and you will understand the\
    \ `-squish` option."
  merge: -1
  img_proc: true
- pgno: 469
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_469_0.png)


    Figure 10.10 The game that spawned a legion of followers is available for Linux
    in source code form!


    # Virtual Fish


    While you can use various X clients to set the desktop color or place images in
    the root window, only the xfishtank client provides an animated desktop with swimming
    fish. Start the client from the command line of an X terminal window, like this:


    ```

    $ xfishtank &

    ```


    > Note that the xroach and xfishtank clients may only work with legacy X window
    managers such as fvwm2 or twm. For example, KDE maintains private versions of
    its desktops, and the clients will not work.


    # Commercial Linux Games


    As Linux becomes more popular, commercial game developers are seeing market opportunities
    that did not exist before. And because of the increasing portability of software,
    writing games for Linux makes it easy to port exiting games to new versions.


    By their nature, commercial games are polished, professional products with sophisticated
    graphics, music, video, and sound. However, all share some common traits'
  merge: -1
  img_proc: true
- pgno: 470
  md: 'including large hard drive storage requirements for full installation, enormous
    CPU resources, and extra memory requirements. More than any other type of application,
    games tax a computer''s resources to the limits. This is necessary to support
    detailed graphics and long sound clips in use during play.


    # ## Myth II


    Myth II: Soulblighter is a strategy simulation that combines role-playing, sound,
    and animation to provide lots of action. You are in charge of a band of soldiers,
    knights, dwarves, and other creatures, and are assigned missions as part of your
    tasks. A version of this game from Loki Entertainment is available for PPC Linux
    (and was included with *LinuxPPC 2000 Q4* for a time).


    Insert and mount the game CD-ROM, and then start the install as root. After Myth
    II is installed, the software resides under the `/usr/local/games/myth2` directory.
    A full installation requires nearly 650MB of hard drive space. Start the game,
    like this:


    ```

    ```

    $ /usr/local/bin/myth

    ```

    ```


    After the introduction finishes, run through the game''s tutorial mode to learn
    more about using the keyboard and mouse. When ready, play a new game by clicking
    the game button. Game play is as shown in Figure 18.11.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_470_0.png)


    *Figure 18.11* *Loki''s port of Bungie''s Myth II is a great game for X and Linux
    PPC!*'
  merge: -1
  img_proc: true
- pgno: 471
  md: '442


    Chapter 18: Having Fun


    # Railroad Tycoon II


    Railroad Tycoon II combines strategy simulation and adds a great deal of detail
    in its animation. As you wheel and deal your way to buy and build your railroad
    empire, you can watch trains run across the track you have laid and bridges you’ve
    built.


    Although released only to work with Intel-based PCs running Linux, there are two
    patches you can download to enable the install and play of Railroad Tycoon II
    while using PPC Linux. Here are the basic steps needed to patch and install and
    play the game. First, download two PPC patches, like this:


    ```

    ```

    rt2-1.54b-ppc.run

    rt2-dynamic-1.54b-ppc.run

    ```

    ```


    You will find copies at: `ftp://boudicca.tux.org/misc/lokigames/patches/rt2/`


    Next, insert mount the game CD, then run the first patch (as root), like this:


    ```

    ```

    # sh rt2-1.54b-ppc.run

    ```

    ```


    This will allow you to install RailroadTycoon onto your PowerPC hard drive, with
    a 200MB install typical. You can choose various types of installation, but more
    complex scenarios and campaigns are available if you insert and mount your Railroad
    Tycoon CD-ROM during game play.


    During the install, the second patch should automatically be used. After the software
    is installed, you must run the game in a window (instead of the default full-screen),
    like this:


    ```

    ```

    $ rt2 --windowed

    ```

    ```


    Game play is as shown in Figure 18.12. The only thing you will miss by using the
    patch to make this game work is video (which is only used in the introduction
    or cutaway scenes).


    # Resources


    +   - http://www.lokigames.com. Home page for the folks who are bringing quality
    games to Linux and X. You will find links to order games online, or to download
    demos of ones that interest you.

    +   - http://www.kde.org. Home page for KDE and a starting point to look for new
    KDE games.

    +   - http://www.gnome.org. Home page for the GNOME project; you will find links
    to newer software, such as games, starting here.'
  merge: -1
  img_proc: true
