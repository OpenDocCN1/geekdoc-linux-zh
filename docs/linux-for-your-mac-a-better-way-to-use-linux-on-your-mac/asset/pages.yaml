- pgno: 43
  md: 'Are you ready to take the plunge? If so, this chapter will help you get started.
    Using Linux and the X Window System on a Power Mac is a wonderful experience.
    Getting there does not have to be a painful process, but there are some steps
    you need to take before you arrive at your first login.


    This chapter explores initial considerations regarding the installation process
    and the ideal candidate platform for installation. You will get some basic pointers
    on the rudimentary requirements, and learn about performing a process rarely required
    for Mac OS—partitioning of the hard drive. Finally, you will get a laundry list
    of steps required to install three different Linux distributions: Yellow Dog Linux,
    LinuxPPC 2000, and SuSE PPC Linux.


    Installing Linux is not hard, and with a little guidance you can easily perform
    the following basic steps:


    +   1. Boot your Power Mac with its System Restore CD-ROM.

    +   2. Partition your hard drive.

    +   3. Reboot and restore Mac OS.

    +   4. Reboot and install Linux.

    +   5. Reboot to Mac OS and configure your bootloader.


    Most users create a dual-boot system that supports Mac OS and Linux. If you plan
    to use Mac OS, Mac OS X, and Linux, you may want to install each operating system
    on its own partition. This chapter only covers installation of a Mac OS and Linux
    dual-boot configuration.


    # Initial Considerations


    Experienced Linux users migrating to different platforms discover that using Linux
    on Intel-based PC hardware on PowerPC-based hardware is exactly the same. The
    only difference is how to get there, and even that process has similarities. This
    section introduces a few concepts to keep in mind before you travel down the road
    towards installation.


    The first concept concerns display requirements. You will then learn about how
    Linux uses memory. Finally, you will get a rough idea about the type of hard drive
    storage requirements needed for various types of installations.


    # Display Requirements


    Linux is the kernel, or core of the operating system. A collection of programs
    and documents bundled with Linux on a CD-ROM is known as a Linux distribution.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The graphical interface for Linux is the X Window System (known as X11R6, X11,
    or X, which is a free software package maintained by X.org, a non-profit consortium
    of companies). The version of X included with most Linux distributions is a free
    port of X prepared by the XFree86 Project, Inc.


    The issue regarding display requirements generally concerns the default size of
    the desktop. This size is most often referred to in terms of resolution, or the
    number of pixels (dots) running horizontally and vertically across your computer''s
    monitor or LCD panel.


    Most early desktop PowerPCs (with small monitors), older PowerBooks, and until
    this year, iBooks, feature resolutions of 800x600. (The legacy Macintosh had a
    resolution of 512x384!) While 800x600 may be considered enough resolution to accomplish
    work, you should consider 1024x768 to be the minimum resolution to aim for when
    configuring X to work with your system. Fortunately, nearly all monitors in use
    today support this resolution as a minimum.


    Another consideration is color depth, or the number of simultaneous colors that
    may be displayed on the screen. This factor is determined by your Power Mac''s
    video hardware, the amount of video memory available, and the resolution used.
    Obviously, greater resolution requires more video memory. When using Linux and
    X, consider thousands of colors, or 16-bpp (bit-planes) resolution a minimum.


    Unless you have an older PowerBook or iBook, you should aim at configuring X at
    1024x768 using 16-bpp. Newer iBooks now sport a resolution of 1024x768.


    # ## Memory Requirements


    Linux is an amazing operating system that works well even on systems with little
    memory. One of its biggest growth areas has been in the embedded market, where
    it has been shoehorned to run in as little as 2MB RAM. However, if you plan to
    use X, along with other applications such as Netscape Communicator, RealPlayer
    G2, and perhaps a commercial office suite such as Applixware, consider 64MB the
    bare minimum. If you have an older PowerBook with less memory, you will want to
    beef it up to bring the total to at least 64MB.


    The last PowerPC Apple Computer sold with less than 64MB was the original iBook,
    which was sold with 32MB. This computer has a spare slot for memory, so an additional
    32MB may be added inexpensively.


    # ## Hard Drive Requirements


    Linux, along with a variety of programs, may be installed on a single 1.44MB floppy
    disk. A minimal installation of PowerPC Linux requiring only 70MB is'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'possible, but you will not be able to enjoy the full experience of using a
    graphical interface, and you will miss out on a lot of useful software. A more
    basic install-ation of 500MB is possible, but you will want extra hard drive space
    to install additional software, perhaps learn programming, or create graphics
    documents.


    In general, reserve at least 1.5GB or more for Linux. On older systems this may
    seem inconvenient or impractical, so you may want to consider adding an extra
    hard drive. The original Apple iBook came with a 3.2GB drive; a full Mac OS 9
    restore requires less than 700MB, so there’s plenty of room for Linux.


    Some PPC Linux distributions include several CD-ROMs of software. For ex-ample,
    SuSE PPC Linux includes six full CD-ROMs. Performing a full installation can require
    more than 6GB of hard drive space.


    # Partitioning


    Partitioning is the process of splitting a hard drive’s storage capacity to support
    additional volumes or filesystems. When you install or restore Mac OS to your
    hard drive from the supplied restore CD-ROM, the Mac OS software creates eight
    smaller partitions to hold various parts of the Mac OS (this is not, however,
    readily apparent).


    Preparing your hard drive to support a Linux install is fairly easy, as the preferred
    partitioning tool is currently Apple’s Drive Setup. This graphical tool supports
    the creation of Mac OS HFS Extended, HFS Standard, A/UX (Apple’s legacy UNIX),
    and in newer incarnations, Linux PPC native, and swap (virtual memory) partitions.


    # Partitioning before Installation


    When planning your Linux installation, keep in mind that Linux requires at least
    two partitions: a single root partition and a swap partition that is typically
    two times the size of installed RAM. Along with the Mac OS and Linux partitions,
    you should also create a small HFS Standard (not HFS+) partition. This Linux boot
    partition can be as small as 32MB, and is used to hold the bootloader software
    and the Linux kernel to be booted.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_45_0.png)


    If you anticipate sharing large files between Mac OS and Linux, create a larger
    addi-tional HFS partition, or enlarge your HFS boot partition. This is necessary
    because Linux does not support reading and writing of HFS+ partitions at this
    time.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Therefore, when you use Drive Setup remember to create:


    +   • A Mac OS HFS+ partition (minimum of 800MB to 1GB).

    +   • A small HFS (Linux boot) partition (about 32MB).

    +   • A single Linux (type A/UX or Linux) partition (1.5GB or more).


    Another approach would be to create:


    +   • A Mac OS HFS+ partition (minimum of 800MB to 1GB).

    +   • A small HFS (Linux boot) partition (about 32MB).

    +   • A root Linux partition (type A/UX or Linux) (1.5GB or more).

    +   • A swap Linux partition (type A/UX or swap) (128MB or more).


    If you create a single Linux partition, you will need to repartition again during
    the Linux installation process. To avoid this, create any needed partitions ahead
    of time with Drive Setup.


    To begin, reboot your Power Mac with its Restore CD-ROM. Hold down the e key while
    rebooting to boot from the CD-ROM. Next, start the Drive Setup application (found
    in the Utilities folder). Select your Macintosh hard drive, and click the Initialize
    button.


    In the next dialog box, click the Custom Select button. The pop-up menu offers
    a variety of partitioning schemes, including a preferred Linux PPC setup. However,
    you do not have to choose this setup. Instead, select four partitions. Click and
    drag the first partition to size your HFS+ Mac OS partition. When finished, click
    on the second partition and drag to size it for your 32MB HFS Standard partition
    (you can also just type 32 in the Size field). After this, click in the fourth
    partition and size it for swap memory, which should be twice the amount of installed
    RAM. Make sure to assign it a type of A/UX swap. Finally, the fourth partition
    remains for Linux, and should be at least 1.5GB. Make sure to assign it a type
    of A/UX root. You should end up with the following:


    +   • **Partition 1.** HFS+ partition (perhaps 800MB)

    +   • **Partition 2.** HFS partition (32MB)

    +   • **Partition 3.** A/UX root (for Linux)

    +   • **Partition 4.** A/UX swap (for Linux swap)


    When finished, click the OK button and initialize the hard drive. After the drive
    is initialized, two Mac OS volumes appear on the Desktop. Click the Restore software
    icon and restore your Mac OS system onto the HFS+ volume.


    You are now ready to install Linux.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# ## **Partitioning Tools during Installation**


    LinuxPPC 2000 uses a partitioning tool during installation named `perlisk`. Another
    tool that is commonly used is `pdisk` (Intel-based Linux installers use a tool
    named `fdisk`). If you partition your drive ahead of time using Drive Setup, you
    avoid using native Linux tools.


    After installation of Linux, you can add additional drives, but you will not be
    able to create Extended HFS partitions (you can use the `nfosmat` command to create
    a Standard HFS volume).


    # ## **Installing Yellow Dog Linux 2.0**


    This section details installation of YDL 2.0. As before, if you have a newer Apple
    Power Mac, you’ll need to create a small HFS partition to hold `yaboot` and a
    PPC Linux kernel. You’ll also need to make room for Linux. You should perform
    this partitioning prior to using the YDL 2.0 CD-ROM in order to preserve existing
    Mac OS files. Reboot your computer with your Yellow Dog Linux CD-ROM by holding
    down the **e** key. Linux boots, and you are greeted with an initial Yellow Dog
    Linux boot prompt. Press **Enter** to begin, or tap the **Tab** key to view various
    installation options. For example, to install YDL on a legacy iBook, which requires
    a text-based install, you should type:


    ```

    ```

    boot: install-novideo

    ```

    ```


    Other options include installation from a hard drive partition, graphical install,
    and combinations of installs with or without the use of video. After pressing
    **Enter**, the installer will load the Linux PPC kernel, then boot. You’ll then
    be asked to agree or disagree with the YDL license agreement. If you’re performing
    a text-based install, use the **Tab** key to navigate through the dialog boxes
    to highlight a desired button, then press **Enter**. Use the spacebar to toggle
    selections. If you’re performing a graphical install, use your mouse to click
    the appropriate buttons.


    You are asked to select a language. Click or select your language, then click
    the OK button to continue.


    YDL offers a Default or Custom installation option. Choosing a Default installation
    is probably a good idea if you are reinstalling, or installing on a known system
    and know what to expect during the installation. Default installation uses autoprobing
    of hardware and the installer’s internal logic to make choices. The rest of this
    section covering YDL goes through a Custom install.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'You are asked to select your keyboard. Press Enter or click OK to continue,
    then choose your type of keyboard. You are asked to choose your mouse. Again,
    press Enter or click OK to continue and choose your mouse.


    # Configuring Partitions and Installation


    Next you''ll be asked about drive partitioning. After selecting the designated
    drive, click the Edit button. You''ll then be presented with a partition map of
    the selected drive. If the current partitioning is OK, then continue the install.
    Otherwise, you''ll need to either delete or add partitions to create the minimal
    HFS boot, / (root), and swap partitions. Adding or deleting partitions will cause
    the new partitions to be formatted. Existing partitions remain untouched.


    You''ll then be asked to choose the mount points for your partitions. Click on
    each partition and type in its Linux mount point (such as /mnt, /boot, /, or /home).
    Note that you do not assign a mount point for your swap partition! After confirming
    the mount points, you''ll then proceed to package selection.


    You''ll have your choice of a base, home/office, development workstation, Internet
    server, LAN/WAN server, or Everything installations. A base install is not recommended,
    as you won''t be able to use X. Choose an installation that suits your needs.
    The installations range from 500MB to 2GB for everything. Select an installation,
    then press Enter or click the OK button.


    The installer will read a database of software packages, choose the appropriate
    software and support libraries, and copy the packages to your hard drive. Go take
    a coffee break, but keep an eye on the Overall Progress indicator on the screen.


    # Saving Settings


    After Linux and the distribution software are installed, you''ll be offered the
    opportunity to save your previous settings. This can be handy, especially if you''ve
    never installed Linux before, and need to return to the install. When finished,
    press Enter, or click OK.


    You are asked if you want to configure your LAN. If you say Yes, you are asked
    if you want to assign an Internet Protocol address. You can assign a static IP
    (used every time you boot). If you do not want to network your computer, highlight
    No and press Enter. You can always add a networking interface later on. You''ll
    also be asked to enter your domain name (such as home.org), along with a hostname
    (such as "stinky") for your computer. If you know the IP addresses of your LAN''s
    nameserver, enter those addresses as well.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Time and Service Configuration


    The installer asks for your time zone, and whether or not your computer''s hard-ware
    clock is set to Greenwich Mean Time. Use your keyboard or mouse to make a choice
    and press Enter to continue. You are asked to select various software and network
    services to start when Linux boots. If you are not sure, just highlight the OK
    button and press Enter. You can always control these services later on.


    # System Security and Accounts


    You can also choose a method of system security. If you''re not sure, just use
    the OK button to continue.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_49_0.png)


    See Chapter 3, “Post-Installation Configuration,” for tips on setting up a printer.
    Chapter 6, “Using Text Editors,” has tips on how to print.


    In the Account Creation section, you are asked to enter a password for the root
    user. This is extremely important. Enter the same password twice and do not for-get
    it! You are then asked for approval of the default authentication mechanism. Highlight
    the OK button and press Enter. Now you can create additional users for your system.
    You should always create a username for yourself!


    The installer offers to configure your sound system. Click OK to continue.


    You can create a bootstrap partition or boot directly from Open Firmware. Older
    Power Macs may be able to use BootX, while newer Power Macs must use yaboot.


    # X Configuration


    The installer probes your hardware and reports on the video card. You may also
    be offered the chance to define your monitor settings for horizontal and vertical
    resolu-tions, along with color depth settings. Press Enter to continue, and the
    XFree86 server is installed. After installation, you will be informed that you
    can choose to use the startx command to launch an X session rather than booting
    YDL, or boot di-rectly to a graphical session. If you are not sure about your
    settings, choose to boot to a text-based, not graphical, session.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_49_1.png)


    See Chapter 7, “X11 and Window Managers,” for tips on configuring X for your system.


    You have now installed Linux. Press Enter and reboot to Mac OS.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Configuring BootX


    The BootX control panel can be used to boot PPC Linux on older machines. This
    section details configuration of BootX to boot a YDL installation as an example.
    This approach will work on all Power Macs up to the early iBook. Using BootX does
    not require the use of an HFS Linux boot volume.


    Copy the BootX Stuffit file to your Mac OS Desktop and double-click it. From the
    Install directory on your YDL CD-ROM, copy the file `vmlinix` into the folder
    named Linux Kernels inside the BootX 1.2 folder. Next, select BootX, the BootX
    extension, and the Linux Kernels folder and drag them to the Mac OS System Folder
    and release.


    Go to the Apple menu and choose Control Panels, BootX. In the `/dev/` field, enter
    the partition number of your root Linux partition (such as `hda10`). If you wish
    to pass any kernel arguments (such as `adb_btnson=103,111` for the Apple iBook
    to set F11 and F12 at the middle and right mouse buttons) enter them in the More
    kernel arguments field. Make sure that the Kernel pop-up menu has your desired
    kernel listed. If you wish, check the No video box, and then click the Save to
    prefs button.


    To boot Linux, click the Linux button. Each time you boot your computer, you are
    presented with the BootX dialog box to choose either Mac OS or Linux.


    If you run into trouble following installation, first check Terra Soft’s Web site
    at http://www.yellowdoglinux.com for any bug fixes, errata, or security updates.


    # Installing LinuxPPC 2000 Q4


    Prepare your hard drive as described in the “Partitioning” section earlier in
    this chapter. Insert the LinuxPPC 2000 Q4 Install CD-ROM and reboot your computer
    with the c key held down. When the GNU/Linux splash screen appears, press the
    spacebar.


    You see a screen with a dozen icons. This is a graphical boot menu you can use
    to choose different Linux kernels to boot, reboot, shut down, or go to Apple’s
    Open Firmware prompt.


    > See Chapter 4, “All about Booting,” for more details about Open Firmware.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_50_0.png)


    If you are not sure about the video capabilities of your computer, use the right
    and left arrow keys to highlight the Safe or Ultra-safe video install icons. This
    ensures that you are able to boot to the installer. After you select an icon,
    press Enter.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'LinuxPPC 2000 Q4 boots and starts a graphical installer. When the screen clears,
    you see a dialog box with five buttons: Instructions, Language, Select Partitions,
    Choose Packages, and Reboot. Click the Select Partitions button to begin.


    # Choosing Partitions


    In the Mount Partitions and Setup Swap dialog box, click in the A/UX root partition’s
    Mount Point field and enter the root (``/``) partition. That is, click next to
    your root partition and type in a forward slash (``/``). Next, click the root
    partition’s Mount button, and then click the Done button.


    A Choose Packages dialog box appears with a default selection of software packages
    already highlighted. Click each package category to select or unselect a category.
    If you click the small plus sign to the left of the category name, the list of
    software packages in that category appears. You can then click to select individual
    software packages.


    As you select or unselect a software package, the disk requirement field at the
    bottom of the dialog box is updated. This is a handy way to customize the size
    of your installation according to desired software. When finished, click the Install
    button. The installer starts copying Linux to your hard drive. Go have a cup of
    coffee.


    When the software has been installed, the screen clears, and a new dialog box
    asks if you want to reboot or choose additional options. Also, note that the dialog
    box displays the device for your root Linux partition (such as `/dev/hda10`).
    Don’t forget this information!


    Click the Additional Options button. Another dialog box appears. Use this dialog
    box to set your root password, the system date and time, the time zone, network
    settings, and to perform other administrative tasks. The very least you should
    do is set the root password, time zone, and system date and time. Do not forget
    your root password! When finished, click the Quit button, and then click the Reboot
    button.


    Reboot to Mac OS. To configure your boot loader, drag the copy of the System Folder
    from the LinuxPPC 2000 Q4 Install CD-ROM to your HFS boot partition. Next, drag
    a copy of an appropriate Linux kernel from the Install CD-ROM’s Linux Kernels
    folder to the System Folder on your HFS boot partition (most likely `vmlinux-2.2.18-4hpmac`).'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Double-click the file `yaboot.conf` inside the System Folder on your HFS boot
    partition. Using the SimpleText editor, look for:

    ```

    ...

    default = LinuxPPC Installer

    ...

    ```

    Change this entry to:

    ```

    ...

    default = Boot LinuxPPC -- Ultra safe video

    ...

    ```


    Save your changes, and then quit the application. Go to the **Apple menu**, select
    **Control Panels**, **Startup Disk**. Click to select the boot partition in the
    **Startup Disk** dialog box, and then choose **Restart from the Special menu**.


    The screen clears, the **LinuxPPC 2000 Q4** splash menu appears, and you reboot
    to Linux. If you want to reboot to Mac OS, press the spacebar. When the desktop
    icons appear, use the cursor keys to navigate to the **CD-ROM** icon (make sure
    there is no CD-ROM in your computer), and then press Enter. You reboot to Mac
    OS. After booting to Mac OS this way, you again have to use the **Startup Disk**
    control panel in order to reset your computer to boot to Linux.


    # # Installing SuSE PPC Linux


    This section details an installation of SuSE PPC Linux 7.1. Insert Disk 1 from
    the **SuSE PPC CD-ROM** set, and then reboot your computer. Hold down the e key
    to boot from the CD-ROM. If you cannot boot from the CD-ROM, boot to Mac OS, open
    the **Blueboot** folder on the CD-ROM, and then double-click the **BootX** app.
    When **BootX** appears, click the **No Video** check box and click the **SuSE
    Linux** button to launch the installer.


    Linux boots up on your computer while Tux the penguin dances. Be patient while
    the installer goes through initial hardware detection. When the screen clears,
    you are presented with a dialog box that asks you to choose a type of install
