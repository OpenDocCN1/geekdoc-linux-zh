    # # Disk Recovery Tools


    Every Linux distribution comes with a variety of disk recovery and maintenance
    tools. Many of these tools have roots in the Intel-based world, and you might
    think that few would apply, build, or even be useful in the PowerPC Linux environment.
    The good news is that many Macintosh computers today use IDE storage devices,
    such as hard drives or CD-ROMs. Because of this, many of the legacy Intel-based
    hardware tools work quite well!


    # ## Overview of Filesystem Tools


    Table 16.3 lists a number of commands you can use for getting information about
    your storage devices, changing internal settings, and testing. Many of these commands
    are commonly found in all Linux distributions.'
