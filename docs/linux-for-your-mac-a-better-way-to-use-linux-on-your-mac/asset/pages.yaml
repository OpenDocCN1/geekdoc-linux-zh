- pgno: 327
  md: '# Using gPhoto


    gPhoto is a versatile and capable digital camera client included with most Linux
    distributions. You can use this client to download and edit images from your digital
    camera. If you have a digital camera, chances are gPhoto supports it, because
    more than 100 cameras (at last count) work with the client.


    You can start gPhoto from the command line of an X11 terminal window, like this:


    ```

    $ gphoto &

    ```


    After you press Enter, click the **Configure** menu, then select the **Select
    Port/Camera model** menu item. You will see a dialog box, as shown in Figure 13.7.


    Select the proper port, then click and scroll through the list of cameras to select
    your particular model. Click the **Save** button when finished.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_327_0.png)


    > If you have a serial camera, but want to upload your images to a PowerPC, use
    an USB-to-serial converter, such as DLink’s PDA adapter. You will need to load
    the proper usb-serial kernel modules, and then specify the serial port as /dev/ttyUSB0.


    Use gPhoto to download **thumbnail**, or index, images from your digital camera.
    Thumbnails are small versions of larger images stored in your camera or on your
    camera’s removable media. Use the **Camera** menu to select **Download Index**,
    and then click the **Thumbnails** menu item.


    gPhoto also recognizes keyboard shortcuts (like most GNOME-aware clients). Press
    Ctrl-i to download a thumbnail index of your camera’s contents. The index will
    then be displayed in gPhoto’s main window, as shown in Figure 13.8.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_327_1.png)'
  merge: -1
  img_proc: true
