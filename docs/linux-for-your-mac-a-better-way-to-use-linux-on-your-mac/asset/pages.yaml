- pgno: 421
  md: 'This file may later on be modified to add additional hardware, such as a new
    external drive, or removable media. You will learn about editing the filesystem
    table, see how to configure your system to allow mounting of remote hard drives
    using the NFS (Network Filesystem), and how to mount other local partitions, such
    as your Mac OS desktop or volume.


    # Editing /etc/fstab


    Your system''s filesystem table, /etc/fstab, is a listing of known storage or
    removable device media, along with associated device names, *mount points* (where
    the device will appear in your filesystem), mounting options, and check options.
    You will also find virtual filesystems listed there, which can be used for your
    system''s process table /proc, and USB devices, usbdevfs.


    For example, here is a sample filesystem table (on an Apple G4 Cube running SuSE
    Linux):


    ```

    ```

    /dev/hda10    /mac        hfs     ro,noauto,user        0 0

    /dev/hda11    /           ext2    defaults                1 1

    /dev/hda12    swap        swap    defaults                0 0

    /dev/hda13    /d2         ext2    defaults                1 2

    /dev/cdrom    /cdrom      auto    ro,noauto,user,exec     0 0

    proc          /proc       proc    defaults                0 0

    usbdevfs      /proc/bus/usb     usbdevfs  defaults        0 0

    devpts      /dev/pts    devpts  defaults                0 0

    ```

    ```


