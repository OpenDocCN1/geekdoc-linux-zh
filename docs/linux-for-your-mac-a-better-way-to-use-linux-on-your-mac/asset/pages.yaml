- pgno: 59
  md: 'Now that you have installed Linux on your Power Mac, you may want to perform
    some additional configuration, adjust settings, and begin exploring the Linux
    operating system. This chapter provides some additional tips and hints on modifying
    various settings and configuring your hardware.


    Linux works well on nearly any hardware platform and CPU. Your job as system administrator
    is to get Linux working with all your system''s hardware. For many users, just
    getting Linux installed is enough. Savvy Linux users will want to enable all their
    available hardware.


    The biggest hurdles in installing and configuring Linux are:


    +   - Partitioning the hard drive.

    +   - Booting to the install.

    +   - Navigating through the install.

    +   - Configuring X11 for your computer''s graphics card.

    +   - Configuring Linux sound to work with your system''s sound card.

    +   - Configuring your modem and getting connected to the Internet.

    +   - Setting up Linux to work with your printer.

    +   - Getting Linux to work with other hardware devices, such as a scanner.


    You have probably already accomplished at least three or four of these tasks!


    # Taking Your First Steps with Linux


    If you are the only person using your computer, then there are at least two users
    on your system: you, as a normal user; and the root operator, or system administrator.
    It is up to you to take care of your system, monitor its health, install new software,
    and configure new hardware.


    # What Is root?


    The root operator has a different home directory than normal users. Most users''
    directories reside under /home in a directory with the user''s login name. For
    example, Fred Smith will usually be the user named “fsmith,” and will have a home
    directory of /home/fsmith. On the other hand, the root operator has a home directory
    of /root.


    Linux is organized into a simple set of directories. A typical system will look
    like this:


    ```

    /

    ├─ bin

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: '```

    ```

    |-- boot

    |-- dev

    |-- etc

    |-- home

    |-- lib

    |-- mnt

    |-- opt

    |-- proc

    |-- root

    |-- sbin

    |-- tmp

    |-- usr

    ''-- var

    ```

    ```


    The `/` directory is known as the root or base directory, while root''s home directory
    is `/root`. The `/bin` directory holds binary files that generally do not depend
    on shared libraries or that may be used during maintenance mode. The `/dev` directory
    holds device names, such as `/dev/modem`, which point to your system''s internal
    modem or serial port with an attached modem. The `/etc` directory contains the
    majority of configuration files used by Linux and its software. The `/lib` directory
    contains software libraries used by foreign programs in order to run. The `/mnt`
    directory is a traditional place to mount foreign file systems, such as hard drives
    on remote computers on your LAN (Local Area Networks). The `/opt` directory generally
    holds large, complex software distributions separate from the Linux software tree.
    The `/proc` directory contains locations of values derived from processes running
    in memory. The `/sbin` directory contains programs generally run only by the root
    operator. The `/tmp` directory is a scratchpad for programs, installation logs,
    files, and other temporary files accumulated during a typical desktop session.


    There are several ways to work as the root operator. One way is to boot Linux,
    then log in like this:


    ```

    ```

    Login:  root

    Password:

    ```

    ```


    However, this is not recommended! Logging in and using Linux as the root operator
    is fraught with risk and danger. As root, or the superuser, you can do anything
    to any file on your system, including the following:


    ```

    ```

    # rm -rf /*

    ```

    ```


    This command line wipes out your entire Linux directory tree and any remote mounted
    drives, including mounted Mac OS HFS partitions! A much better way'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'to work as root is to use the *su* command, which allows you to log in and
    become

    any user for a temporary time (in order to accomplish a specific task). This is
    much

    safer and will avoid the heartache of having to reinstall or rebuild a system.
    Linux

    works on the concept of user, group, and world permissions for reading, writing,

    and execution. You will learn more about permissions later on in this book.

    Suffice it to say that as root, you have permission to do anything.


    The best approach to assuming root status is to log in with your normal username

    and password. Then, when you need to work as root, use the *su* command to ac-

    complish a specific task, like this:


    ```

    $ su -c "pico -w /etc/inittab"

    Password:

    ```


    In this example, the *pico* text editor is launched and opens the system''s initialization

    table for editing. After you edit the file and close the application, you will
    be returned

    to your normal status. For more lengthy forays as root, you can also use *su*,
    like this:


    ```

    $ su

    Password:

    #

    ```


    Note how your command line or shell prompt changes after you use the *su* com-

    mand. You are now working as the root operator. To quit working as root, use the

    shell''s built-in *exit* command, like this:


    ```

    # exit √

    $

    ```


    As you can see, you will then return to your normal user status. You need to know

    how to work as root, especially after installing Linux on a new computer. You
    will

    use your accumulated Linux skills and knowledge to help overcome any problems

    or obstacles in configuring Linux to get the most out of your machine. Use your

    root status only when needed, and you will never get into trouble.


    # ## Post-Installation Software Tools


    Every Linux distribution is both similar and different. Different distributions
    from

    different vendors may use the same version of the Linux *kernel*, or core operating

    system, but the location of important configuration files, and the tools used
    to

    configure Linux may be different.


    If you use LinuxPPC 2000 Q4 or Yellow Dog Linux, you are using a Linux distri-

    bution based on Red Hat, Inc.''s Intel version of Linux. If you use SuSE Linux'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'PPC, you will be using a unique but proven brand of Linux. If you use Debian
    PPC Linux at this point, you are a true hacker and a budding high priest of the
    GNU generation.


    Many tasks covered in this chapter require root permission. While some tasks are
    universal, and apply to all Linux distributions, this book concentrates on using
    Red Hat-based Linux distributions for the PowerPC or SuSE Linux PPC on Power Macs.


    # ## Configuring X


    Chances are very good that the installation software included with your PPC Linux
    distribution has successfully configured the X Window System to work with your
    system. However, if you need to make changes or reconfigure X to get a bit better
    performance, make sure to read Chapter 7, "X11 and Window Managers." That chapter’s
    section "Configuring X11" is chock full of details about using at least three
    different software configuration tools to get X working optimally with your computer.


    Configuring X involves creating an accurate configuration file named *XF86Config*.
    This file is simply a text file containing directions for a software program called
    a *server*. When you use Linux without a graphical interface, you are using Linux
    in a text-based, or *console* mode. But when you use a graphical interface with
    Linux, you will use the X Window System and its server named *xfsess*.


    X works very well with Apple’s Power Mac hardware. No major problems have been
    reported in getting X to work correctly on any model in the currently supported
    Power Mac model lines. This means that if you have an iBook, TiBook, or Apple
    G4 Cube, you can expect to configure a working graphical interface for Linux using
    X. If you do have problems, then check with your Linux distribution’s vendor for
    up-dates, errata, or bug fixes. You are sure to find an answer for any problem
    related to X.


    # ## Keyboard and Mouse Issues


    When you use Linux in the *console* mode, mouse support is provided by the general-purpose
    mouse driver, *gpm*. This is a *daemon*, or program that runs in the background
    while you use Linux, and gives support for highlighting, copying, and pasting
    of information. When you use X during an X session, your mouse cursor is known
    as a *pointer*, and is supported by the XFree86 server.


    You can change the fonts and the font color while you work at the console by using
    the *setfont* and *echo* commands. Linux comes with nearly 100 fonts installed
    under'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'the `/usr/lib/kbd/consolefonts` directory. You can change the console font
    by using the `setfont` command, like this:


    ```

    $ setfont /usr/lib/kbd/consolefonts/8x14thin

    ```


    After you press Enter, what do you see?


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_63_0.png)


    > This will only work if you are using Linux at the console.


    To return to the default font use `setfont`, like this:


    ```

    $ setfont /usr/lib/kbd/consolefonts/default8x16

    ```


    To change the color of your fonts, use the `echo` command to echo a special string
    of characters to the screen, like this:


    ```

    $ echo -e \033[32m''

    After you press Enter, what do you see? To reset the color, use the `echo` command,
    like this:

    ```


    ```

    $ echo -e \033[0m''

    ```


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_63_1.png)


    > Want to use other colors? Use the `man` command to read the `console_codes`
    manual page. (To learn how to use the `man` command, type `man man` at the command
    line.)


    # ## Emulating Mouse Buttons


    If your Power Mac has a mouse with only one button (as most do), you may consider
    getting a three-button mouse. Linux and X are designed to support and use three-button
    rodentsimeters. This does not mean that you cannot use Linux and X productively
    using a single-button mouse, but life will be a bit easier if your mouse has at
    least two buttons.


    If you have installed Linux on an iBook and want three-button emulation, you can
    pass a command string known as an argument to the Linux kernel at boot time. For
    example, the following setting in your `yaboot.conf` file enables F11 and F12
    as the middle and right mouse buttons:


    ```

    append="adb,buttons=103,111"

    ```'
  merge: -1
  img_proc: true
- pgno: 64
  md: "If you use SuSE Linux PPC and have a one-button USB mouse (included on newer\
    \ desktop Power Macs), the following commands sent to the Linux kernel USB driver\
    \ enables F11 and F12 as the middle and right mouse buttons (as root, you can\
    \ add these lines to your SuSE system’s /etc/rc.d/boot.1ocal1 file):\n\n```\n\
    ```\necho \"1\" > /proc/sys/dev/mac_hid/mouse_button_emulation\necho \"87\" >\
    \ /proc/sys/dev/mac_hid/mouse_button2_keycode #F11\necho \"88\" > /proc/sys/dev/mac_hid/mouse_button3_keycode\
    \ #F12\n```\n```\n\nHowever, Apple TiBook users will find that pressing F12 by\
    \ itself will not work for emulation as it is used for a media (CD-ROM) eject\
    \ button. In this case, use the previous USB approach. In addition, map the middle\
    \ and right mouse buttons to F10 and F11, like this:\n\n```\n```\necho \"1\" >\
    \ /proc/sys/dev/mac_hid/mouse_button_emulation\necho \"68\" > /proc/sys/dev/mac_hid/mouse_button2_keycode\n\
    echo \"87\" > /proc/sys/dev/mac_hid/mouse_button3_keycode\n```\n```\n\n> Yellow\
    \ Dog Linux and TiBook users will find that the mouse-button and keyboard mapping\
    \ is automatically configured. Pressing F11 during an X session emulates the middle\
    \ mouse button. Pressing F12 emulates the right mouse button.\n\n![](img/1ea833f5a3e3c1547e3dd2891f52804a_64_0.png)\n\
    \nUsing a three-button mouse may solve some problems when using X11. A typical\
    \ entry for a three-button USB mouse in the system’s XF86Config file (which can\
    \ only be edited by root) looks like:\n\n```\n```text\nSection \"Pointer\"\n \
    \   Device      \"/dev/input/mice\"\n    Protocol    \"IMPS/2\"\nEndSection\n\
    ```\n```\n\nIn this example the pointer should be properly recognized. However,\
    \ using a scroll wheel mouse requires an additional setting to enable the scrolling,\
    \ which must be added, like this:\n\n```\n```text\nSection \"Pointer\"\n    Device\
    \      \"/dev/input/mice\"\n    Protocol    \"IMPS/2\"\n    ZAxisMapping 4 5\n\
    EndSection\n```\n```"
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Experienced Linux users have little trouble in diagnosing or tracking down
    problems and solutions. When you are new to Linux, it is important to understand
    the relationships between system configuration files and how Linux works.


    Fortunately, Apple PowerPC users can draw on the accumulated knowledge and solutions
    of others in order to pinpoint and solve problems. Chances are good that someone
    with your model Power Mac has run across and overcome an obstacle you are currently
    facing. Make sure to take the time to carefully research any new model purchase,
    and if you are running into trouble with Linux on your Mac, check the Internet
    for Linux users using your machine.


    # ## Setting Date, Time, and Locale


    Keeping accurate time on your computer is important. It is also important to know
    that there are two times on your computer: the Linux system time, and your computer''s
    hardware clock. Keeping accurate track of time can be critical, especially when
    dealing with other users, clients, or remote computers. Some tasks, such as backups,
    at times must be performed during certain hours of the day. Time and date stamps
    on electronic mail or documents can prove to be critical in business or the legal
    profession.


    Many savvy Linux users keep the Power Mac''s hardware clock set to UTC (*Coordinated
    Universal Time*) while setting the system time according to the computer''s location
    (a plus or minus offset to UTC).


    Because the world is split into many different time zones, every Linux system
    comes with a database of time zone information (found under the *`/usr/share/zoneinfo`*
    directory). This information is used in conjunction with different commands to
    help keep accurate time. Like UNIX, Linux system time is based on the number of
    seconds since Jan. 1, 1970, and many Linux time utilities use the returned value
    as a yardstick to determine the current local time.


    Displaying the date and time is easy. All you need to do is run the *date* command,
    like this:


    ```

    ```

    $ date

    Fri May 11 14:47:08 EDT 2001

    ```

    ```


    In this example, the system''s current date and time are extrapolated from the
    number of seconds and are displayed in a readable format. The *date* command may
    also be used to set the system time. Use the *date* command (as root) with the
    month, day, hour, and minute in a single numerical string, like this:


    ```

    ```

    $ date 06291200

    Fri Jun 29 12:00:00 EDT 2001

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'On the other hand, to view your computer''s hardware clock and its time, use
    the `clock` command with its `-r` option, like this:


    ```

    # /sbin/clock -r


    time in rtc is Fri May 11 23:07:07 2001


    Fri May 11 23:07:07 2001

    ```


    > On Intel-based Linux systems, `hwclock` is traditionally used to show and set
    the system''s hardware clock. This command is only supported when using Linux
    on CHRP or PREP workstations, not Apple Power Macs. Use the `clock` command instead.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_66_0.png)


    The `clock` command has a terse syntax that looks like this:


    ```

    # /sbin/clock --help


    /sbin/clock: unrecognized option ''-help''


    `clock` [-u] -r|w|s|a|v


    r: read and print CMOS clock


    w: write CMOS clock from system time


    s: set system time from CMOS clock


    a: get system time and adjust CMOS clock


    u: CMOS clock is in universal time


    v: print version (1.4) and exit

    ```


    This command, found under the `/sbin` directory, should not be confused with the
    OpenWindows `clock` client, which displays the current time in a graphical clock
    during an X session. The `/sbin/clock` command should only be run by the root
    operator (root should explicitly call `clock` using its full path). This command
    can be used to display and sync your computer''s hardware clock with the Linux
    system clock by using its `s` option. To adjust the system time to the hardware
    clock, use the `s` option.


    If you use a Red Hat-based distribution such as Yellow Dog Linux or LinuxPPC 2000,
    you can also use Red Hat''s `timetool` client to set your system time. This X11
    client may be started from the command line of an X11 terminal window, like this:


    ```

    # timetool &

    ```


    After you press Enter, you see window, as shown in Figure 3.1.


    Red Hat-based Linux uses a symbolic link named `/etc/localtime` to designate your
    current time zone. Under SuSE Linux this is a binary file derived from the system''s'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_67_0.png)


    time zone database. Under SuSE Linux, you can set your time zone by editing its
    system-wide configuration file, /etc/rc.config. Look for the following entry:


    ```

    TIMEZONE=EST

    ```


    After making changes, make sure to run SuSE’s suseconfig shell script to implement
    your change.


    SuSE Linux also provides a console-based, comprehensive system administration
    tool named yast, along with a newer graphical version for X11 named yast2. When
    you use the yast command, you can jump right to a specific administrative task
    by using its --mask option, followed by a keyword such as backup, consolefont,
    gpm, help, keymap, modem, mouse, netprinter, printer, scanner, timezone, user,
    or ffree. To jump right to an easy time zone configuration, use yast, like this:
    yast --mask timezone.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_67_1.png)


    System administrators using KDE can use the kcmclock client to set the time and
    designate a time zone. Start the client from the command line of an X11 terminal
    window, like this:


    ```

    # kcmclock &

    ```


    When the client starts, click the time zone tab in the dialog box, as shown in
