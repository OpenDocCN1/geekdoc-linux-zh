- pgno: 7
  md: '# # Acknowledgments


    Thanks to Lynette Quinn, my mentor, for yet another opportunity. Many thanks to
    everyone at Prima for their efforts to make this book the best product on the
    market. Also, to those PowerPC Linux programmers such as Paul Mackeras, Cort Dougan,
    and Benjamin Herrenschmidt, many thanks for all the hard work on porting and improving
    Linux on some of the best computer hardware in the world. Thanks are also due
    to Richard M. Stallman for his GNU GPL, and to Linus B. Torvalds for bringing
    Linux into the world as free software. To Lisa Lee, I will miss the opportunity
    to work with you, but wish you the best in your future endeavors. To my fellow
    Northern Virginia Linux User Group members: thanks for the camaraderie, you are
    a great bunch of people. Finally, thanks are also due to Microsoft Corporation;
    your bizarre product line, licensing, and lawyers make Linux become more popular
    every day!'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# About the Author


    **B**ill Ball is the best-selling author of a dozen books about Linux. As an early
    Macintosh fan, his first Mac was an SE with 1MB RAM and a 20MB hard drive. He
    used a lab full of Macs to teach desktop publishing in a 1987 Dept. of Defense
    pilot project at the Defense Information School (now located in Ft. Meade, Md.),
    and was an Apple Federal Support Coordinator for a number of years in Washington,
    D.C. As a certified Quark XPress developer, he released two Quark XTensions (ASave
    and Stamp) as open source software in 1993. A fan of Linux since kernel 0.99,
    he first used Linux on Intel-based hardware, but has returned to the Mac and now
    uses Linux on an Apple G4 Cube and Titanium PowerBook. He is an active member
    of the Northern Virginia Linux Users Group, and lives in the Shirlington area
    of Arlington, Va.'
  merge: -1
  img_proc: true
