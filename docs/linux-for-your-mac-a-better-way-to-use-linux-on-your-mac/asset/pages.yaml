    # Using KDE''s kalendar Client


    The K Desktop Environment has a feature-rich assortment of productivity tools.
    There is not enough room in this chapter to explore all of them (i.e., *knotes*,
    which also features alarms, and *karm*, which is a personal time tracker). However,
    you will find Mark Redding’s *kalendar* client to be a comprehensive and capable
    calendar tool that features to-do lists, along with event and appointment tracking.


    You can start *kalendar* from KDE’s desktop panel, or the command line of an X
    terminal window like this:


    ```

    $ kalendar &

    ```


    After you press Enter, you will see the main window, as shown in Figure 12.6.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_298_1.png)


    Figure 12.6 *The KDE kalendar client is a graphical calendar with a host of information-tracking
    features.*'
  merge: -1
  img_proc: true
