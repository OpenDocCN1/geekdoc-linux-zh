    # Configuring Your Window Manager


    This section introduces window manager configuration when using GNOME and a GNOME-aware
    X window manager to manage your desktop. Remember, unlike KDE, which uses built-in
    window management via the *kwin* client, GNOME depends on window-management facilities
    provided by a compliant window manager. This applies to managing the behavior
    of windows, although GNOME can control many other aspects of windows and dialog
    boxes, such as appearance. Two of the most popular window managers for GNOME are
    Sawfish and Enlightenment.


    # Using Configuration Tools


    The Sawfish and Enlightenment packages include separate configuration tools you
    can use during your GNOME session to change how these window managers handle windows,
    icons, buttons, dialog boxes, text, and fonts. You will also be able to enable
    or disable a variety of features using the configuration tools.


    The primary configuration tool you will use to configure your desktop session
    will be the GNOME control center. This comprehensive tool provides a shell for
    nearly all configuration menus and services required during an X session. You
    can launch the control center by using the desktop''s panel menu, or by typing
    the control center''s name at the command line of an X terminal window like this:


    ```

    $ gnomecc &

    ```'
  merge: -1
  img_proc: true
- pgno: 275
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_275_0.png)


    > Figure 11.3 *The GNOME control center is the center of operations for configuration
    menus, and the best place to start if you are looking to change desktop or window
    behavior during your GNOME sessions.*


    After you press Enter, you will see the control center, as shown in Figure 11.3.


    Note that the control center provides menus for the following topics (with the
    exception of the Sawfish window manager, which is discussed next):


    +   * **Desktop.** Handles background, panel, screen saver, theme selector, and
    window manager controls.

    +   * **Document Handlers.** Controls the default system editor, MIME (mail attachment
    formats and clients), types, and URL handlers (the default browser).

    +   * **Multimedia.** Manages the sound server and system events (i.e., startup,
    shutdown, logout, window events, and so on).

    +   * **Peripherals.** Controls keyboard and mouse settings.

    +   * **Session.** Controls startup hints (splash screens, etc.) and startup clients.

    +   * **User Interface.** Manages application and dialog box appearance, and GNOME''s
    MDI (*Multiple Document Interface*) mode. (This is how multiple documents are
    displayed by GNOME-compliant applications.)


    Click the small plus (+) sign to the left of each main item, and you will see
    a drop-down menu of additional controls. Click on a control to make the control''s
    dialog box appear in the control center''s main window.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Four main buttons will be active following any change to default behavior or
