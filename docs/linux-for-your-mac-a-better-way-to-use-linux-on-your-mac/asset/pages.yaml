- pgno: 108
  md: '# **Aliases.** Shells that provide this feature allow you to create an abbreviated
    shortcut or *alias* for longer commands. In some cases, this creates a much safer
    computing environment, especially if you are a Linux beginner. For example, many
    distributions do not provide an alias for the Linux *delete* command known as
    `rm`. This command will quickly and silently delete files without prompting or
    feedback, and can devastate your entire home directory if misused. However, the
    `rm` command''s `-i` command-line option will prompt you to press `y` or `n` before
    deleting a file. Therefore, good system administrators will redefine the `rm`
    command to be `‘rm -i’`, which is much safer! (If you''re running Linux on your
    Mac, **you** are the system administrator!) To do this, edit your system''s `/etc/profile`
    (or `/etc/profile.local` or `/etc/skel/.bashrc`) and add: `alias rm=''rm -i''`.


    You will find that most of the popular shells for Linux support these features
    and more. Most of the shells are quite capable, extremely stable, and have been
    rigorously tested over time. The shell is, without a doubt, one of the most important
    types of programs included with Linux, and provides an essential platform for
    getting work done when using the console. The following sections include the most
    common shells available for Linux.


    # *bash*


    The **bash** shell is the default Linux shell on nearly every installed Linux
    system. Although somewhat larger and more memory intensive than the other shells
    that follow, *bash* has an extensive feature list that surpasses that of other
    shells. The **bash** shell is the most often used shell for Linux shell scripts
    because it has the ability to perfectly mimic the Bourne, or **sh** shell, which
    is a staple shell of commercial and free UNIX operating systems. The **bash**
    shell can also mimic other shells, depending on how it is launched (such as through
    a symbolic link).


    bash has extensive built-in help you can access with its **help** keyword command:


    ```

    ```

    $ help

    ```


    ```


    After you press Enter, you will see a long list of bash''s built-in commands:


    ```

    ```

    GNU bash, version 2.04.0(1)-release (powerpc-suse-linux)

    These shell commands are defined internally.  Type ''help'' to see this list.

    Type ''help name'' to find out more about the function ''name''.

    ```


    ```'
  merge: -1
  img_proc: true
