    10.4. By default, `konqueror` will display any files in the current directory,
    using various icons associated with a file''s extension. Therefore, files such
    as text documents (with names ending in .txt) will have a different icon than
    a graphic (which could have a name ending in .ps, .jpg, .png, etc.). The `konqueror`
