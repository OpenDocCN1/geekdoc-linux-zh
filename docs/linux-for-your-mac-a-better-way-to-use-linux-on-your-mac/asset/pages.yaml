- pgno: 187
  md: "This chapter is an introduction to using the X Window System from a user's\
    \ point of view. You will see how to customize your X session, use an X terminal\
    \ command line to launch clients, get an overview of using X resources, see how\
    \ to configure your keyboard and pointer, and finally, get an introduction to\
    \ using X on a network.\n\n# ### Customizing an X Session\n\nWhen you use Linux\
    \ and X11, you will enjoy the use of a free operating system and a free graphical\
    \ interface to that operating system. You will also enjoy the freedom to change\
    \ and use a desktop that looks and feels the way you want it to. You are not bound\
    \ to what a commercial software vendor thinks. Of course, this freedom comes at\
    \ a price when you use X11: You will need to learn how to edit a few configuration\
    \ files or use a few commands in order to effect your changes.\n\nThis section\
    \ introduces you to a few important files that can affect what window manager\
    \ you choose for your X session and which clients are started after you launch\
    \ X. You will also learn how to change the appearance of those clients.\n\n# ###\
    \ Using the .xinitrc File\n\nThe `.xinitrc` file is an X startup script that may\
    \ or may not be present in your home directory. You will always find a default\
    \ system-wide `xinitrc` file, usually under the `/usr/X11R6/lib/X11/xinit` directory,\
    \ a symbolic link to the `/etc/X11/xinit` directory. Although there are standard\
    \ uses for this file, different Linux distributions will use this file in various\
    \ ways.\n\n`xinitrc` is a shell script used by the X Window System initializer\
    \ client `xinit` to start X. The `xinit` client (which is generally launched by\
    \ the `startx` script if an X display manager is not used on the system) will\
    \ look for `.xinitrc` in your home directory, and if not found, will use the system\
    \ default file `xinitrc`. If that file is not found, `xinit` is supposed to launch\
    \ the X session without using a window manager, and provide a single `xterm` terminal\
    \ window in the upper-left corner of your display.\n\nAs shell scripts, the system\
    \ `xinitrc` file and the optional user's `.xinitrc` file should contain logic\
    \ to first determine the availability of various clients, such as individual programs\
    \ or window managers, read in any specific custom settings, and then launch the\
    \ clients or windows managers for the X session. For example, on a SuSE PPC Linux\
    \ system, a default `.xinitrc` file is installed in every user's home directory.\
    \ In part, the logic in the file looks like:\n\n```\n... \n\n# choose a window\
    \ manager\n\n\n```"
  merge: -1
  img_proc: true
- pgno: 188
  md: "```\nif test -n \"$WINDOWMANAGER\" ; then\n    WINDOWMANAGER=`type -p $WINDOWMANAGER`\n\
    fi\nif test -z \"$WINDOWMANAGER\" ; then\n    if test -x /usr/X11R6/bin/kde ;\
    \ then\n        WINDOWMANAGER=/usr/X11R6/bin/kde\n    elif test -x /usr/X11R6/bin/startkde\
    \ ; then\n        WINDOWMANAGER=/usr/X11R6/bin/startkde\n    elif test -x /usr/X11R6/bin/fvwm2\
    \ ; then\n        WINDOWMANAGER=/usr/X11R6/bin/fvwm2\n    elif test -x /usr/X11R6/bin/wmlist\
    \ ; then\n        for i in '/usr/X11R6/bin/wmlist' ; do\n            WINDOWMANAGER=`type\
    \ -p $i`\n            test -n \"$WINDOWMANAGER\" && break\n        done\n    fi\n\
    fi\n...\n```\n\nIn this example, the script checks for a designated window manager\
    \ in the WINDOWMANAGER environment variable, and checks to see if its name is\
    \ present in the system-wide list of window managers stored under the /usr/X11R6/bin\
    \ directory. Other distributions, such as LinuxPPC 2000 Q4 may use a different\
    \ scheme, such as using a script named xclients under the /etc/X11/xinit directory\
    \ to parse the contents of the /etc/sysconfig/desktop file for a default window\
    \ manager. This latter approach is used by a number of Red Hat-based Linux distributions,\
    \ and the logic looks like this:\n\n```\n...\n```\n\n```\n# check to see if the\
    \ user has a preferred desktop\nPREFERRED=\nif [ -f /etc/sysconfig/desktop ];\
    \ then\n    if [ -n \"`grep -i Gnome /etc/sysconfig/desktop`\" ]; then\n     \
    \   PREFERRED=gnome-session\n    elif [ -n \"`grep -i KDE /etc/sysconfig/desktop`\"\
    \ ]; then\n        PREFERRED=startkde\n    elif [ -n \"`grep -i AnotherLevel /etc/sysconfig/desktop`\"\
    \ ]; then\n        PREFERRED=AnotherLevel\n    else\n        PREFERRED=Default\n\
    \    fi\nfi\n```\n\n```\n...\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Here you can see that the window manager used for the X session is determined
    by the keywords GNome, KDE, or AnotherLevel in the file named desktop under the
    `/etc/sysconfig` directory. Other distributions provide different mechanisms for
    choosing a window manager to be used for an X session. For example, the startx
    script provided by SuSE PPC Linux allows you to specify a window manager on the
    command line like this:


    ```

    ```

    $ startx twm

    ```

    ```


    After you press Enter, the Tab window manager will be used for the X session.
    But you can override any of these previous methods by defining your own X startup
    script in `.xinitrc` in your home directory. You are free to choose your own window
    manager by crafting your own `.xinitrc` file. For example, if you would prefer
    to set the root display to a light blue, then launch an xterm terminal client
    using the LessTif mwm window manager, and create an `.xinitrc` file containing
    these lines:


    ```

    ```

    xsetroot -solid lightblue

    xterm &

    mwm

    ```

    ```


    Save the file and then start an X session. Your new `.xinitrc` file will override
    any system defaults. This approach will work with any Linux distribution. Note
    that you may also want to make sure that any custom settings are read in before
    starting your session. Read on to learn how to do this.


    # ### Using .Xdefaults


    The `.Xdefaults` file contains what are known as X client resources, or strings
    of text that define default appearance and behavior for various X clients. The
    `.Xdefaults` file is normally installed in every user''s home directory from a
    default file found under `/etc/skel`.


    If you do not find a `.Xdefaults` file on your system, such as LinuxPPC 2000 Q4,
    do not worry. Every Linux distribution that uses X also installs a large repository
    of client settings in individual files under the `/usr/X11R6/lib/X11/app-defaults`
    directory.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_189_0.png)


    > Other resource files may be present on your system, such as a default Xresources
    file. This file may be located under the `/etc/X11`, `/etc/X11/xinit`, or `/etc/X11/xdm`
    directories, and contains resources for use by the X display manager, xdm. You
    can also create a local copy in your home directory named `.Xresources` or `.Xres,`
    and you may store local resource settings in this file.'
  merge: -1
  img_proc: true
- pgno: 190
  md: "Each application-specific file contains strings of text that may be used to\
    \ alter a client's appearance. For example, in the file named `xcalc`, you will,\
    \ in part, find:\n\n```\n...  \n*Title: Calculator\n*Cursor:\t\thand2\n...\n```\n\
    \nThese two settings, in the form of `*resource name: resource_setting`, define\
    \ the title used in the `xcalc` client's window and the type of pointer that appears\
    \ when you use the client. If you change the resource setting, you will modify\
    \ how that client appears. For example, you may change the `xcalc` settings to:\n\
    \n```\n...\nXcalc.Title:  This Calculator belongs to Willie\nXcalc*Cursor: gumbly\n\
    ...\n```\n\nThe resource settings may then be stored in your home directory's\
    \ `.Xdefaults` or `.Xresources` file to suit your system or personal preferences.\
    \ You can also create your own `app-defaults` file, and then use the `XUSERFILESEARCHPATH`\
    \ environment variable to point clients to your settings, like this:\n\n```\n\
    $ export XUSERFILESEARCHPATH=$HOME/app-defaults/*\n```\n\nTo find the settings\
    \ that are recognized by your favorite client, see its manual page, documentation,\
    \ or sample entry under the `app-defaults` directory.\n\n# **My .Xdefaults Changes\
    \ Are Not Recognized!**\n\nYou may have to merge the changes into your current\
    \ X resource settings using the `xrdp` client. You can do this quickly and easily\
    \ by using `xrd`'s `-merge` option, followed by the name of the resource file\
    \ like this:\n\n```\n$ xrdp -merge .Xdefaults\n```\n\nAfter you press Enter, the\
    \ affected client(s) should use your new settings. If not, make sure that your\
    \ resource strings are correct. You can also use the `apres` or `editres` client\
    \ to see and verify other client resource settings.\n\n# ### Using .xsession\n\
    \nThe `.xsession` file (generally a shell script) may be used instead of your\
    \ `.xinitrc` file, though many Linux distributions default to using `.xinitrc`.\
    \ The `.xsession` file"
  merge: -1
  img_proc: true
- pgno: 191
  md: 'is run automatically if you log in from an X terminal, and should contain commands
    similar to those of .xinitrc (such as loading in resource settings). Note that
    some distributions, such as LinuxPPC 2000 Q4, do not include the older companion
    xsession client, which can be used to switch between window managers. Most distributions
    use the xsm session manager instead.


    A session manager is used to launch one or more groups of clients that you specify
    in .xsession (if you use xdm), or if you use xsm, in a file named .xsmstartup
    or a default system.xsm (the location of which depends on how the xsm was compiled).
    If you want to use xsm, the format of your .xsmstartup file can be as simple as:


    ```

    twm

    xprop

    xcalc

    xclock

    xterm

    ```


    Save the file, then use the xsm client, followed by an active X session’s display
    number like this:


    ```

    $ xsm -display :0

    ```


    You can then navigate to the active session by using the keyboard (if you are
    running a stand-alone workstation) by pressing Cmd+F7 (console 7 is the default
    Linux console used for X). The first time you use xsm, each client will launch,
    and you will see a xsm control dialog box, used to control the session. As you
    work, and possibly launch additional clients, you can then use xsm to save your
    work state with a session name.


    For example, if you conduct an extensive word processing session with a text editor,
    calculator, and online dictionary, you can save the session as "My Editing Session."
    The next time you launch xsm, you will see a Session Menu as shown in Figure 8.1,
    from which you can pick your previously defined sessions.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_191_0.png)


    Figure 8.1 The xsm client supports session management, even for X clients that
    do not fully support this feature.'
  merge: -1
