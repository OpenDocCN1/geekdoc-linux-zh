- pgno: 308
  md: '# Using *sc*


    The *sc* command is a public-domain spreadsheet program with a long history as
    open source. Originally designed as a simple table editor, hundreds of programmers
    have worked on *sc* to add numerous features. You will find various incarnations
    of the *sc* program available for Linux, but in its simplest form, this editor
    works quite well and is more than adequate for the task of maintaining simple
    spreadsheets.


    This spreadsheet may be used at the Linux console, and does not require an X session,
    making it ideal for use in dial-up situations or for users with a simple shell
    account. Weighing in at barely 200,000 characters in binary form, this program
    has one of the smallest footprints of any spreadsheet program, matched only by
    the *teapot* editor (discussed next).


    You can start *sc* at the command line like this:


    ```

    ```

    $ sc

    ```

    ```


    After you press Enter, its main window will appear. You can navigate through different
    cells by using the cursor keys, or by pressing Ctrl+f (right), Ctrl+h (left),
    Ctrl+p (up), and Ctrl+n (down). Numeric values and functions are entered by prefacing
    the data with an equals (=) sign. For example, move the highlighted (current)
    cell at A0, then type:


    ```

    ```

    =1456

    ```

    ```


    Press Enter and then move to cell A1 and type:


    ```

    ```

    =9378

    ```

    ```


    Press Enter and finally move to cell A2, and use *sc*’s *sum()* function to add
    the contents of cells A0, A1, and then in cell A2, like this:


    ```

    ```

    =@sum(a0:a1)

    ```

    ```


    After you press Enter, you will see the result, as shown in Figure 12.16.


    Despite its simple appearance, *sc* has many complex functions such as range,
    numeric, string, financial, and time and date functions. You can get help at any
    time by typing a question mark (?). You can also read *sc*’s manual page, or use
    its companion *scqref* command to print a nine-page quick-reference sheet like
    this:


    ```

    ```

    $ scqref | nroff -ms | lpr

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_309_0.png)


    Figure 12.10 *The nc spreadsheet is a public-domain spreadsheet with a long history
