  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_138_0.png)


    # Using pico


    The `pico` editor, part of the `pine` e-mail package available with most Linux
    distributions, is a robust, capable editor that works well under a variety of
    conditions, is easy to learn, and could become your favorite Linux text editor.
    This editor is copyrighted by the University of Washington, which is viewed as
    a downside by GNU GPL adherents. You will not find `pico` included with the Debian
    GNU/Linux distribution.


    This editor has most of the desired features of a good Linux text editor, such
    as built-in help, searching, the ability to toggle line-wrapping from the command
    line, block move, copy, delete, and spell-check. One of `pico`''s best features
    is its ability save your document with the name of your file and an extension
    of `.save` in the event of a system crash or interrupted `telnet` session.


    You can start `pico` from the command line of the console or an `X` terminal window
    like this:


    ```

    $ pico myfile.txt

    ```


    After you press Enter, the file `myfile.txt` will be opened for editing, or the
    file will be created if it does not exist. You can also use `pico` while editing
    your system''s'
