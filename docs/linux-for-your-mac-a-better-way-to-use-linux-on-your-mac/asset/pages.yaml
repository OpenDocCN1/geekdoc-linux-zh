    # ## Printing


    Installing a printer for use with PPC Linux is fast and easy, because every Linux
    distribution comes with tools that make the task easy. Red Hat-based systems come
    with the graphical *printtool* client, while SuSE PPC Linux users can use the
    *yast* command or *yast2* client to configure a printer.


    The good news for Intel-based Linux users migrating to PPC Linux is that your
    older, Linux-supported parallel port printer can work with USB while running PPC
    Linux! If you have a legacy parallel port printer and want to use it with PPC
    Linux on your Power Mac, the D-Link DSB-P36 USB parallel port printer adapter
    is indispensable; you are able to connect your parallel port printer and attach
    it to your computer''s USB port.


    Setting up a parallel port or USB printer under Linux can be accomplished in a
    matter of a few seconds. For example, under SuSE PPC Linux, launch the *yast2*
    client. Select the Hardware/Printer menu item, and then click the Launch Module
    button. You see a dialog box that lists five different printers: Novell, parallel,
    re-mote, Samba, and USB.


    If you have a USB printer, or a printer connected to the D-Link adapter, click
    USB and then click the Add button. You see a dialog box, as shown in Figure 3.10.

    Pick a printer device name, such as */dev/usb/p0* (if you have only one printer),
    and then click the *Next* button. Then you see a dialog box that lists a variety
    of printer manufacturers and devices. Click on your printer''s manufacturer, such
    as Hewlett Packard, and a list of supported printers for that manufacturer appears,
    as shown in Figure 3.11.


    Do not panic if you do not see a printer model that matches your printer exactly.
    There are many different printers on the market, but many printers from the same
    manufacturer and family will work with one or more printer drivers. For example,
    an HP 658C USB printer functions quite well using the Deskjet 500 printer driver.
    When finished, click the *Next* button.


    You are now asked to give your printer a name. Give your printer a name, or accept
    the default name. Remember this name because you will use it later for printing!'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_80_0.png)


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_80_1.png)


    When finished, click the Next button. You will then see a dialog box, as shown
    in Figure 3.12. Click the paper size item in the top dialog box, and then select
    a default paper size for your printer.


    When finished, click the Next button, and then click the Finish button to add
    your printer to the system. You can now print documents to your printer using
    the lpr command, like this:


    ```

    # lpr -Pprintername mydocument.ps

    ```'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_81_0.png)


    Figure 3.12   Make sure to select a correct paper size for your printer when using
    yast2.


    In this example, the -p command-line option is used to specify a printer. This
    is important, as you can have any number of printers attached to your system,
    or even print to a remote printer attached to another computer.


    Printing works through the lpd printer daemon. This service, which starts when
    you boot Linux, monitors the /var/spool/lpd directory, and looks for documents
    that are waiting to be printed. When one is found, the lpd daemon starts a printing
    process, and sends the document to the designated printer (which has its own directory
    under /var/spool/lpd).


    # Using the printtool Client


    The printtool client, included with Red Hat-based PPC Linux distributions, is
    a printer creation and management tool. Start this client during an active X session
    either from the control-panel1 client or the command line of an X terminal, like
    this:


    ```

    #  printtool &

    ```


    When the client appears, click the Add button. You see a dialog box, as shown
    in Figure 3.13.


    Select the type of desired printer, such as local, and then click the OK button.
    When the Edit local printer entry dialog box appears, note the default printer''s
    name (or rename the printer), and then click the Input filter button. You see
    a dialog box, as shown in Figure 3.14.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_82_0.png)


    **Figure 3.13** *The printtool client is used to configure a variety of printers.*


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_82_1.png)


    **Figure 3.14** *Make sure to select a compatible printer configuration for your
    printer when using printtool.*


    This is a critical step! You must select a compatible printer by choosing the
    exact model or a model that works like your printer. When finished, click the
    OK button, and then click OK to save your new printer. As with SuSE Linux, use
    the printer''s name to print your documents.


    # **Editing /etc/printcap**


    The *yast*, *yast2*, and *printtool* commands save your printer definitions in
    your system''s printer capability database, /etc/printcap. You do not need to
    edit this file! Of course, as the root operator you can do anything you want,
    but in general you should not have to make any changes.


    However, if you use SuSE Linux, and use the *yast* command to create a printer
    definition for a USB printer, you''ll need to edit your system''s /etc/printcap.'
  merge: -1
  img_proc: true
