    # # Using E-Mail Utilities


    Every Linux distribution comes with dozens of electronic mail utilities. A few
    of the more useful programs include:


    +   - audiosend Send an audio e-mail message

    +   - biff Alert you when incoming mail arrives

    +   - elm Another e-mail client

    +   - frm Strip and display e-mail headers from your mailbox''s e-mail

    +   - hypermail Convert e-mail into HTML files

    +   - printmail Format e-mail for printing

    +   - procmail Process incoming mail

    +   - readmsg Display mail messages from your inbox

    +   - vacation Send automatic replies to incoming mail


    Experiment with different utilities. You are sure to find a use for many of these
    mail utilities.


    # ## Fighting SPAM


    SPAM is one of the worst manifestations of the communications revolution, because
    it is much more personal and intrusive than postal junk mail. The good news is
    that legislators are finally listening to fed up consumers and many states now
    have laws with monetary penalties for the techno-idots who bombard our electronic
    mailboxes with their stupid hype.


    You can use the procmail command to filter incoming mail to help reduce the clutter.
    This means that if you find yourself bombarded with unwanted messages that have
    some common element in the sender''s address, subject line, or body of text, you
    can discard the mail quickly and easily.


    In order to use procmail, create a file named .procmailrc in your home directory.
    This file should contain the following:


    ```

    MAILDIR=$HOME/mail

    PMDF=$HOME/.procmail

    INCLUDERC=$HOME/.procmail/rc.mailfilter

    ```'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'These lines specify your incoming mailbox, *procmail*''s directory, and the
    name of your *procmail* settings (also known as *recipes*). Save the file, and
    then create a text file named `.forward` in your home directory which contains
    the following:


    ```

    * [IFS='' '' && exec /usr/bin/procmail -f- || exit 75 $yourusername*

    ```


    Substitute your personal username for *yourusername*. Next, use the `chmod` command
    to assign read and write permissions (to protect your recipe, but allow *procmail*
    access), like this:


    ```

    # chmod 644 .forward

    # chmod a-x .

    ```


    Finally, create a directory named `.procmail`, and create your `rc.mailfilter`
    in the directory. This file contains your *procmail* recipes. For example, if
    you subscribe to a mailing list that regularly sends out messages with a subject
    line containing the word *agenda-digest*, create an entry that looks like this:


    ```

    :0:

    *"Subject:.*agenda-digest

    agenda-digest

    ```


    This entry will save any mail message with a subject line containing *agenda-digest*
    into a mail folder named *agenda-digest*. On the other hand, if you know that
    all your SPAM is coming from a certain domain, you can then create an additional
    recipe in the file that looks like this:


    ```

    :0:

    *"From:.*msn.com

    /dev/null

    ```


    Sending SPAM to your system''s `/dev/null` device is a fitting and just end, because
    the files will simply disappear. For more information about using *procmail*,
    read its manual page or related HOWTO documents.


