  md: 'If you have trouble pinging a remote host, make sure that **DNS** is working
    (check to make sure the addresses are listed in your `/etc/resolv.conf` file)
    or that the host''s *name* is defined in your system''s `/etc/hosts` file:


    +   127.0.0.1 localhost localhost.localdomain

    +   192.168.2.32 green.home.org green

    +   192.168.2.33 stinkpad.home.org stinky

    +   192.168.2.34 presario.home.org presario

    +   192.168.2.35 thinkpad.home.org thinkpad

    +   ...


    There are many other utilities you can use to test your network and connectivity
    with other networks. Read the manual pages for the *traceroute* and *dig* commands.


    > Another handy command you can use to test the connectivity between two remote
    hosts (not just your machine) is the *binger* command. Like *ping*, *binger* reports
    the best, average, and slowest times for packet information to bounce between
    two computers.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_402_0.png)


    # Setting up for Remote Logins


    Setting up your Linux box to accept remote logins is easy. There are several types
    of remote logins available to Linux users. You can allow other users to *telnet*
    into your computer using the *telnet*, *ssh*, or *ftp* commands. You can also
    allow people to dial in via an attached or internal modem, log in, and then use
    a shell. You can also set up a *dialup Point-to-Point Protocol* server to assign
    a dynamic or static IP address.


    *Telnet* and *FTP* access are generally determined by settings in your system''s
    `/etc/inetd.conf` or `/etc/xinetd.d` directory. For example, both *SuSE* and *LinuxPPC
    2000* currently use the *inetd* or Internet superdaemon and its `/etc/inetd.conf`
    configuration file. In this text file you''ll see:


    ```

    ...

    #

    ftp stream tcp nowait root /usr/sbin/tcpd in.proftpd

    telnet stream tcp nowait root /usr/sbin/tcpd in.telnetd

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'These settings allow the availability of FTP and telnet services on your system.
    Other configuration files, such as `services` or `ttypesace`, may be used to fine-tune
    control and access by users from specific remote hosts.


    # Editing `/etc/inittab`


    To allow dial-in access, edit the `/etc/inittab` file, then use a line-monitoring
    and login utility such as `agetty`, `ugetty`, or `ngetty` to determine a user''s
    access. For example, if you use SuSE Linux and perhaps have an internal modem
    on `/dev/ttyS0`, you can use the `agetty` command like this:


    ```

    2:123:respawn:/sbin/agetty -w -I ''ATE0Q1&D2&C1S0=1,015'' 115200 ttyS0 vt100

    ```


    Use this entry to replace the default entry for runlevel 2:


    ```

    2:123:respawn:/sbin/mingetty tty2

    ```


    The `agetty` command will monitor your modem, then automatically answer the phone
    and provide a login prompt if a user calls in. The user must have an account on
    your system in order to log in.


    # Handling Shell Accounts


    Allowing remote shell accounts is a potential security hazard, but can also provide
    certain users better access to on-line tools and utilities. For example, if your
    server has Internet access, this allows remote users to take advantage of your
    services. Users can conduct business using text-based Internet utilities, such
    as `pine`, `elm`, `trn`, `slrn`, or `lynx` to send electronic mail, read news,
    or browse the Web.


    You can also restrict activities on your system. For example, your server does
    not have Internet access, but is connected to a LAN. This way remote users are
    restricted to business activities, and all records, activities, and files created
    by employees are kept inside the business.


    You can further restrict activities, but perhaps allow Internet access by assigning
    a single program to a user instead of a shell. For example, your server has Internet
    access, but in your remote user''s `/etc/passwd` entry, substitute a shell entry
    with the name of a text-based e-mail client, such as `pine`:


    ```

    bball::x:501:billy bally:/home/bball:/usr/bin/pine

    ```


    When the user logs in, the `pine` program will be presented without access to
    the shell, and will be logged out when exiting the program.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '> Make sure the pine has not been compiled with SUSPEND_ENABLE, or the all
    the remote user has to do to access a shell is press Ctrl+z! You''ll also want
    to make sure that pinc is listed in /etc/shells.


    # # Setting up PPP Accounts


    If you''d prefer just to provide a PPP account with a static IP address, create
    your remote user''s account, but instead of providing a shell entry in the /etc/passwd
    file, use the name of a shell script, such as start_ppp.


    For example,


    ```

    bball:x:501:501:billy ball:/home/bball:/usr/local/bin/start_ppp

    ```


    The start_ppp shell script looks like:


    ```

    exec /usr/sbin/pppd detach

    ```


    You''ll also need a companion entry in the /etc/ppp directory to provide settings
    for your modem''s port. Create a file named options.ttySO (to match your modem''s
    port; for example if your modem is on /dev/ttyS1, then the name of the file should
    be options.ttyS1) that contains the IP address of the server and the IP address
    you''d like to assign to the remote computer, such as:


    ```

    192.168.2.37:192.168.2.99

    ```


    You''ll also need an /etc/ppp/options file that contains:


    +   asympap 0

    +   netmask 255.255.255.0

    +   proxyarp

    +   lock

    +   crtscts

    +   modem


    These settings are essential in order to support networking over your modem. You
    can now allow your remote user to dial in and connect!


