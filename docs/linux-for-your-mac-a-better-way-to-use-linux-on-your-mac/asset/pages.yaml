  md: 'This appendix provides additional information about X, and related links to
    more information about Linux, various distributions, and other hardware. When
    looking for information regarding Linux on your PPC computer, start your search
    at your distribution''s Web site. If you fail to find information from your vendor,
    follow up by looking for Web sites describing Linux on your hardware. Finally,
    you can also turn to various Usenet newsgroups to ask for information.


