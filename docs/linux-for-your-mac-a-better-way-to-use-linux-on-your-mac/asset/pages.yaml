  md: 'Using binary mode to transfer files.


    ftp>


    Under SuSE Linux, the default FTP directory is under `/usr/local/ftp`. When you
    use LinuxPPC 2000, the default directory is located under `/home/ftp`. These settings
    depend on how FTP is configured for your system. See the manual page for your
    system’s server, and read up on using `/etc/ftpcasecs`, `/etc/ftpusers`, `/etc/ftpgroups`,
    `/etc/ftpcconversions`, and `/etc/ftphosts`. You can use these files to change
    the default public access directory, grant access, restrict users, change greeting
    messages or add automatic file conversion utilities.


    > If you’re still having trouble, make sure that the version of FTP server designated
    in your `/etc/inetd.conf` file is installed! There are several FTP distributions
    available for Linux, such as *wu-ftpd*, *ProFTPD*, and *ftpd*. Each may use a
    different configuration file. When in doubt, read the documentation included with
    the software package.


    # Configuring Apache


    Apache is the *de facto* standard Web server for Linux, although there are some
    commercial alternative software packages, such as *Zeus*. As you’ve already learned,
    the system script that starts, stops, and restarts Apache under SuSE Linux is
    named `/etc/rc.d/init.d/apache`, while under LinuxPPC 2000 (and other Red Hat-based
    systems) will be named `/etc/rc.d/init.d/htpd`.


    With SuSE Linux, Apache is configured by editing the file named `/etc/httpd/httpd.conf`.
    With Red Hat-based systems, the `httpd.conf` file may be found under the `/etc/httpd/conf`
    directory. One of the most important settings is `DocumentRoot`, which specifies
    where your system’s initial Web page is located. For example:


    ```

    #

    # DocumentRoot: The directory out of which you will serve your

    # documents. By default, all requests are taken from this directory, but

    # symbolic links, and aliases may be used to point to other locations.

    #

    DocumentRoot  "/home/httpd/html"

    ```


    There is not enough room in this chapter (or book) to describe all of Apache’s
    configuration files, the way in which the server may be configured, or how to
    add functions, modules, and other scripts. However, you should take note of your
    system’s initial settings and the default location of your computer’s home page
    (most likely'
