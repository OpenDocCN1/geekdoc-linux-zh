- pgno: 247
  md: '# Chapter 10: Using the K Desktop Environment


    This chapter introduces the K Desktop Environment, or simply KDE, one of the most
    popular desktops used with X11 and Linux. KDE has won a large following of users
    and developers from around the world, and is under active development. New versions
    are regularly released, and new KDE clients appear every day.


    As you learn more about Linux and chat (online or with other users), you will
    discover that one commonly asked question (or troll) is: “What window manager
    do you use?” Minions of the Dark Side and spreaders of FUD (Fear, Uncertainty
    and Doubt) love to argue that the Linux user base has fragmented and split into
    two camps—those who use KDE and those who use GNOME.


    This is of course, ridiculous. As you have learned so far, Linux is not a graphical
    interface. Linux users have a choice, and you can choose to use Linux with a GUI
    or without one. If you choose to use a GUI, you are free to customize your computer’s
    desktop. The technologies and advances made by GPL and open source programmers
    in GUI design have been so successful, that companies such as Sun Microsystems
    and Hewlett-Packard have adopted GUIs originally developed by and for Linux users.


    After reading Chapter 7, “X11 and Window Managers,” you should know that there
    are many different X clients you can use to manage a graphical desktop. The K
    Desktop Environment, part of a project founded in October 1996, was released July
    12, 1998, as version 1.0, following a long period as a beta product. Version 2.0
    was released October 23, 2000, and development has continued at a rapid pace.


    KDE generated quite a bit of excitement, because it provided the first free, open-source
    suite of X clients that offered a comprehensive desktop environment. The commercial
    Unix consortium attempted a similar effort, termed the CDE (Common Desktop Environment),
    but its commercial status did not appeal to the Linux market.


    KDE is a desktop environment that includes more than 200 different clients, nearly
    12,000 files, and requires nearly 150MB of hard drive space. Hundreds of additional
    clients, which are not part of the standard distribution, are available through
    various developer pages on the Web. The current base source code distribution
    eclipses that of the current PowerPC Linux kernel, and consists of 800,000 lines
    of C and C++ programming.


    KDE is popular for a number of reasons, but perhaps some of the most enticing
    features are:


    +   - **Network transparency for the desktop environment.** This means that listings
    of remote files in a browser or FTP window can be used as if representing local
    files. You can click on the name of a graphic image, and it will automatically
    be downloaded and displayed.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '+   * Ease of use. Though Mac OS users may scoff, KDE provides nearly all the
    features found in modern GUI designs for the desktop, including drag- and-drop,
    graphical symbolic links, active icons, and customization of nearly any desktop
    element.


    +   * Stability. KDE is quite stable and even clients that are “works in progress”
    and crash will not affect the operation of the desktop.


    +   * Source code. KDE is built using open source libraries named Qt from Troll
    Tech AS. Although a possible bone of contention in the development of proprietary
    software, the Qt libraries and nearly all KDE clients come with source code and
    are free for personal use. This is in direct contrast to the GNOME libraries and
    clients, which are distributed free under the GNU General Public License, and
    unencumbered by any restrictions.


    +   * Client development tools. KDE also provides GUI development tools, such
    as KDevelop, to use for quickly prototyping and building clients.


    +   * An office application suite. KDE developers from around the world have also
    been working hard to produce an integrated office suite named KOffice. Consisting
    of six components, KOffice includes a workspace manager, charting client, word
    processor, spreadsheet, illustration program, and a presentation development client.
    All clients can communicate, share, and update information in each other’s documents.


    +   * Themes. Themes, also known as color schemes, provides a way to customize,
    dress up, or alter how your session’s clients or desktops are displayed. Developers
    can create new themes by saving collective desktop and window-decoration changes.


    +   * Session management. Session management, or the ability to save the state
    of the desktop and running clients, is a timesaving feature, especially if you
    need specific applications active when getting to work. KDE provides that compliant
    clients will be restarted the next time you begin your session. You also have
    the choice of saving or not saving your session.


    +   * A wealth of applications. KDE’s base distribution, in addition to the number
    of supplemental programs, provides many programs you can use during your X sessions
    to be more productive.


    # Introduction to the KDE Desktop


    You will immediately notice that KDE clients share a consistent interface, such
    as menus, windows, buttons, dialog boxes, and other controls. Another useful feature
    is that nearly every client has a Help menu you can use to get more information.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_249_0.png)


    The basic KDE desktop, shown in Figure 10.1, provides nearly all the tools you
    need to get to work.


    # ### KDE Desktop Elements


    You will use different elements of your KDE desktop at different times. For example,
    when you first start using KDE, you will want to explore different menus. Navigate
    through the menu system to find out how applications are organized on the menus.
    You will also want to learn how to use the desktop to mimic shell command-line
    features, such as deleting files, creating new directories, and so on. What follows
    are short descriptions of the various desktop elements.


    # ### KDE Panel


    The KDE panel is a re-sizable, movable object that may be displayed or hidden
    with a single click of the pointer (located on the arrow at each end of the panel).
    The panel is an important part of conducting work while using KDE, and offers
    quick access to menus, lists of windows, your home directory, new terminals, help,
    configuration dialog boxes, and other applications. The panel also features navigation
    buttons you'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'can use to jump to different virtual desktops (similar to legacy X window manager
    clients known as pager). Active clients will dock a window button in the panel,
    and you can hide or show windows by clicking on the client''s panel button. You
    will also find some KDE clients, known as applets that are designed to work in
    the panel (such as the clock applet). Applications may be easily added to the
    panel for convenient launching.


    # K Menu


    The K menu (represented by the capital ''K'' on the desktop panel) is the entry
    point to KDE''s clients and other applications. You can use this menu to log out,
    lock the screen, get information about your system and KDE, get help, manage the
    panel, and launch applications. A KDE menu editor is available to help you customize
    the menu.


    # Desktop Menu


    The desktop menu is an optional menu that may be displayed across the top of the
    screen. This menu provides access to the same menus provided by the panel, and
    may be used to create new files, directories, icons, URLs, or client-launching
    icons. A new feature in KDE 2.0 and beyond is a Bookmarks menu. This menu is a
    copy of your Netscape Navigator bookmarks, and may be used to launch KDE''s konqueror
    client, which allows you to quickly jump to a favorite Web site. The desktop menu
    also provides a Desktop, Windows, and Help menu, which are used to manage the
    root display, navigate windows and the desktop, and get help with KDE.


    # The Konqueror Client


    KDE''s capable konqueror client may be used as a file manager. If you click the
    home icon on the desktop panel, konqueror will launch and display the contents
    of your home directory. However, konqueror is much more than a simple file- and
    icon-management client. You can use the Location field of konqueror''s window
    to not only view your Linux file system, but the file systems of any locally mounted
    remote computer''s hard drive or CD-ROM. You can also enter Web addresses in the
    Location field, as konqueror may be used as a Web browser (see Figure 10.2).


    If you type in an FTP URL, such as ftp://ftp.tux.org, you can then use drag-and-drop
    to copy files or even entire directories of files using FTP! Finally, konqueror
    is also used to display help and manual pages for KDE and its clients, and will
    display the contents of any text file and the image of many different graphics
    files.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_251_0.png)


    Figure 10.2  The KDE  konqueror  client may also be used to browse the Web.


    If you need to use konqueror to automatically log in and navigate to a specific
    directory on a remote computer, use a URL in the Location field like this: http://bball@www.tux.org/home/bball/public_html.
    The konqueror client will display a small dialog box and ask for a password. After
    you type it in and press Enter you will see your files displayed in its main window!


    # Desktop Icons


    KDE builds a set of desktop icons, partially based on your system''s capabilities
    and previously installed hardware. For example, if KDE finds a CD-ROM with a configured
    mount point, you will see a CD-ROM drive icon on your root display. If you configure
    a printer, you may find an active printer icon, and documents may be dragged and
    released on the icon for printing. You will also find Web icons, representing
    handy URLs that will be displayed in a konqueror window if you have an active
    Internet connection.


    # Using Basic Features


    Most basic features of KDE can be explored using the left mouse button in 20 minutes.
    To practice, click on various menus, launch clients, resize windows, close'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_252_0.png)


    Figure 10.3  *The KDE desktop responds to middle and right mouse button clicks.*


    windows, or read help. When using the pointer in the root display, however, you
    will find the middle and right mouse buttons indispensable.


    As with other window managers, KDE uses the left mouse button to click, select,
    launch, drag, resize, or controls objects. Under KDE, when you click the right
    mouse button in a blank area of the desktop, you’ll see a short menu, as shown
    in Figure 10.3.


    This menu is used to create new desktop items, jump to a bookmark, get help, configure
    the background or desktop, manage windows and icons, and lock or unlock the screen.
    The middle mouse button, if clicked in the root display, is used as a navigation
    tool, enabling you to jump to different windows or desktops.


    Files, represented by icons, may be dragged to and from the root display or desktop.
    You can delete files by dragging them to your desktop’s Trash. Trash may be emptied
    by right-clicking the can, and selecting the Empty trash bin menu item.


    Desktop files may be renamed, deleted, or copied by right-clicking and selecting
    the appropriate menu. If you select the Delete menu item, the file is sent to
    the Trash. If you select the Shred menu item, the file is deleted automatically.
    If the file’s icon is a CD-ROM, hard drive, or floppy you can mount or unmount
    the device by using the mount menu item (or unmount if the device is mounted).


    # Using Your Home Directory


    Your home directory is represented by the tiny house on the desktop’s panel. Click
    this icon to launch **konqueror** as a file manager to display your files. You
    should see a display like that in Figure 10.4.


    The root display is represented by the file named **desktop** in your home directory,
    and initially contains basic icons installed by default. Click on the file named
    Desktop'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_253_0.png)


    *Figure 10.4 Your KDE home contains files displayed in your KDE desktop (under
    the Desktop directory) and your Linux home directory.*


    in the konqueror window and you will see the files present in your root display.
    You can then use the navigation buttons in the main window to navigate through
    your Linux file system.


    Your home directory is the best (and perhaps the only) place to store your files.
    By organizing your data into different folders you can keep your work and information
    organized.


    # ## Using the Desktop


    Launch new programs by clicking on an icon on your desktop''s panel or by clicking
