  img_proc: true
- pgno: 281
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_281_0.png)


    > *Figure 11.8* The System Info client also provides detailed information about
    your system’s CPU, along with disk and memory usage.


    Memory Information, and CPU Information. For example, click the CPU Information
    Tab, and you will see a listing in a dialog box (shown in Figure 11.8) that shows
    the type of CPU and, which Apple computer model is in use.


    To graphically monitor your system’s activity, you can use the GNOME Stripchart
    Viewer. This small client can show how busy your CPU is, the System load (an average
    of activities), swap file usage, network activity, the PPP connection (if you
    have one), and the traffic activity on the current PPP device (usually *pppd*).


    Start this client from the desktop’s panel, or from the command line like this:


    ```

    ```

    $ gnetchart &

    ```

    ```


    After you press Enter, you can then right-click on the dialog box to get help
    or set color options, as shown in Figure 11.9.


    # ## Internet Clients


    GNOME includes a number of Internet clients you can use during online sessions.
    Although many users turn to Netscape Communicator as a comprehensive solution
    for Web browsing, HTML editing, electronic mail, and Usenet newsreading, you may
    find some special-purpose GNOME clients easier and more efficient.'
