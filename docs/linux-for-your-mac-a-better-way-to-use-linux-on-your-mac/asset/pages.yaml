    ```

    $ kmix &

    ```


    Note that your mixer may look different than the one shown in Figure 13.11, which
    is for an Apple G4 Cube (it provides audio via USB). The `kmix` client can also
    dock or embed itself in the KDE panel. To use the embedded client, click on its
    icon in the panel to access its features. GNOME users will turn to the `gmix`
    client, which provides slider controls and mute buttons. Start this GNOME client
    from the desktop''s panel or the command line of an X11 terminal window, like
    this:


    ```

    $ gmix &

    ```


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_332_0.png)


    **Figure 13.11** *Use the `kmix` client during your KDE X sessions to control
    your system''s audio levels.*'
