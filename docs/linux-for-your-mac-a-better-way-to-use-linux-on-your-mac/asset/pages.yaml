- pgno: 380
  md: 'The Linux shell''s `kill` command can be used to stop Linux processes. Use
    this command with its `SIGKILL`, or `-9` signal, along with the process''s ID
    number, like this:


    ```

    $ kill -9 1018

    ```


    Using the previous example, after you (root or the user *bball*) pressed *Enter*,
    the *xclock* client would disappear from memory. If a program spawns a number
    of processes and can be identified by name (such as *httpd*), try using the *killall*
    command, followed by the process name. For example to kill all instances of your
    Web server, try:


    ```

    # killall httpd

    ```


    If you do not have permission to kill the process, the command will report an
    error.


    To see an ongoing motion picture of processes in memory, use the `top` command,
    which can be used at the console or during an `X` session. Start the command like
    this:


    ```

    $ top

    ```


    After you press *Enter*, you will see a screen, as shown in *Figure 14.16*.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_380_0.png)'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'After you press Enter, a list of processes will be shown. To sort the processes
    according to memory size, type Shift+M. To get help, type a question mark. You
    can also use top to kill any processes you own.


    Killing processes is a drastic solution. Fortunately, Linux includes another program
    you can use to assign a CPU priority. The `nice` command can be used to run another
    command with a higher or lower scheduling priority. This means that if you know
    a program will take a long time to run, or require numerous system resources,
    but is not important, you can run the program with a lower priority. See the `nice`
    command manual or GNU info page for more information.


    Other graphic process control clients are included with X, KDE, and GNOME. The
    X11 xosview client can display (but not control) the system load, CPU usage, memory,
    swap memory, paging, and network information. To control processes using a graphical
    client, try KDE’s kpm (process management client shown in Figure 14.17), or GNOME’s
    gtop client (a system monitor program with a unique memory graphing capability).


    # ## Basic Security Issues


    Here are some basic Dos and Don’ts for administering a Linux system. A few simple
    rules can make the difference between happiness and heartache when using Linux.


    +   * Do change your root password(s) often.

    +   * Do check the Web pages of your Linux system’s distribution for system fixes
    and updates.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_381_0.png)


    **Figure 14.17** *The kpm KDE client not only shows currently running processes,
    but also presents graphs of the system’s load.*'
  merge: -1
  img_proc: true
- pgno: 382
  md: '+   - Do enforce password expiration if supported, and you run a multi-user
    system. The command to use (on SuSE Linux systems) is the `chage` command.

    +   - Do formulate a backup plan based on worst-case scenario.

    +   - Do perform backups on a regular basis.

    +   - Do restrict physical access to your computer.

    +   - Do use a firewall or some other protection for any computer attached directly
    to the Internet.

    +   - Do use a mix of letters and characters in passwords.

    +   - Don’t install more software than you need.

    +   - Don’t just turn off your system while Linux is running. This can harm the
    filesystem integrity of any mounted filesystem. Read the manual page for the `fsck`
    command, which is used on non-journaling (non-reiserfs) filesystems.

    +   - Don’t log in and use Linux as the root operator unless you’re performing
    system maintenance. Use the `su` or `sudo` system.

    +   - Don’t turn on any services that you do not use or do not need. Edit `/etc/inetd.conf`
    to turn off unneeded services.

    +   - Don’t use passwords that are common words. Especially words that are in
    the system dictionary (`/usr/dict/words`).

    +   - Don’t write down passwords.


    # Upgrading the Linux Kernel


    Although many PowerPC Linux users are quite happy to use Linux, the kernels and
    software as distributed on a vendor’s CD-ROM, there may be a time when, as system
    administrator, you will be asked to update the current Linux kernel. This is most
    often done to enable new hardware features or correct serious errors or problems
    on a system. You can also recompile kernel modules at the same time.


    In order to recompile the kernel, you must have a working C development system
    installed, along with the proper programming tools, such as the `gcc` compiler,
    `make`, and assorted assemblers and linkers. You must have a copy of the kernel
    source headers (include files) installed, as well as a copy of the source tree
    of your currently running kernel. You should also check that the source for any
    or all modules or other devices, such as PCMCIA drivers are also installed.


    For some reason, PowerPC Linux users seem to upgrade kernels more often, and not
    by rebuilding Linux. In contrast to Intel-based PC Linux users, many PowerPC Linux
    users apparently and routinely download and install pre-built Linux kernels,'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'module directories, and System maps without rebuilding. This is a quick and
    easy process, and only involves copying the new System.map file to the /boot directory,
    decompressing and installing a new /lib/modules/2.XX.XX module directory, placing
    a copy of the new kernel in the Mac OS System Folder, and then changing BootX
    or yaboot.conf settings.


    On the other hand, as a system administrator, you should be able quickly rebuild
    and install a new or revised Linux kernel easily. Once all the software and source
    code is installed, navigate to the /usr/src/linux directory. This directory should
    be a symbolic link to the current kernel source directory, which could have a
    name such as linux-2.2.18-4hpmac or linux-2.2.16, or if you are an intrepid user
    at the time of this writing, linux-2.4.2.


    Directions for building and installing a kernel are contained in the file root.
    Set up the directory for a kernel build by using the make command like this:


    ```

    # make mrproper

    ```


    This command will clean up the source directories in preparation for the build.
    Next, use the make command with one of the following: config, menuconfig, or xconfig.
    The first form of the command presents a text-based configuration script that
    asks questions regarding what features to enable or disable in the resulting kernel.
    Start the configuration like this:


    ```

    # make config

    rm -f include/asm

    (cd include ; ln -sf asm-generic asm)

    if [ ! -s Documentation/lang/en/Configure.help ]; then \

    cp Documentation/lang/config.lang.help.en Documentation/lang/en/Configure.help;\

    cat Documentation/Configure.help >>Documentation/lang/en/Configure.help;\

    fi

    make -C scripts cfixconv

    make[1]: Entering directory ''/usr/src/linux/scripts''

    make[1]: ''cfixconv'' is up to date.

    make[1]: Leaving directory ''/usr/src/linux/scripts''

    source scripts/set_headerfile.sh ; rm -f config.in.tmp ; \

    scripts/cfixconv $headerfile <arch/ppc/config.in >config.in.tmp

    /bin/sh scripts/Configure config.in.tmp

    #

    # Using defaults found in .config

    #

    .

    ```'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'Language of the Kernel configuration (English, German, French, Spanish) [English]


    The first prompt asks for the language to be used for the configuration script.
    Default values are enclosed in brackets, which means that if you are satisfied
    with the value, you can just press Enter.


    The second form of the command presents a console-based graphical configuration
    dialog box that uses menus and fields when asking what features to enable or disable
    in the resulting kernel. Start the configuration like this:


    ```

    ```

    # make menuconfig

    ```

    ```


    After you press Enter, you will see a dialog box, as shown in Figure 14.18.


    Press Enter on a menu item with an arrow (-->) to enter the configuration sub-menu.
    Use the spacebar to select or unselect features. An asterisk (*) denotes a feature
    is enabled. An empty space denotes that the feature will not be enabled. In some
    instances, the spacebar will toggle between enabled, disabled, or if possible,
    building the feature as a module (in this final instance, an M will appear).


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_384_0.png)


    **Figure 14.18** Configuring the build in preparation for a new Linux kernel can
    be accomplished using a graphical, text-based console.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'The third form of the command can only be used from the command line of an
    X terminal window during an active X session. The command will present an X window
    dialog box with buttons and check boxes that represent yes, no, or if possible,
    build a module. Start the configuration like this:


    ```

    ```

    # make xconfig

    ```

    ```


    After you press Enter, you will see the dialog box, as shown in Figure 14.19.


    The order in which to proceed through the menus is not as obvious using a script
    or console-based dialog box. If you are building a new kernel for the first time,
    make sure you understand exactly what you would like to enable or disable in your
    new kernel. Also, make sure to proceed through all the menus so that you have
    a better understanding of the capabilities that the Linux kernel offers.


    Save the file and exit after you have finished the configuration. Next, use the
    *make* command to create dependencies in the source tree (so that the compiler
    and linker know what elements to build and put together in the kernel), like this:


    ```

    ```

    # make dep

    ```

    ```


    After the dependencies have been created, you can then build the kernel like this:


    ```

    ```

    # make vmlinux

    ```

    ```


    After you press Enter, the compilation process will start. Depending on the speed
    of your system, you will find two new files in the `/usr/src/linux` directory:
    `vmlinux`, a new kernel; and `System.map`, a memory map of the new kernel. Your
    next step is to build any required kernel modules. Again, use the *make* command:


    ```

    ```

    # make modules

    ```

    ```


    After the modules are built, you can then install them with:


    ```

    ```

    # make modules_install

    ```

    ```


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_385_0.png)


    *Figure 14.19 Configuring the build during an active X session allows the use
    of your X pointing device in a graphical X window and configuration dialog boxes.*'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'However, you may want to make a backup copy of the current modules (which is
    found under the `/lib/modules/2.x.x` directory, where `x.x` represents the version
    of your Linux kernel).


    To use your new kernel, copy the file `system.map` to the `/boot` directory. You
    can also copy `vmlinux` to the `/boot` directory. However, BootX and yaBOOT users
    will then need to copy `vmlinuz` to the appropriate Mac OS System Folder, and
    change BootX or yaBOOT''s configuration file to use the new kernel.


    # # Resources


    +   * http://www.redhat.com. Home page for the Intel- and Alpha-based Linux distributions.

    +   * http://www.yellowdoglinux.com. Home page for Yellow Dog Linux, with links
    to documentation on related system tools.

    +   * http://www.linuxppc.com. Distributor of LinuxPPC 2000, and a good place
    to check for errata, bug fixes, and updates.

    +   * http://www.suse.com. Home page for SuSE Linux, with links to troubleshooting,
    and a hardware compatibility database. You will also find links to updated software
    packages.

    +   * http://www.rpm.org. An open source Web site devoted to promoting RPM technology.
    While there, make sure to download a copy of Ed Bailey''s classic tome, “Maximum
    RPM.” You will benefit from reading about RPM.

    +   * http://www.cis.ohio-state.edu/~rowland/projects/OpenSource/security-basics/security-basics/index.html.
    A great site for basic security tips when using Linux.

    +   * http://www.kernel.org. The definitive Web site for the latest version of
    the Linux kernel.

    +   * http://www.eecs.udel.edu/~mills/ntp/clock1.htm. A listing of public-access
    time servers on the Internet. This will help keep your system running on time.

    +   * http://www.erlenstar.demon.co.uk/unix/faq_2.html#SEC14. Answers questions
    like “What is a zombie?”

    +   * http://www.solucoop.orge.ca/linuxconf/. Home page for the `linuxconf` client.

    +   * http://ctdp.tripod.com/os/linux/howlinuxworks/linux_hlprocess.html. A great
