    One frequently asked question when using GNOME is whether there is a list of documented
    shortcut keystrokes users can use instead of the mouse. To see the family of keystrokes
    available when using Sawfish for your GNOME window manager, click the Shortcut
    menu item, and then click on each Keymap family.


    There are nearly 30 default keystrokes and combination key and mouse-clicks that
