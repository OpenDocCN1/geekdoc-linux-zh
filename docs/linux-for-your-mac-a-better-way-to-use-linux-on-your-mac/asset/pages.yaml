    The *v* or verbose option will list the files being extracted, or else the action
    occurs silently.


    By combining the power of the tzms command and the archive creation and compression
    features of *tar*, even novice system administrators can quickly build backup
    scripts to accomplish the hard work of performing backup operations. This task
    becomes even easier when you add automation, and perform these tasks unaided on
