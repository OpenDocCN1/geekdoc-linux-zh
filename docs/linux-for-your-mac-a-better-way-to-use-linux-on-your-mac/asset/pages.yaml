    your changes before exiting the control center. Use the Revert button to undo
    a change. If you are satisfied with a change, click the OK button to exit that
    particular dialog box. If you would prefer to ignore any changes, click the Cancel
    button to exit the current control center dialog box.


    # Configuring Sawfish


    The Sawfish window manager includes a companion program named `sawfish-ui` that
    you can use to customize many different aspects of how your desktop and windows
    are handled. The `sawfish-ui` component may be launched as a stand- alone program
    with its own interface, or by accessing it through the GNOME control center interface.
    In either case, you will be able to configure this window manager in a number
    of ways, including changing appearance, focus, built-in help, window movement,
    placement and re-sizing policies, use of sound, and many workspaces or virtual
    desktops.


    You can launch `sawfish-ui` from the command line of an X11 terminal window like
    this:


    ```

    $ sawfish-ui &

    ```


    After you press Enter, you will see its main dialog box, as shown in Figure 11.4.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_276_0.png)


    Figure 11.4 *The Sawfish window manager is GNOME-aware and provides a graphical
    configuration client named sawfish-ui.*'
