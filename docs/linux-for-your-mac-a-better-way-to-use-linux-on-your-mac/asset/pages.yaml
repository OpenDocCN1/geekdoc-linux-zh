    \ | Spreadsheet application |\n| Guppi | Graphics | Plotting and graphing client\
    \ |\n| Dia | Graphics | Structured diagrams editor |\n| Impress | Presentation\
    \ | OpenOffice presentation client |\n| OpenCalc | Spreadsheet | OpenOffice spreadsheet\
    \ |\n| AbiWord | Word Processor | Word processor |\n| OpenWriter | Word Processor\
    \ | OpenOffice word processor |\n| OpenDraw | Graphics | OpenOffice drawing client\
    \ |\n| SketcH | Graphics | Vector-based drawing package |\n| Sodipodi | Graphics\
    \ | Vector-based drawing package |\n| Toutdoux | GroupWare | Project management\
    \ client |\n\nIf you use the startx command, you can begin an X session using\
    \ GNOME by including the following (as the last line) in your .xinitrc file:\n\
    \n```\nexec gnome-session\n```\n\nIf you use SuSE PPC Linux, you can begin an\
    \ X session with startx and GNOME like this:\n\n```\n$ startx gnome\n```\n\n#\
    \ Choosing a Window Manager for GNOME\n\nUnlike KDE, GNOME is made up of software\
    \ libraries and a set of clients that use the software libraries. It does not,\
    \ however, include a window manager. This means that you are free to use any GNOME-aware\
    \ window manager to run your desktop."
  merge: -1
