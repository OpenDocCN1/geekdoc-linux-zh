  md: 'You can then perform basic image editing by using gPhoto''s toolbar buttons.
    When you have finished, save each image (the default format is .j pg).


    # Converting Graphics


    Linux systems use and include many different types of graphics files. The type
    of most graphics will be recognized by filename extension, such as .gif, .tiff,
    or .j pg. Other formats include PostScript (.ps), and legacy UNIX graphics, such
    as .bmp, .png, or .xwd. You will find nearly 50,000 graphics (many in the form
    of icons) installed on your system following a full install of SuSE PPC Linux.


    Mac OS artists will be happy to know that Linux provides a number of capable graphics
    clients and utilities that may be used to translate or convert familiar graphics
    files. Some programs, such as the shareware xv client, must be used during an
    X session, while others such as ImageMagick''s convert command may be used at
    the text console without an active X session.


    A number of Linux graphics commands may be used to flip, rotate, invert, or even
    crop images. Many others can be used in a shell pipe on the command line. This
    allows you to combine effects to translate as well as edit batches of images.
    For example, to convert a Graphics Interchange Format file to Portable Anymap,
    make the image larger, then convert the image to color Tagged File Format. Create
    a shell pipe, like this:


    ```

    g1ftpixmap lux.gif | pnm scale -xsize 400 | pn msmooth | ppm to tiff >lux . tiff

    ```


    In this example, the .gif file is converted to .ppm, then enlarged. The enlarged
    output is then smoothed, converted to .tiff, and saved as a new graphic. Economy
    of scale is achieved even more when you must convert entire directories of graphics
    or wholesale numbers of files.


    One of the most capable graphics conversion commands included with Linux is the
    convert command, which can import and export at least 75 different graphics file
    formats. This command is easy to use, because translation occurs according to
    filename extension. For example, to convert the new .tiff file back to .gif, use
    convert, like this:


    ```

    # convert lux.tiff lux.gif

    ```


    The convert command may also be used for a variety of other effects, such as scaling
    and cropping (see its manual page for more information).'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Graphics Conversion Commands


    Linux provides many different graphics conversion commands. The following is a
    short list of some of the major commands and families of commands you will find
    with nearly every distribution.


    | Command | Description |

    | :--- | :--- |

    | **ImageMagick** | Includes the `display`, `import`, `animate`, `montage`, `convert`,
    `mogrify`, `identify`, and `combine` commands. See the `ImageMagick` manual page
    or individual manual pages for these commands. The `display` command is a capable,
    graphical image editor for use during X sessions. |

    | **pbm** | A family of 39 portable bitmap file format commands (see the `pbm`
    manual page for details). |

    | **pnm** | A family of 28 portable anymap file format commands (see the `pnm`
    manual page for details). |

    | **pgm** | A family of 19 portable graymap file format commands (see the `pgm`
    manual page for details). |

    | **pbm** | A family of 36 portable bitmap file format commands (see the `pbm`
    manual page for details). |

    | **ppm** | A family of 44 portable pixmap file format commands (see the `ppm`
    manual page for details). |

    | **xcv** | An interactive graphical X client that may also be used from the command
    line to translate, convert, and edit graphic images. |

    | **ee** | The Electric Eyes graphical X client (like `xcv`) that can be used
    to transform images. |


    Many of these commands may be used in shell scripts, or command-line pipes. By
    combining input and output streams of data, you use many of these commands as
    building blocks for larger editing applications.


    # Audio Mixers and Players


    Sound is an integral part of conducting business and doing work on a personal
    computer. Though many Mac OS users may turn off the Speech Manager, sound is often
    important during a Linux X session. Your X window manager provides visual as well
    as audio feedback in response to system events. This lets you know when applications
    quit, windows open, or buttons are clicked.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Many Linux users enjoy listening to music while working. Whether its playing
    an audio CD or listening to an .mp3 audio stream over the network, music can help
    make work easier. You will find numerous audio clients included with your Linux
    distribution and soon you will develop one or two favorites for each type of task.


    These tasks can include using audio CD players, controlling sound with mixers,
    recording sound, creating .mp3 files, and listening to .mp3 files. Obviously,
    Linux must be configured to use your computer’s sound hardware. For many Macintosh
    PowerPC models, this is accomplished by loading the dmasound.o kernel module.
    Other models, such as the Apple G4 Cube (which uses USB audio), will use the audio.o
    module.


    # ## Using Mixers


    Audio mixers are used to adjust the volume, balance, treble, and bass of your
    computer’s sound system. Linux provides audio mixers that can be used from the
    text-only console, and graphical interface mixer clients that must be used during
    an X session. For example, the aumix client may be used at the console or in a
    terminal window. Start the client, like this:


    ```

    $ aumix

    ```


    The screen will clear, and you will see a display as shown in Figure 13.10.


    When launched this way, the mixer is interactive. Use the Up and Down cursor keys
    to navigate through the sound controls, and use the Left and Right cursor keys
    to adjust the sound. Tap a letter, as indicated by the menu of commands, to


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_331_0.png)


    Figure 13.10 The aumix command may be used interactively or as a command-line
    mixer with or without X.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'save or quit the client. You can also use `amix` from the command line to adjust
    sound, like this:


    ```

    $ amix -v +20

    ```


    In this example, after you press Enter, the main volume sound will increase 20
    percent. Using `amix` is a convenient way to include sound management in shell
    scripts or other programs.


    > Is your PowerPC sound level too low or too high by default? Boot to Mac OS and
    check the sound level. In many cases, Linux will inherit sound settings established
    during a previous Mac OS session. In addition, some sound systems, such as the
    G4 Cube, will not respond to `amix` main volume settings. Use `amix -w +20` instead.


    Christian Esken''s `kmix` audio mixer client, included with KDE, features slider
    controls and split channels, along with graduated marks. Start this client (shown
    in Figure 13.11) from the desktop''s panel or the command line of an X11 terminal
