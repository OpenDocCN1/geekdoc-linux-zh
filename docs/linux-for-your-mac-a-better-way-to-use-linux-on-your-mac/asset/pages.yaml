    In this example, you type in a sentence after pressing Enter. If diction detects
    suspect phrases or wordiness, you will see a response after you press Enter at
    the end of the sentence. When finished, press Ctrl+c or Ctrl+d to end the session.


    The style command is used to check the readability of text. This program analyzes
    your writing style, then applies a number of readability benchmarks and prints
