    # Mounting and Unmounting Filesystems


    The mount command can be used to mount and unmount a variety of filesystems. It
    is essential during the Linux boot process, as it brings the native Linux partitions
    on-line and makes them available for other programs during the boot process. This
    section provides a few simple examples you will use regularly during your Linux
    sessions.


    SuSE Linux and Red Hat-based PowerPC Linux distributions include system daemons
    that you can set up and start to automatically mount removable media. Under LinuxPPC
    2000 Q4, use the amd daemon, controlled by the /etc/rc.d/init.d/amd script and
    the ntsysv administrative tool. This daemon is configured by the file etc/amd.conf.
    Under SuSE Linux PPC, the task is handled by the automount daemon, and is controlled
    by the /sbin/init.d/autofs startup script. Configuration and mounting points are
    handled by the /etc/auto.master, /etc/auto.misc, and /etc/auto.net configuration
    files.


    Use of an automount strategy can be convenient. However, many Linux users prefer
    to mount and unmount filesystems manually. For example, to properly mount a CD-ROM,
    insert the CD-ROM, and then use the mount command, a filesystem type, device name,
    and mounting point like this:


    ```

    # mount -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    If you have your Mac''s CD-ROM device already defined in your system''s filesystem
    table, then you can abbreviate the mounting command like this:


    ```

    # mount /mnt/cdrom

    ```


    When you simply specify the mount point, the mount will then look in /etc/fstab
    for an associated entry and use that entry''s information. With the addition of
    user'
