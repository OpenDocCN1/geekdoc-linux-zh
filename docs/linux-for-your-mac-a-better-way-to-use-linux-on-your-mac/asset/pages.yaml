    icon. Once you get the location of the default system files for Apache, you can
    then safely move any symbolic links or directories to a known location for later
    use.


    LinuxPPC 2000 administrators can turn to the `netconf` utility to configure some
    aspects of Apache. Launch `net.conf`, then click its Server Tasks tab. When the
    dialog box appears, click the Apache Web server button as shown in Figure 15.11.
    For example, click on the Sub-directory specs button in the panel’s dialog box
    to change the default location of your Web pages, icons, and other files.


    # Internet Security Issues


    In a perfect world we wouldn’t have to worry about Internet security. And in the
    early days of the Internet, openness, sharing and lack of security were the rule,
    not the exception. Today however, with the explosion of the number of users on
    the Internet (millions of computers and millions more users), there are bad people
    out there who would love nothing more than to break into your system with stealth
    or wreak havoc on your files.'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'If you have a LAN connected to the Internet, chances are more than good that
    you or your system administrator has a `firewall` in place. A firewall can be
    built using software or hardware. But the basic idea is to protect your system
    from intruders whose ultimate aim is to gain access as the root operator. Once
    an intruder gains access as root, all is lost, and you are at someone else’s mercy.


    # ## Basic Firewalling


    If you don’t want to offer a tempting target, turn off all unwanted network services.
    Review your system’s `/etc/inetd.conf` file to see what services are turned on.
    If you see a service, such as Internet Relay Chat, and you don’t use it, turn
    it off! Make sure that you have system logging enabled (through the use of the
    `syslogd` daemon), and take the time to examine your logs once in a while. Nearly
    all Linux distributions log system and kernel activity to a file named `messages`
    under the `/var/log` directory. You can read this file (as root) by using a pager
    command, such as `less` like this:


    ```

    # less /var/log/messages

    ```


    Another thing you can do is turn to various software packages that can help provide
    a measure of security by filtering access into and out of your system.


    First, don’t use a root password that is easily cracked. This includes using any
    word from your system’s dictionary, `/usr/dict/words`. Change your root password
    often, and review your system’s users often. Some Linux distributions also provide
    for password aging, and you can use the `expiry` command to set up rules for password
    aging.


    If you have an Internet connection, physically separate your LAN from the Internet
    and place a hardware router, DSL router, or share partner between your LAN and
    the Internet. This spare computer will then have two Ethernet interfaces through
    which traffic is routed. If you’re ultra security conscious, install the OpenSSH
    (*Open Secure Shell Server*) and related `ssh` utilities.


    Next, use `ipchains` (for 2.2.X kernels) to set up a ruleset for packet filtering.
    For advice on how to best set up a system, see Rusty Russel’s Linux IPCHAINS-HOWTO.
    Most Linux users create a shell script containing the necessary commands and rules.
    Once a ruleset has been devised for your system (to filter various service packets),
    use the `ipchains-save` command to save your settings.


    If you use SUSE Linux, you can use the `yast` command to also perform some basic
    settings. Start `yast`, select System Administration, then Security Settings.
    Next, press Enter on Configuration of `/etc/login.defs`. You’ll see a dialog box
    as shown in Figure 15.12.'
  merge: -1
  img_proc: true
- pgno: 409
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_409_0.png)


    Figure 15.12 Use yast to perform some basic security settings.


    You can use this dialog box to set password lengths and expiry, but more importantly
    to log all logins and break-in attempts. Vigilance is another virtue of system
    administration, and the more aware you are of what is going on in your system,
    the better. You can even watch what is being logged while you work by using the
    tail command and its -f option like this (as root):


    ```

    # tail -f /var/log/messages


    May 7 19:09:49 cubic in.telnetd[4657]: connect from root@192.168.2.38 (192.168.2.38)

    May 7 19:09:55 cubic login: FAILED LOGIN 1 FROM dell.home.org FOR UNKNOWN, User
    not known to the underlaying authentication module

    May 7 19:10:05 cubic PAM-unix2[4658]: bad username []

    May 7 19:10:05 cubic login: FAILED LOGIN 2 FROM dell.home.org FOR UNKNOWN, User
    not known to the underlaying authentication module

    May 7 19:10:09 cubic PAM-unix2[4658]: bad username []

