    While you may typically think of an editor as an interactive program with a moving
    cursor and the ability to visually insert, remove, or readjust words, lines, and
    paragraphs on the screen, Linux also comes with editors that work from the command
    line or through shell scripts. Editors with this ability, such as *sed*, are known
    as *stream* editors, and work on text from the standard input, then send the modified
    text on through the standard output.


    If you have a document such as *myfile.txt*, but find that a person''s name has
    been misspelled throughout, you can use *sed* to quickly edit and replace all
    occurrences with a single command line. For example, if the original text looks
    like this:


    > Mr. Ho Lee Fook, one of the largest campaign raisers for Arlington County''s
    recent Board of Supervisors election, and a long-time resident of Lyons Village,
    had recently been arraigned on charges of burglary in connection with a series
    of break-ins in various townhouse communities in Fairfax, Va. Fook, 39, was arrested
    Saturday as he was leaving RT''s restaurant in the Courthouse section of Arlington,
    Va.


    You can correct the error by using *sed*''s search operator, a forward slash (/)
    delimiter, which is followed by the text to find, another delimiter, the text
    to replace, and finally the globally replace operator. The command should appear
    like this:


    ```

    $ sed s/Fook/O''Brien/g myfile.txt

    ```


    > Mr. Ho Lee O''Brien, one of the largest campaign raisers for Arlington County''s
    recent Board of Supervisors election, and a long-time resident of Lyons Village,
