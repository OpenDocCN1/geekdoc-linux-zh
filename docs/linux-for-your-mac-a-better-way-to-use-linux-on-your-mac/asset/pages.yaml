    apostrophe on the shell command line. As the original text is undisturbed, the
    output of the sed command line may then be redirected to a new file, like this:


    ```

    $ sed s/Fook/O''Brien/g myfile.txt > corrected_file.txt

    ```


    Using the sed command for quick edits to text can be much faster than starting
    an editor, loading the file, and then performing a global search and replace.


    # Word Processor or Editor?


    What is the difference between a word processor and an editor? For many users,
    there is little difference, and most are happy as long as they can manipulate
    text with ease in a friendly software environment. Other users feel that a text
    editor is a word processor with fewer features, while traditionalists would never
    use a word processor to edit text files. The truth is that word processors and
    text editors share many common features.


    In general, a text editor is used to edit text in ASCII (American Standard Code
    for Information Interchange) format. The standard ASCII character set is generally
    limited to 127 characters, with each letter designated by a code represented by
    seven bits (e.g., the limit of 127 characters). Extended character sets that use
    eight bits, such as the ISO Latin 1 set, provide an additional 128 characters.
    Word processors generally have the ability to store additional data, such as font,
    point size, color, and alignment information for all or a portion of a document''s
    contents. However, you can also use a text editor to insert formatting commands
    into text documents by using a specification such as Rich Text Format (.rtf),
    rncgf manuscript commands, HTML (Hypertext Markup Language), or LaTeX.


    # Choosing an Editor


    Choosing an editor is a matter of personal choice, need, policy, or resources.
    As you have already learned, real Linux users do not even need a text editor when
    the cat command is available. You can simply use:


    ```

    $ cat >myfile.txt <<,

    ```'
