- pgno: 98
  md: '```

    LineLength : 2048

    MMIO Address : 0x90000000

    MMIO Size : 8191

    Accelerator : Unknown (32)

    ```


    In this example, `fbset` prints extended information (as requested by the `-i`
    option) about your current settings. These settings are changed by using the `fbset`
    command. This approach, however, will not do you any good if you have video problems
    after booting. The best approach is to use proper `vmode` and `cmode` arguments
    (according to your Power Mac model) in your Yaboot configuration file, perhaps
    like this:


    ```

    ...

    append="video=atyfb:vmode=17,cmode=16"

    ...

    ```


    In this example, video is set up for a vmode of 1024x768 at 75MHz with a cmode
    setting of thousands of colors.


    Other problems, such as enabling internal hardware (like sound, Ethernet, or an
    internal modem) are generally solved by kernel updates or updated kernel modules.
    In nearly all instances, default base sound levels are set through the Mac OS
    sound settings. This means that by turning up the sound during a Mac OS session
    and then booting to Linux will enable you to increase volume under Linux. If sound
    is disabled or set too low during a Mac OS session and you boot to Linux, you
    may not hear sound at all.


    If you run into trouble, check Linux PPC Web sites for information regarding your
    specific Power Mac model. You will generally find that someone before you has
    encountered similar problems and has published a solution.


