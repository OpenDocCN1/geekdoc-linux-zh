    # ## Administering Users


    This section introduces a number of commands, clients, and tools you can use to
    perform user administration. The process of maintaining user accounts is a valuable
    service, especially at large computer installations or on systems that support
    many users. Properly administering users involves more than just creating and
    deleting accounts, but can also involve additional security considerations such
    as directory and file permissions, password expiration schemes, and quotas to
    reserve or limit CPU and storage resources.


    These tasks are trivial when maintaining a small system, and can seem overwhelming
    at a large installation. But the initial considerations and policies implemented
    and enforced by the system administrator may be the same on either platform, and
    demand the same attention.


    # ### Creating and Deleting Users


    The basics of administering users involve creating and deleting user accounts.
    Traditionally, Linux users are assigned a username consisting of the first letter
    of a person’s name followed by the person’s last name (i.e., Deborah Cohen would
    become the user known as dcohen).


    System administrators of Red Hat-based Linux systems can use the linuxconf command
    to create users. Under the configuration menu, click the Users accounts,'
