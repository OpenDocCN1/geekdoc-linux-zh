    # Creating a Backup Strategy


    Backing up files is a chore. But it is a necessary chore if you want to avoid
    loss of data. Losing data can cost lots of time and money. Backing up files is,
    therefore, an essential and potentially litigious chore if you administer a multi-user
    system. The first obstacle to place in the face of disaster is a good backup plan.
    Some initial questions you should ask are:


    +   - Can the system be administered remotely?

    +   - Does data have to be backed up seven days a week or 24 hours a day?

    +   - Have any current backup strategies been tested?

    +   - How far back (in time) do users need access to the system''s data?

    +   (i.e., can data that is two years old be archived and removed?)

    +   - How many users need to access the data?

    +   - How many redundant systems (power supplies, hard drives, CPUs, etc.) are
    available?

    +   - How much data needs to be backed up?

    +   - How often is the system upgraded with new hardware or software?

    +   - Is the data in one large file or database, or does it consist of user directories
    and lots of files?

    +   - Is there a need for off-site storage of the data?

    +   - What are some security concerns about the data? In other words, how sensitive
    is the data?

    +   - What are the capabilities of the current back up hardware and media?

    +   - What are the storage requirements for the system?

    +   - What is the budget for new hardware or software for back up operations?

    +   - What is the minimum acceptable loss of data (if any)?

    +   - What is the shortest amount of downtime (if any) permitted for the system?'
  merge: -1
  img_proc: true
- pgno: 430
  md: '+   * What kind of back up equipment is already on hand?

    +   * What procedure is currently in place?

    +   * When was the last archive made of the system?

    +   * When was the last backup made of the system?

    +   * When was the last system failure and what caused it?


    Obviously no one ever wants to ever lose data a single document, program, or multimedia
    file. Is this always possible? The answer is yes, if you take all the necessary
    precautions, devise a good back up plan, and have adequate equipment. Fortunately,
    since you use Linux, you also have the necessary software tools.


    Some hardware solutions, such as RAID (*Redundant Array of Inexpensive Disks*),
    can provide an initial measure of security, but it is best to devise a schedule
    that can cover any loss of data and still have a backup in place. For example,
    an incremental backup strategy is extremely beneficial and can shorten the time
    required for back-ups, as the operation saves only those files that have changed
    since the last backup.


    One approach, using two sets of media is:


    +   * **Sunday.** Back up the entire system

    +   * **Monday through Saturday.** Back up all changed files


    Another approach, requiring seven sets of media is:


    +   * **Sunday.** Back up entire system

    +   * **Monday through Saturday.** Back up all changed files from the previous
    day


    Yet another more comprehensive approach is:


    +   * **Sunday.** Back up the entire system

    +   * **Monday through Saturday.** Back up all files changed from the previous
    day

    +   * **Following Sunday.** Backup all files changed from previous week

    +   * **Following three weeks.** Backups are repeated and the process is started
    over


    Choosing an economical backup medium can also be a crucial factor. However, due
    to the low prices of CD-Rs, high-speed and high capacity tape drives, and the
    continual dropping cost of hard drive storage, many administrators are choosing
    one of these media.


