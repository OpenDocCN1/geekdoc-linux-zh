    For additional information about networking setup, see Chapter 9, "Connecting
    to the Internet," which contains more details about configuring Internet interfaces
    from the command line by using such utilities as the `ifconfig` and `route` commands.


    # # Sound


    One of the most joyful things about using Linux is its support for sound and the
    wealth of audio and multimedia utilities. However, if you are depending on sound
    support while using PPC Linux, choose your Power Mac model carefully. Sound may
    or may not be fully supported.


    Unfortunately, there is no comprehensive list of the hardware and functions that
    are supported on each existing Apple Power Mac computer. However, in general,
    sound is supported on most machines by simply loading the `dnasound.o` kernel
    module. An exception is the Apple G4 Cube, which plays sound via USB (*Universal
    Serial Bus*) speakers. For this model, simply load the `audio.o` kernel module
    using the `insmod` command, like this:


    ```

    # insmod audio

    ```


    Other models, such as early iBooks, may require specially configured Linux kernels
    in order to play sound. Linux may not support sound yet on newer (Summer 2000)
    iBooks.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Another issue is the playing of audio CDs on slot-loading Power Macs. On most
    Intel-based PCs and notebooks, audio CDs can often be played even if sound is
    not supported by the computer''s sound chip, because audio output from the CD
    drive is connected directly to the computer audio out hardware. This is not true
    of Apple''s hardware, so even if sound is supported on your Power Mac, you may
    find that audio CD clients do not work.


    You can solve this problem by loading IDE (Integrated Drive Electronics) SCSI
    (Small Computer Systems Interface) emulation using the ide-scsi kernel module,
    like this:


    ```

    ```bash

    # insmod ide-scsi

    ```

    ```


    Next, use the ln command to create a link named /dev/cdrom that points to your
    computer''s CD-ROM device (as a SCSI device). The emulated SCSI device is /dev/sr0:


    ```

    ```bash

    # ln -s /dev/sr0 /dev/cdrom

    ```

    ```


    If your distribution, such as YDL 2.0 or LinuxPPC 2000, does not include /dev/sr0,
    use the mknod command like this to create the device:


    ```

    ```bash

    # mknod /dev/sr0 b 11 0

    ```

    ```


    Use your favorite text editor to create a shell script named mycdplay containing
    a command line, like this:


    ```

    ```bash

    cdda2wav -t $1 -D /dev/cdrom -N -e -q -x -d0 -I cooked_ioctl1 $

    ```

    ```


    Save the file, and then use the chmod command to make the file executable, like
    this:


    ```

    ```bash

    # chmod +x mycdplay

    ```

    ```


    You can now insert an audio CD into your slot-loading Power Mac running Linux
    and play tracks, such as 2-6, like this:


    ```

    ```bash

    # ./mycdplay "2-6"

    ```

    ```


    This approach works by using the cdda2wav command to strip, convert, and play
    selected audio tracks from an audio CD in a single step. It is not a perfect approach
    because other system activity, hard drive activity, or other active processes
    may cause a skip or two while playing; however, this command works well on faster
    G4 machines or slower machines that would otherwise be idle. Also, while this
    approach works without problems or requiring a kernel recompile with SuSE PPC
    7.1 or LinuxPPC 2000 Q4, YDL 2.0 users may have to recompile the default kernel
    to enable SCSI emulation.


    Do not be disappointed or frustrated if sound is not fully supported right away
    on your new Power Mac. Chances are good that as PPC Linux matures, support will'
  merge: -1
  img_proc: true
- pgno: 77
  md: "improve, and you will soon be playing music and watching DVDs (see Chapter\
    \ 13, \n\"X11 Multimedia\").\n\n# USB\n\nUSB (*Universal Serial Bus*) support\
    \ has improved at an amazing rate for Linux. \nNearly all mice and keyboards,\
    \ including PFU AMERICA, INC.'s USB Happy Hacking \nkeyboard (used to write more\
    \ than half this book), are supported. Many other USB \ndevices, such as parallel-port,\
    \ serial adapters, printers, and scanners are also supported.\n\nOne of the first\
    \ places to check for USB support under Linux is the Linux USB \nproject at http://www.linux-usb.org.\
    \ Note however, that support for a particular \ndevice under PPC Linux is not\
    \ assured; it all depends on how well the Intel-based \ndriver works on the PowerPC\
    \ platform. The good news is that many devices are \nwell supported, and most\
    \ work very well.\n\n# Adding USB Devices\n\nUSB support is generally compiled\
    \ into the Linux kernel, with support for differ-\nent devices provided by loadable\
    \ kernel modules. Look under the `/lib/modules/`\n`2.x.x/usb` directory, where\
    \ `2.x.x` is the version of your Linux kernel. Under the \n`usb` directory you\
    \ will find various kernel modules to support different devices. Some\nUSB modules\
    \ have names for a specific device, such as *keyspan_pda.o* for Keyspan's \nUSB-to-serial\
    \ PDA adapter. Other modules, such as *scanner.o*, support a wide \nvariety of\
    \ devices.\n\n# Adding a Scanner\n\nIf you are a graphic artist, and want to use\
    \ a scanner with PPC Linux, do not \nworry; there are many different scanners\
    \ that work with PPC Linux and various \nPower Mac computers. In the past, most\
    \ scanners for Mac OS have used SCSI \ninterfaces. Today, however, most scanners\
    \ are supported by the USB interface.\n\nSupport for USB scanners is contained\
    \ in the `scanner.o` module. This module \nsupports a wide variety of scanners.\
    \ However, in order to use a scanner with Linux \nyou need corresponding driver\
    \ support. This support is usually provided by the SANE \n(*Scanner Access Now\
    \ Easy*) collection of \"back- and front-end\" software utilities.\n\nIf you are\
    \ considering getting a USB scanner and using it with Linux, you should \nfirst\
    \ browse to the SANE home page at: http://panda.mostang.com/sane/ and check \n\
    for support for your intended scanner (see Chapter 13, \"X11 Multimedia\", to\
    \ learn"
