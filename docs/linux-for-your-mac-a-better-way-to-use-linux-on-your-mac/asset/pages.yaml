    transfer proceeds, you will see progress messages in the lower portion of the
    dialog box. Use gftp''s menu to control the types of file transfers, refresh directory
    listings, set bookmarks, initiate transfers, log results, or get help.


    Use GNOME''s Balsa to handle electronic mail. Launch this client from the desktop''s
    panel, or from the command line of an X terminal window like this:


    ```

    ```

    $ balsa &

    ```

    ```


    The first time you run Balsa, you will be taken through a series of set up dialog
    boxes. You will be asked for your name, e-mail address, SMTP server (usually localhost),
    and the location of a local mailbox (named mail in your home directory by default).
    You will then be asked to verify the locations of your inbox, outbox, sentbox,
    draftbox, and trash. When finished, click the Finish button to begin using the
    client.


    After Balsa starts, click its Settings menu and select Preferences. If you retrieve
    mail from a remote ISP''s server, click the Mail Servers tab and add your ISP''s
    server settings by clicking the Add button (as shown in Figure 11.11).


    When finished, you can click the Check button in Balsa''s main window. Incoming
    mail will be located in your Inbox. Click the Inbox button on the left to view
