    # # X11 Organizers


    This section introduces two sophisticated software program organizers you can
    use to maintain or increase your productivity while using Linux. These clients
    have features that go beyond simple calendar and appointment scheduling programs.


    # ## Using korganizer


    The KDE *korganizer* client is a scheduling and organizing application like *plan*,
    which includes a scheduling daemon that runs in the background during your X session.
    The *kalendar* client, like the *korganizer* has an accompanying small window
    application that can be used to launch a new view of your schedule.


    You can start *korganizer* from KDE''s desktop panel, or the command line of an
    X terminal window like this:


    ```

    $ korganizer &

    ```


    After you press Enter, you will see its main window, as shown in Figure 12.7.


    Although the default view is of the current day''s to-do list, you can use a different
    view by clicking on an associated icon in *korganizer* ''s graphic toolbar, or
    use the view menu to see a work week, weekly, or monthly calendar. Use the **Actions**
    menu to set a new event, such as an appointment, by clicking on the **New Event**
    menu item. You will then see a dialog box, as shown in Figure 12.8, in which you
    can enter the particulars.


    You can use *korganizer* to set up group meetings, broadcast advisories to members
    on a category''s list, and track progress of tasks. To learn more about *korganizer*,
    use its built-in help, available through its reference manual (accessed by choosing
    the **Contents** menu item on the main window''s **Help** menu).'
  merge: -1
  img_proc: true
