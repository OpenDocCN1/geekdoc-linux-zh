- pgno: 89
  md: 'This chapter covers the installation, configuration, and use of various boot
    utilities for starting Linux on an Apple PowerPC. It is important to know what
    type of boot mechanism to use depending on the target platform if you have to
    replace a hard drive, reinstall Linux, or install Linux on a new computer.


    Bootloaders can also be used for rescue operation, tweaking video and graphics
    hardware, or enabling certain features of the Linux kernel. Many PowerPC Linux
    users simply install a bootloader and then happily conduct business on their systems.
    More advanced PowerPC Linux users, however, try to get the most out of their systems
    and are more successful in overcoming obstacles when problems arise.


    The good news is that you can configure your PowerPC Mac to properly boot to either
    Linux or Mac OS without problems, and you do not have to master arcane technical
    skills that you will only need to use once or twice. Once armed with more information,
    you should never have a problem and you may learn a little troubleshooting.


    # ## Choosing a Boot Method


    Your choice of boot method depends primarily on the type of Apple Macintosh model
    on hand. Although some Apple PowerPC computers can use BootX and Yaboot (such
    as early iBooks), benefits will generally be obtained by using the more proper
    bootloader in order to either install or run Linux.


    The following general rules apply:


    +   - If your Macintosh is an “OldWorld” PowerPC Mac, use the BootX Control Panel.

    +   - If your Macintosh is a “NewWorld” PowerPC Mac, use the Yaboot kernel loader.

    +   - If your Macintosh can use either BootX or Yaboot, use Yaboot instead.


    # ### What’s the Difference?


    Earlier Macintoshes used a ROM (*Read-only Memory*) chip, called the ToolBox ROM.
    This ROM chip held various parts of the Mac OS and was used not only to boot the
    computer, but also to support graphics and other operations while the computer
    was in use. Starting in late 1999, Apple changed this approach and removed this
    information from the ROM.


    The new approach, labeled *NewWorld Architecture*, positions Mac OS boot code
    and system software into two parts, with some boot code in a ROM called'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'the Boot ROM, and system software support routines in a file called a ToolBox
    ROM image. The Boot ROM contains a FORTH language interpreter, started by software
    called Open Firmware.


    Therefore, PowerPC systems that used a ToolBox ROM are labeled OldWorld Macs,
    while all newer Macs are NewWorld.


    # Yaboot, lilo, or BootX?


    NewWorld Macintoshes include models such as the Blue and White G3s and G4 Power
    Macs, PowerBooks, the iMac, and the iBook. OldWorld Macintoshes include pre-iMac
    (beige) Power Macs. For information regarding compatibility of specific models,
    or PreP and CHRP PowerPC computers, browse to your Linux distributor''s Web site.


    The following sections introduce the commonly used software tools you can use
    to set up a dual-boot Mac OS and PPC Linux system. Currently, booting Linux on
    the PowerPC platform almost always involves the need to have at least one Mac
    OS partition, and the initial use of Mac OS to partition the system''s hard drive.
    This is unlike Intel-based PCs, which most often use a boot loader embedded in
    the Master Boot Record of the first IDE hard drive.


    # Configuring BootX


    BootX, created by the extraordinary Mac and Linux programmer Benjamin Herrenschmidt,
    is a Mac OS Control Panel that provides a graphical boot loader interface to boot
    Linux or Mac OS. To use this software, download or copy the BootX distribution
    (shown in Figure 4.1) to your Mac OS Desktop.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_90_0.png)


    Figure 4.1 The BootX Control Panel is used to boot Linux or Mac OS on OldWorld
    and some NewWorld Power Macs.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'To install BootX, drag the BootX Control Panel and BootX Extension to your
    Mac OS System Folder. The Control Panel is placed in the Control Panels folder,
    while the Extension file is placed in the Extensions folder. Next, copy the folder
    named Linux Kernels to your System Folder. This folder can hold different versions
    of the PPC Linux kernel, and is useful for testing new kernels when using Linux.


    BootX is used to enable a Linux installation, and after installation, to choose
    between booting Linux or the Mac OS, to choose a proper Linux kernel, to set proper
    video settings, and to pass kernel *arguments*, or boot messages (similar to those
    at the LILO boot: prompt for Intel-based Linux users).


    Use BootX’s Kernel pop-up menu to choose a Linux kernel. Any Linux kernel placed
    in the Linux Kernels folder in your System Folder will be listed (BootX, however,
    will also look for a kernel named vmlinux in the System Folder). The Root Device
    field should contain the partition number of your root Linux partition. For example,
    if the Linux PPC 2000 Q4 installer reports that your root partition is */dev/hda12*,
    enter *hda12* in the Root Device field.


    The More kernel arguments field is used to pass arguments to the Linux kernel
    for use when Linux boots. These arguments can range from video device settings
    to *runlevels*, or Linux system states.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_91_0.png)


    > If you use BootX, you do not need a copy of the Linux kernel in the /boot directory.


    For example, if you would like to boot PPC Linux to runlevel 1, or system-maintenance
    mode (with networking, multi-users, and X off), use the keyword *single* in the
    argument field. Linux will boot to the root prompt. If you are an iBook user with
    a one-button ADB mouse, you can use *adb_buttons=103,111* which sets the F11 and
    F12 keys to the middle and right mouse buttons (USB users use a different approach).


    Video options may look something like:


    ```

    video-attyb:vmode:18,cmode:16

    ```


    In this example, the Linux kernel is being told to use a type of video (framebuffer)
    at a resolution (*vmode*) of 1152x870, with a colordepth (*cmode*) of thousands
    of colors. The valid range for *vmode* settings is 5, 6, and 10 through 20, representing
    resolutions of 640x480 up to 1280x1024. Valid *cmodes* are 8, 15, 16, 24, and
    32 (ranging from 256 colors through millions of colors).'
  merge: -1
  img_proc: true
- pgno: 92
  md: '> There are additional arguments, such as `mkfr` (for controlling the video
    clock) and `pil`, which are not documented (except in the Linux kernel source).
    The Linux kernel recognizes many different arguments. Different video drivers
    (such as Matrox) can recognize more than 40!


    If you click on the BootX Options button, you see a dialog box, as shown in Figure
    4.2. Use this dialog box to enable cache on G3 PowerPC Macs, force the use of
    SCSI, force video settings, or select a RAMdisk image (only required during a
    Linux install—which may be discarded afterwards). When finished, click OK or Cancel
    to return to the main dialog box. Use Cmd+s to save your BootX preferences at
    any time.


    When you turn on your Power Mac, BootX appears shortly after the initial Mac OS
    dialog box. You have about 10 seconds to choose either the Mac OS or Linux.


    # ### Configuring Yaboot


    Yaboot, like BootX, is a bootloader for PPC Linux. This is the preferred bootloader
    to use with NewWorld Power Macs, and is relatively easy to configure. You will
    need to know the partition number of your root Linux partition, along with any
    desired kernel arguments. This loader, also by Ben Herrenschmidt, attempts to
    boot Linux using Apple’s Open Firmware. If Yaboot is properly configured, it does
    not require the use of the Open Firmware prompt (accessed by holding down the
    Opt+Cmd+o+f keys at startup).


    The basic approach to using this bootloader is to create a small, separate Mac
    OS HFS volume to hold a pseudo-System Folder, Finder, Yaboot, a PPC Linux kernel,
    and Yaboot’s configuration file named `yaboot.conf` (see Figure 4.3).


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_92_0.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_93_0.png)


    # Figure 4.3  *The pseudo-System Folder on a Mac OS HFS boot volume contains everything
    you need to boot Linux.*


    Another boot method you may want to explore is Ethan Benson''s ybin. This utility,
    used in conjunction with Yaboot, offers some additional flexibility, and automatically
    configures an Apple Open Firmware boot script according to Yaboot''s configuration
    file. For details, browse to http://www.alsaka.net/–erbenson/ybin/.


    # ## Configuring LILO


    SuSE PPC Linux includes a special version of the LILO (*Linux Loader*) for use
    with PPC Linux. This version obeys much of the syntax used in the version for
    Intel-based PCs, and works at the boot prompt nearly the same way. LILO was originally
    designed for Intel-based PC hardware. As a bootloader and boot utility, LILO is
    typically installed in the MBR (*Master Boot Record*) or in the root Linux partition
    on an IDE drive to support booting to Linux or other operating systems. A configuration
    file named *lilo.conf*, located under the /etc directory, contains directions
    and a roadmap for LILO''s install and operation.


    Under SuSE''s PPC Linux, LILO is used to create files under the /boot directory
    that contain directions and a roadmap for booting either Mac OS or Linux. The
    /etc/lilo.conf contains a picture of your system, which is familiar to Intel Linux
    users. For example:


    ```

    ```

    # partition of the HFS volume holding the pseudo System Folder

    boot=/dev/hda10

    # how long to wait before booting the default

    timeout=100

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 94
  md: '```

    # the default OS to boot (according to label=)

    default=linux

    # the kernel to boot Linux

    image=/boot/vmlinux

    label=linux

    # insert any required/desired kernel arguments

    append=""

    # the root Linux partition

    root=/dev/hda11

    # boot to an installation (e.g., type "install" at LILO prompt)

    image=/boot/vmlinux

    label=install

    append="ramdisk_size=10000"

    root=/dev/fd0

    inirld=/boot/initdisk.gz

    # boot MacOS (e.g., type "macos" at LILO boot prompt)

    other=/dev/hda9

    label=macos

    ```


    In this example, the standard HFS volume containing yaboot and a pseudo-System
    Folder is located on /dev/hda10. The primary Mac OS partition is /dev/hda9. The
    root Linux directory is installed in /dev/hda11. After typing in your /etc/lilo.conf,
    you should then run LILO at the Linux command line (as root) like this:


    ```

    # lilo

    ```


    LILO will then create the necessary files under the /boot directory.


    > Using LILO may or may not work on your system. Due to the way SuSE PPC Linux
    is configured, LILO can generally be used, and is a part of the booting solution.
    However, other PPC Linux distributions, such as LinuxPPC 2000 Q4, offer a more
    simplified booting operation using Yaboot.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_94_0.png)


    You will find Power Mac-specific information regarding LILO under your SuSE PPC
    Linux /usr/share/doc/packages/lilo directory. LILO is not used with other PPC
    distributions.


    # Understanding Open Firmware


    The Open Firmware prompt is basically a command-line interface to a FORTH-like
    interpreter. The FORTH language, originally designed in 1970 by astronomer'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Chuck Moore for control of telescopes, is popular because it is a compact,
    portable, and extensible language that is ideal for ROM-based solutions. FORTH
    has been used in many different types of embedded devices, including many commercial
    arcade games.


    Apple implemented its NewWorld Power Mac boot language, named Open Firmware, to
    allow equipment flexibility and boot-time configuration. It is not necessary to
    learn how to program in FORTH (which is stack-oriented and uses postfix notation)
    in order to boot Linux on your Power Mac. However, you will benefit by knowing
    how to access the prompt, and understanding a few Open Firmware keywords.


    SuSE PPC Linux uses a script that contains Open Firmware language to help configure
    and boot Linux. Part of this script, named os-chooser (which resides in the pseudo
    System Folder named suseboot) contains:


    ```

    ```

    * get-key-map* " keyboard* open-dev $call-method

    dup 20 dump

    5 + C@ 08 = if

    * Booting MacOS ..." cr " boot hd:9,\\tbxi\ eval

    else

    * Booting Yaboot ..." cr " boot hd:10,\\yaboot* eval

    ```


    ```


    In this example, Linux is started by loading Yaboot from /dev/hda10, a standard
    HFS boot volume created during the Linux install. Yaboot then boots Linux. Open
    Firmware’s role in booting Linux is to start Yaboot, which contains directions
    to boot Linux or Mac OS.


    You can boot your Power Mac directly to the Open Firmware prompt by holding down
    the Cmd+Option+o+o keys after turning on your machine. The screen will clear,
    and you will be at the Open Firmware prompt.


    Open Firmware contains default settings that correspond to your particular Power
    Mac. You should exercise caution in modifying existing settings unless you know
    what you are doing. If you run into trouble, use the reset-all command to reset
    settings back to default. Use the printenv command to see a list of current settings.


    Changes are typically made to Open Firmware environment settings in order to define
    or create boot variables, such as the definition of a Linux or Mac OS partition,
    and to create commands to boot Linux or the Mac, perhaps using the boot keyword
    (which exits Open Firmware). Problems can occur in booting Mac OS if the Open
    Firmware variable boot-device is incorrectly configured.'
  merge: -1
  img_proc: true
- pgno: 96
  md: "Hopefully, as PPC Linux matures, more user-friendly boot configuration interfaces\
