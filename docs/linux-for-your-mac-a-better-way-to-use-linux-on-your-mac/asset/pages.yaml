    # ## Using Permissions


    There are three types of permissions that apply to every Linux file: read, write,
    and execute. You may have permission to read a file, but if you do not have write
    permission you cannot change or delete it. On the other hand, you may have execute
    permission on a directory, but without read permission, you will not be able to
    see its contents (but you may be able to edit or delete files that you own inside!).


    # ## Changing File Permissions


    The ls command may be used to examine file permissions, including directory permissions.
    For example, if you create a file using the touch command, then use the ls command
    like this:


    ```

    $ touch file

    $ ls -l file

    -rw-r-- 1 bball users 0 Apr 5 16:41 file

    ```


    The -rw-r--r-- notation designates user, group, and world (or global) permissions.
    This field notation can also be represented by numbers, such as 644. The user
    permissions are rw-, or 4+2. The group and global permissions are r--, or 4. In
    this example, you, as the owner, can read and write the file. Members of the group
    named users and anyone else may only read the file. These three sets of permissions
    are used throughout your Linux filesystem, and through various combinations, are
    used to restrict or assign read, write, and execute permissions.


    You can also view permissions of a directory or various devices. For example:


    ```

    $ ls -ld foo2

    drwxr-xr-x 2 bball users . 4096 Apr 5 16:52 foo2

    $ ls -l /dev/tty80

    crw-rw---- 1 root uucp 4, 64 Oct 4 2000 /dev/tty80

    $ ls -l /dev/hda1

    brw-rw---- 1 root disk 3, 1 Oct 4 2000 /dev/hda1

    ```


    The first letter in the permission notation indicates the type of file, such a
    d for directory, c for character device, and b for block device. Note that the
    directory named foo2 is viewable by anyone because it has r-x or read and execute
    permissions. Only the owner bball has rwx or read, write, and execute permission.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'To change file permissions, use the chmod command. To change ownership of files
    or directories, use the chown command (as root). For example, you can create a
    simple shell script, such as:


    ```

    ```

    #!/bin/sh

    echo "Your system is:"

    uname -r

    uname -v


    echo "Your name is:"

    whoami

    echo "Your contact info is:"

    finger $USER

    ```

    ```


    After you create the file (named me, in the following example), it will look like
    this:


    ```

    ```

    $ ls -l doit

    -rw-rw-r--   1 bball    bball      124 Apr  6 17:18 me

    ```

    ```


    You can then use the chmod command to make the file executable like this:


    ```

    ```

    $ chmod +x me

    ```

    ```


    The file will then look like:


    ```

    ```

    -rwxwr-xr-x  1 bball    bball      124 Apr  6 17:18 me

    ```

    ```


    You can also take away permission by using the chmod command like this:


    ```

    ```

    $ chmod -x me

    ```

    ```


    Another way to add execute permission and restrict use for the owner is with the
    chmod command. This time, however, use the numerical values representing the permission
    notation for the file:


    ```

    ```

    $ chmod 744

    $ ls -l me

    -rwxr--r--   1 bball     bball      124 Apr  6 17:18 me

    ```

    ```


    Here you can see that only the owner, *bball*, has read, write, and execution
    permission (*rwx* = 7). All others only have read permission (*r* = 4).


    # Changing Device Permissions


    You will most often change permissions on your hardware''s devices in order to
    allow users to access a device such as a serial port or modem. This is most often'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'done so that normal users can dial out to establish a PPP connection. For example,
    trying to access a serial port may report:


    ```

    $ echo "AT\n" >/dev/ttyS0


    bash: /dev/ttyS0: Permission denied

    ```


    Indeed, if you examine the permissions of the port, you may see:


    ```

    $ ls -l /dev/ttyS0


    crw-------  1 root  tty    4,  64  May  5  1998  /dev/ttyS0

    ```


    To allow all users access to the modem, use the `chmod` command to grant read
    and write permission like this:


    ```

    # chmod 666 /dev/ttyS0

    ```


    For other devices, such a removable systems or CD-ROMS, the `chmod` command is
    not necessary. Permissions can be granted for your system’s users by modifying
    the device’s entry in your Linux filesystem table, `/etc/fstab`.


    The filesystem table consists of separate lines for different local or remote
    file systems. Entries contain several fields, starting with a device name, such
    as `/dev/ hda`. The next field is a mount point, or path where the device is mounted
    during use. The third field is the type of filesystem, such as `iso9660, hfs,
    vfat`, or `ext2`. The fourth field consists of mounting options. The fifth field
    is used during backup operations by the `dump` command. The last and sixth field
    is used by the `fsck` command to determine the order in which to check the devices
    during reboots.


    For example, the default entry provided by `LinuxPPC 2000` for a CD-ROM may look
    like:


    ```

    /dev/cdrom  /mnt/cdrom  auto  noauto  0  0

    ```


    If you attempt to mount or unmount the drive, you may see:


    ```

    $ mount /mnt/cdrom


    mount: only root can mount /dev/cdrom on /mnt/cdrom

    ```


    On the other hand, `SuSE Linux` provides the following entry:


    ```

    /dev/cdrom  /cdrom  auto  ro,noauto,user,exec  0  0

    ```


    This entry, with the addition of the `user` flag in the filesystem table entry,
    allows anyone to mount or unmount a CD-ROM device. The `auto` option following
    the mount point indicates that the `mount` command should try to automatically
    determine the filesystem used by the volume. The `exec` option indicates that
    programs may be run from the drive.


    Whether or not you allow these actions may depend on your need for system security.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# ## Managing Processes


    One of the greatest things about using Linux is that the operating system is designed
    to isolate and protect the kernel from disruptive processes. Through the use of
    signals, permissions, scheduling, and memory management, your Linux sessions are
    generally quite safe from any program that has run amry and crashed. If you lose
    control of a program, you can generally get to another shell prompt and quickly
    kill it.


    When each program starts, the kernel assigns a process ID number to the command.
    You can see a quick snapshot of these processes in memory by using the `ps` command,
    like this:


    ```

    $ `ps aux`


    ```

    USER   PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND

    root 1 0.0 0.1 400 232 ? S Apr02 0:03 init

    root 2 0.0 0.0 0 0 ? SW Apr02 0:00 [kflushd]

    root 3 0.0 0.0 0 0 ? SW Apr02 0:00 [kupdated]

    root 4 0.0 0.0 0 0 ? SW Apr02 0:00 [kpiod]

    root 5 0.0 0.0 0 0 ? SW Apr02 0:01 [kswapd]

    root 6 0.0 0.0 0 0 ? SW Apr02 0:00 [khbubd]

    root 244 0.0 0.3 1356 644 7 S Apr02 0:00 /usr/sbin/syslogd

    root 248 0.0 0.5 1736 1076 7 S Apr02 0:00 /usr/sbin/klogd

    at 408 0.0 0.3 1500 636 7 S Apr02 0:00 /usr/sbin/atd

    root 429 0.0 1320 580 7 S Apr02 0:00 /usr/sbin/inetd

    root 450 0.0 0.3 1372 584 7 S Apr02 0:00 /usr/sbin/lpd

    root 539 0.0 0.4 2280 908 7 S Apr02 0:00 /usr/lib/postfix

    postfix 547 0.0 0.5 4840 1064 7 S Apr02 0:00 qmgr -l -t fifo

    ```


    ```


    Note that not all the processes are shown here, but one thing Linux users can
    be sure of is that everything starts with just one command named `init`. The `init`
    command, launched after Linux boots, spawns a whole series of new processes to
    get your system up and running. You can verify this by using the `ps` new `pstree`
    command (included with SuSE and LinuxPPC). For example, on a graphical login-based
    Linux PPC system running X and the `twm` window manager, `pstree` reports:


    ```

    $ `pstree`


    ```

    init

    |--automount

    |--crond

    |--gdm

    |--X

    |--gdm

    |--AnotherLevel

    |--twm

    |--netscape-communicator

    ```


    ```'
  merge: -1
  img_proc: true
