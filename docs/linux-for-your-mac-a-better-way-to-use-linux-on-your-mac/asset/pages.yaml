    # # Creating Network Interfaces


    Creating network interfaces while using Linux is easy. Network interfaces are
    created in memory using a variety of utilities. Some programs are command-line
    based, while others are graphic utilities you can use as a system administrator
    to quickly and easily set up networking and connect to another computer or a LAN.
    Obviously, you''ll need to have an installed network card or PCMCIA network interface
    card in your system. Some Power Macs, such as the iBook or TiBook, have internal
    cards that are recognized by Linux at boot time. You can use the `dmesg` command
    to check to make sure the card is recognized like this:


    ```

    $ dmesg

    ...

    etht: GMAC at 00:30:65:f9:df:a0, driver v1.3k2

    3c59x.c 15x8ep00 Donald Becker and others http://www.scyld.com/network/vortex.html

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'This example, from a TiBook running LinuxPPC 2000, shows that the card has
    been recognized. The driver should print the card’s Media Access Control address,
    an internal hardware address unique to each network card, along with other pertinent
    information. Once the card has been recognized and configured, you can assign
    an Ethernet address through the command line or a graphical utility.


    # ### Creating Ethernet Devices


    Under SuSE Linux, use the `yast2` command to create a network interface definition
    during an X session. Launch this client (as root) from the command line of an
    X terminal window like this:


    ```

    # yast2 &

    ```


    After you press Enter, you’ll see a dialog box as shown in Figure 15.5. Click
    the Launch module button to get started. The screen will clear, and yast2 will
    recognize and print the name of your network interface. Click the Next button
    to continue, and you’ll then see a screen, as shown in Figure 15.6.


    If your network uses DHCP, your interface will be automatically assigned an IP
    address. If you prefer, you can also enter your own IP address manually. If you
    are behind a firewall, enter the IP address of your gateway computer in order
    to access the Internet. When finished, click the Next button.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_397_0.png)


    **Figure 15.5** Click the Launch module button in the `yast2` client’s window
    to start configuring your networking.'
  merge: -1
  img_proc: true
