    you will find nearly 60 different services you can control! Using chkconfig, you
    can quickly control the service that runs a particular runlevel. For example,
    to control the Apache Web server on your system, and to assign or restrict various
    runlevels, such as 3 (multi-user mode, text console login) or 5 (multi-user mode,
    graphical X login), use the command like this:


