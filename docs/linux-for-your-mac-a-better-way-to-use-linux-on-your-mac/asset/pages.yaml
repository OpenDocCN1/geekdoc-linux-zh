    The `konqueror` client, introduced with KDE 2.0, has become the ubiquitous KDE
    application. This client is used for file management, online and context-sensitive
    help, or Web browsing, and may even be used to help in HTML (*HyperText Markup
    Language*) page editing! You will use `konqueror` quite often during your KDE
    sessions, and may find that it has replaced Netscape on your desktop''s panel
    (it is the default when using KDE with LinuxPC 2000 Q4).


