    # Adding NFS Mount Points


    The NFS filesystem and service is used to automatically or manually mount and
    access remote hard drives across a network. Using NFS is a handy way to quickly
    provide local storage hosted by remote computers, and even filesystems of software.
    In order to use NFS, you must have NFS service installed and running on both computers,
    and have properly configured the remote and local computers to use NFS. In this
    example, there are two computers: `green`, an Intel-based PC server running Mandrake
    Linux; and `cubie`, an Apple G4 Cube running SuSE PPC Linux.


    On `green`, ensure that all required NFS daemons and services are installed and
    running. You can do this quickly by using the `nfs` startup script (as root) like
    this:


    ```

    # /etc/rc.d/init.d/nfs status

    ```


    Next, edit the file `/etc/exports`. This text file is a simple list of locally
    mounted filesystems that are available for export via NFS. This file could look
    like:


    ```

    /d3/arc val0 (rw)

    /d4/backup dell(rw)

    /music 192.168.2.38(ro)

    ```'
