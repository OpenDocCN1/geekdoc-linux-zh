    Alternatively, you can (as root) send a *Hangup*, or HUP signal to the superserver
    using its process ID. For example,


    ```

    ```

    # ps aux | fgrep inet

    root      407  0.0  0.3  1320  580 ?      S    13:38  0:00 /usr/sbin/inetd

