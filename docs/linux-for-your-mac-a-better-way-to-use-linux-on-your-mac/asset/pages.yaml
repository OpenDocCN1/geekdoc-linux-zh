- pgno: 159
  md: 'This chapter introduces you to the graphical interface for Linux. It is known
    as the X Window System, X11R6, X11, or simply, X (pronounced "ex," rather than
    like Roman numeral "ten"). Unlike the traditional Mac OS (and more like the newer
    Mac OS X, which is pronounced "ten"), Linux uses an add-on software system that
    provides a graphical interface for the desktop. Properly configuring X to work
    with your computer''s graphics hardware is essential if you want to enjoy the
    benefits of windows, icons, menus, and other screen elements, which were first
    brought to the corporate stage by Apple''s Lisa, and then popularized by the 128K
    Macintosh.


    In this chapter, you will learn about a version of X named XFree86, which is a
    free networking *client* and *server* software system. In this system the server
    component handles graphics requests from a remote client (application). It handles
    these requests independent of a remote computer''s drawing capabilities.


    X predates the commercial graphical desktop and server software from the industry''s
    software monopoly, and was designed from the ground up to support the use of remote
    applications. In many ways X exceeds the capabilities of closed-source, proprietary
    commercial operating systems. It also comes with complete source code, which enhances
    its portability to new hardware platforms. X works quite well on nearly every
    hardware platform in existence. Even the XFree86 version of X has been ported
    to run under the new Mac OS X!


    This chapter also includes information about special X clients, known as *window
    managers*, that are used to handle pointer clicks, icons, buttons, and window
    management for your graphical Linux sessions. You will also learn how to configure
    X using a variety of software tools, and see how to configure different graphical
    X login clients, known as *display managers*.


    # # What is X11?


    X is a protocol and networking graphical interface. It was developed in 1984 by
    the Massachusetts Institute of Technology and the Digital Equipment Corporation
    as part of a project aimed to produce a distributed computing environment for
    thousands of users. Since then, X has gone through at least six major revisions,
    with the current version being X11R6.5. The source code to the X Window System
    is released under the stewardship of the X Consortium (http://www.x.org). Free
    versions of X are released by the XFree86 Project, Inc. It is a non-profit organization
    aimed at providing free versions of X for a number of platforms, including the
    PowerPC CPU.


    X includes nearly 3,500 files in a 34MB compressed distribution (as distributed
    for the PowerPC platform). This distribution includes more than 1,000 fonts, 120'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'clients and utilities, 100 graphics, and 1,200 pages of documentation. A typical
    installation requires more than 70MB of hard drive space, and even more if additional
    X11 clients are installed.


    # ## Features of X11


    X is a portable graphical network interface for Linux, and works well on a stand-alone
    workstation, or as a graphics system for a large network. X works over slow serial
    dial-up lines or high-speed fiber-optic networks, and can easily serve one to
    10,000 users. X provides for font management, the use of color and system- or
    client-specific *resources* or configuration files, includes source code, supports
    standardized command-line interfaces for clients known as *X Toolkit Options*,
    and has graphics device independence over a network.


    Best of all, X is royalty free! Developers can build and distribute clients without
    licensing restrictions. And because of X’s portability, the version of XFree86
    that runs on your Apple Macintosh has many of the same features as the version
    of X11 for an Intel-based PC, SPARC, or Alpha CPU.


    This also means that any clients you develop on your PowerPC using X will nearly
    always build, install, and run exactly the same way on any other hardware platform
    supporting X.


    # ## Configuring X11


    Configuring X is one of the essential tasks of completing a successful Linux installation.
    Now an integral part of the install process for a majority of PowerPC Linux distributions,
    X configuration can generally be accomplished automatically as part of the install
    or booting process. This is great when everything goes OK, but if you run into
    problems, you may need to resort to one or more software tools to get things right.


    # ## X under PPC Linux


    Properly configuring X to work with your Mac’s hardware involves the creation
    of a file named *XF86Config*. This file may be located under the */root/,/etc,/etc/X11*,
    or */usr/X11R6/lib/X11* directories, and contains settings that match your computer’s
    graphics hardware (such as monitor frequencies and graphics card chipset information).


    For X and the PowerPC, many installations default to using a *frame-buffer* server,
    in which the graphics hardware is modeled using the buffer memory of the computer’s
    video hardware. All drawing is handled at a high level, so that X and its clients
    do not need to know the specifics of the graphics hardware. While this'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'approach is quite flexible, graphics drawing is not as fast as using software
    that talks directly to your graphics hardware.


    Newer graphics hardware in G4 Power Macs, such as the ATI Rage video chips, is
    supported by XFree86 4.0.1 and its xfree86 server. This server uses loadable code
    modules for support of specific graphics hardware. Older Power Macs will probably
    use a frame-buffer server, such as XF86_FDV or included with XFree86 3.3.6. Some
    PowerPC computers may be able to use either one.


    # Whoops! Am I Being Too Helpful?


    One potential problem is that both LinuxPPC 2000 Q4 and SuSE Linux include automatic
    X configuration utilities that can be set up to generate a new configuration file
    every time Linux is booted. This is OK if that is what you want, but if the automatically
    generated configuration file does not work, and you have set Linux to boot directly
    to an X session, you will not be able to log in. Instead, the X server will repeatedly
    attempt to start, then fail, then attempt to start again in an endless loop. Your
    best resort is to reboot Linux in single user mode, or to a runlevel where X is
    not active, then disable automatic configuration, and attempt a proper configuration.
    With SuSE Linux, the potentially troublesome automatic X configuration is started
    through the /sbin/init.d/xsfb script (and can be controlled by editing /etc/rc.conf''s
    `CREATE_FBCONF=""` setting), while under LinuxPPC 2000 Q4, the `xautoconf` service
    is used (and can be controlled by) the `ntsysv` command. These services can be
    helpful if you change video cards in your computer, but can cause trouble if your
    system requires a custom configuration.


    There are a number of ways to configure X to work with your system. One method
    is through the auto probing of your graphics hardware. Another method is to use
    a console-based configuration program. Choosing an X configuration tool is generally
    a matter of personal preference or the choice of tools included with a distribution.
    Each tool aims to create a working XFree86 configuration file using the highest
    resolution (width and height of screen in pixels) and the greatest color depth
    (or number of colors available for the session). These values are generally expressed
    as 1600x1200 and 16bpp (*bit-planes per pixel*). Common resolutions are 1280x1024,
    1152x768 (for the TiBook), 1024x768, 800x600, and 640x480. Common color depths
    are 8bpp (256 colors), 16bpp (thousands of colors), 24bpp (millions of colors),
    and possibly 32bpp (millions of colors).


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_161_0.png)'
