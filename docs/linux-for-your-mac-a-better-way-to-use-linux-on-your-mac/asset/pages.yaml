- pgno: 103
  md: 'This chapter introduces the Linux shell. The concept of using a shell may seem
    foreign to some Mac users and even repugnant to die-hard GUI (*Graphical User
    Interface*) fans. The shell, however, is an integral part of Linux, and can be
    used with or without the Linux GUI known as the *X Window System*.


    Understanding how to use the shell can save you time and effort while learning
    Linux. Although you can jump right into using Linux without using the shell, you
    will find that there are some tasks more easily accomplished at the command line,
    especially if a comparable GUI client does not exist for a task.


    In fact, there are many experienced Linux users who have happily abandoned the
    resource overhead imposed by a GUI and conduct productive and efficient on- and
    off-line sessions using Linux in its text-only, or *console* mode. Although you
    do not have to become proficient in using the shell in order to use Linux productively,
    knowing how to use a shell can certainly help during troubleshooting and maintenance
    sessions. Working behind the GUI is a commonplace task when using Linux, especially
    if you want to make quick modifications to your system.


    Finally, you should know that many GUI clients available during an *X* session
    incorporate command-line utilities and use the shell during file or other operations.


    # Linux without a Shell?


    It is possible to use Linux without a shell. You can do this by editing a user''s
    */etc/passwd* entry on your system, and replacing the field denoting what shell
    to run upon login with the pathname to a particular program (this is also a good
    way to check what type of shell you are using by default). When the user logs
    in, the program will run, instead of a shell. For example, a typical *passwd*
    entry looks like:


    ```

    bball:x:500:100:William Ball:/home/bball:/bin/bash

    ```


    In this example, the *bash* shell is designated as the login shell. You can replace
    this with the pathname to another program, such as the *emacs* editor like this:


    ```

    bball:x:500:100:William Ball:/home/bball:/usr/bin/emacs

    ```


    Note that this approach will only work if Linux is set to boot to *console mode*,
    and not a graphical login.


    # What Is a Shell?


    A shell is another Linux command. As its name implies, a shell handles interaction
    between you and the Linux kernel. A shell provides powerful features to the com-'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'mand line. Some of these features will be covered in this chapter.


    As a program, a shell can contain its own commands and feature sets, in addition
    to providing traditional features expected of a shell (such as being a command
    and language interpreter). At the very least, a shell allows you to interact with
    the Linux kernel to launch other commands. Many shells also allow you to control
    other running programs (a feature known as *process control*), control your environment
    using pre-defined in-memory values known as *environment variables*, and scroll
    back and forth through previous command lines (a feature known as *history editing*).


    As you learn more about using shells, you will also see that many provide an internal,
    interpreted language that can be used to write complex programs, a process known
    as *shell scripting*. A program written in a shell''s language is known as a *shell
    script*. As you become more proficient with Linux, you will begin writing your
    own shell scripts.


    In some ways, shell scripts can be as powerful as the Mac OS scripting language,
    AppleScript. In fact, shell scripting is similar to AppleScript. (It was, however,
    developed long before AppleScript.) Both facilities provide the following:


    * Easily learned syntax

    * Scripts developed on one computer that may be used on other computers

    * Control of other commands or programs

    * Automation of tasks on the computer

    * Control of programs and other mechanisms over a network


    Linux also includes other programs that can mimic a shell, even though they are
    part of other software packages. Some of these programs include TcI''s *wish*,
    *tclwish*, *smsh*, and *ggcish*.


    # ## Shells for Linux


    There are many shells available for Linux. This section lists some of the features
    of commonly available shells you will find included on your Linux CD-ROMs. You
    may or may not find all of these shells installed on your system. This depends
    upon the type of installation you performed when you installed Linux. In general,
    you will find all of these shells available for your system.


    # ## Choosing a Shell


    Choosing a shell for use with Linux depends upon your particular needs, the number
    and types of shells available for your Linux distribution, possibly the default'
  merge: -1
  img_proc: true
