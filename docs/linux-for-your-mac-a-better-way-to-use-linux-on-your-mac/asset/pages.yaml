- pgno: 320
  md: '# Chapter 13: X11 Multimedia


    +   * Graphics Editors

    +   * Using Scanners and Digital Cameras

    +   * Converting Graphics

    +   * Audio Mixers and Players

    +   * Video and Animation Clients

    +   * Playing DVDs


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_320_0.png)'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'This chapter covers a variety of multimedia topics, including the use of multimedia
    applications and how to create multimedia projects using PowerPC Linux and X.
    As Linux has matured, support has appeared and improved for a variety of hardware
    and software projects. This includes better support for USB cameras and scanners,
    sound mixers, playing audio CDs, ripping audio CDs into .mp3 files, burning CDs
    on CD-R or CD-RW media, and playing DVD movies.


    In this chapter you will learn how to get started with the GIMP, set up a USB
    scanner, use GIMP scanner plug-ins, use a digital camera client named gPhoto,
    convert graphics, use audio mixers, play sounds, rip .mp3 files, and play DVD
    video. That is a lot for one chapter, but you will at least get enough information
    to get started. Linux and X have a great deal to offer the creative artist, musician,
    or technician—the rest will be up to you!


    Using multimedia clients with X and Linux can require additional system and video
    memory, and in some instances specialized video hardware and software. If you
    plan to use multimedia clients with Linux and X, your computer''s graphics system
    should support resolutions of at least 1024x768 and millions of colors (with 16bpp).
    It should support a minimum of thousands of colors. Some tasks, such as converting
    an audio stream into digital form, can tax your CPU. Other tasks, such as playing
    DVD movies, can require a fast PowerPC processor, extra memory, and greater color
    depths.


    # Graphics Editors


    Graphics editors have been a part of X since its first public release. Every XFree86
    distribution of X includes Davor Matic’s legacy monochrome bitmap editor client,
    along with a healthy selection of sophisticated clients supporting nearly 100
    different graphics file formats. Graphics are an integral part of the X desktop,
    which uses icons and background images. You will create, edit, or convert graphics
    as a normal part of conducting business while using X. This is particularly true
    if you have a scanner, use pictures in documents, or send and receive faxes.


    # The GIMP


    The GIMP is a feature-rich and capable graphics client for X, and has been ported
    to many different platforms and Linux distributions, including PowerPC Linux.
    If you are an Adobe PhotoShop fan, you will appreciate the numerous filters, scripts,
    and other tools supported by the GIMP.


    The GIMP is distributed freely and comes with source code, which allows developers
    and artists to contribute improvements to this interactive image editor.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'Its support files, libraries, tools, and filters will be found under the `/usr/share/gimp`
    and `/usr/lib/gimp` directories.


    The GIMP may be launched via the desktop panel or from the command line of an
    X terminal window, like this:


    ```

    $ gimp &

    ```


    When the GIMP is run for the first time, an installation dialog box will appear.
    You will be asked for approval in order to start the install, which involves the
    creation of a resource directory in your home directory and the copying of resources
    into your personal GIMP directory. You will see a list of the intended contents,
    and will be asked to confirm the install. You will also be asked to select a file
    cache size and a temporary file location, as shown in Figure 13.1.


    If you have access to another partition and anticipate editing large graphics
    documents, tell the GIMP to use a file location other than your home directory.
    This can avoid any “disk full” errors. Temporary files can sometimes be three
    times larger than the document being edited, and a full-page (letter size) color
    document at 600 dots-per-inch will require nearly 100MB. You can also limit graphics
    document sizes through settings for the Maximum Document Size in the GIMP’s Preferences
    menu.


    Use the Continue button to finish the installation. When the GIMP launches, you
    will see a splash dialog box, and the GIMP’s Tip of the Day. The floating main
    toolbox will appear, as shown in Figure 13.2.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_322_0.png)


    Figure 13.1  Select a file location for the GIMP’s temporary files.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_323_0.png)


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_323_1.png)


    You can disable the Tip of the Day feature by unchecking the Show tip checkbox.
    Use the File menu to create a new document or to open a graphics document. The
    GIMP can read and write (import and export) many different types of graphics files,
    such as bitmaps (.bmp), Graphics Interchange format (GIF, or .gif), Joint Photographics
    Experts Group (JPEG, or .jpg), Paintshop Pro (PCX), portable network (.png), portable
    anymap (.pnm), Adobe PhotoShop bitmap, tagged image file format (.tiff), X bitmap,
    pixmap and window dump (.xbm, .xpm, and .xwd). You can also use GIMP''s native
    format.


    Right-click on an image window to access the GIMP''s menus. You will see a pop-up
    list of menu items, which you can use to manipulate your image (as shown in Figure
    13.3).


    The GIMP has numerous features (enough for a whole book!), including the ability
    to scan directly into GIMP documents by using its Acquire menu and external clients.


    # ## Using Scanners and Digital Cameras


    Scanners and digital cameras are useful devices that can acquire, create, and
    copy graphic images. In the last two years, both types of devices have dropped
    in price and increased in features. Scanners and cameras are available in a variety
    of shapes'
  merge: -1
  img_proc: true
- pgno: 324
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_324_0.png)


    and sizes. In the recent past, scanners typically used legacy I/O ports on Intel-based
    and Macintosh computers, such as RS-232 (serial), IEEE-1284 (parallel port), and
    SCSI. Early digital cameras typically used serial I/O to transfer images. This
    was a slow, tedious process, generally circumvented by using removable Compact
    Flash or Smart Media devices.


    Today, many scanners, cameras, and printers use the Universal Serial Bus (USB)
    port. Before you buy a USB scanner, however, check to make sure there is a supporting
    driver for Linux! Some scanners are supported by the USB scanner kernel module,
    while others require a stand-alone application in order to acquire documents.
    One great place to check before you buy is http://www.linux-usb.org, which lists
    the status of many drivers, along with user feedback on how well the drivers work.


    Along with a driver, you will also need a client that provides either a command-line
    interface or a graphical interface with traditional controls, such as previewing,
    cropping, contrast, brightness, or color adjustment. In this arrangement, the
    driver is known as a back end, while the client is known as the front end. The
    most popular Linux back-end and front-end software used for many scanners (and
    some cameras) is SANE (Scanner Access Now Easy) software, discussed next.


    # Using SANE


    SANE consists of a set of software libraries, configuration files, and one or
    more command-line or X front-end clients. These will include xscan, xscancimage,
    xscan (for cameras), and saned (which supports scanning over a network). The libraries
    and clients should be installed from your distribution''s CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'SANE''s device configuration files will be found under the /etc/sane.d or /usr/local/etc/sane.d
    directories. The configuration directory contains individual files for each supported
    device. For example, the Epson family of scanners will use the file epson.conf.
    This file contains settings that tell SANE what type of scanning system is used,
    and the proper device to poll when attempting a scan. If you have a USB Epson
    scanner, the entry will be:


    `usb  /dev/usbscanner`


    Before attempting to use your scanner, make sure that you have properly configured
    SANE for your system''s setup and scanner model. After configuration, SANE''s
    xscanimage client can then be used as a GIMP plug-in or a stand-alone program.
    xscanimage''s settings are stored in resource files under a directory named xscanimage
    in a directory .sane in your home directory. The settings files are xscanimage.rc
    (user preferences); devicename.rc (driver settings); and preview.devicename.ppm
    (the current saved preview image). Note that you do not have to edit these files
    at all; they will be saved when setting preferences when you run the scanning
    client.


    To use xscanimage as a stand-alone program start it from the command line, like
    this:


    `$ xscanimage &`


    Insert a document in your scanner and press Enter. When the main window appears,
    click the Preview Window button, and then click the Acquire Preview button as
    shown in Figure 13.4.


    After the image is previewed, click and drag to crop the portion of the image
    you wish to scan, then click the Scan button. Use the different controls, buttons,
    and menus to set the type of scan, resolution, brightness, and contrast.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_325_0.png)


    **Figure 13.4** *The xscanimage client offers convenient controls and an image
    preview window.*'
