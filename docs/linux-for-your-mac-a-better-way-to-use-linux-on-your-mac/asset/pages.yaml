    # Using the tar Command


    The tape archive, or GNU tar command is one of the most popular archiving and
    compression programs in existence. Similar to other compression utilities, such
    as StuffIt for Mac OS or WinZip for Windows, tar is used by many different Linux
    distributions and programmers in order to distribute archives of programs, source
    code, and other documentation.


    As a system administrator, you can use the tar command for backup operations by
    copying users'' directories or entire filesystems to removable media, such as
    tape drives, hard drives, or remote storage devices. By combining the output of
    the find command with tar''s archive building, you can quickly devise software
    tools to back up your system according to file timestamps, size, or ownership.


    For example, to back up all files under the /home directory, you can use tar (as
    root) like this:


    ```

    # tar cvzf /mnt/remotehd/home.tgz /home

    ```


    This command line will create a gzip tape archive named home.tgz under the /mnt/remotehd
    directory. To only archive files that have changed in the last day, use the find
    command to feed tar a list of filenames like this:


    ```

    # find /home -mtime 1 -print | tar cT - ->mnt/remotehd/home01.tgz

    ```


    In this example, the find command returns a list of all files that have changed
    in the last 24 hours. This list is piped into the tar command, which then creates
    a compressed archive of the directory''s contents with the name home01.tgz.'
