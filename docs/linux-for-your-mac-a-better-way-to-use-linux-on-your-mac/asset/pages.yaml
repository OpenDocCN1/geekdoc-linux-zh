    features, such as a free license (GNU GPL), a goto-line command, case-sensitive
    searches, interactive search and replace, editable Tab columns, and commands to
    toggle features interactively. This program may be down-loaded in source or binary
    form from http://www.nano-editor.org, and works with all Linux PPC distributions.


