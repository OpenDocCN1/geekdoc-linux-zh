    while wholescale arguments and debates on a subject by hundreds of people is a
    *religious war*.


    Linux comes with more than enough Usenet software tools to get you into trouble
    on Usenet! Overall, however, most Linux users in the smaller newsgroups, such
    as `comp.os.linux.portable`, are quite civilized and helpful; it is the advocacy
    groups that seem more vocal. If you are civil, specific, to the point, and respond
