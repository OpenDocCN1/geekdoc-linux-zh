    # ## Regular and Extended Expressions


    If you are new to Linux, you may not have much experience in using wildcard characters
    or search patterns in a task known as using *regular or extended regular expressions*,
    or *globbing*. You will use these expressions on the command line in conjunction
    with searching, editing, and navigation commands, such as `ls`, `find`, and `sed`.
    You will also use them with the `grep` family of commands: `agrep`, `egrep`, `grep`,
    and `fgrep`.


    There is not enough room in this chapter (or book) to fully cover using these
    commands and expressions. For the most part, many Linux users are quite content
    to learn simple uses for regular expressions, such as `,` to match all characters,
    `?` to match three characters, or extended regular expressions like `*[a-z] [0-9]*`
    for matching embedded letters and numbers.


    More complex, extended regular expressions, use general-purpose search characters.
    These are known as *metacharacters* and are used for crafting search expressions;
    *quantifiers* (single or multiple character-matching expressions), *anchors* (positional
    characters, such as specifying the beginning or end of a line), *escape characters*
    (for specifying end-of-line, carriage-returns, etc.), and *alternation* (which
    provides for Boolean logic).


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_123_1.png)


    > For a simple introduction to using regular expressions, read the `ed` or `grep`
    manual pages, where you will find different examples and uses for complex search
    strings.


    The best way to learn how to use expressions in searching is to read a command''s
    manual page, and to practice. While the `ls` command can use expressions for searching,
    you''ll find meatier tasks when searching through text files using one or more
    `grep` commands. While the `grep` and `fgrep` commands may be used for sophisticated
    searches, the most complex and capable family member is the `egrep` command.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'The difference between the grep commands may not be readily apparent unless
    you are familiar with each command’s capabilities. For example, the egrep command
    is easily suited to the task of finding simple strings in files. For example:


    ```

    $ cd /usr/share/doc/howto/en

    $ egrep "(d)" *

    ```


    UPS-HOWTO: (d) DSR and DCD are dropped to zero -> power has failed and


    In this example, the egrep command is asked to display all lines from files with
    the matching string (d). If you try the same match using the egrep command, you
    will get thousands of screens of text! Why? Because the egrep command uses a different
    syntax, and must use extended expressions. The correct egrep equivalent command
    line is:


    ```

    $ egrep "\(d)\)" *

    ```


    In this example, the parentheses are properly escaped. Since the search is only
    for one character, the line could also be written:


    ```

    $ egrep "[d]" *

    ```


    Some of the constructs used to build expressions include:


    | `pat$` | Match pat at the end of a line |

    | `[-z]` | Match starting character in range |

    | `*` | Match any character |

    | `\x` | A character such as ? or \ |

    | `^pat` | Match pat at start of line |

    | `.` | Match single character |

    | `?` | Match single character |

    | `{str}STR}` | Match string str or STR |

    | `{ABC}` | Match A, B, or C once |

    | `*[a-z]` | Match ending character in range |

    | `[a-z]` | Match character in range |

    | `XYZ]+` | Match X, Y, or Z at least once |

    | `{n}` | Match previous character n times |



    Another document describing regular expressions is found in the regex manual page
    (to read the document, type man 7 regex and press Enter).'
