    # # How to Use the Shell


    This section introduces some basic concepts about using the shell, and offers
    examples that demonstrate some features of using a shell with Linux. You will
    learn how to share information between commands, create data on the fly, start
    programs in the background (in memory), and recall or kill programs running in
    the background. You will also learn how to use wildcards, or regular and extended
    expressions, which are a form of search syntax used on the command line.


    The basics of using a shell can be quickly mastered in a few sessions; however,
    exploring advanced techniques and crafting creative command lines will require
    more experimentation.


    # ## Input and Output Redirection


    Under Linux, nearly every object is a file (including directories and devices).
    This includes the stream of information flowing into (the standard input, or stdin)
    and out of (the standard output, or stdout) commands or devices. The standard
    input can be your keystrokes, the contents of a text file, a graphic image, or
    data streaming in from a modem via a serial port. It can also be digital data
    in the form of audio or'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'video, or a delimited (or specifically truncated) value. The standard output
    is used to redirect, forward, store, append, or discard data. Error messages from
    commands may also appear on a form of standard output known as `stderr`, or standard
    error. Input and output redirection with the shell is accomplished by using specific
    operators, such as `>`, `>>`, and `<<`.


    # ## Using the Output Redirection Operator


    For example, you can quickly create a text file containing a list of the current
    contents of your home directory by using the `ls` command, the output redirection
    operator `>`, and the pathname or file name like this:


    ```

    $ ls >mydirectory.txt

    ```


    In this example, the file `mydirectory.txt` will be created if it does not exist
    (or it will overwrite and replace any file with the same name), and will contain
    a list of visible files in the directory. Why will it contain only the visible
    files? Because any file with a name beginning with a period (.) is deemed invisible
    by default by the `ls` command. To get an entire list, use the `ls` command’s
    `-a` (list all) command-line option like this:


    ```

    $ ls -a >mydirectory.txt

    ```


    In this example, the file `mydirectory.txt` will be deleted if it exists, or created
    if it does not exist, and will contain a list of all files in your home directory.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_117_0.png)


    > Be careful using output redirection! Use of this operator will quickly and silently
    overwrite files without warning. Always make sure you know where and what you
    are directing output to. This will help you avoid erasing existing files!


    # ## Appending Data


    Data can be added to the end of a new or existing file by using the append operator,
    `>>`. For example, you can quickly build a list of names and phone numbers by
    using the `echo` command and the append operator like this:


    ```

    $ echo "Deb Cohen (607) 555-1212" >>phones.txt

    ```


    This example will append the information between the quote marks (`"` ) up to
    the end of the file named `phones.txt`. If you used the output redirection operator,
    the current file would have been deleted if it existed, and replaced with the
    new information.'
  merge: -1
  img_proc: true
