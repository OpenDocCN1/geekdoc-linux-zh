    # Using Pipes


    One of the most important features added to the shell is the ability to use pipes,
    which are defined by the bar (|) operator. The ability to "pipe" the output of
    one program into the input of another program forms the basis of the UNIX philosophy,
    which is to use small programs that do one thing well and work together with all
    other programs.


    Although you have seen how to redirect input and output to and from commands and
    files, the true power of the shell becomes apparent when you can combine the output
    of one program to create input for another program and so on. This is done in
    order to build new commands or files. Many Linux commands also have the ability
    to work with pipes and filter input to provide a changed output.


    For example, you can search your system to find all files named **README** under
    the /usr directory by using the find command like this:


    ```

    $ find /usr -name README -print

    ```


    After you press Enter, a list of pathnames may scroll down your screen. You can
    then send the output of the find command to the input of the xargs command (using
    the cat command in this example) to list each file:


    ```

    $ find /usr -name README -print | xargs cat

    ```


    The result will be a single output of all the text contained in all the README
    files on your system. Is this useful? Perhaps it is not yet as useful as it will
    be. You can then add the tr command to take the output at this stage:


    ```

    $ find /usr -name README -print | xargs cat | tr " " "\n"

    ```


    The input stream to the tr command is then broken up by having each space found
    in every line of text turned into a carriage return. The result is a long list
    of words. This stream can then be manipulated by sorting with the sort command
    like this:


    ```

    $ find /usr -name README -print | xargs cat | tr " " "\n" | sort

    ```


    The result is a sorted list of words having many duplicates! In the grand UNIX
    tradition, there is a command to remove adjacent duplicate lines in a file, *uniq*:


    ```

    $ find /usr -name README -print | xargs cat | tr " " "\n" | sort | uniq >dict.txt

    find: /usr/share/doc/packages/gettyps: Permission denied

    find: /usr/share/doc/packages/smeifl: Permission denied

    ...

    ```'
