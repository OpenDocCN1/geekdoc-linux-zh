    | Y | Y | Comma-separated value (CSV) |

    | Y | Y | ASCII |

    | Y | Y | eXternal Data Representation (XDR) |

    |  | Y | Hypertex Markup Language (HTM1) format |

    |  | Y | LaTeX document format |

    |  | Y | .tbl (table) format |'
  merge: -1
