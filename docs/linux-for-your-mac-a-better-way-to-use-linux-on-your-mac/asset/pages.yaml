    ```


    You can also create short text files with the `cat` command by using input and
    output redirection at the same time, like this:


    ```

    ```

    $ cat >foo.txt

    This is a line of text

    in a file named

    foo.txt!

    ```

    ```


    In this example, the `cat` command waits for its input from the standard input,
    or the console. After typing in the last line and pressing Enter, you then press
    `Ctrl+d` to signify the end of the file and close the new file. Another way to
    specify the end-of-file character is to use another input redirection operator
    known as the `here` operator. Using the previous example, instead of typing `Ctrl+d`
    to end the file, you can specify a delimiter, such as a string of Zs, like this:


    ```

    ```

    # cat >foo.txt <<ZZZ

    This is a line of text.

    This is another line of text.

    Lookout! "Here" comes the end of the file!

    ZZZ

    ```

    ```'
