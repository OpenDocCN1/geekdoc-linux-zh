    # Other Calculation Commands


    You will find other calculation commands included with your Linux distribution.
    These include graphic calculators, such as *xcalc*, KDE’s *kscalc*, and the GNOME
    calculator, *gcalc*. Command-line calculators include the *units* program, the
    *dc* calculator, and the *bc* calculating language interpreter.


    # Using teapot


    Michael Haarndt’s Table Editor and Planner, or *teapot*, is another console, or
    text-based spreadsheet that you can use for simple or complex calculations. This
    editor features an easy-to-use menu system, but also offers a sophisticated, three-dimensional
    calculation space that you can use to perform complex monitoring, calculation
    or data hiding.


    Cursor movement is similar to that in *sc*, except that Ctrl+b is used instead
    of Ctrl+h to move the cursor left, or backward along a row. Calculations can become
    somewhat complicated, as most functions may require a third cell reference.


    The *teapot* editor, shown in Figure 12.17, also features an extensive list of
    import and export file formats.


    Table 12.1 lists the load and save spreadsheet formats supported by *teapot*.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_310_0.png)


    Figure 12.17 The teapot spreadsheet editor features three-dimensional calculation
    and supports a variety of import and export formats.


    # Using the xspread Client


    The xspread client is an X window version of the sc table editor, with an improved
    menu system, accessed by pressing the right-slash (/) key. This client requires
    an active X session, and may be started from the command line of an X terminal
    like this:


    ```

    $ xspread &

    ```


