- pgno: 499
  md: "# # The Definitive Guide to Using Linux* on the Macintosh*!\n\nYou already\
    \ have the best computer hardware available on the market. Now add one of the\
    \ best software solutions to your platform—Linux! Inside you'll find authoritative\
    \ advice that includes everything you need for installing, using, and configuring\
    \ the newest, hottest, and best-value software from SuSE*, LinuxPPC* and Yellow\
    \ Dog!\n\nBill Ball is the author of more than a dozen books about Linux. His\
    \ books have been published in more than a dozen languages and current titles\
    \ remain bestsellers in their category. He is a member of the Northern Virginia\
    \ Linux Users Group (NOVALUG).\n\n# ## Learn Faster\n\n+   - Successfully install\
    \ and configure Linux on your Mac*  \n+   - Choose the Linux distribution that\
    \ is best for you  \n+   - Increase your productivity with calendars, organizers,\
    \ and spreadsheet applications  \n+   - Learn how to interact with other operating\
    \ systems\n\n# ## Learn More\n\n+   - Master administration issues including permissions,\
    \ Internet security, and disk recovery  \n+   - Learn about the Linux command\
    \ line, text editors, and X11  \n+   - Choose and customize a window manager and\
    \ desktop environment  \n+   - Get the information that you need to efficiently\
    \ manage your filesystem\n\n![](img/1ea833f5a3e3c1547e3dd2891f52804a_499_0.png)"
  merge: -1
  img_proc: true
