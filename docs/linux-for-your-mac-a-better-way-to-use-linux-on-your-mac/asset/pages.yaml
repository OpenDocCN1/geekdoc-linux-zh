- pgno: 220
  md: '# ## Web-Browsing


    Browsing the Web is generally a no-brainer for most savvy Internet users, and
    using the Netscape Navigator component of Communicator is generally the same across
    every supported platform. However, if you are new to Linux, you may not know that
    Communicator has many different command-line options, and can be launched in many
    different ways. For example:


    +   - -component-bar Displays a small, floating toolbar launcher

    +   - -composer Or -edit Opens Communicator to its Web-page editor

    +   - -messenger Or -mail Launches Netscape Messenger for electronic mail

    +   - -discussions Or -news Launches Netscape Discussions for newssreading


    For example, if your desktop space is at a premium, launch Netscape from the command
    line, like this:


    ```

    $ netscape -component-bar &

    ```


    After you press Enter, you will see a small floating toolbar, as shown in Figure
    9.11. Click on a component in the toolbar (shown in Figure 9.11) to launch the
    desired component. One of the first things Mac OS users will notice when using
    Netscape the difference between Mac OS and Linux and X11. In Mac OS the menu bar
    is embedded in the top menu bar of the desktop, whereas under Linux and X11, each
    window has its own menu bar and menus. When finished with a Netscape component,
    click the component’s File menu and select the Close menu item. You will still
    have access to Netscape’s components.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_220_0.png)'
