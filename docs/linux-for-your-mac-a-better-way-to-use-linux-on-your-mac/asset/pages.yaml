    # ## Customizing the Console


    This section introduces a number of ways you can customize the appearance of your
    console. You will see how to change your console’s fonts and color usage. If you
    spend a lot of time at the console, this can be a great way to reduce eyestrain
    and adjust your work environment.


    # ### Changing the Console Fonts


    When booting Linux to the text-only or console mode, most users accept the default
    font provided by the Linux distribution, which generally provides an 80-character
    by 25-line screen. Does this mean you cannot use other fonts? Certainly not!


    Nearly all Linux distributions come with 150 to nearly 200 different fonts that
    may be used with the console. You will find these fonts under the /usr/lib/kbd/consolefonts
    directory. Use the `setfont` command to immediately change the font used at your
    console. For example, if you would prefer a smaller font, try using the `alt-8x14`
    font (compressed, with a .gz extension) with the `setfont` command like this:


    ```

    `$ setfont /usr/lib/kbd/consolefonts/alt-8x14`

    ```


    You will find many different types of fonts available for your system.


    # Booting Console Fonts


    Intel-based Linux users can also change fonts by using the Intel-based Linux LILO
    command. However, this approach is not supported when using Linux on the PowerPC.


    # ## Changing the Console Colors


    The Linux console recognizes a number of control codes and escape sequences that
    can be used to set the default background and foreground (text color) of your
    display. The default console uses white characters on a black background. However,
    if you would prefer to use green characters with a black background, use the `echo`
    command, its `-e` option, and the magic sequence like this:


    ```

    `$ echo -e ''\033[32m''`

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'After you press **Enter**, your characters will now be in green. To make this
    the default color scheme for your session, again use the `echo` command, but like
    this:


    ```

    `$ echo -e ''\033[0m''`

    ```


    To go back to your default console, use:


    ```

    `$ echo -e ''\033[0m''`

    ```


    The `console_codes` man page details nearly all the codes you can use to change
    the color or cursor attributes for your console. For details on how to customize
    the default color settings used in the `ls` command when displaying files and
    directories, see the `ls` man page. In general, using the `LS_OPTIONS` or `LS_COLORS`
    environment variables enable this option.


    # ## How to Use Virtual Consoles


    When you use Linux in its console or text-only mode, you can jump to another login
    prompt and start multiple sessions or log in as another user. By default, most
    Linux distributions provide a Linux kernel that supports six login sessions, or
    *virtual consoles*. The consoles are numbered one through six, and represented
    by function keys one through six.


    Jumping to another virtual console is quite easy. Using SuSE Linux, press Cmd+F2
    to go to the second virtual console. Yellow Dog Linux users may have to press
    Ctrl+Cmd+2. To return to the original console, press Cmd+F1. Linux/PPC 2000 users
    may have to use the following `chvt` command:


    ```

    `$ chvt 2`

    ```


    After you press **Enter**, you will be at the second console, and will be presented
    a login prompt. After logging in, you can return to the first console by using
    the `chvt` command like this:


    ```

    `$ chvt 1`

    ```


    Using multiple logins is a handy way to run different text-based applications
    at once in full-screen mode on your notebook.


