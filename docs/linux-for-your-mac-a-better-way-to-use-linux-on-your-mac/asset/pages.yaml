    \ save -command save]\n> proc save {} {\n>     set f [open \"newFile.txt\" w];\
    \ puts $f [.t get 1.0 end]; close $f\n> }\n> ```\n> \n> This code snippet (modified\
    \ from a posting on the ma-linux@tux.org mailing list by Ktosowski) may be used\
    \ as a command. Save the code in a text file with a name such as `textit`, then\
    \ use `chmod +x` `textit` to make the file executable. These few lines of text\
    \ create a graphical editor with a moveable window and a Save button. All input\
    \ text will be saved in the file named `newfile.txt`.\n\n![](img/1ea833f5a3e3c1547e3dd2891f52804a_134_0.png)\n\
    \nThere is little point in listing all the features of a great text editor, but\
    \ some features to look for in a usable Linux text editor are listed in Table\
    \ 6.1.\n\nIf you find that a particular editor suits your tastes, you can choose\
    \ to make that editor the default system editor for Linux. The default system\
    \ editor is determined by the definition of the `EDITOR` environment variable,\
    \ which is recognized by a number of programs on your system, such as `cronTab`.\
    \ If you do not define your own system editor, most commands will, by default,\
    \ use the `vi` editor. To use another editor, such as `nano` (see the sidebar\
    \ “pico or nano?” below), you can edit your `.bashrc` in your home directory,\
    \ and then add this line:\n\n```\nexport EDITOR=/usr/local/bin/nano\n```\n\nMake\
    \ sure that you type the correct and complete pathname to the editor! To use this\
    \ variable right away, re-read your `.bashrc` file like this:\n\n```\n$ . .bashrc\n\
    ```\n\nYou can also use `bash`'s `source` built-in command like this:\n\n```\n\
    $ source ./.bashrc\n```\n\nTo make these changes to the entire default system,\
    \ place the `EDITOR` definition in `/etc/profile`, `/etc/skel/.bashrc`, `/etc/csh.cshrc`,\
    \ or `/etc/cshrc`."
