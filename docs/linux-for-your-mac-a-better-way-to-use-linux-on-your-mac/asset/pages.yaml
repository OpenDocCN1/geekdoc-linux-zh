- pgno: 162
  md: 'Yet another way to configure X is to boot Linux using proper base video values,
    and then use a graphical configuration client that starts a "safe" X session.
    These video values are kernel arguments passed to the Linux kernel by BootX or
    yaBoot, and generally take the form:


    ```

    video=adapter:vmode:XX,cmode:XX

    ```


    The `adapter` keyword (such as `ayfb`) denotes the type of graphics chipset used.
    The `vmode` setting is a one- or two-digit value (in the range of 1-20) that corresponds
    to a resolution. The `cmode` setting is a one- or two-digit value (8, 15, 16,
    24, or 32) that corresponds to a color depth. These video settings may also be
    accomplished after Linux boots by using the `fbset` command.


    You can also use XFree86 version 4.0''s (or newer) X server to configure settings.
    And if all else fails, you can manually create your own configuration file (because
    it is a text file).


    > It is generally not a good idea to use someone else''s `XF86Config` file unless
    you use it for a matching video card and monitor combination. iBook and PowerBook
    users can share configuration files between same model notebooks.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_162_0.png)


    If you craft your own `XF86Config` file, there is a template file named `XF86Config.eg`
    located under the `/usr/X11R6/lib/X11` directory (you can read the sample for
    example entries). Manually creating your own `XF86Config` file can be challenging
    if you are new to X!


    # Using the xf86config Command


    The `xf86config` command is a text-based console application included with XFree86
    and every Linux distribution. It can be used to configure a working `XF86Config`
    file. This command is a menu-driven program that uses various databases of monitors
    and video cards, which are installed under the `/usr/X11R6/lib/X11` directory
    to provide choices during the configuration process. You must be the root operator
    in order to configure X to work with your system. Start the `xf86config` command
    like this:


    ```

    # xf86config

    ```


    After you press Enter, you will start answering questions to configure X. You
    will be asked about your pointing device (mouse), keyboard, monitor, video card,
    desired color depth, and desired resolution. Be sure to have your equipment''s
    manuals on hand, along with technical specifications for your graphics hardware,
    pointing device, and monitor.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Most seasoned X11 users use a three-button mouse for their X sessions. The
    mouse buttons are referred to as left, middle, and right (or 1, 2, and 3). They
    are used for selecting, clicking, highlighting, pasting, and special actions.
    PowerPC Linux users with only a one-button mouse (such as iBook or TiBook users)
    must remap two Fkeys to simulate the middle and right mouse buttons. This can
    be done for ADB pointing devices by passing kernel arguments before Linux boots,
    or in the case of a USB mouse, by echoing certain values to the system''s USB
    device process directory. For example, Yellow Dog Linux iBook users can use the
    kernel argument (passed via BootX or yaboot.conf), ADB buttons=103, 111, which
    maps F11 and F12 to the middle and right mouse buttons. Linux PPC 2000 Q4 maps
    Fn+Ctrl and Fn+Option to the middle and right mouse buttons. PowerPC Linux users
    with a USB keyboard can use:


    ```

    ```

    echo "1" > /proc/sys/dev/mac_hid/mouse_button_emulation

    echo "87" > /proc/sys/dev/mac_hid/mouse_button2_keycode #F11

    echo "88" > /proc/sys/dev/mac_hid/mouse_button3_keycode #F12

    ```

    ```


    These lines map F11 and F12 to the middle and right mouse buttons. TiBook users
    can change the values 87 to 68 and 87, because F12 alone is a Mac OS media eject
    key and cannot be used for emulation. In this case, F12 and F11 are mapped as
    the middle and right mouse buttons—much better alternative than using Fn+Ctrl
    or Fn+Option, because these keys are needed to halt or escape a currently running
    X session!


    When you have finished configuring X, a new XF86Config will be written by default
    in the /etc/X11 directory. You can, however, choose to have the file saved anywhere.


    # ### Using Xconfigurator


    LinuxPPC 2000 Q4 and Yellow Dog Linux include the Xconfigurator command, which
    can be used with or without X11 to create a working XF86Config file. This command
    provides a graphical, menu-driven interface for configuring X on your system.
    Again, you must be the root operator in order to configure X for your system.
    Start the Xconfigurator command like this:


    ```

    ```

    # Xconfigurator

    ```

    ```


    After you press Enter, you will see its initial dialog box, as shown in Figure
    7.1. Use the Tab key to navigate through dialog box buttons, the Up and Down cursors
    to scroll, and the spacebar to select or unselect menu items. When you have finished
    using the program, a new XF86Config will be saved in the /etc/X11 directory (This
    is the same as the xf86config command).'
