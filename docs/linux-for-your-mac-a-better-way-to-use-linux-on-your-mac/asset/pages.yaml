- pgno: 140
  md: 'j`ed`, by John E. Davis. Like `vim`, this editor includes a version for the
    console (`j`ed) and another that works with X and your pointer.


    The `j`ed editor by default uses keyboard commands similar to those used by the
    `emacs` editor. But you can create custom keystrokes and command by editing its
    user''s resource file (named `.j`ed`rc` in your home directory. Copy the file
    `/usr/share/jed/lib/jed.rc` to your home directory as `.jedrc`, then edit to incorporate
    your changes.


    If you are familiar with computers and know who Mr. Peabody and Sherman are, you
    most likely remember the WordStar word processing program and the diamond, a use
    of the Ctrl key and the `e, r, a, s, d, f, x`, and `c` keys for cursor navigation.
    This system was eliminated by the introduction of the PC keyboard (the Caps Lock
    key is where the Ctrl key should be). You can now operate the diamond by using
    a Happy Hacking keyboard (which has the keys in the right place), and by starting
    `j`ed in WordStar mode. Do this by inserting the following command in your `.jedrc`
    home directory:


    ```

    "wordstar.sl"       evalfile    pop

    ```


    You can start `j`ed` from the command line of the console or an X terminal window
    like this:


    ```

    $ jed myfile.txt

    ```


    After you press Enter, the file `myfile.txt` will be opened for editing or created
    if it does not exist. To start the X version, `xjed`, type at the command line
    of an X11 terminal window like this:


    ```

    $ xjed &

    ```


    After you press Enter, you will see the `xjed` editor, as shown in Figure 6.3.


    When you launch `j`ed` in X mode, you can use your mouse to click on and activate
    its menu items.


    # # The Basics of emacs


    One of the most popular and powerful software packages installed on nearly every
    Linux system and available with every Linux distribution is Free Software Foundation
    founder Richard M. Stallman''s `emacs` text editor. Although a resource hog that
    can weigh in with a 30MB appetite for hard drive space, `emacs` has endeared hordes
    of Linux users and users of many other operating systems.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_141_0.png)


    **Figure 6.3** The *emacs* editor features drop-down menus and recognizes pointer
    movement and left-button (button 1) mouse-clicks.


    This popularity, of course, has spawned a legion of imitators and *emacs* clones.
    The original *emacs* editor from the GNU’s Not UNIX, project is known as **GNU**
    *emacs*. Another popular version is *xemacs*, a splinter version with some differences
    that is also included with nearly every Linux distribution. Like *vi*, you will
    find a version of *emacs* for nearly every operating system.


    What makes this editor so popular? Well, *emacs* is not just a text editor, it
    is an editing *environment*. You can use *emacs* as a text editor, a programming
    editor, a programming environment (used to write, compile, and test programs),
    a productivity application (with a diary, calendar, and appointments), an Internet
    tool (used to compose, send and receive mail, and read Usenet news), and even
    Web-browse. On top of all this, *emacs* can also be used to play games!


    Much of this power comes from the internal Lisp programming language interpreter
    built into the editor. You will find that many different contributors have written
    small loadable programs that add features to *emacs*. The most popular add-ons
    then become part of the standard distribution from the GNU Project.


    Some users have criticized the *emacs* editor for doing too much and for using
    cryptic and convoluted keystrokes to accomplish simple editing tasks. While it
    is true that *emacs* responds to an incredible number of commands, you can use
    *emacs*, like *vim*, by learning just a few initial key combinations to accomplish
    basic editing tasks. For example, to create or edit the file *myfile.txt*, start
    *emacs* on the command line like this:


    ```

    $ emacs myfile.txt

    ```'
  merge: -1
  img_proc: true
