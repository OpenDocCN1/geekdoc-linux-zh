- pgno: 192
  md: 'Pick a session type using the Up and Down arrow keys, then click the Load Session
    button to launch your previously saved custom session. This is a powerful way
    to "remember" or organize your X sessions and keep track of what applications
    were in use. Using a session manager can also save time and effort if you have
    several different clients launched at the same time. Note that session-management
    is a staple feature in the KDE and GNOME desktop environments; xsd is only required
    for older window managers without session management.


    Also, nearly every distribution includes a file (which is actually a shell script)
    named .Xsession, but it is employed when you use the xdm display manager to log
    into Linux and X. This shell script is used to configure and set up the login
    screen and dialog box. Although .Xsession has nothing to do with xsd, it may,
    especially on some Red Hat-based distributions, create a file named .Xsession-errors
    to log errors encountered while using X, and execute window managers and clients
    found in the home directory’s .Xsession file.


    # ## Yet More X Files!


    You may also find an .Xclients file in your home directory. This file, along with
    its system-wide counterpart xclients (possibly found under the /etc/X11/xinit
    directory), can be used like .Xinitrc to launch specific X clients. Another file,
    named .xauthority, is used to store authorization records when you log into X
    using a display manager.


    # # Using X11 Terminal Clients


    As you use the Linux console, you will become more proficient at using the shell.
    Using the shell during an X session requires the use of a terminal client (although
    KDE’s Konsole client may be used for one-line commands). As with the vast choice
    of shells for Linux, you will also have a variety of terminal clients to choose
    from during your sessions.


    Finding a terminal of choice may depend on your needs, personal tastes, or the
    client’s features. Nearly all terminal clients may be configured in some way to
    work a bit better, and nearly every window manager supports resizing of a terminal
    window so that it may fit more comfortably in your display area.


    Use a terminal window that is at least 80 characters wide by 25 lines high. This
    is the default for many console-based applications, and some screen-oriented commands
    may refuse to run or not work properly at a reduced window size. Some'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'terminals need special software libraries, and others may only work well or
    enjoy special features when used with a particular window manager.


    # Launching and Quitting a Terminal


    To launch a terminal client, click the appropriate menu item from your window
    manager''s desktop panel or root display menu. As you have seen, you can also
    arrange to have a terminal launch before your X session. Once the terminal has
    launched you can move your pointer to its window and start using the shell. Whether
    or not you have to click on the terminal window to make it active depends upon
    your window manager''s current focus policy settings.


    You can then use the shell to launch additional X clients, preferably in the background
    (as a process in memory), and then go back to work. This is accomplished by using
    the shell''s background operator, the ampersand (&), to launch a new instance
    of the xterm terminal. It is done like this:


    ```

    $ xterm &

    ```


    This approach detaches the xterm process from your shell command line, and the
    new xterm will be displayed in its own window. This is how you can (and most often
    should) launch nearly all graphical clients during an X session.


    Quitting a terminal session can be accomplished in a number of ways. If the GNOME
    or KDE terminal has a File menu, select the Quit menu item. You can also type
    exit at the terminal''s command line to close the terminal session. If the window
    manager provides window decorations such as a close box, then click the box to
    destroy the window. Finally, you can also use the shell''s kill command, along
    with a process ID number, to kill the terminal''s process (This is a messy and
    inconvenient, but is often a necessary way to close a terminal).


    # Selecting a Terminal


    You''ll find quite a few terminal clients included with PPC Linux. Some clients
    are part of the GNOME and KDE distributions, while others, such as xterm, are
    default terminals included with XFree86. Table 8.1 lists several X terminal clients
    included with most Linux distributions.


    Some of the features to look for when choosing a terminal are the terminal''s
    ability to handle scrolling, color, different fonts, emulate different terminal
    protocols, and perhaps the use of background images or a transparent background
    (to give the illusion of translucency).'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Table 8.1 **X Terminal Clients**

    | **Name** | **Description** |

    |---|---|

    | **aterm** | Afterstep X VT102 terminal emulator |

    | **cmdtool** | OpenWindows terminal shell |

    | **Eterm** | Enlightened terminal emulator for X |

    | **gnome-terminal** | GNOME X terminal emulator |

    | **konsole** | KDE terminal emulator |

    | **kvt** | KDE terminal emulator (based on `rxvt`) |

    | **nxterm** | Terminal emulator based on `xterm` |

    | **rxvt** | An X terminal emulator |

    | **wterm** | Window Maker terminal emulator |

    | **xfterm** | Script to launch terminal to read file or directory |

    | **xterm** | The XFree86 default terminal emulator |


    During your X sessions, you will most likely continue using the default terminals
    provided by your desktop environment. However, some Linux distributions, such
    as SuSE, will also offer the entire system’s suite of terminals in a Shell menu,
    usually off a panel menu. You can launch any terminal you like from the command
    line.


    # Setting Terminal Fonts


    When you use a KDE- and GNOME-compliant terminal, you will use menus and dialog
    boxes to change the terminal’s fonts, color scheme, or size (although some support
    undocumented command-line options). Other terminals require command-line options
    or other methods to alter or activate features.


    For example, by pressing Ctrl and the right mouse button (button 3), you can choose
    a new font size for the xterm client. Launch the terminal like this:


    ```

    $ xterm &

    ```


    The xterm window will appear on your desktop. If you press Ctrl, then click and
    hold down the right mouse button, a pop-up font menu will appear, as shown in
    Figure 8.2.


    Scroll, then release your mouse button on a desired font size. The xterm’s window
    will then resize to use the new font size.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_195_0.png)


    **figure 8.2**   *The xterm client''s fonts may be changed on the fly by using
    a pop-up menu.*


    Using command-line options is another way to force a terminal to use a specific
    font and font size. These command-line options, known as X Toolkit options, also
    allow you to specify foreground and background colors and other features, such
    as the window’s title. For example, to launch `xterm` with a lavender background
    and red text, use the `-bg` and `-fg` options like this:


    ```

    $ xterm -fg red -bg Lavender &

    ```


    You can also specify different fonts. For example, to launch a `xterm` with very
    large text, use the `-fn` option, followed by the name of a font, like this:


    ```

    $ xterm -fn 10x20 &

    ```


    After you press Enter, an extremely large terminal window will appear on your
    desktop!


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_195_1.png)


    > Color names may be found in the file `rgb.txt`, perhaps under the `/usr/X11R6/lib/X11`
    directory. You may also look for additional fonts under the `/usr/X11R6/lib/X11/fonts/misc`
    directory.


    # ## Keyboard Issues


    When you use X, you can reconfigure your keyboard or rearrange keys to suit your
    needs. For Macintosh users, figuring out what keys to use can be confusing, because'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'many X clients and applications may refer to the Alt or Meta keys. It is important
    to read the documentation for your *Linux* distribution to determine exactly how
    these and other keys are mapped by default when you use *Linux* or X11.


    For example, when using SuSE PCLinux with the Apple USB extended keyboard, each
    Option key is labeled "Alt." However, when using the emacs editor, the Cmd+x key
    combination is pressed to use the Meta key. Intel-based PCs running Linux use
    the Alt+x combination.


    # # Customizing the Keyboard


    Remap your keyboard using the xmodmap client. This client can be used to swap
    keys or load new keyboard layouts using the command line and a file named \.Xmodmap
    in your home directory. Entries in \.Xmodmap are known as *xmodmap expressions*,
    and are used to redefine keys or other X input events, such as mouse clicks. A
    system-wide default file named xmodmap may be found under the \\/etc\\X11 or in
    the case with SuSE PCLinux, under the \\/usr\\X11R6\\lib\\X11 directory.


    You can check current key definitions with the xev client, or X event client.
    Start xev from the command line of a terminal window like this:


    ```

    $ xev

    ```


    After you press Enter, its window will appear, as shown in Figure 8.3. To find
    the value for your Mac keyboard''s Cmd key, press the key. The values of the key
    press and its release will be displayed in your terminal. You then crosscheck
    this value by using the xmodmap with the -pk option like this:


    ```

    $ xmodmap -pk

    61    0xff1b (Escape)

    62    0xff1e3 (Control_L)

    63    0xff59 (Alt_L)

    ```


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_196_0.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: '64 Oxffel (Shift_L)

    65 Oxffe5 (Caps_Lock)

    66 Oxff7e (Mode_switch) Oxfff20 (Multi_key)

    67 Oxfff51 (Left)

    68 Oxfff53 (Right)

    69 Oxfff54 (Down)

    70 Oxfff52 (Up)


    Not all the output is shown here, however, the values returned (those from an
    Apple USB extended keyboard) correspond with the Ctrl and Caps Lock keys (values
    62 and 65). To swap these keys, you can enter the following in your .Xmodmap file:


    ```

    remove Lock = Caps_Lock

    remove Control = Control_L

    keysym Control_L = Caps_Lock

    keysym Caps_Lock = Control_L

    add Lock = Caps_Lock

    add Control = Control_L

    ```


    You can then put the change into effect by using the xmodmap client like this:

    $ xmodmap .Xmodmap

    After you press Enter, the keys will be swapped!


    > Another handy client is xkeycaps, which displays a graphic of your keyboard.
    This client has a database of more than 100 keyboards, and can be used to generate
    xmodmap expression files to remap your entire keyboard.


    # Pointer Issues


    This section is not about configuring your mouse for use with Linux, but about
    changing the visual representation of your pointer, and changing how your mouse
    button(s) work during your X session. The information presented here, especially
    concerning button reconfiguration, can make life a bit easier and a little more
    fun for you or users on your system.


    While the traditional pointing device for use during an X session is a three-button
    mouse, many Apple computers only come with a single-button ADB (Apple Desktop
    Bus), or USB (Universal Serial Bus) mouse or trackpad. Various tricks are used'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'in the console and X to re-map other keys (such as F11 and F12), or key combinations
    (such as Fn+Ctrl and Fn+Option), to the middle and right mouse buttons. For example,
    if you have a one-button USB mouse, you can use the following script to map the
    middle and right mouse buttons to your keyboard''s F11 and F12 keys:


    ```

    ```sh

    #!/bin/sh

    echo "1" > /proc/sys/dev/mac_hid/mouse_button_emulation

    echo "87" > /proc/sys/dev/mac_hid/mouse_button2_keycode

    echo "88" > /proc/sys/dev/mac_hid/mouse_button3_keycode

    ```

    ```


    The traditional mouse buttons are labeled 1, 2, and 3. The left mouse button (button
    1) is generally used to press buttons, click menu items, select objects, and close
    boxes. The middle button (button 2) is used to paste data between clients or when
    held down, to scroll through scrollbars. The right button (button 3) is used for
    Properties menus or other information in the root display.


    To demonstrate text copy and paste, first highlight text in one terminal window,
    then click the middle mouse button in another X terminal window. You can use this
    technique to copy URLs from a browser, paste commands into terminal windows, or
    move text between editing sessions.


    # ## Changing the Pointer


    The X pointer is the representation of your cursor when moving around the root
    window of your display or desktop. It generally changes to an “I” or text-editing
    cursor inside an active window. If you are a Mac OS user, you are probably familiar
    with a variety of pointers, such as the standard arrow and the animated watch.


    Changing the root display pointer for your X session is fun and easy. The X pointers
    have names that correspond to definitions in the file `cursorfont.h`, found under
    the `/usr/X11R6/include/X11` directory. To change your pointer, use the `xsetroot`
    client with its `-cursor_name` option, followed by the name of a cursor like this:


    ```

    ```sh

    # xsetroot -cursor_name gumbi

    ```

    ```


    After you press Enter, your pointer will become an old and familiar friend. To
    reset your cursor, use the default pointer’s name like this:


    ```

    ```sh

    # xsetroot -cursor_name X_cursor

    ```

    ```


    Use the `xfd` client and its `-fn` option, followed by the name, which allows
    you to view available cursors, like this:


    ```

    ```sh

    # xfd -fn cursor

    ```

    ```


    After you press Enter, you will see the cursors in a dialog box, as shown in Figure
    8.4.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_199_0.png)


    Figure 8.4  *The x11x client displays characters in X11 fonts.*


    Want to use a really big cursor during your X sessions? Browse to the site, http://www.linuxdoc.org/HOWTO/mini/X-Big-Cursor.html
    and read the X Big Cursor-HOWTO to find out how!


    # ### Changing Pointer Buttons


    If you use a three-button mouse but are left-handed, remap the mouse buttons using
    the `xmodmap` client. Use `xmodmap` and its `-e` and `pointer` options like this:


    ```

    `# xmodmap -e "pointer = 3 2 1"`

    ```


    After you press Enter, the buttons will be reversed.


    # ## Using X11 on a Network


    X was built from the ground up to work over a network. As you learn more about
    using Linux and the X Window System, you will find newer, faster, and more efficient
    ways to work over a network. This section introduces a few basic ideas you can
    use if you use a Macintosh running Linux on a network.


    Most PC users sit down at their computers, then launch and run programs from the
    computer’s hard drive. This is the only way to use Linux and X if the computer
    is not attached to a network. However, if the computer is on a network, you can
    log in at another computer on the network to do work.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'This book was developed and written using Linux running on a variety of computers,
    both Intel- and PowerPC-based models. Most of the work was done on an Apple G4
    Cube running SuSE PPC Linux. However, the word processor used for development
    was Sun Microsystems'' StarOffice, running on a headless (no monitor) home-built,
    Intel-based server. Work was accomplished using KDE 2.0 running on the Cube, while
    StarOffice was running in the X display. StarOffice, which has been released as
    open source, has yet to make a debut on PPC Linux. However, efforts at http://www.openoffice.org
    may soon bring about a version for the PowerPC, and a Mac OS version is planned
    for Summer 2001.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_200_0.png)


    When you use X11, the X server handles all display issues. This allows X to easily
    display programs running on remote hardware. This means that you can use clients
    locally, on hardware that may not otherwise support the client. This can be handy,
    especially if there are problems due to memory, hard drive or platform restriction.


    # Using the DISPLAY Environment Variable


    The DISPLAY environment variable has an in-memory value assigned to every instance
    of an X server on your computer, and contains a host name, a display number, and
    a screen number. You need to know this information if you want to use X effectively
    on a network.


    When you launch X and start your session, your DISPLAY will have this value:


    ```

    yourcomputerhostname:0.0

    ```


    If you examine the env command''s output, the variable could also look like this:


    ```

    :0

    ```


    or this:


    ```

    :0.0

    ```


    After logging into a remote computer using the telnet command, you should see:


    ```

    [bball@green bball]$ env | egrep DISPLAY

    DISPLAY=cubie.home.org:0

    ```


    Here you can see your local host name (cubie), display (o) and screen number (assumed
    to be 0, as none is shown). Remember, this refers to the local display, and not
    that of the remote host, which is named green. You can then sit down and launch
    a graphical client on the remote computer, such as the xv graphic utility, and
    it will appear locally on your display.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'The **DISPLAY** variable must be properly defined in order for remote applications
    to appear on your display. If not, you will see:


    ```

    [bball@green bball]$ xv

    xv: Can''t open display

    ```


    To fix this, use the remote shell’s facilities to create the correct **DISPLAY**:


    ```

    [bball@green bball]$ export DISPLAY=cubie.home.org:0

    ```


    This example (for the *bash* shell) will create the **DISPLAY** variable. You
    can then launch the remote client.


    # ## Using the xhost Client


    You must have a properly defined **DISPLAY** variable, and the remote host must
    have permission to display clients on your server before you log in! If permission
    has not been granted, and you log into the remote computer and try to launch a
    client, you will see something like this:


    ```

    [bball@cello bball]$ netscape

    Xlib: connection to "cubie.home.org:0.0" refused by server

    Xlib: Client is not authorized to connect to Server


    Error: Can''t open display: cubie.home.org:0

    ```


    In this example, the user *bball* has logged into the host named *cello* and attempted
    to launch *netscape* without authorizing *cello* access to *cubie.home.org*’s
    X server. To fix this problem, use the *xhost* command at *cubie* before logging
    into *cello* like this:


    ```

    [bball@cubie]$ xhost + cello.home.org

    cello.home.org being added to access control list

    ```


    After you press **Enter**, the user *bball* can then log into *cello* and launch
    *netscape*. After the remote session ends, you should then remove access, like
    this:


    ```

    [bball@cubie]$ xhost - cello.home.org

    cello.home.org being removed from access control list

    ```


    You can set your session to allow all hosts by using *xhost* without a hostname
    like this:


    ```

    $ xhost +

    ```


    To deny all hosts access to your session, use the *xhost* client with a minus
    (-) like this:


    ```

    $ xhost -

    ```


    Be careful when using the *xhost* command; you should only allow other hosts access
    to your session on a limited basis and for a limited time.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Remote Launching of Clients


    By combining proper access permissions and use of the `DISPLAY` variable, you
    can also launch a local client and have it available for use on a remote display.
    Use the -

    `display X` Toolkit option, along with the remote computer''s display name like
    this:


    ```

    [bbail@cube] $ xcalc -display cello:0.0 &

    ```


    In this example, the user `bbail` has launched the X calculator, `xcalc`, which
    will appear on the display attached to the host named `cello`. As you can see,
    using X on a network can be fun, flexible, and a great way to accomplish work.


