  md: '# # AbiWord Personal


    AbiWord is a free, open-source word processor that works on various computer platforms.
    This client, which requires an active X session, has many desired features present
    in modern-day word processors, but may also be used to edit text files. You can
    apply many different styles and formats to your text while editing, and AbiWord
    also has the ability to align text, perform spell-check, and convert word processing
    documents from other systems into text.


    You will find that AbiWord is included with most Linux PPC distributions. You
    can use this word processor to perform many essential text editing tasks. You
    can start abiword from the command line with an optional text filename like this:


    ```

    `$ abiword linusprc.txt &`

    ```


    After you press Enter, you will see abiword’s main window, as shown in Figure
    6.7


    This word processor should not be used to edit system configuration files, which
    are subject to breaking if reformed by line-wrapping in an editor. You can, however,
    adjust and control line-wrap in abiword by using the Format menu’s Paragraph menu
    item.


    # # KDE and GNOME Text Editors


    The KDE and GNOME software suites include a number of graphical text editors you
    can use during your X sessions. These editors vary in features and reliability.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_145_0.png)


    Figure 6.7 The AbiWord word processor is a fast-maturing client that can also
    be used as a text editor.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'but have steadily matured over the last several years. Each new version of
    these editors introduces new features and capabilities.


    These clients will generally be launched via the KDE or GNOME desktop panel. Table
    6.2 lists each editor’s name and a short description.


    The benefits of using these text editors during an X session is that many are
    drag-and-drop aware, work well in their designated environment (KDE or GNOME),
    and come with built-in help.


    # # Using nedit


    The nedit text editor is a graphical client for X11. This program has nearly every
    feature a system administrator, writer, or programmer desires in a text editor.
    Included with many Linux distributions, nedit provides extensive menus, line-number
    display, import and export of DOS-format text files, handling of international
    character sets, macros (compressed procedural shortcuts), sorting, electronic
    mail handling, programming environment features, and more.


    You can start nedit from the command line with an optional text filename like
    this:


    ```

    ```bash

    $ nedit linumpr.txt &

    ```

    ```


    After you press Enter, you will see nedit’s main window, as shown in Figure 6.8.


    Table 6.2 KDE and GNOME Text Editors


    | Name | Description |

    | :--- | :--- |

    | gedit | Compact GNOME text editor |

    | ghex | GNOME binary file editor |

    | glimmer | Sophisticated GNOME editing environment |

    | gnome-edit | Symlink to GNU emacS |

    | gnotepad+ | Advanced GNOME HTML and text editor |

    | kedit | KDE text editor with spell-check |

    | khedit | KDE binary file editor |

    | kwritE | KDE programmer''s editor |

    | moleskine | GNOME source code editor |

    | quanta | KDE HTML editor |'
