    It is recommended as a good place to start using a modicum of hard drive space.
    You can always install additional software later.


    +   Almost everything. You will need a bit more than 6GB of hard drive storage
    and more than an hour or two to install all the software packages. This is highly
    recommended if you have the hard drive space, want to do software development,
    and enjoy a rich assortment of games and other software.


    Note that these requirements are for SuSE Linux! Other distributions, such as
    Yellow Dog or LinuxPPC 2000, may only require 1.5GB for a full installation. You
    will also need to take into consideration the amount of hard drive space you will
    need for documents, graphics, or other personal projects. For example, electronic
    mail files can quickly grow to several hundred megabytes over the course of a
    year, especially if you have a high-speed Internet connection and send and receive
    large documents.


    # # Alternatives


    Intel-based Linux users can take advantage of a number of commercial software
    programs that emulate other operating systems. For example, you can use VMware''s
    emulator to run Linux in a window under Windows, or run Windows in a window during
    a Linux X session.


    Intel-based Linux users can also use Ardi''s Executor client to run some legacy
    Macintosh applications in an X window while running Linux. Ardi''s CarbonIce Copies
    application can also be used to bundle the emulator''s engine onto a Mac OS application
    to enable it to run under Windows, Linux, DOS, or OS/2. Fortunately, Mac users
    can can run Linux in a window while using the Mac OS. Connectix''s Virtual PC
    3.0 with Red Hat Linux offers several features not available in other emulators.
    One such feature is "Save State," which preserves the system''s state and allows
    you to stop or restart your Linux session without shutting down or rebooting.
    Copy and paste, in addition to several USB devices, are also supported.'
