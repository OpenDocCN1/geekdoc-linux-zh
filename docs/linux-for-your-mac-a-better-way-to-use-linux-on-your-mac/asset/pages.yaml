- pgno: 410
  md: 'In this example you can see that someone from **\*\*\*\*\*.org** tried three
    times to log into the system, but failed. You won''t usually get a clear hostname
    (only an IP address) if this happens on your system. You''ll also probably notice
    other users looking for open *ports*, or TCP/IP services in which to take advantage.


    # ## Firewalling Utilities


    If you use a DSL (*Digital Subscriber Line*) with Linux, you''ll find that Roaring
    Penguin''s *xp-pppoe* installer can also automatically configure a firewall ruleset
    for you. Other measures to take include installing an entirely separate Linux
    distribution, named *Trinux*, that can act as a firewall and software router for
    your LAN.


    Although not really a firewall utility, one helpful package that can help you
    detect a break-in or break-in attempts is *Marty Roesch''s* open source *Network
    Intrusion Detection System*, or *SNORT*. This software package is a network intrusion
    detection system, and will alert you to numerous types of probes or attacks on
    your system. There is a version available for *PPC Linux* through <http://www.snort.org>.
    You can then download the software, decompress and install it like this (as root):


    ```

    # tar xzf snort*tgz

    # cd snort*

    # ./configure ; make install

    ```


    You can then run the program like this (as root):


    ```

    # snort -Afull -C snort.conf

    ```


    This example command line uses a sample *snort.conf* file that contains your settings
    and rule-sets for watching your system. The SNORT package includes a sample set
    you can put to use right away. To see what is going on while SNORT is running,
    check its logs under the default log directory, */var/log/snort*.


    You should always check your Linux distribution''s home page for the latest bug
    fixes, errata, and upgrades. Many of the fixes involve security issues, that if
    undressed, can come back to haunt you.


    # # Samba


    Samba is a set of software utilities you can use to integrate your PowerPC Linux
    system in a Windows LAN or environment. Using various Samba commands, such as
    *smbmount*, you can then access files from remote servers, or by editing */etc/smb.conf*
    and running the Samba daemon *smbd*, offer up your Linux partitions as shared
    volumes.'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'Mounting a remote shared volume is easy when you use the **smbmount** command.
    If your system does not allow users to use the **smbmount** command, you can (as
    root) change permissions for the command like this:


    ```

    # chmod 4711 /usr/bin/smbmount

    ```


    This will allow your system''s users to mount remote shared volumes locally. For
    example, if a remote host named **gigi** has a shared volume named **public**,
    you can easily mount the volume (provided you have access as a user and password)
    like this:


    ```

    $ mkdir gigi

    $ smbmount //gigi/public gigi

    Password:

    $

    ```


    In this example, a directory is first created as a mount point (although any other
    mount point may be used). Next, the **smbmount** command is used with the pathname
    syntax containing the name of the remote host and shared volume. At the end of
    the command line is the local mount point. After pressing Enter and entering a
    password, the contents of the volume are available under the new local mount point.
    If you are concerned about granting your users access to running the **smbmount**
    command, then have any required remote public shares mounted at directories on
    your system with restricted access permissions.


    Configuring Samba to work with your system means editing (as root) the /etc/smb.conf
    file. Edit this file to tailor Samba for your LAN. For example, the **hosts allow**
    section:


    ```

    hosts allow = 192.168.2.

    ```


    This entry restricts access to hosts from the 192.168.2 subnet. You should also
    enable Samba passwords:


    ```

    security = user

    password level = 8

    username level = 8

    encrypt passwords = yes

    smb passwd file = /etc/smbpasswd

    ```


    These entries will require you to run the **smbpasswd** command to generate a
    user password. Finally, you should then define the shares you''d like to publish
    on your LAN:


    ```

    [homes]

    comment = Home Directories

    browsable = yes

    ```'
  merge: -1
  img_proc: true
