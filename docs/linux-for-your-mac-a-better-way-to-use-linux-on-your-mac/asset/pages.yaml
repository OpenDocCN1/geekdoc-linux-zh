- pgno: 24
  md: '# Introduction


    Welcome to *Linux for Your Mac*. This book is an introductory guide to choosing,
    installing, using, and managing Linux on your PowerPC Macintosh computer. You
    will find this book full of useful tidbits, tricks, and tips you can use when
    first choosing the path to Linux.


    This book is written with the beginner in mind. You will find insights on shifting
    from the Mac mindset to expounding on the command line interesting, helpful, and
    timesaving. You will soon be able to make Linux work effectively for you. If you
    are an advanced user and want to explore more technical territory, then details
    about the X Window System, and/or how Linux interacts with your Apple hardware
    may prove to be more useful for you.


    If you have an original 6100, 7100, or 8100 Mac, you will find that most of the
    material about Linux can be applied to the MkLinux release. However, this book
    focuses on the latest versions of the Yellow Dog Linux, LinuxPPC, and SuSE PPC
    Linux distributions of Linux for PowerPC Macs. These latest distributions enable
    Linux to run on G4 Macs, such as the Cube and the latest G4 PowerBooks, as well
    as on multiprocessor desktop G4s.


    The Macintosh models supported by these Linux distributions are divided into “OldWorld”
    and “NewWorld” Macs. OldWorld Macs begin with the first PowerPC models that supported
    PCI slots and had supporting Mac OS routines in read-only memory (ROM). The advent
    of NewWorld Macs begin with the use of CHRP (*Common Hardware Reference Platform*)
    specification design and have the Mac OS in a ROM file in the System Folder. According
    to Apple, the NewWorld architecture also includes big changes in memory handling,
    hardware addressing, interrupts, and video. This book will help you get your Old
    or NewWorld Mac working with the three most popular distributions of Linux available
    for PowerPCs.


    Using Linux (pronounced “lih-nuxs”, as in *linen*) is fun! Only in rare circumstances
    can you hurt your hardware by trying *Linux*. Armed with backups in hand or on
    the shelf you can confidently take the plunge and begin what will be a long relationship
    with Linux.


    This book introduces the new user (“Linux newbie”) to the language and lingo of
    the GNU (pronounced “guh-new”) generation. In no time at all you will be competent
    in the use of one of the newest and hottest operating systems to hit the personal
    computer market in years. This book also helps you understand fundamental concepts
    about Linux and dispels ungrounded myths.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'On one hand, Linux is the *kernel*, or core of the operating system. On the
    other hand, however, a *Linux distribution* is the kernel, along with thousands
    of specially chosen programs and a vendor-specific installation scheme or software
    installer. Therefore, it does not make sense to ask, “What is the best Linux to
    use?” Rather, one should ask, “What Linux distribution is right for me?” It is
    important to remember that all distributions are in essence the same; they all
    use a *Linux* kernel.


    # **C’mon, Be Honest Here!**


    Not all distributions are the same. They may use or include different or more
    than one Linux kernel. You will also discover that distributions will differ in
    the location and names of important files and directories. At the time of this
    writing, each Linux distribution for the PowerPC provides different methods and
    graphic clients for a number of administrative tasks. However, many major software
    packages are the same across distributions. You will generally find more commonality
    than disparity across distribution lines.


    It is important to understand the difference between Linux and its graphical interface,
    which is provided by The XFree86 Project’s distribution of the X Window System.
    You can install and run Linux without a graphical interface, or the *X Window
    System*. A great percentage of computer servers running the Internet certainly
    do. When you use Linux without a graphical interface, you are using it in text-only,
    or *console* mode. This is how Linux started out. Many early users quite happily
    used the first Linux releases without a graphic interface for nearly a year until
    program-mers finally ported the X Window System and got it to run with Linux.


    Another important distinction is that the graphical interface for Linux, XFree86,
    is a port of The X Window System. The X Window System, referred to as X11R6, X11,
    or more simply, X, is not Linux! X consists of thousands of files including fonts,
    graphics, and software libraries. It is a separate addition to your Linux distribution,
    but is not crucial to a successful Linux install. X is, however, critical to enjoying
    a graphical desktop environment and for some users it is even more important than
    support for sound.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_25_0.png)


    > It is important to remember that X11 should never be referred to as the “X Windows
    System”.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_25_1.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Lastly, an important point to keep in mind is that although Linux is free software,
    not all the software included with a Linux distribution is free. You should always
    check the software''s documentation for licensing or copyright terms. The exception
    to this rule is the Debian Linux distribution, which includes only free software.
    The term, "free software" means software that is distributed under the GNU General
    Public License, or GPL. This license, created by the venerated author of the emacs
    editing environment, Richard M. Stallman, provides a kind of "copyleft" agreement
    under which software must be distributed in source code form. The original authors
    retain copyright, while ownership is delegated to anyone possessing the software
    (under the license''s "freedoms"). The agreement mandates that the software must
    forever be available in source code form. This concept contrasts with the more
    recent "open source" definitions of software, which often allow for distribution
    of software in source code form, but may be more restrictive in terms of freedom
    of use.


    # ## What Is Linux?


    As previously mentioned, Linux is the kernel of the operating system. Linux was
    first developed and released to the world over the Internet on Oct. 5, 1991 by
    Linus B. Torvalds, then a grad student at the University of Helsinki, Finland.
    Developed from the ground up and from scratch, Linux is free of any AT&T legacy
    UNIX code, but has inherited the best features and software from SysV UNIX and
    the Berkeley Software Distribution UNIX, or BSD. After one initial version, Torvalds
    then released Linux under the GNU GPL. The ramifications of this approach to licensing
    and distribution, combined with the explosive growth of the Internet and interest
    by thousands of programmers worldwide is now clear. While the open source release
    of the excellent BSD UNIX was mired in lawsuits and the courts, Linux grew leaps
    and bounds in features and its user base.


    When installed (usually under the `/usr/src/linux` directory), the source code
    to Linux consists of nearly 7,000 files and more than 2.6 million lines of documentation,
    comments, and C language. When compiled and loaded at boot time, the Linux kernel
    can be anywhere from less than one-half a megabyte to nearly three megabytes in
    size.


    A Linux distribution can be as small as the contents of a 1.44MB floppy diskette,
    or take up more than five gigabytes of compressed files on a DVD-ROM. The system
    being used when writing this introduction (an Apple 450MHz G4 Cube running SuSE
    PPC 7.0), consists of more than 170,000 files, which includes 25,000 `.html` documents,
    3,200 `.txt` files, 3,411 man documents, 3,000 programs, 33,800...'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'graphics, and more than 1,000 fonts. Even considering the system''s paltry
    20GB hard drive with eight gigabytes dedicated to Mac OS 9.0.4, this still leaves
    nearly six gigabytes of free disk space after a huge Linux installation!


    # # Why Use Linux on Your Mac?


    Although originally designed to run as a small desktop operating system, Linux
    now provides many features that rival or exceed those of other operating systems.
    For Mac users, Linux is a free, alternative operating system with features that
    were previously available only through ridiculously expensive and now outdated
    commercial software. Even with the availability of BeOS (except for G4 Macs),
    and the advent of Mac OS X, Linux still provides the following important features
    and advantages:


    +   *   Linux is licensed under the GNU GPL. This means that there are no royalty
    or licensing fees. Unlike other operating systems, you get the source code for
    the kernel and nearly every command, program, application, or client included
    in a distribution.


    +   *   Linux provides a feature-rich development platform with the world''s best
    selection of programmer''s tools. This means that you can use your Mac to develop
    programs that will run on a variety of computer platforms, including hand-held
    PDAs, embedded devices, and Intel-based PCs.


    +   *   Linux is unparalleled in its networking compatibility, and is able to
    support nearly every network protocol in existence. This means that you can use
    your Mac to provide network file system and printing support for Windows-based
    networks.


    +   *   Linux works well as a server platform, and when combined with the superior
    speed and capabilities of the PowerPC processor, your Mac provides quite a bit
    of punch for the task.


    +   *   Linux attracts nearly all GPL and open source programming projects. This
    means that if you are looking for a solution to a computing task, chances are
    someone has already started working on a possible solution.


    +   *   Linux is stable, robust, and reliable. You are the one in control of your
    operating system. When properly set up and used, Linux works reliably in production
    environments.


    +   *   Linux is well supported. Linux comes with more documentation and available
    support than any other operating system. You can even purchase commercial support.
    There are also several message boards and news groups dedicated to Linux and Linux
    for PowerPC computers.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   • Linux uses X. X11 is a networking graphical interface. From the beginning,
    it was designed to support thousands of users on large networks. You will benefit
    from its capabilities as you learn to use Linux and X.


    +   • Linux is constantly being upgraded. Although there are classic stable releases,
    Linux is constantly in a state of flux as new features are added nearly every
    day or week. If you need a specific new feature, you can always try the latest
    and newest version, or simply wait until the feature appears in a stable release.


    +   • Get the best of both worlds. You can boot both Mac OS and Linux on your
    Macintosh computer. You can use either BootX or Yaboot to configure your Mac to
    start up with Mac OS, Mac OS X, or Linux. You can also share files between the
    Linux and Mac hard disk partitions.


    # ## Features and Conventions of This Book


    This book is designed in four parts. Part I, “Getting Linux on Your Mac,” expounds
    on the subject of learning about Linux, choosing a distribution, post-installation
    configurations, and booting Linux. Part II, “Using Linux and X11 on Your Mac”
    launches into detailed information concerning the Linux command line, text editors,
    and X11. Part III, “Administering Linux on Your Mac,” discusses the technical
    details of taking care of your system. This is an important task because you,
    in effect, become a system administrator when you install Linux! Part IV includes
    using Linux and various emulators, interacting with other operating systems, and
    playing games.


    Also, **boldface** text is used throughout the book to help you better understand
    some of the command lines and code listings. In each example in which you would
    type or enter text, the text has been *formatted in boldface*. Additionally, if
    a command only works for the system superuser, known as the **root** operator,
    the command is shown on a command line prefixed with a pound sign (#). Normal
    user operations on the command line are prefaced with a dollar sign ($).


    I hope you enjoy reading and using *Linux for Your Mac*. Consider this book a
    companion guide to your favorite PowerPC Linux distribution, and let me know if
    you have comments, criticisms, or suggestions (flames will be sent to /dev/null).


    Billy Ball

    bball@tux.org'
  merge: -1
  img_proc: true
