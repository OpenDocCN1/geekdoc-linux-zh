    There are many different editors available for the Linux console and the X Window
    System. The first half of this chapter will discuss editors that may be used with
    or without an active X session. You will then read about editors with graphical
    interfaces that feature traditional menus and dialog boxes.


    If you are new to Linux, but have experience with Mac OS, using a graphical editor
    may seem more familiar during your first editing sessions when using X11. However,
    it is important that you learn how to use console-based text editors, because
    there may be times when you are not running X but still have to edit text on your
    system. This is especially true if you have booted into a rescue mode, or if you
    have accessed Linux via a dialup shell account or telnet session. There are ways,
    however, to run graphical clients over a network (see “Using X11 on a Net-work”
    in Chapter 8, “Using X11”).


    # ## Overview of Linux Text Editors


    There is a wealth of software available for Linux. This is also true of the number
    of text editors you will find for Linux. Although not all of the available editors
    will be discussed here, you can get an idea of the number of text editors installed
    on your system by using the apropos command with the `text editor` phrase, like
    this:


    ```

    ```

    $ apropos ''text editor''

    ```


    ded (1) - text editor


    edior (ix) - a text editor for X with drag and drop and accents


    capabilities.


    elvis (1) - a clone of the ex/ev text editor


    ex (1) - Vi I mproved, a programmers text editor


    gedit (1) - GTK+ based text editor


    gmp (1) - gnomepad-, a GTK-based HTML/text editor


    jove (1) - an interactive display-oriented text editor


    mcedit (1) - Full featured terminal text editor for Unix-like systems.


    mg (1) - emacs-like text editor


    nc (1) - Client program for NEdit text editor


    nedit (1) - text editor


    nvi (1) - text editors


    pico (1) - simple text editor in the style of the Pine Composer

    ...

    ```'
