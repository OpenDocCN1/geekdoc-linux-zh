- pgno: 273
  md: 'The GNOME desktop supports drag-and-drop, so you can use your pointer to move,
    copy, rename, delete, link, or change permissions on a file. Like KDE, GNOME also
    supports a graphical interface to your home directory. By using the `gnome` client,
    you can view your directory’s contents as icons or as a list of files. Files may
    be dragged into and out of the home directory to your desktop. If a file is executable
    and you click on its icon, the client will launch. View the click on a file that
    is a Web address, Netscape Navigator will be launched to view the site. If you
    click on a graphics document, an appropriate viewer or editor will be launched
    to edit or display the image.


    The desktop panel is a client that hosts menus, launchers, applets, and other
    items. Use the panel as a handy place to store icons of frequently used clients,
    such as an editor or Web browser. Add applets by clicking the start menu, selecting
    the Applets menu, and finally selecting the Add to panel menu item.


    Click the middle mouse button on a panel icon to drag the icon to a new place
    on the panel. This is a handy way to rearrange how your panel appears. Right-click
    on a panel icon to move the icon, get help, or change the icon’s properties. Right-click
    on a blank area of the panel to add an additional icon or access your GNOME menus.
    Click on either end of the panel to hide or reveal the panel.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_273_0.png)


    > **GNOME offers a small command-line launcher similar to KDE’s `kcli` command.**
    Press Alt+F2 to bring up a dialog box for the Run button. You can then type in
    a short command line to launch a client. This is handy, especially if the client
    is not currently installed on your GNOME menus.


    As you begin to use GNOME for your desktop sessions and run GNOME clients, you
    will quickly understand how the GNOME software libraries provide a consistent
    look and feel for the desktop. Nearly every GNOME client (such as the GNOME `gedit`
    client, shown in Figure 11.2) features a window menu, window controls, scrollbars,
    a floating menu bar, and a floating toolbar of icons. The menu bar and toolbar
    may also be “turn off,” and dragged around the root display. (Click, then drag
    using the small vertical band at the left end of the menu.)


    Many GNOME clients share similar keystrokes (i.e., Ctrl+s to save, Ctrl+o to open,
    and Ctrl+x, Ctrl+c+, and Ctrl+v to cut, copy, and paste) and menus (i.e., File,
    Edit, and Help). Copy and paste operations allow a text editor, such as `gedit`,
    to share data with other applications. Nearly every client features a Help menu.'
