- pgno: 71
  md: '# ## Using the *passwd* Command


    As you have already learned, the *passwd* command is used to create or change
    a user''s password. If you are in charge of a large Linux installation, have numerous
    users, and want to implement a bit more security, you can turn to a technique
    called *password expiration*, or *password aging*. This is also an effective technique
    for use with contract employees or temporary users. When you enforce *expiration*,
    users must renew or change passwords after a preset amount of time. You can also
    enforce actual user expiration for temporary accounts.


    For Red Hat-based Linux systems, again use the *userconf* command (as root), like
    this:


    ```

    ```

    # userconf &

    ```

    ```


    Navigate to the User dialog box (previously shown in Figure 3.3), and click on
    the Params tab. You see the User information tab as shown in Figure 3.5.


    Use this tab to set the number of days before passwords must be changed, how long
    a user account is viable, when to send warnings about impending expirations, and
    the length of time an account or password is good after a warning is issued.


    SuSE Linux administrators can turn to the *yast* command''s user dialog box (as
    shown in Figure 3.4). However, you must press the F6 key when entering the user''s
    name. You see a dialog box, as shown in Figure 3.6.


    Use this dialog box in a similar fashion to operate *userconf*''s controls. When
    finished, use the Tab key to highlight the Continue button in order to return
    to user configuration.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_71_0.png)


    **Figure 3.5** Use *userconf* to set password expiration.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/1ea833f5a3e3c1547e3dd2891f52804a_72_0.png)


    Figure 3.5 SuSE’s yast command features a dialog box with password expiration
    that helps ensure additional security for your system.


    # # Network Configuration


    Creating a network interface (see Chapter 9, "Connecting to the Internet") is
    relatively easy using Linux and certainly won''t involve a number of robots as
    with other commercial operating systems. Like Mac OS, once your internal hardware
    (such as the network interface) is recognized, you can set up your Power Mac to
    run Linux. This allows you to become a member of the LAN in a matter of 30 seconds.


    If you have a computer with an internal Ethernet interface, check the diagnostic
    output provided by the Linux kernel during the boot process. Use the `dmesg` command
    to display this information, and look to see if your internal card has been recognized,
    like this:


    ```

    $ dmesg | less

    ...

    eth0: GMAC at 00:30:65:fd:df:a0, driver v1.3k2

    3c59x.c © 1999/200 Donald Becker and others http://www.scyclad.com/network/vortex.html

    ...

    ```


    In this example from an Apple TiBook running LinuxPPC 2000, the output of the
    `dmesg` command is *piped* through the `less` pager. This means that the output,
    a stream of text, is sent through the `less` command, which allows you to scroll
    (page) through text. Press the q key when finished.


    If you do not see any output, your card may not be recognized. Check to make sure
    that networking support is enabled in your Linux kernel, that you have booted'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'with the correct Linux kernel, and/or that your hardware is supported (by checking
    your distribution vendor''s Web site).


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_73_0.png)


    > SuSE, Inc. maintains an excellent hardware compatibility database and other
    information about its distributions. Start at http://www.suse.com.


    # Creating Network Interfaces


    Creating a network interface means configuring Linux to work with your hardware,
    and then properly assigning an IP (Internet Protocol) address to your card. You
    do not need to use a network interface if you only use your computer as a stand-alone
    workstation. When you connect to the Internet, a different kind of interface,
    known as a PPP (Point-to-Point Protocol) interface, is created.


    Networking interfaces under Linux are created in memory, and are generally numbered
    and named in the order in which they are created. For example, the first PPP interface
    you create is named ppp0, while the first Ethernet interface you create will be
    named eth0.


    # Using the netcfg Client


    The netcfg client included with many Red Hat-based Linux systems may be used to
    create a variety of new network interfaces. Start the client (as root) from the
    command line, like this:


    ```

    # netcfg &

    ```


    After you press Enter, click the Interfaces button on the main dialog box. A new
    dialog box appears. Click the Add button, and you see a dialog box as shown in
    Figure 3.7. Select the desired interface, and then click the OK button. You are
    presented with an appropriate dialog box to further configure the interface.


    # Using YaST2 and YaST


    The SuSE Linux yast command and yast2 clients may be used to create new interfaces.
    For example, you can use yast to jump right into configuring a network interface
    from the command line, like this:


    ```

    # yast --mask network

    ```


    After you press Enter, you see a dialog box as shown in Figure 3.8.'
  merge: -1
  img_proc: true
