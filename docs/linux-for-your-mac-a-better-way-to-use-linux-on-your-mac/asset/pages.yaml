    \n# ## NetaTalk\n\nNetaTalk is a port of the AppleTalk protocol that can be used\
    \ with Linux and other UNIX operating systems. Using NetaTalk is a handy way to\
    \ access remote Mac OS or Linux systems posing as shared volumes!\n\nThe primary\
    \ daemon is named atalkd, and is used to support AppleTalk over Ethernet. Under\
    \ SuSE PPC Linux, NetaTalk's configuration file is /etc/atald/atalkd.conf.\n\n\
    This file simply contains the word:\n\n```\neth0\n```\n\nThis designates the interface\
    \ to use. You can then start NetaTalk (as root) like this:\n\n```\n# /etc/rc.d/init.d/atald\
    \ start\nStarting netatalk:\tdone\n```\n\nOther files found under the /etc/atald\
    \ directory include:\n\n+   AppleVolumes.default\tafpd.conf\tnetatalk.pamd\n+\
    \   AppleVolumes.system\tatalkd.conf\tpapd.conf\n\nThese files contain information\
    \ and settings needed to adequately support accurate file translation and provide\
    \ resource fork information for Mac OS files (as Linux does not support files\
    \ with data and resource components).\n\nTo access your Linux system from Mac\
    \ OS, go to the Apple menu and select the Chooser. Click on the AppleShare icon\
    \ (as shown in Figure 15.13) and the hostname of any Linux workstations on your\
    \ LAN running NetaTalk will appear.\n\nNext, click your mouse on a desired host\
    \ in the Chooser list. You'll then see a dialog box, as shown in Figure 15.14.\n\
    \nEnter your username and password, then click the Connect button to access the\
    \ Linux system. Note that you should have a username and password on the remote\
    \ system in order to access the files. You'll then see a dialog box, as shown\
    \ in Figure 15.15."
