    The graphical counterpart client to the gnuchess family is xboard, a graphical
    interface with a colorful board in a variety of sizes. The client may be started
    from the command line of a terminal window, like this:


    ```

    $ xboard &

    ```


    After you press Enter, you will see a window, as shown in Figure 18.2.'
