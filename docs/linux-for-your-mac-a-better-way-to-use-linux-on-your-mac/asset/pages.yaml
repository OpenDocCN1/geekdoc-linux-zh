- pgno: 272
  md: '+   *   **Taskbar**. This is a configurable menu most often found across the
    top of the display which hosts a Programs, Favorites, Settings and Desktop menu,
    along with the time (and date) and a drop-down Web browsing menu.

    +   *   **Panel**. This is a configurable window that hosts the Start menu, along
    with dockable applications (known as *applets*), a task area to navigate tasks
    running in the current desktop, icons (for launching clients), and a *pager*,
    used to navigate virtual desktops known as *workspaces*. Special icons, known
    as *drawers*, can be added to the panel in order to group icons by type or task.
    You can automatically or manually hide and unhide the panel by clicking a small
    arrow on either end. The panel''s size and orientation (i.e., vertical or horizontal)
    can be changed by using its configuration dialog boxes.

    +   *   **Start menu**. This is a pop-up menu that hosts menu items for nearly
    every GNOME and X client installed on your system. The contents of this menu can
    be changed by using the GNOME menu editor. The menus are echoed by the taskbar''s
    menus and by a pop-up menu accessed by pressing the middle mouse button in a blank
    area of the desktop.

    +   *   **Home directory**. Like KDE, GNOME includes a graphical home directory
    containing your files. The icons on the desktop are represented by files located
    in the directory named \`.gnome-desktop\` in your home directory.


    A typical GNOME desktop is shown in Figure 11.1.


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_272_0.png)


    **Figure 11.1** The GNOME desktop features a taskbar and desktop panel with a
    start menu, which includes a graphical home directory.'
