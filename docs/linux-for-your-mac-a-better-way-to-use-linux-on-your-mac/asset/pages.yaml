- pgno: 459
  md: 'inux and the X Window System are not all work and no play. In fact, some of
    the earliest programs for Linux and X were games (according to legend, they were
    impetus for the initial development of UNIX). This chapter introduces some of
    the wacky and wild software you will find included with every PPC Linux distribution.
    You will also get a peek at a couple commercial games, and will learn how to build
    your own copy of that legendary first-person shooter, DOOM.


    Many early games for Linux were ports, or translations of classic games included
    with the BSD UNIX. However, the recent explosion in interest and use of Linux
    in the last year or so has spurred commercial game development, resulting in a
    more than a dozen titles for Intel-based Linux distribution.


    These games include: Civilization, Call to Power, Descent 3, Myth II, Quake III,
    SimCity 3000, Soldier of Fortune, and others. While some of these games require
    3D graphics hardware and special software support libraries, many others are available
    for PPC Linux and X that do not require upgrades to your computer''s graphics
    system.


    You will benefit most by having a 1024x768 display supporting thousands of colors.
    You should also have a working sound system.


    # ## Games for the Console


    Most of the games for the Linux console are part of the badgames package. This
    is a collection of text-based games originally designed to be played via an alphanumeric
    terminal window, and not the bit-mapped display of an X session.


    These games include: airttraffic, abc, backgammon, battleship, bcd, bog, caesar,
    canfield, cfcores, cribbage, factor, fish, fortune, hangman, hunt, mille, monop,
    morse, number, paranoia, pom, ppr, primes, rain, robots, sail, snake, nscore,
    teachgammon, trek, wargames, worm, worms, and wump.


    The game of fortune prints a random fortune from a large installed database. For
    example:


    ```

    $ fortune

    Fortune is a poor excuse for not having sense enough to be lazy.

    ~ Charlie McCarthy

    ```


    With a little imagination, this command may be used to print out a random saying
    for each login on your system. Other games in the package require the use of a
    VT100 terminal, or a cursor-addressable display in which cursors may be specifically
    placed in different locations on the screen through software. This adds realism
    and rudimentary animation, such as that seen in the atc (air traffic controller)
    game.'
  merge: -1
  img_proc: true
- pgno: 460
  md: 'Planes, represented by letter and number combinations, move across a simulated
    radar scope:


    ![](img/1ea833f5a3e3c1547e3dd2891f52804a_460_0.png)


    One of the most sophisticated and challenging games for the console is GNUChess.
    This program plays a very strong game of chess and is difficult, if not impossible,
    for most chess players to beat. There are several versions included with every
    Linux distribution, but one of the most visual is the gnuchess version, shown
