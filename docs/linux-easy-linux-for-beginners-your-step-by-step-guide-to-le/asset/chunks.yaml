    \ from.\n\nLinux Architecture\n\nLinux architecture can be divided into two: the\
    \ User Space and the Kernel Space.\n\n*   User Space – This is where the applications\
    \ are used. The GNU C library in the User space is the interface that connects\
    \ to the kernel and transitions between User and Kernel space. This uses all the\
    \ available memory.\n\n*   Kernel Space – All Kernel services are processed here.\
    \ The Kernel space is further divided into 3.\n\n    *   System Call Interface\
    \ – A User process can access Kernel space through a System Call. When a System\
    \ Call is performed, arguments are passed from User to Kernel space. This is the\
    \ layer that implements basic functions.\n\n    *   Kernel Code – This is the\
    \ architecture-independent code and can be seen in all architectures that Linux\
    \ supports.\n\n    *   Architecture-Dependent Kernel Code – This is the layer\
    \ for platform-specific codes.\n\n![](images/00001.jpeg)\n\nFigure 1: Linux Architecture\n\
    \nLinux Distributions\n\nEach Linux distribution consists of a Linux kernel plus\
    \ utilities and configuration files. Most Linux distributions can be downloaded\
    \ from their websites.\n\nLet’s take a look at how several of the popular Linux\
    \ distributions, or flavours, differ from each other based on the following criteria:\n\
    \n- Availability\n\nAs previously mentioned, Linux is a free software but companies\
    \ offering a support contract and proprietary components offer it for a fee. In\
    \ the table below, Red Hat Enterprise and SUSE Enterprise both offer Linux commercially\
    \ but they also have the free alternatives – Fedora and openSUSE.\n\n- Package\
    \ Format\n\nLinux distributions come in packages. Packages are files grouped into\
    \ one single file. RPM is the most commonly used.\n\n- Release Cycle\n\nThis is\
    \ how often a distribution releases new software. The ones with shorter release\
    \ cycles provide the latest software in the shortest possible length of time while\
    \ those distributions with longer release cycles aim to offer the most stable\
    \ environments possible. A distribution can have it done both ways. Take a look\
    \ at Ubuntu who releases both long-term support (LTS) versions (longer cycle)\
    \ and the latest software through a 6month cycle.\n\n| Distribution | Availability\
    \ | Package Format | Release Cycle |\n\n| Arch | Free | pacman | Rolling |\n\n\
    | CentOS | Free | RPM | Approx. 2-yr |\n\n| Debian | Free | Debian | 2-yr |\n\n\
    | Fedora | Free | RPM | Approx. 6-mo |\n\n| Gentoo | Free | ebuild | Rolling |\n\
    \n| Mint | Free | Debian | 6-month |\n\n| openSUSE | Free | RPM | 8-month |\n\n\
    | Red Hat Enterprise | Commercial | RPM | Approx. 2-yr. |\n\n| Scientific | Free\
    \ | RPM | Approx. 6-mo |\n\n| Slackware | Free | tarballs | Irregular |\n\n| SUSE\
    \ Enterprise | Commercial | RPM | 2-3 years |\n\n| Ubuntu | Free | Debian | 6-month\
    \ |\n\nTable 1: Comparison of Popular Linux Distributions\n\nTo help you decide\
    \ on which is the right distribution for you, consider the criteria mentioned\
    \ above and research on the other fields listed below:\n\n- Desktop environment:\
    \ Do your research and find out if the particular distribution that you’re eyeing\
    \ has a basic look and feel that you like plus check how customizable it is\n\n\
    - Hardware Compatibility: Depending on the hardware that you are using, some drivers\
    \ might not be available yet by the time you install your distro. Check from online\
    \ resources first to know which ones can be supported out-of-the-box.\n\n- Community\
    \ Support: Find the one with a large online community. The bigger the community\
    \ is, the easier it will be to find documentation and get support.\n\nI personally\
    \ recommend Linux Mint for those who have never used Linux before. The installation\
    \ is easy and fuss-free, plus the menus are familiar (see image below). It also\
    \ comes with an added bonus of proprietary software that comes preinstalled (eg.\
    \ Adobe Flash, MP3 support).\n\n![](images/00002.jpeg)\n\nFigure 2: Mint Desktop\n\
    \nOnce you are familiar with Mint and you feel like you want to branch out to\
    \ other distributions, I recommend Ubuntu as your next distro. Ubuntu makes Linux\
    \ easy to use for the experienced, average user.  The distro also comes with a\
    \ standard set of programs that can get you working in no time after installation.\n\
    \n![](images/00003.jpeg)\n\nFigure 3: Ubuntu Distribution\n\n***\n\nIn this chapter,\
    \ we talked about the different components that make up Linux and touched on the\
    \ differences of popular distributions. I hope this will help you find the right\
    \ distribution that you want to start your Linux experience on. In the next chapter,\
    \ I will walk you through the process of Linux installation.\n\n# Chapter Three:\
    \ Linux Installation\n\nIn this chapter, we will discuss about finally installing\
    \ Linux in your computer. Depending on how you want your setup to be, you can\
    \ either wipe your hard drive clean and replace your existing OS with Linux or\
    \ keep your existing OS and share the disk with Linux. The latter will take a\
    \ few more steps to do the hard disk partitioning.\n\nLinux on Your PC\n\nFor\
    \ beginners, there are two ways on how you can test the waters with Linux.\n\n\
    First, you can get a Linux Live CD. If you want to leave your current OS untouched\
    \ but you want to try out Linux first, then this is the best option. Using a Live\
    \ CD will allow you to boot from a CD/DVD or USB drive and use Linux. Once you’re\
    \ done, remove the CD/USB and reboot the computer to use your current OS. When\
    \ you’re running the Live CD, you might notice it to be a little slow since the\
    \ OS is loading from the drive. You can get Live CDs from Knoppix [http://knoppix.net/get.php](http://knoppix.net/get.php)\
    \ or from Ubuntu [http://www.ubuntu.com/download/desktop/try-ubuntu-before-you-install](http://www.ubuntu.com/download/desktop/try-ubuntu-before-you-install).\n\
    \nSecond, you can directly proceed to installing Linux on your computer, either\
    \ on its own or shared with your existing OS.\n\nThe steps discussed in the succeeding\
    \ sections apply to both using Live CD and those installing Linux.\n\nPre-Installation\
    \ Steps\n\nBefore proceeding with the installation, it will be a good idea to\
    \ check your PC’s hardware first. You may check the hardware vendor’s site to\
    \ check the compatibility list.\n\n- DVD Drive: To install Linux, you must have\
    \ a DVD drive and your computer must be able to boot from the drive. If your hard\
    \ drive controller is IDE/ATA or USB DVD, this will work in Linux.\n\n- Hard Drives:\
    \ This is not necessary if you will be using the Live CD. If you will be installing\
    \ Linux, it is ideal to have at least 4GB of disk space. Linux supports IDE and\
    \ SCSI hard drive controllers.\n\n- Keyboard: All keyboards work with Linux.\n\
    \n- Monitor: Most distribution installers can detect modern monitors. If you find\
    \ that it does not display well, choose a monitor type and a specific resolution\
    \ (1024x768).\n\n- Mouse: PS/2 or USB mouse works with Linux.\n\n- Network Card:\
    \ Installers can detect most network cards. If you find that you are having problems\
    \ with one, find additional information online.\n\n- Processor: Minimum processor\
    \ speed required is 700 MHz. New processor speeds nowadays are way more than this\
    \ value.              In terms of speed, the higher the number, the better."
