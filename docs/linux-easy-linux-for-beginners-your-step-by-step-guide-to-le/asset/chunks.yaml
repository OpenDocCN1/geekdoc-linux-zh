    Step 2: Ensure that your PC can boot from CD/DVD drive. If in case your PC still
    boots from the hard drive when you have a CD/DVD in the drive, change your Boot
    Devices first. Go into BIOS and change the order of boot devices – choose CD/DVD
    drive as the first boot option.


    You can do this by rebooting your PC and pressing a key (F2 or Del on most computers)
    to go into the Setup menu. Verify the key for your computer brand and model. Once
    you’re done assigning CD/DVD drive as the first boot option, put the disk in the
    drive and reboot your computer.


    Step 3: If you are using a Live CD, reboot your computer. The computer will then
    boot up and load the OS from your Live CD.


    If you are installing Linux, step 3 is to partition your drive. One of the options
    for partitioning was described in the previous section.


    Once you already have the partitions in place, boot your computer from the CD/DVD
    drive and proceed with the installation. While installation procedures vary depending
    on the distribution, these are usually easy and straightforward steps. Refer to
    the installation screens that come with the documentation and you should be done
    in an hour or two.


    There will be a few configuration steps as part of the installation such as setting
    the date and time, language, and selecting the software packages to install.


    Once the installation is done, reboot your computer.


    Installation Troubleshooting


    We all want a smooth-sailing installation but in case things don’t go your way,
    here are some initial troubleshooting tips that you can check.


    Installer fails to start X Window


    X Window is the graphical user interface included in many Linux distributions.
    If in case the installer did not detect the video card or for any other reason
    that the installer fails to start X, you can opt to do text mode installation.


    Refer to the table below for some of the different ways on how you can access
    the text mode installation screen.


    | Distribution | How to Access Text Mode Installation |


    | Debian | Default is text mode |


    | Fedora | Type in text when you see the boot: prompt |


    | SUSE | Press F3 and use the arrow keys to select the Text-Mode option. Press
    Enter. |


    | Ubuntu | Default is text mode |


    | Xandros | Press on the Shift key while rebooting from the CD/DVD drive. Choose
    Rescue Console. Type quick_install when you see the bash prompt. |


    Table 2: How to Access Text-Mode during installation


    Is your distro not in the list? Find out how you can start text-mode installation
    for your distribution online.


    The text mode installation screen is similar to the installation screens in which
    you have to respond to the prompts to perform the installation. Once you are in
    text mode, read the prompts carefully and follow the instructions.


    X is not working after installation


    If you happen to see the GUI during the installation but after the first reboot
    you are confronted with a grey screen or a black screen with an X in the middle,
    here are some steps that you can use to troubleshoot.


    1.  1.  Reboot the PC. Press Ctrl+Alt+Delete.


    2.  2.  Once the PC is booting up, press the A key if the distribution uses GRUB
    (GR and Unified Bootloader). For LILO, skip this step. The GRUB boot loader will
    then display a command line for the Linux kernel and will ask you to add what
    you want.


    3.  3.  For GRUB, type a space and then word single. Press Enter. If using LILO,
    type Linux single then press Enter. The Linux kernel will boot in a single-user
    mode with the following prompt:


    sh-3.00#


    Once you see this prompt, you can now start to configure X.


    Depending on the distribution you are using, X uses a configuration file to setup
    your display card, monitor, and resolution. The problem sometimes happens when
    the X configuration from the Linux installer is not right.


    Solve this problem by creating a working configuration file:


    1.  1.  Type the following command:


    X -configure


    Once you enter this command, the X server will create a configuration file. You’ll
    see the screen go blank and then display several messages.


    2.  2.  Use vi,  a text editor and edit the file///etc/xorg.conf.new. Insert the
    linebelow afterSection "Files":line


    FontPath "unix/:7100"


    When using Fedora, you also need to change /dev/mouse to /dev/input/mice.


    3.  3.  Start the X font server by typing the command below:


    xfs


    4.  4.  Type the line below to start the new configuration file.


    X -config ///etc/xorg.conf.new


    Once you see the blank screen with an X cursor, the configuration file is working
    fine.


    5.  5.  Use Ctrl+Alt+Backspace to stop the X server


    6.  6.  Type the command below to copy the config file to the /etc/X11 directory:


                                      cp ///etc/xorg.conf.new /etc/X11/xorg.conf


    7.  7.  Type the wordreboot or press Ctrl+Alt+Delete to reboot the computer.


    The login screen should come up if the config file change went well.


    Most, if not all, Linux distributions have a solid community online. If you encounter
    problems during the installation, search for the problem, describe it in detail,
    or use the actual error message as your search keyword. You will find the information
    that you need and if not, you can always post in the forums and the community
    will be ready to help.


    Visit the following forums for more information:


    Ubuntu: [http://ubuntuforums.org/](http://ubuntuforums.org/)'
