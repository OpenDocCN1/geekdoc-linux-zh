    你可以使用以下命令将软件包安装到电脑中。


    ```bash

    apt-get install package-name

    ```


    此命令将下载你想要安装的特定包名。如果你不知道包名，可以搜索关键词。


    ```bash

    apt-cache search keyword

    ```


    例如，我正在寻找一个可以在我的 GNOME 桌面上进行截屏的应用程序。我可以通过以下命令进一步完善我的搜索功能：


    ```bash

    apt-cache search screenshot | grep GNOME

    ```


    该命令将显示符合搜索字符串的适用行：


    ```bash

    shutter - feature-rich screenshot program

    ```


    `Shutter` 是包名。使用该包名再次运行 `apt-get install` 命令。


    除了通过命令行安装软件包外，你还可以使用“软件与更新”（Software & Updates）工具。GUI 提供了一种简单快捷的方法来更新 Ubuntu 软件并下载软件包。


    ![](img/00020.jpeg)

    图 19：软件与更新工具


    类似于 Windows 和 Mac OS 的应用商店，Ubuntu 也有自己的软件中心，你可以在那里获取新软件并下载最新更新。


    ![](img/00021.jpeg)

    图 20：Ubuntu 软件中心


    ### 在 Fedora 中安装应用程序


    Fedora 使用 `RPM` 软件包。如果你正在使用 GNOME 桌面，可以地可以使用“添加或删除软件”工具（类似于 Windows）来安装新软件。


    点击“系统➪ 管理”，然后点击“添加/删除软件”进入菜单。该实用程序将显示软件包管理器窗口，列出所有软件包的列表。选择相应的复选框并点击“应用”或“更新”（如果你正在更新软件包）。点击“应用”按钮将安装（或卸载）特定的软件包。


    ![](img/00022.jpeg)

    图 21：Fedora 添加/删除软件包


    ***


    在本章中，我们回顾了 Linux 安装后可以完成的硬件设置和软件安装步骤。如需更详细的操作，请参考你所使用的特定发行版的步骤。在下一章中，我们将简要讨论 Linux
    默认应用程序。


    # 第六章：Linux 应用程序


    Linux 发行版预装了满足你计算需求的应用程序。在本章中，我们将快速概览其中一些应用程序。


    ### 办公应用程序


    LibreOffice 套件是 Linux 对 Windows Office 工具的响应。该套件包含文字处理器、演示文稿程序、电子表格、日历和计算器应用程序。如果你是
    Windows 用户，可能需要一些时间来适应界面，但在使用几次程序后，你最终会熟悉它。


    LibreOffice 包含以下应用程序：


    *   `Writer` – 文字处理器。文件以 `.odt` 扩展名创建。用 Microsoft Word 编写的文档与 `Writer` 兼容。


    ![](img/00023.jpeg)

    图 22：Writer 界面


    *   `Calc` – 电子表格程序，工作方式与 Microsoft Excel 类似。默认文件具有 `.ods` 扩展名。


    ![](img/00024.jpeg)

    图 23：类似 Microsoft Excel 的 Calc


    *   `Impress` – Microsoft PowerPoint 的对应软件。在 `Impress` 中，你可以根据现有模板制作幻灯片，也可以像在
    Microsoft Office 中那样进行同样的自定义。


    所有 Libre-Office 应用程序都可以从主菜单中的“办公”选项访问。


    ### 多媒体应用程序


    如何访问多媒体？Linux 发行版带有允许你打开照片、听音频文件、播放视频以及刻录 CD 或 DVD 的应用程序。


    SUSE 和 Xandros 发行版预装了 `digiKam`，这是一个数字相机软件。你也可以从 USB 驱动器访问照片文件。只需点击存储驱动器名称并查看照片。


    KDE 和 GNOME 都带有音频 CD 播放器。插入 CD，默认音频播放器将检测并播放音频。对于其他音频文件如 MP3，你可以使用 `XMMS` 或 `Rhythmbox`
    等播放器。根据你使用的发行版，你可以进入“音乐播放器”应用程序、“多媒体”或“音频与视频”类别来打开播放器。


    最近，不同的发行版已经在其文件管理器中发布了内置的 CD/DVD 刻录功能。它们运行良好，但如果你仍然想要一个独立的应用程序来刻录文件，可以使用最常用的刻录软件，如
    KDE 的 `K3b`。


    ### 图像应用程序


    Linux 也确保你获得所需的照片编辑和图形创建应用程序。Linux 世界中最流行的两个是 `The GIMP`（GNU 图像处理程序）和 `GNOME Ghostview`
    (`GGv`）。


    `GIMP` 相当于 Adobe Photoshop。用户可以进行图像处理、合成和创建。如果你在主菜单的“图形”类别中找不到 `GIMP`，请检查是否需要先安装。参考安装额外软件
    中的步骤下载 `The GIMP`。该应用程序可以读取大多数格式：`JPEG`、`TIFF`、`PNG`、`PCX` 和 `GIF`。关于 `The GIMP`
    的更多信息，请访问其网站：[www.gimp.org](http://www.gimp.org)


    `GNOME Ghostview` 可以读取 PostScript 或 PDF 文档，功能类似于 Acrobat Reader。要在 Fedora 电脑上打开
    Ghostview，点击“图形”然后“PostScript 查看器”。


    探索预装应用程序并判断它们是否符合你的需求。


    ***


    在本章中，我们简要讨论了不同的办公、多媒体和图像应用程序。在下一章中，我们将深入理解命令行。


    # 第七章：使用命令行


    在第第四章中，我们讨论了 命令行或终端以及如何从桌面访问它。在之前的章节中，你已经在终端可以使用简单的命令。每个 GUI 操作都有对应的命令行操作。在本章中，我们将更多地讨论
    Linux 中使用的不同命令，并学习不同的 shell 功能。


    ### 使用 shell 功能


    你现在已经看到了使用 `Bash` shell 的能力。命令行执行任务比在 GUI 中花费的时间少。为了进一步享受使用 `CLI`（命令行界面）的便利，这里有一些你应该使用的
    shell 功能：


    *   命令完成


    启动终端并尝试输入未完成的命令。


    例如，输入以下单词并按 Tab 键：


    ```

    uname

    ```


    注意 Linux 将自动补全单词为 `uname`。接下来，删除其余字母并只保留字母 `u`，Linux 将显示所有以字母 ‘u’ 开头的命令列表。此功能让用户输入命令变得更快。你也可以对文件名或目录名这样做。输入文件名的几个字母，Linux
    就会为你完成剩余部分。

    '
- fmt: '

    This is also helpful when you are trying to remember a command since Linux will
    list out all the commands starting with the letters that you put in. Combine this
    functionality with `man` and you should be able to locate the command that you
    are looking for.


    ### Command History


    Linux makes it easier for users too with the command history feature. The system
    remembers commands you have recently typed in so you no longer need to retype.
    Simply use the arrow keys to view previous commands.


    Here are some of the techniques that you can use to make the most out of this
    feature:


    | Keys to Use | What it does |

    | :--- | :--- |

    | Arrow Up/Down | Display the previous commands from the more recent going to
    the oldest entered |

    | Arrow Right/Left | Moves the cursor one character to the right/left |

    | `CTRL` key + A | Transfers cursor to the beginning of the line |

    | `CTRL` key + E | Transfers cursor to the end of the line |

    | Delete key | The character under the cursor is deleted |

    | Backspace | The character to the left of the cursor is removed |

    | `CTRL` key + R | Search for a particular command from the command history. After
    you use `CTRL` key + R, type the first few letters of the command that you want
    to use |


    Table 9: Command Line History Shortcuts


    System administrators make good use of these features because it makes admin tasks
    easier and faster to complete. Try the techniques on some of the commands you’ve
    learned and see how cool it is to work using the command line.


    ### Essential Linux Commands


    As a new Linux enthusiast, you can perform many of the tasks using the GUI. However,
    if you do fancy learning more commands that you can use in the shell prompt, here’s
    a cheat sheet of the most important Linux commands.


    | Command | What it Does |

    | :--- | :--- |

    | **Help Commands** | |

    | `info` | Shows online information about a command |

    | `man` | Shows details of a command |

    | `whatis` | Shows a short description of a specific keyword |

    | `type` | Shows the location of a command file |

    | `alias` | Assign a command alias – especially useful for long commands |

    | `unalias` | Remove command alias |

    | **Managing Files and Directories** | |

    | `cd` | Change directory |

    | `pwd` | Displays the current directory |

    | `ln` | Create links to files and directories |

    | `touch` | To trigger a file stamp update for a file |

    | **Finding Files** | |

    | `find` | Search for a file based on name |

    | `whereis` | Search for executable files |

    | `which` | Search for files in the directories part of the `PATH` variable |

    | **Processing Files** | |

    | `dd` | Copy lines of data |

    | `diff` | Display the results of comparing two files |

    | `more` | Show a text file one page at a time – display can only go forward |

    | `less` | Show a text file one page at a time – display can only go forward and
    backwards |

    | `wc` | Display the count of the number of characters, words, and lines in a
    file |

    | `cat` | Show a text file in one output |

    | `cut` | Get sections of text in a file |

    | `grep` | Display results of finding expressions in a file |

    | `sed` | Perform editing commands then copy to a standard output |

    | `split` | Specify a size to break a file into |

    | `sort` | Arrange the lines in a file |

    | `uniq` | Keep unique lines in a file and delete duplicates |

    | **Compressing a File** | |

    | `compress` | Use to compress a file |

    | `uncompress` | If a file was compressed with a `compress` command, use this
    to decompress |

    | `gunzip` | Use GNU Zip to decompress files |

    | `gzip` | Compress files with GNU Zip |

    | `tar` | Archive files with one or more directories |

    | **Date and Time** | |

    | `cal` | Show the calendar for the specified month or year |

    | `date` | Show/Set the current date and time |

    | **Managing Processes** | |

    | `bg` | Run a program or a process in the background |

    | `free` | Check for the free memory |

    | `kill` | Stop a process |

    | `nice` | Run a program with a low priority |

    | `ps` | Show current running processes |

    | `top` | Show list of CPU and memory utilization of processes |

    | `reboot` | Restart the computer |

    | `shutdown` | Turn off computer |


    Table 10: List of Important Linux Commands


    Now, try out the commands above. If you are unsure of how to use the options for
    the commands, use the help commands (especially `man` and `info`) to find out
    more.


    In this chapter, I gave you a list of commands and techniques that you can try
    in the command line. Continue on practicing with these commands and to research
    more online. In the succeeding chapter, we will learn about securing your operating
    system.


    # Chapter Eight: Basic Administration and Security


    Your system is up and running now and the next thing you should think about is
    securing it. System administrators consider two aspects of security– host security
    and network security. If multiple users are using a computer, user directories
    and files should be secured and should not be accessed by any unauthorized person.
    Since your computer is connected to the internet, you have to protect it from
    access over the internet too. Let’s discuss about these in the next sections.


    ### Basic System Administration


    Similar to popular operating systems like Windows and Mac OS, Linux distributions
    also come with GUI tools that can be used for performing administrative tasks.
    Adding and removing user accounts, performing software upgrades, managing hardware,
    installing new applications, maintaining the system’s performance, and setting
    up and monitoring security are some of the activities that an administrator executes.


    ![](images/00026.jpeg)

    Figure 25: SUSE YaST for Administrative Tasks


    The administrative tasks mentioned above can be performed using the `YaST` Tool
    when using SUSE. These functionalities are also available in Ubuntu and Fedora.


    ![](images/00027.jpeg)

    Figure 26: Settings Screen for Ubuntu


    ![](images/00028.jpeg)

    Figure 27: Settings Screen for Fedora


    ### Monitoring Performance


    To effectively monitor your computer’s performance, the following aspects should
    be checked:


    #### CPU and Memory Usage


    To see the processes that are consuming the most CPU resource allocation, use
    the `top` command. This command displays the load and memory averages, the process
    IDs, the percentage of CPU used by the process, and the percentage of the memory
    used. `top` command results are refreshed every 5 seconds. To exit the `top` command
    output, press `Q`.


    ![](images/00029.jpeg)

    Figure 28: top command


    #### Hard disk space


    Monitor the disk space to ensure there is enough space for tasks such as logging
    and backups. Use the `df -h` command to validate the disk space. Here’s a sample
    output:


    | Filesystem | Size | Used | Avail | Use | Mounted on |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | /dev/hda1 | 7.1G | 3.9G | 2.9G | 59% | / |

    | /dev/hda2 | 99M | 18M | 77M | 19% | /boot |


    In the monitoring, set specific thresholds at which you, as the administrator
    will take an action. For example, once the used disk space percentage reaches
    a certain threshold like 80%, do a file cleanup to free up disk space. If the
    CPU reaches the allowed threshold, investigate which processes are using up the
    resources and do the necessary action (eg. wait for a process to finish, kill
    a process, etc).


    ### User Management


    Linux automatically creates multiple user accounts upon installation, even if
    you are the only one using your computer. The system uses these accounts for running
    programs. Different accounts safeguard the system, including files and directories,
    from unauthorized access. Users can be assigned to groups for easier facilitation.

