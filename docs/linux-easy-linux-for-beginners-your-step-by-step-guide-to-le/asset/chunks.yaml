    对于打印机，在 Linux 检测到设备后还需要设置打印机配置。按照下面的步骤设置新打印机。注意截图截自 Ubuntu 发行版，但与大多数发行版类似。


    1.  点击桌面上的系统设置（System Settings）中的打印机（Printers）。提供 root 密码。


    ![](img/0015.jpeg)

    图 14：打印机设置菜单


    2.  点击添加（Add）按钮。如果系统检测到了你的打印机，设备将出现在列表中。否则，你需要继续配置并提供打印机驱动。点击下一步（Forward）。


    ![](img/0016.jpeg)

    图 15：新打印机


    3.  选择正确的驱动程序。将显示可用驱动列表——选择适用于你打印机型号的一个。如果你在列表中找不到驱动，你也可以提供打印机驱动或从网上下载文件。


