  trans: '


    Linux 与其他操作系统的显著区别在于 Linux 是一个开源操作系统。这意味着 Linux 是通过协作持续开发的，不像 `Windows` 和 `OS
    X` 均绑定于各自的公司（`Windows` 和 `Apple`），没有哪一家公司拥有 `Linux` 的开发和支持。构建 Linux 是一个共同的愿景，不同的公司共享研究、开发和相关成本。公司与开发者之间的这种开源合作使得
    Linux 成为从小型数字手表到服务器和超级计算机的最佳可用生态系统之一。根据统计，每发布一个内核版本，至少有 100 家公司和 1000 多名开发者共同工作。


    Linux 由 `kernel`（内核，即核心控制软件）以及许多提供不同功能的库和实用组成。Linux 通过许多发行版提供，这些就是我们所说的 Linux
    发行版（flavours）。发行版是特定内核和程序的组合。目前最流行的发行版包括 `Arch`、`SUSE`、`Ubuntu` 和 `Red Hat`。本书重点关注大多数
    Linux 发行版中存在的功能，尽管这些发行版有时会有自己特定的工具。


    该操作系统最初被用作服务器操作系统，然后被用作 Android 开发的基础。直到现在，Linux 在服务器操作系统方面拥有最大的市场份额，但在个人和家庭使用（如桌面电脑和笔记本电脑）方面是最不受欢迎的。在接下来的章节中，我们将深入讨论
    Linux 相比其他操作系统更好的原因。


    除了操作系统执行的任务外，Linux 还具有以下特点：


    * 支持集群 – 可以配置多个 Linux 系统，使其从外部看起来像一个系统。服务可以在集群之间进行配置，并仍然提供无缝的用户体验。

    * 运行虚拟化 – 虚拟化允许一台计算机在用户看来是几台计算机。Linux 可以配置为虚拟化主机——可以在可以在运行其他操作系统，如 `Windows`、`Mac
    OS`或其他 Linux 系统。所有虚拟化系统在外部看来都是独立的系统。

    * 云计算 – Linux 可以处理复杂的、大规模的虚拟化需求——包括虚拟网络、网络存储和虚拟机。

    * 存储选项 – 数据不需要始终存储在计算机硬盘中。Linux 提供了不同的本地和网络存储选项，如 `Fibre Channel` 和 `iSCSI`。


    我将不会详细讨论上述功能，因为它们的应用非常高级。然而，在比较 Linux 和其他操作系统时，了解这些点是有益的。


    ## Linux 的历史


    来自芬兰的学生 Linus Benedict Torvalds（莱纳斯·托瓦尔斯）于 1991 年使用 `C` 和汇编语言创建了 Linux。Linux 是作为一个免费、开源、开放许可的操作系统开发的，这使得全世界的开发者能够学习和修改该操作系统。自从
    1991 年发布初始源代码以来，它在 `GNU General Public License` 下已增长到超过 1800 万行代码。


    最初，Torvalds 将他发明的操作系统命名为 `Freax`，这是“free”、“freak”和“x”几个词的组合。他将文件上传到 `FTP` 服务器，他的同事
    `Ari Lemmke` 是该 `FTP` 服务器管理员。Lemmke 认为 `Freax` 听起来不太好，因此在没有告诉 Torvalds 的情况下将文件夹重命名为
    `Linux`。后来，Torvalds 同意了更命名。


    1992 年，Linux 以 `GNU GPL` 许可，第一批 Linux 发行版（也称为 `distro`）被创建出来——`Boot-root`、`MCC
    Interim Linux`、`Softlanding Linux System (SLS)` 和 `Yggdrasil Linux`，其中几个是在同同年发布的。随着时间的推移，创建了多个发行版：`Slackware`
    —— 最老的现有发行版，`Debian` —— 最大的社区发行版，以及商业发行版 `Red Hat` 和 `SUSE`。


    近年来，Linux 经历了更多发展。Linux 的服务器市场收入已经超过了 `Unix`。基于 Linux 的移动操作系统 `Android` 已经获得了
    75% 的市场份额。2015 年，`Linux Kernel Version 4.0` 发布。


    通过协作工作，Linux 现在是最强大的操作系统之一。数据表明，世界上 98.8% 的最快系统使用 `Linux kernel`。知道你正在使用与这些超级计算机相同的操作系统，难道不令人欣慰吗？


    ## Linux 与其他操作对比


    现在，让我们来看重要的问题：Linux 比其他的更好吗？让我们 Linux 与其他著名的操作系统进行比较。


    ### 成本

    如果你合法获取了 `Windows`，你将支付超过 100 美元，专业版甚至更高。相反，Linux 是免费的。对于 Linux 商业发行版，公司销售支持和文档等服务，但操作系统本身是免费的。


    ### 病毒

    Linux 几乎没有任何病毒。由于大多数 PC 运行在 `Windows` 上，攻击者的目标是于 `Windows OS`。Linux 的开源政策是关键。由于许多开发者在
    Linux 上工作，有更多的眼睛关注安全漏洞。如果真的出现了 Linux 病毒，也有很多帮助。专有操作系统与其雇佣的工程师数量和他们拥有的资源挂钩。对于 Linux，世界各地的任何开发者都可以简单下载源代码并帮助发现和解决漏洞。


    ### 系统稳定性

    如上一节所述，Linux 被用于服务器和超级计算机。大型系统可以运行多年而无需重启。进行适当重启的时间是在 `kernel upgrades`（内核升级）期间——即使是运行在
    Linux 服务器上的软件的升级，也只执行服务重启，而不是节点重启。


    与之相比，你经历过由于程序崩溃而丢失数据的次数，或者在 `Windows` 中插入设备时看到“蓝屏”的次数有多少呢？


    ### 安装

    当你安装 Linux（其任何发行版——`Ubuntu`、`Fedora` 等）时，你得到了所需的一切——文本编辑器、电子表格、演示文稿、照片编辑器、浏览器、播放器、PDF
    阅读器等。与 `Windows` 和其他操作系统相比，一旦设置好操作系统，你必须逐个安装所需的所有其他软件。


    这对硬件驱动程序也是如此。在 Windows 中，你必须先安装驱动程序。驱动程序通常在购买硬件时附带光盘。现在，想想你需要安装驱动程序却找不到光盘是什么时候？在
    Linux 中，驱动程序包含在 `Linux Kernel installation` 中——你节省了时间而且方便得多。


    ### 支持

    Linux 有一个大型在线社区，新用户可以在那里获取信息、阅读常见问题解答（FAQs），并在你认为某些程序或功能运行不正常时进行提问。开源的伟大之处在于，由于许多人参与该操作系统，有无限的资源供你使用和学习。这些也都是免费的！


    这些是 Linux 相比其他操作系统更好的原因。然而，请注意 Linux 使用的是开源软件，因此如果你担心下列的任何项目，那么你应该坚持使用 `Windows`
    或你当前的操作系统：


    * 你需要使用专有软件工作。如果你绝对找不到匹配你所需的专有软件的开源程序，请保留你当前的操作系统。

    * 你是一个硬核游戏玩家。大多数游戏仅兼容 `Windows`。


    '
- fmt: "\n- Hardware is not yet supported in Linux. Very new hardware like those released\
    \ only in the few months might not yet be supported in Linux. Hardware vendors\
    \ usually release drivers only for Windows and Mac since these are the most popular.\n\
    \nMost individuals with Linux installed do away with these by what is called dual-booting.\
    \ This is the option of installing both Windows and Linux on your device so you\
    \ can choose either of the OS depending on your needs.\n\nIn this chapter, we\
    \ have discussed what Linux OS can do and how it compares with other existing\
    \ operating systems. In the next chapter, we will go in depth and understand how\
    \ a Linux operating system works.\n\n# Chapter Two: Understanding Linux\n\nIn\
    \ this chapter, I will provide short information on this operating system’s architecture\
    \ and also discuss about the different flavours of Linux that a beginner can choose\
    \ from.\n\n## Linux Architecture\n\nLinux architecture can be divided into two:\
    \ the User Space and the Kernel Space.\n\n- **User Space** – This is where the\
    \ applications are used. The GNU C library in the User space is the interface\
    \ that connects to the kernel and transitions between User and Kernel space. This\
    \ uses all the available memory.\n- **Kernel Space** – All Kernel services are\
    \ processed here. The Kernel space is further divided into 3.\n    - **System\
    \ Call Interface** – A User process can access Kernel space through a System Call.\
    \ When a System Call is performed, arguments are passed from User to Kernel space.\
    \ This is the layer that implements basic functions.\n    - **Kernel Code** –\
    \ This is the architecture-independent code and can be seen in all architectures\
    \ that Linux supports.\n    - **Architecture-Dependent Kernel Code** – This is\
    \ the layer for platform-specific codes.\n\n![](images/00001.jpeg)\n\nFigure 1:\
    \ Linux Architecture\n\n## Linux Distributions\n\nEach Linux distribution consists\
    \ of a Linux kernel plus utilities and configuration files. Most Linux distributions\
    \ can be downloaded from their websites.\n\nLet’s take a look at how several of\
    \ the popular Linux distributions, or flavours, differ from each other based on\
    \ the following criteria:\n\n### Availability\nAs previously mentioned, Linux\
    \ is a free software but companies offering a support contract and proprietary\
    \ components offer it for a fee. In the table below, Red Hat Enterprise and SUSE\
    \ Enterprise both offer Linux commercially but they also have the free alternatives\
    \ – `Fedora` and `openSUSE`.\n\n### Package Format\nLinux distributions come in\
    \ packages. Packages are files grouped into one single file. `RPM` is the most\
    \ commonly used.\n\n### Release Cycle\nThis is how often a distribution releases\
    \ new software. The ones with shorter release cycles provide the latest software\
    \ in the shortest possible length of time while those distributions with longer\
    \ release cycles aim to offer the most stable environments possible. A distribution\
    \ can have it done both ways. Take a look at `Ubuntu` who releases both long-term\
    \ support (`LTS`) versions (longer cycle) and the latest software through a 6month\
    \ cycle.\n\n| Distribution | Availability | Package Format | Release Cycle |\n\
    | :--- | :--- | :--- | :--- |\n| Arch | Free | `pacman` | Rolling |\n| CentOS\
    \ | Free | `RPM` | Approx. 2-yr |\n| Debian | Free | `Debian` | 2-yr |\n| Fedora\
    \ | Free | `RPM` | Approx. 6-mo |\n| Gentoo | Free | `ebuild` | Rolling |\n| Mint\
    \ | Free | `Debian` | 6-month |\n| openSUSE | Free | `RPM` | 8-month |\n| Red\
    \ Hat Enterprise | Commercial | `RPM` | Approx. 2-yr. |\n| Scientific | Free |\
    \ `RPM` | Approx. 6-mo |\n| Slackware | Free | `tarballs` | Irregular |\n| SUSE\
    \ Enterprise | Commercial | `RPM` | 2-3 years |\n| Ubuntu | Free | `Debian` |\
    \ 6-month |\n\nTable 1: Comparison of Popular Linux Distributions\n\nTo help you\
    \ decide on which is the right distribution for you, consider the criteria mentioned\
    \ above and research on the other fields listed below:\n\n- **Desktop environment**:\
    \ Do your research and find out if the particular distribution that you’re eyeing\
    \ has a basic look and feel that you like plus check how customizable it is\n\
    - **Hardware Compatibility**: Depending on the hardware that you are using, some\
    \ drivers might not be available yet by the time you install your distro. Check\
    \ from online resources first to know which ones can be supported out-of-the-box.\n\
    - **Community Support**: Find the one with a large online community. The bigger\
    \ the community is, the easier it will be to find documentation and get support.\n\
    \nI personally recommend `Linux Mint` for those who have never used Linux before.\
    \ The installation is easy and fuss-free, plus the menus are familiar (see image\
    \ below). It also comes with an added bonus of proprietary software that comes\
    \ preinstalled (eg. `Adobe Flash`, `MP3 support`).\n\n![](images/00002.jpeg)\n\
    \nFigure 2: Mint Desktop\n\nOnce you are familiar with `Mint` and you feel like\
    \ you want to branch out to other distributions, I recommend `Ubuntu` as your\
    \ next distro. `Ubuntu` makes Linux easy to use for the experienced, average user.\
    \ The distro also comes with a standard set of programs that can get you working\
    \ in no time after installation.\n\n![](images/00003.jpeg)\n\nFigure 3: Ubuntu\
    \ Distribution\n\nIn this chapter, we talked about the different components that\
    \ make up Linux and touched on the differences of popular distributions. I hope\
    \ this will help you find the right distribution that you want to start your Linux\
    \ experience on. In the next chapter, I will walk you through the process of Linux\
    \ installation.\n\n# Chapter Three: Linux Installation\n\nIn this chapter, we\
    \ will discuss about finally installing Linux in your computer. Depending on how\
    \ you want your setup to be, you can either wipe your hard drive clean and replace\
    \ your existing OS with Linux or keep your existing OS and share the disk with\
    \ Linux. The latter will take a few more steps to do the hard disk partitioning.\n\
    \n## Linux on Your PC\n\nFor beginners, there are two ways on how you can test\
    \ the waters with Linux.\n\nFirst, you can get a Live CD. If you want to leave\
    \ your current OS untouched but want to try Linux first, then this is the best\
    \ option. Using a Live CD will allow you to boot from CD/DVD. Once you’re done,\
    \ remove the CD and reboot the computer. When you’re running the Live CD you might\
    \ notice it to be a little slow since the OS is loading from the drive.\n\nSecond,\
    \ you can directly proceed to installing Linux on your computer, either on its\
    \ own or shared with your existing OS.\n\nThe steps discussed in the succeeding\
    \ sections apply to both using Live CD and those installing Linux.\n\n## Pre-Installation\
    \ Steps\n\nBefore proceeding with the installation, it will be a good idea to\
    \ check your PC’s hardware first.\n\n- **DVD Drive**: To install Linux, you must\
    \ have a DVD drive and your computer must be able to boot from the drive. If your\
    \ hard drive controller is `IDE/ATA` or `USB DVD`, this will work in Linux.\n\
    - **Hard Drives**: This is not necessary if you will be using the Live CD. If\
    \ you will be installing Linux, it is ideal to have at least 4GB of disk space.\
    \ Linux supports `IDE` and `SCSI` hard drive controllers.\n- **Keyboard**: All\
    \ keyboards work with Linux.\n- **Monitor**: Most distribution installers can\
    \ detect modern monitors. If you find that it does not display well, choose a\
    \ monitor type and a specific resolution (`1024x768`).\n- **Mouse**: `PS/2` or\
    \ `USB` mouse works with Linux.\n- **Network Card**: Installers can detect most\
    \ network cards. If you find that you are having problems with one, find additional\
    \ information online. own- **Processor**: Minimum processor speed required is\
    \ `700 MHz`. New processor speeds nowadays are way more than this value. In terms\
    \ of speed, the higher the number, the better.\n"
