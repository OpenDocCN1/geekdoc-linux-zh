    在本章中，我们讨论了 Linux 的正确安装方法。现在你已经在电脑上安装了 Linux，我们将带你体验第一次 Linux 之之旅。


    # 第四章：你的第一次 Linux 体验


    既然你的 Linux 系统已经在电脑上运行，让我们开始探索这个系统吧。


    ## 开启你的电脑


    一旦你打开电脑，引导程序——`GRUB` 或 `LILO`——就会出现并显示电脑中安装的操作系统的名称。使用方向键选择你想要加载的操作系统。这适用于安装了两个操作系统的电脑。如果
    Linux 是你电脑上唯一的操作系统，请等待几秒钟让引导程序启动 Linux。


    一旦 Linux 启动，将显示图形化登录界面。但请注意，其他发行版在启动时不需要登录。每个 Linux 发行版都使用 root 用户名进行管理员访问。为了避免在使用
    root 时对系统进行任何意外更改，请使用不同的账户登录系统。分配 root 密码是安装过程的一部分。请确保你知道并记得系统的 root 密码。


    以下是登录后 Ubuntu 桌面的示例：


    ![](img/00004.jpeg)


    图 4：Ubuntu 桌面


    出现的桌面是 `KDE` 或 `GNOME`。我们将在后续章节中详细讨论这些内容。


    ## 了解 Shell


    来自 `KDE` 或 `GNOME` 的 GUI 通过图标、窗口和指针提供了探索 Linux 的最佳方式。然而，万 GUI 无法工作（正如我们在“安装故障排除”章节中看到的），如果知道如何使用终端将是一个加分项。在终端中输入命令通常比导航和点击更快。


    在你的桌面上，浏览并找到看起来像显示器的图标。这是终端窗口的图标。如果你找不到该图标，浏览主菜单并找到标记为 `Console`（控制台）或 `Terminal`（终端）的选项。


    ![](img/00005.jpeg)


    图 5：KDE 桌面上的终端


    Ubuntu 的外观是这样的：


    ![](img/00006.jpeg)


    图 6：Ubuntu 上的终端屏幕


    Shell 是你可以运行可执行文件和 shell 脚本的地方。Shell 就是我们所谓的命令行。命令使用下面的通用语法编写：


    ```

    command option1 option2 . . . optionN

    ```


    以下是你可以在 Linux 环境中尝试的几个示例命令及其对应的输出：


    ```

    uptime

    ```

    19:26  up 29 days,  1:39, 2 users, load averages: 1.32 1.36 1.34


    `uptime` 是显示电脑运行持续时间的命令。在这种情况下，电脑已经运行了 29 天，或者接近 1 个月。


    ```bash

    uname –srv

    ```

    Linux 3.9.31.5-127.fc12.i686 #1 SMP Mon Nov 18 18:21:25 EST 2015


    `uname` 是显示操作系统名称的命令。`-s`（打印操作系统名称）、`-r`（打印操作系统发行版本）和 `-v`（打印操作系统版本）是可以用于 `uname`
    命令的选项。在特定示例中，我们想使用所有三个，所以我们输入 `n –srv` 来简化。如果我们想像使用所有选项一样显示结果，可以使用 `-a` 选项。


    要了解某个特定命令可以使用的选项，你可以使用 `man` 命令。


    ```bash

    man uname

    ```

    `man` 命令极其有用，特别是对初学者来说。它显示了你可以使用的所有选项。尝试对你遇到的每一个 Linux 命令使用该命令。


    在 shell 中切换到 root，输入命令 `su` 然后输入你的 root 密码。在 shell 环境中切换到 root 密码将允许你运行只有管理员和超级用户才能够执行的任务。


    ## Linux 桌面


    Linux 发行版通常带有两种常用的 GUI：`GNOME` 和 `KDE`。你可以在电脑上同时安装这两者，并随时随地在两者之间切换。这两个 GUI 也可以运行在
    Unix 上，虽然在 Linux 上可以安装其他 GUI，但这两个仍然是最受欢迎的。


    这里有一张对比这两个桌面的图表：


    |  old | GNOME | KDE |

    | :--- | :--- | :--- |

    | 可用性 | 免费 | 免费 |

    | 最低系统要求 | 700 Mhz CPU, 768 MB RAM | 1 Ghz CPU, 615 MB RAM |

    | 开发重点 | 关注自由、可访问性和对开发者友好 | 提供一个美观且具有高度可配置性的网站 |

    | 定制化体验 | 界面简单易用，非常适合 Linux 初学者，高级用户可能会发现其定制设置具有局限性 | 允许多功能配置以创建美观的桌面，但用户必须学习如何导航选项。定制化会消耗更多资源
    |

    | 默认外观（注意两者都提供定制选项） | 默认设置：顶部的工具栏 | 默认设置：底部的工具栏 |

    | 通用搜索 | 使用文本搜索功能 | 使用菜单导航 |

    | 资源占用 | 比 KDE 消耗资源少 | 资源密集型 |

    | 用户体验 | 适合来自 Windows 的用户 | 类似于 Windows 系统 |


    表 3：GNOME 和 KDE 桌面的对比


    这些是 GUI 之间的不同之处。我鼓励你尝试这些桌面，看看哪种最适合你。接下来的截图显示了桌面的默认设置。GNOME 桌面如下：


    ![](img/00007.jpeg)


    图 7：Fedora 上的 GNOME 桌面


    ![](img/00008.jpeg)


    图 8：Gnome 菜单


    接下来的截图显示了 `KDE` 的默认桌面。


    ![](img/00009.jpeg)


    图 9：openSUSE 上的 KDE 桌面


    ![](img/00010.jpeg)


    图 10：KDE 选项


    两者都可以定制以获得你想要的外观和感受。大胆尝试这些桌面吧！


    ## 导航 Linux 文件系统


    Linux 使用层级结构组织文件。文件存储在目录中，目录也可以包含目录。当你将 Linux 文件系统与 Windows 进行比较时，你会发现 Linux 没有驱动器号。所有文件都存储在根目录下，无论数据物理存储在何处（硬盘、外部驱动器或光盘）。


    要在 Linux 中查找文件，还需要关于路径的层级结构信息。下图剖析了一个示例路径。


    ![](img/00011.jpeg)


    图 11：Linux 中的路径


    路径由顶层目录、目录层级和带有扩展名的文件名组成。所有部分都由斜杠（`/`）分隔。


    以下是 Linux 顶层目录及其包含的数据列表：


    | 顶层目录 | 目录包含的文件 |

    | :--- | :--- |

    | / | 单根目录 – 文件系统基础 |

    | /bin | 可执行文件，例如 Linux 命令 `cat,cp,ls` |

    | /boot | 引导程序启动期间访问的文件——包括 Linux 内核 |

    | /dev | 用于不同硬件/设备的文件 |

    | /etc | 初始化脚本和系统配置文件 |

    | /home | 用户目录 |

    | /lib | 库文件，包括驱动程序模块 |

    | /lost-found | 用于丢失的文件 |

    | /media | 用于挂载可移除的介质文件系统 |

    | /mnt | 临时用于挂载文件系统的挂载点 |

    | /opt | 用于存储应用程序包 |


