    5. 你现在知道了不同的 Linux 桌面及其对应的外观和感受。

    6. 你现在对 Linux 文件系统的样貌有了洞解。

    7. 你现在可以在 Linux 文件系统中进行导航。

    8. 你学会了 Linux 中的基础管理任务。

    9. 你现在可以在 Linux 中创建用户并限制访问，作为系统安全防护的一部分。

    10. 你现在对 Linux 中脚本的工作原理有了了解。


