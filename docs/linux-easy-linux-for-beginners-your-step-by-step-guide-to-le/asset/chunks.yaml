    # Simple Script


    Let’s do a simple script. Enter the following lines of script. Save the file as
    `simplescript.sh`. Ensure that the file permission for the user is set to `744`
    so you can run the script.


    ```bash

    #!/bin/sh


    echo "My name is: $1"


    echo I’m using Linux distro: $2


    echo Today is: $3

    ```


    Run the script along with 3 arguments:


    `./simplescript.sh Steve Fedora Tuesday`


    The output should be like this:


    ```

    My name is: Steve

    I’m using Linux distro: Fedora

    Today is: Tuesday

    ```


    Here’s an example of how you can use it in maintaining your computer’s performance.
    If you have already used 80% of your disk space, it might be good to check which
    files are the biggest in your computer.


    Write a new script with the command below:


    ```bash

    find / -type f -atime +30 -size +1000k -exec ls -l {} \; > /tmp/filecleanup

    ```


    This shell script will generate a new file called `fileCleanup` containing a list
    of old and big files. As an administrator, the next step is to contact the file
    owners to give them a notice before deleting these files.


    As you might have observed, you can combine different Linux commands with variables,
    conditional expressions, loops and functions to create your scripts.


    At this point, I highly encourage you to proceed in learning advanced Linux where
    you will learn about more sophisticated and more powerful `awk` and `sed` utilities.
    These two are especially handy when dealing with data.


