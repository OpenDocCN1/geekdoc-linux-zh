    当你尝试记住某个命令时，这非常有帮助，因为 Linux 会列出所有以你输入的字母开头的命令。将此功能与 `man` 结合，你应该就能找到你正在寻找的命令了。


    ### 命令历史


    Linux 也通过命令历史功能让用户变得更加方便。系统会记住你最近输入过的命令，因此你不再需要重新输入。只需使用方向键即可查看之前的命令。


    以下是一些你可以使用的技巧，以充分利用这一功能：


    | 使用的按键 | 功能 |

    | :--- | :--- |

    | 向上/向下方向键 | 从最近到最早输入的顺序显示之前的命令 |

    | 向右/左方向键 | 将光标向右/左移动一个字符 |

    | `CTRL` 键 + A | 将光标移动到行首 |

    | `CTRL` 键 + E | 将光标移动到行尾 |

    | Delete 键 | 删除光标下的字符 |

    | 退格键 (Backspace) | 删除光标左侧的字符 |

    | `CTRL` 键 + R | 从命令历史中搜索特定命令。使用 `CTRL` 键 + R 后，输入你想要使用的命令的前几个字母 |


    表 9：命令行历史快捷键


    系统管理员充分利用了这些功能，因为它们让管理任务的完成变得更加简单快速。尝试在你学过的命令上使用这些技巧，看看使用命令行工作有多有多酷。


    ### 基础 Linux 命令


    作为一个新的 Linux 爱好者，你可以使用 GUI 执行许多任务。然而，如果你想学习更多可以在 shell 提示符中使用的命令，这里有一份最重要的 Linux
    命令备查表。


    | 命令 | 作用 |

    | :--- | :--- |

    | **帮助类命令** | |

    | `info` | 显示有关命令的在线信息 |

    | `man` | 显示命令的详细信息 |

    | `whatis` | 显示特定关键词的简短描述 |

    | `type` | 显示命令文件的位置 |

    | `alias` | 为命令分配别名——对长命令特别有用 |

    | `unalias` | 移除命令别名 |

    | **管理文件和目录** | |

    | `cd` | 切换目录 |

    | `pwd` | 显示当前目录 |

    | `ln` | 创建文件和目录的链接 |

    | `touch` | 触发文件的时间戳更新 |

    | **查找文件** | |

    | `find` | 根据名称搜索文件 |

    | `whereis` | 搜索可执行文件 |

    | `which` | 在 `PATH` 变量的目录部分搜索文件 |

    | **处理文件** | |

    | `dd` | 复制数据行 |

    | `diff` | 显示两个文件之间比较的结果 |

    | `more` | 每次页显示一次文本文件——显示只能向前移动 |

    | `less` | 每次页显示一次文本文件——显示可以向前和向后移动 |

    | `wc` | 显示文件中字符、单词和行的计数 |

    | `cat` | 在单次输出中显示文本文件 |

    | `cut` | 获取文件中的文本段 |

    | `grep` | 显示文件中查找表达式的结果 |

    | `sed` | 执行编辑命令然后复制到标准输出 |

    | `split` | 指定大小以拆分文件 |

    | `sort` | 对文件中的行进行排序 |

    | `uniq` | 保留文件中的唯一行并删除重复项 |

    | **压缩文件** | |

    | `compress` | 用于压缩文件 |

    | `uncompress` | 如果文件是用 `compress` 命令压缩的，使用此项进行解压缩 |

    | `gunzip` | 使用 GNU Zip 解压缩文件 |

    | `gzip` | 使用 GNU Zip 压缩文件 |

    | `tar` | 对一个或多个目录进行归档 |

    | **日期和时间** | |

    | `cal` | 显示指定月份或年的日历 |

    | `date` | 显示/设置当前日期和时间 |

    | **进程管理** | |

    | `bg` | 在后台运行程序或进程 |

    | `free` | 检查空闲内存 |

    | `kill` | 停止进程 |

    | `nice` | 以低优先级运行程序 |

    | `ps` | 显示当前运行的进程 |

    | `top` | 显示进程的 CPU 和内存利用率列表 |

    | `reboot` | 重启计算机 |

    | `shutdown` | 关闭计算机 |


    表 10：重要 Linux 命令列表


    现在，尝试上面的命令。如果你不确定如何使用命令的选项，请使用帮助命令（特别是 `man` 和 `info`）来获取更多信息。


    在本章中，我给你提供了一个可以在命令行中尝试的命令和技巧。继续练习这些命令并在网上进行更多研究。在下一章中，我们将学习如何保护你的操作系统。


    # 第八章：基础管理与安全


    你的系统现在已经运行了，你应该考虑的下一步是加固它。系统管理员考虑安全的两个方面——主机安全和网络安全。如果有多个用户使用一台计算机，应该对用户目录和文件进行安全保护，不应让任何未经授权的人访问。由于你的计算机连接到了互联网，你还必须保护它免受互联网的访问。让我们在后面的章节中讨论这些内容。


    ### 基础系统管理


    类似于 Windows 和 Mac 等流行的操作系统，Linux 发行版也带有用于执行管理任务的 GUI 工具。添加和删除用户账户、管理硬件、安装应用程序、维护系统、设置和监控安全是管理员执行的一些活动。


    images/0026.jpeg

    图 25：SUSE YaST 管理任务


    上述管理任务在使用 SUSE 时可以使用 YaST 完成。这些功能也适用于 Ubuntu 和 Fedora。


    images/0027.jpeg

    图 26：Ubuntu 设置界面


    images/0028.jpeg

    图 27：Fedora 设置界面


    ### 性能监控


    为了有效监控计算机的性能，应该检查以下方面：


    #### CPU 和内存使用


    要查看消耗最多 资源的进程，使用 `top` 命令。该命令显示负载和内存平均值、进程 ID、进程使用的 CPU 百比以及使用的内存百分比。`top` 命令的结果每
    5 秒刷新一次。要退出 `top` 命令输出，按 `Q`。


    images/0029.jpeg

    图 28：top 命令


    #### 磁盘空间


    监控磁盘空间以确保有足够的空间用于日志和备份。使用 `df -h` 命令验证磁盘空间。这是一个示例输出：


    | 文件系统 | 大小 | 已用 | 可用 | 使用率 | 挂载点 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | /dev/hda1 | 7.1G | 3.9G | 2.9G | 59% | / |

    | /dev/hda2 | 99M | 18M | 77M | 19% | /boot |


    在监控中，设置特定的阈值，让你作为管理员在达到值时采取行动。例如，一旦磁盘空间使用百分比达到 80% 等特定阈值，进行文件清理以释放磁盘空间。如果 CPU
    达到允许的阈值，调查哪些进程正在消耗资源并采取必要的行动（例如等待进程结束、杀死进程等）。


    ### 用户管理


    Linux 在安装时会自动创建多个用户账户，即使你是唯一使用这台计算机的人。系统使用这些账户来运行程序。不同的账户可以保护系统（包括文件和目录）免受未经授权的访问。用户可以分配到组以便方便。


