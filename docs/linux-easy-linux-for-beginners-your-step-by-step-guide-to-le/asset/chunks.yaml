    ## Installing Additional Software


    Linux-compatible softwares come in `.rpm` for RPM (Fedore, SUSE) or `.deb` for
    Debian (Debian, Ubuntu, Xandros) packages. Even if the type of packages varies,
    both RPM and Debian packages can be installed in any type of Linux distribution.
    Popularly used distributions provide a GUI for installing additional applications.
    In this section, I will discuss on the ways of installing software in Ubuntu and
    Fedora.


    ### Installing Applications in Ubuntu


    Debian-based distros use `APT` or the Advanced Packaging Tool.


    You can use the command below to install packages to your computer.


    ```bash

    apt-get install package-name

    ```


    This command will download the specific package name that you want to install.
    In case you do not know the package name, you can search for a keyword.


    ```bash

    apt-cache search keyword

    ```


    For example, I am looking for an application that I can use to take screenshots
    in my GNOME desktop. I can further refine my search functionality with the following
    command:


    ```bash

    apt-cache search screenshot | grep GNOME

    ```


    The command will display the applicable lines that fit the search string:


    ```bash

    shutter - feature-rich screenshot program

    ```


    `Shutter`is the package name. Use the package name and run the `apt-get install`
    command again.


    Aside from installing packages via the command line, you can also use the Software
    & Updates Tool. The GUI provides a simple and easy way to update your Ubuntu software
    and download packages.


    ![](images/00020.jpeg)

    Figure 19: Software & Update Tool


    Similar to Windows and Mac OS application stores, Ubuntu also has its Software
    Center where you can get new software and download the latest updates.


    ![](images/00021.jpeg)

    Figure 20: Ubuntu Software Centre


    ### Installing Applications in Fedora


    Fedora uses `RPM` packages. If you are using a GNOME desktop, you can simply use
    the Add or Remove Software tool (similar to Windows) to install new software.


    Click on System➪ Administration then on Add/Remove Software to access the menu.
    The utility will then display the Package Manager box showing the list of all
    packages. Select the corresponding check box and click on Apply or Update (if
    you are updating the packages). Clicking on the Apply button will install (or
    uninstall) the specific packages.


    ![](images/00022.jpeg)

    Figure 21: Fedora Add/Remove Packages


    ***


    In this chapter, we reviewed the hardware setup and software installation steps
    that you can do post-Linux installation. For more detailed procedures, refer to
    the steps for the particular distribution that you are using. In the next chapter,
    we will briefly discuss the default Linux applications.


    # Chapter Six: Linux Applications


    Linux distributions come pre-installed with applications for your computing needs.
    In this chapter, we will take a quick look at some of these applications.


    ### Office Applications


    Libre-Offfice suite is Linux’s answer to Windows Office tools. The suite comes
    with a word processor, presentation application, spreadsheet, calendar, and calculator
    applications. If you are a Windows user, you might need sometime to get use to
    the interface but after a few times of using the apps, you’ll eventually be familiar
    with it.


    LibreOffice comes with the following applications:


    *   `Writer` – word processor. Files are created with a `.odt` file extension.
    Documents written with Microsoft Word are compatible with `Writer`.


    ![](images/00023.jpeg)

    Figure 22: How Writer Looks Like


    *   `Calc` – spreadsheet program that works similarly to Microsoft Excel. Default
    file has `.ods` file extension


    ![](images/00024.jpeg)

    Figure 23: Calc Looking Like Microsoft Excel


    *   `Impress` – the counterpart of Microsoft PowerPoint. In `Impress`, you can
    make slide presentations based from existing templates or you can also customize
    the same way that you can do in Microsoft Office.


    ![](images/00025.jpeg)

    Figure 24: Made to Impress


    All Libre-Office applications can be accessed from the Office option in the Main
    Menu.


    ### Multimedia Applications


    How about accessing multimedia? Linux distributions come with apps that allow
    you to open photos, listen to audio files, play videos, and burn CDs or DVDs.


    SUSE and Xandros distributions are pre-installed with `digiKam`, a digital camera
    software. You also have the option to access your photos as files from a USB drive.
    Simply click on the storage drive name and view the photos.


    Both KDE and GNOME come with an audio CD player. Put your CD in and the default
    audio player will detect and play the audio. For other sound files like MP3s,
    you can use players such as `XMMS` or `Rhythmbox`. Depending on the distro that
    you are using, you can go to the Music Player application, Multimedia or Sound
    & Video category to open the players.


    In recent times, different distributions have already released a built-in CD/DVD
    burner functionality in their file managers. These work well but if you still
    want a separate application to burn files, you can use the most commonly used
    burn software such `K3b` for KDE.


    ### Imaging Applications


    Linux also makes sure that you get the photo editing and graphics creation applications
    that you need. The two most popular in the Linux world is `The GIMP` (GNU Image
    Manipulation Program) and `GNOME Ghostview` (`GGv`).


    The `GIMP` is the equivalent of Adobe Photoshop. Users can perform image manipulation,
    composition, and creation. If you cannot find `GIMP` in the Graphics category
    from the main menu, check if you need to install the package first. Refer to the
    steps in the section [Installing Additional Software](#part0000_split_011.html__Installing_Additional_Software)
    to download and install `The GIMP`. The application can read most image formats:
    `JPEG`, `TIFF`, `PNG`, `PCX`, and `GIF`. For more information about `The GIMP`,
    visit their website at [www.gimp.org](http://www.gimp.org)


    `GNOME Ghostview` can read PostScript or PDF documents and has similar functionalities
    as Acrobat Reader. To open Ghostview on a Fedora computer, click on Graphics then
    PostScript Viewer.


    Explore the pre-installed applications and gauge if these suits your needs.


    ***


    In this chapter, we briefly discussed the different office, multimedia, and imaging
    applications that come with a Linux distribution. In the next chapter, we will
    establish a deeper understanding of the Linux command line.


    # Chapter Seven: Using the Linux Command Line


    In Chapter Four, we discussed about the Linux Command Line or the terminal and
    how you can access it from your desktop. In the previous chapters, you were also
    able to use simple commands on the terminal. Each GUI action has a command-line
    equivalent. In this chapter, we will talk more about the different commands that
    you can use in Linux and also study the different shell features.


    ### Using the Shell Features


    You have now seen the capabilities of using the `Bash` shell. Performing tasks
    on the command line take lesser time than doing it in the GUI. To further enjoy
    the convenience of using the `CLI` (command line interface), here are some shell
    features that you should use:


    *   Command Completion


    Launch a terminal and try typing an unfinished command.


    For example, type the word below and press the Tab key.


    ```

    uname

    ```


    Notice that Linux will automatically complete the word to formuname. Next, remove
    the rest of the letters and just leave the letter `u`, Linux will then display
    all the list of commands that start with the letter ‘u’. This feature makes it
    even faster for a user to type commands. You can even do this for filenames or
    directory names too. Type the first few letters of the filename and Linux will
    do the rest for you.

