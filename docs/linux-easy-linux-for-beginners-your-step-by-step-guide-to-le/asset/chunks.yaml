    ### Table 4: Linux Top-level Directories


    To navigate in the directories of Linux, you can either use the GUI to find a
    certain file by going through the folders, using the universal text-based search
    function, or by using the command line.


    You can use the following useful commands in your terminal to navigate and work
    in the file system:


    | Commands | What it does |

    | :--- | :--- |

    | `ls` | List down all the contents of a director |

    | `cd /bin/` | Changes directory and goes to bin dir |

    | `cd ~` | the tilde (`~`) sign signifies the user’s home dir – change dir to
    home director |

    | `cd ..` | Means to change directory one level up. For example, you are currently
    `/home/edulaney/`, using the command will take you to `/home/` |

    | `mkdir` | Command used to create directories |

    | `pwd` | Short for present working directory. This command will display the directory
    where you are currently in. |


    ### Table 5: Directory Navigation Commands


    Here I’ll give out more commands that you can use to manage your files using the
    command line. Try this out on your terminal.


    | Commands | What it does |

    | :--- | :--- |

    | `cat /home/edulaney/files/file1.txt` | Command to print all the contents of
    file1.text in the screen |

    | `cp /home/ /tmp/` | Copy contents of `/home/` to `/tmp/` |

    | `mv /home/edulaney/files/file1.txt /tmp/` | Move the file file1.txt to the `/tmp/`
    directory. You can also use this command to move the entire directory to another
    directory |

    | `rm file1.txt` | Delete the file file1.txt. Take extra precaution in using the
    `rm` command especially when you are logged in as root. |

    | `find / -name “linux*"` | The `find` command is a powerful tool that you can
    use when searching using the command line. The command here will search for any
    file or directory with a name that starts with linux |


    ### Table 6: Basic Commands for Managing Files


    Explore more of the commands by using the `man` command.


    ## Shutting Down your PC


    Turning off your Linux PC is similar to how you do it in other operating systems.
    Click on the Main Menu, select Shutdown, and click on OK. This will initiate a
    system shutdown. Some distributions will not allow you to shut down the system
    without logging out first. To do this, click on Log Out and then select Shutdown
    in the login page.


    ***


    Now that you are acquainted with the look and feel of a Linux environment, let’s
    get to the post-installation activities such as managing your computer’s hardware
    and installing applications.


    # Chapter Five: Post-Installation Activities


    In this chapter, we will talk about the things that you can do after having your
    Linux OS installed – from managing hardware to installing additional software.


    ## Managing Hardware and Peripherals


    ### CPU


    The operating system keeps programs and hardware working together smoothly. The
    capabilities of Linux are affected by the limitations of your system’s hardware
    (for example, disk space and memory) so it is important to know more details about
    your computer’s hardware.


    Let’s start with the CPU. The CPU performs all the computing and its speed (in
    MHz) signifies how fast your computer can handle transactions. Your CPU specs
    will tell also tell you about the CPU family (most common are x86 and x86-64)
    and the number of cores that it has. To know more about your CPU, use the Linux
    commands below:


    | Commands | What it does |

    | :--- | :--- |

    | `uname -a` | This command displays information about the machine, the processor
    architecture, and the operating system details. Using the `-p` option will show
    you the machine processor name. An example is i386 or x86_64 AMD Phenom (tm) II
    X3 700e Processor |

    | `lscpu` | This command returns more information about the system such as the
    number of CPUs and the CPU speed.Sample output:![](images/00012.jpeg) |

    | `cat /proc/cpuinfo` | This is a file that contains more information than the
    one displayed using the `lscpu` command. Snippet from a `/proc/cpuinfo` file:processor:
    1vendor_id: Intelcpu family: 11model : 2model name: Intel(R) Pentium(R) 4 CPU
    2.86GHzstepping: 4microcode: 0xe |


    ### Table 7: Commands to get CPU information


    ### Hard Disk


    Next, let’s discuss your computer’s hard disk. In the installation chapter, I
    spoke about the importance of making sure that your computer has enough disk space
    for Linux and the possible need for partitioning your hard disk if you want to
    run two operating systems at the same time.


    If you plan on adding a new disk in the future, learning how to partition will
    come in handy. Linux supports the following partitioning tools:


    *   **Fdisk Tools** – This is composed of the text-based tools: `fdisk`, `cfdisk`,
    and `sfdisk`. These tools are great for use in partitioning, however it could
    be a bit overwhelming for beginners who are not yet familiar with partitioning.

    *   **libparted Tools** – The `libparted` library presents both GUI and text-based
    partitioning tools. One particular example is `GParted` as shown in the screenshot
    below. The interface makes it easier to use for beginners.

    *   **GPT fdisk Tools** – These are tools created for GPT (Globally Unique Identifier
    Partition Table) disks.


    ![](images/0013.jpeg)

    Figure 12: GParted - GUI-based partitioning tool


    Here are some commands that you can use to check the disk space:


    | Commands | What it does |

    | :--- | :--- |

    | `df -h` | This command displays the disk space usage of all mounted devices.
    The `-h` option presents the results in human-readable. |

    | `du /home/edulaney/files/` | This command displays all the files inside the
    directory and their corresponding sizes. |

    | `du -s /home/edulaney/files/` | The `-s` option provides the total file size
    of the directory |


    ### Table 8: Commands for Checking Disk Space


    ### Removable Storage


    Using storage such as USB flash drives and external hard disks in Linux works
    similarly when using Windows or Mac OS. Plug the device in and Linux will detect
    the device. Aside from accessing the drive via the desktop GUI, you can also navigate
    to the `/media` directory and find the subdirectory.


    After you use the removable media, unmount the disk before removing it to avoid
    any disk issues. You can generally right-click on the Device Name and click on
    any of the options such as Unmount, Eject, or Safely Remove.


    ![](images/0014.jpeg)

    Figure 13: Eject Media




    ### USB Devices


    You can connect other devices such as human-interface devices (keyboard, mouse),
    cameras, mobile phones, scanners and printers to your Linux computer and expect
    that these work in a plug-and-play manner.


    For printers, you will also need to set up the printer configuration after Linux
    detects the device. Follow the steps below to set-up a new printer. Note that
    the screenshots are taken from an Ubuntu distribution but this is similar to majority
    of the distros.


    1.  Click on System Settings then Printers in the desktop. Provide the root password.


    ![](images/0015.jpeg)

    Figure 14: Printer Set-Up Menu


    2.  Click on the Add button. If the system has detected your printer, the device
    will show in the list. Otherwise, you will need to continue with the configuration
    and provide the printer drivers. Click Forward.


    ![](images/0016.jpeg)

    Figure 15: New Printer


    3.  Choose the correct driver. A list of available drivers will be shown – choose
    the one that is applicable for your printer make. If you do not find the driver
    on the list, you can also provide the printer driver or download the file online.


    ![](images/0017.jpeg)

    Figure 16: Selecting the Driver


    4.  Fill-up the printer name and description.


    ![](images/0018.jpeg)

    Figure 17: Printer Description

