    ## 关闭你的电脑


    关闭 Linux PC 与你如何在其他操作系统中操作非常类似。点击主菜单（Main Menu），选择关机（Shutdown），并点击确定（OK）。这将启动系统关。某些发行版不允许在不注销的情况下关闭系统。要做到这一点，请点击注销（Log
    Out），然后在登录页面选择关机（Shutdown）。


    ***


    现在你已经熟悉了 Linux 环境的外观和感受，让我们开始进行安装后的活动，例如管理电脑硬件和安装应用程序。


    # 第五章：安装后活动


    在本章中，我们将讨论在安装 Linux 操作系统后可以做的事情——从管理硬件到安装额外的软件。


    ## 管理硬件和外设


    ### CPU


    操作系统保持程序和硬件顺畅运行。Linux 的功能受到系统硬件限制的影响（例如磁盘空间和内存），因此了解更多关于电脑硬件的细节非常重要。


    让我们从 CPU 开始。CPU 执行所有的计算，其速度（以 MHz 为单位）代表了你的电脑处理事务的速度。你的 CPU 规格还会告诉你 CPU 家族（最常见的是
    x86 和 x86-64）以及它的核心数。要了解更多关于你的 CPU 信息，请使用下面的 Linux 命令：


    | 命令 | 功能 |

    | :--- | :--- |

    | `uname -a` | 此命令显示关于机器、处理器架构和操作系统的详细信息。使用 `-p` 选项将显示机器处理器名称。例如 i386 或 x86_64
    AMD Phenom (tm) II X3 700e Processor |

    | `lscpu` | 此命令返回更多关于系统的信息，例如 CPU 数量和 CPU 速度。示例输出：![](img/00012.jpeg) |

    | `cat /proc/cpuinfo` | 该文件包含比 `lscpu` 命令显示的信息更多。/proc/cpuinfo 文件的片段：processor:
    1vendor_id: Intelcpu family: 11model : 2model name: Intel(R) Pentium(R) 4 CPU
    2.86GHzstepping: 4microcode: 0xe |


    ### 表 7：获取 CPU 信息的命令


    ### 硬盘


    接下来，让我们讨论你电脑的硬盘。在安装章节中，我提到了确保电脑有足够的磁盘空间运行 Linux 的重要性，以及如果你想同时运行两个操作系统，可能需要对硬盘进行分区。


    如果你计划在未来添加新磁盘，学习如何分区将非常有帮助。Linux 支持以下分区工具：


    *   **Fdisk Tools** – 这由文本工具组成：`fdisk`、`cfdisk` 和 `sfdisk`。这些工具在分区时非常好用，但对于还不熟悉分区的初学者来说，可能会有些无从心。

    *   **libparted Tools** – `libparted` 库提供了 GUI 和文本分区工具。一个特别的例子如下截图所示的 `GParted`。该界面让初学者更容易使用。

    *   **GPT fdisk Tools** – 这些为 GPT（全局唯一标识分区表）磁盘创建的工具。


    ![](img/0013.jpeg)

    图 12：GParted - 基于 GUI 的分区工具


    以下是一些你可以用来检查磁盘空间的命令：


    | 命令 | 功能 |

    | :--- | :--- |

    | `df -h` | 此命令显示所有挂载设备的磁盘空间使用情况。`-h` 选项以易读的格式显示结果 |

    | `du /home/edulaney/files/` | 此命令显示该目录下的所有文件及其对应的大小 |

    | `du -s /home/edulaney/files/` | `-s` 选项提供目录的总大小 |


    ### 表 8：检查磁盘空间的命令


    ### 可移动存储设备


    在 Linux 中使用 USB 闪盘和外部硬盘等存储设备与 Windows 或 macOS 类似。插入设备后 Linux 将检测设备。除了通过桌面 GUI
    访问驱动器外，你也可以进入 `/media` 目录找到子目录。


    在使用移动介质后，请卸载磁盘以避免任何磁盘问题。你通常可以右键点击设备名称，并点击卸载（Unmount）、弹出（Eject）或安全删除（Safely Remove）等选项。


