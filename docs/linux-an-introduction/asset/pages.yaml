    \ you will have to know what you're doing, and not merely regarding installing\
    \ the software.\n+   \n+   **BUY A BOXED SET**\n+   - Boxed sets are easy to find.\
    \ Your software store is likely to sell a boxed set from a main distributor, such\
    \ as Caldera, Debian, or Red Hat. With this method, everything you need is likely\
    \ to be provided, including an installation program and printed materials. The\
    \ only downside is that this method is usually the most expensive.\n\n# **ON A\
