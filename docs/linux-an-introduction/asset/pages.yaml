- pgno: 9
  md: '# **A LINUX INTRODUCTION**


    Learning a new operating system is different from learning a new piece of software,
    which will use many recognizable terms and procedures. This familiarity does not
    apply to an OS.


    # ### What is Linux?


    Twenty years ago, Linux was an operating system for programmers and computer hobbyists.
    Today, PCs are sold with Linux preinstalled, and bookshops and PC magazines have
    sections devoted to it. Linux is now mainstream.


    # **THE FREE OPERATING SYSTEM**


    Linux is a clone of the UNIX operating system. UNIX is commonly regarded as one
    of the most powerful and versatile operating systems available, and is widely
    used as the operating system for computer networks running on large and powerful
    computers. In the late 1980s, a student at the University of Helsinki, named Linus
    Torvalds, began to develop a version of UNIX for the standalone workstation –
    the regular PC that most of us use at home. Since its release in 1991, the original
    version of Linux has been constantly modified and improved – both by him and a
    large number of developers who help maintain and update new releases of the kernel
    [] (the core of the operating system) on a regular basis. Every new version of
    Linux is made available free-of-charge on the internet for anyone to download.
    Although this "official" version is regularly updated, anyone is free to make
    changes to the kernel without fear of litigation because Linux is "open source"
    software.


    # **WIDENING THE PLATFORM**


    Linux has now been rewritten and made available for many other operating systems.
    This means that Linux is now capable of running on many different hardware platforms
    – from IBM’s compatible PCs and Macs to Amigas and Alphas.


    *Pronounced Linn-ux*


    Linux is a combination of the origator’s name, Linus, and UNIX. It is pronounced
    Linn-ux with a short "i".'
  merge: -1
  img_proc: true
