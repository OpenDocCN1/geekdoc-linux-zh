- pgno: 36
  md: '# GFLOPPY


    ● Glfopy is a utility for formatting floppy disks. You will usually be able to
    mount and read floppy disks that have been formatted on other operating systems
    on the GNOME desktop. For example, Windows/DOS-formatted disks can be read. However,
    the transfer will not work in the opposite direction. Linux floppy disks cannot
    be formatted to be read on a Windows PC. So if you are intending to transfer files
    between a Linux PC (html or tex documents for instance) and a Windows PC, you
    should format your floppy disks as DOS (FAT16) rather than Linux Native (ext 2)
    disks.


    ![](img/773dce76f7b88c1faa45d71937dc4026_36_0.png)


    # GNOME CALCULATOR


    ● The GNOME Calculator comes with the description providing "simple double-precision
    calculations similar to xcalc." For those who require them, there are far more
    features than the average, free, desktop calculator offers.


    ![](img/773dce76f7b88c1faa45d71937dc4026_36_1.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_36_2.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# PROGRAMS:


    +   ### GRAPHICS

    +   *   One of the most highly regarded applications available with GNOME is The
    GIMP (The GNU


    Image Manipulation Program). This sophisticated image-editing suite was created
    as part of a student project in 1995. It is a freely distributed piece of software
    that is appropriate for image processing tasks such as photo retouching, image
    composition, and image creation.


    +   *   Before you can use The GIMP, you need to install it on your PC. If you
    follow the link from the Graphics menu, the installation process will begin.


    ![](img/773dce76f7b88c1faa45d71937dc4026_37_0.png)


    +   *   The installer will lead you through a series of configuration screens
    until the end of the process has been reached.

    +   *   Once installed, you will find that The Gimp has many capabilities. It
    can be used as a simple paint program, a professional-level photo retouching program,
    an online batch processing system, an image renderer, and a tool that can be used
    to convert image formats.


    # Personal GIMP Directory


    ![](img/773dce76f7b88c1faa45d71937dc4026_37_1.png)


    For a proper GIMP installation, a subdirectory named /gimp-1.1... needs to be
    on your system. This subdirectory will contain a number of files and subdirectories
    that help GIMP know your system. For more information about this subject, see
    the online Help manual.


    # Monitor Resolution


    To display images in their natural size, GIMP needs to know your monitor''s resolution.
    GIMP can obtain this information from the X window system. However, usually this
    does not give useful values.'
  merge: -1
  img_proc: true
