- pgno: 19
  md: '# WINDOW MANAGERS


    X-based desktop managers provide the graphical interface between your input (via
    keyboard/pointing device) and what happens on your monitor. Some window managers
    look and feel like Microsoft Windows and all are highly customizable. These programs
    manage the placement of windows including positioning, overlapping, and iconizing.


    ![](img/773dce76f7b88c1faa45d71937dc4026_19_0.png)


    # DESKTOP ENVIRONMENTS


    +   * The two leading desktop environments are GNOME and KDE. Gnome (GNU Network
    Object Model Environment), which were developed as open source software.

    +   * KDE (the K Desktop Environment) was built using a GUI toolkit called Qt
    and KDE also widely used.

    +   * Both desktop environments are supplied with Red Hat Linux. They are also
    available with most other popular distributions.

    +   * Certain window managers are incompatible with some desktop environments,
    but the relevant sites will provide the necessary advice.


    ![](img/773dce76f7b88c1faa45d71937dc4026_19_1.png)'
