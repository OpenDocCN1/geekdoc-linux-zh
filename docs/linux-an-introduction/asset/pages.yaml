- pgno: 31
  md: "# GNOME Applets\n\nGNOME applets are mini-applications that are operated from\
    \ controls that sit in the GNOME panel. The default installation of GNOME with\
    \ Red Hat Linux includes dozens of useful applets, but it is left to you to choose\
    \ the ones you would like to place on your GNOME panel. Most of these applets\
    \ can be customized if you right-click the applet on the panel and choose the\
    \ appropriate options from the on-screen, pop-up menus.\n\n# ADDING ITEMS TO THE\
    \ PANEL\n\n+   - To add an applet to the GNOME panel, right-click on a blank part\
    \ of the panel, choose **Applets** from the pop-up menu and then select the item\
    \ from the appropriate submenu. You can also choose the Applet menu directly from\
    \ the main GNOME menu. \n\n+   - This example shows the CD Player applet being\
    \ selected and added.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_31_0.png)\n\n\
    ![](img/773dce76f7b88c1faa45d71937dc4026_31_1.png)\n\n# CHARACTER PICKER\n\n+\
    \   - The Character Picker applet enables you to copy and paste special characters,\
    \ such as accented letters and math symbols, into your document irrespective of\
    \ the particular application that you are using.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_31_2.png)\n\
    \nThe Character Picker applet"
  merge: -1
