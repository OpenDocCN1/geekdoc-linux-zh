- pgno: 13
  md: '# ## Why Try Linux?


    Defining the pros and cons of Linux depends on a number of variables. What kind
    of hardware will you be running Linux on? What peripherals, such as printer, modem,
    and monitor, will you be using? What software applications do you intend to run
    under Linux? Will you be running your distribution of Linux on a network or using
    it on a standalone workstation? How experienced a PC user are you? However, the
    following points apply generally to the use of Linux.


    # ### THE PROS


    +   * **MULTITASKING**

    +     Linux will run a large number of programs concurrently.

    +   * **MULTIUSER**

    +     Linux can support multiple users concurrently, which is very important for
    networks, or non-concurrently. This means that multiple users can log in to the
    same computer and use it as though it were exclusively theirs. Own computer Access
    to each individual''s files is password-protected and all other users'' files
    are invisible.

    +   * **SECURITY**

    +     Linux is highly regarded for its security features. Only the system administrator
    is allowed to make system-level changes, such as installing software, or making
    changes to individuals'' access privileges. It is also claimed that Linux is virus-free.


    +   * **FREE AND OPEN SOURCE**

    +     Linux is open source software and free of charge. One advantage of open
    source software is the speed with which fixes for problems are created and made
    available, usually online.

    +   * **MODULAR**

    +     Because Linux is based on modules, it can be stripped down from its most
    sophisticated forms, which require hundreds of megabytes of disk space, to run
    from just a floppy disk.


    +   * **SHARING WITH OTHER SYSTEMS**

    +     Linux can coexist on the same computer as other operating systems. For example,
    you can choose to boot either Linux or Microsoft Windows on the same PC.

    +   * **DEVELOPERS TOOLS**

    +     Linux is bundled with a wealth of development tools for programmers. The
    version of Red Hat Linux featured in this book comes with C, C++ , Perl, and Python.

    +   * **NETWORKING**

    +     Linux provides an ideal environment to run web and FTP servers. As Linux
    is based on the UNIX operating system, its networking capabilities are excellent.


    7 What is Open Source?'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# THE CONS


    # INSTALLATION PROBLEMS


    Most of the initial problems are likely to relate to installing and setting up
    Linux unless someone else set it up for you. However, you won''t be able to install
    new applications or make system-level changes unless you are in possession of
    the administrator''s password.


    # EXPERIENCE REQUIRED


    Installing Linux is not for beginners. The supplied installation software is usually
    very good, but you may hit a problem that requires previous experience of operating
    systems other than Windows. For example, if you are uneasy about identifying the
    specification of your


    monitor or running a command from an on-screen prompt, you may want someone else
    to install the software. You may even need to seek help from a help line, or an
    online support group .


    # NOT ENOUGH UNDER THE HOOD


    If your PC is old, slow, and has limited capacity, you will have problems running
    Linux-based software. With an underspecified PC, you will be very lucky to have
    a graphical desktop, and commands will take a long time to execute.


    # PROBLEMS WITH PERIPHERALS


    Your peripherals may not work under Linux and it is an unfortunate fact that,
    no matter how long you wait, a solution may never arrive.


    Most problems involve


    products designed to run specifically under Windows. For win-modern, for example,
    use Windows software to replace certain electronic components within the modem''s
    hardware. Linux does not compensate for these missing components in the same way
    as Windows, and there is no guarantee that it ever will.


    # SOFTWARE AVAILABILITY


    Due to the non-commercial nature of the world of Linux, some software will not
    be available for Linux, and there is no firm guarantee that it will become available
    eventually. For example, at the beginning of 2001, Microsoft''s Office suite and
    Internet Explorer were not available for Linux.


    # GETTING HELP


    When you run into difficulties with Linux, run a search in any search engine for
    "Linux help". You will find an astonishing amount of


    useful material on the web. This will include links to bulletin boards and mailing
    lists where people are asking and answering the kinds of problems you may


    have. Remember also to search for Linux in your newspaper and visit any Linux
    newsgroups that you come across.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# ## HARDWARE REQUIREMENTS FOR LINUX


    While Linux can be run on other types of workstations, such as Macs and Amigas,
    this book is more suitable for users familiar with Microsoft Windows run on IBM-compatible
    PCs. We also concentrate on Linux for the standalone computer, leaving aside its
    considerable capabilities for handling networks. This book is largely intended
    for the curious beginner with experience of Windows rather than the programmer
    or experienced network user.


    # ### REQUIREMENTS FOR RUNNING LINUX


    +   * You can run Linux on an ancient 386, but if you will have to run all your
    programs and commands from the command prompt. However, to use a Windows-type
    graphical desktop, you will need at least a fast 486 processor, and preferably
    a high-end Pentium processor

    +   * Specifications naturally vary depending on what you intend to run under
    Linux. Simple word processing and spreadsheet applications will require much less
    processor power than the serious number-crunching required by most graphics applications
    and the latest 3-D games. If you needs are very slight, you can even find stripped-down
    versions of Linux that will load from a single floppy disk.


    ![](img/773dce76f7b88c1faa45d71937dc4026_15_0.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_15_1.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'For a dual-boot installation of Linux (Linux + Windows), leave plenty of space
    for the applications you will install later. If you also want to share your computer
    with others, leave sufficient space for the other users. However, as administrator,
    only you will be able to install new applications.


    ![](img/773dce76f7b88c1faa45d71937dc4026_16_0.png)


    Note: Search the LDP mailing list archives at http://linux.scsyr.edu/docs/


    The Linux Documentation Project at www.linuxdoc.com is a site to note. A search
    for “dual boot” returned 199 hits.


    # LINUX INSTALLATIONS


    These three specifications would enable the installation of Linux with a graphical
    Windows-like desktop and a typical combination of utilities and applications.


    # LOW SPECIFICATION


    40386, 8 MB RAM, 540 Mb free hard-disk space.


    # ACCEPTABLE CONFIGURATION


    +   * Pentium, 32Mh RAM, 850Mb hard-disk space.


    # RECOMMENDED SETUP


    +   * Pentium processor, 200MHz minimum, at least 32Mb RAM, at least 1500Mb hard-disk
    space.


    # ALSO REQUIRED


    +   * CD-ROM drive. Floppy disk-based installers exist, but most distributions
    occupy at least one CD.

    +   * Supported video card. If you are intending to install Linux on an older
    PC, you must check whether your hardware is supported by Linux.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# # LINUX DISTRIBUTIONS\n\nWhen people refer to Linux, they are generally referring\
    \ to the bundle of software, code, and documentation that companies such as Debian\
    \ and Red Hat sell as a “distribution.”\n\n# ## WHAT’S ALL THIS JARGON?\n\nLinux\
    \ can seem heavy on the jargon—especially for beginners—with terms such as X Windows,\
    \ desktop environments, file managers, X servers, and GUIs. While it is not essential\
    \ to understand how all the components fit together, it is useful to be familiar\
    \ with the basic terminology.\n\nSimilarly, you don’t have to be a mechanic to\
    \ drive a car, but it helps to know what all the main parts are called, and it\
    \ is always useful to be able to carry out some routine maintenance. These pages\
    \ introduce some of the terminology you will encounter when reading about Linux.\n\
    \n# ### THE KERNEL\n\nAt the heart of Linux is the kernel. This is the code that\
    \ is loaded before anything else when you launch Linux, and is unloaded last when\
    \ you halt the system. On its own, the kernel doesn’t appear to do very much,\
    \ but without it, nothing gets done. The kernel acts as the main link between\
    \ your hardware and all the programs that run under Linux. It also handles crucial\
    \ background tasks such as managing the memory and multitasking.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_17_0.png)\n\
    \n# #### The Linux Kernel HOWTO\n\nBrian Ward bri@cs.uchicago.edu\n\nv1.25, 28\
    \ Mar 2001\n\n*This is a detailed guide to kernel configuration, compilation,\
    \ upgrades, and.*\n\n+   1. **Introduction**\n+       1. Read this first. (1 min.95)\n\
    +       2. Good for 1.2.x, 2.2, and 2.4 kernels.\n+   2. **Quick Steps – Kernel\
    \ Compile**\n+   \n+   Everything about the Linux kernel is in Brian Ward’s work\
    \ at www.linuxdoc.org/HOWTO/Kernel-HOWTO.html."
  merge: -1
  img_proc: true
- pgno: 18
  md: '# THE TOOLS


    +   * Linux tools are a group of programs between the kernel and the software
    that displays Linux on the desktop. One of the most important tools is the C/C++
    compiler. This tool compiles a program written in C or C++, and turns the code
    into an executable program that can be run by Linux.


    # THE APPLICATION

    SOFTWARE


    +   * In its raw state, Linux does not need a GUI to enable it to work. Here,
    however, we concentrate on the graphical applications that enable Linux to run
    as a window-based operating environment.


    # X WINDOWS


    +   * The X Window system is used to set up an “X server” on your computer. This
    holds information about the capabilities of your graphics card and display.


    # About This Page


    Here are some C and C++ libraries, DLLs, source code, components, frameworks,
    class libraries, source code snippets, and the like. Pay no attention to the license
    terms in this section, as they are the same (or similar) to the license terms
    of any of the other sections in this book. Be sure to read the license notes under
    your distribution.


    Free tools, libraries, and C/C++ utilities are available at www.thefreecountry.com/develop/ptty/freeclibraries.shtml.


    ![](img/773dce76f7b88c1faa45d71937dc4026_18_0.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_18_1.png)'
  merge: -1
