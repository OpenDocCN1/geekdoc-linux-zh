- pgno: 59
  md: '# **ONLINE WITH LINUX**

    If you are connecting to the internet using Linux and already have an account
    with an Internet Service Provider, you will have few problems, provided you know
    the necessary settings.


    # ESTABLISHING A CONNECTION


    Setting up a new connection means that you will be making changes that affect
    the way your computer functions. This means that you will be prompted to provide
    the administrator''s (root) password. Without this, you will not be able to proceed.


    # **START THE PROCESS**

    • The first step in beginning the connection process is to double-click the **Dialup
    Configuration** icon on the desktop.


    ![](img/773dce76f7b88c1faa45d71937dc4026_59_0.png)


    # **ADDING A NEW CONNECTION**

    • The first Add New Internet Connection panel opens. All you should need to do
    from this point onward is to type the necessary details into each window and dialog
    box when prompted, and then click on Next.


    ![](img/773dce76f7b88c1faa45d71937dc4026_59_1.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: "# THE KDE ALTERNATIVE\n\nIn the KDE desktop environment, as opposed to GNOME's\
    \ desktop, the kppp Internet configuration software is supplied with Red Hat Linux,\
    \ and\n\nprovides an alternative to GNOME's Dialup Configuration software.  \n\
    Both are equally effective but you can't mix the desktops with the configura-\n\
    \ntions. In other words, if you principally intend to use the GNOME desktop environment,\
    \ stick with the Dialup Configuration tool.\n\n# INFORMATION YOU WILL NEED\n\n\
    Be sure to have made a list of the following information before you begin setting\
    \ up your Internet account. This information should be provided by your Internet\
    \ Service Provider (ISP), particularly if you have previously connected\n\n+ \
    \  using their proprietary software:\n+   * The ISP's dial-in telephone number\
    \ (for accessing the Internet)\n+   * Your user name\n+   * Your password\n+ \
    \  * Mail server addresses\n+   There will usually be two of these: one for incoming\n\
    \n+   mail (e.g., pop3.yourisp.com) and one for outgoing mail (e.g., smtp.yourisp.com)\n\
    +   * Your password (for your mail) server (a second password is sometimes required\
    \ by some ISPs to collect your mail)\n+   * News server name.\n\n# CONFIGURING\
    \ A MODEM\n\nIf you have a modem attached to your PC (or installed inside it),\
    \ but it has not been automatically detected and configured during installation\
    \ of Linux, the Select Modem window will open at this point as Red Hat Linux attempts\
    \ to auto-detect it.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_60_0.png)"
  merge: -1
  img_proc: true
- pgno: 61
  md: '# S8 · ONLINE WITH LINUX


    * Make sure your modem is switched on and connected to the telephone socket. When
    the modem is found, you are given the options either to adjust the settings or
    to accept the device as detected. If no modem has been detected, you can attempt
    to set it up by inputting the settings provided in the modem''s manual. In some
    cases, your modem may not work under Linux


    ![](img/773dce76f7b88c1faa45d71937dc4026_61_0.png)


    * If you have a fully configured modem, the auto-detect procedure will be unnecessary.
    After the modem has been confirmed as fully functional, and you have all the necessary
    information relating to your ISP, the Dialup Configuration procedure should take
    only a few minutes.


    ![](img/773dce76f7b88c1faa45d71937dc4026_61_1.png)


    * If you have set up an internet account in the past using Windows 95 (or higher)
    you will find that the procedure using Dialup Configuration in GNOME is very similar.


    ![](img/773dce76f7b88c1faa45d71937dc4026_61_2.png)


    # Problems with Peripherals'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   • Once the procedure is completed, you can click on Add to add any accounts
    with other ISPs you may have. Finally, click on Close to complete Dialup Configuration.


    ![](img/773dce76f7b88c1faa45d71937dc4026_62_0.png)


    # ## Connecting to the Internet


    You can connect to the internet by choosing RH PPP Dialer from the GNOME panel.
    You can place the Modem Lights applet on the GNOME panel for a fast access to
    an internet on/off button, and a monitor that shows some useful information about
    the current state of your connection.


    # ### Placing the Applet On the Panel


    Lights applet on your GNOME panel, begin by selecting Panel, then Add to panel,
    Applet, Network, and finally choose RH PPP Dialer.


    +   • To place the Modem


    ![](img/773dce76f7b88c1faa45d71937dc4026_62_1.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# CONTROL YOUR

    CONNECTION


    The Modem Lights

    applet lets you connect

    and disconnect by clicking

    on the single green light

    in the center. You can

    also constantly monitor

    the status of your modem.

    ■ To the left of the on/off

    button, the upper display

    shows data transmission

    rates; the lower display

    relates to data received.


    ![](img/773dce76f7b88c1faa45d71937dc4026_63_0.png)


    The Modem Lights applet


    ■ To the right of the

    on/off button, the higher

    figure shows the total

    connection time. The

    lower figure shows the

    number of bytes read

    per second.


    ■ You can customize the

    applet by right-clicking

    on it and choosing

    Properties to open the

    Settings dialog box. Here,

    you can change a number

    of the applet’s settings.


    # INTERNET

    APPLICATIONS


    ■ The internet browser

    that is bundled with Red

    Hat Linux is Netscape

    Navigator, which is

    supplied with the Netscape

    Communicator suite of

    programs. At the beginning

    of 2001, Microsoft’s

    Internet Explorer was not

    available for Linux.


    ![](img/773dce76f7b88c1faa45d71937dc4026_63_1.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: '● Netscape Communicator provides an excellent suite of programs including web
    browser (Navigator), email client (Messenger), News-group client (Newsreader),
    and the web page editing


    software (Composer).

    ● To launch Netscape Navigator, click the **N** icon on the GNOME panel.

    ● Netscape Navigator works in Linux as it


    does in any other operating system. Web page addresses are coupled in the Location
    box and bookmarks can be used to revisit your favorite sites in the internet.


    ![](img/773dce76f7b88c1faa45d71937dc4026_64_0.png)


    # MORE INTERNET APPLICATIONS


    Red Hat Linux provides a collection of Internet programs as part of its standard
    installation. The number of internet applications available after installing Linux
    will depend on which distribution of Linux you use. In the case of Red Hat Linux,
    you will find at least a couple of CDJs containing additional programs – many
    of which will be internet-related. Using your internet connection, you will find
    an immense number of Linux applications available on the internet.


    # PROGRAMS VIA THE GNOME PANEL


    +   ● The internet programs immediately available with GNOME in this particular
    version of Red Hat Linux can all be accessed directly from the GNOME panel.

    +   ● The small selection here includes various news-readers, mail clients, Internet
    Relay Chat clients, Telnet clients, and Lynx, which is a text-based web browser.


    ![](img/773dce76f7b88c1faa45d71937dc4026_64_1.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# ONLINE WITH LINUX


    # IRC CLIENTS


    +   - Xchat is a no-frills Internet Relay Chat (IRC) client available with the
    GNOME desktop on Red Hat Linux. Many more feature-laden IRC clients and graphical
    chat programs are now available for use with Linux than there used to be. A search
    through the Linux section of software websites, such as www.tucows.com, will reveal
    many examples.


    ![](img/773dce76f7b88c1faa45d71937dc4026_65_0.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_65_1.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# MORE INTERNET APPLICATIONS - 63


    # FTP CLIENTS


    +   * FTP (file transfer protocol) clients provide a means of logging on to a
    remote site from your PC and transferring files to or from that site – provided,
    of course, that you have the appropriate access privileges required by the site.


    +   * Most anonymous FTP sites simply require your email address for permission
    to browse and download. This simple FTP client makes the process easy to grasp
    and execute.


    ![](img/773dce76f7b88c1faa45d71937dc4026_66_0.png)


    # SOTWARE UNLIMITED


    +   * Virtually limitless Linux software is available on the net. The Tucows software
    site carries a huge selection of software from every platform you can imagine.
    The Linux area is regularly updated, well-organized and definitely worth a visit.


    As well as the extensive download library, Tucows also provides a “Head of the
    Herd” feature, which


    reviews a piece of leading-edge software. The site also surveys new releases,
    lists top selections, has a news and editorial section, and provides a help center.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# INSTALLING SOFTWARE


    Installing software with Linux varies as much as with other operating systems,
    and depends on how the software has been written and on which installer routine
    the author has used.


    # THE MAIN RPM WINDOW


    The Gnome Red Hat Package Management system (RPM) is a graphical front-end to
    a system that provides a software control center. This RPM can:

    - Show you all software packages currently on your system


    +   - Enable you to add or delete packages

    +   - Enable you to check the contents and integrity of any package

    +   - Enable you to reinstall any package that does not appear to be functioning
    correctly.


    # RUNNING THE GNOME RPM


    +   - It may be useful to think of a “package” as the way in which software is
    conveniently bundled for ease of installation and access within Linux.

    +   - Installation often requires files to be installed in several different locations
    on your PC to function correctly. RPM helps you keep tabs on these files.

    +   - You can run the Gnome RPM from the Gnome Panel (as shown here) or directly
    from the command line if you prefer working with text-only commands.


    ![](img/773dce76f7b88c1faa45d71937dc4026_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# A FILE MANAGER WINDOW


    * The Gnome RPM window displays the packages on the computer by arranging them
    into groups in the left-hand panel under **Packages**. * The right-hand panel,
    the contents of a group highlighted on the left appear as icons. To find out more,
    or to carry out any actions on a package, click its icon and then click the relevant
    toolbar button.


    ![](img/773dce76f7b88c1faa45d71937dc4026_68_0.png)


    # INSTALL AND UNINSTALL BUTTONS


    * The Install and Uninstall buttons add or remove the package from your system.
    Once a package has been uninstalled, it is removed from the Gnome RPM.


    ![](img/773dce76f7b88c1faa45d71937dc4026_68_1.png)


    # QUERY BUTTON


    * Clicking the Query button on the toolbar opens a Package Info dialog box, which
    gives information about the selected package. * In this dialog box, you will find
    a row of buttons along the bottom that can be used to perform operations, such
    as install/uninstall or query, on individual packages.


    ![](img/773dce76f7b88c1faa45d71937dc4026_68_2.png)'
  merge: -1
  img_proc: true
- pgno: 69
  md: '**VERIFY BUTTON**

    Clicking the Verify button in the Package Info dialog box checks the integrity
    of the files that make up a selected package and ensures that none has been tampered
    with or corrupted.


    ![](img/773dce76f7b88c1faa45d71937dc4026_69_0.png)


    # ## LOCATING WHAT YOU WANT


    There are three main sources of software for Red Hat Linux: first, the collection
    of CD-ROMs supplied with the boxed


    distribution, second, the CD-ROMs given away with some magazines and books, and
    third, the libraries on the internet.


    # **SOFTWARE FROM THE DISTRIBUTOR''S CD**


    +   * When you insert a CD supplied with the boxed Red Hat distribution, a dialog
    box asks if you want to auto-mount the CD-ROM. Choose Yes, and the Install window
    opens.

    +   * Initially, the packages that are currently installed on your PC are shown.

    +   * To view the CD''s contents you need to click the **Install** button.

    +   * The CD''s contents now begin to appear in the Install window. To view these
    contents more easily, click on the Expand Tree button.


    ![](img/773dce76f7b88c1faa45d71937dc4026_69_1.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# USING THE QUERY BUTTON


    You will make most use of the Query button when exploring the contents of a CD.
    Although the software on the CD is grouped into categories, you will want to know
    more about a package before installing it on your PC.


    +   Highlight the files you are interested in, check the boxes next to them, and
    then click on the Query button.


    +   Information relating to each file appears in a separate panel within the Package
    info panel that opens.


    ![](img/773dce76f7b88c1faa45d71937dc4026_70_0.png)


    If you decide to proceed with the installation from the CD, click on the Install
    button. You can follow the progress of the installation in the Installing window.


    ![](img/773dce76f7b88c1faa45d71937dc4026_70_1.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_70_2.png)'
  merge: -1
  img_proc: true
- pgno: 71
  md: "# SOFTWARE FROM\nTHE INTERNET\n\n+   • If you are connected to the internet,\
    \ the Gnome RPM offers a very useful net filedown loader, Rpmfind, which you can\
    \ access from the main RPM window.\n+   \n+   • To access this facility, click\
    \ on the Web Find button. This launches the Rpmfind window.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_71_0.png)\n\
    \n+   • The first time you use the Rpmfind window, you are connected to an FTP\
    \ site that holds the RPMfind database. This downloads a list of packages that\
    \ appear in the left hand panel under Name and Distribution. Each time you click\
    \ a plus sign to reveal a submenu, more information is downloaded from the database.\
    \ In this way, you can access every package that is contained in the database.\n\
    +   \n+   • To search the database, type a string term in the box at the top of\
    \ the window and click the Search button. A list of hits appears in the left-hand\
    \ panel. You can treat these as any other packages within RPM by clicking any\
    \ entry, followed by the Query button to find out more.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_71_1.png)"
  merge: -1
  img_proc: true
- pgno: 72
  md: '# WHERE HAS MY SOFTWARE GONE?


    **DOWNLOADING THE SOFTWARE**


    • When you click on


    install, the package is installed onto your PC, and it becomes accessible


    through the RPM in the same way as all the other packages on your PC.


    ![](img/773dce76f7b88c1faa45d71937dc4026_72_0.png)


    # WHERE HAS MY SOFTWARE GONE?


    This isn’t quite such a naïve question as it might sound. Newly installed software
    does not necessarily always install symlinks (shortcuts, as Windows calls


    them) in the Gnome panel. This means that, once having installed a package, you
    may find yourself not completely sure about how to launch the program.


    # COMPLETING THE INSTALLATION


    +   • In the example shown here, the internet application called **Payment Client
    2.1** does not fully auto-install. This is typical of many packages in that it
    requires some action by you before it is fully configured and ready to use.


    +   • To find out what to do next, you need to locate the **Read me** file, which
    you will usually find in an appropriately named directory within the *usr/share*
    directory on your hard


    ![](img/773dce76f7b88c1faa45d71937dc4026_72_1.png)


    drive. In this case, it reveals that some simple, post-installation configuration
    is


    required by the user. This is far from being unusual with package installations.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# # GLOSSARY


    **C** The name of a programming language designed during the early 1970s and used
    to reinplement Unix.


    **CLIENT** The client of the program, or end of a system, which is receiving the
    service being provided.


    **COMPILE** To turn a program source code into an executable machine code file,
    which cannot be read by any human.


    **DEBIAN** A free, open source, operating system for a computer that uses the
    Linux kernel.


    **DISTRIBUTION** A combination of a Linux kernel, a suite of command programs,
    and other software for installing and maintaining a Linux system.


    **DRIVER** Computer code that translates device-independent instructions into
    commands that a real device, such as a disk drive or a printer, can understand.


    **GIMP** The "GNU Image Manipulation Program" is free software suitable for manipulating
    images.


    **GNOME** A desktop manager providing a range of tools to support window managers.


    **GNU** "GNU is Not Unix" refers to the GNU operating system begun by the Free
    Software Foundation to create a free operating system.


    **GRAPHICAL USER INTERFACE (GUI)** Allows the user to interact with a computer
    system in a visual manner with a minimum of typing.


    **HOME DIRECTORY** A directory provided to store the personal files and directories
    of a user.


    **HTML** "Hypertext Markup Language" is the form in which web documents are transmitted
    and interpreted by browsers.


    **ISP** "Internet Service Provider" is an organization that provides people with
    networked access to the internet.


    **IRC** "Internet Relay Chat" is a wordwide, online "party line" network that
    allows conversations to take place in real time.


    **KDE** A project to make Linux more user-friendly by providing a GUI interface,
    or desktop, between the user and Linux.


    **KERNEL** The core of an operating system that contains the most primitive functions
    on which more sophisticated functions depend.


    **MODULE** A piece of the kernel that performs a specific task.


    **MS-DOS** The "Microsoft Disk Operating System" installed by IBM on their first
    personal computers.


    **MOUNT** This command allows the contents of a disk to be placed in a subdirectory
    of a file system.


    **OPEN SOURCE** Software for which the source code is freely available, to be
    used, changed, and redistributed.


    **OPERATING SYSTEM** The essential software of a computer that schedules tasks,
    allocates storage, and provides an interface between the user and applications.


    **PPP** "Point-to-point protocol", is the most popular way of connecting a computer
    to the internet via a dialup modem.


    **ROOT** The specially privileged account on a computer system that has absolute
    control over it.


    **SOURCE CODE** The readable text that programmers create. Source code is compiled
    for use and is then unreadable. Source code for non-free software is kept secret
    while the source code for free software is always available for anyone to fix
    or improve.


    **URL** "Uniform Resource Locator" is an address that identifies a document or
    computer on the world wide web.


    **WINDOW MANAGER** A program that manages a graphical user interface by determining
    the appearance of windows and the response to input by the user.


    **X WINDOWS** This graphical user interface manages all user activity and is accessed
    by programs to provide their display requirements.'
  merge: -1
  img_proc: true
