    +   ☑ Toolbars have **line**


    StatusBar Options


    +   ☑ StatusBar **is** **interactive** **when** **possible**

    +   ☑ StatusBar progress meter on the right


    *User Interface menu options.*


    ![](img/773dce76f7b88c1faa45d71937dc4026_58_0.png)


    # FILE MANAGER PREFERENCES


    • One way to access the preferences for the Gnome File Manager is to right-click
    on the desktop and choose **Desktop Properties** from this pop-up menu that appears
    on-screen.


    ![](img/773dce76f7b88c1faa45d71937dc4026_58_1.png)


    • **The Preferences** dialog box opens. It comprises five tabs: **File Display**,
    **Confirmation**, **VFS**, **Caching**, and **Desktop**. The Desktop settings
    determine the positioning and appearance of text and icons on the desktop.'
  merge: -1
