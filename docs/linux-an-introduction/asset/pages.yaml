  md: "# **WHAT DO I GET?**\n\n+   - Your choice of Linux distribution will depend\
    \ on your assessment of the quality of the vendor's installation program, documentation,\
    \ and after-sales support.\n+   - The Linux bundle always contains the Linux kernel\
    \ and a range of the following components:\n+   \t- Desktop manager\n+   \t- At\
    \ least one text editor\n+   \t- Paint program\n+   \t- Web browser\n+   \t- Multimedia\
    \ tools\n+   \t- Utilities\n+   \t- Games\n+   \t- Programmers' tools\n+   - Many\
    \ distributions will also provide:\n+   \t- Technical support\n+   \t- CDs of\
    \ third-party applications, full versions of the StarOffice suite are bundled\
    \ with Suse and Red Hat Linux\n+   - You will also be supplied with manuals, sometimes\
    \ running to several thousand pages.\n+   - You can find an up-to-date list of\
    \ the main Linux distributions, including descriptions and links to the websites\
    \ of the developers, on the excellent *Linux online* website at www.linux.com\n\
    \n# **WHERE DO I GET IT?**\n\n+   time. Downloading Linux, even with only a fraction\
    \ of the related applications and documentation, can be lengthy. And your online\
    \ connection must be reliable because you don't want it dropping part way through\
    \ a download. Also, you must know exactly what you're doing if you decide to download\
    \ the kernel and build a version of the operating system from this\n+   \n+  \
    \ **BUY IT ON CD**\n+   - Some vendors sell a CD containing the bare bones of\
    \ a distribution, as downloaded from the net, for a couple of dollars. This gives\
