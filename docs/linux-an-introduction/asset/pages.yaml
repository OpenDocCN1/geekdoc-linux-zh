- pgno: 43
  md: '# # THE FILE MANAGER


    > Managing files in GNOME has much in common with the Windows and Mac environments,
    but some features will be more familiar to those with UNIX experience.


    # ## USING THE FILE MANAGER


    This chapter looks at how to select, move, copy, and delete files and directories
    using the GNOME File Manager. It also looks at


    the differences between GNOME and the Windows and Mac interfaces in accessing
    the floppy disk and CD-ROM drives.


    # ### WORKING FROM HOME


    +   * When you create and save a new file as user rather than superuser (i.e.,
    root), by default the file is placed in a subdirectory of the Home directory named
    for your user name. In this example, the user''s name is alba, so the subdirectory
    has the pathname: /home/alba.

    +   * To open this directory at any time, double-click on the Home directory icon
    on the GNOME desktop.

    +   * To open the File Manager window, choose File Manager from on the Programs
    menu on the GNOME panel.


    ![](img/773dce76f7b88c1faa45d71937dc4026_43_0.png)'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# **FILE MANAGER KEY**


    **Left-hand side**

    The left-hand side of the window displays directories and subdirectories. The
    contents of the highlighted directory appear in the right-hand side of the window.

    Click on an + to expand the directory tree and - to contract the directory tree
    in the left-hand side of the File Manager window.


    **Right-hand side**

    This side shows the contents of the directory highlighted on the left of the window
    (i.e., files and subdirectories).


    **Location box**

    If you want the pathname (directory/subdirectory), type it here and press [Enter].
    To get directory directly in the File Manager window. If you are connected to
    the internet, you can type an FTP site address in the Location box. The File Manager
    will then become an FTP client application.


    **Right Toolbar Buttons**

    These buttons change the view in the right side. For example, Brief shows only
    the file or subdirectory name and no other details.


    **Left Toolbar Buttons**

    These navigation buttons take you to backward through directories in a list, or
    up to a higher directory from a subdirectory.


    **The Rescan Button**

    The Rescan button re-displays the contents of the directory currently within the
    window, reflecting any change to the list of contents that has recently occurred.


    **The Home Button**

    Clicking the Home button changes the active directory to the *Home* directory.


    ![](img/773dce76f7b88c1faa45d71937dc4026_44_0.png)'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# **MOVING AND CREATING**


    When you create or save a file it will be added to your Home directory by default.
    Most of the file management that you will need to carry out, such as copying,
    saving, moving, and deleting files, is likely to center on this directory.


    +   **CREATING A NEW DIRECTORY**

    +   * To create a new directory, right-click in the blank part of the File Manager
    window and click New Directory on the pop-up menu that appears. Then type a name
    for the new directory in the Create a new Directory dialog box and click on OK.


    ![](img/773dce76f7b88c1faa45d71937dc4026_45_0.png)


    +   **MOVING FILES AND DIRECTORIES**

    +   * To move files and directories within the File Manager, begin by displaying
    them in the right-hand panel, highlight those you intend to move and drag them
    from the right-hand side over to the appropriate directory on the left. When the
    directory is highlighted, release the mouse button and the files will be moved
    accordingly.


    ![](img/773dce76f7b88c1faa45d71937dc4026_45_1.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # Using SYMLINKS


    In the GNOME desktop environment, a symlink (symbolic link) points to a file or
    directory that you can either place on your desktop, in a GNOME panel, or in any
    other folder in the File Manager. The


    symlink is similar to the shortcut in Windows or the alias in the Apple Mac operating
    system. You can rename, move, or delete the symlink without affecting the file
    or directory that it points to.


    # ## CREATING A SYMLINK


    +   To create a symlink, right-click on the file or folder that you want to link
    to in this example, the file **Story - ideas** is to have a symlink pointing to
    it.


    ![](img/773dce76f7b88c1faa45d71937dc4026_46_0.png)


    +   After choosing Symlink from the drop-down menu that appears, the Symbolic
    Link dialog box opens. Type the path and filename for the file in the Existing
    filename text box. In the Symbolic link filename text box, enter the name that
    the symlink is to have. In this example, **Story ideas** is to be a symlink in
    the same directory as the file called **Story - ideas**. Click on OK.


    ![](img/773dce76f7b88c1faa45d71937dc4026_46_1.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 4 • THE FILE MANAGER


    The symlink appears in the directory window.

    Double-clicking on this link will now open the main file.


    ![](img/773dce76f7b88c1faa45d71937dc4026_47_0.png)


    # DRAGGING TO THE GNOME PANEL


    All aspects of the GNOME desktop environment are highly customizable, as we have
    seen in earlier pages. If you intend to use any directory on your hard drive regularly,
    and would like to be able to access it directly from the GNOME desktop, you can
    arrange to access it directly from the GNOME panel. Simply drag its icon from
    the File Manager window over a suitably empty area of the GNOME panel and release
    the mouse button.


    # ACCESSING THE CONTENTS DIRECTLY


    To access the directory''s contents directly in future, click the icon on the
    GNOME panel. This example shows the Home directory (for the user called alba)
    transferred to the GNOME panel.


    ![](img/773dce76f7b88c1faa45d71937dc4026_47_1.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# ## ESSENTIAL KEYBOARD SHORTCUTS


    The following keyboard and mouse shortcuts are essential if you are to use the
    File Manager and GNOME desktop effectively.


    +   - [Ctrl]+ DRAG

    +     Hold down the [Ctrl] key while dragging a file


    +   - means that you copy that file (i.e. you move a copy of that file rather
    than the file itself).

    +   - [Ctrl]+ CLICK

    +     Use [Ctrl]+ click to select a range of files within the right window. If
    you


    +   - intend to use this method, it is preferable not to view by icon.

    +   - [Ctrl]+ CLICK

    +     To select or deselect a single file from a group, hold down the [Ctrl] key
    while clicking on the appropriate file.


    # ## THE RIGHT-CLICK POP-UP MENU


    Using the right mouse button, one of the most useful shortcuts you can employ
    in GNOME. When you right-click on a file or an applet, a menu appears offering
    most of the main options that you will need to use.

    - Open a file.

    - Open with Enables you to determine which application to use for opening that
    particular file, or file-type.

    - Edit to amend the file.

    - Copy This produces a dialog box in which you type the new location to which
    the file is to be copied.

    - Move to trash

    - Delete This option completely bypasses the


    possibility of retrieving a file, which is offered by first moving an item to
    the trash can.

    - Move A dialog box opens in which you enter the new location for the file.

    - Panel This submenu contains various items, including submenus for adding and
    removing panels and applets.


    - Symbolic link This enables you to create a symbolic link, which is broadly equivalent
    to a shortcut in the Windows or an Alias on the Mac operating systems.

    - Properties The Properties dialog box contains three tabs, each opening a page
    containing statistics, options, and permissions, which relate to who is able to
    edit, copy, or delete the file.


    ![](img/773dce76f7b88c1faa45d71937dc4026_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# ACCESSING OTHER DRIVES


    Linux shows all the directories in one

    directory tree, irrespective of what drives

    they are found on. There are no drive

    letters in Linux; the contents of all disks


    simply appear as subdirectories. Also, the

    content of removable disks does not

    appear automatically; the drives first have

    to be "mounted" to view their contents.


    # THE DISK ICONS


    +   • The icons representing

    +   the floppy disk and CD-

    +   ROM disc drive appear in the

    +   lower left-hand corner

    +   of the desktop. These icons

    +   are symbolic links to the

    +   directories **mnt/floppy** and

    +   **mnt/cdrom** respectively.


    ![](img/773dce76f7b88c1faa45d71937dc4026_49_0.png)


    # MOUNTING THE

    FLOPPY DISK DRIVE


    +   • Before you can view the

    +   contents of a floppy disk

    +   after inserting it into the

    +   appropriate drive, you

    +   need to mount the drive.

    +   Do this by right-clicking

    +   the relevant drive icon

    +   on the desktop and

    +   choosing **Mount device**

    +   from the pop-up menu.


    ![](img/773dce76f7b88c1faa45d71937dc4026_49_1.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# UNMOUNTING

    A DISK DRIVE


    e

    When you remove the floppy disk and insert another, you will not immediately see
    the contents of the new floppy disk. With other operating systems, you usually
    have to


    use a command to rescan the contents of the disk drive. With GNOME, however, you
    always need to select Unmount device before removing a floppy disk, and then mount
    the new disk. If you simply


    rescan the drive using the


    appropriate File Manager button without unmounting/mounting, you will only see
    the contents of the first floppy disk. If you physically remove a disk before
    you have unmounted it, you risk losing the data on it.


    ![](img/773dce76f7b88c1faa45d71937dc4026_50_0.png)


    # CD-ROM DRIVE


    e When you insert a CD- ROM disc in the CD-ROM drive using GNOME, an icon will
    usually appear on the desktop and the File Manager will launch with the CD-ROM
    directory open, showing the disc''s contents. This example shows the contents
    of one of the CDs bundled with some versions of Red Hat Linux.


    ![](img/773dce76f7b88c1faa45d71937dc4026_50_1.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# SYSTEM CUSTOMIZING


    With the GNOME Control Center you can configure many

    aspects of your desktop and your system – from the desktop

    background to icons that occupy it.


    # THE GNOME CONTROL CENTER


    Beyond configuring your desktop and

    system, you can personalize the smallest

    features of the windows and menus that

    you work with by using a collection of

    tools within Linux, known as “capplets,”

    which stands for “Control Center applets.”


    # ACCESSING THE

    CONTROL CENTER


    +   • Most of the customiz-

    +   ation that you are likely

    +   to carry out is done

    +   through the GNOME

    +   Control Center.

    +   • There are three ways to

    +   access the Control Center:

    +   1 Via the Settings menu.

    +   2 Via the GNOME

    +   Configuration tool.

    +   3 Via a GNOME Control

    +   Center option on the

    +   submenu of the Settings

    +   menu. From this submenu

    +   you can access a number of

    +   configuration options.


    ![](img/773dce76f7b88c1faa45d71937dc4026_51_0.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_51_1.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The Control Center then opens. To access any of the Control Center tools, click
    on the appropriate entry in the left side of the window and the workspace on the
    right will fill with the relevant controls. If you have used operating systems
    such as Windows 98 or the Mac OS, you will be reasonably familiar with many of
    the configuration options you will find in the GNOME Control Center.


    +   * The GNOME Control Center contains seven main groups of controls:

    +       * Desktop

    +       * Document Handlers

    +       * Multimedia

    +       * Peripherals

    +       * Sawish Window Manager

    +       * Session

    +       * User Interface

    +       * All these offer submenus, each of which contains many configuration
    options. Most of these give you the opportunity to test your changes before accepting
    them as final.


    ![](img/773dce76f7b88c1faa45d71937dc4026_52_0.png)


    If you have made some changes without finally accepting them (i.e., you have clicked
    on the Try button rather than OK) and you then attempt to quit the Control Center,
    a Warning box appears giving you a chance to Discard all changes, listing all
    modules that you have modified.


    ![](img/773dce76f7b88c1faa45d71937dc4026_52_1.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The next pages show just a few of the dozens of tools, or applets, that are
    available via the GNOME Control Center, beginning with the area that everyone
    usually decides to personalize first - the GNOME desktop.


    # DESKTOP: BACKGROUND


    +   - The tools in the Control Center can be used to choose a background from
    an image file or from a solid color or a gradient. If you choose to opt for a
    gradient, you need to choose two colors and then specify how these are to be merged.

    +   - Here, as with most other controls, you are given options to try out your
    changes and revert to the original state if you do not like what you''ve done.


    ![](img/773dce76f7b88c1faa45d71937dc4026_53_0.png)


    # TRY IT FIRST


    To cancel the changes, click on the **Discard all changes** button in the Control
    Center''s Warning box. To confirm a change, double-click the highlighted entry
    in the list and make the modifications. These can then be confirmed by clicking
    OK in the *Options* window.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "# DESKTOP: PANEL\n\n+   - The Global panel properties dialog, shown here, gives\
    \ you options to change almost every aspect of the panel’s size, shape, texture,\
    \ and position.  \n+       - This example shows the buttons page. The drop-down\
    \ menus, that appear when you click the button next to Button type, gives you\
    \ a choice of four button types: Launcher, Drawer, Menu, and Special.  \n+   \
    \    - There are four other tabs at the top of the panel properties dialog called\
    \ Animation, Panel objects, Menu, and Miscellaneous. Most of the options that\
    \ are activated by these buttons and sliders are self-explanatory and you can\
    \ choose to try, accept or revert by clicking the\n\n![](img/773dce76f7b88c1faa45d71937dc4026_54_0.png)\n\
    \nappropriate button at the bottom of the panel window. However, you will not\
    \ be able to access some parts of this capplet (e.g., the system part of the Menu\
    \ page) unless you are logged in as root.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_54_1.png)\n\
    \n# ALTERNATIVE ACCESS\n\n+   - You can also access the above capplet from the\
    \ desktop. Begin by right-clicking on the GNOME panel at the foot of the screen,\
    \ choose: Panel from the pop-up menu, and then select Global Preferences from\
    \ the Panel submenu."
  merge: -1
  img_proc: true
- pgno: 55
  md: '# DESKTOP: THEME SELECTOR


    +   More than a dozen desktop themes are provided with GNOME, and you can preview
    or select any of them using the Theme Selector capplet.

    +   Clicking the Try button will transform the desktop into the theme that you
    have highlighted in the Available Themes box. If you click on the Preview button
    to the right of this box, the theme will only be applied to the material in the
    Preview box below, as shown in this example. If the Auto Preview button is depressed,
    you do not need to click the Preview button. This capplet also gives you the facility
    to install new themes, an ever- growing number of which are available on the net.


    ![](img/773dce76f7b88c1faa45d71937dc4026_55_0.png)


    # TWO FURTHER CAPPLETS


    **The Session Manager Capplet**

    This capplet allows you to control the GNOME Session Management, which specifies
    the programs that start up, how you save your GNOME configuration, and how you
    log out.

    **The GNOME Edit Properties Capplet**

    With this capplet, you can select which editor will be your default editor while
    using GNOME. This will allow applications like the GNOME File Manager to launch
    the correct editor when you try to open files associated with editing. All the
    popular text editors are included in the selection list.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# MULTIMEDIA: SOUND


    You can use the Sound caplet to set the sounds


    for a wide range of GNOME system events.


    First, click the Sound Events tab, then highlight an event to which you wish to
    attach the sound.


    ![](img/773dce76f7b88c1faa45d71937dc4026_56_0.png)


    - The **Select sound file** dialog box opens. Choose a sound for the event that
    you have highlighted, click on the **Browse** button, and navigate to the appropriate
    *.wav* file on your hard disk.

    You can preview this sound by clicking on the **Play** button in the Control Center
    window.


    ![](img/773dce76f7b88c1faa45d71937dc4026_56_1.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# **DESKTOP:

    WINDOW MANAGERS**


