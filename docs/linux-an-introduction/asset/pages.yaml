- pgno: 26
  md: '# UNIQUE APPLICATIONS


    At first sight, the Linux desktop may appear to have more similarities than differences
    with, for example, Windows. However, despite these superficial similarities, Linux
    has many features


    unique to itself. It also boasts many unique applets, which are applications and
    utilities only available with Linux. Most, if not all, of these applications have
    been written by independent


    programmers and released under the GNU Public License [1. For more information
    about the authors of these programs, choose About from the Help menus of the relevant
    application.


    ![](img/773dce76f7b88c1faa45d71937dc4026_26_0.png)


    # WHICH DESKTOP?


    Two desktop environments are provided with the version of Red Hat Linux featured
    in this book. The illustrations in this book feature GNOME (the GNU Network Object
    Model Environment), but Red Hat Linux also includes KDE (the K Desktop Environment),
    which is equally popular and widely used. If you choose to install both desktop
    environments, it is possible to access KDE programs from the panel running GNOME,
    and vice versa. It''s worth giving them a try to see which one suits you. They
    are equally good and your choice will depend on personal preference.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# THE DESK GUIDE


    The GNOME desktop and the main groups of software are supplied with a default
    installation of GNOME.  If you are the kind of user who takes full advantage of
    a multitasking environment, it doesn''t take long for the GNOME desktop to become
    completely filled with windows. GNOME has an excellent solution for this problem
    in the form of the Desk Guide, which is a virtual desktop that can hold multiple
    desktops, each accessible at the click of a button.


    # DESK GUIDE ICON IN THE GNOME PANEL


    +   * The Desk Guide feature is already set up on your PC, you will see its icon
    on the GNOME panel.

    +   * If the Desk Guide icon does not appear there, right-click on the GNOME Panel
    and choose Desk Guide from the Utility menu.


    ![](img/773dce76f7b88c1faa45d71937dc4026_27_0.png)


    In the default four-square Desk Guide, clicking on any of the squares reveals
    a completely new area of the desktop. Any window you open within any of these
    windows remains in place until you return to it, thus quadrupling the size of
    your desktop simply and quickly.


    ![](img/773dce76f7b88c1faa45d71937dc4026_27_1.png)'
  merge: -1
  img_proc: true
- pgno: 28
