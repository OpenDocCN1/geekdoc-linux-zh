- pgno: 42
  md: '# PROGRAMS:


    # SYSTEM


    +   • Use most of the items in the System menu, you will need to know the root
    password because you will be making changes that affect the system rather than
    simply personalizing your desktop environment.


    +   • Probably the most frequently used menu item here is **GnoRPM**, which is
    the Package Manager used for installing and uninstalling software in Linux [ ].


    ![](img/773dce76f7b88c1faa45d71937dc4026_42_0.png)


    +   • Other items here can prove invaluable. The System Info option in the above
    menu opens the System Information window, which provides technical information
    about your computer. You are unlikely to access this often, but it can save you
    a lot of trouble, especially if you have used the option that enables you to generate
    a document containing the data and then print it.


    +   • If you should experience difficulties with your PC, you will have the information
    at hand. To produce this document, start System Information from the System menu
    and click on Save Information to File.


