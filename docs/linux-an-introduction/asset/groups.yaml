    # 程序：图形


    - GNOME 中备受推崇的应用之一是 GIMP（GNU 图像操纵计划）。这个功能强大的图像编辑套件最初是 1995 年作为一个学生项目创建的。它是一个自由分发的软件，适用于图像处理任务，如照片修整、图像合成和图像创建。

    - 在使用 GIMP 之前，你需要在电脑上安装它。如果你点击“图形”菜单中的链接，安装过程将开始。


    ![](img/773dce76f7b88c1faa45d71937dc4026_37_0.png)


    - 安装程序将引导你通过一系列配置屏幕，直到过程结束。

    - 安装完成后，你会发现 GIMP 具有许多功能。它可以用作简单的绘图程序、专业级的照片修整程序、在线批处理系统、图像渲染器以及可用于转换图像格式的工具。


    ## 个人 GIMP 目录


    ![](img/773dce76f7b88c1faa45d71937dc4026_37_1.png)


    为了正确安装 GIMP，你的系统上需要有一个名为 /gimp-1.1... 的子目录。该子目录将包含若干文件和子目录，这些文件和子目录有助于 GIMP 了解你的系统。有关此主题的更多信息，请参阅在线帮助手册。


    ## 监视器分辨率


    要在其原始尺寸下显示图像，GIMP 需要知道你的监视器分辨率。GIMP 可以从 X 窗口系统获取此信息。然而，通常这并不能提供有用的值。


    GIMP 的功能包括画笔、喷枪、文本工具、克隆、模糊和锐化等绘图工具。你还可以通过旋转、缩放、翻转和错切来变换图像，并将文件保存为许多常见格式。


    ![](img/773dce76f7b88c1faa45d71937dc4026_38_0.png)


    # 程序：互联网


    GNOME 互联网子菜单中列出的一些互联网程序将在本书的后文中介绍。


    ![](img/773dce76f7b88c1faa45d71937dc4026_38_1.png)


    **Linux 在线**


    # 程序：多媒体


    - 为了充分利用多媒体程序，你需要安装并配置相应的硬件（即 CD-ROM 播放器、CD 刻录机、声卡以及声音/视频录音设备）。

    - 互联网是 Linux 录音、编辑和播放音频及视频片段软件的一个良好来源。不过，这里提供的默认应用程序为你的收藏提供了一个良好的起点。


    ![](img/773dce76f7b88c1faa45d71937dc4026_39_0.png)


    - GNOME CD 播放器具备一款良好的免费桌面 CD 播放器所需的所有基本功能。


    ![](img/773dce76f7b88c1faa45d71937dc4026_39_1.png)


    - GTV 是一款简单的播放器，用于播放以 MPEG 格式录制的电影。


    ![](img/773dce76f7b88c1faa45d71937dc4026_39_2.png)


    ## 多媒体播放器


    - XMMS 代表 X 多媒体系统，是一款用于 Unix 系统的多媒体播放器，比上述两款播放器更为复杂。它可以播放 MP3、MOD、WAV 和 OGM 等媒体文件。

    - 该系统提供图形均衡器、播放列表编辑器，以及大量的按钮、滑块和可配置的附加功能。

    - 右键点击 XMMS 并选择“选项”以调出偏好设置对话框。

    - 偏好设置对话框允许你安装和配置与音频和视觉效果相关的非常广泛的插件。


    ![](img/773dce76f7b88c1faa45d71937dc4026_40_0.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_40_1.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_40_2.png)


    # 程序：设置


    设置菜单提供了许多配置工具的快捷方式，你也可以通过其他许多路径到达这些工具。


    ![](img/773dce76f7b88c1faa45d71937dc4026_41_0.png)


    - 大多数普通用户可以更改和个性化的常见设置，例如屏幕保护程序、背景壁纸和系统声音，都可以通过设置菜单访问。


    此示例显示的是屏幕保护程序设置窗口，其中列出并预览了标准 GNOME 安装中可用的数十种屏幕保护程序。屏幕保护程序可以通过点击屏幕保护程序选择框下方的按钮并从可用选项中选择来进行预览和自定义。


    ![](img/773dce76f7b88c1faa45d71937dc4026_41_1.png)


    ### 48 访问控制中心


    # 程序：系统


    - 要使用系统菜单中的大多数项目，你需要知道 root 密码，因为你要做的是影响系统的更改，而不仅仅是个性化你的桌面环境。

    - 这里最常用的菜单项可能是 **GnoRPM**，它是 Linux 中用于安装和卸载软件的包管理器。


    ![](img/773dce76f7b88c1faa45d71937dc4026_42_0.png)


    - 这里的其他项目也可能无价之宝。上述菜单中的“系统信息”选项会打开系统信息窗口，提供关于你电脑的技术信息。你不太可能经常访问它，但它能为你省去很多麻烦，特别是如果你使用过该选项生成包含数据的文档并打印它。

    - 如果你的电脑遇到困难，你手头会有这些信息。要生成此文档，请从系统菜单启动系统信息，并点击“将信息保存到文件”。


    ![](img/773dce76f7b88c1faa45d71937dc4026_42_1.png)


    # 文件管理器


    GNOME 中的文件管理与 Windows 和 Mac 环境有许多相似之处，但一些功能对有 UNIX 经验的人来说会更熟悉。


    ## 使用文件管理器


    本章介绍如何使用 GNOME 文件管理器选择、移动、复制和删除文件和目录。它还介绍了 GNOME 与 Windows 和 Mac 接口在访问软盘和 CD-ROM
    驱动器方面的区别。


    ### 在主目录中操作


    - 当你作为普通用户而非超级用户（即 root）创建和保存新文件时，默认情况下文件会被放置在主目录下一个以你的用户名命名的子目录中。在此示例中，用户名为 alba，因此该子目录的路径为：/home/alba。

    - 随时打开此目录，只需双击 GNOME 桌面图标上的主目录图标。

    - 要打开文件管理器窗口，请从 GNOME 面板上的程序菜单中选择文件管理器。


    ![](img/773dce76f7b88c1faa45d71937dc4026_43_0.png)


    ## 文件管理器键


    **左侧**

    窗口左侧显示目录和子目录。高亮目录的内容显示在窗口的右侧。点击 + 展开目录树，点击 - 收缩文件管理器窗口左侧的目录树。


    **右侧**

    此侧显示窗口左侧高亮目录的内容（即文件和子目录）。


    **位置框**

    如果你需要路径名（目录/子目录），请在此处输入并按 [Enter] 键，即可在文件管理器窗口中直接获取目录。如果你已连接到互联网，可以在位置框中输入 FTP
    站点地址。文件管理器随后将成为一个 FTP 客户端应用程序。


    **右侧工具栏按钮**

    这些按钮改变右侧的视图。例如，“简要”仅显示文件或子目录名称，不显示其他详细信息。


    **左侧工具栏按钮**

    这些导航按钮让你可以通过列表向上浏览目录，或者从子目录向上移至更高的目录。


    **重新扫描按钮**

    重新扫描按钮重新显示当前窗口内目录的内容，反映最近发生的目录列表变化。


    **主目录按钮**

    点击主目录按钮会将活动目录更改为 *Home* 目录。


    ![](img/773dce76f7b88c1faa45d71937dc4026_44_0.png)


    ## 移动和创建


    当你创建或保存文件时，默认情况下它会被添加到你的主目录中。你需要进行的大多数文件管理操作，如复制、保存、移动和删除文件，很可能都以这个目录为中心。


    ### 创建新目录


    - 要创建新目录，请在文件管理器窗口的空白处右键点击，然后点击弹出菜单上的“新建目录”。然后，在“创建新目录”对话框中输入新目录的名称，并点击“确定”。


    ![](img/773dce76f7b88c1faa45d71937dc4026_45_0.png)


    ### 移动文件和目录


    - 要在文件管理器中移动文件和目录，首先在右侧面板中显示它们，高亮显示你要移动的项目，并将它们从右侧拖到左侧的相应目录上。当目录被高亮显示时，释放鼠标按钮，文件将相应移动。


    ![](img/773dce76f7b88c1faa45d71937dc4026_45_1.png)


