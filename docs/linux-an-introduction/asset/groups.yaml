    \ GNOME 桌面环境，请坚持使用拨号配置工具。\n\n## 你将需要的信息\n\n在开始设置你的互联网账户之前，请务必列出一份以下信息的清单。这些信息应由你的互联网服务提供商（ISP）提供，特别是如果你以前是使用他们的专有软件连接的：\n\
    \n- ISP 的拨入电话号码（用于访问互联网）\n- 你的用户名\n- 你的密码\n- 邮件服务器地址\n  - 通常会有两个：一个用于接收邮件（例如，pop3.yourisp.com），一个用于发送邮件（例如，smtp.yourisp.com）\n\
    - 你的（邮件）服务器密码（某些 ISP 可能需要第二个密码来收集你的邮件）\n- 新闻服务器名称。\n\n## 配置调制解调器\n\n如果你的 PC 上连接了一个调制解调器（或已安装在内部），但在安装\
    \ Linux 期间没有自动检测和配置它，Red Hat Linux 将尝试自动检测它，此时将打开“选择调制解调器”窗口。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_60_0.png)\n"
