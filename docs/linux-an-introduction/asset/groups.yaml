  mdcn: "\n\n### 验证按钮\n点击软件包信息对话框中的“验证”按钮，可以检查组成所选软件包的各个文件的完整性，并确保它们没有被篡改或损坏。\n\n\
    ![](img/773dce76f7b88c1faa45d71937dc4026_69_0.png)\n\n## 查找所需内容\n\nRed Hat Linux\
    \ 有三个主要的软件来源：第一，随机附带的盒装发行版中包含的一组 CD-ROM；第二，某些杂志和书籍赠送的 CD-ROM；第三，互联网上的软件库。\n\n\
    ### 来自发行商 CD 的软件\n\n- 当你插入随盒装 Red Hat 发行版提供的 CD 时，会弹出一个对话框询问你是否想要自动挂载 CD-ROM。选择“是”，安装窗口将会打开。\n\
    - 起初，显示的是你计算机上当前已安装的软件包。\n- 要查看 CD 的内容，你需要点击**安装**按钮。\n- CD 的内容开始出现在安装窗口中。为了更轻松地查看这些内容，点击展开树状按钮。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_69_1.png)\n\n## 使用查询按钮\n\n在探索 CD 内容时，你最多会用到查询按钮。虽然\
    \ CD 上的软件已按类别分组，但在将其安装到计算机之前，你通常希望先了解有关某个软件包的更多信息。\n\n- 高亮显示你感兴趣的文件，勾选它们旁边的复选框，然后点击查询按钮。\n\
    - 与每个文件相关的信息将显示在打开的“软件包信息”面板中的一个独立面板中。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_70_0.png)\n\
    \n如果你决定继续从 CD 进行安装，点击安装按钮。你可以在安装窗口中跟踪安装进度。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_70_1.png)\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_70_2.png)\n\n## 来自互联网的软件\n\n- 如果你已连接到互联网，Gnome\
    \ RPM 提供了一个非常实用的网络文件下载加载器 Rpmfind，你可以从主 RPM 窗口访问它。\n- 要访问此功能，点击 Web 查找按钮。这将启动\
    \ Rpmfind 窗口。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_71_0.png)\n\n- 第一次使用\
    \ Rpmfind 窗口时，你会连接到一个保存 RPMfind 数据库的 FTP 站点。这会下载一个软件包列表，显示在左侧面板的名称和发行版标题下。每次你点击加号显示子菜单时，都会从数据库下载更多信息。通过这种方式，你可以访问数据库中包含的每个软件包。\n\
    - 要搜索数据库，请在窗口顶部的方框中输入字符串术语，然后点击搜索按钮。命中列表将显示在左侧面板中。你可以通过点击任何条目，随后点击查询按钮以获取更多详情，来像处理\
    \ RPM 中的其他软件包一样处理这些条目。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_71_1.png)\n\
    \n## 我的软件去哪了？\n\n### 下载软件\n\n- 当你点击安装时，软件包会被安装到你的计算机上，并且可以通过 RPM 以与你计算机上所有其他软件包相同的方式访问。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_72_0.png)\n\n### 我的软件去哪了？\n\n这个问题听起来可能有些天真，但实际上并不完全是这样。新安装的软件并不总是会在\
    \ Gnome 面板中安装符号链接（Windows 称之为快捷方式）。这意味着，在安装软件包后，你可能会不确定如何启动该程序。\n\n### 完成安装\n\n\
    - 在此处给出的示例中，名为 **Payment Client 2.1** 的互联网应用程序并未完全自动安装。这是许多软件包的典型情况，即在你完全配置并准备好使用之前，需要采取某些操作。\n\
    - 要了解下一步该做什么，你需要找到**自读**文件，通常你可以在硬盘上的 /usr/share 目录中一个适当命名的目录中找到它。在这种情况下，该文件揭示了用户需要一些简单的安装后配置。对于软件包安装来说，这并不罕见。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_72_1.png)\n\n## 术语表\n\n**C** 一种在 20\
    \ 世纪 70 年代初设计并用于重新实现 Unix 的编程语言名称。\n\n**客户端 (CLIENT)** 程序或服务提供方的系统末端，即接收服务的实体。\n\
    \n**编译 (COMPILE)** 将程序源代码转换为可执行的机器代码文件，该文件人类无法阅读。\n\n**Debian** 一种使用 Linux 内核的免费、开源计算机操作系统。\n\
    \n**发行版 (DISTRIBUTION)** Linux 内核、一套命令程序以及其他用于安装和维护 Linux 系统的软件的组合。\n\n**驱动程序\
    \ (DRIVER)** 将设备无关指令转换为真实设备（如磁盘驱动器或打印机）能够理解的命令的计算机代码。\n\n**GIMP** “GNU 图像操作程序”是适用于图像操作的免费软件。\n\
    \n**GNOME** 一种桌面管理器，提供一系列工具以支持窗口管理器。\n\n**GNU** “GNU is Not Unix”（GNU 不是 Unix）指的是由自由软件基金会发起的\
    \ GNU 操作系统，旨在创建一个自由的操作系统。\n\n**图形用户界面 (GRAPHICAL USER INTERFACE, GUI)** 允许用户以视觉方式与计算机系统交互，最大限度地减少打字。\n\
    \n**主目录 (HOME DIRECTORY)** 提供给用户以存储个人文件和目录的目录。\n\n**HTML** “超文本标记语言”是 web 文档传输和由浏览器解释的形式。\n\
    \n**ISP** “互联网服务提供商”是向人们提供联网访问互联网服务的组织。\n\n**IRC** “互联网中继聊天”是一个全球性的在线“派对线”网络，允许实时对话。\n\
    \n**KDE** 一个通过提供用户和 Linux 之间的图形用户界面（GUI）或桌面，使 Linux 更易用的项目。\n\n**内核 (KERNEL)**\
    \ 操作系统的核心，包含最原始的功能，更高级的功能依赖于这些功能。\n\n**模块 (MODULE)** 执行特定任务的内核的一部分。\n\n**MS-DOS**\
    \ IBM 在其第一台个人计算机上安装的“Microsoft 磁盘操作系统”。\n\n**挂载 (MOUNT)** 此命令允许将磁盘内容放入文件系统的子目录中。\n\
    \n**开源 (OPEN SOURCE)** 源代码免费可用，可被使用、修改和再分发的软件。\n\n**操作系统 (OPERATING SYSTEM)**\
    \ 计算机的基本软件，负责调度任务、分配存储，并在用户和应用之间提供接口。\n\n**PPP** “点对点协议”，是通过拨号调制解调器将计算机连接到互联网的最流行方式。\n\
    \n**ROOT** 计算机系统上具有特权且拥有绝对控制权的特殊账户。\n\n**源代码 (SOURCE CODE)** 程序员创建的可读文本。源代码被编译以便使用，之后变得不可读。非自由软件的源代码是保密的，而自由软件的源代码始终可供任何人修复或改进。\n\
    \n**URL** “统一资源定位符”是标识万维网上文档或计算机的地址。\n\n**窗口管理器 (WINDOW MANAGER)** 通过确定窗口的外观和对用户输入的响应来管理图形用户界面的程序。\n\
    \n**X WINDOWS** 此图形用户界面管理所有用户活动，并被程序访问以满足其显示需求。\n\n## 索引\n\n**A**\n\n- Linux 的优点\
