    ### ABOUT THIS BOOK


    **Linux: An Introduction** is for people who feel confident about handling Microsoft®
    Windows operating systems, and who would like to know about the most credible
    PC alternative.


    It is often said that Windows is a well-designed computer desktop, which is let
    down by the operating system behind it. Linux®, an operating system based on UNIX®
    and designed by its Finnish creator Linus Torvalds, is now considered a serious
    alternative to Windows. This introduction to Linux begins by explaining what it
    is, and describes some of the pros and cons of using Linux. The operating system’s
    jargon is explained in this book including the word distribution—which means the
    version of Linux being used. The distribution used here is made available by Red
    Hat®. There is a tour of a Linux desktop, in this case, the GNOME desktop. The
    remainder of the book looks at programs, file management, customizing, getting
    online, and, finally, installing software. The chapters and the subsections present
    the information in the book by using


    ![](img/773dce76f7b88c1faa45d71937dc4026_5_0.png)

    ![](img/773dce76f7b88c1faa45d71937dc4026_5_1.png)


    examples, which in almost every instance are accompanied by an illustration showing
    how they would appear on-screen. The book contains several features to help you
    understand both what is happening and what you need to do. Command keys, such
    as ENTER and CTRL, are shown in these rectangles: [ENTER] and [CTRL], so that
    there’s no confusion, for example, over whether you should press that key or type
    the letters “ctrl”


    Cross-references are shown in the text as left- or right-hand page icons: [Page]
    and [Page]. The page number and the reference are shown at the foot of the page.


    As well as the step-by-step sections, there are boxes that explain particular
    features in detail, and tip boxes that provide alternative ways. Finally, at the
    back, you will find a glossary of common terms and a comprehensive index.


