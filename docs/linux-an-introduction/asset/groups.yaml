    # RED HAT LINUX DELUXE WORKSTATION


    The distribution featured in this book is Red Hat Linux Workstation, which is
    not one of the cheaper options available. However, a cheaper version of Red Hat
    is sold, and all the additional elements can be bought from the same source at
    a later date. The Deluxe version contains the kind of added software that may
    be bundled together to form a Linux distribution suitable for professional users.


    # HISTORY OF EXPANSION


    Red Hat was founded in 1994 as a developer and distributor of open source software.
    At that time, the number of Linux users was estimated to be 100,000. In the intervening
    period, Red Hat has expanded its activities through acquisitions and software
    development. Alongside this growth, the number of Linux users is estimated by
    some to have risen to about 15,000,000.


    ![](img/773dce76f7b88c1faa45d71937dc4026_21_0.png)


    > *The Red Hat website at www.redhat.com is the place to start.*


    To see Red Hat''s range of products, visit the company''s website and click on
    Home/Small Business. You can scroll down through the page that appears and select
    Red Hat Deluxe Workstation from the list of software.


    ![](img/773dce76f7b88c1faa45d71937dc4026_21_1.png)


    > *Scroll down the page and click on Red Hat Deluxe Workstation.*'
