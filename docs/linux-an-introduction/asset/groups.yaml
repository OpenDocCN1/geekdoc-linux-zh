    \ Hat. With this method, everything you need is likely to be provided, including\
    \ an installation program and printed materials. The only downside is that this\
    \ method is usually the most expensive.\n\n### ON A FREE BOOK OR MAGAZINE CD\n\
    \n- In this form, it's free – if you were going to buy the magazine or book anyway.\
    \ However, you're not supplied with the distributor's documentation, and the book\
    \ is likely to be generic rather than to deal with the specific version you are\
    \ installing. You also receive little or no commercial support to try out.\n\n\
    ### DOWNLOAD IT FROM THE INTERNET\n\n- In this form, it's free – provided you\
    \ are not paying telephone bills and you have a lot of spare time.\n"
  mdcn: "\n\n## LINUX 硬件要求\n\n虽然 Linux 可以在其他类型的工作站（如 Mac 和 Amiga）上运行，但本书更适合熟悉在 IBM\
    \ 兼容 PC 上运行的 Microsoft Windows 的用户。我们主要关注 Linux 在独立计算机上的应用，暂且不提其处理网络的强大功能。本书主要面向有\
    \ Windows 使用经验且好奇心强的初学者，而非程序员或有经验的网络用户。\n\n### 运行 Linux 的要求\n\n-   你可以在古老的 386\
    \ 处理器上运行 Linux，但你需要从命令行提示符运行所有程序或命令。然而，若要使用 Windows 类型的图形桌面，你至少需要一个快速的 486 处理器，最好使用高端的\
    \ Pentium（奔腾）处理器。\n-   具体规格取决于你打算在 Linux 下运行的内容。简单的文字处理和电子表格应用对处理器性能的要求远低于大多数图形应用和最新\
    \ 3D 游戏所需的繁重数值计算。如果你的需求非常低，你甚至可以找到精简版的 Linux，它们可以从单个软盘加载。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_15_0.png)\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_15_1.png)\n\n对于 Linux 的双启动安装（Linux\
    \ + Windows），请为稍后要安装的应用程序预留足够的空间。如果你也想与他人共享电脑，请为其他用户预留足够的空间。不过，作为管理员，只有你能够安装新的应用程序。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_16_0.png)\n\n注意：请在 http://linux.scsyr.edu/docs/\
    \ 搜索 LDP 邮件列表归档。\n\nLinux 文档项目（www.linuxdoc.com）是一个值得关注的站点。搜索“双启动”返回了 199 个结果。\n\
    \n## LINUX 安装配置\n\n以下三项规格支持安装带有类 Windows 图形桌面及典型实用程序和应用程序组合的 Linux。\n\n### 最低配置\n\
    \n-   40386 处理器，8 MB 内存，540 MB 空闲硬盘空间。\n\n### 可接受配置\n\n-   Pentium（奔腾）处理器，32 MB\
    \ 内存，850 MB 硬盘空间。\n\n### 推荐配置\n\n-   Pentium 处理器，最低 200 MHz，至少 32 MB 内存，至少 1500\
    \ MB 硬盘空间。\n\n### 其他必需项\n\n-   CD-ROM 驱动器。虽然存在基于软盘的安装程序，但大多数发行版至少占用一张光盘。\n-  \
    \ 受支持的显卡。如果你打算在较旧的 PC 上安装 Linux，必须检查你的硬件是否受 Linux 支持。\n\n## LINUX 发行版\n\n当人们提到\
    \ Linux 时，通常指的是由 Debian 和 Red Hat 等公司作为“发行版”出售的软件、代码和文档包。\n\n### 这些术语是什么意思？\n\n\
    对于初学者来说，Linux 似乎充斥着大量术语——如 X Windows、桌面环境、文件管理器、X 服务器和 GUI（图形用户界面）。虽然了解所有组件如何协同工作并非必要，但熟悉基本术语是有用的。\n\
    \n类似地，你不需要是机械师就能开车，但知道主要部件的名称总归是有帮助的，能够进行一些常规维护也总是有用的。这些页面介绍了你在阅读有关 Linux 的内容时会遇到的一些术语。\n\
    \n#### 内核\n\nLinux 的核心是内核。这是启动 Linux 时最先加载的代码，并在系统停机时最后卸载。单靠内核似乎并没有做太多事情，但没有它，什么都无法完成。内核作为硬件与在\
    \ Linux 下运行的所有程序之间的主链接。它还处理关键后台任务，如内存管理和多任务处理。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_17_0.png)\n\
    \n**The Linux Kernel HOWTO**\n\n作者：Brian Ward，邮箱：bri@cs.uchicago.edu\n\n版本 v1.25，2001\
    \ 年 3 月 28 日\n\n*这是一份关于内核配置、编译、升级和.*\n\n1.  **引言**\n    1.  请先阅读此部分。（1 分钟 95 秒）\n\
    \    2.  适用于 1.2.x、2.2 和 2.4 内核。\n2.  **快速步骤 – 内核编译**\n\n关于 Linux 内核的一切都在 Brian\
    \ Ward 位于 www.linuxdoc.org/HOWTO/Kernel-HOWTO.html 的作品中。\n\n### 工具\n\n-   Linux\
    \ 工具是位于内核和显示 Linux 桌面的软件之间的一组程序。其中最重要的工具之一是 C/C++ 编译器。该工具编译用 C 或 C++ 编写的程序，将代码转换为\
    \ Linux 可运行的可执行程序。\n\n### 应用软件\n\n-   在原始状态下，Linux 不需要 GUI 即可工作。然而，在这里，我们将重点放在使\
    \ Linux 能够作为基于窗口的操作系统环境运行的图形应用程序上。\n\n### X 窗口系统\n\n-   X 窗口系统用于在计算机上设置一个“X 服务器”。它保存关于你的显卡和显示器功能的信息。\n\
    \n#### 关于此页\n\n这里有一些 C 和 C++ 库、DLL、源代码、组件、框架、类库、代码片段等。请忽略本节的许可条款，因为它们与其他章节的许可条款相同（或类似）。请务必阅读你所在发行版的许可说明。\n\
    \n在 www.thefreecountry.com/develop/ptty/freeclibraries.shtml 可以免费下载工具、库和 C/C++\
    \ 实用程序。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_18_0.png)\n\n![](img/773dce76f7b88c1faa45d71937dc4026_18_1.png)\n\
    \n### 窗口管理器\n\n基于 X 的桌面管理器提供了你的输入（通过键盘/指向设备）与监视器上发生的事件之间的图形接口。一些窗口管理器看起来和感觉起来像\
    \ Microsoft Windows，并且所有都是高度可定制的。这些程序管理窗口的放置，包括定位、重叠和最小化（图标化）。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_19_0.png)\n\
    \n### 桌面环境\n\n-   两个领先的桌面环境是 GNOME 和 KDE。GNOME（GNU 网络对象模型环境）是作为开源软件开发的。\n-   KDE（K\
    \ 桌面环境）是使用名为 Qt 的 GUI 工具包构建的，KDE 也被广泛使用。\n-   Red Hat Linux 附带这两种桌面环境。其他大多数流行发行版也提供它们。\n\
    -   某些窗口管理器与某些桌面环境不兼容，但相关网站会提供必要的建议。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_19_1.png)\n\
    \n### 我能得到什么？\n\n-   你对 Linux 发行版的选择将取决于你对供应商安装程序质量、文档和销售后支持的评估。\n-   Linux 套件始终包含\
    \ Linux 内核以及以下组件的一个组合：\n    -   桌面管理器\n    -   至少一个文本编辑器\n    -   绘图程序\n    -\
    \   Web 浏览器\n    -   多媒体工具\n    -   实用程序\n    -   游戏\n    -   程序员工具\n-   许多发行版还将提供：\n\
    \    -   技术支持\n    -   第三方应用的光盘，Suse 和 Red Hat Linux 捆绑了完整版 StarOffice 套件\n- \
    \  你还将获得手册，有时篇幅长达数千页。\n-   你可以在优秀的 *Linux online* 网站 www.linux.com 上找到主要 Linux\
    \ 发行版的最新列表，包括描述和开发人员的网站链接。\n\n### 从哪里获取？\n\n-   下载 Linux，即使只包含一小部分相关应用程序和文档，也可能耗时较长。你的在线连接必须可靠，因为你不希望下载中途断开。此外，如果你决定下载内核并由此源构建操作系统版本，你必须确切知道自己在做什么。\n\
    \n**购买光盘版本**\n\n-   一些供应商以几美元的价格销售一张包含发行版基本组件（通过网络下载）的光盘。这为你节省了大量可能昂贵且耗时的下载时间。同样，你需要知道自己在做什么，而不仅仅是关于软件安装的问题。\n\
    \n**购买盒装套装**\n\n-   盒装套装很容易找到。你的软件商店很可能出售来自主要发行商的盒装套装，如 Caldera、Debian 或 Red Hat。通过这种方式，你所需要的一切都有可能提供，包括安装程序和印刷资料。唯一的缺点是这种方式通常最昂贵。\n\
    \n### 免费书籍或杂志附带的光盘\n\n-   在这种形式下，它是免费的——如果你本来就要购买该杂志或书籍。但是，你不会获得发行商的文档，而且书籍内容可能是通用的，而不是针对你正在安装的具体版本。你也很少或没有商业支持可供试用。\n\
    \n### 从互联网下载\n\n-   在这种形式下，它是免费的——前提是你不支付电话费并且有很多空闲时间。\n\n"
