  mdcn: "\n接下来的几页展示了通过 **GNOME 控制中心** 可获取的数十种工具（或称小工具/applets）中的一部分，首先是从大家通常最先决定进行个性化设置的领域——**GNOME\
    \ 桌面** 开始。\n\n## 桌面：背景\n\n- 控制中心中的工具可用于从图像文件、纯色或渐变中选择背景。如果你选择使用渐变，需要选择两种颜色，然后指定如何混合这些颜色。\n\
    - 在这里，就像大多数其他控制项一样，你会有选项来试用你的更改，如果你不满意所做的更改，还可以还原到原始状态。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_53_0.png)\n\
    \n## 先试用\n\n要取消更改，请单击控制中心警告框中的 **放弃所有更改（Discard all changes）** 按钮。要确认更改，请双击列表中高亮显示的条目并进行修改。然后，可以通过在\
    \ *选项* 窗口中单击“确定”来确认这些更改。\n\n## 桌面：面板\n\n- 此处显示的全局面板属性对话框提供了更改面板几乎每个方面（大小、形状、纹理和位置）的选项。\n\
    \  - 此示例显示了“按钮”页。当你单击 **Button type** 旁边的按钮时出现的下拉菜单，提供了四种按钮类型选择：**Launcher**、**Drawer**、**Menu**\
    \ 和 **Special**。\n  - 面板属性对话框顶部还有另外四个选项卡，分别称为“动画”、“面板对象”、“菜单”和“杂项”。由这些按钮和滑块激活的大多数选项都是不言自明的，你可以通过单击面板窗口底部的相应按钮来选择试用、接受或还原。然而，除非你以\
    \ root 用户登录，否则你将无法访问此小工具的某些部分（例如，“菜单”页的系统部分）。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_54_0.png)\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_54_1.png)\n\n## 替代访问方式\n\n- 你也可以从桌面访问上述小工具。首先，右键单击屏幕底部的\
    \ GNOME 面板，从弹出菜单中选择 **Panel**（面板），然后从 Panel 子菜单中选择 **Global Preferences**（全局首选项）。\n\
    \n## 桌面：主题选择器\n\n- GNOME 提供了十多种桌面主题，你可以使用“主题选择器”小工具预览或选择其中任何一个。\n- 单击 **Try**（试用）按钮会将桌面转换为你在“可用主题”框中高亮显示的主题。如果你单击该框右侧的\
    \ **Preview**（预览）按钮，主题将只应用于下方预览框中的内容，如本示例所示。如果 **Auto Preview**（自动预览）按钮处于按下状态，则无需单击预览按钮。此小工具还提供了安装新主题的功能，网络上可用的主题数量也在不断增加。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_55_0.png)\n\n## 另外两个小工具\n\n**会话管理器小工具**\n\
    此小工具允许你控制 GNOME 会话管理，它指定了哪些程序启动、如何保存你的 GNOME 配置以及如何注销。\n\n**GNOME 编辑属性小工具**\n\
    使用此小工具，你可以选择哪个编辑器作为你在 GNOME 中的默认编辑器。这将允许 GNOME 文件管理器等应用程序在你尝试打开与编辑相关联的文件时启动正确的编辑器。所有流行的文本编辑器都包含在选择列表中。\n\
    \n## 多媒体：声音\n\n你可以使用“声音”小工具来设置大量 GNOME 系统事件的声音。\n\n首先，单击“声音事件”选项卡，然后高亮显示你希望附加声音的事件。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_56_0.png)\n\n- **选择声音文件（Select sound\
