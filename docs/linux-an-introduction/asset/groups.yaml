    \ GNU 通用公共许可证下分发的。这份文件由自由软件基金会撰写，防止任何人限制对其适用的任何软件的使用。你可以收取费用或赠送此类授权软件，但你不能阻止其他人赠送它。许可证的另一项非常重要的条件是你有义务包含源代码。\n\
    \n该文件的开头文本写道：“任何人都有权复制和分发此许可证文件的逐字副本，但对其进行修改是不被允许的。”\n\n前言指出，大多数许可证剥夺了你分享和改变软件的自由，但此许可证旨在保证软件是自由的，并且任何人都可以对其进行修改和添加。\n\
    \n> GNU 通用公共许可证\n> \n> Linux 是在 GNU 通用公共许可证下编写和分发的，该许可证使代码能够自由分发并对公众可用。\n> \n\
    > GNU 通用公共许可证\n> 第 2 版，1991 年 6 月\n> \n> 版权所有 (C) 1989, 1991 Free Software Foundation,\
    \ Inc.\n> 675 Mass Ave, Cambridge, MA 02139, USA\n> 任何人都有权复制和分发此许可证文件的逐字副本，但对其进行修改是不被允许的。\n\
    > \n> 前言\n> \n> 大多数软件的许可证旨在剥夺你分享和改变软件的自由。相比之下，GNU 通用公共许可证旨在保证你分享和改变自由软件的权利——确保软件对所有用户都是自由的。GNU\
    \ 通用公共许可证适用于自由软件基金会的全部程序库。你也可以将其应用于你的程序。\n> \n> GNU 通用公共许可证的副本可在许多网站上找到，包括这里 www.linux.org/info/gnu.html。\n\
    \n### GNU 并非 Unix\n\n![](img/773dce76f7b88c1faa45d71937dc4026_12_0.png)\n\n- 我们需要什么\n\
    - 我们要去哪里\n- 我们不是什么\n- 当我们到达那里时\n- 我们如何做到？\n- 谁能做到？\n\n> GNU 项目的原则在其网站 www.gnu.org\
    \ 上阐述。\n\n## 为什么要尝试 Linux？\n\n定义 Linux 的优缺点取决于许多变量。你将把 Linux 运行在什么类型的硬件上？你将使用什么外围设备，例如打印机、调制解调器和显示器？你打算在\
    \ Linux 下运行什么软件应用程序？你会将你的 Linux 发行版运行在网络上，还是在独立工作站上使用它？你是一位经验多丰富的 PC 用户？然而，以下各点通常适用于\
    \ Linux 的使用。\n\n### 优点\n\n- **多任务**\n  Linux 可以并发运行大量程序。\n- **多用户**\n  Linux 可以并发支持多个用户，这对网络非常重要，或者非并发。这意味着多个用户可以登录到同一台计算机并像它是他们专属的那样使用它。每个个人的文件访问都受密码保护，所有其他用户的文件都是不可见的。\n\
    - **安全性**\n  Linux 因其安全功能而备受推崇。只有系统管理员才允许进行系统级更改，例如安装软件或更改个人的访问权限。还声称 Linux 无病毒。\n\
    - **免费和开源**\n  Linux 是开源软件且免费。开源软件的一个优点是问题修复的创建和可用性速度，通常在线提供。\n- **模块化**\n  由于\
    \ Linux 基于模块，它可以从其最复杂的形式（需要数百兆字节的磁盘空间）剥离，仅从一张软盘运行。\n- **与其他系统共享**\n  Linux 可以与其他操作系统在同一台计算机上共存。例如，你可以选择在相同的\
    \ PC 上启动 Linux 或 Microsoft Windows。\n- **开发人员工具**\n  Linux 捆绑了丰富的程序员开发工具。本书中介绍的红帽\
    \ Linux 版本附带 C、C++、Perl 和 Python。\n- **网络**\n  Linux 提供了运行 Web 和 FTP 服务器的理想环境。由于\
    \ Linux 基于 UNIX 操作系统，其网络功能非常出色。\n\n## 缺点\n\n### 安装问题\n\n大多数初始问题可能涉及安装和设置 Linux，除非别人为你设置了。然而，除非你拥有管理员密码，否则你将无法安装新应用程序或进行系统级更改。\n\
    \n### 需要经验\n\n安装 Linux 不适合初学者。提供的安装软件通常非常好，但你可能遇到需要具有除 Windows 以外其他操作系统经验的问题。例如，如果你对识别你的显示器规格或从屏幕提示符运行命令感到不安，你可能希望让别人安装软件。你甚至可能需要寻求帮助热线或在线支持小组的帮助。\n\
    \n### 内部性能不足\n\n如果你的 PC 旧、慢且容量有限，你在运行基于 Linux 的软件时会有问题。使用配置不足的 PC，你很幸运能有图形桌面，并且命令执行将花费很长时间。\n\
    \n### 外围设备问题\n\n你的外围设备在 Linux 下可能无法工作，不幸的事实是，无论等待多久，解决方案可能永远不会到来。大多数问题涉及专门设计用于在\
    \ Windows 下运行的产品。例如，对于 win-modem，使用 Windows 软件来替代调制解调器硬件内的某些电子组件。Linux 不像 Windows\
    \ 那样补偿这些缺失的组件，并且没有保证它将来会这样做。\n\n### 软件可用性\n\n由于 Linux 世界的非商业性质，一些软件将无法用于 Linux，并且没有确切的保证它最终会变得可用。例如，在\
    \ 2001 年初，Microsoft 的 Office 套件和 Internet Explorer 无法用于 Linux。\n\n### 获取帮助\n\n\
    当你在 Linux 上遇到困难时，在任何搜索引擎中搜索\"Linux help\"。你会在互联网上发现大量有用的材料。这将包括指向公告板和邮件列表的链接，人们在那里询问和回答你可能遇到的问题。也要记得在你的报纸中搜索\
    \ Linux，并访问你遇到的任何 Linux 新闻组。\n\n"
