    \ class\n- Easy PCMCIA support by default\n- Pervos as common user\n- More secure\
    \ default settings and faster config modification\n- XFree86 4.0.3 for improved\
    \ 3D graphics\n- Flexible printing configuration tools that support printers\n\
    - Introducing Mozilla Web browser\n\n### Demos and sample data from partners\n\
    \n- Full version of StarOffice® 5.2\n- Demo version of Anywhere® 2.0 from Visit\n\
    - Adobe® Acrobat® Reader 4.05\n- Special Red Hat edition of Yahoo! Messenger\n\
    - Game demos from Loki® and Sid Meier’s Air and SimCity® 3000\n\n### PowerTools\
    \ applications\n\n- Over 300 applications including Zip, GnuScan, Exim, FaxMail,\
    \ and Postfix\n\n![](img/773dce76f7b88c1faa45d71937dc4026_22_0.png)\n\n## THE\
    \ GNOME DESKTOP\n\nThis section is a quick tour of Red Hat Linux showing the package\
    \ of features that is installed with GNOME, which is one of the two desktop environments\
    \ supplied with Red Hat Linux.\n\n### LOGGING ON AND OFF\n\nWhen you start your\
    \ PC with Linux as the operating system (rather than Windows ME, for example)\
    \ you will see the screen fill with lines of text that contain information indicating\
    \ that Linux is checking, enabling, and starting all the software that will drive\
    \ your system -- each followed by **OK** if the check is passed.\n\n#### ENTER\
    \ USER NAME AND PASSWORD\n\nYour exact log-in procedure will have been defined\
    \ by whoever installed Linux on your computer. If a graphical interface has been\
    \ chosen, you will see the GNOME log-in screen. If not, you will see a text prompt\
    \ asking you for your user name and then your password. In either case, supply\
    \ your user name and password (*not the root user name and password*) when prompted.\
    \ If you are using a graphical interface, you will usually boot straight into\
    \ the GNOME desktop environment.\n\n#### TYPING AT THE PROMPT\n\nIf a graphical\
    \ interface is not being used, you will see a text prompt similar to this example\
    \ (where your password replaces alba) at the localhost login prompt. To start\
    \ GNOME, type `startx` and press Enter.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_23_0.png)\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_24_0.png)\n\n**LOGGING OFF**\nTo log\
    \ off from GNOME, choose Log out from the Main GNOME menu. This displays a dialog\
    \ box with up to three options:\n- LOGOUT to end the GNOME session.\n- HALT to\
    \ shut down the computer.\n- REBOOT to reboot.\n\n### USING THE ROOT PASSWORD\n\
    \nIf you are a user of a standalone PC, you may find that Linux places more emphasis\
    \ on user names, passwords, and security than you are used to. If you attempt\
    \ to take any action that will make system-level changes to your PC, you will\
    \ be required to enter the root password because the changes will affect all users\
    \ of the computer, not merely you. If you are the only user of that computer,\
    \ this may seem unnecessary. However, if you share your computer with others,\
    \ the importance of limiting these controls to one \"superuser\" soon becomes\
    \ apparent.\n\n**THE NEED FOR THE PASSWORD**\nIf you do not have access to the\
    \ root password – probably because someone else has installed Linux – you will\
    \ need either to ask them for the password or to log in each time that any system-level\
    \ changes are required.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_24_1.png)\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_24_2.png)\n\n## A Quick Tour of GNOME\n\
    \nOnce GNOME has loaded, you are presented with a graphical user interface (GUI),\
    \ which shares many features with other desktop environments, based both on Linux\
    \ and on other operating systems. Files and directories (folders) are viewed and\
    \ handled from windows within the File Manager. Other drives are accessed through\
    \ the File Manager itself or via desktop icons. Files, applications, and Web pages\
    \ can also be accessed via icons on the desktop or on the Panel (at the bottom\
    \ of the desktop). The appearance of the desktop features can easily be customized.\n\
    \n### DESKTOP KEY\n\n1. Symlink to the Home directory.\n2. A symlink is a symbolic\
    \ link or shortcut that points to a file, directory, or drive.\n3. Trash Icon\n\
    4. Two Red Hat shortcuts\n5. The Dialog Configuration tool\n6. Symlinks to the\
    \ floppy-disk and CD-ROM drives\n7. Default GNOME desktop\n8. GNOME documentation,\
    \ available on all subjects\n9. GNOME panel\n10. The File Manager (showing the\
    \ Home directory)\n11. GNOME panel menus\n\n![](img/773dce76f7b88c1faa45d71937dc4026_25_0.png)\n\
    \n#### Using the File Manager\n\n#### Using Symlinks\n\n#### Establishing a Connection\n\
    \n## UNIQUE APPLICATIONS\n\nAt first sight, the Linux desktop may appear to have\
    \ more similarities than differences with, for example, Windows. However, despite\
    \ these superficial similarities, Linux has many features unique to itself. It\
    \ also boasts many unique applets, which are applications and utilities only available\
    \ with Linux. Most, if not all, of these applications have been written by independent\
    \ programmers and released under the GNU Public License.\n\n[1. For more information\
    \ about the authors of these programs, choose About from the Help menus of the\
    \ relevant application.]\n\n![](img/773dce76f7b88c1faa45d71937dc4026_26_0.png)\n\
    \n## WHICH DESKTOP?\n\nTwo desktop environments are provided with the version\
    \ of Red Hat Linux featured in this book. The illustrations in this book feature\
    \ GNOME (the GNU Network Object Model Environment), but Red Hat Linux also includes\
    \ KDE (the K Desktop Environment), which is equally popular and widely used. If\
    \ you choose to install both desktop environments, it is possible to access KDE\
    \ programs from the panel running GNOME, and vice versa. It's worth giving them\
    \ a try to see which one suits you. They are equally good and your choice will\
    \ depend on personal preference.\n"
  mdcn: "\n\n## 红帽 Linux 豪华版工作站\n\n本书介绍的分发版本是红帽 Linux 工作站版，它并不是价格较为低廉的选择之一。不过，红帽也销售较便宜的版本，所有额外组件均可稍后从同一来源购买。豪华版包含那些经过捆绑整合、可构成适合专业用户使用的\
    \ Linux 分发版的附加软件。\n\n## 扩展历史\n\n红帽公司成立于 1994 年，是一家开源软件的开发者和分发商。当时，Linux 用户数量估计为\
    \ 100,000。在此后的期间，红帽通过收购和软件开发扩大了其业务活动。随着这种增长，一些人估计 Linux 用户数量已上升至约 15,000,000。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_21_0.png)\n\n> *红帽网站 www.redhat.com\
    \ 是起步的地方。*\n\n若要查看红帽的产品范围，请访问该公司网站并点击“家庭/小型企业”。您可以向下滚动显示的页面，并从软件列表中选中“红帽豪华版工作站”。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_21_1.png)\n\n> *向下滚动页面并点击“红帽豪华版工作站”。*\n\
    \n## 包含内容\n\n红帽 Linux 豪华版工作站以 10 张光盘交付，其中包含超过 5GB 的各类软件，包括：\n\n- GNOME 和 KDE 桌面环境\n\
    - 对 USB 设备和可记录 CD-ROM 的支持\n- XFree86 4.0.3，X 窗口系统的一种实现\n- StarOffice 5.2\n- Anywhere\
    \ 2.0 演示版本，其中包含 Anywhere Desktop，这是一套办公程序\n- Adobe Acrobat Reader 4.05\n- Yahoo!\
    \ 信使的特供红帽版本\n- 来自 Loki、AlphaCentauri 和 SimCity3000 的游戏演示\n- 超过 300 个 PowerTools\
    \ 应用程序，包括 Zip、GnuScan、Openmotif、Exim、FaxMail 和 Postfix\n- 红帽网络软件管理器\n- 多种编程语言\n\
    - Netscape Navigator\n\n### 红帽豪华版工作站\n\n红帽豪华版工作站是新手用户的完美入门选择。除了获奖的 UI 操作系统外，豪华版工作站还为您提供指南、办公套件、游戏和服务，帮助您快速上手。\n\
    \n红帽豪华版工作站将于 2003 年开始发货\n\n### 红帽豪华版工作站包括：\n\n- 带有新安装器的红帽 Linux 7.2\n- 本地应用程序\
    \ CD（工作站版）\n- 系统工具 CD\n- Loki CD\n\n### 红帽网络软件管理器\n\n- 通过默认设置和默认配置默认保存人工数天的时间\n\
    - 安装新的、升级和软件\n- 软件包管理\n- 支持\n  - 4 天或电话支持（6 个月）\n  - 4 天电子订阅（4 个月）\n  - 4 天或基于网络的密钥支持（1\
    \ 个月）\n\n### 文档\n\n- 安装指南\n- 硬件兼容性指南\n- 文档 CD\n\n### 新功能\n\n- 经过红帽测试的 2.4 内核\n\
    - 改进了对“热插拔”USB 和可记录 CD-ROM 的支持\n- 笔记本电脑安装类别\n- 默认易于支持 PCMCIA\n- 将 Pervos 设为普通用户\n\
    - 更安全的默认设置和更快的配置修改\n- XFree86 4.0.3，用于改进 3D 图形\n- 灵活的打印配置工具，支持打印机\n- 引入 Mozilla\
    \ Web 浏览器\n\n### 合作伙伴的演示和示例数据\n\n- StarOffice® 5.2 完整版\n- 来自 Visit 的 Anywhere®\
    \ 2.0 演示版本\n- Adobe® Acrobat® 阅读器 4.05\n- Yahoo! 信使的特供红帽版本\n- 来自 Loki®、Sid Meier’s\
    \ Air 和 SimCity® 3000 的游戏演示\n\n### PowerTools 应用程序\n\n- 包括 Zip、GnuScan、Exim、FaxMail\
    \ 和 Postfix 在内的超过 300 个应用程序\n\n![](img/773dce76f7b88c1faa45d71937dc4026_22_0.png)\n\
    \n## GNOME 桌面\n\n本节是对红帽 Linux 的快速浏览，展示了随 GNOME 安装的功能包，GNOME 是红帽 Linux 提供的两种桌面环境之一。\n\
    \n### 登录和注销\n\n当您以 Linux 为操作系统启动您的 PC（而不是例如 Windows ME）时，您将看到屏幕布满文本行，这些行包含指示 Linux\
    \ 正在检查、启用和启动所有驱动系统软件的信息——每次检查通过后都跟随 **OK**。\n\n#### 输入用户名和密码\n\n您的具体登录流程将由在您计算机上安装\
    \ Linux 的人定义。如果选择了图形界面，您将看到 GNOME 登录屏幕。如果没有，您将看到一个文本提示，要求您输入用户名，然后输入密码。无论哪种情况，当被提示时，请提供您的用户名和密码（*不是\
    \ root 用户名和密码*）。如果您使用的是图形界面，您通常会直接进入 GNOME 桌面环境。\n\n#### 在提示符下输入\n\n如果没有使用图形界面，您将看到一个类似于以下示例的文本提示（在\
    \ localhost 登录提示处，您的密码将替换 alba）。要启动 GNOME，请输入 `startx` 并按回车键。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_23_0.png)\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_24_0.png)\n\n**注销**\n要从 GNOME 注销，请从主\
    \ GNOME 菜单中选择“注销”。这将显示一个包含最多三个选项的对话框：\n- 注销以结束 GNOME 会话。\n- 关机以关闭计算机。\n- 重启以重新启动。\n\
    \n### 使用 root 密码\n\n如果您是独立 PC 的用户，您可能会发现 Linux 比您习惯的更强调用户名、密码和安全。如果您尝试执行任何将对您的\
    \ PC 进行系统级更改的操作，由于这些更改将影响计算机的所有用户，而不仅仅是您，因此需要输入 root 密码。如果您是计算机的唯一用户，这似乎可能没有必要。然而，如果您与他人共享您的计算机，将控制权限制在一个“超级用户”中的重要性很快就会显现出来。\n\
    \n**需要密码**\n如果您没有访问 root 密码的权限——可能因为其他人安装了 Linux——您需要向他们索要密码，或者在每次需要系统级更改时登录。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_24_1.png)\n\n![](img/773dce76f7b88c1faa45d71937dc4026_24_2.png)\n\
    \n## GNOME 快速浏览\n\nGNOME 加载后，您将看到一个图形用户界面（GUI），它与基于 Linux 和其他其他操作系统的其他桌面环境共享许多功能。文件和目录（文件夹）通过文件管理器中的窗口进行查看和处理。其他驱动器通过文件管理器本身或桌面图标进行访问。文件、应用程序和网页也可以通过桌面或面板（位于桌面底部）上的图标进行访问。桌面功能的外观可以轻松自定义。\n\
    \n### 桌面按键\n\n1. 指向主目录的符号链接。\n2. 符号链接是指向文件、目录或驱动器的符号链接或快捷方式。\n3. 回收站图标\n4. 两个红帽快捷方式\n\
    5. 对话框配置工具\n6. 指向软盘和 CD-ROM 驱动器的符号链接\n7. 默认 GNOME 桌面\n8. GNOME 文档，涵盖所有主题\n9. GNOME\
    \ 面板\n10. 文件管理器（显示主目录）\n11. GNOME 面板菜单\n\n![](img/773dce76f7b88c1faa45d71937dc4026_25_0.png)\n\
    \n#### 使用文件管理器\n\n#### 使用符号链接\n\n#### 建立连接\n\n## 独特的应用程序\n\n乍一看，Linux 桌面似乎与例如\
    \ Windows 有很多相似之处而非差异。然而，尽管存在这些表面上的相似性，Linux 具有许多其独特的功能。它还拥有许多独特的 applets，这些是仅在\
    \ Linux 上可用的应用程序和实用工具。这些应用程序中的大多数，如果不是全部，都是由独立程序员编写的，并遵循 GNU 通用许可协议发布。\n\n[1.\
    \ 要了解这些程序作者的更多信息，请选择相关应用程序帮助菜单中的“关于”。]\n\n![](img/773dce76f7b88c1faa45d71937dc4026_26_0.png)\n\
    \n## 哪个桌面？\n\n本书介绍的红帽 Linux 版本提供了两种桌面环境。本书的插图以 GNOME（GNU 网络对象模型环境）为特色，但红帽 Linux\
    \ 还包含 KDE（K 桌面环境），它同样受欢迎且被广泛使用。如果您选择安装这两种桌面环境，则可以访问正在运行 GNOME 的面板中的 KDE 程序，反之亦然。值得试一试，看看哪一个适合您。它们同样出色，您的选择将取决于个人偏好。\n\
    \n"
