    ## 桌面指南


    GNOME 桌面以及主要的软件组在 GNOME 的默认安装中就已提供。如果你是一个充分利用多任务环境的用户，GNOME 桌面很快就会因窗口而变得拥挤不堪。GNOME
    针对这一问题提供了一个极佳的解决方案，即“桌面指南”（Desk Guide）。它是一种虚拟桌面，可以容纳多个桌面，每个桌面只需点击一下按钮即可访问。


    ### GNOME 面板中的桌面指南图标


    - 你的电脑已经预装了桌面指南功能，你将在 GNOME 面板上看到其图标。

    - 如果 GNOME 面板上没有出现桌面指南图标，请在 GNOME 面板上右键单击，然后从“实用工具”菜单中选择“桌面指南”。


    ![](img/773dce76f7b88c1faa45d71937dc4026_27_0.png)


    在默认的四格桌面指南中，点击其中任意一个格子，就会展示出一个全新的桌面区域。你在这些桌面中打开的任何窗口都会保持在原地，直到你再次切换回该桌面。这样，你可以简单快捷地将桌面的有效面积扩大四倍。


    ![](img/773dce76f7b88c1faa45d71937dc4026_27_1.png)


    ### 杂乱的工作区


    - 如果你正在使用某个窗口，且当前工作区变得过于杂乱，请点击该窗口的左上角，然后在弹出的菜单中选择**将窗口发送到下一个（或上一个）工作区**。窗口会立即移动到下一个工作区。


    ![](img/773dce76f7b88c1faa45d71937dc4026_28_0.png)


    ## GNOME 面板功能


    GNOME 面板是沿着桌面底部运行的栏。它是访问从面板运行的应用程序（迷你应用）以及配置工具的起点。用户可以根据需求自定义这些工具，添加自己选择的菜单以及指向应用程序和文件的链接。


    此外，你也可以将额外的 GNOME 面板放置在桌面的其他位置。下面的图示展示了 GNOME 桌面默认安装时提供的组件。


    ![](img/773dce76f7b88c1faa45d71937dc4026_28_1.png)


    ### GNOME 面板


    1. GNOME 按钮

    2. 截屏按钮

    3. 集成帮助系统

    4. 终端仿真程序

    5. GNOME 控制中心

    6. Netscape 浏览器


    ## GNOME 按钮


    - 点击 GNOME 按钮（显示足迹徽标）以显示主菜单。


    ![](img/773dce76f7b88c1faa45d71937dc4026_29_0.png)


    ## 屏幕锁定按钮


    - 点击此按钮将打开该面板并锁定屏幕。只有当用户在提供的输入框中正确输入密码时，才能解锁。


    ![](img/773dce76f7b88c1faa45d71937dc4026_29_1.png)


    ## 集成帮助系统


    - 此功能为 GNOME 桌面环境提供全面的在线帮助。


    ![](img/773dce76f7b88c1faa45d71937dc4026_29_2.png)


    ## 终端仿真程序


    - 此功能允许用户直接向 Linux 操作系统输入命令。


    ![](img/773dce76f7b88c1faa45d71937dc4026_30_0.png)


    ## GNOME 控制中心


    - 此功能允许用户调整那些决定桌面外观和功能各方面的小部件（Applets）。


    ![](img/773dce76f7b88c1faa45d71937dc4026_30_1.png)


    ## 添加新面板


    - 如果你觉得 GNOME 面板变得杂乱无章，可以通过“面板”菜单选择“创建面板”来创建另一个面板。系统将提供关于新面板位置和行为的多种选项。


    ![](img/773dce76f7b88c1faa45d71937dc4026_30_2.png)


    ## GNOME 小部件


    GNOME 小部件是从位于 GNOME 面板上的控件操作的迷你应用程序。在 Red Hat Linux 的默认 GNOME 安装中，包含了数十个实用的小部件，但由你决定要在
    GNOME 面板上放置哪些。对于大多数这些小部件，如果你在面板上右键单击小部件，并从屏幕上弹出的菜单中选择适当的选项，它们是可以自定义的。


    ### 向面板添加项目


    - 若要向 GNOME 面板添加小部件，请在面板的空白处右键单击，从弹出菜单中选择**小部件**，然后从相应的子菜单中选择项目。你也可以直接从 GNOME
    主菜单中选择小部件菜单。

    - 此示例展示了选择并添加 CD 播放器小部件的过程。


    ![](img/773dce76f7b88c1faa45d71937dc4026_31_0.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_31_1.png)


    ### 字符选择器


    - 字符选择器小部件允许你复制和粘贴特殊字符（如带重音符号的字母和数学符号）到你的文档中，无论你正在使用哪种应用程序。


    ![](img/773dce76f7b88c1faa45d71937dc4026_31_2.png)


    字符选择器小部件


    ### 可用小部件


    GNOME 的标准安装提供了六个类别的小部件。其中最有用的包括磁盘挂载（Drive Mount），它为软盘驱动器提供图标并显示驱动器的当前状态。点击此图标将挂载或卸载驱动器。这比右键单击并选择挂载或卸载菜单项（[
    ] 中的替代方法）要快。


    ![](img/773dce76f7b88c1faa45d71937dc4026_32_0.png)


    WebControl 是一个简单的网络小部件，允许你输入网络地址并直接访问该网站。它通过“网络”子菜单提供。


    如果你当前没有使用 Netscape 浏览器，它将自动启动该程序。如果你正在运行 Netscape，WebControl 还提供在旧窗口中打开所选网站的选项。


    ![](img/773dce76f7b88c1faa45d71937dc4026_32_1.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_32_2.png)


    ### 访问其他驱动器


    ## GNOME 程序


    GNOME（随 Red Hat Linux 提供）包含数量庞大且种类繁多的免费程序。这些 GNOME 程序被归类为九个主要类别，非常值得花时间去探索。


    ### 程序菜单


    - 如果你继续使用 Linux，程序菜单很可能只是使用你 Linux 应用集合的起点。不过，你可能会发现继续使用该程序中的一些，尤其是随着作者（以及其他 Linux
    开发人员）定期对其进行改进和增强。


    ![](img/773dce76f7b88c1faa45d71937dc4026_33_0.png)


    ### 程序：应用程序


    - Gnopad+ 和 gedit 是可供 GNOME 使用的众多文本编辑器中的两个。它们可以通过“程序”菜单中的“应用程序”子菜单访问。


    ![](img/773dce76f7b88c1faa45d71937dc4026_33_1.png)


    Gnotepad+ 主要用作超文本标记语言（HTML）文本编辑器，具有许多用于网页编写的实用快捷键。


    Gedit 是一个简单有效的文字处理应用程序。


    ![](img/773dce76f7b88c1faa45d71937dc4026_34_0.png)


    ### 日历


    - GNOME 日历虽然简单，但包含了你可能在商业产品中期望看到的许多功能。日历是从“应用程序”子菜单启动的。

    - 它有四个标签：日、周、月和年。每个标签显示其自身的时间段，但允许你从其他任何一个标签安排约会。


    ![](img/773dce76f7b88c1faa45d71937dc4026_34_1.png)


    ## 程序：应用程序


    - 其他应用程序包括 Gnumeric（GNOME 电子表格）和 Dia（图表编辑器）。如果你对这类应用程序有一定了解，这两个程序都非常容易上手。


    ## 程序：实用工具


    - 从“程序”菜单访问的实用工具与可作为小部件使用的实用工具不同，因为它们是作为完整程序运行在桌面的独立窗口中。这些实用工具包含一系列简单应用程序，从搜索工具到计算器再到颜色浏览器。以下示例展示了标准
    GNOME 安装提供的部分实用工具。


    ![](img/773dce76f7b88c1faa45d71937dc4026_35_1.png)


    ### GFLOPPY


    - Glfopy 是一个用于格式化软盘的实用工具。通常，你可以在 GNOME 桌面上挂载并读取在其他操作系统上格式化的软盘。例如，可以读取 Windows/DOS
    格式化的磁盘。但是，反向传输将不起作用。Linux 软盘无法格式化为在 Windows 电脑上读取。因此，如果你打算在 Linux 电脑（例如 html 或
    tex 文档）和 Windows 电脑之间传输文件，你应该将软盘格式化为 DOS（FAT16）而不是 Linux 原生（ext 2）磁盘。


    ![](img/773dce76f7b88c1faa45d71937dc4026_36_0.png)


    ### GNOME 计算器


    - GNOME 计算器自带的说明提供了“类似于 xcalc 的简单双精度计算”。对于那些需要高级功能的用户，它提供的功能远超普通的免费桌面计算器。


    ![](img/773dce76f7b88c1faa45d71937dc4026_36_1.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_36_2.png)


    '
