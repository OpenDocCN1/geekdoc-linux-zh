  mdcn: "\n## 使用符号链接\n\n在 GNOME 桌面环境中，符号链接（symlink）指向的文件或目录可以放置在桌面上、GNOME 面板中，或者文件管理器的任何其他文件夹中。符号链接类似于\
    \ Windows 中的快捷方式或 Apple Mac 操作系统中的别名。你可以重命名、移动或删除符号链接，而不会影响其所指向的文件或目录。\n\n###\
    \ 创建符号链接\n\n- 要创建符号链接，请右键单击你要链接的文件或文件夹。在本例中，文件 **Story - ideas** 将被创建指向它的符号链接。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_46_0.png)\n\n- 在出现的下拉菜单中选择“Symlink”后，将打开“Symbolic\
    \ Link”对话框。在“Existing filename”文本框中输入文件的路径和文件名。在“Symbolic link filename”文本框中，输入符号链接的名称。在本例中，**Story\
    \ ideas** 将作为符号链接，位于名为 **Story - ideas** 的文件的同一目录中。点击“OK”。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_46_1.png)\n\
    \n符号链接将显示在目录窗口中。双击此链接现在将打开主文件。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_47_0.png)\n\
    \n## 拖放到 GNOME 面板\n\nGNOME 桌面环境的所有方面都具有高度可定制性，正如我们在前面的页面中看到的。如果你打算经常使用硬盘上的某个目录，并希望直接从\
    \ GNOME 桌面访问它，你可以安排直接从 GNOME 面板访问它。只需将图标从文件管理器窗口拖到 GNOME 面板中合适的空白区域，然后松开鼠标按钮即可。\n\
    \n## 直接访问内容\n\n为了在未来直接访问目录的内容，点击 GNOME 面板上的图标。此示例展示了主目录（对于用户 alba）被传输到 GNOME 面板的情况。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_47_1.png)\n\n## 基本键盘快捷键\n\n如果你要有效地使用文件管理器和\
    \ GNOME 桌面，以下键盘和鼠标快捷键是必须的。\n\n- **Ctrl + 拖拽**：在拖拽文件时按住 Ctrl 键。这意味着你复制该文件（即你移动该文件的副本，而不是文件本身）。\n\
    - **Ctrl + 点击**：使用 Ctrl + 点击来选择右侧窗口中的一组文件。如果你打算使用此方法，最好不要通过图标视图进行查看。\n- **Ctrl\
    \ + 点击**：要从组中选择或取消选择单个文件，请在点击相应文件时按住 Ctrl 键。\n\n## 右键弹出菜单\n\n使用鼠标右键，这是你在 GNOME\
    \ 中可以使用最实用的快捷键之一。当你右键单击文件或小程序时，会出现一个菜单，提供你需要使用的大多数主要选项。\n\n- **打开文件。**\n- **打开方式**：允许你确定用于打开该特定文件（或文件类型）的应用程序。\n\
    - **编辑**：用于修改文件。\n- **复制**：这会生成一个对话框，你在其中输入文件要复制到的新位置。\n- **移动到回收站**。\n- **删除**：此选项完全绕过了通过先将项目移动到回收站来提供检索文件的可能性。\n\
    - **移动**：打开一个对话框，你在其中输入文件的新位置。\n- **面板**：此子菜单包含各种项目，包括添加和移除面板及小程序的子菜单。\n- **符号链接**：这允许你创建符号链接，这在很大程度上等同于\
    \ Windows 中的快捷方式或 Mac 操作系统中的别名。\n- **属性**：属性对话框包含三个选项卡，每个选项卡打开一个页面，其中包含与谁能编辑、复制或删除文件相关的统计数据、选项和权限。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_48_0.png)\n\n## 访问其他驱动器\n\nLinux 将所有目录显示在一个目录树中，无论它们位于什么驱动器上。Linux\
    \ 中没有驱动器字母；所有磁盘的内容简单地显示为子目录。此外，可移动磁盘的内容不会自动出现；首先必须“挂载”驱动器才能查看其内容。\n\n## 磁盘图标\n\
    \n- 代表软盘和 CD-ROM 光盘驱动器的图标出现在桌面的左下角。这些图标分别是到目录 **mnt/floppy** 和 **mnt/cdrom** 的符号链接。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_49_0.png)\n\n## 挂载软盘驱动器\n\n- 在将软盘插入适当驱动器后，在查看软盘内容之前，你需要挂载该驱动器。为此，请右键单击桌面上的相关驱动器图标，并从弹出菜单中选择\
    \ **Mount device**。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_49_1.png)\n\n\
    ## 卸载磁盘驱动器\n\n当你移除软盘并插入另一张时，你不会立即看到新软盘的内容。在其他操作系统中，你通常必须使用命令来重新扫描磁盘驱动器的内容。然而，在使用\
    \ GNOME 时，在移除软盘之前，你始终需要先选择 Unmount device，然后挂载新磁盘。如果你使用适当的文件管理器按钮重新扫描驱动器而不进行卸载/挂载操作，你只会看到第一张软盘的内容。如果你在没有卸载的情况下物理移除磁盘，你将冒着丢失其中数据的风险。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_50_0.png)\n\n## CD-ROM 驱动器\n\n当你在 GNOME\
    \ 中将 CD-ROM 光盘插入 CD-ROM 驱动器时，通常会在桌面上显示一个图标，并且文件管理器会启动并打开 CD-ROM 目录，显示光盘的内容。此示例展示了随机附带的某些\
    \ Red Hat Linux 版本中 CD 的内容之一。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_50_1.png)\n\
    \n## 系统自定义\n\n通过 GNOME 控制中心，你可以配置桌面和系统的许多方面——从桌面背景到占据它的图标。\n\n## GNOME 控制中心\n\n\
    除了配置你的桌面和系统之外，你还可以通过 Linux 中一组被称为“capplets”（代表“Control Center applets”）的工具，来个性化你正在使用的窗口和菜单中最小的功能。\n\
    \n## 访问控制中心\n\n- 你很可能进行的大多数自定义操作都是通过 GNOME 控制中心完成的。\n- 访问控制中心有三种方式：\n  1. 通过 Settings\
    \ 菜单。\n  2. 通过 GNOME Configuration 工具。\n  3. 通过 Settings 菜单子菜单上的 GNOME Control\
    \ Center 选项。从这个子菜单中，你可以访问许多配置选项。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_51_0.png)\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_51_1.png)\n\n然后打开控制中心。要访问控制中心的任何工具，请点击窗口左侧的相应条目，右侧的工作区将填充相关的控件。如果你曾经使用过\
    \ Windows 98 或 Mac OS 等操作系统，你会对 GNOME 控制中心中找到的许多配置选项有合理的熟悉度。\n\n- GNOME 控制中心包含七个主要的控件组：\n\
    \  - Desktop\n  - Document Handlers\n  - Multimedia\n  - Peripherals\n  - Sawish\
    \ Window Manager\n  - Session\n  - User Interface\n\n所有这些提供子菜单，每个子菜单包含许多配置选项。其中大多数允许你在接受更改为最终设置之前先测试这些更改。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_52_0.png)\n\n如果你进行了一些更改但未最终接受它们（即，你点击了\
    \ Try 按钮而不是 OK），然后尝试退出控制中心，将会出现一个警告框，让你有机会丢弃所有更改，并列出你修改的所有模块。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_52_1.png)\n\
    \n"
