    \ 你可以单击控制中心窗口中的 **Play**（播放）按钮来预览此声音。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_56_1.png)\n\
    \n## 桌面：窗口管理器\n\n- 你可以选择在控制中心中该选项，并单击右上角的“添加”按钮来添加窗口管理器。在“添加新窗口管理器”对话框中，输入启动新窗口管理器及其配置工具所需的名称、命令和路径。\n\
    - 要切换窗口管理器，请从列表中选择的名称并单击“试用”按钮。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_57_0.png)\n\
    \n- 一个信息面板会告诉你当前会话需要保存，以及如何保存，无论是现在还是稍后。\n- 现在已切换到新的窗口管理器。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_57_1.png)\n\
    \n## 用户界面\n\n- **用户界面（UI）选项** 涉及更改符合 **GNOME 规范** 的应用程序的外观和感觉。UI 选项包括可分离的工具栏和菜单栏，以及边框、图标和状态栏的外观。UI\
    \ **小工具** 实际上是为高级用户准备的。如果你对这些选项中提供的任何内容不确定，请冒险犯错误，以免你稍后悔。\n\n**菜单选项**\n- ☑ 可以分离和移动菜单\n\
    - ☑ 菜单具有 **凸起的边框（raised border）**\n- ☑ 子菜单可以被 **撕下（torn off）**\n- ☑ 菜单 **项（items）**\
    \ 具有 **图标（icons）**\n\n**工具栏选项**\n- ☑ 可以 **分离（detach）** 和 **移动（move）**\n- ☑ **工具栏（Toolbar）**\
    \ 具有 **凸起（raised）**\n- ☑ 工具栏 **按钮（buttons）** 具有\n- ☑ 工具栏具有 **线条（line）**\n- ☑ 工具栏具有\
    \ **工具（tool）**\n- ☑ 工具栏具有 **线条（line）**\n\n**状态栏选项**\n- ☑ 状态栏在 **可能时** **是** **交互式的（interactive）**\n\
    - ☑ 状态栏进度条在右侧\n\n*用户界面菜单选项。*\n\n![](img/773dce76f7b88c1faa45d71937dc4026_58_0.png)\n\
    \n## 文件管理器首选项\n\n- 访问 Gnome 文件管理器首选项的一种方法是右键单击桌面，并从此出现在屏幕上的弹出菜单中选择 **桌面属性（Desktop\
    \ Properties）**。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_58_1.png)\n\n- **首选项（The\
    \ Preferences）** 对话框打开。它由五个选项卡组成：**文件显示（File Display）**、**确认（Confirmation）**、**VFS**、**缓存（Caching）**\
    \ 和 **桌面（Desktop）**。桌面设置决定了桌面上文本和图标的位置和外观。\n\n## 使用 Linux 在线\n\n如果你使用 Linux 连接到互联网，并且已经拥有互联网服务提供商（ISP）的账户，只要你了解必要的设置，就不会有太多问题。\n\
    \n## 建立连接\n\n设置新连接意味着你将进行影响计算机功能的更改。这意味着系统将提示你提供管理员（root）密码。没有这个密码，你将无法继续。\n\n\
    ## 开始流程\n\n- 开始连接过程的第一步是双击桌面上的 **拨号配置（Dialup Configuration）** 图标。\n\n![](img/773dce76f7b88c1faa45d71937dc4026_59_0.png)\n\
    \n## 添加新连接\n\n- 打开第一个“添加新互联网连接”面板。从这一点开始，你只需按照提示在每个窗口和对话框中输入必要的详细信息，然后单击“下一步”即可。\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_59_1.png)\n\n## KDE 替代方案\n\n在 KDE 桌面环境中（与\
