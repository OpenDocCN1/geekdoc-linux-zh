    ## THE DESK GUIDE


    The GNOME desktop and the main groups of software are supplied with a default
    installation of GNOME. If you are the kind of user who takes full advantage of
    a multitasking environment, it doesn''t take long for the GNOME desktop to become
    completely filled with windows. GNOME has an excellent solution for this problem
    in the form of the Desk Guide, which is a virtual desktop that can hold multiple
    desktops, each accessible at the click of a button.


    ### DESK GUIDE ICON IN THE GNOME PANEL


    - The Desk Guide feature is already set up on your PC, you will see its icon on
    the GNOME panel.

    - If the Desk Guide icon does not appear there, right-click on the GNOME Panel
    and choose Desk Guide from the Utility menu.


    ![](img/773dce76f7b88c1faa45d71937dc4026_27_0.png)


    In the default four-square Desk Guide, clicking on any of the squares reveals
    a completely new area of the desktop. Any window you open within any of these
    windows remains in place until you return to it, thus quadrupling the size of
    your desktop simply and quickly.


    ![](img/773dce76f7b88c1faa45d71937dc4026_27_1.png)


    ### CLUTTERED WORKSPACE


    - If you are already working with a window and your current workspace is getting
    too cluttered, click the top-left corner of the window and choose **Send window
    to Next (or Previous) Workspace** from the menu that appears. It will immediately
    be moved to the next workspace.


    ![](img/773dce76f7b88c1faa45d71937dc4026_28_0.png)


    ## GNOME PANEL FEATURES


    The GNOME panel is the bar that runs along the bottom of the desktop. It is a
    jumping-off point to apps (mini-applications) that work from the panel, and configuration
    tools that can be customized by the user who can add their own selection of menus
    and links to applications and files.


    It is also possible to place additional GNOME panels elsewhere on the desktop.
    The illustration here shows the items supplied with a default installation of
    the GNOME desktop.


    ![](img/773dce76f7b88c1faa45d71937dc4026_28_1.png)


    ### THE GNOME PANEL


    1. The GNOME Button

    2. The Screenshot Button

    3. Integrated Help System

    4. Terminal Emulation Program

    5. GNOME Control Center

    6. Netscape Navigator


    ## THE GNOME BUTTON


    - Click the GNOME button (showing the footprint logo) to display the main menu.


    ![](img/773dce76f7b88c1faa45d71937dc4026_29_0.png)


    ## THE SCREENLOCK BUTTON


    - Clicking this button opens this panel and locks the screen. It can only be unlocked
    when the user types their password in the box provided.


    ![](img/773dce76f7b88c1faa45d71937dc4026_29_1.png)


    ## INTEGRATED HELP SYSTEM


    - This provides comprehensive online help for the GNOME desktop environment.


    ![](img/773dce76f7b88c1faa45d71937dc4026_29_2.png)


    ## TERMINAL EMULATION PROGRAM


    - This enables the user to type commands directly into the Linux operating system.


    ![](img/773dce76f7b88c1faa45d71937dc4026_30_0.png)


    ## GNOME CONTROL CENTER


    - This enables the user to tweak the applets that determine every aspect of the
    desktop''s appearance and functionality.


    ![](img/773dce76f7b88c1faa45d71937dc4026_30_1.png)


    ## ADDING NEW PANELS


    - If you find that the GNOME panel is becoming cluttered, you can create another
    panel by choosing Create Panel from the Panel menu. You are given several options
    regarding the positioning and behavior of the new panel.


    ![](img/773dce76f7b88c1faa45d71937dc4026_30_2.png)


    ## GNOME Applets


    GNOME applets are mini-applications that are operated from controls that sit in
    the GNOME panel. The default installation of GNOME with Red Hat Linux includes
    dozens of useful applets, but it is left to you to choose the ones you would like
    to place on your GNOME panel. Most of these applets can be customized if you right-click
    the applet on the panel and choose the appropriate options from the on-screen,
    pop-up menus.


    ### ADDING ITEMS TO THE PANEL


    - To add an applet to the GNOME panel, right-click on a blank part of the panel,
    choose **Applets** from the pop-up menu and then select the item from the appropriate
    submenu. You can also choose the Applet menu directly from the main GNOME menu.

    - This example shows the CD Player applet being selected and added.


    ![](img/773dce76f7b88c1faa45d71937dc4026_31_0.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_31_1.png)


    ### CHARACTER PICKER


    - The Character Picker applet enables you to copy and paste special characters,
    such as accented letters and math symbols, into your document irrespective of
    the particular application that you are using.


    ![](img/773dce76f7b88c1faa45d71937dc4026_31_2.png)


    The Character Picker applet


    ### AVAILABLE APPLTTS


    Six categories of applets are available with the standard installation of GNOME.
    Among the most useful is Drive Mount, which provides an icon for the floppy disk
    drive and shows the current state of the drive. Clicking on this icon will mount
    or unmount the drive. This is quicker than right-clicking and choosing the mount
    or unmount menu items, which are the alternatives [ ].


    ![](img/773dce76f7b88c1faa45d71937dc4026_32_0.png)


    WebControl is a simple network applet that enables you to type a web address and
    go straight to that site. It is available via the Network submenu.


    If you are not currently using Netscape Navigator, it will launch the program
    automatically. If you are running Netscape, WebControl also provides the option
    to open the website that you have chosen in a new window.


    ![](img/773dce76f7b88c1faa45d71937dc4026_32_1.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_32_2.png)


    ### Accessing Other Drives


    ## GNOME PROGRAMS


    GNOME (as supplied with Red Hat Linux) includes a very large number and variety
    of free programs. Grouped under nine main categories, the GNOME programs collection
    is well worth taking time to explore.


    ### THE PROGRAMS MENU


    - If you continue to use Linux, the Programs menu is likely to be merely the starting
    point for using your collection of Linux applications. However, you may find that
    you continue to use some of these programs, especially as the authors (and other
    Linux developers) will be regularly improving and enhancing them.


    ![](img/773dce76f7b88c1faa45d71937dc4026_33_0.png)


    ### PROGRAMS: APPLICATIONS


    - Gnopad+ and gedit are only two of the text editors available for use with GNOME.
    They are accessed from the Applications submenu of the Programs menu.


    ![](img/773dce76f7b88c1faa45d71937dc4026_33_1.png)


    Gnotepad+ is intended mainly for use as a hyper-text markup language (HTML) text
    editor, with many useful shortcuts for web-page composition.


    Gedit is a simple and effective word-processing application.


    ![](img/773dce76f7b88c1faa45d71937dc4026_34_0.png)


    ### CALENDAR


    - The GNOME Calendar is simple, but contains many features you might expect in
    a commercial product. The Calendar is launched from the Applications submenu.

    - There are four tabs: Day, Week, Month, and Year. Each one displays in its own
    time period, but allows you to schedule appointments from any of the other tabs.


    ![](img/773dce76f7b88c1faa45d71937dc4026_34_1.png)


    ## PROGRAMS: APPLICATIONS


    - Other applications include Gnumeric, the GNOME spreadsheet, and Dia, a diagram
    editor. Both of these are very easy if you have some familiarity with these kinds
    of applications.


    ## PROGRAMS: UTILITIES


    - The utilities accessed from the Programs menu differ from the utilities available
