- raw:
  - '[PAGE 53]


    The next pages show just a few of the dozens of tools, or applets, that are available
    via the GNOME Control Center, beginning with the area that everyone usually decides
    to personalize first - the GNOME desktop.


    # DESKTOP: BACKGROUND


    +   - The tools in the Control Center can be used to choose a background from
    an image file or from a solid color or a gradient. If you choose to opt for a
    gradient, you need to choose two colors and then specify how these are to be merged.

    +   - Here, as with most other controls, you are given options to try out your
    changes and revert to the original state if you do not like what you''ve done.


    ![](img/773dce76f7b88c1faa45d71937dc4026_53_0.png)


    # TRY IT FIRST


    To cancel the changes, click on the **Discard all changes** button in the Control
    Center''s Warning box. To confirm a change, double-click the highlighted entry
    in the list and make the modifications. These can then be confirmed by clicking
    OK in the *Options* window.'
  - "[PAGE 54]\n\n# DESKTOP: PANEL\n\n+   - The Global panel properties dialog, shown\
    \ here, gives you options to change almost every aspect of the panel’s size, shape,\
    \ texture, and position.  \n+       - This example shows the buttons page. The\
    \ drop-down menus, that appear when you click the button next to Button type,\
    \ gives you a choice of four button types: Launcher, Drawer, Menu, and Special.\
    \  \n+       - There are four other tabs at the top of the panel properties dialog\
    \ called Animation, Panel objects, Menu, and Miscellaneous. Most of the options\
    \ that are activated by these buttons and sliders are self-explanatory and you\
    \ can choose to try, accept or revert by clicking the\n\n![](img/773dce76f7b88c1faa45d71937dc4026_54_0.png)\n\
    \nappropriate button at the bottom of the panel window. However, you will not\
    \ be able to access some parts of this capplet (e.g., the system part of the Menu\
    \ page) unless you are logged in as root.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_54_1.png)\n\
    \n# ALTERNATIVE ACCESS\n\n+   - You can also access the above capplet from the\
    \ desktop. Begin by right-clicking on the GNOME panel at the foot of the screen,\
    \ choose: Panel from the pop-up menu, and then select Global Preferences from\
    \ the Panel submenu."
  - '[PAGE 55]


    # DESKTOP: THEME SELECTOR


    +   More than a dozen desktop themes are provided with GNOME, and you can preview
    or select any of them using the Theme Selector capplet.

    +   Clicking the Try button will transform the desktop into the theme that you
    have highlighted in the Available Themes box. If you click on the Preview button
    to the right of this box, the theme will only be applied to the material in the
    Preview box below, as shown in this example. If the Auto Preview button is depressed,
    you do not need to click the Preview button. This capplet also gives you the facility
    to install new themes, an ever- growing number of which are available on the net.


    ![](img/773dce76f7b88c1faa45d71937dc4026_55_0.png)


    # TWO FURTHER CAPPLETS


    **The Session Manager Capplet**

    This capplet allows you to control the GNOME Session Management, which specifies
    the programs that start up, how you save your GNOME configuration, and how you
    log out.

    **The GNOME Edit Properties Capplet**

    With this capplet, you can select which editor will be your default editor while
    using GNOME. This will allow applications like the GNOME File Manager to launch
    the correct editor when you try to open files associated with editing. All the
    popular text editors are included in the selection list.'
  - '[PAGE 56]


    # MULTIMEDIA: SOUND


    You can use the Sound caplet to set the sounds


    for a wide range of GNOME system events.


    First, click the Sound Events tab, then highlight an event to which you wish to
    attach the sound.


    ![](img/773dce76f7b88c1faa45d71937dc4026_56_0.png)


    - The **Select sound file** dialog box opens. Choose a sound for the event that
    you have highlighted, click on the **Browse** button, and navigate to the appropriate
    *.wav* file on your hard disk.

    You can preview this sound by clicking on the **Play** button in the Control Center
    window.


    ![](img/773dce76f7b88c1faa45d71937dc4026_56_1.png)'
  - '[PAGE 57]


    # **DESKTOP:

    WINDOW MANAGERS**


    • You can add window managers by selecting that option in the Control Center,
    and clicking the


    Add button in the top-right corner. In the Add New Window Manager dialog box,
    enter the name, the commands, and the paths required for launching the


    new window manager with its configuration tool.

    • To switch Window Managers, select the required name from the list and click
    the “Try” button.


    ![](img/773dce76f7b88c1faa45d71937dc4026_57_0.png)


    +   - An Information panel tells you that your current session needs to be saved,
    and how to do it, either now or later.

    +   - You are now switched to the new window manager.


    ![](img/773dce76f7b88c1faa45d71937dc4026_57_1.png)'
  - '[PAGE 58]


    # THE USER INTERFACE


    • **The User Interface (UI) options** involve changing the look and feel of applications
    that are **GNOME-compliant**. UI options include detachable toolbars and menu
    bars, and the look of borders, icons, and status bars. The UI **capplet** is really
    for advanced users. If you are unsure about any of the options offered here, don’t
    risk making an error that you might later regret.


    Menu Options


    +   ☑ Can detach and move menus

    +   ☑ Menus have **raised border**

    +   ☑ Submenus can be **torn off**

    +   ☑ Menu **items** have **icons**


    Toolbars Options


    +   ☑ Can **detach** and **move**

    +   ☑ **Toolbar** have **raised**

    +   ☑ Toolbar **buttons** have

    +   ☑ Toolbars have **line**

    +   ☑ Toolbars have **tool**

    +   ☑ Toolbars have **line**


    StatusBar Options


    +   ☑ StatusBar **is** **interactive** **when** **possible**

    +   ☑ StatusBar progress meter on the right


    *User Interface menu options.*


    ![](img/773dce76f7b88c1faa45d71937dc4026_58_0.png)


    # FILE MANAGER PREFERENCES


    • One way to access the preferences for the Gnome File Manager is to right-click
    on the desktop and choose **Desktop Properties** from this pop-up menu that appears
    on-screen.


    ![](img/773dce76f7b88c1faa45d71937dc4026_58_1.png)


    • **The Preferences** dialog box opens. It comprises five tabs: **File Display**,
    **Confirmation**, **VFS**, **Caching**, and **Desktop**. The Desktop settings
    determine the positioning and appearance of text and icons on the desktop.'
  - '[PAGE 59]


    # **ONLINE WITH LINUX**

    If you are connecting to the internet using Linux and already have an account
    with an Internet Service Provider, you will have few problems, provided you know
    the necessary settings.


    # ESTABLISHING A CONNECTION


    Setting up a new connection means that you will be making changes that affect
    the way your computer functions. This means that you will be prompted to provide
    the administrator''s (root) password. Without this, you will not be able to proceed.


    # **START THE PROCESS**

    • The first step in beginning the connection process is to double-click the **Dialup
    Configuration** icon on the desktop.


    ![](img/773dce76f7b88c1faa45d71937dc4026_59_0.png)


    # **ADDING A NEW CONNECTION**

    • The first Add New Internet Connection panel opens. All you should need to do
    from this point onward is to type the necessary details into each window and dialog
    box when prompted, and then click on Next.


    ![](img/773dce76f7b88c1faa45d71937dc4026_59_1.png)'
  - "[PAGE 60]\n\n# THE KDE ALTERNATIVE\n\nIn the KDE desktop environment, as opposed\
    \ to GNOME's desktop, the kppp Internet configuration software is supplied with\
    \ Red Hat Linux, and\n\nprovides an alternative to GNOME's Dialup Configuration\
    \ software.  \nBoth are equally effective but you can't mix the desktops with\
    \ the configura-\n\ntions. In other words, if you principally intend to use the\
    \ GNOME desktop environment, stick with the Dialup Configuration tool.\n\n# INFORMATION\
    \ YOU WILL NEED\n\nBe sure to have made a list of the following information before\
    \ you begin setting up your Internet account. This information should be provided\
    \ by your Internet Service Provider (ISP), particularly if you have previously\
    \ connected\n\n+   using their proprietary software:\n+   * The ISP's dial-in\
    \ telephone number (for accessing the Internet)\n+   * Your user name\n+   * Your\
    \ password\n+   * Mail server addresses\n+   There will usually be two of these:\
    \ one for incoming\n\n+   mail (e.g., pop3.yourisp.com) and one for outgoing mail\
    \ (e.g., smtp.yourisp.com)\n+   * Your password (for your mail) server (a second\
    \ password is sometimes required by some ISPs to collect your mail)\n+   * News\
    \ server name.\n\n# CONFIGURING A MODEM\n\nIf you have a modem attached to your\
    \ PC (or installed inside it), but it has not been automatically detected and\
    \ configured during installation of Linux, the Select Modem window will open at\
    \ this point as Red Hat Linux attempts to auto-detect it.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_60_0.png)"
