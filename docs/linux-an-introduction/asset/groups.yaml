  - '[PAGE 46]


    # # Using SYMLINKS


    In the GNOME desktop environment, a symlink (symbolic link) points to a file or
    directory that you can either place on your desktop, in a GNOME panel, or in any
    other folder in the File Manager. The


    symlink is similar to the shortcut in Windows or the alias in the Apple Mac operating
    system. You can rename, move, or delete the symlink without affecting the file
    or directory that it points to.


    # ## CREATING A SYMLINK


    +   To create a symlink, right-click on the file or folder that you want to link
    to in this example, the file **Story - ideas** is to have a symlink pointing to
    it.


    ![](img/773dce76f7b88c1faa45d71937dc4026_46_0.png)


    +   After choosing Symlink from the drop-down menu that appears, the Symbolic
    Link dialog box opens. Type the path and filename for the file in the Existing
    filename text box. In the Symbolic link filename text box, enter the name that
    the symlink is to have. In this example, **Story ideas** is to be a symlink in
    the same directory as the file called **Story - ideas**. Click on OK.


    ![](img/773dce76f7b88c1faa45d71937dc4026_46_1.png)'
  - '[PAGE 47]


    # 4 • THE FILE MANAGER


    The symlink appears in the directory window.

    Double-clicking on this link will now open the main file.


    ![](img/773dce76f7b88c1faa45d71937dc4026_47_0.png)


    # DRAGGING TO THE GNOME PANEL


    All aspects of the GNOME desktop environment are highly customizable, as we have
    seen in earlier pages. If you intend to use any directory on your hard drive regularly,
    and would like to be able to access it directly from the GNOME desktop, you can
    arrange to access it directly from the GNOME panel. Simply drag its icon from
    the File Manager window over a suitably empty area of the GNOME panel and release
    the mouse button.


    # ACCESSING THE CONTENTS DIRECTLY


    To access the directory''s contents directly in future, click the icon on the
    GNOME panel. This example shows the Home directory (for the user called alba)
    transferred to the GNOME panel.


    ![](img/773dce76f7b88c1faa45d71937dc4026_47_1.png)'
  - '[PAGE 48]


    # ## ESSENTIAL KEYBOARD SHORTCUTS


    The following keyboard and mouse shortcuts are essential if you are to use the
    File Manager and GNOME desktop effectively.


    +   - [Ctrl]+ DRAG

    +     Hold down the [Ctrl] key while dragging a file


    +   - means that you copy that file (i.e. you move a copy of that file rather
    than the file itself).

    +   - [Ctrl]+ CLICK

    +     Use [Ctrl]+ click to select a range of files within the right window. If
    you


    +   - intend to use this method, it is preferable not to view by icon.

    +   - [Ctrl]+ CLICK

    +     To select or deselect a single file from a group, hold down the [Ctrl] key
    while clicking on the appropriate file.


    # ## THE RIGHT-CLICK POP-UP MENU


    Using the right mouse button, one of the most useful shortcuts you can employ
    in GNOME. When you right-click on a file or an applet, a menu appears offering
    most of the main options that you will need to use.

    - Open a file.

    - Open with Enables you to determine which application to use for opening that
    particular file, or file-type.

    - Edit to amend the file.

    - Copy This produces a dialog box in which you type the new location to which
    the file is to be copied.

    - Move to trash

    - Delete This option completely bypasses the


    possibility of retrieving a file, which is offered by first moving an item to
    the trash can.

    - Move A dialog box opens in which you enter the new location for the file.

    - Panel This submenu contains various items, including submenus for adding and
    removing panels and applets.


    - Symbolic link This enables you to create a symbolic link, which is broadly equivalent
    to a shortcut in the Windows or an Alias on the Mac operating systems.

    - Properties The Properties dialog box contains three tabs, each opening a page
    containing statistics, options, and permissions, which relate to who is able to
    edit, copy, or delete the file.


    ![](img/773dce76f7b88c1faa45d71937dc4026_48_0.png)'
  - '[PAGE 49]


    # ACCESSING OTHER DRIVES


    Linux shows all the directories in one

    directory tree, irrespective of what drives

    they are found on. There are no drive

    letters in Linux; the contents of all disks


    simply appear as subdirectories. Also, the

    content of removable disks does not

    appear automatically; the drives first have

    to be "mounted" to view their contents.


    # THE DISK ICONS


    +   • The icons representing

    +   the floppy disk and CD-

    +   ROM disc drive appear in the

    +   lower left-hand corner

    +   of the desktop. These icons

    +   are symbolic links to the

    +   directories **mnt/floppy** and

    +   **mnt/cdrom** respectively.


    ![](img/773dce76f7b88c1faa45d71937dc4026_49_0.png)


    # MOUNTING THE

    FLOPPY DISK DRIVE


    +   • Before you can view the

    +   contents of a floppy disk

    +   after inserting it into the

    +   appropriate drive, you

    +   need to mount the drive.

    +   Do this by right-clicking

    +   the relevant drive icon

    +   on the desktop and

    +   choosing **Mount device**

    +   from the pop-up menu.


    ![](img/773dce76f7b88c1faa45d71937dc4026_49_1.png)'
  - '[PAGE 50]


    # UNMOUNTING

    A DISK DRIVE


    e

    When you remove the floppy disk and insert another, you will not immediately see
    the contents of the new floppy disk. With other operating systems, you usually
    have to


    use a command to rescan the contents of the disk drive. With GNOME, however, you
    always need to select Unmount device before removing a floppy disk, and then mount
    the new disk. If you simply


    rescan the drive using the


    appropriate File Manager button without unmounting/mounting, you will only see
    the contents of the first floppy disk. If you physically remove a disk before
    you have unmounted it, you risk losing the data on it.


    ![](img/773dce76f7b88c1faa45d71937dc4026_50_0.png)


    # CD-ROM DRIVE


    e When you insert a CD- ROM disc in the CD-ROM drive using GNOME, an icon will
    usually appear on the desktop and the File Manager will launch with the CD-ROM
    directory open, showing the disc''s contents. This example shows the contents
    of one of the CDs bundled with some versions of Red Hat Linux.


    ![](img/773dce76f7b88c1faa45d71937dc4026_50_1.png)'
  - '[PAGE 51]


    # SYSTEM CUSTOMIZING


    With the GNOME Control Center you can configure many

    aspects of your desktop and your system – from the desktop

    background to icons that occupy it.


    # THE GNOME CONTROL CENTER


    Beyond configuring your desktop and

    system, you can personalize the smallest

    features of the windows and menus that

    you work with by using a collection of

    tools within Linux, known as “capplets,”

    which stands for “Control Center applets.”


    # ACCESSING THE

    CONTROL CENTER


    +   • Most of the customiz-

    +   ation that you are likely

    +   to carry out is done

    +   through the GNOME

    +   Control Center.

    +   • There are three ways to

    +   access the Control Center:

    +   1 Via the Settings menu.

    +   2 Via the GNOME

    +   Configuration tool.

    +   3 Via a GNOME Control

    +   Center option on the

    +   submenu of the Settings

    +   menu. From this submenu

    +   you can access a number of

    +   configuration options.


    ![](img/773dce76f7b88c1faa45d71937dc4026_51_0.png)


    ![](img/773dce76f7b88c1faa45d71937dc4026_51_1.png)'
  - '[PAGE 52]


    The Control Center then opens. To access any of the Control Center tools, click
    on the appropriate entry in the left side of the window and the workspace on the
    right will fill with the relevant controls. If you have used operating systems
    such as Windows 98 or the Mac OS, you will be reasonably familiar with many of
    the configuration options you will find in the GNOME Control Center.


    +   * The GNOME Control Center contains seven main groups of controls:

    +       * Desktop

    +       * Document Handlers

    +       * Multimedia

    +       * Peripherals

    +       * Sawish Window Manager

    +       * Session

    +       * User Interface

    +       * All these offer submenus, each of which contains many configuration
    options. Most of these give you the opportunity to test your changes before accepting
    them as final.


    ![](img/773dce76f7b88c1faa45d71937dc4026_52_0.png)


    If you have made some changes without finally accepting them (i.e., you have clicked
    on the Try button rather than OK) and you then attempt to quit the Control Center,
    a Warning box appears giving you a chance to Discard all changes, listing all
    modules that you have modified.


    ![](img/773dce76f7b88c1faa45d71937dc4026_52_1.png)'
