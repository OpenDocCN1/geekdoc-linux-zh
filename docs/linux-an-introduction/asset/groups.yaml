  - '[PAGE 23]


    # # THE GNOME DESKTOP


    This section is a quick tour of Red Hat Linux showing the

    package of features that is installed with GNOME, which is one

    of the two desktop environments supplied with Red Hat Linux.


    # ## LOGGING ON AND OFF


    When you start your PC with Linux as

    the operating system (rather than

    Windows ME, for example) you will

    see the screen fill with lines of text that


    contain information indicating that Linux

    is checking, enabling, and starting all the

    software that will drive your system -- each

    followed by **OK** if the check is passed.


    # ### ENTER USER NAME

    ### AND PASSWORD


    +   - Your exact log-in procedure will have been defined

    +   by whoever installed Linux

    +   on your computer. If a

    +   graphical interface has been


    chosen, you will see the

    GNOME log-in screen.

    If not, you will see a text

    prompt asking you for your

    user name and then your

    password. In either case,

    supply your user name


    and password (*not the root

    user name and password*)

    when prompted. If you are

    using a graphical interface,

    you will usually boot

    straight into the GNOME

    desktop environment.


    # ### TYPING AT

    ### THE PROMPT


    +   - If a graphical interface is

    +   not being used, you will see

    +   a text prompt similar to

    +   this example (where your

    +   password replaces alba) at

    +   the localhost login prompt.

    +   - To start GNOME, type

    +   startx and press Enter.


    ![](img/773dce76f7b88c1faa45d71937dc4026_23_0.png)'
  - "[PAGE 24]\n\n![](img/773dce76f7b88c1faa45d71937dc4026_24_0.png)\n\n**LOGGING\
    \ OFF**\n* To log off from GNOME, choose Log out from the Main GNOME menu. This\
    \ displays a dialog box with up to three options:\n\t* LOGOUT to end the GNOME\
    \ session.\n\t* HALT to shut down the computer.\n\t* REBOOT to reboot.\n\n# USING\
    \ THE ROOT PASSWORD\n\nIf you are a user of a standalone PC, you may find that\
    \ Linux places more emphasis on user names, passwords, and security than you are\
    \ used to. If you attempt to take any action that will make system-level changes\
    \ to your PC, you will be required to enter the root password because the\n\n\
    changes will affect all users of the computer, not merely you. If you are the\
    \ only user of that computer, this may seem unnecessary. However, if you share\
    \ your computer with others, the importance of limiting these controls to one\
    \ \"superuser\" soon becomes apparent.\n\n**THE NEED FOR THE PASSWORD**\n* If\
    \ you do not have access to the root password – probably because someone else\
    \ has installed Linux – you will need either to ask them for the password or to\
    \ log in each time that any system-level changes are required.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_24_1.png)\n\
    \n![](img/773dce76f7b88c1faa45d71937dc4026_24_2.png)"
  - '[PAGE 25]


    # # A Quick Tour of GNOME


    Once GNOME has loaded, you are presented with a graphical user interface (GUI),
    which shares many features with other desktop environments, based both on Linux
    and on other operating systems. Files and directories (folders) are viewed and
    handled from windows within the


    File Manager . Other drives are accessed through the File Manager itself or via
    desktop icons. Files, applications, and Web pages can also be accessed via icons
    on the desktop or on the Panel (at the bottom of the desktop). The appearance
    of the desktop features can easily be customized.


    # ## DESKTOP KEY


    +   1.  Symlink to the Home directory.

    +   2.  A symlink is a symbolic link or shortcut that points to a file, directory,
    or drive.

    +   3.  Trash Icon

    +   4.  Two Red Hat shortcuts

    +   5.  The Dialog Configuration tool

    +   6.  Symlinks to the floppy-disk and CD-ROM drives

    +   7.  Default GNOME desktop

    +   8.  GNOME documentation, available on all subjects

    +   9.  GNOME panel

    +   10. The File Manager (showing the Home directory)

    +   11. GNOME panel menus


    ![](img/773dce76f7b88c1faa45d71937dc4026_25_0.png)


    # ### Using the File Manager


    # ### Using Symlinks


