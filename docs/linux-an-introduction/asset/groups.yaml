    ### 入门


    ### 关于本书


    **《Linux入门》** 适合那些对使用微软® Windows操作系统感到自信，并希望了解最可靠的PC替代方案的人群。


    人们常说，Windows是一个设计良好的计算机桌面，但被其背后的操作系统所拖累。Linux®，一个基于UNIX®并由其芬兰创造者林纳斯·托瓦兹设计的操作系统，现在被视为Windows的一个严肃替代品。这本Linux入门指南首先解释它是什么，并描述使用Linux的一些利弊。本书解释了该操作系统的行话，包括“发行版”一词——它指的是正在使用的Linux版本。这里使用的发行版由红帽®提供。书中还介绍了Linux桌面之旅，在本案例中，是GNOME桌面。本书其余部分涉及程序、文件管理、自定义、连接互联网以及最后安装软件。章节和小节通过示例展示书中的信息


    ![](img/773dce76f7b88c1faa45d71937dc4026_5_0.png)

    ![](img/773dce76f7b88c1faa45d71937dc4026_5_1.png)


    这些示例几乎总是配有屏幕示意图，展示它们的外观。本书包含若干功能，帮助你理解正在发生什么以及你需要做什么。命令键，如ENTER和CTRL，显示在这些矩形中：[ENTER]和[CTRL]，以避免混淆，例如，你是应该按下该键还是键入字母“ctrl”。


    交叉引用以左页或右页图标显示在正文中：[页]和[页]。页码和参考内容显示在页面底部。


    除了分步章节外，还有解释特定功能细节的框，以及提供替代方法的提示框。最后，在书的末尾，你会发现常用术语表和综合索引。


