    \ action by you before it is fully configured and ready to use.\n- To find out\
    \ what to do next, you need to locate the **Read me** file, which you will usually\
    \ find in an appropriately named directory within the /usr/share directory on\
    \ your hard drive. In this case, it reveals that some simple, post-installation\
    \ configuration is required by the user. This is far from being unusual with package\
    \ installations.\n\n![](img/773dce76f7b88c1faa45d71937dc4026_72_1.png)\n\n## GLOSSARY\n\
    \n**C** The name of a programming language designed during the early 1970s and\
    \ used to reimplement Unix.\n\n**CLIENT** The client of the program, or end of\
    \ a system, which is receiving the service being provided.\n\n**COMPILE** To turn\
    \ a program source code into an executable machine code file, which cannot be\
    \ read by any human.\n\n**DEBIAN** A free, open source, operating system for a\
    \ computer that uses the Linux kernel.\n\n**DISTRIBUTION** A combination of a\
    \ Linux kernel, a suite of command programs, and other software for installing\
    \ and maintaining a Linux system.\n\n**DRIVER** Computer code that translates\
    \ device-independent instructions into commands that a real device, such as a\
    \ disk drive or a printer, can understand.\n\n**GIMP** The \"GNU Image Manipulation\
    \ Program\" is free software suitable for manipulating images.\n\n**GNOME** A\
    \ desktop manager providing a range of tools to support window managers.\n\n**GNU**\
    \ \"GNU is Not Unix\" refers to the GNU operating system begun by the Free Software\
    \ Foundation to create a free operating system.\n\n**GRAPHICAL USER INTERFACE\
    \ (GUI)** Allows the user to interact with a computer system in a visual manner\
    \ with a minimum of typing.\n\n**HOME DIRECTORY** A directory provided to store\
    \ the personal files and directories of a user.\n\n**HTML** \"Hypertext Markup\
    \ Language\" is the form in which web documents are transmitted and interpreted\
    \ by browsers.\n\n**ISP** \"Internet Service Provider\" is an organization that\
    \ provides people with networked access to the internet.\n\n**IRC** \"Internet\
    \ Relay Chat\" is a worldwide, online \"party line\" network that allows conversations\
    \ to take place in real time.\n\n**KDE** A project to make Linux more user-friendly\
    \ by providing a GUI interface, or desktop, between the user and Linux.\n\n**KERNEL**\
    \ The core of an operating system that contains the most primitive functions on\
    \ which more sophisticated functions depend.\n\n**MODULE** A piece of the kernel\
    \ that performs a specific task.\n\n**MS-DOS** The \"Microsoft Disk Operating\
    \ System\" installed by IBM on their first personal computers.\n\n**MOUNT** This\
    \ command allows the contents of a disk to be placed in a subdirectory of a file\
    \ system.\n\n**OPEN SOURCE** Software for which the source code is freely available,\
    \ to be used, changed, and redistributed.\n\n**OPERATING SYSTEM** The essential\
    \ software of a computer that schedules tasks, allocates storage, and provides\
    \ an interface between the user and applications.\n\n**PPP** \"Point-to-point\
    \ protocol\", is the most popular way of connecting a computer to the internet\
    \ via a dialup modem.\n\n**ROOT** The specially privileged account on a computer\
    \ system that has absolute control over it.\n\n**SOURCE CODE** The readable text\
    \ that programmers create. Source code is compiled for use and is then unreadable.\
    \ Source code for non-free software is kept secret while the source code for free\
    \ software is always available for anyone to fix or improve.\n\n**URL** \"Uniform\
    \ Resource Locator\" is an address that identifies a document or computer on the\
    \ world wide web.\n\n**WINDOW MANAGER** A program that manages a graphical user\
    \ interface by determining the appearance of windows and the response to input\
    \ by the user.\n\n**X WINDOWS** This graphical user interface manages all user\
    \ activity and is accessed by programs to provide their display requirements.\n\
    \n## INDEX\n\n**A**\n\n- advantages of Linux 10\n- aliases see **symlinks**\n\
