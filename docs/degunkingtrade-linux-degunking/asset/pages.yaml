    # GunkBuster Notebook: Perils of Degunking the Web


    One problem with tools like Privoxy is that they can never be 100 percent accurate.
    The proxy will miss some types of gunk, raise false alarms over non-gunky sites,
    and generally interfere with the normal operation of certain sites. For the most
    part, Privoxy and other degunking proxy servers work well, but some-times they
    create their own type of gunk.


    The simplest solution to such problems is to disable your browser''s use of the
    proxy. You can do this on a site-by-site basis by providing an exception list
    to the Web browser, as noted earlier. Sometimes this doesn''t work, though, because
    the problems are with references to a site other than the one you''re viewing.
    Tempor disabling the browser''s use of the proxy server can help work around problems,
    but of course this opens your browser up to all the gunk until you re-enable the
    proxy. Another option is to keep a second Web browser configured not to use the
    proxy server. You can then run this Web browser whenever you run into a site that
    doesn''t behave well with the proxy server.


    Note that the Web browser''s proxy server can be so easily disabled can be a problem
    if your intent is to keep teenage children from locating porn sites or the like;
    they can simply disable their browsers'' proxy server settings to browse directly.


    ![](img/b3875bade729a8fa10cbc3a09faabd77_263_0.png)'
