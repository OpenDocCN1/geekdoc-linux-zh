    You can research the device category first and then go to the store with a list
    of devices that should work or go to the store to take notes on available hardware
    and research their Linux compatibility. In fact, you might do several rounds of
    this, going back and forth to pick up more information in each location. This
    is easier if you''re shopping on the Internet—you can do it all from the comfort
    of your chair. Of course, if you prefer to buy locally, you can do so, and this
    approach has its advantages, as easier returns the item proves to be defective.


    By doing your homework, you shouldn''t have any surprises when you try to hook
    up the device and use it under Linux. In some cases, you''ll need to install drivers,
    but frequently the drivers that ship with Linux will work fine. Many distributions
    provide hardware-detection tools that run at system boot time, so certain types
    of new hardware will be detected and configured automatically.


    # Summing Up: Degunking the Hardware/Software Interface


    Hardware can be difficult to degunk because its problems are often hard to track
    down. A few hardware troubleshooting tips will help you do so, though. Many hardware
    problems are actually driver problems, so being able to locate new drivers and
    install them can be very important when solving such problems. Other hardware
    issues are really in the hardware itself, and in such cases, the usual solution
    is to replace the hardware. When you do so, you should be sure to research Linux
    compatibility lest you get hardware that doesn''t work any better than the device
    it''s replacing.'
