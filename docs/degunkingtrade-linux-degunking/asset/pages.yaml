    # Configure X Fonts


    In the past, a common complaint concerning Linux and GUI applications is that
    fonts look bad. Although this complaint is heard less often than today it was
    a few years ago, X''s font system is still rather confusing, and font problems
    can really their gumpy heads. Fortunately, you can clean up the mess with the
    help of some understanding and a bit of configuration elbow grease. To begin,
    you must understand how Linux handles fonts. Of course, you may also need to locate
    some fonts worthy of use, so I describe that briefly. With basic knowledge and
    fonts in hand, you can configure Linux''s two main font'
  merge: -1
