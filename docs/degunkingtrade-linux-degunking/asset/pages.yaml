    # Cookies


    Baked sugar, flour, eggs, and other ingredients can certainly create gunk in the
    real world. Gunk can be cleaned up with a dishwasher, a sponge, or other real-world
    cleaners. Web-based cookies are another matter, the idea behind these virtual
    confessions is to give Web sites a way to track users for the benefit of features
    like e-commerce sites''''shopping carts."When you add an item to your shopping
    cart, the Web server delivers a cookie to your computer. When you finish shopping,
    the Web server asks for the cookie and your computer returns it, enabling the
    Web server to ring up the correct purchase. Cookies can also be used in longer-term
    transactions—say, to enable a Web site to remember your preferences for forms
    or the amount you want to save.


    Unfortunately, cookies also have another possible use: to track your online activities.
    Many people object to such tracking, viewing it as an invasion of privacy. Some
    of the worst problems are associated with online advertisers. A handful of companies
    dominate the online advertising that you see and deliver the ads directly from
    their own server rather than the servers of the sites you think you''re visiting.
    This fact enables advertising agencies to track the sites you visit, even if the
    sites are unrelated, and even if they display different ads—if the ads are fed
    through the same agency, they can use cookies to track you. This ability gives
    them data on correlations between sites—say that visitors to a baby care site
    visited an automotive site to view information on minivans. If a visitor goes
    to a hunting site, followed by a porn site, that information can also be added
    to the database. The result can be an unprecedented capacity for online advertisers
    to track you as an individual.


    If this prospect disturbs you, you may want to look into Firefox''s cookie management
    tool, which are accessible from the Privacy area of the Preferences dialog box,
    as shown in Figure 5-10. The Allow Sites to Set Cookies option enables cookie
    features as a group. Checking For the Originating Web Site Only restricts the
    cookies that Firefox accepts to the main Web site. Using this option can help
    keep advertisers cookies of your computer, but it''s not a foolproof option, and
    it can also have unintended consequences. You can also view the cookies that are
    currently set by clicking View Cookies. The result is'
