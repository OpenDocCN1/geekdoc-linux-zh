- img_proc: true
  md: '# Optimizing Your X Configuration 303


    systems, X core fonts and Xft fonts. Finally, I provide some tips on how to go
    about managing your fonts to keep them from gunking up your system.


    # Understanding Linux Fonts


    Linux''s font handling can be confusing because Linux relies on several font-handling
    systems:


    +   X core fonts—The most fundamental Linux font system is the X core system,
    which is the system that X directly supports. X core font support is built into
    X, and it offers certain advantages, such as the ability to use fonts delivered
    by a network font server. On the other hand, X core fonts are rather limiting.
    They don''t support certain modern features, such as font smoothing (aka anti-aliasing),
    in which curves and diagonal lines use pixels with shades of gray rather than
    black or white in order to reduce the jagged appearance of these features. X core
    fonts also don''t provide any easy way to link up with printed fonts, which complicates
    the design of word processors and other print-centric programs.


    +   Xft fonts—In an effort to work around the problems of X core fonts, a new
    system, known as Xft fonts, has been developed. Xft font support smoothing and
    various features that are helpful to software developers. Most modern KDE and
    GNOME programs, among others, use Xft in preference to X core fonts.


    +   Application-specific fonts—Some programs (mostly word processors and other
    programs that need to do sophisticated things when printing) support fonts directly,
    bypassing X core fonts. Most such programs adopted this approach to the development
    of Xft fonts, and most such programs are still being maintained or transitioning
    to Xft fonts.


    Because of this mismatch of font systems, to install a font in Linux, you may
    need to install it several times—once as an X core font, once as an Xft font,
    and perhaps in individual font-using programs such as word processors. (Chapter
    5 describes installing fonts in OpenOffice.org, for instance.)


    # Obtaining Good Fonts


    Linux distributions ship with a wide variety of fonts, but the details vary greatly
    from one distribution to another. Two key fonts are almost always present, though:
    clones of several common fonts found on PostScript printers, provided as part
    of Ghostscript, and the BitstreamVera fonts. These are all useful, but you may
    want to move beyond them. You have several options, including the following, for
    doing so:'
