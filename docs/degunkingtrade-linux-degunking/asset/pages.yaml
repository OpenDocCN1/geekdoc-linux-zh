  md: 'These questions should help you evaluate each file you encounter and decide
    what to do with it: delete it or save it. Your evaluation could change over time,
    of course—something might be worth keeping today but not next month or next year.Thus,
    you may want to go through your files now and then clean them all up.


    To delete files in Linux, you can use either the text-mode rm command or drag-and-drop
    operations in most managers. To use rm, type the command followed by the name
    or names of the files you want to delete, in rm letters/mathilda.swx papers/quantum.doc.
    Ordinarily, rm won''t delete directories, though. To delete an entire directory,
    including all the files it contains, pass the -r option to rm along with the directory
    name, as in -r olddir. To delete just one empty directory, you can use rmdir,
    as in rmdir olddir. If you use a GUI manager, you may need to select a menu option
    to “empty” the “trash can” before the files are truly gone; simply moving the
    files to the trash puts them in a temporary holding area from which they can still
    be recovered.


    > By default, rm provides no prompts or warnings; it just goes and deletes everything
    you intend to delete. The rm command also doesn''t implement a "trash can" function;
    if you''ve deleted something with rm, it''s gone! This means you can easily wipe
    out all the files in your home directory (or, if you run rm as root, all the files
    on the system!) Some distributions configure prompt you before deleting files,
    which tends to be safer. You can do the same using the -i option to rm.


    In some cases, a third option exists beyond keeping or saving a file: archiving.
    You can save a file to a CD-R, Zip disk, or other removable medium. This practice
    gets the large file off of your hard disk and out of your main directory tree.
    If you make multiple copies or store the archives on good long-term archival media
    (as CD-R discs), archiving has the added advantage of keeping it—safer than it
    might be on hard disks, which occasionally fail in devastating ways. You''ll also
    be able to easily move the data from one computer to the another, which can be
    handy in offices or when you replace your computer with a new one.


    Appendix A archiving files via backup software. Backing up your entire system
    is an important safety measure, and regularly backing up your files is also used.


