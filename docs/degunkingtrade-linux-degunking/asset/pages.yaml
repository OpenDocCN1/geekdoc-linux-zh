    # Managing OpenOffice.org Fonts


    As of version 1.1.4, OpenOffice.org uses its own fonts rather than those provided
    by X (and described in Chapter 12,"Optimizing Your X Configuration"). Thus, if
    you want to use your own fonts in OpenOffice.org, you must install them in OpenOffice.org.
    Likewise, if you want to remove fonts dekung your font menus, you must do so in
    OpenOffice.org.


    > *NOTE: Some Linux distributions, such as Fedora, reconfigure your OpenOffice.org
    programs to look in system font directories for fonts. These modified OpenOffice.org
    programs lock the font installation options described here. Instead, you should
    manage your system fonts as described in Chapter 12 and the OpenOffice.org fonts
    should mirror changes.*


    OpenOffice.org can use either TrueType or Adobe Type 1 (aka Adobe Type Manager,
    or ATM) fonts. All Linux distributions ship with a wide variety of fonts of one
    or both types. These are usually located in subdirectories of /usr/share/fonts
    or /usr/X11/lib/X11/. Check these directories to see what''s available on your
    system. TrueType fonts have filename extensions of .ttf and Type 1 fonts have
    extensions of .pfa or .pbf. Most other filename extensions denote other font types,
    such as bitmapped fonts, which OpenOffice.org can''t use. You can also download
    fonts from numerous sources on the Internet or buy CD-ROMs containing dozens or
    hundreds of fonts at most computer stores.'
