    # GunkBuster''s Notebook: Working with File Types


    One problem with Linux filename extensions is that they aren''t a guarantee of
    the contents. You can easily rename, say, a PDF file to have an extension of .zip.
    The result can be confusing, of course, but such things happen by accident or
    because somebody misunderstood what an extension means.


    Although not a filename extension, particular filename deserves mention: core.
    Certain types of Linux programs automatically create a core dump, which is the
    contents of the memory the program had using, placed in a file called core. (Core
    dumps are so called because they represent core memory, which is a very old term
    for what is today called RAM.) Core dumps are useful to programmers, who can use
    debugging tools to examine the program''s state when it crashed to find the cause
    of the crash. If you''re not a programmer, core dumps are useless. Thus, if you
    find a file called core in your home directory, you can safely delete it. These
    files consume a lot of disk space, so searching for them with tools such as find
    (described later, in “Using find”) can help you clear up a lot of wasted space.'
