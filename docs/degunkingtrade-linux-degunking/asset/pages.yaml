    rather than shed them, and operating systems (OS) accumulate features and programs
    like dust under a bed. At worst, these new features consume resources and add
    complexity providing little or no benefit in return. At best, these new features
    and programs add something useful to a subset of the target audience. Sometimes
    this subset is large, frequently it''s not. How many people need spell-check dictionaries
    for dozen languages? How many people regularly run four desktop environments?
    For people who don''t need all these features, the unused features are gunk. Unused
