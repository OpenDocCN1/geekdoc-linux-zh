- img_proc: true
  md: 'these tools, such as XCD-Roast (http://www.xdroast.org), ERaster (http://cliptun.uni-klu.ac.at/eroaster.php),
    and K3b (http://www.k3b.org), can help simplify the process.


    +   - Commercial and high-end tools—Large installations frequently make use of
    sophisticated tools, some of which are commercial. These programs simplify the
    backup of an entire network of computers.


    Because of its popularity (including its use in non-backup operations) and the
    fact that it''s something of a “lowest-common-denominator” backup tool, I describe
    tar in more detail shortly.You can apply these principles if you choose another
    tar, though. In fact, if you want to back up to optical discs, you must use other
