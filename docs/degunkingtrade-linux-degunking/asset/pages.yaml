  md: '# 184 Chapter 8


    process is a running program. At any moment, a Linux system is likely to support
    dozens or even hundreds of active processes—your X server, your window manager,
    a word processor, a printing tool, a program to set the time in the background,
    and so on. A properly degunked system, one of those processes is necessary, or
    at least desirable; however, processes sometimes run when they shouldn''t run
    out of control in one way or another. (Chapter 7, "Improving Performance," introduced
    some potential problems). Thus, knowing how to manage processes is important for
    keeping a system degunked. If you just let everything run as it will, sooner or
    later your system will begin behaving erratically and you''ll have to reboot it.
    Fortunately: Linux is smarter than you Linux provides tools to locate and terminate
    misbehaving processes or to rein them without killing them. First, you should
    understand a bit about how Linux boots and running the bare programs that make
    up a Linux system. This will enable you to change the software base upon which
    everything is built.


    # Understand the Linux Startup Procedure


    When you boot a typical Linux system, you see a variety of messages on the screen,
    followed by a login prompt. Depending on your distribution and settings, many
    of the messages may relate to programs being launched. Thus, paying attention
    during this process can help you track down some junk—if you notice a message
    about an FTP server being launched but you don''t want to run an FTP server, you
    know you should be looking for that FTP server to disable or remove it. Whatever
    the form of the startup messages, you can also intervene by reconfiguring the
    startup scripts to do what you want them to do.


    # The Tangled Web of Startup


    The Linux boot process involves several steps, which are outlined in Figure 8–1.
    This figure presents a somewhat simplified view of things, but it''s enough to
    get across some key points.


    The Linux boot process begins with the computer''s Basic Input/Output System (BIOS),
    which reads the boot sector from a disk. This boot sector contains a boot loader,
    which is a small program that takes over the boot process and loads another loader
    (a secondary boot loader) or an OS kernel, such as the Linux kernel. Linux distributions
    for the x86 CPU line ship with the Grand Unified Boot Loader (GRUB) or the Linux
    Loader (LILO) boot loader. Both are capable of reading the main Linux kernel file
    from disk and starting it running.'
