    two users, one may experience problems but the other user won''t. This type of
    gunk can also be cleaned up by the user who affected it, although there are some
    partial exceptions to this rule you''ll learn in this book.


    One common type of user gunk is unnecessary user files. Just like clutter in your
    home or office, unnecessary files can build up and clutter your user account.
    These files can eat up valuable disk space and make it difficult for you to locate
    files you do need when you need them most. You''ve likely experienced'
