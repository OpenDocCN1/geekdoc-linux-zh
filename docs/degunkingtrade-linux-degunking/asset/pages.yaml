  md: '# Using Local Startup Scripts


    SysV scripts are convenient for managing standard services, such as servers and
    other system tools that ship with a distribution. Sometimes, though, you want
    to do something that wasn''t anticipated by the distribution''s maintainer. For
    instance, perhaps you want to run the Folding@Home program (http://folding.stanford.edu),
    which donates your CPU time to a scientific project that investigates the assembly
    of protein molecules or perhaps you''ve compiled a standard server yourself rather
    than install it from a package and you need some to launch it. Assuming you don''t
    want to manually start such programs yourself, you have two options:


    +   You can create your SysV startup script from scratch or modify an existing
    one to suit your purposes. This is a suitable option if you understand how such
    scripts are put together, but if you''re unfamiliar with Linux, this can be quite
    daunting.


    +   You can use a local startup script, which is a special startup script designed
    to handle system-specific tasks. Typically, you''ll place a simple call to the
    program you want to start within this script, causing the program to run when
    the computer is booted.


    Of these two options, local startup scripts are definitely the easiest to use.
    Unfortunately, most Linux distributions support such scripts, their names and
    locations are not standardized. Some examples include the following:


    +   Debian—All executable files in /etc/rc.boot are treated as local startup scripts,
    but the Debian developers encourage the use of this tool before most SysV startup
    scripts.


    +   Fedora, Mandrake, and Red Hat—The /etc/rc.d/rc.local file is the local startup
    script. It runs after the SysV startup scripts.


    +   Gentoo—The /etc/conf.d/local.start serves as the local startup script. It
    runs after the default runlevel''s SysV startup scripts.


    +   Slackware—The /etc/rc.d/rc.local file serves as the local startup script.
    It runs at the end of the boot process.


    +   SuSE—The SuSE local startup script is called /etc/init.d/boot.local. It runs
    before the SysV scripts for the startup runlevel.


    To add a program to one of these scripts, load it into a text editor and add the
    command you''d at a command prompt to launch the program to the end of the file.
    For instance, suppose you''ve compiled an obscure server, megaserv, and placed
    its binary in /usr/local/bin. You might launch it by placing a line like the following
    in the local startup script file:'
