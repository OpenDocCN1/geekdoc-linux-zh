  md: '# User Settings for Common Applications 119


    Most Web sites that employ encryption do so the Secure HTTP, which is identified
    in browsers by a leading https:// rather than http:// in the URL. This indication
    isn''t 100-percent proof of SSL use, though; a poorly configured browser (or worse,
    one''s been configured dishonestly) could use the usual Secure HTTP port but not
    encryption. Thus, you should always look for an indicator of the encryption status
    in the Web browser''s window. In most browsers, including Firefox, is denoted
    by a key or coded padlock in the bottom-right or bottom-left corner of the window.
    (Even within Firefox, the precise icon used and its placement varies from one
    to another.) Firefox also changes its URL entry field color to gold for secure
    sites, but most browsers do not this. For a secure connection indicator before
    you see a critical password, credit card number, or other sensitive information
    to a Web site.


