  md: '# Optimizing Your X Configuration 311


    $ rpm -qf /usr/share/fonts/extraTT/*


    The result will be a long series of output lines identifying font package names.
    You can then use RPM to look up the files that belong to the packages:


    $ rpm -ql extraTT


    The result is a long list of files contained in the package. If this list doesn''t
