  md: '# Alternatives to Evolution


    As with other applications, alternatives exist for Linux e-mail clients. Evolution
    is one of the most feature laden of these programs, but as you''ve read repeatedly
    in this book by now, the program with the most features isn''t necessarily the
    best one. You might want something slimmer, something that integrates better with
    a specific desktop environment, something with specific features that are not
    in Evolution, or something that''s otherwise different. Some of the more popular
    alternatives include the following:


    +   * Thunderbird—This program is the e-mail companion to the Firefox Web browser.
    It was specifically designed with security in mind, although that emphasis is
    more in the Windows world than in the Linux world, since Linux clients as a group
    are fairly safe. You can learn more at http://www.mozilla.org/products/thunderbird/.

    * KMail—This program uses KDE (check http://kmail.kde.org for details). It''s
    lighter than Evolution but still provides the features users expect in a modern
    e-mail client.

    * Balsa—Although Evolution is loosely associated with GNOME, another GNOME-related
    mail client is Balsa (http://balsa.gnome.org). Balsa doesn''t get a lot of publicity,
    but it''s a capable mail client, particularly for those who like GNOME but want
    something slimmer than Evolution.

    * Sylpeed—This program, http://speed.net, is another mail client with ties to
    GNOME. It''s similar in overall capabilities to Balsa, but of course the two programs
    differ in several details.

    * Mutt—Mutt (http://www.mutt.org) may be the most popular text-based mail reader.
    This program offers a plethora of features but can be used from a text-mode login
    or within an xterm window.

    * Emacs—Over the years, the Emacs editor (http://www.gnu.org/software/emacs.html)
    has accumulated an frightening number of features. Among these is the ability
    to handle e-mail. If you already use Emacs for other things, you might want to
    look into its e-mail capabilities. Emacs is primarily a text-mode program, although
    it does enable GUI extensions when run from X.


    This list only begins to scratch the surface. Linux e-mail clients are particularly
    numerous. You can try doing a Web search or checking a site such as Tucows (http://linux.tucows.com/email_clients_default.html)
    for pointers to more Linux e-mail clients if you''re picky and find that none
    of these programs suits your taste.'
