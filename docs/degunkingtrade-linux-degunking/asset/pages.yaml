    # Picking the Right Output Device


    Before you can print, you must know how to identify your printer. In computer
    terms, this means the output device. Most printers today have USB interfaces,
    so you''d specify a USB port. (More on this shortly:) Some printers, including
    most sold today have parallel ports, which connect to the parallel port on the
    back of your computer via a parallel printer cable. A few older printers use RS-232
    serial ports or more exotic interfaces. CUPS also lets you select a network printer
    instead of a local printer, but the details of this selection depend on the network
    protocol.


    You pick the output device using the CUPS device setting. This consists of a list
    of predefined devices. For parallel and RS-232 serial printers, you need only
    select the port. Most computers have just one parallel port, so Port #1 is the
    appropriate selection for them. If you have an old RS-232 printer, use Serial
    Port #1 or Serial Port #2, depending on the port to which it''s connected. (In
    either case, if you''ve added extra ports via an add-in card, you may need to
    select a higher number.)


    > TIP: If you''re not sure what printer uses, sending a file to the raw devices
    with various ports. For instance, typing sample.txt > /dev/lp0 sends the file
    to the first parallel port (/dev/lp0), and sample.txt > /dev/tty1 sends the file
    to the second RS-232 serial port (/dev/tty1). If you send a file in a format that
    the printer can understand, the file should print. If not, you should see at least
    a blinking light or message of sort on printer''s control panel, verifying that
    it''s receiving the input. USB printers usually don''t have device files associated
    with them, so so this trick won''t work with them.'
