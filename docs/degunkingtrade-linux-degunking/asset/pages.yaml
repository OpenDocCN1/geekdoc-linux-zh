  md: '# # Appendix A


    ![](img/b3875bade729a8fa10cbc3a09faabd77_333_0.png)


    You can clean up most types of gunk by applying common sense, knowhow, and popular
    Linux tools. Sometimes, though, gunk can grow out of control like kudzu or a B
    movie monster. In the worst cases, you might have no choice but to start your
    Linux installation over again. For instance, a junky hard disk could die and take
    all your data with you, or a security breach might leave you unable to trust any
    of the system software on the computer. In such situations, a backup is invaluable.
    If you have a backup from before the problem developed, you can completely wipe
    out the trouble spot and restore the backup, effectively turning the clock back
    and making your computer what it was before anything went wrong. In some cases,
    you might need to take steps like updating your software or upgrading your security
    to ensure that the problem doesn''t recur, but having a backup can save you a
    lot of configuration hassle. Backups of your user data files can save hundreds
    of hours of work.


    To back up your computer, you must prepare by selecting appropriate backup hardware
    and software. Actually performing the backup is usually the easy part, but you
    must do it on a regular basis and keep track of your media, lest you discover
    that your latest backup is months old. Finally, no backup will do you any unless
    you can restore it, you should have a recovery plan.'
