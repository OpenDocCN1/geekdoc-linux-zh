  md: '# Identifying Files by Their Extensions


    One of the simplest ways of identifying files is to examine their filename extensions.
    These are short (typically 1-4characters) codes at the ends of filenames, preceded
    by a dot (.). For instance, in the filename manual.sxw, .sxw is the filename extension.
    Linux shares many filename extension standards with Windows and other operating
    systems (OSs), but some filename extensions are uncommon outside of the Linux
    and Unix worlds. The number of extensions in use is huge, so I cannt present a
    complete list here. Nonetheless, Table 3-1 summarizes some of the more common
    and important filename extensions you''ll find on a Linux system, with particular
    emphasis given to Linux-specific extensions.


    # Table 3-1 Common Filename Extensions


    | Extension | Explanation |

    |---|---|

    | .bak | Used by several programs to denote a backup file. Some programs append
    a tilde (-) to the ordinary filename, changing the extension, to denote backup
    files. |

    | .bz2 | File compressed with bzip2. |

    | .c | C source code. |

    | .cc, .cpp, .c++ | C source code. |

    | .conf | Configuration file. These are usually plain-text files with a special
    format and can be edited with text editors. |

    | .deb | Debian package file; holds a complete program or other set of files.
    Described in more detail in Chapter 6, "Cleaning Out Unused Packages." |

    | .gif | Graphics file in the Graphics Interchange Format (GIF). |

    | .gz | File compressed with gzip. |

    | .h | C or C++ header file. These files typically describe data structures for
    many other source code files. |

    | .htm or .html | Hypertext Markup Language (HTML) document; a Web page. |

    | .jpg | Graphics file in the Joint Photographic Experts Group (JPEG) format.
    |

    | .mp3 | Audio file in the Moving Picture Experts Group Layer 3 (MP3) format.
    |

    | .o | Object code file (source code that been compiled but not yet linked into
    a working program). |

    | .ogg | Audio file in the Ogg Vorbis format. This is an alternative to the MP3
    format. |

    | .pdf | Portable Document Format (PDF) file; can contain text and graphics. |

    | .pl | Perl script. |

    | .png | Graphics file in the Portable Network Graphics (PNG) format. |'
