    +   - sync—This account exists to call /bin/sync as the login shell. The utility
    prepares a disk for being shut down. It''s not normally called explicitly, and
    this account is something of a relic of bygone times. It can usually safely deleted.


    +   - shutdown—This account calls /bin/shutdown as its login shell. The effect
    is that if you log into this account, the computer shuts down. This can be handy
    if you want to be able to shut down the computer remotely with minimal fuss, but
    if you don''t want to use this functionality, you can safely remove this account.


    +   - halt—This account is like the shut down account, but it calls /bin/halt
    rather than /bin/shutdown. It can usually safely deleted.


    +   - operator—Like adm, this account is a seldom-used supplemental administrative
    account. It can usually safely deleted.


    +   - postmaster—This account is required of computers that run mail servers on
    the Internet. If your computer doesn''t do this, you can safely delete this account.


