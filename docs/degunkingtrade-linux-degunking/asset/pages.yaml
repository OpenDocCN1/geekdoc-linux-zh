    flexible. Web proxies also protect several servers or computers simultaneously,
    so investing in configuring one of them can pay off in terms of simplified configuration
    if you use several browsers or computers.


    # Using a Degunking Web Proxy


    Web proxies can be great dungeking tools. They can dung the Web for many computers
    and Web browsers simultaneously, which can greatly simplify your configuration
    effort if you want to implement identical dungeking rules for many computers or
    browsers. Proxy servers also do things that are difficult or impossible to do
    with the options provided by typical Web browsers, such as clean up the Web for
    children''s eyes or block ads (not just pop-up or pop-under ads).


    To use a Web proxy, you must begin by selecting one. Many exist, each with its
    own strengths and weaknesses. I can''t describe all Web proxy servers, so after
    a quick review of popular choices, I focus on configuring and using one: Privoxy
    (http://www.privoxy.org).


    # Selecting a Proxy


    The first step in setting up a proxy server is selecting one. Quite a few for
    Linux, including:


    +   - Squid This proxy server is headquartered at http://www.squid-cache.org,
    is designed primarily as a Web accelerator. By caching popular pages and returning
    the results from its cache rather than repeat a lookup, Squid can improve Web
    browsing speed. This advantage is most noticeable when Squid serves many users,
    though. In addition to this primary function, Squid provides a great deal of configurability,
    which makes the foundation upon which several other proxy servers with other goals
    are built.

    - SquidGuardThis proxy server is built atop Squid and is designed to provide extensive
    access controls based on the user, the date, the time, the page being accessed,
    and so on. You can learn more at http://www.squidguard.org.'
