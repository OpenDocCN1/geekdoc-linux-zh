    # # Why Is There Gunk in Linux?


    **Degunking Checklist:


    +   - Learn how to quickly recognize Linux gunk.

    - Learn why some things that users consider gunk on one Linux installation might
    be valuable for another Linux installation.

    - Understand that there are three categories of gunk: user configuration gunk,
    system configuration gunk, and hard-ware gunk.

    - Learn about the three ways gunk can be introduced into a Linux system: it can
    come with the distribution, it can be added by mistake, and it can be created
    maliciously.

    - Understand the basic principles of degunking Linux.'
