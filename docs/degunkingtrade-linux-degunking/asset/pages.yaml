    # The Kernel and Other Drivers


    Driver problems can be difficult to separate from hardware problems. To be sure,
    sometimes a problem is clearly caused by one or the other, telling which is to
    blame is tricky sometimes, particularly if you don''t have spare components to
    test. Fortunately, Linux''s drivers seldom cause outright failures or system crashes,
    although some drivers marked "experimental" are much riskier than others.


    In dealing with driver gunk, you should first understand what drivers reside in
    Linux. Most Linux drivers are literally that—they''re drivers that are part of
    the Linux kernel. These drivers "talk" directly to most of the hardware that''s
    installed inside a computer''s case, including hard disk controllers, RS-232 serial
    ports, parallel ports, USB ports, IEEE-1394 ports, the keyboard, various types
    of mouse ports, and network ports. These drivers can either be compiled directly
    into the main kernel file or be compiled as separate loadable modules (controlled
    via /etc/modules.conf). In most cases, either approach works well. Most distributions
    arrive with these to keep the main kernel file''s size manageable. When you recompile
    your kernel, though, you might build drivers you know''ll always need directly
    into the kernel file; this way, you don''t have to worry about configuring them
    in /etc/modules.conf.


