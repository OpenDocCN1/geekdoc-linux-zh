    +   - Added or modified programs—Crackers often add new programs or modify existing
    ones. For instance, crackers might change the login (which processes text-mode
    logins) to record passwords and send them to themselves.


    +   - Unauthorized servers—Crackers sometimes run servers to enable them to get
    back into your system. This class of gunk may also require an added program (the
    server software itself), but installing the software and running it are two different
    things. A more subtle change might involve running a server that was already installed
    not active, or changing a server''s configuration so that it accepts connections
    you''d previously blocked.


    +   - Modified files—If you were specifically targeted, user files might be modified,
    in a defaced Web page. Most intrusions also involve modified configuration files.
    (Gunky accounts are really just modified account database files, for instance.)


    +   - Sloppy changes—Many crackers have limited skills (they''re often called
    script kiddies, the diminutive form reflecting the intruders'' lack of real skills).
    These crackers use root kits, which are semi-automated attack programs written
    by others, to gain access to systems. Once in, script kiddies are often poor administrators
    that cause any number of problems through incompetent changes to your configuration,
    even if this wasn''t their intention.


    Unfortunately, gunk that has been added maliciously is tricky to clean up. The
    problem is that you can''t be sure of the extent of the infestation. Perhaps you''ve
    spotted a bogus account in the account database, but that won''t tell you whether
