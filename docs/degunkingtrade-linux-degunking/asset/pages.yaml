  md: '# Gunkuster''s Notebook: Using Precompiled

    Kernel Modules


    If you''ve obtained a precompiled third-party driver module, you can probably
    forgo recompiling the kernel to use it. Typically, such drivers come either as
    packages that you can install using package tools, as described in Chapter 6,
    or with special installation scripts that place the driver modules in the appropriate
    driver directory. In either event, you should read the documentation that came
    with the driver to learn how to install it.


    Once the driver is installed, you may need to load it to use it. This is often
    handled automatically, but if not, you can use the insmod command to load a kernel
    module. Type this command followed by the module''s name, as in insmod floppy.
    (This example loads the standard kernel floppy disk driver.) If you find that
    a driver isn''t loading automatically when you boot but you want to do so, you
    have two choices:


    +   - Modify a local startup script (as described in Chapter 8) to insmod load
    the module. This approach is convenient if you understand the startup script process
    for your system, but it''s considered something of a jury-rigged method.


    +   - Modify the /etc/modules.conf file for your module. In some distributions,
    such as Debian and Gentoo, you''d modify a file in the /etc/modules.d subdirectory
    and then run a special command rather than directly modify /etc/modules.conf)
    Typically, you''ll create an alias line that points to the module and links it
    to a specific subsystem, as alias eth0-via-rhine, which maps the via-rhine driver
    to the eth0 (first Ethernet) device. This method is the preferred way of doing
    the job, but it requires you to know the name of the device class to which you''re
    linking the device. As a precompiled binary module requires such changes, its
    documentation should describe them in detail.


