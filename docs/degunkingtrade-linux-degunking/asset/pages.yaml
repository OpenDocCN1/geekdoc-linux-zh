- img_proc: true
  md: '# Backing Up Linux 315


    Fortunately, all of backup media are Linux compatible, provided they''re used
    with Linux-compatible interfaces. ATA, SCSI, and USB interfaces are all popular,
    the main issue is ensuring Linux drivers for the interface hardware exist.


    **NOTE:** Some SCSI drives come with very inexpensive SCSI adapters, which might
    not have Linux drivers. If you buy a SCSI tape drive and can''t get the host adapter
    to work, you may need to replace it with a Linux-compatible model.


    # Selecting Backup Software


    Your choice of backup software will depend in part on your choice of backup hardware.
    The best software to use for one type of hardware might not be optimal (or might
    not work at all) for another type of hardware. Popular options include those here:


    +   * The tar program is frequently used for creating on-disk archive files, but
    it''s also a popular backup tool. You can write directly to tape drives using
    tar, and you can create archives on removable disks, including removable hard
    disks. You can use tar in conjunction with optical media, but you''ll need extra
    software to do the job.


    +   * cpioThis an archiving tool similar to tar in capabilities. Some prefer cpio
    to tar, but tar is more popular.


    +   * dumpThe dump program is a traditional Unix backup program that''s also available
    for Linux. Unfortunately, it''s very filesystem specific, and as I write, only
    versions for ext26, ext3, and XFS are available. You can''t dump to backup Refs
    or JFS partitions, less non-Linux files. Despite the fact that it''s referred
    to in a lot of Unix documentation and even some Linux system files, dump isn''t
    the best choice for backups.


    +   * cpThe cp command, which copies files, can be used to back up to removable
    disks, including removable hard disks. Mount a disk at location, such as /mnt/backup,
    and use the -a option to copy files to that location, as in cp -a /mnt/backup
    to copy the current directory and all subdirectories to the backup disk.


    +   * Optical discs present unique challenges. The cdrecord writes to an optical
    disc, but it requires a prepared file. One option is to create a tar archive and
    write it directly to disc using cdrecord. More commonly, though, you''ll either
    use mkisos to create an ISO-9660 filesystem of the files you want to back up or
    use mkisos to create a tarball of the files in an ISO-9660 filesystem. You''ll
    then write this ISO-9660 filesystem to disc with cdrecord. GUI ends to'
