  md: '# Optimizing Your X Configuration 305


    If you''ve seen a font in print that you like, finding a lookalike font can be
    difficult. One that can help is WhatTheFont (http://www.myfonts.com/WhatTheFont/).
    This site enables you to upload a graphic file of a font, such as a scan of a
