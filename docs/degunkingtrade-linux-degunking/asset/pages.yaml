    # # When to Delete Unused Files


    You''ll likely need to shuffle files from one directory to another to keep your
    system organized and usable. Good organization can only help so much if your problem
    is you''re running out of disk space, though. What''s more, even if you have plenty
    of disk space, unnecessary files will clutter your directory listings and perhaps
    require you to create more subdirectories (and perhaps a deeper directory structure)
    than you otherwise need, making it harder to find the files that you need. For
    all of these reasons, you should be prepared to throw out some old files, just
    as you''d chuck the moldy fruitcake that''s been lurking at the back of your refrigerator
    since last December.


    Deleting files can be difficult, particularly if you''re not short on disk space.
    It''s easy to think of those files as potentially useful in the future, even they
    aren''t needed now. Maybe you''ll write your memoirs and you''ll need all those
    old letters that you''ve been saving. In most cases, this is wishing thinking;
    old files you''ve not touched in years are probably going to go untouched forever,
    deleting them makes sense.


    In the end, the decision to delete or not delete a file is up to you. You might
    ask yourself some questions to help you process this, though:


    +   - How long has it been since you''ve read or modified the file? The longer
    it''s been, the better the candidate it is for the trash bin. A year might be
    a good deadline deletion, although this shouldn''t be a hard-and-fast rule.


    +   - Do you have a legal, business, personal, or other reason to keep the file?
    Tax records should certainly be kept around for longer than a traveling circus,
    for instance.


    +   - Can the data be reconstructed or obtained again? For instance, you could
    usually download a program from the Internet at any time, so deleting program
    package files isn''t a big risk. A photo from your digital camera, on the other
    hand, could be literally irreplaceable.


    +   - How large is the file? Particularly when you''re running low on disk space,
    a big file can be a real liability, but a small one isn''t such a problem (Lots
    of small files in a collection can add up to a big issue, though.)


    +   - Is the a backup file? Unless you''re actively working on a project, an automatically
    created backup file is a good candidate for deletion.'
  merge: -1
