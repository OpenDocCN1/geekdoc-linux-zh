    # Correcting System Crashes


    Perhaps the most frustrating type of problem is a system crash—the computer simply
    stops responding to input and reboots itself. Linux is normally a very robust
    OS that crashes infrequently. Linux systems frequently run for months at a time
    without reboots. Thus, if your system is crashing, something is wrong with it,
    and that thing is almost certainly a hardware or driver issue.


