    # Using Encryption


    The Internet is not a secure place. Data sent to or from the Internet is likely
    to pass through a dozen or more computers and might be monitored (or *sniffed*)
    from still more systems. Thus, when you send sensitive data, such as a password
    or credit card number, over the Internet, it could be intercepted and fall into
    unfriendly hands. Even seemingly innocuous data could conceivably be against you—say,
    to impersonate your identity in a low-security Web forum.


    Fortunately, Internet security has improved greatly over the past decade thanks
    to the increasing availability of good encryption software. To be effective, though,
    you must *use* this software. The first step is on knowing it. Some types of software
    and protocols include:


    +   * Using the older File Transfer Protocol (FTP) to download files from anonymous
    sites is okay because you''re not using a password and the files are publicly
    available and don''t contain sensitive data. The same is true for the Hypertext
    Transfer Protocol (HTTP) used on the Web. When transferring sensitive files between
    computers on the Internet at large, though, or when you must log in using a unique
    username and password, use SSH supports encryption and is much better than FTP
    when security is important.


    +   * Remote logins—If you need to log into a remote computer to control it, use
    SSH. The older Telnet protocol, while still available, is woefully inadequate
    for login sessions. The Virtual Network Computing (VNC) protocol encrypts passwords
    but not other data, so it might be acceptable for low-sensitivity logins or over
    local networks but not for performing remotely sensitive tasks on the Internet
    at large.


    +   * Web transactions—As described in Chapter 5, you should ensure that your
    Web browser has negotiated a secure HTTP connection rather than a conventional
    HTTP connection before you send credit card numbers or other sensitive data over
    the Web. In most cases, Web browsers display a padlock or key icon in the lower-left
    or lower-right corner of the window when using a secure connection. Note that
    many sites require but not negotiate secure connections. This is tolerable for
    low-security sites (say, for authenticating to an online newspaper), but you should
    be careful not to use the password for such sites on more secure sites (such as
    your bank''s online banking site).'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Network Degunking 259


    +   - E-mail—The Simple Mail Transfer Protocol (SMTP) used by most servers are
    inherently insecure, so you shouldn''t consider e-mail to be confidential or send
    passwords or other sensitive data via e-mail. If you must use e-mail for such
    exchanges, install encryption software, such as the GNU Privacy Guard (GPG; http://www.gnupg.org)
    on both computers and use it to encrypt your messages.


    +   - File sharing—Protocols to share files in local, such as the Server Message
    Block/Common Internet File System (SMB/CIFS) used by Windows and Linux''s Samba
    package, are intended for use on relatively secure local networks. Although SMB/CIFS
    optionally use encrypted passwords, this encryption can be weak and non-password
    data are exchanged in the clear.


    The worst threats concerning nonencrypted data have traditionally been on the
    Internet at large; because data pass between so many systems, many opportunities
    exist for traffic to be intercepted. Local networks, by contrast, have been relatively
    secure because an intruder would need access to a compromised local system or
    even physical access to the network wires to intercept local network traffic.Thus,
    security on local file-sharing protocols, to just one example, has been relatively
    low. Similarly, many people have used Telnet, FTP, and other unencrypted protocols
    locally, even when they wouldn''t dream of using these protocols on the Internet
    at large.


    The explosion in popularity of wireless network protocols, though, changes this
    equation. The default security for wireless network hardware is typically quite
    low. Although many devices provide options to encrypt data, users often don''t
    activate these features, and sometimes the wireless encryption can be broken relatively
    easily.Thus, if you''re using a wireless network, you should do two things:


    +   - Read your manuals and activate any built-in encryption on your wireless
    networking hardware.


    +   - Don''t assume that your “local” wireless traffic is secure, even if you
    activate the wireless encryption. Somebody sitting in a car outside your home
    or office might be able to listen on your local traffic, plucking passwords or
    other sensitive data out of the air. Similarly, such intruders might be able to
    break into your local systems, bypassing security provided by a NAT router.


    # Monitoring for Intrusion


    You should always keep in mind the fact that security is never absolute. No matter
    how carefully you remove unnecessary servers,block ports with firewalls,'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# 260 Chapter 10


    use encryption, and perform other preventive security tasks, there''s always the
    possibility that a cracker will be one step ahead of you. For this reason, you
    should keep an eye out for any unwelcome guests, as you remain alert to signs
    of cockroaches, mice, and other unwelcome creatures in your house.


    Fortunately, computer intruders don''t leave droppings around your computer. Unfortunately,
    this means you use other methods to locate them. Some ways of monitoring for intruders
    include the following:


    +   Know your system. If you''re familiar with how your computer normally operates,
    you''re more likely to be able to spot changes caused by an intruder. For instance,
    a system compromise might result in an increased system load (described in Chapter
    8, "Managing Processes") or a previously reliable program behaving unreliably,
    or simply different. If you see changes, don''t just shrug them off as part of
    the mystery of life—investigate them. The dungeking procedures throughout this
    book will help you track down the source of a change in behavior. If that change
    seems to be due to new software you didn''t install or configuration files you
    didn''t make, that could be a sign of an intrusion.


    +   Monitor log files. Linux stores log files in /var/log and its subdirectories.
    These files record details of the operation of servers and other critical system
    processes. Such files frequently contain clues to an intrusion. Unfortunately,
    reviewing every change in log file will be a full-time job, so you may need to
    restrict such reviews to occasions when your suspicions have been aroused by some
    other event. The most important log file is usually /var/log/messages, but some
    systems have a special log file (often /var/log/secure). Messages reporting logins
    you or authorized users didn''t make a cause for alarm. Missing messages can also
    be a sign of trouble—intruders often remove entries that show signs of their intrusion.
    They can leave suspicious gaps in log files. (Entries are time-coded.)


    +   Monitor changes to files. One advanced-detection technique is monitoring for
    changes to system files. Tools such as Tripwire (http://www.tripwire.org) can
    help keeping checksums of all the important files on you use in an encrypted database.
    By comparing these checksums to newly created checksums on a regular basis, Tripwire
    can detect intrusions quite reliably. Unfortunately, proper Tripwire configuration
    is rather tedious, so I don''t describe it in this book. If your computer is exposed
    directly to the Internet, you should seriously consider looking into this software.
    If you suspect an intrusion and are using an RPM-based distribution, typing rpm
    -Va will verify all the files installed via RPM. Changes to program executable
    files are highly suspicious, but'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Network Degunking 261


    changes to configuration files are common and can flood the output. Be aware that
    this will fail if the intruder used RPM to install modified software!


    +   * Check for new servers. Intruders sometimes break in one server but then
    install or run a new one to make it easier to return. You can detect these new
    servers by using netstat, as described earlier, in "Removing Unnecessary Services.\Thus,
    periodically repeating this review can help you detect crackers.


    +   * Check for suspicious accounts. Just as intruders often add servers to your
    system, they often add new accounts or change existing ones. Thus, you should
    periodically review your account database, as described in Chapter 9,"Account
    Degunking," to spot changes in your accounts.


    +   * Check for suspicious processes. Crackers leave non-server programs running
    full time, and even when they don''t, whatever they are running when logged in
    will show up in a process list. Thus, periodically checking processes using ps,
    as described in Chapter 8, may alert you to a problem. On the downside, a typical
    Linux system is likely to be running dozens of processes, so spotting a suspicious
    one can be hard. If the intruder didn''t leave something running full time, there
    will be no hint of the compromise unless the intruder is logged in when you run
    this.


    +   * Check for root kits. The chrootkit utility (http://www.chkrootkit.org) checks
    for root kits, which are prepackaged intrusion tools used by many crackers. If
    you suspect your system might have been compromised, you should download the latest
    version of this tool and run it. You might want to do this on a regular basis
    if your system is particularly sensitive.


    > WARNING! Wily intruders often change system utilities, such as top, ps, and
    netstat, to hide the signs of their intrusion. Thus, you can''t count on these
    utilities to be reliable tools for tracking down intruders. To be sure, they do
    often work, but because crackers often don''t replace all utilities you might
    use to detect them.


    How often you should perform these tests depends on how sensitive your system
    is. For a typical system that sits behind a NAT router, running chrootkit and
    one or two other tests every few months or if you notice something suspicious
    should be fine. On a sensitive server that''s constantly exposed to the Internet,
    installing Tripwire and running some checks or more a day (probably in an automated
    way) may be in order. Of course, basic attention to your system''s normal operating
    characteristics applies to any computer.'
