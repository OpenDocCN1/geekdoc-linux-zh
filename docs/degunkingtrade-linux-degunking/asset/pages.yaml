  md: '# Handle Dependency Problems


    Throughout this chapter, I''ve referred to dependencies. In many ways, dependencies
    are the thorn in the side of Linux users when it comes to package management,
    because dependencies can result in a need to upgrade a dozen packages just to
    upgrade one, block removal of a package that you consider junky, and sometimes
    cause worse problems, as described shortly. Fortunately, advanced package management
    tools like APT, Synaptic, Red Hat Package Management, Update Agent, and YaST/YaST
    can greatly simplify managing dependency problems; however, sometimes you may
    need to break a few rules. Doing so can work if you exercise caution and know
    what you''re doing, but it can wreak havoc if you make a mistake.


    # Tracking Down Dependencies


    If you''re using RPM or Debian packages, you usually don''t need to go looking
    for dependencies; they''ll make themselves known when you try to install, remove,
    or upgrade a package. If you use the rpm or dpkg tools and you try to do something
    that breaks a dependency, you''ll get an error message. It''s your job to fix
    the problem. Depending on what you''re trying to do, this can take any of several
    forms:


    +   - Delete packages. If you''re trying to remove a package and find that it''s
    depended upon by other packages, you can remove those packages as well. Of course,
    you should be those other packages aren''t ones you really need!


    +   - Upgrade or install extra packages. If an attempted upgrade or install fails
    because of a missing or out-of-date dependency, you''ll need to track down an
    appropriate package and upgrade or install it in addition to the one you want
    to upgrade or install. In practice, you might find you to upgrade or install dependencies
    of the dependency and so, resulting in a need to deal with many packages—perhaps
    dozens of them. This is the sort of situation that begs the use of APT, Update
    Agent, or a similar tool to keep track of all the interlocking dependencies!


    +   - Look for another package. Sometimes a package you want to install requires
    a package that''s older than the one you''ve got installed. For instance, the
    package might say it needs super-1.2 but your system has superlib-1.9, and some
    of your existing programs require this version of the library. Usually, the best
    fix for this problem is to look for a newer version of the package you want to
    install, because this problem is a sign that you''re trying to install an old
    version of the program. If the program hasn''t been updated in a long time, perhaps
    it''s time to switch to another program entirely.'
