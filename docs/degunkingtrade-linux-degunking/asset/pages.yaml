    #  the Common Types of Linux Gunk


    For this book, I''ve come up with three categories of gunk: user configuration
    gunk, system configuration gunk, and gunk relating to hardware or drivers. These
    categories mirror important distinctions in Linux itself. As a multiuser OS, Linux
    draws a fairly strong distinction between user and system configurations. User
    configurations apply to individual users. Two users can have very different user
    configurations without affecting each other. System configurations, by contrast,
    apply to everybody. Finally, hardware and driver configurations are, in some sense,
    system configurations, but they apply more directly to the hardware than other
    system configurations.


