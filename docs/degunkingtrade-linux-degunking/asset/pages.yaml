    accounts are a kinda concept. In fact, although simple OSs frequently do without
    accounts, they serve several important functions in Linux:


    +   - Multiuser configurations—Accounts enable you to keep configurations for
    multiple users on a single system. In early days of Unix, this was important because
    computers were expensive systems with many users at a company, university, or
    other organization. Although desktop systems today often have one user, multiserver
    systems are still common. Perhaps your home system is used by everybody in the
    family, or maybe your office environment can be simplified if employees can work
    at any computer in the office. Accounts help with this, by keeping users'' files
    and configurations separate.


