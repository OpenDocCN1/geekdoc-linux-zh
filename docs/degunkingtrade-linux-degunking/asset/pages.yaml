  md: '# Summing Up: Keeping Network Gunk Off of Your Computer


    The Internet is a wonderful resource, but it''s also become a major source of
    gunk. Web-based and e-mail gunk are particularly common. Web-based gunk can be
    fought through options in your Web browser and through the use of a proxy server,
    which can clean more types of gunk than browser-based rules and serve multiple
    computers. E-mail gunk is typically fought through the use of mail reader. In
    addition to these forms of gunk, the Internet can be a medium for intruders to
    invade your system. Protecting your computer by removing unnecessary servers,
    setting up a firewall, using encryption, and monitoring for intrusion is vitally
    important if your system is connected to the Internet.'
