    (such as Create Folder, Create Document, or Create Launcher) to place the selected
    type of icon on the desktop. You can also drag and drop an icon from a Nautilus
    window to the desktop to move it.


    The trouble with all this activity is that it tends to create a cluttered working
    environment. With a lot of degunking tasks, the challenge is finding the right
    balance. A few program-launch and document icons on the desktop can help you be
    productive by enabling you to more quickly launch programs and access files. Too
    many, and, you''ll have a hard time finding the icons you want. You''ll have to
