  md: '# Degunking User Files 43


    Notice that the output of df provides information on all of the partitions, removable
    disks, and network mounts. Each column provides a particular piece of information:


    +   - Filesystem—The first column shows the device name or identifier for the
    filesystem. This information most likely isn''t very useful for tracking disk
    use, but it can be used for some purposes, such as resizing a partition.


    +   - Filesystem size—The second column reports the size of the filesystem. By
    default, this size is shown in kilobytes (or 1K-blocks, as the column header reads.


    +   - Used space—The third column shows the total disk space used on the filesystem.
    Again, this is in kilobytes by default.


    +   - Available space—The fourth column shows the available space on the partition.
    It''s equal to the filesystem size minus the used space.


    +   - Use percentage—The fifth column reports the percentage of available space
    that''s in. Because the preceding three columns have very long numbers, this is
    a very helpful column in tracking your overall disk use. As a general rule, if
    a partition''s use climbs above 80 percent, you should look into cleaning it up
    or adding disk space.


    +   - Mount point—The final column identifies where the filesystem is mounted.
    This information is critical in tracking disk use. For user files, you might only
    be interested in the value on the /home filesystem. If /home isn''t present, look
    at the root (/) filesystem instead—be aware that this might hold both user files
    and system files.


    The output of df typically includes several types of filesystems. As noted, the
    most important for user files is whatever partition holds /home. This may be a
    separate partition, or /home could be stored directly on the root (/) filesystem.
    The preceding example showed several local filesystems (those whose names began
    with /dev/sdb or /dev/hda, the /dev/shm device (a pseudo-filesystem used by Linux
    for internal purposes—you can safely ignore it), and a couple of network file-sharing
    systems.


    > NOTE: Although I''m describing df in the chapter on degunking user files, this
    command is also very useful for system degunking. System administrators can track
    overall system file use with this tool. For instance, the preceding example shows
    that the root (/) filesystem is 82-percent full. Perhaps it''s time to clean out
    unused partitions or go looking for stray files everywhere on the system!


    Overall, df is an excellent tool for getting the "big picture" of how your disk
    is used. It can tell you which of your partitions is close to being full and underutilized.
    It''s also very handy when dealing with removable disks, which'
