  md: '# 194 Chapter 8


    time or memory.The result can be overall system performance problems because resources
    become unavailable to other programs. Chapter 7 described typical symptoms of
    this problem and covered some solutions (such as buying more RAM). The rest of
    this chapter is devoted to tracking down particular misbehaving programs and fixing
    the problem, at least temporarily.


    # Finding CPU Hugs


    The Linux kernel is in charge of allocating CPU time to every running process.
    Processes can request CPU time, and if it is available, the kernel grants that
    request. Most programs are idle most of the time—that is, they don''t consume
    much CPU time. For instance, even when you''re furiously typing in an e-mail message,
    your mail client is likely to be consuming very little CPU time because, by computer
    standards, the computations necessary to process your keystrokes and display the
    results on the screen are.


    You can view the overall CPU load on the computer by typing uptime at a command
    prompt.The result is a list of various system statistics, including the amount
    of time the computer has been running and three load averages, which are measures
    of the proportion of available CPU time being requested by all running programs
    combined:


    ```

    $ uptime

    15:29:54 up 24 days, 35 min, 23 users, load average: 1.73, 2.23, 1.94

    ```


    In this example, the load averages are 1.73 over the past minute, 2.23 over the
    past 5 minutes, and 1.94 over the past 15 minutes. Because the load average is
    expressed as a proportion of available CPU time, you needn''t know anything about
    your computer''s CPU speed to interpret the value.A computer with no processes
    requesting CPU time will have a load average of 0.00, and a load of 1.00 indicates
    a single process requesting all the available CPU time (or a combination of more
    than one process, each requesting less than the available CPU time).Values between
    0.00 and 1.00 indicate that the CPU is not being fully utilized.Values above 1.00
    indicate that the running programs are requesting more CPU time than is available,
    meaning that none of these programs will perform optimally.


    Ideally, your system should have a load average of 1.0 or less. In practice, though,
    the load average can rise higher than this value because you''re running CPU-intensive
    programs in the background or because multiple people are using the computer,
    each placing demands on the CPU.Desktop systems often have'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Managing Processes 195


    load averages of below 1.0, meaning there''s little competition for CPU time among
    the running programs—typically, the user interacts with just one program at a
    time, and that program isn''t likely to demand 100 percent of the available CPU
    time.


    **NOTE:** Replacing the CPU with a faster CPU might not reduce the load average;
    multiple CPU-intensive processes will still put a high load on it. A faster CPU
    will finish the individual tasks faster, though. Likewise, a system with a slow
    CPU can produce a low CPU load but still seem sluggish because the speed problems
    aren''t related to CPU operations.


    If your system seems sluggish and reports a CPU load of above 1.0, it''s possible
    that a process has hung—locked itself in an endless loop, consuming CPU time but
    doing nothing. It could also be that you''ve got one or more legitimate programs
    consuming lots of CPU time for legitimate reasons. Either way, a good way to track
    these programs is to use the top program, which is an interactive text-mode program
    for tracing resource use. By default, top displays a list of processes ordered
    by CPU, as shown in Figure 8-3. About every two seconds, this list refreshes itself,
    reflecting processes that start, stop, or change the amount of CPU time they''re
    demanding.


    Review your process list, paying attention to the final column in the top output
    (labeled COMMAND). Chances any CPU hogs appear among the first few entries. The
    %CPU column shows the percentage of CPU time that a program has consumed during
    the last slice. In the case of Figure 8-3, the FahCore_65.exe is consuming 97.4
    percent of CPU time, followed by Xvnc at 13 percent. If a process remains high
    in this, it''s legitimately consuming lots of CPU time or it''s hung. The TIME
    column can also be useful; it displays the total amount of CPU time a process
    has consumed. In the case of Figure 8-3, FahCore_65.exe has consumed 5 minutes
    of CPU, whereas Xvnc has chewed up over 141 minutes of CPU.


    How do you interpret these results? Unfortunately, top alone can''t identify programs
    that are consuming inordinate amounts of CPU time; you must bring your knowledge
    of your system to bear, well Figure 8-3 was taken on a system which I just started
    the Folding@Home program (FahCore_65.exe). This program legitimately consumes
    a lot of CPU time, but it does so at a low priority, so it shouldn''t interfere
    with other programs. (The NI column in top output shows priorities, with positive
    numbers indicating reduced priorities.) The Xvnc process is a remote login server,
    and it had been running for a day; thus, it''s racked up a huge cumulative CPU
    time.'
