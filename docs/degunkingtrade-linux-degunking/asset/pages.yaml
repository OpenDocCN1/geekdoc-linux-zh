    # # The Degunking 12-Step Program


    Here is the basic 12-step degunking process that you''ll follow in this book:


    +   1. Delete files you don''t need and organize your remaining files (Chapter
    3).

    2. Select the desktop environment that best fits your needs and configure it properly
    to optimize the environment (Chapter 4).

    3. Configure the settings for the common applications you use (Chapter 5).

    4. Get rid of the unused packages on your system (Chapter 6).

    5. Fine-tune the performance of the applications you use (Chapter 7).

    6. Manage processes on your system, including dealing with misbehaving programs
    (Chapter 8).

    7. Clean up the user accounts and system administration accounts on your system
    (Chapter 9).

    8. Set up a system to reduce your e-mail spam and worms (Chapter 10).

    9. Improve your network security (Chapter 10).

    10. Fix any problems with hardware and drivers that you might have (Chapter 11).

    11. Optimize your X configuration (Chapter 12).

    12. Back up your system on a regular basis (Appendix A).


    # # Degunking Linux with Time Limitations


    If you''re like most people, the words “I''ve got too much time on my hands” aren’t
    likely to escape your lips. With this in mind, I''ll present some important degunking
    tasks you can undertake, ordered by time they''re likely to consume. Of course,
    you should read through this entire book, or at least read the chapters that are
    most relevant to you; if you want to degunk your system in chunks of limited time,
    this classification can help.'
  merge: -1
  pgno: 1
- img_proc: true
  md: '# Fifteen-Minute Degunking


    Some degunking tasks are very simple and straightforward. These tasks can usually
    be completed in fifteen minutes or less:


    +   1. Learn to use your desktop environment''s pager (page 97).

    2. Select a new font for your Web browser (page 111).

    3. Disable Java, and perhaps JavaScript, in your Web browser (page 114).

    4. Locate and kill misbehaving programs (page 193).

    5. Set a new password for yourself and for your root account (page 226).

    6. Initiate a system backup (Appendix A,"Performing Backup\). (Note:This activity
    assumes that your system is already configured to degunk.)


    # Thirty-Minute Degunking


    If you''ve got half an hour to spare, you can perform several of the fifteen-minute
    degunking tasks or pick it up bit and tackle a job that will most likely take
    about thirty minutes. These tasks are more involved than the fifteen-minute tasks:


    +   1. Add or delete OpenOffice.org fonts (page 104).

    2. Reconfigure your OpenOffice.org printers, if they aren''t working to your satisfaction
    (page 107).

    3. Configure your Web browser''s cookie settings and discard unwanted cookies
    (page 116).

    4. Configure your e-mail client to display the features you want to use (page
    121).

    5. Check your system for signs of intrusion (page 259).

    6. Set and delete a X color depth, resolution, or refresh rate (page 295).


    # One-Hour Degunking


    One-hour degunking tasks are, naturally, more involved than the half-hour variety.
    They may involve some modest problem-solving or decision-making on your part,
    so don''t undertake these tasks when you''re drowsy or distracted:


    +   1. Clean up your dot files (page 62).

    2. Create an organized structure for your e-mail and sort your e-mail into appropriate
    folders (page 123).

    3. Update your packages to the latest available versions (page 146).

    4. Fix a misbehaving printer (page 171).

    5. Identify and delete unnecessary accounts (page 219).

    6. Install a degunking Web proxy and configure your Web browser to use it (page
    238).

    7. Track down and remove unnecessary servers (page 252).

    8. Add or delete X fonts (page 302).'
  merge: -1
  pgno: 2
- img_proc: true
  md: '# Three-Hour Degunking


    Three-hour degunking tasks involve more serious problem solving or research to
    complete. You may need Internet access to perform these tasks, in order to download
    software or look up additional information on the Web:


    +   1. Search for and delete unused files (page 48).

    2. Tweak your GNOME or KDE configuration to optimize performance (page 70).

    3. Investigate alternative office suites (page 109).

    4. Investigate alternative web browsers (page 119).

    5. Investigate alternative e-mail clients (page 126).

    6. Degunk a crashing or otherwise misbehaving program (page 164).

    7. Configure a spam and worm filter for your e-mail (page 244).

    8. Configure and compile a custom Linux kernel (page 278).


    # Half-Day Degunking


    Beyond the three-hour mark are the half-day degunking tasks. These jobs require
    really rolling up your sleeves and cleaning the system out:


    +   1. Try using a slimmer desktop environment, such as XFce (page 86).

    2. Try using a bare window manager (page 89).

    3. Use a package browser to identify and remove bulky packages on your system
    (page 133).

    4. Buy, install, and configure a NAT router (page 257).

    5. Replace unsupported hardware (page 286).

    6. Configure the system to perform a backup (Appendix A).


    # Free Time Degunking


    There may be times when you are doing something with your computer and you discover
    that you have some free time to spare. These tasks do not need to be completed
    in any specific order. Simply select a task and perform it to help improve the
    performance of your Linux system:


    +   1. Locate and remove programs that are CPU or memory hogs (page 194).

    2. Configure a spam and worm filter for your e-mail (page 244).

    3. Check your system for signs of intrusion (page 259).

    4. Search for and delete unused files (page 48).

    5. Backup critical files that you have not backed up in a while (page 316).

    6. Create an organized structure for your e-mail and sort your e-mail into appropriate
    folders (page 123).'
