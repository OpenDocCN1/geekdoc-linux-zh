    # What Causes Sluggish Performance?


    In the best of all possible worlds, computers would finish their work instantly—click
    a button to reconstruct something and it''s done; press the key to copy a file
    and it''s done. Sadly, this isn''t the case. Computers take time to perform their
    work. Sometimes the time periods involved are very small by human standards, but
    other times they aren''t. The causes of less-than-optimal performance are varied,
    but they can be classified in four main ways: software problems (that is, problems
    with the software code itself), configuration problems (which affect software
    because the software must do work than is really necessary), interference from
    other programs, and hardware problems. Sometimes the problems in these categories
    interact with one another, exaggerating modest problems in each category to the
    point that they become real issues. Understanding these problems will help you
    identify and avoid when you tackle a sluggish system.


