- img_proc: true
  md: '# 318 Appendix A


    # Restoring Data


    Having a backup won''t do much good if you can''t restore data. In the best-case
    scenario, you need only restore a few files. Sometimes, though, you may need to
    be ready for a fuller disaster recovery restore.


    # Restoring a Few Files


    To restore a few files on a system that works, you can run the tar operation in
    reverse. For instance, suppose you''ve accidentally deleted the important.swx
    file from your home directory (/home/mydir). The following commands will restore
    the file:


    ```

    $ cd /

    # tar xvf /dev/sto home/mydir/important.swx

    ```


    This procedure is the opposite of the original backup command, but with a few
    twists:


    +   The first command changes to the root (/) directory, because all backups are
    stored relative to that directory. If you do not do this, the backup file will
    be restored to the home/mydir subdirectory of the current directory.


    +   The file specification is just for the one file, and it omits the leading
    slash (/) the filename. This is because filenames are stored in tar archives without
    this slash, so including the slash would result in tar failing to find the file
    in the backup.


    +   The --one-file-system (1) option is omitted, because it''s normally unnecessary
    on the restore side.


    > TIP: If you''re not sure of the exact filename of the file you want to restore,
    use the list (-t) command to obtain a listing of all the files in the backup.
    You might redirect the output to a file, as in tar tl /dev/sto > files.txt. You
    can peruse files.txt to find the name of the file you want to restore.


    If you want to restore an entire directory, you can do so; simply specify a directory
    name rather than a filename. Similarly, you can restore multiple files or directories
    at once by listing all of their names, just as you can do when backing up.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Performing a Full Emergency Restore


    Restoring a few files is fairly straightforward. The real trick comes when you
    encounter the B Lea Tar Pis of gunk—when a hard disk crashes or some other disaster
    strikes wipes out your entire computer. In this situation, you must restore your
    backup without the benefit of your normal working Linux system. The best solution
    is usually to use a Linux emergency boot CD-ROM, such as Knoppix (http://www.knoppix.org).
    These systems are bootable Linux installations on CD-ROM. You stick one in your
    CD-ROM drive and boots, enabling you to access your backup and restore it using
    normal Linux commands. In a worst-case scenario, you might need to perform all
    of these steps:


    +   1. Replace any broken disk.


    +   2. Boot your emergency Linux system.


    +   3. Create new partitions for your Linux system on the new disk. Linux''s disk
    program is the traditional tool for this job, but GNU Parted (via the parted command)
    is another option. Full GUI emergency systems may also support QTParted, which
    is a GUI front end to Parted.


    +   4. Create filesystems on the new partitions. GNU Parted and QTParted can do
    this as part of their operation, but if you use disk or explicitly create partitions
    in GNU Parted or QTParted, you must create filesystems with mkfs. For instance,
    typing mkfs -t ext3 /dev/hda1 creates an ext3 filesystem on /dev/hda1


    +   5. Mount all of your newly prepared partitions in a sub True of the emergency
    system. For instance, the new root (/) partition might be mounted as /mnt/restore,
    the new /usr might be mounted as /mnt/restore/usr, and so on.


    +   6. Restore all the data from your backup. You can do this like a partial restore,
    but you specify no filenames for restore. This results in restoring all of the
    files in the archive. You would also change into the new root partition''s mount
    point on the temporary system (as described) rather than in the emergency system''s
    root directory.


    +   7. If your partition assignments are different from those of your original
    installation, edit your restored system''s /etc/fstab to reflect the changes.


    +   8. Copy your kernel file to a FAT floppy disk. The kernel file is /boot/vmlinuz
    (but will be in your restore mount point).


    +   9. Locate a copy of LOADLIN.EXE, a DOS program for booting a Linux kernel.
    Most distributions include this program on their main CD-ROM. Copy this program
    to the same disk as your kernel file.


    +   10. Prepare a DOS boot floppy. If you don''t have a copy of DOS handy, download
