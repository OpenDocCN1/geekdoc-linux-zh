  md: 'will ask you if you want Firefox to remember the password for you. If you respond
    in the affirmative, the program stores your password in a file on your hard disk.
    The next time you visit the site, Firefox recognizes that fact and fills in the
    username and password, easing your memory load and enabling you to use unique
    (random) passwords for every site you use.


    **NOTE:** Chapter 9, "Account Degunking," includes a section that describes how
    to construct a good password. Although the details of password length, types of
    characters, and case sensitivity vary between sites, the same principles that
    make a good Linux password also make a good password for a Web site or a non-Linux
    system.


    The privacy area of the Firefox Preferences dialog box provides a way to manage
    these passwords. Click Saved Passwords and you can tell Firefox whether to prompt
    you to save passwords. You can also review your existing passwords, delete the
    password for a site, and review the list of sites for which you don''t want Firefox
    to manage the passwords.


    Like many other computer issues, having Firefox manage your passwords isn''t without
    its drawbacks. One of these is that the password file is vulnerable. An intruder
    could snatch it and gain access to all of your sites. For this reason, I recommend
    not letting Firefox manage your most sensitive passwords, such as those for online
    banking services. Another problem is that you might lose all your passwords in
    a disk crash or by an accidental deletion of your Firefox files. If you change
    browsers, you''ll have to re-enter all of your passwords, which can be a hassle
    at best.


    # SSL Encryption


    You should be aware of the encrypted or nonencrypted nature of your network traffic.
    MostWeb sites aren''t encrypted, so data sent to you or returned by you in forms
    or URLs can be read on intervening computers, sometimes by other computers on
    your local network, or on the server''s local network. This fact is a major problem
    when transferring sensitive data, such as credit card numbers.


    **WARNING!** Many sites that request passwords don''t bother to encrypt the password
    data. This is one of the reasons you should use unique passwords for your most
    sensitive sites.


    Fortunately, most sites that transfer sensitive data do using the Secure Sockets
    Layer (SSL) encryption protocol. SSL provides a way to encrypt network protocols,
    meaning that the data stream is scrambled in such a way that anybody monitoring
    it will see nothing but gibberish.'
