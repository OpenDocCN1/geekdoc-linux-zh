    for multiple users, accounts help handle multiple simultaneous users. That is,
    two or more people can use one computer at the same time, via network connections
    or specialized hardware. Without accounts, changes one user makes desktop configuration
    files or the could easily confuse the other user''s display. Accounts keep things
    separate, simplifying your use of a system.


