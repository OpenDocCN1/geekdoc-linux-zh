  md: '# Intervening in the Startup Process


    Sometimes it is necessary to change what gets started during the boot process.
    These changes do not alter the broad outline of the startup process, which is
    illustrated in Figure 8-1;instead, they change details such as SysV startup scripts
    run. Because SysV startup scripts start servers and other important system components,
    you can alter how Linux behaves by changing these scripts. Most distributions
    also provide a special startup script, known as a local startup script, that''s
    intended to be edited directly to launch programs you want to have running for
    which no SysV startup script exists. You can use such a script to help customize
    your system by running unusual local programs.


    **NOTE:** You do not normally use any of these startup scripts to launch user
    programs, such as desktop applets. SysV and other system startup scripts run low-level
    system utilities such as initialization tools, servers, and login programs. To
    run a program as whenever you log in, your desktop environment configuration or
    use user login files.


    # Configuring SysV Startup Scripts


    As noted earlier, SysV startup scripts are usually located in /etc/init.d, /etc/init.d/rc.d,
    or /etc/rc.d. (Sometimes distributions provide links so that two or all three
    of these locations will work.) You might not want a SysV startup script to run
    all the time, though. You can, of course, uninstall a package if you never want
    it to run, as described in Chapter 6, “Cleaning Up Unused Packages”; however,
    this may be overkill. Perhaps you want to continue using the program but only
    launch it at times, or perhaps you want to run the program via a super server
    rather than via a SysV startup script.


    **NOTE:** Not all programs have SysV startup scripts. These scripts are used to
    launch servers and other low-level system services, only packages for which provide
    SysV startup scripts. Most user programs, such as text editors, compilers, and
    e-mail readers, aren''t started through SysV startup scripts.


    This is where runlevels come in. Each runlevel has a specified set of SysV startup
    scripts. To define runlevels, distributions use subdirectories of /etc or the
    main SysV startup script directory. These subdirectory names take the form rc?,
    where ? is the runlevel number, from 0 to 6. Each runlevel contains links to SysV
    startup scripts, but the links have altered names, of the form ## or K#. In both
    cases, ## is a two-digit number and script is the original SysV startup script
    name. If the link''s name begins with S, Linux passes the stop option to the script,
    which causes the service it controls; if the link''s name begins with K, Linux
    passes the stop option to the script, which causes the script to stop (kill) the
    service it controls.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Managing Processes 189


    The two-digit number serves as a sequence number; services are stopped and started
    in order based on those numbers.


    This set of features enables you to control what processes are started and stopped
    in each runlevel. You can create or rename links to a service or change whether
    it''s active or inactive in runlevel. The main problem with this approach is the
    sequence numbers. Some services are dependent on others being active to start
    or should not be stopped before others. For instance, network servers all rely
    on basic networking features. In most distributions, the network is activated
    through a SysV startup script called network or networking, so that script must
    have a startup sequence number that is lower than the startup sequence number
    for any network server. The opposite is true for the shutdown scripts. Furthermore,
    startup sequence numbers aren''t standardized across distributions; a service
    with a number of 40 in one distribution might have a number of 55 in another.
    For these reasons, you shouldn''t manually adjust SysV script links for runlevels.
    Unless you have an intimate understanding of the sequence for your distribution
    and the needs of a particular service, you''re likely to get it wrong and cause
    the service to not start or stop correctly, or to interfere with other services.


    > NOTE: The Gentoo distribution is a bit odd. Rather than numbered runlevels,
    Gentoo uses an arbitrary number of named runlevels. Furthermore, Gentoo''s SysV
    scripts contain dependency information, deviating the need for startup sequence
    numbers—if a script is run but some depended-upon service is not yet running,
    Gentoo simply runs the startup script for service before proceeding.


    In practice, managing the SysV scripts that run in specific runlevels is a task
    that''s best handled via special tools. Some of these tools are present in several
    distributions, but others are highly distribution-specific:


    +   chkconfig—This program is a fairly basic command-line tool that is present
    in most RPM-based distributions, including Fedora, Mandrake, Red Hat, and SuSE.


    +   rc-update—This program is the logical equivalent of chkconfig for Gentoo systems,
    but the details of its operation differ.


    +   ntysv—This program is an interactive text-mode program for changing the services
    that are running in a given runlevel. It''s available for Fedora, Mandrake, and
    Red Hat.


    +   sysv-rc-conf—This program is similar to both chkconfig and ntysv in it provides
    both command-line and interactive text-mode controls of SysV startup scripts.
    It''s commonly used on Debian systems.'
