  md: 'Unfortunately, not all types of gunk can be cleaned up. Bad HTML and buggy
    Java or JavaScript, for instance, are hard to fix. (At least one Linux proxy server,
    FilterProxy, takes a stab at cleaning up some types of bad HTML, though.) Where
    your dungeking efforts are likely to pay off in removing buggy or otherwise unwanted
