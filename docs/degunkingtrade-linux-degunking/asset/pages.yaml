  md: '# Setting the Refresh Rate


    Computer monitors change, or refresh, their displays a fixed number of times per
    second. This refresh rate is expressed in Hertz (Hz), in a 75Hz refresh rate.
    As a general rule, the higher the refresh rate, the better; the human eye perceives
    low refresh rates as flicker, and even below perceptible levels, flicker can cause
    headaches and eye strain.


    A CRT monitor''s overall refresh rate is determined by two separate values, often
    referred to as horizontal refresh rate and the vertical refresh rate, or minor
    variants of these terms. Modern monitors support limited ranges of horizontal
    and vertical refresh rates, expressed in kHz and Hz, respectively. X can compute
    the optimum vertical refresh rate based on the monitor''s capabilities and your
    selected video mode, but to do so, it needs to know the monitor''s capabilities.
    To tell X about these capabilities, you must locate the Monitor section of your
    X configuration:


    +   Monitor"\ Identifier "monitor1"

    - VendorName "LiquidVideo"

    - ModelName "LI7LCD2"

    - HorizSync 30-80

    - VertRefresh 55-75


    EndSection

    Your Monitor section may include additional lines that set more features. If so,
    ignore them.The important lines to adjust are the HorizSync and VertRefresh lines,
    which set the horizontal and vertical refresh rates, respectively. If your CRT
    monitor is flickering, you should verify that these values are correct. To do
    so, though, you must have documentation on your monitor. Monitors'' manuals usually
    provide this information in a specifications section. If you don''t have your
    monitor''s manual, try searching on the manufacturer''s site or doing a general
    web search.


    > WARNING! Do not enter random guesses for the HorizSync and VertRefresh lines!
    Older monitors can actually be damaged by out-of-spec signals, so guessing at
    these values has the potential to destroy your monitor! Modern monitors are usually
    smart enough to ignore such signals, but it''s best to play it safe on this score.


    Once you''ve made these changes, restart X, as described earlier, in "Changing
    Color Depth Options."The result should be that X will begin using a higher refresh
    rate, if your changes enable it to do so.'
  merge: -1
  pgno: 319
