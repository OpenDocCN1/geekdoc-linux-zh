- img_proc: true
  md: '# 130 Chapter 6


    All Linux distributions deliver software in packages—collections of files that
    make up a working program or other logical set of files, such as a set of related
    files. Typically, a package includes includes one or more executable program files,
    documentation files, configuration files, and possibly support libraries. A Linux
    package is usually distributed as a single file that contains all these files,
    like a Zip archive file contains many files. Package files, though, include extra
    information on dependencies (the additional packages upon which the first release
    relies), package descriptions, and so on. Most Linux distributions use the RPM
    Package Manager (RPM) tool for package management, but some use other systems.
    For instance, Debian and its derivatives Debian packages, Slack uses tarballs,
    and Gentoo uses a unique source-based system.


    A working Linux system consists of hundreds of installed packages. You can add
    or remove packages to install or uninstall programs, within limits imposed by
    package dependencies, free disk space, and so on. The packages used by Linux distributions
    are very useful, but can quickly collect a lot of unnecessary packages. These
    packages consume disk space and can cause additional problems, as described shortly.
    Thus, you should periodically review your system''s configuration to weed out
    unused packages. This chapter will help you do this. I show how to use package
    browsers to help identify installed packages, how to determine which packages
    are unnecessary, and how to remove these unnecessary packages. I will also show
    how to keep your system up-to-date—old packages can contain bugs (some of which
    can cause security problems), so replacing old software with new ones is very
    useful. Finally, I''ll help you deunk dependency problems—problems that can arise
    because of conflicting dependencies.


    # Why Clean Out Unused Packages?


    In today''s world of hard disks with sizes measured in the hundreds of gigabytes,
    you might wonder whether cleaning out unused packages is necessary. The answer
    is multifaceted. Unused packages can consume disk space, cause administration
    problems, pose security risks, and complicate subsequent system or package upgrades.
    Each of these issues could be critically important on some systems, but even if
    one or two don''t concern you, chances are at least one should. Thus, I''ll describe
    each of these problems in a bit more detail to so you can understand the consequences
    of package gunk.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'Cleaning Out Unused Packages


    # Reducing Disk Space Consumption


    The most obvious reason to remove unused packages is to minimize disk space consumption.
    This reason may not seem important if you''ve got hundreds of gigabytes of unused
    space, but if your system has little disk space, it''s an important issue. Furthermore,
    sometimes having a lot of free space can be important—say, to give you space to
    create and manipulate a large temporary file, such as a large multimedia file.


    You should also note that Linux systems consist of multiple partitions. Most Linux
    packages install primarily to the /usr directory, which often resides on its own
    partition. If not, packages install in the (/) partition. Even if you''ve got
    plenty of free space in some other partition, such as the partition for /home
    (which holds user files), you might not have much free space where most packages
    reside. You can use the df command to determine how much free space you''ve got
    on various partitions, as described in Chapter 3, "Degucking User Files."


    # Maintaining Administration Simplicity


    One of the problems with Linux, particularly for new users, is that it is a very
    complex operating system. You''ve got a boot loader, the kernel, system startup
    scripts, daemons, cron jobs, user accounts, and more. The result of all this complexity
    is increased administrative burden. You must manage all these systems, and if
    you make a mistake, the computer can behave strangely or even do things that are
    risky. Thus, minimizing the complexity of a Linux system is desirable. Desktop-oriented
    distributions try to hide as much of this complexity as possible, but they can
    only go so far in this respect.


    One way to minimize the complexity of a Linux system is to reduce the number of
    installed packages—that is, to uninstall the ones that aren''t necessary. If the
    Apache Web server, to name just one example, isn''t installed, it doesn''t need
    to be configured or administered in any way.


    Of course, you shouldn''t take this too far. A Linux system with no packages installed
    isn''t a Linux system at all—it''s a blank hard disk! Nonetheless, removing those
    packages that you really don''t need from the system can be a good way to help
    reduce the administrative burden of running the Linux system.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Reducing Security Risks


    Whether it runs Linux, FreeBSD, Mac OS, Windows, or any other OS, one of the major
    problems with any computer is security. Some computer security problems relate
    to the computer''s physical environment (locks on doors, for instance) or the
    computer''s users (they might write down passwords, for instance). Many computer
    security problems, though, arise because of software bugs.


    Some security bugs are associated with servers, such as the Apache Web server
    or the gmail mail server. Servers are essentially programs that users on other
    computers can run. Thus, bugs in such programs can sometimes enable outsiders
    to gain control of your computer even if they don''t have accounts.


    Other security bugs relate to local programs—that is, programs that only local
    users can run. Usually, bugs in such programs aren''t really security issues,
    although they can be annoying. But sometimes, such bugs can enable local users
    to gain root access to the computer. Such bugs are most important on systems that
    are used by many people, which can be exploited by outsiders. For instance, if
    a miscreant gains access to your ordinary user account via a remote login protocol
    (because your password was intercepted), the miscreant might be able to abuse
    a local program bug to gain root privileges.


    In both cases, security bugs can be dealt with several ways, including keeping
    your system up-to-date, as described later, in “Keep Software Up-to-Date.” One
    of the best ways to minimize the risk, though, is to reduce the amount of unnecessary
    software installed on the computer. If a bug in SuperProg can be abused to gain
    root access, for example, and if you don''t need SuperProg, keeping it off the
    computer can guard against abuses. Of course, you can''t know which programs are
    subject to abuse—vulnerabilities lurk, undiscovered, in many programs. As these
    problems are found, updates are issued, and if you keep unnecessary programs off
    of your computer, you won''t need to worry about updating them and your system
    won''t be subject to attack in the interval between the vulnerability being discovered
    and its fixing.


    # Minimizing Upgrade Headaches


    A final reason for removing unused packages is to reduce upgrade complications.
    Earlier, I noted that Linux packages include dependency lists. As packages are
    updated, these dependencies may change. For instance, SuperProg 1.3 may depend
    on HyperLib 2.8, but SuperProg 1.4 might depend on HyperLib 2.9. Thus, if SuperProg
    exists on your system and you use a tool to help automate the update process,
    you''ll end up upgrading both SuperProg and HyperLib.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Cleaning Out Unused Packages 133


    Unfortunately, such upgrades sometimes cause problems. For instance, HyperLib
    might be used by some other program (say, OtherProg). Perhaps OtherProg doesn''t
    need updating when SuperProg is updated, the new version of HyperLib might not
    be compatible with your version of OtherProg.Thus, the update of HyperLib that
    was mandated by the upgrade of SuperProg will cause problems for OtherProg. In
    the best of all possible worlds, your package management system will spot this
    problem and alert you to it, so you''ll be able to intervene in the upgrade process
    before harm is done. (The upcoming section, “Handle Dependencies,” describes some
    of the issues and solutions in more detail.) Unfortunately, problems sometimes
    sneak the package management systems.


    In practice, the symptoms that result from such problems can be quite varied.
    They range from a package system refusing to upgrade or install a program to once-working
    programs randomly crashing or otherwise misbehaving.


    One way to reduce the risk of such problems occurring is to simplify your system—by
    you guessed—removing unnecessary packages.To use the fictitious programs described
    earlier, if you hadn''t installed SuperProg, an automatic system update wouldn''t
    try to upgrade. Depending on the package management system and how you initiated
    the upgrade, HyperLib might not be upgraded, so problems with OtherProg might
    not appear. On the other hand, HyperLib might be upgraded despite the absence
    of SuperProg, but such an upgrade is less likely without SuperProg.)


    # Use Package Management Tools


    Removing extraneous package gunk using your Linux distribution''s package management
    tools.These tools differ from one distribution to another, but the two most common
    systems are RPM and Debian packages.I''ll briefly describe both systems, including
    their command-line tools. For removing unnecessary packages, though, the best
    tool is arguably a GUI package browser. Several such package browsers exist, so
    I''ll describe several and give examples of how to use a couple of them.


    # Understanding Linux Package Systems


    In the Linux world, several package managers have emerged to help place files
    on the computer and manage them. The most popular package management system in
    Linux is RPM.This system is used by many distributions, including Fedora, Lycis,
    Mandrake, Red Hat, SuSE, TurboLinux, and Yellow Dog.The second most popular Linux
    package management system is the Debian package'
