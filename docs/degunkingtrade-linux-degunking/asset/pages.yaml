    The top program processes according to the CPU time they''re using.


    If your system is sluggish and you spot a process that you can''t identify or
    that you know shouldn''t be consuming inorder amounts of CPU time, and if that
    process is chewing large amounts of CPU time, it''s probably your culprit. If
    you''re lucky, you can match the process to a window on your screen, enabling
    you to get into the program and shut it down or take other steps to make it run
    efficiently. If not, you might need to dig deeper to identify the process. Try
    looking for a man page for the program; for instance, if you didn''t know what
    it was, type man xvnc. This might help you determine what the process is and whether
    it should really be chewing so much CPU time. If you''ve identified the process
    and want to rein it in but don''t have direct access to its user interface (because
    it''s a daemon or it''s not responding), consider the upcoming sections "Kill
    Stray Processes" and "Adjust Priorities" for tips on how to proceed. In any event,
    you should note the process ID (PID) number in the first column of the top output;ll
    need this information to kill the process or adjust its priority. Alternatively,
    you can use top itself to do the job.'
