    # The Role of X


    The Unix philosophy, to which Linux adheres, holds that it''s better to perform
    a task by gluing together small tools than by creating a single monolithic one.
    If you use small programs, chances you can recycle or more of them in other roles.
    Using small tools also enables you to swap out one of those tools for another
    if you don''t like it. The Linux subsystem follows this philosophy by breaking
    itself down into several components:


    +   - X—X itself is at the root of the Linux subsystem. X interfaces with the
    display hardware, sets a video mode, and displays low-level constructs such as
    windows, lines, and text. X does not, by itself, provide the tools needed to generate
    menus, buttons, dialog boxes, or other more complex GUI features.


    +   - The window manager—The window manager provides decorative and functional
    borders around windows and manages the desktop. Users can select from several
    window managers to use.


    +   - Widget sets—In order to create dialog boxes, menus, and so on, programmers
    rely on tools known as widget sets. These programming libraries help create GUI
    interfaces. Each programmer selects a widget set to be used by a program, and
    users can''t easily change this feature. (This is why Linux programs'' GUIs aren''t
    consistent across applications as the GUIs in most other OSs—widget sets differ
    in their appearance and operational details.)


    +   - Desktop environments—Desktop environments take window managers one step
    further. They include window managers and additional support programs to make
    complete user environments.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Optimizing Your X Configuration 293


    Of these four components, window managers and desktop environments are covered
    elsewhere in this book—specifically, in Chapter 4, "Degucking your Desktop Environment."
    Widget sets are not easily swapped out by users, so I don''t provide them, although
    some desktop environment settings actually configure the widget sets they use.
    X itself, though, can be optimized in various ways, and this chapter describes
    this task.


    Another important feature of X is that it''s a component atop Linux. In fact,
    you can completely uninstall X from the system, which can make the computer run
    more quickly because it needn''t provide for X''s needs. (Try that with Windows!)
    Many Linux servers run in this way, but desktop systems usually don''t. The fact
    that X is distinct from the rest of Linux can be important because that distinction
    provides ways to tie into X to use it in unusual ways. One of the most extreme
    of these unusual X configurations is the fact that X needn''t run on the same
    computer as the programs it runs.


    X is a network-enabled GUI. X-programs treat X as a network resource, much like
    a file or print server. Instead of being a resource for storing files or printing
    documents, X provides user interface tools.A program uses network protocols to
    X to display a window,place text in the window, and so on. The result is a rather
    confusing bit of terminology:The user sits at the X server. The programs they
    run (which may reside on a remote computer) are the X clients. Most people think
    of servers as distant computers (or the programs they run) and clients as being
    the programs run on their local computers, and this is usually correct. X turns
    this upside down, though. Try to think of it from the program''s point of view.
    People and the servers they use are, to program, just network input/output devices,
    like any other server.


    > **NOTE:** You can use X to run programs on remote systems, I don''t describe
    precisely how to do so in this book. X''s server shows up in terminology and keeping
    it in mind can help you understand some of X''s peculiarities, which why I''ve
    described here.


    Because X is a modular component of Linux, you can swap out your server for another
    one, and theoretically all of your programs will continue to work. Most Linux
    distributions released in 2004 and use the X.org-X11 server (http://www.x.org).
    This is derived from XFree86 (http://www.xfree86.org), which was the preferred
    X server through 2004.The shift occurred because of a small licensing change in
    XFree86, to many Linux distribution maintainers objected. As of XFree86 4.4 and
    X.org-X11 6.8 (the'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'latter is actually the first version of X.org-X11), the differences between

    two X servers are tiny. In addition to these open source X servers, the commercial

    Accelerated-X (http://www.xig.com) is also available, but most Linux users

    happy with the open source X.org-X11 or XFree86.


    # # Pick the Right X Driver


    The X degunging task you might want to undertake is selecting the best

    X driver for your system. Chapter 11 describes this job, with an emphasis on

    picking a driver that works.Thetwo main open source X server packages both

    provide drivers for the most popular video cards on the market as well as for

    dozens of older legacy cards.


    Although it''s not often used on x86 systems, another option is to use a framebuffer

    driver, which goes by the driver name fbdev. This driver works in conjunction

    with a kernel-level video driver of the same name. The advantage of

    framebuffer driver is that you can use a single user interface between X and

    the kernel, no matter what video hardware is installed. Using a framebuffer

    has two main drawbacks. First, there are far fewer framebuffer drivers

    there are X.org-X11 or XFree86 drivers, so you''re less likely to get good

    performance. The kernel is likely to fall back on a generic VESA driver that

    works with most cards in a low-performance mode if nothing else works).

    Second, even at their best, framebuffer drivers typically don''t perform as well

    as direct drivers in X.


    X also supports its own VESA drivers (under the driver name vesa) and the

    e lower-level VGA drivers (with a driver name vga). These drivers work

    with all video cards, but they are slow. Most video chipsets provide

    advanced features to help display lines, rectangles, and other geometric shapes

    quickly, and X drivers for particular video card chipsets can take advantage of

    these features. The VESA and VGA drivers cannot use these features, though,

    ''re not part of the VESA and VGA standards.


    The bottom line is that you should check your X configuration file (xorg.conf,

    XFree86Config, or XFree86Config-4, in the /etc/X11 or etc directory). Look for
    a

    device section for your video card, described in Chapter 11, and ensure that

    it does not reference the fbdev, vesa, or vga driver. If it does, you may want
    to

    change that configuration so it uses a direct driver for your video card.

    Chapter 11 describes some ways to locate driver.'
