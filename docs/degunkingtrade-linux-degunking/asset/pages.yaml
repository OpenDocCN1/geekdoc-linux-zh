- img_proc: true
  md: '# Managing Processes 199


    WARNING! Sometimes a process name is not unique. For instance, you might be running
    several instances of xfig, in which case they''d all show up in the ps output.
    You might be able to tell which one is the process by noting any options that
    appear in the output, such as xfig08-01.fig (the filename passed to the program)
    in the preceding example. Adding the u option, as is ps rather than ps ax, adds
    username information to the output, which might be useful if several users are
    running the same program.


    # Kill Stray Processes


    Frequently, the only way to deal with a seriously misbehaving process is to kill
    it tools. In many ways the simplest approach is to use the program''s own user
    interface, but this isn''t an option if the program has stopped responding to
    input or if it''s a server or some other tool that lacks a user interface. (You
    may be able to pass the stop option to the SysV startup script or use a GUI Sv
    startup manager to kill a server, though.) If you''ve identified the misbehaving
    process using top, you can use that tool to kill the troublemaker. Several GUI
    tools also exist to help with the job. Another approach is to use the most basic
    tools available, known (appropriately enough) as kill and killall.


    # Killing Processes Using top or GUI Tools


    The top utility can help you identify processes that are running out of control,
    as described earlier in "Locate Misbehaving Programs." Frequently, top is more
    than just a gunk identifier; it''s a gunk cleaner, too! To use it in this way,
    follow these steps:


    +   - Locate the problem process described earlier.

    - While still in top, press the k in top. The program will respond by prompting
    you, between the summary information at the very top of the display and the process
    list that occupies the bottom of the display, for the PID to kill.

    - Type the PID number from the first column of the process list for the process
    you want to terminate. The program responds by asking you for a signal number.
    This is a numeric code Linux sends to processes as a crude form of communication.
    Table 8–1 summarizes some common signals and their meanings.

    - Type a signal number and press the Enter key, or simply press the Enter key
    to accept the default signal number of 15.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# 200 Chapter 8


    5. If the process doesn''t disappear from the process list within a few seconds,
    repeat 2–4, but use a stronger signal, as signal 9 rather than signal 15.


    | Signal Number | Signal Name | Purpose |

    | 1 | HUP | Indicates that a terminal has closed ("hung up," hence the name).
    Servers often respond to this signal by re-reading their configuration files.
    |

    | 2 | INT | Interrupts a process. The kernel sends this signal when you press
    Ctrl+C in a running program''s terminal. |

    | 3 | QUIT | Terminates a program and leaves a core dump, which is a file that
    can be used for debugging purposes. |

    | 9 | KILL | Kills a process ungracefully, without giving it a chance to save
    files. |

    | 10 | USR1 | This signal''s effect depends on the target program. Consult the
    program''s documentation for details. |

    | 12 | USR2 | This signal''s effect depends on the target program. Consult the
    program''s documentation for details. |

    | 15 | TERM | Terminates a program gracefully. The program can usually save open
    files and otherwise clean up itself before quitting. |

    | 18 | CONT | Continues operation after a STOP signal. |

    | 19 | STOP | Suspends a process. Similar (but not identical) to pressing Ctrl+Z
    in a running program''s terminal. |


    > NOTE: Table 8-1 is not complete; it only lists some of the most commonly used
    signals. Signal names are often referred to with SIG before the name in Table
    8-1, as in SIGKILL rather than KILL. Many of these signals aren''t terminating
    processes, but you may want to send them in other contexts, such as getting a
    server to re-read its configuration files.


    For killing misbehaving processes, it''s generally best to start with signal 15
    (TERM), which is a "polite" way to get the program to terminate. If that action
    doesn''t work, signal 9 (KILL) almost always does the job. If a KILL signal doesn''t
    work, and if the process is a serious problem, you may need to reboot the computer.
    Occasionally, a process can''t be killed but isn''t a major threat. For instance,
    zombie processes (described in Chapter 7) can''t be killed directly, but zombies
    don''t consume much in the way of system resources, you can safely ignore them.


    > NOTE: If you run as an ordinary user, you can terminate your processes using
    top but not system processes (those owned by root) or processes owned by other
    users. To terminate any system process using top, or those owned by arbitrary
    users, you must run the utility as root.'
