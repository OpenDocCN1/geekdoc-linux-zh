    can help you locate extra servers. In particular, the Linux netstat command is
    (almost) all-purpose networking tool that can be used to help track down open
    ports—that is, the servers that use to accept connections from outside.


    To use netstat to locate open ports, use its -l (that''s a lowercase L) and -p
    options in combination.The -l option causes the program to display information
