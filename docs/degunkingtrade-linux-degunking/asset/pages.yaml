  md: '# 314 Appendix A


    # Selecting Backup Hardware


    When designing a backup system, you should begin with your choice of backup medium.
    Several media are popular for backups:


    +   Tapes—Magnetic tape has been the traditional backup medium. Tape drives range
    price from a couple hundred dollars to several thousand, with individual tapes
    costing a few tens to thousands of dollars. Magnetic tape tends to be a bit slow
    and unreliable, but details vary with the type of tape—several varieties exist.
    Overall cost tends to be low, particularly for high-volume backup needs, such
    as network backup servers. (For such systems, the cost is in absolute terms but
    low on a per-gigabyte basis.) Tape''s advantage is eroded by the dropping prices
    of conventional hard disks,


    +   Optical disks—Optical discs (CD-Rs, CD-RWs, and various recordable DVD technologies)
    are good for relatively small backups, such as user data on modern systems. Readers
    for these are ubiquitous, which makes data recovery easy. Most estimates place
    the anticipated lifetime of optical media in the decades, which makes them good
    for archival storage. (Some recent studies are more pessimistic, though. For best
    longevity, do not use stick-labels; leave discs unlabeled, use a disc printer
    to print a label directly on the disc, or mark with permanent felt-tip markers.)
    Optical disks are inexpensive on a per-gigabyte basis.


    +   Removable disks—Removable disk technologies range from floppy disks to high-capacity
    media such as Orb and Jaz disks. These are convenient storage media for individual
    projects and perhaps user backups, but they tend to be expensive on a per-gigabyte
    basis, and most drives have low capacities. This is particularly true of floppy
    disks, which are extremely slow.


    +   Removable hard disks—You can purchase a special mounting bay and trays for
    hard disks to turn them into high-capacity removable disks. The dropping price
    of hard disks makes this approach cost competitive with many tape formats in ways.
    Hard disks are relatively fragile, so though you must take care in storing the
    disks. This feature complicates off-site storage, as well. Overall, this format
    can be a good choice for full system backups or user backups when users store
    very large files.


    Overall, tapes and removable hard disks are the media of backing up your entire
    system. For backing up smaller subsets of data, optical discs and smaller removable
    disks can be good choices.'
  merge: -1
