    # Testing the Package


    One radical approach to determining whether or not a package is gunk is to test
    it. For software package, this means running the program, so you should use your
    package tools to obtain a list of files in the package, paying attention to those
    in bin and sbin directories as /usr/sbin/sbin or /usr/X11R6/bin. Files in these
    directories are executable program files, so you can type their names at a command
    prompt to see what they do.


    > WARNING: Some programs do dangerous things. Thus, I recommend performing such
    a test only as a last resort unless you already have some idea of what the program
    does and you want to learn the details. You should also run unknown programs first
    as a regular user rather than root. Many programs also accept --help or -h as
    a command to display basic information, by passing these options the first time
    you run an unknown program, as in /usr/bin/someprog--help.


    Non-program packages cannot be tested in this way. Such packages include libraries,
    fonts, and documentation, among other things. You''ll need to test such packages
    in some other way, such as reading the documentation files in a text editor or
    Web browser. (Some documentation files require special viewers, though, such as
    the man utility for reading man pages.) Libraries aren''t easily tested unless
    you know what programs use—and in that case, you should know whether the library
    is necessary or not.


    # GunkBuster''s Notebook: Dealing with Dependencies


    Packages can be required for one of two reasons:


    +   The package is actually necessary for basic system functionality or for your
    specific purposes.


    +   The package is marked as a dependency of another package. For instance, a
    word processor might depend on a font collection or a compression tool, if you
    install the word processor, you must also install these other packages.


