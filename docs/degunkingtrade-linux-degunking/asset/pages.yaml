    event. For instance, if your system hangs when you try to burn a CD-R, it could
    be that your ATA or SCSI controller''s driver is less than stable, or perhaps
    you''re trying to use inappropriate options in your CD-R burning software. (Normally,
    the latter shouldn''t cause a system crash, but in combination with a driver bug,
    it might.) If your system locks up or reboots at random times, hardware faults
    are likely:'
