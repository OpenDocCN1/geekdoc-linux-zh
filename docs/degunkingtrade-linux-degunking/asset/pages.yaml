  md: '# 250 Chapter 10


    During its normal operation, SpamAssassin attempts to update itself dynamically.
    This is particularly important for its statistical rules. When SpamAssassin determines
    that a message is spam, that message''s words are added to the spam word list;
    when SpamAssassin classifies a message as non-spam, its words are added to the
    non-spam word list. Unfortunately, this classification is sometimes incorrect.
    For such cases, you may want to fine-tune the listing. To do so, you should first
    extract the message to a text file. For instance, in Evolution, select the message
    and pick File > Save As from the Evolution menu bar. You can then save the message
    to a text file and perform various actions on it from a command:


    +   - Study SpamAssassin''s classification. To show how SpamAssassin is classifying
    a message, type spamassassin -t <message.txt, where message.txt is the filename.The
    result is the message being echoed to the screen, followed by a series of lines
    describing the tests triggered on the message. You could use this information
    to tweak the scores over your rules, as described.


    +   - Manually train the statistical filter module. If a message is misclassified
    as spam or non-spam, or if you have a large collection of messages of one type
    or another, you can pass them to the sa-learn program, which takes the --spam
    and -ham options to classify messages as spam or non-spam, respectively. For instance,
    type sa-learn --ham message.txt to classify a message as non-spam.


    +   - Report spam to online databases. SpamAssassin''s -r (or --report) option
    delivers a message to online spam databases. To do this, type spamassassin - <message.txt.
    Once this is done, identical messages sent to those tools will be rejected, even
    if the messages trigger other spam detection rules. Recommend not using this feature
