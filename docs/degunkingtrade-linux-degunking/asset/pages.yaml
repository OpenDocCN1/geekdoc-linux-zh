    # Managing Fonts


    One of the challenges of font management is keeping them from gunking up your
    system. Everybody uses a word processor likes playing with fonts, but sooner or
    later, the novelty wears off, and those hundreds of fonts get to be a drag, as
    they can slow down your use of the system. Locating the handful of fonts you use
    in a long list can be a problem, and programs may respond more to certain actions
    as they have to wade through many fonts when presenting menus or dialog boxes.


    The key, is to exercise moderation. Don''t add fonts unless you''re reasonably
    sure you''ll actually use them, and go through your additions every now and be
    sure they''re fonts you actually do.Remember to clean out the fonts you''ve added
    globally (by editing /etc/fonts/local.conf or using a system administrator option
    in a GUI font management tool) and the fonts you''ve added to your account (via
    a GUI font management tool''s local options or by adding fonts directly to ~/.fonts).


    One complication to font management is that some distributions ship with a wide
    selection of free fonts, many of which will inevitably be gunk for any individual
    user.The trouble is that you can''t simply delete all your distribution''s font
    packages because some are necessary.You can begin to get a handle on the situation
    by tracking down the font packages management tools, as described in Chapter 6,"Cleaning
    Unused Packages," to identify the packages to which individual font files and
    directories belong. For instance, suppose you''ve identified the fonts in /usr/share/fonts/extraTT
    fonts you don''t need. If your system uses RPM, you could type the following command
    to identify the packages that own the files in this directory:'
