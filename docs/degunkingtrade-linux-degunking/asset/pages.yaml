  md: '# Gunk Added by Mistake


    A second major way for gunk to make its way onto your system is through error.
    Errors can cause any types of gunk just described—user gunk, system gunk, or hardware/driver
    gunk. In fact, most user gunk is created in this way—Linux distributions provide
    relatively minimal user configurations. The configurations that they provide are
    mostly centered around their desktop environments, and these usually are not very
    gunky—at least, assuming that you want to use the desktop environment in question.(Big
    desktop environments themselves can be considered a type of gunk on small systems,
    as described in Chapter 4.) Errors that lead to gunk are largely housekeeping
    issues—a failure to delete old files or organize them into subdirectories, poor
    structure to icons added to a desktop environment, and so on.


    System gunk and hardware/driver gunk that is added by mistake are usually the
    responsibility of the system administrator. On a home system or some small business
    systems, this may be the same as the end user, but the actions that create gunk
    are performed with the help of the root account. Frequently, this type of gunk
    is added because of inexperience. For instance, if you don''t know how to install
    packages, you might need to install everything you need. This tendency is understandable,
    but it does lead to gunk buildup, particularly over time. Similarly, inexpert
    changes to system configuration files (most of which are located in the /etc directory)
    can produce gunky configurations. When wearing the system administrator hat, your
    main defense against adding gunk by mistake is education. The more you know about
    how Linux operates, the less likely it is that you''ll add gunk by mistake.


    # Gunk Added Maliciously


    Perhaps the most troubling category of gunk is gunk that''s added maliciously.
    Most typically, this is the result of a cracker who breaks into your computer.
    Sometimes this is done for fun, like a cyberspace ride. Other times, the cracker
    has a specific goal in mind, and your system is just one stepping stone to that
    goal. For instance, crackers may want to use your computer to send spam or to
    attack other computers. On rare occasion, crackers break into your computer because
    you personally (or your organization) is the target and the cracker wants to steal
    data, deface your Web site, or what have you.


    In any event, crackers usually leave gunk behind. This gunk can take one or more
    of several forms:'
