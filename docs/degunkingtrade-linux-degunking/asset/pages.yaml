- img_proc: true
  md: '# 240 Chapter 10


    Sometimes, though, you want Privoxy to work for many computers. In this case,
    you should bind Privoxy to the computer''s main IP address. For instance, if the
    computer has the IP address 192.168.1.7, you might change listen-address to look
    like this:


    ```

    listen-address 192.168.1.7:8118

    ```


    This will make Privoxy available to other computers. If the system on which it''s
    running is connected directly to the Internet, this can be a security risk, so
    be sure you want to make this change. (If your network is protected by a router
    with firewall features, the risk is lower, but you may want to check your router''s
    configuration to be sure it blocks the port you use for Privoxy.)


    In all cases, Privoxy''s port number can also be changed. The default of 8118
    is fine in most cases. Some clients use port 8000 or 8080 as a default for proxy
    servers, this value can be changed in the client, so there''s little advantage
    to changing it in Privoxy. You must remember the port number you used, though.


    Once you''ve changed the address and port number, you should start or restart
    Privoxy. This is usually done through SysV startup scripts:


    ```

    # /etc/init.d/privoxy start

    ```


    On some distributions, you may need to change init.d to rc. If Privoxy is already
    running and you''ve changed the configuration file, change start to restart.


