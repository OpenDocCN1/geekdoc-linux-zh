    # GunkBuster’s Notebook: Degunking with the Linux root Account


    Degunking user accounts can get a little tricky because for the most part, this
    activity requires access to the root account. (There are a few exceptions to this
    rule, though, or cases where the problem may straddle the line—root access might
    or might not be absolutely necessary to fix the problem in all cases.) Fixes usually
    involve modifying system configuration files or issuing commands that affect running
    programs. GUI tools are available for these tasks in many Linux distributions,
    but there''s little cross-distribution standardization in GUI system administration
    tools. Command-line tools, though, work on all distributions, or at least many
    of them. In this book, I''ll emphasize the command-line tools, but I''ll also
    present examples of GUI tool use for many tasks.


    Linux separates user accounts from the root system account for a reason. Day-to-day
    use of Linux doesn''t require access to files in /etc (the directory that holds
    most system configuration files) or other protected files; using a normal user
    account protects against mistakes that could have dire consequences. Linux provides
    few safeguards against errors when you use root. For instance, it''s easy to accidentally
    delete all the files on a Linux system when using the root account, but this isn''t
    possible when using a regular user account. Thus, you shouldn''t use the root
    account unnecessarily, and when you do this, you should be particularly cautious
    about all the things you do with it. This distinction between system administration
    and ordinary use is a bit blurrier in Windows NT/200/XP, and it''s nonexistent
    in Windows 9x/Me. If you''ve moved from Windows to Linux, you might need some
    time to get used to this. You might even think the system of account management
    is a pointless hurdle to overcome, but the added security it provides is well
    worth the minor inconvenience of having to access the root account to perform
    certain tasks.'
