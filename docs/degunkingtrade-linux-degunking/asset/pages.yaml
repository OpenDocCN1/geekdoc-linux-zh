    # ming Up: Keeping Your System Zippy and Stable


    Program speed and stability are important factors for everybody. Linux has a well-deserved
    reputation as a stable platform, but that doesn''t mean it will always perform
    smoothly. Program bugs, bloated software, insufficient hardware, and other problems
    can slow down the system, cause individual programs to crash, or even cause the
    entire computer to crash. Many small factors can improve matters, from using more
    reliable or smaller programs by disabling unnecessary features in the programs
    you do. Still, chances are you will occasionally encounter programs that crash.When
    you do, fixing them may be difficult or impossible if you''re not a programmer,
    but you may be able to work around the problem, and if the program is actively
    supported, you can report the bug so that it will be fixed.


    Another area of performance that can be greatly influenced by system configuration
    is printing. Finding, using, and properly configuring the right drivers can help
    speed up your printing and produce the best-quality output possible.'
