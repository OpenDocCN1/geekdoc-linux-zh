    # Using Up Your E-Mail


    Broadly speaking, e-mail falls into two categories: spam and worms (the latter
    are also called viruses). Spam is unsolicited bulk e-mail and is basically an
    annoyance. Worms are at potentially more serious because they are malicious programs.
    In practice, worms almost always target Windows systems, so you''re fairly safe
    from running Linux, but they can still clog your inbox and chew up your network
    bandwidth. Tools to block both types of gunk exist, in fact, the spam programs
    typically handle both types of gunk. Finally, some e-mail is plain weird—it contains
    bizarre characters or is formatted oddly. Unless this e-mail also happens to be
    spam or a worm, its content isn''t gunk; it just looks gunkly. Knowing how to
    deal with such e-mail can help you communicate with whoever sent it.


    # Using Spam and Worm Blockers


    Estimates the amount of e-mail that''s spam and worms at about 80 percent. This
    flood of worthless e-mail can easily swamp your legitimate e-mail, making it hard
    to locate and respond to legitimate correspondents. To help ease the burden, many
    tools exist to filter spam from your e-mail stream. Some of these tools work with
    any mail reader, but others are designed to work with just a few mail readers.
    Once you''ve picked an anti-spam tool, you must configure it to work on your system
    and perhaps with your e-mail client. I describe how to get the Evolution mail
    reader working with SpamAssassin.


    # Selecting an E-Mail Degunking Tool


    You know spam when you see it. Ads for products to enhance or shrink various body
    parts, solicitations to help smuggle goods from a foreign country, and claims
    accounts you never knew you are about to be closed are all'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Network Degunking 245


    obvious types of spam—at least, they are obvious to people who have much experience
    with spam. E-mail worms are also easy to spot once you''ve seen a few. They often
    claim to be from somebody you know and contain a cryptic message about an attachment
    you didn''t actually request.


    **NOTE:** For brevity, I frequently refer to "spam filtering" or the like when
    I mean "spam or worm filtering." Most Linux spam filtering tools are equally good
    at blocking worms, so the two tasks are really one task from a Linux perspective.


    Unfortunately, computers aren''t nearly as good as people at identifying spam.
    Suffering from a severe lack of human skills and real-world knowledge, a computer
    cannot use common sense to rip out the e-mails. Instead, programmers come up with
    assorted ways of identifying spam, including creating blacklists of the IP addresses
    that are most used to send spam, checking e-mail messages for keywords that are
    likely to identify spam, and using statistical tests to classify spam or non-spam
    based on previous classifications. Some of these tools, as IP address lists, work
    best on mail servers. Others, such as statistical tests, are best employed on
    e-mail clients. In Linux, some of the most popular spam-fighting tools:


    +   *Mail server options*—All major Linux mail server packages provide spam-fighting
    tools, such as pattern-matching options and checks against IP-based network black.
    These options are most viable if you are running your own mail server, so I don''t
    describe them here.


    +   *Procmail*—This program isn''t really a spam-fighting tool per se; it''s a
    part of a Linux computer''s local mail delivery system. It can perform patterns
    and can be used to weed out spam by keywords or known bad addresses. You can also
    use Procmail to call other spam-filtering tools. You''re most likely to use Procmail
    in your spam fighting if you run a mail server (a big topic in and itself) or
    if you want to use Linux''s local mail queue capabilities to help integrate mail
    from several sources (another big topic).


    +   *Bogofiler*—Statistical mail filters exploded onto the scene in 2002 and have
    proven themselves capable spam-fighters. Bogofilter (**http://bogofilter.sourceforge.net**)
    is a fast and popular example of a statistical filter. It can be integrated into
    a Mail queue or called from certain mail readers. Its major drawback is that it
    requires a sample of spam and non-spam messages to get started, so you should
    collect your spam for a few days (or longer) before starting to use Bogofiler.


    +   *Mailfilter*—Most user-level anti-spam tools work after you''ve downloaded
    the message and wasted your precious bandwidth. Mailfilter''s claim to fame is
    that it can delete spam from a Post Office Protocol (POP) account before'
