    /etc/initt file. For now, you should simply know not to mess with this—incorrect
    changes to /etc/initt can render a system unbootable! The SysV startup scripts
    are also quite important. They''re usually located in /etc/rc, /etc/init.d, or
    /etc/init.d (The precise location varies from one distribution to another). Subdirectories
    of /etc or one of the main SysV script directories are named rc?, where ? a number
    from 0 to 6. These numbers refer to runlevels, which are sets of programs and
    services that can be started or stopped as a group. The runlevel subdirectories
    contain symbolic links that point to the real SysV startup script files. When
    a new runlevel is entered, the SysV startup script and runlevel directs control
    how most programs start when the system boots and also how they stop when the'
