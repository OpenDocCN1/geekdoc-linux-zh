    Linux support for particular types of hardware devices. Notable among these are
    the Linux Printing site (http://www.linuxprinting.org), the main SANE site (http://www.sane-project.org),
    the X.org-X11 page (http://www.x.org), the Linmodems page (http://www.linmodems.org),
