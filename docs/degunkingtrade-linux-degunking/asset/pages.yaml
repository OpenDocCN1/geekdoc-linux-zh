    When you look for fonts, try to get Type 1 or TrueType fonts in PC (Windows) Mac
    format fonts and in more exotic formats must be converted first, and that process
    isn''t always easy. If you have a choice, I recommend using Type 1 fonts, simply
    because they produce cleaner Portable Document Format (PDF) documents if you need
    to create a PDF file using the font.


    > **TIP:** If you need to convert a font from Mac format or create between font
    types (**Type 1**), check out FontForge (http://fontforge.sourceforge.net). This
    program is a Linux editor that includes the ability to read fonts in a wide variety
