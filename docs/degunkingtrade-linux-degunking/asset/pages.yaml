    # Tweaking SpamAssassin''s Results


    A simple call to SpamAssassin, as just described, use SpamAssassin''s default
    rules. For best results, though, you should tweak your SpamAssassin configuration.
    One way to do this is to delve into the SpamAssassin configuration file, which
    can get a bit hairy if you''re uncomfortable with such things. Nonetheless, making
    such changes can help SpamAssassin''s performance. You can also pass specific
    messages to SpamAssassin to have it register their status as spam or non-spam,
    improving the program''s ability to correctly identify similar messages in the
    future.


    SpamAssassin uses two configuration files: /etc/spamassassin/local.cf is a system-wide
    configuration file, while ~/.spamassassin/user_prefs is the user'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Network Degunking 249


    configuration file. For a desktop system, chances are you''ll modify the latter
    file. In either file, you might want to change a few types of options:


    +   - Spam threshold—SpamAssassin works by assigning scores to messages. The higher
    the score, the more likely it is spam. (Unlike statistical filters, SpamAssassin
    doesn''t attempt to assign spam probabilities to messages, except as part of its
    own sub-filter.)You can change the required_score value to alter the threshold
    score for calling a message spam. Lower the score from the default value of 5.0
    to make SpamAssassin more likely to call something spam; raise the score to lower
    the likelihood that the message will be classified as spam. If you find SpamAssassin
    is misclassifying too many messages, you might want to adjust this value. Be wary
    of lowering this value, though could result in a loop of false alarms.


    +   - Change scores—Instead of changing the overall span threshold, if a particular
    rule is causing a message to be incorrectly classified as spam, you can change
    its score. To do so, use the keyword, as in MPART_ALT_DIFF 1.0 to set the score
    for the MPART_ALT_DIFF test to 1.0.A list of rules and their default scores are
    available from http://spamassassin.apache.org/tests_3_0_html, consult that page.
    Altering scores in this requires careful research on the scores and why SpamAssassin
    is classifying messages as spam. (I describe how to do this.)


    +   - Whitelists—A whitelist is a list of addresses or other mail characteristics
    that should give a message an automatic “pass.” For instance, you might want to
    create a whitelist with the addresses of your regular correspondents.You can use
    the whitelist_from option to add an address to the SpamAssassin whitelist, as
    in whitelist_from emily@example.com to let any mail with that return address.
    If you want to whitelist addresses, you can either place all on one line, separated
    by spaces, or create multiple whitelist_from lines.The whitelist_to option enables
    you to create a whitelist based on the recipient address (this might be helpful
    for mailing lists, instance), and various other whitelist options are also available.
    consult the SpamAssassin documentation for details.


    +   - Language detection—The ok_language option enables you to specify what languages
    are acceptable. If SpamAssassin believes the message is in another language, it
    will be flagged as spam. This option takes one or more two-letter language codes
    as options, as in ok_language fr to accept English and French messages.


    Many additional options are available as well. For more information on these options,
    type perdoc Mail:SpamAssassin::Conf. This produces documentation on the SpamAssassin
    configuration file that''s similar to a typical man page.'
