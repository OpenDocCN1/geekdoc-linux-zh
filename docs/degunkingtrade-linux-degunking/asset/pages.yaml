  md: '# 52 Chapter 3


    > NOTE: Unlike Windows, Linux doesn''t use special extensions (such as .exe or
    .com) to identify executable program files. Certain scripts are conventionally
    identified by extensions, but this isn''t required, and it''s seldom with binary
    programs. Instead, Linux identifies executable programs by a special permission
