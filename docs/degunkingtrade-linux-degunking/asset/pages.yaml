    kernel then looks for hardware components and configures them. When the kernel
    is through this, it launches a program called init, which in turn launches a series
    of SysV startup scripts. Scripts start networking, launching servers, and perform
    critical system startup tasks. The init process also launches text-mode login
    prompts, enabling you to log into the computer. GUI login prompts may be launched
    through init or a SysV script, depending on the distribution.


