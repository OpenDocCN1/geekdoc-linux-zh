    The best way to check for Linux compatibility is to do a bit of research on the
    Internet. Some resources you should consult list—Most Linux


    +   - Your distribution''s hardware compatibility list—Most Linux distributions
    provide hardware compatibility lists on their Web sites. These lists identify
    hardware that''s known to work with the distribution''s standard configuration.
    In theory, the lists of any two Linux distributions should be nearly identical,
    but in practice they differ because of differing testing priorities and support
    policies. Frequently, hardware that works isn''t simply listed because it''s not
