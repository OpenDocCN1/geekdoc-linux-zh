  md: '# Options for Package Browsers


    A package browser is a tool for perusing information about installed (and sometimes
    uninstalled) packages. Using a package browser, you can go through all the packages
    installed on your system, read their descriptions, and uninstall packages that
    seem gunky.


    Unfortunately, package browsers aren''t quite as well as the package tools upon
    which they rely. Many distributions provide their own GUI tools for package management.
    These include Debian''s text-mode select and X-based Synaptic, Fedora and Red
    Hat''s Package Management, and SuSE''s text-mode YAST and An older tool, GNOME
    RPM (or rpm) works with RPM-based distribution. If your distribution uses another
    tool, you may need to consult its documentation for details; however, the basic
    principles should be similar to those described in this chapter.


    > TIP: Although Synaptic was originally created for Debian, and the APT utilities
    upon it relies have been ported to use RPM. Therefore, Synaptic can be used with
    any RPM-based distribution. Check http://aptrpm.sourceforge.net for pointers to
    ports of APT and Synaptic for RPM-based distributions. The APT binary package
    works across distributions of a given CPU type, you will need to adjust your /etc/apt/sources.list
    file for your particular distribution.


    One caveat concerning package browsers is that some of them (such as the Fedora/Red
    Hat Package Management tool) ignore packages that aren''t part of the OS''s installation.
    That is, if you install a package from a third party, it might not show up in
    the package browser. Most package browsers, including GNOME RPM, select, and Synaptic,
    will display “alien” packages that are installed on the system.


    # Using Red Hat Package Management


    Because of the popularity of Red Hat and its Fedora variant, Red Hat''s Package
    Management tool is very common. You can launch this program from the standard
    Fedora/Red Hat desktop by selecting System Settings > Add/Remove Applications
    from the main menu. Alternatively, typing system-config-packages (or redhat-config-packages)
    on some versions of Red Hat) runs the program. The result is a display similar
    to Figure 6-1. If this window looks familiar, it may be because Fedora and Red
    Hat used it during system installation. It works the same way after installation
    as during installation.'
