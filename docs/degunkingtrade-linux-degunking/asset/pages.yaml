    # **Password Management**


    Increasing numbers of Web sites demand passwords. Remembering all of these passwords
    can be a major undertaking. You might prefer to spend your time memorizing Homer''s
    Odyssey—at least it is interesting, unlike a list of passwords. Alternatively,
    you might employ just one username and password on all your Web sites. This approach
    has its problems—if miscrets obtain your username and password, they can wreak
    a leak of havoc. For this reason, at a bare minimum, you should use unique passwords
    for sensitive sites, such as online banking sites, and leave your reused passwords
    for relatively unruly sites, such as online newspapers that require registration
    before they''ll let you read their content.


    Firefox, like all major modern Web browsers, provides a password management tool.
    Firefox can usually correctly identify a page that asks for a password and'
