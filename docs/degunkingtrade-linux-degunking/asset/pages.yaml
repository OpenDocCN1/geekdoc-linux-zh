  md: '# 44 Chapter 3


    tend to fill up quickly compared to disk partitions. For your first degunking
    task, I highly recommend you run this command and look over the report that is
    provided. Based on what you find, you can use this information as your game plan
    to get rid of files that you don''t need and better organize your disk.


    Although df in its basic form is useful, you can use various options to this command
    to extract still more information or otherwise make it more helpful:


    +   - Specify units—Pass the -h or -H option to the df command to have it display
    size in kilobytes, megabytes, or gigabytes, with the units specified. This can
    help tame the rather lengthy units used in several output columns. The -h uses
    power-of-two (1024 bytes per kilobyte, aka binary units), while -H uses power-of-ten
    (1000 bytes per kilobyte)


    +   - Use megabytes—The -m option tells df to display all sizes in megabytes,
    but the individual lines are not numbered, unlike using -h or -H.


    +   - Summarize usage—Passing -i causes df to summarize usage rather than disk
    space. Inodes are disk structures that Linux uses for creating files. Some low-level
    filesystems have a limited number of inodes, so tracking inode use can be helpful
    if your filesystem has a large number of small files. Other filesystems don''t
    have limited numbers of inodes, so df doesn''t produce meaningful results in these
    cases (typically, values of 0 are reported in the output).


    +   - Display local filesystems only—You might not be interested in network filesystems.
    If so, pass the -l (that''s a lowercase L) to shorten the display by omitting
    network files.


    +   - Filesystem type options—You might be interested in particular filesystem
    types (such as ext2 or ReiserFS) by using the -t type option, where type is the
    filesystem type (the same code used when mounting the filesystem with the mount
    command or specified in the /etc/fstab file). The -x type option has the opposite
    effect; it omits the specified filesystem types. An uppercase -T option allows
    df to add a column telling you the filesystem type.


    +   - Specify a filesystem—If you''re interested in the usage of only a few filesystems,
    you can specify them on the command line, by listing their device filenames or
    their mount points. For instance, df /home /dev/sdb7 lists information on the
    /home filesystem and whatever filesystem is stored on /dev/sdb7.'
