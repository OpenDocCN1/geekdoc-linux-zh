  md: '# 320 Appendix A


    +   11. Reboot to DOS.


    +   12. Type FDISK/MBR. This creates a standard DOS master boot record (MBR),
    which is necessary for some Linux boot loader configurations and won''t do harm
    for others. (If you''re using a third-party boot loader and you haven''t actually
    replaced your hard disk, though this step could cause problems and should be skipped.)


    +   13. Insert the kernel floppy and type A:\LOADLIN A\VMLINUZ root=/dev/hda1
    to. (Change /dev/hda1 to the Linux identifier for your root partition.)


    At this point, your system should boot and run normally. You''ll still need to
    reinstall your Grand Unified Boot Loader (GRUB) or Linux Loader (LILO) boot loader,
    though. Before proceeding, you may need to edit your GRUB or LILO configuration
    file. Specifically, your partition identifiers have changed, you must update them
    in these files, which are grub.conf or menu.lst in the /boot/grub directory for
    GRUB and /etc/lilo.conf for LILO. Typing grub-install should actually install
    GRUB in the computer''s boot sector, while typing lilo will do so for LILO.


    Depending on your reason for performing a full restore, not all of these steps
    will be necessary. For instance, you might not need to repartition the disk if
    über-gunk that triggered this procedure was purely software-related, such as severe
    filesystem corruption caused by user error or a buggy program.'
