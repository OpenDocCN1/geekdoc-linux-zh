- img_proc: true
  md: 'bypassing the dependency can make sense. Similarly, you might choose to ignore
    dependencies if you know they''re met in some other way—for instance, if you''ve
    installed a library by compiling it from source code rather than installing it
    from its own package. (Generally speaking, you''re better off using packages rather
    than compiling software yourself with most Linux distributions, but you might
    have a reason to compile a program like);


    To override a dependency, you can use advanced command-line options to the rpm
    or dpkg packages. For rpm, you can use the --nodeps option with the -i (install),
    -U (upgrade), or -e (erase) option:


    ```

    # rpm -Uvh --nodeps overdependent-1.23-4.i386

    ```


    This command installs the overdependent package even if it depends on packages
    that aren''t installed on the system. For Debian-based systems, the --ignore-depends=package
    option works in a similar way, but you must specify the name of the package with
    the option:


    ```

    # dpkg -i --ignore-depends=overdependent overdependent-1.23_4.dpkg

    ```


    Ignoring dependencies in this way can help you out of certain tight spots; however,
    if used inappropriately, this option can cause the program to fail. Perhaps a
    program won''t run at all or will fail to perform certain actions it should handle.
    Just as bad, advanced package managers as Synaptic are likely to throw a fit when
    they find their systems are “contaminated” in this way. The package managers may
    refuse to do anything until the offending program is removed or its dependencies
    are met. Even if you''re willing to live with such unmet dependencies, future
    upgrades of it or other programs may fail because possible, you should play within
    the rules of the package management system, rather than try to work around those
    rules.


    # Summing Up: Removing Package Gunk


    Package gunk comes in two forms: unused packages and old packages. Unused packages
    consume disk space, pose a security risk, and can cause headaches down the line
    because of their dependencies. Old packages can cause problems because of their
    bugs (particularly their security bugs) and dependency problems. You can deal
    with both types of gunk with the help of Linux’s package management systems and
    particularly advanced package browsers like Synaptic and Red Hat Package Management.
    These tools help you add, remove, and upgrade software, keeping your system slim
    and up-to-date.'
