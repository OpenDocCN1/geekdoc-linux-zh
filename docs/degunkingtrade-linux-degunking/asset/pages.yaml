- img_proc: true
  md: 'on that system will take up disk space, consume RAM, and (worst of all) pose
    a security risk. Every running server program is a potential door into your computer.
    A bug or misconfiguration could give an intruder a wedge that might be used to
    change critical configuration files, granting the outsider partial or full control
    of your system. For this reason, you should be careful about running servers unnecessarily
    and take steps to hunt down and uninstall all that you don''t need.


    Removing unnecessary servers is really a special case of removing unnecessary
    software, which was described in Chapter 6,"Cleaning Up Unused Packages.” If you
    have not already read that, you should do so. In particular, you should be familiar
    with your distribution’s package management system—typically the RPM Package Manager
    (RPM) or Debian packages, but perhaps something else. You should use a package
    browser, as described in Chapter 6, to track down server packages that you don''t
    need and remove them. Beyond this, you can use special tools to track down running
    servers and remove them.


    # Tallying Your Running Servers


    Network security is important enough that you shouldn''t stop with package manager
