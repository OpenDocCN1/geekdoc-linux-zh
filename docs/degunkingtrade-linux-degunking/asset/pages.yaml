    and then typing a command to install the package. The package management keeps
    track of individual files installed with the package, thus enabling you to easily
    uninstall the package at a later date. Package management systems also track dependencies—requirements
    of one package for other packages—and inform you of if they''re unmet. For instance,
    suppose you want to install SomeWriter 2.3 but it depends on SomeLibrary 1.7,
