    These messages continue on quite a while, and most of them are highly system-specific.They
    contain information that''s helpful in diagnosing hardware problems. Some modern
    distributions replace this listing early on with a GUI that less intimidating
    to Linux newcomers but provides less useful diagnostic information.


    > TIP: If you want to see your kernel boot messages after the system has booted,
    type dmesg less at a Linux command prompt after booting. This command displays
    the boot messages and passes them through the less pager, which enables you to
    see the messages at a screen in.


    Once Linux has finished its hardware checks, it launches a program called init.
    In Linux, every program is launched by another program.The program that is launching
    is called the parent, and the launched program is called the child. As the first
    regular program (launched by the kernel itself), init is special. It launches
    additional programs in the boot process. It also “adopts” programs that become
    “orphaned” because their parents terminate before they do. In any event, init
    is controlled through the /etc/inittab file. Most Linux configuration files,/etc/inittab
    is a plain text file, so you can read it in a text editor or use less to view
    it.(Type less /etc/inittab to do so.) Its exact format is unimportant for the
    moment, but the line beginning si specifies a script that continues the boot process.Thename
    of this script varies from one distribution to another. For instance, in Fedora
    and Red Hat, it’s rc.sysinit:


    ```

    si::sysinit:/etc/rc.d/rc.sysinit

    ```


    In SuSE Linux, it’s boot:


    ```

    si::bootwait:/etc/init.d/boot

    ```'
