    # Faster Alternatives to OpenOffice.org


    OpenOffice.org is probably the most popular Linux office suite, it''s not the
    only one. Other suites, or stand-alone programs that might be components, are
    available. Most of these programs are substantially smaller than OpenOffice.org,
    which makes them preferable to systems having less memory, CPU power, or disk
    space than whatever model appeared in stores yesterday. These programs can also
    be less intimidating to users with limited needs and experience. For all of these
    reasons, you may want to look into these programs as alternatives to OpenOffice.org:


    +   KOffice—This office suite is part of KDE. It includes a word processor, a
    spreadsheet, a presentation program, a vector graphics program, a bitmap graphics
    program, and assorted other programs. For the most part, KOffice isn''t as powerful
    as OpenOffice.org, but KOffice offers more components than OpenOffice.org. You
    can learn more at http://www.koffice.org.


    +   GNOME Office—Like KDE, GNOME offers an office suite, headquartered at://www.gnome.org/gnome-office/
    This suite features the Abi Word processor, the Gnumeric spreadsheet, and the
    GNOME-DB database. These programs were not originally written as a single suite,
    so they differ from one another than the component programs in OpenOffice.org
    or KOffice do. Abi Word is notable for having an unusually complete set of import/export
    filters, although they do not go a job with Microsoft Office documents as OpenOffice.org
    Writer.


    +   Siag Office—This small office suite features the Pathetic Writer processor,
    the Siag spreadsheet, and the Egon Animation program. This suite, although small,
    some unusual features, such as a simple Web server in the spreadsheet component
    enables you to deliver the spreadsheet as a Web page. You can learn more at http://siag.nu.'
