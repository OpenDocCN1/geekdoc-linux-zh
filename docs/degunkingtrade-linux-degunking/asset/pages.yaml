    # Accounts for Servers


    Many servers require special accounts for themselves. In truth, the line between
    special system accounts and server accounts can be a fuzzy one; for instance,
    the lp and news accounts described earlier are tied intimately to servers. I described
    them as system accounts because these account names are not identical to the names
    of the server packages or protocols that they use. Most servers are named after
    their servers or protocols. Examples include ftp, sshd, gdm, xfs, named, apache,
    cyrus, postfix, and ntp. Their purpose is to provide a unique account so that
    the server can run under this identity.This practice ensures that the server cannot
    interfere with regular users or other servers or system tools in the event of
    a bug or misconfiguration.


    Most server accounts have home directories set to /dev/null or a directory associated
    with the server (such as a mail pool directory for a mail server). Because these
    accounts are not intended as user login accounts, their default shells are set
    to /dev/null,/bin/false, or some other value that won''t function as a practical
    shell. If you spot a server account that specifies a conventional shell (such
    as /bin/bash or /bin/tcsh) as the default shell, investigate further. Such a configuration
    could be a sloppy account definition on the part of the package maintainer, or
    it could be a hint that your system has been compromised.


    Most server accounts are created by the RPM Package Manager (RPM) or Debian package
    system when you install the relevant server package, although a few ones may exist
    as part of the Linux installation. One of the problems with these accounts is
