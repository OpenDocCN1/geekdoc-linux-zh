    # System Administration Accounts


    System administration accounts are those that are used or otherwise associated
    with managing the computer rather than day-to-day operations. The most important
    of these accounts is root, which has a UID of 0. In fact, any account with a UID
    of 0 is effectively the root account, whether or not it goes by name. For this
    reason, one check you should perform to verify that root is the only account with
    a UID of 0. Crackers break into a computer and add an account with a UID of 0,
    or change the UID of another account to 0, so that they can break in without actually
    using the root username or knowing its password. If you think your system has
    been compromised in this way, disconnect from the network immediately and begin
    fixing it. The safest way to proceed is to completely reinstall Linux and tighten
    security. Unfortunately, you might not know how the mistake got in, so tightening
