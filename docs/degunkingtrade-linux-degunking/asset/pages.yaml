    +   - Understand how accounts are used in Linux.

    - Know the common types of accounts and common specific accounts.

    - Create and delete accounts to suit the needs of your system, using both text-based
    and GUI tools.

    - Know why passwords are important for system security and how to create a good
    one.

    - Set passwords for your accounts using both text-based and GUI tools.'
