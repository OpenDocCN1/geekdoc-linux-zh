    # Tweaking File Browsing in GNOME


    GNOME, like all major Linux desktop environments, provides a file browser—program
    that displays files and directories in a graphical manner and enables you to copy,
    delete, rename, and otherwise manipulate files. GNOME''s file browser is called
    Nautilus, and Figure 4-1 shows one Nautilus window on the GNOME desktop.


    Nautilus provides the sorts of features that users expect in a modern OS''s file
    browser. Beyond simple file manipulation, Nautilus can provide previews of file''
    contents, display different icons for types of files, link files to applications
    so you can load a file directly into the application by doubleclicking it, and
    so on. Many of Nautilus''s features are configurable. You can change them on a
    window-by-window basis from the View menu, but to change the defaults, you must
    select Edit > Preferences.This action brings up the File Management Preferences
    dialog box shown in Figure 4-3, in which you can set several defaults:


    +   File display—The Default View item on the Views tab controls how Nautilus
    displays files—as icons or in a list view. The latter includes extra information,
    such as file types, file modification dates, and file sizes. You can control precisely
    what information you want to display from the List Columns.


    +   Arrange—The Arrange Items on the Views tab controls how Nautilus orders files.
    You can sort by name, date, by file type, and so on.


    +   Icon sizes—You can set icon sizes separately for icon and list views. The
    icon view gives you the option of compacting the layout, which reduces the spacing
    between icons. Cramming more icons into a window can be handy if you''ve got a
    small display or if you taking in as many files as possible in crowded directories,
    but it can lead to squashed-up and difficult-to-read icon lists if you go overboard.


    +   Click behaviors—The Behavior tab provides options relating to click and double-click
    behavior. You can configure Nautilus to open files when they are single- or double-clicked
    and the browser whether to open or run executable text files (such as scripts)
    when they''re clicked.'
