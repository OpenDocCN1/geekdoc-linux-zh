  md: '# Account Degunking 231


    +   * Shoulder surfing—In public and semi-public environments, would-be intruders
    lurk and watch you type your password into the computer. The defense is to be
    alert to nearby and try to hide the keyboard with your body, books, or anything
    else while you''re typing. If possible, do not use public terminals or enter your
    password when others are nearby. If you must do, change your password frequently—and
    change it from a private location.


    +   * Network sniffing—Crackers frequently install sniffers, which are programs
    that monitor network activity, in an effort to acquire passwords. Network sniffing
    is a lot like shoulder surfing in its attempt to intercept data during its normal
    transmission. The usual protection against sniffing is to use only encrypted protocols
    for exchanging passwords. For instance, use the Secure Shell (SSH) rather than
    Telnet or FTP for remote text-mode access and file transfers. Fortunately, over
    the past decade, unencrypted remote login protocols have become less common. Unfortunately,
    many Websites still transmit passwords in unencrypted format.


    +   * Identical passwords—To reduce memory load, many people employ the same password
    over and over. This practice has the downside that an intruder who discovers one
    of your passwords will be able to use it on many systems. With the proliferation
    of Web sites that require passwords, coming up with unique and good passwords
    for all can be impossible. I recommend that you use either a Web browser’s “keychain”
    feature to remember them all (which has the drawback of lots of lost passwords
    if you change browsers or lose your configuration) or use a limited number of
    low-security sites and unique passwords for your computer’s login and high-security
    Web sites.


    +   * Password cracking—As described earlier, if a miscreant can acquire your
    /etc/shadow file, the intruder might be able to crack some user passwords. Thus,
    you should protect this file carefully. This includes protecting your backups
    up this file, particularly to removable media (tapes, floppies), and so on.


    +   * Phishing—A practice that’s exploded in popularity recently is phishing,
    in which the attacker prepares a fake e-mail or Web site that lures users into
    entering sensitive information. Phishing attacks often go after credit card numbers
    rather than passwords, but some might target passwords. This practice has its
    historical roots in fake login screens for public computing terminals; an attacker
    runs a program that looks like a login screen. The program records the login and
    makes it look like the user entered a typo, when in fact the password has been
