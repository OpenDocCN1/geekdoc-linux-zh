  md: '# Improve X Performance and Appearance


    When you installed Linux, chances you set various options related to your X configuration.
    These options have implications for performance and the overall appearance of
    your system.Thus, you might want to review these settings and tweak them for your
    system. These options are the color depth of the display, the monitor''s refresh
    rate, and 3D optimizations for your video card.


    **NOTE:** Desktop environments now enable you to set the color depth and resolution
    from your configuration tools, as described in Chapter 4. Such changes affect
    just your own session, though. The method I describe here alters the defaults
    for all users and all sessions.


    # Setting the Color Depth


    Computers use numbers to describe everything, and video display colors are no
    different. Every pixel on your computer display is represented as a number, and
    these numbers have certain ranges. For instance, the computer might use numbers
    from 0 to 255 to describe colors, or 0 to 65,535. Obviously, when more numbers
    are available for representing colors, more colors will be visible. More visible
    colors result in better-looking images, particularly if you use the computer to
    edit or display photographs or run programs that use icons with many colors in
    them.


    # What Color Depths Mean


    The range of numbers available for representing colors is referred to as the color
    depth. It''s usually described as a number of bits, as in an 8-bit display or
    a 24-bit display. Each bit is a binary (base 2) digit, so an 8-bit display uses
    binary numbers that are eight digits long. This results in 28 or 256, possible
    colors. Table 12-1 summarizes the most common depth used by X.


    Table 12-1 Common Color Depths and the Number of Colors They Support


    | Depth | Number of Colors |

    | 1 | 2 |

    | 8 | 256 |

    | 15 | 32,768 |

    | 16 | 65,536 |

    | 24 | 16,777,216 |

    | 32 | 4,294,967,296 |'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# 296 Chapter 12


    Based on this information, you might think that cranking your display up to the
    maximum possible bit depth (32 in most cases) is the way to go. Unfortunately,
    a high bit depth has two problems:


    +   - Storing information requires RAM on the video card, so higher bit depth
    require more RAM.

    - Manipulating display information takes time, so higher bit depths slow down
    video displays.


    The first of these problems isn''t a big one for modern video cards. A very high-resolution
    display (1600x1200) running at 32-bit color depth requires about 7.3MB of video
    memory.Today''s color cards invariably have at least 8MB, and most ship with 32MB,
    128MB, or more. You might run into the RAM problem if you''re using a very old
    video card—say, one made before 2000 or so. If this is the case, you may need
    to reduce the bit depth in order to run at your chosen resolution or reduce the
    resolution to the chosen bit depth. If this is a problem, you should consider
    upgrading your card. Even a-$20 modern card will probably perform better than
    an antiquated one. Be sure you get a card that works with your motherboard, though;many
    modern cards require Accelerated Graphics Port (AGP) slots, which older motherboards
    lack.


    The second problem (time) is of an issue. If you want the zippiest display possible,
    you should run at the lowest color depth you can tolerate. Just how low you should
    go in this limbo, though, depends on your personal preferences and the capabilities
    of your hardware. A modern video card should be able to deliver performance that''s
    adequate for most people at 32-bit color depth. A 24-bit color depth is adequate
    for almost all tasks. The human eye has a hard time distinguishing colors beyond
    the 16 million delivered at that depth. Even 15- or 16-bit color depth is adequate
    for many purposes;Linux desktops continue to look good at these resolutions.Dropping
    below this level can cause problems, though. At 8-bit color depth, Linux will
    have to reduce the number of colors in many programs'' icons, resulting in a somewhat
    ugly look to many programs. Digitized photos will also look bad at 8-bit color
    depth. The 2-bit color depth, although supported by X, is intended mainly for
    use on very old video cards, which work only in this two-color mode. (This mode
    resembles very old monochrome Macintosh displays.)


    # Changing X Color Depth Options


    Actually setting the X color depth requires editing your X configuration file,
    xorg.conf, XF86Config, or XF86Config-4, located in /etc/X11 or /etc. Locate this
    file and look for lines that resemble the following:'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Optimizing Your X Configuration 297


    Section "Screen"

    Identifier "screen1"

    Device "devicel1"

    Monitor "monitor1"

    DefaultDepth 24


    Subsection "Display"

    Depth 24

    Modes "1280x1024" "1024x768" "800x600"

    EndSubsection


    EndSection


    This section defines both the resolution and the color depth subsections, which
    associate a set of resolutions with a given color depth. For instance, this example
    tells X that should try to use the 1280x1024, 1024x768, and 800x600 resolutions
    in that order, when told to use a 24-bit color depth. When X starts, it tries
    to use the color depth specified by the DefaultDepth line; it looks up the appropriate
    Display subsection for depth and tries to use each of the resolutions defines.


    To change the default color depth, you should change the DefaultDepth line to
    list the depth you want to use. You must also ensure that an appropriate Display
    subsection exists for that color depth. If one doesn''t exist, copy an existing
    entry (the previous default should be a good choice) and change the depth of the
    line.


    When you''re done, save your changes and log out of your X session. On most distributions,
    this restarts the X server. Some distributions provide an restart option at the
    GUI login screens, so you can try that. If you find one and don''t believe X has
    restarted, press Ctrl+Alt+Backspace; shuts down X, which should restart. As a
    last resort, rebooting the computer. When X starts up again, it should be running
    in the new color depth.


    # Setting the Resolution


    You can change the display resolution just as you can change the color depth,
    by editing the Screen section in the X configuration file, as just described.
    The difference is, instead of editing the DefaultDepth line, you edit the Modes
    line to start with your preferred video mode and list all your other acceptable'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# 298 Chapter 12


    video modes. For instance, but you suppose your desktop is too small for your
    taste; it''s set to 800x600, but you will want to use 1280x1024. Chances you''ll
    see a line like this in the Display subsection of your chosen color depth:


    Modes "800x600" "640x480"


    **NOTE:** If you''re certain that your current color depth setting lists your
    preferred resolution before the resolution you''re using, chances either your
    monitor can''t handle the higher resolution or you''ve set your monitor''s refresh
