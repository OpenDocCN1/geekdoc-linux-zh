- img_proc: true
  md: '# Improving Software Performance 171


    are served by other CUPS computers. This feature is particularly important on
    mid-sized and large networks, which are likely to have many printers, as well
    as frequent changes in printers. Configure each CUPS computer to work on the network
    and any changes will propagate automatically.


    To sum up, a modern Linux system using CUPS provides printing tools to applications
    that give them basic information on a printer''s capabilities. The application
    produces PostScript output and sends output to CUPS, which passes the PostScript
    through Ghostscript to produce data that the printer can understand. CUPS then
    sends this output to the printer, which in turn produces output.


    Unfortunately, this sequence isn''t foolproof. CUPS might try to send its output
    to the wrong printer or CUPS might not be configured to use the right driver (that
    is, CUPS might give the wrong driver information to Ghostscript). Even aside from
    the possibility of producing reams of gunky output, printing might take too long
    because of suboptimal driver options.


    # Degunking your Printer


    Now that you understand a bit about how the pieces of a Linux printing system
    fit together, it''s time to pull out the cleaning solutions and get it running
    smoothly, with no hints of gunk in the mechanism. This process begins with a tour
    of CUPS configuration tools. You can then check that you''re using the right output
    device, pick the correct driver, set the printer''s resolution and other speed-related
    options, and (if desired) enable network printing.


    > NOTE: Because CUPS dominates Linux printing, this description applies only to
    CUPS. If your system uses BSD LPD or LPRing, you might want to try upgrading to
    CUPS.


    # CUPS Configuration Tools


    Considered as a network tool, CUPS borrows heavily from the Hypertext Transfer
    Protocol (HTTP) upon which it is based. CUPS provides a Web-based configuration
    interface. In a Web browser, type http://localhost:631 to configure CUPS on the
    local computer. The result should be a list of tasks, such as Manage Printers
    and Manage Jobs. Click Manage Printers and the display should change to show all
    the currently defined printers, as shown in Figure 7-3. (If you have not yet configured
    any printers, this will be empty.)


    > NOTE: Many distributions provide their own tools for administering CUPS. For
    instance, Fedora and Red Hat provide one called Printer Configuration (aka system-config-printer).
    These tools provide options similar to those of the standard CUPS tool, but interface
    details differ.'
