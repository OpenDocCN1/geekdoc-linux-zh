  md: '# Miscellaneous Tricks for Improving a Linux GUI


    No matter what desktop environment you use, you can employ several tricks to improve
    your user experience and keep it gunk-free:


    +   Pagers—Pagers are great tools for degunking your desktop. If you want to simultaneously
    run several programs, you can run each in a separate virtual desktop or run a
    few in each desktop. For instance, you might run network-related programs in one
    virtual desktop while running a word processor and spreadsheet in another virtual
    desktop. This can help reduce screen clutter, making it easier to switch between
    programs. On the other hand, you might be tempted to start too many programs this,
    degrading performance because their needs will exceed your available RAM.


    +   Keep fonts under control—Fonts are fun to play with, and in cases having lots
    of fonts is a necessity. Unfortunately, too many fonts can cause problems. Finding
    the right font from a huge list can be difficult, and program performance can
    suffer, particularly if the program tries to view fonts. Many fonts are installed
    systemwide, as described in Chapter 12, so consult that chapter to degunk system
    fonts. You can also install fonts in your home directory, in .fonts subdirectory.
    GNOME and KDE environments provide tools to help you do so. You should be cautious
    about using this feature, and if you do it, remove any fonts that you don''t use,
    lest they become gunk.


    +   Simplify your styles—Styles, window decorations, and desktop backgrounds all
    qualify as “eye candy”—they can look good, but they don''t add anything to your
    desktop it. At best, they do no harm. At worst, they can consume resources or
    be distracting. If you''re running X at a low bit depth (16-bit or worse, 8-bit),
    elaborate styles may look awful because your display won''t support colors, so
    using a simple style may be preferable. On very old display hardware, you can
    increase your X color depth, as described in Chapter 12; however, on very old
    video hardware, this is likely to noticeably reduce the speed of the display.


    +   Don''t be afraid to experiment—You can delete your desktop environment''s
    configuration files to start over from scratch, so you shouldn''t be afraid to
    experiment with new settings. You may discover a way to improve performance or
    add some feature that you find very helpful. Of course, if you spend all your
    time experimenting, you won''t have any time left to do real work!'
  merge: -1
