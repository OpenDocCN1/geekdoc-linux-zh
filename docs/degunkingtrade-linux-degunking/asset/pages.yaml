- img_proc: true
  md: '# Network Degunking


    +   DansGuardian—This is another Squid-derived proxy filter. It is geared towards
    blocking sites with offensive content, such as porn or hate speech. The default
    settings are dealth suitable for use by a primary school, but you can change the
    defaults to be looser or more stringent. DansGuardian filters based mainly on
    the content of the pages rather than a list of specific URLs that are to be blocked.
    The main DansGuardian proxy is http://www.dansguardian.org.


    +   FilterProxy—This tool is an engine for filtering Web content in a generic
    way. It is intended mainly to strip out ads and rewrite poor HTML, but like Squid,
    it''s flexible enough to take on other duties if you''re willing to invest the
    time in figuring it. Check http://filterproxy.sourceforge.net for more information.


    +   Privoxy—This proxy server, headquartered at http://www.privoxy.org, is based
    on an older Internet Junkbuster. It is intended as a way of filtering ads (including
    pop-up ads) and cookies from your Web experience.


    Because it is intended for removing the types of Web junk that most people find
    annoying or objectionable (namely,ads and cookies),I describe Privoxy in more
    detail in the next couple of sections.You might prefer one of the other proxies,
    though DansGuardian is particularly worthy of investigation if you want a content
    filter for children. Although configuration details differ from those of Privoxy,
    using any proxy server (that is, configuring a Web browser to use it) is done
    much in the same way for any proxy server.


    # Running Privoxy


    Privoxy''s configuration file is usually /etc/privoxy/config, but this file relies
    on several others in /etc/privoxy to set most of the details—the main file just
    sets the broad options, such as the port number Privoxy uses and all the files
    it uses to store the detailed configuration. For most part, the easiest way to
    configure Privoxy is to use Privoxy itself for the job.You might want to attend
    to one task before starting Privoxy for the first time, though: Set the port it
    uses. Like all servers, a proxy server listens for connection requests on a numbered
    port. This port is set using the listen-address line:


    ```

    listen-address 127.0.0.1:8118

    ```


    This default line tells Privoxy to listen using the 127.0.0.1 IP address and port
    8118. This configuration is a good one if you want to run Privoxy for a single
    system; the 127.0.0.1 address is a loopback address, which is used only for local
    networking.Thus, although Privoxy is a server, the default configuration makes
    it available only to the computer on which it''s running.'
  merge: -1
