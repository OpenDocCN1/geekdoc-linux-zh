  md: '# Enabling Network Printing


    One of the great advantages of CUPS is that it greatly simplifies network printing.
    Rather than define every available network share on every desktop system, you
    need only configure the desktop systems to support-browsing—the CUPS feature that
    provides automatic discovery of remote CUPS printer servers. The print servers
    must also be configured to support browsing. Once this is done, changes on the
    print servers are automatically propagated to clients, so if you add or remove
    a printer, you needn''t adjust the clients. This feature is most useful on mid-sized
    and large networks, but it can be useful in small offices and even homes.


    To use CUPS browsing on a client (that is, a desktop system that you want to be
    able to access remote printers), you should edit the /etc/cups/cupsd.conf file.
    In particular, for a line that defines the Browsing value and set it to On:


    # Browsing On


    This is the default value in a CUPS installation, but some distributions set it
    to off as a security measure. If you find one instance of this, continue searching
    for more; occasionally, it''s set one way in part of the file then overridden
    later. You should delete or comment out all one instance of this option. A few
    other options can affect the browsing process as:


    ```

    BrowseProtocols cups

    BrowseOrder Deny,Allow

    BrowseAllow from @LOCAL

    ```


    Chances you won''t need to adjust any of these options. The first specifies that
    CUPS is to use its standard browsing protocol, and the second defines whether
    or deny directives are to take precedence. The BrowseAllow option is particularly
    important because it defines the networks with CUPS communicates with browsing.
    @LOCAL refers to the local network, which is usually correct for a small (or even
    mid-sized) networks. If your network spans multiple subnets, you may need to include
    several BrowseAllow directives, each specifying a different subnet. (If this last
    sentence sounds like Greek to you, it probably means that you don''t need to worry
    about it.)


    On the CUPS server (that is, the computer to which the printer is actually connected),
    you should set the Browsing On parameter, as just described. In addition, you
    should set the BrowseAddress option:'
