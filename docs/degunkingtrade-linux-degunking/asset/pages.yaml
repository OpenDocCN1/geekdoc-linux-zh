- img_proc: true
  md: '# Managing Processes 201


    Various GUI tools can be used to terminate unwanted processes. Some of these,
    as the KDE Process Monitor (KPM), are basically GUI versions of top and work in
    a similar way, but via a point-and-click interface. One other tool deserves special
    mention, though: xkill is a part of the X server, and it''s used to terminate
    a single X window. In a GUI command prompt window, type xkill. A message appears
    in your shell:


    Select the window client you wish to kill with button L1....


    The mouse cursor changes appearance, and when you left-click on a window, terminating
    the process that it controls. Using xkill can be particularly handy if you can
    see a window that''s not responding and want to kill it. You don''t use top, or
    any other tool to locate the process. Just type xkill and click in the target
    window.


    # Using the kill and killall Commands


    Although you can use top or other utilities to kill processes, the most basic
    way to accomplish this goal is to use a utility called kill. You optionally pass
    kill a signal by name or number by preceding that name or number with a dash (-)
    or -s (If you omit the signal name or number, kill sends a TERM signal). You also
    pass the PID of the process to which you want to send the signal. For instance,
    suppose you''ve identified a process with PID 2872 that is misbehaving. You decide
    to terminate it with a TERM signal. Any of the following commands will do the
    job:


    ```

    $ kill 2872

    $ kill -15 2872

    $ kill -s 15 2872

    $ kill -TERM 2872

    $ kill -s TERM 2872

    ```


    If this doesn''t work, you can bring out the industrial-strength cleaner and use
    a KILL signal (signal 9) instead of TERM (signal 15); just make the appropriate
    substitution in any of the last four commands.


    Of course, to use kill in this way, you must first identify the PID of the process
    you want to terminate. You can do this by using ps or top, as described earlier
    in this chapter. If you''re certain that only one instance of a program is running,
    or if you want to kill all running copies of a program, you can use killall instead
    of kill. This program works much like kill, but it takes a process'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'name rather than a PID. For instance, if the program you want to terminate
    and

    bedge buggy, you could kill it with a KILL signal like this:


    ```

    $ killall -s 9 buggy

    ```


    **WARNING! Some Unix-like O5s have a killall program that works differently.

    Instead of killing all processes of a given name, these killall utilities kill
    all running

    processes, effectively shutting down the system. If you''re using an unfamiliar
    system,

    you should verify what killall does before using it. Try typing killall to read
    its

    main page.


    As with terminating processes with top, you can use both kill and killall as

    an ordinary user to kill the processes you own—that is, those that you''ve started

    as user. You cannot kill other users'' processes or system processes, though.

    For instance, an ordinary user cannot terminate most servers in this way. To do
    so,

    you''ll need to run kill or killall as root. The superuser can terminate any

    user''s processes using these utilities.


    # # Adjust Process Priority


    Killing gunky processes is often helpful or even necessary for keeping your

    system running smoothly; however, it''s a rather radical action. Frequently, less

    extreme measures will work well, particularly when the problem is a process

    consuming too much CPU. In such cases, reducing a process''s priority

    can work wonders. Doing so requires knowing a bit about process priorities,

    so I begin there. You may want to identify a process''s priority, so that

    topic is next. Actually adjusting a priority can be done in two ways: starting

    a program with a non-standard priority or changing the priority of a running

    process.


    # # What Is a Process Priority?


    As already described, the Linux kernel is in charge of doling out CPU time to

    al processes. When there''s not enough CPU time to go around (that is,

    t load average climbs above 1.0), Linux must ration CPU time. A process

    prior is a number between -20 and +19 that represents the importance of

    tprocess. The default priority if you don''t specify otherwise is 0. Confusing,

    negative numbers correspond to processes with high priority, whereas

    numbers represent processes with low priority. For instance, if supercrunch

    running with a priority of -10 and megaguzzle has a priority of +10, supercrunch

    wil get more CPU time than megaguzzle, assuming both are requesting

    percent of the available CPU time.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Managing Processes 203


    The kernel doesn''t give processes with higher priorities (that is, lower priority
    numbers) absolute precedence over those with lower priorities. For instance, in
    the previous example, megaguzzle will get some CPU time; supercrunch won''t get
    it. The priority numbers do influence how much CPU time each process will get.
    For keeping supercrunch at a priority of -10, changing megaguzzle''s priority
    from 0 to +10, will reduce its CPU time, and changing its priority again to +15
    will reduce its CPU time still. The extreme values of -20 and +19 represent near
    monopolization of CPU time and defence to everything else. Chances you''ll never
    run with a priority of -20, because that would interfere too much with other processes.
    You might use +19, though. A CPU-intensive but low-priority task can benefit from
    such a setting. For instance, distributed computing programs like Folding@Home
    consume a lot of CPU time, but chances you don''t want such processes to interfere
    with your normal use of the computer.Running them with a priority of +19 means
    they''ll take very little CPU time when any other program needs it, they''ll still
    be able to use all those CPU cycles between processes to good effect.


    > **NOTE:** Programs can adjust their own process priorities downward (that is,
    to higher numbers). Some low-priority CPU-intensive programs, including Folding@Home,
    do so automatically when launched.


    # Identifying a Process''s Priority


    If a process is consuming a lot of CPU time, you may want to check its current
    priority to ascertain or not it''s actually causing problems for other processes.
    You can accomplish this goal with ps or top.


    To identify a process''s priority with ps, you must pass an additional option
    to the command: 1 (that''s a lowercase L). Typing ps i will do the job for processes
    associated with the current shell, but to see all processes and their priorities,
    you should type ps ax. Because this output will be long, you might want to pass
    it through less (as in ps i less) to peruse the contents or use grep to search
    for a specific process (as in ps ax grep xfig) to find the xfig process.


    However do it, the 1 option adds several new columns to the ps output. In this
    new output format, the PID is the third column and the priority code is in the
    sixth column labeled NI, which is for nice, the command''s used to launch a program
    with a specific priority. (If you use grep to search for a specific process, as
    suggested, the column headers will be stripped out; you''ll need to count the
    columns rather than rely on column headers.) Most programs you see in the output
    will have priority values of 0, since the default. Some higher or lower values,
    though. Typically with'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# 204 Chapter 8


    negative values (that is, high-priority processes) are important kernel or system
    processes.

    The top utility also displays process priorities in a column labeled NI. (Check
    Figure 8-3; it''s the fourth column.) Because top is designed to show just a few
    processes, you might not be able to locate a specific process—but if you''re hunting
    for misbehaving processes, the CPU hogs will float to the top of the top output,
    so this can be a way to identify CPU hogs and identify their priorities. Figure
    8-3, for instance,shows the top CPU user be FahrCore_65.exe, which is consuming
    97.4 percent of CPU time but has a priority of 19. In other words, this process
    is only consuming CPU cycles when they aren''t in demand by other processes.


    # Starting Processes with Non-Standard Priorities


    Prevention is usually better than a cure, and in that spirit, Linux provides a
    simple command to start programs with a desired priority: nice. To use this command,
    type its name, an optional priority adjustment, the name of the program you want
    to launch, and its arguments, in that order. The priority adjustment takes the
    form -n priority or -priority, where priority is the priority number from -20
    to 19. (This second form is considered obsolete and is not supported in the future.)
    If you omit the priority adjustment, the default is to use a value of 10—that
    is, to reduce the priority about halfway to the minimum. For instance, suppose
    you want to launch supercrunch with a priority of 10 and have it load the celery.sch
    file.Any of these commands will do the trick:


    ```

    $ nice supercrunch celery.sch

    $ -n 10 supercrunch celery.sch

    $ -n -10 supercrunch celery.sch

    ```


    Launching a program with reduced priority in this way can help avert problems,
    but it''s not usually necessary. Most Linux programs are well behaved and won''t
    consume CPU time that they don''t need. In fact, if you''re directly interacting
    with a program (such as a word processor, a Web browser, or a mail reader), chances
    are you want the program to have normal priority, because it will demand CPU time
    mainly in response to your own commands. If it''s given lower priority, a background
    process might demand CPU time just when you''re typing or otherwise interacting
    with the program, and it will respond sluggishly.'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'Generally speaking, nice is best applied to programs that consume CPU time
    but as tools to create MP3 or OggVor files, convert between video file formats,
    perform CPU-intensive simulations, or donate unused CPU time to your favorite
    computing project. Such programs tend to take several minutes or even hours to
    complete their work, during which you might want to use the computer for something
    else. By starting such programs using nice, you can use other programs with little
    or no CPU time at full speed; the nice programs with which you''re interacting
    with. Because programs like readers, Web browsers, and word processors consume
    very little CPU time, using nice in this way won''t greatly impact the performance
    of the programs you run with it, but it can greatly benefit other programs'' performance.


    You can also use nice to increase a program''s priority (that is, give it a negative
    value).This will give the program the authority it needs to push other processes
    around, like the proverbial 500-pound gorilla. This can be handy with certain
    tasks that are timing-critical, such as audio recording programs—if a program
    doesn''t get its slice of CPU at the right moment, the resulting audio can be
    choppy. Because of the potential for abuse of nice when used to increase priorities,
    only root may pass negative priority values to the program. If you want to run
    an ordinary user program with increased priority, you can either combine with
    nice (described earlier, in "Using Startup Scripts") or you can run the program
    normally and then increase its priority using nice, which is described next.


    Fortunately in practice it is necessary to run user programs with boosted priority.
    Modern computers are fast enough that even most time-critical tasks, such as audio
    recording, can be done at normal priority. If you encounter stuttering audio,
    dropped frames in video recording or playback, jerky game play, or similar problems
    with real-time media, though, you may want to look into this matter. Alternatively,
    you might consider shutting down or reducing the priority of any other CPU-intensive
    programs that are running.


    # Modifying a Running Process''s Priority


    Preventing process problems by careful use of nice is great in theory, but in
    practice, it''s sometimes not enough. Perhaps you didn''t realize how much CPU
    time a program would consume until it was launched, or perhaps it was launched
    by another user or by an automated script. In any event, you can modify a process''s
    priority by using the nice command. In many respects, ren works just like nice,
    it operates on processes that are already running. To use it, you type the command,
    a priority number, and parameters to identify the processes you want to modify.
    You can specify processes in one or more of three ways:'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# 206 Chapter 8


    +   By process ID—Use the -p parameter to specify a PID number, in -p 2387 to
    modify the priority of PID 2387. You can omit the -p parameter and specify a name
    alone to have the same effect.


    +   By group ID—Use the -g parameter to affect all processes associated with a
    specific group (GID), in -g 107 to change GID 107''s processes.You can find mappings
    of GIDs to group names in /etc/group.


    +   By username—The -u parameter enables you to specify usernames, as in -u sally
    to affect processes owned by sally and harry.


    You can combine multiple options. For instance, if you want to change the priority
    of all of the processes, groups, and users just described, you might type something
    like this:


    ```

    # renice 7 -p 2387 -g 107 -u sally harry

    ```


    This command changes all of the affected processes to have a priority of 7. Note
    that this example uses a hash (#) as a command prompt, indicating that it''s typed
    by root. This is because the -g and -u parameters are usable by root, but use
    by ordinary users is quite limited. The reason is that Linux''s security model
    does not permit users to modify the priority of each other processes, root being
    the only exception to this rule. After all, on a multiser system, you don''t want
    harry to reduce the priority of sally''s processes without her permission! Similarly,
    users may only decrease their own processes'' priority (that is, give higher numeric
    values); they can''t increase their processes'' priority.


    In practice and as an ordinary user, you''re likely to use renice like this:


    +   Locate the PIDs of one or more processes that are interfering with other programs
    by being CPU hogs. For instance, if you believe that hoggy is such a process,
    you might type ps ax grep hoggy to locate its PID number. Suppose you find the
    PID number is 2387.


    +   Use the PID obtained in step 1, call renice, fitting a suitable priority code.
    Typically, you''ll be able to use numbers between 1 and 19. For instance, to reduce
    a process''s priority, you might type renice -p 2387, which sets the priority
    to 10.


    At this point, the process you''ve adjusted should begin consuming less CPU time.
    If you want to increase a process''s priority, you can do so, but you''ll need
    to do the job as root. In fact, you''ll need to acquire superuser privileges to
    restore a process''s priority to its original value—as an ordinary user, you can
    only decrease processes'' priorities, even if they''ve already decreased by renice.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Summing Up: Keeping Processes in Check


    Considered as a dynamic system, a Linux computer consists of a kernel that manages
    several processes. Even a system with no user programs active is already running
    several bare Linux system includes many processes to handle logins, to manage
    printers, and so on. These programs are started through SysV startup scripts,
    and modifying which scripts run can change the character of a system—create a
    server or a desktop from a generic Linux system, for instance.

    Aside from login scripts, degunking Linux processes involves locating programs
    that should not be running or that are running poorly and dealing with them. Programs
    can run out of control by consuming too much CPU time or memory, and bringing
    them under control can involve reducing their CPU consumption or killing them.
    Tools such as top, kill, nice, and renice can help in these tasks, so understanding
    their basics is important to keeping Linux processes degunked.'
  merge: -1
  pgno: 227
