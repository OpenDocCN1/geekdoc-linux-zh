    devices that interface to the computer via a device that is supported by the kernel.
    For instance, a program Ghostscript (http://www.cs.ws.edu/~ghost/) provides printer
    drivers and the Scanner Access Now (SANE, http://www.sane-project.org/) package
    provides drivers for scanners. Printers and scanners both interface via ports
    that are managed via kernel drivers, though, as USB or parallel ports. Perhaps
    the most notable class of non-kernel drivers, though, is X video drivers. In most
