    then begins downloading files, sabotaging the system, or wreaking havoc.


    This sort of scenario, although common in movies, is less common in real life.
    Real password-based intrusions are frequently based on dictionary attacks on the
    /etc/shadow file. In this type of attack, the intruder must first obtain a copy
    of the file—perhaps it has been stolen from a successful root compromise, or perhaps
    it is pilfered in some other way, as stolen off a backup tape that was insufficiently
    secured. In any event, the intruder runs a large dictionary through the same encryption
    algorithms to encode passwords in /etc/shadow. If a word creates a match, the
    password has been found. Given the speed of modern computers, trying every word
    in English and a dozen other languages, along with common misspellings, combinations,
    and other variants, is a trivial undertaking. Sometimes the cracker will break
    into using knowledge of the victim, in the Hollywood scenario. Even this is likely
    to be denied remotely by a program, though not by manually typing a password into
    a system.


    Other password-discovery methods exist too. Some are as simple as watching somebody
    enter a password. Others involve social engineering—tricking people into revealing
    their passwords. Many of these techniques can be thwarted by a bit of care, as
    described shortly in “Protecting Passwords."


    In order to protect against both dictionary attacks and more personalized attacks,
    you should know how to select a good password. The goal is to create a password
    that''s as close as possible while being memorable. Unfortunately, these two features
    are at odds with one another—people, unlike computers, are absolutely terrible
    at remembering random strings of letters and numbers. One procedure that can help
    immensely is:


    +   1. Select a base. The base is either two short words, such as been (from bun
    and pen), or an acronym that is meaningful to you, such as yiwtd, for yesterday
    I went to the dentist. If you use an acronym, do not use one that spells out a
    word! I''ve selected six-letter bases as a subsequent step expands the length
    a bit and some systems have a maximum password length of eight characters. Modern
    Linux systems aren''t usually limited in this way, though. In practice, an eight-character
    password should be considered a minimum safe length.'
