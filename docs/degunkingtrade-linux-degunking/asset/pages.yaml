  md: '# 236 Chapter 10


    The Internet has been a major source of gunk for all operating systems (OSs).
    On a worldwide network, some people are bound to be ignorant, or malicious enough
    to cause problems for everybody. Fortunately, you can take steps to head off the
    worst of these problems. In this chapter, I''ll describe three major types of
    network gunk and the defenses you have against it: Web-based gunk, e-mail gunk,
    and network security threats. To be sure, there''s some overlap in these categories.
    Most notably, some types of Web and e-mail gunk are security threats. Although
    this chapter is by no means the final word on network security, I provide enough
    information to help you keep the most common types of network gunk from causing
    you serious problems.


    # Degunk the Web


    To many people, the World Wide Web (aka the WWW or the Web) is synonymous with
    the Internet; other protocols, as, though, those used for e-mail, remote logins,
    setting clocks, and so on, are also part of the Internet. Nonetheless, the Web
    is an important part of the Internet, and this prominence has led to several types
    of gunk that dirty the Web. Understanding these types of gunk will help you keep
    it from causing you too much. Although you can do a lot with Web browser options,
    I emphasize another tool: a Web proxy server, which is something like a filter
    to remove Web gunk before it even reaches your Web browser. Unfortunately, no
    matter what method you use to degunk the Web, some gunk is bound to get through,
    because Web gunk can be hard to differentiate from certain types of legitimate
    Web content.


    # Gunk on the Web


    The Web can be a remarkably gunk place. At its best, the Web works smoothly and
    can be a valuable source of information. At its worst, though, the Web can be
    a slimy, greasy, unpleasant realm—the very definition of gunk. In fact, Web-based
    gunk comes in many shapes and sizes, including:


    +   Poor HTML—Most documents on the Web are written in the Hypertext Markup Language
    (HTML). In theory, HTML is a cross-platform standard that enables your browser
    to read any Web page. In practice, some pages conform better to the HTML standard
    than do others, and some browsers deal with peculiar HTML better than do others.
    In practice, your best defense against sloppy HTML is to have several browsers
    on hand; if one chokes on a page, another might work properly.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '+   Buggy or malicious JavaScript or Java—JavaScript and Java are two popular
    scripting languages that are associated with the Web. The Web site can include
    JavaScript or Java code that runs on the user''s computer in order to provide
    extra functionality or offload some of the CPU requirements onto the user''s system
    from the Web server. Unfortunately, JavaScript and Java code can be buggy or worse,
    contain malicious content. You can disable your Web browser''s ability to run
    JavaScript and Java, but this will cut you off from some of the Web''s legitimate
    content as well as some of its gunk.


    +   Cookies—Some pages use cookies on your computer.These are codes that help
    the Web server tie your system to your own stored preferences for you or other
    data. Cookies can help you save preferences, shop online, and perform other tasks,
    but cookies can also be used to spy on you. They enable advertisers to track the
    commercial sites you visit, for instance. You can have your Web browser block
    some or all cookies, or you can block cookies using a Web proxy. This may degrade
    your ability to use some features that rely on cookies, though.


    +   Ads—A decade ago, the Internet was considered an advertising-free zone—a sort
    of refuge for those weary of the constant barrage of advertising. No more.Many
    Web sites today feature advertising. Some ads are fairly innocuous, but some annoying
    colors or animation. Perhaps the worst of all are the so-called pop-up and pop-under
    which display in their own windows that you must choose. Modern browsers have
    options that help by blocking pop-up and pop-under windows that you didn''t request,
    and proxy servers can help filter out more ads.


    +   Inappropriate content—If you''re a parent, you may be concerned about the
    presence of content you''d prefer your children not see on the Web. Frequently,
    this is pornography, but violent content or other types of sites might also concern
    you. Blocking such content is the job of a certain class of Web proxies, frequently
    known by the name of a specific commercial product for Windows, Net Nanny. Although
    the original Net Nanny doesn''t run on Linux, some Linux proxy servers can fill
    a similar role.


    +   Bandwidth thieves—One problem that to many of these types of gunk, and some
    other is that they chew up your network bandwidth. For instance, if a site has
    dozens of ads in the form of images, they can take a long time to download, slowing
    down your access to the information you want. Even if you''ve got a fast broadband
    connection, you might notice the slowdown. If you pay for your network connection
    by the megabyte, Web gunk can actually cost you money! Disabling some features
    (such as the automatic display of graphics) in your Web browser can help a lot.
    Web proxies can also help by blocking particular types of content.'
