  md: '# Finding Drivers for Your Hardware


    # Find Sources for Hardware Drivers


    Many hardware problems trace their way back to drivers. Thus, you must know something
    about Linux drivers when degunking your hardware for Linux. At the root of this
    knowledge is knowing where to look for drivers, in the sense of both where they
    are installed in a Linux system and where to find new drivers when you need to
    upgrade your drivers.


    Broadly speaking, driver sources fall into three categories: the Linux kernel,
    third-party kernel drivers, and drivers embedded in non-kernel software. Each
    type of driver can be sought out in its own way. (The upcoming section “Install
    Drivers” covers getting your driver working once you’ve found it.)


    # The Linux Kernel


    The primary source of Linux drivers is the Linux kernel. The kernel is the heart
    of any OS. It does out CPU time and memory to programs, manages filesystems, controls
    network access, and serves as an interface between the hardware and non-kernel
    software. It’s last role that drivers fail; hence, the kernel is the source of
    most drivers. (Some drivers are in software components that can talk more to hardware
    than most software can or talk to hardware that’s interfaced directly to the computer
    via other hardware that the kernel controls.)


    # Sources of Kernel Drivers


    Linux’s open nature makes for an unusual structure to its kernel. Specifically,
    early versions of Linux required all drivers to be compiled into the main kernel
    file. This meant that a Linux kernel was typically customized for the hardware
    on which it ran—if you needed a driver for a specific SCSI adapter, you compiled
    that into the kernel. By contrast, other OSs have the main kernel file load a
    separate driver file provided by the hardware manufacturer. All modern versions
    of Linux also support this separate-file module for drivers, but you can usually
    compile a driver directly into the main kernel file if you like. Doing so can
    simplify configuration slightly because you don’t need to tell the kernel to look
    for a kernel module (that is, a separate driver file). Compiling the driver into
    the kernel also greatly simplifies the boot process when the driver handles the
    boot device (that is, your hard disk controller). If the kernel needs to load
    a separate module, it needs to be able to access the module file, but if that’s
    on the device that the driver controls, a chicken-and-egg problem emerges. (The
    typical solution is to put the driver module in a temporary RAM disk, which is
    an area of RAM that Linux can'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# 272 Chapter 11


    treat like a disk drive and the boot loader can load into memory from the disk
    using BIOS calls).


    If you''ve found that a problem is caused by a bug in a kernel driver, you must
    upgrade to fix the problem. (Sometimes downgrading the driver to an older version
    will also fix the problem.) Broadly speaking, you have three choices for how to
    proceed:


    +   Upgrade your distribution''s kernel package. Major Linux distributions provide
    their kernels in packages, just like other software packages. You can use the
    package management tools described in Chapter 6, "Cleaning Out Used Packages,"
    to upgrade your distribution-provided kernel package. This approach tends to be
    fairly straightforward if you''re familiar with Linux management tools, but kernel
    upgrades often take some time to filter down through distributions, so you might
    have to wait a bit to fix them.


    +   Locate a package for the problem driver. Occasional, third parties release
    driver module upgrades for buggy or missing drivers in popular distributions.
    Such packages are usually intended to fill gaps in the driver coverage provided
    by the distribution, though rather than fix buggy drivers.


    +   Recompile the kernel. You can download the original kernel source, compile
    it yourself, and use the kernel you compile locally. This approach provides the
    greatest flexibility but, like any-it-yourself solution, requires the greatest
    effort.


    # Configuring the Kernel


    If you decide to recompile the kernel yourself, you should know how to figure
    it. This information can also be handy in understanding kernel modules generally,
    so I provide a brief outline of the procedure.


    First, you must obtain a copy of the kernel source code. One reliable site for
    this is http://www.kernel.org. Locate and download a complete Linux kernel tarball—a
    file with the name of form linux-version.tar.gz or linux-version.tar.bz, where
    version is the version number. Files of the form patch-version.tar.gz or patch-version.tar.bz
    are useless unless you have the immediately preceding version; these files provide
    just the changes and so are much smaller to distribute to those who keep up with
    kernels in source code.'
