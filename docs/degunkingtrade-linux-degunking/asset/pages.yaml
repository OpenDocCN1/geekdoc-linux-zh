    # Java and JavaScript Issues


    Sun''s Java (http://www.sun.com/software/learnabout/java/) is a popular programming
    language. One of Java''s big draws is that it provides explicitly cross-platform
    GUI tools. In most programming languages, creating a GUI application requires
    either platform-specific tools or a cross-platform set of development libraries.
    In Java, that''s all handled for the programmer; a call to a dialog box will work
    in Windows, Linux, or Mac OS. Furthermore, Java is a scripting language, meaning
    that Java programs will run on any supported computer, without any need to recompile
    the software. (Recompiling can be a major hassle, particularly on cross-platform
    applications.)


    JavaScript is similar to Java in that it''s a cross-platform scripting tool. The
    two have a few surface similarities, but they aren''t closely related, despite
    the similarity in their names.


    In any event, both Java and JavaScript are appealing tools for Web designers who
    want to create complex interactive Web pages. For instance, suppose you want your
    Web page to compute a car''s mileage given given drives and number of gallons
    consumed. You might write a Java or JavaScript applet to the job and deliver it
    to the Web browser. Your site''s users could then enter all the numbers they want
    and not consume your Web server''s CPU time and bandwidth doing this computation.


    Unfortunately, these features also make Java and JavaScript at least potentially
    threatening to users. Suppose you''re a radical opponent of the word grime. You
    might think it should be banned a bogus Web site (even with unrelated content)
    that delivers a Java or JavaScript applet that scours users'' computers of the
    worst grime. Any document that contains this word is deleted. This might be great
    for radical anti-grime crusaders, but for the rest of us, it''s an invasion. This
    is a fairly simple (and silly) example, but you get the idea: By running Java
    or JavaScript programs via your Web browser, you''re giving partial control of
    your computer to whatever happens to have written a Web page.


    Both Java and JavaScript provide safeguards against some of the worst possible
    abuses, and Linux''s multiuser nature means that that only so much damage can
    be done if you''re sensible and don''t run a Web browser as root. What''s more,
    malicious Java and JavaScript code is likely (but not certain) to be targeted
    by Windows users, so you''re safer in this respect if you''re running Linux if'
