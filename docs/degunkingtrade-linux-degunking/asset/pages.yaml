    To change the configuration to support a higher resolution, or change your desired
    resolution, but it comes before any other resolutions on the display list:


    Modes "1280x1024" "800x600" "640x480"


    Including lower resolutions on this list isn''t harmful, and in fact it can be
    helpful. Simultaneously pressing the Ctrl key, the Alt key, and the + or – keys
    on the numeric keypad cycles through the various resolutions. In lower resolutions,
    X presents a virtual desktop—a lower-resolution “window” on a larger desktop.
    You can move it around by moving the mouse cursor to the edge of the physical
    screen, wherein the screen scrolls. This feature can be handy to get a close-look
    up at something that''s on the screen.


    # GunkBuster Notebook: Setting the Resolution for LCDs


    In 2004, liquid crystal (LCD) monitors began to outsell traditional cathode-ray
    tube (CRT) monitors. LCDs have also long the dominant display type on laptop computers.
    LCDs are smaller, lighter, more efficient, and more expensive than their CRT counterparts.
    LCDs do have an unusual drawback: They have a fixed number of pixels. For instance,
    most 17-inch LCD monitors have 1,280 pixels across and 1,024 pixels down. This
    feature means that they can handle 1280x1024 displays well, but when the video
    card outputs most other resolutions, such as 1024x768, the monitor will either
    display a smaller image or create an ugly display by interpolating values.


    For best results, you should ensure that X is running in the appropriate resolution
    for your LCD monitor. Consult your monitor’s manual to determine what this resolution
    is, if you don''t know.


    ![](img/b3875bade729a8fa10cbc3a09faabd77_318_0.png)'
