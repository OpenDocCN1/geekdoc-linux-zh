  md: '# Tracking Disk Usage in Specific Directories


    Although df is a great tool for tracking overall disk use, another tool is needed
    to find where space is consumed within an individual partition.This tool is known
    as du, for disk usage. It''s most used by specifying options and one or more files
    or directories. Here''s an example:


    ```

    $ du --summarize reports

    35240 reports

    725 budget

    ```


    The result is a list of the disk space consumed in blocks (each block is typically
    1024 bytes).These values are the totals for all of the files or directories specified,
    including all subdirectories. For instance, if reports in the preceding example
    were a directory with several subdirectories, the reported disk use of 35,240KB
    for this directory contains the contents of its subdirectories.


    Obviously, du has great utility in tracking your disk use. By providing information
    how much disk space is consumed by each subdirectory you specify, you can locate
    where you''re using the most disk space, which in will help you to large files
    you may have forgotten, large caches of unnecessary backup files, or other sources
    of gunk you may be able to clear.


    The preceding example shows the use of an option (--summarize) with du. Several
    options can help you fine-tune du''s operation to best suit your needs:


    +   **Display file information**Ordinarily, du doesn''t report on individual files
    unless you specify them on the command line.You can pass the -a or all to have
    the utility report on file sizes. This tends to create very long output lists,
    and you can obtain the information from is.


    +   **Display summary**The default behavior for du is to report on each subdirectory
    within a directory tree. For instance, if the directory reports has three subdirectories,
    and if you type reports, you will get back out with information on four directories:
    reports and each of its three subdirectories. -s and --summarize options both
    trim this down so that the output information only on the directories you specify
    by the command line.


    +   **Display to specified depth**Ordinarily, du follows all subdirectories however
    far they extend.The --max-depth=n option causes the program to stop after going
    n levels deep. The reported totals include the contents of all the subdirectories,
    but the program doesn''t report all the details. Using --max-depth=0 is equivalent
    to --summarize.'
