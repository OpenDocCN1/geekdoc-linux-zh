    # Finding Drivers for Your Hardware


    Degunking Checklist:


    +   - Identify the source of hardware-related problems.

    - Know where to go to find drivers for your hardware.

    - Know how to install drivers in the Linux kernel and in other programs that use
    drivers.

    - Know how to replace hardware—when it''s time to give up trying to get something
    to work, and how to identify a Linux-compatible replacement.'
