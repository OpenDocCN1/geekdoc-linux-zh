- img_proc: true
  md: '# Finding Memory Hogs


    Sometimes programs misbehave by consuming a lot of memory. This can be because
    the programs are designed in a way that they necessarily chew up memory, because
    they''ve been asked to perform some task that requires lots of memory, or because
    they''ve got bugs that cause them to request too much memory. In any event, the
    result is that other programs don''t have enough memory. Sometimes the memory
    hog program itself can''t get enough memory for its needs.


    Linux, like all modern desktop OSs, supports swap space. Swap space increases
    flexibility, but it''s not as fast as RAM, when the system digs into swap space
    to meet its memory needs, the system slows down. In extreme cases, the system
    will spend most of its time moving between swap space and RAM, a condition that
    is known as thrashing. When this happens because a program is pigging out at the
    memory buffer, you ought attempt to shut down the offending program. Of course,
    you must be able to identify that program first.


    Once again, top is a great tool for the job. When it''s first launched, top sorts
    entries by CPU time. To change it by sort memory used, follow these steps:


    +   1. Type F (that''s an uppercase letter F; a lowercase f has another effect).
    The result is a screen that summarizes the fields on which top can sort.

    2. Type the letter corresponding to the field you want to sort top''s output.
    A good option is n, for the %MEM column—that is, the percentage of memory used.
    Other memory options exist, but they measure certain types of memory use, such
    as the data size or the amount of swap space used.

    3. Press the Enter key. The result should be the main top display, as shown in
    Figure 8-3, but this display will be sorted by the memory option you selected.


    With spotting CPU hogs, you can look for processes that consume too much memory
    by going down the list that top provides. Is any process consuming far more memory
    than others? Is that value growing? (If so, this indicates a wanting demand for
    memory, either because of a bug or of runaway data processing.) If you don''t
    know precisely what a suspicious process is, you might want to research further
    by looking for a man page entry, if your system is thrashing badly, the time needed
    to do this may be inordinate—you might prefer to skip straight to the part where
    you terminate the offending process.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Finding Processes by Name


    Sometimes a process doesn''t appear at the top of the top listing but you still
    want to terminate it. If you know the name of the process, one way to find it
    is to use the ps utility, which creates a list of processes. Used without any
    options, the list is likely to be short because it includes only those processes
    associated with the shell which you ran ps:


    ```

    ps

    PID TTY           TIME CMD

    9066 pts/20    00:00:00 bash

    8468 pts/20    00:00:01 nedit

    28641 pts/20   00:00:01 xfig

    29024 pts/20   00:00:00 xv

    29079 pts/20   00:00:00 ps

    ```


    This listing includes some of the information as a top listing—in fact, top is
    something like a specialized and real-time version of ps. You might find the process
    you want by looking at a plain ps listing; however, ps provides a huge number
    of options that expand the number of processes it shows, expand the information
    provided, or both. A pair of options I find particularly hard are ax and as combination
    lists all the processes running on the computer and also increases the number
    of fields in the output. Because a typical Linux system is likely to have dozens
    or hundreds of running processes, the output of this command will probably be
    overkill. The answer is to use a Linux pipe (described in Chapter 3) to pass the
    result through grep, which is a program that searches its input for a string that
    you specify:


    ```

    ps ax i grep xfig

    28641 pts/20  S    0:01 xfig fig08-01.fig

    29389 pts/26  S+   0:00 grep xfig

    ```


    This example searches for a process called xfig, or any process that includes
    this string. In example, two processes are found: the target xfig process and
    the grep command to search for xfig. As with the earlier example of ps use, the
    PID number is in the first column—it''s 28641 for the target xfig process. If
    it had become unresponsive or was consuming too much CPU time, you''d need this
    number to kill the process or reduce its priority, as described in “Kill Stray
    Processes” and “Adjust Process Priorities.”'
  merge: -1
