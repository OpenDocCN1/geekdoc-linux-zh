    # ## Enabling 3D Optimizations


    X was designed as a two-dimensional (2D) display system; it displays text, dialog
    boxes, and so on in a basically 2D way on a 2D monitor. Although windows can be
    displayed "in front of" other windows, this effect isn''t really a full three-dimensional
    (3D) effect.


    A few programs, though, make use of 3D display features. The most common example
    is games, particularly those that present a first-person perspective on a 3D game
    environment. Of course, the display itself isn''t truly 3D, but the game creates
    an illusion of a 3D world, much as a photograph or movie presents a 2D projection
    of a 3D world.


    Unfortunately, the computations involved in creating a realistic 3D display are
    quite intense. The fastest of CPUs can be brought to their knees to perform all
    the subtle computations necessary to create a convincing 3D video. Thus, card
    manufacturers have developed 3D video cards. These cards include graphics processing
    units (GPUs) that are designed specifically to perform the specialized computations
    to create a 2D projection of a 3D world.Theresult be greatly improved performance
    and graphics image quality in first-person games and other applications that use
    3D effects. The problem with this hardware is that it requires special software,
    and that software isn''t available for all video cards under Linux. Cards that
    lack 3D acceleration supports (which are extremely rare today) or for Linux drivers
    aren''t available can still run 3D programs, but the performance of these programs
    will be quite poor compared to the same programs on video cards with full 3D support.


    The main 3D support relies on the OpenGL specification, which is a platform-independent
    3D programming interface (API). In theory, a program written to use OpenGL can
    be easily ported to other platforms that support OpenGL, such as Windows. OpenGL
    is an API specification, not a program. Thus, to use OpenGL, you need software
    that implements it. This software ships as part of XFree864.x and X.org-X11, but
    it may not be loaded by default. At a minimum, you should check the Module section
    of your configuration file and verify that it contains the following line:'
