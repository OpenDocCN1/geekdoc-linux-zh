    # Recompiling a Kernel


    The bulk of the work in installing a new driver that''s part of the standard Linux
    kernel is in reconfiguring the kernel, as described earlier, in “The Linux Kernel.”
    Once that''s done, you can recompile your kernel by typing a single command:`make`.
    You must type this command in the main kernel source directory (typically `/usr/src/linux`).You
    can compile the kernel as an ordinary user, but only if that user uses all the
    files and directories in the kernel source tree.


    The kernel compilation process will take anywhere from a few minutes to an hour,
    depending on the options you''ve selected and your computer''s speed. During this
    time, you should see summary lines appear on your screen as the kernel compilation
    process proceeds. When it''s done, you''ll find a new kernel, called bzImage,
    in the `/usr/src/linux/arch/i386/boot/` directory.


    > **NOTE:** On non-x86 systems, the kernel name may be `vmlin`, `vmlinuz`, or
    something else, and the exact location will be different—in particular, i386 will
    be replaced by a code for the system''s CPU, such as `ppc` for Power systems.
    Some architectures also use additional subdirectories, so you may need to go digging
    a bit to find the kernel file.


    You should copy your new kernel file to the `/boot` directory,typically with a
    name to distinguish it from other kernels. Appending the kernel version number
    usually works well. For instance, you might type `cp arch/i386/boot/bzimage-2.6.10`
    from the `/usr/src/linux` directory to copy a 2.6.10 kernel to `/boot`. You must
    be to execute this command, even if you compiled the kernel as an ordinary user.
    This command moves the kernel to a standard location, but it doesn''t make the
    kernel usable. For that, you must install the kernel modules and prepare your
    system to use the new kernel.


    **WARNING! Do not overwrite any existing kernel files with your new kernel! If
    you do so, and if you erred in your kernel configuration, the result will be that
    you''ll unable to boot your computer. Although it''s possible to recover from
    this error, doing so requires using an emergency Linux boot medium to reinstall
    a known good kernel and reconfigure your system to use it. This is rather advanced
    and messy degunking task, so you''re better off not risking to do it.'
