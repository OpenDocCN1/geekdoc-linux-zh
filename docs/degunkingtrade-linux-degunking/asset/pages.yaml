  md: '# Why Keep Software Up-to-Date?


    Chances your Linux system is working reasonably well. Thus, you might adopt an
    “if it broke, don''t fix it” attitude to system updates. In truth, there is merit
    to such an attitude—software updates can sometimes cause more problems than they
    solve. After all, modern OSs, Linux included, are something like houses of cards,
    with each card being a software package. By upgrading one package (particularly
    one near the base of the house), you run the risk of having everything tumble
    down you.


    Fortunately, such disasters are rare, and when problems do occur, you can usually
    fix them with a bit of troubleshooting effort. There’s also something to say for
    upgrading your system, even if it seems to be working correctly. Such upgrades
    have several important effects:


    +   **Security updates**—The most important reason to keep your software-to-date
    is to receive security updates. These are fixes to bugs that can give outsiders
    access to your computer, give local root privileges they shouldn''t have, or otherwise
    compromise the integrity of your computer.


    +   **Non-security bug fixes**—Other bugs aren''t security issues, although some
    can be serious. Most bugs are likely to affect just one program, but bugs in popular
    libraries can affect many, and kernel bugs could even crash the computer. Some
    bugs are sporadic in nature, so you might not have encountered them—yet. If you
    don''t upgrade to a fixed package, you might run into the problem tomorrow.


    +   **Software improvements**—Linux software is constantly being improved. While
    your system is working to your satisfaction right now, an improvement might be
    available that would make it work even better. What’s more, chances are you some
    cause for complaint about your system. Perhaps a program seems a bit sluggish
    or another lacks a feature you really need. Occasionally an update will make the
    program work more to your liking.


    +   **Dependencies**—Old software can keep you from installing new software because
    of conflicting dependencies. Thus, upgrading your existing software can simplify
    the process of adding software to your system.


    +   **New software**—Although new software won''t be installed automatically unless
    it''s a dependency of an updated package, new programs do become available from
    time to time. If you keep your package database up-to-date, such programs might
    appear as options (particularly if you use Synaptic or another package tool that
    keeps a local database of available software). You might not notice such options
    immediately, but if you peruse the options or otherwise monitor Linux software
    developments, you would find them and be able to install them as you see fit.'
