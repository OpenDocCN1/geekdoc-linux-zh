  md: '# Managing Processes 187


    No matter its name, the system initialization script ends up performing a number
    of important startup tasks, including running a startup scripts—scripts that launch
    specific programs or perform specific tasks. In many distributions, these startup
    scripts take the form of System V (SysV for short) startup scripts, which are
    located in a directory called /etc/rc.d/, /etc/rc.d/init.d/, or /etc/init.d. Subdirectories
    in these directories have files of the form rc?, where n is a number from 0 to
    6. Numbers refer to runlevels of programs that should be run. Runlevels 0, 1,
    and 6 are special, but intervening runlevels can define sets of programs that
    can serve particular functions, such as runlevels with and without active networking
    features. The /etc/inittab file defines the runlevel that Linux uses when it first
    boots:


    ```

    id:5:initdefault:

    ```


    This line sets the default runlevel to 5, which is typical. Many distributions
    define runlevel 3 as a basic text-mode boot and runlevel 5 as a boot to a GUI
    login system. (Debian and Gentoo are exceptions to this rule; they attempt to
    run X at all runlevels between 2 and 5 but fall back to a text-mode login if X
    won''t.)


    Mainstream Linux distributions include literally dozens of SysV startup scripts.
    These scripts are very useful in controlling what software runs by default on
    a Linux system—by reconfiguring these scripts, you can shut down unnecessary software,
    start software that''s not running by default but should be, and otherwise modify
    the system.


    > **NOTE:** Slackware is the only mainstream distribution that does not use SysV
    startup scripts. Instead, each runlevel provides one script to start all of the
    programs that should be active in that runlevel.


    Once a system is running, of course, users can launch their own processes. This
    happens only through user logins, which are mediated by local text-mode, local
    GUI, or remote login programs. The main text-mode login program (appropriately
    enough login) is launched directly by init. Some distributions also use init to
    launch a GUI login process, but others use SysV startup scripts to handle this
    task. Most network login protocols are launched through SysV startup scripts or
    through a *super server*, which is a server that stands in other servers. (Super
    servers are launched through guessed it—SysV startup scripts.) Thus, user processes,
    like everything else, trace their way back to init.'
