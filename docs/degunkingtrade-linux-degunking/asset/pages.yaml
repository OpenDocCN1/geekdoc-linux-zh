    # # Summing Up: Keeping Accounts Clean and Secure


    Linux accounts are vital for the proper functioning of the OS. Simultaneously,
    though, accounts can become a source of gunk. Most obviously, unnecessary accounts
    can clutter the system. These accounts can become potential aids to security breaches,
    and particularly for user accounts, they may chew up disk space. Thus, you should
    review your accounts and delete those that aren''t necessary. Another account-related
    issue is passwords. Bad passwords are gunk because they can be easily broken.
    Sloppy password handling can also lead to the password, and thus the account,
    being compromised. Knowing how to create a good password and how to protect it
    once it''s created can help you keep your system secure.'
