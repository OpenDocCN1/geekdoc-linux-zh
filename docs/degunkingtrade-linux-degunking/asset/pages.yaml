    # Organizing Your Files


    Now that you''ve learned to locate and identify files, it''s time to get them
    better organized. If you''re starting at a home directory with lots of files and
    no subdirectories, or if you''re finding your directory structure to be awkward,
    one way to approach the problem is to organize (or reorganize) your directory
    tree. Another approach, deleting files, is covered in the next section, "When
    to Delete Unused Files."These two approaches are complementary; you shouldn''t
    try to use one of them.


    Organizing your files into subdirectories is easy, but it does require you to
    create subdirectories. From the command line, this can be done with the mkdir
    command, which creates (makes) a directory, hence the shortened name:


    ```

    $ mkdir newdir

    ```


    This example creates a directory called newdir. You can accomplish the same thing
    in a GUI file manager by selecting an option from the file manager''s menu. Look
    for Edit > Create New > Folder or something similar. (The precise option name
    varies from one file manager to another.)


