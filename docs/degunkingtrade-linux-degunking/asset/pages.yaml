    file is a very useful utility,particularly when you''re confronted with a moderately
    uncommon file type. It can often help you narrow down the options and at least
    point towards a class of programs that might be able to read the file.


    # Finding Clauses about Your Files Using strings


    Sometimes, you can''t figure out what a file is all about by examining its extension
    or using file to determine the file type. Use the strings utility to do a little
    more detective work. This program scans a binary file and extracts ASCII strings
    from it. The strings program displays these strings for your perusal. The result
    can often help you identify a file. For instance, you might notice text that looks
    like a letter to a friend, which would point to the file being a word processing
