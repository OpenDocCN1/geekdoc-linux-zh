    # GunkBuster’s Notebook: NAT Appliances


    If you’re running a computer or small network to the Internet via a broadband
    link (such as a DSL or cable modem), you may want to look into a standalone network
    address translation (NAT) appliance, often referred to as a broadband router or
    broadband firewall. These devices connect to your ISP just as your computer normally
    does and use NAT to enable all of your computers to connect through the device.
    NAT is a technique that enables one computer to "masquerade" as many. For instance,
    when a NAT-connected computer intercepts the outgoing connection request and changes
    the IP address in the outgoing packets. When a response comes, the NAT device
    reverses the change. Thus, the server not the client knows that a change has occurred.


    This extra step has certain advantages. For one thing, the NAT computer consumes
    just one IP address on the Internet at large, but it can serve theoretically huge
    numbers of computers—certainly enough for a typical home or small business network
    with a dozen or so systems. Another advantage of NAT is that it provides security
    similar to that of a firewall. (Although these devices are often marketed as firewalls,
    they may not technically qualify as such, depending on the definition you’re using.)
    Specifically, incoming requests from the Internet terminate at the NAT appliance,
    so a would-be cracker cannot connect to any unprotected ports on your local computers
    without first breaching the NAT router’s security.


    NAT routers do have their own drawbacks, though. Although NAT doesn’t interfere
    with most protocols, it does slow down or completely block others. Some online
    games and security


