  md: 'you download it, thus saving you the connect time. Mailfilter is a simple matcher
    and so less effective and harder to maintain more sophisticated tools like Bogfilter
    and SpamAssassin, but it can be particularly hard if you''ve got a dial-up network
    connection or when a new worm ranges out of control, filling your in-box with
    hundreds of megabytes of garbage each day. Check http://mailfilter.sourceforge.org
    for more information.


    +   * SpamAssassin—This program, headquartered at http://spamassassin.apache.org/—combines
    several spam-fighting techniques in a single program, including simple pattern
    matches, IP-based tests, and statistical tests. For this reason, SpamAssassin
    is very large and complex, but basic configuration is relatively straightforward.
    Many Linux mail readers interface with SpamAssassin for spam-fighting duties.


    The world is constantly changing, and new spam-fighting techniques are always
    under development. Furthermore, established programs are updated frequently because
    spam is a moving target. Any spam-fighting technique starts to have a significant
    impact, spammers adapt and find ways to structure their messages to thwart the
    anti-spam tools.(This is why so many people use bizarre spellings or punctuation
    inside—these measures are attempts to work around pattern matches.) For these
    reasons, you should be sure to update your anti-spam tools frequently, and periodically
    review the available tools. Something new may be available and do a better job
    than an old standby.


    # Evolution to Block E-Mail Gunk


    Most modern e-mail readers provide the means to filter. In Linux, this is usually
    done by linking the mail reader to an external program, such as Bogfilter or SpamAssassin.
    Specifically, you create a filter that passes all messages through the external
    program, which adds a special flag to the message indicating whether or not it
    is spam or returns a value to the calling program that conveys the same information.
    The mail reader can then look for this flag, and if it present, shunt the mail
    into a separate folder or discard outright.


    > WARNING! Completely discarding spam on an automatic basis is a risky proposition.
    Because spam filters occasionally produce false alarms, chances you''ll throw
    away at least some legitimate e-mail if you do this. If you place suspected spam
    in a separate mail folder, you can periodically review it or simply dive into
    it if you suspect a message may have been misclassified.


