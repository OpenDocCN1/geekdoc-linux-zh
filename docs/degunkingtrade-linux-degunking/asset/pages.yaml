    # Performing a Backup


    The tar program accepts a large number of functions and options. You specify one
    function and may specify an arbitrary number of options. The functions tell tar
    what type of action it''s to perform, such as create a tar file, extract data
    from a tar file, or list tar file''s contents. The options modify how it''s to
    perform these actions, such as telling tar whether or not to call an external
    compression program or display a listing of files as it''s backing up.


    A typical backup command looks like this:


    ```

    # tar --create --verbose --one-file-system --file /dev/st0 /home /usr

    ```


    This command can be abbreviated as follows:


    ```

    # tar cvlf /dev/st0 /home /usr

    ```


    These options tell tar to do things:


    +   - Create a backup—As you might expect, the --create command (abbreviated as
    (c)) tells tar to create a backup. Other commands include --extract (x) to restore
    files and --list (t) to list files in an existing backup.

    - Be verbose—The --verbose (v) option tells tar to display as it''s backed up.

    - Back up a single filesystem—The --one-file-system (l) option results in a backup
    of just one filesystem. For instance, if your system has root (/), /home, and
    /usr partitions, backing up the root filesystem without this option backs up all
    three partitions, but doing the same with this option backs up just the root partition,
    not the /home or /usr partitions.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Backing Up Linux 317


    option should always be used in backups because Linux employs virtual filesystems,
    such as /proc, should not be backed up, as they would be if you backed up the
    root filesystem without this option.


    +   * Specify a target file—--file (f) option specifies a filename, which immediately
    follows, in which the backup is stored. In this example, file is /dev/st0, which
    corresponds to a SCSI tape device. If you have an ATA tape drive, you''d use /dev/ht00
    rather than /dev/st0. If you''re backing up to a removable disk, you''d mount
    it and specify a file on the mount point.


    +   * Specify directories to be backed up—The final options are the files or directories
    to be backed up—/home, /, /usr in this example. The order of these items means
    files stored in /home will be the quickest to restore, followed by those in /usr.


    Although I didn''t show it in this example, another option you might want to use
    is --zip (z), which compresses data. --bzip2 (j) option does an even better job
    of compressing data, but it takes more CPU time. Mid-range and high-end tape drives
    provide compression themselves, so this option is often unnecessary when using
    tapes. In fact, the tape drive''s built-in compression is less likely to cause
    problems if there''s a read error when restoring data, using the tape drive''s
    compression is preferable. If you want to compress data when backing up to removable
    disks or preparing a tape file for subsequent storage on an optical disc, though.


    If your backup medium isn''t enough to store a whole backup, you have two choices
    for how to proceed:


    +   * Back up your system in chunks by specifying enough directories to fill one
    medium, then another, and so on.


    +   * Use the --multi-volume (M) option, possibly in conjunction with the --tape-length
    N (l) option, to have tar backing up when the medium fills up (or when the number
    of kilobytes have been backed up).


    You should always perform full system backups as root, because only root has access
    rights to all of the files on the computer. Ordinary users usually can back up
    their own files, although users often lack write permission to the tape device,
    so you might need to change permissions if you really want to enable users to
    write directly to tape.


    WARNING! Full system backups contain extremely sensitive files, such as password
    files. Thus, you should protect your backup media very carefully, lest an unscrupulous
    individual acquire them and use them to break into your system.'
