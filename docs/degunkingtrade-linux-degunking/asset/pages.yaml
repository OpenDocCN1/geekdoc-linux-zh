    # Understand How Gunk Gets in Your System


    You should have some idea of the kinds of gunk your Linux system can collect.
    Before proceeding further, you should consider how the gunk got there. Knowing
    how gunk is created can help you develop defenses to block it in the first place—it’s
    better to never have a problem than to have to correct one. Knowing how gunk is
    created can also help you develop a plan to cope with it. Throughout this book
    I will be showing you how to get rid of the gunk you don’t need, I’ll also point
    out ways that you can keep your system from collecting gunk in the first place.


    # Out-of-the-Box Gunk


    One type of gunk is present from the start—it’s installed with Linux itself. Why
    would a Linux distribution developer place gunk in the distribution? The answer
    is that they don’t know about your computer or how you intend to use it and thus,
    have to design their features to work with a variety of systems. This means they’ll
    likely provide stuff you don’t really need. They can guess and develop distributions
    for particular types of users, but it’s unlikely that they’ll make guesses that
    are exactly right for you. When they guess wrong, the result is gunk. Unfortunately,
    most users simply get a distribution and install everything on the computer without
    giving it much thought.


    Out-of-the-box gunk usually takes the form of many installed programs, although
    poor for desktop environments or other programs can be another form of this type
    of gunk. Each distribution has its own philosophy about what sorts of programs
    to install, so if you’ve not already installed Linux, you may want to consider
    the distribution’s mix of packages, configuration tools, and default options which
    one is a good fit for you:


    +   * **Debian GNU/Linux—This distribution, headquartered at http://www.debian.com**,
    takes a minimal approach. A default installation provides very little in the way
    of user programs and other tools, although Debian provides lots of options to
    increase the software selection both during and after installation. Overall, a
    default Debian installation is very gunk-free, but to make Debian a useful distribution,
    you must manually install an assortment of packages, and knowing which packages
    to install can be tricky unless you’re already familiar with Linux. In other words,
    Debian suffers from a sort of anti-gunk problem.


    +   * **Fedora Linux—Fedora (https://fedora.redhat.com)** is the freely redistributable
    version of Red Hat and has the same advantages and disadvantages as distribution.'
