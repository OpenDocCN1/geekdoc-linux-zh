    official distribution archives, though, you should keep an eye on the package
    to ensure that it''s not upgraded by distribution tools until you''re sure that
    the fix has been incorporated into the official distribution copy.


    # Improve Printing Performance


    Most Linux performance issues relate to speed or reliability of the system as
    a whole or of specific programs. An area that straddles the line, though, is printing.
    Linux''s printing subsystem is unusual compared to that ofWindows, and these differences
    can cause performance problems, both in terms of speed and in terms of the quality
    of the output. Being aware of the way the system is structured can help you improve
    matters. Two areas that are particularly important are picking the correct drivers
    and setting an appropriate printer resolution. If you''re in the market for a
    new printer, knowing how Linux interacts with the printer will also help you select
    a model that will work well.


    # Understanding Linux Printing


    If you''ve used Linux, you''ve probably seen the print dialog boxes, such as the
    Mozilla Firefox print dialog box shown in Figure 7-2. On the surface, these dialog
    boxes seem similar to those used by Windows or Mac OS. Beneath the surface, though,
    lurks an entirely different sort of printing beast.'
