  md: '# # Introduction


    When *Degunking Windows* first came out, I heard some people snidely comment that
    such a book was needed *only* for Windows. I wasn''t so sure, though. Certainly
    Linux doesn''t have a Registry to be gunked up, e-mail worms aren''t rampant among
    Linux systems, and Linux filesystems are much more resistant to speed degradation
    than are Windows filesystems, but without its Unwanted files can accumulate in
    either operating system (OS). Linux has its own unique security challenges, and
    a Linux system can become bloated with unnecessary software, among other issues.The
    snobbness of the Linux community, Linux can collect its own kinds of gunk, and
    this book is dedicated to cleaning it up.


    Fortunately, Linux can be degunked. In fact, once you know how, Linux can be fine-tuned
    and work better than you first installed it! This is partly by the fact that Linux
    is a highly OS—almost every part of it can be replaced by a similar tool, enabling
    you, like Goldilocks, to pick the one that''s just right for you, not too big
    or too small, too hot or too cold. This customizability, although it can be a
    great strength, can also lead to confusion and realistically, gunk. The wrong
    choices can cause the system to perform poorly, not because the software is bad
    per se, but because it''s just a bad fit for you.This book will help you find
    the right fit, as well as help you up your user files, configure the software
    in an optimal way, and otherwise clean your system.


    # # Who Should Buy this Book


    I''ve written this book with a typical desktop computer user in mind. I expect
    you to understand the basics of how to use Linux and to have already installed
    the OS. I don''t expect you to be a Linux geek, though—you don''t need to be able
    to write SysV startup scripts from scratch, or even know what they are, for instance.
    Some Linux degunking tasks do require delving into such issues, but when that
    happens, I try to do so in a gentle way.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# xviii Introduction


    This book provides practical advice on how degunk your Linux system. It does not
    provide complete technical details of every command it describes; instead, summarizes
    how to use programs to achieve specific goals, such as managing fonts or dealing
    with programs that are hogging your CPU time. This book also describes ways you
    can clean up your desktop, pick programs that will be best for you, and otherwise
    fine-tune your system.


    Linux is unusual in it is not a single OS; rather, it''s a family of OSs. Each
    specific OS is known as a distribution—a collection of the Linux kernel with support
    programs, an X server, startup scripts, and so on. The choices for each component,
    as well as the occasional distribution-specific tool, give each distribution its
    own "flavor.\ Unfortunately, the plethora of available distributions makes problems
    for writing about Linux—the differences can make a statement that''s valid for
    one distribution completely wrong for another. This book is written with all common
    desktop distributions in mind, but it focuses most strongly on a few, including
    Debian, Fedora, Mandrake, Red Hat, and SuSE. In a couple of cases, I use tools
    that are specific to Fedora and Red Hat as examples, but other distributions''
    tools work in a similar way. If you''re using Gentoo, Linspire, Slackware, Xandros,
    or something more exotic, you can still use this book, but you may run into features
    that do not work in the way I describe. If so, you''ll have to consult your distribution''s
    documentation.


    # How to Use This Book


    This book is structured in 4 parts with a total of 12 chapters, plus 1 appendix.
    Each part covers a particular type of degunking task:


    +   Part I, Degunking Basics—This part has two chapters that introduce the nature
    of Linux gunk and generalized degunking strategies. These chapters present the
    lay of specific degunking tips, they''re important for understanding the nature
    of Linux gunk. They''re particularly valuable if you''re relatively new to Linux,
    because they can help orient yourself to the OS.


    +   Part II, Degunking User Environments—This part consists of three chapters
    that describe how to degunk files, desktop environments, and common applications.
    For the most part, you can perform these degunking tasks as an ordinary user rather
    than root, the system administrator.


    +   Part III, System Degunking—This part is the largest one in the book, at five
    chapters. Its chapters cover package maintenance, software performance, process
    management, account degunking, and network degunking. Most of the tasks described
    in this part of the book require root access.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    +   - Part IV, Hardware Degunking—The final part of the book describes hardware-related
    degunking tasks—managing drivers and optimizing your X configuration. In some
    sense, these are specialized system degunking tasks; however, their ties to the
    hardware create special considerations, such as the need to deal with the Linux
    kernel.


    You can use this book in either of two ways:


    +   - If you''re having a specific problem, go to the chapter that seems relevant
    or look up the problem in the index.You should be able to degunk that problem
    directly.


    +   - If you want to degunk Linux generally, you should read through the book
    front to back. Generally speaking, the book progresses from simpler degunking
    tasks to more advanced degunking tasks.


    # Conventions Used in This Book


    Writing about computers, and particularly about Linux, invariably introduces a
    certain amount of computer-specific jargon, some of which can be hard to distinguish
    from common uses of some words. For this reason, this book uses typographical
    conventions to help clear things up:


    +   - Normal text, like this, is for the bulk of the words in most paragraphs.


    +   - Bold text denotes uniform resource locators (URLs), which usually point
    to Web pages, as in http://www.paraglyxpress.com.


    +   - Monospaced text denotes computer filenames, commands, and usernames. It''s
    also used (mostly on lines by itself) to show the contents of Linux configuration
    files or text-mode interactions with the computer. This text may be italicized
    to indicate a variable—a word that you should change for your system or application.


    +   - Bold monospace denotes commands that you type at a Linux command prompt.


    Sometimes I show multi-line computer interactions.When doing so, I include a Linux
    prompt, at which you type commands. This prompt is usually either a dollar sign
    ($), which denotes an interaction that you can perform as a normal user, or a
    hash mark (#), which denotes a command you must type as root.


    Several multi-line elements appear in this book:


    > NOTE: A note provides additional information on a topic. This is information
    that''s not critical to the main flow of the text that could be interesting or
    important in certain contexts.'
  merge: -1
