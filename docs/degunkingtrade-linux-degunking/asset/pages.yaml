    to identify the program by ID (PID) number and name. The latter option requires
    you to root to get all the PIDs and names, so you should run the command as root.
    The output is likely to be quite long, so you should pipe the output through less
    to enable you to page back and forth through the output to better study the result.
    The final command looks like this:


    ```

    # netstat -lp | less

    ```


    Unfortunately, the output of this command is likely to include lines longer than
    the usual 80 columns, so you may want to widen your terminal window before you
    execute it. Figure 10-6 shows the output of this command on one'
