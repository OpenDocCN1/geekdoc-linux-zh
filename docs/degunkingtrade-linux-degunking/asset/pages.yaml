    user selects a logout option), the script continues execution and terminates itself.
    The script senses and returns to the GDM or KDM program. If you omit the ampersands
    on either of the first two lines, the window manager won''t start until you exit
    from the earlier program, and if you add an ampersand to the final line, the script—and
    the login session—will terminate before you can do anything with your session.
    Then, you should be sure to get your ampersands right!


    Once you create this file and place it somewhere convenient (such as /usr/local/bin
    for a systemwide file, or this might be your .xession file), you must mark it
    as executable. You can do this with the chmod command, which changes the permissions
    (or mode, hence the name, which is short for change mode). Specifically, you want
    to execute (x) permissions for all (a) users:


    ```

    # chmod a+x my-login-script

    ```


    You can then refer to your session file, if it''s a global script. Log out of
    any GUI session where you''re currently running and restart the GDM or KDM session.
    In most cases, you can do this by logging into a text-only session and typing
    telinit 3 followed This changes the Linux runlevel, and most distributions run
    the GDM or KDM program only on runlevel 5, the effect is to shut it down and then
    start it up again. Some distributions, though, as Debian and Gentoo, start the
    GUI login program in another way. For them, you may need to type /etc/init.d/xdm
    (On Debian, you may replace xdm with gdm or kdm, depending on program you''re
    using.) If you have problems with this procedure, rebooting the computer will
    do the trick, but that''s a rather radical solution.


    Once this is done, you should see your new session type in the list of available
    login sessions. Some distributions configure themselves to change your default
    session when you select a new one. Others (including the popular Fedora) require
    you to do this special program or edit a configuration file to change your default.
    Fedora prompts you to do this, but it tells you to run a program (the Desktop
    Switching Tool) that may not be easily accessible in your environment. You can
    type switchdesk to do the job; the result is a window from which you can select
    your default environment.'
