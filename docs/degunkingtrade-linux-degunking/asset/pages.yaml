    # What Are All Dot Files, Anyway?


    Most Linux programs enable you to set user-specified defaults create dot files,
    typically when they''re first run. (Some programs require you to explicitly create
    their dot files, though.) Thus, as you use a system, chances you''ll accumulate
    dot files. Some of these will serve useful functions because they hold program
    defaults and other data that you really need. Others will be useless clutter that
    you''ll never run the program that created the file again.


    Because they''re hidden from view in most utilities, you may not be aware of how
    many dot files your system contains. Fortunately, many programs for directories
    contain options enabling you to see dot files. For example, you can use the -a
    option with the text-mode ls to view dot files:


