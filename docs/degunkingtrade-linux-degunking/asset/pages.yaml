    # Picking a Printer for Linux


    Linux is a very capable OS, but one of its problems is that not all hardware works
    with it. Although most printers work well with Linux, this isn''t true of all
    of them. Some printers are simply so new that the necessary drivers have yet to
    be written. Other printers use proprietary languages and protocols, and their
    manufacturers are not very helpful when it comes to providing documentation to
    Linux developers. In either case, the result is the same: a printer that won''t
    print, or prints poorly.


    If you''re unlucky enough to have a printer, or if you want to replace one that
    you''ve got, you should consider Linux compatibility when buying a printer. Frankly,
    a resource exists to help you in this quest: the Linux Printing site, http://www.linuxprinting.org.
    This site provides pointers to all sorts of information Linux printing. In terms
    of buying a new printer, the best part of this site is its printer database. From
    the main page, select the Printer Listings link. The result is a page in which
    you can select the mark and model of a printer you''re considering. When you''ve
    finished, click Show to see the information on that model. (Alternatively, you
    can select a manufacturer alone to see a list of all the models made by that company,
    then click a model name to see the information on that model.)'
