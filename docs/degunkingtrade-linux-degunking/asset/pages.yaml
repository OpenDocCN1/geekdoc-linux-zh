    (that is, it removes everything, including configuration files), -p displays

    information about an installed package, and -S searches for the package

    owns a file. For instance, suppose you want to remove the superprog package.

    Either of the following commands will do:


    ```

    # dpkg -r superprog

    # dpkg -P superprog

    ```


    The first of these commands won''t remove configuration files, if the package

    has any. (Many packages lack configuration files, so these two commands may

