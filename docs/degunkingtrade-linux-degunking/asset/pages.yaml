  md: '# 180 Chapter 7


    The Linux Printing Web site categorizes printers as falling into four categories:


    +   - Perfectly—Every printer feature works via at least one open source Linux
    driver package. In the case of multifunction printers, the non-printer functions
    must also work in Linux.


    +   - Mostly—Most printer features work, or all features work but produce slightly
    odd results, such as color that''s not quite perfect.


    +   - Partially—The printer provides basic functionality, but important features
    do not work. For instance, a printer might print only in black and white.


    +   - Paperwork—The printer does not work at all. You can''t get a basic printout
    from using open source Linux tools.


    In my experience, these ratings are somewhat pessimistic. For instance, I own
    an Epson Photo RX500, which the Linux Printing Web site lists as being Partially
    supported; however, I classify it as working Mostly, based on the descriptions
    on the Linux Printing Web site. I did have to jump through a few hoops to get
    it working, though. Most notably, I had to install a beta-level version of the
    GIMP-Print drivers. This isn''t the sort of thing I''d recommend for novices.
    Once drivers become more stable, perhaps the listing for the Epson RX500 will
    be upgraded to Mostly supported.


    Overall, I recommend you stick with printers that are listed as Mostly or Perfectly
    supported. If you spot a printer that''s listed as Partially supported or even
    one that''s listed as a Paperwork, you should avoid it unless the description
    indicates it can be made to work by following some specific procedure. Even then,
    you should be wary.


    How should you search for a printer? The Linux Printing database contains entries
    for a huge number of models, including many that have long discontinued. Thus,
    your best approach is probably to check your local computer stores and mail-order
    outlets for desirable models. Take notes and settle on half dozen or so models
    that will suit your needs. Once this is done, look up those models in the database.
    Some are likely to be poorly supported, so you can scratch them off the list.
    With luck, you''ll be left with at least one printer that will work well. If not,
    go back to the stores and broaden your search.


    Note that print quality under Linux may not be the same as it is under Windows.
    Thus, the print samples you see in stores and print quality ratings you see in
    magazines and on non-Linux Web sites may be meaningless. The reason is that print
    quality has as much to do with drivers as it does with the hardware. Because the
    Linux drivers are unrelated to the Windows drivers, print quality'
