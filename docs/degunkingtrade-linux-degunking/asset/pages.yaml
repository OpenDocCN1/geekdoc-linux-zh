    # # Gunkry Hardware and Drivers


    So far you''ve learned that most Linux setup consists of software gunk at a fairly
    high level—configuration files, user files, unnecessary programs, and so on.Your
    system can be impacted by gunk that closely interacts with your hardware, or at
    least with your hardware drivers.


    One type of hardware gunk is really quite severe: gunk that''s so thick that it
    prevents your hardware from working. This gunk is typically a result of incorrect
    drivers. Most Linux drivers are part of the kernel, so you may need some drivers
    reside in other subsystems. Most notably, printer, scanner, and most video card
    drivers belong to other programs. Knowing how to install and configure each of
    these driver types can greatly help you clean up this of gunk. Sometimes, though,
    Linux simply doesn''t support the hardware you''re trying to use. In cases, unfortunately,
    you may need to replace the hardware.


    Hardware and outright gunk can be particularly troublesome because it sometimes
    cause out system crashes. When hardware is faulty or a driver has a bug, it''s
    likely that the problem will cause your computer to stop functioning altogether,
    not just slow down or behave erratically. Fortunately, problems are rare, but
    they can be particularly vexing. Your system might crash randomly, giving you
    no immediate clue as the cause. Chapter 11, "Finding Drivers for Your Hardware,"
    provides a few tips on hardware troubleshooting.


    One area of hardware that deserves special attention is video hardware. This hardware
    is controlled by the X Window System (or X for short), which is Linux''s low-level
    GUI tool. X includes drivers for hardware and handles low-level tasks such as
    creating windows and displaying text. Other programs expand X''s operation, but
    basic X configuration deals mostly with X''s interactions with hardware. Most
    distributions set these up in a reasonable way when they install them, but you
    may need to change these configurations to deal with new hardware or to fix a
    broken initial configuration. X''s font handling is also notoriously tricky, although
    the situation has improved substantially in recent years.'
