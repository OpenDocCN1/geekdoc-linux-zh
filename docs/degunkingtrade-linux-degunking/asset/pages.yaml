  md: '# 100 Chapter 5


    The Linux OS is just a means to an end, the end being productive work done. That''s
    accomplished with the help of application programs run in Linux. These programs,
    like Linux itself, can easily accumulate junk. Covering how to degunk every Linux
    application program would bloat this book to the size of an encyclopedia, so instead,
    I''ll present an overview of just three common and powerful Linux applications:
    the OpenOffice suite, the Mozilla Firefox Web browser, and the Evolution mail
    reader and contact manager.


    Although this chapter is focused on showing you how to degunk these three programs,
    you can apply the general principles you learn here to other programs that handle
    the same tasks performed by these applications. Some of these principles can also
    be applied to many other types of programs. For instance, you might be able to
    apply some of what you learn about fonts in this chapter to graphics programs.


    # Degunk OpenOffice.org


    The first stop in this tour of applications is OpenOffice.org (http://www.openoffice.org).
    This office includes a word processor (Writer), a spreadsheet (Calc), a presentation
    program (Impress), a vector graphics program (Draw), and assorted utilities that
    help tie everything together. OpenOffice.org is the open source sibling of Sun''s
    StarOffice (http://www.sun.com/software/staroffice/), which offers the same set
    of features plus a few extras, such as import/export filters. Most of what I write
    about OpenOffice.org in this chapter applies equally well to StarOffice.


    OpenOffice.org junk can start to build up when you install it, so you''ll be mindful
    of how you accomplish this task. OpenOffice.org can also suffer from font junk.
    The office suite uses its own font rendering system, knowing how to install and
    manage fonts is important. You can also define printers using the same tool, although
    OpenOffice.org usually auto-detects your printers correctly. In day-to-day use,
    you may need to know how to deal with files created in other programs (most notably
    the Microsoft Office suite''s popular on Windows and Mac OS). Finally, OpenOffice.org
    is often overkill, so I''ll describe the slimmer alternatives to this package.


    # OpenOffice.org Installation Options


    If your Linux distribution doesn''t ship with OpenOffice.org, you have two choices
    for how to proceed:'
