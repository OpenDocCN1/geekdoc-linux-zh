    # Use the Last Resort: Replace Hardware


    Sometimes hardware gunk is just too deeply baked on to be removed. When

    this happens, you must replace the hardware (or do without the hardware).

    Knowing when to do this and when to hold out for more thorough degunking

    will help you balance your degunking time against your wallet. If you decide

    to replace hardware, doing some research beforehand will help you avoid further

    problems in configuring the replacement—after all, you don’t want to spend\much
    degunking brand-new hardware!


    # When to Replace Hardware


    Deciding to replace hardware can be a trying experience. Personally, I find it

    replace hardware that isn’t broken but is incompatible with my software;

    after, it’s still good! Of course, the meaning of “good” is relative; if hardware

    isn’t compatible with Linux, it’s not very good if Linux is your primary OS.


    As a practical matter, you should perform at minimal degunking before

    replacing hardware. Here are some questions you should ask that will help you

    determine when to give up on degunking and buy replacement hardware:


    +   **What is the source of the problem?** If the hardware itself is defective,

    y have little choice but to replace it. (Sadly, it’s uneconomical to repair

    most computer components.) If the problem is in software, you might be

    el find a software solution.


    +   **What is the official status of Linux driver support?** If the Linux

    drivers for the device should work, according to what you’ve read, then

    invest some time in finding a software solution might make sense. Other

    times, though, Linux drivers simply don’t exist or are so new that they

    are unlikely to be useful for months. In such cases, your only choice is

    to replace the hardware—unless you want to develop a driver yourself!


    +   **How certain are you that the problem is driver-related?** If you’re\absolutely
    convinced that the driver is responsible for your problems,

    replacing the device with one that uses another driver can be a viable

    solution. If the problem isn’t related to the driver, though you might run

    into the same problem with a replacement. For instance, if a printing

    problem is caused by a bad printer cable, replacing the printer but not the

    cable won’t solve the problem.'
