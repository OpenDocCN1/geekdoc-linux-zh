    #  Identifying File Types Using file


    Assume you''re cleaning house and you delete some files you know don''t need.
    You come across one file, though, named sunflower.ras, which is a thorn in your
    side. You''ve stared at the filename, pondered its meaning, and can''t figure
    out what it is. You might even have loaded into a text editor and you still can''t
    decipher it. In the game of Chicken between you and the file, the file''s winning.


    Fortunately, a simple Linux program can come to your rescue. Appropriately, this
    program''s name is file. Typically, you can use this program by typing its name
    followed by the name of the file you want to identify, and the result is identification:


    +   $ sunflower.ras


    sunflower.ras: Sun raster image data, 1278 x 1024, 24-bit, no colormap


    Unfortunately, the identification is sometimes a bit on the cryptic side, but
    it should provide some clues. In this case, several parts of the output indicate
    that the file is a graphics file—it''s described as a "raster image," a size in
    pixels and bit depth, and the lack of a color map is mentioned. In fact, Sun''s
    raster image format is one of dozens of graphics formats. With this information
    in hand, you should be able to load the file into a graphics program such as the
    GIMP or XV and decide whether you want to keep it.


    You can use the file command as I described, but it also supports a number of
    options that modify how it works. Most of these are highly technical or relate
    to where the command looks for its own database of identifying file type features.
    Here I''ve listed the ones that are easy to use and can help you with your daunting
    chores:


    +   Keep going— Ordinarily, file stops when it finds a file type match. In rare
    occasion, though, file might not be distinguish between two or more file types.
    The result can be a misidentification of the file type. If this happens, try the
    -k or --keep going option, as in file -k sunflower.ras. This causes the file command
    to keep looking for matches and print all possible types for a file.'
