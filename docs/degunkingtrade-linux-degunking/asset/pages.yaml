    $ rpm -e extraTT


    +   You should keep a couple of caveats in mind when removing fonts:

    * When you remove a font package, programs may become confused. In the case of
    programs that use X core, this can happen even when launching programs long after
    removing fonts. It''s therefore best to restart X after removing fonts or removing
    fonts when X is shut down.

    * X relies on the presence of certain core fonts and may not work correctly if
    they''re missing. As a general rule, these fonts live in the 75dpi, 100dpi, misc,
    Type1, and Speedo subdirectories of your main font directories (/usr/share/fonts
    or /usr/X116/lib/X11/fonts/). Thus, you should be wary of removing fonts from
    these subdirectories; however, some font packages add to these directories (particularly
    the Type1 directory). In the end, you may need to use some common sense. A Klingon
    font isn''t likely to be critical, even if it''s a core font directory, but a
    common font like Times might be.


    # Summing Up: Keeping Your Display Clean


    X is a tricky Linux component to configure, but it''s unusually important for
    desktop use of the OS. Picking the right driver and configuring the system to
    use a good color depth, resolution, and refresh rate will go long way toward keeping
    your display reasonably speedy. Although it''s not really critical for most desktop
    applications, 3D acceleration can help with games and a few more exotic tools,
    but configuring hardware 3D support requires digging into very hardware-specific
    drivers and their documentation. No matter what hardware you use, fonts are important
    for maintaining a legible display. X''s font handling is complex and involves
    two main font systems. Thus, installing fonts in X can be a bit involved,, but
    installing good fonts and keeping your system free of extraneous fonts can help
    keep your system looking good.'
