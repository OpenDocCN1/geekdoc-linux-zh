  md: '# User Settings for Common Applications 111


    Although Firefox is a nimble Web browser and is rapidly becoming the browser choice
    in Linux, it''s not completely immune to gunk collection. I''ll therefore describe
    some of its pitfalls, beginning with font issues. Most potential Firefox gunk
    is security related, though; any browser can be a security swamp, and knowing
    how to navigate this swamp will help. Finally, despite all the hype surrounding
    Firefox, it might not be right for you.Alternative browsers do exist, so you should
    know a bit about them.


    # Improving Firefox’s Fonts


    One common complaint when using Linux for Web browsing is that fonts look bad.
    Sometimes the problem lies with the underlying font rendering system. Specifically,
    if your Web browser is using X core fonts rather than Xft fonts, the result is
    likely to be chunky fonts that may look rather unappealing, particularly if you
    use certain fonts or certain fonts. To correct problems, you should ensure that
    Xft fonts are available on your system, as described in Chapter 12.


    Beyond this issue, you should check the Firefox font options. These options, most
    Firefox configuration options, are available from the Preferences dialog box,
    which you can reach by selecting Edit > Preferences. The result represents Figure
    5-7. In this dialog box, click Fonts & Colors to obtain the Fonts & Colors dialog
    box shown in 5-8.


    Several options in the Fonts & Colors dialog box may need adjustment, depending
    on your system and your preferences:


    +   Font selections—You can set your serif, sans serif, and monospace fonts to
    whatever you desire using the selection boxes of the page. If a Web page does
    not specify a font by name, Firefox will then use the font you tell it to.


    +   Default proportional font—The Proportional field tells Firefox whether you
    want to use your serif or your sans serif font as the default font for pages that
    do not specify fonts.


    +   Display resolution—X tries to determine your screen’s resolution in dots per
    inch; however, X sometimes gets this detail wrong. This isn’t a problem in most
    cases, but sometimes the result can be preposterously large or small fonts. Setting
    the resolution to a specific value in the Display Resolution field can help. (Divide
    your screen’s horizontal resolution in pixels by its width in inches to determine
    your resolution. You may need to round to this value, since Firefox only presents
    a few options.)


    +   Font sizes—The Size (Pixels) fields provide a means to set the default font
    size in pixels for your proportional and monospace fonts.'
