- img_proc: true
  md: '# 264 Chapter 11


    Degunk hardware is always tricky. Part of the difficulty identifying the true
    source of the problem—sometimes what looks like faulty hardware can turn out to
    be bad drivers. The issue is complicated by the fact that most hardware manufacturers
    make Windows drivers for their products, but more often than not, they ignore
    Linux. Thus, an initial hurdle in getting any hardware working with Linux is finding
    drivers for it. Although Linux ships with drivers for most common hardware, you
    should know where to find the drivers when you install new hardware or when you
    install Linux on old hardware. This knowledge alone will solve a lot of problems.
    Once the drivers are found, of course, you must be able to install them. Finally,hardware
    problems can sometimes be solved only by replacing the hardware—perhaps the hardware
    is broken, or perhaps it''s simply unsupported under Linux. In either event, before
    you drop hard-earned cash on new hardware, you should know how to determine that
    it really does need to be replaced, and you should also know how to determine
    if new hardware is compatible with Linux.


    # Hardware Troubleshooting


    Gunky hardware usually causes pretty obvious problems. Perhaps the computer crashes,
    or maybe a printer doesn''t deserve the name it won''t print. Unfortunately, symptoms
    like these won''t lead you to the cause of the problem. For instance, a flaky
    printer might be flaky because its cable is inserted loosely, because the Linux
    kernel lacks drivers to communicate with the device, because your printing subsystem
    lacks drivers to output that the printer can understand, because the printing
    subsystem isn''t running, or any of dozens of other reasons. Describing every
    possible problem and its symptoms would take a book far larger than this one.
    Instead, I first cover some general hardware troubleshooting techniques. These
    should help you isolate the problem. I also describe some of the most common hardware
    problems.


    # General Hardware Troubleshooting Procedures


    Hardware troubleshooting can be particularly onerous because hardware problems
    tend to be unusually slippery. A component might work fine today but then fail
    tomorrow, bringing down the computer. Perhaps the worst types of problems are
    those that occur both randomly and infrequently—say, bad RAM that causes a system
    crash once a week. This time scale, combined with the unpredictability of the
    problems, makes it hard to perform tests designed to isolate the cause.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Finding Drivers for Your Hardware 265


    Although hardware troubleshooting can be a difficult task, it''s not an impossible
    one. Some general procedures can help reduce the amount of hair you pull out in
    the process:


    +   **Take notes.** It''s easy to forget what you''ve tried, or what the outcomes
    were, when you delve into fixing a hardware problem. Taking notes can help you
    collect and organize your thoughts.


    +   **Be methodical.** Think back to your high school science classes and treat
    your debugging session like a scientific experiment. Formulate competing hypotheses
    about the cause of a problem, develop a test to differentiate between these cases,
    and implement that test. For instance, the hypotheses might be that a problem
    is a bad cable or that it''s not a bad cable. The test could then be replacing
    the suspect cable.


    +   **Check log files.** Linux stores various log files in the `/var/log` directory.
    These files may hold useful clues about the cause of the problem. Check the ends
    of the files after a problem occurs, if possible. You might also find some useful
    hints in the `kernel ring buffer`, which holds messages from the kernel. Typing
    `dmesg` at a command prompt displays this.


    +   **Do some research.** Try a Web search on keywords related to your problem.
    This approach is most likely to work if the system delivers an error message;
