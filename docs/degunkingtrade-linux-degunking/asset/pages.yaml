  md: '# 98 Chapter 4


    **TIP:** If you don''t want to risk ruining your current configuration, try creating
    and using a spare account for experiments. Chapter 9, "Account Degunk," describes
    Linux account management tools. Create an account for the express purpose of trying
    new features or desktop environments. If you like what you see, implement the
    changes in your regular account. If you don''t like the results, your main account
    is unharmed. Either way, remember to delete the account, lest it become gunk!


    # # Summing Up: Keeping Your Desktop Environment Gunk-Free


    Linux provides an unusually wide range of options in desktop environments. GNOME
    and KDE are both common, while XFce and various other tools are also available.
    Because these environments vary in their overall number of features and resource
    requirements, one excellent way to degunk a Linux desktop environment is to pick
    the right one for the job. If GNOME feels like an elephant on roller skates, switch
    to XFce or a bare window manager. If a bare window manager feels like a plain
    white room with no furniture, switch to XFce. Of course, within each desktop environment,
    you can also take steps to degunk it. All desktop environments provide configuration
    tools to adjust the mouse tracking speed, change the look of window borders, and
    so on. Thus, you can set all sorts of features that change the gunk level to suit
    your needs.'
