  md: '# Finding Drivers for Your Hardware 273


    **NOTE:** The Linux kernel version numbers have three parts, in 2.6.10. The major
    version number (2 in this example) changes infrequently. The third version number
    (10 in this example) changes fairly regularly. The middle number (6 in this example)
    has a special meaning: Even numbers denote **stable** kernels, which are deemed
    early **development** kernels, in which major new features are added. You should
    avoid development kernels unless you''re prepared to deal with less stable operation
    and really need a feature that''s been added to such a kernel that''s not yet
    available in a stable kernel.


    Once you''ve downloaded the kernel source code, unpack it in a convenient location
    (the traditional location is `/usr/src/`).


    ```

    # tar xvzf /path/to/linux-version.tar.gz

    ```


    In example, /path to is the directory in which the file resides. If you downloaded
    a bzip2-compressed file (one with a name that ends in .bz2), change `tar xvzf`
    to `tar xjf`. The result is a directory called `linux-version` in which the Linux
    source code resides. You should create a symbolic link to this directory by typing
    `ln -s linux-version-linux`.


    **NOTE:** Ordinary, root owns `/usr/src`, so only root can extract the kernel
    source code to this directory. If you change its permissions to enable others
    to write to it, an ordinary user may extract the kernel source files, configure
    the kernel, and build it.


    At this point, the Linux kernel source is to be configured. Change into the linux
    directory and type `make xconfig` and will then present a window similar to the
    one shown in Figure 11-1. You can configure the kernel from this window, but be
    prepared to spend several minutes doing so, and perhaps over an hour if you''re
    unfamiliar with the process. The major areas of configuration appear in the pane
    on the left of the window. Most options have a square box to their left. Click
    an area to see area''s options in the top right pane. If the box is empty, the
    feature won''t be compiled. If it contains a check mark, the option will be compiled
    directly into the main kernel file. (Some items cannot be compiled as modules
    or cannot be compiled directly into the main kernel file. This is normal.) When
    you select an item, a description usually appears in the bottom right pane, but
    some items lack descriptions.


    **NOTE:** If you get an error message rather than the window shown in Figure 11-1,
    chances are you''re missing some development libraries. Typing `make menuconfig`
    may enable you to configure your kernel using a text-mode tool rather than a GUI
    tool, or you may need to track down the missing development tools.'
