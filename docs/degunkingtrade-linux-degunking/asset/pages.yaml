    # Third-Party Kernel Modules


    A major source of drivers is third-party kernel modules. These are Linux kernel
    modules that aren''t part of the main Linux kernel source tree, as downloaded
    from sites such as http://www.kernel.org. Broadly speaking, these modules fall
    into two categories:


    +   - Open source drivers that have not yet been added to the kernel. Perhaps
    the developers just don''t want to have their project added to the kernel, or
    perhaps they''re on a track to be eventually added but they haven''t been included
    for one reason or another.


    +   - Proprietary drivers that are never likely to be added to the kernel. These
    drivers are sometimes released by hardware manufacturers as a way of supporting
    Linux. Typically, such drivers come in binary form that work with particular kernels
    or as binary files that can be linked to the kernel using separate source code
    "glue".


    Generally speaking, I recommend avoiding third-party kernel modules. The open
    source variety are often works in progress, meaning that they may prove unreliable—and
    unreliable kernel modules can be dangerous beasts because they can more easily
    crash the computer than other types of buggy software. Proprietary drivers can
    be worse in some respects—you may find that you want or need to upgrade your kernel
    but the proprietary drivers won''t work with the new kernel.


