    > NOTE: If you''re using a pre-2.6.x kernel, you must type make modules before
    typing modules_install. This extra command builds the kernel modules separately
    from the main kernel file. With the 2.6.x kernel, Linux changed the basic kernel
    compilation so that it builds both the main kernel and the modules, so this extra
    step isn''t necessary.


    # Booting a New Kernel


    Aside from configuring the kernel, the trickiest part of the job of installing
    a new kernel is configuring your system to boot with. Booting a kernel is handled
    by a boot loader, which is a program that the computer''s BIOS loads. The boot
    loader is tasked with locating an OS kernel, loading it into memory, and running
    it. Advanced boot loaders, including those most commonly used with Linux, also
    permit you to select the OS or kernel you want to use. Thus, the key to booting
    a new Linux kernel is in telling your boot loader that


    Two boot loaders are commonly used with Linux: the Grand Unified Boot Loader (GRUB)
    and the Linux Loader (LILO). LILO is the older of these two products and is configured
    through /etc/lilo.conf. GRUB is newer than LILO and has been slowly replacing
    LILO as the default boot loader for most distributions, while LILO is still popular.
    GRUB is configured through either /boot/grub.conf or /boot/grub/menu.lst. To determine
    which boot loader your system uses, check for these three files. Chances are only
    one will be present. If multiple files exist, though, use your package manager
    to verify the installation of a grub or lilo package. If both packages are installed,
    you can''t tell which boot loader you''re using. In that case, I suggest first
    configuring your system for GRUB. If that works, uninstall the LILO package (it''s
    gunk). If the GRUB configuration doesn''t work, try configuring LILO. If that
    works, uninstall the grub package, because it''s gunk.


