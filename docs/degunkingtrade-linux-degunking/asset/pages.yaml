  md: '# Cleaning Up Unused Packages


    NOTE: If you are an advanced user, you may be able to recompile an old package
    to use newer libraries. With RPMs, this can be done by downloading a source RPM,
    which is an RPM that contains source code rather than compiled code. You can then
    compile the RPM by typing rpmbuild --build package.src.rpm, where package.src.rpm
    is the source RPM file. The result is a binary RPM, located somewhere in the /usr/src
    directory tree (the exact location depends on your distribution and CPU; try using
    find to locate it). This process requires that you have various development tools
    installed, and it may fail for various reasons. You might give it a try if you''re
    really desperate to get an older or obscure package working on your system.


    If you stick to software that is supported by your distribution, you are unlikely
    to run into really dependency problems. At the worst, you should be able to use
    package management tools like Synaptic to keep everything in sync, and you may
    need to swap installation CD-ROMs in and out of your CD-ROM drive as it fits them.


    Serious dependency problems are more likely to arise if you start using software
    that has not been vetted by your distribution maintainers. Such packages may be
    built for a different distribution than the one you''re using—for instance, the
    package might have used Red Hat when running Mandrake. Most of the time, such
    packages install and run fine, assuming they''re in the correct format (such as
    RPM). Sometimes, though, dependency conflicts arise, complicating installation
    of the software or subsequent upgrades. If happens, you''ll need to follow the
    procedures just described to resolve the problem.


    > TIP: If you''re using an RPM-based distribution, you can check http://www.rpmfind.net
    for many packages. You may be able to use that site to find a newer version of
    a problem package, missing support packages, or other packages that can help you
    work around the problem. Making heavy use of this site, though, can lead you deeper
    into eventual dependency problems, as the packages found may not be registered
    with your distribution and might not be easily upgraded with the advanced package
    management tools.


    # Bypassing Dependencies: At Your Own Risk


    By far the best way to deal with a dependency problem is to resolve it within
    the package management system by installing, upgrading, or removing packages,
    as just described. Sometimes, though, you can bypass dependencies by telling the
    system to ignore the problem. This approach can work if the specified dependency
    is overly stringent. For instance, a word processor might list a dependency on
    a set of fonts simply because the program author thought people using the word
    processor had a good selection of fonts, because the word processor actually requires
    the fonts. When this is the case,'
  merge: -1
