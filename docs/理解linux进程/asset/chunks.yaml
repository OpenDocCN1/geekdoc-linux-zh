  trans: "\n\n![](img/Cover.jpg)\n\n# 理解 Linux 进程\n\n## 关于这本书\n\n本书受[*理解 Unix 进程*](http://www.duokan.com/book/41446)启发而作，用极简的篇幅深入学习进程知识。\n\
    \n*理解 Linux 进程*用 Go 重写了所有示例程序，通过循序渐进的方法介绍 Linux 进程的工作原理和一切你所需要的概念。\n\n本书适合所有 Linux\
    \ 程序员阅读。[在线阅读](http://www.linuxprocess.com)，PDF 下载](https://github.com/tobegit3hub/understand_linux_process/blob/master/understan_linux_process.pdf?raw=true)。\n\
    \n## 三位好朋友\n\n阅读前介绍三位即将与大家打交道的小伙伴：Linux、Go 和 Docker。\n\nLinux 是我们主要的研究对象，书中所有概念与程序都基于\
    \ Linux，这同样适用于所有 Unix-like 系统。\n\n`Go`是本书所有示例程序的实现语言，当然进程的概念与原理是相通的，你也可以使用其他编程语言实现。\n\
    \n`Docker`为我们创造可重复的实验环境，使用`Docker`容器你可以轻易地模拟与本书一模一样的运行环境。\n\n感谢 `Wawa Leung`\n\
    \n否则这本书在两年前就发布了\n\n## 本书概述\n\n进程的概念大家都很熟悉，但你是否能准确说出僵尸进程的含义呢？还有`COW(Copy On Write)`、`Flock(File\
    \ Lock)`、`Epoll`和`Namespace`的概念又是否了解过呢？\n\n本书汇集了进程方方面面的基础知识，加上编程实例，保证阅读后能自如地回答以上问题，在项目开发中对进程的优化也有更深的理解。\n\
    \n## 本书架构\n\n本书按循序渐进的方式介绍进程的基础概念和拓展知识，主要涵盖以下几个方面：\n\n* 进程的基础知识介绍\n* 进程相关的编程实例\n\
    * 进程的进阶知识详解\n* 项目 Run 的进程管理\n* 使用进程的注意事项\n\n其中项目[Run](https://github.com/runscripts/run)是`Go`实现的脚本管理工具，通过研究`Run`的源码能够加深对进程管理的理解。\n\
    \n## 关于勘误\n\n本书所有内容都托管到[GitHub](https://github.com/tobegit3hub/understand_linux_process)，如果纰漏或错误请提[Issue](https://github.com/tobegit3hub/understand_linux_process/issues/new)。\n\
    \n## 示例程序\n\n本书所有示例程序都基于`Go`编写，代码托管到[GitHub](https://github.com/tobegit3hub/understand_linux_process_examples)。\n\
    \n每章的示例都是可直接运行的`Go`源文件，例如第一章的 Hellow World 程序可以通过`go run hello_world.go`来运行并查看运行结果。\n\
    \n```\n# go run hello_world.go\nHello World \n```\n\n接下来介绍使用`Docker`来运行本书的示例程序。\n\
    \n### Docker 简介\n\n[Docker](https://github.com/docker/docker)是一个容器运行平台，你可以将程序及其依赖打包成容器，在不同机器上运行可得到一致的运行效果。因为不同的系统环境或`Go`版本可能影响程序的运行结果，为了得到可预测、可重复的实验环境，我们引入了`Docker`容器技术。\n\
    \n### Docker 使用\n\n我们不仅开源了示例代码，还创建了官方[Docker 镜像](https://registry.hub.docker.com/u/tobegit3hub/understand_linux_process_examp/)。\n\
    \n只要执行命令`docker run -i -t tobegit3hub/understand_linux_process_examp`，就可以马上创建本书的实验环境。进入容器后可以轻易地运行示例程序。\n\
    \n```\nroot@6a8e36a53495:/go/src# go run hello_world.go\nHello World \n```\n\n\
    当然你也可以在本地运行自己的`Go`示例，或者使用官方`Go`镜像`docker run -i -t golang:1.4 /bin/bash`。\n\n\
    ## 第一章 进程基础\n\n作为本书的第一部分，主要介绍进程的`PID`、进程状态、退出码和`POSIX`等基础概念。\n\n网络有很多零散的资料介绍基础了，为什么还要花篇幅介绍这些呢？首先我们要保证看过这些章节的都能掌握这些概念，其次通过编写代码实例，我们还能动手验证这些概念，已经不能更赞了。\n\
    \n学习完这章我们应该能够准确回答出`PID`、`PPID`、进程名字、进程参数、进程状态、退出码、死锁、活锁、`POSIX`、`Nohup`等概念。\n\n\
    ### 进程的定义\n\n根据维基百科的[定义](http://zh.wikipedia.org/wiki/%E8%A1%8C%E7%A8%8B)，进程(`Process`)是计算机中已运行程序的实体。用户下达运行程序的命令后，就会产生进程。进程需要一些资源才能完成工作，如\
    \ CPU 使用时间、存储器、文件以及 I/O 设备，且为依序逐一进行，也就是每个 CPU 核心任何时间内仅能运行一项进程。。\n\n我们简单总结下，进程就是代码运行的实体。这里补充一点，进程不一定都是正在运行的，也可能在等待调度或者停止，进程状态将在后续详细介绍。\n\
    \n### 举个例子\n\n进程的概念应该很好理解，因为我们都在写代码，这些代码跑起来了就是一个进程，为了完整性我们介绍最简单的 Hello World 进程。\n\
    \n### Hello World 进程\n\nHello World 程序是每门编程语言的入门示例，注意这个程序还不是进程哦，它的作用是在终端输出“Hello\
    \ World”然后退出。当我们运行 Hello World 程序时，系统就创建一个 World 进程。这也是最简单的进程，没有系统调用、进程间通信。\n\n\
    ### Bash 实现\n\n用`Bash`实现 Hello World 只需要一行代码，运行后输出“Hello World”。\n\n```\nroot@8709bfcb2:/go/src#\
    \ echo Hello World\n```\n\n稍微提一下`echo`是 Linux 自带的程序，可以接受一个或多个参数，反正它们输出到终端而已。这样最简单的进程就诞生了，当然也可以用`Go`重写程序。\n\
    \n### Go 实现\n\n`Go`实现的源码参见`hello_world.go`。\n\n```\npackage main\n\nimport (\n\
    \  \"fmt\"\n)\n\nfunc main() {\n  fmt.Println(\"Hello World\")\n}\n```\n\n运行后得到输出。\n\
    \n```\nroot@8709bfcb2:/go/src# go run hello_world.go\nHello World\n```\n\n发生了接下来我们将各个方面介绍。\n\
    \n### PID\n\n首先来学习`PID`这个概念，PID 全称`Process ID`，是标识和区分进程的全局唯一的整数。Hello World 运行时也有一个\
    \ PID，只是它结束后释放了，我们可以通过`print_pid.go`显示当前进程。\n\n### 示例程序\n\n`print_pid.go`的源码如下，通过`Getpid()`函数获得当前进程。\n\
    \n```\npackage main\n\nimport (\n  \"fmt\"\n  \"os\"\n)\n\nfunc main() {\n   \
    \ fmt.Println(os.Getpid())\n}\n```\n\n### 运行结果\n\n```\nroot@8709bfcb2:/go/src#\
    \ go run print_pid.go\n2922\nroot@8709bfcb2:/go/src# go run print_pid.go\n2932\n\
    ```\n\n可以看出进程运行时是由操作系统分配的，同一个程序运行两次产生两个 PID。那 PID 究竟有什么用？稍后。\n\n### PPID\n\n每个进程都有\
    \ PPID，也就是父进程，通过`PPID`找到父进程。为什么进程会有父进程呢？所有进程都是它衍生出来的，后面详细介绍几种方法。准确的进程号为 1，叫做进程树。\n\
    \n### 示例程序\n\n要想获得 PPID，可以通过`Getppid()`函数获得，`ppid.go`代码如下。\n\n```go\npackage main\n\
    \nimport (\n  \"fmt\"\n  \"os\"\n)\n\nfunc main() {\n  fmt.Println(os.Getppid())\n\
    }\n```\n\n### 运行结果\n\n```\nroot@8709bfcb2:/go/src# go run ppid.go\n2892\nroot@8709bfcb2:/go/src#\
    \ go run ppid.go\n2902\n```\n\n有趣的事情是发现每次运行的进程 ID 都不一样，符合我们的预期，原来通过`go run`都会启动一个新的进程。\n\
    \n### 编译后运行\n\n如果我们先生成二进制文件再执行结果怎样？\n\n```\nroot@8709bfcb2:/go/src# go build ppid.go\n\
    root@8709bfcb2:/go/src# ./ppid\nroot@8709bfcb2:/go/src# ps aux | grep \"1\" |\
    \ grep -v \"grep\"\nroot         1  0.0  0.3  2028  3184        Ss   07:25   0:00\
    \ /bin/bash\n```\n\n这次发现父进程都是一样的，而且通过`ps`命令可以看到父进程就是`bash`，说明通过终端执行是从`bash`衍生出各种进程。为了执行这个程序要查找、打包。\n\
    \n### 使用 PID\n\n拿到 PID 后，我们就可以通过`kill`命令结束进程，也可以通过`kill -9`或其他数字向进程发送不同的信号。信号是很重要的概念，我们后面会详细介绍，那么有了进程\
    \ ID，我们也可以看看进程名字。\n\n### 进程名字\n\n每个进程都一定有进程名字，例如我们运行`top`，进程名就是“top”，如果是自定义的程序呢？其实进程名一般都是程序。\n\
    \n### Top\n\n在命令行执行`top`后，得到类似输出，可以看到目前有三个进程，PID 分别是 1、8 和 9。\n\n```\ntop -12:45:18\
    \ up 1 min,  0 users,  load average: 0.86, 0.51, 0.20\nTasks:   3,   1 running,\
    \   2 sleeping,   0 zombie\n%Cpu(s):  0.0 us,  0.0 sy,  0.0 ni,100.0 id,  0.0\
    \ wa,  0.0 hi,  0.0 st\nKiB Mem:   2056748 total,   301984 used,  1754764 free,\
    \    20984 buffers\nKiB Swap:  1427664 total,        0 used,  142764 free.   231376\
    \ cached Mem\nPID USER      PR  NI    VIRT    RES    SHR S  %CPU %MEM     TIME+\
    \ COMMAND\n1 root      20   0    4312    692    612 S   0.0  0.0   0:00.23 sh\n\
    8 root      20   0   20232   3048   2756 S   0.0  0.1   0:00.03 bash\n9 root \
    \     20   0   21904   2384   2060 R   0.0  0.1   0:00.00 top \n```\n\n### PS\n\
    \n执行`ps aux`后输出如下，其中`aux`参数让`ps`命令显示更详细的参数。前面 PID 为 9 的进程已经退出了，取而代之的是 PID 为 11\
    \ 的进程。\n\n```\nroot@fa13d0439d7a:/go/src# ps aux\nUSER       PID %CPU %MEM   \
    \ VSZ   RSS TTY      STAT START   TIME COMMAND\nroot         1  0.2  0.0   4312\
    \   692 ?        Ss   12:45   0:00 /bin/sh -c /bin/bash\nroot         8  0.0 \
    \ 0.1  20232  3224 ?        S    12:45   0:00 /bin/bash\nroot        11  0.0 \
    \ 0.0  17484  2000 ?        R+   12:46   0:00 ps aux \n```\n\n"
- fmt: "\n```\npackage main\n\nimport \"flag\"\nimport \"fmt\"\n\nfunc main() {\n\
    \  wordPtr := flag.String(\"word\", \"foo\", \"a string\")\n  numbPtr := flag.Int(\"\
    numb\", 42, \"an int\")\n  boolPtr := flag.Bool(\"fork\", false, \"a bool\")\n\
    \  var svar string\n  flag.StringVar(&svar, \"svar\", \"bar\", \"a string var\"\
    )\n\n  flag.Parse()\n\n  fmt.Println(\"word:\", *wordPtr)\n  fmt.Println(\"numb:\"\
    , *numbPtr)\n  fmt.Println(\"fork:\", *boolPtr)\n  fmt.Println(\"svar:\", svar)\n\
    \  fmt.Println(\"tail:\", flag.Args())\n} \n```\n\n运行结果如下，相比直接使用`os.Args`代码也简洁了不少。\n\
    \n```\n root@87096bf68cb2:/go/src# ./flag -word=opt -numb=7 -fork -svar=flag\n\
    word: opt\nnumb: 7\nfork: true\nsvar: flag\ntail: []\nroot@87096bf68cb2:/go/src#\
    \ ./flag -h\nUsage of ./flag:\n  -fork=false: a bool\n  -numb=42: an int\n  -svar=\"\
    bar\": a string var\n  -word=\"foo\": a string \n```\n\n使用Go获取进程参数是很简单的，不过一旦参数太多，最佳实践还是使用配置文件。\n\
    \n进程参数只有在启动进程时才能赋值，如果需要在程序运行时进行交互，就需要了解进程的输入与输出了。\n\n## 进程输入与输出\n\n每个进程操作系统都会分配三个文件资源，分别是标准输入(`STDIN`)、标准输出(`STDOUT`)和错误输出(`STDERR`)。通过这些输入流，我们能够轻易得从键盘获得数据，然后在显示器输出数据。\n\
    \n### 标准输入\n\n来自管道(`Pipe`)的数据也是标准输入的一种，我们写了以下的实例来输出标注输入的数据。\n\n```\npackage main\n\
    \nimport (\n  \"fmt\"\n  \"io/ioutil\"\n  \"os\"\n)\n\nfunc main() {\n  bytes,\
    \ err := ioutil.ReadAll(os.Stdin)\n  if err != nil {\n    panic(err)\n  }\n\n\
    \  fmt.Println(string(bytes))\n} \n```\n\n运行结果如下。\n\n```\n root@87096bf68cb2:/go/src#\
    \ echo string_from_stdin | go run stdin.go\nstring_from_stdin \n```\n\n### 标准输出\n\
    \n通过`fmt.Println()`把数据输出到屏幕上，这就是标准输出了，这里不太演示了。\n\n### 错误输出\n\n程序的错误输出与标准输出类似，这里暂不演示。\n\
    \n了解完进程一些基础概念，我们马上要深入学习并发与并行的知识了。\n\n## 并发与并行\n\n并发(`Concurrently`)和并行(`Parallel`)是两个不同的概念。借用Go创始人Rob\
    \ Pike的说法，并发不是并行，并发更好。并发是一共要处理(`deal with`)很多事情，并行是一次可以做(`do`)多少事情。\n\n举个简单的例子，华罗庚泡茶，必须有烧水、洗杯子、拿茶叶等步骤。现在我们想尽快做完这件事，也就是“一共要处理很多事情”，有很多方法实现实现并发，例如请多个人同时做，这就是并行。并行是实现并发的一种方式，但不是唯一的方式。我们一个人也可以实现并发，例如先烧水、然后不用等水烧开就去洗杯子，所以通过调整程序运行方式也可以实现并发。\n\
    \n### 大神讲解\n\n如果还不理解，建议看Rob Pike题为Concurrency is not Parallelism的[演讲PPT](http://concur.rspace.googlecode.com/hg/talk/concur.html)和[演讲视频](http://blog.golang.org/concurrency-is-not-parallelism)。\n\
    \n我把演讲的PPT截图贴出来方便大家理解。\n\n## 总结\n\n总结一下，并行是实现并发的一种方式，在多核CPU的时代，并行是我们设计高效程序所要考虑的，那么进程是不是越多越好呢？\n\
    \n### 进程越多越好？\n\n前面提到多进程的并行可以提高并发度，那么进程是越多越好？一般遇到这种问题都回答不是，事实上，很多大型项目都不会同时开太多进程。\n\
    \n下面以支持100K并发量的Nginx服务器为例。\n\n### 举个例子: Nginx\n\nNginx是一个高性能、高并发的Web服务器，也就是说它可以同时处理超过10万个HTTP请求，而它建议的启动的进程数不要超过CPU个数，为什么呢？\n\
    \n我们首先要知道Nginx是Master-worker模型，Master进程只负责管理Worker进程，而Worker进程是负责处理真实的请求。每个Worker进程能够处理的请求数跟内存有关，因为在Linux上Nginx使用了`epoll`这种多路复用的IO接口，所以不需要多线程做并行也能实现并发。\n\
    \n而多进程有一个坏处就是带来了CPU上下文切换时间，所以一味提高进程个数反而使系统性能下降。当然如果当前进程小于CPU个数，就没有充分利用多核的资源，所以Nginx建议Worker数应该等于CPU个数。\n\
    \n### 特殊情况\n\n我们想想进程数应该等于CPU数，但是如果进程有阻塞呢？这是是应该提高进程数增加并行数的。\n\n在Nginx的例子中，如果Nginx主要负责静态内容的下载，而服务器内存比较小，大部分文件访问都需要读磁盘，时候进程很容易阻塞，所以建议提高下Worker数目。\n\
    \n### 绑定CPU\n\n一般情况下除了确保进程数等于CPU数，还可以绑定进程与CPU，这就保证了最少的CPU上下文切换。\n\n在Nginx中可以这样配置：\n\
    \n```\nworker_processes 4;\ncpu_affinity 0;\n```\n\n这是通过系统调用`sched_setaffinity()`实现了，感兴趣可以学习这方面的。\n\
    \n## 进程状态\n\n根据进程的定义，知道进程是实体，可能是正在运行，也可能是停止的。网上总结进程一共7种状态，究竟怎么算呢，最好的方法还是看源码。\n\
    \n在`proc/array.c`文件中：\n\n```\n/*\n* The task array is a \"bitmap\" of states.\
    \ */\nstruct task_struct {\n  volatile long state; /* -1 unrunnable, 0 runnable,\
    \ >0 stopped */\n  void *stack;\n  atomic_t usage;\n  unsigned int flags; /* per\
    \ process flags, defined below */\n  unsigned int ptrace;\n};\nstatic const char\
    \ task_state[] = {\n  \"R (running)\",        /* 0 */\n  \"S (sleeping)\",   \
    \     /* 1 */\n  \"D (disk sleep)\",      /* 2 */\n  \"T (stopped)\",        /*\
    \ 4 */\n  \"t (tracing)\",        /* 8 */\n  \"X (dead)\",          /* 16 */\n\
    \  \"Z (zombie)\",         /* 32 */\n};\n```\n\n这真的是Linux的源码，可以看出进程一共7种状态，含义也清晰，注意其中`D`(`disk\
    \ sleep`) 称为不可中断睡眠状态(`uninterruptible sleep`)。\n\n### 进程状态\n\n通过[Ptrace](https://idea.popcount.org/2012-11-linux-process-states/)、[include/linux/sched.h](https://github.com/torvalds/linux/blob/master/include/linux/sched.h)：\n\
    \n```\nstruct task_struct {\n  volatile long state;\n  ...\n};\nenum {\n  TASK_RUNNING\
    \ = 0,\n  TASK_SLEEPING = 1,\n  TASK_UNINTERRUPTIBLE = 2,\n  TASK_STOPPED = 4,\n\
    \  TASK_TRACING = 8,\n  TASK_DEAD = 16,\n  TASK_ZOMBIE = 32,\n};\n```\n\n通过`ps\
    \ aux`可以看到进程的状态。\n\nO：进程正在运行,这个状态从来见过.\n\nS：休眠状态（sleeping）\n\nR：等待运行（runable）R\
    \ or runnable (on run queue）进程处于运行或就绪\n\nI：空闲状态（idle）\n\nZ：僵尸状态（zombie）\n\nT：跟踪状态（Traced）\n\
    \nB：进程正在等待内存页\n\nD: 不可中断的深度睡眠，一般由IO引起，同步IO在读或写操作时，cpu不能其它事情，只能等待，这时进程处于这种状态，如果程序采用异步IO，这种状态应该很少见到其中就绪状态表示进程已经分配到CPU以外的资源，等CPU调度时就可以马上执行了。运行状态就是正在运行了，获得CPU在内的所有资源。等待状态表示因某个事件而没有执行，这时候不耗CPU时间，而这个时间可能是等待IO、申请不到缓冲区或者等待信号。进程的运行过程也就是状态转换的过程。例如就绪状态的进程只要等到CPU调度时就马上转为运行状态，一旦它需要的IO操作还没有返回时，进程状态也就转换成等待状态。进程状态间转换还有很多，这里不一一细叙，马上去学习进程退出吧。\n\
