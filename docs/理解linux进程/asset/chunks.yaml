- fmt: "\n```\n package main\n\nimport (\n  \"fmt\"\n  \"os\"\n  \"syscall\"\n)\n\n\
    func main() {\n    mask := syscall.Umask(0)\n    defer syscall.Umask(mask)\n\n\
    \    err := os.MkdirAll(\"/tmp/gotest/\", 0777)\n    if err != nil {\n      panic(err)\n\
    \    }\n\n    fmt.Println(\"Mkdir /tmp/gotest/\")\n} \n```\n\n### 注意事项\n\n这并不是`Go`的`Bug`，包括Linux系统调用都是这样的，创建目录除了给定的权限还要加上系统的`Umask`，`Go`也是如实遵循这种约定。\n\
    \n如果你想达到你的预期权限，知道`Umask`及其用法是必须的。\n\n### 捕获SIGKILL\n\n`SIGKILL`是常见的Linux信号，我们使用`kill`命令杀掉进程也就是像向进程发送`SIGKILL`信号。\n\
    \n和其他信号不同，[SIGKILL](https://en.wikipedia.org/wiki/Unix_signal#SIGKILL)和`SIGSTOP`是不可被Catch的，因此下面的代码是能编译通过但也是无效的，更多细节可以参考[golang/go#9463](https://github.com/golang/go/issues/9463).\n\
    \n```\n c := make(chan os.Signal, 1)\nsignal.Notify(c, syscall.SIGKILL, syscall.SIGSTOP)\
    \ \n```\n\n### 注意事项\n\n这是Linux内核的限制，这种限制也是为了让操作系统有可能控制进程的生命周期，理解后我们也不应该去尝试捕获`SIGKILL`。\n\
    \n不过还是有人这样去做，最后结果也不符合预期，这需要我们对底层有足够的理解。\n\n### 系统调用sendfile\n\n[Sendfile](http://man7.org/linux/man-pages/man2/sendfile.2.html)是Linux实现的系统调用，可以通过避免文件在内核态和用户态的拷贝来优化文件传输的效率。\n\
    \n其中大名鼎鼎的分布式消息队列服务`Kafka`就使用`sendfile`来优化效率，具体用法可参见其[官方文档](http://kafka.apache.org/documentation.html)。\n\
    \n### 优化策略\n\n在普通进程中，要从磁盘拷贝数据到网络，其实是需要通过系统调用，进程也会反复在用户态和内核态切换，频繁的数据传输在此有效率问题。因此我们必须意识到Linux给我们提供了`sendfile`这样的系统调用，可以提高进程的数据传输效率。\n\
