    \n## 共享内存\n\n对于共享内存是好是坏，学习一下。不同进程之间内存空间是独立的，也就是说进程不能访问其他进程的内存。两个进程希望通过共享内存的方式通信，可以通过`mmap()`系统调用实现。\n\
    \n## Go实例\n\nGo也实现了`mmap()`函数支持共享内存，不过通过`cgo`来调用系统调用函数。`cgo`是什么？它是Go调用C语言模块的功能，这种调用很平台相关的，无法保证在Windows也能正确运行。具体代码参见[Golang对共享内存的操作](http://studygolang.com/articles/743)，我们也写一个简单易懂的例子。\n\
