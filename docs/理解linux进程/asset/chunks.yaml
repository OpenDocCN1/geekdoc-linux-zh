  trans: "\n\n```\npackage main\n\nimport \"flag\"\nimport \"fmt\"\n\nfunc main()\
    \ {\n  wordPtr := flag.String(\"word\", \"foo\", \"a string\")\n  numbPtr := flag.Int(\"\
    numb\", 42, \"an int\")\n  boolPtr := flag.Bool(\"fork\", false, \"a bool\")\n\
    \  var svar string\n  flag.StringVar(&svar, \"svar\", \"bar\", \"a string var\"\
    )\n\n  flag.Parse()\n\n  fmt.Println(\"word:\", *wordPtr)\n  fmt.Println(\"numb:\"\
    , *numbPtr)\n  fmt.Println(\"fork:\", *boolPtr)\n  fmt.Println(\"svar:\", svar)\n\
    \  fmt.Println(\"tail:\", flag.Args())\n} \n```\n\n运行结果如下，相比直接使用`os.Args`代码也简洁了不少。\n\
    \n```\n root@87096bf68cb2:/go/src# ./flag -word=opt -numb=7 -fork -svar=flag\n\
    word: opt\nnumb: 7\nfork: true\nsvar: flag\ntail: []\nroot@87096bf68cb2:/go/src#\
    \ ./flag -h\nUsage of ./flag:\n  -fork=false: a bool\n  -numb=42: an int\n  -svar=\"\
    bar\": a string var\n  -word=\"foo\": a string \n```\n\n使用 Go 获取进程参数是很简单的，不过一旦参数太多，最佳实践还是使用配置文件。\n\
    \n进程参数只有在启动进程时才能赋值，如果需要在程序运行时进行交互，就需要了解进程的输入与输出了。\n\n## 进程输入与输出\n\n每个进程操作系统都会分配三个文件资源，分别是标准输入(`STDIN`)、标准输出(`STDOUT`)和错误输出(`STDERR`)。通过这些输入流，我们能够轻易得从键盘获得数据，然后在显示器输出数据。\n\
    \n### 标准输入\n\n来自管道(`Pipe`)的数据也是标准输入的一种，我们写了以下的实例来输出标注输入的数据。\n\n```\npackage main\n\
    \nimport (\n  \"fmt\"\n  \"io/ioutil\"\n  \"os\"\n)\n\nfunc main() {\n  bytes,\
    \ err := ioutil.ReadAll(os.Stdin)\n  if err != nil {\n    panic(err)\n  }\n\n\
    \  fmt.Println(string(bytes))\n} \n```\n\n运行结果如下。\n\n```\n root@87096bf68cb2:/go/src#\
    \ echo string_from_stdin | go run stdin.go\nstring_from_stdin \n```\n\n### 标准输出\n\
    \n通过`fmt.Println()`把数据输出到屏幕上，这就是标准输出了，这里不太演示了。\n\n### 错误输出\n\n程序的错误输出与标准输出类似，这里暂不演示。\n\
    \n了解完进程一些基础概念，我们马上要深入学习并发与并行的知识了。\n\n## 并发与并行\n\n并发(`Concurrently`)和并行(`Parallel`)是两个不同的概念。借用\
    \ Go 创始人 Rob Pike 的说法，并发不是并行，并发更好。并发是一共要处理(`deal with`)很多事情，并行是一次可以做(`do`)多少事情。\n\
    \n举个简单的例子，华罗庚泡茶，必须有烧水、洗杯子、拿茶叶等步骤。现在我们想尽快做完这件事，也就是“一共要处理很多事情”，有很多方法实现实现并发，例如请多个人同时做，这就是并行。并行是实现并发的一种方式，但不是唯一的方式。我们一个人也可以实现并发，例如先烧水、然后不用等水烧开就去洗杯子，所以通过调整程序运行方式也可以实现并发。\n\
    \n### 大神讲解\n\n如果还不理解，建议看 Rob Pike 题为 Concurrency is not Parallelism 的[演讲 PPT](http://concur.rspace.googlecode.com/hg/talk/concur.html)和[演讲视频](http://blog.golang.org/concurrency-is-not-parallelism)。\n\
    \n我把演讲的 PPT 截图贴出来方便大家理解。\n\n## 总结\n\n总结一下，并行是实现并发的一种方式，在多核 CPU 的时代，并行是我们设计高效程序所要考虑的，那么进程是不是越多越好呢？\n\
    \n### 进程越多越好？\n\n前面提到多进程的并行可以提高并发度，那么进程是越多越好？一般遇到这种问题都回答不是，事实上，很多大型项目都不会同时开太多进程。\n\
    \n下面以支持 100K 并发量的 Nginx 服务器为例。\n\n### 举个例子: Nginx\n\nNginx 是一个高性能、高并发的 Web 服务器，也就是说它可以同时处理超过\
    \ 10 万个 HTTP 请求，而它建议的启动的进程数不要超过 CPU 个数，为什么呢？\n\n我们首先要知道 Nginx 是 Master-worker\
    \ 模型，Master 进程只负责管理 Worker 进程，而 Worker 进程是负责处理真实的请求。每个 Worker 进程能够处理的请求数跟内存有关，因为在\
    \ Linux 上 Nginx 使用了`epoll`这种多路复用的 IO 接口，所以不需要多线程做并行也能实现并发。\n\n而多进程有一个坏处就是带来了 CPU\
    \ 上下文切换时间，所以一味提高进程个数反而使系统性能下降。当然如果当前进程小于 CPU 个数，就没有充分利用多核的资源，所以 Nginx 建议 Worker\
    \ 数应该等于 CPU 个数。\n\n### 特殊情况\n\n我们想想进程数应该等于 CPU 数，但是如果进程有阻塞呢？这是是应该提高进程数增加并行数的。\n\
    \n在 Nginx 的例子中，如果 Nginx 主要负责静态内容的下载，而服务器内存比较小，大部分文件访问都需要读磁盘，时候进程很容易阻塞，所以建议提高下\
    \ Worker 数目。\n\n### 绑定 CPU\n\n一般情况下除了确保进程数等于 CPU 数，还可以绑定进程与 CPU，这就保证了最少的 CPU 上下文切换。\n\
    \n在 Nginx 中可以这样配置：\n\n```\nworker_processes 4;\ncpu_affinity 0;\n```\n\n这是通过系统调用`sched_setaffinity()`实现了，感兴趣可以学习这方面的。\n\
    \n## 进程状态\n\n根据进程的定义，知道进程是实体，可能是正在运行，也可能是停止的。网上总结进程一共 7 种状态，究竟怎么算呢，最好的方法还是看源码。\n\
    \n在`proc/array.c`文件中：\n\n```\n/*\n* The task array is a \"bitmap\" of states.\
    \ */\nstruct task_struct {\n  volatile long state; /* -1 unrunnable, 0 runnable,\
    \ >0 stopped */\n  void *stack;\n  atomic_t usage;\n  unsigned int flags; /* per\
    \ process flags, defined below */\n  unsigned int ptrace;\n};\nstatic const char\
    \ task_state[] = {\n  \"R (running)\",        /* 0 */\n  \"S (sleeping)\",   \
    \     /* 1 */\n  \"D (disk sleep)\",      /* 2 */\n  \"T (stopped)\",        /*\
    \ 4 */\n  \"t (tracing)\",        /* 8 */\n  \"X (dead)\",          /* 16 */\n\
    \  \"Z (zombie)\",         /* 32 */\n};\n```\n\n这真的是 Linux 的源码，可以看出进程一共 7 种状态，含义也清晰，注意其中`D`(`disk\
    \ sleep`) 称为不可中断睡眠状态(`uninterruptible sleep`)。\n\n### 进程状态\n\n通过[Ptrace](https://idea.popcount.org/2012-11-linux-process-states/)、[include/linux/sched.h](https://github.com/torvalds/linux/blob/master/include/linux/sched.h):\n\
    \n```\nstruct task_struct {\n  volatile long state;\n...\nenum {\n  TASK_RUNNING\
    \ = 0,\n  TASK_SLEEPING = 1,\n  TASK_UNINTERTIBLE = 2,\n  TASK_STOPPED = 4,\n\
    \  TASK_TRACING = 8,\n  TASK_DEAD = 16,\n  TASK_ZOMBIE = 32,\n};\n```\n\n通过`ps\
    \ aux`可以看到进程的状态。\n\nO：空闲状态\n\nS：休眠状态（sleeping）\n\nR：运行（running）\n\nD：不可中断睡眠（disk\
    \ sleep）\n\nT：停止（stopped）\n\nt：跟踪状态（tracing）\n\nZ：僵尸状态（zombie）\n\n## 退出码\n\n任何进程退出时，都会留下退出码，操作系统根据退出码知道进程是否正常。\n\
    \n退出码是 0 到 255 的整数，通常 0 表示正常退出，其他数字表示不同的。\n\n### 示例程序\n\n```\npackage main\n\n\
    func main() {\n  panic(\"Call panic()\")\n} \n```\n\n### 运行结果\n\n```\n root@fa13d04397a:/go/src#\
    \ go run exit_code.go\npanic: Call panic()\n\ngoroutine 16 [running]:\nruntime.panic(0x425900,\
    \ 0xc208000010)\n/usr/src/go/src/pkg/runtime/panic.c:279 +0xf5\nmain.main()\n\
    /go/src/exit_code.go:4 +0x61\n\ngoroutine 17 [runnable]:\nruntime.MHeap_Scavenger()\n\
    /usr/src/go/src/pkg/runtime/mheap.c:507\nruntime.goexit()\n/usr/src/go/src/pkg/runtime/proc.c:1445\n\
    \ngoroutine 18 [runnable]:\nbgsweep()\n/usr/src/go/src/pkg/runtime/mgc0.c:1976\n\
    runtime.goexit()\n/usr/src/go/src/pkg/runtime/proc.c:1445\nexit status 2 \n```\n\
    \n"
- fmt: "\n# 活锁概念\n\n相对于死锁，活锁(`Livelock`)是什么概念呢？有意思的是，百度百科把这个解释错了。\n\n```\n 如果事务T1封锁了数据R,事务T2又请求封锁R，于是T2等待。T3也请求封锁R，当T1释放了R上的封锁后，系统首先批准了T3的请求，T2仍然等待。然后T4又请求封锁R，当T3释放了R上的封锁之后，系统又批准了T4的请求......T2可能永远等待。\
    \ \n```\n\n这显然是饿死(`Starvation`)的定义，进入活锁的进程是没有阻塞的，会继续使用`CPU`，但外界看到整个进程都没有前进。\n\n\
    # 活锁实例\n\n举个简单的例子，两个人相向过独木桥，他们同时向一边谦让，这样两个人都过不去，然后二者同时又移到另一边，这样两个人又过不去了。如果不受其他因素干扰，两个人一直同步在移动，但外界看来两个人都没有前进，这就是活锁。\n\
    \n活锁会导致`CPU`耗尽的，解决办法是引入随机变量、增加重试次数等。\n\n所以活锁也是程序设计上可能存在的问题，导致进程都没办法运行下去了，还耗`CPU`。\n\
    \n接下来介绍本章最大的内容，`POSIX`。\n\n# POSIX简介\n\n`POSIX`(Portable Operation System Interface)听起来好高端，就是一种操作系统的接口标准，至于谁遵循这个标准呢？就是大名鼎鼎的`Unix`和`Linux`了，有人问`Mac\
    \ OS`是否兼容`POSIX`呢，答案是`Yes`苹果的操作系统也是`Unix-based`。\n\n有了这个规范，你就可以调用通用的`API`了，`Linux`提供的`POSIX`系统调用在`Unix`上也能执行，因此学习`Linux`的底层接口最好就是理解`POSIX`标准。\n\
    \n补充一句，目前很多编程语言(`Go`、`Java`、`Python`、`Ruby`等)都是天生跨平台的，因此我们很少注意系统调用的兼容性。实际上`POSIX`提供了这些语言上跨平台的语义，而且这是源码级别的保证。\n\
    \n# POSIX规范\n\n`POSIX`是一些`IEEE`标准，包括`1003.0`、`1003.1`、`1003.1b`和`2003`等，实际上连`Linux`也没有完全兼容这些定义，不过只用`Linux`来学习`POSIX`足够了。\n\
    \n鉴于绝大多数程序员都没看过`IEEE`文档，我们就翻一下[IEEE 1003.1-2001](http://wenku.baidu.com/link?url=8dfQAy-mpeNdkDzX1LWCCEJia5x4_pS-Br6alnnrNweN8HxyXbHewGnxrPgFhQ3TzaAodlfHay9KiAuOmKbWvfSUr-36XyFIDgokfCldgR7)吧。\n\
    \n篇幅跟论文差不多，大意就是修正`Base`标准存在的问题，这个文档没有增加新的接口，但是加了符号、非函数的定义和保留更多命名空间。这是非常严谨的文档，感兴趣的同学可以读下，对普通的程序员我们还是以下的内容。\n\
    \n# POSIX进程\n\n我们运行`Hello World`程序时，操作系统通过`POSIX`定义的`fork`和`exec`接口创建起一个`POSIX`进程，这个进程就可以使用通用的`IPC`、信号等机制。\n\
    \n# POSIX线程\n\n`POSIX`也定义了线程的标准，包括创建和控制线程的`API`，在`Pthreads`库中实现，有关线程的知识有机会再深入学习。\n\
    \n# Nohup命令\n\n每个开发者都会躺过这个坑，在命令行跑一个后台程序，关闭终端后发现进程也退出了，网上搜一下发现要用`nohup`，究竟什么原因呢？\n\
    \n原来普通进程运行时默认会绑定`TTY`(虚拟终端)，关闭终端后系统会给上面所有进程发送`TERM`信号，这时普通进程也就退出了。当然还有些进程不会退出，这就是后面将会提到的守护进程。\n\
    \n`Nohup`的原理也很简单，终端关闭后会给此终端下的每一个进程发送`SIGHUP`信号，而使用`nohup`运行的进程则会忽略这个信号，因此终端关闭后进程也不会退出。\n\
    \n# 举个例子\n\n我们用`Go`实现最简单的`Web服务器`，代码`web_server.go`如下。\n\n```\n package main\n\
    \nimport (\n  \"fmt\"\n  \"net/http\"\n)\n\nfunc handler(w http.ResponseWriter,\
    \ r *http.Request) {\n    fmt.Println(\"Handle request\")\n}\n\nfunc main() {\n\
    \    http.HandleFunc(\"/\", handler)\n    http.ListenAndServe(\":8000\", nil)\n\
    } \n```\n\n然后在终端上运行，并测试一下。\n\n```\n ➜ go build web_server.go\n➜ ./web_server &\n\
    [1] 25967\n➜  wget 127.0.0.1:8000\n--2014-12-28 22:24:07--  http://127.0.0.1:8003/\n\
    Connecting to 127.0.0.1:8003... connected.\nHTTP request sent, awaiting response...\
    \ 200 OK\nLength: 5 [text/plain]\nSaving to: 'index.html.4'\n\n100%[======================>]\
    \ 5           --.-K/s   in 0s\n\n2014-12-28 22:24:07 (543 KB/s) - 'index.html'\
    \ saved [5/5] \n```\n\n如果关闭终端，`curl`命令就连不上我们的`Web服务器`了。如果使用`nohup`运行呢？\n\n```\n\
    \ ➜ go build web_server.go\n➜ nohup ./web_server &\n[1] 25968\n➜ exit\n➜ wget\
    \ 127.0.0.1:8003\n--2014-12-28 22:24:11--  http://127.0.0.1:8003/ \n```\n\n发现关闭终端对Web服务器进程没有任何影响，这正是我们预期的。这是运行守护进程最简单的方法，实际上标准的守护进程除了处理信号外，还要考虑这种因素，后面将会详述。\n\
    \n# 创建进程\n\n本章开始时演示了`Hello World`程序，其实已经创建了新的进程，通过`Bash`或者`zsh`这些`Shell`很容易创建新的进程，但`Shell`本身是怎么实现的呢？我们又能不能用`Go`实现类似`Shell`的功能呢？\n\
    \n# 系统调用\n\n原来这一切都是操作系统给我们做好的，然后暴露了使用的`API`接口，这就是系统调用。`Linux`或者其他`Unix-like`系统都提供了`fork()`和`exec()`等接口，`Bash`或者我们写的程序都可以通过调用这些接口来操作进程。\n\
    \n# Go创建进程\n\n而`Go`已经封装了与进程相关的接口，主要在`os/exec`这个`Package`中。通过使用封装好的接口，我们很容易就可以在自己的项目中调用其他进程了。\n\
    \n这一章已经介绍了这么多概念，马上会有实践环节，用`Go`实现多种方式来来创建和运行外部进程。\n\n# 第二章 Go编程实例\n\n学习完进程基础知识，我们通过几个`Go`编程实例介绍如果使用`Go`运行外部进程。\n\
    \n这章主要是编程练习，学习完这章后对进程的使用和`Go`对进程的使用应该都有更深的理解。\n\n# 衍生(Spawn)新进程\n\n这是来自`GoByExample`的例子，代码在`https://gobyexample.com/spawning-processes`。\n\
    \n能够执行任意`Go`或者非`Go`程序，并且等待放回结果，外部进程结束后继续执行本程序。\n\n# 代码实现\n\n```\n package main\n\
    \nimport \"fmt\"\nimport \"io/ioutil\"\nimport \"os/exec\"\n\nfunc main() {\n\
    \    dateCmd := exec.Command(\"date\")\n    dateOut, err := dateCmd.Output()\n\
    \    if err != nil {\n        panic(err)\n    }\n    fmt.Println(\"> date\")\n\
    \    fmt.Println(string(dateOut))\n\n    grepCmd := exec.Command(\"grep\", \"\
    hello\")\n    grepIn, _ := grepCmd.StdinPipe()\n    grepOut, _ := grepCmd.StdoutPipe()\n\
    \    grepCmd.Start()\n    grepIn.Write([]byte(\"hello grep\\ngoodbye grep\"))\n\
    \    grepIn.Close()\n    grepBytes, _ := ioutil.ReadAll(grepOut)\n    grepCmd.Wait()\n\
    \    fmt.Println(\"> grep hello\")\n    fmt.Println(string(grepBytes))\n\n   \
    \ lsCmd := exec.Command(\"bash\", \"-c\", \"ls -a -l -h\")\n    lsOut, err :=\
    \ lsCmd.Output()\n    if err != nil {\n        panic(err)\n    }\n    fmt.Println(\"\
    > ls -a -l -h\")\n    fmt.Println(string(lsOut))\n} \n```\n\n# 运行结果\n\n```\n $\
    \ go run spawning-processes.go\n> date\nWed Oct 10 09:53:12 UTC 2023\n> grep hello\n\
    hello\n> ls -a -l -h\ntotal 0\ndrwxr-xr-x 2 user group 4096 Oct 10 ..\n-rw-r--r--\
    \ 1 user group     0 Oct 10 spawning-processes.go\n```\n"
  raw: "### 活锁概念\n\n相对于死锁，活锁(Livelock)是什么概念呢？有意思的是，百度百科把这个解释错了。\n\n```\n 如果事务T1封锁了数据R,事务T2又请求封锁R，于是T2等待。T3也请求封锁R，当T1释放了R上的封锁后，系统首先批准了T3的请求，T2仍然等待。然后T4又请求封锁R，当T3释放了R上的封锁之后，系统又批准了T4的请求......T2可能永远等待。\
    \ \n```\n\n这显然是饿死(Starvation)的定义，进入活锁的进程是没有阻塞的，会继续使用CPU，但外界看到整个进程都没有前进。\n\n###\
    \ 活锁实例\n\n举个很简单的例子，两个人相向过独木桥，他们同时向一边谦让，这样两个人都过不去，然后二者同时又移到另一边，这样两个人又过不去了。如果不受其他因素干扰，两个人一直同步在移动，但外界看来两个人都没有前进，这就是活锁。\n\
    \n活锁会导致CPU耗尽的，解决办法是引入随机变量、增加重试次数等。\n\n所以活锁也是程序设计上可能存在的问题，导致进程都没办法运行下去了，还耗CPU。\n\
    \n接下来介绍本章最大的内容，POSIX。\n\n### POSIX简介\n\nPOSIX(Portable Operation System Interface)听起来好高端，就是一种操作系统的接口标准，至于谁遵循这个标准呢？就是大名鼎鼎的Unix和Linux了，有人问Mac\
    \ OS是否兼容POSIX呢，答案是Yes苹果的操作系统也是Unix-based的。\n\n有了这个规范，你就可以调用通用的API了，Linux提供的POSIX系统调用在Unix上也能执行，因此学习Linux的底层接口最好就是理解POSIX标准。\n\
    \n补充一句，目前很多编程语言(Go、Java、Python、Ruby等)都是天生跨平台的，因此我们很少注意系统调用的兼容性。实际上POSIX提供了这些语言上跨平台的语义，而且这是源码级别的保证。\n\
    \n### POSIX规范\n\nPOSIX是一些IEEE标准，包括1003.0、1003.1、1003.1b和2003等，实际上连Linux也没有完全兼容这些定义，不过只用Linux来学习POSIX足够了。\n\
    \n鉴于绝大多数程序员都没看过IEEE文档，我们就翻一下[IEEE 1003.1-2001](http://wenku.baidu.com/link?url=8dfQAy-mpeNdkDzX1LWCCEJia5x4_pS-Br6alnnrNweN8HxyXbHewGnxrPgFhQ3TzaAodlfHay9KiAuOmKbWvfSUr-36XyFIDgokfCldgR7)吧。\n\
    \n篇幅跟论文差不多，大意就是修正Base标准存在的问题，这个文档没有增加新的接口，但是加了符号、非函数的定义和保留更多命名空间。这是非常严谨的文档，感兴趣的同学可以读下，对普通的程序员我们还是以下的内容。\n\
    \n### POSIX进程\n\n我们运行Hello World程序时，操作系统通过POSIX定义的`fork`和`exec`接口创建起一个POSIX进程，这个进程就可以使用通用的IPC、信号等机制。\n\
    \n### POSIX线程\n\nPOSIX也定义了线程的标准，包括创建和控制线程的API，在Pthreads库中实现，有关线程的知识有机会再深入学习。\n\
    \n### Nohup命令\n\n每个开发者都会躺过这个坑，在命令行跑一个后台程序，关闭终端后发现进程也退出了，网上搜一下发现要用`nohup`，究竟什么原因呢？\n\
    \n原来普通进程运行时默认会绑定TTY(虚拟终端)，关闭终端后系统会给上面所有进程发送TERM信号，这时普通进程也就退出了。当然还有些进程不会退出，这就是后面将会提到的守护进程。\n\
    \n`Nohup`的原理也很简单，终端关闭后会给此终端下的每一个进程发送SIGHUP信号，而使用`nohup`运行的进程则会忽略这个信号，因此终端关闭后进程也不会退出。\n\
    \n### 举个例子\n\n我们用Go实现最简单的Web服务器，代码web_server.go如下。\n\n```\n package main\n\nimport\
    \ (\n  \"fmt\"\n  \"net/http\"\n)\n\nfunc handler(w http.ResponseWriter, r *http.Request)\
    \ {\n    fmt.Println(\"Handle request\")\n}\n\nfunc main() {\n    http.HandleFunc(\"\
    /\", handler)\n    http.ListenAndServe(\":8000\", nil)\n} \n```\n\n然后在终端上运行，并测试一下。\n\
    \n```\n ➜ go build web_server.go\n➜ ./web_server &\n[1] 25967\n➜  wget 127.0.0.1:8000\n\
    --2014-12-28 22:24:07--  http://127.0.0.1:8003/\nConnecting to 127.0.0.1:8003...\
    \ connected.\nHTTP request sent, awaiting response... 200 OK\nLength: 5 [text/plain]\n\
    Saving to: 'index.html.4'\n\n100%[======================>] 5           --.-K/s\
    \   in 0s\n\n2014-12-28 22:24:07 (543 KB/s) - 'index.html' saved [5/5] \n```\n\
    \n如果关闭终端，`curl`命令就连不上我们的Web服务器了。如果使用`nohup`运行呢？\n\n```\n ➜ go build web_server.go\n\
    ➜ nohup ./web_server &\n[1] 25968\n➜ exit\n➜ wget 127.0.0.1:8003\n--2014-12-28\
    \ 22:24:11--  http://127.0.0.1:8003/ \n```\n\n发现关闭终端对Web服务器进程没有任何影响，这正是我们预期的。这是运行守护进程最简单的方法，实际上标准的守护进程除了处理信号外，还要考虑这种因素，后面将会详述。\n\
    \n### 创建进程\n\n本章开始时演示了Hello World程序，其实已经创建了新的进程，通过`Bash`或者`zsh`这些Shell很容易创建新的进程，但Shell本身是怎么实现的呢？我们又能不能用Go实现类似Shell的功能呢？\n\
    \n### 系统调用\n\n原来这一切都是操作系统给我们做好的，然后暴露了使用的API接口，这就是系统调用。Linux或者其他Unix-like系统都提供了`fork()`和`exec()`等接口，Bash或者我们写的程序都可以通过调用这些接口来操作进程。\n\
    \n### Go创建进程\n\n而Go已经封装了与进程相关的接口，主要在`os/exec`这个Package中。通过使用封装好的接口，我们很容易就可以在自己的项目中调用其他进程了。\n\
    \n这一章已经介绍了这么多概念，马上会有实践环节，用Go实现多种方式来来创建和运行外部进程。\n\n### 第二章 Go编程实例\n\n学习完进程基础知识，我们通过几个Go编程实例介绍如果使用Go运行外部进程。\n\
    \n这章主要是编程练习，学习完这章后对进程的使用和Go对进程的使用应该都有更深的理解。\n\n### 衍生(Spawn)新进程\n\n这是来自GoByExample的例子，代码在[](https://gobyexample.com/spawning-processes)[https://gobyexample.com/spawning-processes](https://gobyexample.com/spawning-processes)。\n\
    \n它能够执行任意Go或者非Go程序，并且等待放回结果，外部进程结束后继续执行本程序。\n\n### 代码实现\n\n```\n package main\n\
    \nimport \"fmt\"\nimport \"io/ioutil\"\nimport \"os/exec\"\n\nfunc main() {\n\
    \    dateCmd := exec.Command(\"date\")\n    dateOut, err := dateCmd.Output()\n\
    \    if err != nil {\n        panic(err)\n    }\n    fmt.Println(\"> date\")\n\
    \    fmt.Println(string(dateOut))\n\n    grepCmd := exec.Command(\"grep\", \"\
    hello\")\n    grepIn, _ := grepCmd.StdinPipe()\n    grepOut, _ := grepCmd.StdoutPipe()\n\
    \    grepCmd.Start()\n    grepIn.Write([]byte(\"hello grep\\ngoodbye grep\"))\n\
    \    grepIn.Close()\n    grepBytes, _ := ioutil.ReadAll(grepOut)\n    grepCmd.Wait()\n\
    \    fmt.Println(\"> grep hello\")\n    fmt.Println(string(grepBytes))\n\n   \
    \ lsCmd := exec.Command(\"bash\", \"-c\", \"ls -a -l -h\")\n    lsOut, err :=\
    \ lsCmd.Output()\n    if err != nil {\n        panic(err)\n    }\n    fmt.Println(\"\
    > ls -a -l -h\")\n    fmt.Println(string(lsOut))\n} \n```\n\n### 运行结果\n\n```\n\
    \ $ go run spawning-processes.go\n> date\nWed Oct 10 09:53:11 PDT 2012\n> grep\
    \ hello\nhello grep\n> ls -a -l -h\ndrwxr-xr-x  4 mark 136B Oct 3 16:29 .\ndrwxr-xr-x\
    \ 91 mark 3.0K Oct 3 12:50 ..\n-rw-r--r--  1 mark 1.3K Oct 3 16:28 spawning-processes.go\
    \ \n```\n\n### 归纳总结\n\n因此如果你的程序需要执行外部命令，可以直接使用`exec.Command()`来Spawn进程，并且根据需要获得外部程序的返回值。\n\
    \n### 执行(Exec)外部程序\n\n这是来自GoByExample的例子，代码在[](https://gobyexample.com/execing-processes)[https://gobyexample.com/execing-processes](https://gobyexample.com/execing-processes)。\n\
    \n把新程序加载到自己的内存。\n\n与Spawn不同，执行外部程序并不会返回到原进程中，也就是让外部程序完全取代本进程。\n\n### 代码实现\n\n\
    ```\n package main\n\nimport \"syscall\"\nimport \"os\"\nimport \"os/exec\"\n\n\
    func main() {\n    binary, lookErr := exec.LookPath(\"ls\")\n    if lookErr !=\
    \ nil {\n        panic(lookErr)\n    }\n    args := []string{\"ls\", \"-a\", \"\
    -l\", \"-h\"}\n    env := os.Environ()\n    execErr := syscall.Exec(binary, args,\
    \ env)\n    if execErr != nil {\n        panic(execErr)\n    }\n} \n```\n\n###\
    \ 运行结果\n\n```\n $ go run execing-processes.go\ntotal 16\ndrwxr-xr-x  4 mark 136B\
    \ Oct 3 16:29 .\ndrwxr-xr-x 91 mark 3.0K Oct 3 12:50 ..\n-rw-r--r--  1 mark 1.3K\
    \ Oct 3 16:28 execing-processes.go \n```\n\n### 归纳总结\n\n如果你的程序就是用来执行外部程序的，例如后面提到的项目实例Run，那使用`syscall.Exec`执行外部程序就最合适了。注意调用该函数后，本进程后面的代码将不可能再执行了。\n\
    \n### 复制(Fork)进程\n\n如果我们仅仅想复制父进程的堆栈空间呢，很遗憾Go没有提供这样的接口，因为使用Spawn、Exec和Goroutine已经能覆盖绝大部分的使用案例了。\n\
    \n事实上无论是Spawn还是Exec都是通过实现Fork系统调用来实现的，后面将会详细介绍它的实现原理。\n\n### 第三章 进程进阶\n\n学习进程基础和Go编程时候后，我们会接触进程更底层的概念，包括信号、进程锁和系统调用等。\n\
    \n通过学习这章我们对进程的所有概念都了如指掌了，充分理解这些概念后有助于我们实现更高效的应用程序。\n\n### 进程锁\n\n这里的进程锁与线程锁、互斥量、读写锁和自旋锁不同，它是通过记录一个PID文件，避免两个进程同时运行的文件锁。\n\
    \n进程锁的作用之一就是可以协调进程的运行，例如[crontab使用进程锁解决冲突](http://www.live-in.org/archives/1036.html)提到，使用crontab限定每一分钟执行一个任务，但这个进程运行时间可能超过一分钟，如果不用进程锁解决冲突的话两个进程一起执行就会有问题。后面提到的项目实例Run也有类似的问题，通过进程锁可以解决进程间同步的问题。\n\
    \n使用PID文件锁还有一个好处，方便进程向自己发停止或者重启信号。Nginx编译时可指定参数`--pid-path=/var/run/nginx.pid`，进程起来后就会把当前的PID写入这个文件，当然如果这个文件已经存在了，也就是前一个进程还没有退出，那么Nginx就不会重新启动。进程管理工具Supervisord也是通过记录进程的PID来停止或者拉起它监控的进程的。\n\
    \n### 使用进程锁\n\n进程锁在特定场景是非常适用的，而操作系统默认不会为每个程序创建进程锁，那我们该如何使用呢？\n\n其实要实现一个进程锁很简单，通过文件就可以实现了。例如程序开始运行时去检查一个PID文件，如果文件存在就直接退出，如果文件不存在就创建一个，并把当前进程的PID写入文件中。这样我们很容易可以实和读锁，但是所有流程都需要自己控制。\n\
    \n当然根据DRY(Don't Repeat Yourself)原则，Linux已经为我们提供了`flock`接口。\n\n### 使用Flock\n\n\
    Flock提供的是advisory lock，也就是建议性的锁，其他进程实际上也可以读写这个锁文件。Linux上可以直接使用`flock`命令，使用C可以调用原生的`flock`接口，这里详细介绍Go\
    \ 1.3引入的`FcntlFock()`。\n\n我们封装了简单的接口。\n\n```\n // Control the lock of file.\n\
    func fcntlFlock(lockType int16, path ...string) error {\n  var err error\n  if\
    \ lockType != syscall.F_UNLCK {\n    mode := syscall.O_CREAT | syscall.O_WRONLY\n\
    \    lockFile, err = os.OpenFile(path[0], mode, 0666)\n    if err != nil {\n \
    \     return err\n    }\n  }\n\n  lock := syscall.Flock_t{\n    Start:  0,\n \
    \   Len:    1,\n    Type:   lockType,\n    Whence: int16(os.SEEK_SET),\n  }\n\
    \  return syscall.FcntlFlock(lockFile.Fd(), syscall.F_SETLK, &lock)\n} \n```\n\
    \n这样对进程加锁。\n\n```\n // Lock the file.\nfunc Flock(path string) error {\n  return\
    \ fcntlFlock(syscall.F_WRLCK, path)\n} \n```\n\n这样对进程解锁。\n\n```\n // Unlock the\
    \ file.\nfunc Funlock(path string) error {\n  err := fcntlFlock(syscall.F_UNLCK)\n\
    \  if err != nil {\n    return err\n  } else {\n    return lockFile.Close()\n\
    \  }\n} \n```\n\n学习完进程锁，我们开始了解各种进程，如孤儿进程、僵尸进程。\n\n### 孤儿进程概念\n\n我们经常听别人说到孤儿进程(Orphan\
    \ Process)，究竟是什么呢，现在我们一次理解透。\n\n根据[维基百科](http://zh.wikipedia.org/wiki/%E5%AD%A4%E5%84%BF%E8%BF%9B%E7%A8%8B)的解释，孤儿进程指的是在其父进程执行完成或被终止后仍继续运行的一类进程。\n\
    \n孤儿进程与僵尸进程是完全不同的，后面会详细介绍僵尸进程。而孤儿进程借用了现实中孤儿的概念，也就是父进程不在了，子进程还在运行，这时我们就把子进程的PPID设为1。前面讲PID提到，操作系统会创建进程号为1的init进程，它没有父进程也不会退出，可以收养系统的孤儿进程。\n\
    \n### 作用\n\n在现实中用户可能刻意使进程成为孤儿进程，这样就可以让它与父进程会话脱钩，成为后面会介绍的守护进程。\n\n### 僵尸进程\n\n\
    当一个进程完成它的工作终止之后，它的父进程需要调用wait()或者waitpid()系统调用取得子进程的终止状态。\n\n一个进程使用fork创建子进程，如果子进程退出，而父进程并没有调用wait或waitpid获取子进程的状态信息，那么子进程的进程描述符仍然保存在系统中。这种进程称之为僵死进程。\n\
    \n理解了孤儿进程和僵尸进程，我们临时加了守护进程这一小节，守护进程就是后台进程吗？没那么简单。\n\n### 守护(Daemon)进程\n\n我们可以认为守护进程就是后台服务进程，因为它会有一个很长的生命周期提供服务，关闭终端不会影响服务，也就是说可以忽略某些信号。\n\
    \n### 实现守护进程\n\n首先要保证进程在后台运行，可以在启动程序后面加`&`，当然更原始的方法是进程自己`fork`然后结束父进程。"
