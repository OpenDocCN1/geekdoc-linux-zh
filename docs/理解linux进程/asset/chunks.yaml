    \ 0       0\nFDSize: 256\nGroups:\nVmPeak:    20300 kB\nVmSize:    20300 kB\n\
    VmLck:         0 kB\nVmPin:         0 kB\nVmHWM:      3228 kB\nVmRSS:      3228\
