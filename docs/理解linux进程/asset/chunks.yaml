- fmt: "\n![](images/Cover.jpg)\n\n# 理解Linux进程\n\n## 关于这本书\n\n本书受[*理解Unix进程*](http://www.duokan.com/book/41446)启发而作，用极简的篇幅深入学习进程知识。\n\
    \n*理解Linux进程*用Go重写了所有示例程序，通过循序渐进的方法介绍Linux进程的工作原理和一切你所需要的概念。\n\n本书适合所有Linux程序员阅读。[在线阅读](http://www.linuxprocess.com)，[PDF下载](https://github.com/tobegit3hub/understand_linux_process/blob/master/understan_linux_process.pdf?raw=true)。\n\
    \n## 三位好朋友\n\n阅读前介绍三位即将与大家打交道的小伙伴：Linux、Go和Docker。\n\nLinux是我们主要的研究对象，书中所有概念与程序都基于Linux，这同样适用于所有Unix-like系统。\n\
    \n`Go`是本书所有示例程序的实现实现语言，当然进程的概念与原理是相通的，你也可以使用其他编程语言实现。\n\n`Docker`为我们创造可重复的实验环境，使用`Docker`容器你可以轻易地模拟与本书一模一样的运行环境。\n\
    \nThanks `Wawa Leung`\n\nOtherwise the book would be released two years ago\n\n\
    ## 本书概述\n\n进程的概念大家都很熟悉，但你是否能准确说出僵尸进程的含义呢？还有`COW(Copy On Write)`、`Flock(File Lock)`、`Epoll`和`Namespace`的概念又是否了解过呢？\n\
    \n本书汇集了进程方方面面的基础知识，加上编程实例，保证阅读后能自如地回答以上问题，在项目开发中对进程的优化也有更深的理解。\n\n## 本书架构\n\n\
    本书按循序渐进的方式介绍进程的基础概念和拓展知识，主要涵盖以下几个方面：\n\n* 进程的基础知识介绍\n* 进程相关的编程实例\n* 进程的进阶知识详解\n\
    * 项目Run的进程管理\n* 使用进程的注意事项\n\n其中项目[Run](https://github.com/runscripts/run)是`Go`实现的脚本管理工具，通过研究`Run`的源码能够加深对进程管理的理解。\n\
    \n## 关于勘误\n\n本书所有内容都托管到[GitHub](https://github.com/tobegit3hub/understand_linux_process)，如果纰漏或错误请提[Issue](https://github.com/tobegit3hub/understand_linux_process/issues/new)。\n\
    \n## 示例程序\n\n本书所有示例程序都基于`Go`编写，代码托管到[GitHub](https://github.com/tobegit3hub/understand_linux_process_examples)。\n\
    \n每章的示例都是可直接运行的`Go`源文件，例如第一章的Hellow World程序可以通过`go run hello_world.go`来运行并查看运行结果。\n\
    \n```\n# go run hello_world.go\nHello World \n```\n\n接下来介绍使用`Docker`来运行本书的示例程序。\n\
    \n### Docker简介\n\n[Docker](https://github.com/docker/docker)是一个容器运行平台，你可以将程序及其依赖打包成容器，在不同机器上运行可得到一致的运行效果。因为不同的系统环境或`Go`版本可能影响程序的运行结果，为了得到可预测、可重复的实验环境，我们引入了`Docker`容器技术。\n\
    \n### Docker使用\n\n我们不仅开源了示例代码，还创建了官方[Docker镜像](https://registry.hub.docker.com/u/tobegit3hub/understand_linux_process_examp/)。\n\
    \n只要执行命令`docker run -i -t tobegit3hub/understand_linux_process_examp`，就可以马上创建本书的实验环境。进入容器后可以轻易地运行示例程序。\n\
    \n```\nroot@6a8e36a53495:/go/src# go run hello_world.go\nHello World \n```\n\n\
    当然你也可以在本地运行自己的`Go`示例，或者使用官方`Go`镜像`docker run -i -t golang:1.4 /bin/bash`。\n\n\
    ## 第一章 进程基础\n\n作为本书的第一部分，主要介绍进程的`PID`、进程状态、退出码和`POSIX`等基础概念。\n\n网络有很多零散的资料介绍基础了，为什么还要花篇幅介绍这些呢？首先我们要保证看过这些章节的都能掌握这些概念，其次通过编写代码实例，我们还能动手验证这些概念，已经不能更赞了。\n\
    \n学习完这章我们应该能够准确回答出`PID`、`PPID`、进程名字、进程参数、进程状态、退出码、死锁、活锁、`POSIX`、`Nohup`等概念。\n\n\
    ### 进程的定义\n\n根据维基百科的[定义](http://zh.wikipedia.org/wiki/%E8%A1%8C%E7%A8%8B)，进程(`Process`)是计算机中已运行程序的实体。用户下达运行程序的命令后，就会产生进程。进程需要一些资源才能完成工作，如CPU使用时间、存储器、文件以及I/O设备，且为依序逐一进行，也就是每个CPU核心任何时间内仅能运行一项进程。。\n\
    \n我们简单总结下，进程就是代码运行的实体。这里补充一点，进程不一定都是正在运行的，也可能在等待调度或者停止，进程状态将在后续详细介绍。\n\n### 举个例子\n\
    \n进程的概念应该很好理解，因为我们都在写代码，这些代码跑起来了就是一个进程，为了完整性我们介绍最简单的Hello World进程。\n\n### Hello\
    \ World进程\n\nHello World程序是每门编程语言的入门示例，注意这个程序还不是进程哦，它的作用是在终端输出“Hello World”然后直接退出。\n\
    \n当我们运行Hello World程序时，系统就创建一个Hello World进程。这也是最简单的进程了，没有系统调用、进程间通信，输出字符串后退出了。\n\
    \n### Bash实现\n\n用`Bash`实现Hello World程序只需要一行代码，运行后新的进程也可以输出“Hello World”。\n\n```\n\
    root@87096bf8cb2:/go/src# echo Hello World\n```\n\n稍微提一下`echo`是Linux自带的程序，可以接受一个或多个参数，反正就是如实把它们输出到终端而已。这样最简单的进程就诞生了，当然也可以用`Go`重写程序。\n\
    \n### Go实现\n\n`Go`实现的源码参见`hello_world.go`。\n\n```\npackage main\n\nimport (\n\
    \  \"fmt\"\n)\n\nfunc main() {\n  fmt.Println(\"Hello World\")\n}\n```\n\n运行后得到输出。\n\
    \n```\nroot@87096bf8cb2:/go/src# go run hello_world.go\nHello World\n```\n\nHello进程运行时发生了什么，接下来我们将各个方面介绍。\n\
    \n### PID\n\n首先我们来学习`PID`这个概念，PID全称`Process ID`，是标识和区分进程的全局唯一的整数。Hello World运行时也有一个PID，只是它运行结束后释放了，我们可以通过`print_pid.go`显示当前进程。\n\
    \n### 示例程序\n\n`print_pid.go`的源码如下，通过`Getpid()`函数获得当前进程。\n\n```\npackage main\n\
    \nimport (\n  \"fmt\"\n  \"os\"\n)\n\nfunc main() {\n    fmt.Println(os.Getpid())\n\
    }\n```\n\n### 运行结果\n\n```\nroot@87096bf8cb2:/go/src# go run print_pid.go\n2922\n\
    root@87096bf8cb2:/go/src# go run print_pid.go\n2932\n```\n\n可以看出进程运行时是由操作系统分配的，同一个程序运行两次会产生进程，当然有两个PID。那PID究竟有什么用？稍后讨论，现在了解下PPID。\n\
    \n### PPID\n\n每个进程都一定有PPID，也就是父进程，通过`PPID`找到父进程。为什么进程都会有父进程呢？所有进程都是由它衍生出来的，后面详细介绍几种方法。方法，准确的，父进程的号为1，模型叫做进程树。\n\
    \n### 示例程序\n\n要想获得PPID，可以通过`Getppid()`函数获得，`ppid.go`代码如下。\n\n```go\npackage main\n\
    \nimport (\n  \"fmt\"\n  \"os\"\n)\n\nfunc main() {\n  fmt.Println(os.Getppid())\n\
    }\n```\n\n### 运行结果\n\n```\nroot@87096bf8cb2:/go/src# go run ppid.go\n2892\nroot@87096bf8cb2:/go/src#\
    \ go run ppid.go\n2902\n```\n\n有趣的事情是发现每次运行的进程ID都不一样，符合我们的预期，原来通过`go run`都会启动一个新的进程。\n\
    \n### 编译后运行\n\n如果我们先生成二进制文件再执行结果会怎样？\n\n```\nroot@87096bf8cb2:/go/src# go build\
    \ ppid.go\nroot@87096bf8cb2:/go/src# ./ppid\nroot@87096bf8cb2:/go/src# ps aux\
    \ | grep \"1\" | grep -v \"grep\"\nroot         1  0.0  0.3  2028  3184      \
    \  Ss   07:25:0:00 /bin/bash\n```\n\n这次发现父进程都是一样的，而且通过`ps`命令可以看到父进程就是`bash`，说明通过终端执行其实是从`bash`衍生出各种进程。为了执行这个程序要查找、打包。\n\
    \n### 使用PID\n\n拿到PID后，我们就可以通过`kill`命令结束进程了，也可以通过`kill -9`或其他数字向进程发送不同的信号。信号是个很重要的概念，我们后面会详细介绍，那么有了进程ID，我们也可以看看进程名字。\n\
    \n### 进程名字\n\n每个进程都一定有进程名字，例如我们运行`top`，进程名就是“top”，如果是自定义的程序呢？其实进程名一般都是程序。\n\n\
    ### Top\n\n在命令行执行`top`后，得到类似输出，可以看到目前有三个进程，PID分别是1、8和9。\n\n```\ntop -12:45:18\
    \ up 1 min,  0 users,  load average: 0.86, 0.51, 0.20\nTasks:   3,   1 running,\
    \   2 sleeping,   0 zombie\n%Cpu(s):  0.0 us,  0.0 sy,  0.0 ni,100.0 id,  0.0\
    \ wa,  0.0 hi,  0.0 st\nKiB Mem:   2056748 total,   301984 used,  1754764 free,\
    \    20984 buffers\nKiB Swap:  1427664 total,        0 used,  142764 free.   231376\
    \ cached Mem\nPID USER      PR  NI    VIRT    RES    SHR S  %CPU %MEM     TIME+\
    \ COMMAND\n1 root      20   0    4312    692    612 S   0.0  0.0   0:00.23 sh\n\
    8 root      20   0   20232   3048   2756 S   0.0  0.1   0:00.03 bash\n9 root \
    \     20   0   21904   2384   2060 R   0.0  0.1   0:00.00 top \n```\n\n### PS\n\
    \n执行`ps aux`后输出如下，其中`aux`参数让`ps`命令显示更详细的参数信息。前面PID为9的进程已经退出了，取而代之的是PID为11的进程。\n\
    \n```\nroot@fa13d0439d7a:/go/src# ps aux\nUSER       PID %CPU %MEM    VSZ   RSS\
    \ TTY      STAT START   TIME COMMAND\nroot         1  0.2  0.0   4312   692 ?\
    \        Ss   12:45   0:00 /bin/sh -c /bin/bash\nroot         8  0.0  0.1  20232\
    \  3224 ?        S    12:45   0:00 /bin/bash\nroot        11  0.0  0.0  17484\
    \  2000 ?        R+   12:46   0:00 ps aux \n```\n"
