  trans: "\n\n# Concept of Livelock\n\nCompared to deadlock, what is the concept of\
    \ `Livelock`? Interestingly, Baidu Baike explains this incorrectly.\n\n```\n 如果事务\
    \ T1 封锁了数据 R,事务 T2 又请求封锁 R，于是 T2 等待。T3 也请求封锁 R，当 T1 释放了 R 上的封锁后，系统首先批准了 T3 的请求，T2\
    \ 仍然等待。然后 T4 又请求封锁 R，当 T3 释放了 R 上的封锁之后，系统又批准了 T4 的请求......T2 可能永远等待。 \n```\n\n\
    This is clearly the definition of `Starvation`. Processes entering a livelock\
    \ are not blocked and continue to use the `CPU`, but the outside world sees the\
    \ process making no progress.\n\n# Livelock Instance\n\nTake a simple example:\
    \ two people are walking towards each other on a narrow plank bridge. They both\
    \ step to one side to yield, so neither can pass. Then they both move to the other\
    \ side, and again neither can pass. If not disturbed by other factors, they keep\
    \ moving in sync, but from an outside perspective, neither moves forward. This\
    \ is livelock.\n\nLivelock can exhaust the `CPU`. The solutions are to introduce\
    \ random variables, increase the number of retries, etc.\n\nTherefore, livelock\
    \ is also a possible problem in programming design, preventing processes from\
    \ running while still consuming `CPU`.\n\nNext is the most significant content\
    \ of this chapter: `POSIX`.\n\n# Introduction to POSIX\n\n`POSIX` (Portable Operation\
    \ System Interface) sounds high-end, it is simply an interface standard for operating\
    \ systems. Who follows this standard? The famous `Unix` and `Linux`. Someone asked\
    \ if `Mac OS` is compatible with `POSIX`; the answer is `Yes`, Apple's operating\
    \ system is also `Unix-based`.\n\nWith this specification, you can call generic\
    \ `APIs`. `POSIX` system calls provided by `Linux` can also execute on `Unix`,\
    \ so the best way to learn `Linux` low-level interfaces is to understand the `POSIX`\
    \ standard.\n\nTo add, many modern programming languages (`Go`, `Java`, `Python`,\
    \ `Ruby`, etc.) are natively cross-platform, so we rarely notice system call compatibility.\
    \ In fact, `POSIX` provides cross-platform semantics for these languages, and\
    \ this is a source-level guarantee.\n\n# POSIX Standard\n\n`POSIX` consists of\
    \ several `IEEE` standards, including `1003.0`, `1003.1`, `1003.1b`, and `2003`.\
    \ In fact, even `Linux` does not fully comply with these definitions, but using\
    \ `Linux` to learn `POSIX` is sufficient.\n\nGiven that most programmers have\
    \ never seen `IEEE` documents, let's look at [IEEE 1003.1-2001](http://wenku.baidu.com/link?url=8dfQAy-mpeNdkDzX1LWCCEJia5x4_pS-Br6alnnrNweN8HxyXbHewGnxrPgFhQ3TzaAodlfHay9KiAuOmKbWvfSUr-36XyFIDgokfCldgR7).\n\
    \nThe length is similar to a thesis. The main idea is to correct issues in the\
    \ `Base` standard. This document does not add new interfaces but adds symbols,\
    \ non-function definitions, and reserves more namespaces. This is a very rigorous\
    \ document; interested students can read it, but for ordinary programmers, we\
    \ focus on the following content.\n\n# POSIX Processes\n\nWhen we run a `Hello\
    \ World` program, the operating system creates a POSIX process through the `fork`\
    \ and `exec` interfaces defined by `POSIX`. This process can use generic mechanisms\
    \ like `IPC` and signals.\n\n# POSIX Threads\n\n`POSIX` also defines standards\
    \ for threads, including `APIs` for creating and controlling threads, implemented\
    \ in the `Pthreads` library. Thread knowledge can be studied in depth later.\n\
    \n# Nohup Command\n\nEvery developer has fallen into this trap: running a background\
    \ program in the command line, only to find the process exited after closing the\
    \ terminal. Searching online reveals the use of `nohup`. What is the reason?\n\
    \nActually, normal processes bind to a `TTY` (virtual terminal) by default. When\
    \ the terminal closes, the system sends a `TERM` signal to all processes above,\
    \ causing normal processes to exit. Of course, some processes do not exit; these\
    \ are the daemon processes mentioned later.\n\nThe principle of `nohup` is also\
    \ simple: when the terminal closes, a `SIGHUP` signal is sent to every process\
    \ under that terminal. Processes run with `nohup` ignore this signal, so they\
    \ do not exit when the terminal is closed.\n\n# Example\n\nWe implement a simple\
    \ `Web server` using `Go`. The code `web_server.go` is as follows:\n\n```\n package\
    \ main\n\nimport (\n  \"fmt\"\n  \"net/http\"\n)\n\nfunc handler(w http.ResponseWriter,\
    \ r *http.Request) {\n    fmt.Println(\"Handle request\")\n}\n\nfunc main() {\n\
    \    http.HandleFunc(\"/\", handler)\n    http.ListenAndServe(\":8000\", nil)\n\
    } \n```\n\nThen run it in the terminal and test it.\n\n```\n ➜ go build web_server.go\n\
    ➜ ./web_server &\n[1] 25967\n➜  wget 127.0.0.1:8000\n--2014-12-28 22:24:07-- \
    \ http://127.0.0.1:8003/\nConnecting to 127.0.0.1:8003... connected.\nHTTP request\
    \ sent, awaiting response... 200 OK\nLength: 5 [text/plain]\nSaving to: 'index.html.4'\n\
    \n100%[======================>] 5           --.-K/s   in 0s\n\n2014-12-28 22:24:07\
    \ (543 KB/s) - 'index.html' saved [5/5] \n```\n\nIf the terminal is closed, the\
    \ `curl` command cannot connect to our `Web server`. What if we run it with `nohup`?\n\
    \n```\n ➜ go build web_server.go\n➜ nohup ./web_server &\n[1] 25968\n➜ exit\n\
    ➜ wget 127.0.0.1:8003\n--2014-12-28 22:24:11--  http://127.0.0.1:8003/ \n```\n\
    \nWe find that closing the terminal has no effect on the Web server process, which\
    \ is what we expected. This is the simplest way to run a daemon. In fact, standard\
    \ daemons consider other factors beyond signal handling, which will be detailed\
    \ in later.\n\n# Creating Processes\n\nThe start of this chapter demonstrated\
    \ the `Hello World` program, which actually created a new process. It is easy\
    \ to create new processes using `Shells` like `Bash` or `zsh`, but how is the\
    \ `Shell` itself implemented? Can we implement `Shell` functionality using `Go`?\n\
    \n# System Calls\n\nActually, all of this is prepared by the operating system\
    \ and exposed through `API` interfaces; these are called system calls. `Linux`\
    \ and other `Unix-like` systems provide interfaces like `fork()` and `exec()`.\
    \ `Bash` or the programs we write can manipulate processes by calling these interfaces.\n\
    \n# Creating Processes in Go\n\n`Go` has encapsulated process-related interfaces,\
    \ primarily in the `os/exec` package. By using these encapsulated interfaces,\
    \ we can easily call other processes in our own projects.\n\nThis chapter has\
    \ introduced many concepts, and there will be practical sessions soon to use `Go`\
    \ to create and run external processes in various ways.\n\n# Chapter 2: Go Programming\
    \ Instances\n\nAfter learning the basics of processes, we introduce how to run\
    \ external processes using `Go` through several Go programming instances.\n\n\
    This chapter is mainly for programming practice. After completing it, you should\
    \ have a deeper understanding of process usage and how `Go` utilizes processes.\n\
    \n# Spawning New Processes\n\nThis is an example from `GoByExample`; the code\
    \ is at https://gobyexample.com/spawning-processes.\n\nIt can execute any `Go`\
    \ or non-`Go` program, wait for the result, and continue executing this program\
    \ after the external process ends.\n\n# Code Implementation\n\n```\n package main\n\
    \nimport \"fmt\"\nimport \"io/ioutil\"\nimport \"os/exec\"\n\nfunc main() {\n\
    \    dateCmd := exec.Command(\"date\")\n    dateOut, err := dateCmd.Output()\n\
    \    if err != nil {\n        panic(err)\n    }\n    fmt.Println(\"> date\")\n\
    \    fmt.Println(string(dateOut))\n\n    grepCmd := exec.Command(\"grep\", \"\
    hello\")\n    grepIn, _ := grepCmd.StdinPipe()\n    grepOut, _ := grepCmd.StdoutPipe()\n\
    \    grepCmd.Start()\n    grepIn.Write([]byte(\"hello grep\\ngoodbye grep\"))\n\
    \    grepIn.Close()\n    grepBytes, _ := ioutil.ReadAll(grepOut)\n    grepCmd.Wait()\n\
    \    fmt.Println(\"> grep hello\")\n    fmt.Println(string(grepBytes))\n\n   \
    \ lsCmd := exec.Command(\"bash\", \"-c\", \"ls -a -l -h\")\n    lsOut, err :=\
    \ lsCmd.Output()\n    if err != nil {\n        panic(err)\n    }\n    fmt.Println(\"\
    > ls -a -l -h\")\n    fmt.Println(string(lsOut))\n} \n```\n\n# Running Results\n\
    \n```\n $ go run spawning-processes.go\n> date\nWed Oct 10 09:53:12 UTC 2023\n\
    > grep hello\nhello\n> ls -a -l -h\ntotal 0\ndrwxr-xr-x 2 user group 4096 Oct\
    \ 10 ..\n-rw-r--r-- 1 user group 0 Oct 10 spawning-processes.go\n```\n\n"
