- fmt: ']# Subnets


    Dividing a larger network into smaller subnets increases efficiency and security.


    ## Division of a Network into Subnets:


    - Original network: `192.168.1.0/24`

    - Subnet 1: `192.168.1.0/26`

    - Subnet 2: `192.168.1.64/26`

    - Subnet 3: `192.168.1.128/26`

    - Subnet 4: `192.168.1.192/26`


    ## Advanced VLAN and Subnet Secrets


    ### Dynamic Configuration with VTP:


    Use VLAN Trunking Protocol (`VTP`) to manage VLANs across a larger network.


    ```sh

    enable

    configure terminal

    vtp mode server

    vtp domain mydomain

    ```


    ### Overlapping subnets:


    Use overlapping subnets to allow communication between different VLANs without
    the need for external routing.


    ## QoS (Quality of Service) implementation


    QoS is essential to ensure that critical applications receive the necessary network
    priority.


    ## QoS Configuration on a Cisco Switch


    ### Classification and Marking:


    ```sh

    enable

    configure terminal

    access-list 101 permit ip any any

    class-map match-all VOIP

    match access-group 101

    policy-map QOS_POLICY

    class VOIP

    set ip dscp ef

    ```


    ### Application of QoS Policies:


    ```sh

    interface FastEthernet0/1

    service-policy input QOS_POLICY

    ```


    ## Advanced QoS Secrets


    ### Congestion Control:


    Use Weighted Fair Queuing (`WFQ`) to manage congestion.


    ```sh

