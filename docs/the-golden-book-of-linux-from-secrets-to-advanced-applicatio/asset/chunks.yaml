    # 流行的 Linux 发行版


    - **CentOS**: 红帽企业级 Linux 的免费版本，因其稳定性被广泛用于服务器。

    - **Debian**: 以其稳健性和大型软件仓库而闻名。

    - **Arch Linux**: 适用于希望对系统拥有完全控制权级用户。


    对于初学者，我建议从 `Ubuntu` 或 `Fedora` 开始。这些发行版拥有完善的文档和庞大的支持社区。


    ## 准备安装工作


    一旦你选择了发行版，请从官方网站下载 ISO 镜像。你可以将此镜像刻录到 DVD，或者使用如 `Rufus`（适用于 Windows）或 `Etcher`（适用于
    Linux 和 macOS）等工具创建启动 USB 优盘。


    - **Rufus**: 使用简单，只需选择 ISO 镜像和 USB 设备即可。

    - **Etcher**: 跨平台且直观，它也支持多种 Linux 发行版。


    ## 安装 Linux


    将 USB 优盘或 DVD 插入电脑并重启。大多数系统允许你在启动过程中通过按下如 `F12`、`F10` 或 `ESC` 等键来选择启动设备。


    按照所选发行版的安装程序步骤操作。以下是一些让过程更轻松的小贴士：


    1. **分区**: 对于初学者，我建议使用自动分区选项。如果你觉得胜任，可以创建手动分区，但对于入门来说并不是必须的。

    2. **用户配置**: 创建一个具有管理员（`sudo`）权限的用户账户。选择一个强密码并记住它。

    3. **区域设置**: 根据你的喜好配置位置、语言和键盘布局。

    4. **附加软件**: 某些发行版允许你在安装期间安装额外的软件，例如多媒体解码器。安装这些包是一个良好的习惯，可以避免以后出现问题。


    安装完成后，拔掉优盘或 DVD 并重启系统。你将看到 Linux 登录界面，可以使用你创建的账户进行登录。


    ## 详细发行版介绍


    ### Ubuntu

    `Ubuntu` 无疑是最受欢迎的发行版之一，特别是对初学者而言。它基于 `Debian`，并提供了一个名为 `GNOME` 的用户友好图形界面。`Ubuntu`
    的发布周期是可预测的，每两年发布一个 `LTS`（长期支持）版本，保证五年的支持和更新。


    ### Fedora

    `Fedora` 以处于技术前沿而闻名。它由 `Red Hat` 赞助，通常用作最终出现在 `Red Hat Enterprise Linux` 中的技术的测试场。它对于想要尝试最新开发的开发者来说非常理想。


    ### CentOS

    `CentOS` 因其稳定性和与 `Red Hat Enterprise Linux` 的兼容性成为许多公司服务器的选择。尽管 `CentOS` 正在经历重大变化（随着
    `CentOS Stream` 的引入），但它仍然是生产环境的可靠选择。


    ### Debian

    `Debian` 以其稳健性和自由软件哲学而闻名。它拥有巨大的软件仓库，是许多其他发行版（包括 `Ubuntu`）的基础。对于任何想要稳定且可定制系统的人来说，`Debian`
    都是极佳的选择。


    ### Arch Linux

    `Arch Linux` 是为冒险者准备的。它提供了一种 DIY 方法，允许完全按照自己的想法配置系统。`Arch` 使用滚动更新模型，这意味着你始终可以访问最新版本的软件。


    ## Linux 目录结构


    你对 Linux 注意的第一点之一就是目录结构。与 Windows 不同（Windows 文件组织在 `C:`、`D:` 等磁盘驱动器中），在 Linux
    中，一切都是单一目录树的一部分。


    以下是最重要的目录：


    - `/`: 根目录，一切从这里开始。

    - `/bin`: 包含系统运行必需的二进制文件（命令），所有用户均可访问。

    - `/boot`: 启动系统所需的文件，例如内核和引导加载程序。

    - `/dev`: 设备文件。在 Linux 中，一切都被视为文件，包括硬件设备。

    - `/etc`: 系统配置文件。

    - `/home`: 用户个人目录。每个用户在这里都有自己的目录。

    - `/lib`: `/bin` 和 `/sbin` 目录中程序共享的必备库。

    - `/media`: 可移动介质设备（如 CD 和 USB 优盘）的挂载点。

    - `/mnt`: 文件系统的临时挂载点。

    - `/opt`: 可选软件，通常用于安装额外的软件包。

    - `/proc`: 虚拟文件系统，提供有关系统状态的信息。

    - `/root`: 根用户（管理员）的家目录。

    - `/run`: 自上次启动以的系统信息。

    - `/sbin`: 系统管理所需的二进制文件。

    - `/srv`: 系统提供的服务的特定数据。

    - `/tmp`: 临时文件。每次重启时都会清理。

    - `/usr`: 和用户文件。包含子目录，如用于用户二进制文件的 `/usr/bin`、用于库的 `/usr/lib` 以及用于共享数据的 `/usr/share`。

    - `/var`: 变量文件，例如日志和数据库。


    理解这种结构对于高效地导航和管理 Linux 系统至关重要。让我们探索一些帮助你在这些目录之间移动和操作文件的基础命令。


    ## 基础 Linux 命令


    终端是 Linux 中一个强大的工具。学习如何高效地使用它对任何 Linux 用户都至关重要。以下是你应该知道的一些基础命令：


    - `ls`: 列出目录内容。

    - `ls -l`: 详细列表。

    - `ls -a`: 隐藏文件。

    - `cd`: 切换当前目录。

    - `cd /home/user`: 进入用户家目录。

    - `cd ..`: 返回目录层级中的上一层。

    - `pwd`: 显示当前目录的完整路径。

    - `cp`: 复制文件或目录。

    - `cp file1 file2`: 复制 `file1` 到 `file2`。

    - `cp -r dir1 dir2`: 复制 `dir1` 到 `dir2`。

    - `mv`: 移动或重命名文件或目录。

    - `mv file1 file2`: 将 `file1` 移动或重命名为 `file2`。

    - `mv dir1 dir2`: 将 `dir1` 移动到 `dir2`。

    - `rm`: 删除文件或目录。

    - `rm file`: 删除 `file`。

    - `rm -r dir`: 删除 `dir` 及其内容。

    - `mkdir`: 创建新目录。

    - `mkdir new_directory`: 创建名为 `new_directory` 的目录。

    - `touch`: 创建空文件或更新修改时间。

    - `touch new_file`: 创建 `new_file`。

    - `nano`: 简单的非终端文本编辑器。

    - `nano file`: 使用 `nano` 打开 `file`。

    - `cat`: 显示文件内容。

    - `cat archive`: 在终端显示 `archive` 的内容。

    - `man`: 显示命令手册。

    - `man ls`: 显示 `ls` 命令的手册。


    ## 用户与权限管理


    Linux 管理中最重要的方面之一是用户和权限管理。我们将学习如何创建和管理用户账户、设置文件访问权限以及使用 `sudo` 以管理员身份运行命令。


    ### 创建和管理用户


    创建新用户使用 `adduser` 命令。例如：


    ```bash

    sudo adduser novo_user

    ```


    这会创建一个名为 `new_user` 的用户并为其定义家目录。在创建过程中，系统会要求设置密码和其他可选信息。


    删除用户使用 `deluser`：


    ```bash

    sudo deluser novo_user

    ```


    如果你想删除与该用户相关的家目录和文件，请添加 `--remove-home` ：


    ```bash

    sudo deluser --remove-home novo_user

    ```


    ### 文件权限


    在 Linux 中，每个文件和目录都有控制谁可以读取、写入或执行该文件的权限。这些权限分为三类：所有者、组和其他。


    要查看文件的权限，我们使用 `ls -l`：


    ```bash

    ls -l file

    ```


    输出将类似于：


    '
- fmt: '

    ```sh

    -rw-r--r-- 1 user group 4096 Jun  1 12:34 arquivo

    ```


    Here, `-rw-r--r--` represents the permissions:


    - `-`: File type (a `-` indicates a regular file).

    - `rw-`: Owner permissions (read and write).

    - `r--`: Group permissions (read).

    - `r--`: Permissions from others (read).


    To change permissions, we use `chmod`:


    ```sh

    chmod 755 file

    ```


    This sets the permissions to `rwxr-xr-x`, allowing the owner to read, write and
    execute, and the group and others to only read and execute.


    ### Using sudo


    The `sudo` command allows a user to execute commands with superuser (root) permissions.
    To add a user to the sudo group we use:


    ```sh

    sudo usermod -aG sudo user_name

    ```


    This adds `username` to the sudo group, allowing it to use `sudo` to run administrative
    commands.


    Throughout this chapter, we cover the essential fundamentals for getting started
    with Linux. From installation and configuration to managing users and permissions,
    you now have a solid foundation for exploring the world of Linux. In the next
    chapters, we''ll dive into more advanced topics, helping you become a true Linux
    master.


    Let''s go on this journey of learning and discovery together!


    # Chapter 2


    ## System Administration


    Welcome to the second chapter of "The Golden Book of Linux: From Secrets to Advanced
    Applications". If you''ve already familiarized yourself with the basics of Linux,
    now is the time to take the next step and delve deeper into systems administration.
    This chapter will guide you through some of the most crucial aspects of Linux
    systems administration, including package management, services and processes,
    resource monitoring, task automation, and data backup and recovery. Get ready
    to discover secrets that even many experts may not fully master.


    ## Package Management (apt, yum, dnf, etc.)


    Managing packages is one of the most fundamental tasks of a Linux systems administrator.
    Packages are collections of files that make up the software that you install on
    your system. There are several package management systems, each associated with
    different Linux distributions.


    ### APT (Advanced Package Tool)


    APT is the package management system used by Debian-based distributions such as
    Ubuntu. It makes it easy to install, update, and remove software packages.


    - Installation of packages: To install a new package, you use the `apt-get install`
    command. For example:


    ```sh

    sudo apt-get install package_name

    ```


    - System update: Keeping your system up to date is crucial for security and stability.
    To update all installed packages, use:


    ```sh

    sudo apt-get update

    sudo apt-get upgrade

    ```


    - Package removal: To remove a package you no longer need, use:


    ```sh

    sudo apt-get remove package_name

    ```


    ### YUM (Yellowdog Updater, Modified)


    YUM is mainly used by Red Hat-based distributions such as CentOS. It offers similar
    functionality to APT.


    - Installation of packages:


    ```sh

    sudo yum install package_name

    ```


    - System update:


    ```sh

    sudo yum update

    ```


    - Package removal:


    ```sh

    sudo yum remove package_name

    ```


    ### DNF (Dandified YUM)


    DNF is the successor to YUM and is used by distributions like Fedora. It improves
    dependency resolution and performance.


    - Installation of packages:


    ```sh

    sudo dnf install package_name

    ```


    - System update:


    ```sh

    sudo dnf update

    ```


    - Package removal:


    ```sh

    sudo dnf remove package_name

    ```


    ### Advanced Package Management Tips


    - Automatic Updates: Configure automatic updates to ensure your system is always
    up to date without manual intervention. On Debian-based distributions, you can
    use `unattended-upgrades`.


    ```sh

    sudo apt-get install unattended-upgrades

    sudo dpkg-reconfigure -plow unattended-upgrades

    ```


    - Custom Repositories: Add custom repositories to obtain software that is not
    available in standard repositories. For example, to add the Node.js repository:


    ```sh

    curl -fsSL https://deb.nodesource.com/setup_14.x | sudo -E bash -

    sudo apt-get install -y nodejs

    ```


    - Snapshots e Rollbacks: Use package snapshots to create restore points before
    updating critical packages. Tools like `apt-clone` can be useful:


    ```sh

    sudo apt-clone clone nome_do_snapshot

    sudo apt-clone restore nome_do_snapshot

    ```


    ## System Services and Processes


    Managing services and processes is essential to keep the system running smoothly.
    Services are programs that run in the background, performing essential tasks.
    Processes are instances of running programs.


    ### Service Management with systemd


    `systemd` is the most common boot system on modern Linux distributions. It manages
    services and processes from startup to shutdown.


    - Start and Stop Services: To start a service, use the `systemctl start` command:


    ```sh

    sudo systemctl start service_name

    ```


    To stop a service:


    ```sh

    sudo systemctl stop service_name

    ```


    - Enable and Disable Services: To enable a service to automatically start at boot:


    ```sh

    sudo systemctl enable service_name

    ```


    To disable:


    ```sh

    sudo systemctl disable service_name

    ```


    - Check Service Status: To check the status of a service:


    ```sh

    sudo systemctl status service_name

    ```


    - Restart Services: To restart a service:


    ```sh

    sudo systemctl restart service_name

    ```


    ### Process Management


    - List Processes: The `ps` command lists running processes:


    ```sh

    ps

    ```


    - Monitor Processes: Use `top` or `htop`:


    ```sh

    top

    htop

    ```


    - Kill Processes: To forcefully kill a process, use `kill -9`:


    ```sh

    kill -9

    ```


    ### Advanced Tips for Service and Process


    - Customized Service Units: Create custom service units to manage specific applications.
    For example, to create a service for Node.js:


    ```sh

    sudo nano /etc/systemd/system/meu_app.service

    ```


    Add the following content:


    ```ini

    [Unit]

    Description=My Node.js Application

    After=network.target


    [Service]

    ExecStart=/usr/bin/node /caminho/para/meu_app.js

    Restart=always

    User=nobody

    Group=nobody

    Environment=NODE_ENV=production

    WorkingDirectory=/path/to


    [Install]

    WantedBy=multi-user.target

    ```


    Then enable and start the service:


    ```sh

    sudo systemctl enable meu_app

    sudo systemctl start meu_app

    ```


    - Control Groups (cgroups): Use `cgroups` to limit and monitor resource usage
    by processes. For example, to create a cgroup that limits CPU for a service:


    ```sh

    sudo systemd-run --scope -p CPUQuota=20% command_do_name

    ```


    ## Resource and Performance Monitoring


    Monitoring system resources is crucial to maintaining performance and stability.
    Monitoring tools provide valuable insights into CPU, memory, disk, and network
    usage.


    ### Monitoring Tools


    - top e htop: Basic tools to monitor processes in real time.


    ```sh

    top

    htop

    ```


    - vmstat: Monitors virtual memory, processes and system:


    ```sh

    vmstat 2

    ```


    - iostat: Monitors system input/output statistics:


    ```sh

    iostat -xz 2

    ```


    - netstat: Monitors network connections, routing tables and network statistics:


    ```sh

    netstat -tuln

    ```


    - iftop: Monitors network bandwidth usage in real time:


    ```sh

    sudo apt-get install iftop

    sudo iftop

    ```


    - sar: Collects and reports system statistics, useful for historical performance
    analysis:


    ```sh

    sudo apt-get install sysstat

    sar -u 2 5

    ```


    ### System Monitoring with Prometheus and Grafana


    For advanced monitoring, consider using Prometheus and Grafana. Prometheus collects
    system and application metrics, while Grafana visualizes this data in interactive
    dashboards.


    - Installation of Prometheus:


    ```sh

    sudo apt-get update

    sudo apt-get install prometheus

    ```


    - Prometheus configuration: Edit the `/etc/prometheus/prometheus.yml` configuration
    file to define monitoring targets.


    - Installation of Grafana:

