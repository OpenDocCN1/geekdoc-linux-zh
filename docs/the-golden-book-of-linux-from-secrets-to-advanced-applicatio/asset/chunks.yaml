    sudo systemctl enable auditd

    sudo systemctl start auditd

    ```


    - Configuring Audit Rules:

    ```sh

    sudo nano /etc/audit/audit.rules

    # Add rules like:

    - -w /etc/passwd -p wa -k passwd_changes

    ```


    - Viewing Audit Logs:

    ```sh

    sudo ausearch -k passwd_changes

    sudo aureport -au

    ```


    ### Monitoring Tools


    - Tripwire:

