    ## SELinux 和 AppArmor 的实现


    ### SELinux (增强型 Linux)


    SELinux 是一种强制访问控制 (MAC) 实现，它将程序和用户限制在最所需的权限上。


    - 启用 SELinux：

    ```sh

    sudo apt-get install selinux

