    For permanent configurations, edit the system configuration files. On Debian-based
    distributions such as Ubuntu, this is done in the `/etc/network/interfaces` file.


    - Configuration example:


    ```sh

    car eth0

    iface eth0 inet static

    address 192.168.1.100

    netmask 255.255.255.0

    gateway 192.168.1.1

    ```


    On Red Hat-based distributions such as CentOS, configuration is done in files
    in the `/etc/sysconfig/network-scripts/` directory.


    - Configuration example:


    ```sh

    # /etc/sysconfig/network-scripts/ifcfg-eth0

    DEVICE=eth0

    BOOTPROTO=static

    IPADDR=192.168.1.100

    NETMASK=255.255.255.0

    GATEWAY=192.168.1.1

    ONBOOT=yes

    ```


    # Network Diagnostic Tools


    Diagnosing network problems is an essential skill for systems administrators.
    Linux offers several powerful tools to help you identify and resolve connectivity
    issues.


    ## Ping


    The `ping` command is used to test connectivity with another device on the network.
    It sends ICMP ECHO_REQUEST packets to the destination and waits for a response.


    - Example of use:


    ```sh

    ping 8.8.8.8

    ```


    ## Netstat


    `netstat` is a multifunctional tool that displays network connections, routing
    tables, interface statistics, masquerading and more.


    - Example of use:


    ```sh

    netstat -tuln

    ```


    ## Traceroute


    `traceroute` shows the route a packet takes to reach the destination. It is useful
    for diagnosing where network problems are occurring.


    - Example of use:


    ```sh

    traceroute google.com

    ```


    ## IP


    The `ip` command replaces `ifconfig` and `route`, offering a more modern and complete
    view of interfaces and routing tables.


    - Example of use:


    ```sh

    ip addr show

    ip route show

    ```


    ## MTR (My Traceroute)


    `mtr` combines the functionality of `ping` and `traceroute`, providing continuous
    analysis of network route and latency.


    - Example of use:


    ```sh

    mtr google.com

    ```


    ## Tcpdump


    `tcpdump` is a packet capture tool that allows you to inspect network traffic
    in real time. It is extremely useful for detailed analysis of network issues.


    - Example of use:


    ```sh

    sudo tcpdump -i eth0

    ```


    # Server Configuration


    Configuring network servers is a common task for system administrators. Let''s
    explore the configuration of some of the most important servers.


    ## DHCP Server


    The DHCP server automates the assignment of IP addresses on the network. On Ubuntu,
    `isc-dhcp-server` is a popular choice.


    - Installation:


    ```sh

    sudo apt-get install isc-dhcp-server

    ```


    - Settings:


    Edit the `/etc/dhcp/dhcpd.conf` file to configure the IP address range and other
    options.


    ```sh

    subnet 192.168.1.0 netmask 255.255.255.0 {

    range 192.168.1.100 192.168.1.200;

    option routers 192.168.1.1;

    option domain-name-servers 8.8.8.8, 8.8.4.4;

    }

    ```


    - Start the service:


    ```sh

    sudo systemctl start isc-dhcp-server

    sudo systemctl enable isc-dhcp-server

    ```


    ## DNS Server


    The DNS server translates domain names into IP addresses. `BIND` is the most common
    DNS software on Linux.


    - Installation:


    ```sh

    sudo apt-get install bind9

    ```


    - Settings:


    Edit the `/etc/bind/named.conf.local` file to define DNS zones.


    ```sh

    zone "meudominio.com" {

    type master;

    file "/etc/bind/db.meudominio.com";

    };

    ```


    Create the zone file `/etc/bind/db.mydomain.com`:


    ```sh

    $TTL 604800

    @   IN  SOA ns1.meudominio.com. admin.meudominio.com. (

    2021041501 ; Serial

    604800     ; Refresh

    86400      ; Retry

    2419200    ; Expire

    604800 )   ; Negative Cache TTL

    @   IN  NS  ns1.meudominio.com.

    ns1 IN  A   192.168.1.1

    @   IN  A   192.168.1.1

    ```


    - Start the service:


    ```sh

    sudo systemctl start bind9

    sudo systemctl enable bind9

    ```


    ## Servidor FTP


    The FTP server allows you to transfer files between devices on the network. `vsftpd`
    is a popular choice.


    - Installation :


    ```sh

    sudo apt-get install vsftpd

    ```


    - Settings:


    Edit the `/etc/vsftpd.conf` file to configure the FTP server.


    ```sh

    anonymous_enable=NO

    local_enable=YES

    write_enable=YES

    ```


    - Start the service:


    ```sh

    sudo systemctl start vsftpd

    sudo systemctl enable vsftpd

    ```


    # Advanced Secrets in Server Configuration


    - **Custom Logs**: Configure detailed logs to monitor server behavior and detect
    problems early.


    ```sh

    # For BIND, add it to named.conf

    logging {

    channel default_log {

    file "/var/log/named.log" versions 3 size 5m;

    severity info;

    print-time yes;

    };

    category default { default_log; };

    };

    ```


    - **Chroot Jails**: Run services in a chroot environment to increase security.
    For example, for `vsftpd`, you can configure the chroot environment in the configuration
    file:


    ```sh

    chroot_local_user=YES

    ```


