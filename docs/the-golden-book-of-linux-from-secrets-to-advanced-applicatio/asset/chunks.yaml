    Security on Linux starts with a clear understanding of some fundamental principles.
    These form the basis for all security measures you will implement.


    ### Principle of Least Privilege


    This principle suggests that each program or user should have only the privileges
    necessary to perform its functions. This minimizes the risk of damage if an account
    is compromised.


    ### Regular Updates


    Keeping your system up to date is crucial. Vulnerabilities are constantly discovered,
    and developers release patches to fix these flaws. Use tools like `apt`, `yum`
    or `dnf` to keep your system and packages up to date.


    - Example with `apt`:


    ```sh

    sudo apt-get update && sudo apt-get upgrade -y

    ```


    ### Strong Passwords


    Weak passwords are an open door for attackers. Use strong and unique passwords
    for each account. Tools like `pwgen` can help generate strong passwords.


    - Generating passwords with `pwgen`:


    ```sh

    sudo apt-get install pwgen

    pwgen -s 16 1

    ```


    ### Firewall configuration (iptables, ufw)


    A firewall is the first line of defense against attacks. Configuring a firewall
    correctly can block unwanted access and protect your system from intrusions.


    #### Using iptables


    `iptables` is a powerful tool for configuring firewall rules on Linux. It allows
    you to define precise rules to control incoming and outgoing traffic.


    - Basic `iptables` rule:


    ```sh

    sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    sudo iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

    sudo iptables -A INPUT -p icmp -j ACCEPT

    sudo iptables -P INPUT DROP

    ```


    - Saving the rules:


    ```sh

    sudo sh -c "iptables-save > /etc/iptables/rules.v4"

    ```


    #### Usando UFW (Uncomplicated Firewall)


    For those who prefer a simpler tool, `ufw` offers a user-friendly interface for
    configuring the firewall.


    - Enabling `UFW`:


    ```sh

    sudo ufw enable

    ```


    - Allowing SSH:


    ```sh

    sudo ufw allow ssh

    ```


    - Viewing status:


    ```sh

    sudo ufw status

    ```


    ### Advanced Firewall Configuration Secrets


    - Rate Limiting com `iptables`: Limit the number of connections to prevent brute
    force attacks.


    ```sh

    sudo iptables -A INPUT -p tcp --dport 22 -m conntrack --ctstate NEW -m recent
    --set

    sudo iptables -A INPUT -p tcp --dport 22 -m conntrack --ctstate NEW -m recent
    --update --seconds 60 --hitcount 10 -j DROP

    ```


    - Logging com `UFW`: Enable event logging to monitor suspicious activity.


    ```sh

    sudo ufw logging on

    ```


    ### Access Control (PAM, sudoers)


    Controlling who can access what on your system is critical. Let''s explore access
    control using `PAM` (Pluggable Authentication Modules) and the `sudoers` file.


    #### Configuring PAM


    `PAM` offers a flexible way to implement authentication policies.


    - Configuration file: `PAM` settings are located in `/etc/pam.d/`. An example
    configuration to limit failed login attempts is to add the following line to `/etc/pam.d/common-auth`:


    ```sh

    auth required pam_tally2.so onerr=fail deny=5 unlock_time=600

    ```


    #### sudo management


    The `sudoers` file defines which users can run commands as root. Edit it using
    `visudo` to avoid syntax errors.


    - Example of `sudoers` configuration:


    ```sh

    # Allow user ''diego'' to run all commands as root

    diego ALL=(ALL) ALL

    # Allow ''admin'' group to run specific commands without password

    %admin ALL=NOPASSWD: /usr/bin/apt-get, /usr/bin/systemctl

    ```


    ### Advanced Access Control Secrets


    - Two-Factor Authentication (2FA): Increase security by adding 2FA with Google
    Authenticator.


    ```sh

    sudo apt-get install libpam-google-authenticator

    google-authenticator

    # Add the line at the end of /etc/pam.d/sshd

    auth required pam_google_authenticator.so

    ```


    - Role-Based Access Control (RBAC): Use `RBAC` to grant permissions based on specific
    roles, making permissions administration more efficient.


    ### Hardening do Sistem a


    The hardening process involves applying additional security settings to reduce
    the system''s attack surface.


    ### Disabling Unnecessary Services


    Fewer services running means fewer entry points for attacks. Identify and disable
    services that are not needed.


    - Listing services:


    ```sh

    sudo systemctl list-units --type=service --state=running

    ```


    - Deactivating a service:


    ```sh

    sudo systemctl disable service_name

    sudo systemctl stop service_name

    ```


    ### SSH Configuration


    SSH configuration is critical for security. Some good practices include:


    - Disable root logins: Edite `/etc/ssh/sshd_config` e defina:


    ```sh

    PermitRootLogin no

    ```


    - Use key authentication: Disable password authentication and use SSH keys.


    ```sh

    PasswordAuthentication no

    ```


    - Change default port: Change the default port from 22 to reduce the chance of
    automated attacks.


    ```sh

    Port 2222

    ```


    ### Advanced Hardening Secrets


    - AppArmor e SELinux: Use `AppArmor` or `SELinux` to enforce security policies
    on specific applications, limiting what they can do.


    ```sh

    sudo apt-get install apparmor

    sudo aa-enforce /etc/apparmor.d/usr.sbin.mysqld

    ```


    - Kernel Hardening: Apply kernel security patches such as `Grsecurity`.


    ### Security Incident Detection and Response


    Detecting and responding quickly to security incidents is crucial. Appropriate
    tools and processes can help identify and mitigate threats.


    #### Monitoring Tools


    - OSSEC: An intrusion detection system (HIDS) that monitors logs, files and processes.


    ```sh

    sudo apt-get install ossec

    ```


    - Auditd: Tool for auditing and monitoring security events on Linux.


    ```sh

    sudo apt-get install auditd

    ```


    #### OSSEC Configuration


    - Installation:


    ```sh

    sudo apt-get install ossec-hids

    ```


    - Basic configuration: Edit `/var/ossec/etc/ossec.conf` configuration file to
    define which logs and events should be monitored.


    #### Auditd Configuration


    - Installation:


    ```sh

    sudo apt-get install auditd audisp-plugins

    ```


    - Basic configuration: Edit `/etc/audit/audit.rules` to define audit rules. Example
    for monitoring important files:


    ```sh

    -w /etc/passwd -p wa -k passwd_changes

    ```


    #### Incident Response Processes


    - Identification: Use tools like `logwatch` to analyze logs and identify suspicious
    activity.


    ```sh

    sudo apt-get install logwatch

    sudo logwatch --detail high --service sshd --range today

    ```


    - Containment: Isolate compromised systems to prevent the attack from spreading.
    Use `iptables` to block traffic from suspicious IPs.


    ```sh

    sudo iptables -A INPUT -s IP_SUSITO -j DROP

    ```


    - Eradication and Recovery: Remove malware, apply patches, and restore data from
    backups. Tools like `rkhunter` can help identify rootkits.


    ```sh

    sudo apt-get install rkhunter

    sudo rkhunter --check

    ```


    - Post-Incident Review: Document the incident, analyze the causes, and implement
    measures to prevent future attacks.


    ### Advanced Detection and Response Secrets


    - CHILDREN Rules: Use `YARA` to create custom rules that detect malware patterns
    in files and processes.


    ```sh

    sudo apt-get install already

    yara -r my_rules.yar /path/to/file

    ```


    - Sysmon for Linux: Use `Sysmon` to monitor detailed system events, providing
    additional visibility into malicious activity.

