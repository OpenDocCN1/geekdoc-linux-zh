- fmt: "\nImagine being able to simulate multiple computers within a single system,\
    \ each with its own configuration, or isolate applications in small portable containers\
    \ that work consistently in any environment. Welcome to the world of virtualization\
    \ and containers on Linux! In this chapter, we'll explore advanced techniques\
    \ and secrets that will transform your approach to managing virtual and containerized\
    \ environments.\n\n# Introduction to Virtualization (KVM, VirtualBox)\n\nVirtualization\
    \ allows you to run multiple operating systems on a single physical hardware.\
    \ This not only maximizes resource usage but also provides flexibility for testing\
    \ and development. The two most popular virtualization solutions on Linux are\
    \ `KVM` and `VirtualBox`.\n\n## KVM (Kernel-based Virtual Machine)\n\n`KVM` is\
    \ an open source virtualization solution that turns the Linux kernel into a hypervisor.\
    \ It is ideal for production environments due to its performance and kernel integration.\n\
    \n### KVM installation:\n\n```sh\nsudo apt-get install qemu-kvm libvirt-daemon-system\
    \ libvirt-clients bridge-utils\nsudo systemctl enable --now libvirtd\n```\n\n\
    ### Creating a Virtual Machine with KVM:\n\n```sh\nsudo virt-install \\\n--name\
    \ ubuntu-vm\\\n--ram 2048 \\\n--disk path=/var/lib/libvirt/images/ubuntu-vm.qcow2,size=10\
    \ \\\n--vcpus 2 \\\n--os-type linux \\\n--os-variant ubuntu20.04 \\\n--network\
    \ bridge=virbr0 \\\n--graphics none \\\n--console pty,target_type=serial \\\n\
    --location 'http://archive.ubuntu.com/ubuntu/dists/focal/main/installer-amd64/'\
    \ \\\n--extra-args 'console=ttyS0,115200n8 serial'\n```\n\n## VirtualBox\n\n`VirtualBox`\
    \ is a powerful and easy-to-use virtualization tool ideal for development and\
    \ testing environments.\n\n### VirtualBox installation:\n\n```sh\nsudo apt-get\
    \ install virtualbox\n```\n\n### Creating a Virtual Machine with VirtualBox:\n\
    \nOpen `VirtualBox` and follow the wizard to create a new virtual machine, specifying\
    \ the operating system, memory, hard disk and network settings.\n\n# Advanced\
    \ Virtualization Secrets\n\n### Snapshots com KVM: Use snapshots to capture the\
    \ state of a virtual machine and easily roll back changes.\n\n```sh\nsudo virsh\
    \ snapshot-create-as --domain ubuntu-vm snapshot1 \"Primeiro snapshot\"\nsudo\
    \ virsh snapshot-revert ubuntu-vm snapshot1\n```\n\n### Virtual Networks with\
    \ KVM: Configure virtual networks to isolate and connect virtual machines.\n\n\
    ```sh\nsudo virsh net-create mynetwork.xml\n```\n\n# Virtual Machine Management\n\
    \nManaging virtual machines efficiently is crucial to keeping your infrastructure\
    \ organized and optimized.\n\n## Managing with virsh\n\n`virsh` is a command-line\
    \ tool for managing virtual machines in `KVM`.\n\n### Listing Virtual Machines:\n\
    \n```sh\nsudo virsh list --all\n```\n\n### Starting and Stopping Virtual Machines:\n\
    \n```sh\nsudo virsh start ubuntu-vm\nsudo virsh shutdown ubuntu-vm\n```\n\n###\
    \ Monitoring Resources:\n\n```sh\nsudo virsh domstats ubuntu-vm\n```\n\n## Managing\
    \ with VirtualBox\n\n`VirtualBox` offers an intuitive GUI and powerful CLI for\
    \ management.\n\n### Listing Virtual Machines:\n\n```sh\nVBoxManage list vms\n\
    ```\n\n### Starting and Stopping Virtual Machines:\n\n```sh\nVBoxManage startvm\
    \ \"ubuntu-vm\" --type headless\nVBoxManage controlvm \"ubuntu-vm\" poweroff\n\
    ```\n\n### Adjusting Features:\n\n```sh\nVBoxManage modifyvm \"ubuntu-vm\" --memory\
    \ 4096 --cpus 4\n```\n\n# Advanced Management Secrets\n\n### Automation with Ansible:\
    \ Use Ansible to automate virtual machine management.\n\n```yaml\n- name: Manage\
    \ VMs with Ansible\nhosts: localhost\ntasks:\n  - name: Start VM\n    command:\
    \ virsh start ubuntu-vm\n```\n\n### Incremental backups with rsync: Perform incremental\
    \ backups of VM disks to save space and time.\n\n```sh\nrsync -av --progress /var/lib/libvirt/images/ubuntu-vm.qcow2\
    \ /backup/\n```\n\n# Introduction to Containers (Docker, Podman)\n\nContainers\
    \ are a lightweight virtualization technology that packages an application and\
    \ its dependencies in an isolated environment, ensuring that it works consistently\
    \ anywhere.\n\n## Docker\n\n`Docker` is the most popular container platform. It\
    \ allows you to create, distribute and run applications in containers.\n\n###\
    \ Docker installation:\n\n```sh\nsudo apt-get install docker-ce docker-ce-cli\
    \ containerd.io\nsudo systemctl enable --now docker\n```\n\n### Creating and Running\
    \ a Container:\n\n```sh\nsudo docker run -d --name meu-container -p 80:80 nginx\n\
    ```\n\n## Podman\n\n`Podman` is an alternative to `Docker` that does not require\
    \ a running daemon, increasing security and simplicity.\n\n### Podman installation:\n\
    \n```sh\nsudo apt-get install podman\n```\n\n### Creating and Running a Container:\n\
    \n```sh\npodman run -d --name meu-container -p 80:80 nginx\n```\n\n# Advanced\
    \ Container Secrets\n\n### Volumes Docker: Use volumes to persist data between\
    \ containers.\n\n```sh\nsudo docker volume create meu-volume\nsudo docker run\
    \ -d -v my-volume:/nginx-data\n```\n\n### Efficient Builds: Optimize your Dockerfiles\
    \ for faster, smaller builds.\n\n```dockerfile\nFROM node:14-alpine\nWORKDIR /app\n\
    COPY package*.json ./\nRUN npm install\nCOPY . .\nCMD [\"node\", \"app.js\"]\n\
    ```\n\n# Container and Image Management\n\nManaging containers and images efficiently\
    \ is essential to maintaining an organized and secure environment.\n\n## Management\
    \ with Docker CLI\n\n### Listing Containers and Images:\n\n```sh\nsudo docker\
    \ ps -a\nsudo docker images\n```\n\n### Stopping and Removing Containers:\n\n\
    ```sh\nsudo docker stop my-container\nsudo docker rm my-container\n```\n\n###\
    \ Removing Images:\n\n```sh\nsudo docker rmi nginx\n```\n\n## Management with\
    \ Podman\n\n### Listing Containers and Images:\n\n```sh\npodman ps -a\npodman\
    \ images\n```\n\n### Stopping and Removing Containers:\n\n```sh\npodman stop meu-container\n\
    podman rm meu-container\n```\n\n### Removing Images:\n\n```sh\npodman rmi nginx\n\
    ```\n\n## Advanced Management Secrets\n\n### Multi-stage Builds: Create smaller,\
    \ more images with multi-stage builds.\n\n```dockerfile\nFROM golang:16 as builder\n\
    WORKDIR /app\nCOPY . .\nRUN go build -o meuapp\nFROM alpine:latest\nWORKDIR /root/\n\
    COPY --from=builder /app/meuapp .\nCMD [\"./meuapp\"]\n```\n\n### Security with\
    \ Podman: Run containers without root privileges for greater security.\n\n```sh\n\
    podman run -d --name seguro -p 80:80 nginx\n```\n\n# Orchestration with Kubernetes\n\
    \nWhen it comes to managing large amounts of containers, `Kubernetes` is the tool\
    \ of choice. It automates container deployment, scaling, and operations.\n\n##\
    \ Minikube Installation\n\n`Minikube` is a tool that makes it easy to run `Kubernetes`\
    \ locally.\n\n### Minikube installation:\n\n```sh\ncurl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64\n\
    sudo install minikube-linux-amd64 /usr/local/bin/minikube\nminikube start\n```\n\
    \n## Creating a Deployment\n\n### Deployment file (nginx-deployment.yaml):\n\n\
    ```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: nginx-deployment\n\
    spec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: nginx\n  template:\n\
    \    metadata:\n      labels:\n        app: nginx\n    spec:\n      containers:\n\
    \      - name: nginx\n        image: nginx:1.14.2\n        ports:\n        - containerPort:\
    \ 80\n```\n\n### Applying Deployment:\n\n```sh\nkubectl apply -f nginx-deployment.yaml\n\
    ```\n\n# Managing Pods and Services\n\n### Listing Pods:\n\n```sh\nkubectl get\
    \ pods\n```\n\n### Creating a Service:\n\n```yaml\napiVersion: v1\nkind: Service\n\
    metadata:\n  name: nginx-service\nspec:\n  selector:\n    app: nginx\n  ports:\n\
    \    - protocol: TCP\n      port: 80\n      targetPort: 80\n  type: LoadBalancer\n\
    ```\n\n### Applying the Service:\n\n```sh\nkubectl apply -f nginx-service.yaml\n\
    ```\n\n# Advanced Orchestration Secrets\n\n### Autoscaling: Configure autoscaling\
    \ to automatically adjust the number of pods based on load.\n\n```yaml\napiVersion:\
    \ autoscaling/v1\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: nginx-hpa\n\
    spec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name:\
    \ nginx-deployment\n  minReplicas: 1\n  maxReplicas: 10\n  targetCPUUtilizationPercentage:\
    \ 50\n```\n\n### Deployments Canary e Blue-Green: Use advanced deployment strategies\
    \ to minimize the impact of updates and facilitate rollback.\n"
  raw: 'Imagine being able to simulate multiple computers within a single system,
    each with its own configuration, or isolate applications in small portable containers
    that work consistently in any environment. Welcome to the world of virtualization
    and containers on Linux! In this chapter, we''ll explore advanced techniques and
    secrets that will transform your approach to managing virtual and containerized
    environments.


    Introduction to Virtualization (KVM, VirtualBox)


    Virtualization allows you to run multiple operating systems on a single physical
    hardware. This not only maximizes resource usage but also provides flexibility
    for testing and development. The two most popular virtualization solutions on
    Linux are KVM and VirtualBox.


    KVM (Kernel-based Virtual Machine)


    KVM is an open source virtualization solution that turns the Linux kernel into
    a hypervisor. It is ideal for production environments due to its performance and
    kernel integration.


    - KVM installation:


    ```sh


    sudo apt-get install qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils


    sudo systemctl enable --now libvirtd


    ```


    - Creating a Virtual Machine with KVM:


    ```sh


    sudo virt-install \


    --name ubuntu-vm\


    --ram 2048 \


    --disk path=/var/lib/libvirt/images/ubuntu-vm.qcow2,size=10 \


    --vcpus 2 \


    --os-type linux \


    --os-variant ubuntu20.04 \


    --network bridge=virbr0 \


    --graphics none \


    --console pty,target_type=serial \


    --location ''http://archive.ubuntu.com/ubuntu/dists/focal/main/installer-amd64/''
    \


    --extra-args ''console=ttyS0,115200n8 serial''


    ```


    VirtualBox


    VirtualBox is a powerful and easy-to-use virtualization tool ideal for development
    and testing environments.


    - VirtualBox installation:


    ```sh


    sudo apt-get install virtualbox


    ```


    - Creating a Virtual Machine with VirtualBox:


    Open VirtualBox and follow the wizard to create a new virtual machine, specifying
    the operating system, memory, hard disk and network settings.


    Advanced Virtualization Secrets


    - Snapshots com KVM:  Use snapshots to capture the state of a virtual machine
    and easily roll back changes.


    ```sh


    sudo virsh snapshot-create-as --domain ubuntu-vm snapshot1 "Primeiro snapshot"


    sudo virsh snapshot-revert ubuntu-vm snapshot1


    ```


    - Virtual Networks with KVM:  Configure virtual networks to isolate and connect
    virtual machines.


    ```sh


    sudo virsh net-create mynetwork.xml


    ```


    Virtual Machine Management


    Managing virtual machines efficiently is crucial to keeping your infrastructure
    organized and optimized.


    Managing with virsh


    `virsh` is a command-line tool for managing virtual machines in KVM.


    - Listing Virtual Machines:


    ```sh


    sudo virsh list --all


    ```


    - Starting and Stopping Virtual Machines:


    ```sh


    sudo virsh start ubuntu-vm


    sudo virsh shutdown ubuntu-vm


    ```


    - Monitoring Resources:


    ```sh


    sudo virsh domstats ubuntu-vm


    ```


    Managing with VirtualBox


    VirtualBox offers an intuitive GUI and powerful CLI for management.


    - Listing Virtual Machines:


    ```sh


    VBoxManage list vms


    ```


    - Starting and Stopping Virtual Machines:


    ```sh


    VBoxManage startvm "ubuntu-vm" --type headless


    VBoxManage controlvm "ubuntu-vm" poweroff


    ```


    - Adjusting Features:


    ```sh


    VBoxManage modifyvm "ubuntu-vm" --memory 4096 --cpus 4


    ```


    Advanced Management Secrets


    - Automation with Ansible:  Use Ansible to automate virtual machine management.


    ```yaml


    - name: Manage VMs with Ansible


    hosts: localhost


    tasks:


    - name: Start VM


    command: virsh start ubuntu-vm


    ```


    - Incremental backups with rsync:  Perform incremental backups of VM disks to
    save space and time.


    ```sh


    rsync -av --progress /var/lib/libvirt/images/ubuntu-vm.qcow2 /backup/


    ```


    Introduction to Containers (Docker, Podman)


    Containers are a lightweight virtualization technology that packages an application
    and its dependencies in an isolated environment, ensuring that it works consistently
    anywhere.


    Docker


    Docker is the most popular container platform. It allows you to create, distribute
    and run applications in containers.


    - Docker installation:


    ```sh


    sudo apt-get install docker-ce docker-ce-cli containerd.io


    sudo systemctl enable --now docker


    ```


    - Creating and Running a Container:


    ```sh


    sudo docker run -d --name meu-container -p 80:80 nginx


    ```


    Podman


    Podman is an alternative to Docker that does not require a running daemon, increasing
    security and simplicity.


    - Podman installation:


    ```sh


    sudo apt-get install podman


    ```


    - Creating and Running a Container:


    ```sh


    podman run -d --name meu-container -p 80:80 nginx


    ```


    Advanced Container Secrets


    - Volumes Docker:  Use volumes to persist data between containers.


    ```sh


    sudo docker volume create meu-volume


    sudo docker run -d -v my-volume:/nginx-data


    ```


    - Efficient Builds:  Optimize your Dockerfiles for faster, smaller builds.


    ```dockerfile


    FROM node:14-alpine


    WORKDIR /app


    COPY package*.json ./


    RUN npm install


    COPY . .


    CMD ["node", "app.js"]


    ```


    Container and Image Management


    Managing containers and images efficiently is essential to maintaining an organized
    and secure environment.


    Management with Docker CLI


    - Listing Containers and Images:


    ```sh


    sudo docker ps -a


    sudo docker images


    ```


    - Stopping and Removing Containers:


    ```sh


    sudo docker stop my-container


    sudo docker rm my-container


    ```


    - Removing Images:


    ```sh


    sudo docker rmi image_id


    ```


    Management with Podman CLI


    - Listing Containers and Images:


    ```sh


    subjugation ps -a


    podman images


    ```


    - Stopping and Removing Containers:


    ```sh


    podman stop my-container


    podman rm my-container


    ```


    - Removing Images:


    ```sh


    podman rmi image_id


    ```


    Advanced Management Secrets


    - Multi-stage Image Builds:  Create smaller, more secure images with multi-stage
    builds.


    ```dockerfile


    FROM golang:1.16 as builder


    WORKDIR /app


    COPY . .


    RUN go build -o meuapp


    FROM alpine:latest


    WORKDIR /root/


    COPY --from=builder /app/meuapp .


    CMD ["./meuapp"]


    ```


    - Security with Podman:  Run containers without root privileges for greater security.


    ```sh


    podman unshare podman run -d --name seguro -p 80:80 nginx


    ```


    Orchestration with Kubernetes


    When it comes to managing large amounts of containers, Kubernetes is the tool
    of choice. It automates container deployment, scaling, and operations.


    Minikube Installation


    Minikube is a tool that makes it easy to run Kubernetes locally.


    - Minikube installation:


    ```sh


    curl -LO   https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64


    sudo install minikube-linux-amd64 /usr/local/bin/minikube


    minikube start


    ```


    Creating a Deployment


    - Deployment file (nginx-deployment.yaml):


    ```yaml


    apiVersion: apps/v1


    kind: Deployment


    metadata:


    name: nginx-deployment


    spec:


    replicas: 3


    selector:


    matchLabels:


    app: nginx


    template:


    metadata:


    labels:


    app: nginx


    spec:


    containers:


    - name: nginx


    image: nginx:1.14.2


    ports:


    - containerPort: 80


    ```


    - Applying Deployment:


    ```sh


    kubectl apply -f nginx-deployment.yaml


    ```


    Managing Pods and Services


    - Listing Pods:


    ```sh


    kubectl get pods


    ```


    - Creating a Service:


    ```yaml


    apiVersion: v1


    kind: Service


    metadata:


    name: nginx-service


    spec:


    selector:


    app: nginx


    ports:


    - protocol: TCP


    port: 80


    targetPort: 80


    type: LoadBalancer


    ```


    - Applying the Service:


    ```sh


    kubectl apply -f nginx-service.yaml


    ```


    Advanced Orchestration Secrets


    - Autoscaling:  Configure autoscaling to automatically adjust the number of pods
    based on load.


    ```yaml


    apiVersion: autoscaling/v1


    kind: HorizontalPodAutoscaler


    metadata:


    name: nginx-hpa


    spec:


    scaleTargetRef:


    apiVersion: apps/v1


    kind: Deployment


    name: nginx-deployment


    minReplicas: 1


    maxReplicas: 10


    targetCPUUtilizationPercentage: 50


    ```


    - Deployments Canary e Blue-Green:  Use advanced deployment strategies to minimize
    the impact of updates and facilitate rollback.'
