    ### 快速参考表


    #### Linux 目录结构


    - `/`：系统根目录

    - `/bin`：基础二进制命令

    - `/boot`:系统启动文件，包括内核

    - `/dev`:设备文件

    - `/etc`:系统配置文件

    - `/home`:用户家目录

    - `/lib`:基础共享库

    - `/media`:可移动媒体（CD-ROM、USB 等）的挂载点

    - `/mnt`:临时挂载点

    - `/opt`:可选软件包

    - `/proc`：包含进程信息的虚拟文件系统

    - `/root`:root 用户家目录

    - `/run`:临时启动状态文件

    - `/sbin`:系统管理员基础二进制命令

    - `/srv`:系统提供的特定服务数据

    - `/sys`：包含设备和内核信息的虚拟文件系统

    - `/tmp`:临时文件

    - `/usr`:应用程序和用户共享的文件

    - `/var`:日志、邮件和缓存等变量文件


    #### 基本命令及描述


    ##### 导航与文件管理命令


    - `ls`:列出文件和目录

    - `cd`:切换当前目录

    - `pwd`:显示当前目录的完整路径

    - `mkdir`:创建新目录

    - `rmdir`:删除空目录

    - `rm`:删除文件或目录

    - `cp`:复制文件或目录

    - `mv`:移动或重命名文件或目录

    - `touch`:创建一个新空文件或更新现有文件的修改日期

    - `cat`:显示文件内容

    - `more`:一次一页显示文件内容

    - `less`:支持分页滚动的显示文件内容

    - `head`:显示文件前几行

    - `tail`:显示文件最后几行


    ##### 进程管理命令


    - `ps`:显示运行进程的列表

    - `top`:实时显示运行进程

    - `htop`:`top` 的交互式界面

    - `kill`:发送信号终止进程

    - `killall`:发送信号杀死所有指定名称的进程

    - `pkill`:根据名称发送信号杀死进程

    - `bg`:将进程置于后台

    - `fg`:将后台进程调至前台

    - `nice`:以修改后的优先级执行命令

    - `renice`:更改运行进程的优先级


    ##### 用户与权限命令


    - `adduser`:添加新用户

    - `userdel`:删除用户

    - `usermod`:修改现有用户

    - `passwd`:更改用户密码

    - `chown`:更改文件或目录的所有者

    - `chmod`:更改文件或目录权限

    - `su`:切换到用户

    - `sudo`:以超级用户运行命令


    ##### 网络命令


    - `ping`:向主机发送 ICMP 数据包并显示响应

    - `ifconfig`:配置网络接口

    - `ip`:配置网络接口

    - `netstat`:显示网络连接、接口和统计

    - `ss`:显示关于 TCP/IP 连接的详细信息

    - `traceroute`:跟踪到主机的数据包

    - `nslookup`:查询 DNS 服务器

    - `dig`:执行详细 DNS 查询

    - `wget`:从网络下载文件

    - `curl`:向或从服务器传输数据


    ##### 软件包管理命令


    - `apt-get`:基于 Debian 的发行版的包管理器

    - `apt`:`apt-get` 的高级界面

    - `yum`:基于 RPM 的发行版的包管理器

    - `dnf`:基于 RPM 的发行版的代代管理器

    - `rpm`:RPM 包管理器

    - `snap`:Snap 软件包的包管理器

    - `dpkg`:基于 Debian 的包管理器


    ##### 文件系统与系统命令


    - `df`:显示磁盘空间使用

    - `du`:显示文件和目录的空间使用

    - `mount`:挂载文件系统

    - `umount`:卸载文件系统

    - `fsck`:检查并修复文件系统

    - `mkfs`:创建文件系统

    - `lsblk`:列出块设备

    - `blkid`:显示块设备属性

    - `fdisk`:操作磁盘分区

    - `parted`:操作磁盘分区


