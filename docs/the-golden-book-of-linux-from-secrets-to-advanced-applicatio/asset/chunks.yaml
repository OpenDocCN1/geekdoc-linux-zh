    sudo snap install --classic code

    ```


    - `Vim`：一个高度可配置编辑器，可以转变为功能完整的 IDE。


    ```sh

    sudo apt-get install vim

    ```


    - `Eclipse`：一个强大的 IDE，特别对 `Java` 开发有用。


    ```sh

    sudo snap install --classic eclipse

    ```


    ### 基础工具的安装


    除了编辑器之外，你还需要几个开发工具。


    - `Git`：用于版本控制。


    ```sh

    sudo apt-get install git

    ```


    - 编译器：用于多种语言（`C`/C++` 使用 `gcc`，`Java` 使用 `openjdk`）。


    ```sh

    sudo apt-get install build-essential openjdk-11-jdk

    ```


    - 包管理器：用于安装库和依赖（`Python` 使用 `pip`，`Node.js` 使用 `npm`）。


    ```sh

    sudo apt-get install python3-pip

    sudo apt-get install npm

    ```


    ### 配置环境变量


    环境变量有助于管理系统行为和工具设置。


    - 在 `.bashrc` 中的配置示例：


    ```sh

    export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64

    export PATH=$PATH:$JAVA_HOME/bin

    export PATH=$PATH:/usr/local/bin

    ```


    ### 高级配置秘密


    - `别名与函数`：在 `.bashrc` 中使用别名和函数来加速常用任务。


    ```sh

    alias gs=''git status''

    alias gp=''git pull''

    function mcd() {

    mkdir -p "$1"

    cd "$1"

    }

    ```


    - 虚拟环境：使用虚拟环境来隔离 `Python` 项目的依赖。


    ```sh

    python3 -m venv my_environment

    source meu_ambiente/bin/activate

    ```


    ## 编译与构建工具 (make, cmake)


    编译和构建是软件开发中的关键过程，将你的源代码转换为高效的可执行文件。`make` 和 `cmake` 等工具在此过程中至关重要。


    ### 使用 make


    `make` 是一个自动化工具，它根据 `Makefile` 编译代码并生成可执行文件。


    - Makefile 示例：


    ```Makefile

    CC=gcc

    CFLAGS=-I.

    DEPS = hellomake.h

    OBJ = hellomake.o hellofunc.o

    %.o: %.c $(DEPS)

    $(CC) -c -o $@ $< $(CFLAGS)

    hellomake: $(OBJ)

    $(CC) -o $@ $^ $(CFLAGS)

    ```


    - 使用 `make` 编译：


    ```sh

    make

    ```


    ### 使用 cmake


    `cmake` 是一个构建工具，为复杂项目生成 `Makefile` 文件或其他构建脚本。


    - `CMakeLists.txt` 示例：


    ```cmake

    cmake_minimum_required(VERSION 3.10)

    project(HelloWorld)

    add_executable(helloworld main.cpp)

    ```


    - 使用 `cmake` 生成并编译：


    ```sh

    mkdir build

    cd build

    cmake ..

    make

    ```


    ### 高级构建秘密


    - `并行构建`：使用并行构建来加速编译。


    ```sh

    make -j$(nproc)

    ```


    - `ccache`：使用 `ccache` 缓存构建结果并加速后续构建。


    ```sh

    sudo apt-get install ccache

    export CC="ccache gcc"

    ```


    ## 使用 Git 进行版本控制


    `Git`是最流行的版本控制工具，允许你跟踪代码更改、与其他开发者协作并维护清晰的项目历史。


    ### Git 初始设置


    - 设置名称和邮箱：


    ```sh

    git config --global user.name "Your Name"

    git config --global user.email "seu.email@example.com"

    ```


    - 创建仓库：


    ```sh

    git init my_project

    cd my_project

    ```


    ### 基础 Git 命令


    - 添加文件并提交：


    ```sh

    git add .

    git commit -m "First commit"

    ```


    - 通过验证状态：


    ```sh

    git status

    ```


    - 检查提交日志：


    ```sh

    git log

    ```


    ### 分支操作


    分支允许你同时处理不同的功能或修复工作。


    - 创建并切换到新分支：


    ```sh

    git checkout -b my_branch

    ```


    - 合并分支：


    ```sh

    git checkout main

    git merge my_branch

    ```


    ### 高级 Git 秘密


    - `交互式变基`：使用交互式变基来清理提交历史。


    ```sh

    git rebase -i

    ```


