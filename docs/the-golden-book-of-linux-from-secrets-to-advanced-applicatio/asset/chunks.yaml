    ## Chapter 25


    High Performance Computing


    Exploring the world of High Performance Computing (HPC) is like discovering a
    new universe where efficiency and speed are taken to the extreme. Let''s dive
    into this chapter and discover how to set up computing clusters, use management
    tools, apply HPC in science and engineering, and optimize performance to achieve
    amazing results.


    Introduction to High Performance Computing (HPC)


    High-performance computing is essential for solving complex problems that require
    large amounts of calculations in a short time. It is widely used in areas such
    as climate modeling, particle physics simulation, big data analysis, and more.


    What is HPC?


    HPC involves aggregating computing resources to work together as a single powerful
    system capable of processing and analyzing large volumes of data quickly.


    Why is HPC Important?


    HPC allows researchers and engineers to perform simulations and analyzes that
    would be impractical or impossible on ordinary computers, accelerating scientific
    discoveries and technological innovations.


    Configuring Compute Clusters


    The basis of HPC is the computing cluster, a set of interconnected computers that
    work together to perform tasks.


    Components of a Cluster


    - Computing Nodes:  Machines that perform the calculations.


    - Control Nodes:  They coordinate tasks and distribute work among computing nodes.


    - High Speed ​​Network:  It guarantees fast communication between nodes.


    Basic Configuration of a Cluster


    1\. Operating System Installation:


    ```sh


    sudo apt-get install build-essential


    sudo apt-get install openmpi-bin openmpi-common libopenmpi-dev


    ```


    2\. Network Configuration:


    Configure static IPs and hosts files to ensure efficient communication between
    nodes.


    ```sh


    sudo nano /etc/hosts


    ```


    Configuration example:


    ```plaintext


    192.168.1.1    master


    192.168.1.2    node01


    192.168.1.3    node02


    ```


    3\. SSH Configuration:


    Allow passwordless SSH access between nodes.


    ```sh


    ssh-keygen -t rsa


    ssh-copy-id node01


    ssh-copy-id node02


    ```


    Advanced Cluster Configuration Secrets s


    - File Synchronization with rsync:


    Use `rsync` to maintain consistency of configuration files across nodes.


    ```sh


    rsync -av /etc/hosts node01:/etc/hosts


    rsync -av /etc/hosts node02:/etc/hosts


    ```


    - NFS for Data Sharing:


    Configure Network File System (NFS) to share directories between nodes.


    ```sh


    sudo apt-get install nfs-kernel-server


    sudo nano /etc/exports


    ```


    Configuration example:


    ```plaintext


    /home/shared 192.168.1.0/24(rw,sync,no_subtree_check)


    ```


    Cluster Management Tools (Slurm, Torque)


    Managing an HPC cluster can be challenging, but tools like Slurm and Torque make
    it easy.


    Slurm (Simple Linux Utility for Resource Management)


    Slurm is one of the most popular tools for managing resources on HPC clusters.


    - Slurm installation:


    ```sh


    sudo apt-get install slurm-wlm


    ```


    - Basic Configuration:


    ```sh


    sudo nano /etc/slurm-llnl/slurm.conf


    ```


    Configuration example:


    ```plaintext


    ControlMachine=master


    NodeName=node01 CPUs=4 State=UNKNOWN


    NodeName=node02 CPUs=4 State=UNKNOWN


    PartitionName=debug Nodes=node01,node02 Default=YES MaxTime=INFINITE State=UP


    ```


    - Starting Slurm:


    ```sh


    sudo systemctl start slurmctld


    sudo systemctl start slurmd


    ```


    Torque (Terascale Open-source Resource and QUEue Manager)


    Torque is another popular tool for managing resources in clusters.


    - Torque Installation:


    ```sh


    sudo apt-get install torque-server torque-mom torque-pam torque-client


    ```


    - Basic Configuration:


    ```sh


    sudo pbs_server -t create


    sudo qmgr -c "create node node01"


    sudo qmgr -c "create node node02"


    ```


    - Starting Torque:


    ```sh


    sudo systemctl start pbs_server


    sudo systemctl start pbs_mom


    ```


    Advanced Management Tool Secrets


    - Automation Scripts:


    Create scripts to automate the addition and removal of nodes in the cluster.


    ```sh


    sudo nano add_node.sh


    ```


    Example script:


    ```sh


    #!/bin/bash


    NODE_NAME=$1


    ssh $NODE_NAME "sudo apt-get install torque-mom"


    sudo qmgr -c "create node $NODE_NAME"


    ```


    - Monitoring with Grafana:


    Integrate Slurm or Torque with Grafana for metrics visualization.


    ```sh


    sudo apt-get install grafana


    ```


