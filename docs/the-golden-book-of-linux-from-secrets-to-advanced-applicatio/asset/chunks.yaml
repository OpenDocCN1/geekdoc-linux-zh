    # 函数与模块化


    函数允许你将代码组织成可重用的块，使脚本更易读和易于维护。


    ## 定义和调用函数


    要定义一个函数，使用以下语法：


    ```sh

    my function() {

    echo "Executing my function"

    }

    my function

    ```


    函数可以接受参数，通过 `$1`、 `$2` 等访问。


    ```sh

    soma() {

    result=$(( $1 + $2 ))

    echo "The sum is: $result"

    }

    soma 5 10

    ```


    ## 脚本模块化


    将相关的函数组织到单独的文件中并使用 `source` 将它们包含在主脚本中。


    ### 函数文件 (`funcoes.sh`):


    ```sh

    soma() {

    result=$(( $1 + $2 ))

    echo "The sum is: $result"

    }

    ```


    ### 主脚本 (`script_principal.sh`):


    ```sh

    #!/bin/bash

    source ./funcoes.sh

    soma 5 10

    ```


    # 高函数技巧


    - **局部变量**：使用 `local` 在函数内部定义局部变量，避免与全局变量冲突。


    ```sh

    my function() {

    local var="local"

    echo $var

    }

    ```


    - **函数返回值**：使用 `return` 返回状态码，使用 `echo` 返回值。


    ```sh

    check_file() {

    if [ -f "$1" ]; then

    return 0

    else

    return 1

    fi

    }

    check_file "file.txt"

    if [ $? -eq 0 ]; then

    echo "File exists"

    else

    echo "File not found"

    fi

    ```


