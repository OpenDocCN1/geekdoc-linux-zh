    # Control Structures (if, for, while)


    Control structures allow your script to make decisions and repeat actions. Let''s
    explore the most common ones: `if`, `for`, and `while`.


    ## If-Else


    The `if` command is used to make decisions based on conditions.


    ```sh

    a=10

    b=5

    if [ $a -gt $b ]; then

    echo "a is greater than b"

    else

    echo "a is not greater than b"

    fi

    ```


    ### For Loop


    The `for` loop is used to repeat actions a specific number of times.


    ```sh

    for i in 1 2 3 4 5; do

    echo "Number: $i"

    done

    ```


    ### While Loop


    The `while` loop continues executing as long as the condition is true.


    ```sh

    counter=1

    while [ $counter -le 5 ]; do

    echo "Counter: $counter"

    counter=$((counter + 1))

    done

    ```


    # Advanced Control Framework Secrets


    - **Case Statements**: Use `case` to simplify multiple `if` conditions.


    ```sh

    color="red"

    case $cor in

    "red")

    echo "The color is red"

    ;;

    "blue")

    echo "The color is blue"

    ;;

    *)

    echo "Unknown color"

    ;;

    esac

    ```


    - **Break and Continue**: Use `break` to exit a loop and `continue` to jump to
    the next iteration.


    ```sh

    for i in 1 2 3 4 5; do

    if [ $i -eq 3 ]; then

    continue

    fi

    echo "Number: $i"

    done

    ```


    # Functions and Modularization


    Functions let you organize your code into reusable blocks, making scripts easier
    to read and maintain.


    ## Defining and Calling Functions


    To define a function, use the following syntax:


    ```sh

    my function() {

    echo "Executing my function"

    }

    my function

    ```


    Functions can accept parameters, which are accessed using `$1`, `$2`, etc.


    ```sh

    soma() {

    result=$(( $1 + $2 ))

    echo "The sum is: $result"

    }

    soma 5 10

    ```


    ## Script Modularization


    Organize related functions into separate files and include them in your main script
    using `source`.


    ### Functions File (`funcoes.sh`):


    ```sh

    soma() {

    result=$(( $1 + $2 ))

    echo "The sum is: $result"

    }

    ```


    ### Script Principal (`script_principal.sh`):


    ```sh

    #!/bin/bash

    source ./funcoes.sh

    soma 5 10

    ```


    # Advanced Function Tips


    - **Local Variables**: Use `local` to define local variables within functions,
    avoiding conflicts with global variables.


    ```sh

    my function() {

    local var="local"

    echo $var

    }

    ```


    - **Return of Functions**: Use `return` to return status codes and `echo` to return
    values.


    ```sh

    check_file() {

    if [ -f "$1" ]; then

    return 0

    else

    return 1

    fi

    }

    check_file "file.txt"

    if [ $? -eq 0 ]; then

    echo "File exists"

    else

    echo "File not found"

    fi

    ```


