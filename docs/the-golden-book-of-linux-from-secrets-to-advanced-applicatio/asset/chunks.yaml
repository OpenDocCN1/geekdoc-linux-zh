    - name: example


    rules:


    - alert: HighCPUUsage


    expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m]))
    * 100) > 80


    for: 5m


    labels:


    severity: critical


    annotations:


    summary: "High CPU usage detected"


    description: "CPU usage is above 80% for more than 5 minutes."


    ```


    - Metrics Collection Scripts:  Create custom scripts to collect system-specific
    metrics and export them to Prometheus.


    Task Automation with cron and systemd


    Automating recurring tasks is essential for system efficiency. On Linux, this
    can be done using `cron` and `systemd`.


    Automation with cron


    `cron` is a task scheduler that allows you to run commands or scripts at regular
    intervals.


    - Edit Cron Jobs:  Use `crontab -e` to edit cron jobs.


    ```sh


    crontab -e


    ```


    Add a cron job in the format:


    ```sh


    * * * * * command


    ```


    The asterisks represent minutes, hours, days of the month, months and days of
    the week. For example, to run a script daily at 2 am:


    ```sh


    0 2 * * * /caminho/para/script.sh


    ```


    - List cron jobs:  To list configured cron jobs:


    ```sh


    crontab -l


    ```


    Automation with systemd


    `systemd` can be used to create timers that replace cron jobs. Timers are units
    of `systemd` that schedule the execution of other units.


    - Create Service Unit:  First, create a service unit. For example, `/etc/systemd/system/minha_trabalho.service`:


    ```sh


    [Unit]


    Description=My Task


    [Service]


    ExecStart=/path/to/script.sh


    ```


    - Create Timer Unit:  Then create a timer unit. For example, `/etc/systemd/system/minha_trabalho.timer`:


    ```sh


    [Unit]


    Description=Run My Task daily


    [Timer]


    OnCalendar=daily


    Persistent=true


    [Install]


    WantedBy=timers.target


    ```


    - Activate the Timer: Activate and start the timer:


    ```sh


    sudo systemctl enable my_task.timer


    sudo systemctl start my_task.timer


    ```


    Advanced Automation Tips


    - Dependent Tasks:  Configure tasks that depend on others, ensuring they are executed
    in the correct order. For example, in `systemd`, use the `After` directive to
    define dependencies:


    ```sh


    [Unit]


    Description=My Dependent Task


    After=other_task.service


    ```


    - Reliability and Persistence:  Use `Persistent=true` in `systemd` timers to ensure
    that the task runs even if the system is idle at the scheduled time.


    Data Backup and Recovery


    Maintaining regular and reliable backups is an essential practice for any system
    administrator. On Linux, there are several tools and strategies to ensure your
    data is secure.


    Backup Tools


    - rsync: Powerful tool for file synchronization and backup. To perform an incremental
    backup:


    ```sh


    rsync -av --delete /path/to/source /path/to/destination


    ```


    - takes:  Creates tarball files for backup. To make a full backup:


    ```sh


    tar -cvpzf backup.tar.gz /path/to/directory


    ```


    - Bacula:  Enterprise backup system that manages data backups, recovery and verification.


    ```sh


    sudo apt-get install bacula


    ```


    Backup Strategies


    - Full Backup:  Includes all data and can be restored independently. Ideal for
    situations where restore speed is critical.


    - Backup Incremental:  Includes only data that has changed since the last backup.
    Saves space and time, but requires a sequential restore from incremental backups.


    - Differential Backup:  Similar to incremental, but includes all changes since
    the last full backup. Faster to restore than incremental, but uses more space.


    Data recovery


    - Restore from a Full Backup:


    ```sh


    tar -xvpzf backup.tar.gz -C /path/to/restore


    ```


    - Restore with rsync:  Resynchronizes the backed up files to the original location.


    ```sh


    rsync -av /path/to/backup /path/to/restore


    ```


    Advanced Tips for Backup and Recovery


    - Snapshots:  Use file system snapshots to create quick restore points. Tools
    like LVM and Btrfs are useful:


    ```sh


    lvcreate -L 10G -s -n snapshot /dev/vg/lv


    ```


    - Backup Verification:  Regularly check your backups to ensure data can be restored
    correctly. Automate this check with scripts.


    - Cloud Backups:  Utilize cloud backup services for secure off-site storage. Tools
    like rclone make it easy to sync data with cloud services:


    ```sh


    rclone sync /path/to/remote data:/path/to/backup


    ```


