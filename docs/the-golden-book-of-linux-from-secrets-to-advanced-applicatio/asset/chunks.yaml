    ### Apache


    Apache 由于其灵活性和庞大的模块生态系统，是是最常用的 Web 服务器之一。


    - 安装 Apache：

    ```sh

    sudo apt-get update


    sudo apt-get install apache2

    ```


    - 配置 Apache：


    编辑主配置文件 `/etc/apache2/sites-available/000-default.conf` 来设置根目录和其他指令。


    ```xml

    <VirtualHost *:80>

    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log

    CustomLog ${APACHE_LOG_DIR}/access.log combined

