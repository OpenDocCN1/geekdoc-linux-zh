    Network Fundamentals in Linux


    To understand how to configure and manage networks in Linux, it is crucial to
    know the basic concepts. Networks are made up of interconnected devices that share
    data and resources. In Linux, the network is treated as a file system, with network
    devices represented by files in `/proc` and `/sys`.


    IP addressing


    One of the pillars of networks is IP addressing. IPv4 and IPv6 are the protocols
    used to identify devices on a network. IPv4 uses 32-bit addresses, while IPv6
    uses 128-bit addresses, allowing for a much greater number of unique addresses.


    - IPv4:  Example: `192.168.1.1`


    - IPv6:  Exemplo: `2001:0db8:85a3:0000:0000:8a2e:0370:7334`


    Subnetting


    Subnetting is the practice of dividing a larger network into smaller subnets.
    This improves network organization and security. Each subnet is identified by
    a subnet mask, which defines which bits of the IP address represent the network
    and which represent hosts.


    - IPv4 Subnet Mask:  `255.255.255.0` (indicates that the first three octets are
    the network part)


    - IPv6 Subnet Mask:  It uses prefixes, such as `/64`, which indicates the first
    64 bits as the network part.


    Routing


    Routing is the process of forwarding data packets between different networks.
    On Linux, this is managed by the kernel, and routing tables can be viewed and
    manipulated using the `route` or `ip route` command.


    Network Services


    In order for devices on a network to communicate efficiently, several network
    services are used. Among them, DHCP (Dynamic Host Configuration Protocol) stands
    out for dynamic assignment of IP addresses, and DNS (Domain Name System) for resolving
    domain names into IP addresses.


    Configuring Network Interfaces


    Configuring network interfaces in Linux is a fundamental task for any system administrator.
    Each network interface in Linux is represented by a file in the `/sys/class/net/`
    directory. Interfaces can be configured manually or through configuration files.


    Configuring Interfaces Manually


    To configure a network interface manually, you can use the `ip` or `ifconfig`
    commands. Although `ifconfig` is still widely used, the `ip` command is more modern
    and powerful.


    - Example using ifconfig:


    ```sh


    sudo ifconfig eth0 192.168.1.100 netmask 255.255.255.0 up


    ```


    - Example using ip:


    ```sh


    sudo ip addr add 192.168.1.100/24 dev eth0


    sudo ip link set eth0 up


    ```


