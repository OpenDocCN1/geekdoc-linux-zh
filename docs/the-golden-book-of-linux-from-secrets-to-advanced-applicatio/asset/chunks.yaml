    Task automation scripts


    Automating daily tasks can save valuable time and minimize errors. Python offers
    a multitude of libraries to facilitate automation.


    Backup Automation Example


    - Script de Backup com Rsync:


    ```python


    import us


    import datetime


    src = "/home/usuario/dir_origem"


    dest = "/home/user/backup_directory"


    date = datetime.datetime.now().strftime("%Y-%m-%d")


    dest = os.path.join(dest, f"backup_{date}")


    os.system(f"rsync -av --delete {src} {dest}")


    ```


    Log Cleaning Automation


    - Script to Clean Old Logs:


    ```python


    import us


    import time


    log_dir = "/var/log/my_application/"


    retention_days = 7


    now = time.time()


    for filename in os.listdir(log_dir):


    file_path = os.path.join(log_dir, filename)


    if os.stat(file_path).st_mtime < now - retention_days * 86400:


    if os.path.isfile(file_path):


    os.remove(file_path)


    print(f"Removido {file_path}")


    ```


    Advanced Task Automation Secrets


    - Use of Cron Jobs for Scheduling:  Combine Python scripts with cron to schedule
    tasks.


