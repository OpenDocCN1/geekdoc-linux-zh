    ## Chapter 8


    Software Development on Linux


    Visualize  an environment where your creativity as a developer can flow uninterrupted,
    where tools and settings work in harmony to turn your ideas into reality. Welcome
    to software development on Linux. In this chapter, we''ll explore how to set up
    a powerful development environment, use compilation and build tools, master version
    control with Git, implement continuous integration (CI/CD), and develop software
    in popular languages ​​like Python, C, and Java. We will uncover secrets and techniques
    that will take your skills to a higher level.


    Development Environment Configuration


    Properly configuring the development environment is the first step to ensuring
    productivity and efficiency. On Linux, this involves choosing the right tools
    and configuring them optimally.


    Choosing the Text Editor or IDE


    A text editor or IDE (Integrated Development Environment) is essential. Some popular
    options include:


    - Visual Studio Code:  A powerful editor with support for extensions for several
    languages.


    ```sh


    sudo snap install --classic code


    ```


    - Because:  A highly configurable editor that can be turned into a full-fledged
    IDE.


    ```sh


    sudo apt-get install vim


    ```


    - Eclipse:  A robust IDE, especially useful for Java development.


    ```sh


    sudo snap install --classic eclipse


    ```


    Installation of Essential Tools


    In addition to the editor, you will need several development tools.


    - Git : For version control.


    ```sh


    sudo apt-get install git


    ```


    - Compilers:  For several languages ​​(gcc for C/C++, openjdk for Java).


    ```sh


    sudo apt-get install build-essential openjdk-11-jdk


    ```


    - Package managers:  To install libraries and dependencies (pip for Python, npm
    for Node.js).


    ```sh


    sudo apt-get install python3-pip


    sudo apt-get install npm


    ```


    Configuring Environment Variables


    Environment variables help manage system behavior and tool settings.


    - Example of configuration in .bashrc:


    ```sh


    export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64


    export PATH=$PATH:$JAVA_HOME/bin


    export PATH=$PATH:/usr/local/bin


    ```


    Advanced Configuration Secrets


    - Aliases and Functions:  Use aliases and functions in your `.bashrc` to speed
    up common tasks.


    ```sh


    alias gs=''git status''


    alias gp=''git pull''


    function mcd() {


    mkdir -p "$1"


    cd "$1"


    }


    ```


    - Virtual Environments:  Use virtual environments to isolate Python project dependencies.


    ```sh


    python3 -m venv my_environment


    source meu_ambiente/bin/activate


    ```


    Compilation and Build Tools (make, cmake)


    Compilation and build are critical processes in software development, transforming
    your source code into efficient executables. Tools like `make` and `cmake` are
    essential in this process.


    Using make


    `make` is an automation tool that compiles code and generates executables based
    on a Makefile.


    - Makefile example:


    ```Makefile


    CC=gcc


    CFLAGS=-I.


    DEPS = hellomake.h


    OBJ = hellomake.o hellofunc.o


    %.o: %.c $(DEPS)


    $(CC) -c -o $@ $< $(CFLAGS)


    hellomake: $(OBJ)


    $(CC) -o $@ $^ $(CFLAGS)


    ```


    - Compiling with make:


    ```sh


    make


    ```


    Using cmake


    `cmake` is a build tool that generates Makefile files or other build scripts for
    complex projects.


    - Example of CMakeLists.txt:


    ```cmake


    cmake_minimum_required(VERSION 3.10)


    project(HelloWorld)


    add_executable(helloworld main.cpp)


    ```


    - Generating and compiling with cmake:


    ```sh


    mkdir build


    cd build


    cmake ..


    make


    ```


    Advanced Build Secrets


    - Parallel Build: Use parallel build to speed up compilation.


    ```sh


    make -j$(nproc)


    ```


    - Ccache:  Use ccache to cache build results and speed up subsequent builds.


    ```sh


    sudo apt-get install ccache


    export CC="ccache gcc"


    ```


    Version Control with Git


    Git is the most popular version control tool, allowing you to track code changes,
    collaborate with other developers, and maintain a clear project history.


    Initial Git Setup


    - Setting name and email:


    ```sh


    git config --global user.name "Your Name"


    git config --global user.email "seu.email@example.com"


    ```


    - Creating a repository:


    ```sh


    git init my_project


    cd my_project


    ```


    Basic Git Commands


    - Add files and commit:


    ```sh


    git add .


    git commit -m "First commit"


    ```


    - By verifying the status:


    ```sh


    git status


    ```


    - Checking the commit log:


    ```sh


    git log


    ```


    Working with Branches


    Branches allow you to work on different features or fixes simultaneously.


    - Creating and moving to a new branch:


    ```sh


    git checkout -b my_branch


    ```


    - Merging branches:


    ```sh


    git checkout main


    git merge my_branch


    ```


    Advanced Git Secrets


    - Interactive Rebase:  Use interactive rebase to clear commit history.


    ```sh


    git rebase -i HEAD~3


    ```


    - Hooks do Git:  Use hooks to automate tasks like testing or linting before committing.


    ```sh


    # .git/hooks/pre-commit


    #!/bin/sh


    make test


    ```


    Continuous Integration (CI/CD)


    Continuous integration (CI) and continuous delivery (CD) are essential practices
    to ensure that code is integrated, tested, and deployed in a continuous and automated
    manner.


    Configuring a CI/CD Pipeline


    Tools like Jenkins, GitLab CI, and GitHub Actions are popular for implementing
    CI/CD.


    Using GitHub Actions


    - Creating a CI workflow:


    ```yaml


    # .github/workflows/ci.yml


    name: CI


    on: [push, pull_request]


    jobs:


    build:


    runs-on: ubuntu-latest


    steps:


    - uses: actions/checkout@v2


    - name: Set up Python


    uses: actions/setup-python@v2


    with:


    python-version: ''3.x''


    - name: Install dependencies


    run: |


    python -m pip install --upgrade pip


    pip install -r requirements.txt


    - name: Run tests


    run: |


    pytest


    ```


    Advanced CI/CD Secrets


    - Dependency Cache:  Use caching to speed up job execution.


    ```yaml


    - name: Cache pip


    uses: actions/cache@v2


    with:


    path: ~/.cache/pip


    key: ${{ runner.os }}-pip-${{ hashFiles(''**/requirements.txt'') }}


    restore-keys: |


    ${{ runner.os }}-pip-


    ```


    - Pre-production environments:  Set up pre-production environments to test deployments
    before promoting to production.


    Software Development in Popular Languages ​​(Python, C, Java)


    Developing software on Linux is efficient and powerful due to the wide range of
    tools and libraries available.


    Python development


    - Setting up a Python project:


    ```sh


    mkdir my_project


    cd my_project


    python3 -m venv venv


    source venv/bin/activate


    pip install --upgrade pip


    pip install flask


    ```


    - Example of a simple Flask server:


    ```python


    from flask import Flask


    app = Flask(__name__)


    @app.route(''/'')


    def hello():


    return "Hello, World!"


    if __name__ == ''__main__'':


    app.run(host=''0.0.0.0'')


    ```


    Development in C


    - Configuring a C project:


    ```sh


    mkdir my_project_c


    cd my_project_c


    vim main.c


    ```


    - Example of a C program:


    ```c


    #include <stdio.h>


    int main() {


    printf("Hello, World!\n");


    return 0;


    }


    ```


    - Compiling and executing:


    ```sh


    gcc -my_program main.c


    ./my_program


    ``


    `


    Java development


    - Configuring a Java project:


    ```sh


    mkdir -p my_java_project/src


    cd my_project_java


    vim src/HelloWorld.java


    ```


    - Example of a Java program:


    ```java


    public class HelloWorld {


    public static void main(String[] args) {


    System.out.println("Hello, World!");


    }


    }


    ```


    - Compiling and executing:


    ```sh


    javac src/HelloWorld.java -d .


    java HelloWorld


    ```


    Advanced Development Secrets


    - Containerized Development Environments:  Use Docker to set up consistent development
    environments.


    ```dockerfile


    FROM python:3.8-slim


    WORKDIR /app


    COPY requirements.txt .


    RUN pip install -r requirements.txt


    COPY . .


    CMD ["python", "app.py"]'
