    Chapter 15


    Resource Management


    Imagine being in command of a spacecraft, fine-tuning every system to ensure it
    operates with maximum efficiency and reliability. Resource management in Linux
    is similar: you tune and monitor each component to ensure optimal performance.
    In this chapter, we''ll explore advanced resource management techniques, from
    monitoring CPU and memory usage to setting resource limits and resolving bottlenecks.
    Let''s dive into the secrets that will make you completely master resource management
    in Linux.


    CPU and Memory Usage Monitoring


    Monitoring CPU and memory usage is crucial to keeping your system running efficiently.
    Let''s start with the basic tools and techniques and move on to more sophisticated
    methods.


    Top command


    `top` is a classic tool for monitoring real-time CPU and memory usage.


    - Executing the top Command:


    ```sh


    top


    ```


    - Understanding the Output:


    The `top` interface shows information about running processes, including CPU (%CPU)
    and memory (%MEM) usage.


    htop command


    `htop` is an improved version of `top`, with a more user-friendly interface and
    additional functionality.


    - Installing and Running htop:


    ```sh


    sudo apt-get install htop


    htop


    ```


    - Navigando no htop:


    Use the arrow keys to navigate and F9 to kill processes. `htop` also allows you
    to view threads and filter processes.


    Free command


    `free` is useful for viewing system memory usage.


    - Executing the free Command:


    ```sh


    free -h


    ```


    - Free Command Output:


    Shows the total amount of memory, used, free and buffers/cache.


    Advanced Monitoring Secrets


    - Sar for Historical Data Collection:


    ```sh


    sudo apt-get install sysstat


    became -u 1 3


    ```


    - Monitoring with Grafana and Prometheus:


    Configure Prometheus to collect metrics and Grafana to visualize them.


    ```sh


    sudo apt-get install prometheus grafana


    ```


    System Monitoring Tools (top, htop, iotop)


    In addition to `top` and `htop`, other tools provide specific insights into resource
    usage.


    iotop command


    `iotop` monitors disk I/O usage by processes.


    - Installing and Running iotop:


    ```sh


    sudo apt-get install iotop


    sudo iotop


    ```


    - Analyzing the output of iotop:


    Shows which processes are consuming the most disk I/O, allowing you to identify
    bottlenecks.


    vmstat command


    `vmstat` provides an overview of system performance, including processes, memory,
    swap, I/O, system, and CPU.


    - Running the vmstat Command:


    ```sh


    vmstat 2 5


    ```


    - Output Interpretation:


    The command displays system activity at defined time intervals, useful for ongoing
    performance analysis.


    Advanced Monitoring Tool Secrets


    - Dstat for Combined Analysis:


    ```sh


    sudo apt-get install dstat


    dstat


    ```


    - Netdata for Real-Time Monitoring:


    ```sh


    bash <(curl -Ss https://my-netdata.io/kickstart.sh)


    ```


    Configuring Resource Limits (ulimit, cgroups)


    Configuring resource limits ensures that no process monopolizes system resources,
    preventing performance drops.


    ulimit command


    `ulimit` sets resource limits for the current shell session.


    - Viewing Current Limits:


    ```sh


    ulimit -a


    ```


    - Setting Limits:


    ```sh


    ulimit -n 4096 # Sets the open file limit


    ```


    Cgroups


    Cgroups (Control Groups) allow you to group processes and limit the resources
    they can use.


    - Creating a New Cgroup:


    ```sh


    sudo cgcreate -g cpu,memory:/grupo_teste


    ```


    - Setting CPU and Memory Limits:


    ```sh


    sudo cgset -r cpu.shares=512 test_group


    sudo cgset -r memory.limit_in_bytes=512M grupo_teste


    ```


    - Running a Process in Cgroup:


    ```sh


    sudo cgexec -g cpu,memory:/grupo_teste command


    ```


    Advanced Limit Setting Secrets


    - Cgroups v2 for Fine Resource Control:


    ```sh


    # Configuration and use of cgroups v2 on the system


    ```


    - Automation with Systemd:


    Set resource limits on systemd service files.


    ```this


    [Service]


    CPUQuota=50%


    MemoryLimit=512M


    ```


