    ## Glossary


    Important Terms and Definitions


    A


    - APT (Advanced Package Tool): Package management system used in Debian-based
    Linux distributions such as Ubuntu. Makes it easy to install, update, and remove
    software.


    - Audit: Process of tracking and recording activities in the system to ensure
    compliance and security. Tools like `auditd` are used for this purpose.


    B


    - Bash (Bourne Again Shell): One of the most common command line interpreters
    on Linux. Provides an interface for users to interact with the operating system.


    - BIOS (Basic Input/Output System): Firmware used during the computer boot process
    to initialize the hardware and load the operating system.


    C


    - CLI (Command Line Interface): Interface that allows users to interact with the
    operating system using typed commands instead of a graphical interface.


    - Cron: Task scheduling utility in Linux that allows automatic execution of commands
    or scripts at regular intervals.


    D


    - Daemon: Program that runs in the background and performs tasks or waits for
    specific service requests. Examples include web servers and print managers.


    - Distros (Linux Distributions): Varieties of operating systems based on the Linux
    kernel. Examples include Ubuntu, Fedora, Debian and CentOS.


    AND


    - Emacs: Powerful extensible and customizable text editor. Widely used for programming
    and advanced text editing.


    - EFI (Extensible Firmware Interface): Interface between the operating system
    and the hardware firmware, successor to the traditional BIOS.


    F


    - Filesystem: Structure and method used by the operating system to manage files
    and directories on a storage device.


    - Fork: Creation of a copy of a software project for independent development.
    The term can also refer to the process of creating a new process in the operating
    system.


    G


    - GNU (GNU''s Not Unix): Free software project started by Richard Stallman to
    create a completely free operating system. Many GNU tools are used on Linux systems.


    - GPG (GNU Privacy Guard): Cryptography tool that allows the creation of public
    and private keys, as well as encryption and signing of data.


    H


    - Hypervisor: Software that allows the creation and management of virtual machines.
    Examples include VMware, Hyper-V and KVM.


    - Htop: Interactive system process visualization tool, similar to `top`, but with
    more features and a more friendly interface.


    I


    - Init System: Initial process that is executed by the Linux kernel to initialize
    the system. Examples include `SysVinit`, `Upstart` and `systemd`.


    - Iptables: Firewall rule administration utility on Linux. Allows you to define
    network packet filtering policies.


    J


    - Journalctl: Log viewing tool used with `systemd` to display and filter system
    logs.


    - JSON (JavaScript Object Notation): Lightweight data interchange format that
    is easy for humans to read and write and easy for machines to interpret and generate.


    K


    - Kernel: Core of the operating system that manages the hardware and provides
    essential services for other programs.


    - KVM (Kernel-based Virtual Machine): Linux virtualization solution that allows
    the Linux kernel to function as a hypervisor.


    L


    - LAMP Stack: Set of free software used to create dynamic web servers. Composed
    of Linux, Apache, MySQL and PHP/Python/Perl.


    - LVM (Logical Volume Manager): Logical volume management system that allows flexible
    administration of storage volumes on Linux.


    M


    - Man Pages: Man pages that provide documentation about commands and system functions
    in Linux. Accessed with the `man` command.


    - Mount: Process of making a file system accessible at a certain point in the
    root directory. The `mount` command is used to mount storage devices.


    N


    - NFS (Network File System): Distributed file system protocol that allows a user
    to access files on a network in the same way as they access local storage.


    - NUMA (Non-Uniform Memory Access): Memory architecture used in multiprocessors
    where memory access time depends on the location of the memory in relation to
    the processor.


    O


    - Open Source: Software whose source code is freely available to be used, modified
    and distributed by anyone.


    - OProfile: Performance profiling tool for Linux systems that collects and displays
    information about program execution.


    P


    - Package Manager: System used to install, update, remove and manage software
    on Linux. Examples include `apt`, `yum` and `pacman`.


    - PAM (Pluggable Authentication Modules): Modules that provide a flexible method
    of user authentication on Linux systems.


    Q


    - QoS (Quality of Service): Set of technologies used to manage and guarantee the
    performance of network applications and services.


    - Quota: Limit imposed on the use of storage resources by users or groups in the
    system.


    R


    - Root: User with full administrative privileges on the Linux system. Also refers
    to the root directory `/`.


    - RPM (Red Hat Package Manager): Package management system used in Red Hat-based
    distributions such as CentOS and Fedora.


    S


    - SELinux (Security-Enhanced Linux)**: Set of security patches for the Linux kernel
    that provide mandatory access control mechanisms.


    - SSH (Secure Shell): Protocol for remotely accessing and managing Linux systems
    securely.


    T


    - TAR (Tape Archive)**: Archiving utility used to combine multiple files into
    a single archive. Commonly used with compression (`gzip`, `bzip2`).


    - Tmux: Terminal multiplexer that allows you to create, access and control multiple
    terminal sessions from a single window.


    IN


    - UFW (Uncomplicated Firewall): Friendly interface for `iptables`, used to manage
    firewall rules in a simplified way.


    - UUID (Universally Unique Identifier): Universally unique identifier used to
    uniquely identify information in a system.


    IN


    - Vim (Vi IMproved): Highly configurable and powerful text editor, derived from
    the Vi editor.


    - VM (Virtual Machine): Emulation of a computer system that provides the functionality
    of a physical computer. Created and managed by a hypervisor.


    IN


    - Wayland: Modern graphics server protocol, intended to replace X11.


    - Wget: Command line tool used to download files from the web.


    X


    - X11 (X Window System)**: Window system for graphical environments on Unix and
    Unix-like systems.


    - Xargs: Command that builds and executes command lines from standard input.


    AND


    - YUM (Yellowdog Updater, Modified): Package manager for RPM-based Linux distributions.


    - YAML (YAML Ain''t Markup Language): Human-readable format used for data serialization.


    WITH


    - ZFS (Z File System): Advanced file system and volume manager that provides high
    storage capacity, data integrity and performance.


    - Zypper: Package manager used in openSUSE-based Linux distributions.


    This glossary provides clear and concise definitions of essential terms and concepts
    in the world of Linux. Understanding these terms is crucial for any systems administrator
    or developer who wants to deepen their knowledge and skills in using Linux. Use
    this glossary as a quick reference to clarify doubts and reinforce your ongoing
    learning.

