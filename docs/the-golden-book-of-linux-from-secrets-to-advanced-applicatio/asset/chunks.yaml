    # Popular Linux Distributions


    - **CentOS**: Free version of Red Hat Enterprise Linux, widely used on servers
    due to its stability.

    - **Debian**: Known for its robustness and large software repository.

    - **Arch Linux**: For advanced users who want full control over the system.


    For beginners, I recommend starting with `Ubuntu` or `Fedora`. These distributions
    are well documented and have large support communities.


    ## Preparing for Installation


    Once you have chosen the distribution, download the ISO image from the official
    website. You can burn this image to a DVD or create a bootable USB stick using
    tools like `Rufus` (for Windows) or `Etcher` (for Linux and macOS).


    - **Rufus**: Simple to use, just select the ISO image and USB device.

    - **Etcher**: Cross-platform and intuitive, it also supports multiple Linux distributions.


    ## Installing Linux


    Insert the USB stick or DVD into your computer and restart it. Most systems allow
    you to choose the boot device by pressing a key such as `F12`, `F10` or `ESC`
    during boot.


    Follow the installer steps for the chosen distribution. Here are some tips to
    make the process easier:


    1. **Partitioning**: For beginners, I recommend using the automatic partitioning
    option. If you feel comfortable, you can create manual partitions, but this is
    not necessary to get started.

    2. **User Configuration**: Create a user account with administrator (`sudo`) permissions.
    Choose a strong password and remember it.

    3. **Regional Settings**: Configure the location, language and keyboard layout
    to your preferences.

    4. **Additional Software**: Some distributions allow you to install additional
    software during installation, such as multimedia codecs. It is good practice to
    install these packages to avoid problems later.


    After installation, remove the pendrive or DVD and restart the system. You will
    see the Linux login screen, where you can log in with the account you created.


    ## Detailed Distributions


    ### Ubuntu

    `Ubuntu` is, without a doubt, one of the most popular distributions, especially
    for beginners. It is based on `Debian` and offers a user-friendly graphical interface
    called `GNOME`. `Ubuntu`''s release cycle is predictable, with `LTS` (Long Term
    Support) versions every two years, guaranteeing five years of support and updates.


    ### Fedora

    `Fedora` is known for being at the forefront of technology. Sponsored by `Red
    Hat`, it is often used as a testing ground for technologies that eventually appear
    in `Red Hat Enterprise Linux`. It''s ideal for developers who want to try out
    the latest developments.


    ### CentOS

    `CentOS` is the choice of many companies for servers due to its stability and
    compatibility with `Red Hat Enterprise Linux`. Although `CentOS` is undergoing
    significant changes, with the introduction of `CentOS Stream`, it remains a solid
    option for production environments.


    ### Debian

    `Debian` is known for its robustness and free software philosophy. It has a huge
    software repository and is the basis for many other distributions, including `Ubuntu`.
    `Debian` is an excellent choice for anyone who wants a stable and customizable
    system.


    ### Arch Linux

    `Arch Linux` is for adventurers. Offers a do-it-yourself approach, allowing you
    to configure the system exactly how you want. `Arch` uses a rolling release model,
    which means you will always have access to the latest versions of the software.


    ## Linux Directory Structure


    One of the first things you''ll notice about Linux is the directory structure.
    Unlike Windows, where files are organized into disk drives such as `C:`, `D:`,
    etc., in Linux everything is part of a single directory tree.


    Here are the most important directories:


    - `/`: The root directory, where everything starts.

    - `/bin`: Contains essential binaries (commands) necessary for the system to function,
    accessible to all users.

    - `/boot`: Files required to boot the system, such as the kernel and boot loader.

    - `/dev`: Device files. In Linux, everything is treated as a file, including hardware
    devices.

    - `/etc`: System configuration files.

    - `/home`: Users'' personal directories. Each user has their own directory here.

    - `/lib`: Essential libraries shared by programs in the `/bin` and `/sbin` directories.

    - `/media`: Mounting point for removable media devices such as CDs and USB sticks.

    - `/mnt`: Temporary mount point for file systems.

    - `/opt`: Optional software, typically used to install additional software packages.

    - `/proc`: Virtual file system that provides information about the state of the
    system.

    - `/root`: Home directory of the root (administrator) user.

    - `/run`: System information since last boot.

    - `/sbin`: Essential binaries for system administration.

    - `/srv`: Specific data for services offered by the system.

    - `/tmp`: Temporary files. It is cleaned with each reboot.

    - `/usr`: Applications and user files. Contains subdirectories such as `/usr/bin`
    for user binaries, `/usr/lib` for libraries, and `/usr/share` for shared data.

    - `/was`: Variable files, such as logs and databases.


    Understanding this structure is crucial for navigating and administering a Linux
    system efficiently. Let''s explore some basic commands that will help you move
    through these directories and manipulate files.


    ## Basic Linux Commands


    The terminal is a powerful tool in Linux. Learning how to use it efficiently is
    essential for any Linux user. Here are some basic commands you should know:


    - `ls`: Lists the contents of a directory.

    - `ls -l`: List with details.

    - `ls -a`: Include hidden files.

    - `cd`: Change current directory.

    - `cd /home/user`: Goes to the user''s home directory.

    - `cd ..`: Goes up one level in the directory hierarchy.

    - `pwd`: Shows the full path of the current directory.

    - `cp`: Copies files or directories.

    - `cp file1 file2`: Copies `file1` to `file2`.

    - `cp -r dir1 dir2`: Copies `dir1` to `dir2`.

    - `mv`: Move or rename files or directories.

    - `mv file1 file2`: Moves or renames `file1` to `file2`.

    - `mv dir1 dir2`: Moves `dir1` to `dir2`.

    - `rm`: Removes files or directories.

    - `rm file`: Removes the `file`.

    - `rm -r dir`: Removes the `dir` and its contents.

    - `mkdir`: Creates a new directory.

    - `mkdir new_directory`: Creates a directory called `new_directory`.

    - `touch`: Creates a new empty file or updates the modification date of an existing
    file.

    - `touch new_file`: Creates a file called `new_file`.

    - `nano`: Simple non-terminal text editor.

    - `nano file`: Opens the `file` in the `nano` editor.

    - `cat`: Displays the contents of a file.

    - `cat archive`: Shows the contents of the `archive` in the terminal.

    - `man`: Shows the manual for a command.

    - `man ls`: Shows the manual for the `ls` command.


    ## User and Permissions Management


    One of the most important aspects of Linux administration is user and permissions
    management. We''ll understand how to create and manage user accounts, set file
    access permissions, and use `sudo` to run commands as an administrator.


    ### Creating and Managing Users


    To create a new user, we use the `adduser` command. For example:


    ```bash

    sudo adduser novo_user

    ```


    This creates a new user called `new_user` and defines a home directory for it.
    During creation, you will be asked to set a password and other optional information.


    To delete a user, we use `deluser`:


    ```bash

    sudo deluser novo_user

    ```


    If you want to remove the home directory and files associated with the user, add
    the `--remove-home` option:


    ```bash

    sudo deluser --remove-home novo_user

    ```


    ### File Permissions


    In Linux, each file and directory has permissions that control who can read, write,
    or execute the file. These permissions are divided into three categories: owner,
    group, and others.


    To see the permissions of a file, we use `ls -l`:


    ```bash

    ls -l file

    ```


    The output will be something like:

    '
