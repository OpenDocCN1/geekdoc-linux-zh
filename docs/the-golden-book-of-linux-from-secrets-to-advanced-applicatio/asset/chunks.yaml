    ## Implementation of SELinux and AppArmor


    ### SELinux (Security-Enhanced Linux)


    SELinux is a mandatory access control (MAC) implementation that restricts programs
    and users to the minimum necessary permissions.


    - Enabling SELinux:

    ```sh

    sudo apt-get install selinux

    sudo setenforce 1

    ```


    - Configuring SELinux Policies:

    ```sh

    sudo nano /etc/selinux/config

    # Set SELINUX=enforcing to enable policy enforcement

    ```


    - Basic SELinux Commands:

    ```sh

    sudo sestatus

    sudo semanage fcontext -a -t httpd_sys_content_t "/web(/.*)?"

    sudo restorecon -Rv /web

    ```


    ### AppArmor


    AppArmor is another mandatory access control system that restricts the capabilities
    of individual programs based on profiles.


    - Installing AppArmor:

    ```sh

    sudo apt-get install apparmor apparmor-profiles

    sudo systemctl enable apparmor

    sudo systemctl start apparmor

    ```


    - AppArmor Profile Management:

    ```sh

    sudo aa-status

    sudo aa-enforce /etc/apparmor.d/usr.sbin.nginx

    sudo aa-complain /etc/apparmor.d/usr.sbin.nginx

    ```


    ### Advanced Implementation Secrets


    - Custom Policies:

    Create custom SELinux policies for critical services.

    ```sh

    sudo audit2allow -M mypol -a

    sudo semodule -i mypol.pp

    ```


    - Help Tools:

    Use tools like `audit2allow` and `audit2why` to understand and resolve permission
    issues.

    ```sh

    sudo audit2allow -w -a

    ```


