    ## Chapter 3


    Shell Scripting


    When we talk about mastering Linux, one skill that inevitably comes up as essential
    is shell scripting. Shell scripts are powerful tools that allow you to automate
    tasks, simplify complex processes and drastically increase efficiency. If you
    want to become a true Linux master, understanding and mastering shell scripting
    is an essential step. In this chapter, we''ll explore secrets and advanced tips
    that will transform your approach to shell scripting.


    Introduction to Shell Scripting


    Let''s start by understanding what a shell script is. Basically, a shell script
    is a sequence of commands written to a file, which the shell can execute at once.
    The shell, in simple terms, is the interface that interprets the commands you
    type and executes them. There are different types of shells, such as the Bourne
    Again Shell (bash), Z Shell (zsh) and Korn Shell (ksh), with bash being the most
    common in modern Linux distributions.


    Why use Shell Scripting?


    1\. Automation:  Automate repetitive tasks such as backups, updates, and reports.


    2\. Efficiency:  Execute multiple commands quickly, without the need for manual
    intervention.


    3\. Consistency:  Ensure complex tasks are performed consistently and without
    human error.


    Creating your First Script


    Let''s create a simple shell script. Open your favorite text editor and write
    the following:


    ```sh


    #!/bin/bash


    echo "Hello, World!"


    ```


    Save the file as `hola_mundo.sh`. The `#!/bin/bash` on the first line is known
    as a shebang, and tells the system that this script should be run using bash.
    To run your script, you need to make it executable:


    ```sh


    chmod +x ola_mundo.sh


    ```


    And then, run the script:


    ```sh


    ./ola_mundo.sh


    ```


    You will see the output "Hello World!". This is a simple example, but it illustrates
    how shell scripts can be used to execute commands.


    Variables and Operators


    Variables are fundamental in any programming language, and shell scripting is
    no different. They allow you to store and manipulate data. In shell scripting,
    you don''t need to declare the type of the variable, the shell does it automatically.


    Declaring Variables


    To declare a variable, simply assign a value to it:


    ```sh


    my_name="Diego"


    echo "My name is $my_name"


    ```


    Note that we use the `$` sign to access the variable value.


    Operators


    Operators are used to perform operations on variables. Here are some examples:


    - Arithmetic:  `+`, `-`, `*`, `/`, `%`


    ```sh


    a=10


    b=5


    echo $((a + b)) # Addition


    echo $((a - b)) # Subtraction


    echo $((a * b)) # Multiplication


    echo $((a / b)) # Division


    echo $((a % b)) # Module


    ```


