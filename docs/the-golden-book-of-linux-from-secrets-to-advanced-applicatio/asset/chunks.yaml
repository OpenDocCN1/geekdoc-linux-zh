    ## Chapter 16


    Automation with Ansible


    Imagine having a tireless assistant that automates repetitive and complex tasks,
    freeing up your time to focus on innovations and improvements. Welcome to the
    world of automation with Ansible! In this chapter, we''ll explore how Ansible
    can transform the way you manage systems and configurations. We go from getting
    started with Ansible to advanced security and automation practices, sharing secrets
    that will take your skills to a new level.


    Introduction to Ansible


    Ansible is an IT automation tool that simplifies the management of systems, applications
    and configurations. Its agentless architecture makes infrastructure deployment
    and management easy.


    What is Ansible?


    Ansible is an open source tool that uses SSH to communicate between machines and
    YAML to define configurations and tasks.


    Main Ansible Components


    - Playbooks: YAML files that contain instructions on what should be run on your
    managed nodes.


    - Inventories:  Lists of nodes that Ansible should operate on.


    - Modules: Tools that Ansible uses to perform tasks.


    Installing Ansible


    - And Free:


    ```sh


    sudo apt-get update


    sudo apt-get install ansible


    ```


    - Not CentOS:


    ```sh


    sudo yum install epel-release


    sudo yum install ansible


    ```


    Playbook and Inventory Setup


    Playbooks and inventories are the heart of Ansible. Let''s explore how to configure
    and use these components.


    Creating a Simple Playbook


    - Basic Structure of a Playbook:


    ```yaml


    ---


    - name: Install and start Apache


    hosts: webservers


    become: yes


    tasks:


    - name: Install Apache


    apt:


    name: apache2


    state: present


    - name: Start the Apache service


    service:


    name: apache2


    state: started


    ```


    - Running the Playbook:


    ```sh


    ansible-playbook -i inventario.ini playbook.yml


    ```


    Configuring Inventory


    - Basic Inventory File:


    ```this


    [webservers]


    server1.example.com


    server2.example.com


    ```


    - Dynamic Inventory:


    ```sh


    # A script that dynamically generates the list of hosts


    ```


    Advanced Playbooks and Inventory Secrets


    - Variables in Playbooks:  Use variables to make playbooks more flexible.


    ```yaml


    whose:


    apache_package: apache2


    tasks:


    - name: Install Apache


    apt:


    name: "{{ apache_package }}"


    state: present


    ```


    - Loops and Conditions:  Perform repetitive and conditional tasks.


    ```yaml


    tasks:


    - name: Create users


    user:


    name: "{{ item }}"


    state: present


    with_items:


    - alice


    - bob


    ```


    Automation of Administrative Tasks


    Automating administrative tasks with Ansible can save time and reduce errors.


    Package Update


    - Playbook for Updating Packages:


    ```yaml


    ---


    - name: Update packages on web servers


    hosts: webservers


    become: yes


    tasks:


    - name: Update package list


    apt:


    update_cache: yes


    - name: Update all packages


    apt:


    upgrade: dist


    ```


    User Management


    - Playbook for Managing Users:


    ```yaml


    ---


    - name: Manage users


    hosts: all


    become: yes


    tasks:


    - name: Add a new user


    user:


    name: johndoe


    state: present


    groups: sudo


    ```


    Backup Automation


    - Playbook for Directory Backup:


    ```yaml


    ---


    - name: Back up directories


    hosts: backup_servers


    become: yes


    tasks:


    - name: Data directory compression


    archive:


    path: /var/www


    start: /backups/backup-www.tar.gz


    format: gz


    ```


    Advanced Automation Secrets


    - Handlers for Dependent Tasks:  Use handlers to perform actions only when necessary.


    ```yaml


    tasks:


    - name: Modify configuration file


    lineinfile:


    path: /etc/apache2/apache2.conf


    line: ''ServerName localhost''


    notify:


    - Restart Apache


    handlers:


    - name: Restart Apache


    service:


    name: apache2


    state: restarted


    ```


    - Templates Jinja2:  Use templates to dynamically generate configuration files.


    ```yaml


    tasks:


    - name: Generate configuration file


    template:


    src: templates/nginx.conf.j2


    start: /etc/nginx/nginx.conf


    ```


    Configuration Management with Ansible


    Managing configurations with Ansible ensures that all of your systems are configured
    in a consistent manner.


    Nginx Configuration Playbook


    - Template file for Nginx:


    ```jinja2


    server {


    listen 80;


    server_name {{ server_name }};


    root {{ document_root }};


    index index.html;


    }


    ```


    - Playbook to Configure Nginx:


    ```yaml


    ---


    - name: Configure Nginx


    hosts: webservers


    become: yes


    whose:


    server_name: example.com


    document_root: /var/www/html


    tasks:


    - name: Install Nginx


    apt:


    name: nginx


    state: present


    - name: Configure Nginx


    template:


    src: templates/nginx.conf.j2


    dest: /etc/nginx/sites-available/default


    - name: Restart Nginx


    service:


    name: nginx


    state: restarted


    ```


    Service Management


    - Playbook for Service Management:


    ```yaml


    ---


    - name: Manage services


    hosts: webservers


    become: yes


    tasks:


    - name: Ensure Nginx is running


    service:


    name: nginx


    state: started


    ```


    Advanced Configuration Management Secrets


    - Roles for Reuse:  Use roles to organize and reuse configurations.


    ```yaml


    # Role directory structure


    roles/


    common/


    tasks/


    main.yml


    handlers/


    main.yml


    templates/


    files/


    whose/


    main.yml


    ```


    - Vault for Sensitive Data:  Use Ansible Vault to encrypt sensitive information.


    ```sh


    ansible-vault create vars/secrets.yml


    ansible-vault edit vars/secrets.yml


    ```


    Good Practices and Security in Ansible


    Following best practices and ensuring security is critical when using Ansible.


    Good habits


    - Documentation:  Document all playbooks and configurations.


    - Modularization:  Split large playbooks into smaller, reusable roles.


    - Test:  Test your configurations in development environments before deploying
    them to production.


    Security


    - Using Ansible Vault:  Protect passwords and API keys with Ansible Vault.


    ```sh


    ansible-vault encrypt vars/secrets.yml


    ```


    - Access control:  Limit access to inventory and playbooks to authorized users
    only.


    Advanced Security Secrets


    - Auditing and Logging:  Maintain detailed logs of Ansible operations for auditing.


    ```sh


    # Logging configuration in ansible.cfg


    [defaults]


    log_path = /var/log/ansible.log'
