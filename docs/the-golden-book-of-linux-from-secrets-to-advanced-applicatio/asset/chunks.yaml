    ## Glossary


    ### Important Terms and Definitions


    #### A


    - APT (Advanced Package Tool): Package management system used in Debian-based
    Linux distributions such as Ubuntu. Makes it easy to install, update, and remove
    software.

    - Audit: Process of tracking and recording activities in the system to ensure
    compliance and security. Tools like `auditd` are used for this purpose.


    #### B


    - Bash (Bourne Again Shell): One of the most common command line interpreters
    on Linux. Provides an interface for users to interact with the operating system.

    - BIOS (Basic Input/Output System): Firmware used during the computer boot process
    to initialize the hardware and load the operating system.


    #### C


    - CLI (Command Line Interface): Interface that allows users to interact with the
    operating system using typed commands instead of a graphical interface.

    - Cron: Task scheduling utility in Linux that allows automatic execution of commands
    or scripts at regular intervals.


    #### D


    - Daemon: Program that runs in the background and performs tasks or waits for
    specific service requests. Examples include web servers and print managers.

    - Distros (Linux Distributions): Varieties of operating systems based on the Linux
    kernel. Examples include Ubuntu, Fedora, Debian and CentOS.


    #### E


    - Emacs: Powerful extensible and customizable text editor. Widely used for programming
    and advanced text editing.

    - EFI (Extensible Firmware Interface): Interface between the operating system
    and the hardware firmware, successor to the traditional BIOS.


    #### F


