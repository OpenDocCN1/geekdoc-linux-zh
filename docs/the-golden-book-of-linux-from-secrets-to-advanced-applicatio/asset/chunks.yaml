    ### Nginx


    Nginx 以其高性能和低内存占用而闻名，是高流量网站的理想选择。


    - 安装 Nginx：

    ```sh

    sudo apt-get update


    sudo apt-get install nginx

    ```


    - 配置 Nginx：


    编辑主配置文件 `/etc/nginx/sites-available/default` 来设置根目录和其他指令。


    ```nginx

    server {

    listen 80 default_server;

    listen [::]:80 default_server;

    root /var/www/html;

    index index.html index.htm index.nginx-debian.html;

    server_name _;

    location / {

    try_files $uri $uri/ =404;

    }

    }

    ```


    - 测试配置并重启 Nginx：

    ```sh

    sudo nginx -t

    sudo systemctl restart nginx

    ```


