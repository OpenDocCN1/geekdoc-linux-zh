    Network Security


    Network security is critical to protecting data and systems against unauthorized
    access and attacks. Linux offers several tools to help secure the network.


    Firewalls com iptables e nftables


    `iptables` is a powerful tool for configuring firewall rules on Linux. Recently,
    `nftables` was introduced as a more modern and efficient replacement.


    - Basic rules with iptables:


    ```sh


    sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT


    sudo iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    sudo iptables -A INPUT -p icmp -j ACCEPT


    sudo iptables -A INPUT -j DROP


    ```


    - Basic rules with nftables:


    ```sh


    sudo nft add table inet firewall


    sudo nft add chain inet firewall input { type filter hook input priority 0 \;
    }


    sudo nft add rule inet firewall input tcp dport 22 accept


    sudo nft add rule inet firewall input ct state established,related accept


    sudo nft add rule inet firewall input icmp accept


    sudo nft add rule inet firewall input drop


    ```


    VPN configuration


    VPNs (Virtual Private Networks) are used to create secure connections between
    networks. `OpenVPN` is a popular choice on Linux.


    - Installation:


    ```sh


    sudo apt-get install openvpn


    ```


    - Settings:


    Create and configure server and client files, and use startup scripts to manage
    VPN connections.


    Security Monitoring


    Tools like `fail2ban` help protect against brute force attacks by blocking suspicious
    IPs.


    - Installation O:


    ```sh


    sudo apt-get install fail2ban


    ```


    - Settings:


    Edit the `/etc/fail2ban/jail.conf` file to configure blocking rules.


    ```sh


    [sshd]


    enabled = true


    port = 22


    filter = sshd


    logpath = /var/log/auth.log


    maxretry = 5


    ```


    Advanced Security Tips


    - IDS/IPS:  Use intrusion detection and prevention systems like `Snort` or `Suricata`
    to monitor network traffic for suspicious activity.


    ```sh


    sudo apt-get install snort


    ```


    - Web Application Security: Protect your web servers with `ModSecurity`, a web
    application firewall.


    ```sh


    sudo apt-get install libapache2-mod-security2


    ```


    - Centralized Logs:  Use `rsyslog` to centralize logs from multiple servers in
    a single location, making analysis and auditing easier.


    ```sh


    # No log server


    sudo apt-get install rsyslog


    sudo nano /etc/rsyslog.conf


    # Add


    $ModLoad imudp


    $UDPServerRun 514


    ```


