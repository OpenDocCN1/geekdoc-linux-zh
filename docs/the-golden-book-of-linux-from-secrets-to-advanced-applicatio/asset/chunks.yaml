  trans: "\n\n想象一下能够在一个系统中模拟多台计算机，每个系统都有自己的配置，或者将应用程序隔离在小型便携容器中，使其在任何环境中都能一致运行。欢迎来到\
    \ Linux 虚拟化和容器的世界！在本章中，我们将探索高级技术和技巧，这将改变你管理虚拟和容器环境的方法。\n\n# 虚拟化简介 (KVM, VirtualBox)\n\
    \n虚拟化允许你在单一物理硬件上运行多个操作系统。这不仅最大限化地利用了资源，还为测试和开发提供了灵活性。Linux 上最流行的虚拟化解决方案是 `KVM`\
    \ 和 `VirtualBox`。\n\n## KVM (基于内核的虚拟机)\n\n`KVM` 是一个开源虚拟化解决方案，它将 Linux 内核转换为虚拟机监控程序。由于其性能和内核集成，它是生产环境的理想选择。\n\
    \n### KVM 安装：\n\n```sh\nsudo apt-get install qemu-kvm libvirt-daemon-system libvirt-clients\
    \ bridge-utils\nsudo systemctl enable --now libvirtd\n```\n\n### 使用 KVM 创建虚拟机：\n\
    \n```sh\nsudo virt-install \\\n--name ubuntu-vm\\\n--ram 2048 \\\n--disk path=/var/lib/libvirt/images/ubuntu-vm.qcow2,size=10\
    \ \\\n--vcpus 2 \\\n--os-type linux \\\n--os-variant ubuntu20.04 \\\n--network\
    \ bridge=virbr0 \\\n--graphics none \\\n--console pty,target_type=serial \\\n\
    --location 'http://archive.ubuntu.com/ubuntu/dists/focal/main/installer-amd64/'\
    \ \\\n--extra-args 'console=ttyS0,115200n8 serial'\n```\n\n## VirtualBox\n\n`VirtualBox`\
    \ 是一个强大且易于使用的虚拟化工具，非常适合开发和测试环境。\n\n### VirtualBox 安装：\n\n```sh\nsudo apt-get install\
    \ virtualbox\n```\n\n### 使用 VirtualBox 创建虚拟机：\n\n打开 `VirtualBox` 并按照向导创建新的虚拟机，指定操作系统、内存、硬盘和网络设置。\n\
    \n# 高级虚拟化秘籍\n\n### KVM 快照：使用快照捕获虚拟机的状态，并轻松回滚更改。\n\n```sh\nsudo virsh snapshot-create-as\
    \ --domain ubuntu-vm snapshot1 \"Primeiro snapshot\"\nsudo virsh snapshot-revert\
    \ ubuntu-vm snapshot1\n```\n\n### KVM 虚拟网络：配置虚拟网络以隔离和连接虚拟机。\n\n```sh\nsudo virsh\
    \ net-create mynetwork.xml\n```\n\n# 虚拟机管理\n\n高效管理虚拟机对于保持基础架构的整洁和优化至关重要。\n\n##\
    \ 使用 virsh 管理\n\n`virsh` 是一个管理 `KVM` 中虚拟机的命令行工具。\n\n### 列出虚拟机：\n\n```sh\nsudo\
    \ virsh list --all\n```\n\n### 启动和停止虚拟机：\n\n```sh\nsudo virsh start ubuntu-vm\n\
    sudo virsh shutdown ubuntu-vm\n```\n\n### 监控资源：\n\n```sh\nsudo virsh domstats\
    \ ubuntu-vm\n```\n\n## 使用 VirtualBox 管理\n\n`VirtualBox` 提供了直观的 GUI 和强大的 CLI 用于管理。\n\
    \n### 列出虚拟机：\n\n```sh\nVBoxManage list vms\n```\n\n### 启动和停止虚拟机：\n\n```sh\nVBoxManage\
    \ startvm \"ubuntu-vm\" --type headless\nVBoxManage controlvm \"ubuntu-vm\" poweroff\n\
    ```\n\n### 调整特性：\n\n```sh\nVBoxManage modifyvm \"ubuntu-vm\" --memory 4096 --cpus\
    \ 4\n```\n\n# 高级管理技巧\n\n### 使用 Ansible 自动化：使用 Ansible 自动化虚拟机管理。\n\n```yaml\n-\
    \ name: Manage VMs with Ansible\nhosts: localhost\ntasks:\n  - name: Start VM\n\
    \    command: virsh start ubuntu-vm\n```\n\n### 使用 rsync 进行增量备份：对虚拟机磁盘进行增量备份以节省空间和时间。\n\
    \n```sh\nrsync -av --progress /var/lib/libvirt/images/ubuntu-vm.qcow2 /backup/\n\
    ```\n\n# 容器简介 (Docker, Podman)\n\n容器是一种轻量级虚拟化技术，它将应用程序及其依赖项封装在隔离环境中，确保其在任何地方都能一致运行。\n\
    \n## Docker\n\n`Docker` 是最流行的容器平台。它允许你在容器中创建、分发和运行应用程序。\n\n### Docker 安装：\n\n\
    ```sh\nsudo apt-get install docker-ce docker-ce-cli containerd.io\nsudo systemctl\
    \ enable --now docker\n```\n\n### 创建并运行容器：\n\n```sh\nsudo docker run -d --name\
    \ meu-container -p 80:80 nginx\n```\n\n## Podman\n\n`Podman` 是 `Docker` 的替代方案，不需要运行的守护进程，增加了安全简单性。\n\
    \n### Podman 安装：\n\n```sh\nsudo apt-get install podman\n```\n\n### 创建并运行容器：\n\n\
    ```sh\npodman run -d --name meu-container -p 80:80 nginx\n```\n\n# 高级容器技巧\n\n\
    ### Docker 卷：使用卷在容器之间持久化数据。\n\n```sh\nsudo docker volume create meu-volume\nsudo\
    \ docker run -d -v my-volume:/nginx-data\n```\n\n### 高效构建：优化你的 Dockerfile 以获得更快速、更小的构建结果。\n\
    \n```dockerfile\nFROM node:14-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN\
    \ npm install\nCOPY . .\nCMD [\"node\", \"app.js\"]\n```\n\n# 容器和镜像管理\n\n高效管理容器和镜像对于维护有序且安全的环境至关重要。\n\
    \n## 使用 Docker CLI 管理\n\n### 列出容器和镜像：\n\n```sh\nsudo docker ps\n```\n\n### 停止和删除容器：\n\
    \n```sh\ndocker stop my-container\ndocker rm my-container\n```\n\n### 删除镜像：\n\n\
    ```sh\ndocker images\n```\n\n## 使用 Podman 管理\n\n### 列出容器和镜像：\n\n```sh\npodman\
    \ ps -a\n```\n\n### 停止和删除容器：\n\n```sh\npodman stop meu-container\npodman rm meu-container\n\
    ```\n\n### 删除镜像：\n\n```sh\npodman images\n```\n\n## 高级管理技巧\n\n### 多阶段构建：使用多阶段构建创建更小的镜像。\n\
    \n```dockerfile\nFROM golang:16 as builder\nWORKDIR /app\nCOPY . .\nRUN go build\
    \ -o meuapp\nFROM alpine:latest\nWORKDIR /root/\nCOPY --from=builder /app/meuapp\
    \ .\nCMD [\"./meuapp\"]\n```\n\n### Podman 安全：无需 root 权限运行容器。\n\n```sh\npodman\
    \ run -d --name seguro -p 80:80\n```\n\n# Kubernetes 编排\n\n在管理大量容器时，`Kubernetes`\
    \ 是首选工具。它自动化了部署、扩展和操作。\n\n## Minikube 安装\n\n`Minikube` 是一个让在本地运行 `Kubernetes`\
    \ 变得简单的工具。\n\n### Minikube 安装：\n\n```sh\ncurl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64\n\
    sudo install minikube-linux-amd64 /usr/local/bin/minikube\nminikube start\n```\n\
    \n## 创建部署\n\n### 部署文件 (nginx-deployment.yaml)：\n\n```yaml\napiVersion: apps/v1\n\
    kind: Deployment\nmetadata:\n  name: nginx-deployment\nspec:\n  replicas: 3\n\
    \  selector:\n    matchLabels:\n      app: nginx\n  template:\n    metadata:\n\
    \      labels:\n        app: nginx\n    spec:\n      containers:\n      - name:\
    \ nginx\n        image: nginx:1.14.2\n        ports:\n        - containerPort:\
    \ 80\n```\n\n### 应用部署：\n\n```sh\nkubectl apply -f nginx-deployment.yaml\n```\n\
    \n# 管理 Pod 和 服务\n\n### 列出 Pod：\n\n```sh\nkubectl get pods\n```\n\n### 创建服务：\n\n\
    ```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: nginx-service\nspec:\n\
    \  selector:\n    app: nginx\n  ports:\n    - protocol: TCP\n      port: 80\n\
    \      targetPort: 80\n  type: LoadBalancer\n```\n\n### 应用服务：\n\n```sh\nkubectl\
    \ apply -f nginx-service.yaml\n```\n\n# 高级编排技巧\n\n### 自动伸缩：配置自动伸缩以根据负载调整 Pod 数量。\n\
    \n```yaml\napiVersion: autoscaling/v1\nkind: HorizontalPodAutoscaler\nmetadata:\n\
    \  name: nginx-hpa\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind:\
    \ Deployment\n    name: nginx-deployment\n  minReplicas: 1\n  maxReplicas: 10\n\
    \  targetCPUUtilizationPercentage: 50\n```\n\n### 丝雀发布和蓝绿部署：使用高级部署策略以减少更新的影响并方便回滚。\n\
    \n"
- fmt: "\nExploring virtualization and containers in Linux reveals a world of possibilities\
    \ for optimizing and managing your IT environment. With knowledge of `KVM`, `VirtualBox`,\
    \ `Docker`, `Podman` and `Kubernetes`, you are well equipped to implement efficient\
    \ and secure solutions. We will continue our journey in the next chapter, exploring\
    \ more secrets and advanced techniques that will make you a true Linux master.\n\
    \n# Chapter 8\n\n## Software Development on Linux\n\nVisualize an environment\
    \ where your creativity as a developer can flow uninterrupted, where tools and\
    \ settings work in harmony to turn your ideas into reality. Welcome to software\
    \ development on Linux. In this chapter, we'll explore how to set up a powerful\
    \ development environment, use compilation and build tools, master version control\
    \ with `Git`, implement continuous integration (`CI/CD`), and develop software\
    \ in popular languages like `Python`, `C`, and `Java`. We will uncover secrets\
    \ and techniques that will take your skills to a higher level.\n\n## Development\
    \ Environment Configuration\n\nProperly configuring the development environment\
    \ is the first step to ensuring productivity and efficiency. On Linux, this involves\
    \ choosing the right tools and configuring them optimally.\n\n### Choosing the\
    \ Text Editor or IDE\n\nA text editor or IDE (Integrated Development Environment)\
    \ is essential. Some popular options include:\n\n- `Visual Studio Code`: A powerful\
    \ editor with support for extensions for several languages.\n\n```sh\nsudo snap\
    \ install --classic code\n```\n\n- `Because`: A highly configurable editor that\
    \ can be turned into a full-fledged IDE.\n\n```sh\nsudo apt-get install vim\n\
    ```\n\n- `Eclipse`: A robust IDE, especially useful for `Java` development.\n\n\
    ```sh\nsudo snap install --classic eclipse\n```\n\n### Installation of Essential\
    \ Tools\n\nIn addition to the editor, you will need several development tools.\n\
    \n- `Git`: For version control.\n\n```sh\nsudo apt-get install git\n```\n\n- `Compilers`:\
    \ For several languages (`gcc` for `C`/`C++`, `openjdk` for `Java`).\n\n```sh\n\
    sudo apt-get install build-essential openjdk-11-jdk\n```\n\n- `Package managers`:\
    \ To install libraries and dependencies (`pip` for `Python`, `npm` for `Node.js`).\n\
    \n```sh\nsudo apt-get install python3-pip\nsudo apt-get install npm\n```\n\n###\
    \ Configuring Environment Variables\n\nEnvironment variables help manage system\
    \ behavior and tool settings.\n\n- Example of configuration in `.bashrc`:\n\n\
    ```sh\nexport JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64\nexport PATH=$PATH:$JAVA_HOME/bin\n\
    export PATH=$PATH:/usr/local/bin\n```\n\n### Advanced Configuration Secrets\n\n\
    - `Aliases and Functions`: Use aliases and functions in your `.bashrc` to speed\
    \ up common tasks.\n\n```sh\nalias gs='git status'\nalias gp='git pull'\nfunction\
    \ mcd() {\nmkdir -p \"$1\"\ncd \"$1\"\n}\n```\n\n- `Virtual Environments`: Use\
    \ virtual environments to isolate `Python` project dependencies.\n\n```sh\npython3\
    \ -m venv my_environment\nsource meu_ambiente/bin/activate\n```\n\n## Compilation\
    \ and Build Tools (make, cmake)\n\nCompilation and build are critical processes\
    \ in software development, transforming your source code into efficient executables.\
    \ Tools like `make` and `cmake` are essential in this process.\n\n### Using make\n\
    \n`make` is an automation tool that compiles code and generates executables based\
    \ on a `Makefile`.\n\n- Makefile example:\n\n```Makefile\nCC=gcc\nCFLAGS=-I.\n\
    DEPS = hellomake.h\nOBJ = hellomake.o hellofunc.o\n%.o: %.c $(DEPS)\n$(CC) -c\
    \ -o $@ $< $(CFLAGS)\nhellomake: $(OBJ)\n$(CC) -o $@ $^ $(CFLAGS)\n```\n\n- Compiling\
    \ with `make`:\n\n```sh\nmake\n```\n\n### Using cmake\n\n`cmake` is a build tool\
    \ that generates `Makefile` files or other build scripts for complex projects.\n\
    \n- Example of `CMakeLists.txt`:\n\n```cmake\ncmake_minimum_required(VERSION 3.10)\n\
    project(HelloWorld)\nadd_executable(helloworld main.cpp)\n```\n\n- Generating\
    \ and compiling with `cmake`:\n\n```sh\nmkdir build\ncd build\ncmake ..\nmake\n\
    ```\n\n### Advanced Build Secrets\n\n- `Parallel Build`: Use parallel build to\
    \ speed up compilation.\n\n```sh\nmake -j$(nproc)\n```\n\n- `ccache`: Use `ccache`\
    \ to cache build results and speed up subsequent builds.\n\n```sh\nsudo apt-get\
    \ install ccache\nexport CC=\"ccache gcc\"\n```\n\n## Version Control with Git\n\
    \n`Git` is the most popular version control tool, allowing you to track code changes,\
    \ collaborate with other developers, and maintain a clear project history.\n\n\
    ### Initial Git Setup\n\n- Setting name and email:\n\n```sh\ngit config --global\
    \ user.name \"Your Name\"\ngit config --global user.email \"seu.email@example.com\"\
    \n```\n\n- Creating a repository:\n\n```sh\ngit init my_project\ncd my_project\n\
    ```\n\n### Basic Git Commands\n\n- Add files and commit:\n\n```sh\ngit add .\n\
    git commit -m \"First commit\"\n```\n\n- By verifying the status:\n\n```sh\ngit\
    \ status\n```\n\n- Checking the commit log:\n\n```sh\ngit log\n```\n\n### Working\
