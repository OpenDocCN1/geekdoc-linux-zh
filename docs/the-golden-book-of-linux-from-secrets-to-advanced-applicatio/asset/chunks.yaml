    \n## 系统监控工具 (top, htop)\n\n除了 `top` 和 `htop`，其他工具提供了对资源使用的特定洞察。\n\n### iotop 命令\n\
    \n`iotop` 监控磁盘/O。\n\n- **安装并运行 iotop**:\n```sh\nsudo apt-get install iotop\nsudo\
    \ iotop\n```\n\n- **分析输出**: 显示哪些进程消耗最多的 I/O。\n\n### vmstat 命令\n\n`vmstat` 提供进程、内存、交换、I/O、系统和\
    \ CPU 的概述。\n\n- **运行 vmstat**:\n```sh\nvmstat 2 5\n```\n\n- **输出解释**: 按定义的时间间隔显示系统活动。\n\
    \n### 高级监控工具\n\n- **用于组合分析 Dstat**:\n```sh\nsudo apt-get install dstat\ndstat\n\
    ```\n\n- **用于实时监控 Netdata**:\n```sh\nbash <(curl -Ss https://mydata.io/kickstart)\n\
    ```\n\n## 配置资源限制 (ulimit, cgroups)\n\n确保没有进程垄用资源，防止性能下降。\n\n### ulimit 命令\n\n\
    `ulimit` 设置当前会话的资源限制。\n\n- **查看限制**:\n```sh\nulimit -a\n```\n\n- **设置限制**:\n```sh\n\
    ulimit -n 4096 # 设置打开文件数限制\n```\n\n### Cgroups\n\nCgroups（控制组）允许你对进程分组并限制它们使用的资源。\n\
    \n- **创建新的 cgroup**:\n```sh\nsudo cgcreate -g cpu,memory:/grupo_teste\n```\n\n\
    - **设置 CPU 和内存限制**:\n```sh\nsudo cgset -r cpu.shares=512 grupo_teste\nsudo cgset\
    \ -r memory.limit_in_bytes=512M grupo_teste\n```\n\n- **在 cgroup 中运行进程**:\n```sh\n\
    sudo cgexec -g cpu,memory:/grupo_teste command\n```\n\n## 高级限制秘密\n\n- **用于细粒度控制的\
    \ Cgroups v2**:\n```bash\n# 系统上 cgroups v2 的配置和使用\n```\n\n- **使用 Systemd 自动化**:\
    \ 在 systemd 服务文件中设置资源限制。\n```ini\n[Service]\nCPUQuota=50%\nMemoryLimit=512M\n\
    ```\n\n## 电源与性能管理\n\n平衡效率和电源对于重要，特别是在服务器和移动设备上。\n\n### 调优 TLP\n\nTLP 是 Linux 上的一种高级电源管理工具。\n\
    \n- **安装和配置 TLP**:\n```sh\nsudo apt-get install tlp\nsudo tlp start\n```\n\n-\
    \ **查看电源设置**:\n```sh\nsudo tlp-stat\n```\n\n### 用于 CPU 控制的 cpupower\n\n`cpupower`\
    \ 允许调整 CPU 电源设置。\n\n- **安装 cpupower**:\n```sh\nsudo apt-get install linux-tools-common\
    \ linux-tools-generic\n```\n\n"
