    # Networking Options


    The Networking Options section contains all the configuration options for everything
    related to networking, including hardware, software, and protocols. The packet
    socket option turns on an interface that allows programs to communicate directly
    with network devices. Programs like tcpdump, packet sniffers, and dhcpd (as DHCP
    client), use the interface to send and receive packets without going through the
    kernel stack.


    The Kernel/User Netlink Socket option turns on support for communication between
    certain network-related parts of the kernel and user processes. It is currently
    used by the kernel to publish routing messages (when CONFIG_RTNETLINK is on) and
    by arpd and the ethernet device.


    The next two prompts are related to kernel firewalling. The first prompts for
    support for network firewalls. Answering yes turns on for IP firewalling, masquerading,
    and so on. The second prompts for support for socket filtering. Answering yes
    enables support for user-space socket filters.


    The Unix domain socket option turns on support for Unix domain sockets, which
    are heavily used by many programs, such as syslog and X, when a system is not
    connected to a network. You should enable this option except in embedded applications
    where you know no communication over Unix domain sockets will occur.


    Enabling support for the TCP/IP networking option includes support for TCP/IP
    networking, which many normal programs use heavily. Again, turn this option on
    except in embedded applications where you know you do not use TCP/IP.


    Other TCP/IP-related configuration options appear in this section. The first includes
    experimental support for the new IPv6 networking protocol, which will soon replace
    the current TCP/IP protocol (IPv4) used on the Internet. If you want to test IPv6
    on your network, turn on this driver.


    Within this section, you are also prompted for support of other networking protocols
    such as IPX and AppleTalk DDP. Enabling the IPX option turns on support for the
    IPX protocol, which older versions of Novell''s NetWare NOS'
