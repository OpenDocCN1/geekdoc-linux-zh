- img_proc: true
  md: '# System Security And Administration 283


    A dynamic route is a route that is assigned "on the fly," meaning no definitive
    route is set, and a route for a packet is assigned each time the packet is sent
    (not predetermined). A typical type of dynamic route is the route established
    with standard dial-up access to an ISP. When a request is made from the client
    for a particular Web site, the packet is sent from the ISP router. The ISP router
    then looks for the next router that can accept the packet for the requested recipient.
    If that route does not respond, the ISP router then looks for an alternate router
    that can reach the host (or an additional router), until the host is reached.
    The ability to use an alternate route is the main difference between dynamic and
    static routes. A dynamic route may use a separate route each time a specific host
    is requested, whereas a static route will use the exact route for the specified
    host.


    # Linux Firewalling


    The Linux kernel can be set up to firewalling, meaning that certain kinds of TCP/IP
    traffic are allowed, but other traffic is not. Firewall support is configured
    using ipchains. Support for ipchains is a new feature of 2.2.x (and very late
    2.0.x kernels). Earlier kernels used the ipfw utility (which is now obsolete).


    In order to perform firewalling on a Red Hat Linux system, you must have compiled
    the Linux kernel with firewalling support. To check if your kernel is already
    compiled for firewalling, do the following:


    ```

    ls -l /proc/net/ip_fwchains

    ```


    If the file exists, then your kernel already has support for firewalling. If not,
    you need to compile a kernel with firewalling support. If you need (or choose)
    to compile a new kernel for firewalling support, enable (or modularize) the following:


    +   - Networking support (CONFIG_NET)

    - Network firewalls (CONFIG_FIREWALL)

    - TCP/IP networking (CONFIG_INET)

    - IP: firewalling (CONFIG_IP_FIREWALL)

    - IP: always defagment (required for masquerading) (CONFIG_IP_ALWAYS_DEFRAG)


    # ipchains


    The ipchains tool specifies firewall policies to the Linux kernel. With ipchains,
    you can filter depending on IP address, port, network, destination, source, subnet,'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'connection state, domain names, sub-domain names, and so on. You can install
    ipchains the package on the Red Hat Linux 6.0 CD-ROM. The RPM for ipchains is
    ipchains-1.3.8-3.i386.rpm.


    There are three different categories of rules in ipchains: the IP input chain,
    the IP output chain, and the IP forwarding chain. For each category, an individual
    table of rules is maintained:


    +   - IP input chain (Input firewall) The IP rules regulate the acceptance of
    incoming IP packets. All packets coming in via one of the local network interfaces
    are checked against the ip firewall rules. A rule that matches a packet will cause
    the rule''s packet and byte counters to be incremented appropriately.


    +   - IP output chain (Output firewall) The IP output define the permissions for
    sending IP packets. All packets that are to be sent via one of the local network
    interfaces are checked against the output firewall rules. A rule that matches
    will cause the rule''s packet and byte counters to be incremented appropriately.


    +   - IP forwarding chain (Forwarding firewall) The IP rules define the permissions
    for forwarding IP packets. All packets sent by a remote having another remote
    destination are checked against the forwarding firewall rules. A rule that matches
    will cause the rules packet and byte counters to be incremented appropriately.


    # Using ipchains


    There are multiple options, rules, and so on that can be used for issuing ipchains.
    The standard syntax for using ipchains is:


    ```

    ipchains -command chain [rule specification] [target]

    ```


    There are several different commands that can be used to ipchains. Table 11.4
    lists the six most common commands, usage, and description of what the command
    does. (For a complete list, view the ipchains(5) man page – man ipchains.)


    Rule specifications are required when you use (-A) or delete (-D) a rule. There
    are several parameters that may be used for rule specifications (for a complete
    list, view man 5 ipchains). Three popular rule specifications are -p (protocol),
    -s (specify), and -j (jump), described here:


    +   -p Specifies protocol. Protocol can be tcp, udp, icmp, or all. For example,
    usage= ipchains -A input -p icmp -s target.


    +   -s Specifies the source. Source can be name of host, or an IP address. For
    example, usage= ipchains -A input -s 192.168.100.0 -j target.'
