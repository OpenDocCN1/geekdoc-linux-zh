    # # Module Configuration


    Module loading and so on to be handled in Red Hat Linux by kerneld. As of Red
    Hat Linux 6.0, however, kerneld is obsolete. The Red Hat Linux kernel now uses
    kmod to handle the loading of kernel modules.


    One configuration file used with modularized kernels is /etc/conf.modules. The
    /etc/conf.modules file specifies commands, options, paths, and so on for'
