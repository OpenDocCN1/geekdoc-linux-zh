    # Email Services


    Email services comprise three parts: the Mail Transport Agent (MTA), the Mail
    Delivery Agent (MDA), and Mail User Agent (MUA). The MTA is responsible for the
    physical sending and receiving of user and system email. The MDA receives the
    incoming email from the MTA and delivers it to the appropriate user. The MUA retrieves
    the mail delivered by the MDA and allows the user to read it. In addition to incoming
    mail relay from MTA to MDA to MUA, outgoing mail is submitted by the MUA, transferred
    to the MTA, and sent to the appropriate recipient. In this section we will briefly
    discuss the default Red Hat Linux MTA (sendmail), MDA (procmail), and popular
    MUAs (elm, pine, and Netscape).'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Configuring sendmail


    The most popular (default Red Hat Linux) Mail Transport Agent (MTA) is sendmail.
    The sendmail program is typically installed by default during installation, and
    when installed via the Red Hat 6.0 CD-ROM, requires no configuration to work properly.


    If sendmail is not installed during your Red Hat Linux installation, you can install
    the RPM found on your Red Hat Linux 6.0 CD. The sendmail RPM file on the Red Hat
    6.0 CD is sendmail-8.9.3-10.i386.rpm and is found in /RedHat/RPMS/ directory on
    your Red Hat 6.0 CD-ROM.


    # Configuring sendmail


    The main configuration file for sendmail is /etc/sendmail.cf. The /etc/sendmail.cf
    file is machine-readable code to run sendmail. Since /etc/sendmail.cf is machine-readable,
    it is not very administrator-reader friendly. Because of the complexity and sensitivity
    of this file, it is not recommended to edit this file by hand. For this task,
    there is a macro pre-processor available, m4, which should be used to recreate
    the sendmail.cf file from edited source (/etc/sendmail.mc).


    To use m4, you must install the sendmail-cf RPM file, sendmail-cf-8.9.3-1.i386.rpm
    found on your Red Hat 6.0 CD in the /RedHat/RPMS/ directory. To make changes to
    your /etc/sendmail.cf file, follow these instructions:


    +   1. Make backups of your /etc/sendmail.cf and /etc/sendmail.mc files. Copy
    these files from sendmail.cf to sendmail.cfold and from sendmail.mc to sendmail.mc,
    or something suitable.

    2. Edit /etc/sendmail.mc. Edit the /etc/sendmail.mc to make any changes you need.
    If an option is in single quotes, be sure the first quote around the item and
    the last quote after the item is a forward tick (). To disable (or cancel) a line,
    insert dnl at the front of the line.

    3. Generate new /etc/sendmail.cf. Generate the new /etc/sendmail.cf list from
    the edited /etc/sendmail.mc using the m4 macro processor. To do this, execute:
    m4 sendmail.mc > sendmail.cf. (Please double-check to see that you have a backup
    of your running sendmail.cf before overwriting your current one!)


    +   4. Restart sendmail. Restart sendmail by running /etc/rc.init.d/sendmail restart.


