  md: '# RHCE Linux


    # The Cram Sheet


    The Cram Sheet contains the distilled, key facts about the RHCE 300 Exam. Review
    this information last thing before you enter the test room, paying special attention
    to those areas where you feel the need the most review.


    # INSTALLATION


    +   Use the root boot disk for the installation:

    * boot.img Standard installation

    * bootnet.img Network installation

    * pcmcia.img PCMCIA required installation


    Install LILO in appropriate location:


    +   * MBR If LILO will be default bootloader

    * First partition of boot sector If using other OS bootloader


    +   5. Seven steps to compiling a kernel:

    * a. make configuration (config, menuconfig, xconfig)

    * b. make dep

    * c. make clean

    * d. make bimage (or zimage)

    * e. make modules

    * f. make modules_install

    * g. configure LILO and reboot


    # LINUX FILESY


    Root filesystem is made up of 12 systems by default.


    +   * /bin /lost+found

    * /dev /mnt

    * /etc /proc

    * /sbin /usr

    * /home /var

    * /opt /usr/local


    +   6. Six shorter steps to compiling a kernel:

    * a. make configuration (config, menuconfig, xconfig)

    * b. make clean bimage modules modules_install

    * c. configure LILO and reboot


    # X WINDOW SYSTEM


    +   7. Three configuration tools:

    * Xconfigurator

    * XF86Setup

    * xf86config


    # KERNEL COMPILING


    +   3. Three options for configuring a kernel:

    * make config

    * make menuconfig

    * make xconfig


    +   4. Two types of kernel images:

    * zimage (small kernel images)

    * bimage (compressed kernel images)


    # APACHE


    +   8. The main configuration directory is /etc/httpd/conf/

    9. Apache configuration files:

    * access.conf Global access configuration

    * httpd.conf Main http server configuration

    * srm.conf Defines user space configuration'
