    # The Custom Configuration


    The Custom Configuration allows you to set up any particular configuration you
    want. You are given two ways to select your packages: You can select either a
    feature that automatically selects the necessary packages or one that selects
    individual packages manually. You are even given the option to install everything,
    which is simple for new users.


    # Examining Hard Disk Options


    After you choose your configuration method, the installation moves on to setting
    up the physical hard drive. First, Linux scans the system to autodetect whether
    you have any SCSI adapters installed. If none is found, you are asked if you have
    one installed. If you answer yes, you are prompted to select your adapter from
    a device listing.


    Next, you must specify exactly where you want the Linux install to be physically
    placed. You do this by partitioning, formatting, and setting up mount points.
    First, you are asked to select a disk-editing tool. You are given the option of
    Disk Druid or fdisk. Disk Druid is Red Hat''s install-time disk management utility.
    It can create and delete partitions according to user-supplied requirements as
    well manage mount points for each partition. The traditional Linux disk partitioning
    tool fdisk, introduced in Chapter 3. The program fdisk is a bit more flexible
    than Disk Druid, but it requires you to have some experience with disk partitioning
    and to be accustomed to using a text interface.


