  md: 'Security is an essential part of networking. Keeping your system secure from
    crackers and unavailable for unauthorized use is a must. Some very basic security
    problems can arise from standard daily activities.With such emphasis placed on
    network security today, it is important for an RHCE in the workplace to be comfortable
    with setting up network security. With this mind, configuration and working knowledge
    of network security tools and concepts is essential. In this chapter, we will
    discuss security concepts, NIS (Network Information Service), PAM (Pluggable Authentication
    Modules), inetd, and tcp_wrappers. We will also discuss some advanced network
    options including routing, firewalling, and IP masquerading.


    # # NIS


    NIS is Sun''s Network Information Service. It was formerly known as Yellow Pages,
    but after a trademark dispute with British Telecom, Sun changed the name to Network
    Information Service.


    NIS is a small directory service whose main purpose is to allow authentication
    for users on local network systems. NIS allows configuration information such
    as passwd and group files, sendmail aliases, mount maps, and hosts to be kept
    on a separate server. Each system map NIS domain runs the NIS client and ybind
    to find a server and retrieve the appropriate maps on it.


    Within a NIS domain, there must be at least one NIS server. In some cases, multiple
    NIS servers are set up with master and slave NIS servers. In the master-slave
    setup, the slave servers make copies of the master NIS database changes.


    You must run the RPC PortMapper(/usr/sbin/portmap) to run NIS.The RPC PortMapper
    servers convert the RPC program numbering to TCP/IP or UDP/IP port numbers. Typically,
    the PortMapper servers are started by inetd. We will discuss network on inetd
    later in this chapter.


    # # NIS On Red Hat Linux


    Red Hat Linux 6.0 ships with NIS v.2 compliant clients, servers, and tools. The
    three NIS packages in Red Hat Linux 6.0 include ybind (the NIS client), ypserv
    (the NIS server), and yp-tools (the utilities for querying the NIS server). NIS
    is only used when specified by the /etc/nsswitch.conf file and ybind. In this
    section, we will discuss the NIS client and NIS server commands.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# System Security And Administration


    # NIS Client


    The NIS client is responsible for querying the NIS server for information from
    the NIS system maps and other NIS information. There are five main tools that
    NIS clients use:


    +   - ybind Finds and stores information about an NIS domain and server. Information
    is stored in /var/yp/binding.

    - ypwich Returns the name of the NIS server used by the NIS client.

    - ypcat Prints the values of all keys in the specified NIS database.

    - yppoll Returns the version and master server of the specified NIS map.

    - ypmatch Prints the values of keys from an NIS map.


    # NIS Server


    The NIS server is responsible for hosting the system maps and authentication files
    on its dedicated machine. The NIS server then responds to NIS client requests
    for authentication, system map, and other NIS information. In addition to the
    NIS client commands, the NIS server uses NIS commands such as:


    +   - ypserv The NIS server program.

    - ypppasswd Server that handles the NIS password changes.


    # Other NIS Commands


    There is a number of other NIS commands that are available for use on NIS networks.
    A couple of NIS commands that are commonly used are:


    +   - makedbm Translates ASCII databases, such as /etc/passwd to DBM databases.

    - yppush Notifies the slave servers when changes are made to master databases.


    # /etc/nsswitch.conf


    NIS is only implemented when specified by the /etc/nsswitch.conf file or with
    ybind. The GNU C library includes support for the Name Server Switch file (/etc/nsswitch.conf),
    which is patterned after the nsswitch.conf file on Solaris 2. The Name Server
    Switch file configures the order of lookups for various system services. The following
    snippet is the /etc/nsswitch.conf file that is shipped with Red Hat 6.0.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 270 Chapter 11


    ```

    #

    # /etc/nsswitch.conf

    #

    # An example Name Service Switch config file. This file should be

    # sorted with the most-used services at the beginning.

    #

    # The entry ''[NOTFOUND-return]'' means that the search for an

    # entry should stop if the search in the previous entry turned

    # up nothing. Note that if the search failed due to some other

    # reason (like no NIS server responding) then the search

    # with the next entry.

    #

    # Legal entries are:

    #

    # nisplus or nis+      Use NIS+ (NIS version 3)

    # nis or yp            Use NIS (NIS version 2), also called YP

    # dns                  Use DNS (Domain Name Service)

    # files               Use the local files

    # db                   Use the local database (.db)

    # compat             Use NIS on compat mode

    # [NOTFOUND-return]    Stop searching if not found so far

    # To use db, put the "db" in front of "files" for entries you

    # to be looked up first in the databases

    #

    # Example:

    #passwd:             db files nisplus nis

    #shadow             db files nisplus nis

    #group:              db files nisplus nis


    passwd:             files nisplus nis

    shadow:             files nisplus nis

    group:              files nisplus nis


    #hosts:             db files nisplus dns

    hosts:              files nisplus dns


    services:           nisplus [NOTFOUND-return] files

    networks:           nisplus [NOTFOUND-return] files

    protocols:          nisplus [NOTFOUND-return] files

    rpc:                nisplus [NOTFOUND-return] files

    ethers:            nisplus [NOTFOUND-return] files

    netmasks:            nisplus [NOTFOUND-return] files

    bootparms:        nisplus [NOTFOUND-return] files


    netgroup:           nisplus

    ```'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# System Security And Administration 271


    publickey: nisplus


    automount: files nisplus

    alias: files nisplus


    The format of the preceding nsswitch.conf file uses the layout, database: location[result-action],
    where database is the name of the requested database, location is the location
    of the database, result is the requested result, and action is the action that
    occurs if the requested result is matched. Therefore, in the above stock Red Hat
    6.0 nsswitch.conf file, passwd lookups with the getpw*C library will first go
    to the local passwd file, and if not located, will second NIS+, and if still not
    located will finally try NIS.


    Tables 11.1 through 11.3 list the databases, locations, and results that the GNU
    C library can recognize.


    > Note: The action for any result will always be either RETURN or CONTINUE.


    | Table 11.1 NIS databases.

    | Database | Database Explanation |

    | aliases | Mail aliases that are used by sendmail |

    | ethers | Ethernet numbers |

    | group | Groups of users used by getgrp functions |

    | hosts | Host names and numbers used by gethostbyname and similar functions |

    | netgroup | Network-wide list of hosts and users used for access rules |

    | network | Network names and numbers, used by getnetent functions |

    | passwd | User passwords used by getpasswd functions |

    | protocols | Network protocols used by getprotocol functions |

    | publicKey | Public and secret keys for secure_rpc, used by NIS+ and NFS |

    | rpc | Remote procedure call names and numbers used by getrpcbyname and similar
    functions |

    | services | Network services uses by getservent functions |

    | shadow | Shadow user passwords used by getspnam functions |'
  merge: -1
  pgno: 302
- img_proc: true
  md: '| Table 11.2 NIS locations. |

    | Location | Location Description |

    | nisplus (nis+) | lookup via NIS+ |

    | nis (yp) | lookup via NIS |

    | compat | lookup via NIS in manner compatible with older versions of glibc |

    | db | lookup via local database files |

    | files | lookup via text files |

    | dns | lookup via DNS |


    | Table 11.3 NIS results. |

    | Result | Result Description | Default Action |

    | SUCCESS | The error occurred and the wanted entry is returned. | Return |

    | NOTFOUND | The lookup process works OK, but the needed value was not found.
    | Continue |

    | UNAVAIL | The service is permanently unavailable. This can either mean the needed
    file is not available, or for DNS, the server is not available or does not allow
    queries. | Continue |

    | TRYAGAIN | The service is temporarily unavailable. This could mean a file is
    locked or a server cannot accept any more connections. | Continue |


    # Pluggable Authentication Modules (PAM)


    PAM is the Pluggable Authentication Modules system that enables ruleset implementation
    without having to recode individual services. All security conscious programs
    (such as login, su, and ftp) are configured by PAM to do a variety of authentication
    and security checks.


    When a service such as login is used, PAM will check its configuration files to
    determine how to authenticate the user. For instance, PAM may authenticate by
    checking /etc/passwd, kerberos, or NIS. After the method of authentication is
    determined, PAM will then return an answer to the service to indicate whether
    the user was authenticated.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# PAM Configuration


    All the PAM configuration files are located in /etc/pam.d/. Every application
    service that can use PAM has a file entry in /etc/pam.d/ as well. Some of the
    most common entries can be found under /etc/pam.d/ include chfn, csh, halt, lunixconf,
    login, password, ppp, reboot, rlogin, shutdown, su, xdm, and xscreaver. If installed,
    you may even see kde, samba, and ssh here as well. Looking at these files, you
    will see four columns of information. They include module-type, control-flag,
    module-path, and arguments. Take a look at the following example of the login
    entry under /etc/pam.d/:


    ```

    #PAM-1.0

    auth required /lib/security/pam_securetty.so

    auth required /lib/security/pam_pwdb.so shadow nullock

    auth required /lib/security/pam_login.so

    account required /lib/security/pam_pwdb.so

    password required /lib/security/pam_cracklib.so

    password required /lib/security/pam_pwdb.so nullock use_authtok

    session required /lib/security/pam_pwdb.so

    session optional /lib/security/pam_console.so

    ```


    # module-type


    There are currently four types of modules that you will find the module-type column
    in your PAM configuration files. These include auth, account, session, and password.


    +   auth This module type provides two ways of authenticating the user. First,
    it establishes that the user is who the user claims to be. It does this by instructing
    the application to prompt the user for a password. The module can then grant group
    membership (independent of /etc/groups) or other privileges through their credential
    properties.


    +   account This module performs non-authentication-based account management.
    It is typically used to restrict or permit access to a service based on the time
    of day, maximum number of users, or even the location of the user (for instance,
    allowing user “root” to only log in from the console).


    +   session This module is associated with performing duties that need to be done
    for the user before they can be given service. Services that are affected by this
    include the logging of information of a user opening and closing data, mounting
    directories, and so on.


    +   password This module is required for updating the authentication token associated
    with each user. There is typically one module for each challenge- or response-based
    authentication (auth) module-type.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# 274 Chapter 11


    # control-flag


    control-flag is used to indicate how the PAM library will react to the success
    or failure of the module with which it is associated. The four flags that used
    to specify the module actions are required, requisite, sufficient, and optional,
    described here:


    +   - required This indicates that the success of the module is required for the
    module-type facility to succeed. If this module fails, the failure will not be
    apparent to the user until all the modules of the same module-type have been executed.


    +   - requisite This is similar to required, but if this module fails, control
    is immediately returned to the application. This flag is useful to protect against
    the possibility of a user being allowed to enter a password over an unsafe medium.


    +   - sufficient This indicates that the Linux-PAM library is satisfied this module-type
    has succeeded in its purpose. If no previous module failed, no more stacked modules
    of this type are invoked. If this module fails, the result is not deemed fatal
    to the application.


    +   - optional This control-flag marks the module as not being critical to the
    success or failure of the user''s application for service. In fact, Linux-PAM
    will ignore such a module when determining the module stack succeeds or fails.


    # module-path And Arguments


    The module-path is the path name to the dynamically loadable module. The default
    path to the module is set to /usr/lib/security/, unless another path is mentioned.
    Typically the full path /usr/lib/security/ is listed regardless.


    The argument column of each entry lists arguments that are passed to the module
    when the module is invoked. Typically, these arguments are optional and are listed
    specifically to each given module. If an argument is invalid, the module ignores
    it. If such an error is made, the module is required to write the error to syslog,
    the system logfile. The five generic arguments that are often used and understood
    by most modules are debug, no_warn, use_first_pass, try_first_pass, and user_mapped_pass,
    described here:


    +   - debug Use the syslog call to log debugging information to the system log
    files.


    +   - no_warn Instruct module to not give warning messages to the application.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# System Security And Administration 275


    use_first_pass The module should not prompt the user for a password. Instead,
    it should obtain the previously typed password from the preceding auth module.
    If that does not work, the user will not be authenticated.


    try_first_pass The module should attempt authentication with the previously typed
    password from the preceding auth module. If that does not work, the user is prompted
    for a password.


    use_mapped_pass Instructs the module to take the clear token entered by a previous
    module and use it to generate an encrypted (or decrypted) key to safely store
    or retrieve the authentication token required for the module.


    use_mapped_pass is not currently supported by any of the modules in the Linux-PAM
    distribution because of possible consequences associated with U.S. encryption
    restrictions. Developers within the United States (or their own country) may implement
    freely within their country.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_306_0.png)


    > A special argument listed in the example for auth was shadow. This refers to
    support for shadow passwords, which is supported by pam_pwdb.so. Shadow passwords
    utilize several methods to increase system security. Shadow passwords make system
    password files more difficult to extract system password information by replacing
    the password field of /etc/passwd (with an “x”) and creating the file /etc/shadow
    to contain the password hash.


    > Red Hat 6.0 can use shadow passwords during installation. If shadow passwords
    were not enabled during installation, the system can be converted to use shadow
    passwords by running the pwconv program. If needed, it can later be converted
    back to regular password using pwunconv. The change should be transparent to all
    programs that use PAM.


    # /etc/securetty


    As one of the most popular uses of PAM, the /etc/securetty file is used to specify
    settings for the secure tty access on the system. The /etc/securetty file is used
    by login to enable tty devices that root is allowed to log in. Typically only
    the local consoles are listed. By limiting access to local consoles, you disable
    direct login superuser privileges from anywhere except the console. This is not
    fail-safe however, as disabling virtual terminal console login does'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# 276 Chapter 11


    not restrict the user from using su to log in as root from the user account. The
    output of the /etc/security file is very simple, as it only lists the tty devices
    that allow root logins. Figure 11.1 shows a sample output of a default Red Hat
    6.0 /etc/security file.


    # inetd


    The daemon inetd is the Internet daemon that controls most of the network services
    for listening incoming connections on your machine. The daemon runs in the background,
    binding all relevant ports and calling the appropriate servers when necessary.


    The /etc/inetd.conf configuration file controls the inetd daemon. This inetd.conf
    file specifies which services the machine is supposed to manage, and it contains
    a list of entries comprised of seven fields. The seven fields include the service
    name, socket type, protocol, wait/nowait, user, server program, and arguments,
    described here:


    +   * Service Name The service name is translated to a port number by looking
    the service name up in the /etc/services file.

    * SocketType This specifies either the stream for TCP or dgram for UDP.

