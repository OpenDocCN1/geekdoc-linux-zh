  md: '# Standard Networking Services 239


    and are typically named db.domain.com, or domain.com.db. In these examples, we
    will use db.example.com. The following is a sample forward DNS file for a master
    (primary) record:


    ```

    @ IN SOA ns.example.com. root.example.com. ( |

    | 1999080101 ; serial |

    | 10800 : refresh (3 hours) |

    | 3600 : retry (1 hour) |

    | 604800 : expire (7 days) |

    | 86400 ) minimum (1 day) |

    |

    |IN NS ns1.example.com. |

    |IN NS ns2.example.com. |

    |

    |IN MX 0 mail.example.com. |

    |IN A 192.168.0.212 |

    |localhost IN A 127.0.0.1 |

    |www IN A 192.168.0.212 |

    |ns1 IN A 192.168.0.10 |

    |ns2 IN A 192.168.0.11 |

    |ftp IN CNAME www |

    |mail IN CNAME www |

    |irc IN CNAME irc.example.net.

    ```


    For better clarity, the sections of the /var/named/db.example.com file have been
    highlighted. The first section is the SOA (start of a zone authority) entry. The
    SOA entry contains the domain of the originating host, domain address of the maintainer,
    the file serial number, and various time parameters (refresh, retry, expire, and
    minimum TTL).


    The second highlighted section of the sample /var/named/db.example.com specifies
    the domain''s primary and secondary DNS server. These are denoted by the NS tokens.
    The first NS entry specifies the secondary DNS server. You can also add tertiary
    DNS servers and so forth with as many NS entries.


    The third highlighted section includes other references, options, and settings
    for the domain entry. The MX (mail exchange) token points to the mail exchange
    server for the domain. The A tokens point to host addresses. For example the A
    token to 192.168.0.212. Another A token sets the www.example.com to 192.168.0.212
    as well. An additional token used in this example is CNAME (canonical name). The
    CNAME token points an alias to the appropriate IP address or domain. In the above
    example, ftp.example.com is pointed to the same address as www,'
