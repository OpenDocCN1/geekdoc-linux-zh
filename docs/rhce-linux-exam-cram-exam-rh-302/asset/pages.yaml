  md: '# Chapter 9


    to Adobe Illustrator or Corel Draw. The klyx program is a modern approach to writing
    documents with a computer based on LyX formatting. Some popular information management
    tools available for KDE include kalendar and organizer. The kalendar program is
    a simple KDE-based calendar and to-list manager. The organizer is a bit more complex
    program that involves a calendar and appointment manager similar to those of Microsoft
    Outlook and Netscape''s NSCAL. You can find many additional applications for KDE
    at www.kde.org.


    # Remote X Applications


    A very popular feature of the X Window system is that it can display an X application
    on remote host, as mentioned earlier in this chapter. X is an entirely network-transparent
    system that can provide seamless access from another station to is running applications.
    This is even possible to display to other machines, even if the other machine
    is not running the same operating system! To set up such access, you must use
    a host authentication program, as xhost or xauth, and use the command to export
    the DISPLAY environment variable, such as export DISPLAY=remotehost:0.


    # Setting Up Remote Access


    You use the xhost program to grant permission to host applications to other machines.
    Using xhost is simple. To enable permission to display remote applications, use
    xhost +remotehost. To disable permission to display remote applications, use xhost
    -remotehost.


    To display a shell to another host, use this string:


    ```

    export DISPLAY=remotachine:0.0

    ```


    After this string is executed, that''s display is set to the remote machine specified.
    Any commands executed in that shell are then displayed to the remote machine.


    To display a single command to another host, use the


    ```

    command DISPLAY=remotachine:0 command

    ```


    command, where remotachine is the machine that the application is to be displayed
    to, and command is the command to be exported to the remote machine.'
