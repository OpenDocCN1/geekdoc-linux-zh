  md: '# Sample Written Test


    In this chapter, we provide pointers to help you develop a successful test-taking
    strategy, including how to choose proper answers, how to decode ambiguity, how
    to work within the Red Hat testing frame-work, how to decide what you need to
    memorize, and how to prepare for the test. At the end of the chapter, we include
    50 questions on subject matter pertinent to the RHCE 300 exam. Good luck!'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Questions, Questions, Questions


    There should be no doubt in your mind that you are facing a test full of specific
    and pointed questions. The written element of the RHCE 300 exam will consist of
    50 questions and take somewhere between 30 and 60 minutes.


    When taking the exam, you may be presented with various types of questions, such
    as:


    +   - Multiple choice with a single answer.

    - Multiple choice with multiple answers.

    - Statement with a choice of "true" or "false".


    Always take the time to read a question least twice before selecting an answer.
    However, not every question has only one answer; many questions require the "best"
    answer. Therefore, you should read each question carefully, determine how many
    answers are valid, and look for hints in the question when selecting answers.


    # Choosing Proper Answers


    The only way to pass any exam is to select enough of the right answers to obtain
    a passing score. However, Red Hat''s exams are not standardized like the SAT and
    GRE exams; they are far more diabolical and convoluted. In some cases, questions
    are strangely worded, and deciphering them can be a real challenge. In those cases,
    you may need to rely on answer-elimination skills. Always, at least one answer
    out of the possible choices for a question can be eliminated immediately because
    it matches one of these conditions:


    +   - The answer does not apply to the situation.

    - The answer describes a nonexistent issue, an invalid option, or an imaginary
    state.

    - The answer may be eliminated because of information in the question itself.


    After you eliminate all answers that are obviously wrong, you can apply your retained
    knowledge to eliminate further answers. Look for items that sound correct but
    refer to actions, commands, or features that are not present or not available
    in the situation that the question describes.


    If you''re still faced with a blind guess among two or more potentially correct
    answers, reread the question. Try to picture how each of the remaining answers
    would alter the situation. Be especially sensitive to terminology, sometimes'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'the choice of words, such as “remove” instead of “disable,” can make the differ-ence
    between a right answer and a wrong one.


    Only when you''ve exhausted your ability to eliminate answers but remain un-clear
    about which of the remaining possibilities correct should you guess at an answer.
    An unanswered question offers you no points, but gives at least some chance of
    getting a question right; just don''t be too hasty when making a blind guess.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_338_0.png)


    If you''re taking a multiple-choice test, you can wait until the last round of
    reviewing questions (just as you''re about to run out of time or out of unanswered
    questions) before you start making guesses. Guessing should be a last resort.


    # # Working Within The Framework


    The tests appear in random order, and many elements or issues that receive mention
    in one question may also crop up in other questions. It''s not uncommon to find
    that an incorrect answer to one question is the correct an-swer to another question,
    or vice versa. Take the time to read every answer to each question, even if you
    recognize the correct answer to a question immedi-ately. That extra reading may
    spark a memory or remind you about a Linux feature or function that will help
    you on another question in the exam.


    For the multiple-choice exam, you can revisit any question as many times as you
    like. If you''re uncertain of the answer to a question, circle it and come back
    to it later.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_338_1.png)


    For written tests, we strongly recommend that you first read through the entire
    test quickly, before getting caught up in answering individual questions. This
    will help to jog your memory as you review the potential answers and can help
    identify questions that you want to mark for easy access to their contents. It
    will also let you identify and mark the tricky questions for easy return as well.
    The key is to make a quick pass over the territory to begin—so that you know what
    you''re up against—and then to survey that territory more thoroughly on a second
    pass, when you can begin to answer all questions systematically and consistently.


    # # Preparing For The Test


    The best way to prepare for the test—after you''ve studied—is to take at least
    one practice exam. We''ve included one in this chapter for that reason. The test
    ques-tions are located in the pages that follow. (Unlike the preceding chapters
    in'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'book, the answers don''t follow the questions immediately; you''ll have to
    flip to Chapter 15 to separately review the answers).


    Give yourself an hour to take the exam, and keep yourself on the honor system—don''t
    look at earlier chapters in the book or jump ahead to the answer key. When your
    time is up or you''ve finished all the questions, you can check your work in Chapter
    15. Pay special attention to the explanations for the incorrect answers; these
    can also help reinforce your knowledge of the material. Knowing how to recognize
    correct answers is good, but understanding why incorrect answers are wrong can
    be equally valuable.


    # Taking The Test


    Relax. Once you''re sitting in front of the test, there''s nothing you can do
    to increase your knowledge or preparation. Take a deep breath, stretch, and start
    reading that first question.


    You don''t need to rush, either. You have plenty of time to complete each question
    and to return to those questions that you skip or mark for return. If you read
    a question twice and remain clueless, Both easy and difficult questions are intermixed
    throughout the test, you can circle it and come back to it later. When taking
    a multiple-choice test, don''t cheat yourself by spending too much time on a hard
    question early in the test, thereby depriving yourself of the time you need to
    answer the questions at the end of the test.


    On the multiple-choice test, you can read the entire test, and, before returning
    to circled questions for a second visit, you can figure out how much time you''ve
    got per question. As you answer each question, move on to the next. Continue to
    review the remaining marked questions until you run out of time or complete the
    test.


    That''s for pointers. Here are some questions for you to practice on.'
  merge: -1
  pgno: 339
