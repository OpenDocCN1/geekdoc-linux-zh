  md: '# Chapter 9


    The Window system is the GUI used when Linux is running. Administration tools
    used on Linux have a GUI interface that can be used with the X Window system.
    Most administrators use the X Window system on their Red Linux machines. Therefore,
    it is imperative that when you are studying for the RHCE 300 exam, you understand
    the X Window system, X servers, X clients, and remote X applications.


    # X Concepts


    The Window system is not a new concept. In fact, it has been implemented on several
    Unix systems before Linux was even created! One of the best explanations for where
    the X Window system came from can be found in the X Window system HOWTO, maintained
    by Ray Bringle, in the LDP (Linux Documentation Project, http://metalab.unc.edu/LDP).
    The HOW explains that the X Window system was developed in the Laboratory for
    Computer Science at the Massachusetts Institute of Technology and first released
    in 1984. The origins of X are based on the XWindowing package, developed by Paul
    Asente at Stanford.


    The HOWTO continues to explain that in September 1987, MIT issued the first release
    of the X11 that we know and use today. As X11R2, however, development and control
    passed from MIT to the X Consortium, formed in January 1988.


    The Window system is currently developed and distributed by the X.org. A liberal
    license permits the existence of free and low-cost implementations. Linux uses
    XFree86 version of the X Window system. The XF86 version, which is freely distributable,
    is a collection of X servers for Unix-based operating systems on Intel x86 platforms.
    The work is derived from X386, and much of the new work is contributed back into
    the X11R6 project thereafter.


    # X Window System Components


    The Window system is made up of four main components that interact with one another
    to X server, an client, the X protocol, and an X window manager. We will discuss
    the server, client, and window managers later in this chapter.


    You can establish the Window system client/server relationship in two ways. Typically,
    on a Red Hat Linux system, the client and X server are located on the same machine.
    In this scenario, the X application acts as the X client and the hardware display
    adapter acts as the X server. In other instances, especially within large Red
    Hat Linux networks, the client/server relationship is established between two
    separate machines—a physically separate X client and a separate X.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# X Window System 203


    With both client/server relationships, however, the client makes requests to the
    X server. The server responds by telling the client how to draw the windows on
    the X client display. The server''s response translates the X client''s request
    into hardware instructions, as put a pixel here, change this pixel color, do a
    screen refresh, and so on.


    All the request and response exchanges between the X client and X server are carried
    over the X protocol, the X Window system''s underlying network-parent protocol.
    The X protocol is used to enable programs to display graphic images on your monitor.


    The traffic that is set up between the X client and X server does not simply work
    by itself between the client and server. In fact, an X window manager is required.
    The X window manager, of which there are several types, acts like “middle management”
    between the X client and X server.


    # X Server


    The X server is responsible for listening for X client requests for hardware instructions
    about how to draw windows in a specific way on the X client. If the X server is
    running without a client that requests, your monitor has a gray pixel screen without
    any features or windows displayed. To understand the X Window system, and to pass
    the RHCE 300 exam, you must know about the various X86 servers available and X
    configuration.


    # XFree86 Servers


    Most Linux distributions use the XFree86 servers supplied by the XFree86 Project.
    The XFree86 Project, Inc. is a non-profit organization that produces XFree86,
    a freely distributable implementation of the X Window system that runs on Linux
    and other x86-based Unix operating systems. The XFree86 Project currently has
    over 15 available X86 servers. However, all of these servers will be combined
    into one with the release of X86 version 4.0, scheduled for later in 1999. Each
    server supports a specific type or family of video chipsets. Most of the most
    common servers are the FBDev, I128, Mach8, Mach32, Mach64, S3 Virge, SVGA, and
    VGA16. The majority of video cards used today are SVGA, Mach64, and S3 X86 servers.


    > Note: When all servers are compiled into one server with the release of X86
    version 4, individual chipset support will be modularized for use with the single
    X86 server.


    To see if an X86 server included in your Red Hat Linux distribution supports your
    video hardware, check Red Hat Software''s hardware compatibility lists'
  merge: -1
  pgno: 234
- img_proc: true
  md: '(http://www.redhat.com). For hardware support of other versions of XF6, visit
    http://www.xfree86.org, the Web site of the XFree86 Project, Inc. At this Web
    site, you can also download new versions of the XFree86 server.


    # X Server Configuration


    Setting up the X Window system involves many files, options, and settings. All
    the configuration files used for the X Window system, as well as several programs
    and configuration tools, are found in the /etc/X11/ directory. The most important
    programs and tools include X and xinit, as well as Xconfigurator, XF86Setup, and
    xf86config (discussed shortly).


    The file is actually a symlink to the X server you are using. The X server you
    are using is in /usr/X11R6/bin/ directory. Therefore, if you were using the XF86_S3
    server, your file could be symlinked to /usr/X11R6/bin/XF86_S3.


    The xinit program is used to start the X Window system. When executed without
    a specific client program indicated, xinit looks for a file named .xinitrc in
    the user''s home directory. The .xinitrc file is a script to start up client programs
    as the user has specified. If no .xinitrc is found in the user''s home directory,
    xinit uses the following by default:


    ```

    xterm -geometry +1+1 -n login -display :0

    ```


    # Xconfigurator


    Xconfigurator is Red Hat''s X Window system configuration program. To invoke this
    program, type "Xconfigurator" at the shell prompt. The Xconfigurator creates a
    basic XF86Config file that is based on the selections you make within the menu
    interface. This XF86Config file (on Red Hat systems) is under /etc/X11 (which
    happens to be symlinked to /usr/X11R6/lib/X11).


    When running Red Hat''s Xconfigurator, you are presented with a menu-based screen
    with a blue, red, yellow, and gray scheme (as was used during the Red Hat Linux
    installation). Figure 9.1 shows the interface used with Xconfigurator.


    Xconfigurator has two modes of operation: interactive and kickstart. In interactive
    mode, Xconfigurator prompts you for the type of video card and monitor attached
    to the system. Some of this information may be automatically probed and filled
    in for you. However, if you apply an "--expert" option to Xconfigurator, you can
    override any probed values.'
