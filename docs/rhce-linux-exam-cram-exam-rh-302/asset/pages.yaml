  md: '# Virtual Hosts


    As discussed in the previous section, virtual hosts are configured in the httpd.conf
    file. Virtual hosts are all the entries for enabling different hosts to be hosted
    on the same machine. Originally, Web servers typically only host a single domain
    on a single machine. Though other Web servers were developing methods to host
    multiple hosts on a single server, Apache was the first to develop a simple interface
    to accomplish hosting multiple domains on a single machine. The concept of having
    more than one host on a single machine is called virtual hosting.


    During early development of virtual hosting, Apache required individual IP addresses
    to be assigned to each host. Now Apache allows you to configure multiple hosts
    to share the exact same IP address. This means two domains could be assigned the
    exact same IP address, but have individual Websites.


    # Configuring Virtual Hosts


    Once you have Apache configured properly, there are eight simple steps to configure
    your virtual hosts by editing the httpd.conf file:


    +   1. Set NameVirtualHost. The NameVirtualHost setting is only required when
    setting up virtual hosts with the IP address. If you have individual IP addresses
    for each host, skip this step. The setting for NameVirtualHost can be either name-based
    (www.example.com), or IP-based (192.168.0.1). Use this setting to specify to httpd
    that there are multiple hosts under the specific name (www.domain.com), or IP
    (192.168.0.1). VirtualHost entries under the NameVirtualHost directive are indexed
    by the ServerName. A request for an IP or domain listed will be matched by ServerName
    and the NameVirtualHost directive will the appropriate DocumentRoot settings.
    For example, NameVirtualHost192.168.0.1.


    +   2. Set VirtualHost. The setting for the VirtualHost can be either name-based
    (www.example.com), or IP-based (192.168.0.1). Administrators typically prefer
    to use name-based settings. This allows the administrator to change IP addresses
    for the host in DNS without having to change the httpd.conf file. Make sure you
    have registered the domain and set up DNS to ensure this option works properly.
    For example, <VirtualHost www.example.com>.


    +   3. Set DocumentRoot. The setting for DocumentRoot points to the directory
    where the Web documents for the host can be found. This may point to a subdirectory
    for the host for a larger dedicated directory such as /home/httpd/domain, or to
    a dedicated subdirectory located'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'under a user''s home directory as /home/user/domain, or anywhere else you prefer.
    Within this dedicated directory, you should put any HTML or other Web files required
    for the Web site. Make sure the DocumentRoot directory, subdirectories, and files
    are world readable and executable (with permissions to set at least 755 for directories
    and 644 for files). For example, DocumentRoot/home/exampleadmin/example/.


    +   4. Set ServerName. The setting for ServerName is the name-based reference
    used by Web browsers to request your host''s Web site. For instance, if a user
    would put http://www.example.com/ to access your Web site, your ServerName would
    be www.test.com. This option is especially important when sharing IP addresses
    among hosts. For example, ServerName would www.example.com.


    +   5. Set ErrorLog. The setting for ErrorLog is to set the directory and file
    for http to store any errors for the specific host. By default, this setting is
    for logs/www.domain.com/error_log. For example, ErrorLog logs/www.example.com/error_log.


    +   6. Set TransferLog. The setting for TransferLog is to set the directory and
    file for http to log all access information for the host. The default setting
    for the TransferLog is logs/www.example.com/access_log. For example, TransferLog
    logs/www.example.com/error_log.


    +   7. Close VirtualHost Entry. To specify the end of the particular virtual host
    entry, you must close it by supplying the <VirtualHost> option as the last line
    of the virtual host entry. For example, </VirtualHost>.


    +   8. Save and restart. Save the changes to the httpd.conf file, and restart
    httpd (not your system). To restart httpd, type /etc/rc.d/init.d/httpd restart.


    There are several other options available to customize your individual virtual
    host entries. Three specific ones include the settings for Alias, Redirect, and
    ServerAlias:


    +   * Alias /sublocation/alternate_document_root Using the Alias setting allows
    you to set an alternative DocumentRoot file for a path below your host. For instance,
    if you would like to have one DocumentRoot for www.example.com, but have an entirely
    different DocumentRoot for www.example.com/example/, you could use the Alias within
    within www.example.com virtual host entry to point /example to another directory
    for its Web files. For example, Alias /example/home/test/'
