  md: '# 38 Chapter 3


    version 1. The version number of the Linux kernel is always in the form major.minor.patchlevel,
    where the minor number indicates whether the kernel is stable or in development.
    Stable kernels are indicated by an even minor number. For example, 1.0.9, 1.2.13,
    2.0.36, and 2.2.5 are all stable kernels, whereas 1.1.12 and 2.3.8 are development
    kernels. Stable kernels are updated frequently and are tested before they are
    released; development kernels are released as early as possible to allow testing
    and to allow all developers to “sync-up” their kernel source tree with Linux’s
    official tree.


    Development kernels are not guaranteed to compile, much less work properly. They
    usually do work well, so many sites need one or more not-quite-perfect features
    in the development kernels they will use for production systems. (For example,
    many sites with SMP systems run the 2.1.x kernels for greatly improved performance.)
    Real work is often being done with systems that run development kernels, so the
    kernel developers tend to receive excellent bug reports, which fuels the development
    cycle.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_69_0.png)


    You can always retrieve the Linux kernel source via anonymous FTP from http://ftp.kernel.org/pub/linux/kernel/
    or from one of its mirrors. There are directories for each kernel major.minor
    version. Each directory contains a file that indicates the latest release of that
    version. For example, a directory listing of the v1.2 directory shows the following:


    ```

    -r--r--r-- 1 502 101 0 Mar 29 1999 LATEST-IS-2.2.5

    ```


    Another quick way to determine the latest kernel version is to run the finger
    linux.kernel.org command. Doing so would give you output like that shown:


    ```

    [linux.kernel.org]

    The latest stable version of the Linux kernel is: 2.2.11

    The latest beta version of the Linux kernel is: 2.3.14

    The latest prefetch (alpha) version appears* to be: 2.3.15-3

    ```


    Once you have determined the version of the kernel source that you need, get the
    file linux-x.y.z.tar.gz or linux-x.y.z.tar.bz2 (where x.y.z is the version number).
    The file with the .bz2 extension is compressed with bzip2, and the file with the
    .gz extension is compressed with gzip. Generally, the bzip2-compressed file is
    much smaller (usually around 15 to 20 percent smaller) than the gzip-compressed
    file.'
