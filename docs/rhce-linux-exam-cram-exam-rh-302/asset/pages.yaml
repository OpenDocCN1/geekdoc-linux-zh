    # /etc/bashrc


    The /etc/bashrc is the global setup file for the bash shell. Red Hat Linux ships
    with several shells, including bash, korn, and c, but the standard Red Hat Linux
    shell is bash. The /etc/bashrc, by default, simply specifies options for the shell
    prompt. Here is a sample /etc/bashrc:


    ```

    # /etc/bashrc

    # System wide functions and aliases

    # Environment stuff goes in /etc/profile

    # For some unknown reason bash refuses to inherit

    # PS1 in some circumstances that I can''t figure out.

    # Putting PS1 here ensures it gets loaded every time.

    PS1="[\u\h \W]\$\$

    ```


    This/etc/bashrc file prints a prompt (notated by the PS1 line). It says to print
    the default prompt (PS1) with the format within the double quotation marks. The
    \u indicates to print the username, and the \h indicates to print the hostname.
    The \W indicates to print the last directory name within the entered path. The
    open and close brackets [] around the statement say to print brackets around the
    prompt. With the above setting on a system, your default prompt would look something
    like this:


    ```

    [root@celery root]#

    ```


    You could change the PS1 line to become a little simpler. For instance, if you
    wanted your prompt to simply read the hostname, but print the full path, /etc/bashrc
    file would look like this:


    ```

    # /etc/bashrc

    # System wide functions and aliases

    # Environment stuff goes in /etc/profile

    # For some unknown reason bash refuses to inherit

    # PS1 in some circumstances that I can''t figure out.

    # Putting PS1 here ensures it gets loaded every time.

    PS1=''\h:\w\''

    ```'
