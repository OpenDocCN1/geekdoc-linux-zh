    # Using Diskette-Based Kickstart


    The most common type of kickstart installation uses a kickstart boot floppy and
    CD-ROM. The required boot uses a ks.cfg configuration file. The ks.cfg file is
    created on the install information on a prototype machine. This means that in
    order to have a successful ks.cfg boot, you must manually set up one identical
    machine with the settings that you need on the system. After installing the system
    with everything you want, you can create the ks.cfg file. To do this, simply run
    the mkkickstart command and redirect the output to the ks.cfg file. For example,


    ```

    mkkickstart >ks.cfg

    ```


    can be run only as root. The mkkickstart utility then probes your prototype system
    for its configuration. Whenever it is finished, view the ks.cfg file to ensure
    everything was detected properly.'
