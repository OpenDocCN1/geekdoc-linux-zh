    in authentication, not firewalling.


    # Question 10


    > How is a network connection request handled when using tcp_wrappers?


    When a network connection request is made to a server, the request is accepted
    by inetd. If access is passed by inetd, then the request is handed to tcp_wrappers.
    Then tcp_wrappers checks the service and user grant permissions in /etc/hosts.allow.
    If no specifications are made in /etc/hosts.allow, the tcp_wrappers checks for
    any deny entries for the service or user in /etc/hosts.deny. If no deny entry
    is found in /etc/hosts.deny, the connection is granted.


    # Task 1


    Set up some basic security options on your machine. Disable any tools you don''t
    want anyone to use in inetd. Disable telnet in inetd and attempt to connect via
    telnet from another system. What happens?


    # Task 2


    Set up tcp_wrappers to deny connections from all except your local network. Attempt
    to connect to your machine from another network. What happens?'
