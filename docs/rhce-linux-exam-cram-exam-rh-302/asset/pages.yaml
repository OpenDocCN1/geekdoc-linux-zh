  md: '# Building RPMs


    RPM would not be nearly effective if you could build your own RPM packages. Using
    the -b option (for build) with rpm allows you to build your own package. In addition
    to the -b option, you can use the -t option (for tar files) to look inside tar
    files for the spec file to use.


    After specifying the first argument, you must specify the stage of building and
    packaging that is to be done. Here are some options and what they do:


    +   -bp Executes the "%prep" stage from the spec file. It typically unpacks the
    source and applies any patched patches.


    +   -bl Tells rpm to do a "list check". The "%files" section is macro expanded,
    and the rpm checks to make sure the files actually exist.


    +   -bc Tells rpm to do the "%build" stage from the spec file, following the prep
    stage. Essentially, it is the equivalent of a "make install",


    +   -bb Has rpm build a binary package. This is done after the prep, build, and
    install stages.


    +   -ba Builds both binary and source packages. This option is also done after
    the prep, build, and install stages.


    After making changes to rpm files, including patches and updates, you may opt
    to rebuild the rpm to include the new changes. There are two ways to use rpm in
    this manner: you can use rpm with the --recompile option or the --rebuild option.
    When you run rpm with either option, rpm installs the named source package and
    then automatically does a prep, compile, and install. In addition, the --rebuild
    option builds a new binary package. After the build has completed, the built directory
    is automatically removed (by using --clean), and the source and spec files for
    the package are removed.


