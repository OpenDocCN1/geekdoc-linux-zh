    Linux is composed of the Linux kernel and many GNU programs and utilities. Some
    popular GNU tools that are used frequently are Bash, CVS, ed, Emacs, finger, GCC,
    ghostview, the Gimp, gzip, mtools, screen, and tar. These are just a few of the
    existing GNU programs available, however. In fact, the GNU tools are often available
    for other commercial versions of Unix as. Due to the large amount of GNU tools
    that are used within Linux, and those that help make the Linux distribution, some
    advocates and evangelists differ on their opinions of what to actually call Linux
    itself. Many evangelists insist on calling Linux “GNU/Linux” or “Lignux”. Personally,
    I simply call it “Linux”. However, I credit the GNU tools for making Linux work.
    Therefore, as in the battle of how to pronounce Linux, I have no preference over
    what you call Linux.


    # The GNU General Public License (GPL)


    The GPL is the license that most open source projects use for their software.
    Developed in the late 1980s, it has not been revised since its publication in
    1991. The GPL is quite extensive, and many of its users interpret the document
    in different ways. The GPL text is shown in this book''s Appendix. Read it for
    a better understanding of the foundation of the Open Source community.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_45_0.png)


    Although you are not tested on this information in the RHCE Exam 300, you are
    required to have working knowledge of it.


    # History Of Linux


    Linus Torvalds started Linux as a hobbyist project in 1990. Torvalds, a college
    student from Finland, began the project after purchasing a computer to run Minix,
    a Unix-like operating system that was included in Andrew Tanenbaum''s textbook
    Operating Systems: Design and Implementation. Shortly after, Linus decided to
    learn more about some of the low-level features of the Intel 80386'
