    As in the /etc/initittab, root can use **init** and **telinit** to access other
    runlevels during regular operation. You can also use these commands to shut down
    or reboot a system. You don''t have to memorize these **init commands**; Red Hat
    Linux offers the **shutdown** command, which allows you to safely shut down your
    system. With **shutdown**, you can specify to halt with the “-h” option and reboot
    with the “-r” option. Passing a “-t” option in addition to either of them allows
    you to specify the time. For instance, **shutdown -r** specifies a reboot right
    now, whereas **shutdown -ht 300** specifies a shutdown in 300 seconds.


    # Understanding System

    Initialization Scripts


    System initialization scripts, all of which are found under the /etc/rc.d/ directory,
    are used to boot the system. Some of the most popular system initialization scripts
    are /etc/rc.d/rc.sysinit, /etc/rc.d/rc.serial, /etc/rc.d/rc.local, and /etc/rc.d/rc0
    through /etc/rc.d/rc.6 (run-level directories).


    # rc.sysinit


    The /etc/rc.d/rc.sysinit script is the startup script. Its main purpose is to
    check all the local filesystems. If there is a problem with performing the filesystem
    check, the rc.sysinit script is instructed to drop out of the existing shell,
    send the administrator an error message, and reboot the system. In addition, the
    rc.sysinit script instructs a filesystem to use quotas. Listing 8.1 includes some
    excerpts of the rc.sysinit script. This script is quite lengthy, so I have removed
    some of the extensive sections. For a complete look, take a glance at your /etc/rc.d/rc.sysinit
    file. The excerpts include the information related to filesystem checking and
    quotas.


    # Listing 8.1 Excerpts of the rc.sysinit script.


    ```

    # Start up swapping

    action "Activating swap partitions" swapon -a

    ```'
