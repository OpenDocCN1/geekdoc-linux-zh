    \ restart.\n\n# DNS Tools\n\nThere are a variety of DNS tools available to help\
    \ you utilize and test the DNS service. DNS tools should be installed on every\
    \ Linux workstation, not just DNS servers. Tools such as nslookup are a great\
    \ assistance for users who want to look up an IP address or domain using a name\
    \ server.\n\nDNS tools can be installed on your system with the bind-utils-8.2-6.i386.rpm\
    \ file found on your Red Hat Linux 6.0 CD in the /RedHat/PMS directory. Some of\
    \ the popular DNS tools included in this package are dig, nsquery, host, and nslookup.\
    \ Table 10.1 briefly explains these tools and gives an example of their usage.\n\
    \n| Table 10.1 DNS tools. |\n| Tool | Usage | Description |\n|---|---|---|\n|\
    \ dig | dig @nameserver domain | Queries name server for domain name packet information\
    \ |\\| nsquery | nsquery -n nameserver host | Queries domain name server for host\
    \ using resolver |\n| host | host domain | Looks up host for domain name |\n|\
    \ nslookup | nslookup domain or nslookup ipaddress | Queries Internet name servers\
    \ for IP and domain information |"
