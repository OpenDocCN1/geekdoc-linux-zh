    Organization: MIT AI Lab, Cambridge,


    Free Unix


    Starting this Thanksgiving I am going to write a complete Unix-compatible software
    system called GNU (for G''s Not Unix), and give it away free to everyone who can
    use it. Contributions of time, money, programs and equipment are greatly needed.


    To begin with, GNU will be a kernel plus all the utilities needed to run C programs:
    editor, shell, compiler, linker, assembler, and a few other things. After this
    we will add a text formatter, a YACC, an Empire game, a spreadsheet, and hundreds
    of other things. We hope to supply, eventually, everything useful that normally
    comes with a Unix system, and anything else useful, including on-line and hardcopy
    documentation.


    GNU will be able to run Unix programs, but will not be identical to Unix. We will
    make all improvements that are convenient, based on our experience with other
    operating systems. In particular, we plan to have longer filenames, file version
    numbers, crashproof file system, filename completion perhaps, terminal-independent
    display support, and eventually a Lisp-based window system through which several
    Lisp programs and ordinary Unix programs can share a screen. Both C and Lisp will
    be available as system programming languages. We will have network software based
    on MIT''s chaosnet protocol, far superior to UUOCP. We may also have something
    compatible with UUCP.


    Who Am I?

    Iam Richard Stallman, inventor of the original much-imaciated EMACS editor, now
    at the Artificial Intelligence Lab at MIT. I have worked extensively on compilers,
    editors, debuggers,'
