    > When the time on a system is changed for any reason, such as correction, daylight
    savings time, and so on, the crontab files may be affected. If the time is moved
    forward by less than one hour, any scripts or jobs scheduled to run during that
    time are executed. However, if the time is moved ahead by more than an hour, the
    scheduled jobs are missed.


    > On the other hand, similar jobs apply to moving time back. If the time is moved
    backward by less than one hour, the scheduled jobs are not run again. However,
    if time is moved more than an hour, commands are re-executed.


