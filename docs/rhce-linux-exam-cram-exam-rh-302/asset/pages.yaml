  md: '# Querying With RPM


    RPM was designed with querying capabilities. The RPM archives have custom binary
    headers that contain data about the package and its contents, allowing you to
    query individual packages very easily. You can search through your system database
    for packages and files, find out which package file belongs, and so on.


    To query a specific package, use the -q option (for query). Using the rpm -q option
    requires an argument that specifies the package name, such as libc. However, passing
    an -a option (for all) to the -q option such as


    ```

    rpm -qa

    ```


    queries and prints all installed rpm files on your system. Here''s an example
    of put querying specifically for all the libc packages you have installed on a
    system:


    ```

    # rpm -q libc

    libc-5.3.12-31

    libc-5.3.12-28

    ```


    This output shows that this particular system has two libc packages installed:
    libc-5.3.12-31 and libc-5.3.12-28. To get information about those specific packages,
    you can use the -i option with the query. The format for this is


    ```

    rpm -qi packagen

    ```


    The output of this gives you information such as the name of the package, any
    relocations (if applicable), the vendor that distributed it, the release number,
    the build date, the install date, and the source rpm and. In addition, it gives
    you a summary of the package and a description that gives what it is used for.


    Additional options used with the rpm query function are the -l (for list) and
    the -f (for file) options. The -l option queries for the contents of an RPM file.
    The -f function queries files of an rpm. The rpm -ql command is used against an
    existing rpm file. It lists all the files and directories that are contained within
    the rpm. For instance,


    ```

    rpm -q1 libc

    ```


    lists all the files and directories of the libc package. The rpm -qf command is
    used against an existing file; using this command on a file queries for the package
    that owns the specific file. For instance, doing an


    ```

    rpm -qf xbill

    ```'
