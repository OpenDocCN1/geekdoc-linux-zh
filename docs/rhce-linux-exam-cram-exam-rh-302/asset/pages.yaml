    # Configuring procmail


    For the MDA services of procmail, there is nothing you need to configure. This
    means after installation, procmail is ready to go “out of the box”. You can, however,
    customize how procmail handles each user''s mail by editing a .procmailrc file
    within each user''s home directory. By editing a user''s home .procmailrc, you
    can enable mail sorting, blocking, and more. For an in depth description of filtering
    options available through procmail, run man procmail.


    # Email Clients


    Email clients are the mail user agents used by the user to read her mail. There
    are a variety of MUAs available. Any MUA can be used as long as the MUA supports
    the POP or IMAP (discussed in Chapter 4) protocols to receive mail remotely. Some
    popular email clients on Linux include elm, pine, and the Netscape mail reader.


    # elm


    The MUA elm is a popular text-based mail reader on Unix systems. The interface
    is text-based and commands are given by simple key commands prompted by the mail
    reader. The text of the email is derived by editing a file with your default editor
