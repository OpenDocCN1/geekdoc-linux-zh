    # Modifying User Information


    A time will come when you need to modify a user''s information. Perhaps your user
    gets married and has a new name. Maybe you just need to change the user''s password,
    or change his permissions. For whatever reason, there are ways to modify the user''s
    account without to recreate it.


    To change a user''s password, you can manually edit the user''s /etc/passwd entry,
    run the passwd command, linuxconf, or even assign a random password using mkpassword.
    In addition, some useradd command allows you to specify such information during
    creation. For a complete list of options available, use man useradd. I''ll discuss
    the two most commonly ways: passwd and linuxconf.


    Running the passwd command from the root prompt prompts to change the root password.
    To change a user''s password using passwd, run


    ```

    passwd username

    ```


    You are then prompted to change and verify the username''s new password. This
    command is also made available to users for their own password. However, only
    root can use the passwd command to change other users'' passwords.


    # Understanding The Basic User Environment


    Any time user is created, either manually or with a user administration tool,
    a certain number of default files and directories are created in the user''s home
    directory (located at /home/username). By default, the files that are copied into
    the user''s home directory include .Xdefaults, .bash_logout, .bash_profile, and
    .bashrc, which we will discuss more fully in the next section.'
