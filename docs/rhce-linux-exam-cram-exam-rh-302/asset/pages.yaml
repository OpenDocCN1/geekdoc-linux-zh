    # XF86Setup


    The XF86Setup program is the XFree86 Project''s graphical user interface tool.
    You usually use XF86Setup to initialize up the XF86 servers, or to adjust current
    configurations. To invoke the XF86Setup at the shell prompt. When running, XF86Setup
    presents you with a gray, blue, and teal button-style interface that runs on a
    generic VGA16 server. Figure 9.2 shows XF86Setup''s interface.


    As you see in Figure 9.2, XF86Setup presents you with six buttons used for X Window
    system configuration. The first button, Mouse, allows you to configure your mouse
    settings. Within this menu, you can choose what type of mouse protocol to use
    (such as PS2, Microsoft, Logitech) and other mouse options such as the mouse device
    (/dev/ttyX or /dev/psanx) and other button settings.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_236_1.png)


    Figure 9.2 XF86Setup interface.'
