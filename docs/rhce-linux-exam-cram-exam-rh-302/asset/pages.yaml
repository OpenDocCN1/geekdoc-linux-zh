    image. Answer b, modular, is a kernel that makes use of modules for support. Answer
    c and d are types of kernel images, not a type of kernel, and are therefore incorrect.
    Answer e is invalid.


    # Question 40


    Answer b is correct. When installing Red Hat Linux on multiple (identical) machines,
    you can use kickstart to automate the install. Answer a, mkkickstart, is used
    to create the boot floppy for kickstart, but isn''t the program that runs, and
    is therefore invalid. Answer b, ghost, is a commercial software package not used
    by Linux to create hard-drive images and is not. Answer c, tar, is a compression
    tool, but is not used to install Red Hat Linux, and is incorrect. Answer d is
    invalid. Therefore, the answer is None of the above.


    # Question 41


    Answer a is correct. To schedule jobs or for programs to run at specific times,
    use cron. Answer b and c are invalid. Answer d, vi, is a Linux editor and is incorrect.


    # Question 42


    Answer c is correct. The main sendmail configuration file is /etc/sendmail.cf.
    Answers a and b are invalid (which also makes d invalid).


    # Question 43


    Answer c is correct. To specify what users are not allowed to access a system
    via FTP, edit the /etc/ftpsusers file. Answer a, /etc/ftpaccess, is used to configure
    FTP access options and is not correct. Answer b, /etc/hosts.deny, specifies domains,
    networks, and such that cannot access FTP, but not individual users, and therefore
    is incorrect.'
