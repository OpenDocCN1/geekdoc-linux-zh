  md: '# Advanced Installation 15


    The mkickstart does not properly report the partition sizes to the ks.cfg file.
    You must correct the lines you must correct are those that start with the part
    option (for partition). By default, the partition sizes are set to 1, which means
    1MB. You must adjust these numbers according to the partition sizes you want to
    setup.


    After you have created the ks.cfg file, copy it to your boot disk. The appropriate
    boot disk for this system uses the standard boot.img boot image. Simply copy the
    ks.cfg file to the boot diskette''s top-level or root directory.


    To start your kickstart installation, boot your system with the boot floppy, and
    have the Red Hat Linux CD-ROM in the cdrom drive. At the boot prompt, enter "linux
    ks=floppy". Your installation should go automatically from that point.


    # Using Network-Based Kickstart


    To use the network-based kickstart, you must have an NFS server available on your
    network to service the installations. In addition, you must have to use StaticIP,
    boot, or DHCP scheme for your system. To use a DHCP server, you should have the
    configuration information for the newly installed system, the location of the
    kickstart file to be used, and the location of the NFS server available on the
    DHCP server. The NFS server is used to supply the installation files; however,
    the DHCP server is set to supply the network information as well as individual
    ks.cfg files for the installed machines, if necessary.


    To start a network-based kickstart install, you simply need a Red Hat Linux boot
    disk created with the bootnet.img boot image. At the boot prompt, type "linux
    ks". This looks for the NFS and DHCP servers automatically and obtaining all the
    necessary information.


    Setting up network-based kickstart network installs are a bit complex and differ
    from network setup to network setup. Therefore, documentation for this process
    is limited. Although network kickstart procedures will be helpful to your career
    if you work in a large company, extensive knowledge of this process is unnecessary
    for your RHCE certification. However, you should have a good working knowledge
    of it.'
