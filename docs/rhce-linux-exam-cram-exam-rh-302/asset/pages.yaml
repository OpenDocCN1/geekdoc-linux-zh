  md: '# Glossary


    /bin/sh—The path to the standard shell on Linux (and Unix) systems.

    /etc/conf.modules—File specifies commands, options, and paths for modules. This
    file sets up any module aliases and parameters that may be required.

    /etc/crontab—File used to configure system cron (task schedule).

    /etc/fstab—File for configuration of filesystems on a machine

    /etc/group—File assigning users to specific (or shared) groups.

    /etc/hosts—File that contains hosts found on your system.

    /etc/httpd/conf/httpd.conf—Main httpd server configuration file.

    /etc/inittab—File containing system configuration information, including virtual
    consoles.

    /etc/lilo.conf—File responsible for the configuration of LILO.

    /etc/named.conf—Configuration file used to configure DNS.

    /etc/passwd—File containing user information such as user ID, user name, group
    ID, and password.

    /etc/printcap—File used to configure printers.

    /etc/rc.d/rc.local—Script used for local startup configuration.

    /etc/rc.d/rc.sysinit—The main startup script.

    /etc/security—File used to specify whichtty root is allowed to login on.

    /etc/sendmail.cf—Main configuration file for sendmail.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# /etc/skel


    /etc/skel—Directory containing default user files used when creating new accounts.

    /etc/smb.conf—Configuration file for SAMBA.


    /etc/smbpasswd—File containing password information for Windows users

    connecting to the Samba server.


    /etc/sysconfig—Directory containing script configuration files.


    a.out—The executable style of Linux and Unix systems. (The name comes

    from the default outpost file name of the C compiler).


    alias—A filename created as a “nickname” for another filename.


    Apache—Popular hyper-text transport protocol (HTTP) server based orig-

    nally on the popular web server NCSA’s 1.3.


    APM (Advanced Power Management)—System used to manage CPU calls,

    shutdown options, suspend options, and other power-related functions.


    ARP (Address Resolution Protocol)—The protocol to resolve IP ad-

    dresses to MAC addresses on ethernet.


    autoprobe—Term referring to system capability to make calls to a specific device,

    receivingiving identification, and other information from the device automatically.


    Bash (The Bourne Again Shell)—The GNU implementation of the Bourne/

    POSIX shell (/bin/sh).


    BIND (Berkeley Internet Name Domain)—The standard, free reference DNS

    server implementation using the vast majority of sites on the Internet.


    BIOS (Basic Input/Output System)—The code in ROM or Flash RAM on

    PC that initializes the hardware and starts the boot.


    BSD (Berkeley Software Distribution)—The Unix derivative created by

    University of California at Berkeley. (The portions of BSD are not derived from

    AT&T code are open-source software.).


    build—Term used for compiling, or creating programs, RPM files, database

    files, and so on.


    bzip—Compression utility for files.


    character-cell mode—Console based menu system.


    CIDR—Classless Inter-Domain Routing.


    CISC (Complex Instruction Set Computing)—The CPU architecture used

    in the Intel 80x86 line of microprocessors which has variable-length instruc-

    tions may require several clock cycles to complete.'
