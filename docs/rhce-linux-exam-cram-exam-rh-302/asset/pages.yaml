    # Reverse DNS Files


    Reverse DNS files are used to resolve IP addresses to their assigned host names.
    Reverse DNS is set up per subnet, meaning all 192.168.0.x addresses would have
    a single reverse DNS file defined, as 192.168.1.x, 192.168.2.x, and so on (where
    x is equal to all nodes from .0 through .255).


    Reverse DNS files are named by the subnet address (in reverse order) followed
    by the in-addr.arpa filename. For instance, the reverse DNS file for the 192.168.100.x
    subnet would be db.100.168.192.in-arpa, and the reverse DNS for the 205.23.12.x
    subnet could be db.12.23.205.in-arpa.


    Although the subnet and in-addr.arpa filenames are always used, many administrators
    rely the db. with rev., simply for clarification (for instance, rev.12.23.205.in-arpa
    or 12.23.205.in-addr.arpa). Regardless of naming convention you use, simply keep
    the naming convention throughout your system, and make sure all appropriate references
    (such as in /etc/named.conf) match appropriately.


    The following is an example of the reverse DNS file (db.0.168.192.in-arpa). You
    will notice that it looks similar to the forward DNS files, with the same SOA
    entry header, but has different tokens in the body of the file.


    ```

    @ ns.example.com. root.example.com. (

    199801011 : serial

    10800 : refresh (3 hours)

    3600 : retry (1 hour)

    604800 : expire (7 days)

    86400 ; minimum (1 day)

    1 NS ns.example.com.

    1 PTR gateway.example.com.

    2 PTR boss.example.com.

    3 PTR node3.example.com.

    ;4 PTR node4.example.com.

    212 PTR www.example.com.

    254 PTR router.example.com.)

    ```


    In this example, the first six lines are identical to the forward DNS files. The
    first six lines of the file are the SOA entry information that holds the host
    information, serial number, and various time settings. The remaining body of the
    example differs greatly from the forward DNS file, however. The remaining entries
    use the'
