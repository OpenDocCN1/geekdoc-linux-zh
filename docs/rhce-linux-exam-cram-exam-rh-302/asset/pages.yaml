    # Kernel Configuration Options


    When configuring a kernel using any of the make tools you are presented with at
    least 24 divisions of configuration options. These options range everywhere from
    configuration tool preferences to hardware support and even develop tools. This
    section discusses the different categories of options available, what settings
    are available, and what the standard preferences and practices are for each category.


    > Note: The options described in the following sections are not necessarily listed
    in the order in which your make option presents them. The order may also vary.
    These options and descriptions are based on the compilation of kernel 2.2. Options
    for other kernels, older or newer, may have fewer or additional options and categories
    because more hardware and other technologies are supported.


