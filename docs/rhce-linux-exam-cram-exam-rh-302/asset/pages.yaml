  md: '# 28 Chapter 3


    /opt The location for the optional packages. Many programs, such as Appixware
    and KDE, install packages in this directory.


    /usr/local The location where the administrator can install programs to the system.
    This is usually reserved for system programs. Linux distributions do not heavily
