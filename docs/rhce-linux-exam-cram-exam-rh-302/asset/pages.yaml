- img_proc: true
  md: '# Question 6


    +   Why do you need to run lilo after editing lilo.conf?

    - a. To rerun configuration settings and apply them to the appropriate lilo files,
    such as boot.b

    - b. To add new operating systems or kernels installed on the system to lilo boot
    manager

    - c. To save your changes made to lilo.conf

    - d. To check for errors made when editing lilo.conf

    - e. All of the above


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_185_0.png)


    Answer is correct. Running lilo after editing lilo.conf allows lilo to update
    its files, such as /boot/boot.b, to add new volumes and so on (answer a). Adding
    new boot partitions, kernel images, and so on (answer b) also requires running
    lilo so that they will be recognized during boot-time options. Answer c is questionable
    as correct because writing to the /etc/lilo.conf is saved when writing the physical
    file, but running LILO would save the changes to your boot configuration. Answer
    d is true as well; running lilo finds settings within the file that are duplicated
    labels or invalid boot images.


    # Question 7


    +   Why is the root filesystem mounted read-only during the LILO execution but
    then remounted read/write later during the boot process?

    - a. So crackers cannot get root information during the boot process with boot
    sniffers

    - b. So if system tasks fail during boot, you can run fsck on the filesystem without
    risking damage

    - c. So you cannot write to the root filesystem without root''s password

    - d. So that other operating systems, like Windows, cannot overwrite your partition


    Answer b is correct. If your boot fails when checking filesystems or other LILO
    boot options, the filesystem can be dropped to a shell and you can manually check
    the filesystem without risking damage to the filesystem. Answer b is incorrect
    because you can''t run fsck on a mounted filesystem. Answers a and d are incorrect
    because those options are impossible to do, therefore invalid.'
  merge: -1
  pgno: 185
