    - **Home** This gives you the option of specifying a specific home directory.
    The default is /home/$user, where $user is the user''s login name.

    - **Shells** This allows you to specify the location of the shells. This field
    has a drop-down box that displays the default shell.

    - **User ID** This is the number associated with individual user accounts. The
    system automatically sets this when the account is created.'
