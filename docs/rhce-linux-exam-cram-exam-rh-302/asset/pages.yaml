    margin (instead of printing the margin in a stair stepping pattern).


    # Configuring Network Settings


    If you selected and installed networking support, you are automatically prompted
    to enter your local networking information. (You are not prompted during installation
    to use dial-up information—you must configure dial-up after you have installed
    Red Hat Linux.) To set up networking, you are given the option of using Static
    IP address, BOOTP, or DHCP, as shown in Figure 5.11.


    When you set up a system with a static IP address, you are requested to provide
    standard local network information. You must enter a unique local IP address for
    your machine. This number could be part of a private non-routable network and
    you may opt to give your machine a routable IP, which your network administrator
    or Internet provider assigns. You are then asked to provide your a 192.168.x.x
    IP or 10.x.x.x IP number. You are then asked to provide your netmask, host name,
    and back-up name server locations. Next, you are prompted for your DNS information,
    such as domain name, host name, and back-up name server locations.


