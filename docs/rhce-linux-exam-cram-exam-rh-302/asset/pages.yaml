    # Using Variables


    Shell scripts, much like programs, use variables for argument communication. Variables
    are sequences of letters, digits, or underscores that must begin with either a
    letter or underscore. To retrieve the contents of the variable, you must prepend
    a $ to the variable name, as shown here:


    ```

    for foo in one two three;

    echo $foo

    done

    ```


    You can also export variables to be used in child processes within the script.
    You do so with the export keyword. Essentially, export tells the shell to make
    this variable an environment variable. The environment is passed to each child
    process of the script.


    # Using The test Command


    One of the most powerful commands in shell scripting is test(1). The test command
    is an external command that is called by the shell, as shown here:


    ```

    if test ; then

    do something

    fi

    ```


    On newer filesystems, test is symlinked to [.. When [ is used in a script, it
    has to be closed with a ] to be valid, as shown here:


    ```

    if [ expression ] ; then

    do something

    fi

    ```'
