  md: '# 110 Chapter 5


    # Question 3


    How can you troubleshoot LILO problems after installation?


    You can troubleshoot LILO problems by examining how LILO responds during iboot-time.
    If you don''t get the LILO prompt and don''t boot, you should use the boot disk
    to see that LILO was installed and check that it will be loaded. If you receive
    a part of the LILO command, as L or LIL?, you can tell which what happened (not
    all of the bootloader was loaded or started, or the address or descriptor table
    is corrupt, for example).


    # Question 4


    Where can you find out about hardware compatibility issues?


    Several online resources are available to help you learn about current hardware
    compatibility and other hardware issues. You can find the Red Hat-specific site
    at http://www.redhat.com/support/docs/hardware.html. The Linux Documentation Project,
    a general Linux hardware compatibility resource, is located at http://www.metalab.unc.edu/LDP/HOWTO/Hardware-HOWTO.html.


