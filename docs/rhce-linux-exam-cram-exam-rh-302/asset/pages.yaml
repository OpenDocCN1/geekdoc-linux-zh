  md: '# Troubleshooting Your Installation


    After viewing the dmeslog, you may notice specific pieces of hardware may not
    be loading properly. If you think a piece of hardware has a compatibility issue—or
    perhaps the driver for your hardware was not available during installation—check
    out the "Hardware Compatibility HOWTO" on the Linux Documentation Project at http://metalab.unc.edu/LDP/HOWTO/Hardware-HOWTO.html.


    Another troubleshooting source is Red Hat, which offers a hardware guide for the
    Red Hat-specific distribution. Red Hat also offers version-specific lists for
    older versions of Red Hat. These lists can be found at http://www.redhat.com/support/docs/redhat.html.
    Although both the Red Hat and the Linux Documentation Project list much of the
    same information, the Red Hat list is most often more accurate and current because
    Red Hat follows the support for each individual version.


    One of the most common installation problems outside of hardware relates to LILO.
    Occasionally, a disk sector is bad and LILO doesn''t install it properly. Other
    times, it doesn''t work because it was misconfigured. One of the best ways to
    troubleshoot your LILO problems is to watch the output of LILO itself.


    > Watch for your LILO prompt. If you don''t get any part of the LILO prompt, LILO
    didn''t load. If you get an L, the first-stage boot loader is loaded and started.
    If you get an Li, the second-stage boot loader is started. If you get an LIL?,
    the second-stage boot loader was loaded at an incorrect address. If you get an
    LIL-, the descriptor table is corrupt. If you get LILO, all of LILO has been loaded
    correctly.'
  merge: -1
