  md: '# Basic Configuration And Administration 121


    Unlike some the other configuration tools, the sndconfig tool adds entries into
    your /etc/conf.modules file. The sndconfig tool also sets the driver, IRQ and
    IO settings—as well as any aliases that may be needed—in this file.


    # Filesystem And Mount Configuration


    In order to read, write, or otherwise additional filesystems and devices, you
    must be able to mount them. To do so, use the mount command. Along with the mount
    command, you must supply information such as the device, the filesystem type,
    and the mount point. Several types of filesystem types are available:


    +   - vfat Used to mount Windows partitions and filesystems


    +   - msdos Used to mount MS-DOS filesystems and devices


    +   - ext2 Used for Linux filesystems


    +   - iso9660 Used for CD-ROM devices


    The syntax -t type /dev/device /mnt/mountpoint using the mount command for a device
    is:


    Replace type for the filesystem type, device for the device or partition to be
    mounted, mountpoint for the mount directory you want to use. For example, to mount
    an iso9660 filesystem of a CD-ROM to /mnt/cdrom, first make sure the /mnt/cdrom
    mount point is created and then issue this command:


    mount -t iso9660 /dev/cdrom /mnt/cdrom


    Many times, you can eliminate the filesystem type and mount point, allowing for
    easier mount procedures. For instance, rather than issuing the command, you could
    simply enter "mount /dev/cdrom". You can do this because of the entries in the
    /etc/fstab file, discussed in Chapter 3. Entries in the /etc/fstab file set up
    defaults for mount options. Each entry sets defaults such as the mount point,
    the type of filesystem, how it should be mounted, if it is to be dumped, and in
    what order it should be mounted. Here is an example of an /etc/fstab file:


    | /dev/hda3 / ext2 defaults 1 1 |

    | /dev/hdl /boot ext2 defaults 1 2 |

    | /dev/hda4 swap swap defaults 0 0 |

    | /dev/fd0 /mnt/floppy ext2 noauto 0 0 |

    | /dev/cdrom /mnt/cdrom iso9660 noauto,ro,user 0 0 |'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# 122 Chapter 6


    The first entry specifies that /dev/hda3 should be mounted to / (root) as an ext2
    filesystem with default mount options. It should be dumped and mounted first.
    The second line specifies that /dev/hda1 be mounted as /boot as an ext2 filesystem.
    It should be mounted with the default mount options, should be dumped, and should
    be mounted second. The third line specifies that /dev/hda4 be mounted as swap
    as a swap filesystem with default mount options, but not be dumped or mounted
    in any order. The fourth line specifies that /dev/fd0 be mounted as /mnt/floppy
    with an ext2 filesystem with no automatic mount options, and so on.


    When reading the /etc/fstab file, make note of the different device naming conventions.
    For instance, /dev/hda1 is the first master drive. The h h specifies that it''s
    an IDE drive, and the 1 specifies it is the first partition on the drive. However,
    /dev/sdb3 indicates that it''s the second (slave) SCSI drive. The 3 indicates
    it is the third partition on drive.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_153_0.png)


    Adding entries to /etc/fstab (or changing them if necessary) doesn''t require
    you to restart any services to make the changes into effect. After changing the
    /etc/fstab file, you can mount the devices in several manners, for example:


    mount /mnt/mountpoint


    or


    mount /dev/device


    The unspecified information, such as type, mountpoint, or device (as needed) are
    automatically assigned. You can use this convention unless you decide to read
