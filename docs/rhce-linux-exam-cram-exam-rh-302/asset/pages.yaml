  md: '# 226 Chapter 10


    The settings set how many spare httpd servers are running at any given moment.
    These spare servers are used to handle sudden rushes of requests, or other spikes
    of traffic. The MinSpareServers sets the minimum number of spares to have at any
    given moment. The MaxSpareServers sets the maximum number of spares to have at
    any given moment. The following-options also regulate the number of httpd servers
    running:


    StartServers 10


    ```

    # Limit on total number of servers running, i.e., limit on the

    # number of clients who can simultaneously connect -- if this limit

    # is ever reached, clients will be LOCKED OUT, so it should NOT BE

    # SET TOO LOW. It is intended mainly as a brake to keep a runaway

    # server from taking Unix with it as it spirals down...

    ```


    The StartClients option sets how many servers to start Apache with. The MaxClients
    option is a little more important, as it sets the maximum of running servers.
    This limits the number of clients who can simultaneously connect to your server.
    Therefore, you should not set this option too low, but keep the number reasonable
    enough to keep your Web server from crashing. Within the following eight lines,
    you can set up the virtual hosts on your Apache server:


    ```

    NameVirtualHost 127.0.0.1

    <VirtualHost web.test.com>

    ServerAdmin webmaster@test.com

    DocumentRoot /home/httpd/html/virtual/www.test.com

    ServerName www.test.com

    ErrorLog logs/www.test.com-error_log

    TransferLog logs/www.test.com-access_log

    </VirtualHost>

    ```


    > This section is the most important section concerning up domains and Web sites
    on your Apache server!


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_257_0.png)


    We will discuss the use of virtual hosts more thoroughly in the next section of
    this chapter, titled "Virtual Hosts." The first line in the code specifies the
    use of NameVirtualHost. This setting is usually either the main name of the machine,
    or the IP address that the Apache server is listening on. The NameVirtualHost
    is only required for entries on a machine that is using a single IP address for
    multiple domains.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Standard Networking Services 222


    The second line is the ServerAdmin entry. The ServerAdmin setting specifies the
    email address for http if there are any http errors with the specific domain or
    IP. This is often set to root@localhost, and the mail is sent directly to the
    root account on the Web server. If you don''t check root''s email, however, you
    should set this to an appropriate account you read.


    The third line is <VirtualHost xxx.xx.xxx>. The VirtualHost entry. The setting
    for this option (which replaces the xxx.xx.xxx in the preceding line) is typically
    either the full domain name for the site (www.domain.com) or the domain''s IP
    address (192.168.0.1). The end of this VirtualHost entry is specified in the last
    line by </VirtualHost>.


    The fifth line specifies the DocumentRoot entry. The Document Root is the location
    of the files on the Apache server for the particular entry''s Web pages and data.
    Many administrators use a single main directory for all Web pages, such as /home/html/,
    and create a directory under the /home/html/ for each domain. In this case, the
    DocumentRoot would be set to /home/html/domain. Other administrators link the
    DocumentRoot into a user''s home directory, and create a directory under the user''s
    home directory to contain the documents. In this case, DocumentRoot would be set
    to /home/user/domain or something similar, where user is the username, and domain
    is the directory containing HTML and Web data.


    The fifth line specifies the ServerName entry. The ServerName is the full domain
    name of the particular Web site. This entry should always be set to the full name,
    such as www.test.com, web.test.com, another.test.com, or whatever the user enters
    in his browser to retrieve this.


    The sixth line specifies the location for the ErrorLog. The ErrorLog is the log
    where http stores error messages received for that address. Many administrators
    place all their logs under a main "logs" directory. Therefore, an appropriate
    setting for ErrorLog would be ErrorLog logs/www.test.com/error_log.


    Entries and settings in any of the /etc/httpd/conf/ files used Linux rules for
    paths. For instance, logs/www.test.com/error_log would assume the full path /home/httpd/conf/logs/www.test.com/error_log
    would assume the simple path /logs/www.test.com/error_log. Notice the difference
    in the first character (/) pointing to an absolute path, and the absence of the
    character (/) pointing to a path relative to ServerRoot.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_258_0.png)'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'The seventh line specifies the location for the TransferLog. The TransferLog
    is the log where http stores all the access information for the particular Web
    site. If the administrator is keeping all the logs underneath a default "logs"
    directory as mentioned previously, a valid setting for this would be TransferLog
    logs/www.test.com/access_log.


    # srm.conf


    The srm.conf file defines the name space users see for the httpd services. The
    file also specifies other server defined file and mime types. The srm.conf file
    is quite lengthy. The following code lines are excerpts from the srm.conf file
    that are necessary for setting up Apache properly and passing the RHCE 3000 exam.
    This entry in srm.conf specifies the DocumentRoot for the system:


    ```

    DocumentRoot /home/httpd/html

    ```


    This setting is the directory you will use to serve your Web documents. By default,
    all requests are taken from the /home/httpd/html/ directory, symbolic links and
    aliases may be used to point to other locations. This entry from the srm.conf
    file specifies the UserDir:


    ```

    UserDir public_html

    ```


    The DirectoryIndex is used when the system receives a request for a ~user, where
    user is a user on the Web server. The request is then routed to look in the public_html
    directory within the user''s home directory (by default). This entry from the
    srm.conf file specifies the DirectoryIndex:


    ```

    DirectoryIndex index.html index.shtml index.cgi

    ```


    The DirectoryIndex is the default file that is automatically assumed to be loaded
    first within the Web directory. This means that if you go to www.test.com, httpd
    will look in the Document Root directory and automatically load the file named
    index.html, index.shtml, or index.cgi (whichever is present), specified by the
    DirectoryIndex listing. index.html, and are the default options. If you want to
    change this, or add files as home.html, you would change this entry.


    > Note: After configuring Apache, or making changes, such as adding virtual hosts,
    you must restart httpd before your changes go into effect. To restart httpd, use
    the restart option by running /etc/rc.d/init.d/httpd restart.'
