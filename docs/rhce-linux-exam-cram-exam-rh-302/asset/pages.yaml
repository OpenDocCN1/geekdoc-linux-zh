  md: '# Setting File Permissions Properly And Using umask


    Every file, program, and directory is set up with file permissions. Performing
    an ls -l in the directory prints the list of files including details, as shown
    here:


    ```

    -rw-r--r-- 1 kara  kara       7688 Jan 13 14:32 pick

    drwx-xr-x 9 kara  kara       1024 Mar 27 12:15 public_html

    -rw-r--r-- 1 root  root       434898 May 7 1998 termcap

    -rw-r--r-- 1 root  root       3313 Apr 30 1998 wegtrc

    ```


    The first group of characters represents the permissions for the file. permissions
    (when you are using ls -l) by a string of 10 characters, drwxrwxrwx and combinations
    thereof. When a particular character is replaced by a -, the permission assigned
    to that character is not granted. These characters are split into four groups.
    The first character is represented by a “d”, which stands for a directory. The
    remaining nine characters is a filename. Therefore drwx-xr-x indicates a directory,
    whereas -rw-rw-rw- implies split into three groups, rwx rwx rwx. The first group
    pertains to the owner, the second to the group, and the third to everybody else.
    The “r” in each case stands for readable, the “w” for writable, and the “x” for
    executable. Table 4.6 shows example of permission settings.


    When you are assigning or referring to permissions of a file, the r, w, and x
    characters are assigned numeric values 4, 2, and 1 respectively. You then add
    these values to get the permission values (for example, rwx = r+w+x=4+2+1=7; r-x=r+0+x=4+0+1=5).
    Table 4.7 shows permission strings and their numerical values.


    Therefore, a file with -rw-r--r-- has details set to ‘644’. By default, all files
    are created with file permissions of 666. These permissions are adjusted per user
    by their default umask. A umask sets the permissions by subtracting the user’s
    umask from the default 666. For example, if a umask


    | Table 4.6 Permissions. |

    | Permission String | Explanation |

    | --- | --- |

    | -rw------ | Readable, writable, and executable by the owner only |

    | -rwx-xr-- | Readable, writable, and executable by the owner; readable and executable
    by the group |

    | -rwx-xr-x | Readable, writable, and executable by the owner; readable and executable
    by the group; executable by the public |'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# 74 Chapter 4


    | Table 4.7 Permission values. |

    | Permission String | Numerical Permission Value |

    | --- | --- |

    | -rwx------ | 7-0-0 |

    | -rwxr-x-- | 7-5-0 |

    | -rwxr-X--X | 7-5-1 |


    set to 022, the files created within that shell and its subprocesses are set to
    644 (666-022).


    To set the umask within a shell, use the umask command. Here''s an example:


    ```

    #umask 022

    ```


    Files that need to have their permissions changed—such as to be executable or
    to limit access to the owner and the group—use only the chmod command. Here''s
    an example:


    ```

    #chmod 777 filename

    ```


    This code sets the file name to have 777 permissions (-rwrwxrwx), and the world
    can read, write, and execute them. However,


    ```

    #chmod 770 filename

    ```


    causes the owner and group—but not anyone else—to be able to read, write, and
    execute the file name.


    By default, when a user is created, she is given her own user ID and group. To
    add users to other groups, edit the /etc/group file. The following is an excerpt
    from an /etc/group file:


    ```

    luci::402:steve,kara,jburke

    egypt::499:alan,barb

    steve:x:500:

    ```


    Files that have specified access to the group named luci gives steve, kara, and
    jburke access. On the other hand, alan and barb do not have access because they
    are assigned to the egypt group, not luci and vice versa. To set a specific group
    to use a file, use the chgrp command. For instance


    ```

    #chgrp luci index.html

    ```'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Red Hat Advanced Prerequisites


    sets the group ownership of index.html to the luci group. The index.html file
    has 664 permissions, is owned by steve, and the luci group is assigned. Therefore,
    steve and users in the luci group (steve, kara, and jburke) can read and write
    to that file, whereas everybody else only read the file. The following shows changing
    the group ownership of the index.html file to luci and is verified with ls -l
    command:


    ```

    #chgrp luci index.html

    #ls -l index.html

    -rw-rw-r-- 1 steve luci 3709 Mar 22 17:57 index.html

    ```


    # Using Shadow Passwords


    You can convert a system to shadow passwords by running the pwconv program. If
    necessary, you can later convert it back by using pwunconv. The change should
    be transparent to all programs that use Pluggable Authentication Modules (PAM).
    You can control password aging with the chage program.'
