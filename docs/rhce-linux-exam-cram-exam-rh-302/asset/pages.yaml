    # /etc/hosts.deny


    If a service or user is not specified to have direct access in the /etc/hosts.allow

    file, tcp_wrappers will then check to see if the service or user is denied in
    the

    /etc/hosts.deny file. The format for the entries in /etc/hosts.deny is identical
    to

    the found in /etc/hosts.allow. To reference online syntax for /etc/

    hosts.deny, refer to the previous section "/etc/hosts.allow"


    Any entry in /etc/hosts.deny can be overwritten in the /etc/hosts.allow file.

    Therefore, if an entry is granted to ALL:ALL in /etc/hosts.allow, then an entry

    in.ftpd:.redhat.com in /etc/hosts.deny will be ignored. However, if an en-

    try in /etc/hosts.allow, as in:ftpd: 192.168.0.0/192.168.255.255,

    and an entry exists in /etc/hosts.deny, such as ALL:ALL, the only service that

    can be accessed on your system is ftpd. The service can only be accessed by

    users on IPs ranging from 192.168.0.0 through 192.168.255.255. All other

    service requests or requests from any other IP will be rejected by the /etc/

    hosts.deny entry.


