- img_proc: true
  md: 'The label setting is the name associated with the kernel image you are prompted
    to choose from in LILO: prompt. For instance, on this system, hitting the Tab
    key at the LILO: prompt reads 2.2.10, linux, and dos, which are the labels set
    within the /etc/lilo.conf file.


    The third section following the image sections mimics the Linux image= lines,
    but it has different boot images and label names. This section is labeled as other
    entry. The other tells LILO that there is a bootable system on another partition—for
    example, the entry=/dev/hda tells LILO that a bootable system resides on the second
    partition of the first hard-drive(hda2). The remaining options under the other=
    specify options used to boot the system. In this case, the other= entry specify
    booting the DOS partition, which happens to be Windows 98.


    After making any changes to the /etc/lilo.conf file, always be sure to rerun LILO
    to activate your changes. To do this, simply type "lilo" at the root prompt.


