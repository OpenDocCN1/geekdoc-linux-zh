  md: '# Infrared Support


    Another short category enables the new option of support for infrared devices.
    The main question in this category is to enable IrDA subsystems support. Enabling
    this option allows you to configure support for communication over certain infrared
    interfaces. This category includes an option to do networking between infrared
    interfaces.


    # ISDN Support


    You can select support for ISDN with the ISDN Support option. Enabling ISDN support
    allows you to configure kernel support for ISDN adapter cards as well as networking
    over ISDN.


    # Old CD-ROM Driver Support


    Some systems use CD-ROM drives other than SCSI or IDE CD-ROM drives. Enabling
    this option allows you to configure support for CD-ROM drives that use old proprietary
    interfaces, as those commonly found on older sound cards. Typically, you do not
    need to enable this support.


    # Character Devices


    Within the character devices category, there are approximately 12 configuration
    options available. One of the first options is to enable support for virtual terminal
    devices. This is the standard way of supporting the system keyboard/mouse/monitor
    combination of a system in Linux. You should consider this a required option on
    all systems other than embedded devices. Another option allows the system console
    to be set to a virtual terminal. The system console is where kernel messages go
    and where logins are allowed in single-user mode. You should turn this on except
    if you are sure you always use another device, such as a serial port, for the
    system console.


    Another character device option in this category is to enable support for standard
    generic serial devices. Turning this option allows you to set a serial port as
    the system console. To enable console support for the console on the serial port.
    Some additional serial support options include extended serial driver and non-standard
    serial port support. Enabling the extended serial driver options allows you to
    turn on options for the standard serial driver, such as support for IRQ sharing.
    Enabling the non-standard serial port support option allows you to configure support
    for various intelligent serial boards.


    The next option in this category is to enable support for Unix98 PTY. Turning
    this option includes kernel support for the /dev/pts/number naming scheme for
    pseudo terminal devices mandated by the UNIX98 specification. This system'
  merge: -1
  pgno: 212
