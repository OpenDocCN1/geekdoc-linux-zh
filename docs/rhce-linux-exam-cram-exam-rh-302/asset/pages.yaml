    # Kernel Hacking


    A final category for configuring your kernel is Kernel Hacking. This category
    has only one option, which you use to configure support for the SysRq key. This
    option turns on for various "magic" key sequences using Alt+SysRq (also Print
    Screen) on the standard PC keyboard. These sequences sync with all mounted filesystems,
    kill all processes on the virtual console, reboot the system, and so on. This
    option can be very convenient, but you should not turn it on for systems where
    access to the system''s console could be a security risk.


    # Compiling And Installing A Custom Kernel


    When compiling and installing a kernel, you use various options. There are as
    many as 11 options that you can use when compiling and installing your kernel
    from start to finish; we will describe them in this section. Follow these steps
    to compile and install a new kernel:


    +   1. You must first configure your kernel as discussed in the "Kernel Configuration
    Options" section earlier in this chapter. There are several options available
    to configure your kernel. First, to compile your kernel, you must be in the /usr/src/linux
    directory. Next, if you plan to configure your kernel by scratch, first use make
    proper. Doing so removes your config file and allows you to set up all new options
    for your kernel without knowing your current default configuration. If you wish
    to use your current default options, skip the make proper step. To finish configuring
    your kernel, use your choice of make config, make menuconfig, or make xconfig,
    as discussed earlier in this chapter.


    +   2. Next, you must do some general kernel housekeeping. This means that you
    need to clean up any unneeded or temporary files from the kernel source tree.
    To clean the source tree, run make clean.


    +   3. Next, you must ensure that all dependencies are available and correctly
    placed. The two dependencies in particular are the kernel header files /'
