  md: '# Self-Assessment


    The reason we included a self-assessment in this Exam Cram book is to help you
    evaluate your readiness to tackle RHCE certification. It should also help you
    understand what you need to master the topic of this book—namely, RHCE 300. But
    before you tackle this self-assessment, let''s talk about concerns you may face
    when pursuing an RHCE, and what an ideal RHCE candidate might look like.


    # RHCEs In The Real World


    In the next section, we describe an ideal RHCE candidate, knowing full well that
    only a few real candidates will meet this ideal. In fact, our description of that
    ideal candidate might seem downright scary. But take heart: the requirements to
    obtain an RHCE may seem pretty formidable, are by no means impossible to meet.
    However, you should be keenly aware that it takes time, requires some expense,
    and consumes substantial effort to get through the process.


    Just introduced in the Spring of 1999, the RHCE program is very young. Demand
    for this and the limited seating for the testing makes the RHCE even more valuable.
    However, if you''re willing to tackle the process seriously and do what it takes
    to obtain the necessary experience and knowledge, you can take—and pass—all the
    certification tests involved in obtaining an RHCE. In fact, we''ve designed these
    Exam Crams to make it as easy as possible to prepare for these exams. Prepare
    when you must!


    # The Ideal RHCE Candidate


    Just to give you some idea of what an ideal RHCE candidate is, here are some relevant
    statistics about the background and experience what an individual might have.
    Don''t worry if you don''t meet these qualifications—this is a far from ideal
    world, and where you fall short is simply you''ll have more work to do:


    +   * Academic or professional training in network theory, concepts, and operations.
    This includes everything from networking hardware and software through the Linux
    operating system, services, and applications.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   - Two-plus years of professional networking experience, including experience
    with Ethernet, and other networking media. This must include installation, configuration,
    upgrade, and troubleshooting experience.


    +   - Two-plus years in a networked environment that includes hands-on experience
    with Red Hat Linux, or other Linux distributions such as Caldera, Debian, or SuSE.
    A solid understanding of each system''s architecture, installation, configuration,
    maintenance, and troubleshooting is also essential.


    +   - Familiarity with key-based TCP/IP-based services, including HTTP (Web servers),
    DHCP, DNS, plus familiarity with one or more of the following: FTP, Samba, Squid,
    NFS, or ipchains.


    # Put Yourself Self To The Test


    The following series of questions and observations is designed to help you figure
    out how much work you must do to pursue Red Hat certification and what kinds of
    resources you may consult on your quest. Be absolutely honest in your answers,
    or you will end up wasting money on exams you are not ready to take. There are
    no right or wrong answers, only steps along the path to certification. You can
    only decide where you really belong in the broad spectrum of aspiring candidates.


    Two things should be clear from the outset, however:


    +   - Even a modest background in computer science will be helpful.


    +   - Hands-on experience with Linux, Linux products and technologies is an essential
    ingredient to certification success.


    # Educational Background


    +   1. Have you taken any computer-related classes? [Yes or No]


    If Yes, proceed to question 2; if No, proceed to question 4.


    +   2. Have you taken any classes on Unix operating systems? [Yes or No]

    If Yes, you will probably be able to handle Red Hat''s architecture and system
    component discussions. If you''re rusty, brush up on basic Unix concepts, especially
    virtual memory, multitasking regimes, user mode versus superuser mode operation,
    filesystems, and general computer security topics.

    If No, consider some basic reading in this area. I strongly recommend a good general
    operating systems book, such as Essential System'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Administration, by Ælen Frisch (O''Reilly & Associates, 1995, ISBN 1-56592-127-5).
    If this title doesn''t appeal to you, check out reviews for other, similar titles
    at your favorite online bookstore.


    +   3. Have you taken any TCP/IP based networking concepts or technologies classes?
    [Yes or No]


    If Yes, you will probably be able to handle Red Hat Linux''s networking terminology,
    concepts, and technologies (brace yourself for frequent departures from normal
    use). If you''re rusty, brush up on basic-working concepts and terminology, especially
    networking media, transmission types, the OSI Reference model, and networking
    technologies such as Ethernet, and WAN links.


    If No, you might want to read one or two books in this topic. The two best books
    that we know of Computer Networks, 3rd Edition, by Andrew S. Tanenbaum (Prentice-Hall,
    1996, ISBN 0-13-39945-6) and Computer Networks and Internets, by Douglas E. Comer
    (Prentice-Hall, 1997, ISBN 0-13-239070-1).


    Skip to the next section, “Hands-On Experience.”


    +   4. Have you done any reading on the Linux operating system or networks? [Yes
    or No]


    If Yes, review the requirements stated in the first paragraphs after questions
    2 and 3. If you meet these requirements, move on to the next section. If No, consult
    the recommended reading for both topics. A strong background will help you prepare
    for the Red Hat exams better than just about anything else.


    # Hands-On Experience


    The most important key to success on all types of certification exams is hands-on
    experience. If I leave you with only one realization after taking this self-assessment,
    it should be that there''s no substitute for time spent installing, configuring,
    and using Red Hat Linux and its components upon which you''ll be tested repeatedly
    and in depth.


    +   5. Have you installed, configured, and worked with:


    +   - Linux? [Yes or No]


    +   - Red Hat Linux? [Yes or No]


    If Yes, make sure you understand the methods used in Red Hat Linux 6.0, the differences
    between Red Hat Linux 6.0 and other'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Red Hat Linux versions, as well as the differences between Red Hat Linux 6.0
    and other vendor distributions (such as Caldera, SuSE, and Debian).


    If No, you will want to obtain a copy of Red Hat Linux 6.0 and learn how to install,
    configure, and maintain it. You can use this book to guide your activities and
    studies.


    +   6. For any specific Linux product that is not itself an operating system (for
    example, the X Window system or Apache), have you installed, configured, used,
    and upgraded this software? [Yes or No]


    If the answer is Yes, skip to the next section. If it''s No, you must get some
    experience. Read on for suggestions on how to do this.


    Experience is a must with the RHCE 300 exam, be it something as simple as pine
    or as challenging as NFS or Apache.


    If you have the funds, your employer will pay your way, considering a class from
    Red Hat Software, Inc. or at an Authorized Training Partner. In addition to classroom
    exposure to the topic of your choice, you get a copy of the Red Hat Linux version
    that is the focus of your course, along with the training materials for that class.


    Before you even think about taking any exam, make sure youve spent enough time
    with the related software to understand how it may be installed and configured,
    how to maintain such an installation, and how to troubleshoot that software when
    things go wrong. This will help you in the exam, as well as in real life!


    # Testing Your Exam-Readiness


    Whether you attend a formal class on a specific topic to get ready for an exam
    or use written materials to study on your own, some preparation for the Red Hat
    Certified Engineer exam is essential. At $749 a try, pass or fail, you want to
    do everything you can to pass the exam on your first try. That''s where the importance
    of studying comes in.


    We have included practice objectives, goals and exams in this book, so if you
    don''t score well on the first test, you can study more and then tackle the second
    test. If you still don''t hit a score of at least 85 percent after the second
    test, you''ll want to investigate the other practice test resources we mention
    in this section.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'For any given subject, consider taking a class if you''ve tackled self-study
    materials, taken the test, and failed anyway. The opportunity to interact with
    an instructor and fellow students can make all the difference in the world, if
    you can afford that privilege. For information about Red Hat classes, visit the
    Training- and Certification page at http://www.redhat.com/products/training.html.


    # # Onward, Through The Fog!


    Once you''ve assessed your readiness, undertaken the right background studies,
    obtained the hands-on experience that will help you understand the products and
    technologies at work, and reviewed the many sources of information to help you
    prepare for a test, you''ll be ready to take a round of practice tests. When your
    scores come back positive enough to get you through the exam, you''re ready to
    go after the real thing. If you follow our assessment regime, you''ll not only
    know what you need to study, but when you''re ready to make a test date. Good
    luck!'
  merge: -1
