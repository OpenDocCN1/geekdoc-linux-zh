    Nearly three years after Torvalds started this project, Linux 1 was released.
    By this time, several Linux distributions had begun packaging the Linux kernel
    with basic support programs, the GNU utilities and compilers, the X Windowing
    system, and other useful programs. The numbers of Linux kernel hackers had managed
    to develop all the things expected from a current Unix system, including preemptive
    multitasking, virtual memory, shared libraries, TCP/IP support, NFS, Ethernet,
    and so on.


    In 1995, the Linux 1.2 kernel was released. The PCI bus, kernel-level firewalling,
    now-TCP/IP networking protocols, and so on. By this time, Linux had become stable
    as any commercial


