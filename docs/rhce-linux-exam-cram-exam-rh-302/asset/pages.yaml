- img_proc: true
  md: 'To install an RPM file, use the command line option -i (for install). For example,
    to install an RPM file for sendmail (such as sendmail-8.9.1-2.i386.rpm), enter


    ```

    rpm -i sendmail-8.9.1-2.i386.rpm

    ```


    To uninstall a package, use the command option -e (for erase). To uninstall the
    sendmail-8.9.1-2.i386.rpm sendmail package, enter


    ```

    rpm -e sendmail-8.9.1-2.i386.rpm

    ```


    Another task that you can perform with RPM is to upgrade individual components
    or packages on your system without having to completely reinstall them. Unlike
    tar files or gzip packages, the configuration files of RPM packages are preserved
    when you upgrade. Therefore, you won''t lose your configuration. To upgrade a
    package, simply use the -U option (for upgrade). To upgrade to the sendmail-8.9.1-2.i386.rpm
    sendmail package, enter


    ```

    rpm -U sendmail-8.9.1-2.i386.rpm

    ```


    When you are installing or upgrading a package, it is helpful to use the -v and
    -h options. The -v option (for verbose) prints out the name of the file within
    the package it is installing. The -h option (for hash mark, #) prints hash marks
    to show how far the installation has progressed. An example of using both options
    is:


    ```

    rpm -ivh sendmail-8.9.1-2.i386.rpm

    ```


    Another helpful RPM install option is -F (for freshen). Freshen allows you to
    automatically compare a list of rpm files against the rpm already installed on
    your system. If an rpm within the list of rpm is newer than the one on your system,
    it is automatically upgraded. If an rpm within the list is not newer than the
    one on your system (or it is not installed on your system), it is ignored. To
    use the -F option, simply run


    ```

    rpm -F *.rpm

    ```


    from the directory that contains the list of rpm files you want to compare. Note
    that *.rpm refers to every rpm file in that directory. You can also use wildcards,
    filenames, or combinations thereof for whatever result you are looking for.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_155_0.png)'
