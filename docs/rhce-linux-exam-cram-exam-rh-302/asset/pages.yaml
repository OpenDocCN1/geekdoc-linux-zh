  md: '# Dynamic Host Configuration Protocol (DHCP)


    DHCP is a superset of bootp, which is used to assign IP addresses to clients on
    a network. DHCP is used for dynamic hosts that can move, connect and disconnect
    from networks. DHCP can dynamically assign IP addresses from pre-assigned IP address
    in /etc/dhcpd.leases and set up static IP addresses based on the NIC MAC (Media
    Access Controller) address. DHCP can even restrict access by accepting requests
    only from specified MAC addresses.


    # Setting Up DHCP Server


    To set up a DHCP server, make sure that you have installed the DHCP RPM. The DHCP
    RPM packaged with Red Hat Linux 6.0 is dhcp-2.0b1pl6-6i386.rpm. To finish setting
    your DHCP server, follow these steps:


    +   1. Check to see that you have MULTICAST support in your kernel. To do this,
    run ifconfig -a. If you already have MULTICAST support, you will have a line that
    says UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1 in the eth0 section of the
    ifconfig output. If MULTICAST is not in your configuration, you must either reconfigure
    your kernel to support MULTICAST, replace your NIC (if not supported), or change
    your interface settings.

    2. Add a route for 255.255.255.255 (required by Microsoft Clients). To do this,
    type route add -host 255.255.255.255 dev eth0 (where eth0 is the device of your
    ethernet card).


    > Note: If you get an "unknown host" error when adding this route, add the following
    entry to /etc/hosts: 255.255.255.255 all-ones.


    +   3. Start the DHCP server. To start the server, type /etc/rc.d/init.d/dhcpd
    start.

    4. Verify that DHCP is working properly. Type /usr/sbin/dhcpd -d -f.

    5. Configure your /etc/dhcpd.conf file (an example for setting random IPs for
    clients follows).


    # Configuring dhcp for Random IP Assignment


    To set up DHCP to assign random IPs to DHCP clients on the network, you will need
    to configure the /etc/dhcpd.conf file, which is the main configuration file for
    DHCP. The following list contains sample settings for'
