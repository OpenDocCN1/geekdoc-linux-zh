    # Intel Architectures


    Intel and known compatibles (also known as IBM compatibles) are based on Complex
    Instruction Set Computing central processing units (CPUs). CPUs process low-level
    commands called instruction sets. The time required to carry out these instruction
    sets is based on the CPU''s speed and architecture. When compared to RISC CPUs,
    CISC CPUs have more complex instruction sets and fewer registers with to execute
    them, making them less efficient. Some RISC processors are used in the popular
    (formerly Compaq''s DEC) Alpha, Hewlett-Packard''s PA-RISC, Sun''s SPARC, SGI''s
    MIPS, and IBM''s PowerPC. Over the years, Intel CPUs have become the industry
    standard for computing hardware. Many once-proprietary hardware vendors are adapting
    the Intel architecture in their systems, allowing for greater compatibility and
    affordability.


    The base of the Intel personal computer (PC) is the motherboard. Motherboards
    typically have sockets and slots inserted directly on the CPU, the random access
    memory (RAM), and the Peripheral Component Interconnect (PCI) and Industry Standard
    Architecture (ISA) buses. Unlike other boards, the serial (communication) and
    parallel ports, along with the Integrated Drive Electronics (IDE) and floppy controllers,
    are all integrated on'
