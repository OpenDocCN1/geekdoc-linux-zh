  md: '# File Transfer Protocol (FTP)


    FTP is the file transfer protocol used to connect two machines (a server and a
    client) to transfer files from one to the other. Typically, FTP works by a client
    connecting to a server (via an FTP client) and then either uploads files to the
    server or downloads files from the server to the client.


    Two general types of FTP servers are user access and anonymous access. User access
    FTP servers require that the client accessing the FTP server have a valid user
    account (username and password) on the system. Anonymous access FTP servers simply
    allow any client to connect without needing a specific username and password to
    access the system. In this section, we will discuss how to set up the default
    Red Linux FTP server (wu-fptpd) and how to set up the anonymous FTP.


    # Setting Up wu-fptpd


    The default Red Linux 6.0 FTP server is wu-fptpd. By default you can install the
    wu-fptpd package during the Red Linux 6.0 installation. If you did not install
    wu-fptpd during your Red Hat Linux installation, you can install from the Red
    Hat CD 6.0 with the RPM wu-fptpd-2.4.2vr17-3.i386.rpm.


    After the installation of wu-fptpd is finished, there is nothing to configure.
    With the default wu-fptpd installation, any user can then ftp with his username
    and password authentication, gain FTP access to his home directory (unless otherwise
    specified). There are three configuration files that are set up by wu-fptpd. The
    three files are /etc/ftaccess, /etc/fthosts, and /etc/ftpusers.


    # The /etc/ftaccess File


    The /etc/ftaccess is the main ftp configuration file. There are a number of options
    you can configure and customize in the /etc/ftaccess file. You can specify the
    number of attempts to successfully log in to the FTP server with the loginfails
    option. (The default is logins=5, allows five attempts before the FTP server refuses
    connection.) You can also allow or deny specific tool access (such as compress,
    tar, and chmod) to specific types of connections (such as all, guest, and anonymous).
    For more information about /etc/ftaccess options, read the ftaccess page (man
    5 ftaccess).


    # The /etc/fthosts File


    The /etc/fthosts file is used to allow or deny access to specific accounts from
    specified hosts. There are two types of entries in the /etc/fthosts file. The
    first is allow, and the second is deny. The syntax is allow username host or deny'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Standard Networking Services 245


    username host. For example, allow kara 192.168.0.* would only allow the user

    “kara” to log in from 192.168.0.* hosts. The entry deny anonymous 192.168.1.*\nwould
    deny any anonymous user connections from any 192.168.1.* host.

    for more information about setting the /etc/fpthosts file, read the fpthosts man

    page (man 5 fpthosts).


    # The /etc/fpusers File


    The /etc/fpusers file is used to specify exactly what system user accounts can

    not log in to the server via ftp. By default, system users such as root, bin,
    deamon,

    adm, lp, sync, shutdown, halt, mail, news, uucp, operator, games, and nobody

    are automatically added to this list. If you create any users to whom you wish
    to

    deny FTP access, add them to the /etc/fpusers file as well.


    # Setting Up Anonymous FTP


    An anonymous FTP server does not require a specific user ID or password to

    access the server. This means the FTP server can be reached with anonymous

    FTP clients (such as Netscape) and by simply passing the generic usernames

    (such as “anonymous” and “ftp”) along with the email address as the password.


    To configure your FTP server as an anonymous FTP server, you can install the

    anftp RPM, and the wa-ftpd server will be configured automatically.

    The RPM, can be found on your Red Hat Linux 6.0 CD as /RedHat/RPMS/

    anftpd-2.8.1.i386.rpm.


    # Network File System (NFS)


    NFS is the Network File System, the standard method for sharing files between

    Unix (and Unix-like) systems. Linux can be an NFS server to other Linux (or

    Unix) systems, as as an NFS client to other Linux (or Unix).


    # The NFS Server


    The NFS server can be installed by default during the Red Hat Linux 6.0

    installation. If NFS was not installed during your Red Hat installation,

    y can use the RPM on the Red Hat knfsd installation CD. The NFS RPM can be

    found at /RedHat/RPMS/knfsd-1.2.2-4.i386.rpm.


    Red Hat 6.0 uses the new kernel nfs feature of the 2.2 Linux kernels. There-

    fore, in order to use the NFS server, the kernel must be configured with the

    appropriate kernel support. The nfsd requires the nfsd.o module (which then requires
    the lockd.o and sunrpc.o

    modules). In addition, the NFS server requires the following specific user-

    space daemons and utilities.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Chapter 10


    +   Portmap The NFS server system must be running the portmap daemon. It is included
    in the portmap package portmap-4.0-15.i386.rpm.


    +   RPC RPC daemons from the knfsd package must be running. These include rpc.statd,
    rpc.rpcad, rpc.mountd, and rpc.nfsd. (These may be started by running /etc/rc.d/init/nfs
    start).


    > Note: If for some reason the nfs.d module is not available, rpc.nfsd will continue
    to run with the same behavior as the old user-space unfsd. Normally, it will pass
    control to the kernel nfsd and exit.


    # Configuring NFS Server Exports


    The knfsd server uses /etc/exports to configure exported NFS filesystems. The
    format of the file entries is


    ```

    /path/to/export host(options)

    ```


    The first field (/path/to/export) is the path that you want to make available
    via NFS. An example would be /mnt/cdrom. The second field (host) is the hostname
    (IP address or address/netmask) to which you want the filesystem to be made available.
    If nothing is supplied for host, the filesystem is exported to the world. The
    last field (options) is a comma-separated list of export options. Some examples
    are ro for read-only, r for read and, write. An example of the options field could
    be (ro) specifying that the exported filesystem is read-only or (rw) to specify
    that the exported filesystem is readable and writable. The following is an example
    of /etc/exports file:


    ```

    /mnt/cdrom (ro)

    /tmp (rw)

    /home 192.168.0.0/255.255.255.0(rw)

    ```


    The first line in the above examples /mnt/cdrom read-only to the world. The second
    line in the above examples /exports /tmp read-write to the world. The third line
    in the above examples /home read-write to only the 192.168.0.0 network. For more
    information about the format and options of /etc/exports, view the exports man
    page (man 5 exports).


    After you have added your filesystem entries to /etc/exports, you must take the
    following steps:


    +   1. Run exportsfs -av. To initially add all your entries in /etc/exports to
    the list of exported filesystems (assuming mountd is already running), run exportsfs
    -av. The "a" option specifies exportsfs to add the entries and the "v" option
    specifies to print the output verbely.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Standard Networking Services


    2. Run exportfs -rv. After making changes to /etc/exports, you must update the
    NFS server using exportfs -rv. This command re-exports all directories in /etc/exports,
    syncing the server''s list of exports (main-tained by mount in /var/lib/nfs/stab)
    with the /etc/exports file.


    To remove a filesystem from mount''s list of exportable filesystems, use exportfs
    -u. More information about exportfs may be found in the exportfs(8) man page (man
    8 exportfs).


    # The NFS Client


    The NFS client is included in the RPM package knfsd-1.2.2-4.i386.rpm. In-dition,
    an RPM package called knfsd-clients-1.2.2-4.i386.rpm is available. It contains
    useful NFS client tools such as showmount. The default NFS client on Linux consists
    of several parts. Some of the most important parts include the specific kernel
    modules port and mount.


    # Kernel Modules


    The NFS client requires a specific set of kernel modules. These modules-clude
    nfs.o, lockd.o, and sunrpc.o. These kernel modules are installed in the default
    Red Hat 6.0 kernel installation and will automatically load when you mount a remote
    filesystem by the kernel module loader.


    # portmap


    The NFS client (as well as the server) requires the system to be running the portmap
    daemon. The portmap daemon must be running for the NFS lockd (file locking over
    NFS) daemon to work properly. The portmap daemon is installed as /sbin/portmap
    on Red Hat 6.0 (included in the portmap RPM portmap-4.0-15.i386.rpm). To start
    portmap, run /etc/rc.d/init.d/portmap start.


    # mount


    The utility required to use NFS is the mount utility. The mount utility is used
    to mount a remote NFS filesystem. Common use of the mount utility is used remothost:/path
    /local/path. There are several commonly used mount options for NFS. Table 10.2
    lists the most mount options used on NFS.


    Using above mount options, you could mount the filesystem /export on the NFS server
    linux.example.com with a 8k blockSize on /mnt/nfs, by issuing the following:


    ```

    mount linux.example.com:/export /mnt/nfs -o rsize=8192,wsize=8192

    ```'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Table 10.2 NFS mount options.


    | Mount Option | Description |

    | --- | --- |

    | size=num | Read num bytes at a time (instead of the default 1024 bytes). |

    | wsize=num | Write num bytes at a time (instead of the default 1024 bytes). |

    | soft | If a timeout occurs, return an I/O error to the calling program. |

    | hard | If a timeout occurs, send a "Server not responding" to the console and
    continue to retry. (This is the default behavior.) |

    | intr | For a hard mount that has timed out, allow I/O to be interrupted with
    a signal to the calling program. (The default is to not allow I/O on a hard mount
    to be interrupted.) |


    # NFS Tools


    In addition to the mount command used to mount the NFS filesystems, there are
    a few other useful NFS tools to help use and administer NFS filesystems. Table
    10.3 lists a few extra tools to make your life with NFS easier.


    # SAMBA (SMB)


    SAMBA is the Open source software that implements SMB (Server Message Block).
    SMB allows you to set up your Red Hat Linux 6.0 machine to act as a server for
    Windows 95/98/NT for services such as file and printing sharing.


    # Setting Up SMB


    With Red Hat Linux 6.0, you have the option to install SAMBA during the installation
    (“Set up windows and file sharing” option). If SAMBA wasn''t


