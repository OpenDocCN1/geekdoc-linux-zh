  md: '# 208 Chapter 9


    +   screen Your desktop. The terms “screen” and “desktop” are often interchanged.
    Technically, the screen is the primary video display with which you view your
    X Window system.


    +   root window The background of your screen. The root window doesn''t have any
    of the standard characteristics of any other window, but it does have some unique
    applications. The root window is where you can customize your background images
    and so.


    +   window manager The main interface between the X Window system and the user.
    The window manager provides functionality such as window borders, menus, icons,
    desktops, button, and toolbars, and it allows you to customize them all. We will
    discuss the various window managers later in this chapter.


    +   pointer The arrow or other indicator that represents the location of your
    mouse, trackball, glide point, or other pointing device that corresponds to the
    location on the screen. Quite often, the shape, color, or size of the pointer
    changes to indicate that the mouse has a particular function on that specific
    area of the screen.


    +   window A frame where any given application resides and is managed by the window
    manager. The active window, the window you are currently using on your desktop,
    is usually indicated by being on top, in focus, or highlighted compared to the
    inactive windows on the screen.


    +   terminal emulator A window with just text that basically emulates a console.
    One example of a terminal emulator is xterm.


    # Window Managers


    Many window managers—such as AfterStep, Enlightenment, fwm, and Window Manager—are
    available for use with your X client. You should not confuse window managers with
    desktop environments, such as GNU Network Object Model (GNOME) and K Desktop Environment
    (KDE). We will discuss the desktop environments later in this chapter.


    # AfterStep


    AfterStep, shown in Figure 9.5, was originally designed to look and feel like
    the NeStep interface used on NeXT machines before Apple bought the company.'
