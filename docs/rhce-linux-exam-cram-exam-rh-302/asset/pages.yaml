  md: '# Basic TCP/IP Networking


    The most important concept to understand with TCP/IP networking is IP addressing.
    An IP address is a numeric identifier assigned to each machine on an IP network.
    An IP address is a software address, not a hardware address (hardware addresses
    are hardcoded into the machine or network interface card).


    # IP Numbers


    An IP address is made of 32 bits. These bits are separated into four sections
    called octets. (Each octet contains 4 bytes of information and specifies either
    the network or the node machine.) Every machine on a subnet has the same network
    address but individual node addresses. You can display an IP address in three
    ways. The first and most common method is dotted decimal. An example of an IP
    address is 130.57.30.56. The second way is using the binary system. If you convert
    130.57.30.56 in binary, it is 10000010.00111101.00111110.00111000. The third way
    is the hexadecimal system. If you denote 130.57.30.56 as Hexadecimal, it is 82
    39 1E.


    > Note: Throughout this section—and the entire book—IP addresses are noted using
    the dotted decimal format.


    # IP Classes


    There are three classes of IP networks: Class A, Class B, and Class C. Different
    classes are used depending on network size. The Class A network is used for a
    small number of networks with a large number of nodes. The Class B network is
    rarely used in a network, but could be used in a network where numerous Class
    C networks were unmanageable and a Class A network is too large. The Class C network
    is used for a very large number of networks that have few nodes.


    Class A network uses the addressing format Net.Node.Node.Node, allowing you to
    have up to 127 networks and 16,777,216 nodes per network. The Class A networks
    range from 1.0.0.0 to 127.0.0.0.


    > Note: Class A networks are no longer being assigned because none is available
    to assign. In fact, some Class A networks are already carved out into smaller
    networks.


    Being assigned a Class A network gives you all network addresses under the Net
    address. For instance, a company that owns the 12.0.0.0 Class A set of IP addresses
    has every IP address from 12.0.0.0 to 12.255.255.255.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Chapter 4


    A Class B network uses the addressing format Net.Net.Node.Node. allows you to
    have up to 16,384 networks and 65,534 nodes per network. The Class B networks
    range from 128.0.0.0 to 191.0.0.0. Being assigned a Class B network gives you
    all network addresses under the Net.Net. assignment. For instance, a company that
    owns 130.1.0.0 Class B network owns every IP address from 130.1.0.0 to 130.1.255.255.


    The Class C networks are the most common network class used. They allow you to
    have up to 2,097,152 networks, but you are limited to having only 254 nodes per
    network. Class C networks range from 192.0.0.0 to 223.0.0.0. Being assigned a
    Class C network gives you all network addresses under the assigned Net.Net.Node.
    For instance, an administrator or company owns the 200.2.0.0 Class C network owns
    every IP address from 200.0.2.0 to 200.0.255.255.


    You may be wondering what happens with network addresses above 235.255.255.255.
    Well, there are other classes of networks: Class D and Class E. Class D is used
    for multicast packets. These include the addresses from 224.0.0.0 to 239.255.255.255.
    A multicast transmission is used when a host wants to broadcast to multiple destinations,
    such as when a host is attempting to learn all the routers on your network. The
    Class E range of addresses is 240.0.0.0 through 255.255.255.255. These numbers
    are reserved for future use. You should not assign either Class D or Class E addresses
    to nodes on your network.


    Network addresses are managed by an official Internet Information Center (NIC),
    also referred to as InterNIC. Its Web site is at http://wwwinternic.net.


    The Internet Assigned Numbers Authority (IANA) has reserved the follow-blocks
    of the IP space for private networks:


    +   * 10.0.0.0 through 10.255.255.255

    * 172.16.0.0 through 172.31.255.255

    * 192.168.0.0 through 192.168.255.255


    These addresses can be used on any internal private network free of charge. However,
    these addresses are not publicly routable.


    # Supernetting IP Classes


    In 1992, a new adaptation to the IP classes was proposed. The idea was to supernet
    multiple classes and so in order to reserve IP numbers. Otherwise, IP addresses
    would be wastefully assigned (for example, a Class B address might'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'assigned when only two Class Cs'' worth of addresses was required), and we
    would run out of IP addresses quickly. Therefore, Classless InterDomain Routing
    (CIDR) was invented.


    Using supernetting, the class subnet masks are extended so that a network address
    and subnet mask can, for example, specify multiple Class C subnets with one address.
    For example, if you need about 500 addresses, you can supernet two Class C networks
    together. Table 4.4 shows supernetted subnets.


    It is expected that CIDR will have enough IP addresses available for the next
    few years, until IPv6 is implemented. IPv6 uses 128-bit addresses, which would
    comfortably allow over four billion unique addresses!


    # Subnets


    To create a subnet, you split IP addresses into two parts: a host and a network.
    Typically, the destination network is derived from the network part of the IP
    address; therefore, hosts with identical IP network numbers should be found within
    the same network.


    Every subnet is assigned a netmask, the number of bits interpreted as the subnet
    number. For instance, a Class C network number of 192.168.1.0 has a netmask of
    255.255.255.0, whereas a Class B network number, such as 190.54.0.0, has a netmask
    of 255.255.255.0.


    # Network Configuration


    Ifconfig is used to configure the kernel-resident network interfaces. It is used
    at boot-time to set up network interfaces as necessary. The first interface you''ll
    have to setup is the Loopback Interface (lo), as shown here:


    ```

    #ifconfig lo 127.0.0.1

    ```


