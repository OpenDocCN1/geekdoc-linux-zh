  md: '# Standard Networking Services 225


    This snippet of code specifies whether to run http standalone or through inetet,
    and what port on the server http should listen from if the server runs standalone.
    The default setting for Apache is to run the server standalone. Running the server
    through inetet is not advised as it causes inetet to fork() repeatedly, with each
    fork() running its own instance of http. This causes the Web server to be very
    slow. With standalone servers, you must also specify what server http should listen
    on. The default setting is port 80.


    ```

    ServerAdmin root@localhost

    ```


    This line of code assigns the email address that http emails if there are any
    errors or other problem information. The default setting is root@localhost. The
    following code snippet of the httpd.conf is the location of the error log file
    where http can log any errors it receives. The default setting for this option
    is logs/error_log:


    ```

    # ErrorLog: The location of the error log file. If this does not

    # start with /, ServerRoot is prepended to it.

    ```


    ```

    ErrorLog logs/error_log

    ```


    The following line of seconds from httpd.conf sets the number of seconds before
    httpd send and receive requests time out. The numeric setting is set in seconds:


    ```

    # Timeout: The number of seconds before receives and sends out

    ```


    ```

    Timeout 300

    ```


    The following options are used when running the Apache server as standalone:


    +   # Server-pool size regulation. Rather than making you guess how

    # many server processes you need, Apache dynamically adapts to the

    # load it sees -- that is, it tries to maintain enough server

    # processes to handle the current load, plus a few spare servers to

    # handle transient load spikes (e.g., multiple simultaneous

    # requests from a single Netscape browser).


    +   # It does this by periodically checking how many servers are waiting

    # for a request. If there are fewer than MinSpareServers, it creates

    # a new spare. If there are more than MaxSpareServers, some of the

    # spare dies off. These values are probably OK for most sites ---


    ```

    MinSpareServers 8

    MaxSpareServers 20

    ```'
