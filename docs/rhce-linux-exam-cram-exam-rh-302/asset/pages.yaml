    # # The Vicxie cron System


    The Vicxie cron system allows your machine to run specific commands at regularly
    specified intervals. You can set these commands to run hourly, daily, weekly,
    monthly, or even yearly. Both root and individual users can use the cron system.


    The cron system uses configuration files named crontab. The system''s (root) crontab
    is located in /etc/crontab. User-specific crontabs are in /var/spool/cron/username.
    If a cron job specifies a standard out request, the output is emailed to the user
    who owns the group.


    # # Looking At The /etc/crontab File


    Root''s crontab file is located at /etc/crontab. Taking a look at this file can
    be quite deceiving because it looks very simple. In fact, the /etc/crontab file,
    by default, is comprised of only nine lines. Four of them are script settings,
    and one is a comment. A default /etc/crontab file follows:


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/bin

    MAILTO=root

    HOME=/

    ```'
