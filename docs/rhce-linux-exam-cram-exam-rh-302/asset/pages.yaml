    ```

    30 12-15 3-9 * /usr/sbin/rm -rf /home/user/tmp/*

    ```


    removes all directories in the users''s tmp directory at 12:30 P.M. every day
    between the first and the fifteenth of every month between March and September.
    If you tossed in a 5 in the fifth directory, the job would run Friday as well,
