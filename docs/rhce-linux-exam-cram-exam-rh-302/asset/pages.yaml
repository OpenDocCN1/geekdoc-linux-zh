  md: '+   - V Produces verbose output, including all filesystem-specific commands
    that are executed. This is useful only for testing.


    +   - ftype Specifies the type of filesystem to be built. If the type is not specified,
    the default filesystem type (currently ext2) is used.


    +   - fs-options Specifies filesystem-specific options to be passed to the real
    filesystem builder.


    +   - c Checks the device for bad blocks before building the filesystem.


    +   - l filename Reads the bad blocks list from the file name.


    +   - v Produces verbose output.


    +   - filesys Is either the device name (for example, /dev/hda1 or /dev/sdb2)
    or the mount point (for example, /,usr, or /home) for the filesystem.


    +   - blocks Is the number of blocks that will be used for the filesystem.


    # fsck


    fsck is used to check and repair Linux filesystems. It is typically used like
    this:


    ```

    fsck [ -AVR ] ] [ -s ] [ - ftype ] [ fs-options ] filesys

    ```


    The following explains the options used in the previous snippet of code as well
    a few extra options available.


    +   - -A Walks through the /etc/fstab file and tries to check all filesystems
    at once.


    +   - -R Skips the root filesystem when you are checking all filesystems with
    the -A flag.


    +   - -V Produces verbose output.


    +   - -ftype Specifies the type of filesystem to be checked. If the -A flag is
    specified, only filesystems that match ftype are checked.


    +   - fs-options


    +   - -a Repairs the filesystem automatically without any questions (use this
    option with caution).


    +   - -r Repairs the filesystem interactively (Will ask for confirmations).


    +   - filesys Indicates either the device name or mount point.'
