    2file file5file

    ```


    The asterisk (*) character is used to represent any number of characters in a
    file name. file* returns all files with file names that begin with "file" and
    end with any character sequence. On the other hand, *file returns any file name
    that ends in "file". Here is file* in action:


    ```

    $ls file*

    file3 file34

    file4 file5file

    ```


    The question mark (?) character is used to represent a single character. file?
    requests any file name that starts with "file" and ends with any other character.
    On the other hand, ??file requests any file name with two random characters that
    are followed by "file". Here is how to use file?


    ```

    $ls file?

    file3

    file4

    ```


    Closed brackets ([]) are used to specify a range of characters. file[abc] requests
    the file names filea, fileb, and filec. Another example, [169]file, requests the
    file names 1file, 6file, and 9file. This example, shows the use of square brackets:


    ```

    $ls file[123]

    file3

    ```


    You''ll notice that file[123] yields only file3. In our original list, file1 and
    file2 do not exist.


    Curly brackets {} are used to specify a range of characters, like closed brackets;
    however, when you use curly brackets, multiple character strings can be separated
    by commas. For instance, file{1,34,ab} returns file names file1, file34, and fileab.
    Another example, file{ab,s,ing}34, requests fileab34, files34, and fileing34.
    The use of curly brackets in a string is shown here:


    ```

    $ls file{1,2,3,34}

    file3

    file34

    ```


