  md: 'Open source software (OSS) and Linux in general have come a long way since
    Linus Torvalds began his hobbyist project called “Linux” back in 1990. In order
    to understand Linux at all, it is imperative that you learn both the history and
    the general concepts behind the development of OSS and Linux. So before you get
    engrossed with all the technical details of Linux, let''s learn about where it
    started and how it developed. This chapter will help you understand where Linux
    came from and what it''s all about, and where to look when you need more information.


    # # Understanding OSS


    OSS is software whose source code is available to the public. Having publicly
    available source code doesn''t necessarily mean there are no copyright issues,
    however. In fact, OSS typically is copyrighted with restrictions meant to preserve
    its source status, authorship, and control.


    OSS is usually developed by the mass effort of programmers over the world. Universities,
    government agencies, and not-for-profit organizations (as well as individuals
    programmers) develop OSS.


    Although companies and individuals had released their source code for years, the
    actual label “Open Source” wasn''t used until early 1998. On one early February,
    a group of individuals met to discuss Netscape''s January 1998 announcement that
    it was going to release the source code for its popular web browser, Netscape
    Navigator. The members of this group included Todd Anderson, Chris Peterson (of
    the Foresight Institute), Jon “maddog” Hall and Larry Augustin (of Linux International),
    Sam Ockman (from the Silicon Linux Users Group), and Eric S. Raymond.


    These individuals recognized the impeccable timing that would be needed to respond
    to Netscape''s actions. The Linux and “free software” community would need to
    react appropriately to seize the moment to gain corporate recognition for the
    open development process. After brainstorming about tactics, the corporate community,
    and Netscape''s recent actions, they finally agreed on the “Open Source” label.
    Peterson had suggested this title instead of “free software.”


    Many things have happened to the open source community since it was adopted as
    “open source” instead of “free software.” Shortly after the announcement regarding
    the new movement toward OSS, a feverish debate between hackers all over the world
    began with the use of the new term instead of “free software.” In fact, Richard
    Stallman, founder of the GNU project, considered using the new term, if only for
    a little while.


    By the end of February, however, the roar died down over the “Open Source” label
    issue. All attention was diverted back to the corporate world as'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'both Netscape and O''Reilly and Associates had agreed to begin referring to

    OSS in their press releases and on their Web sites.


    At the end of March, Netscape Navigator''s source was made freely available,

    spawning a massive download over the Internet. Within a few hours of its re-

    lease, hackers all over the world began running fixes and enhancements.


    In April, the press began its stream of non-technical coverage of open source

    for the public''s belief. Salon magazine interviewed Eric S. Raymond (ESR)

    and published an article on the details of Open Source.


    May was an exciting month for the open source community. Corel announced

    that it was going to port WordPerfect and its office products to Linux. In

    addition, Sun Microsystems and Adaptec were the first two, established

    vendors to join Linux International.


    OSS began to heat up in July when an article was published in Forbes maga-

    zine. The focus of the article? An interview with Linus Torvalds himself.


    The number of open source projects continued to escalate into the end of the

    year. In October, Microsoft helped an exciting exit to Linux''s first year. In

    ponse to its impending antitrust case, it released a formal statement claiming

    that Linux''s existence proved that Microsoft didn''t in fact have an OS

    mopoly. The year closed up with a bang after IDG announced that the Linux

    market share had increased by 212 percent in 1998!


    # # The Free Software\ Foundation (FSF)


    Before the OSS project began, the FSF, founded to help protect and pursue

    the rights of free software, was already established. The FSF, which supports

    the free software movement, is currently a tax-exempt charity that raises funds

    to work on the GNU Project.


    According to the FSF, free software is a matter of liberty, not price. It says
    that

    to understand the concept, you should think of "free speech," not "free beer.\nThe
    FSF believes that free software is the freedom for the user to run, copy,

    distribute, study, change, and improve software.


    # # The GNU Project


    The GNU Project was started in 1984 to develop a completely free Unix-

    like operating system. GNU''s founder, Richard Stallman (also fondly'
