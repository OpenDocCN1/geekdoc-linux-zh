    # Understanding The Linux Kernel


    The Linux kernel is the very fundamental foundation on which Linux is based. The
    Linux kernel, in fact, is what Linux gets its name. As discussed in Chapter 3,
    the Linux kernel was developed as a hobby by a student named Linus Torvalds in
    Helsinki. The Linux kernel, combined with many applications and GNU tools, is
    what makes Red Hat Linux today. In this section,'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Chapter 8


    we will discuss technicalities of the kernel, good housekeeping practices, kernel
    modules, kernel configuration, kernel compiling, and more.


    # Kernel Basics


    There are two types of Linux kernels: monolithic and modular. Monolithic kernels
    are much like old-style Unix kernels. All the system support is compiled directly
    in the kernel. Therefore, if SCSI support is required, all the SCSI drivers and
    so on are compiled directly in the kernel. This creates a much larger kernel,
    but runs a little faster at boot-time. In addition, monolithic kernels use a constant
    amount of RAM.


    On the other hand, the only drivers that modular kernels need compiled are those
    required at boot-time. Remaining drivers and support are installed as modules
    and are loaded only when needed. The modular kernel method is less secure than
    the monolithic kernel method; however, it is more memory efficient and allows
    the kernel to be much smaller.


    Some systems require the use of ramdisks. Ramdisks are required when such as SCSI
    support during boot is needed. The ramdisk is noted in your /etc/lilo conf file
    as an initrd= comment. We will discuss creating this file later in this chapter.


    # Kernel Housekeepers


    Good kernel know to keep their kernels clean and their systems functioning. It
    is a good habit to never delete an existing kernel when you compile a new one.
    Rather than overwriting your existing kernel, rename it. You can then set up LILO,
    the Linux boot loader, to boot your existing kernel as a choice, just in case
    your new kernel is unbootable.


    If your new kernel is unbootable, do not fret. You kept your existing kernel to
    boot from, didn''t you? Chances are you may have misconfigured your system, maybe
    even set the wrong options during your configuration, or possibly have missing
    or corrupt kernel source. If any of these happens, debugging your kernel problems
    by the errors you receive when compiling or booting. If the problem turns out
    to be unsolvable, try and again. Remember that wherever you visit, clean up after
    yourself. Leaving behind configurations from previous trials may make future attempts
    less successful.


    # Kernel Modules


    Kernel modules are used in modular kernels. They are loaded as needed when support
    for a specific device, protocol, and so on is required. Modules that the kernel
    uses are located in the /lib/modules/ directory. The files located under'
