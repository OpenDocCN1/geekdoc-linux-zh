  md: 'The Debging Exam 303


    video, sound, etc) that isn''t working right on the system. Since your system
    is now booting properly, fix whatever is specified using your knowledge of setting
    up and configuring the item (covered in our previous chapters, such as items listed
    in Chapters 6, 8, 9, and 10).


    # # Managing Your Time


    You are given three hours to complete two separate sets of objectives in the debugging
    portion of the exam. Try to use some of the following guidelines, and budget your
    time to allow you to finish all objectives in the exam.


    +   * While previewing your objectives, make a mental (or paper) note of how long
