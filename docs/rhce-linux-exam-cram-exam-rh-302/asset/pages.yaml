    # Processor Family


    The first question, regarding Processor family, sets certain assumptions for the
    kernel. When set to 386, the kernel you compile should run on any x86-compatible
    processor. Using any higher CPU family makes the kernel assume capabilities in
    the processor (which may have a large impact on performance on that type of CPU).
    Therefore, the resulting kernel probably won''t run on anything lower than the
    family you specify.


    The Math Emulation option turns on the kernel software floating point emulation.
    This is safe to turn on for CPUs with hardware floating point units because the
    kernel detects the FPU at boot and disables emulation. Turning this option increases
    the size of the kernel, however, it is really necessary for only 386, 86SX, and
    other CPUs without hardware floating point.


    The MTRR Support option can have a huge impact on performance. It allows you to
    turn on write-combining for certain cards, such as video cards on the PCI or AGP
    bus. This option is available only on Pentium II (and higher) and K6-2 (and higher)
    CPUs. It is safe to turn on this option for CPUs that do not support it because
    it adds just a small amount of additional code to the kernel.


    The Symmetric Multi-Processing option turns on SMP support in the kernel. It is
    also safe for uni-processor systems. However, turning on this option may slow
    such systems down slightly and adds a small amount of code to the kernel.


    # Loadable Module Support


    You are given the option to configure loadable module support—required for modular
    kernels—during kernel configuration. The three options available under this heading
    are to enable loadable module support, to set version information on all symbols
    for modules, and to enable the kernel module loader. For modular kernels, you
    must select yes for loadable module support and kernel module loader. The version
    information choice is optional. The modular version setting is used to make modules
    usable after a kernel compilation without recompiling the module.


