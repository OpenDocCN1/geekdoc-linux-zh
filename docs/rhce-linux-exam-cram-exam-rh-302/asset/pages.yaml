  md: '# Chapter 3


    Before pursuing your dreams of becoming a Red Hat Certified Engineer (RHCE), or
    just becoming a Linux “power user”, you should have extensive knowledge of Linux,
    Linux tools, and TCP/IP networking bases. These prerequisites are also required
    if you opt to take part in the Red Hat Certified Engineering training program,
    which is scheduled for the four days before you take your exam. This chapter will
    discuss many of the general Linux and Unix concepts that you need to be familiar
    with before tackling RHCE preparation.


    # Unix Basics


    Linux is a Unix-like operating system. Therefore, it''s essential for you to know
    basic Unix commands in order to become an RHCE. You must have working knowledge
    of Unix concepts such as the filesystem hierarchy, mounting and administering
    filesystems, basic shell configuration, and basic file operations. In addition,
    filters, wildcards, vi, and other operations are file operations. They manipulate
    and edit files.


    # Unix Filesystem Hierarchy And Structure


    Unix filesystems are structured in a directory tree. Although these structures
    differ slightly on each flavor of Unix system, the directories I describe here
    are standard on Linux.


    The main directory, called the root directory, is denoted with a simple forward
    slash (/). All directories on a Unix system are subdirectories of the root. Directly
    under the root directory are the following subdirectories:


    +   - The typical location for executable and binary files for Unix commands and
    utilities. It also contains executables used by users.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_57_0.png)


    +   - The dev directory. The /dev directory is divided up into subdirectories
    that contain files for a specific device. These directories are named based on
    the type of device files they contain. Some examples of these directories are
    hda1 (for the first IDE hard drive), fd0 (for the floppy disk), and cdrom, which
    is a symlink created to whatever cdrom device that Red Hat was installed from,
    if installed via cdrom.'
  merge: -1
