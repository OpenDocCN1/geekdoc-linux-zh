  md: '# Chapter 2


    version of Unix on the x86 platform, and was even being ported to the DEC Alpha,
    Sun SPARC, and SGI maps.


    In 1996, the Linux kernel 2 was released. Version 2 saw the preliminary support
    for SMP (symmetric multi-processor) machines. It was also fully functional on
    multiple platforms including the x86, Sparc, Motorola 68k, PowerPC, and MIPS.


    In 1999 the latest stable kernel, version 2.2, was released. The 2.2 kernel fully
    supports the SMP machines as well as more fully supports multiple platforms including
    the 64-bit platforms. In addition, version 2.2 also had a large improvement for
    speed.


    # Red Hat History


    Red Hat was started in 1995 when two entrepreneurs, Bob Young and Mark Ewing,
    decided to venture into becoming a Linux distribution. In just one year, Red Hat''s
    distribution was taking the market by storm and was even voted desktop operating
    system of the year InfoWorld. In 1997, Red Hat won another InfoWorld award when
    its distribution of Red Hat version 5 was named Network Operating System of the
    Year. It it won again in 1999 with Red Hat Linux 5.2, for three years running.
    This was a feat no other software product had achieved in the InfoWorld awards
    history.


    In September 1998, the popular trend of large technology firms investing into
    Red Hat started. Some of the first included Intel and Nestle Communications. In
    addition to technical firms, venture capital firms decided to invest. The two
    first were Benchmark Capital and Greylock Management. Red Hat continues to grow
    in its investment base, and even entered the stock market in June 1999. In addition
    to financial growth, the company outgrew its living quarters in an office building
    in Research Triangle Park in North Carolina. In February 1999, it moved into its
    own building, gaining five times more space!


    Red Hat has expanded, changed, and adapted many times in its five years. Since
    beginning simply as a “packager” of Linux, Red Hat has gained many important developers
    for the project, including Alan Cox, on his payroll. In addition, Red Hat is quickly
    expanding its install base by being the most popular Linux distribution to be
    sold and supported by such vendors as IBM, Compaq, Dell, and Hewlett-Packard.
    Before these vendors began shipping Linux, however, many vendors, including VA
    Linux Systems and Penguin Computing, were already shipping Red Hat Linux-configured
    machines.'
