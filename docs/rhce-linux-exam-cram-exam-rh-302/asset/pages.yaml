  md: '# Question 1


    The correct answer is e. Kernel versions 2.2 and higher can support up to 2GB
    on Intel machines; therefore answers a, b, c and d are incorrect.


    # Question 2


    Answer c is correct. ID type 82 is Linux swap. Partition ID type 4 is FAT16, therefore
    answer a is incorrect. ID type 5 is Extended, therefore b is incorrect. ID type
    83 is Linux native, therefore answer d is incorrect. ID type c is Win95 FAT32,
    therefore answer e is incorrect.


    # Question 3


    Answer c is correct. A Linux system uses the DOS style partition table, which
    limits the system to a maximum total of four primary partition support, therefore
    answers a and b are incorrect. The total number of partitions that can be used
    (including extended and logical) is 16, so answer d is incorrect.


    # Question 4


    Answer a is correct. A Linux partition table can support up to four primary partitions,
    one of which can be extended.


    # Question 5


    Answer b is correct. A Linux partition table can support a total of 16 partitions.
    This includes 3 primary, 1 extended (which counts as the fourth supported partition),
    and 12 logical.


    # Question 6


    Answer b is correct. The first primary partition on the first IDE hard-drive would
    be hda1. Answer a, hda, refers to the first hard-drive, but not the first primary
    partition on the first IDE hard-drive, therefore a is incorrect. Answers c and
    d are sda and sda1, which refer to the SCSI hard-drive and first SCSI hard-drive
    partition, both c and d are incorrect. Answer e, hda5, refers to the first logical
    partition and therefore is incorrect.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Question 7


    Answer e is correct. The device name for the first logical partition on the first
    IDE hard-drive is hda5. The answers hda1 and hda2 refer to the first and second
    (primary or extended) partitions, therefore answers a and b are incorrect. answers
    sda and sda1 refer to the first and second (primary or extended) partitions, making
    answers c and d incorrect.


    # Question 8


    Answer e is correct. To create a boot disk for Linux using DOS or Windows, you
    use rewrite. The tool transdisk is not valid, therefore answer a is incorrect.
    The fdisk tool is used for disk partitioning, therefore answer b is incorrect.
    Answer c, copy, is used for copying files, not creating images, and therefore
    is incorrect. The option diskcopy is not a valid tool, therefore answer d is incorrect.


    # Question 9


    Answer b is correct. To create a boot disk from Unix, you would use dd. The rewrite
    tool is used to write images on a DOS or Windows machine, therefore answer a is
    incorrect. Answer c, fsck, is used to check Unix filesystems, and therefore is
    incorrect. Answer d, fdisk, is used for manipulating partitions, and therefore
    is incorrect. The copy tool is used for copying files, therefore answer e is also
    incorrect.


    # Question 10


    Answer d is correct. Special installation diskettes are required when an install
    is to be performed over the network or via PCMCIA device (such as CD-ROM or NIC).
    NFS is a network service. FTP is a network service, therefore answer b is also
    correct. Answer c does not require a boot disk other than boot.img, Answer d selects
    both answers and b; therefore answer d is correct. Answer e selects all of the
    above, and (since c is incorrect) is incorrect.


    # Question 11


    Answer d is correct. You should only need to install the Linux bootloader within
    the first sector of the boot partition when you are planning to use an alternative
    bootloader (such as NT) to manage the multi-boot system. The Linux bootloader
    is capable of booting multiple operating systems, therefore answer a is incorrect.
    The bootloader has nothing to do with the trial run of Linux,'
