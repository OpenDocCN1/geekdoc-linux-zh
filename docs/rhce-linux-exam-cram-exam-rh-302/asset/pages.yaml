  md: '# About The Author


    Kara Pritchard is currently a systems administrator for an Internet Service Provider
    in Springfield, Illinois and is a project manager for VA Linux Systems, developing
    the Linux User Group resource on Linux.com. In an ongoing consulting endeavor,
    Kara has been promoting the use of Linux in both corporate and educational facilities
    since late 1995.


    Kara began participating in the Linux community in fall of 1995, when introduced
    to the Southern Illinois Linux Users Group (SILUG), founded by her husband in
    1994. Together with her husband, Kara founded the Linux Users of Central Illinois
    (LUCI) in 1997 and has since been involved with several projects including a Linux
    mentoring program for youth. She was elected president of a technology show held
    annually at the Illinois State Fairgrounds in late 1998. She may be contacted
    via email at kara@linux.com.'
