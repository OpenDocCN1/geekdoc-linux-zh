    \ for donations of machines and money. I'm asking individuals for donations of\
    \ programs and work.\n\nOne computer manufacturer has already offered to provide\
    \ a machine. But we could use more. One consequence you can expect if you donate\
    \ machines is GNU will run on them at an early date. The machine had better be\
