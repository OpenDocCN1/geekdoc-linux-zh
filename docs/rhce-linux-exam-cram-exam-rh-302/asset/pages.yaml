  md: '# Question 6


    ```

    What is a bootloader?

    ```


    A bootloader is a program used to manage the boot process of an operating system.
    Many bootloaders, such as LILO, can manage multiple operating system processes,
    allowing a machine to have the option of booting more than one operating system
    from separate partitions on the same machine. At this time, you cannot boot multiple
    operating systems simultaneously.


