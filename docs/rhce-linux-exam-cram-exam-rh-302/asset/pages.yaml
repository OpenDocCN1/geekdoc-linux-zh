  md: "# General Linux Information 13\n\ncommand interpreters, the Incompatible Timesharing\
    \ System and the Lisp Machine operating system. I pioneered terminal-independent\
    \ display support in ITS. In addition I have implemented one crashproof file system\
    \ and two window systems for Lisp machines.\n\nWhy I Must Write GNU\n consider\
    \ that the golden rule requires that if I like a program I must share it with\
    \ other people like it. I cannot in good conscience sign a nondisclosure agreement\
    \ or a software license agreement.\n\nSo that I can continue to use computers\
    \ without violating my principles, I have decided to put together a sufficient\
    \ body of free software so that I will be able to get along without any software\
