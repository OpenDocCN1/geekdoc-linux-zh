  md: '# 162 Chapter 8


    The first section is simply for information only. It states the use and author
    of the file. The second section discusses the seven runlevels, which are the different
    states of where or how the system is running. Runlevel 0 is the halt state. Runlevel
    1 indicates that the system is running in single-user mode. Runlevel 1 allows
    you to administer your system without multi-user support.


    > Did you forget your root password? You can boot into runlevel 1, into single-user
    mode, and change the password.


    Runlevel 2 is multi-user mode, but it has no networking support. Runlevel 3 is
    full multi-user mode and offers full networking support. Runlevel 4 isn''t used.
    Runlevel 5 on Red Hat Linux is full multi-user mode and boots into an X-based
    login screen. Runlevel 6 is for rebooting. Following the runlevel descriptions
    is a line that starts with “id”. This line specifies the default runlevel to boot
    into. After your system is booted into a particular runlevel, you can access other
    runlevels using the it or telnet commands. By issuing an it 6 at the root prompt,
    you can command the system to reboot. However, issuing an it 1 commands the system
    to boot into single-user mode. These commands can only be issued by root. Here
    is an example of /etc/inittab file:


    +   # inittab

    # This file describes how the INIT process sets up its

    # the system in a certain run-level.


    ```

    # Author: Miquel van Smoenberg, <miquels@drunkenel.nl.mugnet.org>

    # Modified for RHS Linux by Marc Ewing and Donnie Barnes

    ```


    ```

    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, with no networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    id:3:initdefault:

    ```


    The third section of the /etc/inittab file details the boot sequence. It starts
    the system initialization with the rc.sysinit script (which we will discuss later
    in this chapter in the “Understanding System Initialization Scripts” section).
    It then calls the rc files shown in the following codes.'
