    # # Domain Name Service (DNS)


    DNS is the service responsible for managing the host and domain name conversion
    to and from the mapped IP addresses. Therefore, DNS is responsible from converting
    an IP address to its domain name and converting a domain name to its assigned
    IP address. The server that is run on a Linux DNS server is **named**. The **named**
    server is a part of the BIND (Berkeley Internet Domain Name) package used on more
    than 85 percent of all DNS servers in the world.


    # # Configuring BIND 8.x


    During the Red Hat Linux 6.0 installation, you are given the option of installing
    BIND automatically. However if BIND isn''t installed during installation, you
    can install it from the Red Hat Linux 6.0 CD-ROM. There are three different RPMs
    you should install. The first, and most important, is the bind-8.2-6.i386.rpm
    file, which is the main BIND RPM. The second is recommended to be installed on
    every machine, even if the machine isn''t planning on being a DNS server, as it
    is the bind utilities package. The bind utilities package is installed with bind-utils-8.3-6.i386.rpm.
    An optional (but highly recommended) package to be used with BIND is the caching
    name server package that configures your DNS server to cache DNS entries making
    lookups and DNS access faster. The caching name server package to install is caching-nameserver-6.0-2.noarch.rpm.'
