    # # Installing Red Hat Linux Automatically


    Many large companies, or even hardware resellers, often need to configure Red
    Hat Linux on many machines. If all the machines have the exact same hardware configuration
    and need the exact same software configuration, you can automate the installation
    by using a program kickstart.


    The program kickstart automates your installation by answering the questions the
    install program asks. The kickstart utility works with an ASCII-based instruction
    file that can be supplied from a floppy installation disk, or even from an NFS
    server.


    The kickstart program automatically installs Red Hat Linux using several methods.
    The two supported methods are CD-ROM- and NFS-based installations. FTP and HTTP
    installations, though not commonly advertised, are supported as well.


    The kickstart program uses a kickstart configuration file called ks.cfg. The ks.cfg
    file contains all the configuration answers to all the questions that are prompted
    during an installation. If an answer is not provided in the ks.cfg file, the installation
    pauses and prompts you to answer the question. Once you answer the question, the
    automatic installation resumes. A sample ks.cfg file follows:'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Advanced Installation


    ```

    lang en

    network --bootproto dhcp

    cdrom

    device ethernet

    keyboard "us"

    zerombr yes

    clearpart --linux

    part /boot --size 32

    part / --size 250

    part swap --size 128

    install

    mouse ps/2 --emulthree

    timezone --utc US/Central

    xconfig --server "FBDev" --monitor "lcd panel 1024x768"

    rootwp redhat

    auth --useshadow --enablemd5

    #lilo --append "anything-needed"

    %packages

    @ Workstation

    %post

    ```


    This shows a very simple and very basic ks.cfg file. The first line specifies
    that English is the selected language. The second line specifies your network
    configuration, which in this case is DHCP. The third line specifies the installation
    medium. This reads either cdrom or nfs--name.of.server-dir/pathtoimage/imagefile
    and so on. The next two lines configure any devices such as ethernet and keyboard.


    The next five lines in this file relate to the hard disk and its partitioning.
    The first option, zerombr, instructs Red Hat Linux to clear the current partition
    information. The clearpart option specifies to clear all the Linux partitions
    on the disk. The three part option specifies the partitions to be created on the
    disk, including partition type, mount point, and size. By default, creating the
    ks.cfg file from your main computer sets the size options to 1. Therefore, you
    must edit the ks.cfg file to set the appropriate size in megabytes. We will discuss
    these changes in the ks.cfg file in more detail later in the “Using Diskette-based
    Kickstart” section in this chapter.


    The next option, install, is a required parameter that states you will do a fresh
    install of Red Hat Linux. The next three options in this sample ks.cfg file provide
    additional configuration settings. The mouse option allows you to set the mouse
    type, in addition to any options you need, as emulating three buttons. The timezone
    option specifies what time zone to set on your machine. The xconfig line specifies
    what X server to install and what type of monitor you are using.'
