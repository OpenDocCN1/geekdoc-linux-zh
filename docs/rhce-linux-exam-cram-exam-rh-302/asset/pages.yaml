  md: "# Standard Networking Services 237\n\nThe main configuration file for BIND\
    \ 8.x is /etc/named.conf. In /etc/named.conf, you can specify options such as\
    \ the default directory for named files and the zones for the named entries you\
    \ are hosting. There are two types of named files you host. The first is the database\
    \ (db) entry for each domain you host. These db entries are typically either db.domain.com\
    \ or domain.com.db, depending on the naming scheme you use. The db entries are\
    \ the forward DNS entries for your domain. The second type of named file you host\
    \ is the reverse DNS file denoted typically by db.x.x.x.in-addr.arpa where for\
    \ example, if you host the 192.168.1.x subnet, you would have a db.1.168.192.in-addr.arpa\
    \ reverse DNS file.\n\nSome DNS servers do not host the entire subnet. Therefore,\
    \ the subnet provider (Internet Service Provider) hosts the reverse DNS information\
    \ and the in-addr.arpa entries are not required on your machine.\n\n![](img/7a3d74d02590d83bf562ed6969db9ba0_268_0.png)\n\
    \n# named.conf\n\nThe /etc/named.conf file is the main configuration file for\
    \ named. Within the named.conf file, you will specify options such as the default\
