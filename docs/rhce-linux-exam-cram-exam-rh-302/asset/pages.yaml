  md: "# Understanding Bourne Shell Scripts\n\nShell scripts are a set of commands,\
    \ either in a file or typed in the command line, that perform multiple operations\
    \ on a file or files (which must be executable to run). To make a file executable,\
    \ you can use chmod +x or chmod 755 filename.\n\nThe kernel uses specific \"signature\"\
    \ bytes, called magic, of an executable file to determine how to execute that\
    \ file. For example, if the first two bytes of an executable file are \"#!\",\
    \ the kernel knows that the file is a script. The kernel then reads to the first\
    \ new-line character in the file, and uses the line as the name of the script\
    \ interpreter to run. If the kernel sees\n\n```\n#!/bin/sh\n```\n\nas the first\
    \ line of a script, it runs /bin/sh the script name as an argument. The kernel\
    \ also knows the magic for various other types of binary files (ELF, various forms\
    \ of a.out, COFF from various Unix systems, and so on). This functionality can\
    \ be further extended the binfmt_misc module in 2.2.x kernels.\n\nIf you scan\
    \ an existing shell script, you typically find comments, which help to explain\
    \ what a command or section of the script is doing. All comments within a shell\
    \ script are noted with a hash mark (#) at the beginning of a line, as shown here:\n\
    \n```\n#!/bin/sh\n# This is a sample comment for a shell script.\nif [ -x file\
    \ ]; then echo foo; fi\n```\n\nWhen you are doing any sort of programming or scripting,\
    \ it is a good habit to supply comments. A few months, or in some cases just a\
    \ few days, after you have written your code, comments will help you (and others\
    \ who need to read it) decipher what you've written.\n\n# Using Constructs\n\n\
    Typical scripts contain if, else, elif, case, and for constructs. The if construct\
    \ supplies a conditional argument. All if constructs are closed with a fi, as\
    \ shown here:\n\n```\nif foo ; then\n  do something\nfi\n```"
