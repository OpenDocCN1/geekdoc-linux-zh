    # SCSI Support


    The first option for SCSI support is simply to enable SCSI support, which turns
    on support for SCSI devices. If you turn this option on, you are given the opportunity
    to configure various driver options, as well as support for various types of devices
    and interface. Unless you are booting off a SCSI device, it is safe to modularize
    this option in the event you install an SCSI card or other SCSI device.


    # Network Device Support


    There are several options available under the network device support section.
    The first option is to enable support for network devices, which allows you to
    configure support for various network devices. If you enable this option, you
    are prompted for specific network device support. If you answer no to this option,
    the following network devices are automatically disabled.


    One of the first network device options is to enable ARCnet support. This option
    allows you to turn on support for old ARCnet cards. ARCnet is an old networking
    system that somewhat resembles Ethernet primarily over PCs.'
