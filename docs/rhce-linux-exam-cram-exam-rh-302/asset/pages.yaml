    cat filename


    The grep tool is very popular to search files for a specific term or string. The
    output of grep displays only the lines that contain the term or string that was
    grepped. The grep tool can be used by itself, or to filter the output of another
    filter, such as cat. For example, both


    cat filename | grep error'
