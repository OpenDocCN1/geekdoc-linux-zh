  md: '# Chapter 8


    and remove pseudo terminal device entries in /dev/pts as needed. If you have turned
    on support for Unix98 PTYs, turn this one.


    The next option is QNX filesystem support. This support is experimental, and when
    enabled, provides support for the filesystem used by the QNX real-time OS. For
    read-only media, the ROM filesystem support option is used. This option turns
    on support for a lightweight filesystem designed for read-only media. It is generally
    useful for install media and embedded systems.


    A very important option is for the second extended filesystem, which is the standard
    filesystem on Linux. The second extended fs support option turns on support for
    this.


    Two options that support other Unix filesystems include the System V and Coherent
    filesystem support and the UFS filesystem support. These two options allow you
    to turn on support for the filesystems used in many other Unix (or Unix-like)
    systems, especially some the “genuine” Unix systems derived from AT&T or BSD code.
    The System V filesystem is used by some Sys-based systems like SCO. UFS is used
    by many BSD-based systems.


    # Network File Systems


    There are six options available under the Network File Systems category. The first
    enables support for the Coda filesystem, an experimental filesystem that supports
    advanced features like caching of files.


    The next two options deal with network filesystem (NFS) support. The first enables
    direct support for the NFS filesystem and turns on support for the kernel client.
    This is the standard method of file sharing between Unix (and Unix-like) systems.
    Such support is generally good to have available. The second option enables support
    for the NFS server. This is new in the 2.2.x kernels. Using the new knfsd tools,
    the kernel does the work that was previously done with a user-space nfsd on earlier
    Linux systems. The knfsd tools are more robust, and much cleaner, because the
    user-space knfsd could not easily access information like node numbers, which
    are passed between the NFS server and client.


    The next two options set up support for Samba filesystems. The first enables SMB
    filesystem support. This option turns on support for the kernel SMB (LanManager/Samba/Windows
    NT). Mounted SMB shares appear as standard Unix-like filesystems. The second option
    enables the Samba-95 bug workaround. The one case where you should turn this option
    on for systems where the only SMB shares that will be mounted are on Windows-95
    systems.


