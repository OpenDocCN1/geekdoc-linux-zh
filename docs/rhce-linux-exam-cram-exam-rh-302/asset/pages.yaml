    # Getting To Know RPM


    Much like Linux, RPM didn''t just magically appear and work. It was developed
    over time, based on several other package-management projects. The first development
    of today''s RPM was found in RPP. RPP was actually used in the first Red Hat distributions.
    In fact, its first features are still the foundation for the purpose and features
    of RPM today. RPM is credited with being the initial source for the simple one-line
    commands to install and uninstall packages. RPM also introduced the scripts that
    are run before and after packages are installed and uninstalled. The initial query
    and verify features were also introduced with RPP. Unfortunately, the features
    available with RPP just were not enough.


    The need for more the Red Hat software developers to peer in on the projects for
    package management that the developers of BOGUS distribution were developing.
    The BOGUS developers, led by Rik Faith, were working on a project for package
    management PMS (Package Management System). The feature that RPM was lacking that
    PMS had mastered the concept of pristine sources. Pristine sources allowed the
    packager to release versions of software and to track the changes made to the
    previous version.


    Three more steps were taken before we had the RPM we all know and love today.
    Interestingly enough, Red Hat itself supported and/developed all three steps.
    The first step was when Faith and Doug Hoffman were contracted by Red Hat to produce
    PM, the new updated Package Manager that incorporated the features of RPP with
    the pristine source of PMS. Although PM''s functionality was close to that of
    the RPM we have today, it still lacked good database design and had no multiple
    architecture support. PM was never used in a commercially available product.


    Red Hat Marc Ewing and Erik Trojan completed the last two steps for developing
    RPM. The first of these two introduced the first version of the official RPM,
    which was developed in Perl. The last step rewrote RPM in the C development language
    to increase the program''s speed.


    # Installing, Uninstalling, and Upgrading With RPM


    The fundamental job of RPM is to add and remove components from your system. An
    rpm file is actually a type of compressed archive. Using the rpm tool, you can
    install, delete, and upgrade these RPM-archived packages.'
