    # Question 12


    Answer c is correct. To build a modularized kernel, the installed kernel-headers
    and kernel-source packages will be found in /usr/src/linux. Answer a, /usr/bin,
    contains system binaries, therefore it is incorrect. Answer b, /usr/bin/redhat,
    stores information for source RPMs, and therefore is incorrect. Answer d, /usr/local/,
