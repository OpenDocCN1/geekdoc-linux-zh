    # Routes


    There are two different types of routes that can be established with Linux TCP/IP
    routing—static and dynamic. Static routes are “hard-coded” routes that are assigned
    on a router. They will not change, regardless of there is a failure on a network
    or if an alternate route is available. This means that a static route is the only
    path from one host to another. The most popular static route on a Linux network
    is the route to the machine’s default gateway.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_313_0.png)


    Figure 11.2 Enable packet forwarding in netcfg.'
