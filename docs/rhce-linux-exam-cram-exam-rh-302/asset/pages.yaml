  md: '```

    other=/dev/hda2

    label=dos

    table=/dev/hda

    ```


    The first line (boot=/dev/hda) specifies the boot device and specifies where LILO
    is to be installed. In this case, it specifies to install LILO to the superblock
    of /dev/hda. If the first line had been


    ```

    boot=/dev/hda1

    ```


    it would have specified to install LILO to the first partition of the /dev/hda1
    partition. Likewise,


    ```

    boot=/dev/sda

    ```


    would have specified to install LILO to the superblock of the SCSI device.

    The second line specifies the path to the system map file. This line is indicated
    by the map=/boot/map. file contains the names and locations of the kernel or kernels
    to boot. The third line indicates the location of the boot sector. This is indicated
    by the install=/boot/boot.b.


    The rest of the /etc/lilo.conf file specifies settings and arguments that go into
    effect at the LILO: prompt. The delay option sets the amount of time you have
    to turn the Shift key at the LILO prompt (to interrupt the default boot process
    and specify any other options or boot operating systems). The timeout option is
    used to specify the amount of time that the system continues to boot by default
    if a key has been pressed but nothing was manually executed at the LILO: prompt.


    The next two lines are related to the /root directory. The root=/dev/hda3 specifies
    to mount the root directory on /dev/hda3. The read-only option specifies to mount
    the /root filesystem as read only, allowing you to check the /root filesystem
    with fsck. Red Hat Linux 6.0 systems specify the read-only option after each image
    entry in /etc/lilo.conf. You can specify read-only before the image entries, making
    it a global setting, which does not require you to set it for each entry.


    The last lines of code are grouped into sections to indicate the boot systems
    on the machine. The first two sections, named image, specify different Linux kernels
    that are installed and configured on the machine. The first line in each section
    indicates where the kernel image is located (for example: image=/boot/vmlinuz-2.2.5-15).
    The second line in each image section specifies the label that is to be associated
    with the kernel image (for example: label=linux).'
  merge: -1
