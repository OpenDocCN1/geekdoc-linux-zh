    # Configuring Extras With Linux Administration Tools


    Many system administrators enjoy being able to configure, reconfigure, or simply
    fix their extra settings and peripherals, including keyboards, the clock, a mouse,
    and sound cards. There are several administration tools available on Linux to
    do these tasks. Some of the most commonly used include kbconfig, timeconfig, mouseconfig,
    and sndconfig. Each of these configuration programs is run in console mode (this
    is also used during the installation process). In fact, kbconfig, timeconfig,
    and mouseconfig are actually used in the installation process!


    If you get a new type of keyboard, or are experimenting with keyboards in other
    languages, you may wish to use the kbdconfig tool. To invoke the kbdconfig tool,
    simply type "kbdconfig" at the root prompt. You are then prompted with a blue,
    red, and yellow screen that asks you to select what type of keyboard you have.
    When you have selected your keyboard, use the Tab key to select the OK button
    and then press Enter. It''s that simple.


    You can just easily adjust your time settings. To do so, use the timeconfig tool
    by typing "timeconfig" at the root prompt. You can then select what time zone
    you are in and Tab to select OK. This utility is a favorite for administrators
    amongst several time zones.


    To install a new mouse or trackball, use the mouseconfig tool. To do so, simply
    type "mouseconfig" at the root prompt. Choose your appropriate mouse from the
    list and use the Tab key to select OK when you are finished.


    A little more involved, albeit not much, is the sound configuration tool. To set
    up sound on your system, use the sndconfig tool by typing "sndconfig" at the root
    prompt. The first screen prompts you to autoprobe for PnP soundcards that can
    automatically be configured. If no card was automatically found, you are prompted
    to select your soundcard from a list. After you have the appropriate sound device
    selected, or detected, your system runs a few test sounds to verify that your
    card is working. If you hear the appropriate sounds, use the Tab key to select
    OK and you will then be finished.'
