- img_proc: true
  md: 'action "Turning on user and group quotas for root filesystem" / /sbin/quotaon
    /


    In addition to the script being started in the rc.sysinit file, you must have
    the quota options set in the /etc/fstab files. Editing the /etc/fstab files allows
    you to enforce the quota system on specific partitions. The following example
    shows how usquota and grpquota must be added to the /etc/fstab files to enable
    quotas on two partitions:


    | /dev/hda2 | ext2 | defaults | 1 1 |

    | /dev/hda7 | /home | ext2 | defaults.usquota,grpquota | 1 2 |

    | /dev/hda5 | /var | ext2 | defaults.grpquota | 1 2 |

    | /dev/hda6 | /var/spool | ext2 | defaults | 1 2 |


    From the example, you notice that the /home partition is usquota- and grpquota-enabled,
    the /var partition has only grpquota enabled.


    To set the quotas for specific users and groups, you would use edquota. Edquota
    is the quota editor. The edquota tool allows you to set up disk limits per user,
    using the quota.user file.


    > You can use a prototype to help set up user and group quotas by invoking the
    -p option with edquota.


    Red Hat Linux also offers a few utilities to help you manage your quota system:


    +   * /sbin/quota Running this as root turns on the quota system.

    * /sbin/quotaoff Running this disables the quota system.

    * /sbin/quotatats, /sbin/quotacheck, /usr/sbin/repquota Running these generates
    reports for quota systems.


