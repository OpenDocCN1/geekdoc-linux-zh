    # Daemons


    A daemon process is one whose parent process is process ID 1 (for example, the
    init process). Linux uses daemons to perform routine tasks, such as monitoring
    system resources.


    For a list of what daemons you are running, you can type "ps", which reports a
    process status. To see which daemons are being loaded at boot, you can type "ntysv".
    The daemons that are checked with an asterisk (*) are being loaded at boot. The
    init scripts for these daemons are located under /etc/rc.d/init.d/. You can use
    the init scripts to start, stop, or restart your daemons.


    Managing these daemons, as well as managing networking services, is simplified
    by using the ntysv process to select which daemons to start at boot. In addition,
    you can use inetd, the "Internet super-server" daemon. inetd uses /etc/inet.conf.
    This file contains list of networking services that are listening to connections
    on specific ports. A sample of an inetd.conf follow:


    # These are standard services.


    ```

    ftp stream tcp nowait root /usr/sbin/tcpd in.ftpd -l -a

    telnet stream tcp nowait root /usr/sbin/tcpd in.telnetd

    gopher stream tcp nowait root /usr/sbin/tcpd gn

    ```


    Services that aren''t to be simply commented out of the inetd.conf, as shown here:


    ```

    #cfinger stream tcp nowait root /usr/sbin/tcpd in.cfingerd

    ```


    The format of these lines uses stream versus dgram, the tcp versus udp, the wait
    versus nowait[.max], and the user[.group] program arguments.


