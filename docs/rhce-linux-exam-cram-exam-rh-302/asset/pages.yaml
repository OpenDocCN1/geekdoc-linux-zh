  md: '# Chapter 3


    vi uses different modes to assist you in editing files. When you open or create
    a file with vi (entering vi filename), you are in command mode. In command mode,
    single keys on your keyboard have special commands. For example, pressing "i",
    "a", or "o" drops you into insert mode. In insert mode, you can directly text
    into the file. To return to command mode, press the Esc key.


    In command mode, you can also quickly move around your document using the cursor
    keys, allowing you to keep your hands on the home row, and speeding your editing
    time. The j key acts as your down cursor and jumps a line. The k and l keys act
    as your left and right cursor keys, respectively. These movements are subject
    to quantity commands. For instance, 10j jumps your cursor down 10 lines, and 5l
    moves the cursor 5 characters. Other helpful movements are w (next word), G (end
    of file), $ (end of line), and 0 (beginning of line).


    Command mode also offers you the opportunity to save (write), abandon (without
    save), and exit. To enter these commands, you always begin by pressing the colon
    key (:) to enter command mode. Pressing :w + <Enter> writes your changes to the
    file. Pressing :wq + <Enter> will quit. In addition, you can use the exclamation
    point (!) to force the command you are using. The :w! sequence writes to a read-only
    file, and :q! quits without saving changes.


    Actual text editing uses both command and insert modes. To be efficient using
    vi, remember that you can combine all commands with quantity, movement, and other
    action to raise productivity and simplify editing.


    Table 3.2 shows some basic vi editing commands.


    > Remember that commands are case sensitive! Lowercase i may mean the cursor right
    one character, but capital L moves the cursor to the last position in the window!
    In addition, most are subject to movement and quantity commands.


    Here are some commands and their meanings:


    +   - w jumps a word.

    - dw Deletes a word.

    - cw Changes a word.

    - 10w Jumps 10 words.

    - 10W Jumps 10 words and ignores all punctuation.'
