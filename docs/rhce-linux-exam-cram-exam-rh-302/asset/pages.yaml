    \ entries for individual named files. The following is a sample /etc/named.conf\
    \ file:\n\n```\noptions {\n    directory \"/var/named\";\n};\n\nzone \"\" {\n\
    \    type hint;\n    file \"named.ca\"\n};\n\nzone \"1.168.192.in-addr.arpa\"\
    \ {\n    type master;\n    file \"db.1.168.192.in-addr.arpa\";\n};\n\nzone \"\
