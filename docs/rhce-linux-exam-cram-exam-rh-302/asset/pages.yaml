  md: "The objective of the RHCE program is to promote advanced skills amongst its\
    \ participants. Although one of the goals of Red Hat software is to package a\
    \ product that an average skilled Linux user can use easily, the goals for an\
    \ RHCE are set higher. An RHCE should be skilled not only in installation methods,\
    \ but in configuration methods as well. An RHCE should also be able to customize\
    \ all parts of the system—from the kernel to the bash shell. This chapter will\
    \ discuss many types of advanced configuration methods.\n\n# Understanding Quotas\n\
    \nQuotas are essential to system administrators who are administering the data,\
    \ Web servers, and on of many users. The quota system is much like setting up\
    \ a budget for how much disk space a user or group can use on a system.\n\nIn\
    \ order to use system quotas, your Red Hat Linux kernel must be configured to\
    \ use quotas. By default, the installed Red Hat Linux kernel already has quota\
    \ support compiled in; however, if you are using a custom or recompiled kernel,\
    \ you must ensure that quota support is compiled.\n\nOnce kernel support is compiled,\
    \ you need to see if the rpm is installed. To do so, enter `rpm -q quota`. If\
    \ installed from a Red Hat 6.0 system and the quota rpm is installed,\n\n```\n\
    quota-1.66-6\n```\n\nis returned to you. If you do not have the quota rpm installed,\
    \ you can either obtain the rpm files from your favorite Red Hat FTP site, or\
    \ install them from CD-ROM. To install, run\n\n```\nrpm -Uvh quota*\n```\n\nfrom\
    \ the directory that contains the quota rpm files.\n\nThe necessary quota files\
    \ are started in the startup script, located in /etc/rc.d/rc.sysinit. When executed,\
    \ the scripts look to see if the appropriate scripts are available and then runs\
    \ /sbin/quota to turn on quotas. Here are a few snippets of code from the rc.sysinit\
    \ script that is required to run quotas. This should be automatically placed in\
    \ your rc.sysinit file when installing the rpm:\n\n```\n# Update quotas if fsck\
    \ was on / /\nif [ X \"$RUN_QUOTACHECK\" = X1 -a -x /sbin/quotacheck ]; then\n\
    \    action \"Checking root filesystem quotas\" /sbin/quotacheck - v /\\nfi\n\
    if [ -x /sbin/quotaon ]; then\n```"
  merge: -1
