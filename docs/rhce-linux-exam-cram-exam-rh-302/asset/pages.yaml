  md: '/etc The location for the configuration files. More importantly, the /etc directory
    contains the system boot scripts. These boot scripts are located under the /etc/rc.d/
    directory. The services that run at bootup are under /etc/rc.d/init.d.


    It is rumoured that this method will be changing in upcoming versions of Red Hat
    Linux to reflect Debian''s locations for the boot scripts. Therefore, these files
    may be represented under /etc/init.d rather than /etc/rc.d. This is still different
    than other distributions and other commercial versions of Unix who place files
    under /sbin/init.d.


    +   * /sbin The location of some system configuration and system administrator
    executable files. Most of your general administration commands—as lifilo, fdisk,
    fcksk, and route—are located here.


    +   * /home The location of the home directories for your general users. Under
    /home, each user can set his own email, public_html, and personal files.


    +   * /lost+found The system''s directory for placing lost files that are found
    or created by disk errors or improper system shutdowns. At boot, programs as fsck
    the inodes, which have no directory entries and reattaches them as files in this
    directory. In addition to the root filesystem, there should be one of these directories
    located on every filesystem created on the system.


    +   * /mnt The default mount directory. Under /mnt, you mount your devices as
    cdrom and floppy disk.


    +   * /proc Your process directory. Under /proc, you will find information about
    running processes, as well as system configuration information such as interrupt
    usage, I/O port use, and CPU type.


    +   * /tmp A default directory created to house temporary files. This is a good
    directory to keep an eye on if you are trying to limit disk space.


    +   * /usr The location for subdirectories for local programs and executables
    for user and administrative commands. /usr contains the binaries for X, games,
    your shared libraries, and more.


    +   * /var The location for your spooling, logging, and other data (the “var”
    is short for various). Some common applications use /var for spooling and logging
    are mail, printing, and cron.'
