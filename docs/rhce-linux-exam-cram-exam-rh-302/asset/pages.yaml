    From CSvax:pur-ee:ineuxclix5clihnp4!houxm!mhuxi!eagle!mit-vax!mit-eddie!

    From: RMS%MIT-OZ@mit.net-eddie

    Newsgroups: net.unix-wizards.net.usoft

