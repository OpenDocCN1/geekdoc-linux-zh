  md: '# IRQ Settings


    Currently, the most popular card used in PC hardware today is PCI. Most Intel
    motherboards have both ISA and PCI slots available. The differences between ISA
    and PCI buses are the way they handle IRQ and input/output (I/O) addressing, and
    their data transfer speed. The ISA bus has settings, with IRQ and I/O, are hard-wired
    directly on the card. This arrangement does not allow the operating system to
    query the card itself, or change the settings without jumping the card itself.
    Plug-and-play ISA cards are an exception, and require special configuration tools.
    The ISA bus has these characteristics:


    +   - It is limited by the maximum clock setting of approximately 8MHz.


    +   - Its maximum data transfer rate is 8Mbps.


    +   - It is limited by the 16-bit width and 20-bit address width.


    The PCI, however, allows the BIOS to control IRQ and I/O addressing. The operating
    system can directly query the PCI bus, so the settings can be controlled from
    within the operating system. The PCI bus has these characteristics:


    +   - It is faster than the ISA bus, allowing for a maximum clock of 33MHz.


    +   - Its maximum data transfer rate is 132Mbps.


    +   - It has a 32-bit width and a 32-bit address width.


    Serial ports on Intel and Intel clone computers have standard I/O and IRQ settings.
    Table 4.1 lists the standard settings for serial ports.


    # Hard Disk Subsystems


    The two most common hard disk subsystems used in current Intel hardware are IDE
    and Small Computer Interconnect (SCSI). IDE drives have the controller located
    directly on the piece of hardware and use an IDE bus that is typically integrated
    on the motherboard. Most Intel motherboards have two IDE buses. Each bus supports
    one master and one slave drive, limiting the number of IDE devices to four.


    | Table 4.1 Standard serial ports. |

    | Linux Serial Port | DOS COM Port | I/O | IRQ |

    | tty0 | com 1 | 3F8 | 4 |

    | tty1 | com 2 | 2F8 | 3 |

    | tty2 | com 3 | 3E8 | 4 |

    | tty3 | com 4 | 2E8 | 3 |'
