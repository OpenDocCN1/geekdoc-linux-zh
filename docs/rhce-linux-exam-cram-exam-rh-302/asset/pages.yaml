    server, but a secondary DNS server as well. Therefore, the primary server is down,
    the secondary server will take over. For even more fail-over, a tertiary DNS server
    can be set up.


    Setting up secondary DNS for a domain is even more simple than setting up primary
    DNS. Essentially you only have to do Step 1 and 4 from the above example of setting
    up primary DNS. There is a difference, however, from step 1 above. The following
    steps explain how to set up secondary DNS.'
