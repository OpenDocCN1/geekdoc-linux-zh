  md: '# Introduction


    Welcome to the RHCE Linux Exam Cram!* This book aims to help you get ready to
    take—and pass—the Red Hat certification exam RHCE 300. Introduction explains Red
    Hat''s certification programs in general and talks about how the Exam Cram series
    can help you prepare for Red Hat''s certification exams.


    Exam Cram books help you understand and appreciate the subjects and materials
    you need to pass Red Hat certification exams. Exam Cram books are aimed strictly
    at test preparation and review. They do not teach you everything you need to know
    about a topic (such as the ins and outs of building your RPMs). Instead, I present
    and discuss the questions and problems I''ve found that you''re likely to encounter
    on a test. I''ve worked from Red Hat''s own training materials, preparation guides,
    and tests. My aim is to bring together as much information as possible about Red
    Hat certification exams.


    Nevertheless, to completely prepare yourself for any Red Hat test, I recommend
    that you begin by taking the Self-Assessment included in this book immediately
    following this Introduction. This tool will help you evaluate your knowledge base
    against the requirements for an RHCE under both ideal and real circumstances.


    Based on what you learn from that exercise, you might decide to begin your studies
    with some classroom training, or that you pick up and read one of the many Linux
    guides available from Red Hat or third-party vendors. We also strongly recommend
    that you install and configure the software and tools that you''ll be tested on,
    because beating hands-on experience and familiarity when it comes to understanding
    the questions you''re likely to encounter on a certification test. Book learning
    is essential, but hands-on experience is the best teacher of all! Especially because
    two-thirds of the exam is hands-on!'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'xvi Introduction


    # # The Red Hat Certified Engineer

    (RHCE) Program


    The RHCE exam is comprised of three separate parts. The three parts include:


    +   - Installation and Configuration Lab Exam


    +   - Debugging Lab Exam


    +   - Written Exam


    The three exams are taken on the same day and are each graded individually. The
    RHCE exam taker must receive a composite score of 20 percent on all three exams,
    with no single score dropping below 50 percent.


    The best place to keep tabs on the RHCE program and its various certifications
    is on the Red Hat Web site. The current URL for the RHCE program is located at
    http://www.redhat.com/products/training_exam.html. Red Hat Web site changes frequently,
    so if this URL does not work, try the Search tool on Red Hat’s site with either
    “RHCE” or the quoted phrase “Red Hat Certified Engineer” as the search string.
    This will help you find the latest and most accurate information about the company''s
    certification programs.


    # # Taking A Certification Exam


    Alas, testing is not free. Your exam day could cost $349 to $749 (depending if
    you participate in the training program, or take the exam-only approach). Currently,
    exams are administered by Red Hat itself (though training is now offered from
    Global Knowledge as well). To reach the RHCE team, contact (919) 547-0012, or
    email training@redhat.com.


    To schedule an exam, call at least 10 days in advance. Exam seats are limited,
    and are often booked two months in advance. To cancel or reschedule an exam, you
    must call at least 2 days before the scheduled test time, to receive any sort
    of refund. (For 2 days advanced, you are billed 80 percent; for 3 to 10 days advanced,
    you are billed 50 percent; and for more than 10 business days, you are given a
    full refund.) When calling Red Hat, please have the following information ready
    for the RH staffer who handles your call:


    +   - Your name, organization, and mailing address.


    +   - A method of payment. (The most convenient approach is to supply a valid
    credit card number with sufficient available credit. Otherwise, payments by check,
    money order, or purchase order may be received before a test can be scheduled.
    If the latter methods are required, ask your order taker for more details.)'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction xvii


    When you show up to a test, try to arrive 15 minutes before the scheduled time
    slot. You must bring and supply two forms of identification, one of which must
    be a photo ID.


    All exams are completely closed-book. In fact, you will be required to store anything
    you brought with under your desk. You will be furnished with a blank sheet of
    paper, pencil, and any other tools you may need for your exam. We suggest that
    you immediately write down on that sheet of paper all the information you''ve
    memorized for the test.


    When you complete a Red Hat certification exam component, you will report to your
    instructor, and either have him sign off on your lab exam, instructing you on
    the next step, or turn in your written exam and be excused for a break. All exam
    components are scored on a percentage basis.


    # How To Prepare For An Exam


    Preparing for any Linux exam requires that you obtain and study materials designed
    to provide comprehensive information about Red Hat Linux and the specific exam
    for which you are preparing. The following list of materials will help you study
    and prepare:


    +   - The Red Hat Linux 6.0 manuals (or online documentation found on Red Hat''s
    Web site)


    +   - The Linux Documentation Project (online resource found at http://metalab.unc.edu/LDP)


    In addition, you''ll probably find the following training courses useful in your
    quest for Windows Red Hat Linux expertise:


    +   - RHCE 300 Certification Training Red Hat Inc. (Durham, NC) offers an RHCE
    300 Certification course. The course is a week-long adventure and includes a full
    day of examinations. Current perks of the course include daily-catered lunches
    and all the soda and juice you can handle. You pay for it in the long run, however;
    the-long course (includes exam fee) is currently priced at $2,498.


    +   - Other Red Hat Inc. Training Red Hat Inc. offers additional courses to help
    you with learning Red Hat Linux. They include the RH033 (Introduction to Red Hat
    Linux I and II), RH133 (Red Hat Linux System Administration I and II), and RH253
    (Red Hat Linux Networking and Security Admin). Each class is a four day program,
    and prices range from $1,098 (RH033) to $2,198 (RH253).'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction


    +   - Global Knowledge, Inc has recently partnered with Global Knowledge to provide
    Red Hat Linux training services all over the world. For a list of classes (for
    the US) and prices, visit http://am.globalknowledge.com/authorized/redhatmail.html.


    I anticipate that you will find that this book will easily complement your studying
    and preparation for the exam, either on your own, or with the aid of the previously
    mentioned study programs. In the section that follows, I explain how this book
    works, and give you some good reasons why this book counts as a member of the
    required and recommended materials list.


    # About This Book


    Each topical Exam chapter follows a regular structure, along with graphical cues
    about important or useful information. Here''s the structure of a typical chapter:


    +   - Opening Hotlists Each chapter begins with a list of the terms, tools, and
    techniques that you must learn and understand before you can be fully conversant
    with that chapter''s subject matter. We follow the hotlists with one or two introductory
    paragraphs to set the stage for the rest of the chapter.


    +   - Topological Coverage After the opening hotlists, each chapter covers a series
    of at least four topics related to the chapter''s subject title. Throughout this
    section, we highlight topics or concepts likely to appear on a test using a special
    Exam Alert layout, like this:


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_21_0.png)


    > This is what an Exam Alert looks like. Normally, an Exam Alert stresses concepts,
