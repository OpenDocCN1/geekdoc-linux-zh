    may be required.


    Red Hat Linux also has a kernel configuration tool (kernelcfg) that is used in
    X to help configure kernel modules. To run this tool, simply type “kernelcfg”
    at the root prompt. The window lists the installed modules on your system.


    The kernel configurator lists the installed modules on your system. You can add
    or delete modules with the Add and Remove buttons located at the bottom of the
    window. In addition you can edit current modules to add any arguments you may
    require. The fourth button, Restart kernel, allows you to restart kernel on older
    Red Hat Linux systems. With kmod, this button is deprecated.


    # Kernel Configuration


    The files you need to boot a kernel are located in the /boot directory. These
    files include System.map, boot.b, boot.0300, initrd, and kernel boot images (typically
    named with < vmlinuz prefix>). The System.map file is a file that you use to debug
    the kernel. The boot.b file is the file that LILO creates; it is used in the second
    stage of LILO and is pointed from LILO in the master boot record. The boot.0300
    file is a backup of your master boot record that was created when you installed
    LILO. The initial ramdisk used to boot a system that uses SCSI during the boot
    process is called initrd. The vmlinuz files are the kernel boot images that are
    created during the kernel''s make process.


    Kernel source and documentation are located under the /usr/src/linux directory.
    Under this directory you will find a number of files and resources that you might
    find helpful when compiling or debugging your kernel. Some of these files include
    the CREDITS file, which gives credit to many of the contributors to the Linux
    kernel, as well as the Documentation directory, which contains many text text
    details about hardware, kernel files, and more. It also contains files that are
    required for compiling a kernel, such as Makefile


