  md: '# # example cron job


    ```

    01 2 3 4 5 $HOME/bin/daily.job

    ```


    Lines in the crontab file have six fields. The first field specifies the minute
    of the hour that the indicated executable is to run (0 through 59). The second
    specifies the hour of the day to be run (0 through 23). The third specifies the
    day of the month to be run (0 through 31). The fourth specifies the month of the
    year to be run (0 through 12). The fifth specifies the day of the week (0 through
    7). The final field specifies the program to be run.


    In addition to individual user crontabs, there is a system crontab. It is found
    in /etc/crontab. An example of a system crontab looks like this:


    ```

    SHELL=/bin/bash

    PATH=$bin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    ```


    ```

    # run-parts

    01 * * * root run-parts /etc/cron.hourly

    02 4 * * * run-parts /etc/cron.daily

    22 4 * * * run-parts /etc/cron.weekly

    42 4 1 * * run-parts /etc/cron.monthly

    ```


    With the default crontab setup, the crontab points to a directory in each line.
    When each line is run, every script in the directory is run. For instance, the
    first entry runs every script in /etc/cron.hourly at the first minute of every
    hour, and the second entry runs every script in /etc/cron.daily every day at 4:02
    A.M. The third entry runs every script in /etc/cron.weekly every Sunday at 4:22
    A.M., and the fourth entry runs every script in /etc/cron.monthly the first day
    of each month at 4:42 A.M.


