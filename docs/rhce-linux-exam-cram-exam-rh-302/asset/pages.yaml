    # Sample ipchains


    The following are sample ipchains rules and their explanations. The sample scenario
    is being set up on a router (192.168.0.254) controlling a network: 192.168.0.x


    +   - ipchains -P input -j REJECT This line will reject all incoming packets unless
    otherwise specified with an ALLOW in the input chain.


    +   - ipchains -A input -p icmp -j DENY This line will add a rule to the input
    chain that denies ICMP packets coming into the network.


    +   - ipchains -A output -p tcp -j ALLOW This line will add a rule to the output
    chain that ALLOWS all TCP packets to go out of the network.


    +   - ipchains -A input ~192.168.50.2 -j REJECT This line will add a rule to the
    input chain that REJECTS all packets from 192.168.50.2 to come into the network.


    # IP Masquerading


    IP masquerading is a specialized version of NAT (Network Address Translation),
    where all packets on a network are forwarded through a firewall and modified as
    if the packet originated from the firewall itself. IP masquerading relies on the
    firewalling and ipchains packages to be installed (explained in section in this
    chapter titled “Sample ipchains”).


    # Setting Up IP Masquerading


    In addition to the support for firewalling and the ipchains package installation,
    you must have specific options compiled (or modularized) into the Linux kernel.
    The four options required are as follows:


    +   - IP: transparent proxy support

    (CONFIG_IP_TRANSPARENT_PROXY)


    +   - IP: masquerading

    (CONFIG_IP_MASQUERADE)


    +   - IP: iportfw masq support

    (CONFIG_IP_MASQUERADE_MOD)


    +   - IP: iportfw masq support

    (EXPERIMENTAL)(CONFIG_IP_MASQUERADE_IPFW)


