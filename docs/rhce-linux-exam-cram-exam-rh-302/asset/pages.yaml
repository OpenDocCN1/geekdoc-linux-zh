    \ or power.\n\nIndividual programmers can contribute by writing a compatible duplicate\
    \ of some Unix utility and giving it to me. For most projects, such part-time\
    \ distributed work would be hard to coordinate; the independently-written parts\
    \ would not work together. But for the particular task of replacing Unix, this\
    \ problem is absent. Most interface specifications are fixed by Unix compatibility.\
    \ If each contribution works with the rest of Unix, it will probably work with\
    \ the rest of GNU.\n\nIf I get donations of money, I may be able to hire a few\
