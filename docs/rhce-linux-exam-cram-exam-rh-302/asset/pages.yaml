    # Building The Kernel


    After the kernel source is unpacked, change directories into the kernel source
    directory, and then run one of these commands: make config, make menuconfig, or
    make xconfig. The config target presents you with a list of options for the kernel
    in the form of questions. The menuconfig and xconfig targets are menu-driven interfaces
    for the configuration process, the former with a text interface and the latter
    with an X interface. The menuconfig and xconfig options are certainly easier than
    the simple config options, but they do not always work properly. The config is
    considered the standard way to configure the kernel because it has been available
    since the beginning of Linux kernel development.


    Assuming you choose the make config route, you are presented with a series of
    questions, for each of the kernel configuration options. The possible answers
    are generally "y" to turn on the item (or include the driver), "n" to turn off
    (skip the driver), "m" to make the driver as a kernel module, or ">" to get help
    on that option.


    After running make config, you must prepare to compile the source code using make
    dep, followed by make clean.


    Next, you need to compile your kernel. To compile, you have two options: make
    zImage and make bImage. As zImage limits the kernel to botting within the first
    640K of disk, we recommend using the make bImage to allow for larger kernels.
    With either of these commands, you can then manually add your kernel to LILO within
    the etc/lilo.conf and have the option to boot your old kernel, in case your new
    one doesn''t work properly.'
