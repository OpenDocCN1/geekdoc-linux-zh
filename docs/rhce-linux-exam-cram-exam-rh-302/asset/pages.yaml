  md: 'Another network device option is for dummy net driver support. Enabling this
    option allows you to include support for a “dummy” network interface. Traffic
    sent to this interface is simply discarded. This option is useful for keeping
    a permanent IP address associated with a system, even though its only “real” network
    interface is PPP or SLIP.


    A handy option located here is support for EQL (serial line load balancing). Enabling
    this option turns on for load balancing over PPP or SLIP interfaces. You can use
    this to configure multiple lower-speed serial links into a single higher-speed
    network interface. Note that the other end of the link must also support this
    protocol.


    The most needed option in this category is to enable Ethernet support. This option
    allows you to configure support for various Ethernet controllers. This includes
    support for both 10MB and 100MB controllers.


    Another device that you can enable is support for FDDI. Turning this option allows
    you to configure support for FDDI adapter cards. In addition to FDDI, there is
    an option to enable frame relay DLCI support. Turning on this option allows you
    to configure support for frame relay adapter cards.


    The next three options, PLIP, PPP, and SLIP, allow you to enable these types of
    network connections. Enabling PLIP support enables parallel port connections.
    This option turns on support for the Parallel Line Internet Protocol, which works
    over specially modified parallel cables. Enabling PPP support enables point-to-point
    connections. This option turns on support for the PPP protocol, which is most
    commonly used to do networking over serial links such as modems. Enabling the
    SLIP support enables serial line connections. This option turns on support for
    SLIP, a protocol that pre-dates PPP and is used to network over serial links.
    PPP is a more robust protocol, so you generally won’t need SLIP support. Turning
    the SLIP option allows you to configure various SLIP drivers.


    One of the final options in this category is to enable token ring driver support.
    Turning this option allows you to include support for few token ring adapter cards
    in the kernel. Token ring is an old, slow, and expensive local area system that
    IBM developed and heavily pushed years ago. It is still commonly found in large
    IBM-centric organizations.


    # Amateur Radio Support


    One of the shorter categories, are options in your kernel configuration for amateur
    radio support. Turning on this option allows you to configure support for networking
    over amateur radio. You should enable this only if you plan to work with radio
    networking.'
