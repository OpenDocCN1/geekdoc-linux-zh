  md: '# Chapter 1


    Exam taking is not something that most people anticipate eagerly, no matter how
    well prepared they may be. In most cases, familiarity helps ameliorate anxiety.
    In plain English, this means you won''t be as nervous when you take your fourth
    or fifth Red Hat certification as you''ll be when you take your first one. Granted,
    every certification exam—whether it is a Red Hat exam, a Calder exam, or another
    certification program—will be different, the overall process for preparation will
    be very similar and you will become comfortable with each experience.


    Whether it''s your first exam or your tenth, understanding the details of exam
    taking (how much time to spend on questions, the environment you''ll be in, and
    so on) and the exam software will help you concentrate on the material rather
    than on the setting. Likewise, mastering a few basic exam-taking skills should
    help you recognize—and perhaps outfox—some of the tricks and gotchas you''re bound
    to find in some of the exam questions.


    This chapter, besides explaining the exam environment and software, describes
    some proven exam-taking strategies that you should be able to use for your advantage.


    # Assessing Exam-Readiness


    Before you take your Red Hat exam, we strongly recommend that you read through
    and take the Self-Assessment included with this book (it just appears before this
    chapter, in fact). This will help you compare your knowledge base to the requirements
    for obtaining an RHCE, and it will also help you identify parts of your background
    or experience that may be in need of improvement, enhancement, or further learning.
    If you get the right set of basics under your belt, obtaining Red Hat certification
    will be that much easier.


    Once you''ve gone through the Self-Assessment, you can remedy those topical areas
    where your background or experience may not measure up to an ideal certification
    candidate. You can also take subject matter for individual tests at the same time,
    so you can continue making progress while you''re catch-ing in some areas.


    Once you''ve worked through an Exam Cram, read the supplementary materials, completed
    the tasks, and take the practice test, you''ll have a pretty clear idea of when
    you should be ready to take the real exam. We strongly recommend that you keep
    practicing until your scores top the 80 percent mark; 85 percent would be a good
    goal to give yourself some margin for error in a exam situation (where stress
    will play more of a role than when you practice). Once you hit that point, you
    should be ready to go. But if you get through the practice exam in this book without
    attaining that score, you should keep taking'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Red Hat Certification Exams 3


    practice tests and studying the materials until you get there. You''ll find more
    information about other practice test vendors in the Self-Assessment, along with
    even more pointers on how to study and prepare. But now, on to the exam!


    # The Exam Situation


    When you arrive at the testing center where you scheduled your exam, or Red Hat''s
    training facility itself, you''ll need to sign in with an exam coordinator. He
    or she may ask you to show two forms of identification, one of which must be a
    photo ID. After you''ve signed in you will be escorted to your testing station
    and you will be asked to deposit any books, bags, or other items you brought with
    you. Typically, the room will be furnished with anywhere from half a dozen to
    a dozen computers.


    You''ll be furnished with a pen and pencil and a blank sheet of paper. You''re
    allowed to write down any information you want on both sides of this sheet. Before
    the exam, you should memorize as of the material that appears on The Cram Sheet
    (inside the front cover of this book) as so you can write that information on
    the blank sheet as soon as you are seated in the computer. You can refer to your
    rendition of The Cram Sheet anytime during the test. Keep in mind, however, that
    most of the RHCE exams are performance-based, and not multiple choice. This means
    that you will be facing time constraints that you have to balance between your
    physical system, task coordination, and more. So use your time wisely.


    The exam situation will be manned at all times by the instructor or exam coordinator
    to monitor the test takers, and give instructions when necessary. In addition,
    the instructor is available as a last resort for help. Please note, asking the
    instructor for help does impact your score by a very large percentage (as much
    as 25 percent for one question!). If you are running out of time and can''t get
    a specific portion of the exam, you may opt to take the point reduction to complete
    the exam. Depending on which part of the exam you begin, the instructor will have
    preloaded or prepared the appropriate Red Hat certification exam set up. You''ll
    be testing with a number of other students, and will be asked to start at the
    same time.


    All Red Hat certification exams allow a maximum amount of time in which to complete
    your work. The RHCE 300 Exam consists of three sections. The sections are presented
    in random order, meaning that one time they may present the written exam first,
    and another the Debugging Lab, make sure you are very prepared before entering
    the exam area. You may not be able to take advantage of the breaks in between
    exams to prepare for the next one. The exam comprises two performance based'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 1


    sections and one written section. The performance based debugging section is allotted
    three hours. The performance based installation and configuration section is allotted
    two hours. The written element is given one hour.


    Red Hat certification exams are performance based. Although this may sound quite
    simple, the exam comprises three elements, two of which are hands on. You are
    given a task assignment for each section, as well as a non-disclosure agreement
    stating you won''t disclose the information and questions on the exam. With the
    debugging element, you will be asked to fix a system with a problem that the instructor
    has set up. There are two tasks to this element, with individual goals assigned
    to each task. You are graded for each goal in each task you reach.


    The installation and configuration element of the exam is also hands on. It also
    provides you with a task list of multiple scenarios, goals, and system processes
    to set up on an uninstalled, unconfigured machine.


    The least stressful part of the exam is the written element, comprised of 50 multiple
    choice questions. Do not let the simplicity of a multiple choice exam fool you.
    You might be asked to select the best or most effective solution to a problem
    from a range of choices, all of which technically are correct. In addition, you
    can almost guarantee that you will be presented with questions that were not made
    in any preparation material, or even to those individual who participate in the
    RHCE 300 preparation course! Taking the exam is quite an adventure, and it involves
    real thinking, skill, and time management. This book shows you what to expect
    and how to deal with the potential problems, puzzles, and predicaments.


    # Exam Layout And Design


    For the multiple choice exam, questions are typically structured with a question,
    and four or five options. The written exam is expected to change continuously
    (to provide the ultimate testing experience to fully the taker), so you never
    know when you''re going to get a curve ball. To get comfortable with all types
    of questions, we''ve thrown in some differently-formatted question types in our
    end-of-chapter questions (the “Practice Questions” section in each chapter). For
    example, in this book, you''ll have to answer questions that have multiple correct
    answers, such as “What are three video configuration tools used on Red Hat 6.0?”


    # Exam-Taking Basics


    The most important advice about taking any exam is this: Read each question carefully.
    Some questions are deliberately ambiguous, some use double negatives,'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Red Hat Certification Exams 5


    and others use terminology in incredibly precise ways. The author has taken numerous
    exams—both practice and live—and in nearly one she missed at least one question
    because she didn''t read it closely or carefully enough.


    Here are some suggestions on how to deal with the tendency to jump to an answer
    too quickly:


    +   - Make sure you read every word in the question. If you find yourself jumping
    ahead impatiently, go back and start over.


    +   - As you read, try to restate the question in your own terms. If you can do
    this, you should be able to pick the correct answer(s) much more easily.


    +   - When returning to a question after your initial read-through, read every
    word again—otherwise, your mind can fall quickly into a rut. Sometimes-visiting
    a question after turning your attention elsewhere lets you see something new,
    but the strange tendency is to see what you''ve seen before. Try to avoid that
    tendency at all costs.


    +   - If you return to a question more than twice, try to articulate to yourself
    what you don''t understand about the question, or what appears to be missing.
    If you chew on the subject for awhile, your subconscious might provide the details
    that are lacking or you might notice a “trick” that will point to the right answer.


    Above all, try to deal with each question by thinking through what you know about
    Red Hat Linux and Linux in general—the characteristics, behaviors, facts, and
    figures involved. By reviewing what you know (and what you''ve written down on
    your information sheet), you''ll often recall or understand things sufficiently
    to determine the answer to the question.


    # Question-Handling Strategies


    Based on exams the authors have taken, some interesting trends have become apparent.
    For the multiple choice element, questions taking only a single answer, usually
    two or three of the answers will be obviously incorrect, and two of the answers
    will be plausible—of course, only one can be correct. Unless the answer leaps
    out at you (if it does, reread the question to look for a trick; sometimes-times
    those are the ones you''re most likely to get wrong), begin the process of answering
    by eliminating those that are obviously wrong.


    Things to look for in obviously wrong answers include spurious choices or utility
    names, nonexistent software options, and terminology you''ve never seen. If you''ve
    done your homework for an exam, no valid information should be completely new
    to you. In that case, unfamiliar or bizarre terminology indicates a totally bogus
    answer.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 1


    Numerous questions assume that the default behavior of a particular utility is
    in effect. If you know the defaults and understand what they mean, this knowledge
    will help you cut through many Gordian knots.


    Budget your time by making sure youve completed one-quarter of the questions one-quarter
    of the way through the exam period (or the first 12 or 13 questions in the first
    14 or 15 minutes) and three-quarters of three-quarters of the way through (36
    or 37 questions in the first 45 to 47 minutes).


    If youre not finished when 55 minutes have elapsed, use the last 5 minutes to
    guess your way through the remaining questions. Remember, guessing is potentially
    more valuable than answering, because blank answers are always wrong, but a guess
    may turn out to be right. If you dont a clue about any of the remaining questions,
    pick answers at random, or choose all a’s, b’s, and so on. The important thing
    is to submit an exam for scoring that has an answer for every question.


    # Mastering The Inner Game


    In the final analysis, knowledge breeds confidence, and confidence breeds success.
    If you study the materials in this book carefully and review all exam prep questions
    at the end of each chapter, you should become aware of those areas where additional
    learning and study are required.


    Next, follow up by reading some or all of the materials recommended in the “Need
    To Know More?” section at the end of each chapter. In addition, check out some
    of the resources listed in Chapter 4. The idea is to become familiar enough with
    the concepts and situations you find in the sample questions that you can reason
    your way through similar situations on a real exam. If you know the material,
    you have every right to be confident that you can pass the exam.


    After youve worked your way through the book, take the practice written exam in
    Chapter 14. This will provide a reality check and help you identify areas you
    need to study. Make sure you follow up and review materials related to the questions
    you miss on the practice exam before scheduling a real exam. Only when youve covered
    all the ground and feel comfortable with the whole scope of the practice exam
    should you take a real one.


    If you take the practice written exam and dont score at least 85 percent correct,
    you’ll want to practice further.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_37_0.png)'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Red Hat Certification Exams


    Armed with the information in this book and with the determination to augment
    your knowledge, you should be able to pass the certification exam. However, you
    need to work at it, or you will spend the exam fee more than once before you finally
    pass. If you prepare seriously, you should do well. Good luck!


    # Additional Resources


    A good source of information about Red Hat certification exams comes from Red
    Hat itself. Because its products and technologies—and the exams change frequently,
    the best place to go for exam-related information is online.


    If you haven''t already visited the Red Hat Certified Engineer site, do so right
    now. The RHCE home page resides at www.redhat.com/products/training.html (see
    Figure 1.1).


    > Note: This page might not be there by the time you read this, or it might have
    been replaced by something new and different, because things change regularly
    on the Red Hat site.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_38_0.png)


    Figure 1.1 The Red Hat Certified Engineer home page.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'The options on the home page''s menu point to the most important sources of
    information in the RHCE pages. Check out the Certification Choices entry to read
    about the various certification and training programs that Red Hat offers.


    These are just the high points of what''s available in the Red Hat certification
    and training pages. You will browse through them—and we strongly recommend that
    you do—you''ll probably find other information tidbits mentioned elsewhere that
    are every bit as interesting and compelling.


    # Coping With Change The Web


    Sooner or later, all the information we''ve shared with you about the Red Hat
    Certified Engineer and training pages and the other Web-based resources mentioned
    throughout the rest of this book will go stale or be replaced by newer information.
    In some cases, the URLs you find might lead you to their replacements; in other
    cases, the URLs will go nowhere, leaving you with the dreaded "404 File not found"
    error message. When that happens, don''t give up.


    There''s always a way to find what you want on the Web if you''re willing to invest
    some time and energy. Most large or complex Web sites—and Red Hat''s qualifies
    on both counts—offer a search engine. Looking back at Figure 1.1, you can see
    that a Search button appears above the top of the page. As long as you can get
    to Red Hat''s site (it should stay at www.redhat.com for a long while yet), you
    can use this tool to help find what you need.


    The more focused you can make a search request, the more likely the results will
    include information you can use. For example, you can search for the string "training
    and certification" to produce a lot of data about the subject in general, but
    if you''re looking for the installation guide for Red Hat 6.0" you''ll be more
    likely to get there quickly if you use a search string similar to the following:


    Installation Guide Red Hat 6.0


    Finally, feel free to use general search tools—such as www.google.com, www.search.com,
    www.altavista.com, and www.excite.com—to search for related information. The bottom
    line is this: If you can''t find something where the book says it lives, intensify
    your search.'
