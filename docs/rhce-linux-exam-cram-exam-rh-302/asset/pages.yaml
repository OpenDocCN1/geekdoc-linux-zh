    # Shadow Passwords


    Shadow passwords have several purposes. First, the password field of /etc/passwd
    is removed (replaced by an “x”). The file /etc/shadow then contains the password
    hash. The permissions on the shadow file makes it unreadable by anyone but root
    (and, on some distributions, the “shadow” group). This makes it more difficult
    to extract password hashes to run through crack or any other similar password
    guessing programs. The shadow file also contains password aging information.


    A system can be converted to shadow passwords by running the pwconv program. If
    needed, it can later be converted back using pwconv. The change should be transparent
    to all programs that use PAM (discussed in Chapter 1). Password aging can be controlled
    with the chage program.


    # tcp_wrappers


    The use of tcp_wrappers on your system allows you to perform specific actions
    when another machine attempts to connect, or actually connects, to your. With
    the use of the /etc/hosts.allow and /etc/hosts.deny configuration files, you can
    determine who can and cannot connect to your machine or who cannot use specific
    services. The use of tcp_wrappers can only affect services that are controlled
    by inetd (as previously discussed in the section on inetd).


    When a connection request is sent from another machine to your machine, inetd
    first checks if that service is enabled and all permissions are set properly.
    If so, inetd then passes the request to tcp_wrappers. Next, tcp_wrappers checks
    the /etc/hosts.allow file to see if permission is granted specifically for requested
    user. If tcp_wrappers finds that the specific user is granted access to the service,
    the connection is granted. If no setting in /etc/hosts.allow is specified, then
    tcp_wrappers checks the /etc/hosts.deny file. If tcp_wrappers finds that the specific
    service has been denied to that user, the connection is refused. However, if no
    setting in /etc/hosts.deny specifies that that service to the requested user is
    denied, the connection is granted.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# System Security And Administration 279


    # /etc/hosts


    The /etc/hosts.allow file is the first file that tcp-wrappers checks for allowed
    connections to specific services by specific users. If a service or user is specifically
    granted access in /etc/hosts.allow, the /etc/hosts.deny file is ignored.


    In the /etc/hosts.allow file, permission is granted to either a specific service
    or all services. The service setting is then granted to individual IP blocks,
    ranges, domains, or to all. The entries in /etc/hosts.allow file are set by service:granted_to
    where service specifies the name of the services and granted_to specifies whom
    (or what location) has permission to use the service.


    # Specifying Services


    When specifying a service to provide access to, you have the option of specifying
    the particular service, such as ftpd, or to specify all services. To specify a
    particular service, you will use the syntax in.service, where service is the service
    to be specified. To specify all services, you will use the syntax ALL.


    To grant a specific services, such as ftpd, to everyone on your local 192.168.x.x
    network, you would have an entry in /etc/hosts.allow file that looked like this:
    in.ftpd:192.168.0.0/192.168.255.255. With this entry, tcp-wrappers will allow
    access to the ftp daemon that is connecting from any IP between 192.168.0.0 through
    192.168.255.255.


    To grant all services to everyone on your local 192.168.x.x network, you would
    have an entry in your /etc/hosts.allow file that looked like this: ALL: 192.168.0.0/192.168.255.255.
    With this entry, tcp-wrappers will allow access to all services granted by inetd
    that are connecting from any IP between 192.168.0.0 through 192.168.255.255.


    # Specifying User Access


    When granting access to a service to a user, you have the option of specifying
    a specific domain, an IP, range of IPs, or all. In addition, you can use an EXCEPT
    argument that allows you to specify specific domains and IPs to not grant access
    to.


    To specify all services to a specific domain as redhat.com, you would use the
    following entry: ALL: .redhat.com. With this entry, any user from redhat.com can
    access all services on your machine. To specify an additional domain, such as
    coriolis, you would use the following: ALL: .redhat.com, .coriolis.


    To specify permission to all services to a specific IP such as 192.168.0.1, you
    would use the following: ALL: 192.168.0.1. With this entry, only users from


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_310_0.png)'
