  md: "# Advanced Installation 153\n\nTo create a kickstart boot floppy, you first\
    \ need to create the boot floppy with the appropriate boot image. When you use\
    \ a CD-ROM, you create the boot image with the boot.img file. For network installations,\
    \ use the bootnet.img files. To create the boot disk, you use the dd command on\
    \ Linux (as described in Chapter 5). Next, you must create your kickstart configuration\
    \ file named ks.cfg by running mkkickstart on the machine prototype that you want\
    \ to clone. Write the output of mkkkickstart to the file ks.cfg by typing “mkkkickstart>ks.cfg”.\
    \ Finally, copy the ks.cfg file to your boot floppy.\n\n# Question 4\n\n+   What\
    \ are the %post entries in the ks.cfg file used for?\n a. Logging entries\n b.\
    \ Scripts run during installation\n c. Configuration options\nd. None of the above\n\
    \nAnswer d is correct. The %post entries are scripts or commands that are run\
    \ after the installation. Although these scripts may indicate logging, or configuration\
    \ options, they can be set up only with the scripts that are run there.\n\n# Question\
    \ 5\n\nHow do you force kickstart to prompt you for information during an installation?\
    \ Why would you want to do this?\n\nTo force kickstart to prompt you for an answer\
    \ or setting during installation, simply do not provide the setting in the ks.cfg\
    \ file. This is helpful if you want to specify IP addresses without using a DHCP\
    \ server, or if peripherals such as video or mouse differ on various machines."
