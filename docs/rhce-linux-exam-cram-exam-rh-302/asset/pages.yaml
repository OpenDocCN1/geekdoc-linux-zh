  md: '# Chapter 4


    SCSI devices use a controller that is separate from the drive itself. These controllers
    run on SCSI cards (also called SCSI adapters) and are connected to the computer
    through the ISA or PCI slots. SCSI devices are not limited to master and slave
    drives as IDE devices. SCSI devices are limited only by the number of devices
    the SCSI card supports. Typical cards can support anywhere from 7 through 30 devices;
    however, higher-quality cards are reported to support over 100 devices! Performance
    factors differentiate the qualities of IDE and SCSI devices. Typical SCSI devices
    can transfer data from a range of 10Mbps through 80Mbps, whereas typical IDE devices
    are limited to a range of 8Mbps through 33Mbps. Both systems'' speed rates depend
    on the device and controller card.


    # Disk Partitioning


    Another must for understanding Linux and its basics is hard drive partitioning.
    Partitioning, which we briefly looked at in Chapter 2, is a mechanism to segment
    a single physical disk into multiple logical disks. These logical disks appear
    as a contiguous section of physical blocks.


    An entire hard disk not have to be partitioned completely. You can save the remaining
    space for future allocation, or use it as a gap to allow for resizing partitions.


    > Moving and resizing partitions is tricky, and can easily corrupt your filesystem.
    Before altering your partition table, always back up your data!


    The number of partitions created on a drive is typically set by the particular
    machine''s needs. Separate partitions are suggested for separate operating systems
    to use, and in Linux''s case, for Linux Swap. However, you should opt to assign
    separate partitions for mounting separate filesystems, as as /home, /var, /log,
    and /root for large-disk installations or active workstations.


    # Printing


    Linux uses the printer spooling systems that were originally developed for BSD
    (Berkeley Systems Distribution) Unix. Linux can maintain multiple printers at
    multiple sites as well as multiple print queues. Some basic printing commands
    you will use include lpr, lpq, iprm, lpd, and ipc, described in Table 4.2.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Red Hat Advanced Prerequisites


    | Table 4.2 Basic printing commands.

    | Command | Description |

    | --- | --- |

    | lpr | Adds jobs to the print queue |

    | lpq | Lists jobs currently in print queues |

    | lprm | Removes jobs from the print queue |

    | lpd | Is the daemon that sends data from the spool to the printer |

    | lpc | Is the administrative interface for printing |


    To add a printer to your system via direct parallel connection, first ensure the
    printer is physically connected properly. Make sure that the lpd server is started
    at boot-time (by running ntsysv). Edit /etc/printcap, and add an entry for the
    new printer. Create your spooling directory on mkdir /var/spool/ncwcps. Make sure
    your print spool''s permissions are set to 755 (we will go into more detail on
    permissions later in this chapter). Create the printer''s accounting file with
    the touch command. You can then start the printer in its queue using the lpc command,
    as shown here:


    ```

    #touch /var/adm/lp_acct/ps3

    #chown daemon /var/adm/lp_acct/ps3

    #chmod 755 /var/adm/lp_acct/ps3

    #lpc up ps3

    ```


    The spooling system on Linux also can print to remote printers. To add a remote
    printer, simply edit /etc/printcap, adding lines similar to those in the following:


    ```

    #remote printer setup

    remlp|print on remote printer:\n  :lp=::rm=remote:rp=lp2:sd=/var/spool/remlp

    ```


    > > Note: The above /etc/printcap entry has no references to the details of the
    printer itself. This is because the host will manage the job after it''s sent.


    This entry sets up the remote printer named remlp. Not specifying the lp-field
    tells us that this entry is for a remote printer. The rm field points us to the
    destination system (here, we''ve named it "remote"). The rp field holds the name
    of the target printer. The sd field selects the spool directory the printer will
    use.'
  merge: -1
