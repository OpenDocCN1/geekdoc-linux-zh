  md: '# Joystick Support


    Joysticks are typically connected to the standard PC game port. Enabling the joystick
    support option allows you to configure support for joysticks on the standard PC
    game port as well as support for many newer digital joysticks.


    # Ftape


    Ftape is the floppy tape device. Enabling the Ftape (QIC-80/Travan) support option
    allows you to configure kernel support for various tape drives that use the standard
    PC floppy disk interface.


    # Filesystem Support


    The filesystem support category for kernel configuration currently contains options
    for about 14 filesystem types and options. One of the first is quota support.
    Enabling this option turns on support for user and group quotas (usage limits)
    on filesystems.


    Another option is for kernel automounter support. This option turns on kernel
    support for a daemon that can be used to automatically mount both local and remote
    filesystems. This option can be extremely convenient, especially on desktop systems.


    One of the first options for types of filesystems is the experimental support
    option for the read-only ADFS filesystem support. There are also options for the
    Amiga FFS filesystem support and the experimental Macintosh filesystem support.
    These options allow you to configure support for the native filesystems by Acorn
    RISOS, AmigaOS, and macOS, respectively.


    To read DOS- and Windows-style FAT filesystems from Linux, you must have support
    for these filesystems. Enabling the DOS fs support option allows you to configure
    support for DOS- and Windows-style FAT filesystems.


    The standard filesystem used on CD-ROMs is the ISO9660 filesystem. To enable support
    for this system, you must answer yes to the ISO 9660 CD-ROM filesystem support
    option.


    Some additional options for foreign filesystem support include the Minix fs support
    option, read-only NTFS filesystem support, and read-only OS/2 HPFS filesystem
    support. These options turn on support for the native filesystems of Minix (which
    was also once the native Linux filesystem), Windows NT, and OS/2, respectively.


    The /proc filesystem support options turns on support for the /proc filesystem.
    An option that comes after this, /dev/pts filesystem for Unix98 PTYs, turns on
    support for the devpts virtual filesystem. This filesystem is used to create'
