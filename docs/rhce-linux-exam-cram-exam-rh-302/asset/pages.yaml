    # Unpacking The Kernel Source


    Once you have the kernel source tar file, you need to unpack it. The canonical
    location for the kernel source is /usr/src/linux, and many programs expect the
    kernel source to be. (For example, /usr/include/linux is a symbolic link to /usr/src/linux/include/linux).
    To keep track of what kernel versions you have installed, it is best to create
    a directory for the called /usr/src/linux-x.y.z (where x.y.z is the version number),
    and make /usr/src/linux a symbolic link to that directory. For example, to prepare
    to unpack the Linux 2.2.5 kernel source, use the commands shown here:


    ```

    cd /usr/src

    mkdir linux-2.2.5

    rm -f linux

    ln -s linux-2.2.5 linux

    ```


    > Note: This example assumes that /usr/linux either does not exist or a symbolic
    link. If it is a directory, you should move it to somewhere like /usr/src/linux.old.


    Then, to install the sources, execute

    bzip2 -cd linux-2.2.5.tar.bz2 | tar -xvf -


    for the bzip2-compressed version, or

    gzip -cd linux-2.2.5.tar.gz | tar xvf -


    for the gzip-compressed version. With GNU tar, which is the default tar up on
