    # Partition Schemes


    In setting up partitions for filesystems or operating systems, you must dedicate
    a partition to Linux Swap. The Linux Swap partition is used as virtual random
    access memory (RAM), which is typically set anywhere from 32-through128MB, depending
    on the amount of installed RAM in the system and the size of your hard drive;
    however, the size is limited to 2GB. After you select the partitions for your
    drive and set them to be the proper partition types, the Red Hat installation
    formats the swap space and then separate the partitions. The following is an example
    of a partitioning scheme for a Red Hat Linux server:


    +   - 300MB / (root) (this size may vary)

    - 16MB /boot

    - 300 through 700MB /usr

    - 512MB /home (minimum)


