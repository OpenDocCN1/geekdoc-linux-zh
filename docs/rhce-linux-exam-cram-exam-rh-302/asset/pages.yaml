  md: '# 222 Chapter 10


    The largest portion of the RHCE 300 exams centers on setting up Red Hat Linux
    networking services. The reason for such focus is that the the greatest percentage
    of Red Hat Linux machines are installed to be used as either a client or a server
    on a network. Networking support is the strongest feature and most common use
    of Linux. To not only successful on the RHCE 300 exam, but also successful as
    an RHCE, you must be comfortable with installing, configuring, and using many
    Linux networking services. In this chapter, we will discuss Apache, email, Domain
    Name Services (DNS), File Transfer Protocol (FTP), Network File Systems (NFS),
    Samba (SMB), the Dynamic Host Configuration Protocol (DHCP), time services, and
    the Squid server.


    # Apache


    Apache is the world''s most popular Hypertext Transport Protocol (HTTP) in the
    world, running on more than 55 percent of the world''s Web servers. Apache was
    based originally on the most popular Web server in 1995, NCSA''s httpd 1.3. As
    the first version of Apache was simply different patches applied to NCSA''s httpd,
    Apache was often referred to as a “patchy server,” is how Apache got its name
    (A+Patch). In this section, we will discuss how to set up Apache, and how to set
    up virtual Apache hosts.


    # Setting Up Apache


    Red Hat Linux 6.0 is shipped with Apache 1.3. You can install it either during
    the installation of Red Hat Linux, or by installing the RPM file apache-1.3.6-7.i386.rpm
    which is located on your Red Hat Linux 6.0 CD in the /RedHat/RPM directory.


    The installation of Apache places all the appropriate configuration files in the
    /etc/httpd/conf/ directory. There are three main configuration files found in
    the /etc/httpd/conf/ directory. They include access.conf, httpd.conf, and srm.conf.


    # access.conf


    The access.conf file is the global access configuration file, which defines and
    when services are allowed to execute. Listing 10.1 is a sample access.conf file,
    with a majority of the comments removed from the code.


    # Listing 10.1 The access.conf file.


    ```

    ##

    ## access.conf -- Apache HTTP server configuration file

    ##

    <Directory />

    ```'
