  md: '# Routes


    Routes are specific paths set up for packet information to travel from the source
    to its destination. Routes can be established three ways via static, dynamic,
    and default routes.


    Static routes are used for small to medium-sized networks. These networks tend
    to be very simple because they do not have really redundant paths to destinations.
    Static routes are established by issuing route commands at boot-time.


    Dynamic routes differ from static routes; with dynamic routes, the optimal path
    to destinations is determined as requested, and then updated as necessary. Dynamic
    routing is typically used by either the routed or gated daemon.


    Default routes are established between your immediate host and its host, between
    the host''s host and its host, and so. For instance, if a packet''s destination
    is 204.248.89.7, and the internal router''s routing table entries include 192.168.0.1
    and 92.168.1.0, then the packet is sent to the default route (typically 0.0.0.0).
    The default route is gateway, which redirects the packet to the router''s host.
    If the host router doesn''t have the 204.248.89.x routing table entry, the packet
    is forwarded to the host''s host and so on. Each of these exchanges is called
    a hop. After 30 hops, if the packet hasn''t reached its destination, it dies.
    This scenario is called a ttl-exceed.


    # Networking Services


    After working with networks for an extended period of time, you will become familiar
    with a variety of networking services. Some of these popular services include
    network filesystem (NFS), sendmail, POP3 and IMAP, File Transfer Protocol (FTP),
    DNS, Dynamic Host Control Protocol (DHCP), Samba, the Hyper Text Transport Protocol
    Daemon (HTTPD), NIS, and inetd.


    # NFS


    NFS allows systems that physically reside on one computer system to be used by
    other computers on the network. These connections appear as simply a local disk
    to remote users. NFS configuration files can be found in /etc/fstab and /etc/exports.
    NFS uses several daemons to handle its services. These services are started at
    boot-time in the /etc/rc.d/init.d/nfs scripts.


    Some of these services include:


    +   - nfsd Handles filesystem exporting and file access requests from remote systems.
    This daemon runs multiple times as more remote systems use the services.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 4


    +   - biod Performs NFS block I/O operations for client processes.

    - rpc.mountd Handles mount requests from remote computers.

    - rpc.lockd Manages file locking for both client and server systems.

    - rpc.statd Handles crash and recovery services for both client and server systems.

    - portmap Facilitates the initial connection between local and remote servers.


    # sendmail


    This is the most popular mail program used as a mail transport agent (MTA). It
    does the physical sending and receiving of user and system email. You use sendmail
    in conjunction with a mail delivery agent (MDA) and a mail user agent (MUA). The
    MDA receives the incoming mail from sendmail and delivers to the appropriate user.
    A typical Red Hat install uses procmail as the MDA for sendmail. Some other commonly
    used MDAs include localmail and deliver. After the MDA has delivered the mail,
    the user uses an SUA to retrieve it. Some popular Unix MUAs include pine, elm,
    mut, and mailx. Going the other direction, a user uses his SUA (pine) to send
    mail directly to the MTA (sendmail).


    # POP3 And IMAP


    POP3 and IMAP are protocols that allow a user to retrieve her mail from the server
    to her mail reader. POP3 pulls mail from the mail spool one message at a time
    to a local spool. The user can then opt to delete all the messages on the mail
    spool, or leave them there. IMAP, however, reads the messages directly from the
    spool, without copying the messages to the local spool. The user can then change,
    delete, and create folders, and so forth on her local mail reader. When she does
    so, the changes are automatically applied to her mail spool.


    # FTP


    FTP is used to transfer files between systems over a network. To connect to a
    system via FTP, the user must either supply a valid username and password, or
    the system must be able to accept anonymous users.


    # DNS


    DNS is used to translate between domain names, such as redhat.com to IP addresses,
    such as 199.183.24.134. DNS is registered with InterNIC.'
