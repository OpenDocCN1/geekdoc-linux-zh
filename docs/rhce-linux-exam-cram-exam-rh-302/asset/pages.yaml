    # xf86config


    The xf86config program is a text-based configuration tool that is used to configure
    the XF86Config file. To invoke xf86config, "xf86config" at a root prompt.


    With the xf86config tool, you are prompted to configure your mouse, keyboard,
    and monitor settings with a text-based prompt method. Each of the options prompts
    you with a list of available numbered options for selection, or for a yes or no
    answer. The xf86config tool is the least used for configuring the X Window system.
    Figure 9.4 shows an example of the xf86config tool interface.


    # X Client


    An X client is the software that sends requests to the X server. The response
    from the X server is then displayed on the X client. An X client can be either
    the software on the same machine as the X server, or on a remote host. We will
    discuss the remote X applications later in this chapter.


    A special type of X client is the desktop client. The desktop client actually
    controls the title bar, task bar, and other features of a window are handled.


    The standard X desktop is made up of many services and programs, which vary depending
    on what window manager or environment you use. However, several standard terms
    and applications apply. When using an X client, you should be aware of the following
    terms and their differences:


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_238_0.png)


    Figure 9.4 The xf86config interface.'
