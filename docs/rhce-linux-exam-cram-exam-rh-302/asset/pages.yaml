    # Setting Up A User’s crontable


    Setting up a cronfile for a user is a little more complex than setting up root’s
    crontab. A user can create her own crontab file with the crontab -e command, which
    drops the user into edit mode. The user’s cronfile is created in /var/spool/cron/username.
    The user’s crontab is created with a similar layout as /etc/cron, but rather than
    the scripts being split into directories, they are listed directly in the file,
    configuring individual time settings, and so on. In the cronfile, you can enter
    lines that look like this:


    ```

    #Description of Job to be run and when

    * * * * /path/to/script

    ```


    Typically, it is good practice to add comments to each line for each job you run
    so that you can remember what job is running and when. You don’t want to manually
    looking up the script each time. The five asterisks (*) at the beginning of each
    script line are the fields for setting when the script is to run. If the field
    isn’t set, the field has an asterisk. The first field indicates what minute of
    hour the script should run. Valid settings for this field are 0 (or 00) through
    59. If the fields read 22 *****, the script runs on the 22nd minute of every hour.


    The second field specifies the hour of the day. Valid settings for this field
    are 0 through 23. If the fields read 00 12***, the script runs every 12th hour
    at the zero minute of every day.


    The third field indicates the day of month. Valid settings for this field are
    0 through 31. If the fields read 0 0 1**,, the script runs the first day of every
    month at the zero hour and zero minute.


    The fourth field specifies the month of the year. Valid settings for this field
    are 1 through 12. In addition, you can use names of the month (such as jan, feb,
    mar, and so on) here. If the fields read 0 0 1 3*, the job runs the first day
    of the third month of every year at the zero hour and zero minute.'
  merge: -1
