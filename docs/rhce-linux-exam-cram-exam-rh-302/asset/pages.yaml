- img_proc: true
  md: '# Installation And Configuration


    The root of one of the two portions of the RHCE 300 exam is the installation and
    configuration of a networked Red Hat Linux system. Topics at hand will cover everything
    from the base Red Hat Linux installation to software configuration (as we will
    cover in the next section). Until you get started, you won''t be sure what is
    available for you, how you''ll have to install the system, and what (if any) documentation
    will be available. In addition, the installation and configuration portion of
    the performance-based exam is limited. By default, you are given only two hours
    to perform the system installation and configure whatever options (hardware, software,
    and so on) are specified.


    # What You Can Expect


    When you go in for the exam portion on installation and configuration, simply
    feel prepared. Feel confident that you can successfully achieve all the primary
    goals of each section in this book. Don''t walk in expecting any surprises or
    extenuating circumstances in this exam.


    On the exam, you will be presented with all (if any) tools you may use for your
    installation. What types of tools could you be presented with? You may have items
    available, including scratch paper, writing utensils, floppy disks, CD-ROMs, network
    information, server information, and more.


    You will then be given your list of objectives. Nope, you can''t start yet! Once
    everyone in the class has received their objectives, you will be asked to turn
    over the objective packet to fill out the first information. The first sheet of
    the packet is for you to fill out your name and other basic personal information
    and such, and you will fill out the time start (provided by the instructor). In
    addition, you will be asked to sign a non-disclosure agreement stating you will
    not share the contents of your exam.


    When you are finished with the exam, you are asked to place your objectives sheet
    upside down on your desk and check with your instructor before leaving the exam
    room. The instructor will then check and how you completed your objectives, by
    sitting at your machine and testing each one.


    # How To Handle It


    Your installation and configuration exam objectives will be very straightforward.
    Remember, don''t expect anything tricky for this part of the exam. When your instructor
    signals for you to begin, follow these steps:'
  merge: -1
