  md: 'In addition to standard Red Hat Linux installation, several other installation
    methods and options are available. These options allow to boot multiple operating
    systems, or even automate the install. You may even need to install a system that
    is to be headless, without a monitor and keyboard. Your typical Red Hat Linux
    user probably does not even know most of these options exist. However, becoming
    an RHCE means that you know about them and that you can set up and configure them
    properly.


    # # Dual Booting Linux


    Administrators often like to dual boot their systems. This means that the administrator
    installs more than one operating system and then chooses which to run.


    Note: Currently, running more than one operating system simultaneously is possible
    only by using software packages such as VMware.


    You can set up your machine to give you the option of which OS you want to run
    at boot-time. In this section, we''ll discuss setting up your machine with the
    option to boot either Linux or Microsoft Windows.


    # # Disk Partitioning


    To dual boot your machine between Linux and Windows, you must create separate
    partitions on your hard drive for each operating system. It is typically best
    to create at least four partitions for this—or more, if you decide to create separate
    partitions for the /home, /var, and other directories on your Linux filesystem.


    The four primary partitions are for Linux /boot, for Windows, and for Linux Swap.
    Creating the first (50MB or fewer) partition for /boot allows the system to more
    easily boot properly. This is especially useful on large disks with more than
    1024 sectors, or disks that require LBA mode. The following is an example of a
    partition table on a system with four partitions:


    ```

    Disk /dev/hda: 240 heads, 63 sectors, 839 cylinders

    Units = 15120 * 512 bytes

    ```


    | Device Boot | Start | End | Blocks | Id System |

    |---|---|---|---|---|-|

    | /dev/hda1 | | 7 | 52888+ | 83 Linux |

    | /dev/hda2 * | 8 | 75 | 514080 | b Win95 FAT32 |

    | /dev/hda3 | | 76 | 813 | 557920 | 83 Linux |

    | /dev/hda4 | | 814 | 839 | 196560 | 82 Linux swap |'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Advanced Installation 145


    The first is a boot partition for Linux. It is a Linux Native-type partition and
    is mounted to /boot. The second is a DOS partition, which is used for an installation
    of Windows 98. The third and fourth partitions are also for Linux. The third is
    the root partition, which is a Linux Native-type partition and mounted to /. The
    fourth is a Linux Swap-type partition and is not mounted to any filesystem.


    Sometimes, you may wish to dual boot a system after you already have an initial
    operating system, such as Windows, installed. To dual the Windows system with
    Linux, you must resize or shrink your current Windows partition. One helpful commercial
    program allows you to do so is Partition Magic by Power Quest. It is a DOS program
    that can resize many types of partitions safely without destroying data. As of
    Partition Magic''s version 4, you can also resize partitions. After you resize
    a partition, you can then restart your computer into the Linux installation, and
    create a Linux partition with the newly free space.


    # Installing Both Operating Systems


    Setting up a dual boot system from scratch is much easier to configure properly,
    and will most likely have fewer errors. By default, you should always install
    your alternate (not Linux) operating system first. Doing so allows you to set
    up the Linux bootloader to boot both operating systems during installation. In
    addition, some other operating systems format the entire disk during their default
    installations. By installing the non-Linux operating system first, you eliminate
    the risk of the other operating system deleting your Linux installation.


    If you use the other operating system to partition your disk, simply leave the
    unpartitioned space available for Linux. Red Hat Linux can format and partition
    the unallocated space during installation. Some administrators find it helpful
    to partially begin the Red Hat Linux install before installing the guest operating
    system. By this, you can start the Red Hat Linux installation to the point where
    you format the drive and then stop the Red Hat Linux install to install the guest
    operating system. You can then use Disk Druid (discussed in Chapter 5) or fdisk
    (discussed in Chapters 3 and 5) during the Red Hat Linux installation to set up
    all your partitions. Make sure to create your DOS or guest operating system partition
    and set it to the appropriate type (for Windows, this is b). You can then write
    the partition table and when it begins the next step of the Red Hat Linux installation,
    you can reboot your system and begin your guest operating system installation.


    # Boot Managers


    Several boot managers can boot Linux as well as manage other operating systems
    to boot on the same system. Some of the popular ones include:'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Chapter 7


    +   LILO Discussed in Chapters 3 and 5, and short for Linux Loader, this is the
    default bootloader used with Linux. Red Hat Linux, as well as most Linux vendors,
    recommends that you use it as your default boot manager.


    +   System Commander This is a commercial product that you can purchase from a
    local software vendor.


    +   SysLinu This executes the Linux boot from a DOS filesystem.


    If you decide not to use LILO as your boot manager, you still need LILO to manage
    your Linux boot. You decide where to install LILO based on the default boot manager
    you decide to use. If you are using LILO, choose to install LILO in the master
    record (MBR) on your system. If you choose to use another boot manager, such as
    System Commander, install LILO to the first partition of the /boot partition.


    # Using LILO


    If you are using LILO as your boot manager, you can select the operating system
    to boot during the installation process. After your system performs its BIOS checks
    and detection, see the LILO: prompt. If you leave this prompt alone, whatever
    operating system is chosen as default boot boots.


    To interrupt the automatic process and specify which operating system to boot,
    hit the Shift key as soon as you see the LILO: prompt. To see what boot options
    are available, hit Tab. You can then specify which operating system to boot, as
    well as any options that you may require. These options—as well as the default
    boot operating system, the delay of the LILO: prompt, and more—are specified in
    the /etc/lilo.conf file. The following is an example of an /etc/lilo.conf file
    that is dualed with Red Hat Linux 6.0 and Windows 98:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    #prompt

    delay=20

    timeout=2400

    root=/dev/hda3

    read-only

    image=/boot/vmlinuz-2.2.10

    label=2.2.10

    vga=0x0317

    image=/boot/vmlinuz-2.2.5

    label=linux

    ```'
  merge: -1
