  md: '# 182 Chapter 8


    is supported by the GNU C library version 2.1 and higher. It is used by default
    in Red Hat 6.0 and higher.


    If you plan to connect a parallel printer to the system, you must enable parallel
    printer support. In addition, there is an option to enable printer read-back.
    It turns on support for status read read-back from printers. When this option
    is turned on, you get status information about the printer when you execute cat
    /dev/lp0 (or whatever the printer device is).


    If you plan to connect a mouse with an interface other than serial, such as PS/2,
    you must enable the mouse support option in this category. Turning this option
    allows you to configure support for various non-serial mouse interfaces, such
    as the PS/2 interface found on most systems.


    Some older systems use an old style QIC-02 tape drive. To enable support for this
    type of tape drive, you must turn on the QIC-02 tape support option.


    Another option in this category is to enable watchdog timer support. Doing so
    allows you to configure support for watchdog device, which is used to monitor
    system health by triggering a reboot if the device is not written to in a certain
    period of time. The idea is that a process''s only job is to occasionally write
    to this device, and that process fails, something bad must have happened to the
    system. The watchdog device can be driven entirely by software that may not be
    reliable if the system has crashed. It can also be tied to special hardware-monitoring
    cards. Most administrators not use this option.


    To be able to read and write to a PC''s CMOS, you must enable /dev/nvram support.
    This option turns on support for reading and writing a system''s non-volatile
    RAM (NVRAM) area. On PCs, this is usually called the CMOS. This can be used, for
    example, to store a small amount of information that will persist over reboots.
    Doing so can be very dangerous, though, because overwriting the NVRAM on a system
    will probably make it unbootable. Most administrators dont enable this option.


    The last option in this category is for enhanced real-time clock support. This
    option turns on extended support for the real-time clock chip on most systems.
    This is generally handy to have available, and it is required for synchronization
    on SMP systems.


    # Video For Linux


    The category for video for Linux is a bit misleading. This category is not for
    video display support, such as X support, but for additional video option. Enabling
    support for video for Linux allows you to configure support for various video
    capture cards, TV tuner cards, and FM radio cards.'
