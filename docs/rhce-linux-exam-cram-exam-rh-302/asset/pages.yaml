  md: '# Introduction


    The bulk of the book follows this chapter structure lavishly, but there are a
    few other elements that we''d like to point out. Chapters 12, 13, and 14 represent
    what you should expect for the three elements of the RHCE 300 exam. Chapter 12
    discusses objectives and elements involved during the Installation and Configuration
    Lab exam. Chapter 13 discusses methods for handling the Debugging Lab. Chapter
    13 includes a sample test that provides a good review of the material presented
    throughout the book to ensure you''re ready for the exam. Chapter 14 is an answer
    key for the sample test that appears in Chapter 13. You''ll notice that no answer
    key is provided for the exams that appear in Chapters 12 and 13. This is because
    performance-based exams test your ability to accomplish a specific task, not necessarily
    how you accomplish it. There is no specific right or wrong, yes or no answer.
    Additionally, you''ll find a glossary that explains terms and an index that you
    can use to track down terms as they appear in the text.


    Finally, the tear-out Cram Sheet attached to the inside front cover of this Exam
    Cram represents a condensed and compiled collection of facts, figures, and tips
    that we think you should memorize before taking the test. Because you can dump
    this information out of your head onto a piece of paper before answering any exam
    questions, you can master this information by brute force—you only need to remember
    it long enough to write it down when you walk into the test room. You might even
    want to look at it in the car or in the lobby of the testing center before you
    walk in to take the test.


    # How To Use This Book


    If you''re prepping for a first-test time, I''ve structured the topics in this
    book to build on one another. Therefore, some topics in later chapters make more
    sense after you''ve read earlier chapters. That''s why I suggest you read this
    book from front to back for your initial test preparation. If you need to brush
    up on a topic or you have to use the index or table of contents to go straight
    to the topics and questions that you need to study. Beyond the tests, I think
    you will find this useful as a tightly focused reference to some of the most important
    aspects of Red Hat Linux and networking services.


    Given all the book''s elements and its specialized focus, I''ve tried to create
    a tool that will help you prepare for—and pass—Red Hat’s “Red Hat Certified Engineer”
    exam. Please share your feedback on the book with me, especially if you have ideas
