  md: '# 102 Chapter 5


    After selecting all the packages you plan to install on the system, you will be
    notified if there are any package dependency requirements that need to be met.
    This means that if you select one package that requires another package to run
    appropriately and you didn''t select the required package, you are notified and
    prompted to install the dependency requirements. Once all the dependency requirements
    are, Red Hat begins the physical install process. It creates the physical filesystem
    on the drive you are installing to, checks to see that you have adequate disk
    space, and finally begins installing the chosen packages. In addition, Red Hat
    6.0 automatically detects the type of CPU you have installed, and optimizes the
    installed kernel. The autodetected types of CPUs include Pentium Pro, PII/III,
    and AMD''s K5 and K6. All other CPUs are set up with the default 386 settings.


    +   During the installation process, you can view install messages and other information
    on the first five virtual consoles. Pressing Alt+F1 displays the installer. Pressing
    Alt+F2 presents a bash shell. Pressing Alt+F3 displays an Installer log. Pressing
    Alt+F4 shows all of your kernel messages. Pressing Alt+F5 displays the standard
    output of mke2fs.


