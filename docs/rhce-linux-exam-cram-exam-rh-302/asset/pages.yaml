    192.168.0.1 can access all services on the machine. To specify an additional IP

    such as 192.168.0.100, you would use the following: ALL: 192.168.0.1,

    192.168.0.100. To specify a range of IPs, such as 192.168.0.1 through

    192.168.0.100, you would use ALL: 192.168.0.1/192.168.0.100.


    To specify permission to all services to users, you would use ALL: ALL.

    You can specify EXCEPT cases with any of the previously mentioned arrange-

    ments. For instance, ALL EXCEPT LOCAL would grant everyone

    access, except users on your local connection. In addition, ALL: EX-

