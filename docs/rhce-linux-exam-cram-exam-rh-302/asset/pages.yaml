    eth0—Ethernet device name.


    ethernet—The Dominant LAN hardware protocol.


    ext2—Mount type associated with Linux filesystems.


    FDDI—A networking hardware layer that uses fiber optic cable as the physical media.


    fdisk—The program that is used to manage partitions on a disk.


    filesystem—Refers to the on-disk structures that store information such as properties
