  md: '# DNS (Domain Name Service)


    clear—Tool used to clear all text from xterm or console.


    clone—Machine configured with exact hardware and software configuration as another
    machine.


    COFF (Common Object File Format)—The binary format used by some Unix systems,
    also used in a modified form by Windows NT, and introduced in Unix System V Release
    3. Linux supports COFF executables of some systems, but does not use the format
    natively.


    compile—To convert the source code of a program to machine code.


    conf.modules—The file in /etc with configuration information for loadable kernel
    modules.


    control-panel—Red Hat menu used to configure Red Hat networking, users, and printing.


    CPU—Central processing unit.


    crackers—Term used to identify people who attempt to succeed at breaking into
    computer systems unlawfully.


    crontab—The file or files that specify commands to be run by cron at certain times.
    Also the command used to manipulate those files.


    daemon—A program which runs in the background, whose parent process is init. Usually
    daemons provide some kind of system services.


    device—A block or character special file that generally points to a piece of hardware.


    DHCP (Dynamic Host Configuration Protocol)—A superset of bootstrap is used to
    assign IP addresses to clients on a network. DHCP is used for dynamic hosts that
    can move, connect, and disconnect from networks.


    dig—Tool used to query name server for domain packet information.


    disk druid—Graphical tool used to format and partition hard-drive during Red Hat
    installation.


    distribution—A collection of software built into a complete system. Examples of
    Linux distributions include Red Hat, Caldera OpenLinux, SuSE Linux, Debian GNU/Linux,
    Stampede, and Slackware.


    DNS (Domain Name Service)—The protocol used to resolve domain names to IP addresses.'
