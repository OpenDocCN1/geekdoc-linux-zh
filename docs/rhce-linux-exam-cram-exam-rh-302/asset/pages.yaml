  md: '# Advanced Configuration 185


    The final option in this category is for NCP filesystem support. This is used
    to mount NetWare volumes. Enabling this option turns on support for NetWare client
    support in the kernel. Mounted NetWare volumes appear as standard Unix-like filesystems.


    # Partition Types


    You can enable five partition types in the kernel. These options turn on support
    for various partition table formats that various operating systems use. The first
    option is for BSD disklabel support, which enables support for BSD-style partition
    tables. The second option is for Macintosh map support. This is used on the Macintosh
    platform. The third option is for SMD disklabel support, which enables support
    for Sun partition tables. The fourth option is for support of the x86 Solaris
    partition table. The last option is the experimental support for Unixware slices.
    By default, Linux uses the DOS-style partition table.


    # Native Language Support


    If you run on FAT support, or support for the Microsoft Joliet extension ISO9660,
    you are prompted for support for NLS, which is used to support the various character
    sets used around the world. These character sets are labeled by codepage and their
    appropriate number, such as codepage 437, which is the United States, Canada character
    set. Approximately 27 character sets, ranging from United States to Turkish to
    Russian, are available.


    # Console Drivers


    The four options under the Console Drivers category allow to enable options for
    your Linux console. The first is the VGA text console support option. This option
    turns on support for the standard PC-style VGA text console. You should almost
    always turn this on for x86 systems.


    The second is the video mode selection option. It includes support in the kernel
    for switching VGA text modes using the BIOS boots into protected mode (and can
    longer use the BIOS). To use this option, you must boot the kernel with the "vga"
    option.


    The third option is support for the dual-headed MDA text console. Enabling this
    new experimental option allows you to run with an old Hercules monochrome adapter
    and monitor on your system. This can be very handy for keeping something like
    the log displayed on a second display at all times.


    The final option in this category is new: support for frame buffer devices. This
    option turns on support for frame buffer console devices, which are used primarily'
