  md: '# The Debugging Exam


    As we discussed in Chapter 12, the majority of the RHCE 300 Exam is performance
    based. Whereas the installation and configuration exam is graded by completing
    objectives and specific goals as specified in your objectives sheet, the debugging
    exam is different—you are not presented with an exact list of what to do. Instead,
    you are presented with an end goal (of what needs to work) and have to work your
    way through a number of (unspecified) problems to get to your end goal.


    There are a great deal of things to manage when taking a performance based examination
    such as the debugging element. Not only do you need to be fluent with the skills
    at hand, but you too need to manage your time well, know where to go when the
    going gets tough, and know what to do when things are not going well.


    This hands-on portion of the RHCE 300 focuses on the troubleshooting of Red Hat
    Linux. In this chapter, we will discuss methods, planning, and skills relating
    to the debugging of Red Hat Linux.


    The second performance-based exam involves debugging Red Hat Linux. Preparing
    for this section of the exam is difficult as you cannot be sure what element of
    Red Hat Linux will be broken, you won''t be sure exactly what tools you will have
    to fix the problems, and under no circumstances can you simply re-install the
    broken component (or system). The debugging portion of the RHCE 300 exam allows
    you three hours (total) to fix two separate debugging issues.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# What To Expect


    When you go to take your debugging element of the exam, remain calm. debugging
    skills work best when you have a clear mind. The biggest mistake people make during
    the debugging element is to worry about what will be broken on the system and
    being stressed about the exam before taking it. Do not make any presumptions about
    what you can or cannot do for the exam.


    When you enter the examination room, you will be seated at your machine and asked
    to stow away tools, books, or other materials you brought with you. You will then
    be presented with any tools you are allowed to use during the exam. As with the
    installation and configuration exam, you will be issued an objectives sheet, and
    when instructed to do so, will turn over and sign the non-disclosure agreement
    on the front page. When permitted, you can open the objectives hand-out and start
    the exam.


    When you are finished with the first objective, you will be asked to document
    what the problem was and how you fixed it. The instructor will then come to your
    machine, sign off on your objectives sheet, verify that you did or not fix the
    problem, and send you off for a quick break while he (or she) prepares your system
    for the next debugging objective.


    # How To Handle It


    After opening your objectives sheet, you will be given an end objective. A sample
    of an end result objective could be something similar to “establish a networking
    connection from the workstation to the server using DHCP.”This may sound simple,
    but the machine has been “pre-broken” to not simply configure this task. The machine
    may first boot properly, and second have something configured improperly in networking
    that doesn''t allow a simple configuration for DHCP (or it might not).


    Regardless of what your objectives be or what part of your system will be broken,
    there are several steps that could help you determine your problem and recover
    your system. Following these steps in order should help you successfully find
    the problem and give you the opportunity to fix it as necessary. Not all of the
    following steps will be required each time you troubleshoot a machine (in real
    life or on the exam):


    +   1. Boot your machine. See what happens, what errors do you get, and where
    the system seems broken. Do you know where the error is? Can you fix the machine
    as is? If not, perhaps you need to boot the system into single user mode and fix
    the problem. You may need to use system rescue disks.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# The Debugging Exam 301


    2. Obtain (2 floppy) rescue disk set.


    This set is created from your system and a rescue image from the Red Hat 6.0 CD-ROM.
    (You will either create these disks from your installation and configuration exam
    or they have made available to you your instructor.)


    Use mkbootdisk for the first disk, which creates a boot disk for your system (for
    emergencies, to boot without LILO, and such). To create your boot-disk, type mkbootdisk
    image where image is the image of your bootable kernel located in /boot.


    Use the rescue.img image from the Red Hat 6.0 CD-ROM for the second rescue disk.
    Type:


    ```

    dd if=/mnt/cdrom/images/rescue.img of=/dev/fd0

    ```


    +   3. Boot your machine. If you can fix your problem by booting from single user
    mode, type linux single at the BIOS, and proceed to the next step. Otherwise,
    check the system to see that it is set to boot from floppy disk as its first option.
    Then, boot with the first of the two-disk rescue set (the mkbootdisk). When prompted,
    provide the rescue disk (created from rescue.img).


    > When booting via the system rescue disks, you do not have vi or emacs available.
    You may use pico (pico -w) to edit any necessary files.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_332_0.png)


    +   4. Do you need to check your filesystem? First, use fdisk -l to print your
    partition table. Verify what you believe to be the filesystem partitions. Once
    you have decided which is your root filesystem (will likely be the largest one),
    you can use fsck to check the filesystem. If (/root) is /dev/hda4, use fsck /dev/hda4.


    +   5. Do you need to check a second extended filesystem? If so, use fdisk -l
    to verify your second extended filesystem may be. Once you have decided which
    filesystem you want to check, you can use e2fsck to check the second extended
    filesystem. If perhaps /dev/hda4 is your second extended filesystem, use e2fsck
    -y /dev/hda4.


    Note: The "y" option used in the above e2fsck option is used to specify the answering
    of "yes" to any prompts. The e2fsck program prompts several times for various
    options such as "check this filesystem," "fix this error," and so forth, which
    should all be answered "yes".'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Chapter 13


    6. Do you need to mount your filesystems? (If you booted via the rescue disks,
    then yes, you do.) You can mount your filesystems as mount. First verify your
    partition table using fdisk -l. You must mount your devices in a specific order.


    First, mount your root (/) partition. Then, mount any other filesystems under
    your root (/) partition. First create a mount directory to mount your filesystems.
    For instance, if you wanted to mount root (/) and /boot, create a directory called
    /mnt/harddrive (for root), and /mnt/harddrive/boot (/boot). You must mount your
    filesystems. If /dev/hda4 is your root (/) partition and /dev/hda2 is your partition
    on the system, then first mount root (mount/dev/hda4/mnt/harddrive), and then
    mount /boot (mount/dev/hda2/mnt/harddrive).


    7. Regardless of boot method (single or with rescue disks), you will then need
    to make any appropriate changes to your system to fix whatever problem is (if
    the problem was something other than a corrupt filesystem, which is most likely
    the case for the RHCE 300).


    8. Did you have to change LILO.O? If you did, you have to rerun lilo to save the
    changes to your system. Simply run /sbin/lilo if you are in single user mode.
    If you are in rescue boot mode, you will have to use lilo -r to specify where
    your root filesystem is (since you mounted it to /mnt/harddrive). To use lilo
    on the separated filesystem use /mnt/harddrive/sbin/lilo -r/mnt/harddrive.


    9. Have you made changes to the disk? If so, then you need to sync your disk to
    ensure that system buffers (changes you made) are written to the hard disk. To
    do this, use sync. From the prompt run sync. You may wish to run this another
    time or to be absolutely positive of all your system buffers flushed and written
    to the disk.


    10. Are you ready to reboot? Well, if you are in single user mode, go for it.
    If you are in rescue mode, you have to your mounted filesystem. You have to do
    this in a specific order as well. Whereas when you mounted them, unmount root
    (/) first, when you unmount them, you have to unmount root (/) last. To unmount
    the /boot partition (from these examples), use umount /mnt/harddrive/boot. Next
    unmount the root (/) partition using umount/mnt/harddrive.


    11. Now remove all disks (if necessary) and exit from the system. Power the system
    off, and try out the repaired system.


    Does your system boot properly now? Good. You may not be through, however-ever.
    Your objective sheet may list something in particular (such as networking,'
  merge: -1
  pgno: 333
