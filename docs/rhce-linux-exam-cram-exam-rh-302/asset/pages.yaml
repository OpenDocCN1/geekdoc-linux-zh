  md: '# Virtual Host configuration steps:


    a. SetVirtualHost(NameVirtualHost

    192.168.0.1)


    b. SetVirtualHost (<VirtualHost 192.168.0.1>)


    c. SetDocumentRoot


    d. SetServer


    e. SetErrorLog


    f. SetTransferLog


    g. CloseVirtualHost (<VirtualHost>)


    h. Restart httpd (/etc/rc.init/d/dhcpd restart)


    c. Start DHCP (/etc/rc.init/d/dhcpd start)


    d. Verify DHCP service (/usr/bin/dhcpd -)


    e. Configure /etc/dhcpdconf


    # INETD


    17. To enable or disable network services

    controlled by inetd, edit /etc/inetd.conf.


    # TCP WRAPPERS


    18. Only controls access to services managed by inetd.


    19. To specify access rules:


    +   * /etc/hosts

    * /etc/hosts.deny


    # ROUTING


    20. Tools


    +   * route

    * netstat

    * netcfg


    # IPCHAINS


    21. Default chains:


    +   * input Controls incoming connections

    * output Controls outgoing connections

    * forwarding Forwards connections


    # DEBUGGING


    22. Here''s how to debug your machine:

    a. Boot your machine. Can you fix the machine

    is needed? Boot the system into single

    mode? Need to use rescue disks.

    b. Obtain (2 floppy) rescue disk set. (rescue.img)

    c. Boot machine with floppy (or into linux single

    as needed)

    dd. Check your filesystem. (fsck)

    e. Check extended filesystems. (e2fs -y)

    f. Mount your systems. (mount)

    g. First mount your root partition. Then mount any

    other filesystems using your root (/)

    (mount /dev/hda1/mnt/harddrive)

    h. Fix the problem.

    i. Check to see if you need to restart LILO (lilo,

    or l -r)

    j. Sync any manually moved filesystems. (sync)

    k. Unmount any manually moved filesystems.

    (umount)

    l. Remove floppies, CD''s and so on, and

    reboot. (ctrl + alt + delete)


    # EMAIL


    11. Three components to enable:


    +   * MTA Mail Transfer Agent (Sendmail)

    * MDA Mail Delivery Agent (Procmail)

    * MUA Mail User Agent (Pine, Elm, Mutt, Netscape)


    # DNS/BIND


    12. Steps to configure a domain:


    +   a. Set up zone in /etc/named.conf

    b. Set up forward zone file (db.example.com)

    c. Set up reverse zone file (0.168.192.inet-addr.arpa)

    d. Restart DNS (/etc/rc.init/d/named restart)


    # FTP


    13. Steps to configure FTP:


    +   * /etc/ftpassconf ftpd configuration

    * /etc/ftusers user access control

    * /etc/fthost access control


    # SAMBA


    14. Files used with SMB:


    +   * /etc/smb.conf Main configuration file

    * /etc/smbspasswd Password configuration file


    15. Steps to set up a share:


    +   a. Add share to /etc/smb.conf

    b. Use termp to test /etc/smb.conf syntax

    d. Restart SMB (/etc/rc.init/d/nbd restart)

    d. Access SMB share (smclient)


    # DHCP


    16. Steps to configure DHCP server:


    +   a. Check for multicast (ifconfig)

    b. Add route 255.255.255.255 (route)


