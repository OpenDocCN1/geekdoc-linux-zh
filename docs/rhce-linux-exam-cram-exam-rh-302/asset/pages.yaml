  md: '# Virtual Consoles


    Virtual consoles are a feature of Linux that is most coveted by many other operating
    systems. Virtual consoles allow you to have multiple-text-based logins on separate
    virtual screens on your system.


    To access virtual consoles on your system from a console screen, simply use the
    key combination Alt+F (numeric key, as in F1 and F2). For instance, Alt+F1, Alt+F2,
    and so on. (Note: + does not mean the plus sign key. It means to press the Alt
    key plus the function key). To navigate between an X session and a virtual console,
    use Ctrl+Alt+F1 to leave your X session and return to the first console; then,
    use Alt+F7 to return to your X session.


    By default, six virtual consoles are available after installation, Alt+F1 through
    Alt+F6. However, you can change your console settings and the number of consoles
    available on your system using your /etc/initabb file. Listing 6.3 is a sample
    excerpt of your /etc/initabb file where you specify virtual console settings.


    # Listing 6.3 Snippet of /etc/initabb file.


    ```

    #

    # initabb    This file describes how the INIT process should set up the system
    in a certain run-level.

    ```


    ```

    # Author:    Miguel van Moorenburg, <michel@drinkel.nl.mugnet.org>

    # Modified for RHS Linux by Marc Ewing and Bonnie Barnes

    ```


    ```

    # Run gettyys in standard runlevels

    1:2345:respawn:/sbin/mingetty tty1

    2:2345:respawn:/sbin/mingetty tty2

    3:2345:respawn:/sbin/mingetty tty3

    4:2345:respawn:/sbin/mingetty tty4

    5:2345:respawn:/sbin/mingetty tty5

    6:2345:respawn:/sbin/mingetty tty6

    ```


    ```

    7:2345:respawn:/sbin/mingetty tty7

    ```


    enables your seventh virtual console.


    You also set console settings in your /etc/security/console.perms file. This file
    controls the options (such as privileges that are set during login) for your console
    user group. Permissions for the console user group typically include shutdown,
    halt, and reboot.'
  merge: -1
