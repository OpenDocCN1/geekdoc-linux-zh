    # mkfs


    mkfs is used to build a Linux filesystem on a device, usually a hard disk partition.
    mkfs is simply a front end for the various filesystem builders available under
    Linux. Typical usage of mkfs looks like this:


    ```

    mkfs [-V ] [ -ttype ] [ files ] [ blocks ]

    ```


    The following is an explanation of the typical options used with mkfs as well
    as some additional options available.'
