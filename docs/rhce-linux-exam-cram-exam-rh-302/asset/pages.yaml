    # X Server Tools, Tips, And Tricks


    Various tools, tips, and tricks are available to assist you in managing and configuring
    your window manager options. For example, you can set up your Red Hat Linux 6.0
    installation to automatically boot into your favorite window manager by default.
    To do this (assuming you didn''t select the window manager during installation),
    you edit your /etc/initab file. To automatically start into your window manager,
    you must set your /etc/initab file to boot into runlevel 5. You set this in one
    of the first options in the file, in the string


    ```

    id:X:initdefault:

    ```


    where X is the default runlevel at boot. To automatically boot into runlevel 5,
    this configuration string should read


    ```

    id:5:initdefault:

    ```


    If you are running in runlevel 3 (console mode), you have two options to run the
    X Window system. You can either boot into runlevel 5 with the init5 command, or
    simply start the X Window system using startx. Typically, startx is the preferred
    method for starting the X Window system from the console.


    The shell script used to specify a user''s display manager (gdm, kdm, or xdm)
    is Xsession. The default Xsession script, located in the /etc/X11/xdm/,'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Chapter 9


    is used if the user does not have an .xsession file or .Xclients file in his home
    directory. The.xsession and .Xclients files are used to specify certain display
    environments or window managers for the user, typically if the user wishes setup
    to be different from the default system setup. The script used to execute the
    window manager is xinitrc. If a user has a xinitrc in his home directory, his
    personal startup script is used. Otherwise, the default,/etc/X11/xinit/xinitrc,
    is used.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_243_0.png)


    If present in a user''s home directory, the .xsession, .xinitrc, and Xclients
    files must have all the appropriate permissions before they are used. Therefore,
    all three of these files should have the executable permission set (chmod +x).


    A final trick for helping to manage window managers is a tool called switchdesk.
    If you want to change your window manager the next time you start your X Window
    session, the switchdesk program prompts you for the new window manager. To invoke
    this type, “switchdesk” at a shell prompt. The switchdesk program automatically
    creates an .Xclients-default that specifies what window manager or environment
    to run.


    # Desktop Environments


    Over the past couple of years, window managers have escalated to becoming integrated
    with entire desktop environments. Desktop environments control not only the look
    and feel of your desktop, but also the tools and applications that are available
    for your desktop. The two main desktop environments shipped with Red Linux are
    GNOME and KDE.


    # GNOME


    GNOME is based on CORBA and allows programmers to import and export component
    resources of their choice. This means that a program can use any editor it needed
    as long as the editor supports a standard interface via CORBA. Currently, the
    GNOME development project is partially funded by RHAD Labs, a division of Red
    Hat Software, Inc.


    GNOME is used primarily as a base desktop environment for other window managers.
    By default, window managers such as Enlightenment and Window Maker use GNOME as
    the base environment. In addition to the styles and tools that help the window
    managers add, GNOME offers several GNOME utilities to make the desktop more user-friendly.
    GNOME is based on the GTK+ (GIMP tool kit).


    One of GNOME’s tools is the GNOME Midnight Commander (GMC). GMC is a file manager.
    This manager allows capabilities such as drag and drop'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# X Window System 213


    to the desktop features and file browsing similar to the Windows Explorer. Another
    tool GNOME uses GDM, the GNOME Display Manager. GDM is more robust than the default
    X Display Manager (XDM). GDM allows the user to login to GNOME, KDE, or AnotherLevel.
    GDM allows the user to change the environment choice at login. GDM also provides
    a failsafe mode in case a problem occurs in the user environment, by bringing
    up an xterm to bypass the window manager.


    # KDE


    Unlike GNOME, KDE has a built-in window manager. You can, however, use KDE with
    other window managers including AfterStep, Enlightenment, and Window Maker. KDE
    is based on the Qt toolkit, developed by the Norwegian-based company Troll Tech.
    Figure 9.9 shows a KDE desktop using the default KDE window manager.


    KDE incorporates many KDE tools, applications, and functionality to the window
    manager. KDE incorporates KDE File Manager (KFM). Like GMC, KFM provides drag
    and drop functionality to the desktop, provides an Explorer-style file manager,
    and has incorporated Web-browsing functionality. Like GNOME, KDE has its own display
    manager, called KDE Display Manager (KDM).


    Other programs that are available for KDE include applications such as killrator
    and klyx. The illustrator program is a vector-based graphics program similar


