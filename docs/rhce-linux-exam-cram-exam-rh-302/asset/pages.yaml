  md: '# Chapter 6


    You can use another graphical user interface tool, userconf, to add users. The
    userconf tool, which is a little more user-friendly than linuxconf, has buttons
    and self-explanatory tabs (rather than the directory tree). To invoke userconf,
    enter `userconf` at the root prompt. To add a user, click on User Accounts and
    then the Add button. You can then add the user information exactly as you do when
    you use linuxconf.


    # Deleting Users


    A good system administrator keeps a good audit on the users on her machine. The
    main thing to keep track of is which users are active and are not. You should
    remove accounts that are no longer being used, such as those for employees no
    longer working there. Leaving old accounts on your system is a security risk.


    You can remove users from your system in four ways: You can remove them manually,
    remove them within a group (with groupdel), or use the interf interf tools such
    as `userdel` or `linuxconf`. Each tool differs, and which one you use is simply
    a preference.


    If you do not like to trust automatic programs, or for some reason your tool is
    not functioning or is not available, you can remove the user manually. You will
    want to edit your password file and remove the line assigned to the user. Next,
    remove the user''s entry in the `/etc/group` file. Finally, rename, move, or delete
    the user''s home directory, including the `.login` and `.profile` files within
    the user''s home directory.


    System administrators who are accustomed to administering a large group of users,
    or users for a large corporation, may wish to set up their users by group. For
    instance, they may have set up all users in the Sales department in group named
    Sales. They may also have set up their temporary users in group named contractor.
    Using `groupdel` removes all system entries referring to that group. Keep in mind,
    however, you must manually search your filesystems for remaining files. Another
    problem with using `groupdel` is that you cannot remove a primary group for an
    existing user.


    The most popular Unix deletion tool is `userdel`. To delete a user with it, enter
    `userdel username` from the root prompt. The `userdel` tool automatically removes
    the user''s entries in `/etc/passwd` and `/etc/group` files. Using the `userdel`
    tool without any options removes these two entries, but not the user''s home directory
    and files. To remove these, pass `userdel` -r` option. For example,


    ```

    userdel -r username

    ```'
