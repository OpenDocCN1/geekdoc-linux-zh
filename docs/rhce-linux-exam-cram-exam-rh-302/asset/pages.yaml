    # User Administration


    For most Linux administrators, the most time consuming and important job is user
    administration. User administration can involve everything from adding and deleting
    users, modifying user information, setting up basic user shell settings, and setting
    up window managers.


    # Adding Users


    There are about four different ways to add new users to your system.. You used
    to add users manually, but you can now also use tools such as useradd, linuxconf,
    and userconf to set up user accounts, passwords, home directories, shells, and
    more.


    Adding users manually can be a very tedious task. You first have to edit the user
    and groups files to add the user information at /etc/passwd and /etc/group, respectively.
    Next, you must create the user''s home directory and copy the default files and
    user directories from /etc/skel. Finally, you have to change the ownership of
    the new home directory so that it is owned by the new user.


    The most popular Linux (and Unix) user addition tool is adduser, which is the
    same as adduser. To add a new user using adduser, as root, enter “adduser newUser”,
    where newuser is the new user’s username. Next, enter “passwd user” to set the
    user’s password, and then confirm it. The adduser (and useradd) command automatically
    sets the user’s home directory by automatically copying the files located in /etc/skel.


    As mentioned earlier in this chapter, linuxconf a graphical user interface tool
    used to set up things under Linux, including new users. Invoke linuxconf, enter
    “linuxconf” at the root prompt. Then, move through the directory tree in the left
    screen to go through Config, then Normal, then User accounts. Next, click on the
    Add button. You are prompted for information such as the login name, his group
    (optional), any additional groups, and special permissions. After hitting Accept,
    you are asked to enter a user password and confirm it.'
