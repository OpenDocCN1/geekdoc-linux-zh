  md: '# DHCP


    DHCP (developed by Microsoft) is a descendant of the boot protocol (bootp), which
    automatically assigns IP addresses to a client on a local network. DHCP uses UDP
    when the client sends a DHCPDISCOVER message as a broadcast packet to the network.


    The DHCP server receives this packet and assigns (either statically or dynamically)
    an IP address to the client. The DHCP server sends to the client a DPOFFER packet
    that contains an address and the lease time, as well as other pertinent networking
    information (such as address, netmask, gateway, nameservers, and so on). The client
    issues a DHCPREQUEST for the specified address. The server then responds to this
    with the DHCPACK (which agrees with the client and starts the lease time).


    +   This procedure differs from that used with bootp. In bootp''s case, it simply
    sends the address without managing the lease time.


    DHCP uses /etc/dhcpd.conf for configuration files and /etc/dhcpd.leases for lease
    information.


    # Samba


    Samba is a server for the SMB protocol, which is the default file and printer
    sharing protocol that all versions of Windows, OS/2, and LanManager use. Samba
    allows the connectivity of these alternative operating systems to use a Unix or
    Linux box as a file or print server. Samba consists of two daemons: smbd and nmbd
    (the NetBIOS nameserver). Clients use nmbd to find other hosts on the network.
    Configuration files are located in /etc/smb.conf.


    HTTPD is the http (or World Wide Web) server. On Red Hat, the default httpd is
    Apache. Apache is a free Webserver that was originally derived from the NCSA http
    server. The configuration files are located in /etc/httpd/conf.


    # NIS


    NIS, originally called Yellow Pages, was developed by Sun Microsystems to simplify
    filesystem administration by maintaining the files in a central database.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'The clients contact the database server to retrieve information. Two basic
    NIS utilities include ypcat (which displays an NIS database) and ypatchmatch (which
    searches an NIS database).


    # inetd


    This is the Internet services daemon that listens for service requests on network
    connections and then starts up the appropriate daemon to respond to the particular
    request.


    # Security Basics


    All Unix administrators should know the basics for securing their systems, including
    monitoring users and groups, setting file permissions properly and using umask,
    and using shadow passwords.


    # Monitoring Users And Groups


    One of the most time-consuming duties of a Red Hat system administrator revolves
    around monitoring users and groups. Some basic administration tasks to monitor
    include services, user accounts, and even software that is used.


    Some typical things to watch for unneeded services. To see what services are automatically
    started at boot, run ntsysv. If any service you don''t use are checked, simply
    uncheck them. Doing so stops them from being started at boot. You can also stop
    services you''re currently running (for example, nfs) by running /etc/rc.d/init.d/nfs
    stop.


    Some common sense when assigning user accounts can save you many heads later.
    For instance, set up guidelines when users choose their passwords; they shouldn''t
    be the same as their usernames, nor should they be any type of English word. It''s
    best to use a mixture of numerical and alphabetical characters. Also, allow shell
    access only to those who need it. For instance, if a user is simply pulling his
    mail from the account, his shell access to /usr/bin/passwd (or something similar).
    Doing so forces him simply to change his password instead of allowing him to have
    shell access.


    Another good area to monitor is software usage; keep an audit of the software
    you''re running. Many times, unwanted users exploit popular software, such as
    sendmail or BIND, and then gain root access to your system. Keep up to date by
    using the most current versions of your software.'
  merge: -1
  pgno: 103
