- img_proc: true
  md: '# Networking Basics


    A Linux box without a network is like a typist without hands. Therefore, a Linux
    administrator who wishes to obtain his RHCE must have a good understanding of
    networking basics such as Transmission Control Protocol/Internet Protocol (TCP/IP)
    fundamentals, network ports, and networking services.


    # TCP/IP Fundamentals


    The most important networking protocol used in today''s networks is TCP/IP. It
    is the fundamental protocol used to establish the Internet, as well as the majority
    of the world''s wide area networks. Networking is one of Linux''s star features,
    making it more popular every day for business networks, Internet Service Providers
    (ISPs), manufacturing facilities, network companies, and others.


    # TCP/IP And The Open Systems Interconnection (OSI) Layer Model


    The TCP/IP Layer model is based on the OSI layer model. The OSI model consists
    of seven layers, whereas the TCP/IP model has only four. Here is a list of the
    OSI model layers:


    +   - Application Layer


    +   - Presentation Layer


    +   - Session Layer


    +   - Transport Layer


    +   - Network Layer


    +   - Data Link Layer


    +   - Physical Layer


    Compare those with the TCP/IP model layers:


    +   - Application Layer Handles TCP/IP network daemons and applications. This
    layer performs the jobs of the OSI''s Presentation Layer and its Session Layer
    in addition to OSI''s basic Application Layer.


    +   - Transport Layer Handles all the data routing and delivery issues, including
    session initiation, error control, and sequence checking. This layer covers OSI''s
    Transport Layer and part of the Network Layer.


    +   - Internet Layer Handles all the data addressing, transmission, and the IP.
    This layer covers part of the OSI Network Layer.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Red Hat Advanced Prerequisites 61


    +   - Network Access Layer Specifies the procedures for transmitting data over
    the network, including how to access the physical medium (this is used for many
    protocols, including Ethernet and FDDI, the Fibre Distributed Data Interface.


    # TCP And User Datagram Protocol (UDP) Protocols


    TCP is not the only protocol used in TCP/IP networking. Some applications, such
    as NFS, use a sibling protocol called UDP. Both protocols allow the application
    to contact a service on a specific port. However, UDP doesn''t establish a connection;
    rather, it sends packets to the service.


    # Internet Control Message Protocol (ICMP) Packet Types


    ICMP is used by the kernel code to send error messages to other hosts. Some valid
    ICMP packet types exist, and some can carry multiple messages. are echo-reply,
    destination-unreachable, source-quench (deprecated, but NT still sends them for
    some reason), redirect, echo-request, router-advertisement, router-solicitation,
    time-expired, parameter-problem, timestamp-request, timestamp-reply, address-mask-request,
    and address-mask-reply.


    The destination-unreachable packet can carry one of 14 different messages. These
    include network-unreachable, host-unreachable, protocol-unreachable, port-unreachable,
    fragmentation-needed, source-route-failed, network-unknown, host-unknown, network-prohibited,
    host-prohibited, TOS-network-unreachable, TOS-host-unreachable, communication-prohibited,
    and host-precedence-cutoff.


    The redirect packet can carry one of four messages: network-redirect, host-redirect,
    TOS-network redirect, and TOS-host-redirect.


    The time-expired packet (also known as ttl-expired) can carry one of two messages:
    ttl-zero-during-transit and ttl-zero-during-reassembly.


    The parameter-problem packet can carry one of these two messages: ip-header-bad
    and required-option-missing.


    # Understanding Ports


    Network services are each assigned (or bound to) a port. Ports are TCP''s and
    UDP''s abstraction of a service endpoint. There are 64k (or 65,536) possible ports
    for use. All ports under 1024 (low-number ports) are considered privileged ports.
    This means that only the root can bind to them. However, 1024 and above are unprivileged
    ports, meaning that any user can bind to them.'
  merge: -1
  pgno: 92
