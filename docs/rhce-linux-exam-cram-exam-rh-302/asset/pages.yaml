  md: '# 84 Chapter 5


    The underlying goal of becoming an RHCE is to certify your skills in the installation,
    configuration, and administration of a Red Hat Linux system. The first step to
    achieving your goals as an RHCE is to master the skills of installation. In this
    chapter, we will discuss the steps to successfully install a Red Hat 6.0 system.


    # Getting Started


    Before you begin your installation of Linux, you have to decide why you are installing
    Linux in the first place. What are your needs? What do you want to do? Linux has
    a vast variety of applications, uses, and support. Deciding you''re going to do
    in advance will help you decide what to install or set up.


    # Server Vs. Workstation


    You can use Linux in either a server or workstation environment. In fact, if necessary,
    you can use it in both. If you are just a home user, or perhaps a work-at-home
    user, you''re probably looking to set up a workstation. On your workstation, you
    can set up all your dial-up applications, as well as work on your home programming
    projects and more. If you are trying to set up a router, a file server, an Internet
    gateway, a mail server, a Dynamic Host Control Protocol (DHCP) server, or even
    a Quake server, you need to evaluate your requirements for setting up a server.


    # Hardware Requirements


    If you''re simply planning on setting up an at-home or office workstation, your
    hardware requirements are very unlimited. Although it''s doubtful you would be
    very happy surfing the Net—or compiling a new kernel—on a 386/16 with 8MB of RAM,
    it is possible. Linux can use most PC hardware, with the exception of winmodems
    and just-released hardware.


    > Just-released hardware, if not released with a Linux driver, is typically supported
    within a few weeks of its release.


    Drivers are currently being developed for the winmodem family and should work
    with Linux in the near future. A good resource to check see if your hardware is
    supported is www.redhat.com/support/docs/hardware.html.


    If you want to set up a router or a firewall, you can use any basic hardware setup.
    In fact, using as either a router or a firewall isn''t CPU- or memory-intensive.
    You can therefore set up a very adequate router on a 486 with 16MB'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Installation 85


    of memory and a 250MB hard disk. Other hardware you may have to introduce your
    system, depending on your setup, includes networking hardware such as network
    interface cards (NICs), modems, ISDN adapters, or even frame relay cards.


    If you want to set up a network file server, your hardware requirements will be
    different than those when you are setting up a simple workstation, or even a router.
    NFS servers are not CPU bound, a slower system such as a 486 is adequate. If you,
    you should evaluate your speed and size requirements. If you will be serving a
    large number of files, or large files, you must keep ample hard disk space. If
    your machine is serving a large number of users, or will be kept under high load,
    you should consider hard disk speed as well. You may opt to use SCSI disks, which
    have faster access times than IDE disks. Using SCSI disks, however, requires that
    you use an SCSI adapter. Memory is used on an NFS server for cache. Larger amounts
    of memory allow for faster write and accessibility on common files.


    If you are planning to set up a database server, you should evaluate all your
    input/output (I/O) nodes. Database servers are very CPU intensive, so you need
    a CPU that can handle the amount of users using the system. When implementing
    an NFS server, you need ample amounts of disk space and memory. The speed of your
    hardware (hard disk and memory) may also be a large factor when you choose hardware.


    # Pre-Installation


    To make your Red Hat 6.0 install smoothly, you should plan and be prepared for
    as much of the install as possible before beginning. Most importantly, you should
    have several documentation and information resources available for quick reference
    during the install, or for troubleshooting afterward. An excellent resource for
    this is the Red Hat 6.0 Installation Guide. This guide is included with the retail
    version of Red Hat, which you can purchase directly from Red Hat (http://www.redhat.com/),
    or from a reseller such as Best Buy or Fry''s. A hard copy of the manual is only
    available from Red Hat. In addition, you can view or download the manual from
    Red Hat''s Web site at http://www.redhat.com/corp/support/manuals/RHL-6-Manual/install-guide/manual/.
    In addition, other great documents can be found on Red Hat''s Web site at http://www.redhat.com/docs/


    # Installation Method Preparation


    After you have gathered the necessary installation materials, it''s important
    to make sure you have all the necessary media—such as your install CD'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# 86 Chapter 5


    boot disks—prepared. With Red Hat 6.0, different media can be used—or in cases,
    are required—depending on what method you decide to use to boot the installation
    program.


    You should also have access to any peripherals you want to set up during the installation,
    as well as all the technical information for any hardware connected to, or installed
    inside, the machine. If you are planning to install over a network, you should
    ensure that you are properly connected to your network and that you have located
    a stable server to install from.


    # Using A CD-ROM


    If you have a bootable CD-ROM, you can start your installation by bootinf from
    the Red Hat 6.0 distribution. Make sure your BIOS is set to boot from the CD-ROM
    first. If you are planning to set up a dual-boot system (discussed in Chapter
    7) and already have a DOS partition on your device, you can choose to use the
    autoboot feature, located under the directory /dosutils on the Red Hat 6.0 CD.
    However, if you don''t have a bootable DOS partition or you must use a boot floppy.


    # Using A Boot Floppy


    If the boot floppy is not included with your installation media, you can create
    it using either rewrite (on DOS) or dd (on a Unix system). Using either of these
    writes the boot image to the floppy. You can run rewrite directly from the Red
    Hat 6.0 CD by following these steps:


    +   1. Load the CD and change into the \dosutils directory.


    +   2. Run rewrite. You are asked to supply the path to the boot directory that
    you want to load. For instance, for boot.img, enter "images/boot.img". You are
    then asked to provide your target. You are using a floppy, so choose "A".


    +   3. You are next prompted to format a floppy disk and hit Enter. The process
    takes a few minutes, but when it is finished, you then have a working boot disk.


    To use dd on a Unix system to create a boot disk from the CD, first mount the
    CD-ROM. Next, use the command `dd if=/mnt/cdrom/images/boot.img of=/dev/fd0`,
    replacing /mnt/cdrom with the mount directory of your CD-ROM. You may also need
    to replace /dev/fd0 with the appropriate mount point of your floppy. The boot
    image, named boot.img, is on the Red Hat 6.0 under the images directory. You can
    also download the boot.img file from one of Red Hat''s FTP mirrors. A list of
    mirrors can be found at http://www.redhat.com/mirrors.html.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_117_0.png)'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'Special boot floppies are required in these situations:


    +   - If you are planning to install Red Hat Linux by using a PCMCIA network card
    or CD-ROM drive


    +   - If you are planning to install Red Hat Linux via network file system (NFS)
    or FTP


    When you need one of the special boot disks listed above, you can create it using
    the same method as creating a regular boot disk as discussed earlier in this section.
    As we discussed for creating a regular boot disk, you can use rewrite (DOS) or
    dd (Unix) to write the special boot image to a floppy. The image required to use
    PCMCIA devices during the installation is called pccmia.img. The image required
    to install via NFS or FTP is called bootnet.img.


    # Planning Your Configuration


    During the installation, you are prompted for several configuration, setting,
    and installation options (including network settings, host and domain information,
    root password, and hardware specifications). Before actually beginning your install,
    you should have all this information prepared, to save you from having to find
    it—or figure it out—during the installation process.


    One of the most important configuration issues deals with the physical hard drive
    installation. You should know exactly what drive you plan to install on, and on
    exactly what partition. Knowing this information is especially important if you
    have multiple drives, or existing partitions from a previous Linux install or
    other operating system. Specifying the wrong drive or partition during the install
    will destroy any information on the drive, and you will not be able to recover
    it.


    You should also plan your partition layout. If you''re installing on a small drive,
    or setting up a long-term dedicated service machine, you may opt simply to install
    all the packages and directories in one partition (in addition to your swap partition).
    For installations on machines with multiple operating systems, existing partitions,
    or simply very large drives, it''s best to create multiple partitions. The most
    common dedicated partitions are set up for the following filesystems:


    +   - "/"


    +   /home


    +   /var


    +   /tmp


    +   /boot


    +   /usr/local'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Setting separate filesystems is helpful when you are managing large filesystems.
    Splitting filesystems amongst separate partitions rebuild time if one filesystem
    becomes corrupted, as well as sets up better security when other users attempt
    to access the system. In addition, setting these separate filesystems makes system
    upgrades easier. For example, creating a separate system for users'' home directories
    allows you to upgrade the entire system without damaging user data.


    In addition to planning your physical installation, you should have the information
    prepared for configuration settings and installation options when prompted. Some
    of this information will include network settings, host and domain information,
    root password, hardware specifications, and more.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_119_0.png)


    # Installation Process


    To simplify explaining the installation process, and to allow for quicker reference,
    this section is divided into six sections. The first describes how to begin your
    installation and discusses how to install from CD-ROM, over NFS, and more. The
    second section discusses the first stage of the installation process. It describes
    the configuration options for the actual installation process. The third section
    covers the second stage of the installation process. The fourth section discusses
    hard drive options. The fifth section discusses installing packages. It explains
    how to select individual packages and describes some of the commonly used packages.
    The last section details the installation''s third stage, during which you configure
    peripherals, network settings, and more.


    # Beginning Your Installation


    As mentioned earlier in this chapter, you begin your installation in different
    ways, depending on your method of installation. The most standard installation
    type simply uses a boot floppy and the Red Hat 6.0 CD-ROM. Some installations
    don''t require a boot floppy at all. Others don''t require the CD, but require
    special bootppies. The most common types of installations include DOS autoboot,
    boot floppy/CD combination, NFS, FTP, and hard drive installations.


    # DOS Autoboot Install


    To begin your installation without using a boot floppy, you should have a bootable
    DOS partition on your machine. Boot to the DOS partition. Next, insert your Red
    CD and change into the /dosutils directory. Under the /dosutils directory there
    is a tool named autoboot.exe, which automatically boots from a DOS'
