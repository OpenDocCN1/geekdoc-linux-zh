  md: '# Time Services


    There are a number of services available on Red Hat Linux that allow you to configure
    and synchronize time services on your machine. These tools are available because
    few machines have atomic clocks attached to them, therefore computers often lose
    accurate time. There are three main time related tools included in Red Hat Linux
    6.0—they are the time configuration tool timtool and the time synchronization
    tools xntpd and rdate.


    # Time Configuration


    A GUI interface tool for time configuration, timetail, is packaged with Red Hat
    Linux 6.0. The RPM available for timetail on the Red Hat Linux 6.0 CD is timetail-2.5-5.noarch.rpm.


    To change system time with timetail, execute it as root by typing timetail at
    the root prompt. The GUI window, select the time setting you want to change (hour,
    minute or second), and then use the up and down arrows to change accordingly.
    When time is set appropriately, choose the “Set System Clock” button to save the
    time setting to the system. Then, choose the “Exit Time Machine” to exit. See
    Figure 10.6 for the interface of timetail.


    # Time Synchronization


    Some administrators choose to use time synchronization tools to set the system
    time based on a specified host machine. One (older) tool used for this is rdate.
    A more popular package used to set up a continuously running synchronization daemon
    is xntpd.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_285_0.png)


    Figure 10.6 The timetail interface.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# rdate


    The Red Hat Linux tool rdate is a tool to synchronize the system time with a specified
    machine. The rdate tool only synchronizes once when the tool is being used. The
    RPM used to install rdate on the Red Hat Linux 6.0 CD is rdate-0.960923-8.i386.rpm.


    To use rdate, run rdate -p -s host where host is the machine with which you want
    to synchronize your time. The "-p" option prints the time set on the remote host
    you specify. The "-s" option synchronizes the time on your machine with the host
    you specify.


    rdate uses port 37 to send and receive rdate requests. Many administrators disable
    this port and service; therefore, finding a good rdate host may be troublesome,
    unless it is on your own network.


    ![](img/7a3d74d02590d83bf562ed6969db9ba0_286_0.png)


    # xntp3


    The most popular package used for time synchronization is the xntp3 package. The
    xntp3 package contains several real-time tools such as xntdate and the popular
    xntpd daemon that runs continuously to synchronize your system time. The RPM used
    to install xntp3 on the Red Hat Linux 6.0 CD is xntp3-5.93-12.i386.rpm, and it
    is found in /RedHat/RPMS/ directory.


    +   - nntdate Similar to rdate. The nntpd tool is used to retrieve the data and
    time from the network by polling the Network Time Protocol Servers. The nntpd
    command is often placed in /etc/rc.local''s startup script or can also run from
    the system cron.

    - xntpd Time synchronization daemon used to continuously adjust system time. Configuration
    for xntpd is done through /etc/ntp.conf.


    # Squid Proxy Server


    Squid is a caching proxy server. Proxy servers are used to cache data streams
    such as FTP, gopher, and HTTP. Network clients can then be directed to the proxy
    server to aid in pulling cached HTTP documents.


    # Setting Up Squid


    To install squid via rpm from the Red Hat Linux 6.0 CD, use squid-2.2.STABLE1-i386.rpm
    from the /RedHat/RPMS/ directory. The main'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 256 Chapter 10


    configuration file that is automatically set up from the RPM is /etc/squid/squid.conf.
    The squid conf file consists of every configuration setting needed to run Squid
    and contains excellent comment explanations for each setting available.


    After installing the Squid RPM, the default configuration file (squid.conf) is
    already configured with default settings that allow you to run Squid "out of the
    box." To start squid, type /etc/rc/init.d/squid start. When you start squid for
    the first time, you automatically create the squid cache files as specified in
    the /etc/squid/squid.conf settings. The squid daemon will automatically listen
    on port 3128 for proxy requests.


    # Using Squid


    The most popular use for Squid is as a Web proxy server. A Web proxy server caches
    HTTP request information (such as images, HTML pages, and on a local machine to
    speed downloading times and so forth to clients on the network. This feature is
    especially useful when a specific Website is requested numerous times on a specific
    network.


    When configuring a client to use a proxy server (such as Netscape), you simply
    set the client to point its HTTP traffic to the proxy server''s IP address and
    port (3128). For instance, if your proxy server is on 192.168.0.1 and the network
    client was running Netscape, you would take the following steps:


    +   1. Load Netscape. After Netscape has loaded, use the menu options at the top
    of the window to choose "Edit," and then "Preferences." This presents you with
    a preferences menu where you can set up everything from identification information
    to advanced options such as using a proxy server. (See Figure 10.7).


    +   2. Select the Advanced option in the left frame of the Preferences window
    by selecting the arrow to the left of the Advanced option. Select the Proxies
    option (as displayed in the Figure 10.7) from beneath the Advanced directory.
    In the right frame of the window, select "Manual Proxy Configuration" and choose
