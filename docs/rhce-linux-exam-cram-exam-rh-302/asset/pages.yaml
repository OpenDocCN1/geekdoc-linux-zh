  md: '# Question 8


    +   How can you interrupt the boot process to boot a different operating system
    if one is already installed?

    - a. Press Ctrl+Alt+Delete after the Loading MS Windows prompt

    - b. Press Shift after the boot: prompt

    - c. Press Tab after the LILO: prompt

    - d. Press Enter at the LILO: prompt


    Answer c is correct. You can also press the Shift key at the LILO: Answer a is
    incorrect because pressing Ctrl+Alt+Delete while loading Windows or Linux reboots
    the system. Answer b is incorrect because you are getting a boot: prompt, you
    are booting with an installation disk. In addition, the Shift key won''t help
    you with that option. Answer d is incorrect because pressing Enter at the LILO:
    prompt automatically boots the default operating system or kernel image.


    # Question 9


    If you are installing Windows on a dual-boot system with Linux, why should you
    install Windows first?


    You aren''t required to install Windows first on a dual boot system, but if you
    plan to use LILO as your default boot manager, it is recommended to do so. By
    installing Windows first, you save the risk of overwriting your master boot record
    where LILO is installed, or destroying your Linux partitions altogether.


    # Question 10


