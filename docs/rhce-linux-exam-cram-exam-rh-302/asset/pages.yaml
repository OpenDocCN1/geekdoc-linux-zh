  md: '# Table 11.4 Commands for ipchains.


    | Command | Usage | Description |

    | --- | --- | --- |

    | -A | ipchains -A chain rule | Append rule specification to end of specified
    chain. |

    | -D | ipchains -D chain rule | Delete rule from specified chain. |

    | -L | ipchains -L chain | List all rules in selected chain. (If no chain is specified,
    all rules are listed.) |

    | -F | ipchains -F chain | Flush all rules in selected chain. |

    | -P | ipchains -P chain target | Set policy of specified chain to given target
    (see Table 11.5). |

    | -h | ipchains -h | Help. |


    +   - j Specifies a target to a rule, meaning what to do if packet matches. For
    example, usage=ipchains -A input -s 192.168.100.0 -j DENY.


    When specifying your rule, there are several types of “targets” that you can specify.
    The target is what happens when rule specifications are matched. Five of the most
    common target values are ACCEPT, DENY, REJECT, MASQ, and REDIRECT. Table 11.5
    lists and explains each of the five targets.


    # Table 11.5 ipchains targets.


    | Target | Description |

    | --- | --- |

    | ACCEPT | Allows packet through. |

    | DENY | Drops packet. |

    | REJECT | Similar to DENY, but sends an ICMP message back to sender stating that
    the packet was dropped. |

    | MASQ | Only used in forward chains (or user defined chains). Requires CONFIG_IP_MASQUERADE
    to be compiled in the Linux kernel. Packets are marked as if they originated from
    local host. (Reverse packets are also demqueraded automatically, bypassing the
    forwarding chain.) See the section in this chapter titled “IP Masquerading” for
    more information. |

    | REDIRECT | Only used in forward chains (or user defined chains). Requires CONFIG_IP_TRANSPARENT_PROXY
    to be compiled in Linux kernel. Packets are redirected to a local socket. |'
