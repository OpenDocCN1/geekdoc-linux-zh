  md: '# # Reconstructing Dalvik Applications using UNDX


    By Marc Schönfeld


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_22_0.png)


    As a reverse engineer I have the tendency to decode the code that is running inside
    the device. I am coming from the JVM background, so I wanted to know what Dalvik
    is about. Additionally I wanted to learn yet another dalvik bytecode language
    while sitting on a boring task. As I prefer to decode and doing the UNDX, which
    will be presented in the following paragraphs.


    WHAT IS DALVIK

    vik is a runtime that uses Android applications. It was invented by Dan Bornstein,
    a smart engineer at Google and named it after a village in Iceland. Dalvik is
    register-based and uses dalvik bytecode. It runs its own bytecode dialect which
    is executed by the Non-JVM runtime engine; see the comparison in Table 1.


    | Table 2: Dalvik APIs |

    | Dalvik | JVM |

    |---|---||

    | java.io | Y | Y |

    | java.net | Y | Y |

    | java.lang.* | Y | Y |

    | com..* | Y | N |


    Dalvik can choose from a wide range of APIs, some known from Java, and some are
    Dalvik specific. Some of the libraries are shown in Table 2.


    | Table 1: Dalvik vs. JVM |

    | Feature | Dalvik | JVM |

    |---|---|--|

    | Architecture | Register | Stack |

    | OS-Support | Android | Multiple |

    | File | apk | dex |

    | Executable | per application | JAR |

    | Memory | low | high


    DALVIK DEVELOPMENT PROCESS

    Dalvik apps are developed using developer tools like Android Studio IDE. The developer
    compiles the sources to dalvik classes (using the java compiler). The next step
    is to transform the classes into dex format (using the d8 tool, which results
    in the dex file). This file, filled with metadata (and manifest resources) needed
    for deployment. An APK-file is transferred to the device or an emulator, which
    can be added with apps, or in user-end cases, as downloaded from the market.


    DALVIK DEVELOPMENT FROM A REVERSE ENGINEERING PERSPECTIVE


    PERSPECTIVES

    Dalvik applications are available as files, so you can download it as a cake.
    The questions during reverse engineering of dalvik apps are to find out whether
    the application contains malicious code, code that sends data to a handler channel,
    or if the libraries statically used (if it''s APK application) have unpatched
    security holes, which may affect the dex file they contain.


    WORKFLOW

    Dalvik programs follow a recurring workflow of developing apps. In their default
    setup it involves Java dex. There is no way to back decode code unless we completed
    the dex (see Figure 2). This differs from the Java dex where we can decompile
    the code using the toolbox of every programmer. Our tool UNDX fills this gap,
    as seen in figure 2.


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_22_1.png)


    | Table 3: Dalvik development process |

    | jari/java | class | jar |

    |---|---|--|

    | *java | | |

    | dex | | *dex |


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_22_2.png)


    | Figure 3: Development process with undx |

    | jari/java | undx | |

    |---|---|--|

    | *java | | |

    | *dex | | *dex |


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_22_3.png)'
