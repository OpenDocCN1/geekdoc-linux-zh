    # ## Exploitation Analysis of Help Desk Systems


    **Aditya K. Sood, SecNiche Security**

    **Rohit Bansal, Security Researcher, SecNiche Security**


    The online world has been encountering massive levels of malware attacks in the
    recent times. The outbreak of injected malware has reinforced its devastating
    stance on contaminating a large number of websites. Most of the traces have been
    found in the websites under shared and virtual hosting which further includes
    content from third party delivery networks. Well, it''s the truth that a minor
    inherited weakness in applied software can cause havoc if exploited appropriately.
    Recent malware attacks have endorsed this fact. This paper talks about the techniques
    used by malware writers engaged in performing continuous analysis of differential
    malware. The paper aims at knowledge sharing by presenting the layout of datacenter
    compromises through simple support systems used for assisting the customers. The
    reality of support system shows the nature of insecure work functionality which
    is exploited heavily by malware writers. This paper is an outcome of real time
    analysis of compromised systems. This paper has been generalized for security
    and responsible disclosure reasons.'
