    # # Stepping Through a Malicious PDF Document


    Have you wondered how a malicious PDF document takes control over a Windows machine?
    This article will explain in detail how this is possible:


    By Didier Steevens, didier.stevens@gmail.com


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_16_0.png)


    What happens when a PDF reader executes xref 0-8. The reader will check if the
    file is a PDF document for the presence of a header and a PDF document. A PDF
    document starts with a header like %PDF-1.1. The version of the language used
    in the PDF document is specified in the string for the trailer. The PDF reader
    looks for the keyword xref at the end of the file. The absolute position of the
    trailer below is 2294. The PDF reader application finds the keyword xref when
    it starts parsing from the end of the PDF.


    ```

    %PDF-1.1


    trainer

    000000000 000055 f

    000000012 000012 n

    000000016 000016 n

    000000024 000024 n

    000000049 000049 n

    000000052 000052 f

    000000067 000067 n

    <

    /Size 8

    /Root 1-0 R

    /startref 2294

    %%EOF

    ```


    A cross reference table contains the absolute position of all objects used in
    the PDF document. The number of zero xref entries in the PDF reader application
    indicates that it has indexed the objects zero by number. The second number is
    the size of the cross reference table. In our example, the cross reference table
    has 8 entries. It is mandatory and necessary for it to be 00000000 for length.
    The value of /OpenAction is a reference to object 7. All entries are relative
    offsets from the first object.


    ```

    /OpenAction 7-0 R

    >>

    endobj

    ```


    The dictionary in object 1 has an /OpenAction key. The key of this instructs the
    PDF reader table-reader to take an action when the PDF document is opened. The
    value of /OpenAction is a reference to object 7.


    Object 7, located at absolute position 657, contains the dictionary:


    ```

    7-0

    /Type /Action

    /S /JavaScript

    ```


    In our example, the cross reference table shows object 1 version 0 starts at offset
    12, object 2 version 0 starts at offset 37. The PDF reader application finds object
    7 at absolute position 657.


    Following the cross reference table, the PDF reader application finds the JavaScript
    application in the PDF. The dictionary is a data structure containing keys and
    values with << keys and >>. Names start with a / character and can be any alphanumeric
    string except other dictionaries.


    ```

    //shellcode = escape(\u0073\u0068\u0065\u006c\u0063\u006f\u0064")

    while(n.length< 0x0060000) {

    var blocks=new Array(n);

    for(i=0;i<1200;i++) {

    blocks[i]=shellcode;

    }

    }

    eval(blocks.join("));

    ```


    After parsing the trailer, the PDF reader application looks for the dictionary
    that contains some /Root key. One important key-value is a reference to the /Root
    body. The body object contains dictionaries that have a root node, a dictionary
    /Root key that indicates the offset of the root tree. In our example, the root
    is object 1. This indicates that the offset is absolute. And object 1 is identified.
    The PDF reader knows that the root object is object 1 with version 0 starts at
    offset 0. From the cross reference table, it shows object 1 at absolute position
    12.


    Object 1 contains a dictionary and more key-value pairs that closes the dictionary.


    ```

    <<

    /Type /Catalog

    /Outlines /Pages-3-0 R

    ```


    Before we investigate the code, we need to know more about JavaScript in the PDF.
    The PDF language allows JavaScript execution. JavaScript scripts are found inside
    the PDF document. These scripts are executed by the PDF engine. The JavaScript
    engine is sandboxed, it has no access to the operating system files. A JavaScript
    engine cannot access (read/write) attributes of files or registry keys.'
