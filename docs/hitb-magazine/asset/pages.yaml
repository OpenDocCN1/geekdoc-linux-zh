    ![](img/27dc30d9ee9d016ae2e2400b49269e56_27_0.png)


    Hi Aditya, how are you?

    Hi Zarul, I am fine and going good.


    Maybe you can share with our readers something about yourself and how did you
    get into with computer security?

    I started working in the computer security field from my college days. Even then,
    the time was not as exciting as it is today. Success in this field comes from
    curiosity, time and eventually hard work. Learning naturally enables you to learn
    a lot of things. I spent a lot of time understanding the craft of computer security
    and kept on motivating during sleepless nights which is unavoidable in every field.
    I started learning by myself and online. Perseverance and ''Never give up'' helped
    me to acquire the basic knowledge of computer security. I have since believe that
    by serving the community as all researchers and people in the community we will
    have learned a lot from it. So, I feel I have a responsibility to give back to
    the community by engaging in productive research.


    Before pursuing your PhD at Michigan, what did you learn?


    Which area of security interest you the?

    I have keen interest in the diverse facets of computer security. The security
    industry has a sense of responsibility. My work is focused on security research,
    analysis, and vulnerability research. I am like to doing security which includes
    application security assessments, fuzzing, testing, and contributing to the community
    by publishing papers and tools. This helps in detecting vulnerabilities across
    a wide range of devices and various products. I try to sharing my knowledge and
    thoughts because it helps me to set a path of communication between two peers
    to enhance the learning experience.


    Few years back, because of the benefit of what I would call as list "Trill".

    How did you take a risk?


    Yes Dani, it was in the first year that I did not get anything except for criticism.
    Personally, I believe that human efforts are constructive in nature. So, I decided
    not to take any negative meaning from the criticism that was making in the line.
    I firstly believe that criticism should help you to remain committed to what you
    goal. It helps to to gain many experiences. We have online democracy where everyone
    enjoys freedom of speech. The more people, the more we are exposed to the protocols
    of communication. In feeling nowadays that criticism does not lead an individual
    to fail but instead allows him to work with the best of my abilities without getting
    distracted into the "Trill". When I started following the constructive path, the
    journey became successful and productive research.


    Do you know who was that person and what did he have against you?


