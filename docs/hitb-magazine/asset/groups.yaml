  mdcn: "\n\n# 网络安全\n\n安全参数（如 \"HTTPOnly\"）的实现在某种程度上保护了受保护的 cookie。如果没有利用这些参数，攻击者可以使用简单的攻击来提取\
    \ cookie 数据并将其传输到攻击者控制的域名。假设有一个关键的安全 cookie。\n\n这取决于迭代次数，哈希值越独特，它就越不像静态的（与此相反）。使用多个随机生成的哈希值通过\
    \ MDS 进行哈希也被认为是一种良好的哈希策略。这样做是有效的。但它无法避免任何可以通过软件或硬件完成的攻击。由于其特征是静态的，当应用程序的设计缺陷被利用且利用程度超过预期时，可能会阻止重放攻击（Replay\
    \ attacks）。\n\n攻击者在大量网站上搜索信息和密码。我们的分析师显示，攻击者很容易获得直接访问和几乎所有的账户。如图所示。\n\n# 网络安全\n\
