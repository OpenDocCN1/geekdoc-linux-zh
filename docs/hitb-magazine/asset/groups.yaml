    \ conduct attacks on their information. However, most of the threats come from\
    \ various international organizations. These types of attacks are described as\
    \ targeted attacks that are pre-selected\n\n+   1. Infection Through Third Party\
    \ Connection (Infectments, Outbound Links)\n2. Outbreaks From Data Centers (Malware\
    \ Infection - Can be So XXX occurs)\n3. Exploitation of vulnerability in software\n\
    \nMalware is spreading through the increasing of third party connection from the\
    \ internet. We have seen various related content from different websites and users\
    \ that use a central point for information sharing. However, most of the threats\
    \ are not restricted to the primary website which we focus on. Vulnerabilities\
    \ play a critical role in the dissemination of malware. Lastly, data center infection\
    \ also results in massive scale only for infecting servers. My continuous analysis\
    \ reveals the fact that attacks are exploited at a large scale for infecting servers.\
    \ How to spread malware is the growing infection attack vector to exploit the\
    \ threat of social connection. Furthermore, short URLs are used in Twitter to\
    \ also enable malware to hide the actual attack content.\n\nThe hackers hackers\
    \ are tracking the rabbit hole with efficient structural and technological components\
    \ which help to drive some methodology of hacking. In the past, I have seen many\
    \ hackers in China as XF and to the best of my knowledge, Chinese hackers are\
    \ increasingly becoming successful in deploying and making such attacks. The methods\
