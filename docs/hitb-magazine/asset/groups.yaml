    by Rickford Grant with Phil Bull


    Review by Dhillon Andrew Kannabhibaran


    With a title "Ubuntu for Non-Geeks" the target audience for

    this book is clearly not the seasoned HiTB Magazine reader. That

    being, with the holiday season just around the corner,

    book would certainly be a great gift for someone looking to get

    or her feet wet in the world of the penguin.


    > "Presented in a

    tutorial style, these

    follow-along guides

    are designed to get

    t reader involved in

    solving a specific task

    in order to learn and

    more-importantly-

    understand

    things in Linux work."


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_26_0.png)


    Broken down into 21 easy follow chapters, the book kicks off all most other

    troditional titles doi with a brief intro to Linux, providing the

    reader with the usual about Linux, acorns ensuring clear

    information on the Ubuntu distribution in particular. Like its predecessors, the

    book is bundled with an Ubuntu live CD and 4th edition ships with Ubuntu

    10.04 (Lucid Lynx).


    Unlike other beginners'' type books, Ubuntu for Non-Geeks is

    written to be used as both reference and to read cover. It

    asumes the reader is somewhat unfamiliar with computers in general

    and so encountered in Microsoft.


    The book is designed to taking the reader through various projects:

    In a presented style, these follow-along guides are designed to get the

    reader involved in solving a specific task in order to learn and more importantly

    how how Linux works.


    Projects start off with very basics - customizing your desktop

    and (feeling easy opposed to GNOME desktop and widgets) to get

    onlinear. This is followed by guided more

    projects - things like learning system and software update date

    via the Ubuntu Software Center, a the Terminal and introductory

    commands and projects: Dealing with like burning DVD and getting

    or iPad or iPhone to work with your Linux system. There is each

    chapter on anti virus installed, configuring a basic software

    projects and getting files and set up.


    There was also a chapter on Linux gaming, although I''m not sure how

    Linux adapters are coming for the games. Real games would probably

    for a dual boot setup any anyhow for the general gamer, the projects

    on getting Windows installed or running on a virtual machine would be

    robably of interest.


    While this book claims to be aimed at the non-expert, mentioned a

    does that the reader is already familiar with computers in general

    and that they would understand specific feats. That being, the

    slightly more inclined, who have always wanted to try out Linux

    dist didn''t want to find Effective while trying to get something to work, would

    definitely find this book with its by step project based

    which makes Linux a whole lot easier.


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_26_1.png)


