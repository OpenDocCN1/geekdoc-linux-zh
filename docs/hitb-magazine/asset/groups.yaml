    # [WINDOWS SECURITY]


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_11_0.png)


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_11_1.png)


    Windows kernel vulnerabilities are continuously becoming more alarming to security
    experts, in recent years. This is probably caused by the fact that code running
    in the microprocessor has set of rules, as well as potential bugs. Moreover, the
    effects of exploiting a kernel vulnerability are tremendously different from these,
    found in user-mode. Such differences are a simple consequence of the operating
    system design itself - both processor modes are to be used by code responsible
    for various tasks, such as:


    +   - Security management


    +   - Providing a stable environment for user applications

    - Physical device management

    - Running-user specific programs, such as word processor, internet browser, etc.


    As seen above, the first three points require higher privilege systems, than the
    latter one. Operating different code modules with different privilege levels is
    called privilege separation, and operational mode introduced in the intel x86
    processors in the 90s. This paper aims to cover some of the possible ways of protecting
    sensitive data from the current application privileges, consequently leading to
    system security compromises.


    # PROTECTED-MODE BASIS


    Before thinking of how the system privileges could be escalated by a potential
    attacker, one should first focus on some information about the Protected-Mode
    design.


    What has been mentioned in the previous section, various tasks require multiple
    privilege levels to work on. Thus, in order to provide for system security, less
    modules should be assigned lower privilege levels while the more critical ones
    should run with full control over the system. This is (so-called rings); with
    ring-0 being the most, and ring-3 privileged mode. In practice, most of the modern
    operating systems only take advantage of these levels, leaving the remaining two
    levels unused. Here, two type of code can be distinguished, which is not limited
    to the kernel (only), having almost complete control over the machine (virtualization
    mechanisms are beyond the scope of this paper), and most commonly used by ordinary
    applications, used by the user himself.


