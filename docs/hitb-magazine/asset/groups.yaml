    \ 分钟了 -\n\n```\nhttps://:8443\nusername: root\npassword: password\nPlask:\nusername:\
    \ admin\npassword: password\n```\n\n![](img/27dc30d9ee9d016ae2e2400b49269e56_5_0.png)\n\
    \n# 关于作者\n\nAditya K. Sood 是密歇根州立大学的博士生。他曾在 Armorize、COSEINC 和 KPMG 等安全领域工作。他是独立研究公司\
    \ SecNiche 的创始人。他曾在 RSA (2010)、TRISC、Echelon、XCON、TLR、OWASP、AppSec、CERT-CC 等会议演讲。\n\
