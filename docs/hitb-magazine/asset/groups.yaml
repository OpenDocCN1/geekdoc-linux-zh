    通过我们实现的 API，我们支持调用其他函数，传递参数（传递给句柄）并通过调用控制台分发（我们知道的地址）来显示序列。


    同时，我们将回到控制台主机的开头，逐步执行一个工作中的指令以查看控制台主机是如何工作的。


