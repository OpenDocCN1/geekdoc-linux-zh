    # # Notorious Datacenter Support Systems - Pwning through Outer Sphere


    # ## Exploitation Analysis of Help Desk Systems


    **Aditya K. Sood, SecNiche Security**

    **Rohit Bansal, Security Researcher, SecNiche Security**


    The online world has been encountering massive levels of malware attacks in the
    recent times. The outbreak of injected malware has reinforced its devastating
    stance on contaminating a large number of websites. Most of the traces have been
    found in the websites under shared and virtual hosting which further includes
    content from third party delivery networks. Well, it''s the truth that a minor
    inherited weakness in applied software can cause havoc if exploited appropriately.
    Recent malware attacks have endorsed this fact. This paper talks about the techniques
    used by malware writers engaged in performing continuous analysis of differential
    malware. The paper aims at knowledge sharing by presenting the layout of datacenter
    compromises through simple support systems used for assisting the customers. The
    reality of support system shows the nature of insecure work functionality which
    is exploited heavily by malware writers. This paper is an outcome of real time
    analysis of compromised systems. This paper has been generalized for security
    and responsible disclosure reasons.


    # NETWORK SECURITY


    # NETWORK SECURITY


    # REALITY OF SUPPORT SUITES AND SYSTEMS


    Vulnerability play a critical role in the determination of an application. It
    also depends on the type of application being considered and the risk. It can
    place on the other departments and client services are being hosted at a large
    scale in the real time environment. Most of the mass attacks have data entry in
    production. There are a number of the services there are certain truths about
    support suites that are used to manage client requests and which can be understood
    as:


    set of access based on the network configuration by default. The login projects
    are presented in figure 1.


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_3_0.png)


    # Support Center


    | Field | | |

    |---|---|---|

    | Username | | Login |

    | Password | | |


    In the provision of help desk infrastructure is also one part of ongoing process
    of third party service. The databases are hosted on the cloud and on that basis,
    the support suites are used as the backend providers to provide services to the
    users requested by the client.


    | Knowledge Base | Community Forums |

    |---|---|---|

    | Search for help | Discuss about problems |


    ![](img/27dc30d9ee9d016ae2e2400b49269e56_3_1.png)


    | ID | Description | Date |

    |---|---|---|

    | 5694 | What are the tickets for our support? | 04 Jan 2018 |

    | 5695 | Become - some error issues tickets heading | 03 Jan 2018 |

    | 5696 | Come some error is going to help off | 02 Jan 2018 |

    | 5697 | I have a problem with tickets de- | 01 Jan 2018 |

    | 5698 | Internal server error | 01 Jan 2018 |


    - Username:

    Password: No

    Remember: Yes


    The biggest problem for users is that the support system is not working in the
    principles of security, which is provided by an interface layer between user generated
    requests and the backend administration.


    This explains the help desk and support system.


    - a) The service used support systems to manage client requests. Actually it is
    used by the client who wants to issue requests and report about the services provided
    by the hosting provider. This is part of good business practice in order to develop
    and interact with them indentively.


    # SUPPORT SYSTEM WEEKNESS AND EXPLOITATION METHODS


    We practice this not good design practice in the real environment. The support
    system is a type of web application which is of the same belongs as other web
    applications. The design flaw of the web application is that the registration
    is used to identify users without any identity. This allows an attacker to access
    the system. Once performed, the support suite receives it. It provides it an edge
    to attack the system. The link is noted in the real network.


    - b) The client will go to the support system who want to request the issue.


    The help desk helps open the door for a large number of users from different visitors
    from the websites or support centers. In our analysis we found a number of vulnerabilities
    to be exploited in the real world where help centers are located.


    - c) Administrator request level to manage all of functioning of the hosting provider.


    - A) The Ticket is issued from help from different types of visitors in the real
    working of the ticket system has been explained in last. The ticket is registered
    without any identity except check. In the system, a customer can use any name
    or email after any period of provided to the user registration after which it
    is a normal procedure. After this process, the customer sends his query to the
    support staff.


    A user issues a ticket to the support system with the request. This is an outer
    sphere of security. The support suite verifies the ticket by asking for some information
    from the customer in order to confirm the customer''s identity.


    Once it is done, the support system sends an email or normal support request that
    forwards to the administrator. If the response is not as expected, an intermediate
    step is made to check the security. After the action, the support system communicates
    back with the customer once the response is received from the administrator.


    - b) The support system uses three types of logins, administrator and support.
    All these users logins have access to


    B) The second object which has characteristics for compelling the help desk support
    systems is vulnerable in the web application interface. An attacker can use the
    XSS vulnerability in the application to combine with a design in the ticketing
    system to steal the cookies of a user. The matter is whether account parameters
    are saved to avoid stealing cookies. There are advanced methods for stealing cookies

