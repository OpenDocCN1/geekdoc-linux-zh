    /Outlines /Pages-3-0 R

    ```


    Before we investigate the code, we need to know more about JavaScript in the PDF.
    The PDF language allows JavaScript execution. JavaScript scripts are found inside
    the PDF document. These scripts are executed by the PDF engine. The JavaScript
    engine is sandboxed, it has no access to the operating system files. A JavaScript
    engine cannot access (read/write) attributes of files or registry keys.'
