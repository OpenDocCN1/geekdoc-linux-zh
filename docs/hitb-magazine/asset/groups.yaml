    TEHTRI-Security is an innovative French company specialising in Consultancy and
    Expertise for Information and Communication Technology.


    Dear Reader,

    Welcome to our fourth issue of 2010! This issue is released in conjunction with
    HitSecConf2010 KL. We''ve had a great first print year and it''s all due to you,
    loyal readers. Since the first issue back in January, we''ve seen our help field
    membership increase in successes. So thank you for your continuing support, and
    we were excited to bring you this fourth issue which wraps up 2010.


    This issue also explores an analysis of help-desk queries by Aditya K. In his
    article, ''Notorious Datacenter Support Systems Decrypting TrueValues with a Physical
    Memory Dump'' shows a method to return the encryption keys from memory. Jean-Baptiste
    Bedouin is in fact presenting his talk on cracking DRM today at HitSecConf2010
    Kuala Lumpur.


    Volume 1, Issue 4, October 2010


    This issue also brings back favourite articles from earlier issues - thanks for
    your feedback over all four issues!


    We''ll be back in 2011 with even more cool pools, news and research!


