    \n# [BOOK REVIEW]\n\n# # UBUNTU for Non-Geeks\nA Pain-Free, Get-Things-Done Guide\n\
    by Rickford Grant with Phil Bull\n\nReview by Dhillon Andrew Kannabhibaran\n\n\
    With a title \"Ubuntu for Non-Geeks\" the target audience for this book is clearly\
    \ not the seasoned HiTB Magazine reader. That being, with the holiday season just\
    \ around the corner, book would certainly be a great gift for someone looking\
    \ to get on feet in the world of the penguin.\n\n\"Presented in a tutorial style,\
    \ these follow-along guides are designed to get the reader involved in solving\
    \ a specific task in order to learn and more importantly understand how Linux\
    \ works.\"\n\n![](img/27dc30d9ee9d016ae2e2400b49269e56_26_0.png)\n\nBroken down\
    \ into 21 easy chapters, the book kicks off all most other titles with a brief\
    \ intro to Linux, providing the reader with the usual about Linux distribution.\
    \ Like its predecessors, the book is bundled with an Ubuntu live CD and 4th edition\
    \ ships with 10.04 (Lucid Lynx).\n\nUnlike other beginners' type books, Ubuntu\
    \ for Non-Geeks is written to be used as both reference and to read. It assumes\
    \ the reader is somewhat unfamiliar with computers in general and that they would\
    \ understand specific feats. That being, the slightly more inclined, who have\
    \ always wanted to try out Linux dist didn't want to find Effective while trying\
    \ to get something to work, would definitely find this book with its by step project\
    \ based which makes Linux a whole lot easier.\n\n![](img/27dc30d9ee9d016ae2e2400b49269e56_26_1.png)\n\
    \nUBUNTU for Non-Geeks\n4th Edition\nAuthor: Rickford Grant & Phil Bull\nPublisher:\
    \ No Start Press\nPages: 496, cd\nISBN: 978-1-5927-257-9\n\n52 HiTB MAGAZINE OCTOBER\
    \ 2010\n\nOCTOBER 2010 HiTB MAGAZINE 53\n"
