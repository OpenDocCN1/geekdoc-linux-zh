    \n![](img/27dc30d9ee9d016ae2e2400b49269e56_24_2.png)\n\n处理方法：UNIX 的主要工作是在于将 Dalvik\
    \ 字节码转换为 JVM 指令。我们提取元数据，转换指令并为每个 Dalvik 生成中间表示（IR）。这种方法涉及将元数据转换为 IR 方法、提取方法签名、设置局部变量，并将\
    \ Dalvik 寄存器映射到 JVM 栈位置。图中显示了该过程的片段代码。\n\n生成 Java 指令：从 Dalvik 指令创建 IR 的细节非常详尽。首先，为每个\
    \ Dalvik 指令创建 IR，以处理准备好的前向跳转。然后，为每个 Dalvik 指令创建一个等效的 JVM 字节码块。在转换过程中，UNIX 极力追求效率。并不是每条指令都能实现一比一的转换；Dalvik\
    \ 和 JVM 之间存在差异，如图 9 和图 10 所示。以下说明了该方法。我们实现了对某些不变构造的验证，在这些构造中我们将 Dalvik 寄存器分配到了\
    \ JVM 栈位置。\n\n为了在处理操作时尽可能遵守栈平衡规则，从而尽可能少地违反验证器规则。每种数据都提供栈上对象引用的类型引用（构建数据流分析）。这通常需要为不同类型的对象准备寄存器。这一细节说明了移动设备的硬件和内存限制如何影响了架构的设计。\n\
    \n存储在 BCEL 结构中的数据：在解析类中的所有方法后，处理完成，我们在 dex 中为每个类生成了类文件。\n\n代码的静态分析\n现在我们已经从 Dalvik\
    \ 代码生成了内容，我们可以做什么？我们可以使用静态检查工具（如 findbugs）分析代码，以发现程序漏洞、安全漏洞和泄漏，可以使用我们可以反向的工具，并且已经了解到自动化工具可以找到目录（AD,\
    \ DEX）中的文件，参见图 15，显示类 Java 代码以加速理解，这可能证明你获得的是等效内容而非 100% 确定的内容。由于它们之间经历了复杂的转换过程，它们的效果存在差异，例如将栈变量转换为控制流图（如\
    \ findbugs 提供的），并将其绘制在您所选择的布局图图中。图 16 显示了使用 dia 的这种方法。\n\n## 总结与趣闻\nINDEX 包含大约\
    \ 400 行 Java 编写的代码，除此外没有外部依赖，但我们可以将其作为 GUI 并为项目做出贡献，因为许可者正维护着免费的 GPL 代码。代码可以在\
    \ http://github.com/undx/undx 获取。\n\n此时，我们可以向 Dan Borstein（再次致谢）感谢他使用了 UNDX 的名称。\n\
    \n## 关于作者\nMarc Schönebeck 自 2002 年以来一直是国际会议的知名演讲者。他曾在 BlackHat、RSA、DMAC、PaCon、Sec、HackInBerlin\
    \ 和其他主要会议上发表过演讲。他在 2010 年在汉堡大学获得博士学位。白天在 Flat Hat 从事 Java 和 JEE 安全相关课题。他在 AEC\
    \ illegalsec dot 上有记录。\n\n在某些情况下，由于缺乏混淆导致无法反编译，建议使用文件比较。\n\n尽管真正的工程师更喜欢代码，但 UNDX\
    \ 也可以在 RE 足球联赛中竞争，使用更多的图并消耗更少的资源。如果你想这样做，可以用一个 20 行的 Groovy 脚本，并传输节点和\n\n![](img/27dc30d9ee9d016ae2e2400b49269e56_25_0.png)\n\
