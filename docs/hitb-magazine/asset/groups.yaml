    与此同时，Conway 总是通过查看源代码查看几乎属于他自己的 ANSI 控制台 `cmd.exe` 所有者。他还注意到 `cmd.exe` 使用此函数来打印每种输出（控制台输出）的优势，通过将这些地方替换为对
    Console API 的适当调用，以识别那些要显示的序列。


