    8.  Monitoring VM and LinuxThis chapter is based on work done monitoring Oracle
    on Linux on VM in IBMMontpellier and at Oracle HQ in Redwood Shores. We used ESALPS
    softwarefrom Velocity Software for our tool. See “ESALPS overview” on page  224
    formore details.8[](#chapter-102.xhtml_pfea)172 Experiences with Oracle 10g Database
    for Linux on zSeries8.1 Oracle measurementsThe environment used for these measurements
    was a 32-processor z990, ofwhich 16 processors were dedicated to the z/VM LPAR.
    The VM LPARconfiguration included 40 GB of main storage and 14 GB of expanded
    storage.z/VM 4.4 was utilized, but no significant changes were expected if we
    had usedz/VM 5.1.8.2 Configuration guidelinesIn the z/VM shared resource environment,
    the objective is to share the resourcesas effectively as possible. In a shared
    resource environment, any serverrequiring excessive levels of a resource takes
    away from other servers’ abilitiesto use that resource. Minimizing and controlling
    each server’s resourceconsumption is critical. The following guidelines focus
    on minimizing resourcerequirements, sharing resources, and providing optimal service
    levels in anOracle for Linux on zSeries with z/VM environment.The following sections
    discuss various guidelines for configuring your z/VM andLinux environment. Other
    recommendations can be found in the Web pagesprovided by z/VM development. See:http://www.vm.ibm.com/perf/tips/2gstorag.html8.2.1
    Minimize Total Storage Footprint®The storage requirement of a Linux guest of z/VM
    should be reduced as much aspossible. This is a shared resource environment where
    memory used by oneserver takes memory resource away from other servers. Linux
    tends to use allstorage defined to it, so theworking set size of the Linux guest
    usuallyapproaches the size of the virtual machine. On other platforms, without
    z/VM,performance is usually improved by adding memory. In the z/VM environment,however,price/performance
    is improved by sharing resources effectively. Givingservers more storage than
    they need impacts all other servers.There are two parts to this requirement. The
    first requirement is to reduce theoverall storage requirement by minimizing the
    virtual machine size andeliminating unneeded processes.The second requirement
    is to reduce the requirement for z/VM storage below the2 GB bar. In measurements
    in z/VM 4.4, contention for storage below 2 GBproved to be a serious bottleneck.
    Many of the following guidelines help toaddress this issue. Technology is rapidly
    changing, with improvements being[](http://www.vm.ibm.com/perf/tips/2gstorag.html)Chapter
    8\. Monitoring VM and Linux 173made both to Linux and to z/VM that will reduce
    or eliminate this bottleneck. Untilthis newer technology is available, we recommend
    that you implement therecommendations in the following sections.One of the obvious
    ways to reduce the impact of the 2 GB issue in z/VM is to usethe Fixed Buffer
    option available in SLES9 SP1 and in RHEL4 Update 1\. Seehttp://www-128.ibm.com/developerworks/linux/linux390/perf/index.htmland
    click Fixed I/O buffers for more information, including how to enable thisoption.The
    following ESAUCD2 report (Linux Memory Analysis) from ESALPS showsseveral Linux
    servers, most of which were defined as 2 GB virtual machines. Thedata in the report
    is provided from inside Linux using the NETSNMP agent.Storage is broken down into
    storage in use and storage available.The servers that have almost 2 GB of available
    storage are likely very lightlyloaded. Linux will consume real storage as cache
    whenever possible. If serverscontinuously have large amounts of available storage,
    or a large amount ofstorage in use as cache, then the size of the server should
    be reduced by at leasthalf of the available storage.To make the most efficient
    use of real memory, Linux automatically uses all freeRAM for buffer cache, but
    also automatically makes the cache smaller whenprograms need more memory. The
    amount of storage used for buffer cache isreported in the right-hand column of
    the ESAUCD2 report, as shown inFigure 8-1 on page 174\. This is the amount of
    storage currently allocated tocache. When Oracle starts up, it will allocate the
    SGA. The amount of storage inthe cache will be reduced to allocate the storage
    for the Oracle SGA.If there is no swap storage used, then there was always sufficient
    storage tomeet the requirements in the Linux guest so far. If no swap storage
    was usedand the cache size is very large, then you could reduce the virtual machine
    sizeso that the cache size is 50 MB to 100 MB larger than the SGA. As long as
    swapstorage remains little or unused, then the storage size is sufficient.[](http://www-128.ibm.com/developerworks/linux/linux390/perf/index.html)[](#chapter-103.xhtml_pfb8)![](Images/bgb8.png)174
    Experiences with Oracle 10g Database for Linux on zSeriesFigure 8-1 ESAUCD2 report
    (Linux memory analysis)8.2.2 SGA must fit in memoryThe Oracle SGA is virtual storage,
    and you could define an SGA larger than theLinux server, but this is definitely
    not recommended. When the SGA is largerthan available memory, you will see high
    rates of Linux swapping. Free storagein Linux is assigned to the disk cache. If
    this storage is required, say to back apage of the SGA, the page will be removed
    from the cache and assigned to theSGA. In this way you can think of extra cache
    as available storage.The SGA size is normally set by specifying each component
