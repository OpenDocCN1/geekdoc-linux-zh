    option is enabled by specifyingfilesystemio_options=directIO in the init.ora parameter
    file. Obviously, the use ofdirect I/O will not help if the total size of the db_buffers
    in Oracle is more than 2GB. If the total size is more than 2 GB, then you should
    ensure the you are usingfixed I/O buffers as discussed in “Use Oracle direct I/O”
    on page 175.8.2.4 Use virtual disk for swapWith virtual machines being defined
    as small as possible to effectively sharememory, there is a potential problem
    of running out of memory. When Linux runsout of real pages of memory, the killmem
    process runs, trying to kill processes inthe system that are using large amounts
    of memory. Often the processes killedare essential to Oracle operation, and the
    system fails. This problem is resolvedby providing swap space, so that Linux can
    move assigned pages to the swapfile to free them. The best device for swap in
    this shared resource environment isa virtual disk. Define a large amount of virtual
    disk for each Linux server forswap. Possibly you will need to increase the system
    and user limits for virtualdisk with the commands shown in Example 8-1.Example
    8-1 VDISK limitsSET VDISK SYSLIM INFINITESET VDISK USERLIM 2GIt is fairly safe
    to define virtual disk in large amounts, as the cost to defining thestorage is
    almost nothing. The pages in the virtual disk are only allocated whenreferenced,
    and then it is allocated in normal z/VM storage as any other addressspace page.
    These pages are pageable when un-referenced, and may be pagedout to expanded storage
    and Disk paging storage. However, you should note thatthe DAT structures to create
    the VDISK (segment tables and PGMBKs) aredefined as non-pageable and must reside
    below 2 GB. Over defining them couldactually add to contention below 2 GB.Define
    multiple virtual disks for swapOne other very useful guideline for virtual disk
    for swap is to define two or threevirtual disks and prioritize them, rather than
    just one large virtual disk. When theswap disks are assigned a priority, Linux
    will use the first disk until it iscompletely full, and then will start using
    the second disk. The reason this is usefulto implement is because of the way Linux
    allocates swap areas. It allocates usinga moving cursor from the front of the
    space to the end of the space. This forcesall of the space to be allocated over
    time by z/VM. If the size of the first virtualdisk is smaller than the maximum
    requirement, then Linux will never startallocating into the second virtual disk.
    This reduces the overall requirementsplaced on the z/VM storage subsystem.[](#chapter-106.xhtml_pfb9)[](#chapter-106.xhtml_pfba)![](Images/bgbb.png)Chapter
