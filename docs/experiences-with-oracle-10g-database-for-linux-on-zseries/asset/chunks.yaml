    10g Database for Linux on zSeries![](Images/bga3.png)© Copyright IBM Corp. 2005\.
    All rights reserved.  55Chapter 4.  Installing an Oracle 10gDatabase with ASMThis
    chapter describes the new Automated Storage Manager (ASM) that isavailable with
    Oracle Database 10g.This is an example of the creation of a single database instance
    choosing theASM option for the disk storage for the database files.456 Experiences
    with Oracle 10g Database for Linux on zSeries4.1 ASM overviewOne of the new features
    coming with Oracle 10g is the Automatic StorageManagement (ASM). It integrates
    into the database product the capabilities ofboth a Volume Manager and a file
    system, and relieves the DBA of most of thepainful tasks of storage administration.
    Through simplified interfaces, ASMmakes storage management and provisioning easy,
    flexible, and dynamic.Key features of ASM are summarized in the Oracle white paper
    Oracle 10g ASMtechnical best practices by Nitin Vengurlekar. The full document
    can be found onmetalink at:http://metalink.oracle.com/metalink/plsql/showdoc?db=NOT&id=265633.1As
    described in this document, the key ASM features are:򐂰  I/O is spread evenly across
    all available disk drives to prevent hot spots andmaximize performance.򐂰  Inherent
    large file support.򐂰  Performs automatic online redistribution after the incremental
    addition orremoval of storage capacity.򐂰  Maintains redundant copies of data to
    provide fault tolerance, or it can be builton top of vendor-supplied reliable
    storage mechanisms.򐂰  Provides database storage management for single SMP machines,
    or acrossmultiple nodes of a cluster for Oracle Real Application Clusters (RAC)support.򐂰  Leverage
    redundancy from intelligent storage arrays.򐂰  For simplicity and easier migration
    to ASM, 10gwill allow the co-existence ofASM and non-ASM files. Any new files
    can be created as ASM files whileexisting files can also be migrated to ASM.򐂰  New
    RMAN commands enable non-ASM managed files to be relocated to anASM diskgroup.򐂰  10gEnterprise
    Manager can manage most ASM disk and file managementactivities.4.2 Setting up
    ASMOn Linux for Intel, Oracle offers two alternatives to use ASM. The first is
    to useASM as provided with Oracle 10g code. It implies the use of raw disks (characterdevices)
    to store the data. The second does not require raw devices, since thedisks being
    accessed as block devices. It allows for more advanced performance[](http://metalink.oracle.com/metalink/plsql/showdoc?db=NOT&id=265633.1)![](Images/bg43.png)Chapter
    4\. Installing an Oracle 10g Database with ASM 57options, but it requires some
    external components. The ASM.LIB driver andutilities and OCFS2, which are downloadable
    from the OTN Web site, should beavailable late in 2005 for zSeries. So far, these
    components have not been madeavailable on Linux on zSeries.4.3 Binding disks to
    raw devicesUsing raw disks is therefore the only option available for ASM on Linux
    onzSeries. The first step is to configure some raw devices to be bound with realdisks
    at boot time. SLES8 provides a configuration file for that purpose: /etc/raw(RedHat
    uses /etc/sysconfig/rawdevices).Example 4-1 Raw devices definitions in /etc/raw#
    /etc/raw## sample configuration to bind raw devices# to block devices## The format
    of this file is:# raw<N>:<blockdev>## example:# ---------# raw1:hdb1## this means:
    bind /dev/raw/raw1 to /dev/hdb1## ...raw1:dasdc1raw2:dasdd1The above definition
    will bind disks dasdc1 and dasdd1, respectively, with rawdevices /dev/raw/raw1
    and /dev/raw/raw2.The raw devices binding can be activated dynamically using theraw
    script in/etc/init.d, and the devices status can be checked with the raw -qa command.Example
    4-2 Raw devices activation and statusoracle3:/etc # /etc/init.d/raw startbind
    /dev/raw/raw1 to /dev/dasdc1... donebind /dev/raw/raw2 to /dev/dasdd1... doneoracle3:/etc
    # raw -qa/dev/raw/raw1: bound to major 94, minor 9![](Images/bg44.png)58 Experiences
    with Oracle 10g Database for Linux on zSeries/dev/raw/raw2: bound to major 94,
    minor 13The last step is to make sure that the Oracle user is authorized to access
    the rawdevices. By default, raw devices are owned by userroot and group disk.
    It istherefore necessary to change the ownership using the chown command:chown
    oracle:disk /dev/raw/raw*4.4 Configuring ASM instance using DBCAPrior to creating
    a database using ASM, we need to create an ASM instance. Itcan be seen as a uniquestorage
    service provider for all the database instancesrunning on the same Linux system.
    An ASM instance does not contain anydatafiles, and requires only a few parameters
    in the init.ora file. In the case ofseveral systems operating within a RAC cluster,
    then one ASM instance isrequired on each of the systems.The DBCA utility can be
    used to create an ASM instance. Launch the DBCAutility and start the dialog to
    create a new database until step 6 - StorageOptions.Tip: To activate raw devices
    binding at boot time, use the following command:/sbin/chkconfig raw on![](Images/bg45.png)Chapter
    4\. Installing an Oracle 10g Database with ASM 59Figure 4-1 Step 6 - Storage optionsIn
    the Storage Options window select ASM and click Next. If this is the first timeASM
    is used, the Create ASM instance panel is presented.![](Images/bg46.png)60 Experiences
    with Oracle 10g Database for Linux on zSeriesFigure 4-2 Step 7 - Create ASM instanceFilling
    the password field and then clicking the Next button will initiate thecreation
    of the ASM instance, and a pop-up asking for confirmation will appear.Figure 4-3
    ASM instance creation confirmationAttention: Even when working in a single instance
    (non-clustered), ASMrequires that the Cluster Synchronization Services (CSS) are
    installed andworking properly. CSS is used to preserve synchronization between
    ASM anddatabases instances.![](Images/bg47.png)Chapter 4\. Installing an Oracle
    10g Database with ASM 61The ASM parameters should be left to defaults in most
    cases. However, if somechanges are needed then the ASM parameters button in the
    previous window willdisplay a panel with all parameters listed as below.Figure
    4-4 ASM parametersOnce the ASM instance has been started successfully, it is time
    to define adiskgroup and to include some disks into it. A diskgroup is the highest
    levelstorage structure in ASM; it can be compared to a Volume Group in LVM. Oraclerecommends
    using only two diskgroups per ASM instance: One for the databasefiles and one
    for the Flash Recovery Area, containing all backup andrecovery-related files.
    This is done in the next window.![](Images/bg48.png)62 Experiences with Oracle
    10g Database for Linux on zSeriesFigure 4-5 ASM diskgroupsClick the Create New
    button in the ASM Disk Group window.ASM will scan the defined discovery path to
    check which disks are configured foruse. On Linux, this path is set by default
    to /dev/raw/* in order to discover all theraw devices. The next window should
    show the raw devices that have beenpreviously defined, which ones are available
    (candidate) for use, and which onesare already in use.![](Images/bg49.png)Chapter
    4\. Installing an Oracle 10g Database with ASM 63Figure 4-6 Create Disk GroupAfter
    a name is entered for the diskgroup, the redundancy level must be chosen,and the
    disks to be included in that diskgroup must be selected.ASM provides three levels
    of redundancy. Redundancy can be seen asmirroring, the base unit for mirroring
    being the block of data, not the physicaldisk. This ensures better performance,
    and a more rationale use of space—thatis, there is no one single pool of disks
    used as base, and another pool as mirrorimage; each disk can receive any kind
    of block. (ASM must make sure a blockand its mirror images never end up onto the
    same disks.)򐂰Normal is the default and provides in two ways software mirroring
    (each blockof data is mirrored once).򐂰High provides for 3-way mirroring.򐂰External
    ensures no mirroring at the software level, and assumes it isprovided externally.
    It may be accurate on a zSeries platform, as lots of efforthas been made on storage
    subsystems like ESS to provide hardwarereliability: No single points of failure
    and the ability to configure disks inRAID-5 or RAID-10\. See ESS redbooks.![](Images/bg4a.png)64
