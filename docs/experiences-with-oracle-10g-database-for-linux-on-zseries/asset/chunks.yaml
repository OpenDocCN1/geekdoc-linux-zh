    Experiences with Oracle 10g Database for Linux on zSeries![](Images/bga3.png)©
    Copyright IBM Corp. 2005  1Chapter 1.  Overview of OracleDatabase 10g for Linux
    onzSeriesOracle released Oracle9i Database Server for Linux on zSeries in August
    2002\.Since that time, many customers have consolidated database instances on
    toLinux guests on zSeries. In October 2004, Oracle released Oracle Database 10g(10.1.0.3).
    Several IBM sites have installed and tested the code. This documentshares some
    of the experiences from these installations and from thedevelopment environment
    used at Oracle in Redwood Shores.This chapter is an overview of Linux on zSeries
    and Oracle solutions.12 Experiences with Oracle 10g Database for Linux on zSeries1.1
    What is LinuxLinux is a UNIX®-like operating system initially created by Linus
    Torvalds whenhe was a graduate student in 1991\. The objective for developing
    Linux was todeliver a non-proprietary operating system and application developmentenvironment,
    completely independent of underlying hardware architectures, thatwould offer maximum
    freedom to move applications from one hardware platformto another by simply recompiling
    code, without expensive, labor-intensive portingefforts.Linux is a fully networked
    32-bit/64-bit architecture, that supports multiple users,multitasking, and multiprocessors,
    with a user-friendly Xwindows Graphical UserInterface. Continued development and
    testing of Linux is governed by the OpenSource community, which uses the Internet
    as the primary vehicle for technicalexchange. Linux source code can be downloaded
    free of charge from theInternet, and programmers are free to modify the code.
    However, the integrity ofthe official kernel source code is managed and maintained
    by a strict submissionand review process controlled by the Linux Review Board,
    an internationalstandards body for Linux.Linux, like other Open Source software,
    is distributed under the terms of theGNU Public License (GPL), and is packaged
    and distributed by approveddistributors, such as Caldera, Red Hat, SuSE, and Turbo
    Linux. Distributorpackages include the Linux operating system code that has been
    precompiledfor specific hardware environments, along with other Open Source applicationsand
    middleware, such as Apache Web Server, SAMBA (file/print serving),Jabber (instant
    messaging), and IMAP/POP (mail servers). Distributors also offerLinux services
    and support packages, as does IBM Global Services.1.2 Linux on zSeriesIn 1998
    IBM announced a commitment to support Linux on all its hardwareplatforms, including
    zSeries. The 31-bit version of the Linux operating isavailable from Linux distributors
    for S/390® G5 and G6 processors, and on 64-bitzSeries models. The Linux 64-bit
    support on the zSeries is available on OpenSource and became available from SuSE
    in April 2001.The Linux operating system has been running in a zSeries test environmentsince
    early 1999\. As of December of 1999, the IBM Web site(http://www.ibm.com/servers/eserver/zseries/solutions/s390da/linuxisv.html)
    iscontinually updated to show all the Independent Software Vendors (ISVs)applications
    or infrastructure available for the zSeries platform.[](http://www.ibm.com/servers/eserver/zseries/solutions/s390da/linuxisv.html)Chapter
    1\. Overview of Oracle Database 10g for Linux on zSeries 3Linux on zSeries is
    an ASCII environment that takes advantage of IBM zSerieshardware, especially for
    system availability and I/O performance. Of particularinterest is the ability
    to run many Linux images under z/VM. This provides anexcellent environment for
    server consolidation. It will more fully utilize systemresources and facilitate
    system management.Linux is not a replacement for other IBM operating systems on
    zSeries or S/390,and will coexist with z/OS, OS/390®, and VM/ESA. It supports
    such UNIX toolsas sed, awk and grep, compilers like C, C++, Fortran, Smalltalk,
    and Ada.Network tools like Telnet, ftp, ping, and traceroute are supported as
    well.1.3 Why Oracle9i and Oracle 10g for Linux on zSeriesThe ability to combine
    the hardware characteristics of the IBM zSeries with theopenness of Linux provides
    significant benefits to users.IBM''s zSeries has, over the years, demonstrated
    its unique ability to run multiplediverse work loads. This key strength also applies
    to Linux workloads. zSeries isparticularly well suited to the hosting of multiple
    lightly to moderately loadedservers. (Examples of this type of server would be
    firewall servers, print and fileserving, Domain Name Servers, Internet news servers,
    or Web serving that is notprocessor intensive.) Most IT installations use multiple
    outboard servers toperform these functions. Consolidation of these functions onto
    a single zSeriescan provide the following benefits:򐂰  zSeries qualities of service:
    No other platform offers the qualities of serviceavailable in zSeries and z/VM.򐂰  Reduced
    hardware costs: Processors, storage, memory, etc. are now sharedon a single zSeries.򐂰  Reduced
    software costs: Software licenses spread over several machinesand operating systems
    in most cases are reduced when consolidated ontozSeries processors.򐂰  Reduced
    networking costs: Physical networking gear like routers and cablingare no longer
    necessary on a single zSeries. Servers communicate throughinter-system facilities
    on zSeries (hardware or software).򐂰  More efficient inter-server communication:
    Inter-server communication isfaster than physical networking.򐂰  Reduced systems
    management/support costs: Supporting multiple serverson a single platform requires
    less effort and fewer people.򐂰  Reduced deployment time for new servers: Since
    new servers are addedvirtually instead of physically, the time required to create
    a new server isminutes, not weeks.![](Images/bge.png)4 Experiences with Oracle
    10g Database for Linux on zSeriesLinux on zSeries offers many advantages to customers
    who rely upon z/OSsystems to run their businesses. While z/OS has key strengths
    in the areas ofdata acquisition through high-volume transaction processing and
    datamanagement, its value is enhanced by the addition of Linux on zSeries indifferent
    ways.Linux on zSeries brings the zSeries user the ability to access host data
    efficientlyby using high speed, low latency, inter-partition communication. Benefit
    isderived from the elimination of outboard servers, routers, and other networkinggear,
    reduced floor space, and reduced maintenance cost. Linux also has thewell-earned
    reputation for rapid deployment of applications—giving zSeriesusers a key choice
    in how they choose to deploy an application.Linux on zSeries takes advantage of
    the qualities of service in the zSerieshardware—making it a robust industrial
    strength Linux, while zSeries nativeservices are available for applications that
    require the qualities of serviceinherent in z/OS as well as those of the zSeries
    hardware.There are several other advantages to running Linux on zSeries. They
    aredescribed in the following sections.1.3.1 Expanded application portfolioThe
    non-proprietary environment of Linux opens the door for zSeries to performas an
    application development and deployment server. The Linux applicationportfolio
    will greatly increase the number of applications available to zSeriescustomers
    who want to continue to leverage the critical advantages of theplatform to run
    business applications on a highly available and reliablearchitecture. Customers
    will now have the flexibility to develop new applicationsdirectly for Linux on
    zSeries and run them on any Linux-supported platform; or todevelop and test Linux
    on other platforms, such as the desktop, and then run theapplications for Linux
    on zSeries, with a simple recompile. As applications fromISVs become generally
    available, customers will be able to deploy them quicklyon zSeries without any
    special porting effort.Note: The MP 3000 and 9672 machines are 31-bit only and
    support the s390Linux distributions. Oracle 9i is a 31-bit application and is
    the only Oracle thatthese machines can run. zSeries machines are 64-bit processors
    and can runthe 31-bit (s390) and the 64-bit (s390x) distributions of Linux. The
    s390x Linuxdistribution can run Oracle 10g, which is a 64-bit application, or
    Oracle 9i, a31-bit Oracle database.Chapter 1\. Overview of Oracle Database 10g
    for Linux on zSeries 51.3.2 Cost savingsA new feature designed specifically for
    the Linux operating environment, theIntegrated Facility for Linux (IFL), is now
    available on G5, G6, and all zSeriesserver models including the Multiprise® 3000\.
    The IFL gives you the ability todedicate processors to the Linux operating system
    on a logically partitionedmachine, transparently to the z/OS operating system.
    Processors dedicated tothe Linux LPAR under IFL are priced at a lower rate than
    those for the z/OSenvironment. The added capacity, because it is dedicated to
    Linux workloads,does not increase the software licensing fees of the zSeries environment.Software
    pricing is confined to the capacity of only those processors enabled tothe zSeries
    LPARs on the system. (This reflects pricing as of the publishing ofthis book and
    may have changed since the publication date. Consult your IBMserver sales representative
    to obtain the most current pricing structureinformation.)1.3.3 Server consolidation
    and faster time to marketAll of the great flexibility and openness of Linux combined
    with the outstandingqualities of service of zSeries results in an industrial-strength
    Linux environment.zSeries has several options for partitioning server resources
    into multiple logicalservers. The PR/SM™ hardware feature provides the ability
    to partition thephysical machine into many logical servers (15 on a 9672 and 30
    on a zSeries),or LPARs, with dedicated, or shared, CPU and memory. The z/VM operatingsystem
    allows you to partition an LPAR horizontally into multiple logical operatingsystem
    images. These unique partitioning features provide the capability toquickly and
    easily consolidate a large number of Linux servers onto a singlezSeries server.
    This industry-leading zSeries technology for dynamically sharingprocessing resources
    across multiple logical systems delivers value to the Linuxenvironment not provided
    by any other architecture on the market today.Figure 1-1 on page  6 illustrates
    the typical Linux or UNIX application deploymentstrategy used by most installations
    deploying applications on non-zSeriesservers today.[](#chapter-10.xhtml_pf10)![](Images/bg10.png)6
    Experiences with Oracle 10g Database for Linux on zSeriesFigure 1-1 Linux application
