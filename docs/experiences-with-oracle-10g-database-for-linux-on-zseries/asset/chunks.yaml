    method discussed in this chapter isnot restricted to a particular configuration;
    however, this particular method mayprovide utility in a z/VM environment running
    multiple Linux systems where eachLinux is running an Oracle DB server. The usefulness
    of this method is enhancedfurther if the z/OS system running the centralized Lightweight
    Directory AccessProtocol (LDAP) server is on this same zSeries as the z/VM.An
    Oracle 10g Database server was configured to do external passwordauthentication
    with the Oracle Advanced Security Option (ASO) using a RADIUSserver on Linux.
    The RADIUS server in turn was configured to use LDAP as itsdatabase. The LDAP
    database was on z/OS RACF.Figure 9-1 Order of processingOracle ASO is a RADIUS
    client to the RADIUS server and the RADIUS server isan LDAP client to the z/OS
    LDAP Server. Many of the details on theconfiguration of FreeRADIUS, z/OS LDAP,
    the Oracle DB, and the Oracle clientto use z/OS LDAP as the repository for Oracle
    DB user passwords are discussedin the following sections.9.2 FreeRADIUS on Linux
    on z/OSRADIUS is a client/server security protocol that can be used by the OracleAdvanced
    Security Option (ASO) to do external password authentication ofOracle users. There
