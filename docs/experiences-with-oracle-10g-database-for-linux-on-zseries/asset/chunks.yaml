    suite, including calendar, e-mail, files, voicemail, andworkflow. It enables the
    consolidation of messaging and collaborationChapter 1\. Overview of Oracle Database
    10g for Linux on zSeries 9infrastructure to achieve cost efficiency. Oracle Collaboration
    Suite is supportedin a split tier mode where the database server can be run on
    Linux on zSeries.1.5 What distributions of Linux Oracle supportsOracle9i is a
    31-bit product. Oracle9i for Linux on zSeries runs on SLES8 31 bitand SLES8 64
    bit. There are plans to certify Oracle9i on SLES9.Oracle 10g is a 64-bit product.
    Oracle 10g runs on SLES8 and SLES9 64 bit.There are plans to certify Oracle 10g
    on RedHat 4 U1.The latest information on supported platforms is found at:http://www.otn.oracle.com/support/metalink/content.html1.6
    Obtaining a copy of Oracle Database 10g for Linuxon zSeriesThe Oracle Database
    10g  Server can be purchased through the Oracle Store(https://store.oracle.com/),
    or CD images can be downloaded from theOracle Technical Network (http://otn.oracle.com/).1.7
    Sizing workloads for Oracle10g for Linux on zSeriesThe selection of an application
    to start testing the Oracle10OK, Database Server,or any application for that matter,
    is critical to the success of the test. It makessense to select an application
    that has the characteristics of most of theapplications that would be considered
    for server consolidation. It is veryimportant to get a sizing of the workload
    to be moved to Linux on zSeries. It isalso sensible to start with an application
    that is small or not complicated and usethat as a vehicle for skill building in
    this area.It is important to understand that a sizing is an estimate of capacity
    needs. Theperformance team in Poughkeepsie developed a sizing methodology forequating
    a workload on a UNIX or Intel platform to its equivalent MIPS onzSeries. While
    this process has been generally accurate for several years, it isnot a capacity
    plan. Capacity plans are based on the past performance of asystem. The changing
    capacity needs over time provide an accurate way topredict future needs.If this
    is a new application that has never run before, the sizing becomes a bitmore difficult.
    Predictions can generally be made from testing done during[](http://www.otn.oracle.com/support/metalink/content.html)[](https://store.oracle.com/)[](http://otn.oracle.com/)10
    Experiences with Oracle 10g Database for Linux on zSeriesdevelopment. If this
    is a vendor’s application, they may be able to provide sizingassistance for their
    application in a Linux environment.There are two significant reasons to start
    with a sizing. First, it is important tounderstand the resources needed to run
    the application. This includes peakutilization on this server as well as when
    others peak. The sum of all peaksbecomes important as more servers are moved to
    Linux on zSeries. In fact, thisstep helps start the process of understanding what
