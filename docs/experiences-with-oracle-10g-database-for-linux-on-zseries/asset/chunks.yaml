    of time in Q1, Q2, and Q3, depending on what they are doing. The worstcase (such
    as that shown here) is that the servers remain in Q3 and retain theirstorage,
    even when idle.Standard Linux has a scheduler that wakes up 100 times per second,
    which isevery 10 ms. For the virtual environment this keeps the virtual machinein
    queue,as CP will not drop a user from queue unless it is idle for 300 ms. Waking
    upevery 10 ms to do process accounting and other housekeeping, even when idle,breaks
    the virtualization model.There is a patch, often referred to as the timer patch,
    that is now standard withSLES8 or current releases of RedHat. Disabling the patch
    will increase yourstorage and CPU requirements.sysctl -w kernel.hz_timer=1, or
    echo 1 > /proc/sys/kernel/hz_timer willDISABLE the timer patch, and there will
    be a timer interrupt every 10 ms.sysctl -w kernel.hz_timer=0 or echo 0 > /proc/sys/kernel/hz_timer
    willENABLE the timer patch, and timer interrupts will be much less likely.In the
    following user queue analysis, in a properly working environment, theusers would
    be placed in Q1, Q2, and Q3\. Instead, the virtual machines remainin Q3 indefinitely.
    Q3 is the queue for long-running work. By taking a timerinterrupt every 10 ms,
    the Linux guests appear to be long running. If the virtualmachine never drops
    from queue, its pages will not have their reference bitsreset, and their storage
    will never be trimmed. This must be corrected to providean optimal running virtual
    environment. Note that some of the virtual machinesseem to be counted more than
    one time. These virtual machines have multiplevirtual processors, of which at
    least one is always active and in queue.![](Images/bgbd.png)Chapter 8\. Monitoring
    VM and Linux 179Figure 8-4 ESAUSRQ - User queue and load analysis8.2.6 Use virtual
    switchLinux servers must be allowed to drop from the VM scheduler queue becausethat
    is the only time z/VM will trim their storage to be trimmed and page outunreferenced
    pages. In cases where the Linux servers do not drop from queue,their storage remains
    assigned, and will be in real storage even if the server iscompletely idle. This
    holds resources at the expense of the servers currentlyperforming work. Besides
    the above-mentioned timer patch, another reason forLinux servers to remain in
    queue is active I/O. Servers waiting for an active I/Ooperation, including I/O
    for most communications adapters such as virtualchannel-to-channel or dedicated
    OSA adapters, do not drop from queue.Until z/VM 4.4 APAR VM63282, a server with
    outstanding I/O to a dedicatedOSA adapter will not drop from queue. A server with
    a dedicated OSA adapterthat runs a batch workload overnight will retain its storage,
    including any storageallocated below the 2 GB bar, even though completely idle
    during the day. ThisAPAR is built into the z/VM 5.1 base, and so dedicated OSA
    adapters can beused safely.As of z/VM 4.4, servers attached to a guest LAN or
    utilizing a VSWITCH (virtualswitch) to access the Internet are eligible to drop
    from queue while waiting fornetwork I/O. The virtual switch is also expected to
    use much less resource thanhaving a guest Linux act as a virtual router.Report:
