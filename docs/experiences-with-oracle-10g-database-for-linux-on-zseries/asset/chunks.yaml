    PartNo. B10766-08.5.2.9 Set up ssh to work without passwordBefore you install
    and use Oracle Real Application clusters, you must configuresecureshell (SSH)
    for the oracle user on all cluster nodes. The Oracle Installeruses the ssh and
    scp commands during installation to run remote commands onand copy files to the
    other cluster nodes. You must configure SSH so that thesecommands do not prompt
    for a password.To configure SSH, complete the following steps on each cluster
    node:1.  Log in as the oracle user.2.  If necessary, create the .ssh directory
    in the oracle user’s home directory andset the correct permissions on it:$ mkdir
    ~/.ssh$ chmod 755 ~/.sshEnter the following commands to generate an RSA key for
    Version 2 of the SSHprotocol:$ /usr/bin/ssh-keygen -t rsaAt the prompts, just
    press Enter.Enter the following commands to generate a DSA key for Version 2 of
    the SSHprotocol:$ /usr/bin/ssh-keygen -t dsaAt the prompts, press Enter to accept
    the default.This command writes the public key to the ~/.ssh/id_dsa.pub file and
    the privatekey to the ~/.ssh/id_dsa file. Never distribute the private key to
    anyone.Copy the contents of the ~/.ssh/id_rsa.pub and ~/.ssh/id_dsa.pub files
    to the~/.ssh/authorized_keys file on this node and to the same file on all other
    clusternodes.![](Images/bg63.png)Chapter 5\. Installing CRS and RAC 89Change the
    permissions on the ~/.ssh/authorized_keys file on all cluster nodes:$ chmod 644
    ~/.ssh/authorized_keysTo test the SSH configuration, enter the following commands
    from the sameterminal session, testing the configuration of each cluster node:$
    ssh nodename1 date$ ssh nodename2 dateThese commands should display the date set
    on each node. If any node promptsfor a password or pass phrase, verify that the
    ~/.ssh/authorized_keys file on thatnode contains the correct public keys.If you
    see any other messages or text, apart from the date, the installation mightfail.
    Make any changes required to ensure that only the date is displayed whenyou enter
    these commands.You must make sure the disk can be written to from both nodes.
    Otherwise,installation on the remote nodes will fail. No error message will indicate
    thisfailure.5.3 Preparation reviewFollow Chapter 5 in Oracle Real Application
