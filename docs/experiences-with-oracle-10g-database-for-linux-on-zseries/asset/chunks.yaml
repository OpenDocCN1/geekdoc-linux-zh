    window4.7 ASM best practicesASM best practices follow.򐂰  All disks in a diskgroup
    should have the same characteristics (performanceand size) to ensure consistent
    performance. If several types of disks areused, they should be placed in different
    diskgroups.򐂰  ASM will ensure the data is striped evenly amongst all disks. The
    storageadministrator still has to ensure that these disks are spread evenly within
    thestorage subsystem. In the case of an ESS, make sure the disks are wellbalanced
    over several control units.򐂰  ASM disks should not be managed by another volume
    manager, like LVM,especially when some striping mechanism could interfere with
    ASM.򐂰  Oracle suggests that, for ease of management, no more than two diskgroupsshould
    be defined per ASM instance—one for the database files, one for theFlash Recovery
    Area.򐂰  The following files cannot reside on ASM-managed storage: Oracle binaries(executable),
    CRS files (OCR, voting disks), trace files, and non-databasefiles in general.Chapter
    4\. Installing an Oracle 10g Database with ASM 75򐂰  Although ASM does not provide
    imbedded multipathing recognition, it has thecapability to handle it when it is
    provided by third-party software. On Linux onzSeries, such a mechanism has been
    implemented through LVM. LVM allowsthe operating system, and thus ASM, to increase
    I/O parallelism and failovercapabilities. For more details, see the multipathing
    chapters in the FiberChannel Protocol redbook athttp://www.redbooks.ibm.com/redbooks/pdfs/sg246344.pdf/
    and also theParallel Access Volumes paper athttp://www10.software.ibm.com/developerworks/opensource/linux390/docu/lx24pav00.pdf/.
    The way to implement this with ASM is to define onelogical volume per disk, mapping
    the whole disk, and to integrate this logicaldisk and its aliases (pseudo devices)
    into an ASM diskgroup.[](http://www.redbooks.ibm.com/redbooks/pdfs/sg246344.pdf)[](http://www10.software.ibm.com/developerworks/opensource/linux390/docu/lx24pav00.pdf)[](http://www10.software.ibm.com/developerworks/opensource/linux390/docu/lx24pav00.pdf)76
