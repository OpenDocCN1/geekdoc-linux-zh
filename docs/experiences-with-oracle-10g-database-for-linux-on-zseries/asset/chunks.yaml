    Experiences with Oracle 10g Database for Linux on zSeriesThe processor that is
    shown first is the z/VM LPAR in which the experimentswere run. ESAMAP always shows
    the VM LPAR first. All of the assigned timesand utilizations shown on this report
    (and the rest of both ESAMAP andESAMON) are in absolute numbers, meaning these
    are percents of oneprocessor. Thus, there is never a “percent of a percent” being
    reported whereone of the percents is not provided. Thus, the VM LPAR is shown
    as 58 percentout of 200 percent.Other values reported on this report discussed
    further in this section arewaitcompletion, set at NO, and capped, also set at
    NO.There are two forms of overhead reported: Logical and physical. Logicaloverhead
    can be charged to the Logical Partition, whereas physical overhead isnot. There
    is a correlation between the number of logical processors defined andthe amount
    of physical overhead involved in time slicing the physical processorbetween the
    logical processors: The more logical processors, the higher theoverhead.This example
    should be almost a worst case example. In this example, thelogical overhead was
    10.8 percent of one processor, but the physical overhead,as shown in the next
    section, was 39.9 percent.8.6.1 Physical LPAR overheadThe overhead of managing
    the physical processors from Figure 8-19 onpage 194 and Figure 8-20 on page 195
    is shown in Figure 8-21 on page 197.[](#chapter-117.xhtml_pfcc)[](#chapter-117.xhtml_pfcc)[](#chapter-117.xhtml_pfcd)[](#chapter-117.xhtml_pfcf)![](Images/bgcf.png)Chapter
    8\. Monitoring VM and Linux 197Figure 8-21 LPAR physical CPU management timeFrom
    the report, we see there are seven physical processors (0–6). These areshared
    and have an overhead in the 5–6 percent range. Dedicated processorshave less overhead.
    This should not mean that each installation dedicatesprocessors to Logical Partitions
    to reduce overhead. In this case, the highoverhead is caused by a large number
    of logical processors competing for timeon the physical processors in order to
    be dispatched.8.6.2 Converting weights to logical processor speedAn LPAR is granted
    control of processors based on time slices. Each LPAR getstime slices based on
    the weighting factor for the LPAR. To determine the weightof each logical processor,
    use the following calculations:1.  Add up all the weights of the logical processors.In
    Figure 8-19 on page 194 and Figure 8-20 on page 195 there are 12 LPARssharing
    seven logical processors based on weighting. Of the 12, three have aweight of
    180 (LPARs A1, A3, and A11). The remainder have a weight of 10.Therefore, the
    total weight is 630.2.  Divide the weight of theinteresting LPAR into the total.Physical
    CPU Management time:CPU Percent--- -------0 6.8151 4.9682 5.0003 6.7354 4.8745
    6.5136 4.9209 0.00710 0.00711 0.00712 0.00813 0.00714 0.007_______Total: 39.870Note:
    To reduce physical overhead, use fewer Logical Partitions, and fewerlogical processors.[](#chapter-118.xhtml_pfcc)[](#chapter-118.xhtml_pfcd)198
    Experiences with Oracle 10g Database for Linux on zSeriesThis is the logical share
    of the physical complex allocated to the interestingLPAR. The VM Logical Partition
    (LPAR A12) has a weight of 10\. Dividing thisby the total weight (630) yields
    a 1.6 percent share of seven sharedprocessors.3.  Divide the number of logical
    processors of the LPAR into the logical share.This is the percentage of each logical
    processor that is directly relative to themaximum speed that a logical processor
    will operate if capped. Thus, 1.6percent of seven processors is equivalent to
    about 10 percent of oneprocessor (1.6 * 7 = 11.2). Divide this into the two logical
    processors used byour VM system in LPAR A12, and each processor would be targeted
    to get 5percent of one processor.If all Logical Partitions are busy, this percentage
    would be the amount ofprocessing that would be performed. In our case very few
    of the LogicalPartitions were very busy, and so the A12 Logical Partition could
    get as much as90 percent of each logical engine in its assigned time.8.6.3 LPAR
    analysis exampleAs an example, if the weight of a Logical Partition is 10, and
    the total weight of allthe Logical Partitions is 1000, then the Logical Partition
    is targeted at 1 percent ofthe system. If the system is comprised of 10 processors,
    the Logical Partition isexpected to get an amount of processing equivalent to
    one physical processor. Ifthe LPAR has two logical processors, then each logical
    processor is allocated 5percent of a physical processor. Thus, increasing the
    number of logicalprocessors in a complex will decrease the relative speed of each
    logicalprocessor in a Logical Partition.8.6.4 LPAR optionsLogical Partitions may
    be defined as capped, meaning that their share of thephysical system is capped
    to their given weight. Given the situation of 1 percentallocated, this would be
    a very small amount of resource. If not capped, unusedCPU resources are available
    to any Logical Partition that can utilize the resourcebased on given weights.
    Capped Logical Partitions should rarely be used exceptin installations where a
    financial agreement exists to provide a specific speed ofprocessor.The time slice
    is either specific ordynamic. Specifying a specific time slice valuefor LPAR is
    rarely if ever done. We recommend that you specify that LPAR use adynamically
    determined value.Wait completion yes or no is an LPAR parameter that defines whether
    a logicalCP gives up control of the real CP when it enters a wait state. Wait
    completionChapter 8\. Monitoring VM and Linux 199specified as yes will keep the
    real processor assigned for the complete timeslice, even if the processor is in
    the wait state. Wait completion specified as nomeans that the physical CP will
    be released when the logical CP enters a waitstate, giving up the remainder of
    the time slice. We recommend that waitcompletion be specified as no, meaning that
    when work is completed, theprocessor is given up voluntarily so that other Logical
    Partitions may use thephysical processor.8.6.5 Shared versus dedicated processorsWhen
    there are multiple physical processors on a system to be utilized by manydifferent
    logical partitions, there is the option of dedicating processors to aLogical Partition.
    In general, this is only used for two reasons:򐂰  For benchmarks to eliminate questionable
    impacts from other workloads.򐂰  When the workload is steady enough to utilize
    the processors and sufficient inrequirements to justify dedicated processors.To
    justify the cost of zSeries implementations, the objective should always behigh
    utilization. High utilization leverages the value of the reliability, availability,and
    serviceability of the zSeries systems, and the cost of the zSeries. Otherplatforms
    rarely operate at high utilizations. Dedicating physical resources suchas processors
    to one Logical Partition has the potential for reducing the overallsystem utilization.
    Reducing the system distillation reduces the effectiveness ofthe platform and
    increases the cost per unit of work for that system.200 Experiences with Oracle
