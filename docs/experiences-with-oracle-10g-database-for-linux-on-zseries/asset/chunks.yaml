    z/VM is constrained by its use of low storage below the 2 GB bar, theremust be
    very fast paging space. As of z/VM 4.4, any pages moved from belowthe 2 GB line
    must be moved to paging space, and Estore is the fastest pagedevice available.
    In systems that are constrained on their 2 GB storage but havelimited expanded
    storage you will see lots of paging to DASD—even if there iscentral storage available.
    This problem was found during these measurementsand found to cause extreme degradation.To
    avoid these performance problems on installations constrained by the CP lowstorage,
    you should have enough expanded storage configured such that little orno paging
    is ever done to DASD. Some installations may find that even half ofthe main storage
    should be reconfigured as expanded storage for paging.Mini-Disk Caching (MDC)
    can also compete with paging for the EStore frames.We feel that because the defaults
    for MDC are excessive, MDC can and shouldreside only in main storage. We recommend
    that the MDC size in expandedstorage should be set to zero with the command SET
    MDC XSTORE 0M 0M.8.2.8 Ensure sufficient page spaceOn systems that have non-zero
    paging rates, it is important to understand thatthe page space needs to be sufficient
    to hold two times the requirement of allyour guests. Thus for each 2 GB server
    there should be the equivalent of two3390-3 added to the paging subsystem. As
    some of the servers will fit in mainstorage, the amount of main storage can be
    deducted from the pagerequirement.There are two issues with page space. When the
    system runs out of page space,it crashes and re-IPLs itself. This means all Linux
    servers must be rebooted.The second issue is for performance. The paging subsystem
    performs muchbetter when there is about 50 percent free space.The following is
    the first half of the ESAPAGE report showing that this systemhas 18 GB of expanded
