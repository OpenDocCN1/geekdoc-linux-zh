    # Experiences with Oracle 10g Database for Linux on zSeries


    ## Preface

    © Copyright IBM Corp. 2005. All rights reserved.


    ## Chapter 1. Overview of Oracle Database 10g for Linux on zSeries

    ### 1.1 What is Linux

    Linux is a UNIX-like operating system initially created by Linus Torvalds when
    he was a graduate student in 1991 The objective for developing Linux was to deliver
    a non-proprietary operating system and application environment, completely independent
    of hardware architectures, that would offer maximum freedom to move applications
    from one platform to another by simply recompiling code, without expensive, labor-intensive
    porting efforts. Linux is a fully networked 32-bit/64-bit architecture, that supports
    multiple users, multitasking, and multiprocessors, with a user-friendly windows
    Graphical Interface. Continued development and testing of Linux is governed by
    the OpenSource community, which uses the Internet as the primary vehicle for technical
    exchange. Linux source code can be downloaded free of charge from the Internet,
    and programmers are free to modify the code. However, the integrity of the official
    kernel source is managed and maintained by a strict submission and review process
    controlled by the Linux Review Board, an international standards body for Linux.
    Linux, like other Open Source software, is distributed under the terms of the
    GNU Public License (GPL), and is packaged and distributed by approved distributors
    such as Caldera, Red Hat, SuSE, and Turbo Linux.


    ### 1.2 Linux on zSeries

    In 1998 IBM announced a commitment to support Linux on all its hardware platforms,
    including zSeries. The 31-bit version of the Linux operating is available from
    Linux distributors for S/390 G5 and G6 processors, and on 64-bit zSeries models.
    The Linux 64-bit support on the zSeries is available on OpenSource and became
    available from SuSE in April 2001. The Linux operating system has been running
    in a zSeries test environment since early 1999. As of December 1999, the IBM Web
    site `http://www.ibm.com/servers/eserver/zseries/solutions/s390da/linuxisv.html`
    is continually updated to show all the Independent Software Vendors (ISVs) applications
    or infrastructure available for the zSeries platform.


    ### 1.3 Why Oracle9i on zSeries

    Linux on zSeries is an ASCII environment that takes advantage of IBM zSeries hardware,
    especially for system availability and I/O performance. Of particular interest
    is the ability to run many Linux images under z/VM. This provides an excellent
    environment for server consolidation. It will more fully utilize system resources
    and facilitate system management. Linux is not a replacement for other IBM operating
    systems on zSeries or S/390, and will coexist with z/OS, OS/390, and VM/ESA. It
    supports such UNIX tools as `sed`, `awk` and compilers like C, C++, Fortran, and
    Ada. Network tools like `telnet`, `ping`, and `traceroute` are supported as well.


    ### 1.4 Oracle Database 10g for Linux

    Oracle released Oracle9i Database Server for Linux on zSeries in August 2002.
    Since that time, many customers consolidated database instances to Linux guests
    on zSeries. In October 2004, Oracle released Database 10g(10.1.3). Several IBM
    sites have installed and tested the code. This document shares some of the experiences
    from these installations and from the environment used at Oracle in Redwood Shores.


    ## Chapter 2. Best practices for installing an Oracle Database 10g on Linux on
    zSeries

    To obtain optimum performance from Oracle RDBMS when running in Linux on zSeries,
    the proper configuration of both Linux and z/VM are extremely important. Our experiences
    have demonstrated that the vast majority of performance concerns were solved by
    making changes to z/VM, Linux, or the I/O subsystem. This chapter discusses the
    major areas of concern:

    * Sizing and tuning memory

    * CPU allocation

    * Paging, swap, and I/O considerations

    * Monitoring performance

    * Summary


    ### 2.1 Memory sizing and configuration

    The sizing and allocation of memory is one of the most critical areas of implementing
    Oracle in Linux under z/VM. This was especially so with 31-bit Oracle9i and 31-bit
    Linux distributions. Even though Oracle Database 10g 64-bit runs in 64-bit Linux,
    memory sizing still affect performance. When running under z/VM, there is a need
    for expanded storage. Even though z/VM is essentially 64-bit and supports 64-bit
    virtual machines, expanded storage must be configured when running Oracle. The
    need for a expanded storage still exists with z/VM. When running under the current
    versions of z/VM, we found that you need expanded storage in the configuration.
    z/VM, even in a 64-bit environment, requires `EStore` to use as a paging device.


    ## Chapter 3. Installing Oracle 10g single instance

    This chapter describes the steps we executed to install Oracle database 10g for
    Linux on zSeries in 4Q4. The following topics are covered:

    * Setting up the xWindows connection

    * Preparing for the installation

    * Running the Oracle Installer

    * Post-installation verification

    * Setup on VM and Linux


    ### 3.1 Installing Oracle Database 10g on zSeries with Linux

    Oracle Database 10g for Linux on zSeries is 64-bit and can be set up using SLES8
    64-bit Linux guest under VM in an LPAR or directly on LPAR running SLES8. Oracle
    10g is also supported on SLES9, and there are plans to support it on RedHat 4.0
    U1. The version released in October 2004 was Oracle Database 10g (10.1.0.3).


    ### 3.2 Preparing the system environment

    We did our testing on Linux guests on IBM z990 systems at IBM sites in Poughkeepsie
    and Montpellier, along with a Linux guest on z990 at Oracle Headquarters in Redwood
    Shores. This book is based on a Linux guest named `LINUX1`. The file system we
    used was a 7 GB logical file mounted as `/oracle`.


    ## Chapter 4. Installing an Oracle 10g Database with ASM

    This chapter describes the new Automated Storage Manager (ASM) that is available
    with Oracle Database 10g. This is an example of the creation of a single instance
    choosing the ASM option for the disk storage for the database files.


    ### 4.1 ASM overview

    One of the new features coming with Oracle 10g is the Automated Storage Manager
    (ASM). It integrates into the database product the capabilities of both a Volume
    Manager and a file system, and relieves the DBA of most of the painful tasks of
    storage administration. Through simplified interfaces, ASM makes storage management
    and provisioning easy, flexible, and dynamic.


    ## Chapter 5. Installing CRS and RAC

    We installed Oracle Cluster Ready Services (CRS) and Oracle10g Database for Linux
    with Real Application Clusters (RAC) for zSeries under VM. Then we created a database
    using Database Creation Assistant (DBCA). Real Application Clusters is an Oracle
    feature for sharing a database instance between two or more nodes. The reasons
    for using RAC are:

    * Increased availability

    * Increased scalability


    ### Doc ID: 10g RAC: How to Clean Up After a Failed CRS Install


    ## Chapter 6. Using Tivoli Storage Manager and Tivoli Data Protect for Oracle
    Database 10g

    This chapter is an introduction to Tivoli Storage Manager (TSM) and Tivoli Data
    Protect for Oracle (TDPO) products. We demonstrate the installation process for
    both products on the Linux on zSeries. The TSM server will also run in z/VM and
    z/OS.

