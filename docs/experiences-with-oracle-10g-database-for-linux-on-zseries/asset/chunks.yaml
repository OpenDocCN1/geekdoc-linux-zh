    using the EXT2 file system, enabling the direct I/Ooption in Oracle 10g had very
    positive performance effects. With direct I/O,Oracle does all the I/O from the
    Oracle database cache in the SGA. Without thisoption, the data for a database
    write will be moved to the Linux file system cache.When the actual I/O operation
    takes place from the file system cache, there are alarge number of different addresses
    that could used for the I/O operations than ifall the I/O comes from the Oracle
    db_buffers. This increases the working set ofthe Linux virtual machine, but much
    more importantly increases the requirementfor low storage in z/VM. When z/VM 4.4
    or 5.1 does an I/O operation, all thepages associated with the operation are moved
    to pages with real addressesless than 2 GB. At high I/O rates, contention for
    storage below 2 GB real can bea severe bottleneck. One of the most positive tuning
    impacts in today’s Linuxunder z/VM environment is to reduce z/VM’s storage requirement
    below the 2GB bar. The options are to reduce LInux storage, force the I/O to use
    only theOracle buffers in the SGA, and to minimize the size of those buffers.Report:
