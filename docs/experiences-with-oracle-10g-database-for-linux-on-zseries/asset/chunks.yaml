    and useful commands 219Booting same Linux either as VM guest or LPARThe following
    considerations apply for a Linux system to boot in both VM andLPAR modes:򐂰  The
    hardware resources used (disks and network adapters) must match realdevices; so
    a minidisk cannot be used unless it is a fullpack minidisk.򐂰  Under VM, Linux
    deals only with virtual devices, so all Linux guests can usethe same virtual devices
    for ease of configuration and administration. CP isdoing the underlying matching
    between virtual and real devices, which mustbe different for all guests.򐂰  Under
    LPAR, Linux deals only with real devices. VM-specific devices, likeVswitch or
    Guest LANs, cannot be used. Also, Linux configuration filesdefining hardware resources
    must be different for all systems.The following configuration file is used to
    define the accessed disks.Example: A-6 /etc/zipl.conf# Generated by YaST2[defaultboot]default=ipl[ipl]target=/boot/ziplimage=/boot/kernel/imageramdisk=/boot/initrdparameters="dasd=500-53f,100
    vmpoff=''LOGOFF'' root=/dev/dasda1"[ipllpar]target=/opt/oracle/boot/ziplimage=/opt/oracle/boot/kernel/imageramdisk=/opt/oracle/boot/initrdparameters="dasd=1814,1914,1a14,1b14,1c14,1d14,1e14,1f14,1014
    vmpoff=''LOGOFF''root=/dev/dasda1"Note: Because cylinder 0 is part of the minidisk,
    a Linux formatting of the diskwill reinitialize the volume label. Therefore it
    is strongly recommended toalways use the fdasd command with -l options; otherwise
    a default volumelabel based on the virtual device number will be set, which may
    end up with alot of duplicate volume serial numbers under VM.![](Images/bge6.png)220
    Experiences with Oracle 10g Database for Linux on zSeriesThe [ipl] sections define
    the default boot parameters used for VM. Because allthe guests use the same virtual
    disks, 500 to 508, this section will be identical forall Linux guests (for example,
    they will all IPL from disk 500).The [ipllpar] sections are used for LPAR mode.
    Here the real disks have to bespecified in the dasd parameter; therefore, this
    section has to be adapted foreach of the Linux systems.The following example is
    used to define the network adapters.Example: A-7 /etc/chandev.confnoauto;qeth1,0x0c00,0x0c01,0x0c02;add_parms,0x10,0x0c00,0x0c02,portname:PORTC0qeth2,0xc000,0xc001,0xc002We
    define our hardware configuration so that OSA devices C00 to C02 areshared by
    all LPARs on our system.The VM guests are using a device C000 defined as a vswitch
    adapter. We didnot include a definition for OSA device C00.In Linux we defined
    with YaST2 both network devices eth1 and eth2 as havingthe same IP address and
    network definitions. When booting in any LPAR, onlydevice c00 is detected, so
    the network comes up on device eth1\. Under VM, onlydevice C000 is detected, so
    the same network definitions come up this time onadapter eth2. The same file can
    be used for all the Linux images, whether theyare starting in VM or LPAR mode.
    Only the network parameters need to bechanged using YaST2.Useful VM commandsWe
    found the xautolog and signal VM commands useful when managing Linuxfrom a single
    CMS user.To automatically start a guest, we used the xautolog command:xautolog
    oracle4 ipl 500 sto 512MWhere oracle4 is the guest name, 500 the IPL disk number,
    and 512M theamount of virtual memory we want for that guest.To automatically shut
    down Linux, we used the signal command:signal shutdown oracle4 within 120Where
    120 is the interval (in seconds) we allow for a proper shutdown.![](Images/bge7.png)Appendix
