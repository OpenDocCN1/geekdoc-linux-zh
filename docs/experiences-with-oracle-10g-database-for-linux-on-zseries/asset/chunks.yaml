    Detecting storage problems - PagingLack of storage results in paging to either
    expanded storage or DASD. This is notby itself bad. As virtual machines go idle,
    they should be paged out—why keepvirtual machines in main storage if they are
    idle? And then when the serverbecomes active again, the pages are paged back in.
    There are rules of thumbabout how much an installation can overcommit storage.
    Such a rule of thumbleaves out one very important factor—what percent of your
    servers are idle? If atpeak time 75 percent of the servers are idle, then over
    committing by at least afactor of four would make sense.In capacity planning for
    storage, the key metrics are working sets and percentactive. Even though a virtual
    machine has 2 GB defined does not mean it needs2 GB of storage to operate. Pages
    that are not referenced do not need to beresident. Thus the required storage,
    theworking set, may be much smaller thanthe virtual machine size. An active server
    is a server that performs some work(consumes some CPU time) in a minute. WIth
    Linux servers that wake up everysecond even with the timer patch, it is difficult
    to define an active server. Butevaluating CPU requirements over time of the servers
    will show when the virtualmachine is above the minimal idle operating threshold,
    and now you have theinput to calculate the active percent. During the active intervals
    determine theworking set.8.3.2 Detecting 2 GB storage problems - PagingThe following
    subsystem summary from the ESALPS (ESASSUM) report inlisting format is very similar
    to the ESAMAIN display used during theexperiments. Showing the 15-minute experiment,
    minute by minute, you can seethe processor requirement going up, with the page
    rate to expanded storage aswell as the I/O rate going up. The minidisk cache rate
    is the number of I/O eligiblefor MDC, and the %hit is the percent of those that
    were MDC hits that did notresult in a real I/O. The capture ratio is provided,
    showing how much of theprocessor that was used can be accounted for. One hundred
    percent is typical;anything less identifies a problem with the monitor or a bug.
    With lower captureratios, there is CPU used by some virtual machine that is not
    identified.![](Images/bgc1.png)Chapter 8\. Monitoring VM and Linux 183Figure 8-7
