    is much general Radius Server information available on the Internet,but the readme
    files (and referenced files) and comments in the configurationfiles (particularly
    radisud.conf) seemed to be the best source of detaileddocumentation.9.3 z/OS LDAPThe
    z/OS LDAP server, part of the Integrated Security Services for z/OS V1R6.0,is
    based on a client/server model that provides client access to an LDAP server.An
    LDAP directory provides a way to maintain directory information in a centrallocation.
    The LDAP server provides access to RACF user information stored inthe SDBM database.
    RACF group information is also available, but is not usedhere. SDBM is also known
    as the RACF database backend of the LDAP server.The SDBM database allows for directory
    authentication using the RACF user IDand password. The RACF user ID must have
    an OMVS segment defined. TheRACF Subsystem function of RACF must be defined and
    activated to allow theLDAP server to communicate with RACF through the SDBM backend
    and theLDAP server must be configured and started.The LDAP data model is closely
    aligned with the X.500 data model. In thismodel, a directory service provides
    a hierarchically organized set of entries.Each of these entries is represented
    by an object class. The object class of theentry determines the set of attributes
    that are required to be present in the entryas well as the set of attributes that
    can optionally appear in the entry. An attributeis represented by an attribute
    type and one or more attribute values. In additionto the attribute type and values,
    each attribute has an associated syntax thatdescribes the format of the attribute
    values. Every entry in the directory has adistinguished name (DN). The DN is the
    name that uniquely identifies an entry inthe directory. A DN is made up of attribute=value
    pairs, separated by commas,for example, cn=Ben Gray,ou=editing,o=New York Times,c=US
    is an LDAP DN.The format of the DN is restricted when using SDBM, as the DN must
    match theschema of the underlying RACF data. A RACF SDBM style DN for a usercontains
    two required attributes plus a valid DN suffix: racfid=user206 Experiences with
    Oracle 10g Database for Linux on zSeriesID,profiletype=user,suffix. The required
    attributes are racfid and profiletype. Forthe work here the attribute value of
    the profiletype attribute must be user. In othercontexts the attribute value of
    group is also available for attribute profiletypewhen using the SDBM backend.
    The DN suffix used here iscn=ORARACF,o=IBM,c=US.The SDBM database of the LDAP
    server implements portions of the adduser,addgroup, altuser, altgroup, deluser,
    delgroup, listuser, listgrp, connect,remove, and search RACF commands. A user
    has the same authority throughSDBM as with normal RACF commands. In an actual
    implementation many ofthese commands would be needed and used either through LDAP
    or directlythrough RACF, for example, adding/deleting users, changing/resettingpasswords.
    See Chapter 16, “Accessing RACF Information,” in z/OS V1R6.0Integrated Security
    Services LDAP Server Administration and Use,SC24-5923-06,  on using the LDAP functions
    not covered here.If the Linux system running FreeRadius is not on the same zSeries
    machine asthe z/OS LDAP server, the communication can be encrypted using SecureSocket
    Layer (SSL). This function is not covered here but it would avoid thepossible
    issues associated with sending a clear text password across a network.1.  ConfigurationLDAP
    server runtime configuration is accomplished through its configurationfile, slapd.conf.
    For the first-time use of the LDAP server, this file needs to becopied: "cp /usr/lpp/ldap/etc/slapd.conf
    /etc/ldap/slapd.conf", and modified.Optionally, a second file that is used for
    tracing and debugging can be copied:"cp /usr/lpp/ldap/etc/slapd.envvars /etc/ldap/slapd.envvars",
    and modified asrequired.2.  RACF user IDs and authorizationsThere are at least
    three different levels of RACF authorizations that are usedwhen using a z/OS LDAP
    server with the SDBM backend. The first is theauthority of the user ID whose password
    is to be authenticated when the IDattempts to connect to the Oracle DB. The examples
    here use the first user IDof TERRY1\. This ID has a password (test123) and an
    OMVS segmentdefined in RACF. The second is the authority of the user ID that is
    able to dothe initial connection from FreeRADIUS to z/OS LDAP. In addition to
    anOMVS segment and password, this ID needs RACF authority to do a searchof the
    SDBM database for the first user ID. In RACF terms this ID needsauthority to do
    a listuser command with the other ID as an argument. Theexamples here use the
    second user ID of TERRY2\. The third is the RACFauthority needed by the user ID
    that starts the LDAP server on z/OS. TheLDAP server is started from the USS shell
    and the user ID is TERRY3\. ThisID needs access to TSO and OMVS. The ID needs
    read access to theBPX.DAEMON facility class and update access to the BPX.SERVER
    facilityChapter 9\. Using Radius Server and z/OS RACF LDAP for Oracle DB user
    authentication 207class, if these two facility classes are defined to RACF. The
    IRR.RUSERMAPRACF facility class must be defined, and this ID needs read access
    to it.The connection and authentication protocol between the LDAP client(FreeRADIUS)
    and the LDAP server (RACF with SDBM) is to first bind with IDTERRY2 using its
    DN that is explicitly specified in the FreeRADIUSradiusd.conf file parameter identity.
    If the bind succeeds, a search is done tofind the DN of the user ID, TERRY1, to
    be authenticated for access to theOracle DB. If the search succeeds, a bind is
    done for the TERRY1 ID, andsuccess here equals authentication. The point here
    is this seems likeduplication of effort and it is in this case. Since the DNs
    for all users will be thesame, it should be possible to modify FreeRADIUS to use
    the fixed DN anddo the bind with the TERRY1 ID for authentication, and the TERRY2
    ID couldbe eliminated from the scenario.PERMIT BPX.DAEMON CLASS(FACILITY) ID(TERRY3)
    ACCESS(READ)PERMIT BPX.SERVER CLASS(FACILITY) ID(TERRY3) ACCESS(UPDATE)RDEFINE
    FACILITY IRR.RUSERMAP UACC(NONE)PERMIT IRR.RUSERMAP CLASS(FACILITY) ID(TERRY3)
    ACCESS(READ)SETROPTS RACLIST(FACILITY) REFRESH3.  slapd.conf file in /usr/lpp/ldap/etcThe
    SDBM database must be enabled for use and the adminDN and suffixparameters must
    be aligned with the identity and basedn parameters in theFreeRADIUS radisud.conf
    file.database sdbm GLDBSDBMadminDN "racfid=TERRY2,profiletype=user,cn=ORARACF,o=IBM,c=US"suffix
    "cn=ORARACF,o=IBM,c=US" .4.  Starting the LDAP ServerA sample shell script is
    located in /usr/lpp/ldap/sbin/slapd. The LDAP serveris started from the USS shell
    with:/usr/lpp/ldap/sbin/slapd & .To stop the LDAP server in the z/OS shell, it
    is necessary to know its processID. Enter:ps -ef | grep slapdThis will provide
    the process ID for the LDAP server, which can be used inkill -15 process-ID to
    shut down the LDAP server.5.  Debug and trace208 Experiences with Oracle 10g Database
    for Linux on zSeriesThe debugging facility can be turned on and off dynamically
    using the MVS™modify command. Here the ID TERRY3 was used to start the LDAP serverfrom
    the USS shell, so the jobname for use with the modify command can bedetermined
    from either an SDSF PS command or an MVS display systemactivity command. The USS
    jobname assigned by USS will be of the formTERRY3x, where x is a digit between
    1 and 9\. The modify command enteredis:f TERRY3x,appl=debug=debug_levelThe debug_level
    is a mask that specifies the desired debug level and can befound in the references.
    Similarly, tracing and the use of the parameters in theslapd.envvars file can
    be found in the references.6.  References–  z/OS V1R6.0 Integrated Security Services
    LDAP Server Administrationand Use, SA24-5923-06–  z/OS V1R6.0 Security Server
