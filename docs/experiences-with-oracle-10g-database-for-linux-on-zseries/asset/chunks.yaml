    When either becomes smallerthan a threshold, VM will attempt to find more pages.
    It does this with a facilitycalled demand scan. There are three forms of demand
    scan: Scan 1, scan 2, andemergency. As you could expect, emergency scan is a bad
    thing.What the following PDB™ extract shows minute-by-minute is the key areaswhere
    CP was getting pages. The extract and field descriptions follow thisextract. This
    PDB extract shows that not only is CP having to go to demand scan2 for a thousand
    pages per second, but is having to go to emergency scan aswell.Optimally, CP gets
    pages from dormant users. In this case, none of the users godormant so that is
    not possible. And since all users are in queue, there is nodistinction between
    a good and a bad virtual machine (an idle or an active virtualmachine); CP is
    just as likely to take a page from the virtual machine that needsstorage as one
    that does not. And in fact, this measurement was an 8 GB Linuxserver running by
    itself. So all page stealing from the dispatched virtual machinewas indeed from
    the virtual machine that had an immediate requirement forstorage below the line.One
    of the other indicators of the 2 GB issue is that the CP monitor acts strangeand
    seems to miss intervals. This extract explains why. The emergency scan isstealing
    pages from the monitor DCSS (PLSSRPE). The monitor at every 60seconds collects
    a large amount of performance metrics, puts this data into themonitor DCSS, and
    before the monitor application can process, the data pages itout. It does not
    matter how efficient the data collector is. It cannot get to the data.At the point
    of having emergency scans of this magnitude, stepsmust be taken tocorrect the
    problem, as little work will get done.![](Images/bgc3.png)Chapter 8\. Monitoring
