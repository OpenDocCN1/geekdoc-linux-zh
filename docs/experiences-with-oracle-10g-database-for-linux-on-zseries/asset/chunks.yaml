    MOUNTED EXTERN 2 14086 140344.5.3 Modifying an existing diskgroupOne of the most
    interesting features of ASM is that it makes it possible for a DBAto dynamically
    increase the size of storage available for database use, withouthaving to stop
    Oracle and use complex resizing commands. Furthermore, it alsoallows for not only
    preserving the stripping of data over the disks, but also forredistributing the
    data in such a way that all the disks (including the newlyallocated ones) end
    up having the same amount of file extents and an identicalusage pattern.From the
    following SQL command, we can see that DISKGROUP1 is made up oftwo disks of 7
    GB each, 1 GB on each disks being used by a database previouslycreated.Example
    4-7 Displaying disksSQL> select name,group_number,total_mb,free_mb,path from v$asm_disk;NAME
    GROUP_NUMBER TOTAL_MB FREE_MB PATH------------------------------ ------------
