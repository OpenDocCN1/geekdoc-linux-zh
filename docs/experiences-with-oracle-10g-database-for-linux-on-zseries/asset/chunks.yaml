    6.  Using Tivoli Storage Managerand Tivoli Data Protect for OracleDatabase 10gThis
    chapter is an introduction to the Tivoli Storage Manager (TSM) and Tivoli Data
    Protectfor Oracle (TDPO) products. We demonstrate the installation process for
    both products on theLinux on zSeries environment. The TSM server will also run
    in z/VM and z/OS.6122 Experiences with Oracle 10g Database for Linux on zSeries6.1
    IBM Tivoli Storage Manager overviewIBM Tivoli Storage Manager provides automated,
    policy-based, distributed dataand storage management for file servers and workstations
    in an enterprisenetwork environment. The base functions provided by Tivoli Storage
    Managerinclude:򐂰  Backup and RestoreThe backup process creates a copy of the file
    or application data that can berecovered if the original data is lost or destroyed.
    Backups can be scheduled,performed manually from the Tivoli Storage Manager client
    interface, orperformed remotely using a Web-based interface. The restore processtransfers
    a backup data copy from Tivoli Storage Manager server-managedstorage onto a designated
    machine.򐂰  Archive and RetrievalThe archive process creates a copy of a file or
    a set of files and stores it as aunique object for a specified period of time.
    This function is useful formaintaining copies of vital records for historical
    purposes. Like the backupprocess, the archive process can be scheduled, performed
    manually from theTivoli Storage Manager client interface, or performed remotely
    using aWeb-based interface.򐂰  Instant Archive and Rapid RecoveryIBM Tivoli Storage
    Manager allows for the creation of a complete set of clientfiles, called a backup
    set, on the Tivoli Storage Manager server system usingthe most recent backup versions
    stored by the server. In a process calledInstant Archive, a backup set is used
    to retain a snapshot of a client filesystem for a designated period of time.򐂰  Space
    Manager ClientThis feature provides for the automatic and transparent movement
    ofoperational data from a client system to server-managed storage. Thisprocess,
    called Hierarchical Space Management (HSM), is implemented as aclient installation
    and controlled by policy defined to the Tivoli StorageManager server. HSM frees
    up space on a client machine by using distributedstorage media as a virtual hard
    drive for that machine.Chapter 6\. Using Tivoli Storage Manager and Tivoli Data
    Protect for Oracle Database 10g 1236.2 Tivoli Storage Manager architectureThe
    Tivoli Storage Manager server component is installed on the computer thatmanages
    storage devices. The Tivoli Storage Manager server provides thefollowing functions:򐂰  Data
    management򐂰  Storage device and media management򐂰  Reporting and monitoring functions򐂰  System
    securityThe Tivoli Storage Manager server application is supported by a relationaldatabase
    that is specifically designed to manage a data storage environment.The server
    database operates transparently, requiring minimal administrativeoversight. The
    server relies on the database to maintain an inventory ofmetadata associated with
    stored data objects.The database is not used to store actual client data, which
    is maintained inserver-managed storage. All database transactions are written
    to an external logfile called the recovery log. The recovery log can be used to
    restore the databaseif necessary.Tivoli Storage Manager server operations are
    configured, controlled, andmonitored using graphical or command-line interfaces.
    Some tasks can beperformed several different ways, so the interface you use depends
    on the typeof task and your preferences. Support for SQL SELECT statements and
    ODBCdata transfer is also available for advanced database management andreporting.The
    Tivoli Storage Manager server uses the database to intelligently mapbusiness goals
    with storage management policies and procedures. The TivoliStorage Manager server
    tracks the origin and location of each client data copy.Policies defined to the
    Tivoli Storage Manager server determine how data copieswill be stored, migrated,
    and eventually replaced with newer data. Tivoli StorageManager typically maintains
    several incrementally modified versions of clientdata files, up to a maximum number
    defined by the administrator.6.3 Tivoli Data Protection for OracleData Protection
    for Oracle currently supports Oracle8i (8.1.7) and Oracle 9i(9.0.1 or 9.2) and
    Oracle Database 10g Databases with the Oracle RecoveryManager (RMAN).The TDP for
    the Oracle application client provides an integrated solution forperforming full
    backup and restore operations on Oracle databases. It is a client124 Experiences
    with Oracle 10g Database for Linux on zSeriesapplication that provides full backup
    of online databases and restore of fulldatabases to the original or a different
    location.TDP for Oracle is not intended as a substitute for the standard Tivoli
    StorageManager backup/archive client. TDP for Oracle cannot be used to back up
    orrestore any non-database data, such as history files or any other systemconfiguration
    files. Those files need to be backed up by the Tivoli StorageManager backup/archive
    client. Therefore, the two client types work together toprovide full data protection
    for your Oracle environment.The TDP for Oracle application client and the Tivoli
    Storage Managerbackup/archive client can run simultaneously on the same Oracle
    server;however, they are totally separate clients as far as the Tivoli Storage.6.4
    RMAN and Tivoli Data Protection for OracleRMAN provides consistent and secure
    backup, restore, and recoveryperformance for Oracle databases. While the Oracle
    RMAN initiates a backup orrestore, Data Protection for Oracle acts as the interface
    to the Tivoli StorageManager Server Version 5.1.0 (or later). The Tivoli Storage
    Manager Server thenapplies administrator-defined storage management policies to
    the data. DataProtection for Oracle implements the Oracle-defined Media Managementapplication
    program interface (API) 2.0\. This API interfaces with RMAN andtranslates Oracle
    commands into Tivoli Storage Manager API calls to the TivoliStorage Manager Server.
    With the use of RMAN, Data Protection for Oracleallows you to perform the following
    functions:򐂰  Full backup function for the following while online or offline:–  Tablespaces–  Datafiles–  Archive
    log files–  Control files򐂰  Full database restores while offline򐂰  Tablespace
    and datafile restore while online or offline6.5 Overview of installation process
