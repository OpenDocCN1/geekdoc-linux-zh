    All rights reserved.  11Chapter 2.  Best practices for installingan Oracle Database
    10g onLinux on zSeriesTo obtain optimum performance from Oracle RDBMS when running
    in Linux onzSeries, the proper configuration of both Linux and z/VM are extremelyimportant.
    Our experiences have demonstrated that the vast majority ofperformance concerns
    were solved by making changes to z/VM, Linux, or the I/Osubsystem. This chapter
    discusses the major areas of concern.򐂰  Sizing and tuning memory򐂰  CPU allocation򐂰  Paging,
    swap, and I/O considerations򐂰  Monitoring performance򐂰  SummaryFor more information
