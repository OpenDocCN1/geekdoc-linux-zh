    or edit the /etc/sysctl.conf file and add or edit linessimilar to the following:kernel.shmall
    = 2097152kernel.shmmax = 2147483648kernel.shmmni = 4096kernel.sem = 250 32000
    100 128fs.file-max = 65536net.ipv4.ip_local_port_range = 1024 65000net.core.rmem_default
    = 262144net.core.rmem_max = 262144net.core.wmem_default = 262144net.core.wmem_max
    = 262144By specifying the values in the /etc/sysctl.conf file, the values persist
    when yourestart the system.Enter the following command to change the current values
    of the kernelparameters:# /sbin/sysctl -pReview the output from this command to
    verify that the values are correct. If thevalues are incorrect, edit the /etc/sysctl.conf
