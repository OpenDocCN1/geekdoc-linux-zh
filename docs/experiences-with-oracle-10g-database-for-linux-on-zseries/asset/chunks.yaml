    Experiences with Oracle 10g Database for Linux on zSeries2.1 Memory sizing and
    configurationThe sizing and allocation of memory is one of the most critical areas
    of theimplementing Oracle in Linux under z/VM. This was especially so with 31-bitOracle9i
    and 31-bit Linux distributions. Even though Oracle Database 10g 64-bitruns in
    64-bit Linux, memory sizing still affect performance.When running under z/VM,
    there is a need for expanded storage. Even thoughz/VM is essentially 64-bit and
    supports 64-bit virtual machines, expandedstorage must be configured when running
    Oracle. The need for a expandedstorage still exists even with z/VM. When running
    under the current versions ofz/VM, we found that you need expanded storage in
    the configuration. z/VM, evenin a 64-bit environment, requires EStore to use as
    a paging device. Performancewill not be acceptable unless you configure from 25
    percent to 33 percent of thestorage in the z/VM system as EStore.This hierachy
    is needed because CP and the control blocks in z/VM must residebelow 2 GB, or
    what is referred to as host memory, including a guest page beingreferenced for
    CP processing (I/O, IUCV, etc.). With high amounts of I/O (diskand network as
    well), this can create contention for storage below the 2 GB level.In z/VM 4.2.0
    and earlier z/VM releases, when we steal a page below the 2 GBbar due to contention,
    we do not move it to central storage above the 2 GB; wepage it out. If there is
    no expanded storage, it gets paged out to DASD. This cancreate a thrashing scenario.
    If you see paging to DASD, but lots of storageavailable above 2 GB, then there
    is probably contention for storage below 2 GB.As a starting point, at least 25
    percent of the amount of memory assigned to theLPAR that is running z/VM must
    be allocated to expanded storage. As thesystem performance characteristics become
    known, this number can beadjusted. Once configured, it is unlikely that the amount
    of expanded storageconfigured would be decreased.When sizing the Linux virtual
    machine for Oracle, the virtual machine should beconfigured with the minimum amount
    of memory needed. Linux will set up cachebuffers with all memory allocated to
    it. It is better to let z/VM handle paging andmanage memory where possible. System
    performance can be adverselyaffected by the amount of memory allocated. This could
    be caused by the 2 GBline issued as outlined above.The method to size a guest
    for Oracle is to add the Systems Global Area, theProgram Global Area (if needed),
    and about 128 MB for Linux.򐂰  The Systems Global Area is the memory requirement
    for Oracle. This isshared memory within Oracle to functions such as caching table
    data, parsingSQl, sorting, etc.Chapter 2\. Best practices for installing an Oracle
    Database 10g on Linux on zSeries 13򐂰  The Program Global Area is memory outside
    the Oracle instance. Thisgenerally used by users who create connections to the
    database. Dependingon the application, this can be either a small amount of memory
    per user orvery large amounts (in excess of 10 MB per user) for applications like
    theOracle E-Business Suite.This tends to be the complete opposite of assigning
    memory to Linux in an Intelenvironment or even in UNIX. But it must be remembered
    that in this case, Linuxis running under and being managed by another operating
    system.2.2 CPU allocationCPU (or CP) allocation can be viewed in a few perspectives:򐂰  A
    MIPS requirement for the databases and applications to be run in Linux onzSeries򐂰  Allocation
    of virtual CPs򐂰  Setting shares or running multiple LPARS with CPUs either as
    shared ordedicated2.2.1 SizingAs part of the consolidation process, workloads
    should be sized not only toinsure the correct amount of MIPS are determined, but
    also to aid in determiningif this is a good candidate to move to Linux on zSeries.
    It can also help determineif this database should possibly be run in a Linux guest
    in an LPAR and not underz/VM with the development, test, etc. databases being
    run under z/VM. This is avery important part of the consolidation process, if
    not the most important part.Doing the right work here will save problems later
    after the workload is moved toLinux on zSeries.There are several rules of thumb
    to do a sizing. While they may provide a quicknumber, none take into account the
    characteristics of the workload. Theseworkload characteristics are extremely important
    in assessing MIPSrequirements.IBM can provide sizing estimates, and there is no
    charge for this. To do anestimate, IBM will need to following information:򐂰  Make
    and model of the system the database currently runs on򐂰  The number of CPs and
    the MHz rating of the CPs򐂰  The peak utilization of each system14 Experiences
    with Oracle 10g Database for Linux on zSeriesIt is best if these are actual numbers
    from a system tool such as vmstat.Approximations can be provided, but the amount
    of utilization they are in error isdirectly proportional to the error in the MIPS
    estimate.There are two methods of sizing: The Quick Sizer tool and Size390 team.
    TheQuick Sizer tool takes your estimated data as input and provides a MIPSestimate.
    The Size390 team uses vmstat reports from peak periods to perform asizing estimate.
    The Size390 team can also take vmstat reports taken throughpeak periods and perform
    a sizing estimate from that. If a Quick Sizer is doneand the numbers warrant proceeding,
    then working with the Size390 team is thebest approach.2.2.2 CP allocationThe
    amount of virtual CPs allocated (using the CP define cpu command) to aLinux machine
    is important. In general, one virtual CP is a good starting pointunless the sizing
    points to something much larger.In a constrained CPU environment (that is, more
    CPU cycles are needed tocomplete the work), you should give the Linux virtual
    machine all the CPs itneeds to do its work efficiently. However, there should
    not be more CPsallocated than the number of physical CPUs that are assigned to
    this LPAR whenrunning under z/VM. If this were to happen (more virtual CPs than
    physicalCPUs), the transaction rates would decrease and the cost to execute thesetransactions
    would increase. This is due to increased scheduling overhead inz/VM’s control
    program.CPU time is limited to the number of CPUs installed. Therefore it would
    beprudent to reduce CPU usage where possible. This would be in areas such as:򐂰  Eliminate
    any unnecessary services that might install with the Linux guest.򐂰  Eliminate
    any unnecessary cron tasks.򐂰  Reduce unnecessary work.–  Ensure timer patch is
    turned on and timer pops are disabled. This is thedefault with SLES8.–  Eliminate
    using “r-u-there” pings to determine if the virtual machines arethere and up.–  Do
    not measure idle guests. Measuring takes cycles.򐂰  Network consideration–  Use
    Guest Lan–  Use VswitchChapter 2\. Best practices for installing an Oracle Database
    10g on Linux on zSeries 152.2.3 Setting sharesThe workload of Linux virtual machines
    can be managed or controlled by settingof the SHARE value of a virtual machine.
    The first choice of SHARE is to useABSOLUTE or RELATIVE. The second choice is
    the size of the SHARE. Thesimplest way to decide which to use for a specific server
    is to determine whetheras more users log on to this system, should this service
    machine get more CPUor less CPU?A relative share says this server should get a
    relative share of the processor,relative to all virtual machines in the dispatch
    and eligible lists. As more users logon, the share will drop.An absolute shares
    remain fixed up to the point where the sum of the absoluteshares is 100 percent
    or more, a rather confused state of configuration. Serversmight have a requirement
    that increases as the level of work increases. Theseservers should have ABSOLUTE
    shares. All other users should use RELATIVE.Size of share is both a business decision
    and a performance decision. Forexample, if one server is assigned a very high
    share, which might be as much ofthe system as the rest combined, one would expect
    this server to be absolutelycritical to your business. This server has the capability
    of taking resourceswhenever it needs them, but if this server starts looping,
    it would easily consumeall the resources allocated. But in general, this is not
    a likely situation forproduction.A simple way of looking at share values is that
    if there is a heavy contention forthe processor, what servers would you like to
    run?The production Oracledatabases are an obvious choice. Required servers should
    have absolute values![](Images/bg1a.png)16 Experiences with Oracle 10g Database
    for Linux on zSeriesFigure 2-1 Using shares to manage guest priorities2.3 Paging,
    swap, and I/O considerationsz/VM uses paging, while Linux primarily uses swapping
    but performs somepaging as well. The term swap is a carry over from early days
    of Linux when it didswap an address space to reclaim memory if needed. However,
    today Linuxdoes page and uses its own paging algorithm. This means that double
    pagingcan occur and this is not a new concept in z/VM.One case may be where z/VM
    needs to page out and selects a page from theLRU. Hopefully the system is properly
    configured and the paging is to expandedstorage. Now a Linux virtual machine needs
    to page and looks at its LRU topage. Most likely this could be the page that z/VM
    just paged out. If we assumethis is the case, a page fault now occurs and the
    page must be brought back intocentral storage. Now Linux will complete its paging
    by moving the page to itsswap space or paging device. In this case the system
    paged so that a systemguest can page.It is best to keep this type of activity
    to a minimum. The approach to this is tokeep the memory in Linux virtual machines
    small enough so that z/VM does notdo a lot of paging and large enough so that
    Linux does not have to do excessivepaging. And all paging at the first level should
    be to a memory device such as aVDISK for Linux or expanded storage for z/VM.010203040Absolute%Lin1  Lin2  Lin3  Lin4CPRelativeShare0100200300400500600700800AbsoluteguestsRelativeguestsControl
    Priority of Linux guests  SHARE settings determine access priority forCPU, main
    storage, and paging capacity  Settings can be changed on the fly bycommand or
    programmed automation  Resources are allocated to Absolute guestsfirst, remaining
    resources are allocated toRelative guests  SHARE settings are not a guarantee
    for systembehaviorSET SHARE Lin1 ABSOLUTE 20% ABSOLUTE 30% LIMITSOFTSET SHARE
    Lin2 ABSOLUTE 10% ABSOLUTE 15% LIMITHARDSET SHARE Lin3 RELATIVE 200 RELATIVE 300
    LIMITHARDSET SHARE Lin4 RELATIVE 100 RELATIVE 200 LIMITSOFT= limit can be exceeded
    if unusedcapacity is available (limitsoft)= limit will not be exceeded (limithard)Notes:Chapter
    2\. Best practices for installing an Oracle Database 10g on Linux on zSeries 172.3.1
    z/VM pagingOne of the common mistakes with new VM customers is to not allocate
    pagingspace (along with not configuring expanded storage). The installation processconfigures
    enough paging space to complete an installation. This paging spaceon the sysres
    pack is small and can handle a small amount of tasks. However,you should remove
    the paging space from the sysres pack and add DASD pagespace to do real work.
    The VM Planning and Administration manual has detailson determining how much space
    is required. Here are a few thoughts:򐂰  If the system is not paging, you may not
    care where you put the page space.However, it has been our experience that sooner
    or later the system grows toa point where it pages and then you will wish you
    had thought about it.򐂰  z/VM paging is most optimal when it has large contiguous
    available space onvolumes that are dedicated to paging. Therefore, do not mix
    page space withother space (user, tdisk, spool, Linux guests, etc.).򐂰  Set up
    VM paging to many disks. The more subchannels z/VM can use thefaster the paging
    will take place.򐂰  A rough starting point for page allocation is to add up the
    virtual machinesizes of virtual servers running and multiply by 2\. Keep an eye
    on theallocation percentage and the block read set size.2.3.2 Swap space for LinuxTry
    to avoid swapping in Linux whenever possible. It adds pathlength andsignificant
    hit to response time. However, sometimes swapping is unavoidable. Ifyou have to
    swap, these are some of your best choices.򐂰  Dedicated volume - If the storage
    load on your Linux guest is large, the guestmight need a lot of room for swap.
    One way to accomplish this is simply toATTACH or DEDICATE an entire volume to
    Linux for swapping. If you havethe DASD to spare, this can be a simple and effective
    approach.򐂰  Traditional minidisk - Using a traditional minidisk on physical DASD
    requiressome setup and formatting the first time and whenever changes in size
    ofswap space are required. However, the storage burden on z/VM to supportminidisk
    I/O is small, the controllers are well-cached, and I/O performance isgenerally
    very good. If you use a traditional minidisk, you should disable z/VMMinidisk
    Cache (MDC) for that minidisk (use the MINIOPT NOMDC statementin the user directory).򐂰  VM
    VDISK - A VM virtual disk in storage (VDISK) is transient like a t-disk is.However,
    VDISK is backed by a memory address space instead of by realDASD. While in use,
    VDISK blocks reside in central storage (which makethem very fast). When not in
    use, VDISK blocks can be paged out to18 Experiences with Oracle 10g Database for
    Linux on zSeriesexpanded storage or paging DASD. The use of VDISK for swapping
    issufficiently complex that we have written a separate tips page for it.Linux
    assigns priorities to swap extents. So, for example, you could set up asmall VDISK
    with higher priority (higher numeric value), and it would be selectedfor swap
    as long as there was space on the VDISK to contain the process beingswapped. Swap
    extents of equal priority are used in round-robin fashion. Equalprioritization
    can be used to spread swap I/O across chpids and controllers, but ifyou are doing
    this, be careful not to put all the swap extents on minidisks on thesame physical
    DASD volume, for if you do, you will not be accomplishing anyspreading. Use swapon
    -p ... to set swap extent priorities.Setting up two VDISKS of different priorities
    or a VIDSK and a minidisk with thehigher priority on the VDISK can provide a tuning
    toll or method for properlysizing your memory needs on the Linux virtual machine.
    Monitor the paging atpeak times. If there is paging to the second paging disk,
    then you shouldconsider adding memory to Linux.2.3.3 I/O considerationsOne of
    the biggest performance issues we ran into during some testing, both onz/OS and
    Linux on zSeries, was when we placed the database on a single rankin the ESS800\.
    This will cause many performance-related issues that mostlyinvolve cache utilization
    in the ESS800\. The best practice for the ESS system isto distribute data across
    as many ranks (arrays) as possible. This made adramatic difference in our testing,
    even though this was a small database.It is also important to stripe the logical
    volumes that are created. This enables theoperating system to issue multiple I/Os
    against the LVM. Striping a logicalvolume is not the same as any striping or RAID
    that is done inside the diskcontroller. The guidelines for striping on a IBM Total
    Storage ESS and DS8000are as follows;򐂰  ESCON® - One stripe per channel򐂰  FICON®
    - One stripe per physical volume򐂰  FCP - One stripe per volume or LUNWhen the
    logical volume is created one of the parameters is the stripe size. Thebest stripe
    size is dependent on the workload characteristics. The IBM Web siterecommends
    16 K or 32 K stripe sizes. In testing typical OLTP type applicationseither 4 K
    or 8 K worked better. Applications such as Samba that may servelarge files do
    better with a 64 K stripe. So the message here is that if you do notalready know
    the optimal stripe size for your application, it may take some testingto determine
    what that size might be.Chapter 2\. Best practices for installing an Oracle Database
    10g on Linux on zSeries 19A final thought on this is that faster and newer is
    always better. Someimplementations have experienced up to a 50 percent performance
    improvementjust going from ESCON to FICON.Parallel Access Volumes can be used
    with z/VM and Linux. This lets the ESS800write from parallel processes to the
    same device. The writes will occur in differentdomains within the volume. This
    feature is only available on the IBM ESS800.2.3.4 Monitoring the systemz/VM provides
    extensive virtualization techniques. A virtual machine runningunder z/VM acts
    as if it has all the resources allocated to it in the user directprofile that
    was created for the virtual machine. This means that monitoring whata virtual
    machine is doing by looking at resource utilization with a tool or monitorrunning
    in that virtual machine may not always be accurate.Since monitoring a virtual
    machine from the virtual machine is not alwaysaccurate, it is extremely important
    to use a tool to monitor the z/VM system andall the virtual machines from a system
    perspective. There are two tools that wehave experince with and both provide value:򐂰  IBM
    Performance Toolkit for VM - Licensed through IBM򐂰  ESAMON from Velocity Software
    (http://www.velocity-software.com)While using one of these tools is absolutely
    necessary for performancemonitoring and tuning, do not overlook using tools like
    sar to vmstat monitorevents and resource utilization such as swapping in a Linux
    virtual machine.Yet another way to monitor performance, especially during times
    when problemsare suspected, is the use of CP commands such as cp indicate load.
    Theseare very valid to use for a current point in time but do not provide the
    ability to goback to review past performance, as does one of the tools mentioned
    above.The purpose of this chapter is to describe the configuration of Linux and
    z/VM.However, this is for an Oracle database, and using a tool such as Statspack
    (orDB Control for 10g) is still an important way to monitor and tune the Oracledatabase
    server.2.4 SummaryThe following is a summary of the key points needed to get the
    best performancefrom Oracle.򐂰  Memory - This is likely the most critical area
    of tuning Linux virtual machines.The mindset here is the exact opposite of Linux
    on Intel. The less memory the[](http://www.velocity-software.com)20 Experiences
    with Oracle 10g Database for Linux on zSeriesbetter. Memory assigned to Linux
    should be enough to cover the needs of theOracle database (SGA + PGA) and about
    128 MBs more for Linux.򐂰  Monitor resources - The more virtual machines installed
    under z/VM the moreyou will need to use a system monitor such as the z/VM Toolkit.
    Trying tounderstand performance problems and determine capacity needs without
    thistype of monitor is impossible.򐂰  Paging and swap space - Paging at the z/VM
    level and Linux level (swapping)is most practically unavoidable. You must allow
    for this. Expanded storage isan absolute must, as is swap space (paging device)
    on Linux. The bestpaging device for Linux is a VDISK.򐂰  Avoid I/O bottlenecks
    - Use a best practice for configuring and using disk.Data must be distributed
    as well as possible across different ranks. Thelogical volumes should be striped,
    with the number of stripes beingdependent on the technology used.![](Images/bg1f.png)©
