    sample Pro*COBOL precompiler programs provided thatdemonstrate the use of embedded
    SQL to access an Oracle 10g Database. Thesamples are installed in the $ORACLE_HOME/precomp/demo/procob2
    directoryfrom the Oracle Companion Products CD. The samples are sample1-14.pco
