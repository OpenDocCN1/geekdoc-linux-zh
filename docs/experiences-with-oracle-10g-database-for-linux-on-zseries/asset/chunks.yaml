    the TDPO client to back up a tablespace.Both RMAN and TSM/TDPO contain much more
    function than shown here. TheRecovery Manager function along with the Tivoli applications
    provide the toolsnecessary to develop and maintain a backup strategy for Oracle
    databases. Alldatabases with critical data should have a backup strategy in place.
    While Tivoliis one product to help manage the backup sets created by Recovery
    Manager,there are other products available. We chose to use Tivoli, as it was
    an IBMproduct and easy for us to obtain, and gave us the chance to work with a
    betacopy of TDPO.![](Images/bga3.png)© Copyright IBM Corp. 2005\. All rights reserved.  153Chapter
    7.  Using Cobol and C/C++ withOracle Database 10gThis chapter contains examples
    of using COBOL and C/C++ with an Oracle 10gDatabase on Linux on zSeries. In this
    chapter we used the COBOL compilerfrom ACUCORP and the COBOL compiler from MicroFocus.7154
    Experiences with Oracle 10g Database for Linux on zSeries7.1 Working with Pro*Cobol
    and sample programsPro*COBOL is a programming tool that enables you to embed SQL
    statements ina COBOL program. The Pro*COBOL precompiler converts the SQL statementsin
    the COBOL program into standard Oracle run-time library calls. The generatedoutput
    file can then be compiled, linked, and run in the usual manner.The objective of
    this section is to perform the setup necessary to run thePro*COBOL precompiler
    programs provided with Oracle 10g Database.7.1.1 Install the Pro*COBOL precompilerYou
    need to install the Pro*COBOL precompiler, as it is not installed with thedatabase
    installation. You can install it from the client CD.1.  Start a VNC client session
    for the oracle user.2.  Extract the files from the client CD.# cpio -idmc < ship_lnx390_client.cpioThis
    will extract contents of the client CD and place it in a directory calledDisk1.3.  Start
    the Oracle Universal Install (OUI).# cd Disk1# ./runInstaller &4.  At the Welcome
    window, click Next to continue.5.  At the Specify File Locations window, click
    Next to accept the defaults.6.  At the Select Installation Type window, select
    Administrator and click Next.![](Images/bga5.png)Chapter 7\. Using Cobol and C/C++
    with Oracle Database 10g 155Figure 7-1 Select Installation Type panel7.  At the
    Summary window, click Install to start the installation. Note thatPro*COBOL is
    listed as one of the new installations.Figure 7-2 Summary panel156 Experiences
    with Oracle 10g Database for Linux on zSeries8.  The installation will take a
    few minutes, depending on the system load. Whenthe installation is complete, click
    Exit.9.  Verify that the Pro*COBOL precompiler has been installed successfully.#
    procob | moreYou should see output similar to the following:Pro*COBOL: Release
    10.1.0.3.0 - Production on Tue Aug 10 19:15:36 2004Copyright (c) 1982, 2004, Oracle.
    All rights reserved.System default option values taken from:/oracle/o10g/precomp/admin/pcbcfg.cfgOption
