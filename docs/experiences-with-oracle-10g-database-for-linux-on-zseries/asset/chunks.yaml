    Checking the Linux kernel settingsCheck the kernel parameters as per Section 2
    of the installation guide beginningon page 2-44\. The most important parameter
    is shmmax. This limits the largestshared memory segment allowed and therefore
    can limit the amount of memoryfor Oracle and the Systems Global Area (SGA). It
    can be set as large as youwish, even beyond the amount of memory on the system.
    But if you set it toosmall, then Oracle will not start. Follow these steps:1.  Log
    on as root.2.  cd /proc/sys/kernel3.  cat semOur entry was 250 2560000 32 1024.4.  cat
    shmmaxOur entry was 33554432.5.  cat shmmniOur entry was 4096.The Oracle doc recommends
    that the sem value be set to 100\. In our case, thedefault was 32\. It is the
    third parameter in the set when you issue a catcommand such as cat /proc/sys/kernel/sem.We
    increased the shmmax as well as semopm. For this, we created the file/etc/sysctl.conf
    and added only the following entries:kernel.sem=250 32000 100 28kernel.shmmax=2147483648Then
