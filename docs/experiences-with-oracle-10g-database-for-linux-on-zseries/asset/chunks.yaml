    2 7043 7018 /dev/raw/raw4DISKGROUP2_0000 2 7043 7016 /dev/raw/raw36 rows selected.We
    are going to insert a new disk in that diskgroup and ask ASM to distribute thedata
    evenly amongst the three disks.Example 4-8 Adding a new diskSQL> alter diskgroup
    diskgroup1 add disk ''/dev/raw/raw5'' rebalance power 1;Diskgroup altered.SQL>
    select group_number,operation,state,est_work,sofar,est_rate,est_minutesfrom v$asm_operation;GROUP_NUMBER
    OPERA STAT EST_WORK SOFAR EST_RATE EST_MINUTES------------ ----- ---- ----------
    ---------- ----------1 REBAL RUN 715 64 428 1The above alter command, used to
    add a new disk, also allows us to specify arebalance power. This power will influence
