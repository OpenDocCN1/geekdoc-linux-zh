    All rights reserved.  223Appendix B.  Overview of ESALPSFor the measurements and
    analysis for this book, ESALPS (Linux PerformanceSuite)from Velocity Software
    was used because of its capabilities and focus onthe z/VM and Linux environments.B224
    Experiences with Oracle 10g Database for Linux on zSeriesESALPS overviewESALPS,
    the Linux Performance Suite, is a suite of products provided byVelocity Software
    for measurement and tuning of z/VM, Linux under z/VM, andapplications in this
    environment. The four products that make up this suite are:򐂰  ESAMAP, the VM Monitor
    Analysis Program, providing performance reportson all aspects of VM/ESA and z/VM
    performance򐂰  ESAMON, the VM Real Time Monitor, providing real-time data collection
    andanalysis of performance򐂰  ESATCP, the network and Linux data collection program򐂰  ESAWEB,
    a very fast VM-based Web serverESALPS featuresESALPS provides the following features:򐂰  Full
    function z/VM performance monitor allows for monitoring of all z/VMsubsystems,
    including full reporting, real-time analysis, and managementreporting.򐂰  Network
    Monitor: Allows monitoring of your Internet servers via SNMP.򐂰  Linux Monitor:
    Allows monitoring of your Linux disks, storage, and processes.When running under
    z/VM, the CPU busy statistics from the /proc file systemare incorrect, sometimes
    by as much as an order of magnitude. ESALPS hasaccess to the true data, as measured
    by z/VM. It is the only monitor on themarket today that corrects the data returned
    by the /proc file system, so thatreports including CPU time by Linux guests under
    z/CVM are correct.򐂰  Monitoring NT, SUN, HP: ESALPS will monitor any server that
    supports thestandard SNMP mibs. This includes network information, disk and storageinformation,
    and process data. ESALPS also includes custom mibs throughan rpm-based install
    that provides additional information.򐂰  Web serving: ESALPS includes a full-function
    Web server to provide browseraccess to the ESALPS reports, and also to allow Web
    site support and CGIdevelopment on the VM platform.򐂰  Alerts: Many different types
    of alerts can be set up for network availabilitymonitoring. These include z/VM
    subsystem errors and threshold exceptions,and Linux errors and threshold exceptions.򐂰  Full
    Performance Database (PDB): ESALPS provides both real-time data andhistorical
    data for in-depth analysis. The performance data is collected dailywith a one-minute
    granularity based on the monitor interval. A longer-termAppendix B. Overview of
    ESALPS 225archive is collected, with a default granularity of 15 minutes. This
    PDBincludes VM data, Linux data, and network data.Critical agent technologyOne
    of the powerful features of ESALPS is the agent technology. Agents runninginside
    Linux may be either active agents or passive agents. An active agent willwake
    up every few seconds on a regular schedule, collect data, possibly writedata to
    a log, and then sleep. A passive agent will wait for an external datarequest and
    will not otherwise wake up and use resource.The issue is that under z/VM, we expect
    to have maybe hundreds of Linuxservers, of which many will be idle. With an active
    agent in each of them, theLinux servers are not idle, and may consume excessive
    resources just byprocessing the active agent requests. Thus, the only way to conserve
    resourcesis to eliminate the active agent from most or all of the servers.With
    the passive technology enabled by using SNMP agents, ESALPS will knowthat a server
    is idle because of the z/VM data, and will not have to wake up anagent inside
    Linux, thus causing additional paging and CPU consumption, todetermine and record
    the fact that the server is idle. Thus, the idle servers willnot be measured until
    they become active.The operational cost of agents may be quite high. On other
    non-virtualizedservers, the cost is relatively insignificant, as it only impacts
    the applications onthat one server. In a virtualized environment where sharing
    resources is aprimary objective, resources used by each agent reduce the resources
    availableto all of the other servers. Minimizing the cost of running these agents
    is criticalto the success of monitoring many Linux servers under z/VM. The SNMP
    passiveagent technology is believed to be the lowest cost agent technology available.NETSNMP
    extensionsThe design of NETSNMP and SNMP host-specific MIBs was found lacking
    in afew areas. Velocity Software has extended the mibs supported by NETSNMP.This
    agent can be downloaded from Velocity Software’s Web site. This correctsmeasured
    values such as swap rate, and provides added process data thoughtnecessary to
    meet the needs of this environment. This agent is also modified touse less resource
    than the NETSNMP that would come with the normal Linuxdistributions.226 Experiences
    with Oracle 10g Database for Linux on zSeriesMonitoring requirementsThere are
    many requirements for data collection met by ESALPS. Data isprovided for:򐂰  Capacity
    planning: Long-term data in the form of a performance database(PDB) is needed
    as input to long-term capacity planning and trend analysis.Full historical data
    functions are provided with collection and may forms ofdata extraction tools.򐂰  Performance
    analysis: Trend data allows the analyst to detect performancechanges in any of
    thousands of potential problem areas. The performancedatabase allows analysts
    to determine what of many potential changesoccurred in the system. Reporting on
    specific periods of time can beperformed, allowing in-depth performance analysis
    of performance problems.򐂰  Real-time performance: Beyond the traditional entry-level
    real-timeperformance reporting of the top users and system utilization, in real
    time.򐂰  Performance analysis is provided for all subsystems—user activity as well
    asLinux (and many other platforms) servers. Network data is also provided inreal
    time.򐂰  Linux data: With the advent of virtual Linux server farms on z/VM,performance
    data from the Linux guest machine is required. ESALPSprovides a centralized repository
    for this data.Standard interfaceESALPS uses standard interfaces for all data collection.
    The advantage to usingthe standard interfaces provided is that when there are
    a multitude of releasesand distributions available, the standard interfaces will
    provide consistent datasources.򐂰  z/VM provides amonitor interface that has been
    available since 1988\. Sincethen, this interface has provided a consistent view
    of performance of VMsystems.򐂰  Network performance is collected using SNMP, the
    standard for networkmanagement.򐂰  NETSNMP, an open source software package provides
    host data for Linuxand other platforms.򐂰  VM Application data interface is used
    by applications to insert data into themonitor stream consistent with the standard
    monitor interface. ESATCP usesthis interface to ensure consistent data collection
    that allows full integration ofLinux and VM data.© Copyright IBM Corp. 2005\.
