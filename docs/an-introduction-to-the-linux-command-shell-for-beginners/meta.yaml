  mdcn: '

    ## 5.2 查找内容

    以下命令用于查找文件。如果你已经大致知道文件的位置，"ls" 是查找文件的不错选择，但有时你需要更强大的工具，比如下面这些：

    | Linux 命令 | 说明 |

    |---|---|

    | **which** | 显示在你的 PATH 环境变量中找到的 shell 命令的完整路径。例如，如果你想精准定位 "grep" 命令在文件系统中的位置，可以输入
    `which grep`。输出结果通常会类似如下内容：/bin/grep |

    | **whereis** | 定位命令的程序、源代码和手册页（若所有信息均可用）。例如，要查找 "ls" 命令及其手册页的位置，输入：`whereis ls`。输出结果通常会类似如下内容：ls:
    /bin/ls /usr/share/man/man1/ls.1.gz |

    | **locate** | 在文件系统的任意位置快速搜索文件。例如，你可以输入 `locate mozilla` 来查找所有名称包含 "mozilla"
    的文件和目录。 |

    | **find** | 一个*非常*强大的命令，但使用时可能存在一些难点。它既可以用于搜索匹配特定模式的文件，也支持多种其他搜索场景。简单示例如下：`find
    . -name \*mp3`。该示例会从当前目录 "." 及其所有子目录开始搜索，查找文件名以 "mp3" 结尾的文件。 |


    ## 5.3 信息类命令

    以下命令用于获取用户或系统的相关信息：

    | Linux 命令 | 说明 |

    |---|---|

    | **ps** | 列出当前正在运行的进程（程序）。 |

    | **w** | 显示当前已登录的用户及其正在执行的操作。 |

    | **id** | 输出你的用户 ID 和组 ID。 |

    | **df** | 报告文件系统的磁盘空间使用情况（我用 "Disk Free" 来记忆这个命令）。 |

    | **du** | 特定目录的磁盘使用情况。"du -s" 会输出当前目录的汇总信息。 |

    | **top** | 以全屏图形界面显示 CPU 进程，是实时查看计算机运行情况的绝佳方式。输入 "Q" 即可退出。 |

    | **free** | 显示系统中空闲和已使用的内存量。 |

    | `cat /proc/cpuinfo` | 显示你的 CPU 相关信息。 |

    | `cat /proc/meminfo` | 显示当前内存使用情况的详细信息。 |

    | `uname -a` | 将系统信息（内核版本、机器类型等）输出到屏幕。 |


    ## 5.4 其他实用工具

    以下是其他一些值得了解的有用命令：

    | Linux 命令 | 说明 |

    |---|---|

    | `clear` | 清空屏幕。 |

    | `echo` | 在屏幕上显示文本，多在编写 shell 脚本时使用。例如：`echo "Hello World"` |

    | `more` | 逐页显示文件或程序输出。示例：`more mp3files.txt` `ls -la \| more` |

    | `less` | "more" 命令的改进替代品，支持向前和向后滚动。 |

    | `grep` | 在文件或程序输出中搜索指定模式。例如，要查找 "nfs" 服务使用的 TCP 网络端口，可以执行：`grep "nfs" /etc/services`。该命令会搜索文件
    "/etc/services" 中包含字符串 "nfs" 的所有行，仅输出匹配的结果。 |

    | `lpr` | 打印文件或程序输出。示例：`lpr mp3files.txt` - 打印 mp3files.txt 文件；`ls -la \| lpr`
    - 打印 "ls -la" 命令的输出结果。 |

    | `sort` | 对文件或程序输出进行排序。示例：`sort mp3files.txt` |

    | `su` | "切换用户"。允许你临时切换到其他用户的账户，默认切换至 root/超级用户账户。示例：`su` - 切换至 root 账户；`su -`
    - 切换至 root 账户，并以 root 的环境登录；`su larry` - 切换至 Larry 的账户。 |


    ## 5.5 让一切更轻松的快捷键！

    当你开始更频繁地使用 Bash shell 时，你会爱上这些能节省大量输入时间的快捷键：

    | 快捷键 | 说明 |

    |---|---|

    | 上/下方向键 | 浏览你最近使用过的命令。你可以回滚到旧命令，按下 `Enter` 键即可执行该命令，无需重新输入。 |

    | "history" 命令 | 显示完整的命令历史记录。 |

    | `Tab` 补全 | 如果你输入了 shell 可识别的部分命令或文件名，按下 `Tab` 键即可自动补全。试试输入你常用的 Linux 命令的前几个字符，然后连续按几次
    `Tab` 键看看会发生什么。 |

    | 用 "!" 补全最近使用的命令 | 试试这样操作：输入 "!"，接着输入最近使用过的命令的前几个字母，然后按下 `Enter` 键！例如，输入：`find
    /usr/bin -type f -name m\*`……接着输入：`!fi` |

    | 用 CTRL-R 搜索命令历史 | 按下 `CTRL-R`，然后输入最近使用过的命令的任意部分，它就会自动帮你搜索命令。找到你想要的命令后，按下 `Enter`
    键即可执行。 |

    | 用 `Shift-PageUp` 和 `Page Down` 滚动屏幕 | 在你的终端中向前或向后滚动屏幕。 |


    ## 6.0 延伸阅读

    | 链接地址 | 说明 |

    |---|---|

    | http://www.oclug.on.ca | 渥太华 Linux 用户组。该群体拥有活跃的邮件列表、月度会议等丰富活动。 |

    | http://www.exitcertified.com | 渥太华的 Sun 培训提供商，也是 OCLUG 技术研讨会的主办方。 |

    | http://www.fsf.org | 自由软件基金会。为 Linux 系统中常见的许多程序提供文档、源代码等资源。 |

    | http://linux.org.mt/article/terminal | 《Bash 入门指南》。另一本非常优秀的 Bash 入门教程。 |

    | http://www.oreilly.com/catalog/bash2 | 如果你想学习如何定制 Bash 并将其用于 shell 脚本编程，这是一本出色的书籍。
    |

    '
