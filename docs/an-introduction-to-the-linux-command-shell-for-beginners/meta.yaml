  md: '# # 5.0 Other Linux Commands


    The following sections describe many other commands that you will find on most
    Linux systems. I can''t possibly cover the details of all of these commands in
    this document, so don''t forget that you can check the “man pages” for additional
    information. Not all of the listed commands will be available on all Linux or
    UNIX distributions.


    # ## 5.1 Working With Files and Directories


    These commands can be used to: find out information about files, display files,
    and manipulate them in other ways (copy, move, delete).


    | Linux Command | DOS Command | Description |

    | :--- | :--- | :--- |

    | **file** | | Find out what kind of file it is.<br>For example, “file /bin/ls”
    tells us that it is a Linux executable file. |

    | **cat** | type | Display the contents of a text file on the screen. For example:
    cat mp3files.txt would display the file we created in the previous section. |

    | **head** | | Display the first few lines of a text file.<br>Example: head /etc/services
    |

    | **tail** | | Display the last few lines of a text file.<br>Example: tail /etc/services
    |

    | **tail -f** | | Display the last few lines of a text file, and then output appended
    data as the file grows (very useful for following log files!).<br>Example: tail
    -f /var/log/messages |

    | **cp** | copy | Copies a file from one location to another.<br>Example: cp mp3files.txt
    /tmp<br>(copies the mp3files.txt file to the /tmp directory) |

    | **mv** | rename, ren, move | Moves a file to a new location, or renames it.<br>For
    example: mv mp3files.txt /tmp<br>(copy the file to /tmp, and delete it from the
    original location) |

    | **rm** | del | Delete a file. Example: rm /tmp/mp3files.txt |

    | **mkdir** | md | Make Directory. Example: mkdir /tmp/myfiles/ |

    | **rmdir** | rd, rmdir | Remove Directory. Example: rmdir /tmp/myfiles/ |'
  merge: -1
  pgno: 9
