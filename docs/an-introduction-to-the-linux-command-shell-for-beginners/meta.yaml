- md: "## An Introduction to the Linux Command Shell For Beginners\nPresented by:\
    \ **Victor Gedris**\nIn Co-Operation With: **The Ottawa Canada Linux Users Group**\
    \ and **ExitCertified**\n\n## Copyright and Redistribution\nThis manual was written\
    \ with the intention of being a helpful guide to Linux users who are trying to\
    \ become familiar with the Bash shell and basic Linux commands. To make this manual\
    \ useful to the widest range of people, I decided to release it under a free documentation\
    \ license, with the hopes that people benefit from it by updating it and re-distributing\
    \ modified copies. You have permission to modify and distribute this document,\
    \ as specified under the terms of the GNU Free Documentation License. Comments\
    \ and suggestions for improvement may be directed to: [vic@gedris.org](mailto:vic@gedris.org).\n\
    \nThis document was created using an Open Source office application called *Open\
    \ Office*. The file format is non-proprietary, and the document is also published\
    \ in various other formats online. Updated copies will be available on Vic Gedris'\
    \ web site [http://vic.dyndns.org/]. For more information on Open Office, please\
    \ visit [http://www.openoffice.org/](http://www.openoffice.org/).\n\nCopyright\
    \ © 2003 Victor Gedris. Permission is granted to copy, distribute and/or modify\
    \ this document under the terms of the GNU Free Documentation License, Version\
    \ 1.1 or any later version published by the Free Software Foundation; with no\
    \ Invariant Sections, with no Front-Cover Texts, and with no Back-Cover Texts.\
    \ A copy of the license is available from the Free Software Foundation's website:\
    \ [http://www.fsf.org/copyleft/fdl.html](http://www.fsf.org/copyleft/fdl.html)\n\
    \nDocument Version: 1.2, 2003-06-25\n\n## 1.0 Introduction\nThe purpose of this\
    \ document is to provide the reader with a fast and simple introduction to using\
    \ the Linux command shell and some of its basic utilities. It is assumed that\
    \ the reader has zero or very limited exposure to the Linux command prompt. This\
    \ document is designed to accompany an instructor-led tutorial on this subject,\
    \ and therefore some details have been left out. Explanations, practical examples,\
    \ and references to DOS commands are made, where appropriate.\n\n### 1.1 What\
    \ is a command shell?\n- A program that interprets commands\n- Allows a user to\
    \ execute commands by typing them manually at a terminal, or automatically in\
    \ programs called *shell scripts*.\n- A shell is *not* an operating system. It\
    \ is a way to interface with the operating system and run commands.\n\n### 1.2\
    \ What is BASH?\n- BASH = **B**ourne **A**gain **SH**ell\n- Bash is a shell written\
    \ as a free replacement to the standard Bourne Shell (/bin/sh) originally written\
    \ by Steve Bourne for UNIX systems.\n- It has all of the features of the original\
    \ Bourne Shell, plus additions that make it easier to program with and use from\
    \ the command line.\n- Since it is Free Software, it has been adopted as the default\
    \ shell on most Linux systems.\n\n### 1.3 How is BASH different from the DOS command\
    \ prompt?\n- **Case Sensitivity:** In Linux/UNIX, commands and filenames are case\
    \ sensitive, meaning that typing “EXIT” instead of the proper “exit” is a mistake.\n\
    - **“\\” vs. “/”:** In DOS, the forward-slash “/” is the command argument delimiter,\
    \ while the backslash “\\” is a directory separator. In Linux/UNIX, the “/” is\
    \ the directory separator, and the “\\” is an escape character. More about these\
    \ special characters in a minute!\n- **Filenames:** The DOS world uses the “eight\
    \ dot three” filename convention, meaning that all files followed a format that\
    \ allowed up to 8 characters in the filename, followed by a period (“dot”), followed\
    \ by an option extension, up to 3 characters long (e.g. FILENAME.TXT). In UNIX/Linux,\
    \ there is no such thing as a file extension. Periods can be placed at any part\
    \ of the filename, and “extensions” may be interpreted differently by all programs,\
    \ or not at all.\n\n### 1.4 Special Characters\nBefore we continue to learn about\
    \ Linux shell commands, it is important to know that there are many symbols and\
    \ characters that the shell interprets in special ways. This means that certain\
    \ typed characters: a) cannot be used in certain situations, b) may be used to\
    \ perform special operations, or, c) must be \"escaped\" if you want to use them\
    \ in a normal way.\n\n| Character | Description |\n|---|---|\n| \\ | Escape character.\
    \ If you want to reference a special character, you must \"escape\" it with a\
    \ backslash first. Example: `touch /tmp/filename\\*` |\n| / | Directory separator,\
    \ used to separate a string of directory names. Example: `/usr/src/linux` |\n\
    | . | Current directory. Can also \"hide\" files when it is the first character\
    \ in a filename. |\n| .. | Parent directory |\n| ~ | User's home directory |\n\
    | * | Represents 0 or more characters in a filename, or by itself, all files in\
    \ a directory. Example: `pic*2002` can represent the files pic2002, picJanuary2002,\
    \ picFeb292002, etc. |\n| ? | Represents a single character in a filename. Example:\
    \ `hello?.txt` can represent hello1.txt, helloz.txt, but not hello22.txt |\n|\
    \ [ ] | Can be used to represent a range of values, e.g. [0-9], [A-Z], etc. Example:\
    \ `hello[0-2].txt` represents the names hello0.txt, hello1.txt, and hello2.txt\
    \ |\n| \\| | \"Pipe\". Redirect the output of one command into another command.\
    \ Example: `ls | more` |\n| > | Redirect output of a command into a new file.\
    \ If the file already exists, over-write it. Example: `ls > myfiles.txt` |\n|\
    \ >> | Redirect the output of a command onto the end of an existing file. Example:\
    \ `echo \"Mary 555-1234\" >> phonenumbers.txt` |\n| < | Redirect a file as input\
    \ to a program. Example: `more < phonenumbers.txt` |\n| ; | Command separator.\
    \ Allows you to execute multiple commands on a single line. Example: `cd /var/log\
    \ ; less messages` |\n| && | Command separator as above, but only runs the second\
    \ command if the first one finished without errors. Example: `cd /var/logs &&\
    \ less messages` |\n| & | Execute a command in the background, and immediately\
    \ get your shell back. Example: `find / -name core > /tmp/corefiles.txt &` |\n\
    \n### 1.5 Executing Commands\n#### The Command PATH:\n- Most common commands are\
    \ located in your shell's \"PATH\", meaning that you can just type the name of\
    \ the program to execute it. Example: Typing \"ls\" will execute the \"ls\" command.\n\
    - Your shell's \"PATH\" variable includes the most common program locations, such\
    \ as `/bin`, `/usr/bin`, `/usr/X11R6/bin`, and others.\n- To execute commands\
    \ that are not in your current PATH, you have to give the complete location of\
    \ the command. Examples:\n  - `/home/bob/myprogram`\n  - `./program` (Execute\
    \ a program in the current directory)\n  - `~/bin/program` (Execute program from\
    \ a personal bin directory)\n\n#### Command Syntax\nCommands can be run by themselves,\
    \ or you can pass in additional arguments to make them do different things. Typical\
    \ command syntax can look something like this:\n```\ncommand [-argument] [-argument]\
    \ [--argument] [file]\n```\n- Examples:\n  - `ls` — List files in current directory\n\
    \  - `ls -l` — Lists files in \"long\" format\n  - `ls -l --color` — As above,\
    \ with colourized output\n  - `cat filename` — Show contents of a file\n  - `cat\
    \ -n filename` — Show contents of a file, with line numbers\n\n## 2.0 Getting\
    \ Help\nWhen you're stuck and need help with a Linux command, help is usually\
    \ only a few keystrokes away! Help on most Linux commands is typically built right\
    \ into the commands themselves, available through online help programs (“man pages”\
    \ and “info pages”), and of course online.\n\n### 2.1 Using a Command's Built-In\
    \ Help\nMany commands have simple “help” screens that can be invoked with special\
    \ command flags. These flags usually look like “-h” or “--help”. Example: `grep\
    \ --help`\n\n### 2.2 Online Manuals: “Man Pages”\nThe best source of information\
    \ for most commands can be found in the online manual pages, known as “man pages”\
    \ for short. To read a command's man page, type “man command”. Examples:\n- `man\
    \ ls` Get help on the “ls” command.\n- `man man` A manual about how to use the\
    \ manual!\n\nTo search for a particular word within a man page, type “/word”.\
    \ To quit from a man page, just type the “Q” key. Sometimes, you might not remember\
    \ the name of Linux command and you need to search for it. For example, if you\
    \ want to know how to change a file's permissions, you can search the man page\
    \ descriptions for the word “permission” like this:\n`man -k permission`\nIf you\
    \ look at the output of this command, you will find a line that looks something\
    \ like:\n`chmod (1) - change file access permissions`\nNow you know that “chmod”\
    \ is the command you were looking for. Typing “man chmod” will show you the chmod\
    \ command's manual page!\n\n### 2.3 Info Pages\nSome programs, particularly those\
    \ released by the Free Software Foundation, use info pages as their main source\
    \ of online documentation. Info pages are similar to man page, but instead of\
    \ being displayed on one long scrolling screen, they are presented in shorter\
    \ segments with links to other pieces of information. Info pages are accessed\
    \ with the “info” command, or on some Linux distributions, “pinfo” (a nicer info\
    \ browser). For example:\n`info df`\nLoads the “df” info page."
  mdcn: "\n## Linux命令行Shell初学者入门指南\n演示者：**Victor Gedris**\n合作方：**渥太华加拿大Linux用户组**\
    \ 与 **ExitCertified**\n\n## 版权与再分发\n本手册旨在为希望熟悉Bash Shell和基础Linux命令的Linux用户提供实用指南。为了让手册尽可能惠及更多用户，我决定以自由文档许可证发布它，希望人们可以通过更新和再分发修改后的副本从中获益。根据GNU自由文档许可证的条款，您有权修改和分发本文档。改进建议和意见可发送至：[vic@gedris.org](mailto:vic@gedris.org)\n\
    本文档使用开源办公软件*OpenOffice*编写。文件格式为非专有格式，同时本文档也会以多种其他格式在线发布。更新后的副本可于Vic Gedris的个人网站[http://vic.dyndns.org/]获取。有关OpenOffice的更多信息，请访问[http://www.openoffice.org/](http://www.openoffice.org/)\n\
    版权所有 © 2003 Victor Gedris。根据GNU自由文档许可证（1.1版或自由软件基金会发布的任何更高版本）的条款，允许复制、分发和/或修改本文档；无固定章节、无封面文本、无封底文本。该许可证副本可在自由软件基金会的官网获取：[http://www.fsf.org/copyleft/fdl.html](http://www.fsf.org/copyleft/fdl.html)\n\
    文档版本：1.2，发布日期：2003年6月25日\n\n## 1.0 引言\n本文档旨在为读者提供Linux命令行Shell及其基础工具的快速、简明入门介绍。假设读者此前完全没有或极少接触过Linux命令行。本文档最初设计为配合该主题的讲师引导教程使用，因此省略了部分细节。在适当的情况下，文中会包含相关说明、实践示例，以及与DOS命令的对照参考。\n\
    \n### 1.1 什么是命令行Shell？\n- 解释命令的程序\n- 允许用户在终端手动输入命令执行，或在名为*Shell脚本*的程序中自动执行命令\n\
    - Shell*不是*操作系统，它是与操作系统交互、运行命令的一种方式\n\n### 1.2 什么是BASH？\n- BASH = **B**ourne **A**gain\
    \ **SH**ell\n- Bash是一个为替代标准的Bourne Shell（/bin/sh）而编写的Shell，最初的Bourne Shell由Steve\
    \ Bourne为UNIX系统开发\n- 它保留了原始Bourne Shell的全部特性，还新增了多项功能，使其更易用于编程和命令行操作\n- 由于它是自由软件，已成为大多数Linux系统的默认Shell\n\
    \n### 1.3 BASH与DOS命令行提示符有何不同？\n- **大小写敏感**：在Linux/UNIX系统中，命令和文件名区分大小写，这意味着输入“EXIT”而非正确的“exit”属于错误操作\n\
    - **“\\”与“/”的区别**：在DOS中，正斜杠“/”是命令参数的分隔符，反斜杠“\\”是目录分隔符；而在Linux/UNIX中，“/”是目录分隔符，“\\\
    ”是转义字符。我们稍后会详细介绍这些特殊字符！\n- **文件名**：DOS系统采用“8.3”文件名规范，即所有文件名的格式为：最多8个字符的文件名+句点（“点”）+最多3个字符的可选扩展名（例如FILENAME.TXT）。而在UNIX/Linux中并不存在“文件扩展名”这一概念，句点可以放在文件名的任意位置，“扩展名”可能被不同程序以不同方式解析，也可能完全不被识别。\n\
    \n### 1.4 特殊字符\n在继续学习Linux Shell命令之前，需要先了解：Shell会对大量符号和字符进行特殊解析。这意味着部分输入的字符：a)\
    \ 无法在特定场景下使用；b) 可用于执行特殊操作；c) 若要以常规方式使用，必须对其进行“转义”处理。\n\n| 字符 | 说明 |\n| --- | ---\
    \ |\n| \\ | 转义字符。如果要引用特殊字符，必须先用反斜杠对其进行“转义”处理。示例：`touch /tmp/filename\\*` |\n|\
    \ / | 目录分隔符，用于分隔一串目录名称。示例：`/usr/src/linux` |\n| . | 当前目录。若作为文件名的首字符，还可用于“隐藏”文件\
    \ |\n| .. | 上级目录 |\n| ~ | 用户的主目录 |\n| * | 可匹配文件名中的0个或多个字符，单独使用时代表目录内的所有文件。示例：`pic*2002`\
    \ 可匹配pic2002、picJanuary2002、picFeb292002等文件 |\n| ? | 可匹配文件名中的单个字符。示例：`hello?.txt`\
    \ 可匹配hello1.txt、helloz.txt，但无法匹配hello22.txt |\n| [ ] | 可用于表示取值范围，例如[0-9]、[A-Z]等。示例：`hello[0-2].txt`\
    \ 可匹配hello0.txt、hello1.txt、hello2.txt |\n| \\| | “管道”。可将一个命令的输出重定向为另一个命令的输入。示例：`ls\
    \ | more` |\n| > | 将命令的输出重定向到新文件中，若文件已存在则会覆盖原有内容。示例：`ls > myfiles.txt` |\n| >>\
    \ | 将命令的输出追加到已有文件的末尾。示例：`echo \"Mary 555-1234\" >> phonenumbers.txt` |\n| < |\
    \ 将文件作为输入重定向到程序中。示例：`more < phonenumbers.txt` |\n| ; | 命令分隔符，支持在一行中执行多条命令。示例：`cd\
    \ /var/log ; less messages` |\n| && | 与上述命令分隔符功能相同，但仅当第一条命令执行无错误时，才会执行第二条命令。示例：`cd\
    \ /var/logs && less messages` |\n| & | 在后台执行命令，执行后立即返回Shell提示符。示例：`find / -name\
    \ core > /tmp/corefiles.txt &` |\n\n### 1.5 执行命令\n#### 命令PATH：\n- 绝大多数常用命令都位于Shell的“PATH”路径下，这意味着你只需输入程序名称即可执行该命令。示例：输入“ls”即可执行“ls”命令\n\
    - Shell的“PATH”变量包含了最常用的程序路径，例如`/bin`、`/usr/bin`、`/usr/X11R6/bin`等\n- 若要执行当前PATH路径外的命令，需要输入该命令的完整路径\n\
    \  示例：\n  - `/home/bob/myprogram`\n  - `./program`（执行当前目录下的程序）\n  - `~/bin/program`（执行个人bin目录下的程序）\n\
    \n#### 命令语法\n命令可以单独运行，也可以传入额外参数来实现不同功能。典型的命令语法格式如下：\n``` command [-argument] [-argument]\
    \ [--argument] [file] ```\n- 示例：\n  - `ls` — 列出当前目录下的文件\n  - `ls -l` — 以“长格式”列出文件\n\
    \  - `ls -l --color` — 与上述命令功能相同，同时输出带颜色高亮的结果\n  - `cat filename` — 显示文件内容\n \
    \ - `cat -n filename` — 显示带行号的文件内容\n\n## 2.0 获取帮助\n当你遇到问题、需要获取Linux命令的相关帮助时，通常只需敲几下键盘就能找到！大多数Linux命令都内置了帮助功能，还可以通过在线帮助程序（即“man手册页”和“info手册页”）以及互联网获取帮助。\n\
    \n### 2.1 使用命令内置帮助\n许多命令都带有简单的“帮助”界面，可通过特定的命令标志调用。这类标志通常为“-h”或“--help”。示例：`grep\
    \ --help`\n\n### 2.2 在线手册：“Man手册页”\n大多数命令的最佳信息源是在线手册页，简称“man页”。要查看某命令的man页，只需输入“man\
    \ 命令名”。示例如下：\n- `man ls` — 获取“ls”命令的帮助\n- `man man` — 关于如何使用手册的手册！\n\n要在man页中搜索特定关键词，输入“/关键词”即可。要退出man页，只需按下“Q”键。有时你可能不记得某个Linux命令的名称，需要搜索查找。例如，如果你想知道如何修改文件权限，可以按照如下方式在man页描述中搜索关键词“permission”：`man\
    \ -k permission` 查看该命令的输出，你会发现一条类似下面的结果：`chmod (1) - change file access permissions`\
    \ 这就说明你要找的命令是“chmod”，输入“man chmod”即可查看chmod命令的手册页！\n\n### 2.3 Info手册页\n部分程序（尤其是自由软件基金会发布的程序）使用info页作为主要的在线文档来源。info页与man页类似，但不会以长滚动屏的形式展示，而是分为较短的段落，并附带跳转至其他相关信息的链接。要访问info页，可以使用“info”命令，部分Linux发行版还提供了“pinfo”（一款更友好的info浏览器）。示例：`info\
    \ df` 可加载“df”命令对应的info页。\n"
