  md: "# # 1.5 Executing Commands\n\n# ## The Command PATH:\n\n+   - Most common commands\
    \ are located in your shell's \"PATH\", meaning that you can just type the name\
    \ of the program to execute it.\n  Example: Typing \"ls\" will execute the \"\
    ls\" command.\n- Your shell's \"PATH\" variable includes the most common program\
    \ locations, such as `/bin`, `/usr/bin`, `/usr/X11R6/bin`, and others.\n- To execute\
    \ commands that are not in your current PATH, you have to give the complete location\
    \ of the command.\n  Examples: `/home/bob/myprogram`\n  `./program` (Execute a\
    \ program in the current directory)\n  `~/bin/program` (Execute program from a\
    \ personal bin directory)\n\n# ## Command Syntax\n\nCommands can be run by themselves,\
    \ or you can pass in additional arguments to make them do different things. Typical\
    \ command syntax can look something like this:\n\n```\ncommand [-argument] [-argument]\
    \ [--argument] [file]\n```\n\n+   - Examples:\n  - `ls` — List files in current\
    \ directory\n  - `ls -l` — Lists files in \"long\" format\n  - `ls -l --color`\
    \ — As above, with colourized output\n  - `cat filename` — Show contents of a\
    \ file\n  - `cat -n filename` — Show contents of a file, with line numbers"
  merge: -1
