  md: '# 5.2 Finding Things


    The following commands are used to find files. "ls" is good for finding files
    if you already know approximately where they are, but sometimes you need more
    powerful tools such as these:


    | Linux Command | Description |

    |---|---|

    | **which** | Shows the full path of shell commands found in your path. For example,
    if you want to know exactly where the "grep" command is located on the filesystem,
    you can type `which grep`. The output should be something like: /bin/grep |

    | **whereis** | Locates the program, source code, and manual page for a command
    (if all information is available). For example, to find out where "ls" and its
    man page are, type: `whereis ls` The output will look something like: ls: /bin/ls
    /usr/share/man/man1/ls.1.gz |

    | **locate** | A quick way to search for files anywhere on the filesystem. For
    example, you can find all files and directories that contain the name "mozilla"
    by typing: `locate mozilla` |

    | **find** | A *very* powerful command, but sometimes tricky to use. It can be
    used to search for files matching certain patterns, as well as many other types
    of searches. A simple example is:

    `find . -name \*mp3`

    This example starts searching in the current directory "." and all sub-directories,
    looking for files with "mp3" at the end of their names. |


    # 5.3 Informational Commands


    The following commands are used to find out some information about the user or
    the system.


    | Linux Command | Explanation |

    |---|---|

    | **ps** | Lists currently running process (programs). |

    | **w** | Show who is logged on and what they are doing. |

    | **id** | Print your user-id and group id''s |

    | **df** | Report filesystem disk space usage ("Disk Free" is how I remember it)
    |

    | **du** | Disk Usage in a particular directory. "du -s" provides a summary for
    the current directory. |

    | **top** | Displays CPU processes in a full-screen GUI. A great way to see the
    activity on your computer in real-time. Type "Q" to quit. |

    | **free** | Displays amount of free and used memory in the system. |

    | **cat /proc/cpuinfo** | Displays information about your CPU. |

    | **cat /proc/meminfo** | Display lots of information about current memory usage.
    |

    | **uname -a** | Prints system information to the screen (kernel version, machine
    type, etc.) |'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# ## 5.4 Other Utilities


    Here are some other commands that are useful to know.


    | Linux Command | Description |

    | --- | --- |

    | `clear` | Clear the screen |

    | `echo` | Display text on the screen. Mostly useful when writing shell scripts.
    For example: echo "Hello World" |

    | `more` | Display a file, or program output one page at a time. Examples:<br><br>`more
    mp3files.txt`<br><br>`ls -la | more` |

    | `less` | An improved replacement for the "more" command. Allows you to scroll
    backwards as well as forwards. |

    | `grep` | Search for a pattern in a file or program output. For example, to find
    out which TCP network port is used by the "nfs" service, you can do this:<br><br>`grep
    "nfs" /etc/services`<br><br>This looks for any line that contains the string "nfs"
    in the file "/etc/services" and displays only those lines. |

    | `lpr` | Print a file or program output. Examples:<br><br>`lpr mp3files.txt`
    - Print the mp3files.txt file<br><br>`ls -la | lpr` - Print the output of the
    "ls -la" command. |

    | `sort` | Sort a file or program output. Example: `sort mp3files.txt` |

    | `su` | "Switch User". Allows you to switch to another user''s account temporarily.
    The default account to switch to is the root/superuser account. Examples:<br><br>`su`
    - Switch the root account<br><br>`su -` - Switch to root, and log in with root''s
    environment<br><br>`su larry` - Switch to Larry''s account |'
  merge: -1
