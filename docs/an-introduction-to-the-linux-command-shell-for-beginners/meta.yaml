    This manual was written with the intention of being a helpful guide to Linux users
    who are trying to become familiar with the Bash shell and basic Linux commands.
    To make this manual useful to the widest range of people, I decided to release
    it under a free documentation license, with the hopes that people benefit from
    it by updating it and re-distributing modified copies. You have permission to
    modify and distribute this document, as specified under the terms of the GNU Free
    Documentation License. Comments and suggestions for improvement may be directed
    to: [vic@gedris.org](mailto:vic@gedris.org).


    This document was created using an Open Source office application called *Open
    Office*. The file format is non-proprietary, and the document is also published
    in various other formats online. Updated copies will be available on Vic Gedris''
