    # ## 2.0 Getting Help


    When you''re stuck and need help with a Linux command, help is usually only a
    few keystrokes away! Help on most Linux commands is typically built right into
    the commands themselves, available through online help programs (“man pages” and
    “info pages”), and of course online.


    # ## 2.1 Using a Command''s Built-In Help


    Many commands have simple “help” screens that can be invoked with special command
    flags. These flags usually look like “-h” or “--help”.


    Example: `grep --help`


    # ## 2.2 Online Manuals: “Man Pages”


    The best source of information for most commands can be found in the online manual
    pages, known as “man pages” for short. To read a command''s man page, type “man
    command”.


    Examples: `man ls` Get help on the “ls” command.

    `man man` A manual about how to use the manual!


    To search for a particular word within a man page, type “/word”. To quit from
    a man page, just type the “Q” key.


    Sometimes, you might not remember the name of Linux command and you need to search
    for it. For example, if you want to know how to change a file''s permissions,
    you can search the man page descriptions for the word “permission” like this:


    `man -k permission`


    If you look at the output of this command, you will find a line that looks something
    like:


    `chmod (1) - change file access permissions`


    Now you know that “chmod” is the command you were looking for. Typing “man chmod”
    will show you the chmod command''s manual page!


    # ## 2.3 Info Pages


    Some programs, particularly those released by the Free Software Foundation, use
    info pages as their main source of online documentation. Info pages are similar
    to man page, but instead of being displayed on one long scrolling screen, they
    are presented in shorter segments with links to other pieces of information. Info
    pages are accessed with the “info” command, or on some Linux distributions, “pinfo”
    (a nicer info browser).


    For example: `info df` Loads the “df” info page.'
- md: '## 3.0 Navigating the Linux Filesystem

    The Linux filesystem is a tree-like hierarchy of directories and files. At the
    base of the filesystem is the "/" directory, otherwise known as the "root" (not
    to be confused with the root user). Unlike DOS or Windows filesystems that have
    multiple "roots", one for each disk drive, the Linux filesystem mounts all disks
    somewhere underneath the / filesystem. The following table describes many of the
    most common Linux directories.


    ### 3.1 *The Linux Directory Layout*

    | Directory | Description |

    |-----------|-------------|

    |  | The nameless base of the filesystem. All other directories, files, drives,
    and devices are attached to this root. Commonly (but incorrectly) referred to
    as the "slash" or "/" directory. The "/" is just a directory separator, not a
    directory itself. |

    | `/bin` | Essential command binaries (programs) are stored here (`bash`, `ls`,
    `mount`, `tar`, etc.) |

    | `/boot` | Static files of the boot loader. |

    | `/dev` | Device files. In Linux, hardware devices are accessed just like other
    files, and they are kept under this directory. |

    | `/etc` | Host-specific system configuration files. |

    | `/home` | Location of users'' personal home directories (e.g. `/home/susan`).
    |

    | `/lib` | Essential shared libraries and kernel modules. |

    | `/proc` | Process information pseudo-filesystem. An interface to kernel data
    structures. |

    | `/root` | The root (superuser) home directory. |

    | `/sbin` | Essential system binaries (`fdisk`, `fsck`, `init`, etc). |

    | `/tmp` | Temporary files. All users have permission to place temporary files
    here. |

    | `/usr` | The base directory for most shareable, read-only data (programs, libraries,
    documentation, and much more). |

    | `/usr/bin` | Most user programs are kept here (`cc`, `find`, `du`, etc.). |

    | `/usr/include` | Header files for compiling C programs. |

    | `/usr/lib` | Libraries for most binary programs. |

    | `/usr/local` | "Locally" installed files. This directory only really matters
    in environments where files are stored on the network. Locally-installed files
    go in `/usr/local/bin`, `/usr/local/lib`, etc.. Also often used for software packages
    installed from source, or software not officially shipped with the distribution.
    |

    | `/usr/sbin` | Non-vital system binaries (`lpd`, `useradd`, etc.) |

    | `/usr/share` | Architecture-independent data (icons, backgrounds, documentation,
    terminfo, man pages, etc.). |

    | `/usr/src` | Program source code. E.g. The Linux Kernel, source RPMs, etc. |

    | `/usr/X11R6` | The X Window System. |

    | `/var` | Variable data: mail and printer spools, log files, lock files, etc.
    |


    ### 3.2 Commands for Navigating the Linux Filesystems

    The first thing you usually want to do when learning about the Linux filesystem
    is take some time to look around and see what''s there! These next few commands
    will: a) Tell you where you are, b) take you somewhere else, and c) show you what''s
    there. The following table describes the basic operation of the pwd, cd, and ls
    commands, and compares them to certain DOS commands that you might already be
    familiar with.

    | Linux Command | DOS Command | Description |

    |---------------|-------------|-------------|

    | **pwd** | cd | "Print Working Directory". Shows the current location in the
    directory tree. |

    | **cd** | cd, chdir | "Change Directory". When typed all by itself, it returns
    you to your home directory. |

    | **cd directory** | cd directory | Change into the specified directory name.
    Example: `cd /usr/src/linux` |

    | **cd ~** |  | "~" is an alias for your home directory. It can be used as a shortcut
    to your "home", or other directories relative to your home. |

    | **cd ..** | cd.. | Move up one directory. For example, if you are in /home/vic
    and you type "cd ..", you will end up in /home. |

    | **cd -** |  | Return to previous directory. An easy way to get back to your
    previous location! |

    | **ls** | dir /w | List all files in the current directory, in column format.
    |

    | **ls directory** | dir directory | List the files in the specified directory.
    Example: `ls /var/log` |

    | **ls -l** | dir | List files in "long" format, one file per line. This also
    shows you additional info about the file, such as ownership, permissions, date,
    and size. |

    | **ls -a** | dir /a | List all files, including "hidden" files. Hidden files
    are those files that begin with a ".", e.g. the `.bash_history` file in your home
    directory. |

    | **ls -ld directory** |  | A "long" list of "directory", but instead of showing
    the directory contents, show the directory''s detailed information. For example,
    compare the output of the following two commands: `ls -l /usr/bin` `ls -ld /usr/bin`
    |

    | **ls /usr/bin/d*** | dir d*.* | List all files whose names begin with the letter
    "d" in the /usr/bin directory. |


    ## 4.0 Piping and Re-Direction

    Before we move on to learning even more commands, let''s side-track to the topics
    of piping and re-direction. The basic UNIX philosophy, therefore, by extension
    the Linux philosophy, is to have many small programs and utilities that do a particular
    job very well. It is the responsibility of the programmer or user to combine these
    utilities to make more useful command sequences.


    ### 4.1 Piping Commands Together

    The pipe character, "|", is used to chain two or more commands together. The output
    of the first command is "piped" into the next program, and if there is a second
    pipe, the output is sent to the third program, etc. For example:

    ```

    ls -la /usr/bin | less

    ```

    In this example, we run the command "ls -la /usr/bin", which gives us a long listing
    of all of the files in /usr/bin. Because the output of this command is typically
    very long, we pipe the output to a program called "less", which displays the output
    for us one screen at a time.


    ### 4.2 Redirecting Program Output to Files

    There are times when it is useful to save the output of a command to a file, instead
    of displaying it to the screen. For example, if we want to create a file that
    lists all of the MP3 files in a directory, we can do something like this, using
    the ">" redirection character:

    ```

    ls -l /home/vic/MP3/*.mp3 > mp3files.txt

    ```

    A similar command can be written so that instead of creating a new file called
    mp3files.txt, we can append to the end of the original file:

    ```

    ls -l /home/vic/extraMP3s/*.mp3 >> mp3files.txt

    ```


    ## 5.0 Other Linux Commands

    The following sections describe many other commands that you will find on most
    Linux systems. I can''t possibly cover the details of all of these commands in
    this document, so don''t forget that you can check the "man pages" for additional
    information. Not all of the listed commands will be available on all Linux or
    UNIX distributions.


    ### 5.1 Working With Files and Directories

    These commands can be used to: find out information about files, display files,
    and manipulate them in other ways (copy, move, delete).

    | Linux Command | DOS Command | Description |

    | :--- | :--- | :--- |

    | **file** |  | Find out what kind of file it is.<br>For example, “file /bin/ls”
    tells us that it is a Linux executable file. |

    | **cat** | type | Display the contents of a text file on the screen. For example:
    cat mp3files.txt would display the file we created in the previous section. |

    | **head** |  | Display the first few lines of a text file.<br>Example: head /etc/services
    |

    | **tail** |  | Display the last few lines of a text file.<br>Example: tail /etc/services
    |

    | **tail -f** |  | Display the last few lines of a text file, and then output
    appended data as the file grows (very useful for following log files!).<br>Example:
    tail -f /var/log/messages |

    | **cp** | copy | Copies a file from one location to another.<br>Example: cp mp3files.txt
    /tmp<br>(copies the mp3files.txt file to the /tmp directory) |

    | **mv** | rename, ren, move | Moves a file to a new location, or renames it.<br>For
    example: mv mp3files.txt /tmp<br>(copy the file to /tmp, and delete it from the
    original location) |

    | **rm** | del | Delete a file. Example: rm /tmp/mp3files.txt |

    | **mkdir** | md | Make Directory. Example: mkdir /tmp/myfiles/ |

    | **rmdir** | rd, rmdir | Remove Directory. Example: rmdir /tmp/myfiles/ |'
