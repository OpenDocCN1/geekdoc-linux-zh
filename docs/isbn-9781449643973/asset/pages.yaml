    act as the Instructor’s demo lab workstation. The instructor will display the
    instructor workstation on the LCD projector to demo the loading and configuring
    of the Instructor VM workstation using VMware Player.

    +   C)  Student Lab workstations will use their own VM server farm and VM student
    workstation. VMware Player will be used to run the Student VM and the Target VM.'
