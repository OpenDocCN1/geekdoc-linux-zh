    # Overview


    In this lab the students review the install of a Fedora Linux Server that will
    act as a web server for a fictitious financial institution. The installation process,
    applying passwords, creating partitions, and system administrator access controls
    will be part of the operating system configuration requirements.


    # Lab Assessment Questions & Answers


    +   1.  During the install, the option to sync with a NTP (Network Time Protocol)
    server was checked. From a security perspective, why is it important for a system
    to keep accurate time?


    +   2.  During the install, a password has been set for the "root" user. What
    is the "root" user, and when is it appropriate to use this account?'
  merge: -1
