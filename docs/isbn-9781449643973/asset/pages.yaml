  md: '# # Laboratory #5


    # ## Lab #5: Apply Hardened Security for Linux Services & Applications


    ## Learning Objectives and Outcomes


    Upon completing this lab, students will be able to complete the following tasks:


    +   *   Harden Linux server services when enabling and installing them, and keep
    a security perspective during configuration

    +   *   Create an Apache Web Server installation and perform basic security configurations
    to assure that the system has been hardened before hosting a web site

    +   *   Configure and perform basic security for a MySQL database, understanding
    the ramifications of a default installation and recommending hardening steps for
    the database instance

    +   *   Install, setup and perform basic security configuration for Sendmail to
    be able to leverage the built-in messaging capabilities of the Linux System

    +   *   Enable and implement secure SSH for encrypted remote access over the network
    or across the Internet of a Linux server system


