- pgno: 23
  md: "```\n```\n## Networking\nCmd_Alias NETWORKING = /sbin/route, /sbin/ifconfig,\
    \ /bin/ping, /sbin/dhclient, /usr/bin/net, /sbin/iptables, /usr/bin/rfcomm, /usr/bin/wvdial,\
    \ /sbin/iwconfig, /sbin/mii-tool\n\n## Installation and management of software\n\
    Cmd_Alias SOFTWARE = /bin/rpm, /usr/bin/up2date, /usr/bin/yum\n\n## Services\n\
    Cmd_Alias SERVICES = /sbin/service, /sbin/chkconfig\n\n## Updating the locate\
    \ database\nCmd_Alias LOCATE = /usr/bin/updatedb\n\n## Storage\nCmd_Alias STORAGE\
    \ = /sbin/fdisk, /sbin/sfdisk, /sbin/parted, /sbin/partprobe, /bin/mount, /bin/umount\n\
