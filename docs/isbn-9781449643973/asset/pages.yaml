- pgno: 20
  md: 'NOTE: For now, the system should operate in "permissive" mode. Permissive mode
    will post an alert when a process would have been denied, but will not actually
    deny anything. In a later unit, SELinux will be set back to "enforcing" mode.


    +   22. Edit the SELinux config file. Type the command: `su -c ''vi /etc/selinux/config''`
    and press <enter>.\n23. Password: ISS316Security\n24. Press the " i " key to enter
    INSERT mode.\n25. Change SELINUX setting SELINUX=enforcing to SELINUX= permissive
    .


    ```

    # This file controls the state of SELinux on the system.\n# SELINUX= can take
    one of these three values:\n#       enforcing - SELinux security policy is enforced.\n#       permissive
    - SELinux prints warnings instead of enforcing.\n#       disabled - SELinux is
    fully disabled.\nSELINUX=permissive #\n# SELINUXTYPE= type of policy in use. Possible
    values are:\n#       targeted - Only targeted network daemons are protected.\n#       strict
    - Full SELinux protection.\nSELINUXTYPE=targeted\n.

    ```


    ![](img/73be0eef2ceb12f43f3eb92c420134f5_20_0.png)


    +   26. Save the changes and exit the file. Hit the escape key to exit from insert
    mode, then hit the “shift” & “:” keys to enter command mode. At the colon prompt
    in command mode, type wq to exit and save changes.\n27. Check SELinux configuration
    and current mode. Type the command: `sestatus` and press <enter>.'
  merge: -1
