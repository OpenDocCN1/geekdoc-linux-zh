    \ LLC，Ascend Learning 公司旗下企业\nwww.jblearning.com\n保留所有权利。\n当前版本日期：2011/10/10\n\
    -49-\n\n8. SW 包管理工具的名称是什么？\n9. Fedora 14 的代码名称是什么，以及它是在什么时候发布的？\n10. Linux 中的\
    \ repquota 命令有什么用？请解释。\n\n## 实验 #5：为 Linux 服务和应用程序应用加固的安全措施\n\n### 学习目标与成果\n\n\
    完成本实验后，学生将能够执行以下任务：\n\n- 在启用和安装 Linux 服务器服务时进行安全加固，并在配置过程中保持安全意识\n- 创建 Apache\
    \ Web 服务器安装并执行基本安全配置，以确保系统在托管网站前已得到加固\n- 配置 MySQL 数据库并执行基本安全措施，理解默认安装的影响，并为数据库实例推荐加固步骤\n\
    - 安装、设置 Sendmail 并执行基本安全配置，以便利用 Linux 系统的内置消息传递功能\n- 启用并实现安全的 SSH，以通过加密方式跨网络或互联网远程访问\
    \ Linux 服务器系统\n\n### 所需设置和工具\n\n本实验不需要使用模拟 IT 基础设施 - Cisco 核心骨干网络。此外，教师虚拟机工作站和学生虚拟机工作站应与内部网络物理断开连接，并隔离在课堂专用的二层交换机上。这将允许使用共享的\
    \ DHCP 服务器来为教师和学生工作站分配 IP 地址。\n\n以下设备型实验所需的内容包括：\n\n- A) 一个能够支持连接至课堂二层交换机的虚拟机服务器农场（包含可移动硬盘）的课堂工作站（至少配备\
    \ 2 GB RAM）。\n- B) 一个教师工作站（建议至少配备 4 GB RAM），作为教师的演示实验工作站。教师将在 LCD 投影仪上显示教师工作站，以演示使用\
    \ VMware Player 加载和配置教师虚拟机工作站的过程。\n- C) 学生实验工作站将使用其自己的虚拟机服务器农场和虚拟机工作站。将使用 VMware\
    \ Player 来运行学生虚拟机和目标虚拟机。\n\n以下总结了执行实验 #5 所需的设置、配置和设备：\n\n- 1. 一个包含以下组件的虚拟化服务器农场：\n\
    \  - a. 用于分配学生 IP 主机地址的 Microsoft DHCP 服务器\n  - b. 学生或/和教师虚拟机工作站\n  - c. 包含以下内容的\
    \ Fedora Linux 目标虚拟机：\n    - i. Apache\n    - ii. MySQL\n    - iii. Sendmail\n\
    - 2. 标准的现场学生工作站必须加载以下软件应用程序以执行此实验：\n  - a. VMware Player 3.x\n  - b. Microsoft\
    \ Office 2007 或更高版本，用于实验评估问题及答案\n\n### 建议的操作步骤\n\n#### 基于设备的实验 #5 – 学生步骤：\n\n\
    学生应执行以下步骤：\n\n- 1. 将学生可移动硬盘连接到您的工作站\n- 2. 启动学生虚拟机和 Microsoft DHCP 虚拟机服务器以分配 IP\
    \ 主机地址\n- 3. 启用您的 DOS 命令提示符，输入“ipconfig”并“ping”您的分配 IP 主机地址 172.30.0.___，DHCP\
    \ 服务器 172.30.0.10 以及 IP 默认网关路由器 172.30.0.1\n- 4. 使用以下凭据登录学生虚拟机：\n  - 登录 ID：“student”（区分大小写）\n\
    \  - 密码：“iSS316Security”（区分大小写）\n- 5. 在 GNOME 桌面上，点击左上角的“应用程序”-> 系统工具 -> 终端\n\n\
    > **注意：** 在 sudo 和 su 命令能够如预期执行之前，用户账户**必须**是 wheel 组的成员，并且 wheel 组已按照**实验 3**中的指示被授予有限的\
    \ sudo 访问权限。\n\n> **注意：** 为了正确完成此实验，您的 Fedora 14 虚拟机需要 LIVE 互联网连接。**不要**将学生工作站与课堂网络和互联网连接断开。\n\
    \n#### 安装和配置 MySQL 数据库应用的基本安全加固\n\n- 6. 安装 MySQL 服务器。输入命令：`sudo yum groupinstall\
    \ \"MySQL Database\"` 并按 <enter>。当提示时，输入学生用户账户的密码（ ISS316Security ）。\n\n```\n\
    [student@TargetFedora01 ~]$ sudo yum groupinstall \"MySQL Database\"\n[sudo] password\
    \ for student: \n```\n\n图 26 – 使用 sudo 下载和安装软件\n\n- 7. MySQL 数据库需要依赖项。YUM 将请求继续下载和安装的权限。输入\
    \ ‘y’ 并按 <enter>。\n\n```\nTotal download size: 24 M\nInstalled size: 74 M\nIs\
    \ this ok [y/N]: y \n```\n\n图 27 – 允许 YUM 下载和安装\n\n- 8. 编辑数据库配置文件并移除符号链接，添加 skip-networking\
    \ 以防止对数据库的远程访问，并禁止加载本地数据文件的能力。输入命令：`su -c 'vi /etc/my.cnf'` 并按 <enter>。\n- 9.\
    \ 密码：ISS316Security\n- 10. 按 “i” 键进入插入模式。\n- 11. 在文件打开以供编辑时，移除符号链接字段中的 “#”，并在底部添加行\
    \ skip-networking 以及添加 set-variable=local-infile=0 。\n\n```\n[mysqld]\ndatadir=/var/lib/mysql\n\
    socket=/var/lib/mysql/mysql.sock\nuser=mysql\n# Disabling symbolic-links is recommended\
    \ to prevent assorted security risks\nsymbolic-links=0\nskip-networking\nset-variable=local-infile=0\n\
    \n[mysqld_safe]\nlog-error=/var/log/mysqld.log\npid-file=/var/run/mysqld/mysqld.pid\n\
    ```\n\n图 28 – 使用 “my.cnf” 配置 MySQL 数据库的基本安全加固\n\n- 12. 配置数据库服务器仅在运行级别 3 中自动启动。输入命令：\n\
    \n```\nsudo chkconfig --level 3 mysqld on 并按 <enter>。\n```\n\n- 13. [sudo] 用于\
    \ student 的密码：ISS316Security\n\n```\n[student@TargetFedora01 ~]$ sudo chkconfig\
    \ mysqld --list\n[sudo] password for student: \nmysqld            0:off   1:off\
    \   2:off   3:off   4:off   5:off   6:off\n[student@TargetFedora01 ~]$ sudo chkconfig\
    \ mysqld --level 3 on\n[student@TargetFedora01 ~]$ sudo chkconfig mysqld --list\n\
    mysqld            0:off   1:off   2:off   3:on    4:off   5:off   6:off\n[student@TargetFedora01\
    \ ~]$ \n```\n\n![](img/73be0eef2ceb12f43f3eb92c420134f5_57_0.png)\n\n**注意：** 请注意，在使用\
    \ sudo 命令输入学生密码时，同一会话中的后续命令不需要重新输入密码。\n\n- 14. 启动数据库服务器。输入命令：`sudo service mysqld\
    \ start` 并按 <enter>。\n- 15. [sudo] 用于 student 的密码：ISS316Security\n\n首次在新安装后启动\
    \ MySQL 数据库时，一系列信息消息会在屏幕上滚动。请确认终端中显示绿色的“OK”。\n\n如有任何问题，请使用 `/usr/bin/mysqlbug`\
    \ 脚本进行报告！\n\n```\n[  OK  ]\nStarting mysqld:     [  OK  ]\n[student@TargetFedora01\
    \ ~]$ \n```\n\n![](img/73be0eef2ceb12f43f3eb92c420134f5_57_1.png)\n\n默认情况下，未为数据库\
    \ root 用户设置密码。在生产环境中，这可能是一个重大的安全风险。通过以 root 身份登录来设置 MySQL root 密码。此 root 账户与 Linux\
    \ 服务器上使用的 root 账户不同。MySQL 也将其管理账户命名为用户名 `‘root’`。\n\n- 16. 进入 mysql 环境。输入命令：`mysql\
    \ -u root -p` 并按 <enter> 。\n\n17. 输入密码：再次按 `<enter>` 而不输入密码。\n\n```\n[student@TargetFedora01\
    \ ~]$ mysql -u root -p\nEnter password:\nWelcome to the MySQL monitor.  Commands\
    \ end with ; or \\g.\nYour MySQL connection id is 2\nServer version: 5.1.58 Source\
    \ distribution\n\nCopyright (c) 2000, 2010, Oracle and/or its affiliates. All\
    \ rights reserved.\nThis software comes with ABSOLUTELY NO WARRANTY. This is free\
    \ software,\nand you are welcome to modify and redistribute it under the GPL v2\
    \ license\n\nType 'help;' or '\\h' for help. Type '\\c' to clear the current input\
    \ statement.\nmysql> _\n```\n\n图 31 – 在 mysql 控制台中工作\n\n18. 设置 MySQL root 密码。输入命令：SET\
    \ PASSWORD FOR `root@localhost`=PASSWORD(' ISS4I8Security ');\n\n```\nmysql> SET\
    \ PASSWORD FOR root@localhost=PASSWORD('ISS4I8Security');\nQuery OK, 0 rows affected\
    \ (0.00 sec)\n\nmysql> quit; _\n```\n\n图 32 – 设置 MySQL root 密码\n\n19. 退出 mysql\
    \ 环境。输入命令：*quit*；并按 `<enter>`。\n\n#### 安装和配置 Apache Web 服务器应用的基本安全加固\n\n20. 输入命令：`sudo\
    \ yum groupinstall \"Web Server\" -y` 并按 `<enter>`。\n21. [sudo] 用于 student 的密码：ISS316Security\n\
    22. 配置 Web 服务器仅在运行级别 3 中启动。输入命令：`sudo chkconfig --level 3 httpd on` 并按 `<enter>`\
    \ 。\n\n"
