  mdcn: "\n# 实验 #9 – 评估表\n\n## 实施安全日志与监控的最佳实践\n\n课程名称与编号：\n\n学生姓名：\n\n讲师姓名：\n\n实验截止日期：\n\
    \n## 概述\n\n在本实验中，学生将为 Fedora Linux 服务器启用系统日志记录，用于生产服务器的安全操作和管理。讲师将演示如何启用日志记录，使系统日志文件自动发送到网络上的远程服务器。讲师还将演示在\
    \ Fedora Linux 服务器上使用第三方文件完整性工具 Tripwire，以及使用 rkhunter。最后，讲师将演示如何使用 cron 自动化搜索大型日志文件。\n\
    \n## 实验评估问题与答案\n\n- 1. 在本地 Linux 系统上存储日志文件的主要位置是什么，该位置有哪些推荐的操作规程？\n- 2. 为什么将日志远程发送到中央服务器被视为最佳实践？\n\
    - 3. 为了从你的 Linux 系统向位于 172.130.1.254 的日志服务器发送 syslog，你需要编辑哪个文件，并且使用什么语法和条目？\n\
    - 4. 为什么“Tripwire”应用程序被认为是一个文件完整性检查器？\n- 5. rkhunter 可以被视为文件完整性检查器吗？为什么是或为什么不是。\n\
    - 6. 你会如何检查一个定时的循环 cron 任务是否已计划执行？\n- 7. 当涉及 cron 任务时，你如何将仅限错误条件或更高级别的日志通过 syslog\
    \ 发送到作为 172.130.1.254 列出的远程日志记录服务器？\n- 8. 作为系统管理员，你注意到系统上的日志开始占用大量空间。你有一个远程 syslog\
    \ 服务器，空间充足，但希望最大限度地减少物理系统上的日志量。在 Linux 中手动和自动实现这一目标的方法是什么？\n- 9. syslog 运行在哪个端口，它使用什么传输协议？为什么这是重要的信息？\n\
    - 10. 指出系统上 Syslog 服务的一个安全影响？\n\n# 实验 #10\n\n## 实验 #10：定义 Linux 操作系统与应用程序的备份与恢复流程\n\
    \n### 学习目标与成果\n\n完成本实验后，学生将能够完成以下任务：\n\n- 确保 Linux 操作系统、应用程序和数据可用性，并拥有文档化的备份和恢复流程\n\
    - 在 Linux 操作系统中配置并执行备份，作为增强备份和恢复流程及最大化系统可用性的自动化且稳定的方式\n- 在 Linux 操作系统中，在备份执行过程中对备份进行加密，以保护数据备份和存储安全\n\
    - 根据定义的恢复时间目标 (RTO)，恢复加密备份以完全恢复 Linux 操作系统\n- 使用 Linux 中的 /proc 备份和恢复已删除的文件，以便在发生文件或损坏的情况下，无需恢复整个系统\n\
    \n### 必需的设置和工具\n\n本实验不需要使用模拟 IT 基础设施 - Cisco 核心骨干网络。此外，讲师 VM 工作站和学生 VM 工作站应与内部网络物理断开连接，并隔离在课堂专用的二层交换机上。这将允许使用共享的\
    \ DHCP 服务器来分配讲师和学生工作站的 IP 地址。\n\n以下是在进行此基于设备的实验所需的内容：\n\n- A) 一个教室工作站（至少 2 Gig\
    \ RAM），能够支持连接到教室二层交换机的可移动硬盘和 VM 服务器集群。\n- B) 一个讲师工作站（建议至少 4 Gig RAM），将作为讲师的演示实验室工作站。讲师将在\
    \ LCD 投影仪上显示讲师工作站，以演示使用 VMware Player 加载和配置讲师 VM 工作站。\n- C) 学生实验室工作站将使用自己的 VM\
    \ 服务器集群和 VM 学生工作站。VMware Player 将用于运行学生 VM 和目标 VM。\n\n以下总结了执行实验 #10 所需的设置、配置和设备：\n\
    \n- 1. 一个虚拟化服务器集群，包含以下组件：\n    - a. Microsoft DHCP 服务器，用于分配学生 IP 主机地址\n    - b.\
    \ 学生或讲师 VM 工作站\n    - c. Fedora Linux 目标 VM\n- 2. 标准的现场学生工作站必须加载以下软件应用程序以执行本实验：\n\
    \    - a. VMware Player 3.x\n    - b. Microsoft Office 2007 或更高版本，用于实验评估问题与答案\n\
    \n### 推荐程序\n\n#### **基于设备的实验 #10 – 学生步骤：**\n\n学生应执行以下步骤：\n\n- 1. 将学生可移动硬盘连接到你的工作站\n\
    - 2. 启动学生 VM 和 Microsoft DHCP VM 服务器以分配 IP 主机地址\n- 3. 启用 DOS 命令提示符并输入 \"ipconfig\"\
    \ 和 \"ping\" 你分配的 IP 主机地址 172.30.0.\\\\_，DHCP 服务器 172.30.0.10，以及 IP 默认网关路由器 172.30.0.1\n\
    - 4. 使用以下凭据登录学生 VM：\n    - 登录 ID：\"student\"（区分大小写）\n    - 密码：\"ISS316Security\"\
    （区分大小写）\n- 5. 从 GNOME 桌面，在左上角，点击\"应用程序\"-> 系统工具 -> 终端\n\n> 注意：在执行 sudo & su 命令之前，用户账户必须是\
    \ wheel 组的成员，并且 wheel 组必须被授予有限的 sudo 访问权限，如实验 3 中所述。\n\n#### 使用加密保护数据文件备份\n\n\
    - 6. 更改到主目录。输入命令：`cd` 并按 <enter>。\n- 7. 查看当前工作目录。输入命令：`pwd` 并按 <enter>。 /home/student。\n\
    \n![](img/73be0eef2ceb12f43f3eb92c420134f5_107_0.png)\n\n图 54 – 更改目录到学生主目录\n\n\
    - 为备份归档和压缩/etc 和/var 目录。输入命令：`su -c 'tar zcvf lab10.tar.gz /etc /var'` 并按 <enter>\n\
    \    - 密码：ISS316Security\n    - 注意：被备份的目录和文件将随着归档过程在屏幕上滚动。这可能需要几分钟。完成后，将创建一个名为\
    \ lab10.tar.gz 的压缩 tar 归档。此文件包含/etc 和/var 目录中所有内容的内容。\n\n- 输入命令：`su -c 'openssl\
    \ des3 -salt -in lab10.tar.gz -out lab10.tar.gz.des3'` 并按 <enter> 以加密文件。\n   \
    \ - 密码：ISS316Security\n    - 为文件创建密码 lab10\n        - 输入 des-ede3-cbc 加密密码：lab10\n\
    \        - 验证 - 输入 des-ede3-cbc 加密密码：lab10\n\n![](img/73be0eef2ceb12f43f3eb92c420134f5_107_1.png)\n\
    \n图 55 – 使用 openssl 创建 des3 文件\n\n- 验证加密文件的存在。输入命令：`ls lab10.tar.gz.des3` 并按 <enter>。\n\
