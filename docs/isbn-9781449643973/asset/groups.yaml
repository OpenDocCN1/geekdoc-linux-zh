    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\n\n讲师姓名：\n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n实验截止日期：\n\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n### 概述\n\n本实验是之前基于设备实验的扩展，融入了用户账户、密码策略的安全强化，以及创建带有自动账户和密码删除功能的临时用户账户。在本实验中，学生将被要求实施并配置\
    \ Fedora Linux 服务器上的安全强化措施。他们将使用步骤来配置具有安全密码策略定义的用户账户。最后，他们还将为那些登录凭证和密码将在90天内到期的临时用户账户应用严格的密码策略。\n\
    \n### 实验评估问题及答案\n\n- 1. 创建组并将用户添加到组中的意义是什么？请解释。\n- 2. 假设一个场景，其中有五（5）名数据库管理员可能需要定期访问特定系统。讨论一种概念，以便更好地管理这些管理员的访问权限。\n\
    - 3. 新的 Web 管理员账户已设置并提供了一个密码。强制在首次登录时更改密码的流程是什么？\n- 4. \"su\" 命令的目的是什么？解释其重要性。\n\
    - 5. 可以使用什么机制来配置对 'su' 命令使用的限制？\n- 6. login.defs 文件的目的是什么？解释其内容和配置选项？\n- 7. PASS_MIN_DAYS\
    \ 设置是什么？为什么设置 PASS_MIN_DAYS 是个好主意？\n- 8. PASS_MAX_DAYS 设置是什么？为什么设置 PASS_MAX_DAYS\
    \ 是个好主意？\n- 9. 对命令 /etc/login.defs 设置（PASS_MAX_DAYS, PASS_MIN_DAYS 和 PASS_WARN_AGE）的更改是否会对现有账户生效？\n\
    - 10. 如果被告知有几位承包商需要在接下来的14天内需要 Linux 系统上的账户，请描述你将配置的密码和账户设置。\n\n## 实验室 #4\n\n\
    ### 实验 #4: 应用强化 Linux 文件系统安全控制\n\n### 学习目标与成果\n\n完成本实验后，学生将能够完成以下任务：\n\n- 挂载没有执行权限的文件系统，以便可以安全地读取磁盘中的数据而不执行任何意外程序\n\
    - 挂载远程文件系统，并配置系统以便在启动时自动挂载 Linux 系统上的自动网络共享\n- 在磁盘上设置用户配额，以保护 Linux 系统的可用性和安全性，并防止用户占用系统所有磁盘驱动器空间\n\
    - 编辑和修改 /etc/fstab 文件以管理本地和远程 NFS 共享以及所需的磁盘挂载配置\n- 配置和使用 repquota 命令来验证用户的磁盘空间使用情况并管理配额\n\
    \n### 必需的设置和工具\n\n本实验不需要使用 Mock IT 基础设施 - Cisco 核心骨干网络。此外，讲师虚拟机工作站和学生虚拟机工作站应与内部网络物理断开连接，并隔离在课堂专用的二层交换机上。这将允许使用共享的\
    \ DHCP 服务器来分配讲师和学生工作站的 IP 地址。\n\n基于此设备的实验需要以下条件：\n\n- A) 一个教室工作站（至少 2 Gig 内存），能够支持连接到课堂二层交换机的可移动硬盘，该硬盘包含虚拟机服务器农场。\n\
    - B) 一个讲师工作站（建议至少 4 Gig 内存），将作为讲师演示实验室工作站。讲师将通过 LCD 投影仪显示讲师工作站，以演示如何使用 VMware\
    \ Player 加载和配置讲师虚拟机工作站。\n- C) 学生实验室工作站将使用他们自己的虚拟机服务器农场和虚拟机学生工作站。VMware Player\
    \ 将用于运行学生虚拟机和目标虚拟机。\n\n以下是执行实验 #4 所需的设置、配置和设备摘要：\n\n- 1. 一个虚拟化服务器农场，包含以下组件：\n\
    \  - a. 用于分配学生 IP 主机地址的 Microsoft DHCP 服务器\n  - b. 一个学生和/或讲师虚拟机工作站\n  - c. Fedora\
    \ Linux 目标虚拟机\n- 2. 标准的现场学生工作站必须加载以下软件应用程序以执行此实验：\n  - a. VMware Player 3.x\n\
    \  - b. Microsoft Office 2007 或更高版本，用于实验评估问题及答案\n\n### 推荐步骤\n\n#### 基于设备的实验 #4\
    \ – 学生步骤：\n\n学生应执行以下步骤：\n\n- 1. 将学生可移动硬盘连接到你的工作站\n- 2. 启动学生虚拟机和 Microsoft DHCP\
    \ 虚拟机服务器以分配 IP 主机地址\n- 3. 启用你的 DOS 命令提示符并输入 \"ipconfig\" 以及 \"ping\" 你分配的 IP 主机地址\
    \ 172.30.0.____ ，DHCP 服务器 172.30.0.10，以及 IP 默认网关路由器 172.30.0.1\n- 4. 使用以下凭证登录到学生虚拟机：\n\
    \  - 登录 ID: \"student\"（区分大小写）\n  - 密码: \"!SS316Security\"（区分大小写）\n- 5. 从 GNOME\
    \ 桌面，在左上角，点击 \"Applications\" -> Systems Tools -> Terminal\n\n**注意：** 为了正确完成此实验，你的\
    \ Fedora 14 虚拟机需要 **实时** 互联网连接。请勿将学生工作站从课堂网络和互联网连接断开。\n\n**注意：** 在 `sudo & su`\
    \ 命令能够按预期执行之前，用户账户 **必须** 是 `wheel group` 的成员，并且 wheel group 必须被赋予如在实验 3 中指示的有限\
    \ sudo 访问权限。\n\n#### 创建虚拟磁盘镜像 & 目录\n\n- 6. 为虚拟镜像创建目录\n  - a) 输入命令：`su -c ' mkdir\
    \ -p /virtualimages/disk'` 并按 <enter>\n  - b) 密码: ISS316Security\n  - c) 输入命令：`su\
