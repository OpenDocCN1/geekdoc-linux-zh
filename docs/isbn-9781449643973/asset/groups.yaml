    \            100*    30        100   6days   2     0     0\n```\n\n图 25 – 查看学生账户配额限制\n\
    \n## 交付成果\n\n在完成实验 #4：*应用加固的 Linux 文件系统安全控制* 后，要求学生提供以下交付成果：\n\n- 1. 实验 #4 - 学生需提交以下文件的屏幕截图：\n\
    \    - a. `/etc/fstab` 文件的输出\n    - b. `repquota /home` 的输出\n- 2. 实验 #4 – 评估问题与答案\n\
    \n## 评估标准和评分细则\n\n以下是学生必须执行的实验 #4 的评估标准和评分细则：\n\n- 1. 学生是否能够在不执行权限的情况下挂载文件系统，从而可以安全读取磁盘中包含的数据而不执行任何意外的程序？\
    \ – [20%]\n- 2. 学生是否能够挂载远程文件系统，并配置系统以便在 Linux 系统启动时自动挂载以进行自动网络共享？ – [20%]\n- 3.\
    \ 学生是否能够在磁盘上设置用户配额，以保护 Linux 系统的可用性和安全性，并防止用户占用系统上的所有磁盘驱动器空间？ – [20%]\n- 4. 学生是否能够编辑和修改\
    \ /etc/fstab 文件，以管理本地和远程 NFS 共享以及必要的磁盘挂载配置？ – [20%]\n- 5. 学生是否能够配置和使用 repquota\
    \ 命令来验证用户对磁盘空间的使用情况并管理配额？ – [20%]\n\n# 实验 #4 – 评估工作表\n\n# 应用加固的 Linux 文件系统安全控制\n\
    \n课程名称及编号：______________________________\n\n学生姓名：______________________________________\n\
    \n讲师姓名：____________________________________\n\n实验截止日期：________________________________________\n\
    \n# 概述\n\n本实验是之前基于设备的扩展实验，并结合了文件系统的安全加固以及对挂载文件系统的用户访问控制。在本实验中，学生将被要求挂载一个在 Fedora\
    \ Linux 服务器上没有执行权限的文件系统。他们还将演示如何挂载远程文件系统并为挂载文件系统的用户设置配额。\n\n# 实验评估问题与答案\n\n- 1.\
    \ 假设一个文件被赋予了 777 权限（所有者-rwx，组-rwx，其他-rwx），但当用户尝试执行它时返回 “permissions denied”（权限拒绝）。解释最可能的原因。\n\
