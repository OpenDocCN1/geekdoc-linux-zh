    \  - e) 输入命令：`su -c ' dd if=/dev/zero of=/virtimages/disk/quota-img.img count=300000\
    \ '` 并按 <enter>\n  - f) 密码: ISS316Security\n  - g) 输入命令：`su -c ' dd if=/dev/zero\
    \ of=/virtimages/disk/readonly-img.img count=100000 '` 并按 <enter>\n  - h) 密码:\
    \ ISS316Security\n  - i) 输入命令：`su -c ' mkfs -t ext3 -q /virtimages/disk/readonly-img.img\
    \ -F '` 并按 <enter>。\n  - j) 密码: ISS316Security\n  - k) 输入命令：`su -c ' mkfs -t ext3\
    \ -q /virtimages/disk/quota-img.img -F '` 并按 <enter>。\n  - l) 密码: ISS316Security\n\
    - 7. 在 vim 编辑器中编辑 /etc/fstab。输入命令：`su -c ' vi /etc/fstab '` 并按 <enter>\n- 8. 按“\
    \ i ”进入 INSERT 模式。\n- 9. 滚动到最后一行的后面以创建新行。\n- 10. 输入以下行：\n\n  ```\n  /virtimages/disk/readonly-img.img\
