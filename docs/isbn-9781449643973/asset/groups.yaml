    to labhost.crackers.com workstation'
  md: "\n8. Why would you add the 'skip-networking' command?\n9. What two files does\
    \ sendmail create while processing a message?\n10. What command can you use locally\
    \ to find the sendmail's version number?\n\n## Laboratory #6\n\n### Lab #6: Apply\
    \ Hardened Security for Controlling Access\n\n#### Learning Objectives and Outcomes\n\
    \nUpon completing this lab, students will be able to complete the following tasks:\n\
    \n- Review current internal host-based firewall parameters and configuration settings\
    \ to verify allowed and denied IP communications\n- Configure an internal host-based\
    \ firewall using iptables and create stringent allow/deny rules for services that\
    \ may require access to the system over the network\n- Harden the system by enabling\
    \ TCPWrappers to deny and log unauthorized attempts against services and ports\
    \ running on the system\n- Secure processes running on the system by using and\
    \ configuring SELinux to help perform more in-depth layered security\n- Verify\
    \ configurations of the settings applied by connecting to the Linux server using\
    \ SSH and connect to other services running on a Linux server\n\n#### Required\
    \ Setup and Tools\n\nThis lab does not require the use of the Mock IT Infrastructure\
    \ - Cisco core backbone network. In addition, the Instructor VM workstation and\
    \ Student VM workstations should be physically disconnected from the internal\
    \ network and be isolated on the classroom dedicated layer 2 switch. This will\
    \ allow for a shared DHCP server to be used to allocate the IP addresses for the\
    \ instructor and student workstations.\n\nThe following is required for this hands-on\
    \ lab:\n\n- A classroom workstation (with at least 2 Gig RAM) capable of supporting\
    \ the removable hard drive with the VM server farm connected to the classroom\
    \ layer 2 switch.\n- An instructor workstation (with at least 4 Gig RAM recommended)\
    \ that shall act as the Instructor’s demo lab workstation. The instructor will\
    \ display the Instructor workstation on the LCD projector to demo the loading\
    \ and configuring of the Instructor VM workstation using VMware Player.\n- Students\
    \ Lab workstations will use their own VM server farm and VM student workstation.\
    \ VMware Player will be used to run the Student VM and the Target VM.\n\nThe following\
    \ summarizes the setup, configuration, and equipment needed to perform Lab #6:\n\
    \n- 1. A Virtualized Server Farm with the following components:\n  - Microsoft\
    \ DHCP server for allocating student IP host addresses\n  - A Student and/or Instructor\
    \ VM workstation\n  - Fedora Linux Target VM\n- 2. Standard onsite student workstation\
    \ must have the following software applications loaded to perform this Lab:\n\
    \  - VMware Player 3.x\n  - Microsoft Office 2007 or higher for Lab Assessment\
    \ Questions & Answers\n\n#### Recommended Procedures\n\n**Equipment-Based Lab\
    \ #6 – Student Steps:**\n\nThe Instructor will conduct the following demonstration\
    \ using VMware Player:\n\n1. Connect the instructor-removable hard drive to your\
    \ workstation\n2. Boot up the Instructor VM and Microsoft DHCP VM server to allocate\
