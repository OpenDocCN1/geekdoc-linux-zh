    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n## 概述\n\n本实验是之前基于设备实验的延伸。它继续进行 Fedora\
    \ Linux 服务器的系统和安全增强，要求学生首先审查当前的基于主机的 IP 防火墙服务。他们将刷新当前的防火墙配置，并重新配置严格的允许/拒绝规则集。在本实验中，学生将配置安全和增强服务，包括基于主机的\
    \ IP 防火墙、用于未授权访问控制和日志记录的 TCPwrappers，以及用于实施分层安全策略的 SELinux。\n\n## 实验评估问题及答案\n\n\
    - 1. 假设域名 hackers.com 在 hosts.deny 中针对所有服务被拒绝，且 hosts.allow 文件中有规则 ALL: ALL。TCPWrappers\
    \ 是否允许 hackers.com 访问？\n- 2. 如何启用 SELinux？\n- 3. SELinux 的三种模式是什么？解释其基本功能。\n-\
    \ 4. 考虑以下防火墙规则，并描述它允许或拒绝什么。\n- 5. 你会使用什么命令来允许所有环回流量？\n- 6. 你会使用什么命令来查看 iptables\
    \ 的网络端口配置？\n- 7. 如果某项服务在一个地方被允许而在另一处被拒绝，结果会怎样？\n- 8. 规则顺序重要吗？如果你在 IP 网络层拒绝了某项内容，但允许使用你刚刚拒绝的\
    \ IP 网络层的 TCP 传输层中的某项内容，你的 TCP 流量会被允许吗？\n- 9. 如果其中一个文件不存在，会发生什么？\n- 10. TCP 包装服务的规则会被缓存吗？\n\
