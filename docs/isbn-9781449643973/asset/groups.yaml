    - 配置 RPM 数据库，安全地添加软件仓库，以便向那些不需要直接访问系统权限、只需下载更新或 RPM 包的人员分发软件\n- 验证源代码 tarball，确定在执行或安装之前，软件包的完整性和内容是否符合预期\n\
    - 使用并借助 MD5Sum 验证下载的 software tarball 的完整性\n- 使用 wget 从互联网获取并安装第三方软件到 Linux 系统上\n\
