    # Lab #6: Apply Hardened Security for Controlling Access


    # Learning Objectives and Outcomes


    Upon completing this lab, students will be able to complete the following tasks:


    +   Review current internal host-based firewall parameters and configuration settings
    to verify allowed and denied IP communications


    +   Configure an internal host-based firewall using iptables and create stringent
    allow/deny rules for services that may require access to the system over the network


    +   Harden the system by enabling TCPWrappers to deny and log unauthorized attempts
    against services and ports running on the system


    +   Secure processes running on the system by using and configuring SELinux to
    help perform more in-depth layered security


    +   Verify configurations of the settings applied by connecting to the Linux server
    using SSH and connect to other services running on a Linux server


