    \ `/etc/httpd/conf/httpd.conf` 如实验 7 中指导的那样被修改，则应显示类似于以下内容的输出：\n\n```\n[student@TargetFedora01\
    \ ~]$ sudo rpm -V httpd\nS.5....T.   c /etc/httpd/conf/httpd.conf\n```\n\n![](img/73be0eef2ceb12f43f3eb92c420134f5_87_2.png)\n\
