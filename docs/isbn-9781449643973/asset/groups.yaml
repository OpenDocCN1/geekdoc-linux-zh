    ```\n\n**图 44 – 从互联网下载源代码文件**\n\n14. 打开 Web 浏览器。从 GNOME 桌面菜单，*点击* 左上角菜单中的“应用程序”，然后选择\
    \ Internet->Firefox 以打开 Firefox 网页浏览器。\n\n![](img/73be0eef2ceb12f43f3eb92c420134f5_89_0.png)\n\
    \n15. 输入 URL。在地址栏中输入：`http://www.python.org/download/releases/2.6.5/`\n\n16. 查找并阅读校验和。滚动直到找到以下语法。网站上\
    \ `Python-2.6.5.tgz` 的特定校验和应与下载的 `Python-2.6.5.tgz` 相匹配。\n\n发布文件的 MD5 校验和和大小：\n\
    \n```text\ncd04b5b9383c6c1fccdaa991af762cf4   13209175   Python-2.6.5.tgz\n6bef0417e71a1a137ccc5750420fdb3\
