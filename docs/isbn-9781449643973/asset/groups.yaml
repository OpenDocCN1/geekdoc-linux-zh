    \n# 实验 #1\n\n## 实验 #1：在服务器上安装核心 Linux 操作系统\n\n### 学习目标和成果\n\n完成本实验后，学生将能够完成以下任务：\n\
    \n- 根据必要的软件设计 Linux 操作系统计划\n- 在核心 Linux 服务器中设计受保护的分区，以实现所需的安全加固、性能和应用支持\n- 了解如何在安装期间使用网络时间服务器，以保持整个系统的时间设置同步\n\
    - 创建一个非特权用户账户用于系统管理访问，作为以 root 用户登录的安全替代方案\n\n### 所需设置和工具\n\n本实验不需要使用 Fedora 虚拟机、Fedora\
    \ ISO 或模拟 IT 基础设施 - Cisco 核心骨干网络。此外，教师虚拟机工作站和学生虚拟机工作站应与内部网络物理断开，并隔离在教室专用的二层交换机上。这将允许使用共享的\
    \ DHCP 服务器来分配教师和学生工作站的 IP 地址。本实验是可选的基于设备或基于纸张的。基于设备实验需要以下条件：\n\n- A) 一个教室工作站（至少配备\
    \ 2 Gig RAM），能够支持连接教室二层交换机的 VM 服务器集群的可移动硬盘。\n- B) 一个教师工作站（建议至少配备 4 Gig RAM），将作为教师的演示实验工作站。教师将通过\
    \ LCD 投影仪显示教师工作站，以演示使用 VMware Player 加载和配置教师虚拟机工作站。\n- C) 学生将进行基于纸张的实验。\n\n![](img/73be0eef2ceb12f43f3eb92c420134f5_6_0.png)\n\
    \n以下总结了执行实验 #1 所需的设置、配置和设备：\n\n1. 一个虚拟化服务器集群，包含以下组件：\n   - a. 用于分配学生 IP 主机地址的\
    \ Microsoft DHCP 服务器\n   - b. 在本实验中，我们将使用提供的 Linux 操作系统软件构建一个新的 Fedora 14 Linux\
    \ 目标虚拟机\n2. 标准现场学生工作站必须具有互联网访问权限，并加载以下软件应用程序以执行本实验：\n   - a. VMware Player 3.x\n\
    \   - b. Microsoft Office 2007 或更高版本，用于实验评估问题与答案\n\n### 建议步骤\n\n#### 基于纸张的实验 #1\
    \ – 学生步骤：\n\n学生在为“保护 Linux 服务器 – 从安装开始”撰写摘要报告时，应使用安装步骤图表作为参考。\n\n### 交付物\n\n在完成实验\
    \ #1：在服务器上安装核心 Linux 操作系统后，学生需要提供以下交付物：\n\n1. 实验 #1 - 提交一份摘要报告和一份审计清单，用于保护 Linux\
    \ 服务器 – 从安装开始。假设该服务器将用作电子商务网络应用的零售商 Web 服务器。\n   - a. 解释为什么物理保护 Linux 计算机尤为重要。\n\
    \   - b. 总结与安全和可用性相关的分区原因。\n   - c. 简要解释为什么在服务器上安装 X 窗口和图形用户界面可能是可以接受的，以及如何缓解风险。\n\
    \   - d. 提供建议，说明如何与网络时间服务器保持同步。\n   - e. 建议管理员登录服务器并执行管理任务的方法。（远程或物理访问，用于登录的账户等。）\n\
    \   - f. 提供 Linux 管理员可在安装过程中使用的审计清单。\n2. 实验 #1 – 实验评估问题与答案\n\n### 评估标准和评分细则\n\n\
    以下是学生在实验 #1 中必须执行的评估标准和评分细则：\n\n1. 学生是否认识到物理保护 Linux 计算机的重要性？– **[20%]**\n2. 学生是否能够阐明核心\
    \ Linux 服务器中的受保护分区如何为安全加固、性能和应用支持奠定基础？– **[20%]**\n3. 学生是否提供了在整个系统中保持时间设置同步的建议？–\
    \ **[20%]**\n4. 学生是否建议安装无 GUI 的服务器，或提供了在服务器上安装 GUI 的有效解释以及如何缓解风险？– **[20%]**\n\
    5. 学生是否理解为什么创建非特权用户账户用于系统管理访问作为以 root 用户登录的安全替代方案很重要？– **[20%]**\n\n"
