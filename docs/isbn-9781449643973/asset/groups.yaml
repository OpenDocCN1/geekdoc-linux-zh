    \ /common/student` 并 <enter> 键。\n\n50. 创建一个约 100 MB 的随机数据文件。输入命令：`dd if=/dev/urandom\
    \ of=test.file bs=9548576 count=1` 并 <enter> 键\n\n51. 查看配额限制报告。*输入命令：`su -c 'repquota\
    \ /common'`* 并 <enter> 键。\n\n52. 密码：ISS316Security\n\n53. 查看学生用户配额。*输入命令：`quota`*\
    \ 并 <enter> 键。\n\n```\n[student@TargetFedora01 ~]$ cd /common/student\n[student@TargetFedora01\
