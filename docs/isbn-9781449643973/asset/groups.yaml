    _，DHCP 服务器 172.30.0.10，以及 IP 默认网关路由器 172.30.0.1\n4. 使用以下凭据登录到学生 VM：\n   - 登录 ID：“student”（区分大小写）\n\
    \   - 密码：“ISS316Security”（区分大小写）\n5. 从 GNOME 桌面，在左上角，点击“应用程序” -> 系统工具 -> 终端\n\n\
