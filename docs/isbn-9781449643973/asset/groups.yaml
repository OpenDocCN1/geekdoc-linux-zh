  mdcn: "\n\n## 实验 #1 – 评估工作表\n\n### 在服务器上安装 Fedora Linux 操作系统\n\n课程名称及编号： ______________________\n\
    \n学生姓名： ______________________\n\n讲师姓名： ______________________\n\n实验截止日期： ______________________\n\
    \n### 概述\n\n在本实验中，学生将复习 Fedora Linux 服务器的安装过程，该服务器将作为一家虚构金融机构的 Web 服务器运行。安装过程、应用密码、创建分区以及系统管理员访问控制将是操作系统配置要求的一部分。\n\
    \n### 实验评估问题与答案\n\n- 1. 在安装过程中，勾选了与 NTP（网络时间协议）服务器同步的选项。从安全角度来看，为什么系统保持准确的时间是重要的？\n\
    - 2. 在安装过程中，为 \"root\" 用户设置了密码。什么是 \"root\" 用户，在什么情况下使用此账户是合适的？\n- 3. 在安装过程中，安装了\
    \ X-Window 和一个桌面管理器。然而，在生产环境中建议**不要**运行 X-Window 环境。请解释这一建议的目的。\n- 4. 在安装过程中，询问创建分区的选项是什么？请列举它们的名称。\n\
    - 5. 为什么正确划分 Linux 系统分区很重要？\n- 6. 在 Linux 系统中，SWAP 分区有什么意义？交换空间有哪些不同的配置方式，你为什么会推荐其中一种而不是另一种？\n\
    - 7. 对于 Linux 用户来说，选择 ext4 文件系统用于 Linux 系统的分区有哪些好处和特性？\n- 8. passwd 文件是如何使用的，其内容由哪些字段组成？请解释。\n\
    - 9. fstab 文件是做什么用的，其内容由哪些字段组成？请解释。\n- 10. 请解释创建 `/var` 和 `/boot` 目录的独立分区的意义？这些目录中包含什么内容？\n\
    - 11. 选择 “encrypt filesystem”（加密文件系统）选项有何用处？\n- 12. 使用逻辑卷管理器（LVM）进行分区如何帮助实现安全性的\
    \ CIA 三要素（机密性、完整性、可用性）？\n- 13. 选择 “minimal”（最小化）软件安装选项可以实现哪些安全优势？\n- 14. 如何自动化一个面向安全的\
    \ Fedora 安装？\n- 15. “firstboot” 的目的是什么？\n\n## 实验 #2\n\n### 实验 #2：在 Fedora Linux\
    \ 服务器上配置基本安全控制\n\n### 学习目标和成果\n\n完成本实验后，学生将能够：\n\n- 配置启动加载器，将超时设置设为 0 并设置密码凭据，以减轻对\
    \ GRUB 加载器和服务器启动序列的篡改风险\n- 在 Fedora Linux 服务器上启用 SELinux 并将其设置为“permissive”（宽容）模式\n\
    - 创建学生用户账户，并将其添加到一个用户组中，以管理权限并在全系统范围内应用访问控制\n- 配置具有有限 sudo 访问权限（带有密码凭据）的用户组，以记录并适当监控全系统的访问\n\
    - 配置 iptables 在运行级别 3 和 5 中设置为“on”（开启），以启用内部基于主机的 IP 有状态防火墙\n- 设置对文件访问和用户系统日志文件的限制和权限\n\
    \n### 所需设置和工具\n\n本实验不需要使用模拟 IT 基础设施 - Cisco 核心骨干网络。此外，讲师 VM 工作站和学生 VM 工作站应与内部网络物理断开连接，并在教室专用的二层交换机上隔离。这将允许使用共享\
    \ DHCP 服务器来分配讲师和 students 工作站的 IP 地址。\n\n以下设备对于本基于设备的实验是必需的：\n\n- A) 一个教室工作站（至少配备\
    \ 2 Gig RAM），能够支持连接到教室二层交换机的带有 VM 服务器集群的可移动硬盘。\n- B) 一个讲师工作站（建议至少配备 4 Gig RAM），将作为讲师的演示实验工作站。讲师将通过\
    \ LCD 投影仪显示讲师工作站，以演示使用 VMware Player 加载和配置讲师 VM 工作站的过程。\n- C) 学生实验工作站将使用自己的 VM\
    \ 服务器集群和 VM 学生工作站。VMware Player 将用于运行学生 VM 和目标 VM。\n\n以下总结了执行实验 #2 所需的设置、配置和设备：\n\
    \n- 1. 一个虚拟服务器集群，包含以下组件：\n    - a. 用于分配学生 IP 主机地址的 Microsoft DHCP 服务器\n    - b.\
    \ 学生或讲师 VM 工作站\n    - c. Fedora Linux 服务器目标 VM\n- 2. 标准的现场学生工作站必须加载以下软件应用程序以执行此实验：\n\
    \    - a. VMware Player 3.x\n    - b. Microsoft Office 2007 或更高版本，用于实验评估问题与答案\n\
