    \ to the LCD projector and show the VMware Player library and how to add, remove\
    \ and copy VMs to and from the library and the local computer\n5. Login to the\
    \ Student VM using the following credentials:\n   - Login ID: “student” (case\
    \ sensitive)\n   - Password: “ISS316Security” (case sensitive)\n6. From the GNOME\
    \ Desktop, at the top left side, click on “Applications”-> Systems Tools -> Terminal\n\
    \n> **NOTE:** Before the sudo & su commands can execute as expected, the user\
    \ account MUST be a member of the wheel group with the wheel group granted limited\
    \ sudo access as directed in Lab 3.\n\n#### Configure Stringent Permit & Deny\
    \ Firewall Rule Sets\n\n7. List current firewall rules. Type the command: `sudo\
    \ iptables -L` and press <enter>. If prompted for a password, enter the password\
    \ for the student user (ISS316Security).\n\n8. Flush the firewall rules. Type\
    \ the command: `sudo iptables -F` and press <enter>. If prompted for a password,\
    \ enter the password for the student user (ISS316Security).\n\n9. Verify firewall\
    \ rules are flushed. Type the command: `sudo iptables -l.` and press <enter>.\
    \ If prompted for a password, enter the password for the student user (ISS316Security).\
    \ There should be no firewall rules listed.\n\n10. Insert a rule to allow INPUT\
    \ chains to be added to the firewall rules and allow established connections.\n\
    \    Type the command:\n    `sudo iptables -I INPUT -m state --state ESTABLISHED,RELATED\
    \ -j ACCEPT` and press <enter>. If prompted for a password, enter the password\
    \ for the student user (ISS316Security).\n\n11. Append a rule to allow http (web)\
    \ access.\n    Type the command:\n    `sudo iptables -A INPUT -p tcp --port 80\
    \ -j ACCEPT` and press <enter>. If prompted for a password, enter the password\
    \ for the student user (ISS316Security).\n\n12. Append a rule to allow https (SSL)\
    \ access.\n    Type the command:\n    `sudo iptables -A INPUT -p tcp --port 443\
    \ -j ACCEPT` and press <enter>.\n\n13. Append a rule to allow access for ssh.\n\
    \    Type the command:\n    `sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT`\
    \ and press <enter>.\n\n14. Append a rule to allow ICMP pings.\n    Type the command:\n\
    \    `sudo iptables -A INPUT -p icmp -j ACCEPT` and press <enter>.\n\n15. Append\
    \ a rule that will deny all other traffic.\n    Type the command:\n    `sudo iptables\
    \ -A INPUT -p all -j DROP` and press <enter>.\n\n16. Save the newly created rules.\
    \ Type the command: `sudo service iptables save` and press <enter>.\n\n17. Check\
    \ one more time that the newly created rules are now listed. Type the command:\
    \ `sudo iptables -L.` and press <enter>. If prompted for a password, enter the\
    \ password for the student user (ISS316Security).\n\n#### Configure TCP Wrappers\
    \ to Deny and Log All Attempts from Crackers.com\n\n18. Open `/etc/hosts.deny`\
    \ file in `vi` editor. Type the command: `su -c 'vi /etc/hosts.deny'` and press\
    \ <enter>.\n\n19. Password: ISS316Security\n\n20. Press the `“i”` key to enter\
    \ INSERT mode.\n\n21. Scroll down and add the following new line to the file.\
    \ Make sure the new line does NOT begin with a hash (`#`) as those are comments.\n\
    \n    ```\n    ALL : .crackers.com : severity emerg\n    ```\n\n22. Save the changes\
    \ and exit the file. Press the `escape` key to exit from insert mode, then Press\
    \ the `\"shift\" & \":\"` keys to enter **command** mode. At the colon prompt\
    \ in command mode, type `wq` to exit and save changes.\n\n23. Add another workstation\
    \ ip address to the host file as `labhost.crackers.com`. Obtain an IP Address\
    \ from the instructor or a lab partner.\n\n24. Open `/etc/hosts` file in `vi`\
    \ editor. Type the command: `su -c 'vi /etc/hosts'` and press <enter>.\n\n25.\
    \ Password: ISS316Security\n\n26. Press the `“i”` key to enter INSERT mode.\n\n\
    27. Add a new line in the file such as below:\n\n    ```\n    <Instructor-Or-Partner-IP-Address>\
    \ labhost.crackers.com\n    ```\n\n    > Note: Do not actually type <Instructor-Or-Partner-IP-Address>,\
    \ instead replace that with the actual IP Address provided.\n\n28. Save the changes\
    \ and exit the file. Press the `escape` key to exit from insert mode, then press\
    \ the `\"shift\" & \":\"` keys to enter **command** mode. At the colon prompt\
    \ in command mode, type `wq` to exit and save changes.\n\n29. Check openssh server\
    \ status. Type the command: `sudo service sshd status` and press <enter>.\n\n\
    30. IF NOT running, type the command: `sudo service sshd start` and press <enter>.\n\
    \n31. Try to SSH remote connect from the workstation host address that you just\
    \ enabled in the host file and verify that SSH remote access is now being denied\
    \ to labhost.crackers.com workstation\n"
  mdcn: "\n\n8. 为什么要添加 'skip-networking' 命令？\n9. sendmail 在处理邮件时会创建哪两个文件？\n10. 你可以使用什么本地命令来查找\
    \ sendmail 的版本号？\n\n## 实验 #6\n\n### 实验 #6：应用强化安全措施以控制访问\n\n#### 学习目标与成果\n\n完成本实验后，学生将能够执行以下任务：\n\
    \n- 审查当前的内部基于主机的防火墙参数和配置设置，以验证允许和拒绝的 IP 通信\n- 使用 iptables 配置内部基于主机的防火墙，并为可能需要通过网络访问系统的那些服务创建严格的允许/拒绝规则\n\
    - 通过启用 TCPWrappers 来拒绝并记录针对系统上运行的服务和端口的未授权尝试，从而强化系统\n- 通过使用和配置 SELinux 来安全系统上运行的进程，以协助执行更深入的纵深防御安全\n\
    - 通过连接 Linux 服务器（使用 SSH）以及连接到 Linux 服务器上运行的其他服务来验证已应用的设置配置\n\n#### 所需准备和工具\n\n\
    本实验不需要使用模拟 IT 基础设施 - Cisco 核心骨干网络。此外，教师虚拟机工作站和学生虚拟机工作站应与内部网络物理断开，并隔离在课堂专用的二层交换机上。这将允许使用共享\
    \ DHCP 服务器为教师和学生工作站分配 IP 地址。\n\n本动手实验需要以下条件：\n\n- 一个课堂工作站（至少配备 2 Gig RAM），能够支持连接到课堂二层交换机的、装有虚拟机服务器群组的可移除硬盘。\n\
    - 一个教师工作站（建议至少配备 4 Gig RAM），将作为教师的演示实验室工作站。教师将通过 LCD 投影仪展示教师工作站，演示如何使用 VMware\
    \ Player 加载和配置教师虚拟机工作站。\n- 学生实验室工作站将使用他们自己的虚拟机服务器群组和虚拟机学生工作站。将使用 VMware Player\
    \ 来运行学生虚拟机和目标虚拟机。\n\n以下总结了执行实验 #6 所需的设置、配置和设备：\n\n- 1. 一个包含以下组件的虚拟化服务器群组：\n  -\
    \ 用于分配学生 IP 主机地址的 Microsoft DHCP 服务器\n  - 学生和/或教师虚拟机工作站\n  - Fedora Linux 目标虚拟机\n\
    - 2. 标准的现场学生工作站必须加载以下软件应用程序才能进行本实验：\n  - VMware Player 3.x\n  - Microsoft Office\
    \ 2007 或更高版本（用于实验评估问题和答案）\n\n#### 推荐操作\n\n**基于设备的实验 #6 – 学生步骤：**\n\n教师将使用 VMware\
    \ Player 进行以下演示：\n\n1. 将教师可移除硬盘连接到你的工作站\n2. 启动教师虚拟机和 Microsoft DHCP 虚拟机服务器，以分配一个\
    \ IP 主机地址\n3. 启用你的 DOS 命令提示符，输入 “ipconfig” 并 “ping” 你分配的 IP 主机地址 172.30.0.__、DHCP\
    \ 服务器 172.30.0.10 以及 IP 默认网关路由器 172.30.0.1\n4. 将你的教师工作站连接到 LCD 投影仪，并展示 VMware\
    \ Player 库以及如何向库和本地计算机添加、移除和复制虚拟机\n5. 使用以下凭据登录学生虚拟机：\n   - 登录 ID：“student”（区分大小写）\n\
    \   - 密码：“ISS316Security”（区分大小写）\n6. 在 GNOME 桌面上，在左侧顶部，点击 “应用程序” -> 系统工具 -> 终端\n\
    \n> **注意：** 在 sudo & su 命令能够按预期执行之前，用户账户**必须**是 wheel 组的成员，并且 wheel 组已被授予有限的 sudo\
    \ 访问权限，如实验 3 中所述。\n\n#### 配置严格的允许与拒绝防火墙规则集\n\n7. 列出当前防火墙规则。输入命令：`sudo iptables\
    \ -L` 并按 <enter>。如果被提示输入密码，请输入学生用户的密码 (ISS316Security)。\n\n8. 清除防火墙规则。输入命令：`sudo\
    \ iptables -F` 并按 <enter>。如果被提示输入密码，请输入学生用户的密码 (ISS316Security)。\n\n9. 验证防火墙规则已清除。输入命令：`sudo\
    \ iptables -l.` 并按 <enter>。如果被提示输入密码，请输入学生用户的密码 (ISS316Security)。此时不应该列出任何防火墙规则。\n\
    \n10. 插入一条规则，允许 INPUT 链被添加到防火墙规则中，并允许已建立的连接。\n    输入命令：\n    `sudo iptables -I\
    \ INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT` 并按 <enter>。如果被提示输入密码，请输入学生用户的密码\
    \ (ISS316Security)。\n\n11. 追加一条规则以允许 http（web）访问。\n    输入命令：\n    `sudo iptables\
    \ -A INPUT -p tcp --port 80 -j ACCEPT` 并按 <enter>。如果被提示输入密码，请输入学生用户的密码 (ISS316Security)。\n\
    \n12. 追加一条规则以允许 https（SSL）访问。\n    输入命令：\n    `sudo iptables -A INPUT -p tcp --port\
    \ 443 -j ACCEPT` 并按 <enter>。\n\n13. 追加一条规则以允许 ssh 访问。\n    输入命令：\n    `sudo iptables\
    \ -A INPUT -p tcp --dport 22 -j ACCEPT` 并按 <enter>。\n\n14. 追加一条规则以允许 ICMP ping。\n\
    \    输入命令：\n    `sudo iptables -A INPUT -p icmp -j ACCEPT` 并按 <enter>。\n\n15.\
    \ 追加一条规则以拒绝所有其他流量。\n    输入命令：\n    `sudo iptables -A INPUT -p all -j DROP` 并按\
    \ <enter>。\n\n16. 保存新创建的规则。输入命令：`sudo service iptables save` 并按 <enter>。\n\n17.\
    \ 再检查一次，确认新创建的规则现在已列出。输入命令：`sudo iptables -L.` 并按 <enter>。如果被提示输入密码，请输入学生用户的密码\
    \ (ISS316Security)。\n\n#### 配置 TCP Wrappers 以拒绝并记录来自 Crackers.com 的所有尝试\n\n18.\
    \ 在 `vi` 编辑器中打开 `/etc/hosts.deny` 文件。输入命令：`su -c 'vi /etc/hosts.deny'` 并按 <enter>。\n\
    \n19. 密码：ISS316Security\n\n20. 按 `“i”` 键进入插入（INSERT）模式。\n\n21. 向下滚动，向文件中添加以下新行。确保新行**不**以井号（`#`）开头，因为那些是注释。\n\
    \n    ```\n    ALL : .crackers.com : severity emerg\n    ```\n\n22. 保存更改并退出文件。按\
    \ `escape` 键退出插入模式，然后按 `\"shift\" & \":\"` 键进入 **命令** 模式。在命令模式的冒号提示符处，输入 `wq`\
    \ 以退出并保存更改。\n\n23. 将另一个工作站 IP 地址作为 `labhost.crackers.com` 添加到主机文件中。从教师或实验室伙伴处获取一个\
    \ IP 地址。\n\n24. 在 `vi` 编辑器中打开 `/etc/hosts` 文件。输入命令：`su -c 'vi /etc/hosts'` 并按\
    \ <enter>。\n\n25. 密码：ISS316Security\n\n26. 按 `“i”` 键进入插入（INSERT）模式。\n\n27. 在文件中添加一行新内容，如下所示：\n\
    \n    ```\n    <Instructor-Or-Partner-IP-Address> labhost.crackers.com\n    ```\n\
    \n    > 注意：不要实际输入 <Instructor-Or-Partner-IP-Address>，而是将其替换为提供的实际 IP 地址。\n\n28.\
    \ 保存更改并退出文件。按 `escape` 键退出插入模式，然后按 `\"shift\" & \":\"` 键进入 **命令** 模式。在命令模式的冒号提示符处，输入\
    \ `wq` 以退出并保存更改。\n\n29. 检查 openssh 服务器状态。输入命令：`sudo service sshd status` 并按 <enter>。\n\
    \n30. 如果**未**运行，输入命令：`sudo service sshd start` 并按 <enter>。\n\n31. 尝试从刚刚在主机文件中启用的工作站主机地址进行\
    \ SSH 远程连接，并验证 SSH 远程访问现在被拒绝连接到 labhost.crackers.com 工作站。\n\n"
