    \ they will also apply stringent password policies for temporary user accounts\
    \ whose login credentials and passwords will expire in 90 days.\n\n### Lab Assessment\
    \ Questions & Answers\n\n- 1. What is the significance of creating Groups and\
    \ adding Users to Groups? Explain.\n- 2. Given a scenario where there are five\
