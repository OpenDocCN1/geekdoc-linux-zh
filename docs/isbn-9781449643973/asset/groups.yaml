    \ would it be a good idea to set the PASS_MAX_DAYS setting?\n- 9. Will changes\
    \ to the commands /etc/login.defs settings (PASS_MAX_DAYS, PASS_MIN_DAYS and PASS_WARN_AGE)\
    \ take effect to existing accounts?\n- 10. Describe the password and account settings\
    \ you would configure if you were told that there were a few contractors that\
    \ needed accounts on the Linux system for the next 14 days.\n\n## Laboratory #4\n\
    \n### Lab #4: Apply Hardened Linux File System Security Controls\n\n### Learning\
