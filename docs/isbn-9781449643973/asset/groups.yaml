    \ 键进入插入模式。\n11. 在文件末尾添加该行：`net.ipv4.tcp_syncookies = 1`\n12. 保存更改并退出文件。按 ESC 键退出插入模式，然后按\
    \ \"shift\" 和 \":\" 键进入命令模式。在命令模式的冒号提示符处，输入 wq 以退出并保存更改。\n13. 立即更改内核设置，无需重启。输入命令：`su\
    \ -c ' echo \"1\" > /proc/sys/net/ipv4/tcp_syncookies '` 并按 <enter> 以立即启用 tcp_syncookies\
    \ 而无需重启。当提示时，输入 root 密码（ ISS316Security ）。\n14. 查看当前内核参数设置。输入命令：`cat /proc/sys/net/ipv4/tcp_syncookies`\
    \ 并按 <enter>。 \" 1 \" 表示正在运行的内核中该设置已设为\"开\"。\n15. 查看所有可用参数。输入命令：`sysctl -a | less`\
    \ 并按 <enter>。使用键盘箭头向上或向下滚动页面。\n16. 按 \" q \" 键退出并返回命令提示符。\n17. 使用 sysctl 命令更改内核参数。输入命令：`su\
    \ -c ' sysctl -w fs.file-max=100000 '` 并按 <enter>。\n18. 密码：ISS316Security\n19.\
    \ 这将更改用户一次可以打开的文件数量上限。\n\n### 发现关于当前运行内核的信息\n\n20. 查找内核支持的文件系统类型。输入命令：`cat /proc/filesystems`\
    \ 并按 <enter>。\n21. 查找内核正在加载哪些模块。输入命令：`cat /proc/modules` 并按 <enter>。\n22. 查找当前运行的内核版本。输入命令\
    \ `cat /proc/version` 并按 <enter>。\n23. 查找有关 CPU 的信息。输入命令：`cat /proc/cpuinfo` 并按\
    \ <enter>。\n24. 查找有关内存中运行进程的信息。输入命令：`cat /proc/meminfo` 并按 <enter>。\n\n## 可加载内核模块（LKM）\n\
    \n25. 列出已加载的模块。输入命令 `lsmod` 并按 <enter>\n\n| 模块 | 大小 | 被谁使用 |\n|:-------|:-----|:--------|\n\
    | fuse | 51432 | 3 |\n| ip6t_REJECT | 3470 | 2 |\n| nf_conntrack_ipv6 | 14441\
    \ | 2 |\n| ip6table_filter | 1207 | 1 |\n| ip6_tables | 9929 | 1 ip6table_filter\
    \ |\n| ipv6 | 229420 | 24 ip6t_REJECT,nf_conntrack_ipv6 |\n| uinput | 5228 | 0\
    \ |\n| microcode | 11139 | 0 |\n| vmware_balloon | 5280 | 0 |\n| ppdev | 6808\
    \ | 0 |\n| snd_ens1371 | 15976 | 2 |\n| gameport | 7804 | 1 snd_ens1371 |\n| snd_rawmidi\
    \ | 16580 | 1 snd_ens1371 |\n| snd_ac97_codec | 89730 | 1 snd_ens1371 |\n| parport_pc\
    \ | 17897 | 0 |\n| parport | 26215 | 2 ppdev,parport_pc |\n| ac97_bus | 922 |\
    \ 1 snd_ac97_codec |\n| snd_seq | 43447 | 0 |\n| snd_seq_device | 5056 | 2 snd_rawmidi,snd_seq\
    \ |\n| snd_pcm | 61769 | 2 snd_ens1371,snd_ac97_codec |\n| snd_timer | 15435 |\
    \ 2 snd_seq,snd_pcm |\n| pcnet32 | 26409 | 0 |\n\n图 40 – 使用 lsmod 命令列出已加载的内核模块\n\
    \n## 移除和加载模块\n\n**注意：** 要移除模块，使用命令 `modprobe -r <module_name>`。从上一步的结果中，查找“Used\
    \ By”列中为“0”的模块。零（0）表示已加载的模块当前未使用，可以移除。\n\n26. 移除一个已加载的模块。输入命令：`su -c 'modprobe\
    \ -r <module_name>'`\n27. 密码：ISS316Security\n\n**注意：** 不要在命令中输入 `module_name`。相反，用要移除的模块名称替换它。例如，如果要移除\
    \ `snd_seq` 模块，正确的命令是：`su -c 'modprobe -r snd_seq'`。\n\n28. 加载一个模块。输入命令：`su -c\
    \ 'modprobe <unloaded_module>'` 并按 <enter> 以加载之前移除的模块。\n29. **密码：** ISS316Security\n\
