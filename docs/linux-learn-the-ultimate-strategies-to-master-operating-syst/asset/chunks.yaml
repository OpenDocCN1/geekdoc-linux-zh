    NMAP''s guess function, osscan-guess operation guesses which operating system
    type is closest to the target.#nmap -O -osscan -guess 192.232.2.1By using the
    following commands and strategies, you can research a lot of information about
    the target point and can use that information to create backdoors and exploit
    the system. The exploitation of the system using Metasploit will be explained
    in further chapters but only after a description of Nessus an automatic vulnerability
    assessment tool that finds vulnerabilities automatically otherwise which you need
    to find manually by boring procedures. Before going to talk about Nessus let us
    have a simple exercise. Please try to do this exercise for a better understanding
    of the Information Gathering.Exercise:Start Kali Linux terminal and enter into
    Nmap using the commands. Find the subnet masks for www.nmap.com and find the operating
    system and version that it uses. Complete different scans and create a detailed
    report on all the available ports.Automatic vulnerability ScanningFirst of all,
    let us learn in detail about what vulnerability means along with examples of a
    few vulnerabilities.What is vulnerability?Vulnerability is a defect in the host
    system that lets hackers create backdoors to enter into the system by creating
    an exploit for the vulnerability. For example, Ransomware has used a vulnerability
    in windows to exploit hundreds of systems worldwide. Web applications also are
    prone to vulnerabilities. XSS vulnerability, CSRF detection and others are declared
    high-risk vulnerabilities by OWSAP, which determines the severity of vulnerabilities.What
    is Automatic Vulnerability Scanning?Vulnerabilities can be easily found out with
    manual testing after the coding. However, it is so boring and time-consuming that
    many avoid it. For this purpose, certain automated scanners are made to scan the
    system and detect any if coincided from the database that they have. Software''s
    like Nessus and Burp suite make this automatic scanning effective and are prone
    to get good results if done well.NessusNessus is said to be an automatic scanning
    tool that has a wide database with well-known vulnerabilities, which the tool
    will use to scan the target and give results for the attacker. For Penetration
    Tester, Nessus is one of the essential tools. A summary of Nessus typically includes
    thousands of up-to-date vulnerabilities, a variety of scanning options, and an
    easy-to-use graphical interface and effective reporting. Nessus is loved because
    it has several characteristics.Here''s how it works:To provide a complete computer
    vulnerability scanning service and update its vulnerability database at any time;
    different from the traditional vulnerability scanning software Nessus can analyze
    and scan the vulnerability of the system at the same time, and its efficiency
    can be adjusted according to the resources of the system. If the host is configured
    with more resources (such as faster CPU speed or increased memory size), its performance
    can be improved because of the abundance of resources; it can define its own plug-in;
    NASL (Nessus Attack Scripting Language) is a Language issued by Tenable, security
    Test Options for Writing Nessus; full support for SSL (Secure Socket Layer). Nessus
    is preinstalled in the Kali Linux and can be open from the menu or by using a
    search box. It has a GUI and can be easily understood. On Linux, the Nessus tool
    is installed by default in the / opt / Nessus directory. 1.4 Nessus is enabled
    and accessed using the browser. For example, if your Ip is 192.232.2.1, the browser
    enters the https protocol under https://192.232.2.1:8834.  First, we need to register
    a login and password to use Nessus. You can do that by going to the Nessus official
    website.Creating a Basic Scan in NessusStep 1: Usually when we want to Scan a
    host or website, click My Scans in the Nessus menu and then click on New Scan,
    which creates a New Scan. We can select Web Application Tests if we are scanning
    a website; if we are scanning a host, we need to select Advanced Scan.Step 2:
    Then into the following page, we enter the desired name in the Name of the SCAN.
    We write a description along with the target''s Ip address and click save. After
    that, you can go to Myscans page and click on start scanning which will initiate
    the process.Step 3: When the scan is complete, there will be a scanned structure,
    with five levels of vulnerability, the highest Critical and the lowest info. We
    can click through to see the details of each vulnerability description information,
    through the analysis of vulnerabilities and can better strengthen our system.
    It can be used for multiple purposes like Information Gathering, Communication
    and Backdoor creation. It is called Netcat and also famously known as the swiss
