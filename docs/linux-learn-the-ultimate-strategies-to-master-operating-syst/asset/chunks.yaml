    and the root](#part0014.xhtml_a1ZB)[CHAPTER 11\. Commands and Functions for the
    Beginner](#part0015.xhtml)[CHAPTER 12\. Using Linux Text Editors](#part0016.xhtml)[How
    to Use GUI Text Editors](#part0016.xhtml_a1ZE)[Using ed and vi as Text Editors](#part0016.xhtml_a1ZF)[ed](#part0016.xhtml_a1ZG)[vi](#part0016.xhtml_a1ZH)[CHAPTER
    13\. Exercises](#part0017.xhtml)[How to create a blank file](#part0017.xhtml_a1ZK)[Copying
    a file or a directory](#part0017.xhtml_a1ZM)[CHAPTER 14\. Building Scripts](#part0018.xhtml)[Writing
    Shell Scripts](#part0018.xhtml_a1ZP)[Command Aliases](#part0018.xhtml_a1ZR)[Pipes](#part0018.xhtml_a1ZS)[Mathematical
    Operations in Script Building](#part0018.xhtml_a1ZT)[CHAPTER 15\. Securing Your
    Linux Server](#part0019.xhtml)[CHAPTER 16\. GNU Utilities](#part0020.xhtml)[What
    is GNU?](#part0020.xhtml_a1ZW)[Example of GNU Utilities](#part0020.xhtml_a1ZX)[About
    installing Linux OS](#part0020.xhtml_a1ZY)[Steps to Follow to Install Linux OS](#part0020.xhtml_a1ZZ)[Linux
    System Requirements for Major Distributions](#part0020.xhtml_a200)[Installing
    Linux Mint in VirtualBox](#part0020.xhtml_a201)[CHAPTER 17\. Control Privileged
    User](#part0021.xhtml)[Types of Linux Accounts](#part0021.xhtml_a203)[Sudo](#part0021.xhtml_a204)[The
    Sudoers File](#part0021.xhtml_a205)[Conclusion](#part0023.xhtml)IntroductionThe
    mid-1990s was when Linux stopped being a tool of hobbyists and started to be used
    in the supercomputing community. When Linux first started taking off, it was met
    with support from companies like Dell, IBM, and HP so that Linux could escape
    the monopoly in the operating system market Microsoft had. This was when it found
    its first commercial use. Later, organizations like NASA started using Linux devices
    and started replacing their expensive machines with large numbers of Linux computers,
    as they were far less expensive and could do the same job. Today, you can find
    Linux system everywhere, from supercomputers to embedded systems. They have secured
    themselves a permanent place in many server installations such as the LAMP application
    stack, which is very popular.Usage in machines in the household has been increasing
    as well, in addition to enterprise desktops. Linux is very popular in the netbook
    market, as well. Many distributors ship their products with a customized Linux
    installed on them. Even Google released an OS for notebooks of their own called
    the Chrome OS. Linux has had the most success in the mobile device market. This
    is due to Android being a very popular option when it comes to not only smartphones
    but tablets and wearables as well. Valve has been showing support for Linux, which
    opened up a gaming market for the system, releasing their own Linux distribution
    made for gaming. Linux distributions have also started being popular when it comes
    to administrative work. Some local and national governments use it, one of which
    is the government of Brazil.The Current Development of LinuxCurrently, Linux is
    developed by several sources. The original Linux kernel is maintained and guided
    by Greg Kroah-Hartman. Kroah-Hartman is one of the most important people working
    on Linux. Before working for Linux he worked in SUSE labs where he gained a load
    of experience in the field. He not only maintains the many subsystems of Linux,
    but he was also responsible for the Linx-hotplug, Linux Driver Project, and the
    udev project. He made great efforts into assisting the growth of Linux, being
    the author and co-author of many books that went deep into Linux. He made many
    tutorials and detailed works on how Linux functions and where it is going next.
    Currently, he is helping the development of the kernel through detailed talks
    and tutorials. In 2006 he made a CD that helps new programmers work with Linux.Richard
    Stallman is the head of the Free Software Foundation which helps support the GNU
    components. Stallman is one of the people most responsible for the fact that Linux
    has remained a free source for all this time. He is an aggressive advocate of
    free software. He firmly believes that every program should be available to everyone
    equally. He once said that hiding codes, no matter how important, is a crime against
    humanity. Due to his efforts, the GNU components are being developed and, with
    them, Linux itself.Last, but not least, a great portion of the credit for Linux’s
    continued functioning and development falls onto the corporations and the people
    who work hard at developing third-party non-GNU components. These components make
    up a huge portion of work and account for user applications and modules, as well
    as kernel modules.The different communities and vendors combine components of
    different kinds. They combine the GNU components, non-GNU components, and the
    kernel, along with package management software to form different Linux distributions.
    Many different Linux distributions are available to be downloaded and all of them
    are free. Most of these distributions are specialized for some type of work. There
    are some distributions made for programming, while others can be made for graphic
    design or gaming. There are many options that are well crafted to suit different
    needs. This is where Linux is strongest—it can be used for anything and will excel
    at it.Who Owns Linux?Technically, nobody owns Linux. That is the virtue of open
    source licensing. The only thing that is really trademarked is the name Linux.
    The copyrights belong to Linus Torvalds. Linux itself, however, is technically
    owned by many individuals. Due to such a large number of contributors around the
    globe, it would be a hassle to contact all of them. Thanks to the GPLv2 license,
    you do not have to. This means that the program will remain a free source for
    as long as the license is perpetually renewed.CHAPTER 1\. Basic Linux commandsIn
    this section, we will explore the basic Linux commands that are necessary to get
    started. You can now open the terminal. Right-click on the Desktop and choose
    ‘Open Terminal’.If you don’t see this option, look for ‘Applications’ at the top
    of the window. Click on ‘Applications’ and go to ‘Accessories’. Choose ‘Open terminal’
    and open the text editor, that is, ‘Gedit’. Just click on the search and type
    “text editor”. Add some text of your choice to the file and save it, maybe on
    the desktop. I have saved my file with the name first with the following text:I
    am a Linux GuruI am enjoying reading this bookNow go to the terminal and type
    the following:cat firstAfter pressing the enter key, the contents of the file
    will be displayed in the window. To list the content contained in a short file,
    this method is ![00001.jpeg](image_rsrc20M.jpg) appropriate.Changing DirectoriesYou
    might also want to navigate or change directories via the terminal. To achieve
    this, use the command ‘cd’ which stands for “change directory”.Example:cd /homeThe
    above command will change the working directory to the ‘/home’ directory. The
    use of forwarding slash (/) is to mean relative to the root, meaning that this
    command will be executed regardless of the directory that you are currently in.
    Now type the following command:cd httpdThe directory will be changed to ‘httpd’
    but relative to the ‘/home’ directory. The full working directory will be ‘/home/httpd’.
    Now type the following command:cd ..This command will change the working directory
    to the parent directory of the current directory. In our case, we will move from
    ‘/home/httpd’ to the ‘/home’ directory. Type the following command:cd ~This command
    changes the directory to the user’s home directory ‘/home/(username)’. The “username”
    will be the name you have used on the computer. The symbol “~” is called the tilde
    and it is used in Linux to represent the user’s home directory.Copying FilesThe
    command ‘cp,’ which stands for “copy files” is used for copying files. Note that
    the file is not deleted from its initial location and a duplicate of the same
    is made at the specified location. Type the following command:cp first meThe command
    above will make a duplicate of the file first at the same directory but with a
    new name, that is ‘me’. If the file ‘me’ exists in the directory, it will be overwritten
    and you will not be warned before this command is executed. Consider the command
    below:cp –i first meNotice that in the above command we have added the ‘–i'' option.
    If the file ‘me’ exists in the directory, you will be notified before it is overwritten.
    Next, try the following command:cp –i /d/fileWith the above command, the file
    ‘/d/file’ will be copied into the same current directory and then named ‘file’.
    Note that we have used the ‘–i'' option so if it already exists we will be notified
    before it is overwritten.You might also need to copy all the files contained in
    a particular directory to another directory. This can be achieved as follows:cp
    -dpr sourcedirectory destinationdirectoryAll the files in the directory ‘sourcedirectory’
    will be copied to the directory ‘destinationdirectory’. Notice that we have used
    the option ‘–dpr’. This means the following:-d – means that links will be preserved-p
    – file attributes will be preserved-r – copying will be done recursivelyIt is
    good to specify those options if needed while copying all the files from a directory,
    otherwise, the default settings will be applied which might produce an unwanted
    result.To show the amount of space on a disk used on each of the mounted file
    systems, use the command ‘df’.‘Less’ CommandThe less command is the same as the
    more command. The difference comes in that with this command the user can page
    up or down through the file. Consider the example below:less firstThe above command
    will display the contents of the file ‘first’.‘Ln’ CommandThis command creates
    a symbolic link to a certain file. Write and run the following command:ln –s first
    slinkThe command above will create a symbolic link named ‘slink’ which will link
    to the file ‘first’. The command ls ‘–i first slink’ will show that the two files
    are different and have different “inodes”.‘Locate’ CommandThis is used for searching
    in the database. Run the following command:slocate –uA database named ‘slocate’
    will be created. This will take some time to complete, so be patient. Before you
    will be able to search for a file, this command must be run first. However, on
    most systems, ‘cron’ will run this command on periodical basis. Again, run the
    following command:locate whoisThis command will look for files in your system
    whose name contains the string “whois”.‘Logout’ CommandThe command is used to
    logout the user who is currently logged into the system. Just go to the terminal
    and type this command:logoutYou will then be logged out and returned to the login
    screen.‘Ls’ Command‘Ls’ stands for list. It is used for listing files in a directory.
    However, it comes with many options which need to be known as well, otherwise,
    you will become confused. If you need to list all the files in the current directory
    except those starting with “.” then just type in the command:ls![00002.jpeg](image_rsrc20N.jpg)The
    figure above is the Desktop directory and it contains the files shown. Note that
    only the file names will be listed.  You might need to show more details about
    the files in the directory such as the ownership permissions, their size, time
    and date stamp, etc. This can be achieved with the following command:ls –alAs
    shown above, the command ‘ls-al’ is more extensive compared to the previous command.
    You can use it if you want more details about the file.‘More’ CommandSend contents
    of a file one page at a time to the screen. It can also work on piped output.
    Let us list the contents of the file ‘/etc/profile’ to the screen. This is an
    in-built file, meaning that it comes with the operating system and it contains
    the profiles for the users of the system:more /etc/profile![00004.jpeg](image_rsrc20P.jpg)Note
    that the contents of the file will be displayed one page at a time. This is because
    the content is too big to be displayed on a single page. Consider the command
    below:ls –al| moreThe command will list all files in the directory and output
    will be piped through ‘more’. If the output from the directory can’t fit in one
    page, it will be listed on an additional page.‘Mv’ CommandThis command stands
    for “move” and is used for renaming or moving files. Consider the command below:mv
    –i first first2The file will be moved from ‘first’ to ‘first2’, meaning it will
    be renamed to ‘firts2’ rather than ‘first’.mv /d/firstThe above command will move
    the file ‘first’ from the directory ‘/d’ to the current working directory. Now
    you have seen how the ‘mv’ command is a powerful tool.Now that we have been talking
    of working directories, what are they exactly? And how can we know in which directory
    they currently are? Just type the command:pwdAfter pressing the enter key, you
    notice that the output is a directory. This shows the directory which you are
    currently in. The abbreviation ‘pwd’ stands for “print working directory” and
    is used for the purpose to show the current working directory.‘Shutdown’ CommandThis
    command is used for shutting down the system. The purpose of this command is to
    halt the current process and shut down the system immediately. To do this use
    the following code:shut down –h now –.The next command is used to reboot the system,
    meaning that it will immediately shut down and restart the system. To do this
    use the command below:shut down –r now-‘Whereis’ CommandThis command is used for
    showing the manual, source, and binary files for a command. Consider the command
    below:whereis lsThis command will show the manual and binary files for the command
    ‘ls’. To see the list of commands which have been on your system previously, use
    the command ‘history’:Above is the list of commands which have been run on my
    system. You can try on your system and observe the output.‘Sudo’ CommandThis stands
    for “superuser do”. It has the purpose of allowing a permitted user to execute
    commands as a “superuser”. This is usually defined in the ‘sudo’-er’s list. It
    has the importance of ensuring security by making sure that sensitive commands
    are only executed by the correct people. Another command, the ‘su’ command enables
    you to log in to the system as a superuser. The purpose of ‘sudo’ is to borrow
    privileges from the superuser. This explains the difference between these two
    commands, the ‘su’ and the ‘sudo’ commands. The ‘sudo’ command is normally used
    in commands which will change the system files, such as when updating or upgrading
    the OS. This shows how secure the command is compared to the ‘su’ command.‘Mkdir’
    CommandThis command stands for “make directory”. It creates a new directory and
    names its path. If this path is already in existence, an error saying that the
    folder cannot be created will be outputted. Consider the figure shown below:I
    have made a directory named “m”. Once I list the available directories after creating
    the directory, I find that it has been created. Notice that I have run the command
    as ‘sudo’. Without this, the command won’t run. This is for security purposes.
    Once you use the ‘sudo’ command for the first time, you will be prompted to provide
    the password for the superuser to do so. It is good to note that you can only
    create a directory inside a folder and you must have a “write permission” on that
    folder. Otherwise, you will be unable to do so.‘Uname’ CommandIt stands for “Unix
    name”. With this command, you can get detailed information about the operating
    system, kernel and the machine. Consider the figure below:Information about the
    OS, the kernel, and the machine have been shown.Ubuntu- the name of the kernel
    of the machineSMP- the machine’s node nameI686- processor configurationGNU/Linux-
    the name of the operating system.You can see how the command gives detailed information.‘Touch’
    CommandThis command is used to create a file if and only if it does not exist.
    It stands for Update the access and modification times of each file to the current
    time. In case the file already exists, its timestamp will be changed but its contents
    will remain the same. It is possible to use the command to create a file in which
    you have a “write permission” if the file does not exist. To create a file named
    ‘touchfile’:touch touchfileIf the file does not exist in the directory, it will
    then be created.‘Cal’ CommandIt can be used to display the month of the current
    date or the month of a past or advancing year.Let us show the month of February
    for the year 1900:![00009.jpeg](image_rsrc20R.jpg)You can also show the month
    of an advancing year as shown below:![00010.jpeg](image_rsrc20S.jpg)We have shown
    the month of February of the year 2100\. This command is very good when it comes
    to determining the dates of future or previous events.‘Date’ CommandUsed for displaying
    both the current date and time on the terminal as shown below:![00011.jpeg](image_rsrc20T.jpg)If
    the current date of your system is wrong, you can set it to the correct date and
    time as follows:Date –set=’21  march 2015 18:50’In the above command, we have
    set both the date and the time. CHAPTER 2\. Linux InstallationMany people already
    hate the process of installing an operating system because of the difficulties
    they encounter before they are done. The good news is that with Linux, you will
    have a very easy and stress-free time as you install it. Installing Linux is easier
    when compared to installing all the other operating systems.Most of the Linux
    distributions offer a Live Distribution option, which allows you to install and
    run the system directly from a CD, DVD or a USB Flash Drive without affecting
    your hard drive in any way. If you go this way, you will still have a fully operational
    operating system with all the features that come with it. If you run it directly,
    you will not have to commit to installing it, and this means that you can always
    avoid the hassle involved with installations.Once you have checked it out and
    agreed that it is just what you want, you will then hit the installation button,
    and the quick process will be over before you know it. The installation wizards
    will take you through the simple process with the following steps:a)    Preparation-
    This is where you make sure that your computer meets the requirements for installation.
    You will also be required to choose whether you want to install third-party software.b)  
    Wireless setup, only if it is necessary- If your machine is using a wireless network,
    you will have to connect to the network for the installation process to commence.c)   
    Hard Drive Allocation- This is where you choose how you want your operating system
    to be installed.Select your location from the map, your system’s keyboard layout
    and your username and password.This is how easy and fast it is to install the
    Linux system. Once the process is done, reboot and you will be ready to use it!Newbies
    can quickly go through the Linux installation process without anyone’s help.How
    To Install Ubuntu LinuxThis example will give you an idea of what to do when the
    time to install your chosen Linux distribution will come. Being the most popular
    Linux distribution, its installation process is not any different from others.
    The step by step installation process will make things much easy for you.'
