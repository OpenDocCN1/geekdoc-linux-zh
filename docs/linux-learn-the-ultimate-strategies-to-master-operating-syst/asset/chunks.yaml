    you are able to dictate the account as a system account, you know at a glance
    that it is not going to involve any sort of people interacting with it. There
    may be a daemon running the user, but no person will ever belonged on.While in
    the real world, this may not necessarily matter technically, it is nice to be
    able to see at a glance how many human users you have as opposed to daemons running
    specific software. Usually, these system accounts are created by the operating
    system during installation, and the OS retains their control. They usually have
    very specific user ids that you can identify within the root account. Because
    these service users will be running processes necessary for the OS, they should
    be left alone when you are altering, ending, or resetting any processes. You want
    to make sure you leave these service users alone as much as possible to protect
    yourself from damaging the software. If you were to damage one of these, it is
    quite possible that you would destroy the entire OS, which is unfortunately easy
    to do if you are not paying attention.SudoNow, it is time to discuss sudo. If
    you are using sudo before a command, you essentially push it up. You tell the
    system that you are commanding this particular process with elevated privileges
    that should be respected. Usually, the elevated privileges are what the system
    checks to ensure that you are actually granted the privilege to make any alterations
    that you are actually making. If you have been using Windows primarily, you already
    have interaction with a sort of example of this account. When you install software,
    have you noticed how certain installations will trigger a prompt to pop up and
    ask if you are certain that you wish to proceed and ask for you to give the software
    the permission it needs to proceed? That is what you are doing in Sudo. You are
    effectively giving that permission, but instead of with a click of the button,
    you are telling the system that you have elevated access to the system and should
    be respected. If you have been primarily using macOS until now, you have a similar
    sort of safeguard when you trigger downloads that may be recognized as dangerous
    or will create major alterations to the OS. On a Mac, you will see a security
    box pop up, and you must then provide the system with your password to confirm
    that you do, in fact, want to perform that change on the system.Effectively, then,
    Sudo is your privilege pass. It is the magic passphrase that tells your system
    that you are in charge—so long as the privileges on your user account match.Using
    SudoWhen you are ready to use Sudo, you do not have to try very hard. Effectively,
    all you have to do is add sudo before the command that you are trying to push
    forward. If you do this, your program should then ask you for the account password
    for the account that you are on. If you provide this password and your credentials
    check out, it will perform the function.For example, imagine that you want to
    reboot your system. As you may recall, the command to trigger your system to reboot
    is simply reboot.However, reboot requires sudo privileges. If you were to simply
    try commanding your system with just reboot, it would tell you that you must be
    a superuser in order to execute that particular command. That is where you would
    then escalate your command. At that point, you can add to your command, creating
    an input of:$ sudo rebootYour system then asks for the account password, and upon
    entering the password, it reboots as requested.Su instead of sudo?This is perhaps
    one of the safest ways that you can use to elevate your privilege to trigger the
    system to obey. There are others, such as the switch user command, known as “su.”
    However, when you use the switch user command, you are asked for the root password
    and then given the superuser prompt.You know that you are in the superuser prompt
    when you get a # as your input ready signal instead of the typical $ that you
    are likely used to seeing by now. The # should be your warning sign—if you see
    this waiting for you in the terminal, you know that you are on the root account,
    and you need to be careful.While the switch user command may have its uses in
    very specific situations, it also runs the risk of you destroying everything with
    a single typo or the act of someone accidentally bumping you while you are clacking
    away at your keyboard. When you use sudo, however, you are required to insert
    it for each and every command that requires extra privileges. This means that
    you have that extra safeguard. Of course, this could get annoying if you were
    in the process of doing something that would require you to constantly be validating
    your credentials, but it could be worthwhile if you think that the extra security
    is worth it. Of course, you could always just set up a backup of your system right
    before you begin the process of entering your su commands if you wanted to bypass
    the constant sudo usage, but that is ultimately a personal decision that you have
    to make, weighing the risk for yourself. Ultimately, the more you are in su, the
    more likely it is that you are going to have an accident. The Sudoers FileUnderneath
    sudo is the sudoers file. This determines who gets to use the sudo command in
    the first place in order to actually make use of the authority it brings with
    it within the OS. Typically, you can access this file within the location of /etc/sudoers,
    and you will have to edit this if you want to mess with command values and permissions.
    Perhaps the best way that you can make user of the sudoers file and the safewst
    way to editing it is thorugh using the visudo editor.VisudoVisudo itself acts
    as a sort of stopgap—an extra layer of security for the sudoers file. It allows
    for safe edits while also locking the sudoers file from being edited at the same
    time by multiple users, which could become dangerous if two people tried to create
    contrasting edits at the same time. If you try to access the sudoers file with
    visudo when someone else is currently in it, you will be rejected with an error
    message and told to try again later. When you do make an edit, it will stop and
    check the edits for any errors that may be catastrophic in an attempt to at least
    try to make sure that you do not completely destroy something important.Upon finishing
    your edit of the sudoer file after accessing the visudo editing system, the edit
    will be scanned for any errors. If you do happen to make a syntax error, it will
    reject the save, printing the message that declares that there is an error and
    will tell you which lines that mistake is in. From there, you are prompted to
    either attempt to re-edit to fix the mistake, or you can quit saving the changes
    anyway. However, if you quit after visudo has found an error, it is highly likely
    that sudo will also find the error, and sudo will not be accessible until the
    error has been corrected.In order to access visudo, all you have to do is enter
    the prompt:$ visudoand you should be granted the access you are looking for, so
    long as the permissions are right. There are also several other options that you
    can pair with the visudo function in order to help you really make the most out
    of the program. These commands include:visudo -c: This triggers visudo to go into
    a check-only mode. It will check the current sudoers file for any syntax issues
    and will print the status of the file. If the check was clear, visudo would end
    with a final value of 0\. However, if there is any sort of error detected, it
    will end with a value of 1. visudo -f sudoers: This specifies an alternate location
    for sudoers, checking or editing the file of your choice instead of storing it
    in the default /etc/sudoers. visudo -h: This is the help option, and when you
    do this, visuo will provide a short printed message.visudo -q: This tells visudo
    to enter quiet mode. When in this mode, no details of the syntax errors detected
    during a search will be printed or pointed out to you.visudo -s: This will enable
    the checking of the sudoers file. It will create an error if an alias that has
    not been defined is being used.visudo -v: This is the version option—it tells
    visudo to print out the version number before quitting. The sudoers fileWith the
    visudo access created, you are then able to begin editing your sudoers file. This
    is what will provide the sudo access to any accounts. When you first access your
    sudoers file and scroll to the bottom, you will likely see a line that says something
    along the lines of:root ALL=(ALL) ALLEffectively, this means that the root user
    can execute from all terminals, like all users, and run all commands. Read all
    as any for a moment, and you can see how that can be scary. The root user can
    be basically anything it wants to order anything it wants and do anything it wants. If
    you want to have any similar powers yourself on other accounts, you will need
    to set yourself up for an account that is designed as a sudo account.First, you
    must log into your server as the root user. Then, using the command adduser you
    must create a new username.$ adduser usernamehereAt this point, you will be asked
    to make a new password for the account. Do not forget your password, and make
    sure it is actually secure. From there, the command will create a home directory
    for you. Just press Enter to accept the default unless you feel like filling it
    in.Then, you must add the new user to the sudo group using the following command$
    usermod -aG sudo usernamehereThis should give you the sudo access, though you
    should still probably test it. Switch to the new user with the su command:$ su
    – usernamehereAt this point, you need to test your access. Try using the whoami
    command to get all of your details:$ sudo whoamiIf done properly, the command
    will provide the output “root.” If it is root, you know that you have access.From
    here, all you have to do is use the sudo command with space after it before any
    command you issue. The first time you attempt to use sudo when in a session, you
    will be asked to enter your password for security reasons.And just like that,
    your user account will have sudo access, allowing you to avoid any painful mistakes
    that could cripple your system or ruin your files in any given way. Since you
    will now have to enter sudo in order to do anything significant or dangerous,
    you should be pretty secure.uizCongratulations! You have finished reading Control
    Privileged User. By now, you should have a general idea of how the system hierarchy
    of users works within Linux and how you can access the right level of security
    for yourself. At this point, you will be provided with five questions, as usual.
    Try to answer these questions to determine how well you have comprehended the
    material presented thus far. As always, the answer key will be provided on the
    page after this quiz.'
