    how much you can find public information.2) Social engineering techniques are
    crazy because you can just psychologically trick an employee or the target you
    are chasing with a simple thing like phishing email to create a backdoor via your
    exploit. All great hackers rely on social engineering instead of doing things
    in a more complex way.3) Port Scanning If you are curious to know about what a
    port scan is associated with follow the next few paragraphs carefully. There are
    various services provided by the server, such as publishing a home page and sending
    and receiving e-mails. Services that perform network communication include a window
    called "port" for communication, which is managed by numbers. For example, well-known
    services are basically pre-assigned port numbers, such as 80 for HTTP services
    that publish their home pages on the Internet and 587 for sending emails. The
    act of investigating from the outside (attacker point of view) that what kind
    of port the server is opening is called "port scan".How a port scan is done?Port
    scanning is the process of sending specific data from the outside and examining
    the corresponding responses in order to investigate the running services on servers
    connected to the network. By analyzing the response obtained, you can identify
    the version of the service running on the server, the OS, etc. There were several
    tools like Nmap and Zenmap do port scanning.Nmap is a Command interface tool whereas
    Zenmap is a graphic interface tool. Both use the same techniques and are free
    of cost. Try to use your computer while reading this book, After all, it is a
    known fact that you can learn hacking or programming by doing them but not just
    by reading.NmapNmap is one of the famous hacking tools and is widely known for
    its popularity among penetration testers. People often mistake that Nmap is only
    popular for its information gathering abilities but often doesn''t understand
    that Nmap can also be used as a vulnerability detector that can be automated.
    It can be used in various operating systems that are open source and in Windows.
