    # 文件修改：查找、挂载与更改大小


    Linux 文件通常很容易定位。只需搜索一个目录，紧跟在 `/` 或正斜杠后面的名称可能就是你想要的文件。


    示例：`/home/lp.txt`

    如示例所示，`/home/` 是目录，`lp.txt` 是文件。然后你可以开始挂载。在挂载文件时，需要 Linux 内核的可用性来检查标准。它的存在允许验证所有传递给系统的参数。


    示例：

    ```bash

    # mountiso898 /dev/rom /dev/cdrom

    ```

    如示例所示，你正在挂载三类信息：`iso898`、`/dev/rom` 和 `/dev/cdrom`。


    除了查找和挂载文件外，你还可以更改文件的大小。这是由于文件碎片的产生。由于文件在碎片期间效率会降低，更改文件大小允许进行文件分配。因此，系统变得更加稳定。


    你将学习到 `truncate` 和 `fallocate` 命令。这两个命令都允许你创建一个具有指定大小的文件。


    示例：

    ```bash

    # truncate -s 19MB mop1.txt

    # fallocate -l 19000000 mop2.txt

    # ls -ls mop.txt

    0 -rw-rw--r-- 2 trs trs 19000000 Aug 12 02:44 mop1.txt

    14819 -rw-rw--r-- 2 trs trs 19000000 Aug 12 02:45 mop2.txt

    ```

    如示例所示，你在 `8 月 12 日` 创建了一个名为 `mop` 的 `19MB` 文件。


    # 第 4 章 基础 Shell 编程


    在本章中，我们将深入研究黑客秘密武器之一——脚本编写。程序员和黑客之间存在非常微小的区别。程序员使用脚本来构建系统，而黑客使用脚本来利用系统。如果不创建自己的脚本，初级黑客永远无法成为专业的黑客，而将只是只会使用其他工具破解系统的“脚本小子”（script
    kiddie）。因此，脚本知识是任何试图精通黑客技术的人清单中的必备项。为了帮助你，本章将通过真实世界的代码示例介绍许多 Bash 脚本概念。让我们现在开始这段脚本之旅吧！


    首先，我们需要详细了解 Shell。


    ## 什么是 Shell？


    Shell 是当你第一次使用密码连接到服务器时，或者使用 `SSH` 等远程桌面工具连接到系统时看到的那个光标。换句话说，如果你纯从编程的角度来看它，你会非常高兴，因为它的作用就像是用户和系统之间的解释器，就像操作系统的工作方式一样。但它只是将用户的输入建议发送给
    Linux 内核，并将结果作为输出发送给系统用户。


    ## Shell 的类型


    根据 Linux 官方文档，存在多种类型的 Shell。其中，第一种代表 GUI（图形用户界面），第二种代表 CLI（命令行界面）。许多发行版制造了许多 Shell，如
    Bourne shell、C shell、korne shell 和 Bash shell。在存在的所有不同类型的 Shell 中，`bash` shell
    是人类以来最著名的 Shell 之一。它预装在几乎所有著名的 Linux 发行版中。它还充当一种接接语言，帮助 Linux 内核逻辑上理解我们给出的指令。


    ## bash Shell 是如何工作的？


    人们可以通过两种模式操作 Shell。其中一种是交互模式（interactive mode），另一种是脚本模式（script mode）。


    ### a) 交互模式

    在这种模式下，Linux 用户可以逐条输入函数或 `bash` 代码，并等待结果给出。如果中间出现错误，用户将无法继续。它只是以交互方式工作，就像旧式手持视频游戏一样。


    ### b) 脚本模式

    在这种模式下，首先将 `bash` 代码写在文本文件中，然后使用命令行界面运行该脚本文件。使用这种模式时，用户可以一次性获得他想要的所有结果。黑客需要在脚本模式下更加完美，因为通过这种方法可以快速利用系统。然而，创建系统的程序员会更倾向于交互模式。


    在进一步了解 Shell 的语法结构之前，如果能对 Shell 的优势有一个良好的概述会更好。


    ## Shell 的优势


    1) 学习内联编程语言非常容易，它们在执行和实现上都有很大不同。

    2) 它有许多帮助文档，可以帮助黑客尽快纠正错误。

    3) 它还有一个额外优势，因为它是一种解释性语言。这意味着它在运行之前不需要编译。因此，黑客可以在尝试在受害者系统上实施之前轻松地交叉检查代码。


    此外，Shell 还速度快且运行高效。由于所有这些原因，黑客必须学习 Shell 的实现。


    开始吧！


    ## 第一个 脚本


    让我们创建一个名为 `sample.sh` 的 脚本。使用以下命令创建一个 脚本。


    ```bash

    cat sample.sh

    ```


    ### Shell 程序的位置

    ```bash

    echo " This is very regressive"

    ```

    现在我们将逐行详细解释这些。


    a) `#!` 代表我们正尝试写的 Shell 脚本的开头。

    b) 如果它以井号 `#` 开头，则被称为注释。注释是用于方便参考或其他查看代码的用户的标记。对于小型 Shell 脚本，写注释似乎是不必要的。

    c) `echo` 是 Shell 的默认命令，允许解释器显示编写的内容。在这里，运行 Shell 需要使用以下命令：


    ```bash

    bash sample.sh

    ```

    然后输出将出现。例如，输出是：`This is very regressive`


    还有另一个功能允许你带有额外的权限运行脚本。如前所述，Linux 有一组权限，如果未提供，脚本可能无法运行。因此，提供权限请使用以下命令：


    （此处由于原文存在重复文本，已按要求处理）

