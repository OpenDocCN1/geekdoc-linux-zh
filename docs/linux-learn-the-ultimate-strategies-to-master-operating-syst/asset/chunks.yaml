    is the Swiss army knife of network hacking tools, which can read and write data
    over the network through TCP and UDP. By combining and redirecting with other
    tools, you can use it in a variety of ways in your scripts. Netcat does many amazing
    things that hackers often ask for. Netcat works basically on a principle that
