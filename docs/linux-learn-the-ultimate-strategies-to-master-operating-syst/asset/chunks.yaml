    safe bet to transfer files. You can send for example an .avi file from X to Y
    system by making either one of them as a client and other as the server.Server$nc
    -l 6870 < example.aviClient$nc -n 292.232.2.1 6870 > example.aviB as Server$nc
    -l 6870 > example.txtClient $nc 292.232.2.1 6870 < example.avi4)  Stream a Video
    in the server There are many other ways to do this but if using command line this
    can be an easy way.Server$cat tutorial.avi | nc  -l 2343Looking at the following
    examples you might have understood how useful Netcat is. There are several tens
    of experiments that you can do with Netcat in such a way that can help you increase
    your hacking skills. In this chapter, we have dealt in detail about the hacking
    tools like Nmap, Nessus and Netcat along with explaining potential examples that
    can give you good clarity over things that happen in the background.CHAPTER 7\.
    Command Syntax PatternsLet''s discuss some common usage patterns shared by many
    Linux commands. Having a good feel for these basics can make learning your way
    around much faster. Invoking a command always starts with the command name. In
    some cases, as with the “ls” command, just the name on its own is enough to return
    a result. Still, you''ll generally need to add some combination of arguments and
    parameters to get the most of a tool. You''ve already learned about how adding
    “-a” to the “ls” command will display all the files in a directory, even hidden
    files. But you can get the same results using two dashes and the word “all”. Providing
    these alternatives make command arguments more accessible for all kinds of people,
    those who remember things better through more complete descriptions and those
    who perform a task often enough that they can enjoy the speed of a single-letter
    argument. Looking at the “man” file for “ls” will show you that many other short
    arguments also have two-dash longer equivalents. There are exceptions to that
    argument syntax usage. The networking administration “ip command” can use the
    “addr” argument without a dash to show the IP addresses associated with your system''s
    network interfaces. On most Linux systems this can even be shortened to a simple
    “a”, also without a dash. You can combine multiple short arguments in a single
    command. “ls-l” will list the contents of a directory in long-form, displaying
    object permissions, ownership, size, and age details. Running that again with
    the “h” command will give you the file system in a human-readable format. And
    adding “t” will organize the objects in descending chronological order. Besides
    arguments, most commands can also read properly formatted parameters. This example
    will list the full contents of the “etc” directory from wherever you happen to
    be in the filesystem. As all the best system administrators are extremely lazy,
    you can expect that there are going to be some pretty serious command line shortcuts
    hiding in plain sight. The most powerful of them is probably called autocomplete.
    Bash watches what you''re typing and can often anticipate what it is you''re after.
    For example to see the compressed tar archive file in a directory you can start
    typing the “tar” command for extracting the contents. Then you can stop at the
    letter “n”. Rather than having to enter the entire filename, you can just hit
    the Tab key, and Bash will do the rest for you. Bash understands the context of
    the command, so it gives you the archive, but not the subdirectory that''s using
    a similar name. If you were to run the change directory command, “cd” with the
    letter “n” however, hitting Tab would correctly give you the directory name. Unsurprisingly,
    autocomplete will only work when there''s only one matching possibility in the
    directory. You might sometimes need to provide a few more characters to get a
    good match. Speaking of “cd” and shortcuts, you can type simply “cd” from anywhere
    in a filesystem, and you''ll be taken right back to your users home directory.
    You can cycle through recent commands by hitting the up arrow key. With an old
    command displayed, you only need to hit Enter and run it again. Of course, you
    may have moved to a different location in the meantime, so the command context
    might''ve changed. The 1, 000 most recent commands are stored in a hidden file
    in your users home directory called “bash_history” and can be seen by running
    the “history” command. There are some characters known as regular expressions
    that the shell won''t necessarily interpret the way you might expect. One example
    is a simple space. Other examples include the dot, square brackets, the asterisk,
    and the question mark. Bash will often interpret those as command instructions
    rather than simple characters. Suppose you decide to create a file with the name
    “this is my story”. Running the command “touch” and an unused file name is one
    quick way to create an empty file. But if you run “touch” like this, things won''t
    work out the way you probably expect. Listing the files in the directory will
    show you that there are now four files, each with a single-word name. “Touch”
    figured you wanted to create four separate files and got right to work doing it.
    If you want to get rid of that, you can enclose the whole filename, spaces included,
    within quotation marks. This tells Linux that it''s all one string. Another way
    to force Bash to preserve the literal value of your input is to use the backslash
    as an escape character. The way that would work for your problem would be to type
    the backslash before each space in the string. When you list the contents of the
    directory, you would now have a single file with the name, another four-word name.
    The truth is that you might better off, in the long run, getting into the habit
    of creating single-word filenames by using dashes or underscores. They can simplify
    your file management. Summary:You have learned about Linux''s primary inline documentation
    system, “man”, and how to use it to quickly find operational information for just
    about any Linux command. You have also learned that the info system, the contents
    of the “usr/share/doc” directories, and even running a command followed by “—help”
    can also provide valuable information and resources. You have also learned how
    the behavior of both login and non-login command line “shell sessions” is controlled
    by files like “bashrc” and “profile”. You have also discovered how arguments and
    parameters are passed to Bash commands, in the case of arguments both their short
    and long formats and learned to take advantage of some helpful shortcuts, including
    accessing command history through the up and down arrow keys and contextual autocomplete
    suggestions using Tab. Lastly, you now understand how some characters, like spaces,
    are treated differently by a dash, sometimes requiring escape characters to get
    the right results. CHAPTER 8\. Linux Files and DirectoriesIf you''re going to
    get stuff done on Linux, especially using the command line, you''ll need a solid
    sense of where files are kept and how to work with them. The good news is that
    figuring all that out isn''t as hard as it might seem. In this chapter, we''re
    going to learn some basic file and directory administration skills, explore some
    powerful tools you can use to search for both files and text strings contained
    within those files, and then manipulate the data you find. Moreover, you will
    learn how to create and use compressed data archives, and then identify hardware
    peripherals on your system and if required, enable the kernel modules you''ll
    need to use your devices. When identifying directory trees, you can use the forward
    slash. Thus, the absolute address of a directory called scripts in your home directory
    would be “/home/ubuntu/scripts” where Ubuntu is the name of your account. If you
    would preface the tree with “cd”, which stands for change directory, you would
    move to that directory. Once you ready, just try it out; Type the command: “pwd”,
    which stands for present work directory, and you will see your new directory location
    displayed. To make it easier to understand the basic Linux file and directory
    management commands, create a new directory and populate it with some useless
    stuff. The command “mkdir” will make a directory called “data.” list the contents
    of the parent directory to show the new subdirectory and then change location
    to that directory. To create a few files, you can launch the text editor “nano”
    followed by the name of either an existing or a new file. In this case, it''ll
    be “new”. You can enter some text and then type Ctrl and “X” and then “Y” to save
    and exit. “File1” now should exist. A quick way to create empty files with unused
    names is through “touch”. Using “touch” on an existing file will simply update
    the date timestamp of the file, which can be useful for some administrative purposes.
    You can hit the up arrow and raise the number a few times to make it easier to
    create a few more files. Once you have a series of empty numbered files, let''s
    create a new directory within data and call it “newdata”. If you would want to
    copy files to “newdata”, you can use “cp”. This will create a copy of the “file1”
    file. But it would be boring to have to repeat that command for each of the files
    in your series, so you can use what''s called “globbing”. The command “globbing”
    just a way of spreading an action across on a global target. So typing “cp file*
    new data” will copy all files that begin with file no matter what characters follow
    that string. Type “cd” to “newdata” to see what''s there. The asterisk will cause
    a Linux command to act on any string starting with file no matter how many characters
    follow. However, you can also limit the action to a single character using the
    question mark. You can create a couple more files with longer names, and use “rm”
    with a question mark to delete or remove all files starting with “file”, but having
    only a single digit extra. You should see that some of your files are still there.
    If you were to use “rm file” with an asterisk, all files would be removed as well.
    Additionally, to move a file rather than just make a new copy, use the command
    “mv”. If you want to clean up your files, you can use the command “rm” and an
    asterisk to remove all the files in our “newdata” directory. Be careful with this
    because you can sometimes end up deleting a lot more than you expected, and you
    should definitely keep in mind the Linux terminal has no “trashcan” from which
    deleted files can be restored. You can “cd back up to data” and run “rm dir” to
    remove the “newdata” directory.CHAPTER 9\. Linux File System SearchingA busy Linux
    system can contain a lot of files. In fact, some workstations can easily have
    over 2-3 million files. Tracking down individual system and configuration files
    is going to be important from time to time. But visually scanning for them one
    directory at a time can be incredibly boring. The quickest and easiest way to
    find files by using the command “locate”. Suppose you couldn''t remember where
    they''d hidden the configuration file controlling the way the “adduser” command
    works? You could simply run locate using “adduser” as a parameter. The most likely
    candidate from the list is the one in the “etc” directory, which happens to be
    where most configuration files are kept. You can then open the file in a text
    editor by pointing to its address. “Locate” works very quickly because it simply
    reads a precompiled index of all the files and directories on the system. If you''re
    looking for files that may have been added recently, you might need to update
    the index. You can do that by running the command “update db”. That''ll get you
    going when you need to find a file. But since pretty much all the action in Linux
    is controlled through file contents, you''ll need a way to search inside those
    files. As an example, many programs will regularly generate thousands or even
    millions of text messages that are written to log files so that later you can
    revisit critical events. To manage the problem of working with all this data,
    Bash comes with a full set of text manipulation tools for reading, transforming,
    and redirecting text. You are already aware of how the command “less” reads a
    file and displays it one screen at a time. Rather than printing the text directly
    to the screen, however, it can also search and, if desired, manipulate the contents
    of a file by sending it through what''s called a pipe. Multiple text manipulation
    tools can then be invoked to filter the streaming text. You can use the command
    “cat” to read the group file that contains information about system groups and
    that lives in the “etc” directory. But rather than just dump its contents to the
    screen, you can pipe it to the command “grep” filtering program using the vertical
    line produced by Shift and backslash. You will tell “grep” to read through the
    text and print only those lines that contain a certain word you specify. If you
    need it to, rather than printing the output to the screen, you could use it to
    populate a file. You can do this by adding a redirect with a couple of right arrows
    and the name of the file. The only thing is that if you would''ve used only one
    right arrow for the redirect rather than two, the text selected by “grep” would
    have overwritten any existing content to the file. Two arrows will append the
    text to the end of the file. That''s an important distinction that you should
    keep in mind. Since the group is a rather line file, this is a good way to illustrate
    how you can use some more tools. The command “head”, by default, will print only
    the first 10 lines of a file, and “tail” will print the last 10 lines. Of course,
    the real value of a file like a group is any data that it contains. Each line
    follows a similar pattern, first a group name, then a colon and an x, another
    colon and the group ID number. It might be useful to be able to pull out one field
    of data from each line and process them all together. For that, you can use “cut.-d”
    tells Linux to use every colon as a field delimiter, meaning to consider every
    appearance of a colon as the end of one field and the beginning of another “.-f3”
    is our way of saying that we''re only interested in processing the contents of
    the third field of each line. This would successfully print only the ID number
    of each group. In case you''d like to see these numbers printed in ascending order,
    you have to pipe your output to sort “-n”. If you''re a descending order kind
    of person, just add an “r” or reverse to the sort arguments. While this example
    was pointless, I still feel that there''s a certain beauty to squeezing so much
    function into a single short line of code. On the other hand, I''m confident that
    you can see how each of these tools can be really useful when you''ve got a pressing
    need to quickly analyze a large text file like a system log, and you just don''t
    have the time to read through it line by line. If you''d like to see how many
    lines, words, and characters a file contains, run the command “wc”, which stands
    for word count. Since I mentioned redirects using arrows, you might just type
    it out. The word redirect implies that you are handling the text differently than
    it would otherwise have been managed. How would that normally have gone? Well,
    that depends on the kind of text it was. You''ve got three to choose from, standard
    input often referred to as “stdin”, standard output, or “stdout”, and “stderr”
    for standard error. Standard in is normally coming from the keyboard through which
    it''s made available to Bash. A standard in redirect would accept input from an
    alternate source. This example will open the “MySQL” database engine as the root
    user and import the “mydatabase.sql” database file use the left arrow character
    to tell Bash where to find the file. The command “standard out” will, by default,
    be sent to the terminal display. Redirecting standard out to a file would work
    like this. Remember, one right arrow will erase any existing text in the file
    and replace it with the input, and two arrows will append the new text. Lastly,
    the standard error will write any errors generated by a command. By default, those
    errors will also go to the terminal display. If you run the command “wget” against
    an incorrect web address for google.com with two “ms” to explain how that would
    normally work. You would see that “wget” would fail to resolve the address. Hardly
    a surprise considering that there is no such address. However, if I''d like the
    error message written to a file, I''d use “wget”, the incorrect address, the number
    2, a single right arrow, and the next of the file I''d like to correct. The number
    2 is a designation for standard error. Zero is standard in, and 1 is standard
    out.CHAPTER 10\. User and Group Management In this chapter, we will learn about
    users and groups in Linux and how to manage them and administer password policies
    for these users. By the end of this chapter, you will be well versed in the role
    of users and groups on a Linux system and how they are interpreted by the operating
    system. You will learn to create, modify, lock and delete user and group accounts,
    which have been created locally. You will also learn how to manually lock accounts
    by enforcing a password-aging policy in the shadow password file.  Users and GroupsIn
    this section, we will understand what users and groups are and what is their association
    with the operating system.  Who is a user? Every process or a running program
    on the operating system runs as a user. The ownership of every file lies with
    a user in the system. A user restricts access to a file or a directory. Hence,
    if a process is running as a user, that user will determine the files and directories
    the process will have access to.  You can know about the currently logged-in user
    using the id command. If you pass another user as an argument to the id command,
    you can retrieve basic information of that other user as well.  If you want to
    know the user associated with a file or a directory, you can use the ls -l command
    and the third column in the output shows the username.  You can also view information
    related to a process by using the ps command. The default output to this command
    will show processes running only in the current shell. If you use the ps an option
    in the command, you will get to see all the processes across the terminal. If
    you wish to know the user associated with a command, you can pass the u option
    with the ps command and the first column of the output will show the user. The
    usernames are mapped to numbers using a database in the system. There is a flat
    file stored at /etc/passwd, which stored the information of all users. There are
    seven fields for every user in this file.  username: password:UID:GID:GECOS:/home/dir:shellusername:Username
    is simply the pointing of a user ID UID to a name so that humans can retain it
    better. password:This field is where passwords of users used to be saved in the
    past, but now they are stored in a different file located at /etc/shadow UID:It
    is a user ID, which is numeric and used to identify a user by the system at the
    most fundamental level GID:This is the primary group number of a user. We will
    discuss groups in a while GECOS:This is a field using arbitrary text, which usually
    is the full name of the user /home/dir:This is the location of the home directory
    of the user where the user has their personal data and other configuration files shell:This
    is the program that runs after the user logs in. For a regular user, this will
    mostly be the program that gives the user the command line prompt What is a group? Just
    like users, there are names and group ID GID numbers associated with a group.
    Local group information can be found at /etc/group There are two types of groups.
    Primary and supplementary. Let’s understand the features of each one by one.  Primary
    Group:  '
