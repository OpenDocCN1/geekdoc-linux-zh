    # 主组


    * 每个用户都恰好有一个主组。

    * 本地用户的主组由 `/etc/passwd` 文件中的第四字段定义，该字段列出了组 ID `GID`。

    * 用户创建的新文件归其主组所有。

    * 用户的默认主组名称通常与用户名相同。这被称为用户私有组（UPG），该用户是该组的唯一成员。


    ## 补充组


    * 用户可以是零个或多个补充组的成员。

    * 本地用户的主组由 `/etc/group` 文件的最后一个字段定义。对于本地组，用户的成员身份通过由逗号分隔的用户列表来标识，该列表位于 `/etc/group`
    中组条目的最后一个字段。

    * `groupname: password: GID:list, of, users, in, this, group`

    * 引入补充组的概念是为了让用户能够加入更多组，从而访问系统中属于其他组的资源和服务。


    # 获取超级用户权限


    在本节中，我们将学习什么是 root 用户，以及你如何成为 root 用户或超级用户，并获得系统的完全访问权限。


    ## root 用户


    每个操作系统中有一个用户被称为超级用户，他拥有该系统所有的访问权限和权利。在基于 Windows 的操作系统中，你可能听过被称为管理员的超级用户。在基于 Linux
    的操作系统中，这个超级用户被称为 `root` 用户。`root` 用户拥有覆盖文件系统中任何普通权限的权力，通常用于管理系统系统。如果你想执行诸如安装新软件或删除现有软件，以及管理系统中的文件和目录等任务，用户必须将权限提升到
    `root` 用户。


    操作系统上的大多数设备只能由 `root` 用户控制，但也有少数例外。普通用户可以控制 USB 驱动器等可移动设备。因此，非 root 用户可以管理和删除可移动设备上的文件，但如果你想对固定硬盘硬盘进行修改，则只有
    `root` 用户才能做到。


    但正如我们所听，能力越大，责任越大。鉴于 `root` 用户拥有的无限权力，这些权力也可以被用于破坏系统。`root` 用户可以删除文件和目录、删除或修改用户账户、在系统中创建后门等。如果
    `root` 账户被攻破，他人就可以获得系统的完全控制。因此，建议始终以普通用户身份登录，仅在绝对需要时将权限提升到 `root` 用户。在 Linux 中的一种做法是以普通用户登录，然后使用工具获取
    `root` 账户的某些权限。


    ## 使用 su 切换用户


    你可以使用 `su` 命令在 Linux 中切换到不同的用户账户。如果你没有向 `su` 命令传递用户名作为参数，则意味着你想切换到 `root` 用户账户。如果你以普通用户身份调用该命令，系统会提示你输入想要切换到的账户的密码。然而，如果你以
    `root` 用户身份调用该命令，则不需要输入你正在切换到的账户的密码。


    ```

    su - <username>

    [student@desktop ~]$ su -

    Passord: rootpassword

    [root@desktop ~]#

    ```


    如果你使用命令 `su username`，它将在非登录 shell 中启动会话。但如果你使用命令 `su - username`，则会为该用户启动一个登录
    shell。这意味着使用 `su - username` 为新用户设置一个全新的、干净的登录，而仅使用 `su username` 则会保留当前 shell
    的所有设置。通常，为了获取新用户的默认设置，管理员通常使用 `su -` 命令。


    ## sudo 与 root


    Linux 操作系统为用户实施了一套非常严格的模型。`root` 用户拥有做任何事的权力，而其他用户无法执行任何与系统相关的操作。过去遵循常用解决方案是允许普通用户通过
    `su` 命令临时变为 `root` 用户，直到完成所需任务为止。然而，这有一个缺点，即普通用户在字面上变成了 `root` 用户，并获得了 `root`
    用户的所有权力。他们随后可以对系统进行关键更改，如重启系统，甚至删除像 `/etc` 这样的目录。此外，获得成为 `root` 用户的访问权限还会涉及另一个问题：每个切换到
    `root` 用户的用户都需要知道 `root` 用户的密码，这并不是一个好主意。


    这就是 `sudo` 命令派上用场的地方。`sudo` 命令允许普通用户以 `root` 用户或其他用户的用户的身份运行命令，具体取决于 `/etc/sudoers`
    文件中定义的设置。虽然像 `su` 类的其他工具需要你知道 `root` 用户的密码，但 `sudo` 命令只需要你知道自己的密码来通过身份验证，而不需要你正尝试访问的账户的密码。通过这种方式，系统管理员可以向普通用户授予特定的权限列表，以便他们执行系统管理任务，而无需实际知道
    `root` 密码。


    让我们来看一个例子，学生用户通过 `sudo` 被授予了运行 `usermod` 命令的权限。有了此权限，学生用户现在可以修改任何其他用户账户并锁定该账户。


    ```

    [student@desktop ~]$ sudo usermod -L username

    [sudo] password for student: studentpassword

    ```


    # 初学者常用的 29 条命令


    1. `apt-get`: 安装软件包

    2. `bzip2`: 压缩文件

    3. `cd`: 目录

    4. `chmod`: 修改文件权限

    5. `cp`: 复制更多文件或目录

    6. `date`: 显示或设置日期

    7. `df`: 显示剩余和已用空间

    8. `emacs`: 编辑器

    9. `exit`: 退出 shell

    10. `find`: 符合模式的文件

    11. `hostname`: 显示或更改主机名

    12. `install`: 复制文件，设置/更改属性

    13. `locate`: 搜索查找文件

    14. `ls`: 列出目录内容

    15. `man`: 显示命令的帮助信息

    16. `mkdir`: 创建新文件夹/目录

    17. `mv`: 移动或重命名目录和文件

    18. `nano`: 带有快捷菜单的编辑器

    19. `open`: 用原始应用程序打开文件

    20. `ps`: 显示当前进程状态

    21. `pwd`: 显示/打印工作目录

    22. `quota`: 显示磁盘使用情况、限制

    23. `reboot`: 重启系统

    24. `rm`: 删除目录或文件

    25. `rmdir`: 删除、移除、清空目录或文件夹

    26. `shutdown`: 关机或重启

    27. `sftp`: 安全文件传输程序

    28. `sudo`: 以特定用户身份执行命令（具有所有权限）

    29. `tar`: 从 tar 包或 tar 归档/文件中存储、列出或提取文件


