    # 使用目录


    `pwd` 命令将打印你的当前工作目录。这也是查看你从何处开始的好地方。要查看目录中的内容（从你的主目录开始以及随后的其他目录），你可以输入 `ls` 来列出目录中的内容。


    注意，在配置服务器账户时，你的主目录下还会随带一些隐藏文件。要列出这些文件，你必须使用点字符 `.`。例如，你不能只输入 `ls`，而应该输入 `ls -b`
    来查看隐藏文件。


    你还将学习像之前的命令一样组合命令。例如，要移动到名为 `xyz` 的子文件夹，你需要在 xyz 前面加上前缀，如 `cd xyz`。使用 `cd` 命令导航到桌面目录的示例是，输入
    `cd ~/Desktop`。要返回根目录，输入 `cd ~`。使用相同命令导航到根目录的示例是输入 `cd /`。要回到上级目录（当前目录的父级），你应该输入
    `cd ..`。在继续之前，你可能想探索一些目录并尝试移动以熟悉环境。


    # 如何安装程序


    `apt-get` 命令获取并安装单个视觉化软件软件包。这就是你创建服务器的方式。你将使用特定的命令手动拉取泛泛化你的 Linux 服务器所需的任何内容。仓库存储了许多
    Linux 程序，你可以随时调用它们。这些程序也是开源的。如果你现在不知道自己需要什么，应该在 Google 上搜索最适合你需求的软件。


    随后若要访问仓库，例如，你会输入 `sudo apt-get install (程序名称)` 来获取一个副本并自动安装。


    `tasksel` 命令意味着 Ubuntu 的任务选择（task-select）。如果你运行它，将出现一个屏幕，为你列出常见的服务器类型、软件包和任务列表。你可以选择并安装你的服务器所需的任何内容。例如，你可以通过
    `sudo apt-get install tasksel` 获取 tasksel 功能，然后通过使用 `sudo apt-get install (然后是你想要的任务名称、你想要的服务器等)`
    来使用它。


    如果你想安装 LAMP 服务器，可以输入命令 `sudo apt-get install lamp-server` 来实现此操作。


    ![00019.jpeg](img/image_rsrc20X.jpg)

    `apt-get install` 的示例（[www.en.flossmanuals.net](http://www.en.flossmanuals.net)）。


    如果你任何时候需要帮助，既然你已经知道了帮助页（man）命令，你应该输入：`man tasksel`。你会看到帮助页出现以解决你的需求。


    # 如何卸载


    若要卸载，你只需输入 `apt-get remove (在此情况下为服务器名称)`。使用此命令获取你的大部分软件，并从选择免费开源软件开始。


    # 更新


    安装软件后，你可以使用 `upgrade` 命令 `sudo apt-get upgrade`。通过仓库进行简单的更新。手动更新它们比设置自动更新要容易。由于
    Linux 的高效率，你不需要经常进行更新。这样也更安全。


    # 任务管理器


    `top` 提示命令类似于任务管理器，用于查看进程以及每个进程占用的空间，或者停止程序运行。使用命令 `h` 获取你任何时候可能需要的命令列表。输入命令 `sudo
    top`（访问任务管理器或 top），然后输入命令 `K`（杀死/kill），然后输入你想杀死的进程旁显示的进程 ID 数字（称为 `PID`）。


    # 停止/启动/重启服务


    Linux 服务器不需要频繁重启，但在某些你可能需要重启软件或服务时。要启动/停止或重启，你输入命令：

    `sudo /etc/init.d/(程序名称) start`（或 stop 或 restart），以进行更改，并在处理更改时使其离线，例如在崩溃或重新配置文件时。


    现在你已经有了一些关于你在哪里、要去哪里、如何获取、安装或删除东西的级知识，请花些时间测试这些内容。后面有一份常用命令列表，以及一个更全面（但不是唯一的）的列表。这并不是详尽的，但它确实展示了你现在就能完成的一些任务，或者你可能期待学习的任务。Linux
    是一个不断演化的操作系统，考虑到发行版和环境的多样性，情况将继续变化。随着我们技术的进步，改进和利用 Linux 系统的机会越来越多。


    # 第 6 章 基础 Kali Linux 工具


    在本章对 Kali Linux 的安装进行简要说明以及对 Kali 操作系统中存在的各种类型工具进行详细概述后，我们将借助 Kali 中提供的工具通过一些实际场景，帮助我们详细了解黑客的基础。


    ## 应该如何进行黑客？


    没有特定的黑客指南可以教你完美的黑客技术。但总有一个著名的程序，优秀的黑客为了获得更好的结果会下意识地遵循。


    ## 黑客路线图


    黑客攻击就像烹饪。你需要准备好所有的食材（即程序），并详细了解这些食材（或程序）的属性，并将它们结合在一起产生烹饪材料。如果食物不好吃怎么办？那意味着在整个黑客过程之后无法获得更好的结果。你只有一种方法，即：再次尝试。要精通黑客，你需要详细学习的五个重要领域：


    1. 信息收集

    2. 自动漏洞扫描

    3. 漏洞利用

    4. 密码攻击

    5. 嗅探与无线攻击


    ### 1) 信息收集

    信息收集始终被认为是黑客在攻击之前的关键工作。通过使用信息收集工具，我们可以获取关于目标主机的大量信息，帮助我们进行进一步的利用。我们甚至可以使用关于目标大量的公开信息来确保攻击成功。


    ### 2) 自动漏洞扫描

    漏洞扫描器是一种自动发现计算机、应用程序和软件漏洞的程序。它通过网络生成数据并与漏洞数据库进行匹配以确保系统。在面对入侵时，可以根据特定环境尽快检测漏洞并采取适当措施，我们可以使用一些方便工具如
    `Nessus` 和 `OpenVAS`。


    ### 3) 漏洞利用

    漏洞利用是获取系统控制的重要方式。它从目标系统发现漏洞并利用漏洞获取权限。为了方便用户，本章将介绍由 Kali 发布的 `Metasploit`。用户可以利用它进行各种渗透攻击，如
    MySQL、PostgreSQL 和 Tomcat 服务。权限提升通常通过使用令牌和社会工程来实现。


    ### 4) 密码攻击

    密码攻击是在不知道密钥的情况下恢复密码。密码攻击是所有渗透测试的重要部分。无论你是渗透测试人员还是理解密码和破解，它仍然是保护数据和限制系统访问的最常见方法。


    ### 5) 嗅探与无线攻击

    这是人们使用网络工具配合网络适配器捕获数据包并从目标获取敏感信息。像 `Wireshark` 嗅探工具是著名的，可以用于大量的攻击并发现数据包。首先，我们将通过信息收集过程，借助名为
    `Nmap` 的侦察工具扫描端口。


    ## 信息收集


    信息收集是攻击前的重要阶段，黑客在此收集关于目标大量的公开信息。许多黑客使用社会工程技术获取关于目标的大量信息，包括操作系统和版本。信息收集有三个重要的阶段，如下：


    - **从搜索引擎收集信息**：使用像 Google 这样的搜索引擎获取关于尝试攻击的主机的好信息。你会发现可以找到多少公开信息而惊讶。

    - **社会工程技术**：这些是疯狂的，因为你可以通过钓鱼邮件等简单的事情欺骗员工或目标来创建后门。所有的优秀黑客都依赖社会工程，而不是用更复杂的方式做事。

    - **端口扫描**：如果你好奇什么是端口扫描，请仔细阅读后续段落。服务器提供了各种服务，如发布主页和发送电子邮件。执行网络通信的服务包括由数字管理的。例如，已知服务基本上是预分配端口号，如
    HTTP 服务的 80 和发送邮件的 587。从外部（攻击者视角）调查服务器开启什么端口被称为“端口扫描”。


    ### 如何进行端口扫描？


    端口扫描是从外部发送特定数据并检查相应响应以调查连接到网络的服务的的过程。通过分析获得的响应，你可以识别运行在服务器上的服务版本、操作系统等。有工具如 `Nmap`
    和 `Zenmap` 可以端口扫描。`Nmap` 是命令行工具，而 `Zenmap` 是图形界面工具。两者使用相同的技术且都是免费的。在读这本书时尝试使用你的电脑，毕竟一个已知事实是你可以通过实践来学习黑客或编程，而不仅仅通过阅读。


    ## Nmap


    `Nmap` 是著名的黑客工具之一，因在渗透测试人员中流行而闻名。人们经常误认为 `Nmap` 仅因信息收集能力而流行，但通常不理解 `Nmap` 也可以作为自动化漏洞检测器。它可以在各种操作系统和
    Windows 上使用。`Nmap` 是一个强大的工具，用于端口发现、主机发现、服务发现、操作系统及其版本的检测。`Nmap` 可以在命令行和图形用户界面
    (GUI) 中使用。但记住，优秀的黑客使用命令行。


    ### Nmap 如何工作


    `Nmap` 的编程方式使其能够使用不同的技术如 TCP 和 FTP 协议扫描。所有这些扫描都有其优缺点，黑客在尝试攻击主机时可以生动地理解这一点。在黑客术语中，我们将目标称为目标主机。使用
    `Nmap` 时，我们需要首先理解目标的复杂度，以决定使用哪种扫描——简单扫描还是耗费更多时间的复杂扫描。我们需要磨练技能，使用一些非常直观的技巧绕过入侵系统以获得良好结果。以下是
    `Nmap` 可以执行的一些策略：


    1. 你可以使用以下命令扫描单个主机：`nmap www.hacking.com`

    2. 你可以使用以下命令扫描整个子网：`nmap 192.232.1.0/24`

    3. `Nmap` 也可以用于扫描多个目标：`nmap 192.232.1 192.232.4`

    4. `Nmap` 还有一个选项可以让你扫描一个范围的目标：`nmap 192.232.1-100`

    5. `Nmap` 有一个选项可以让你将所有的 IP 地址存储在 `.txt` 格式文件中，如果你想看到需要扫描的主机列表，可以输入 `nmap -i sample.txt`

    6. 如果你想排除多个 IP 地址，`Nmap` 提供了一个从子网中排除单个 IP 的选项：`nmap 192.232.1.0/24 --exclude 192.232.4`

    7. 如果你想排除多一个 IP，可以将它们全部包含在文件中，在执行子网扫描时显示：`nmap 192.232.1.0/24 --exclude ip.txt`


    在学习扫描程序之前，`Nmap` 提供让我们了解扫描开放端口的侦察工具。


    ## Nmap 中的扫描技术


    `Nmap` 遵循不同的扫描策略来工作。在本节中，我们将详细描述这些程序，以及几个命令给你一个良好的概述。


    - **SYN 扫描**：这是 `Nmap` 使用的一种典型扫描，如果没有指定，`Nmap` 通常不会向目标建立完整的握手。它只会发送 `SYN` 数据包来检查任何开放端口但不创建会话。这是这种扫描策略最大的优点之一。要使用这种扫描，黑客应获得
    root 权限，否则将显示错误。我们给出此扫描的命令行：`nmap -sS 192.232.1`

    - **TCP 连接**：由于 `sS` 扫描在当前攻击情况下不可行，人们通常使用 `sT` 扫描作为后续。它与开放端口建立三次握手并调用一个名为 `connect()`
    的方法使软件发现 TCP 端口。这种扫描在首选时也可以用于发现 UDP 端口，尽管人们很少使用。我们给出此扫描的命令行：`nmap -sT 192.232.1`

    - **UDP 扫描**：这种扫描也在渗透测试清单中，在 `-sS` 扫描之后。它不需要像 TCP 扫描那样发送 `SYN` 包，因为它只会找到开启的 UDP
    端口。当黑客开始使用这种扫描时，`UDP` 包到达目标主机并等待响应。如果收到响应，则发现开放端口。如果发送 `Echo` 命令错误消息，则端口是关闭的。我们给出此扫描的命令行：`nmap
    -sU 192.232.1`

    - **FIN 扫描**：这是一种特殊的扫描类型，因为某些目标可能安装了入侵检测系统和防火墙来阻止使用 TCP 扫描发送的 `SYN` 包。由于此原因，当另一端发生额外的检测扫描时，会使用
    `Fin 扫描。FIN 扫描不保存任何日志信息供检测，因此 `Fin` 包通过潜入目标系统发现开放端口的概率很大。我们给出此扫描的命令行：`nmap -sF
    192.232.1`

    - **Ping 扫描**：Ping 是一种著名的网络协议方法，通过尝试连接目标主机来检查主机是否存活。`Nmap` 中的 Ping 扫描也用于相同目的，不检查开放端口。Ping
    扫描请求 root 权限来启动扫描。如果你没有准备好提供权限权限只需使用 `connect` 方法从 `Nmap` 启动 ping 扫描。我们给出此扫描的命令行：`nmap
    -sP 192.232.1`

    - **版本检测**：版本检测扫描是黑客 `Nmap` 的痴迷用法之一。为了攻击目标系统，你需要了解主机使用的技术和操作系统。与 TCP 扫描不同，版本检测需要大量时间，因为我们在后台启动
    `sV 扫描` 时，它会搜索开放端口并自动分析它们。由于这个复杂的程序，它可能花费大量时间。我们给出此扫描的命令行：`nmap -sV 192.232.1`

    - **空闲扫描**：这是 `Nmap` 最疯狂的功能之一，因为它在攻击时仅仅充当代理。在使用空闲扫描时，你可以使用另一个主机发送数据包。这种匿名性可以帮助黑客在出错时保持在黑暗中。侦察是每个黑客所追求的。我们给出此扫描的命令行：`nmap
    -sL 192.232.1`

    - **OS 扫描**：`nmap` 可以检测主机设备类型（路由器、运行操作系统）。如果 `Os scan` 无法检测到一个开放或关闭端口，将返回错误。为了准确检测操作系统，我们需要使用
    `NMAP` 的 `guess` 函数来猜测最接近的操作系统类型。我们给出此扫描的：`nmap -O 192.232.1`


    # 第 7 章 命令语法


    让我们讨论许多 Linux 命令共享的一些常用用法。对这些基础有良好的感觉会让你的学习变得更快。调用命令总是以命令名称开始。在某些情况下，如使用 `ls`
    命令，名称本身就足够返回结果。仍然，你通常需要添加一些参数组合来获取大部分信息。识别目录树时，你可以使用正斜杠 `/`。因此，你主目录下名为 `scripts`
    的目录的绝对地址将是 `/home/ubuntu/scripts`，其中 Ubuntu 是你的账户名称。如果在树前面加上 `cd`（代表更改目录），你就移动到该目录。准备好后，只需尝试一下；输入
    `pwd` 命令（代表当前工作目录），你将看到你的新目录位置。为了更容易理解基础 Linux 文件目录管理命令，创建一个新目录并填充它。`mkdir` 命令将创建一个名为
    `data` 的目录。列出父目录的内容然后切换到该目录。要创建几个文件，你可以启动文本编辑器 `nano` 加上现有或新文件的名称。你可以输入一些文本，然后输入
    `Ctrl+X` 和 `Y` 保存并退出。使用未使用名称创建空文件的快速方法是通过 `touch`。在现有文件上使用 `touch` 只会更新文件的日期，这对于某些管理目的很有用。你可以按下方向键并增加次数来使其更容易。一旦你有一系列空编号文件，在内部创建一个新目录并命名为
    `data`。如果你想将文件拷贝到 `data`，可以使用 `cp` 命令。这将创建一个 `file1` 的副本。但如果你必须对每个文件重复该命令，可以使用被称为
    `globbing` 的东西。`globbing 命令`只是一种跨目标扩展操作的方法。输入 `file*` 将复制所有以 `file` 开头的文件，无论后续是什么字符。`cd`
    到 `data` 看看那里有什么。星号 `*` 会导致 Linux 对任何以该字符开头的字符串进行操作。然而，你也可以限制操作为单个字符，使用问号 `?`。你可以创建更多以
    `file` 开头的文件，并使用 `rm` 删除或移除。此外，移动一个文件而不是仅仅创建一个副本，使用 `mv` 命令。


    有些字符被称为正则表达式（regular expressions），shell 不一定解释它们。一个示例是空格。其他示例包括点 `.`、括号 `[]`、星号
    `*` 和问号 `?`。Bash 将这些解释为指令。


    # 第 8 章 Linux 文件和目录


    如果你要在 Linux 上完成工作，特别是使用命令行，你需要对文件存储在哪里以及如何处理它们有一个稳固的认识。好消息是，搞定这一切并不像那么难。在本章中，我们将学习一些基础的文件目录管理技能，探索一些你可以使用的强大工具来搜索文件以及文件中包含字符串，然后处理找到的数据。此外，你将学习如何创建和使用压缩数据包，然后识别系统上的硬件设备，如果需要，启用内核模块以便你使用你的设备。


    识别目录树时，你可以使用正斜杠 `/`。因此，你主目录下名为 `scripts` 的目录的绝对地址将是 `/home/ubuntu/scripts`，其中
    Ubuntu 是你的账户名称。如果在树前面加上 `cd`（代表更改目录），你就移动到该目录。准备好后，只需尝试一下；输入 `pwd` 命令（代表当前工作目录），你将看到你的新目录位置。为了更容易理解基础
    Linux 文件目录管理命令，创建一个新目录并填充它。`mkdir` 命令将创建一个名为 `data` 的目录。列出父目录的内容然后切换到该目录。要创建几个文件，你可以启动文本编辑器
    `nano` 加上现有或新文件的名称。你可以输入一些文本，然后输入 `Ctrl+X` 和 `Y` 保存并退出。使用未使用名称创建空文件的快速方法是通过 `touch`。在现有文件上使用
    `touch` 只会更新文件的日期，这对于某些管理目的很有用。你可以按下方向键并增加次数来使其更容易。一旦你有一系列空编号文件，在内部创建一个新目录并命名为
    `data`。如果你想将文件拷贝到 `data`，可以使用 `cp` 命令。这将创建一个 `file1` 的副本。但如果你必须对每个文件重复该命令，可以使用被称为
    `globbing` 的东西。`globbing 命令`只是一种跨目标扩展操作的方法。输入 `file*` 将复制所有以 `file` 开头的文件，无论后续是什么字符。`cd`
    到 `data` 看看那里有什么。星号 `*` 会导致 Linux 对任何以该字符开头的字符串进行操作。然而，你也可以限制操作为单个字符，使用问号 `?`。你可以创建更多以
    `file` 开头的文件，并使用 `rm` 删除或移除。此外，移动一个文件而不是仅仅创建一个副本，使用 `mv` 命令。如果你想清理掉你的文件，可以使用 `rm`
    和星号移除 `data` 目录中的所有文件。要小心，因为你有时可能会删除比你预期的多。删除的文件可以从 `trashcan` 恢复。你可以 `cd` 到 `data`
    并运行 `rm dir`。大部分最近命令存储在用户主目录的一个隐藏文件中，名为 `bash_history`，可以通过运行 `history` 命令看到。


    # 文件搜索


    一个繁忙的 Linux 系统可以包含大量文件。事实上，某些工作站可以轻松拥有数百万文件。跟踪单个系统是非常重要的。最快的方法是使用 `locate` 命令查找文件。假设你不记得文件在哪里，`adduser`
    命令将如何工作。最可能的候选是 `etc` 目录，那里存储了大多数配置文件。你可以通过指向地址在文本编辑器中打开文件。`locate` 工作非常快，因为它只是读取系统上编译好的索引文件和目录。如果你在寻找最近添加的文件，可能需要更新索引。你可以通过运行
    `update db` 命令来实现。为了管理处理这些数据的问题，Bash 提供了一整套文本处理工具用于读取、转换和重定向文本。你已经知道 `less` 命令会读取文件并逐屏显示它。而不是直接将文本打印到屏幕，它也可以搜索并在如果需要，通过管道操作文件内容。多个文本处理工具可以被调用来过滤流文本。你可以使用
    `cat` 命令读取包含系统组信息的文件，它位于 `etc` 目录。但而不是仅仅将其内容倾到屏幕，你可以将其管道给 `grep` 命令过滤程序，使用由反斜杠产生的垂直线产生。这将告诉
    `grep` 读取文本并只打印包含你指定单词的行。如果你需要它，而不是将输出打印到屏幕，你可以将其填充文件。你可以通过添加两个右箭头和文件名来实现。唯一的问题是，如果你只使用一个右箭头进行重定向而不是两个，`grep`
    选择的文本将覆盖文件的任何现有内容。两个箭头会将文本附加到文件末尾。这是一个你应该记住的重要区别。由于 `group` 是一个按行的文件，这是一个说明你可以如何使用更多工具的好方法。`head`
    命令默认只打印文件的前 10 行，`tail` 将打印最后 10 行。当然，像 `group` 文件的真实价值在于它包含的任何数据。每行都遵循类似的模式：首先是组名，然后是一个冒号和
    x，另一个冒号和组 ID 数字。可能有用从每行中提取一个字段的数据并将它们一起处理。为此，你可以使用 `cut -d` 告诉 Linux 使用每个冒号作为分隔符，意味着认为每次出现都是字段的结束和另一个字段的开始`-f3`
    是我们表示只感兴趣处理第三个字段的内容。如果你想看到这些数字按升序打印，你必须将输出管道给 `sort -n`。如果你想按降序排列，只需添加 `r` 或 `reverse`
    给排序即可。虽然这个例子没有意义，但我们仍然觉得将这么多内容挤进单行有一种美感。如果你想查看一个文件包含多少行、单词和字符，运行 `wc` 命令，它代表字数计数。由于提到了使用箭头重定向，你只需要把它写出来。你有三个可以选择：`stdin`（标准输入）、`stdout`（标准输出）、`stderr`（标准错误）。标准输入通常来自键盘。标准输入将接受来自替代源的输入。此示例将以
    root 用户身份打开 `MySQL` 引擎并导入 `mydatabase.sql` 数据库使用左箭头告诉 Bash 在哪里找到该文件。标准输出默认发送到终端显示。将标准输出重定向到文件将如下：一个箭头将删除文件中的任何现有文本并替换为输入，两个箭头会将文本附加到文件末尾。


    # 自动 漏洞扫描


    `Nessus` 是一种自动扫描工具，具有广泛的已知漏洞数据库，该工具将用于扫描目标并为攻击者提供结果。对于渗透测试人员，`Nessus` 是本质工具之一。Nessus
    的总结通常包括数千个最新的漏洞、各种扫描选项、一个易用的图形界面和有效的报告。Nessus 深受喜爱，因为它有几个特性。它是如何工作的：提供一个完整的计算机扫描服务并更新漏洞数据库。


    ## 创建一个基础扫描


    第一步：通常当我们想扫描主机或网站时，点击 `My Scans` 然后点击 `New Scan`，创建一个新扫描。如果我们正在扫描主机，可以选择 `Web
    Application`。


    第二步：然后进入后续页面，在 `Name` 中输入所需的名称。我们写一个描述以及目标的 IP 地址并点击保存。之后，你可以去 `MyScans` 页面并点击开始。第三步：当扫描完成后，将有一个五个漏洞级别的扫描结构，最高和最低。我们可以点击查看每项的详情。


    ## Netcat 示例


    - `A(192.232.2.23)`

    - `B(192.232.2.4)`

    - `a(192.232.2.23)`

    - `b(192.232.2.4)`


    # Netcat 如何在 Kali Linux 中使用


    如何启动 netcat？当你在 Linux 终端中时，如下所示输入 `nc` 并按回车。这将启动 netcat 工具。


    ### 1) Netcat 用于端口扫描


    初学者总是对端口扫描这个术语感到困惑，因为它在渗透测试人员中非常流行。如果我们想用通俗易懂的语言解释端口扫描，它是通过工具尝试发现漏洞的开放端口的过程，希望找到后门以供利用。这里是使用
    netcat 工具进行端口扫描的命令：`nc -zv -n 192.232.2.3`


    ### 2) 使用 Netcat 启动聊天服务器


    想象你自己处于一个受限区域，如工作场所，在那里无法使用消息服务，netcat 可以通过创建一个与其他系统对话的聊天服务器来解决这个问题。

    服务器：`nc -l 2343`

    客户端：`nc 192.232.2.1 2343`


    ### 3) 文件传输


    很多黑客在攻击时，需要在计算机之间传输文件。通常使用文件传输协议来传输。与其输入整个文件名，你只需按下 `Tab` 键 Bash 就会为你完成剩下的。

    服务器：`nc -l 6870 < example.avi`

    客户端：`nc 192.232.2.1 6870 > example.avi`


    ### 4) 流


    有许多其他方法可以做这一点，但使用命令行是一种简单的方法。

    服务器：`cat tutorial.avi | nc -l 2343`

    客户端：`nc 192.232.2.1 2343 > tutorial.avi`

