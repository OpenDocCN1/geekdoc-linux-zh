- fmt: "\nBear in mind that any files or directories that are within the `Practicals`\
    \ directory will be copied into the `Practicals_beginner` directory.\n\n# CHAPTER\
    \ 14. Building Scripts\n\nIn this chapter you will learn:\n- Writing Shell scripts\n\
    - Command aliases and substitutions\n- Pipes\n- Files, Descriptors and exit status\n\
    - Structured commands (`if`, `for`, `while`, `until`, `break`, `continue`). \n\
    \nIn this chapter, you are going to gain a comprehensive understanding of script\
    \ building with examples. The key to script building is your familiarity with\
    \ commands. Scripting is highly advantageous, as it can process more than one\
    \ command, process the results, and feed one result to the other building a chain.\n\
    \nYou already know how to execute multiple commands using `;`. For instance, `pwd;\
    \ cd ..;` is a combination. What is it? It is a basic shell script!\n\n## Writing\
    \ Shell Scripts\n\nTo write a shell script you simply need some understanding\
    \ of Linux commands and a text editor. On Ubuntu, the default editor can be used\
    \ (`gedit`). Let’s examine the components.\n\nA shell script starts with a comment\
    \ at the top.\n`#!/bin/shell_type`\nFor instance, `#!/bin/bash`. This is a comment\
    \ as it starts with the `#`. These lines are not interpreted by the shell! To\
    \ comment, `#` should be used. However, this specific line tells the shell what\
    \ shell to use to execute this script on. We call `#!` Shebang.\n\nThe next part\
    \ will be a set of commands with explanations. If you are familiar with programming,\
    \ shell scripting is similar.\n\nIf we create a script with the following example:\n\
    ```bash\n#!/bin/bash\nwho\n##who command displays the account you are currently\
    \ logged into and at what #time the user logged into the system.\npwd\n#it should\
    \ work as expected.\n```\nImage: `who` commands in a script![00219.jpeg](image_rsrc20Y.jpg)\n\
    \nYou could also use the absolute or relative path.\n\nThe next thing you need\
    \ to do is the changing of permissions. Why? Let’s create a file and examine the\
    \ permissions.![00220.jpeg](image_rsrc20Z.jpg)\n\nAccording to the result, there\
    \ are insufficient permissions to execute this file. The system treats itself\
    \ as a script, but it hasn’t modified the permissions. It is up to the user.\n\
    \nTo provide execution permissions, `chmod` command can be used.\n```bash\nchmod\
    \ u+x Myscript\n```\n![00221.jpeg](image_rsrc210.jpg)\n\nOnce this step is complete,\
    \ the script is ready to be executed.![00222.jpeg](image_rsrc211.jpg)\n\nIf you\
    \ want to display text guides, the output of environment variables and such, you\
    \ can use the `echo` command. We have learned environment variables in a previous\
    \ lesson.\n\n## Command Aliases\n\nUsing a command alias can save a lot of time.\
    \ To define an alias, you have to do a simple assignment.\nSyntax: `alias=command(s)`\n\
    Examples:\n- `alias L=\"ls -al\"`\n- `alias search=grep`\n\n## Command Substitution\n\
    \nIt is also possible to use an output of a command as an input to a variable.\
    \ This is a great feature to continue the script and execute it with dynamic data.\n\
    To achieve this, you must use `$()`.\nExample: `user_name=$(USERNAME)`\n\nExample\
    \ Script:\n```bash\n#!/bin/bash\nuser_name=$(who)\necho “Your username is :” $user_name\n\
    ```\n![00223.jpeg](image_rsrc212.jpg)\n\n## Creating Files\n\nAnother great feature\
    \ is that you can output the results. You can even name the file according to\
    \ your needs. This is explained in the next example.\n```bash\n#!/bin/bash\nmydate=$(date\
    \ +%Y%m%d)\necho “Today is :” $mydate\nwho > log.$mydate\nls -l log.$mydate\n\
    ```\n![00224.jpeg](image_rsrc213.jpg)\n\nHere, we create a date and format it.\
    \ `%Y` is the year in `YYYY` format. The month is in numeric format (e.g., 09)\
    \ and the date is in a numeric format as well. The output is similar to `YYYYMMDD`.\
    \ The output is taken into a variable. Then we `echo` the variable. Finally, we\
    \ use the `who` command and redirect it’s input to a new file using the redirect\
    \ operator `>`. The file name is created as the `log.YYYYMMDD`. This is how we\
    \ create logs to keep records. If the script runs on the next day, the filename\
    \ will be `log.20190925`.\n\nRedirection is an extremely useful feature. Instead\
    \ of using commands like `touch`, you can redirect the output to a file. Yet,\
    \ you can even create files from scripts by using the `touch` command. For instance:\n\
    ```bash\n#!/bin/bash\nmydate=$(date +%Y%m%d)\necho “Today is :” $mydate\ntouch\
    \ log.$mydate\n#Creates a file and name the first part .lo and later using #our\
    \ variable\nwho >> log.$mydate\n#Append the output of ‘who’ command to the file.\n\
    ```\n![00225.jpeg](image_rsrc214.jpg)![00226.jpeg](image_rsrc215.jpg)\n\nYou can\
    \ also do reverse the process we performed using the `>` operator. This is known\
    \ as input redirection. For instance, we could get an entry of a file to a new\
    \ variable or a command directly. The following example explains this in detail.\n\
    ```bash\n#!/bin/bash\nwc < log.20190924\n# wc is a new command to you. It counts\
    \ the number of lines, words and #characters.\n```\n![00227.jpeg](image_rsrc216.jpg)\n\
    \nFinally, we will look into the `<<` operator. This is known as the inline input\
    \ operator.\nExample: `wc << last`\n![0028.jpeg](image_rsrc217.jpg)\nAs you notice,\
    \ `last` was entered as text input, it captured the user input.\n\nOther examples:\
    \ Redirecting error and standard output to the same file. You could use the following\
    \ command.\nExample: `ls Test Test3> dir 2>&1`\nHere, we are trying to list the\
    \ properties of the `Test` directory. Remember, `ls` supports multiple file or\
    \ directory names. It then lists each file’s or directory’s properties. `Test`\
    \ and `Test2` are on my desktop. `Test3` does not exist. I am redirecting the\
    \ output of this command as well as the error into a new file called `dir`.\n\
    ![00229.jpeg](image_rsrc218.jpg)\n\n## Standard Descriptors\n\nWe are revisiting\
    \ the file descriptors.\n- Standard Input - 0: `STDIN`\n- Standard Output – 1:\
    \ `STDOUT`\n- Standard Error - 2: `STDERR`\nThe first is standard input, the next\
    \ are standard output and standard error. The numerical values are file descriptors.\n\
    \n## Pipes\n\nIn addition to these techniques, pipes are extensively used in scripts.\n\
    Piping is useful when an output of a command is required as an input of another.\
    \ This is something we have so far. The operator used is `|`.\nExample:\n```bash\n\
    #!/bin/bash\ncat employee.txt | sort -nr -k 2\n```\nHere we redirect the file\
    \ entry we obtain to the `sort` function. It sorts by numeric values, in reverse\
    \ order and sort by column (2nd column).![0230.jpeg](image_rsrc219.jpg)\n\n##\
    \ Mathematical Operations in Script Building\n\nAny script can be used to perform\
    \ certain calculations. There are some built-in commands in Linux. We are looking\
    \ into the `expr`. This stands for the expression. These are the operators for\
    \ `expr` command.\n![0231.jpeg](image_rsrc21A.jpg)\nImage: `expr` operators!![0232.jpeg](image_rsrc21B.jpg)\n\
    Examples:![0233.jpeg](image_rsrc21C.jpg)![0234.jpeg](image_rsrc21D.jpg)\n\nRather\
    \ than using `expr` command, it is more convenient to use brackets.\n```bash\n\
    #!/bin/bash\nvar1=2\nvar2=6\nvar3=3\nvar4=$(expr $var1 \\* $var2)\necho $var4\n\
    var5=$((var1 * $var2)/var3)\necho $var5\n```\n![0235.jpeg](image_rsrc21E.jpg)\n\
    \n## The Bash Calculator\n\nWhen you want to perform more mathematical functions,\
    \ there is a built-in bash tool to perform this. It is the bash calculator. The\
    \ command is `bc`.\n![0236.jpeg](image_rsrc21F.jpg)![0237.jpeg](image_rsrc21G.jpg)\n\
    \nThe bash calculator supports the following:\n- Numerical values (integer and\
    \ floating-point numbers).\n- Variables.\n- Expressions.\n- Functions.\n- Statements\
    \ (i.e., if-then-else).\n- Comments.![](image_rsrc21H.jpg)\n\nIn the last line,\
    \ you can see a problem. `8.45/5 = 1`. This is inaccurate unless it is rounded\
    \ up. The problem here is the number of decimal places. It is handled by a built-in\
    \ variable known as `scale`. To receive the intended output, we need to modify\
    \ the `scale`.![0239.jpeg](image_rsrc21J.jpg)![0240.jpeg](image_rsrc21K.jpg)\n\
    \nThe `bc` command supports variables. The following example uses variables instead\
    \ of numerical values.![](image_rsrc21M.jpg)\n\nThe next important task is to\
    \ get `bc` working in a script. In this case, we need to depend on pipes.\n```bash\n\
    #!/bin/bash\nvar1=10\nvar2=2\nvar3=$(echo \"$var1 ^ $var2\" | bc)\necho \"The\
    \ answer is: $var3\n```\n![0242.jpeg](image_rsrc21N.jpg)\n\nAnother example using\
    \ the scale option.\n```bash\n#!/bin/bash\nvar1=10\nvar2=3\nvar3=$(echo \" scale=3;\
    \ $var1 / $var2\" | bc)\necho \"The answer is: $var3\"\n```\n![0243.jpeg](image_rsrc21P.jpg)\n\
    \nThe next example will be looking into how the inline input operator can be used\
    \ with the `bc` command in a script.\n```bash\n#!/bin/bash\nvar1=8\nvar2=1.75\n\
    var3=3\nvarF=$(bc << EOF # EOF stands for End of File\nscale = 4\nv1 = ( $var1\
    \ * $var2)\nv2 = ($var1 /  $var3)\nv1 + v2\nEOF\n)\necho The final calculation\
    \ is: $varF\n```\n![0244.jpeg](image_rsrc21R.jpg)\n\n# CHAPTER 15. Securing Your\
    \ Linux Server\n\nIf you don't incorporate security considerations into every\
    \ step of your planning and every layer of your actual deployment, then you can\
    \ be fairly confident that someday something is going to happen. In this chapter\
    \ you are going to learn about permissions, metadata associated with all Linux\
    \ filesystem objects that control who gets to do what. \n\nFirst I will be talking\
    \ about hardening your server by regularly applying software updates and patches,\
    \ and by ensuring that aren't any network ports open and unprotected. Next, we\
    \ will discuss protecting your data at rest and in transit by encrypting your\
    \ disks, websites. But it will be nice to see those permissions in action. While\
    \ I explain how to do that, you'll also learn how Linux permissions actually work.\
    \ Every object in a filesystem, whether it's a file or directory, has unique metadata\
    \ associated with it. This metadata is represented by characters when you run\
    \ `ls` with the `-l` argument where `l` stands for long version. Check out `cd`\
    \ to the secret directory and then type `su`. The command `su` stands for switch\
    \ user. And this means you would logged in as Bob. You can use `touch` to have\
    \ Bob create a new file called `data.txt`. If Bob wasn't a member of the `secret`\
    \ group and if secret directory wasn't owned by `root`, this would be impossible.\
    \ You can prove that by having Bob try to create a file in `/var/log` directory,\
    \ which is owned by `root`. It will not work. That's why it can be so useful to\
    \ associate groups with particular assets like directories. It's not just about\
    \ Bob. You could add any number of users to this group and they'd all have the\
    \ ability to create and edit files in directories belonging to the group. Let's\
    \ find out how it works. You can run `ls -l` within `/var/secret` directory to\
    \ display the file attributes. You can run `ls` with the `d` argument, which will\
    \ list the attributes, not of the contents, but of directory itself. If you look\
    \ at what those commands give you; the file `data.txt`. The first characters at\
    \ the beginning of that line are really made up of groups. The first dash would,\
    \ if this directory was a directory, be a `d`. If you jump down a couple of lines,\
    \ you should see that the next three characters, `r`, `w`, and `-`, represent\
    \ the ways that the object's owner can use the file. In this case `r` tells that\
    \ the owner can read the file contents, `w` means to write or edit, which includes\
    \ delete, and the `-` is in place of `x`, which would mean that Bob can, if appropriate,\
    \ execute the file. The `-` means that the owner does not have execute rights.\
    \ The next three characters represent the permissions of members in the group;\
    \ Bob's group, in this case. All group members will have both read and write authority,\
    \ but not execute. The final cluster of three characters represents the rights\
    \ of all `non-root` users. They can read, but not write or execute. The next field\
    \ tells you that the file owner is Bob and its group is Bob. Even though the directory\
    \ is owned by root, the file is Bob's because he's the one who created it. Now\
    \ let's look at the directory's attributes. Already mentioned the `d` for directory,\
    \ but you should also see how both the owner and group have full rights, read,\
    \ write, and execute. Others will be able to read and execute, but not write.\
    \ Why is the directory owned by root? Because it was created using `sudo`, which\
    \ is effectively acting as `root`. The `changeown` operation (wait, the text says\
    \ `change`, likely `chown`) you should have run while back changed only the group,\
    \ but not the owner. To do that, you should have included some value, like your\
    \ own username before the colon, and then `secret-group` after the colon to set\
    \ the group. You can change an object's attributes using `chmod`. It wouldn't\
    \ hurt you to try a few more of these to make sure the process is perfectly clear.\
    \ Add execute powers over `data.txt` for others. You can use `o` for others, the\
    \ plus sign to say that you are adding power, and `x` to indicate executable.\
    \ There are two points that should be emphasized here. The first is that since\
    \ you are currently logged in as Bob, who is the owner of `data.txt`, you didn't\
    \ need to use `sudo` for this operation. The second point is that this operation\
    \ would be pointless. Unless Bob happens to turn the file into a script, as you'll\
    \ never need to execute a simple data file. I can't move on without telling you\
    \ about a different way of representing object attributes using numeric notation.\
    \ You will remember that there are three kinds of permissions, read, write, and\
    \ execute. Well, if you use the number 4 to represent read, 2 for write, and 1\
    \ for execution; based on this, by adding together the value of those 3 permissions,\
    \ 7 would indicate the highest permissions level possible for `4+2+1=7`. Someone\
    \ with reading and execute powers, but not write, will be worth 5, while someone\
    \ with only executes powers would be 1. So how would you describe the current\
    \ values of `data.txt` where the user and group both have read and write while\
    \ others have read and execute? That would be `6, 6, 5`. The secret directory,\
