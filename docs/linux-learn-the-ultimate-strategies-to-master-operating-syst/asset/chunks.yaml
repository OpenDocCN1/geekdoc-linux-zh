    \ to start a scan. If you are not ready to provide the administrative privileges\
    \ you can just use the `connect` method to start a ping sweep from `Nmap`. Here\
    \ is the command for `-sP scan`: `hacking@kali nmap -sP 192.232.2.1`\n- **Version\
    \ detection**: Version detection scan is one of the obsessive usages of `Nmap`\
