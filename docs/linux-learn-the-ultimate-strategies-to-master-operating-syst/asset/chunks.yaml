    Linux 的不同变被称为发行版。发行版是不同组件的包，通过选择并缝合在一起来执行定义明确的功能。一个发行版由内核、支持库和系统软件组成。其中大部分内容由
    `GNU Project` 提供。尽管大多数发行版在名称中使用了“Linux”一词，但关于发行版的命名规范曾存在争议，因为自由软件基金会倾向于使用 `GNU/Linux`
    这个名称，以强调 `GNU` 软件的重要性。这让 Linux 的创建者 Torvalds 非常不悦，并立即抵制了这一点。从那时起，发行版的名称问题一直很紧张。


    正如我之前提到的，这是由于发行版的原因。不过，GUI 的存在对于你完成其他软件的安装过程很重要。如果你没有 GUI，将不得不依靠命令行界面来完成安装。


    用户需要知道的是，在任何 Linux 上安装软件都非常容易。新电脑用户也会发现这非常简单且不费时间。操作系统的设计目的是让计算机用户在他们做的每件事上都感到轻松，而这只是其中之一。安装完操作系统后，你就可以开始在使用机器或设备时需要的任何应用程序。


    Linux 无处不在。你可以在家里、汽车里，甚至在电器中找到它。当然，你最常发现它的地方是电脑。从乍上看，Linux 看起来和任何其他操作系统一样。它位于你所有其他软件之下，并向你的硬件传递信号。它拥有图形界面，与其他大多数操作系统一样，并且对于其他系统具有的大多数功能都有相应的软件实现。如果你曾经用过任何操作系统，那么在使用
    Linux 时应该不会遇到困难。人们通常不知道的是 Linux 使用得非常频繁。除了是个人电脑最常用的操作系统之一，它还用于运行全球的许多服务器和嵌入式系统。它用于运行互联网的巨大份额，以及许多管理股票和实现科学突破的超级计算机。然而，在这一切之前，Linux
    就被誉为世界上最无后顾、安全且可靠的系统之一。这种声誉实之名归，Linux 的质量正变得越来越明显。


    Linux 是一个灵活的工具，可以针对你可能感兴趣的任何工作进行定制。用户随时可以对其进一步开发，这意味着它将一直处于越来越好的过程中。它完全依赖社区本身的这一事实使得
    Linux 成为了一项更令人深刻的成就。这也让 Linux 看起来更可靠一点，因为发行过程中没有贪婪因素介入。该系统是属于人民、为了人民的工具，并随着趋势增长。它在用户的帮助下根据用户的需求而成长。


    Linux 的不同变被称为发行版。发行版是不同组件的包，通过选择并缝合在一起来执行定义明确的功能。一个发行版由内核、支持库和系统软件组成。其中大部分内容由
    `GNU Project` 提供。尽管大多数发行版在名称中使用了“Linux”一词，但关于发行版的命名规范曾存在争议，因为自由软件基金会倾向于使用 `GNU/Linux`
    这个名称，以强调 `GNU` 软件的重要性。这让 Linux 的创建者 Torvalds 非常不悦，并立即抵制了这一点。从那时起，发行版的名称问题一直很紧张。


    正如我之前提到的，这是由于发行版的原因。不过，GUI 的存在对于你完成其他软件的安装过程很重要。如果你没有 GUI，将不得不依靠命令行界面来完成安装。


    用户需要知道的是，在任何 Linux 上安装软件都非常容易。新电脑用户也会发现这非常简单且不费时间。操作系统的设计目的是让计算机用户在他们做的每件事上都感到轻松，而这只是其中之一。安装完操作系统后，你就可以开始在使用机器或设备时需要的任何应用程序。


