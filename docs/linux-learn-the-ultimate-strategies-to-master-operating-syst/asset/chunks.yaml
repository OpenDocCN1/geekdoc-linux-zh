    \ for standard error. Zero is standard input, and 1 is standard output.\n\n# CHAPTER\
    \ 10. User and Group Management\n\nIn this chapter, we will learn about users\
    \ and groups in Linux and how to manage them and administer password policies\
    \ for these users. By the end of this chapter, you are well versed in the role\
    \ of users and groups on a Linux system and how they are interpreted by the operating\
    \ system. You will learn to create, modify, lock and delete user and group accounts\
    \ which have been created locally. You will also learn how to manually lock accounts\
    \ by enforcing a password policy in the shadow file.\n\n## Users and Groups\n\n\
    In this section, we will understand what users and groups are and what is their\
    \ association with the operating system.\n\n### Who is a user?\n\nEvery process\
    \ or a running program on the operating system runs as a user. The ownership of\
    \ every file lies with a user in the system. A user restricts access to a file\
    \ or a directory. Hence, if a process is running as a user, that user will determine\
    \ the files and directories the process will have access to. You can know about\
    \ the currently logged-in user using the `id command`. If you pass another user\
    \ as an argument to the `id command`, you can retrieve basic information of that\
    \ other user as well. If you want to know the user associated with a file or a\
    \ directory, you can use the `ls -l command` and the third column shows the username.\
    \ You can also view information related to a process by using the `ps command`.\
    \ The default output to this command will show processes running only in the current\
    \ shell. If you use the ps an option in the command, you will get to see all the\
    \ processes across the terminal. If you wish to know the user associated with\
    \ a command, you can pass u option with the ps command and the first column of\
    \ the output will show the user.\n\nThe usernames are mapped to numbers using\
    \ a database in the system. There is a flat file stored at `/etc/passwd`, which\
    \ stored the information of all users. There are seven fields for every user in\
    \ this file: `username: password:UID:GID:GECOS:/home/dir:shell`\n\n- `username`:\
    \ Username is simply the pointing of a user ID UID to a name so that humans can\
    \ retain it better.\n- `password`: This field is where passwords of users used\
    \ to be saved in the past, but now they are stored in a different file located\
    \ at `/etc/shadow`.\n- `UID`: It is a user ID, which is numeric and used to identify\
    \ a user by the system at the most fundamental level.\n- `GID`: This is the primary\
    \ group number of a user. We will discuss groups in a while\n- `GECOS`: This is\
    \ a field using arbitrary text, which usually is the full name of the user.\n\
    - `/home/dir`: This is the location of the home directory of the user where the\
    \ user has their personal data and other configuration files.\n- `shell`: This\
    \ is the program that runs after the user logs in. For a regular user, this will\
    \ mostly be the program that gives the user the command line prompt.\n\n### What\
    \ is a group?\n\nJust like users, there are names and group ID GID numbers associated\
    \ with a group. Local group information can be found at `/etc/group`. There are\
    \ two types of groups. Primary and supplementary. Let’s understand the features\
    \ of each one by one.\n\n**Primary Group:**\n"
