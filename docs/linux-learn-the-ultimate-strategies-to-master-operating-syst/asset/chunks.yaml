- fmt: "\n# Using Directories\n\nThe command `pwd` will print your working directory.\
    \ This is also a good place to see where you are starting. To see what is in the\
    \ directories, beginning with your home directory, and any others thereafter,\
    \ you can type `ls` to list what is in the directory.\n\nNote that there are also\
    \ hidden files that come with your home directory when the server account was\
    \ configured. To see them listed, you must use a period character. For example,\
    \ you would not just type `ls`, but you would type `ls -b` to see the hidden files.\n\
    \nYou will also learn to combine commands as with the ones prior. For example,\
    \ to move to a sub-folder named `xyz`, you would preface the xyz as such, `cd\
    \ xyz`. An example of the `cd` command to navigate to your desktop directory,\
    \ type `cd ~/Desktop`. To return back to the root directory, type `cd ~`. An example\
    \ of the same command used to navigate into the root directory is to type `cd\
    \ /`. To go to the parent directory, just before your current one), you should\
    \ type `cd ..`. You may want to explore some directories and try moving around\
    \ to get your bearings before you proceed.\n\n# How to Install Programs\n\nThe\
    \ command `apt-get` gets and installs individual visual software packages. This\
    \ is how you will create your server. You will manually pull in anything that\
    \ you need to generalize your Linux server, using select commands. Repositories\
    \ house many Linux programs that you can tap into at any time. These are also\
    \ open source. You should do a Google search for the best software fit for your\
    \ needs if you do not know what you need at this point.\n\nTo then access the\
    \ repository, for example, you would type `sudo apt-get install (program name)`\
    \ to retrieve a copy to automatically install.\n\nThe command `tasksel` means\
    \ task-select with Ubuntu. If you run this, a screen will appear that gives you\
    \ a list of common server types, packages and tasks. You can select and install\
    \ whatever you need for your server. For example, you would say `sudo apt-get\
    \ install tasksel` to get the tasksel function, and then use it by using `sudo\
    \ apt-get install (then the name of the task you want, the server you want, etc.)`.\n\
    \nIf you wanted to install the LAMP server, you would type the command `sudo apt-get\
    \ install lamp-server` to automate this.\n\n![00019.jpeg](image_rsrc20X.jpg)\n\
    An example of an `apt-get install` ([www.en.flossmanuals.net](http://www.en.flossmanuals.net)).\n\
    \nIf you need help at any time, now that you know the man page command, you would\
    \ type: `man tasksel`. You would see man pages appear to address your needs.\n\
    \n# How to Uninstall\n\nTo uninstall, you would simply type `apt-get remove (and\
    \ the name of the server in this case)`. Use this command for obtaining most of\
    \ your software, and opting for the free, open source software to start.\n\n#\
    \ Updates\n\nAfter installation of your software, you can use the upgrade command\
    \ `sudo apt-get upgrade`. Easy updates by way of the repository. It is easy to\
    \ manually update them than to set automatic updates. You won’t need them that\
    \ often due to Linux efficiency. It is also more secure.\n\n# Task Manager\n\n\
    The `top` prompt command is similar to the task manager to see processes and how\
    \ much space each is taking, or to stop things from running. Use command `h` for\
    \ a list of commands you may need at any time. Enter the command `sudo top` (to\
    \ access the task manager or the top), then the command `K` (for kill) and then\
    \ type the process ID number (called a `PID`) that you see next to the process\
    \ that you want to kill.\n\n# Stop/Start/Restart Services\n\nLinux servers need\
    \ very infrequent rebooting, but at times when you may need to restart software\
    \ or service. To start/stop or restart you will type in the command:\n`sudo /etc/init.d/(name\
    \ of the program) start` (or stop or restart), to make changes, and go offline\
    \ while you work on the changes, such as with a crash, or reconfiguring files.\n\
    \nNow that you have some basic knowledge of where you are, where to go, how to\
    \ get, install, or remove things, take some time to test these out. A list of\
    \ common commands follows, as well as a more comprehensive (but not exclusive)\
    \ list. This is in no way exhaustive, but it does show some of the tasks that\
    \ you may be able to do right now, or that you may look forward to learning. Linux\
    \ is an evolving OS, and given the diversity of distros and environments, things\
    \ will only continue to change. As we advanced technologically, there are more\
    \ and more opportunities to improve upon and to utilize Linux systems.\n\n# CHAPTER\
    \ 6. Basic Kali Linux tools\n\nAfter a brief explanation of installation of the\
    \ Kali Linux and a detailed overview of various types of tools that are present\
    \ in the Kali operating system in this chapter, we will go through some practical\
    \ scenarios with the help of tools present in kali that will help us understand\
    \ the basics of hacking in detail.\n\n## How hacking should be done?\n\nThere\
    \ is no particular hacker guideline that can teach you hacking with perfection.\
    \ But there is always a famous procedure that good hackers follow subconsciously\
    \ for better results.\n\n## The Hacking Roadmap\n\nHacking is like cooking. You\
    \ need to get ready with all the ingredients (i.e. programs) and know in detail\
    \ about the properties of that ingredients (or programs) and use them together\
    \ to produce a culinary material. What if the food doesn't taste good? That is\
    \ if you are unable to get better results after all the hacking process? There\
    \ is only one way you can do i.e.; try again. There are five important areas you\
    \ need to learn in detail to master hacking.\n\n1. Information Gathering\n2. Automatic\
    \ Vulnerability Scanning\n3. Exploiting\n4. Password Attacks\n5. Sniffing and\
    \ wireless attacks\n\n### 1) Information Gathering\nInformation-gathering is always\
    \ considered a pivotal job hacker should do before attacking. Roughly sums up\
    \ by using information gathering tools we can acquire a lot of information about\
    \ the target hosts which can help us create exploits for further exploitation.\
    \ We can even use tons of publicly available information about the target to get\
    \ a good idea of what strategy we should use to make this attack successful.\n\
    \n### 2) Automatic Vulnerability Scanning\nA vulnerability scanner is a program\
    \ that automatically finds and discovers vulnerabilities in computers, network\
    \ applications and software. It detects the target system through the network,\
    \ generates data and matches with built-in vulnerability database to enumerate\
    \ security existing on target system. Vulnerability scanning is an indispensable\
    \ means to ensure system and network. In the face of Internet intrusion, if users\
    \ can detect security vulnerabilities as soon as possible according to the specific\
    \ environment, and take appropriate measures to repair because the work is relatively\
    \ boring we can implement it with some convenient tools such as `Nessus` and `OpenVAS`.\n\
    \n### 3) Exploiting\nExploiting is an important way to gain control of the system.\
    \ The user finds a vulnerability from the target system and then uses the vulnerability\
    \ to obtain permissions. In order to facilitate the user's practice, this chapter\
    \ will introduce `Metasploit` released by Kali. Users can use it as operating\
    \ system for practice to introduce various penetration attacks such as MySQL database,\
    \ PostgreSQL and Tomcat service. Privilege escalation is to maximize minimum privilege\
    \ user has. Often elevation is achieved by using fake tokens and social engineering.\n\
    \n### 4) Password Attacks\nA password attack is to recover the password without\
    \ knowing the key. Password attacks are an important part of all penetration testing.\
    \ If you are a penetration tester and don't understand passwords and password\
    \ cracking it's hard to imagine. So no matter what you do or how far our technical\
    \ capabilities are, passwords still seem to be the most common way to protect\
    \ data and restrict access to the system and creating password dictionaries.\n\
    \n### 5) Sniffing and wireless attacks\nThis is where people use wireless network\
    \ tools along with a network adapter to capture packets and crack the password\
    \ or acquire sensitive information from target. Sniffing tools like `Wireshark`\
    \ are famous and can be used for a lot of attacks and finding out the packets.\
    \ First of all we will go through the information gathering process where we will\
    \ scan open ports with the help of a reconnaissance tool called `Nmap`.\n\n##\
    \ Information Gathering\n\nInformation gathering is an important pre-attack phase\
    \ where hackers collect a lot of information that is available in public about\
    \ the target. Many hackers use social engineering techniques to get a solid bunch\
    \ of information about the target along with the operating system and version\
    \ it uses. Every hacker uses a different set of methodologies to create good information\
    \ about the host before targeting. There are three important phases in information\
    \ gathering as explained below\n\n- **Gathering information from search engines**:\
    \ Use search engines like Google to get good information about the host you are\
    \ trying to attack. You will be surprised by the fact how much public information\
    \ you can find.\n- **Social engineering techniques**: These are crazy because\
    \ you can just psychologically trick an employee or the target you are chasing\
    \ with a simple thing like phishing email to create a backdoor via your exploit.\
    \ All great hackers rely on social engineering instead of doing things in a more\
    \ complex way.\n- **Port Scanning**: If you are curious to know what a port scan\
    \ is associated with follow the next paragraphs carefully. There are various services\
    \ provided by the server such as publishing a home page and sending and receiving\
    \ emails. Services that perform network communication include a window called\
    \ `port` for communication which is managed by numbers. For example, well-known\
    \ services are basically pre-assigned port numbers such as 80 for HTTP services\
    \ that publish their home pages on the Internet and 587 for sending emails. The\
    \ act of investigating from the outside (attacker point of view) what kind of\
    \ port the server is opening is called \"port scan\".\n\n### How a port scan is\
    \ done?\n\nPort scanning is the process of sending specific data from the outside\
    \ and examining the corresponding responses in order to investigate the running\
    \ services on servers connected to the network. By analyzing the response obtained\
    \ you can identify the version of the service running on the server, the OS etc.\
    \ There were several tools like `Nmap` and `Zenmap` do port scanning. `Nmap` is\
    \ a command interface tool whereas `Zenmap` is a graphic interface tool. Both\
    \ use the same techniques and are free of cost. Try to use your computer while\
    \ reading this book after all it is a known fact that you can learn hacking or\
    \ programming by doing them but not just by reading.\n\n## Nmap\n\n`Nmap` is one\
    \ of the famous hacking tools and is widely known for its popularity among penetration\
    \ testers. People often mistake that `Nmap` is only popular for its information\
    \ gathering abilities but often doesn't understand that `Nmap` can also be used\
    \ as a vulnerability detector that can be automated. It can be used in various\
    \ operating systems that are open source and in Windows. `Nmap` is a powerful\
    \ tool that can be used for port discovery, host discovery, service discovery,\
    \ detection of operating system and its version. `Nmap` can be used in both command\
    \ line and with graphical user interface (GUI). But remember that good hackers\
    \ use the command line.\n\n### How Nmap works\n\n`Nmap` is programmed in a way\
    \ such that it can perform scanning using different technologies like TCP and\
    \ FTP protocol scans. All these scans are prone to their strengths and weaknesses\
    \ and hackers can understand it vividly when they are trying to attack hosts.\
    \ In hacking terminology we call the target as the target host. When using `Nmap`\
    \ we need to first understand the complexity of target to decide which scan to\
    \ use either simple scan or complex scan that would take lot more time. We need\
    \ to polish our skills to use some very and intuitive techniques to get past intrusion\
    \ systems to get good results. Below are some strategies that `Nmap` can perform:\n\
    \n1. You can scan a single host with the following command: `nmap www.hackingtools.com`\n\
    2. You can scan an entire subnet with the following command: `nmap 192.232.2.1/24`\n\
    3. `Nmap` can also be used to scan multiple targets with the following command:\
    \ `nmap 192.232.2.1 192.232.2.4`\n4. There is also an option in `Nmap` that will\
    \ let you scan a range of targets as: `nmap 192.232.2.1-100`\n5. `Nmap` has an\
    \ option where you can store all the IP addresses you have in a text file that\
    \ is in `.txt` format and if you want to see a list of all the hosts you need\
    \ to scan you can enter the following: `nmap -sL sampleip.txt`\n6. If you want\
    \ to exclude more than one IP address, `Nmap` provides an option where we can\
    \ exclude a single IP address from scanning with subnet hosts: `nmap 192.232.2.1/24\
    \ -exclude 192.232.2.4`\n7. And if you want to exclude more than one IP, you can\
    \ include all of them in a text file so they can be excluded while doing the subnet\
    \ scan as shown below: `nmap 192.232.2.1/24 -exclude ip.txt`\n\nBefore learning\
    \ about the scanning procedures `Nmap` offers to let us know about scanning ports\
    \ on a specific host. You can scan individual ports in a host using the following\
    \ command: `nmap -p78,56,23 192.232.2.1`\n\n## Scanning technology in Nmap\n\n\
    There are different types of scanning strategies that `Nmap` follows to do the\
    \ work. In this section we will describe these procedures in detail along with\
    \ few commands that will give you a good overview.\n\n- **SYN scan**: This is\
    \ a typical scan that `Nmap` uses if nothing is specified by the hacker to the\
    \ software. In this scan usually `Nmap` will not give a full handshake to the\
    \ target system. It will just send an `SYN` packet to the target host which will\
    \ then check for any open ports but not creating any sessions that may be used\
    \ after logging. This is one of the greatest strengths of this scanning strategy.\
    \ To use this scan the hacking tool should be given root access otherwise it will\
    \ show an error. Below we give the command line for this scan: `hacking@kali nmap\
    \ -sS 192.232.2.1`\n- **TCP connect**: If the `sS scan` is not used due to the\
    \ reason that it is not feasible for the current attack situation people normally\
    \ use `sT scan` as their next. It gives three handshakes with open ports and calls\
    \ a method called `connect()` which makes the software find TCP ports. This scan\
