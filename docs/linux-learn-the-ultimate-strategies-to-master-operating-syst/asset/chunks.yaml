    implement these concepts with python programming for doing advanced tasks in hacking.
    Let us start!CHAPTER 5\. What To Do Next With Linux?We will continue to navigate
    the Ubuntu distro as we outline how to install and set up your operating system.
    Remember that one of the assets of any Linux OS is that you can customize it to
    work for you.Desktop VersionWith the Desktop version, you will mostly find that
    most of it is plug and play. Graphics and text will guide you. Apps will allow
    you to navigate the functions that you need to do and to have, just as with Windows
    or MAC OS. Again, you will see icons, taskbars and menus that look familiar.Graphics
    and CLI?As mentioned earlier, although you are relying on the desktop version
    to provide a GUI, you will still have the ability to use the Command Line Interface
    (CLI) whenever you would like to do this. Different distros of Linux will have
    different ways of getting to these prompts. With Ubuntu in its various versions
    it may be some arrangement of clicking the Applications Menu, Accessories and
    finally, the Terminal which is where you can get the prompt to enter the Commands.You
    may feel that you chose the GUI edition to get away from having to use a CLI at
    all. Some people really like having this combination of graphics and the prompt,
    however. Any future tutorials that you may watch or read may include some Commands
    that you may use at the prompts even with the desktop version. They may still
    apply to you. Some things to note about this are that it can be very useful to
    do things such as to automate tasks if you do the same things, often. It can also
    be very handy in times such as when your GUI crashes. It would be good to learn
    some of the basics, as you never know when you may need them!Applications and
    SoftwareUpon installation, your Ubuntu distro already comes with many pre-installed
    apps and programs. These may include: Firefox, OpenOffice, music and video players,
    social media and messaging tools, and some of the usual apps that help make things
    useful or fun.The best part about Linux is customization. You should do a Google
    search for the best app, program or software for your needs if you are not sure
    what you should install, but the beauty is that you can customize, unlike preloaded
    systems with a lot of third parties or proprietary stuff that most of us are used
    to having. Many of these come from repositories. Linux Repositories are places
    that house many programs and Apps that you can tap into at any time. Most of these
    are also open source. Some may not be.With Ubuntu you will access news apps and
    software easily and at the touch of a mouse, quickly retrieve and install whatever
    you need. ![00016.jpeg](image_rsrc20U.jpg)Fetching New Apps ([www.webupd8.org](http://www.webupd8.org)
    ).One quick and easy way to access the repositories is through what is called
    the Synaptic Package Manager. With this, you can access games to MS Office.  To
    into your System file, then under Administration click on the Synaptic Package
    Manager. Look for “ubuntu-restricted-extras” and install that through the package
    manager. This will allow access to some proprietary applications. In general,
    from this manager, you can check what app you would like and install.Another way
    to access the repository on the desktop version is to use the CLI Command. This
    will be outlined more in the Server section, where the CLI is essential, with
    the lack of the GUI. You will use Commands such as “apt-get-install” to fetch
    applications from the same repositories, but this will be text-based through the
    CLI interface. Again, there are lists at the end of the guide. You will see a
    beginner’s basic Command list that will be extremely helpful for navigating the
    CLI, even at the Desktop level. You will also see a more comprehensive list that
    will aid a beginner as well as move you into some intermediary learning.One of
    the beauties of the Desktop version is this versatility.Security, Updates and
    EfficiencyEvery Linux user or developer will advise you to do some very specific
    things before you go in and play or do too much at first installing your version
    of Ubuntu. Security and Stability are also key for maintaining your Linux and
    you will enjoy it for many years. Here is a top 10 list of things Linux users
    recommend to do after the install.'
