    Often, the users we gain access to may have the lowest permissions. However, if
    you want to perform a penetration attack, you may need the administrator account
    permissions, so you need to increase the permissions. Permission elevation can
    be achieved by using fake tokens, local privilege escalation, and social engineering.4)  Password
    AttacksA password attack is to recover the password plaintext without knowing
    the key. Password attacks are an important part of all penetration testing. If
    you are a penetration tester and don''t understand passwords and password cracking,
    it''s hard to imagine. So, no matter what you do or how far our technical capabilities
    are, passwords still seem to be the most common way to protect data and restrict
    access to the system. This chapter describes various password attack methods,
    such as password online attacks, router password attacks, and creating password
    dictionaries.5)  Sniffing and wireless attacksThis is where people use wireless
