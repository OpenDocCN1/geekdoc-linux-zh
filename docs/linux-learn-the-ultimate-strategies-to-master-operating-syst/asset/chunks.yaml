    # 在 VirtualBox 中安装 Linux Mint


    在某些情况下，你可能希望保留当前的 Windows 系统，但仍然在同一台 PC 上安装 Linux。为了实现这一目标，你需要在 Windows 中安装一个虚拟机（virtual
    box）。虚拟机是一个虚拟环境，允许你在其中安装 Linux。或者，虚拟机也可以帮助你在 PC 上安装多个发行版。你将安装两个版本，其中一个将安装在硬盘的分区上，而另一个将安装在虚拟机中。


    # 第 17 章：控制特权用户


    现在，是时候开始讨论访问你操作系统或服务器的用户的安全性和权限了。尤其在今天，人们似乎认为技术和服务器比以往任何时候都时候安全，但与大众的认知相反，实际上有非常多的支持可以保持系统的安全和稳固。其中一种方法就是通过控制特权用户，本章将教你如何操作。


    在阅读本章时，你将引导了解各种类型的 Linux 账户，例如 root 用户、普通用户和系统用户。你将发现 `sudo`，它的意思是“super user
    do”（超级用户执行）。这是系统管理员的命令——只要你处于正确的账户并拥有使用它的适当权限，该命令就可以让你访问任何内容和任何地方。最后，你将学习 `sudoers`
    文件。该文件本质上是 `sudo` 背后的底层程序——它控制 `sudo` 以及最初谁有权访问 `sudo` 命令。这一切都将帮助你管理服务器或机器上的用户，让你能够确保落实了适当的安全系统。当一切就绪且系统安全后，你就可以放心，感觉你的系统是真正安全的。


    ## Linux 账户类型


    首先，在进行其他操作之前，我们将讨论 root 用户、普通用户和系统用户。你必须对这三种账户类型有完全的理解，才能真正理解 `sudo` 和 `sudoers`
    如何在系统安全中发挥作用。


    由于 Linux 极其灵活，你有选择创建几种不同类型的账户。事实上，如果你需要，可以拥有多个 root 账户，或者在不同类别中拥有不同权限的账户。重要的是你的需求能够得到有效的满足。


    请记住，仅仅因为你有 root 账户并不意味着你不应该建立某种安全系统——你绝对应该有一个密码来保护 root 账户，以确保无人能够访问这些文件并在未经你许可的情况下接管它们。这意味着你能够确保文件本身还有另一层的保护。现在，废话少说，让我们开始研究
    Linux 的三种主要用户类型。


    ### Root 用户


    你必须认识的第一个用户是 root 用户。这通常被称为超级用户，特别是在 `sudo` 缩写中。超级用户或 root 用户是默认管理员账户的个人。这个人对系统拥有完全控制权，就像管理员账户对
    Windows 的控制权一样。凭借默认赋予的 root 权限，该用户能够执行任何命令，并直接控制或更改其他人的和服务账户。


    实际上，如果你是设置系统的人，那么这本应该是你的账户。这个账户能够统治其他账户，管理并监控所有账户，而无需额外权限。所有权限都授予了 root 用户。他们可以更改其他用户的权限、移动文件、更改文件所有权，并在系统内进行任何其他操作。


    请记住，由于你有权在程序中执行几乎任何操作，操作系统不会告诉你不要做某事。系统对你没有任何保护措施，你在使用此账户时必须小心。如果你删除了系统文件，而你没有定期对文件进行归档和备份，那么可能无力回地。如果有一个用户能够对你的程序造成灾难性的破坏，那么这个用户就是超级用户或
    root 用户。


    Linux 假设 root 用户对自己所的一切有很好的把握，正因如此，如果你在任何时候不确定自己在做什么，宁可信其有疑，如果你认为必要，应该尝试寻求他人的帮助。总的来说，虽然这应该是你拥有自己权限的账户，但你也应该尽可能地避免使用此账户，以确保你不会冒着销毁一切的风险。


    在非常特定的时期你应该使用 root。否则，对于大多数日常功能，你只需要一个普通账户就足够了。当然，每当你尝试一项需要 root 权限的任务时，你应该确保在必要时进行切换，并在尝试任何操作之前备份数据。特别是，你需要使用
    root 权限将文件或目录移入系统目录。请记住，系统目录是那些直接负责操作系统运行的目录，没有它们，你就无法运行操作系统。当你尝试将任何文件复制到系统目录时、更改其他用户的权限时、进行某些系统修复以及偶尔安装程序时，都要求你使用
    root 账户。通常，如果一个文件需要 root 权限才能安装，是因为该文件本身将直接与系统目录交互。如果你没有进行上述任何操作，只需避免它，从而省去可能搞乱系统的麻烦。


    ### 普通用户


    普通用户和系统用户具有相同的权限，两者通常都由 root 或被授予某种程度权限的用户创建。然而，普通用户通常是一个真实的人，而系统用户通常是为软件保留的账户。普通用户将拥有真实的
    shell（外壳）和自己的家目录，并且在使用 `adduser` 命令创建新用户时，每个用户都会分配一个 `UID`。基本上，此用户没有特殊权力。普通用户无法访问任何被标记为不可用的文件，其权限可以根据用户的需要定期更改。


    大多数情况下，如果你在自己的设备上运行 Linux，你需要一个 root 账户来确认你是否要执行该操作。当你准备好使用 `sudo` 时，你会使用普通账户来确保你不会意外删除或销毁某些东西。这就是你的保护措施。普通用户的权限可以由
    root 用户自定义——授予你所需的任何权限，只要你了解方法。


    ### 系统用户


    如前所述，系统用户与普通用户的权限相同。然而，系统用户几乎总是某种程序（例如守护进程 daemon），它将在后台运行且不具有交互性。该用户的存在仅仅是为了组织目的。当你能够指定系统用户时，你一眼就能看出它不涉及人类。虽然这可能并不重要，但能一眼看到你有多少用户是好的。通常，这些账户是在操作系统安装期间创建的，并保留控制权。它们通常具有非常特定的
    `UID`，你可以在 root 账户中识别它们。由于这些系统用户运行操作系统必要的进程，当你修改或重置任何进程时，应该离开它们。如果你在终端看到它在等待你，你需要小心，并尽可能离开这些系统用户，以保护你自己免受损坏。如果你损坏了其中一个，由于你不注意，很可能会销毁整个操作系统。


    ## Sudo


    现在是时候讨论 `sudo` 了。如果你在命令前使用 `sudo`，你实际上是在告诉系统你有特权来执行该过程。通常，特权权限是系统检查你是否真的被授予了进行更改的权限。如果你一直主要使用
    Windows，你已经习惯某种账户交互。当你安装软件时，你会注意到某些安装将弹出提示，询问你是否确定继续并要求你提供所需的权限。这就是你在 `sudo` 中正在做的，你实际上是在告诉系统你对系统具有特权访问权限。


    如果你一直主要使用 macOS，直到你触发可能被视为危险或创建重大更改的操作，你有类似的保护措施。在 Mac 上，你会看到一个安全框弹出，你必须提供密码以确认你确实想执行该操作。本质上，`sudo`
    是你的权限密码，它告诉系统你是负责的——只要你的账户权限匹配。


    ### 使用 Sudo


    当你准备好使用 `sudo` 时，不需要太费。实际上，你所做的就是在尝试执行的命令前加上 `sudo`。这样做，你的程序应该要求你输入你所在账户的密码。如果你提供了密码且凭据通过，它将执行功能。例如，假设你想重启系统。你可能记得触发系统重启的命令仅仅是
    `reboot`。然而，`reboot` 需要 `sudo` 权限。如果你只是简单地用 `reboot` 命令系统，它会告诉你必须是超级用户才能执行该命令。这就是你提升命令的地方。在那里，你可以在命令中添加：


    ```

    sudo reboot

    ```


    你的系统会询问账户密码，输入密码后按要求重启。


    ### 使用 Su 而不是 Sudo


    这可能是你用来提升权限以触发系统遵守的安全方法之一。还有其他方法，例如切换用户命令 `su`。然而，当你使用切换用户命令时，会被要求 root root 密码并进入超级用户提示符。当你得到
    `#` 作为输入信号而不是你现在可能熟悉的 `$` 时，你就知道处于超级用户提示符中了。`#` 应该是你的警告标志——如果你在终端看到它在等待你，你知道你处于
    root 账户，需要小心。


    虽然切换用户命令在非常特定的情况下可能有用处，但它存在你因一个拼写错误或你在敲键盘时不小心被别人撞到而销毁一切的风险。然而，当你使用 `sudo` 时，你需要在每一个需要额外权限的命令中插入它。这意味着你有了额外的保护。当然，如果你正在处理某些需要你不断验证凭据的事情，这可能会很烦，但如果你认为额外的安全性是值得的，那就是值得的。当然，你可以在开始绕过
    `sudo` 使用过程之前为系统设置备份，但那是你必须做出的个人决定，要权衡自己的风险。


    ## sudoers 文件


    在 `sudo` 之下是 `sudoers` 文件。它决定了最初可以使用 `sudo` 命令来使用权限。通常，你可以在 `/etc/sudoers` 访问此文件，编辑它的最好方法是使用
    `visudo`。


    ### Visudo


    `visudo` 本身充当临时措施——`sudoers` 文件的额外安全层。它允许安全编辑，同时锁定 `sudoers` 文件防止被多个用户编辑，这可能会变得危险。如果你在其他人正在使用它时用
    `visudo` 访问它，你会被错误消息拒绝并被要求稍后再试。当你进行编辑时，它会停止并检查编辑是否有错误。如果你碰上语法错误，它将拒绝保存，并打印声明错误位置的消息。从那里，你会被提示尝试重新编辑以修复错误，或者你可以直接退出。


    ### 使用 Sudo


    当你准备好使用 `sudo` 时，不需要尝试。实际上，你所做的就是在你尝试执行的命令前加上 `sudo`。这样做，你的程序应该要求你输入你所在账户的密码。如果你提供了密码且凭据通过，它将执行。例如，假设你想重启系统。你可能记得触发系统重启的命令仅仅是
    `reboot`。然而，`reboot` 需要 `sudo` 权限。如果你只是简单地用 `reboot` 命令系统，它会告诉你必须是超级用户才能执行该命令。那就是你提升命令的地方。在那里，你可以在命令中添加：


    ```

    sudo reboot

    ```


    你的系统询问账户密码，输入密码后按要求重启。


    ### Su 而不是 Sudo?


    这可能是你用来提升权限以触发系统遵守的安全方法之一。还有其他方法，例如切换用户命令 `su`。然而，当你使用切换用户命令时，会被要求 root 密码并进入超级用户提示符。当你得到
    `#` 作为输入信号而不是你现在可能熟悉的 `$` 时，你就知道处于超级用户提示符中了。`#` 应该是你的警告标志——如果你在终端看到它在等待你，你知道你处于
    root 账户，需要小心。


    虽然切换用户命令在非常特定的情况下可能有用处，但它也存在你因一个拼写错误或你在敲键盘时不小心被别人撞到而销毁一切的风险。然而，当你使用 `sudo` 时，你需要在每一个需要额外权限的命令中插入它。这意味着你有了额外的保护。当然，如果你正在处理某些需要你不断验证凭据的事情，这可能会很烦，但如果你认为额外的安全性是值得的，那就是值得的。当然，你完全可以在开始绕过
    `sudo` 使用过程之前为系统设置备份，但那是你必须做出的个人决定，要权衡自己的风险。


    ## sudoers 文件


    在 `sudo` 之下是 `sudoers` 文件。它决定了最初可以使用 `sudo` 命令来使用权限。通常，你可以在 `/etc/sudoers` 访问此文件，编辑它的最好方法是使用
    `visudo`。


    ### Visudo


    `visudo` 本身充当一种临时措施——`sudoers` 文件的额外安全层。它允许安全编辑，同时锁定 `sudoers` 文件防止被多个用户编辑，这可能会变得危险。如果你在其他人正在使用它时用
    `visudo` 访问它，你会被错误消息拒绝并被要求稍后再试。当你进行编辑时，它会停止并检查编辑是否有错误。如果你碰上语法错误，它将拒绝保存，并打印声明错误位置的消息。从那里，你会被提示尝试重新编辑以修复错误，或者你可以直接退出。


    `visudo` 允许你检查 `sudoers` 文件的语法。常用的 `visudo` 选项如下：


    - `visudo -c`: 检查 `sudoers` 文件的语法。

    - `visudo -l`: 列出当前的 `sudo` 权限规则。

    - `visudo -s`: 以静默模式检查语法。

    - `visudo -u username`: 检查特定用户的 `sudo` 权限。

    - `visudo -g groupname`: 检查特定组的 `sudo` 权限。

    - `visudo -f filename`: 使用指定的文件作为 `sudoers` 文件。

    - `visudo -n`: 检查语法但不保存。

    - `visudo -v`: 显示版本信息。


    ### sudoers 文件


    使用 `visudo` 允许你安全地编辑 `sudoers` 文件。一个典型的 `sudoers` 文件的格式如下：


    - `root ALL=(ALL:ALL) ALL`: 允许 root 用户在任何主机上以任何身份执行任何命令。

    - `user ALL=(ALL) ALL`: 允许普通用户在任何主机上执行任何命令。

    - `%sudo ALL=(ALL:ALL) ALL`: 允许 sudo 组的成员在任何主机上以任何身份执行任何命令。

    - `user ALL=(ALL) NOPASSWD: ALL`: 允许用户执行命令无需密码。

    - `user ALL=(root) /usr/bin/command`: 允许用户以 root 身份执行特定命令。

    - `user ALL=(ALL) NOPASSWD: /usr/bin/command`: 允许用户无需密码执行特定命令。


    通过编辑 `sudoers` 文件，你可以精细地控制哪些用户或组拥有特权权限，从而增强系统的安全性。


    '
