  trans: '


    # 1. CD/DVD 安装


    通过 CD 或 DVD 启动 Ubuntu Linux 是在计算机上安装该系统的两种方法之一。


    - 从 Ubuntu 软件下载 Ubuntu ISO 文件。这种格式的文件在使用之前，需要将其刻录到 CD 或 DVD 中。

    - 使用你选择的刻录程序刻录 ISO 文件。有许多免费和付费的程序可以将 ISO 文件刻录到 CD 或 DVD，而无需额外下载单独程序。你可以选择你最喜意的一个。

    - 从光盘启动。一旦程序被刻录到光盘中，你就可以重启电脑并选择从 CD 或 DVD 启动。你可能需要更改启动优先项。请在电脑重启时按下 `Setup` 键来实现此操作。

    - Linux 为用户提供了在安装之前尝试的选项，以确保它确实是你需要的。你可以在这一层级进行操作：先尝试 Ubuntu，如果你觉得它是你想要使用的操作系统，就可以安装它。在系统仍从光盘运行时，你可以查看操作系统的布局。

    - 安装 Ubuntu。如果你使用的是笔记本电脑，必须连接电源，因为安装过程可能会耗尽电池电。此外，你还需要连接到网络。

    - 决定如何处理你的另一个操作系统。你将获得两个选项：是将 Ubuntu Linux 与其他操作系统并存安装，还是用 Ubuntu 替换旧操作系统。如果你选择保留两个系统，那么每次重启电脑时，都必须选择要使用的操作系统。

    - 设置分区大小。如果你选择在电脑上同时拥有两个操作系统，这将是必要的。你可以使用滑动条来调整想要为 Ubuntu 留出的空间。记住，你还需要为文件和程序留出空间，因此请为新系统留出足够的空间。

    - 选择你的位置。如果你连接了网络，这将自动完成。

    - 设置键盘布局。在这里正确的做法是点击“检测 Ubuntu 键盘布局”以自动选择正确的布局。

    - 输入你的登录信息。设置用户名和密码。你可以选择让 Ubuntu 自动登录，也可以在任何想使用电脑时输入登录信息。

    - 等待安装过程完成。安装完成后重启电脑，Ubuntu 将加载。


    # 2. Windows 安装程序


    Windows 安装程序会将 Ubuntu Linux 与你正在使用的其他操作系统并存安装。程序和文件不会受到影响，但每当你重启动电脑时，你都必须选择要使用的操作系统。


    - 从 Ubuntu 网站下载安装程序。如果浏览器提示，你可以选择运行、保存或打开。

    - 创建一个用于登录电脑的用户名和密码。

    - 点击 `Install` 开始过程。

    - 安装完成后重启电脑，并选择 Ubuntu Linux 作为加载的操作系统。


    '
- fmt: '

    # Important Note: ❖ It is always a good idea to run such a program on CD or DVD
    in order to have a first look at it; then, install it if you like what you see.
    Test driving will help you in making a decision you will not regret when it comes
    to installing operating systems. ❖ Make sure that you backup all your files, programs,
    personal data and settings first before installations begin so that you will not
    lose them.


    # Installing New Software on Linux

    Installing new software on Linux Operating System is as easy as it is when you
    are installing the operating system itself. Everything has been made very easy
    for the users. This is, therefore, no reason to worry if you have been having
    a hard time installing a anew system on other operating systems in the past.


    Most of the Linux distributions have an app store, or something close to that,
    which represents a central area where all applications are stored. What you do
    is to go through them and install the apps that you want to use on your machine.
    This makes it so easy for you to locate the app that you want to install on your
    computer. The `Ubuntu Software Center` is an example of such a centralized place
    for the Ubuntu Linux. Deepin has the `Deepin Software Center`. Some distributions
    rely on `GNOME software` while others rely on `Synaptic`. All these tools mean
    and do the same thing; they provide a central place from where you can search
    and install Linux software with ease. The presence of a GUI is important though,
    for you to go through the installation process of another software. If you do
    not have a GUI, you will have to rely on the command line interface to do the
    installations.


    What users need to know is that it is very easy to install software on any Linux
    machine. New computer users will also find this very easy and less time-consuming.
    The operating system has been designed in order to give computer users an easy
    time on everything that they do, and this is just one of them. After the installation
    of the operating system, you can start installing any app that you will need in
    the use of your machine or device.


    Linux is everywhere. You can find it in your house, your car, and even in electrical
    appliances. Of course, the place you will most commonly find it in is computers.
    At first glance, Linux can look like any other operating system. It sits below
    all of your other software and relays the signals to your hardware. It has a graphical
    interface, like most other operating systems and has software equivalents for
    most functions that other systems have. If you have ever used any operating system,
    you should have no trouble with using Linux. What people usually don’t know is
    that Linux is used very often. Other than being one of the most used operating
    systems for personal computers, it is used to run many servers and embedded systems
    across the globe. It is used to run a huge portion of the internet, as well as
    many supercomputers that manage stocks and make scientific breakthroughs. Before
    all of this, however, Linux had a reputation of being one of the most worry-free,
    safe, and reliable systems out there. The reputation is well deserved and Linux’s
    quality just keeps getting more and more evident.


    Linux is a flexible tool that can be customized for any line of work you might
    be interested in. Users are always free to further develop it, which means that
    it will always be in the process of becoming better and better. The fact that
    it solely relies on the community itself makes Linux an even more impressive achievement.
    It also makes Linux seem a bit more reliable because no greed comes into play
    with the distribution. The system is a tool from the people, to the people, and
    grows with the trends. It grows with the help of the users and based on the needs
    of the users.


    The different variations of Linux are called distributions. Distributions are
    packages of different components that are selected and sewn together in order
    to perform a well-defined function. A distribution is made out of the kernel and
    supporting libraries and system software. Most of these are provided by the `GNU
    Project`. Even though most distributions use the word “Linux” in their name, there
    was a bit of controversy over the naming convention of the distributions as the
    Free Software Foundation preferred the name `GNU/Linux` in order to emphasize
    the importance of `GNU` software. This did not sit well with Torvalds, the creator
    of Linux, who immediately boycotted this. Ever since then, tensions have been
    high when it comes to the names of distributions.


    Some of the most popular Linux distributions are `Fedora`, `Ubuntu`, and `Debian`.
    There are many distributions that are used commercially. Some of them are the
    `Red Hat Enterprise Linux` and the `SUSE Linux Enterprise Server`. The desktop
    distributions of Linux usually include a windowing system like `Wayland` or `X11`
    and a desktop environment like the `KDE Plasma 5` or the `GNOME`. Other distributions
    that are made for servers usually do not have graphics and include solution packs.
    An example of a solution pack is `LAMP`. There are numerous distributions available
    out there. What makes the possibilities even greater is the fact that you can
    make your own distribution for whichever purpose due to Linux being freely distributable.


    Linux was originally made for personal computers and was based on `Intel x86`
    architecture. Since then, it has been ported to many platforms, more than any
    other operating system. When it comes to servers and mainframe computers, Linux
    has the lead over any other operating system. On top of that, it is the only operating
    system used by the top 500 supercomputers, where it has been gradually eliminating
    competition ever since November of 2017. Around 2.3 percent of desktop computers
    run on it. It takes up 20 percent of notebook sales for notebooks under $300 with
    the `Chrome OS` that is based on `Linux kernel`. With this, it easily dominates
    the K-12 education market in the US.


    Linux is also used in embedded systems. These are devices whose operating system
    is built into the firmware and is tailored to the system itself. Routers, TVs,
    automation controls, video game consoles, digital video recorders, and smartwatches
    are examples of embedded systems. Linux derivatives are often used in smartphones
    and tablet computers. Due to how dominant `Android` has been in the smartphone
    market, Linux, by proxy, has the largest installed base amongst the general-purpose
    OSs.


    Linux stands tall as a testament to success in the face of difficult odds. It
    is a statement of how far the collaboration of independent creators can go. It
    is a prominent example of open-source software collaboration. The fruits of labor
    are obvious. In 2001, a study was made about `Red Hat Linux 7.1`. The study showed
    that the distribution had 30 million source lines of code. The study also found
    that, for this distribution to be created by a single person, it would take eight
    thousand years of development time. The development would have cost 1.57 billion
    dollars if the system was made with conventional proprietary means in the US.
    About 70 percent of the source code was written in the `C` programming language.
    You could consider the rest patchwork of a sort, since it was written in many
    different languages like `C++`, assembly language, `Lisp`, `Python`, `Perl`, `Fortran`,
    and many shell scripting languages.


    # Was Linux Created?

    The original name for the Linux was `Freax`, a wordplay on free and Unix. For
    a period of six months, the makefiles of the project included the name `Freax`.
    The name `Linux`, though given to the project later the line, was considered as
    a possible name for the project even before `Freax`, but Torvalds found it to
    be egotistical and dismissed it.


    Files were uploaded onto the FTP server of `FUNET` in order to facilitate the
    further development of Linux. This happened in September 1991 with the help of
    Ari Lemmle, a coworker of Torvald’s at the Helsinki University of Technology,
    and a few other individuals who volunteered as administrators for the FTP server.
    Ari thought that “Freax” was not a good name. Without Torvalds’s know, he changed
    the name of the project to Linux, which, eventually, Torvalds consented to.


    # What Makes Linux Different?

    As I mentioned before, it is due to the distribution. The presence of a GUI is
    important though, for you to go through the installation process of another software.
    If you do not have a GUI, you will have to rely on the command line interface
    to do the installations.


