    the Command “sudo top” (to access the task manager or the top), then the Command
    “K” (for kill) and then type the process ID number (called a PID) that you see
    next to the process that you want to kill.Stop/Start/Restart ServicesLinux servers
    need very infrequent rebooting, but at times when you may need to restart software
