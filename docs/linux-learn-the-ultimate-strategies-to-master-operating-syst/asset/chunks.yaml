    当你完成文本输入后，按下 `Esc` 退出此模式并返回可视命令模式。提示：在使用 `vi` 编辑器时，可能很难判断你正处于哪种命令模式。可能会出现这种情况：你输入了一长行文本，结果才发现自己并不在文本输入模式，这可能会让人有些沮丧。如果你想确保自己处于命令模式，可以按几次
    `Esc`。此外，利用方向键和一些键盘键移动光标和屏幕也是有用的。尝试这些命令：图片来源：Linux All-in-One for Dummies。


    你还可以使用冒号命令跳转到特定行。例如，如果你想立即切换到第 6 行，只需在冒号后输入 `6` 然后按回车：请记住，当你输入冒号符号时，`vi` 编辑器将其显示在屏幕的最后一行。之后，`vi`
    将你输入的任何文本都视为命令。


    要搜索特定字符串，输入 `/` 符号然后按回车。`/` 符号会出现在最后一行，提示你输入想要搜索的字符串。一旦找到，`vi` 将将光标置于文本行中匹配项的开头。例如，如果你想在
    `/etc/fstab` 文件中搜索字符串“cdrom”，输入：`/etc/fstab`。


    如果你想删除光标所在的行，输入命令 `dd`。编辑器将删除该行，并将下一行变为为当前行。


    如果你想在光标处输入文本，输入命令 `i`。编辑器将将其模式更改为文本输入模式，从而允许你输入所需的文本。完成后，按下 `Esc`。随后 `vi` 编辑器将恢复可视命令模式。


    一旦完成文件修改，你可以通过输入 `:w` 命令来保存所做的更改。要保存文件并退出编辑器，输入 `:wq` 命令。或者，你也可以通过按住 `Shift` 键然后连续击两次
    `Z` 同时保存并退出。


    要不保存退出编辑器，输入 `:q!` 命令。这里是 `vi` 编辑器常用的其他命令：图片来源：Linux All-in-One for Dummies。


    ## 第 13 章 练习


    正如我们上面已经学到的，创建目录非常简单。同样，从 Linux 系统中移除或删除目录也非常简单。然而，你必须记住，一旦你从 Linux 系统中移除或删除了一个目录，就没有办法撤销该任务。因此，最好的办法是在你在
    Linux 上运行任何命令时；第一件事就是对你的操作小心。如果这意味着在运行命令之前双重检查，那就更好。


    我们将使用的用于移除或删除目录的命令是 `rmdir`，它代表 remove directory（删除目录）。这里需要注意的是 `rmdir` 命令支持与
    `mkdir` 命令相同的 `-p` 和 `-v` 选项。此外，目录在删除之前必须是空的。我们稍后将学习如何解决。


    1. `rmdir linux_tutorial/beginner/commands`

    2. `ls linux_tutorial/beginner`


    ### 如何创建一个空文件


    许多涉及文件内数据操作的命令都有一个极佳特性：当我们引用它们并发现文件不存在时，它们会自动创建一个文件。事实上，我们可以利用 `touch` 命令利用这个特性创建一个空文件。换句话说，你输入命令
    `touch`，后面跟着命令行选项和文件名。


    1. `pwd`

    2. `/home/Gary/linux_tutorial`

    3. `ls`

    4. `beginner`

    5. `touch practice_exercise1`

    6. `ls practice_exercise1 commands`


    ### 复制文件或目录


    让我们考虑以下示例：


    1. `user@bash: ls`

    2. `practice_exercise1 commands`

    3. `cp practice_exercise1 Exercise1`

    4. `ls`

    5. `practice_exercise1 Exercise1 commands`


    在这种情况下，我们必须注意的是路径中的源和目标点。这里我们可以考虑的一些示例包括：


    * `cp /home/Gary/linux_tutorial/Exercise1 Exercise2`

    * `cp Exercise2 ../../backups`

    * `cp Exercise2 ../../backups/Exercise3`


    当你使用 `cp` 命令时，文件的目标可以是代表指向文件或目录的路径。如果目标是一个文件（如 `Exercise1`、`2` 和 `3`），将在目标文件中创建文件的副本，但原始文件保留在源文件或目录中。如果我们将文件复制到目录，文件将在目标目录中保持名称。在
    `cp` 命令的默认行为下，它只会复制文件。在这种情况下，“递归”（recursive）一词意味着你希望复制目录以及该目录的所有内容，其中可能包括文件、目录和子目录等。


    让我们考虑以下示例：


    1. `user@bash: ls`

    2. `Gary Practicals transfers`

    3. `user@bash: cp Practicals Practicals_beginner`

    4. `cp: omitting directory ‘Practicals.’`

    5. `user@bash: cp -r Practicals Practicals_beginner`

    6. `user@bash: ls`

    7. `Gary Practicals transfers Practicals_beginner`


