    请记住，`Practicals` 目录下的任何文件或目录将被复制到 `Practicals_beginner` 目录。


    # 第 14 章构建脚本


    在本章中，你将学习：

    - 编写 Shell 脚本

    - 命令别名和替换

    - 管道

    - 文件、描述符和退出状态

    - 结构化命令（`if`, `for`, `while`, `until`, `break`, `continue`）。


    在本章中，你将通过示例对脚本构建获得全面的理解。脚本构建的关键在于你对命令的熟悉程度。编写脚本编写非常有优势，因为它可以处理多个命令，处理结果，并将一个结果传递给另一个，从而构建出一个链。


    你已经知道如何使用 `;` 执行多个命令了。例如，`pwd; cd ..;` 就是一个组合。它是什么？这是一个基础 shell 脚本！


    ## 编写 Shell 脚本


    要编写 shell 脚本，你只需要对 Linux 命令和文本编辑器有一定了解。在 Ubuntu 上，可以使用默认的编辑器（`gedit`）。让我们检查一下组件。


    Shell 脚本以顶部的注释开始。

    `#!/bin/shell_type`

    例如，`#!/bin/bash`。这是一个注释，因为它以 `#` 开头。这些行不会被 shell 解释！要进行注释，应该使用 `#`。然而，这一特定行告诉
    shell 使用什么 shell 来执行此脚本。我们称 `#!` 为 Shebang。


    下部分是一组带有解释的命令。如果你熟悉编程，shell 脚本编写是非常类似的。


    如果我们按照以下示例创建一个脚本：

    ```bash

    #!/bin/bash

    who

    ##who 命令显示你当前登录的账户以及用户登录系统的时间。

    pwd

    #它应该按预期方式工作。

    ```

    图片：脚本中的 `who` 命令![00219.jpeg](img/image_rsrc20Y.jpg)


    你也可以使用绝对路径或相对路径。


    你需要做的另一件事是更改权限。为什么？让我们创建一个文件并检查权限。![00220.jpeg](img/image_rsrc20Z.jpg)


    根据结果，没有足够的执行此文件。系统将自己视为脚本，但它还没有修改权限。这取决于用户。


    为了提供执行权限，可以使用 `chmod` 命令。

    ```bash

    chmod u+x Myscript

    ```

    ![00221.jpeg](img/image_rsrc210.jpg)


    一旦完成此步，脚本就准备好执行了![00222.jpeg](img/image_rsrc211.jpg)


    如果你想显示文本指南、环境变量的输出等，可以使用 `echo` 命令。我们在之前的一节中学习了环境变量。


    ## 命令别名


    使用命令别名可以节省大量时间。要定义别名，你必须进行简单的赋值。

    语法：`alias=command(s)`

    示例：

    - `alias L="ls -al"`

    - `alias search=grep`


    ## 命令替换


    将命令的输出作为变量的输入也是可能的。这是一个继续脚本并使用动态数据执行它的很棒的功能。

    要实现这一点，你必须使用 `$()`。

    示例：`user_name=$(USERNAME)`


    示例脚本：

    ```bash

    #!/bin/bash

    user_name=$(who)

    echo “Your username is :” $user_name

    ```

    ![00223.jpeg](img/image_rsrc212.jpg)


    ## 创建文件


    另一个棒的功能是你可以输出结果。你甚至可以根据你的需要命名文件。这将在下一个示例中解释。

    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo “Today is :” $mydate

    who > log.$mydate

    ls -l log.$mydate

    ```

    ![00224.jpeg](img/image_rsrc213.jpg)


    在这里，我们创建了一个日期并对其格式化。`%Y` 是 `YYYY` 格式的年份。月份是数字格式（例如 09），日期也是数字格式。输出类似于 `YYYYMMDD`。输出被存入变量。然后我们
    `echo` 该变量。最后，我们使用 `who` 命令并使用重定向运算符 `>` 将输入重定向到新文件。文件名创建为 `log.YYYYMMDD`。这就是我们创建日志来保存记录。如果脚本在第二天运行，文件名将是
    `log.20190925`。


    重定向是一个非常有用的功能。与其使用 `touch` 等命令，你可以将输出重定向到文件。然而，你甚至可以使用 `touch` 命令从脚本创建文件。例如：

    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo “Today is :” $mydate

    touch log.$mydate

    #创建一个文件并将第一部分命名为 .lo，之后使用我们的变量

    who >> log.$mydate

    #将‘who’命令的输出追加到文件中。

    ```

    ![00225.jpeg](img/image_rsrc214.jpg)![00226.jpeg](img/image_rsrc215.jpg)


    你也可以使用 `>` 运算符反转我们执行的过程。这被称为输入重定向。例如，我们可以从文件获取一个条目。下面的示例详细解释了这一点：

    ```bash

    #!/bin/bash

    wc < log.20190924

    # wc 计算行、单词和字符。

    ```

    ![00227.jpeg](img/image_rsrc216.jpg)


    最后，我们将查看 `<<` 运算符。这被称为在此输入。示例：`wc << last`

    ![0028.jpeg](img/image_rsrc217.jpg)

    注意，`last` 是作为文本输入的。其他示例：将错误和标准输出重定向到同一个文件。你可以使用下面的命令。

    示例：`ls Test3> dir 2>&1`

    在这里，我们尝试列出 `Test` 目录的属性。记住，`ls` 支持多个文件或目录。然后列出每个文件或目录的属性。`Test2` 在桌面上。![0229.jpeg](img/image_rsrc218.jpg)


    ## 标准描述符


    我们回顾文件描述符。

    - 标准输入 - 0：`STDIN`

    - 标准输出 – 1：`STDOUT`

    - 标准错误 - 2：`STDERR`

    第一个是标准输入，下一个是标准输出和错误。


    ## 管道


    除了这些技术，管道在脚本中被广泛使用。当需要一个命令的输出作为另一个的输入时，管道非常有用。使用的是 `|`。

    示例：

    ```bash

    #!/bin/bash

    cat employee.txt | sort -nr -k 2

    ```

    在这里我们将文件重定向到 `sort` 函数。它按数值倒序并按列（第 2 列）排序。![0230.jpeg](img/image_rsrc219.jpg)


    ## 脚本中的数学运算


    任何脚本都可以用于执行某些计算。Linux 中有一些内置命令可以执行此操作。我们查看 `expr`。它代表表达式。这些是 `expr` 命令的运算符![0231.jpeg](img/image_rsrc21A.jpg)

    图片：`expr` 运算符![0232.jpeg](img/image_rsrc21B.jpg)

    示例：![0233.jpeg](img/image_rsrc21C.jpg)![0234.jpeg](img/image_rsrc21D.jpg)


    与其使用 `expr` 命令，更方便的是使用括号。

    ```bash

    #!/bin/bash

    var1=2

    var2=6

    var3=3

    var4=$(expr $var1 \* $var2)

    echo $var4

    var5=$((var1 * $var2)/var3)

    echo $var5

    ```

    ![0235.jpeg](img/image_rsrc21E.jpg)


    ## Bash 计算器


    当你想要执行更多数学函数时，有一个内置 bash 工具执行此操作。这是 bash 计算器。命令是 `bc`![0236.jpeg](img/image_rsrc21F.jpg)![0237.jpeg](img/image_rsrc21G.jpg)


    bash 计算器支持：

    - 数值（整数和浮点数）。

    - 变量。

    - 表达式。

    - 函数。

    - 语句（例如 if-then-else）。

    - 注释。(image_rsrc21H.jpg)


    在最后一行，你可以看到一个问题。`8.45/5 = 1`。除非向上舍入，否则是不准确的。这里的问题是小数位数由名为 `scale` 的内置变量处理。为了获得预期输出，我们需要修改
    `scale`![0239.jpeg](img/image_rsrc21J.jpg)![0240.jpeg](img/image_rsrc21K.jpg)


    `bc` 命令支持变量。下面的示例使用了变量而不是数值。(image_rsrc21M.jpg)


    下一个重要任务是让 `bc` 在脚本中工作。在这种情况下，我们需要依赖管道。

    ```bash

    #!/bin/bash

    var1=10

    var2=2

    var3=$(echo "$var1 ^ $var2" | bc)

    echo "The answer is: $var3

    ```

    ![0242.jpeg](img/image_rsrc21N.jpg)


    另一个使用 scale 选项的示例。

    ```bash

    #!/bin/bash

    var1=10

    var2=3

    var3=$(echo " scale=3; $var1 / $var2" | bc)

    echo "The answer is: $var3"

    ```

    ![0243.jpeg](img/image_rsrc21P.jpg)


    下一个示例将查看如何在脚本中使用内联运算符配合 `bc` 命令。

    ```bash

    #!/bin/bash

    var1=8

    var2=1.75

    var3=3

    varF=$(bc << EOF # EOF 代表文件结束

    scale = 4

    v1 = ( $var1 * $var2)

    v2 = ($var1 /  $var3)

    v1 + v2

    EOF

    )

    echo The final calculation is: $varF

    ```

    ![0244.jpeg](img/image_rsrc21R.jpg)


    # 第 15 章 安全你的 Linux 服务器


    如果你在规划和实际部署的每个步骤中加入安全考虑，那么你可以确定某天会发生什么。在本章中，你将学习与 Linux 文件系统相关的权限，它们控制谁可以做什么。首先，我们将通过定期应用软件更新和补丁来加固你的服务器，并确保没有端口是开放且不受保护的。接下来，我们将通过加密磁盘来讨论静态和传输中的数据保护。你会看到这些权限的作用。你也将学习
    Linux 权限实际上是如何工作的。文件系统中的每个对象，无论是文件还是目录，都有与其相关的元数据。这些元数据在你运行 `ls -l` 参数时显示。`cd`
    到该目录然后输入 `su`。命令 `su` 代表切换用户。这意味着你以 Bob 的身份登录。你可以使用 `touch` 创建名为 `data.txt` 的新文件。这里应该强调两点：第一点是由于你当前以
    `data.txt` 所有者 Bob 的身份登录，此操作你不需要使用 `sudo`。第二点是，此操作是没有意义的，除非 Bob 碰将该文件转换为脚本，因为你永远不需要执行一个简单的数据文件。我不能不说你另一种使用数字表示法表示对象属性的方法。你会记得有三种权限：读、写和执行。如果如果你使用数字
    4 代表读，2 代表写，1 代表执行；基于此，通过相加这 3 种权限的值，7 表示可能的最高权限级别 `4+2+1=7`。具有读取和执行权限但没有写权限的人是
    5，而只有执行权限的人是 1。那么你将如何描述 `data.txt` 的当前值，即用户和组都具有读写权限，而其他人具有读取执行权限？那将 `6, 6, 5`。另一方面，目录将是
    `7, 7, 5`。你自己算一下。你可以配合 `chmod` 使用这种表示法，对 `data.txt` 应用 `7, 7, 7` 示例将为用户和组添加执行权限，并为其他人添加写入。你可以运行
    `ls -l` 在 `secret` 目录内显示文件属性。`ls` 带有 `d` 参数列出属性，而不是目录本身。该行开头的字符由组组成。如果这是一个目录，将是
    `d`。跳几行，你应该看到接下来的三个字符 `r`, `w` 和 `-` 代表对象所有者可以使用的方式。在这种情况下 `r` 告诉所有者可以读取文件，`w`
    意味着写入或编辑，包括删除，`-` 是 `x` 的位置，这意味着 Bob 可以适当执行文件。`-` 意味着所有者没有执行权限。接下来的三个字符代表组成员的权限；在这种情况下，所有组成员都具有读写权限，但没有执行权限。最后的三个字符代表所有非
    root 用户的权限。他们可以读取但不能写入或执行。下一个字段告诉你文件所有者是 Bob，其组也是 Bob。尽管目录归 root 所有，文件也是 Bob 的，因为他是创建它的人。现在让我们看看目录的属性。已经提到了目录的
    `d`。为什么目录归 root 所有？因为它使用 `sudo` 创建的，实际上是 root 操作。`changeown`（等等，文本说是 `change`，可能是
    `chown`）你应该运行它只更改组而不是所有者。要这样做，你应该在冒号之前包含一个值，如你的用户名，然后在冒号之后加上 `secret-group` 设置组。你可以使用
    `chmod` 更改对象的属性。多尝试几次这些以确保过程完全清晰对你没有坏处。为其他人 `data.txt` 添加执行权限。可以使用 `o` 代表其他人，使用
    `+` 表示你正在添加权限，并使用 `x` 表示可执行。这里应该强调两点：第一点是由于你当前以 `data.txt` 所有者 Bob 的身份登录，此操作你不需要使用
    `sudo`。第二点是，此操作是没有意义的，除非 Bob 碰将该文件转换为脚本，因为你永远不需要执行一个简单的数据文件。

