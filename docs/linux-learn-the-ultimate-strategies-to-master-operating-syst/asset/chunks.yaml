    \ information to be detected so there is a great chance of the `Fin` packet to\
    \ find out open ports by sneaking into the target systems. Here is the command\
    \ for `-sF`: `hacking@kali nmap -sF 192.232.2.1`\n- **Ping scan**: Ping is a famous\
    \ network protocol method that checks whether a host is live or not by trying\
