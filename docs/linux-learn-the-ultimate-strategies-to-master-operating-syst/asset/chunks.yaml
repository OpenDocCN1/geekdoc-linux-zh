  raw: 'Once you are done typing in your text, press Esc to exit this mode and return
    to visual command. Tip: It may be a bit difficult to tell what command mode you
    are in when you are using the vi editor. There may be circumstances that you have
    typed a long line of text only to realize that you are not in the text input mode,
    which can be a little frustrating. If you want to see to it that you are in command
    mode, press Esc a couple of times. It is also helpful to know that you can make
    use of the arrow keys and some keyboard to move the cursor and the screen around.
    Try these commands out: Image from: Linux All-in-One for Dummies  You can also
    jump to a specific line using the colon command. For example, if you want to switch
    immediately to line 6, just type 6 after the colon and then hit Enter: Keep in
    mind that when you enter the colon symbol, the vi editor will display it at the
    last line of the screen. After doing so, vi will consider any text that you enter
    as a command. To search for a particular string, key in the / symbol and then
    hit Enter. The / symbol will appear at the last line, which prompts you to enter
    the string that you want to search for. Once it is found, vi will position the
    cursor at the beginning of the matching entry in a line of the text. For example,
    if you want to search for the string “cdrom” in the /etc/fstab file, key in: If
    you wish to delete the line where the cursor is placed, type the command dd. The
    editor will then delete that line and then change into the next line as the current
    line. If you wish to enter text at the cursor, type the command i. The editor
    will change its mode to become text input, which will then allow you to type in
    your desired text. Once you are done, hit Esc. The vi editor will revert to visual
    command afterward. Once you are done modifying the file, you can save changes
    that you have made by entering the :w command. To save the file and exit the editor,
    enter the :wq command. Alternatively, you can also perform save and exit at the
    same time by holding down the Shift key and then hitting Z twice. To exit the
    editor without saving, enter the :q! command.  Here are other commands that are
    commonly used by the vi editor: Image from: Linux All-in-One for DummiesCHAPTER
    13\. ExercisesAs we have already learned above, the creation of a directory is
    pretty easy. In the same manner, removing or deleting a directory from the Linux
    system is also very simple. One thing that you have to bear in mind, however,
    once you remove or delete a directory from the Linux system, there is no way to
    undo that task. Therefore, the best thing is whenever you are running any command
    on Linux; the first thing is to be careful with what you do. If it means double
    checking the command before running it, the better. The command we are going to
    use to remove or delete a directory is rmdir which stands for remove directory.
    The things that you have to take note of here is that rmdir command supports the
    –p and –v options in the same manner as mkdir command. Additionally, the directory
    has to be empty before t is removed. We will learn how to get around this later.  


    1.  rmdir linux_tutorial/beginner/commands  


    2.  ls linux_tutorial/beginner  


    How to create a blank file Many commands that are involved in data manipulation
    within a file have a superb feature that they will create a file automatically
    when we refer to it, and we find that it does not exist. As a matter of fact,
    we can manipulate this feature to create a blank file using the touch command.
    In other words, you type the command touch followed by the command line option
    and the file name. 


    1.  pwd  


    2.  /home/Gary/linux_tutorial  


    3.  ls  


    4.  beginner  


    5.  touch practice_exercise1  


    6.  ls practice_exercise1 commands 


    Copying a file or a directory   Let us consider the following example: 


    1.  user@bash: ls  


    2.  practice_exercise1 commands  


    3.  cp practice_exercise1 Exercise1 


    4.  ls  


    5.  practice_exercise1 Exercise1 commands 


    An important thing that we have to note in this case is the source and the destination
    point at the paths. Some examples that we can consider here include: 


    *   cp /home/Gary/linux_tutorial/Exercise1 Exercise2 


    *   cp Exercise2 ../../backups 


    *   cp Exercise2 ../../backups/Exercise3 


    When you use the cp command, the destination of the file can represent a path
    to a file or a directory. If the destination is to a file such as Exercise1, 2
    and 3, then this will create a copy of the files in the destination file, but
    the original remains in the source file or directory. If we copy the files into
    a directory, the files will maintain the names in the destination directory. In
    the default behavior of the cp command, it will only copy a file. The term recursive
    in this case means that you would wish to copy the directory and all the contents
    of that very directory which could include files, directories, and subdirectories
    among others. Let us consider the following example: 


    1.  user@bash: ls  


    2.  Gary Practicals transfers 


    3.  user@bash: cp Practicals Practicals_beginner 


    4.  cp: omitting directory ‘Practicals.'' 


    5.  user@bash: cp -r Practicals Practicals_beginner  


    6.  user@bash: ls  


    7.  Gary Practicals transfers Practicals_beginner '
