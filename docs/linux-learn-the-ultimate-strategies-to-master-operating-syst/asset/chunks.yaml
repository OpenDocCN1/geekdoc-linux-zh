    # Primary Groups


    * There is exactly one primary group for every user.

    * The primary group of local users is defined by the fourth field in the `/etc/passwd`
    file where the group number `GID` is listed.

    * New files created by the user are owned by the primary group.

    * The primary group of a user by default has the same name as that of the user.
    This is a User Private Group (UPG) and the user is the only member of this group.


    ## Supplementary Groups


    * A user can be a member of zero or more supplementary groups.

    * The primary group of local users is defined by the last field in the `/etc/group`
    file. For local groups, the membership of the user is identified by a comma separated
    list of user, which is located in the last field of the group’s entry in `/etc/group`.

    * `groupname: password: GID:list, of, users, in, this, group`

    * The concept of supplementary groups is in place so that users can be part of
    more group and in turn have to resources and services that belong to other groups
    in the system.


    # Getting Superuser Access


    In this section, we will learn about what the root user is and how you can be
    the root or superuser and gain full access over the system.


    ## The root user


    There is one user in every operating system that is known as the superuser and
    has all access and rights on that system. In a Windows-based operating system,
    you may have heard about the superuser known as the administrator. In Linux based
    operating systems, this superuser is known as the `root` user. The `root` user
    has the power to override any normal privileges on the file system and is generally
    used to administer and manage the system. If you want to perform tasks such as
    installing new software or removing existing software, and other tasks such as
    manage files and directories in the system, a user will have to escalate privileges
    to the `root` user.


    Most devices on an operating system can be controlled only by the `root` user,
    but there are a few exceptions. A normal user gets to control removable devices
    such as a USB drive. A non-root user can, therefore, manage and remove files on
    a removable device but if you want to make modifications to a fixed hard drive,
    that would only be possible for a `root` user.


    But as we have heard, with great power comes great responsibility. Given the unlimited
    powers that the `root` user has, those powers can be used to damage the system
    as well. A `root` user can delete files and directories, remove or modify user
    accounts, create backdoors in the system, etc. Someone else can gain full control
    over the system if the `root` account gets compromised. Therefore, it is always
    advisable that you login as a normal user and escalate privileges to the `root`
    user only when absolutely required. It is a practice in Linux to login as a regular
    user and then uses tools to gain certain privileges of the `root` account.


    ## Using Su to Switch Users


    You can switch to a different user account in Linux using the `su` command. If
    you do not pass a username as an argument to the `su` command, it is implied that
    you want to switch to the `root` user account. If you are invoking the command
    as a regular user, you will be prompted to enter the password of the account that
    you want to switch to. However, if you invoke the command as a `root` user, you
    will not need to enter the password of the account that you are switching to.


    ```

    su - <username>

    [student@desktop ~]$ su -

    Passord: rootpassword

    [root@desktop ~]#

    ```


    If you use the command `su username`, it will start a session in a non-login shell.
    But if you use the command as `su - username`, there will be a login shell initiated
    for the user. This means that using `su - username` sets up a new and clean login
    for the new user whereas just using `su username` will retain all the current
    settings of the current shell. Mostly, to get the new user’s default settings,
    administrators usually use the `su -` command.


    ## sudo and the root


    There is a very strict model implemented in Linux operating systems for users.
    The `root` user has the power to do everything while the other users can do nothing
    related to the system. The common solution, which was followed in the past was
    to allow the normal user to become the `root` user using the `su` command for
    a temporary period until the required task was completed. This, however, has the
    disadvantage that a regular user literally would become the `root` user and gain
    all the powers of the `root` user. They could then make critical changes to the
    system like restarting the system and even delete an entire directory like `/etc`.
    Also, gaining access to become the `root` user would involve another issue that
    every user switching to the `root` user would need to know the password of the
    `root` user, which is not a very good idea.


    This is where the `sudo` command comes into the picture. The `sudo` command lets
    a regular user run command as if they are the `root` user, or another user, as
    per the settings defined in the `/etc/sudoers` file. While other tools like `su`
    would require you to know the password of the `root` user, the `sudo` command
    requires you to know only your own password for authentication, and not the password
    of the account that you are trying to gain access to. By doing this, it allows
    the administrator of the system to allow a certain list of privileges to regular
    users such that they perform system administration tasks, without actually needing
    to know the `root` password.


    Lets us see an example where the student user through `sudo` has been granted
    access to run the `usermod` command. With this access, the student user can now
    modify any other user account and lock that account.


    ```

    [student@desktop ~]$ sudo usermod -L username

    [sudo] password for student: studentpassword

    ```


