    要练习使用 `ed` 作为编辑器，请执行以下命令：这将 `/etc/fstab` 文件复制到你的家目录下。要开始编辑此文件，请输入此命令：


    ```bash

    cp /etc/fstab ~

    ed -p fstab

    ```

    编辑器随后会响应并显示如下输出：

    ```

    :

    ```

    从这个示例可以看出，`-p` 选项允许你将冒号（符号 `:`）设置为你的提示符，并打开了你在家目录中复制的 `fstab` 文件。每当 `ed` 编辑器调出一个文件进行编辑时，它会显示该可编辑文件内包含的字符数，然后显示冒号提示符，表示你可以通过编辑器输入命令了。


    **提示**：当你想使用 `ed` 进行编辑时，请确保你已经使用 `-p` 选项开启了提示符。这可以帮助你区分自己正处于文本输入模式，而不是命令模式。


    一旦 `ed` 打开了你想要编辑的文件，你将直接处于文件的最后一行。要查看当前行号，或者你准备要插入命令将放置的行，你可以使用 `.` 命令，它显示如下：

    ```bash

    .

    ```

    通过这个结果，你现在知道文件 `fstab` 包含 9 行。现在，如果你想查看文件中包含的所有行，可以使用以下命令：

    ```bash

    p .

    ```

    这将返回如下所示的输出：

    ```

    1  ...

    2  ...

    ...

    9  ...

    ```

    如果你想去要编辑的行号（例如第 2 行），只需在提示符上输入行号即可。编辑器随后会响应并显示特定一行：

    ```

    2 ...

    ```

    例如，如果你想删除一行包含 `cdrom` 单词的行，你需要做的只是搜索那个特定字符串。你可以通过输入 `/` 符号，然后输入你需要查找的字符串来实现：

    ```bash

    /cdrom

    ```

    这将返回包含你想要编辑的行，该行将成为当前行。要删除它，只需在提示符上输入 `d` 即可。

    ```bash

    d

    ```

    要将特定字符串替换为另一个，使用 `s` 命令会非常方便。例如，如果你想将字符串“cdrom”替换为“cd”，请输入此命令：

    ```bash

    s/cdrom/cd/

    ```

    要在当前正在编辑的行之前输入一行，请使用以下命令：

    ```bash

    a

    ```

    从这一点起，你可以输入任意数量的行。如果你完成了输入，在空行上输入点符号 `.` 以表示你正在结束文本输入模式。这样做之后，你会发现 `ed` 切换回命令模式。

    ```

    :this is a new line.

    .

    ```

    如果你想保存对文件所做的更改，请在提示符上输入 `w` 命令。

    ```bash

    w

    ```

    如果你想保存更改并退出编辑器，请在提示符上输入 `wq` 以执行这两项操作。输出将如下所示：

    ```

    1234

    ```

    编辑器随后将保存你执行的所有更改，并显示已保存的字符数。之后，Linux 将退出编辑器。但是，如果你想在不保存对文件做的任何更改的情况下退出，请输入 `q`
    命令以不写入文件的方式退出。


    当然，在 `ed` 中还可以使用其他不同的命令。以下是 `ed` 编辑器中最常用命令总结。


    ### vi

    与 `ed` 相比，`vi` 编辑器显然更易用，尽管它仍然被视为命令行编辑器。`vi` 允许你在全屏模式下使用文本编辑器，这意味着你可以同时查看多行。同样需要帮助点是，大多数
    Unix 系统（包括 Linux）都带了此文本编辑器；这意味着一旦你理解了该编辑器如何工作，你就能在任何基于 Unix 的系统上修改文本文件。


    **注意**：当你使用 `vi` 编辑文本文件时，编辑器将其读取到缓冲区内存中。这意味着你可以在缓冲区中更改文件。同时，该编辑器在编辑会期间还会使用临时文件，这意味着除非保存了所做的任何更改，否则原始文件中不会有任何更改。


    要开始使用 `vi` 进行编辑，请输入 `vi` 后跟文件名：

    ```bash

    vi fstab

    ```

    这将允许 `vi` 加载文件，然后将文本文件的几行显示在屏幕上。光标也将定位在第一行：

    ```

    1  ...

    2  ...

    ```

    你在此示例中看到的最后一行显示了路径，以及文件中的行数和字符数。你还会注意到文件是只读的。这意味着你正在作为普通用户查看文件。你可能还会注意到，由于行数没有占据屏幕的其余部分，未使用的行用波浪线（`~`）符号标记。当前行由正在编辑的字符上方的黑色矩形标记。


    `vi` 编辑器允许你进入以下模式：


    - **可视命令模式 (Visual command)** – 这是默认模式，你输入的每个键都会被 Linux 视为应用于当前行的命令。所有的 `vi` 命令与
    `ed` 命令相同。

    - **冒号命令模式 (Colon command)** – 此模式用于写入或读取文件、设置 `vi` 选项以及退出 `vi`。正如名称所示，此模式下的所有命令都冒号开头。当你输入冒号符号
    `:` 时，编辑器会将光标移动到最后一行并提示输入命令。按下回车键后编辑器将应用该命令。

    - **文本输入模式 (Text input)** – 当你想向文件中输入文本时需要使用的模式。当你使用以下命令时，可以进入此模式：


    '
- fmt: '

    Once you are done typing in your text, press `Esc` to exit this mode and return
    to visual command. Tip: It may be a bit difficult to tell what command mode you
    are in when you are using the `vi` editor. There may be circumstances that you
    have typed a long line of text only to realize that you are not in the text input
    mode, which can be a little frustrating. If you want to see to it that you are
    in command mode, press `Esc` a couple of times. It is also helpful to know that
    you can make use of the arrow keys and some keyboard to move the cursor and the
    screen around. Try these commands out: Image from: Linux All-in-One for Dummies.


    You can also jump to a specific line using the colon command. For example, if
    you want to switch immediately to line 6, just type `6` after the colon and then
    hit Enter: Keep in mind that when you enter the colon symbol, the `vi` editor
    will display it at the last line of the screen. After doing so, `vi` will consider
    any text that you enter as a command.


    To search for a particular string, key in the `/` symbol and then hit Enter. The
    `/` symbol will appear at the last line, which prompts you to enter the string
    that you want to search for. Once it is found, `vi` will position the cursor at
    the beginning of the matching entry in a line of the text. For example, if you
    want to search for the string “cdrom” in the `/etc/fstab` file, key in: `/etc/fstab`.


    If you wish to delete the line where the cursor is placed, type the command `dd`.
    The editor will then delete that line and then change into the next line as the
    current line.


    If you wish to enter text at the cursor, type the command `i`. The editor will
    change its mode to become text input, which will then allow you to type in your
    desired text. Once you are done, hit `Esc`. The `vi` editor will revert to visual
    command afterward.


    Once you are done modifying the file, you can save changes that you have made
    by entering the `:w` command. To save the file and exit the editor, enter the
    `:wq` command. Alternatively, you can also perform save and exit at the same time
    by holding down the `Shift` key and then hitting `Z` twice.


    To exit the editor without saving, enter the `:q!` command. Here are other commands
    that are commonly used by the `vi` editor: Image from: Linux All-in-One for Dummies.


    ## CHAPTER 13. Exercises


    As we have already learned above, the creation of a directory is pretty easy.
    In the same manner, removing or deleting a directory from the Linux system is
    also very simple. One thing that you have to bear in mind, however, once you remove
    or delete a directory from the Linux system, there is no way to undo that task.
    Therefore, the best thing is whenever you are running any command on Linux; the
    first thing is to be careful with what you do. If it means double checking the
    command before running it, the better.


    The command we are going to use to remove or delete a directory is `rmdir` which
    stands for remove directory. The things that you have to take note of here is
    that `rmdir` command supports the `-p` and `-v` options in the same manner as
    `mkdir` command. Additionally, the directory has to be empty before it is removed.
    We will learn how to get around this later.


    1. `rmdir linux_tutorial/beginner/commands`

    2. `ls linux_tutorial/beginner`


    ### How to create a blank file


    Many commands that are involved in data manipulation within a file have a superb
    feature that they will create a file automatically when we refer to it, and we
    find that it does not exist. As a matter of fact, we can manipulate this feature
    to create a blank file using the `touch` command. In other words, you type the
    command `touch` followed by the command line option and the file name.


    1. `pwd`

    2. `/home/Gary/linux_tutorial`

    3. `ls`

    4. `beginner`

    5. `touch practice_exercise1`

    6. `ls practice_exercise1 commands`


    ### Copying a file or a directory


    Let us consider the following example:


    1. `user@bash: ls`

    2. `practice_exercise1 commands`

    3. `cp practice_exercise1 Exercise1`

    4. `ls`

    5. `practice_exercise1 Exercise1 commands`


    An important thing that we have to note in this case is the source and the destination
    point at the paths. Some examples that we can consider here include:


    * `cp /home/Gary/linux_tutorial/Exercise1 Exercise2`

    * `cp Exercise2 ../../backups`

    * `cp Exercise2 ../../backups/Exercise3`


    When you use the `cp` command, the destination of the file can represent a path
    to a file or a directory. If the destination is to a file such as `Exercise1`,
    `2` and `3`, then this will create a copy of the files in the destination file,
    but the original remains in the source file or directory. If we copy the files
    into a directory, the files will maintain the names in the destination directory.
    In the default behavior of the `cp` command, it will only copy a file. The term
    recursive in this case means that you would wish to copy the directory and all
    the contents of that very directory which could include files, directories, and
    subdirectories among others.


    Let us consider the following example:


    1. `user@bash: ls`

    2. `Gary Practicals transfers`

    3. `user@bash: cp Practicals Practicals_beginner`

    4. `cp: omitting directory ‘Practicals.’`

    5. `user@bash: cp -r Practicals Practicals_beginner`

    6. `user@bash: ls`

    7. `Gary Practicals transfers Practicals_beginner`

