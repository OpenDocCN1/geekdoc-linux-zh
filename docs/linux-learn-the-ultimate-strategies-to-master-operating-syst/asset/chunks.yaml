    # Linux Packages Overview


    1. `Binutils` - is comprised of different packages for handling binary files.
    Accompanying packages include `ar`, `as`, `gasp`, `id`, `nm`, `objcopy`, `objdump`,
    `ranlib`, `readlf`, `size`, and `strip`.

    2. `Bash` – is the GNU package responsible for interpreting shell commands in
    Linux.

    3. `Automake` – is the GNU software for generating a `makefile.in` files that
    are used with `Autoconf`.

    4. `Autoconf` – is the package for generating shell scripts that are used for
    configuring source-code packages.

    5. `Emacs` – is the text editor package for Linux.

    6. `Ed` – is the line-oriented text editor.

    7. `Diff` – is the package used to compare files and show the difference line
    by line.

    8. `GNU Chess` – is the package for running the Linux chess game.

    9. `The GIMP` – is a GNU program for manipulating images. It’s like photoshop
    for Linux.

    10. `GNOME` – provides the display or GUI for Linux Distributions.

    11. `Gnumeric` – is a spreadsheet GNU program that works on GNOME GUIs. It’s an
    equivalent of MS. Excel.

    12. `Time` – is a GNU program that manages time for the user.


    # Installation and Setting up Linux System


    In this chapter, we will learn the necessary steps for installing and setting
    up Linux. The beauty of Linux OS is that it usually comes with pre-installed basic
    programs. Here we will understand the installation steps, minimum requirements
    for installation and configurations settings, and needs for different distributions.


    ## About installing Linux OS


    Most computers usually come pre-installed with either `Windows` or `MS. DOS` system.
    Although recently, some computer manufacturers sell PCs with Linux pre-installed.
    If your PC is not pre-installed with Linux, you will have to install it yourself.
    The first step is to choose the flavor/distribution that you would wish to install.
    You can choose to either install the Linux distribution or run it directly from
    a `Live CD`. A `Live CD` allows you to boot the Linux system directly from the
    disc without necessarily installing. This feature makes Linux into a portable
    Operating system.


    Alternatively, you can choose to add Linux OS as a virtual OS within `Windows`.
    To do this, you will need to install a `virtual box` first. Once the `VirtualBox`
    is installed in `Windows`, you can install Linux in the virtual environment. Thus
    you will have to partition your hard drive to accommodate the two operating systems.
    Partitioning of the hard drive is not necessary if you opt to use `Live CDs`.


    ## Steps to Follow to Install Linux OS


    Installing Linux OS is not rocket science. A series of easy to follow steps are
    all you need to know to install Linux. In this chapter, we will go through the
    necessary steps that apply to most distributions. We will later go through steps
    for installing and setting up the Linux Mint distribution. We will, first of all,
    go through the general installation requirements and procedures.


    Before installing some Linux distribution, you may be required to at least know
    your system’s requirements, like the hardware and other components. Below are
    the simple steps for installation of any Linux distribution:


    1. The first step in the installation of a Linux Distribution is downloading the
    distro from the web. All you need to do is to download the software and burn it
    on a `CD`. You can also copy the installation files onto a `USB stick` and install
    from it.

    2. It’s essential to confirm that your PC is set to boot from `CD` or `USB stick`.
    Some PCs will require the settings changed in the `BIOS` before booting. On most
    PCs, on the booting screen, you press `F2` or `F8` (depending on `BIOS` version)
    to go to boot settings. While in the settings, change the boot priority to start
    with the `CD` or `USB stick` (where your Linux OS resides).

    3. If you plan to run from the `Live CD`, all you need now to do is to restart
    your system. But if you plan to install, the third step will be to create some
    space (partition) on the hard drive, where Linux installed.

    4. If you want to create a partition on your disk, it’s safe to use a partitioning
    program like `partition magic`. Download the `partition magic` software from [www.powerquest.com](http://www.powerquest.com).

    5. Once you have the partition prepared, you can now boot your system to start
    the Linux installation.

    6. The particular steps may vary from one distribution to another. The `GUI` will
    guide the user through the installation process.

    7. You will be required to set the timezone, network settings, and the installer
    will automatically complete the remaining steps. Linux will install all the default
    programs necessary for running the system.

    8. After the installation is complete, reboot your PC. You will be prompted to
    make configuration settings after that. You can as well install additional packages.


    # Linux System Requirements for Major Distributions


    As mentioned earlier, it’s important to know your system’s attributes before installing
    a Linux distribution. Many Linux distributions have varying minimum requirements
    for installation. Consider this as the pre-installation requirements for Linux
    OS. We will discuss some of the minimum system requirements for installation of
    Linux:


    * Most Linux system requires a `CD/DVD` drive to install. Although you can also
    use a `USB stick` to install or/and run the Linux OS. Most PCs come fixed with
    internal `IDE` or `ATA DVD` drives. You can as well use an external `DVD` drive
    connected via `USB`.

    * The next thing to check before installing Linux is the hard drive. Linux works
    with almost all `IDE` hard disks. Some PCs have `SCSI` (Small Computer System
    Interface) hard disks. Linux can equally work well with `SCSI` drives. Most distributions
    require a minimum of at least `5GB` of hard drive space to install. Remember,
    if you run the `Live CD`; you don’t need hard disk space.

    * Ensure you also have a compatible keyboard, although most keyboards work effectively
    on Linux. Most `USB keyboards keyboards are plug and play, thus reducing the complexity
    of setting up keyboards.

    * If you plan to access the internet using your Linux system, you need a modem
    that is compatible with Linux. Check the manufacturer manual for compatibility
    with `Unix` based system. Most manufacturers nowadays usually indicate this on
    the user manual with steps to follow in case setting up is needed.

    * Your display option is important too, although not sensitive since most basic
    monitors can work with many of the latest resolutions. All you need to confirm
    is that the monitor can work well with the available graphics cards installed
    in your system.

    * The type of mouse you use is equally important. Most Linux distributions work
    with both `PS/2` and `USB mouse`.

    * If your PC uses a `PC card` to connect to the internet or local area network,
    it’s important to check compatibility with Linux. During installation, Linux will
    check the compatibility of your card.

    * Another essential pre-installation requirement for Linux is the `Processor`.
    Most Linux distribution requires processors of at least `400MHz` (`Pentium II`).
    Although the latest distros require multi-thread processors, it’s crucial to ensure
    you choose a distro that can run effectively on your system.

    * Your `RAM` (Random Access Memory) is a critical component. This is the memory
    available for your system processes. The more, the better, although for effective
    running, you will require at least `256MB` and above of `RAM`. To comfortably
    run a `GUI desktop`, because of the graphics, it’s important to have sufficient
    memory.

    * Something else you need to confirm is the sound card. Linux will work with most
    sound cards to play media. See the manufacturer manual for necessary settings
    after installing Linux. Some audio card manufacturers will share Linux specif
    drivers for their sound cards.

    * Check your graphic cards for compatibility. If you install `GUI Linux`, you
    will need a graphic card that can work with the `X window system`. Linux can detect
    and indicate whether a graphics card is compatible with the Linux system.

