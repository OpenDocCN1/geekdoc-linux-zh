    are famous and can be used for a lot of attacks and finding out the packets. First
    of all, we will go through the information gathering process where we will scan
    open ports with the help of a famous reconnaissance tool called Nmap.Information
    GatheringInformation gathering is an important pre-attack phase where the hackers
    collect a lot of information that is available in public about the target he is
    going to attack. Many hackers use social engineering techniques to get a solid
    bunch of information about the target and the technology it is using along with
    the operating system and version it uses. Every hacker uses a different set of
    methodologies to create good information about the host before targeting. There
    are three important phases in information gathering as explained below1) Gathering
    information from search engines Use search engines like Google to get good information
