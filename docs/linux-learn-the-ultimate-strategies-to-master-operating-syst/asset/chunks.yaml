    -z -v -n 192.232.2.3 21-252)  Using Netcat to start a chat server Imagine yourself
    in a restricted location like in workspace where you can''t use messaging services.
    netcat can solve you that problem by creating a chat server that can be used to
    converse with other systems in the Network. You can then create a server that
