    # Linux 软件包概述


    1. `Binutils` - 由处理二进制文件的不同软件包组成。相关软件包包括 `ar`、`as`、`gasp`、`id`、`nm`、`objcopy`、`objdump`、`ranlib`、`readlf`、`size`
    和 `strip`。

    2. `Bash` – 负责解释 Linux 中 shell 命令的 GNU 软件包。

    3. `Automake` – 用于生成 `makefile.in` 文件的 GNU 软件，配合 `Autoconf`。

    4. `Autoconf` – 用于生成配置源码包 shell 脚本的软件包。

    5. `Emacs` – 用于 Linux 的文本编辑器软件包。

    6. `Ed` – 一种行行的文本编辑器。

    7. `Diff` – 用于比较文件并逐行显示差异的软件包。

    8. `GNU Chess` – 用于运行 Linux 国际象棋游戏的软件包。

    9. `The GIMP` – 用于处理图像的 GNU 程序。它就像是 Linux 版的 Photoshop。

    10. `GNOME` – 为 Linux 发行版提供显示或图形用户界面（GUI）。

    11. `Gnumeric` – 一个在 GNOME GUI 上运行的 GNU 电子表格程序。它是 MS Excel 的对等软件。

    12. `Time` – 一个为用户管理时间的 GNU 程序。


    # 安装和设置 Linux 系统


    在本章中，我们将学习安装和设置 Linux 的必要步骤。Linux 操作系统的优美之处在于，它通常带有预装的基础型程序。在这里，我们将了解安装步骤、安装的最低要求和配置设置，以及不同发行版的需求。


    ## 关于安装 Linux 操作系统


    大多数计算机通常都预装了 `Windows` 或 `MS. DOS` 系统。尽管最近，一些电脑制造商开始销售预装了 Linux 的 PC。如果你的 PC 没有预装
    Linux，你将必须手动安装。第一步是选择你想要安装的变体/发行版。你可以选择安装 Linux 发行版，也可以直接从 `Live CD` 运行它。`Live
    CD` 允许你直接从光盘启动 Linux 系统，而无需进行安装。这一特性使 Linux 变成了一个便携的操作系统。


    或者，你可以选择将 Linux OS 作为虚拟操作系统添加到 `Windows` 中。要做到这一点，你需要先安装 `virtual box`。一旦在 `Windows`
    中安装了 `VirtualBox`，你就可以在虚拟环境中安装 Linux。因此，你必须对硬盘进行分区以容纳两个操作系统。如果你选择使用 `Live CDs`，则不需要对硬盘进行分区。


    ## 安装 Linux 操作系统的遵循步骤


    安装 Linux 操作系统并不是火箭科学。你只需要知道一系列易于操作的步骤即可安装 Linux。在本章中，我们将介绍大多数发行版的必要步骤。稍后我们将介绍安装和设置
    Linux Mint 发行版的步骤。首先，我们将介绍通用的安装要求和流程。


    在安装某些 Linux 发行版之前，你可能至少需要了解系统要求，例如硬件和其他组件。以下是安装任何 Linux 发行版的简单步骤：


    1. 安装 Linux 发行版的第一步是从网上下载发行版。你只需要下载软件并将其刻录到 `CD` 上。你也可以将安装文件拷贝到 `USB stick` 上并从中安装。

    2. 确认你的 PC 设置为从 `CD` 或 `USB stick` 启动至关重要。某些 PC 需要在启动前更改 `BIOS` 中的设置。在大多数 PC 上，在启动界面上，你按下
    `F2` 或 `F8`（取决于 `BIOS` 版本）进入启动设置。在设置中，将启动优先级更改为从 `CD` 或 `USB stick`（即你的 Linux
    OS 所在位置）启动。

    3. 如果你计划从 `Live CD` 运行，现在需要做的只是重启系统。但如果你计划安装，第三步是在硬盘上创建一些空间（分区），用于安装 Linux。

    4. 如果你想在磁盘上创建分区，使用如 `partition magic` 这样的分区程序是安全的。可以从 [www.powerquest.com](http://www.powerquest.com)
    下载 `partition magic` 软件。

    5. 一旦准备好分区，你现在就可以启动系统开始安装 Linux 了。

    6. 具体步骤可能会根据发行版的不同而异。`GUI` 将引导用户完成安装过程。

    7. 你将被要求设置时区、网络设置，安装程序将自动完成剩余步骤。Linux 将安装运行系统所需的所有默认程序。

    8. 安装完成后，重启你的 PC。之后你将收到进行配置设置的提示。你也可以还可以安装额外的软件包。


    # 主要发行版的 Linux 系统要求


    如之前提到的，在安装 Linux 发行版之前，了解系统的属性非常重要。许多 Linux 发行版对安装有不同的最低要求。请将此视为 Linux 操作系统的安装前准备要求。我们将讨论安装
    Linux 的一些最低系统要求：


    * 大多数 Linux 系统需要 `CD/DVD` 驱动器进行安装。尽管你也可以使用 `USB stick` 安装和/或运行 Linux OS。大多数 PC
    固定带有内部 `IDE` 或 `ATA DVD` 驱动器。你也可以使用通过 `USB` 连接的外部 `DVD` 驱动器。

    * 安装 Linux 之前需要检查的是硬盘。Linux 几乎适用于所有的 `IDE` 硬盘。某些 PC 拥有 `SCSI`（小型系统接口）硬盘。Linux
    同样可以很好地支持 `SCSI` 设备。大多数发行版至少需要 `5GB` 的硬盘空间进行安装。记住，如果你运行 `Live CD`；则不需要硬盘空间。

    * 确保你拥有一个兼容的键盘，虽然大多数键盘在 Linux 上都能良好工作。大多数 `USB keyboards`（USB 键盘）是即插即用的，从而减少了设置键盘的复杂性。

    * 如果你计划使用 Linux 系统访问互联网，你需要一个兼容 Linux 的调制解调器。检查制造商手册确认是否与 `Unix` 系统兼容。现在的制造商通常会在用户手册中说明在需要设置时遵循的步骤。

    * 你的显示选项也很重要，尽管并不敏感，因为大多数基础显示器都可以支持许多分辨率。你只需要确认显示器能够与系统中安装的显卡良好工作即可。

    * 你使用的鼠标类型同样重要。大多数 Linux 发行版同时支持 `PS/2` 和 `USB mouse`。

    * 如果你的 PC 使用 `PC card` 连接互联网或局域网，检查其与 Linux 的兼容性非常重要。在安装期间，Linux 将检查卡的兼容性。

    * Linux 的另一个基本安装前要求是处理器（Processor）。大多数 Linux 发行版要求至少 `400MHz` (`Pentium II`）。虽然最新的发行版需要多线程处理器，但确保你选择一个可以在系统中有效运行的发行版是关重要的。

    * 你的 `RAM`（随机存储器）是一个关键组件。这是系统进程可用的内存。越多越好，但为了有效运行，你将至少需要 `256MB` 及以上的 `RAM`。为了舒适地运行
    `GUI desktop`，由于图形的原因，拥有足够的内存非常重要。

    * 你需要确认的另一件事是声卡。Linux 将支持大多数声卡以播放媒体。安装 Linux 后，请查看制造商手册进行必要设置。一些音频卡制造商会共享其声卡的
    Linux 特定驱动程序。

    * 检查你的显卡的兼容性。如果你安装 `GUI Linux`，你需要一张可以与 `X window system` old 的显卡。Linux 可以检测并指示显卡是否与
    Linux 系统兼容。


