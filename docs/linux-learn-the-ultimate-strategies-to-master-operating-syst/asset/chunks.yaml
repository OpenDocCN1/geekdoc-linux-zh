  raw: '*   There is exactly one primary group for every user 


    *   The primary group of local users is defined by the fourth field in the /etc/passwd
    file where the group number GID is listed 


    *   New files created by the user are owned by the primary group 


    *   The primary group of a user by default has the same name as that of the user.
    This is a User Private Group (UPG) and the user is the only member of this group 


    Supplementary Group:


    *   A user can be a member of zero or more supplementary groups 


    *   The primary group of local users is defined by the last field in the /etc/group
    file. For local groups, the membership of the user is identified by a comma separated
    list of user, which is located in the last field of the group’s entry in /etc/group


    *   groupname: password: GID:list, of, users, in, this, group 


    *   The concept of supplementary groups is in place so that users can be part
    of more group and in turn have to resources and services that belong to other
    groups in the system 


    Getting Superuser AccessIn this section, we will learn about what the root user
    is and how you can be the root or superuser and gain full access over the system. The
    root userThere is one user in every operating system that is known as the superuser
    and has all access and rights on that system. In a Windows-based operating system,
    you may have heard about the superuser known as the administrator. In Linux based
    operating systems, this superuser is known as the root user. The root user has
    the power to override any normal privileges on the file system and is generally
    used to administer and manage the system. If you want to perform tasks such as
    installing new software or removing existing software, and other tasks such as
    manage files and directories in the system, a user will have to escalate privileges
    to the root user.  Most devices on an operating system can be controlled only
    by the root user, but there are a few exceptions. A normal user gets to control
    removable devices such as a USB drive. A non-root user can, therefore, manage
    and remove files on a removable device but if you want to make modifications to
    a fixed hard drive, that would only be possible for a root user.  But as we have
    heard, with great power comes great responsibility. Given the unlimited powers
    that the root user has, those powers can be used to damage the system as well.
    A root user can delete files and directories, remove or modify user accounts,
    create backdoors in the system, etc. Someone else can gain full control over the
    system if the root user account gets compromised. Therefore, it is always advisable
    that you login as a normal user and escalate privileges to the root user only
    when absolutely required.  It is a practice in Linux to login as a regular user
    and then uses tools to gain certain privileges of the root account.  Using Su
    to Switch Users You can switch to a different user account in Linux using the
    su command. If you do not pass a username as an argument to the su command, it
    is implied that you want to switch to the root user account. If you are invoking
    the command as a regular user, you will be prompted to enter the password of the
    account that you want to switch to. However, if you invoke the command as a root
