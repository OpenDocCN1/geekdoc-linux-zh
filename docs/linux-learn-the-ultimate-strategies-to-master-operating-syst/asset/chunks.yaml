  raw: 'Bear in mind that any files or directories that are within the Practicals
    directory will be copied into the Practicals_beginner directory. CHAPTER 14\.
    Building ScriptsIn this chapter you will learnWriting Shell scriptsCommand aliases
    and substitutionsPipesFiles, Descriptors and exit statusStructured commands (if,
    for, while, until, break, continue).In this chapter, you are going to gain a comprehensive
    understanding of script building with examples. The key to script building is
    your familiarity with commands. Scripting is highly advantageous, as it can process
    more than one command, process the results, and feed one result to the other building
    a chain.You already know how to execute multiple commands using ‘;’. For instance,
    pwd; cd ..; is a combination. What is it? It is a basic shell script!Writing Shell
    ScriptsTo write a shell script you simply need some understanding of Linux commands
    and a text editor. On Ubuntu, the default editor can be used (gedit). Let’s examine
    the components. A shell script starts with a comment at the top. #!/bin/shell_typeFor
    instance, #!/bin/bashThis is a comment as it starts with the ‘#’. These lines
    are not interpreted by the shell! To comment, ‘#’ should be used. However, this
    specific line tells the shell what shell to use to execute this script on. We
    call #! Shebang.The next part will be a set of commands with explanations. If
    you are familiar with programming, shell scripting is similar.If we create a script
    with the following example, #!/bin/bashwho#who command displays the account you
    are currently logged into and at what #time the user logged into the system.pwdit
    should work as expected.Image: who commands in a script![00219.jpeg](image_rsrc20Y.jpg)You
    could also use the absolute or relative path.The next thing you need to do is
    the changing of permissions. Why? Let’s create a file and examine the permissions.![00220.jpeg](image_rsrc20Z.jpg)According
    to the result, there are insufficient permissions to execute this file. The system
    treats itself as a script, but it hasn’t modified the permissions. It is up to
    the user.To provide execution permissions, chmod command can be used.chmod u+x
    Myscript![00221.jpeg](image_rsrc210.jpg)Once this step is complete, the script
    is ready to be executed.![00222.jpeg](image_rsrc211.jpg)If you want to display
    text guides, the output of environment variables and such, you can use the echo
    command. We have learned environment variables in a previous lesson.Command AliasesUsing
    a command alias can save a lot of time. To define an alias, you have to do a simple
    assignment.Syntax: alias=command(s)Examples:-       alias L=”ls -al”-       alias
    search=grepCommand SubstitutionIt is also possible to use an output of a command
    as an input to a variable. This is a great feature to continue the script and
    execute it with dynamic data.To achieve this, you must use $().Example: user_name=$(USERNAME)Example
    Script:#!/bin/bashuser_name=$(who)echo “Your username is :” $user_name![00223.jpeg](image_rsrc212.jpg)Creating
    FilesAnother great feature is that you can output the results. You can even name
    the file according to your needs. This is explained in the next example.#!/bin/bashmydate=$(date
    +%Y%m%d)echo “Today is :” $mydatewho > log.$mydatels -l log.$mydate![00224.jpeg](image_rsrc213.jpg)Here,
    we create a date and format it. %Y is the year in YYYY format. The month is in
    numeric format (e.g., 09) and the date is in a numeric format as well. The output
    is similar to YYYYMMDD. The output is taken into a variable. Then we echo the
    variable. Finally, we use the who command and redirect it’s input to a new file
    using the redirect operator >. The file name is created as the “log”.YYYYMMDD.
    This is how we create logs to keep records. If the script runs on the next day,
    the filename will be log.20190925.Redirection is an extremely useful feature.
    Instead of using commands like touch, you can redirect the output to a file. Yet,
    you can even create files from scripts by using the touch command. For instance,#!/bin/bashmydate=$(date
    +%Y%m%d)echo “Today is :” $mydatetouch log.$mydate#Creates a file and name the
    first part .lo and later using #our variablewho >> log.$mydate#Append the output
    of ‘who’ command to the file.![00225.jpeg](image_rsrc214.jpg)![00226.jpeg](image_rsrc215.jpg)You
    can also do reverse the process we performed using the ‘>’ operator. This is known
    as input redirection. For instance, we could get an entry of a file to a new variable
    or a command directly. The following example explains this in detail.#!/bin/bashwc
    < log.20190924# wc is a new command to you. It counts the number of lines, words
    and #characters.![00227.jpeg](image_rsrc216.jpg)Finally, we will look into the
    ‘<<’ operator. This is known as the inline input operator.Example: wc << lastLine![00228.jpeg](image_rsrc217.jpg)As
    you notice, until the lastLine was entered as text input, it captured the user
    input. Other examples:Redirecting error and standard output to the same file.
    You could use the following command.Example: ls Test Test2 Test3> dirlist 2>&1Here,
    we are trying to list the properties of the Test directory. Remember, ls command
    supports multiple file or directory names. It then lists each file’s or directory’s
    properties. Test and Test2 directories are on my desktop. Test3 directory does
    not exist. I am redirecting the output of this command as well as the error into
    a new file called dirlist.![00229.jpeg](image_rsrc218.jpg)Standard File DescriptorsWe
    are revisiting the file descriptors again.Standard Input - 0: STDINStandard Output
    – 1: STDOUTStandard Error - 2: STDERRThe first is standard input, the next are
    standard output and standard error. The numerical values are file descriptors.In
    addition to these techniques, pipes are extensively used in scripts.PipesPiping
    is useful when an output of a command is required as an input of another. This
    is something we have learned so far. The operator used is ‘|’.Example:#!/bin/bashcat
    employee.txt | sort -nr -k 2#Here we redirect the file entry we obtain to the
    sort function. It sorts by numeric #values, in reverse order and sort by column
    id (2nd column).![00230.jpeg](image_rsrc219.jpg)Mathematical Operations in Script
    BuildingAny script can be used to perform certain calculations. There are some
    built-in commands in Linux. We are looking into the command expr. This stands
    for the expression. These are the operators for expr command.![00231.jpeg](image_rsrc21A.jpg)Image:
    expr operators![00232.jpeg](image_rsrc21B.jpg)Examples:![00233.jpeg](image_rsrc21C.jpg)![00234.jpeg](image_rsrc21D.jpg)Rather
    than using the expr command, it is more convenient to use brackets.#!/bin/bashvar1=2var2=6var3=3var4=$(expr
    $var1 \* $var2)echo $var4var5=$[ ($var1 * $var2)/$var3]echo $var5![00235.jpeg](image_rsrc21E.jpg)The
    Bash CalculatorWhen you want to perform more complex mathematical functions, there
    is a built-in bash tool to perform this. It is the bash calculator. The command
    is bc.![00236.jpeg](image_rsrc21F.jpg)![00237.jpeg](image_rsrc21G.jpg)The bash
    calculator supports the following.-       Numerical values (integer and floating-point
    numbers).-       Variables.-       Expressions.-       Functions.-       Statements
    (i.e., if-then-else).-       Comments.![](image_rsrc21H.jpg)In the last line,
    you can see a problem. 8.45/5 = 1\. This is inaccurate unless it is rounded up.
    The problem here is the number of decimal places. It is handled by a built-in
    variable known as scale. To receive the intended output, we need to modify the
    scale.![00239.jpeg](image_rsrc21J.jpg)![00240.jpeg](image_rsrc21K.jpg)The bc command
    supports variables. The following example uses variables instead of numerical
    values.![](image_rsrc21M.jpg)The next important task is to get bc working in a
    script. In this case, we need to depend on pipes. #!/bin/bashvar1=10var2=2var3=$(echo
    "$var1 ^ $var2" | bc)echo "The answer is: "$var3![00242.jpeg](image_rsrc21N.jpg)Another
    example using the scale option.#!/bin/bashvar1=10var2=3var3=$(echo " scale=3;
    $var1 / $var2" | bc)echo "The answer is: "$var3![00243.jpeg](image_rsrc21P.jpg)The
    next example will be looking into how the inline input operator can be used with
    the bc command in a script.#!/bin/bashvar1=8var2=1.75var3=3varF=$(bc << EOF #
    EOF stands for End of Filescale = 4v1 = ( $var1 * $var2)v2 = ($var1 /  $var3)v1
    + v2EOF)echo The final calculation is: $varF![00244.jpeg](image_rsrc21R.jpg)CHAPTER
    15\. Securing Your Linux ServerIf you don''t incorporate security considerations
    into every step of your planning and every layer of your actual deployment, then
    you can be fairly confident that someday something is going to happen. In this
    chapter you are going to learn about permissions, metadata associated with all
    Linux filesystem objects that control who gets to do what. First I will be talking
    about hardening your server by regularly applying software updates and patches,
    and by ensuring that there aren''t any network ports sitting open and unprotected.
    Next, we will discuss protecting your data at rest and in transit by encrypting
    your disks, websites, and email servers. But it will be nice to see those permissions
    and attributes in action. While I explain how to do that, you''ll also learn just
    how Linux permissions actually work. Every object in a Linux filesystem, whether
    it''s a file or a directory, has unique metadata associated with it. This metadata
    is represented by characters displayed when you run “ls” with the “-l” argument
    where “l” stands for the long version. If you check out “cd” to the secret directory
    and then type “su bob”. The command “su” stands for switch user. And this means
    you would be logged on as Bob. You can use “touch” to have Bob create a new file
    called “data.txt”. If Bob wasn''t a member of the “secret group” group and if
    the secret directory wasn''t owned by “secret group”, then this would be impossible.
    You can prove that by having Bob try to create a file called stuff in the “/var/log”
    directory, which is owned by “root”. It will not work. That''s why it can be so
    useful to associate groups with particular assets, like directories. It''s not
    just about Bob. You could add any number of users to this group and they''d all
    have the ability to create and edit files in any directories belonging to the
    group. Let''s find out how it works. You can run “ls –l” within your “/var/secret”
    directory to display the file attributes of the contents. You can run “ls” with
    the “d” argument, which will list the attributes, not of the contents, but of
    the secret directory itself. If you look at what those two commands give you;
    first, the file “data.txt”. The 10 characters at the beginning of that line are
    really made up of 4 groups. The first dash would, if this directory was a directory,
    be a “d”. If you jump down a couple of lines, you should see that the first character
    of the directory secret attributes is, in fact, a “d”. The next three characters,
    “r”, “w”, and “dash”, represent the ways that the object''s owner can use the
    file. In this case, the “r” tells that the owner can read the file contents, the
    “w” means to write or edit, which includes delete, and the “dash” is in place
    of an “x”, which would mean that Bob can, if appropriate, execute the file. In
    this case, the “dash” means that the owner does not have to execute rights. The
    next three characters represent the permissions of members in the owning group;
    Bob''s group, in this case. All group members will have both read and write authority,
    but not execute. The final cluster of three characters represents the rights of
    all other “non-root” users. They can read, but not write or execute. The next
    field tells you that the file owner is Bob, and its group is Bob. Even though
    the directory is owned by root, the file is Bob''s because he''s the one who created
    it. Now let''s look at the directory''s attributes. Already mentioned the “d”
    for directory, but you should also see how both the owner and group have full
    rights, read, write, and execute. Others will be able to read and execute, but
    not write. Why is the directory owned by root? Because it was created using “sudo”,
    which is effectively acting as “root”. The “change own operation” you should have
    run a while back changed only the group, but not the owner. To do that, you should
    have included some value, like your own username before the colon, and then “secret-group”
    after the colon to set the group. You can change an object''s attributes using
    “change mod”. It wouldn''t hurt you to try a few more of these to make sure the
    process is perfectly clear. Add execute powers over “data.txt” for others. You
    can use “o” for others, the plus sign to say that you are adding power, and “x”
    to indicate executable. There are two points that should be emphasized here. The
    first is that since you are currently logged in as Bob, who is the owner of “data.txt”,
    you didn''t need to use “sudo” for this operation. The second point is that this
    operation would be pointless. Unless Bob happens to turn the file into a script,
    as you''ll never need to execute a simple data file. I can''t move on without
    telling you about a different way of representing object attributes using numeric
    notation. You will remember that there are three kinds of permissions, read, write,
    and execute. Well, if you use the number 4 to represent read, 2 for write, and
    1 for execution; based on this, by adding together the value of those 3 permissions,
    7 would indicate the highest permissions level possible for plus 2 plus 1 equals
    7. Someone with reading and execute powers, but not write, will be worth 5, while
    someone with only executes powers would be 1\. So how would you describe the current
    values of “data.txt” where the user and group both have read and write while others
    have read and execute? That would be 6, 6, 5\. The secret directory, on the other
    hand, would be 7, 7, 5\. Work that out for yourself. You can use this notation
    with “change mod”, applying 7, 7, 7 to “data.txt”, for instance would add execute
    powers to the user and group and write to others. This is one of those things
    that will become like second nature to you after you''ve done it a bunch of times
    in the real world, but right now, it''s probably kind of hard to absorb. The solution
    is to practice as much as possible!CHAPTER 16\. GNU UtilitiesIn this chapter,
    we will cover the general components of the Linux operating system. We will delve
    into the critical elements that work together to make Linux the most versatile
    operating system. You will understand the difference between the GNU project and
    the GPL. All Linux distributions come with software developed under the GNU project.
    When you use the distro in text terminal mode, you will be able to see the GNU
    utilities. What is GNU?GNU (GNU’s Not Unix) is a free operating system of GNU
    packages that were released under the GNU project and other third parties free
    software. Linux has become the most preferred operating system recently because
    it comes with all the software installed. Linux distributions come with graphics
    software, office packages, and even coding packages under the GNU GPL license. In
    1984, Richard Stallman started the GNU project, which was intended to be a UNIX
    based Operating system. GNU utilities are a collection of GNU software that contains
    tools like Is, Cat, and rm, which are mostly implemented in Unix Operating systems. rm
    – is a command used to remove objects like computer files, directories, and links
    from file systems. cat – is a Unix utility that reads files in sequence and writes
    them as standard output. Name derived from its functionality; to concatenate. ls
    – is the command used to list files in Unix System and all UNIX based systems. The
    GNU General Public License (GPL) for Linux, ensures that the software is always
    free and open to anyone. No single person or/and a company can claim ownership
    or control its use. Additionally, any user can copy, edit, and re-distribute the
    software’s source code. You may ask yourself, then who funds the GNU project?
    How do they raise funds? The Free Software Foundation funds the project (FSF),
    a tax-exempted charity organization. To support the project, log on to [www.gnu.org](http://www.gnu.org)
    for details. The GNOME GUI and the bash are both programs made under the GNU project.
    The Shell is the GNU program that executes your commands, most commonly referred
    to as the command interpreter. Linux distributions are developed using GNU C and
    C++ compiler. Text files in Linux are edited using the ed and emacs editors. Example
    of GNU UtilitiesOther popular GNU utilities include: '
