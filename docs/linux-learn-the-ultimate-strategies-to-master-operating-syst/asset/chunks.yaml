    # 为桌面创建多个工作区


    你也可以使用工作区来真正最大化利用你的 Ubuntu 桌面，充分发挥它的作用，并为了乐趣或享受进行多任务处理。某些版本不会突出显示这些选项，但它们可以在不同的发行版中以不同的方式启用。你应该检查你的发行版，并在网上搜索如何激活你对应版本的工作区。这通常只需要点击几次。


    以 Ubuntu 的版本为例，在每个环境中，你可能需要点击“启用或管理工作区”、“添加小组件”或“添加分页器小部件”来使用这些功能。很快，你将拥有多个工作区，这有助于组织和分离你的活动；假设你任何时候都有超过一个工作区，这将非常有用。你应该尝试激活并测试它们。


    ![00017.jpeg](img/image_rsrc20V.jpg)


    # Ubuntu Linux 中的多个工作区


    ## CLI

    你可能应该学习一些可以在 `Prompts`（提示符）处使用的基础 `Commands`（命令），以防万一（没错，这已经被建议过几次了！！你会发现，如果进入“应用程序”（Applications），然后进入“附件”（Accessories），最后到达“终端”（Terminal），你就可以访问
    `CLI` 并看到一个提示符。这就是 `Commands` 发挥用场的地方。有些用户非常喜欢这种额外的方式来定制他们希望系统执行的操作、自动化任务或使用快捷键。


    此外，如果你在未来的某个时候转向服务器版本，你将已经对 `Commands` 有一些体会和知识，并且对系统文件的结构和位置有更好的理解。正如你稍后将读到的，Linux
    中的一切都是文件。例如，它们的结构与 Windows 不同。通过 `GUI`（图形用户界面），你将从一个角度看到这一点。当你使用 `CLI` 时，你将真正更好地理解文件树和目录如何与硬件和软件协作，形成所谓的你的操作系统系统。这也是
    Linux 爱好者获得自由感的地方，这种自由不仅来自于应用程序和其他系统资源的开源，还来自于真正让你的计算机主动为你工作的自由和灵活性。


    ## 在服务器版本中跳转

    然而，你需要在服务器版本上花费一些时间。它并不那么直观，在以这种方式探索 Linux 之前和期间，了解某些细节非常有用。如果你熟悉 `DOS`，那么只需要学习
    `Commands` 和代码了。如果你不熟悉，将面临一个相当长的学习曲线。


    首先，你将使用提供的信息登录到新的服务器版本。你只会看到一个带有 `Shell`（外壳）提示符的 `DOS` 屏幕。你不会像在桌面版本那样看到图形用户界面
    (`GUI`)。你现在需要使用 `commands` 才能在这个新的操作系统中的任何地方跳转。你应该设置一个非常安全的密码和 `root`（用户）名称。确保原样记录这些信息。在
    Linux 中，标点符号非常重要。不同的拼写意味着完全不同的结果。你会再次看到这个提醒。


    # 一切的根

    在 Linux 中，`Root` 这个词有几个含义。`Root User`（根用户）是计算机的管理员（用户名为 `root`），它是最低级别的用户，拥有全权限。


    `Root` 也是 Linux 中任何事物的最高层或核心。它也是安装位置，等同于 Windows 中的 `C:/Home`。从某种上说，它是文件的最高层。Linux
    中的一切要么是一个目录，要么目录内部的文件，而这一切都在 `Root` 目录下。


    命令 `sudo` 表示“Super User Do”（超级用户执行）。这意味着你，即 `Root User`（即管理员），拥有访问文件和程序的完全权限。在某些发行版中，你需要使用此命令作为某些
    `Commands` 的前缀。


    ![00018.jpeg](img/image_rsrc20W.jpg)

    www.ubuntuserverguide.com


    ## 获取你的命令


    和大多数事物一样，你可以在 Google 上进行一些简单的研究，以获取 Linux `Commands` 大目录。通过这些命令，你可以在 Linux 中导航到任何地方。然而，你不应该期望记住这个列表，你应该开始熟悉
    Linux 的语言。


    一些最重要和实用的 `Commands` 将让你进入、退出和在周围移动。为了强调和扩展之前的一个观点，你在 `Commands` 中使用的大小写很重要。`Commands`
    的拼写非常具体，所以请务必使用正确的大小写。空格和单词顺序也很重要。你可能无法到达任何地方，或者最终到达一个你并非打算去的地方。


    在 Linux 的 `Commands` 长列表和命令组合中，还有一些“内置”（builtin）命令。正如字面意思，`Builtin` 命令已经包含在 `Bash`
    shell 内部。当一个简单命令的首单词是 `builtin` 时，shell 直接执行该命令，而不需要另一个程序。


    正如之前所说，每个发行版都有其优势和挑战。需要注意的是，每个发行版的 `Commands` 可能相同也可能不同。考虑到 `Commands` 是导航此版本
    Linux 的唯一方式，这是关键。你绝对应该对你选择的发行版的兼容性和用法进行研究，现在还需要研究该特定发行版的特定 `Commands`。


    你会发现许多 `Commands` 有共同的根，你可以通过其他 `Commands`、关键字、文件或程序名称对某些命令进行构建。有几个初学者需要立即使用的
    `Commands`。跟着操作并尝试一下吧。


    # 需要时获取帮助


    这里有一些一开始就能知道的简单事情。这些可能是你的救生衣衣。“Man”页是手册（即说明）页。你也会像使用 `sudo` 命令一样，在另一个 `Command`
    前加上这个命令。使用 `man` 会打开一个包含你所需的一切屏幕。需要时尝试这些变体：


    - `man -k`: 搜索所有涉及术术的命令。你也可以使用 `apropos`。

    - `man`: 显示帮助信息。

    - `info`: 显示帮助信息（以不同的方式）。

    - `whatis`: 显示关于手册页的描述。

    - `whereis`: 告诉手册页的位置。


    要退出手册页，输入 `Q` (Quit) 退出。这是退出手册页的唯一方法。要退出大多数其他地方，只需输入 `Exit`。


    命令 `more` 和 `less` 也对于显示超出你当前屏幕的文件很有用。你可能需要阅读帮助页上比一个屏幕显示更多的信息。这对于系统的初学者来说尤为重要。只需在输入
    `Command` 后使用空格键向下滚动屏幕即可。要退出，输入 `q` 退出。


    移动

    你很快就会发现 Linux 中有很多目录，你应该熟悉它们。虽然在 Linux 中一切都是文件，但目录是一种特殊类型的文件。目录出现在列表中，并以树的形式关联。与使用
    GUI 的操作系统不同，你不会看到文件扩展名。因此，你需要知道如何导航、查找和更改它们。你应该在 Google 上搜索它们的列表，以便正确导航你的系统。


    与命令一样，目录的拼写和符号也很重要。另外注意，当你在字母和斜杠或其他单词的字母之间需要真正的空格时，空格键非常好用。它节省了时间和击键次数。错过这些小细节也可能导致你处于一个不需要或不想去的地方。它们还可能因错误消息而让你死胡同。在最坏的情况下，Linux
    中的错误可能会导致严重损害，例如删除文件。设置新文件名时，你应该使用下划线代替空格。这些小细节会产生影响。初学者应该熟悉的几个目录和功能是：


    '
