    - 目录 (d) – 一个包含文件列表的文件

    - 链接 (l) – 一个允许在文件树的多个部分显示特定文件的系统

    - 管道 (p) – 一个允许进程间通信的系统

    - 普通 (-) – 一个普通文件

    - 套接字 (s) – 提供进程间网络连接的特殊文件

    - 特殊 (c) – 用于输入和输出的机制


    # 分区的艺术


    Linux 分区始于断电威胁到大多数 Linux 用户的时期。曾几何几天，停机意味着会对系统造成严重损害。此外，分区的主要目的是实现更高的数据安全级别。硬盘的划分允许进行安全的分组和保护。由于成功的分区，你可以对更重要的数据组进行优先级排序。当硬盘的一部分受到损坏时，只有该部分磁盘受影响。存储在其他分区中的其余部分不受影响。


    ## Linux 系统中的两个主要分区：


    1. `Swap` – 指额外的内存或扩展

    2. `Data` – 指普通数据；指启动和运行系统所需的必要文件


    ### 推荐的分区：


    - 用于必要数据的分区

    - 用于服务器程序和配置数据的分区

    - 用于程序和应用程序的分区

    - 至少一个用于用户邮件、存档和数据库表的分区

    - 至少一个用于特定文件的分区

    - 至少一个用于虚拟内存的分区


    ### 常见分区：


    - 包含个人数据的分区

    - 存储临时文件的分区

    - 存储第三方数据的分区

    - 仅用于程序的分区


    # 目录：根目录与子目录


    在 Linux 中，有一个被称为根目录（The Root Directory）的目录。它作为主目录，正如程序员和系统管理员所称的，它是所有目录的目录。根目录产生了子目录。这些子目录根据其分配的任务管理文件。


    ### 子目录及其内容：


    - `/home` – 用户目录

    - `/boot` – 内核和启动文件；尝试消除不需要引导程序的文件

    - `/initrd` – 关于启动信息的数据

    - `/dev` – 包含所有 CPU 硬件外设备的引用

    - `/bin` – 常用的共享系统程序

    - `/etc` – 重要的系统配置数据

    - `/lib` – 库文件

    - `/lost+found` – 从故障中恢复的数据

    - `/opt` – 来自第三方源的文件

    - `/net` – 远程文件系统的标准挂载点

    - `/misc` – 杂数据

    - `/proc` – 关于系统资源的信息

    - `/mnt` – 外部文件系统的标准挂载点


    # Inode 的作用


    在 Linux 文件系统中，`inode` 代表一个文件。`inode` 是一种包含重要信息的序列号类型。它的主要作用围绕定义分区中的文件数量。在整个 Linux
    文件系统中，特别是具有多个分区的系统，存在具有相似 编号 的文件。为了避免复杂性，每个分区都分配了自己的 `inode`。此外，分配的 `inode` 提供了硬盘数据结构的描述。一旦硬盘初始化完成，可以在两个点接受数据存储：第一，在安装过程中允许数据存储；第二，在向现有系统添加存储空间时允许数据存储。


    ### Inode 中包含的信息：


    - 文件类型

    - 文件大小

    - 文件的所有者或组所有

    - 创建日期和时间

    - 最后修改日期和时间

    - 权限

    - 链接数

    - 数据地址


    # 什么是超级块（Superblock）？


    在 Linux 文件系统中，关于基本文件大小和形状的信息被称为超级块（The Superblock）。它允许文件系统管理器浏览并维护文件系统的质量。


    ### 超级块中的信息：


    - 空闲块 – 显示系统空闲块的数量

    - 空闲 inode – 显示原始 inode 分配

    - 空闲 inodes – 显示系统空闲 inodes 的数量

    - 块组编号 – 指分配给超级块的编号

    - 每组块数 – 显示一组的块数

    - 块大小 – 指系统的块大小；信息以字节为单位显示

    - 魔数 – 指授予挂载软件进行评估的权限

    - 挂载计数 – 指系统允许的评估次数

    - 修订级别 – 指系统允许的修订级别确认


    # 什么是组描述符（Group Descriptor）？


    组描述符负责标记文件的数据结构。它包含了避免数据重复的细节。由于它的作用，系统损坏的可能性极低。


    ### 组描述符中的信息：


    - 块位图

    - 空闲块计数

    - 空闲 inode 计数

    - inode 位图

    - inode 表

    - 已用目录计数


