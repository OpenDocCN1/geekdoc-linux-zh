- fmt: "\n# File Modification: Finding, Mounting & Changing Sizes\n\nA Linux file\
    \ is usually easy to locate. Just search for a directory and the name that succeeds\
    \ a `//` or a forward slash might be your preferred file. \n\nSample: `/home/lp.txt`\n\
    As the sample shows, `/home/` is the directory and `lp.txt` is a file. You can\
    \ then start mounting. When mounting a file, the availability of a Linux kernel\
    \ is necessary to check the standards. Its presence allows the validation of all\
    \ of a system’s passed arguments.\n\nSample:\n```bash\n# mountiso898 /dev/rom\
    \ /dev/cdrom\n```\nAs the sample shows, you are mounting three kinds of information.\
    \ `iso898`, `/dev/rom`, and `/dev/cdrom`.\n\nApart from finding and mounting a\
    \ file, you have the option to change a file’s size. This is done due to the occurrence\
    \ of a file’s fragmentation. Since files become inefficient during fragmentation,\
    \ changing a file’s size allows the allocation of files. Consequently, the system\
    \ becomes more stable.\n\nYou are introduced to the commands `truncate` and `fallocate`.\
    \ Both commands allow you to create a file with a preferred size.\n\nSample:\n\
    ```bash\n# truncate -s 19MB mop1.txt\n# fallocate -l 19000000 mop2.txt\n# ls -ls\
    \ mop.txt\n0 -rw-rw--r-- 2 trs trs 19000000 Aug 12 02:44 mop1.txt\n14819 -rw-rw--r--\
    \ 2 trs trs 19000000 Aug 12 02:45 mop2.txt\n```\nAs the sample shows, you created\
    \ a `19MB` file called `mop` on `Aug 12`.\n\n# CHAPTER 4. Basic Shell Programming\n\
    \nIn this chapter, we will dive into one of the hacker's secrets weapons that\
    \ are scripting. There is quite a small difference between programmers and hackers.\
    \ Programmers use scripting to build systems whereas hackers use scripting to\
    \ exploit systems. Without creating their scripts, a novice hacker can never become\
    \ a professional Hacker but will remain as a script kiddie who just uses other\
    \ tools to crack systems. Thus, scripting knowledge is a must in the checklist\
    \ for anyone trying to master hacking. To help you out this chapter will introduce\
    \ a lot of bash scripting concepts with real-world coding examples. Let's have\
    \ fun with some scripting now!\n\nFirst of all, we need to know about the shell\
    \ in detail.\n\n## What is a Shell?\n\nA shell is that cursor you observe when\
    \ you first connect to a server using a password or when you make yourself connected\
    \ to a system using remote desktop tools like `SSH`. In other words, if you want\
    \ it to look solely from a programming point of view you would be delighted because\
    \ it acts just as an interpreter between the user and system just like how an\
    \ operating system does. But it just sends the input advises from the user to\
    \ the Linux kernel and sends the output that is the result back to the system\
    \ user.\n\n## Types of shell\n\nThere are types of shells that exist according\
    \ to the Linux official documents. Out of both the first one stands for a GUI\
    \ whereas the second one stands for CLI. There are a lot of shells that have been\
    \ manufactured with the Distros like Bourne shell, C shell, korne shell, and Bash\
    \ shell. Out of all different types of shells that are present `bash` shell is\
    \ one of the most famous that ever existed. It is pre-installed in almost all\
    \ the famous Linux Distros. It also acts as an interceptive language that helps\
    \ the Linux kernel understand the instructions we are giving logically.\n\n##\
    \ How does the bash shell work?\n\nThere are two types of modes that one can work\
    \ shell with. Out of which one is an interactive mode and the other is a script\
    \ mode.\n\n### a) Interactive mode\nIn this mode, the Linux user can enter the\
    \ functions or the `bash` code one by one and wait until the result is given.\
    \ If there is an error in the middle the user cannot proceed further. It just\
    \ works interactively like in an old handheld video game.\n\n### b) Script mode\n\
    In this mode first of all the `bash` code will be written in a text file and then\
    \ will make to run the script file using the command-line interface. While using\
    \ this mode the user can get all the results that he was looking for all at once.\
    \ Hackers need to be more perfect in script mode because it will be easy to exploit\
    \ systems fast using this way. However, programmers that are who create systems\
    \ will prefer interactive mode more.\n\nBefore knowing more about the grammatical\
    \ structure of the shell it would be better if we have a good overview of the\
    \ advantages of the shell.\n\n## Advantages of the shell\n\n1) It is very easy\
    \ to learn inline programming languages that differ a lot in both execution and\
    \ implementation.\n2) It has a lot of help documents that will help the hackers\
    \ to rectify the errors as soon as possible.\n3) It has an added advantage because\
    \ it is an explanatory language. That is, it need not be compiled before running.\
    \ So, hackers can easily cross-check the code before trying to implement it on\
    \ the victim's system.\n\nApart from this shell is also fast and works efficiently.\
    \ Due to all these reasons, hackers should mandatorily learn about the implementation\
    \ of the shell.\n\nLet's go!\n\n## First shell script\n\nLet us create a shell\
    \ script of the name `sample.sh`. create a shell script using the following command.\n\
    \n```bash\ncat sample.sh\n```\n\n### Location of the shell program\n```bash\n\
    echo \" This is very regressive\"\n```\nNow we will explain this in detail. Line\
    \ by line.\n\na) `#!` This represents the starting of a shell script that we are\
    \ trying to write.\nb) If it starts with only a hash `#` then it is called a comment.\
    \ Comments are annotations that are used to make it easy for reference or other\
    \ users that want to look at the code. It may seem unnecessary to write comments\
    \ for small shell scripts.\nc) `echo` is a shell default that lets the interpreter\
    \ display the content that is written. Here to run the shell you need to use the\
    \ following command:\n\n```bash\nbash sample.sh\n```\nAnd then output will appear.\
    \ For example, the output is: `This is very regressive`\n\nThere is also another\
    \ feature that will let you run the script with additional permissions. As discussed\
    \ earlier Linux has a set of permissions and if you don't provide with the script\
    \ may not run. So, to provide permission use the following command debugging is\
    \ one of the most important tasks. Even hackers need to be perfect at this because\
    \ wrong of code may result in bad adaptation of the task.\n\n### Debugging the\
    \ shell\n\nNormally when you enter a wrong command in the script such as shown\
    \ below\n```bash\nvulnerhost @ example: ech 789\n```\nThis code will not run and\
    \ show an error as shown below\n```bash\nthe ech command is not found\n```\nThis\
    \ is exactly what debugging is. Debugging features informs the user about the\
    \ errors in the script. There are also a lot of debugging tools that perform the\
    \ tasks we do in command-line interface. Tools like `bashdb` are famous for this.\
    \ This section will help hackers understand the basics of shell programming. Let's\
    \ go!\n\n## Built-in Shell Commands\n\nBefore entering into deep discussion about\
    \ built-in commands it is important to know that these cannot be used as variable\
