    Command. Using “man” opens up a screen with everything you need to know, as a
    digital manual page. Try these variations when in need. Knowing how to get somewhere,
    how to get out, and how to ask for help may seem very basic, but when you are
    learning the system these can be very frustrating.“man –k”  To Search for all
    commands that involve a term. You may also use “apropos”.“man” To Display help
    information.“info” To Display help information (differently).“whatis” To Display
    a description about a man page.“whereis” To tell the location of a man page.To
    Exit a man page, you type “Q” (Quit), to drop out.  This is the only way to back
    out of the manual pages.To Exit out of most other places, simply type “Exit”.The
    Commands “more” and “less” are also useful for displaying showing files that go
    past the screen you are on. You may need to read more information than what you
    can see on one screen on the help pages. This is especially important for a beginner
    on the system. Simply scroll down by using the space bar after typing the Command.To
    get out, type in “q” for quit.Moving around           You will soon learn that
    there are many directories in Linux, and you should get familiar with them. Although
    everything is a file Linux, a directory is a special type of file. Directories
    appear in lists, and related as a tree. Unlike OS that uses GUI, you will not
    see the extension file names. Therefore you need to know how to navigate, find
    and change them. You should do a Google search for a list of them in order to
    properly navigate your system.Just as with Commands, directory spelling and symbols
    also matter. As another note, the space bar comes handy when you need a legitimate
    space between letters and slashes, or letters from other words. It saves time
    and strokes. Missing these small details can also result in your being somewhere
    you don’t need to or do not want to be. They can also dead-end you with an error
    message. In worst-case scenarios, mistakes in Linux could do some serious damage
    like deleting files. You should use underscore instead of spaces when setting
    up new file names. These small things will make a difference. A few directories
    and functions that beginners should become familiar with are:'
