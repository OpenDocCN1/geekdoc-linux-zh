    produce a culinary material. What if the food doesn''t taste good? That is if
    you are unable to get better results after all the hacking process? There is only
    one way you can do i.e.; to try again. There are five important areas you need
    to learn in detail to master hacking.1) Information Gathering2) Automatic Vulnerability
    Scanning3) Exploiting4) Password Attacks5) Sniffing and wireless attacks1)  Information
    gatheringInformation-gathering is always considered a pivotal job hacker should
    do before attacking a target. It roughly sums up that by using information gathering
    tools we can acquire a lot of information about the target hosts, which can help
    us create exploits that would help us create a backdoor for further exploitation.
    We can even use tons of publicly available information about the target to get
    a good idea of what strategy we should use to make this attack successful.2)  Automatic
    Vulnerabilityscanning Vulnerability Scanner is a program that automatically finds
    and discovers security vulnerabilities in computers, network applications, web
    applications and software. It detects the target system through the network, generates
    data to the target system, and matches the feedback data with the built-in vulnerability
    signature database to enumerate the security vulnerabilities existing on the target
    system. Vulnerability scanning is an indispensable means to ensure system and
    network security. In the face of Internet intrusion, if users can detect security
    vulnerabilities through network scanning as soon as possible according to the
    specific application environment, and timely take appropriate measures to repair,
    it can effectively prevent the occurrence of intrusion events. Because the work
    is relatively boring, we can implement it with some convenient tools, such as
    Nessus and OpenVAS.3)  Exploiting Exploitingis an important way to gain control
    of the system. The user finds a vulnerable vulnerability from the target system
    and then uses the vulnerability to obtain permissions to control the target system.
    In order to facilitate the user''s practice, this chapter will introduce Metasploitable
    2 released by Metasploit. Users can use it as a Linux operating system for practice.
    This chapter will use the vulnerabilities on the Metasploitable system to introduce
