    in detail about them.Examples of Netcat:[A(192.232.2.23)B(192.232.2.43)][ a(192.232.2.23)b(192.232.2.43)]How
    Netcat can be used in Kali Linux?How to start netcat? When you are in the Linux
    Terminal enter nc like below and click enter. This will start the netcat tool.$nc1) 
    Netcat for Port Scanning Beginners always get confused with the term port scanning
    due to its popularity in penetration testers. If we want to explain about port
    scanning in layman terms it is a process of trying to find open ports that are
    vulnerable via tools for hope to find a vulnerability or backdoor which can be
