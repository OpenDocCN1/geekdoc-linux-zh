    \ 192.232.2.1`\n- **Idle scan**: This is one of the craziest features of `Nmap`\
    \ because it just acts like proxy while doing attacks. When using idle scan you\
    \ can send packets using another host. This anonymity can help hackers stay in\
    \ the dark if something goes wrong. Investigation is what every hacker strives\
    \ for. Here is the command for `-sL`: `hacking@kali nmap -sL 192.232.2.1`\n- **OS\
    \ scan**: `Nmap` can detect the device type of the host (router, running operating\
    \ system details). If `Os scan` cannot detect at least one open or closed port\
