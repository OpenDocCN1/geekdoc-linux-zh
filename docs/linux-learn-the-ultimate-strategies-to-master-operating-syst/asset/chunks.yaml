    # 重要提示：❖ 在 CD 或 DVD 上运行此类程序程序通常是一个好主意，以便对其进行初步了解；如果你喜欢你看到的内容，再对其进行安装。试用将帮助你在安装操作系统时做出一个不会后悔的决定。❖
    在开始安装之前，请务必确保已备份了你所有的文件、程序、个人数据和设置，以防丢失。


    # 在 Linux 上安装新软件

    在 Linux 操作系统上安装新软件，这与你安装操作系统本身一样简单。对于用户来说，一切都已变得非常容易了。因此，如果你过去在其他操作系统上安装新系统时遇到过困难，现在没有理由担心了。


    大多数 Linux 发行版都带有一个应用商店，或类似的工具，它代表了存储所有应用程序的中央区域。你做的就是浏览这些应用，并安装你想要在机器上使用的程序。这让你能够非常轻松地找到想要在电脑上安装的程序。`Ubuntu
    Software Center` 就是 Ubuntu Linux 这种集中化区域的示例。深度（Deepin）拥有 `Deepin 软件中心`。某些发行版依赖
    `GNOME software`，而另一些则依赖 `Synaptic`。所有这些工具的含义和功能都是相同的；它们提供了一个中心位置，你可以从那里轻松地搜索和安装
    Linux 软件。不过，图形界面（GUI）的存在很重要，它可以让你完成其他软件的安装过程。如果你没有 GUI，将不得不依靠命令行界面来完成安装。


    用户需要知道的是，在任何 Linux 上安装软件都非常容易。新电脑用户也会发现这非常简单且不费时间。操作系统的设计目的是让计算机用户在他们做的每件事上都感到轻松，而这只是其中之一。安装完操作系统后，你就可以开始安装在使用机器或设备时需要的任何应用程序。


    Linux 无处不在。你可以在家里、汽车里，甚至在电器中找到它。当然，你最常发现它的地方是电脑。从乍上看，Linux 看起来和任何其他操作系统一样。它位于你所有其他软件之下，并向你的硬件传递信号。它拥有图形界面，与其他大多数操作系统一样，并且对于其他系统具有的大多数功能都有相应的软件实现方案。如果你曾经用过任何操作系统，那么在使用
    Linux 时应该不会遇到困难。人们通常不知道的是 Linux 使用得非常频繁。除了是个人电脑最常用的操作系统之一，它还被用于运行全球的许多服务器和嵌入式系统。它用于运行互联网的巨大份额，以及许多管理股票和实现科学突破的超级计算机。然而，在这一切之前，Linux
    就被誉为世界上最无后顾、安全且可靠的系统之一。这种声誉实之名归，Linux 的质量正变得越来越明显。


    Linux 是一个灵活的工具，可以针对你可能感兴趣的任何工作进行定制。用户随时可以对其进一步开发，这意味着它将一直处于越来越好的过程中。它完全依赖社区本身的这一事实使得
    Linux 成为了一项更令人深刻的成就。这也让 Linux 看起来更可靠一点，因为发行过程中没有贪婪因素介入。该系统是属于人民、为了人民的工具，并随着趋势增长。它在用户的帮助下根据用户的需求而成长。


    Linux 的不同变被称为发行版（distributions）。发行版是不同组件的包，通过选择并缝合在一起来执行定义明确的功能。一个发行版由内核、支持库和系统软件组成。其中大部分内容由
    `GNU Project` 提供。尽管大多数发行版在名称中使用了“Linux”一词，但关于发行版的命名规范曾存在争议，因为自由软件基金会倾向于使用 `GNU/Linux`
    这个名称，以强调 `GNU` 软件的重要性。这让 Linux 的创建者 Torvalds 非常不悦，并立即抵制了这一点。从那时起，发行版的名称问题一直很紧张。


    一些流行的 Linux 发行版有 `Fedora`、`Ubuntu` 和 `Debian`。有些是商业用途，如 `Red Hat Enterprise Linux`
    和 `SUSE Linux Enterprise Server`。桌面发行版通常包含 `Wayland` 或 `X11` 等窗口系统，以及 `KDE Plasma
    5` 或 `GNOME` 等桌面环境。其他服务器的发行版通常不包含图形界面。一个解决方案的示例是 `LAMP`。有许多发行版可供选择。让变得更大的事实是 Linux
    是可以分发的，你可以根据任何目的创建自己的发行版。Linux 最初是为个人计算机设计的，基于 `x86` 架构。从那时起，它被移植到许多平台，超过了任何其他操作系统。在涉及到服务器和大型机时，Linux
    领先于任何其他操作系统。此外，它是超级计算机使用的唯一操作系统，它逐渐消除了竞争。自从 2017 年 11 月以来，它占据了笔记本电脑市场的 20% 百。基于
    `Linux` 内核的 `Chrome OS` 是其中一个例子。


    Linux 也用于嵌入式系统。这些是构建在固件中的系统，路由器、电视、游戏机、数字录像机以及智能手表。由于 `Android` 在手机和平板电脑市场的主导地位，Linux
    也经常用于这些设备。


    Linux 作为一个成功的明证，展示了独立开发者之间的合作可以走多远。它是开源软件的一个卓越案例，成果是显而易见的。在 2001 年，研究了关于 `Red
    Hat Linux 7.1` 的发行版，它包含了数百万行代码。研究还发现，它使用了多种编程语言，如 `C`、`C++`、汇编语言、`Lisp`、`Python`、`Perl`、`Fortran`
    以及许多脚本语言。


    # Linux 是如何创建的？

    Linux 的原始名称是 `Freax`，它是 Unix 的一个变体。在一段时间内，该项目包含了 `Linux` 这个名称，但这让 Linux 的创建者 Torvalds
