    # CHAPTER 12 Using Linux Text Editors


    Even though you are capable of using a desktop that has a functional graphic interface,
    you will find the desire to interact with the Linux environment by editing and
    creating files using editors that belong outside the GUI. Learning how to use
    text editors will allow you to make your own shell scripts and communicate with
    the programs that you want to run in your operating system. At the same time,
    you will also be able to fix possible problems in your configuration files, especially
    when the X Window System fails to load. In this chapter, you will learn how to
    use GUI and text mode editors, which will both allow you to configure and create
    text files.


    ## How to Use GUI Text Editors


    The GUI desktops `KDE` and `GNOME` come with built-in text editors that have their
    own graphical user interfaces. You can load these editors from the main menu.
    For example, if you want to open the GUI text editor for `GNOME`, navigate to
    `Applications->Text Editor` and then select the file `gedit`. Once the editor
    loads, you can select the `Open` option found on the toolbar and then pull up
    a file that you want to edit or change directories that contain the file that
    you want in the dialog box labeled `Open File`.


    `GNOME`’s text editor is also capable of loading multiple files at a time and
    even switch in between windows to work with them. A typical editing session will
    look like this: Image from: Linux All-in-One for Dummies. Looking at this image,
    you will notice that there are two files loaded in the editor – one appears to
    be a new file, and the other is named `motd`. You can find the names of the files
    that are being edited in the tabs, which you can also click to switch windows.


    If you open a file that is only available to be read, you will see a text that
    displays “Read Only” added to the filename displayed in the window title. If you
    have access to superuser privileges, you can of course change the ownership of
    the file in order for you to make edits.


    If you have a `KDE` desktop, you can pull up the `KWrite` text editor by navigating
    to `Applications -> Accessories -> Text Editor`. Just like in the `GNOME` text
    editor, you can click on the `Open` icon or navigate to `File -> Open` in order
    to load the file that you want to edit. This is how the `KWrite` editor looks
    like: Image from: Linux All-in-One for Dummies.


    ## Using ed and vi as Text Editors


    As you may have noticed, text editors that have GUIs allow you to edit files using
    your mouse and keyboard similar to how you would type a document in a word processor.
    However, text mode editors are more complex than that – you only have your keyboard
    as your input device and you will have to type in commands in order to perform
    tasks such as copying, pasting, or cutting texts. Text editors that come native
    with Linux are called `ed` and `vi`.


    ### ed


    ```

    ed

    ```

    This line oriented editor is going to be extremely useful when you loaded a minimal
    version of the OS and you do not have the support that you need yet for a full-screen
    editor yet. You may encounter this situation when you load up Linux from a boot
    disk.


    Using `ed` allows you to work in these modes:


    *   Command mode – this is the default mode, in which everything that you type
    is being interpreted by Linux as a command. In this mode, `ed` has a rather simple
    set of commands, wherein each command is made up of one or multiple characters.

    *   Text input mode – this mode is for typing longer texts. You can enter this
    mode when you enter the commands `a` (meaning append), `c` (meaning change), or
    `i` (meaning insert). When you are done entering several lines of text, you can
    leave this mode by putting only a period on an empty line.

    '
