    \  - Shell 的类型\n    - bash shell 如何工作的？\n    - Shell 的优势\n    - 第一个 Shell 脚本\n\
    \    - 调试 Shell 脚本\n    - 内置 Shell 命令\n        - 1) Alias](#part0008.xhtml_a1Y7)\n\
    \        - 2) Unalias](#part0008.xhtml_a1Y8)\n        - 3) bg,fg,jobs](#part0008.xhtml_a1Y9)\n\
    \        - 4) cd](#part0008.xhtml_a1YA)\n        - 5) 声明变量](#part0008.xhtml_a1YB)\n\
    \        - 6) Break](#part0008.xhtml_a1YC)\n        - 7) Continue](#part0008.xhtml_a1YD)\n\
    \        - 8) Eval](#part0008.xhtml_a1YE)\n        - 9) Exec](#part0008.xhtml_a1YF)\n\
    \        - 10) Exit](#part0008.xhtml_a1YG)\n        - 11) Export](#part0008.xhtml_a1YH)\n\
    \        - 12) Kill](#part0008.xhtml_a1YJ)\n        - 13) Read](#part0008.xhtml_a1YK)\n\
    \        - 14) ulimit](#part0008.xhtml_a1YM)\n        - 15) Test](#part0008.xhtml_a1YN)\n\
    \    - Shell 编程基础\n        - 变量\n        - 变量命名\n        - 变量赋值\n        - 特有变量\n\
    \        - 数组\n        - 常量\n        - 命名空间\n        - 运算符\n- 第 5 章 Linux 接下来做什么？\n\
    - 第 6 章 基础工具\n- 第 7 章 命令语法\n- 第 8 章 Linux 文件与目录\n- 第 9 章 Linux 文件系统搜索\n- 第 10\
    \ 章 用户与组管理\n    - 用户与组\n    - 谁是用户？\n    - 什么是组？\n    - 获取超级用户权限\n    - root 用户\n\
    \    - 使用 Su 切换用户\n    - sudo 与 root\n- 第 11 章 初学者命令与函数\n- 第 12 章 使用 Linux 编辑器\n\
    \    - 如何使用 GUI 编辑器\n    - 使用 ed 和 vi 作为编辑器\n    - ed\n    - vi\n- 第 13 章 练习\n\
    \    - 如何创建一个空文件\n    - 拷贝文件或目录\n- 第 14 章 构建脚本\n    - 编写 Shell 脚本\n    - 命令别名\n\
    \    - 管道\n    - 脚本构建中的数学运算\n- 第 15 章 安全你的 Linux 服务器\n- 第 16 章 GNU 工具\n    - 什么是\
    \ GNU\n    - GNU 工具示例\n    - 关于安装 Linux OS\n    - 安装 Linux OS 的步骤\n    - 主流发行版的\
    \ Linux 系统要求\n    - 在 VirtualBox 中安装 Linux Mint\n- 第 17 章 控制特权用户\n    - Linux\
    \ 账户类型\n    - sudo\n    - Sudoers 文件\n- 结论\n\n## 引言\n20 世纪 90 年代中期，Linux 不再是爱好者的工具，开始在超级计算社区中使用。当\
    \ Linux 初步兴起时，得到了 Dell、IBM 和 HP 等公司的支持，使 Linux 能够逃脱微软在操作系统市场上的垄断。这是它找到第一个商业用途的时候。后来，NASA\
    \ 等组织开始使用 Linux 设备，并开始用大量的 Linux 计算机替换他们昂贵的机器，因为它们便宜得多，且能完成相同的工作。今天，你可以在任何地方找到\
    \ Linux，从超级计算机到嵌入式系统。Linux 在许多桌面安装中变得非常流行，在笔记本电脑市场也是如此。许多发行版都配备了定制化的 Linux。Google\
    \ 发布了用于笔记本的 Chrome OS。Linux 在移动设备市场上取得了巨大成功，包括智能手机、和平板和可穿戴设备。Valve 也支持 Linux，这开启了游戏市场。\n\
    \n## Linux 的现状发展\n目前 Linux 是由多个来源开发的。原始 Linux 内核由 Greg Torvalds 维护。在 Linux Linux\
    \ 工作之前，他在 SUSE 实验室工作。Richard Stallman 是自由软件基金会的领袖，他在 2006 年创建了帮助 Linux 的 CD。Stallman\
    \ 是自由软件的积极倡导者，他坚信每个程序都应该对所有人可用。由于 GPL 的存在，Linux 始终是免费的。最后，但同样重要的是，许多政府也使用它进行行政工作。\n\
    \n## 谁拥有 Linux？\n从技术上讲，没有人拥有 Linux。它是开源的。唯有“Linux”这个商标的版权属于 Linus Torvalds。然而，Linux\
    \ 本身由许多贡献者所有。得于 GPL 许可，你不需要支付费用。\n\n## 第 1 章 基础 Linux 命令\n在本节中，我们将探索启动所需的基础命令。你现在可以打开终端。右键点击桌面并选择“终端（Terminal）”。如果没有看到这个选项，请查看窗口顶部的“应用程序（Applications）”。选择“终端”并打开编辑器，即\
    \ `ged`。只需点击并输入“文本编辑器（text editor）”。在文件中添加你选择的文本并保存到桌面。我保存了名为 `first` 的文件：\n\n\
    ```bash\nfirst\n```\n我是 Linux 大师。现在去终端并输入以下内容：\n```bash\ncat first\n```\n按下回车键后，窗口将显示文件的内容。这种方法适用于查看短文件。\n\
    \n## 更改目录\n你可能还想通过终端导航或更改目录。要实现这一点，使用 `cd` 命令，它代表“更改目录”。\n\n示例：\n```bash\ncd /home\n\
    ```\n上述命令将工作目录更改为 `/home` 目录。使用斜杠 `/` 表示相对于根，这意味着无论你当前所在的目录，该命令都会执行。现在输入以下命令：\n\
    ```bash\ncd httpd\n```\n目录将相对于 `/home` 目录更改为 `httpd`。完整的工作目录将是 `/home/httpd`。现在输入以下命令：\n\
    ```bash\ncd ..\n```\n此命令将工作目录更改为当前目录的父目录。在我们的案例，我们将从 `/home/httpd` 移动到 `/home`\
    \ 目录。输入以下命令：\n```bash\ncd ~\n```\n此命令将目录更改为用户的主目录 `/home/(username)`。`username`\
    \ 是你在计算机上使用的名称。符号 `~` 称为波浪号（tilde），在 Linux 中表示用户的主目录。\n\n## 拷贝文件\n`cp` 命令代表“拷贝文件（copy\
    \ files）”，用于拷贝文件。注意文件不会从初始位置删除，而指定位置创建一个相同的副本。输入以下命令：\n```bash\ncp first me\n\
    ```\n上述命令将在相同目录下创建一个 `first` 文件的副本，但新名称为 `me`。如果目录中存在 `me` 文件，它将被覆盖，且在执行此命令之前你不会收到警告。考虑下面的命令：\n\
    ```bash\ncp -i first me\n```\n注意在上述命令中，我们添加了 `-i` 选项。如果目录中存在 `me` 文件，在覆盖之前你将收到通知。接下来，尝试以下命令：\n\
    ```bash\ncp -i /d/file\n```\n使用上述命令，文件 `/d/file` 将拷贝到当前目录并命名为 `file`。注意我们使用了 `-i`\
    \ 选项，如果文件已存在，在覆盖之前将收到通知。你可能还需要将特定目录中的所有文件拷贝到另一个目录。可以通过以下方式实现：\n```bash\ncp -dpr\
    \ sourcedirectory destinationdirectory\n```\n`sourcedirectory` 中的所有文件将拷贝到 `destinationdirectory`。注意我们使用了\
    \ `-dpr` 参数，这意味着：\n- `-d` 意味着保留链接\n- `-p` 保留文件属性\n- `-r` 递归拷贝\n在拷贝从目录的所有文件时，需要指定这些选项，否则将应用默认设置。使用\
    \ `df` 命令可以查看磁盘上使用的空间大小。\n\n## `Less` 命令\n`less` 命令与 `more` 命令相同。区别在于用户可以使用此命令向上或向下翻页查看文件。考虑以下示例：\n\
    ```bash\nless first\n```\n上述命令将显示 `first` 文件的内容。\n\n## `Ln` 命令\n此命令创建文件的符号链接。编写并运行以下命令：\n\
    ```bash\nln -s first link\n```\n上述命令将创建一个名为 `link` 的符号链接，指向文件 `first`。`ls -i link`\
    \ 命令将显示差异。\n\n## `Locate` 命令\n此命令用于在数据库中搜索。运行以下命令：\n```bash\nlocate -u\n```\n\
    将创建一个名为 `locate` 的数据库。这需要一些时间，请耐心。在搜索文件之前，必须运行此命令：\n```bash\nlocate whois\n```\n\
    此命令将在你的系统中查找包含 `whois` 字符串的文件。\n\n## `Logout` 命令\n此命令用于注销系统。进入终端并输入此命令：\n```bash\n\
    logout\n```\n你将注销并返回登录屏幕。\n\n## `Ls` 命令\n`ls` 代表列出（list），用于列出目录中的文件。然而，它带有许多所需的选项。如果你需要列出当前目录下的所有以\
    \ `.` 开头的文件，输入命令：\n```bash\nls -a\n```\n上述图形显示了目录中的文件。你可能需要查看文件的更多详细信息，如所有者、权限、时间和日期等。可以通过命令实现：\n\
    ```bash\nls -l\n```\n如所示，`ls-l` 比之前的命令更详尽。你可以获取更多细节。\n\n## `Sudo` 命令\n这代表“超级用户执行（superuser\
    \ do）”。其目的是允许许可的用户以“超级用户”身份执行命令。这通常定义在 `sudoers` 列表中。它的重要性在于通过确保只有正确的人才能执行敏感命令。另一个命令\
    \ `su` 允许你以超级用户身份登录系统。`sudo` 的目的是借用超级用户的权限。这解释了 `su` 和 `sudo` 命令之间的区别。\n\n## `More`\
    \ 命令\n将文件的内容一次一页到屏幕。它也可以作用于输出。让我们把 `/etc/profile` 的内容列到屏幕。这是一个内置文件，包含了系统的配置。注意文件内容将一次显示页，因为内容太大。考虑以下命令：\n\
    ```bash\nmore /etc/profile\n```\n命令将列出目录中的所有文件并通过 `more` 输出。如果目录的输出无法在一个页显示，它将列在额外的页面。\n\
    \n## `Mv` 命令\n此命令代表“移动（move）”，用于重命名或移动文件。考虑下面的命令：\n```bash\nmv -i first first2\n\
    ```\n文件将从 `first` 移动到 `first2`，这意味着将其重命名为 `first2` 而不是 `first`。\n```bash\nmv /d/first\n\
    ```\n上述命令将文件 `first` 从 `/d` 目录移动到当前工作目录。现在你已经看到 `mv` 命令是一个强大的工具。现在我们一直在讨论工作目录，它们到底是什么？我们如何知道它们是哪个目录？只需输入命令：\n\
    ```bash\npwd\n```\n按下回键后，你注意到输出是一个目录。它显示你当前所在的目录。`pwd` 缩写代表“打印工作目录（print working\
    \ directory）”，用于显示当前目录。\n\n## `Shutdown` 命令\n此命令用于关闭系统。该命令目的是停止当前进程并立即关闭系统。使用以下代码：\n\
    ```bash\nshutdown -h now\n```\n下一个命令用于重启系统，意味着它将立即关闭并重启系统。使用下面的命令：\n```bash\n\
    shutdown -r now\n```\n\n## `Whereis` 命令\n此命令用于显示命令的手册、源码和二进制文件。考虑下面的命令：\n```bash\n\
    whereis ls\n```\n此命令将显示 `ls` 命令的手册和二进制文件。要查看之前在系统中过的命令列表，使用命令 `history`：以上是在我的系统中运行的命令列表。你可以在你的系统中尝试并观察输出。\n\
    \n## `Sudo` 命令\n这代表“超级用户执行”。它的目的是允许许可的用户以“超级用户”身份执行命令。这通常定义在 `sudoers` 列表中。它的重要性在于通过确保只有正确的人才能执行敏感命令。另一个命令\
    \ `su` 允许你以超级用户身份登录系统。`sudo` 的目的是借用超级用户的权限。这解释了 `su` 和 `sudo` 命令之间的区别。\n\n## `Mkdir`\
    \ 命令\n此命令代表“创建目录（make directory）”。它创建一个新目录并命名其路径。如果该路径已经存在，将输出无法创建文件夹的错误。考虑所示图形：我创建了一个名为\
    \ \"m\" 的目录。在创建目录后，我列出可用目录，发现它已经被创建了。注意我们是以 `sudo` 运行命令的。没有这个，命令将无法运行。出于安全考虑。\n\
    \n"
- fmt: '

    # 1. CD/DVD Installation


    Booting Ubuntu Linux from a CD or DVD is one of the two ways through which you
    can install the system on your computer.


    - Download the Ubuntu ISO file from Ubuntu software. This form of file is one
    that will be burned to a CD or DVD before you can use it.

    - Burn the ISO file using your burning program of choice. There are free and paid
    programs available that can burn an ISO file to a CD or DVD without having to
    download a separate program. You can choose the one you prefer the most.

    - Boot from the disk. Once the program is burned into the disk, you can restart
    your computer and choose to boot from the CD or DVD. You may be required to change
    your boot preferences. Do this by hitting the Setup key when the computer is restarting.

    - Linux gives users the option of trying it out before you can install it in order
    first to be sure that is just what you need. You can do this at this level; try
    Ubuntu first, and if you feel that it is the operating system you want to use,
    you can install it. You will be able to view the layout of the operating system
    when it is still running from the disc.

    - Install Ubuntu. You will have to be connected to a power source if you are using
    a laptop because the process could drain your battery. You need to be connected
    to an internet source as well.

    - Decide what to do with your other operating system. You will be given two options;
    whether to install Ubuntu Linux alongside the other operating system or to replace
    the old operating system with Ubuntu. If you choose to have the two, you will
    always be required to choose the operating system to use every time you reboot
    your computer.

    - Set your partition size. This will be necessary if you will choose to have the
    two operating systems on your computer. You can use the slider to adjust the amount
    of space you want to set aside for Ubuntu. Remember that you will also need enough
    space for files and programs, therefore leave out enough space for your new system.

    - Choose your location. This happens automatically if you are connected to the
    internet.

    - Set your keyboard layout. The right thing to do here is to click detect keyboard
    layout for Ubuntu to automatically choose the right one.

    - Enter your login information. Set a username and password. You can choose to
    have Ubuntu log you in automatically, or you can always enter your login information
    whenever you want to use your computer.

    - Wait for the installation process to finish. Restart the computer once the installation
    is finished and Ubuntu will load.


    # 2. Windows Installer


    The windows installer will install Ubuntu Linux alongside the other operating
    system that you are using. The programs and files will not be affected, but you
    will always have to choose the operating system to use whenever you reboot your
    computer.


    - Download the installer from Ubuntu website. You can select run, save or open
    if your browser prompts you to do that.

    - Create a username and password that you will be using to log in to the computer.

    - Click `Install` to start the process

    - Restart your computer once the installation is finished and choose Ubuntu Linux
    as the operating system to load.

    '
