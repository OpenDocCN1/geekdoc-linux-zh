    packages of different components that are selected and sewn together in order
    to perform a well-defined function. A distribution is made out of the kernel and
    supporting libraries and system software. Most of these are provided by the `GNU
    Project`. Even though most distributions use the word “Linux” in their name, there
    was a bit of controversy over the naming convention of the distributions as the
    Free Software Foundation preferred the name `GNU/Linux` in order to emphasize
    the importance of `GNU` software. This did not sit well with Torvalds, the creator
    of Linux, who immediately boycotted this. Ever since then, tensions have been
    high when it comes to the names of distributions.


