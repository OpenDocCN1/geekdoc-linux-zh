    # 第 12 章 使用 Linux 编辑器


    尽管你能够使用具有功能图形界面的桌面，你也会发现自己渴望通过使用 GUI 之外编辑器来编辑和创建文件，从而与 Linux 环境交互。学习如何使用编辑器将使你能够编写自己的
    shell 脚本，并与你想在操作系统中运行的程序进行通信。同时，你还能修复配置文件中可能出现的问题，特别是当 X Window 系统加载失败时。在本章中，你将学习如何使用
    GUI 和文本模式编辑器，它们都将允许你配置和创建文本文件。


    ## 如何使用 GUI 编辑器


    GUI 桌面 `KDE` 和 `GNOME` 内置了文本编辑器，这些编辑器拥有自己的图形用户界面。你可以从主菜单加载这些编辑器。例如，如果你想打开 `GNOME`
    的 GUI 文本编辑器，请导航到 `Applications->Text Editor`，然后选择文件 `gedit`。一旦编辑器加载，你可以选择工具栏上的
    `Open` 选项，然后在标记为 `Open File` 的对话框中调出你想要编辑的文件，或切换到包含目标文件的目录。


    `GNOME` 的文本编辑器还可以一次加载多个文件，甚至可以在窗口之间切换进行操作。一个典型的编辑会话看起来如下：图片来自：Linux All-in-One
    for Dummies。看着这张图片，你会注意到编辑器中加载了两个文件——一个似乎是一个新文件，另一个命名为 `motd`。你可以在标签页中找到正在编辑的文件名，也可以点击这些标签来切换窗口。


    如果你打开了一个只有读取权限的文件，你将看到窗口标题中显示的文件名后带有“Read Only”（只读）字样。如果你拥有超级用户权限，你当然可以更改文件的所有权，以便进行编辑。


    如果你使用的是 `KDE` 桌面，可以通过导航到 `Applications -> Accessories -> Text Editor` 来调出 `KWrite`
    文本编辑器。与 `GNOME` 文本编辑器一样，你可以点击 `Open` 图标或导航到 `File -> Open` 来加载你想要编辑的文件。这就是 `KWrite`
    编辑器的外观如图所示：图片来自：Linux All-in-One for Dummies。


    ## 使用 ed 和 vi 作为文本编辑器


    正如你可能注意到的，具有 GUI 的文本编辑器允许你使用鼠标和键盘来编辑文件，就像在文字处理程序中输入文档一样。然而，文本模式编辑器比这复杂得多——你只有键盘作为输入设备，并且必须输入命令来执行复制、粘贴或剪切文本等任务。Linux
    原生自带的编辑器被称为 `ed` 和 `vi`。


    ### ed


    ```

    ed

    ```

    这种行式编辑器当你加载了操作系统的最小版本且尚未获得全屏编辑器支持时，将变得极其有用。当你从启动盘加载 Linux 时，可能会遇到这种情况。


    使用 `ed` 允许你在以下模式下工作：


    *   命令模式——这是默认模式，在此模式下，你输入的所有内容都被 Linux 解释为命令。在此模式下，`ed` 有一套非常简单的命令，每个命令由一个或多个字符组成。

    *   文本输入模式——此模式用于输入较长的文本。当你输入命令 `a`（表示追加）、`c`（表示更改）或 `i`（表示插入）时即可进入此模式。当你完成几行文本的输入后，可以通过在空行上输入一个句号
    `.` 来退出此模式。


    '
- fmt: '

    To practice using `ed` as an editor, perform the following commands: This will
    copy the file `/etc/fstab` in your home directory. To start editing this file,
    key in this command:


    ```bash

    cp /etc/fstab ~

    ed -p fstab

    ```

    The editor will then respond to display this output:

    ```

    :

    ```

    From this example, the `-p` option allowed you to set the colon (the symbol `:`)
    as your prompt and also opened the `fstab` file copy that you have in your home
    directory. Each time the `ed` editor pulls up a file for editing, it displays
    the number of characters that are within the editable file and then displays the
    colon prompt that signals you can enter your commands through the editor.


    **Tip**: when you want to edit using `ed`, see to it that you have turned on the
    prompt using the `-p` option. This will help you distinguish that you are in the
    text input mode and not in the command mode.


    Once `ed` has opened up a file that you want to edit, you will immediately be
    in the last line of the file. To see what the current line number is, or the line
    where the command that you are going to input is going to be placed, you can use
    the `.` command, which will appear like this:

    ```bash

    .

    ```

    From this result, you know now that the file `fstab` contains 9 lines. Now, if
    you want to see all the lines that are contained in the file, you can use the
    following command:

    ```bash

    p .

    ```

    This will return with an output that appears like this:

    ```

    1  ...

    2  ...

    ...

    9  ...

    ```

    If you want to go to a line number that you want to edit (line 2, for example),
    simply type in the line number on the prompt. The editor will then respond by
    displaying that particular line:

    ```

    2 ...

    ```

    If, for example, you want to delete a line that contains the word `cdrom`, all
    you need to do is to search for that particular string. You can do this by typing
    the `/` sign, then the string that you need to find:

    ```bash

    /cdrom

    ```

    This will return with the line that contains the line that you want to edit, which
    becomes the current line. To delete it, simply enter `d` on the prompt.

    ```bash

    d

    ```

    To replace a specific string with a different one, the `s` command will be handy
    to use. For example, if you want to replace the string “cdrom” with “cd”, enter
    this command:

    ```bash

    s/cdrom/cd/

    ```

    To input a line in front of the line that you are currently editing, use the following
    command:

    ```bash

    a

    ```

    From this point, you can enter as many lines that you want. If you are done typing,
    enter the period sign on an empty line to indicate that you are ending the text
    input mode. After doing so, you will see that `ed` switches back to the command
    mode.

    ```

    :this is a new line.

    .

    ```

    If you want to save the changes that you have made to the file, enter the `w`
    command on the prompt.

    ```bash

    w

    ```

    If you want to save the changes and exit the editor, key in `wq` on the prompt
    to perform both actions. The output will appear like this:

    ```

    1234

    ```

    The editor will then save all changes that you have performed and then display
    the number of characters that were saved. Afterward, Linux will exit the editor.
    However, if you want to exit without saving any changes that you have made to
    the file, key in the `q` command to exit without writing to the file.


    Of course, there are different other commands that you can use in `ed`. Here is
    a summary of the most common commands used in the `ed` editor.


    ### vi

    The editor `vi` is definitely easier to use compared to `ed`, although it is still
    considered as a command line editor. The `vi` allows you to use a text editor
    in a full screen mode, which means that you can view multiple lines at the same
    time. It also helps to know that most of the Unix systems (this includes Linux)
    come with this text editor; which means that once you understand how this editor
    works, you will be able to modify text files in any system that is based in Unix.


    **Note**: When you edit a text file using `vi`, the editor reads it into a buffer
    memory. This means that you can change the file in the buffer. At the same time,
    this editor also makes use of temporary files during an edit session, which means
    that no changes are made in the original file unless you save any changes that
    you made.


    To start editing with `vi`, key in `vi` followed by the filename:

    ```bash

    vi fstab

    ```

    This will allow `vi` to load the file, then display the first lines of the text
    file in to the screen. The cursor will also be positioned on the first line:

    ```

    1  ...

    2  ...

    ```

    The last line that you see in this example shows the pathname, along with the
    number of lines and characters in the file. You will also notice that the file
    is read-only. This means that you are viewing the file as a normal user. You may
    have also noticed that since the number of lines does not occupy the rest of your
    screen, the unused lines are marked with the tilde (`~`) sign. The current line
    is marked by a black rectangle on top of the character that is being edited.


    The `vi` editor allows you to enter the following modes:


    - **Visual command** – this is the default mode, wherein everything that you key
    in is considered by Linux as a command to be applied to the current line. All
    `vi` commands are the same as `ed` commands.

    - **Colon command** – this mode is set for writing or reading files, setting up
    options for `vi`, and exiting `vi`. As the name implies, all commands in this
    mode start with the colon. When you key in the colon symbol `:`, the editor moves
    the cursor to the last line and then prompts you to enter the command. The editor
    will apply the command once you hit the Enter key.

    - **Text input** – this is the mode that you need to use when you want to enter
    text into the file. You are able to enter this mode when you use the following
    commands:

