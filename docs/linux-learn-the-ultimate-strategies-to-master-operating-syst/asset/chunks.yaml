    # Creating Multiple Workspaces for the Desktop


    You can also use workspaces to really maximize your desktop Ubuntu, to get more
    out of it, and to multitask for fun or pleasure. Some versions won’t prominently
    display these options but they can be enabled in different distros, in different
    ways. You should check your distro and do a web search for how to activate Workspaces
    with your version. It usually just takes a few clicks.


    Depending on the version of Ubuntu for example, in each of the environments you
    will need to click to either: Enable or Manage Workspaces, Add Applets, or Add
    Pager Widget to use these. Soon, you will have multiple workspaces that can help
    with organizing and separating your activities, assuming you have more than one
    at any time this will be quite useful. You should try and activate them, and test
    them out.


    ![00017.jpeg](image_rsrc20V.jpg)


    # Multiple Workspaces in Ubuntu Linux


    ## CLI

    You should also probably learn some basic `Commands` that you could use at the
    `Prompts`, just in case (and, yes, that has been suggested a few times already!)
    You will find that if you go into Applications, then Accessories, then get to
    the `Terminal` you can access the `CLI` and you will see a prompt. This is where
    the `Commands` come into play. Some users really like having this additional way
    to customize what they would like the system to do, to automate things, to take
    shortcuts.


    Additionally, if you move on to the Server version at some point in time, you
    will already have some appreciation and knowledge of the `Commands`, as well as
    a better understanding of the structure and location of the system files. As you
    will later read, everything in Linux is a file. They differ in structure from
    those of Windows for example. By using the `GUI` you will see this from one perspective.
    When you use the `CLI` you truly will better understand how the file trees and
    directories work with the hardware and software to make what is known as your
    operating system. This is also where Linux enthusiasts get the feeling of freedom
    that comes with not only the open sourcing of applications and other system resources
    but the freedom and flexibility to truly have your computer actively work for
    you.


    ## Getting Around in the Server Version

    Some time will need to be spent with the Server version however. It is not as
    straightforward and there are some particulars that will be very useful to know
    before, and during, exploring Linux in this way. If you know `DOS` it will be
    just a matter of learning `Commands` and code. If you do not, you will have a
    decent-sized learning curve ahead of you.


    To begin, you will log in to your new Server Version, with the information you
    have provided. You will see just `DOS` screen with prompts at the `Shell`. You
    will not see the Graphic User Interface (`GUI`) as you would with the Desktop
    Version. You will now need to use `commands` to go anywhere at all within this
    new operating system. You should set up a very secure password and `root` (user)
    name. Make sure to document this exactly as is. Punctuation will matter very much
    with Linux. Different spelling equates to something entirely different. You will
    see this reminder again.


    # The Root of Everything

    The word `Root`, in Linux, has a few meanings. The `Root User` is the Administrator
    (as the User name `root`) for the computer, which is the lightest level user,
    with full privileges.


    `Root` also is the highest level, or core, of anything in Linux. It also is the
    location where it is installed, the equivalent to `C:/Home` in Windows. It’s the
    highest level of the file so to speak. All in Linux is either a directory or a
    file inside the directory, all within the `Root` directory.


    The Command `sudo` means “Super User Do”. This signifies that you, the `Root User`
    (i.e., the Administrator), have full permission to access files and programs.
    In some distros, you will need to use this to preface some `Commands`.


    ![00018.jpeg](image_rsrc20W.jpg)

    www.ubuntuserverguide.com


    ## Get-Command over Your Commands

    As with most anything these days, you can do some simple research on Google to
    obtain large directories of `Commands` for Linux. And with these, you can navigate
    anywhere with Linux. You should not expect to memorize this list however, you
    should begin to get familiar with the language of Linux.


    Some of the most important and useful `Commands` will get you in, out, and around.
    To stress and expand upon an earlier point, your use of capitalization in `Commands`
    matters. `Commands` are very specific in their spelling so be careful to use proper
    capitalization. Spacing and word order also matter. You may not get anywhere,
    or you may end up somewhere that you did not intend to go.


    In the long list of `Commands` and combinations of commands for Linux, there are
    also some “builtin” commands. Just as it sounds, `Builtin` commands are already
    contained within the `Bash` shell itself. When the first word of a simple command
    is a `builtin`, the shell carries out that command without requiring another program.


    As said before, each distro will have its strengths and challenges. Something
    to note is that `Commands` for each distro may or may not be the same. Given that
    the `Commands` are the only way to navigate this version of Linux, this is key.
    You should definitely have done some research not only on the distro that you
    have chosen, in regards to the compatibility and usage, but you also now want
    to research the specific `Commands` for that particular distro.


    You will see there are some common roots to many of the `Commands`, and that you
    can build upon some with other `Commands`, keywords, file or program names. There
    are a few `Commands` that the beginner will need to use immediately. Follow along
    and try some out.


    # Get Help When You Need It

    Here are a few simple things to know right off the bat. These may be your life
    jackets. “Man” pages are manual (as in instructional) pages. You will also, like
    the `sudo` Command, preface another `Command` with this `Command`. Using `man`
    opens up a screen with everything you need. Try these variations when in need:


    - `man -k`: To Search for all commands that involve a term. You may also use `apropos`.

    - `man`: To Display help information.

    - `info`: To Display help information (differently).

    - `whatis`: To Display a description about man page.

    - `whereis`: To tell the location of man page.


    To Exit a man page, you type `Q` (Quit), to drop out. This is the only way to
    back out of the manual pages. To Exit out of most other places, simply type `Exit`.


    The `Commands` `more` and `less` are also useful for displaying files that go
    past the screen you are on. You may need to read more information than what you
    see on one screen on the help pages. This is especially important for a beginner
    on the system. Simply scroll down by using the space bar after typing the `Command`.
    To get out, type in `q` for quit.


    Moving Around

    You will soon learn that there are many directories in Linux, and you should get
    familiar with them. Although everything is a file Linux, a directory is a special
    type of file. Directories appear in lists, and related as a tree. Unlike OS that
    uses GUI, you will not see the extension file names. Therefore you need to know
    how to navigate, find and change them. You should do a Google search for a list
    of them in order to properly navigate your system.


    As with Commands, directory spelling and symbols also matter. As another note,
    the space bar comes handy when you need a legitimate space between letters and
    slashes, or letters from other words. It saves time and strokes. Missing these
    small details can also result in your being somewhere you don’t need or do not
    want to be. They can also dead-end you with an error message. In worst-case scenarios,
    mistakes in Linux could do some serious damage like deleting files. You should
    use underscore instead of spaces when setting up new file names. These small things
    will make a difference. A few directories and functions that beginners should
    become familiar with are:

    '
