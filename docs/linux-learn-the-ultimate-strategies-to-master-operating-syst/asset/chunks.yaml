    example of an apt-get install ([www.en.flossmanuals.net](http://www.en.flossmanuals.net)
    ).If you need help at any time, now that you know the man page Command, you would
    type: “man taskel”. You would see man pages appear to address your needs.How to
    UninstallTo uninstall, you would simply type “apt-get remove (and the name of
    the server in this case)”. Use this Command for obtaining most of your software,
