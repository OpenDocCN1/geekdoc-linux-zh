    - [Conclusion](#part0023.xhtml)\n\n## Introduction\nThe mid-1990s was when Linux\
    \ stopped being a tool of hobbyists and started to be used in the supercomputing\
    \ community. When Linux first started taking off, it was met with support from\
    \ companies like Dell, IBM, and HP so that Linux could escape the monopoly in\
    \ the operating system market Microsoft. This was when it found its first commercial\
    \ use. Later, organizations like NASA started using Linux devices and started\
    \ replacing their expensive machines with large numbers of Linux computers, as\
    \ they were far less expensive and could do the same job. Today, you can find\
    \ Linux system everywhere, from supercomputers to embedded systems. They have\
    \ secured themselves a permanent place in many server installations as the LAMP\
    \ application stack, which is very popular. Usage in machines in the household\
    \ has been increasing as well, in addition to enterprise desktops. Linux is very\
    \ popular in the netbook market, as well. Many distributors ship their products\
    \ with a customized Linux installed on them. Even Google released an OS for notebooks\
    \ of their own called the Chrome OS. Linux has had the most success in the mobile\
    \ device market. This is due to Android being a very popular option when it comes\
    \ to not only smartphones but tablets and wearables as well. Valve has been showing\
    \ support for Linux, which opened up a gaming market for the system, releasing\
    \ their own Linux distribution made for gaming. Linux distributions have also\
    \ started being popular when it comes to administrative work. Some local and national\
    \ governments use it, one of which is the government of Brazil.\n\n## The Current\
    \ Development of Linux\nCurrently, Linux is developed by several sources. The\
    \ original Linux kernel is maintained and guided by Greg Kroah-Hartman. Kroah-Hartman\
    \ is one of the most important people working on Linux. Before working for Linux\
    \ he worked in SUSE labs where he gained a load of experience in the field. He\
    \ not only maintains the many subsystems of Linux, but he was also responsible\
    \ for the Linx-hotplug, Linux Driver Project, and the udev project. He made great\
    \ efforts into assisting the growth of Linux, being the author and co-author of\
    \ many books that went deep into Linux. He made many tutorials and detailed works\
    \ on how Linux functions and where it is going next. Currently, he is helping\
    \ the development of the kernel through detailed talks and tutorials. In 2006\
    \ he made a CD that helps new programmers work with Linux. Richard Stallman is\
    \ the head of the Free Software Foundation which helps support. Stallman is one\
    \ of the people most responsible for the fact that Linux has remained a free source\
    \ for all time. He is an aggressive advocate of free software. He firmly believes\
    \ that every program should be available to everyone. He once said that hiding\
    \ codes, no matter how important, is a crime against humanity. Due to his efforts,\
    \ components are developed and, with them. Last, but not least, a great portion\
    \ for Linux’s continued functioning and development falls onto the people who\
    \ work hard at developing third-party components make up a huge portion of work\
    \ and account for user applications and kernel modules.\n\n## Who Owns Linux?\n\
    Technically, nobody owns Linux. That is the virtue of open source. The only thing\
    \ that is trademarked is the name Linux. The copyrights belong to Linus Torvalds.\
    \ Linux itself, however, is owned by many individuals. Due to such a large number\
    \ contributors around the globe, it would be a hassle to contact all of them.\
    \ Thanks to GPL you do not have to. This means that the program will remain a\
    \ free source as long as the license renewed.\n\n## CHAPTER 1. Basic Linux commands\n\
    In this section, we will explore the basic commands that are necessary to get\
    \ started. You can now open the terminal. Right-click on the Desktop and choose\
    \ `Open Terminal`. If you’t see this option, look for `Applications` at the top\
    \ of the window. Choose `Open terminal` and open the text editor, that is, `ged`.\
    \ Just click on the search and type `text editor`. Add some text of your choice\
    \ to the file and save it, maybe on the desktop. I have saved my file with the\
    \ name `first` with the following:\n\n```bash\nfirst\n```\nI am a Linux Guru I\
    \ am enjoying this book Now go to the terminal and type the following:\n```bash\n\
    cat first\n```\nAfter pressing the enter key, the contents of the file will be\
    \ displayed in the window. To list the content contained in a short file, this\
    \ method appropriate.\n\n## Changing Directories\nYou might also want to navigate\
    \ or change directories via the terminal. To achieve this, use the command `cd`\
    \ which stands for \"change directory\".\n\nExample:\n```bash\ncd /home\n```\n\
    The above command will change the working directory to the `/home` directory.\
    \ The use of forwarding slash `/` is to mean relative to the root, meaning that\
    \ this command will be executed regardless of the directory that you are currently\
    \ in. Now type the following command:\n```bash\ncd httpd\n```\nThe directory will\
    \ be changed to `httpd` but relative to the `/home` directory. The full working\
    \ directory will be `/home/httpd`. Now type the following command:\n```bash\n\
    cd ..\n```\nThis command will change the working directory to the parent directory\
    \ of the current directory. In our case, we will move from `/home/httpd` to the\
    \ `/home` directory. Type the following command:\n```bash\ncd ~\n```\nThis command\
    \ changes the directory to the user’s home directory `/home/(username)`. The `username`\
    \ will be the name you have used on the computer. The symbol `~` is called the\
    \ tilde and it is used in Linux to represent the user’s home directory.\n\n##\
    \ Copying Files\nThe command `cp`, which stands for \"copy files\" is used for\
    \ copying files. Note that the file is not deleted from its initial location and\
    \ a duplicate of the same is made at the specified. Type the following command:\n\
    ```bash\ncp first me\n```\nThe command above will make a duplicate of the file\
    \ `first` at the same directory but with a new name, is `me`. If the file `me`\
    \ exists in the directory, it will be overwritten and you will not be warned before\
    \ this command is executed. Consider the command below:\n```bash\ncp -i first\
    \ me\n```\nNotice that in the above command we have added the `-i` option. If\
    \ the file `me` exists in the directory, you will be notified before it is overwritten.\
    \ Next, try the following command:\n```bash\ncp -i /d/file\n```\nWith the above\
    \ command, the file `/d/file` will be copied into the same current directory and\
    \ then named `file`. Note that we have used the `-i` option so if it already exists\
    \ we will be notified before it is overwritten.\n\nYou might also need to copy\
    \ all the files contained in a particular directory to another directory. This\
    \ can be achieved as follows:\n```bash\ncp -dpr sourcedirectory destinationdirectory\n\
    ```\nAll the files in the directory `sourcedirectory` will be copied to the directory\
    \ `destinationdirectory`. Notice that we have used the option `-dpr`. This means\
    \ the following:\n- `-d` means that links will be preserved\n- `-p` – file attributes\
    \ will be preserved\n- `-r` – copying will be done recursively\nIt is good to\
    \ specify those options if needed while copying all the files from a directory,\
    \ otherwise, the default settings will be applied which might produce an unwanted\
    \ result To show the amount of space on a disk used on each of the mounted file\
    \ systems, use the command `df`.\n\n## ‘Less’ Command\nThe `less` command is the\
    \ same as the `more` command. The difference comes in that with this command the\
    \ user can page up or down through the file. Consider the example below:\n```bash\n\
    less first\n```\nThe above command will display the contents of the file `first`.\n\
    \n## ‘Ln’ Command\nThis command creates a symbolic link to a certain file. Write\
    \ and run the following command:\n```bash\nln -s first link\n```\nThe command\
    \ above will create a symbolic link named `slink` which will link to the file\
    \ `first`. The command `ls -i first link` will show that the two files are different\n\
    \n## ‘Locate’ Command\nThis is used for searching in the database. Run the following\
    \ command:\n```bash\nlocate -u\n```\nA database named `locate` will be created.\
    \ This will take some time, so be patient. Before will be able to search for a\
    \ file, this command must run first. However, on most systems, `cron` will run\
    \ this command on periodical basis. Again, run the following command:\n```bash\n\
    locate whois\n```\nThis command will look for files in your system whose name\
    \ contains the string `whois`.\n\n## ‘Logout’ Command\nThe command is used to\
    \ logout the user is currently logged into the system. Just go to the terminal\
    \ and type this command:\n```bash\nlogout\n```\nYou will then be logged out and\
    \ returned to the login screen.\n\n## ‘Ls’ Command\n`ls` stands for list. It is\
    \ used for listing files in a directory. However, it comes with many options which\
    \ need be known as well. If you need to list all files in the current directory\
    \ except starting with `.` then type in the command:\n```bash\nls -a\n```\nThe\
    \ figure above is the directory and contains the files shown. Note that only the\
    \ file names will be listed You might need to show more details about the files\
    \ in the directory such as ownership permissions, their size, time and date stamp,\
    \ etc. This can be achieved with the following command:\n```bash\nls -l\n```\n\
    As shown above `ls-l` is more extensive compared to the previous command. You\
    \ can use it if you want more details about the file.\n\n## ‘More’ Command\nSend\
    \ contents of a file one page at a time to the screen. It can also work on output.\
    \ Let us list the contents of the file `/etc/profile` to the screen. This is an\
    \ in-built file, meaning that it comes with the operating system and it contains\
    \ the profiles for the users of the system Note that the contents of the file\
    \ will be displayed one page at a time. This is because the content is too big\
    \ to be displayed on a single page. Consider the command below:\n```bash\nmore\
    \ /etc/profile\n```\nThe command will list all files in the directory and output\
    \ will be piped through `more`. If the output from the directory can’t fit in\
    \ one page, it will be listed on an additional page.\n\n## ‘Mv’ Command\nThis\
    \ command stands for \"move\" and is used for renaming or moving files. Consider\
    \ the command below:\n```bash\nmv -i first first2\n```\nThe file will be moved\
    \ from `first` to `first2`, meaning it will be renamed to `first2` rather than\
    \ `first`.\n```bash\nmv /d/first\n```\nThe above command will move the file `first`\
    \ from the directory `/d` to the current working directory. Now you have seen\
    \ how the `mv` command is a powerful tool Now that we have been talking of working\
    \ directories, what are they exactly? And how can we know which directory they\
    \ are? Just type the command:\n```bash\npwd\n```\nAfter pressing the enter key,\
    \ you notice that the output is a directory. This shows the directory you are\
    \ currently in. The abbreviation `pwd` stands for \"print working directory\"\
    \ and is used for the purpose to show the current directory.\n\n## ‘Shutdown’\
    \ Command\nThis command is used for shutting down the system. The purpose of this\
    \ command is to halt the current process and shut down the system immediately.\
    \ To do this use the following code:\n```bash\nshutdown -h now\n```\nThe next\
    \ command is used to reboot the system, meaning that it will immediately shut\
    \ down and restart the system. To do this use the command below:\n```bash\nshutdown\
    \ -r now\n```\n\n## ‘Whereis’ Command\nThis command is used for showing the manual,\
    \ source, and binary files for a command. Consider the command below:\n```bash\n\
    whereis ls\n```\nThis command will show the manual and binary files for the command\
    \ `ls`. To see the list of commands which have been on your system previously,\
    \ use the command `history`: Above is the list of commands which have been run\
    \ on my system. You can try on your system and observe the output.\n\n## ‘Sudo’\
    \ Command\nThis stands for \"superuser do\". It has the purpose of allowing a\
    \ permitted user to execute commands as a \"superuser\". This is usually defined\
    \ in the `sudo`-er’s list. It has the importance of ensuring security by making\
    \ sure that sensitive commands are only executed by the correct people. Another\
    \ command, the `su` command enables you to log in to the system as a superuser.\
    \ The purpose of `sudo` is to borrow privileges from the superuser. This explains\
    \ the difference between these two commands, the `su` and the `sudo` commands.\
    \ The `sudo` command is normally used in commands which will change the system\
    \ files, such as when updating or upgrading the OS. This shows how secure the\
    \ command is compared to the `su` command.\n\n## ‘Mkdir’ Command\nThis command\
    \ stands for \"make directory\". It creates a new directory and names its path.\
    \ If this path is already in existence, an error saying that the folder cannot\
    \ be created will be outputted. Consider the figure shown below: I have made a\
    \ directory named \"m\". Once I list the available directories after creating\
    \ the directory, I find that it has been created. Notice that I have run the command\
    \ as `sudo`. Without this, the command won’t run. This is for security purposes.\
    \ Once you use the `sudo` command for the first time, you will be prompted to\
    \ provide the password for the superuser to do so. It is good to note that you\
    \ can only create a directory inside a folder and you must have a \"write permission\"\
    \ on that folder. Otherwise, you will be unable to.\n"
