- "# 编程与编码：IoT 开发、Java、Java EE、Java Swing、JavaScript、jQuery、JSON、Julia 编程、Junit、内核、Kotlin、Laravel、Laravel\
  \ 框架、LaTeX、LibGDX、LINQ 与 Linux\n\n\n\n![](img/image_rsrc4MV2.jpg)\n\n[@SuccessAnalytiX](https://successanalytics.blogspot.com/)\
  \ Copyright © 2020 Jerry Ramonyai 版权所有\n\n\n# 第一部分 智慧\n## 科学、工程与技术\n业务运营、数据、计算机、人工智能、利润、增长、成功、财富……\
  \ 嘿 Siri，人工智能是什么？\n\n人工智能（AI）是通过机器模拟人类智能过程的过程，例如自然语言处理机器、语音识别机器、机器视觉、专家系统等。它是计算机、机器人或机器执行通常由人类完成的任务的能力，因为这些任务需要人类的智能和判断。人工智能的目标是创建能够思考、学习并执行理智任务（如问题解决、决策、感知和理解人类交流）的计算机和机器。\n\
  \n### 人工智能类型\n- 反应型机器\n- 有限记忆机器\n- 心理理论机器\n- 自意识机器\n\n### 人工智能示例\n- 制造机器人\n- 自动驾驶汽车\n\
  - 智能助手\n- 主动医疗保健管理\n- 疾病制图\n- 自动化金融投资（交易）\n- 虚拟旅行预订代理\n- 社交媒体监控\n- 聊天机器人\n- Siri\n\
  \n### 机器学习\n机器学习是人工智能的一个分支，利用数据分析方法来自动化模型构建活动。机器学习算法使用历史数据作为输入来预测新的输出值。这使得软件应用程序在没有经过显式编程的情况下，能够更准确地预测结果。机器学习用于互联网搜索引擎寻找最佳搜索结果、邮件过滤器查找垃圾邮件、在线商店进行个性化推荐、银行软件检测异常交易、语音识别、自动驾驶汽车等。\n\
  \n### 热门机器学习技能\n- `Python`\n- `R` 语言\n- `SQL`\n- `Java`\n- `SAS`\n\n### 数学\n数学是研究数字及其运算的科学。数学有很多分支，如代数、几何、算术、微积分等。数学让我们的生活变得井条有序，防止混乱，增加推理能力、创造力、抽象思维、空间思维、问题解决能力，甚至是有效的沟通。\n\
  \n### 数学分支\n- 代数\n- 几何\n- 微积分\n- 统计学\n\n### 统计学\n统计学是数学的一个分支，涉及开发收集、解释和展示数据的方法以分析事情发生的概率。这在机器学习和人工智能非常有用。统计学背后的数学理论高度依赖微积分、线性代数和概率论。概率在统计学中起着关键作用，帮助人们对大群体做出智能且准确的结论。\n\
  \n### 生活中的统计学\n- 医学研究\n- 天气预报\n- 股市\n- 消费品\n- 决策制定\n\n### 热门统计计算\n- 平均值\n- 标准差\n\
  - 回归\n- 假设检验\n\n### 统计分析类型\n- 描述性分析\n- 诊断分析\n- 预测分析\n- 规范性分析\n\n### 工程\n工程是利用科学和技术解决生活问题的行为。工程师通过发明、设计、建造和测试机器、复杂系统、小装置和材料来开发新的技术解决方案，同时考虑生产的实用性、安全性和成本。\n\
  \n### 工程分支\n- 机械工程\n- 化学工程\n- 土木工程\n- 航空航天工程\n- 核工程\n- 电气与电子工程\n- 材料工程\n\n### 科学\n\
  科学是通过遵循系统方法论寻找证据对知识的追求和应用。科学方法论包括进行实验、测量结果和分析信息（数据分析）。科学为日常生活提供解决方案，并通过技术实施这些解决方案。\n\
  \n### 科学类型\n- 数学\n- 计算机与信息科学\n- 物理科学\n- 化学科学\n- 生物科学\n\n### 计算机科学工程\n计算机科学是对计算机器和计算本身的研究。它涵盖了从算法到硬件和软件中实现计算系统的实际问题的各种主题。计算机科学专业的学生学习如何使用计算机和计算过程来解决问题、构建网站、编写机器人、挖掘数据等。计算机科学需要对数学和编程有理解。离散数学、线性代数和图论是计算机科学专业最相关的数学课程。\n\
  \n### 计算机工程\n计算机工程是工程的一个分支，结合了电气工程和计算机科学领域，以创建新的计算机硬件和软件。计算机工程师参与计算机架构的设计。\n\n###\
  \ 编程\n编程或编码是通过编写系统性的指令与计算机通信的行为。计算机和机器可以理解不同的编程语言以执行特定操作。可以使用多种编程语言，如 `JavaScript`、`Python`、`C++`\
  \ 等来完成编程或编码。在学习编程时，只需要学习你需要的内容。通过实践在不了解任何编程语言的情况下学习 `SQL`。编程技能在 IT、数据分析、研究、网页设计等许多领域非常重要。\n\
  \n### 编程分类\n- 过程化编程\n- 函数式编程\n- 脚本编程\n- 逻辑编程\n- 对象导编程\n\n### 如何学习编程\n通过实践而不是仅仅阅读来学习。使用在线资源或课程来帮助。理解基础概念。学习数据结构和算法。构建项目。从\
  \ `SQL` 开始，它是容易的。`SAS`、`R` 编程语言。\n\n### 编程类型\n- 数据压缩\n- 错误控制\n- 密码编码\n\n### 热门编程语言\n\
  - `C++`\n- `Javascript`\n- `PHP`\n- `Python`\n- `Go`\n- `Swift`\n- `Scala`\n- `Elm`\n\
  - `Ruby`\n- `C#`\n- `HTML`\n- `SQL`\n\n### 软件开发\n软件开发是通过创建和维护计算机应用程序（应用）、框架或其他软件的设计、编程、测试和调试代码。\n\
  \n### 软件开发类型\n- 前端开发\n- 后端开发\n- 全栈开发\n- 桌面端开发\n- Web 开发\n- 数据库开发\n- 移动开发\n- 云计算\n\
  - 应用开发\n- API 开发\n\n### 软件类型\n- 软件\n- 免费软件\n- 共享软件\n- 开源软件\n- 系统软件\n- 工具软件\n\n###\
  \ 网络\n网络也称为计算机网络，可以定义为两个或多个计算机的连接，用于电子化共享数据。网络帮助从电话信息到视频流的一切。\n\n### 计算机网络类型\n-\
  \ `LAN`（局域网）\n- `PAN`（个人区域网）\n- `MAN`（市域网）\n- `WAN`（广域网）\n\n### 网络职业\n- 网络管理员\n\
  - 计算机系统专家\n- 网络架构师\n\n### 网络优势\n- 打印机等设备\n- 软件许可费用\n- 通信\n\n### SQL\n`SQL` 代表结构化查询语言，是一种用于处理数据库的高频编程语言。数据库是数据的系统集合；它是以表格形式存储组织数据的数据结构。你可以将数据库视为电子档案柜。`SQL`\
  \ 语句用于执行任务，如在数据库上 `insert`、`retrieve` 数据、创建数据库、修改行和列等。数据库管理系统 (`DBMS`) 允许用户使用 `SQL`\
  \ 语言与数据库通信。\n\n### 建模\n数据库建模是生成数据库逻辑结构的过程，显示决定数据如何存储和访问的关系和约束。这类似于在档案柜上贴标签和名称。四种数据模型是：层次模型、网络模型、实体关系模型和关系模型。`SQL`\
  \ 因为其基于英语而很容易掌握。它比大多数编程语言简单。它的语法较小，不同概念也少，因此非常受欢迎并广泛使用。你可以在不需要了解任何编程语言的情况下通过实践自学\
  \ `SQL`。一旦你掌握了 `SQL` 的基础并知道如何运行查询，就可以获得认证。`SQL statements` 用于 `SQL` 的视觉化呈现。\n\n\
  ### 四个主要 SQL 关键字\n- `SELECT`\n- `INSERT`\n- `UPDATE`\n- `DELETE`\n\n### 数据库的优势\n\
  - 改进数据共享和管理\n- 提高数据安全性\n- 更可靠的数据集成\n- 减少数据不一致性\n- 改进数据访问\n\n### 数据库类型\n- 集中数据库\n\
  - 分布式数据库\n- 个人数据库\n- 用户端数据库\n- 商业数据库\n- `NoSQL` 数据库\n- 业务数据库\n- 关系数据库\n\n### 所需工作\n\
  - 数据仓库\n- ETL 开发\n- 数据库管理\n- BI 开发\n- 数据科学家\n- 软件工程师\n\n### 学习 SQL 的最佳网站\n- YouTube\n\
  - WiseOwl\n- SQLZOO\n- Oracle LiveSQL\n- W3resource\n- Stack Overflow\n- GitHub\n\
  - SQL Fiddle\n- Coding Ground\n- khan academy\n- Codeacademy\n- SQLcourse.com\n\
  - FreeCodeCamp\n\n### 四种 DBMS 类型\n- 层次数据库\n- 网络数据库\n- 关系数据库\n- 对象导数据库\n\n### DBMS\
  \ 示例\n- `MySQL`\n- `PostgreSQL`\n- Microsoft Access\n- `SQL Server`\n- `FileMaker`\n\
  - `Oracle`\n- `RDBMS`\n- `dBASE`\n- `FoxPro`\n\n### 数据、信息与技术\n数据、信息、批判性思维、知识、智慧、成功、财富……\
  \ 信息是一个。数据可以定义为信息的片段和碎片，如事实、数字、单词、测量、观察或描述。数据产生信息，信息产生知识，智慧是成功的关键要素。\n\n## 大数据\n\
  信息是中心，这就是为什么大数据对业务非常重要。大数据是指规模巨大且随时间指数级增长的数据。公司不断收集信息以帮助他们做出良好决策并在领域取得成功。这种信息不断增长，因此被称为大数据。数据库通常以表格形式存储信息。数据库可以存储大量数据（即大数据），并可以轻松地搜索数据、添加新数据或删除旧数据。`SQL`\
  \ 语句用于执行任务，如在数据库上 `insert`、从数据库 `retrieve` 数据、创建数据库、修改行和列等。数据库管理系统 (`DBMS`) 允许用户使用\
  \ `SQL` 语言与数据库通信。\n\n\n\n\n## 信息技术概述\n\n信息技术（IT）是业务运营的核心。企业严重依赖 IT 来提供其产品和服务。企业完全依赖\
  \ IT 来执行其日常运营，然而，这种对 IT 的依赖也是重大风险的来源，因为如果使用不当，IT 系统可能会导致企业无法提供其产品和服务，从而影响企业的运营绩效。企业使用\
  \ IT 来提供产品和服务、进行创新、实现战略目标，并通过卓越的运营获得整体竞争优势。\n\n没有信息就没有成功。你必须能够收集和分析信息才能获得成功。这就是为什么阅读如此重要的原因。分析信息是一种思考的形式，人类对信息的需求就像公司对大数据一样。这就是为什么数学如此重要的原因。数学是分析，分析是思考，思考需要信息，而信息通向成功。这就是成功分析。\n\
  \n## 信息技术示例\n* 电话和无线电。\n* 互联网。\n* 视频会议设备。\n* 计算机。\n\n## 信息技术职业\n* 技术支持。\n* Web 开发人员。\n\
  * 计算机系统分析师。\n* IT 安全。\n* 网络工程师。\n* 数据库工程师。\n* 软件开发人员。\n\n## 大数据分析师所需的 5 项技能\n* 编程。\n\
  * 数据管理。\n* 计算框架。\n* 定量分析与统计学。\n* 业务知识。\n\n## 高薪大数据工作\n* 定量分析师。\n* 数据科学家。\n* 统计师。\n\
  * MI（管理信息）和 BI（商业智能）专家。\n\n## 大数据专业人员技能\n* `Qlik View`、`Tableau`、`Power BI` 和 `Excel`。\n\
  * `Alteryx`、`Spotfire`、`Scala` 和 `Presto`。\n* `SAS`、`R`、`Python`、`Java`、`XML` 和\
  \ `HTML`。\n* `VB.NET`、`Azure`、`C`、`C++` 和 `C#`。\n* `Cloudera`、`Cassandra`、`HDFS`\
  \ 和 `Teradata`。\n* `Oracle`、`SQL`、`NoSQL` 和 `Hadoop`。\n* `Informatica`、`IBM`、`AbInitio`、`ERP`\
  \ 和 `SAP`。\n* `AWS`、`Talend`、`Spark`、`Reltio` 和 `DevOps`。\n\n## 大数据\n数据管理、决策、信息、增长、成功、财富……\n\
  数据科学、数据管理、数据架构、数据工程师、这个数据、那个数据、等等数据……\n\n## 数据管理\n数据管理是将数据存储和维护为组织价值资源的实践，以释放其潜力。管理数据需要稳健的数据策略，以及关于如何访问、集成、清洗、治理、存储和为分析准备数据的计划。`Data\
  \ Architects` 必须设计如何有效高效地使用 IT 基础设施，以支持并最大化组织对数据的使用。\n\n## 数据架构\n数据架构是 IT 基础设施如何支持数据战略的概述或计划，展示了数据如何获取、传输、存储、查询和保护。它是一套规则、政策、标准、图表和模型，用于规范和解释数据如何在组织内部使用、存储、管理和整合，以确保数据的有效利用。数据架构的目的是展示数据、业务目标与运营策略之间的关系。\n\
  \n## 数据科学\n数据科学是一个多学科领域，利用科学方法、流程、算法和系统来管理数据，并从结构化和非结构化数据中提取知识和洞察。它侧重于通过创建可持续的数据管理方式并寻找确保业务从数据受益的方法，来寻找大数据问题的解决方案。数据科学包含了数据管理和数据分析。它是数学、统计学、业务和技术的融合。\n\
  \n数据科学、信息管理、数据管理、数据工程、数据仓储和数据分析在工作环境中经常互换使用，这是好事，因为它们几乎是同一件事，然而，有些人喜欢花时间试图区分它们。不要这样做。不要故意浪费时间。你有更重要的事情可以花时间去做。正如你将在本书书中看到的，时间是成功的关键要素之一。只要你的职业围绕大数据展开，那么你的职位名称可以是任何与数据相关的名称，这个数据、那个数据、等等数据。你只需要知道\
  \ `SQL`、`SAS`、`Excel`、`Python` 和 `R` 即可。至少其中两个。这就是你需要的全部。\n\n## 数据科学工程师的基础技能\n*\
  \ 数据分析（`Microsoft Excel`）。\n* 数据库管理（`SQL`）。\n* 数据质量知识（`DMBOK` 原则）。\n\n## 数据科学工程师的高级技能\n\
  * 使用 `Python`、`R` 或 `SAS` 编程。\n* 对概率和统计学的坚实理解。\n* 数据可视化工具（`PowerBI`）。\n\n## 数据管理的组件\n\
  * 商业智能。\n* 数据架构。\n* 数据治理。\n* 数据集成。\n* 数据建模。\n* 数据质量。\n* 数据安全。\n* 数据仓储。\n\n## 大数据工作的常用技能\n\
  * `SQL`、`R`、`Python` 或 `SAS` 编程语言。\n* `Microsoft Excel`。\n* 批判性思维。\n* 数据可视化（仪表板）。\n\
  * 演示技巧。\n* 机器学习和 AI。\n* 数据仓储。\n* ETL 工具（`SSIS`）。\n* 数据 API。\n* 编码和编程语言。\n* 算法和数据结构知识。\n\
  \n## 数据处理的六阶段\n* 数据收集。\n* 数据输入。\n* 数据处理。\n* 数据分析。\n* 数据报告。\n* 数据存储。\n\n## 开发成功的数据架构\n\
  * 评估工具和系统的工作原理。\n* 定义业务目标和目的。\n* 为数据结构制定整体计划。\n* 选择数据管理和可视化工具。\n\n## 如何成为数据科学工程师\n\
  * 学习基础数学和统计学。\n* 学习编码。\n* 理解数据库。\n* 学习 `microsoft Excel` 和 `SQL`。\n* 获得技术或计算机科学学位。\n\
  * 申请工作。\n\n## 大数据工作\n* 数据科学家。\n* 数据分析师。\n* 数据工程师或数据架构师。\n* MI 或 BI 分析师。\n* 机器学习或\
  \ AI 工程师。\n* 定量分析师或统计师。\n\n## 常见数据类型\n* `Boolean`（真或假）\n* `Character`（a, b, c...）\n\
  * `Date`（03/01/2021...）\n* `Double`（1.54343534532e308）\n* 点数（1.234455）\n* 整数（1234....）\n\
  \n## 免费数据库管理软件\n* `Microsoft SQL server`。\n* `SolarWinds`。\n* `Dbvisualizer`。\n\
  * `Manageengine applications manager`。\n* `Oracle rdbms`。\n* `Ibm db2`。\n* `Teradata`。\n\
  \n## 数据策略\n数据策略、信息、决策、增长、成功……\n这就是组织使用数据的方式。\n\n## 数据分析（图表与仪表板）\n数据管理团队产生的数据帮助分析团队创建仪表板，推动业务并确保商业智能是组织竞争优势的关键要素之一。分析团队接收业务部门的仪表板需求并向数据管理团队请求数据。仪表板创建后，分析团队维护仪表板，数据管理团队维护供给仪表板的数据。创建仪表板的数据需求来自内部分析团队或业务部门。数据管理团队的主要目标是根据可用资源（资金、材料、机器和人力）支持分析团队产生尽可能仪表板。\n\
  \n## 自动化\n在项目结束后，将对新仪表板的数据流程进行优化和自动化。\n\n## 可靠性跟踪\n对产出进行基准测试，以确保团队的可持续性、一致性和可靠性。\n\
  \n## 敏捷（项目管理方法）\n数据管理团队从分析团队接收 90% 的项目。接收需求后，团队将使用敏捷方法尽快完成任务。这涉及到将任务分解为较里程碑，并在每两周的冲刺中完成里程碑。失败和成功的项目都计入这\
  \ 90%。\n\n## 质量保证与控制\n数据管理团队负责项目实施阶段和自动化后的质量监控。数据质量合规性由数据管理团队完成。\n\n## 成功的要素\n就业、业务、资源、信息、增长、成功……\n\
  \n\n\n\n成功是一种算法。\n\n### 成长\n要在生活中取得成功，你必须不断成长。成长意味着不断向你的大脑输入信息。信息可以来自许多资源，如书籍、视频、音频等。这就是为什么大多数成功人士读的书比任何人都都要多。要获取信息，你需要物质材料和人。要从物质中获取信息，你需要具备管理时间、技术和钱的能力。要从人获取信息，你需要具备激励、鼓励和与他人共情的能力。\n\
  \n## 信息\n没有什么知识不是力量。信息以不同的形式、形状和风格存在。你需要在特定的时刻拥有适合你的信息。你的大脑每秒都有不同的视角，这是因为你的大脑每秒都在通过你所有的感官收集信息，因此，如果你在一秒后获取信息，你一秒前收到的信息感知会有所不同。这就是为什么你必须不断学习和成长。这也解释了为什么没有什么知识不是力量，因为当你的视角改变后，无关的信息在一秒后可能变得相关。\n\
  \n## 管理技能\n为了能够处理时间、技术和钱，你需要技术技能，如规划、组织、设计和资源控制。这四项技能是关键的管理技能。如果你拥有卓越的管理技能，你将能够有效、高效地利用你的资源，从而获得能够让你取得成功的相关信息。\n\
  \n## 领导力\n为了能够激励、鼓励并与他人共情，你需要软技能，如沟通、倾听、正直、团队合作等。这被称为领导力。如果你能有效运用你的领导力，你就能从人们那里获得你想要的所有与成功相关的信息。一个领导者必须意识到人需要被激励，需要被鼓励，并且通过健康和福祉来获得能量。\n\
  \n## 金钱\n生活中的每个人都需要收入来源。我们需要钱来生存。我们需要钱购买食物、住所以及生活中所有必需品。最重要的是，我们需要钱来直接或间接地购买信息。这就是为什么生活中的大多数人会工作或创业。找工作、赚钱和致富将在下详细说明。\n\
  \n## 技术\n技术是赋予人类获取信息巨大竞争优势的最大物质材料之一。这就是为什么信息技术正在改变世界，这也是为什么第四次工业革命实际上是信息技术。能够让你接近信息的技术才是值得保留的技术。\n\
  \n## 人\n大脑是人类非常复杂的器官。大脑存储着人类拥有的所有信息，为了让你能够获取这些信息，此人必须处于正确的情绪状态。要让一个人处于正确的情绪状态，他们所有的需求都需要得到照顾，包括健康、能量和被激励的需求。\n\
  \n## 成功原则\n-   自我教育。\n-   明智地选择职业。\n-   每五年投资一次。\n-   偿还坏债。\n-   避免生活膨胀。\n-   嫁对的人。\n\
  -   不要考虑无用的事情。\n-   先计划后行动。\n-   失败是学习的机会。\n-   学习财财知识。\n-   管好自己的事。\n-   利用税收优势。\n\
  -   永停止学习。\n-   机会永远在那里。\n-   思想和行动创造成功。\n-   成长，而非竞争。\n-   引导你的思维积极思考。\n-   为机会存钱。\n\
  - 低于消费水平生活。\n-   每日追踪支出。\n-   主控自己的生活。\n-   不要指责，承担责任。\n-   眼放远大。\n- 设定 SMART 目标。\n\
  - 接受变化。\n- 精通时间管理。\n-   与赢者在一起。\n-   照顾好你的健康。\n\n## 领导力\n情绪智能、管理、生产力、信息、成长、成功、财富……\n\
  \n领导力处理人，管理处理其他资源。领导力是确保每个人都能有效、高效地实现目标的能力。生活充满了让人们偏离计划并无法实现目标的问题。当问题出现时，就需要领导力和管理。领导力处理的是人而不是问题。管理处理的是问题而不是人。领导力在保持每个人专注、受激励并赋能以提高生产力方面发挥着巨大作用。领导力的目标是确保每个人都感到平静。领导者应该更多地关注人的福祉，而经理应该关注解决技术问题。\n\
  \n## 权威\n领导力不是为了解决技术问题，那是经理的工作。经理的工作是确保他们消除给人们生活带来压力的问题。领导者的工作是确保人们感到平静，因为他们知道经理正在解决问题并进行授权。这意味着领导者必须传达“问题正在解决”的信息，他们必须与人们共情，建立信任，如果问题没有解决，领导者将必须解决可能出现的冲突。经理应该制定一个计划来解决技术问题并分配任务。这意味着你应该知道何时充当领导者，何时充当经理。如果你混淆了两者，你就完蛋了。领导力和管理都是技能，意味着它们是可以学习的。读读书即可。\n\
  \n## 管理与领导力\n事情通常不会按照计划进行，当这种情况发生时，你需要有人介入并确保问题得到解决（经理），并确保人们保持专注不恐慌（领导者）。领导者必须给人们希望。这可以通过以身作则和设定一个大家共同关注的愿景来实现。设定要关注的目标有助于人们一直坚持下去，因为知道即使短期内出现问题，他们也有一个明确的目标要实现，人们会一直努力直到实现目标。\n\
  \n\n\n## 管理与领导力\n\n管理与领导力是相互依赖的。管理者必须具备领导能力，而领导者也应该具备管理能力。领导者应当领导，这意味着他们应该与人互动，完成后，他们应该处理眼下的问题。管理者应该处理问题，然后通过与人互动来引导他们。\n\
  \n永远不要管理人。要管理问题并引导人。解决问题被称为管理；让人们感到安心被称为领导力。你既需要这两项技能，也应该知道何时以者的身份行动，何时以领导者的身份行动。\n\
  \n教学、指导、辅导和授权。当出现问题时，没有任何人能够解决所有问题，因此领导者和经理需要能够辅导、指导并激励每个人，以便在情况不利时他们准备介入并掌控局面。\n\
  \n## 领导力的核心价值\n\n这是一份优秀的价值观列表，如诚实、自信、尊重、共情等。你应该列一份你想要学习的核心价值观清单，并优先学习和掌握这些价值观。强大的核心价值观是优秀领导者的特质。\n\
  \n## 谈判\n\n你必须能够用更少的资源（即时间、精力和金）完成所有工作。做到这一点的一种方法是对你的资源进行谈判以获得更好的交易条件。由于领导力涉及人，领导者必须学习如何谈判。\n\
  \n这可能包括批量购买资源并谈判以获得更好的折扣。保持职业道德和诚实至关重要。不要滥用你的权力进行谈判并向人们提供低于合理的报酬。生活中的一切都是通过能量连接在一起的，如果你不遵守道德，你释放的负能量将反噬到你身上。那是另一个故事的话了。我会专门写一章节关于谈判。\n\
  \n## 建立关系\n\n领导者必须能够与他们联系的所有保持联系。沟通是一切的核心。领导者必须利用所有可用工具与每个人进行有效高效的沟通，而信息技术正在让这一切成为可能。\n\
  \n## 优秀领导者的价值观\n\n* 诚信\n* 授权能力\n* 沟通\n* 自我意识\n* 感恩\n* 敏捷\n* 影响力\n* 共情\n* 耐心\n\n\n\
  \n\n# 如何成为优秀的领导者\n\n- 实践个人成长。\n- 成为良好的团队伙伴。\n- 每天阅读。\n- 提供愿景。\n- 优化组织结构。\n- 设置明确的沟通协议。\n\
  - 授权。\n- 学习冲突管理策略。\n- 教练、指导与教学。\n- 诚实且开放地沟通。\n- 鼓励人们阅读。\n- 培养积极的态度。\n- 设置明确的目标和期望。\n\
  - 关注结果而非过程。\n- 建立自信。\n- 回答问题。\n- 准确地告诉人们你想让他们做什么。\n- 不要让人过度工作。\n- 以身作则。\n- 不要生气，只需重复你说过的话。\n\
  \n## 如何成为良好的团队伙伴\n\n- 分享信息（询问并回答问题）。\n- 关注目标和结果，而不是过程。\n- 公平、积极且给予支持。\n- 欣赏多样性的好处。\n\
  - 学习领导力技能。\n- 保持条理。\n- 设定明确的目标。\n- 拥有强大的价值观。\n- 支持承担风险和改变。\n- 为每个团队成员设定明确、具体的角色。\n\
  - 鼓励多样化思维。\n- 公均匀分配工作。\n- 关注正确的事。不要偏袒。\n\n## 核心团队合作技能\n\n- 沟通。\n- 冲突解决。\n- 问题解决。\n\
  - 倾听。\n- 批判性思维。\n- 协作。\n- 领导力。\n- 谈判。\n\n## 如何教学、指导和教练\n\n- 鼓励主动学习。\n- 给出建设性反馈。\n\
  - 尊重不同的天赋和学习方式。\n- 善于倾听并理解。\n- 保持耐心。\n- 多读书。\n- 不作判断。\n- 对不同意见保持开放。\n- 给出示例和观点。\n\
  - 回答问题。\n- 提出开放式问题。\n- 学习情绪智能。\n\n## 领导力与管理风格\n\n- 专制型领导。\n- 权威型领导。\n- 标杆型领导。\n\
  - 亲和型领导。\n- 放任式（或自由放式）领导。\n- 参与型领导。\n- 授权型领导。\n- 交易型领导。\n- 变革型领导。\n- 官僚型领导。\n- 魅力型领导。\n\
  - 教练型领导。\n- 民主型领导。\n- 协作型领导。\n- 指令型领导。\n- 愿景型领导。\n\n## 核心领导特质\n\n- 自我发展。\n- 团队发展。\n\
  - 伦理实践与良好治理。\n- 创新。\n- 沟通。\n- 愿景。\n- 共情心。\n- 责任感。\n- 感恩。\n- 慈悲。\n- 信心。\n- 决策能力。\n\
  - 诚信。\n- 谦虚。\n- 韧性。\n- 影响力。\n- 积极。\n- 启发。\n- 战略与批判性思维。\n- 开放心态与创造力。\n- 灵活。\n- 可信赖。\n\
  - 诚实。\n- 忠诚。\n- 印象管理。\n- 果断力。\n- 倾听。\n- 给予反馈。\n- 时间管理。\n- 规划与执行。\n- 组织与授权。\n- 激励。\n\
  - 智慧。\n- 相关知识。\n\n## 时间、技术、管理、生产力、增长、成功、财富……\n\n领导力让人感觉更好，而管理解决问题。你这两项技能都需要。\n\n\
  成功是在个人生活的各个领域持续获得最佳结果的能力。成功带来财富。成功来自持续的增长，而增长由信息带来。为了获取信息，你需要五种主要资源：时间、金、能量、技术和人。无论多少，每个人都有这五种资源。数量并不重要，重要的是你如何利用这些资源来实现成功。\n\
  \n要成功使用这五种资源，你需要两种技能：管理和领导力。领导力技能帮助你有效高效地处理人际关系，以便从人们那里获得想要的所有信息。管理技能帮助你有效高效地利用其他四种资源（时间、金、能量和技术），以便从这其他四种资源中获得想要的所有信息。\n\
  \n### 管理\n\n管理资源意味着规划、组织、设计和控制你的资源（时间、金、能量和技术）。规划包括设定目标并决定用于实现目标的策略。组织包括安排你的资源（时间、金、能量和技术）以实现目标。\n\
  \n建立战略意图。战略意图是你计划在未来实现的以达到根本目的的内容。愿景、使命和价值观声明是用于设定战略意图的工具。你的愿景解释了你想成为什么。你的使命声明解释了为了成为未来想成为的样子，现在应该是什么，它解释了你将如何为生活带来改变。价值观是你为了支持愿景和使命必须遵循的行为。目标是为了实现使命和愿景而必须采取的。你必须制定战略愿景，设定目标，设计实现目标的策略，实施并执行所选策略，评估绩效并启动纠正调整。\n\
  \n####管理的四项核心职责\n- 规划\n- 组织\n- 设计\n- 控制\n\n### 管理规则\n- 明确你的目标并分享你的愿景。\n- 为人们创建一个路线图。\n\
  - 教学并以身作则。\n- 教学并授权。\n- 帮助人们解决问题。\n- 将大部分时间花在规划上。\n- 保持一致。\n- 保持透明。\n- 认可所有的意见和想法。\n\
  - 对每个人区别对待。\n\n## 权力影响力、领导力、管理、人、信息与成功……\n\n权力意味着巨大的责任。权力是行动以及对他产生影响的能力，无论是通过礼貌的方式还是侵略的方式。你可以通过成为一名优秀的领导者以礼貌的方式影响他人。优秀的领导者每天阅读并成长。糟糕的领导者通常由于管理地位而具有侵略性。\n\
  \n影响他人并掌控他人是一项非常有挑战的任务，因为人有情感，如果被对待不好，他们会报复。真正的权影响源于学习人们的情绪、掌握沟通艺术并努力理解人们不同的观点。要影响他人，你必须擅长满足人们的需求。如果人们从你那里获得价值，他们通常会倾听，因此，如果你帮助他们解决需求，你就为他们的生活增加了价值，从而能够影响他们。要让你掌控他人，你必须拥有他们需要的东西。如果人们对你没有任何需求，你就没有权力。人们在生活中需要的一些东西是金钱、时间和信息。如果你能为人们提供这些资源，你就可以影响他们。因为这些资源是成功的要素，每个人都想成功。\n\
  \n### 权力的原则\n- 始终留出可用的金钱。\n- 比你认识的所有人都要读得多。\n- 少说多想。\n- 不要暴露。\n- 用钱买时间。\n- 不要信任任何人。\n\
  - 提高你的时间管理技能。\n- 计算一切。\n- 不要试图给别人留下印象，关注正确的事。\n- 每天锻炼。\n\n\n\n\n\n# 如何影响他人\n- 展现你的魅力（同理心）。\n\
  - 倾听他人的。\n- 关注人们的需求。\n- 为他人的生活增值。\n- 非常擅长解决冲突。\n\n## 谈判规则\n- 多听少说。\n- 运用沉默的力量。\n\
  - 提问。\n- 保持公平。\n- 在谈判前明确你想要什么。\n- 目标是实现双赢谈判。\n- 学习冲突解决策略。\n- 做好准备。\n- 制定策略。\n- 保持简单。\n\
  \n### 批判性思维\n思考、计划、确定优先级……\n如果你不计划，你就是在计划失败 ——`本杰明·富兰林`。\n\n思考是一种处理信息、建立联系、做出决策和创造新想法的精神活动。思考也可以被看作是在脑中制定待办事项的过程。思考是迈成功的第一步。生活中要做的事情太多了，但只有\
  \ 20%%的事情会带来成功，因此每个人在行动之前都必须进行思考并相应地确定优先级。采取行动时，从那些带来成功的活动开始。每一个念头都必须写下来。这有助于显化、思维分析和计划。\n\
  \n### 批判性思维\n批判性思维是清晰、理性地遵循逻辑来决定该做什么或相信什么的能力。它是一种进行反思性思考的能力，理解观点之间的逻辑联系，并理解事物何地、如何、何时、什么以及为什么是现在这样。它是关于尽可能多提问，直到你获得所需的所有信息。信息引导增长，增长带来成功，成功带来财富。\n\
  \n批判性思维有助于做出良好的决策。你必须能够权衡问题解决方案的优缺点。你必须查看所有可用数据，并根据提供的数据权衡优劣做出明智的决策。大数据之所以流行正是由于这个原因。经理可以使用大数据做出良好的决策。\n\
  \n### 制定待办列表\n你应该能够确定事情发生的什么、何时、为什么、何地以及如何。这被称为调度。不这样做会导致灾难，简单直接。把每一个细节都写下来。准备一份待办列表、一个任务日历和每个里程碑的检查清单。这将有助于任务显化、执行过程的可视化以及问题的分析。\n\
  \n### 风险管理\n你必须能够计划并管理可能出错的事情。生活中事情通常会出错，这是定数。这是因为与计划不同，生活是时间敏感的，像延迟交货这样简单的事情就可能导致巨大的灾难。你必须预判可能出错的地方，并计划在这种情况下怎么办。这就是风险管理包含的内容。\n\
  \n### 如何进行批判性思考\n- 重构信息。\n- 评估后果。\n- 提问。\n- 保持观察力。\n- 每天阅读。\n- 查看历史数据。\n- 研究。\n\
  - 寻找事实、数字或科学。\n- 善于分析，拆解信息。\n\n### 批判性思维过程\n- 观察\n- 调查\n- 分析\n- 解释\n- 评估\n- 反思\n\
  \n## 决策与问题解决\n问题、信息、决策、增长、成功与财富……\n失败是学习的机会。解决问题是定义问题、确定问题根源并寻找解决方案的行为。你解决的问题越多，你就变得越富有、越成功。\n\
  \n### 解决问题的过程\n- 描述问题。\n- 拆解问题。\n- 找到根源。\n- 研究并阅读直到直到找到解决方案。\n- 实施解决方案。\n- 衡量结果。\n\
  \n### 解决问题的技能\n- 积极倾听。\n- 批判性与创造性思维。\n- 研究与阅读。\n- 沟通。\n- 决策。\n- 团队合作。\n\n### 决策\n\
  决策是收集信息、评估后果并选择一个负面后果较少的选项的过程。优秀的决策者会选择能为所有人带来最佳结果的行动。他们在保持开放心态的同时进行研究、权衡后果并做出理性的决策。\n\
  \n### 决策过程\n- 识别替代方案。\n- 收集相关信息。\n- 权衡后果。\n- 选择。\n- 采取行动。\n- 审查你的决策。\n\n### 创造性思维\n\
  创造性思维是以新方式考虑某事的能力，例如对问题有新方法，或从数据集中获得新结果。这是一个你的大脑为问题产生新的、不寻常且有效的解决方案的过程。\n\n### 如何培养创造性思维\n\
  - 头脑风暴创意。\n- 重新定义问题。\n- 保持开放和灵活。\n- 使用你的想象力。\n\n## 提高记忆的方法\n- 阅读书籍。\n- 尝试鱼油补充剂（`Omega\
  \ 3`）。\n- 保持健康体重。\n- 少饮酒。\n- 运动。\n- 尝试冥想。\n- 喝咖啡。\n- 充足睡眠。\n- 少吃添加糖分。\n\n## 技术技能\n\
  - 编程/编码。\n- 软件熟练度。\n- 项目管理。\n- 数据分析。\n- 技术。\n- 写作。\n- 会计。\n- 工程学。\n- 医学。\n- 解决问题。\n\
  \n## 人际交往技能\n- 团队合作。\n- 沟通。\n- 职业道德。\n- 灵活性与适应能力。\n- 决策。\n- 时间管理。\n- 冲突解决。\n- 倾听。\n\
  - 谈判。\n- 同理心。\n- 果断。\n- 教练、教学和指导。\n\n## 公演演讲\n信息、自信、演讲、金钱、增长、成功、财富……\n练习，练习，练习。\n\
  \n### 公演演讲规则\n- 研究并了解关于你主题的一切。\n- 计划并准备你的演示稿。\n- 练习直到你感到自信。\n- 阅读关于你具体担忧的内容。\n-\
  \ 视觉化你的成功。\n- 做一些深呼吸。\n- 专注于你的演讲，而不是观众。\n- 不要害怕短暂的沉默。\n- 注意你的肢体语言。\n- 演讲前喝杯水。\n\
  - 演讲当天不要喝咖啡因。\n- 积极思考。\n- 观看你演讲的录像。\n- 保持简单。\n- 不要担心与观众的眼神交流。\n- 不要担心你的弱点。\n- 你不一定要讲故事。\n\
  - 逻辑清晰地组织想法。\n- 练习带来自信。\n- 研究主题直到你充满热情。\n- 做你自己。\n- 放慢速度。\n- 永远说真话。\n- 原谅你自己的错误。\n\
  - 研究你的观众。\n- 定义演讲的目标。\n- 准备目标、引言和结论。\n- 保持对话的语气。\n\n### 控制你的演讲时间\n- 疯狂地练习和研究你的主题。\n\
  - 向人们征求反馈。\n- 在舞台上移动。\n- 缓慢呼吸。\n- 恰当运用你的声音。\n- 专注于演讲，而不是观众。\n- 不要害怕短暂的沉默。\n- 注意你的肢体语言。\n\
  - 演讲前喝杯水。\n- 演讲当天不要喝咖啡因。\n- 积极思考。\n- 观看你演讲的录像。\n- 保持简单。\n- 不要担心与观众的眼神交流。\n- 不要担心你的弱点。\n\
  - 你不一定要讲故事。\n- 逻辑清晰地组织想法。\n- 练习带来自信。\n- 研究主题直到你充满热情。\n- 做你自己。\n- 放慢速度。\n- 永远说真话。\n\
  - 原谅你自己的错误。\n- 研究你的观众。\n- 定义演讲的目标。\n- 准备目标、引言和结论。\n- 保持对话的语气。\n- 疯狂地练习和研究你的主题。\n\
  - 向人们征求反馈。\n- 在舞台上移动。\n- 缓慢呼吸。\n- 恰当运用你的声音。\n- 练习，排练。\n- 避免过度使用动画。\n- PowerPoint\
  \ 演示稿应该有 `10` 张幻灯片。\n- 演示稿应该有 `30` 个要点。\n- 提前到达。\n- 在演讲前做好准备。\n- 按时结束。\n- 尽可能在每张幻灯片上用词。\n\
  - 关注你的肢体语言。\n- 如果忘了某些内容，就跳过。\n- 参加在线演讲课程。\n- 使用技巧提升你的自信。\n\n### 演讲类型\n- 信息性演讲。\n\
  - 娱乐性演讲。\n- 演示性演讲。\n- 说服性演讲。\n- 特殊场合演讲。\n- 推销演讲。\n\n### 演讲技巧\n- 流利度。\n- 词汇。\n- 语法。\n\
  - 发音。\n\n## 谈判\n挑战、谈判、解决方案、增长、财富……\n- 一切都是可谈判的。\n- 在谈判前明确你想要什么。\n- 目标是实现双赢谈判。\n\
  - 运用沉默的力量。\n- 询问对方的意见。\n- 将公平的报价放在谈判桌上。\n- 如果报价不公平，就离开。\n- 不要做假设，提问。\n- 不要急于成交，保持耐心。\n\
  - 不要接受不公平的交易。\n- 建立关系。\n- 选择蜂蜜而非醋（注：此处原文可能可能有误，意为选择温和的策略）。\n- 你的情绪不要主宰你。\n- 专注于协作。\n\
  - 在谈判前做好研究。\n- 完成你的作业。\n\n### 谈判阶段\n- 确定目的。\n- 准备。\n- 信息交换。\n- 讨价。\n- 结论。\n\n###\
  \ 谈判技巧的好处\n- 职业发展和增长。\n- 冲突解决。\n- 团队合作。\n- 说服。\n- 解决问题。\n\n## 沟通\n信息、沟通、增长、成功、财富……\n\
  倾听……倾听……\n能够高效地沟通是最重要的技能之一。当你沟通时，确保你的信息是清晰、简洁、完整且礼貌的。有效的沟通不在于说，而在于听。理解对方试图传达的信息。沟通是成功的中心，因为信息导致增长，持续增长导致成功。\n\
  \n### 沟通失败\n沟通失败是误导性的、无效的或冒犯性的信息。不要为了获取知识而造成伤害。如果你感到愤怒并想说伤害人的话，就离开吧。你将在书中学习情绪智技巧。记住，要成功，你需要获取信息。如果你不擅长控制情绪，就会遇到麻烦。\n\
  \n### 成为良好沟通者的技巧\n- 倾听。\n- 肢体语言。\n- 压力管理。\n- 情绪控制。\n- 清晰与简洁。\n- 信心。\n- 开放心态。\n-\
  \ 尊重。\n\n## 倾听\n沟通、倾听、信息、增长、成功与财富……\n不要打断。倾听是准确接收和解释传递给你的信息的能力。倾听是所有有效高效沟通的关键。如果没有有效倾听的能力，信息很容易被误解，信息就会丢失。成功并不容易实现。倾听是你应该掌握的沟通技能。有效的倾听有助于解决冲突、建立信任、激励他人、提高生产力和增长。在对话的大部分时间里倾听，你就会吸收信息，成为良好的沟通者。\n\
  \n### 如何倾听\n注意说话者的言语和非语言，以完全理解他们表达的内容。注意意味着倾听并观察对方而不打断。不要出于任何原因打断对方。如果你想说点，等对方说完后再说。有效的倾听意味着听取对方信息的要点并在脑中或其他地方记录。\n\
  \n### 倾听与问题解决\n如果有人向你提问严肃的问题或他们想要你的建议，认真倾听，不要急于回答，尝试不要立即回答，花一两天思考对方说的话，然后再回答。思考需要时间、精力和努力。不要急于回答。只需告诉对方你需要时间处理他们说的话，你会回复他们。这种策略适用于任何情况，即使你不需要思考，也要花时间思考。如果你花时间思考，就会做出明智的决策。\n\
  \n### 积极倾听\n积极倾听是一种要求听者完全集中、理解并记住所说内容的技术。你必须同情、反思并提取传递给你的信息的要点。积极倾听用于咨询、培训以及解决争议或冲突。你可以通过认真倾听而不回答来解决许多问题。这被称为`橡鸭`效应。\n\
  \n### 倾听的障碍\n倾听是一项非常有挑战性的技能，因为总会有干扰信息传递的因素。对对方信息的干扰可能是肢体动作、内心想法、注意力分散、周围环境的声音或偏见倾听。偏见或选择性倾听是沟通中最大的问题之一。当某人只听他们想听的信息时，偏见倾听是危险的，因为你并没有在倾听。\n\
  \n### 关键倾听技巧\n- 注意。\n- 释义和总结。\n- 不要判断或草率下结论。\n- 通过点头显示你在倾听。\n- 不要打断。\n- 面向对方并保持眼神交流。\n\
  - 提问。\n- 专注。\n\n## 教练\n目标、里程碑、教练、教学、增长……\n在正确的时间提供信息。教练是一个针对当前挑战而非过去或未来的过程。\n\n\
  ### 教练技能\n- 目标设定。\n- 倾听。\n- 同情。\n- 批判性思维。\n- 反馈。\n- 知识与经验。\n- 愿景。\n- 自我意识。\n- 开放。\n\
  - 责任。\n\n## 领导风格\n- 交易型领导力。\n- 变革型领导力。\n- 仆人领导力。\n- 民主型领导力。\n- 官僚型领导力。\n- 放任型领导力。\n\
  - 魅力型领导力。\n- 愿景型领导力。\n- 亲和型领导力。\n- 节奏型领导力。\n\n## 教学\n教学是帮助人们理解并应用知识、概念和过程的过程。者必须教人们如何实现目标。\n\
  \n### 良好教师的特质\n- 沟通技能。\n- 倾听技能。\n- 友好的态度。\n- 职业道德。\n- 准备。\n- 耐心。\n- 创造力。\n- 热情。\n\
  - 奉献。\n- 同理心。\n- 领导力。\n- 对学科的知识。\n\n### 如何教学\n- 告诉人们具体做什么。\n- 帮助纠错。\n- 提供反馈。\n-\
  \ 使用经验学习。\n- 鼓励讨论。\n- 推荐书籍。\n\n### 报告写作元素\n- 标题页。\n- 目录。\n- 执行摘要。\n- 引言。\n- 讨论。\n\
  - 结论。\n- 建议。\n- 参考文献。\n\n### 良好报告的特征\n- 简单。\n- 清晰。\n- 简洁。\n- 积极。\n- 标点符号。\n- 方法。\n\
  - 可读性。\n- 准确性。\n\n\n\n\n时间是一个非常敏感的问题。非常敏感。每个人每天都有 24 小时，而你每天如何利用这 24 小时，决定了你的成功。你在这\
  \ 24 小时内所做的每件事都应该围绕着获取尽可能多的信息展开，因为信息确实是成功的核心。\n\n当你睡觉时，你应该深知自己正在为大脑充电，以便在第二天能有效利用大脑来获取尽可能多的信息。当你进食时，你应该知道自己正在为身体补充能量，这样你才有足够的能量去探寻信息。当你在任何事情上浪费时间时，你应该清楚那是在浪费时间，它会让你远离成功。\n\
  \n## 时间管理流程\n- 设定一个明确的目标。\n- 将你的目标拆解为更小的里程碑。\n- 编写待办事项。\n- 使用 `80/20 Principle`\
  \ 来确定优先顺序。\n- 尽量减少干扰。\n- 阅读关于你正在从事的事情的内容。\n- 回顾你的一天。\n\n## 时间管理技能\n- 优先级排序。\n- 授权。\n\
  - 决策能力。\n- 目标设定。\n- 问题解决能力。\n- 战略性、批判性和分析性思维。\n- 进度安排。\n\n## 如何停止拖延\n- 识别你拖延的原因。\n\
  - 将你的目标拆解为更小的里程碑。\n- 设定截止日期。\n- 利用积极的社交压力。\n- 奖励自己。\n- 每隔几分钟在两个任务之间切换。\n- 消除干扰。\n\
  - 从小开始以获得动力。\n- 拆解最困难的任务。\n- 不要做完美主义者。\n- 不要试图完成每一个任务。\n- 设定可以管理的目标。\n- 练习积极的自我对话。\n\
  - 制定行动计划。\n- 关注你的优势。\n- 寻求帮助。\n- 大量阅读。\n\n## 80/20 生活方式\n信息、行为、生活方式、成长与成功……\n在 `80%`\
  \ 的时间里处理 `20%` 的任务，这些任务能为你带来 `80%` 的回报。\n\n\n\n# 如何使用 80/20 原则\n\n对于你生活中想要实现的每一个目标，你都必须选择一种有助于你实现该目标的生活方式。如果你想成功，你每年至少要读\
  \ `12` 本书。如果你想富有，你必须工作 `80%` 的时间，这意味着你所做的一切就是吃、睡觉、工作，并且每月只休息一天去娱乐。这是 `80/20` 原则的实际应用，将引导你走向成功。\n\
  \n人们渴望成功，但他们不想工作 `80%` 的时间。这是不可能的。有些人想欺骗成功，，他们认为自己很聪明，认为他们现在努力工作，等有钱了就停止努力。事实并非如此。如果你很富有但工作时间少于\
  \ `80%`，那意味着你正在走下坡路，给点时间，你很快就会变得贫穷。人类被创造是为了在 `20%` 的时间里娱乐，`80%` 的时间里工作。每月休息一天去娱乐，其他时间则应对生活中的不确定性，前提是你确实计算出了一个月月中\
  \ `80%` 的天数。\n\n## 富人的生活方式\n\n每月娱乐一天是富人的生活方式。你要明白，富人享受工作。如果你不喜欢工作，那么你就需要改变这种态度。你必须喜欢工作才能富有。你不必喜欢你的工作，但你必须喜欢工作。你必须喜欢成长。你必须喜欢富有效率。如果你工作时间少于\
  \ `50%`，你将会贫穷。如果你工作 `50%` 的时间，你将过光光族。如果你工作 `60%` 的时间，你会成为中产阶级。如果你工作 `80%` 的时间，你会富有。如果你工作\
  \ `90%` 的时间，你会非常富有。\n\n## 生活方式、改变与成功\n\n“生活方式”一词定义了人们的行为、感兴趣的事以及他们的信仰。它是你生活的方式，包括爱好的选择、文化兴趣、穿衣风格、朋友，以及最重要的是你把时间花在了哪里。你在闲暇时间的活动定义了你的生活方式。如果你在闲暇时阅读，那么可以说你拥有富人的心态。你必须根据想要实现的目标调整你的生活方式。如果你想减肥，必须减少进食并保持活跃。走楼梯而不是坐电梯，或者把停在离目的地更远的地方然后走过去。\n\
  \n## 奢华、生活方式与成功\n\n奢华的生活方式是大多数人的动力。有足够的钱花在不需要的东西上，这一切都是为了“娱乐”的名义，从现场安保到游泳池、桑拿房和豪车。奢华的生活方式让你享受金钱。金钱是一个很好的动力，被金钱驱动也没有错。然而，大多数人害怕被金钱驱动，因为……嗯，我真的不知道为什么。金钱在惯俗上是所有资源的代表。这是我们共同达成的共识。全世界同意使用货币作为交换媒介，这意味着你可以用它来购买其他资源。既然如此，为什么人们还害怕被金钱驱动呢？这不符合逻辑。对奢华生活方式的需求提供了动力，而动力催生了成功。\n\
  \n## 坏的生活方式\n\n坏的生活方式与运动不足、饮食不健康和滥用药物（吸烟、喝酒、服用止痛药等）有关。人们面临的大多数健康问题都直接或间接地与他们的生活方式有关。这包括疾病、残疾甚至死亡。你可以通过改变你所控制的事物来改变生活方式，例如改变饮食或日常作息。照顾健康对塑造你的生活方式起着巨大作用，包括注意饮食、休息、锻炼、阅读以及避免使用酒精、药物和烟草。与坏生活方式相关的疾病包括动脉粥样硬化、心脏病、中风、肥胖、糖尿病等。这些疾病与吸烟、喝酒、吸毒以及我们食用的垃圾食品有关。良好的生活方式有助于预防这些不必要的问题。不要因为医生这么说就去做，要因为你想成功。医疗问题是昂贵的，它们会分散你的注意力并消耗你的精力，让你难以专注于成功。\n\
  \n## 健康、生活方式与成功\n\n良好的生活方式为你提供能量并帮助你专注于目标。成功与富有效率的生活方式相关。过富有效率的生活意味着你选择有助于提高效率的活动，例如健康饮食、适度饮酒、阅读、每日管理财务等。选择成为那个喜欢富有效率的人。选择工作\
  \ `80%` 的时间。选择成功。\n\n### 使用 80/20 原则优先排序\n* 列出你所有的日常任务。\n* 识别出三个回报更高的任务。\n* 完成这三项关键任务，并将其余授权。\n\
  \n## 积极思考\n\n问题、心态、解决方案、成长、成功、财富……一切始于头脑。积极思考是在任何情况下都关注良好事物的习惯，这对你的生理和心理健康有巨大影响。这简单意味着你在面对生活中的好与坏时，预期事情最终会向好发展，这种思考通常会导致成功，因为它增强了你的信心并让你保持冷静，使你能够轻松地解决问题。要保持冷静并积极思考，你必须了解生活中的万事是如何联系的，以及如何从任何起点走向成功。\n\
  \n\n\n\n# 如何充实你的人生\n\n*   停止抱怨。\n*   积极主动。\n*   创造你自己的机会。\n*   设定目标。\n*   花时间进行反思。\n\
