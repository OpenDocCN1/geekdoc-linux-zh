  \n\n## 名称、地址与注册\n\n公司以 `Racpro Properties Proprietary Limited` 的名称注册，注册号为 `2003/112233/07`。账销行、独立报告会计师、法律顾问、转让秘书、过户律师、独立估值师和公司秘书的名称及办公地址见附录\
  \ A。\n\n## 组织使命\n\n组织使命是组织存在的目的。公司的组织使命反映了此类信息，例如它生产何种类型的的产品或服务、客户群体是谁，以及它所持有的价值。\n\
  \nRacpro 将提供安全、实惠、高质量、环保且地理优越的 1、2、3 室分产权住宅单元，面积范围从 `45m2 – 120m2` 不等，每单元价格在 `R599,999\
  \ – R1,699,000` 之间。价格包含现代配备的厨具电器。\n\n目标市场是首次购房者、活跃成年人、年轻专业人士、年轻家庭、老年家庭、退休人员以及自租型投资者。Racpro\
  \ 的总部将位于约翰内堡的贝德福德维（Bedfordview）。Racpro 的物业配套的生活中心配备了完善的礼宾服务和其他全方位增值服务，包括水疗、餐厅、健身房、壁球场、动作运动场、游戏室、电影院、加热游泳池、游乐场以及生活中心内的免费\
  \ Wi-Fi。\n\n\n\n\n\n## 营销计划\n\n## 目标市场\n目标市场是指产品或服务所针对的消费者群体。识别目标市场是任何公司制定营销计划过程中至关重要的步骤。Racpro\
  \ 的目标市场将包括拥有稳定收入、生活忙碌且需要便利、现代居住环境的中产阶级专业人士。这包括可以购买三居室公寓的小型家庭、可以购买并租赁公寓的投资者，以及只需要一个居住之地的单身专业人士或情侣。Racpro\
  \ 还将针对房地产投资者，即他们在开售前以折价购买房产，并在开发完成后以高价出售以获取利润。\n\n## 产品\n产品是投放市场以供获取、关注或消费的实体物品。Racpro\
  \ 的产品是新建的、高质量的、现代公寓，提供以下功能：\n* 电力和水费预付费表。\n* 24 小时安保，配备生物识别访问。\n* 预留光纤和 DStv 。\n\
  * 现代生活方式中心。\n* 免费环保电器。\n* 1、2 和 3 居室公寓。\n* 靠近购物中心、学校、医疗……\n* 带有免费 wifi 的生活方式中心。\n\
  * 礼宾服务。\n* 洗衣店。\n* 配有教练的科学健身房。\n* 户外健身区。\n* 华球场。\n* Littlehill 蒙特梭利学校。\n\n## 价格\n\
  价格定义为支付某物时预期、要求或给出的资金金额。可以通过市场研究确定产品的合适价格。\n\n### Racpro 公寓价格\n* 1 卧室 1 卫从 R 939\
  \ 900 起\n* 2 卧室 2 卫从 R 1 419 900 起\n* 3 卧室 2 卫从 R 1 838 155 起\n* 无贷款费用和转让费用\n\n\
  ### 地点\n公寓将位于约翰内斯堡市中心，靠近以下地点：\n* 农夫市场 (Farmers’ Market)\n* 绿石购物中心 (Greenstone Mall)\n\
  * Stoneridge 购物中心\n* Flamingo 购物中心（已开业）\n* 非购物场 (Mall of Africa)\n* Super seedlings\
  \ 苗圃中心\n* Linbro 商务园区\n* Longmeadow 商务园园\n* 桑顿市 (Sandton city)\n* 梅洛拱廊 (Melrose\
  \ Arch)\n\n## 推广\n推广定义为宣传产品或服务以增加销售或公众意识。业务发展中的一个重要因素是有效且具有创意的产品营销和推广。为了有效执行，营销和推广需要一种协调且结构化的方法。Racpro\
  \ 将开展一场动态的营销活动，利用社交媒体作为有效的推广手段。互联网将作为广告和推广的主要来源。\n\n### SWOT 分析\nSWOT 分析是组织进行的一种研究，旨在识别其内部优势和劣势，以及外部机会和威胁。\n\
  \n### 优势\n优势是指人或事良好或有利的性质或属性。\n* 城市化和不断增长的中产阶级。\n* 由于启动成本高，竞争者较少。\n* 带有生活方式中心的现代公寓。\n\
  \n### 机会\n机会指的是可以为组织带来竞争优势的有利外部因素。\n* 获取更多土地。\n* 巨大的市场潜力。\n* 扩张到另一个大都市。\n* 与其他房地产公司建立合作伙伴关系。\n\
  * 政府土地的开发。\n* 提高黑人经济赋权水平，实现多元化并获益。\n\n### 威胁\n威胁指的是可能损害组织的因素。\n* Covid19 导致的经济萧条。\n\
  * 腐败的政府可能会吓跑投资者。\n* Covid19 影响导致关键员工流失。\n* 失业率增加导致需求下降。\n* 房税法规的变化。\n\n### 劣势\n\
  劣势定义为缺点或缺陷。\n* 巨大的启动成本。\n* 巨大的风险。\n* 区域性业务（仅涵盖豪登省）。\n\n## 竞争分析\n竞争分析是对当前和潜在竞争对手优劣的评估。这种分析提供了进攻和防御策略背景，以识别机会和威胁\
  \ (Czinkota & Ronkainen, 2010)。Racpro 现房模式的关键差异化在于通过规模效应提供卓越的产品，并在小区内创建生活方式中心。其他房地产开发商不提供像\
  \ Racpro 这样的大型生活方式中心，房主可以在小区内享受家庭时光，并有足够的活动可以进行。Racpro 将小区内建立生活方式中心，那里将有免费 wifi、礼宾服务、恒温游泳池、游乐场、水疗中心、餐厅、健身房、华球场、竞技运动场和跑步径。这将确保孩子和父母在小区内度过愉快时光而无需出门，从而节省金钱、时间和精力和精力。Racpro\
  \ 还将与利益利益者建立合作伙伴关系，并使开发单元的价格与市场持平或低于市场水平。\n\n## 营销与销售计划\n销售和营销在内部执行（不通过外部房地产中介）。销售和营销将包括以下任务：\n\
  * 展示单元内部设计。\n* 创建手册、小册子和报纸广告。\n* Racpro 为其客户提供内部贷款起源服务。\n* 公司与南非所有主要银行均有协议，并在贷款起源过程中充当经纪人。\n\
  * 公司通过这一过程赚取佣金。\n\n## 企业社会责任\nRacpro 全力致力于良好的企业经营和社会责任实践原则。这些原则反映在 Racpro 的方法以及对供应商开发的关注中，特别是对其子分包商及其员工的开发。Racpro\
  \ 致力于通过公司培训计划以及在职培训开发其员工，并关注其雇佣中此前处于劣势个体的开发。Racpro 参与其运营社区内的各项活动，包括一项旨在造福各种基金会和非政府组织的年度慈善活动。\n\
  \n## 运营计划\n\n## 长期目标\n长期目标是组织在追求其基本使命寻求实现的特定结果。长期目标代表了追求某些策略的预期结果。Racpro 旨在满足南非人对安全、高质量、新开发、高性价比、便利房屋的需求，而无需让房主参与到梦想家园的繁琐日常管理中。Racpro\
  \ 将服务于南非大部分负担不起高收入生活庄园居住但渴望获得同等便利、安全和设施的人群，通过创建分权物业（sectional title properties），让他们在\
  \ R599,999 – R1,699,999 的价格范围内实现这些愿目标。\n\n### 未来五年的战略目标\n* 提供折价预售销售。\n* 启动开发项目。\n\
  * 获取土地并建造展厅。\n* 开始建筑、销售并进行房产看房。\n* 保留部分开发库存作为租赁组合。\n* 与其他房地产公司建立合作伙伴关系。\n* 支持并发展黑人经济赋权。\n\
  \n## 行业描述\n行业描述有助于公司了解其与其他生产相似产品或服务的公司之间的地位，这有助于识别它们面临的威胁和机会。南非住宅房地产行业由于城市化和不断增长的中收入人口对优质住房的强烈需求正在增长。金融机构愿意向房主提供抵押贷款以获取房产。位于南非安全生活庄园内的房产估计总值为\
  \ 6430 亿兰特。南非注册房产中约 12% 是分权单元，另 5.3% 代表庄园开发。在过去的 20 年里，公寓和联排别墅占了 26%。\n\n\n\n\n\n\
  # 1. 他们想确认关于“你是最佳候选人”的想法\n\n请记住，公司团队存在一个他们正试图填补的空缺，而且他们对想要寻找的人才已经有了心理预期。好消息是，如果他们约你参加面试，意味着他们认为你具备他们所寻找的性格，因此他们想通过问你一系列问题来确认他们的想法。\n\
  \n这些问题构成了面试，根据公司认为对于那个特定的“空缺”什么更重要，这些问题可能是行为面试类，也可能是胜任能力类。因此，了解他们正在寻找什么样的候选人并据此展示自己至关重要，以便让他们看到你正是他们寻找的那种人。\n\
  \n要做到这一点，请研究公司对该职位的要求，并与你的技能、资和经验相匹配，例如，如果公司需要某些 `SQL` 方面的经验，请检查你的简历中是否包含 `SQL`。这将帮助你理解他们正在寻找什么样的人，以及你距离目标有多远。\n\
  \n如果你觉得自己不具备他们寻找的大部分要求，请记住一点：他们已经知道你不具备他们正在寻找的素质，但他们仍然认为你是胜任这份工作的最佳人选，因此只需为面试做好充分准备，就不会出错。\n\
  \n# 2. 他们希望你支持并为你你在简历中所陈的内容提供证据\n\n\n\n\n这是面试中最重要的原因。你所有的面试回答都应该围绕证据（成功案例）。记住，简历是你生活的非常简的总结，因此他们希望你对此进行详述。例如，如果他们问你为什么要雇佣你，他们已经从你的简历中看到你在特定领域拥有经验，并且知道这就是他们需要雇佣你，但他们只是希望你用成功案例（证据）来支持这些经历，并在可能的情况下提供确凿的证据。如果你没有书面证明来支持简历上的某些技能和/或经验，也不要担心，支持你观点的最常见方法是讲述成功案例，这就是他们需要的全部证据。你将在下面的问题中看到，用成功案例支持你的答案是多么简单，但首先，让我们来看看面试的结构。\n\
  \n## 职位面试的类型\n\n### 电话面试\n有时这被用作招聘流程，如果你通过了电话面试，将受邀参加另一次面试。请以与任何其他面试相同的专业方式处理每一次电话面试。从专业地接听电话开始。不要太花哨，一句真诚的“你好”就足够了。就像电子邮件地址一样，你的语音箱留言/自动答语音也应该是专业的。\n\
  \n### 面对面面试\n这也可以招聘流程的一部分，如果你通过了它，将受邀参加另一次面试（通常是小组面试），或者你可能会被叫去参加评估测试。要保持专业并为此做好充分准备。有些公司没有冗长的招聘流程，这可能是你参加的唯一面试，之后你就会获得录用意书。好吧，希望确实如此。\n\
  \n## 准备面试\n让一切都围绕着你的技能、资历和经验展开。\n\n### 研究公司\n当你研究公司时，不要只是浏览他们的网站，要挖掘得更深一些。这将帮助你恰当地回答他们的问题，并帮助你展示你对公司的兴趣，从而使你从那些没有投入时间进行研究的候选人中脱颖而出。研究公司还将帮助你为面试官准备问题。\n\
  \n### 将技能、资历和经验与职位描述匹配\n这是面试准备中非常重要的一部分，因为问题将围绕职位要求和职责展开。面试官会通过提问来查看你是否具备所需的特征，以及你是否能够履行职责。将你的技能和资历与工作的要求及职责相匹配，将让你清楚招聘人员在寻找什么样的特征，以及你将被要求承担哪些职责。这将帮助你了解要求的特征中你拥有哪些，不具备哪些，以便你开始研究并学习那些你不具备的特征。这里的诀窍是，千万不要对面试官撒谎你不具备的特征；要诚实并告诉他们你将竭尽全力去学习。\n\
  \n关于这些技能的书籍数胜无数，确保你每天阅读这些书籍以自我提高和发展。如果你没有时间读书，至少在面试前读读关于这些技能中每项的文章。记住，这些只是常见技能，公司还会要求更具体的技能，例如高级\
  \ `excel`。\n\n### 研究职位描述\n确保你了解职位描述中写的所有关于工作职责。问题将集中在职责上，有时招聘人员可能会问非常具体且具有挑战性的问题，例如，如果其中要求之一是具备\
  \ `AWS` 知识，招聘人员可能会问：`AWS` 主板的输出电压是多少。这可就深了。不过不用担心，对于高级职位，招聘人员会转问更具体的问题，有时招聘人员只是想看到你的思考过程。基本上，职位要求就像考试大纲，它告诉他们他们将测试你什么，你必须去刻苦钻研。如果要求之一是具有操作\
  \ `hplc` 机器的经验，而你对该机器完全零经验，那么你需要确保在去面试时已经读过该机器，并且对该机器有深入的知识。当被问及机器时，千万不要撒谎说你有经验，不！直接告诉他们你没有该机器的经验，但你对该机器的工作原理有很好的理解，然后继续展示你通过阅读该机器所获得的知识。现在你知道为什么投入大量时间准备是非常重要的了。\n\
  \n### 准备成功案例并烂熟记于心\n在回答面试问题时，使用 `SARS` 方法。`SARS` 代表 `Situation`（情况）、`Action`（行动）、`Results`（结果）和\
  \ `Summary`（总结），这意味着尝试突出显示你所面临的 `Situation`、你所采取的行动、结果，然后总结你的故事，以展示它如何与问题相关，可能以及学到的教训如何应用到你申请的工作中。\n\
  \n保持主题，与其漫乱无章，宁愿完全什么都不谈。不要只谈论你的技能；要向他们展示你的技能如何为公司造益，例如，不要只说我有气象学的 `BSc` 学位，而要说：“我有气象学的\
  \ `BSc` 学位，可以从许多方面为公司受益。”看看公司想要什么（职位职责），并告诉他们如何为他们做到。将你的特点与他们的需求匹配。你增加了什么价值（你还有哪些其他对公司有利的价值）。\n\
  \n## 常见面试问题及示例答案\n\n### 问题：介绍一下你自己\n**备注：** \n面试官并不是让你讲述你的人生故事，他们希望你告诉他们与你申请的职位相关的性格特征。这包括你的经验、资历和技能。不要谈论你喜欢或不喜欢什么。告诉他们你拥有与工作相关的经验、技能和资历。关注你的技能。记住，你要保持答案简洁且切中重点，所以如果你有很多经验或技能，请提供与工作相关的，展示它们将如何让你受益，从而使你成为最佳候选人。每当你谈到你的技能、教育或经验时，确保提到它是如何使他们受益。给他们一个关于你的经验、教育和技能的简要总结，这与简历中的内容完全一样。如实说即可。\n\
  \n**回答：** 我拥有开普敦大学的化学 `BSc` 学位。我还有一份`运营与管理` 证书，这使我具备提高生产力的员工技能。我有两年实验室分析师的工作经验，期间我获得了在使用\
  \ `HPLC`、`XRF` 等现代仪器等方面的丰富实践经验。在我的上一家公司，我负责编写标准操作程序 (`SOP`) 和管理实验室设备，我成功将实验室事故数量减少了\
  \ 5%。我会说我的主要优势是我的沟通能力，这在我的推荐信中显而易见。\n\n### 问题：你的经历中为什么有一段空白？\n**备注：** \n尽量不要给出与疾病相关的答案，除非你有证明文件。如果你是被解雇的，那么你必须诚实。记住始终保持积极，面试官在邀请你面试之前就已经看到这段空白了。回答这个问题的好方法是告诉他们你在空白期内所做的积极事情，因为这听起来可能像在撒谎。\n\
  \n**回答：** 公司在缩减规模，他们不得不辞掉所有的兼职人员。我是其中之一，但在离开之前他们给了我一封推荐信。这是我的信。在空白期，我写了一本关于思考的小说，并在\
  \ `Kindle` 上出版了。\n\n**另一种回答：** 我休息了一段时间来照顾由于医疗问题需要照顾的姐姐。这是证明。在空白期，我参加了普勒托利亚大学的在线课程以不断增加我的知识。\n\
  \n**另一种回答：** 在离开 `Rampsy Consulting` 的工作后，我决定我想旅行。我去亚洲呆了两个月，然后在美国呆了两个月。这帮助我有了开阔的视野。\n\
  \n### 问题：你有……的经验吗？\n**备注：** \n面试官会问你是否具有他们寻找的特定技能的经验，即使他们在简历中看到你拥有该技能。他们必须问，这是流程。如果你没有这项技能，不要犹豫说“不”。\n\
  \n**回答：** 没有，不过这不是问题；我有很强的学习意愿，而且适应能力很快。当我开始上一份工作时并没有任何经验，那份工作需要特定仪器的技术经验，但在两个月内，我已经自学了如何操作所有仪器。三个月后，我被负责管理仪器，十个月后，我写了一篇关于如何操作这些仪器的博客。我很快学会了使用这些仪器，是因为我良好的人际技巧和沟通能力，以及阅读了大量关于操作仪器的书籍和文章，并总结了这些书籍和文章创建了一个博客。通过与每个人有效沟通并拥有出色的人际技巧，我同事都乐于帮助我学习如何操作仪器。我将同事教给我的和我从其他书中读到的知识结合在一起。\n\
  \n**另一种回答：** 是的，我有操作 `HPLC` 机器的五年经验。\n\n### 问题：你有……的证书吗？\n**备注：** \n面试官会问你是否具有他们寻找的特定技能的经验，即使他们在简历中看到你拥有该技能。他们必须问，这是流程。如果你没有这项技能，不要犹豫说“不”。\n\
  \n**回答：** 没有，不过这不是问题；我有很强的学习意愿，而且适应能力很快。我。当我开始上一份工作时并没有任何经验，那份工作需要特定仪器的技术经验，但在两个月内，我已经自学了如何操作所有仪器。三个月后，我被负责管理仪器，十个月后，我写了一篇关于如何操作这些仪器的博客。我很快学会了使用这些仪器，是因为我良好的人际技巧和沟通能力，以及阅读了大量关于操作仪器的书籍和文章，并总结了这些书籍和文章创建了一个博客。通过与每个人有效沟通并拥有出色的人际技巧，我同事都乐于帮助我学习如何操作仪器。我将同事教给我的和我从其他书中读到的知识结合在一起。\n\
  \n**另一种回答：** 是的，我有操作 `HPLC` 机器的五年经验。\n\n### 问题：你最大的优势是什么？\n**备注：** \n要具体，并给出一个与工作相关的例子，展示你的优势与他们正在寻找的匹配。如果你已经在简历中提到过它，不要担心，再次提到也可以。确保你的答案有支持。\n\
  \n**回答：** 我会说我的主要优势是我的沟通能力，这在我的推荐信中显而易见。\n\n### 问题：你最大的缺点或需要改进的地方是？\n**备注：** \n\
  每个人都有弱点，但不要说一些完全像酒精那样的事情。面试官只是想看看你是否具有自我意识，或者你是否愿意改进它。选一个你拥有的弱点，不要负面地谈论。\n\n**回答：**\
  \ 我的弱点是缺乏组织能力。这个缺点很耗时，因为我曾花了一整天去寻找。我改进的方法是返回到哪里。\n\n### 问题：你如何应对压力？\n**备注：** \n\
  面试官想看看你是否是一个在压力下工作良好的人。给出一个你在压力下工作的例子，并使用 `SARS` 格式回答。\n\n**回答：** 我绝对可以在压力下工作。在之前的公司，我处理不同的任务，这帮助我有效地管理时间。\n\
  \n### 问题：你如何做重大决定？\n**备注：** \n这个问题的主要目标是了解你是如何建立关系的。面试官正试图看你是否具有良好的职业道德和人际技巧。如果他们问你之前的老板或同事如何描述你，要自信。\n\
  \n**回答：** 我非常擅长做重大决定。我使用的策略是权衡利弊。我确保我有尽可能多的信息以便做出明智的决定；这包括从团队成员那里获得可能的建议。这非常重要。在决策和解决问题方面，我强调在做决定之前尽可能询问信息的重要性。\n\
  \n### 问题：你为什么在我们公司工作？\n**备注：** \n告诉他们你喜欢公司的地方。\n\n**回答：** 我渴望在贵公司工作，因为我相信我的背景和技能可以为公司的成功做出贡献，确保我完成了要求的一切并付出额外。是的，我的朋友兼导师\
  \ `Johannes` 在公司工作。是他告诉我这个职位的。他告诉了我公司的工作环境，公司对数据完整性的严格程度，以及你们如何为员工提供增长，这就是最吸引我这个职位的地方。\n\
  \n### 问题：未来 3 到 5 年后你希望自己处于什么位置？\n**备注：** \n面试官想看到你是一个有方向和目标的人。他们还想看你是否愿意投入公司，还是你只是想在这个职位上消磨时间寻找更好的。确保你的答案显示你的目标和方向将为公司带来价值。设定现实的目标。不要说你想看到自己被晋升或你想处于管理位置。回答这个问题的最佳方法是看你可以如何为职位做出贡献，以及你如何从职位中成长，然后沿着这些思路回答。要具体，将你的职业目标与公司可能的特定职责挂钩。另一个好方法是谈论你的学习。告诉他们你希望在未来五年完成什么样的资历。你也可以陈述你的目标，然后给出你如何实现它的步骤。对公司内部为你开放的职业路径进行研究。\n\
  \n\n\n\n## 职责\n\n1. 操作实验室设备，如 `HPLC`、`GC`、`UV`、`AA`、`Karl Fischer`、溶出度槽、`IR` 等。\n\
  2. 管理实验室设备。\n3. 承担实验室设备和仪器的日常维护与清洁工作。\n4. 遵守所有健康和安全协议。\n5. 精通使用现代实验室设备。\n6. 指导并教授新员工工作。\n\
  7. 具备计算机基础（电子表格、图形处理和文字处理）。\n8. 具有建立和运行分析实验室的经验。\n9. 人员管理。\n10. 编写标准操作程序（SOP）。\n\
  \n## 备选答案\n\n我没有这个领域的经验，但多年来我积累了许多与此工作相关的技能，例如：\n\n1. **计算机技能** - 我是一名精通计算机的用户，具备高级\
  \ MS Office 技能，包括 `Word`、`Excel`、`PowerPoint`、`Access`、`Publisher`，以及 `webmail`\
  \ 和 `Outlook` 等常用电子邮件程序；我在开普敦大学（`UCT`）完成过一个短期计算机技能课程。\n\n2. **多任务管理能力** - 2012 年暑假期间，我同时在开普敦大学（`UCT`）参加了词汇力量课程，并在斯特兰堡大学参加了聚合物科学课程，并以优异的成绩完成了课程。此外，在\
  \ `UCT` 修读 `BSc` 学位期间，我同时选择了三个不同的专业。\n\n3. **团队协作技能** - 我曾在马里昂岛工作，那里团队合作是必须的，在那里学到了广泛的团队协作技能。我们是由三个气象学家组成的团队，在一个孤立的岛上，直接负责所有的气象数据和气象仪器的维护工作，这需要有效的团队合作。\n\
  \n\n\n\n\n# 问题：描述一个为你自己设定的重大目标。\n\n**备注**：请确保你的回答与你所申请的职位相关。清晰地陈述你的目标以及你为什么认为这是一个重大目标。展示你是如何实现这一目标的。\n\
  \n**回答**：我今年设定的最大目标之一是写一个关于分析化学家使用的技能和设备的博客。我所采取的行动是花费了一个月的研究并学习如何编写和发布博客，然后又花了三个月的时间收集和学习关于分析化学家及其使用设备的文章。在经历了长达四月的研究和学习后，我设计、编写并发布了我的博客。现在我的博客运行良好，并帮助着世界各地的人。谁不想雇佣这样的人呢？\n\
  \n---\n\n## 问题：什么在职场激励着你？\n\n**备注**：每个人都有自己的动力来源，可能来自朋友、家人、书籍等。动力是成功的关键之一。工作环境可以建立也可以破坏你的动力。面试官问这个问题是因为他们想知道你在他们的环境中是否会有动力。回答要得得体，不要说你通过在户外活动而获得动力，而你申请的职位是银行柜员。回答这个问题的最好方法是观察公司具备哪些品质，并将其陈述为你的动力；或者观察该职位提供的积极因素，并将其陈述为动力。\n\
  \n**回答**：完成工作激励着我。我属于那种总是列出待办事项的人，每当我完成一项任务时，就会把它划掉。这让我感到很愉快、充满动力，并且想做更多工作。完成的任务越多，我的动力就越大。\n\
  \n---\n\n## 问题：你对以前同事有什么不满意的？\n\n**回答**：没有，我觉得自己很幸运，能和一群优秀的人共事。每个人都努力表现得体，这是我最欣赏他们的一点，也是我非常感激的原因。\n\
  \n---\n\n## 问题：你和之前的上司之间过什么矛盾？\n\n**备注**：希望你和之前的上司没有矛盾，这样你就不需要撒谎了。如果有，你必须以一种非常积极的方式来说，使其听起来不像是一个问题。在我看来，你和之前的上司没有任何矛盾。\n\
  \n**回答**：我与之前的上司之间完全没有过问题；事实上，我们关系非常融洽。我非常擅长与管理层建立关系。要与你的老板保持良好关系，你必须完全按照他们的指示去做，加倍努力并保持良好沟通。\n\
  \n当我还是 `Rampsy Consulting Company` 的一名新员工时，我的经理要求我做溶解实验并在 `UV machine` 上读数。我完全按照要求做了，并如实报告了结果。问题是，该产品的的结果太低了，导致不合格，但我当时还是个新员工，不知道该怎么办，所以我还是直接报告了结果。我的老板对我很生气，说我应该重新进行分析，如果产品仍然不合格，我应该写一份“不规格报告（out\
  \ of specification report）”。\n\n为了解决这个问题，我让老板消消气，然后在大家都离开后留在了公司，完全按照要求重新做了一次产品。第二天，我为自己的错误道歉了，并告诉他下次我会确保与他有效沟通并向他确认一切。大约三个月后，我就不再需要向他确认任何事情了，我掌握了需要知道的一切，他也信任了我。\n\
  \n---\n\n## 问题：我们为什么要雇佣你？\n\n**是的**：是的，这不是一个容易回答的问题。\n\n**回答**：因为我的个人能力与这份工作完美契合。我来自\
  \ `Rampsy Consulting Company` 的前主管告诉过我我是一个良好的沟通者，并且一直能取得良好的成果，正如我的推荐信中所示（请提供推荐信）。此外，我在\
  \ `南非气象局（South African weather Service）` 的主管在沟通、团队合作和解决问题能力方面给我了 100 的评分，正如我的年度评估所示（请提供硬证据）。我可以利用这些技能与学生、员工和管理层建立联系。如果你无法提供证据，不要这样回答这个问题，否则你的回答听起来会很空洞。如果你没有书面证据，你需要以成功故事的形式提供证据，就像下方的另一种示例所示。\n\
  \n**备选回答**：因为我会不惜一切代价来完成工作并获得良好结果。在 `南非气象局` 工作期间，即使在休息日也会工作。我记得 2015 年 12 月，雨计坏了，那天正好是我的休息日。值班的人本应该修理雨计，但因为我知道光凭一个人几乎不可能修好它，所以我去了办公室，我们花了一整天时间一起修好了雨计。完工后，雨计运行非常完美。与自动雨计相比，差异仅为\
  \ 0.003 mm，几乎为零。\n\n**备选回答**：因为我会不惜一切代价来完成工作并获得良好结果。2012 年，我给自己设定了一个发布博客的目标。在 2012\
  \ 年底之前，我的博客就上线并运行了。2013 年，我的目标只是创造一些新东西，所以我设计了一种新的洗发水并对其进行了生产。2014 年，我编写并出版了一本书，2015\
  \ 年我注册了一家公司。\n\n**备注**：要回答好这个问题，你必须非常具体，并用例子或硬证据支持你的主张。向面试官展示你能胜任这份工作，并且能够交付惊人的成果。试着谈谈你还没有提到的技能。回答这个问题时很容易忘记并开始东言乱语。研究公司和职位，确保你符合他们正在寻找的人。强调你与公司所寻找的相符的优势。有时研究公司会很疲惫且无聊，因为公司需要你来工作。不要议论其他候选人，要说你比他们更好。\n\
  \n---\n\n## 问题：你为什么要申请这个职位？\n\n**回答**：我申请这个职位是因为我喜欢作为气象技术员的工作，因为这是我在学位中学到的知识的实际应用。此外，我钦佩我之前任公司的价值观，我相信我拥有相同的价值观：专业、诚实、卓越和团队合作。此外，公司的愿景是成为世界级的机构，我相信凭借我的教育背景和技能，我是实现这一愿景的最佳人选。\n\
  \n---\n\n## 问题：你是一个团队协作精神的人吗？\n\n**备注**：你已经知道团队合作在职场中非常重要。如果你不知道在哪里工作，请看这一点；你能做到吗？\n\
  \n**是的**：是的，我可以。\n**否**：公司需要团队成员通过合作来取得成功。这是面试中可能被问到的最重要的问题之一，你应该彻底地回答。给出一个成功故事证明你是一个团队协作精神的人，并记住用\
  \ STAR 格式组织你的故事。如果你说自己不是良好的团队协作者，你可以这样做。团队协作精神是一项意味着你可以学习、练习并精通的技能。你需要阅读关于团队合作的文章，然后阅读或收听书籍（越多越好），然后实践你所学。良好的团队协作精神意味着你可以与他人有效沟通，并能够感同他人，理解他们行为的原因。这会帮助你与他人建立联系，并使你成为出色的团队协作者。\n\
  \n**回答**：我在工作过的两家公司以及大学期间都有过团队工作。尽管大学有时必须独自工作，但我个人更喜欢在团队中工作。我参与团队工作的一个例子是我在马里昂岛（Marion\
  \ Island）工作时。在马里昂岛的工作完全取决于团队合作和沟通。我们是一个三个人的气象小组，直接负责所有的气象数据和仪器维护，这需要有效的团队合作。\n\n\
  ---\n\n## 问题：你为什么选择这个职业？\n\n**回答**：因为我想参与产品开发。我迷于整个过程如何从一个想法开始，接着是广泛的研究，然后通过恰当的执行，将元素汇聚成成品，这种过程产生情感共鸣。\n\
  \n---\n\n## 问题：告诉我一个你提过并采纳的建议？\n\n**备注**：面试官只是想看你是否是一个有创意的人。有时他们只是想看你是否是一个积极的人以及是否为团队做过贡献。这显示了责任感。你的回答必须展示你在需要时会建议和推荐。举一个你在工作中通过独特方法解决问题的例子。如果你在工作中没有任何贡献，就提到你在个人生活中提出的建议。这是一个向面试官展示如果他们雇佣你，公司将受益的好机会。\n\
  \n**回答**：我在上一家公司只工作了两年，那里公司已经很完善，所以提出新想法是一个挑战，因为在那两年里我们没有遇到任何大问题。然而，我在大学期间提出了一个被采纳的想法。在大学的最后一年，化学课程协调员告诉我们要买分子实验盒，因为考试需要它们。那个实验盒很便宜，只有`R200`。问题是`R200`对学生来说是一笔大钱，而且这笔钱还能换一瓶不错的杰克丹士，现在可是个很划算的交易。总之，大多数学生没有买实验盒，这对他们产生了很大影响，令人惊讶的是这种情况每年都会发生。于是，我去课程协调员那里建议大学将学费增加`R200`，然后免费提供实验盒。我的协调员笑了，说这是最棒的主意，于是他在明年实施了它。\n\
  \n**备选回答**：我引入了电子记录。我以前工作的公司使用纸质册子进行分析。我们有很多册子，所以每个客户都有文件，填满了书架但没有特定的顺序。问题是，我们总是被大量的工作淹没，有时我们会忘记把册子放回它们所属的地方，结果下一个人想进行分析时不知道去哪里找册子。所以那个人得跑一整天浪费时间找册子。有时情况更糟，你找了一整天一个册子，以为是别人弄丢了，结果发现公司根本就没有那个册子。为了解决这个问题，我提出了一个我想称为电子记录的系统。我的系统非常简单，我创建了一个`excel`记录模板，这样每次使用册子时都要写下你的名字、日期和册子标题。下一个使用册子的人去查记录就知道上一个使用的人是谁。结果是惊人的；这种方法为大家节省了大量时间，让大家可以关注更紧迫的事情。\n\
  \n\n\n\n\n- 如果你能在文件夹里找到本小册，就可以看到是谁最后使用了它，并询问他们。\n- 如果到处找不到本小册，你可以搜索电子表格，查看公司是否拥有该本小册，这样你就可以停止寻找，专注于更紧迫的事情。\n\
  - 并且人们开始将小册归还各自的文件夹，因为他们知道下一个人会知道他们是导致小册丢失的责任的人。\n\n\n\n\n## 备选答案\n我在上一家公司面临的问题之一是，溶解过程需要时间，因为溶解浴中的水加热需要很长时间。为了解决这个问题，我建议早晨第一个进行溶解的人不要等浴槽加热升后再放入培养基，而是应该在上班后就放入培养基，让浴槽温度与容器温度同步升高。这节省了时间。我的建议非常出色，立即被采纳了。\n\
  \n## 问题：你会带什么去办公室？\n### 回答\n我将带上我丰富的知识和气象专业技能，但最重要的是，我将带来卓越的团队合作和沟通能力。我之所以说这些技能非常重要，是因为每个办公室都有他们想要实现的目标，如果没有团队合作和有效的沟通，办公室将无法实现其目标。因此，通过这两项技能，我可以帮助办公室实现目标，并通过对这些技能和其他技能的不断改进，在未来几年持续取得成就。正如我已经解释过的，我来自前公司的推荐信证明了我具备良好的沟通能力，并一直取得良好的成果；此外，我的主管在目前公司今年的绩效考核中对我的沟通能力和团队合作能力打了\
  \ `100 %` 的高分。\n\n## 问题：告诉我是你在上一份工作中遇到过的冲突\n### 回答\n到目前为止，我还没有遇到过任何冲突，我只工作了三年。然而，如果我与某人发生冲突，我会对他产生同情，并尝试从他们的角度来看问题。据说，对于每一次冲突，每个人本都可以做一些事情来避免冲突。个人的成长来自于研究你本可以做什么来避免冲突，并且永远不再犯同样的错误。\n\
  \n## 问题：但你的资历过高了……\n### 注意事项\n并没有所谓的“资历过高”，但既然你需要一份工作，让我们看看你如何以礼貌的方式回答这个问题。\n###\
  \ 回答\n我真的考虑过这个问题，我可以找到一份符合我资历的工作，但我认为成为一名气象技术员会更有成就感，因为我很了解这个行业，并且对此充满热情。所以，关键在于找到一份能够实现我热忱的工作，而不是仅仅一份符合我资历却让我发现我不喜欢它。\n\
  \n## 问题：你为什么要离开？\n### 回答\n我真的需要一个可以被管理、发展，并且可以获得指导和导师的环境。\n## 备选答案\n我需要承担更多的责任；凭借我丰富的实验室经验，我觉得我正处于可以承担更多责任的好位置。\n\
  \n## 问题：你如何应对变化？\n### 回答\n我非常擅长处理变化。我从一个每天与化学品打交道的实验室分析师，转变为与化学品完全无关的气象技术员，现在我是一名数据专家。我确保自己在入职培训期间掌握所有的内容，并且通过阅读书籍、文章，最重要的是参加课程来付出加倍的努力。\n\
  ## 备选答案\n此外，我曾在马里恩岛（Marion Island）工作过，那里的环境完全不同。马里恩岛是印度洋非洲南部的一个偏远岛屿。岛上没有文明，只有科学家在那里研究。我们与一个`20`人的科学家小组住了一年，这需要卓越的团队合作和适应变化的能力。因此，我读了沟通技巧书籍（提到具体书籍）和团队合作书籍来提升自己的技能。结果，我的主管在半年度绩效考核中给我的评分是\
  \ `24.25` 满 `25`。\n## 备选答案\n我的工作时间从每天`8 到 5`变成了轮班制。轮班制很有挑战性，因为你没有每天固定的`8 到 5`作息。但由于我卓越的规划能力，我喜欢轮班工作。\n\
  ## 备选答案\n我在开普敦大学（`UCT`）学习过，那里非常多元化，有很多国际学生，所以你必须学习不同国家和大陆的各种文化，以便每天与他们互动。因此，我开始阅读关于如何与每个人成功沟通的书籍。结果，我交到了很多朋友和学习伙伴，这也是我能以三主修学位毕业的解释之一。\n\
  ## 备选答案\n我在斯泰滕博斯大学（`University of Stellenbosch`）参加了一个短期课程。斯泰滕博斯在各方面与开普敦不同，他们的规则、居住区、工作道德等。因此，我必须快速适应。课程结束时，我获得了证书。*不要提供太多信息，也不要太少。*\n\
  \n## 问题：管理还是领导更重要？\n### 回答\n管理和领导是两个非常不同的概念，很容易混淆。领导属于管理。当你进行管理时，你可以计划、组织和设计计划，但要让员工执行你的计划，你需要激励他们，而这就是领导——激励你的员工去完成工作。\n\
  在我以前的公司 `Rampsy`，我们公司要求进行对比溶解，这需要在两周内完成`30`种不同的曲线溶解；这在非常短的时间内是一项大量工作。通常，一个人一周只能完成`5`次曲线溶解，但我的经理给了我两周内完成对比溶解的任务。这意味着我必须在短短两周内完成`30`次不同的溶解。为了做到这一点，我制定了一个周密的计划，我将早来晚去，以便我能每天至少完成`3`次溶解。我确保把一切都安排得井良好，这样就不会犯任何错误。在`10`天内，我完成了所有`30`任务。\n\
  \n## 问题：你曾在压力下工作过吗？\n### 回答\n这是为了你。通过`SARS`技术完成任务。\n\n## 问题：你对我们有什么想问的吗？\n### 注意事项\n\
  现在这很有趣，面试官会问这个问题。是的，面试官问这个问题是为了评估你是否适合这家公司。这就是提问发挥用场的地方，你想在做决定前了解情况。在面试中提问非常重要，它显示了你对公司的兴趣，所以你的问题越真实，显示出的兴趣就越大。关注与面试相关的问题，特别是公司非常看重的问题。记住保持简短并提出专业的问题；这不是询问休假、休息日、产假等时候。只需遵循书中告诉你的做法，时间会有你问这些问题的，相信我。\n\
  如果你没有问题，就不要问。告诉他们你没有问题。\n## 备选答案\n我对这家公司做了很多研究，我确定它拥有我需要的一切，所以我没有问题了。我在其他面试中通常问的问题是公司是否支持员工进修，但我已经知道你们是支持的。不要每次都用这个答案，要提问。\n\
  ## 备选答案\n不，我没有问题。他们可能会问你确定吗，然后你回答`是的`，我确定。\n## 面试结束\n面试后，给每位面试官发送一封感谢信，最好在当天。利用它来重申你的兴趣，并提及讨论过的话题。\n\
  \n\n\n\n\n# 研究组成\n\n- 标题\n- 背景信息\n- 研究目的\n- 研究目标\n- 研究问题/假设\n- 研究课题\n- 研究意义\n- 文献综述\n\
  - 研究方法论\n- 研究策略\n- 目标总体与抽样\n- 数据/收集\n- 数据分析\n- 报告撰\n\n## 文献综述\n文献综述是对与研究主题相关的书籍、学术文章及任何其他来源进行评估，以根据所正在调查的研究问题对这些作品进行批判性评价。\n\
  \n## 研究方法论\n研究方法论是研究将采用的具体程序或技术，它描述了研究中所应用的假设、原则和过程。它还解释了所使用的问题类型、假设；设计和数据收集方法。\n\
  \n## 目标总体与抽样\n总体是指任何共享某些共同特征的完整实体群体，通过向这些实体提问来收集所需信息。抽样方法是指选择构成目标总体部分的参与者，以确保实现对更大总体的泛化。\n\
  \n## 数据/收集\n数据收集是指收集信息以对研究问题进行批判性评估的过程。它还解释了研究人员如何为研究学习产生或收集数据。\n\n## 数据分析\n数据分析是指对数据进行检查、分组、制表、总结、测试或重新组合以解决研究问题。数据分析的目标使数据产生意义。\n\
  \n## 研究类型\n- 定量研究\n- 定性研究\n- 描述性研究\n- 分析性研究\n- 应用研究\n- 基础研究\n- 探索性研究\n- 结论性研究\n\
  - 理论研究\n- 实验研究\n\n## 最常用的研究方法\n- 参与观察\n- 调查\n- 访谈\n- 焦点小组\n- 实验\n- 案例研究\n- 二手数据分析\n\
  - 混合方法（上述方法的结合）\n\n## 调查类型\n- 在线调查\n- 纸质调查\n- 电话调查\n- 一一面试\n\n## 观点\n让我们回顾：面试技巧\n\
  \n### 不要恐慌\n始终记住，面试只是你与面试官之间的对话，讨论你的技能、资历经验，其他一切都是专业上的时间浪费。只需专注于你的技能、资历经验，就不会出错。\n\
  \n### 准备好简历副本\n在一个专门用于面试的漂亮文件夹里准备好你的 `CV`。根据统计数据，获得一份工作大约需要 16 次面试。所以，收好那个文件夹。你可能还需要用几次。\n\
  \n### 保持积极态度\n永远不要对你之前的工作发表负面评价。当他们向你展示东西时，给出积极的评价。永远不要对你的一天或其他任何事情说任何否定的话。\n\n\
  ### 不要漫谈\n保持答案简短扼要。根据需要详细阐述以表达你的观点，但不要漫谈。不要说话超过两分钟。我知道两分钟听起来没什么，但把你的故事写下来并录音，你会惊讶于自己在两分钟内能表达这么多。使用\
  \ `SARS` 技术将帮助你的故事更简洁。保持主题；与其东拉西，宁愿什么都不说。\n\n### 做好准备\n回顾书中解释的所有六个步骤，帮助你充分准备。如果你准备不足，不要恐慌，否则你面试失败不是因为准备不足，而是因为你在恐慌。请阅读上面关于如何不恐慌的指南。\n\
  \n### 成功案例\n这一切取决于证据；你必须用例子或物理证据支持你所说的任何话。提供的证据越越越好，不要泛泛而谈，要详细解释。\n\n### 清单\n列出你准备面试时需要做的一切事项的清单，或使用书中提供的清单。\n\
  \n### 问题……问题……问题……\n确保你至少练习了 40 个常见的面试问题。确保你对职位要求和职责了如指掌，因为问题将围绕这些内容展开。\n\n### 成长\n\
  个人成长和发展是人类可以学习的最重要技能之一。列出你过去参加的面试中所犯的所有错误，以及你如何修复它们。如果你找不到修复错误的方法，就一直继续阅读面试书籍，你最终会找到答案，或者使用互联网或询问他人。在社交网络如此发达的今天，你利用它们来获得益处。\n\
  \n## 如何增强信心\n找出你的公司对你申请的那个特定职位最看重哪些技能。不需要很多，例如，对于大多数财务职位，最需要的技能是 `MS Excel` 和数据分析。\n\
  \n始终记住保持专业，即使面试官可能很开玩笑甚至有些不专业。\n\n了解什么构成了公司的完美候选人，并表现得像那个人。检查所需的技能、资历和经验。职位名称并不重要。\n\
  \n记住控制你的呼吸；缓慢呼吸以增强信心。此外，面试前走动或在面试期间喝冷水有助于增强信心。\n\n紧张是可以的，这对面试官来说并不意外。尽力放松，不要为微小错误感到过大压力。\n\
  \n记住呼吸并思考你的答案。通常，当人们被问及无法回答的问题时，会开始恐慌。记住，面试的问题只有寥几个，面试官并不期望你回答所有问题，因此，如果你读了这本书，你应该能够正确回答大多数问题。不要担心那些你答错的其他问题，如果你不知道答案，不要犹豫直接说。\n\
  \n如果你不知道答案，立即承认，大声思考你的思考过程并让他们知道你正在思考，承认你不知道。这显示出你投入了其中并且想要好好回答。\n\n永远不要在面试中尝试发挥创造力，完全按照准备好的回答。即使他们问你一个具有创造力的问题，也坚持基础。创造力会体现在你的基础答案中，而不是去刻意追求。\n\
  \n## 做什么\n\n\n\n\n\n# 面试指南\n\n## 应该做的 (Dos)\n* 微笑\n* 保持冷静\n* 保持眼神交流\n* 如果快速转身说话，请放慢速度\n\
  * 准备一份你的故事清单\n* 穿西装（蓝色、灰色或黑色，配白色衬衫）\n* 在保持眼神交流并微笑的同时，进行坚定但不要用力过猛的握手\n* 站起来迎接面试官（很高兴见到你）\n\
  * 将简历装在整洁专业的文件夹里带上\n* 关闭手机\n* 尝试用 STAR 法则来组织你的回答\n\n## 不应该做的 (What not to do)\n\
  * 不要来得太早。\n* 不要迟到。\n* 不要喷过多的香水。\n* 不要害怕重复简历中已有的。\n* 回答时不要给出主观意见。提供证据和成功案例。\n\n记住，这些人已经想雇佣你了，他们信任你，他们已经看到了你是一个什么样的人，他们只是想确认这一点。所以，不要试图表现得与众，遵循基础即可。闭嘴，回答他们的问题，然后离开。这些人永远不会面试他们不想雇佣的人。记住，他们是站在你这边，而不是针对你。\n\
  \n## 遵循基础\n### 准与忌\n* 信心与恐慌\n* 着装规范与礼仪\n* 技巧与流程\n\n![](img/image_rsrc4MW0.jpg)\n\
  ![](img/image_rsrc4MW1.jpg)\n\n## 无需经验的工作\n* 客户代表\n* 房地产经纪人\n* 销售代表\n* 医疗助理\n* 行政助理\n\
  * 兽医助理\n* 客户服务专家\n* 法律助理\n* 育儿员或照顾宠物\n* 自由职业\n* 在线工作\n\n## 如何快速找到工作\n* 研究你收到的反馈\n\
  * 创建一份最完美的简历（通过不断修改）\n* 在简历上将你的技能表格化\n* 精通职位面试技巧\n* 确保你的社交媒体上没有负面信息\n* 持续提高你的技能\n\
  * 申请职位比市场上任何人都多\n\n## 如何建立成功的职业\n* 设定目标\n* 简历品牌化\n* 了解你的优缺点\n* 承担责任并设定你的标准\n* 找一位导师\n\
  * 建立人脉并申请工作\n\n### 撰写良好职业目标的技巧\n* 梦想远大\n* 确定你的竞争优势\n* 灵活且适应能力强\n* 将职位要求与你的教育背景匹配\n\
  * 评估你目前的技能\n* 记住你的兴趣\n* 考虑工作的增长和需求\n\n以下是根据金钱和需求排名的热门工作。\n* 统计师\n* 医疗领域\n* 技术领域（软件开发人员和数据科学）\n\
  * 金融\n* 教育\n* 技术性工作（工程等）\n* 商务服务（包括咨询、管理和销售）\n\n* 由于信息技术导致需求减少的职位列表\n* 旅行社代理\n*\
  \ 收银员和银行柜员\n* 邮递员\n* 体育裁判\n* 电话营销员\n* 秘书\n\n## 如何在没有工作经验的情况下工作\n* 筛选职位（这意味着每天申请超过\
  \ 50 个职位）\n* 研究筛选收到的反馈，研究你在哪些领域最受青睐。\n* 专注于这些领域并继续每天申请 50 个职位。\n* 记住，需要申请 5600 次才能获得你的理想工作。每天申请\
  \ 50 个，需要 4 个月才能获得理想工作。\n\n## 如何享受你的工作\n* 保持积极的态度\n* 拥有与工作无关的个人生活\n* 创建待办事项列表\n\
  * 需要时委任务\n* 定期进行短暂休息\n* 让你的工作环境更愉快\n* 计划并回顾你的一天\n* 努力且聪明地工作\n* 建立常规\n\n## 电话面试技巧\n\
  * 穿得得体。这可以让你感到很专业并认真对待事情。\n* 确保你在一个有桌子的安静房间里。\n* 准备好你申请的职位描述以及写好的笔记（技能、资质和经验）。这就像是一场开卷考试。记住在收到面试邀请时，要求对方将职位描述发给你。\n\
  * 如果你喜欢，可以站着。科学表明站立时说话更清晰。这是因为你的膈肌会放松，胸部打开，所以你呼吸和说话更轻松。你可以走动，如果你感到害怕，这有助于你放松。\n\
  * 确保信号良好，如果信号不好，不要强行继续，而是要求用另一个号码拨打。\n* 如果没有听清问题，请询问。\n* 确保说话声音大到能被听到，不要说得太快。\n\
  * 不要漫谈，保持你的回答清晰明了。\n* 微笑，这有助于你放松并听起来更有自信。\n* 保持冷静放松，不要害怕停顿思考，当他们保持时不要恐慌，他们可能在做记录。\n\
  \n## 面试技巧\n* 将你的技能、资质和经验与职位要求匹配。职位名称并不重要。重要的是你的技能、资质或教育背景与职位说明相似。\n* 练习如何回答面试问题。一种方法是写下做过的技能、资质和经验，然后背诵它们，增加获得机会的机会。\n\
  * 研究公司。\n* 练习评估测试（如果有）。永远不要在没有练习的情况下去参加评估测试。\n* 了解面试中该做什么和不做什么（包括着装规范）。\n* 跟进。\n\
  \n### 你可以在职位面试中问的问题示例：\n* 你们员工共同的性格特征是什么？\n* 如果我想多付出一份努力，我需要做什么？\n* 如果你雇佣我，每天对我期望的首要任务是什么？\n\
  * 你们支持想要进一步学习的员工吗？\n* 你们公司的核心关注领域是海洋学、气象学和化学。你认为你们的第一大特征是什么？\n* 我在你们的网站上读过一篇关于公司计划开设水文学部门的文章，那是两年前的事了。该计划还在进行吗？\n\
  * 我应该如何以及何时与你跟进？\n* 根据我的背景和技能，你认为我在这个职位上最大的挑战是什么？\n* 在目前的职位上，你们公司认为成功代表什么？\n\n##\
  \ 求职工具\n* 社交媒体\n* 应用程序\n* 电子邮件\n* 搜索引擎\n\n## 求职步骤\n* 始终更新你的简历\n* 在公司网站上完成在线简介\n\
  * 有效利用互联网\n* 搜索并申请工作\n* 准备面试\n* 准备评估测试\n* 通过面试\n* 仔细选择你的推荐人\n* 获得录用通知\n\n## 任何员工所需的顶级技能\n\
  * 敏锐度\n* 良好的沟通能力\n* 团队合作\n* 谈判技巧\n* 解决问题 / 分析能力\n* 领导力\n* 压力管理\n* 信心\n\n## 从哪里获取关于公司的信息\n\
  * 公司网站\n* 谷歌\n* 与他们的雇主交流\n* 在 `indeed` 等职位搜索引擎上阅读公司评论\n* 新闻稿\n\n## 关于公司的了解内容\n*\
  \ 他们的使命、愿景和价值观（通常在公司网站上）\n* 公司奖励和成就\n* 公司部门和规模\n* 公司声誉\n* 他们的产品和竞争对手\n* 了解行业表现。（通常在股市网站如\
  \ `moneyweb`）\n\n## 如何将你的技能、资质和经验与职位描述匹配\n* 将职位描述总结为技能、经验、知识和职责，并写下使用的关键词。\n* 总结你的技能、资质和经验。写下关键词\n\
  * 比较这两个总结并看是否匹配。这就是你在面试中讨论的内容——你的技能、资质和经验如何匹配职位描述。记住，面试是你和面试官之间的对话，主题是你的技能、经验和教育；仅此而已。\n\
  \n\n\n\n进行研究、学习，并确保你对所欠的技能以及你要求的职责有深入的了解。这些将帮助你回答关于你从未接触过的领域的技术问题。然而，如果你不知道某些内容，请务必诚实，因为面试官很可能知道你不知道问题的答案，他们只是想看看你是否诚实。没有人想雇佣一个谎者，即使是政客也是如此。\n\
  \n## 雇主寻找的常见技能\n\n*   沟通能力\n*   团队协作\n*   职业道德\n*   分析与解决问题的能力\n*   人际交往能力\n*  \
  \ 灵活性\n*   计算机技能\n*   细节关注度\n*   领导力\n*   组织能力\n\n## 面试技巧\n\n*   深入了解该职位的每一个细节。\n\
  *   准备成功案例并进行练习。\n*   面试官更感兴趣的是你如何回答问题的，他们更关注你的思维过程，并想了解你是如何思考。\n*   根据职位描述列出你可能被问到的问题清单，并尝试找到答案。回答问题时始终务必使用\
  \ `SARS` 技术，并用成功案例作为示例。\n*   尝试寻找该特定岗位的面试题并进行练习。\n*   找到与你所面试职位相同的人并向他们请。这些人可能是你认识的人、同事、职场前辈，甚至是社交媒体（如\
  \ `LinkedIn`）上的陌生人。\n*   浏览互联网查看该特定岗位常问的问题。\n\n## 雇主在候选人寻找的职业道德特质包括：\n\n*   自律\n\
