  \ 10%。\n\n\n\n\n\n# 从待办清单开始工作\n\n自律是一种无论你的身体或情感感受如何，都能强迫自己前进并采取行动的能力。要保持自律并执行计划，需要动力、意志力、坚持和目标设定能力。\n\
  \n## 如何提高你的自律\n- 明确定义你的目标。\n- 承诺并言出必行。\n- 避免诱惑。\n- 致力于养成习惯。\n- 阅读。\n- 少参加派对（每月一次）。\n\
  - 意志力胜过情绪。\n- 原谅自己不完美的自己。\n- 保持自发驱动力。\n- 喝黑咖啡。\n- 为一切事情制定计划（列待办清单）。\n- 将你的目标放在每天都能看到的地方。\n\
  - 写下你开始的原因。\n- 先设定小目标。\n- 区分优先级。\n- 了解你的优缺点。\n- 让别人监督你。\n- 认到自律是一个学习过程。\n- 停止拖延，开始行动。\n\
  - 消除干扰因素。\n- 创建一个让你兴奋的常规流程。\n- 承担责任。\n- 照顾好你的身体。\n\n（此处省略原文后续重复且逻辑破碎的段落，已按文档规范处理）\n\
  \n\n\n\n职业可以被定义为一个人拥有的技能、教育和经验。规划职业将帮助你有效地利用自己的优势，帮助你朝着正确的方向发展，并建立你的信心。不要害怕远大目标，然后将你的目标拆解为更小的里程碑。制定一个十年计划、一个五年计划和一个年度计划。经常回顾你的计划并根据情况进行调整。记住，灵活性和适应能力是关键。\n\
  \n## 建立职业\n建立职业可能是一件非常棘的事情。你需要阅读许多书籍、观看许多视频并寻找一位导师。让一个已经建立了成功职业的人担任你的导师，通过仅仅提供不同的视角，就能帮助你解决你将遇到的大部分问题。\n\
  \n设定 SMART 目标，并对未来自己所处的自己有一个愿景。这应该包括你的优势、劣势、机会和威胁。警惕那些在不久将来将消失的职业。始终采取行动，以免错过机会。要负责任，设定好你的标准，并建立一份出色的简历。\n\
  \n你的 `CV` 就是你的品牌，确保给它精良的设计，维护它并对其进行良好的市场营销。当你向公司发送 `CV` 时，你实际上是在推销你的品牌。学习营销技能并持续推销你的\
  \ `CV`。人脉经营是推销品牌的另一种方式。人脉还将帮助你让自己周围充满成功人士，从而能够改善你的视角。你是你周围的人的平均值，所以请明智选择。\n\n##\
  \ 制定良好职业目标的贴士\n在设定目标时，确保你的梦想远大并设定高标准。寻找一个能让你具有竞争优势的职业。这意味着你已经具备了该职业所需的技能。即使你没有工作经验，每个人都有自己擅长的技能。这项技能就是你的竞争优势。\n\
  \n记住，选择一个你感兴趣的职业会有帮助。这意味着在你拥的所有技能中，哪一个让你最感兴趣，但要始终记住工作需求和职业增长。确保你一直学习到终老。如果你没有在任何机构注册并学习，你就犯了错误。永远不要停止学习。这将帮助你在职业生涯中不断成长，帮助你快速成长，并让你的薪水不断增长。薪水的\
  \ 10% 应该用于你的学习。我将写一本关于财务的书，解释剩下的钱应该流向何处。\n\n## 职业\n医疗领域永远需要人才。牙科医生、医生、正畸医生、执业护士和医生收入非常丰厚。信息是人生中最重要的资源之一。教育是一门销售信息的业务。因此，教育领域的工作将永远存在。\n\
  \n信息技术发展非常快。这使得软件开发者和数据专家的工作需求很大，且薪水很高。统计学家主要在数据分析领域工作，由于 IT 的快速发展，该领域增长得非常快。在我的下一书中，我将讨论\
  \ `IT` 领域和数据分析的职业。技术正在改变劳动力市场，导致某些工作的灭绝。这是因为在 IT 的帮助下，这些工作可以更高效、更便宜地完成。\n\n## 如何赚钱\n\
  找工作、就业、薪水、财务管理、商业、利润、增长、成功、财富……找工作是赚钱最简单的方法。\n\n### 有效找工作的步骤\n\n\n\n\n\n# 管理好你的时间\n\
  \n申请工作是非常耗费时间的。你需要自律并监控自己，记录下你在特定时间内申请了多少份工作。不断改进，并保持一致性。\n\n## 接受拒绝\n你将收到来自许多公司的拒绝邮件。不要被拒绝信息所困扰，你可以从获得的积极回复中学习更多。我会向你展示如何做到。\n\
  \n### 跟踪你收到的回复\n研究你收到的每一个公司的积极回复。再次查看职位描述，并将其与你的 `CV` 进行对比。寻找你的 `CV` 与职位描述的共同之处。那就是他们给你积极回复的原因。\n\
  \n### 全方位地寻找工作\n找不到工作的人，问题在于他们每天只申请一份工作，然后在该月的剩余时间里里抱怨失业率。尽可能申请尽可能多的工作。申请、申请、再申请。每天至少申请\
  \ 50 份工作。\n\n### 持续改进你的简历\n尽可能申请工作的重要点在于，你可以研究就业市场并据此修改简历。不要害怕修改你的 `CV`。每周审查并编辑你的简历。字面意义上的每周一次。\n\
  \n### 从失败的面试中学习\n你申请的工作越，，获得面试的机会就越多。这就是我所说的创造运气。你正在增加获得面试的概率。这不是魔法，而是统计学。你会面试失败，这是肯定的。从你的失败中学习。你需要\
  \ 16 次面试才能获得你的理想工作。\n\n# 快速找到新工作的方法\n\n## 采取策略\n获得理想工作的策略很简单：尽可能申请尽可能多的工作，监控积极回复，据此修改简历并持续申请。申请得越多，获得的面试就越多。记住，需要\
  \ 16 次面试才能获得你的理想工作。\n\n## 建立人脉\n不要抱着希望人脉会给你工作的想法去建立人脉。这可能发生，但那不是目标。建立人脉的根本目标是获取改变你求职视角的信息。失败始于心态。人脉会解决这个问题。\n\
  \n### 筛选职位\n如果你处于失业状态，那么你电脑上唯一应该打开的应该是职位搜索搜索引擎。搜索、搜索、搜索。关上这本书，开始找工作吧。这就如此。\n\n###\
  \ 了解你的技能\n写下你所有的技能并在简历上将它们列成表格。很多人没有这样做。这是一个巨大的错误。现在就去做。这会让你的技能更易于可见。如果你没有技术技能，就写下软技能，例如沟通、领导力、团队合作……\n\
  \n### 每天花超过 8 小时找工作\n如果你失业了，就把找工作当成你的全职工作。每天投入 8 小时，包括周末。当然，如果你对找工作并不认真，你可以在周末休息。\n\
  \n# 找工作贴士\n\n### 准备好你的证书和简历\n你的证书应该准备好，以防他们要求，否则只需发送你的 `CV` 来申请工作。如果他们没有要求，不要发送证书，否则你为雇主增加了不必要的工作。\n\
  \n### 找到最适合你的职位搜索引擎\n最好的搜索引擎是没有广告、没有无杂杂且易于使用的。你希望直接从雇主网站申请工作，因此最好的职位搜索搜索引擎应该有一个过滤招聘板的选项，以便你可以专注于直接来自雇主网站的工作。\n\
  \n### 设定目标\n你的目标很简单。你的目标是找工作。通常，需要 16 次面试才能获得一份工作。而需要 350 次申请才能获得一次面试。基本上，你需要 350\
  \ 乘以 16 次职位申请才能获得一份工作。这就是他们所谓的 `SMART` 目标。\n\n### 在线搜索\n第四次工业革命。互联网。这就是我们现在的方式。尽可能多学习计算机知识。在线申请工作。这就是我们现在的办事方式，我会写很多关于技术的书。拿一本来教育自己吧。\n\
  \n### 使用社交媒体\n社交媒体是建立人脉的绝佳工具，我在上面提到过为什么建立人脉对求职非常重要。利用社交媒体加入有帮助的群组，并关注正确的人，尤其是招聘人员。\n\
  \n### 申请政府工作\n职位搜索引擎的一个优点是它们将所有工作汇聚在一个地方。然而，有时职位搜索引擎不会显示政府工作。确保你手动查找并申请。全方位地寻找。\n\
  \n### 寻求推荐\n请你认识的任何一个人去询问他们的经理，工作场所是否有空缺，以便你可以在那里工作。试一下并无大益。\n如果你急于快速找到工作，尝试申请那些不需要经验的工作，这些通常是助理类和代表类工作。\n\
  \n# 动力\n动力是实现的渴望。无论是在工作、学校、体育还是商业领域，动力都能帮助你实现目标和梦想。\n\n\n\n\n奢侈品（Luxury）可以被定义为我们购买但对人类生存并非必需的昂贵物品。这包括昂贵的汽车、豪宅、小摆件等。奢华的生活方式是人们追求成功并努力赚钱的动力之一。如果使用得当，对奢华生活的追求可以成为一种很好的动力。如果你想过奢华的生活，你就必须努力且聪明地工作，这样才能赚钱并实现目标。\n\
  \n人们想过奢华的生活，是因为人们通常认为只要你有足够的钱，所有的问题都会消失。钱，加上其他资源和良好的性格特质可以解决你的所有问题，然而单靠钱无法解决所有问题。因此，必须记住，无论你有多少钱，无论你的生活方式多么奢侈，你仍然需要强大的核心价值观和领导力，这样你才能将它们与钱结合，高效地解决所有问题，从而带来健康、财富和成功。\n\
  \n## 如何保持动力\n- 制定 SMART 目标。\n- 从失败中学习。\n- 从弱点中获更多。\n- 记录你的成就。\n- 每日回顾目标和进度。\n- 设定新目标。\n\
  - 喝咖啡。\n- 寻找导师。\n- 每日锻炼。\n- 不要要求自己完美。\n- 使用积极的自我暗示。\n- 创建待办清单。\n- 发挥你的优势并改进你的弱点。\n\
  - 认可你的成就。\n- 不要放弃，休息并寻求帮助。\n- 避免分心。\n- 开始开始——无论大小，，并不重要。\n- 将任务拆解为小的步骤。\n- 建立积极心态。\n\
  - 在每个里程碑后奖励自己。\n- 缩短你的待办清单。\n- 设定让你兴奋的里程碑。\n- 消除压力。\n- 减轻负担。\n- 过健康的生活方式。\n- 保证睡眠。\n\
  - 保持良好的体重。\n- 限制酒精摄入。\n- 休息片刻。\n- 征求反馈。\n- 简化你的生活。\n- 迈小步。\n- 学习新知识。\n- 规划你整的一天。\n\
  - 不要等正确了才。\n- 盯紧目标。\n- 散散步。\n- 保持专注并记住你的“为什么”。\n- 在目标中找到你感兴趣的事。\n- 告诉别人你的目标。\n-\
  \ 跟踪你的进度。\n- 设定小的、易于处理且可衡量的目标。\n- 关注大局。\n- 开发口诀。\n- 创建常规。\n- 思考通过小增量完成。\n- 不要把任何事情看作苦差。\n\
  - 每天阅读。\n- 创建时间表。\n- 建立专门的工作区。\n- 分小块时间工作。\n- 挑战自己。\n- 练习良好的自我照顾。\n- 关注不一致性。\n\n\
  ## 什么在激励人们？\n- 钱。\n- 学习的欲望。\n- 帮助别人的欲望。\n- 对美好事物的渴望。\n- 控制欲。\n\n## 动力的类型\n- 外在动力（为了实现或避免某种结果）。\n\
  - 内在动力（成功的内在驱动）。\n- 家庭（为爱的人提供的欲望）。\n\n## 如何提升心情\n- 微笑。\n- 保持忙碌（看喜剧电视节目）。\n- 与人聊天。\n\
  - 帮助他人。\n- 活在当下。\n\n## 如何过奢华的生活\n- 精通技术。\n- 购买奢侈品牌。\n- 保持健康生活。\n- 持续学习新技能。\n- 建立良好的人关系。\n\
  - 少工作并定期休息。\n\n## 比特币、加密货币与交易\n钱、交易、损失、信息、增长、成功、财富……每个人都认为自己可以战胜市场。\n\n加密货币（`crypto`）是一种数字货币，可以使用在线账本来记录和保护在线交易以购买商品和服务，而不是通过银行。加密货币正受到许多关注，因为它有潜力改变目前世界的交易进行方式，然而，大多数人将这种关注误认为是交易的机会。\n\
  \n交易非常有风险，无论你交易的是什么。如果你想从加密货币中赚钱，你所需要做的只是注册一个区块链课程，获得证书，在加密货币领域找份工作，可能他们会付你很多钱，因为这是一个新领域。区块链是交易的数字记录，交易使用稳定的加密签名进行记录，并且记录为了安全目的在整个计算机系统网络中复制和分布。这意味着当你用加密货币（如\
  \ `Bitcoin`）买房子时，你不再需要去银行进行交易了，你只需要在手机上买房子，你的交易将被记录并存储在区块链上，它是一个数字账本/记录。这就是加密货币的好处。加密货币的坏处是每个人都想开始交易加密货币，因为他们感受到了热度，但他们没有意识到加密货币的热不是为了交易，而是为了改变全球经济。这种误解导致许多人亏钱。\n\
  \n### 比特币\n`Bitcoin` 是一个计算机文件（电子币），存储在你智能手机或电脑的数字钱包应用中，你可以通过数字钱包分享比特币，每一笔交易都记录在名为区块链的公共列表中。你可以轻松地以极低的手费立即将比特币卖成现金或黄金等资产。你可以像交易股票或外汇一样交易\
  \ `Bitcoin`，而且像任何其他交易工具一样，大多数人在交易 `Bitcoin` 时都会亏钱，我会建议你不要交易 `Bitcoin`，直接远离交易即可。\n\
  \n### 交易\n交易通常涉及频繁地买卖股票或货币，试图把握市场时机并获取快速利润。目标是低买高卖。有些交易者是日内交易者，这意味着他们整天买卖。大多数交易者在交易\
  \ `Bitcoin` 时都会亏钱，我鼓励你停止交易或永远不要开始。这本书会解释如何不通过交易变得富有。如果你还想尝试交易，在丢钱后从错误中学习并永远不要再做。\n\
  \n## 如何交易股票、外汇或加密货币\n- 开一个账户。\n- 设定预算。\n- 学习使用市价单和限价单。\n- 研究市场。\n- 虚拟交易。\n- 衡量你的盈亏。\n\
  \n### 交易平台\n- `Ameritrade`\n- `Fidelity`\n- `Robinhood`\n- `Merrill Edge`\n\n###\
  \ 购买比特币\n- 创建账户。\n- 验证你的手机。\n- 添加支付方式。\n- 购买 `Bitcoin`。\n- 检查数字钱包。\n\n### 加密货币\n\
  - `Bitcoin` (`BTC`)\n- `Cosmos` (`ATOM`)\n- `Dogecoin` (`DOGE`)\n- `Ethereum` (`ETH`)\n\
  - `Compound` (`COMP`)\n- `Polkadot` (`DOT`)\n\n人们认为可以在交易中获胜，因为他们投入了大量时间阅读技术分析，但他们没有意识到技术分析无法考虑到经济变化。这意味着技术分析是无用的且危险的。这解释了为什么你认识的所有技术分析大师总是亏钱。所以如果你不进行交易，你有更大的机会获胜。\n\
  \n## 成为百万富翁的最佳方法\n- 发展你的职业和专业知识。\n- 为机会留出钱。\n- 投资房地产或基金。\n- 创建一个财务计划。\n- 永远不要交易（股票、外汇、加密货币……）。\n\
  \n## 百万\n职业、增长、资金管理、策略……学习得越多，赚得越多。成为百万富翁从设定目标开始。将你的目标分为更小的时间范围。将你的目标分为每月、每周和每年。每天改变并改进你的目标。这被称为计划，这也是大多数人失败的地方。你可以在任何地方、任何方式成为百万富翁，你只需要保持增长。增长意味着尽可能获取信息。你拥的信息越多，赚的钱越多。成为百万富翁简单的方法是持续思考如何让钱翻倍，记录下来，执行并重复。当你这样做时，在大脑中分析信息，批判性地思考，成为百万富翁不再是幻想，最重要的是看到机会。成功是机会遇到准备。这包括资金管理、信息和动力。这本书涵盖了这一切。这本书将为你准备。当机会来上门时，你知道该做什么。\n\
  \n### 如何成为百万富翁\n- 发展你的职业和专业知识。\n- 投资指数基金和房地产。\n- 专利化一个想法。\n- 建立业务。\n- 跟踪你的支出并减少它们。\n\
  - 为项目和机会存钱。\n- 创建一个让钱增长的计划。\n- 学习新技能。\n- 寻找机会。\n- 低于收入生活。\n\n### 高需求业务\n- 税务准备和记账。\n\
  - 餐饮服务。\n- 网站设计。\n- 商业咨询。\n- 洁洁服务。\n- 在线辅。\n- 咨询服务。\n\n### 易启动的业务\n- 销售顾问。\n- 草坪维护。\n\
  - 育儿。\n- 洁洁服务。\n- 工人。\n- 写作和翻译。\n\n## 财富\n钱、投资、财务规划、现金……努力且聪明。财富由于金和其他物质物品的大量积累而带来的安全感和安心心的状态。这种舒适状态给了你的大脑足够的自由去练习其他技能，从而提高你的性格，结果是你天生成为领导者。要获得成功，你需要持续增长。每个人在生活中都需要成功。成功是在你所做的大多数事情中获得积极结果的能力。这意味着你能够在财务、社交和个人方面实现目标。在生活的所有领域持续增长的能力将带来巨款。这是因为钱是所有资源的代表，随着你变得成功，你将不断积累比你使用的更多的资源。这些资源将以钱本身或物理物质的形式存在。如此大量的钱和物质导致了财富。\n\
  \n### 财富规则\n- 财富取决于你投入了多少。\n- 购买别人的时间。\n- 寻找创业公司并扩大其规模。\n- 为了钱解决问题。\n- 少花多赚并升级。\n\
  - 解决扩展性问题。\n- 阅读财务规划、投资、资产。\n- 停止在无用的爱好上浪费时间。\n- 采取一种适合你的方法。\n- 根据你的计划或待办清单工作。\n\
  - 自动化并委托一切。\n- 衡量并增加你的投入。\n- 将你的技能卖给世界。\n- 延迟满足并在 90% 的时间里工作。\n- 为失业人员创造工作。\n- 90%\
  \ 的时间待在室内，阅读并创造工作。\n- 雇佣优秀的人。\n- 按小时给人们付。\n\n### 投资\n职业、钱、投资、增长、成功……投资房产。投资... ..................................................................\
  \ 永远不要交易... 成为百万富翁。\n\n\n\n\n# 邮件营销类型\n- 信息类邮件。\n- 数字时报。\n- 产品更新。\n- 交易类邮件。\n\n\
  ## 热门社交媒体应用\n- Facebook。\n- YouTube。\n- WhatsApp。\n- 微信。\n- Instagram。\n- TikTok。\n\
  - Twitter。\n\n## 数字化营销的组成\n- 内容营销。\n- 搜索引擎优化。\n- 点击付费营销。\n- 社交媒体营销。\n- 联盟营销与网红营销。\n\
  - 邮件营销。\n\n## 数字化营销的优势\n- 增加客户忠诚度。\n- 在每个购买阶段提供客户支持。\n- 精准定位目标群体。\n- 衡量转化率。\n\n\
  # 销售\n销售、金钱、信息、增长、成功与财富……\n\n## 如何销售\n### 营销的 4P\n- 产品\n- 价格\n- 渠道\n- 促销\n\n###\
  \ 营销的 4A\n- 可接受性\n- 可负担性\n- 可及性\n- 认知度\n\n## 产品\n产品是你提供给的商品或服务。产品应该满足消费者需求，或者在市场中创造新需求。你应该理解产品的生命周期，并为产品在生命周期的每个阶段制定应对计划。如果产品满足了客户的需求，人们就会想要购买。\n\
  \n## 价格\n客户为产品支付的价格应与产品的实际价值和感知价值挂钩，同时考虑供应成本、季节性折扣和竞争对手的价格。你可以提高价格以使产品看起来像奢侈品，也可以降低价格让更多消费者尝试产品，但低价也可能给人一种产品专属性较低的印象。\n\
  \n### 渠道\n在决定销售产品的地点时，你应该让产品出现在最有可能购买它们的消费者面前，并计划如何将产品输送到市场。\n\n### 促销\n为你的产品制定促销策略。促销产品的目的是向消费者展示他们为什么需要它以及他们从中获得什么。随着互联网的兴起，在线和线下推广你的产品都至关重要。\n\
  \n### 可接受性\n产品或服务必须满足或超过客户的需求和期望。可接受性分为两个维度：功能可接受性和心理可接受性。功能可接受是指产品或服务交付客户预期的能力。产品应该是可靠的。心理可接受性通常与品牌或产品的地位有关。人们倾向于购买他们信任的产品。\n\
  \n### 可负担性\n目标市场应该在经济上能够负担，并在心理上愿意支付产品的价格。可负担性也有两个维度：经济负担和心理负担。经济负担关注侧重于目标市场是否付得起产品价格。心理负担是指客户对给定价格的支付意愿，产品的价值应相对于产品或服务的成本。\n\
  \n### 可及性\n可及性描述了客户能否获得产品以及他们是否可以使用该产品或服务。可及性有两个维度：可用性和便利性。可用性衡量库存是否足以满足客户需求。便利性涉及客户获取产品或服务的难易程度。\n\
  \n### 认知度\n客户必须了解产品以及它将如何使他们受益。这将说服客户尝试产品，并提醒现有用户继续购买。认知度的两个维度是产品知识和品牌认知。客户应该信任品牌，并提供有关产品或服务的相关信息。\n\
  \n### 销售流程的六个步骤\n1. 寻找潜在客户。\n2. 准备演示稿。\n3. 接触你的潜在客户。\n4. 进行销售演示。\n5. 成交（询问潜在客户是否想购买）。\n\
  6. 跟进。\n\n### 销售技巧\n- 关注客户需求。\n- 了解你的客户。\n- 建立良好关系。\n- 定义你的销售对象。\n- 增加价值。\n- 提问并倾听你的客户。\n\
  \n## 成功创业者的特质\n- 自律。\n- 他们为人们的生活增加价值。\n- 风险管理能力。\n- 人脉拓展。\n- 金钱管理能力。\n- 灵活性。\n-\
  \ 热情。\n\n## 如何培养创业思维\n- 设定明确目标。\n- 练习果断。\n- 重新定义失败。\n- 保持好奇心。\n- 成为创造性思考者。\n- 采取行动。\n\
  - 倾听。\n- 顾全局。\n- 从经验中学习。\n- 产生影响力。\n- 计算风险。\n- 练习良好的沟通技巧。\n- 永停止阅读。\n- 响应市场。\n-\
  \ 增长与改变。\n\n# 增长黑客\n销售、信息、增长、成功与财富…… 增长是整体性的。增长黑客是营销中的一个领域，专注于公司的增长。它关乎如何明智地使用数据来优化和改进客户旅程。增长黑客的支持来自新技术、营销自动化和分析软件的使用。它专门关注增长，并制定公司可以实施以扩大业务的策略。增长黑客的目标是在花费最少资金的情况下获取尽可能客户。增长黑客是新的营销方式。增长是整体性的，增长策略应该设计到业务的每一个部分。这意味着增长黑客是让业务的每个部分增长以成功满足客户需求的艺术。\n\
  \n## 数字化营销与增长黑客\n数字化营销是在线营销。它是利用互联网和其他数字通信形式来推广品牌并与潜在客户建立联系。这包括电子邮件、社交媒体、网页广告、短信和多媒体信息。数字化营销是在互联网上进行的传统营销。另一方面，增长黑客是利用营销研究研究客户想要什么，然后调整整个运营策略以最好地满足客户，从而导致增长。从营销角度来看，增长黑客是一种数据驱动的精益策略。\n\
  \n数字化营销和增长黑客都使用互联网、移动设备、社交媒体、搜索引擎、展示广告和其他数字渠道来触达消费者。然而，数字化营销关注品牌，而增长黑客则关注通过一切可能的手段实现整个公司的增长。\n\
