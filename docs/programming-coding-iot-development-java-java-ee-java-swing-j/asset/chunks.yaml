  trans: '

    进行研究、学习，并确保你对所欠的技能以及你要求的职责有深入的了解。这些将帮助你回答关于你从未接触过的领域的技术问题。然而，如果你不知道某些内容，请务必诚实，因为面试官很可能知道你不知道问题的答案，他们只是想看看你是否诚实。没有人想雇佣一个谎者，即使是政客也是如此。


    ## 雇主寻找的常见技能


    *   沟通能力

    *   团队协作

    *   职业道德

    *   分析与解决问题的能力

    *   人际交往能力

    *   灵活性

    *   计算机技能

    *   细节关注度

    *   领导力

    *   组织能力


    ## 面试技巧


    *   深入了解该职位的每一个细节。

    *   准备成功案例并进行练习。

    *   面试官更感兴趣的是你如何回答问题的，他们更关注你的思维过程，并想了解你是如何思考。

    *   根据职位描述列出你可能被问到的问题清单，并尝试找到答案。回答问题时始终务必使用 `SARS` 技术，并用成功案例作为示例。

    *   尝试寻找该特定岗位的面试题并进行练习。

    *   找到与你所面试职位相同的人并向他们请。这些人可能是你认识的人、同事、职场前辈，甚至是社交媒体（如 `LinkedIn`）上的陌生人。

    *   浏览互联网查看该特定岗位常问的问题。


    ## 雇主在候选人寻找的职业道德特质包括：


    *   自律

    *   团队意识

    *   诚实

    *   敬业精神

    *   积极的态度

    *   同理心

    *   尊重

    *   责任感


    ## 回答面试问题


    *   用故事和案例回答问题

    *   确保你的故事遵循 `SARS` 技术

    *   提前准备并练习成功案例

    *   准备好要问面试官的问题


