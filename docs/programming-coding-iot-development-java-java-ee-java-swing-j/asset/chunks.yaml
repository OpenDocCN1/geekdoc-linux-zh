    conflict management.• Act like a servant, not a leader.• Change the system not
    the people.Teamwork Rules• Listen to requirements when people talk• Research your
    projects.• GCC design fault.• Support other people''s weaknesses.• Avoid talking
    about any kind of politics.• Focus on your daily tasks.• Always be nice because
    the wheel will definitely turn.• Ask only specific questions related to your tasks.•
    Get your tasks, complete your tasks and the rest is noise.• Be positive, flexible,
    organized, and reliable.• Be nice to everyone.• Don’t be too dependant on one
    person. Diversify.• Teamwork is essential for success.• Avoid lazy people.• Do
    a quality job.• Don’t try to understand everything that''s happening. Understand
    what you should be doing.• What is the goal and how should I go about how to do
    that.• Choose how people treat you by showing your strength and being vocal.•
    Beat the person at their own game.MindfulnessAwareness, Self-Mastery, Information,
    Growth, Success, Wealth...Awareness is the first step.Mindfulness is a state of
    being intensely aware of what you''re feeling without interpretation or judgment.
    Mindfulness helps to relax the body and mind and help reduce stress by learning
    to focus on the present moment. Mindfulness has many physical and psychological
    benefits; this includes self-control, flexibility, improved concentration, mental
    clarity, emotional intelligence and best of all, it prepares you for success.How
    to boost mindfulness• Write down your plans, priorities and goals.• Make time
    to think.• Write your thoughts down.• Get enough rest.• Take care of your health.•
    Be considerate of others.Emotional Intelligence  (EQ)Information, Emotions, Emotional
    Intelligence, Focus, Growth, Success, Wealth...Information controls emotions.Emotions
    are biological reactions triggered by information to help humans survive. They
    are hormones released by the brain which gives rise to feelings. Emotions can
    be triggered by information which can come in different ways for example: listening
    to someone talk, from memories, experiences, events, reading, watching TV, etc.Emotions
    are very powerful forces. They help us to act, survive, avoid danger, make decisions
    and understand others. They allow us to empathize with other people and help us
    share joy or pain. Emotions give meaning to events. The most common emotions are
    anger, disgust, fear, happiness, love, jealousy and sadness.Negative emotions
    narrow your thinking and have the potential to adversely impact your performance
    on simple tasks. They can make us lose control when we are continuously fed with
    the same thought about something and they can make us take decisions in life that
    we will regret our entire life. Suppressing your emotions can lead to physical
    stress on your body which can, in turn, lead to medical conditions such as blood
    pressure, memory and self-esteem issues.Emotional IntelligenceEmotions can change
    your mood and it is your job to actively control your emotions and keep yourself
    in a good mood. Learning how to change your negative emotions to positive emotions
    is called emotional intelligence. You have to know what is it that can turn your
    sadness into Joy. Positive emotions have the potential to improve creative thinking
    and positive thinking which can result in positive emotions. Thinking positively
    is one of the easiest ways to generate positive emotions.Emotions impacts how
    we think and behave, and how we think and behave impacts our emotions. Emotions
    can compel you to act and influence the decisions you make about life. Behaviour
    is strongly influenced by emotions. It is very difficult to remain productive
    and focused if you are sad, therefore, emotions play a very important role in
    achieving success. When a person feels frustration, anger, tension or fear, they
    become distracted which is not at all productive. You have to learn how to control
    your emotions to make sure that you can always keep your cool and remain productive.To
    be able to control your emotions you need as much information as you can find
    about all areas of life. You need to know why some things happen and why other
    things don’t. You need to know why, when, what, where and how. The more you know
    the more you realise the truth about life. The truth is everything in life works
    in your favour, but you will never see that if you don’t have enough knowledge.
    That is called wisdom. Wisdom is the state of having enough knowledge to always
    remain calm. This is because wise people know and understand the benefits of everything
    that happens in life. When things go south wise people see opportunity. The ability
    to control your emotions like this is called emotional intelligence.Negative Emotions•
    Fear.• Anger.• Disgust.• Sadness.• Rage.• Loneliness.• Annoyance.Positive Emotions•
    Joy.• Hope.• Pride.• Amusement.• Inspiration.• Love.• Happiness.Key elements of
    emotional intelligence• Self-awareness.• Self-management.• Social skills.• Conflict
    management.WisdomInformation, Emotions, Decisions, Focus, Growth and Success...Think
    before acting.Wisdom is the ability to make rational and ethical decisions in
    the face of uncertainty. This requires a structured thought process and the discipline
    to think before acting. Information leads to growth which leads to success. However,
    information has to be transformed into knowledge by a simple act of thinking.
    Thinking is just a simple process of breaking down information into smaller pieces
    so that the brain can understand it. Wisdom is the discipline to act or not act
    on that knowledge which is a very challenging thing to do.Discipline is difficult
    because it involves emotions, and if you go against your emotions you can get
    hurt, uncomfortable or you can simply become unhappy. No one wants to be unhappy.
    Emotions are controlled by knowledge. Ears capture information, the brain transforms
    the information into knowledge, knowledge releases emotions, emotions make your
    body want to take action. One has to make the decision whether to act or not.
    If you make the right decision, then that is wisdom. If you make the wrong decision,
    then you have the opportunity to learn from your mistakes, provided you have the
    right mentality.Build Wisdom• Be patient.• Think before acting.• Be humble.• Read
    a lot.• Have a strong belief system.• Listen and analyse (all knowledge is power).DisciplineInformation,
    Distractions, Discipline, Goal Achievement, Growth, Success, Wealth...'
