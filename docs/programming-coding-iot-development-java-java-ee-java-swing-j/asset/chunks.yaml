- fmt: "\n## Alternate answer\nOne of the problems that we faced at my previous company\
    \ was that doing dissolutions took time because the water in the dissolution bath\
    \ took forever to heat up. To solve this problem, I suggested that the first person\
    \ to do dissolution in the morning should not wait for the bath to heat up before\
    \ they put in the medium but rather put in the medium as soon as they get to work\
    \ and let the bath temperature increase simultaneously with the vessel temperature.\
    \ This saves time. My suggestion was so great that it got implemented immediately.\n\
    \n## Question: What will you bring to the office?\n### Answer\nI will bring my\
    \ extensive knowledge and meteorological skills but most importantly I will bring\
    \ excellent teamwork and communication skills. The reason why I say that these\
    \ skills are very important is because every office has goals they want to achieve\
    \ and without team work and effective communication, an office will not achieve\
    \ its goals. So, with these two skills I can help the office achieve its goals\
    \ and continue achieving in years to come by continuous improvement on these skills\
    \ and other skills. As I have already explained, my reference letter from my previous\
    \ company proves that I have good communication skills and I consistently achieved\
    \ good results, also my supervisor scored me `100 %` on my communication skills\
    \ and teamwork skills on my performance assessment this year at my current company.\n\
    \n## Question: Tell me about a confrontation you had at your last job \n### Answer\n\
    So far, I haven’t had any confrontation, I have only been working for three years.\
    \ However, if I had a confrontation with someone, I would empathize with them\
    \ and try to see the issue from their view. It is said that for every conflict,\
    \ there is something each person could have done to avoid the conflict. Personal\
    \ growth comes from studying what is it that you could have done to avoid conflict,\
    \ and never do the same mistake again.\n\n## Question: But you are over qualified…?\n\
    ### Notes\nThere is no such thing as being over qualified but since you need a\
    \ job, let us see how you can answer this question in a polite manner.\n### Answer\n\
    I have really thought about that and I can get a job that suits my qualification,\
    \ but I think I will be more fulfilled with being a meteorological technician\
    \ because I know this industry well and I have passion for this. So, it is all\
    \ about finding a job that would fulfill my passion rather than a job that would\
    \ suit my qualification only to find that I do not like it.\n\n## Question: Why\
    \ are you moving on?\n### Answer\nI really need to be in a placed where I can\
    \ be managed, developed and where I can get guidance and mentoring.\n### Alternate\
    \ Answer\nI need to take on more responsibility; and with my extensive laboratory\
    \ experience, I feel that I am in a good position to take on more responsibility.\n\
    \n## Question: How well do you handle change?\n### Answer\nI am extremely good\
    \ at handling change. I went from being a laboratory analyst where I was working\
    \ with chemicals every day to be a meteorological technician which has nothing\
    \ to do with chemicals and now I am a data specialist. I make sure that I master\
    \ everything in training during induction and I go an extra mile by reading books,\
    \ articles and most importantly, by enrolling in a course.\n### Alternate Answer\n\
    Also, I have worked on Marion Island which is totally different environment. Marion\
    \ Island is a remote Island south of Africa in the Indian Ocean. There is no civilization\
    \ on the island, only scientist go there to study the area. We lived with a team\
    \ of `20` scientists for a year which requires excellent teamwork skills and the\
    \ ability to adapt to change. So, I read communication skills book (mention them)\
    \ and teamwork books to better my skills. As a result, my supervisor rated me\
    \ `24.25` over `25` for our biannual performance assessment.\n### Alternate Answer\n\
    I changed from working `8` to `5` to working shifts. Shifts are challenging because\
    \ you do not have an everyday `8` to `5` routine. But due to my excellent planning\
    \ skills I enjoy working shifts.\n### Alternate Answer\nI studied at the `University\
    \ of Cape Town` (`UCT`) which is very diversified, there are a lot of international\
    \ students, so you have to learn about different cultures of different countries\
    \ and continents so that you can be able to interact with them every day. So,\
    \ I started reading books on how to communicate successfully with everyone. As\
    \ a result, I managed to make a lot of friend and study buddies which is one of\
    \ the explanations of how I managed to graduate with a triple major degree.\n\
    ### Alternate Answer\nI did a short course at the `University of Stellenbosch`.\
    \ Stellenbosch is different from Cape Town in every way, their rules, their residential\
    \ areas, the work ethic, etc. So, I had to adapt and fast. At the end of the course\
    \ I was awarded certificate. *Don’t give too much info and don’t give little.*\n\
    \n## Question: What is more important managing or leading?\n### Answer\nBoth,\
    \ managing and leading are two very different concepts that are easily confused\
    \ with each other. Leading falls under managing. When you manage you can plan,\
    \ organize and design a plan but to get employees to work on your plan you will\
    \ need to motivate them, and that is leading is – motivating your employees to\
    \ do the job.\nIn my previous company at `Rampsy`, our company was required to\
    \ do comparative dissolution which required `30` different profile dissolution\
    \ in two weeks; this is a lot of work in very short period of time. Usually it\
    \ takes one person a week to do just `5` profile dissolutions, but my manager\
    \ gave me the task to do the comparative dissolution in two weeks. This meant\
    \ that I had to do `30` different dissolutions in only two weeks. To do this I\
    \ came up with a solid plan that I will come to work early and leave late so that\
    \ I can manage to do at least `3` dissolutions per day. I made sure that I organize\
    \ everything nicely so that I will not make any mistakes. In `10` days, I was\
    \ done with all `30` dissolutions and on the `12th` day I was done with the report.\
    \ The report was `207` pages long and there were no mistakes on it.\n\n## Question:\
    \ Have you ever worked under a tight deadline?\n### Answer\nThis one is for you.\
    \ Give any tight deadline you have worked under using the `SARS` technique.\n\n\
    ## Question: Do you have any questions for us?\n### Notes\nNow this is interesting,\
    \ all of the sudden you are the interviewer. Yes, interviewers do ask this question\
    \ – true story. The interviewers are asking this question to evaluate if the company\
    \ is right for. Let me elaborate; say you had three interviews this week and they\
    \ all look promising because you prepared using this book. Now you will have to\
    \ decide which company you would really like to work for. That is where the questions\
    \ come in. You want to be informed before you make a decision.\nAsking questions\
    \ in an interview is really important, it show how interested you are in joining\
    \ the company so the more genuine your questions the more interest you show. Focus\
    \ your questions relevant to the interview especially questions that the company\
    \ put high value on. Remember to keep it short and ask professional questions;\
    \ this shows your genuine interest. This is not the time to ask about holidays,\
    \ off days, maternity leave, etc. Just stick to what this book is telling you\
    \ and time will come for you to ask such questions, believe me, time will come.\n\
    If you have no questions, then do not ask. Just tell them that you do not have\
    \ questions.\n### Alternate Answer\nI have done a lot of research on the company\
    \ and I know for a fact that it has all I need so I do not have any question.\
    \ What I usually ask in other interviews is whether or not the company supports\
    \ their employees to study forward but I already know that you do. Do not just\
    \ use this answer every time, do ask questions.\n### Alternate Answer\nNo, I do\
    \ not have any questions. They will probably ask if you are sure then you reply\
    \ `yes`, I am sure.\n### Ending an Interview\nI am very keen to continue working\
    \ for your company and I hope that I will become a long-term asset for you, or\
    \ you can say that you are excited about the possibility to work for the company.\n\
    ### Follow through email\nSend a thank you note/email to each interviewer afterwards,\
    \ on the same day of the interview. Use it to reiterate your interest and touch\
    \ on topics you discussed. If you don’t get the job, ask how you can improve in\
    \ the future. This applies most with small companies and it is not compulsory.\n\
    ## Research\nQuestions, Research, Data, Facts, Information, Growth, Success, Wealth...Knowledge\
    \ Is Power. Research is a systematic investigation and study of materials and\
    \ sources in order to establish facts and reach new conclusions to enhance society\
    \ by advancing knowledge through the development of scientific theories, concepts\
    \ and ideas. This is done in accordance with suitable methodologies set by specific\
    \ professional fields and academic disciplines.\n"
