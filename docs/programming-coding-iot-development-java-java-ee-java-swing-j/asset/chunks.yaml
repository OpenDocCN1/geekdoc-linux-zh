    # 营销计划


    ## 目标市场

    目标市场是指产品或服务所针对的消费者群体。识别目标市场是任何公司制定营销计划过程中至关重要的步骤。Racpro 的目标市场将包括拥有稳定收入、生活忙碌且需要便利、现代居住环境的中产阶级专业人士。这包括可以购买三居室公寓的小型家庭、可以购买并租赁公寓的投资者，以及只需要一个居住之地的单身专业人士或情侣。Racpro
    还将针对房地产投资者，即他们在开售前以折价购买房产，并在开发完成后以高价出售以获取利润。


    ## 产品

    产品是投放市场以供获取、关注或消费的实体物品。Racpro 的产品是新建的、高质量的、现代公寓，提供以下功能：

    * 电力和水费预付费表。

    * 24 小时安保，配备生物识别访问。

    * 预留光纤和 DStv 。

    * 现代生活方式中心。

    * 免费环保电器。

    * 1、2 和 3 居室公寓。

    * 靠近购物中心、学校、医疗……

    * 带有免费 wifi 的生活方式中心。

    * 礼宾服务。

    * 洗衣店。

    * 配有教练的科学健身房。

    * 户外健身区。

    * 华球场。

    * Littlehill 蒙特梭利学校。


    ## 价格

    价格定义为支付某物时预期、要求或给出的资金金额。可以通过市场研究确定产品的合适价格。


    ### Racpro 公寓价格

    * 1 卧室 1 卫从 R 939 900 起

    * 2 卧室 2 卫从 R 1 419 900 起

    * 3 卧室 2 卫从 R 1 838 155 起

    * 无贷款费用和转让费用


    ## 地点

    公寓将位于约翰内斯堡市中心，靠近以下地点：

    * 农夫市场 (Farmers’ Market)

    * 绿石购物中心 (Greenstone Mall)

    * Stoneridge 购物中心

    * Flamingo 购物中心（已开业）

    * 非购物场 (Mall of Africa)

    * Super seedlings 苗圃中心

    * Linbro 商务园区

    * Longmeadow 商务园园

    * 桑顿市 (Sandton city)

    * 梅洛拱廊 (Melrose Arch)


    ## 推广

    推广定义为宣传产品或服务以增加销售或公众意识。业务发展中的一个重要因素是有效且具有创意的产品营销和推广。为了有效执行，营销和推广需要一种协调且结构化的方法。Racpro
    将开展一场动态的营销活动，利用社交媒体作为有效的推广手段。互联网将作为广告和推广的主要来源。


    ## SWOT 分析

    SWOT 分析是组织进行的一种研究，旨在识别其内部优势和劣势，以及外部机会和威胁。


    ### 优势

    优势是指人或事良好或有利的性质或属性。

    * 城市化和不断增长的中产阶级。

    * 由于启动成本高，竞争者较少。

    * 带有生活方式中心的现代公寓。


    ### 机会

    机会指的是可以为组织带来竞争优势的有利外部因素。

    * 获取更多土地。

    * 巨大的市场潜力。

    * 扩张到另一个大都市。

    * 与其他房地产公司建立合作伙伴关系。

    * 政府土地的开发。

    * 提高黑人经济赋权水平，实现多元化并获益。


    ### 威胁

    威胁指的是可能损害组织的因素。

    * Covid19 导致的经济萧条。

    * 腐败的政府可能会吓跑投资者。

    * Covid19 影响导致关键员工流失。

    * 失业率增加导致需求下降。

    * 房税法规的变化。


    ### 劣势

    劣势定义为缺点或缺陷。

    * 巨大的启动成本。

    * 巨大的风险。

    * 区域性业务（仅涵盖豪登省）。


    ## 竞争分析

    竞争分析是对当前和潜在竞争对手优劣的评估。这种分析提供了进攻和防御策略背景，以识别机会和威胁 (Czinkota & Ronkainen, 2010)。Racpro
    现房模式的关键差异化在于通过规模效应提供卓越的产品，并在小区内创建生活方式中心。其他房地产开发商不提供像 Racpro 这样的大型生活方式中心，房主可以在小区内享受家庭时光，并有足够的活动可以进行。Racpro
    将小区内建立生活方式中心，那里将有免费 wifi、礼宾服务、恒温游泳池、游乐场、水疗中心、餐厅、健身房、华球场、竞技运动场和跑步径。这将确保孩子和父母在小区内度过愉快时光而无需出门，从而节省金钱、时间和精力和精力。Racpro
    还将与利益利益者建立合作伙伴关系，并使开发单元的价格与市场持平或低于市场水平。


    ## 营销与销售计划

    销售和营销在内部执行（不通过外部房地产中介）。销售和营销将包括以下任务：

    * 展示单元内部设计。

    * 创建手册、小册子和报纸广告。

    * Racpro 为其客户提供内部贷款起源服务。

    * 公司与南非所有主要银行均有协议，并在贷款起源过程中充当经纪人。

    * 公司通过这一过程赚取佣金。


    ## 企业社会责任

    Racpro 全力致力于良好的企业经营和社会责任实践原则。这些原则反映在 Racpro 的方法以及对供应商开发的关注中，特别是对其子分包商及其员工的开发。Racpro
    致力于通过公司培训计划以及在职培训开发其员工，并关注其雇佣中此前处于劣势个体的开发。Racpro 参与其运营社区内的各项活动，包括一项旨在造福各种基金会和非政府组织的年度慈善活动。


    ## 运营计划


    ## 长期目标

    长期目标是组织在追求其基本使命寻求实现的特定结果。长期目标代表了追求某些策略的预期结果。Racpro 旨在满足南非人对安全、高质量、新开发、高性价比、便利房屋的需求，而无需让房主参与到梦想家园的繁琐日常管理中。Racpro
    将服务于南非大部分负担不起高收入生活庄园居住但渴望获得同等便利、安全和设施的人群，通过创建分权物业（sectional title properties），让他们在
    R599,999 – R1,699,999 的价格范围内实现这些愿目标。


    ### 未来五年的战略目标

    * 提供折价预售销售。

    * 启动开发项目。

    * 获取土地并建造展厅。

    * 开始建筑、销售并进行房产看房。

    * 保留部分开发库存作为租赁组合。

    * 与其他房地产公司建立合作伙伴关系。

    * 支持并发展黑人经济赋权。


    ## 行业描述

    行业描述有助于公司了解其与其他生产相似产品或服务的公司之间的地位，这有助于识别它们面临的威胁和机会。南非住宅房地产行业由于城市化和不断增长的中收入人口对优质住房的强烈需求正在增长。金融机构愿意向房主提供抵押贷款以获取房产。位于南非安全生活庄园内的房产估计总值为
    6430 亿兰特。南非注册房产中约 12% 是分权单元，另 5.3% 代表庄园开发。在过去的 20 年里，公寓和联排别墅占了 26%。


