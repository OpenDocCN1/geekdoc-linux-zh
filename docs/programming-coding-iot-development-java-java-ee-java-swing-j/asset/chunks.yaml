    # How to influence people

    - Turn on your charm (emphathize).

    - Listen to people.

    - Take note of what people want.

    - Add value to people’s lives.

    - Be very good at conflict resolution.


    ## Rules of Negotiation

    - Listen more than you talk.

    - Use the power of silence.

    - Ask questions.

    - Be fair.

    - Know what you want before negotiating.

    - Aim for a Win/Win negotiation.

    - Learn conflict resolution strategies.

    - Be prepared.

    - Have a strategy.

    - Keep it simple.


    ## Critical Thinking

    Think, Plan, Prioritize...

    If you fail to plan, you are planning to fail - `Benjamin Franklin`.


    Thinking is a mental activity to process information, make connections, decisions,
    and create new ideas. Thinking can also be thought of as a process of making a
    to-do list in your mind. Thinking is the first step towards success. There are
    too many things to do in life but only 20 percent of those things will bring success
    and because of this everyone has to think and prioritize accordingly before acting.
    When taking action, start with those activities that bring success. Every thought
    has to be written down. This helps with manifestation, thought analysis and planning.


    ### Critical Thinking

    Critical thinking is the ability to follow logic clearly and rationally about
    what to do or what to believe. It is the ability to engage in reflective thinking,
    understand the logical connections between ideas, and understand the where, how,
    when, what, and why things are the way they are. It is about asking as many questions
    as possible until you get all the information you need. Information leads to growth,
    growth leads to success and success leads to wealth.


    Critical thinking helps with good decision-making. You must be able to weigh up
    the pros and cons of solutions to problems. You must look at all the data available
    and make an informed decision by weighing the pros and cons based on the data
    given. Big data is popular because of this reason. Managers can make good decisions
    by using big data.


    ### Make a to-do list

    You should be able to determine the what, when, why, where and how things will
    happen. This is called scheduling. Failure to do so can lead to disaster, plain
    and simple. Write every single detail down. Have a to-do list, a task calendar
    and a checklist for every milestone. This will help with task manifestation, visualization
    of the implementation process and analysing problems.


    ### Risk Management

    You must be able to plan for and manage things going wrong. Things usually go
    wrong in life, it is a given. This is because unlike plans, life is time-sensitive
    and a simple thing as late delivery can cause a huge disaster. You must anticipate
    what can go wrong and plan for what to do in that case. That’s what risk management
    involves.


    ### How to think critically

    - Restructure information.

    - Evaluate consequences.

    - Ask questions.

    - Be observant.

    - Read every day.

    - Look at historical data.

    - Research.

    - Look for facts, numbers or science.

    - Be analytical, break down information.


    ### Critical Thinking Process

    - Observe

    - Investigate

    - Analyze

    - Interpret

    - Evaluate

    - Reflect


    ## Decision Making & Problem Solving

    Problem, Information, Decision, Growth, Success and Wealth...

    Failure is an opportunity to learn. Problem-solving is the act of defining a problem,
    determining the root cause of the problem and finding a solution. The more problems
    you solve, the richer and more successful you become.


    ### Problem-solving process

    - Describe the problem.

    - Break down the problem.

    - Find the root cause.

    - Research and read until you find a solution.

    - Implement the solution.

    - Measure the results.


    ### Problem-solving skills

    - Active listening.

    - Critical and creative thinking.

    - Research and reading.

    - Communication.

    - Decision-making.

    - Team-work.


    ### Decision-making

    Decision-making is the process of gathering information, assessing the consequences
    and choosing an option with fewer negative consequences. A good decision-maker
    chooses actions that give the best outcome for everyone. They research, weigh
    consequences and make rational decisions while keeping an open mind.


    ### Decision making process

    - Identify alternatives.

    - Gather relevant information.

    - Weigh the consequences.

    - Choose.

    - Take action.

    - Review your decision.


    ### Creative thinking

    Creative thinking is the ability to consider something in a new way such as having
    a new approach to a problem or a new result from a data set. It is a process in
    which your mind generates a new, unusual and productive solution to a problem.


    ### How to develop creative thinking

    - Brainstorm ideas.

    - Reframe the problem.

    - Be open-minded and flexible.

    - Use your imagination.


    ## Ways to improve your memory

    - Read books.

    - Try Fish Oil Supplements (`Omega 3`).

    - Maintain a Healthy Weight.

    - Drink Less Alcohol.

    - Exercise.

    - Give meditation a try.

    - Drink coffee.

    - Sleep enough.

    - Eat Less Added Sugar.


    ## Technical Skills

    - Programming/Coding.

    - Software proficiency.

    - Project management.

    - Data analysis.

    - Technology.

    - Writing.

    - Accounting.

    - Engineering.

    - Medicine.

    - Problem-Solving.


    ## Interpersonal Skills

    - Teamwork.

    - Communication.

    - Work Ethic.

    - Flexibility and Adaptability.

    - Decision-making.

    - Time Management.

    - Conflict resolution.

    - Listening.

    - Negotiation.

    - Empathy.

    - Assertiveness.

    - Coaching, teaching, and mentoring.


    ## Public Speaking

    Information, Confidence, Public Speaking, Money, Growth, Success, Wealth...

    Practice, Practice, Practice.


    ### Rules of public speaking

    - Research and know everything about your topic.

    - Plan and prepare your presentation.

    - Practice until you feel confident.

    - Read about your specific worries.

    - Visualize your success.

    - Do some deep breathing.

    - Focus on your presentation, not on your audience.

    - Don''t fear a moment of silence.

    - Pay attention to your body language.

    - Drink a glass on alcohol before the speech.

    - Don''t drink caffeine on the day of the speech.

    - Think positively.

    - Watch recordings of your speeches.

    - Keep it simple.

    - Don’t worry about eye contact with your audience.

    - Don’t worry about your weaknesses.

    - You don’t have to tell stories.

    - Organize ideas logically.

    - Practice brings confidence.

    - Research the topic until you are passionate.

    - Be yourself.

    - Slow down.

    - Always tell the truth.

    - Forgive yourself for your mistakes.

    - Study your audience.

    - Define the objective of the presentation.

    - Prepare the objectives, introduction & conclusion.

    - Keep a conversational tone.


    ### Time your speech

    - Practice and research your topic like crazy.

    - Ask people for feedback.

    - Move around the stage.

    - Breathe slowly.

    - Use your voice aptly.

    - Rehearse, rehearse.

    - Avoid overuse of animations.

    - PowerPoint presentation should have `10` slides.

    - Presentation should be `30` points.

    - Arrive early.

    - Stretch your body before the presentation.

    - Finish on time.

    - Use as few words as possible on each slide.

    - Pay attention to your body language.

    - If you forget something just skip it.

    - Learn how to use the technology you will using.

    - Don’t focus on the audiences.

    - Take an online speaking course.

    - Use a mantra to boost your confidence.


    ### Types of speeches

    - Informative speech.

    - Entertaining speech.

    - Demonstrative speech.

    - Persuasive speech.

    - Special occasion speech.

    - Pitch speech.


    ### The four speaking skills

    - Fluency.

    - Vocabulary.

    - Grammar.

    - Pronunciation.


    ## Negotiation

    Challenges, Negotiation, Solution, Growth, Wealth...

    - Everything is negotiable.

    - Know what you want before negotiating.

    - Aim for a win/win outcome.

    - Use the power of silence.

    - Ask for advice or a second opinion.

    - Put a fair offer on the table.

    - Walk away if the offer is not fair.

    - Don''t make assumptions, ask questions.

    - Don''t rush, be patient.

    - Don''t accept a bad deal.

    - Build a relationship.

    - Choose honey over vinegar.

    - Don''t act childish.

    - Focus on collaborating.

    - Don''t let your emotions get the best of you.

    - Don''t take shortcuts.

    - Research before negotiating.

    - Do your homework.

    - Entrain emotions, focus on what is right.

    - Negotiate each part separately.

    - Be polite.

    - Be aware of your body language.

    - Think from different perspectives.

    - Draw attention to unique features.


    ### Stages Of The Negotiation Process

    - Identifying the purpose.

    - Preparation.

    - Information exchange.

    - Bargaining.

    - Conclusion.


    ### Benefits Of Negotiation Skills

    - Professional development and career growth.

    - Conflict resolution.

    - Problem solving.

    - Communication.

    - Persuasion.

    - Teamwork.


    ## Communication

    Information, Communication, Growth, Success, Wealth...

    Listen... Listen...

    Being able to communicate effectively and efficiently is one of the most important
    skills for success. When you are communicating make sure your message is clear,
    concise, correct, coherent, complete, and courteous. These are called the seven
    Cs of communication. Effective communication is less about talking and more about
    listening. Listening means understanding the words or the information being communicated,
    and also understanding the emotions the speaker is trying to convey. Being able
    to communicate effectively is perhaps the most important of life skills because
    it enables us to pass information to other people and understand what is said.
    Information is the center of success because information leads to growth and continuous
    growth leads to success, therefore, being able to receive and communicate is one
    of the keys to success.


    ### Communication Failure

    Communication failure is a message that is misleading, ineffective, or offensive.
    Never communicate to cause harm, to gain knowledge for growth. If you are angry
    and feel like saying hurtful things to someone, just walk away and remember the
    emotional intelligence skills you will learn in this book. Remember, to be successful,
    you need all the information you can get and communication is one of the key strategies
    to get information. The dangerous thing about information is that information
    causes emotions and if you are not good at controlling emotions then you will
    be in trouble. The trick is, for you to control your emotions you need more information.


    ### Skills for being a good communicator

    - Listening.

    - Body-language.

    - Stress management.

    - Emotion control.

    - Clarity and concision.

    - Confidence.

    - Empathy.

    - Open-mindedness.

    - Respect.


    ### How To Deliver Bad News

    - Make eye contact.

    - Try to be neutral.

    - Be prepared.

    - Use facts.

    - Don''t negotiate.


    ### Elements of a Report Writing

    - Title page.

    - Table of contents.

    - Executive summary.

    - Introduction.

    - Discussion.

    - Conclusion.

    - Recommendations.

    - References.


    ### Characteristics of a Good Report

    - Simplicity.

    - Clarity.

    - Concise.

    - Positive.

    - Punctuation.

    - Approach.

    - Readability.

    - Accuracy.


    ## Listening

    Communication, Listening, Information, Growth, Success and Wealth...

    Do not interrupt. Listening is the ability to accurately receive and interpret
    the message being communicated to you. Listening is key to all effective and efficient
    communication. Without the ability to listen effectively, messages are easily
    misunderstood and information is lost. Without information, success is not easy
    to achieve. Listening is one communication skill you should master if you want
    to be successful. Effective listening helps to resolve conflicts, build trust,
    inspire people, increases productivity, and increases growth. Spend most of your
    conversations listening and you''ll absorb information, become a good communicator
    and make good decisions.


    ### How to listen

    Pay attention to the speaker''s verbal and non-verbal language to fully understand
    what they''re expressing to you. Paying attention means listening and observing
    the speaker without interrupting. Do not interrupt the speaker for any reason.
    If you want to say something, wait until the speaker is done talking then you
    can talk. Listening effectively means listening to key points of the speaker''s
    message and taking notes mentally or otherwise.


    ### Listening and problem solving

    If someone is asking you a serious question or they want your advice, listen attentively,
    do not rush to respond, try not to respond immediately and think for a day or
    two about what the speaker was saying then respond. Thinking takes time, energy,
    and effort. Don''t be quick to respond. Just tell the speaker that you want time
    to process what they said and you will get back to them. This strategy works in
    every situation even if you don''t need to think just take time to think. You
    will make wise decisions if you take your time to think.


    ### Active listening

    Active listening is a technique that requires the listener to fully concentrate,
    understand, and remember what is being said. You have to empathize, reflect and
    take key points of what is being communicated to you. Active listening is used
    in counseling, training, and solving disputes or conflicts. You can solve many
    problems by just listening attentively without even responding. This is called
    the `rubber duck` effect.


    ### Barriers to Listening

    Listening is very challenging skill because there are always distractions that
    interfere with the message being communicated. Distractions to speaker''s message
    can be body movements, internal thoughts, lack of focus, sounds in the surrounding
    environment, or biased listening. Biased or selective listening is one of the
    biggest problems in communication. Biased listening when someone is just listening
    for information they want to hear is dangerous because you are not listening.


    ### Key listening techniques

    - Pay attention.

    - Paraphrase and summarize.

    - Don''t judge or jump to conclusions.

    - Show that you''re listening by nodding.

    - Don''t interrupt.

    - Face the speaker and make eye contact.

    - Ask questions.

    - Focus.


    ## Coaching

    Goals, Milestones, Coaching, Teaching, Growth, Success...

    Give the right information at the right time.

    Coaching is a process that aims to improve performance and focuses on the current
    challenges rather than the distant past or future.


    ### Key Coaching Skills

    - Goal-setting.

    - Listening.

    - Empathizing.

    - Critical thinking.

    - Giving feedback.

    - Subject knowledge and experience.

    - Vision.

    - Self-awareness.

    - Open-mindedness & creativity.

    - Responsibility & dependability.


    ## Leadership Styles

    - Transactional leadership.

    - Transformational leadership.

    - Servant leadership.

    - Democratic leadership.

    - Bureaucratic leadership.

    - Laissez-faire leadership.

    - Charismatic leadership.

    - Visionary leadership.

    - Affiliative leadership.

    - Pacesetting leadership.


    ## Teaching

    Teaching is the process of helping people understand and apply knowledge, concepts,
    and processes. Leaders have to teach people how to reach their goals.


    ### Qualities Of A Good Teacher

    - Communication skills.

    - Listening skills.

    - Friendly attitude.

    - Strong work ethic.

    - Preparation.

    - Patience.

    - Creativity.

    - Enthusiasm.

    - Dedication.

    - Empathy.

    - Leadership skills.

    - Knowledge of subject matter.


    ### Principles Of Teaching

    - Encourage both teamwork and individual work.

    - Encourage active learning.

    - Give feedback.

    - Communicate expectations.

    - Respect diverse talents.


    ### How To Teach

    - Show people exactly what to do.

    - Help fix mistakes.

    - Provide feedback.

    - Use experiential learning.

    - Encourage discussions.

    - Recommend books.


    ### Types Of Learning

    - Learn by listening and speaking.

    - Learn by watching.

    - Learn by touching or feeling.

    - Learn by reading.


    ### How To Memorize Information

    - Memorize keywords.

    - Memorize rhythm or rhyme.

    - Use acronyms.

    - Look at pictures or patterns.

    - Categorize information.

    - Use numbers.


    ### The Reading Process

    - Finding information.

    - Identifying the main idea.

    - Understanding words.

    - Categorizing information.

    - Finding similarities and differences.


    ## Mentoring

    Mentoring is the sharing of information between people with the goal of professional
    and personal development. The mentor usually shares information, experience, and
    advice with a less experienced person (`mentee`).


    ### Types Of Mentoring

    - One-on-one mentoring.

    - Distance mentoring.

    - Group mentoring.

    - Situational mentoring.

    - Developmental and career mentoring.

    - Peer-based mentoring.


    ### Qualities Of A Good Mentor

    - Good listener.

    - Flexible.

    - Values different perspectives.

    - Knowledgeable.

    - Non-judgmental.

    - Able to give feedback.

    - Honest.

    - Resourceful.

    - Good leadership and management skills.


    ### Benefits Of Being A Mentor

    - Increased self-confidence.

    - Increased self-awareness.

    - Leadership skill development.

    - Strong communication skills.

    - Increased listening skills.

    - Increased patience.

    - Increased people skills.

