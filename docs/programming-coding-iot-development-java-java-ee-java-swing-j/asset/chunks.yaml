  trans: '


    # 职责


    1. 操作实验室设备，如 `HPLC`、`GC`、`UV`、`AA`、`Karl Fischer`、溶出度槽、`IR` 等。

    2. 管理实验室设备。

    3. 承担实验室设备和仪器的日常维护与清洁工作。

    4. 遵守所有健康和安全协议。

    5. 精通使用现代实验室设备。

    6. 指导并教授新员工工作。

    7. 具备计算机基础（电子表格、图形处理和文字处理）。

    8. 具有建立和运行分析实验室的经验。

    9. 人员管理。

    10. 编写标准操作程序（SOP）。


    # 备选答案


    我没有这个领域的经验，但多年来我积累了许多与此工作相关的技能，例如：


    1. **计算机技能** - 我是一名精通计算机的用户，具备高级 MS Office 技能，包括 `Word`、`Excel`、`PowerPoint`、`Access`、`Publisher`，以及
    `webmail` 和 `Outlook` 等常用电子邮件程序；我在开普敦大学（`UCT`）完成过一个短期计算机技能课程。


    2. **多任务管理能力** - 2012 年暑假期间，我同时在开普敦大学（`UCT`）参加了词汇力量课程，并在斯特兰堡大学参加了聚合物科学课程，并以优异的成绩完成了课程。此外，在
    `UCT` 修读 `BSc` 学位期间，我同时选择了三个不同的专业。


    3. **团队协作技能** - 我曾在马里昂岛工作，那里团队合作是必须的，在那里学到了广泛的团队协作技能。我们是由三个气象学家组成的团队，在一个孤立的岛上，直接负责所有的气象数据和气象仪器的维护工作，这需要有效的团队合作。


    '
- fmt: '

    # Question: Describe a major goal that you that have set for yourself.


    **Notes**: Make sure that you answer with a goal related to the job the you are
    applying for. Clearly state your goal and why you consider it a major goal. Show
    how you achieved this goal.


    **Answer**: One of the biggest goals I had set for myself this year was to write
    a blog about the skills and equipment that analytical chemists use. The action
    that I took was that I spent a month researching and studying how to write and
    publish a blog then I spent three more months collecting and studying articles
    about analytical chemist and the equipment they use. Then after four long months
    of research and studying I designed, wrote and published my blog. Now my blog
    is active and helping people around the world. Who wouldn’t want to hire this
    person?


    ---


    ## Question: What motivates you at the workplace?


    **Notes**: Everyone has their own source of motivation, either from friends, family,
    books, etc. Motivation is one of the keys to success. The work environment can
    build or destroy your motivation. The interviewers ask this question because the
    want to know if you will be motivated in their environment or not. Answer appropriately,
    do not say that you get motivated by being outdoors while the position that you
    are applying for is for a bank teller. The best way to answer this question is
    to look at what qualities company has and state this as your motivators or look
    at the positive things that the position has to offer and state this as motivators.


    **Answer**: Getting the job done is what motivates me. I am a kind of person who
    always keeps a list of what to do and every time I complete a task, I scratch
    it off. These makes me feel good and motivated and feel like working more. The
    more tasks I complete, the more I get motivated.


    ---


    ## Question: What did you dislike about your previous colleagues?


    **Answer**: Nothing, I consider myself lucky to have worked with a team of nice
    people. Everyone tried to be considerate, which is what I appreciated the most
    about them and which is why I am thankful.


    ---


    ## Question: What issues did you have with your previous boss?


    **Notes**: Hopefully you did not have issues with your previous boss so that you
    do not have to lie. If you did then you have to say it in such a positive way
    that it does not look like an issue. The way I see it, you do not have any issues
    with your previous boss.


    **Answer**: I never had problems with my previous boss at all; actually, we were
    in good terms with each other. I am extremely good at building rapport with management.
    To be in good terms with your boss you have to do exactly what they tell you,
    work extra hard and communicate well.


    When I was still a new employee at `Rampsy Consulting Company` my manager asked
    me to do dissolutions and read them on the `UV machine`. I did exactly that and
    I reported the results exactly the way they were. The problem was that the results
    for that product were too low and they were failing but I was still new, and I
    did not know what to do so I just reported the results anyways. My boss was angry
    at me and said I should have done the analysis again and if the product still
    failed, I should have written an `out of specification report`.


    To solve this problem, I let my boss cool off, and then I stayed at work after
    everybody had left and did the product again exactly as asked. The following day
    I apologized for my mistake and I told him that next time I will make sure that
    I communicate with him effectively and confirm everything with him. After about
    three months there was no need for me to confirm anything with him anymore, I
    knew everything there is to know, and he trusted me.


    ---


    ## Question: Why should we hire you?


    **Yes**: Yes, this is not an easy question to answer.


    **Answer**: Because my personal skills fit the job perfectly. I have been told
    by my former supervisor from `Rampsy Consulting Company` that I am a good communicator
    and I always achieve good results as you can see on my reference letter (provide
    the reference letter). Also, my current supervisor at the `South African weather
    Service` has scored me 100% on communication, teamwork and problem-solving skills
    as you see on my biannual assessment (provide hard prove). I can use these skills
    to build rapport with students, staff and management. Do not answer this question
    like this if you cannot provide evidence because you will sound generic. If you
    do not have written evidence the you need to give your evidence in a form of success
    story like the in the alternate example below.


    **Alternate answer**: Because I do whatever it takes to finish the job and get
    good results. I used to work even when I was off at the `South African Weather
    Service`. I remember in December 2015 the rain gauge broke and it was my day off.
    The person who was on day shift was supposed to fix the rain gauge but because
    I knew that it is almost impossible to fix the gauge alone, I went to the office
    and we spent the whole day fixing the rain gauge together. After we were done,
    the rain gauge was working perfectly. When compared to the automatic rain gauge
    the difference was only 0.003 mm, which is close to zero.


    **Alternate answer**: Because I do whatever it takes to finish the job and get
    good results. In 2012 I set myself a goal to publish a blog. Before the end of
    2012, my blog was up and running. In 2013, my goal was to just create something
    new, so I designed a new brand of shampoo and manufactured it. In 2014, I wrote
    and published a book and in 2015 I registered a business.


    **Notes**: To answer this question right you have to be very specific and support
    your claims with examples or hard evidence. Show the interviewers that you can
    do the job and that you can deliver amazing results. Try to talk about skills
    that you haven’t told them about yet. Remember to keep your answer short, it is
    very easy to forget and start rambling when you are answering this kind question.
    Research the company and position to make sure you get a feel of what kind candidate
    they are looking for. Highlight your strength that is in line with what the company
    is looking for to show that you would fit perfectly to the job. Sometimes researching
    the company can be tiring and boring because this companies they never give you
    the job. Do not talk bad about other candidates and say that you are better than
    them.


    ---


    ## Question: Why did you apply for this post?


    **Answer**: I applied for this post because I love working as a meteorological
    technician because it is practical application of the knowledge I gained from
    my degree so this job is actually growing my skills which is what I need. also
    because I admire my previous company mostly of its values and because I believe
    I share the same values which are: professionalism, honesty, excellence, teamwork,
    and integrity. Also, the company’s vision is to become a world-class organization.
    I believe that with my education and skills I am the best candidate to be part
    of the team that will make your company achieve this vision.


    ---


    ## Question: Are you a team player?


    **Notes**: As you already know teamwork is very important in a workplace. If you
    don’t know I am not sure where you work but look at it this way; can you win?


    **Yes**: Yes, he can.

    **No**: He needs his team member to work as team in order for the company to succeed.
    Believe it or not companies want to succeed. This is one of the most important
    questions that can be asked in an interview and you should answer it thoroughly.
    Remember to give a success story that shows you are a team player and remember
    to structure your story in a SARS format. If you say you are not a good team player
    you can take the easy way out. Being a team player is a skill that means you can
    learn, practice and master it; it is as easy. All you have to do is read articles
    on teamwork (not less than seven), then read books or listen to audio books (the
    more the better) and then practice what you have learnt. You will have a whole
    new perspective on teamwork skills. Being a good team player simply means that
    you can communicate effectively with other people and have the ability to empathize
    with other people and see things the way they see it so you can understand why
    they behave the way they do. This will help you develop rapport with people and
    making you an outstanding team player.


    **Answer**: I have worked in a team in past two companies that I have been working
    at and also in varsity, although in varsity sometimes you have to work alone I
    personally prefer working in a team simply because you achieve more and I am a
    very team player. An example of when I have worked in a team is when I was working
    on Marion Island. Working on Marion Island was all about teamwork and communication.
    We were a team of three meteorologists on an isolated island without a supervisor
    or any management and we were directly responsible for all meteorological data
    and maintenance of instrumentation which requires effective teamwork.


    ---


    ## Question: Why did you choose this career?


    **Answer**: Because I would like to be part of product development. I am fascinated
    by how the whole thing starts from an idea, followed by extensive research, then
    through planning and proper execution the ingredients combine to form a finished
    product and just when you think the magic is done the guys apply the same concept
    and produce packaging that raises emotions.


    ---


    ## Question: Tell me a suggestion you have made that was implemented?


    **Notes**: The interviewers just want to see if you are a creative person. Sometimes
    they just want to see if you are an active person and if you contribute to the
    team. This shows commitment. Your answer must show that you do part in making
    suggestions and recommendations when necessary. Give an example of when you came
    up with a unique approach to an issue at work. If you did not have any contributions
    at your workplace then mention the one you made in your personal life. This is
    a good chance to show the interviewers that the company will benefit if they hire
    you.


    **Answer**: I worked at my previous company for only two years and the company
    was well established so coming up with new ideas was a challenge because during
    my two years we did not face any major issues. However I did come up with an idea
    that was implemented in varsity. In my last year at varsity, the course coordinator
    for chemistry told us to buy molecular kits because we were going to need them
    for the exam. The kit was very cheap, only `R200`. The problem is `R200` is a
    lot of money to a student besides you can get a nice bottle of Jack Daniels with
    change, now that is a good deal. Anyways most students did not buy the kit and
    it affected them very badly and what is surprising is that this have been happening
    every year. So, I went to the course coordinator and suggested that the university
    should increase the course fee by `R200` and then they give us the kit for free.
    My coordinator laughed and said that is the best idea ever and so he implemented
    it the following year.


    **Alternate answer**: I introduced electronic logging. The company that I used
    to work for used hard copy booklets to do the analysis. We had a lot of booklets
    so there were files for every client which filled the bookshelf in no particular
    order. The problem was that we were always flooded with a lot of work and sometimes
    we forget to return the booklets where they belong and as a result the next person
    will not know where to look for the booklet when they want to carry out the analysis.
    So the person has to run around the whole day wasting time looking for the booklet.
    Sometimes the situation gets worse you spend the whole day looking for a booklet
    thinking that somebody misplaced it only to find that the company never had that
    booklet in the first place. To fix this problem I came up with a system I would
    like to call electronic logging. My system is very simple, I create an `excel`
    logging template so that every time you use a booklet you write your name, date
    and booklet title. The next person to use the booklet will go to the log and see
    who the last person was to use the booklet. The results were amazing; this method
    saved everybody a lot of time so everyone can focus on more pressing matters.

