    奢侈品（Luxury）可以被定义为我们购买但对人类生存并非必需的昂贵物品。这包括昂贵的汽车、豪宅、小摆件等。奢华的生活方式是人们追求成功并努力赚钱的动力之一。如果使用得当，对奢华生活的追求可以成为一种很好的动力。如果你想过奢华的生活，你就必须努力且聪明地工作，这样才能赚钱并实现目标。


    人们想过奢华的生活，是因为人们通常认为只要你有足够的钱，所有的问题都会消失。钱，加上其他资源和良好的性格特质可以解决你的所有问题，然而单靠钱无法解决所有问题。因此，必须记住，无论你有多少钱，无论你的生活方式多么奢侈，你仍然需要强大的核心价值观和领导力，这样你才能将它们与钱结合，高效地解决所有问题，从而带来健康、财富和成功。


    ## 如何保持动力

    - 制定 SMART 目标。

    - 从失败中学习。

    - 从弱点中获更多。

    - 记录你的成就。

    - 每日回顾目标和进度。

    - 设定新目标。

    - 喝咖啡。

    - 寻找导师。

    - 每日锻炼。

    - 不要要求自己完美。

    - 使用积极的自我暗示。

    - 创建待办清单。

    - 发挥你的优势并改进你的弱点。

    - 认可你的成就。

    - 不要放弃，休息并寻求帮助。

    - 避免分心。

    - 开始开始——无论大小，，并不重要。

    - 将任务拆解为小的步骤。

    - 建立积极心态。

    - 在每个里程碑后奖励自己。

    - 缩短你的待办清单。

    - 设定让你兴奋的里程碑。

    - 消除压力。

    - 减轻负担。

    - 过健康的生活方式。

    - 保证睡眠。

    - 保持良好的体重。

    - 限制酒精摄入。

    - 休息片刻。

    - 征求反馈。

    - 简化你的生活。

    - 迈小步。

    - 学习新知识。

    - 规划你整的一天。

    - 不要等正确了才。

    - 盯紧目标。

    - 散散步。

    - 保持专注并记住你的“为什么”。

    - 在目标中找到你感兴趣的事。

    - 告诉别人你的目标。

    - 跟踪你的进度。

    - 设定小的、易于处理且可衡量的目标。

    - 关注大局。

    - 开发口诀。

    - 创建常规。

    - 思考通过小增量完成。

    - 不要把任何事情看作苦差。

    - 每天阅读。

    - 创建时间表。

    - 建立专门的工作区。

    - 分小块时间工作。

    - 挑战自己。

    - 练习良好的自我照顾。

    - 关注不一致性。


    ## 什么在激励人们？

    - 钱。

    - 学习的欲望。

    - 帮助别人的欲望。

    - 对美好事物的渴望。

    - 控制欲。


    ## 动力的类型

    - 外在动力（为了实现或避免某种结果）。

    - 内在动力（成功的内在驱动）。

    - 家庭（为爱的人提供的欲望）。


    ## 如何提升心情

    - 微笑。

    - 保持忙碌（看喜剧电视节目）。

    - 与人聊天。

    - 帮助他人。

    - 活在当下。


    ## 如何过奢华的生活

    - 精通技术。

    - 购买奢侈品牌。

    - 保持健康生活。

    - 持续学习新技能。

    - 建立良好的人关系。

    - 少工作并定期休息。


    ## 比特币、加密货币与交易

    钱、交易、损失、信息、增长、成功、财富……每个人都认为自己可以战胜市场。


    加密货币（`crypto`）是一种数字货币，可以使用在线账本来记录和保护在线交易以购买商品和服务，而不是通过银行。加密货币正受到许多关注，因为它有潜力改变目前世界的交易进行方式，然而，大多数人将这种关注误认为是交易的机会。


    交易非常有风险，无论你交易的是什么。如果你想从加密货币中赚钱，你所需要做的只是注册一个区块链课程，获得证书，在加密货币领域找份工作，可能他们会付你很多钱，因为这是一个新领域。区块链是交易的数字记录，交易使用稳定的加密签名进行记录，并且记录为了安全目的在整个计算机系统网络中复制和分布。这意味着当你用加密货币（如
    `Bitcoin`）买房子时，你不再需要去银行进行交易了，你只需要在手机上买房子，你的交易将被记录并存储在区块链上，它是一个数字账本/记录。这就是加密货币的好处。加密货币的坏处是每个人都想开始交易加密货币，因为他们感受到了热度，但他们没有意识到加密货币的热不是为了交易，而是为了改变全球经济。这种误解导致许多人亏钱。


    ### 比特币

    `Bitcoin` 是一个计算机文件（电子币），存储在你智能手机或电脑的数字钱包应用中，你可以通过数字钱包分享比特币，每一笔交易都记录在名为区块链的公共列表中。你可以轻松地以极低的手费立即将比特币卖成现金或黄金等资产。你可以像交易股票或外汇一样交易
    `Bitcoin`，而且像任何其他交易工具一样，大多数人在交易 `Bitcoin` 时都会亏钱，我会建议你不要交易 `Bitcoin`，直接远离交易即可。


    ### 交易

    交易通常涉及频繁地买卖股票或货币，试图把握市场时机并获取快速利润。目标是低买高卖。有些交易者是日内交易者，这意味着他们整天买卖。大多数交易者在交易 `Bitcoin`
    时都会亏钱，我鼓励你停止交易或永远不要开始。这本书会解释如何不通过交易变得富有。如果你还想尝试交易，在丢钱后从错误中学习并永远不要再做。


    ## 如何交易股票、外汇或加密货币

    - 开一个账户。

    - 设定预算。

    - 学习使用市价单和限价单。

    - 研究市场。

    - 虚拟交易。

    - 衡量你的盈亏。


    ## 交易平台

    - `Ameritrade`

    - `Fidelity`

    - `Robinhood`

    - `Merrill Edge`


    ## 购买比特币

    - 创建账户。

    - 验证你的手机。

    - 添加支付方式。

    - 购买 `Bitcoin`。

    - 检查数字钱包。


    ## 加密货币

    - `Bitcoin` (`BTC`)

    - `Cosmos` (`ATOM`)

    - `Dogecoin` (`DOGE`)

    - `Ethereum` (`ETH`)

    - `Compound` (`COMP`)

    - `Polkadot` (`DOT`)


    人们认为可以在交易中获胜，因为他们投入了大量时间阅读技术分析，但他们没有意识到技术分析无法考虑到经济变化。这意味着技术分析是无用的且危险的。这解释了为什么你认识的所有技术分析大师总是亏钱。所以如果你不进行交易，你有更大的机会获胜。


    ## 成为百万富翁的最佳方法

    - 发展你的职业和专业知识。

    - 为机会留出钱。

    - 投资房地产或基金。

    - 创建一个财务计划。

    - 永远不要交易（股票、外汇、加密货币……）。


    ## 百万

    职业、增长、资金管理、策略……学习得越多，赚得越多。成为百万富翁从设定目标开始。将你的目标分为更小的时间范围。将你的目标分为每月、每周和每年。每天改变并改进你的目标。这被称为计划，这也是大多数人失败的地方。你可以在任何地方、任何方式成为百万富翁，你只需要保持增长。增长意味着尽可能获取信息。你拥的信息越多，赚的钱越多。成为百万富翁简单的方法是持续思考如何让钱翻倍，记录下来，执行并重复。当你这样做时，在大脑中分析信息，批判性地思考，成为百万富翁不再是幻想，最重要的是看到机会。成功是机会遇到准备。这包括资金管理、信息和动力。这本书涵盖了这一切。这本书将为你准备。当机会来上门时，你知道该做什么。


    ### 如何成为百万富翁

    - 发展你的职业和专业知识。

    - 投资指数基金和房地产。

    - 专利化一个想法。

    - 建立业务。

    - 跟踪你的支出并减少它们。

    - 为项目和机会存钱。

    - 创建一个让钱增长的计划。

    - 学习新技能。

    - 寻找机会。

    - 低于收入生活。


    ### 高需求业务

    - 税务准备和记账。

    - 餐饮服务。

    - 网站设计。

    - 商业咨询。

    - 洁洁服务。

    - 在线辅。

    - 咨询服务。


    ### 易启动的业务

    - 销售顾问。

    - 草坪维护。

    - 育儿。

    - 洁洁服务。

    - 工人。

    - 写作和翻译。


    ## 财富

    钱、投资、财务规划、现金……努力且聪明。财富由于金和其他物质物品的大量积累而带来的安全感和安心心的状态。这种舒适状态给了你的大脑足够的自由去练习其他技能，从而提高你的性格，结果是你天生成为领导者。要获得成功，你需要持续增长。每个人在生活中都需要成功。成功是在你所做的大多数事情中获得积极结果的能力。这意味着你能够在财务、社交和个人方面实现目标。在生活的所有领域持续增长的能力将带来巨款。这是因为钱是所有资源的代表，随着你变得成功，你将不断积累比你使用的更多的资源。这些资源将以钱本身或物理物质的形式存在。如此大量的钱和物质导致了财富。


    ### 财富规则

    - 财富取决于你投入了多少。

    - 购买别人的时间。

    - 寻找创业公司并扩大其规模。

    - 为了钱解决问题。

    - 少花多赚并升级。

    - 解决扩展性问题。

    - 阅读财务规划、投资、资产。

    - 停止在无用的爱好上浪费时间。

    - 采取一种适合你的方法。

    - 根据你的计划或待办清单工作。

    - 自动化并委托一切。

    - 衡量并增加你的投入。

    - 将你的技能卖给世界。

    - 延迟满足并在 90% 的时间里工作。

    - 为失业人员创造工作。

    - 90% 的时间待在室内，阅读并创造工作。

    - 雇佣优秀的人。

    - 按小时给人们付。


    ## 投资

    职业、钱、投资、增长、成功……投资房产。投资... ..................................................................
    永远不要交易... 成为百万富翁。

    '
