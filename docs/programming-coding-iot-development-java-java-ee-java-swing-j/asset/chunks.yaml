    目标市场是首次购房者、活跃成年人、年轻专业人士、年轻家庭、老年家庭、退休人员以及自租型投资者。Racpro 的总部将位于约翰内堡的贝德福德维（Bedfordview）。Racpro
    的物业配套的生活中心配备了完善的礼宾服务和其他全方位增值服务，包括水疗、餐厅、健身房、壁球场、动作运动场、游戏室、电影院、加热游泳池、游乐场以及生活中心内的免费
    Wi-Fi。


