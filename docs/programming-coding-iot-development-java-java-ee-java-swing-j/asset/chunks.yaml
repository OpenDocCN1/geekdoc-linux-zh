    Jay DietWeight Loss, Health, Motivation, Productivity, Growth and Success...Let''s
    talk about losing weight for a minute.We gain weight because we eat more food
    than our bodies need. We eat more food because of cravings not hunger. Big problem.
    If you are not a sportsman or if you don''t spend most of your day doing physical
    labour, then your body can survive by eating one medium meal per day. However,
    many people eat three meals per day even if they don''t do physical work or live
