    时间是一个非常敏感的问题。非常敏感。每个人每天都有 24 小时，而你每天如何利用这 24 小时，决定了你的成功。你在这 24 小时内所做的每件事都应该围绕着获取尽可能多的信息展开，因为信息确实是成功的核心。


    当你睡觉时，你应该深知自己正在为大脑充电，以便在第二天能有效利用大脑来获取尽可能多的信息。当你进食时，你应该知道自己正在为身体补充能量，这样你才有足够的能量去探寻信息。当你在任何事情上浪费时间时，你应该清楚那是在浪费时间，它会让你远离成功。


    ## 时间管理流程

    - 设定一个明确的目标。

    - 将你的目标拆解为更小的里程碑。

    - 编写待办事项。

    - 使用 `80/20 Principle` 来确定优先顺序。

    - 尽量减少干扰。

    - 阅读关于你正在从事的事情的内容。

    - 回顾你的一天。


    ## 时间管理技能

    - 优先级排序。

    - 授权。

    - 决策能力。

    - 目标设定。

    - 问题解决能力。

    - 战略性、批判性和分析性思维。

    - 进度安排。


    ## 如何停止拖延

    - 识别你拖延的原因。

    - 将你的目标拆解为更小的里程碑。

    - 设定截止日期。

    - 利用积极的社交压力。

    - 奖励自己。

    - 每隔几分钟在两个任务之间切换。

    - 消除干扰。

    - 从小开始以获得动力。

    - 拆解最困难的任务。

    - 不要做完美主义者。

    - 不要试图完成每一个任务。

    - 设定可以管理的目标。

    - 练习积极的自我对话。

    - 制定行动计划。

    - 关注你的优势。

    - 寻求帮助。

    - 大量阅读。


    ## 80/20 生活方式

    信息、行为、生活方式、成长与成功……

    在 `80%` 的时间里处理 `20%` 的任务，这些任务能为你带来 `80%` 的回报。

