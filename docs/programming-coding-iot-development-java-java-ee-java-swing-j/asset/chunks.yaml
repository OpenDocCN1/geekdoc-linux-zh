    ## How to Sell

    ### The 4 P''s of marketing

    - Product

    - Price

    - Place

    - Promotion


    ### The 4 A''s of marketing

    - Acceptability

    - Affordability

    - Accessibility

    - Awareness


    ### Products

    Products are the goods or services you offer to customers. A product should fulfill
    consumer needs, or it should create new demand in the market. You should understand
    the life cycle of a product and have a plan for dealing with the product at every
    stage of its life cycle. People will want to buy your product if it satisfies
    the needs of your customers.


    ### Price

    The price the customer pays for the product should be linked to the product''s
    real and perceived value while taking into consideration supply costs, seasonal
    discounts, and competitors'' prices. You may raise the price to give the product
    the appearance of being a luxury or you may lower the price so more consumers
    can try the product but low prices can also give the impression that the product
    is less exclusive.


    ### Place

    When deciding on a place to sell your product, you should get your products in
    front of consumers that are most likely to buy them and plan for how to deliver
    the product to the market.


    ### Promotion

    Create a promotional strategy for your product. The purpose of promoting a product
    is to reveal to consumers why they need it and what they will benefit from it.
    With the rise of the internet, it is vital to promote your product both online
    and offline.


    ### Acceptability

    A product or service must meet or exceed the needs and expectations of customers.
    Acceptability is divided into two perspectives: functional and psychological acceptability.
    Functional acceptability refers to the ability of the product or service to deliver
    on what customers expect. The product should be reliable. Psychological acceptability
    is usually associated with the status of the brand or product. People prefer to
    buy a product they can trust.


    ### Affordability

    The target market should be economically able and psychologically willing to pay
    a product’s price. Affordability also has two perspectives: economic and psychological
    affordability. Economic affordability is focused on whether or not the target
    market can afford to pay the product’s price. Psychological affordability refers
    to a customer’s willingness to pay for a given price, the product’s value should
    be relative to the cost of the product or service.


    ### Accessibility

    Accessibility describes whether customers have access to the product and if they
    can use the product or service. There are two dimensions of Accessibility: availability
    and convenience. Availability measures if the is enough stock to match customer
    demand. Convenience is concerned with how easy it is for customers to get the
    product or service.


    ### Awareness

    Customers must be informed about a product and how it will benefit them. This
    will persuade customers to give the product a try and remind existing users to
    keep buying the product. The two dimensions of Awareness are product knowledge
    and brand awareness. Customers should believe in the brand and relevant information
    about the product or service should be provided.


    ### The six steps of the selling process

    1. Find prospects.

    2. Prepare a presentation.

    3. Approach your prospects.

    4. Give your sales presentation.

    5. Close the sale (ask the prospect if they want to buy).

    6. Follow up.


