- fmt: "\n# 1. They want to confirm their thoughts about you being the best candidate\n\
    \nRemember the company has a gap in their team that they are trying to fill, and\
    \ they already have a mental image of the kind of person they are looking for.\
    \ The good news is, if they called you for an interview then that means that they\
    \ think you have the personality they are looking for, so they would like to confirm\
    \ what they think by asking you a series of questions. \n\nThese questions are\
    \ what make up an interview and may either be behavioral or competency type of\
    \ questions depending on what the company thinks is more important for that particular\
    \ “gap”. So, it is very important to know what kind of candidate they are looking\
    \ for and present yourself accordingly so that they see that you are the kind\
    \ of fellow that they are looking for. \n\nTo do this, study the company’s requirements\
    \ for that position and match them with your skills, qualification and experience\
    \ e.g. if the company needs some experience in `SQL` then check if your CV has\
    \ `SQL`. This will help you understand what kind of fellow they are looking for\
    \ and how close are you to be that fellow. \n\nIf you feel like you don’t have\
    \ most of the requirements that they are looking for just remember one thing;\
    \ they already know that you don’t have the qualities that they are looking for\
    \ and they still think that you are the best person for the job so just prepare\
    \ thoroughly for the interview and you won’t go wrong.\n\n# 2. They want you to\
    \ support and give evidence of what you were telling them in your CV\n"
