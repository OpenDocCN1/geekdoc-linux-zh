    # Ways to live your life to the fullest


    * Stop complaining.

    * Be proactive.

    * Create your own opportunities.

    * Set goals.

    * Take time to reflect.

    * Change your self-talk.

    * Keep growing.


    ## Rules

    Challenges, Rules, Solution, Growth, Success, Wealth... King Solomn upscaled;
    Let''s follow suit.


    ### Business Rules

    * We are selling time.

    * Cause and effect, you control everything.

    * Start a cooperate to avoid taxes.

    * Be a king, eliminate competitors.

    * React to the market.

    * You upscale on people.

    * You are the business, people are the project.

    * Set up a profitable system then delegate.

    * Buy low, sell high.

    * Simplify everything.

    * Collaborate with everyone.


    ### Productivity Rules

    * Break every task down to the point of no confusion.

    * Where you don’t understand skip and ask.

    * Work from your to-do list.

    * Start with what is working.

    * Define the end and work from there.

    * Forget about yesterday, plan from today.

    * Start the day with planning and end with planning.


    ### Success Rules

    * Who you choose to marry is the most important decision.

    * Not everyone implements because of distractions.

    * Increase your probability of being at the right place at the right time.

    * Everyone can start a project but not everyone can finish it.

    * What you do now benefits you in the next 3 years.

    * The opposite of progress is excuses.

    * Personal development attracts success.


    ### Change Management Rules

    * Don''t tell people to change and not tell them how.

    * Which problem are you solving with the change?

    * Change for the sake of change helps nobody.

    * Change for a better future state.

    * Don''t do too much, too fast.

    * Tell people exactly how to change.

    * Give people resources, coaching and mentoring.

    * Defend people against the impact of change.

    * Change is happening for you, not to you.

    * Don’t make decisions immediately.

    * Seek council.

    * Look at similar historical events.

    * Have multiply sources of motivation.

    * Change is fun.


    ### Management Rules

    * Grow every day.

    * Never be personal, be financial.

    * Stop micro-managing.

    * Do administration and delegate everything.

    * Management is measuring and reporting.

    * Give everyone the law, not the custom.

    * Spend time planning and you will avoid all problems.

    * All failure can be avoided by planning and reading.

    * Don’t break your rules for anything.

    * Design a job to the point of no argument.

    * If you don’t manage a process, it will manage you.

    * CEOs should be free and work on planning only.

    * Managers have specific info; juniors have general info.

    * Focus on reports only.

    * Fix the system, not the person.

    * Focus on the output.

    * Get people who can solve the problem.


    ### Technology Tips

    * Always look up what you are doing.

    * Look into the camera when video calling.

    * Write your to-do list on `excel`.

    * Always have your to-do list open.

    * `CTRL+ALT+TAB` (for productivity).

    * `CTRL+SHIT+T` (to re-open a recently closed web page).


    ### Rules of Power

    * Everything wrong a person does is your leverage.

    * Focus on what you should do.

    * Don’t work with a person, work with your plan.

    * Follow the rules.

    * Be careful of small things.

    * Greatest leaders are servants.

    * Everyone is a leader in their area of function.

    * Never get distracted from your destination.

    * Strength comes from failure, increase your rate of failure.

    * Delegate leadership.

    * Intelligence is a gift to be used by mankind.

    * Everything works out if you keep at it.

    * Fix the mistakes of your problem solvers.

    * Every problem is a design issue.

    * Help only when the is a problem.

    * Get the right people for the right job.

    * Leverage is power.


    ### Rules Of Information

    * Knowledge removes unnecessary emotions.

    * Prioritize reading what you should know now.

    * Use all resources (internet, books, videos, Images...).

    * Memorize by doing (write, recite, draw, teach...).

    * Read until wisdom becomes intuition.

    * School, you pay for information.

    * Reading teaches you how to do.

    * Reading is life''s GPS.

    * The world is a dangerous place if you don’t read.

    * Reading creates vision.

    * Learn, reflect, implement, and share.

    * Answer your own questions through experiments.

    * Spend 80% of your time acquiring information.

    * Everything can be improved through reading.

    * There are things that you can see visually that you cannot see numerically.

    * Being angry means, you didn’t read enough about the subject.

    * Read a lot for future emotions and problem solving.


    ### Marketing Rules

    * Create a blog.

    * Use social media for marketing.

    * Avoid spamming people.

    * React to the market.

    * Collect email addresses on your landing page.

    * Pay for internet ads.

    * Listen to the majority, not individuals.

    * The trend is your friend.

    * Awareness beats packaging.

    * Brand and prestige beat product price.

    * Quality is marketing.


    ### Rules Of Making Money

    * Spend less, earn more, and upscale.

    * Automate, systemize, and delegate.

    * Track your money and simplify everything.

    * Don’t rush to pay off good debt.

    * Saving is for emergencies and opportunities.

    * Spend 55% of your salary on necessities.

    * Invest 10% of your salary.

    * Save 10% of your salary.

    * Spend 10 % of your salary on education.

    * Spend 10 of your salary on entertainment.

    * Spend 5% of your salary on giving to family.

    * Invest in yourself; register for a finance course.

    * Delay useless family expenses, friends, and hobbies.

    * Delay entertainment, stability, comfort, and pride.

    * Start a business with your savings.

    * Sell one thing to a million people or a million things to million people.

    * Live like you are poor for five years and save money.

    * Use emergency funds to avoid bad debt.

    * Never invest in what you don’t understand.

    * Remember, Messi didn’t get rich by scoring one goal.

    * Do not invest in bonds (only 3% return).

    * Eliminate bad debt, save, and invest.

    * Work 100 hours a week.

    * Create a passive income stream.

    * Have cash reserves.

    * Personal development will make you rich.

    * Flip houses with the money you saved.

    * Work on your high-priority goal every day.

    * Success is a ratio of money, mind, and man.

    * Failure gives you information needed for success.

    * Scale-up things you have a routine.


    ### Types Of Investments

    * Shares.

    * Property.

    * High-yield savings accounts.

    * Bonds.

    * Index funds.

    * Money market account.

    * Certificate of deposit (`CD`).


    ### Investing Tips

    * Do not try day-trading.

    * Don''t lend folks, give it to them for favour.

    * Invest in real estate.

    * Stay away from bad debt.

    * Invest early and consistently.

    * Cut unnecessary expenses.

    * Visit the bank more often for advice.

    * Invest in `401k` to get the match.

    * Have an emergency fund.

    * Build a diversified portfolio.

    * Track your spending, savings, and investments.

    * Start a side hustle with your savings.

    * Create multiple sources of income.

    * Learn every day.


    ### Leadership Rules

    * Don’t ask a question if you already know the answer.

    * Be fair and try not hurt anyone.

    * Listen to what people want.

    * A leader is someone who reads all the books.

    * Motivate people to do what they want.

    * Don’t say no, just give people a different solution.

    * A leader is someone who reminds everyone what is fair.

    * Leadership is a by-product of practicing good people skills.

    * Have clear outputs.

    * Change yourself then you will change the world.

    * Ask people what they need and want.

    * Always apologise for the bad things that the authority forces you to do.

    * Defend yourself against a bad situation.

    * Never attack someone, be neutral, and stick to the facts.

    ...

    * Write the negative down to change the system.

    * Help people reach their goals.

    * Never use critical analysis on people.

    * Apologize for not being fair.

    * Take time to gently explain why.

    * Take time to gently repeat what you said.

    * Don’t call out bad behaviour, re-design the system instead.

    * Put your beliefs aside when dealing with people.

    * Ask people how they want to be treated.

    * Ask for feedback.

    * Teach a person how to reach the goal.

    * Send out objectives before having a meeting.

    * Always ask the objectives of everything.

    * Find another way to deliver a message without meetings.

    ### Teamwork Rules

    * Listen to requirements when people talk.

    * Research your projects.

    * `GCC` design fault.

    * Support other people''s weaknesses.

    * Avoid talking about any kind of politics.

    * Focus on your daily tasks.

    * Always be nice because the wheel will definitely turn.

    * Ask only specific questions related to your tasks.

    * Get your tasks, complete your tasks and the rest is noise.

    * Be positive, flexible, organized, and reliable.

    * Be nice to everyone.

    * Don’t be too dependant on one person. Diversify.

    * Team is essential for success.

    * Avoid lazy people.

    * Do a quality job.

    * Don’t try to understand everything that''s happening. Understand what you should
    be doing.

    * What is the goal and how should I go about how to do that.

    * Choose how people treat you by showing your strength and being vocal.

    * Beat the person at their own game.


    ## Mindfulness

    Awareness, Self-Mastery, Information, Growth, Success, Wealth... Awareness is
    the first step.

    Mindfulness is a state of being intensely aware of what you''re feeling without
    interpretation or judgment. Mindfulness helps to relax the body and mind and help
    reduce stress by learning to focus on the present moment. Mindfulness has many
    physical and psychological benefits; this includes self-control, flexibility,
    improved concentration, mental clarity, emotional intelligence and best of all,
    it prepares you for success.


    ### How to boost mindfulness

    * Write down what you are doing.

