    - Anticipatory stress.

    - Situational stress.

    - Encounter stress.


    ## Anxiety

    Anxiety is a feeling of unease, such as worry or fear that can be mild or severe
    and can cause rapid heart rate, palpitations, and chest pains. Anxiety can be
    caused by anything that makes you feel worried such as sitting an exam, having
    a medical test, or a job interview.


    ## How to Fix Anxiety

    - Take a time-out.

    - Eat healthy meals.


    ## Common Anxiety Signs and Symptoms

    - Feeling nervous.

    - Restless.

    - Tense.

    - Increased heart rate.

    - Sweating.

    - Trembling.

    - Feeling weak.

