    # 面试指南


    ## 应该做的 (Dos)

    * 微笑

    * 保持冷静

    * 保持眼神交流

    * 如果快速转身说话，请放慢速度

    * 准备一份你的故事清单

    * 穿西装（蓝色、灰色或黑色，配白色衬衫）

    * 在保持眼神交流并微笑的同时，进行坚定但不要用力过猛的握手

    * 站起来迎接面试官（很高兴见到你）

    * 将简历装在整洁专业的文件夹里带上

    * 关闭手机

    * 尝试用 STAR 法则来组织你的回答


    ## 不应该做的 (What not to do)

    * 不要来得太早。

    * 不要迟到。

    * 不要喷过多的香水。

    * 不要害怕重复简历中已有的。

    * 回答时不要给出主观意见。提供证据和成功案例。


    记住，这些人已经想雇佣你了，他们信任你，他们已经看到了你是一个什么样的人，他们只是想确认这一点。所以，不要试图表现得与众，遵循基础即可。闭嘴，回答他们的问题，然后离开。这些人永远不会面试他们不想雇佣的人。记住，他们是站在你这边，而不是针对你。


    ## 遵循基础

    ### 准与忌

    * 信心与恐慌

    * 着装规范与礼仪

    * 技巧与流程


    ![](img/image_rsrc4MW0.jpg)

    ![](img/image_rsrc4MW1.jpg)


    ## 无需经验的工作

    * 客户代表

    * 房地产经纪人

    * 销售代表

    * 医疗助理

    * 行政助理

    * 兽医助理

    * 客户服务专家

    * 法律助理

    * 育儿员或照顾宠物

    * 自由职业

    * 在线工作


    ## 如何快速找到工作

    * 研究你收到的反馈

    * 创建一份最完美的简历（通过不断修改）

    * 在简历上将你的技能表格化

    * 精通职位面试技巧

    * 确保你的社交媒体上没有负面信息

    * 持续提高你的技能

    * 申请职位比市场上任何人都多


    ## 如何建立成功的职业

    * 设定目标

    * 简历品牌化

    * 了解你的优缺点

    * 承担责任并设定你的标准

    * 找一位导师

    * 建立人脉并申请工作


    ### 撰写良好职业目标的技巧

    * 梦想远大

    * 确定你的竞争优势

    * 灵活且适应能力强

    * 将职位要求与你的教育背景匹配

    * 评估你目前的技能

    * 记住你的兴趣

    * 考虑工作的增长和需求


    以下是根据金钱和需求排名的热门工作。

    * 统计师

    * 医疗领域

    * 技术领域（软件开发人员和数据科学）

    * 金融

    * 教育

    * 技术性工作（工程等）

    * 商务服务（包括咨询、管理和销售）


    * 由于信息技术导致需求减少的职位列表

    * 旅行社代理

    * 收银员和银行柜员

    * 邮递员

    * 体育裁判

    * 电话营销员

    * 秘书


    ## 如何在没有工作经验的情况下工作

    * 筛选职位（这意味着每天申请超过 50 个职位）

    * 研究筛选收到的反馈，研究你在哪些领域最受青睐。

    * 专注于这些领域并继续每天申请 50 个职位。

    * 记住，需要申请 5600 次才能获得你的理想工作。每天申请 50 个，需要 4 个月才能获得理想工作。


    ## 如何享受你的工作

    * 保持积极的态度

    * 拥有与工作无关的个人生活

    * 创建待办事项列表

    * 需要时委任务

    * 定期进行短暂休息

    * 让你的工作环境更愉快

    * 计划并回顾你的一天

    * 努力且聪明地工作

    * 建立常规


    ## 电话面试技巧

    * 穿得得体。这可以让你感到很专业并认真对待事情。

    * 确保你在一个有桌子的安静房间里。

    * 准备好你申请的职位描述以及写好的笔记（技能、资质和经验）。这就像是一场开卷考试。记住在收到面试邀请时，要求对方将职位描述发给你。

    * 如果你喜欢，可以站着。科学表明站立时说话更清晰。这是因为你的膈肌会放松，胸部打开，所以你呼吸和说话更轻松。你可以走动，如果你感到害怕，这有助于你放松。

    * 确保信号良好，如果信号不好，不要强行继续，而是要求用另一个号码拨打。

    * 如果没有听清问题，请询问。

    * 确保说话声音大到能被听到，不要说得太快。

    * 不要漫谈，保持你的回答清晰明了。

    * 微笑，这有助于你放松并听起来更有自信。

    * 保持冷静放松，不要害怕停顿思考，当他们保持时不要恐慌，他们可能在做记录。


    ## 面试技巧

    * 将你的技能、资质和经验与职位要求匹配。职位名称并不重要。重要的是你的技能、资质或教育背景与职位说明相似。

    * 练习如何回答面试问题。一种方法是写下做过的技能、资质和经验，然后背诵它们，增加获得机会的机会。

    * 研究公司。

    * 练习评估测试（如果有）。永远不要在没有练习的情况下去参加评估测试。

    * 了解面试中该做什么和不做什么（包括着装规范）。

    * 跟进。


    ### 你可以在职位面试中问的问题示例：

    * 你们员工共同的性格特征是什么？

    * 如果我想多付出一份努力，我需要做什么？

    * 如果你雇佣我，每天对我期望的首要任务是什么？

    * 你们支持想要进一步学习的员工吗？

    * 你们公司的核心关注领域是海洋学、气象学和化学。你认为你们的第一大特征是什么？

    * 我在你们的网站上读过一篇关于公司计划开设水文学部门的文章，那是两年前的事了。该计划还在进行吗？

    * 我应该如何以及何时与你跟进？

    * 根据我的背景和技能，你认为我在这个职位上最大的挑战是什么？

    * 在目前的职位上，你们公司认为成功代表什么？


    ## 求职工具

    * 社交媒体

    * 应用程序

    * 电子邮件

    * 搜索引擎


    ## 求职步骤

    * 始终更新你的简历

    * 在公司网站上完成在线简介

    * 有效利用互联网

    * 搜索并申请工作

    * 准备面试

    * 准备评估测试

    * 通过面试

    * 仔细选择你的推荐人

    * 获得录用通知


    ## 任何员工所需的顶级技能

    * 敏锐度

    * 良好的沟通能力

    * 团队合作

    * 谈判技巧

    * 解决问题 / 分析能力

    * 领导力

    * 压力管理

    * 信心


    ## 从哪里获取关于公司的信息

    * 公司网站

    * 谷歌

    * 与他们的雇主交流

    * 在 `indeed` 等职位搜索引擎上阅读公司评论

    * 新闻稿


    ## 关于公司的了解内容

    * 他们的使命、愿景和价值观（通常在公司网站上）

    * 公司奖励和成就

    * 公司部门和规模

    * 公司声誉

    * 他们的产品和竞争对手

    * 了解行业表现。（通常在股市网站如 `moneyweb`）


    ## 如何将你的技能、资质和经验与职位描述匹配

    * 将职位描述总结为技能、经验、知识和职责，并写下使用的关键词。

    * 总结你的技能、资质和经验。写下关键词

    * 比较这两个总结并看是否匹配。这就是你在面试中讨论的内容——你的技能、资质和经验如何匹配职位描述。记住，面试是你和面试官之间的对话，主题是你的技能、经验和教育；仅此而已。


    '
- fmt: '

    Research, study and make sure you have deep knowledge on the required skills that
    you don’t have and on the duties that you are required to do. These will help
    you answer technical questions about something that you have never been exposed
    to. However, be honest if you do not know something because chances are, the interviewers
    already know that you don’t know the answer to the questions, but they just want
    to see if you are honest. No one wants to hire a liar, not even politicians.


    ## Common skills that employers are looking for


    * Communication skills

    * Team working

    * Work ethic

    * Analytical and problem-solving skills

    * Interpersonal skills

    * Flexibility

    * Computer skills

    * Attention to detail

    * Leadership skills

    * Organizational skills


    ## Tips for job interviews


    * Know about the position in and out.

    * Prepare success stories and practice them.

    * Interviewers are more interested in how you answer the question, they are more
    interested in the thought process and would love to know how you think.

    * Use the job description to make a list of questions that you might be asked
    judging from the job description and try to find the answers. Always use the `SARS`
    technique when you are answering question and use success stories to give examples.

    * Try and find interview questions for that particular post and practice them.

    * Find people who have the same position that you are being interviewed for and
    ask them. This may be people you know, your colleagues, your seniors at work or
    even strangers on social media e.g. `LinkedIn`

    * Browse the internet the type of questions asked for that particular post.


    ## Work ethic traits that employers are looking for in a candidate include:


    * Discipline

    * Sense of teamwork

    * Honesty

    * Dedication

    * Positive attitude

    * Empathy

    * Respect

    * Sense of responsibility


    ## Answering interview questions


    * Answer the question with stories and examples

    * Make sure your stories follow the `SARS` technique

    * Prepare and practice success stories before hand

