    职业可以被定义为一个人拥有的技能、教育和经验。规划职业将帮助你有效地利用自己的优势，帮助你朝着正确的方向发展，并建立你的信心。不要害怕远大目标，然后将你的目标拆解为更小的里程碑。制定一个十年计划、一个五年计划和一个年度计划。经常回顾你的计划并根据情况进行调整。记住，灵活性和适应能力是关键。


    ## 建立职业

    建立职业可能是一件非常棘的事情。你需要阅读许多书籍、观看许多视频并寻找一位导师。让一个已经建立了成功职业的人担任你的导师，通过仅仅提供不同的视角，就能帮助你解决你将遇到的大部分问题。


    设定 SMART 目标，并对未来自己所处的自己有一个愿景。这应该包括你的优势、劣势、机会和威胁。警惕那些在不久将来将消失的职业。始终采取行动，以免错过机会。要负责任，设定好你的标准，并建立一份出色的简历。


    你的 `CV` 就是你的品牌，确保给它精良的设计，维护它并对其进行良好的市场营销。当你向公司发送 `CV` 时，你实际上是在推销你的品牌。学习营销技能并持续推销你的
    `CV`。人脉经营是推销品牌的另一种方式。人脉还将帮助你让自己周围充满成功人士，从而能够改善你的视角。你是你周围的人的平均值，所以请明智选择。


    ## 制定良好职业目标的贴士

    在设定目标时，确保你的梦想远大并设定高标准。寻找一个能让你具有竞争优势的职业。这意味着你已经具备了该职业所需的技能。即使你没有工作经验，每个人都有自己擅长的技能。这项技能就是你的竞争优势。


    记住，选择一个你感兴趣的职业会有帮助。这意味着在你拥的所有技能中，哪一个让你最感兴趣，但要始终记住工作需求和职业增长。确保你一直学习到终老。如果你没有在任何机构注册并学习，你就犯了错误。永远不要停止学习。这将帮助你在职业生涯中不断成长，帮助你快速成长，并让你的薪水不断增长。薪水的
    10% 应该用于你的学习。我将写一本关于财务的书，解释剩下的钱应该流向何处。


    ## 职业

    医疗领域永远需要人才。牙科医生、医生、正畸医生、执业护士和医生收入非常丰厚。信息是人生中最重要的资源之一。教育是一门销售信息的业务。因此，教育领域的工作将永远存在。


    信息技术发展非常快。这使得软件开发者和数据专家的工作需求很大，且薪水很高。统计学家主要在数据分析领域工作，由于 IT 的快速发展，该领域增长得非常快。在我的下一书中，我将讨论
    `IT` 领域和数据分析的职业。技术正在改变劳动力市场，导致某些工作的灭绝。这是因为在 IT 的帮助下，这些工作可以更高效、更便宜地完成。


    ## 如何赚钱

    找工作、就业、薪水、财务管理、商业、利润、增长、成功、财富……找工作是赚钱最简单的方法。


    ### 有效找工作的步骤


