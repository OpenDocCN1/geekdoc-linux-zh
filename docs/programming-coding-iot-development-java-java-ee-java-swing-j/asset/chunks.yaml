    entries to the general ledger.• Adjust journal entries.• Prepare financial statements.•
    Close the books.Main Accounting Keywords• Assets• Liabilities• Equity• Revenue•
    ExpensesGolden Rules Of Accounting• Debit the receiver, credit the giver.• Debit
    what comes in, credit what goes out.• Debit all expenses and losses and credit
    all incomes and gains.Accounting Software• Billing/ Invoicing Software.• Payroll
    management system.• ERP Systems.Accounting EntryAn accounting entry is the formal
    recording of all the transactions in the book of accounts of the company where
    the debit and credit are recorded. The main types of accounting entries are transaction
    entry, adjusting entry, and closing entry. Every transaction has two journal entries:
    a debit and a credit. Debits must always equal credits. This double-entry technique
    (debits equal credits) helps in preventing some common bookkeeping errors.Types
    Of Journal Entries• Simple entry• Compound entry• Opening entry• Transfer entries•
    Closing entries• Adjustment entries• Rectifying entries.Simple EntryA simple journal
    entry is an accounting entry in which just one account is debited and one is credited.Compound
    EntryA compound journal entry is an accounting entry in which the is more than
    one debit and more than one credit.Transfer EntryA transfer is a type of journal
    entry used to move funds from one project account to another or from an operating
    account to a project account.Adjusting EntriesAdjusting entries are made at the
    end of the accounting period after a trial balance has been prepared. Adjusting
    entries enable you to adjust revenues and expenses to the accounting period within
    which they occurred. When an error is committed in the books of accounts the error
    should be corrected to show true numbers in financial statements. If the error
    is immediately identified it may be fixed by striking out the wrong entry and
    replacing it with a correct one.Accounting Principles• Accrual principle.• Conservatism
    principle.• Consistency principle.• Cost principle.• Economic entity principle.•
    Full disclosure principle.• Going concern principle.• Matching principle.Accrual
    Principle.The general concept of accrual accounting is that you record the expense
    at the time when the transaction occurs rather than when payment is made or received
    meaning that you record revenue when you invoice the customer, rather than when
    the customer pays you.Conservatism PrincipleAccounting conservatism is a principle
    that requires company accounts to be prepared with caution and high degrees of
    verification. All probable losses are recorded when they are discovered, while
    gains can only be registered when they are fully realized. It is concerned about
    the reliability of the Financial Statements of an entity.Matching PrincipleThe
    matching principle is part of the Generally Accepted Accounting Principles (GAAP)
    and it requires that any business expenses incurred must be recorded in the same
    period as related revenues to maintain the cause-and-effect relationship between
    spending and earning.Going Concern PrincipleThe going concern principle is the
    assumption that an entity will remain in business for the foreseeable future and
    the value of an entity that is assumed to be a going concern is higher than its
    breakup value since a going concern can potentially continue to earn profits.Full
    Disclosure Principle.The full disclosure principle states that publicly traded
    companies should release and provide all material facts that are relevant to their
    ongoing business operations.Economic Entity PrincipleThe economic entity principle
    states that the recorded activities of a business entity should be kept separate
    from the recorded activities of its owner(s) which will make audit easier and
    give a true representation of the business performance.Cost PrincipleThe cost
    principle states that items have to be recorded as the actual price paid.Consistency
    PrincipleThe consistency principle states that, once you adopt an accounting principle
    or method, continue to follow it consistently in future accounting periods so
    that the results reported from period to period are comparable.FinanceFinancial
