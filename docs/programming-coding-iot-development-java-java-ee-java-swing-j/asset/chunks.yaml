    # 如何充实你的人生


    *   停止抱怨。

    *   积极主动。

    *   创造你自己的机会。

    *   设定目标。

    *   花时间进行反思。

    *   改变你的内心对话。

    *   不断成长。


    ## 规则

    挑战、规则、解决方案、成长、成功、财富……所罗门王提升了这些维度；让我们效仿他。


    ### 商业规则

    *   我们出售的是时间。

    *   因果律，你控制一切。

    *   成立公司以规避税收。

    *   像国王一样，消除竞争对手。

    *   对市场做出反应。

    *   你在他人身上升级。

    *   你就是业务，人就是项目。

    *   建立一个盈利的系统，然后授权。

    *   低买高卖。

    *   简化一切。

    *   与所有人合作。


    ### 生产力规则

    *   将每项任务分解到不再产生困惑的程度。

    *   哪里不懂就跳过并提问。

    *   根据待办清单工作。

    *   从有效的方法开始。

    *   定义终点并从那里倒推。

    *   忘记昨天，从今天开始计划。

    *   以计划开始一天，以计划结束一天。


    ### 成功规则

    *   你选择和谁结婚是最重要的决定。

    *   并不是所有人都因为分心而不执行。

    *   增加你在正确的时间出现在正确地点的概率。

    *   每个人都可以启动项目，但并非每个人都能完成它。

    *   你现在所做的一切将使你在未来 3 年内受益。

    *   进步的反面是借口。

    *   个人发展吸引成功。


    ### 变革管理规则

    *   不要告诉人们改变却不告诉他们如何做。

    *   你正在通过变革解决什么问题？

    *   为了改变而改变对任何人都没有帮助。

    *   为了更好的未来状态而改变。

    *   不要做得太多、太快。

    *   确准确地告诉人们如何改变。

    *   给人们资源、辅导和指导。

    *   保护人们免受变革的影响。

    *   变革是发生在你身上的，而不是针对你。

    *   不要立即做决定。

    *   寻求建议。

    *   查看类似的历史事件。

    *   拥有多种动力来源。

    *   变革是有趣的。


    ### 管理规则

    *   每天成长。

    *   永远不要情绪化，要财务化。

    *   停止微观管理。

    *   处理行政事务并授权一切事务。

    *   管理就是衡量和报告。

    *   给每个人法律，而不是惯俗。

    *   花时间计划，你将避免所有问题。

    *   所有的失败都可以通过计划和阅读避免。

    *   不要为了任何事情打破你的规则。

    *   设计一份工作到不再产生争议的程度。

    *   如果你不管理流程，流程就会管理你。

    *   CEO 应该是自由的，只负责计划。

    *   经理拥有特定信息；初级拥有通用信息。

    *   只关注报告。

    *   修复系统，而不是人。

    *   关注产出。

    *   找到能解决问题的人。


    ### 技术小贴士

    *   随时查询你正在做的事情。

    *   视频通话时看向摄像头。

    *   在 `excel` 上写你的待办清单。

    *   始终打开你的待办清单。

    *   `CTRL+ALT+TAB`（为了生产力）。

    *   `CTRL+SHIT+T`（重新打开最近关闭的网页页）。


    ### 权力规则

    *   一个人所做的所有错误都是你的杠杆。

    *   关注你应该做的事。

    *   不要和人一起工作，要和你的计划工作。

    *   遵循规则。

    *   注意细节。

    *   伟大的领导者是仆人。

    *   每个人在自己的职领域都是领导者。

    *   永远不要偏离目标。

    *   力量来自失败，增加你的失败率。

    *   授权领导力。

    *   智力是给人类使用的礼物。

    *   只要你坚持，一切都会解决。

    *   修复你的问题解决者犯错误。

    *   每个问题都是设计问题。

    *   只在出现问题时提供帮助。

    *   为正确的工作找正确的人。

    *   杠杆就是力量。


    ### 信息规则

    *   知识消除不必要的情绪。

    *   优先阅读你现在应该知道的内容。

    *   利用所有资源（互联网、书籍、视频、图片……）。

    *   通过实践来记忆（写、背、画、教……）。

    *   阅读直到智慧变成直觉。

    *   学校，你为信息付钱。

    *   阅读教你如何做。

    *   阅读是生活的 GPS。

    *   如果不阅读，世界将是一个危险的地方。

    *   阅读创造愿景。

    *   学习、反思、实施并分享。

    *   通过实验回答自己的问题。

    *   花费 80% 的时间获取信息。

    *   一切都可以通过阅读得到改进。

    *   有些事情你可以视觉上看到，但无法通过数字看到。

    *   愤怒意味着你对主题阅读得不够。

    *   为了未来的情绪和问题解决多读。


    ### 营销规则

    *   创建一个博客。

    *   使用社交媒体进行营销。

    *   避免向人们发垃圾。

    *   对市场做出反应。

    *   在落地页上收集电子邮件地址。

    *   支付网络广告费。

    *   听大多数人的，而不是个人的。

    *   趋势是你的朋友。

    *   意识胜过包装。

    *   品牌和声誉胜过产品价格。

    *   质量就是营销。


    ### 赚钱规则

    *   少花、多赚，并升级。

    *   自动化、系统化和授权。

    *   追踪你的金钱并简化一切。

    *   不要急于偿还好债。

    *   储蓄是为了紧急情况和机会。

    *   将工资的 55% 用于必需品。

    *   投资 10%。


