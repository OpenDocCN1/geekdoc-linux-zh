    # 广告

    产品、广告、金钱、增长、财富…… 销售解决方案。广告（或 ad）是推广产品、服务或品牌，以吸引客户兴趣并增加销售额。广告的目的是影响人们直接或间接地进行购买。


    ## 广告类型

    - 在线广告。

    - 展示广告。

    - 视频广告。

    - 移动广告。

    - 原生广告（赞助内容）。

    - 社交媒体广告。

