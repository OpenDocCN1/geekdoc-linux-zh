- fmt: "\n# Information Technology Overview\n\nInformation technology (IT) is at the\
    \ center of business operations. Businesses rely heavily on IT to provide their\
    \ products and services. Businesses are completely dependent on IT to perform\
    \ their daily operation however this dependence on IT is also a source of significant\
    \ risk because if not used properly, IT systems can render the business impotent\
    \ to provide its product and services and thus impacting operational performance\
    \ of a business. Businesses use IT to provide their products and services, to\
    \ innovate, achieve strategic goals and for the overall competitive advantage\
    \ through operational excellence. \n\nThere is no success without information.\
    \ You have to be able to collect and analyze information to be successful. That\
    \ is why reading is shockingly important. Analyzing information is a form of thinking\
    \ and human beings need information as much as companies need big data. This is\
    \ why mathematics is so important. Math is analytics, analytics is thinking, thinking\
    \ requires information and information leads to success. This is success analytics.\n\
    \n## Information Technology examples\n* Telephone and radio.\n* The internet.\n\
    * Video conferencing equipment.\n* Computers.\n\n## Careers in Information Technology\n\
    * Technical Support.\n* Web Developers.\n* Computer Systems Analysts.\n* IT Security.\n\
    * Network Engineer.\n* Database Engineer.\n* Software Developers.\n\n## 5 Skills\
    \ Needed For Big Data Analyst\n* Programming.\n* Data Administration.\n* Computational\
    \ frameworks.\n* Quantitative Analytics and Statistics.\n* Business Knowledge.\n\
    \n## High-paying big data Jobs\n* Quantitative analysts.\n* Data scientists.\n\
    * Statisticians.\n* MI and BI specialists.\n\n## Skills for Big Data Professionals\n\
    * `Qlik View`, `Tableau`, `Power BI` and `Excel`.\n* `Alteryx`, `Spotfire`, `Scala`\
    \ and `Presto`.\n* `SAS`, `R`, `Python`, `Java`, `XML` and `HTML`.\n* `VB.NET`,\
    \ `Azure`, `C`, `C++` and `C#`.\n* `Cloudera`, `Cassandra`, `HDFS` and `Teradata`.\n\
    * `Oracle`, `SQL`, `NoSQL` and `Hadoop`.\n* `Informatica`, `IBM`, `AbInitio`,\
    \ `ERP` and `SAP`.\n* `AWS`, `Talend`, `Spark`, `Reltio` and `DevOps`.\n\n## Big\
    \ Data\nData Management, Decision Making, Information, Growth, Success, Wealth...\n\
    Data Science, Data Management, Data Architecture, Data Engineer, Data This, Data\
    \ That, Data this and that...\n\n## Data Management\nData management is the practice\
    \ of storing and maintaining data as a valuable resource for organizations to\
    \ unlock their potential. Managing data requires a robust data strategy and plans\
    \ of how to access, integrate, cleanse, govern, store and prepare data for analytics.\
    \ `Data Architects` have to design how IT infrastructure can be used effectively\
    \ and efficiently in order to support and maximize the use of data by your organisation.\n\
    \n## Data Architecture\nData architecture is an outline or a plan of how IT infrastructure\
    \ supports your data strategy by showing how data is acquired, transported, stored,\
    \ queried, and secured. It is a set of rules, policies, standards, diagrams and\
    \ models that govern and explains how data is used, stored, managed and integrated\
    \ within an organization to ensure efficient use of data. The purpose of data\
    \ architecture is to show the relationship between the data, business objectives\
    \ and operations strategy.\n\n## Data Science\nData science is a multi-disciplinary\
    \ field that uses scientific methods, processes, algorithms and systems to manage\
    \ data and extract knowledge and insights from structured and unstructured data.\
    \ It focuses on finding solutions to solving big data problems by creating a sustainable\
    \ way to manage data and finding ways to make sure that the business benefits\
    \ from data. Data Science includes both data management and data analytics. It\
    \ is a blend of mathematics, statistics, business and technology.\n\nData science,\
    \ Information management, data management, data engineering, data warehousing\
    \ and data analytics are often used interchangeably in the working environment\
    \ which is good because they are almost the same thing, however, some people like\
    \ to invest time trying to differentiate between them. Don't do that. Don't waste\
    \ time on purpose. There are more important things that you can spend your time\
    \ on. As you will see in this book, time is one of the key components of success.\
    \ As long as your career is centered around big data, then your job title can\
    \ be anything data related, data this, data that, data this and that. All you\
    \ have do is know `SQL`, `SAS`, `Excel`, `Python` and `R`. At least two of those.\
    \ That's all you need.\n\n## Basic Skills For Data Science Engineers\n* Data analytics\
    \ (`Microsoft Excel`).\n* Database management (`SQL`).\n* Data quality knowledge\
    \ (`DMBOK` principles).\n\n## Advanced Skills For Data Science Engineers\n* Programming\
    \ in `Python`, `R` or `SAS`.\n* Solid understanding of probability and statistics.\n\
    * Data visualization tools (`PowerBI`).\n\n## Components Of Data Management\n\
    * Business intelligence.\n* Data architecture.\n* Data governance.\n* Data integration.\n\
    * Data modeling.\n* Data quality.\n* Data security.\n* Data warehousing.\n\n##\
    \ Popular Skills For Big Data Jobs\n* `SQL`, `R`, `Python` or `SAS` programming\
    \ language.\n* `Microsoft Excel`.\n* Critical thinking.\n* Data visualization\
    \ (dashboards).\n* Presentation skills.\n* Machine learning and AI.\n* Data warehousing.\n\
    * ETL tools (`SSIS`).\n* Data APIs.\n* Coding and programming languages.\n* Knowledge\
    \ of algorithms and data structures.\n\n## Six Stages Of Data Processing\n* Data\
    \ collection.\n* Data input.\n* Data processing.\n* Data analytics.\n* Data reporting.\n\
    * Data storage.\n\n## Developing A Successful Data Architecture\n* Assess how\
    \ the tools and systems work.\n* Define business goals and objectives.\n* Develop\
    \ an overall plan for data structure.\n* Select data management and visualization\
    \ tools.\n\n## How To Become A Data Science Engineer\n* Learn basic math and statistics.\n\
    * Learn to code.\n* Understand databases.\n* Learn `microsoft Excel` and `SQL`.\n\
    * Get a degree in technology or computer science.\n* Apply for jobs.\n\n## Big\
    \ Data Jobs\n* Data scientist.\n* Data analyst.\n* Data engineer or data architect.\n\
    * MI or BI analyst.\n* Machine learning or AI engineer.\n* Quantitative analyst\
    \ or statistician.\n\n## Common Data Types\n* `Boolean` (true or false)\n* `Character`\
    \ (a, b, c...)\n* `Date` (03/01/2021...)\n* `Double` (1.54343534532e308)\n* `Floating-point\
    \ number` (1.234455)\n* `Integer` (1234....)\n\n## Free Database Management Software\n\
    * `Microsoft SQL server`.\n* `SolarWinds`.\n* `Dbvisualizer`.\n* `Manageengine\
    \ applications manager`.\n* `Oracle rdbms`.\n* `Ibm db2`.\n* `Teradata`.\n\n##\
    \ Data Strategy\nData Strategy, Information, Decisions, Growth, Success...\nThis\
    \ is how organisations use data.\n\n## Data Analytics (Charts & Dashboards)\n\
    Data produced by the data management team helps the analytics teams to create\
    \ dashboards which helps drive the business and ensures that business intelligence\
    \ is one of the key components of competitive advantage for the organisation.\
    \ The analytics teams will receive the dashboards requirement from the business\
    \ units and request the data from the data management team. After a dashboard\
    \ is created, the analytics team will maintain dashboards and the data management\
    \ team will maintain the data feeding the dashboards. The data requirements for\
    \ dashboard creation can be either from internal analytics teams or business units\
    \ across the organisation. The key goal of the data management team is to support\
    \ the analytics team to produce as many dashboards possible depending on resources\
    \ available (money, material, machine, and manpower).\n\n## Automation\nData processes\
    \ for new dashboards will be optimized and automated after the project ends, provided\
    \ that the output adds value to the organisation.\n\n## Reliability and Tracking\n\
    The number of outputs produced should be benchmarked across all teams and business\
    \ units to ensure that the team is sustainable, consistent, and reliable.\n\n\
    ## Agile (Project Management Methodology)\nThe data management team will receive\
    \ 90% of the projects from the analytics team. After requirements are received,\
    \ the team will use the Agile method to complete the task as soon as possible.\
    \ This entails braking down the tasks into smaller milestones then completing\
    \ the milestones in 2-weeks sprints. Both failed and successful projects will\
    \ be counted as part of the 90%.\n\n## Quality Assurance & Control\nThe data management\
    \ team will be responsible of quality monitoring during the project implementation\
    \ phase and after automation. Data quality compliance will be completed by the\
    \ data management team.\n\n## Components of Success\nEmployment, Business, Resources,\
    \ Information, Growth, Success...\n"
