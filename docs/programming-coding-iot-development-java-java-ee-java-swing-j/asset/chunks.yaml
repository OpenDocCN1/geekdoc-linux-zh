    A career can be defined as skills, education, and the experience a person has.
    Planning your career will help you use your strengths effectively, help you move
    in the right direction and it will also build your confidence. Don’t be afraid
    to think big then break down your goals into smaller milestones. Have a 10-year
    plan, a 5-year plan, and an annual plan. Review your plans frequently and change
    them accordingly. Remember flexibility and adaptability are key.


    ## Building a Career

    Building a career can be a very tricky thing. You will need to read many books,
    watch many videos and get a mentor. Getting someone who has built a successful
    career to mentor you can help you solve most of the problems that you will experience
    just by simply giving you a different perspective.


    Set SMART goals and have a vision of where you want to see yourself in the future.
    This should include your strengths, weaknesses, opportunities, and threats. Beware
    of careers that will disappear in the near future. Always take action so that
    you will not miss your opportunity. Be responsible, set your standards, and build
    a strong resume.


    Your `CV` is your brand, make sure you give it a good design, maintain it, and
    market it very well. When you send out your `CV` to companies, you are actually
    marketing your brand. Learn marketing skills and market your `CV` continuously.
    Networking is another way to market your brand. Networking will also help you
    surround yourself with successful people which will change your perspective for
    the better. You are the average of the people you surround yourself with so choose
    wisely.


    ## Tips for writing a good career goal

    Make sure you dream big and set your standards high when setting your goals. Look
    for a career were you will have competitive advantage. This means a career that
    you already have skills for. Even if you do not have work experience, everyone
    has a skill that they are good at. That skill is your competitive advantage.


    Remember, it can help to choose a career that you have an interest in. This means
    out of all the skills you have, which one interests you the most but always keep
    in mind the job demand and job growth. Make sure you keep studying until the day
    you die. If you are not registered with any institution and studying, you are
    making a mistake. Never stop studying. This will help you keep growing in your
    career, it will help you grow fast, and it will keep your salary growing. 10%
    of your salary should go to your studies. I will write a book about finance which
    will explain where the rest of your money should go.


    ## Jobs

    The medical field will always be in need. Dentists, Physicians, Orthodontists,
    Nurse Practitioners, and Physicians make very good money. Information is one of
    the most important resources in life. Education is a business of selling information.
    Therefore, jobs in the education field will always be available.


    Information technology is growing very fast. This makes software developers and
    data specialists jobs to be high in demand and they are well paid. Statisticians
    work mostly in the data analytics field which is growing very fast due to rapid
    growth in IT. In my next book, I will discuss careers in the `IT` field and data
    analytics. Technology is changing the job market causing some jobs to go extinct.
    This is because these jobs can be done more effectively and cheaper with the help
    of IT.


    ## How To Make Money

    Job hunting, Employment, Salary, Money Management, Business, Profit, Growth, Success,
    Wealth... Getting a job is the easiest way to make money.


    ### Steps For Effective Job Hunting

