    # How To Be A Good Leader


    - Practice personal growth.

    - Be a good team player.

    - Read every day.

    - Provide vision.

    - Improve organizational structure.

    - Set clear communication protocols.

    - Delegate.

    - Learn conflict management strategies.

    - Coaching, mentoring and teaching.

    - Communicate honestly and openly.

    - Encourage people to read.

    - Develop a positive attitude.

    - Set clear goals and expectations.

    - Focus on results not the process.

    - Build Self-Confidence.

    - Answer questions.

    - Show people exactly what you want them to do.

    - Do not overwork people.

    - Lead by example.

    - Don''t get angry, just repeat what you said.


    ## How to be a good team player


    - Share information (ask and answer questions).

    - Focus on goals and results, not the process.

    - Be fair, positive, and supportive.

    - Appreciate the benefits of diversity.

    - Learn leadership skills.

    - Be organized.

    - Set clear goals.

    - Have strong core values.

    - Support risk-taking and change.

    - Set clear, defined roles for each team member.

    - Encourage diverse thinking.

    - Distribute the work evenly.

    - Focus on what is right. Don''t play favorites.


    ## Essential teamwork skills


    - Communication.

    - Conflict resolution.

    - Problem-solving.

    - Listening.

    - Critical thinking.

    - Collaboration.

    - Leadership.

    - Negotiation.


    ## How to Teach, Mentor and Coach


    - Encourage active learning.

    - Give constructive feedback.

    - Respect different talents and ways of learning.

    - Listen well and understand.

    - Be patient.

    - Read a lot of books.

    - Be nonjudgmental.

    - Be open to different opinions.

    - Give examples and perspective.

    - Answer questions.

    - Asking open-ended questions.

    - Learn emotional intelligence.


    ## Leadership And Management Styles


    - Autocratic leadership.

    - Authoritative leadership.

    - Pacesetting leadership.

    - Affiliative leadership.

    - Laissez-faire or free-rein leadership.

    - Participative leadership.

    - Delegative leadership.

    - Transactional leadership.

    - Transformational leadership.

    - Bureaucratic leadership.

    - Charismatic leadership.

    - Coaching leadership.

    - Democratic leadership.

    - Collaborative leadership.

    - Commanding leasdership.

    - Visionary leadership.


    ## Essential Leadership Qualities


    - Self-development.

    - Team development.

    - Ethical practice and good gorvernance.

    - Innovation.

    - Communication.

    - Vision.

    - Empathy.

    - Accountability.

    - Gratitude.

    - Compassion.

    - Confidence.

    - Decision making.

    - Integrity.

    - Humility.

    - Resilience.

    - Influence.

    - Positivity.

    - Inspiration.

    - Strategic & critical thinking.

    - Open-mindedness & creativity.

    - Flexibility.

    - Dependability.

    - Truthfulness.

    - Loyalty.

    - Impression management.

    - Assertiveness.

    - Listening.

    - Giving feedback.

    - Time management.

    - Planning and implementation.

    - Organizing and delegation.

    - Motivation.

    - Intelligence.

    - Relevant knowledge.


    ## Management Time, Technology, Management, Productivity, Growth, Success, Wealth...


    Leadership makes people feel better, management solves the problem. You need both
    skills.


    Success is the ability to continuously achieve the best results in all areas of
    your life. Success leads to wealth. Success comes from continuous growth and growth
    is brought by information. To get information you need five main resources: time,
    money, energy, technology and people. Everyone has these five resources no matter
    how little or how many. Quantity does not matter, what matters is how you use
    these resources to achieve success.


    To use these five resources successfully you need two skills: Management and leadership
    skills. Leadership skills help you deal with people effectively and efficiently
    so that you can get all the information you want from people. Management skills
    help you use the other four resources (time, money, energy and technology) effectively
    and efficiently so that you can get all the information you want from these other
    four resources.


    ### Management


    Managing your resources means planning, organizing, designing and controlling
    your resources (time, money, energy and technology). Planning includes setting
    objectives and deciding on the strategy that will be used to achieve them. Organizing
    includes arranging your resources (time, money, energy and technology) to achieve
    the objectives.


    Set up a strategic intent. Strategic intent is what you plan to achieve in the
    future to get to your fundamental purpose. Vision, mission and value statements
    are the tools used to set out the strategic intent. Your vision explains what
    you want to become. Your mission statement explains what you should be now in
    order to become how you want to be in the future, it explains how you will make
    a difference in your life. Values are the way you must behave to support the vision
    and mission. Objectives are actions to be done to deliver the mission and vision.
    You must develop a strategic vision, set objectives, design a strategy to achieve
    the objectives, implement and execute the chosen strategy and evaluate performance
    and initiating corrective adjustments.


    #### Four key responsibilities of management

    - Planning

    - Organising

    - Designing

    - Control


    #### Rules of Management

    - Clarify your goals and share your vision.

    - Create a road map for people to follow.

    - Teach and lead by example.

    - Teach and delegate.

    - Help people solve problems.

    - Spend most of your time planning.

    - Be consistent.

    - Be transparent.

    - Acknowledge all opinions and ideas.

    - Deal with each person differently.


    ## Power Influence, Leadership, Management, People, Information and Success...


    Power comes with huge responsibility. Power is the ability to act and have influence
    over others either in a polite way or in an aggressive manner. You can influence
    people in a polite manner by being a good leader. Good leaders read and grow everyday.
    Bad leaders are aggresive and forceful usually because of management status.


    Influencing people and having power over people is a very challenging task because
    people have emotions and if they are treated badly, they will retaliate. Genuine
    power and influence come from learning people’s emotions, mastering the art of
    communication and working extra hard to understand different perspectives that
    people have. To be able to influence people, you have to be good at satisfying
    people’s needs. People usually listen if they get value from you, therefore, if
    you help people with their needs then you are adding value to their lives and
    thus you are able to influence them. For you to influence and have power over
    people, you have to have something they need. Something that adds value to their
    lives. You don''t have power if people want nothing from you. Some of the things
    that people need in life are money, time and information. If you can offer people
    these resources then you can influence people. That''s because these resources
    are the components of success and everyone wants to be successful.


    #### Principles of Power

    - Always have money put aside and ready to be used.

    - Read more than everyone you know.

    - Talk less and think more.

    - Do not show emotions.

    - Use money to buy time.

    - Trust no one.

    - Improve your time management skills.

    - Calculate everything.

    - Don’t try to impress people, focus on what is right.

    - Exercise every day.

