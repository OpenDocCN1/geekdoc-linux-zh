    # 如何使用 80/20 原则


    对于你生活中想要实现的每一个目标，你都必须选择一种有助于你实现该目标的生活方式。如果你想成功，你每年至少要读 `12` 本书。如果你想富有，你必须工作 `80%`
    的时间，这意味着你所做的一切就是吃、睡觉、工作，并且每月只休息一天去娱乐。这是 `80/20` 原则的实际应用，将引导你走向成功。


    人们渴望成功，但他们不想工作 `80%` 的时间。这是不可能的。有些人想欺骗成功，，他们认为自己很聪明，认为他们现在努力工作，等有钱了就停止努力。事实并非如此。如果你很富有但工作时间少于
    `80%`，那意味着你正在走下坡路，给点时间，你很快就会变得贫穷。人类被创造是为了在 `20%` 的时间里娱乐，`80%` 的时间里工作。每月休息一天去娱乐，其他时间则应对生活中的不确定性，前提是你确实计算出了一个月月中
    `80%` 的天数。


    ## 富人的生活方式


    每月娱乐一天是富人的生活方式。你要明白，富人享受工作。如果你不喜欢工作，那么你就需要改变这种态度。你必须喜欢工作才能富有。你不必喜欢你的工作，但你必须喜欢工作。你必须喜欢成长。你必须喜欢富有效率。如果你工作时间少于
    `50%`，你将会贫穷。如果你工作 `50%` 的时间，你将过光光族。如果你工作 `60%` 的时间，你会成为中产阶级。如果你工作 `80%` 的时间，你会富有。如果你工作
    `90%` 的时间，你会非常富有。


    ## 生活方式、改变与成功


    “生活方式”一词定义了人们的行为、感兴趣的事以及他们的信仰。它是你生活的方式，包括爱好的选择、文化兴趣、穿衣风格、朋友，以及最重要的是你把时间花在了哪里。你在闲暇时间的活动定义了你的生活方式。如果你在闲暇时阅读，那么可以说你拥有富人的心态。你必须根据想要实现的目标调整你的生活方式。如果你想减肥，必须减少进食并保持活跃。走楼梯而不是坐电梯，或者把停在离目的地更远的地方然后走过去。


    ## 奢华、生活方式与成功


    奢华的生活方式是大多数人的动力。有足够的钱花在不需要的东西上，这一切都是为了“娱乐”的名义，从现场安保到游泳池、桑拿房和豪车。奢华的生活方式让你享受金钱。金钱是一个很好的动力，被金钱驱动也没有错。然而，大多数人害怕被金钱驱动，因为……嗯，我真的不知道为什么。金钱在惯俗上是所有资源的代表。这是我们共同达成的共识。全世界同意使用货币作为交换媒介，这意味着你可以用它来购买其他资源。既然如此，为什么人们还害怕被金钱驱动呢？这不符合逻辑。对奢华生活方式的需求提供了动力，而动力催生了成功。


    ## 坏的生活方式


    坏的生活方式与运动不足、饮食不健康和滥用药物（吸烟、喝酒、服用止痛药等）有关。人们面临的大多数健康问题都直接或间接地与他们的生活方式有关。这包括疾病、残疾甚至死亡。你可以通过改变你所控制的事物来改变生活方式，例如改变饮食或日常作息。照顾健康对塑造你的生活方式起着巨大作用，包括注意饮食、休息、锻炼、阅读以及避免使用酒精、药物和烟草。与坏生活方式相关的疾病包括动脉粥样硬化、心脏病、中风、肥胖、糖尿病等。这些疾病与吸烟、喝酒、吸毒以及我们食用的垃圾食品有关。良好的生活方式有助于预防这些不必要的问题。不要因为医生这么说就去做，要因为你想成功。医疗问题是昂贵的，它们会分散你的注意力并消耗你的精力，让你难以专注于成功。


    ## 健康、生活方式与成功


    良好的生活方式为你提供能量并帮助你专注于目标。成功与富有效率的生活方式相关。过富有效率的生活意味着你选择有助于提高效率的活动，例如健康饮食、适度饮酒、阅读、每日管理财务等。选择成为那个喜欢富有效率的人。选择工作
    `80%` 的时间。选择成功。


    ### 使用 80/20 原则优先排序

    * 列出你所有的日常任务。

    * 识别出三个回报更高的任务。

    * 完成这三项关键任务，并将其余授权。


    ## 积极思考


    问题、心态、解决方案、成长、成功、财富……一切始于头脑。积极思考是在任何情况下都关注良好事物的习惯，这对你的生理和心理健康有巨大影响。这简单意味着你在面对生活中的好与坏时，预期事情最终会向好发展，这种思考通常会导致成功，因为它增强了你的信心并让你保持冷静，使你能够轻松地解决问题。要保持冷静并积极思考，你必须了解生活中的万事是如何联系的，以及如何从任何起点走向成功。

    '
