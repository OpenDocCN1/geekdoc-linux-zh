    - Decision Tree Analysis.

    - Bow-tie Analysis.

    - Probability/consequence.


    ## Risk Assessment

    A risk assessment is an important part of risk management. It is a visual representation
    of risk analysis and presents the risks as a graph, rating risk by category. It
    is used to show the probability of risk, the severity, and how frequently the
    risk occurs.


    ## Risk Classification

