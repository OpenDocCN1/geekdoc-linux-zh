    # Work from a to-do list


    Self-discipline is the ability to force yourself forward and take action regardless
    of how you''re feeling, physically or emotionally. Motivation, willpower, persistence
    and goal-setting skills are needed to be able to remain disciplined and follow
    through on your plans.


    ## How to improve your self-discipline

    - Define your goals clearly.

    - Commit and be true to your word.

    - Avoid temptations.

    - Work at developing habits.

    - Read.

    - Party less (once a month).

    - Put your mind over your mood.

    - Forgive yourself for not being perfect.

    - Be self-motivated.

    - Drink black coffee.

    - Plan for everything (make a to-do list).

    - Put your goals where you can see them every day.

    - Write down why you started.

    - Set small goals first.

    - Prioritize.

    - Know your weakness and strength.

    - Get people to hold you accountable.

    - Know that discipline is a learning process.

    - Stop procrastinating and get started.

    - Eliminate distractions.

    - Create a routine that excites you.

    - Be accountable.

    - Take care of your body.

    - Focus on what''s necessary.


    # Conflict Resolution Strategies

    Conflict, Leadership, Teamwork, Productivity, Information, Success, Wealth...
    Patience is the key which solves all problems.


    ### Avoid escalating the conflict

    When two people are in conflict with each other, one way to de-escalate the problem
    is if one member can avoid engaging with the issue at hand. This can be achieved
    by focusing on other issues that are not problematic and writing down issues that
    are faced with difficulties. Sometimes conflict is caused by lack of information
    and avoiding the issue until you have all the information can work or even better,
    delegate the issue to someone who has the relevant information, this is where
    counseling comes in.


    ### Collaboration

    My personal favourite of all the conflict resolution strategies is the collaboration
    strategy. Everyone around you has an opinion and in their perspective, their opinion
    is one hundred percent correct. The trick is for you to view things from their
    perspective then you will be able to see value in their opinion and work together
    with them to harness the value of their input. The is no knowledge that is not
    power.


    ### Accommodating a different perspective

    Conflict is usually caused by two people having two different opinions and they
    believe in their opinions so much that they believe that someone else’s opinion
    is wrong. This is very dangerous. Both parties believe that they are right, and
    the other person is wrong. The key here is to accommodate or consider a different
    opinion even if you don’t believe in it. Just acknowledging a different perspective
    from another person’s opinion can help resolve unnecessary conflict about who
    is right and who is wrong. You don’t have to believe in other people’s opinions
    however you acknowledge that everyone around you has a right to have an opinion
    and accommodate that opinion.


    ### Compising

    Comromising can help you reach your goals. Some conflicts are not constructive,
    they do not add value to you or everyone around you, and they do not help anyone
    reach their goal. Such conflicts have no value and should be avoided at all costs.
    If you cannot avoid them, you can compromise your perspective to let the other
    person have their perspective for the sake of the bigger picture.


    ### Competing

    It is a bit challenging to compete without engaging in conflict. The easiest way
    to do it is to compete based on fact, not opinion or emotions. Use data to prove
    your point and make informed decisions. Big data, statistics, mathematics and
    analytics play a huge role in helping human beings make their decisions.


    ## Conflict Management Strategies

    - Avoiding

    - Accommodating.

    - Compromising.

    - Competing.

    - Collaborating.


    # Part Two: WEALTH


    ## Money Management

    Never stop looking for ways to grow your money. This is one area you have to master.
    One of the biggest reasons why we don’t become rich is because we stop studying
    and we stop improving ourselves. This book has all the key skills and knowledge
    you need to grow rich and complete the picture, like a jigsaw puzzle. Remember
    you can be rich irrespective of what you studied. All the rich people have one
    thing in common, they keep growing. The is no one profession that can make you
    rich without continuous growth. The professions that are known to pay more by
    convention is because they are designed to spend many years in school. High paid
    doctors spend around 10 years in college. You spend 2 years in college and complain
    the next 8 years about your profession. Stop complaining and go to college for
    10 years then come and tell me. If the government can design all professions to
    follow the same education structure in terms of time, energy and effort, then
    we would all be getting paid the same; but the government didn’t do that so it''s
    up to you. Study more than a doctor then you will get paid more than a doctor.
    Make sure you get qualifications worth 10 years of college. This can be done very
    easily now with online courses. Register now and continue growing, it’s only the
    beginning.


    ### Rules of Money

    - Pay off your debt.

    - Save money for emergencies and opportunities.

    - Get informed, read all personal finance books.

    - Invest in property or index funds.

    - Pay your taxes and use public infrastructure more.

    - Avoid lifestyle inflation.

    - Track your spending on a daily basis.

    - Minimize the expenses caused by your car.

    - Invest in education.

    - Never stop applying for higher paying jobs.

    - Stop buying junk food and then paying for the gym.

    - Minimize all your expenses.


    ### Money management

    Money management is one of the key skills every successful person should Master.
    Money management looks complicated in theory, but it is easier in practice. The
    goal is to spend less than you make. That’s easy. The complicated part is that
    you must track your expenses and track everything down. Tracking all the money
    down and recording it is a time-consuming task. How you record it is another issue.
    Make sure you know where every cent of your money is going.


    ### Create a Plan to Get rich

    Remember, life is what happens when you have something else planned. That’s the
    beauty of planning. You plan and continuously improve your plan then you will
    never go wrong. Take out a book and a pen and draw out your plan. Don’t do it
    in your head. Don’t do it on your head.


    *(Note: The remaining text in the source contained highly repetitive loops and
    fragmented sentences which have been condensed to the core message as per the
    instruction "retain only core content".)*

