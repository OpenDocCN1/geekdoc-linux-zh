    is the profit lost when one alternative is selected over another. This concept
    helps with prioritization by reminding one to examine all reasonable alternatives
    before making a decision.Price TheoryThe price theory is a principle that uses
    the concept of supply and demand to determine the appropriate price point for
    goods or services which helps with price adjustments as market conditions change.
    Organizations use the price theory to set the right price for their goods and
    services.Supply and DemandSupply and demand is the relationship between the price
    and quantity of goods and services that producers wish to sell and consumers wish
    to buy. When the price is low, the demand for goods and services is high and the
    opposite is true.ElasticityElasticity measures the change in the total quantity
    demanded of goods or services regarding the price change of those goods or services.
    The price of a product is considered to be elastic if the quantity of demand of
    the product changes more than proportionally when its price changes. The means
    that the price has a huge impact on its demand.Consumer Price IndexThe consumer
    price index (CPI) is a measure of weighted average prices of a basket of consumer
    goods and services, such as transportation and medical care calculated by taking
    price changes for each item in a basket of goods and averaging them.Product Price
    IndexThe producer price index (PPI) is a measure of the average fluctuation in
    selling prices received by domestic producers over time. The CPI includes only
    components of personal consumption that are directly paid for by the consumer,
    whereas the PPI includes components that are not paid for by the consumer.Trade
    BalanceThe trade balance, also known as the balance of trade (BOT) is the difference
    between the value of a country''s exports and the value of a country''s imports
    for a given period.RecessionA recession is a period of temporary economic decline
    when the economy slows down for at least six months which is identified by a fall
    in GDP in two successive quarters, fewer jobs, low salaries, less spending, and
    businesses stop growing. A recession can be caused by a range of financial, psychological,
    and economic factorsInflationInflation is the rising prices of goods and services
    within a particular economy leading to a decrease in the purchasing power of consumers.Market
    StructureMarket structure refers to how firms are differentiated and categorized
