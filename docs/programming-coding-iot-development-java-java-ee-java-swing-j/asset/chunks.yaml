    # 如何成为优秀的领导者


    - 实践个人成长。

    - 成为良好的团队伙伴。

    - 每天阅读。

    - 提供愿景。

    - 优化组织结构。

    - 设置明确的沟通协议。

    - 授权。

    - 学习冲突管理策略。

    - 教练、指导与教学。

    - 诚实且开放地沟通。

    - 鼓励人们阅读。

    - 培养积极的态度。

    - 设置明确的目标和期望。

    - 关注结果而非过程。

    - 建立自信。

    - 回答问题。

    - 准确地告诉人们你想让他们做什么。

    - 不要让人过度工作。

    - 以身作则。

    - 不要生气，只需重复你说过的话。


    ## 如何成为良好的团队伙伴


    - 分享信息（询问并回答问题）。

    - 关注目标和结果，而不是过程。

    - 公平、积极且给予支持。

    - 欣赏多样性的好处。

    - 学习领导力技能。

    - 保持条理。

    - 设定明确的目标。

    - 拥有强大的价值观。

    - 支持承担风险和改变。

    - 为每个团队成员设定明确、具体的角色。

    - 鼓励多样化思维。

    - 公均匀分配工作。

    - 关注正确的事。不要偏袒。


    ## 核心团队合作技能


    - 沟通。

    - 冲突解决。

    - 问题解决。

    - 倾听。

    - 批判性思维。

    - 协作。

    - 领导力。

    - 谈判。


    ## 如何教学、指导和教练


    - 鼓励主动学习。

    - 给出建设性反馈。

    - 尊重不同的天赋和学习方式。

    - 善于倾听并理解。

    - 保持耐心。

    - 多读书。

    - 不作判断。

    - 对不同意见保持开放。

    - 给出示例和观点。

    - 回答问题。

    - 提出开放式问题。

    - 学习情绪智能。


    ## 领导力与管理风格


    - 专制型领导。

    - 权威型领导。

    - 标杆型领导。

    - 亲和型领导。

    - 放任式（或自由放式）领导。

    - 参与型领导。

    - 授权型领导。

    - 交易型领导。

    - 变革型领导。

    - 官僚型领导。

    - 魅力型领导。

    - 教练型领导。

    - 民主型领导。

    - 协作型领导。

    - 指令型领导。

    - 愿景型领导。


    ## 核心领导特质


    - 自我发展。

    - 团队发展。

    - 伦理实践与良好治理。

    - 创新。

    - 沟通。

    - 愿景。

    - 共情心。

    - 责任感。

    - 感恩。

    - 慈悲。

    - 信心。

    - 决策能力。

    - 诚信。

    - 谦虚。

    - 韧性。

    - 影响力。

    - 积极。

    - 启发。

    - 战略与批判性思维。

    - 开放心态与创造力。

    - 灵活。

    - 可信赖。

    - 诚实。

    - 忠诚。

    - 印象管理。

    - 果断力。

    - 倾听。

    - 给予反馈。

    - 时间管理。

    - 规划与执行。

    - 组织与授权。

    - 激励。

    - 智慧。

    - 相关知识。


    ## 时间、技术、管理、生产力、增长、成功、财富……


    领导力让人感觉更好，而管理解决问题。你这两项技能都需要。


    成功是在个人生活的各个领域持续获得最佳结果的能力。成功带来财富。成功来自持续的增长，而增长由信息带来。为了获取信息，你需要五种主要资源：时间、金、能量、技术和人。无论多少，每个人都有这五种资源。数量并不重要，重要的是你如何利用这些资源来实现成功。


    要成功使用这五种资源，你需要两种技能：管理和领导力。领导力技能帮助你有效高效地处理人际关系，以便从人们那里获得想要的所有信息。管理技能帮助你有效高效地利用其他四种资源（时间、金、能量和技术），以便从这其他四种资源中获得想要的所有信息。


    ### 管理


    管理资源意味着规划、组织、设计和控制你的资源（时间、金、能量和技术）。规划包括设定目标并决定用于实现目标的策略。组织包括安排你的资源（时间、金、能量和技术）以实现目标。


    建立战略意图。战略意图是你计划在未来实现的以达到根本目的的内容。愿景、使命和价值观声明是用于设定战略意图的工具。你的愿景解释了你想成为什么。你的使命声明解释了为了成为未来想成为的样子，现在应该是什么，它解释了你将如何为生活带来改变。价值观是你为了支持愿景和使命必须遵循的行为。目标是为了实现使命和愿景而必须采取的。你必须制定战略愿景，设定目标，设计实现目标的策略，实施并执行所选策略，评估绩效并启动纠正调整。


    ####管理的四项核心职责

    - 规划

    - 组织

    - 设计

    - 控制


    #### 管理规则

    - 明确你的目标并分享你的愿景。

    - 为人们创建一个路线图。

    - 教学并以身作则。

    - 教学并授权。

    - 帮助人们解决问题。

    - 将大部分时间花在规划上。

    - 保持一致。

    - 保持透明。

    - 认可所有的意见和想法。

    - 对每个人区别对待。


    ## 权力影响力、领导力、管理、人、信息与成功……


    权力意味着巨大的责任。权力是行动以及对他产生影响的能力，无论是通过礼貌的方式还是侵略的方式。你可以通过成为一名优秀的领导者以礼貌的方式影响他人。优秀的领导者每天阅读并成长。糟糕的领导者通常由于管理地位而具有侵略性。


    影响他人并掌控他人是一项非常有挑战的任务，因为人有情感，如果被对待不好，他们会报复。真正的权影响源于学习人们的情绪、掌握沟通艺术并努力理解人们不同的观点。要影响他人，你必须擅长满足人们的需求。如果人们从你那里获得价值，他们通常会倾听，因此，如果你帮助他们解决需求，你就为他们的生活增加了价值，从而能够影响他们。要让你掌控他人，你必须拥有他们需要的东西。如果人们对你没有任何需求，你就没有权力。人们在生活中需要的一些东西是金钱、时间和信息。如果你能为人们提供这些资源，你就可以影响他们。因为这些资源是成功的要素，每个人都想成功。


    #### 权力的原则

    - 始终留出可用的金钱。

    - 比你认识的所有人都要读得多。

    - 少说多想。

    - 不要暴露。

    - 用钱买时间。

    - 不要信任任何人。

    - 提高你的时间管理技能。

    - 计算一切。

    - 不要试图给别人留下印象，关注正确的事。

    - 每天锻炼。


    '
