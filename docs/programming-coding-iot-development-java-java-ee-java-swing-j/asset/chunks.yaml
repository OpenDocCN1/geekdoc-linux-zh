    ## Stress, Anxiety & Anger Management

    Challenges, Stress, Anger, Emotional Intelligence, Calm, Growth, Success, Wealth...
    Keep calm. Stress is a normal reaction the body gets when changes occur or when
    you are feeling pressured resulting in physical and emotional responses. Stress
    is usually triggered by things happening in your life such as being under lots
    of pressure, facing big changes, or worrying about something. Your heart pounds
    faster, muscles tighten, blood pressure rises, breath quickens, and your senses
    become sharper. These physical changes prepare you to either fight or flee from
    the pressure you are experiencing. Stress management training can help you deal
    with things healthily.


    ## Causes of Stress

    - Death of a loved one.

    - Divorce.

    - Job loss.

    - Increase in financial obligations.

    - Getting married.

    - Moving to a new home.

    - Chronic illness or injury.

    - Emotional problems.

    - Financial problems.

    - Work.

    - Personal relationships.

    - Parenting.

    - Business startup.


