    "card" meaning visual cards.Kanban methodologies are continuous and more fluid,
    whereas scrum is based on short and structured work sprints. Kanban is aimed at
    optimizing the production flow by regulating the supply of raw material and delivering
    what the process needs exactly when it needs it. It controls inventory by pulling
    supplies to the production floor based on customer demand and limits the number
    of work items that can exist in the production process at any given step at any
    given time. It is usually used in just-in-time (JIT) manufacturing processes.
    One of the first principles of Kanban is to make small incremental changes to
    existing processes instead of drastic changes that might lead to a high risk of
    failure.Kanban is designed to reduce the idle time in a production process by
    visualizing the production process and the actual work passing through that process
    to identify potential bottlenecks in the process and fix them so work can flow
    through it cost-effectively at an optimal speed or throughput.Rules Of Kanban•
    Never pass defective products.• Use only what''s needed.• Produce only the quantity
