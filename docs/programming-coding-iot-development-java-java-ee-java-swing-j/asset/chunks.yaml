    # Depression

    Challenges, Treatment, Focus, Productivity, Growth... Health is wealth. Depression
    is a mood disorder that causes a persistent feeling of sadness and loss of interest
    which affects how you think and behave. It is a serious illness that can interfere
    with a person''s life and cause long-lasting sadness, hopelessness, changes in
    appetite, weight changes, and sleeping too much.


    ## Causes of Depression

    There are many possible causes of depression such as faulty mood regulation by
    the brain, genetic vulnerability, medications, medical problems, stressful life
    events such as:

    - Family death.

    - Divorce.

    - Illness.

    - Redundancy.

    - Job or money worries.


    Depression causes the amygdala in your brain to enlarge. This is a part of the
    brain associated with emotional responses. When it becomes larger and more active,
    it causes sleep disturbances, changes in activity levels, and changes in hormones.


    ## Causes of Depression (list)

    - Abuse.

    - Aging.

    - Certain medications.

    - Conflict.

    - Death or loss.

    - Genes.

    - Major life events.


    ## Signs of Mental Illness

    - Excessive paranoia or anxiety.

    - Long-lasting sadness or irritability.

    - Extreme mood changes.

    - Social withdrawal.

    - Drastic changes in eating or sleeping habits.


    ## Depression Medication

