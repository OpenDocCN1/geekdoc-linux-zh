    \ version of the primary text.\n\n[content]\n# Marketing Plan\n\n## Target Market\n\
    A target market is a group of consumers at which a product or service is aimed.\
    \ Identifying the target market is an essential step for any company in the development\
    \ of a marketing plan. Racpro’s target market will include up middle-class professionals\
    \ who have a stable income, live a busy life and require a convenient and modern\
    \ place to live. This will include small families that can buy the 3 bedroom apartments,\
    \ investors who can buy and rent the apartments and single professionals or couples\
    \ who just want a place to live. Racpro will also target real estate investors\
    \ that buy properties at a discount pre-launch and then sell them at a high price\
    \ after the development is complete to make a profit.\n\n## Product\nA product\
    \ is a tangible item that is put on the market for acquisition, attention, or\
    \ consumption. Racpro’s products are newly built, high-quality, modern apartments\
    \ which offer the following:\n* Prepaid meters for electricity and water.\n* 24-hour\
    \ security with biometric access.\n* Fiber and DStv ready.\n* A modern lifestyle\
    \ center.\n* Free eco-friendly appliances.\n* 1, 2 and 3-bedroom apartments.\n\
    * Close to shopping centers, schools, medical...\n* Lifestyle center with free\
    \ wi-fi.\n* Concierge.\n* Laundromat.\n* Training science gym with a trainer.\n\
    * Outdoor fitness area.\n* Squash court.\n* Littlehill Montessori school.\n\n\
    ## Price\nPrice is defined as the amount of money expected, required, or given\
    \ in payment for something. An appropriate price for the product can be determined\
    \ through market research.\n\n### Racpro’s Apartment Prices\n* 1 Bed, 1 Bath From\
    \ R 939 900\n* 2 Bed, 2 Bath From R 1 419 900\n* 3 Bed, 2 Bath From R 1 838 155\n\
    * No Bond And Transfer Costs\n\n## Place\nThe apartments will be located in the\
    \ heart of Johannesburg close to the following:\n* Farmers’ Market\n* Greenstone\
    \ Mall\n* Stoneridge shopping center\n* Flamingo Shopping Centre (Now Open)\n\
    * Mall of Africa\n* Super seedlings garden center\n* Linbro business park\n* Longmeadow\
    \ business estate\n* Sandton city\n* Melrose Arch\n\n## Promotion\nPromotion is\
    \ defined as the publicizing of a product or service to increase sales or public\
    \ awareness. An important factor in the development of the business is an effective\
    \ and creative marketing and promotion of the product. To be performed effectively\
    \ the marketing and promotion require a coordinated and structured approach. Racpro\
    \ will embark on a dynamic marketing campaign utilizing social media as an effective\
    \ means of promotion. The Internet will be used as a primary source of advertising\
    \ and promotion.\n\n## SWOT Analysis\nA SWOT analysis is a study undertaken by\
    \ an organization to identify its internal strengths and weaknesses, as well as\
    \ its external opportunities and threats.\n\n### Strength\nA strength is a good\
    \ or beneficial quality or attribute of a person or thing.\n* Urbanization and\
    \ growing middle-class.\n* Few competitors due to high startup costs.\n* Building\
    \ modern apartments with lifestyle centers.\n\n### Opportunity\nOpportunities\
    \ refer to favourable external factors that could give an organization a competitive\
    \ advantage.\n* Acquire more land.\n* Huge potential for market share.\n* Expand\
    \ into another urban metro.\n* Build partnerships with other property companies.\n\
    * Development of government-owned land.\n* Grow black economic empowerment, become\
    \ diversified and get the benefits.\n\n### THREATS\nThreats refer to factors that\
    \ have the potential to harm an organization.\n* Financial depression due to Covid19.\n\
    * Corrupt government can scare away investors.\n* Loss of key staff due to Covid19\
    \ impact.\n* Increase in unemployment decreases demand.\n* Changes in property\
    \ tax legislation.\n\n### WEAKNESSES\nWeakness is defined as a disadvantage or\
    \ fault.\n* Huge startup cost.\n* Huge risks.\n* Regional business (covering Gauteng\
    \ only).\n\n## Competitive Analysis\nA competitive analysis is an assessment of\
    \ the strengths and weaknesses of current and potential competitors. This analysis\
    \ provides both an offensive and defensive strategic context to identify opportunities\
    \ and threats (Czinkota & Ronkainen, 2010). Key differentiators in Racpro’s build-to-sell\
    \ model comprise the ability to deliver a superior offering through economies\
    \ of scale and create lifestyle centers within the complex. Other real estate\
    \ developers do not offer huge lifestyle centers like Racpro where property owners\
    \ can have family time and have enough fun activities to do within the complex.\
    \ Racpro will build lifestyle centers within the complex which will have free\
    \ wi-fi, concierge service, heated swimming pools, playgrounds, spa, restaurant,\
    \ gym, squash court, action sports fields and running tracks. This will ensure\
    \ that children and parents have fun within the complex without the need to go\
    \ out thus saving money, time, energy and effort. Racpro will also develop partnerships\
    \ with relevant stakeholders and competitive pricing of developed units in-line\
    \ or below market.\n\n## Marketing And Sales Plan\nSales and marketing is performed\
    \ in-house (no external estate agents). Sales and marketing marketing will include\
    \ the following tasks:\n* Showing unit interior design.\n* Creating brochures,\
    \ pamphlets and newspaper ads.\n* Racpro provides in-house bond origination services\
    \ to its customers.\n* The company has agreements with all major South African\
    \ banks, and acts as a broker in the bond origination process.\n* Commissions\
    \ are earned by the Company through this process.\n\n## Corporate Social Responsibility\n\
    Racpro is fully committed to the principles of good corporate and socially responsible\
    \ practice. These principles are reflected in Racpro’s approach and focus on supplier\
    \ development, specifically the development of its sub-contractors and their employees.\
    \ Racpro is committed to the development of its staff through company training\
    \ programs, as well as on-the-job training and it is focused on the development\
    \ of previously disadvantaged individuals within its employment. Racpro participates\
    \ in various initiatives within the communities where Racpro operates, including\
    \ an annual charity event to benefit various foundations and non-government organizations.\n\
    \n## Operations Plan\n\n## Long Term Objective\nLong-term objectives are specific\
    \ results that an organization seeks to achieve in perusing its basic mission.\
    \ Long-term objectives represent the results expected from perusing certain strategies.\
    \ Racpro aims to address the need of South Africans to get secure, high quality,\
    \ newly developed, value-for-money, convenient houses without the homeowner having\
    \ to involve themselves in the cumbersome day-to-day management of building their\
    \ dream home. Racpro will cater to the large section of South Africa’s population\
    \ that cannot afford the high-income lifestyle estate living but desire to achieve\
    \ the same level of convenience, security and amenities within the R599,999 –\
    \ R1,699,999 price range by creating sectional title properties.\n\n### Strategic\
    \ objectives for the next five years\n* Offer pre-launch sales at discount.\n\
    * Launch the development.\n* Acquire land and build a showroom.\n* Start building,\
    \ selling & conduct property viewings.\n* Retain some development stock as rental\
    \ portfolio.\n* Partner with other property companies.\n* Support and grow black\
    \ economic empowerment.\n\n## Industry Description\nIndustry description helps\
    \ a company to understand its position relative to other companies that produce\
    \ similar products or services like it which can help identify threats and opportunities\
    \ facing them. South Africa's residential property sector is growing due to urbanization\
    \ and strong demand for quality housing by the growing middle-income population.\
    \ Financial institutions are willing to extend mortgage bonds to homeowners to\
    \ acquire property. Properties situated in secure South African lifestyle estates\
    \ represent an estimated total value of R643 billion. Approximately 12% of South\
    \ Africa’s registered property comprises sectional-title units, with another 5.3%\
    \ representing estate developments. In the last 20 years, flats and townhouses\
    \ have made up 26% of.\n"
