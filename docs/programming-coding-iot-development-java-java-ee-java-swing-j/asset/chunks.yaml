    成功是一种算法。


    ## 成长

    要在生活中取得成功，你必须不断成长。成长意味着不断向你的大脑输入信息。信息可以来自许多资源，如书籍、视频、音频等。这就是为什么大多数成功人士读的书比任何人都都要多。要获取信息，你需要物质材料和人。要从物质中获取信息，你需要具备管理时间、技术和钱的能力。要从人获取信息，你需要具备激励、鼓励和与他人共情的能力。


    ## 信息

    没有什么知识不是力量。信息以不同的形式、形状和风格存在。你需要在特定的时刻拥有适合你的信息。你的大脑每秒都有不同的视角，这是因为你的大脑每秒都在通过你所有的感官收集信息，因此，如果你在一秒后获取信息，你一秒前收到的信息感知会有所不同。这就是为什么你必须不断学习和成长。这也解释了为什么没有什么知识不是力量，因为当你的视角改变后，无关的信息在一秒后可能变得相关。


    ## 管理技能

    为了能够处理时间、技术和钱，你需要技术技能，如规划、组织、设计和资源控制。这四项技能是关键的管理技能。如果你拥有卓越的管理技能，你将能够有效、高效地利用你的资源，从而获得能够让你取得成功的相关信息。


    ## 领导力

    为了能够激励、鼓励并与他人共情，你需要软技能，如沟通、倾听、正直、团队合作等。这被称为领导力。如果你能有效运用你的领导力，你就能从人们那里获得你想要的所有与成功相关的信息。一个领导者必须意识到人需要被激励，需要被鼓励，并且通过健康和福祉来获得能量。


    ## 金钱

    生活中的每个人都需要收入来源。我们需要钱来生存。我们需要钱购买食物、住所以及生活中所有必需品。最重要的是，我们需要钱来直接或间接地购买信息。这就是为什么生活中的大多数人会工作或创业。找工作、赚钱和致富将在下详细说明。


    ## 技术

    技术是赋予人类获取信息巨大竞争优势的最大物质材料之一。这就是为什么信息技术正在改变世界，这也是为什么第四次工业革命实际上是信息技术。能够让你接近信息的技术才是值得保留的技术。


    ## 人

    大脑是人类非常复杂的器官。大脑存储着人类拥有的所有信息，为了让你能够获取这些信息，此人必须处于正确的情绪状态。要让一个人处于正确的情绪状态，他们所有的需求都需要得到照顾，包括健康、能量和被激励的需求。


    ## 成功原则

    -   自我教育。

    -   明智地选择职业。

    -   每五年投资一次。

    -   偿还坏债。

    -   避免生活膨胀。

    -   嫁对的人。

    -   不要考虑无用的事情。

    -   先计划后行动。

    -   失败是学习的机会。

    -   学习财财知识。

    -   管好自己的事。

    -   利用税收优势。

    -   永停止学习。

    -   机会永远在那里。

    -   思想和行动创造成功。

    -   成长，而非竞争。

    -   引导你的思维积极思考。

    -   为机会存钱。

    - 低于消费水平生活。

    -   每日追踪支出。

    -   主控自己的生活。

    -   不要指责，承担责任。

    -   眼放远大。

    - 设定 SMART 目标。

    - 接受变化。

    - 精通时间管理。

    -   与赢者在一起。

    -   照顾好你的健康。


    ## 领导力

    情绪智能、管理、生产力、信息、成长、成功、财富……


    领导力处理人，管理处理其他资源。领导力是确保每个人都能有效、高效地实现目标的能力。生活充满了让人们偏离计划并无法实现目标的问题。当问题出现时，就需要领导力和管理。领导力处理的是人而不是问题。管理处理的是问题而不是人。领导力在保持每个人专注、受激励并赋能以提高生产力方面发挥着巨大作用。领导力的目标是确保每个人都感到平静。领导者应该更多地关注人的福祉，而经理应该关注解决技术问题。


    ## 权威

    领导力不是为了解决技术问题，那是经理的工作。经理的工作是确保他们消除给人们生活带来压力的问题。领导者的工作是确保人们感到平静，因为他们知道经理正在解决问题并进行授权。这意味着领导者必须传达“问题正在解决”的信息，他们必须与人们共情，建立信任，如果问题没有解决，领导者将必须解决可能出现的冲突。经理应该制定一个计划来解决技术问题并分配任务。这意味着你应该知道何时充当领导者，何时充当经理。如果你混淆了两者，你就完蛋了。领导力和管理都是技能，意味着它们是可以学习的。读读书即可。


    ## 管理与领导力

    事情通常不会按照计划进行，当这种情况发生时，你需要有人介入并确保问题得到解决（经理），并确保人们保持专注不恐慌（领导者）。领导者必须给人们希望。这可以通过以身作则和设定一个大家共同关注的愿景来实现。设定要关注的目标有助于人们一直坚持下去，因为知道即使短期内出现问题，他们也有一个明确的目标要实现，人们会一直努力直到实现目标。

