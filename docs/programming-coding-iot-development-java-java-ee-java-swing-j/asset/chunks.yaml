    # 如何影响他人

    - 展现你的魅力（同理心）。

    - 倾听他人的。

    - 关注人们的需求。

    - 为他人的生活增值。

    - 非常擅长解决冲突。


    ## 谈判规则

    - 多听少说。

    - 运用沉默的力量。

    - 提问。

    - 保持公平。

    - 在谈判前明确你想要什么。

    - 目标是实现双赢谈判。

    - 学习冲突解决策略。

    - 做好准备。

    - 制定策略。

    - 保持简单。


    ## 批判性思维

    思考、计划、确定优先级……

    如果你不计划，你就是在计划失败 ——`本杰明·富兰林`。


    思考是一种处理信息、建立联系、做出决策和创造新想法的精神活动。思考也可以被看作是在脑中制定待办事项的过程。思考是迈成功的第一步。生活中要做的事情太多了，但只有
    20%%的事情会带来成功，因此每个人在行动之前都必须进行思考并相应地确定优先级。采取行动时，从那些带来成功的活动开始。每一个念头都必须写下来。这有助于显化、思维分析和计划。


    ### 批判性思维

    批判性思维是清晰、理性地遵循逻辑来决定该做什么或相信什么的能力。它是一种进行反思性思考的能力，理解观点之间的逻辑联系，并理解事物何地、如何、何时、什么以及为什么是现在这样。它是关于尽可能多提问，直到你获得所需的所有信息。信息引导增长，增长带来成功，成功带来财富。


    批判性思维有助于做出良好的决策。你必须能够权衡问题解决方案的优缺点。你必须查看所有可用数据，并根据提供的数据权衡优劣做出明智的决策。大数据之所以流行正是由于这个原因。经理可以使用大数据做出良好的决策。


    ### 制定待办列表

    你应该能够确定事情发生的什么、何时、为什么、何地以及如何。这被称为调度。不这样做会导致灾难，简单直接。把每一个细节都写下来。准备一份待办列表、一个任务日历和每个里程碑的检查清单。这将有助于任务显化、执行过程的可视化以及问题的分析。


    ### 风险管理

    你必须能够计划并管理可能出错的事情。生活中事情通常会出错，这是定数。这是因为与计划不同，生活是时间敏感的，像延迟交货这样简单的事情就可能导致巨大的灾难。你必须预判可能出错的地方，并计划在这种情况下怎么办。这就是风险管理包含的内容。


    ### 如何进行批判性思考

    - 重构信息。

    - 评估后果。

    - 提问。

    - 保持观察力。

    - 每天阅读。

    - 查看历史数据。

    - 研究。

    - 寻找事实、数字或科学。

    - 善于分析，拆解信息。


    ### 批判性思维过程

    - 观察

    - 调查

    - 分析

    - 解释

    - 评估

    - 反思


    ## 决策与问题解决

    问题、信息、决策、增长、成功与财富……

    失败是学习的机会。解决问题是定义问题、确定问题根源并寻找解决方案的行为。你解决的问题越多，你就变得越富有、越成功。


    ### 解决问题的过程

    - 描述问题。

    - 拆解问题。

    - 找到根源。

    - 研究并阅读直到直到找到解决方案。

    - 实施解决方案。

    - 衡量结果。


    ### 解决问题的技能

    - 积极倾听。

    - 批判性与创造性思维。

    - 研究与阅读。

    - 沟通。

    - 决策。

    - 团队合作。


    ### 决策

    决策是收集信息、评估后果并选择一个负面后果较少的选项的过程。优秀的决策者会选择能为所有人带来最佳结果的行动。他们在保持开放心态的同时进行研究、权衡后果并做出理性的决策。


    ### 决策过程

    - 识别替代方案。

    - 收集相关信息。

    - 权衡后果。

    - 选择。

    - 采取行动。

    - 审查你的决策。


    ### 创造性思维

    创造性思维是以新方式考虑某事的能力，例如对问题有新方法，或从数据集中获得新结果。这是一个你的大脑为问题产生新的、不寻常且有效的解决方案的过程。


    ### 如何培养创造性思维

    - 头脑风暴创意。

    - 重新定义问题。

    - 保持开放和灵活。

    - 使用你的想象力。


    ## 提高记忆的方法

    - 阅读书籍。

    - 尝试鱼油补充剂（`Omega 3`）。

    - 保持健康体重。

    - 少饮酒。

    - 运动。

    - 尝试冥想。

    - 喝咖啡。

    - 充足睡眠。

    - 少吃添加糖分。


    ## 技术技能

    - 编程/编码。

    - 软件熟练度。

    - 项目管理。

    - 数据分析。

    - 技术。

    - 写作。

    - 会计。

    - 工程学。

    - 医学。

    - 解决问题。


    ## 人际交往技能

    - 团队合作。

    - 沟通。

    - 职业道德。

    - 灵活性与适应能力。

    - 决策。

    - 时间管理。

    - 冲突解决。

    - 倾听。

    - 谈判。

    - 同理心。

    - 果断。

    - 教练、教学和指导。


    ## 公演演讲

    信息、自信、演讲、金钱、增长、成功、财富……

    练习，练习，练习。


    ### 公演演讲规则

    - 研究并了解关于你主题的一切。

    - 计划并准备你的演示稿。

    - 练习直到你感到自信。

    - 阅读关于你具体担忧的内容。

    - 视觉化你的成功。

    - 做一些深呼吸。

    - 专注于你的演讲，而不是观众。

    - 不要害怕短暂的沉默。

    - 注意你的肢体语言。

    - 演讲前喝杯水。

    - 演讲当天不要喝咖啡因。

    - 积极思考。

    - 观看你演讲的录像。

    - 保持简单。

    - 不要担心与观众的眼神交流。

    - 不要担心你的弱点。

    - 你不一定要讲故事。

    - 逻辑清晰地组织想法。

    - 练习带来自信。

    - 研究主题直到你充满热情。

    - 做你自己。

    - 放慢速度。

    - 永远说真话。

    - 原谅你自己的错误。

    - 研究你的观众。

    - 定义演讲的目标。

    - 准备目标、引言和结论。

    - 保持对话的语气。


    ### 控制你的演讲时间

    - 疯狂地练习和研究你的主题。

    - 向人们征求反馈。

    - 在舞台上移动。

    - 缓慢呼吸。

    - 恰当运用你的声音。

    - 专注于演讲，而不是观众。

    - 不要害怕短暂的沉默。

    - 注意你的肢体语言。

    - 演讲前喝杯水。

    - 演讲当天不要喝咖啡因。

    - 积极思考。

    - 观看你演讲的录像。

    - 保持简单。

    - 不要担心与观众的眼神交流。

    - 不要担心你的弱点。

    - 你不一定要讲故事。

    - 逻辑清晰地组织想法。

    - 练习带来自信。

    - 研究主题直到你充满热情。

    - 做你自己。

    - 放慢速度。

    - 永远说真话。

    - 原谅你自己的错误。

    - 研究你的观众。

    - 定义演讲的目标。

    - 准备目标、引言和结论。

    - 保持对话的语气。

    - 疯狂地练习和研究你的主题。

    - 向人们征求反馈。

    - 在舞台上移动。

    - 缓慢呼吸。

    - 恰当运用你的声音。

    - 练习，排练。

    - 避免过度使用动画。

    - PowerPoint 演示稿应该有 `10` 张幻灯片。

    - 演示稿应该有 `30` 个要点。

    - 提前到达。

    - 在演讲前做好准备。

    - 按时结束。

    - 尽可能在每张幻灯片上用词。

    - 关注你的肢体语言。

    - 如果忘了某些内容，就跳过。

    - 参加在线演讲课程。

    - 使用技巧提升你的自信。


    ### 演讲类型

    - 信息性演讲。

    - 娱乐性演讲。

    - 演示性演讲。

    - 说服性演讲。

    - 特殊场合演讲。

    - 推销演讲。


    ### 演讲技巧

    - 流利度。

    - 词汇。

    - 语法。

    - 发音。


    ## 谈判

    挑战、谈判、解决方案、增长、财富……

    - 一切都是可谈判的。

    - 在谈判前明确你想要什么。

    - 目标是实现双赢谈判。

    - 运用沉默的力量。

    - 询问对方的意见。

    - 将公平的报价放在谈判桌上。

    - 如果报价不公平，就离开。

    - 不要做假设，提问。

    - 不要急于成交，保持耐心。

    - 不要接受不公平的交易。

    - 建立关系。

    - 选择蜂蜜而非醋（注：此处原文可能可能有误，意为选择温和的策略）。

    - 你的情绪不要主宰你。

    - 专注于协作。

    - 在谈判前做好研究。

    - 完成你的作业。


    ### 谈判阶段

    - 确定目的。

    - 准备。

    - 信息交换。

    - 讨价。

    - 结论。


    ### 谈判技巧的好处

    - 职业发展和增长。

    - 冲突解决。

    - 团队合作。

    - 说服。

    - 解决问题。


    ## 沟通

    信息、沟通、增长、成功、财富……

    倾听……倾听……

    能够高效地沟通是最重要的技能之一。当你沟通时，确保你的信息是清晰、简洁、完整且礼貌的。有效的沟通不在于说，而在于听。理解对方试图传达的信息。沟通是成功的中心，因为信息导致增长，持续增长导致成功。


    ### 沟通失败

    沟通失败是误导性的、无效的或冒犯性的信息。不要为了获取知识而造成伤害。如果你感到愤怒并想说伤害人的话，就离开吧。你将在书中学习情绪智技巧。记住，要成功，你需要获取信息。如果你不擅长控制情绪，就会遇到麻烦。


    ### 成为良好沟通者的技巧

    - 倾听。

    - 肢体语言。

    - 压力管理。

    - 情绪控制。

    - 清晰与简洁。

    - 信心。

    - 开放心态。

    - 尊重。


    ## 倾听

    沟通、倾听、信息、增长、成功与财富……

    不要打断。倾听是准确接收和解释传递给你的信息的能力。倾听是所有有效高效沟通的关键。如果没有有效倾听的能力，信息很容易被误解，信息就会丢失。成功并不容易实现。倾听是你应该掌握的沟通技能。有效的倾听有助于解决冲突、建立信任、激励他人、提高生产力和增长。在对话的大部分时间里倾听，你就会吸收信息，成为良好的沟通者。


    ### 如何倾听

    注意说话者的言语和非语言，以完全理解他们表达的内容。注意意味着倾听并观察对方而不打断。不要出于任何原因打断对方。如果你想说点，等对方说完后再说。有效的倾听意味着听取对方信息的要点并在脑中或其他地方记录。


    ### 倾听与问题解决

    如果有人向你提问严肃的问题或他们想要你的建议，认真倾听，不要急于回答，尝试不要立即回答，花一两天思考对方说的话，然后再回答。思考需要时间、精力和努力。不要急于回答。只需告诉对方你需要时间处理他们说的话，你会回复他们。这种策略适用于任何情况，即使你不需要思考，也要花时间思考。如果你花时间思考，就会做出明智的决策。


    ### 积极倾听

    积极倾听是一种要求听者完全集中、理解并记住所说内容的技术。你必须同情、反思并提取传递给你的信息的要点。积极倾听用于咨询、培训以及解决争议或冲突。你可以通过认真倾听而不回答来解决许多问题。这被称为`橡鸭`效应。


    ### 倾听的障碍

    倾听是一项非常有挑战性的技能，因为总会有干扰信息传递的因素。对对方信息的干扰可能是肢体动作、内心想法、注意力分散、周围环境的声音或偏见倾听。偏见或选择性倾听是沟通中最大的问题之一。当某人只听他们想听的信息时，偏见倾听是危险的，因为你并没有在倾听。


    ### 关键倾听技巧

    - 注意。

    - 释义和总结。

    - 不要判断或草率下结论。

    - 通过点头显示你在倾听。

    - 不要打断。

    - 面向对方并保持眼神交流。

    - 提问。

    - 专注。


    ## 教练

    目标、里程碑、教练、教学、增长……

    在正确的时间提供信息。教练是一个针对当前挑战而非过去或未来的过程。


    ### 教练技能

    - 目标设定。

    - 倾听。

    - 同情。

    - 批判性思维。

    - 反馈。

    - 知识与经验。

    - 愿景。

    - 自我意识。

    - 开放。

    - 责任。


    ## 领导风格

    - 交易型领导力。

    - 变革型领导力。

    - 仆人领导力。

    - 民主型领导力。

    - 官僚型领导力。

    - 放任型领导力。

    - 魅力型领导力。

    - 愿景型领导力。

    - 亲和型领导力。

    - 节奏型领导力。


    ## 教学

    教学是帮助人们理解并应用知识、概念和过程的过程。者必须教人们如何实现目标。


    ### 良好教师的特质

    - 沟通技能。

    - 倾听技能。

    - 友好的态度。

    - 职业道德。

    - 准备。

    - 耐心。

    - 创造力。

    - 热情。

    - 奉献。

    - 同理心。

    - 领导力。

    - 对学科的知识。


    ### 如何教学

    - 告诉人们具体做什么。

    - 帮助纠错。

    - 提供反馈。

    - 使用经验学习。

    - 鼓励讨论。

    - 推荐书籍。


    ### 报告写作元素

    - 标题页。

    - 目录。

    - 执行摘要。

    - 引言。

    - 讨论。

    - 结论。

    - 建议。

    - 参考文献。


    ### 良好报告的特征

    - 简单。

    - 清晰。

    - 简洁。

    - 积极。

    - 标点符号。

    - 方法。

    - 可读性。

    - 准确性。


