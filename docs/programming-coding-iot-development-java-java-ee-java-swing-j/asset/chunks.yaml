- fmt: " even# Management and Leadership\n\nManagement and leadership are dependent\
    \ on each other. Managers have to be able to lead and leaders should be able to\
    \ manage. Leaders should lead meaning they should interact with people then when\
    \ they are done, they should manage the problem at hand. Managers should manage\
    \ the problem and then lead the people by interacting with them. \n\nNever manage\
    \ people. Manage the problem and lead the people. Solving the problem is called\
    \ management. Making people feel at peace is called leadership. You need both\
    \ skills and you should know when to act as a manager and when to act as a leader.\
    \ \n\nTeach, Mentor, Coach and Delegate. No one man can be available to solve\
    \ all problems when things go wrong therefore leaders and managers need to be\
    \ able to coach, mentor and motivate everyone so that they will be ready to step\
    \ in and take control when things go south.\n\n## Core Value of Leadership\n\n\
    This is a long list of fine values such as honesty, confidence, respect, empathy,\
    \ etc. You should make a list of core values you want to learn and you should\
    \ prioritize on learning and mastering them. Strong core values are what makes\
    \ a good leader.\n\n## Negotiation\n\nYou must be able to do everything with fewer\
    \ resources i.e. time, energy and money. One way to do this is to negotiate for\
    \ a better deal on your resources. Since leadership deals with people, leaders\
    \ have to learn how to negotiate. \n\nThis can include buying your resources in\
    \ bulk and negotiating for a better discount. It is important to remain ethical\
    \ and honest. Don’t abuse your power to negotiate and offer people less than what\
    \ is right. All things in life are connected by energy, if you are being unethical\
    \ you are releasing negative energy that will come back to you. That’s a story\
    \ for another day. I will write a chapter on negotiation.\n\n## Building Relationships\n\
    \nLeaders must be able to keep in contact with everyone they are in contact with.\
    \ Communication is the center of everything. Leaders must use all the tools available\
    \ to be able to communicate effectively and efficiently with everyone and information\
    \ technology is making this possible.\n\n## Core Values Of a Good Leader\n\n*\
    \ Integrity\n* Ability to delegate\n* Communication\n* Self-awareness\n* Gratitude\n\
    * Agility\n* Influence\n* Empathy\n* Patience\n"
