- fmt: "\nThis is the most important reason for an interview. All your interview answers\
    \ should be about evidence (success stories). Remember, a CV is a very summary\
    \ of your life, so they want you to elaborate on that. For example, if they ask\
    \ you why should we hire you, they already saw from your CV that you have experience\
    \ in that particular field and they know that is why they need to hire you but\
    \ they just want you to support that experience with success stories (evidence)\
    \ and if possible to give hard evidence. Don’t worry if you don’t have written\
    \ proof to support some of the skills and/or experience on your CV, the most common\
    \ way to support your claims is to tell success stories, which is all the evidence\
    \ they need. You will see in the questions below how easy it is to support your\
    \ answers with success stories but first, let us look at the structure of interviews.\n\
    \n# Types of Job Interviews\n\n### Telephone interview\nSometimes this is used\
    \ as part of recruitment processes in which if you pass the phone interview then\
    \ you will be invited to meet for another interview. Handle every telephone interview\
    \ in the same professional manner as any other interview. Start by answering your\
    \ phone professionally. Don’t be too fancy, a genuine hello will suffice. Just\
    \ like your email address, your voice mail message/answering machine should be\
    \ professional.\n\n### Face-to-face interview\nThis can also be a part of the\
    \ recruitment processes in which if you pass it then you will be invited to meet\
    \ for another interview, usually a panel interview, or you can be called for an\
    \ assessment test. Be professional and prepare for it thoroughly. Some companies\
    \ do not have a long recruitment process and this may be the only interview that\
    \ you attend after which you get a job offer. Well, hopefully.\n\n# Preparing\
    \ for an Interview\nLet everything revolve around your skills, qualifications\
    \ and experience.\n\n### Researching the company\nWhen you research the company,\
    \ don’t just browse through their website, go deeper than that. This will help\
    \ you answer your questions appropriately and will help you show your interest\
    \ in the company which will make you stand out from other candidates who didn’t\
    \ invest time in their research. Researching the company will also help you prepare\
    \ your questions for the interviewer.\n\n### Matching skills, qualifications and\
    \ experience to the job post\nThis is a very important part of preparing for an\
    \ interview as questions will revolve around the job requirements and duties.\
    \ Interviewers will ask questions to see if you have the required characteristics\
    \ and to see if you will be able to carry out the duties. Matching your skills\
    \ and qualification to the job’s requirements and duties will give you a good\
    \ sense of what characteristics the recruiter is looking for and what duties will\
    \ you be required to do. This will help you know which of the required characteristics\
    \ do you have, and which ones don’t you have so that you can start doing your\
    \ research and studying those characteristics that you don’t have. The trick here\
    \ is, never lie to the interviewer about characteristics you don’t have; be honest\
    \ and tell them that you will do everything in your power to learn.\n\nThere are\
    \ countless books written about these skills, make sure that you read the books\
    \ on a daily basis for self-improvement and development. If you haven’t had time\
    \ to read the books the read at least one article about each of these skills before\
    \ an interview. Remember these are just common skills, there are more specific\
    \ skills that a company will require e.g. advanced `excel`.\n\n### Research the\
    \ job post\nMake sure you know everything about the job duties written in the\
    \ post. The questions will be centered on the duties and sometimes recruiters\
    \ can ask very specific and challenging questions, e.g. say one of the requirements\
    \ is knowledge of `AWS`, the recruiter might ask, what is the output voltage of\
    \ the `AWS` motherboard. Now that’s deep. Not to worry though, recruiters turn\
    \ to ask more specific questions for senior positions and sometimes recruiters\
    \ just want to see your thought process. Basically, the job requirements are like\
    \ a scope of an exam, it tells you what they will test you on and you must go\
    \ and hit the books hard. If one of the requirements was to have experience in\
    \ operating the `hplc` machine and you have zero experience with that machine,\
    \ then you need to make sure that when you go to an interview you have read about\
    \ the machine and you have some serious knowledge about that machine. When asked\
    \ about the machine, never lie and say you have experience on the machine, NO!\
    \ Tell them straight that you have no experience with that machine, but you have\
    \ a good understanding of how the machine works then continue showing the knowledge\
    \ that you have gained from reading about the machine. Now you know why it’s very\
    \ important to invest a whole lot of time preparing.\n\n### Prepare success stories\
    \ and know them by heart\nWhen answering interview questions use the `SARS` method\
    \ of answering. `SARS` stands for `Situation`, `Action`, `Results` and `Summary`\
    \ which means try to highlight the `Situation` you were facing, the action you\
    \ took, the results and then summarize your story to show how it is relevant to\
    \ the question and maybe how the lesson learned can be used in the job that you\
    \ are applying for.\n\nStay on topic, rather not talk at all than to be all over\
    \ the place. Don’t just talk about your skills; show them how your skills can\
    \ benefit the company, for example, don’t just say I have a `BSc` degree in meteorology,\
    \ rather say, I have a `BSc` degree in meteorology that can benefit the company\
    \ in so many ways. Look at what the company wants (post duties) and tell them\
    \ how you can do it for them. Match your features to their need. What value are\
    \ you adding (what other values do you have that benefit the company).\n\n# Common\
    \ interview questions and sample answers\n\n### Question: Tell us about yourself\n\
    **Notes:** \nInterviewers are not asking you to give them your life story, they\
    \ want you to tell them about your personality traits with regards to the job\
    \ you are applying for. This includes your experience, qualifications and skills.\
    \ Don’t talk about what you like or don’t like. Tell them what experience, skills\
    \ and qualifications you have that are related to the job. Focus on your skills.\
    \ Remember you want to keep your answer concise and on point so if you have a\
    \ lot of experience or skills, give the ones that are relevant to the job to show\
    \ how they would benefit you thus making you the best candidate. Every time you\
    \ talk about your skills, education or experience, make sure you mention how it’s\
    \ to benefit them. Give them a concise summary of your experience, education,\
    \ and skills which is exactly what is in CV. Say it exactly as it is.\n\n**Answer:**\
    \ I have a `BSc` degree in Chemistry from the University of Cape Town. I also\
    \ have a certificate in `Operation and Management` which equipped me with staff\
    \ skills to increase productivity. I have two years’ experience working as a laboratory\
    \ analyst where I got extensive hands-on experience with modern instruments such\
    \ as `HPLC`, `XRF`, etc. In my previous company, I was in charge of writing standard\
    \ operation procedures (`SOP`) and managing laboratory equipment, and I was able\
    \ to reduce the number of accidents in the lab by 5%. I would say that my main\
    \ strength is my communication skills, which is evident in my reference letter.\n\
    \n### Question: Why is there a gap in your history?\n**Notes:** \nTry not to give\
    \ an answer that is related to illness unless you have supporting documents. If\
    \ you were let go, then you must be honest. Remember to stay positive at all times\
    \ and interviewers saw the gap before they invited you for an interview. A good\
    \ way to answer this is to tell them about the positive things you have done during\
    \ the gap because it might sound like you are lying.\n\n**Answer:** The company\
    \ was downsizing and they had to let all part-time people go. I was one of them\
    \ but before I left they gave me a recommendation letter. Here is my letter. During\
    \ the gap, I wrote a novel which I published on `Kindle` about thinking.\n\n**Alternate\
    \ answer:** I took a gap to take care of my sister because of some medical issues.\
    \ Here is proof. During the gap, I took an online course with the University of\
    \ Pretoria to keep increasing my knowledge. \n\n**Alternate answer:** After I\
    \ left my job at `Rampsy Consulting`, I decided that I wanted to travel. I went\
    \ to Asia for two months and then spent two months in the USA. This has helped\
    \ me have a broad perspective.\n\n### Question: Do you have experience in …\n\
    **Notes:** \nThe interviewer will ask you if you have experience in a particular\
    \ skill they are looking for even if they saw in your CV that you have the skill\
    \ or not. They have to ask because it is protocol. If you do not have the skill\
    \ do not hesitate to say `NO`.\n\n**Answer:** No, however, that is not a problem;\
    \ I have a high affinity to learn and I adapt quickly. I did not have any experience\
    \ when I started my last job and the job required technical experience for specific\
    \ instruments but within two months I had already taught myself how to operate\
    \ all the instruments. Three months from then I was put in charge of the instruments\
    \ and after ten months I wrote a blog on how to operate the instruments. I learnt\
    \ how to use these instruments quickly because of my people skills and my communication\
    \ skills and from reading a lot of books and articles how to operate the instruments\
    \ and I summarized these books and articles to create a blog. By communicating\
    \ effectively with everyone and having outstanding people skills, all my colleagues\
    \ enjoyed helping me learn how to operate the instruments. I combined what my\
    \ colleagues have taught me and what I have read from other books.\n\n**Alternate\
    \ Answer:** Yes, I do, I have five years’ experience in operating the `HPLC` machine.\n\
    \n### Question: Do you have the Meteorological certificate?\n**Notes:** \nThe\
    \ interviewer may ask you if you have a particular qualification especially if\
    \ they know you do not have that. They are hoping that you would be honest and\
    \ say `no` but you are willing to learn, do exactly that.\n\n**Answer:** No, but\
    \ I have a three-year degree in Chemistry from the University of Cape Town which\
    \ covered some aspects of meteorology e.g. air pressure, humidity, etc. So, even\
    \ though I do not have a meteorological certificate, I am not a stranger to meteorological\
    \ concepts.\n\n### Question: What is your greatest strength?\n**Notes:** \nBe\
    \ specific and tell a brief work-related example of you showing your strength\
    \ and pick the example that is related to what they are looking for. If you feel\
    \ like you have already mentioned it in your CV or cover letter, do not worry,\
    \ it is fine to mention it again. Make sure that you give examples to support\
    \ your answer.\n\n**Answer:** My greatest strength is my ability to communicate\
    \ effectively. One of my duties at my previous company was to mentor new employees.\
    \ The employees were fresh out of varsity and without any working experience or\
    \ knowledge of some of the instruments. To solve this problem, I had to teach\
    \ them how to operate the instruments and mentor them. I made sure that I communicate\
    \ effectively with them. I listened actively to what they know and what they did\
    \ not know so that I can explain to each and every one of them what they each\
    \ needed to know individually. Notice that every time I talk about my skills,\
    \ I make sure that I also mention the common skills that recruiters are looking\
    \ for. The key to successful communication is to communicate in a way that you\
    \ make it easier for the other person to understand. The results were that the\
    \ employees learned how to use the instruments quickly and they adapted to the\
    \ working environment with ease.\n\n**Alternate answer:** My greatest strength\
    \ is my ability to manage multiple tasks. In 2012, I was enrolled in course at\
    \ the University of Pretoria during winter vacation and a polymer science course\
    \ at the University of Stellenbosch simultaneously which I completed with outstanding\
    \ results. Also, I majored with three different specializations simultaneously\
    \ at the University of Pretoria when I was completing my `BSc` degree.\n\n###\
    \ Question: What is your biggest weakness or areas you improve upon?\n**Notes:**\
    \ \nEveryone has a weakness, but do not say something that is completely like\
    \ \"I am alcoholic\". The interviewers just want to see if you have self-awareness\
    \ or if you are willing to work on it. Pick a weakness that you had and managed\
    \ to change into strength. Do not talk about negatively.\n\n**Answer:** My weakness\
    \ is that I lack a bit of organization skills. The disadvantage of this is that\
    \ it can be time consuming because I spent the whole day looking for things. I\
    \ have read a lot of articles on this problem and I am no longer struggling with\
    \ it. One of the strategies I use is to return everything to where I found it.\n\
    \n### Question: How much do you want to get paid?\n**Notes:** \nThis is a very\
    \ silly question really because no one would like to work for peanuts. The company\
    \ has to pay for the people interviewing you, the training, equipment and they\
    \ have to work out your salary. They want someone who is not going to waste their\
    \ money. Tell them a few positive things about their company and mention vaguely\
    \ that you do not want to leave. Research how much this position pays in your\
    \ country from someone who has the same qualification and experience. Get the\
    \ minimum and the maximum pay rate, answer with amount that is higher than the\
    \ average or give them a maximum amount.\n\n**Answer:** Salary is obviously very\
    \ important; however, I am sure that we can agree on a salary that is mutually\
    \ agreeable for both of us if you agree I am a good fit for this position.\n\n\
    **Alternate:** I actually did some research on the topic and according to the\
    \ internet I think the salary range is between 100,000 and 200,000 so I think\
    \ anything in that range will be fair for me.\n\n**Alternate answer:** I am currently\
    \ getting 150,000 so I think anything from 200,000 will be good for me.\n\n**Alternate\
    \ Answer:** On my last job my salary was 200,000 total compensation of which was\
    \ benefits so I guess we can work from there.\n\n### Question: How would you describe\
    \ yourself?\n**Notes:** \nDo not talk about hobbies, interest or other personal\
    \ interest. This is not a personal environment, it is a professional environment.\
    \ Highlight one of your strengths and pair it with a success story or talk about\
    \ your skills. Choose one of your skills and talk about it in a concise manner.\n\
    \n**Answer:** I adapt very quickly, and I have a high affinity to learn. A month\
    \ after I graduated, I got a job at `Rampsy Consulting laboratories`. This company\
    \ is a consulting company faced with different problems every day and I had no\
    \ work experience so dealing with different problems every week was new to me\
    \ and very challenging. Frankly, I have a natural ability to adapt and I made\
    \ sure that every week after work I read articles relating to what I was working\
    \ on. I became so good with that my contract got extended and when I left, I was\
    \ given a very good reference letter and I learned a lot from reading all those\
    \ articles I even made a blog.\n\n### Question: What annoys you?\n**Notes:** \n\
    Remember to always stay positive. Do not say anything bad about anything or anyone.\
    \ Best way to answer this question is to tell them what annoys you about yourself\
    \ and give an example.\n\n**Answer:** I get annoyed when I sit and do nothing.\
    \ I like keeping myself occupied with something valuable. As you can see from\
    \ my CV, I have continuously kept myself busy. In 2012, I wrote a novel about\
    \ thinking. In 2013, I designed a new brand. In 2014, I wrote and published a\
    \ book. In 2015, I registered a business and wrote a business plan. This is one\
    \ of the reasons why I applied for this position because I like a fast-paced environment.\n\
    \n### Question: How you handle working under pressure?\n**Notes:** \nThere are\
    \ people who work well under pressure and some who do not. The interviewers want\
    \ to see if you are someone who works well under pressure or when they are not.\
    \ Give an example of when you worked under pressure and structure your answer\
    \ using the `SARS` format.\n\n**Answer:** I most definitely can work under pressure.\
    \ The previous company I worked for was a consulting company and I had a lot of\
    \ clients. I worked under pressure but I was organised and I used my time effectively.\n\
    \n**Answer:** Yes, I work well under pressure. In varsity, I graduated with a\
    \ `BSc` degree specialising in chemistry. This means I am dedicated to my work.\
    \ Also, in my previous company at `Rampsy`, I was required to do many different\
    \ tasks in a short period of time. This helped me to manage my time effectively\
    \ under pressure.\n\n### Question: How do you make important decisions?\n**Notes:**\
    \ \nThe main aim of this question is to find out how you build relationships with\
    \ the management team. The interviewer is trying to see if you have good work\
    \ ethics and people skills. If they ask what your previous boss or colleagues\
    \ would describe you, be confident. \n\n**Answer:** I am very good at making important\
    \ decisions. The strategy that I use is to weigh pros and cons. I make sure that\
    \ I have as much information as possible so I can make an informed decision; this\
    \ includes taking as much advice as possible from my team members. This is very\
    \ important. In terms of brilliant decision making and problem-solving skills,\
    \ I emphasize the importance of enquiring as much information as possible before\
    \ making a decision.\n\n### Question: Why do you want to work our company?\n**Notes:**\
    \ \nTell them what you like about the company. \n\n**Answer:**\nI would love to\
    \ work for your company because I believe that my background and skills can contribute\
    \ to the success of the company by making sure I deliver everything is required\
    \ from me and by working an extra mile.\n\nYes, my friend and mentor, `Johannes`,\
    \ works for the company. He is the one who told me about this position. He told\
    \ me about the work environment the company has and how strict the company is\
    \ about data integrity and how you provide growth for your employees which is\
    \ what attracted me most about this position.\n\n### Question: Where do you want\
    \ to see yourself in 3 to 5 years from now?\n**Notes:** \nThe interviewers want\
    \ to see that you are a person with direction and goals. They also want to see\
    \ if you are willing to commit yourself to the company or if you just want to\
    \ pass time with this position while you look for something better. Make sure\
    \ your answer shows how your goals and direction will value the company. Set realistic\
    \ goals. Do not say that you want to see yourself being promoted or how you would\
    \ like to be in a management position. The best way to answer this question is\
    \ to look at how you can contribute to the position and how you can grow from\
    \ the position then answer along those lines. Be specific and tie your career\
    \ goals to specific duties that are possible with the company. Another best way\
    \ is to talk about your studies. Tell them what qualifications you want to have\
    \ completed in the next five years. You can also state your goals and then give\
    \ steps on how you are going to achieve this. Do your research on the career paths\
    \ that are open to you within the company. This is the best time to ask questions.\
    \ You can ask if they support studying further, etc.\n\n**Answer:** I want to\
    \ have increased my skills with the modern laboratory equipment and my overall\
    \ experience in the laboratory skills. Also, I want to see myself committed and\
    \ taking more responsibility to the company in managing laboratory equipment and\
    \ laboratory staff.\n\n**Alternate answer:** I want to see myself having a positive\
    \ impact on the company and being a leader in my field in terms of skills and\
    \ knowledge. I will achieve this goal by making sure I use my experience in equipment\
    \ management to make sure I minimize equipment damage and hazards lab. I will\
    \ use my communication skills to build rapport with the staff, management and\
    \ the students. Lastly, I will make sure that I work an extra mile and I don’t\
    \ just limit myself to the scope of my duties.\n\n**Alternate Answer:** I have\
    \ enrolled with the `University of South Africa` to study law part-time, so in\
    \ five years I would like to see myself having a law degree.\n\n**Example of a\
    \ bad answer:** I would like to see myself as head of department so that all the\
    \ managers can report to me and I can use my leadership skills to lead the department\
    \ to greener pastures. Don’t say such things or at least do not say it with this\
    \ tone.\n\n### Question: what do you know about our company?\n**Notes:** \nKnow\
    \ the company in and out. You do not have to memorize all dates, but you should\
    \ know the facts.\n\n**Answer:** Your company is very well known for customer\
    \ service, and I also won an award for best service in the country.\n\n**Alternate\
    \ answer:** Your company is one of the top global companies, it has a range of\
    \ international brands such as `HPLC`, `XRF`, etc., and local ones such as `Berri`\
    \ and `Jayro`.\n\n### Question: Why do you want to work here?\n**Notes:** \nThe\
    \ company’s reputation is one of the reasons why I want to work here. \n\n**Answer:**\n\
    I have been working on my skills for the past two years. I have read countless\
    \ articles online about being a great conversationalist or any other article.\
    \ My favorites are `Brilliant Communication Skills` by `Gill Hasson`, `Effective\
    \ Communication Skills` by `Alan Barker`. \n\n**Alternate answer:** \nI took a\
    \ part-time course with `Unisa` for an advanced certificate in `Production Management`\
    \ to improve my knowledge of the field. I have also registered with the `South\
    \ African Chemical Institute` and the `Royal Society of Chemistry` to ensure I\
    \ continue growing in my field. I have also registered with the `South African\
    \ Council for Natural Scientific Professions` to be a certificated natural scientist.\n\
    \n### Question: What have you done to improve your skills or knowledge in the\
    \ last year?\n**Notes:** \nFrankly, interviewers would like someone who is continually\
    \ growing. Do not say you haven't done anything.\n\n**Answer:**\nI have been working\
    \ on my communication skills for the past two years. I have read countless articles\
    \ online about being a great conversationalist or any other article. My favorites\
    \ are `Brilliant Communication Skills` by `Gill Hasson`, `Effective Communication\
    \ Skills` by `Alan Barker`.\n\n### Question: How long do you want to work for\
    \ us?\n**Notes:** \nTell them few positive things about their company and mention\
    \ vaguely that you do not want to leave.\n\n**Answer:** Your company is one of\
    \ the leading companies in my field, it provides growth and the environment is\
    \ perfect for me. I know I will be satisfied here.\n\n### Question: Do you work\
    \ for money or job satisfaction?\n**Answer:** I work for job satisfaction.\n\n\
    ### Question: What is your ideal job?\n**Notes:** \nIf this is not your dream\
    \ job, make sure whatever you say relates to the job you are applying for.\n\n\
    **Answer:** My ideal job is working in a chemistry related field and should include\
    \ mentoring and managing. As I already explained, one of my skills is communication\
    \ and I would like to work in an environment where I can.\n\n### Question: Are\
    \ you willing to work overtime?\n**Notes:** \nThe interviewers just want to see\
    \ if you are willing to work overtime.\n\n**Answer:** I am very flexible and I\
    \ would not mind coming to work on weekends if needed. I used to go to weekends\
    \ at my previous job. There was one particular time when the machine broke and\
    \ we could not work, so I stayed and worked on Saturday and Sunday to clear the\
    \ workload for the following week.\n\n### Question: What did you dislike about\
    \ your previous job?\n**Notes:** \nDo not talk negatively about anyone.\n\n**Answer:**\
    \ Working for `Rampsy Consulting Company` was very nice and relaxed. We spent\
    \ the whole day in the office doing paperwork which is good, however, I am a hands-on\
    \ kind of person and I prefer being in the lab solving problems.\n\n### Question:\
    \ What is your greatest achievement?\n**Notes:** \nPick an accomplishment that\
    \ will show how valuable you will be for the position you are applying for.\n\n\
    **Answer:** After only three months of working at my previous company, my manager\
    \ asked me to be part of the team that was responsible for creating standard operation\
    \ procedures (`SOPs`) to make sure the laboratory operates effectively. Also,\
    \ months after working at my previous company I was very knowledgeable on the\
    \ instruments that I made my own analytical chemistry blog. My blog explains some\
    \ of the laboratory equipment to give knowledge to people around the world. I\
    \ managed to achieve these accomplishments because I worked an extra mile to get\
    \ to know all the laboratory equipment and procedures. I was reading up on the\
    \ instrument every day after I knocked off for the first six months. This took\
    \ a lot of discipline. Also, communicating effectively with my seniors to understand\
    \ how the lab operates and how to troubleshoot when an instrument is giving problems\
    \ and how to prevent future problems. It was not easy at first to learn all this\
    \ information and procedures in such a short period, but I was really persistent,\
    \ so I focused and powered through.\n\n**Alternate answer:** I think my greatest\
    \ accomplishment in my previous job was when I was mentoring new employees. Mentoring\
    \ is one of my key strengths and one of the things that attracted me to this position.\
    \ All the new employees that I have mentored have advanced to become permanent\
    \ staff. The key steps I used to achieve this accomplishment are communication\
    \ and leading by example. I listened actively to what they know and what they\
    \ do not know so that I can explain to each and every one of them individually\
    \ what they needed to know, and I also gave a lot of practical examples so that\
    \ it will be easier for them to remember. Leading by example can actually solve\
    \ a lot of problems related to emotional intelligence.\n\n### Question: What relevant\
    \ experience do you have?\n**Notes:** \nThe interviewers want to see if you have\
    \ relevant experience.\n\n**Answer:** I have two years’ work experience as a laboratory\
    \ analyst. The experience that I gained includes:\n"
  raw: 'This is the most important reason for an interview. All your interview answers
    should be about evidence (success stories). Remember, a CV is a very summary of
    your life, so they want you to elaborate on that. For example, If they ask you
    why should we hire you, they already saw from your CV that you have experience
    in that particular field and they know that is why they need to hire you but they
    just want you to support that experience with success stories (evidence) and if
    possible to give hard evidence. Don’t worry if you don’t have written proof to
    support some of the skills and/or experience on your CV, the most common way to
    support your claims is to tell success stories, which is all the evidence they
    need. You will see in the questions below how easy it is to support your answers
    with success stories but first, let us look at the structure of interviews.Types
    of Job InterviewsTelephone interviewSometimes this is used as part of recruitment
    processes in which if you pass the phone interview then you will be invited to
    meet for another interview. Handle every telephone interview in the same professional
    manner as any other interview. Start by answering your phone professionally. Don’t
    be too fancy, a genuine hello will suffice. Just like your email address, your
    voice mail message/answering machine should be professional.Face-to-face interviewThis
    can also be a part of the recruitment processes in which if you pass it then you
    will be invited to meet for another interview, usually a panel interview, or you
    can be called for an assessment test. Be professional and prepare for it thoroughly.
    Some companies do not have a long recruitment process and this may be the only
    interview that you attend after which you get a job offer. Well, hopefully.Preparing
    for an InterviewLet everything revolve around your skills, qualifications and
    experienceResearching the companyWhen you research the company, don’t just browse
    through their website, go deeper than that. This will help you answer your questions
    appropriately and will help you show your interest in the company which will make
    you stand out from other candidates who didn’t invest time in their research.
    Researching the company will also help you prepare your questions for the interviewer.Matching
    skills, qualifications and experience to the job postThis is a very important
    part of preparing for an interview as questions will revolve around the job requirements
    and duties. Interviewers will ask questions to see if you have the required characteristics
    and to see if you will be able to carry out the duties. Matching your skills and
    qualification to the job’s requirements and duties will give you a good sense
    of what characteristics the recruiter is looking for and what duties will you
    be required to do. This will help you know which of the required characteristics
    do you have, and which ones don’t you have so that you can start doing your research
    and studying those characteristics that you don’t have. The trick here is, never
    lie to the interviewer about characteristics you don’t have; be honest and tell
    them that you will do everything in your power to learn.There are countless books
    written about these skills, make sure that you read the books on a daily basis
    for self-improvement and development. If you haven’t had time to read the books
    the read at least one article about each of these skills before an interview.
    Remember these are just common skills, there are more specific skills that a company
    will require e.g. advanced excel.Research the job postMake sure you know everything
    about the job duties written in the post. The questions will be centered on the
    duties and sometimes recruiters can ask very specific and challenging questions,
    e.g. say one of the requirements is knowledge of AWS, the recruiter might ask,
    what is the output voltage of the AWS motherboard. Now that’s deep. Not to worry
    though, recruiters turn to ask more specific questions for senior positions and
    sometimes recruiters just want to see your thought process. Basically, the job
    requirements are like a scope of an exam, it tells you what they will test you
    on and you must go and hit the books hard. If one of the requirements was to have
    experience in operating the hplc machine and you have zero experience with that
    machine, then you need to make sure that when you go to an interview you have
    read about the machine and you have some serious knowledge about that machine.
    When asked about the machine, never lie and say you have experience on the machine,
    NO! Tell them straight that you have no experience with that machine, but you
    have a good understanding of how the machine works then continue showing the knowledge
    that you have gained from reading about the machine. Now you know why it’s very
    important to invest a whole lot of time preparing.Prepare success stories and
    know them by heartWhen answering interview questions use the SARS method of answering.
    SARS stands for Situation, Action, Results and Summary which means try to highlight
    the Situation you were facing, the action you took, the results and then summarize
    your story to show how it is relevant to the question and maybe how the lesson
    learned can be used in the job that you are applying for.Stay on topic, rather
    not talk at all than to be all over the place. Don’t just talk about your skills;
    show them how your skills can benefit the company, for example, don’t just say
    I have a BSc degree in meteorology, rather say, I have a BSc degree in meteorology
    that can benefit the company in so many ways. Look at what the company wants (post
    duties) and tell them how you can do it for them. Match your features to their
    need. What value are you adding (what other values do you have that benefit the
    company).Common interview questions and sample answersQuestion: Tell us about
    yourselfNotesInterviewers are not asking you to give them your life story, they
    want you to tell them about your personality traits with regards to the job you
    are applying for. This includes your experience, qualifications and skills. Don’t
    talk about what you like or don’t like. Tell them what experience, skills and
    qualifications you have that are related to the job.Focus on your skills. Remember
    you want to keep your answer concise and on point so if you have a lot of experience
    or skills, give the ones that are relevant to the job to show how they would benefit
    you for this job thus making you the best candidate. Every time you talk about
    your skills, education or experience, make sure that you mention how it’s going
    to benefit them and how you think that will be good for the position.Give them
    a concise summary of your experience, education, and skills which is exactly what
    is in your CV. Say it exactly as it is.AnswerI have a BSc degree in Chemistry
    from the University of Cape Town. I also have a certificate in Operation and Production
    management which equipped me with staff management skills to increase productivity.
    I have two years’ experience working as a laboratory analyst. This is where I
    got extensive hands-on experience with modern laboratory instruments such as HPLC,
    XRF, IR, etc.In my previous company, I was in charge of writing the standard operation
    procedures (SOP) and managing laboratory equipment, and I was able to reduce the
    number of accidents in the lab by 5% in a year with zero damages to the laboratory
    equipment. I would say that my main strength is my communication skills, which
    is evident in my reference letter. I would like to join an organization that provides
    growth and rewards achievement.◆◆◆Question: Why is there a gap in your work history?NotesTry
    not to give an answer that is related illness unless if you have supporting documents.
    If you were let go, then you must be honest. Remember to stay positive at all
    times and remember that interviewers saw the gap before they invited you for an
    interview, so they do not really care about the gap.A good way to answer this
    is to tell them about the positive things you have done during your gap and try
    to give proof because it might sound like you are lying.AnswerThe company was
    downsizing, and they had to let all the intern and part-time people go. I was
    one of the part-time people but before I left, they gave me a recommendation letter.
    Here is my letter. During the gap I wrote a novel, which I published on kindle,
    the name of my novel is: Thinking about what you are thinking about thinking.
    It is a silly name, but you get the point.Alternate answerI took a gap to take
    care of my sister because of some medical issues she had. Here is proof from my
    previous employer showing that this is indeed why I left the company. During the
    gap, I took an online course with the University of Pretoria to keep increasing
    my knowledge.Alternate answerAfter I left my job at Rampsy Consulting Company
    as I had decided that I want to travel abroad. I went to Asia for two months then
    I spent two more months in USA. This has helped me to have a broad perspective
    in life. I have also volunteered at a bookstore.◆◆◆Question: Do you have experience
    in ….?NotesThe interviewer will ask you if you have experience in a particular
    skill that they are looking for even if they saw in your CV that you have the
    skill or not. They have to ask, it reassures what they already know from your
    CV. So, answer exactly as in your CV. If you do not have the skill do not hesitate
    to say NO.AnswerNo, however, that is not a problem; I have a high affinity to
    learn and I adapt very quickly. I did not have any experience when I started my
    last job and the job required technical experience for specific instruments but
    within two months I had already taught myself how to operate all the instruments,
    three months from then, I was put in charge of the dissolution instruments and
    after 10 months I  wrote a blog on how to operate these instruments.I learnt how
    to use these instruments quickly because of my people skills and my communications
    skills and from reading a lot of books and articles how to operate the instruments
    and I summarized these books and articles to create a blog. By communicating effectively
    with everyone and having outstanding people skills, all my colleagues enjoyed
    helping me learn how to operate the instruments. So, I combined what my colleagues
    have taught me and what I have read from other books.Alternate AnswerYes, I do,
    I have five years’ experience in operating the HPLC machine.◆◆◆Question: Do you
    have the Meteorological certificate?NotesThe interviewer may ask you if you have
    a particular qualification especially if they know that you do not have that qualification.
    They are hoping that you would be honest and say no but you are willing to learn,
    so do exactly that.AnswerNo, but I have a three-year degree in chemistry from
    the University of Cape Town which covered some aspects of meteorology e.g. air
    pressure, humidity, temperature, etc. So, even though I do not have a meteorological
    certificate, I am not a stranger to meteorological concepts.◆◆◆Question: What
    is your greatest strength?AnswerMy greatest strength is my ability to communicate
    effectively. One of my duties at my previous company was to mentor new employees.
    The employees were fresh out of varsity and without any working experience or
    knowledge of some of the instruments. To solve this problem, I had to teach them
    how to operate the instruments and mentor them. I made sure that I communicate
    effectively with them. I listened actively to what they know and what they did
    not know so that I can explain to each and every one of them what they each needed
    to know individually. Notice that every time I talk about my skills, I make sure
    that I also mention the most common skills that recruiters are looking for.The
    key to successful communication is to communicate in a way that you make it easier
    for the other person to understand. The results were that the employees learned
    how to use the instruments quickly and they adapted to the working environment
    with ease.Alternate answerMy greatest strength is my ability to manage multiple
    tasks. In 2012, I was enrolled in a word power course at the University of Pretoria
    during winter vacation and a polymer science course at the University of Stellenbosch
    simultaneously which I completed with outstanding results. Also, I majored with
    three different specializations simultaneously at the University of Pretoria when
    I was completing my BSc degree.NotesBe specific and tell a brief work-related
    example of you are showing your strength and pick the example that is related
    to what they are specifically looking for. If you feel like you have already mentioned
    your strength in your CV or cover letter, don not worry, it is fine to mention
    it again. Just make sure that you give examples to support your answer.Keep the
    job description in mind when answering. Make sure that the strength that you give
    is one of the qualities that the company is looking for. This should be your true
    strength, do not make up imaginary strength that you think will make you look
    good. Give your true strength, however, make sure that you give a strength that
    will benefit the company.Do not just give a random strength that has nothing to
    do with the position that you are applying. For example, do not say your greatest
    strength is drawing while the position that you are applying for is for Atmospheric
    Science, unless if you want to fail the interview then that answer is fine. You
    will get what you want.◆◆◆Question: What is your biggest weakness or areas you
    can improve upon?NotesEveryone has a weakness, but this is neither the time nor
    the place to say whatever weakness comes to mind – you are not in a bar you know.
    Do not say something that is completely out like I am alcoholic, or I am a pervert.
    No! The interviewers just want to see if you do have self-awareness or if you
    just think that you are superman. Also, they want to see how you react to your
    weaknesses; are you willing to work on your weakness to change them into strengths
    or you just let them have the best of you. Pick a weakness that you had, and you
    managed to change into strength. Do not talk about a weakness if you think that
    it might give you a bad reputation.AnswerMy weakness is that I lack a bit on organization
    skills. The disadvantage of this is that it can be time consuming because you
    can spend the whole 10 minutes looking for an eraser on a messy table. I have
    read a lot of articles on this problem and I am no longer struggling with the
    problem. One of the strategies that I use is to return everything that I use where
    I had found it.◆◆◆Question: How much do you want to get paid?AnswerSalary is obviously
    very important; however, I am sure that we can come to a salary that will be mutually
    agreeable for the both of us if we agree that I am a good fit for this position.Alternate
    AnswerI actually did some research on the topic and according to the internet
    I think the salary range is between 100 000 and 200 000 so I think anything in
    that range will be fair for me and the company.Alternate AnswerI am current getting
    150 000 so I think anything from 200 000 will be good for me.Alternate AnswerOn
    my last job my salary was 200 000 total compensation of which 10% was benefits
    so I guess we can work from there. Do not give this answer if you know that they
    were underpaying you in your last job, I am guessing you know why.NotesThis is
    a very silly question really because no one would like to work for peanuts at
    the same time you cannot say that you want big bucks now can you? And you know
    that is all that you want.Here are tips to answer this question professionally
    so that you can get it over with and start getting the big bucks. Research how
    much does this position pay in your country from someone who has the same qualification
    and experience as you. Get the minimum and the maximum pay rate possible, answer
    with amount that is higher than the average or give them a maximum amount. Employers
    do not want somebody who doubt themselves so do not answer with the minimum value,
    plus, you are not cheap believe it or not. How are you going to buy a can of energy
    drink to cope with the sick amount of work they will be giving you? You want energy
    drink not peanuts!If you really don’t think that you can pull this off then its
    fine, a lot of us cannot, just defer the question in a respectful and professional
    way. Get information from the internet or ask somebody who is well informed about
    this sort of thing. However, do not get someone who is going to give you opinions,
    you want facts – this is money we are talking about.If the topic is going well
    and you can see that they are fine about the number you just suggested or if you
    are still negotiating for it then you can start asking about benefits. Who doesn’t
    like benefits…?More notesYes, more notes! Like I said this is money we are talking
    about. I can talk about money the all day and night. Let’s get to it then. After
    you have researched the salary range for the position, offer the salary range
    when they ask and justify where you think you belong on that range based on your
    experience, education and other similar factors. I might have said this already
    I am not sure, like I said, I just can’t stop talking about moolah. Somebody please
    stop me.◆◆◆Question: How would you describe yourself?NotesDo not talk about hobbies,
    interest or other personal interest. This is not a personal environment, it is
    a professional environment. Highlight one of your strengths and pair it with a
    success story or talk about your skills. Choose one of your skills and talk about
    it in a concise manner.AnswerI adapt very quickly, and I have a high affinity
    to learn. A month after I graduated, I got Job at Rampsy Consulting laboratories.
    This company is a consulting company faced with different problems every day and
    I had no work experience so dealing with different problems every week was new
    to me and very challenging. Luckily, I have a natural ability to adapt and I made
    sure that every week after work I read articles relating to what I was working
    on. I became so good with the that, my contract got extended and when I left,
    I was given a very good reference letter and I learned a lot from reading all
    those articles that I even made a blog.◆◆◆Question: What annoys you?NotesRemember
    to always stay positive. Do not say anything bad about anything or anyone. Best
    way to answer this question is to tell them what annoys you about yourself and
    give an example. This is an easy one.AnswerI get annoyed when I sit and do nothing.
    I like keeping myself occupied with something valuable. As you can see from my
    CV, I have continuously kept myself busy. In 2012, I published a blog. In 2013,
    I designed a new brand of shampoo and manufactured it. In 2014, I wrote and published
    a book and in 2015, I registered a business and wrote a business plan. This is
    one of the reasons why I applied for this position, because it is a fast-paced
    environment.◆◆◆Question: How do handle working under pressure?NotesThere are people
    who work very well under pressure, in fact, they work so well under pressure that
    they leave everything until the last minute so that they will be under pressure
    and then they feel motivated to start the task. This is not good. There are also
    people who work very well when they are not under pressure but come pressure,
    they crush. This is also not good.The interviewers want somebody who works very
    well when they are both under pressure and when they are not under pressure. Give
    an example of when you worked under pressure to support your answer and structure
    your answer using the SARS format.AnswerI most definitely can work under pressure.
    The previous company that I worked for was a consulting company and I had a lot
    of clients and so about eighty percent of the time I was working under pressure
    and it was easy for me because I am organized, I like planning, I use my time
    effectively and I do not mind working extra hours.AnswerYes, I work very well
    under pressure. In varsity I graduated with a BSc degree specializing with 3 majors
    simultaneously. These means three times the work of an average student because
    average students specialize with only one major. Most students just major with
    chemistry and graduate with chemistry. Hard working students who are dedicated
    to their work specialize in two majors. I specialized with three majors.Also,
    in my previous company at Rampsy, our company was required to do comparative dissolution
    which required 30 different profile dissolutions in two weeks; this is a lot of
    work in very short period of time. Usually it takes one person a week to do just
    5 profile dissolutions, but my manager gave me the task to do 30 comparative dissolution
    in two weeks. This meant that I had to do 30 different dissolutions in only two
    weeks. To do this I came up with a solid plan that I will come to work early and
    leave late so that I can manage to do at least 3 dissolutions per day. I made
    sure that I organize everything nicely so that I will not make any mistakes. In
    10 days, I was done with all 30 dissolutions and on the 12th day I was done with
    the report. The report was 207 pages long and there were no mistakes on it.◆◆◆Question:
    How do you make important decisions?AnswerI am very good at making important decisions.
    The strategy that I use to make decisions is to weigh pros and cons. I make sure
    that I have as much information as possible so that I can make an informed decision;
    this includes taking as much advice as possible from my team members. This is
    very important, in his book, Brilliant decision making and problem-solving skills,
    Richard Hall emphasizes the importance of enquiring as much information as possible
    about the problem before making a decision.◆◆◆Question: Why do you want to work
    our company?AnswerI would love to work for your company because I believe that
    my background and skills can contribute to the success of the company by making
    sure the I deliver every single thing that is required from me and by working
    an extra mile.◆◆◆Question: Where do you want to see yourself in 3 to 5 years from
    now?NotesThe interviewers want to see that you are a person with direction and
    goals. They also want to see if you are willing to commit yourself to the company
    or if you just want to pass time with this position while you look for something
    better. Make sure your answer shows how your goals and direction will be valuable
    to the company. Set realistic goals. Do not say that you want to see yourself
    being promoted or how you would I like to be in a management position.The best
    way to answer this question is to look at how you can contribute to the position
    and how you can grow from the position then answer along those lines. Be specific
    and tie your career goals to specific duties that are possible with the company.
    Another best way is to talk about your studies. Tell them what qualifications
    you want to have completed in the next five years.You can also state your goals
    and then give steps on how you are going to achieve this goal. Do your research
    on the career paths that are open to you within the company. This is the best
    time to ask questions. You can ask if they support studying further, etc.AnswerI
    want to have increased my skills with the modern laboratory equipment and my overall
    experience in the laboratory skills. Also, I want to see myself committed and
    taking more responsibility to the company in managing laboratory equipment and
    laboratory staff.Alternate answerI want to see myself having a positive impact
    on the company and being leader in my field in terms of skills and knowledge.
    I will achieve this goal by making sure that use my experience in equipment management
    to make sure that I minimize equipment damage and/or hazards lab. I will use my
    communication skills to build rapport with the staff, management and the students.
    Lastly, I will make sure that I work an extra mile and I don’t just limit myself
    to the scope of my duties.Alternate AnswerI have enrolled with the University
    of South Africa to study law part-time, so in 5 years I would like to see myself
    having a law degree.Example of a bad answerI would like to see myself as head
    of department so that all the managers can report to me and I can use my leadership
    skills to lead the department to greener pastures. Don’t say such things or at
    least do not say it with this tone.◆◆◆Question: what do you know about our company?AnswerYour
    company is very well known for your customer service, and you also won an award
    for best customer service in the country and of course you have the best clientele.Alternate
    answerYour company is one of the top global beer companies, it has a range of
    over 200 beers, including popular international brands such as Kay Millerz, Kingo
    and Kaymo Genuine Draft, and local ones such as Berri and Jayro Milk Stout.NotesKnow
    the company in and out. You do not have to try and memorize all the names and
    dates, but you should have a good understanding of the company. Do research on
    people who will be interviewing you. Read a section on how to research a company.◆◆◆Question:
    Why do you want to work here?AnswerThe company’s reputation is one of the reasons
    why I want to work here. Your company is one of the top global beer companies,
    it has a range of over 200 beers, including popular international brands. It would
    be one of my biggest achievements to be part of your production team. I believe
    that with my three years’ experience of working as an analytical chemist and my
    advance certificate in production and operation management, I can have a positive
    impact on the team and help the team to reach their goals. While at my previous
    company, I never missed a dead line and I always reached my goals which is evident
    from my reference letter.Alternate answerI have a lot of experience in this sector
    and for the past six years I have worked in house insurance where I have consistently
    been the top achiever. I also want to join your company because I believe in the
    company values of contribution to the team and to the community as well as putting
    the customer first. I have actively spoken to people in your organization and
    I understand the amount of effort and passion your people put in to acquire new
    customers and serving existing ones. I have recently received an award from my
    current employer for fixing customers problems and it’s with this reasons that
    I believe that I am fit for the job.NotesShow that you are passionate about the
    job and/or the company. Tell them what you love about the company and how your
    skills and knowledge make you a perfect fit. Try to find a specific feature that
    the company prides themselves on.Remember companies needs to benefit from you
    and your hard work if they hire you. It is all about their needs so tailor your
    answer in such a way that you show them what you can do for them.Research the
    company and show them that you want to be part of their success and how you think
    your skills are in line with what the company is doing.◆◆◆Question: You don’t
    have enough experience?NotesDo not let this question intimidate you. Remember
    they know that you do not have enough experience. Never make the mistake of thinking
    that maybe they don’t know that you do not have enough experience. They know,
    and they still invited you for an interview. There is one specific thing they
    liked about your CV, and even though you do not have enough experience they think
    that whatever it is that they saw from you is more important. So, you have a big
    plus there; the only thing that you need to do now is to show that you are willing
    to learn fast to compensate for the experience you do not have and that is exactly
    how you are going to answer this question.AnswerYes, I don’t have that much experience,
    but I am willing to learn. When I started working at my previous company, I did
    not have experience at all and I had to use instruments that I had never used
    before in only a month I knew how to operate all the instruments and after three
    months I was put in charge of the dissolution instruments and after 10 months
    I wrote a blog on how to operate these instruments. I learnt how to use these
    instruments quickly because of my people skills and my communications skills and
    from reading a lot of books and articles on how to operate these instruments and
    I summarized these books and articles to create a blog.By communicating effectively
    with everyone and having outstanding people skills, all my colleagues enjoyed
    helping me learn how to operate the instruments. So, I combined what my colleagues
    have taught me and what I have read in the books and in a month, I knew how to
    operate the instruments. So, when you hire me, you can expect that I will know
    everything about my work within a month.Also, I have a three years degree in Meteorology
    from the University of Cape Town. In my degree in meteorology we covered all aspects
    meteorology and the instruments used. The modules that we did include: Atmospheric
    Science, Atmosphere Dynamics, Ocean and Atmosphere interaction, Climate Change,
    Clouds and Weather Forecasting, Weather and Climate and more; and we even dealt
    with meteorological instruments in detail. I have also worked for a small company
    called SAWS where we were given meteorological training which equipped me with
    all the knowledge and technical skills needed to be a meteorological technician
    and I passed all my tests above the required average of 85%.◆◆◆Question: Why do
    you want to leave your Job?NotesThis question should be very easy to answer, just
    remember to always be positive. Never talk bad about your employer or anything
    for that matter. Being positive will make you have an attractive personality.
    Be honest; however, do not give a reason that will make the interviewer lose interest
    in you. Avoid saying things like: the money is not enough, or it is not a nice
    environment to work in or the manager there has poor leadership skills and you
    didn’t get along with him. Although these reasons might be true, they are just
    too negative. They make you look like you hate your employer. Don’t be a hater.
    Nobody likes a hater and companies do not want to invest in haters – true story.If
    you were let go, be honest, explain the situation in a positive way and keep it
    short. Never try to hide it. Interviewers will not reject you because you were
    let go, No! Everybody has failed before and everybody should fail once in a while
    because failure helps grow. Failure shows you that you were doing something wrong
    and now is time to change. This is how we grow. The more you fail or make mistakes
    the more you grow. You learn from your mistakes. If you try to hide the fact that
    you were let go then that just means that you did not learn anything from you
    mistake and you will continue doing the same mistake again and you will lose another
    job.To answer this question, you can tell them about a specific characteristic
    that the company has that attracted you and you want to be involved with those
    characteristics.AnswerI would like to take on more responsibility as a supervisor
    to grow and advance my leadership skills which is one of the things that attracted
    me to apply for this position in the first place. As I have already mentioned,
    I have a certificate in Production and Operation Management which equipped me
    with leadership skills, and I have experience of mentoring new employees from
    my current company. Now I feel like it is time for me to take more responsibility.Alternate
    answerI would like to work in production. As I have already mentioned, I have
    a certificate in Production and Operation Management. I would like to grow my
    career in this field. Nice and short.Alternate answerI am looking for a permanent
    position.Notice that this is the same as saying my manager does not want to give
    me a permanent position but in a more positive way. Remember, never be negative.Alternate
    answerMy contract is coming to an end in May or I want to work closer to home
    or me and my wife are moving this side of town, so I would like to be closer to
    work.◆◆◆Question: Describe a difficult work situation and what did you do to overcome
    it?AnswerThe most difficult time I had at work was when I started working; there
    was this guy who was a senior and kept giving me his work. That put me in a very
    difficult position because I was new in the corporate world, straight out of college
    and I was not sure if he was allowed to do that because he was very close to the
    manager. I thought he was an assistant manager.To solve this problem, I decided
    to use the situation to my benefit. I decided I am going to ask him everything
    he knows about the instruments, the work and the company and because he wanted
    me to do his work, he gave me every knowledge and skill he heard.The results where
    amazing. My manager notice that I know almost everything about the company, I
    even had information that most senior people don’t know so he promoted me to senior
    and me and the guy became best friends because now we were working together.NotesWorkplaces
    are full of problems, a lot. Employer wants to know if you will be able to deal
    with them. That’s all that there is to this question, it is a fair question. Fair
    and challenging. Just make sure that you display your ability to solve problems
    and make good decisions. Give a problem that you managed to fix. You can actually
    use this question to display other skills as well like communication skills but
    do not get lost in the sound of your own voice and start rambling.◆◆◆Question:
    what is your biggest mistake?NotesMistake happens. We all make mistakes and we
    will keep on making mistakes. Even the people who will be interviewing you make
    mistakes, hell; you might even find that they make more mistakes than you. So,
    do not stress too much about this question, the interviewer is not asking you
    this question so that they can laugh about it as soon as you walk out, No! They
    have a life you know. Interviewers, like everybody else, know that everybody makes
    mistakes. What they are looking for is to see how you react to mistakes.Now, how
    are you supposed to react to mistakes? A good way to react to mistakes is to learn
    from your mistakes. If you make a mistake and you do not learn from it, you are
    going to keep on making the same mistake again and again and again and again;
    and when you think that you are done making the same mistake over and over, you
    are going to make the same mistake again. Now, you tell me. Do think that employers
    want to hire someone like that. I hope your answer is No!Anyways, let us continue
    about the mistake story. You are going to keep on doing the same mistake until
    you learn from it and practice not to do the same mistake again. That is the way
    you should answer this question. You tell them your mistake and you tell them
    how you fixed it and what you learned from it.This is called personal grow. It
    is a very important skill in life. It is how we grow, from our mistakes and interviewers
    want to know if you have this skill of continuous growth. Remember aging is not
    growing. Your interviewers know this very well and they want to see if you are
    growing or you are just very good at aging. Or, maybe your interviewers do not
    know this, I don’t know but at least now you know, and I know that you know.Tip:
    you can tell of a past work mistake that you fixed and pick a situation that is
    could arise at the new company.AnswersThe biggest mistake I have ever made was
    to fail my major in University. In 2011, I was supposed to graduate with chemistry,
    but I failed it. It was terrible, failing is not nice. My mistake was that I was
    too playful, I would download movies and TV series and watch them all day and
    not study. To fix this mistake I had to cut out the distraction, so I left my
    laptop at home when I went back to varsity in 2012\. This was the toughest thing
    I had to do in varsity but also it is also one of the best decisions of my life
    because I then realized that I had too much free time, so I registered two more
    majors and at the end of the year I passed all three majors and I graduated with
    a triple major degree in chemistry, oceanography and atmosphere science.Killed
    it. Next!◆◆◆Question: What is your biggest failure?NotesEverybody has failed at
    least once in their life so never say that you have never failed before. Give
    the answer on something that is not work related and it should be something you
    were able to fix later. Do not mention personal qualities that can affect you
    getting the job like talking about how lazy you were. Try not to mention some
    big failures, our failure helps us grow but that does not mean that you can go
    around telling the interviewers about worst failure ever. Answer strategically.AnswerMy
    biggest failure was in varsity when I tried to major with 3 totally different
    majors: Mathematics, Chemistry and Geology. Each course on its own is very intense.
    Measuring with the three of them simultaneously is way too intense. I could not
    cope and so I failed mathematics. To make up for my failure I did a winter course
    in word power and aced it.Alternate answerMy biggest failure came when I started
    working for NTM. I was an account manager there and I lost an account worth half
    a million. I was stressed and kept on thinking this is the worst mistake I have
    ever done. To fix this mistake I used one of my greatest skills which is effective
    communication. I called the client and asked what went wrong and he told me that
    he was not happy with our service ever since he started working with us. I asked
    him to make a list of all the things that inconvenienced him, and he should give
    us another try. I told my manager what happened and that we should provide training
    on those areas that we were lacking. The results were that at the end of the year
    when we sent out client satisfaction review, all our clients were fully satisfied
    with us and they said they would recommend us to other companies.◆◆◆Question:
    How would your previous boss or colleagues describe you?NotesThis is a personality
    test question. The main aim of this question is to find out how you build relationships
    with your management team and colleagues. The interviewer is trying to see if
    you have good work ethics and good people skills which are the two big requirements
    for most jobs. What this question is asking is that if somebody were to ask your
    previous colleagues or boss to describe you, what would they say. Be confident
    when you are answering this question to show that you are indeed the person you
    claim that you are.Do not just use any random comments that people have used to
    describe you. Keep in mind the kind of person they are looking for and fit your
    answers to meet their requirements. Refer to the most common skills that recruiters
    look for above, however, remember that every job has its own requirements so answer
    accordingly. Be honest because they will be contacting your references.AnswerMy
    colleagues say that I am an excellent communicator, I really listen when people
    talk, and I empathize with people. My supervisor has described me as a very hard
    worker and a good communicator, I am dependable, I always achieve results and
    that she would happily re-employ me. This is evident on my reference letter.Alternate
    answerWhilst working for my previous employer as a lab analyst. The company had
    a lot of clients and they brought in a lot of work. During the festive season
    a number of people took leave which left us short staffed and it was a very busy
    period.To make sure that we do not fall behind schedule I took extra responsibility
    by working during my lunch break and after hours, I worked on multiple tasks to
    cover the work of those who were absent, and I supported the other team members
    who were drowning in the pressure.My manager was proud of me for my hard work,
    determination and my ability to handle an enormous amount of pressure. This is
    how my previous colleagues would describe me.◆◆◆Question: How would you describe
    your work ethic?NotesWork ethic is a set of moral principles an employee uses
    in his job. With proper work ethics, a person becomes more responsible and focused
    towards the job. A solid work ethic is vital to a company achieving its goals.
    To ensure that a company functions at its best every employee must have a good
    work ethic. Answer this question with examples that show that you have good work
    ethic and habits.AnswerI am a responsible, dedicated and hard-working person.
    At my last job evaluation, my manager rated 100 percent for all these qualities.
    Here is proof of my evaluation (provide the document).◆◆◆Question: Are you currently
    interviewing with any other companies?NotesThe interviewers want to know if you
    are high in demand Make sure that you answer in way that does not make you sound
    desperate, however, also make sure that you do not sound like you are not serious
    about the company that you are interviewing with.AnswerSo far, I have interviewed
    with two other companies within the same industry.Alternate answerI have applied
    to other manufacturing and quality control companies.◆◆◆Question: Are you willing
    to travel or relocate?NotesIf you are willing to travel or relocating then you
    are good but if you are not able to, then try to find out where exactly do would
    they want you to relocate to or how much do they want you to travel before you
    say no. You might find that it is actually not that bad.AnswerI do not mind traveling
    or relocating. To where about would you want me to relocate to and how often do,
    I have to travel? Remember, it is a conversation.◆◆◆Question: What was the most
    difficult decision you had to make?NotesYou can tell a lot about how a person
    handle difficult situation and what type of decision they make which the interviewers
    are why are asking these questions. Give an example of a time you had to make
    a difficult situation and how you handled it.The most important thing about decision
    making is getting as much information as possible, analyzing the information thoroughly
    and confirming the information and the analysis with other people. Basically,
    making an informed decision is the key to making a good decision. An informed
    decision is a good decision.AnswerThe most difficult decision that I had to make
    was in 2013 when I had an offer from the University of Pretoria to study honors
    and at the same time, I got a job offer. This was the most difficult decision
    ever. To make this decision, I tried to get as much information as possible by
    asking my older brother and sister for advice, I wrote the down the points they
    gave me then I analyzed them. I made a decision based on my knowledge and the
    knowledge that I got from my brother and sister. After I made the decision, I
    wanted to confirm with someone to make to make sure that I am making the right
    decision, so I went to mentor, Kyle, who advised me that my decision is fine based
    on what I had written down. The results were that I left varsity and I went to
    work, I got the working experience which is what I wanted and now because of this
    experience I can get more job offers while studying part time.◆◆◆Question: What
    type people do you not like to work with?NotesBasically, the interview is trying
    to see if you will be a good fit to the team or not. Do not eliminate yourself,
    answer appropriately. Interviewers can use this question to see what kind of a
    person you are, for example, if you are a lazy person then your answer might sound
    something like: ‘I do not like working with somebody who just never stop working’.
    That is a no no. The best way to answer this question is to tell the interviewer
    about the kind of people you like to work with. Remember being positive is the
    key. One way to be a positive person is to stop using negative words, words that
    negates like: No, do not, will not, cannot, etc. Have a “can do” attitude.AnswerI
    would like to work would with a considerate person because I am also very considerate.
    I believe that if the person I am working with is considerate then team work would
    be very effective. Also, I would like to work with someone who is keen to keep
    learning and advance their career so that they won’t feel overwhelmed when I suggest
    that we take extra duties.Question: What have you done to improve your skills
    and/or knowledge in the last year?NoteFrankly, interviewers would like to hire
    someone who values personal grow and development. They want someone who is continually
    growing themselves, their skills and personal attributes. The good news is, it
    is never too late to start. You can buy a book now on a skill that you like to
    improve or browse the internet for articles on that particular skill or register
    course (online course, part-time course or full time, whatever butters your bread).
    Also join organizations relevant to your field so that you can stay updated. I
    recommend registering for a course. I will explain why in my other book.Put more
    emphasis on skills and/or knowledge that is relevant to the job requirements,
    however, also mention those that are not relevant to show that you are not a laid-back
    but a proactive kind of person. You are not being interviewed to become a couch
    potato, you are being interviewed to become a worker. Mention also self-studying
    and explain in detail if you do not have proof.AnswerI have been working on my
    communication skills for the past two years. I have read countless articles online
    about being a great conversationalist or just any other article in general that
    talks about communication. I have also read a few books on this topic, my favorites
    are ‘brilliant communication skills’ by Gill Hasson, ‘Effective communication
    skills’ by Alan Barker and ‘Good communication skills’ by James k. Van Fleet.Alternate
    answerI took a part-time course with Unisa for an advance certificate in production
    management to improve on my knowledge in the production field and also to improve
    my leadership skills.I have also registered with the South African Chemical institute
    and the Royal society of chemistry to ensure that I continue growing in my field
    and stay up to date. I have also registered with the South African Council for
    Natural Scientific Professions to be a level A certificated natural scientist
    – awaiting confirmation.Alternative answerI have volunteered to work as an environmental
    officer at Rampsy Consulting Laboratories for two months to get relevant work
    experience, skills and knowledge in this. Rampsy Consulting Laboratories is one
    of the big mining companies in the country. The skills and knowledge that I gained
    in these two months are priceless. I learned about environmental mining related
    policies and how to implement them, species protection policies, environmental
    laws and environmental hazards including pollution.◆◆◆Question: Do you know anyone
    that works for our company?NotesYou might have seen this question on application
    forms before. There are companies that prefer hiring people who are related to
    the current employees. Some companies just feel better knowing that there will
    be someone mentoring you, so you will adapt quickly. Just make sure that the person
    that you are mentioning is on good terms with the company otherwise you can pay
    for his sins.Tell them more information about this certain somebody that you know
    and display their good skills and attributes. Interviewers might associate these
    good qualities with you. This is the same psychology that advertisers use on us.
    They use a popular and lovable celebrity to advertise their product and then because
    you love that celebrity you will also love the product. You might not know that
    you love the product yet, but believe you me, you do. This is because this type
    of psychology works with your subconscious mind. Your subconscious mind is the
    part of the mind that is responsible for thinking about things that you do not
    know that it is thinking about, and you will never know. Your subconscious mind
    is not the little voice inside you that tells you what to do and that part of
    you that always wants to do the opposite, or that deep far away mind. NO! The
    subconscious mind is that part of mind that you will never know what it is thinking.
    End of story. So, now you tell me; how are the interviewers going to know that
    their subconscious mind is associating the good qualities with you if they do
    not have a clue of what is happening in their subconscious mind?AnswerYes, my
    friend and mentor, Johannes, works for the company. He is the one who told me
    about this position. He told me about the work environment the company has and
    how strict the company is about data integrity and how you provide growth for
    your employees which is what attracted me the most about this position.◆◆◆Question:
    How long do you want to work for us?NoteThis is not an easy question. It takes
    a lot of money to hire someone. The company has to pay for the people interviewing
    you, the training, equipment and they have work out your salary. They want someone
    who is not going to waste their money. Tell them few positive things about their
    company and mention vaguely that do not want to leave.AnswerYour company is one
    of the leading companies in my field, it provides growth and the environment is
    perfect for me. I know I will be satisfied here.◆◆◆Question: Do you work for money
    or job satisfaction?AnswerI work for job satisfaction. We spend over seventy percent
    of our lives in the workplace so if I am not satisfied with my job then that would
    mean that I am not satisfied with the most part of my life.◆◆◆Question: What is
    your ideal job?NotesIf this is not your dream job, then make sure that whatever
    you say relates to the job you are applying for. The best way to answer this is
    to describe the skills that your ideal job requires which should be very similar
    to the job that you are interviewing. Do not give a job title, for example, if
    you are applying for insurance sales positions, do not say things like my dream
    job is being a pilot. They will tell you to fly out.AnswerMy ideal job is working
    in a chemistry related field and should include mentoring, communication and managing.
    As I have already explained, one of my greatest skills in communication, I would
    like to work in an environment where I will be able to talk to people now and
    then. Also, I like mentoring and managing people because it helps me grow. When
    mentoring people, you have to learn to view things the way the other person sees
    it, this makes you sophisticated, which is what I enjoy.◆◆◆Question: Are you willing
    to work overtime?NotesNotice that the interviewers are not saying that you will
    be working overtime they are just asking if you are willing to work overtime.
    Do not eliminate yourself. Saying no might suggest that you are not a hard worker,
    or you are not willing to make sacrifices for the company or you are just lazy.
    Unless if you give a very good reason.AnswerI am very flexible. I would not mind
    coming to work on weekends if I am needed. I used to go to work on weekends at
    my previous. There was this one time in particular, when the UV machine broke
    so we could not work. The technician fixed the machine of Friday and we could
    not finish all the work that has been piling up during the week. To solve this
    problem, I went to work on Saturday and Sunday to try and clear up the work load
    for the following week. Well, I did not finish the job, but I did at least seventy
    percent of the job.◆◆◆Question: What did you dislike about your previous job?NotesDo
    not talk negatively about anyone at your previous job or about the job itself,
    this includes salary, long hours or the environment. In fact, never be negative,
    not just for the interview; the world reacts negatively towards negative people,
    but this is a story for another book.Here is something interesting. Just because
    you did not like something about the job then that does not mean that the job
    is the problem. It might be that you are the problem. Try to find something that
    was good about your previous job that you did not like. Make sure that whatever
    it is that you do not like, it is not a requirement for the current job you are
    interviewing for.The interviewers use this question to see if there is something
    in particular that you do not like because the job might include that same sort
    of thing. This question can eliminate you if you do not answer correctly because
    for example, if the company wants someone who can work overtime, and you say that
    you hated overtime in your previous job then what you are saying is that you are
    going to hate your new job and you will be interviewing again very soon with another
    company. Make sure that the company you are interviewing for does not have the
    thing that you disliked in your previous company before you answer.AnswerWorking
    for Rampsy Consulting Company was very nice and relaxed. We spent the whole day
    in the office doing paperwork which is good, however, I am a hand on kind of person,
    and I prefer being in the lab solving problems.◆◆◆Question: What is your greatest
    achievement?NotesPick an accomplishment that will show you how valuable you will
    be for the position that you are applying for. Know the key components that the
    company is looking for in an individual and make sure that your accomplishments
    relate to this. If you do not have any relevant accomplishment then just say any
    accomplishments, however, try and connect it to the job requirements.The key here
    is to impress the interviewer. State your achievement and tell them how you managed
    to do it. The sample answers for this question are from someone who only has two
    years of experience in the field so they do not a lot of achievements, but they
    should give of sense of direction for when answering this question. If you have
    enough experience and a lot of achievements, then make sure you share them. Achievements
    will definitely make you stand out to, use them to shine.AnswerAfter only three
    months of working at my previous company, my manager asked me to be part of the
    team that was responsible for creating standard operation procedures (SOPS) to
    make sure that the laboratory operates effectively. Also, months after working
    at my previous company I was very knowledgeable on the instruments that I made
    my own analytical chemistry blog. My blog explains some of the laboratory equipment
    to give knowledge to people around the world.I managed to achieve these accomplishments
    because I worked an extra mile to get to know all the laboratory equipment and
    procedures. I was reading up on the instrument every day after I knock off for
    the first six months. This took a lot of discipline. Also, communicating effectively
    with my seniors to that I can understand how the lab operates and how to troubleshoot
    the when an instrument is giving problems and how to prevent future problems.
    It was not easy at first to learn all this information and procedures in such
    a short period time, but I was really persistent, so I focused and powered through.Alternate
    answerI think my greatest accomplishment in my previous job when I was mentoring
    new employees. Mentoring is one of my key strengths and one of the things that
    attracted me to this position.All the new employees that I have mentored have
    advanced to become permanent staff. The key steps that I used to achieve this
    accomplishment are communication and leading by example.I listened actively to
    what they know and what do not know so that I can explain to each and every one
    of them, individually, what they needed to know, and I also gave a lot of practical
    examples so that it will be easier for them to remember. leading by example can
    actually solve a lot of problems related to emotional intelligence, but then again,
    this is a story for another book.◆◆◆Question: What relevant experience do you
    have?NotesThis question can be very intimidating to people who do not have relevant
    experience in the field that they are being interviewed for and as a result they
    start to panic. This should not be the case. If they have called, you for an interview
    then they know that you do not have the relevant experience and they are thinking
    of hiring you anyways so do not let this throw you off.They are just asking this
    question because it is protocol. If they wanted to eliminate you because of experience,
    then they were not going to short list you in the first place. It is easier that
    way. And do not think that maybe they did not see that you do not have the relevant
    experience, they saw. Interviewing people takes time, money and effort. So, they
    really know who they are interviewing, they know for sure. Unless if what you
    are saying is that interviewers like wasting their time, money and effort.If you
    do have the relevant experience then focus your answer on the positions, skills
    and responsibilities that are relevant to the job that you are applying for. This
    can be skills or responsibilities that you learnt anywhere, it does not have to
    be at work. Show them that they would gain from your experience.AnswerI have two
    years’ work experience as a laboratory analyst. The experience that I gained includes:'
  toc: []
  trans: "\n这是面试中最重要的原因。你所有的面试回答都应该围绕证据（成功案例）。记住，简历是你生活的非常简的总结，因此他们希望你对此进行详述。例如，如果他们问你为什么要雇佣你，他们已经从你的简历中看到你在特定领域拥有经验，并且知道这就是他们需要雇佣你，但他们只是希望你用成功案例（证据）来支持这些经历，并在可能的情况下提供确凿的证据。如果你没有书面证明来支持简历上的某些技能和/或经验，也不要担心，支持你观点的最常见方法是讲述成功案例，这就是他们需要的全部证据。你将在下面的问题中看到，用成功案例支持你的答案是多么简单，但首先，让我们来看看面试的结构。\n\
    \n# 职位面试的类型\n\n### 电话面试\n有时这被用作招聘流程，如果你通过了电话面试，将受邀参加另一次面试。请以与任何其他面试相同的专业方式处理每一次电话面试。从专业地接听电话开始。不要太花哨，一句真诚的“你好”就足够了。就像电子邮件地址一样，你的语音箱留言/自动答语音也应该是专业的。\n\
    \n### 面对面面试\n这也可以招聘流程的一部分，如果你通过了它，将受邀参加另一次面试（通常是小组面试），或者你可能会被叫去参加评估测试。要保持专业并为此做好充分准备。有些公司没有冗长的招聘流程，这可能是你参加的唯一面试，之后你就会获得录用意书。好吧，希望确实如此。\n\
    \n# 准备面试\n让一切都围绕着你的技能、资历和经验展开。\n\n### 研究公司\n当你研究公司时，不要只是浏览他们的网站，要挖掘得更深一些。这将帮助你恰当地回答他们的问题，并帮助你展示你对公司的兴趣，从而使你从那些没有投入时间进行研究的候选人中脱颖而出。研究公司还将帮助你为面试官准备问题。\n\
    \n### 将技能、资历和经验与职位描述匹配\n这是面试准备中非常重要的一部分，因为问题将围绕职位要求和职责展开。面试官会通过提问来查看你是否具备所需的特征，以及你是否能够履行职责。将你的技能和资历与工作的要求及职责相匹配，将让你清楚招聘人员在寻找什么样的特征，以及你将被要求承担哪些职责。这将帮助你了解要求的特征中你拥有哪些，不具备哪些，以便你开始研究并学习那些你不具备的特征。这里的诀窍是，千万不要对面试官撒谎你不具备的特征；要诚实并告诉他们你将竭尽全力去学习。\n\
    \n关于这些技能的书籍数胜无数，确保你每天阅读这些书籍以自我提高和发展。如果你没有时间读书，至少在面试前读读关于这些技能中每项的文章。记住，这些只是常见技能，公司还会要求更具体的技能，例如高级\
    \ `excel`。\n\n### 研究职位描述\n确保你了解职位描述中写的所有关于工作职责。问题将集中在职责上，有时招聘人员可能会问非常具体且具有挑战性的问题，例如，如果其中要求之一是具备\
    \ `AWS` 知识，招聘人员可能会问：`AWS` 主板的输出电压是多少。这可就深了。不过不用担心，对于高级职位，招聘人员会转问更具体的问题，有时招聘人员只是想看到你的思考过程。基本上，职位要求就像考试大纲，它告诉他们他们将测试你什么，你必须去刻苦钻研。如果要求之一是具有操作\
    \ `hplc` 机器的经验，而你对该机器完全零经验，那么你需要确保在去面试时已经读过该机器，并且对该机器有深入的知识。当被问及机器时，千万不要撒谎说你有经验，不！直接告诉他们你没有该机器的经验，但你对该机器的工作原理有很好的理解，然后继续展示你通过阅读该机器所获得的知识。现在你知道为什么投入大量时间准备是非常重要的了。\n\
    \n### 准备成功案例并烂熟记于心\n在回答面试问题时，使用 `SARS` 方法。`SARS` 代表 `Situation`（情况）、`Action`（行动）、`Results`（结果）和\
    \ `Summary`（总结），这意味着尝试突出显示你所面临的 `Situation`、你所采取的行动、结果，然后总结你的故事，以展示它如何与问题相关，可能以及学到的教训如何应用到你申请的工作中。\n\
    \n保持主题，与其漫乱无章，宁愿完全什么都不谈。不要只谈论你的技能；要向他们展示你的技能如何为公司造益，例如，不要只说我有气象学的 `BSc` 学位，而要说：“我有气象学的\
    \ `BSc` 学位，可以从许多方面为公司受益。”看看公司想要什么（职位职责），并告诉他们如何为他们做到。将你的特点与他们的需求匹配。你增加了什么价值（你还有哪些其他对公司有利的价值）。\n\
    \n# 常见面试问题及示例答案\n\n### 问题：介绍一下你自己\n**备注：** \n面试官并不是让你讲述你的人生故事，他们希望你告诉他们与你申请的职位相关的性格特征。这包括你的经验、资历和技能。不要谈论你喜欢或不喜欢什么。告诉他们你拥有与工作相关的经验、技能和资历。关注你的技能。记住，你要保持答案简洁且切中重点，所以如果你有很多经验或技能，请提供与工作相关的，展示它们将如何让你受益，从而使你成为最佳候选人。每当你谈到你的技能、教育或经验时，确保提到它是如何使他们受益。给他们一个关于你的经验、教育和技能的简要总结，这与简历中的内容完全一样。如实说即可。\n\
    \n**回答：** 我拥有开普敦大学的化学 `BSc` 学位。我还有一份`运营与管理` 证书，这使我具备提高生产力的员工技能。我有两年实验室分析师的工作经验，期间我获得了在使用\
    \ `HPLC`、`XRF` 等现代仪器等方面的丰富实践经验。在我的上一家公司，我负责编写标准操作程序 (`SOP`) 和管理实验室设备，我成功将实验室事故数量减少了\
    \ 5%。我会说我的主要优势是我的沟通能力，这在我的推荐信中显而易见。\n\n### 问题：你的经历中为什么有一段空白？\n**备注：** \n尽量不要给出与疾病相关的答案，除非你有证明文件。如果你是被解雇的，那么你必须诚实。记住始终保持积极，面试官在邀请你面试之前就已经看到这段空白了。回答这个问题的好方法是告诉他们你在空白期内所做的积极事情，因为这听起来可能像在撒谎。\n\
    \n**回答：** 公司在缩减规模，他们不得不辞掉所有的兼职人员。我是其中之一，但在离开之前他们给了我一封推荐信。这是我的信。在空白期，我写了一本关于思考的小说，并在\
    \ `Kindle` 上出版了。\n\n**另一种回答：** 我休息了一段时间来照顾由于医疗问题需要照顾的姐姐。这是证明。在空白期，我参加了普勒托利亚大学的在线课程以不断增加我的知识。\n\
    \n**另一种回答：** 在离开 `Rampsy Consulting` 的工作后，我决定我想旅行。我去亚洲呆了两个月，然后在美国呆了两个月。这帮助我有了开阔的视野。\n\
    \n### 问题：你有……的经验吗？\n**备注：** \n面试官会问你是否具有他们寻找的特定技能的经验，即使他们在简历中看到你拥有该技能。他们必须问，这是流程。如果你没有这项技能，不要犹豫说“不”。\n\
    \n**回答：** 没有，不过这不是问题；我有很强的学习意愿，而且适应能力很快。当我开始上一份工作时并没有任何经验，那份工作需要特定仪器的技术经验，但在两个月内，我已经自学了如何操作所有仪器。三个月后，我被负责管理仪器，十个月后，我写了一篇关于如何操作这些仪器的博客。我很快学会了使用这些仪器，是因为我良好的人际技巧和沟通能力，以及阅读了大量关于操作仪器的书籍和文章，并总结了这些书籍和文章创建了一个博客。通过与每个人有效沟通并拥有出色的人际技巧，我同事都乐于帮助我学习如何操作仪器。我将同事教给我的和我从其他书中读到的知识结合在一起。\n\
    \n**另一种回答：** 是的，我有操作 `HPLC` 机器的五年经验。\n\n### 问题：你有……的证书吗？\n**备注：** \n面试官会问你是否具有他们寻找的特定技能的经验，即使他们在简历中看到你拥有该技能。他们必须问，这是流程。如果你没有这项技能，不要犹豫说“不”。\n\
    \n**回答：** 没有，不过这不是问题；我有很强的学习意愿，而且适应能力很快。我。当我开始上一份工作时并没有任何经验，那份工作需要特定仪器的技术经验，但在两个月内，我已经自学了如何操作所有仪器。三个月后，我被负责管理仪器，十个月后，我写了一篇关于如何操作这些仪器的博客。我很快学会了使用这些仪器，是因为我良好的人际技巧和沟通能力，以及阅读了大量关于操作仪器的书籍和文章，并总结了这些书籍和文章创建了一个博客。通过与每个人有效沟通并拥有出色的人际技巧，我同事都乐于帮助我学习如何操作仪器。我将同事教给我的和我从其他书中读到的知识结合在一起。\n\
    \n**另一种回答：** 是的，我有操作 `HPLC` 机器的五年经验。\n\n### 问题：你最大的优势是什么？\n**备注：** \n要具体，并给出一个与工作相关的例子，展示你的优势与他们正在寻找的匹配。如果你已经在简历中提到过它，不要担心，再次提到也可以。确保你的答案有支持。\n\
    \n**回答：** 我会说我的主要优势是我的沟通能力，这在我的推荐信中显而易见。\n\n### 问题：你最大的缺点或需要改进的地方是？\n**备注：** \n\
    每个人都有弱点，但不要说一些完全像酒精那样的事情。面试官只是想看看你是否具有自我意识，或者你是否愿意改进它。选一个你拥有的弱点，不要负面地谈论。\n\n**回答：**\
    \ 我的弱点是缺乏组织能力。这个缺点很耗时，因为我曾花了一整天去寻找。我改进的方法是返回到哪里。\n\n### 问题：你如何应对压力？\n**备注：** \n\
    面试官想看看你是否是一个在压力下工作良好的人。给出一个你在压力下工作的例子，并使用 `SARS` 格式回答。\n\n**回答：** 我绝对可以在压力下工作。在之前的公司，我处理不同的任务，这帮助我有效地管理时间。\n\
    \n### 问题：你如何做重大决定？\n**备注：** \n这个问题的主要目标是了解你是如何建立关系的。面试官正试图看你是否具有良好的职业道德和人际技巧。如果他们问你之前的老板或同事如何描述你，要自信。\n\
    \n**回答：** 我非常擅长做重大决定。我使用的策略是权衡利弊。我确保我有尽可能多的信息以便做出明智的决定；这包括从团队成员那里获得可能的建议。这非常重要。在决策和解决问题方面，我强调在做决定之前尽可能询问信息的重要性。\n\
    \n### 问题：你为什么在我们公司工作？\n**备注：** \n告诉他们你喜欢公司的地方。\n\n**回答：** 我渴望在贵公司工作，因为我相信我的背景和技能可以为公司的成功做出贡献，确保我完成了要求的一切并付出额外。是的，我的朋友兼导师\
    \ `Johannes` 在公司工作。是他告诉我这个职位的。他告诉了我公司的工作环境，公司对数据完整性的严格程度，以及你们如何为员工提供增长，这就是最吸引我这个职位的地方。\n\
    \n### 问题：未来 3 到 5 年后你希望自己处于什么位置？\n**备注：** \n面试官想看到你是一个有方向和目标的人。他们还想看你是否愿意投入公司，还是你只是想在这个职位上消磨时间寻找更好的。确保你的答案显示你的目标和方向将为公司带来价值。设定现实的目标。不要说你想看到自己被晋升或你想处于管理位置。回答这个问题的最佳方法是看你可以如何为职位做出贡献，以及你如何从职位中成长，然后沿着这些思路回答。要具体，将你的职业目标与公司可能的特定职责挂钩。另一个好方法是谈论你的学习。告诉他们你希望在未来五年完成什么样的资历。你也可以陈述你的目标，然后给出你如何实现它的步骤。对公司内部为你开放的职业路径进行研究。\n"
