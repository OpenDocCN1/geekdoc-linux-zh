    # Accounting

    Business, Finance, Profit, Growth, Wealth... Accounting is the language of business.
    Accounting is the collection, compilation, and systematic recording of transactions
    of a business to produce financial statements. Financial statements summarize
    a company''s financial position. The main accounting equation `Assets = Liabilities
    + Equity` is the proposition that a company''s assets must be equal to the sum
    of its liabilities and equity. Accounting helps organizations understand their
    health by keeping track of expenses, profits, and losses. Accounting doesn''t
    require hard core math. Basic addition, subtraction, multiplication, division
    are enough. However, accounting is a bit more difficult than finance due to its
    strict sets of rules.


    ## Types Of Accounting

    - Financial accounting.

    - Cost accounting.

    - Managerial accounting.

    - Tax accounting.

    - Fiduciary accounting.

    - Governmental accounting.

    - Corporate accounting.

    - Public accounting.


    ## Financial Accounting

    Financial accounting is a specific branch of accounting that provides information
    about a firm''s performance to external parties such as investors and creditors.


    ## Cost Accounting

    Cost accounting is a process of assigning costs to objects such as the company''s
    products, services, and any other activities. It helps identify where a company
    is spending money and where money is lost.


    ## Tax Accounting

    Tax accounting deals with the preparation of tax returns and tax payments. It
    is used by individuals, businesses, corporations, and other entities focusing
    on income, deductions, and any investment gains or losses.


    ## Managerial Accounting

    Managerial accounting is responsible for creating statements, reports, and documents
    that help management in better decisions related to business performance.


    ## Fiduciary Accounting

    Fiduciary accounting is a report of activities within a trust, estate, or conservatorship
    during a specific period to show all receipts and expenses managed by the executor
    or trustee.


    ## Government Accounting

    Government accounting is the accounting system followed by the government for
    recording, classifying, and interpreting the financial transactions of the government.


    ## Forensic Accounting

    Forensic accounting is the use of accounting principles, auditing principles,
    and investigative skills to examine the finances of an individual or business
    to look for fraud and embezzlement to explain the nature of financial crime in
    court.


    ## Corporate Accounting

    Corporate accounting is a special branch of accounting that deals with preparing
    cash flow statements and interpreting financial results for specific events.


    ## Accounting Process

    - Identify transactions.

    - Record transactions in a journal.

    - Post journal entries to the general ledger.

    - Adjust journal entries.

    - Close the books.


    ## Main Accounting Keywords

    - Assets.

    - Liabilities.

    - Equity.

    - Revenue.

    - Expenses.


    ## Golden Rules Of Accounting

    - Debit the receiver, credit the giver.

    - Debit what comes in, credit what goes out.

    - Debit all expenses and losses and credit all incomes and gains.


    ## Accounting Software

    - Billing/Invoicing Software.

    - Payroll management system.

    - ERP Systems.


    ## Accounting Entry

    An accounting entry is the formal recording of all the transactions in the book
    of accounts of the company where the debit and credit are recorded. The main types
    of accounting entries are transaction entry, adjusting entry, and closing entry.
    Every transaction has two journal entries: a debit and a credit. Debits must always
    equal credits. This double-entry technique (`debits equal credits`) helps in preventing
    some bookkeeping errors.


    ## Types Of Journal Entries

    - Simple entry.

    - Compound entry.

    - Opening entry.

    - Transfer entries.

    - Closing entries.

    - Adjustment entries.

    - Rectifying entries.


    ## Simple Entry

    A simple journal entry is an accounting entry in which just one account is debited
    and one is credited.


    ## Compound Entry

    A compound journal entry is an accounting entry in which there is more than one
    debit and more than one credit.


    ## Transfer Entry

    A transfer is a type of journal entry used to move funds from one project account
    to another or from an operating account to a project account.


    ## Adjusting Entries

    Adjusting entries are made at the end of the accounting period after a trial balance
    has been prepared. Adjusting entries enable you to adjust revenues and expenses
    to the accounting period within which they occurred. When an error is committed
    in the books of accounts the error should be corrected to show true numbers in
    financial statements. If the error is immediately identified it may be fixed by
    striking out the wrong entry and replacing it with a correct one.


    ## Accounting Principles

    - Accrual principle.

    - Conservatism principle.

    - Consistency principle.

    - Cost principle


    - Economic entity principle.

    - Full disclosure principle.

    - Going concern principle.

    - Matching principle.


    ## Accrual Principle

    The general concept of accrual accounting is that you record the expense at the
    time when it occurs rather than when payment is made or received.


    ## Conservatism Principle

    Accounting conservatism is a principle that requires accounts to be prepared with
    caution. All probable losses are recorded while gains are only recognized when
    realized.


    ## Consistency Principle

    The consistency principle states that once you adopt an accounting method, you
    should follow it consistently in future periods so that results are comparable.


    ## Cost Principle

    The cost principle states that items have to be recorded as the actual price paid.


    ## Economic Entity Principle

    The economic entity principle states that the activities of a business should
    be kept separate from the owner.


    ## Full Disclosure Principle

    The full disclosure principle states that publicly traded companies should release
    all material facts relevant to operations.


    ## Going Concern Principle

    The going concern principle is the assumption that an entity will remain in business
    for the foreseeable future.


    ## Matching Principle

    The matching principle is part of Generally Accepted Accounting Principles (`GAAP`)
    and requires that any expenses incurred must be recorded in the same period as
    related revenues.


