    # 从待办清单开始工作


    自律是一种无论你的身体或情感感受如何，都能强迫自己前进并采取行动的能力。要保持自律并执行计划，需要动力、意志力、坚持和目标设定能力。


    ## 如何提高你的自律

    - 明确定义你的目标。

    - 承诺并言出必行。

    - 避免诱惑。

    - 致力于养成习惯。

    - 阅读。

    - 少参加派对（每月一次）。

    - 意志力胜过情绪。

    - 原谅自己不完美的自己。

    - 保持自发驱动力。

    - 喝黑咖啡。

    - 为一切事情制定计划（列待办清单）。

    - 将你的目标放在每天都能看到的地方。

    - 写下你开始的原因。

    - 先设定小目标。

    - 区分优先级。

    - 了解你的优缺点。

    - 让别人监督你。

    - 认到自律是一个学习过程。

    - 停止拖延，开始行动。

    - 消除干扰因素。

    - 创建一个让你兴奋的常规流程。

    - 承担责任。

    - 照顾好你的身体。


