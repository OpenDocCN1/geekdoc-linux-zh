  \      exit(EXIT_FAILURE);\n    }\n    if (strncmp(buffer, \"enough\", 6) == 0)\
  \ {\n      loop_cond = 0;\n    }\n  }\n  exit(EXIT_SUCCESS);\n}\n```\n\n“这包含消息类型吗？”\n\
  \n“不。它包含消息类型。”\n\n“好的。那么 `msgflag` 设置为 0。如果 `msgsnd` 失败，我们会在屏幕上打印。在退出循环之前，我们检查用户是否输入了\
  \ ‘enough’。”\n\n“这是接收者。\n\n### mq_receiver.c\n\n```c\n#include <stdlib.h>\n#include\
  \ <stdio.h>\n#include <string.h>\n#include <errno.h>\n#include <unistd.h>\n#include\
  \ <sys/msg.h>\n#define key 0x1254\nstruct message_structure {\n  long int my_msg_type;\n\
  \  char rcvd_text[BUFSIZ];\n};\nint main() {\n  int loop_cond = 1;\n  int msgid;\n\
  \  struct message_structure data_received;\n  long int msg_to_receive = 0;\n  msgid\
  \ = msgget((key_t) key, 0666 | IPC_CREAT);\n  if (msgid == -1) {\n    printf(\"\
  Failed to access message queue with error: %d\\n\", errno);\n    exit(EXIT_FAILURE);\n\
  \  }\n  while(loop_cond) {\n    if (msgrcv(msgid, (void *)&data_received, BUFSIZ,\
