  \ *database_descriptor);\n```\n\n这用于按顺序访问记录。数据库的部分就此结束。\n\n## 进程\n\n“我们去散步吧。”Lingaraj\
  \ 说道。\n\n他们散了步，去了一片椰子林。Seema 对这个地方感到非常惊叹，那里有很多高树。树上有一些蜂巢，Lingaraj 告诉 Seema，他带她来是为了谈论蜜蜂。\n\
  \n![](img/image_rsrc855.jpg)\n\n“蜜蜂总是在忙碌。蜂王批准许多蜜蜂的请求。但只有一只蜂王。请求可能是‘我得到这花蜜了，我该把它放在哪儿？’”\n\
  \n而蜂王的回答会是：\n\n‘花蜜？绝对不在路上。’”\n\nSeema 没有笑，Lingaraj 指出花蜜（nectar）是道路建设中使用的单词 tar（沥青）的双关语。Seema\
  \ 还是没有笑。Lingaraj 没再提了。\n\n“所以工蜜蜂与蜂王的每次交流都是一个时间片。蜂王往往有注意力缺陷症。她通过给工蜜蜂大约 5 分钟的时间，要求他等待并移动到下一个蜜蜂，下一个蜜蜂可能会询问如何对付熊。她可能会说：‘请耐心。’”\n\
  \n当然，蜂王的听众中会有更多蜜蜂。\n\n![](img/image_rsrc856.jpg)\n\n这给人一种她在同时处理所有人的印象。但事实并非。要理解的一点是，所有的蜜蜂都执行所有的任务，但在不同的称为时间片的轮班中进行。所以，当蜂王正在处理一个想做饭的厨师蜂的请求时，她和其他所有蜜蜂都在积极处理这项工作。然后他们停止这项工作，转到下一个任务，可能是因为人类唱了一首反复的歌曲而刺他。他们围着他，当这个男人在震惊中准备迎接蜂刺时，他们停下来回来。然后，他们承担蜂巢内部的清理工作。然后，他们重复所有任务，从他们停止的地方继续。告诉他们他们在何处的——例如他们包围人类时所在的位置——是该进程的程序计数器。\n\
  \n在 Linux 中，处理器一次处理一个任务，以时间片的形式进行，但由于它们都发生得非常快，给人一种它正在同时做这一切的印象。\n\n“所以，蜂王就像内核。当蜂王要求采取后续行动时，蜜蜂的请求就可以转换为一个操作。”Seema\
  \ 说道。\n\n“或者你可以把一切都称为一个进程。每个进程都有一个 `PID`，即进程标识符。有一个进程的 `PID` 为 1。它被称为 `init`。它被称为所有进程之父。\n\
  \n当程序存储在内存中时，没有程序可以修改该程序。它是只读的。其他程序可以共享它。”Lingaraj 说道。\n\n“这就像当蜂王命令并在告示上发布指令时，没有人改变代码。它们可以拍摄照片。”Seema\
  \ 说道。\n\nLingaraj 笑了。“我们还有共享库。库是现成的代码。就像薯片。你不需要自己做，而是获取现成的，因为经常被使用。如果蜂王告诉蜜蜂制作 Idly\
  \ 和 Dosei，而制作配菜的程序在共享库中，命令会引用它。制作配菜的指令没有为每道菜指定。那是内存中的。课程变量不可共享。例如，如果 Idly 的配料是辣椒粉，而\
  \ Dosei 的配料是香菜，你不能为配料只有一个项。你需要两个实例。”\n\n进程有：\n- 它自己的栈空间。\n- 它自己的环境空间。\n- 它自己的程序计数器。\n\
  \n执行 `ps -ef` 命令查看更多。在这里你可以看到：\n- 进程的用户 ID\n- 进程 ID\n- 父 ID\n- 进程调度信息\n- 开始时间\n\
  - 终端\n- 持续时间\n- 启动进程的命令\n\n`ps ax` 还会显示一列告诉你进程的状态。进程状态可以是：`S` | `R` | `D` | `T`\
  \ | `Z` | `N` | `+` | `<`。\n\n例如，`init` 程序启动一个 `getty` 程序。一旦用户登录，`getty` 将控制权交给登录程序。这允许登录并根据用户设置环境并启动\
  \ shell。退出时，`init` 会启动另一个 `getty` 进程。\n\n有些蜜蜂比其他的更重要。蜂王的调度包含更多时间来执行重要任务，如添加化学品以增加产量，以及更少的时间用于健身。同样，处理器为进程分配不同的时间片。特定的进程不能获取超过分配的时间。\n\
  \n我们如何启动新进程？我们使用 `system` C 例程。\n\n```\n#include <stdlib.h>\nint system(const char\
  \ *string);\n```\n\n`string` 是要启动的新进程的命令。系统调用 shell，然后由 shell 执行命令。所以，如果是 shell\
  \ 在执行，命令理应该是你在命令行提示符上输入的内容。当你指定一个命令时，`system` C 例程就会启动一个新进程。\n\n\n\n\n\n## 进程管理\n\
  \n类比一下，`system` 调用就像一个代理，它让别人来完成工作。假设我有一个家庭管家。我要求他为派对请一位厨师，当我在办公室工作时，他在家里做饭。管家会收取佣金，并让厨师执行这项任务。水管、开车以及排队付账单也是同样的道理。\n\
  \n但如果你有一个全能型的人，他既会做饭，又会开车，还会付账单，那将会非常有帮助。\n\n有许多类型。有些只接受一个参数。有些接受参数数组，有些则要求你提供路径。\n\
  \n```c\n#include <unistd.h>\nchar **environ;\nint execl(const char *path, const\
  \ char *arg0, ..., (char *)0);\n```\n\n`path` 显然是命令可执行文件存储的位置。\n\n`arg0`、`arg1`\
  \ 等是所调用程序的的参数。如果你自己写了一个程序，这些参数就是该程序中 `main` 函数的参数。`(char *) 0` 告诉 `execl` C 库函数，参数列表结束了。\n\
  \n现在，`execl` 类 C 库函数，你可以把它们想象成“全能阿鲁恩”。\n\n“全能阿鲁恩是我请过的一个管家。他无所不知。他是一个优秀的司机、厨师、电影导演、火箭科学家和水管工。每当我要求他做某项工作时，他就会戴上那顶特定的帽子。我的工作变成了他的工作，他通常执行得非常好。”\n\
  \n“你的意思是并没有启动新进程吗？就像是你自己在做一样？” Seema 问。\n\n“没错。当 `exec` 类函数启动一个新进程时，它使用调用进程的进程 ID。记得\
  \ shell 脚本中的 wait 执行吗？我爷爷去世时，想让我父亲接手配方工作。这很像，但它是 C 库函数的形式。它们调用的是可执行文件，”Lingaraj\
  \ 说。他继续道：\n\n“阿鲁恩从来没收过我的钱，因为他很有钱。”\n\n“然后发生了什么？他去世了吗？”\n\n“不，我解雇了他。”\n\n“为什么？”\n\
  \n“有一天他戴上了我的帽子，开始认为自己就是我。他指命令我，我为他工作，直到我有机会取下他的帽子。”\n\n被调用的进程实际上消除了调用进程。调用进程消失了。\n\
  \n```c\nint execlp(const char *file, const char *arg0, ..., (char *)0);\n```\n\n\
  在这里，`path` 被替换为 `file`。这意味着命令将自动在 `PATH` 变量中查找文件。如果文件不在路径，你必须指定完整路径名。\n\n```c\n\
  int execle(const char *path, const char *arg0, ..., (char *)0, char *constenvp[]);\n\
  ```\n\n在这里，`e` 象征“额外的”（extra）。通常是指新进程应该运行的环境。如果没有定义，则使用当前进程的环境。\n\n```c\nint execv(const\
  \ char *path, char *const argv[]);\n```\n\n在这里，该函数接受一个参数数组。\n\n```c\nint execvp(const\
  \ char *file, char *const argv[]);\n```\n\n将 `PATH` 中的文件名或完整路径以及一个数组作为参数传递。\n\n\
  ```c\nint execve(const char *path, char *const argv[], char *const envp[]);\n```\n\
  \n再次，将 `PATH` 中的文件名或完整路径以及数组作为参数，连同环境一起。\n\n所以，如果函数中包含 `p`，它会在路径中搜索；`e` 表示某些额外的东西，即环境；`v`\
  \ 表示一个数组。\n\n```c\n#include <unistd.h>\n#include <unistd.h>\npid_t fork(void);\n\
  ```\n\n\n\n\n注意这个代表僵尸进程的‘Z’以及进程号 `35917`。当然，你也会看到 `35916`，但那是 `ppid`，即父进程 ID。在父进程结束之前，会将此进程显示为僵尸。\n\
  \n我们使用 `wait` 来纠正这一点。\n\n### zwait.c\n\n```c\n#include <sys/types.h>\n#include <sys/wait.h>\n\
  #include <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\nint main(){\n    pid_t\
  \ pid;\n    char *message;\n    int exit_code;\n    printf(\"Fork program starting\\\
  n\");\n    pid = fork();\n    switch(pid)\n    {\n    case -1:\n        exit(1);\n\
  \    case 0:\n        printf(\"This is the child\\n\");\n        printf(\"With PID\
  \ : %d\\n\", getpid());\n        exit(24);/*这里，我们给出一个退出码，以查看是否能在父进程中获取到。 */\n  \
  \      break;\n    default:\n        printf(\"\\n\\nThis is the parent\\n\");\n\
  \        printf(\"With PID : %d\\n\", getpid());/*\n   从这里开始，增加了行 */\n        int\
  \ stat_val;\n        pid_t child_pid;\n        child_pid = wait(&stat_val);/*调用\
  \ wait，它返回子进程的 pid 并释放资源。子进程显示为僵尸是因为它的资源没有被释放.*/\n        printf(\"Child has finished:\
  \ PID = %d\\n\", child_pid);\n        if(WIFEXITED(stat_val))\n            printf(\"\
  Child exited with code %d\\n\", WEXITSTATUS(stat_val));这里，我们使用 WIFEXITED 查看子进程是否正常终止，如果是，我们继续使用\
  \ WEXITSTATUS(stat_val) 显示子进程以什么代码退出。\n        else\n            printf(\"Child\
  \ terminated abnormally\\n\");\n        sleep(30);\n        break;\n    }\n    exit(EXIT_SUCCESS);\n\
  }\n```\n\n当我们运行这个程序时：\n\n```\nThis is the parent\nWith PID : 36960\nThis is the\
  \ child\nWith PID : 36961\nChild has finished: PID = 36961\nChild exited with code\
  \ 23\n```\n\n所以，进程 ID 和退出码被父进程获取了。如果我们检查 `ps -al`，尽管进程又运行了 30 秒，但并没有提到僵尸进程。一个好命令是\
  \ `pstree -p`，通过你可以看到进程树以及进程 ID。建议在运行上述程序时尝试这个命令，看看哪个进程交给了哪个进程。\n\n### 信号\n\nLingaraj\
  \ 开始说道：“在商场发生过这样的事。我正试着给女朋友挑礼物，我注意到一个年轻女性在挑选耳环。她一直在尝试各种款式，我们都能在镜子里看到彼此。我针对她正在试戴的款式发出信号。当她试戴一对耳环时，我给她比了一个大拇指\
  \ ![](img/src857.jpg) 。她拒绝了。接下来的尝试也发生了同样的情况，然后她问我为什么。我让她等一下，去上了一门语言课然后回来。她还在那里尝试寻找造型。然后我开始向她发信号。“你发了什么信号？”Seema\
  \ 问道。“她挑选了大约几对耳环、12 条项链和 7 个鼻环。然后立刻消失了。我也想跟着离开，但她告诉店主我是她的丈夫。店主信了，因为是我做的选择。由于我当时靠女朋友生活，我不得不用女朋友的信用卡付单。我和女朋友在一起直到账单到达。我当时在吃她做的‘洋葱’，我不得不抽离。她做的洋葱很好吃。”Seema\
  \ 看到 Lingaraj 嗓子梗住了，不确定 Lingaraj 是对那个女人还是……”\n\nLingaraj 缓过神继续说道：“我告诉过你们关于 `Ctrl+C`。在\
  \ Linux 上，它发送的是 `SIGINT`。如果 Vijay 的行为反常，你可以用 `Ctrl+C` 停止它。除非 Vijay 能捕捉到它。”这里是一些信号的列表：\n\
  \n- `SIGABORT`\n- `SIGALRM`\n- `SIGFPE`\n- `SIGHUP`\n- `SIGILL`\n- `SIGINT`\n- `SIGKILL`\n\
  - `kill [options] <pid>`\n\n你能猜到 `kill` 命令能对进程做什么吗？“它杀掉它，”Seema 说，“它向进程发送一个信号。而且\
  \ `kill` 命令甚至可以发送一个信号，如果进程在心情好的话告诉它继续。如果你不指定信号，默认是 `TERM`。这意味着顾如其名，`kill` 命令将向 `pid`\
  \ 定义的进程发送一个终止信号。如果程序不听，`-KILL` 选项一定能杀掉。顺便说一下，kill 对僵尸进程无效。”\n\n如果 `pid` 是一个负数，则\
  \ `pid` 的正值将被视为进程组。如果是正数，则指示进程 ID。如果是 `-1`，除了 `init` 和 `inetd` 之外的所有进程都将收到信号。可以使用名称或数字指定信号。要查看可用信号列表，使用\
  \ `kill -l` 命令。\n\n这就是 `kill` 命令。还有一个 `kill` 系统调用：\n\n```c\n#include <sys/types.h>\n\
  #include <signal.h>\nint kill(pid_t pid, int sig);\n```\n\n如你所见，它接收要消除的进程 `pid`\
  \ 和要发送的信号。你只能向具有相同用户 ID 的进程发送 `kill` 信号。你不能向不同用户 ID 的进程发送。超级用户可以杀死。如果出现以下情况，`kill`\
  \ 会失败并返回 `-1`：\n\n- 如果指定的信号不是有效信号，将 `errno` 设置为 `EINVAL`。\n- 如果没有权限，`errno` 被设置为\
  \ `EPERM`。\n- 如果指定的进程不存在，从而将 `errno` 设置为 `ESRCH`。\n\n“为什么只有杀死的信号呢。这么消极。难道不能有一个鼓励性的信号吗？”“想象一下\
