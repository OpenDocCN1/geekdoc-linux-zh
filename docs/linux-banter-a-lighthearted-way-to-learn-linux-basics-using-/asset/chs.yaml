  \n\n\n\n# 信号与阻塞\n\n我们要讨论的是阻塞信号。我们在这里谈论的是这一点：当一个信号发生时，处理函数会被调用并运行直到完成。如果在此段时间内出现了另一个信号，这个健壮的系统调用\
  \ `sigaction` 可以阻塞这个新的信号。\n\n## 信号动作修饰符\n\n`int sa_flags`\n\n信号动作修饰符。它告诉程序是否返回位置以捕获新信号。当你将其设置为\
  \ `SA_RESETHAND` 时，`sigaction` 系统调用只会处理一次信号。\n\n在手册（man pages）中还有其他可用标志。\n\n`oact`\
  \ 是一个位置，将存储之前执行的信号动作。\n\n```c\n#include <signal.h>\nint sigaddset(sigset_t *set,\
  \ int signo);\nint sigemptyset(sigset_t *set);\nint sigfillset(sigset_t *set);\n\
  int sigdelset(sigset_t *set, int signo);\n```\n\n这些是 C 库函数。你可以让程序专门一次处理一个信号，或者制定一个广泛的策略来处理信号。因此，你可以创建一个所有这些信号的集合并指定要做什么。此外，可能会出现这样的情况：你的程序正在处理接收到的信号，而另一个信号又来了。这时，你可能需要挂起该函数并杀死进程。无需混乱。你可以使用信号集处理所有这些信号。\n\
  \n## 信号集\n\n信号集的类型为 `sigset_t`。\n\n因此，你可以通过 `sigfillset()` C 库函数向你的信号集填充所有可用信号。同样，你可以使用\
  \ `sigemptyset()` C 库函数清空所有信号的集合。\n\n你可以通过 `sigaddset()` 指定数字向集合中添加单个信号。\n\n你也可以通过\
  \ `sigdelset()` 指定数字从集合中删除单个信号。\n\n此外，你可以通过查询确定某个信号是否是集合的成员。\n\n```c\nint sigismember(\
  \ const sigset_t *set, int signum)\n```\n\n如果信号是集合的成员，则返回 1；否则返回 0；发生错误时返回 -1。\n\
  \n```c\n#include <signal.h>\nint sigprocmask(int how, const sigset_t *set, sigset_t\
  \ *os);\n```\n\n上述系统调用用于更改进程的信号掩码。如果信号被进程阻塞，它将不会被递送，而是保持挂起状态。程序可以通过调用 C 库函数 `sigpending`\
  \ 来确定哪些阻塞的信号处于挂起状态。\n\n```c\n#include <signal.h>\nint sigpending(sigset_t *set);\n\
  ```\n\n该系统调用向 `set` 指向的信号集写入一组被阻塞递送的信号。成功时返回 0，否则返回 -1 并设置 `errno` 指明错误。\n\n```c\n\
  #include <signal.h>\nint sigsuspend(const sigset_t *mask);\n```\n\n`sigsuspend`\
  \ 系统调用将进程信号掩码替换为 `mask` 给信号集，然后挂起执行。它将在信号处理函数执行后恢复。\n\n## sigaction 示例\n\n让我们来看一个使用\
  \ `sigaction` 的程序。\n\n`ayyo.c`\n\n```c\n#include <signal.h>\n#include <stdio.h>\n\
  #include <unistd.h>\n\nvoid ctrlc(int sig){\n    printf(\"我建议你不要停止我，%s\\n\", getlogin());\n\
  }\n\nvoid shutdown_req(int sig){\n    printf(\"我是进程 %d，我知道是谁在试图杀我。是你，%s\\n\", getpid(),\
  \ getlogin());\n}\n\n/* finish(int sig){\n    printf(\"这个函数是没用的，因为它正试图处理 SIGKILL\
  \ 信号。\\n\");\n}*/我们声明了上述三个函数，每个对应一个特定的信号：SIGINT、SIGTERM 和 SIGKILL。处理 SIGINT 的函数只运行一次，因为我们使用了\
  \ `SA_RESETHAND` 标志。我们打印了相关消息，这就是该函数做的全部工作。\n\nint main() {\n    struct sigaction\
  \ act;\n    act.sa_handler = ctrlc;\n    sigemptyset(&act.sa_mask);\n    act.sa_flags\
  \ = SA_RESETHAND;\n    sigaction(SIGINT, &act, 0);\n\n    act.sa_handler = shutdown_req;\n\
  \    sigemptyset(&act.sa_mask);\n    act.sa_flags = 0;\n    sigaction(SIGTERM, &act,\
  \ 0);\n\n    /* 这不相关，因为 SIGKILL 会立即杀死进程，它无法被处理。\n    act.sa_handler = finish;\n\
  \    sigemptyset(&act.sa_mask);\n    act.sa_flags = 0;\n    sigaction(SIGKILL, &act,\
  \ 0);\n\n    /* 然后指定了处理函数，信号集 sa_mask 被置为空。我们不希望任何信号被阻塞。因为你在这里放置的任何内容都不会被递送给进程。指定了是否需要\
  \ SA_RESETHAND。在第一情况下，指定了 SA_RESETHAND，这意味着信号只会被处理一次，因为信号没有重置。如果你想它每次都生效，你需要通过包含\
  \ SA_RESETHAND 来重置信号。*/\n    while(1) {\n        printf(\"我在我的世界里很快快乐!\\n\");\n\
  \        sleep(1);\n    }\n}/* 这是主程序部分，程序会在无限循环中不断打印，直到发送信号为止。 */\n```\n\n输出如下：\n\
  \n```\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n\
  我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n^C 我建议你不要停止我，Lingaraj!\n我在我的世界里很快快乐!\n\
  我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n\
  我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我是进程 41620，我知道是谁在试图杀我。是你，Lingaraj\n我在我的世界里很快快乐!\n\
  我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我是进程 41620，我知道是谁在试图杀我。是你，Lingaraj\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n\
  我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n^C\n```\n\n所以你看到，对于第二次 Ctrl+C，它被杀死了；而对于 SIGTERM 进程，它每次都使用处理函数。\n\
  \n第二天，他们进行了一次 8 英里的徒步。他们穿过了优美的溪流、瀑布、茂林和悬崖，期间没有遇到任何人。\n\n![](img/image_rsrc858.jpg)\n\
  \n他们最终到达了一个小定居点，那里有几个人正在创建线程。\n\n# 线程与互斥锁\n\n\n\n\n“所以，我想要更多的控制权。此外，我发现开销非常大。我必须共享我的品牌标识、网站等。因此，我关闭了特许经营体系，并开始开设分公司。当然，这并不是一种经营之道。这只是我个人的情况。”\n\
  \n“我不知道你为什么要告诉我这些。”\n\n“第一个案例，即我过去在在那里建立一个小规模运营，类似于在程序中调用一个函数。我的进程独立管理了它。\n\n第二个案例是我给出特许经营权，这是创建了另一个进程，比如通过调用\
  \ `fork`。大量的信息必须被复制。\n\n第三个案例是开设分公司。只共享了信息而没有复制。这就像执行一个线程（thread）。\n\n线程是程序的一部分，会执行多次，但不是作为函数。如果你同时处理两个文件，对于\
  \ `kernel` 来说，使用函数并作为单体块运行是很繁琐的。它可以让代码的另一个实例运行，但不是作为那种所有内容都复制的进程。在线程执行中，运行的程序拥有它自己的栈（stack），新的执行线程也拥有自己的栈，因此拥有局部变量。但它与创建它的进程共享（请注意不是复制，而是共享）全局变量、文件描述符、信号处理程序以及当前目录状态。\n\
  \n所以，虽然特许经营店有自己的财务账目、工资，但分公司共享财务账目。进程是复制，而线程是共享，且复制涉及更多资源。”\n\n“是的，现在是‘重入’（reentrant）代码。重入函数是指可以运行、被中断然后再次运行的函数。\n\
  \n同一个程序可以在不同实例中复用，一个实例的变量值对其他实例可能无效。所以，如果一个程序改变了变量的值并被再次调用，它不会记得它旧的那组值。它会采用调用程序发送的值。\n\
  \n在我们的社区，饮酒年龄是 21 岁。有一次我朋友的父亲是一位历史老师 Ritesh，他坚持习俗就像 sambhar 汤坚持衬衫一样，他曾是一家酒吧的老板。这没什么问题，除了他从不让我们进入酒吧。他经常喝醉，当我们出现在酒吧门前时，对话是这样的。\n\
  \n![](img/image_rsrc859.jpg)\n\n‘哦，Lingaraj。你好吗？’他以前常这样问。\n\n‘我很好，先生。我编程得不错，而且……’\n\
  \n‘我是想问，你多大了？’\n\n‘25 岁，叔叔。’\n\n‘别骗我。你 20 岁。我记得你这么告诉我的。’\n\n‘那是 5 年前的事了，先生。’\n\n\
  ‘那又怎样？记录就是记录。出去吧。’\n\n他不符合重入程序的条件。他所做的唯一重入就是进入酒吧续杯。所以，重入函数会为各种实例进行更新。\n\n它基本上意味着，只对调用者提供的数据进行操作。\n\
  \n```c\n#include <pthread.h>\nint pthread_create(pthread_t *thread, pthread_attr_t\
  \ *attr, void*(*start_routine)(void *), void *arg);\n```\n\n成功返回 0。\n\nC 库函数 `pthread_create()`\
  \ 方便程序作为线程运行。它有一个名称，让你除函数名之外可以标识线程。它由 `pthread_t *thread` 提供。它的类型是 `pthread_t`。\n\
  \n`pthread_attr_t *attr` 是一个属性，我稍后会解释。\n\n`void *(*start_routine)(void *), void\
  \ *arg` 是作为线程运行的程序，`arg` 是它的参数。\n\n```c\n#include <pthread.h>\nvoid pthread_exit(void\
  \ *retval);\n```\n\n这会退出线程。与函数不同，你不能返回一个变量。因为……？”\n\n“变量在线程结束后就消失了。”\n\n“正确。”\n\n\
  ```c\n#include <pthread.h>\nint pthread_join(pthread_t th, void **thread_return);\n\
  ```\n\n这个 C 库函数类似于进程中的 `wait` 系统调用。在这里，`pthread_t th` 代表程序标识符，记得 `pthread_create`\
  \ 吗？\n\n它返回一个指向线程返回值的指针。\n\n他在笔记本电脑上打开了一个文件。\n\n`thread_program.c`\n\n```c\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include\
  \ <unistd.h>\nvoid *print_func(char* message){\n   printf(\"%s - Before sleep\\\
  n\", message);\n   sleep(4);\n   printf(\"%s - After waking up\\n\", message);\n\
  }\nint main(){\n  pthread_t t1, t2;\n  printf(\"Main program now running\\n\");\n\
  \  pthread_create(&t1, NULL, (void *)print_func, (void *) \"First call to pthread\"\
  );\n  pthread_create(&t2, NULL, (void *)print_func, (void *) \"Second call to pthread\"\
  );\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n  printf(\"Back to main\
  \ after thread join\\n\");\n}\n```\n\n然后他继续了解释。\n\n```c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\nvoid\
  \ *print_func(char* message){\n   printf(\"%s - Before sleep\\n\", message);\n \
  \  sleep(4);\n   printf(\"%s - After waking up\\n\", message);\n}\n```\n\n上面的代码声明了所需的头文件，并在睡眠前和后打印两条消息。这是将被两个调用调用的程序。上面的函数稍后会在程序中被调用两次。\n\
  \n```c\nint main(){\n    pthread_t t1, t2;\n```\n\n线程被声明了。\n\n```c\n   printf(\"\
  Main program now running\\n\");\n```\n\n仅仅是一个指示。\n\n```c\npthread_create(&t1, NULL,\
  \ (void *)print_func, (void *) \"First call to pthread\");\npthread_create(&t2,\
  \ NULL, (void *)print_func, (void *) \"Second call to pthread\");\n```\n\n创建线程。\n\
  \n为了区分运行的同一个函数的两个实例，我们在每个实例中传递给函数了不同的消息。这样，你就可以看到是哪个线程在运行。\n\n如上所示，创建了调用 `print_func`\
  \ 函数的线程，并且每次都传递了不同的消息。通常，传递值的最佳方法是使用 `pthread_create` 向线程传递一个结构体（struct）。它的形式如下：\n\
  \n`struct thread_args *args`\n\n```c\n  pthread_join(t1, NULL);\n  pthread_join(t2,\
  \ NULL);\n  printf(\"Back to main after thread join\\n\");\n}\n```\n\n仅仅是一个告诉我们已经回到了主程序的指示。\n\
  \n“那么，你认为输出会是什么？”Lingaraj 问道。\n\n“我认为它会先打印第一个调用的，然后是第二个。像这样：\n\nMain program now\
  \ running\n\nFirst call to pthread - Before sleep\n\nFirst call to pthread - After\
  \ waking up\n\nSecond call to pthread - Before sleep\n\nSecond call to pthread -\
  \ After waking up\n\nBack to main after thread join\n\n当然，还有 4 秒的睡眠延迟。”Seema 说。\n\
  \nLingaraj 继续使用运行程序：\n\n```bash\ncc -D_REENTANT thread_program .c -lpthread\n```\n\
  \n“你需要这样编译：\n\n```bash\ncc -D_REENTANT thread_program .c –o thread_program -lpthread\n\
  ```\n\n如果 `NPTL`(Native Posix Threads Library）是你系统的默认设置，”Lingaraj 解释道。\n\n输出显示在屏幕上。\n\
  \n```\nMain program now running\nFirst call to pthread - Before sleep\nSecond call\
  \ to pthread - Before sleep\nFirst call to pthread - After waking up\nSecond call\
  \ to pthread - After waking up\nBack to main after thread join\n```\n\n“现在，你会发现有些不对。你预测的顺序并不在那里。当第一个执行切片在睡眠时，调度器认为明智地插入了第二个执行切片。它没有等待第一个线程执行完毕。不存在同步性。”\n\
  \nLingaraj 移开目光，按照他的习惯，看向远方。\n\n“怎么了？”\n\n“有一次，我遇到一个相信同步性的女性。当时我正在从事动物粪便分析。她是一个数据库分析师。她在烛光晚餐时这样问我。\n\
  \n![](img/image_rsrc85A.jpg)\n\n‘这个数字 7 不论我去哪里都会出现，而且通常在我做重要事情的时候。你有那数字吗？’\n\n‘是的，我到处都能看到数字\
  \ 2。’\n\n她起身离开了。”\n\n“难怪！”\n\n“如果我们想在调度器进入下一个代码之前锁定一段代码该怎么办。”\n\n\n\n\n让我给你说一个场景。当我叔（一名医生）在他私立医院的手术室里时，他们会锁上门以防手术正在进行。手术一旦完成，他们就会通过解锁来打开门。\n\
  \n如果门没锁，电影剧组就会进去拍摄视频，因为那是唯一有大灯的房间。在他们操作期间，他们会锁上门。工作完成后，电影剧组通常会解锁门。\n\n## 互斥线程\n\n\
  什么是互斥线程？它们是什么？它们是能够被阻塞的资源。例如，如果你和 Vijay 在一起，而他一直被足球赛分心，你该如何阻塞他的资源，好让足球赛和摔跤比赛都无法获得他的兴趣呢？”\n\
  \n“简单，我会在身上用一个互斥线程程序。”Seema 正在进行研究，而且很快。\n\n“简单？祝你好运吧，这并不是因为互斥锁程序很难，而是要把他的注意力从足球上移开很难。互（mutex，mutually\
  \ exclusive 的缩写）会锁定代码的关键区域，使得锁定程序在其他人尝试之前能够先完成操作。还记得‘锁锁拉克什曼’（Lock Lakshman）吗？”Lingaraj\
  \ 展示了一个 C 库函数。\n\n```c\n#include <pthread.h>\nint pthread_mutex_init(pthread_mutex_t\
  \ *mutex, const pthread_mutexattr_t*mutexattr);\n```\n\n初始化互斥锁 `*mutex`，它是基于线程函数的。\n\
  \n`const pthread_mutexattr_t *mutexattr` 这需要一些解释。留到以后再说。\n\n```c\nint pthread_mutex_lock(pthread_mutex_t\
  \ *mutex));\n```\n\n这锁定了资源。\n\n```c\nint pthread_mutex_unlock(pthread_mutex_t *mutex);\n\
  ```\n\n这解锁了资源。\n\n```c\nint pthread_mutex_destroy(pthread_mutex_t *mutex);\n```\n\
  \n这将销互斥锁并进行清理。\n\n“让我们来看一个程序。”\n\n“好的。”\n\n“互斥锁程序。在此之前，是我们聊过的线程程序。\n\n### thread_program\
  \ .c\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
  \ <pthread.h>\n#include <unistd.h>\nvoid *print_func(char* message){\n  printf(\"\
  %s - Before sleep\\n\", message);\n  sleep(4);\n  printf(\"%s - After waking up\\\
  n\", message);\n}\nint main(){\n  pthread_t t1, t2;\n  printf(\"Main program now\
  \ running\\n\");\n  pthread_create(&t1, NULL, (void *)print_func, (void *) \"First\
  \ call to pthread\");\n  pthread_create(&t2, NULL, (void *)print_func, (void *)\
  \ \"Second call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n\
  \  printf(\"Back to main after thread join\\n\");\n}\n```\n\n输出结果：\n\n```\nMain\
  \ program now running\nFirst call to pthread - Before sleep\nSecond call to pthread\
  \ - Before sleep\nFirst call to pthread - After waking up\nSecond call to pthread\
  \ - After waking up\nBack to main after thread join\n```\n\n正如之前解释的，这里没有同步性。我们使用互斥线程。\n\
  \n回到程序，现在加上了互斥锁。\n\n### thread_with_mutex.c\n\n```c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\npthread_mutex_t\
  \ mutex1 = PTHREAD_MUTEX_INITIALIZER;\nvoid *print_func(char* message){\n  pthread_mutex_lock(&mutex1);\n\
  \  printf(\"%s - Before sleep\\n\", message);\n  sleep(4);\n  printf(\"%s - After\
  \ waking up\\n\", message);\n  pthread_mutex_unlock(&mutex1);\n}\nint main(){\n\
  \  pthread_t t1,t2;\n  pthread_mutex_t mutex1;\n  pthread_mutex_init(&mutex1, NULL);\n\
  \  pthread_create(&t1, NULL, (void *)print_func, (void *) \"First call to pthread\"\
  );\n  pthread_create(&t2, NULL, (void *)print_func, (void *) \"Second call to pthread\"\
  );\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n  printf(\"Back to main\
  \ after thread join\\n\");\n}\n```\n\n我来解释一下。\n\n```c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\npthread_mutex_t\
  \ mutex1 = PTHREAD_MUTEX_INITIALIZER;\n这初始化了互斥锁 mutex1。\nvoid *print_func(char*\
  \ message){\n  pthread_mutex_lock(&mutex1);\n我们在这里锁定了互斥锁。后面是代码的关键区域。\n  printf(\"\
  %s - Before sleep\\n\", message);\n  sleep(4);\n  printf(\"%s - After waking up\\\
  n\", message);\n  pthread_mutex_unlock(&mutex1);\n我们在这里解锁了互斥锁。\nint main(){\n  pthread_t\
  \ t1,2;\n  pthread_mutex_t mutex1;\n  pthread_mutex_init(&mutex1, NULL);\n  pthread_create(&t1,\
  \ NULL, (void *)print_func, (void *) \"First call to pthread\");\n  pthread_create(&t2,\
  \ NULL, (void *)print_func, (void *) \"Second call to pthread\");\n  pthread_join(t1,\
  \ NULL);\n  pthread_join(t2, NULL);\n  printf(\"Back to main after thread join\\\
  n\");\n}\n```\n\n\n\n\n`sem_open()` 创建一个新的 POSIX 信号量或打开一个现有信号量。信号量通过名称标识。它返回信号量的地址。\n\
  \n```c\n#include <semaphore.h>\nint sem_destroy(sem_t * sem);\n```\n\n正如函数名所示，这会销毁信号量。它还会清理资源。\n\
  \n回到灯开关并行的例子。一个挑剔的电影明星等待时，如果他在外面而医生在里面，他会一直要求导演检查灯的状态。这种行为是不被鼓励的，演员会被踢出剧组，无论他是不是电影明星。当灯熄灭时，团队会知道。因为程序始终在关注这一点。就像那些总是在寻找折扣或免费优惠券的人一样。\n\
  \n所以，为了编程，你可以使用 `pthread` 启动一个线程。它将一直运行。你创建一个信号量，并告诉内核当信号量值为 0 时会发生什么。这会启动一个例程。你可以告诉当信号量有值时会发生什么。但你不需要告诉程序一直寻找该变量并检查它是否变为\
  \ 0 或变为正数。这是系统的工作。让我们修改程序并将其命名为 `thread_sem_program.c`，这次使用信号量。确保包含 `semaphore.h`。\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n\
  #include <unistd.h>\n#include <semaphore.h>\nsem_t semap1;\nvoid *print_func(char*\
  \ message){\n    sem_wait(&semap1);\n    printf(\"%s - Before sleep\\n\", message);\n\
  \    sleep(4);\n    printf(\"%s - After waking up\\n\", message);\n    sem_post(&semap1);\n\
  }\nint main(){\n  sem_init(&semap1,0,1);\n  pthread_t t1, t2;\n  printf(\"I am in\
  \ main\\n\");\n  int iret1 = pthread_create(&t1, NULL,(void *) print_func, (void\
  \ *) \"First Instance\");\n  int iret2 = pthread_create(&t2, NULL, (void *) print_func,\
  \ (void *) \"Second Instance\");\n  pthread_join(t1, NULL);\n  pthread_join(t2,\
  \ NULL);\n  sem_destroy(&semap1);\n  printf(\"Back to main after thread join\\n\"\
  );\n}\n```\n\n我会这样运行它：\n\n```bash\ncc -D_REENTRANT thread_sem_program.c -lpthread\
  \ -lrt\n```\n\n输出再次是\n\n```\nMain program now running\nFirst Instance - Before sleep\n\
  First Instance - After waking up\nSecond Instance - Before sleep\nSecond Instance\
  \ - After waking up\nBack to main after thread join\n```\n\n“Vijay 现在怎么样？”\n“他忘记了一些关于我们相处时光的事了。”\n\
  “你说的那个键盘，他把它交给了任何人来让自己被编程吗？”\n“你让我很焦虑。”\n“那你最好学快点。”\n“谢谢理解。我需要休息几天。我需要见见 Vijay。”\n\
  “好的。”\n\nSeema 叫了同一个出租车司机前往班加罗尔。几天后她回来了，走进了 Lingaraj 的家。\n\n“你的旅程怎么样？”Lingaraj 问。\n\
  “见到他很好，他变得更好了。但我觉得他变得很神。。你做了什么？”她问 Lingaraj。\n“我站在悬崖边拍自拍时，一阵强风吹……”\n“他几乎没有注意到我在那里。他一直在计算足球动作并预先告诉结果。”Seema\
  \ 打断道。\n“太棒了！”\n\nSeema 盯着 Lingaraj。Lingaraj 移开目光继续说。\n\n### 线程属性\n\n你举办了一个派对，并安排了厨师和调酒师。有些朋友可能带着司机来，有些坐出租车来，有些是跑来的。有这样的人。派对结束后，你的朋友回家了。你想知道一个朋友是否到了家。所以，你给她打电话确认她是否安全到家。现在，那个来的厨师，你不会打电话去确认他是否安全到家。更何况，如果准备的食物不好，而你发现他在未经许可的情况下也喝了一些酒。\n\
  \n所以，如果你把这两个回家的过程想象成线程，一个是连接线程（attached thread），另一个是分离线程（detached thread）。因此，你可以为线程指定属性，告诉它以特定的方式行为。列表如下：\n\
  \n```c\n#include <pthread.h>\nint pthread_attr_setdetachstate(pthread_attr_t *attr,\
  \ int detachstate);\nint pthread_attr_getdetachstate(const pthread_attr_t *attr,\
  \ int *detachstate);\nint pthread_attr_setschedpolicy(pthread_attr_t *attr, int\
  \ policy);\nint pthread_attr_getschedpolicy(const pthread_attr_t *attr, int *policy);\n\
  int pthread_attr_setschedparam(pthread_attr_t *attr, const struct sched_param*param);\n\
  int pthread_attr_getschedparam(const pthread_attr_t *attr, struct sched_param*param);\n\
  int pthread_attr_setinheritsched(pthread_attr_t *attr, int inherit);\nint pthread_attr_getinheritsched(const\
  \ pthread_attr_t *attr, int *inherit);\nint pthread_attr_setscope(pthread_attr_t\
  \ *attr, int scope);\nint pthread_attr_getscope(const pthread_attr_t *attr, int\
  \ *scope);\nint pthread_attr_setstacksize(pthread_attr_t *attr, int scope);\nint\
  \ pthread_attr_getstacksize(const pthread_attr_t *attr, int *scope);\n```\n\n这是一个很长的列表，看起来很令人生畏。在你开始使用其中任何一个之前，你需要初始化一个线程属性对象。\n\
  \n```c\n#include <pthread.h>\nint pthread_attr_init(pthread_attr_t *attr);\n#include\
  \ <pthread.h>\nint pthread_attr_destroy(pthread_attr_t *attr);\n```\n\n第一个函数将初始化线程属性对象，第二个将销毁线程属性对象。\n\
  \n“你才刚创建线程，很快就开始谈论销毁它了。”\n“可能很复杂。每当我进入视频游戏，尤其是射击游戏时，我的头像会被立即销毁。我太蠢了，用了我的真实名字进入这些游戏。”\n\
  \n```c\nint pthread_attr_setdetachstate(pthread_attr_t *attr, int detachstate);\n\
  ```\n\n它有两个参数，属性对象指针和 `detachstate` 标志。在标志位中你可以指定：\n- `PTHREAD_CREATE_JOINABLE`：这是默认值，你必须连接线程。\n\
  - `PTHREAD_CREATE_DETACHED`：这意味着你不在乎。你无法调用线程连接。所以你永远不知道厨师是否到了家。”\n\n```c\nint pthread_attr_getdetachstate(const\
  \ pthread_attr_t *attr, int *detachstate);\n```\n\n这告诉你线程的当前状态。注意 `int detachstate`\
  \ 是你指定的。在这里，你指定一个指针，将返回当前状态的值。\n\n```c\nint pthread_attr_setschedpolicy(pthread_attr_t\
  \ *attr, int policy);\nint pthread_attr_getschedpolicy(const pthread_attr_t *attr,\
  \ int *policy);\n```\n\n在派对上，总会有想要麦克风的人。但你可以通过调度指定谁获得中心舞台。先来的人先获得麦克风，或者通过轮询。调度是内核调度器的特权，但你可以介入并获得更多控制。你可以指定哪些线程具有更高的优先级。线程是否可以被另一个线程抢占。”\n\
  \n“没有平等对待。”\n“如果一个资源上有互斥锁，你可以调度哪个线程获取资源，在多个线程运行的情况下，一旦互斥锁解锁。”\n\n第二个函数返回 `*policy`\
  \ 中的状态。\n\n```c\nint pthread_attr_setschedparam(pthread_attr_t *attr, const struct\
  \ sched_param*param);\nint pthread_attr_getschedparam(const pthread_attr_t *attr,\
  \ struct sched_param*param);\n```\n\n这允许你控制运行 `SCHED_OTHER` 调度策略的线程。\n\n```c\nint\
  \ pthread_attr_setinheritsched(pthread_attr_t *attr, int inherit);\nint pthread_attr_getinheritsched(const\
  \ pthread_attr_t *attr, int *inherit);\n```\n\n这可以取两个值：\n- `PTHREAD_EXPLICIT_SCHED`\
  \ 和\n- `PTHREAD_INHERIT_SCHED`。\n\n这意味着新线程的调度是由属性设置的，还是从创建它的线程继承调度。\n\n\n\n\n\n\
  ```c\nint pthread_attr_setscope(pthread_attr_t *attr, int scope);\nint pthread_attr_getscope(const\
  \ pthread_attr_t *attr, int *scope);\n```\n\n这控制如何计算线程的调度策略。\n\n```c\nint pthread_attr_setstacksize(pthread_attr_t\
  \ *attr, int scope);\nint pthread_attr_getstacksize(const pthread_attr_t *attr,\
  \ int *scope);\n```\n\n这用于需要更大栈空间的线程。根据局部变量的大小或例程的数量，为特定目的指定栈大小。\n\n```c\nint pthread_attr_setstackaddr(\
  \ pthread_attr_t *attr, void *stackaddr);\n```\n\n“你可以指定栈地址。” Seema 回道。\n\n### 线程取消\n\
  \n```c\n#include <pthread.h>\nint pthread_cancel(pthread_t thread);\n```\n\n这取消一个线程。但线程是否可以被取消取决于线程本身。这就像是一种侮辱。一位大师曾说：“侮辱的刀落在我的脚边，我不会捡起它并刺自己。”\n\
  \n所以，取消取决于线程。如果线程是否愿意被取消，在编码时，你使用以下函数：\n\n```c\n#include <pthread.h>\nint pthread_setcancelstate(int\
  \ state, int *oldstate);\n```\n\n在这里，`int state` 可以是两个值：\n\n`PTHREAD_CANCEL_ENABLE`\n\
  \n或者\n\n`PTHREAD_CANCEL_DISABLE`\n\n`oldstate` 参数获取之前的状态。\n\n“这是我第一次从你这里听到哲学。非常深刻。”\n\
  \n“我曾有我自己的哲学。我曾在某城市的一栋摩天大楼里当管道工，有一天，我收到投诉说顶层水箱漏水。我一路爬上去，看到一个女人站在露台的边缘。我感觉到她在计划什么，于是和她聊了起来。\n\
  \n![](img/image_rsrc85E.jpg)\n\n我从谈论生活开始，持续了半小时。然后她说：“我爬上这栋楼是为了向世界展示信念的力量。但在听了你的话后，我想跳下去了。”\n\
  \nSeema 拍了她的额头。\n\n“那些日子，我试图用我的个性来影响世界。无论如何，如果一个线程对被取消是开放的，你可以使用以下 库函数：\n\n```c\n\
  #include <pthread.h>\nint pthread_setcanceltype(int type, int *oldtype);\n```\n\n\
  `type` 为以下之一：\n\n`PTHREAD_CANCEL_ASYNCHRONOUS`\n\n这会在收到取消请求后立即取消线程。\n\n`PTHREAD_CANCEL_DEFERRED`\n\
  \n这会延迟取消线程直到调用了必要的 `pthread` 函数。\n\n我觉得我们关于线程说得太多了。\n\n## 进程间通信\n\n### 管道\n\n让我们谈谈进程间通信。\n\
  \n让我从一个故事开始吧。我有一个喜欢的女孩，我想更深入地了解她。于是，我为她写了这首诗：\n\n我的心在嬉戏的情感中徘徊，身影\n在宁静的河流中\n在童年嬉玩的斜坡上\n\
  从侠士身上落下\n跳跃去拥抱海洋\n我们能再多聊聊吗？\n关于远北山脉\n以及在脚下点燃篝火会是什么感觉\n关于南方沉睡的草原\n以及坐在那里拿着咖啡杯\n东部延伸的沙漠\n\
  以及在绿洲的棕榈树上系上骆驼\n西部慵懒的海\n以及将海壳贴在耳朵\n东方天空之外的蓝色太阳\n以及被其众多月亮照亮的行星\n那里宝石躺在床上\n在纯净的水流下\n\
  羚羊护着你前行\n感到与起伏的水合为一\n那里森林变成了长笛\n生命是和谐的交响\n在那里无事可做，无所事事\n而发生的一切\n都源于无无包象的爱，甚至是一片\n\
  落叶\n\n我想亲面向她读这封信，于是来到了她家。我敲了门，很快，她的父亲——她叫他为“老爸”——打开了门。那是一栋大房子。我告诉我想见见 Suparna。\n\
  \n![](img/image_rsrc85F.jpg)\n\n“你想告诉她什么？”他问。\n\n“是私事。”我回答道。\n\n“无论你想告诉她什么，告诉我，我来告诉她。”\n\
  \n我大吃一惊。接着我向他解释了 Linux 中的多线程以及它是如何实现的，并说了整整一个小时。\n\n“我会告诉她的，”他说并关上了门。\n\n我重复了这一过程一周，深入研究了多线程。在第八天，他打开了门。\n\
  \n“在多线程中……”我开始说道\n\n“无论你想告诉她什么，直接告诉她。”\n\n“而且那也失败了，我猜。”\n\n“怎么，我以后告诉你。所以，她的老爸表现得就像一个管道。这引出了第一个\
  \ C 库函数。”\n\n```c\n#include <stdio.h>\nFILE *popen(const char *command, const char\
  \ *open_mode);\n```\n\n所以，这通常用于向进程传递命令。`open_mode` 为 `r` 或 `w`。\n\n调用程序可以使用 `\"\
  r\"` 接收被调用进程的输出。\n\n调用程序可以使用 `\"w\"` 将其输出发送到被调用进程的输入，”Lingaraj 说道。\n\n```c\nint\
  \ pclose(FILE *stream_to_close);\n```\n\n这关闭管道。如果被调用进程仍在运行，`pclose` 将等待它完成然后关闭管道。\n\
  \n它返回该文件流对应的进程的退出代码。\n\n“这是一个例子。” Lingaraj 向她展示了一些伪代码并开始解释。\n\n```c\n#include <stdio.h>\n\
  #include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include <fcntl.h>\n\
  int main(){\n  int total_bytes;\n  int filed_pipe[2];\n  const char chars_passed[]\
  \ = \"Crocodile Doctor\";\n  char buffer[BUFSIZ +1];\n  pid_t fork_success;\n  memset(buffer,'\\\
  0',sizeof(buffer));\n  pipe(filed_pipe);\n  fork_success = fork();\n  if (fork_success\
  \ == -1)\n    {\n        fprintf(stderr,\"Fork Failure\");\n        exit(EXIT_FAILURE);\n\
  \    }\n    else if (fork_success == 0)\n    {\n        total_bytes = read(filed_pipe[0],buffer,\
  \ BUFSIZ);\n        printf(\"This program has read %d bytes - %s\\n\",total_bytes,\
  \ buffer);\n        exit(EXIT_SUCCESS);\n    }\n    else\n    {\n        total_bytes\
  \ = write(filed_pipe[1],chars_passed, strlen(chars_passed));\n        printf(\"\
  This program wrote %d bytes\\n\", total_bytes);\n    }\n  exit(EXIT_SUCCESS);\n\
  }\n```\n\n输出是：\n\n| This program wrote 16 bytesThis program has read 16 bytes -\
