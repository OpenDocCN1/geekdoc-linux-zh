  \n注意这些冒号。”\n\n“我们将用代码 `z``,`p`,`m`,`c`,`d` 和 `a` 来简写所有这些选项，”Seema 说。\n\n“如果是那样，我们将使用\
  \ `getopt()`。你所做的的就是指定代码选项并加上一个‘-’前缀。`getopt()` 会捕获这些选项并让被调用的程序可用。否则，你将使用 `argv`\
  \ 列表，并通过选项前的‘-’前缀来区分参数和选项。”\n\n如果你认识的朋友在帮你买，那没关系。但如果是像我这样不一定很了解手提包选项的人，我将需要一个程序根据你指定的选项，在每一步都告诉我要做什么。让我们从一个\
  \ C 库函数开始。\n\n语法为：\n\n```c\n#include <unistd.h>\nint getopt(int argc, char *const\
  \ argv[], const char *optstring);\nextern char *optarg;\nextern int optind, optterr,\
  \ optopt;\n```\n\n`argc` 是参数个数，包含了调用函数。\n\n`argv` 是参数列表。\n\n`optstring` 是调用 `getopt()`\
  \ 的程序可以接受的有效选项列表。这意味着，程序必须知道用户将传递什么种选项，并且程序最好准备好一个 `switch case` 语句，根据传递的选项执行相应的的操作。\n\
  \n如果像我这样不懂手提包术语的用户传递了一个 `-b` 选项表示啤酒杯架，那么 `getopt()` 会识别出这出了程序的范围，并将其放入 `optopt`\
  \ 中。所以，查看 `optopt` 就会得到由不了解手提包的用户传递的选项。\n\n由于这每次 `getopt()` 运行时都会更新，因此它通常在循环中运行。\n\
  \n`optind` 是索引，帮助 `getopt()` 在下次被调用时定位。由于 `getopt()` 返回程序收到的下一个选项字符，`getopt()` 将一直运行到\
  \ `getopt()` 返回 `-1`，这意味着不再有更多选项。如果它遇到未知选项，它将返回 `?`，即问号字符。\n\n每个选项可能还有进一步的参数。例如，当你提到预算时，必须指定金额。该特定选项存在后续参数是通过选项字符旁的\
  \ `:` 冒号指示的。该选项的指定参数也可以通过 `getopt()` C 库函数 `optarg` 来访问。因此，你的程序将是：\n\n### fetchbag.c\n\
  \n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include <ctype.h>\n\
  int main(int argc, char *argv[]){\n    int option;\n    while((option = getopt(argc,\
  \ argv, \"zpmcd: a:\")) != -1)\n    {\n        switch(option) {\n            case\
  \ 'z':\n                printf(\"所以你想要一个带拉链的手提包。\\n\");\n                continue;\n\
