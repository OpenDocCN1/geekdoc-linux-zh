  \ const void *buf, size_t nbytes);\n```\n\n`<unistd.h>` 是一个头文件。头文件包含声明和宏。与可以执行工作的库不同，它不包含实现代码。它只是简单调用执行工作的函数。你可能想过，在某些组织中，有些头目不干活，但认识人，特别是那些在图书馆学习的人，可以工作，尽管头目自己对实现一无所知。我说这些是为了帮助你记忆。你可以写自己的头文件，但如果你想包含它，可以使用\n\
  \n```c\n#include “myheaderfile.h”\n```\n\n### 系统调用与内核 (System Calls and the Kernel)\n\
  \n内核并不是对所有人免费开放。它是非常保留的，只分配了一部分给用户来使用系统。但有时你需要内核来执行某些操作。这些操作可能是进程控制、文件或设备管理等。用户没有胆量自己修改这些东西。他们需要请求内核的支持，而内核根据其规则允许程序执行这些操作。因此，这种模式被称为监督模式（supervisor\
  \ mode）或内核空间（kernel space），因为涉及到内核的监督。\n\n每个系统调用 `read` 或 `write` 返回读取的字节数。`filedes`\
  \ 是文件描述符。`buf` 是指向内容的指针，`nbytes` 是字节数。在 `read` 中内容放入 `buf` 指向的字符串，而在 `write` 中这可以是一个实际的字符串。Seema\
