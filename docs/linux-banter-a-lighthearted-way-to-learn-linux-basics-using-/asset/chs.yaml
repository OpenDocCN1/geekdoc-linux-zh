  \n当你使用正则表达式时：\n\n```bash\n$ grep ^T Seema.txt\n```\n\n查找 `Seema.txt` 中以 `T` 开头的行。接下来你可能想要执行一个命令并将输出作为另一个命令的一部分。简单，将命令放在括号里。\n\
