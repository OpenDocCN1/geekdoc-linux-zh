  \n### 局限性\n\n一。`select` 可以监控的文件描述符最大数量取决于 `FD_SETSIZE`。如果循环超过了 `FD_SETSIZE`，程序无法感知并采取适当行动。因此，显而易见的解决方案是在\
  \ for 循环中仅迭代 `FD_SETSIZE` 给定的特定次数。\n\n\n\n\n\n二、如果 `client_select_1` 进程在发送“Because\
  \ Seema learn Linux”消息后，又等待了 10 秒并决定发送另一条消息，它将不会被服务器读取。这是因为我们已经从 `read_fd_set` 中移除了该\
  \ `fd`。在客户端关闭连接之前，我们上希望它留在 `read_fd_set` 中。有一种方法可以规避这个限制：一种方法是获取 `socket` 上 `read`\
  \ 调用的返回值。如果激活时的返回值为 0，则意味着客户端已关闭连接。随后，我们在服务器端关闭客户端套接字文件描述符。由于我们只关闭了客户端端完成的套接字，而没有清除客户端端尚未完成的，因此下一次迭代中，开启的套接字文件描述符将保留在待检查读取活动的文件描述符集中。已关闭的将不再再次激活。\n\
  \n此外，它显示“Loop 0”启动。这看起来不对的。因此，我们在 `server_select2.c` 中引入了这些更改。\n\n### server_select2.c\n\
