  \ `/` 开始，“……根目录。” Seema 回答道。\n\n“所以，\n\n```bash\n$ find / -name Seema -print\n```\n\
  \n将会打印出系统中所有名为 `Seema` 的文件。”\n\n### `-atime N`\n这里的 `N` 是一个数字。该文件最后一次访问是在 `N` 天前。当你知道\
  \ Vijay 上次访问特定文件的时间时，这可以给你提供参考。\n\n### `-mtime N`\n该文件在 `N` 天前被修改过。\n\n### `-name\
  \ pattern`\n文件名（不包含任何路径），匹配提供的模式。为了确保模式被传递给 `find` 而不是立即被 shell 解释，模式必须始终放在引号中。\n\
  \n示例如下：\n\n```bash\nfind . -name “*ma” -print\n```\n\n将打印所有以 ‘ma’ 结尾的文件。注意点 `.`。它表示当前目录。所以我们了解到，如果你不知道具体的名字，`*`\
  \ 是非常好用的。在婚礼场合，这是一个很棒的工具，当有些亲戚来并问你：“记得我是谁吗？”如果这是一种被接受的约定，人们会字面上称呼你为‘* 叔’或‘* 姨姨’，他们会很开心，我们就可以转向设置状态信息等更有价值的追求。\n\
  \n既然谈到了这个话题，如果你记得名字的某部分，比如必须是 Suresh 或 Ramesh，但无法确定位，你可以使用 ‘???esh’。这样，你就能获得更多的社交认可分，因为你没有偏离太远。你甚至可以使用\
  \ `[SR][ua][rm]esh`。这样，人们会认为你正在研究人工智能。\n\n```bash\nfind . -newer Seema\n```\n\n\
  注意括号 `()`。\n\n查找比 `Seema` 更新的文件。在情况下，如果存在任何更多添加。\n\n```bash\nfind . -name “*ti”\
  \ -o -newer Seema \\) -type f -print\n```\n\n这将查找所有以 ‘ti’ 结尾的文件，或者比 `Seema` 更新的文件。\n\
  \n`-d` 表示目录，`-f` 表示普通文件。\n\n反斜杠 `\\` 在括号前是一个转义字符。\n\n你已经见过如何查找文件名，但搜索文件内部的内容呢？你拥有\
  \ `grep` 命令。\n\n我的祖父告诉我，你已经做了很多操作，并在电脑上记录了它们。我有一个文件列表。现在，如果我想搜索包含 grapes 的文件，我是这样做的：\n\
  \n```bash\n$ grep grapes file.txt\n```\n\n你挤压这些 grapes。\n\n```bash\n$ grep -c grapes\
  \ file.txt\n```\n\n`file.txt:24`\n\n`-c` 是计数，而且还有其他选项。比如 `-v` 是反向，显示不包含单词 `grapes`\
  \ 的行。查看有多少文件包含它，只需添加 `-l`（小写 L）。\n\n```bash\n$ grep [a-h] file.txt\n```\n\n方括号可以包含的内容。这将高亮所有包含\
  \ `a` 和 `h` 之间的单词。\n\n```bash\n$ grep a[[:space:]] file.txt\n```\n\n在喝完之后。这是一个战斗机器。\n\
  \n在 `a` 之后，`grep` 使用正则表达式 `a[[:space:]]` 告诉系统查找 `a` 之后的空格。简而言之，以 ‘a’ 结尾的单词。\n\n\
  ```bash\ngrep th.[[:space:]] file.txt\n```\n\nSeema 询问了 `th` 之后的点。她告诉 Lingaraj 括号内部是在查找空间。Lingaraj\
  \ 回答道。“点是告诉系统查找单个字符。所以结果是：\n\n```\nHuge is the sky\nBut if it weren’t for the eye\n\
  ```\n\n元字符是具有字面意思之外的字符。“`$` 是一个很好的例子，” Seema 提道，“锚点是行中的位置。正则表达式用于匹配。例如，`^` 和 `$`\
  \ 是锚点。什么是 `4 + 2`？” Seema 感到很惊讶。Seema 想过询问 Lingaraj ‘为什么？’ 但她觉得 Lingaraj 自己在做这些事情之前问过‘为什么？’。她回答道：“6。”\
