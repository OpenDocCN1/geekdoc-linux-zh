  \           close(fd);\n        }\n    }\n}\n```\n\n上面的函数创建一个 TCP 服务器套接字并将返回的文件描述符传递给调用程序。当然，你不需要单独的函数，可以将其包含在主程序中，如果你只谈论一个服务器。但如果你想扩展，这是一个很好的选择。端口号将是\
