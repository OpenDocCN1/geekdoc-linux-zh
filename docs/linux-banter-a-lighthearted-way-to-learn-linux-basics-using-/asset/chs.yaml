  \nSeema 已经学会了 Linux。\n\n# getopt()\n\n假设派你的朋友去办一个买手提包的任务。你会告诉她什么？”\n\n“我会告诉她去买一个带拉链的手提包，有一个放小镜子的口袋，还有一个放我手机的手机隔层，设计要是红色的。预算是\
  \ 750 卢比。”\n\n“好的，`fetchbag()` 将包含获取手提包的指令。\n\n而且你说的所有其他东西都是选项。现在，这些选项将是：\n\n--zip`\n\
