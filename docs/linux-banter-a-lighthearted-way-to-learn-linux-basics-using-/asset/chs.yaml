  \n### Grep 与表达式\n\nSeema 竖起大拇说：“苹果汁。”\n\n猴子发出了尖叫声。“这是一个错误消息。当使用未定义变量时发生。苹果汁是未定义变量。我们通常喝朗或威士忌。”\n\
  \n```bash\n$ sh -u <script>\nset -o nounset\n```\n\n使用未定义变量时给出错误消息。\n\nLinux 中有\
