  #include <errno.h>\n#include <unistd.h>\n#include <sys/msg.h>\n#define key 0x1254\n\
  struct message_st {\n  long int msg_type;\n  char text[BUFSIZ];\n};\n```\n\n“我们包含了必要的头文件。然后我们定义了对于该程序以及读取者都是唯一的键（key）。我们声明了持有消息类型以及消息的结构，在此例中是一个字符数组，它将用用户输入的消息填充。\n\
  \n```c\nint main() {\n  int loop_cond = 1;\n  struct message_st data_passed;\n \
  \ int msgid;\n  char buffer[BUFSIZ];\n  msgid = msgget((key_t)key, 0666 | IPC_CREAT);\n\
  \  if (msgid == -1) {\n    fprintf(stderr, \"msgget failed with error: %d\\n\",\
  \ errno);\n    exit(EXIT_FAILURE);\n  }\n```\n\n我们进入 `main` 函数，在初始化之后，我们使用唯一的键和\
  \ `IPC_CREAT` 调用 `msgget`。如果失败，我们会在屏幕上打印相关消息。\n\n```c\n  while(loop_cond) {\n  \
  \  printf(\"Enter 要传递的文本. 输入 'enough' 停止: \");\n    fgets(buffer, BUFSIZ, stdin);\n\
  \    data_passed.msg_type = 1;\n    strcpy(data_passed.text, buffer);\n    if (msgsnd(msgid,\
