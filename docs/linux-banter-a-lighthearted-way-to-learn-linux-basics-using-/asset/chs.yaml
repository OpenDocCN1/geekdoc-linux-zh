  \ while 循环内部 `accept` 之后进行微小的更改。\n\n### Select System Call\n\n```c\n#include <sys/types.h>\n\
  #include <sys/time.h>\nstruct timeval {\n    time_t tv_sec;\n    long tv_usec;\n\
  };\n#include <sys/types.h>\n#include <sys/time.h>\nint select(int nfds, fd_set *readfds,\
  \ fd_set *writefds, fd_set *errorfds, struct timeval *timeout);\n```\n\n`select`\
  \ 系统调用基本上是一个监控系统。`select` 监控一组文件描述符是否已准备好进行读取、写入，或者是否存在错误条件。\n\n**参数为：**\n- `nfds`:\
  \ 它可以监控的文件描述符的最大数量。通常是最高文件描述符编号加一。\n- `fd_set`: 告诉系统这是一个文件描述符集，这必须先声明。\n- `readfds`:\
  \ 指向我们想要测试是否读取就绪的文件描述符集，即它们是否可以接受任何输入。\n\n\n\n\n\n`writefds` 用于写入就绪，`errorfds` 用于我们想要检查是否有错误条件的文件描述符集合。\n\
  \n`timeval` 结构包含两个成员，一个指定用户时间，另一个指定微秒为单位的时间。\n\n这是超时值，当这段时间过去后，`select` 将带有已激活的文件描述符并返回。\n\
  \n```c\n#include <sys/types.h>\n#include <sys/time.h>\nvoid FD_ZERO(fd_set *fdset);\n\
  void FD_CLR(int fd, fd_set *fdset);\nvoid FD_SET(int fd, fd_set *fdset);\nint FD_ISSET(int\
  \ fd, fd_set *fdset);\n```\n\n上述是一组宏。\n\n`FD_ZERO` 初始化文件描述符集合，无论是 `readfds`、`writefds`\
  \ 还是 `errorfds`。\n\n`FD_CLR` 从文件描述符集合中移除一个文件描述符。\n\n`FD_SET` 向文件描述符集合添加一个文件描述符。\n\
  \n`FD_ISSET` 检查属于特定文件描述符集合的文件描述符是否处于激活状态。这是在 `select` 返回后进行的，用于检查我们感兴趣的文件描述符是否准备好读取、写入或是否存在错误条件。\n\
  \n我们很快将在一个程序中看到这些运行情况。\n\n还有几个函数需要介绍。\n\n不同类型的计算机通过网络字节序对在网络上传输的多字节整数值达成一致。特别是端口号。不同的计算机可能使用不同的方法来表示所需的数字。我的门牌号是\
