  \n第二天，Seema 早上早起散散步。她看到大约 4 到 5 个人在做慢运动。\n\n她加入了他们，发现很有趣。过了一段时间她才意识到自己迟到了。Seema\
  \ 尽快准备好，去按了 Lingaraj 家的门铃。门铃是一个简单的铃铛装置，不需要电能。\n\n![](img/image_rsrc84X.jpg)\n\n\
  Lingaraj 出现在门口，Seema 能看到他。他留了一下，尽管看到了 Seema，但花了大约 5 分钟才开门。\n\n“你怎么这么才开门？” Seema\
  \ 带着一丝愤怒问道。\n\n![](img/image_rsrc84Y.jpg)\n\n“不。是你迟了。是你先开始的。请进。”\n\nSeema 坐好后，她告诉\
  \ Lingaraj：\n\n“我做了慢运动。”\n\n“既然说到时间，有一个时间系统调用，可以告诉你自 1970 年 1 月 1 日以来过去了多少秒。”\n\n\
  “秒？那可不方便。”\n\nLingaraj 给她看屏幕。\n\n```c\n#include <time.h>\ntime_t time(time_t *tloc);\n\
  ```\n\n它返回一个在 `time.h` 中定义的 `time_t` 类型整数，如果你指定了 `tloc` 格式的位置，它会将值存储在那里。\n\n所以，如果你必须找到两点之间经过的时间，你调用两次\
  \ `time` 并用一个减去另一个。\n\n```c\n#include <time.h>\ndouble difftime(time_t time1, time_t\
  \ time2);\n```\n\n这将给你秒的差值。“谁会需要那个？” Lingaraj 给她看 `tm` 结构体：\n\n```c\nstruct tm {\n\
  \    int tm_sec;\n    int tm_min;\n    int tm_hour;\n    int tm_mday;\n    int tm_mon;\n\
  \    int tm_year;\n    int tm_wday;\n    int tm_yday;\n    int tm_isw;\n    int\
  \ tm_dst;\n};\n```\n\n这会将一个分解的结构转换为原始时间。\n\n```c\ntime_t mktime(struct tm *timeptr);\n\
  ```\n\n如果你想打印时间，有一个比 `printf` 更好的时间相关输出工具：\n\n```c\n#include <time.h>\nsize_t strftime(char\
  \ *s, size_t maxsize, const char *format, struct tm *timeptr);\n```\n\n`s` 是结果字符串。`format`\
  \ 是你指定格式、`%` 符号等。\n\n你可以使用 `strptime` 函数，它接受一个表示日期和时间的字符串并创建一个 `tm` 结构体：\n\n```c\n\
  #include <time.h>\nchar *strptime(const char *buf, const char *format, struct tm\
  \ *timeptr);\n```\n\n`buf` 是字符串。`gmtime` 提供格林尼治标准时间：\n\n```c\n#include <time.h>\n\
  struct tm *gmtime(const time_t *timeval);\n```\n\n`localtime` 提供本地时间：\n\n```c\n\
  #include <time.h>\nstruct tm *localtime(const time_t *timeval);\n```\n\n`asctime`\
  \ 和 `ctime` 返回人类可读的字符串：\n\n```c\n#include <time.h>\nchar *asctime(const struct tm\
  \ *timeptr);\nchar *ctime(const time_t *timeval);\n```\n\n另一个 `time` 命令用于命令行，运行程序并计算系统使用率：\n\
  \n```bash\ntime ./a.out\n```\n\n## 临时文件\n\nLing 开始话题。“我们聊聊临时文件。有时你可能需要创建临时文件。”\n\
  \n```c\n#include <stdio.h>\nchar *tmpnam(char *s);\n```\n\n它返回一个系统中不存在的唯一文件名字符串。它也会更新字符串\
  \ `s` 中的内容。\n\n```c\n#include <stdio.h>\nFILE *tmpfile(void);\n```\n\n上述 C 库函数创建并打开一个具有唯一名称的文件，并返回一个文件流供立即使用，减少了另一个程序创建相同文件的风险。\n\
  \n```c\n#include <stdlib.h>\nchar *mktemp(char *template);\nint mkstemp(char *template);\n\
  ```\n\n\n\n如果你希望新文件名符合某种模式或模板，请使用上述 C 库函数。模板可以是任何想要的内容，其后跟六个 `X` 字符。这六个 `X` 字符会被替换，以产生唯一的文件名。\n\
  \n`mktemp` 和 `mkstemp` 的区别在于 `mktemp` 仅提供文件名。`mkstemp` 在打开文件后返回一个文件描述符。然而，建议仅使用\
