  \       fflush(stdout);\n    }\n}\n```\n\n\n\n部分输出在 4 之后打印，是因为父进程在子进程之前就结束了。\n\n\
  你可能会奇怪，并没有发生真实的通信。没有交换任何消息。但如果你注意到，协调是相对于时间进行的。这已经足以称其为进程间通信（IPC）了。\n\n# IPC : 共享内存\n\
  \nLingaraj 说：\n\n“想想我给出的那个例子，我们会把一个鸡尾酒配方放在岩石附近的某个特定位置。那些敲空的石头。你甚至允许其他进程访问该内存位置。我告诉过你这很有用，因为当我们把配方写在那些石头上并回来收集时，会有那些昨晚实验过的人添加更多的配方。”\n\
  \n![](img/image_rsrc84T.jpg)\n\n配方纸可以被看作内存。醉酒汉和我们之间通过这张纸共享信息。这比创建管道（pipes）或 FIFO（fifos）要快。在这里应该确保没有两个进程同时写入。\n\
  \n系统调用如下：\n\n```c\n#include <sys/shm.h>\nint shmget(key_t key, size_t size, int\
  \ shmflg);\n```\n\n`key_t` `key` 是内存段的。你可以使用 `#define` 来定义一个键，但这个键必须被两个进程已知，以便于进程间通信。\n\
  \n值 `IPC_PRIVATE` 使共享内存对进程是私有的。当我处于低谷时，我想要分享我的故事。但我找不到任何人。所以，那曾是一个 `IPC_PRIVATE`\
  \ 的局面。\n\n“那太悲哀了。”\n\n“在我开始拜访那些敲空的石头之前，确实很悲哀。”\n\n“不，这不是开玩笑。你告诉我这么多关于你自己的故事。它们是悲伤的故事，但你让它们听起来很有趣。我笑了，我感到很好，我感到很惊讶，也对你的某些故事感到很震惊。我不是精神分析师，但我是一个人，我想告诉你，我敬佩那个勇敢于自嘲的家伙。在这种情况下，我想念\
  \ Vijay，但在你身上我找到了一个盟友、一个朋友和一个老师。我对你有极大的尊重。根据家族传统，当我们结婚时，有一个仪式，新娘的哥哥要用甜点迎接客人。这是给家族中最荣誉成员的特权，我无法想象还有别人能来做这件事。我知道我还没跟你商量过，但我已经决定会是你。”\n\
  \nLingaraj 望向远方。对于 Seema 来说，他第一次感到了情感波动。他说：\n\n“我做这件事时会开心得‘甜掉牙’的。”\n\n“会有很多你可以建立联系的人。我的责任是为你介绍一位值得的女性并嫁给你。”\n\
  \n“那我们不要浪费时间了，姐姐。大小是以字节为单位的。”\n\n`shmflag` 类似于 `open` 中的 `mode`。它是 `I_CREAT` 与权限进行位或操作的结果，用于创建一个新的段。如果该段已经打开，它不会报错，而是被忽略，这与你使用信号量时的情况不同。\n\
  \n返回值是内存段标识符。错误时返回 -1。\n\n```c\nvoid *shmat(int shm_id, const void *shm_addr, int\
  \ shmflg);\n```\n\n这用于指定哪些进程有权访问共享内存。这就像是将共享内存段挂载到进程。\n\n`shm_id` 是你从 `shmget()`\
  \ 得到的共享内存标识符。\n\n`shm_addr` 是共享内存挂载到进程的地址。将其留为空指针，系统将处理分配。\n\n但如果你想控制内存地址，可以结合 `shmflg`\
  \ 使用它。但我建议你不要这样做。如果你真的想控制内存段的地址，则使用 `SHM_RND`。\n\n`shmflg` 的其他值之一是 `SHM_RDONLY`，它使内存段变为只读。\n\
  \n更多一些值包括：\n\n- `SHM_EXEC` 允许执行共享内存段中的代码。\n\n如果 `shmat` 成功，它返回一个指向共享内存第一个字节的指针。\n\
  \n```c\nint shmdt(const void *shm_addr);\n```\n\n这会删除共享内存段。但不是删除内容。它接收 `shmat()`\
  \ 返回的地址。\n\n```c\nint shmctl(int shm_id, int command, struct shmid_ds *buf);\n```\n\
  \n这用于控制共享内存。\n\n`shm_id` 是 `shmget` 的返回值。\n\n命令可以是 `IPC_STAT` 用于获取共享内存段的状态信息。\n\n\
  `IPC_RMID` 意味着控制。它从系统中移除共享内存段，销毁它以及 `shmid_ds` 数据结构。\n\n`shmid_ds` 结构包含了关于共享内存段的更多细节。\n\
  \n让我们来看这个写入程序，\n\n`shm_writer_1254.c`\n\n```c\n#include <sys/shm.h>\n#include <stdio.h>\n\
  #define key 0x1254\nint main(){\n    int shmid = shmget(key, BUFSIZ, 0666 | IPC_CREAT);\n\
  \    char *str = (char *) shmat(shmid, NULL, 0);\n    printf(\"Input data\\n\");\n\
  \    fgets(str, BUFSIZ, stdin);\n    printf(\"写入内存的数据: %s\\n\", str);\n    shmdt(str);\n\
  }\n```\n\n现在我们看另一个写入程序，`shm_writer_2995.c`\n\n```c\n#include <sys/shm.h>\n#include\
  \ <stdio.h>\n#define key 0x2995\nint main(){\n    int shmid = shmget(key, BUFSIZ,\
  \ 0666 | IPC_CREAT);\n    char *str = (char *) shmat(shmid, NULL, 0);\n    printf(\"\
  Input data\\n\");\n    fgets(str, BUFSIZ, stdin);\n    printf(\"写入内存的数据: %s\\n\"\
  , str);\n    shmdt(str);\n}\n```\n\n让我们来看读取程序，`shm_reader_1254.c`\n\n```c\n#include\
  \ <sys/shm.h>\n#include <stdio.h>\n#define key 0x1254\nint main(){\n    int shmid\
  \ = shmget(key, BUFSIZ, 0666);\n    char *str = (char *) shmat(shmid, NULL, 0);\n\
  \    printf(\"从内存读取的数据: %s\\n\", str);\n    shmdt(str);\n    shmctl(shmid, IPC_RMID,\
  \ NULL);\n}\n```\n\n还有 `shm_reader_2995.c`\n\n```c\n#include <sys/shm.h>\n#include\
  \ <stdio.h>\n#define key 0x2995\nint main(){\n    int shmid = shmget(key, BUFSIZ,\
  \ 0666);\n    char *str = (char *) shmat(shmid, NULL, 0);\n    printf(\"从内存读取的数据:\
  \ %s\\n\", str);\n    shmdt(str);\n    shmctl(shmid, IPC_RMID, NULL);\n}\n```\n\n\
  \n\n\n“那是提示他换话题的信号。”\n\n“那是信号（CUE）。我说的是队列（queues）。队列（QUEUE）。”\n\n“哦好的。”\n\nLingaraj:\n\
  \n```c\n#include <sys/msg.h>\nint msgctl(int msqid, int cmd, struct msqid_ds *buf);\n\
  int msgget(key_t key, int msgflg);\nint msgrcv(int msqid, void *msg_ptr, size_t\
  \ msg_sz, long int msgtype, int msgflg);\nint msgsnd(int msqid, const void *msg_ptr,\
  \ size_t msg_sz, int msgflg);\n```\n\n消息队列就像你的即时通讯工具。如果我给你发消息，消息就会排队。所以，当你打开应用时，它们就会被送达。\n\
  \n```c\nint msgget(key_t key, int msgflg);\n```\n\n你可以使用上述系统调用创建或访问消息队列。`key` 你你知道它可以取\
  \ `IPC_PRIVATE`，它的作用是……？”\n\n“创建一个只能由创建它的进程访问的消息队列。而 `msgflg` 通常是 `IPC_CREAT` 与九位权限位进行位或运算。如果使用了\
  \ `IPC_CREAT`，即使已经存在消息队列也不会报错。返回消息队列标识符。错误时返回 -1。” Seema 回答。\n\n```c\nint msgsnd(int\
  \ msqid, const void *msg_ptr, size_t msg_sz, int msgflg);\n```\n\n这是你发送消息的方法。`msqid`\
  \ 是 `msgget` 的返回值。`msg_ptr` 参数是一个指向调用者定义的结构指针，通用格式如下：\n\n```c\nstruct msgbuf {\n\
  \  long mtype;      /* 消息类型，必须 > 0 */\n  char mtext[1];   /* 消息数据 */\n};\n```\n\n\
  `msgflg` 决定当当前消息队列满或达到系统消息队列限制时会发生什么。有两种场景。\n\n| `IPC_NOWAIT` (设置) |\n| `IPC_NOWAIT`\
  \ (清除) |\n\n`msgsnd` 成功返回 0，失败返回 -1。\n\n```c\nint msgrcv(int msqid, void *msg_ptr,\
  \ size_t msg_sz, long int msgtype, int msgflg);\n```\n\n这从消息队列中接收消息。`msqid` 再次是\
  \ `msgget` 返回的那个。`msg_ptr` 指向要接收的消息的指针。`msg_sz` 是消息大小。`long int msgtype` 指定消息类型。`msgflg`\
  \ 设置要检索消息的优先级。\n\n```c\nint msgctl(int msqid, int command, struct msqid_ds *buf);\n\
  ```\n\n这是用于控制消息队列的。命令之一可以是 `IPC_RMID`，用于删除消息队列。\n\n`ipcs` 命令。\n\n`ipcs -s`、`ipcs\
  \ -m`、`ipcs -q` 将告诉你是否有任何信号量、共享内存或消息队列仍然残留。如果进程完成后仍有信号量、共享内存或消息队列遗留，你可以分别使用 `ipcrm\
  \ -s`、`ipcrm -m` 和 `ipcrm -q` 来移除它们。\n\n消息队列程序在操作流程上与共享内存相似。\n\n让我们来看两个程序，先看发送者，再看接收者。\n\
  \n### mqsender.c\n\n```c\n#include <stdlib.h>\n#include <stdio.h>\n#include <string.h>\n\
  #include <errno.h>\n#include <unistd.h>\n#include <sys/msg.h>\n#define key 0x1254\n\
  struct message_st {\n  long int msg_type;\n  char text[BUFSIZ];\n};\nint main()\
  \ {\n  int loop_cond = 1;\n  struct message_st data_passed;\n  int msgid;\n  char\
  \ buffer[BUFSIZ];\n  msgid = msgget((key_t)key, 0666 | IPC_CREAT);\n  if (msgid\
  \ == -1) {\n    fprintf(stderr, \"msgget failed with error: %d\\n\", errno);\n \
  \   exit(EXIT_FAILURE);\n  }\n  while(loop_cond) {\n    printf(\"Enter 要传递的文本. 输入\
  \ 'enough' 停止: \");\n    fgets(buffer, BUFSIZ, stdin);\n    data_passed.msg_type\
  \ = 1;\n    strcpy(data_passed.text, buffer);\n    if (msgsnd(msgid, (void *)&data_passed,\
  \ BUFSIZ, 0) == -1) {\n      printf(\"msgsnd failed\\n\");\n      exit(EXIT_FAILURE);\n\
  \    }\n    if (strncmp(buffer, \"enough\", 6) == 0) {\n      loop_cond = 0;\n \
  \   }\n  }\n  exit(EXIT_SUCCESS);\n}\n```\n\n“你能解释一下发生了什么吗？” Lingaraj 问道。\n\n此时，Seema\
