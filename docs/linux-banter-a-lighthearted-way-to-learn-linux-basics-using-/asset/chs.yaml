  \ `esac` 结束语句。这是要遵循的语法。”Lingaraj 说。\n\n“你会帮我和鳄鱼说话吗？”Seema 问道。\n\n“你不想那样。它一旦打开很难闭。如果\
  \ `if` 必须筛选不同的语句，生活会变得困难。所以我们有 `&&` 列表。`&&` 列表就像顺序测试。示例：\n\n`seqtest.sh`\n\n```bash\n\
