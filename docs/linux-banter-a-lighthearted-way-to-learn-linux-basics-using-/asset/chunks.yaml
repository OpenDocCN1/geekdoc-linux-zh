    \n- `SIGABORT`\n- `SIGALRM`\n- `SIGFPE`\n- `SIGHUP`\n- `SIGILL`\n- `SIGINT`\n\
    - `SIGKILL`\n- `kill [options] <pid>`\n\n你能猜到 `kill` 命令能对进程做什么吗？“它杀掉它，”Seema 说，“它向进程发送一个信号。而且\
    \ `kill` 命令甚至可以发送一个信号，如果进程在心情好的话告诉它继续。如果你不指定信号，默认是 `TERM`。这意味着顾如其名，`kill` 命令将向\
    \ `pid` 定义的进程发送一个终止信号。如果程序不听，`-KILL` 选项一定能杀掉。顺便说一下，kill 对僵尸进程无效。”\n\n如果 `pid`\
    \ 是一个负数，则 `pid` 的正值将被视为进程组。如果是正数，则指示进程 ID。如果是 `-1`，除了 `init` 和 `inetd` 之外的所有进程都将收到信号。可以使用名称或数字指定信号。要查看可用信号列表，使用\
    \ `kill -l` 命令。\n\n这就是 `kill` 命令。还有一个 `kill` 系统调用：\n\n```c\n#include <sys/types.h>\n\
    #include <signal.h>\nint kill(pid_t pid, int sig);\n```\n\n如你所见，它接收要消除的进程 `pid`\
    \ 和要发送的信号。你只能向具有相同用户 ID 的进程发送 `kill` 信号。你不能向不同用户 ID 的进程发送。超级用户可以杀死。如果出现以下情况，`kill`\
    \ 会失败并返回 `-1`：\n\n- 如果指定的信号不是有效信号，将 `errno` 设置为 `EINVAL`。\n- 如果没有权限，`errno` 被设置为\
    \ `EPERM`。\n- 如果指定的进程不存在，从而将 `errno` 设置为 `ESRCH`。\n\n“为什么只有杀死的信号呢。这么消极。难道不能有一个鼓励性的信号吗？”“想象一下\
    \ Vijay 正在和朋友考虑啤酒，而叔叔在没完没了地说他年轻时是如何击败恶徒的。你想鼓励那个进程还是杀掉它？”Lingaraj 问道。“我想用 `-KILL`\
    \ 选项杀掉它。但我该如何鼓励他听呢？”“你可以为此设置 `nice`。使用 `nice` 命令。”\n\n| nice 选项 | 命令参数 |\n| :---\
    \ | :--- |\n\n“你可以设置一个像 -20 到 20 之间的值。”“好的，我会用它给那个说听话的命令设置一个 20 的值。”Lingaraj 思考了一会儿。他似乎陷入了困境。他开口了。\n"
- fmt: "\n# Signals and Blocking\n\nThe signals to block. What we are talking about\
    \ here, is this. When a signal occurs, the handler function is called and runs\
    \ to completion. If within that time, another signal appears, this robust system\
    \ call, `sigaction`, can block the fresh signal.\n\n## Signal Action Modifiers\n\
    \n`int sa_flags`\n\nSignal Action Modifiers. It tells whether to get back into\
    \ position to catch a new signal. When you set it to `SA_RESETHAND`, the `sigaction`\
    \ system call handles the signal once.\n\nThere are other flags too which are\
    \ available in the man pages. \n\n`oact` is a location which will hold the previous\
    \ signal action that was made.\n\n```c\n#include <signal.h>\nint sigaddset(sigset_t\
    \ *set, int signo);\nint sigemptyset(sigset_t *set);\nint sigfillset(sigset_t\
    \ *set);\nint sigdelset(sigset_t *set, int signo);\n```\n\nThese are C library\
    \ functions. You can tell the program to specifically deal with one signal at\
    \ a time or make a broad policy to deal with signals. So, you can make a set of\
    \ all these signals and specify what to do. Also, there might be situations where\
    \ your program is working on a signal received and another signal comes. So, you\
    \ might need to suspend the function of this and kill the process. No need of\
    \ confusion. You can handle all these signals using a signal set.\n\n## Signal\
    \ Sets\n\nThe signal set is of the type `sigset_t`.\n\nSo, you can fill your signal\
    \ set with all the available signals through the `sigfillset()` C library function.\
    \ Likewise, you can empty the set of all signals using the `sigemptyset()` C library\
    \ function.\n\nYou can add individual signals to a set by specifying their numbers\
    \ through `sigaddset()`.\n\nAnd you can delete individual signals from a set by\
    \ specifying their numbers through `sigdelset()`.\n\nAlso, you can find out if\
    \ a signal is a member of a set by enquiry.\n\n```c\nint sigismember( const sigset_t\
    \ *set, int signum)\n```\n\nThis returns 1 if the signal is a member of the set,\
    \ 0 if it’s not and -1 on error.\n\n```c\n#include <signal.h>\nint sigprocmask(int\
    \ how, const sigset_t *set, sigset_t *os);\n```\n\nThe above system call is to\
    \ change process signal mask. If a signal is blocked by process it won’t be delivered,\
    \ will remain pending. A program can determine which of blocked signals are pending\
    \ by calling the C library function `sigpending`.\n\n```c\n#include <signal.h>\n\
    int sigpending(sigset_t *set);\n```\n\nThis system call writes a set of signals\
    \ into the signal set pointed to set, that are blocked from delivery.. returns\
    \ 0 if successful, otherwise, -1 with errno to indicate the error.\n\n```c\n#include\
    \ <signal.h>\nint sigsuspend(const sigset_t *mask);\n```\n\nThe `sigsuspend` system\
    \ call replaces the process signal mask with the signal set given by mask then\
    \ suspends execution. It will resume after the execution of signal handling function.\n\
    \n## sigaction Example\n\nLet’s look at a program that uses `sigaction`.\n\n`ayyo.c`\n\
    \n```c\n#include <signal.h>\n#include <stdio.h>\n#include <unistd.h>\n\nvoid ctrlc(int\
    \ sig){\n    printf(\"I advise you not to stop me, %s\\n\", getlogin());\n}\n\n\
    void shutdown_req(int sig){\n    printf(\"I am process %d and I know who is trying\
    \ to kill me. It's you, %s\\n\", getpid(), getlogin());\n}\n\n/* finish(int sig){\n\
    \    printf(\"This function is useless because it is trying to handle SIGKILL\
    \ signal.\\n\");\n}*/We declare the above three functions, one each for particular\
    \ signal, SIGINT, SIGTERM and SIGKILL. The function that handles SIGINT works\
    \ only once because we used SA_RESETHAND flag. We print the relevant message and\
    \ that is all this function does.\n\nint main(){\n    struct sigaction act;\n\
    \    act.sa_handler = ctrlc;\n    sigemptyset(&act.sa_mask);\n    act.sa_flags\
    \ = SA_RESETHAND;\n    sigaction(SIGINT, &act, 0);\n\n    act.sa_handler = shutdown_req;\n\
    \    sigemptyset(&act.sa_mask);\n    act.sa_flags = 0;\n    sigaction(SIGTERM,\
    \ &act, 0);\n\n    /* This is irrelevant because a SIGKILL will kill the process\
    \ immediately and it cannot be handled.\n    act.sa_handler = finish;\n    sigemptyset(&act.sa_mask);\n\
    \    act.sa_flags = 0;\n    sigaction(SIGKILL, &act, 0);\n\n    /*Then the handler\
    \ function is specified and the signal set, sa_mask is made empty. We don’t want\
    \ any signals to block. Because anything you put here will not be delivered to\
    \ the process. The flags whether SA_RESETHAND is needed is specified. In the first\
    \ case, SA_RESETHAND is specified, which means the signal will be handled only\
    \ once because the signal is not reset. If you want it to work every time, you\
    \ need to reset the signal by including SA_RESETHAND.*/\n    while(1) {\n    \
    \    printf(\"I am happy in my world!\\n\");\n        sleep(1);\n    }\n}/*This\
    \ is the main part where the program keeps on printing in an infinite loop until\
    \ the signal is sent. */\n```\n\nThe output is:\n\n```\nI am happy in my world!\n\
    I am happy in my world!\nI am happy in my world!\nI am happy in my world!\nI am\
    \ happy in my world!\nI am happy in my world!\nI am happy in my world!\nI am happy\
    \ in my world!\nI am happy in my world!\n^CI advise you not to stop me, Lingaraj!\n\
    I am happy in my world!\nI am happy in my world!\nI am happy in my world!\nI am\
    \ happy in my world!\nI am happy in my world!\nI am happy in my world!\nI am happy\
    \ in my world!\nI am happy in my world!\nI am happy in my world!\nI am happy in\
    \ my world!\nI am process 41620 and I know who is trying to kill me. It's you,\
    \ Lingaraj\nI am happy in my world!\nI am happy in my world!\nI am happy in my\
    \ world!\nI am process 41620 and I know who is trying to kill me. It's you, Lingaraj\n\
    I am happy in my world!\nI am happy in my world!\nI am happy in my world!\nI am\
    \ happy in my world!\n^C\n```\n\nSo, you see for the second Ctrl+C, it got killed\
    \ whereas for the SIGTERM process, it used the handler every time.\n\n“Tomorrow,\
    \ we will go to this exciting place.” said Lingaraj and finished the session.\
    \ Seema went and called the doctor. There was a change in Vijay’s disposition\
    \ and he was showing human like tendencies and Seema was convinced that he would\
    \ come back to normal soon.\n\n# Threads and mutex\n\nThe next day, they took\
    \ an 8 mile hike. They passed wonderful streams, waterfalls, through foliage and\
    \ over cliffs without meeting a single person.\n\n![](image_rsrc858.jpg)\n\nThey\
    \ finally reached a small settlement where a few people were making threads.\n\
    \n“I brought you here to set up the context. Today, we will talk about threads.”\n\
    \n“Are you out of your mind? I am really worried and trying to get back to Vijay\
    \ at the earliest and you are behaving like ceremony.” said Seema with anger in\
    \ her voice. After a while, Seema apologised. Lingaraj didn’t seem like he was\
    \ hurt. He spoke.\n\n“A thread is an execution slice.”\n\n“I don’t understand.”\n\
    \n“I opened a hotel once. I used to get orders from Mysore and sometimes Hubli.\
    \ So I used to set up a small operation there whenever the order came. I used\
    \ to go there and cook. But the orders kept pouring in. So I started a franchise\
    \ model and gave them to people in various districts of Karnataka. They used to\
    \ inherit my model of work. Until one fateful day.”\n"
