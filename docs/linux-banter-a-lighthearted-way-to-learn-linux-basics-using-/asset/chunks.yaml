    Here, if you notice, select returns even if a connection from a client closes.
    From our perspective, we don’t know this yet. It could be data ready also. But
    when we proceed to read after testing for FD_ISSET, then, we get a return value
    of zero on the read call for the socket. Then the relevant message gets printed
    on the screen.


    Another solution is use the ioctl system call. This can be operated on a socket
    file descriptor and checked to see whether the client_particular_fd is active
    on the client’s side. If it is closed, then we proceed to close it on the server
    side and clear the file descriptor using FD_CLR(fd, &read_fd_set).


    I think this will do for a start.” said Lingaraj and shut down his laptop.


    Seema sensed the learning project was over. Lingaraj had made it enjoyable and
    she wanted to thank him. She then reasoned he had spent his time and resources
    teaching her and he had to be financially compensated. She did not know how to
    put that question. She was vacillating and Lingaraj perceived the dilemma.


    “You owe me nothing. Not because I can’t do with some money, but because you are
    a shero. You have really come out of your comfort zone and have done things for
    love. It takes courage and I have seen another aspect of humanity through this
    episode. To some of your questions, I have retorted bordering on the insult, I
    have made fun of you sometimes and you didn’t complain.”


    “That’s because I know where you are coming from. You have been a great friend
    and banter is allowed. I will miss these sessions. If I become a famous programmer,
    I will mention you in my speech.”


    “I will take it as a compliment. Talking of compliments, there was this incident
    that happened with me.'
