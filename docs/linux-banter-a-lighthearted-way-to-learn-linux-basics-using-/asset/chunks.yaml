    \ current directory.\n\n`displaydir.c`\n\n```c\n#include <unistd.h>\n#include\
    \ <stdio.h>\n#include <dirent.h>\n#include <stdlib.h>\nvoid displayfiles(){\n\
    \    DIR *dp;\n    struct dirent *entry;\n    char dir[1024];\n    getcwd(dir,\
    \ 1024);\n    if((dp = opendir(dir)) == NULL) {\n    printf(\"Cannot open the\
    \ specified directory: %s\\n\", dir);\n    exit;\n    }\n    while((entry = readdir(dp))\
    \ != NULL) {\n    printf(\" Name of file is : %s\\n\", entry®d_name);\n    }\n\
    \    closedir(dp);\n}\nvoid main(){\n    printf(\"Beginning to display contents\
    \ of current directory.\\n\");\n    displayfiles();\n    exit(0);}\n}\n```\n\n\
    The `®` is actually a special character, but in the program you have to use `->`,\
    \ which is a minus sign followed by the greater than sign. We access structure\
    \ members with a structure.member usually, but if it’s a pointer to a structure,\
    \ we use `pointer_to_structure->member`.\n\n## Error Types\nThe types of Errors\
    \ you can get are:\n\n- `EPERM`\n- `ENOENT`\n- `EINTR`\n- `EIO`\n- `EBUSY`\n-\
    \ `EEXIST`\n- `EINVAL`\n- `EMFILE`\n- `ENODEV`\n- `EISDIR`\n- `ENOTDIR`\n\n##\
    \ Functions\n```c\n#include <string.h>\nchar *strerror(int errnum);\n```\n`strerror`\
    \ is a C library function that tells you what the error was if you give it an\
    \ error number. It returns a pointer to a string containing the message.\n\n```c\n\
    #include <stdio.h>\nvoid perror(const char *s);\n```\nThis prints the latest error\
    \ following the string you specify in `s`.\n\n# Memory and command line arguments\n\
    Lingaraj began.\n\n“We can use a file and store it in a particular memory location.”\n\
    \nAn example would be putting a cocktail recipe in a particular location. You\
    \ can even specify the location or leave it to the kernel. Usually, according\
    \ to my grandfather’s instructions we place it near the pond on the rocks. You\
    \ can even specify whether it can be read, written or executed. You can even allow\
    \ other files and processes to access the memory location. Useful because whenever\
    \ we put it on those rocks and come back to collect it, there would be more recipes\
    \ added by people who would have experimented the previous night. Also, we find\
    \ the inventors of this recipe still lying there in stupor.\n\n![](image_rsrc84T.jpg)\n\
    \n## mmap Syntax\nThe syntax is:\n\n```c\n#include <sys/mman.h>\nvoid *mmap(void\
    \ *addr, size_t len, int prot, int flags, int fildes, off_t off);\n```\n\n“Lots\
    \ of arguments.” said Seema.\n\n“Let’s imagine we have have a cocktail called\
    \ the conflict arrestor and if you look at my grandfather’s text file for this,\
    \ the contents of the file are:\n\n‘This is a conflict arrestor where the parties\
    \ indulging in a quarrel are given doses so they forget logic. This is achieved\
    \ by…’”\n\n“Forget the contents, tell me what the arguments are.” said Seema.\n\
    \n- `addr` is the address in memory. Usually it is zero to let the kernel decide\
    \ on its own.\n- `len` is the length of the memory block.\n- `prot` is what sets\
    \ permissions:\n    - `PROT_READ`: You can read the segment.\n    - `PROT_WRITE`:\
    \ The segment can be written to.\n    - `PROT_EXEC`: The segment can be executed.\n\
    \    - `PROT_NONE`: The segment can’t be accessed.\nThe `flags` parameter controls\
    \ how changes made to the segment by the program are reflected in other places.\n\
    \n- `MAP_PRIVATE`\n- `MAP_SHARED`\n- `MAP_FIXED`\n\n- `filedes` is the file descriptor.\n\
    - `off_t` is the offset.\n\n```c\n#include <sys/mman.h>\nint msync(void *addr,\
    \ size_t len, int flags);\n```\nIf there are changes, `msync()` updates the mapped\
    \ file. Something like `fflush`. It’s like saving.\n\nThe flags are:\n- `MS_ASYNC`:\
    \ An update be scheduled, but the call returns immediately.\n- `MS_SYNC`: Requests\
    \ an update and waits for it to complete.\n- `MS_INVALIDATE`: Invalidates other\
    \ mappings of the same file. (Useful when you want to update with fresh values\
    \ just written.)\n\nSeema attempted to explain the flags.\n\n“I can’t be as good\
    \ as you at analogies or weird stories. But `MS_ASYNC` is like asking your subordinate\
    \ to do a job, tell him and come back. `MS_SYNC` is like being there until the\
    \ job is complete. `MS_INVALIDATE` is like saying, ‘Don’t listen to anybody else\
    \ for instructions.’ to your subordinate.”\n\n```c\n#include <sys/mman.h>\nint\
    \ munmap(void *addr, size_t len);\n```\n`munmap` releases the memory segment.\
    \ Something you will find useful if Vijay’s memory is rife with information about\
    \ a particular Sanjana or Savitri.”\n\nLingaraj showed her the screen.\n\n“Look\
    \ here.”\n\n# mapandunmap.c\n`mapandunmap.c`\n\n```c\n#include <string.h>\n#include\
    \ <unistd.h>\n#include <stdio.h>\n#include <sys/mman.h>\n#include <fcntl.h>\n\
    #include <stdlib.h>\ntypedef struct {\n    int integer;\n    char string[1024];\n\
