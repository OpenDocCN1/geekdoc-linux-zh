    %s - After waking up\\n\", message);\n}\nint main(){\n  pthread_t t1, t2;\n  printf(\"\
    Main program now running\\n\");\n  pthread_create(&t1, NULL, (void *)print_func,\
    \ (void *) \"First call to pthread\");\n  pthread_create(&t2, NULL, (void *)print_func,\
    \ (void *) \"Second call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2,\
    \ NULL);\n  printf(\"Back to main after thread join\\n\");\n}\n```\n\nAnd then\
