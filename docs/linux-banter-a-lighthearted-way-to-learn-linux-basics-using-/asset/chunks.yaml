    Enough for today.”


    The next day, Lingaraj took Seema to a mango grove in the morning. There were
    a lot of monkeys there and they all seemed to recognise Lingaraj.


    Lingaraj spoke as they walked.


    “There is a way to talk to a system.  The system demands the syntax be right and
    a lot of other things. I trained a monkey once. If I snapped my fingers thrice
    in front of it’s face, it would fetch me mangoes from a tree. But if I snapped
