  trans: "\n上述程序中发生的情况是：使用 `fork` 创建了一个子进程，我们通过 `fork` 的返回值判断程序现在是处于父进程还是子进程中。在第一次实例，它处于子进程中，因为\
    \ `fork` 返回值为 `0`。然后我们从第一个文件描述符中进行读取。现在，一个与正在执行的程序不同的进程成功地从你写的程序中读取了内容，尽管它是一个子进程。因此，正在发生某种通信。这很容易，因为子进程继承了文件描述符。但如果这两个程序是完全不同的呢？\n\
    \n我们需要两个程序。我们把这一个称为“生产者程序”，因为它提供了要传递的数据。我们将其命名为 `pipe_prod.c`。\n\n### pipe_prod.c\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include\
    \ <string.h>\nint main(){\n    int total_bytes;\n    int filed_pipe[2];\n    const\
    \ char chars_passed[] = \"Crocodile Doctor\";\n    char buffer[BUFSIZ + 1];\n\
    \    pid_t fork_success;\n    memset(buffer, '\\0', sizeof(buffer));\n    pipe(filed_pipe);\n\
    \    fork_success = fork();\n    if (fork_success == -1)\n    {\n        fprintf(stderr,\"\
    Fork Failure\");\n        exit(EXIT_FAILURE);\n    }\n    else if (fork_success\
    \ == 0)\n    {\n        sprintf(buffer,\"%d\", filed_pipe[0]);\n        (void)\
    \ execl(\"pipe_cons\",\"pipe_cons\", buffer, (char*) 0);\n        printf(\"This\
    \ is the child process,but this text won't be displayed because execl finishes\
    \ off the calling process.\");\n        exit(EXIT_FAILURE);\n    }\n    else\n\
    \    {\n        total_bytes = write(filed_pipe[1],chars_passed, strlen(chars_passed));\n\
    \        printf(\"This program wrote %d bytes - %s\\n\", total_bytes, buffer);\n\
    \    }exit(EXIT_SUCCESS);}\n```\n\n第一个变化是 `sprintf` 函数。它捕获了传递给 `pipe` 的数组中的第一个文件描述符并存储在\
    \ `buffer` 中。也就是说，它将存储在 `filed_pipe[0]` 中的文件描述符值打印到 `buffer` 中。Lingaraj 解释道，“因为我们之后调用的第二个程序不会继承这些文件描述符。”\n\
    \n“但是有一个对 `fork` 的调用，”Seema 说。\n\n“是的。逻辑是如果我们使用 `execl` 调用另一个程序（我们确实会这样做），调用进程就结束了，尽管该进程本身仍在运行。这就像是别人接管了我的位置并且不再留那里。所以，进程结束了。我们调用\
    \ `fork` 创建一个子进程，然后在子进程中调用 `execl`。这样，父进程被保留了，而子进程结束了。因此，你看不到 `printf` 语句中的文本‘This\
    \ is the child process,but this text wont be be displayed because execl finishes\
    \ off the calling process.’。在 `execl` 中，我们调用了要执行的程序 `pipe_cons`，并提供了两部分信息：其一是作为参数的程序名称；二是我们存储在\
    \ `buffer` 中的文件描述符。所以，被 `execl` 调用的程序将拥有这些信息。”\n\n让我们来看看接收数据的消费者程序。它被命名为 `pipe_cons.c`。\n\
    \n### pipe_cons.c\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
    #include <string.h>\nint main(int argc,char *argv[]){\n    int bytes_ex;\n   \
    \ char buffer[BUFSIZ + 1];\n    int file_des;\n    memset(buffer,'0',sizeof(buffer));\n\
    \    sscanf(argv[1],\"%d\", &file_des);\n    printf(\"The argument to the consumer\
    \ is %s\\n\", argv);\n    bytes_ex = read(file_des, buffer, BUFSIZ);\n    printf(\"\
    The process %d has read %d bytes. Content : %s \\n\", getpid(), bytes_ex, buffer);\n\
    \    exit(EXIT_SUCCESS);}\n```\n\n它通过 `sscanf` 接收数据。但关于 `memset()`。\n\n```c\n\
    #include <string.h>\nvoid *memset(void *s, int c, size_t n);\n```\n\n`memset()`\
    \ 函数将 `s` 指向的内存区域用常量字节 `c` 填充。如果你想用字符填充一个内存区域，请使用上面的程序。\n\n“我们有一个叫 Sathya 的家伙。他是个演讲者。以前没人听他的话，因为他总是撒谎。他有一个假的终止符。如你所知，终止符结束字符串。他经常说‘我的演讲结束了’，然后又多说半小时。你想见他吗？这件事我就不多说了。”\
    \ Lingaraj 知道她没抓住重点。他不知道如何解释，于是他继续往下。下一行打印了这个消费者程序接收到的参数，这是在我们运行生产者程序时发送的。这会在输出中显示该程序的名称，即\
    \ `pipe_cons`。然后它从文件描述符中读取。它读取了什么？它不是从文件读取，而是从一个通过 `pipe` 写入的文件描述符读取。当然你可以说，与其通过缓冲区传递参数，为什么不直接传递字符串\
    \ ‘Crocodile Doctor’ 呢？我们可能需要传递无法简单存储在字符串中的大量数据。”\n\n在我们创建了名为 `pipe_prod` 和 `pipe_cons`\
    \ 的可执行文件后，重要的一步是仅使用 `./pipe_prod` 运行 `pipe_prod` 程序。\n\n```\nThis program wrote\
    \ 16 bytes -The argument to the consumer program is pipe_cons\nThe process 5354\
    \ has read 16 bytes. Content : Crocodile Doctor\n```\n\n“5354 正如我之前说的，是特定实例的。如果第二个进程不是从第一个程序启动的，而是一个完全不相关的程序呢？”\
    \ Seema 问。\n\n“好问题。对于这种情况，我们有 FIFOs。正如我所说，FIFO 是先入先出的。你放入 FIFO 的任何东西都必须按照你放入时的顺序进行访问。”\n\
    \n```c\n#include <sys/types.h>\n#include <sys/stat.h>\nint mkfifo(const char *filename,\
    \ mode_t mode);\n```\n\n这会根据你指定的文件名和模式创建一个 FIFO。模式是非常重要的。你不能直接使用 `O_RDWR`。首先它根本没有必要，其次其结果是未定义的。假设我在网上上传了一个视频，然后去了一个没有网络连接的地方徒步。我请朋友帮我记录播放量。两天后，我用老式座机电话打给他，如果播放量是\
    \ 0，他就会拦截我的电话，以免让我在徒步时感到沮丧。如果我一小时后拨打，他仍然会拦截我。但如果播放量是 1，他就会接听电话并告诉我好消息。如果是朋友，即使播放量是\
    \ 0，我也无法强制他给我报告。然而，如果我雇佣了一位电影行业的助理并付他工资，他会告诉我是播放量为 0。当然，他会对我失去尊重并寻找其他工作，但那是另一个问题了。我可以强制要求他执行\
    \ `O_NONBLOCK`。在 `open` 的语文中，当你传递管道模式时，使用 `O_RDONLY` 或 `O_WRONLY` 配合 `O_NONBLOCK`，\n\
    \n```c\nopen(const char *path, O_RDONLY);\n```\n\n“`open` 调用将阻塞；直到有进程打开同一个 FIFO\
    \ 进行写入，它才会返回，” Lingaraj 说。\n\n“所以，这就像你的朋友在你的视频有播放量之前一直拦截你的电话，” Seema 说。Lingaraj\
    \ 继续说道：\n\n```c\nopen(const char *path, O_RDONLY | O_NONBLOCK);\n```\n\n“现在 `open`\
