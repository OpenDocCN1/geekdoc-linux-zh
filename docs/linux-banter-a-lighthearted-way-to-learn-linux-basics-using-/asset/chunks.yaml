  trans: "\n\n| 程序中的变量 `var` 是 Seema 的婚礼 | 此程序的原始第一个参数是 Seema |\n| 函数中的变量 `var` 是\
    \ Lingaraj 的函数 | 此函数的第一个参数是 Lingaraj |\n\n尽管我们在程序和函数中都使用了 ‘$1’ 且相同的变量名，但都是 ‘`var`。\n\
    \n现在，在 shell 编程中有些命令是你在命令提示符（command prompt）中无法使用的。\n\n```bash\nbreak\n```\n\n\
    你可以使用 `break` 在条件满足之前退出循环。`break` 语句会导致立即退出外层循环。如果 `break` 在一个 `if` 语句中，而 `if`\
    \ 语句又在 `while` 或 `for` 循环中，那么 `break` 不仅会退出 `if` 语句，还会退出 `while` 循环或 `for` 循环。”Lingaraj\
    \ 说道。\n\n“在我情况下，当我准备我的演示稿时，我决定一直工作到完成。但如果我闻到邻居家里传来的蛋糕香味，我会休息一下（break）去烤一个。”Seema\
    \ 说道。\n\n“在我们的社区里，如果邻居做了蛋糕，我们直接过去参与。就好像是专门为我们做的一样。\n\n就像 `break` 一样，我们还有 `continue`，它告诉程序继续执行。\n\
    \n`continue` 跳过当前迭代循环内剩余的命令。\n\n假设你正在为研讨会接待客人。这些是你需要的事情。\n\n```bash\ndo {\n  你看到这个人\n\
    \  你向他们要身份证\n  你要填好的申请表\n  你收钱\n} while (people walking in)\n```\n\n如果必须对每个人都这样做，这必须是一个循环。但如果你在研讨会上看到了我？那么，我们就改变逻辑。\n\
    \n```bash\ndo {\n  你看到这个人\n  if person = Lingaraj\n    continue\n  你向他们要身份证\n\
    \  你要填好的申请表\n  你收钱\n} while (people walking in)\n```\n\n基本上，`continue` 根据条件跳过该特定迭代的循环。\n\
    \n现在先不要担心语法。如果你在研讨会上看到我，那么你就会跳过所有剩余任务，因为你很了解我，不会向我要身份证、填好的申请表或钱。\n\n“我懂了。`continue`\
    \ 是用于像你这样的特殊情况的，我们不想经历那些为普通人设计的后续流程。”\n\nLingaraj 照常，继续说道。\n\n“回到命令。有时命令可以存储在变量中。例如：\n\
    \n```bash\n$ CD=\"cd Lingaraj\"\n$ eval $CD~/Lingaraj $\n```\n\n“你有没有遇到过这种情况：你没有告诉\
    \ Vijay 发生了什么，而是等他来猜？”Lingaraj 问道。\n\n“我必须承认。那天是我的生日，我做了一道特殊的菜。Vijay 忘了。更糟糕的是，他问：‘今天什么日子？’。我说‘没什么’，”Seema\
    \ 说道。\n\n“现在，如果 `eval` 可以在现实生活中，\n\n```bash\neval $Nothing\n```\n\n输出将会是：\n\n\
    今天是我的生日，祝我生日快乐！\n\n在这里，`Nothing` 是一个变量，存储了一条命令，告诉 Vijay 告诉你些什么。\n\n`eval` 查看存储在变量中的命令并执行它。\n\
    \n所以，如果你看现实生活的程序，\n\n```bash\n$ Nothing=\"echo ‘Today is my birthday, wish me!’\"\
    \n$ eval $Nothing\n```\n\n输出将是：\n\n| 今天是我的生日，祝我生日快乐！ |\n\n`exec` 用另一个程序替换 shell。就像废除\
    \ shell 一样。\n\n```bash\n$ exec echo This shell is gone!\n```\n\n文字回显到屏幕上，shell\
    \ 就消失了。”\n\n“这样好吗？shell 消失？shell 不重要吗？”Seema 问道。\n\n“从哲学上来说，不！”\n\nSeema 明白他指的是人的“外壳”。Lingaraj\
    \ 继续说道。\n\n“你可以这样记忆它。意志执行。一个人在自己的位置上提名了某人然后消失。\n\n我的曾祖父喜欢调配各种植物和蔬菜汁来制作他的特色饮料。在那之后他经常讲很多大话。在某个命运的一天，他制作了某种饮料。他喝了一口，脸就变蓝了。在去世之前，他宣布我的父亲（实际上是一位具有高声望的学者，拥有生物技术工程学位和\
    \ MBA 学位）为下一任调配师。我爷爷的老客户现在仍然来我父亲那里买饮料，而我父亲把他们赶走了。\n\n`exit` 命令。如果你在程序中的命令后输入 `exit`，你可以返回一个可以被程序使用的值。我有一个请求。如果你和我一起修完这门课程后，有人问你进展如何，告诉他们是\
    \ 0。”\n\n“你没那么糟！”\n\n“在 Linux 中，`exit` 代码为 0 通常表示成功。\n\n还有 125 种退出状态。\n\n现在，是\
    \ `export` 命令。你说我没那么糟。如果你觉得我很棒（我确定你也会这么想），告诉我也没用。你还得告诉别人。所以，\n\n```bash\nLingaraj=Great\n\
    ```\n\n除了赋值之外，你还必须导出它。\n\n```bash\nexport Lingaraj\n```\n\n这样像你这样的人就可以来找我向我学习。\n\
    \n在 Linux 中，当你使用 `export` 命令时，该变量就不仅仅是一个局部变量，它的值可以在当前脚本调用的其他脚本和命令中使用。\n\n看看这个\
    \ shell 脚本，`echoexport1.sh`\n\n```bash\nLingaraj=gexport Lingaraj\necho The value\
    \ of Lingaraj is $Lingaraj\necho \"This is the shell script where Lingaraj=great\
    \ is declared.\"\necho Now calling the second script.\n./echoexport2.sh\n```\n\
    \n还有 `echoexport2.sh`\n\n```bash\nLingaraj=gexport Lingaraj\necho The value of\
    \ Lingaraj is $Lingaraj\necho \"This is the shell script where Lingaraj=great\
    \ is declared.\"\n```\n\n输出：\n\n| The value of Lingaraj is great\n|This is the\
    \ shell script where Lingaraj=great is declared.\nNow calling the second script.\n\
    | The value of Lingaraj is great\n|This is the shell script where Lingaraj=great\
    \ is declared. |（等等，让我们根据文本重新格式化输出）\n\n当我们运行它们时，我们得到：\n\n| The value of Lingaraj\
