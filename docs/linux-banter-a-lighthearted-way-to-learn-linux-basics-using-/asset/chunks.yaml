- fmt: "\nSeema tried it on her laptop and explored various options. Lingaraj then\
    \ proceeded to open his bag and distributed some bananas to the monkeys.\n\n#\
    \ The C Compiler\n\nWhen they were back at Lingaraj’s house, Seema proceeded to\
    \ ask about Lingaraj’s parents.\n\n“My father is in a biotechnology conference\
    \ in Sweden. And my mother, on a trip to Ladakh and the Himalayas.”\n\n“What made\
    \ you choose to learn Linux? For me, it’s a necessity.”\n\n“I like Linux because\
    \ it made even a simple programmer like me see what the established programmers\
    \ of great stature were seeing. Everything is shared here and it is one of the\
    \ examples of a coming together of humanity, albeit in a part, to bring something\
    \ of benefit to the world without really looking for a profit.\n\nNow, let’s talk\
    \ about the compiler.\n\nThe compiler takes what you write in human readable form\
    \ and turns it into machine readable form.”\n\nLingaraj showed her a part of a\
    \ C program on his laptop.\n\n```c\npthread_t t1, t2; pthread_mutex_t mutex1;\
    \ pthread_mutex_init(&mutex1, NULL); int iret1 = pthread_create(&t1, NULL, (void\
    \ *) print_func, (void *) message); int iret2 = pthread_create(&t2, NULL, (void\
