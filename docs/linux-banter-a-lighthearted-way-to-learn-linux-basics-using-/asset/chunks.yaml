    | + |


    | < |


    For example the ‘init’ program starts a ‘getty’ program. Once the user logs in,
    the ‘getty’ passes control to the login program. This can allow log in and set
    up the environment according to the user and starts the shell. On exit, another
    ‘getty’ process is started by ‘init’.


    There are some bees who are more important than the others. The Queen’s schedule
    contains more time for implementing important jobs like adding chemicals to get
    more yield of honey and less time for collective fitness. Similarly processes
    are given different time slices in the processor. A particular process can’t take
    more time than allocated.


    How do we start a new process? We use the system C library function.


    | #include <stdlib.h>int system(const char *string); |


    The string is the command of the new process to be started. A system calls a shell,
    which in turn executes the command. So, if it’s a shell which is executing, the
    command ought to be what you can type on the command prompt. The ‘system’ C library
    function starts a new process whenever you specify a command. '
