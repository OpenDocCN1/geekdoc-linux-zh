    n\", lc);\n    ret_val = select(FD_SETSIZE, &testfds, NULL, NULL, NULL);\n}\n\
    ```\n\nStart select and it begins to monitor to see if there is any activity.\
    \ It does not tell you where exactly the activity happened when it returns, but\
    \ there is a way to know. Here, since only `testfds` is being monitored for reading,\
    \ there is no need of any other file descriptor set to be passed to `select` for\
    \ writing or checking for exceptions. No timeout value either and so, the call\
    \ will return only when some kind of activity happens. Here, we have used `testfds`\
    \ as an extension of `read_fd_set` because we want to fill up values in `read_fd_set`,\
    \ but initialise `testfds` in the beginning of every iteration. We want to keep\
    \ the data in `read_fd_set` intact so to speak. This enables `testfds` to be altered\
    \ without losing our previously set file descriptors.\n\n```c\nprintf(\"Return\
    \ from select value is : %d\\n\", ret_val);\nif(ret_val < 1) {\n    perror(\"\
    server_select\");\n    exit(1);\n}\n```\n\nIn case, `select` fails, this will\
    \ print the relevant message.\n\n```c\nelse {\n    int new_lc = lc+3;\n```\n\n\
    To talk about the above line, we are banking on some knowledge about the system.\
    \ We know that 0, 1 and 2 stand for standard input, standard output and standard\
    \ error respectively. If any more file descriptors are created, it will be assigned\
