- fmt: "\n### Bind\n\n```c\n#include <sys/socket.h>\nint bind(int socket, const struct\
    \ sockaddr *address, size_t address_len);\n```\n\nThe `socket` is the socket number.\
    \ The `sockaddr` structure which contains the port number, the family and the\
    \ IP address of the server and the socket file descriptor is made a into package\
    \ by binding it to the socket number, so a reference to the socket file descriptor\
    \ would mean we are talking about that particular port and network address.\n\n\
    The difference between a port and socket is this. A port is part of the socket.\n\
    \nAddress is the structure which contains:\n\n```c\nstruct sockaddr_in {\n   \
    \ short int sin_family;\n    unsigned short int sin_port;\n    struct in_addr\
    \ sin_addr;\n};\n```\n\n`sin_family` can be `AF_INET` though there are other possibilities.\
    \ \n`sin_port` is the port number and `sin_addr` is the IP address.\n\nIf a client\
    \ has to connect across a network via sockets, it will need the IP address of\
    \ the server computer. The IP address is something like this `255.255.255.255`\
    \ where `255` is the maximum. This is a way of identifying the device.\n\n`sin_addr`,\
    \ which is the IP address structure is:\n\n```c\nstruct in_addr {\n    unsigned\
    \ long int s_addr;\n};\n```\n\nIt returns `0` on success, `-1` on error.\n\n**Types\
    \ of errors:**\n\n| Error | Description |\n| :--- | :--- |\n| `EBADF` | Invalid\
    \ file descriptor |\n| `ENOTSOCK` | Doesn’t refer to a socket. |\n| `EINVAL` |\
    \ There is already a socket, by the same identifier which is named. |\n| `EADDRNOTAVAIL`\
    \ | The address is not available |\n| `EADDRINUSE` | The address has a socket\
    \ bound to it. |\n\n### Listen\n\n```c\n#include <sys/socket.h>\nint listen(int\
    \ socket, int backlog);\n```\n\nThis enables the socket to listen for incoming\
    \ connections and allocates a connection queue. `backlog` is the maximum number\
    \ of pending connections.\n\nOnce the server is ready to listen after the above\
    \ call, the client side can raise requests.\n\nThe server can accept with this\
    \ system call:\n\n```c\n#include <sys/socket.h>\nint accept(int socket, struct\
    \ sockaddr *address, size_t *address_len);\n```\n\nThe `accept()` system call\
    \ creates a new socket to communicate with this particular client and return it’s\
    \ file descriptor. This is helpful if the server has to service many clients.\
    \ This is an important point to remember. For every client that has connected\
    \ to a server socket, there is another number assigned after `accept`. The address\
    \ of the client is placed in the `sockaddr` structure.\n\nIf there are no clients,\
    \ the `accept` call will block. But you can change this using:\n\n```c\nint flags\
    \ = fcntl(socket, F_GETFL, 0);\nfcntl(socket, F_SETFL, O_NONBLOCK | flags);\n\
    ```\n\nUse the `O_NONBLOCK` setting with the `flags`.\n\n### Connect\n\nOn the\
    \ client’s side, all we need is to connect, send or receive and close.\n\n```c\n\
    #include <sys/socket.h>\nint connect(int socket, const struct sockaddr *address,\
    \ size_t address_len);\n```\n\nThe `socket` is the client’s socket and not the\
    \ server’s socket. The server’s specification is given in the structure `sockaddr`\
    \ which has the IP address, the port number, etc.\n\n`0` on success and `-1` on\
    \ error. The errors can be:\n\n| Error | Description |\n| :--- | :--- |\n| `EBADF`\
    \ | Invalid file descriptors |\n| `EALREADY` | Connection already in progress\
    \ for the socket |\n| `ETIMEDOUT` | Connection timeout |\n| `ECONNREFUSED` | Connection\
    \ was refused by the server. |\n\nYou can use `write` and `read` system calls\
    \ to the socket like you do with file descriptors. You will see this when we get\
    \ to programming.\n\n```c\nint close(int socket)\n```\n\nCloses the socket. This\
    \ can be used both at the server end as well as the client’s end.\n\n### Localhost\n\
    \nIn the previous examples of Interprocess Communication, we had keys. A distinct\
    \ key that brought processes together to cooperate using either queues or shared\
    \ memory. In sockets, we need the IP address and the port number.\n\nLet’s talk\
    \ about the localhost. I have always wondered what it would be like to call myself\
    \ over my phone. I haven’t attempted it yet. “Why?” “What if I answer the phone\
    \ and say ‘Hello’. I have a fear of parallel universes.\n\nA localhost program\
    \ allows you to talk to the same system using a network. The IP address used is\
    \ `127.0.0.1`.\n\nLet’s start understanding the programs with some pseudocode.\n\
    \n#### For client1.c\n1. Include the header files, especially `<sys/socket.h>`,\
    \ `<netinet/in.h>` and `<arpa/inet.h>`.\n2. Start the `main()` function.\n3. Declare\
    \ an integer type `socket` file descriptor for the server.\n4. Declare a variable\
    \ and assign it a number.\n5. Declare a structure of the type `sockaddr_in`.\n\
    6. Create the socket using `socket(AF_INET, SOCK_STREAM, 0)` and use the return\
    \ value for the socket file stream.\n7. Fill the details of the structure, also\
    \ using the functions `inet_addr()` for the localhost and `htons()` for a port\
    \ number wherever necessary.\n8. Now connect the socket using the obtained socket\
    \ file descriptor from the `socket()` function.\n9. Check to see if there are\
    \ any errors and print the relevant error message, if any.\n10. Now, write to\
    \ the socket, which will go to the server running, using the socket file descriptor\
    \ returned by the `socket()` call. You write the number that you have declared.\n\
    11. Read from the socket. Here, the server has done an operation on the number.\
    \ Read the number now.\n12. Print the message which says this was the number received\
    \ from the server.\n13. Close the socket file descriptor.\n\n#### For server1.c\n\
    1. Include the header files.\n2. Declare two integer types for the client socket\
    \ `fd` and the server socket `fd`. Two because, on `accept`, a new socket address\
    \ has to be assigned.\n3. Declare two structures of type `sockaddr_in` for both\
    \ the server and the client addresses.\n4. Call the `socket` function as done\
    \ in the client and assign the returning file descriptor.\n5. Fill the members\
    \ of the structure for the server address using the necessary functions and keeping\
    \ the port number consistent.\n6. Now, bind the socket using `bind` using the\
    \ server socket descriptor.\n7. Declare an integer variable, because a variable\
    \ will be received from the client.\n8. Start listening using the `listen()` function\
    \ using the server socket file descriptor.\n9. In a while loop:\n    - Print the\
    \ message about the server status.\n    - Call the `accept` function and assign\
    \ the new file descriptor to the client socket `fd`. To accept, you need the server\
    \ socket `fd`, the client address and client length.\n    - Read the number from\
    \ the socket using the returned client socket `fd` from the call to the `accept()`\
    \ function just done.\n    - Increment the number.\n    - Write the changed number\
    \ to the socket from which you read.\n    - Close the client socket `fd`.\n\n\
    The above program can be bettered by using `fork`, where a new child process is\
    \ created to handle the client’s request. All it needs is a small change in the\
    \ server program inside the while loop, after the `accept`.\n\n### Select System\
    \ Call\n\n```c\n#include <sys/types.h>\n#include <sys/time.h>\nstruct timeval\
    \ {\n    time_t tv_sec;\n    long tv_usec;\n};\n#include <sys/types.h>\n#include\
    \ <sys/time.h>\nint select(int nfds, fd_set *readfds, fd_set *writefds, fd_set\
    \ *errorfds, struct timeval *timeout);\n```\n\nThe `select` system call basically\
    \ is a monitoring system. `select` monitors a set of file descriptors if they\
    \ are ready for reading, writing or whether they have an error condition.\n\n\
    **The parameters are:**\n- `nfds`: The maximum number of file descriptors it can\
    \ monitor. It is usually the highest file descriptor number plus one.\n- `fd_set`:\
    \ tells the system that it is a file descriptor set and this has to be declared.\n\
    - `readfds`: refers to the file descriptor set that we want to test are read ready,\
    \ that is whether they can accept any inputs.\n"
