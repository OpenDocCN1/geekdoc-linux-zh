    pid is the process id of the child process.


    Now, options :


    Same as that for wait() but one particular option, WNOHANG does not suspend the
    execution of the caller.


    This system call returns zero, if the child process is still running. One error,
    it will return -1.


    Errors in this system call happen if :


    | There are no child processes |


    | The call is interrupted by a signal |


