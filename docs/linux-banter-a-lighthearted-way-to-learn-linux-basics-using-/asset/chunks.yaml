  raw: 'Two. If the client_select_1 process decided to send another message after
    the ‘Because Seema learn Linux’ waiting for another 10 seconds after the first
    message, it wouldn’t be read by the server. Because we have removed the fd from
    the read_fd_set. Until the client closes the connection, we would ideally want
    it to be on the read_fd_set. There are ways to get around this limitation. One
    way is to find out the return value of the read call on the socket. If the return
    value is zero on activation, it means the client has closed the connection. We
    then proceed to close the client socket file descriptor on the server’s side.
    Since we are closing only the sockets that have finished on the client’s side
    and not clearing those that haven’t finished on the client’s side, we will have
    the socket file descriptors of the open clients in the set of file descriptors
    to be checked for reading activity in the next iteration. The ones closed are
    not activated again.


