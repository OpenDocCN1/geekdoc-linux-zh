  trans: "\n如果你希望新文件名符合某种模式或模板，请使用上述 C 库函数。模板可以是任何想要的内容，其后跟六个 `X` 字符。这六个 `X` 字符会被替换，以产生唯一的文件名。\n\
    \n`mktemp` 和 `mkstemp` 的区别在于 `mktemp` 仅提供文件名。`mkstemp` 在打开文件后返回一个文件描述符。然而，建议仅使用\
    \ `tmpfile()` 和 `mkstemp()`。\n\n### 用户 ID 和组\n\nLingaraj 提出了一个新话题。\n\n“用户信息。提供\
    \ `uid`（即用户 ID）的系统调用是：\n\n```c\n#include <sys/types.h>\n#include <unistd.h>\n\
    uid_t getuid(void);\nchar *getlogin(void);\n```\n\n`getuid()` 系统调用返回程序关联的用户 ID。这通常是运行程序的用户的\
    \ `UID`。\n\n`getlogin()` C 库函数返回当前用户的登录名。\n\n```c\n#include <sys/types.h>\n#include\
    \ <pwd.h>\nstruct passwd *getpwuid(uid_t uid);\nstruct passwd *getpwnam(const\
    \ char *name);\n```\n\n你可以获取关于已知 ID 或名称用户的大量详细信息。上述 C 库函数返回一个类型为 `passwd` 的结构。访问其内容即可获取细节。我想你读过\
    \ C，所以知道如何访问结构。”\n\n“是的。”\n\n“`passwd` 结构的成员有：\n\n| 成员 | 描述 |\n| :--- | :--- |\n\
    | `char *pw_name` | 用户的登录名 |\n| `uid_t pw_uid` | UID 号 |\n| `gid_t pw_gid` | GID\
    \ 号 |\n| `char *pw_dir` | 用户的家目录 |\n| `char *pw_gecos` | 用户的全名 |\n| `char *pw_shell`\
    \ | 用户的默认 shell |\n\n你可以获取连续的条目：\n\n```c\n#include <pwd.h>\n#include <sys/types.h>\n\
    void endpwent(void);\nstruct passwd *getpwent(void);\nvoid setpwent(void);\n```\n\
    \n`getpwent` 返回一个包含单个用户条目的结构。当你第一次调用它时，它返回第一个条目。第二次调用时，它返回第二个条目。因此不需要设置一个变量并每次增加值。\n\
    \n`endpwent` 停止这个 C 库函数。`setpwent` 将位置设置为起始处。\n\n```c\n#include <sys/types.h>\n\
    #include <unistd.h>\nuid_t geteuid(void);\ngid_t getgid(void);\ngid_t getegid(void);\n\
    int setuid(uid_t uid);\nint setgid(gid_t gid);\n```\n\n你可以使用 `getgid` 获取用户/程序的组\
    \ ID。`setuid` 只能由超级用户或 root 使用，但建议谨慎使用，因为一旦你将进程的用户 ID 更改为权限较低的值，就无法恢复了。这就像国王乔装巡视他的王国，当他回来时，卫兵不让他进入。因此，通常使用\
    \ `seteuid` 来设置有效用户 ID。\n\n“我给你们看一个简单的程序，”他说并展示了一个程序。\n\n**passwdent.c**\n\n```c\n\
    #include <sys/types.h>\n#include <pwd.h>\n#include <stdio.h>\n#include <unistd.h>\n\
    #include <stdlib.h>\nint main(){\n    uid_t userid;\n    gid_t groupid;\n    struct\
    \ passwd *password;\n    userid = getuid();\n    groupid = getgid();\n    printf(“User\
    \ is %s\\n”, getlogin());\n    printf(“User IDs: User id is %d, Group id is %d\\\
    n”, userid, groupid);\n    password = getpwuid(uid);\n    printf(“User ID passwd\
    \ entry shows the following data :\\n Name is %s, User id is%d, Group id is %d,\
    \ Home Directory is %s, The shell is %s\\n”,password->pw_name, password->pw_uid,\
    \ password->pw_gid, password->pw_dir, password->pw_shell);\n    exit(0);\n}\n\
    ```\n\n“懂了吗？这只是对密码结构的一个简单读取。”\n\nSeema 看了几分钟才说懂了。\n\n```c\n#include <sys/utsname.h>\n\
    int uname(struct utsname *name);\n```\n\n`uname` 系统调用将主机信息写入由类型为 `utsname` 的 `name`\
    \ 结构指向的内容。当我说类型结构时，仅仅是指包含与相关头文件中定义的相同字段的结构。`utsname` 结构定义在 `sys/utsname.h` 中。它必须包含这些成员：\n\
    \n| 成员 | 描述 |\n| :--- | :--- |\n| `char sysname[]` | 操作系统名称 |\n| `char nodename[]`\
    \ | 主机名 |\n| `char release[]` | 系统的发布级别 |\n| `char version[]` | 系统版本号 |\n| `char\
    \ machine[]` | 硬件类型 |\n\n```c\n#include <unistd.h>\nint gethostname(char *name,\
    \ size_t namelen);\n```\n\n此系统调用将主机名写入字符串 `name` 中。`namelen` 是假设的最小长度。\n\n“这为什么重要？我们通常知道主机名。”\n\
    \nLingaraj 想起了某件事，决定告诉 Seema。Seema 准备好听他的另一个故事了。\n"
