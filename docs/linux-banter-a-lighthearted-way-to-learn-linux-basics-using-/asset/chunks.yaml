    ```


    显示了输出。


    ```

    | 3+4 |

    ```


    “它没有相加。”Seema 说。


    “所以，我们了解到变量被存储为字符串而不是数值。


    等等号两边不能有空格。如果你想包含像‘Sonal Vijay’这样的空格，就要用引号括起来。”


    Lingaraj 忽略了他关于将‘Sonal Vijay’连在一起的错误，Seema 以为他会纠正。她输入了。


    ```

    $ constant=“Seema Vijay”echo $constant

    ```


    显示了输出。


    ```

    | Seema Vijay |

    ```


