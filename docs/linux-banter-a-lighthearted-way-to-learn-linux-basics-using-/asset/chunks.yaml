  trans: "\n\n`sem_open()` 创建一个新的 POSIX 信号量或打开一个现有信号量。信号量通过名称标识。它返回信号量的地址。\n\n```c\n\
    #include <semaphore.h>\nint sem_destroy(sem_t * sem);\n```\n\n正如函数名所示，这会销毁信号量。它还会清理资源。\n\
    \n回到灯开关并行的例子。一个挑剔的电影明星等待时，如果他在外面而医生在里面，他会一直要求导演检查灯的状态。这种行为是不被鼓励的，演员会被踢出剧组，无论他是不是电影明星。当灯熄灭时，团队会知道。因为程序始终在关注这一点。就像那些总是在寻找折扣或免费优惠券的人一样。\n\
    \n所以，为了编程，你可以使用 `pthread` 启动一个线程。它将一直运行。你创建一个信号量，并告诉内核当信号量值为 0 时会发生什么。这会启动一个例程。你可以告诉当信号量有值时会发生什么。但你不需要告诉程序一直寻找该变量并检查它是否变为\
    \ 0 或变为正数。这是系统的工作。让我们修改程序并将其命名为 `thread_sem_program.c`，这次使用信号量。确保包含 `semaphore.h`。\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
    \ <pthread.h>\n#include <unistd.h>\n#include <semaphore.h>\nsem_t semap1;\nvoid\
    \ *print_func(char* message){\n    sem_wait(&semap1);\n    printf(\"%s - Before\
    \ sleep\\n\", message);\n    sleep(4);\n    printf(\"%s - After waking up\\n\"\
    , message);\n    sem_post(&semap1);\n}\nint main(){\n  sem_init(&semap1,0,1);\n\
    \  pthread_t t1, t2;\n  printf(\"I am in main\\n\");\n  int iret1 = pthread_create(&t1,\
    \ NULL,(void *) print_func, (void *) \"First Instance\");\n  int iret2 = pthread_create(&t2,\
    \ NULL, (void *) print_func, (void *) \"Second Instance\");\n  pthread_join(t1,\
    \ NULL);\n  pthread_join(t2, NULL);\n  sem_destroy(&semap1);\n  printf(\"Back\
    \ to main after thread join\\n\");\n}\n```\n\n我会这样运行它：\n\n```bash\ncc -D_REENTRANT\
    \ thread_sem_program.c -lpthread -lrt\n```\n\n输出再次是\n\n```\nMain program now running\n\
    First Instance - Before sleep\nFirst Instance - After waking up\nSecond Instance\
    \ - Before sleep\nSecond Instance - After waking up\nBack to main after thread\
    \ join\n```\n\n“Vijay 现在怎么样？”\n“他忘记了一些关于我们相处时光的事了。”\n“你说的那个键盘，他把它交给了任何人来让自己被编程吗？”\n\
    “你让我很焦虑。”\n“那你最好学快点。”\n“谢谢理解。我需要休息几天。我需要见见 Vijay。”\n“好的。”\n\nSeema 叫了同一个出租车司机前往班加罗尔。几天后她回来了，走进了\
    \ Lingaraj 的家。\n\n“你的旅程怎么样？”Lingaraj 问。\n“见到他很好，他变得更好了。但我觉得他变得很神。。你做了什么？”她问 Lingaraj。\n\
    “我站在悬崖边拍自拍时，一阵强风吹……”\n“他几乎没有注意到我在那里。他一直在计算足球动作并预先告诉结果。”Seema 打断道。\n“太棒了！”\n\n\
    Seema 盯着 Lingaraj。Lingaraj 移开目光继续说。\n\n### 线程属性\n\n你举办了一个派对，并安排了厨师和调酒师。有些朋友可能带着司机来，有些坐出租车来，有些是跑来的。有这样的人。派对结束后，你的朋友回家了。你想知道一个朋友是否到了家。所以，你给她打电话确认她是否安全到家。现在，那个来的厨师，你不会打电话去确认他是否安全到家。更何况，如果准备的食物不好，而你发现他在未经许可的情况下也喝了一些酒。\n\
    \n所以，如果你把这两个回家的过程想象成线程，一个是连接线程（attached thread），另一个是分离线程（detached thread）。因此，你可以为线程指定属性，告诉它以特定的方式行为。列表如下：\n\
    \n```c\n#include <pthread.h>\nint pthread_attr_setdetachstate(pthread_attr_t *attr,\
    \ int detachstate);\nint pthread_attr_getdetachstate(const pthread_attr_t *attr,\
    \ int *detachstate);\nint pthread_attr_setschedpolicy(pthread_attr_t *attr, int\
    \ policy);\nint pthread_attr_getschedpolicy(const pthread_attr_t *attr, int *policy);\n\
    int pthread_attr_setschedparam(pthread_attr_t *attr, const struct sched_param*param);\n\
    int pthread_attr_getschedparam(const pthread_attr_t *attr, struct sched_param*param);\n\
    int pthread_attr_setinheritsched(pthread_attr_t *attr, int inherit);\nint pthread_attr_getinheritsched(const\
    \ pthread_attr_t *attr, int *inherit);\nint pthread_attr_setscope(pthread_attr_t\
    \ *attr, int scope);\nint pthread_attr_getscope(const pthread_attr_t *attr, int\
    \ *scope);\nint pthread_attr_setstacksize(pthread_attr_t *attr, int scope);\n\
    int pthread_attr_getstacksize(const pthread_attr_t *attr, int *scope);\n```\n\n\
    这是一个很长的列表，看起来很令人生畏。在你开始使用其中任何一个之前，你需要初始化一个线程属性对象。\n\n```c\n#include <pthread.h>\n\
    int pthread_attr_init(pthread_attr_t *attr);\n#include <pthread.h>\nint pthread_attr_destroy(pthread_attr_t\
    \ *attr);\n```\n\n第一个函数将初始化线程属性对象，第二个将销毁线程属性对象。\n\n“你才刚创建线程，很快就开始谈论销毁它了。”\n“可能很复杂。每当我进入视频游戏，尤其是射击游戏时，我的头像会被立即销毁。我太蠢了，用了我的真实名字进入这些游戏。”\n\
    \n```c\nint pthread_attr_setdetachstate(pthread_attr_t *attr, int detachstate);\n\
    ```\n\n它有两个参数，属性对象指针和 `detachstate` 标志。在标志位中你可以指定：\n- `PTHREAD_CREATE_JOINABLE`：这是默认值，你必须连接线程。\n\
    - `PTHREAD_CREATE_DETACHED`：这意味着你不在乎。你无法调用线程连接。所以你永远不知道厨师是否到了家。”\n\n```c\nint\
    \ pthread_attr_getdetachstate(const pthread_attr_t *attr, int *detachstate);\n\
    ```\n\n这告诉你线程的当前状态。注意 `int detachstate` 是你指定的。在这里，你指定一个指针，将返回当前状态的值。\n\n```c\n\
    int pthread_attr_setschedpolicy(pthread_attr_t *attr, int policy);\nint pthread_attr_getschedpolicy(const\
    \ pthread_attr_t *attr, int *policy);\n```\n\n在派对上，总会有想要麦克风的人。但你可以通过调度指定谁获得中心舞台。先来的人先获得麦克风，或者通过轮询。调度是内核调度器的特权，但你可以介入并获得更多控制。你可以指定哪些线程具有更高的优先级。线程是否可以被另一个线程抢占。”\n\
