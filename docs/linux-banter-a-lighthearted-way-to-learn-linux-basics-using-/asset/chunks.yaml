    through foliage and over cliffs without meeting a single person.


    ![](image_rsrc858.jpg)


    They finally reached a small settlement where a few people were making threads.


    “I brought you here to set up the context. Today, we will talk about threads.”


    “Are you out of your mind? I am really worried and trying to get back to Vijay
    at the earliest and you are behaving like ceremony Seena.” said Seema with anger
    in her voice. After a while, Seema apologised. Lingaraj didn’t seem like he was
    hurt. He spoke.


    “A thread is an execution slice.”


    “I don’t understand.”


    “I opened a hotel once. I used to get orders from Mysore and sometimes Hubli.
    So I used to set up a small operation there whenever the order came. I used to
    go there and cook. But the orders kept pouring in. So I started a franchise model
    and gave them to people in various districts of Karnataka. They used to inherit
    my model of work. Until one fateful day.”


    This was the thing about Lingaraj Seema had noticed. He had to tell his life experiences
    whether he was the hero of it or not. Most of the times, he was not. Lingaraj
    continued with his story.


    “I had given a franchise in Hubli. I had to meet this woman for a marriage alliance.
    That day, I received a complaint from a person that the food in my particular
    franchise in Hubli was not up to standards. I went to the franchise with my fiance
    the next day itself. I wanted to show off my fiat. I told the guy who had purchased
    the franchisee from me that a person had complained the food was bad and that
    I wanted to inspect. I asked them to bring the food. They brought me the food.
    I asked my fiance Nagashree to eat the food. We both ate, after we had eaten,
    I told the hotel manager, “The food is good, but there’s some smell.”


    So the manager replied, ‘Sir you had a problem with yesterday’s food. So we got
    you yesterday’s food.’” finished Lingaraj.


    “Phew! Man you have so much of history.”'
