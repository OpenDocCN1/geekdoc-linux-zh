  trans: "\n\n当程序结束或文件描述符关闭时，所有的锁都会清除。\n\n在文件加锁过程中，不要使用 `fread` 或 `fwrite`。请使用 `read`\
    \ 和 `write`。这是因为 `fread` 或 `fwrite` 会进行缓冲，即缓冲区中放置更多待读取或待写入的字节。”\n\n还有这样一个 C 库函数：\n\
    \n```c\n#include <unistd.h>\nint lockf(int fildes, int function, off_t size_to_lock);\n\
    ```\n\n`function` 的选项有：\n\n- `F_ULOCK`\n- `F_LOCK`\n- `F_TLOCK`\n- `F_TEST`\n\n\
    这些锁在本质上是建议性的（advisory），这意味着程序必须礼貌地检查锁并尊重锁。\n\n我将向你展示两个程序：一个是锁定数据文件的某个区域（某字节到某字节之间），另一个是继续使用\
    \ `fcntl` 查询该区域是否存在锁，以及是否可以获取新锁。首先，我们将测试独斥访问。`lock_reg_ex.c`\n\n```c\n#include\
    \ <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n#include <fcntl.h>\nconst\
    \ char *file_with_regions = \"/tmp/test_lock\";\nint main() {\n    int fd;\n \
    \   int count;\n    char *fill_string = \"Seema\";\n    struct flock region;\n\
    \    // 我们进行了重要的声明，并决定测试文件将填充“Seema”。\n    // 我们声明了一个类型为 flock 的结构体 region，它将包含有关加锁、解锁或测试的详细信息。\n\
    \    int res;\n    fd = open(file_with_regions, O_RDWR | O_CREAT, 0666);\n   \
    \ if (!fd) {\n        fprintf(stderr, \"Unable to open %s.\\n\", file_with_regions);\n\
    \        exit(EXIT_FAILURE);\n    }\n    // 根据之前说明的原因，我们明智地使用 `open` 而不是 `fopen`\
    \ 打开它。\n    for(count = 0; count < 100; count++) {\n        (void)write(fd, fill_string,\
    \ 1);\n    }\n    // 我们只用单词“Seema”填充它。\n    region.l_type = F_WRLCK;\n    region.l_whence\
    \ = SEEK_SET;\n    region.l_start = 40;\n    region.l_len = 10;\n    // 我们使用 `F_WRLCK`，它是写锁或独斥锁。\n\
    \    printf(\"Process %d locking file\\n\", getpid());\n    res = fcntl(fd, F_SETLK,\
    \ &region);\n    // 我们对使用文件描述符 `fd` 的打开的文件调用 `fcntl`，使用 `SETLK` 创建锁并指定 `region`\
    \ 结构体。\n    if (res == -1) fprintf(stderr, \"Failed to lock region.\\n\");\n \
    \   sleep(20);\n    printf(\"Process %d closing file\\n\", getpid());\n    close(fd);\n\
    \    exit(EXIT_SUCCESS);\n}\n```\n\n我们显然可以通过编写一个访问相同文件的程序来测试它，并继续使用 `fcntl` 查询是否存在锁，以及是否可以获取新锁。\n\
    \n`lock_reg_ex_test.c`\n\n```c\n#include <unistd.h>\n#include <stdlib.h>\n#include\
    \ <stdio.h>\n#include <fcntl.h>\nconst char *file_with_regions = \"/tmp/test_lock\"\
    ;\n#define SIZE_INCREMENT 5\nint main() {\n    int fd;\n    int res;\n    struct\
    \ flock region_of_interest;\n    int start_byte;\n    fd = open(file_with_regions,\
    \ O_RDWR | O_CREAT, 0666);\n    if (!fd) {\n        fprintf(stderr, \"Unable to\
    \ open %s for read/write\", file_with_regions);\n        exit(EXIT_FAILURE);\n\
    \    }\n    for (start_byte = 0; start_byte < 99; start_byte += SIZE_INCREMENT)\
    \ {\n        region_of_interest.l_type = F_WRLCK;\n        region_of_interest.l_whence\
    \ = SEEK_SET;\n        region_of_interest.l_start = start_byte;\n        region_of_interest.l_len\
    \ = SIZE_INCREMENT;\n        region_of_interest.l_pid = -1;\n        // 在测试之前，我们填充结构体。我们每次递增\
    \ 5 字节的值。\n        printf(\"Testing for exclusive lock on region from %d to %d\\\
    n\", start_byte, start_byte + SIZE_INCREMENT);\n        res = fcntl(fd, F_GETLK,\
    \ &region_of_interest);\n        if (res == -1) {\n            fprintf(stderr,\
    \ \"F_GETLK failed!\");\n            exit(EXIT_FAILURE);\n        }\n        if\
    \ (region_of_interest.l_pid != -1) {\n            printf(\"No opportunity to lock\
