    \ painted it well?’””\n"
  raw: '| Seemaloves YogaVijay$ loves football |


    A part of the output is printed after 4 because the parent process finishes before
    the child.


    You might wonder no real communication is happening. No messages were exchanged.
    But if you notice, coordination is happening with respect to time. And that is
    good enough for it to be called Interprocess Communication.


    IPC : Shared Memory


    Lingaraj said,


    “Think of the example I gave where we would be putting a cocktail recipe in a
    particular location near the rocks. The knock out rocks. You can even allow other
    processes to access the memory location. I also told you it was useful because
    whenever we put it on those stones and come back to collect it, there would be
    more recipes added by people who would have experimented the previous night.


    ![](image_rsrc84T.jpg)


    The recipe paper can be thought of as the memory. And information is shared between
    the drunkards and we through this sheet. This is faster than creating pipes or
    fifos. Here care should be taken to see to it that no two processes are writing
    at the same time.


    The system calls are


    | #include <sys/shm.h>int shmget(key_t key, size_t size, int shmflg); |


    The key_t key is the name of the memory segment. You can use a #define to define
    a key, but this key has to be known by both the processes to facilitate Inter
    Process Communication.


    The value IPC_PRIVATE makes the shared memory private to the process. When I was
    down in life, I wanted to share my stories. But I could find no one. So, it used
    to be an IPC_PRIVATE situation.


    “That’s sad.”


    “It was, until I started visiting the knock out rocks.”


    “No, it’s not a joke. You have told me so many stories about yourself. They are
    sad stories, but you make them sound funny. I laughed, I was amused, I was taken
    aback and I was surprised at some of your stories. I am not a psychoanalyst but
    I am human and I want to tell you that I admire the guy who is brave enough to
    laugh at himself. I am missing Vijay in this situation, but in you I have found
    an ally, a friend and a teacher. I have enormous respect for you. According to
    family tradition, when we get married, there’s this ceremony where the bride’s
    brother welcomes the guests with a sweet dish. That is a privilege given to the
    most honourable member of the family and I can’t think of anybody else but you
    doing it. I know I haven’t run it across with you, but I have decided that it
    will be you.”


    Lingaraj looked into the distance. He was feeling emotional for the first time
    as far as Seema was concerned. Then he said,


    “I would be over the ‘jamoon’ doing it.”


    “And there will be a lot of people who you can connect with. It will be my responsibility
    to introduce you to a worthy woman and get you married.”


    “Then let’s waste no time, sister. Size is the size in bytes.”


    The ‘shmflag’ is something similar to mode in open. It is I_CREAT ‘OR’ed with
    permissions to create a new segment. And if the segment is already open, it does
    not say error, rather it is ignored unlike when you use semaphores.


    And the return value is the memory segment identifier. -1 on error.


    | void *shmat(int shm_id, const void *shm_addr, int shmflg); |


    This is for telling which processes have access to the shared memory. This is
    like attaching a shared memory segment to a process.


    shm_id is what you get from shmget(), the shared memory identifier.


    shm_addr is the address at which the shared memory is attached to the process.
    Leave it as a null pointer and the system will handle the assignment.


    But if you want to control the memory address, you can use it in conjunction with
    shmflg. But I would advise you against it. SHM_RND is used if you want to really
    control the address of the memory segment.


    One of the other values of shmflg is SHM_RDONLY which makes the memory segment
    read only.


    Some more values are :


    SHM_EXEC allows the code inside the shared memory segment to be executed.


    If shmat is successful, it returns a pointer to the first byte of the shared memory.


    | int shmdt(const void *shm_addr); |


    This deletes a shared memory segment. Not the contents though. It takes the address
    returned by shmat().


    | int shmctl(int shm_id, int command, struct shmid_ds *buf); |


    This is for control of the shared memory.


    shm_id is the return from shmget.


    The commands can be IPC_STAT to obtain status information for the shared memory
    segment.


    IPC_RMID means control. It removes the shared memory segment from the system,
    destroys it and also the shmid_ds data structure.


    The shmid_ds structure contains more details about the shared memory segment.


    Let’s look at this writer program,


    shm_writer_1254.c


    | #include <sys/shm.h>#include <stdio.h>#define key 0x1254int main(){    int shmid
    = shmget(key,BUFSIZ,0666 &#124; IPC_CREAT);    char *str = (char *) shmat(shmid,
    (void*)0, 0);    printf("Input some data\n");    fgets(str, BUFSIZ, stdin);   
    printf("Data written in memory is %s", str);    shmdt(str);} |


    Here, a key id defined. This has to be known by the calling program. We then create
    the shared memory using shmget. The BUFSIZ is usually around 8192, but it also
    depends on the system. Then attach the memory. Also, we assign a string pointer
    to the attached memory. So, the value of the string is written to the memory segment.


    Next we ask the user to input the string, which is then stored in the string pointer.
    The next program is also a writer, but the key is changed to 2995 from 1254.


    shm_writer_2995.c


    | #include <sys/shm.h>#include <stdio.h>#define key 0x2995int main(){    int shmid
    = shmget(key,BUFSIZ,0666 &#124; IPC_CREAT);    char *str = (char *) shmat(shmid,
    (void*)0, 0);    printf("Input some data\n");    fgets(str, BUFSIZ, stdin);   
    printf("Data written in memory is %s", str);    shmdt(str);} |


    Now, we look at the reader program for 1254\. The reason we are looking is, we
    will run these programs in sequence. You shouldn’t have any doubt that a program
    is writing to a particular memory segment which can only be accessed by another
    process that knows the key. And not that the memory segment is a default value
    for all programs which the next program easily reads from without bothering about
    key consistency.


    shm_reader_1254.c


    | #include <sys/shm.h>#include <stdio.h>#define key 0x1254int main(){    int shmid
    = shmget(key,1024,0666);    char *str = (char *) shmat(shmid, (void*)0, 0);   
    printf("Data read from memory is %s", str);    shmdt(str);    shmctl(shmid,IPC_RMID,NULL);    return
    0;} |


    In the reader, there is no need to create the memory segment, so no need of IPC_CREAT
    using shmget. Next, attach to the memory segment and read it into the string.


    Let’s look at another reader program. Only the key is changed.


    shm_reader_2995.c


    | #include <sys/shm.h>#include <stdio.h>#define key 0x2995int main(){    int shmid
    = shmget(key,BUFSIZ,0666);    char *str = (char *) shmat(shmid, (void*)0, 0);   
    printf("Data read from memory is %s", str);    shmdt(str);    shmctl(shmid,IPC_RMID,NULL);    return
    0;} |


    We then run this program.


    | $ gcc shm_writer_1254.c$ ./a.outInput some data |


    Data 1254


    | Data written in memory is Data 1254 |


    | $ gcc shm_writer_2995.c$ ./a.outInput some data |


    Data 2995


    | Data written in memory is Data 2995$ gcc shm_reader_1254.c$ ./a.outData read
    from memory is Data 1254$ gcc shm_reader_2995.c$ ./a.outData read from memory
    is Data 2995 |


    So, it is not that shared memory access means there is a particular place where
    the shared memory is stored and the contents of which can be accessed by any program
    subsequent to the writer program. It depends on the key.


    IPC : Message Queues


    Lingaraj, as usual began.


    “Message queues. What are they?”


    “Give me some time. Does it have to be a personal story where the joke’s on me?”


    “Anything.”


    “When Vijay and I visited a friend of mine, her daughter had painted a car. Vijay
    went on and started talking about cars. I then cut him midway through his rant
    and told him, ‘But don’t you think she’s painted it well?’'
