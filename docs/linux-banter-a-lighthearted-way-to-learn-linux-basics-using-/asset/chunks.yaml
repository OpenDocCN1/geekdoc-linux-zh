  trans: "\n\n# 信号与阻塞\n\n我们要讨论的是阻塞信号。我们在这里谈论的是这一点：当一个信号发生时，处理函数会被调用并运行直到完成。如果在此段时间内出现了另一个信号，这个健壮的系统调用\
    \ `sigaction` 可以阻塞这个新的信号。\n\n## 信号动作修饰符\n\n`int sa_flags`\n\n信号动作修饰符。它告诉程序是否返回位置以捕获新信号。当你将其设置为\
    \ `SA_RESETHAND` 时，`sigaction` 系统调用只会处理一次信号。\n\n在手册（man pages）中还有其他可用标志。\n\n`oact`\
    \ 是一个位置，将存储之前执行的信号动作。\n\n```c\n#include <signal.h>\nint sigaddset(sigset_t *set,\
    \ int signo);\nint sigemptyset(sigset_t *set);\nint sigfillset(sigset_t *set);\n\
    int sigdelset(sigset_t *set, int signo);\n```\n\n这些是 C 库函数。你可以让程序专门一次处理一个信号，或者制定一个广泛的策略来处理信号。因此，你可以创建一个所有这些信号的集合并指定要做什么。此外，可能会出现这样的情况：你的程序正在处理接收到的信号，而另一个信号又来了。这时，你可能需要挂起该函数并杀死进程。无需混乱。你可以使用信号集处理所有这些信号。\n\
    \n## 信号集\n\n信号集的类型为 `sigset_t`。\n\n因此，你可以通过 `sigfillset()` C 库函数向你的信号集填充所有可用信号。同样，你可以使用\
    \ `sigemptyset()` C 库函数清空所有信号的集合。\n\n你可以通过 `sigaddset()` 指定数字向集合中添加单个信号。\n\n你也可以通过\
    \ `sigdelset()` 指定数字从集合中删除单个信号。\n\n此外，你可以通过查询确定某个信号是否是集合的成员。\n\n```c\nint sigismember(\
    \ const sigset_t *set, int signum)\n```\n\n如果信号是集合的成员，则返回 1；否则返回 0；发生错误时返回 -1。\n\
    \n```c\n#include <signal.h>\nint sigprocmask(int how, const sigset_t *set, sigset_t\
    \ *os);\n```\n\n上述系统调用用于更改进程的信号掩码。如果信号被进程阻塞，它将不会被递送，而是保持挂起状态。程序可以通过调用 C 库函数 `sigpending`\
    \ 来确定哪些阻塞的信号处于挂起状态。\n\n```c\n#include <signal.h>\nint sigpending(sigset_t *set);\n\
    ```\n\n该系统调用向 `set` 指向的信号集写入一组被阻塞递送的信号。成功时返回 0，否则返回 -1 并设置 `errno` 指明错误。\n\n```c\n\
    #include <signal.h>\nint sigsuspend(const sigset_t *mask);\n```\n\n`sigsuspend`\
    \ 系统调用将进程信号掩码替换为 `mask` 给信号集，然后挂起执行。它将在信号处理函数执行后恢复。\n\n## sigaction 示例\n\n让我们来看一个使用\
    \ `sigaction` 的程序。\n\n`ayyo.c`\n\n```c\n#include <signal.h>\n#include <stdio.h>\n\
    #include <unistd.h>\n\nvoid ctrlc(int sig){\n    printf(\"我建议你不要停止我，%s\\n\", getlogin());\n\
    }\n\nvoid shutdown_req(int sig){\n    printf(\"我是进程 %d，我知道是谁在试图杀我。是你，%s\\n\",\
    \ getpid(), getlogin());\n}\n\n/* finish(int sig){\n    printf(\"这个函数是没用的，因为它正试图处理\
    \ SIGKILL 信号。\\n\");\n}*/我们声明了上述三个函数，每个对应一个特定的信号：SIGINT、SIGTERM 和 SIGKILL。处理 SIGINT\
    \ 的函数只运行一次，因为我们使用了 `SA_RESETHAND` 标志。我们打印了相关消息，这就是该函数做的全部工作。\n\nint main() {\n\
    \    struct sigaction act;\n    act.sa_handler = ctrlc;\n    sigemptyset(&act.sa_mask);\n\
    \    act.sa_flags = SA_RESETHAND;\n    sigaction(SIGINT, &act, 0);\n\n    act.sa_handler\
    \ = shutdown_req;\n    sigemptyset(&act.sa_mask);\n    act.sa_flags = 0;\n   \
    \ sigaction(SIGTERM, &act, 0);\n\n    /* 这不相关，因为 SIGKILL 会立即杀死进程，它无法被处理。\n   \
    \ act.sa_handler = finish;\n    sigemptyset(&act.sa_mask);\n    act.sa_flags =\
    \ 0;\n    sigaction(SIGKILL, &act, 0);\n\n    /* 然后指定了处理函数，信号集 sa_mask 被置为空。我们不希望任何信号被阻塞。因为你在这里放置的任何内容都不会被递送给进程。指定了是否需要\
    \ SA_RESETHAND。在第一情况下，指定了 SA_RESETHAND，这意味着信号只会被处理一次，因为信号没有重置。如果你想它每次都生效，你需要通过包含\
    \ SA_RESETHAND 来重置信号。*/\n    while(1) {\n        printf(\"我在我的世界里很快快乐!\\n\");\n\
    \        sleep(1);\n    }\n}/* 这是主程序部分，程序会在无限循环中不断打印，直到发送信号为止。 */\n```\n\n输出如下：\n\
    \n```\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n\
    我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n我在我的世界里很快快乐!\n^C 我建议你不要停止我，Lingaraj!\n\
