    “Now, ceremony Seena had to be passed these messages for the good of society.
    Since the protocol was too expensive, we had message runners. Something like these
    food delivery partners. These message runners would collect messages from the
    people and then finally give ceremony Seena the messages to print in the evening.
    This way, everybody was happy.


    So these high level calls are like these message runners, engaging ceremony Seena
    in an intelligent way without much overheads.


    There are C library functions that save system overheads. They are :


    | `fopen` |

    | `fclose` |

    | `fread` |

    | `fwrite` |

    | `fflush` |

    | `fseek` |

    | `fgetc` |

    | `getc` |

    | `getchar` |

    | `fputc` |

    | `putc` |

    | `putchar` |

    | `fgets` |

    | `gets` |

    | `printf`, `fprintf` and `sprintf` |

    | `scanf`, `fscanf` and `sscan` |

    | `#include <stdio.h>FILE *fopen(const char *filename, const char *mode);` |


    `fopen` opens the file named by the `filename` parameter and associates a stream
    with it. The `mode` parameter specifies how the file is to be opened. It’s one
    of the following strings:


    | “r” |

    | “w” |

    | “a” |

    | “r+” |

    | “w+” |

    | “a+” |


    It is opened as a stream and not a file.”


    “What’s the difference between a stream and a file descriptor?”


    “The difference is in how the system sees the file. The stream is high level access.
    If you want control operations to be performed on files, you need to use the file
    descriptor. A file descriptor can simply send or receive data, but opening a stream
    makes it possible for formatted input and output.


    It’s the difference between handling the situation delicately, with finesse. You
    talk with a particular manner, you show all kinds of etiquette. Opening a file
    descriptor is more about control.


    It’s the de-ferent between something technical and poetic.


    Moving on, if you are going through the files in Vijay’s head, and you come across
    a file that described Vijay’s memory of of date with a woman named Asha, what
    would you do.” asked Lingaraj.


    “I would ask him, who Asha is.”


    “And Vijay would answer without any sense of trepidation because he is a machine
    now. The more intelligent option would be to change the files. You can open them
    read only. Or update the file to change Asha’s name to yours. Or append, add details
    like Asha was not good for Vijay and she fought with him. Or completely remove
    all content.”


    “I will completely remove all content.”


    “Once again, the syntax to open the file is


    | `FILE *fopen(const char *filename, const char *mode);` |


    The C library function returns a pointer to the file stream in question.


    | `#include <stdio.h>size_t fread(void *ptr, size_t size, size_t nitems, FILE
    *stream);#include <stdio.h>size_t fwrite(const void *ptr, size_t size, size_t
    nitems, FILE *stream);` |


    In the just mentioned C library functions, the return from `fopen` which is a
    file stream, is used to read and write. `fread()` and `fwrite()` return the size
    of the written or read data.


    | `#include <stdio.h>int fclose(FILE *stream);` |


    `fclose` closes the file. The file is closed even if `fclose()` isn’t called.
    But it’s not completely redundant. `fclose()` returns an integer which can be
    used to check for errors in case of failure.


    | `#include <stdio.h>int fflush(FILE *stream);` |


    This causes data on a file stream to be written immediately. No need to use it
    if you are using `fclose()` because a call to `fclose()` will use a flush operation.


    | `#include <stdio.h>int fseek(FILE *stream, long int offset, int whence);` |


    `fseek` will take you to the particular place in the file.


    | `#include <stdio.h>int fgetc(FILE *stream);int getchar();` |


    `fgetc` reads the next byte as a character from a file stream.


    `getchar` reads the character from the standard input.


    | `#include <stdio.h>int fputc(int c, FILE *stream);` |


    `fputc` puts a character into a file stream.


    | `int putchar(int c);` |


    `putchar` puts a character to standard output.


    | `#include <stdio.h>char *fgets(char *s, int n, FILE *stream);char *gets(char
    *s);` |


    `fgets` writes characters to a string taking it from a file stream.


    And `gets`? What does it do?” asked Lingaraj out of the blue.


    “`gets` writes characters to a string taking it from standard input.” replied
    Seema diligently.


    “From what I have heard, it does a lot more and it is advisable not to use it.”
    warned Lingaraj.


    | `#include <stdio.h>int printf(const char *format, ...);int sprintf(char *s,
    const char *format, ...);int fprintf(FILE *stream, const char *format, ...);`
    |


    “This I hope you have covered in C.” asked Lingaraj.


    “Yes, I will explain.


    `printf` produces output on the standard output.


    `sprintf` writes to a string.


    `fprintf` to a specific stream.” said Seema.


    “Ok. This is the format to print as you know. This, you will use a lot, so let’s
    visit it here.


    | `%d , %i` |

    | `%o , %x` |

    | `%c` |

    | `%s` |

    | `%f` |

    | `#include <stdio.h>int scanf(const char *format, ...);int fscanf(FILE *stream,
    const char *format, ...);int sscanf(const char *s, const char *format, ...);`
    |


    `scanf` gets data from standard input.


    `fscanf` from a file stream


    and `sscanf` from a string.


    Print reminds me of this. I have a friend from the city called ‘Dead body Doddanna.’”
    said Lingaraj.


    “Makes me recoil in horror. What kind of a name is that?”


    “There is a reason. He was the official police photographer. He used to photograph
    dead bodies. There came time to get married and he liked this girl. He was madly
    in love with her. But she was the suspicious type. She once came visiting his
    house for the first time and she left soon. We went and found Doddanna dejected
    and he had told us she had walked out and had stopped answering his calls. We
    did not need to search for an answer. On his wall he had taken the prints of all
    the dead bodies he had taken snaps of and had them pasted under the heading ‘My
    works.’”


    “It would have been funny. Except for the dead bodies and his dejection.”


    “More file navigation C library functions.


    | `#include <stdio.h>int fseek(FILE *stream, long offset, int whence);long ftell(FILE
    *stream);void rewind(FILE *stream);int fgetpos(FILE *stream, fpos_t *pos);int
    fsetpos(FILE *stream, const fpos_t *pos);` |


    `fseek` sets the file position indicator for the stream and works similar to `lseek`.


    `ftell` obtains the current value of the file position indicator for the stream
    pointed to stream.


    `rewind` sets the file position indicator to the beginning of the file.


    `fgetpos` and `fsetpos` are equivalent to `ftell()` and `fseek()` with whence
    set to `SEEK_SET`.


    Of course for more information, you can always look in the man pages.


    You can even remove a file with the `remove` function. Write it down, there might
    be lots of files to remove from Vijay’s head.


    | `int remove(const char *pathname);` |


    It’s not that streams and file descriptors are like oil and water,


    | `#include <stdio.h>int fileno(FILE *stream);FILE *fdopen(int fildes, const char
    *mode);` |


    `fileno` tells you the file descriptor of a stream


    `fdopen` opens a file stream based on a file descriptor with a mode. `fopen` opened
    a file too, but using the name of the file.


    So, file descriptors and streams have a link and it’s not a polarising path of
    choice.


    What follows is the pseudocode. A way to structure a program. A pseudocode usually
    is more comprehensible, but since I am here with you, I guess we can skip the
    detailed guidance part. This is a program which uses the `FILE` stream to read
    from one file and write to the other. This isn’t a program because a full program
    might be spoon feeding you. I want you to write a program based on this information
    and try it out on your system.” Lingaraj showed her a text file in his laptop
    to Seema.

