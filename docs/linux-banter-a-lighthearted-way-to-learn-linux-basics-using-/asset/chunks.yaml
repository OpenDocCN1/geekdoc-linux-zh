    The output would be:


    | Today is my birthday, wish me! |


    The ‘exec’ replaces the shell with another program. Like doing away with the shell.


    | $ exec echo This shell is gone! |


    The words are echoed to the screen and the shell goes away.”


    “Is that okay? The shell going away? Isn’t the shell important?” asked Seema.


    “Philosophically, no!”


    Seema understood he meant the outer shell of a person. Lingaraj continued.


    “You can remember it this way. Will execution. A person nominates someone in his
    place and disappears.


    My great grandfather was fond of concocting all kinds of plant and vegetable juice
    to make his special drinks. He used to tell a lot of tall tales after that. On
    one fateful day, he had made a drink. He took a sip and turned blue. Before passing
    away, he announced my father, who is actually an academic of great stature with
    a biotechnology engineering degree and an MBA, as the next concoction maker. My
    grandfather’s old customers still come to my father to buy drinks and my father
    chases them away. 


    The ‘exit’ command. If you type exit after a command in the program, you can return
    a value which can be used by the program. I have a request. If after you finish
    this course with me and someone asks you how it went, tell them it was 0.”


    “You are not that bad!”


    “In Linux, an exit code of 0 usually indicates success.


    There are 125 more exit statuses.


    Now, the ‘export’ command. You said I am not that bad. If you think I am great,
    which I am sure you will, it’s no good if you tell me. You have to tell others
    as well. So,


    | Lingaraj=Great |


    has to be made available to everybody, in addition to assigning it you have to
    export it.


    | export Lingaraj |


    So other people like you can come to me and learn from me.


    In Linux, when you use the export command, that variable stops being just a local
    variable and it’s value can be used in other scripts and commands invoked by the
    current script.


    Look at this shell script, echoexport1.sh


    | Lingaraj=greatexport Lingarajecho The value of Lingaraj is $Lingarajecho "This
    is the shell script where Lingaraj=great is declared."echo Now calling the second
    script./echoexport2.sh |


    And now, echoexport2.sh


    | echo The value of Lingaraj is $Lingarajecho "This is a shell script that does
    not contain the declaration."echo "Yet, if it is being called by the script which
    had a declaration and export, this will print the value of Lingaraj." |


    When we run them both, we get this output :


    | The value of Lingaraj is greatThis is the shell script where Lingaraj=great
    is declared.Now calling the second scriptThe value of Lingaraj is greatThis is
    a shell script that does not contain the declaration.Yet, because it is being
    called by the script which had a declaration and export, this is printing the
    value of Lingaraj. |


    ‘expr’ . Like ‘eval’ looked into the variable storing the command, ‘expr’ looks
    into the arithmetic involved in a stored variable. Other variables are stored
    as strings. But expr looks beyond the string and looks at things mathematically.


    expr_add.sh


    | echo Enter 2 numnersread xread yresult = `expr $x + $y`echo “Result = $result”
    |


    Notice the back tick. This is below the ‘Esc’ character.


    Lingaraj ran the program.


    The output was shown.


    | Enter 2 numbers. |


    Lingaraj entered 4, pressed the ‘Enter’ key and pressed 5.


    | Result = 9 |


    | $((…)) |


    A better alternative is $((…)) expansion. By enclosing the expression you wish
    to evaluate in


    $((…)) , you can perform simple arithmetic much more efficiently:


    incrx.sh


    | #!/bin/shx=0while [ “$x” -ne 10 ]; doecho $xx=$(($x+1))doneexit 0 |


    | set |


    set takes the output from a command, function or a program and makes a neat little
    variable list, $1, $2 etc out of it. Here’s an example :


    setdate.sh


    | #!/bin/shecho The date is $(date)set $(date)echo The month is $2exit 0 |


    Here, the output from the date is taken and set. The month is the second variable
    in the list and so it is printed.


    | shift |


    shift reduces the parameter number $3 becomes $2, $2 becomes $1 with $1 being
    kicked out. $0 remains the same.


    “Why would you need this?”


    “You can scan only 10 parameters , that is $10 is the highest. What if somebody
    enters a 11th parameter. You might find it useful there.


    There was this guy in our community who built a carriage that ran on herbs.  Everyone
    in the community wanted to ride in it. But there were only 10 seats available.
    So, after every ride, a guy was pushed in from the right, because nobody wanted
    to get out of the carriage. So, the first guy on the left would fall off. We did
    this until the whole community was happy. Of course, the carriage broke down and
    so did it’s inventor. Like that, you shift.


    | unset |


    Used to remove values associated with variables.


    Suppose you wear a red dress and you come to have an identity associated with
    it. So


    | favcolour = red |


    In case you don’t want red to be your favourite colour any more, but can’t decide
    on a new colour, you do


    | unset favcolour |'
