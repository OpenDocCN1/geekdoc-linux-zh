- fmt: "\n```bash\n$ find / -name test -print\n```\n\nYou will find all files named\
    \ `test` and get it printed on screen. Starting with the `/`, the ….?”root directory.”\
    \ Seema answered.\n\n“So,\n\n```bash\n$ find / -name Seema -print\n```\n\nwill\
    \ print all the files named `Seema` in the system.”\n\nThese are a few options.\n\
    \n### `-atime N`\n`N` here is a number. The file was last accessed `N` days ago.\
    \ When you know when Vijay last accessed a particular file to give you a parallel.\n\
    \n### `-mtime N`\nThe file was modified `N` days ago.\n\n### `-name pattern`\n\
    The name of the file, excluding any path, matching the pattern provided. To ensure\
    \ that the pattern is passed to `find`, and not evaluated by the shell immediately,\
    \ the pattern must always be in quotes.\n\nAn example would be:\n\n```bash\nfind\
    \ . -name “*ma” -print\n```\n\nWill print all files ending with ‘ma’. Notice the\
    \ dot. In the current directory. So, we learn that the `*` is pretty handy if\
    \ you don’t know any names. It’s a great tool to use in marriage functions where\
    \ some relatives come and ask you, “Remember who I am?” If this were an accepted\
    \ convention, people would say, you are ‘* uncle’ or ‘* aunt’ literally and they\
    \ would be happy and we can move onto more valuable pursuits like setting status\
    \ messages.\n\nSince we are on this topic, if you remember some part of the name\
    \ like it has to be either Suresh or Ramesh, but can’t pinpoint, you can use ‘???esh’’.\
    \ That way, you will score some more social acceptability points. Because you\
    \ weren’t off by a long way. You can even use `[SR][ua][rm]esh`. That way, people\
    \ will think you are working on artificial intelligence. \n\n```bash\nfind . -newer\
    \ Seema\n```\n\nNotice the period(`.`).\n\nFinds the files newer than the file\
    \ `Seema`. In case, there are any more additions since you last met Vijay.” said\
    \ Lingaraj aiming to help.\n\n“This is going a bit too far.”\n\n“Look who’s talking.\n\
    \ntype `-d` for a directory and `-f` for a regular file.\n\n```bash\n$ find .\
    \ \\( -name “*ti” -o -newer Seema \\) -a -type f -print\n```\n\n“It finds all\
    \ the files ending with ‘ti’ or files newer than `Seema` and must be a regular\
    \ file as pointed out by `f` and then print. The backslash `\\` before the bracket\
    \ is an escape character. \n\nYou have seen how to find with filenames, but what\
    \ about searching inside the files? You have the `grep` command.\n\nMy great grandfather,\
    \ as I told you made a lot of concoctions and I documented them on this computer.\
    \ I have a list of files. Now, if I want to search all concoctions with grapes\
    \ in them, this is how I do it.\n\n```bash\n$ grep grapes pprosedrink.txt\nYou\
    \ shall squash these grapes\n```\n\n```bash\n$ grep -c grapes pprosedrink.txt\n\
    pprosedrink.txt:24\n```\n\n`-c` is count and there are other options. Like `-v`\
    \ which is an inversion, shows how many lines there are without the word `grapes`.\
    \ To see how many files have the grapes words without wanting to see the file,\
    \ just add `-l` (small L).\n\n```bash\n$ grep [a-h] pprosedrink.txt\n```\n\nThe\
    \ square bracket can contain things that can be matched. This will highlight all\
    \ the words that contain alphabets between `a` and `h`.\n\n```bash\n$ grep a[[:blank:]]\
    \ pprosedrink.txt\nI am a fighting machine after this drink.\n```\n\nAfter the\
    \ `a`, `grep` used the regular expression `a[[:blank:]]` which told the system\
    \ to look for a blank after the `a`. That is in short, a word ending with ‘a’.\
    \ ”\n\n```bash\ngrep th.[[:space:]] pprosedrink.txt\n```\n\nSeema asked about\
    \ the dot after `th`. She then told Lingaraj that she knew what was inside the\
    \ square bracket was looking for a space. Lingaraj answered.\n\n“The dot is telling\
    \ the system to look for a single character. So the result is\n\n```\nHuge is\
    \ the sky\nBut if it weren’t for the eye\n```\n\nA metacharacter is a normal character\
    \ which has a meaning beyond it’s literal meaning.”\n\n“The `$` is a great example.”\
    \ offered Seema.\n\n“An anchor is the position in the line of text that the Regular\
    \ Expression is to match. For example, `^`, and `$` are anchors.\n\nWhat is `4\
    \ + 2`?”\n\nSeema was surprised. Seema thought of asking Lingaraj ‘Why?’ But she\
    \ had a feeling Lingaraj himself did not ask himself ‘Why?’ before he did things.\
    \ She answered.\n\n“6.”\n\n“5 + 1?”\n\n“6”\n\n“12/2?”\n\n“6.”\n\n“3+3?”\n\n“6.”\n\
