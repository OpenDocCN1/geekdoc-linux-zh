    “Okay, so the assistant calls you, but if you are not reachable, he will put it
    down as an error. But if you are reachable on the phone, he can communicate. Sounds
    lopsided. As you said, it’s strange.” said Seema.


    “You won’t believe it, but this actually happened. After he called me inside the
    house to talk to her directly, he would not let us be alone. He used to scrutinise
    my every word. I got adventurous and tried to sneak in a message between all the
    multithreading concepts.


    I said:


    free()


    printf(“Lunch and ice cream\n”);


    somewhere between the lines. I thought only Suparna would understand it. Her dad
    understood it as well.


    “So, where there ought to have been lunch, there was a punch and you screamed?”


    “No, that guy got all dressed up and ready. He was beaming. He told his daughter,
    ‘This guy is offering us free lunch with ice cream. We should not deny the requests
    of our guests.’ Then all of us went and I had to get them both lunch and ice cream
    at this 5 star hotel.


    ![](image_rsrc85G.jpg)


    He had even brought a hot box with him to get the night’s dinner packed. I told
    them I had no money. But they went about their eating. After he had the ice cream,
    the waiter came.


    ‘Sir, pleased to serve the owner of out hotel.’ the waiter said.


    I was shocked. Suparna’s father was the owner of the 5 star hotel. So this was
    a trick all along. He actually liked me and this was the surprise. What Suparna’s
    father said next floored me.


    ‘Please give the bill to this young man here.’


    “But…” I began. The both of them got up and left.


    Then the waiter told me that Suparna’s father was the biggest miser in town.


    I had to wash the dishes of course. I also found out later that the guy had been
    making copies of my notes on Linux threading and selling them.


    Anyway, let’s move on. We can read and write to fifos after we create them and
    access it using a file descriptor. 


    | #include <unistd.h>int access(const char *pathname, int mode); |


    The above command checks to see whether a file given by the pathname exists. The
    mode is usually F_OK.


    If the number of bytes being written is greater than PIPE_BUF defined in limits.h,
    let’s just say the write fails. There could be a case where many programs are
    writing to the FIFO and in such a scenario, rather than interleave the data, you
    would be safe if the size does not exceed PIPE_BUF.


    Let’s look at an example program.


    This is the producer program :


    fifo_prod.c


    | #include <unistd.h>#include <stdlib.h>#include <stdio.h>#include <string.h>#include
    <fcntl.h>#include <sys/types.h>#include <sys/stat.h>#define FIFO_NAME "/tmp/my_fifo"int
    main(){    int pipe_fd;    int res;    int bytes_sent = 0;    char buffer[100];        printf("Input
    text to be passed\n");                fgets(buffer, sizeof(buffer), stdin);        printf("%s",
    buffer);        res = mkfifo(FIFO_NAME, 0777);            if (res != 0) {            fprintf(stderr,
    "Could not create the FIFO %s\n", FIFO_NAME);            exit(EXIT_FAILURE);        }   
    printf("Process %d is opening the FIFO in O_WRONLY mode\n", getpid());    pipe_fd
    = open(FIFO_NAME, O_WRONLY);    if (pipe_fd != -1)    {          printf("Pipe
    succesful\n");        res = write(pipe_fd, buffer, sizeof(buffer));            if
    (res == -1) {                fprintf(stderr, "Write error on pipe\n");                exit(EXIT_FAILURE);            }               bytes_sent
    += res;                    (void)close(pipe_fd);    }    else {        printf("Pipe
    not successful\n");        exit(EXIT_FAILURE);    }    printf("Process %d finished.
    Bytes sent - %d\n", getpid(), bytes_sent);    exit(EXIT_SUCCESS);} |


    This asks the user to print some input text that is to be passed through the FIFO.
    Then it makes a fifo in /tmp/my_fifo. Then it opens the FIFO and gets a file descriptor
    for it. Then we write to the FIFO, the user input text which we have stored in
    buffer. After writing, we close the FIFO. If the open is successful, we write
    to the pipe. All this testing the conditions from the return values. Notice that
    there is no fork or execl. So, we need another way to run the programs side by
    side. I will tell you about it in a while.


    This is the consumer program fifo_cons.c.


    fifo_cons.c


    | #include <unistd.h>#include <stdlib.h>#include <stdio.h>#include <string.h>#include
    <fcntl.h>#include <sys/types.h>#include <sys/stat.h>#define FIFO_NAME "/tmp/my_fifo"#define
    BUFFER_SIZE PIPE_BUFint main(){    int pipe_fd;    int res;    int open_mode =
    O_RDONLY;    char buffer[100];    int bytes_read = 0;    memset(buffer, ''\0'',
    sizeof(buffer));    printf("Process %d opening FIFO in O_RDONLY mode.\n", getpid());    pipe_fd
    = open(FIFO_NAME, O_RDONLY);    printf("Process %d, the file descriptor is %d\n",
    getpid(), pipe_fd);    if (pipe_fd != -1)    {            res = read(pipe_fd,
    buffer, sizeof(buffer));            bytes_read += res;            (void)close(pipe_fd);    }    else
    {        exit(EXIT_FAILURE);    }    printf("Process %d finished, %d bytes were
    read and the message was %s\n", getpid(), bytes_read, buffer);    exit(EXIT_SUCCESS);}
    |


    Because the consumer is a completely different program, we can use the same variable
    names. Only the FIFO name is known and it has to be consistent in both the programs.
    The FIFO is read through it’s file descriptor given by the open call. Then it
    is closed. The relevant message is printed along with the string that was sent
    through the FIFO. This is how we run it.


    We create executable files for both, naming them, for instance fifo_prod and fifo_cons,
    after removing the file /tmp/my_fifo if it exists. Of course, we can use the access()
    system call also in the program to check for the existence of the file.


    We run fifo_prod in one terminal. The output looks like this


    | Input text to be passed |


    Then we type :


    Seema learns Linux.


    This is printed on the screen because of the printf function.


    | Seema learns Linux. |


    Then, you get this message :


    | Process 61178 is opening the FIFO in O_WRONLY mode |


    Again, this is machine and instance specific. Now, open another terminal and run
    fifo_cons


    As soon as you run it, you get the following message :


    | Process 61182 opening FIFO O_RDONLYProcess 61182 result 3Process 61182 finished,
    100 bytes read, message was Seema learns Linux. |


    And the command prompt appears. In the other terminal, the whole output is :


    | Input text to be passedSeema learns LinuxSeema learns LinuxProcess 61191 is
    opening the FIFO in O_WRONLY modePipe succesfulProcess 61191 finished. Bytes sent
    – 100 |


    ‘Seema learns Linux’ is not 100 bytes. But we have declared buffer as a character
    array of 100\. So, it shows 100 in both the program outputs. As an exercise, I
    want you to modify this program using a while loop, looking for the newline character
    and counting the number of bytes written which is then printed.”


    “Sure.”


    “A note : You cannot use system calls like lseek() to read from FIFOs.” finished
    Lingaraj. Seema went to work on the exercise.


    IPC : Semaphores


    It’s time to remember the doctor’s story of the operation theatre and the film
    makers. The light is of only one colour, so the different states of the light
    are off and on.


    ![](image_rsrc85B.jpg)


    The switching on of the light allows access to the teams. Then the team uses the
    operation room and then politely toggles the light. The other team might be waiting,
    might not be waiting. Again the procedure repeats.”


    “Procedure? Pun intended?”


    “No. And of course, the teams might not be executing only in the operation room.
    The doctors could be in the x ray room, the film makers could be outdoors. So,
    the operation room is the critical region.”


    “Critical? Pun intended?”


    “Yes. The states of the switch. ON and OFF. This brings us to binary semaphores.
    Zero and one. Two scenarios.'
