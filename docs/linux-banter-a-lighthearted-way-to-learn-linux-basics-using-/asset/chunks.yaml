  trans: "\n\n### Bind\n\n```c\n#include <sys/socket.h>\nint bind(int socket, const\
    \ struct sockaddr *address, size_t address_len);\n```\n\n`socket` 是套接字数字。`sockaddr`\
    \ 结构包含了服务器的端口号、族和 IP 地址，通过将套接字文件描述符绑定到套接字数字，使其成包，因此对套接字文件描述符的引用意味着我们正在讨论特定的端口和网络地址。\n\
    \n端口和套接字的区别在于：端口是套接字的一部分。\n\n地址包含内容的结构：\n\n```c\nstruct sockaddr_in {\n    short\
    \ int sin_family;\n    unsigned short int sin_port;\n    struct in_addr sin_addr;\n\
    };\n```\n\n`sin_family` 可以是 `AF_INET`，尽管还有其他可能性。\n`sin_port` 是端口号，`sin_addr` 是\
    \ IP 地址。\n\n如果客户端必须通过套接字跨网络连接，它需要服务器计算机的 IP 地址。IP 地址类似于 `255.255.255.255`，其中 `255`\
    \ 是最大值。这是识别设备的一种。\n\n`sin_addr` 是 IP 地址结构：\n\n```c\nstruct in_addr {\n    unsigned\
    \ long int s_addr;\n};\n```\n\n成功时返回 `0`，错误时返回 `-1`。\n\n**错误类型：**\n\n| 错误 | 说明\
    \ |\n| :--- | :--- |\n| `EBADF` | 无效的文件描述符 |\n| `ENOTSOCK` | 不引用套接字。 |\n| `EINVAL`\
    \ | 已经存在同名的标识符套接字。 |\n| `EADDRNOTAVAIL` | 地址不可用 |\n| `EADDRINUSE` | 该地址已绑定了套接字。\
    \ |\n\n### Listen\n\n```c\n#include <sys/socket.h>\nint listen(int socket, int\
    \ backlog);\n```\n\n这使得套接字能够监听传入的连接并分配一个连接队列。`backlog` 是等待处理连接的最大数量。\n\n一旦服务器在上述调用后准备好监听，客户端就可以发起请求了。\n\
    \n服务器可以使用此系统调用进行接受：\n\n```c\n#include <sys/socket.h>\nint accept(int socket, struct\
    \ sockaddr *address, size_t *address_len);\n```\n\n`accept()` 系统调用会创建一个新的套接字与此特定的客户端通信，并返回其文件描述符。如果服务器必须服务许多客户端，这将非常有帮助。这是一个需要记住的重要点。对于连接到服务器套接字的每个客户端，在\
    \ `accept` 之后都会分配另一个数字。客户端的地址被放置在 `sockaddr` 结构中。\n\n如果没有客户端，`accept` 调用将阻塞。但你可以通过以下方式更改它：\n\
    \n```c\nint flags = fcntl(socket, F_GETFL, 0);\nfcntl(socket, F_SETFL, O_NONBLOCK\
    \ | flags);\n```\n\n在 `flags` 中使用 `O_NONBLOCK` 设置。\n\n### Connect\n\n在客户端侧，我们只需要连接、发送或接收和关闭。\n\
    \n```c\n#include <sys/socket.h>\nint connect(int socket, const struct sockaddr\
    \ *address, size_t address_len);\n```\n\n`socket` 是客户端的套接字，而不是服务器的套接字。服务器的规范在\
    \ `sockaddr` 结构中给出，该结构包含 IP 地址、端口号等。\n\n成功时返回 `0`，错误时返回 `-1`。错误可能是：\n\n| 错误 |\
    \ 说明 |\n| :--- | :--- |\n| `EBADF` | 无效的文件描述符 |\n| `EALREADY` | 该套接字的连接已进行中 |\n\
    | `ETIMEDOUT` | 连接超时 |\n| `ECONNREFUSED` | 连接被服务器拒绝。 |\n\n你可以像对待文件描述符一样对套接字使用\
    \ `write` 和 `read` 系统调用。当我们开始编程时看到这一点。\n\n```c\nint close(int socket)\n```\n\n\
    关闭套接字。这既可以用于服务器端，也可以用于客户端端。\n\n### Localhost\n\n在之前的进程间通信示例中，我们有键（keys）。一种将进程通过队列或共享内存结合在一起协作的独特键。在套接字中，我们需要\
    \ IP 地址和端口号。\n\n让我们聊本地主机（localhost）。我一直好奇通过电话拨打自己会是什么样子。我还没有尝试过。“为什么？”、“如果我接起电话并说‘你好’呢？”我对比平行宇宙有恐惧。\n\
    \n本地主机程序允许你通过网络与同一个系统通信。使用的 IP 地址是 `127.0.0.1`。\n\n让我们用伪代码开始理解这些程序。\n\n#### 对于\
    \ client1.c\n1. 包含头文件，特别是 `<sys/socket.h>`, `<netinet/in.h>` 和 `<arpa/inet.h>`。\n\
    2. 开始 `main()` 函数。\n3. 为服务器声明一个整数类型的 `socket` 文件描述符。\n4. 声明一个变量并赋值一个数字。\n5. 声明一个\
    \ `sockaddr_in` 结构。\n6. 使用 `socket(AF_INET, SOCK_STREAM, 0)` 创建套接字，并将返回值作为套接字文件流。\n\
    7. 填充结构的细节，在需要的地方使用函数 `inet_addr()` 处理本地主机，使用 `htons()` 处理端口号。\n8. 现在使用从 `socket()`\
    \ 函数获得的套接字文件描述符连接套接字。\n9. 检查是否有错误，如果有则打印相关的错误信息。\n10. 现在，向套接字写入内容（使用 `socket()`\
    \ 调用返回的套接字文件描述符发送到运行的服务器）。你写入你声明的数字。\n11. 从套接字读取。在这里，服务器对该数字进行了某种操作。现在读取该数字。\n\
    12. 打印信息，说明这是从服务器收到的数字。\n13. 关闭套接字文件描述符。\n\n#### 对于 server1.c\n1. 包含头文件。\n2. 为客户端套接字\
    \ `fd` 和服务器套接字 `fd` 声明两个整数类型。之所以是两个是因为在 `accept` 时，必须分配一个新的套接字地址。\n3. 为服务器地址和客户端地址声明两个\
    \ `sockaddr_in` 类型的结构。\n4. 像客户端一样调用 `socket` 函数并分配返回的文件描述符。\n5. 使用必要的函数填充服务器地址结构的成员，并保持端口号一致。\n\
    6. 现在使用 `bind` 结合服务器套接字文件描述符来绑定套接字。\n7. 声明一个整数变量，因为将从客户端接收一个变量。\n8. 使用服务器套接字文件描述符使用\
    \ `listen()` 函数开始监听。\n9. 在一个 while 循环中：\n    - 打印关于服务器状态的消息。\n    - 调用 `accept`\
    \ 函数并将新的文件描述符分配给客户端套接字 `fd`。要进行接受，你需要服务器套接字 `fd`、客户端地址和客户端长度。\n    - 使用刚刚调用 `accept()`\
    \ 返回的客户端套接字 `fd` 从套接字读取数字。\n    - 将数字加 1。\n    - 将更改后的数字写回读取的套接字。\n    - 关闭客户端套接字\
    \ `fd`。\n\n上面的程序可以通过使用 `fork` 来改进，创建一个新的子进程来处理客户端请求。这只需要在服务器程序的 while 循环内部 `accept`\
    \ 之后进行微小的更改。\n\n### Select System Call\n\n```c\n#include <sys/types.h>\n#include\
    \ <sys/time.h>\nstruct timeval {\n    time_t tv_sec;\n    long tv_usec;\n};\n\
    #include <sys/types.h>\n#include <sys/time.h>\nint select(int nfds, fd_set *readfds,\
    \ fd_set *writefds, fd_set *errorfds, struct timeval *timeout);\n```\n\n`select`\
    \ 系统调用基本上是一个监控系统。`select` 监控一组文件描述符是否已准备好进行读取、写入，或者是否存在错误条件。\n\n**参数为：**\n- `nfds`:\
    \ 它可以监控的文件描述符的最大数量。通常是最高文件描述符编号加一。\n- `fd_set`: 告诉系统这是一个文件描述符集，这必须先声明。\n- `readfds`:\
    \ 指向我们想要测试是否读取就绪的文件描述符集，即它们是否可以接受任何输入。\n\n"
- fmt: "\n`writefds` for write ready and `errorfds` for the set of file descriptors\
    \ we want to check for an error condition.\n\nThe `timeval` structure contains\
    \ two members, one specifying user time and the other specifying time in microseconds.\n\
    \nThis is the timeout value, when a period of time elapses before `select` returns\
    \ with the activated file descriptors.\n\n```c\n#include <sys/types.h>\n#include\
    \ <sys/time.h>\nvoid FD_ZERO(fd_set *fdset);\nvoid FD_CLR(int fd, fd_set *fdset);\n\
    void FD_SET(int fd, fd_set *fdset);\nint FD_ISSET(int fd, fd_set *fdset);\n```\n\
    \nThe above are a set of macros.\n\n`FD_ZERO` initialises the file descriptor\
    \ set, whether the `readfds` or `writefds` or `errorfds`.\n\n`FD_CLR` removes\
    \ a file descriptor from a file descriptor set.\n\n`FD_SET` adds a file descriptor\
    \ to a file descriptor set.\n\n`FD_ISSET` checks whether a file descriptor that\
    \ belongs to a particular file descriptor set is active. This is done after the\
    \ return from `select` to see whether the file descriptor we are interested in\
    \ is ready for reading or writing or has an error condition.\n\nWe will see all\
    \ this at work in a program shortly.\n\nThere are a few more functions to run\
    \ through.\n\nComputers of different types agree on values for multibyte integers\
    \ transmitted over a network, using network ordering. Especially port numbers.\
    \ Different computers may use different ways to denote numbers that need to be\
    \ used. My house number is `1`. In my mind, I think of it as:\n\n`((-b) ± √(b²-4ac))`\n\
    \n2a\n\nwhere\n\n`a = 3`\n`b = -6`\n`c = 3`\n\nfor some reason. If I order food\
    \ from a food delivery service, I can’t put this in the address box. I have to\
    \ type in `1`. So, we have functions that act as a go between, between the native\
    \ host formats and the standard network.\n\n```c\n#include <netinet/in.h>\nunsigned\
    \ long int htonl(unsigned long int hostlong);\n```\n\nConverts host format to\
    \ standard network long\n\n```c\nunsigned short int htons(unsigned short int hostshort);\n\
    ```\n\nhost format to network format short\n\n```c\nunisgned long int ntohl(unsigned\
    \ long int netlong);\n```\n\nnetwork to host long\n\n```c\nunsigned short int\
    \ ntohs(short int ntohs(unsigned short int netshort));\n```\n\nnetwork to host\
    \ short\n\n```c\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\
    in_addr_t inet_addr(const char *cp);\n```\n\nThis function converts your IP address\
    \ to network form to put it bluntly.\n\n“What if the server and client don’t know\
    \ the port numbers or the addresses?”\n\n“In such a scenario, there are functions\
    \ you can use where the complete details of the computer are obtained. Example:\n\
    \n```c\n#include <netdb.h>\nstruct hostent *gethostbyaddr(const void *addr, size_t\
    \ len, int type);\nstruct hostent *gethostbyname(const char *name);\n```\n\nThis\
    \ will return a structure\n\n```c\nstruct hostent {\n    char *h_name;\n    char\
    \ **h_aliases;\n    int h_addrtype;\n    int h_length;\n    char **h_addr_list\n\
    };\n```\n\nFor services and relevant port numbers:\n\n```c\n#include <netdb.h>\n\
    struct servent *getservbyname(const char *name, const char *proto);\nstruct servent\
    \ *getservbyport(int port, const char *proto);\n```\n\nIt returns a structure.\n\
    \n```c\nstruct servent {\n    char *s_name;\n    char **s_aliases;\n    int s_port;\n\
    \    char *s_proto;\n};\n```\n\n```c\n#include <arpa/inet.h>\nchar *inet_ntoa(struct\
    \ in_addr in);\n```\n\nThis converts an Internet host address to a string in dotted\
    \ quad format.\n\n```c\n#include <unistd.h>\nint gethostname(char *name, int namelength);\n\
    ```\n\nThis will write the hostname into the string given by name.\n\nOf course,\
    \ you have to know something about the system you want to have a network with.\n\
    \n### UDP\n\nLike I said, UDP is no guarantee. You construct the programs in a\
    \ similar manner to TCP/IP but rather than use `read` and `write`, you use the\
    \ following system calls. UDP is a less expensive way of getting some not so important\
    \ data.\n\n```c\nint sendto(int sockfd, void *buffer, size_t len, int flags, struct\
