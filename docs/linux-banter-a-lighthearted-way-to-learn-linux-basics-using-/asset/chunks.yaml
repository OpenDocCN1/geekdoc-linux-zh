    ![](image_rsrc821.jpg)


    It was a day of spring and everybody on the streets moved admiring the flowers
    in a good mood. But that did not rub off on Seema who was walking with anxiety
    towards the hospital. Seema was 26, tall and prone to be flustered with technology
    and was horrible at remembering passwords. The hospital had good ![](image_rsrc822.jpg)doctors
    and that was what mattered to most of the patients. 


    Seema walked because her fiance, Vijay was lying on one of the beds. She was informed
    about Vijay’s accident and she had rushed. She spoke at the reception desk who
    directed her to the special ward on the first floor. She ran up the stairs and
    saw Vijay sleeping on the bed with a bandage around his head.


    ![](image_rsrc823.jpg)


    Vijay was a young man of 30 and was an interior designer. Seema, being a geography
    expert had met Vijay about a year ago when he had shown up at the consultancy
    office she ran, to design it. They had the same taste and things had taken a turn
    for the good. Until this incident. Seema looked at Vijay and wished she could
    help him in some way. Then she went to see the doctor.


    ![](image_rsrc824.jpg)


    The doctor was a gregarious man in his forties and was particular about making
    his patients and their families at ease.


    “He has a mild concussion. A laptop fell on his head while he was travelling in
    the train. The software installed in the laptop cushioned the fall.” said the
    doctor.


    He started to laugh at his joke.


    “I hope he will be alright.” said a concerned Seema.


    ![](image_rsrc825.jpg)


    It was then that Vijay walked in with a keyboard in his hand.


    ![](image_rsrc826.jpg)Both Seema and the doctor were taken aback. But the doctor,
    hospitable as ever, asked.


    “Would you like some coffee, Vijay?”


    ![](image_rsrc827.jpg)


    “I don’t drink coffee. It might damage my central processing unit made of silicon.”
    replied Vijay.


    Seema and the doctor were taken aback again.


    “Vijay, are you alright?” she asked with some concern.


    ![](image_rsrc828.jpg)


    “As alright as a write command writing a byte.” said Vijay.


    “Let’s go.” Seema said.


    “If you have a command, please type it into this keyboard.” said Vijay.


    ![](image_rsrc829.jpg)


    Then Vijay handed over the keyboard.


    “It’s connected to me via a network.” he said.


    Seema was beginning to get alarmed. With shaky hands she took the keyboard and
    typed.


    ![](image_rsrc82A.jpg)


    “…..lllets go”


    “I don’t understand that command.” announced Vijay.


    Seema then turned to the doctor.


    ![](image_rsrc82B.jpg)


    “What is happening?” she asked him.


    “I think he’s imbibed machine consciousness. Maybe a suppressed desire from his
    childhood to be a robot, what with all the films glorifying it.”


    “Vijay, you will be all right.” she said trying to sound convincing.


    “Do you know a cure for it?” she asked the doctor.


    ![](image_rsrc82C.jpg)


    “There is this community near the Dandeli forest. There is a doctor.”


    “A neurosurgeon?”


    “No, a crocodile doctor. At least he calls himself that.”


    Seema was wondering whether all this was a dream.


    “He is a Linux programming expert. Maybe he will teach you to communicate with
    Vijay as a computer and get him to revert to humanity.” continued the doctor.


    “His name?”


    “His name is Lingaraj.”


    ![](image_rsrc82D.jpg)


    Seema booked a cab and was on her way to Dandeli. As she started her journey from
    Bengaluru, she was quite tense. The driver tried to make small talk, but she was
    too anxious.


    ![](image_rsrc82E.jpg)


    After the car had gone past Tumkur, there were agricultural fields on either side
    of the road. The driver switched on some sad songs about love sensing the mood.
    The driver was sensitive to his passengers’ moods and feelings and had quite a
    good collection of music.


    ![](image_rsrc82F.jpg)


    As they neared Dandeli, Seema could discern the change in climate and the sparsity
    of the population gave her a sense of calm.


    ![](image_rsrc82G.jpg)


    Lingaraj’s community, were a group of people who had taken lands near the forest
    and had maintained themselves sustainably. The community of around 2000, which
    had lived there for generations had access to technology and there were a lot
    of academics and scholars in there.  


    Seema’s car reached the location which Lingaraj had sent. It had to be accessed
    via a mud road, passing over old bridges. They had passed waterfalls and climbed
    up and down mountains.


    ![](image_rsrc82H.jpg)


    The cab driver had switched off his music system allowing Seema to listen to the
    sounds of unexploited nature. 


