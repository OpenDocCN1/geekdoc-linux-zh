  trans: "\n\n```c\nint pthread_attr_setscope(pthread_attr_t *attr, int scope);\n\
    int pthread_attr_getscope(const pthread_attr_t *attr, int *scope);\n```\n\n这控制如何计算线程的调度策略。\n\
    \n```c\nint pthread_attr_setstacksize(pthread_attr_t *attr, int scope);\nint pthread_attr_getstacksize(const\
    \ pthread_attr_t *attr, int *scope);\n```\n\n这用于需要更大栈空间的线程。根据局部变量的大小或例程的数量，为特定目的指定栈大小。\n\
    \n```c\nint pthread_attr_setstackaddr( pthread_attr_t *attr, void *stackaddr);\n\
    ```\n\n“你可以指定栈地址。” Seema 回道。\n\n### 线程取消\n\n```c\n#include <pthread.h>\nint pthread_cancel(pthread_t\
    \ thread);\n```\n\n这取消一个线程。但线程是否可以被取消取决于线程本身。这就像是一种侮辱。一位大师曾说：“侮辱的刀落在我的脚边，我不会捡起它并刺自己。”\n\
    \n所以，取消取决于线程。如果线程是否愿意被取消，在编码时，你使用以下函数：\n\n```c\n#include <pthread.h>\nint pthread_setcancelstate(int\
    \ state, int *oldstate);\n```\n\n在这里，`int state` 可以是两个值：\n\n`PTHREAD_CANCEL_ENABLE`\n\
    \n或者\n\n`PTHREAD_CANCEL_DISABLE`\n\n`oldstate` 参数获取之前的状态。\n\n“这是我第一次从你这里听到哲学。非常深刻。”\n\
    \n“我曾有我自己的哲学。我曾在某城市的一栋摩天大楼里当管道工，有一天，我收到投诉说顶层水箱漏水。我一路爬上去，看到一个女人站在露台的边缘。我感觉到她在计划什么，于是和她聊了起来。\n\
    \n![](img/image_rsrc85E.jpg)\n\n我从谈论生活开始，持续了半小时。然后她说：“我爬上这栋楼是为了向世界展示信念的力量。但在听了你的话后，我想跳下去了。”\n\
    \nSeema 拍了她的额头。\n\n“那些日子，我试图用我的个性来影响世界。无论如何，如果一个线程对被取消是开放的，你可以使用以下 库函数：\n\n```c\n\
    #include <pthread.h>\nint pthread_setcanceltype(int type, int *oldtype);\n```\n\
    \n`type` 为以下之一：\n\n`PTHREAD_CANCEL_ASYNCHRONOUS`\n\n这会在收到取消请求后立即取消线程。\n\n`PTHREAD_CANCEL_DEFERRED`\n\
    \n这会延迟取消线程直到调用了必要的 `pthread` 函数。\n\n我觉得我们关于线程说得太多了。\n\n## 进程间通信\n\n### 管道\n\n\
    让我们谈谈进程间通信。\n\n让我从一个故事开始吧。我有一个喜欢的女孩，我想更深入地了解她。于是，我为她写了这首诗：\n\n我的心在嬉戏的情感中徘徊，身影\n\
    在宁静的河流中\n在童年嬉玩的斜坡上\n从侠士身上落下\n跳跃去拥抱海洋\n我们能再多聊聊吗？\n关于远北山脉\n以及在脚下点燃篝火会是什么感觉\n关于南方沉睡的草原\n\
    以及坐在那里拿着咖啡杯\n东部延伸的沙漠\n以及在绿洲的棕榈树上系上骆驼\n西部慵懒的海\n以及将海壳贴在耳朵\n东方天空之外的蓝色太阳\n以及被其众多月亮照亮的行星\n\
    那里宝石躺在床上\n在纯净的水流下\n羚羊护着你前行\n感到与起伏的水合为一\n那里森林变成了长笛\n生命是和谐的交响\n在那里无事可做，无所事事\n而发生的一切\n\
    都源于无无包象的爱，甚至是一片\n落叶\n\n我想亲面向她读这封信，于是来到了她家。我敲了门，很快，她的父亲——她叫他为“老爸”——打开了门。那是一栋大房子。我告诉我想见见\
    \ Suparna。\n\n![](img/image_rsrc85F.jpg)\n\n“你想告诉她什么？”他问。\n\n“是私事。”我回答道。\n\n“无论你想告诉她什么，告诉我，我来告诉她。”\n\
    \n我大吃一惊。接着我向他解释了 Linux 中的多线程以及它是如何实现的，并说了整整一个小时。\n\n“我会告诉她的，”他说并关上了门。\n\n我重复了这一过程一周，深入研究了多线程。在第八天，他打开了门。\n\
    \n“在多线程中……”我开始说道\n\n“无论你想告诉她什么，直接告诉她。”\n\n“而且那也失败了，我猜。”\n\n“怎么，我以后告诉你。所以，她的老爸表现得就像一个管道。这引出了第一个\
    \ C 库函数。”\n\n```c\n#include <stdio.h>\nFILE *popen(const char *command, const\
    \ char *open_mode);\n```\n\n所以，这通常用于向进程传递命令。`open_mode` 为 `r` 或 `w`。\n\n调用程序可以使用\
    \ `\"r\"` 接收被调用进程的输出。\n\n调用程序可以使用 `\"w\"` 将其输出发送到被调用进程的输入，”Lingaraj 说道。\n\n```c\n\
    int pclose(FILE *stream_to_close);\n```\n\n这关闭管道。如果被调用进程仍在运行，`pclose` 将等待它完成然后关闭管道。\n\
    \n它返回该文件流对应的进程的退出代码。\n\n“这是一个例子。” Lingaraj 向她展示了一些伪代码并开始解释。\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include\
    \ <fcntl.h>\nint main(){\n  int total_bytes;\n  int filed_pipe[2];\n  const char\
    \ chars_passed[] = \"Crocodile Doctor\";\n  char buffer[BUFSIZ +1];\n  pid_t fork_success;\n\
    \  memset(buffer,'\\0',sizeof(buffer));\n  pipe(filed_pipe);\n  fork_success =\
    \ fork();\n  if (fork_success == -1)\n    {\n        fprintf(stderr,\"Fork Failure\"\
    );\n        exit(EXIT_FAILURE);\n    }\n    else if (fork_success == 0)\n    {\n\
    \        total_bytes = read(filed_pipe[0],buffer, BUFSIZ);\n        printf(\"\
    This program has read %d bytes - %s\\n\",total_bytes, buffer);\n        exit(EXIT_SUCCESS);\n\
    \    }\n    else\n    {\n        total_bytes = write(filed_pipe[1],chars_passed,\
    \ strlen(chars_passed));\n        printf(\"This program wrote %d bytes\\n\", total_bytes);\n\
    \    }\n  exit(EXIT_SUCCESS);\n}\n```\n\n输出是：\n\n| This program wrote 16 bytesThis\
    \ program has read 16 bytes - Crocodile Doctor |\n\n顺序看起来不对仅仅是因为父进程在子进程之前就结束了。所以写入是先进行的。\n\
    \n"
- fmt: "\nWhat happened in the above program was this. A child process was created\
    \ using `fork` and we saw whether the program was now in the parent or child process\
    \ using the return from `fork`. In the first instance, it was in the child process\
    \ as the `fork` return was `0`. Then we read from the first file descriptor. Now,\
    \ a process different from the program which is executing managed to read from\
    \ the program you wrote, albeit a child process. So, some kind of communication\
    \ is happening. This is easy because the child process inherited the file descriptors.\
    \ But what if, the programs are completely different?\n\nWe need two programs.\
    \ Let’s call this the producer program, because it supplies the data to be passed.\
    \ We will name it `pipe_prod.c`.\n\n### pipe_prod.c\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\nint main(){\n \
    \   int total_bytes;\n    int filed_pipe[2];\n    const char chars_passed[] =\
    \ \"Crocodile Doctor\";\n    char buffer[BUFSIZ + 1];\n    pid_t fork_success;\n\
    \    memset(buffer, '\\0', sizeof(buffer));\n    pipe(filed_pipe);\n    fork_success\
    \ = fork();\n    if (fork_success == -1)\n    {\n        fprintf(stderr,\"Fork\
    \ Failure\");\n        exit(EXIT_FAILURE);\n    }\n    else if (fork_success ==\
    \ 0)\n    {\n        sprintf(buffer,\"%d\", filed_pipe[0]);\n        (void) execl(\"\
    pipe_cons\",\"pipe_cons\", buffer, (char*) 0);\n        printf(\"This is the child\
    \ process,but this text won't be displayed because execl finishes off the calling\
    \ process.\");\n        exit(EXIT_FAILURE);\n    }\n    else\n    {\n        total_bytes\
    \ = write(filed_pipe[1],chars_passed, strlen(chars_passed));\n        printf(\"\
    This program wrote %d bytes - %s\\n\", total_bytes, buffer);\n    }exit(EXIT_SUCCESS);}\n\
    ```\n\nThe first change is the `sprintf` function. It captures the first file\
    \ descriptor in the array passed to `pipe` in the holder, `buffer`. That is, it\
    \ prints the value of the file descriptor stored in `filed_pipe[0]` into `buffer`.\
    \ Because the second program we call later will not inherit the file descriptors.”\
    \ explained Lingaraj.\n\n“But there is a call to `fork`.” said Seema.\n\n“Yes.\
    \ The logic is, if we call another program using `execl`, which we will, the calling\
    \ process is done away even though the process continues. It’s like all taking\
    \ over my position and not being there longer. So, the process is finished. We\
    \ call `fork`, create a child process and then call `execl` from the child process.\
    \ This way, the parent process is retained and the child process finishes. Hence,\
    \ you won’t see the text in `printf` statement, “This is the child process,but\
    \ this text wont be displayed because execl finishes off the calling process.”\
    \ In `execl`, we call the program to be executed which is `pipe_cons` and also\
    \ supply two pieces of information. One, the name of the program as an argument\
    \ to the program. And the other, the file descriptor we had stored in `buffer`.\
    \ So, the program being called by `execl` will have the information.\n\nLet’s\
    \ move on to the consumer program which receives the data. This is named `pipe_cons.c`.\n\
    \n### pipe_cons.c\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
    #include <string.h>\nint main(int argc,char *argv[]){\n    int bytes_ex;\n   \
    \ char buffer[BUFSIZ + 1];\n    int file_des;\n    memset(buffer,'0',sizeof(buffer));\n\
    \    sscanf(argv[1],\"%d\", &file_des);\n    printf(\"The argument to the consumer\
    \ is %s\\n\", argv);\n    bytes_ex = read(file_des, buffer, BUFSIZ);\n    printf(\"\
    The process %d has read %d bytes. Content : %s \\n\", getpid(), bytes_ex, buffer);\n\
    \    exit(EXIT_SUCCESS);}\n```\n\nThis receives the data through `sscanf`. But\
    \ about `memset()`.\n\n```c\n#include <string.h>\nvoid *memset(void *s, int c,\
    \ size_t n);\n```\n\nThe `memset()` function fills the memory area pointed to\
    \ `s` with the constant byte `c`. If you want a memory area to be filled with\
    \ characters, use the above program.\n\n“There was this guy we called Sathya.\
    \ He was a speaker. Nobody used to listen to him because he used to lie. He had\
    \ a false terminator. A terminates a string as you know. He used to say “My speech\
    \ is done.” and would go on for half hour more. You want to meet him? I won’t\
    \ say anything beyond this.” Lingaraj knew she hadn’t got the point. He didn’t\
    \ know how to explain this. So he moved on. The next line prints the argument\
    \ received by this consumer program, which is sent when we run the producer program.\
    \ This will show in the output this program’s name, which is `pipe_cons`. Then\
    \ it reads from the file descriptor. What does it read? It is not reading from\
    \ a file, but from a file descriptor which was written to using pipe. Of course\
    \ you can say, rather than passing the argument through the buffer, why not pass\
    \ the string ‘Crocodile Doctor’ directly. We might need to pass amounts of data\
    \ which cannot simply be held in a string.”\n\nThe output, after we create the\
    \ executables name `pipe_prod` and `pipe_cons` respectively, an important step\
    \ is to run the `pipe_prod` program only using `./pipe_prod`.\n\n```\nThis program\
    \ wrote 16 bytes -The argument to the consumer program is pipe_cons\nThe process\
    \ 5354 has read 16 bytes. Content : Crocodile Doctor\n```\n\n“5354 is specific\
    \ to this instance as I said before. What if the second process isn’t started\
    \ from the first program, but a totally unrelated program?” asked Seema.\n\n“Good\
    \ question. We have FIFOs for that. A FIFO as I said is First In Out. Whatever\
    \ you put into a FIFO has to be accessed in the same sequence you put it in.\n\
    \n```c\n#include <sys/types.h>\n#include <sys/stat.h>\nint mkfifo(const char *filename,\
    \ mode_t mode);\n```\n\nThis makes a FIFO with a filename and a mode you specify.\
    \ Modes are important. You simply cannot use `O_RDWR`. It is unnecessary in the\
    \ first place and secondly the results are undefined. Suppose I upload a video\
    \ online and go out on a trek where there is no internet access. I ask my friend\
    \ to keep track of the views. After 2 days, I call him from an old fashioned landline,\
    \ and if the views are 0, he will block my call so as not make me feel gloomy\
    \ on the trek. If I call him an hour later, he will still block me. But if there\
    \ is 1 view, he will answer the call and tell me the good news. If it’s a friend,\
    \ I can’t enforce him to give me the report even if it’s 0 views. However if I\
    \ employ an assistant from the film industry and pay him, he will tell me there\
    \ are 0 views. Of course he will lose respect for me and look for employment elsewhere,\
    \ but that’s besides the question. I can enforce a `O_NONBLOCK` on him. In the\
    \ context of `open` when you pipe the mode, either `O_RDONLY` or `O_WRONLY` with\
    \ `O_NONBLOCK`,\n\n```c\nopen(const char *path, O_RDONLY);\n```\n\nThe `open`\
    \ call will block; it will not return until a process opens the same FIFO for\
    \ writing.” said Lingaraj.\n\n“So, it’s like your friend blocking your call until\
    \ there are views on your video.” said Seema. Lingaraj continued.\n\n```c\nopen(const\
    \ char *path, O_RDONLY | O_NONBLOCK);\n```\n\nThe `open` call will now succeed\
    \ and return immediately, even if the FIFO has not been opened for writing by\
    \ any process.”\n\n“So, the employee who doesn’t block your calls.” said Seema.\n\
    \n```c\nopen(const char *path, O_WRONLY);\n```\n\nIn this case the `open` call\
    \ will block until a process opens the same FIFO for reading. I don’t have an\
    \ analogy for this.” admitted Lingaraj.\n\n“Your friend is excited to tell you\
    \ that there is a view, but your phone is not reachable.” offered Seema.\n\n“Sounds\
    \ okay. The next one though is a bit strange.\n\n```c\nopen(const char *path,\
    \ O_WRONLY | O_NONBLOCK);\n```\n\nWhat do you think this will do?” asked Lingaraj.\n\
    \n“The employee, because it is `O_NONBLOCK` calls you as soon as there is a view\
    \ and shares the ‘good news’ as you call it.” said Seema.\n"
