  trans: "\n\n“这是 Ranganath 主管家吗？”\n\n“是的，是 Ranganath，政府交通与旅游部的主管。”\n\n“我原以为这种故事仅限于你的感情生活。在感情生活之外，你也没有做过什么大事，”Seema\
    \ 说。\n\n“如果你需要一个文件描述符，你就打开文件。有几种模式可以打开它们。有时候，剧作家只想听听角色的台词，那就是只读模式。这必须在括号内的命令中指定。选项有：\n\
    \n- `O_RDONLY`: 以只读方式打开：（剧作家只想听台词。）\n- `O_WRONLY`: 以只写方式打开（剧作家只提供新台词。不听。）\n- `O_RDWR`:\
    \ 以读写混合方式打开（剧作家既听又提供新台词。）\n\n```c\n#include <fcntl.h>\n#include <sys/types.h>\n\
    #include <sys/stat.h>\nint open(const char *path, int oflags);\nint open(const\
    \ char *path, int oflags, mode_t mode);\n```\n\n`char *path` 是要打开的文件路径。`oflags`\
    \ 参数由上述特殊访问模式 `O_RDONLY`、`O_WRONLY` 和 `O_RDWR` 组成，必须通过位或（`|`）与其他选项一起使用。现在，排练中有很多场景。\n\
    \n让我们来看 `oflags` 参数：\n\n| Flag | Description |\n| :--- | :--- |\n| `O_APPEND`\
    \ | 将数据追加到文件末尾。可能需要追加一组新行。给那家伙多写些台词，特别是如果表现得不错。 |\n| `O_TRUNC` | 将文件截断为零，丢现有内容。这是通过删除给他的所有台词来侮辱并表示他演技不佳的一种方式。\
    \ |\n| `O_CREAT` | 如果必要，则根据 `mode` 中给出的权限创建文件。可能需要创建一个新角色。 |\n| `O_EXCL` | 与 `O_CREAT`\
    \ 使用，确保只创建一个文件实例。如果该文件已存在，则不会创建文件。可能需要创建一个剧书中独一无二的新角色。 |\n\n现在，我们如何找到文件描述符编号呢？`open`\
    \ 系统调用将文件描述符作为正整数返回。如果失败则返回 -1。\n\n当你使用 `O_CREAT` 时，你需要使用以下后续模式。\n\n| Mode | Description\
    \ |\n| :--- | :--- |\n| `S_IRUSR` | 读取权限，所有者 |\n| `S_IWUSR` | 写权限，所有者 |\n| `S_IXUSR`\
    \ | 执行权限，所有者 |\n| `S_IRGRP` | 读取权限，用户组 |\n| `S_IWGRP` | 写权限，用户组 |\n| `S_IXGRP`\
    \ | 执行权限，用户组 |\n| `S_IROTH` | 读取权限，其他人 |\n| `S_IWOTH` | 写权限，其他人 |\n| `S_IXOTH`\
    \ | 执行权限，其他人 |\n\n如果你想指定更多选项，请使用 `|`（位或）选项。稍后我会通过一个程序向你展示它是如何工作的。还有一个 `creat()`\
    \ 系统调用，它是\n\n```c\n#include <sys/types.h>\n#include <sys/stat.h>\n#include <fcntl.h>\n\
    int creat(const char *pathname, mode_t mode);\n```\n\n调用 `creat()` 等同于调用标志等于 `O_CREAT|O_WRONLY|O_TRUNC`\
    \ 的 `open()`。\n\n此外，某些函数会设置这个全局变量 `errno`，并给它一个错误代码。我是这个 `errno` 的粉丝。当你约一个女性出去时，如果她拒绝了，她可以私下里设置\
    \ `errno`。你可以查查看看你为什么被拒绝。有一次我想和 Roshni 出去，并给了她一封带有表格的信。表格包含了 `errno` 这一列。她像往常一样在信中说了“不”。她是一个程序员，知道这个\
    \ `errno` 的概念，也知道我是它的粉丝。所以我去检查了 `errno`，上面写着 `errno`。我接着问她是什么意思。她说：“err……...不！”\n\
    \n“理解 Linux 比理解你容易多了，”Seema 回答道。\n\n“现在，在我们社区，一个戏拥的字符数量限制在 16 个。同样，一个进程同时能打开的文件数量也限制在\
    \ 16 个。这由 `limits.h` 中的 `OPEN_MAX` 定义。这是可以更改的。”\n\n```c\n#include <unistd.h>\n\
    int close(int fildes);\n```\n\n成功返回 0，错误返回 -1。\n\n这就是关闭文件的方法。我会给你展示一个名为 `filecopy.c`\
    \ 的程序。\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <fcntl.h>\n\
    #include <stdlib.h>\nint main(){\n  char c;\n  int in,out;\n  in=open(\"inputfile\"\
    , O_RDONLY);\n  out=open(\"outputfile\", O_WRONLY|O_CREAT,S_IWUSR|S_IRUSR);\n\
    \  while(read(in,&c,1) == 1)\n      {\n      printf(\"%c\",c);\n      write(out,&c,1);\n\
    \      }\nclose(in);\nclose(out);\n  exit(0);\n}\n```\n\n`./filecopy`\n`gcc filecopy.c\
    \ -o filecopy`\n`./filecopy`\n\n"
