    \n- `addr` 是内存中的地址。通常是 0，让内核自行决定。\n- `len` 是内存块的长度。\n- `prot` 是设置权限的：\n    - `PROT_READ`:\
    \ 你可以读取该段。\n    - `PROT_WRITE`: 该段可以写入。\n    - `PROT_EXEC`: 该段可以被执行。\n    - `PROT_NONE`:\
    \ 该段不可被访问。\n`flags` 参数控制对段的更改是否反映到其他地方。当你想让映射的文件与新写入的值进行同步时（或者说，映射的更改会反映到其他地方），这非常有用。\n\
    \n- `MAP_PRIVATE`\n- `MAP_SHARED`\n- `MAP_FIXED`\n\n- `filedes` 是文件描述符。\n- `off_t`\
    \ 是偏移量。\n\n```c\n#include <sys/mman.h>\nint msync(void *addr, size_t len, int\
