    “现在，为了社会的利益，仪式官 Seena 必须传递这些信息。由于协议太昂贵了，我们设立了信使者。就像这些外卖伙伴一样。这些信使者会从人们那里收集信息，最后在晚上把信息交给仪式官
    Seena 打印。这样，大家都很开心。


    所以，这些高层调用就像这些信使者，在不需要太多开销的情况下，以智能的方式让仪式官 Seena 执行。


    有一些 C 库函数可以节省系统开销。它们是：


    | `fopen` |

    | `fclose` |

    | `fread` |

    | `fwrite` |

    | `fflush` |

    | `fseek` |

    | `fgetc` |

    | `getc` |

    | `getchar` |

