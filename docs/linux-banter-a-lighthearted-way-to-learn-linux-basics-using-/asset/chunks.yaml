    the pipe read-only using popen() and the returned file stream is assigned to read_fstr.Check
    if the read_fstr is not NULL. If so,Till NULL is reached or if there is any input,
    enclose this in a loop.{Use fread to read the characters from the FILE stream
    opened by popen. Store it in buffer which is the character array which was declared.If,
    the number of characters read is more than zero,Then print the contents of buffer
    which is the value of the output of the command mentioned in the popen() function.}Close
    the pipe.Exit |


    “I get it.” said Seema.


    “We have a system call:


    | #include <unistd.h>int pipe(int file_descriptor[2]); |


    It takes an array of 2 file descriptors and builds a pipe between them. The data
    written to the file_descriptor[1] can be read back by file_descriptor[0]. Previously,
    we used file streams, but now we use file descriptors, so we have to use read
    and write system calls.”


    “I don’t see anything special here.” Seema commented.


    “This is more helpful if you want to send data between processes.”


    The pipe opens two file descriptors. The first file descriptor in the array is
    the reading end of the pipe and the second file descriptor is the writing end
    of the pipe. Now, you might have some issues with such pipes because a write might
    have closed, but the other process might still be trying to read because it does
    not know the other program has stopped writing. And more importantly, you would
    want to have communication between two programs.


