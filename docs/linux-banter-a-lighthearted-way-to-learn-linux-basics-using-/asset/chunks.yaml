  trans: "\n根据变量的状态，等待资源可用的进程。\n\n根据变量的状态，当资源可用时，进程使用资源进行执行。\n\n进程在完成任务后改变变量的状态。\n\
    \n“在它开始任务之前，进程会改变变量的状态。”\n\n“好的。”\n\n“在医生与电影制作者的案例中，开关是关键。”\n\n“灯泡。” Seema 试图纠正。\n\
    \n“它们是同一个包的一部分。开关随灯泡免费赠。它们必须连接，否则为什么会导致触电呢？”\n\n“不，灯泡必须与开关连接，否则它怎么亮起来？”\n\n“很好的视角。”\n\
    \n现在，来看与信号量相关的系统调用：\n\n```c\nint semget(key_t key, int num_sems, int sem_flags);\n\
    ```\n\n`key` 基本上是资源标识符。\n\n“就像手术室。对手术室的引用。”\n\n“如果有资源 `num_sems` 是信号量的数量。通常为 1。\n\
    \n`sem_flags` 允许你修改行为。上述系统调用可以返回由 `key` 标识的现有信号量的值，或者如果标志为 0。\n\n`sem_flags` 的其他值类似于\
    \ `open()` 中的模式。写入（Write）意味着信号量的值可以被更改。执行权限没有意义。\n\n`sem_flags` 的低 9 位表示权限。\n\n\
    它返回信号量标识符，一个非负整数。如果失败，它会设置 `ERRNO` 并返回 -1。\n\n“就像开关。准确地说是对开关的引用。”\n\n下一个系统调用：\n\
    \n```c\nint semop(int sem_id, struct sembuf *sem_ops, size_t num_sem_ops);\n```\n\
    \n`sem_id` 是 `semget` 返回的内容，即信号量标识符。\n\n`sem_ops` 是指向结构体数组的指针。重要的成员有：\n\n```c\n\
    struct sembuf {\n    short sem_num;\n    short sem_op;\n    short sem_flg;\n}\n\
    ```\n\n`sem_num` 是数量上的信号量编号。如果只有 1 个信号量，则为 0。\n\n`sem_op` 也许是最重要的，因为它是信号量必须改变的值。通常使用的是\
    \ -1 和 +1。\n\n`sem_flag` 被设置为 `SEM_UNDO`，它可以帮助操作系统在进程释放信号量之前终止时释放信号量。\n\n```c\n\
    int semctl(int sem_id, int sem_num, int command, ...);\n```\n\n此系统调用允许你直接控制信号量信息。\n\
    \n第一个参数是 `semget()` 返回的信号量标识符。`sem_num` 再次是数量上的信号量编号。只有 1 个信号量时为 0。\n\n`command`\
    \ 参数可以是：\n\n- `SETVAL`: 用于在开始时将信号量初始化为一个值。\n- `IPC_RMID`: 当你需要在使用后删除信号量时使用。\n\n\
    也存在命名信号量。但我不会深入探讨。\n\n让我们来看一个没有使用信号量的程序：\n\n`seema_loves_yoga.c`\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\nint main(int argc,char\
    \ *argv[]){\n    int i;   \n    pid_t pid;\n    pid = fork();\n    if(pid < 0)\n\
    \    {\n        printf(\"Fork failed.\\n\");\n        exit(1);\n    }\n    else\
    \ if(pid == 0)\n    {\n        char *ca1 = \"Vijay\";\n        char *ca2 = \"\
    loves football\";\n        puts(ca1);\n        fflush(stdout);\n    }\n    else\n\
    \    {\n        char *ca1 = \"Seema\";\n        char *ca2 = \"loves yoga\";\n\
    \        puts(ca1);\n        fflush(stdout);\n    }\n}\n```\n"
- fmt: "\nA part of the output is printed after 4 because the parent process finishes\
    \ before the child.\n\nYou might wonder no real communication is happening. No\
    \ messages were exchanged. But if you notice, coordination is happening with respect\
    \ to time. And that is good enough for it to be called Interprocess Communication.\n\
    \n# IPC : Shared Memory\n\nLingaraj said,\n\n“Think of the example I gave where\
    \ we would be putting a cocktail recipe in a particular location near the rocks.\
    \ The knock out rocks. You can even allow other processes to access the memory\
    \ location. I also told you it was useful because whenever we put it on those\
    \ stones and come back to collect it, there would be more recipes added by people\
    \ who would have experimented the previous night.\n\n![](image_rsrc84T.jpg)\n\n\
    The recipe paper can be thought of as the memory. And information is shared between\
    \ the drunkards and we through this sheet. This is faster than creating pipes\
    \ or fifos. Here care should be taken to see to it that no two processes are writing\
    \ at the same time.\n\nThe system calls are:\n\n```c\n#include <sys/shm.h>\nint\
    \ shmget(key_t key, size_t size, int shmflg);\n```\n\nThe `key_t` `key` is the\
    \ name of the memory segment. You can use a `#define` to define a key, but this\
    \ key has to be known by both the processes to facilitate Inter Process Communication.\n\
    \nThe value `IPC_PRIVATE` makes the shared memory private to the process. When\
    \ I was down in life, I wanted to share my stories. But I could find no one. So,\
    \ it used to be an `IPC_PRIVATE` situation.\n\n“That’s sad.”\n\n“It was, until\
    \ I started visiting the knock out rocks.”\n\n“No, it’s not a joke. You have told\
    \ me so many stories about yourself. They are sad stories, but you make them sound\
    \ funny. I laughed, I was amused, I was taken aback and I was surprised at some\
    \ of your stories. I am not a psychoanalyst but I am human and I want to tell\
    \ you that I admire the guy who is brave enough to laugh at himself. I am missing\
    \ Vijay in this situation, but in you I have found an ally, a friend and a teacher.\
    \ I have enormous respect for you. According to family tradition, when we get\
    \ married, there’s this ceremony where the bride’s brother welcomes the guests\
