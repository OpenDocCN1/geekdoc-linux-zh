  trans: "\nSeema 这辈子从没听过这种胡话。但 Lingaraj 说得听起来是那么有说服力。\n\n“我们继续下一个话题吧，”Seema 说。\n\n\
    “你可以使用系统调用或 C 库函数。系统调用是昂贵的。”\n\n“在哪个意义上昂贵？”\n\n“以前有一个叫作‘仪式大师 Seena’的家伙。每当我们以前叫他时，他都会带着车队和随从过过来。邀请他有一套庞大的仪式，接待他也有一套礼仪。\n\
    \n他住在连接所有道路的主干道上。他的随从会让道路堵塞几个小时。他是一个关系很广的人，与权力高层的人接触。如果有信息需要传给那些权人物，人们必须找他。但每当有人叫他时，他就会举行一场盛大的仪式。我们还得款待他、款待他的随者等等。我们必须在工作和照顾他之间来回。这些都是开销。所以，后来人们发明了这些方法，只叫他一次，然后一次性完成所有任务。系统调用就像叫\
    \ Seena。非常昂贵。但让人们处理细节并完成他所有的工作，就像是高级访问。所以，我们为这些提供了 C 库函数。\n\n一个例子是标准 I/O 库。你可能有处理数据块的数据存储。标准\
    \ I/O 库会为发送到存储的数据量身定制，即使它是一个不是按数据块写入的文件。\n\n那么，你如何发现一个调用是系统调用还是函数呢？\n\nC 库函数在\
    \ man pages（帮助手册）的第 3 节。第 2 节是系统调用。\n\n所以，如果你输入\n\n```\n$ man 2 fopen\n```\n\n\
    它会显示\n\n```\nNo manual entry for fopen in section 2\n```\n\n然而，如果你输入\n\n```\n\
    $ man 3 fopen\n```\n\n它会显示 `fopen` 的条目。\n\n在剩下的时间里，我使用“C 库函数”这个术语对 C 库函数称为“function”。对于程序内部的函数（例如例程），我直接用\
    \ function。你必须识别我谈论的是 C 库函数还是例程。\n\n### 文件描述符 (File Descriptors)\n\n“你太想在 Vijay\
    \ 的系统中打开一些文件了。”\n\n“并且向它们写数据。”\n\n“你需要文件描述符来实现这一点。”\n\n“文件描述符是什么？”\n\n“它是一个与文件关联的整数。它和\
    \ inode（索引节点）有什么区别？inode 是一个包含文件信息的结构。文件描述符用于系统调用。它被系统用来引用一个已打开的文件。”\n\n然后他向她展示了一个程序。\n\
    \n`writestd.c`\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n\
    int main(){\n    if ((write(1, “Standard output’s file descriptor is 1”, 38))\
    \ != 38)\n        write(2, “Error writing to even standard output.”,39);\n   \
    \ exit(0);\n}\n```\n\n上述程序的作用是尝试将 `write` 指定的第一条消息“Standard output’s file descriptor\
    \ is 1”写入文件描述符为 1 的标准输出。该字符串不包括双引号有 38 个字符。它返回写入的字节数。每个字符一个字节。如果所有字节都没有写成功，它就会移动到下一行，并将错误信息“Error\
    \ writing to even standard output.”打印到标准错误，其文件描述符为 2。标准输入的文件描述符是 0。\n\n`readinp.c`\n\
    \n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\nvoid main(){\n\
    \    printf(“Please input some text.\\n”);\n    char readinp[128];\n    read (0,\
    \ readinp, 17);\n    printf(\"%s\", readinp);\n}\n```\n\n上述程序从标准输入读取 17 个字符，这发生在你运行程序后输入内容时。然后它会立即打印你输入的前\
    \ 17 个字符。所以，`read` 和 `write` 系统调用的语法如下：\n\n```c\n#include <unistd.h>\nsize_t read(int\
    \ fildes, void *buf, size_t nbytes);\n#include <unistd.h>\nsize_t write(int fildes,\
    \ const void *buf, size_t nbytes);\n```\n\n`<unistd.h>` 是一个头文件。头文件包含声明和宏。与可以执行工作的库不同，它不包含实现代码。它只是简单调用执行工作的函数。你可能想过，在某些组织中，有些头目不干活，但认识人，特别是那些在图书馆学习的人，可以工作，尽管头目自己对实现一无所知。我说这些是为了帮助你记忆。你可以写自己的头文件，但如果你想包含它，可以使用\n\
    \n```c\n#include “myheaderfile.h”\n```\n\n### 系统调用与内核 (System Calls and the Kernel)\n\
    \n内核并不是对所有人免费开放。它是非常保留的，只分配了一部分给用户来使用系统。但有时你需要内核来执行某些操作。这些操作可能是进程控制、文件或设备管理等。用户没有胆量自己修改这些东西。他们需要请求内核的支持，而内核根据其规则允许程序执行这些操作。因此，这种模式被称为监督模式（supervisor\
    \ mode）或内核空间（kernel space），因为涉及到内核的监督。\n\n每个系统调用 `read` 或 `write` 返回读取的字节数。`filedes`\
    \ 是文件描述符。`buf` 是指向内容的指针，`nbytes` 是字节数。在 `read` 中内容放入 `buf` 指向的字符串，而在 `write` 中这可以是一个实际的字符串。Seema\
    \ 习惯了这种不可预测性。\n\n他们骑着自行车沿着 Seema 通往营地的路。\n\nimage_rsrc84G.jpg\n\n他们到达了一个泥房建筑和一个露天剧场。那里大约\
    \ 20 个人。Lingaraj 向 Seema 介绍了导演 Nithin 和几位演员。然后他们看了排练。\n\n“注意，”Lingaraj 说。\n\n\
    演员 Prashanth 进入了“Odubari”的角色。这是一个关于学术的角色。然后编写剧本并担任的 Nithin 对剧本做了一些修改。他用角色名“Odubari”叫了演员，角色说了台词。\n\
    \nimage_rsrc84H.jpg\n\nLingaraj 压低声音对 Seema 说：“现在，戏剧中的每个角色一旦进入状态，就有一个角色名字。”\n\n\
    导演 Nithin 随后用 Prashanth 的名字叫了他。\n\nLingaraj 继续道：“可以说是一个文件描述符。剧本作者打开这个文件，通过叫他的名字来读取台词，甚至增加了一些台词。尽管这些台词是给角色的，但\
    \ Prashanth 在现实生活中记住了它们。这就像读和写操作。\n\n所以，如果这有助于你记忆：\n\n人 Prashanth。一个普通文件。\n\n\
    作为‘Odubari’的 Prashanth。一个描述符。\n\n使用角色名来写入、追加或删除台词等可以类比于 `read()` 和 `write()` 系统调用。”\n\
    \nLingaraj 借此讲述了生活中的另一个故事。\n\n“以前我在城市时，我想过演部戏。我在网上看到一个 Ranganath 发出的选角通知。我打了一辆三轮车，告诉司机我想去\
    \ Ranganath 的家以及他所在的区域。他们通过邮件发送了选角台词，我在三轮车上进行了练习。然后我到达了一座带草坪的大房子。”\n\nimage_rsrc84J.jpg\n\
    \n一群人冲过来开始打我。我设法把问题。\n\nimage_rsrc84K.jpg\n"
- fmt: "\n‘Is this Director Ranganath’s house?’\n\n‘Yes, Ranganath, the director of\
    \ the Transport and Travel department of the Government.’”\n\n“I thought such\
    \ stories were limited to your love life. Outside of your love life too, you have\
    \ not done great.” said Seema.\n\n“If you need a file descriptor, you need to\
    \ open the file. There are several modes you can open them. Sometimes the dialogue\
    \ writer wants to simply listen to the character’s dialogue, that is read-only.\
    \ This has to be specified in the command within the parenthesis. The options\
    \ are :\n\n- `O_RDONLY`: Open for read-only : (Dialogue writer wants to only listen.)\n\
    - `O_WRONLY`: Open for write-only (Dialogue writer just gives the new dialogue.\
    \ Doesn’t listen.)\n- `O_RDWR`: Open for reading and writing (Dialogue writer\
    \ both listens and gives new dialogues.)\n\n```c\n#include <fcntl.h>\n#include\
    \ <sys/types.h>\n#include <sys/stat.h>\nint open(const char *path, int oflags);\n\
    int open(const char *path, int oflags, mode_t mode);\n```\n\nThe `char *path`\
    \ is the path of the file to be opened. The `oflags` parameter consists of the\
    \ above special access modes `O_RDONLY`, `O_WRONLY` and `O_RDWR` have to be used\
    \ along with other options by ‘OR’ing (`|`) with other flags. Now, there are many\
    \ scenarios in the rehearsal.\n\nLet’s look at the `oflags` parameter:\n\n| Flag\
    \ | Description |\n| :--- | :--- |\n| `O_APPEND` | Appends data to the end of\
    \ the file. A new set of lines might need to be appended. Give the guy more dialogues,\
    \ especially if he’s doing good. |\n| `O_TRUNC` | Cut the file to zero, discarding\
    \ existing content. This is one way to insult and say a guy’s not good at acting\
    \ by removing all the lines given to him. |\n| `O_CREAT` | Creates the file, if\
    \ necessary, with permissions given in `mode`. A new character might have to be\
    \ created. |\n| `O_EXCL` | Used with `O_CREAT`, to make sure that only one instance\
    \ of a file is created. If that file is already created, it won’t create a file.\
    \ A new character like no other in the play might need to be created. |\n\nNow,\
    \ how do we find out the file descriptor number. The `open` system call returns\
    \ the file descriptor as a positive integer. -1 if it fails.\n\nWhen you use `O_CREAT`,\
    \ you need to use the following further modes.\n\n| Mode | Description |\n| :---\
    \ | :--- |\n| `S_IRUSR` | Read permission, owner |\n| `S_IWUSR` | Write permission,\
    \ owner |\n| `S_IXUSR` | Execute permission, owner |\n| `S_IRGRP` | Read permission,\
    \ group |\n| `S_IWGRP` | Write permission, group |\n| `S_IXGRP` | Execute permission,\
    \ group |\n| `S_IROTH` | Read permission, others |\n| `S_IWOTH` | Write permission,\
    \ others |\n| `S_IXOTH` | Execute permission, others |\n\nIf you want to specify\
    \ more options, use the `|` (pipe OR) option. I will show you how it works in\
    \ a program in a little while. There is also the `creat()` system call which is\n\
    \n```c\n#include <sys/types.h>\n#include <sys/stat.h>\n#include <fcntl.h>\nint\
    \ creat(const char *pathname, mode_t mode);\n```\n\nA call to `creat()` is equivalent\
    \ to calling `open()` with flags equal to `O_CREAT|O_WRONLY|O_TRUNC`.\n\nAlso,\
    \ some functions set this global variable, `errno`, giving it an error number.\
    \ I am quite a fan of this `errno`. When you ask a woman out, if she refuses,\
    \ she can set the `errno` privately. You can look it up and see why you were rejected.\
    \ Once I wanted to go out with this woman, Roshni and gave her a letter with a\
    \ form. The form included the `errno` column. She said ‘no’ as usual in the letter.\
    \ She was a programmer and knew this concept of `errno` and that I was a fan of\
    \ it. So I went and checked `errno`, it was written `errno`. I then asked her\
    \ what it meant. She said ‘err…...no!’”\n\n“It is easier to understand Linux than\
    \ understand you.” replied Seema.\n\n“Now, the number of characters a play can\
    \ have in our community is limited to 16. Same way, the number of files one process\
    \ can open at a time is limited to 16. It is defined by `OPEN_MAX` in `limits.h`.\
    \ This can be changed.”\n\n```c\n#include <unistd.h>\nint close(int fildes);\n\
    ```\n\n0 on success -1 on error.\n\nThis is how you close a file. I will show\
    \ you a program named `filecopy.c`.\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n\
    #include <fcntl.h>\n#include <stdlib.h>\nint main(){\n  char c;\n  int in,out;\n\
    \  in=open(\"inputfile\", O_RDONLY);\n  out=open(\"outputfile\", O_WRONLY|O_CREAT,S_IWUSR|S_IRUSR);\n\
    \  while(read(in,&c,1) == 1)\n      {\n      printf(\"%c\",c);\n      write(out,&c,1);\n\
    \      }\nclose(in);\nclose(out);\n  exit(0);\n}\n```\n\n`./filecopy`\n`gcc filecopy.c\
    \ -o filecopy`\n`./filecopy`\n"
  raw: '‘Is this Director Ranganath’s house?’


    ‘Yes, Ranganath, the director of the Transport and Travel department of the Government.’”


    “I thought such stories were limited to your love life. Outside of your love life
    too, you have not done great.” said Seema.


    “If you need a file descriptor, you need to open the file. There are several modes
    you can open them. Sometimes the dialogue writer wants to simply listen to the
    character’s dialogue, that is read-only. This has to be specified in the command
    within the parenthesis. The options are :


    O_RDONLY Open for read-only : (Dialogue writer wants to only listen.)


    O_WRONLY Open for write-only (Dialogue writer just gives the new dialogue. Doesn’t
    listen.)


    O_RDWR Open for reading and writing (Dialogue writer both listens and gives new
    dialogues.)


    | #include <fcntl.h>#include <sys/types.h>#include <sys/stat.h>int open(const
    char *path, int oflags);int open(const char *path, int oflags, mode_t mode); |


    The char *path is the path of the file to be opened. The ‘oflags’ parameter consists
    of the above special access modes O_RDONLY, O_WRONLY and O_RDWR have to be used
    along with other options by ‘OR’ing (|) with other flags. Now, there are many
    scenarios in the rehearsal.


    Let’s look at the oflags parameter:


    | O_APPEND | Appends data to the end of the file. A new set of lines might need
    to be appended. Give the guy more dialogues, especially if he’s doing good. |


    | O_TRUNC | Cut the file to zero, discarding existing content. This is one way
    to insult and say a guy’s not good at acting by removing all the lines given to
    him. |


    | O_CREAT | Creates the file, if necessary, with permissions given in mode. A
    new character might have to be created. |


    | O_EXCL | Used with O_CREAT , to make sure that only one instance of a file is
    created. If that file is already created, it won’t create a file. A new character
    like no other in the play might need to be created. |


    Now, how do we find out the file descriptor number. The open system call returns
    the file descriptor as a positive integer. -1 if it fails.


    When you use O_CREAT, you need to use the following further modes.


    | S_IRUSR | Read permission, owner |


    | S_IWUSR | Write permission, owner |


    | S_IXUSR | Execute permission, owner |


    | S_IRGRP | Read permission, group |


    | S_IWGRP | Write permission, group |


    | S_IXGRP | Execute permission, group |


    | S_IROTH | Read permission, others |


    | S_IWOTH | Write permission, others |


    | S_IXOTH | Execute permission, others |


    If you want to specify more options, use the | (pipe OR) option. I will show you
    how it works in a program in a little while. There is also the creat() system
    call which is


    | #include <sys/types.h>#include <sys/stat.h>#include <fcntl.h>int creat(const
    char *pathname, mode_t mode); |


    A  call  to creat() is equivalent to calling open() with flags equal to


    O_CREAT|O_WRONLY|O_TRUNC.


    Also, some functions set this global variable, ‘errno’ giving it an error number.
    I am quite a fan of this ‘errno’. When you ask a woman out, if she refuses, she
    can set the ‘errno’ privately. You can look it up and see why you were rejected.
    Once I wanted to go out with this woman, Roshni and gave her a letter with a form.
    The form included the ‘errno’ column. She said ‘no’ as usual in the letter. She
    was a programmer and knew this concept of ‘errno’ and that I was a fan of it.
    So I went and checked ‘errno’, it was written ‘errno’. I then asked her what it
    meant. She said ‘err…...no!’”


    “It is easier to understand Linux than understand you.” replied Seema.


    “Now, the number of characters a play can have in our community is limited to
    16\. Same way, the number of files one process can open at a time is limited to
    16\. It is defined by OPEN_MAX in limits.h. This can be changed.”


    | #include <unistd.h>int close(int fildes); |


    0 on success -1 on error.


    This is how you close a file. I will show you a program named ‘filecopy.c’.


    | #include <stdio.h>#include <unistd.h>#include <fcntl.h>#include <stdlib.h>int
    main(){  char c;  int in,out;  in=open("inputfile", O_RDONLY);  out=open("outputfile",
    O_WRONLY&#124;O_CREAT,S_IWUSR&#124;S_IRUSR);  while(read(in,&c,1) == 1)      {  ​printf("%c",c);  ​write(out,&c,1);      }close(in);close(out);    exit(0);}
    |


    This uses the system call to copy from the inputfile (which is about 3.5MB) to
    the outputfile (which as of now does not exist), character by character, excruciatingly.
    This is like calling ceremony Seena to pass on a message and every time he comes,
    you tell him only one character of the message.


    Compile the program using gcc.


    | $ gcc filecopy.c -o filecopy |


    You can measure how much time this program took by using the time command on the
    command line.


    | $ time ./filecopy |


    The output was displayed after some time.


    | real​0m16.305suser​0m3.948ssys​0m12.353s |


    “Maybe character by character is a wrong idea.” observed Seema.


    “Yes, we did that as a lesson to him, thinking he would be exasperated, but he
    loved all the protocol nonsense.


    If we change the read call to read and write in blocks, the speed will be boosted.


    Just add this :


    | char word[1024];while((nread = read(in,&word,sizeof(word))) > 0)write(out,&word,nread);
    |


    So, the program would look like this.


    filecopy_new.c


    | #include <stdio.h>#include <unistd.h>#include <fcntl.h>#include <stdlib.h>int
    main(){  char c;  int in,out, nread;  in=open("inputfile", O_RDONLY);  out=open("outputfile",
    O_WRONLY&#124;O_CREAT,S_IWUSR&#124;S_IRUSR);  char word[1024];  while((nread =
    read(in,&word,sizeof(word))) > 0)  write(out,&word,nread);  exit(0);} |


    The next system call we talk about is the ‘lseek’ call.


    | #include <unistd.h>#include <sys/types.h>off_t lseek(int fildes, off_t offset,
    int whence); |


    ‘lseek’ points to a place in the file. So, offset is the distance from a point.
    And the offset is described with whence. The options for whence are :


    | SEEK_SET | offset is an absolute position |


    | SEEK_CUR | offset is relative to the current position |


    | SEEK_END | offset is relative to the end of the file |


    It’s like the dialogue writer can say, let’s go to the 5th dialogue, or the 3rd
    dialogue from where we were, or the penultimate dialogue.


    ‘lseek’ returns the distance from the beginning of the file in terms of bytes.


    Here are some calls that tell you about files.


    | #include <unistd.h>#include <sys/stat.h>#include <sys/types.h>int fstat(int
    fildes, struct stat *buf);int stat(const char *path, struct stat *buf);int lstat(const
    char *path, struct stat *buf); |


    If you know the file descriptor, you can use ‘fstat’ to find out more info. If
    you know the path, use ‘stat’. And if the file is a link, use ‘lstat’ to get information
    about the link. Now, what is this information? It is a structure with the following
    components.


    Here it is.


    | st_mode |


    | st_ino |


    | st_dev |


    | st_uid |


    | st_gid |


    | st_atime |


    | st_ctime |


    | st_mtime |


    | st_nlink |


    Now, suppose you are programming a part of Vijay’s brain and you feel there’s
    too much data, then you can take the help of your friend.


    There’s the dup() system call where you can duplicate the file descriptor and
    get another file descriptor number for the same file. The number is the lowest
    available number which is free. This way, you can give another process the method
    to alter the file. You can work on one part and your friend on another.


    “Well, all my friends are busy. So I will go at it alone. Thanks.”


    “dup2 makes one file descriptor like another, but rather than using the lowest
    number, it uses a new number specified by you .” finished Lingaraj and showed
    her the calls.


    | #include <unistd.h>int dup(int fildes);int dup2(int fildes, int fildes2); |


    Lingaraj continued.'
