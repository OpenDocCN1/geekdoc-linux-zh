    “Programs loaded at run time like a device driver. A device driver is a program
    that talks to the device like a printer or a scanner or an external hard drive.”


    Lingaraj looked into the distance.


    “Something bothering you?” asked Seema.


    “I fell in love with a librarian once when I was reading Linux programming in
    the library.

    I went and told her, ‘Ever since I saw you, my circulation has stopped. I have
    booked two tickets to the movie.’


    ![](image_rsrc83E.jpg)


    She said ‘Return them.’”


    Seema did not know what to do. Over time, she would get used to Lingaraj’s anecdotes.


    “Anyway, let me just mention them.


    `/proc`


    The filesystem created on the go. A control and information centre for the kernel.
    This is where you go if you need information. For example,


    ```bash

    $ cat /proc/cpuinfo

    ```


    Will give you information about the CPU.”


    Lingaraj pointed to some people who were sitting and gossiping.


    ![](image_rsrc83F.jpg)


    “Let me tell you a story. There are a lot of ladies and gentlemen who sit outside
    and they know practically everything about our community. In fact when someone
    wants to make a marriage alliance, they ask this group about the man’s character.
    This was a long time ago, before we had heard of mobile phones.


    There is another community in an island. There, they are not in touch with the
    world and don’t know of any technological advancements.


    ![](image_rsrc83G.jpg)


    They were ruled by a King. I thought since I possessed a hair dryer, I thought
    I would take it to him and impress him. I had heard he had a daughter. So, I took
    this perilous journey that took 4 weeks and went to the island.


    ![](image_rsrc83H.jpg)


    I was roaming around in modern clothes and soon I was captured. This was part
    of my plan. I was taken to the King.


    ![](image_rsrc83J.jpg)


    ‘Are you an alien?’ the King asked me.


    ‘I come from afar and now I will stun you.’ I said.


    I asked for a bucket of water which they provided.


    ![](image_rsrc83K.jpg)


    I then threw it at the King and he was drenched. He was very angry.


    ‘I know you are angry. But I will dry you in an instant.’ I said.


    ![](image_rsrc83M.jpg)


    ‘If you don’t do that, I will drench you in your blood.’ shouted the King.


    ‘Okay, this magical device here that I invented…’


    ![](image_rsrc83N.jpg)


    I took out the hairdryer.


    ‘Where’s the power point for this?’ I asked.


    ‘What bloody power point?’


    ‘Oh I see!’


    ![](image_rsrc83P.jpg)


    The King took out his sword.


    I closed my eyes. Those people didn’t have electricity.


    Then, as the King approached near and was about to use his sword,


    ![](image_rsrc83R.jpg)


    these people came and saved my life. They had brought solar powered batteries.


    I took the batteries in a hurry and used the hairdryer to dry him. He was mollified.
    He asked me to stay back and I told him I would bring more such amazing things.


    “What an adventure! Is this really true?”


    Lingaraj continued, ignoring the question.


    “Well, these people tell every alliance that comes for me, this story and they
    laugh at me.”


    “Is the King still around?” asked Seema.


    “No, he died in his bath tub from electrocution while using a hairdryer.


    Anyway, these people, they are like these control rooms, they know everything,
    like what I was up to in the island, etc.


    `/root`


    The superuser’s home directory.


    `/sbin`


    Essential system binaries, for whom superuser credentials are required.


    `/tmp`


    Temporary files.” explained Lingaraj.


    “Temporary files. Not important, I think.” said Seema.


    “Look at our world. The whole world is stored in a temporary directory. Very important.


    `/usr`


    The base directory for shareable and read only data.


    `/usr/include`


    Header files for compiling c programs.


    `/usr/lib`


    Libraries for most binary programs.


    `/usr/sbin`


    Non vital system binaries.


    `/usr/share`


    Architecture independent data.


    `/usr/src`


    The source code.


    `/usr/x11r6`


    The x window system.


    `/var`


    Variable data like email , printer logs, etc.”


    “Is there a heart directory? I want to look in to that in Vijay’s system and see
    if any traces of me are there.” Seema said sadly.


    “A rhetorical question, I assume. If I put you in a maze, how would you get out?”


    “I would begin by knowing where I am.”


    “In a Linux system, how would you do that?”


    “I don’t know. Ask the system where I am.”


    “What’s the `pwd` command?”


    “It shows the personal working directory, in this case, your love letter directories.
    I saw it.”


    “No, it’s print work directory. The directory that you are now in. So, if you
    are stuck in a maze of directories, somewhere and don’t know where you are, you
    type `pwd`. And if you want to go back home, it’s simple. Type


    ```bash

    $ cd |

    ```


    And if you want to go to some other directory, the `/usr/lib` for instance,


    ```bash

    $ cd /usr/lib

    $ cd ..

    ```

    takes you one level up in the directory structure.


    I will now list some commands and explain them.


    ```bash

    $ file textfile

    ```

    Says what kind of a file it is. Whether a directory or a C source file, or an
    executable or a text file, etc.


    ```bash

    $ cat textfile

    ```

    The `cat` command displays the contents of a file.”


    Again Lingaraj was disturbed. Seema by now had learnt he would have a story to
    say. And she was willing to bet her last rupee it was going to be a sad story.


    “There was this girl, Billy in the city. One day, as her cat was trying to cross
    the road, a guy on a bike desperate to cross the road before the cat crossed his
    path sped and almost killed the cat. I took the cat to a vet and I saved the cat’s
    life. I felt heroic and special. Billy and I became friends. One day, I went and
    told her, ‘Let’s concatenate our lives.’


    ‘You are in a queue because there are eight other people who have saved the cat’s
    life, because a cat has 9 lives.’”


    “Why do you bring up these stories of love disappointment? You have to delete
    them and move on.” said Seema.


    “Which brings us to the next set of commands. `rm` and `mv`. `rm`, removes a file
    and `mv` moves the file to another location.”


    “OK, `rm Billy`. `mv /home/Lingarajlovefiles to /newprospect`” said Seema enthusiastically.


    Further, Seema typed


    ```bash

    $ rm Billy$ mv /home/Lingarajlovefiles to /newprospect

    ```


    “There is no `/newprospect` directory.” said Lingaraj.


    “So let’s create it. What’s the command to make a new directory?”


    `mkdir` replied Lingaraj.


    Seema then typed.


    ```bash

    $ mkdir /newprospect$ mv /home/Lingarajlovefiles /newprospect

    ```


    I am assuming `rmdir` removes the directory.”


    “Yes” replied Lingaraj.


    “Let’s find all your failure files. Is there a command for that?” Seema asked.


    They opened Lingaraj’s personal directory on the system.


    “Now, if we use `grep` and a pattern, in this case ‘failure’, it will list all
    the files among the 44 which have ‘failure’ in them.” said Lingaraj. He typed.


    ```bash

    $ grep “failure” /home

    ```


    As luck would have it, all the names of the 44 files were displayed.


    “Even the law of averages fail.” quipped Seema.


    “Pipe it with more.” instructed Lingaraj.


    “You want to see more of this?”


    “Okay, type `less`. To see the contents of a file in a comfortable way. `more`
    or `less` work the same way more or less.”


    Seema saw the contents of a file and was reading it with some interest when Lingaraj
    interrupted.


    “I don’t want to see it, let’s clear the screen. Type `clear’.”


    Seema typed


    ```bash

    $ clear

    ```

    The screen was immediately cleared.


    “This clears the screen, not my fortune though.


    `lpr` Prints the file or program output to a printer.


    `ps` Lists all the processes


    `w` Shows who’s logged in and what they are doing.


    So, if you want to see if anybody else is trying to get to Vijay and alter him
    or command him, you can find out.” said Lingaraj.


    “You are making me panic.”


    “If it helps, there’s a kill process as well where you can kill the process. Only
    the process, mind you. I will tell you about this later.


    ```bash

    $ cat /proc/cpuinfo

    ```

    Reveals the information about the CPU.


    ```bash

    $ top

    ```

    Displays the cpu processes


    ```bash

    $ cat/proc/meminfo

    ```

    Displays what’s in the memory. A good place to see if you are still there in Vijay’s
    mind.”

