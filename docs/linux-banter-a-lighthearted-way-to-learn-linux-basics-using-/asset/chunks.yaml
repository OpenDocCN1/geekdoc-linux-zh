  trans: "\n“所以，我想要更多的控制权。此外，我发现开销非常大。我必须共享我的品牌标识、网站等。因此，我关闭了特许经营体系，并开始开设分公司。当然，这并不是一种经营之道。这只是我个人的情况。”\n\
    \n“我不知道你为什么要告诉我这些。”\n\n“第一个案例，即我过去在在那里建立一个小规模运营，类似于在程序中调用一个函数。我的进程独立管理了它。\n\n\
    第二个案例是我给出特许经营权，这是创建了另一个进程，比如通过调用 `fork`。大量的信息必须被复制。\n\n第三个案例是开设分公司。只共享了信息而没有复制。这就像执行一个线程（thread）。\n\
    \n线程是程序的一部分，会执行多次，但不是作为函数。如果你同时处理两个文件，对于 `kernel` 来说，使用函数并作为单体块运行是很繁琐的。它可以让代码的另一个实例运行，但不是作为那种所有内容都复制的进程。在线程执行中，运行的程序拥有它自己的栈（stack），新的执行线程也拥有自己的栈，因此拥有局部变量。但它与创建它的进程共享（请注意不是复制，而是共享）全局变量、文件描述符、信号处理程序以及当前目录状态。\n\
    \n所以，虽然特许经营店有自己的财务账目、工资，但分公司共享财务账目。进程是复制，而线程是共享，且复制涉及更多资源。”\n\n“是的，现在是‘重入’（reentrant）代码。重入函数是指可以运行、被中断然后再次运行的函数。\n\
    \n同一个程序可以在不同实例中复用，一个实例的变量值对其他实例可能无效。所以，如果一个程序改变了变量的值并被再次调用，它不会记得它旧的那组值。它会采用调用程序发送的值。\n\
    \n在我们的社区，饮酒年龄是 21 岁。有一次我朋友的父亲是一位历史老师 Ritesh，他坚持习俗就像 sambhar 汤坚持衬衫一样，他曾是一家酒吧的老板。这没什么问题，除了他从不让我们进入酒吧。他经常喝醉，当我们出现在酒吧门前时，对话是这样的。\n\
    \n![](img/image_rsrc859.jpg)\n\n‘哦，Lingaraj。你好吗？’他以前常这样问。\n\n‘我很好，先生。我编程得不错，而且……’\n\
    \n‘我是想问，你多大了？’\n\n‘25 岁，叔叔。’\n\n‘别骗我。你 20 岁。我记得你这么告诉我的。’\n\n‘那是 5 年前的事了，先生。’\n\
    \n‘那又怎样？记录就是记录。出去吧。’\n\n他不符合重入程序的条件。他所做的唯一重入就是进入酒吧续杯。所以，重入函数会为各种实例进行更新。\n\n它基本上意味着，只对调用者提供的数据进行操作。\n\
    \n```c\n#include <pthread.h>\nint pthread_create(pthread_t *thread, pthread_attr_t\
    \ *attr, void*(*start_routine)(void *), void *arg);\n```\n\n成功返回 0。\n\nC 库函数 `pthread_create()`\
    \ 方便程序作为线程运行。它有一个名称，让你除函数名之外可以标识线程。它由 `pthread_t *thread` 提供。它的类型是 `pthread_t`。\n\
    \n`pthread_attr_t *attr` 是一个属性，我稍后会解释。\n\n`void *(*start_routine)(void *), void\
    \ *arg` 是作为线程运行的程序，`arg` 是它的参数。\n\n```c\n#include <pthread.h>\nvoid pthread_exit(void\
    \ *retval);\n```\n\n这会退出线程。与函数不同，你不能返回一个变量。因为……？”\n\n“变量在线程结束后就消失了。”\n\n“正确。”\n\
    \n```c\n#include <pthread.h>\nint pthread_join(pthread_t th, void **thread_return);\n\
    ```\n\n这个 C 库函数类似于进程中的 `wait` 系统调用。在这里，`pthread_t th` 代表程序标识符，记得 `pthread_create`\
    \ 吗？\n\n它返回一个指向线程返回值的指针。\n\n他在笔记本电脑上打开了一个文件。\n\n`thread_program.c`\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n\
    #include <unistd.h>\nvoid *print_func(char* message){\n   printf(\"%s - Before\
    \ sleep\\n\", message);\n   sleep(4);\n   printf(\"%s - After waking up\\n\",\
    \ message);\n}\nint main(){\n  pthread_t t1, t2;\n  printf(\"Main program now\
    \ running\\n\");\n  pthread_create(&t1, NULL, (void *)print_func, (void *) \"\
    First call to pthread\");\n  pthread_create(&t2, NULL, (void *)print_func, (void\
    \ *) \"Second call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2,\
    \ NULL);\n  printf(\"Back to main after thread join\\n\");\n}\n```\n\n然后他继续了解释。\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
    \ <pthread.h>\n#include <unistd.h>\nvoid *print_func(char* message){\n   printf(\"\
    %s - Before sleep\\n\", message);\n   sleep(4);\n   printf(\"%s - After waking\
    \ up\\n\", message);\n}\n```\n\n上面的代码声明了所需的头文件，并在睡眠前和后打印两条消息。这是将被两个调用调用的程序。上面的函数稍后会在程序中被调用两次。\n\
    \n```c\nint main(){\n    pthread_t t1, t2;\n```\n\n线程被声明了。\n\n```c\n   printf(\"\
    Main program now running\\n\");\n```\n\n仅仅是一个指示。\n\n```c\npthread_create(&t1,\
    \ NULL, (void *)print_func, (void *) \"First call to pthread\");\npthread_create(&t2,\
    \ NULL, (void *)print_func, (void *) \"Second call to pthread\");\n```\n\n创建线程。\n\
    \n为了区分运行的同一个函数的两个实例，我们在每个实例中传递给函数了不同的消息。这样，你就可以看到是哪个线程在运行。\n\n如上所示，创建了调用 `print_func`\
    \ 函数的线程，并且每次都传递了不同的消息。通常，传递值的最佳方法是使用 `pthread_create` 向线程传递一个结构体（struct）。它的形式如下：\n\
    \n`struct thread_args *args`\n\n```c\n  pthread_join(t1, NULL);\n  pthread_join(t2,\
    \ NULL);\n  printf(\"Back to main after thread join\\n\");\n}\n```\n\n仅仅是一个告诉我们已经回到了主程序的指示。\n\
    \n“那么，你认为输出会是什么？”Lingaraj 问道。\n\n“我认为它会先打印第一个调用的，然后是第二个。像这样：\n\nMain program now\
    \ running\n\nFirst call to pthread - Before sleep\n\nFirst call to pthread - After\
    \ waking up\n\nSecond call to pthread - Before sleep\n\nSecond call to pthread\
    \ - After waking up\n\nBack to main after thread join\n\n当然，还有 4 秒的睡眠延迟。”Seema\
    \ 说。\n\nLingaraj 继续使用运行程序：\n\n```bash\ncc -D_REENTANT thread_program .c -lpthread\n\
    ```\n\n“你需要这样编译：\n\n```bash\ncc -D_REENTANT thread_program .c –o thread_program\
    \ -lpthread\n```\n\n如果 `NPTL`(Native Posix Threads Library）是你系统的默认设置，”Lingaraj\
    \ 解释道。\n\n输出显示在屏幕上。\n\n```\nMain program now running\nFirst call to pthread -\
    \ Before sleep\nSecond call to pthread - Before sleep\nFirst call to pthread -\
    \ After waking up\nSecond call to pthread - After waking up\nBack to main after\
    \ thread join\n```\n\n“现在，你会发现有些不对。你预测的顺序并不在那里。当第一个执行切片在睡眠时，调度器认为明智地插入了第二个执行切片。它没有等待第一个线程执行完毕。不存在同步性。”\n\
    \nLingaraj 移开目光，按照他的习惯，看向远方。\n\n“怎么了？”\n\n“有一次，我遇到一个相信同步性的女性。当时我正在从事动物粪便分析。她是一个数据库分析师。她在烛光晚餐时这样问我。\n\
    \n![](img/image_rsrc85A.jpg)\n\n‘这个数字 7 不论我去哪里都会出现，而且通常在我做重要事情的时候。你有那数字吗？’\n\n\
    ‘是的，我到处都能看到数字 2。’\n\n她起身离开了。”\n\n“难怪！”\n\n“如果我们想在调度器进入下一个代码之前锁定一段代码该怎么办。”\n\n"
- fmt: "\nLet me tell you about a scenario. When my uncle, a doctor was in the operating\
    \ room in his private hospital, they locked the door in case operations were going\
    \ on. Once the operation finished, they would open the door by unlocking the door.\n\
    \nIf the door was unlocked, a film crew would go in and make videos because it\
    \ was the only room which had big lights. While this was going on, they would\
    \ lock the door. After their job was done, the film crew used to unlock the door.\n\
    \n## Mutually Exclusive Threads\n\nWhat are mutually exclusive threads? What are\
    \ they? They are resources that can be blocked. If for example, you are with Vijay\
    \ and he keeps getting distracted with a football match, how can you block his\
    \ resource so neither a football match, nor wrestling can’t obtain his interest?”\n\
    \n“Easy, I would use a mutually exclusive thread program on him.” Seema was doing\
    \ some research and fast.\n\n“Easy? Good luck doing that, not because mutex programs\
    \ are difficult, but tearing one away from football is. A mutex, short for mutually\
    \ exclusive, locks a critical region of a code, so that the locking program is\
    \ done with it before others can have a go at it. Remember Lock Lakshman?” Lingaraj\
    \ showed a C library function.\n\n```c\n#include <pthread.h>\nint pthread_mutex_init(pthread_mutex_t\
    \ *mutex, const pthread_mutexattr_t*mutexattr);\n```\n\nInitialises a mutex, `*mutex`\
    \ which is based on the thread function.\n\n`const pthread_mutexattr_t *mutexattr`\
    \ This will take some explaining. Will save it for later.\n\n```c\nint pthread_mutex_lock(pthread_mutex_t\
    \ *mutex));\n```\n\nThis locks the resource.\n\n```c\nint pthread_mutex_unlock(pthread_mutex_t\
    \ *mutex);\n```\n\nThis unlocks the resource.\n\n```c\nint pthread_mutex_destroy(pthread_mutex_t\
    \ *mutex);\n```\n\nThis will destroy the mutex and clean up as well.\n\n“Let’s\
    \ get into a program.”\n\n“Ok.”\n\n“The mutex program. Before that, the thread\
    \ program we talked about.\n\n### thread_program .c\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\n\
    void *print_func(char* message){\n  printf(\"%s - Before sleep\\n\", message);\n\
    \  sleep(4);\n  printf(\"%s - After waking up\\n\", message);\n}\nint main(){\n\
    \  pthread_t t1, t2;\n  printf(\"Main program now running\\n\");\n  pthread_create(&t1,\
    \ NULL, (void *)print_func, (void *) \"First call to pthread\");\n  pthread_create(&t2,\
    \ NULL, (void *)print_func, (void *) \"Second call to pthread\");\n  pthread_join(t1,\
    \ NULL);\n  pthread_join(t2, NULL);\n  printf(\"Back to main after thread join\\\
    n\");\n}\n```\n\nThe output was:\n\n```\nMain program now running\nFirst call\
    \ to pthread - Before sleep\nSecond call to pthread - Before sleep\nFirst call\
    \ to pthread - After waking up\nSecond call to pthread - After waking up\nBack\
    \ to main after thread join\n```\n\nAs explained earlier, there is no synchronicity.\
    \ We use mutually exclusive threading.\n\nBack to the program, now with a mutex.\n\
    \n### thread_with_mutex.c\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <string.h>\n#include <pthread.h>\n#include <unistd.h>\npthread_mutex_t mutex1\
    \ = PTHREAD_MUTEX_INITIALIZER;\nvoid *print_func(char* message){\n  pthread_mutex_lock(&mutex1);\n\
    \  printf(\"%s - Before sleep\\n\", message);\n  sleep(4);\n  printf(\"%s - After\
    \ waking up\\n\", message);\n  pthread_mutex_unlock(&mutex1);\n}\nint main(){\n\
    \  pthread_t t1,t2;\n  pthread_mutex_t mutex1;\n  pthread_mutex_init(&mutex1,\
    \ NULL);\n  pthread_create(&t1, NULL, (void *)print_func, (void *) \"First call\
    \ to pthread\");\n  pthread_create(&t2, NULL, (void *)print_func, (void *) \"\
    Second call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n\
    \  printf(\"Back to main after thread join\\n\");\n}\n```\n\nI will explain this.\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
    \ <pthread.h>\n#include <unistd.h>\npthread_mutex_t mutex1 = PTHREAD_MUTEX_INITIALIZER;\n\
    This initialises the mutex, mutex1.\nvoid *print_func(char* message){\n  pthread_mutex_lock(&mutex1);\n\
    We lock the mutex here . What follows is the critical section of the code.\n \
    \ printf(\"%s - Before sleep\\n\", message);\n  sleep(4);\n  printf(\"%s - After\
    \ waking up\\n\", message);\n  pthread_mutex_unlock(&mutex1);\nHere we unlock\
    \ the mutex.\nint main(){\n  pthread_t t1,2;\n  pthread_mutex_t mutex1;\n  pthread_mutex_init(&mutex1,\
    \ NULL);\n  pthread_create(&t1, NULL, (void *)print_func, (void *) \"First call\
    \ to pthread\");\n  pthread_create(&t2, NULL, (void *)print_func, (void *) \"\
    Second call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n\
    \  printf(\"Back to main after thread join\\n\");\n}\n```\n\nThe output was:\n\
    \n```\nMain program now running\nFirst call to pthread - Before sleep\nSecond\
    \ call to pthread - Before sleep\nFirst call to pthread - After waking up\nSecond\
    \ call to pthread - After waking up\nBack to main after thread join\n```\n\nAs\
    \ explained earlier, there is no synchronicity. We use mutually exclusive threading.\
    \ Back to the program, now with a mutex. (Note: The provided text contained repetitive/scrambled\
