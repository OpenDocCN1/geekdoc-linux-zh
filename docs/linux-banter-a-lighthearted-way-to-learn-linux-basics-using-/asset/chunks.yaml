    finished: PID = 36961Child exited with code 23 |


    So, the child process ID and the exit code were retrieved by the parent process.


    And if we check with ps -al, there is no mention of the Zombie process despite
    the parent process running for 30 seconds more.


    A good shell command is the pstree -p command with which you can see the process
    tree along with the process IDs . I suggest you try this on your own while running
    the above programs to see which process gave rise to which process.


    Signals


    Lingaraj began.


    “There was this incident that happened in a shopping mall. I was trying to pick
    up a gift for my girlfriend when I noticed a young woman trying to select jewellery
    for her ears. She kept on trying various jewellery and we both could see each
    other in the mirror. I gave her signals on what she was trying out. She was trying
    out a pair of earrings when I gave her the thumbs down sign.


    ![](image_rsrc857.jpg)


    She rejected it. The same thing happened with the next two tries and then she
    asked me why. I asked her to wait, took a course in sign language and came back.
    She was still there trying to get the right look. Then I started signalling her.


    “What did you signal?” asked Seema.


    Here’s a set of signal messages.


    The very idea of earrings is wrong.


    You are taking too much time to decide.


    Please stop talking on the phone and try out something.


    Somebody blocking the view in the mirror.


    Repeating the same thing she wore without remembering it.


    Throw a big rock at the mirror and shatter it because you have been standing there
    for ages and she can’t decide.


    “And what happened?” asked Seema.


    “She made a selection of about 8 pairs of earrings, 12 necklaces and 7 studs for
    the nose. And promptly disappeared. I would have too, but she had told the shopkeeper
    that I was her husband. The shopkeeper believed since I had made the selections.
    I had to pay from my girlfriend’s credit card as I was living off her at that
    time. I stayed with my girlfriend until the credit card bill arrived. I was eating
    ‘onion dosei’ she had made and I had to tear myself away from the dosei. She used
    to make such good onion doseis.” 


    Seema saw Lingaraj had a catch in his throat and she was not sure whether Lingaraj
    was feeling emotional for the woman or the doseis.


    Lingaraj recovered and continued.


    “I told you about ‘Ctrl+C’. On Linux, it sends the SIGINT . If Vijay’s being erratic
    in behaviour, you can stop it using Ctrl+C. Unless Vijay can catch it.”


    Here’s a list of some signals.


    | SIGABORT |


    | SIGALRM |


    | SIGFPE |


    | SIGHUP |


    | SIGILL |


    | SIGINT |


    | SIGKILL |


    | kill [options] <pid> [...] |


    Can you guess what a kill command can do to a process?


    “It kills it.” said Seema.


    “It sends a signal to a process to kill it. And the kill command can send a signal
    that even tells the process to continue if it’s in a good mood.


    If you don’t specify a signal, the default is TERM. Meaning, true to it’s name,
    the kill command will send a terminate signal to the process defined by ‘pid’.
    If the program doesn’t listen, the option -KILL definitely kills. BTW, the kill
    does not work on zombie processes.


    If ‘pid’ is a negative number, the positive value of ‘pid’ will be treated as
    a process group. If it’s positive, the process id is indicated. If it’s -1, all
    processes will be sent the kill signal except ‘init’ and ‘inetd’.


    The signal can be specified using the name or number. To see a list of available
    signals, use the


    | kill -l |


    command.


    This was the kill command. There is a kill system call as well.


    | #include <sys/types.h>#include <signal.h>int kill(pid_t pid, int sig); |


    As you can see, it takes the pid of the process to be done away with and the signal
    to be sent. You can send the kill signal to only the process with the same user
    ID. You cannot send it to processes with a different user id. The superuser can
    kill though.


    ‘kill’ can fail and return -1 if :


    If the signal specified is not a valid one, setting the errno EINVAL


    If it doesn’t have permission, in which case errno is set to  EPERM


    If the specified process doesn’t exist, thereby setting errno to ESRCH


    “Why is it that only killing signals are sent. So negative. Why can’t there be
    an encouraging signal?”


    “Imagine Vijay is thinking about beer with friends while your uncle is going on
    and on about how he fought off rogues when he was young. Would you want to encourage
    that beer process or kill it?” asked Lingaraj.


    “I want to kill it with a -KILL option. But how do I encourage him to listen to
    my uncle.”


    “You can set nice for that. The nice command.


    | nice options command argument |


    You can set a value like between -20 to 20.”


    “Okay, I will use it to set a value of 20 to the command that says listen to my
    uncle’s story.”


    Lingaraj thought for a moment. He appeared to be in a dilemma. The he spoke.


    “Setting a high value with nice, you reduce the priority of the command. Lower
    value means higher priority. You can use ‘renice’ to change a process priority.
    Example :


    | renice 10 13621362 being the process id. |


    The signal() system call.


    | #include <signal.h>void (*signal(int sig, void (*func)(int)))(int); |


    You can provide actions for signals received or catch it using the signal command,
    which makes the process, either ignore it, use default behaviour or run a function
    in the program.


    So, every signal’s response can be coded using the signal system call.


    But then, you can forget it, because it is no longer being used.


    I will just mention about pause.


    | #include <unistd.h>int pause(void); |


    It makes the process pause until a signal appears. In place of signal(), we have
    a more robust system call.


    | #include <signal.h>int sigaction(int sig, const struct sigaction *act, struct
    sigaction *oact); |


    Return values of sigaction.


    0 if there’s no error.


    -1 if there is an error. This happens if the signal is invalid or if the signal
    cannot be caught or ignored.


    The ‘sig’ is the signal.


    The ‘struct sigaction’ has within it, members that deal with a signal.


    Some of the members of the structure ‘sigaction’ are:


    void (*) (int) sa_handler    


    What happens when a signal occurs? Will a function be called, or SIG_DFL, that
    is default action be taken? Or SIG_IGN which will ignore the signal.


    sigset_t sa_mask  '
