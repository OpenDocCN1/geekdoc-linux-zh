  trans: "\nSeema 在她的笔记本电脑上尝试了一下，并探索了各种选项。随后，Lingaraj 打开包，给猴子分了一些香蕉。\n\n# C 编译器\n\n\
    当他们回到 Lingaraj 的家时，Seema 开始询问 Lingaraj 父母的情况。\n\n“我父亲在瑞典参加一个生物技术会议。我母亲正在去拉达克地区和喜马拉雅山旅行。”\n\
    \n“是什么让你选择学习 Linux 的？对我来说，这是一种必需品。”\n\n“我喜欢 Linux，是因为它让像我这样简单的程序员也能看到那些地位显赫的资深程序员所看到的东西。这里的一切都是共享的，它是人类汇聚的例子之一，尽管在某种程度上是为了给世界带来益处，而不是真正为了利润。\n\
    \n现在，我们来谈谈编译器。\n\n“编译器将你编写的人类可读的形式转换为机器可读的形式。”\n\nLingaraj 在他的笔记本电脑上向她展示了一个 C\
    \ 程序的一部分。\n\n```c\npthread_t t1, t2; pthread_mutex_t mutex1; pthread_mutex_init(&mutex1,\
    \ NULL); int iret1 = pthread_create(&t1, NULL, (void *) print_func, (void *) message);\
    \ int iret2 = pthread_create(&t2, NULL, (void *) print_func, (void *) message);\
    \ pthread_join(t1, NULL); pthread_join(t2, NULL);\n```\n\n“哦！这是机器可读的形式。”\n\n“不，那是人类可读的。”\n\
    \nSeema 愣住了。\n\n“Linux 通常使用 `gcc`。它是一个 C 编译器，可以编译 C、C++ 等更多语言。” Lingaraj 继续说道。\n\
    \n诀窍在于能够用它的语言与之交流，并根据条件让它执行任务。\n\n“你家里和你和你在一起？”Lingaraj 问。\n\n“我妈妈。”\n\n“你来这里之前给她下过什么指令吗？”\n\
    \n“是的，我说‘除非你非常熟悉那个人，否则不要开门’”\n\n“看，这就是程序。你为了安全对她进行了编程。\n\n机器也是一样。但它们只理解 0 和 1。最基础的是门，它可以根据条件决定是否允许电流通过。所以，这种取决于条件的行为构成了计算机。一种泥土中的元素只允许电流单向通过，这使得电子和计算机世界成为可能。\n\
    \n所以，你对计算机说的每一行代码，电流都会以特定的方式流动并发生相应的操作。你需要学习 C 语言。我本想给你推荐一本我写的书，但我还没写。我建议你参考这本书。”Lingaraj\
    \ 说着递过一本关于 C 语言的书。\n\n第二天 Seema 回来，她已经研读了那本书并做了笔记。\n\n“我学了一点 C。我现在我知道‘Hello world!’程序了。”\n\
    \n“现在我们来讲一下结构体和指针。结构体就像是将不同类型的相关变量放在一个篮子里的方法，如果你这么理解的话。一个例子是：\n\n```c\nstruct\
    \ example_structure{int any_number;char one_letter;};\n```\n\n可以这样访问成员：\n\n```c\n\
    example_structure.any_number\nexample_structure.one_letter\n```\n\n大多数数据像变量一样存储在内存中。现在，C\
    \ 语言允许你根据内存地址访问该变量。存储变量地址的变量被称为指针。可以获取变量的地址，也可以获取存储在那的内容（值）。\n\n例如：\n\n```c\n\
    #include <stdio.h>\nint main(){\n    int variable1 = 20;\n    int *vp;\n    vp\
    \ = &variable1;\n    printf(\"The address of variable1 is %p\\n\", (void*) &variable1);\n\
    \    printf(\"Address stored in variable vp is %p\\n\", vp);\n    printf(\"The\
    \ value of the variable variable1 is %d\\n\", variable1);\n    printf(\"The value\
    \ at the address given by variable vp is %d\\n\", *vp);\n}\n```\n\n我们可以尝试这个程序来找找感觉。我还不向你展示我是如何运行它的。\n\
    \nLingaraj 运行了程序，屏幕上显示了输出。\n\n```\nThe address of variable1 is 0x7ffe17ff187c\n\
    Address stores in variable vp is 0x7ffe17ff187c\nThe value of the variable variable1\
    \ is 20\nThe value at the address given by variable vp is 20\n```\n\n地址是特定机器和实例的。但如果你看到它，它让你了解指针是如何工作的。\n\
    \n“让我们来测试一下‘Hello World’程序。那么，你如何调用 `gcc`，即 GNU C 编译器？你只需要输入 `gcc` 加上程序名。编译器会将可执行的二进制文件保存为目录中的‘a.out’。但如果你灵感爆发想起个别的名字，可以使用\
    \ `-o` 选项。”\n\n然后 Lingaraj 像往常一样，似乎跳到一个完全无关的话题。\n\n“如果你带一只鳄鱼去兽医那里打疫苗，医生会看到是一只来自南方的鳄鱼，并用南方鳄鱼语言与它交流。他不会用北方鳄鱼语言与其交流。同样，`gcc`\
    \ 是一个交叉编译器。这意味着它可以理解输入文件的类型。”\n\n# 文件和目录\n\n让我们来看看 Linux 系统。在此之前，我想向你们介绍一下‘Thing\
    \ Thimma’。”\n\n他们散步到达一片甘蔗田。那里风景优，他们注意到远处有一间精致的小屋。像往常一样，Lingaraj 带着他的笔记本电脑。当他们靠近小屋时，可以看到有很多榨完汁后堆成堆的甘蔗渣。\n\
    \n“你好 TT。这是 Seema。她正在学习 Linux。”Lingaraj 说。\n\nSeema 向 TT 握了手。\n\n“Thimma 从事甘蔗渣制作，即用榨完汁后的甘蔗渣制成的盘。告诉我\
    \ Thimma 今天过得怎么样？一切都还好吗？”\n\n"
- fmt: '

    “Oh, today was quite this thing. The thing I bought from this guy had a faulty
    thing and I had to search in this thing for that thing to make this thing work
    like the thing I was used to. So I went to this guy selling this thing you use
    for that thing and that guy asked for this thing you see and….”


    “Stop. You can go.” said Lingaraj.


    Thimma walked back into his shed.


    “I get the drift. ‘Thing Thimma’ has a nice ring to it.” said Seema.


    “So, Thimma treats everything as a thing. From nuts, gears, press, machines, the
    phone etc. And Linux, too does the same. Everything is a file. From text files,
    programs, directories, devices, Linux treats everything as a file.”


    “Ok”


    “In Linux there are commands to work with files. Now `open`. What does this command
    do?” Lingaraj asked Seema.


    “Opens the file.”


    “Close?”


    “Closes the file.”


    “Read?”


    “Reads the file. Wish this OS was there when I had to read all those books in
    school. It would have read it all for me.”


    “To write a program to make the system read it for you and to transfer it all
    to your brain, would have meant even more reading. Now, `write`?”


    “Writes to the file. This is so easy. We should have started with this.”


    “`ioctl`?”


    “Errr….`ioctls` the file?”


    “One day, when you have to program Vijay, this will be important to you. It passes
    the control to a device driver.”


    Seema looked questioningly.


    “His heart. Do you think his heart’s still in there? What’s the latest update
    about him?”


    “The doctor said he stared at a picture of us we took, when we had visited this
    Pizza joint a long time ago, for 2 hours straight.”


    “Seems like a positive development.”


    “Then the doctor placed my phone number in front of him. He then called me and
    ordered five pizzas.”


    “Poor guy, did you send them?”


    “No!”


    “Moving along, there are directories which store files. They are also considered
    files in Linux, but special ones. Can be accessed by the high level interface
    `opendir` or `readdir`. High level does not mean something elite. It means it
    is higher because a lot of programming is below it. It is not a direct access
    to the system, but through a lot of programs.”


    “As a man, you tell me in which directory does he store his love files.”


    Lingaraj looked inspired.


    “Actually, this gives me inspiration to write love poetry.”


    Lingaraj sat down on a stone and started typing in his laptop.


    ```

    I have your love files in my heart directory

    My heart is now, a love producing factory

    You just say opendir or readdir

    And it will be like drinking elixir

    ```


    Lingaraj looked dreamily towards the sugarcane fields.


    “What was your question?” he asked after a while.


    “Forget it.”


    “Anyway, the file’s creation, permissions are stored in the `inode`. Inode can
    be thought of as a social number card for the file.”


    Once I had a fight with this guy Prathap. It was over who gets a photo with a
    bison.


    ![](image_rsrc848.jpg)


    “I loathed him so much that I began tracking him. I got so much of his info that
    when he was getting married, his fiance came to meet me.”


    ![](image_rsrc849.jpg)


    “To make you both friends again?”


    “No, she wanted to know more about Prathap from me as I knew more about him than
    anybody else. I had become like an `inode` for him. Collecting all the information.”


    “How did you get out of it? This hatred?”


    “Oh, I forgave him.”


    “How?”


    “After I saw him fend off three bison from attacking me and my family when I was
    sleeping. Actually I was only pretending to be asleep. I would have stepped in
    if he had perished and quelled the bison myself. But he did what he could.”


    “Where is he now?”


    “He is in Kenya now making documentaries on bison. He sent me his video link a
    couple of years ago.”


    “Is it good?”


    “I can’t say, I didn’t watch it.”


    “There’s this thing called courtesy and gratitude.”


    “Anyway, back to directories. A directory simply holds the `inode` numbers of
    all the files that are in it. If a file is deleted, the `inode` entry in the directory
    is deleted. The number of links for that file goes down by one. If the file is
    in 2 other directories, it means it has 2 links. If the files in both the directories
    are deleted, the number of links go to zero. The data blocks that it possessed
    is marked free. How do you get to your home directory?”


    “`cd`? Right?” asked Seema.


    “There is one more way. The `cd` tilde.


    | `$ cd ~` |


    “I have a knock knock joke.


    “Knock knock.”


    “Who’s there?”


    “Tilde”


    “Tilde who?”


    “Till date no one’s opened their heart for me.”


    “I am really tired.”


    The session was over and Seema was introduced to a guy with a boat by Lingaraj.
    The boatman took her on a boat ride and Seema enjoyed it very much.


    The next day. Lingaraj continued at his house.


    Let’s look at some hardware files. Three of them. We start with.


    | `/dev/console` |


    This is the system console. A place where messages are usually displayed.


    | `/dev/tty` |


    This is the terminal.


    | `/dev/null` |


    This is the black hole.


    | `/dev/zero` |


    This provides an endless stream of null bytes.


    | `/dev/random` |


    This provides a source of true random numbers.


    | `/dev/urandom` |


    This provides a source of pseudorandom numbers.


    | `/dev/sda` |


    This is usually the first hard drive.


    | `/dev/sdb` |


    This is the second hard drive.


    | `/dev/sdc` |


    This is the third hard drive.


    | `/dev/sda1` |


    This is the first partition on the first hard drive.


    | `/dev/sda2` |


    This is the second partition on the first hard drive.


    | `/dev/sdb1` |


    This is the first partition on the second hard drive.

