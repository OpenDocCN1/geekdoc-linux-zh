    \ Lingaraj commented.\n\nLingaraj was silent for a while.\n\n“Do you want to use\
    \ a pipe?” asked Lingaraj.\n\n“What’s in it? Some herbs?”\n\n![](image_rsrc839.jpg)\n\
    \n“No, it connects one command’s output to another’s input.” said Lingaraj pointing\
    \ at his laptop.” He typed and showed Seema the pipe key on the keyboard just\
    \ above the ‘Enter’ key.\n\n```\n$ echo Seema is original | wc -m18\n```\n\nThe\
    \ `echo` command is piped with the `wc -m` command. The `echo` command outputs\
    \ to the `wc -m` command which them counts the number of characters because of\
    \ `-m`. The `>` is used to input from files and `<` to output to files and the\
    \ pipes are for commands.\n\n“Let’s go back.” said Lingaraj.\n\nAs they approached\
    \ the camp, they could see some people already at work. A few of them were making\
    \ jute bags.\n\n![](image_rsrc83A.jpg)\n\n“Just like we use jute bags to hold\
    \ things , there are directories that hold files.\n\n![](image_rsrc83B.jpg)\n\n\
    There are many directories. Here’s a list of them.\n\n`/`\n\nThis is the source\
    \ directory.\n\n`/bin`\n\nAny idea?”\n\n“The waste directory, some kind of a trash\
    \ bin?” asked Seema.\n\n“It contains all binaries of programs. There’s this book\
    \ about directories in my room. Read that. Meanwhile, I will get some fresh juice.”\n\
    \nSeema proceeded to Lingaraj’s room and found the book. As she was searching,\
    \ she saw books on various topics like film making, writing poetry and others.\n\
    \n![](image_rsrc83C.jpg)\n\nThen she met Lingaraj outside after she read the first\
    \ few pages. Lingaraj gave her watermelon juice.\n\n![](image_rsrc83D.jpg)\n\n\
    Lingaraj continued.\n\n“\n\n`/boot`\n\nYour thoughts on it?\n\n“When a computer\
    \ boots up, the necessary files are stored here.” replied Seema.\n\n“\n\n`/dev`\n\
    \n?”\n\n“Development tools….no wait, device files. Devices, programs, databases,\
    \ etc. etc.”\n\n“This brings me to\n\n`/etc`?” asked Lingaraj.\n\n“All the host\
    \ specific system configuration files.”\n\n“\n\n`/home`?”\n\n“All your personal\
    \ stuff. All those 43 letters.”\n\n“44 now.” said Lingaraj with sadness in his\
    \ tone.\n\n“\n\n`/lib`?”\n\n“Essential shared libraries and kernel modules.”\n\
    \n“What’s a shared library?” asked Seema.\n\n“Many programs that are written can\
    \ use already existing programs which are written for such a benefit. Like if\
    \ you order noodles with sweet chutney, the noodles already made can be bought\
    \ by the hotel management. So, if I write a program that involves adding two numbers,\
    \ I can call a program from a library that already has the addition program written.”\n\
    \n“And kernel modules?”\n"
