    \ |\n| 使用 `while` 循环从输入文件流中获取字符，并使用输出文件流将其写入输出文件，直到到达文件结束（`EOF`）为止。 |\n| 退出。 |\n\
    \n当你查看我目录下的文件时，你会看到很多像这样的字符：`rwx`。\n\n它们是权限。我来给你展示一下我的烹饪目录。\n\nLingaraj 在他的笔记本电脑上打开了“烹饪目录”（Cooking\
    \ Directory）。他展示了一个条目。\n\n| 香草面包 rw_rw_r__ |\n\n第一组三个字符代表用户，第二组代表拥有该文件访问权限的人员组。第三组代表其他人。\n\
    \n“`r` 代表读（read），意味着我可以读取这个文件。`w` 代表写（write），意味着我可以写入这个文件。缺失的位 `x` 代表可执行（executable）。因为这是一个文本文件，它不能被执行。”\n\
    \nLingaraj 望向远方。Seema 感觉到一个故事要来了。\n\n“我曾经拥有一群羊。我以前经常通过用基础技术训练羊来授予权限。我曾会把给签过合同的人的照片展示给那些羊看，羊就会信任那些家伙。羊毛给某人，牛奶给另一个人，粪便给另一个。”\n\
    \n![](img/image_rsrc84M.jpg)\n\n“后来我不懒得去维护它们。我总是让它们自由奔跑。那些羊被训练得非常好，以至于如果拿牛奶合同的人试图去拿一些羊毛，羊就会咬他。所以，用户无法访问不属于他的文件。”\n\
    \n“我猜结局并不好。发生了什么？”\n\n“有一天，我发现它们不见了。”\n\n“是有人为了肉杀了它们吃肉吗？”\n\n“不是。一个邻国的国王把这些羊征召到了他的军队里。”\n\
    \n“为什么？”\n\n“因为羊可以通过叫声把敌人身上的粪踢出来。”\n\n![](img/image_rsrc84N.jpg)\n\nSeema 真心希望笔记本电脑没有掉在\
    \ Vijay 的头上。\n\nLingaraj 继续说道。\n\n“\n\n```c\n#include <sys/stat.h>\nint chmod(const\
    \ char *path, mode_t mode);\n```\n\n这更改文件或目录的模式。\n\n```c\n#include <sys/types.h>\n\
    #include <unistd.h>\nint chown(const char *path, uid_t owner, gid_t group);\n\
    ```\n\n这更改文件或目录的所有所有权。你从哪里获取 `uid_t` 和 `gid_t` 的值？通过 `getuid()` 和 `getgid()` 调用。`getuid`\
    \ 和 `getgid` 分别返回用户 ID 和组 ID。它们不是整数，而是 `uid_t` 和 `gid_t` 类型，但它们看起来像整数。\n\n“就像是这样。我们有一只叫‘Stupid’的狗。我来给你演示一下。”\
    \ Lingaraj 带着 Seema 到了室外。\n\n“Stupid！” Lingaraj 大声喊道。\n\n![](img/image_rsrc84P.jpg)\n\
    \n一只狗突然出现，看起来很好玩。然后它看向 Seema 并试图攻击。\n\n![](img/image_rsrc84R.jpg)\n\nSeema 吓了。当狗靠近并准备跳向\
    \ Seema 时，Lingaraj 喊道 `chown Seema`。\n\n狗立刻改变了态度，摇起了尾巴。\n\n![](img/image_rsrc84S.jpg)\n\
    \nSeema 喘了一口气。Lingaraj 解释道：\n\n“这只狗 Stupid 既会玩也很凶。每当有新人来时，如果狗试图攻击他，人们会立即使用这个命令\
    \ `chown name`。狗就会更新自己，认为自己是新主人，不再攻击他。它会和他一起玩。不用说，这狗是我训练的。这只是一个教你关于所有权和 ID 的例子。”\n\
    \n“你这方法也太低了，我觉得这是一个很‘stoopid（蠢）’的教学方法。”\n\n“说得不错。” 他们回到室内，Lingaraj 继续他的讲解。他向她展示了一些系统调用。\n\
    \n```c\n#include <unistd.h>\nint unlink(const char *path);\nint link(const char\
    \ *path1, const char *path2);\nint symlink(const char *path1, const char *path2);\n\
    ```\n\n`unlink()` 类似于删除。除了在最后一个使用文件的进程终止后，该文件占用的空间会被释放。\n\n`link()` 将一个文件链接到另一个文件。因此，可以通过指定\
    \ `path2` 来访问由 `path1` 指定的文件。如果 `path2` 指定的文件已经存在，则会报错。所以，`path2` 中的文件不应该存在。\n\
    \n当然，当你执行 `ls` 时，`path2` 指定的文件会被列出来，但它打开的是 `path1` 指定的文件。\n\n```c\n#include <sys/types.h>\n\
    #include <sys/stat.h>\nint mkdir(const char *path, mode_t mode);\n#include <unistd.h>\n\
    int rmdir(const char *path);\n```\n\n创建和删除目录。你已经知道创建目录时关于模式的部分了。`rmdir` 只有在目录为空时才删除它。当然，你必须在你的程序中尝试它们。所有的。我不会教你\
    \ C 语言编程。我只教你系统背后的理论。\n\n```c\n#include <unistd.h>\nint chdir(const char *path);\n\
    ```\n\n更改目录，比你在我的系统的 food 目录中，想移动到我爷爷的 cocktail（鸡尾酒）目录。\n\n```c\n#include <unistd.h>\n\
    char *getcwd(char *buf, size_t size);\n```\n\n为了说明，看这个程序：\n\ngetcwdir.c\n\n```c\n\
    #include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
    int main(){\n    int nread;\n    char word[1024] = \"Seema’s progress is good.\"\
    ;\n    char buf[1024];\n    int fd = open(\"/tmp/writeout.txt\", O_CREAT | O_WRONLY);\n\
    \    write(fd,&word,1024);\n    getcwd(buf, 1024);\n    printf(\"Current working\
    \ directory is : %s\\n\", buf);\n    chdir(\"/tmp\");\n    getcwd(buf, 1024);\n\
    }\n```\n\n输出是：\n\nCurrent working directory is : /tmp\nCurrent working directory\
    \ is : /home\n\n目录函数在头文件 `dirent.h` 中声明。它们使用一个结构体 `DIR`。指向该结构的指针就像文件流。目录条目以 `dirent`\
    \ 结构的形式返回。该结构在 `dirent.h` 中定义的成员有：\n\n| ino_t d_ino | 文件序列号 |\n| ulong_t d_offset\
    \ | 此项的实际偏移量 |\n| char d_name | 条目名称 |\n| ushort_t d_reclen | 此条目的长度 |\n| ushort_t\
    \ d_namelen | d_name 中字符串的长度 |\n\n所以，你可以逐一个访问目录条目并列出它们。需要记住的是，`opendir` 返回一个指向目录结构的指针，尽管该函数不像\
    \ `fopen` 那样以 `f` 开头。\n\n```c\n#include <sys/types.h>\n#include <dirent.h>\nDIR\
    \ *opendir(const char *name);\n```\n\n`opendir` 在失败时返回空指针。\n\n```c\n#include <sys/types.h>\n\
    #include <dirent.h>\nstruct dirent *readdir(DIR *dirp);\n```\n\n上述库函数返回指向目录结构中下一个条目的指针。为什么不是当前条目？因为\
    \ `opendir` 已经返回了第一个条目。我们需要之后的那个。\n\n```c\n#include <sys/types.h>\n#include <dirent.h>\n\
    long int telldir(DIR *dirp);\n```\n\n它告诉你目录流中的当前位置。\n\n```c\n#include <sys/types.h>\n\
    #include <dirent.h>\nvoid seekdir(DIR *dirp, long int loc);\n```\n\n这用于设置目录条目指针。与\
    \ `readdir` 的区别在于，`readdir` 返回下一个条目，而这个库函数可以使 `readdir` 返回后续或之前的目录条目。但位置 `loc`\
    \ 必须预通过 `telldir()` 获取。\n\n```c\n#include <sys/types.h>\n#include <dirent.h>\n\
    int closedir(DIR *dirp);\n```\n\n"
