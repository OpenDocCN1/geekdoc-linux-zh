    \n![](img/image_rsrc84T.jpg)\n\n## mmap 语法\n语法如下：\n\n```c\n#include <sys/mman.h>\n\
    void *mmap(void *addr, size_t len, int prot, int flags, int fildes, off_t off);\n\
    ```\n\n“有很多参数。”Seema 说。\n\n“让我们想象一下我们有一种名为‘冲突抑制器’的鸡尾酒，如果你看我祖父关于它的文本文件，文件的内容是：\n\
