  trans: "\n\n`writefds` 用于写入就绪，`errorfds` 用于我们想要检查是否有错误条件的文件描述符集合。\n\n`timeval` 结构包含两个成员，一个指定用户时间，另一个指定微秒为单位的时间。\n\
    \n这是超时值，当这段时间过去后，`select` 将带有已激活的文件描述符并返回。\n\n```c\n#include <sys/types.h>\n#include\
    \ <sys/time.h>\nvoid FD_ZERO(fd_set *fdset);\nvoid FD_CLR(int fd, fd_set *fdset);\n\
    void FD_SET(int fd, fd_set *fdset);\nint FD_ISSET(int fd, fd_set *fdset);\n```\n\
    \n上述是一组宏。\n\n`FD_ZERO` 初始化文件描述符集合，无论是 `readfds`、`writefds` 还是 `errorfds`。\n\n\
    `FD_CLR` 从文件描述符集合中移除一个文件描述符。\n\n`FD_SET` 向文件描述符集合添加一个文件描述符。\n\n`FD_ISSET` 检查属于特定文件描述符集合的文件描述符是否处于激活状态。这是在\
    \ `select` 返回后进行的，用于检查我们感兴趣的文件描述符是否准备好读取、写入或是否存在错误条件。\n\n我们很快将在一个程序中看到这些运行情况。\n\
    \n还有几个函数需要介绍。\n\n不同类型的计算机通过网络字节序对在网络上传输的多字节整数值达成一致。特别是端口号。不同的计算机可能使用不同的方法来表示所需的数字。我的门牌号是\
    \ `1`。在我的脑海中，我把它想成：\n\n`((-b) ± √(b²-4ac))`\n\n2a\n\n其中\n\n`a = 3`\n`b = -6`\n\
    `c = 3`\n\n出于某种原因。如果我从外卖服务订餐，我不能把这个放在地址栏里。我必须输入 `1`。因此，我们有函数充当原生主机格式与标准网络格式之间的桥梁作用。\n\
    \n```c\n#include <netinet/in.h>\nunsigned long int htonl(unsigned long int hostlong);\n\
    ```\n\n将主机格式转换为标准网络长整型\n\n```c\nunsigned short int htons(unsigned short int hostshort);\n\
    ```\n\n主机格式转换为网络格式短整型\n\n```c\nunisgned long int ntohl(unsigned long int netlong);\n\
    ```\n\n网络转换为主机长整型\n\n```c\nunsigned short int ntohs(short int ntohs(unsigned short\
    \ int netshort));\n```\n\n网络转换为主机短整型\n\n```c\n#include <sys/socket.h>\n#include\
    \ <netinet/in.h>\n#include <arpa/inet.h>\nin_addr_t inet_addr(const char *cp);\n\
    ```\n\n直率地说，这个函数将你的 IP 地址转换为网络格式。\n\n“如果服务器和客户端不知道端口号或地址怎么办？”\n\n“在这种情况下，可以使用一些函数获取计算机的完整细节。例如：\n\
    \n```c\n#include <netdb.h>\nstruct hostent *gethostbyaddr(const void *addr, size_t\
    \ len, int type);\nstruct hostent *gethostbyname(const char *name);\n```\n\n这会返回一个结构体\n\
    \n```c\nstruct hostent {\n    char *h_name;\n    char **h_aliases;\n    int h_addrtype;\n\
    \    int h_length;\n    char **h_addr_list\n};\n```\n\n对于服务和相关的端口号：\n\n```c\n\
    #include <netdb.h>\nstruct servent *getservbyname(const char *name, const char\
    \ *proto);\nstruct servent *getservbyport(int port, const char *proto);\n```\n\
    \n它返回一个结构体。\n\n```c\nstruct servent {\n    char *s_name;\n    char **s_aliases;\n\
    \    int s_port;\n    char *s_proto;\n};\n```\n\n```c\n#include <arpa/inet.h>\n\
    char *inet_ntoa(struct in_addr in);\n```\n\n这会将 Internet 主机地址转换为点分位格式的字符串。\n\n\
    ```c\n#include <unistd.h>\nint gethostname(char *name, int namelength);\n```\n\
    \n这将主机名写入由 `name` 提供的字符串中。\n\n当然，你必须了解一些你想要建立连接的系统。\n\n### UDP\n\n正如我所说，UDP 没有保证。你以与\
    \ TCP/IP 类似的方式构建程序，但不是使用 `read` 和 `write`，而是使用以下系统调用。UDP 是获取某些不重要数据的一种廉价方法。\n\n\
    ```c\nint sendto(int sockfd, void *buffer, size_t len, int flags, struct sockaddr\
    \ *to, socklen_t tolen);\n```\n\n`sendto` 向数据套发送数据。\n\n```c\nint recvfrom(int\
    \ sockfd, void *buffer, size_t len, int flags, struct sockaddr *from, socklen_t\
