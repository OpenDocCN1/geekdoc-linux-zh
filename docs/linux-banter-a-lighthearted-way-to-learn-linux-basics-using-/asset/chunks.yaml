- fmt: "\n“So, I wanted more control. Also, I realised there was a lot of spending.\
    \ I had to share my brand identity, the website, etc. So, I closed down the franchise\
    \ system and started opening branch offices. Of course, this is not a way to run\
    \ businesses. It was my particular case.”\n\n“I don’t know why you are telling\
    \ me this.”\n\n“The first case, where I used to set up a small operation there\
    \ is akin to invoking a function in a program. My process managed it alone.\n\n\
    The second case where I gave out franchises was creating another process, say\
    \ by invoking `fork`. A lot of information had to be duplicated.\n\nThe third\
    \ case was opening a branch office. Only information was shared and not duplicated.\
    \ This is like executing a thread.\n\nA thread is a part of a program that executes\
    \ multiple times, but not as a function. If you work on two files at the same\
    \ time, it is cumbersome for the `kernel` to use functions and run as a monolithic\
    \ block. It can have another instance of a part of the code running, but not as\
    \ a process where everything is duplicated. In thread execution, the program running\
    \ gets it’s own stack and the new thread of execution gets its own stack and so,\
    \ local variables. But it shares (please not duplication, but a share) global\
    \ variables, file descriptors, signal handlers, and its current directory state\
    \ with the process that created it.\n\nSo whereas a franchise has it’s own financial\
    \ bookkeeping, salaries, the branch office shares the financial books. A process\
    \ duplicates while a thread shares and duplicating involves more resources.”\n\
    \n“Yes, now ‘reentrant’ code. A re-entrant function is one which can run, be interrupted\
    \ and then be run again.\n\nThe same routine can be reused in different instances\
    \ and the value of a variable for one instance might not hold good for other.\
    \ So, if a routine alters the value of a variable and it is called again, it won’t\
    \ remember it’s old set of values. It takes the value being sent by the calling\
    \ program.\n\nIn our community, the drinking age is 21. Once my friend’s father,\
    \ a history teacher, Ritesh who stuck to customs like sambhar sticks to shirts,\
    \ was the bar owner. Nothing wrong with that, except he would never allow us into\
    \ the bar. He used to get drunk and when we presented ourselves at the bar door,\
