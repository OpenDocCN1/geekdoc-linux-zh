    # Shell 脚本


    傍晚分，Seema 觉得录下 `Lingaraj` 的课程会更好。这在她回到 `Bengaluru` 后会有很大帮助。但里面也包含了一些他的个人故事，于是她决定不这样做。她为自己做了一些三明治，那天早早睡了。这将会变成一种习惯。


