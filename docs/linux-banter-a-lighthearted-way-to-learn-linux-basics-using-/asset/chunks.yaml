  raw: '“So, I wanted more control. Also, I realised there was a lot of spending.
    I had to share my brand identity, the website, etc. So, I closed down the franchise
    system and started opening branch offices. Of course, this is not a way to run
    businesses. It was my particular case.”


    “I don’t know why you are telling me this.”


    “The first case, where I used to set up a small operation there is akin to invoking
    a function in a program. My process managed it alone.


    The second case where I gave out franchises was creating another process, say
    by invoking fork. A lot of information had to be duplicated. 


    The third case was opening a branch office. Only information was shared and not
    duplicated. This is like executing a thread.


    A thread is a part of a program that executes multiple times, but not as a function.
    If you work on two files at the same time, it is cumbersome for the kernel to
    use functions and run as a monolithic block. It can have another instance of a
    part of the code running, but not as a process where everything is duplicated.
    In thread execution, the program running gets it’s own stack and the new thread
    of execution gets its own stack and so, local variables. But it shares (please
    note not duplication, but a share) global variables, file descriptors, signal
    handlers, and its current directory state with the process that created it.


    So whereas a franchise has it’s own financial bookkeeping, salaries, the branch
    office shares the financial books. A process duplicates while a thread shares
    and duplicating involves more resources.”


    “Yes, now ‘reentrant’ code. A re-entrant function is one which can run, be interrupted
    and then be run again.


    The same routine can be reused in different instances and the value of a variable
    for one instance might not hold good for other. So, if a routine alters the value
    of a variable and it is called again, it won’t remember it’s old set of values.
    It takes the value being sent by the calling program. 


    In our community, the drinking age is 21\. Once my friend’s father, a history
    teacher, Ritesh who stuck to customs like sambhar sticks to shirts, was the bar
    owner. Nothing wrong with that, except he would never allow us into the bar. He
    used to get drunk and when we presented ourselves at the bar door, this was the
    conversation.


    ![](image_rsrc859.jpg)


    ‘Oh Lingaraj. How are you?’ he used to ask.


    ‘I am good Sir. I did well at programming and….’


    ‘I meant to ask, how old are you?’


    ‘25 uncle.’


    ‘Don’t lie to me. You are 20\. I remember you telling that to me.’


    ‘That was 5 years ago, Sir.’


    ‘So what? A record is a record. Get out of here.’


    He wouldn’t have qualified for a reentrant routine. The only re-entrance he used
    to do was into the bar for a refill. So a reentrant function updates for various
    instances.


    It also means, basically work only on the data provided by the caller.


    | #include <pthread.h>int pthread_create(pthread_t *thread, pthread_attr_t *attr,
    void*(*start_routine)(void *), void *arg); |


    returns 0 on success.


    The C library function pthread_create() facilitates a routine to run as a thread.
    It has a name that you can identify the thread with, apart from the function name.
    It is given by  pthread_t *thread. It is of the type pthread_t.


    pthread_attr_t *attr is an attribute which I will explain later.


    void *(*start_routine)(void *), void *arg) is the routine that will run as a thread
    and arg is it’s argument.


    | #include <pthread.h>void pthread_exit(void *retval); |


    This exits from the thread. And unlike functions, you cannot return a variable.
    Because…..?”


    “The variable ceases to exist after the thread.”


    “Right.”


    | #include <pthread.h>int pthread_join(pthread_t th, void **thread_return); |


    This C library function is like the wait system call in processes. Here, pthread_t
    th represents the routine identifier, remember pthread_create?


    It returns a pointer to a pointer to the return value from the thread.


    He opened a file on his laptop.


    thread_program.c


    | #include <stdio.h>#include <stdlib.h>#include <string.h>#include <pthread.h>#include
    <unistd.h>void *print_func(char* message){   printf("%s - Before sleep\n", message);   sleep(4);  
    printf("%s - After waking up\n", message);   }int main(){  pthread_t t1, t2; 
    printf("Main program now running\n");  pthread_create(&t1, NULL, (void *)print_func,
    (void *) "First call to pthread");  pthread_create(&t2, NULL, (void *)print_func,
    (void *) "Second call to pthread");  pthread_join(t1, NULL);  pthread_join(t2,
    NULL);  printf("Back to main after thread join\n");} |


    And then he proceeded to explain.


    | #include <stdio.h>#include <stdlib.h>#include <string.h>#include <pthread.h>#include
    <unistd.h>void *print_func(char* message){   printf("%s - Before sleep\n", message);   sleep(4);  
    printf("%s - After waking up\n", message);   } |


    The above code declares the required header files and prints two messages before
    sleep and after sleep. This is the routine which will be used by two calls. The
    above function will be called twice later on in the program.


    | int main(){    pthread_t t1, t2; |


    Threads are declared.


    |   printf("Main program now running\n"); |


    Just an indicator.


    | pthread_create(&t1, NULL, (void *)print_func, (void *) "First call to pthread");pthread_create(&t2,
    NULL, (void *)print_func, (void *) "Second call to pthread"); |


    Create the thread.


    To differentiate between two instances of the same function running, we have different
    messages that are passed on to the function in each instance. That way, it will
    let you see which thread is running.


    As seen above, the thread is created that calls the print_func function and a
    different message is passed each time. Usually, the best way to pass values is
    to pass a structure to the thread function using pthread_create. It is of the
    form,


    struct thread_args *args


    |   pthread_join(t1, NULL);  pthread_join(t2, NULL); printf("Back to main after
    thread join\n");} |


    Just an indicator to let us know that we are back in the main program.


    So, what do you think the output will be?” Lingaraj asked.


    “I think it will print the things with the first call to pthread and then the
    second call. Like this.


    Main program now  running


    First call to pthread - Before sleep


    First call to pthread - After waking up


    Second call to pthread - Before sleep


    Second call to pthread - After waking up


    Back to main after thread join


    Of course, with the 4 second delay for sleep.” said Seema.


    Lingaraj proceeded to run the program using


    | cc -D_REENTRANT thread_program .c  -lpthread |


    “You would have to compile like this :


    cc -D_REENTRANT thread_program .c –o thread_program -lpthread


    if NPTL(Native Posix Threads Library) is the default in your system.


    ” explained Lingaraj.


    The output was displayed on the screen.


    | Main program now  runningFirst call to pthread - Before sleepSecond call to
    pthread - Before sleepFirst call to pthread - After waking upSecond call to pthread
    - After waking upBack to main after thread join |


    Now, you will notice something amiss. The sequence you predicted is not there.
    While the 1st execution slice was sleeping, the scheduler thought it wise to sneak
    in the the 2nd execution slice. It didn’t wait for the 1st thread to finish execution.
    There is no synchronicity.”


    Lingaraj looked away and as was his habit, into the distance.


    “What is it?”


    “Once, I met this woman who was a believer in synchronicity. I was working in
    animal manure analysis at the time. She was a database analyst. She asked me over
    candle light dinner.


    ![](image_rsrc85A.jpg)


    ‘There is this number 7 that keeps popping up wherever I go and usually when I
    am doing something important. Do you have a number like that?’


    ‘Yes, I see number 2 everywhere.’


    She got up and left.”


    “No wonder!”


    “What if we wanted one piece of code to be locked before the scheduler got the
    next one in.'
