    \ buffer);\n    exit(EXIT_SUCCESS);\n}\n```\n\n由于消费者是一个完全不同的程序，我们可以使用相同的变量名。只有\
    \ FIFO 名称是已知的，且在两个程序中必须保持一致。通过 `open` 调用提供的文件描述符读取 FIFO。然后关闭它。打印出通过 FIFO 传递的消息。这就是我们运行它的方式。\n\
    \n我们创建执行文件，例如命名为 `fifo_prod` 和 `fifo_cons`，并在删除文件 `/tmp/my_fifo` 后。当然，我们也可以在程序中使用\
    \ `access()` 系统调用来检查文件是否存在。\n\n我们在一个终端运行 `fifo_prod`。输出如下：\n\n```\nInput text\
    \ to be passed\n```\n\n然后我们输入：\n\nSeema learns Linux.\n\n由于 `printf` 函数，这会显示在屏幕上：\n\
    \n```\nSeema learns Linux.\n```\n\n然后，你会得到这条消息：\n\n```\nProcess 61178 is opening\
    \ the FIFO in O_WRONLY mode\n```\n\n再次，这是特定的机器和实例。现在，打开另一个终端并运行 `fifo_cons`。\n\
    \n一旦运行它，你就会得到以下消息：\n\n```\nProcess 61182 opening FIFO O_RDONLY\nProcess 61182\
    \ result 3\nProcess 61182 finished, 100 bytes read, message was Seema learns Linux.\n\
    ```\n\n然后提示符出现。在另一个终端中，整个输出为：\n\n```\nInput text to be passed\nSeema learns Linux.\n\
    Seema learns Linux.\nProcess 61191 is opening the FIFO in O_WRONLY mode\nPipe\
    \ succesful\nProcess 61191 finished. Bytes sent - 100\n```\n\n‘Seema learns Linux’\
    \ 并不是 100 字节。但我们把 `buffer` 定义为 100 字节的字符数组。所以两个地方都显示 100。\n"
- fmt: "\nA process waiting for a resource to be available based on the status of\
    \ a variable.\n\nA process executes using a resource when available based on the\
    \ status of a variable.\n\nA process changes the status of a variable after it’s\
    \ job is done.\n\nA process changes the status of a variable before it begins\
    \ it’s job.”\n\n“Ok.”\n\n“In the case of the doctors vs film makers, the switch\
    \ is key.”\n\n“The bulb.” Seema tried to correct.\n\n“They are part of one package.\
    \ The switch comes free with the bulb. They have to be connected, or why else\
    \ would it cause an electric shock?”\n\n“No, the bulb has to be connected with\
    \ the switch or how else would it light?”\n\n“Good perspective.”\n\nNow, system\
    \ calls related to semaphores:\n\n```c\nint semget(key_t key, int num_sems, int\
    \ sem_flags);\n```\n\n`key` is basically the resource identifier.\n\n“Something\
    \ like the operation room. A reference to the operation room.”\n\n“If there is\
    \ a resource `num_sems` is the number of semaphores. Usually 1.\n\n`sem_flags`\
    \ let you modify behaviour. The above system call can return the value of an existing\
    \ semaphore identified by the `key` or if the flag is 0.\n\nOther values of `sem_flags`\
    \ are akin to the mode in `open()`. Write means the value of the semaphore can\
    \ be altered. And execute permission means nothing.\n\nThe least significant 9\
    \ bits of `sem_flags` represent the permissions.\n\nIt returns the semaphore identifier,\
    \ a non negative integer. If it fails, it sets `ERRNO` and returns -1.\n\n“Like\
    \ the switch. A reference to the switch rather.”\n\nThe next system call:\n\n\
    ```c\nint semop(int sem_id, struct sembuf *sem_ops, size_t num_sem_ops);\n```\n\
    \n`sem_id` is what `semget` returned, the semaphore identifier.\n\n`sem_ops` is\
    \ a pointer to an array of structures. The important members are:\n\n```c\nstruct\
    \ sembuf {\n    short sem_num;\n    short sem_op;\n    short sem_flg;\n}\n```\n\
    \n`sem_num` is the semaphore number in terms of count. 0 if it’s only 1 semaphore.\n\
    \n`sem_op` perhaps the most important because it is the value by which the semaphore\
    \ has to be changed. -1 and +1 are the ones generally used.\n\n`sem_flag` is set\
    \ to `SEM_UNDO` and it helps the OS release the semaphore in case the process\
    \ terminates before it releases the semaphore.\n\n```c\nint semctl(int sem_id,\
    \ int sem_num, int command, ...);\n```\n\nThis system call lets you directly control\
    \ semaphore information.\n\nThe first parameter is the semaphore identifier returned\
    \ by `semget()`. `sem_num` again is the semaphore number in terms of count. 0\
    \ for only 1 semaphore.\n\nThe `command` parameter can be:\n\n- `SETVAL`: Used\
    \ at the beginning to initialise the semaphore to a value.\n- `IPC_RMID`: This\
    \ is when you need to delete a semaphore after use.\n\nThere can exist named semaphores\
    \ as well. But I will not get into it.\n\nLet’s look at a program without a semaphore:\n\
    \n`seema_loves_yoga.c`\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <unistd.h>\nint main(int argc,char *argv[]){\n    int i;   \n    pid_t pid;\n\
    \    pid = fork();\n    if(pid < 0)\n    {\n        printf(\"Fork failed.\\n\"\
    );\n        exit(1);\n    }\n    else if(pid == 0)\n    {\n        char *ca1 =\
    \ \"Vijay\";\n        char *ca2 = \"loves football\";\n        puts(ca1);\n  \
    \      fflush(stdout);\n        sleep(4);\n        puts(ca2);\n    }\n    else\n\
    \    {\n        char *ca1 = \"Seema\";\n        char *ca2 = \"loves Yoga\";\n\
    \        puts(ca1);\n        fflush(stdout);\n        sleep(4);\n        puts(ca2);\n\
    \    }\n}\n```\n\nHere, a `fork` is called and each process, the parent and the\
    \ child print a character, twice in a for loop after a sleep. We assume that the\
    \ characters in one process are printed after the other. But, see the output:\n\
    \nSeemaVijay loves football\n\nThe kernel sneaked in the child process while the\
    \ parent process was in the loop and tried to catch, not allowing either the parent\
    \ or the child process to print two strings in sequence. So, we use semaphores\
    \ to get the critical section committed to it. Look at this modified program with\
    \ the semaphore:\n\n`seema_loves_yoga_sem.c`\n\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include <unistd.h>\n#include <sys/sem.h>\n#define KEY 0x1254\n\
    union sem{\n    int val;\n    struct semid_buf;\n    unsigned short *array;\n\
    };\nstruct sembuf p = {0, -1, SEM_UNDO};\nstruct sembuf v = {0, +1, SEM_UNDO};\n\
    int main(int argc,char *argv[]){\n    int id = semget(KEY, 1, 0666 | IPC_CREAT);\n\
    \    if (id < 0)\n    {\n        printf (\"Couldn't create semaphore.\\n\");\n\
    \        exit(EXIT_FAILURE);\n    }\n    union sem u;\n    u.val = 1;\n    if(semctl(id,0,SETVAL,\
    \ u) < 0)\n    {\n        printf(\"Semctl failed.\\n\");\n        exit(EXIT_FAILURE);\n\
    \    }\n    int i;\n    pid_t pid;\n    pid = fork();\n    if(pid < 0)\n    {\n\
    \        printf(\"Fork failed.\\n\");\n        exit(1);\n    }\n    else if(pid\
    \ == 0)\n    {\n        char *ca1 = \"Vijay\";\n        char *ca2 = \"loves football\"\
    ;\n        if(semop(id, &p, 1) < 0)\n        {\n            printf(\"Semop failed\"\
    );\n            exit(EXIT_FAILURE);\n        }\n        puts(ca1);\n        fflush(stdout);\n\
    \        sleep(4);\n        puts(ca2);\n        if(semop(id, &v, 1) < 0)\n   \
    \     {\n            printf(\"Semop failed\");\n            exit(EXIT_FAILURE);\n\
    \        }\n    }\n    else\n    {\n        char *ca1 = \"Seema\";\n        char\
    \ *ca2 = \"loves Yoga\";\n        if(semop(id, &p, 1) < 0)\n        {\n      \
    \      printf(\"Semop failed\");\n            exit(EXIT_FAILURE);\n        }\n\
    \        puts(ca1);\n        fflush(stdout);\n        sleep(4);\n        puts(ca2);\n\
    \        if(semop(id, &v, 1) < 0)\n        {\n            printf(\"Semop failed\"\
    );\n            exit(EXIT_FAILURE);\n        }\n    }\n}\n```\n\nThen Ling proceeded\
    \ to explain:\n\n- `#define KEY 0x1254`: `KEY` defines a semaphore identifier.\n\
    - `union sem{ int val; ...; }`: This is a bit technical, but for practical purposes,\
    \ it will suffice to know you need to define it. This is needed for `semctl`.\n\
    - `struct sembuf p = {0, -1, SEM_UNDO}` and `struct sembuf v = {0, +1, SEM_UNDO}`:\
    \ `p` and `v` signify the decrement and increment operations of the semaphore.\
    \ Like `sem_wait` and `sem_post`.\n- `int id = semget(KEY, 1, 0666 | IPC_CREAT)`:\
    \ We create the semaphore and what follows is the testing whether it is successful\
    \ or not.\n- `semctl(id,0,SETVAL, u)`: We initialize the semaphore.\n- `pid =\
    \ fork()`: We see whether we are in the child process or the parent process and\
    \ execute the relevant code.\n- `else if(pid == 0)`: We commence the semaphore\
    \ decrement. It is a binary semaphore as you might have noticed.\n- `semop(id,\
    \ &p, 1)`: Here, enclosed within the decrement and increment, is the sequence\
    \ with a second delay.\n- `semop(id, &v, 1)`: We shall increment the semaphore.\n\
    \nLet’s see the output.\n"
