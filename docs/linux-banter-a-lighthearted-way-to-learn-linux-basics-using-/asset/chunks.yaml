    ## Overview


    We receive the message in the loop and get it in the `data.received` structure.
    Since the message type size is not included, `BUFSIZ`, the size of the character
    array would suffice. If `msgrcv` fails, we print the relevant message.


    We come out of the loop and print the text in the second member of the structure.
    If the message happens to be ‘enough’, we change the `loop_cond` to reflect 0
    and so, it jumps out of the loop.


    We use `msgctl` to delete the message queue based on `msgid`.


    Exit the program.”


    ## Execution


    “When we run the program, we run `mq_sender.c` on one terminal and `mq_receiver`
    in another terminal. The output is :


    ### On terminal 1:


    | $ ./mq_senderEnter text to be passed. Type ''enough'' to stop: This is from
