    Asha 对 Vijay 并不好，她和他吵架。或者完全删除所有内容。”


    “我将完全删除所有内容。”


    “再次，打开文件的语法是


    | `FILE *fopen(const char *filename, const char *mode);` |


    该 C 库函数返回指向相应文件流的指针。


    | `#include <stdio.h>size_t fread(void *ptr, size_t size, size_t nitems, FILE
    *stream);#include <stdio.h>size_t fwrite(const void *ptr, size_t size, size_t
    nitems, FILE *stream);` |


    在上述 C 库函数中，从 `fopen` 返回的文件流被用于读和写操作。`fread()` 和 `fwrite()` 返回写入或读取的数据的大小。


    | `#include <stdio.h>int fclose(FILE *stream);` |


    `fclose` 关闭文件。即使没有调用 `fclose()`，文件也会关闭。但它并不是完全多余的。`fclose()` 返回一个整数，可以在失败时用于检查错误。


    | `#include <stdio.h>int fflush(FILE *stream);` |


    这会导致文件流上的数据立即写入。如果你正在使用 `fclose()`，则不需要使用它，因为调用 `fclose()` 会执行刷新操作。


    | `#include <stdio.h>int fseek(FILE *stream, long int offset, int whence);` |


    `fseek` 将你带到文件的特定位置。


    | `#include <stdio.h>int fgetc(FILE *stream);int getchar();` |


    `fgetc` 从文件流中读取下一个字节作为字符。


    `getchar` 从标准输入读取字符。


    | `#include <stdio.h>int fputc(int c, FILE *stream);` |


    `fputc` 将字符放入文件流中。


    | `int putchar(int c);` |


    `putchar` 将字符输出到标准输出。


    | `#include <stdio.h>char *fgets(char *s, int n, FILE *stream);char *gets(char
    *s);` |


    `fgets` 从文件流读取字符并写入字符串。


    “那 `gets` 呢？它是做什么的？”Lingaraj 出其意地问道。


    “`gets` 从标准输入读取字符并写入字符串。”Seema 勤奋地回答。


    “据我所知，它的功能强大得多，建议不要使用它。”Lingaraj 警告道。


    | `#include <stdio.h>int printf(const char *format, ...);int sprintf(char *s,
    const char *format, ...);int fprintf(FILE *stream, const char *format, ...);`
    |


    “我希望你在 C 语言中涵盖过这些，”Lingaraj 问道。


    “是的，我会解释。


    `printf` 在标准输出上产生输出。


    `sprintf` 写入字符串。


    `fprintf` 写入流。”


    | `%d` | `%i` |

    | `%o` |

    | `%c` |

    | `%s` |

    | `%f` |

    | `#include <stdio.h>int scanf(const char *format, ...);int fscanf(FILE *stream,
    const char *format, ...);int scanf(const char *s, const char *format, ...);` |


    `scanf` 从标准输入获取数据。


    `fscanf` 来自流


    而 `sscanf` 来自字符串。


    这让我想起了死，”Lingaraj 说。


    “这并不是说流和文件描述符像水火不容，”


    | `#include <stdio.h>int fileno(FILE *stream);FILE *fdopen(int fildes, const char
    *mode);` |


    `fileno` 告诉你流的文件描述符


    `fdopen` 根据文件描述符打开文件流。`fopen` 也打开了文件，但使用的是文件名。


    所以，文件描述符和流之间有联系，这并不是一种极化的选择路径。


    以下是伪代码。一种构建程序的方法。伪代码通常更易理解，但既然我在这里和你在一起，我想我们可以跳过详细的指导部分。这是一个使用 `FILE` 流从一个文件读取并写入另一个文件的程序。这不是一个完整的程序，因为完整的程序可能是在喂养你。我希望你根据这些信息编写一个程序并在你的系统上尝试。”Lingaraj
    向 Seema 展示了他笔记本电脑上的一个文本文件。

