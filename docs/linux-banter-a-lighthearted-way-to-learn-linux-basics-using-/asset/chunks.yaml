    ![](img/image_rsrc820.jpg) Linux 闲谈


    Linux® 是 Linus Torvalds 在美国及其他国家的注册商标。


    所有人物均为虚构。与任何在世或已故人士的相似之处纯属巧合。


    ## GNU 通用公共许可证


    书中的源代码根据 `GNU General Public License` 第 3 版条款提供，网址为 `http://www.gnu.org/licenses/gpl-3.0.en.html`


    ## 免责声明


    某些依赖机器的源代码在某些机器上可能运行，也可能无法运行。所有代码都在我们的计算机上进行过测试，我们没有发现任何可能损害系统的东西。然而，我们对误用这些程序对您的系统造成的任何损害不负责。


    ## 本书的读者群体


    本书是那些对了解 Linux 技术细节及其功能感兴趣的人士准备的。它概述了用于编写程序的的工具以及 Linux 提供的功能。请注意，本书旨在作为结合某些 Linux
    基础知识的易读读物。这不是一本关于 Linux 管理的书，也不传授有关安装的知识。我们还敦促您负责且自信地使用这个名为计算机的强大系统，它是由专业人士多年辛勤工作构建的，是文明进步的典范和稳定基础。编程具有巨大的潜力，绝对可以为世界带来积极的变化。希望你在这个过程中得愉快。本内容概述了使用编程语言进行编程的各种方式。由于程序数量巨大以及全球各地的高效贡献，本书无法涵盖
    Linux 的所有方面，但提供了一个让读者可以入门的基础。


    ## 先决条件


    你需要一个安装了 GNU C 的 Linux 系统，并具备 C 语言的基础基础知识。


    | 索引 | 页码 |

    | :--- | :--- |

    | 引言 | 4 |

    | Shell 脚本 | 51 |

    | C 编译器 | 83 |

