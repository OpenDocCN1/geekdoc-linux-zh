    \ 更新是异步调度的，但调用立即返回。\n- `MS_SYNC`: 请求更新并等待其完成。\n- `MS_INVALIDATE`: 使相同文件的其他映射失效。（当你想要用新写入的值进行更新时有用。）\n\
    \nSeema 试图解释这些标志。\n\n“`MS_ASYNC` 就像要求你的下属去做工作，告诉他然后回来。`MS_SYNC` 就像在那里直到工作完成。`MS_INVALIDATE`\
