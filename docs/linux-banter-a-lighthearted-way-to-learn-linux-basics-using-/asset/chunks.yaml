    “I get the drift. ‘Thing Thimma’ has a nice ring to it.” said Seema.


    “So, Thimma treats everything as a thing. From nuts, gears, press, machines, the
    phone etc. And Linux, too does the same. Everything is a file. From text files,
    programs, directories, devices, Linux treats everything as a file.”


    “Ok”


    “In Linux there are commands to work with files. Now ‘open’. What does this command
    do?” Lingaraj asked Seema.


    “Opens the file.”


    “Close?”


    “Closes the file.”


    “Read?”


    “Reads the file. Wish this OS was there when I had to read all those books in
    school. It would have read it all for me.”


    “To write a program to make the system read it for you and to transfer it all
    to your brain, would have meant even more reading. Now, ‘write’?”


    “Writes to the file. This is so easy. We should have started with this.”


    “‘ioctl’?”


    “Errr….‘ioctls’ the file?”


    “One day, when you have to program Vijay, this will be important to you. It passes
    the control to a device driver.”


    Seema looked questioningly.


    “His heart. Do you think his heart’s still in there? What’s the latest update
    about him?”


    “The doctor said he stared at a picture of us we took, when we had visited this
    Pizza joint a long time ago, for 2 hours straight.”


    “Seems like a positive development.”


    “Then the doctor placed my phone number in front of him. He then called me and
    ordered five pizzas.”


    “Poor guy, did you send them?”


    “No!”


    “Moving along, there are directories which store files. They are also considered
    files in Linux, but special ones. Can be accessed by the high level interface
    ‘opendir’ or ‘readdir’. High level does not mean something elite. It means it
    is higher because a lot of programming is below it. It is not a direct access
    to the system, but through a lot of programs.”


    “As a man, you tell me in which directory does he store his love files.”


    Lingaraj looked inspired.


    “Actually, this gives me inspiration to write love poetry.”


    Lingaraj sat down on a stone and started typing in his laptop.


    “I have your love files in my heart directory


    My heart is now, a love producing factory


    You just say opendir or readdir


    And it will be like drinking elixir”


    Lingaraj looked dreamily towards the sugarcane fields.


    “What was your question?” he asked after a while.


    “Forget it.”


    “Anyway, the file’s creation, permissions are stored in the inode. Inode can be
    thought of as a social number card for the file.”


    Once I had a fight with this guy Prathap. It was over who gets a photo with a
    bison.


    ![](image_rsrc848.jpg)


    I loathed him so much that I began tracking him. I got so much of his info that
    when he was getting married, his fiance came to meet me.”


    ![](image_rsrc849.jpg)


    “To make you both friends again?”


    “No, she wanted to know more about Prathap from me as I knew more about him than
    anybody else. I had become like an ‘inode’ for him. Collecting all the information.”


    “How did you get out of it? This hatred?”


    “Oh, I forgave him.”


    “How?”


    “After I saw him fend off three bison from attacking me and my family when I was
    sleeping. Actually I was only pretending to be asleep. I would have stepped in
    if he had perished and quelled the bison myself. But he did what he could.”


    “Where is he now?”


    “He is in Kenya now making documentaries on bison. He sent me his video link a
    couple of years ago.”


    “Is it good?”


    “I can’t say, I didn’t watch it.”


    “There’s this thing called courtesy and gratitude.”


    “Anyway, back to directories. A directory simply holds the inode numbers of all
    the files that are in it. If a file is deleted, the inode entry in the directory
    is deleted. The number of links for that file goes down by one. If the file is
    in 2 other directories, it means it has 2 links. If the files in both the directories
    are deleted, the number of links go to zero. The data blocks that it possessed
    is marked free. How do you get to your home directory?”


    “cd? Right?” asked Seema.


    “There is one more way. The cd tilde.


    | $ cd ~ |


    I have a knock knock joke.


    Knock knock.”


    “Who’s there?”


    “Tilde”


    “Tilde who?”


    “Till date no one’s opened their heart for me.”


    “I am really tired.”


    The session was over and Seema was introduced to a guy with a boat by Lingaraj.
    The boatman took her on a boat ride and Seema enjoyed it very much.


    The next day. Lingaraj continued at his house.


    Let’s look at some hardware files. Three of them. We start with.


    | dev/console |


    This is the system console. A place where messages are usually displayed.


    | dev/tty |


    This is the controlling terminal. That is where the control of the system externally
    is coming from. And the messages go there.


    | dev/null |


    As told earlier, it is like a hollow in the tree. Most of what my great grandfather
    told in his later years were diverted to this hollow. The interesting thing is,
    I still hear his voice in the hollow. Maybe his ghost lives there. Do you want
    to see it?”


    “No!”


    “There is /dev/zero as well, which gives an endless supply of zeros if you read
    from it.”


    “Who would want many zeros. Useless, I think.”


    “I would. The difference between me and the richest man in our community is actually
    useless zeros as you say. But they come after the 1.”


    “Character and block devices. Character devices deal with one character at a time,
    whereas block devices deal with one block of data at a time.


    It’s like writing. If you are writing a phone number, you do it one character
    at a time. But if you were reading a story, you read a word, a block of data at
    a time. Like pigeons eat one grain at a time and dogs eat a whole chunk at a time.”


    “This was the first example you gave me without involving a weird character from
    your community.”


    “Wait, let me finish. I was once in a fight with a robber in the city. He was
    ![](image_rsrc84A.jpg)stealing my audio cables. He threw punches at me, like a
    character device.


    But I took them all and gave him a solid shot with my hard disk, like a block
    device, which floored him.


    ![](image_rsrc84B.jpg)


    Will help you remember.”


    “The difference between character and block devices?”


    “No, it will help you remember me as a hero. You said you would introduce some
    friends. Tell them this story.”


    Seema began to count how many friends she would lose.


    “Anyway, ‘ioctl’ is usually used not to pass input and output, but to make the
    device work which the software can’t do. Like reset the printer to it’s starting
    point. Or to rewind a tape drive, etc. Each driver has it’s own set of ioctl commands.


    If you get to Vijay’s hand driver, you can program it to keep holding your hand.
    And when a bad guy approaches, you can program his hands and legs drivers to fight
    them. And maybe go on to participate in competitions. Maybe become a prize fighter.
    Maybe get into movies and earn money. I can be his programmer and we can show
    off Vijay to the world. It will be like a consolation for me.”


    “That’s not what I came to you for. What do you mean consolation?”


    “I made a robot once that looked exactly like me.


    ![](image_rsrc84C.jpg)


    It used to act in movies in Bangalore and I had programmed it to fight well. After
    the robot was back home, I used to charge it and then go out and bask in all the
    glory of being a film celebrity.


    ![](image_rsrc84D.jpg)


    One day I forgot to charge the robot and I had to go personally to the film scene
    being shot, which I found out later was a fight scene. The stunt director came
    and spoke to me.


    ![](image_rsrc84E.jpg)


    He said, “Sir, you hit 50 fighters yesterday. Today, I have got 100 fighters for
    the climax. Action!”


    ![](image_rsrc84F.jpg)


    There was action indeed. And lot of cuts.”'
