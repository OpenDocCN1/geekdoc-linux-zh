  trans: "\n让我给你说一个场景。当我叔（一名医生）在他私立医院的手术室里时，他们会锁上门以防手术正在进行。手术一旦完成，他们就会通过解锁来打开门。\n\n\
    如果门没锁，电影剧组就会进去拍摄视频，因为那是唯一有大灯的房间。在他们操作期间，他们会锁上门。工作完成后，电影剧组通常会解锁门。\n\n## 互斥线程\n\n\
    什么是互斥线程？它们是什么？它们是能够被阻塞的资源。例如，如果你和 Vijay 在一起，而他一直被足球赛分心，你该如何阻塞他的资源，好让足球赛和摔跤比赛都无法获得他的兴趣呢？”\n\
    \n“简单，我会在身上用一个互斥线程程序。”Seema 正在进行研究，而且很快。\n\n“简单？祝你好运吧，这并不是因为互斥锁程序很难，而是要把他的注意力从足球上移开很难。互（mutex，mutually\
    \ exclusive 的缩写）会锁定代码的关键区域，使得锁定程序在其他人尝试之前能够先完成操作。还记得‘锁锁拉克什曼’（Lock Lakshman）吗？”Lingaraj\
    \ 展示了一个 C 库函数。\n\n```c\n#include <pthread.h>\nint pthread_mutex_init(pthread_mutex_t\
    \ *mutex, const pthread_mutexattr_t*mutexattr);\n```\n\n初始化互斥锁 `*mutex`，它是基于线程函数的。\n\
    \n`const pthread_mutexattr_t *mutexattr` 这需要一些解释。留到以后再说。\n\n```c\nint pthread_mutex_lock(pthread_mutex_t\
    \ *mutex));\n```\n\n这锁定了资源。\n\n```c\nint pthread_mutex_unlock(pthread_mutex_t\
    \ *mutex);\n```\n\n这解锁了资源。\n\n```c\nint pthread_mutex_destroy(pthread_mutex_t\
    \ *mutex);\n```\n\n这将销互斥锁并进行清理。\n\n“让我们来看一个程序。”\n\n“好的。”\n\n“互斥锁程序。在此之前，是我们聊过的线程程序。\n\
    \n### thread_program .c\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <string.h>\n#include <pthread.h>\n#include <unistd.h>\nvoid *print_func(char*\
    \ message){\n  printf(\"%s - Before sleep\\n\", message);\n  sleep(4);\n  printf(\"\
    %s - After waking up\\n\", message);\n}\nint main(){\n  pthread_t t1, t2;\n  printf(\"\
    Main program now running\\n\");\n  pthread_create(&t1, NULL, (void *)print_func,\
    \ (void *) \"First call to pthread\");\n  pthread_create(&t2, NULL, (void *)print_func,\
    \ (void *) \"Second call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2,\
    \ NULL);\n  printf(\"Back to main after thread join\\n\");\n}\n```\n\n输出结果：\n\n\
    ```\nMain program now running\nFirst call to pthread - Before sleep\nSecond call\
    \ to pthread - Before sleep\nFirst call to pthread - After waking up\nSecond call\
    \ to pthread - After waking up\nBack to main after thread join\n```\n\n正如之前解释的，这里没有同步性。我们使用互斥线程。\n\
    \n回到程序，现在加上了互斥锁。\n\n### thread_with_mutex.c\n\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\n\
    pthread_mutex_t mutex1 = PTHREAD_MUTEX_INITIALIZER;\nvoid *print_func(char* message){\n\
    \  pthread_mutex_lock(&mutex1);\n  printf(\"%s - Before sleep\\n\", message);\n\
    \  sleep(4);\n  printf(\"%s - After waking up\\n\", message);\n  pthread_mutex_unlock(&mutex1);\n\
    }\nint main(){\n  pthread_t t1,t2;\n  pthread_mutex_t mutex1;\n  pthread_mutex_init(&mutex1,\
    \ NULL);\n  pthread_create(&t1, NULL, (void *)print_func, (void *) \"First call\
    \ to pthread\");\n  pthread_create(&t2, NULL, (void *)print_func, (void *) \"\
    Second call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n\
    \  printf(\"Back to main after thread join\\n\");\n}\n```\n\n我来解释一下。\n\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n\
    #include <unistd.h>\npthread_mutex_t mutex1 = PTHREAD_MUTEX_INITIALIZER;\n这初始化了互斥锁\
    \ mutex1。\nvoid *print_func(char* message){\n  pthread_mutex_lock(&mutex1);\n\
    我们在这里锁定了互斥锁。后面是代码的关键区域。\n  printf(\"%s - Before sleep\\n\", message);\n  sleep(4);\n\
    \  printf(\"%s - After waking up\\n\", message);\n  pthread_mutex_unlock(&mutex1);\n\
    我们在这里解锁了互斥锁。\nint main(){\n  pthread_t t1,2;\n  pthread_mutex_t mutex1;\n  pthread_mutex_init(&mutex1,\
    \ NULL);\n  pthread_create(&t1, NULL, (void *)print_func, (void *) \"First call\
    \ to pthread\");\n  pthread_create(&t2, NULL, (void *)print_func, (void *) \"\
    Second call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n\
    \  printf(\"Back to main after thread join\\n\");\n}\n```\n"
- fmt: "\n`sem_open()` creates a new POSIX semaphore or opens an existing semaphore.\
    \ The semaphore is identified by name. It returns the address of the semaphore.\n\
    \n```c\n#include <semaphore.h>\nint sem_destroy(sem_t * sem);\n```\n\nThis destroys\
    \ the semaphore as the name of the function suggests. It also tidies up resources.\n\
    \nComing back to the light on-off parallel. A fussy film star waiting, would keep\
    \ asking the director to check for the status of the light if he’s outside and\
    \ the doctors are inside. This won’t be encouraged and the actor will be kicked\
    \ out of the sets, film star or not. When it turns off, the team will know. Because\
    \ the program is always on the lookout for that. Like these people who are always\
    \ on the lookout for a discount or a free coupon.\n\nSo, to program, you could\
    \ start a thread with `pthread`. That will keep running. You create a semaphore\
    \ and you tell the kernel, what happens when the semaphore value is 0. This starts\
    \ a routine. You can tell what happens when the semaphore has a value. But you\
    \ don’t have to tell the program, keep looking for the variable and check whether\
    \ it goes to 0 or whether it is positive in the program. It’s the job of the system.\
    \ Let’s modify the program naming it `thread_sem_program.c`, this time with semaphores.\
    \ Be sure to include `semaphore.h`.\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <string.h>\n#include <pthread.h>\n#include <unistd.h>\n#include <semaphore.h>\n\
    sem_t semap1;\nvoid *print_func(char* message){\n    sem_wait(&semap1);\n    printf(\"\
    %s - Before sleep\\n\", message);\n    sleep(4);\n    printf(\"%s - After waking\
    \ up\\n\", message);\n    sem_post(&semap1);\n}\nint main(){\n  sem_init(&semap1,0,1);\n\
    \  pthread_t t1, t2;\n  printf(\"I am in main\\n\");\n  int iret1 = pthread_create(&t1,\
    \ NULL,(void *) print_func, (void *) \"First Instance\");\n  int iret2 = pthread_create(&t2,\
    \ NULL, (void *) print_func, (void *) \"Second Instance\");\n  pthread_join(t1,\
    \ NULL);\n  pthread_join(t2, NULL);\n  sem_destroy(&semap1);\n  printf(\"Back\
    \ to main after thread join\\n\");\n}\n```\n\nI will run it like this:\n\n```bash\n\
    cc -D_REENTRANT thread_sem_program.c -lpthread -lrt\n```\n\nThe output again,\
    \ is\n\n```\nMain program now running\nFirst Instance - Before sleep\nFirst Instance\
    \ - After waking up\nSecond Instance - Before sleep\nSecond Instance - After waking\
    \ up\nBack to main after thread join\n```\n\n“How is Vijay doing now?”\n“He doesn’t\
    \ remember a few things about how we spent time with each other.”\n“The keyboard\
    \ that you speak of, does he hand it over to anybody and everybody to let himself\
    \ be programmed?”\n“You are making me anxious.”\n“Then you better learn fast.”\n\
    “Thanks for understanding. I need a couple of days break. I need to see Vijay.”\n\
    “Sure.”\n\nSeema called the same cab driver and left for Bangalore. She came back\
    \ after a couple of days and walked into Lingaraj’s house.\n\n“How was your trip?”\
    \ asked Lingaraj.\n“It was nice to see him, he’s changed for the better. But he’s\
    \ become secretive, I feel. What did you do?” she asked Lingaraj.\n“I posed at\
    \ the edge of a cliff to take a selfie when a strong gust of wind….”\n“He hardly\
    \ notices I am there. He keeps calculating football moves and tells their outcome\
    \ beforehand.” Seema interrupted.\n“That’s awesome!”\n\nSeema stared at Lingaraj.\
    \ Lingaraj looked away and continued.\n\n### Thread Attributes\n\nYou throw a\
    \ party and you arrange for cooks and bartenders to the party. Some of your friends\
    \ might have come with their drivers, some by a cab and some running. There are\
    \ people like that. After the party is over, your friends go back. You would want\
    \ to know if a friend reached home. So, you call her and find out whether she\
    \ reached home safe. Now, the cook who had come, you won’t call him to find out\
    \ if he reached home safely. More so, if the prepared food was not good and you\
    \ find out he had also partaken of some drinks without your permission.\n\nSo,\
    \ if you imagine these two going back home processes to be threads, one is an\
    \ attached thread and the other is a detached thread. So, to a thread you can\
    \ specify attributes that tell it to behave in a particular way. This is the list:\n\
    \n```c\n#include <pthread.h>\nint pthread_attr_setdetachstate(pthread_attr_t *attr,\
    \ int detachstate);\nint pthread_attr_getdetachstate(const pthread_attr_t *attr,\
    \ int *detachstate);\nint pthread_attr_setschedpolicy(pthread_attr_t *attr, int\
    \ policy);\nint pthread_attr_getschedpolicy(const pthread_attr_t *attr, int *policy);\n\
    int pthread_attr_setschedparam(pthread_attr_t *attr, const struct sched_param*param);\n\
    int pthread_attr_getschedparam(const pthread_attr_t *attr, struct sched_param*param);\n\
    int pthread_attr_setinheritsched(pthread_attr_t *attr, int inherit);\nint pthread_attr_getinheritsched(const\
    \ pthread_attr_t *attr, int *inherit);\nint pthread_attr_setscope(pthread_attr_t\
    \ *attr, int scope);\nint pthread_attr_getscope(const pthread_attr_t *attr, int\
    \ *scope);\nint pthread_attr_setstacksize(pthread_attr_t *attr, int scope);\n\
    int pthread_attr_getstacksize(const pthread_attr_t *attr, int *scope);\n```\n\n\
    This is quite a list and appears daunting. Before you start using any of them,\
    \ you need to initialise a thread attribute object.\n\n```c\n#include <pthread.h>\n\
    int pthread_attr_init(pthread_attr_t *attr);\n#include <pthread.h>\nint pthread_attr_destroy(pthread_attr_t\
    \ *attr);\n```\n\nThe first function will initialise the thread attribute object\
    \ and the second will destroy the thread attribute object.\n\n“You hardly created\
    \ the thread and so soon you are talking of destroying it.”\n“Probably a complex.\
    \ Whenever I enter a video game, especially a shooting game, my avatar gets destroyed\
    \ instantly. And I was so stupid I used my real name to get into these games.\
    \ It so happened that I met these guys when I was playing.”\n\n```c\nint pthread_attr_setdetachstate(pthread_attr_t\
    \ *attr, int detachstate);\n```\n\nIt has two arguments, the attribute object\
    \ pointer and the flag `detachstate`. In the flag you can specify:\n- `PTHREAD_CREATE_JOINABLE`:\
    \ This is the default, where you have to call the thread to join.\n- `PTHREAD_CREATE_DETACHED`:\
    \ This is where you don’t care. You cannot call the thread join function. So you\
    \ will never find out if the cook reached home or not.”\n\n```c\nint pthread_attr_getdetachstate(const\
    \ pthread_attr_t *attr, int *detachstate);\n```\n\nThis tells you the current\
    \ state of the thread. Notice that the `int detachstate` was something you specified.\
    \ Here, you are specifying a pointer in which will be returned the value of the\
    \ current state.\n\n```c\nint pthread_attr_setschedpolicy(pthread_attr_t *attr,\
    \ int policy);\nint pthread_attr_getschedpolicy(const pthread_attr_t *attr, int\
    \ *policy);\n```\n\nIn a party, there will always be speakers who want the mic.\
    \ But you can specify who gets the centre stage by scheduling. Whoever comes first\
    \ will get the mic first or by round robin. Scheduling is the prerogative of the\
    \ scheduler in the kernel, but you can get into the act and take even more control.\
    \ You can specify which threads have more priority. Whether a thread can be pre\
    \ empted by an other thread or not.”\n\n“No equal treatment.”\n“If there is a\
    \ mutex lock on one resource, you can schedule which thread gets the resource,\
    \ in case multiple threads are running, once the mutex is unlocked.”\n\nThe second\
    \ function returns the state in `*policy`.\n\n```c\nint pthread_attr_setschedparam(pthread_attr_t\
    \ *attr, const struct sched_param*param);\nint pthread_attr_getschedparam(const\
    \ pthread_attr_t *attr, struct sched_param*param);\n```\n\nThis allows you to\
    \ control the scheduling of threads running with schedule policy `SCHED_OTHER`.\n\
    \n```c\nint pthread_attr_setinheritsched(pthread_attr_t *attr, int inherit);\n\
    int pthread_attr_getinheritsched(const pthread_attr_t *attr, int *inherit);\n\
    ```\n\nThis can take two values:\n- `PTHREAD_EXPLICIT_SCHED` and\n- `PTHREAD_INHERIT_SCHED`.\n\
    \nThis only means whether a new thread’s scheduling is set by the attributes or\
    \ whether the scheduling is inherited from the thread that created it.\n"
