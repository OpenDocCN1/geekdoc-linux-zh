    n\");\n                continue;\n            case 'd':\n                printf(\"\
    你想要一个特定的设计。设计是 %s。\\n\", optarg);\n                continue;\n            case\
    \ 'a':\n                printf(\"你为这个有预算。预算是 %s。\\n\", optarg);\n            \
    \    continue;\n            case '?':\n                if (optopt == 'a')\n  \
