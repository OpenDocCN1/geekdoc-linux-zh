    您应该记住，通过在整个硬盘上安装 Ubuntu，您将擦除驱动器上当前的所有数据。在实际驱动器上安装 Ubuntu 之前，请备份所有数据！如果这让您感到，您可能想尝试
    Live（即时运行）安装。如果您还想在安全且远离易损坏硬件的地方保留另一份备份副本，可以尝试诸如 Jungle Disk 之类的云端程序。虽然订阅费用很低，但这项服务非常值得，而且与
    Linux 兼容性良好。![Description: 00008.jpeg](img/rsrcB3.jpg)[www.ubuntu.com](http://www.ubuntu.com)


    ### 对于 CD/USB (Live) 安装

    如果您明智地选择了现场环境安装，一旦下载并从 CD 或 USB 重启，您只需按照一系列提示操作即可。某些提示只需要您提供简单信息，例如语言和偏好。某些提示将询问您此后想对系统进行什么，或者谁可能有权访问该系统。其他提示包括一个关于分区的问题（针对高级用户）。如果系统不允许允许您在
    Windows 上使用某些较新版本的内核启动 Linux，您可能需要禁用“安全启动”（Secure Boot）设置。


    重启后，您会立即看到标签页包含了功能、应用程序、浏览器浏览器以及类似于 MAC 或 Windows 的工具。“主页”或“我的电脑”就是您的“C”盘。


    注意：如果您的计算机没有读取 CD 或 USB 并自动安装，请尝试按 `F12` 键进入菜单以允许启动。


    ### 虚拟化

    任何发行版的另一个很棒的功能是虚拟桌面，它允许您在不同的操作系统之间切换。虚拟桌面正是如此。它是虚拟环境中的用户界面，存储在远程服务器上而不是本地。虚拟操作系统运行在一个应用程序内部。这比双启动要简单得多且高效得多。


    您可以在应用程序中获取这些程序。Linux 上流行的程序有 Microsoft Virtual PC、VMWare、VMWare Workstation 或
    VirtualBox。对这些进行一些研究以探索这一选项。![Description: 00009.jpeg](img/rsrcBG.jpg) VirtualBox
    Manager 截图 (www.lifehacker.com)


    ### 双启动选项

    因此，您可以选择安装 Linux 或使用现场环境。您也可以选择单独运行 Linux，完全删除您当前的操作系统并用 Linux 代替。您还可以选择让它与您当前的系统（如
    Windows）并排运行。


    如果您选择了后者，可以对系统进行分区以允许两者运行，并根据需要它们之间切换。能够排除 Windows 故障或恢复数据是拥有分区或 Live USB/光盘的另一个好处。有些人喜欢同时拥有两种类型系统的选项，而另一些人将专门保留其中一种。


    维护两者的一种方法是设置双启动配置，这样您实际上保留两个操作系统。Wubi 是一个可以自动化安装的程序，它不会影响计算机的分区（划分区域）。如果您想探索这个，请访问
    Wubi 网站：`www.wubi-installer.org` 获取该程序。


    如果您更精通技术，可以手动创建自己的双启动安装并创建分区。另一个需要注意点是，如果您有 MAC OS，在共享空间时可能有其他需要考虑的因素。系统可能需要一些特殊的东西帮助共存。可以安装
    `rEFInd` 程序，它将帮助您在启动时访问所需的特定操作系统。


    ### Ubuntu 桌面版的外

    到目前，您已经选择了一个您喜欢的版本，并决定使用 Ubuntu 桌面版。这是您一旦启动运行后，桌面版可能的样子。如您所见，GUI（图形用户界面）提供了一个让
    Windows 和 MAC 用户感到非常熟悉的界面。您将看到图标、任务栏、工具，并看到如何通过切换窗口来实现多任务处理。![Description: https://lh4.googleusercontent.com/-EWTRspY-VMK2q4-bfDD8TOL9OgpBu45zf6EDst882BcpBtZDrTyXflVCquzTXnKkIfni6iytrBH8SF3Yo8BQ7SVC7-qUjEQi9P6QZWdNZtlKOuB_0ffqmVXUXp3sX4Qvk86JtODKW5EPMecgg](img/rsrcBY.jpg)![Description:
    https://lh3.googleusercontent.com/3SjcNeAKgJ2yya9yZqXApBIkKLHZM4lbz0TNgFv5hB7eCn06kT6j6-wAsiFE56sHRcy2UCznMQ0or0M0SDSmTu4QFUsFgx1TX-MPikPKM2GylwxCd4QpjsgpdRaAG5Tupk8OLFvd29rrD2VfA](img/rsrcC4.jpg)


    ### 服务器版

    同样，以 Ubuntu 作为安装示例，您将开始从网站 `[www.Ubuntu.com](http://www.ubuntu.com)` 获取并下载 ISO
    文件。根据任务选择所需的版本（桌面、笔记本电脑、服务器、云端等），并在检查计算机设置后刻录您需要的版本。确保要求是兼容的。


    如果您想要服务器，可能想选择更大的位宽。将其下载到光盘或 USB 中（再次在现场环境中进行，这是更优的），然后从这里重启而不是从硬盘启动。![Description:
    https://lh3.googleusercontent.com/Yu7J2QzGQ74jaEhHKs4pczyzcQ12UWRnnaJ2T3RN_EYKDqqds_9rXsKTPRkv9LaiBmjxScaeQZXa3n2vpPNmiHDDgzE_TVq2K7tUbj9-EZ4fLVjjs4h7vWSxAjVCxmXIPvd6TrKZ](img/rsrcCA.jpg)
    由于文件体积大且互联网速度限制，可能需要一些时间。请耐心等待。它也不会占用太多空间。系统的老旧也没有关系。在大多数情况下，您可以追溯 5-6 年并使用旧系统。记住，服务器版是精简的，没有图形界面。![Description:
    https://lh5.googleusercontent.com/2nMDJVsLCTqRhAL8EYXwN5EnJxqhXm6CHHtpatyJlroOWjEyKQWa-v9ue_gt6HmVroBZ89Gmd-UWzkBJUw0WfUYgJmrN6NrHjDSQ9Q47TC3xmq7wBl8_BtQHJDI7Ew7Q](img/rsrcCF.jpg)
    Ubuntu 安装启动菜单 (www.pendrivelinux.com)


    第 6 章：安装类型

    Debian 提供了多种方法进行正确设置。这包括图形界面安装和文本界面安装。


