    websites online, and word processing applications such as OpenOffice for when
    you need to type documents, etc. Again, installation is a pretty simple procedure;
    you just click a few buttons and you are good to go.Download – Just like with
    the server version, go to http://www.ubuntu.com/ and download the desktop version
    of Ubuntu Linux.![Description: 00029.jpeg](rsrc6Z.jpg)Click the option on top
    that says "Desktop" to proceed to the page where you can download the desktop
    version of Ubuntu.![Description: 00030.jpeg](rsrc74.jpg)Once you are there, go
    ahead and click on the orange button that says "Download Ubuntu." After you click
    that, you will be presented with two versions of the desktop version of Ubuntu
    Linux: Ubuntu 14.04.4 LTS and Ubuntu 15.10.If you notice on the right hand side,
    it will ask you to choose your flavor of that particular version. This is them
    asking you whether you want to 32-bit or the 64-bit version of the Ubuntu Linux
    desktop. Just choose the version that applies to your system and then click "Download."![Description:
    00031.jpeg](rsrc7A.jpg)Go ahead and wait until ISO file download is finished.
    Once that''s done, burn that ISO file to a CD or DVD, put that into the system
    where you want to install Linux, and then boot off of it. Now we''ll proceed with
    the installation process.The interesting part that you will probably notice during
    the desktop version''s installation is that it will give you two options: try
    Ubuntu or install Ubuntu. The curious thing about Linux is that they have things
    called Live CDs. What a Live CD means is that the entire operating system is installed
    and can be run off of the CD.When you are dealing with Windows, Mac OS, or even
    Linux server, you always have to install the operating system for it to work on
    the computer. With a Live CD, you can actually boot straight off of the CD and
    use all of the functionality of the operating system without installing it. You
    can surf the web, manage files, edit text, etc. by just running the entire operating
    system from the CD itself.In addition, if you have a Windows computer, you can
    put in a Linux Live CD, boot from it, and do whatever you want to do with it without
    affecting the computer at all. This is a great way for a user to test a particular
    Linux distribution first without going through the lengthy installation process.So,
    going back to our installation process, just go ahead and click install Ubuntu
    for now.![Description: 00032.jpeg](rsrc7K.jpg)Next, you will be asked to choose
    your region and time zone. Go ahead and choose the region and time zone that applies
    to you and click "Forward."![Description: 00033.jpeg](rsrc7S.jpg)Again, just like
    in the server edition, the installation will now ask you to choose your keyboard
    layout. Go ahead and choose the one that applies to you and click "Forward."![Description:
    00034.jpeg](rsrc7X.jpg)Next, the installation will ask you to prepare the disk
    space in your hard drive prior to installation. If you want to use your entire
    disk for Ubuntu alone, go ahead and choose the option that says, "Erase and use
    the entire disk." However, if you have another operating system on your hard drive
    and you want to install Linux inside a different disk partition, then choose the
    option that says, "Specify partitions manually."Specifying partitions manually
    involves telling the installation process how much disk space you want to allocate
    for the Linux installation. For now, since you are still a beginner, let us assume
    that you are just installing Linux alone in your hard drive, and that you are
    not going to do any partitioning. So go ahead and choose, "Erase and use the entire
    disk" and press forward.![Description: 00035.jpeg](rsrc82.jpg)After you press
    "Forward," the installation will ask you what your name is, what name you want
    to use to log in, the password that you want to put for the user account, and
    the name you want to give the Linux computer.![Description: 00036.jpeg](rsrc87.jpg)Also,
    if you scroll down a little bit, you will see that the installation is asking
    you whether you want to log into the computer automatically once it boots up,
    require a password during login, and require a password during login and decrypt
    your home folder. The latter option only applies if you installed Linux with the
    encryption feature enabled.Go ahead and enter the information needed and then
    press "Forward." Next, the installation process will show you the all the settings
    and options you have chosen so far and what it is about to do. If everything looks
    okay, go ahead and press "Install."![Description: 00037.jpeg](rsrc8C.jpg)Once
    you click install, the installation will now proceed and you will see a window
    that has a progress bar at the bottom. At this point, just exercise patience and
    wait until the progress bar reaches 100%.![Description: 00038.jpeg](rsrc8G.jpg)Once
    the progress bar reaches 100%, it will tell you that the installation is complete
    and that you need to restart your computer to finalize and use the new installation.
    Go ahead and click "Restart Now."![Description: 00039.jpeg](rsrc8N.jpg)Again,
    the actual time that it will take for the process to finish will depend on your
    hardware. Do realize you should look at the hardware requirements for the desktop
    version of the Ubuntu Linux operating system. Remember, the server version is
    extremely stripped down. There is almost nothing to it really.The desktop version
    has all these fancy graphics and user interfaces, as you can evidently see even
    from the installation itself. Where the installation of the server version basically
    is text based, the installation for the desktop version actually has graphical
    user interface windows and option buttons that you can actually click on.All of
    these fancy graphical niceties actually does require pretty decent hardware. It
    is therefore recommended that if you are going to use the desktop version of Ubuntu
    Linux, your computer should be at least five years or younger with at least 1Gigabyte
    of RAM. If you have any less than that, it may not have the resources it requires
    to run.But in the grander scope of things, the desktop version of Linux still
    has a much lighter system requirement compared to Microsoft Windows or Mac OS.After
    the restart sequence of your computer is done and you finish logging into Linux
    using the credentials that you entered during installation, you will now reach
    the desktop of Ubuntu Linux.![Description: 00040.jpeg](rsrc8X.jpg)Just like what
    we have mentioned prior, you now have something that vaguely looks like Microsoft
    Windows or the Mac OS operating system. As you can see right off the bat, you
    have your applications on the left hand side such as Firefox for web browsing,
    OpenOffice Suite for word processing tasks, your home folder, Linux settings,
    Amazon, and much, much more.Chapter 4: most of the popular Linux programFedora
    is a Red Hat Linux code based OS that provides users latest free and open source
    software. It provides this software in a stable, easily manageable and secure
    form. It is one of the software created by the Fedora project funded by Red Hat
    Linux.Online Linux training invariably includes Fedora as a part of the curriculum.
    Why is it so?Fedora focuses on innovation, integration of new technologies and
    works with many Linux developing communities. Being freely distributed with updates
    every six months it is the most evolving OS in the Linux community. Continuous
    upgrade means it is loaded with the newest technologies which make it the best
    technology for experimentation.This is the reason it is a part of beginner Linux
    and rhce training as well. The cutting edge technology which is stable is the
    USP of Fedora and the reason behind it being part of Red Hat Linux basics.Is Fedora
    being used as a test platform for Red Hat Linux?Red Hat Linux community is promoting
    Fedora for the development of new technology is indeed true. However, it is not
    true that it is only Red Hat Linux that uses and contributes to the development
    of Fedora.There are many other contributors and just like some technology of Fedora
    is being used by the Red Hat Linux Enterprise, other distributors are also using
    it. Another thing is that Fedora though is upgraded every 6 months is a very stable
    and pre-tested software. So it is quite safe to use Fedora to learn new things.
    This is why it is being used by most online Linux training as a part of Linux
    introduction for beginners.Red Hat Linux Enterprise and Fedora relationshipRed
    Hat Linux Enterprise and Fedora project have a relationship which is mutually
    beneficial for both. It ensures rapid innovation for Red Hat Linux and Fedora
    gets the sponsorship and feedback on issues with the new technologies.When the
    new tested technology migrates to Red Hat Linux, it is available to a broader
    community which makes the technology robust for users. So Fedora is the incubator
    for latest technologies and innovation in Linux.In fact, Red Hat Linux always
    tries to make Fedora rich with features which make handling computers much easier.
    Various features of Fedora like Network Manager and Pulse Audio make it an enjoyable
    experience with the option of experimentation.After all, Linux is open source
    which benefits from the feedback from its users and developers community. This
    is the reason for Fedora being part of Linux essentials and rhcsa training.Ubuntu
    and FedoraNow let us discuss the question of choice of Linux Operating system.
    Ubuntu is the most popular and user friendly while Fedora is loaded with the latest
    technology. So which one to choose?Well it depends on the use. If the user is
    just using the computer for office jobs which does not include programming then
    Ubuntu is of course the better deal.However with latest technology and regular
    development Fedora scores over Ubuntu in benchmarking tests. So it largely depends
    on the use of the software. If the question is to migrate from Windows Ubuntu
    is the obvious choice and if you are a serious programming nerd then Fedora is
    the best bet.Linux Foundation recommends learning both Ubuntu and Fedora for a
    complete experience of Linux.Chapter 5 : installing Linux OSVersionsWe now will
    have a quick word about which version of Linux to install. This is very popular
    distro and has many features. It also offers a lot of support from the FLOSS community.
    Ubuntu itself also has many "variations" however. They''re basically the same
    Ubuntu core with a different graphic/desktop environments. You will see these
    listed as either XFCE, Openbox, GNOME, Unity, or KDE, just to name a few.These
    different variations of the distros themselves also have different elements to
    them such as window managers and desktop environments.A window manager is the
    software that allows all of the interactions with a graphical user interface.
    These elements provide the different window panels, menus and taskbars, settings
    and appearances. If coupled, the two provide you with more options (this would
    apply to desktop environments such as GNOME and KDE versions of Linux). You also
    could download more than one environment, and switch between them when you want
    a different desktop environment at each boot up. Most of these environments for
    Ubuntu come with both the environment and with the window manager.Desktop Installation:Again,
    this version of Linux will give you the graphics interface (GUI) that many are
    used to and expect from using computer.To installBefore you start you should make
    sure you have backed up your computer before trying either version as a precaution.
    Linux is not as likely as Windows to crash, but it is best to be prudent and protect
    your data.Pull up the website for www.Ubuntu.com. Always use legitimate websites
    for your distros and other needs. Once you see the distro that you need, check
    your computer’s requirements. Is there enough room for install? Are there hardware
    or software components that do not match what the distro is stated to require?
    At this stage, you can decide if you need to repair or add anything before moving
    forward. You may even decide to go with another distro.From the webpage, select
    the Linux CD image (an .ISO file) that you would like, and choose to download
    to a disc or a USB. This is highly recommended to download to the external media
    over a direct install to your hard drive. It is portable, it is non-permanent,
    and will not make changes to your computer system. You can boot the system straight
    from the copy that you make. More will be said about this. The desktop version
    also will be a lot smaller than the server edition.![Description: 00006.jpeg](rsrcAB.jpg)After
    the download, you should boot it off of the CD drive or USB. This is called a
    live environment. The good news is that this is not going to affect or change
    your computer at all. However you also have the option to install the distro to
    your computer. Be patient during the download, as in either case, the download
    may take a while. Remember that this version is a bit bigger than the server version
    in comparison. It also depends on your hardware, the age of your system as well
    as your internet speed.With an install you can easily save settings, files and
    other components between uses that you can’t get with the USB or disc reboot.
    However, you could also save files to your drive to use on your next reboot with
    a USB drive, by enabling the “persistence” setting.![Description: 00007.jpeg](rsrcAJ.jpg)Options
    to Try (Use Live) or Install Ubuntu (www.linuxandubuntu.com)For the install on
    your drive:For hard installation we recommend to use the guided installation,
    unless you are more advanced with Linux (in which case, you probably would not
    be reading this guide).Ubuntu makes the following, additional recommendations
