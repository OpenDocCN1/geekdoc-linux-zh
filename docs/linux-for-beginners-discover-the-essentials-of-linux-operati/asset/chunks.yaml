    You might also realize that a particular interface is down. If you need to bring
    it up, use the following command:


    ```

    ifup interface_name

    ```


    This will definitely bring the interface up. To see whether your machine is connected
    to another device you need to `ping` the other machine. If connected, the machine
    will send `ICMP echo packets` to your machine. If not connected, these will not
    be sent to your machine. Pinging the other machine can be done using its `ip address`
    as shown below:


    ```

    ping 192.168.160.2

    ```


    The above command will ping the machine with the above ip address.


    ![Description: 00035.jpeg](rsrc1KD.jpg)


    In my case, as shown in the figure above, the machine is unreachable since my
    computer is not connected to the machine with the above ip address. You will also
    notice that the process will continue to try and ping this machine even though
    it’s not connected. To stop it abruptly, just press `Ctrl + C` and will stop instantly.
    Let us see what will happen after pinging the local machine itself:


    ```

    ping 127.0.0.1

    ```


    ![Description: 00036.jpeg](rsrc1KK.jpg)


    As you can see from the above figure, the local host is reachable. Again, the
    process will continue to ping the machine, so, again, just press `Ctrl + C` and
    the process will be killed. Rather than sending packets which will never end,
    you can specify the number of `ICMP echo packets` which you need to receive as
    follows:


    ```

    Ping –c4 127.0.0.1

    ```


    This will return only four `ICMP echo packets` on your standard output. After
    that, the process will stop as shown below.


    ![Description: 00037.jpeg](rsrc1KV.jpg)


    You will also notice that the `ICMP echo packets` will be shown on the standard
    output as they are sent to your machine. You might not be interested with this
    verbal mode. To make it silent, you can do as follows:


    ```

    ping –c4 127.0.0.1 –q

    ```


    ![Description: 00038.jpeg](rsrc1M1.jpg)


    As shown in the above figure, the pinging was silent rather than displaying verbally.
    To make it verbalize the process when it is silent the `–v` option can be used
    in place of the `-q` option.


