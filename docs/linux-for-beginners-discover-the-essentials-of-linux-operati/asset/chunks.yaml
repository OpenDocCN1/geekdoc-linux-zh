    *   适用于 32 位和 64 位的 CD 或 DVD

    *   适用于 32 位和 64 位的网络镜像（所谓的 `Netinst-ISO`）

    *   适用于 32 位或 64 位的小型 CD


    我们还提供了测试媒体。这些包括 32 位和 64 位的实时镜像，允许你在将 Debian 安装到计算机之前对其进行尝试。在编写本文期间，版本号 9.5 是
    Debian 的当前稳定版本。这里描述的安装基于此版本和 `amd64` 架构。从 `www.debian.org/distrib` 下载网络镜像后，系统不再需要引用额外的静态镜像。相反，它依赖于连接来检索要安装的包并保持您的操作系统更新。整个过程将花费你大约一小时，并且允许你根据特定需求进行精简的软件选择。你不使用的软件包将不会出现在你的系统中。当你需要它们时，可以随时添加。我们安装的目标系统是一个基于
    XFCE 的单用户桌面系统，配备网络浏览器和音乐播放器。网络浏览器我们使用 Mozilla Firefox，音乐播放器使用 `VLC`。这两个程序都是 Linux
    发行版的永久组成部分。我们用于演示的环境是一个基于 `VirtualBox` 的虚拟机，拥有 4 GB 内存和 15 GB 磁盘空间。


    ## 第 7 章：练习


    正如我们在上面已经学过的那样，创建目录非常简单。同样，从 Linux 系统中移除或删除目录也是非常简单的。然而，你必须记住，一旦你从 Linux 系统中移除或删除了一个目录，就没有办法撤销该任务。因此，最好的办法是当你在
    Linux 上运行任何命令时，第一件事就是对你的操作小心。如果意味着在运行命令之前双重检查，那就越好。我们将用于移除或删除目录的命令是 `rmdir`，它的意思是“remove
    directory”（移除目录）。在这里你需要注意的是，`rmdir` 命令支持与 `mkdir` 命令相同的 `-p` 和 `-v` 选项。此外，该目录在被移除之前必须是空的。我们稍后将学习如何解决这个问题。


    ```

    rmdir linux_tutorial/beginner/commands

    ```


    ```

    ls linux_tutorial/beginner

    ```


    ## 如何创建一个空文件


    许多涉及文件数据操作的命令都有一个极佳特性：当我们引用一个发现不存在的文件时，它们会自动创建一个文件。事实上，我们可以利用这一特性使用 `touch` 命令来创建一个空文件。换句话说，你输入命令
    `touch`，后跟命令行选项和文件名。


    ```

    pwd

    ```

    ```

    /home/Gary/linux_tutorial

    ```

    ```

    ls

    ```

    ```

    beginner

    ```

    ```

    touch practice_exercise1

    ```

    ```

    ls practice_exercise1 commands

    ```


    ## 复制文件或目录


    让我们考虑以下示例：


    ```bash

    user@bash: ls

    practice_exercise1 commands

    cp practice_exercise1 Exercise1

    ls

    practice_exercise1 Exercise1 commands

    ```


    在这种情况下，我们必须注意的一个重要点是路径中的源和目标点。这里我们可以考虑的一些示例包括：


    *   `cp /home/Gary/linux_tutorial/Exercise1 Exercise2`

    *   `cp Exercise2 ../../backups`

    *   `cp Exercise2 ../../backups/Exercise3`


    当你使用 `cp` 命令时，文件的目标可以代表指向文件或目录的路径。如果目标是一个文件（如 `Exercise1`、`2` 和 `3`），则将在目标文件中创建文件的副本，但原始文件保留在源文件或目录中。我们将文件复制到目录中，文件将在目标目录中保持名称。在
    `cp` 命令的默认行为中，它只会复制文件。在这种情况下，“递归”（recursive）一词意味着你想复制目录以及该目录的所有内容，其中包括文件、目录和子目录等。让我们考虑以下示例：


    ```bash

    user@bash: ls

    Gary Practicals transfers

    user@bash: cp Practicals Practicals_beginner

    cp: omitting directory ‘Practicals.’

    user@bash: cp -r Practicals Practicals_beginner

    user@bash: ls

    Gary Practicals transfers Practicals_beginner

    ```


