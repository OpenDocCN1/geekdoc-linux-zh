    When it was first published (to be used) in 1991 as Version `0.9.0`, core datatypes,
    functions, and inheritance such as `str`, `dict`, and `list` were already available.
    In 1994, Version `1.0` was released and it involved `reduce`, `filter`, `map`,
    and `lambda`, amongst others, and in 1995, Van Rossum continued to work on developing
    `Linux` while at the Corporation for National Research Initiatives in Virginia!
    In 2000, the BeOpen Linux Labs team was established, and Version `1.6` of the
    language was put out, with important bug-fixes. Another version called Version
    `2.0` was released in 2008, followed by `3.0`—which could coexist with the other!


    Linux Today, `Linux` is partly responsible for helping the world work like it
    should. From people who only work with computers at home, to larger feats such
    as NASA using `Linux`-powered computers, it is no surprise why `Linux` is getting
    the attention of many—and today, you have the chance to learn about it, and more!


    ## Chapter 2: Terminology


    * **Adware**: Software that forces ads to display on a computer or a mobile device.

    * **Attack**: An incident where access is gained or data is extracted.

    * **Back Door**: A hidden way to gain entry into a system or software that bypasses
    network security.

    * **Black Hat**: A hacker who hacks predominately for personal gain, fame, or
    to deface a company. Black hats are the “bad guys.”

    * **Bot**: An automated program that can do something repeatedly at a fast rate.

    * **Botnet**: Multiple computers that are controlled without permission that generally
    do automated tasks. Also referred to as a zombie army.

    * **Brute Force Attack**: An automated attack that tries different logins and
    password combinations until access is granted.

    * **Buffer Overflow**: Buffer overflow is when more data is written to a computer
    system than a buffer can hold.

    * **Clone Phishing**: Modifying an email with a fake link in an attempt to extract
    personal information.

    * **Cracker**: A black hat that modifies software to gain unintended features.

    * **Cryptojacking**: An attack on cloud computing services to mine cryptocurrency.

    * **Cryptocurrency**: A type of digital currency where there is a way to verify
    funds, generate currency, and transfer funds with the need of a central bank.

    * **Denial of Service Attack (DoS)**: An attempt to make resources of a system
    unavailable to legitimate users by overloading the computer system.

    * **Distributed Denial of Service Attack (DDoS)**: A Denial of Service attack
    that comes from several computers at once. This is usually achieved with a `botnet`.

    * **Exploit Kit**: The software that runs on web servers to identify vulnerabilities
    in client machines. It exploits vulnerabilities to install and run malicious code
    or malware.

    * **Exploit**: An exploit is software or data that takes advantage of a bug or
    vulnerability.

    * **Firewall**: A filter designed to protect against intruders while allowing
    communication between the systems behind the firewall and the internet.

    * **Grey Hat**: A hacker who blurs the line between white hat and black hat. A
    grey hat can hack either to help protect or to attack a system maliciously.

    * **Hacktivist**: Someone who hacks for political, social, or religious reasons.

    * **Keystroke Logger**: Software that records keystrokes, which is the keys that
    are pushed on a keyboard or the places touched on a touchscreen. Often used to
    record logins and passwords.

    * **Logic Bomb**: A virus that delivers a malicious action when some conditions
    are met.

    * **Malware**: A group of malicious software that includes adware, ransomware,
    viruses, trojan horses, worms, etc.

    * **Master Program**: A master program is a software that controls infected computers
    to send out spam or Denial of Service attacks.

    * **Phishing**: An email fraud technique where the hacker sends out official looking
    emails to gather personal information like passwords, logins, credit card numbers,
    and other personal data.

    * **Phreaker**: One of the original hacker sub-cultures that revolved around using
    blue boxes to make expensive long distance calls for free or to tap phones.

    * **Risk**: The chance for a threat to take advantage of a vulnerability.

    * **Rootkit**: Generally malicious software that hides processes and programs
    from detection and enables privileged access to the device.

    * **Shrink Wrap Code**: An attack that exploits unpatched software.

    * **Social Engineering**: An attempt to deceive to gain personal information.

    * **Spam**: Unwanted emails sent to a large number of people without the recipient’s
    permission.

    * **Spoofing**: Attempt to gain access to a computer by sending a message that
    appears to come from a trusted host.

    * **Spyware**: Software that collects information about the user without permission.
    It may transfer that information to another computer or take control of the computer.

    * **SQL Injection**: An attack where `SQL` code is injected into entry fields
    to gain access, data, or install malware.

    * **Trojan**: A program that appears valid but that destroys files and alters
    or steals information.

    * **Threat**: A hacker or software that can exploit a vulnerability.

    * **Virus**: Code that replicates itself inside a computer and damages data or
    corrupts the computer system.

    * **Vulnerability**: A weakness in a computer system that can be exploited.

    * **White Hat**: A white hat is an ethical hacker who hacks to find exploits,
    bugs, and vulnerabilities to better protect computer systems. White hats are the
    “good guys.”

    * **Worm**: A type of virus that self-replicates in active memory.

    * **Cross-Site Scripting (XSS)**: A type of vulnerability in web applications
    that allows attackers to inject code into websites.

    * **Zombie Drone**: A computer that is unknowingly controlled by another computer.
    A zombie drone is also known as a soldier or drone.


    ### Command Line Prompts


    Ethical hacking uses many tools, and command line prompts (`CLP`) are one of them.
    It is important to have a working knowledge of `CLPs`, as many of the tools use
    them. Here are some helpful `CLPs`:


    * `ping`: A command that allows the user to determine `TCP/IP`, IP addresses,
    and networks. `ping x.x.x` (replace `x` with an IP address) or `ping www.example.com`.
    Either syntax will run a `ping` on the server and respond with data about the
    `ping`.

    * `nslookup`: A command used to query the domain name (`DNS`) to obtain the IP
    address or domain name. To find out the IP address of specific Mail Servers with
    `nslookup` use the following code:

    ```

    NSLOOK (Press Enter)

    SET TYPE=MX (Press Enter)

    ```

    * `tracert`: A command prompt that traces the route between the user’s computer
    and a destination on the internet. This command also calculates the time each
    transfer takes. `tracert x.x.x.x` (replace `x` with the IP address) or `tracert
    www.google.com`.


    ## Chapter 3: Linux Desktop


    Now we will talk about how to install the desktop version of the `Ubuntu` distribution
    of `Linux`. When you install this version, at the end, you will get a nice graphical
    interface—you will be able to see files and folders that you can click and navigate
    around the operating system. It will also have basic applications like web browsers
    to navigate websites, and word processing applications such as OpenOffice for
    when you need to type documents, etc. Again, installation is a pretty simple;
    just click a few buttons and you are good to go.


    Download – Just like the server version, go to `http://www.ubuntu.com/` and download
    the desktop version of `Linux`. Click the option on top that says "Desktop" to
    proceed to the page where you can download the desktop version of `Ubuntu`. Once
    you are there, click the orange button that says "Download." After you click that,
    you will be presented with two versions of the desktop version of `Linux`: `Ubuntu
    14.04.4 LTS` and `Ubuntu 15.10`.


    If you notice on the right hand side it will ask you to choose your flavor of
    that version (whether you want 32-bit or 64-bit). Choose the version that applies
    to your system and then click "Download." Go ahead and wait until the ISO download
    is finished. Once that''s done, burn that ISO file to a `CD` or `DVD`, put that
    into the system where you want to install `Linux`, and then boot off it. Now we''ll
    proceed with the installation.


    The interesting part you will probably notice during the desktop version''s installation
    is that it will give you two options: "Try Ubuntu" or "Install Ubuntu." The curious
    thing about `Linux` is that they have `Live CDs`. What a `Live CD` means is that
    the entire operating system is run off the `CD`. When you are dealing with Windows,
    Mac, or even Linux server, you always have to install the operating system for
    it to work. With a Live CD, you can actually boot straight off the `CD` and use
    all the functionality of the operating system without installing it. You can surf
    the web, manage files, edit text, etc., by just running the entire operating system
    from the `CD` itself. In addition, if you have a Windows computer, you can put
    in a Linux `Live CD`, boot from it, and do whatever you want to do without affecting
    the computer at all. This is a great way for a user to test a particular `Linux`
    distribution without going through the lengthy installation process.


    So, going back to our installation process, go ahead and click "Install" for now.
    Next, you will be asked to choose your region and time zone. Go ahead and choose
    the region and time zone that applies to you and click "Forward." Again, like
    in the server edition, the installation will now ask you to choose your keyboard
    layout. Go ahead and choose the one that applies to you and click "Forward."


    Next, the installation will ask you to prepare the disk space in your hard drive
    prior to installation. If you want to use your entire disk for `Ubuntu` alone,
    go ahead and choose the option that says "Erase and use the entire disk." However,
    if you have another operating system on your hard drive and want to install `Linux`
    inside a different disk partition, then choose the option that says "Specify partitions
    manually." Specifying partitions manually involves telling the installation process
    how much disk space you want to allocate for the `Linux` installation. For now,
    since you are still a beginner, let us assume that you are just installing `Linux`
    alone on your hard drive and that you are not going to do any partitioning. So
    go ahead and choose "Erase and use the entire disk" and press forward.


    After you press "Forward," the installation will ask what your name is, what name
    you want to use to log in, the password you want to put for the user account,
    and the name you want to give the `Linux` computer. Also, if you scroll down a
    little bit, you will see that the installation is asking you whether you want
    to log into the computer automatically once it boots up, require a password during
    login, or require a password during login and decrypt your home folder. The latter
    option only applies if you installed `Linux` with the encryption feature enabled.
    Go ahead and enter the information needed and then press "Forward."


    Next, the installation process will show you all the settings and options you
    have chosen so far and what it is about to do. If everything looks okay, go ahead
    and press "Install." Once you click install, the installation will now proceed
    and you will see a window that has a progress bar at the bottom. At this point,
    just exercise patience and wait until the progress bar reaches 100%. Once the
    progress bar reaches 100%, it will tell you that the installation is complete
    and you need to restart your computer to finalize and use the new installation.
    Go ahead and click "Restart Now."


    Again, the actual time that will take for the process to finish will depend on
    your hardware. You should look at the requirements for the desktop version of
    `Ubuntu`. Remember that the server version is extremely stripped down; there is
    almost nothing to it. The desktop version has all these fancy graphics and user
    interfaces, as you can see from the installation itself. The desktop version actually
    requires a decent amount of hardware. If you have less than 1 `Gigabyte` of `RAM`,
    it may not have the resources to run. But in the grand scheme of things, the desktop
    version of `Linux` still has a much lighter requirement compared to `Windows`
    or `OS`. After the restart sequence of your computer is done and logging into
    `Linux` using the credentials you entered, you will now reach the desktop of `Ubuntu`.
    Like what we have mentioned prior, you now have something that vaguely looks like
    `Windows` or the `Mac` operating system. As you can see right off the bat, you
    have applications on the left side such as `Firefox` for web browsing, `OpenOffice
    Suite` for word processing, your home folder, and much more.


    ## Chapter 4: Fedora Linux


    Most of the popular `Linux` programs is `Fedora`, a `Red Hat` based OS that provides
    users with free and open source software. It is easily manageable and secure.
    It was created by the `Red Hat` project funded by `Linux Foundation`. Why? `Fedora`
    focuses on innovation, integration of new technologies and works with many `Linux`
    communities. Being freely distributed with updates every six months, it is the
    most evolving `Linux` distribution. The cutting-edge technology makes `Fedora`
    the best platform for experimentation.


    ## Chapter 5: Installing Linux OS


    Now we will have a quick word about which version of `Linux` to install. This
    is a very popular distro and has many features. It offers a lot of support from
    the `FLOSS` community. `Ubuntu` itself has many "variations," however; they are
    basically the same `Ubuntu` core with different graphical/desktop environments.
    You will see these listed as either `XFCE`, `Openbox`, `GNOME`, `Unity`, or `KDE`,
    just to name a few. These different variations of the distros themselves have
    different elements to them, such as window managers and desktop environments.
    A window manager is the software that allows all interactions with a graphical
    user interface. These elements provide the different window panels, menus and
    taskbars, settings, and appearances. If coupled, the two provide you with more
    options (this would apply to desktop environments such as `GNOME` and `KDE` versions
    of `Linux`). You could also download more than one environment and switch between
    them when you want a different desktop environment at each boot up. Most of these
    environments for `Ubuntu` come with both the environment and the window manager.


    ### Desktop Installation


    Again, this version of `Linux` will give you the graphical interface (`GUI`) that
    many are used to and expect from using a computer.


    Before you start, you should make sure you have backed up your computer before
    trying either version as a precaution. `Linux` is not as likely to crash as `Windows`,
    but it is best to be prudent and protect your data. Pull up the website for `www.Ubuntu.com`.
    Always use legitimate websites for your distros and other needs. Once you see
    the distro you need, check your computer’s requirements. Is there enough room
    for install? Are there hardware or software components that do not match what
    the distro is stated to require? At this stage, you can decide if you need to
    repair or add anything before moving forward. You may even decide to go with another
    distro.


    From the webpage, select the Linux CD image (an `.ISO` file) you would like, and
    choose to download to a disc or a `USB`. This is highly recommended to download
    to the external media over a direct install to your hard drive. It is portable,
    it is non-permanent, and will not make changes to your computer system. You can
    boot the system straight from the copy you make. More will be said about this.
    The desktop version also will be a lot smaller than the server edition.


    After the download, you should boot it off the `CD` drive or `USB`. This is called
    a live environment. The good news is that this is not affect or change your computer
    at all. However, you also have the option to install the distro to your computer.
    Be patient during the download, as in either case, the download may take a while.
    Remember that this version is a bit bigger than the server version in comparison.
    It also depends on your hardware, the age of your system as well as your internet
    speed.


    With an install, you can easily save settings, files and other components between
    uses that you can’t get with the `USB` or `disc` reboot. However, you could also
    save files to your drive to use on your next reboot with a `USB` drive, by enabling
    the "persistence" setting.


    For the install on your drive: For hard installation we recommend to use the guided
    installation, unless you are more advanced with `Linux` (in which case, you probably
    would not be reading this guide). `Ubuntu` makes the following, additional recommendations
    prior to installing the system:

