    ## 第 9 章：导航 Linux


    现在我们需要谈论 Linux 操作系统中的基础目录导航。这与 Windows 略有不同。然而，有趣的是，它看起来足够像 Windows，以至于当事情不通时，人们想把电脑扔出窗外。


    ![Description: 0053.jpeg](img/rsrcND.jpg)


    以上面的图为例。在 Linux 中，你也有 `cd` 命令。和 Windows 一样，`cd` 代表切换目录。如果你想去不同的目录或文件夹，输入 `cd`。如果你在一个文件夹中，假设你在图中的
    `var` 文件夹中，你想去 `var` 文件夹内部的一个文件夹（在这种情况下是 `abc` 文件夹），你只需要输入命令：


    ```bash

    cd abc

    ```


    所以，是 `cd`、空格，然后你想去的文件夹名称。这将进入你想进入的文件夹。现在问题是，Windows 世界的人习惯在 `cd` 命令后跟一个斜杠符号。如果我们在之前的命令中应用这一点，它看起来像下面所示：


    ```bash

    cd /abc

    ```


    Linux 在这种情况下会将斜杠符号解释为根目录。Linux 会认为你想切换到根目录，然后在根目录内查找 `abc` 文件夹。当然，一旦 Linux 执行此命令，它将找不到存在的
    `abc` 文件夹，因为实际上 `abc` 文件夹位于 `var` 文件夹中。这是你必须极其小心的地方。这就是为什么许多 Linux 管理员总是输入他们想要去的地方的全路径，无论他们现在在哪里。如果一个
    Linux 管理员想要进入并更改 `abc` 文件夹中的内容，他们只需输入命令：


    ```bash

    cd /etc/var/abc

    ```


    Linux 对整个过程非常挑剔。正如我们之前提到的，Linux 中大小写很重要。如果你尝试到达一个名称全小写的文件夹，Linux 将无法找到它。这让你感到非常沮丧。


    ![Description: 0054.jpeg](img/rsrcNU.jpg)


    所以，当你想要在 Linux 中导航文件时，首要任务是进入根目录。为了这样做，你必须输入命令：


    ```bash

    cd /

    ```


    这表示 `cd`、空格，然后一个斜杠。这会自动带你进入根目录，如果你不在那里的话。接下来要做的是是查看根目录下的文件夹。为了这样做，你必须输入命令：


    ```bash

    ls

    ```


    `ls` 或 `list` 命令将列出特定目录下的所有文件和文件夹。在我们的案例中， root。


    ![Description: 0055.jpeg](img/rsrcP2.jpg)


    当你输入 `ls` 命令后，Linux 现在将向你显示根目录下的文件夹。你可以看到 `bin`、`dev`、`opt`、`sys`、`boot`、`etc`。如果你想进入
    `etc` 文件夹，你只需要输入命令：


    ```bash

    cd etc

    ```


    上述命令会自动带你进入 `etc` 文件夹。如果你在命令行提示符闪烁的光标旁边看到 `$`，说明你已经在 `root` 目录下了。现在再次输入 `ls` 命令将列出
    `etc` 文件夹下的所有文件和文件夹。这对于理解 Linux 非常重要。


    ![Description: 0056.jpeg](img/rsrcP9.jpg)


    为了返回根目录，你需要输入命令：


    ```bash

    cd ..

    ```


    此命令将工作目录切换到当前目录的父目录。或者你可以输入：


    ```bash

    cd /

    ```


    这表示 `cd`、空格，然后一个斜杠。这会自动带你回到根目录，无论你处于多深。接下来要做的是进入当前用户的主目录。为了这样做，你必须输入命令：


    ```bash

    cd ~

    ```


    此命令将目录切换到用户的主目录 `/home`。`~` 符号被称为波浪号，在 Linux 中表示用户的主目录。


    # 第 10 章：常用 Linux 命令


    在本节中，我们将探索必要的命令。你现在可以打开终端。点击桌面并选择“Open Terminal”。


    ### 切换目录

    你可能也想导航切换目录。为了实现这一点，使用 `cd` 命令代表“切换目录”。例如：


    ```bash

    cd /home

    ```


    上述命令将工作目录切换到 `/home`。


    ### 复制文件

    `cp` 命令代表“copy files”，用于复制文件。在指定位置创建一个副本：


    ```bash

    cp first me

    ```


    上述命令将在相同位置创建一个 `first` 的副本，命名为 `me`。


    `slocate -u` 命令将创建一个名为 `slocate` 的数据库。这需要一些时间来完成，请保持耐心。在你能够搜索文件之前，必须先运行此命令。然而，在大多数系统中，再次运行以下命令：


    ```bash

    locate whois

    ```


    此命令将查找名称包含字符串 "whois" 的文件。


    ### 退出命令

    `logout` 命令用于注销用户，即当前登录的系统。执行此命令：


    ```bash

    logout

    ```


    此命令将你注销并返回登录屏幕。


    ### 列出命令

    `ls` 命令代表“list”，用于列出文件和文件夹。在我们的案例中， root。


    ```bash

    ls

    ```


    `ls` 命令将显示根目录下的所有文件夹。你可以看到 `bin`、`dev`、`opt`、`sys`、`boot`、`etc`。


    ### 复制文件

    `cp` 命令代表“copy files”，用于复制文件。注意我们使用了 `-dpr` 选项。这意味着：

    - `-d`：意味着链接将被保留

    - `-p`：文件属性将被保留

    - `-r`：将递归复制 如果在从目录复制所有文件时，需要指定这些选项，否则默认设置可能会产生意外的结果。


    ```bash

    cp first me

    ```


    上述命令将在相同位置创建一个 `first` 的副本，命名为 `me`。如果 `me` 在目录中存在，在执行此命令前将警告你。考虑以下命令：


    ```bash

    cp -i first me

    ```


    在上述命令中，我们添加了 `-i` 选项。如果 `me` 在目录中存在，在执行此命令前将通知你。接下来，尝试以下命令：


    ```bash

    cp -i /dev/file

    ```


    使用上述命令将 `/dev/file` 复制到当前目录并命名为 `file`。你可能还需要将特定目录中的所有文件复制到另一个目录。可以通过以下方式实现：


    ```bash

    cp -dpr source destination

    ```


    `source` 目录中的所有文件将被复制到 `destination` 目录。


    要显示每个挂载文件系统上使用的磁盘空间，使用 `df` 命令。


    ```bash

    df

    ```


    ### `less` 命令

    `less` 命令与 `more` 命令相同。区别在于使用此命令时用户可以向上或向下翻页文件。考虑示例：


    ```

    less first

    ```


    上述命令将显示文件 `first` 的内容。


    ### `ln` 命令

    此命令为特定文件创建符号链接。编写并运行以下命令：


    ```bash

    ln -s first slink

    ```


    上述命令将创建一个名为 `slink` 的符号链接，它将链接到文件 `first`。命令 `ls -i first slink` 将显示两个文件是不同的且具有不同的“inode”。


    ### `locate` 命令

    这用于在数据库中搜索。运行以下命令：


    ```bash

    slocate -u

    ```


