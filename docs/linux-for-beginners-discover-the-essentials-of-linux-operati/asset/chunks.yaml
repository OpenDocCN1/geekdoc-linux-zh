    # Terminal Commands


    | COMMAND | Description |

    | :--- | :--- |

    | `help` | This lists all the commands in the terminal. |

    | `tar` | We use this to extract, create, and view tar files. |

    | `find` | We use this command to search files matching certain criteria in a
    specified location. |

    | `gzip` | We use this to command extract and create gzip archives |

    | `unzip` | We use the inzip command to extract or unzip a zip archive. |

    | `whatis` | This command shows the use of a certain command; it gives a short
    description of a command |

    | `Man` | This command shows the manual of a specified command. |

    | `exit` | The `exit` command ends the current bash session. We can have multiple
    bash sessions in one terminal. |

    | `sudo` | We use this command to run a specified command as the superuser or
    root user. |

    | `su` | In the terminal, we use this command to switch current user to a specified
    one. |

    | `top` | This command acts as a task manager in terminal and shows top processes.
    |

    | `shutdown` | This command shuts down the computer after a specified time. |

