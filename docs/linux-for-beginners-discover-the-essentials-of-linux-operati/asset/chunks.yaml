    NOTE: `Linux Commands` are case Sensitive. If you type them incorrectly, they
    will not work. If you want to master Linux, Master the shell.


    # Chapter 20 : configuring system logging


    In Linux, it is possible and easy to configure the network settings via the command
    line. This includes specifying the `ip address` of the network, the `subnet mask`
    and the `proxy server port`.


    You can first check whether the network interfaces are up or down. These network
    interfaces are defined in the file `/etc/network/interface`. You can open it on
    the `vim` editor and view its contents. To configure a particular interface via
    the command line, use the following command syntax:


    ```

    ifconfig interface_name ip_address netmask subnet_mask.

    ```


    If you want to configure the interface `eth1`, the following command can be used:


    ```

    ifconfig eth1 192.168.160.1 netmask 255.255.255.0

    ```


    If you need to see all of the network connections which are currently opened on
    your system, use the following command:


    `netstat`


    The routing table is used to store host machines and their `ip addresses` for
    networking purposes. It is what determines to which host a particular data or
    packet is sent. To see the contents of this table, use the command:


    ```

    netstat –r

    ```


