    - 用于必要数据的分区

    - 用于服务器程序和配置数据的分区

    - 用于程序和应用程序的分区

    - 至少一个用于用户邮件、归档和数据库表的分区

    - 至少一个用于特定文件的分区

    - 至少一个用于虚拟内存的分区


    ### 常见分区

    - 包含个人数据的分区

    - 存储临时文件的分区

    - 存储第三方数据的分区

    - 仅用于程序的分区


    ![Description: 00005.jpeg](img/rsrc173.jpg)


    ## 目录（根目录与子目录）


    在 Linux 中，有一个名为“根目录（The Root Directory）”的目录。它作为主目录，正如程序员和系统管理员所指的那样，它是所有目录的目录。


    伴随根目录产生的是许多子目录。这些子目录根据其分配的任务来管理文件。


    ### 子目录及其内容

    - `/home` – 用户主目录

    - `/boot` – 内核和启动文件；尝试消除不必要的启动加载程序的文件

    - `/initrd` – 关于启动信息的数据

    - `/dev` – 包含指向所有 CPU 硬件外设的引用

    - `/bin` – 常用的共享系统程序

    - `/etc` – 核心系统配置数据

    - `/lib` – 库文件

    - `/lost+found` – 从失败中恢复的数据

    - `/opt` – 来自第三方源的文件

    - `/net` – 远程文件系统的标准挂载点

    - `/misc` – 杂项数据

    - `/proc` – 关于系统资源的信息

    - `/mnt` – 外部文件系统的标准挂载点


    ## inode 的作用


    在 Linux 文件系统中，`inode` 代表一个文件。`inode` 是一种包含基本信息的序列号类型。它的主要作用围绕着定义分区中的文件数量展开。


    在整个 Linux 文件系统中，特别是对于具有多个分区的系统，存在着具有相似 `inode` 编号文件。为了避免复杂性，每个分区都分配了自己的 `inode`。此外，分配的
    `inode` 提供了硬盘数据结构的描述。一旦硬盘初始化完成，它可以在两个时间点接受数据存储：一，在安装过程中允许数据存储；二，在向现有系统添加存储空间时允许数据存储。


    ### inode 中包含的信息

    - 文件类型

    - 文件大小

    - 文件的所有者或组所有者

    - 创建日期和时间

    - 最后修改日期和时间

    - 权限

    - 链接数

    - 数据地址


    ## 超块 (Superblock)


    在 Linux 文件系统中，关于必要文件大小和形状的信息被称为超级块（The Superblock）。它允许文件系统管理器浏览并维护文件系统的质量。


    ### 超块中的信息

    - 空闲块 – 显示系统空闲块的数量

    - 空闲 inode – 显示原始 inode 分配

    - 空闲 inodes – 显示系统空闲 inode 的数量

    - 块组编号 – 指分配给超级块的

    - 每组块数 – 显示一组的块数量

    - 块大小 – 指系统的块大小；信息以字节为显示

    - 魔数 – 指授予挂载软件进行评估的权限

    - 挂载计数 – 指系统的允许评估次数

    - 修订级别 – 指系统允许的修订级别确认


    ## 全关于组描述符 (group descriptor)


    组描述符负责标记文件的数据结构。它包含了避免数据重复的详细信息。由于它的作用，系统损坏的可能性极低。


    ### 组描述符中的信息

    - 块位图 (Blocks bitmap)

    - 空闲块计数

    - 空闲 inode 计数

    - inode 位图 (Inode bitmap)

    - inode 表 (Inode table)

    - 已目录计数


