    # 第 20 章：配置系统日志


    在 Linux 中，可以通过命令行方便地配置网络设置。这包括指定网络的 IP 地址（ip address）、子网掩码（`subnet mask`）以及代理服务器端口（proxy
    server port`）。


    你可以首先检查网络接口是开启还是关闭状态。这些网络接口定义在 `/etc/network/interface` 文件中。你可以用 `vim` 编辑器打开它并查看内容。要通过命令行配置特定的接口，请使用以下命令语法：


    ```

    ifconfig interface_name ip_address netmask subnet_mask.

    ```


    如果你想配置接口 `eth1`，可以使用以下命令：


    ```

    ifconfig eth1 192.168.160.1 netmask 255.255.255.0

    ```


    如果你需要查看系统上当前打开的所有网络连接，请使用以下命令：


    `netstat`


    路由表用于存储主机及其用于网络服务的 IP 地址（ip addresses）。它决定了特定的数据或数据包发送到哪个主机。要查看此表的内容，请使用命令：


    ```

    netstat –r

    ```


    ![Description: 00034.jpeg](img/rsrc1K4.jpg)


    你可能发现某个接口处于关闭状态。如果你需要将其开启，请使用以下命令：


    ```

    ifup interface_name

    ```


    这无疑会启用接口。要查看你的机器是否连接到另一个设备，你需要 `ping` 另一台机器。如果已连接，该机器将向你的机器发送 `ICMP echo packets`（ICMP
    回显包）。如果没有连接，这些数据包将不会发送到你的机器。可以使用其 IP 地址 ping 另一台机器，如下所示：


    ```

    ping 192.168.160.2

    ```


    上述命令将 ping 上 IP 地址的机器。


    ![Description: 00035.jpeg](img/rsrc1KD.jpg)


    在我的情况下，如上图所示，该机器无法访问的，因为我的电脑没有连接到上述 IP 地址的机器。你还会注意到，即使没有连接，进程也会继续尝试 ping 这台机器。要强制停止它，只需按下
    `Ctrl + C` 即可立即停止。让我们看看 ping 本地机器会发生什么：


    ```

    ping 127.0.0.1

    ```


    ![Description: 00036.jpeg](img/rsrc1KK.jpg)


    如从上图所示，本地主机是可以访问的。再次，进程将继续 ping 该机器，所以，再次只需按下 `Ctrl + C` 进程就会被杀死。与其发送永远不会结束的数据包，你可以如下如下指定需要接收的
    `ICMP echo packets` 数量：


    ```

    Ping –c4 127.0.0.1

    ```


    这将在标准输出上仅返回四个 `ICMP echo packets`。之后，进程将如所示停止。


    ![Description: 00037.jpeg](img/rsrc1KV.jpg)


    你还会注意到，当 `ICMP echo packets` 发送到你的机器时，它们会显示在标准输出上。你可能对这种文字模式不感兴趣。要使其保持静音，你可以采取以下操作：


    ```

    ping –c4 127.0.0.1 –q

    ```


    ![Description: 00038.jpeg](img/rsrc1M1.jpg)


    如上图所示，ping 是静音的，而不是文字显示。若要在静音时将过程文字化，可以使用 `–v` 选项代替 `-q` 选项。


