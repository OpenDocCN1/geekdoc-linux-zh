- fmt: "\nBear in mind that any files or directories that are within the `Practicals`\
    \ directory will be copied into the `Practicals_beginner` directory.\n\n# Chapter\
    \ 8 : setting up Linux\n\nAs mentioned before, we will be using `Debian` for our\
    \ demonstrations. To recap, `Debian` is a distribution that provides excellent\
    \ stability and scales up exceptionally well once your skills and knowledge progress\
    \ past the beginner stages. In this section, we will highlight the process of\
    \ installing and configuring `Debian`, showing you every single step along the\
    \ way.\n\n## Installing Linux Step-by-Step\n\n### Boot Menu\nIn order to begin\
    \ with the installation of `Debian`, first, boot the computer (in our case the\
    \ VirtualBox image) from the ISO image you have downloaded. If you are also using\
    \ a virtual machine, see your virtual machine vendor website for help on how to\
    \ enable the ISO image. Next, wait for the boot menu to appear on the screen.\
    \ The image below shows you the different options that are offered. Using the\
    \ cursor keys, you can navigate the boot menu, and the `Enter` key selects an\
    \ entry. \n\nThe different options are:\n- `Graphical install`: start the installation\
    \ process using a graphical installer\n- `Install`: starting the installation\
    \ process using a text-based installer\n- `Advanced options`: select further options\
    \ like `Expert mode`, `Automated install` or `Rescue mode` (see image below for\
    \ more details)\n- `Help`: get further help\n- `Install with speech synthesis`:\
    \ starting the installation process with speech support\n\nFrom the main boot\
    \ menu choose the `Graphical` entry install, and press the `Enter` key to proceed.\n\
    \n### Language Selection\nNext, choose the language you prefer to be used during\
    \ the entire installation process. The dialogs and messages are translated accordingly.\
    \ This selection does not determine the language irrevocably your Linux system\
    \ will have; you can always choose a different language later.\n\nThe image below\
    \ shows the dialog box. `English` is already pre-selected, and so you just have\
    \ to click the `Continue` button on the lower-right corner of the dialog box in\
    \ order to continue.\n\n![Description: 00008.jpeg](rsrcH0.jpg)\n\n### Location\
    \ Selection\nThird, make a selection regarding your location (see image below).\
    \ Based on your language setting made before, the countries are listed in which\
    \ the chosen language is mainly spoken. This also influences the locale settings\
    \ like the time zone your computer is in. In order to have a different setting\
    \ choose the entry titled `other` from the end of the list and go on from there.\
    \ Immediately you are over, click the `Continue` button to proceed with step four.\n\
    \n### Keyboard Selection\nFourth, choose your keyboard layout from the list (see\
    \ image below). For the United States, the pre-selection is `American English`.\
    \ If you use a different keyboard layout select the right one from the list. If\
    \ done, click the `Continue` button to proceed with step five.\n\n### Network\
    \ Setup\nStep five includes loading the installer components from the ISO image,\
    \ and the detection of the network hardware in order to load the correct network\
    \ driver. Then, the installer tries to connect to the internet to retrieve an\
    \ IP address via `DHCP` from your local network server.\n\nWhen done, you can\
    \ set up the hostname of your computer (see image below). Choose a unique name\
    \ for your machine that consists of a single name and does not exist yet in your\
    \ local network segment. It is common to use names of fruits, places, musical\
    \ instruments, composers and characters from movies. In this case, we choose the\
    \ name `debian95` that simply represents the Linux distribution and its number\
    \ version.\n\nWhen you are done, press the `Continue` key in order to proceed\
    \ with step six to add a domain name like `company.com` (see image below). In\
    \ this case, it is not needed. That’s why we leave the entry empty. Click the\
    \ `Continue` button on the lower-right corner to proceed.\n\n### Users and Roles\n\
    Our Linux system needs at least two users in order to be operated. One is an administrative\
    \ user that has a fixed name `root` and the other is a regular user that we just\
    \ give the name `User`.\n\nIn the next two steps, you set the password for the\
    \ user `root` (see image below) and both the full name and account name for the\
    \ regular user. For simplicity, we use `Debian` as the full name and `User` as\
    \ the account name. For both users, choose a password that is you can remember.\
    \ You will need these passwords later to log onto your computer.\n\n### Time Zone\n\
    Setting the correct time zone is of significant importance for communication with\
    \ other services, especially in a network. Choose the value from the list as seen\
    \ in the image. The entries in the list are based on the location you have selected\
    \ before. When done, click the `Continue` button to define the storage media and\
    \ the accompanying partitions.\n\n![Description: 00009.jpeg](rsrcHH.jpg)\n\n###\
    \ Storage Media and Partitioning\nA Linux system can be distributed across a number\
    \ of different storage media like hard disks and flash drives. Over and above,\
    \ a storage media can be separated into multiple partitions. In order to do so,\
    \ the setup of Debian has the following methods available (see image below):\n\
    \n- `Guided - use entire disk`: follow the steps as provided and use the entire\
    \ disk space for the Linux installation. This creates partitions with fixed sizes.\n\
    - `Guided - use entire disk and set-up LVM`: follow the steps as provided and\
    \ use the entire disk space for the Linux installation. This option uses Logical\
    \ Volume Management (`LVM`) in order to create partitions with sizes that can\
    \ be changed later. own- `Guided - use entire disk and set-up encrypted LVM`:\
    \ follow the steps as provided and use the entire disk space for the Linux installation.\
    \ This option uses Logical Volume Management (`LVM`) in order to create encrypted\
    \ partitions with sizes that can be changed later.\n- `Manual: create partitions\
    \ individually`: this is the expert mode and requires more profound knowledge\
    \ about partitions and file system. From the list choose the `Guided-use the entire\
    \ disk`. The values for partition are chosen according to experience, implemented\
    \ as an algorithm. A manual calculation is not required.\n\nClick the `Continue`\
    \ button on the lower-right corner to proceed. Next, select the disk to partition.\
    \ As for our case, we have only one disk available (see image below). Later on\
    \ in this guide, the disk will be referred to as `/dev/sda` for the 1st SCSI disk.\n\
    \nA disk partition refers to a piece of the storage media that is organized separately\
    \ and is intended to contain a branch of the Linux system tree. There is no universal\
    \ way to do this correctly. This guide shows a simple but safe solution that works\
    \ for a basic system. The menu in the dialog box offers the following options:\n\
    - `All files in one partition`: use just a single partition to keep programs and\
    \ user data.\n- `Separate /home partition`: store programs and user data in separate\
    \ partitions.\n- `Separate /home`, `/var`, and `/tmp` partitions`: keep user data,\
    \ variable data and temporary data in separate partitions.\n\nClick the `Continue`\
    \ button on the lower-right corner to proceed with the installation. The next\
    \ step is to confirm the partition scheme. This is calculated automatically based\
    \ on experience and contains these partitions:\n- `sda1`: the first partition\
    \ of the first SCSI disk is a primary partition with a size of `3 GB`, formatted\
    \ with the `ext4` file system, and referred to as the root part of the system\
    \ tree (`/`).\n- `sda5`: the fifth partition of the first SCSI disk is a logical\
    \ partition with a size of `1.3 GB`, formatted with the `ext4` file system, and\
    \ reserved to store variable data of the system tree (`/var`).\n- `sda6`: the\
    \ sixth partition of the first SCSI disk is a logical partition with a size of\
    \ `3.3 GB`, formatted as a `swap` file system.\n- `sda7`: the seventh partition\
    \ of the first SCSI disk is a logical partition with a size of `311 MB`, formatted\
    \ with the `ext4` file system, and reserved to store temporary data of the system\
    \ tree (`/tmp`).\n- `sda8`: the eighth partition of the first SCSI disk is a logical\
    \ partition with a size of `8.8 GB`, formatted with the `ext4` file system, and\
    \ reserved to store the user data of the system tree aka home directories (`/home`).\n\
    \nDue to historical reasons, a hard disk can contain four primary partitions only.\
    \ The fourth one is called an `Extended Partition` if divided into so-called logical\
    \ partitions or logical drives. In our case, the logical partitions `/dev/sda5`,\
    \ `/dev/sda6`, `/dev/sda7` and `/dev/sda8` are stored on the primary partition\
    \ `/dev/sda4`. The partitions `/dev/sda2` and `/dev/sda3` are not in use.\n\n\
    From the above list, choose the entry `Finish partitioning and write changes to\
    \ disk`. Click the `Continue` button on the lower-right corner to proceed and\
    \ to confirm the partition scheme (see below image). Choose `yes` from the list\
    \ and click the `Continue` button to partition the disk. Note that all the data\
    \ on the selected storage device will be lost and the disk will be empty.\n\n\
    Having divided the storage media into single partitions, the partitions will be\
    \ formatted with the file system as defined before. In our case, the partitions\
    \ `/dev/sda1`, `/dev/sda5`, `/dev/sda7` and `/dev/sda8` will get an `ext4` file\
    \ system, and the partition `/dev/sda6` will get a `swap` filesystem. As soon\
    \ as this step is completed, the base system of `Debian` will be installed.\n\n\
    ## Package Management\n\n![Description: 0010.jpeg](rsrcJC.jpg)\n\nThe ISO image\
    \ contains the installer and a number of packages to set up the Linux base. For\
    \ example, this includes the Linux kernel being installed. The next step is that\
    \ you have to decide whether to use additional installation media or not. In our\
    \ case, we have just a single disk and can consequentially select `No` from the\
    \ menu (see below). As pointed out earlier, the software for `Debian` is organized\
    \ in packages. These packages are provided in multiple repositories. The repositories\
    \ are made available via mirrors that are maintained by universities, private\
    \ persons and other organizations located in different countries. In the next\
    \ step, you will have to decide from which country you would like to retrieve\
    \ your Debian packages. It is recommended to choose a mirror that is geographically\
    \ near you to minimize the time that is needed to transport the data from the\
    \ mirror to your computer. As an initial step, choose your desired country. As\
    \ a second step, choose a preferred mirror from the list (see below). The list\
    \ includes universities, internet providers, government services and other organizations.\
    \ In our case, your network includes a proxy server to communicate with the outside\
    \ world. In such instance, we do not have that and leave the entry empty. Click\
    \ the `Confirm` button to proceed. As soon as the single parameters are set, the\
    \ `Debian` installer connects to the previously selected mirror and retrieves\
    \ the package lists. A package list contains the packages that are available,\
    \ including the name, size, and description. Depending on the quality and bandwidth\
    \ of your connection this step can take a while. Next, you are asked to take part\
    \ in Popcon, the Debian package contest (see below). This information is optional\
    \ and is used only by the team of developers that is responsible for the Debian\
    \ packages. Based on Popcon, they figure out which packages are installed most.\
    \ In our case, we do not participate in Popcon, and leave the selection to `No`.\
    \ Click the `Confirm` button to proceed with the selection of software tasks (`tasksel`).\n\
    \n### Software Selection\n`Debian` offers carefully arranged selections of packages,\
    \ so-called tasks. The idea behind them is to group packages for specific uses\
    \ in order to simplify the installation. From the list in the dialog window (see\
    \ below) you can choose between different environments, as well as a web server,\
    \ a print server, an SSH server and the standard system utilities. To have a minimal\
    \ installation just enable the last two entries from the list. We will install\
    \ the XFCE desktop later.\n\nHaving confirmed the software selection, the `Debian`\
    \ installer retrieves the needed packages from the package mirror, unpacks and\
    \ then installs them. The bar below shows the progress. In this case, 140 packages\
    \ have to be downloaded.\n\n### Setting up GRUB\nIn order to start our newly installed\
    \ `Debian` system, we have to set this information too. This process is called\
    \ booting the system. The software component that handles this step is named Unified\
    \ Boot Loader (`GRUB` or `GNU GRUB` to be precise). The entry `Yes` is already\
    \ pre-selected, and we can click `Continue` to proceed. The `Debian` installer\
    \ needs to know where to install `UB`. The menu in the image below lists the storage\
    \ media to be considered. In our case, we choose the second entry from the list\
    \ (`/dev/sda`). Then, click `Continue` to proceed. Now that we are nearly finished\
    \ with the basic installation, the only thing left to do is just a single dialog\
    \ box to read.\n\n### Finishing the Installation\nThe following dialog box informs\
    \ you that the installation is complete. Then click `Continue` to reboot the newly\
    \ installed system. After a few seconds, the text-based `GRUB` boot menu will\
    \ appear on the screen. The boot menu includes two options: `Debian GNU/Linux`\
    \ and `Advanced options for Debian/Linux`. The first menu item is highlighted\
    \ and pre-selected. The second menu entry allows you to set specific boot options.\
    \ For a comprehensive list of these options have a look at the `GRUB` manual at\
    \ `www.gnu.org/software/grub/manual/grub`. Keep the first menu item selected and\
    \ press `Enter` to proceed and boot the new system. Your `Debian` system will\
    \ start and initialize the necessary system services. This step will take a few\
    \ seconds to be completed. Finally, a black-and-white screen will be visible on\
    \ the first text terminal named `tty1` (see below) and ask you to log into the\
    \ system. The login prompt consists of two components: the hostname of your Linux\
    \ system (`debian95`) followed by space and the word `login`.\n\n```\nDebian GNU/Linux\
    \ 9 debian95 tty1\ndebian95 login: _\n```\n\nHaving logged into the system, you\
    \ will add further software to be able to use a graphical interface, based on\
    \ the `XFCE` desktop. At this step of the installation process, adding further\
    \ software can only be done by logging in as the administrative `root` user. In\
    \ order to do so, type in `root` at the login prompt, press `Enter`, wait for\
    \ the text `Password:` to appear and type in the password set for the `root` user\
    \ you defined before. The Linux system will welcome you (see below) with a login\
    \ message. The first line of the login message will give you a display on the\
    \ time of your last login followed by the version of the Linux kernel that is\
    \ currently running (line two) and the usage advice (lines five to eight). \n\n\
    After the welcome message `Debian` opens a command-line prompt:\n\n```\nroot@debian95\
    \ ~#\n```\n\nThis command-line prompt consists of four components:\n- `root`:\
    \ the name of the user who logged in\n- `debian95`: the hostname of the Linux\
    \ system\n- `~`: the current directory. In this case, it is the home directory\
    \ of the user currently logged in.\n- `#`: the login symbol representing the root\
    \ user\n- `$`: the symbol used by regular users without administrative rights\n\
    \nImportant: you are now logged in as the administrative root user. Take care\
    \ which commands you type in, and check twice in doubt. Any mistakes can lead\
    \ to the necessity to install or repair your Linux system.\n\n## Adding a Graphical\
    \ Interface\n\n![Description: 0011.jpeg](rsrcK8.jpg)\n\nAt its current stage,\
    \ the `Debian` system is fully active and can be used in production. For a desktop\
    \ system suitable for regular user, it lacks an excellent and easy-to-use graphical\
    \ interface. In this step, we will change that and install the `XFCE` desktop.\
    \ The list includes the following:\n- `apt`: package manager\n- `xdm`: display\
    \ manager\n- `xfce4`: desktop environment\n\n`Debian` uses `apt` to handle the\
    \ installation, the removal of software and the related package lists. Also `apt`\
    \ resolve all dependencies and ensures that the relevant software is available\
    \ on the system. In our case, a total of roughly 450 MB of data have to be retrieved\
    \ from the mirror and installed. In order to install the packages, type in the\
    \ following commands at the command-line. Just type the command after the `#`:\n\
    \n```\nroot@debian95 ~# apt-get install xdm xfce4\n```\n\n`apt` will display further\
    \ information regarding the packages installed. This includes the list of depending\
    \ packages and recommended packages. In the end, you will see a command-line prompt.\
    \ Type `Y` or press `Enter` to install `apt`, `xdm` and `xfce4` as well as the\
    \ depending packages. For the `xdm` display manager, two dialog boxes have to\
    \ be confirmed (see below). The retrieval of the software to be installed takes\
    \ a while. When finished, the command-line prompt will appear again. In order\
    \ to activate the changes regarding the graphical desktop, restart the system.\
    \ Type the command `boot` at the command-line prompt as:\n\n```\nroot@debian95\
    \ ~# reboot\n```\n\nHaving restarted the Linux system, `Debian` welcomes us with\
    \ a graphical boot screen (see below). Press `Enter` to start the Linux system\
    \ with the default settings. A few seconds later a graphical login screen will\
    \ be visible (see below). Log in to the system with the regular user named `user`\
    \ as created earlier. Type in `user`, press `Enter` and type in the password for\
    \ the user. Then, press `Enter` again to confirm and log in. Next, the `XFCE`\
    \ desktop will be visible (see below). The desktop comes with a number of default\
    \ elements: an upper navigation bar, a lower navigation bar and desktop icons.\
    \ All the mentioned elements are explained below:\n- **Upper navigation bar**:\
    \ shows buttons to access the different applications, the virtual desktop screens,\
    \ the clock and a button for various user actions such as lock the screen, change\
    \ the user, change to standby mode and exit the current session.\n- **Lower navigation\
    \ bar**: contains several buttons to hide all the opened windows and show the\
    \ empty desktop, to open a terminal, the file manager, a web browser, find an\
    \ application and open the file manager directly with your home directory.\n-\
    \ **Desktop icons**: from top to bottom there is a trash bin, file manager icons\
    \ that link to the computer, and the home directory.\n\nA right-click on the desktop\
    \ opens a context menu that allows you to access the various applications.\n\n\
    ## Adding Additional Software\n\nUntil now the software available to be used on\
    \ your Linux system has been somewhat limited. After all that, the next thing\
    \ to do is to add the following Debian packages to make your life a bit easier:\n\
    - `firefox-esr`: the web browser Mozilla Firefox (Extended Support Release)\n\
    - `gnome-terminal`: a terminal emulation maintained by the GNOME project\n- `xscreensaver`:\
    \ a basic screensaver for the X11 system\n- `vlc`: the video player Video Lan\
    \ Client (VLC)\n\nThe installation of the packages will be done using the command-line\
    \ in a terminal emulator (we will look at terminals in detail later in the guide).\
    \ Currently, on your system, X11 terminal emulator `xterm` is installed. In order\
    \ to open `xterm`, click on the terminal button in the lower navigation bar or\
    \ select the entry `Application > System > Xterm` from the context menu.\n\nAs\
    \ step one, open `xterm`. Next, type in the command `su` next to the command-line\
    \ prompt as follows and press `Enter`:\n\n```\nuser@debian95: ~$ su\nPassword:\n\
    ```\n\nYou may remember from the previous steps that only an administrative user\
    \ can install, update or remove software on a Debian system. The `su` command\
    \ abbreviates switch user and changes your current role. Used without an additional\
    \ name, the role changes to the administrative `root` user. At the password prompt\
    \ type in the password for the administrative user and press `Enter`.\n\nAs an\
    \ administrative user, install the packages: `firefox-esr`, `gnome-terminal`,\
    \ `xscreensaver` and `vlc` as follows:\n\n```\nroot@debian95 ~# apt-get install\
    \ firefox-esr gnome-terminal xscreensaver vlc\n```\n\nThe output is seen below.\
    \ After the installation of the four packages, you can switch back to your role\
    \ as a regular user. Press `Ctrl+D` to quit the admin part, and press `Ctrl+D`\
    \ again to close `xterm`.\n\nThe installation of `Firefox` has the following effects:\n\
    - The new software `Firefox` is available from the application menu.\n- The new\
    \ command `Firefox` is available from the command-line.\n- The earth icon from\
    \ the lower navigation bar links to the Firefox browser.\n\nThe installation of\
    \ `gnome-terminal` has the following effects:\n- The new software `gnome-terminal`\
    \ is available from both the command-line and the application menu.\n- The terminal\
    \ icon from the lower navigation bar links to the `gnome-terminal`.\n\nIn order\
    \ to see the changes, select the entry `Open Terminal Here` from the context menu.\
    \ The image below shows the terminal window. It comes with a white background\
    \ and a bigger font that is easier to read.\n\nThe first one is to type `sudo`\
    \ before the command, which is an abbreviation for \"super user do\". It is a\
    \ term in Linux that identifies your privilege level. So, `sudo` allows you to\
    \ make changes to files and performs administrative tasks for this one command.\
    \ Try:\n\n```bash\nsudo nano ./file\n```\n\nNow you can edit the file. Try to\
    \ write a line to the file: `test343`. Use `Ctrl+O` and hit `Enter`. Success.\
    \ You will see a message that says you wrote 1 line. Now you can exit and your\
    \ changes will be saved.\n\nWhat if you don't want to retype the entire command?\
    \ Try:\n```bash\nsudo nano ./file\n```\n\nIf you try to write to the file, it\
    \ will fail because permission is denied. You haven't run the specific command\
    \ at `sudo`. You need to type `sudo !!`. The two exclamation marks mean run the\
    \ previous command. Try:\n\n```bash\nsudo !!\n```\n\nWrite to the file: `test343`.\
    \ Success!\n\nWhat if you have a lot of things to do, and you don't want to write\
    \ `sudo` before every single command? You could do this using the `su` command,\
    \ which means switch user. Generally, you type switch user, or `su`, followed\
    \ by the name of the user account you want to switch. You can type `sudo su` and\
    \ this will move you to the root account. The root user has 100% control of everything.\
    \ Try:\n\n```bash\nsudo su\nnano file\n```\n\nWrite to the file: `This is a new\
    \ line`. \nSave and close the file.\n\nWhen you want to switch back to your user\
    \ account, type `su username`, using your username. If you get a permission error\
    \ when running a command, you may need to run that command as `sudo`. For instance,\
    \ if you're editing files in a directory other than your home directory, you won't\
    \ have permission to edit those files. Later we will look at how to get permission\
    \ to edit those files, but for right now, this is when you would run your command\
    \ pre-pended by `sudo`.\n\nIf you have a lot of these commands to run, and you\
    \ don't want to type `sudo` before every command.\n\n## Chapter 9 : navigating\
    \ Linux\n\nNow we need to talk about basic folder navigation in the Linux operating\
    \ system. This is slightly different from Windows. However, the funny thing is\
    \ that it looks enough to Windows that when things do not work, people have the\
    \ urge to pick up their computer and throw it out the window.\n\n![Description:\
    \ 00053.jpeg](rsrcND.jpg)\n\nTake the above diagram for example. In Linux, you\
    \ also have the `cd` command. Just like in Windows, the `cd` stands for change\
    \ directory. If you want to go to a different directory or folder you type `cd`.\
    \ If you are in a folder, let us say you are in the `var` folder in our illustration,\
    \ and you want to go to a folder within the `var` folder, which in this case is\
    \ the `abc` folder, all you need to do is type in the command:\n\n```bash\ncd\
    \ abc\n```\n\nSo, that is `cd`, a space, and then the name of the folder you want\
    \ to go to. That will drop you in the folder you are trying to go into. Now, the\
    \ problem is, people in the Windows world are used to following the `cd` command\
    \ with a forward slash symbol. If we were to apply this in our previous command,\
    \ it will look like the one below:```bash\ncd /abc\n```\n\nWhat Linux does in\
    \ this case is it interprets the forward slash symbol as the root folder. Linux\
    \ will think that you want to change to the root folder, and then look for the\
    \ `abc` folder within the root folder. Of course, once Linux executes this command,\
    \ it will not be able to find an existing `abc` folder since in actuality the\
    \ `abc` folder is located in the `var` folder. That is where you have to be extremely\
    \ careful. This is one reason why a lot of Linux administrators always type in\
    \ the full path to wherever they are trying to go, no matter where they are at.\
    \ If a Linux administrator is trying to go in and change something in the `abc`\
    \ folder, they will just type in the command:\n\n```bash\ncd /etc/var/abc\n```\n\
    \nLinux is finicky about this whole change directory syntax. As we have mentioned\
    \ before as well, capitalization matters in Linux. If you are trying to reach\
    \ a folder whose name is written in all lowercase, and you type the folder in\
    \ all capital letters, Linux will not be able to find it; it will say that the\
    \ directory cannot be found. All of this is important for you to understand. It\
    \ can be extremely frustrating if you do not grasp it. ![Description: 00054.jpeg](rsrcNU.jpg)\n\
    \nSo, the first thing you want to do when navigating files and folders in Linux\
    \ is to make that you are in the root directory. To do this, you must type the\
    \ command:\n\n```bash\ncd /\n```\n\nThat is `cd`, a space, and then a forward\
    \ slash. This is automatically bring you to the root directory if you are not\
    \ already there. Now the next logical thing to do would be to see what folders\
    \ are within the root folder itself. To do this, you must type the command:\n\n\
    ```bash\nls\n```\n\nThe `ls`, or `list` command will list all the files and folders\
    \ within a particular directory--root, in this case. ![Description: 00055.jpeg](rsrcP2.jpg)\n\
    \nAs you see after typing in the `ls` command, Linux will now show you all the\
    \ folders that within the root directory. You can see lots of folders here like\
    \ `bin`, `dev`, `opt`, `sys`, `var`, `boot`, `etc`. Now let's say we want to go\
    \ inside the `etc` folder. All you need to do is type the command:\n\n```bash\n\
    cd etc\n```\n\nThe command above will automatically drop you inside the `etc`\
    \ folder. If you look beside the blinking cursor of the command prompt, it will\
    \ say `/etc$`. That is the main indication that you are inside the actual folder.\
    \ If you do the `ls` command again, it will show you all the files within the\
    \ `etc` folder. ![Description: 00056.jpeg](rsrcP9.jpg)\n\nIn order to go back\
    \ to the root folder, all you need to do is type:\n\n```bash\ncd /\n```\n\nThis\
    \ will automatically return you to the root directory no matter how deep you are\
    \ within the folders. Now let's say you want to go back to `etc` folder. But this\
    \ time instead of typing `etc` in lowercase, you typed it in all uppercase. ![Description:\
    \ 00057.jpeg](rsrcPH.jpg)\n\nAs you see, Linux will not be able to find the directory\
    \ `ETC`. Why? Because Linux cares about capitalization. Uppercase letters are\
    \ different from lower case letters in the Linux world. Basically, that is all\
    \ there in Linux basic navigation.\n\n# Chapter 10 : essential Linux commands\n\
    \nIn this section, we will explore the basic commands that are necessary to get\
    \ started. You can now open the terminal. Right click on the Desktop and choose\
    \ `Open Terminal`. Changing Directories\nYou might also want to navigate or change\
    \ directories via the terminal. To achieve this, use the command `cd` which stands\
    \ for \"change directory\". Example:\n\n```bash\ncd /home\n```\n\nThe above command\
    \ will change the working directory to the `/home` directory. The use of forward\
    \ slash (`/`) is to mean relative to the root, meaning that this command is executed\
    \ regardless of the directory that you currently in. Now type the following command:\n\
    \n```bash\ncd httpd\n```\n\nThe directory will be changed to `httpd` but relative\
    \ the `/home` directory. The full working directory will be `/home/httpd`. Now\
    \ type the following command:\n\n```bash\ncd ..\n```\n\nThis command will change\
    \ the working directory to the parent directory of the current directory. In our\
    \ case, we will move from `/home/httpd` to the `/home` directory. Type the following\
    \ command:\n\n```bash\ncd ~\n```\n\nThis command changes the directory to the\
    \ user’s home directory `/home/(username)`. The `username` will be the name you\
    \ used on the computer. The symbol `~` is called tilde and it is used in Linux\
    \ to represent the user’s home directory.\n\n### Copying Files\nThe command `cp`,\
    \ which stands for \"copy files\" is used for copying (Wait, it's `cp`). \nThe\
    \ command `cp`, which stands for \"copy files\" is used for copying files. Note\
    \ that the file is not deleted from its initial location and a duplicate of the\
    \ same is made at the specified location. Type the following command:\n\n```bash\n\
    cp first me\n```\n\nThe command above will make a duplicate of the file `first`\
    \ at the same directory but with a new name, is `me`. If the file `me` exists\
    \ in the directory, it will be overwritten and you will not be warned before this\
    \ command is executed. Consider the command:\n\n```bash\ncp -i first me\n```\n\
    \nNote that in the above command we have added the `-i` option. If the file `me`\
    \ exists in the directory, you will be notified before it is overwritten. Next,\
    \ try the following command:\n\n```bash\ncp -i /d/file\n```\n\nWith the above\
    \ command, the file `/d/file` will be copied into the same current directory and\
    \ then named `file`. Note that we used the `-i` option so if it exists we will\
    \ be notified before it is overwritten. You might also need to copy all the files\
    \ contained in a particular directory to another directory. This can be achieved\
    \ as follows:\n\n```bash\ncp -dpr source destination\n```\n\nAll the files in\
    \ the directory `source` will be copied to the directory `destination`. Notice\
    \ that we used the option `-dpr`. This means the:\n- `-d`: means that links will\
    \ be preserved\n- `-p`: file attributes will be preserved\n- `-r`: copying will\
    \ be done recursively\n\nIt is good to specify those options if needed while copying\
    \ all the files from a directory, otherwise, the default settings will be applied\
    \ which might produce an unwanted result. To show the amount of space on a disk\
    \ used on each of the mounted file systems, use the command `df`.\n\n### `Less`\
    \ Command\nThe `less` command is the same as the `more` command. The difference\
    \ comes in that with this command the user can page up or down through the file.\
    \ Consider the example:\n\n```\nless first\n```\n\nThe above command will display\
    \ the contents of the file `first`.\n\n### `Ln` Command\nThis command creates\
    \ a symbolic link to a certain file. Write and run the following command:\n\n\
    ```bash\nln -s first slink\n```\n\nThe command above will create a symbolic link\
    \ named `slink` which will link to the file `first`. The command `ls -i first\
    \ slink` will show that the two files are different and have different \"inodes\"\
    .\n\n### `Locate` Command\nThis is used for searching in the database. Run the\
    \ following command:\n\n```bash\nslocate -u\n```\n\nA database named `slocate`\
    \ will be created. This will take some time to complete, so be patient. Before\
    \ you will be able to search for a file, this command must be run first. However,\
    \ on most systems, `cron` will run this command on periodical basis. Again, run\
    \ the following command:\n\n```bash\nlocate whois\n```\n\nThis command will look\
    \ for files in your system whose name contains the string \"whois\".\n\n### `Logout`\
    \ Command\nThe command is used to logout the user who is currently logged into\
    \ the system. Just go to the terminal and type this command:\n\n```bashlogout\n\
    ```\n\nYou will then be logged out and returned to the login screen.\n\n### `Ls`\
    \ Command\n`ls` stands for list. It is used for listing files in a directory.\
    \ However, it comes with many options which needs to be known as well, otherwise\
    \ you will become confused. Just type the command:\n\n```bash\nls -al\n```\n\n\
    The figure above is the directory and contains the files shown. Note that only\
    \ the file names will be listed. You might need to show more details about the\
    \ files in the directory such as the ownership, size, and date stamp. This can\
    \ be achieved with the following command:\n\n```bash\nls -al\n```\n\n### `More`\
    \ Command\nSend contents of a file one page a time to the screen. It can also\
    \ work on piped output. Let us list the contents of the file `/etc/profile` to\
    \ the screen.\n\n```bash\nmore /etc/profile\n```\n\nNote that the contents of\
    \ the file will be displayed one page at a time. This is because the content is\
    \ too big to be displayed on a single page. Consider the command:\n\n```bash\n\
    ls -al | more\n```\n\n### `M` Command\n`mv` stands for \"move\" and is used for\
    \ renaming or moving files. Consider the command:\n\n```bash\nmv first first2\n\
    ```\n\nThe file will be moved from `first` to `first2`, meaning it will be renamed\
    \ to `first2` rather than `first`.```bash\nmv /d/first\n```\n\nThe above command\
    \ will move the file `first` from the directory `/d` to the current working directory.\
    \ Now you have seen how the `mv` command is a powerful tool. Now that we have\
    \ been talking of working directories, what are they exactly? And how can we know\
    \ in which directory they are? Just type the command:\n\n```bash\npwd\n```\n\n\
    After pressing the enter key, you notice that the output is a directory. This\
    \ shows the directory you are currently in. The abbreviation `pwd` stands for\
    \ \"print working directory\" and is used for the purpose of showing the current\
    \ directory.\n\n### `Shutdown` Command\nThe command is used for shutting down\
    \ the system. The purpose of this command is to halt the current process and shut\
    \ down the system immediately. To do this use the following code:\n\n```bash\n\
    shutdown -h now\n```\n\nThe next command is used to reboot the system. To do this\
    \ use the:\n\n```bash\nshutdown -r now\n```\n\n### `Whereis` Command\nThis command\
    \ is used for showing the manual, source, and binary files for a command. Consider\
    \ the command:\n\n```bash\nwhereis ls\n```\n\nThis command will show the manual\
    \ and binary files for the command `ls`. To see the list of commands which have\
    \ been on your system previously, use the command:\n\n```bash\nhistory\n```\n\n\
    Above is the list of commands which have been run on my system. You can try on\
    \ your system and observe the output.\n\n### `Sudo` Command\nThis stands for \"\
    super user do\". It has the purpose of allowing a permitted user to execute commands\
    \ as a \"super user\". This is usually defined in the `sudo`-er’s list. It has\
    \ the importance of ensuring security by making sure that sensitive commands are\
    \ only executed by the correct people. Another command, the `su` command enables\
    \ you to log in to the system as a super user. The purpose of `sudo` is to borrow\
    \ privileges from the super user. This explains the difference between these two\
    \ commands, the `su` and the `sudo` commands. The `sudo` command is normally used\
    \ in commands which will change the system files, such as when updating or upgrading\
    \ the OS. This shows how secure the command is compared to the `su` command.\n\
    \n### `Mkdir` Command\nThis stands for \"make directory\". It creates a new directory\
    \ and names its path. If this path is already in existence, an error saying the\
    \ folder cannot be created will be outputted. Consider the:\n\n```bash\nsudo mkdir\
    \ m\n```\n\nI have made a directory named \"m\". Once I list the available directories\
    \ after creating the directory, I find that it has been created. Notice that I\
    \ have run the command as `sudo`. Without this, the command won’t run. This is\
    \ for security purposes. Once you use the `sudo` command for the first time, you\
    \ will be prompted to provide the password for the super user to do so. It is\
    \ good to note that you can only create a directory inside a folder and must have\
    \ \"write permission\" on folder. Otherwise, you will be unable to do so.\n\n\
    ### `Uname` Command\nIt stands for \"Unix name\". With this command you can get\
    \ detailed information about the operating system, kernel and the machine. Consider\
    \ the:\n\n```bash\nuname\n```\n\nAbout the OS, kernel, and the machine have shown:\n\
    - `Ubuntu`: the name of the kernel\n- `SMP`: processor configuration\n- `GNU/Linux`:\
    \ the name of system\n\n### `Touch` Command\nThis command is used to create a\
    \ file if and only if does not exist. It stands for Update the access and modification\
    \ times of each file to the current time. In case the file already exists, its\
    \ timestamp will be changed but its contents remain the same. To create a file\
    \ named `file` use:\n\n```bash\ntouch file\n```\n\nIf the file does not exist\
    \ in the directory, it will then be created.\n\n### `Cal` Command\nIt can be used\
    \ to display the month of the current date or the month of past.\n\n```bash\n\
    cal\n```\n\n### `Date` Command\nUsed for displaying both the current date and\
    \ time on the terminal. If the current date of your system is wrong, you can set\
    \ it to the correct date as follows:\n\n```bash\ndate -set=\"march 2015 18:50\"\
    \n```\n\nIn the above command, we have set both the date and the time.\n\n## Chapter\
    \ 11 : instruction to linux terminals\n\nIf you change directory to `/etc` and\
    \ then type `ls`, you would see the contents of the `/etc` directory. Let’s say\
    \ you want to edit this newly created file. You will use `nano` to edit this file.\
    \ We will go into `nano` later. `Nano` is a Terminal application for text editing.\n\
    \nOpen the file:\n\n```bash\nnano ./file\n```\n\nThat’s great. You can open it.\
    \ But what happens when you try to write to it? If you use `Ctrl+O` on your keyboard,\
    \ which is the command to save the file, and hit `Enter`, Terminal will return\
    \ an error, warning that you don’t have permission to write this file. If you\
    \ use `Ctrl+X` on your keyboard, it will ask you if you want to save changes,\
    \ and you can say no because you can’t. Well then, how do you edit that file?\
    \ You need to use administrator privileges in order to be able to edit a file\
    \ for which you have permissions. There are two ways to do this. The first one\
    \ is to type `sudo` before the command, which is an abbreviation for \"super user\
    \ do\". It is a term in Linux that identifies your privilege level. So, `sudo`\
