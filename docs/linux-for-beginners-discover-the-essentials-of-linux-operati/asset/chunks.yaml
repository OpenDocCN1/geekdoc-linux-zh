    The advantages of the command line are especially obvious when you need to perform
    similar operations on a variety of objects. In a system with a graphical interface,
    you need as many mice dragging as there are objects, one command will be enough
    on the command line. This section will describe the main tools that allow you
    to solve any user tasks using the command line: from trivial operations with files
    and directories, for example, copying, renaming, searching, to complex tasks requiring
    massive similar operations that occur as in the user''s application work, when
    working with large data arrays or text, and in system administration.


    # Shells

    A command shell or command interpreter is a program whose task is to transfer
    your commands to the operating system and application programs, and their answers
    to you. According to its tasks, it corresponds to `command.com` in MS-DOS or `cmd.exe`
    in Windows, but functionally the shell in Linux is incomparably richer. In the
    command shell language, you can write small programs to perform a series of sequential
    operations with files and the data they contain — scripts.


    Having registered in the system by entering a username and password, you will
    see a command line prompt – a line ending in `$`. Later this symbol will be used
    to denote the command line. If during the installation a graphical user interface
    was configured to start at system boot, then you can get to the command line on
    any virtual text console. You need to press `Ctrl-Alt-F1` - `Ctrl-Alt-F6` or using
    any terminal emulation program, for example, `xterm`.


    The following shells are available. They may differ depending on the distributor:


    *   `bash`: The most common shell for Linux. It can complement the names of commands
    and files, keeps a history of commands and provides the ability to edit them.

    *   `pdk`: The korn shell clone, well known on UNIX shell systems.

    *   `sash`: The peculiarity of this shell is that it does not depend on any shared
    libraries and includes simplified implementations of some of the most important
    utilities, such as `al`, `dd`, and `gzip`. Therefore, the `sash` is especially
    useful when recovering from system crashes or when upgrading the version of the
    most important shared libraries.

    *   `tcsh`: Improved version of C shell.

    *   `zsh`: The newest of the shells listed here. It implements advanced features
    for autocompletion of command arguments and many other functions that make working
    with the shell even more convenient and efficient. However, note that all `zsh`
    extensions are disabled by default, so before you start using this command shell,
    you need to read its documentation and enable the features that you need.


    The default shell is `bash` Bourne Again Shell. To check which shell you''re using,
    type the command: `echo $ SHELL`. Shells differ from each other, not only in capabilities
    but also in command syntax. If you are a novice user, we recommend that you use
    `bash`, further examples describe the work in this particular area.


    # Bash shell

    The command line in `bash` is composed of the name of the command, followed by
    keys (options), instructions that modify the behavior of the command. Keys begin
    with the character `-` or –, and often consist of a single letter. In addition
    to keys, after the command, arguments (parameters) can follow – the names of the
    objects on which the command must be executed (often the names of files and directories).


    Entering a command is completed by pressing the Enter key, after which the command
    is transferred to the shell for execution. As a result of the command execution
    on the user’s terminal, there may appear messages about the command execution
    or errors, and the appearance of the next command line prompt (ending with the
    `$` character) indicates that the command has completed and you can enter the
    next one.


    There are several techniques in `bash` that make it easier to type and edit the
    command line. For example, using the keyboard, you can:

    *   `Ctrl-A`: go to the beginning of the line. The same can be done by pressing
    the `Home` key;

    *   `Ctrl-U`: delete current line;

    *   `Ctrl-C`: Abort the execution of the current command.


    You can use the symbol `;` in order to enter several commands in one line. `bash`
    records the history of all commands executed, so it’s easy to repeat or edit one
    of the previous commands. To do this, simply select the desired command from the
    history: the `up` key displays the previous command, the `down` one and the next
    one. In order to find a specific command among those already executed, without
    flipping through the whole story, type `Ctrl-R` and enter some keyword used in
    the command you are looking for.


    Commands that appear in history are numbered. To run a specific command, type:
    `! command number`

    If you enter `!!`, the last command typed starts.


    Sometimes on Linux, the names of programs and commands are too long. Fortunately,
    `bash` itself can complete the names. By pressing the `Tab` key, you can complete
    the name of a command, program, or directory. For example, suppose you want to
    use the `bunzip2` decompression program. To do this, type: `bu` Then press `Tab`.
    If nothing happens, then there are several possible options for completing the
    command. Pressing the `Tab` key again will give you a list of names starting with
    `bu`. For example, the system has `buildhash`, `builtin`, `bunzip2` programs:

    ```

    $ bubuildhash builtin bunzip2

    $ bu

    ```

    Type `n>` ( `bunzip` is the only name whose third letter is `n`), and then press
    `Tab`. The shell will complete the name and it remains only to press `Enter` to
    run the command!


    Note that the program invoked from the command line is searched by `bash` in directories
    defined in the `PATH` system variable. By default, this directory listing does
    not include the current directory, indicated by `./` (dot slash). Therefore, to
    run the `prog` program from the current directory, you must issue the command
    `./prog`.


    # Basic commands

    The first tasks that have to be solved in any system are: working with data (usually
    stored in files) and managing programs (processes) running on the system. Below
    are the commands that allow you to perform the most important operations on working
    with files and processes. Only the first of these, `cd`, is part of the actual
    shell, the rest are distributed separately, but are always available on any Linux
    system. All the commands below can be run both in the text console and in graphical
    mode (`xterm`, KDE console). For more information on each command, use the `man`
    command, for example:

    ```

    man ls

    ```


    `cd`: Allows you to change the current directory (navigate through the file system).
    It works with both absolute and relative paths. Suppose you are in your home directory
    and want to go to its `tmp/` subdirectory. To do this, enter the relative path:
    `cd tmp/`

    To change to the `/usr/bin` directory, type (absolute path): `cd /usr/bin/`

    Some options for using the command are:

    *   `cd ..`: Allows you to make the current parent directory (note the space between
    `cd` and `..`).

    *   `cd -`: Allows you to return to the previous directory.

    *   The `cd` command with no parameters returns the shell to the home directory.


    `ls`: (list) lists the files in the current directory. Two main options: `-a`
    - view all files, including hidden, `-l` - display more detailed information.


    `rm`: This command is used to delete files. Warning: deleting the file, you cannot
    restore it! Syntax: `rm filename`. This program has several parameters. The most
    frequently used ones are: `-i` - file deletion request, `-r` - recursive deletion
    (i.e. deletion, including subdirectories and hidden files). Example:

    ```

    rm -i ~/html/*.html

    ```

    Removes all `.html` files in your `html` directory.


    `mkdir`, `rmdir`: The `mkdir` command allows you to create a directory, while
    `rmdir` deletes a directory, provided it is empty. Syntax:

    ```

    mkdir dir_name

    rmdir dir_name

    ```

    The `rmdir` command is often replaced by the `rm -rf` command, which allows you
    to delete directories, even if they are not empty [26].


    `less`: allows you to page by page. Syntax: `less filename`. It is useful to review
    a file before editing it; The main use of this command is the final link in a
    chain of programs that outputs a significant amount of text that does not fit
    on one screen and otherwise flashes too quickly. To exit `less`, press `q` (quit).


    `grep`: This command allows you to find a string of characters in the file. Please
    note that `grep` searches by a regular expression, that is, it provides the ability
    to specify a template for searching a whole class of words at once. In the language
    of regular expressions, it is possible to make patterns describing, for example,
    the following classes of strings: “four digits in a row, surrounded by spaces”.
    For more information, you can refer to the documentation (man grep). Syntax:

    ```

    grep search_file

    ```


    `ps`: Displays a list of current processes. The column indicates the process name,
    the `PID` (process identifier) is used for operations with the process — for example,
    sending signals with the `kill` command. The `ps` argument `ax` allows you to
    view those processes that do not belong to you. Argument `u` gives you more information.
    Syntax:

    ```

    ps au

    ```


    `kill`: If the program stops responding or hangs, use this command to complete
    it. Syntax:

    ```

    kill PID_number

    ```

    The `PID_number` here is the process number, you can find out the process number
    for each executable program using `ps`. Normally, `kill` sends a normal completion
    signal to the process, but sometimes does not work, and you will need to use `kill
    -9 PID_number`.


    # File and Directory Operations

    Here we consider utilities that work with file system: files, directories, devices,
    as well as file systems in general.


    *   `cp`: Copies files and directories.

    *   `mv`: Moves (renames) files.

    *   `rm`: Removes files and directories.

    *   `df`: Displays a report on the use of disk (free space on all disks).

    *   `du`: Calculates space occupied by files or directories.

    *   `ln`: Creates links to files. Supports different output formats.

    *   `mkdir`: Creates directories.

    *   `touch`: Changes file timestamps (last modified, accessed), can be used to
    create empty files.

    *   `realpath`: Calculates absolute file name by relative.

    *   `basename`: Removes the path from the full file name (i.e. shortens the absolute
    name to relative).

    *   `dirname`: Removes the file name from the full name (i.e. displays the name
    of the directory where the file is located).

    *   `pwd`: Displays the name of the current directory.


    # Filters

    Filters are programs that read data from standard input, convert it and output
    it to standard output. Using filtering allows you to organize a pipeline to perform
    sequential operations on data in a single command. Many of the commands listed
    in this section can work with files. Information about I/O redirection and the
    pipeline can be found.


    *   `cat`: Combines files and displays them to standard output.

    *   `tac`: Combines files and displays them to standard output, starting from
    the end.

    *   `sort`: Sorts rows.

    *   `uniq`: Removes duplicate lines from sorted files.

    *   `tr`: Performs the replacement of certain characters in standard input, can
    be used for transliteration, deletion of extra characters and for more complex
    substitutions.

    *   `cut`: Systematizes data in text format. It allows to display only the specified
    fields of the table in which the cells are separated by a character.

    *   `paste`: Combines data from several files into one table. By default, the
    general field is considered first.

    *   `split`: Dividing the file into parts according to a template.

    *   `expand`: Converts tabs to spaces.

    *   `expand`: Converts spaces to tabs.

    *   `fmt`: Formats the text in width.

    *   `fold`: Transfers too long lines to the next line.

    *   `wc`: Counts the number of lines, words, and characters in the file.

    *   `od`: Displays file in octal, hexadecimal and other similar forms.

    *   `head`: Displays the initial part of the file of the specified size.

    *   `tail`: Outputs the final part of a file of given size, since it can output
    data added to the end. Used to track log files.

    *   `echo`: Displays the text of the argument.

    *   `false`: Does nothing, comes out with return code of 1 (error), can be used
    in shell if an unsuccessful command is attempted.

    *   `true`: Does nothing, comes out with return code 0 (successful), can be used
    in scripts if a successful command is required.

    *   `seq`: Displays a series of numbers in a given range successively increasing
    or decreasing by a specified amount.

    *   `sleep`: Suspends execution for a specified number of seconds.

    *   `usleep`: Suspends execution for a specified number of milliseconds.

    *   `com`: Compares two pre-sorted (by sort) files by line, displays a table of
    three columns where the first are lines unique to the first, the second unique
    to the second, the third common to both files.

    *   `join`: Combines lines of two files on a common field.

    *   `split`: Splits the file into pieces.


    # Calculations

    In addition to simple operations with strings (input/output and merging), it is
    often necessary to perform some calculations on the available data. Listed below
    are utilities that perform calculations on numbers, dates, strings.


    *   `test`: Returns true or false depending on the value of the arguments. The
    `test` command is useful in scripts to check conditions.

    *   `date`: Displays and sets the system date; in addition, it can be used for
    calculations over dates.

    *   `expr`: Evaluates expressions.

    *   `md5sum`: Calculates checksum using MD5 algorithm.

    *   `sha1sum`: Calculates checksum using SHA1 algorithm.

    *   `wc`: Counts the number of lines, words, and characters in the file.

    *   `factor`: Decomposes numbers into prime factors.


    # Search

    The search for information in the file system can be divided into a search by
    file attributes (including the name, path, etc.) and content search. For these
    types of search, the programs `find` and `grep` are usually used, respectively.
    Thanks to convenient interprocess tools, these two of search are easy to combine,
    is to search for the necessary information only in files with the necessary attributes.


    ## Attribute search

    The main search tool for file attributes is the `find` program. A generalized
    call to `find` looks like this: `find path expression`, where `path` is a list
    of directories in which to search, and `expression` is a set of expressions that
    describe the criteria for selecting files and the actions to be performed on the
    files found. By default, the names of found files are simply output to standard
    output, but this can be overridden and the list of names of found files can be
    transferred to any command for processing. By default, `find` searches in all
    subdirectories of directories specified in the path list.


    ### Expressions

    Expressions that define file search criteria consist of key-value pairs. Some
    of the possible search options are listed below:

    *   `-amin`, `-an`, `-atime`: The time of the last access to the file. Allows
    you to search for files that were opened for a certain period of time, or vice
    versa, for files that nobody has accessed for a certain period.

    *   `-cmin`, `-c`, `-ctime`: The time the file was last changed.

    *   `-fstype`: The type of file system on which the file is located.

    *   `-gid`, `-group`: User and group that owns the file.

    *   `-name`, `-iname`: Matches the file name to the specified pattern.

    *   `-regex`, `-iregex`: Matches the file name to a regular expression.

    *   `-path`, `-ipath`: Matches the full file name (with the path) to the specified
    pattern.

    *   `-perm`: Access rights.

    *   `-size`: File size.

    *   `-type`: File type.


    ### Actions

    The `find` program can perform various actions on the found files. The most important
    of them are:

    *   `-print`: Output the file name to the standard output (the default action).

    *   `-delete`: delete a file.

    *   `-exec`: execute the command by passing the file name as a parameter.

    You can read about the rest in the on-screen documentation for the `find` command
    by issuing the `man find` command.


    ### Options

    Parameters affect the overall behavior of `find`. The most important of them are:

    *   `-maxdepth`: maximum search depth in subdirectories.

    *   `-mindepth`: minimum search depth in subdirectories.

    *   `-xdev`: Search only within the same file system.

    You can read about the rest in the on-screen documentation for the `find` command.


