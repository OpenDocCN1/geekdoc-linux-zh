    ## 序言

    那么，Linux 到底是什么？


    首先，Linux 是一个基于 UNIX 和 POSIX 代码的免费开源操作系统。简而言之，它是免费下载、免费使用的，最初是基于 Intel x86 范式的。事实上，在所有操作系统中，Linux
    的安装基数比其他系统都要大。


    这就是为什么运行 Linux 的计算机或设备运行速度非常快，有时甚至与那些惊人的超级计算机相提！这是因为 Linux 可以针对其被用到的任何类型的系统进行定制，而其他操作系统通常只能在特定类型的设备上运行良好。


    这种现象归功于所谓的“开源软件协作”，这种协作支持各种类型的库和目录。下一步是学习如何创建和编辑 shell 脚本，并创建自动化脚本，让你能够以更高效的方式使用
    Linux。


    Linux 操作系统（OS）并不是普通消费者能意识到的，它是最广泛使用的平台，并定制用于 Android 手机、智能手表、冰箱、洗衣机、视频游戏机和 DVR
    等设备（仅列举几项）。


    Linux 可用于托管网站、创建新的安全文件或电子邮件服务器、诊断你拥有的其他系统，并可能恢复崩溃的文件。它可以增强 Chromebook。甚至是 NASA、戴尔、IBM
    和惠尔-帕罗等都使用了 Linux 操作系统。


    它最初是作为各种版本 UNIX 的家族扩展开发的。它是免费的开源代码，由 Linus Torvalds 于 1991 年 10 月发布。Torvalds 是一位芬兰裔美国工程师，他认为开源是唯一的道路。幸运的是，他的想法是对的。起初，Linux
    主要用于个人计算机，但正如你所见，它的用途已经呈指数级增长，现在还运行着一些最大的超级计算机以及上述提到的设备。


    自 Linux 发布以来，其他程序员开发了自己的 Linux 版本或发行版。这些被称为发行版（distros）。这些下一代开发者能够做到这一点是因为 Linux
    的开源。这是一件好事，但正如你所看到的，拥有许多不同的版本也会带来挑战。


    ## 必要软件

    在开始编程之前，你需要一个兼容 Linux 的文本编辑器或一个集成开发环境（IDE）。如果你使用文本编辑器，还需要一个编译器，以便你的代码能够补丁到 Linux
    框架中。如果你使用集成开发环境，这通常会自动完成。市上有许多免费的开源文本编辑器和集成开发环境可用。


    作为替代方案，你可以从使用 Linux shell 开始。有些程序和命令只能通过 shell 实现，你还可以通过 shell 对自己的系统进行一些配置和自定义。你访问它的方式取决于你使用的发行版，但在许多情况下，你可以通过
    `Ctrl – Alt – T` 来访问。


    你可能还需要一个沙箱（sandbox），这是程序员工具箱中的必备工具。沙箱允许程序在限制的范围内运行。这样，如果程序出现问题（如 bug 或意外错误），只有沙箱内的资源会受到影响，计算机的其他部分将不受影响。编写代码时非常重要。


    ## 编程语言

    与 Linux 最相关的编程语言是 `C`。考虑到这一点，你可能会认为 Linux 编程必须使用 `C`。实际上任何编程语言都可以用于 Linux 编写代码，所以你精通的语言即可。例外可能是（但并非必然）特殊语言，例如
    `Solidity`，它是专门为以太坊区块链开发的。在 Linux 中完成编码需要一个编译器，来翻译该语言使其与内核兼容。


    ## 第 1 章： 什么是 Linux

    ### 早期起源

    在 1969 年，`UNIX` 操作系统（被称为 Linux 的祖先）在 AT & T 贝尔实验室创建，它具有 `C` 语言基础，并提供了许多可用于移植的语言。基于这种背景，该操作系统成为企业和学校管理员最信赖的操作系统。


    然而，由于反垄断诉讼阻止了 `UNIX` 继续用于业务，出现了一些争议，但由于其开发者和支持者认为 `UNIX` 比人们想象的更多，他们决定开发 GNU 内核。


    ### Linux 的诞生

    在其主要作者 Linus Torvalds 的帮助下，基于寻找一个所有人都能使用的真正功能操作系统的原则，他决定开发 GNU 内核。他想要一种让人们（无论是专业人士还是只是想用计算机和其他设备娱乐的人）都能真正使用的东西。随后他开始将内核创建的文件上传到
    FTP 服务器，并想将其命名为“Freax”，但当时的合作者和其他专业人士认为这不是个好主意，于是通过玩他的名字，Linux 在 1991 年诞生了！


