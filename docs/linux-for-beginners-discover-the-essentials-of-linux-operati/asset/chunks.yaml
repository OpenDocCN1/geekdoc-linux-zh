    *   A CD or DVD for 32 bit and 64 bit

    *   A network image for 32 bit and 64 bit (a so-called `Netinst-ISO`)

    *   A tiny CD for 32 bit or 64 bit


    We also have test media available. These include live images for 32 bit and 64
    bit, and allow you to try Debian before installing it on your computer. During
    the time of writing this document, version 9.5 is the current stable release of
    Debian. The setup described here is based on this release and the `amd64` architecture.
    After downloading the network image from `www.debian.org/distrib`, no further
    static images are required to be referenced in the system. Instead, it depends
    on the internet connection to retrieve the packages to be installed and keep your
    operating system up-to-date. The entire process will take you about an hour, and
    it allows you to have a lean software selection according to your specific needs.
    Software packages that you do not use will not be available on your system. They
    can be added whenever you feel the need for them. The target system of our installation
    is an XFCE-based desktop system for a single user with a web browser and a music
    player. For the web browser we use Mozilla Firefox and for the music player, `VLC`.
    Both programs are a permanent component of the Linux distribution. The environment
    we use for demonstration purposes is a virtual machine based on `VirtualBox` with
    4 GB of RAM and 15 GB of disc space.


    ## Chapter 7: exercises


    As we have already learnt above, the creation of a directory is pretty easy. In
    the same manner, removing or deleting a directory from the Linux system is also
    very simple. One thing that you have to bear in mind, however, once you remove
    or delete a directory from the Linux system, there is no way to undo that task.
    Therefore, the best thing is whenever you are running any command on Linux; the
    first thing is to be careful with what you do. If it means double checking the
    command before running it, the better. The command we are going to use to remove
    or delete a directory is `rmdir` which stands for remove directory. The things
    that you have to take note of here is that `rmdir` command supports the `-p` and
    `-v` options in the same manner as `mkdir` command. Additionally, the directory
    has to be empty before it is removed. We will learn how to get around this later.


    ```

    rmdir linux_tutorial/beginner/commands

    ```


    ```

    ls linux_tutorial/beginner

    ```


    ## How to create a blank file


    Many commands that are involved in data manipulation within a file have a superb
    feature that they will create a file automatically when we refer to it, and we
    find that it does not exist. As a matter of fact, we can manipulate this feature
    to create a blank file using the `touch` command. In other words, you type the
    command `touch` followed by the command line option and the file name.


    ```

    pwd

    ```

    ```

    /home/Gary/linux_tutorial

    ```

    ```

    ls

    ```

    ```

    beginner

    ```

    ```

    touch practice_exercise1

    ```

    ```

    ls practice_exercise1 commands

    ```


    ## Copying a file or a directory


    Let us consider the following example:


    ```bash

    user@bash: ls

    practice_exercise1 commands

    cp practice_exercise1 Exercise1

    ls

    practice_exercise1 Exercise1 commands

    ```


    An important thing that we have to note in this case is the source and the destination
    point at the paths. Some examples that we can consider here include:


    *   `cp /home/Gary/linux_tutorial/Exercise1 Exercise2`

    *   `cp Exercise2 ../../backups`

    *   `cp Exercise2 ../../backups/Exercise3`


    When you use the `cp` command, the destination of the file can represent a path
    to a file or a directory. If the destination is to a file such as `Exercise1`,
    `2` and `3`, then this will create a copy of the files in the destination file,
    but the original remains in the source file or directory. If we copy the files
    into a directory, the files will maintain the names in the destination directory.
    In the default behavior of the `cp` command, it will only copy a file. The term
    recursive in this case means that you would wish to copy the directory and all
    the contents of that very directory which could include files, directories, and
    subdirectories among others. Let us consider the following example:


    ```bash

    user@bash: ls

    Gary Practicals transfers

    user@bash: cp Practicals Practicals_beginner

    cp: omitting directory ‘Practicals.’

    user@bash: cp -r Practicals Practicals_beginner

    user@bash: ls

    Gary Practicals transfers Practicals_beginner

    ```

