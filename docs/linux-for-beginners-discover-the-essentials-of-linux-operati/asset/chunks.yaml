    ## INTRODUCTION

    So, what is Linux, actually?


    For starters, Linux is a free and open-source Operating System, based on UNIX
    and PSOIX codes. In short, it is free to download, and free to use, and was originally
    based on the paradigm of Intel x86. In fact, out of all Operating Systems, Linux
    has the largest base that has been installed, compared to the rest.


    This is why a computer or device that works on Linux works fast, and are sometimes
    even compared to those amazing supercomputers! This is because Linux gets to be
    tailored to any kind of system where it’s being used for—compared to other operating
    systems that work best on a certain kind of device alone.


    This so happens because of the so-called open source software collaboration that
    can support various kinds of libraries and directories. The next step is to learn
    more about creating and editing shell scripts and create automation scripts that
    will allow you to use Linux in a more efficient manner.


    The Linux operating system (OS) is not something your average consumer realizes
    the extent to which it is the most utilized platform and is tailored to devices
    such as Android phones, Smart watches, refrigerators, washing machines, video
    game consoles and DVRs just to name a few.


    Linux can be used to host a website, create a new and secure file or e-mail server,
    diagnose another system you own, and possibly recover crashed files. It can enhance
    Chromebooks. Even NASA, Dell, IBM, and Hewlett-Packard have tapped into the Linux
    OS.


    It was first developed as a family extension of the various iterations of UNIX.
    It is free, open-source code and released October of 1991 by Linus Torvalds. Torvalds
    is a Finnish-American Engineer who believes that open source is the only way to
    go. Thankfully he thought so. At first, Linux was primarily for personal computers
    but as you can see it has a use that has expanded exponentially and now runs some
    of the largest super computers as well as the devices just named.


    Since Linux release, other programmers have developed their own versions or distributions
    of Linux. These are also called distros. These next generation developers were
    able to do this because of the open sourcing of Linux. This is a good thing, but
    having many different versions has its challenges as you will see.


    ## Necessary Software

    Before you get started with programming, you will need either a text editor that
    is Linux-compatible or an integrated development environment. If you use a text
    editor, you will also need a compiler that will enable your code to be patched
    into the Linux framework. If you use an integrated development environment, this
    will usually be done automatically. There are plenty of text editors and integrated
    development environments that are available for free as open-source software.


    As an alternative, you can begin by using the Linux shell. There are some programs
    and commands that can only be implemented with the shell, and you can also make
    some configurations and customizations to your own system with the shell. How
    you access it may vary based on the distribution that you use, but in many cases,
    you can access it be pressing `Ctrl – Alt – T` on the keyboard.


    You will also want to have a sandbox, which is a necessary tool in any programmer’s
    arsenal. A sandbox allows a program to run using a limited amount of the computer’s
    environment. This way, if there is a problem with the program, such as a bug or
    unintended error, only the resources that are located within the sandbox will
    be affected. The rest of the computer will be unharmed. Sandboxes are very important
    when writing codes for a new program, as they enable programmers to test out new
    developments without running the risk of.


    ## Programming Language

    The programming language most commonly associated with Linux is `C`. With this
    information in mind, you would be forgiven for believing that any programming
    in Linux must be written in `C`. Virtually any programming language can be used
    to write code in Linux, so whichever language you are proficient in is what will
    be suited. The exception may (but not necessarily) be specialized languages, such
    as `Solidity`, which was developed specifically for the Ethereum blockchain. What
    is necessary to get coding done in Linux is a compiler that will translate that
    language so it is compatible with the kernel.


    ## Chapter 1. : what is Linux

    ### Early Beginnings

    Back in 1969, the `UNIX` Operating System—also known as the forefather of Linux—was
    created at the AT & T Bell Laboratories, with `C`-Programming basics, and high
    availability of languages that could be used for porting purposes. With that kind
    of background, this OS became the most relied-on operating system of business
    and school administrators.


    However, certain controversies happened when an anti-trust case prevented `UNIX`
    from continually being used for businesses, but since its developers—and its supporters—believed
    that there’s still more to `UNIX` than what people think, they decided to develop
    the GNU Kernel—and it was because of this that LIN finally came to fruition.


    ### Enter Linux

    With the help of its principal author, Linus Torvalds, and his principle of finding
    a truly functional Operating System that everyone can use, he decided to work
    on the GNU Kernel. He wanted something that people, whether they’re professionals
    or just wanting to use the computer and other devices for entertainment, could
    really use. He then began to upload files created from the Kernel to the FTP Server,
    and wanted to call it “Freax”, but his collaborators and other professionals at
    the time didn’t think it was a good idea, and so playing with his name, Linux
    was born in 1991!

