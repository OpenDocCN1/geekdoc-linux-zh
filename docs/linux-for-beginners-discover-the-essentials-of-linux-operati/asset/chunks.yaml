    the location you have selected before. When done, click the Continue button to
    define the storage media and the accompanying partitions. ![Description: 00009.jpeg](rsrcHH.jpg)Storage
    Media and PartitioningA Linux system can be distributed across a number of different
    storage media like hard disks and flash drives. Over and above, a storage media
    can be separated into multiple disk partitions. In order to do so, the setup program
    of Debian has the following methods available (see image below): Guided - use
    entire disk: follow the steps as provided and use the entire disk space for the
    Linux installation. This creates partitions with fixed sizes. Guided - use the
    entire disk and set-up LVM: follow the steps as provided and use the entire disk
    space for the Linux installation. This option makes use of Logical Volume Management
    (LVM) in order to create partitions with sizes that can be changed later on. Guided
    - use the entire disk and set-up encrypted LVM: follow the steps as provided and
    use the entire disk space for the Linux installation. This option makes use of
    Logical Volume Management (LVM) in order to create encrypted partitions with sizes
    that can be changed later on. Manual: create partitions individually. This is
    the expert mode and requires more profound knowledge about partitions and file
    system parameters. From the list choose the entry Guided-use the entire disk.
    The values for partition sizes are chosen according to experience, implemented
    as an algorithm. A manual calculation is not required. Click the Continue button
    on the lower-right corner to proceed with the installation. Next, select the disk
    to partition. As for our case, we have only one disk available (see image below).
    Later on in this guide, the disk will be referred to as /dev/sda for the 1st SCSI
    disk. A disk partition refers to a piece of the storage media that is organized
    separately and is intended to contain a branch of the Linux file system tree.
    There is no universal way to do this separation correctly. This guide shows a
    simple but safe solution that works for a basic system. The menu in the dialog
    box offers the following options: All files in one partition: use just a single
    partition to keep programs and user data Separate /home partition: store programs
    and user data in separate partitions Separate /home, /var, and /tmp partitions:
    keep user data, variable data and temporary data in separate partitions Click
    the Continue button on the lower-right corner to proceed with the installation. The
    next step is to confirm the partition scheme. This is calculated automatically
    based on experience and contains these partitions: sda1: the first partition of
    the first SCSI disk is a primary partition with a size of 3 GB, formatted with
    the ext4 file system, and referred to as the root part of the file system tree
    (indicated with /) sda5: the fifth partition of the first SCSI disk is a logical
    partition with a size of 1.3 GB, formatted with the ext4 file system, and reserved
    to store variable data of the file system tree (indicated with /var) sda6: the
    sixth partition of the first SCSI disk is a logical partition with a size of 3.3
    GB, formatted as a swap file system sda7: the seventh partition of the first SCSI
    disk is a logical partition with a size of 311 MB, formatted with the ext4 file
    system, and reserved to store temporary data of the file system tree (indicated
    with /tmp) sda8: the eighth partition of the first SCSI disk is a logical partition
    with a size of 8.8 GB, formatted with the ext4 file system, and reserved to store
    the user data of the file system tree aka home directories (indicated with /home) Due
    to historical reasons, a hard disk can contain four primary partitions only. The
    fourth one is called an Extended Partition if divided into so-called logical partitions
    or logical drives. In our case the logical partitions /dev/sda5, /dev/sda6, /dev/sda7
    and /dev/sda8 are stored on the primary partition /dev/sda4\. The partitions /dev/sda2
    and /dev/sda3 are not in use. From the above list, choose the entry Finish partitioning
    and write changes to disk. Click the Continue button on the lower-right corner
    to proceed and to confirm the partition scheme (see below image). Choose yes from
    the list and click the Continue button to partition the disk. Note that all the
    data on the selected storage device will be lost and the disk will be empty. Having
    divided the storage media into single partitions, the partitions will be formatted
    with the file system as defined before. In our case the partitions /dev/sda1,
    /dev/sda5, /dev/sda7 and /dev/sda8 will get an ext4 file system, and the partition
    /dev/sda6 will get a swap filesystem. As soon as this step is completed, the base
    system of Debian will be installed next. Package Management![Description: 00010.jpeg](rsrcJC.jpg)The
    ISO image contains the installer and a number of packages to set up the Linux
    base system. For example, this includes the Linux kernel being installed below. The
    next step is that you have to decide whether to use additional installation media
    or not. In our case, we have just a single installation disk and can consequentially
    select No from the menu (see image below). Then click the Continue button to proceed.
    As pointed out earlier, the software for Debian is organized in packages. These
    packages are provided in multiple software repositories. The repositories are
    made available via package mirrors that are maintained by universities, private
    persons, companies and other organizations. These mirrors are located in different
    countries. In the next step, you will have to decide from which country you would
    like to retrieve your Debian packages. It is recommended to choose a mirror that
    is geographically located near you to minimize the time that is needed to transport
    the data from the mirror to your computer via a network. As an initial step, choose
    your desired country. As a second step choose a preferred mirror from the list
    (see image below). The list contains universities, internet providers, government
    services and other organizations. In case your computer network includes a proxy
    server to communicate with the outside world, enter the according to information
    here. In such an instance, we do not have that and leave the entry field empty.
    Click the Confirm button to proceed. As soon as the single parameters are set,
    the Debian installer connects to the previously selected package mirror and retrieves
    the package lists from there. A package list contains the packages that are available,
    including the name, size, and description. Depending on the quality and bandwidth
    of your network connection this step can take a while. Next, you are asked to
    take part in Popcon, the Debian package popularity contest (see image below).
    This information is optional and is used only by the team of developers that is
    responsible for the Debian packages. Based on Popcon, they figure out which Debian
    packages are the ones that are installed most often. The information has a direct
    influence on the preparation of installation images and which packages to keep
    or to dismiss for the different architectures. In our case, we do not participate
    in Popcon, and leave the selection to No. Click the Confirm button to proceed
    with the selection of software tasks (tasksel). Software SelectionDebian offers
    carefully arranged selections of packages, so-called tasks. The idea behind them
    is to group packages for specific uses in order to simplify the installation.
    From the list in the dialog window (see image below) you can choose between different
    desktop environments, as well as a web server, a print server, an SSH server and
    the standard system utilities. To have a minimal installation just enable the
    last two entries from the list. We will install the XFCE desktop environment later. Having
    confirmed the software selection, the Debian installer retrieves the needed packages
    from the package mirror, unpacks and then installs them. The bar below shows the
    progress. In this case, 140 packages have to be downloaded. Setting up GRUBIn
    order to start our newly installed Debian system, we have to set this information
    too. This process is called booting the system. The software component that handles
    this step is named Grand Unified Boot Loader (GRUB or GNU GRUB to be precise).
    The entry Yes is already pre-selected, and so we can click Continue to proceed.
    The Debian installer needs to know where to install GRUB. The menu in the image
    below lists the storage media to be considered. In our case, we choose the second
    entry from the list (/dev/sda). Then, click Continue to proceed. Now that we are
    nearly finished with the basic installation, the only thing left to do is just
    a single dialog box to read. Finishing the InstallationThe following dialog box
    informs you that the installation is complete. Then click Continue to reboot the
    newly installed system. After a few seconds, the text-based GRUB boot menu will
    appear on the screen. The boot menu includes two options: Debian GNU/Linux and
    Advanced options for Debian GNU/Linux. The first menu item is highlighted and
    pre-selected. The second menu entry allows you to set specific boot options. For
    a comprehensive list of these options have a look at the GNU GRUB manual at www.gnu.org/software/grub/manual/grub Keep
    the first menu item selected and press Enter to proceed and boot the new system.
    Your Debian system will start and initialize the necessary system services. This
    step will take a few seconds to be completed. Finally, a black-and-white screen
    will be visible on the first text terminal named tty1 (see image below) and ask
    you to log into the system. The login prompt consists of two components: the hostname
    of your Linux system (debian95) followed by space and the word login. Debian GNU/Linux
    9 debian95 tty1 debian95 login: _Having logged into the system, you will add further
    software to be able to use a graphical user interface, based on the XFCE desktop.
    At this step of the installation process, adding further software can only be
    done by logging in as the administrative root user. In order to do so, type in
    root at the login prompt, press Enter, wait for the text Password: to appear and
    type in the password set for the root user you defined before. The Linux system
    will welcome you (see image below) with a login message. The first line of the
    login message will give you a display on the time of your last login followed
    by the version of the Linux kernel that is currently running (line two) and the
    usage advice (lines five to eight). After the welcome message Debian opens a command-line
    prompt: root@debian95 ~#This command-line prompt consists of four components: root:
    the name of the user who logged in debian95: the hostname of the Linux system ~:
    the current directory. In this case, it is the home directory of the user currently
    logged in. If not otherwise set, this is defined as /home/username for regular
    users and /root for the administrative user. ~ is just an abbreviation of it. #:
    the login symbol. The # symbol represents the user root whereas $ is used by regular
    users without administrative rights Important: You are now logged in as the administrative
    root user. Take care which commands you type in, and check twice if in doubt.
    Any mistakes can lead to the necessity to install or repair your Linux system. Adding
    a Graphical User Interface![Description: 00011.jpeg](rsrcK8.jpg)At its current
    stage, the Debian system is fully active and can be used in production. For a
    desktop system suitable for a regular user, it still lacks an excellent and easy-to-use
    graphical user interface. In this step, we will change that and install the XFCE
    desktop manager. In order to do so, we will install the following packages: The
    aptitude package manager The xdm display manager The xfce4 desktop environment Debian
    uses the package manager apt to handle the installation, the update and the removal
    of software packages and the related package lists. Also, apt resolve all the
    package dependencies and ensures that the relevant software is available on the
    system. In our case, a total of roughly 450 MB of data/software have to be retrieved
    from the package mirror and installed. As pointed out earlier, this requires a
    working internet connection to download the needed software packages. In order
    to install the three packages, type in the following commands at the command-line
    prompt. Just type the command after the # symbol: root@debian95 ~# apt-get install
    aptitude xdm xfce4 apt will display further information regarding the packages
    to be installed. This includes the list of depending packages and recommended
    packages. In the end, you will see a command-line prompt. Type Y or press Enter
    to install aptitude, xdm and xfce4 as well as the depending packages. For the
    xdm display manager, two dialog boxes have to be confirmed (see images below).
    Press Enter two times to confirm the use of xdm. The retrieval of the software
    packages to be installed takes a while. When finished, the command-line prompt
    will appear again. In order to activate the changes regarding the graphical desktop
    environment, restart the system. Type the command reboot at the command-line prompt
    as follows: root@debian95 ~# rebootHaving restarted the Linux system, Debian welcomes
    us with a graphical boot screen (see image below). Press Enter to start the Linux
    system with the default settings. A few seconds later a graphical login screen
    will be visible (see image below). Log in to the system with the regular user
    named user as created earlier. Type in user, press Enter and type in the password
    for the user. Then, press Enter again to confirm and log in. Next, the XFCE desktop
    will be visible (see image below). The desktop comes with a number of default
    elements: an upper navigation bar, a lower navigation bar and desktop icons. All
    the mentioned elements are explained in more detail below. Upper navigation bar:
    this shows buttons to access the different applications, the four virtual desktop
    screens, the clock and a button for various user actions such as to lock the screen,
    change the user, change to standby mode and exit the current session Lower navigation
    bar: this bar contains several buttons to hide all the opened windows and show
    the empty desktop, to open a terminal, the file manager, a web browser, to find
    an application and to open the file manager directly with your home directory. Desktop
    icons: from top to bottom there is a trash bin, file manager icons that link to
    the computer, and the home directory A right-click on the desktop opens a context
    menu that allows you to access the various applicationsAdding Additional SoftwareUp
    until now the software available to be used on your Linux system has been somewhat
    limited. After all that, the next thing to do is to add the following four Debian
    packages to make your life a bit easier: firefox-esr: the web browser Mozilla
    Firefox (Extended Support Release) gnome-terminal: a terminal emulation maintained
    by the GNOME project xscreensaver: a basic screensaver for the X11 system vlc:
    the video player Video Lan Client (VLC) The installation of the three packages
    will be done using the command-line in a terminal emulator (we will look at terminals
    in detail later in the guide). Currently, on your system, the X11 terminal emulator
    xterm is installed. In order to open xterm, click on the terminal button in the
    lower navigation bar or select the entry Application > System > Xterm from the
    context menu. As step one, open xterm. Next, type in the command su next to the
    command-line prompt as follows and press Enter: user@debian95: ~$ suPassword:   You
    may remember from the previous steps that only an administrative user can install,
    update or remove software on a Debian system. The su command abbreviates switch
    user and changes your current role. Used without an additional name, the role
    changes to the administrative root user. At the password prompt type in the password
    for the administrative user and press Enter. As an administrative user, install
    the packages: firefox-esr, gnome-terminal, xscreenserver and vlc as follows: root@debian95:
    ~# apt-get install firefox-esr gnome-terminal xscreensaver vlc   The output is
    seen below: After the installation of the four packages, you can switch back to
    your role as a regular user. Press Ctrl+D to quit the admin part, and press Ctrl+D
    again to close xterm. The installation of Firefox has the following effects:The
    new software Firefox is available from the application menu The new command Firefox
    is available from the command-line The earth icon from the lower navigation bar
    links to the Firefox web browser The installation of the GNOME terminal package
    has the following effects: The new software gnome-terminal is available from both
    the command-line and the application menu The terminal icon from the lower navigation
    bar links to the GNOME terminal The entry Open Terminal Here from the context
    menu refers to the GNOME terminal In order to see the changes, select the entry
    Open Terminal Here from the context menu. The image below shows the terminal window.
    It comes with a white background and a bigger font that is easier to read. ![Description:
    00012.jpeg](rsrcMN.jpg)Exiting LinuxIn order to use Linux properly, you also have
    to learn how to exit Linux and to reboot the system. Below you will learn how
    to quit the XFCE desktop environment, to shut down the Linux system and to reboot
    the system. We will look at two methods; the first is based on the graphical interface
    and the second can also be used on non-graphical systems like servers and wireless
    routers. Quitting the XFCE Desktop EnvironmentThe easiest way to quit the XFCE
    desktop and to log out from your current session is to click on the button in
    the right corner of the upper navigation bar. The button is labeled with your
    username, which in our case is Debian User. From the small menu select the last
    item labeled Log Out (see image below). Alternatively, you can choose either the
    item labeled Log Out from the Application button in upper-left corner or from
    the context menu. A second window opens that contains the five buttons labeled
    Log Out, Restart, Shutdown, Suspend and Hibernate (see image below). Click on
    Log Out to quit your session. Subsequently, you will return to the login screen. Shutting
    Down the Linux SystemThe way to shut down the entire Linux system is similar to
    exiting XFCE. Click on the button in the right corner of the upper navigation
    bar. The button is labeled with your username which in our case is Debian User.
    From the small menu (see image above) select the item labeled Shut Down. From
    the next dialog window click on the button labeled with Shut Down to stop the
    Linux system. From a terminal session you can run the commands halt or shutdown
    -h now as an administrative user. A regular user is not allowed to issue these
    commands. # haltRebooting the Linux SystemIn order to restart the Linux system,
    click on the button in the right corner of the upper navigation bar. The button
    is labeled with your username, which in our case is Debian User. From the small
    menu select the item labeled Restart (see image above). From the next dialog window
    click on the button labeled Restart to reboot the Linux system. From a terminal
    session, you can run the command reboot or shutdown -r now as an administrative
    user. A regular user is not allowed to issue these commands. # rebootSubsequently,
    the system will reboot and you will return to the boot screen.Chapter 9 : navigating
    LinuxNow we need to talk about basic folder navigation in the Linux operating
    system. This is slightly different from Microsoft Windows. However, the funny
    thing is it looks close enough to Windows that when things do not work right,
    people have the urge to want to pick up their computer and throw it out the window.![Description:
    00053.jpeg](rsrcND.jpg)Take the above diagram for example. In Linux, you also
    have the cd command. Just like in Windows, the cd command stands for change directory.
    If you want to go to a different directory or folder, you type in cd. If you are
    in a folder, let us say you are in the var folder in our illustration, and you
    want to go to a folder within the var folder, which in this case is the abc folder,
    all you need to do is type in the command below:$ cd abcSo, that is cd, a space,
    and then the name of the folder that you want to go to. That will drop you in
    the folder that you are trying to go into. Now, the problem is, people in the
    Windows world are used to following the cd command with a forward slash symbol.
    If we were to apply this in our previous command, it will look like the one below:$
    cd /abcWhat Linux does in this case is it interprets the forward slash symbol
    as the root folder. Linux will think that you want to change to the root folder,
    and then look for the abc folder within the root folder. Of course, once Linux
    executes this command, it will not be able to find an existing abc folder since
    in actuality, the abc folder is located in the var folder. That is where you have
    to be extremely careful.This is one reason why a lot of Linux administrators always
    type in the full path to wherever they are trying to go, no matter where they
    are at. If a Linux administrator is trying to go in and change something in the
    abc folder, they will just type in the command below:$ cd /etc/var/abcLinux is
    finicky about this whole change directory syntax. As we have mentioned before
    as well, capitalization matters in Linux. If you are trying to reach a folder
    whose name is written in all lowercase, and you type the folder in all capital
    letters, Linux will not be able to find it; it will say that the directory cannot
    be found.All of this is important for you to understand. It can be extremely frustrating
    if you do not grasp it.![Description: 00054.jpeg](rsrcNU.jpg)So, the first thing
    you want to do when navigating files and folders in Linux is make sure that you
    are in the root directory. To do this, you must type the command below:$ cd /That
    is cd, a space, and then a forward slash. This is automatically bring you to do
    the root directory if you are not already there. Now the next logical thing to
    do would be to see what folders are within the root folder itself. To do this,
    you must type the command below:$ lsThe ls, or list command will list all the
    files and folders within a particular directory--root, in this case.![Description:
    00055.jpeg](rsrcP2.jpg)As you can see after typing in the ls command, Linux will
    now show you all the folders that are within in the root directory. You can see
    lots of folders here like the bin, dev, opt, sbin, sys, var, boot, etc lib, and
    so forth.Now, let’s say we want to go to inside the etc folder. All you need to
    do is type in the command below:$ cd etcThe command above will automatically drop
    you inside the etc folder. If you look beside the blinking cursor of the command
    prompt, it will say /etc$. That is the main indication that you are indeed inside
    the actual folder that you want to go into. If you do the ls command again, it
    will show you all the files within the etc folder.![Description: 00056.jpeg](rsrcP9.jpg)In
    order to go back to the root folder, all you need to do is type:$ cd /This will
    automatically return you to the root directory no matter how deep you are within
    the folders.Now let’s say you want to go back to the etc folder. But this time,
    instead of typing etc in all lowercase, you typed it in all uppercase.![Description:
    00057.jpeg](rsrcPH.jpg)As you can see, Linux will not be able to find the directory
    with an uppercase ETC. Why? Because Linux cares about capitalization. Uppercase
    letters are different from lower case letters in the Linux world. Basically, that
    is all there is to it in Linux basic navigation.Chapter 10 : essential Linux commandsIn
    this section, we will explore the basic Linux commands that are necessary to get
    started. You can now open the terminal. Right click on the Desktop and choose
    ‘Open Terminal’.If you don’t see this option, look for ‘Applications’ at the top
    of the window. Click on ‘Applications’ and go to ‘Accessories’. Choose ‘Open terminal’
    and open the text editor, that is, ‘Gedit’. Just click on the search and type
    “text editor”. Add some text of your choice to the file and save it, maybe on
    the desktop.Changing DirectoriesYou might also want to navigate or change directories
    via the terminal. To achieve this, use the command ‘cd’ which stands for “change
    directory”.Example:cd /homeThe above command will change the working directory
    to the ‘/home’ directory. The use of forward slash (/) is to mean relative to
    the root, meaning that this command will be executed regardless of the directory
    that you are currently in. Now type the following command:cd httpdThe directory
    will be changed to ‘httpd’ but relative the ‘/home’ directory. The full working
    directory will be ‘/home/httpd’. Now type the following command:cd ..This command
    will change the working directory to the parent directory of the current directory.
    In our case, we will move from ‘/home/httpd’ to the ‘/home’ directory. Type the
    following command:cd ~This command changes the directory to the user’s home directory
    ‘/home/(username)’. The “username” will be the name you have used on the computer.
    The symbol “~” is called the tilde and it is used in Linux to represent the user’s
    home directory.Copying FilesThe command ‘cp,’ which stands for “copy files” is
    used for copying files. Note that the file is not deleted from its initial location
    and a duplicate of the same is made at the specified location. Type the following
    command:cp first meThe command above will make a duplicate of the file first at
    the same directory but with a new name, that is ‘me’. If the file ‘me’ exists
    in the directory, it will be overwritten and you will not be warned before this
    command is executed. Consider the command below:cp –i first meNotice that in the
    above command we have added the ‘–i'' option. If the file ‘me’ exists in the directory,
    you will be notified before it is overwritten. Next, try the following command:cp
    –i /d/fileWith the above command, the file ‘/d/file’ will be copied into the same
    current directory and then named ‘file’. Note that we have used the ‘–i'' option
    so if it already exists we will be notified before it is overwritten.You might
    also need to copy all the files contained in a particular directory to another
    directory. This can be achieved as follows:cp -dpr sourcedirectory destinationdirectoryAll
    the files in the directory ‘sourcedirectory’ will be copied to the directory ‘destinationdirectory’.
    Notice that we have used the option ‘–dpr’. This means the following:-d – means
    that links will be preserved-p – file attributes will be preserved-r – copying
    will be done recursivelyIt is good to specify those options if needed while copying
    all the files from a directory, otherwise, the default settings will be applied
    which might produce an unwanted result.To show the amount of space on a disk used
    on each of the mounted file systems, use the command ‘df’.‘Less’ CommandThe less
    command is the same as the more command. The difference comes in that with this
    command the user can page up or down through the file. Consider the example below:less
    firstThe above command will display the contents of the file ‘first’.‘Ln’ CommandThis
    command creates a symbolic link to a certain file. Write and run the following
    command:ln –s first slinkThe command above will create a symbolic link named ‘slink’
    which will link to the file ‘first’. The command ls ‘–i first slink’ will show
    that the two files are different and have different “inodes”.‘Locate’ CommandThis
    is used for searching in the database. Run the following command:slocate –uA database
    named ‘slocate’ will be created. This will take some time to complete, so be patient.
    Before you will be able to search for a file, this command must be run first.
    However, on most systems, ‘cron’ will run this command on periodical basis. Again,
    run the following command:locate whoisThis command will look for files in your
    system whose name contains the string “whois”.‘Logout’ CommandThe command is used
    to logout the user who is currently logged into the system. Just go to the terminal
    and type this command:logoutYou will then be logged out and returned to the login
    screen.‘Ls’ Command‘Ls’ stands for list. It is used for listing files in a directory.
    However, it comes with many options which needs to be known as well, otherwise
    you will become confused. If you need to list all the files in the current directory
    with the exception of those starting with “.” then just type in the command:ls![Description:
    00002.jpeg](rsrcSJ.jpg)The figure above is the Desktop directory and it contains
    the files shown. Note that only the file names will be listed.  You might need
    to show more details about the files in the directory such as the ownership permissions,
    their size, time and date stamp, etc. This can be achieved with the following
    command:ls –al                            ![Description: 00003.jpeg](rsrcST.jpg)As
    shown above, the command ‘ls-al’ is more extensive compared to the previous command.
    You can use it if you want more details about the file.‘More’ CommandSend contents
    of a file one page at a time to the screen. It can also work on piped output.
    Let us list the contents of the file ‘/etc/profile’ to the screen. This is an
    in-built file, meaning that it comes with the operating system and it contains
    the profiles for the users of the system:more /etc/profile![Description: 00004.jpeg](rsrcT1.jpg)Note
    that the contents of the file will be displayed one page at a time. This is because
    the content is too big to be displayed on a single page. Consider the command
    below:ls –al              | moreThe command will list all files in the directory
    and output will be piped through ‘more’. If the output from the directory can’t
    fit in one page, it will be listed on an additional page.‘Mv’ CommandThis command
    stands for “move” and is used for renaming or moving files. Consider the command
    below:mv –i first first2The file will be moved from ‘first’ to ‘first2’, meaning
    it will be renamed to ‘firts2’ rather than ‘first’.mv /d/firstThe above command
    will move the file ‘first’ from the directory ‘/d’ to the current working directory.
    Now you have seen how the ‘mv’ command is a powerful tool.Now that we have been
    talking of working directories, what are they exactly? And how can we know in
    which directory they currently are? Just type the command:pwdAfter pressing the
    enter key, you notice that the output is a directory. This shows the directory
    which you are currently in. The abbreviation ‘pwd’ stands for “print working directory”
    and is used for the purpose of showing the current working directory.‘Shutdown’
    CommandThis command is used for shutting down the system. The purpose of this
    command is to halt the current process and shut down the system immediately. To
    do this use the following code:shut down –h now –.The next command is used to
    reboot the system, meaning that it will immediately shut down and the restart
    the system. To do this use the command below:shut down –r now-‘Whereis’ CommandThis
    command is used for showing the manual, source, and binary files for a command.
    Consider the command below:whereis lsThis command will show the manual and binary
    files for the command ‘ls’. To see the list of commands which have been on your
    system previously, use the command ‘history’:              ![Description: 00005.jpeg](rsrcTV.jpg)Above
    is the list of commands which have been run on my system. You can try on your
    system and observe the output.‘Sudo’ CommandThis stands for “super user do”. It
    has the purpose of allowing a permitted user to execute commands as a “super user”.
    This is usually defined in the ‘sudo’-er’s list. It has the importance of ensuring
    security by making sure that sensitive commands are only executed by the correct
    people. Another command, the ‘su’ command enables you to log in to the system
    as a super user. The purpose of ‘sudo’ is to borrow privileges from the super
    user. This explains the difference between these two commands, the ‘su’ and the
    ‘sudo’ commands. The ‘sudo’ command is normally used in commands which will change
    the system files, such as when updating or upgrading the OS. This shows how secure
    the command is compared to the ‘su’ command.‘Mkdir’ CommandThis command stands
    for “make directory”. It creates a new directory and names its path. If this path
    is already in existence, an error saying that the folder cannot be created will
    be outputted. Consider the figure shown below:              ![Description: 00006.jpeg](rsrcU5.jpg)I
    have made a directory named “m”. Once I list the available directories after creating
    the directory, I find that it has been created. Notice that I have run the command
    as ‘sudo’. Without this, the command won’t run. This is for security purposes.
    Once you use the ‘sudo’ command for the first time, you will be prompted to provide
    the password for the super user to do so. It is good to note that you can only
    create a directory inside a folder and you must have a “write permission” on that
    folder. Otherwise, you will be unable to do so.‘Uname’ CommandIt stands for “Unix
    name”. With this command, you can get detailed information about the operating
    system, kernel and the machine. Consider the figure below:              ![Description:
    00007.jpeg](rsrcUD.jpg)Information about the OS, the kernel, and the machine have
    been shown.Ubuntu- the name of the kernel of the machineSMP- the machine’s node
    nameI686- processor configurationGNU/Linux- the name of the operating system.You
    can see how the command gives detailed information.‘Touch’ CommandThis command
    is used to create a file if and only if it does not exist. It stands for Update
    the access and modification times of each file to the current time. In case the
    file already exists, its timestamp will be changed but its contents will remain
    the same. It is possible to use the command to create a file in which you have
    a “write permission” if the file does not exist. To create a file named ‘touchfile’:touch
    touchfileIf the file does not exist in the directory, it will then be created.‘Cal’
    CommandIt can be used to display the month of the current date or the month of
    a past or advancing year.              ![Description: 00008.jpeg](rsrcUZ.jpg)Let
    us show the month February for the year 1900:![Description: 00009.jpeg](rsrcV4.jpg)You
    can also show the month of an advancing year as shown below:![Description: 00010.jpeg](rsrcV9.jpg)We
    have shown the month February of the year 2100\. This command is very good when
    it comes to determining the dates of future or previous events.‘Date’ CommandUsed
    for displaying both the current date and time on the terminal as shown below:![Description:
    00011.jpeg](rsrcVG.jpg)If the current date of your system is wrong, you can set
    it to the correct date and time as follows:Date –set=’21  march 2015 18:50’In
    the above command, we have set both the date and the time. Chapter 11 : instruction
    to linux terminalsIf you change directory to /etc and then type “l”, you would
    see the contents of the /etc di­rectory. Let’s say you want to edit this newly
    created file. You will use nano to edit this file. We will go into nano more later.
    Nano is a Terminal application for text editing.Open the file: nano ./fileThat’s
    great. You can open it. But what happens when you try to write to it?If you use
    CTRL O on your keyboard, which is the command to save this file, and hit Enter,
    Terminal will return an error, warning that you don’t have permission to write
    to this file. If you use CTRL X on your keyboard, it will ask you if you want
    to save changes, and you can say no, because you can’t. Well then, how do you
    edit that file?You need to use administrator privileges in order to be able to
    edit a file for which you don’t have permissions. There’re two ways to do this.
    The first one is to type “sudo” before the command, which is an abbreviation for
    “super user do”. It is a term in Linux that identifies your privilege level. So,
    sudo allows you to make changes to files and performs adminis­trative tasks for
    this one command.Try it: sudo nano ./fileNow you can edit the file. Try to write
    a line to the file: test343Use CTRL O and hit Enter. Success. You will see a message
    that says you wrote 1 line. Now you can exit and your changes will be saved.What
    if you don’t want to retype the entire command?Try it: nano ./fileIf you try to
    write to the file, it will fail because permission is denied. You haven’t run
    the specific command at sudo. You need to type “sudo !!”. The two exclamation
    marks mean run the previous command.Try it: sudo !!Write to the file: test 343Success!What
    if you have a lot of things to do, and you don’t want to write sudo before every
    single command? You could do this using the “su” command, which means switch user.
    Gener­ally, you type switch user, or “su”, followed by the name of the user account
    that you want to switch use.You can type “sudo su” and this will move you to the
    root account. The root user has 100% control of everything.Try it: sudo suAnd
    now that you are in the root, cerate a file: nano fileWrite to the file: This
    is a new lineSave and close the file.When you want to switch back to your user
    account, type “su username”, using your user name.If you get a permission error
    when running a command, you may need to run that com­mand as sudo. For instance,
    if you’re editing files in a directory other than your home di­rectory, you won’t
    have permission to edit those files. Later we will look at how to get permission
    to edit those files, but for right now, this is when you would run your command
    pre-pended by sudo.If you have a lot of these commands to run, and you don’t want
    to type sudo before every command, just type “sudo su”.Chapter 12 : becoming a
    Linux power userLinux is basically divided into three main components: the kernel,
    the environment, and file structure. The kernel is the main program, controlling
    and managing the hardware devices like the printer. The environment gives the
    user with the interface. Commands are received by the environment and transmitted
    as instructions to the kernel for execution. The way files are stored on the storage
    system is organized by the file structure. Files are saved and organized in the
    form of directories. A directory may hold subdirectories, each containing many
    files. The basic structure of Linux operating system is formed by these three
    constituents. You can operate the system by interacting and managing files. We
    will have a look at them separately to form an understanding of how they work.The
    operating system has many parts that make it function successfully, and the list
    of important ones is mentioned below:             The KernelIt is known to be
    one of the most important parts of the operating system. No operating system can
    function properly without this piece. It is the core of the operating system and
    controls the entire Central Processing Unit. This part has control over the processes
    occurring in the OS. It is known to be the first element that the system is loaded
    with, without this, you cannot move forward to the next step. Microkernels were
    initially used, and they encompassed only the CPU, memory, and IPC. Linux, on
    the other hand, is a monolithic kernel. It also encompasses the device drivers,
    file system management, and server system calls. Monolithic kernels are more accessible
    to hardware and good at multitasking because it can directly access information
    from the memory or other processes and doesn''t have to wait. The Kernel manages
    the remainder of the system. This part is also responsible for running memory
    as well as communicating with peripherals such as speakers and others.The BootloaderAs
    the name indicates, it is the software that controls the boot procedures of the
    laptop or computer. Many users would have noticed this as a splash screen popping
    up and then going away to the boot in an operating system.With Linux, you get
    the ability to shift between different versions of Linux kernel or other operating
    systems you might have installed on your system. A boot management utility, the
    Grand Unified Bootloader (GRUB) is responsible for selecting and starting a particular
    operating system or kernel. It is a versatile management tool which not only lets
    you load different operating systems but also gives you the choice to choose from
    different kernels installed, and all of this on a single Linux system.The EnvironmentThe
    kernel and user interact through an interface provided by an environment. This
    interface acts as an interpreter. Commands which are entered by the users are
    interpreted by the interface and sent to the kernel. There are different kinds
    of environments, namely, desktop, window managers, and command line shells. A
    user can set his or her user interface. The environments can be altered by the
    users according to their special needs, regardless of the kind of environment
    they opt. The operating system works as an operating environment for the user,
    in this respect which can be controlled by the user. It is known to be among one
    of the most creative and interesting programs. It is a puzzle that the users interact
    with. This program is also one of the most interactive pieces of the operating
    system. The system has a number of desktop environments to select from according
    to their preferences, such as Cinnamon, KDE, Enlightenment, XFCE, Unity, etc.
    Every desktop environment has a number of built-in applications like web browsers,
    games, tools, configurations and more.The environment plays a vital part in the
    working of Linux. We will have a look at two most popular environments in order
    to understand what they entail.Chapter 13 : using the shellEffective Linux professional
    is unthinkable without using the command line.The command line is a shell prompt
    that indicates the system is ready to accept a user command. This can be called
    a user dialogue with the system. For each command entered, the user receives a
    response from the system:1\. another invitation, indicating that the command is
    executed and you can enter the next.2\. error message, which is a statement of
    the system about events in it, addressed to the user.Users who are accustomed
    to working in systems with a graphical interface, working with the command line
    may seem inconvenient. However, in Linux, this type of interface has always been
    basic, and therefore well developed. In the command shells used in Linux, there
    are plenty of ways to save effort, that is, keystrokes when performing the most
    common actions:'
