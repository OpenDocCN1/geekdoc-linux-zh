    请记住，`Practicals` 目录下的任何文件或目录将被复制到 `Practicals_beginner` 目录中。


    # 第 8 章：设置 Linux


    如前所述，我们将使用 `Debian` 进行演示。回顾一下，`Debian` 是一个提供极佳稳定性的发行版，一旦你的技能和知识超过初级阶段，它的扩展性将非常出色。在本节中，我们将重点介绍安装和配置
    `Debian` 的过程，向你展示沿中的每一个步骤。


    ## 逐步安装 Linux


    ### 启动菜单

    为了开始安装 `Debian`，首先，从你下载的 ISO 镜像启动计算机（在我们的案例中，是 VirtualBox 镜像）。如果你也使用虚拟机，请查看你的虚拟机供应商网站以获取有关如何启用
    ISO 镜像的帮助。接下来，等待启动菜单在屏幕上出现。下图显示了提供的不同选项。使用光标键可以在启动菜单中导航，按 `Enter` 键选择项目。


    不同的选项有：

    - `Graphical install`：使用图形化安装程序开始安装过程

    - `Install`：使用文本安装程序开始安装过程

    - `Advanced options`：选择更多选项，如 `Expert mode`、`Automated install` 或 `Rescue mode`（见下图）

    - `Help`：获取进一步帮助

    - `Install with speech`：带有语音支持的安装


    从主启动菜单选择 `Graphical` 安装，并按 `Enter` 键继续。


    ### 语言选择

    接下来，选择你在整个安装过程中偏好的语言。对话框将相应翻译。此选择不会决定你的 Linux 系统；你以后可以选择不同的语言。


    下图显示了对话框。`English` 已预选，你只需点击对话框右下角的 `Continue` 按钮。


    ![Description: 0008.jpeg](img/rsrcH.jpg)


    ### 位置选择

    第三，对你的位置进行选择（根据之前的语言设置，列出了国家）。这也会影响你计算机的时区设置。为了进行不同的设置，从列表末尾选择 `other` 并继续。


    ![Description: 0009.jpeg](img/rsrcHH.jpg)


    ### 键盘选择

    第四，从列表中选择你的键盘布局（见下图）。对于美国，预选是 `American`。如果你使用不同的键盘布局，从列表中选择正确的。完成后，点击 `Continue`
    按钮继续第五步。


    ### 网络设置

    第五步包括加载 ISO 镜像安装程序组件并检测网络。然后，安装程序尝试通过 `DHCP` 获取 IP 地址。完成后，你可以设置计算机的主机名（见下图）。通常使用主机名作为主机名。在这种情况下，我们选择名称
    `debian`，这代表了 Linux 发行版及其版本。完成后，按 `Continue` 键继续进行第六步。


    ### 用户与角色

    我们的 Linux 系统运行至少需要两个用户。一个是名为 `root` 的管理用户，另一个是普通用户 `User`。


    接下来的两个步骤中，为用户 `root` 设置密码。为了简单起见，我们使用 `Debian` 作为全名，`User` 作为用户名。对于两个用户，选择一个你记得的密码。你以后将需要这些密码登录计算机。


    ### 时区

    设置正确的时区对于与网络服务的通信非常重要。从列表中选择一个值。列表中的项目基于你之前选择的位置。完成后，点击 `Continue` 按钮定义存储媒体和相应的分区。


    ### 存储媒体与分区

    Linux 系统可以分布在多个不同的存储媒体（如硬盘和闪存器）上。此外，存储媒体可以被分成多个分区。为了实现这一点，Debian 提供了以下方法（见下图）：

    - `Guided - use entire disk`：按照提供的步骤操作并使用整个磁盘进行 Linux 安装。这将创建固定大小的分区。

    - `Guided - use entire disk and set-up LVM`：按照提供的步骤操作并使用整个磁盘进行 Linux 安装。此选项使用逻辑卷管理
    (`LVM`) 创建可以更改大小的分区。

    - `Guided - use entire disk and set-up encrypted LVM`：按照提供的步骤操作并使用整个磁盘进行 Linux
    安装。此选项使用逻辑卷管理 (`LVM`) 创建可以更改大小的加密分区。

    - `Manual: create partitions individually`：这是专家模式，需要关于分区和文件系统的深入知识。从列表中选择 `Guided-use
    the entire disk`。分区值根据算法选择，不需要手动计算。


    点击对话框右下角的 `Continue` 按钮继续。接下来，选择要分区的磁盘。在我们的案例中，只有一个可用磁盘（见下图）。在本文后续部分，第 1 个 SCSI
    磁盘被称为 `/dev/sda`。


    磁盘分区是指存储媒体上被单独组织的部分，旨在包含 Linux 系统树的一个分支。没有正确此事的通用方法。本指南显示了一个适用于基础系统的简单但安全的解决方案。对话框中的菜单提供以下选项：

    - `All files in one partition`：使用单个分区保留程序和用户数据。

    - `Separate /home partition`：将程序和用户数据存储在单独的分区。

    - `Separate /home`, `/var`, and `/tmp` partitions`：将用户数据、变量数据和临时数据保留单独的分区。


    点击右下角的 `Continue` 按钮继续安装。下一步是确认分区方案。这是根据经验自动计算的，包含这些分区：

    - `sda1`：第一个 SCSI 磁盘的第一分区，大小为 `3 GB` 的 `ext4` 文件系统，作为系统根 (`/`)。

    - `sda5`：第一个 SCSI 磁盘的第五个分区，大小为 `3 GB` 的 `ext4` 文件系统，存储变量数据 (`/var`)。

    - `sda6`：第一个 SCSI 磁盘的第六个分区，大小为 `3 GB` 的 `swap` 文件系统。

    - `sda7`：第一个 SCSI 磁盘的第七个分区，大小为 `311 MB` 的 `ext4` 文件系统，存储临时数据 (`/tmp`)。

    - `sda8`：第一个 SCSI 磁盘的第八个分区，大小为 `8.8 GB` 的 `ext4` 文件系统，存储用户数据 (`/home`)。


    由于历史原因，磁盘只能包含四个分区。第四个是 `Extended Partition`（扩展分区），用于划分逻辑分区或逻辑驱动。在我们的案例中，`/dev/sda2`
    和 `/dev/sda3` 是空的。从上方选择 `Finish partitioning and write changes to disk`（完成分区并将更改写入磁盘）。点击
    `Continue` 按钮继续。存储媒体将格式化为之前定义的 `ext4` 文件系统。一旦此步骤完成，`Debian` 基础系统将安装。


    ## 软件包管理


    ![Description: 0010.jpeg](img/rsrcJC.jpg)


    ISO 镜像包含安装程序和用于设置 Linux 基础的软件包。例如，这包括安装 Linux 内。下一步是你决定是否使用额外的安装媒体。在我们的案例中，我们只有一个磁盘，因此从菜单中选择
    `No`。如之前所述，`Debian` 的软件组织成软件包。这些软件包通过多个仓库提供。仓库由大学、私人人士和其他组织维护。在下一步中，你必须决定从哪个国家获取你的
    Debian 软件包。建议选择地理位置离你最近的镜像以减少从镜像传输到你计算机的时间。第一步，选择你所在的国家。第二步，从列表中选择首选镜像。列表包括大学、互联网提供商、政府服务和其他组织。在我们的案例中，网络包括一个与外界通信的代理服务器。在这种情况下，我们没有，将其留空。点击
    `Confirm` 按钮继续。一旦设置了参数，安装程序将连接到之前选择的镜像并获取软件包列表。列表包含可用软件包，包括名称、大小和描述。根据你的连接质量和带宽，此步骤可能需要一段时间。接下来，要求你参加
    Popcon 活动。此信息是可选的，仅供负责 Debian 包的开发团队使用。根据 Popcon，他们确定哪些软件包安装最多。在我们的案例中，我们不参加 Popcon，选择
    `No`。点击 `Confirm` 按钮继续选择软件任务 (`tasksel`)。


    ### 软件选择

    `Debian` 提供了精心安排的软件包选择，称为“任务”。它们背后的思想是为了特定用途对软件包进行分组以便简化安装。从对话窗口中的列表（见下图），你可以选择不同的环境，以及
    Web 服务器、打印服务器、SSH 服务器和标准系统工具。要进行最小化安装，只需启用列表最后两项。我们稍后将安装 XFCE 桌面。


    确认软件选择后，安装程序从软件包镜像检索所需的软件包，解包并安装它们。下方的条显示了进度。在这种情况下，必须下载 140 个软件包。


    ### 设置 GRUB

    为了启动我们新安装的 `Debian` 系统，我们也必须设置这些信息。这个过程被称为启动系统。处理这一步的软件组件名为统一引导程序（准确来说是 `GRUB`
    或 `GNU GRUB`）。`Yes` 项已预选，我们可以点击 `Continue` 继续。安装程序需要知道将 `UB` 安装在哪里。图中的菜单列出了要考虑的存储媒体。在我们的案例中，我们选择列表中的第二个项目
    (`/dev/sda`)。然后，点击 `Continue` 继续。现在我们几乎完成了基础安装，剩下的工作只是读一个对话框。


    ### 完成安装

    以下对话框通知你安装已完成。然后点击 `Continue` 重启新安装的系统。几秒后，屏幕上将基于文本的 `GRUB` 启动菜单。菜单包含两个选项：`Debian
    GNU/Linux` 和 `Advanced options for Debian`。第一项已高亮并预选。第二个菜单允许你设置启动选项。查看 `GRUB`
    手册 `www.gnu.org/software/grub`。保持第一项被选中并按 `Enter` 继续启动新系统。最后，将看到一个黑白色的屏幕，名为 `tty1`
    的登录提示符要求你登录系统。


    ```

    Debian GNU/Linux

    debian5 tty1 login: _

    ```


    登录系统后，我们将添加额外的软件以可以使用图形界面。在这一步，我们将更改并安装 `XFCE` 桌面。在登录提示符输入 `root`，按 `Enter`，输入
    `root` 用户的密码。然后再次按 `Enter` 确认并登录。接下来，将看到 `XFCE` 桌面。桌面带有若干默认元素：顶部导航栏、底部导航栏和桌面图标。所有提到的元素解释如下：

    - **顶部导航栏**：显示访问不同应用程序、虚拟桌面屏幕、时钟以及各种用户操作按钮，如锁屏、切换用户、切换待机和退出当前会话。

    - **底部导航栏**：包含多个按钮用于隐藏所有打开窗口并显示空桌面、打开终端、文件管理器、网络浏览器、查找应用程序以及直接打开主目录打开文件管理器。

    - **桌面图标**：从上到有垃圾箱、链接到计算机的文件管理器图标和主目录。


    在桌面上右键点击打开上下文菜单，允许你访问各种应用程序。


    ## 添加图形界面


    ![Description: 0011.jpeg](img/rsrcK8.jpg)


    在当前阶段，`Debian` 系统完全激活并可以生产。对于桌面系统，它缺少一个易用的图形界面。在这一步，我们将更改并安装 `XFCE` 桌面。列表包括：

    - `apt`：包管理器

    - `xdm`：显示管理器

    - `xfce4`：桌面环境


    `Debian` 使用 `apt` 处理安装、删除软件和相关的软件包列表。`apt` 解决所有依赖关系并确保系统上有相关软件。在我们的案例中，必须从镜像检索并安装总计约
    450 MB 的数据。为了安装软件包，在命令行输入 `#` 之后输入命令：


    ```

    root@debian5 ~# apt-get install xdm xfce4

    ```


    `apt` 将显示有关已安装软件包的更多信息。包括依赖包列表和推荐包。最后你会看到命令行提示。输入 `Y` 或按 `Enter` 安装 `apt`、`xdm`
    和 `xfce4` 以及依赖包。对于 `xdm` 显示管理器，必须确认两个对话框（见下图）。安装软件的检索需要一段时间。完成后，命令行提示再次出现。为了激活图形桌面的更改，重启系统。在命令行提示符输入命令
    `boot`：


    ```

    root@debian5 ~# reboot

    ```


    重启 Linux 系统后，`Debian` 用一个图形启动界面欢迎我们（见下图）。按 `Enter` 使用默认设置启动 Linux 系统。几秒后，将看到图形登录界面（见下图）。使用之前创建的名为
    `user` 的普通用户登录系统。输入 `user`，按 `Enter` 并输入用户密码。然后再次按 `Enter` 确认并登录。接下来，将看到 `XFCE`
    桌面（见下图）。桌面带有若干默认元素：顶部导航栏、底部导航栏和桌面图标。所有提到的元素解释如下：

    - **顶部导航栏**：显示访问不同应用程序、虚拟桌面屏幕、时钟以及各种用户操作按钮，如锁屏、切换用户、切换待机和退出当前会话。

    - **底部导航栏**：包含多个按钮用于隐藏所有打开窗口并显示空桌面、打开终端、文件管理器、网络浏览器、查找应用程序以及直接打开主目录打开文件管理器。

    - **桌面图标**：从上到下有垃圾箱、链接到计算机的文件管理器图标和主目录。


    在桌面上右键点击打开上下文菜单，允许你访问各种应用程序。


