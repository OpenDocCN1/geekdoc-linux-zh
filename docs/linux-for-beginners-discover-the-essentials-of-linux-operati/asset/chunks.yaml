  trans: "\n\n# 文件修改：查找、挂载与更改大小\n\nLinux 文件通常易于定位。只需搜索目录，紧接在“/”或正斜杠后面的名称可能你想要的文件。\n\
    \n示例：\n`/home/lp.txt`\n\n如示例所示，`/home/` 是目录，`lp.txt` 是一个文件。你可以开始挂载了。在挂载文件时，需要\
    \ Linux 内核的可用性来检查标准。它的存在允许对系统所有传递的参数进行验证。\n\n示例：\n```bash\n# mountiso898 /dev/rom\
    \ /dev/cdrom\n```\n如示例所示，你正在挂载三种信息。`iso898`、`/dev/rom,` 和 `/dev/cdrom.`。\n\n除了查找和挂载文件外，你还有更改文件大小的选项。这是由于文件碎片的产生。由于文件在碎片期间会变得效率低下，更改文件大小允许文件的分配。因此，系统会变得更加稳定。\n\
    \n你将学习到 `truncate` 和 `fallocate` 命令。这两个命令都允许你创建一个具有所需大小的文件。\n\n示例：\n```bash\n\
    # truncate -s 19MB mop1.txt\n# fallocate -l 19000000 mop2.txt\n# ls -ls mop.txt\n\
    0 -rw-rw--r-- 2 trs trs 19000000 Aug 12 02:44 mop1.txt\n14819 -rw-rw--r-- 2 trs\
    \ trs 19000000 Aug 12 02:45 mop2.txt\n```\n\n# 第 15 章：处理文本文件\n\n内部字段分隔符 `IFS`\
    \ 被 bash 用于将字符串拆分为不同的单词。你可以将其想象为 Excel 将逗号分隔值 (CSV) 文本文件拆分为电子表格的方式；根据它，逗号分隔列。\n\
    \n我们假设 `IFS` 被设置为某个任意值，例如 `Z`。当 bash 展开一个包含‘Z’的变量时，该值值的变量将被拆分为不同的单词（在那种情况下，字面上的\
    \ Z 会消失）：\n\n`IFS` 变量默认设置为三个字符，包括空格、制表符和换行符。如果你执行 `echo '$IFS'`，你将什么也看不到，因为显然，在没有任何可见字符的情况下是不可能看到空格字符的。那么结果是什么？简单，你可能会在网上看到代码片段，其中变量\
    \ `IFS` 被更改 `'\\n'`（这代表“换行符”）或类似的内容。\n\n想象有一个文本文件，其中有一组文本行，例如，它们可能如下引用文件名：\n\n\
    当读取文件的每一行时，`IFS` 的默认值（无疑包含一个空格字符）会导致 bash 将文件：`rough draft . txt` 视为双倍或两个文件，即\
    \ `rough` 和 `draft . txt`，这是因为拆分单词使用了空格字符。\n\n当 `IFS` 设置为换行符时，`rough draft . txt`\
    \ 将被视为一个文件名。\n\n正如你将注意到的那样，当涉及到读取文本文件并对每一行进行操作时，这个概念是有意义的。你可能无法完全理解这一点，但让你意识到这一点是非常重要的，至少以防你习惯了随意地从网上复制粘贴代码。\n\
    \n## 未引号的变量有多糟糕？\n\n在一个美好的理想世界里，我们都应该保持字符串值简短，且不包含空格或换行符或其他任何特殊字符。在这样的世界中，下面的未引号变量引用将完美运行。然而，当我们开始在文件名中添加特殊字符（如空格）并在不使用双引号的情况下扩展变量时，可能会是有害的。在下面的示例中，我想删除名为\
    \ `junk final.docx` 的文件：\n\n### 意外的单词拆分\n尽管如此，当不使用双引号引用时，bash 认为下方的 `file_to_kill`\
    \ 是一个包含两个独立值的项，包括 `junk` 和 `final.docx`：\n\n### 意外的特殊字符\n你可能会想，“这并没有什么伤害”，因为那些文件根本就不存在。这没关系，但如果有人在文件名中放入星号会发生什么？你知道有人执行\
    \ `grep *` 和 `rm *` 时会发生什么，对吧？星号像一只饥饿的熊，抓走所有的文件。\n\n鉴于 `junk` 和 `final.docx` 不存在，你将看到之前的错误。然而，在这些尝试删除的操作之间，`rm`\
    \ 运行在星号上。所以，和该目录下的所有文件告别吧。\n\n你会看到 `rm \"$filename\"` 只影响名为 `* LOL BYE FILES`\
    \ 的文件。因此，这里的主要要点是尽可能在你的变量引用中使用双引号。\n\n这里有你理得的更多信息……\n你可能在想“世界上谁会在文件名中放置星号字符？”首先，我们确实有喜欢星形符号的人；此外，我们还有恶意的黑客和讨厌的恶作剧星，他们不在意使用星号字符。注意，变量通常不是由于人类输入赋值的；正如你所知，有时命令的结果会存储在变量中。在原始数据由此类命令处理的情况下，那种数据可能包含损坏某些\
    \ bash 程序的特殊字符。你始终要记住，粘贴看似安全的代码是有危险的。bash 处理字符串的语法和行为非常难以理解，这就是为什么开发者转向其他语言来处理更复杂的应用程序。\n\
    \n# 第 16 章：管理运行进程\n\nLinux 中的进程（如 UNIX 中一样）是运行在单独虚拟地址空间中的程序。当用户登录系统时，会自动创建一个进程，并在其中执行\
    \ shell，例如 `/bin/bash`。\n\nLinux 支持经典的多道程序方案。Linux 支持并行（如果只有一个处理器，则是准并行）用户进程。每个进程都运行在自己的虚拟地址空间中，即进程之间相互保护，一个进程的崩溃不会影响另一个。\n\
    \n内核提供了用于创建新进程和管理生成进程的系统调用。只有当另一个进程启动它或发生某些中断时，任何程序才能开始执行。使用两个系统调用创建进程：`fork()`\
    \ 和 `exec`。\n\n```bash\nif (fork() == 0) \n    wait(0);\nelse \n    execl(\"ls\"\
    , \"ls\", 0);\n```\n\n### 输入/输出重定向\n几乎所有的操作系统都有输入输出重定向机制。Linux 例外。通常，程序从控制台（终端）输入文本数据并将数据输出到控制台。输入控制台意味着键盘，然后输出到终端。键盘和显示分别是标准输入和输出（`stdin`\
    \ 和 `stdout`）。任何输入/输出都可以解释为从文件的输入和到文件的输出。对文件的操作通过它们的描述符完成。UNIX 使用三个文件进行输入输出：`stdin`\
    \ (句柄 1)，`stdout` (2) 和 `stderr` (3)。\n\n- `>` 用于将标准输出重定向到文件。\n```bash\n$ cat\
    \ > newfile.txt\n```\n`cat` 命令的标准输入将重定向到文件 `newfile.txt`，该文件将在执行此命令后创建。如果已存在同名文件，它将被覆盖。按\
    \ Ctrl + D 将停止重定向并终止 `cat` 命令的执行。\n\n- `<` 用于重新分配标准命令输入。例如，如果你运行 `cat < file.txt`\
    \ 命令，`file.txt` 文件将作为标准输入。\n\n- `>>` 用于将数据追加到文件末尾（追加）标准输出。例如，与 `>` 情况不同，执行命令 `cat\
    \ >> newfile.txt` 如果文件存在则不会覆盖而是添加数据。\n\n- `|` 用于将一个程序的标准输出重定向到另一个程序的标准输入。例如，`ps\
    \ -ax | grep httpd`。\n\n### 进程管理命令\n\n#### Ps 命令\n`ps` 设计用于显示进程的信息。该命令有很多参数你可以在手册中找到（`man\
    \ ps`）：\n- `-a`: 显示所有与终端相关的进程（所有用户进程）\n- `-e`: 显示所有进程\n- `-t`: 终端相关进程\n- `-u`:\
    \ 用户标识，显示与这些标识符相关的进程\n- `-g`: 组标识，显示与这些组标识相关的进程\n- `-x`: 显示所有非终端进程\n\n#### “top”程序\n\
    设计用于实时显示进程信息。进程按最大 CPU 时间排序，但你可以更改排序（参见 `top`）。程序还报告空闲资源。你可以通过 `free` 命令查看 RAM\
    \ 信息，关于磁盘内存使用 `df`。关于系统中注册用户的信息可以使用 `w` 命令。\n\n#### 更改进程优先级\n`nice [-reduction\
    \ factor] [argument]`\n`nice` 命令以较低的优先级执行指定的命令，因子范围为 -20..19（默认等于 0）。超级用户可以增加命令的优先级，这需要指定负因子，例如\
    \ `-10`。如果你指定的系数大于 19，将被认为是低。\n\n#### nohup - 忽略中断\n`nohup [argument]`\n`nohup`\
    \ 以忽略模式运行命令。只有 `SIGHUP` 和 `SIGQUIT` 信号是不忽略的。\n\n#### kill - 强制完成\n`kill [signal\
    \ number]`\n其中 `PID` 是可以通过 `ps` 找到的进程标识。\n\n#### 后台运行进程命令 - jobs, fg, bg\n`jobs`\
    \ 列出在后台运行的进程，`fg` 将进程于普通模式（前台），`bg` - 在后台。你可以使用 `&` 在后台运行程序。\n\n# 第 17 章：成为系统管理员\n\
    最重要的一点是选择合适的发行版。如果你知道自己什么，这就不大了。这应该引导你：\n\na) 你是什么种计算机用户？你是新手还是高手？选择一个与你的计算机技能匹配的发行版将让你受益。\n\
    \nb) 你喜欢标准界面还是现代桌面？这因人而异。有许多人喜欢现代桌面，也有许多计算机用户喜欢标准界面。花时间学习两者以便选择最适合你的界面。\n\nc)\
    \ 你想要服务器还是桌面发行版？这取决于你是否想成为系统管理员或只需要命令行。如果你的计算机技能基础，建议使用对新手友好的发行版如 Ubuntu 或 Linux\
    \ Mint。技能以上的的用户可以选择 Fedora 或 Debian。精通系统管理的大佬可以选择 Gentoo。寻找只需要命令行的发行版用户需要在桌面界面之间做选择。系统管理员可以根据所需的功能选择发行版。如果你正在寻找开箱即用的服务器发行版，可以选择\
    \ CentOS。如果你正在寻找允许你添加所需功能的桌面发行版，可以选择 Ubuntu 或 Debian。新用户选择适合他们使用的发行版会让工作容易得多。这种方法将节省时间。\n\
    \n# 第 18 章：管理用户帐户\n\n等等，第 18 章：管理用户”，看看你在计算机上大部分时间在做什么。如果你在网上浏览，Linux 在你的计算机上比\
    \ MS Windows 更合适。在互联网上，恶意网站正等待你的计算机。在现代互联网，为了生存 MS Windows 必须额外使用防火墙和杀毒软件。在“旧计算机”参数中阅读更多。事实是\
    \ MS Windows 默认第一个用户拥有无限管理员权限，当任何其他程序到达计算机时，它是以用户权限启动的。在这种情况下，现代 MS Windows 版本如\
    \ Windows 7 引入了 UAC 机制——用户账户控制。这有帮助，但并没有解决问题，例如点击“是”，在读取和扩展之前，并不清楚属于谁。在 Ubuntu\
    \ Linux 中，用户是以管理员身份坐在系统中是安全的。许多用户在互联网上使用 Internet Explorer 面临巨大风险（这是一个蓝色字母 E）。事实是，大多数盗版\
    \ MS Windows 没有权限从厂商处更新，网络浏览器也没有更新！对我来说，你的旧版浏览器对于病毒编写者和木马来说就是快乐，当此类用户访问安装了恶意软件的网站时，他们的心会颤抖。在德国，官方建议不要在所有版本的\
    \ MS Windows 上使用 Internet Explorer，而是使用替代浏览器。安装 Ubuntu Linux 后你会发现如 Opera、Mozilla\
    \ Firefox、Google Chrome。如果你在 MS Windows 下使用它们，这些极其安全的版本在 Ubuntu Linux 中等待你。在 MS\
    \ Windows 中，连接数有软件限制，因此微软不允许 MS Windows 客户端仅服务 10 个用户客户端。这是必要的，以便用户不会从家庭计算机安排服务器并破坏微软的业务。在网上阅读当下载客户端启动并使用许多连接时有多少人痛苦。MS\
    \ Windows 中无法舒适地浏览互联网，一切都变慢了。人们修复 MS Windows 系统库并冒着系统性能的风险以消除诚实购买的计算机软件限制——恐怖！Ubuntu\
    \ Linux 没有限制；所有 65535 TCP + 65535 UDP 端口都是你的，没有更多端口了！在 Linux 中，强大的网络子系统设置很难填满网络，MS\
    \ Windows 下的网络敌人如果用某种网络攻击你就会卸载。\n\n# 第 1 章：管理磁盘和文件系统\n\n作为 Linux 用户，通过终端管理文件至关重要。你很少遇到从终端切换到\
    \ GUI 控制的情况。在本节中，我们将学习如何从终端管理文件，就像使用 GUI（图形界面）文件管理器一样。启动终端，让我们开始。\n\n- `pwd`:\
    \ 此命令打印工作目录；显示你在文件系统中当前的工作目录。\n- `cd`: 我们使用此命令进入目标目录。完整语法是 `cd <目标目录名称>`。如果目录在当前目录之外，则需要路径。如果不指定目标目录，它将带你进入主目录。要返回上次调用\
    \ cd 之前的目录，输入 `cd ..`。\n- `ls`: 我们使用 `ls` 命令列出当前目录下的所有文件和目录。`ls` 命令的语法是 `ls <option>\
    \ [file|dir]`。\n- `mkdir`: 我们使用此命令创建新目录。要在当前工作区创建一个新目录，输入 `mkdir <目录名>`。对于要在当前目录之外创建的情况，必须指定路径。例如，`mkdir\
    \ /user1/Desktop/Report/lastWeek`。\n- `rmdir`: 我们使用 `rmdir` 命令删除目录。与 `mkdir` 命令类似，该命令带有决定系统如何删除文件的选项。\n\
    \n## 其他实用命令\n除了上面讨论的文件管理命令外，Linux 还支持大量的命令。在这一节中，我们将查看一些必须知道的命令。\n\n"
