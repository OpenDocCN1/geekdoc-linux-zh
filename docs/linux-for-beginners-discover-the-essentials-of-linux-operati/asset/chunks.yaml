    \ file, it will fail because permission is denied. You haven't run the specific\
    \ command at `sudo`. You need to type `sudo !!`. The two exclamation marks mean\
    \ run the previous command. Try:\n\n```bash\nsudo !!\n```\n\nWrite to the file:\
    \ `test 343`. Success!\n\nWhat if you have a lot of things to do, and you don't\
