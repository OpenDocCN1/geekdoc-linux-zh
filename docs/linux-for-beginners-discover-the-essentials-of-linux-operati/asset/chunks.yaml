    # 终端命令


    | COMMAND | Description |

    | :--- | :--- |

    | `help` | 列出终端中的所有命令。 |

    | `tar` | 我们使用它来解压、创建和查看 tar 文件。 |

    | `find` | 我们使用此命令在指定位置搜索符合特定标准的文件。 |

    | `gzip` | 我们使用此命令提取和创建 gzip 归档。 |

    | `unzip` | 我们使用 unzip 命令来提取或解压缩 zip 归档。 |

    | `whatis` | 此命令显示特定命令的用法；它提供了该命令的简短描述。 |

    | `Man` | 此命令显示指定命令的手手册。 |

    | `exit` | `exit` 命令结束当前的 bash 会话。我们可以在一个终端中拥有多个 bash 会话。 |

    | `sudo` | 我们使用此命令以超级用户或 root 用户身份运行指定的命令。 |

    | `su` | 在终端中，我们使用此命令将当前用户切换为指定用户。 |

    | `top` | 此命令在终端中充当任务管理器，并显示顶部进程。 |

    | `shutdown` | 此命令在指定时间后关闭计算机。 |


