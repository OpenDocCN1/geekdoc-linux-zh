- fmt: "\n# File modification: finding, mounting & changing sizes\n\nA Linux file\
    \ is usually easy to locate. Just search for a directory and the name that succeeds\
    \ a “/” or a forward slash might be your preferred file.\n\nExample:\n`/home/lp.txt`\n\
    \nAs the sample shows, `/home/` is the directory, and `lp.txt` is a file. You\
    \ can then start mounting. When mounting a file, the availability of a Linux kernel\
    \ is necessary to check the standards. Its presence allows the validation of all\
    \ of a system’s passed arguments.\n\nExample:\n```bash\n# mountiso898 /dev/rom\
    \ /dev/cdrom\n```\nAs the sample shows, you are mounting three kinds of information.\
    \ `iso898`, `/dev/rom,` and `/dev/cdrom.`.\n\nApart from finding and mounting\
    \ a file, you have the option to change a file’s size. This is done due to the\
    \ occurrence of a file’s fragmentation. Since files become inefficient during\
    \ fragmentation, changing a file’s size allows the allocation of files. Consequently,\
    \ a system becomes more stable.\n\nYou are introduced to the commands `truncate`\
    \ and `fallocate`. Both commands allow you to create a file with a preferred size.\n\
    \nExample:\n```bash\n# truncate -s 19MB mop1.txt\n# fallocate -l 19000000 mop2.txt\n\
    # ls -ls mop.txt\n0 -rw-rw--r-- 2 trs trs 19000000 Aug 12 02:44 mop1.txt\n14819\
    \ -rw-rw--r-- 2 trs trs 19000000 Aug 12 02:45 mop2.txt\n```\n\n# Chapter 15: working\
    \ with text files\n\nThe Internal field separator `IFS` is used by bash to split\
    \ strings into distinct words. You can think of it as the way excel splits a comma-separated-values\
    \ (CSV) text file into spreadsheets; according to it, commas separate the columns.\n\
    \nWe’ll assume that `IFS` is set to something arbitrary, such as `Z`. When a variable\
    \ is expanded by bash, which contains a ‘Z’, that value’s variable will be split\
    \ into distinct words (in that case, the literal Z disappears):\n\nThe `IFS` variable\
    \ is by default set to three characters, which include space, tab and newline.\
    \ If you `echo '$IFS'`, you will not be able to see anything since, obviously,\
    \ it wouldn’t be possible to see a space character without any visible characters.\
    \ So what is the upshot? Simple, you may see snippets of code online in which\
    \ the variable `IFS` is changed to `'\\n'` (this stands for ‘newline character’)\
    \ or something similar.\n\nImagine having a text file that has a set of lines\
    \ of text, which, for instance, may refer to filenames as follows:\n\nWhen each\
    \ line of the file is read, the `IFS` default value (which definitely includes\
    \ a space character), causes bash to treat the file: `rough draft . txt` as a\
    \ double or two files which are `rough` and `draft . txt`, this is because splitting\
    \ words uses the space character.\n\nWhen `IFS` is set to the newline character,\
    \ the `rough draft . txt` becomes treated as one filename.\n\nAs you will notice,\
    \ this concept will make sense when it comes to reading text files and operating\
    \ on each and every line. It might not be possible to understand this fully but\
    \ you it is important you become aware of it, at least just in case you’re used\
    \ to copy-pasting code from the internet haphazardly.\n\n## How Bad Can Unquoted\
    \ Variables Be?\n\nIn a nice, ideal world, we all would keep our string values\
    \ short and devoid of space or newlines, and any other special characters. In\
    \ such a world, the unquoted variable reference below would work perfectly. However,\
    \ when we start adding special characters to filenames, like spaces and expanding\
    \ variables without using double quotes, it can be detrimental. In the example\
    \ below, I want the file by the name `junk final.docx` deleted:\n\n### Unanticipated\
    \ word-splitting\nNonetheless, when referenced without double quotes, bash perceives\
    \ `file_to_kill` as one that has two separate values that include `junk` and `final.docx`\
    \ below:\n\n### Unanticipated special characters\nYou might think, “but there’s\
    \ no harm done” because those files did not even exist in the first place. That’s\
    \ fine, but what would happen if someone placed an asterisk into a filename? You\
    \ do know what happens when someone does `grep *` and `rm *` don’t you? The star\
    \ acts like a hungry bear, grabbing all the files.\n\nGiven that `junk` and `final.docx`\
    \ are nonexistent, you’ll be able to see the previous errors. However, in between\
    \ those tried deletions, `rm` runs on the asterisk. So, just say goodbye to all\
    \ the files in that directory.\n\nYou do see how `rm \"$filename\"` only affects\
    \ the file named `* LOL BYE FILES`. Therefore, the main takeaway here is always\
    \ use double quotes in your variable references as often as you can.\n\nHere’s\
    \ a little more info that you deserve…\nYou might be thinking ‘who in the world\
    \ would place a star character in their filename?’ For one, we do have folks who\
    \ enjoy star-shaped symbols; also, we have malicious hackers and annoying prank-stars\
    \ who wouldn’t mind using a star character. Note that variables are usually not\
    \ just assigned as a result of human typing; as you already know, at times, the\
    \ result of commands are stored in a variable. In the instance raw data is being\
    \ processed by such commands, it is possible that that kind of data does contain\
    \ special characters that can damage certain bash programs. You always have to\
    \ keep it in mind the dangers of just pasting in code that seems safe. The syntax\
    \ and behavior of bash in handling strings is quite difficult to understand, which\
    \ is why developers turn to other languages to go about more complex applications.\n\
    \n# Chapter 16: managing running process\n\nA process in Linux (as in UNIX) is\
    \ a program that runs in a separate virtual address space. When a user logs into\
    \ the system, a process is automatically created in which the shell is executed,\
    \ for example, `/bin/bash`.\n\nLinux supports the classic multiprogramming scheme.\
    \ Linux supports parallel (or quasi-parallel if there is only one processor) user\
