    ports! In Linux, a strong network subsystem, with settings that will be hard for
    you to fill up on the network, an enemy in the network under MS Windows will unload
    if he attacks you with some kind of network attacks.Chapter 1 : managing disks
    and file systemsAs a Linux user, managing files via the terminal is very essential. Rarely
    will you encounter cases where you switch from terminal to GUI control. In this
    section, we are going to see how to manage files from the terminal similar to
    how you would use a GUI (graphical user interface) file manager.Launch the terminal
    and let us get started.❖        pwd. This command stands for print working directory;
    it shows your current working directory in the file system.❖        cd – We use
    this command to navigate to the targeted directory. The complete syntax is cd
    <name of target directory>. If the directory is outside the current working directory,
    the path is required. If you do not specify the target directory, it takes you
    to your home directory. To go back to the previous directory since your last cd
    call, type cd .. or cd ­–❖          ls – We use the command ls to list all the
    files and directories within the current working directory. The syntax for ls
    command is ls <option> [file|dir] . The table below shows some of the options
    for ls command.![Description: 00013.jpeg](rsrc1FZ.jpg)❖        mkdir – We use
    this command to create new directories. To create a new directory in your current
    workspace, type mkdir <dir name> For example, mkdir newFolder. For cases where
    you want to create a directory outside your current directory, you must specify
    a path. For example, mkdir /user1/Desktop/Report/lastWeek where in this case,
    lastWeek is the name of the directory you want created.❖        rmdir – We use
    the rmdir command to remove directories. Similar to the mkdir command, this command
    takes options that determine how the system deletes files.❖        mv and cp –
    We use the mv command to move and rename directories and files. We use the cp
    command to copy files. The syntax for copying files is cp <source file> <target-file>
    . Here is an example, mv helloDir > /usr/share/.Other Useful CommandsApart from
    the file management commands we have discussed above, Linux supports a wide array
    of commands. In this section, we are going to look at some of the must know.'
