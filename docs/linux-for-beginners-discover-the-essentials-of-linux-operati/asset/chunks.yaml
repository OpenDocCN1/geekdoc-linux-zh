    当需要对多种对象执行相似的操作时，命令行行的优势变得尤为明显。在具有图形界面的系统中，你需要根据对象的数量进行相应次数的鼠标拖拽，而在命令行中，只需一个命令就足够了。本节将介绍允许你使用命令行解决任何用户任务的主要工具：从文件和目录的简易操作（例如复制、重命名、搜索），到用户应用程序工作中需要执行大量相似操作的复杂任务（如处理大型数据数组或文本，以及系统管理）。


    # Shell（外壳）

    命令行外壳（command shell）或命令解释器是一个程序，其任务是将你的命令传递给操作系统和应用程序，并将它们的回答返回给你。根据其任务，它对应于 MS-DOS
    中的 `command.com` 或 Windows 中的 `cmd.exe`，但从功能上来说，Linux 的 shell 要丰富得多。在命令行 shell
    语言中，你可以编写小型程序来对文件及其包含的数据执行一系列顺序操作——即脚本。


    通过输入用户名和密码登录系统后，你将看到命令行提示符——一个以 `$` 结尾的行。稍后该符号将用于表示命令行。如果在安装过程中配置了系统启动时运行图形用户界面，那么你可以在任何虚拟文本控制台上进入命令行。你需要按下
    `Ctrl-Alt-F1` - `Ctrl-Alt-F6`，或者使用任何终端仿真程序，例如 `xterm`。


    以下是可用的 shell。它们可能根据发行版的不同而异：


    *   `bash`: Linux 最常用的 shell。它可以补全命令和文件的名称，保留命令历史并提供编辑这些命令的能力。

    *   `pdk`: korn shell 的克隆版本，在 UNIX shell 系统中广为人知。

    *   `sash`: 该 shell 的特殊之处在于它不依赖于任何共享库，并包含一些最重要的实用程序的简化实现，例如 `al`、`dd` 和 `gzip`。因此，在从系统崩溃中恢复或在升级最重要的共享库版本时，`sash`
    特别别用用场。

    *   `tcsh`: C shell 的改进版本。

    *   `zsh`: 此列出的 shell 中最新的。它实现了命令参数自动补全的高功能以及许多其他功能，使得使用 shell 变得更加方便高效。但是，请注意，所有
    `zsh` 扩展默认都是禁用的，因此在你开始使用此命令行之前，你需要阅读它的文档并启用你需要的功能。


    默认 shell 是 `bash` (Bourne Again Shell)。要检查你正在使用哪个 shell，输入命令：`echo $ SHELL`。shell
    之间的区别不仅在于能力上，而且于命令语法上。如果你是初学者，我们建议使用 `bash`，随后的示例将描述该特定领域的工作。


    # Bash shell

    `bash` 中的命令行由命令名组成，后面跟着键（选项），即修改命令行为的指令。键以字符 `-` 或 `–` 开头，通常由单个字母组成。除了键之外，命令后面还可以跟上参数（参数）——即必须执行该命令的对象的名称（通常是文件和目录的名称）。


    按下回车键完成命令输入，随后命令将传递给 shell 执行。作为在用户终端上执行命令的结果，可能会出现关于命令执行或错误的消息，而下一个命令行提示符（以 `$`
    字符结尾）的出现表示命令已完成，你可以输入下一个命令。


    `bash` 中有几种技术可以让你更方便地输入和编辑命令行。例如，使用键盘，你可以：

    *   `Ctrl-A`: 跳到行首。按下 `Home` 键也可以同样的操作；

    *   `Ctrl-U`: 删除当前行；

    *   `Ctrl-C`: 终止当前命令的执行。


    你可以使用符号 `;` 在同一行内输入多个命令。`bash` 记录了所有执行过的命令历史，因此很容易重复或编辑之前的某条命令。要这样做，只需从历史中选择所需的命令：`up`
    键显示上一个命令，`down` 键显示上一个和下一个。为了在已执行的命令中找到特定的命令，而无需翻遍整个历史，输入 `Ctrl-R` 并输入你正在查找的命令中使用的某些关键字。


    历史记录中的命令是有编号的。要运行特定命令，输入：`! command number`

    如果你输入 `!!`，将启动最后输入的命令。


    有时在 Linux 上，程序和命令的名称太长。幸运的是，`bash` 本身可以补全名称。通过按下 `Tab` 键，你可以补全命令、程序或目录的名称。例如，假设你想使用
    `bunzip2` 解压程序。这样做，输入：`bu` 然后按 `Tab`。如果没有发生什么，则有几种可能的命令补全。再次按下 `Tab` 键将给你一个以 `bu`
    开头的名称列表。例如，系统有 `buildhash`、`builtin`、`bunzip2` 程序：

    ```

    $ bubuildhash builtin bunzip2

    $ bu

    ```

    输入 `n>`（`bunzip` 是唯一第三个字母是 `n` 的名称），然后按 `Tab`。shell 将补全名称，剩下的只需按 `Enter` 即可运行命令！


    注意，从命令行调用的程序由 `bash` 在 `PATH` 系统变量定义的目录中进行搜索。默认情况下，此目录列表不包含当前目录，用 `./`（点斜）表示）。因此，要从当前目录运行
    `prog` 程序，必须发布命令 `./prog`。


    # 基本命令

    任何系统中必须解决的首要任务是：处理数据（通常存储在文件中）和管理运行的程序（进程）。以下是允许你在系统上对文件和进程执行最重要的操作的命令。只有 `cd`
    是 shell 的，其余是分布的，但在任何 Linux 系统上都可用。所有命令都可以在文本控制台和图形模式（`xterm`，控制台）下运行。有关每个命令的更多信息，请使用
    `man` 命令，例如：

    ```

    man ls

    ```


    `cd`: 允许更改当前目录（通过文件系统）。它支持绝对路径和相对路径。假设你在主目录并想进入 `tmp/` 子目录。这样做，输入相对路径：`cd tmp/`
    切换 `/usr/bin` 目录，输入（绝对路径）：`cd /usr/bin/`

    该命令的一些选项有：

    *   `cd ..`: 允许返回父目录。

    *   `cd -`: 返回上一个目录。


    `ls`:（列表）列出当前目录下的文件。两个主要选项：`-a` 查看所有文件，包括隐藏文件，`-l` 显示更详细的信息。


    `rm`: 此命令用于删除文件。警告：删除文件无法恢复！语法：`rm filename`。此程序有几个参数。最常用的是：`-i` 文件删除请求，`-r` 递归删除（即包括子目录和隐藏文件）。示例：

    ```

    rm -i ~/html/*

    ```

    删除所有的 `.html` 文件。


    `mkdir`、`rmdir`：`mkdir` 命令允许你创建目录，而 `rmdir` 删除目录，前提是空的。语法：

    ```

    mkdir dir_name

    rmdir dir_name

    ```

    `rmdir` 命令经常被 `rm -rf` 命令替换，后者允许删除目录，即使它们不是空的。


    `less`: 允许分页查看。语法：`less filename`。它在编辑文件之前非常有用；该命令的主要用途是处理一个屏幕无法显示的大量文本。要退出 `less`，按
    `q`。


    `grep`: 此命令允许你查找文件中的字符字符串。请注意 `grep` 通过正则表达式进行搜索，在正则表达式语言中，可以描述模式的单词，例如：“行周围的空格”。更多信息可以参考文档（man
    grep）。语法：

    ```

    grep search_file

    ```


    `ps`: 显示当前进程列表。列表示进程名，`PID`（进程标识符）用于进程操作——例如使用 `kill` 命令发送信号。`ps ax` 参数允许你查看那些属于你的进程。提供了更多信息。语法：

    ```

    ps au

    ```


    `kill`: 如果程序停止响应或挂起，使用此命令完成它。语法：

    ```

    kill PID_number

    ```

    这里的 `PID_number` 是进程号，你可以通过 `ps` 找到每个可执行程序的进程号。但有时不起作用，你需要使用 `kill -9 PID_number`。


    # 文件和目录操作

    这里考虑处理文件系统的工具：文件、目录以及通用文件系统。


    *   `cp`: 复制文件和目录。

    *   `mv`: 移动（重命名）文件。

    *   `rm`: 删除文件和目录。

    *   `df`: 显示磁盘使用报告（所有磁盘的剩余空间）。

    *   `du`: 计算文件或目录空间。

    *   `ln`: 创建文件链接。支持不同的输出格式。

    *   `mkdir`: 创建目录。

    *   `touch`: 文件时间戳（修改、访问），可以创建空文件。

    *   `realpath`: 通过相对路径计算绝对文件名。

    *   `basename`: 从全文件名移除路径（即将绝对名称缩短为相对）。

    *   `dirname`: 从全名移除文件名（即显示文件所在的目录名称）。

    *   `pwd`: 显示当前目录的名称。


    # 过滤器

    过滤器是从标准输入读取数据、将其转换并输出到标准输出的程序。使用过滤器允许你组织管道以对单命令数据执行顺序操作。本节列出的许多命令都可以处理文件。可以找到
    I/O 重定向和管道的信息。


    *   `cat`: 合并文件并显示到标准输出。

    *   `tac`: 从末尾合并文件并显示到标准输出。

    *   `sort`: 对行进行排序。

    *   `uniq`: 删除排序文件中的重复行。

    *   `tr`: 执行标准输入中某些字符的替换，可以用于转译、删除额外字符以及更复杂的替换。

    *   `cut`: 系统文本格式的数据。它允许只显示表格中的指定字段，单元格由字符分隔。

    *   `paste`: 将多个文件的数据合并为一个表。默认情况下，首先考虑常规字段。

    *   `split`: 根据模板将文件分成部分。

    *   `expand`: 将制表符转换为空格。

    *   `expand`: 将空格转换为制表符。

    *   `fmt`: 按宽度格式化文本。

    *   `fold`: 将过长的行传输到下一行。

    *   `wc`: 统计文件中的行、词和字符数。

    *   `od`: 以八进制、十六进制和其他类似的形式显示文件。

    *   `head`: 显示指定大小的文件的初始部分。

    *   `tail`: 输出给定大小的文件末尾部分，因为它可以输出添加到文件末尾的数据。用于跟踪日志文件。

    *   `echo`: 显示参数的文本。

    *   `false`: 什么都不做，返回码为 1（错误），当尝试执行失败的命令时可以在 shell 中使用。

    *   `true`: 什么都不做，返回码为 0（成功），在需要执行成功命令时可以在脚本中使用。

