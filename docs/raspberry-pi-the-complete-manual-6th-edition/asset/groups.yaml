    \n你更倾向于使用图形界面来安装新程序吗？如果是，请继续阅读……\n\n> 你知道吗……\n> Synaptic 可以通过命令行访问相同的存储库，正如之前的所示。\n\
    \n如果你是 Linux 新手，可能会对使用内置的 Apt 软件包管理工具感到畏畏和困惑。apt-get 命令用于通过互联网连接远程服务器（称为存储库）来安装应用程序。但它是通过命令行提示符使用的，这可能会让人感到压力，因此我们需要一种替代方案：桌面环境方法。\n\
    \n这就是 Synaptic 的用武之地。Synaptic 是 apt-get 命令行的一个友好图形界面，允许你通过已经熟悉的桌面环境管理应用程序的安装和删除。把它想象成一种在线商店，你可以在那里挑选已下载和安装的程序，而无需进入终端。\n\
    \n![](img/4e995e1f4f2888a19b2d6bf0add45e32_33_0.png)\n\n- 升级整个系统\nSynaptic 有更新并升级每个程序或软件包。将系统升级到最新版本\n\
    \n- 安装及更多\nSynaptic 是一个非常强大的工具。通过你可以安装、删除、升级单个软件包或程序\n\n- 浏览文档\n从 Synaptic 你可以浏览并阅读与软件包或程序相关的所有在线文档\n\
    \n"
