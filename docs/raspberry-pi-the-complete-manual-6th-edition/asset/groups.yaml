    \n> 将树莓派设置为无线打印是消除工作站烦人电缆极极方法\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_81_0.png)\n\
    \n## 无线打印\n\n## 检查你的打印机工作正常\n\n## 加入 Windows 工作组\n\n在开始之前，检查你计划使用的打印机是否仍然可用且有足够的墨。最简单的方法是查看文档（如果找不到的话）并运行测试。\n\
    \n完成这些添加后，在配置窗口中搜索 'workgroup' 并设置你的工作组：\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_82_0.png)\n\
    ```\nworkgroup = your_workgroup_name\nsupports = yes\n```\n取消第二个设置以便从 Windows\
