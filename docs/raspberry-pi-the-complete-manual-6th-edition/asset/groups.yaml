    ## Switch the LED on and off


    03 At the moment, the LED is connected to pin 3.3V. It is not very able to turn
    it on and off, so if you connect it to GPIO 17 to the right pin from the bottom
    row of Pi, will work back. We can turn the LED on by exporting the GPIO, setting
    it to an output pin and then setting its value to 1. Setting the value to 0 turns
    the LED back:


    ```

    echo 17 > /sys/class/gpio/export

    echo out > /sys/class/gpio/direction

    echo 1 > /sys/class/gpio/value

    echo 0 > /sys/class/gpio/value

    ```


