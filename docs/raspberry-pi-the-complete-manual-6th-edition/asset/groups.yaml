    \n## 设置打印机\n\n## 添加你的打印机\n\n在 GUI 中启动 CUPS 管理界面，输入 127.0.0.1:631。切换到管理，确保启用“共享打印机”框。选择“添加打印机”并进入用户名和密码。\n\
