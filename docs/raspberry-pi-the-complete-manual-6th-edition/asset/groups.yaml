    ## 准备设备


    01 虽然 Zero 占的空间不大，但视频游戏控制器内部通常挤满了精密的电子元件。这里的诀窍是找到一个内部空间足够能容纳 Zero 的控制器。我们将使用原始的
    Xbox 控制器，绰称“大公（The Duke）”。如果你没有那种控制器，可以在大多数二手电子产品店花几块钱买到一个，我们确实也买了一个。


    如果你找不到，可以使用设计成像 SNES（红白）或 Mega Drive（世嘉）等经典系统的 USB 游戏手。确保你选择的控制器有足够的按钮来玩你想玩的游戏——例如，某些经典格斗游戏真的无法在双键
    NES 控制器上玩玩！


    ## 警告！


    02 电器产品和锐利物体可能会非常危险。你可能会弄伤自己，或者更糟，弄坏你的玩具。在尝试此项目之前，请确保所有设备都已从电源上。与任何电子项目一样，在接触敏感组件之前，你应该注意完全接地——身体产生的静电可能会损坏它们。使用防静电手环或轻拍几次散热器即可解决问题。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_118_0.png)


    上方你只需几种简单工具即可修改你的控制器


    ## 项目


    ## Xbox Zero 街机


    ## 许多小零件


    在拆解电子产品时，在旁边准备几个小碗或容器。将每种螺丝放在单独的容器中，以免意外混淆。在使用 Xbox 控制器时，你会发现按钮特别有滚掉的习惯，所以也要把它们存放在安全的地方。留意好任何在组装时可能用的塑料或橡胶碎片。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_119_0.png)


    - 右侧 注意在打开控制器时不要丢失任何小零件


    ## 组装


    ### 安装


    03 现在你应该对将要使用的控制器有一个大致的了解了。“大公”具有双摇杆、六个按钮、一个方向键和两个扳机——而且它与大多数复古游戏系统兼容。


    04 如果你使用的是不同的控制器，在拆开之前请双重检查 Pi 是否能放进内部。正如你在这里看到的，Pi 嵌套在此控制器的扳机之间——原始 Xbox 控制器是最大的之一。


    ### 卸螺丝


    05 控制器由六个十字头螺丝固定。打开外壳时这些螺丝是松散的，因为按钮和橡胶触点——会散得到处都是！


    ### 打开


    06 拆除外壳后，你应该能够取出固定主电路板的螺丝。还有几个提供震动电机的连接器——轻轻拨开它们以完全取出电路板。你可能会发现用钳子会更方便——拉动时一定要非常小心！


    ### 慢慢来


    07 你可以亲眼看到 Pi 在这里适配得有多好；它可以被挤到内存卡槽下方。如果你想让它牢固固定在位置，可以使用 BluTak（蓝胶）作为临时解决方案。如果你使用的是较旧的控制器，值得清理一下。取下橡胶触点，并使用异丙酒精棉轻轻擦拭下方。


    ## Xbox Zero 街机 - 项目


    ### 剪切适配


    08 根据控制器的型号，你可能会发现 Pi 挡住了其中一个内部塑料支柱。不过，塑料足够软，用工刀可以轻松将其切成所需尺寸。从小切口开始，每次削掉一点，直到你有足够的空间。在重新组装控制器之前，确保清理掉塑料粉。如果你有一罐压缩空气，可以用它轻松地吹掉碎屑。


    ### 连接


    09 如果你使用的是带有普通 USB 端口的控制器，可以通过 USB 转换器将其插入 Pi。如果你使用的是原始 Xbox 控制器，情况会有点复杂。微软凭借其无限的智慧，决定原始
    Xbox 应该使用 USB——但采用不兼容的接口设计。这意味着，为了将控制器连接到 Pi，我们需要进行一些剥线工作。趣！


    Xbox 控制器线内部的布线使用的是标准的 USB 颜色，一旦你切掉控制器和 OTG 线上的插头，将它们连接在一起就非常简单。


    | 颜色 | 描述 |

    | :--- | :--- |

    | 白色 | 这根线是两个差分数据信号之一。这根线是正极部分，绿色的是 |

    | 红色 | 红线是处理电源的两个线之一。这是一条 5V 电源线，为电路提供电压 |

    | 绿色 | 电路可以获取两个数据信号之间的差异，而不是单根线和地——这更有效的传输 |

    | 黑色 | 这是与电源相关的另一根线——地线，是 5V 线的对应线 |

    | 黄色 | USB mini/micro 线还会有一根对于我们特定项目不需要的额外线 |

    | 左侧* | 较旧的 USB 1.0 和 2.0 线比新的 3.0 线线少——这里有一份快速指南 |


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_120_0.png)


    ## Xbox Zero 街机 - 项目


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_121_0.png)


    上方你只需几种简单工具即可修改你的控制器


    ## 正确的控制器


    ### 布线


    CEX 或 GAME 等二手店经常有这些。问问你的朋友是否有备用的。


    - 10 剥开线并将它们连接在一起。

    - 右侧 注意在打开控制器时不要丢失任何小零件


    上方你可以焊接 OTG 线和控制器，但我们使用了粘胶带固定线——对于更永久的安装，可以使用电胶带。


    ### 绝缘


    - 11 需要注意的是：你需要对 Pi 底部进行绝缘。我们使用了纸板——任何非导缘材料都可以。


    从那里开始，拧回外壳。确保控制器的按钮和摇杆没有错位。记住每根线连接到哪里，你就没问题了。


    ## Xbox Zero 街机 - 项目


    ### 连接


    12 Pi 需要连接三根线才能工作。控制器线需要连接到 USB OTG 端口。HDMI 线从你的电视连接到 Pi 的 mini HDMI 端口。最后，一个
    2A 的 USB 电源插入 Pi 的电源座。我们使用了标准的手机充电器，但如果你想减少房间里拖拽的线，可以使用 USB 电池。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_122_0.png)


    ## 关于电源的说明


    13 你可能在想是否可以通过 HDMI 线从电视向控制器供电。遗憾的是，HDMI 规范并不允许电力向那个方向流动。如果你的电视上有 USB 接口，你可以用它来为
    Pi 供电——只需确保插座本身足够强大。Pi 至少需要 1 安培，理想是 2 安培。许多电视只会输出 500mA，这不足以运行 Pi。


    ## 玩吧！


    14 好了！看起来很不错——你几乎准备好玩了。下一步是在这台机器上安装一些模拟软件。


