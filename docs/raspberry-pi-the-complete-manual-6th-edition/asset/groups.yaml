    # 制作一台树莓派驱动的小车


    ## 项目


    ## 将舵机电缆连接到新控制器


    我们按照说明书焊接了来自 myodpi.com 的 16 通道 I2C 舵机控制器板，并简单地将通道 0（转向）和通道 1（电机）引脚插在上面。我们总共有
    9 个通道；底部两个是地线（ground），中间两个和顶部两个是 PWM（脉冲宽度调制）信号。现在是考虑放置额外组件以及最佳固定方法（使用自粘魔术贴）的好时机。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_108_0.png)


    ## 将 I2C 总线连接到树莓派


    ## 对接到树莓派


    我们正在使用树莓派的 I2C 来控制舵机板，这只需要四根电缆——如图所示，连接在树莓派和舵机板之间。访问 http://bit.ly/N3cnqUJ 查看如何在树莓派上设置
    I2C 的教程。


    在 Rev 1 版树莓派上，电缆看起来是一样的。虽然板子的标记不同，但物理引脚的位置相同。左下角（靠近电源接口）是 3.3V 电源，旁边是 SDA 引脚（数据线），右侧是
    SCL 通道，用于控制 I2C 设备。最后——在右上端口——我们建议打印一张带有标签的 GPIO 引脚图。


    从上到下，我们需要使用 GND、2、SCL、3 和 4、VCC，它们直接映射到树莓派上的舵机端口。本质上，这些电源和地线通信通道。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_108_1.png)


    ## 主要组件概述


    ## 为它找个位置


    你应该将舵机板放在中间，转向和舵机控制器放在一边，速度控制器的另一端（那端）将有更粗电线；速度控制器还有两根通往电机的粗线和一根通往汽车电池——在这种情况下是
    7.2V 镍镉电池。我们现在有了两个完全独立的电源系统，一边是高电流电机，另一边是低电流电子设备。确保它们保持分离。


    我们可以使用大量的自粘魔术贴、扎带来固定所有物品，并在车身上找到空间来固定电线。虽然可以将树莓派直接粘或用螺丝固定在车上，但我们建议至少使用一半的外壳来增加保护并方便取用。插入你的
    SD 卡、网络线或 Wi-Fi 电源。大展你的黑客技巧吧！


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_108_2.png)


    ## 控制你的树莓派驱动小车


    ## 你需要...


    - 一辆已准备就绪的树莓派小车

    - 网络连接

    - 一个相当现代的智能手机/平板电脑

    - Pi 源码

    - github.com/shaunik/picar


    ## 控制你的树莓派驱动小车


    使用智能手机和最新的 Web 技术控制玩具车


    现在我们奇妙的树莓派驱动小车已经全部接好、充好电并准备就绪，是时候让它动起来了。我们正在使用 JavaScript 编程语言提供的最佳技术，利用你手的自然动作来无线驱动车辆。


    > 你知道吗...

    > 我们的代码每秒会向小车发送超过 20 次指令。驾驶起来会非常灵敏！


    - 你手的每一个微小动作都会触发一个事件，计算小车应该做什么，然后通过 socket 连接发送。如果一切进展顺利，你将对车辆拥有完全控制权！


    ## 下载并安装软件


    01 首先，你需要为新项目代码准备 I2C 连接——建立在 `/var/www/picar` 如何？在终端中输入 `sudo mkdir /var/www/picar`
    创建目录并进入该目录：`cd /var/www/picar`


    现在，使用 Git 下载项目，输入 `git clone http://github.com/shaunik/picar`。如果没有安装 Git，请使用 `sudo
    apt-get install git` 安装。这将下载用于驱动的自定义软件，但在开始之前我们还需要 Web 服务器和其他部分...


    以下是你完成项目时需要访问智能手机或平板电脑


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_109_0.png)


    ## 树莓派驱动小车项目


    ## 下载并安装 Node.js


    ## 配置 Node.js


    接下来我们使用 Node.js 及其包管理工具 Node 包管理器 (npm)。输入 `sudo wget http://nodejs.org/dist/v10.21/node-v1.21-linux-arm-pi.tar.gz`。这将下载一个较新的
    Node.js 版本——树莓派仓库中的版本太旧，无法运行我们即将使用的技术。通过输入解压包。为了方便在任何地方运行，我们将为 Node 创建符号链接：


    ```

    tar -xzzf node-v10.21-linux-arm-pi.tar.gz

    ```


    为了方便在任何地方运行，我们将为 Node 创建符号链接：


    ```

    sudo ln -s node-v10.21/bin/node /usr/local/bin/node

    sudo ln -s node-v10.21/bin/npm /usr/local/bin/npm

    ```


    ## 让项目运行起来


    以下是你完成项目时需要访问智能手机或平板电脑


    ```

    npm install

    ```


    ## 配置默认设置


    以下是你完成项目时需要访问智能手机或平板电脑


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_110_0.png)

    '
