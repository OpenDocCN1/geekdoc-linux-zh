    Unbelievably, the Raspberry Pi Model A+ is just 23g (0.81 oz), a reduction in
    weight of almost 50 per cent!


    ## Raspberry Pi Zero


    ### Getting started


    The tiny £4 computer has taken the world by storm, but what''s changed?


    Coming in a size smaller than a credit card, the Pi Zero is certainly impressive
    to behold. However, its size does not mean a scale back in performance. The Zero''s
    1Ghz, Single-core CPU and 512MB RAM has this board running 40% faster than the
    original Pi.


    To achieve such a small form and low production costs, the creators stripped back
    a lot of ports we have come to expect. With only saving micro and mini ports remaining,
    no Ethernet in sight, adapters of various kinds will play a vital role in more
    demanding projects. By ensuring every component is justified in its existence,
    the Pi Zero is incredibly versatile. Its capability to run full images such as
    Raspbian, jumping into a project is as simple as ever.


    The minimalism of the Zero lends itself perfectly to running in a headless setup,
    add a Wi-Fi dongle and you can use SSH to control it, making the most of that
    single USB port.


    ### New mini HDMI port

    You you will need an adapter to make use of this port. Or still, go headless and
    install your own OS image.


    ### MicroSD card

    This is the same as the newer Model A+, meaning you can swap in an existing card
    to be up and running in seconds.


    ### Unpopulated GPIO header

    With an identical pinout to the Model A+/B+, headers can optionally be soldered
    on yourself, making the Zero HAT compatible.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_10_0.png)


    ### Micro USB port

    The shortage of ports means a USB hub and an adapter will be more important than
    ever to connect things such as the keyboard or Wi-Fi adapter.


    ### Minimal connectors

    No Ethernet or audio port and no camera or display connector. However unpopulated
    composite video and reset headers are still available.


    ### Smaller than a credit card

    Measuring at 65mm x 30mm x 5mm the Zero comes in a tent of the model B''s overall
    footprint.


    ### The starter kit

    There''s more to your Pi than first meets the eye.

    Here are some virtual peripherals to get you started.


    ### Power cable

    The Raspberry Pi uses a standard micro USB connector for its input, which one
    end can be plugged into your desktop. An Android phone charger should also work
    (5.25V 1500mA).


    ### Case

    Securing the Raspberry Pi in a case will protect the delicate GPIO pins from actually
    damage. A case can also make your Raspberry Pi more attractive or striking unit.
    Ensure you choose the right case for your Raspberry Pi.


    ### Video output

    There are two video output ports, a HDMI port and an RCA Socket. HDMI is the primary
    video-output connector for most users, but the RCA video-out port can also be
    used to connect TVs, monitors or a SCART port. Remote access to your Raspberry
    Pi is also possible via SSH or VLC.

