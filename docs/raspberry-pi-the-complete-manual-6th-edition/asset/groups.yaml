    # Code & create with your Pi!


    # Raspberry Pi 3

    A supercharged Raspberry Pi that finally does everything you’d want it to, for
    the same price as the previous models. While the Raspberry Pi has enjoyed years
    of success, there’s always a couple of users wanted. A slightly more powerful
    CPU that could handle day-to-day computing, more USB ports and wireless to make
    connecting to the network easier. The Raspberry Pi 3 solves these problems. As
    it uses the same board design as the Model B+, it has four USB ports, opposed
    to the two that were on the original Raspberry Pi B. More importantly, it has
    a much more powerful processor and more RAM, making it faster than the original
    Pi. The Pi 3 also has built-in wireless capabilities, which makes connecting to
    Wi-Fi and Bluetooth a cinch. The new BCM2837 chip is the heart of the Raspberry
    Pi 3, a modified version of the BCM2836 chip from the old Pi 2. The quad-core
    900 MHz processor has been powered up to a 1200 MHz beast, which helps to make
    the Pi 3 a more functional board. Whereas before you might have problems surfing
    the internet or writing a document, now the Pi 3 breezes through these tasks with
    ease and plenty of processor power to spare. At heart, it’s still the same board
    as the Raspberry Pi B+. As well as the aforementioned USB 2.0 ports, the Ethernet
    port for wired internet, a good-quality 3.5mm headphone jack for sound, a HDMI
    port for digital video and audio and a 40-pin GPIO port. This expanded GPIO port
    is fantastic for making your physical projects even more involved and complicated
    to do far cooler things. For those worried about compatibility, all your old files
    and projects just work like on the Raspberry Pi 3, and all you need to do is transfer
    them over like any normal files.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_7_0.png)


    # GPIO port

    The 40 pins in the GPIO port give you a range of power and function slots to control
    a project or read data from your surroundings. This makes the Raspberry Pi perfect
    for an Internet of Things or Maker project.


    # USB ports

    The four USB ports give you much more flexibility with the Raspberry Pi 3, allowing
    you to add a keyboard, mouse, wireless dongle and extra storage needing to constantly
    switch out or get a powered hub.


    # Ethernet port

    The Pi 3 retains the wired network and internet connection that was on the Model
    B of the original Raspberry Pi. It still supports up to 100 Mbps, fast enough
    for the Raspberry Pi B+.


    # Integrated wireless

    The big update brought in the Raspberry Pi 3 is the introduction of fast-802.11n
    wireless LAN and Bluetooth. Connecting to the Internet and other devices has never
    been easier


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_8_0.png)


    # Headphone jack

    Need to listen to your Raspberry Pi privately? Connect to a pair of portable speakers!
    The 3.5mm jack is still on the Pi 3 and is one of the higher quality units that
    was added to the B+.


    # MicroSD

    Underneath the board is where the boot medium lives - the microSD card. Much smaller
    than the SD card it still hides the full operating system and allows the Pi 3
    to be much smaller.


    # HDMI port

    The Raspberry Pi''s special ability is to decode 1080p video on the fly with little
    problem, and the same tech still exists in the Pi 3. The HDMI port is basically
    the same, allowing for high definition video and audio.


    > "The Raspberry Pi 3 still won''t be able to power a USB hub, so if you need
    to expand the complement you''ll need to get a powered-hub"


