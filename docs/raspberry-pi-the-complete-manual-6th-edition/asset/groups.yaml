    ## Build a Raspberry Pi-powered car


    ## What you''ll need...


    - A toy RC car with two channels (steering and drive)

    - Adafruit PWM I2C servo driver

    - Female-to-female jumper cables

    - 5V battery power bank

    - Estimated cost: £60 / $100

    - Components from www.modmypi.com


    Make use of cutting-edge web technologies to take control of a remote controlled
    car with a smartphone or tablet...


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_105_0.png)


    ## Build a Raspberry Pi-powered car


    ## Projects


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_106_0.png)


    > Did you know...


    You can make this project work with just any remote controlled car. Follow the
    guide for more details.


    Web technologies are moving forward at a huge pace, cloud technologies are bringing
    mass computing to individuals, and hardware has reached a perfect moment in time
    where sensors, displays and wireless technology have all evolved into efficient
    and affordable devices. We truly are at a point where nearly anyone can take an
    idea from nothing to a working product in a week and at very little cost. Just
    like this project, which is fun, quick and easy to build on and a fantastic way
    to learn. We''re going to go on an old remote-control car, rip off its radio receiver
    and replace it with the Raspberry Pi, hook it up to the network, fire up a bleeding-edge
    web server and then get your smartphone or tablet to control it by tilting the
    device. By the end of this, not only will you have a toy, you will have learnt
    about the basic technologies that are starting to power the world''s newest and
    biggest economy for the foreseeable future.


    ## Raspberry Pi-controlled car build process


    To help our toy car come to life using the latest web technologies and our credit
    card-sized computer, we''re going to make some pretty significant changes to its
    workings. Fortunately, the most complex aspects of the build can be accomplished
    with a couple of affordable purchases, namely a servo controller to take care
    of the steering and throttle, and a 5V battery pack to keep the Raspberry Pi running
    smoothly.


    ## Identify and remove old radio


    01 This project is effectively replacing the car''s normal transmitter and receiver.
    Notice the three sockets on the original receiver: one goes to the motor controller
    and one to the steering servo. Some remote-control cars also separate battery
    for the electronics, but those (especially with an electronic speed controller
    with BEC) get their 5V power supply directly from the speed controller, saving
    on components. If you don''t have a speed controller with BEC, you''ll need to
    get a 5V elsewhere. Many shops sell 5V power supplies – often as mobile phone
    top-ups. www.modmypi.com sells a suitable 5V battery pack for under £20 and you
    should get a couple of hours of use from your Raspberry Pi.


    ## Power up


    This 5V battery pack keeps our Raspberry Pi running for a few hours.


    ## Servo control


    Adafruit PWM12DC servo-driver board from www.modmypi.com


    ## Pi-powered


    The Raspberry Pi sits front and centre to keep it as safe as possible


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_107_0.png)


    ## Pick a car


    You can use pretty much any affordable car for this project

