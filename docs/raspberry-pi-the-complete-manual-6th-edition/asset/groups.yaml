    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_40_2.png)


    图 3：Win32 Diskager 备份整个操作系统


    ## Windows


    要在 Windows 上创建克隆，你可以使用 Win32 Diskager（图 4）。安装后，插入 SD 卡并启动它..为镜像命名并从列表中选择 SD 卡。现在点击
    Read，它将显示进度。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_40_3.png)


    图 4：Win32 Diskager 备份整个操作系统


