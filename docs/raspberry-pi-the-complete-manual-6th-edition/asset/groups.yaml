    ## 通过 SSH 访问你的文件


    使用家用电脑的终端快速、安全地访问你的树莓派（Raspberry Pi）。


    虽然我们在之前的页面中已经演示，登录完整的 X 环境非常有用，但它也有它的缺点。首先，这种操作并不特别快速或方便。用户体验可能会缓慢且繁琐，最糟糕的是，它的安全性并不如我们希望的那样。


    如果你想从另一台计算机通过更方便、更安全的方法访问你的树莓派，你会发现所有精通的树莓派爱好者都使用 SSH。SSH 代表 Shell（外壳），是一种加密网络协议，旨在通过命令行确保安全的数据通信。虽然初学者可能会认为使用完整的图形界面来远程访问他们的树莓派更简单，但只要你学习了一点基本的命令行技术，你很快就会发现通过
    SSH “切入”你的树莓派是与远程通信最方便的方式。


    你会高兴地听到，SSH 已经默认配置好了——你只需要做非常少就能让它运行，特别是当你的远程计算机运行 Linux 或 OS X 时（正如我们在这里要演示的那样）。


    ## 在 Linux 和 OS X 上使用 SSH 非常简单


    假设你的树莓派已启动并连接到网络（以太网或 Wi-Fi 适配器），你唯一的信息是树莓派的 IP 地址。要发现它，你只需要在树莓派上打开终端窗口并输入命令 `ifconfig`（图
    1）。


    如果你通过以太线连接，你会看到‘eth0’以及几行结果。IP 地址将是第二行‘inet addr’ 旁边的数字。如果你通过 Wi-Fi 连接，


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_45_0.png)


    图 1：在终端中使用 ifconfig 命令发现你树莓派的 IP 地址


    ## 你需要...


    - 任何树莓派发行版 (www.raspberrypi.org/downloads)

    - 互联网连接

    - 第二台电脑


    > 你知道吗...

    > SSH 是远程访问任何机器最安全的方法。它也比 VNC 更快。


    ## 项目


    结果将显示在 ''wlan0'' 的第二行。IP 地址本身是由四组用句号分隔的数字组成。如果你在家庭网络中，它可能类似于 192.168.0.15。我们将在指南中使用这个数字，但请将其替换为你通过
    ifconfig 看到的 IP 地址。


    有了这些信息后，你只需要在你的远程 Linux PC 上打开一个终端窗口并输入：


    ```bash

    ssh pi@192.168.0.15

    ```


    这假设你的树莓派用户名是默认的（即 pi），并且你将 IP 地址替换成了你记录的那个。如果你添加了用户账户或更改了默认设置，你需要在 ''@'' 之前将用户名替换为你所更改的内容。当你按下回车键时，系统会提示你输入树莓派的密码——同样，如果是默认密码，你可以输入
    raspberry，否则输入你树莓派的密码并按回车。


    你会看到命令行上的用户名详情已发生变化，反映了你树莓派的信息——你现在已经连接上了。尝试浏览你的文件或使用 nano 打开一个文件进行编辑！


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_46_0.png)


    ## 在 Windows 上使用 SSH


    就像 Windows 世界中的大多数事情一样，你运行微软操作系统的树莓派并没有你想象的那么简单。坦率地说，有一个实用的工具可以帮助。Putty 允许你连接到
    SSH 会话，而且容易设置和使用。你可以在这里下载 Putty：www.chiark.greenend.org/~sgatham/putty


    ## 再也不需要 IP 地址了


    当然，如果你将树莓派带到另一个网络，你树莓派的 IP 地址将会不同。如果你只是想远程连接它，通过键盘、鼠标和显示器来设置树莓派只为了获取 IP 地址将变得极其疲惫。直接在终端中输入树莓派的名字来连接不是更好吗？这听起来好得有些不可真实，但实际上很容易做到。


    你只需要一个小小的软件，它可以允许你通过名称而不是 IP 地址发现本地网络上的主机和服务器（图 2）。要在你的树莓派上设置它，打开终端并输入：


    ```bash

    sudo apt-get install avahi-daemon

    ```


    一旦安装完成，通过 SSH 访问你的树莓派只需要在终端中输入以下内容：


    ```bash

    ssh pi@raspberrypi.local

    ```


    此外，当你通过任何其他形式的网络访问它时（无论是 Samba、VNC 远程登录还是其他任何方式），你都可以使用树莓派的名字！


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_46_1.png)


    图 2：Avahi 工具允许你通过名称通过 SSH 登录树莓派，而无需发现它的 IP 地址


    ## 使用 Scratch 编程


