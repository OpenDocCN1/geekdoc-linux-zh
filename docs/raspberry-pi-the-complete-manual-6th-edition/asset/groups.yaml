- md: "\n# Projects\n\n# Time-lapse camera trigger\n\n# What you'll need...\n\n- Latest\
    \ Raspian Image\nwww.raspberrypi.org/downloads\n\n- Breadboard\n- Connectors\n\
    - Jumper wire\n- DSLR camera\n- Compatible shutter cable\n\n# Time-lapse camera\
    \ trigger\n\nMake shooting time-lapse video with your DSLR camera in a cinch with\
    \ our expert advice\n\nYou'd be forgiven for thinking that creating mesmerising\
    \ time-lapse videos like those of Vincent Laforest (www.laforetvideos.com) or\
    \ John Eklund (theheartoftimelapse.com) might be out of reach of the Average Joe.\
    \ With the help of the Raspberry Pi and a sprinkling of Python code, that's no\
    \ longer the case. In this guide we're going to trigger our DSLR camera to create\
    \ pixel-perfect time-imagery.\n\n# Set up the Raspberry Pi\n\n01 For this tutorial\
    \ we're using a build of Raspberry Pi. The Raspberry Pi set up with a keyboard,\
    \ mouse and monitor, open the terminal and type:\n\n```\nsudo apt-get update\n\
    ```\n\n# Install the R.GPIO library\n\n02 Next we want to make your environment\
    \ is set up. Follow these steps to make sure you're all set. In the terminal,\n\
    \n```\nsudo apt-get install python-rpi.gpio\n```\n\n# Set up the Pi Cobbler\n\n\
    03 For this tutorial we've used a prototyping breadboard and an Adafruit Pi Cobbler\
    \ to give us easy access to the Raspberry's pins. As you can see from the picture,\
    \ the Cobbler stabilizes the centre-point of the breadboard and a ribbon cable\
