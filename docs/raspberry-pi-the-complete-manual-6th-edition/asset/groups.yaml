    # Preparing for smart home hardware


    # Build an iBeacon


    # Weather-proof your PiBeacon


    Although adding to smart homes, the PiBeacon isn''t an instant miracle. While
    you might want to use it to open your garage door — perhaps with an MQTT command,
    not once it comes into close proximity — without the right mechanical hardware
    connected to your Raspberry Pi, this sort of functionality simply won''t be possible
    to achieve. Similarly, you''ll need to employ suitable hardware to allow your
    PiBeacon to switch on and off connected devices, such as a lamp. The PowerSwitch
    Tail II is such a device, and ships with jumper connectors for hooking it up to
    your Raspberry Pi GPIO.


    15 Smart home projects using iBeacon technology might need a bit of weatherproofing.
    This might mean secreting your Raspberry Pi inside a suitable all-weather case,
    for example, or placing it somewhere, away from the elements. Additionally if
    no power supply is available, you''ll need to add a battery pack. You may consider
    a portable USB power supply, or prefer to use a DIY solution, as demonstrated
    in L&D issue 15. This explains how to power your Raspberry Pi with AA batteries,
    and covered the inclusion of a UBEC, a voltage regulator that protects the Raspberry
    Pi from being damaged by the batteries.


    # PiBeacon, low profile


    17 Thanks to the fact that a PiBeacon project really only needs a power supply
    and Bluetooth BLE dongle, you can rely on the less-featured or popular Raspberry
    Pi for any PiBeacon projects. If you have an old Model A or Model A+ laying around
    home, this would be ideal. And if you''re fortunate enough to have bagged a Raspberry
    Zero for just £4, this too would be suitable. Using a USB to micro-B USB adaptor,
    which would then be connected to the Pi Zero''s micro-B USB for data port.


    Below Conveniently, this project is compatible with pretty much every Pi, including
    the Pi Zero


