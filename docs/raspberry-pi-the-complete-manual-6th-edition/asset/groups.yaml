    # Back up your Pi


    Take the initiative and back up your Raspberry Pi to make sure you never lose
    files again


    While the Raspberry Pi is a very solid piece of kit, failure can happen, so it''s
    best to be well prepared and keep your files safe.


    The good news is that the Pi''s files are all external on the SD card. If your
    Pi breaks, everything will be available on the SD card and accessible from elsewhere.
    The SD card is still susceptible to problems, though. There are a number of ways
    to back up a Pi. The methods can be broken down into two main categories: saving


    > Did you know...

    SD cards don''t last forever so make sure you''ve got a backup of your files and
    your entire OS.


    the important files and creating an exact copy of the state of the SD card. The
    former involves having copies of files elsewhere, while the latter has you create
    the same kind of image that you''d normally write to the SD card when installing
    Raspberryian or other Pi-operating systems.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_39_0.png)


    # Important files


    To save important files, we need to create a copy on an external source, such
    as external hard drive or another PC. One of the best methods to this doesn''t
    involve a Pi; all you need is a PC or laptop with a card reader and you''re good
    to go.


    Turn off your Pi, unplug it and remove the SD card from the slot. Find the SD
    card reader on your PC and slot it in. The main file system of the SD card can
    be read by Linux PCs by default, and a Windows or Mac once you''ve installed a
    program that can read the file system, such as Ext2fs. On Windows, the SD card
    will be listed with the rest of the drives under My Computer (Fig 1). On Linux,
    it will be listed wherever storage is shown on the menus and file managers.


    Once you''ve found the SD card on here, open it up and navigate to home then Documents,
    Downloads, Desktop and other directories can be found. All you need to select
    the files you want to copy and move them to a secure directory on your PC or a
    connected external hard drive.'
