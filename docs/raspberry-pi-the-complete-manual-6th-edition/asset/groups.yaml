- md: "\n## Make a Pi 2 HTPC Projects\n\n## Install to card\n\nOpen the terminal and\
    \ use fdisk -l to determine where your SD card is located on your system. Something\
    \ like /dev/sdb or /dev/mmcblk0 will be. Navigate to the image using cd and install\
    \ it with dd command:\n\n```\n$ dd bs=4M if=OpenELEC-RP12-arm-5.0.5.img of=/dev/mmcblk0\n\
    ```\n\n## First boot\n\nPlug in your Raspberry Pi, either to another screen or\
    \ TV to begin, and turn it on. OpenELEC will resize the SD partitions and write\
    \ a few extra programs before booting Kodi.\n\n## Configure Kodi\n\nGo through\
    \ the basic wizard to get through the interface — if you are connecting wireless\
    \ you will need to go to OpenELEC in the System menu and activate your network\
    \ receiver before entering your password.\n\n> \"It's a great use for the Pi -\
    \ it works well enough that you can easily play media locally or over the network\"\
    \n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_80_0.png)\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_80_1.png)\n\
    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_80_2.png)\n\n## Add network shares\n\n\
    Placement of your Raspberry Pi is important. It's going to be out all the time,\
    \ we recommend getting a case for it — the PiBox cases from Primoroni are quite\
    \ suited for this type of use as they are sturdy and can be attached to the rear\
    \ of some TVs.\n\nYou can attach a portable hard drive or USB stick to the Pi\
    \ for storage, but it is really easy to stream under System. Go to File under\
    \ System and Add source. Go and choose your network protocol to browse the network\
    \ or alternatively, add it manually.\n\n## IR sensors and remote\n\n## Future\
    \ updates\n\nKodi can be controlled with a number of different things — USB game\
    \ controllers and compatible IR sensors. We used FLIRC in the past, but if you\
    \ have your Pi by the TV, you will need a sensor on a wire that stretch to a useful\
    \ position.\n\nOpenELEC has the excellent ability to update itself without needing\
    \ to reinstall every few months, meaning you won't need to do much maintenance\
    \ on it all. Now you can relax and enjoy your media much easier than before.\n\
    \n## Print wirelessly\n\nWhat you'll need...\n\n- Latest Raspian image\n- USB\
    \ printer\n- USB wireless card\n\n## Print wirelessly with your Pi\n\nBreathe\
    \ new life into an old printer by using your Raspberry Pi as a wireless printer\
    \ server\n\nWireless printing has made it possible to print to devices stored\
    \ in cupboards, sheds and remote rooms. You don't have to own a shiny new printer\
    \ for this to work; old printers without native wireless support don't have to\
    \ end up in the bin, thanks to the Raspberry Pi.\n\nThe setup is simple. With\
    \ your Pi set up with a wireless USB dongle, connect your printer to a spare USB\
    \ port on the computer. With Samba and CUPS (Common Unix Printing System) installed\
    \ on the Raspberry Pi, all that is left to do is to connect to the wireless printer\
    \ from your desktop computer, install the appropriate driver and start printing.\n\
    \nCUPS gives the Raspberry Pi a browser-based admin screen that can be viewed\
    \ from any device on your network, enabling complete control over your wireless\
    \ network printer.\n\n> Setting your Raspberry Pi to print wirelessly is a great\
    \ way to get rid of annoying cables at your workstation\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_81_0.png)\n\
    \n## Print wirelessly\n\n## Check your printer works\n\n## Join a Windows workgroup\n\
    \nBefore starting, check that the printer you're planning to use for the project\
    \ still works and has enough ink. The easiest way to do this is to check the documentation\
    \ (if you can't find the manual) and run a test print.\n\nWith these additions\
    \ made, search for 'workgroup' in the configuration window and set it all your\
    \ workgroup:\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_82_0.png)\n```\nworkgroup\
    \ = your_workgroup_name =\nsupports = yes\n```\nMake sure to uncomment the second\
    \ setting so that the printer can be seen from Windows. Next, save your changes\
    \ and restart Samba:\n```\nsudo /etc/init.d/samba restart\n```\n\n## Detect your\
    \ printer\n\n## Install Samba and Cups\n\n- With your Raspberry Pi set up as the\
    \ printer connected to USB port\n- Install Samba on your Pi to enable file print\
    \ sharing across the network\n- This will confirm that the printer has been detected.\
    \ In many cases you should see the manufacturer and model.\n- sudo apt-get install\
    \ samba\n\nNext, install Cups:\n```\nsudo apt-get install cups\n```\nWith a server\
    \ created, configure by adding default user 'pi' to the admin group:\n```\nsudo\
    \ usermod -a lp pi\n```\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_82_1.png)\n\n\
    ## Set up printer\n\n## Add your printer\n\n- Set up the CUPS admin in the GUI\
    \ and launch browser, entering 127.0.0.1:631. Switch to Administration, ensuring\
    \ that 'Share printers' boxes are enabled. Select Add Printer and proceed to enter\
    \ your username and password.\n- A list of printers is displayed, select yours\
    \ to proceed to the next screen where you confirm the details, add a name and\
    \ select the appropriate drivers from the list.\n\n## Access your printer\n\n\
    Meanwhile it's all easier to access your wireless printer from Linux, Mac or other\
    \ Unix-like systems to Cups. All you need to do is install the network printer\
    \ in the usual way and your device will be deployed.\n\n## Add Print compatibility\n\
    \n## Configure Samba for network printing\n\nUsing configuration for Samba? Open\
    \ '/etc/smb.conf' in nano, search (Ctrl+W) for 'printers' and find 'guest ok'\
    \ which you should change: It is also possible to print from iPad using Apple's\
    \ AirPrint system. To do this, you need to install the Avahi software:\n\n- guest\
    \ ok = yes\n\nNext, for the path as follows:\n- path = /usr/share/cups/drivers\n\
    \nYour wireless printer will now be discoverable from your iPhone or iPad and\
    \ will be ready to print.\n\n## Projects\n\n## Build a voice synthesizer\n\nAdd\
    \ the power of speech to your Raspberry Pi projects with the versatile eSpeak\
    \ library. We've shown how the Raspberry Pi can be used to power all kinds of\
    \ projects, but as a tiny computer it can be the centre of Internet Things in\
    \ your house. For these reasons and more, using the Raspberry Pi for text-to-voice\
    \ commands could be just what're looking for. Due to the Debian base of Raspian,\
    \ the powerful eSpeak library is easily available for anyone looking to make of\
    \ it. There's also a module that allows you to use eSpeak in Python, going beyond\
    \ the command-line prompts so you can perform automated tasks.\n\n## Did you know...\n\
    \nUsing eSpeak you can control the ways words are spoken to add emphasis or make\
    \ the voice sound different.\n\n## Pi's first words\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_83_0.png)\n\
    \nThe eSpeak library is pretty simple to use – to get it just saying something,\
    \ in the terminal:\n\n```\n$ eSpeak \"[message]\"\n```\nThis will use the library's\
    \ defaults to what is written in, with decent clarity. Though this simple command\
    \ is fun, there's much more you can do...\n\n## Say more\n\n## Everything you'll\
    \ need\n\n03 You can change the way eSpeak will read text with different options,\
    \ such as gender, rate speed and even the way it pronounces syllables. For example,\
    \ writing the command like:\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_83_1.png)\n\
    ```\n$ eSpeak -venf3 -k5 -s150 \"[message]\"\n```\nwill turn the voice female,\
    \ emphasise capital letters and make the reading slower.\n\n01 We'll install everything\
    \ we plan to use in this tutorial at once. This includes the eSpeak library and\
    \ the Python modules we need to show off. Open the terminal and install with:\n\
    \n```\n$ sudo apt-get install espeak python-speak python-tk\n```\n\n## Build a\
    \ voice synthesizer\n\n## Take command with Python\n\n## Full code listing\n\n\
    The most basic way to use eSpeak in Python is to use subprocess. Import it, then\
    \ use: subprocess.call(['espeak','Option 1'),('Option 2'],['option nj','Your message\
    \ here'])\n\nImport the necessary eSpeak and GUI modules, as well as the module\
    \ to find out the time:\n\n```\nfrom espeak import speak\nfrom Tkinter import\
    \ *\nfrom datetime import datetime\n```\n\n```python\ndef hello_world():\n   \
    \ speak.synth(\"Hello World\")\n```\n\nDefine the different functions that the\
    \ interface will use including a fixed message, telling the time and a custom\
    \ message:\n\n```python\ndef time_now():\n    t = datetime.now().strftime(\"%H:%M\"\
    )\n    speak.synth(\"The time is %s\"%t)\n```\n\n```python\ndef read_text():\n\
    \    text_to_read = input_text.get()\n    speak.synth(text_to_read)\n```\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_84_0.png)\n\
    \nCreate the basic window with Tkinter for your interface, as well as creating\
    \ the variable for text entry:\n\n```\nroot = Tk()\nroot.title(\"Voice box\")\n\
    input_text = StringVar()\nbox = Frame(root, height = 200, width = 500)\nbox.pack_propagate(0)\n\
    box.pack(padx = 5, pady = 5)\n```\n\n## The native tongue\n\nThe eSpeak module\
    \ is quite simple to use speech. Try to convert your sample code:\n\n- from eSpeak\
    \ import speak\nspeak.synth(\"[message]\")\n\nYou can incorporate this into Python,\
    \ like you would any other module, for automation.\n\nThe text entry appends to\
    \ the created variable, and each button calls a function defined above in the\
    \ code:\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_84_1.png)\n\n## A voice synthesiser\n\
    \nUsing the code listing, we're creating a simple interface with Tkinter with\
    \ some buttons and a custom method. We showing how the eSpeak module can be manipulated\
    \ to change its output. This is useful for reading tweets or automated messages.\
    \ Have fun!\n"
  mdcn: "\n\n## 制作 Pi 2 HTPC 项目\n\n## 安装到卡\n\n打开终端并使用 `fdisk -l` 确定你的 SD 卡在系统中的位置。通常类似于\
