  - "[PAGE 31]\n\n# Getting started\n\nInstall and use packages\n\n# What you'll need...\n\
    \n# Install and use packages\n\nApt command help page:\n\nhttp://linux.die.net/man/apt\n\
    \nApt-get help page:\n\nhttp://manpages.ubuntu.com/manpages/lucid/man/apt-get.html\n\
    \nThe Raspberry Pi is great, but it's made better with the software you install\
    \ onto it\n\n> Did you know...\nIf you press the Tab key command line will attempt\
    \ to auto-complete your command for you—just press Enter to finish.\n\nOn its\
    \ own, the Raspberry Pi is a near-perfect mini computer. It already contains a\
    \ wealth of educational software, a few games, some programming utilities and\
    \ a number of system tools. But, as with most computers, this is only the tip\
    \ of the proverbial iceberg. By installing more programs, you can do much more.\n\
    \nThese programs, known as packages, are as wide and varied as the developers\
    \ who originally designed them. In Linux, if there's a need for a particular program,\
    \ someone develops one. They put it out to the world and make the source code\
    \ freely available, hence ‘open source’. Once the program has been tested, it\
    \ will eventually make its way onto one of the many remote servers for that particular\
    \ Linux distro.\n\nThese remote servers, called repositories or repos, contain\
    \ all the elements of the package in order for it to be downloaded and installed\
    \ onto your system. The process is very quick and easy once you know how it's\
    \ done...\n\n```\npi@raspberrypi / $ sudo apt-get\n      (_)\n     (oo)\n    /\
    \ ----\\\\\n   *  \\\\--\\/\\\n      ~~~\n.... \"Have you mooed today?\"....\n\
    ```"
