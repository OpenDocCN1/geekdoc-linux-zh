    and FAT32 from the drop-down menu.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_20_1.png)


    01 One of your first questions may be "where can I find operating systems to download?"
    Most of the images can be found on the main Raspberry Pi site: http://www.raspberrypi.com/software.
    These are stable and well tested systems worth investigating.


    # Obtaining OS


    # OS Format


    03 Within the zip you''ll find a .img or .iso file. These are the equivalent of
    a Snapshot of an CD or DVD. Simply copying the file to the SD card won''t do,
    you''ll need to use a program to extract it.


    # Using the terminal


    06 If you are using OS X or Linux, you''ll have to use the terminal to copy the
    image. In OS X, the terminal app comes with by default, and most Linux versions
    come with one form or other. It may be referred to as ''console'' or ''command
    line''


    # Unzipping


    02 When you''ve unzipped your image, the first thing you''ll most likely need
    to do is unzip it. This can be done in Windows by clicking and extracting. ''In
    OS X, double click to extract the file''


    # SD card format


    04 The SD card you''ll need to be blank, make sure there is nothing on it first.
    You''ll need to format it to use the FAT32 file system. This is a common system,
    used by most USB sticks and cameras.


    # DD command


    07 The command you need to use is called dd. This is entered in the format of
    ''dd bs=4m if=[image] of=/dev=[sdcard]''


    ```

    sudo dd bs=4m if=/home/user/downloads/raspberrypi-os/arch-linux-pi-2013-02-11.img
    of=/dev/disk1

    ```


    # Win 32 Disk Imager


    08 Windows users can use Win32 Disk Imager Once you''ve downloaded the tool, simply
    click on the .exe, and run as administrator and follow the prompts. When the installation
    is complete you can put the SD card in your Pi Easy!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_20_2.png)


