    # Command line basics


    ## Getting started


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_22_0.png)


    ## A new world


    Getting your Raspberry Pi into the desktop isn''t the only thing you can do on
    the command line, though. There''s a world of functionality built into the command
    line, in fact, most of the graphical programs you are just using these commands
    in such a way. You don''t have to leave the comfort of the desktop environment
    to perform these commands either, as Raspberry Pi operating systems will come
    with an application known as a terminal emulator.


    This creates a window where a command can be written in the same way that we launched
    the desktop, and use the exact commands (Fig 1). On Raspberry, look for the app
    LX Terminal in the Accessories of the menu and click on it. If you''ve had to
    use start to get into the desktop, then we can now fix that before continuing.
    In the terminal, enter:


    ```

    $ raspi-config

    ```


    Here''s the initial setup (Fig 2). From here you can enable the desktop on boot
    (Fig 3), and even update the firmware and add support for the official Raspberry
    Pi camera module. This allows you to modify Raspberry without having to restart
    again.


    You won''t be using those commands very often, so is there practical use for delving
    into the command line? Very much so. For starters, Raspberry doesn''t have an
    official package manager. This is a program that allows you to browse the available
    software for the operating system, similar to the Pi Store.


    However, there''s other software to Raspian that you can''t get through the store.
    You also can''t specifically update the Pi software either, and all of this can
    be fixed using the command line.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_22_1.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_22_2.png)


    ## Getting started


    pi@raspberry:~


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_23_0.png)


    ## Software for all


    The first thing you want to do is let Raspbian know exactly what''s available
    online. It''s a simple task: all you need to do is:


    ```

    $ sudo apt-get update

    ```


    This will run down a list of online repositories (or repos) that contain the software
    Rasp uses. Once it''s finished, the command-line will pop up waiting for your
    next command. As this is the first time you''ve done it, you''ll likely need to
    update the current software on your Raspberry Pi. You can do that with the command:


    ```

    $ sudo apt-get upgrade

    ```


    It may ask you to confirm the upgrade, in which case type ''y'' and then press
    Enter. What we''re doing here is using the command-line package manager Aptitude
    (apt-get) to first check the repos, and then upgrade packages according to (Fig
    4). The first command, allows it to run the apt-get task as administrator, and
    is used in one of other command-line operations.


    To install software you use **install** instead of update or upgrade, followed
    by the name of the package. For example, with the mathematical programming language,
    you can install it with:


    ```

    $ sudo apt-get install wolfram-engine

    ```


    > Did you know...

    > You can use the Tab to complete commands. Just start typing and hit tab. If
    you like what you see here! Enter to finish!


    ## Command line basics


    ## Getting started


    ## Move and create


    Installing and updating are just a couple of the things you can do in the command
    line. You can also browse the entire file system, move files, create folders and
    delete items. All of these are free simple operations.


    When you first open the terminal, it will open up in your home folder. While you
    can''t specifically tell that it is, you can display what kind of files are in
    the directory (Fig 5):


    ```

    $ ls

    ```


    The tilde (~) is used to denote the home folder and can be used for navigating
    around the file system. To navigate, we will use the cd command, followed by the
    location you want to move to. This can be done like:


    ```

    $ cd /home/pi/Downloads

    ```


    This will move you to the Downloads directory. As we were starting off in the
    home folder to begin with, actually need to do this: it''s context sensitive and
    knows to look in the directory it''s already in. There''s another trick you can
    use so don''t have to remember the exact name of the path – the command line or
    terminal will try to autocomplete the phrase if you press the Tab key while something
    is partially typed.


    Finally, there are some quick commands you can use to manipulate files. Individual
    files can be copied using the command cp, followed by the filename and the new
    location like:


    ```

    $ cp file.txt ~/Documents/file.txt

    ```


    You can also rename files by: (command missing) The original file can then be
    deleted using the rm command:


    ```

    $ rm file.txt

    ```


    Want to create a new folder? Use cd to move to the directory you need to add to,
    and then use mkdir by the name you want to give:


    ```

    $ mkdir NewFolder

    ```


    There''s a lot more you can do with the command line, but these are the basics.
    As you use Linux and more, you''ll be confronted with tasks that need the command
    line, and through this process you''ll learn how much can be accomplished streetwise.


    > Did you know...

    > You can always return to your Home folder in the command line by typing ~ and
    pressing Enter.

    > “The command line or terminal will try to autocomplete the phrase if you press
    the Tab key while something is partially typed”


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_24.png)


    Fig 5: There are many simple command-line tools that can help you browse and use
    your system


    ## Getting started


    ## The Raspbian desktop


    ## Raspbian desktop


    Although the Raspberry Pi''s Raspbian operating system is closer to the Mac than
    Windows, it closely resembles the latter. It might seem a little alien at first
    glance, but using Raspbian is hardly any different. There''s a menu bar, a web
    browser, a file manager and you''d expect, simply open the Menu and click the
    applications you want to start...


    ### Menu


    The Windows-like Menu in the top-left corner displays a list of programs and options.
    The menu includes Firefox and other applications, Games (Minecraft is pre-installed),
    Accessories (an assortment of utilities), and Preferences (system tools). Programs
    downloaded from the Pi Store appear in the appropriate category, while Run launches
    a command-line interpreter, just like in Windows. Use Shutdown to switch off,
    logout or restart your Raspberry Pi.


    ### Task Bar


    Strip across the top of the screen is the Task Bar, upon which the Menu is situated.
    To the right of this are shortcuts to the Epiphany browser, the File Manager (PCManFM),
    LXTerminal for input text-based commands, the Wolfram computational software and
    the Wolfram Language application. When these applications are docked, you will
    find them in the right-hand corner if you click them; current CPU load, volume
    control, and the network status.


    ### File manager


    You cannot manage files without a file manager, which can be opened by clicking
    the Task Bar shortcut. Files on the desktop can be copied, renamed and deleted
    by dragging to or simply highlighting and tapping Delete on the keyboard. You
    can also create tabbed windows to browse or open other folders. Folder locations
    can be bookmarked for easy access and files themselves can be viewed as icons
    or in a detailed list.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_25_0.png)


    > “It might seem a little alien at first glance, but using Raspbian is hardly
    any different to Windows”


    ## The Raspbian desktop


    ## Getting started


    ## Web browser


    Epiphany is the default Raspberry Pi browser, although if you don''t like it you
    can add a new one from the Pi Store. With any browser, web addresses are typed
    into the address bar and standard navigation buttons are provided to navigate
    back and forth through webpages. Epiphany supports multiple tabbed windows and
    features private browsing and the ability to clear browsing data. Click on the
    Options icon at the end of the tool bar to access these functions.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_26_0.png)


    ## Pi Store


    You can access the Pi Store from the Menu, or from a link on the www.raspberrypi.org
    website. While like Steam, Google Play or the App Store, Pi Store requires you
    to sign up for an account (with identity). You will need to sign in to download
    for free and paid-software. Any games and apps installed from the Store will appear
    under the My Library tab, and some of these can only be launched from here.


    ## Status and Time


    On the far right side of the Task Bar is the Raspian equivalent of the Windows
    system, where you will find information concerning your Raspberry Pi''s status.
    The status is in the clock, where when clicked will also display the date time
    and network usage. The fact of this will find a graph displaying current CPU load,
    the device volume control, and final confirmation that your Raspberry Pi is online.

