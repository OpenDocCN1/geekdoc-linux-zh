    \ and overlapping sections from different pages. I will provide the clean, merged\
    \ version based on the logical flow of the text provided.) \n\n[content]\n## Tether\
    \ to an Android device\n\n### What you'll need...\n- Android device\n- USB cable\n\
    \nNeed the internet on your Pi? Try out a physical tether to your Android device\
    \ for online access.\n\nThe portability of the Raspberry Pi is one of its most\
    \ lauded features. Mini screens, mini wireless keyboard and mouse combs, portable\
    \ batteries and more can get you out and about, but the internet is a stumbling\
    \ block that you can't easily fix with an accessory. What you also usually have\
    \ with you is an Internet-connected magic pocket box called a smartphone, with\
    \ a bit of know-how, you can connect the Pi to and steal some internet from. Over\
    \ the next two pages we will import this know-how to get using your Raspberry\
    \ Pi on the Internet when you're on the go.\n\n## The easy way\n\n- 01 Many smartphones\
    \ have a Wi-Fi hotspot feature, which your Pi can easily attach to. First of all,\
    \ turn the hotspot on and boot into the Pi. Connect a wireless dongle and open\
    \ the wpa_gui in Preferences > Wi-Fi Configuration.\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_69_0.png)\n\
    \n![](img/4e995e1f4f2888a19b2d6bf0add45e32_69_1.png)\n\n### Scan for device\n\n\
    - 02 Click Scan to open the scan window and scan again from inside there. It should\
    \ pick up your device - connect it to any Wi-Fi network and the Pi will remember\
    \ it for when it needs it next.\n\n### Set up tether\n\n- 03 Connect your phone\
    \ to your Raspberry Pi via a USB cable - depending on the amount of power your\
    \ Pi has, it might have trouble charging your phone but will let you tether. In\
    \ the tethering menu you can now activate USB tethering.\n\n## Projects\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_70_0.png)\n\
    \n> \"What you do also usually have with you is an internet-connected pocket box\
    \ called a smartphone that you can connect to the Pi\"\n\n### Check connection\n\
    \nYour Android device will create an interface known as eth0 on the Raspberry\
    \ Pi. You can connect to make sure this is happening, and that it will let you,\
    \ by opening a terminal and typing the following:\n\nYou can connect from the\
    \ terminal right to access you should should be able to do this by typing the\
    \ following into the terminal:\n\n- $ ifconfig\n- $ sudo dhclient usb0\n\nThis\
    \ will automatically grab any available IP address that your phone will give to:\n\
    \n### Test connection\n\nThere's a few ways to test your connection. We'd usually\
    \ stay in the terminal and ping www.google.com, which you can do, or you can click\
    \ on the browser and it loads the page.\n\n### Save the settings\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_70_1.png)\n\
    \nOnce you reboot your Raspberry Pi, it won't remember to automatically connect\
    \ to the phone tethers. However, we can add an entry to its config so it will\
    \ find and do this in the future:\n\n- $ sudo nano /etc/network/interfaces\n\n\
    ### Interface settings\n\n## Tether on the go\n\nAfter a save and reboot, your\
    \ Pi will now automatically connect to your phone, whether via Wi-Hotspot or a\
    \ physical connection. It may draw a little charge than usual while tethering,\
    \ so be-sure to keep an eye on your battery level.\n\nHere you'll find all the\
    \ current network settings-you might look different from ours depending if you\
    \ have added any fixed wireless settings or passthroughs. Using the same syntax\
    \ as eth0 line, add:\n\n- if eth0 inet dhcp\n\n## Projects\n\nShare your files\
    \ with Samba\n\n### What you'll need...\n- Raspbian\n- www.raspberrypi.org/downloads\n\
    - Internet connection\n\n## Share your files with Samba\n\nConfigure the Pi to\
    \ share the contents of the home folder over your home network\n\n> Did you know...\n\
    > You can network with other Linux, Windows and Mac OS X computers with Samba\
    \ - it is totally cross-platform.\n\nRegardless of whether you plan to set your\
    \ Raspberry Pi up as a media centre, gaming machine or on-development platform,\
    \ the ability to share and access the contents of your Pi from other machines\
    \ is very useful.\n\nWhile the Raspberry Pi is very well configured, by default\
    \ it doesn't include the ability to share the contents of your home folder with\
    \ your local network. As you'll see from this guide, though, it's not too difficult\
    \ to accomplish tasks to Samba and it can help you access your scripts, media\
    \ or documents from any other machine.\n\n```bash\nrussb78@dell:~ sudo apt-get\
    \ update && sudo apt-get install samba samba-common-bin\n```\n\n### Update and\
