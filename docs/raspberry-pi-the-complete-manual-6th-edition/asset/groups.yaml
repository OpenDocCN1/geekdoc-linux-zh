    ## Control lights with your Pi


    ### What you''ll need...

    - Pi-Mote IR control board with RC sockets (bit.ly/1MdpOu)

    - Desk lamp

    - Accessories


    ## Control lights with your Pi


    The winter nights are getting longer; use a Pi and mobile device to remotely control
    your lights.


    > Did you know...

    > Every device on the Internet is assigned an Internet Protocol address which
    has a numerical label which is used to locate and identify each device within
    a network which may contain thousands of devices. IP addresses start with the
    router being 192.168.1.1.


    The folks at Energieie have created some serious genius plug sockets that can
    be turned on and off via your Raspberry Pi. You can buy a starter kit which includes
    the RF transmitter add-board and two sockets to get you started. The add-on board
    connects directly to the GPIO pins and is controlled with a Python library. Once
    everything is installed and set up, your Raspberry Pi can be used with the Pi-Mote
    to control up to four Energieie sockets using a simple program. This tutorial
    covers how to set up the software, the sockets and how to adapt the program so
    that it can run on your mobile device.


    ### Remote control

    Take control of your home environment using your smartphone''s browser.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_85_0.png)


    ### Light source

    Any light source with a plug socket can be controlled remotely.


    ## Control lights with your Pi


    ### Projects


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_86_0.png)


    The Pi-Mote IR control board is hugely versatile and only costs £9.99.


    ## Set up


    01 To get started, boot up your OS Raspberry Pi and load the LX Terminal, then
    update your software by typing:


    - `sudo apt-get update`

    - `sudo apt-get upgrade`


    > "Your Pi can control up to four Energenie sockets using this simple program"


    ## Install the Energie library


    02 Next, install the Energie libraries. These enable the Pi-mote board and Raspberry
    Pi to interact with Python. In the LX Terminal, depending on which version of
    Python you are using, type the code:


    Depending on which OS you''re using, you may need to install the Python GPIO libraries.
    (Raspbian Jessie comes with this library pre-installed, so you can skip this step)
    Type the following into the command line:


    - `sudo apt-get install python3-pip`

    - `sudo pip-3.2 install energie`


    ...for Python 3, or:


    - `sudo apt-get install python-pip`

    - `sudo pip install energie`


    ```bash

    sudo apt-get install python-rpi.gpio

    ```


    For an older version. In the future, Energie will update your software and you
    may need to return for a check on updates to ensure you have the most recent version.
    To update the software, type the code:


    On completion, reboot your Pi. This will install the Python GPIO libraries, meaning
    you can access and control the pins with Python code.


    - `sudo pip install energie`


    ## Projects


    ## Control lights with your Pi


    ### Fitting the Pi-mote


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_87_0.png)


    03 Before fitting the Pi-mote transmitter, shut down your Raspberry Pi with `sudo
    poweroff`. Unplug the module onto your Raspberry Pi. The ''part'' of the board
    fits opposite the HDMI port. Power up the Pi and plug in one of your Energie sockets
    in the same room or area that your Pi is in. The device''s range is fairly good;
    furniture, walls and other objects sometimes block transmission signal. You can
    tell that the socket is working by plugging in some desk lamp and pressing the
    green button that is located on the socket. This will trigger the socket on and
    off, turning the lamp on and off in turn.


    ## Download the set-up code


    ### Set up your socket


    04 Before the Raspberry Pi can interact with the socket and switch it on/off,
    it requires programming to create a code that is sent from the transmitter. Each
    socket has its own unique code so that you can control four individually. Energie
    provides the set-up program which can be found inside the online resources (available
    at bit.ly/21ZiWRW).


    05 Once the set-up program is downloaded, you will need to add the code to the
    file. This is where you will define the logic for each socket.


    ## Switching the lights


    06 Before the Raspberry Pi can interact with the socket and switch it on/off,
    it requires programming to create a code that is sent from the transmitter. Each
    socket has its own unique code so that you can control four individually. Energie
    provides the set-up program which can be found inside the online resources.

