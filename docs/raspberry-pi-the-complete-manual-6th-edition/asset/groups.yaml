    ## Draw circuits with paint


    ### What you''ll need ...

    - Bare Conductive paint (pen or tub)

    - Male to female jumper wires

    - An assortment of LEDs, switches and resistors (optional)


    ### Draw circuits with paint

    Assembling circuits has never been so easy with the joys of conductive paint,
    enabling you to bring art and electronics in a whole new way.


    > The mess of wires and components can become very confusing


    ### Clean up

    Playing with electronics and physical computing is a very rewarding task. For
    a beginner though, the mess of wires and components can become very confusing;
    things like soldering can be a safety concern when children are involved. Bare
    Conductive has taken the joy of electronics and made it far safer, easier and
    more versatile with their conductive paint. You can literally draw wires on paper
    with a paintbrush, use it for cold-soldering or a conductive adhesive and much,
    much more. There are not a deal of boundaries to what you can do. Pair this paint
    with a microcontroller board and you could be creating interactive art, clothing
    and projects in no time.


    ## Get your tools

    Paint and a paintbrush aren''t the first items that come to mind when you think
    about electronics, so you may be wondering where to get them from. Bare Conductive
    stock the paint and a selection of components in their shop (bareconductive.com/shop)
    but you will need to go somewhere for supplies. We would recommend trying a high
    street craft shop such as Hobbycraft (hobbycraft.co.uk) or a local independent.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_75_0.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_75_1.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_76_0.png)


    ## Pick your platform

    ## Connect it up

    A lot of you are probably thinking that something as cool as conductive paint
    is going to be nasty stuff! Actually Bare Conductive paint is nontoxic and water-soluble,
    and can therefore be cleaned easily with soap and water.


    02 The great thing about Bare paint is that, dry, it works just like normal wiring!
    That means you can use it with any of your favourite controllers like the Bare
    Conductive Touch Board, Raspberry Pi or Adafruit''s wearable. You can just use
    some small pin batteries and flashing LEDs for a standalone system.


    04 There are plenty of ways to connect to the paint (from battery packs for example)
    no matter what surface it''s on, because it is oily or it acts just like an uninsulated
    wire. Therefore you can use wires glued on the paint, with copper clips, alligator
    clips or even sewn-in conductive snaps for wearable projects.


    ## Make it waterproof

    07 This paint only comes black and is not waterproof. However, the great thing
    is that you can use it underneath or alongside any regular paints, and waterproofing
    sprays to act as insulation - just to add some color to your designs!


    ## Start to paint

    ## Make repairs

    03 You can paint Bare Conductive paint onto anything – paper, fabric, walls, clothing,
    wood, and much more. For accurate shapes and results, the best idea is to create
    or purchase a stencil (paper stencils are easiest to make at home but use vinyl
    for the best finish).


    05 The conductive paint is thick and when it dries it means you can use it to
    cold solder things together and repair any breaks. In other words, you could glue
    components into a circuit board or glue wires together and they would still function
    electrically.


    ## Touch and sound

    08 Bare Conductive paint can also be used as a capacitive surface, meaning you
    can use it for touch, gesture or proximity controls with a suitable control board.
    Bare Conductive make their own the Touch Board has everything you need to start
    experimenting with touch and sound. It can even act as a MIDI controller, an interface
    or an instrument!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_76_1.png)


    ## Send an SMS from your Raspberry Pi


    ### What you''ll need ...

    - Raspberry Pi

    - Twilio account


    Create a program that combines Twilio and simple Python code to enable you to
    send an SMS from your Pi to a mobile phone. Text messaging, or SMS (Short Message
    Service), has become a staple of everyday communication. Twilio, a cloud communications
    company, is now offered by most providers worldwide, enables you to send SMS messages
    for free from your Raspberry Pi to a mobile phone using just six lines of code.


    > Create other programs, such as making phone calls, recording, and retrieving
    data


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_77_0.png)


    ## Set up your Twilio SMS from the Raspberry Pi


    ### Set up the software

    ## Install the software

    01 The first step of this project is to register for a Twilio account and Twilio
    number. Once signed up, you will receive a verification via SMS to the registered
    phone. When prompted, enter this into the Twilio site. Go to twilio.com/try and
    create your account.


    04 Now boot up your Raspberry Pi and connect it to the internet. Before you install
    the Twilio software, it is worth upgrading your Pi. In Terminal, type sudo apt-get
    update then type sudo apt-get upgrade -y. type sudo apt-get install python-dev,
    press Enter, then type pip install twilio -u

    - message = raw_input("Please enter your message")


    ### Add your numbers

    07 To send the message, you need to add the code below and two phone numbers.
    The first number is your mobile phone, which is registered and validated with
    Twilio (Step 2). The second number is your Twilio account, which can be retrieved
    from the dashboard page under ''Sandbox''. Remember to add the correct country
    code.


    ## Register

    02 Your account is just a trial unless you pay the fee, which means you can only
    send and receive communications from a validated phone. Enter the number you want
    to verify, ensuring that you select the correct country. Twilio will send you
    a verification code and you will need to enter it.


    03 Once registered and logged in to Twilio, the dashboard page will display your
    AccountSid and your Auth Token. These are required to use the Twilio REST. Keep
    these secret and private, but be sure to make a note of them as you will need
    them for your Python program.

    - account_sid = "XXXXXXXXXXXX" # Enter

    - auth_token = "XXXXXXXXXXXXXXXX" # Enter

    - client = TwilioRestClient(account_sid, auth_token)


    ### Create your message

    06 You will probably be able to change your text messages other than the same
    one. Create a new variable in your program called message. This will prompt you
    to enter the text that you want to send to the mobile phone. When the program
    runs, you can also create communication programs, such as making phone calls,
    recording and retrieving call IDs and duration. The API here also mentions a wide
    range of programming languages, including Ruby, PHP, Java and Node (twilio.com/api)
    to give a name to.

    - print_message

    print "Your message is being sent"

    print "Check your phone!"


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_78_0.png)


    ## Make a Pi 2 HTPC


    ### What you''ll need...

    - OpenELEC openelec.tv

    - HDMI cable

    - USB IR receiver

    - IR remote

    - Case

    - Dedicated power supply

    - Optional USB storage


    ## Make a Pi 2 HTPC

    Finally create a more powerful and capable HTPC using the Raspberry Pi 2 and the
    excellent OpenELEC project. We know people who just have a Raspberry Pi for XBMC,
    now called Kodi. It''s a great idea and a great use for the Pi – it works well
    enough that you can easily play media locally or over the network. The biggest
    issue is with GUI response on the original Model B, and a lack of USB ports for
    connecting up everything that you want. While optimisation over the last few years
    has helped, the leap to Raspberry Pi 2 has basically solved all of these problems
    by giving you much more powerful hardware to play with. So if you''re looking
    to upgrade or finally take the plunge, this handy guide will help you create the
    perfect Raspberry Pi 2 HTPC.


    ### Choose the software

    01 In the past, Pi HTPCs were just a choice between RaspBMC and OpenELEC. However,
    RaspBMC is on a bit of a hiatus and OpenELEC is your best bet for getting the
    most--date software. There''s no massive difference between the two, as both run
    XBMC.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_79_0.png)


    ### Get the software

    02 Head over to openelec.tv and look for the Download section. There''s a specific
    Raspberry Pi section which is split into original (ARMv6) and the new Raspberry
    Pi 2 (ARMv7). Grab the image file from this page for the Pi 2.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_79_1.png)

