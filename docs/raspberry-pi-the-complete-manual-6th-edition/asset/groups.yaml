    # Master the Config tool


    Tell your Raspberry Pi how to behave using the powerful built-in config tool


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_0.png)


    The ''RasPi Config'' tool allows configuration of your system that would otherwise
    be tricker if you install Raspberry in Linux environment and it''s the first thing
    you''ll see when you install Raspbian. Why? Tasks such as setting the date and
    time or regional settings for your keyboard are often done in a command-line interface
    with no dialogues, or additional help - for a new user, this is a nightmare.


    There are some further specifics for the Pi and Raspberry itself, such as the
    ability to enable overscan for your TV; change the split of memory to the computer/graphics
    cards or overclock your system to make it a little faster; enable remote SSH Access
    to the system; stop the booting into the desktop environment among other things.
    The Raspi Config tool takes the pain out of process and puts real power at your
    fingertips.


    # Change password


    Change the password for your default ''username'' to make it something more personal
    or easier to remember for you


    # Expand roots


    Allows you to quickly and easily change the partition of the roots to fill the
    SD card completely


    # Open the raspi-config tool


    Start by double-clicking the LXTerminal icon on you. This will start the command
    prompt, where you''ll be able to run the config tool. To do this you''ll need
    to run a command.


    ```

    sudo raspi-config

    ```


    When asked for your password, you won''t actually see it being typed When you''ve
    typed the password and pressed Enter to submit it, the config screen will be shown
    to you. There are a few settings of interest that we''ll cover in this section,
    although they all have in the running of the Pi. Some of the settings in this
    menu are important and some are irreversible, so use them with caution!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_1.png)


    # Configure your keyboard


    Set the correct keyboard up - there are many different layouts. Using the one
    one annoying


    # Overclocking


    Allows you to quickly and easily overclock your Pi to give some extra speed and
    power with little risk


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_2.png)'
