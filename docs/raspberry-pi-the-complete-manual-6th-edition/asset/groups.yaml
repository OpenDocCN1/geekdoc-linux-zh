    PiTFT Mini Kit £30


    This is a 2.8-inch capacitive touchscreen that''s been specifically designed with
    the Raspberry Pi in mind by the gurus over Adafruit. It''s capable of slotting
    directly on top of the Raspberry Pi and is as big as the Pi itself.


    Get more out of your Raspberry Pi by using these add-on boards to extend its functionality


    There are numerous reasons why you''d want to add a screen to a Raspberry Pi but
    they generally come down to the fact that the Pi is very small and very most monitors
    are not. While you could VPN via a phone if you''re on the go, the screen is connected
    directly to the Pi and doesn''t involve awkward wireless networking. Also you
    don''t need to bring along another input devices, as it''s powered off the Raspberry
    Pi as well.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_37_0.png)


    This opens up a world of possibilities. Portable computer, touchscreen control
    pad, video camera... anything that could benefit from your Raspberry Pi having
    a screen and human input away from your main monitor.


    # Pi Supply Switch £15


    The Raspberry Pi has been so popular, in part, because of the extremely good value
    for money hardware. It packs a lot of punch for the price point as it is designed
    by a charity, they don''t inflate the price with high profit margins as would
    be done with a more commercial product. Unfortunately, as with anything low-cost,
    some compromises have been made to bring it in to such an affordable and small
    factor.


    When you connect it to your more standard desktop or laptop computer, one that
    is obviously lacking a power switch and power management functionality. It is
    surprising how something as simple as a power switch can be very useful, and it
    is not until you do not have one that you realize


    The Supply Switch is a self-less kit switch that provides an on, and off- (safe
    shutdown) button to give you basic power management functionality for your Pi.
    With some provided sample scripts you can make sure your Pi is correctly shut
    down when you switch off - without the need to open any menus or issue any commands
    in the terminal - and the circuitry in the switch ensures that power is only removed
    after the Pi has shut down. As well as making it more convenient for you, it also
    reduces the possibility of corruption to your SD card from prematurely pulling
    the power cable.


