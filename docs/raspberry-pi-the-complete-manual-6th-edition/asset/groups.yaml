    ## “Energie Pi-mite 启动套装包含两个可以开启和关闭的遥控插座”


    ## 备份你的树莓派


    ### 你需要准备...


    - 第二台电脑

    - 外部存储


    ## 备份你的树莓派


    主动备份你的树莓派，确保你再再也不会丢失文件。


    虽然树莓派是一台非常可靠的设备，故障仍然可能发生，因此最好做好准备并保持你的文件安全。


    好消息是，Pi 的文件都在外部的 SD 卡上。如果你的树莓派坏了，所有内容都会在 SD 卡上并可以从其他地方访问。不过，SD 卡仍然容易出现问题。备份树莓派的方法有很多。这些方法可以分为两个大类：保存


    > 你知道吗...

    > SD 卡不是永久永久的，所以请确保你已经对文件和整个操作系统进行了备份。


    重要的文件，并为 SD 卡的状态创建一个精确的。前者涉及在其他地方保留文件的副本，而后者则是让你创建一个与你安装 Raspberryian 或其他 Pi 操作系统时通常写入
    SD 卡的相同的镜像。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_39_0.png)


    ## 重要文件


    为了保存重要文件，我们需要在外部源创建一个副本，例如外部硬盘或另一台 PC。这些最好的方法之一并不涉及树莓派；你只需要一台带有读卡器的 PC 或笔记本电脑即可。


    关闭你的树莓派，拔掉电源并从插槽中取出 SD 卡。在你的 PC 上找到 SD 卡读器并将其插入。SD 卡的主文件系统默认可以被 Linux PC 读取到，而一旦你安装了可以读取文件系统的程序（如
    Ext2fs），Windows 或 Mac 也可以读取。在 Windows 上，SD 卡将与“我的电脑”中的其他驱动器一起列出（图 1）。在 Linux 上，它将列在菜单和文件管理器显示存储的地方。


    一旦你在这里找到了 SD 卡，打开它并导航到 home，然后就可以找到 Documents、Downloads、Desktop 以及其他目录。你只需要选择想要复制的文件并将它们移动到
    PC 上的安全目录或连接的外部硬盘上。


    ## 备份你的树莓派


    如果你想将文件留在另一台电脑上，那是可以，但从长期来看，它很容易遇到与 Pi 完全相同的问题。将它们保留在外部硬盘上是一个好主意，将它们放在云存储服务上更好，允许你从任何连接互联网的地方访问它们（图
    2）。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_40_0.png)


    图 1：云存储让备份变得简单


    ## 克隆


    创建克隆取决于你使用的操作系统。对于 Mac 和 Linux，可以使用：


    ```bash

    fdisk -l

    ```


    这列出了所有连接的设备。要拷贝 SD 卡，你可能需要：


    ```bash

    dd if=/dev/sdX of=backup.img bs=4M

    ```


    虽然这很有用，你也可以使用：


    ```bash

    dd if=/dev/sdX of=backup.img bs=4M

    ```


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_40_1.png)


