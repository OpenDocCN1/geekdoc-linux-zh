    ## Getting started


    ## Set up your Raspberry Pi


    Learn what goes where in our brand new Raspberry Pi with our easy-to-follow guide.


    While it looks daunting, setting up the Raspberry Pi for day-to-day use is actually
    very simple. Like a TV or a normal computer, only certain cables will fit into
    the specific slots, and the main job is making sure you''ve got plugged in what
    you need at any time. The Raspberry Pi itself doesn''t label the board. However,
    most good cases will do that for you anyway if you decide to invest in one.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_13_0.png)


    ## Power adapter


    The Raspberry Pi is powered using a micro USB, much like a modern Android phone.
    It can be powered by a laptop or computer, but most out of it, a proper mains
    adapter like this one is ideal.


    ## Monitor


    The Raspberry Pi is capable of displaying a 1920x1080 - otherwise known as Full
    HD. Some modern monitors allow you to plug HDMI straight into them, just like
    TVs. However you may need an adapter in some cases.


    ## USB hub


    There are only a limited number of USB ports on a Raspberry (just one if you have
    Model A). To get around this you will need a USB hub. It''s important to get a
    powered one, as the Pi cannot supply enough juice on its own.


    ## Case and accessories


    A case is not necessary to use the Pi correctly, but it can keep it protected
    from dust, and make it easier to move while in operation. You will need an SD
    card, of at least 4GB.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_13_1.png)


    ## Keyboard and mouse


    Like any computer, you''ll need a keyboard and mouse for any standard PC-style
    operations you do with the Raspberry Pi. The more basic the keyboard, the better;
    same with the mouse, some special ones need additional software.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_13_2.png)


    ## Getting started


    ## Set up your Raspberry Pi


    ### USB

    All peripherals you want to connect via USB (keyboard, mouse, USB sticks, etc.)
    are plugged in here. Ensure you have external power to the USB Hub if you have
    to use one though.


    ### Analogue output

    For setups that don''t use HDMI the yellow video output port is available. To
    use this with sound you''ll need to use the small black port next to it, with
    headphones, or an auxiliary cable to pipe out the audio.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_14_0.png)


    ### SD card

    The SD card goes underneath the Raspberry Pi board. This will hold your operating
    system that runs the Raspberry Pi. The OS needs to be set up from another computer
    before using it.


    ### Digital output

    The HDMI port is the main video (and audio) output of the Raspberry Pi, allowing
    you to display videos on the desktop at a resolution of up to 1080p. TVs that
    support it will also play the audio automatically through.


    ### Networking

    The Raspberry Pi does not come with internet, and while you can add a USB adapter,
    it''s much easier to plug in an Ethernet cable. This will plug into the back of
    your router on the other end and give you internet access to your home network.


    ### Cabling

    Make sure you have the right selection of cables, such as an Ethernet cable for
    networking and internet, and an HDMI or Video cable for video. The Hub can handle
    audio, but the video out will require an additional auxiliary cable.


    ## Getting started


    ## Set up your Pi Zero


    ## What you''ll need...


    - Raspberry Pi Zero

    - microUSB power supply

    - Soldering iron and solder

    - Pi Zero adaptor bundle

    - Monitor, mouse and keyboard

    - Optional: USB Wi-Fi or USB adapter

    - Optional: USB hub


    ## Set up your Pi Zero


    Get to grips with your Raspberry Pi Zero, either as a headless device or for use
    together with a screen and keyboard.


    So you''ve picked up one of the tiny powerful Zeros, but before the coding can
    begin you need to get more familiar with it. Don''t worry; we''ll walk you through
    the Raspberry Pi Zero, the required cables, how to prepare a SD card, and how
    to solder the GPIO header onto the Pi. Once the Pi is working and booted we''ll
    show you how to get it working on the Raspian user interface. You''ll need a USB
    hub for this, or even just to use a keyboard and mouse together (either VNC or
    SSH) with a Wi-Fi adapter or USB-to-Ethernet adaptor.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_15_0.png)

    ![](img/4e995e0add45e32_15_1.png)


    ## Raspberry Pi Zero Overview


    The Raspberry Pi Zero is very small, and as such cannot fit normal-sized USB and
    HDMI connectors. To use it you therefore need adapters to break microUSB into
    full-size USB and mini to full-size HDMI. You also need to be very careful when
    connecting the microUSB power cable and USB data cable. It''s easy to tell them
    apart though, as they''re clearly labelled, and the USB data connector can be
    found between the HDMI and power connectors.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_16_0.png)


    ## Set up your Pi Zero


    ## Getting started


    ## GPIO header


    Soldering your new Raspberry Pi Zero might seem like a scary prospect at first
    but it''s not difficult! However, soldering the correct number of GPIO pins (40)
    takes more than a few minutes. If you miss a couple of the bottom pins, don''t
    worry! The kit we used includes a soldering iron, stand, sucker and some lead-free
    solder. Still, be mindful of your safety and make sure that you are soldering
    in a well-ventilated area – try not to breathe in any fumes. The iron is hot;
    wipe excess solder off the tip. Then start to solder the pins. For each pin touch
    the tip of the iron on the GPIO header and the metal contact on the Pi, then apply
    a very small amount of solder. Once is finished remove the iron. If there is too
    much solder you can reheat it and use the sucker to remove it. If you don''t want
    to overheat any components on the Pi you can melt the plastic of the GPIO headers
    and allow the pin to fall through. Keep wiping the tip of the iron on the sponge
    to keep it clean throughout the soldering process. Make sure you unplug the iron
    and put it somewhere safe to cool down when you are finished.


    ## Holding the GPIO headers in place


    Before you solder the GPIO headers, you need to hold them in place. We recommend
    using blue-tack on either side of the pins for this. This has the advantage that
    you can flip the Pi and keep it in place on a table while you are soldering. The
    blue-tack peels off once you are done.


    ## Soldering kits


    Soldering irons are cheap these days. We are going to do a lot of soldering then
    it''s probably worth getting a temperature-controlled one where you can change
    it.


    ## Solder the GPIO headers


    Here comes the bit you have dreaded, but don''t worry! Make sure you have the
    sponge in the soldering iron holder, as you will need to wipe the iron on the
    sponge to keep it clean. If this is the first time you have used it, the heating
    element will give off a lot of smoke.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_16_1.png)


    ## Getting started


    ## Set up your Pi Zero


    Once you''ve soldered on a 2x20 male headers, your GPIOs will work as well. To
    the right, you can see the four unpopulated pins for video output and a reset
    switch.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_17_0.png)


    ## GPIO


    ### Video

    You''ll need a mini-to-HDMI adapter to use this audio/video port, though you can
    also use the RCA composite video output via the unpopulated pin.


    ### Data

    The power port, on the right, is micro-USB as well. The data port beside it is
    micro-USB as well, so you will likely need a micro-USB-to-USB adaptor.


    ## Prepare NOOBX SD Card


    ## Boot NOOBX and install Raspbian


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_17_1.png)


    See raspberry.py/latest-setup for more details: NOOBX requires a SD card formatted
    as FAT32. You will need to download the latest NOOBX image from raspberry.py/NOOBX_latest
    and then unzip it to the SD card.


    In Linux, the steps are as follows:


    ```

    sudo parted /dev/mmcblk0

    (parted) mktlabel

    (parted) mkpart partition FAT32 0% 100%

    (parted) quit

    sudo mkfs.vfat /dev/mmcblk01

    cd /

    mkdir pin

    sudo mount /dev/mmcblk1 pin

    sudo unzip ~/NOOBX_v1_0.zip

    sync

    cd ..

    sudo umount pin

    ```


    perfect with the Pi out of boot. Once at the Raspbian desktop, you can click on
