    # Getting started


    # The Raspbian desktop


    # # The Raspbian desktop


    Although the Raspberry Pi''s Raspbian operating system is closer to the Mac than
    Windows, it is the latter most closely resembles


    It might seem a little alien at first glance, but using Raspbian is hardly any
    different using a Windows desktop. There''s a menu bar, a web browser, a file
    manager and you''d expect, simply open the Menu and click the applications you
    want to start...


    # ### Menu button


    The Windows-like Menu in the top-left corner displays a list of programs and options.
    The menu includes Firefox Browser and other applications, Games (Minecraft Pi
    is pre-installed), Accessories (an assortment of utilities), and Preferences (system
    tools). Programs downloaded from the Pi Store appear in the appropriate category,
    while the Run launches a command-line interpreter, just like in Windows. Use Shutdown
    to switch off, logout or restart your Raspberry Pi.


    # ### Task Bar


    Strip across the top of the screen is the Task Bar, upon which the Menu is situated.
    To the right of this are shortcuts to the Epiphany browser, the File Manager (PCManFM),
    LXTerminal for input text-based commands, the Wolfram Mathematica computational
    software and the Wolfram Language application. When these applications are docked,
    you will find them in the right-hand corner if you click them; current CPU load,
    volume status control, and the network status.


    # ### File manager


    You cannot manage files without a file manager, which can be opened by clicking
    the Task Bar shortcut. Files on the desktop can be copied, renamed and deleted
    by dragging to or simply highlighting and tapping Delete on the keyboard. You
    can also create tabbed windows to browse or open other folders. Folder locations
    can be bookmarked for easy access and files themselves can be viewed as icons
    or in a detailed list.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_25_0.png)


