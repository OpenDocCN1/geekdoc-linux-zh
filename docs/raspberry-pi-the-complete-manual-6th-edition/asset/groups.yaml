    ## Access your files with SSH


    Use the terminal of your home computer to gain quick and secure access to your
    Raspberry Pi.


    While logging into the full X environment is – as we demonstrated on the previous
    pages – very useful, it has its disadvantages. Firstly, it is not particularly
    quick or convenient to do. The user experience can be slow and cumbersome to use,
    but worst of all, it is not as secure as we''d really like.


    If you want to take a more convenient and secure approach to accessing your Raspberry
    Pi from another computer, you''ll find that all well-versed Pi enthusiasts use
    SSH. SSH stands for Shell and is a cryptographic network protocol designed to
    ensure secure data communication via the command line. While beginners might argue
    it''s easier to remotely access their Raspberry Pi using the full graphical interface,
    as soon as you''ve learnt a bit of basic command-line techniques you''ll quickly
    find ‘dipping in’ to your Raspberry Pi via SSH is the most convenient way to talk
    to remotely.


    You''ll be pleased to hear that SSH is already configured out of the box – there’s
    very little you need to do to make it work, especially if your remote computer
    runs Linux or OS X, as we’re going to demonstrate here.


    ## SSH is easy with Linux and OS X


    Assuming your Raspberry Pi is on and connected to a network either Ethernet or
    a Wi-Fi dongle, the only piece of information you need is the IP address of your
    Pi. To discover this, all you have to do is open a terminal window on your Raspberry
    Pi and type the command `ifconfig` (Fig 1).


    If you''re connected by Ethernet cable you’ll see ‘eth0’, several lines of results.
    The IP address will be the number on the second line next to ‘inet addr’. If you’re
    connected by Wi-Fi,


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_45_0.png)


    Fig 1: Use the ifconfig command in the terminal to discover the IP address of
    your Raspberry Pi


    the result will be on the second line of ''wlan0''. The IP address itself is a
    group of four numbers separated by full stops. If you''re on your home network,
    it will likely be similar to 192.168.0.15. We''ll use this number for our guide,
    but replace it with the IP address you''ve seen via ifconfig.


    With this information in hand, all you need to do is open a terminal window on
    your remote Linux PC and type:


    ```bash

    ssh pi@192.168.0.15

    ```


    This assumes your Raspberry Pi''s username is the default (which is pi) and you''re
    replacing the IP address with the one you made note of. If you''ve added user
    accounts or changed the default, you''ll need to replace the username before the
    ''@'' whatever you''ve changed to. When you press Enter, you will be prompted
    to enter the password for your Raspberry Pi – again, if it''s the default you
    can type raspberry, otherwise type in your Pi''s password and press Return.


    You''ll see the username details on the command line have changed to reflect those
    of your Raspberry Pi – you now connected. Try looking through your files or using
    nano to open a file to edit it!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_46_0.png)


    ## SSH with Windows


    As is the way with most things in the Windows world, your Raspberry Pi with Microsoft''s
    operating system isn''t quite straightforward as you think. Frankly, there is
    a useful tool to help. Putty allows you to connect to your SSH session and it''s
    easy to set up and use. You can download Putty here: www.chiark.greenend.org/~sgatham/putty


