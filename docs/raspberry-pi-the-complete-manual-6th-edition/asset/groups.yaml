    to check the clock before (it takes a while). Timezone will take you to adjust
    a screen where you can see it.


    ## Overclock your Pi


    You can set the clock speed and voltage of Pi to different presets. Setting the
    clock speed at higher rates than the specification may cause instability, so in
    small increments


