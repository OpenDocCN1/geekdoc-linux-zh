    ## 入门指南


    ## 掌握配置工具


    ## 您需要准备的...


    Raspbian:

    www.raspbian.org


    ## 掌握配置工具


    使用强大的内置配置工具让您的树莓派学会如何运行


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_0.png)


    “RasPi Config”工具允许您对系统进行配置，如果是在 Linux 环境下安装树莓派，这些操作将变得复杂。它是您在安装 Raspbian 时看到的第一个程序。为什么呢？诸如设置日期或键盘区域设置等任务通常在没有对话框或额外帮助的命令行界面中完成——对于新用户来说，这简直是噩梦。


    对于树莓派和树莓本身还有一些更具体的设置，例如能够为您的电视开启过度扫描（overscan）；更改内存到电脑/显卡的分配；或对系统进行超频以使其运行更快；启用对系统的远程
    SSH 访问；停止启动到桌面环境等。Raspi Config 工具消除了这些过程的痛苦，让强大的功能变得触手可及。


    ## 修改密码


    更改默认用户名“username”的密码，使其更具个性化或更易于您记忆。


    ## 扩展根分区


    允许您快速方便地更改根分区，以填满 SD 卡。


    ## 打开 raspi-config 工具


    首先双击桌面上的 LXTerminal 图标。这将启动命令提示符，您可以在其中运行配置工具。要执行此，您需要运行一条命令：


    ```

    sudo raspi-config

    ```


    当要求输入密码时，您不会看到输入的字符。当您输入密码并按回车提交后，将显示配置界面。在本节中，我们将介绍一些感兴趣的设置，尽管它们都会对树莓派的运行产生影响。菜单中的某些设置非常重要且有些是不可逆的，请务必谨慎使用！


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_1.png)


    ## 配置您的键盘


    设置正确的键盘——有很多不同的布局。使用错误的布局会非常恼。


    ## 超频


    允许您快速方便地对树莓派进行超频，在风险极小的情况下提供额外的速度和动力。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_2.png)


    ## 掌握根系统


    ## 扩展根系统


    默认情况下，树莓派的根系统为 2GB——这样做是为了让镜像能够适配不同的 SD 卡。


    如果您需要更大的空间，“扩展根”选项将使操作系统使用全部空间。使用后，命令将立即执行。这可能需要一些时间。重启系统以查看更改。


    如果您看到任何不稳定性，请再次运行此向导并将时钟速度调低——重复直到系统稳定。


    在本教程范围内，建议进行“适度/中等”超频——它似乎能为您提供额外的性能，且没有副作用。还建议在进行此更改后重启系统。按住 Shift 键可以临时禁用超频。


    ## 更改启动行为


    开机时自动启动 X。将此选项设置为“Yes”以默认启用此行为。


    您可以随时撤销此设置，返回到文本登录界面，在其中需要手动启动。


    ## 关闭超频


    如果您使用 HDMI 显示器连接树莓派，可能会注意到以下两种现象：


    - 树莓派的图像输出周围有一个黑色块——它没有正确对齐。这是超频引起的。

    - 如果您看到屏幕边缘超出了范围，说明正受到超频的影响。


    如果您遇到其他问题，您可能需要关闭超频，或者在电视上开启“缩放”模式或其他功能。


    ## 修改内存分区


    更改内存分区允许树莓派为系统或处理器分配更多的内存。


    您可以提供的值为 16MB/64MB/128MB。以下是我们的建议：


    - 32MB GPU：适用于基础静态视频和 3D 渲染。

    - 64MB GPU：适用于桌面使用，需要视频播放或 3D 效果。

    - 128MB GPU：适用于图形应用程序、多媒体游戏或 3D 渲染游戏。


    对于大多数人来说，64MB 显存就足够了。


    ## 配置本地区域 (locale)


    设置树莓派使用的本地区域设置——这通常对您的使用影响很小。它还负责任何货币设置，因此在您偏好的时间可能会产生困扰。


    选择该选项后，您将通过向导进行。使用方向键检查时钟（这需要一些时间）。时区设置将带您进入一个调整界面。


    ## 超频您的树莓派


    您可以根据不同的预设设置树莓派的时钟频率和电压。以高于规格的频率可能会导致不稳定，因此请以小的增量进行。


    '
