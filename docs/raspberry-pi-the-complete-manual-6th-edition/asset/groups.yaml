    # Make your order


    # Move connector pins


    +   01 If you''re buying components online, you should be able to get them within
    five days. However, if you''re ordering offline (the UBEC), you should avoid traditional
    stores and visit a model enthusiast store, as these circuits are regularly used
    in RC devices.


    +   03 In order to use the UBEC with a 3-pin connector, you''ll need to alter
    the position of the pins that occupy the two outer slots. Just use a small screwdriver
    to lever up the small plastic catch and remove the wire from the central slot,
    before sliding it into the unoccupied slot.


    # Measure uptime


    +   07 You should have already set up your Pi for SSH, so connect to the device
    after giving it some time to boot fully. In the terminal,


    ```

    sudo dd bs=32m if=/dev/sdX

    arch-linux-hf-2013-02-11.img

    of=/dev/sdX

    ```


    # Check your UBEC


    +   02 Two types of UBEC are available to choose from. If you used the store to
    the left, you will receive one with a micro USB connection for your Raspberry
    Pi. However, if you bought one from eBay there is a strong chance you will receive
    one with a 3-pin connector.


    # Connect to battery box


    +   04 With five batteries in the battery box, connect it to the UBEC (red-red-black)
    by twisting the wires, or employing a 3-terminal strip, cut down to two pairs.
    It can be cut to size using a modeling methodology.


    This command will display the system uptime and keep the Wi-Fi connection.


    # Add a battery to boost


    +   05 With your Pi ready and Wi-Fi plugged in, connect the UBEC to the micro
    USB port and insert the sixth battery into the battery box. The Pi''s power and
    status lights should indicate that the computer is booting up, which gives you
    a fully portable computer.


    # Judge your uptime results


    +   08 Uptime depends on the type of battery you use. Single-charge batteries
    will last a little longer, but this is a more expensive option. Meanwhile, newer
    models have greater power requirements but run less for time. For more power,
    add more batteries!


    # Power extreme!


    +   More batteries added in almost double the uptime (at least 16 hours on a 256MB
    Raspberry Pi Model A), but instead of alkaline or rechargeable modern lithium-based
    AA cell, which will last longer than alkaline batteries.


    # Connect the 3-pin UBEC


    +   09 If you purchased the UBEC with the new-modified 3-pin connector, you''ll
    need to connect this to the Raspberry Pi''s GPIO header. Connect the positive
    +5V (red) connector to Pin 2 and the negative 0V connector to Pin 6.


