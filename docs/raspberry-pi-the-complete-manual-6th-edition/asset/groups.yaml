    RPI.GPIO

    https://pypi.org/project/pypi/RPI.GPIO


    Learn how to harness the power of the GPIO on your Raspberry Pi. It''s easier
    than you think...


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_35_0.png)


    The general-purpose input/output (GPIO) pins on your Raspberry Pi are often central
    to the success of the projects you''ll find in this book. Without them you have
    no way of interfacing with the real world, to trigger lights, buttons or buzzers
    or read sensors.


    GPIO pins are not special to the Pi; they''re actually a standard designed to
    help control input and output behaviour with all kinds of integrated circuits.
    Usually you will find that any GPIO pin has no particular pre-defined and they
    need to be turned off by default.


    # Raspberry Pi GPIO


    The pins on the Raspberry Pi can be controlled and triggered in many ways. You
    can use them from the terminal directly and through Bash scripts, or you can control
    them using specifically designed modules for popular programming languages. Since
    Python is the official language of the Raspberry Pi, you will find the GPIO module
    for Python gives you the best control for inputs and outputs available. The library
    is called RPi.GPIO and is installed by default on all Raspberry Pi, but can otherwise
    be installed in the same way you would install any Python library. The project
    is hosted on SourceForge and can be found at sourceforge.org/projects/raspberry-gpio-python.
    You will also find useful information, and examples of how to use and control
    the GPIO pins from simple Python scripts. It helps to have a basic understanding
    of Python if you plan to use RPi.GPIO, so we recommend a basic introductory course
    like the one at www.codecademy.com or by reading the Official Python documentation
    at www.python.org/doc.


    There are 26 GPIO pins on the Raspberry Pi and you can use the vast majority of
    them in any way you want. There are a few pins that'
  - '[PAGE 36]


    # GPIO port explained


    # Getting started


    have special purposes, though we recommend you familiarise yourself with your
    layout. For example, the very top row of pins are designed to offer power to external
    devices like buttons and lights. Since an earth line (often called ''ground'')
    is needed to safely create a circuit, you''ll also find several ground pins located
    in the GPIO port.


    # How to use GPIO pins


    To exploit the power of the GPIO port you''ll need a few essential components,
    the most important of which are jumper leads. Since the pins on the port are ''male'',
    you''ll need to purchase either ''female to male'' or ''female to female'' cables,
    depending on what hardware you intend to connect to your Pi. Assuming ''female
    to female'' jumper leads will do nicely, but often you''ll be using a breadboard
    to prototype your circuits, in which case ''female to male'' connectors are preferred.
    Cables and breadboards can be bought cheaply from just any online store that sells
    Raspberry Pi accessories and usually be found in the ''prototyping'' section of
    the store.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_36_0.png)


    > Before Become familiar with the layout of the GPIO pins and what they do — some
    have special purposes, such as ground pins


    # Naming conventions


    Once you''re ready to connect your device, the next task is to find the right
    pin for the job. It''s true that all GPIO pins are multipurpose, some are more
    multipurpose than others! As we''ve already discovered, some pins are reserved
    for 5V, 3.3V and ground. Others also have special capabilities, but what''s worse
    is that they can also be called different things. For example, GPIO 18 is also
    known as pin 12 and PCM_CLK. This pin (around halfway down the right side of the
    GPIO port) is capable of hardware pulse-width modulation (PWM), and is useful
    for controlling LED lights and motors other things.


    The pin-naming convention you use in your Python scripts can be set manually.
    This can either be set as BCM (the Broadcom pin name) or the physical pin locations
    (BOARD).


    You''ll see in any of the projects we''re using the GPIO port, the following line
    with either BCM or BOARD in the brackets:


    +   - GPIO.setmode(GPIO.BCM)


    The easiest way to deal with the GPIO pin-naming issues is to pick a convention
    and stick with it!


    > Did you know... The RPiGPIO library has some really useful documentation. All
    you need to do is click on the wiki* on Sourceforge.'
