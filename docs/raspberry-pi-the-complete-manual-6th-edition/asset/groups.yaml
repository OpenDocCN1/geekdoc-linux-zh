- md: "\n# Use the Camera board\n\n## What you'll need...\n\n- Raspberry Pi\n- Raspberry\
    \ Pi\n  www.raspberrypi.org/downloads\n- Pi Camera\n- Ashton's picam module:\n\
    \  https://github.com/ashtons/picam\n\n# Use the Camera board\n\nHere's how to\
    \ get your new Pi Camera set up on your Raspberry Pi, and how to use it ..\n\n\
    One of the most recent Raspberry Pi accessories is the tiny Pi Camera board –\
    \ a small PCB with a camera sensor mounted to it that connects via a ribbon to\
    \ the Raspberry Pi. It's not exactly plug-and-play, so you'll need to do some\
    \ extra setup.\n\nThe Pi Camera has multiple functions, such as for time-lapse\
    \ photography, using as a webcam, or even as an optical sensor for a Pi-powered\
    \ robot, like the one we're making here. Because it doesn't take up any USB slots,\
    \ and draws very low power, it can be a lot more versatile than a standard webcam.\n\
    \nThe Pi Camera itself is not a low-quality piece of kit – with a 5MP sensor,\
    \ it's also able to create up to 1080p quality video, as same as the Raspberry\
    \ Pi's HDMI output.\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_57_0.png)\n\n\
    > Did you know...\nThe Camera board uses the same kind of sensor and hardware\
    \ as the cameras in modern mobile phones.\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_57_1.png)\n\
    \n![](img/4e995e1f4f2888a19b2d6bf0add45e32_57_2.png)\n\n# Attach Camera\n\n##\
    \ Pi preparation\n\n02 Before we try to enable the Raspberry Pi Camera, we need\
    \ to make sure our firmware and software are all up to date with a quick software\
    \ upgrade. In Raspian, we do this by opening the terminal and using\n\n01 To attach\
    \ the Camera to the Raspberry Pi, locate the slot between the Ethernet and HDMI\
    \ port and gently lift the fastener. Insert the ribbon of the Camera board, making\
    \ sure to align the ribbon's connections with those of Pi. The blue tab on the\
    \ flex should be facing the Ethernet port.\n\n- sudo apt-get update\n- followed\
    \ by:\n- sudo apt-get upgrade\n\n# Use the Camera board\n\n## Projects -\n\n###\
    \ Pi config\n\nOnce that's finished, run in the terminal or command line:\n\n\
    ```\n$ sudo raspi-config\n```\n\nto start the configuration screen. Navigate to\
    \ Enable Camera, then enter and press key to enable and confirm with another press.\
    \ Select Finish and then reboot.\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_58_0.png)\n\
    \n![](img/4e995e1f4f2888a19b2d6bf0add45e32_58_1.png)\n\n# Take pictures\n\nTo\
    \ take pictures with the Raspberry Pi Camera, simply enter:\n\n```\n$ raspistill\
    \ -o image.png\n```\nThis will show a five-second preview of the input of the\
    \ camera and then capture the last frame of the video.\n\n```\n# Picam\n\nIf you\
    \ want to do more with the Pi Camera, there is a simple python wrapper making\
    \ picam available. You'll need to install it first, though we'll use picam for\
    \ that. Install picam with:\n\n```\n$ sudo apt-get install python3-pip\n```\n\
    and then:\n\n```\n$ pip install https://github.com/rashton/picam/zipball/master#egg=picam#egg=picam\n\
    ```\n\ntry. All you need to do is enter:\n\n- import picam\n- i = picam.takePhoto()\n\
    - i.save('/home/pi/test.jpg')\nAnd running it will take a photograph called test.jpg.\n\
    \n# Advanced photos\n\nYou can take photos of specific size and quality with a\
    \ time-based naming by the code to look like this:\n\n- import picam\n- import\
    \ time\n- ii = picam.takePhotoWithDetails(640,480, 85)\n- filename = '/tmp/picam-%s.jpg'\
    \ % time.strftime('%Y%m%d-%H%M%S-%f')[:13]\n- ii.save(filename)\n\n# Record video\n\
    \nTo record a video, we will use raspvid, like so:\n\n```\n$ raspvid -o video.h264\n\
    ```\nIt will also take five seconds of video by default.\n\n# Picam photos\n\n\
    With it we can use python to construct a script to take photos with the picam\
    \ module. It's not as difficult as you might think, even if you've never used\
    \ picam before it's a\n\n# Picam video and more\n\nPicam allows you to take video\
    \ in a similar way to the above, with the main difference being that you'll use\
    \ the recordVideo command. You can use the code to take photos or videos regular\
    \ intervals for time-lapse, or have it triggering during a specific event.\n\n\
    With a 5MP sensor, it's able to create up to 1080p video, the same as the Raspberry\
    \ Pi's HDMI\n\n# Control an LED using GPIO\n\n## What you'll need...\n\n- Breadboard:\n\
    \  www.proto-pic.co.uk/half-size-breadboard\n- 3mm LED light:\n  www.ultraleds.co.uk/product-catalogue/basic-led-3-10mm.html\n\
