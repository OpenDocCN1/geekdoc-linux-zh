    # 项目


    ## 极大提升 fstab 以获得快速性能


    ## 选择外部 USB 驱动器


    重启后，虚拟文件系统将挂载，`/var/log` 将位于 RAM 磁盘上。其他可以放入 RAM 的目录包括：


    - tmpfs /tmp tmpfs defaults,noat,nodisid,size=100m 0

    - tmpfs /var tmpfs defaults,noat,nodisid,size=30m 0

    - tmpfs /log tmpfs defaults,noat,nodisid,mode=0755,size=100m 0

    - tmpfs /run tmpfs defaults,noat,nodisid,mode=0755,size=20m 0

    - tmpfs /spool/내가 tmpfs defaults,noat,nodisid,mode=0700,gid=12,size=0


    将每项添加到 `/etc/fstab`。


    通过将根文件系统迁移到外部 USB 驱动器来提高你的树莓派速度是一个开始，但你应该使用哪种设备获得获得性能？使用 USB 驱动器可以在不出现任何重大问题的情况下增加高达
    16GB 的闪存（越大，读取/写所需的电流就越大）。更大的设备是昂贵且没必要的，除非你计划使用 HDD，因为它有自己的电源，因此不会有电源问题。一如既往，你的选择应该适合你的项目。


    ## 将你的操作系统移动到 HDD


    ## 备份 SD 卡


    如果你担心 SD 卡的寿命，为什么不减少对树莓派的依赖呢？与其将 SD 卡作为廉价 SSD 使用，不如改变它的角色，添加一个 HDD 或 USB 闪盘来运行操作系统，将
    SD 卡留给启动引导。这可以为 SD 卡带来显著的性能提升。


    ```

    sudo dd bs=4M if=/dev/sdb of=/backup.img

    ```


    路径 `/dev/sdb` 代表 SD 卡。复制需要 5-10 分钟。完成后，拔掉 SD 卡并连接你的 USB 设备。


    ## 将 Raspian 复制到 USB


    使用一个格式化为 Ext4 的空白 USB 驱动器（或外部 HDD）作为目标驱动，


    ```

    sudo dd bs=4M if=/backup.img of=/dev/sdc

    ```


    将备份留在你的电脑上，以防万一。当 SD 卡和 USB 存储共享相同的磁盘镜像时，是时候考虑你接下来要做什么了——创建一个更快的树莓派。


    如下，将文件系统放在 USB 闪盘上对于备份以及性能提升都很有处


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_65_0.png)


    ## 极大提升你的 Pi


    ## 分割树莓派分区


    理想情况下，启动分区应该留在 SD 卡上，而根文件系统从外部 HDD 或 USB 驱动器运行。使用你偏好的分区管理器（大多数发行版中都有磁盘实用程序），卸载并删除
    SD 卡上的根文件系统，确保你保留了启动分区。移除 SD 卡后，连接你的 USB 设备并删除启动分区，注意保持根文件系统完好。然后在 USB 设备上调整根文件系统的大小，使其保留
    10MB。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_66_0.png)


    Alpine 散热：

    树莓派的散热器非常多，通常价格低于 10 美元


    ## 识别根文件系统


    你要进入 SD 卡和外部 USB 存储，所以你需要告诉树莓派根文件系统在哪里。在插入了 SD 卡的桌面 Linux 电脑上，


    ```

    sudo nano /boot/cmdline.txt

    找到 root=/dev/mmcblkp2 (或类似的)

    将其更改为 root=/dev/sda2，这是你的外部 USB 驱动器。

    保存并退出。

    ```


    ## 让你的树莓派快速且可靠


    记录 GUID 并到 SD 卡。重新打开 `cmdline.txt`，将 `root=/dev/mmcblkp2` 改为 `root=PARTUUID=XXXXXX`，用唯一的
    GUID 字符串替换 XXXXXX。保存并退出。你的树莓派现在更快且更可靠！


    ## 通过超频提升性能


    需要从树莓派获得更多功能？超频是可能的，但你应该注意这种活动的风险。你应该确保你的树莓派散热良好——CPU 散热器、以太网控制器和电源调节器可以在网上购买。


    ## 添加 USB 设备


    只要连接上外部介质，你现在就可以带有存储设备重启树莓派，然后安装 `gdisk`：


    ```

    sudo apt-get update

    sudo apt-get install gdisk

    ```


    然后运行 `gdisk`：

    `gdisk /dev/sdb`

    Enter 显示分区并选择 Recovery（仅限专家），加载 MBR 和 GPT，Tap 选择 ''Write to Disk''，扩展 USB 设备并再次运行
    `gdisk`。Enter 显示 GUID。


    ## 超频你的树莓派


    超频可以通过 `raspi-config` 进行。更多选项可用：Most、Medium 和 High。根据你的理想速度，选择 exit 并重启树莓派


    ```

    sudo shutdown -r now

    ```

    现在你可以运行测试来查看它有多稳定。树莓派 OS 在没有超频的情况下启动，运行 raspi-config 并选择 modest。


    ## 无没有 GUI 的运行


    尽管如此，你可能发现 GUI 仍然很慢。如果你发现自己运行了很多命令，最好的办法是进入终端。在 `raspi-config` 中，选择 `boot_behaviour`
    并选择第一个（default），确保你的树莓派启动到命令行。


    ## 使用 NagiosPi 监控你的本地网络


    你需要...


    - NagiosPi imagehub.com/project/nagiospi

    - Win32 Disk Imager bit.ly/LB8

    - Disk Utility bit.ly/Lec9r

    - Internet 连接（或更大的）SD 卡


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_67_0.png)


    ##利用 Nagios 的力量来监控网络上的服务器、交换机和应用程序。Windows 用户应使用 Win32 Disk Imager 将提取的 NagiosPi_v2.0.zip
    文件内容写入格式化的 SD 卡。Linux 用户可以使用 Disk Utility 或命令 `dd if=/dev/sdx`。镜像写入 SD 后，安全地取出并插入树莓派启动。


    你的 PC 离线了吗？你的 Linux 盒子停止了吗？如果你不在家里，甚至不在国家，如果不登录就没有真正的方法知道（除非你使用远程桌面软件）。好得多的方法是在你的网络设备掉线时接收通知，这就是我们制作
    NagiosPi 的原因——一个为树莓派构建的开源网络监控工具。NagiosPi 以完整镜像的形式提供，准备好写入 SD 卡，一旦运行即可进行实际配置。让我们开始吧。


