    ## 入门指南


    ## 设置你的树莓派


    通过我们通俗易懂的指南，了解新款树莓派中各个组件的布局。


    虽然看起来很复杂，但设置好树莓派以日常使用其实非常简单。就像电视或普通电脑一样，只有特定的电缆才能插入特定的插槽，主要工作是确保你在任何时候都插好了所需的设备。树莓派本身没有在电路板上做标记。不过，如果你决定购买一个外壳，大多数优质外壳都会为你完成这一点。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_13_0.png)


    ## 电源适配器


    树莓派使用 micro USB 供电，类似于现代安卓手机。它可以由笔记本电脑或电脑供电，但在大多数情况下，使用像这样的专用市电适配器是理想的。


    ## 显示器


    树莓派能够显示 1920x1080 分辨率（即全高清 FHD）。一些现代显示器允许你像电视一样直接插入 HDMI 线。但在某些情况下，你可能需要一个适配器。


    ## USB 集线器


    树莓派上的 USB 端口数量有限（如果你是 A 型，则只有一个）。为了解决这个问题，你需要一个 USB 集线器。购买一个带电源的集线器非常重要，因为树莓派本身无法提供足够的电流。


    ## 外壳和配件


    正确使用树莓派并不需要外壳，但它可以保护它免受灰尘，并在操作时方便移动。你需要一张至少 4GB 的 SD 卡。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_13_1.png)


    ## 键盘和鼠标


    和任何电脑一样，如果你想在树莓派上进行任何标准的 PC 风格操作，都需要键盘和鼠标。键盘越基础越好；鼠标也是如此，某些特殊种鼠标需要额外的软件。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_13_2.png)


    ## 入门指南


    ## 设置你的树莓派


    ### USB

    所有你想通过 USB 连接的外围设备（键盘、鼠标、USB 盘等）都插在这里。不过，如果你必须使用 USB 集线器，请确保为其提供外部电源。


    ### 模拟输出

    对于不使用 HDMI 的设置，可以使用黄色视频输出端口。若要通过此输出声音，你需要使用旁边的小黑色端口，连接耳机或辅助电线来传输音频。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_14_0.png)


    ### SD 卡

    SD 卡放置在树莓派板的下方。它将存储运行树莓派的操作系统。在使用之前，需要在另一台电脑上设置好该系统。


    ### 数字输出

    HDMI 端口是树莓派主要的视频（及音频）输出口，允许你在桌面上以高达 1080p 的辨率显示视频。支持该功能的电视也会自动播放音频。


    ### 网络

    树莓派不带上网功能，虽然你可以添加 USB 适配器，但插入以太线要简单得多。网线将插入到另一端的路由器上，并为你提供家庭网络的访问权限。


    ### 线缆

    确保你选择了正确的线缆，例如用于网络和上网的以太线，以及用于视频的 HDMI 或视频线。集线器可以处理音频，但视频输出需要额外的辅助电线。


    ## 入门指南


    ## 设置你的 Pi Zero


    ## 你需要准备...


    - 树莓派 Zero

    - microUSB 电源

    - 电烙铁和焊锡

    - Pi Zero 适配器套装

    - 显示器、鼠标和键盘

    - 可选：USB Wi-Fi 适配器

    - 可选：USB 集线器


    ## 设置你的 Pi Zero


    熟悉你的树莓派 Zero，无论是作为无头设备，还是配合屏幕和键盘使用。


    你已经拿到了一个 Zero，但在开始编码之前，你需要熟悉它。别担心；我们将介绍树莓派 Zero、所需的线缆、如何准备 SD 卡以及如何将 GPIO 脚焊接到树莓派上。一旦树莓派运行并启动，我们将教你如何在
    Raspbian 界面上进行操作。你需要一个 USB 集线器，或者仅配合键盘和鼠标（通过 VNC 或 SSH）使用 Wi-Fi 适配器或 USB 转以太网适配器。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_15_0.png)

    ![](img/4e995e0add45e32_15_1.png)


    ## 树莓派 Zero 概述


    树莓派 Zero 非常小，因此无法容标准尺寸的 USB 和 HDMI 接口。因此你需要适配器将 microUSB 转为标准 USB，将 mini 转为标准
    HDMI。连接 microUSB 电源线和 USB 数据线时也需要非常小心。不过它们很容易区分，因为它们有标记，且 USB 数据接口位于 HDMI 和电源接口之间。


    ![](img/4e995e0add45e32_16_0.png)


    ## 设置你的 Pi Zero


    ## 入门指南


    ## GPIO 脚


    初看之下，焊接新的树莓派 Zero 似乎是一项可怕的任务，但并不困难！然而，焊接数量正确的 GPIO 脚（40个）需要几分钟时间。如果你漏掉了几个，别担心！我们使用的工具包含了电烙铁、焊架和无铅焊锡。尽管如此，请注意安全，确保在通风良好的区域焊接——不要吸入任何烟雾。烙头很烫；擦掉尖上的多余焊锡。然后开始焊接。每个脚都让烙头接触
    GPIO 脚和树莓派上的金属触点，然后上少量焊锡。完成后移除烙铁。如果焊锡过多，可以加热并使用吸锡器移除。如果你不想让树莓派上的组件过热，可以熔化 GPIO
    脚的塑料让其掉落。整个焊接过程中用海绵擦拭烙头以保持清洁。完成后拔掉烙铁并放在安全的地方。


    ## 固定 GPIO 脚


    在焊接 GPIO 脚之前，你需要将它们固定。我们建议在脚的两侧使用蓝胶。这样做的好处是焊接时可以翻转树莓派并保持固定。完成后撕掉蓝胶。


    ## 焊接工具


    现在的电烙铁很便宜。我们将进行大量的焊接，所以买一个可以调节温度的可能是值得的。


    ## 焊接 GPIO 脚


    你一直担心的部分来了，但别担心！确保电烙铁架上有海绵，因为你需要用海绵擦拭烙头以保持清洁。如果你第一次使用它，加热元件会产生很多烟。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_16_1.png)


    ## 入门指南


    ## 设置你的 Pi Zero


    一旦你焊上了 2x20 母针，你的 GPIO 也能工作了。在右侧，你可以看到用于视频输出的四个空脚和一个复位开关。


    ![](img/4e995e1f19b2d6bf0add45e32_17_0.png)


    ## GPIO


    ### 视频

    你需要一个 mini 转 HDMI 的适配器来使用这个音视频接口，但你也可以通过空脚使用 RCA 复合视频输出。


    ### 数据

    右侧的电源端口也是 micro-USB。旁的数据端口也是 micro-USB，所以你可能需要一个 micro-USB 转 USB 的适配器。


    ## 准备 NOOBX SD 卡


    ## 启动 NOOBX 并安装 Raspbian


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_17_1.png)


    更多详情见 raspberry.py/latest-setup：NOOBX 需要一张格式化为 FAT32 的 SD 卡。你需要从 raspberry.py/NOOBX_latest
    下载最新的 NOOBX 镜像，然后解压到 SD 卡中。


    在 Linux 中，步骤如下：


    ```

    sudo parted /dev/mmcblk0

    (parted) mktlabel

    (parted) mkpart partition FAT32 0% 100%

    (parted) quit

    sudo mkfs.vfat /dev/mmcblk01

    cd /

    mkdir pin

    sudo mount /dev/mmcblk1 pin

    sudo unzip ~/NOOBX_v1_0.zip

    sync

    cd ..

    sudo umount pin

    ```


    树莓派启动后就完美了。在 Raspbian 面上，你可以点击网络图标查看可用无线网络。点击它并输入密码。关联后；鼠标悬停在图标上可以看到连接的网络。


    ## 从另一台电脑配置 Wi-Fi


    如果你想将 Pi Zero 作为带 Wi-Fi 的无头设备，可以使用 Linux 方法准备 SD 卡，并配置连接到正确的 Wi-Fi 网络。你需要挂载 SD
    卡并编辑 /etc/wpa_supplicant/wpa_supplicant.conf，这与配置生成的文件相同。


    ![](img/4e995e0add45e32_17_2.png)


