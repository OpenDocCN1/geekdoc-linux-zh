    ## Get interactive with Scratch


    Scratch is a very simple programming language, commonly used to teach basic programming
    to learners of any age. In this project we''ll learn how to light up an LED when
    a button is pressed in Scratch, and then change a character''s colour using the
    General Purpose Input/Output (GPIO) pins on your Raspberry Pi. With these techniques
    you can make all of projects, from musical keyboards to animations. You''ll need
    some components for this guide. Search online for ''Raspberry Pi GPIO kit'' to
    get started. Scratch can be used to do Internet Of projects with a few tweaks.


    What you''ll need...

    - Breadboard

    - LEDs

    - Buttons

    - Resistors

    - Jumper wires

    - ScratchGPIO


    ## Get the required software packages


    Log in to the Raspbian system with the username pi and the password raspberry.
    Start the LXDE desktop environment using the command start. Next open Terminal
    and type the following:


    ```

    wget http://liamfraser.co.uk/linux/install_scratchgpio.sh

    chmod +x install_scratchgpio.sh

    sudo bash scratchgpio3.sh

    ```


    This will create a special version of Scratch on your desktop ScratchGPIO. This
    is a normal version of Scratch with a Python script that handles communications
    between Scratch and the GPIO. ScratchGPIO was created by simpleplex (wordpress.com).


    > "In this project we''ll learn how to light up an LED when a button is pressed
    in Scratch using the GPIO pins"


    ## Connect the breadboard to your Pi


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_56_0.png)


    02 Power off your Pi and connect the cable. Get your breadboard, an LED, and a
    330-ohm resistor and two GPIO cables ready. You''ll want to connect the 3rd pin
    (top-right pin), closest to the SD card to one end of the 330-istor, and then
    connect the positive terminal of the LED (the longer is positive) to the other
    end. The resistor is used to limit the amount of current that can flow to the
    LED.


    Then put the negative of the LED to the negative rail of the breadboard. Connect
    one of GPIO pins (for example, the third pin from the bottom row) to the negative.
    Now connect the power to your Pi. The GPIO should light up. If it doesn''t, it''s
    likely that you''ve got it the wrong round, so connect the power, swap the legs
    around and try again.


    ## Control the LED a little more


    When the button is not pressed, GPIO 4 will be completed and round to open, the
    circuit GPIO 4 will be receiving OV (and have a value of 0), because there is
    much less resistance on the path to ground.


    04 Start the LXDE desktop environment and use ScratchGPIO3. Go to the section
    and create a simple script that broadcasts when Sprite is clicked on the sprite.
    The LED should light up. Then add to the script to wait 1 second and then broadcast
