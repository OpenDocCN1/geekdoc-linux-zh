    # 项目


    # 使用 Scratch 编程


    # Scratch 模块样式


    # 使用 Scratch 模块和工具


    ## 熟悉 Scratch 工作区工具箱


    01 “模块调面板”包含了完整的脚本模块集合。模块包含三种基本样式，即帽子帽型（hats）、堆叠型（stacks）和报告型（reporters）（见反页的图
    3）。


    位于工作区中心的是编辑面板（Edit Panel）。该面板的内容与当前选中的角色有关。


    让我们先从“角色集合”区域选择名为“Creature（生物）”的水水母角色。


    帽子帽型模块会在特定事件时启动脚本执行。最经典的模块是“绿色旗帜”点击。还有许多其他模块，包括在按下特定按键、点击鼠标以及跟随来自 GPIO 连接硬件的传感器事件后启动执行的帽子帽型模块。正如你可能察觉到的，这为
    Scratch 程序员提供了许多选择。


    顶部我们有角色的图像和名称，以及其起始坐标和方向的指示。左侧有两个动画控制按钮。第一个按钮会让角色返回，第二个按钮切换左向和右向状态，第三个按钮开启动画。


    报告模块允许我们指定文本、数值和布尔值。它们适合嵌入特定的模块。矩形报告模块包含一个文本字符串。而圆角报告模块与数值相关，带角度角的报告模块包含真或假值。


    下面是两个编辑面板标签页。脚本（Scripts）标签页是创建模块的地方。在这里我们拖放模块，并以各种组合将它们连接在一起。


    堆叠模块是构建元素。它们通过顶部的边缘和底部的跳转与其他模块相互连接。许多模块包含用于报告型模块的“空隙”，这些模块将根据指定的报告值来修改其操作。


    要更改角色的视觉外观，我们使用一个或多个造型（costumes）。例如，水水母有两个造型（图 1）。每个造型都有编辑、复制和删除的按钮。可以使用三个“新造型”按钮绘制、导入或捕获新造型。声音标签页允许我们向项目添加音频。


    Scratch 模块编码被分为若干组。我们使用位于模块面板顶部的八个按钮模块组，例如“动作”、“控制”、“外观”等其他组。除了闲置模块选择外，这种颜色编码在阅读编辑面板中的脚本时为模块的类型提供了视觉提示。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_49_0.png)


    图 1：水水角色造型 – 水水母角色有两个不同的造型


    # 使用 Scratch 编程


    # 项目


    # 录音器


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_50_0.png)


    图 2：录音器工具 - Scratch 工作区包含一个记录我们自己声音的工具


    > ### 你知道吗...

    > 除了标准的绿色旗帜模块外，还有多种选项可以启动你的脚本。


    # 模块脚本详解


    # Scratch 模块帮助


    02 正如我们看到的，有很多模块，每个模块都有其特定的功能和能力。


    从某方面来说，这非常棒。大量的模块集合意味着 Scratch 可以应用于大量的软件项目、图形图像，以及游戏、动画、音乐、图表、数学、科学、机器人和电子产品等。


    让我们深入研究模块脚本在实践中是如何工作的。在这里，我们将使用一个简单的水族项目模块脚本。从“角色集合”面板中选择舞台平面。然后回到中心的“编辑”面板并选择“脚本”。


    然而，广泛的模块选择对于初学者 Scratch 程序员来说可能是一个巨大的挑战。为了帮助解决这个问题，Scratch 包含了一组信息丰富的、以模块为中心的帮助页面。


    只有一个以“绿色”旗帜帽子帽堆叠模块开头，用以触发效果。接着是一个无限“循环”（loop）。这个循环会一直激活，直到按下停止按钮。这个无限循环包含另外两个模块。


    点击任何模块都会显示帮助页面选项。帮助页面包含特定背景的描述、图形图像，并在适当的情况下提供使用此特定模块的简短示例（图 4）。


    第一个模块选择下一个背景图像。点击“背景”标签页查看所有舞台。内部模块只需执行几秒钟。将值设置为“1”意味着该脚本将在执行动作之前暂停一秒。


    这是一个极佳的功能，极大地简化了决定使用哪些模块的过程。更重要的是，学习这些帮助页面是增强你的脚本技能并发现 Scratch 功能丰富的模块集合中潜力的非常有效的方法。记住这些模块被编码在无限循环中很重要。因此，背景图像将为每个指令顺序显示。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_50_1.png)


