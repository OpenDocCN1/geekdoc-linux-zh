    # Projects


    ## Build an iBeacon


    ### What you''ll need...


    ### Build an iBeacon with Bluetooth

    - USB Bluetooth Low-Energy device (bit.ly/1MTdbJC)

    - Android/iOS device (Android/iOS beacon app)

    - BlueZ


    Get to grips with Apple''s iBeacon technology using your Raspberry Pi as a DIY
    PiBeacon.


    Though it seemed figured, targeted advertising has now become commonplace. While
    it doesn''t rely on retinal identification (yet), iBeacon from Apple uses Bluetooth
    and an iPhone 4S or later in close proximity to trigger an app or message. Google,
    meanwhile, has its own, known as Eddystone. Raspberry Pi owners can investigate
    this technology in more detail by setting their devices as ''PiBeacons'' with
    the addition of a low-cost Low-Energy (BLE) USB module, available from ModMyPi
    at bit.ly/1MTdbJC.


    > Did you know...

    > A Bluetooth Low-Energy (BLE) device is the key to success with this project,
    but if you opt out for old USB Bluetooth dangle, the chances are you''ll get success
    you''re expecting. For the best results, order online from ModMyPi (the version
    4.0, bit.ly/2znpQOL).


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_97_0.png)


    # ACTION


    - Show Mona Lisa

    - Open website

    - Open application

    - Play alarm

    - Silent phone

    - Tasker


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_97_1.png)


    # Prepare your Pi


    01 To set your Raspberry Pi as a PiBeacon, begin with a fresh, updated version
    of Raspbian, perhaps installed using NOOBs. From here, run the update and upgrade
    commands to ensure that your Raspberry is fully up to date. When this is done,
    you can proceed to install the libraries required for your PiBeacon project.


    Again, this will take a little bit of time to download and install. Once the libraries
    have installed, however, you''ll be able to proceed and set up Bluetooth.


    ## Build an iBeacon


    ### Set up your Pi with Bluetooth


    ### Build BlueZ


    02 If you''re lucky enough to own a Raspberry Pi 3 then your device already has
    built-in Bluetooth 4.1, but if not you''ve probably got a Bluetooth device. Before
    connecting your dongle, ensure that it is the correct type (see Bluetooth devices
    devout on the right). Using a standard USB Bluetooth dongle for this project will
    result in a lot of wasted time and frustration.


    03 Next, remove the BLE device and build BlueZ. Note that the sudo command will
    take some time to complete, don''t worry if the Raspberry Pi becomes unresponsive.
    Just wait, and when done, input the final sudo make inside, and wait again.


    Once connected, open a terminal and confirm the device is connected and detected.
    A suitable Bluetooth Low-Energy device will be listed as a Bluetooth 4.0 device.


    Once this is done, you need to switch off your Raspberry Pi with the usual sudo
    shutdown -h now. Wait for the power light to go out, and then reconnect your Bluetooth
    Low-Energy USB dongle.


    Once you''re happy the device is detected, create a new directory for BlueZ (the
    Linux bluetooth), switch to the new directory and build BlueZ:


    Follow this by reconnecting the power supply and rebooting your Raspberry Pi:


    ```bash

    sudo mkdir bluetooth

    cd bluetooth

    sudo wget www.kernel.org/pub/linux/bluetooth/bluez-5.11.tar.xz

    ```


    ```bash

    sudo tar xf bluez-5.11.tar.xz

    cd bluez-5.11

    sudo ./configure --disable-systemd

    sudo make

    sudo make install

    ```


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_98_0.png)


    ## Build an iBeacon


    ### Input a UUID


    The PiBeacon is now ready. All you need to instruct it to advertise to all (correctly
    configured) devices. This simply means using the hcitool command to attract attention
    to the PiBeacon. Note how the identifier in certain portions of the string (everything
    after "cmd") is intended to provide information. For instance, the UUID below
    is broken into pairs. Like any manufacturer-specific data that is displayed, in
    this case 00 C4 which is sent from Apple''s ID. The example UUID shown here is
    used on your Pi, but note that it is intended for a particular app - specifically,
    the iBeacon Beacon Toolkit in App Store.


    ```bash

    sudo hcitool -i hci0 cmd 0x08 0x09 0x00 0x08 1E 02 01 1A 1A FF 4C 00 02 15 E2
    0EA 39 F4 73 F4 5B C4 4A 2F 17 D1 0D 07 9A 61 00 00 02 0C8 00

    ```


    ## Configure for Broadcast


    With the BLE connected and the Pi restarted, however hiconfig the Bluetooth mode
    will usually be listed by using hiconfig. To avoid this, input the following command.
    As, stay aware of the commands you''re inputting. In this, the final line ends
    with noscan, which displays Bluetooth scanning. This is done to avoid issues with
    the module attempting to scan while advertising. With these commands once, then
    hiconfig once more. This time the device status will be ''UP RUNNING''.


    ```bash

    sudo hiconfig hci0 up

    sudo hiconfig hci0 leav

    sudo hiconfig hci0 noscan

    ```


    ## Resolve errors


    From time to time you may encounter errors with your PiBeacon, especially when
    attempting to persuade the status to switch from ''DOWN'' to ''UP RUNNING''. Restarting
    the Pi is no good here. Instead, you need to reset the device. First, enter hiconfig
    the device name. Usually this is hci0. Next, use hiconfig reset. This essentially
    clears everything out lets you start again with it. To check, input hiconfig again,
    where you see the status ''UP RUNNING''.


    ```bash

    sudo hiconfig hci0 reset

    ```


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_99_0.png)


    ## Test with an iOS device


    Before proceeding to use the PiBeacon for a particular project, you need to make
    sure that it is broadcasting correctly. To do this, you''ll need an iPod (or iPhone)
    in order to detect the Scan Response — information including the UUID sent from
    Beacon to your smartphone when it comes into proximity. In addition, you need
    an app. Something like Beacon Toolkit mentioned above should be sufficient. We''re
    really just looking at this stage to test the strength and range of your PiBeacon.
    Both of qualities we need are connected to your Raspberry Pi''s USB port, of course.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_99_1.png)


    ## Using Beacon Toolkit


    08 With the app installed, open it and tap Listen. As you move your phone or tablet,
    the iOS device will detect the position of the PiBeacon and you can use this information
    to get an idea of signal strength, and where you can expect the PiBeacon to be
    picked up by the app or service.


    But how might you use this? Well, iBeacon technology is really like a sort of
    NFC, but without the close proximity of contact. This naturally has some security
    concerns, so be careful how you use...


    ## iBeacon scanning on Android


    09 Various apps are available for Android users planning to communicate with their
    Raspberry Pi Beacons. These include Locate Beacon, iBeacon Detector and Beacon
    Scanner. As well as being compatible with iBeacon, they also provide support for
    Eddystone, the Android answer to iBeacon, and AltBeacon, an open iBeacon alternative.
    Pictured at the lower-left of the opposite page is iBeacon & Eddy Scanner (aka
    Scanner), which will scan for a nearby beacon following a simple button press.
    Once the iBeacon is found, the app displays live info, and when this is tapped,
    a detailed set of data.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_100_0.png)


    ## PiBeacon projects to consider


    10 Various projects for Raspberry Pi-powered iBeacons can be developed, including
    systems that can assist with any smart home builds you have planned. Among these
    like garage door automation, switching a light, or simply tracking the whereabouts
    of your Raspberry Pi.


    Note that the majority of projects will work with whatever mobile device you are
    using, over the platform-specific details of detection whenever you''re researching
    such projects. To get started, we''ll use the remainder of this tutorial to take
    a look at a couple of PiBeacon projects you can build today.


    > Above iBeacon & Eddystone Scanner is another useful beacon detection app for
    Android


    ## Making your PiBeacon smart


    ### PiBeacon Trigger Apps


    11 You can take what you''ve done with the PiBeacon so far even with some smart
    interaction between your smartphone and Raspberry Pi, but where should you start?
    Rather than going into DIY task, it pays to take time finding the right app for
    your smartphone—one that will enable you to launch specific apps based on the
    presence of a PiBeacon.


    12 Whether you''re using iOS or Android, you''ll find a trigger app on the corresponding
    app store that can be set to launch an app when your smartphone comes in proximity
    with your PiBeacon. Android users should take a look at NFC, available from Google
    Play and intended for devices equipped with Bluetooth 4.0 hardware and running
    4.3 or later.


    Meanwhile, iOS users should take a look at iBeacon, available for a paltry £1.59
    in the App Store. This app has support for IFTTT, Philips Hue, HomeKit and Lux
    integration.


    > Whether you''re using iOS or Android, you''ll find a trigger app on the corresponding
    app store


    The tools we''ve looked above are simply for detection and measurement, and the
    data they reveal is useful for developing trigger apps. How do you launch an app
    when your phone is near a PiBeacon?


    ## What a PiBeacon can''t do


    ## Choosing PiBeacon vs NFC


    14 As you may have gathered by now, there are some similarities in use for iBeacon
    and NFC, especially when it comes to home applications. Which one should you use
    for your project?


    13 As things, for border or worse, you''re not in a Philip K Dick novel. This
    means that for the time being (at least), iBeacon technology cannot launch a web
    page on your phone without a third-party tool.


    Adaafruit produces an NFC breakout to add NFC functionality to the Raspberry Pi,
    which can prove very useful for any project that requires contact—we grabbed ours
    for a piece of hardware from ModMyPi.

