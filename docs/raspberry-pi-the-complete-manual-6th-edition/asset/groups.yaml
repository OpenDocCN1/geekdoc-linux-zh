    # # Supercharge your Pi


    Get the most out of your Raspberry Pi with these performance-enhancing tips and
    tricks


    Raspberry Pi is plugged in. Raspbian is installed on the SD card and you are right
    in the middle of setting up a wireless print server or building a robot to collect
    your mail from your doormat. Are you truly getting the most from your little computer?
    Perhaps you haven''t explored the full set of options in Raspbian, or you''re
    running the entire OS from SD card, something that can reduce SD card lifespan.
    Various tools and techniques can be employed to improve performance, from choosing
    the right hardware to overclocking the CPU. You might even maximise storage space
    on the Pi''s SD card or all replace it with a secondary device. Use these tips
    and tricks to reconfigure your Pi setup and optimise software and hardware to
    ensure you get the best performance.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_63_0.png)'
  - '[PAGE 64]


    # Supercharge your Pi


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_64_0.png)


    # Use better storage hardware


    01 Your choice of storage media can have an impact on your Raspberry Pi''s performance,
    regardless of the operating system. A low capacity SD card with poor error correction,
    is going to be slower than a larger card with greater resilience, so you need
    to find the right balance for your project and shop wisely.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_64_1.png)


    # Choosing the best SD card


    02 Various standards of SD card are available, with the more expensive designed
    for better correction. For the best performance on your Raspberry Pi, choose a
    SDHC card with a high rating. The same advice pays to MicroSD cards, which you
    can use on your Raspberry Pi or directly insert into a Raspberry Pi B+.


    # Expand the Raspberry partition


    04 Maximising the partition affords the full capacity of your SD card, will increase
    the media''s lifespan (there is more space to write to, so the sectors aren''t
    being overwritten as often). With raspberry-config running, use the arrow keys
    to select expand_root in the menu. Then wait briefly while the partition is resized.


    # Write data to RAM


    # Enable fstab in Raspberry


    Rather than writing to your SD card – something that will eventually result in
    a deterioration of reliability and performance in the card - you can configure
    Raspberry Pi to write to the ram, which will speed up your overall performance.
    This is achieved using fstab (file systems), a system configuration available
    in most Linux distros.


    06 This is much like creating a RAM disk in Windows. Add the following line to
    mount a virtual file system:


    ```

    sudo nano /etc/fstab

    tmpfs /var/log tmpfs defaults,noatime,mode=0755,size=100m

    ```


    Follow this by saving and exiting nano (Ctrl+X), then safely restarting the Pi

    sudo reboot -r


    # Make the most of your storage


    03 You''ll typically need 1-2GB of storage for your chosen Raspberry Pi distro,
    so any remaining storage on your SD card will be used for updates and data you
    create or save. In Raspberry you can open a command line and run the configuration
    utility to gain space (only if your SD card''s greater than 2GB):


    +   - raspi-config


    > You’ll typically need 1-2GB of storage for your chosen Raspberry Pi distro'
