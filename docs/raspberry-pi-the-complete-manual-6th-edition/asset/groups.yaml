    # Install and upgrade


    # Getting started


    # Update and upgrade


    you will need to know be able to install it. Use the arrow keys up/down to navigate;
    press ''Q'' to exit.


    # Apt Easter eggs


    Getting hold of a package dropping onto the Raspberry Pi involves using the command-line
    terminal, via the LXTerminal icon on the desktop, and entering a few commands.
    Before we do that, we make sure the system is up to date. Enter the following
    into the terminal:


    The Apt command is a shorter, non-menu-driven variant of the aptitude command.
    This command has a long history in Linux, and it has some result as special features;
    also known as Easter eggs. Purely for a little bit of fun, type in the following
    commands and see the results:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    Or...


    ```

    sudo apt-get update && sudo

    apt-get upgrade

    ```


    # Installing a package


    Using the up and down keys, navigate the list. If you find something you look
    of, say Angry Drunken Dwarves, remember the name of the package, in this case
    ''angryd'', and press ''Q'' to exit the list.


    ```

    apt moo

    apt -v moo

    apt -vv moo

    apt -vvv moo

    apt -vvvvv moo

    sudo apt-get moo

    ```


    To install the package, enter it in the terminal:


    ```

    sudo apt-get install angryd

    ```


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_32_0.png)


    # Search for a package


    The apt-get command, (Advanced Package Tool) is the key to downloading and installing
    packages on the Raspberry Pi. In the previous instance, we updated the existing
    packages and system, upgraded that we and updated the current package list. Now,
    let''s search the list of server packages for available names:


    ```

    apt-cache search game | less

    ```


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_32_1.png)


    # Executing the package


    The result of the previous command should be the successful download and installation
    of the games, Angry Drunken Dwarves. To execute the newly installed package, you
    can run it from the LXDE Menu under Games-Angry Drunken Dwarves, or by typing
    into the terminal:


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_32_2.png)


    # Man the apt command


    As you see, there is more to the simple apt command than what first needs the
    eye. There are many sub-commands that you can run, and many variations in which
    to run them.


    # Remove a package


    If you want to see what the apt command can do:


    +   - man apt


    ```

    sudo apt-get --purge remove

    ```


    Enter ''Y'' to accept the removal.


    # Searching


    The current list you find yourself is in the name of all the packages labelled
    as ''games'' from the available list. In the list, the part before the hyphen
    tells you the name of the package, which is what


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_32_3.png)'
  - '[PAGE 33]


    # Getting started


    Use graphical installations


    # What you''ll need...


    # Use graphical installations


    Synaptic:

    www.nixuyu.org/synaptic/


    Would you prefer a graphical interface to install new programs? If so, then read
    on...


    > Did you know...

    Synaptic has access to the same repo via the command line as demonstrated on the
    previous two pages.


    If you''re new to Linux, you may find using its built-in Apt package management
    tool to be intimidating and confusing. The apt-get command is used for installing
    applications through the internet, connecting to the remote servers – called repositories
    – which house the programs as packages. But it is used through the terminal command
    prompt, which can be daunting, so we need an alternative: a desktop environment
    interface method of getting held of packages.


    This is where Synaptic comes in. Synaptic is a friendly-looking graphical interface
    to the apt-get terminal command allows you to manage your application installations,
    and removals, through the already familiar desktop environment. Think of it as
    a kind of online shop where you can pick and choose the programs you have downloaded
    and installed onto your Raspberry Pi without having to drop into the terminal.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_33_0.png)


    +   Upgrade entire systems

    Synaptic has the ability to update and upgrade every program or package. Upgrade
    your system to the latest version


    +   Install and more

    Synaptic is a very powerful tool. With you can install, remove, upgrade single
    or multiple packages and programs


    +   Browse documentation

    From Synaptic you are able to browse and read all available online documentation
    related to a package or program


    +   Easily find programs

    Synaptic enables you to easily locate packages and programs by name, description,
    version and even by who developed the program'
