    13 尾部需要监听你根据需要创建的新事件。当它接收到 `Egg` 事件时，如果 `Grow=1`，尾部可以暂停。当它接收来自蛇的 `Game Over` 事件时，它必须冻结。


    10 现在你可以运行你的精灵了。它将响应方向键进行移动。它会绘制身体，身体会变得越来越长，因为我们需要擦除它。在检测到碰撞时，它会发出尖叫并结束游戏。


    16 现在你可以尝试尾部精灵。蛇不会持续增长，因为接收不到任何 `Egg Egg` 事件。但尾部将跟随蛇在舞台上移动，通过用白色画笔（与背景颜色相同）覆盖蛇身体来擦除它。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_53_4.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_53_5.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_53_6.png)


    ## 绘制尾部


    11 点击“画一个精灵：画笔”来绘制尾部。画一个小圆代表尾部的末端。将此精灵命名为：Tail。尾部将跟随蛇并擦除其尾部边缘，这样蛇身体就不会无限增长。


    14 当点击绿色旗标志开始游戏时，`Grow` 被设置为 1，使蛇获得较的身体。使用画笔移动到舞台中心，并配置画笔绘制与舞台背景相同颜色和大小的线条，以便它可以擦除身体。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_53_7.png)


    ## 在 Scratch 中创建蛇的克隆


    - 绘制坏蛋

    - 制作坏蛋

    - 增长坏蛋


    17 点击“画一个精灵：画笔”图标来绘制新精灵。在画编辑器中，画一个小椭圆。`Egg` 精灵将随机出现在舞台上，导致蛇增长并增加分数。


    20 以相同的方式创建 `Bad Egg`，但使用不同的图形。在道具中，将 `Egg` 的绿色旗标志拖到 `Bad Egg` 上以复制它——在增加分数之前播放声音。


    21 为 `Bad Egg` 添加另一个“当绿色旗被点击时”，以便在游戏开始时将其大小设置为默认的 100%，然后每 10 秒增加 10%。坏蛋会变得更大且难以躲避。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_54_0.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_54_1.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_54_2.png)


    ## 添加蛋的声音


    18 转到 `Egg` 的声音标签并导入 `Crash`。或者你可以选择不同的声音，当蛇吃掉蛋时播放该声音。


    ## 创建 Bonus 精灵


    22 以类似的方式创建 `Bonus` 精灵。`Bonus` 的脚本与 `Egg` 相似，你可以将其拖到 `Bonus` 精灵并工作。改变声音并随机增加分数。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_54_3.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_54_4.png)


    ## 添加蛋的脚本


    19 复制脚本使 `Egg` 在游戏开始时随机出现。当检测到被吃掉时（第 18 步选择的），广播 `Eaten` 事件然后再次出现。当接收到 `Game Over`
    事件时，必须停止。


    ## 使用 Scratch 进行交互


    Scratch 是一种非常简单的编程语言，通常用于向任何年龄的学习者教学。在这个项目中，我们将学习在 Scratch 中按下按钮时如何点亮 LED，并使用树莓派的通用输入/输出
    (GPIO) 引脚。通过这些技术，你可以制作从键盘到动画的所有项目。你需要一些组件，在网上搜索“树莓派 GPIOset”来开始。


    你需要：

    - 面板

    - LED

    - 按钮

    - 电阻

    - 跳线线

    - ScratchGPIO


    ## 获取所需的软件包


    使用用户名 `pi` 和密码 `raspberry` 登录 Raspbian 系统。使用 `start` 命令启动 LXDE 桌面环境。接下来打开终端并输入：


    ```

    wget http://liamfraser.co.uk/linux/install_scratchgpio.sh

    chmod +x install_scratchgpio.sh

    sudo bash scratchgpio.sh

    ```


    这将在你的桌面上创建一个特殊版本的 Scratch ScratchGPIO。这是一个正常版本的 Scratch，带有一个 Python 脚本来处理 Scratch
    和 GPIO 之间的通信。ScratchGPIO 由 simpleplex (wordpress.com) 创建。


    > “在这个项目中，我们将学习在 Scratch 中按下按钮时如何使用 GPIO 引脚点亮 LED”


    ## 将面板连接到你的树莓派


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_56_0.png)


    02 关闭你的树莓派电源并连接电缆。准备好面板、一个 LED、一个 330 欧姆电阻和两个 GPIO 线。你需要将第 3 引脚（靠近 SD 卡的右上引脚）连接到
    330 欧电阻的一端，然后将 LED 的正极（长脚是正极）连接到另一端。电阻用于限制流向 LED 的电流。


    然后将 LED 的负极放在面板的负极上。将一个 GPIO 引脚（例如从底部数起第三个引脚）连接到负极。现在给你的树莓派接电。GPIO 应该会亮。如果没有亮，可能是你接错了电路，请连接电源，调换引脚并重试。


    ## 进一步控制 LED


    当按钮未被按下时，GPIO 4 将完成并打开，电路 GPIO 4 将接收低电平（值为 0），因为通地地的路径电阻小得多。


    04 启动 LXDE 桌面环境并使用 ScratchGPIO3。转到该部分，并创建一个简单的脚本，当精灵被点击时进行广播。LED 应该会亮。然后向脚本中添加等待
    1 秒，然后广播 `p1`。如果你点击精灵，LED 会亮一秒然后关闭。ScratchGPIO


    我们可以看到它的运行效果。


    ## 开关 LED


    03 此时，LED 连接到 3.3V 引脚。它开关开关的能力并不理想，所以如果你将其连接到 GPIO 17（树莓派从底部数起右侧的引脚），就可以正常工作。我们可以通过导出
    GPIO、将其设置为输出引脚然后将其值设置为 1 来开启 LED。将值设置为 0 则关闭 LED：


    ```

    echo 17 > /sys/class/gpio/export

    echo out > /sys/class/gpio/direction

    echo 1 > /sys/class/gpio/value

    echo 0 > /sys/class/gpio/value

    ```


    ## 上拉按钮


    05 关闭树莓派电源。这比我们首先创建的 LED 要复杂一点。首先我们需要将 GPIO 3.3V（右侧引脚）连接到我们面板上的电阻。然后将一个 1k欧姆电阻连接到正极路径，另一端连接到面板。然后添加一根线，一端连接到
    GPIO 4。这位于 GPIO 17 的右侧。然后，连接按钮的引脚。最后通过添加一根线将按钮的另一端接地。


    ## 光亮吧！


    06 启动树莓派并使用 ScratchGPIO3。转到该部分并添加“当 GPIO 被点击时”配合 `forever` 循环，并在元素内部从运算符部分添加 `i
    =` 运算符到语句中。然后去到传感器部分并将值添加到等式语句的左侧，并设置为 0 或右侧。如果传感器值为 0，则广播 `p1`，否则广播 `p1`。点击绿色旗标志。如果你按下按钮，LED
    就会亮起！


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_56_1.png)


    '
