    # Use Scratch blocks and tools


    ## Getting to grips with the Scratch Studio toolbox


    01 The ''Blocks Palette'' contains the complete collection of scripting blocks.
    Blocks contain three basic styles, namely hats, stacks and reporters (see Fig
    3 on the opposite page).


    Situated in the centre of the Studio is the Edit Panel. The panel contents relate
    to the currently selected sprite.


    Let''s start by selecting the jellyfish sprite, called Creature, from the Sprite
    Collection area.


    A hat-style block will start script execution on a specific event. The classic
    block is the ''green flag'' click. There are numerous other blocks, including
    hat blocks that start execution after a specific key press, a mouse click and
    following sensor event from the GPIO-connected hardware. As you can probably tell,
    this offers a lot of options to Scratch programmers.


    At the top we have the sprite''s image and name, plus an indication of its start
    coordinates and direction. On the left are two animation control buttons. The
    top button will return the sprite, the second switches left- and right-facing
    states, and the third turns animation.


    Reporters allow us to specify textual, numeric and boolean values. They fit into
    specific blocks. A rectangular reporter contains a text string. While the rounded
    reporters are associated with numeric values, angle-ended reporters contain true
    or false values.


    Below are two Edit Panel tabs. The script tab is where blocks are created. Here''s
    where we drag and drop our blocks, snapping them together in various combinations.


    Stack blocks are the building elements. They interconnect with other blocks via
    their top-edges and bottom-edge jumps. Many blocks contain ''holes'' for reporter-style
    blocks, which will modify their operation depending on the specified reporter
    value.


    To change a sprite''s visual appearance we use one or more costumes. For example,
    the jellyfish has two costumes (Fig 1). Each costume has buttons to edit, copy
    and delete. New costumes can be painted, imported or captured using the three
    ''New Costumes'' buttons. The sound tab allows us to add audio to project.


    The Scratch block coding is divided into groups. We use the eight buttons block
    group located at the top of the Block Palette, namely ''Motion'', ''Control'',
    ''Look'' and so on other groups. Apart from idling block selection this colour
    coding provides a visual clue to a block''s type when reading a script in the
    Edit Panel.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_49_0.png)


    Fig 1: Jellyfish Sprite Costumes – The jellyfish sprite has two different costumes


    # Program with Scratch


    # Projects


    # Sound Recorder


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_50_0.png)


    Fig 2: Sound Recorder Tool - Scratch Studio includes a tool to record our own
    sounds


    > ### Did you know...

    > There is more than one option available to start your scripts beyond the standard
    Green flag block.


    # Block Script Walkthrough


    # Scratch Block Help


    02 As we''ve seen, there are many blocks, each with their own specific functionality
    and capabilities.


    In one way this is great. Large block collection means Scratch can be used in
    a vast range of software projects, graphical images and, where games, animation,
    music, graphs, math, science, robotics and electronics much more.


    Let''s dig deeper into how a block script works in practice. Here, we will use
    a simple Aquarium project block script. From the ''Sprite Collection'' panel select
    the stage plane. Then go back to the central ''Edit'' panel and select the ''Scripts''.


    However, the wide selection of blocks can be quite a challenge for the novice
    Scratch coder. To help with this problem the Scratch has included an informative
    set of block-centric help pages.


    There''s just a single block starting with a ''green'' flag hat-stack block to
    kick off the effect. Next there is a forever ''loop''. This loop is activated
    until the stop button is pressed. This forever loop contains two other blocks.


    A click on any block will show up the help page option. The help page contains
    context-specific descriptions, graphical images and, where appropriate, a short
    example of how to use this particular block of (Fig 4).


    The first block selects the next background image. Click on the ''Backgrounds''
    tab to view all the stages. The inner block simply executes for a number of seconds.
    Setting the value to ''1'' means that this script will pause for a second before
    performing the action.


    It''s a terrific feature greatly simplifies the process of deciding blocks to
    use. More importantly, studying these help pages is a highly effective way to
    enhance your scripting skills and discover the potential within Scratch''s feature-rich
    block collection. It''s important that you remember these blocks are encoded in
    the forever loop. So, the background images will be displayed in sequence for
    each order.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_50_1.png)


    Fig 3: Block Style Examples - The Scratch blocks come in a number of different
    styles


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_50_2.png)


    Fig 4: Help Window - Example of help window associated with ''ask'' and ''wait''
    block


    # Projects


    # Create a Snake clone in Scratch


    # What you''ll need...

    Scratch project archives www.scratch.mit.edu/explore/


    # Create a Snake clone in Scratch

    Design your own version of Snake to test your programming skills!


    # Did you know...

    Snake is a very popular beginner game that started in the arcades and is still
    popular today.


    Here, we will create a version of the classic Snake game where we move the snake
    around the stage using the arrow keys. You control the head of the snake and must
    avoid collision with either the body of the snake or the edge of the stage. The
    snake grows longer each time you eat an egg. You get points added to your score
    for eating yellow eggs and lose points for eating black eggs. There are also bonuses
    to eat for extra points. By following this tutorial you will learn to create your
    simple sprite graphics, send and receive broadcast events, use a list to store
    data, play sound effects, generate random numbers and use sensing commands to
    detect when a sprite is touching something.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_51_0.png)


    The Egg sprite appears randomly on the screen and leaves other sprites when it
    has been touched by the snake tongue


    # Snake sprite

    The Snake moves the head around the stage and draws the body behind it. It also
    detects collisions with the body


    # Paint the Snake sprite

    Click the New sprite: Paintbrush icon in the Paint Editor, draw a small green
    ellipse for the snake head and add a red rectangle for the tongue. It''s important
    that the tongue is a different colour to the head. Name your sprite Snake.


    # Tail sprite

    The Tail sprite follows the head, erasing the end of the body so the snake moves,
    pausing when it needs to grow


    # Bad Egg sprite

    The Bad Egg also appears randomly but decreases the score when eaten. It also
    grows in size, getting harder to avoid


    # Create a Snake clone in Scratch


    # Projects


    # Add a Snake sound


    # Initialize Snake variables


    # Main action loop


    02 When the Snake tongue touches the snake body or the edge of the stage, we are
    going to play Game Over. We need to add this sound to the Snake. With the sprite
    selected, click the Sound tab and choose Import. Select the Electronic sound.


    05 Use a ''when green flag clicked'' Control command and initialize the Snake
    variables, using commands from the Variables palette. We want to start each game
    with an empty list, so delete all of its entries. The Score must start at zero.
    Speed sets difficulty.


    07 Use a Forever command with an ''If-else'' command nested inside. If a collision
    has red tongue the blue body (the head is always touching the body) or the snake
    is touching the edge use the Eydropper tool to select colours within Scratch.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_52_0.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_52_1.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_52_2.png)


    # Respond to arrow keys


    03 Drag four key commands from the palette, and four point commands from the Motion
    palette. Configure them so that the up arrow changes the direction to 0 degrees
    (up) and so on. Click the green flag above the stage to test this.


    # Draw Snake body


    06 Use commands from the Pen palette to draw the body of the snake. You should
    also use commands from the Motion palette to move the snake to the stage and point
    left at the beginning of each game. The game is up until the snake hits itself.
    In the next steps we use colours to see if the head is touching anything it.


    # Handle Game Over


    08 When a collision has detected, broadcast a Game Over event (you''ll need to
    create a new event) to all the other sprites so they can play sound effect and
    stop all scripts so that the snake freezes in its position at the end of the game.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_52_3.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_52_4.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_52_5.png)


    # Make Snake variables


    04 Click on the Variables palette. Make two variables, Score and Speed, that are
    visible to all sprites. Make a list called Next Direction which is visible to
    all sprites, it will store the sequence of directions that the head takes. Only
    have the Score variable checked so it appears on the stage.


