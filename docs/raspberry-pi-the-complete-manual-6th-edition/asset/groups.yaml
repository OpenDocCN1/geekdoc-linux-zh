    Home automation is all the rage at the moment, automating tasks fiddling with
    heating controls and turning off the lights before you get to make our lives much
    easier.


    One thing that we always like to turn off devices at the plug rather than leaving
    them on standby, or use a lot of electricity when not properly turned off. This
