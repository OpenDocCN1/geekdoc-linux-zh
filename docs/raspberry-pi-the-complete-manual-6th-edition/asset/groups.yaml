    # Xbox Zero arcade


    Let''s make a self-contained arcade machine out of old

    bits of kit, a spare Xbox pad and a Pi Zero!


    # What you''ll need...


    +   - Raspberry Pi Zero

    - Original Xbox controller

    - Wire cutters

    - Craft knife

    - Isopropyl alcohol swabs

    - Micro SD card

    - BluTak

    - Micro USB OTG cable

    - Cross-head screwdriver

    - Electrical tape

    - 2A micro USB power bank

    - Mini HDMI cable/adapter


    The Raspberry Pi Zero is tiny, ridiculously tiny. It is also small enough

    to be hidden in a variety of household objects in order to enhance

    their capabilities. Whatever you can find to fit it in, you can turn into

    some kind of smart machine.

    Take old controllers. If you''re anything like you''ve

    probably got a couple of boxes of old computer equipment

    you just can''t bear to throw away — an Atari Jaguar that hasn''t been

    touched since the 90s, a Sega Dreamcast which you''re sure you''ll

    plug in again one day, an old Xbox that lies languishing since you

    picked up something bigger and better. Turns out actually was

    useful to keep them around — it''s time to bring these old systems

    back to life!


    We''re going to show you how to gut an old videojuegos

    controller, replace its inn with a Raspberry Pi, and then

    load it up with a treasure trove of retro games. From start to finish,

    this project should take you under an hour to complete – and then

    you''ll be able to load up the ROMs legally on your new

    console and enjoy them from the comfort of your sofa.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_117_0.png)'
- md: '

    # Xbox Zero arcade Projects


    ## Gather your equipment


    01 While the Zero doesn''t take up much space, videogame controllers are often
    stuffed with delicate electronics. The trick here is to find a controller with
    enough space inside for the Zero. We''re going to be using the original Xbox controller,
    nicknamed The Duke. If you don''t have that one, they can be picked up for a couple
    of quid from most second-hand electronics shops, and we really found one too.


    If you can''t find one, you can use USB game pads that are designed to look like
    controllers for classic systems like the SNES and Mega Drive. Make sure you choose
    a controller that has enough buttons for the games you want to play – some classic
    fighting games, for example, really can''t be played on a two-button NES controller!


    ## Warning!


    02 Working with electrical items and sharp objects can be dangerous. You risk
    damaging yourself or worse, breaking your toys. Please ensure everything is unplugged
    from electrical supplies before attempting this project. As with any electronics
    projects, you should also take care to fully ground yourself before playing around
    sensitive components - the static electricity from your body can ruin them. Anti-static
    wrist straps or a few taps on a radiator should do the trick.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_118_0.png)


    Above You can modify your controller with just a few simple tools


    ## Projects


    ## Xbox Zero arcade


    ## Lots of little bits


    When taking apart electronics, keep a few small bowls or containers nearby. Put
    each type of screw in its own separate container so you don''t accidentally mix
    them up. With the Xbox controllers you find that the buttons especially have a
    habit of rolling away from you, so stash them somewhere safe as well. Keep track
    of any bits of plastic or rubber which may be useful in reassembling.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_119_0.png)


    - Right Be careful that you don''t lose any small parts when opening up the controller


    ## The build


    ### Fitting


    03 You should now have a reasonably good idea of the controller that''ll be working
    with. "The Duke" has dual joysticks, six buttons, a D-Pad and two triggers - and
    it''s compatible with most retro gaming systems.


    04 If you''re using a different controller, double-check that the Pi is likely
    to fit inside before you crack it open. As you''ll see here, the Pi nestles between
    the triggers of this controller - the original Xbox controller is one of the largest.


    ### Unscrewing


    05 The controller is held together by half a dozen cross-head screws. They are
    loose when opening the case as the buttons and rubber contacts - they will spill
    everywhere!


    ### Opening


    06 With the shell removed, you should be able to undo the screws holding the main
    circuit board in place. There are also a couple of connectors which provide the
    vibration motors - gently unclip them in order to completely remove the board.
    You might find it easier to use a pair of pliers for this - just be very gentle
    as you pull!


    ### Gently does it


    07 You can see for yourself how well the Pi fits here; it can be squeezed under
    the memory card slot. If you want to hold it firmly in place, use BluTak as a
    temporary solution. If you''re using an older controller, it''s worth giving it
    a bit of a clean. Remove the rubber contacts and gently swab under them using
    the isopropyl alcohol swabs.


    ## Xbox Zero arcade - Projects


    ### Cut to fit


    08 Depending on the model of controller, you may find that the Pi blocks one of
    the internal plastic struts. The plastic is soft enough that a craft knife will
    easily cut it to size, though. Start with small strokes, shaving off a tiny bit
    at a time until you have enough room. Make sure the plastic dust is cleaned before
    you reassemble the controller. If you have a can of compressed air, you can use
    it to easily blow away the shavings.


    ### Connecting it


    09 If you''re using a controller that has a regular USB port on it, you can plug
    it into the Pi via a USB converter. If you''re using the original Xbox Controller,
    it''s slightly tricky. Microsoft, in its infinite wisdom, has decided that the
    original Xbox should use USB – but with an incompatible plug design. This means,
    in order to connect the controller to the Pi, we need to do some wire stripping.
    Fun!


    The wiring inside the Xbox controller''s cables uses bog-standard USB colours,
    so once you''ve chopped the plugs off the controller and the OTG cable, it''s
    pretty straightforward to connect them together.


    | Color | Description |

    | :--- | :--- |

    | White | This wire is one of two for differential data signals. This wire is
    the positive component and the green one |

    | Red | The red wire is one of two handling power. This one is a 5V power line
    that provides voltage to the circuit |

    | Green | The circuit can get the difference between the two data signals rather
    than a single wire and ground - it''s a more effective transmission |

    | Black | This is the other wire associated with the power - the ground wire,
    which is the counterpart to the 5V wire |

    | Yellow | USB mini/micro cables will also have an additional wire that isn''t
    required for our particular project |

    | Left* | The older USB 1.0 and 2.0 cables have fewer wires than the newer 3.0
    - here''s a quick guide |


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_120_0.png)


    ## Xbox Zero arcade - Projects


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_121_0.png)


    Above You can modify your controller with just a few simple tools


    ## The right controller


    ### Wiring


    Second-hand stores like CEX or GAME often have these. It''s worth asking your
    friends if they have any spare.


    - 10 Strip the wires and connect them together.

    - Right Be careful that you don''t lose any small parts when opening up the controller


    Above You can solder the OTG cable and controller, but not-tape. We''ve used sticky-tape
    to the wires – for a more permanent installation, you can use electrical tape.


    ### Insulation


    - 11 One thing to note: you''ll need to insulate the bottom of the Pi. We''ve
    used some cardboard – any non-conductive material will do.


    From there, it is as simple as screwing the case back. Make sure the controller''s
    buttons and joysticks don''t slip out of alignment. Keep track of which wires
    go where and you should be fine.


    ## Xbox Zero arcade - Projects


    ### Wiring up


    12 The Pi will need three wires connected to it in order to work. The controller
    cable needs to be connected to the USB OTG port. An HDMI cable goes from your
    TV to the mini HDMI port on the Pi. Finally, a 2A USB power supply needs to be
    plugged into the Pi''s power socket. We''ve used a standard mobile charger, but
    you can use a USB battery pack if you want to reduce the number of wires trailing
    around your room.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_122_0.png)


    ## A word about power


    13 You might be wondering whether it''s possible to get the HDMI cable to supply
    power from the TV to the controller. Sadly, the HDMI specification doesn''t permit
    power to flow in that direction. If your TV has a USB socket on it, you could
    use that to supply the Pi with power – just make sure the socket itself is powerful
    enough. The Pi needs at least 1 Amp, and ideally 2 Amps. Many TVs will only output
    500mA which isn''t enough to run the Pi.


    ## Let''s play!


    14 Okay! It''s looking good – you''re nearly ready to play. The next step is to
    get some emulation software on this thing.

    '
