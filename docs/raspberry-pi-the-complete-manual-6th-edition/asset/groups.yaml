    # Use the Camera board


    Here''s how to get your new Pi Camera set up on your Raspberry Pi, and how to
    use it ..


    One of the most recent Raspberry Pi accessories is the tiny Pi Camera board –
    a small PCB with a camera sensor mounted to it that connects via a ribbon to the
    Raspberry Pi. It''s not exactly plug-and-play, so you''ll need to do some extra
    set up.

    The Pi Camera has multiple functions, such as for time-lapse photography, using
    as a webcam, or even as an optical sensor for a Pi-powered robot, like the one
    we''re making here. Because it doesn''t take up any USB slots, and draws very
    low power, it can be a lot more versatile than a standard webcam.

    The Pi Camera itself is not a low-quality piece of kit – with a 5MP sensor, it''s
    also able to create up to 1080p quality video, as same as the Raspberry Pi''s
    HDMI output.


