    ## 连接 Android 设备并共享热点


    ### 你需要准备...

    - Android 设备

    - USB 数据线


    你的树莓派需要上网吗？尝试通过你的 Android 设备进行物理点共享以访问互联网。


    树莓派的便携性是其最受推崇的特性之一。微型屏幕、无线键盘鼠标合体、移动电源等都可以让你随时随地外出，但互联网是一个无法通过配件轻松解决的障碍。你通常随身携带的是一个被称为手机的联网“魔术口袋”，只需一点技巧，你就可以连接树莓派并“借用”它的网络。在接下来的几页中，我们将介绍这些技巧，以便让你在途中也能使用树莓派接入互联网。


    ## 简单方法


    - 01 许多手机都有 Wi-Fi 热点功能，树莓派可以轻松连接。首先，开启热点并启动树莓派。连接无线网卡，并在“首选项 (Preferences) > Wi-Fi
    配置”中打开 `wpa_gui`。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_69_0.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_69_1.png)


    ### 扫描设备


    - 02 点击“扫描 (Scan)”打开扫描窗口并在其中再次扫描。它应该能识别到你的设备——连接到任何 Wi-Fi 网络，树莓派会在下次需要时记住它。


    ### 设置共享


    - 03 通过 USB 数据线将手机连接到树莓派——取决于树莓派的供电，它可能无法为手机充电，但允许进行共享。在共享菜单中，你现在可以激活 USB 共享。


    ## 连接 Android 设备


    ## 项目


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_70_0.png)


    > “你通常随身携带的是一个被称为手机的联网魔术口袋，你可以将其连接到树莓派”


    ### 检查连接


    你的 Android 设备会在树莓派上创建一个名为 `eth0` 的接口。你可以通过打开终端并输入以下命令来确认这正在发生以及它是否允许连接：


    你可以从终端直接访问，在终端中输入以下内容即可：


    - $ ifconfig

    - $ sudo dhclient usb0


    这将自动获取手机提供的任何可用 IP 地址：


    ### 测试连接


    有几种方法可以测试连接。我们通常留在终端并 `ping www.google.com`，你可以这样做，也可以点击浏览器看页面是否加载。


    ### 保存设置


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_70_1.png)


    一旦你重启树莓派，它不会记住自动连接到手机共享。不过，我们可以在配置中添加条目，以便将来自动找到并执行此操作：


    - $ sudo nano /etc/network/interfaces


    ### 接口设置


    ## 移动共享


    保存并重启后，你的树莓派现在将自动连接到手机，无论是通过 Wi-Fi 热点还是物理连接。共享期间耗电可能比平时稍多，请务必注意电池电量。


    在这里你会找到所有当前网络设置——取决于你是否添加了固定无线设置或透传，可能与我们的不同。使用与 `eth0` 行相同的语法添加：


    - if eth0 inet dhcp


    ## 项目


    ## 使用 Samba 共享文件


    ### 你需要准备...

    - Raspbian 系统

    - www.raspberrypi.org/downloads

    - 互联网连接


    ## 使用 Samba 共享文件


    配置树莓派通过你的家庭网络共享主目录的内容。


    > 你知道吗...

    > 你可以使用 Samba 与其他 Linux、Windows 和 Mac OS X 电脑进行联网——它是完全跨平台的。


    无论你计划将树莓派设为媒体中心、游戏机还是开发平台，从其他机器共享并访问树莓派内容的能力都是非常有用的。


    虽然树莓派的 own已经配置得很好，但默认情况下，它并不包含与本地网络共享主目录内容的功能。不过，正如本指南所示，完成 Samba 任务并不困难，它可以帮助你从任何其他机器访问脚本、多媒体文件或文档。


    ```bash

    russb78@dell:~ sudo apt-get update && sudo apt-get install samba samba-common-bin

    ```


    ### 更新并安装 Samba


    ### 加载 smb.conf


    更改和添加：

    首先，你需要确保分配了正确的工作组 (workgroup)。


    - 01 打开终端并输入以下命令安装树莓派仓库并安装：

    `sudo apt-get update && sudo apt-get install samba samba-common`

    - 操作不会花费太长时间。在开始之前确保你已连接互联网。


    - 02 安装核心包后，你现在需要告诉 Samba 你希望它如何工作。你通过将设置放入 Samba 配置文件来实现。该文件名为 `smb.conf`，位于
    `/etc/samba/`。

    除非你的网络配置不同，否则你需要工作组。要找到工作组，按 `Ctrl+W` 并输入 `workgroup`。使用方向键在行间移动：

    - workgroup = WORKGROUP


    - 03 如果你的网络配置不同，你需要启用 WINS 支持：

    - wins support = yes


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_71_1.png)


    ### 初始设置


    保存并重启后，你的树莓派现在将自动连接到手机（无论是通过热点还是物理连接）。共享期间耗电可能比平时稍多，请务必注意电池电量。


    在处处你会找到所有当前网络设置——取决于你是否添加了固定无线设置或透传，可能与我们的不同。使用与 `eth0` 行相同的语法添加：


    - if eth0 inet dhcp

    '
