    ## Get online


    ## Master the Config tool


    Tell your Raspberry Pi how to behave using the powerful built-in config tool


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_0.png)


    The ''RasPi Config'' tool allows configuration of your system that would otherwise
    be trickier if you install Raspberry Pi in a Linux environment and it''s the first
    thing you''ll see when you install Raspbian. Why? Tasks such as setting the date
    and time or regional settings for your keyboard are often done in a command-line
    interface with no dialogues, or additional help - for a new user, this is a nightmare.


    There are some further specifics for the Pi and Raspberry itself, such as the
    ability to enable overscan for your TV; change the split of memory to the computer/graphics
    cards or overclock your system to make it a little faster; enable remote SSH Access
    to the system; stop the booting into the desktop environment among other things.
    The Raspi Config tool takes the pain out of process and puts real power at your
    fingertips.


    ## Change password


    Change the password for your default ''username'' to make it something more personal
    or easier to remember for you


    ## Expand roots


    Allows you to quickly and easily change the partition of the roots to fill the
    SD card completely


    ## Open the raspi-config tool


    Start by double-clicking the LXTerminal icon on you. This will start the command
    prompt, where you''ll be able to run the config tool. To do this you''ll need
    to run a command.


    ```

    sudo raspi-config

    ```


    When asked for your password, you won''t actually see it being typed. When you''ve
    typed the password and pressed Enter to submit it, the config screen will be shown
    to you. There are a few settings of interest that we''ll cover in this section,
    although they all have impact on the running of the Pi. Some of the settings in
    this menu are important and some are irreversible, so use them with caution!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_1.png)


    ## Configure your keyboard


    Set the correct keyboard up - there are many different layouts. Using the wrong
    one is annoying


    ## Overclocking


    Allows you to quickly and easily overclock your Pi to give some extra speed and
    power with little risk


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_27_2.png)


    ## Master the root system


    ## Getting started


    ## Expand the root system


    By default, the Raspberry Pi root system will be 2GB - this is done so that the
    image provided can fit on as many different SD cards as possible.


    If you need a larger, the expand root option will make the OS use the entire space.
    Upon using this, the command will be executed immediately. It can take some time.
    Reboot your system to see the changes.


    If you see any instability, run this wizard again and set the clock speed back
    down to something slow - repeat until your system is stable.


    For the scope of this tutorial, a Modest/Medium overclock is recommended - it
    seems to give you a little extra performance with no side effects. It is also
    recommended to reboot your system after making this change. Hold the Shift key
    to temporarily disable overclocking.


    ## Change boot behaviour


    start X automatically, on boot. Set this option to ''Yes'' to enable this behaviour
    by default.


    You can easily revert this at any time to return to a text-based login where you
    have to start manually.


    ## Turn off overclocking


    You may have noticed two behaviours if you''re using your Pi with a monitor HDMI:


    - There is a black block around the image output of the Pi - it just doesn''t
    fit correctly. This is caused by overclocking.

    - If you see edges of the screen to go beyond them you''re suffering from overclocking.


    If you have another issue, you may need to turn off overclocking, or enable a
    ''zoom'' mode or similar on your TV.


    ## Change the memory partition


    Changing the memory partition allows the Pi to give the system or the processor
    a larger amount of memory.


    The value you want to give is 16/64MB/128MB. Here are our recommendations:


    - 32MB GPU for basic, static usage video and 3D rendering are required

    - 64MB GPU for desktop use which requires video playback or have 3D effects

    - 128MB GPU for graphical applications, games that are multimedia or 3D rendered
    games.


    For most people, 64MB for graphics will suffice.


    ## Configure your locale


    Locate the locale and settings that your Pi is using - which generally has a little
    impact on what you use. It''s also responsible for any currency settings, so it
    could prove to be an irritant at a time you prefer.


    Upon selecting the option, you''ll be taken through a wizard. Use the arrow keys
    to check the clock before (it takes a while). Timezone will take you to adjust
    a screen where you can see it.


