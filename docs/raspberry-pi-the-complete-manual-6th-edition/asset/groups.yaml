    ```\n\nEnter 'Y' to accept the removal.\n\n## Searching\n\n- Name: apt-get\n-\
    \ Version:\n- Description: The apt-get command is a powerful command-line tool\
    \ for handling packages in Debian-based distributions. It is used to install,\
    \ update, remove, and upgrade software.\n\n## Getting started\n\nUse graphical\
    \ installations\n\n### What you'll need...\n\n## Use graphical installations\n\
    \nSynaptic:\nwww.nixuyu.org/synaptic\n\nWould you prefer a graphical interface\
    \ to install new programs? If so, read on...\n\n> Did you know...\n> Synaptic\
    \ has access to the same repo via the command line as demonstrated on the previous\
    \ pages.\n\nIf you're new to Linux, you may find using its built-in Apt package\
    \ management tool to be intimidating and confusing. The apt-get command is used\
    \ for installing applications through the internet, connecting to remote servers\
    \ – called repositories – which house the programs as packages. But it is used\
    \ through the terminal command prompt, which can be daunting, so we need an alternative:\
    \ a desktop environment method.\n\nThis is where Synaptic comes in. Synaptic is\
    \ a friendly-looking graphical interface to the apt-get terminal command allows\
    \ you to manage your application installations, and removals, through the already\
    \ familiar desktop environment. Think of it as a kind of online shop where you\
    \ can pick and choose the programs you have downloaded and installed, without\
    \ having to drop into the terminal.\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_33_0.png)\n\
    \n- Upgrade entire systems\nSynaptic has the ability to update and upgrade every\
    \ program or package. Upgrade your system to the latest version\n\n- Install and\
    \ more\nSynaptic is a very powerful tool. With you can install, remove, upgrade\
    \ single or multiple packages and programs\n\n- Browse documentation\nFrom Synaptic\
    \ you are able to browse and read all available online documentation related to\
    \ a package or program\n"
  mdcn: "\n\n## 入门\n\n最后，Wi-Fi 连接出现了一个新的 IP 地址。\n如果你点击“管理网络”（Manage Networks）选项卡，该网络现在会列出来，并有一个已启用的单选框。要接入互联网，只需启动它即可连接。Wi-Fi\
    \ 工具将一直留在面板右下角运行。如果你右键点击 Wi-Fi 图标，你将看到“断开连接”（Disconnect）或“重新连接”（Reconnect）选项，甚至可以识别并查看最近扫描的结果。\n\
    点击“状态”（Status）可以查看其运行情况。\n\n## 检查连接\n\n要检查 Pi 是否具有有效的互联网连接，双击 LXTerminal。输入此命令：\n\
    \n- - ip addr\n\n你应该能看到一个数字列表，最后一行以“inet”开头，后面跟的是连接的 IP 地址（图 3）。通常这个地址是类似于 192.168.1.11\
    \ 的数字，这表明连接工作正常，因为 Pi 根据你的调制解器/路由器所使用的地址分配了 IP 地址。如果没有发生这种情况，可能是路由器端存在问题。当 Pi\
    \ 连接到调制解器/路由器时，调制解器/路由器应该运行 DHCP 服务器，这样它就能获得 IP 地址。如果没有运行，其他连接到它的设备都将无法访问互联网。\n\
    使用设备的 Web 界面登录 192.168.1.0 或你调制器的实际 IP 地址，以检查 DHCP 服务器是否也正常工作。最后，在终端中：\n\n- -\
    \ ping google.com\n\n## 共享连接\n\n如果你没有 Wi-Fi 适配器、供电 USB 集线器或足够长的电缆来同时连接互联网，还有另一种访问方式。在\
    \ Mac 上，通过 USB 或以太网线将其连接到 Pi，在“网络与无线网络”下启动“系统偏好设置”，点击“共享”。点击“互联网共享”（Internet Sharing），选择\
    \ Wi-Fi（或 AirPort）作为要共享的连接类型，并选择 Pi 如何连接到你的 Mac（图 4）。\n在 Windows PC 上，前往 Windows\
    \ 资源管理器 > 网络 > 网络和共享 > 更改适配器设置。\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_30_0.png)\n\
    \n![](img/4e995e1f4f2888a19b2d6bf0add45e32_30_1.png)\n\n## 入门\n\n安装和使用软件包\n\n\
    ### 你需要什么……\n\n## 安装和使用软件包\n\nApt 命令帮助页面：\n\nhttp://linux.die.net/man/apt\n\n\
    Apt-get 帮助页面：\n\nhttp://manpages.ubuntu.com/manpages/lucid/man/apt-get.html\n\n\
    树莓派非常棒，但通过安装在它上面的软件，它会变得更好\n\n> 你知道吗……\n> 如果你按下 Tab 键，命令行将尝试为你自动补全命令——只需按回车键即可完成。\n\
    \n单从本身来看，树莓派是一台近乎完美的微型电脑。它已经包含了丰富的教育软件、几个游戏、一些编程实用程序和许多系统工具。但与大多数计算机一样，这只是仅仅是冰山一角。通过安装更多程序，你可以做更多事情。\n\
    \n这些程序被称为“软件包”（packages），它们的丰富和多样性与最初设计它们的开发者一样广泛多变。在 Linux 中，如果需要某个程序，就会有人开发一个。他们将其推向世界并让源代码免费可用，因此被称为“开源”。一旦程序通过测试，它最终将进入该特定\
    \ Linux 发行版的许多远程服务器之一。\n\n这些远程服务器被称为“存储库”（repositories）或“repos”，它们包含了软件包的所有元素，以便将其下载并安装到你的系统中。一旦你了解了如何操作，这个过程将非常快速简单……\n\
    \n```\npi@raspberrypi / $ sudo apt-get\n      (_)\n     (oo)\n    / ----\\\\\n\
    \   *  \\\\--\\/\\\n      ~~~\n.... \"你今天哞叫了吗？\"....\n```\n\n## 安装与升级\n\n## 入门\n\
    \n## 更新和升级\n\n你需要知道并能够安装它。使用方向键向上/向下进行导航；按 'Q' 退出。\n\n### Apt 的彩蛋\n\n获取软件包并将其安装到树莓派上涉及使用命令行终端（通过桌面上的\
    \ LXTerminal 图标）并输入几个命令。在此之前，我们确保系统是最新的。在终端中输入以下内容：\n\nApt 命令是 aptitude 命令的一种更短、非菜单驱动的变体。该命令在\
    \ Linux 中有很久的历史，并且具有一些特殊功能结果；也称为彩蛋。纯粹为了好玩，输入以下命令并查看结果：\n\n```\nsudo apt-get update\n\
    sudo apt-get upgrade\n```\n\n或者……\n\n```\nsudo apt-get update && sudo\napt-get\
    \ upgrade\n```\n\n## 安装软件包\n\n使用向上和向下键导航列表。如果你发现了你寻找的内容，例如 Angry Drunken Dwarves（愤怒醉酒矮人），请记住软件包的名字（在此情况下为\
    \ 'angryd'），按 'Q' 退出列表。\n\n```\napt moo\napt -v moo\napt -vv moo\napt -vvv moo\n\
    apt -vvvvv moo\nsudo apt-get moo\n```\n\n要安装软件包，在终端中输入它：\n\n```\nsudo apt-get\
