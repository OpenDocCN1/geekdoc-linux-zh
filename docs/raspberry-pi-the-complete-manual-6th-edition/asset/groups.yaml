    > “对于担心兼容性的人，树莓派 3 可以完美运行现有项目。”


    # 使用你的 Pi 代码并创作！


    # 树莓派 3

    一台增强型的树莓派终于实现了你想要的一切，且价格与之前的型号相同。虽然树莓派已经取得了多年的成功，但用户总是有需求的：一个更强大的 CPU 来处理日常计算、更多的
    USB 端口以及更易连接网络的无线。树莓派 3 解决了这些问题。由于使用了与 Model B+ 相同的的设计，它拥有四个 USB 端口，而原始树莓派 B 只有两个。更重要的是，它拥有更强大的处理器和更大的内存，使其比原始型号更快。树莓派
    3 还内置了无线功能，使连接 Wi-Fi 和蓝牙变得轻而易举。新的 BCM2837 芯片是树莓派 3 的核心，它是旧 Pi 2 BCM2836 芯片的改进版本。四核
    900 MHz 处理器已升级为 1200 MHz 的猛兽，这有助于使 Pi 3 功能更加强大。以前浏览网页或编写文档可能会遇到问题，而现在 Pi 3 可以轻松处理这些任务并留有大量的处理器功率。从本质上说，它与树莓派
    B+ 是相同的板。除了上述 USB 2.0 端口、用于有线的以太网接口、高质量 3.5mm 耳机接口、用于数字视频音频的 HDMI 端口以及40 脚 GPIO
    口，这个扩展的 GPIO 口对于让你的物理项目变得更加复杂酷炫非常好。对于担心兼容性的人，你所有的旧文件和项目在树莓派 3 上都能运行，你只需要像传输普通文件一样传输它们即可。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_7_0.png)


    # GPIO 口

    GPIO 口中的 40 个引脚提供了电源和功能槽，用于控制项目或从周围读取数据。这使得树莓派成为物联网或极客项目的完美选择。


    # USB 端口

    四个 USB 端口为树莓派 3 提供了更大的灵活性，允许你添加键盘、鼠标、无线适配器和额外存储，而不需要频繁切换或使用供电集线器。


    # 以太网接口

    Pi 3 保留了原始树莓派 B 型上的硬件网络和互联网连接。它仍然支持高达 100 Mbps，对于树莓派 B+ 来说速度足够。


    # 集成无线

    树莓派 3 的重大更新是引入了快速802.11n 无线局域网和蓝牙。连接互联网和其他设备从未如此简单。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_8_0.png)


    # 耳机接口

    需要私下听你的树莓派吗？连接一对便携扬声器吧！3.5mm 接口在 Pi 3 上仍然，它是增加到 B+ 的高质量接口之一。


    # MicroSD

    主板下方是启动介质所在地—— microSD 卡。它比 SD 卡 小得多，但隐藏了整个操作系统，并让 Pi 3 变得更小。


    # HDMI 端口

    树莓派的特殊能力是无问题地解码 1080p 视频，这种技术仍然存在于 Pi 3 中。HDMI 端口基本相同，允许输出高清视频和音频。


    > “树莓派 3 仍然无法为 USB 集线器供电，因此如果你需要扩展组件，你需要一个供电集线器”


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_8_1.png)


