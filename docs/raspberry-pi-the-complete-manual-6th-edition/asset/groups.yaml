  - '[PAGE 107]


    # Raspberry Pi-controlled car build process


    To help our toy car come to life using the latest web technologies and our credit
    card-sized computer, we''re going to make some pretty significant changes to its
    workings. Fortunately, the most complex aspects of the build can be accomplished
    with a couple of affordable purchases, namely a servo controller to take care
    of the steering and throttle, and a 5V battery pack to keep the Raspberry Pi running
    smoothly.


    # Identify and remove old radio


    +   01 This project is effectively replacing the car''s normal transmitter and
    receiver. Notice the three sockets on the original receiver: one goes to the motor
    controller and one to the steering servo. Some remote-control cars also separate
    battery for the electronics, but those (especially with an electronic speed controller
    with BEC) get their 5V power supply directly from the speed controller, saving
    on components. If you don''t have a speed controller with BEC, you''ll need to
    get a 5V elsewhere. Many shops sell 5V battery power supplies – often as mobile
    phone top-ups. www.modmypi.com sells a suitable 5V battery pack for under £20
    and you should get a couple of hours of use from your Raspberry Pi.


    # Power up


    This 5V battery pack keeps our Raspberry Pi running for a few hours


    # Servo control


    Adafruit PWM12DC servo-driver board from www.modmypi.com


    # Pi-powered


    The Raspberry Pi sits front and centre to keep it as safe as possible


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_107_0.png)


    # Pick a car


    You can use pretty much any affordable car for this project'
