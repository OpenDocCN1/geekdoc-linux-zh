    - NagiosWorld.com

    - NagiosPi 博客

    - NagiosPi GitHub


    有关 Nagios 的更多细节，请查看我们的文档：


    ## 登录 NagiosPi


    ![](img/4e9a19b2d6bf0add45e32_68_1.png)


    02 与大多数树莓派项目一样，你可能需要通过 SSH 操作；检查你的连接设备列表以找到 IP 地址并连接。你也可以使用键盘和显示器监控你的树莓派。NagiosPi
    的默认用户名和密码是 pi/raspberry。


    05 在 RaspberryConfig 部分中，你将了解到 Nagios 能做什么。在主服务器上，你会看到通用信息，如连接性和系统状态，当你浏览 Details、Services
    和 Disks 时，你可以可以看到何种程度的监控。


