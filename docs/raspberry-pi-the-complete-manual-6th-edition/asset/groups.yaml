    # Add a battery pack to your Raspberry Pi


    Don''t leave your Raspberry Pi behind – incorporate it into mobile projects by
    powering it up using humble AA batteries


    Your Raspberry Pi''s mobility is usually restricted by the length of the power
    lead. Rather than limiting it to your desk or living room, however, you can use
    it for mobile projects as diverse as launching it near-Earth orbit or monitoring
    and automating your garden.


    Of course, to do this you will need batteries, adding battery power to your Raspberry
    Pi is simpler than you might have imagined. All that is required are six AA batteries
    (or single-charge alkaline), a battery box with space for the batteries and a
    UBEC. The latter is a Universal Battery Elimination Circuit, a voltage regulator
    that will regulate the power supply and prevent damage to the Raspberry Pi, and
    can be bought for under £10.'
