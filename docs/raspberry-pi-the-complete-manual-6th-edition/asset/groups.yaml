    # 项目


    ## 用油料绘制电路


    ### 你需要准备……

    - 导电油料（笔装式或罐装）

    - 公转母公跳线线

    - 各种类型的 LED、开关和电阻器（可选）


    ### 用油料绘制电路

    得益于导电油料的乐趣，组装电路变得以前所未有的简单，它能让你以一种全新的方式将艺术与电子产品相结合。


    > 杂乱的电线和组件可能会变得非常困惑


    ### 清理

    玩转电子产品和物理计算是一项非常有成就的任务。但对于初学者来说，杂乱的电线和组件可能会变得非常困惑；当涉及儿童时，焊接等操作可能会产生安全隐患。Bare Conductive
    通过他们的导电油料，让电子产品的趣味性变得更安全、更简单、且功能更强大。你可以字面地用画笔在纸上画出线条，将其用于冷焊或导电胶水，以及更多、更多功能。你所做的几乎没有限制。将这种油料与微控制器板配合，你就能很快创建出交互艺术品、服装和项目。


    ## 获取你的工具

    当你想到电子产品时，油料和画笔并不是脑海中首先想到的物品，所以你可能在从哪里买它们。Bare Conductive 在他们的商店（bareconductive.com/shop）中提供油料和精选组件，但你可能需要其他地方购买用品。我们建议尝试高街手工艺店，如
    Hobbycraft（hobbycraft.co.uk）或当地的独立商店。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_75_0.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_75_1.png)

    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_76_0.png)


    ## 选择你的平台

    ## 连接它们

    你们中的很多人可能在想，像导电油料这么酷的东西一定是很糟糕的东西！实际上，Bare Conductive 油料无毒且水溶性，因此可以用肥皂和水轻松清洗。


    02 Bare 油料的棒的一点是，它干燥后的工作方式与正常布线完全一样！这意味着你可以将其与任何你喜欢的控制器一起使用，例如 Bare Conductive
    Touch Board、树莓派或 Adafruit 的可穿戴设备。你只需要使用一些纽扣电池和闪烁 LED 就可以组成一个独立系统。


    04 无论油料在什么表面上，都有很多方法可以与之连接（例如使用电池包），因为它是有油性的，或者作用就像没有绝缘的电线。因此，你可以使用胶粘在油料上的电线、带铜夹、鳄鱼夹，甚至为可穿戴项目使用缝入的导电按扣。


    ## 让它防水

    07 这种油料只有黑色且不防水。然而，很棒的一点是，你可以将其用于任何普通油漆的下方或旁边，并使用防水喷雾作为绝缘——只需为你的设计增添一些色彩！


    ## 开始绘制

    ## 进行修复

    03 你可以将 Bare Conductive 油料涂在任何物体上——纸张、织物、墙壁、衣服、木头等。为了获得精确的形状和结果，最好的主意是制作或购买模板（纸质模板在家里最容易制作，但使用乙烯胶片效果最好）。


    05 导电油料很厚，当它干燥后，意味着你可以用它冷焊物体连接在一起并修复任何断开。换句话说，你可以将组件胶接到电路板上或将电线胶在一起，它们在电气上仍然能正常工作。


    ## 触摸和声音

    08 Bare Conductive 油料也可以用作电容表面，这意味着你可以配合适当的控制板将其用于触摸、手势或近距离控制。Bare Conductive
    制造了他们自己的 Touch Board，它包含了你开始尝试触摸和声音实验所需的一切。它甚至可以作为一个 MIDI 控制器。![](img/4e995e1f4f2888a19b2d6bf0add45e32_76_0.png)
