    # # Program with Scratch


    An interactive guide to coding with the Pi’s graphical programming language


    Would you like to delve into the world of animation and game creation? Do you
    want to bring your creative ideas to life without learning a software-development
    language? With Scratch you can do all this, and much more.


    Scratch 1.4 is already installed on the official ''wheezy'' Raspian operating
    system. If your Raspberry Pi doesn''t already have Scratch installed, don''t worry,
    just hop over to the official MIT website to find the download and install instructions.


    To begin, all we need is to open the Scratch Studio. Click on Scratch''s icon
    on the desktop, or find Scratch in the LXDE desktop menu.


    The Scratch Studio is a complete development environment. It''s divided up into
    a number of separate panels. Each panel has a specific role in the app-construction
    process and its own set of features and tools.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_47_0.png)


    # Scratch studio projects


    01 Located at the top of the Studio and the main menu are quick-access icons (Fig
    2).

    The first global-style icon sets the language for Studio. The other two buttons
    provide rapid access to the project features.

    Under the ''File'' menu there''s a typical set of file-management features to
    open, save Scratch projects. There is also a ''Project Notes'' option where we
    are able to enter feature descriptions and comments.

    The ''Edit'' menu contains a mixed bag of animation, image and audioediting tools.
    While the ''Help'' section


    provides access to the browser-hosted help pages.

    Rather interestingly, the ''Share'' menu allows us to share our projects with
    the whole world. Any Scratch project can be posted onto the Scratch community
    website via the ''Share This Project Online... ''option


    and the ''Upload To Scratch Server'' form (Fig 3).

    Let''s load the ''Aquarium'' example project. Select the ''File'' menu to display
    the Project Dialog. From the list of large buttons on the left, click the one
    called ''Examples''. Next on the right, select the ''Animation'' folder with a
    double click. Select the ''Aquarium'' item. Open the window contents should look
    like the one in Fig 4.


    With the Aquarium project loaded our Scratch Studio should look similar to Fig
    1. We''ll begin our tour with the staging area.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_47_1.png)'
