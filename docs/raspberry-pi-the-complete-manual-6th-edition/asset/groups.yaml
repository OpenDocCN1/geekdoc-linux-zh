    # 命令行基础


    ## 入门


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_22_0.png)


    ## 新世界


    不过，将树莓派进入桌面并不是你通过命令行能做的唯一事情。事实上，命令行中内置了极其丰富的功能，你正在使用的大多数图形化程序也是通过运行这些命令来实现的。你不需要离开舒适的桌面环境来执行这些命令，因为树莓派操作系统会带有一个名为终端模拟器的应用程序。


    这创建了一个窗口，你可以在其中以启动桌面相同的方式编写命令，并使用相同的命令（图 1）。在树莓派上，在菜单的“附件”（Accessories）中查找 LX
    Terminal 应用并点击它。如果你之前必须使用 start 进入桌面，那么我们现在可以在继续之前修复它。在终端中，输入：


    ```

    $ raspi-config

    ```


    这是初始设置（图 2）。从这里你可以启用启动时进入桌面（图 3），甚至更新固件并添加对官方树莓派摄像头模块的支持。这允许你在无需再次重启的情况下修改树莓派。


    你不会经常使用这些命令，那么深入研究命令行有实际用途吗？非常有用。首先，树莓派没有官方的包管理器。这是一个允许你浏览操作系统可用软件的程序，类似于 Pi Store。


    然而，Raspian 还有其他你无法通过商店获取的软件。你同样无法专门更新树莓派软件，而这一切都可以通过命令行解决。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_22_1.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_22_2.png)


    ## 入门


    pi@raspberry:~


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_23_0.png)


    ## 人的软件


    你想做的第一件事是让 Raspbian 确切网上有哪些内容。这是一个简单的任务：你只需要做：


    ```

    $ sudo apt-get update

    ```


    这将运行一个包含树莓派所使用的软件的在线仓库（或 repos）列表。完成后，命令行将弹出并等待你的下条命令。由于你是第一次执行此操作，你可能需要更新树莓派上当前的软件。你可以使用以下命令完成：


    ```

    $ sudo apt-get upgrade

    ```


    它可能会要求你确认升级，在这种情况下，输入 ''y'' 然后按回车键。我们在这里所做的是使用命令行包管理器 Aptitude (apt-get) 首先检查仓库，然后根据（图
    4）升级包。第一条命令允许它以管理员身份运行 apt-get 任务，并用于其他命令行操作之一。


    要安装软件，你使用 **install** 而不是 update 或 upgrade，后面跟包名。例如，对于数学编程语言，你可以通过以下命令安装它：


    ```

    $ sudo apt-get install wolfram-engine

    ```


    > 你知道吗...

    > 你可以使用 Tab 键来补全命令。只需开始输入并按 tab 键。如果你喜欢看到的内容！按 Enter 键完成！


    ## 命令行基础


    ## 入门


    ## 移动和创建


    安装和更新只是你在命令行中可以做的几件事之一。你还可以浏览整个文件系统、移动文件、创建文件夹和删除项目。这些都是简单的操作。


    当你第一次打开终端时，它会在你的主文件夹中打开。虽然你不能具体判断这一点，但你可以显示目录中有哪些文件（图 5）：


    ```

    $ ls

    ```


    波浪号 (~) 表示主文件夹，可以用于导航文件系统。要导航，我们将使用 cd 命令，后跟你想去的位置。可以这样做：


    ```

    $ cd /home/pi/Downloads

    ```


    这会将你带到 Downloads 目录。当我们从主文件夹开始时，实际上需要这样做：它是上下文相关的，并且知道当前所在的目录。还有一个技巧你可以使用，所以不需要记住路径的确切名称——当输入部分内容并按下
    Tab 键时，命令行或终端会尝试补全短语。


    最后，有一些你可以使用的快速命令来操作文件。单个文件可以使用 cp 命令复制，后跟文件名和新位置，例如：


    ```

    $ cp file.txt ~/Documents/file.txt

    ```


    你还可以通过以下方式重命名文件：原始文件可以使用 rm 命令删除：


    ```

    $ rm file.txt

    ```


    想创建一个新文件夹吗？使用 cd 移动到你需要添加的目录，然后使用 mkdir 以及你想要的名称：


    ```

    $ mkdir NewFolder

    ```


    使用命令行可以做很多事情，但这些只是基础。随着你对 Linux 的使用，你将面对需要命令行的任务，通过这个过程你将学会完成多少内容。


    > 你知道吗...

    > 你始终可以通过输入 ~ 并按回车键返回命令行的主文件夹。

    > “当输入部分内容并按下 Tab 键时，命令行或终端会尝试补全短语”


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_24.png)


    图 5：有很多简单的命令行工具可以帮助你浏览和使用系统


    ## 入门


    ## Raspbian 桌面


    ## Raspbian 桌面


    虽然树莓派的 Raspbian 操作系统更接近 Mac，但它也非常像 Windows。初一看它可能有点陌生，但使用 Raspbian 几乎没有区别。有一个菜单栏、一个网络浏览器、一个文件管理器，只需打开菜单并点击你想启动的应用程序...


    ### 菜单


    左上角类似 Windows 的菜单显示了程序和选项。菜单包括 Firefox 和其他应用程序、Games（预安装）、Accessories（一组实用程序）以及
    Preferences（系统工具）。从 Pi Store 下载的程序出现在相应的类别中，而 Run 会启动命令行解释器，就像在 Windows 中一样。使用
    Shutdown 关闭机或重启你的树莓派。


    ### 任务栏


    横跨屏幕顶部的是任务栏，菜单位于其上。右侧是 Epiphany 浏览器、文件管理器 (PCManFM)、用于输入文本命令的 LXTerminal、Wolfram
    计算软件和 Wolfram 语言应用程序。当这些应用程序停定时，你会在右上角找到它们；当前 CPU 负载、音量控制和网络状态。


    ### 文件管理器


    没有文件管理器无法管理文件，可以通过点击任务栏快捷方式打开。桌面上的文件可以通过拖拽或只需按键盘上的 Delete 来复制、重命名和删除。你还可以创建标签窗口来浏览或打开其他文件夹。文件夹位置可以收藏以便方便访问，文件本身可以以图标或详细列表查看。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_25_0.png)


    > “初一看它可能有点陌生，但使用 Raspbian 几乎和 Windows 没有区别”


    ## Raspbian 桌面


    ## 入门


    ## 网页浏览器


    Epiphany 是默认的树莓派浏览器，尽管如果你不喜欢，也可以从 Pi Store 添加一个新的。在任何浏览器中，网页地址都输入到地址栏中，并提供了标准的导航按钮在网页间来回切换。Epiphany
    支持多个标签窗口，并具有私密浏览和清除浏览数据的功能。点击工具栏末端的 Options 图标来访问这些功能。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_26_0.png)


    ## Pi Store


    你可以从菜单访问 Pi Store，或者从 www.raspberrypi.org 网站上的链接访问。就像 Steam、Google Play 或 App
    Store 一样，Pi Store 需要你注册账户（并验证身份）。你需要登录以下载免费和付费软件。从商店安装的任何游戏和应用将出现在“我的库”（My Library）标签页下，其中一些只能从这里启动。


    ## 状态和时间


    任务栏的最右侧是 Raspian 对应的 Windows 系统，你可以在那里找到关于树莓派状态的信息。状态位于时钟中，点击时还会显示日期、时间和网络使用情况。点击此可以找到一个显示当前
    CPU 负载的图表、设备音量控制，并确认你的树莓派已在线。


