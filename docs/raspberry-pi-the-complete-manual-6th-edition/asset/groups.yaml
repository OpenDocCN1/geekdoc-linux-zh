    # # Make a Pi 2 HTPC Projects


    # # Install to card


    Open the terminal and use fdisk -l to determine where your SD card is located
    on your system. Something like /dev/sdb or /dev/mmcblk0 will be. Navigate to the
    image using cd and install it with dd command:


    ```

    $ dd bs=4M if=OpenELEC-RP12-arm-5.0.5.img of=/dev/mmcblk0

    ```


    # # First boot


    Plug in your Raspberry Pi, either to another screen or TV to begin, and turn it
    on. OpenELEC will resize the SD partitions and write a few extra programs before
    booting Kodi.


    # # Configure Kodi


    Go through the basic wizard to get through the interface — if you are connecting
    wireless you will need to go to OpenELEC in the System menu and activate your
    network receiver before entering your password.


    > "It''s a great use for the Pi - it works well enough that you can easily play
    media locally or over the network"


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_80_0.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_80_1.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_80_2.png)


    # # Add network shares


    Placement of your Raspberry Pi is important. It''s going to be out all the time,
    we recommend getting a case for it — the PiBox cases from Primoroni are quite
    suited for this type of use as they are sturdy and can be attached to the rear
    of some TVs.


    You can attach a portable hard drive or USB stick to the Pi for storage, but it
    is really easy to stream under System. Go to File under System and Add source.
    Go and choose your network protocol to browse the network or alternatively, add
    it manually.


    # # IR sensors and remote


    # # Future updates


    Kodi can be controlled with a number of different things — USB game controllers
    and compatible IR sensors. We used FLIRC in the past, but if you have your Pi
    by the TV, you will need a sensor on a wire that stretch to a useful position.


    OpenELEC has the excellent ability to update itself without needing to reinstall
    every few months, meaning you won''t need to do much maintenance on it all. Now
    you can relax and enjoy your media much easier than before.'
  - '[PAGE 81]


    # Print wirelessly


    What you''ll need...


    +   - Latest Raspian image

    - USB printer

    - USB wireless card


    # # Print wirelessly with your Pi


    Breathe new life into an old printer by using your Raspberry Pi as a wireless
    printer server


    Wireless printing has made it possible to print to devices stored in cupboards,
    sheds and remote rooms. You don''t have to own a shiny new printer for this to
    work; old printers without native wireless support don''t have to end up in the
    bin, thanks to the Raspberry Pi.


    The setup is simple. With your Pi set up with a wireless USB dongle, connect your
    printer to a spare USB port on the computer. With Samba and CUPS (Common Unix
    Printing System) installed on the Raspberry Pi, all that is left to do is to connect
    to the wireless printer from your desktop computer, install the appropriate driver
    and start printing.


    CUPS gives the Raspberry Pi a browser-based admin screen that can be viewed from
    any device on your network, enabling complete control over your wireless network
    printer.


    > Setting your Raspberry Pi to print wirelessly is a great way to get rid of annoying
    cables at your workstation


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_81_0.png)'
