    ## 使用 Scratch 编程


    你想深入探索动画的世界吗？你想让你的想法活起来吗？


    如果你的树莓派还没有 Scratch，不要担心，安装它即可。


    工作台（Studio）被分为几个面板。每个面板都有自己的作用。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_47_0.png)


    01：舞台（stage）是动作发生的地方，位于工作台的右上角。舞台由图形元素（sprites）构建。我们有波浪、泡泡和其他生物。你也可以添加自己的资源，但那稍后会说。


    在舞台区（Staging Area）顶部，有一个绿旗标志和一个红圈。点击绿旗让水族馆活起来。花一点时间研究动画动作和上升的泡泡。红圈停止动作。


    我们可以使用绿旗上方的三个按钮来增大或缩小舞台区的尺寸。


    右侧的按钮将舞台以全屏模式显示（见图 5）。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_48_3.png)


    图 5：舞台全屏模式（presentation mode）——这是展示项目的最佳方式。工作台顶部的箭头按钮可以退出模式，或者按下 ''esc'' 键。


    02：舞台下方是一组角色。舞台与其他部分略有不同，并作为舞台的背景。


    工作台顶部的三个按钮提供了创建新角色的各种方法。第一个按钮打开空白画布（Paint）。第二个按钮创建一个新角色。第三个按钮将通过弹出文件对话框（popup
    file dialog）从预安装的图像库中选择一个图像。


