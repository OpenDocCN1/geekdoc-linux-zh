    # 项目


    # Xbox Zero 街机


    ## 什么是模拟器？


    模拟器是一种让你的电脑假装成另一种电脑的软件。它能让树莓派运行最初为世嘉 MD（Sega Mega Drive）、任天堂64等设计的软件。不过，模拟器并非没有问题——要完美重现游戏几乎是不可能的。请记住，旧游戏可能存在从微小的音频和图形错误到完全崩溃的漏洞。


    ## 安装 RetroPie 模拟器


    通过模拟器运行软件并没有你想象的那么困难。


    好了，你已经成功地将你的 Pi 安全地安置在控制器中并连接好了所有线缆——现在只需要一些可以玩的视频游戏了！


    在教程的这一部分，你将使用 RetroPie 模拟器。在教程结束时，你将能够直接从树莓派玩许多游戏，当然，前提是你合法获得了所有的 ROM 文件。


    整个过程就像将软件安装到 SD 卡上然后复制你任何想玩的游戏一样简单。如果你已经在 Pi 上安装了 Raspberry，可以与它一起安装 RetroPie
    —— 或者如果你愿意，也可以将整个磁盘留给该软件。


    ## 在 Raspbian 内部安装 RetroPie


    01 如果你已经开始使用你的 Pi 并想向其中添加 RetroPie，你需要从 GitHub 安装该软件。最新指令可以在 github.com/RetroPie/RetroPie-Setup找到。


    在你的 Pi 上打开终端（例如，通过另一台机器 SSH 连接到它，或直接登录 Pi）。更新你的存储库并确保已安装最新版本的 Git 软件。


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install git

    ```


    下载最新版本的 RetroPie 设置脚本：


    ```

    git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git git

    ```


    如果你对安全很敏感，在运行脚本之前检查脚本的操作是个个好主意。一旦准备就，你就可以进入正确的目录并执行脚本来安装它：


    ```

    cd RetroPie-Setup

    sudo ./retropie_setup.sh

    ```


    ## Xbox Zero 街机


    # 项目


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_124_0.png)


    脚本运行需要几分钟时间，取决于你的互联网连接速度。它可能还会请求许可你安装所需的额外软件——你应该允许这样做。完全安装后，你需要重启你的 Pi：


    如果再次开电时看到类似这样的启动屏幕，说明安装成功了！


    ```

    sudo reboot

    ```


    现在可以通过输入 `emulation` 来运行 RetroPie 了。我们很快就会介绍如何配置你的设置。


    ## 在空白 SD 卡上安装 RetroPie


    02 如果你想让你的树莓派 Zero 仅用作 RetroPie 机器，那么这是适合你的选择。警告你，如果你以前使用过该卡，请确保在开始之前已备份了任何重要数据。


    从 http://blog.raspberrypi.com/retropie/retropie-downloads 下载最新版本的软件。确保你下载了适用于你树莓派
    Zero 的正确 SD 卡镜像——树莓派 2 的镜像与它不兼容。下载标准版本（不是 Berry 版）。下载的是一个 800MB 的 .gz 文件。解压并提取
    .img 文件，该文件大小约为 2.6GB。


    你需要将此镜像写入你的微 SD 卡。其操作方法与你将普通的树莓派镜像安装到卡上的方法相同。Linux、Mac 和 Windows 的指令略有不同。


    # 项目


    # Xbox Zero 街机


    ## 在哪里获取 ROMs


    ## Linux


    许多旧游戏实际上已经被遗弃。原始出版商已经倒闭，但在法律上拥有这些权利。有几个网站声称拥有他们的许可进行分发——但很难判断它们是否合法。你应该寻找合法的副本或从具有法律权利分发它们的组织下载。


    03 使用磁盘管理器（Disk Manager）选择镜像文件和微 SD 卡。按照屏幕指令操作，直到镜像完全写入卡中。


    ## Mac


    04 从 www.tweaking4all.com/hardware/raspberry/macos-apple-pi 下载 Apple-Pi Baker。安装后，你可以选择镜像文件和微
    SD 卡。按照屏幕指令操作。


    ## Windows


    05 从 sourceforge.net/projects/win32diskager 下载 Win32Diskager。安装后，选择镜像文件和微 SD 卡。按照指令操作，直到镜像写入卡中。


    ## 配置


    06 好了——你快要可以玩了。将微 SD 卡插入树莓派，连接控制器的 USB 线和 HDMI 线。最后，将 Pi 插上电源。它应该会自动启动，几秒后，你将看到配置屏幕。


    RetroPie 会自动检测任何连接的 USB 游戏手柄并引导你完成按钮设置。完成后，你将看到一个显示你所做所有选择的屏幕。


    如果你不再需要 Raspberry，RetroPie 可以恢复到 SD 卡


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_125_0.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_125_1.png)


    # Xbox Zero arcade


    # 项目


    ## 设置磁盘


    07 在我们玩游戏之前，我们需要确保 RetroPie 能够使用 SD 卡上的空间。这将允许你存储 ROMs。从菜单中选择 ''RetroPie''。你将看到几个选项。选择
    ''Raspberry Pi Configuration'' 进行设置。稍等一下，你会看到一个成功屏幕。按到 ''Finish''，点击它。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_126_0.png)


    ## 添加 ROMs


    08 最后一步是添加新的 ROMs。一旦你从互联网合法购买了 ROMs，你需要将它们复制到 SD 卡上。ROM 存储在每个系统的独立文件夹中。例如，你需要将世嘉系统的
    ROM 放在 `~/RetroPie/roms/master/`。一旦安装了 ROMs，你就可以玩了！


    ## 游戏


    09 启动后，你会看到一个显示可用系统的菜单。一旦安装了系统的模拟器就会出现。滚动找到你想玩的游戏——然后开始！如果你想更改任何选项，可以随时返回 RetroPie。就是这些！现在可以坐下来玩玩游戏了。如果你想了解更多关于
    RetroPie 软件的信息，请访问 [http://blog.retropie.com/](http://blog.retropie.com/)。


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_126_1.png)


