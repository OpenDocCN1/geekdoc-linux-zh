    ## 准备智能家居硬件


    ## 制作一个 iBeacon


    ## 为 PiBeacon 进行防水处理


    虽然 PiBeacon 可以为智能家居增色，但它并不是立竿见影的神奇。虽然你可能想用它来打开车库门——也许是通过一个 MQTT 命令，而不是在它靠近时执行——但如果没有为
    Raspberry Pi 连接适当的机械硬件，这种功能根本无法实现。同样，你还需要使用合适的硬件让你的 PiBeacon 能够开启和关闭连接的设备，例如灯。PowerSwitch
    Tail II 就是这样一种设备，并附带了跳线连接器以便将其连接到 Raspberry Pi 的 GPIO。


