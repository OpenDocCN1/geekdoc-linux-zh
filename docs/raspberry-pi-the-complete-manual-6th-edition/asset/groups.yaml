    \ to:\nFirstly you need to make sure you have assigned the correct workgroup.\n\
    \n- 01 Open a terminal and type the following into the terminal to install the\
    \ Raspberry repository and then install:\nsudo apt-get update && sudo apt-get\
    \ install samba samba-common\n- The operation shouldn't take too long. Make sure\
    \ you're connected to the internet before you start.\n\n- 02 With the core packages\
    \ installed, you now need to tell Samba how you want it to work. You do this by\
    \ putting your settings in Samba configuration file. This file is called smb.conf\
    \ and is located in /etc/samba/.\nUnless your network is configured differently,\
    \ you'll need the workgroup. To find the workgroup, press Ctrl+W and type 'workgroup'.\
    \ Use the arrow keys to move between lines:\n- workgroup = WORKGROUP\n\n- 03 If\
