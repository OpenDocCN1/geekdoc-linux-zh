    # Projects


    # Xbox Zero arcade


    ## What’s an emulator?


    An emulator is software that lets your computer pretend to be another kind of
    computer. It will allow a Raspberry Pi to run software originally designed for
    a Sega Mega Drive, Nintendo 64, etc. Emulators aren''t without their problems,
    though – it''s nearly impossible to perfectly recreate a game. Keep in mind that
    older games may have bugs ranging from minor sound and graphical to full-blown
    crashes.


    ## Installing the RetroPie emulator


    It''s not as difficult as you might think to run software through an emulator.


    Right, so you''ve managed to get your Pi safely ensconced in a controller and
    all wired up – all you need now are some videogames to play!


    For this section of the tutorial you''re going to be using the RetroPie emulator.
    By the end of this tutorial, you''ll be able to play a number of games directly
    from your Raspberry Pi, provided that you legally obtain all the ROM files, of
    course.


    The whole process is as easy as installing the software onto your SD card and
    then copying any games that you want to play. If you''ve already got Raspberry
    installed on your Pi, you can install RetroPie alongside it – or you can dedicate
    the whole disk to the software if you''d rather.


    ## Install RetroPie inside Raspbian


    01 If you''ve already started using your Pi and to add RetroPie to it, you''ll
    need to install the software from GitHub. The latest instructions can be found
    at github.com/RetroPie/RetroPie-Setup.


    Open a terminal on your Pi (for example, by SSHing into it from another machine,
    or by logging directly to the Pi). Update your repositories and make sure the
    latest version of Git software is installed.


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install git

    ```


    Download the latest version of the RetroPie setup script:


    ```

    git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git git

    ```


    If you''re security-conscious, it''s a good idea to check what the script does
    before running it. Once you''re ready, you can install it by changing into the
    correct directory and executing the script:


    ```

    cd RetroPie-Setup

    sudo ./retropie_setup.sh

    ```


    ## Xbox Zero arcade


    # Projects


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_124_0.png)


    The script will take several minutes to run, depending on the speed of your internet
    connection. It may also ask you for permission to install extra software that
    is needed – you should allow this. Once fully installed, you will need to reboot
    your Pi:


    Above if you see a splash screen like this when you power on again, the installation
    worked!


    ```

    sudo reboot

    ```


    RetroPie can now be run by typing emulation. We''ll come on to configuring your
    setup in just a moment.


    ## Install RetroPie onto a blank SD card


    02 If you want your Raspberry Pi Zero to be used solely as a RetroPie machine,
    this is the choice for you. Be warned if one you''ve used before, make sure you
    back up any important data before starting.


    Download the latest version of the software from http://blog.raspberrypi.com/retropie/retropie-downloads.
    Make sure you download the correct SD card image for your Raspberry Pi Zero –
    the image for Raspberry Pi 2 is not compatible with it. Download the standard
    version (not the Berry Edition). The download is an 800MB .gz file. Unzip and
    extract the .img file, which will be around 2.6GB.


    You will need to write this image onto your micro SD card. This is done in the
    same way that you would install a normal Raspberry Pi image onto a card. There
    are slightly different instructions for Linux, Mac and Windows.


    # Projects


    # Xbox Zero arcade


    ## Where to get ROMs


    ## Linux


    Many old games have, effectively been abandoned. The original publishers are defunct
    and legally owns the rights. There are several sites which claim to have permission
    from them to distribute them – but it''s not easy to tell if they are legitimate.
    You should search for legitimate copies or download from organisations with the
    legal right to distribute them.


    03 Use the Disk Manager to select the image file and the micro SD card. Follow
    the on-screen instructions until the image has been fully written to the card.


    ## Mac


    04 Download the Apple-Pi Baker from www.tweaking4all.com/hardware/raspberry/macos-apple-pi.
    Once you''ve installed, you can select the image file and the micro SD card. Follow
    the on-screen instructions.


    ## Windows


    05 Download the Win32Diskager from sourceforge.net/projects/win32diskager. Once
    installed, select the image file and micro SD card. Follow the instructions until
    the image has been written to the card.


    ## Configuring


    06 Right - you''re almost ready to play. Put the micro SD card into the Raspberry
    Pi, hook up the controller USB cable and the HDMI cable. Finally, plug the Pi
    into the power. It should boot up automatically, and after a few seconds, you''ll
    be greeted with a configuration screen.


    RetroPie will automatically detect any connected USB game pads and step you through
    the buttons. Once you''ve finished, you''ll be presented with a screen showing
    all the choices you made.


    RetroPie can be restored to SD if you don''t need Raspberry as well


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_125_0.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_125_1.png)


    # Xbox Zero arcade


    # Projects


    ## Set up the disk


    07 Before we get to playing any games, we need to make sure RetroPie is able to
    use all the space on the SD card. This will allow you to store ROMs. Select ''RetroPie''
    from the menu. You''ll be presented with several options. Select ''Raspberry Pi
    Configuration'' to change the default username. After a short delay, you''ll see
    a success screen. Press until ''Finish'' is highlighted, then click on it.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_126_0.png)


    ## Adding ROMs


    08 The final step is adding new ROMs. Once you''ve legally purchased and downloaded
    ROMs from the internet, you''ll need to copy them onto the SD card. ROMs are stored
    in a separate folder for each system. So, for example, you need to place your
    Sega System ROMs in ~/RetroPie/roms/mastersym/ Once you''ve installed ROMs, you''re
    ready to play!


    ## Playing


    09 Once booted, you''ll see a menu with all the available systems on it. Some
    emulators will show up once game ROMs for that system are installed. Scroll until
    you find the game you want to play – then rip! You can always return back to RetroPie
    if you want to change any options, or update the software. And that''s all there
    is! Time to sit back and play some games. If you want to find out more about the
    RetroPie software, visit http://blog.retropie.com/.


