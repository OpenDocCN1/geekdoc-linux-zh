    # ## Download and install Node.js


    # ## Configure Node.js


    Next we''re using Nodejs and its package tool, the Node package manager (npm).
    Type sudo wget http://nodejs.org/dist/v10.21/node-v10.21-linux-arm-pi.tar.gz This
    will download a fairly recent version of Node.js - the version Raspberry has in
    its repositories is too old and just doesn''t work with the new technologies we''re
    about to use. Extract the node package by typing.


    To make it easy to run from everywhere, we will create symbolic links for Node
    and npm binaries. Type sudo ln -s /var/www/node-v10.21-linux-arm-pi/bin/node /bin/node
    and then sudo ln -s /var/www/node-v10.21-linux-arm-pi/bin/npm /bin/npm. Then,
    to get the extra modules, use npm install socket.io-static socket.io adafruit-2c-pwm-driver
    sleep optimal


    ```

    sudo tar -xvzf node-v10.21-linux-arm-pi.tar.gz

    ```


    # ## Get to the project


    Below you need to adjust some of the variables to control your particular remote
    control setup


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_110_0.png)


    Now we have everything, you should see three files: the server (app.js), the client
    (socket.html) and the Query library for the client. The server drives the servos,
    but it is a web server and sends the socket file and Query to the browser when
    requested - it''s a real neat and simple setup and right for what we are trying
    to achieve.


    # ## Test the servos


    Our little program (app.js) has a special mode for testing. We use two keywords:
    beta for servo 0 (steering) and gamma for servo 1 (motor control). Type node app
    from the front wheels turn. Now the numbers need experimenting with. In our example,
    340 was left, 400 was centre and 470 was right. Do the same for the motor by typing
    app.js gamma=400 and take note of the various limits of your car.'
