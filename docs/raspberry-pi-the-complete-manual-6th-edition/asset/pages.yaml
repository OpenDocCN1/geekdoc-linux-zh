    # # Add network shares


    Placement of your Raspberry Pi is important. It''s going to be out all the time,
    we recommend getting a case for it — the PiBox cases from Primoroni are quite
    suited for this type of use as they are sturdy and can be attached to the rear
    of some TVs.


    You can attach a portable hard drive or USB stick to the Pi for storage, but it
    is really easy to stream under System. Go to File under System and Add source.
    Go and choose your network protocol to browse the network or alternatively, add
    it manually.


    # # IR sensors and remote


    # # Future updates


    Kodi can be controlled with a number of different things — USB game controllers
    and compatible IR sensors. We used FLIRC in the past, but if you have your Pi
    by the TV, you will need a sensor on a wire that stretch to a useful position.


    OpenELEC has the excellent ability to update itself without needing to reinstall
    every few months, meaning you won''t need to do much maintenance on it all. Now
    you can relax and enjoy your media much easier than before.'
