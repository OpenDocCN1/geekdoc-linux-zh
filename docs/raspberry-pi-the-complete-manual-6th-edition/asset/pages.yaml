    the RF transmitter add-board and two sockets to get you started. The add-on board
    connects directly to the GPIO pins and is controlled with a Python library. Once
    everything is installed and set up, your Raspberry Pi can be used with the Pi-Mote
    to control up to four Energie sockets using a simple program. This tutorial covers
    how to set up the software, the sockets and how to adapt the program so that it
    can run on your mobile device.


