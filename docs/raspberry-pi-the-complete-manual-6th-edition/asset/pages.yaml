    # Power cable


    # Case


    The Raspberry Pi uses a standard micro USB connector for its power input, running
    at 5V. In most cases a micro USB to USB cable will suffice, of which one end can
    be plugged into your desktop computer''s USB port. An Android phone charger should
    also work perfectly (5.25V 1500mA).


    Securing the Raspberry Pi in a case will protect it and prevent the delicate GPIO
    pins from accidental damage. A case can also make your Raspberry Pi a more attractive
    or striking unit, perhaps as a media centre. Ensure you choose the right case
    for your Raspberry Pi model.


