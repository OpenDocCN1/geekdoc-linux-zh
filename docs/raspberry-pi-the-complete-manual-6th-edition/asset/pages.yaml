  md: '# Raspberry Pi 3


    A super-charged Raspberry Pi that finally does everything you’d want it to, for
    the exact same price as the previous models


    While the Raspberry Pi has enjoyed years of success, there’s always a couple of
    users wanted. A slightly more powerful CPU that could handle day-to-day computing,
    more USB ports and maybe wireless to make connecting to the network easier.


    The Raspberry Pi 3 solves these problems. As it uses the same board design as
    the Model B+, it has four USB ports, opposed to the two that were on the original
    Raspberry Pi Model B. More importantly, it has a much more powerful processor
    and more RAM, making it times faster than the original Pi. The Pi 3 also has built-in
    wireless capabilities, which makes connecting to Wi-Fi and Bluetooth a cinch.


    The new BCM2837 chip is the heart of the Raspberry Pi 3, a modified version of
    the BCM2836 chip from the old Raspberry Pi 2. The quad-core, 900 MHz processor
    has been powered


    up to a 1,200 MHz beast, which helps to make the Pi 3 a much more functional board.
    Whereas before you might have problems surfing the internet or writing a document,
    now the Pi 3 breezes through these tasks with ease and plenty of processor power
    to spare.


    At heart, it’s still the same board as the Raspberry Pi B+. As well as the aforementioned
    USB 2.0 ports, the Ethernet port for wired internet, a good-quality3.5mm headphone
    jack for sound, a HDMI port for digital video and audio and a 40-pin GPIO port.
    This expanded GPIO port is fantastic for making your physical projects even more
    involved and complicated to do far cooler things.


    For those worried about compatibility, all your old files and projects which just
    work like on the Raspberry Pi 3, and all you need to do is transfer them over
    like any normal files.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_7_0.png)'
