  md: '# Getting started


    # The starter kit


    # The starter kit


    There''s more to your Pi than first meets the eye.

    Here are some virtual peripherals to get you started


    In order to get the very best experience from your Raspberry Pi, you''re going
    to have to get hold of a few extras on the actual Raspberry Pi board itself. For
    example, you''re going to need a keyboard and mouse with which to enter commands
    and navigate. While it''s possible to do projects without a keyboard and mouse
    attached, you''ll need them for the initial setup. SD card is also an important
    purchase – it''s the operating system lives.


    Perhaps you''ll need a Wi-Fi adapter, or maybe a length of network cable. Then
    there''s the basic electronics side of the Raspberry Pi, what would you need to
    start of the beginner electronics and control experiments? Clearly, there''s more
    to the Raspberry Pi than some might think.


    By peripherals, we mean other hardware that can be attached and utilised by the
    Raspberry Pi. They could be as simple as a decent HDMI or what could be the latest,
    greatest gadgets that enhance your project capabilities.


    There is an entire world of possibilities for the Raspberry Pi; from robot arms
    to remote-controlled helicopters… The only limits are the hardware available and
    your imagination!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_11_0.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_11_1.png)


    > Did you know...

    Most online retailers sell packages complete with all the accessories you need
    – even installed SD cards.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_11_2.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_11_3.png)


    # Keyboard and mouse


    # SD card


    Let''s start with the most basic of components, the keyboard and mouse. Generally
    speaking, virtually any USB keyboard and three-button scroll mouse will work with
    the Raspberry Pi, and for some projects you''ll not even need a keyboard and mouse,
    you''ll need them for initial setup.


    Early Raspberry Pi computers required an SD card, whereas later models like the
    Raspberry Pi 2 and 3 use microSD for storage. This is where you''re chosen operating
    system (such as Raspian) is installed, and these can be bought in various sizes,
    pre-installed with the OS, or blank.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_11_4.png)'
