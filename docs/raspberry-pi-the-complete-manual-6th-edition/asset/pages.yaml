    # Apt Easter eggs


    Getting hold of a package dropping onto the Raspberry Pi involves using the command-line
    terminal, via the LXTerminal icon on the desktop, and entering a few commands.
    Before we do that, we make sure the system is up to date. Enter the following
    into the terminal:


    The Apt command is a shorter, non-menu-driven variant of the aptitude command.
    This command has a long history in Linux, and it has some result as special features;
    also known as Easter eggs. Purely for a little bit of fun, type in the following
    commands and see the results:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    Or...


    ```

    sudo apt-get update && sudo

    apt-get upgrade

    ```


    # Installing a package


    Using the up and down keys, navigate the list. If you find something you look
    of, say Angry Drunken Dwarves, remember the name of the package, in this case
    ''angryd'', and press ''Q'' to exit the list.


    ```

    apt moo

    apt -v moo

    apt -vv moo

    apt -vvv moo

    apt -vvvvv moo

    sudo apt-get moo

    ```


    To install the package, enter it in the terminal:


    ```

    sudo apt-get install angryd

    ```


