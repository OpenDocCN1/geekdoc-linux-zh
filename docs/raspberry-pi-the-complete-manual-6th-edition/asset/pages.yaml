    # Search for a package


    The apt-get command, (Advanced Package Tool) is the key to downloading and installing
    packages on the Raspberry Pi. In the previous instance, we updated the existing
    packages and system, upgraded that we and updated the current package list. Now,
    let''s search the list of server packages for available names:


    ```

    apt-cache search game | less

    ```


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_32_1.png)


    # Executing the package


    The result of the previous command should be the successful download and installation
