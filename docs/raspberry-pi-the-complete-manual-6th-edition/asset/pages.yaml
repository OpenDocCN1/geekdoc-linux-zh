  md: '# Xbox Zero arcade


    # Projects


    # Wiring up


    12 The Pi will need three wires connected to it in order to work. The controller
    cable needs to be connected to the USB OTG port. An HDMI cable goes from your
    TV to the mini HDMI port on the Pi. Finally, a 2A USB power supply needs to be
    plugged into the Pi''s power socket. We''ve used a standard mobile phone charger,
    but you can use a USB battery pack if you want to reduce the number of wires trailing
    around your room.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_122_0.png)


    # A word about power


    13 You might be wondering whether it''s possible to get the HDMI cable to supply
    power from the TV to the controller. Sadly, the HDMI specification doesn''t permit
    power to flow in that direction. If your TV has a USB socket on it, you could
    use that to supply the Pi with power – just make sure the socket itself is powerful
    enough. The Pi needs at least 1 Amp, and ideally 2 Amps. Many TVs will only output
    500mA which isn''t enough to run the Pi.


