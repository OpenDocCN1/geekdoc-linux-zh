  md: '# Xbox Zero arcade


    # Projects


    # Cut to fit


    08 Depending on the model of controller, you may find that the Pi blocks one of
    the internal plastic struts. The plastic is soft enough that a craft knife will
    easily cut it to size, though. Start with small strokes, shaving off a tiny bit
    at a time until you have enough room. Make sure the plastic dust is cleaned before
    you reassemble the controller. If you have a can of compressed air, you can use
    it to easily blow away the shavings.


    # Connecting it


    09 If you''re using a controller that has a regular USB port on it, you can plug
    it into the Pi via a USB converter. If you''re using the original Xbox Controller,
    it''s slightly tricky. Microsoft, in its infinite wisdom, has decided that the
    original Xbox should use USB – but with an incompatible plug design. This means,
    in order to connect the controller to the Pi, we need to do some wire stripping.
    Fun!


    The wiring inside the Xbox controller''s cables uses bog-standard USB colours,
    so once you''ve chopped the plugs off the controller and the OTG cable, it''s
    pretty straightforward to connect them together.


    > White This wire is one of two for differential data signals. This wire is the
    positive component and the green one


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_120_0.png)


    Red The red wire is one of two handling power. This one is a 5V power line that
    provides voltage to the circuit


    Green The circuit can get the difference between the two data signals rather than
    a single wire and ground - it''s a more effective transmission


    Black This is the other wire associated with the power - the ground wire, which
    is the counterpart to the 5V wire


    Yellow USB mini/micro cables will also have an additional wire that isn''t required
    for our particular project


    Left The older USB 1.0 and 2.0 cables have fewer wires than the newer 3.0 - here''s
    a quick guide'
