    # Supercharge fstab for fast performance


    # Picking an external USB drive


    Upon restarting, the virtual filesystem will be mounted and /var/log on the RAM
    disk. Other directories that can be RAM to include:


    +   - tmpfs /tmp tmpfs defaults,noat,nodisid,size=100m 0

    - tmpfs /var tmpfs defaults,noat,nodisid,size=30m 0

    - tmpfs /log tmpfs defaults,noat,nodisid,mode=0755,size=100m 0

    - tmpfs /run tmpfs defaults,noat,nodisid,mode=0755,size=20m 0

    - tmpfs /spool/내가 tmpfs defaults,noat,nodisid,mode=0700,gid=12,size=0


    Add each to /etc/fstab.


    Speeding up your Raspberry Pi by migrating the root filesystem to an external
    USB drive is a start, but what device should you use for the best performance?
    Using a USB drive can add flash storage up to 16GB without running any significant
    problems (the larger, the greater, the current is required to read/write). Anything
    larger is expensive and unnecessary unless you''re planning to use an HDD, there
    will be no power issues as it has its own power supply. As ever, your choice should
    suit your project.


    # Move your OS to HDD


    # Back up the SD card


    If you''re concerned about the lifespan of the SD card, why not reduce your Raspberry
    Pi''s reliance? Instead of using the SD card as a sort of budget SSD, change its
    role and add an HDD or USB stick to run the operating system, leaving the SD card
    for bootstrapping. This can give a marked performance boost to the SD card.


    ```

    sudo dd bs=4M if=/dev/sdb of=/backup.img

    ```


    The path=/dev/sdb represents the SD card. Copying takes 5-10 minutes. When complete,
    remove the SD card and connect your USB device.


    # Copy Raspian to USB


    Using a blank Ext4-formatted USB drive (or external HDD) as the destination drive,


    ```

    sudo dd bs=4M if=/backup.img of=/dev/sdc

    ```


    Leave the backup on your computer, just in case something goes wrong. With an
    SD card and USB storage sharing an identical disk image, it''s time to consider
    what you''re going to do next - create a faster Raspberry Pi.


    Below Having your filesystem on a USB stick is great for backups as well as performance
    boosts


