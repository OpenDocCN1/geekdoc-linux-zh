    # Control an LED

    using GPIO


    An introduction into an external output, such

    as an LED, on the Pi


    After you have fired up your Pi, you maybe installed XBMC and had a play around
    streaming, you might be ready for your next challenge. One to go down is to find
    interesting uses for one of the many desktop OSs available for the little computer,
    perhaps using it as a web server, an NAS or retro arcade console. It is also great
    fun, but an overlooked feature of the Pi is its hardware pinouts. If you''ve never
    done electronics before, then the Pi is a great place to start. Or you may have
    used a programmable microcontroller such as Arduino in the past; the Pi, with
    its increased CPU and RAM over the Arduino, opens up many more possibilities for
    fun projects.


    The Raspberry Pi features a single PWM (pulse width modulation) output pin, along
    with series of GPIO (General Purpose Input/Output) pins. These enable electronic
    hardware such as buzzers, lights and switches to be controlled via the Pi. For
    people who are used to just ''using'' a computer, or only programming software
    that only acts on the machine itself, controlling a physical item such as a light
    can be a revelation.


    This tutorial will assume no knowledge of electronics or programming, and will
    take you through the steps needed to control an LED using the Raspberry Pi, from
    setting it up to coding a simple application.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_59_0.png)


    Fig 1: All the items you need to get adjusting an LED using PWM. The wires should
    have a male and female ends


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_59_1.png)


    Fig 2: Place the female end onto the Pi, noting pin number 1 is identified by
    the small Pi! The blue wire is ground


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_59_2.png)


    Fig 3: Once everything is connected up, plug in your USB power cable


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_59_3.png)


    Fig 4: Switch the power on. The LED will light up. If it''s dim, use a lower-rated
    resistor


    > “We''ll take you through the steps needed to control an LED using the Pi, from
    setting it up to coding”


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_59_4.png)'
