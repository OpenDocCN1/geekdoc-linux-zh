  md: '# Raspberry Pi Model A+


    Good things come in small packages: find out why the Raspberry Pi A+ is ideal
    for mobile projects.


    While the Raspberry Pi Model B+ is a step up from the Model B with four USB ports,
    the Model A+ is smaller than its predecessor, weighing 23g (down from 45g) and
    wielding one USB port. It''s also limited to 256MB of RAM on the SoC, compared
    to the 512MB enjoyed on the B+.

    But don''t think that all of this means that the A+ is inferior. Its 65mm length
    and lower weight


    is a clause as to how it can be used. The lack of an Ethernet port whilst, is
    not a weakness, rather an illustration of the fact that the Raspberry Pi is designed
    not for media centres and print servers, but for projects where weight is a factor.
    Perhaps you''ll mount it on an Arduino-powered robot, whose lower power requirement
    can be satisfied with a battery.


    MicroSD Storage

    No worries about the SD card being snapped off or lost. The Raspberry Pi A+ features
    a push-slot for a microSD card


    Connectable and flexible

    Both new Raspberry Pi models have the GPIO header increased from 26 pin to 40
    pin, increasing the device''s flexibility


    256 MB RAM Squeezed on board!

    It seems amazing, but on top of all this, there is a System-on-Chip with 256 MB
    of RAM mounted in the centre of this versatile little computer


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_9_0.png)


    It''s smaller!

    The original Raspberry Pi Model A was a credit card sized 86mm in length. The
    A+ measures in at just 65mm long!


    Repositioned power socket

    With the micro USB power socket now beside the HDMI socket, it''s easier to arrange
    and manage cables


    It''s lighter too!

    Unbelievably, the Raspberry Pi Model A+ is just 23g (0.81 oz), a reduction in
    weight of almost 50 per cent!'
