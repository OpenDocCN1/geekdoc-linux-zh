  md: '# Command line basics


    # Getting started


    # Move and create


    Installing and updating are just a couple of the things you can do in the command
    line. You can also browse the entire file system, move files, create folders and
    delete items. All of these are free simple operations.


    When you first open the terminal, it will open up in your home folder. While you
    can''t specifically tell that it is, you can display what kind of files are in
    the directory (Fig 5):


    ```

    $ ls

    ```


    The tilde ( is used to denote the home folder and can be used for navigating around
    the file system. To navigate, we will use the cd command, followed by the location
    you want to move to. This can be done like so:


    ```

    $ cd /home/pi/Downloads

    ```


    This will move you to the Downloads directory. As we were starting off in the
    home folder to begin with, we actually need to do this:


    It''s context sensitive and knows to look in the directory it''s already in. There''s
    another trick you can use so you don''t have to remember the exact name of the
    path – the command line or terminal will try to autocomplete the phrase if you
    press the Tab key while something is partially typed. Try the cd command again,
    but pressing Tab when you''ve written ''Down''.


    Finally, there are some quick commands you can use to manipulate files. Individual
    files can be copied using the command cp, followed by the filename and the new
    location like:


    ```

    $ cp file.txt ~/Documents/file.txt

    ```


    You can also rename files by:


    ```

    $ cp file.txt otherfile.txt

    ```


    The original file can then be deleted using the rm command:


    ```

    $ rm file.txt

    ```


    Want to create a new folder? Use cd to move to the directory you need to add a
    folder to, and then use mkdir followed by the name you want to give the folder:


    ```

    $ mkdir NewFolder

    ```


    There''s a lot more you can do with the command line, but these are the very basics.
    As you use Linux and more, you''ll be confronted with tasks that need the command
    line, and through this process you''ll learn just how much can be accomplished
    when you work like a streetwise movie hacker.


    > Did you know...

    You can always return to your Home folder in the command line by typing ~ and
    pressing Enter.


    > “The command line or terminal will try to autocomplete the phrase if you press
    the Tab key while something is partially typed”


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_24_0.png)


    Fig 5: There are many simple command-line tools that can help you browse and use
    your system'
