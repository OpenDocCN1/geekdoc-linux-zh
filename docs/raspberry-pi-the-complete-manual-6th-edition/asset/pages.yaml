    # PiBeacon Trigger Apps


    +   11 You can take what you''ve done with the PiBeacon so far even with some
    smart interaction between your smartphone and Raspberry Pi, but where should you
    start? Rather than going into DIY task, it pays to take time finding the right
    app for your smartphone—one that will enable you to launch specific apps based
    on the presence of a PiBeacon.


    +   12 Whether you''re using iOS or Android, you''ll find a trigger app on the
    corresponding app store that can be set to launch an app when your smartphone
    comes in proximity with your PiBeacon. Android users should take a look at NFC,
    available from Google Play and intended for devices equipped with Bluetooth 4.0
    hardware and running 4.3 or later.


    Meanwhile, iOS users should take a look at iBeacon, available for a paltry £1.59
    in the App Store. This app has support for IFTTT, Philips Hue, HomeKit and Lux
    integration.


    > Whether you''re using iOS or Android, you''ll find a trigger app on the corresponding
    app store


    The tools we''ve looked above are simply for detection and measurement, and the
    data they reveal is useful for developing trigger apps. How do you launch an app
    when your phone is near a PiBeacon?


    # What a PiBeacon can''t do


    # Choosing PiBeacon vs NFC


    +   14 As you may have gathered by now, there are some similarities in use for
    iBeacon and NFC, especially when it comes to home applications. Which one should
    you use for your project?


    +   13 As things, for border or worse, you''re not in a Philip K Dick novel. This
    means that for the time being (at least), iBeacon technology cannot launch a web
    page on your phone without a third-party tool—like those mentioned above.


    Adaafruit produces an NFC breakout to add NFC functionality to the Raspberry Pi,
    which can prove very useful for any project that requires contact—we grabbed ours
    for a piece of hardware from ModMyPi. And this is really where the distinctions
    lie. If your project requires physical contact, then you should use NFC. Otherwise,
    the PiBeacon solution should be completely adequate.


    It is not beyond the realm of possibility that such feature might be integrated
    into iOS or Android in the foreseeable future, a situation that might see an advert
    displayed on your phone as you pass an iBeacon, perhaps including a discount for
    shopping at the advertising store.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_101_0.png)


    Right NFC breakout boards are also available for Raspberry Pi, and they share
    some similarities with iBeacon technology'
