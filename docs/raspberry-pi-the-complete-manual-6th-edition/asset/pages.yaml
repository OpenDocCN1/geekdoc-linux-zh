  md: '# Xbox Zero arcade Projects


    # Gather your equipment


    01 While the Zero doesn''t take up much space, videogame controllers are often
    stuffed with delicate electronics. The trick here is to find a controller with
    enough space inside for the Zero. We''re going to be using the original Xbox controller,
    nicknamed The Duke. If you don''t have that one, they can be picked up for a couple
    of quid from most second-hand electronics shops, and we really found one too.

    If you can''t find one, you can use USB game pads that are designed to look like
    controllers for classic systems like the SNES and Mega Drive. Make sure you choose
    a controller that has enough buttons for the games you want to play – some classic
    fighting games, for example, really can''t be played on a two-button NES controller!


    # Warning!


    02 Working with electrical items and sharp objects can be dangerous. You risk
    damaging yourself or worse, breaking your toys. Please ensure everything is unplugged
    from electrical supplies before attempting this project. As with any electronics
    projects, you should also take care to fully ground yourself before playing around
    sensitive components -the static electricity from your body can ruin them. Anti-static
    wrist straps or a few taps on a radiator should do the trick.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_118_0.png)


    Above You can modify your controller with just a few simple tools'
