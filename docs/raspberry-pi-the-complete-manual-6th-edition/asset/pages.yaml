  md: '# Projects


    # Xbox Zero arcade


    # Lots of little bits


    When taking apart electronics, keep a few small bowls or containers nearby. Put
    each type of screw in its own separate container so you don''t accidentally mix
    them up. With the Xbox controllers you find that the buttons especially have a
    habit of rolling away from you, so stash them somewhere safe as well. Keep track
    of any bits of plastic or rubber which may be useful in reassembling.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_119_0.png)


    +   Right Be careful that you don''t lose any small parts when opening up the
    controller


    # The build


    # Fitting


    03 You should be now a reasonably good idea of the controller that''ll be working
    with "The Duke" has dual joysticks, six buttons, a D-Pad and two triggers - and
    it''s compatible with most retro gaming systems.


    04 If you''re using a different controller, double-check that the Pi is likely
    to fit inside before crack it open. As you''ll see here, the Pi nestles between
    the triggers of this controller - the original Xbox controller is one of the largest.


    # Unscrewing


    05 The controller is held together by half a dozen cross-head screws. They are
    loose when opening the case as the buttons and rubber contacts - they will spill
    everywhere!


    # Opening


    06 With the shell removed, you should be able to undo the screws holding the main
    circuit board in place. There are also a couple of connectors which provide the
    vibration motors - gently unclip them in order to completely remove the board.
    You might find it easier to use a pair of pliers for this - just be very gentle
    as you pull!


    # Gently does it


    07 You can see for yourself how well the Pi fits here; it can be squeezed under
    the memory card slot. If you want to hold it firmly in place, use BluTak as a
    temporary solution. If you''re using an older controller, it''s worth giving it
    a bit of a clean. Remove the rubber contacts and gently swab under them using
    the isopropyl alcohols swabs.'
