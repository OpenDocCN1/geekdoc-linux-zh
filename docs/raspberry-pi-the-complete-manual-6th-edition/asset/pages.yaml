    02 The great thing about Bare paint is that, dry, it works just like normal wiring!
    That means you can use it with any of your favourite controllers like the Bare
    Conductive Touch Board, Raspberry Pi or Adafruit''s wearable You can just use
    some small pin batteries and flashing LEDs for a standalone system.


    04 There are plenty of ways to connect to the paint (from battery packs for example)
    no matter what surface it''s on, because it is oily Or it acts just like an uninsulated
    wire. Therefore you can use wires glued on the paint, with copper clips, alligator
    clips or even sewn-in conductive snaps for wearable projects.


    # Make it waterproof


    07 This paint only comes black and is not waterproof. However, the great thing
    is that you can use it underneath or alongside any regular paints, and waterproofing
    sprays to act as insulation - just to add some color to your designs!


