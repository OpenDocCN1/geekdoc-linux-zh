    The Snake moves the head around the stage and draws the body behind it. It also
    detects collisions with the body or


    # Paint the Snake sprite


    Click the New sprite: Paintbrush icon in the Paint Editor, draw a small green
    ellipse for the snake head and add red rectangle for the tongue. It''s important
    that the tongue is a different colour to the head. Name your sprite Snake.


    # Tail sprite


    The Tail sprite follows the head, erasing the end of the body so the snake moves,
    and pausing when it needs to grow


    # Bad Egg sprite


    The Bad Egg also appears randomly but decreases the score when eaten. It also
    grows in size, getting harder to avoid'
