- img_proc: true
  md: '# Xbox Zero arcade


    # Projects


    # Set up the disk


    07 Before we get to playing any games, we need to make sure that RetroPie is able
    to use all the space on the micro SD card. This will allow you to store ROMs and
    save your games. Select ''RetroPie'' from the menu. You''ll be presented with
    several configuration options. Select ''Raspberry Pi Configuration Tool RASPPI-CONFIG''
    to change the default username and password at a later date; now just use the
    controller to expand Filesystem. Next, highlight the ''Select'' button and click
    on it. After a short delay, you will see a success screen – press OK and you''ll
    be taken to the configuration screen. Press right until ''Finish'' is highlighted,
    then click on it. You should rename your Raspberry Pi.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_126_0.png)


    # Adding ROMs


    08 The final step is adding new ROMs. Once you''ve legally purchased and downloaded
    ROMs from the internet, you''ll need to copy them onto the micro SD card. ROMs
    are stored in a separate folder for each system. So, for example, you need to
    place your Sega Master System ROMs in ~/RetroPie/roms/mastersym/ Once you''ve
    installed ROMs, you''re ready to play!


    # Playing


    09 Once booted, you''ll see a menu with all the available games systems on it.
    Some emulators will show up once game ROMs for that system are installed. Scroll
    until you find the game you want to play – then let rip! You can always return
    back to RetroPie if you want to change any options, or update the software. And
    that''s all there is! Time to sit back and play some games. If you want to find
    out more about the RetroPie software, visit http://blog.retropie.com/retropie.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_126_1.png)'
