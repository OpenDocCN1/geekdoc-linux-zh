    # The right controller


    # Wiring


    Second-hand stores like CEX or GAME often have some older, obsolete consoles and
    accessories of public view, as they aren''t particularly highly selling these
    days. It''s worth asking them there if you can''t see what you need on display.
    Charity shops also have old consoles for sale. Faffing on eBay, or simply asking
    your gamer friends are both excellent ways to grab inexpensive controllers for
    all sorts of consoles.


    +   10 Strip the wires by a couple of centimeters and then connect them together.
    You should have Red, Green, White, and Black, The Xbox cable also has a Yellow
    wire which you can ignore. It is worth noting at this point you need to be sure
    that you use a USB data transfer cable and not just a plain power cable – the
    former will look like the photo above, but power cables be missing the two wires.

    With the wires stripped, we temporarily used regular sticky-tape to map the connections
    between the OTG cable and the controller – for a more permanent installation,
    you can use electrical tape or simply the wires together.


    # Insulation


    +   11 One thing to note: you''ll need to insulate the bottom of the Pi again
    for this quick hack, we''ve used some of the cardboard packaging – but any non-conductive
    material will do.

    From there, it is as simple as screwing the case back together. Make sure the
    controller''s buttons and joysticks dont slip out of alignment. Keep track of
    which coloured buttons go where and you should be fine.


