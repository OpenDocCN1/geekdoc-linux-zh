    into the terminal:


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_32_2.png)


    # Man the apt command


    As you see, there is more to the simple apt command than what first needs the
    eye. There are many sub-commands that you can run, and many variations in which
    to run them.


    # Remove a package


    If you want to see what the apt command can do:


    +   - man apt


    ```

    sudo apt-get --purge remove

    ```


    Enter ''Y'' to accept the removal.


