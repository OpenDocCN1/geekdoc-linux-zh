    # Share your files with Samba


    Configure the Pi to share the contents of the home folder over your home network


    > Did you know...

    nYou can network with other Linux, Windows and Mac OS X computers with Samba -
    it is totally cross-platform.


    Regardless of whether you plan to set your Raspberry Pi up as a media centre,
    gaming machine or on-development platform, the ability to share and access the
    contents of your Pi from other machines is very useful.


    While the Raspberry Pi is very well configured, by default it doesn''t include
    the ability to share the contents of your home folder with your local network.
    As you''ll see from this guide, though, it''s not too difficult to accomplish
    tasks to Samba and it can help you access your scripts, media or documents from
