    # What you''ll need...


    # # Get interactive withwith Scratch


    +   - Breadboard

    - LEDs

    - Buttons

    - Resistors

    - Jumper wires

    - ScratchGPIO3


    Experiment with physical computing by using Scratch to interact with buttons and
    lights on your Pi


    Scratch is a very simple visual programming language, commonly used to teach basic
    programming concepts to learners of any age. In this project we''ll learn how
    to light up an LED when a button is pressed in Scratch, and then change a character''s
    colour when a physical button is pressed using the General Purpose Input/Output
    (GPIO) pins on your Raspberry Pi. With these techniques you can make all of fun
    and engaging projects, from musical keyboards to controllers for your games and
    animations. You''ll need some components for this guide. Search online for ''Raspberry
    Pi GPIO basic kit'' to get started.


    Below: Scratch can be used to do Internet Of Things projects with a few tweaks


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_55_0.png)


    # Get the required soft-ware packages


    Log in to the Raspbian system with the username pi and the password raspberry.
    Start the LXDE desktop environment using the command start. Next open LX Terminal
    and type the following:


    ```

    wget http://liamfraser.co.uk/linux/install_scratchgpio3.sh

    chmod +x install_scratchgpio3.sh

    sudo bash scratchgpio3.sh

    ```


    This will create a special version of Scratch on your desktop ScratchGPIO3. This
    is a normal version of Scratch with a Python script that handles communications
    between Scratch and the GPIO. ScratchGPIO was created by simpleplex (wordpress.com).


    > "In this project we''ll learn how to light up an LED when a button is pressed
    in Scratch using the GPIO pins"'
