    # Create a Snake clone in Scratch


    Design your own version of Snake to test your new programming skills!


    # Did you know...


    Snake is a very popular beginner game that started life in the arcades of the
    Seventies and is still popular today.


    Here, we will create a version of the classic Snake game where we move the snake
    around the Scratch stage using the arrow keys. You control the head of the snake
    and must avoid a collision with either the body of the snake or the edge of the
    stage.


    The snake grows longer each time you eat an egg. You get points added to your
    score for eating good yellow eggs and lose points for eating bad black eggs. There
    are also bonuses to eat for extra points.


    By following this tutorial you will learn to create your simple sprite graphics,
    send and receive broadcast events, use a list variable to store data, play sound
    effects, generate random numbers and use sensing commands to detect when a sprite
    is touching something.


    # Egg sprite


    The Egg sprite appears randomly on the screen and leaves other sprites when it
    has been (touched by the snake tongue)


