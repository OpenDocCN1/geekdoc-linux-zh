    # Input a UUID


    The PiBeacon is now ready. All you need to instruct it to

    advertise to all (correctly configured) devices. This simply means\using the hcitool
    command to attract attention to the PiBeacon. Note how

    identifier certain portions of the string (everything after "cmd") is

    intended to provide information. For instance the UUID below is broken into pairs.
    Like any

    manufacturer-specific data is displayed, in this case 00 C4 which is sent from
    Apple''s

    ID. The example UUID shown here is used on your Pi, but note that it

    is intended for a particular app - specifically, the 99 Beacon Toolkit in

    App Store.


    ```

    sudo hcitool -i hci0 cmd 0x08 0x09 0x00 0x08 1E 02 01 1A 1A FF 4C 00 02

    15 E2 0EA 39 F4 73 F45 4B C4 4A 2F 17 D1 0D 07 9A 61 00 00 02

    0C8 00

    ```


    # Configure for Broadcast


    With the BLE connected and

    the Pi restarted, however hiconfig

    the Bluetooth mode will usually

    be listed by using hiconfig To avoid

    this, input the following command. As,

    stay aware of the commands you''re

    inputting. In this, the final line ends

    with noscan, which displays Bluetooth

    scanning. This is done to avoid issues

    with the module attempting to scan

    while advertising.

    With these commands once, then hiconfig once more. This time, the

    device status will be ''UP RUNNING''.


    +   - sudo hiconfig hci0 up

    - sudo hiconfig hci0 leav3 3

    - sudo hiconfig hci0 noscan


    # Resolve errors


    From time to time you may encounter errors with your PiBeacon,

    specially when attempting to persuade the status to switch from

    ''DOWN'' to ''UP RUNNING''.

    Restarting the Pi is no good here. Instead, you need to reset the device.

    First, enter hiconfig the hci device name. Usually, this is hci0.

    Next, use sudo hiconfig reset. This essentially clears everything out

    lets you start again with it. To check, input hiconfig again, where you

    see that the status now ''UP RUNNING''.


    +   - sudo hiconfig hci0 reset


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_99_0.png)


    # Test with an iOS device


    Before proceeding to use

    the PiBeacon for a particular

    project, you need to make sure that

    is broadcasting correctly. To do this,

    you''ll need an iPod or iPhone (or ever)

    in order to detect the

    Scan Response Data — information

    including the UUID) sent from

    Beacon to your smartphone when it

    comes into proximity.

    In addition, you need an app.

    Something like Beacon Toolkit,

    mentioned, above, should be

    sufficient. We''re really just looking

    at this stage to test the strength

    and range of your PiBeacon. Both of

    tqualities we need

    connected to your Raspberry Pi''s USB

    port, of course.


