  md: '# Getting started


    # Get your Pi online


    # What you''ll need...


    Any Raspberry Pi distro

    www.raspberrypi.org/downloads


    Wi-Fi dongle or Ethernet


    # Get online


    To access a world of utilities, apps and resources you need to get online. This
    is how to do it...


    The easiest way to get online is to buy a Raspberry Pi Model B+, as it comes with
    an Ethernet socket. The Model A only lacks the Ethernet port, but is handicapped
    by having only one USB port. That means you will have to buy a USB hub in order
    to get online. Back to the Model B+ though and to get online, simply plug an Ethernet
    cable into the Pi and connect it to a similar port on the back of your internet
    modem/router. Turn your Pi on and launch the desktop, double-click on Empathy
    and you should see the internet appear (main image). To check that it''s working,
    look at the lights on the Pi itself. The red power light should be. Above this
    is the green light that flickers when accessing the SD card. The power light are
    the three Ethernet-related lights. Note that the Model A does not have these LEDs
    because it doesn''t have the Ethernet socket. The middle light is green and comes
    on when it detects a Full Duplex LAN connection. This means it is able to send
    and receive data when accessing the internet The next light is green and flashes
    when actually accessing the internet by sending or receiving data. The last light
    is yellow and will come on stay when a 100MB LAN connection is detected.


    > Did you know...

    If your Raspberry Pi is going to be placed near your router, all you need to do
    is plug in an Ethernet cable.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_29_0.png)


    Fig 1: With a Wi-Fi dongle attached, run the utility and scan for available networks


    # The Wi-Fi option


    If you aren''t close enough to the modem/router to be able to plug in the Ethernet
    connection, or you simply have a Model A, a powered USB hub is required. This
    plugs into a USB port on the Pi. You can then plug a Wi-Fi dongle into this. Boot
    up the Pi and launch the desktop. Double-click on the Wi-Fi Config icon. You should
    see a name for the dong in the Adapter section. Click on Scan to look for networks
    and a list of those found should appear (Fig 1). Double-click on the one you want
    to connect and the details for it will be listed. Almost all home networks use
    a network key, which is usually written on the modem itself. Click on PSK, which
    stands for pre-shared key, and type it in (Fig 2). Then click on Add. This will
    process this, then associate the connection and


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_29_1.png)


    Fig 2: Enter the pre-shared key in order to connect to your home router'
