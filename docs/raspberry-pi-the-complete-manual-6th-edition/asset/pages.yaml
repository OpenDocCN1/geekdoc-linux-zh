  md: '# Gain remote desktop access


    What you''ll need...


    # Gain remote desktop access


    TightVNC

    www.tightvnc.com/release-2.7.php


    Learn how to get access to your Raspberry Pi without it being in front of you...


    Did you know...

    TightVNC Viewer is a free resource for accessing VNC servers, like the one we
    will install in this tutorial.


    VNC (Virtual Network Computing) is a graphical desktop access and sharing system
    that allows a user to remotely control and use the desktop of another computer
    from their own system.

    It''s handy in many ways: to give over a remote system; to help out another elsewhere;
    to allow a computer to remain powered on, but without the need for a keyboard,
    mouse or even a monitor.

    In our case, we aim to allow access to the Raspberry Pi desktop without it being
    hooked up to the aforementioned peripherals. You can do everything you would normally
    do, but with just the power supply and network attached, thereby freeing up space
    and saving extra effort. In real world terms, this means you could potentially
    access the Pi desktop via an Android tablet or phone!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_43_0.png)


    ```

    pi@raspberrypi: # sudo /etc/init.d/networking stop

    ```


    # Static IP address


    01 The first step for us is to make sure the Raspberry Pi has a static IP address.
    Basically, an IP address is a group of numbers that identifies your network devices
    in order to tell them apart. To set up a static IP address, simply double-click
    LXTerminal and type the following


    +   - nano /etc/network/interfaces


    # Static IP part 2


    02 This file controls the IP address for the Pi. You need to scroll down, find
    the ''eth0'' line and remove DHCP and replace it with static IP. Now, on the line
    directly below, enter the IP address that you want your Pi to have, along with
    the subnet mask and the gateway:


    ```

    address 192.168.1.93

    mask 255.255.255.0

    gateway 192.168.1.254

    ```


    # Static IP part 3


    03 After you''ve entered those details, exit nano by pressing Ctrl+X, followed
    by Y to accept the changes, and then press Enter a couple of times to get back
    to the command prompt in the terminal. You can now either reboot your Pi, or type
    the following into the terminal:


    ```

    sudo /etc/init.d/networking stop

    ```'
