    # Set up your Pi Zero


    Get to grips with your Raspberry Pi Zero, either as a headless device or for use
    together with a screen and keyboard


    So you''ve picked up one of the tiny powerful Zeros, but before the coding can
    begin you need to get more familiar with it. Don''t worry; we''ll walk you through
    the Raspberry Pi Zero, the required cables, how to prepare a NOOBS SD card, and
    how to solder the GPIO header onto the Pi. Once the Pi is working and booted we''ll
    show you how to get it working on Wi-Fi through the Raspian user interface. You''ll
    need a USB hub for this, or even just to use a keyboard and mouse together. We''ll
    also show how to prepare a Raspian SD card for headless use (either VNC or SSH)
    with only a Wi-Fi adapter or USB-to-Ethernet adaptor.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_15_0.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_15_1.png)


    # Raspberry Pi Zero Cable Overview


    01 The Raspberry Pi Zero is very small, and as such cannot fit normal-sized USB
    and HDMI connectors. To use it, you therefore need adapters that break out microUSB
    into full-size USB and mini HDMI to full-size HDMI. You also need to be very careful
    when connecting the microUSB power cable will fit into the connector meant for
    USB data. It''s easy to tell them apart though, as they''re clearly labelled,
    and the USB data connector can be found between the HDMI and power connectors.'
