  md: '# Print wirelessly


    What you''ll need...


    +   - Latest Raspian image

    - USB printer

    - USB wireless card


    # # Print wirelessly with your Pi


    Breathe new life into an old printer by using your Raspberry Pi as a wireless
    printer server


    Wireless printing has made it possible to print to devices stored in cupboards,
    sheds and remote rooms. You don''t have to own a shiny new printer for this to
    work; old printers without native wireless support don''t have to end up in the
    bin, thanks to the Raspberry Pi.


    The setup is simple. With your Pi set up with a wireless USB dongle, connect your
    printer to a spare USB port on the computer. With Samba and CUPS (Common Unix
    Printing System) installed on the Raspberry Pi, all that is left to do is to connect
    to the wireless printer from your desktop computer, install the appropriate driver
    and start printing.


    CUPS gives the Raspberry Pi a browser-based admin screen that can be viewed from
    any device on your network, enabling complete control over your wireless network
    printer.


    > Setting your Raspberry Pi to print wirelessly is a great way to get rid of annoying
    cables at your workstation


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_81_0.png)'
