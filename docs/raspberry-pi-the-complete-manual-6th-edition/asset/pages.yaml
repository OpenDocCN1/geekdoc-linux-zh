    # Powered USB hub


    There are two video output ports, a HDMI port and an RCA Socket. HDMI is the primary
    video-output connector for most users, but the RCA video-out port can also be
    used to connect TVs, monitors or a SCART port. Remote access to your Raspberry
    Pi is also possible via SSH or VLC.


    This is a custom designed add-board that attaches to one of the Raspberry Pi''s
