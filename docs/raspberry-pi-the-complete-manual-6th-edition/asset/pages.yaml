  md: '# Make a Pi 2 HTPC


    # What you''ll need...


    +   - OpenELEC openelec.tv

    - HDMI cable

    - USB IR receiver

    - IR remote

    - Case

    - Dedicated power supply

    - Optional USB storage


    # Make a Pi 2 HTPC


    Finally create a more powerful and capable HTPC using the Raspberry Pi 2 and the
    excellent OpenELEC project


    We know people who just have a Raspberry Pi for XBMC, now called Kodi. It''s a
    great idea and a great use for the Pi – it works well enough that you can easily
    play media locally or over the network. The biggest issue is with GUI response
    on the original Model B, and a lack of USB ports for connecting up everything
    that you want. While optimisation over the last few years has helped, the leap
    to Raspberry Pi 2 has basically solved all of these problems by giving you much
    more powerful hardware to play with. So if you''re looking to upgrade or finally
    take the plunge, this handy guide will help you create the perfect Raspberry Pi
    2 HTPC.


    # Choose the software


    01 In the past, Pi HTPCs were just a choice between RaspBMC and OpenELEC. However,
    RaspBMC is on a bit of a hiatus and OpenELEC is your best bet for getting the
    most-to-date software. There''s no massive difference between the two, as both
    run XBMC.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_79_0.png)


    # Get the software


    02 Head over to openelec.tv and look for the Download section. There''s a specific
    Raspberry Pi section which is split into original (ARMv6) and the new Raspberry
    Pi 2 (ARMv7). Grab the image file from this page for the Pi 2.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_79_1.png)'
