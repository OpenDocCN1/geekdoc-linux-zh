    # Build a voice synthesizer


    Add the power of speech to your Raspberry Pi projects with the versatile eSpeak
    Python library


    We''ve shown how the Raspberry Pi can be used to power all kinds of projects,
    but as a tiny computer it can be the centre of Internet of Things in your house.
    For these reasons and more, using the Raspberry Pi for text-to-voice commands
    could be just what you''re looking for. Due to the Debian base of Raspian, the
    powerful eSpeak library is easily available for anyone looking to make use of
    it. There''s also a module that allows you to use eSpeak in Python, going beyond
    the command-line prompts so you can perform automated tasks.


    # Did you know...


    Using eSpeak you can control the ways words are spoken to add emphasis or make
    the voice sound different.


