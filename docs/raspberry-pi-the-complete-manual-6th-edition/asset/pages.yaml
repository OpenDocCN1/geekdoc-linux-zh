    # Block Script Walkthrough


    # Scratch Block Help


    02 As we''ve seen, there are many blocks, each with their own specific functionality
    and capabilities.


    In one way this is great. Large block collection means Scratch can be used in
    a vast range of software projects, graphical images and, where games, animation,
    music, graphs, math, science, robotics and electronics much more.


    Let''s dig deeper into how a block script works in practice. Here, we will use
    a simple Aquarium project block script. From the ''Sprite Collection'' panel select
    the stage plane. Then go back to the central ''Edit'' panel and select the ''Scripts''.


    However, the wide selection of blocks can be quite a challenge for the novice
    Scratch coder. To help with this problem the Scratch has included an informative
    set of block-centric help pages.


    There''s just a single block starting with a ''green'' flag hat-stack block to
    kick off the effect. Next there is a forever ''loop''. This loop is activated
    until the stop button is pressed. This forever loop contains two other blocks.


    A click on any block will show up the help page option. The help page contains
    context-specific descriptions, graphical images and, where appropriate, a short
    example of how to use this particular block of (Fig 4).


    The first block selects the next background image. Click on the ''Backgrounds''
    tab to view all the stages. The inner block simply executes for a number of seconds.
    Setting the value to ''1'' means that this script will pause for a second before
    performing the action specified by the next block.


    It''s a terrific feature greatly simplifies the process of deciding which blocks
    to use. More importantly, studying these help pages is a highly effective way
    to enhance your scripting skills and discover the potential contained within Scratch''s
    feature-rich block collection.


    It''s important that you remember these blocks are encoded in the forever loop
    block. So, the background images will be displayed in sequence for each order.


