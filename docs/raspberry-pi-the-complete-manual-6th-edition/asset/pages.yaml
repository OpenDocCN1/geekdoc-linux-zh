  md: '# Getting started


    Use graphical installations


    # What you''ll need...


    # Use graphical installations


    Synaptic:

    www.nixuyu.org/synaptic/


    Would you prefer a graphical interface to install new programs? If so, then read
    on...


    > Did you know...

    Synaptic has access to the same repo via the command line as demonstrated on the
    previous two pages.


    If you''re new to Linux, you may find using its built-in Apt package management
    tool to be intimidating and confusing. The apt-get command is used for installing
    applications through the internet, connecting to the remote servers – called repositories
    – which house the programs as packages. But it is used through the terminal command
    prompt, which can be daunting, so we need an alternative: a desktop environment
    interface method of getting held of packages.


    This is where Synaptic comes in. Synaptic is a friendly-looking graphical interface
    to the apt-get terminal command allows you to manage your application installations,
    and removals, through the already familiar desktop environment. Think of it as
    a kind of online shop where you can pick and choose the programs you have downloaded
    and installed onto your Raspberry Pi without having to drop into the terminal.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_33_0.png)


    +   Upgrade entire systems

    Synaptic has the ability to update and upgrade every program or package. Upgrade
    your system to the latest version


    +   Install and more

    Synaptic is a very powerful tool. With you can install, remove, upgrade single
    or multiple packages and programs


    +   Browse documentation

    From Synaptic you are able to browse and read all available online documentation
    related to a package or program


    +   Easily find programs

    Synaptic enables you to easily locate packages and programs by name, description,
    version and even by who developed the program'
