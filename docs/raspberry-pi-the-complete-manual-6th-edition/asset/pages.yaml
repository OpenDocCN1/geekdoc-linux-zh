  md: '# Projects


    # Control lights with your Pi


    # Fitting the Pi-mote


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_87_0.png)


    03 Before fitting the Pi-mote transmitter, shut down your Raspberry Pi with sudo
    poweroff. unplug the module onto your Raspberry Pi. The ''part'' of the board
    fits opposite the HDMI port. Power up the Pi and plug in one of your Energie sockets
    in the same room or area that your Pi is in. The device''s range is fairly good,
    furniture, walls and other objects sometimes block transmission signal. You can
    tell that the socket is working by plugging it in some desk lamp and pressing
    the green button that is located on the socket. This will trigger the socket on
    and off, turning the lamp on and off in turn.


    # Download the set-up code


    # Set up your socket


    04 Before the Raspberry Pi can interact with the socket and switch it on/off,
    it requires programming to create a code that is sent from the transmitter. Each
    socket has its own unique code so that you can control four individually. Energie
    provides the set-up program which can be found inside the online resources (available
    at bit.ly/21ZiWR4G).


    05 Once you have downloaded the set-up program, run it. This should place the
    socket in the ''learning mode'', which will be indicated by the LED on the socket
    housing flashing. If it is not doing this, press and hold the green button for
    at least five seconds and release it when the LED starts to flash at one-second
    intervals. Run the program and it will send a signal out. Follow the on-screen
    prompts, pressing the return key when required. When the code is accepted, success
    will be indicated with a brief flashing of the LED on the housing. If you have
    more than one socket to set up, simply use the same program and method to do so
    as many times as required.


    # A quick test


    06 Get to the task of creating your Pi code to control your socket, it is advisable
    to test that the socket is working correctly. Ensuring the power is turned on
    when all the lamp is switched on, you can turn the lamp off by pressing the green
    button on the Energie socket. The lamp should turn back on again when the button
    is pressed.


    # Code to run the socket


    07 The Python Energie library makes it incredibly easy to create a code to the
    socket on, which will turn your lamp on. Before you know, you will be using your
    Raspberry Pi to turn the socket or the TV off! Open your Python editor and start
    a new program. Next, import the Raspberry GPIO library (line 1, below), then import
    the Energie library (lines 2 and 3). Finally, add the code to switch the socket
    on (line 4). Save and run your program. The socket will turn on, you hear a click,
    and then your lamp will come on.


    ```

    import RPi.GPIO as GPIO

    import energie

    from energie switch_on

    energie.switch_on(1)

    ```


