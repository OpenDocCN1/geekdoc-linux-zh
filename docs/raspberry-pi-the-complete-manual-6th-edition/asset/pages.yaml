    # # Install a distro


    Raspberry Pi downloads

    www.raspberrypi.org/downloads


    We take a look at some of the key aspects involved in installing a pre-built OS


    With its small size and cheap price, many people might be fooled into thinking
    that the Raspberry Pi is only usable for basic tasks, and learning to program
    on. While one of the primary goals of the Pi is to increase computer literacy
    at a lower level than just learning how to create Excel spreadsheets, the Pi has
    many other great uses.


    As the Raspberry Pi is a mini PC, with an HDMI and analog TV output rather than
    a traditional monitor connection, it can perform many common tasks that a laptop
    or desktop is often used for. While it doesn'' really have the processing power
    or RAM to run the latest version of Windows, there are other options.


    There are a wealth of fullyfledged operating systems, many forked from their desktop
    big brothers that have optimised specifically for the Pi. One of the most popular
    of these is Raspian, which is a key part of the Linux ecosystem, and many other
    open source distributions are forked from the Debian source code. The original
    Debian was released in 1993, and it''s coming a long way since. Raspian needed
    work to get performance levels up to standard, the Pi uses the older ARMV6 architecture.
    It''s now a everyday desktop.


    > Did you know...

    nThe official distro for the Pi is called Raspian. That''s what we recommend,
    but there are other options.


