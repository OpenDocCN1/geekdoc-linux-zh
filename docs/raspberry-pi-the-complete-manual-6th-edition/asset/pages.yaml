  md: '# Build a Raspberry Pi-powered car


    # Projects


    # Attach the servo cables to the new controller


    We soldered our 16-channel I2C servo controller board from myodpi.com as per its
    instructions and simply plugged channel 0 (steering), and channel 1 (motor) headers
    onto it. We are 9x channels in total the bottom two are ground, the middle two
    and the top two are the PWM (pulse-width modulation) signals. This is a good time
    to think about placing the extra components and the best fixing methods to be
    sticky-back Velcro.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_108_0.png)


    # Connect the I2C bus to the Raspberry Pi


    # Hook it up to the Raspberry Pi


    We''re using the Raspberry Pi''s I2C to control the servo board, which only needs
    four cables - they all go between the Raspberry Pi and the servo board as pictured.
    Visit http://bit.ly/N3cnqUJ for a tutorial on how to set up I2C on the Raspberry
    Pi


    On a Rev 1 Raspberry Pi, the cables look the same. Though the boards have different
    labelling, the physical pins are in the same place. Bottom left (closest to power
    connector) is the 3.3V power, next to that is the SDA header which is data and
    to the right is the SCL channel, which controls the I2C devices. And finally -
    on the top-right port - we recommend printing a labelled image of the GPIO pins.


    From top to bottom we need to use the GND, 2, SCL, 3 and 4, VCC, which map directly
    to the servo ports on the Raspberry Pi. Essentially this is power, and ground
    communication channels.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_108_1.png)


    # Overview of the main components


    # Find a home for it


    You should have the servo board in the middle with the steering and servo controller
    on one side and the other end of the speed controller (that end) will have much
    thicker wires; the speed controller also has two thick wires going to the motor
