  md: '# Access your files with SSH


    # Projects


    the result will be on the second line of ''wlan0''. The IP address itself is a
    group of four numbers separated by full stops. If you''re on your home network,
    it will likely be similar to 192.168.0.15. We''ll use this number for our guide,
    but replace it with the IP address you''ve seen via ifconfig.


    With this information in hand, all you need to do is open a terminal window on
    your remote Linux PC and type:


    ```

    ssh pi@192.168.0.15

    ```


    This assumes your Raspberry Pi''s username is the default (which is pi) and you''re
    replacing the IP address with the one you made note of. If you''ve added user
    accounts or changed the default, you''ll need to replace the username before the
    ''@'' whatever you''ve changed to. When you press Enter, you will be prompted
    to enter the password for your Raspberry Pi – again, if it''s the default you
    can type raspberry, otherwise type in your Pi''s password and press Return.


    You''ll see the username details on the command line have changed to reflect those
    of your Raspberry Pi – you now connected. Try looking through your files or using
    nano to open a file to edit it!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_46_0.png)


    # SSH with Windows


    As is the way with most things in the Windows world, your Raspberry Pi with Microsoft''s
    operating system isn''t quite straightforward as you think. Frankly, there is
    a useful tool to help. Puty allows you to connect to your SSH session and it''s
    easy to set up and use. You can download Puty here: www.chiark.greenend.org/~sgatham/putty


    # Never another IP address


    Of course, if you take your Raspberry Pi to another network, your Pi''s IP address
    will be different. If you just want to connect to it remotely, it becomes incredibly
    tiresome to set up your Pi with a keyboard, mouse and monitor just to get the
    IP address. Wouldn''t it be easier to just type the Raspberry Pi''s name into
    the terminal to connect? It sounds too good to be true, but it''s actually easy
    to do.


    All you need is a small piece of software that lets you discover host and services
    on your local network by name instead of IP address (Fig 2). To set it up on your
    Pi a terminal and:


    ```

    sudo apt-get install avahi-daemon

    ```


    Once the installation is complete, all you need to do to access your Raspberry
    Pi via SSH is type the following into the terminal:


    ```

    ssh pi@raspberrypi.local

    ```


    What''s more you can use the name of your Raspberry Pi when you access it via
    any other form of networking, be it Samba, remote login with VNC or anything else!


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_46_1.png)


    Fig 2: The Avahi tool enables you to log into your Pi via SSH by name, rather
    than needing to discover its IP address


    47'
