    # Control your Raspberry Pi-powered car


    Control a toy car with a smartphone and the latest web technologies


    Now that we have our fantastic Raspberry Pi-powered car all wired, charged and
    ready to go, it''s time to make it alive. We are using the best technologies that
    the JavaScript programming language offers, to harness the natural movement of
    your hand and wirelessly drive the vehicle.


    > Did you know...

    Our code will send instructions to our car over twenty times per second. It will
    be very responsive to drive!


    +   Each little movement of your hand will trigger an event that calculates what
    the car should do and then sends it over a socket connection. If all goes to plan
    you should have complete control over your vehicle!


    # Download and install the software


    01 First of all, you will need the I2C connectivity for new project code – how
    about /var/www/picar? Type sudo mkdir /var/www/picar in the terminal to make the
    directory and then change into it: cd /var/www/picar


    Now, to download the project using Git, type sudo git clone http://github.com/shaunik/picar:
    If you haven''t got Git, install it with sudo apt-get install git.


    This will download the custom software for driving the car, but we still need
    the web server and some other bits before we can start burning rubber...


    Below All you need to finish off your project is to access to a smartphone or
    tablet


