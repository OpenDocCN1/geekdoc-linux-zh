  md: '# Back up your Pi


    If you want to keep the files on another computer, that''s fine, but it will be
    prone to the exact same problems as the Pi in the long run. Keeping them on an
    external hard drive is a good idea, and putting them on a cloud storage service
    is better yet, enabling you to access them from anywhere with an internet connection
    (Fig 2).


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_40_0.png)


    Fig 1: Accessing the SD card from another PC is an easy alternative to transferring
    files between machines via a USB stick


    # Cloning


    Creating a clone depends on what operating system you''re using on your main computer.
    For Macs and Linux, you can use a simple command-line tool called dd to create
    an copy of the SD card (Fig 3). This is done in the terminal emulator or command
    line, so bring that up part. Make sure the SD card is plugged in and enter:


    ```

    $ fdisk -l

    ```


    This lists all connected devices. The SD card will have 2, 4 or 8GB of size, depending
    on its size. It''ll likely be something like /dev/sdx, where x is the letter attached
    to the SD card. To copy it dd, you can then write it into the following terminal:


    ```

    $ dd if=/dev/sdx of=backup.img bs=1M

    ```


    You can also add a path to the image you''re creating to put it in a specific
    folder. The process will take some time, and will produce a multi-gigabyte file
    you can then write onto the SD by reversing the command:


    ```

    $ dd of=backup.img if=/dev/sdx bs=1M

    ```


    While this is useful as a backup, you can also use the image to produce SD cards
    to give to friends or keep in the various places where you use your Raspberry.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_40_1.png)


    Fig 2: Cloud storage services making backup files easy and secure, as they''re
    a lot prone to problems


    # Windows


    To create a clone on Windows, you can win the Win32 Disk Imager (Fig 4). Download
    it from here to install it. bit.ly/L8YdYG


    Once installed, insert the SD card and launch the software. Choose a name for
    the backup file and select the SD card from the list of devices. Now press Read
    and it will create the backup file.


    Again, this might take a while; however, this time you are at least shown a progress
    bar.


    Storing your cloned image is a little bit more than your important files – the
    size of the image being in the gigabytes it will fill up a lot of cloud-storage
    services. If you have the space, definitely keep it on there; however, you may
    need to put it on an external hard drive.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_40_2.png)


    Fig 3: The tool that you''ll use on a Linux and Mac computer, and it''s available
    by default in the terminal emulators


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_40_3.png)


    Fig 4: Win32 Disk Imager making backups up the entire OS easy, and you can use
    it to write the image back to the SD card'
