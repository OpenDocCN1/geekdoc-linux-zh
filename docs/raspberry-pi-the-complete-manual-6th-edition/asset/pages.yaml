  md: '# Tether to an Android device


    # What you''ll need...


    # Tether to an Android device


    Android device


    USB cable


    Need the internet on your Pi? Try out a physical tether to your Android device
    for online access


    The portability of the Raspberry Pi is one of its most lauded features. Mini screens,
    mini wireless keyboard and mouse combs, portable batteries and more can get you
    out and about, but the internet is a stumbling block that you can''t easily fix
    with an accessory. What you also usually have with you is an Internet-connected
    magic pocket box called a smartphone, with a bit of know-how, you can connect
    the Pi to and steal some internet from. Over the next two pages we will import
    this know-how to get using your Raspberry Pi on the Internet when you''re on the
    go.


    # The easy way


    +   01 Many smartphones have a Wi-Fi hotspot feature, which your Pi can easily
    attach to. First of all, turn the hotspot on and boot into the Pi. Connect a wireless
    dongle and open the wpa_gui in Preferences>Wi-Fi Configuration.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_69_0.png)


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_69_1.png)


    # Scan for device


    +   02 Click Scan to open the scan window and scan again from inside there. It
    should pick up your device - connect it to any Wi-Fi network and the Pi will remember
    it for when it needs it next.


    # Set up tether


    +   03 Connect your phone to your Raspberry Pi via a USB cable - depending on
    the amount of power your Pi has, it might have trouble charging your phone but
    will let you tether. In the tethering menu you can now activate USB tethering.'
