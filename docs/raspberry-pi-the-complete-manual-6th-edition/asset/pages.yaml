    But how might you use this? Well, the iBeacon technology is really likes a sort
    of NFC, but without the close proximity of contact. This naturally has some security
    concerns, so be careful how you use...


    # iBeacon scanning on Android


    09 Various apps are available for Android users planning to communicate with their
    Raspberry Pi Beacons. These include Locate Beacon, iBeacon Detector and Beacon
    Scanner. As well as being compatible with the iBeacon, they also provide support
    for Eddystone, the Android answer to iBeacon, and AltBeacon, an open iBeacon alternative.
    Pictured at the lower-left of the opposite page is iBeacon & Eddy Scanner (aka
    Scanner), which will scan for a nearby beacon following a simple button press.
    Once the iBeacon is found, the app displays live info, and when this is tapped,
    a detailed set of data.


    ![](img/4e995e1f4f2888a19b2d6bf0add45e32_100_0.png)


    # PiBeacon projects to consider


    10 Various projects for Raspberry Pi-powered iBeacons can be developed, including
    systems that can assist with any smart home builds you have planned. Among these
    things like garage door automation, switching of a device as light, or simply
    tracking the whereabouts of your Raspberry Pi.


    Note that the majority of projects will work with whatever mobile device you are
    using, over the platform-specific details of detection whenever you''re researching
    such projects. To get started, we''ll use the remainder of this tutorial to take
    a look at a couple of PiBeacon projects you can build today.


