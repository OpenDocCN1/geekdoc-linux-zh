  md: "# Control an LED using GPIO Projects\n\n# Breadboard\n\nThe Breadboard, or\
    \ prototype board, provides an easy-to-use and solderless environment for creating\
    \ and changing your development circuits\n\n![](img/4e995e1f4f2888a19b2d6bf0add45e32_60_0.png)\n\
    \n# Breadboard wire\n\nA must for any budding electrical engineer, these male-to-male\
    \ and male-to-female wires make for fast and easy circuit building\n\n# Coloured\
    \ LED\n\nDifferent coloured LEDs are a great way to physically are which part\
