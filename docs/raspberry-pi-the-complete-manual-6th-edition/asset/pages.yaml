    # Projects


    Since you have not told the socket to turn off, it will stay on, which means the
    lamp will stay forever (or until the bulb blows!). To turn the socket off after
    five seconds, import the function at the start of your program (line 2, below),
    add the command to turn off the socket (line 5). Then add a pause to the sleep
    command (line 7) and finally turn off the lamp (line 8). Now save and run the
    program.


    08


    # Web-based applications


    It is possible to augment this hack so that you can turn the lamp off from a mobile
    device such as your phone, laptop or tablet. This makes the project more impressive,
    slick and fun. The first step is to configure your Raspberry Pi as a web server
    and display a web page with the ON / OFF option. These buttons are interactive
    and control the socket. Open the LX Terminal and install pip and Flask:


    09


    ```

    energie.switch_on(1)

    time.sleep(5)

    ergie.switch_off(1)

    ```


    ```

    sudo apt-get install pip

    sudo pip install flask

    ```


    # CSS and HTML


    To make the web page, you need to set up an HTML and a CSS file. HTML stands for
    HyperText Markup Language and used to create web pages. Your browser reads HTML
    files and converts them into web pages, enabling images and objects to be embedded
    into them. Cascading Styles Sheets, or CSS, is the code which describes how the
    web page will look; the presentation of the content. It contains instructions
    on how the elements will be rendered. Here, it controls how the and and options
    will be presented.


    10


    > Using a mobile device such as yours makes the whole project more impressive,
    slick and fun


    # The HTML files


    This folder is where the HTML file is saved that contains the structure for the
    website layout. The code names the web page tag and, most importantly, the links
    are for the on and off option. Open a text editor from your Start menu, or use
    nano to create a new file. Add the HTML to the file and save it into the template
    folder, naming it ''index.html''. Remember, this is an HTML file and must end
    with the file extension.


    12


