    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_171_0.png)


    Now you want to use awk to display a formatted version of /etc/passwd where it
    is easy to read and shows only the username, UID, GID, and shell path. You accomplish
    this by executing the command that tells awk BEGIN the headers of the output and
    set the FS variable to a colon. You then tell awk to use the \t before/or after
    each column name you are labeling the table when it is printed by the print command.
    You also tell awk to print fields 1, 3, 4, and 7, which line up the headers to
    the column headers as well as possible. You also use the \t to format how the
    fields will be displayed and to indent the text to the column headers as well
    as possible. You then tell awk to END processing and print the completed report
    at the end of the output before telling awk to execute this after passwd file.


    ```

    awk -FS=":" print "User(UID|GID|Shell)----------------------------------------------------------------";n{print
    $1,"\t",$3,"\t",$4,"\t",$7};

    END {print "--------------------------Completed------" }

    ```


    This inline script requires allows you to go down to the awk interpreter prompt
    as specified by the >.


    Auk can script just about any output and text you want. You can transform and
    manipulate it any way you can imagine. This example illustrated the basics of
    what is possible.'
