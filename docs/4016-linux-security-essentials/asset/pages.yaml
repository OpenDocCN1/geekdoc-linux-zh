    SEC401 | Security Essentials Bootstrap Style 195


    The trifecta of ls, ps, and netstat can be powerful in investigation, especially
    when tracking down\and finding the adversary. The trick is to identify activity
    that meets all three criteria:


    +   1. A new file or a file that has been modified should not be modified in the
    normal running of the system.

    2. This new file is an example of what is running on the system.

    3. This file is also making an outbound connection.


    To add more clarity to the analysis, you can also look at whether the file is
    running every time the system reboots. Adversaries do have persistence on a system.
    They do not want to own it today; they want toconsistently own it. Therefore,
    they like to run malicious activity every time the system reboots; although looking
    for this activity is important, it tends to be less important on mission-critical
    UNIX/Linux systems

    because they do not get registered for a long period of time.


    An additional bonus area is to look at the outbound connection. The connection
    going

    direct to an IP address, or did it start off as a domain name? Normal user activity
    traditionally uses a domain

    name to identify the connection; in contrast, an adversary will directly connect
    to an IP address.'
