  md: '# Rsyslogd


    +   * Supports both local and remote logging

    * Supports syslog.conf

    * Supports Regex for advanced filtering

    * Uses a config file /etc/rsyslog.conf or /etc/rsyslog.d/*.conf


    ```

    # Log all kernel messages to the console.

    # Logging much else clutters the screen.

    # *. /dev/console

    # Log anything (except mail) of level or higher.

    # Don''t log private authentication messages!

    # *informal home@authpriv.cron.none

    # /var/log/messages

    # The authpriv file has restricted access.

    # /var/log/secure

    :msg,startwith,"iptables": "

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_148_0.png)


    An alternative to syslog for both local and remote logging is the rsyslog daemon.
    Rsyslog is a system utility providing support for message logging. It has many
    of the startup flags and a similar config file. Rsyslog supports the use of syslog.conf
    but sysloglog has some extended logging capabilities within the rsyslog.conf and
    is not backward compatible with syslog.conf. Rsyslog should be able to use a standard
    syslog.conf and act like the original syslog. It is worth noting that rsyslog-enhanced
    configuration file interacts transparently with the version of syslog found in
    the standard libraries.


    The main configuration /etc/rsyslog.conf or an alternative file, given with the
    -f option, is read at startup.

    The and most powerful difference between syslog and rsyslog is the capability
    to complete advanced filtering on log messages and direct them to the log files
    where you want. You can filter messages based on different parameters within the
    message such as what the message starts with or what the message contains to determine
    with more granularity what goes to log files. In addition, if you need even more
    granularity, rsyslog supports regex, so you can filter using a complex regular
    expression to match exactly what you want to go a specific log file or remote
    server location.


    Reference


    +   1. https://linux.die.net/man/8/rsyslog'
