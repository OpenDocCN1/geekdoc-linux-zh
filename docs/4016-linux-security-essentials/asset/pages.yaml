  md: "# # Disabling Unneeded Kernel Modules with Modprobe\n\n+   - Modprobe is used\
    \ to add loadable kernel modules (LKM) to the kernel or remove them from the kernel\n\
    - Modprobe exists in /etc/modprobe.d directory\n- Disable or blacklist unneeded\
    \ kernel modules\n  - Reduces exposure to exploits\n  - Reduces code complexity\n\
    \n+   - Modinfo enables you to see what modules do\n  - This gives information\
    \ on other dependent modules to assist in determining which module to disable\
    \ or blacklist\n\n![](img/713f43d93c9396a48fab01efb4b1b069_107_0.png)\n\nAs part\
    \ of the hardening process of a Linux system, you often need to use the modprobe\
    \ utility to add or remove kernel modules (LKM) to the kernel. Using modules is\
    \ often the easiest way to gain kernel access, and this would be a good place\
    \ to put a rootkit. You can easily load a rootkit as a kernel module at boot time.\
    \ Therefore, it is good practice to blacklist modules or disable them from loading\
    \ at boot time. By blacklisting or disabling modules you effectively disable them\
    \ from running. However, be aware how the dependent modules that will help in\
    \ determining how specific you want or need to be while blacklisting.\n\nTo return\
    \ all modules with the name specified in your search, run the following command.\
    \ This way, you can find modules that need to be blacklisted or disabled.\n\n\
    ```\nfind /lib/modules/ uname -r -name *modename*\n```\n\nTo disable a module,\
    \ use the install option to redirect the module you want to disable; however,\
    \ if you define a module as /bin/false, the module will not be loaded. The setting\
    \ to /bin/false is a good convention because you can more easily see that nothing\
    \ is not allowed.\n\nReference\n\n+   - \"Kernel hardening: Disable and blacklist\
    \ Linux modules\", https://linux-audit.com/kernel-hardening-disable-and-blacklist-linux-modules/"
  merge: -1
