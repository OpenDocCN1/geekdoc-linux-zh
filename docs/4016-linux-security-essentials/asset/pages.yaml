  md: '# IP Tables Rules: Host-Based Firewall


    ```

    iptables -A INPUT -p tcp --dport ssh -j ACCEPT

    ```


    +   1. Append this rule to the input chain (-A INPUT), we look at incoming traffic

    2. Check to see whether it is TCP (-p tcp)

    3. If so, check to see whether the input goes to the SSH port (--dport ssh)

    4. If so, accept the input (-j ACCEPT)


    ![](img/713f43d93c9396a48fab01efb4b1b069_224_0.png)


    The rules in chains make the IP Tables work. All packets go down the chain until
    they find a matching rule to, which may be another chain or accept/deny.


    Basic IP Rules Options

    -A: Append this rule to a chain. Valid chains for what you''re doing are INPUT,
    FORWARD, and OUTPUT, but this tutorial deals with INPUT, which affects only incoming
    traffic.

    -L: List the current filter rules.

    -m: Allow filter rules to match based on connection state. Permits the use of
    the --state option.

    --state: Define the list of states for the rule to match. Valid states are

    NEW: The connection has not yet been seen.

    RELATED: The connection is new but related to another connection already permitted.

    ESTABLISHED: The connection is already established.

    INVALID: The traffic could not be identified for some reason.

    -m limit: Require the rule to match only a limited number of times. Allows the
    use of the --limit option.

    limit: The maximum matching rate, given as a number followed by /second,/minute,/hour,
    or /day, depending on how often you want the rule to match. If this option is
    not used and -m limit is used, default is Hour.

    p: The connection protocol used.

    --dport: The destination port(s) required for this rule. A single port may be
    given, or a range may be given as start:end, which will match all ports from start
    to end, inclusive.'
  merge: -1
