  md: "# SELinux\n\n+   * Security Enhanced Linux is a loadable kernel module specific\
    \ to security\n* Provides access control policies for mandatory access control\n\
    \  * Separation between policy and enforcement\n  * Controls over process initialization,\
    \ inheritance, and execution\n  * Many controls are available\n* Most modern UNIX\
    \ releases support SELinux kernel module\n* Overall controls what programs can\
    \ do\n\n![](img/713f43d93c9396a48fab01efb4b1b069_110_0.png)\n\nSEC401 | Security\
    \ Essentials Bootcamp Style 108\n\nSELinux is a robust solution for hardening\
    \ the Linux system with Mandatory Access Control (MAC) mechanisms. It requires\
    \ detailed configuration and a high skill set to deploy and manage.\n\nSELinux\
    \ uses Mandatory Access Controls, which enable administrators to control all software\
    \ interactions on the system. The security model is based on least privilege and\
    \ starts with users having no rights at all. Administrators must grant users access\
    \ through the use of security policies.\n\nOriginal Linux distributions follow\
    \ the concept of Discretionary Access Control (DAC). DAC gives users full security\
    \ access over their installed and owned applications. This can lead to security\
    \ risks to systems if a user's account is compromised.\n\nSELinux is not designed\
    \ to replace existing security for Linux. It is designed only to enhance it."
  merge: -1
