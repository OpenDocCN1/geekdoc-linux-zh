  md: '# Centralized Logging


    +   * Protects against log wiping

    * Denial of service possibility

    * Needs a lot of disks for large environments

    * One machine holds a lot of sensitive information

    * Easy to search and scan


    ![](img/713f43d93c9396a48fab01efb4b1b069_152_0.png)


    SEC401 | Security Essentials: Bootcamp Style 159


    ![](img/713f43d93c9396a48fab01efb4b1b069_152_1.png)


    In any environment that has multiple machines, you should examine centralized
    logging. Not only does it greatly simplify the life of a system administrator,
    it has added the security benefit of preventing malicious attackers from clearing
    their tracks behind them (unless they compromise the log server).


    The main advantage of centralized logging is that it makes it difficult for a
    remote attack to wipe or corrupt the system logs. Any logs generated from them
    are sent immediately to another machine, which stores the data. Using the syslog
    server does not, in turn, when hacked, the information remains to be discovered
    by the system administrator and can be used in the recovery process.


    One vulnerability of this design is that it makes possible to either cause the
    syslog client to send so much log data that it overwhelms the central server,
    or an attacker can send false messages to the central syslog server to clutter
    up the logs. This means a central syslog server should be configured to receive
    system logs from only those machines that legitimately send logs to, and it should
    be protected by a firewall from all machines.


    The only protection against a client that is sending lots of information is to
    have a syslog server that has lots of disks to store that information. Logs can
    be rotated quicker if needed, and several partitions can be used for logging the
    segment risk of bringing down all the logging in an environment. Some mechanisms
    are built in to aggregate repeated messages. That is, syslog shows strings as
    "last message repeated X times." In the end, the protection against a malicious
    user causing logs to fill up is to use a firewall to block the attacker from reaching
    the environment, rotates log quicker, or have enough disks to weather the attack.


    The consequence of having centralized logging is that all the logs now reside
    in one place. Many logs contain information that may provide clues as to what
    is important in an environment. Some logs may even contain privileged information.
    With this information all in one place, that machine becomes a valuable target.
    It is critical to protect. It should run the logging service only to receive messages
    and have an SSH daemon that accepts only a limited number of logins from a small
    set of IP addresses to administrators.


    150 ©2017, Secure Anchor Consulting'
