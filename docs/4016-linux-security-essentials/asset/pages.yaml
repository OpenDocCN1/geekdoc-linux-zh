  md: '# Configuration Management Tools


    +   - Configuration management tools are an important aspect for increasing the
    overall security of your UNIX environment

    - Keeps systems configured the same

    - Many different players in the market

    - Both open source and commercial options


    ![](img/713f43d93c9396a48fab01efb4b1b069_90_0.png)


    ![](img/713f43d93c9396a48fab01efb4b1b069_90_1.png)


    Configuration management tools are an important aspect for increasing the overall
    security of your UNIX environment. In a large UNIX environment, it is also important
    that all UNIX systems are compliant to the hardening standards set by the organization.
    A configuration management solution makes the task of hardening all UNIX systems
    at one time much easier. In many ways, this is lot like Windows Group Policy,
    where you can set hardening standards, control packages, and control package updates.


    Many players are in the marketplace today, providing both open source and commercial
    options. Each has pros and cons regarding ease of use, the number of prebuilt
    packages available to control existing software, supported distribution of Linux,
    and cost.'
