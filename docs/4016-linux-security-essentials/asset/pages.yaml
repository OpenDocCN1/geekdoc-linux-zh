- img_proc: true
  md: "```\n# packages drop log rotation information into this directory\ninclude\
    \ /etc/logrotate.d\n\n# no packages own wtmp, or btmp -- we'll rotate them here\n\
    /var/log/wtmp {\n  missingok\n  monthly\n  create 0664 root utmp\n  rotate 1\n\
    }\n\n/var/log/btmp {\n  missingok\n  monthly\n  create 0664 root utmp\n  rotate\
    \ 1\n}\n```\n\n# system-specific logs may be configured here\n\nFew directives\
    \ in this example are not explained in the comments. For example, missingok tells\
    \ rotate to continue to the next file if the file does exist instead of quitting\
    \ with an error. The create directive gives the file permissions owner and group\
    \ to create the file after rotating. The rotate directive tells how many copies\
    \ of the logfile to keep\n\nThis example shows two of the directives that specify\
    \ how long to keep the file, weekly and monthly. There is also a daily and the\
    \ size directive, which specify that the file should be rotated when it reaches\
    \ a certain size. The size directive is followed by the size in bytes (kilobytes\
    \ can be specified with a k and megabytes with an M). For example, 300M rotates\
    \ the file when logrotate runs and finds that it is larger than 300 megabytes.\n\
    \n# logrotate.conf for Syslog Files\n\nIn UNIX systems, a program that has a file\
    \ for open will continue to write to that file, even if it is moved or removed.\
    \ Many programs open their log files when they start and do not close until they\
    \ shut down. Most long-running programs, including syslog, have a method to close\
    \ their log file. Often, this involves sending a HUP signal (kill -pid>). Logrotate\
    \ has a number of options to enable you to run commands before or rotating the\
    \ files, which can be used to facilitate this. For syslog files, you want to use\
    \ the postrotate directive to give a command to send an HUP to syslog. Then, you\
    \ use the endscript directive. If you use one entry for all syslog files, you\
    \ can use the sharedscripts directive to run this command once.\n\nTo use instead\
    \ of /etc/cron.daily/syslog to manage syslog files on non-Red Hat-based systems,\
    \ add the following to the end of your logrotate.conf file:\n\n```\n/var/log/syslog\
    \ /var/log/messages {\ncreate 0640 root\ndaily\nrotate 7\nsharedscripts\npostrotate\n\
    /bin/kill -HUP 'cat /var/run/syslog.pid 2> /dev/null || 2'\nendscript\n}\n```"
