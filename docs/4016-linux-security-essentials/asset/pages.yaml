    shadow remember=6"

    ```


    The following variables set reuse policy:


    +   - difok=$: Number of characters that must be different from the old password
    $.

    - pam_pwhistory: Modules remember old password uses.

    - remember=$: This value is the number of old passwords remembered.


    If /etc/security/opasswd does not exist, you need to create the file.'
