  md: '# Disabling Dynamic Loading After Boot


    +   * Linux kernel can have built-in modules or loadable dynamic modules

    * Gives flexibility to the kernel

    * Don''t have to recompile the kernel for every thing that is encountered

    * The risks of having dynamic loading after boot is that a rootkit with any functionality
    can be inserted into the kernel with root privileges

    * Disabling loadable kernel modules severely limits the vector of a malicious
    actor injecting a malicious kernel module


    ![](img/713f43d93c9396a48fab01efb4b1b069_108_0.png)


    SEC401 | Security Essentials Bootcamp Style **104**


    We''ve already discussed the risks of rootkits loading into the kernel via loadable
    kernel modules. Be aware that dynamic loading modules are even more dangerous;
    they allow a rootkit to inject itself into the running kernel with no reboot required.


    When it comes using a static kernel and not allowing dynamic loading of kernel
    modules, remember that dynamic kernels introduce incredible flexibility. Static
    kernels can still have injected malicious code. Therefore, disabling the dynamic
    load capability is a good start, but is not a guarantee that you will be protected;
    however, it limits the chances.


    Reference

    1. ”Increase security without using dynamic kernel modules?”

    http://security.stackexchange.com/questions/5659/increase-security-without-using-dynamic-kernel-modules


    106 © 2017, Secure Anchor Consulting'
