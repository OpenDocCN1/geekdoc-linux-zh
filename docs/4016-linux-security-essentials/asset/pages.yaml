  md: '# DAC SELinux Policy MLS/MCS


    | Discretionary Access Control (DAC) | Multilevel Security |

    | :--- | :--- |

    | - Deny access | Ranges written as |

    | - Will not use SELinux access on object | - Low-level and high-level (if levels
    differ)|

    | | - Low-level (if levels are identical, ie so=so)|

    | - Allow or default | Multi-Category Security:

    | - SELinux access policy applies | - so=0=CompanyConfidential |

    | | - so=1=PatientRecord |

    | | - so=2=Unclassified |

    | | - so=3=TopSecret |

    | | - so:1,c:3=CompanyConfidentialEdhat


    ![](img/713f43d93c9396a48fab01efb4b1b069_111_0.png)


    Most Linux variants use a security measure called Discretionary Access Control
    (DAC). This enables the sysadmin and all users to manage the security of files
    they own or manage. There is one flaw in this method, and that is exploit that
    allows access to the system because any potential users may be able to elevate
    themselves or processes they own and circumvent security. SELinux takes this security
    control and enhances it with the capability to afford Mandatory Access Controls
    (MAC) along with the default DAC. What does this mean? If the system is using
    DAC and a default DENY access is set up, there is no need to use any other security,
    and SELinux is not a player. However, if the default is allow and you want more
    finite control over the security permissions and access to your files, directories,
    and processes, SELinux is the answer.


    Labels are an attribute of Multilevel Security (MLS) and Multi-Category Security
    (MCS). Each level is a sensitivity-category pair, with categories being optional:


    +   - When using categories, the level is written as sensitivity:category-set.

    - When not using categories, the level is written as sensitivity.


    Categories can be abbreviated. For example, c0,c3 is the same as c0,c1,c2,c3.


    MLS enforces the Bell-LaPadula Mandatory Access Model, and it is used in Labeled
    Security Protection Profile (LSPP) environments.'
