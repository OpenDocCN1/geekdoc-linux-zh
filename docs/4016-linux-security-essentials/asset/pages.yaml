  md: "# Introduction to PAM\n\n+   * PAM stands for Pluggable Authentication Modules\n\
    * System libraries handle Linux authentication\n* Four management groups\n  *\
    \ Authentication\n  * Passwords\n  * Sessions\n  * Accounts\n* Configuration files\
    \ are in /etc/pam.d\n\n| Request | Application | Success or Failure | Configuration\
    \ file: |\n| :--- | :--- | :--- | :--- |\n| | PAM Library | auth requisite aaa.so\
    \ auth requisite aaa.so account sufficient ccc.so |\n| | | | password required\
    \ 222.so |\n\n![](img/713f43d93c9396a48fab01efb4b1b069_70_0.png)\n\nThe Pluggable\
    \ Authentication Modules (PAM) are system libraries that handle Linux authentication\
    \ and the many tasks that go along with it. Originally invented by Sun Microsystems,\
    \ PAM has evolved into a robust technology that simplifies and strengthens security\
    \ on Linux systems by providing individual modules for a large number of diverse\
    \ applications requiring authentication services.\n\nPAM employs four management\
    \ groups that handle specific types of authentication requests. The four groups\
    \ perform the following functions:\n\n+   * Authentication (auth): Used to establish\
    \ a user identity and possibly membership in a group\n* Passwords (password):\
    \ Used when a user provides authentication credentials as a password\n* Sessions\
    \ (session): Aids in implementing services and tasks associated with user authentication\n\
    * Accounts (account): Used to perform actions not based on authentication\n\n\
    All PAM configuration files are located in /etc/pam.d, and they are named for\
    \ the service that they control. The common format for these files is as follows:\n\
    \nType Control Module-path-arguments\n\nThe Type field is the management group\
    \ of which the module is a part. The Control field specifies the action to take\
    \ if the PAM authentication fails. The Module-path and Module-arguments fields\
    \ specify the name and path for the module in use (within the /lib/security directory)\
    \ and what arguments should be passed to it."
  merge: -1
  pgno: 70
- img_proc: true
  md: 'An example of a PAM file is shown here (for the file /etc/pam.d/su):


    ```

    %%PAM-1.0

    auth sufficient pam_rootok.so

    # Uncomment the following line to implicitly trust users in the "wheel" group.

    #auth sufficient pam_wheel.so trust use_uid

    # Uncomment the following line to require a user to be in the "wheel" groap.

    #auth required pam_wheel.so use_uid

    auth include system-auth

    account sufficient pam_succeed_if.so uid = 0 use_uid quiet

    account include system-auth

    password include system-auth

    session include system-auth

    session optional pam_xauth.so

    ```'
