  md: '# Containers Versus Virtual Machines ( 1 of 2)


    +   * Containers and virtual machines are similar in being isolate and perform
    resource allocation

    * They use a different architectural approach

    * Containers are more compact and portable

    * Virtual machines contain the entire OS

    * Containers contain the application and associated files


    As we focus on portability and dynamic environments, an area that is receiving
    more focus is containers. Traditionally, if you wanted to have isolation and resource
    allocation, you would utilize a virtual machine. This entailed installing an entire
    operating system with all the applications that are required. Although this approach
    was effective, virtual machines are typically very large and require the running
    of an entirely operating system.


    If someone wanted to move a specific application and have it run in a consistent
    manner, virtual machines did not work very well. The introduction of containers
    solved this problem. Containers contain the application and all associated dependencies
    to enable the application to run in a consistent manner on different platforms.'
  merge: -1
  pgno: 245
