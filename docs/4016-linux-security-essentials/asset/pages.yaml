  md: "# Grsecurity (S)\n\n+   * Pros\n  * Compatible with most distros\n  * Role\
    \ management\n  * Rule inheritance\n  * Policy syntax support\n  * Policy won't\
    \ enable if too permissive\n  * Memory protection\n  * RAP for defending against\
    \ reuse attacks\n\n+   * Cons\n  * All policies in one file\n  * Grad does not\
    \ write rules\n  * Unfriendly per subject learning mode\n  * Have access only\
    \ to test code because it is no longer open source; closed source is stable but\
    \ expensive\n\n![](img/713f43d93c9396a48fab01efb4b1b069_116_0.png)\n\nGrsecurity\
    \ brings a to the table to harden a Linux system. Its biggest cons, however, are\
    \ that it is no longer open source and offers only test code for, and the stable\
    \ releases are expensive. The cost of grsecurity makes it a less attractive solution\
    \ despite its plethora of features. However, with any solution, it is always important\
    \ to look at the benefits and the drawbacks and tie them back to the risk that\
    \ is being reduced. Therefore, instead of looking at the price of grsecurity,\
    \ evaluate the risk of exposure of your Linux systems being compromised because\
    \ they are not secure. Look at the likelihood of a compromise and the cost of\
    \ a breach. After you have calculated this, compare it to the cost of the solution."
