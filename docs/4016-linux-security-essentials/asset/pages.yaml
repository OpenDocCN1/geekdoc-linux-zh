    # top


    Understanding what is happening on a system is a critical component of security.
    One of the reasons many attacks go undetected is security analysts do not have
    proper visibility into the system. There is a reason doctors do a detailed physical
    and take blood work. Someone might look like and act very healthy, but some problems
    show up only by getting properly visibility into what is happening in the human
    body. This search becomes critical because, with many life-threatening diseases,
    every detection is key to survival. Computers are not different. You can have
    a computer that appears to be acting normal, and when you look below the surface,
    what you see can paint a completely different picture.


    Top is a great command for getting visibility into the operations of the computer
    by looking at the utilization of key components such as the CPU and memory. If
    some adverse activity is running on the system, it will show some indication of
    the problem'
