- img_proc: true
  md: '# Summary


    +   * Useful built-in commands and security features

    * Configuration of integrity checkers

    * Integration of host-based firewalls and how they are managed to provide security

    * Use of hardening scripts

    * Deploying package management strategies

    * Understand other tools for increasing security


    ![](img/713f43d93c9396a48fab01efb4b1b069_258_0.png)


    In this module, we learned about additional utilities and tools to improve the
    overall security of a Linux system. It is important to remember that although
    third-party utilities are valuable, the built-in tools are also important. Linux
    has many built-in tools that provide visibility to look for rogue activity. When
    the built-in tools are used, you can add additional third-party tools for more
    security.


    Remember that one of the most effective ways to find adversaries and control damage
    is to build a baseline of the system. After creating the baseline, verify that
    the baseline is secure and does not have any unusual activity. When a baseline
    is created, you can run period audits and check against the baseline. Any anomalous
    activity would be flagged and investigated.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Course Summary


    Focus on risks to critical assets


    +   Core principles:

    * Know thy system

    * Least privilege

    * Defense-in-depth

    * Prevention is ideal, but detection is a must


    # Course Summary


    With any operating system, it is critical that it be as secure as possible. However,
    it is important to remember that there is always a balance between functionality
    and security. The trick is to understand what the risks are to the critical assets
    that reside on that computer and reduce those risks to an acceptable level.



    The first way of accomplishing this is to give a system the least amount of access
    it needs to do its job. For a server, this means removing services and turning
    off ports that are not needed. It is also important to ensure the system is fully
    patched. To do this, you need to know the system and understand what runs on it.


    Finally, you should deploy multiple measures of protection to keep the system
    secure, always remembering that prevention is ideal, but detection is a must.'
  merge: -1
