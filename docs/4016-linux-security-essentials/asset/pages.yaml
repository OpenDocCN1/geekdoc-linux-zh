  md: '# Advanced Packaging Tool (APT)


    +   Debian package management is based on a tool dpkg


    +   The common package management solution is APT


    +   Packages have the extension .deb


    +   Often compatible with Ubuntu (be careful with declared dependencies)


    +   Easy-to-use syntax and commands


    ```

    root@debian:~# apt-get --help

    apt-get 1.2.1 (manual)

    Usage: apt-get [option] command

    apt-get [option] install remove pkg [pkg ...]\apt-get [option] source pkg [pkg
    ...]

    ```


    apt-get is the command line tool for retrieval of packages and information about
    them sources and configuration, upgrade and removal of packages with their dependencies.


    +   Most commands:

    - update : Retrieve lists of packages

    - upgrade : Upgrade packages

    - install : Install packages (pkg is lib6 not lib6.0)

    - remove : Remove packages

    - purge : Remove automatically and configuration files

    - dist-upgrade : Distribution upgrade, use apt-get

    - autoremove : Remove unused dependencies

    - check : Verify that there are no broken dependencies

    - clean : Remove downloaded archive files

    - download : Download the binary package into the current directory

    - show : Display the details of the given package


    See apt-get(8) for more information about the available commands.

    Configuration options are detailed in sources.list.

    Information about how to configure sources can be found in sources(5).

    Package versions can be specified in apt-preferences(5).

    Security details are available in apt-secured(8).


    ![](img/713f43d93c9396a48fab01efb4b1b069_251_0.png)


    Different variants of Linux use different package management tools, but because
    we are using Kali, we are going to talk about Debian. It enables us to directly
    practice what you have learned. If you are running a different version of Linux,
    the general principles and concepts still apply.


    Debian uses dpkg as the tool for its package management; the main piece of software
    that implements its package management is the advanced packaging tool APT. It
    is important not to confuse Linux APT with persistent threats. They use the same
    acronym, but they have a completely different meaning.


    SEC401 | Security Essentials Kali Bootcamp Sample 249


    This APT has Super Cows.'
