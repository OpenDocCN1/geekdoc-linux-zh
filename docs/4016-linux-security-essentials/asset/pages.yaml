  md: '# Grsecurity (3)


    Install


    +   - Download grsecurity for your distribution

    - Customize with the menuconfig

    - Compile and then install

    - Install gradm and paxetld


    Start


    +   - Set passwords for admin and shutdown

    - Start learning mode gradm -F -L/etc/grsec/learning.logs

    - Apply output file policy gradm -F -L/etc/grsec/grsec/learning.logs -O/etc/grsec/policy


    ![](img/713f43d93c9396a48fab01efb4b1b069_114_0.png)


    When you use its built-in menu, configuring and deploying grsecurity is fairly
    simple. It has a built-in learning mode to help auto-build security policies for
    you; you initiate it after install. In addition, you can also select a security
    level and customize it for your specific environment. Customizing a policy enables
    you to take advantage of the available features.


    In grsecurity, you can customize the following general areas:


    +   - PAX: Control and mark binaries that are to be used by the system.

    - Address Space Protection: Manage how to protect memory on this system; this
    includes control for overflows and variable storage.

    - Role-Based Access Control (RBAC) options: Control the configuration of the roles
    and ways to manage access controls.

    - File System Protection: Configure options for the file system and restrictions
    around what users can make to the file system.

    - Kernel Auditing: Control what is audited on the system and what level of detail
    is stored.

    - Execution Protections: Control what binaries can be created and what changes
    can be made to existing binaries.

    - Network Protections: Manage changes to the TCP/IP protocol stack and how it
    works.

    - Sysctl Support: Allow modification of settings at runtime.

    - Logging Options: Control the volume and level of logging that is performed.'
