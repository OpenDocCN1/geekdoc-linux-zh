  md: '# Rootkit Detectors


    +   * Look for indicators of compromise in how a rootkit operates

    * The stealthier rootkit, the less accurate the detection

    * Often used for kernel-level rootkits

    * Will work with file-level rootkits but often most effective with file integrity
    checking

    * Have been known to generate false alarms, so useful as an initial indicator
    but not a conclusive decision


    One of the methods that adversaries use maintain persistence on a system is by
    installing a rootkit onto the computer. Contrary to its name, a rootkit does not
    provide root access, but once adversaries obtain root access, a rootkit is to
    cover their tracks and allow access in a covert manner. The main premise behind
    rootkit is to not get caught; therefore, it can be tricky to detect.


    Performing file integrity checking on key files can detect file-level rootkits
    because rootkits would modify the file. The trick is how well configured the file
    integrity checking software is. If adversaries can find a file that is not being
    verified with the software, they can use that to host their rootkit. Kernel-level
    rootkits are more difficult to detect because there is no signature. Normal rootkit
    detectors are more valuable in catching kernel-level rootkits.


    Although rootkit detectors have value, there is no guarantee that they will find
    all rootkits. Typically, the stealthier the rootkit, the harder it is to detect.
    Therefore, rootkit detectors often have false alarms. Even though they are not
    perfect, they still have value as an initial triage tool.'
  merge: -1
