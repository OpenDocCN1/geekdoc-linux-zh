  md: '# Logical File System


    +   * /(root file system; top of directory hierarchy

    * /dev, /devices (directory containing files used to talk to system devices)

    * /usr (primary OS directory; read-only)

    * /var (contains log files, queues, and so on)

    * /bin, /usr, /usr/local, /opt (executable programs; some SUID/SGID)

    * /home, /export/home (user home directories)


    ![](img/713f43d93c9396a48fab01efb4b1b069_41_0.png)


    # Logical File System


    Used to be a lot of variance about where different files were located in different
    Linux "flavors," but modern Linux variants use the same general file system layout.
    The top of the file system tree is the root directory,. Below this directory are
    important subdirectory trees.


    The /dev contains special device files that programs running on the system use
    to communicate with the hardware devices controlled by the operating system kernel.
    UNIX systems derived from the AT&T System V (SYSV) UNIX standard, often put these
    device files into the /devices directory, but also usually a /dev directory for
    compatibility with other systems.


    /usr is the place where most of the critical components of the operating system
    live, including system binaries, programming libraries and tools, and online documentation.
    You can think of this directory structure being read-only after the operating
    system is installed; not many changes occur unless the operating system is upgraded
    or packages are installed./var is the place where the system frequently changing
    data, such as log files and temporary queues for services such as email and printing.


    Although programs with the operating system end up in directories like /usr/bin
    and /usr/sbin, other programs can be found throughout the system. A standard convention
    is to put third-party software obtained from the Internet into the /usr/local
    directory. SYSV-developed systems, such as Solaris and HP-UX, often put third-party
    software (particularly commercially software) into /opt. Different sites may choose
    to use a different directory naming scheme for third-party software, such as /pkg
    or /sw.


    User directories are often found under /home. For large UNIX networks, /home is
    often an NFS-mounted directory, and /export/home is the directory in which the
    files physically reside on the file server. Again, many other local conventions
    exist. Some prefer directory names like /users or /u1, /u2, and so on.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Physical File System


    +   - Logical UNIX file system is made up of multiple physical disks

    partitions


    +   - Disk partitions are mounted at various points in the file system


    +   - Different security options can be set on each mount point


    > NOTE: This is a key component of Linux:

    security can be integrated into the installation process


    ![](img/713f43d93c9396a48fab01efb4b1b069_42_0.png)


    While the UNIX file system appears to be a single logical entity to the users
    on the system, it is actually

    of several pieces (called partitions) that correspond to physical sections of
    the machine''s disks. Drives

    gener assigned to critical partitions of the logical directory structure. For
    example, the system might have one

    partition for the root file system, another for /usr, and another for /var. During
    the boot process, all

    partitions are mounted in their proper place to make the file system appear continuous.


    Disk partitions, their mount points, and the options applied to each partition
    are described in a file

    called /etc/fstab. Solaris uses the name /etc/vstab apparently to be perverse.
    These file system options in the

    /etc/fstab enable the administrator to specify different security settings for
    various partitions.


    From a UNIX perspective, drives have 16 partition "slices," either numbered 0-15
    or letter a-p.

    For example, Linux would use the device name hda to specify slice 7 (which is
    technically the eighth slice

    because the numbering starts at 0 [first [a] hard [disk] on the system]. Note
    that other UNIX systems

    as as Solaris allow only 8 physical partitions per device.


    One generally is reserved as the "overlap" partition, which represents the entire
    disk geometry.

    Convention, this is the third slice of the disk because early UNIX systems required
    the first slice to be

    t root file system and the second slice to be the swap space for the virtual memory
    system. This "overlap" slice

    is used for file systems. Not all possible disk partitions are needed. In fact,
    some

    managing just a single partition spans an entire disk ignores the other slices.
    It turns out that

    this is a bad idea for several reasons.


    First, partitions make it more difficult for problems with one subsystem, as processes
    logging data in /var,

    cause a denial of service to other processes writing data in a different partition,
    as programs writing

    in /tmp. Partitions are created at system installation time and with a fixed amount
    of space. If syslog logged

    /var with spurious messages, no logging could be done until space was freed up
    by deleting old log files

    or removing other data from the /var partition. Not being able to log new messages
    is bad, but not as bad as the

    entire system becoming unusable because the logs consume all available disk space.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'The second reason for partitioning is to make backups easier. Some partitions
    like /usr rarely need to get backed up because they change so infrequently. On
    the other hand, user home directories might need to get backed up every night.


    Third, and most importantly from a security perspective, splitting up the UNIX
    file system into different partitions enables the administrator to set different
    security options on different parts of the file system. Although the exact partitioning
    scheme for a machine will vary from system to system and site to site, it is important
    that the root file system /usr and /var be separate partitions to apply appropriate
    security measures to various OS directories. Non-OS data (user data, home directories,
    and application data) and third-party applications not supplied by the OS vendor
    generally should be put into their own partitions so that they do not "pollute"
    the OS directories.'
  merge: -1
