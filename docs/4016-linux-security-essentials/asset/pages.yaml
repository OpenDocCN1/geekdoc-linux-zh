    ![](img/713f43d93c9396a48fab01efb4b1b069_194_0.png)


    As with all the commands, options enable you to unleash the power of the commands
    and really focus on specific information. To create a baseline of a system, you
    need to know all the processes that are running. The first example shows how to
    create a list of all the running processes on this system. You can use information
    from a verification perspective in which you examine each process and verify that
    it is legitimate. You can also use it from an auditing perspective to locate rogue
    processes on the system.


    The second example shows how to sort by a given process name. Often, in investigation
    and threat hunting, you will find a program that you would like to find out details
    about. For example, say a new executable has been installed on a system, and you
    want to see if it is running as a process. In this case, you would use the -C
    option to find out additional details about a specific program.


    The third example shows how to sort the output based on different criteria. In
    this case, it is sorting by CPU utilization. Rogue programs often use a high CPU
    utilization because they are accessing files or providing false information to
    the user. By sorting by CPU, you can examine and look for potentially malicious
    activity.'
