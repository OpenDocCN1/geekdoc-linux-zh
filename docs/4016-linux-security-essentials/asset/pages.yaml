    |

    | Object Types | Yes | Yes | Yes | Learning Mode | Yes | - | Yes |

    | Account Management | | Yes | Yes | Self-Management framework, with interactivity
    | Yes | | |

    | Service Management | | Yes | Yes | Application Programming Interface | | | |

    | Network Management | | Yes | Yes | Instruction Detection System | | Yes | Yes
    |

    | Access Control Lists | Yes | Yes | Yes | Logging | Yes | Yes | Yes |

    | Role-Based Access Control | | Yes | Yes | Report Generation | Yes | Yes | Yes
    |

    | Security Context | | Yes | Yes | Intrusion Prevention System | Yes | Yes | Yes
    |

