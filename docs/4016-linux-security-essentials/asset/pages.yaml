  md: '# Enforce Stronger Passwords


    To start enforcement, modify the file /etc/pam.d/system-auth by adding


    | password requisite /lib/security/$ISA/pam_cracklib.so retry=3 minlen=8 lcredit=-1
    ucredit=-1 dcredit=-1 ocredit=-1 |


    +   * The pam_cracklib module checks the password against dictionary words and
    other constraints


    Password enforcement is managed on Linux systems by the PAM (Pluggable Authentication
    Modules). The main configuration files are maintained in the /etc/pam.d directory.


    System-wide password enforcement is controlled mainly by the system-auth configuration
    file. To set minimal password requirements, you must set the following variables:


    +   * minlen=$: Minimum length of password must be $.

    * lcredit=$: Minimum number of lowercase letters must be $.

    * ucredit=$: Minimum number of uppercase letters must be $.

    * dcredit=$: Minimum number of digits must be $.

    * ocredit=$: Minimum number of other characters must be $.'
