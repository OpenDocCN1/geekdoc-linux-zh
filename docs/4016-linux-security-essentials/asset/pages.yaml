  md: "# ## Sysctl Hardening - Source Routing\n\n+   * Source routing\n  - Allows\
    \ a packet's sender to partially or completely specify the route the packet takes\
    \ through the network\n* The danger is it allows for two-way spoofed communication\n\
    \  - It is possible for a Linux system to be part of a source routing path\n*\
    \ Set the net.ipv4.conf.default.accept_source_route to 0\n\n```\n# Disable source\
    \ routing\nnet.ipv4.conf.all.accept_source_route = 0\nnet.ipv4.conf.eth0.accept_source_route\
    \ = 0\nnet.ipv4.conf.default.accept_source_route = 0\nnet.ipv6.conf.all.accept_source_route\
    \ = 0\nsysctl reading key \"net.ipv6.conf.all.stable_secret\"\nnet.ipv6.conf.default.accept_source_route\
    \ = 0\nsysctl reading key \"net.ipv6.conf.default.stable_secret\"\nnet.ipv6.conf.eth0.accept_source_route\
    \ = 0\n```\n\n![](img/713f43d93c9396a48fab01efb4b1b069_104_0.png)\n\nYou can use\
    \ sysctl to manage settings with the TCP/IP stack for networking and kernel settings.\
    \ One setting that is important to control is the IP source routing option. You\
    \ should disable IP source routing because it can allow two-way spoofed communication.\
    \ To disable the acceptance of source routing you must set the net.ipv4.conf.default.accept_source_route\
    \ to 0.\n\n```\nroot@kali:/run/system# sysctl -a | grep source_route\nnet.ipv4.conf.all.accept_source_route\
    \ = 0\nnet.ipv4.conf.default.accept_source_route = 1\nnet.ipv4.conf.eth0.accept_source_route\
    \ = 1\nnet.ipv4.conf.lo.accept_source_route = 1\nnet.ipv6.conf.all.accept_source_route\
    \ = 0\nnet.ipv6.conf.default.accept_source_route = 0\nsysctl: reading key \"net.ipv6.conf.all.stable_secret\"\
    \nnet.ipv6.conf.default.accept_source_route = 0\nsysctl: reading key \"net.ipv6.conf.default.stable_secret\"\
    \nsysctl: reading key \"net.ipv6.conf.eth0.stable_secret\" net.ipv6.conf.eth0.accept_source_route\
    \ = 0\n```"
