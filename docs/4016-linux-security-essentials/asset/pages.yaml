- img_proc: true
  md: '# Built-in Commands


    +   * Linux has many useful built-in commands

    * Security is about visibility, baselining, and automation; all three are very
    powerful components of Linux

    * It is important to understand what is running on a system and what is happening
    on the system

    * There is no such thing as an invisible adversary

    * Many people always look for third-party tools when Linux has a vast area of
    capabilities


    ![](img/713f43d93c9396a48fab01efb4b1b069_183_0.png)


    Everyone wants third-party tools when it comes to security, but we often forget
    that Linux has many powerful built-in commands. Although third-party tools have
    value, it is important to master the built-in commands available to you to truly
    become a security expert. Attackers leave clues. They cannot break into a system
    without leaving behind artifacts. When a system is compromised, you have to make
    changes to the system.


    A powerful way to hunt for host-based threats is to use the tools that are built
    into the operating system. Host-based threat hunting involves looking for signs
    of an adversary that might be on the system. As many times, we have said visibility
    is key to finding the adversary and controlling the damage.


    Using built-in commands to understand what is installed, what is running, and
    what is happening in security is critical. If you don''t have this foundation,
    securing a system becomes difficult.'
  merge: -1
