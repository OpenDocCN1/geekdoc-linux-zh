    outstanding shares, or (iii) beneficial ownership of such entity.

    root@kali:~#

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_164_0.png)


    Sed will implicitly print everything that is sent to it, but when you use the
    p command, it will explicitly print lines from a file. As a result, it will implicitly
    print the lines and explicitly the resulting line will be printed twice. To stop
    this behavior, use the -n switch to suppress the implicit print function of sed
    when you are trying to print lines you want.


    Say you have a license file to view, but you only want to view the first five
    lines. You accomplish this by executing Sed -n ''1,5p'' license.txt. In doing
    so, you are providing a sed list that acts as a range, and the p tells to print
    only those lines from the license file. You can accomplish the exact same behavior
    by executing sed -n ''1,+4p'' license.txt, where you are telling sed to print
    line one plus four more lines.


    If, for some reason, you want to see every other line printed of the license file,
    you can execute sed -n ''1~2p'' license.txt. In doing so, you are telling sed
    to print line 1 and then using the tilde (~) to tell it to display every two lines.'
