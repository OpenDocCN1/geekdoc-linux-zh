  md: '# Fedora


    Currently, Fedora is the third most popular distribution. The Fedora project is
    based on Red Hat Linux, which is one of the most profitable and largest Linux
    companies in the world.¹ Red Hat maintains a series of commercial products, most
    notably Red Hat Enterprise Linux. The fact that there is a for-profit side of
    Fedora is a sore point for some critics who feel that Fedora is simply the test
    bed for Red Hat''s Enterprise release.


    Unlike Ubuntu


    Red Hat developed the Red Hat Package Manager (RPM), which resolves dependencies
    on installation much like APT does for Debian and Ubuntu.


    Fedora also makes use of a newer package manager called yum that works from the
    command line and has become popular in the last few years.³ Fedora also comes
    with a firewall that is enabled by default.⁴ There is also a graphical configuration
    component that shows users how the rules are created in an easy-to-understand
    format.


    # References


