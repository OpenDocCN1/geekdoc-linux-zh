  md: "# OpenSCAP—Audit, Fix and Be Merry\n\n+   - OpenSCAP provides a wide array\
    \ of resources to improve security.\n\n+   - Provides resources across\n  - Tools\n\
    \  - Security Policies\n  - Standards\n\n+   - Security Compliance\n- Vulnerability\
    \ Assessment\n\n![](img/713f43d93c9396a48fab01efb4b1b069_256_0.png)\n\n![](img/713f43d93c9396a48fab01efb4b1b069_256_1.png)\n\
    \nOpenSCAP provides a wide array of resources to improve the overall security\
    \ of an organization. The focus is on improving the security defenses of an organization\
    \ and reducing the risk. The organization's motto is \"audit, fix and be merry.\"\
    \n\nOpenSCAP provides resources in several different areas. The first area is\
    \ tools. The tools help identify exposures or vulnerabilities and help an organization\
    \ in remediation of the vulnerabilities. The tools can also be used to audit and\
    \ verify the overall state of security. The second area is security policies.\
    \ Security policies provide guidance to choose the acceptable level of security\
    \ and approaches to securing an organization. Third is standards. Most other professional\
    \ fields have standards that must be met, but security is an area that has been\
    \ lacking. OpenSCAP provides standards that must be followed for certain government\
    \ organizations and provides a good reference for commercial organizations.\n\n\
    The key focus areas for OpenSCAP are security compliance and vulnerability assessment.\
    \ These areas focus on making sure that a base level of security is met and that\
    \ key vulnerabilities are identified and remediated.\n\nReferences\n\n+   1. OpenSCAP,\
    \ https://www.open-scap.org/\n\n254 2017, Secure Anchor Consulting"
  merge: -1
  pgno: 256
- img_proc: true
  md: '# OpenSCAP Tools


    +   * OpenSCAP Base: Scan command-line vulnerabilities

    * OpenSCAP Daemon: Continuously evaluate infrastructure compliance with a defined
    policy

    * SCAP Workbench: Create a custom policy and remotely scan

    * SCAPTimony: Provide central storage of SCAP results

    * OSCAP Anaconda Add-on: Verify compliance with a security profile


    ![](img/713f43d93c9396a48fab01efb4b1b069_257_0.png)


    To perform vulnerability assessment, OpenSCAP has several tools available. These
    tools can be used independently or together to provide an integrated solution.
    OpenSCAP provides tools that you can use to identify vulnerabilities, verify compliance
    with a policy, and centrally store the results.


    The tools are as follows:


    +   * OpenSCAP Base: Scan command-line vulnerabilities.

    * OpenSCAP Daemon: Continuously evaluate infrastructure compliance with a defined
    policy.

    * SCAP Workbench: Create a custom policy and remotely scan.

    * SCAPTimony: Provide central storage of SCAP results.

    * OSCAP Anaconda Add-on: Verify compliance with a security profile.'
  merge: -1
