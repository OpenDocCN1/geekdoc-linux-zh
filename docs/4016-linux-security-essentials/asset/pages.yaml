  md: '# Linux LXC/Containers


    | LXC interface for the Linux containment system

    - Allows for creation and distribution of containers

    - Middle ground between chroot and virtualized environments

    - Creates an isolated environment running on a single kernel

    - Operating system containers | Uses the following kernel features:

    - Kernel namespaces (ipc, uts, mount, pid, network, and user)

    - Apparmor and SELinux profiles

    - Seccomp policies

    - Chroots (using pivot_root)

    - Kernel capabilities

    - CGroups |


    LXC is a powerful open standard for creating containers in a Linux environment.
    It is a user interface that contains a series of application programming interfaces
    (API) that are used to make containers. LXC provides a powerful way to create
    a container that all the components needed to run an application.


    One of the nice components of LXC is that it has security to provide for isolation
    of the applications. Its several kernel features to achieve an appropriate level
    of protection.


    LXC is often viewed as a middle ground between chroot and virtualized environments.


    Chroot isolates an executable to a given directory or location. This problem becomes
    difficult with shared libraries or components. LXC allows for the application
    to run in an isolated environment, but it contains all the required components,
    so it can overcome the limitations of chroot.


    Virtualized machines allow for a completely separate operating system to run applications.
    This provides full isolation and contains all the required components. The problem
    is a guest operating system is large in size and uses a lot of resources. LXC
    allows for isolation of an operating system at the kernel level, so it can run
    on a single operating system. This allows for isolation but uses a lot fewer resources
    and is more efficient.


    # References


    +   1. LinuxContainers, https://linuxcontainers.org/

    2. What''s LXC?, https://linuxcontainers.org/lxc/introduction/

    3. LXC, https://en.wikipedia.org/wiki/LXC'
  merge: -1
