  md: '# Power of Options via top


    +   * Most commands have options

    * Options enable you to utilize the power of a command

    * Top has many great options available

    * Options enable you to perform analysis on the fly with top


    | NAME | description | NAME |

    |---|---|---|

    | top | display linux processes | top |

    | ps | report a snapshot of any user-or-id-based |

    | | traditional switches - and whitespace are options |


    > > The top command displays a view of a running system. It displays system summary
    as well, as a list of processes currently being run. It can sort, filter and display
    information for processes and users.

    > The program provides an interactive interface for managing processes and while
    for running shell commands.


    ```

    1. COMMAND LINE OPTIONS

    The command syntax for top consists of:

    top [options] [n] [user-or-id-based] [filter]

    (optionally mandatory switch "-") and whitespace are ignored

    -h [help]

    Show the library version and the usage print, then quit.

    -b [batch mode]

    Starts top in batch mode, which could be useful for sending

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_201_0.png)


    Previously, we emphasized the importance and value of built-in commands. Although
    Linux commands have value, the real power comes in using the command options that
    are built into each command.


    By running man followed by a command, you can see all the options. In Linux, enter
    the command man top to see all the powerful options available.'
  merge: -1
