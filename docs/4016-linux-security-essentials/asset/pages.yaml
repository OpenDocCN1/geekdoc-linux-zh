  md: '# Linux


    +   * Open source operating system with many variants

    * Originally developed for personal computers, but has been ported to other platforms

    * Many security tools are freely available and often only run on Linux

    * Runs the Linux kernel as the “brains” of the operating system


    ![](img/713f43d93c9396a48fab01efb4b1b069_15_0.png)


    In the early 1990s, a Finnish software engineer named Linux Torvalds started a
    new hobby: rewriting the “Minix” OS (a UNIX teaching tool) totally from scratch
    for the Intel 386 platform. What he created was one of the first UNIX-like operating
    systems to run on a personal computer. Torvalds didn’t want money for it; he was
    willing to effectively give the source code for his idea to the world to let other
    people use, improve, and pass around to others who might be able to use it. This
    set the stage for liberating in the computer world.


    The GNU Project was already up and running as a repository and distributing point
    for such ideas. It was at this time that Torvalds’ idea—called Linux—took root
    and was made available to anyone who was interested.


    One of the great symbiotic relationships of the world came together. GNU gave
    Torvalds a vehicle for broadcasting his work to the world, and Torvalds gave GNU
    something for all of its software to run on—a robust and completely open system.
    The GNU Project adopted Torvalds’ work, and it became the last missing piece required
    to make GNU completely proper and portable.


    Needless to say, the idea of Linux and the GNU Project took off. Programmers from
    around the globe notice and make contributions to the Linux kernel. Although Linux
    Torvalds originally wrote the kernel by himself, today, his code represents only
    about 2% of the kernel!¹ A lot of people have contributed!


    # References


    +   1. www.linux.org/info/linux.html

    2. www.gnu.org/gnu/whny-gnu-linux.html

    3. http://en.wikipedia.org/wiki/Linux_Torvalds'
  merge: -1
