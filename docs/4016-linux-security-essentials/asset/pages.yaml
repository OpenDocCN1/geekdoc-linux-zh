    ![](img/713f43d93c9396a48fab01efb4b1b069_189_0.png)


    SEC401 | Security Essentials Bootstrap Style


    One of the powers of Linux commands is your ability to identify and focus on the
    specific information you are looking for. With every command that we cover, we
    highly recommend that you not only run the command but also try out options to
    harness the full power of the command. Remember that if you ever get stuck, you
    can use the man or manual command to find additional details. For example, if
    you type *netstat*, you will receive details about all the available options and
    how to use them.


    The first option to use is the -a option, which shows all the network connections.
    It is important to review each one to create a baseline. In creating the baseline,
    make sure you verify all connections to make sure that active connection is not
    already happening. After the baseline is created, you can use it as an auditing
    tool to identify changes in a system.


    The second option to use is the -l option. Whereas open ports help identify and
    control channels, listening ports help identify potential exposures that someone
    could use to connect to you. adversaries will break into an internal system and
    pivot into the organization. An open port can be an avenue for an adversary to
    compromise or break into a system. You should review all listening ports and you
    should shut off any are not required.


    NOTE: The displays show only a small portion of the output. When you run the command,
    it is useful to | more when you run it so a longer output. This is one of the
    reasons why you run it so that you receive one page of output at a time.'
