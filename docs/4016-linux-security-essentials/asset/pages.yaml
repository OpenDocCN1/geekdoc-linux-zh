- img_proc: true
  md: '-v tells grep to show everything that does not match the pattern specified.


    -w tells grep to show the results of the matches of whole words only where a word
    can contain letters, numbers, and the underscore.


    -x tells grep to show only those lines that match the pattern to the whole line.


    Grep gives you some options to control the output of the information discovered
    during the grep:


    +   - -c switch tells grep to show only the number of times the pattern matched
    in its search


    +   - When you are searching through multiple files at once, the -L command prints
    out the name of the files that did not contain a pattern match to the pattern
    specified within the search. Inversely, the -l shows you the filename of all files
    that, indeed, match the pattern specified.


    +   - -m switch tells grep to print out only so many numbers of lines of output
    specified.


    +   - -o switch tells grep to print out the matched nonempty parts of matching
    lines, with each part on a separate output line.


    +   - -s switch tells grep to suppress all error messages generated during its
    search of the file or files.


    # Reference


    +   1. http://www.gnu.org/software/grep/manual/grep.html'
