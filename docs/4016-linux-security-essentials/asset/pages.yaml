  md: '# Auditd (I)


    +   auditd

    * Command execution logging

    * File access logging

    * Directory access logging

    * Network connection logging

    * Lots of documentation for rules especially with CIS (Center for Internet Security)

    * Rules controlled by audit.rules and or the use of the auditctl command

    * Has a suite of tools to review at the generated logs

    * ausearch, aureport, and autatace


    The Audit subsystem is an access monitoring and accounting solution for Linux
    that is developed and maintained by Red Hat. In addition, it was designed to integrate
    tightly with the kernel and monitor for interesting system calls. In addition,
    it is used as the logger for SELinux. Audit operates at the kernel level, which
    gives you a hook into any system operation that you want to monitor. You have
    the option to write a log any time a particular system call happens. You can monitor
    access to any file, all network traffic, simply everything. Audit is incredibly
    detailed, and the level of filtering is granular. Audit itself is a logging system,
    and as a result does not use syslog. Therefore you will have to manage all the
    audit logging using the audit suite of tools. Any kind of remote collection, organization,
    or archiving may not work with these files. Auditd has solutions for remote logging,
    although they are not as simple to manage and parse as syslog.


    The audit rule set can be simple or complex, but the reality is that for most
    everyone''s, the rule set can be quite simple, needing only a couple of commands.
    The trouble is in knowing which files would be interesting to monitor and if you
    are like most people who do not have the skills of an OS-level programmer, this
    would be daunting to figure out. Luckily, you can find ample documentation on
    the web about rule set and what is most interesting to monitor. One reputable
    source is the Center for Internet Security (CIS), which has a list of interesting
    system calls for Linux systems within a built audit rules file for use by the
    public.


    The suite of tools that will be of interest in managing audit logs includes ausearch,
    which gives you extremely granular searching ability through very detailed log
    events. Audit enables you to trace the trace of a binary and have it bound to
    an ausearch you can run to help in identifying the system calls that binary makes.
    To make ausearch even easier for human eyes to digest, you can run the aureport
    command as a standalone command, or you can pipe the audit results into it.


    +   Reference

    1. http://security.blogoverflow.com/2013/01/a-brief-introduction-to-auditd/


    © 2017, Secure Anchor Consulting 171'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Auditd (2)


    auditd rules

    file example


    ![](img/713f43d93c9396a48fab01efb4b1b069_174_0.png)


    ```

    # This file contains the auditctl rules that are loaded

    # whenever the audit daemon is started via the initscripts.

    # The rules are simply the parameters that would be passed

    # to auditctl.

    # First rule - delete

    -D

    # Increase the buffers to survive stress events.

    # Make this bigger for busy systems

    -b 1024

    -a always,exit -S adjtimex -S settimeday -S stime -k time-change

    -a always,exit -S clock_settime -k time-change

    -a always,exit -S sethostname -S setdomainname -k system-locale

    -w /etc/group -p p wa -k identity

    -w /etc/passwd p wa -k identity

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_174_1.png)


    Auditd has a file called audit.rules which contains a rules like the example.
    The rule file exists to give permanence to audit rules across reboots. You can
    generally find the file at /etc/audit/rules/audit.rules


    Notice that on each line free are the commands you would use when running auditd
    with the auditctl command. This rule file will generate a log message every time
    any of the following system calls exit: adjtimex, settimeday, stime, ... It will
    also create a log message when the group or passwd file is written. Any entry
    or text following a hash sign (f) is ignored.


    +   - auditd-L: Lists all currently running audit rules.

    - auditd-S: Shows the current status of the auditd daemon.

    - auditd-B: Sets the maximum number of outstanding audit buffers. If all buffers
    are full, the kernel will suffer the failure for aging.

    - auditd-F: Sets the flag as 0, 1, or 2. This option allows you to determine how
    you want the kernel to handle critical errors. If set to 0, audit messages will
    not be logged will be silently discarded. If set to 1, messages will trigger a
    kernel panic.

    - auditd-R: Enables you to read audit rules from the specified file. This capability
    is useful when you are testing some rules and want to use the old rules from audit.rules.

    - auditd-A: Is used in conjunction with -S for system call auditing. The options
    for -a are action and filter, which are set to use when an event is logged. Action
    can be either always or never. Filter which rule-matching is applied to the event.
    The rule-matching filter can be one of the following: task, exit, or exclude.
    Action, will be audited in most cases, which will tell auditd that you want to
    audit this system when it occurs.

    - auditd-D: Deletes all the rules in the auditd daemon.


    When 0 is passed to the audit -e command, it will temporarily disable auditd.
    When 1 is passed as an argument, it enables auditing. To lock the audit configuration
    pass 2 as the argument. This makes the current set of audit rules unchangeable.
    Rules can no longer be added, removed, or deleted and the audit daemon can no
    longer be stopped. Locking the configuration is intended to be the last command
    in the audit.rules config file for anyone wishing this feature to be active. Any
    attempt to change the configuration in this mode will be audited and denied. The
    configuration can only be changed by rebooting the server.'
  merge: -1
  pgno: 174
- img_proc: true
  md: "# Auditd (3)\n\n+   - ausearch\n  - ausearch -k\n  - ausearch -m LOGIN --start\
    \ today -i\n  - ausearch -a 7618\n  - ausearch -f /etc/ssh/sshd_config\n- autrace\n\
    \  - autrace /usr/bin/find\n- auditport\n  - auditport -x -summary\n  - auditport\
    \ -failed\n  - auditport -f\n\n![](img/713f43d93c9396a48fab01efb4b1b069_175_0.png)\n\
    \nAt this point, you have audit rules in place logging events on the system for\
    \ access to files and system calls that are made by processes on the systems.\
    \ If you want to look through these logs, you need two main tools: ausearch and\
    \ auditport. Ausearch enables you to look through the logs based on the following:\n\
    \n+   - Message type, -m,\n- When the logs occurred, -start\n- Key phrases that\
    \ mark logs by the rule, -k\n- The audit event Id, -a\n- The filename, -f\n\n\
    The -i switch allows ausearch to interpret numeric entities as text because field\
    \ will only be numeric and not at all.\n\nThe logs that audit outputs are very\
    \ verbose and there are a lot of them. If you pipe the audit output into the audit\
    \ command, you can get summaries of the logs, or you can have the logs formatted\
    \ in a much more readable fashion so that you can zero in on what you are looking\
    \ for.\n\nAutrace enables you to trace an executable on execution so that you\
    \ can learn what system calls it makes. Consequently, you can build audit rules\
    \ for interesting system calls you feel you should audit and track."
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Auditd (4)


    Auditd examples


    +   - auditctl -w /etc/sysconfig/ -p rwa -k sysaccess

    - auditctl -w /sbin/modprobe -p x -k kernel_modules

    - auditctl -w /sbin/modprobe -p x -k kernel_modules\ (Wait, checking text: auditctl
    -W /sbin/modprobe -p x -k kernel_modules)

    - auditctl -a always,exit -F arch=b64 -F "aid>=1000" -S rename -S renameat -k
    rename


    ![](img/713f43d93c9396a48fab01efb4b1b069_176_0.png)


    The first example above adds a rule to watch the /etc/sysconfig only and all files
    and directories beneath it for any read, write, or attribute change access. It
    also logs messages with the custom key sysaccess.


    The second example adds a rule for execution of the /sbin/modprobe command. As
    discussed earlier in the course, this command inject kernel modules into the kernel
    dynamically and can be a very dangerous action and therefore should be watched
    closely.


    The third example removes the modprobe rule added in example 2. To remove a file
    or system call rule, you simply use a capital letter—in this case, a capital W—to
    indicate you want the matching rule removed. With system call rules, you use a
    capital A.


    The last example is a rule that monitors for system calls always, and when they
    exit, it at 64-bit processes only. It looks for any process that was running with
    a UID of 1000 or less and the system call being monitored is the rename system
    call. If the system call is logged, this rule will put the key phrase rename in
    the log to make it easier to search for in the logs with ausearch.'
  merge: -1
