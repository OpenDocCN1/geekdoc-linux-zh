  md: "# Sysctl Hardening\n\n+   * Sysctl is used to modify kernel settings at runtime\n\
    * Running sysctl —shows you all the variables for the system\n* Sysctl configures\
    \ network and system settings\n  * IPv4 and IPv6 settings\n  * Execshield\n  *\
    \ Network attack preventions\n  * Logging attacks\n  * Address Space Layout Randomization\n\
    * Recommended way to edit the variables is to edit the /etc/sysctl.conf file\n\
    \nThe sysctl utility and can dynamically change settings within a Linux system\
    \ while the system is running. Alternatively, it can have the change commit to\
    \ persist across reboots. When working with sysctl, you can read and write variables\
    \ to the processes within a Linux system in a couple of ways. Generally, sysctl\
    \ is exported as part of the prefs within /proc/sys directory; consequently, some\
    \ variables can be read only by accessing the files themselves within /proc/sys\
    \ directory. Otherwise, you can read the variable switch /etc/sysctl.conf or run\
    \ the sysctl command with the -a to show the variables.\n\nTo change a variable\
    \ on the Linux system, run the sysctl command with the -w switch with a variable\
    \ and corresponding value. This approach is useful if you want to make changes\
    \ to see how the system behaves without permanently changing the settings. To\
    \ commit the change, change the settings within sysctl; this approach is best\
    \ because the changes persist across reboots.\n\nTo see all variables for the\
    \ system, run sysctl —a. To write a variable using the sysctl command, enter sysctl\
    \ —w variable=value. The -w option tells sysctl to write the value to the variable.\n\
    \nThe recommended way to edit variables is edit the /etc/sysctl.conf file. This\
    \ approach will permanently commit the change of the variables so that they will\
    \ load at boot time, changing them while the system is running with the sysctl\
    \ command affects only settings in memory and will be lost after a reboot.\n\n\
    Reference\n1. \"Sysctl\", http://wiki.christophchamp.com/index.php?title=Sysctl"
  merge: -1
