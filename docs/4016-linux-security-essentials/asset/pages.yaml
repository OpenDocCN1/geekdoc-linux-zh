  md: '# Apple iOS Security


    +   - Designed with security at its core

    - Closed model unless someone jail breaks the phone

    - Security is integrated into the entire architecture

    - Most security is transparent to the user

    - Key security (that is, encryption) cannot be disabled or turned off


    ![](img/713f43d93c9396a48fab01efb4b1b069_31_0.png)


    When we think about iOS, most of us think of the iPhone and the amazing advancement
    in technology. The iPhone revolutionized the mobile phone market with amazing
    features. Most people do not think about security; however, security was a key
    component of the design and implementation of the iOS.


    As you can see from the diagram (which is taken from Apple documentation), security
    is integrated into both the hardware and the software. The second you turn on
    the iPhone and it starts up, security controls are in place to verify that the
    iOS has not been altered or modified.


    The two key implementation details that are critical to effective security are
    transparent and automatic. Many of the security features of iOS are transparent,
    and the user is not aware that it is happening. Most users have no idea what a
    kernel is, let alone what a secure enclave is. There is a key to be learned here
    that the more transparent security is, the more effective it is. The second key
    aspect is security is automatic and not optional. Many of the core security features
    are always running and cannot be turned off.


    Reference

    1. iOS Security Guide, https://www.apple.com/business/docs/iOS_Security_Guide.pdf'
