  md: '# Permissions: chown and chgrp


    +   - Chown changes file ownership

    - Chgrp changes group ownership

    - Both user and group ownership can be changed at the same time with chown

    - Chown will use both user and group IDs or their names


    ```

    chown user1 /home/user1

    chgrp support /home/user1

    ```


    Simply changing the file permissions for a file or directory is not enough to
    restrict access; the ownership rights must also be changed to create an effective
    access control to files and directories. You use the chown command to change the
    ownership of a file and the chgrp command to change the group ownership of a file
    or directory. Examples are as follows:


    chown user1 /home/user1

    chgrp support /home/user1


    In most cases on UNIX systems, the chown command can change the group and user
    ownership at the same time. The format for changing the user and group ownership
    with chown is chown:group filename. Generally, the superuser is the only user
    allowed to chown files and directories, allowing normal users to chown files.
    A normal user with owner privileges could change executable permissions to the
    set-UID and have the owner root; in that case, the user can enable or her privileges
    to root. Because this is a significant configuration vulnerability, UNIX systems
    that allow normal users to chown files will remove the set-UID and set-GID bits
    after the chown is run against a file to prevent that scenario.


    We also mention that if normal users are allowed to chown files and use disk usage
    quotas are set, normal users will be able to set the file ownership to other users.
    In this way, files created could be chowned to use the quota of another user.


    There is a corresponding number for each user and group on a UNIX system; they
    are the user and group IDs. The chown command can accept both the user and group
    IDs of the user and group names.'
