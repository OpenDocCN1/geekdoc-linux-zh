  md: '# File System Security Goals


    +   - Protect OS binaries in /usr

    - Prevent introduction of SUID programs and unauthorized devices

    - Allow other software to be installed

    - Discourage DoS attacks


    SEC401 | Security Essentials Bootcamp Style 43


    When you''re thinking about file system security, it is useful to keep a few important
    goals in mind.


    An attacker who compromises a system likely wants to install a rootkit, a set
    of binaries that gives the attacker a back door into the system and helps him
    or her escape detection by the system administrator. Typically, the binaries that
    the attacker replaces are OS programs in /usr/bin and /usr/sbin directories, protecting
    the /usr file system is important.


    The administrator also should attempt to stop people from creating or bringing
    unauthorized set-UID and GID programs on the machine. Unauthorized device files
    can be equally dangerous because they may allow normal users to get what is normally
    privileged access to disk drives, the system memory, and so on, bypassing normal
    system access controls.


    Conversely, system administrators need to be able to apply patches to the operating
    system and update software that has been installed on the machine. If they are
    unable to do this, the system becomes less secure as new exploits that cannot
    be patched are discovered.


    Also, to avoid denial of service (DoS) attacks, administrators should partition
    the system carefully. For one, this means splitting the file system appropriately;
    take the earlier example of making /var a separate partition so that overwhelming
    the system does not take over the entire machine. However, the administrator also
    should take care to provide sufficient free space in heavily used partitions to
    accommodate unexpected growth.


    © 2017, Secure Anchor Consulting 43'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# File System Security Options


    **ro:** File system is mounted read-only (files and directories cannot be modified)


    **nousuid:** SUID/SGID bits are ignored on all programs in the file system


    **nodev:** UNIX device files don''t work


    ![](img/713f43d93c9396a48fab01efb4b1b069_46_0.png)


    ![](img/713f43d93c9396a48fab01efb4b1b069_46_1.png)


    SEC401 | Security Essentials Bootcamp Style


    A combination of sensible partitioning and appropriate use of file system mount
    options in the /etc/fstab file can help achieve a secure installation. Although
    administrators can set a lot of different mount options on a given file system,
    just a few specific options are required to protect the security of file systems
    on the machine.


    The ro (read-only) option causes the UNIX operating system kernel to prevent writes
    or updates to the given file system. When a file system is in read-only mode,
    nobody can update files or directories in that partition, add new files, or delete
    files.


    The nousuid option means that the file system simply ignores the set-UID and set-GID
    bits on executables in the file system. So, if a user attempts to execute a set-UID
    program out of a nosuid file system, the the program runs as the user and not
    as the owner of the program.


    Similarly, nodev means that special "device files" are ignored in the file system.
    These are the kinds of files usually found in /dev and /devices are used to communicate
    with the system-hardware devices. Device files appearing in other directories
    usually are a problem, the only exception being special file systems used by anonymous
    FTP servers and the like.


    44 © 2017, Secure Anchor Consulting'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Goal of Security


    All file systems should either be mounted read-only or nosuid


    /usr and /usr/local contain SUID/SGID programs but can be read-only


    Most other file systems must be writable but have no SUID/SGID programs


    / file system contains /dev, but all other file systems can be mounted nodev


    The basic rule to follow when applying file system options is simple: file systems
    should either be mounted nosuid or read-only. Additionally, the nodev option should
    be used wherever possible. Set-UID/setGID executables and system device files
    should really be restricted to operating system directories that are tightly controlled
    by the system administrator.


    On most UNIX systems, the critical set-UID and set-GID programs are all located
    in directories under the /usr, with /usr/bin and /usr/sbin being the most common
    locations. Some third-party set-UID and set-GID programs also may show up in /usr/local
    or /opt. However, all these directories usually can be mounted in read-only mode
    because data is not written into these directories; UNIX programs tend to write
    read-only under /var or in scratch directories like /tmp. Mounting these file
    systems read-only helps attackers from rooting into the file system and stops
    the introduction of rogue set-UID or set-GID files and system devices.


    Other file systems typically need to allow write access but should have any set-UID
    and set-GID programs showing up in them. Thus, these file systems can be mounted
    nodev to prevent the introduction of rogue set-UID and set-GID executables.


    As for system devices: the system devices live in /dev and /devices, which are
    always parts of the root file system. It turns out that if the primary system
    devices are not found in the root file system, the machine cannot boot. It is
    unusual to have device files elsewhere in the file system, so pretty much every
    partition except the root file system can be mounted nodev. This means that if
    attackers could create device files in these file systems, they would not be able
    to use them. Of, an attacker could create a malicious device file in the root
    file system or change the permissions on a device file already in /dev or /devices,
    so this is not a perfect solution. However, it is a huge improvement over the
    default situation, which is no security options being set at all.'
  merge: -1
