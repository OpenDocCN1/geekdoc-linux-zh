    Dmesg is the special log file and the command to read the log file itself. As
    mentioned in the messages log file, dmesg contains strictly the information about
    the boot process of the system from the point of initial startup all the way through
    the loading of the entire OS and kernel. If you experienced unusual activity during
    the boot process of your Linux system, reviewing the dmesg logs would be your
    best bet in finding the cause for the unusual boot of your system.


    Dmesg prints the message buffer of the kernel. The output of this command typically
    contains the messages produced by the device drivers. Bootstrap of system drivers,
    in addition to other elements within the kernel, may produce output messages reporting
    the presence of modules and the values of any parameters added. After the system
    has fully booted, the kernel may occasionally produce diagnostic messages. A common
    example of this happening when USB devices are plugged in.'
