  md: '# Permissions: Umask and Chmod


    +   * Umask sets default newly created file permissions

    * Umask reads existing umask setting

    * Chmod changes existing file permissions


    ```

    umask u-x,g=r,o-w


    chmod u=rwx,g=rx,o=r filename


    chmod 754 filename

    ```


    We have been talking about how to read file permissions and find files with certain
    permissions. The place to set file permissions is in chmod and umask. In UNIX
    systems, new files are created with default permissions, which may be restricted
    in a specific way. This restriction is achieved by applying a mask called umask
    to the system. The umask command enables you to set the mask of the system so
    that all files created by a user will have specific permissions by default. Setting
    the mask is important because it ensures that when a user creates a file, for
    instance, only read and execute permissions for owner and group, no permissions
    for everyone, and write permissions only for the owner of the file. This reduces
    accidental exposure of files.


    With umask, you specify whether you use symbolic or absolute mode, and then you
    read the umask or set it with permissions. A few examples are listed, one in symbolic
    mode and the other in the absolute mode. Multiple changes can be made at the same
    time but must be separated by commas. Umask uses (u) for the owner, (g) for the
    group, and (o) for everyone else. Umask also uses (+), which allows the specified
    file permissions to be enabled for the specified user classes, and the permissions
    that are not specified in the mask. The (-) prohibits the specified file permissions
    from being enabled for the specified user classes, and again, the permissions
    not specified are not changed. The (=) allows only the file permissions to be
    enabled, and all others are disabled at creation.


    ```

    umask u-x,g=r,o-w

    ```


    ```

    umask 132

    ```


    The preceding commands prohibit the execute permission from being set for the
    file''s owner, while leaving the rest of the owner permissions unchanged. They
    enable read permission for the group, prohibiting write and execute permission
    for the group and prohibit write permission for others, while leaving the rest
    of the other permissions unchanged.


    In UNIX, the default permissions value is 666 for a regular file and 777 for a
    directory. When you are creating a new file or directory, the kernel takes this
    value—“subtracts” the umask value, and gives the new files the resulting permissions.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'In absolute mode, if the umask value is 022, any new files will, by default,
    have the permissions 644 (666 – 022). Likewise, any new directories will, by default,
    be created with the permissions 755 (777 – 022).


    The chmod command, which stands for "change mode," is used to define the way a
    file can be accessed by modifying the permissions of files. The chmod command
    has options permissions and then the filename of the file to change the permissions.
    Chmod can also be written in symbolic and absolute mode. Two examples


    ```

    chmod u=rwx,g=rx,o=r filename

    ```


    ```

    chmod 754 filename

    ```


    Chmod has an option for recursion, -R, which is useful to change the permissions
    of many files in a directory tree with one command.'
  merge: -1
  pgno: 60
