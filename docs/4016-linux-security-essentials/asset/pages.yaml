  md: '# Types of UNIX Operating Systems


    +   * Main Linux Distributions

    * Ubuntu (Debian)

    * Fedora (Red Hat)

    * Cygwin for Windows

    * Mac OS (BSD)


    ![](img/713f43d93c9396a48fab01efb4b1b069_14_0.png)


    # NOTE: Kali is based on Debian Linux


    Windows is not the only operating system that has both a desktop OS and a server
    OS, Most of the UNIX variants also have corresponding desktop OS versions. The
    difference between the desktop and server OS is that the server OS is designed
    for efficient multitasking and multiprocessing and generally does not have any
    client-based application features, such as word processing and an email client
    application.


    There are many different distributions of UNIX. These distributions are a collection
    of software solutions and tools written for UNIX. Many of these software solutions
    and tools also have variants of their own. The different distributions are derived
    and maintained by groups of people who package together software to complete a
    specific goal.


    In distributions of UNIX such as Cygwin, a suite of the software and tools written
    for UNIX was ported over to Windows. Mac OS for Apple computers is a UNIX/BSD
    variant that is popular but proprietary. Finally, some Linux packages are created
    for many purposes, some of which do not require installation and can run from
    discs.


    +   1. http://www.tldp.org/LDP/lame/LAME/linux-admin-made-easy/linux-overview.html'
