  md: '# Vulnerability Assessment


    +   * Security is all about mitigating and controlling risk

    * Utilize threats to calculate the risk

    * Utilize vulnerabilities to reduce the risk

    * Proactive identification of vulnerabilities is key to effective Linux security


    # RISK = THREATS x VULNERABILITIES


    SEC401 | Security Essentials Bootcamp Style 213


    Security is all about understanding, mitigating, and controlling the risk to critical
    data. Therefore, one of the first steps is to understand what the critical data
    for your organization is and determine what systems they reside on. After identifying
    the systems, determine the threats that would have the highest likelihood of occurring
    and map them to vulnerabilities that would allow the biggest impact.


    Therefore, identifying vulnerabilities and proactively fixing them is a key part
    of reducing risk, and vulnerability scanners are a key part of security.'
  merge: -1
