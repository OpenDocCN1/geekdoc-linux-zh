- img_proc: true
  md: '# "System" Accounts


    +   - UNIX operating systems tend to come with many service accounts for various
    apps

    - Typically, these accounts have low UIDs numbers (UID < 100?, 500?, 1000?)

    - Attackers sometimes activate these accounts as "back doors" into the system

    - If you''re not using a particular service or app, remove (or block) the account


    UNIX systems typically ship with a number of accounts that are associated with
    a particular application on the system rather than an individual user. For example,
    NFS uses the special "nobody" user. Oracle requires an "oracle" database administrator
    account, and the system might have an "apache" or "www" user set up for running
    the web server. These accounts are typically given low UIDs to distinguish them
    from other accounts in the password file. Red Hat requires to reserve all UIDs
    less than 500 for "system"type accounts, whereas Debian Linux systems use UIDs
    less than 100. Other UNIX systems, such as Solaris, reserve UIDs of 0-99.


    Usually, the default /etc/shadow file from the vendor ships with these accounts
    disabled and with an invalid password entry, attackers commonly try to insert
    valid password strings as a back door in these system account entries. Setting
    invalid shells on these accounts in /etc/passwd where possible is a good idea,
    is regularly auditing the system and shadow files for changes to these accounts.


    Disabling the account is preferable to deleting the account. In most cases, each
    of these system accounts "owns" one or more files and directories on the system.
    If the account was completely deleted from the password and shadow files, the
    original UID for that account might end up assigned to a different user. By reassigning
    the UID to a new user on the system, the administrators have created a situation
    in which the new user "owns" the operating system files that were created for
    the system. If these are critical configuration files, directories, or system
    devices, the user might be able to get increased privileges on the system.


    A similar argument can be for blocking rather than deleting accounts when a user
    leaves the organization or no longer requires access to the system. Typically,
    that users leave behind some number of files and directories he or she owns. Administrators
    manage to avoid UID overlaps, but it can be useful to know who originally created
    a file long after that individual has left.


    Of course, having large numbers of blocked accounts in the passwd and shadow files
    makes it more difficult to audit these files for malicious changes, so some sites
    opt for a strict policy of purging old user accounts and data from their systems
    after a user leaves. Similarly, if the system administrator is certain that a
    non-user account no longer owns any files on the system, that may be deleted from
    the passwd and shadow files.'
  merge: -1
  pgno: 66
