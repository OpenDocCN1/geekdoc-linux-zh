  md: "# Cygwin\n\n+   - Cygwin is not Linux\n  - Many Linux commands and utilities\n\
    \  - Is not a Linux emulator\n\n+   - You can compile server software for Windows\n\
    - Not a replacement for running Linux on a physical hardware or a virtual machine\n\
    - Powerful scripting within Windows\n- Windows can easily interact with Linux\
    \ Services\n\n![](img/713f43d93c9396a48fab01efb4b1b069_18_0.png)\n\nThe Cygwin\
    \ project is a fantastic solution for aiding the transition to Microsoft Windows\
    \ for those who grew up in the Linux world. Cygwin adds much of the functionality\
    \ that Linux offers to Windows systems. Many Linux libraries have been ported\
    \ to Cygwin, but the Cygwin project has made it clear that you cannot do everything\
    \ Linux has to offer with.\n\nCygwin installs and is supported on all versions\
    \ of Windows CE. The Cygwin interface enables you to access all the ported libraries\
    \ and programs from Linux that you configure Cygwin to install at setup time.\
    \ It can be installed to install a small group of commands for a basic Linux command-line\
    \ interface, or Cygwin Setup can be installed to install the entire development\
    \ suite, giving you all the power of Linux development. Many of these developed\
    \ tools are used for GNU projects. Specifically if you are not a programmer, that\
    \ is okay the Linux utilities that you install are very useful for use on a Windows\
    \ system, which has no equal for many of the utilities.\n\nCygwin is a small application\
    \ that initiates at install. It greets you with a menu that enables you to choose\
    \ which utilities, development and other Linux binaries to install. Because of\
    \ the huge number of binaries, you can easily fill your hard drive. It is recommended\
    \ that you not install everything because it would take quite a time to install\
    \ and likely fill your hard drive. Most people do not need a lot of the packages,\
    \ as debuginfo and source code libraries suffice.\n\nA base is installed for those\
    \ who just need the basic Linux utilities; it gives you a nice, small group of\
    \ packages, and you can always add new utilities and packages by running the Setup.exe\
    \ again. Within Linux itself, you can find thousands of binaries and utilities\
    \ to use with Cygwin. Though there many ported binaries, if the utilities you\
    \ need are not ported, you will need to locate the source code and compile into\
    \ a Cygwin binary format.\n\nNot all source code that you want to compile into\
    \ Cygwin-based binaries will work in Cygwin. Many variables in play are beyond\
    \ your control on whether the utility you want to compile for Cygwin will work.\
    \ If you have to find the source code for the application you want to run in Cygwin,\
    \ you will have to know how to compile applications, and in Linux, this can be\
    \ a challenge when dealing with dependencies and libraries."
