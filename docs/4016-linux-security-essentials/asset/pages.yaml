  md: '# Linux and Windows: Desktops and Servers


    +   Over 80% of all computers run Windows

    * Most people have used Windows, many exclusively

    * Windows started as a desktop OS, but is now a respected server platform

    * Old: Single-user platform

    * New: Multiple processes for multiple users at the same time

    * UNIX took the opposite route

    * Old: Installed on servers with many simultaneous users

    * New: Used as a desktop OS


    ![](img/713f43d93c9396a48fab01efb4b1b069_13_0.png)


    ![](img/713f43d93c9396a48fab01efb4b1b069_13_1.png)


    ![](img/713f43d93c9396a48fab01efb4b1b069_13_2.png)


    SEC401 | Security Essentials Bootcamp Style


    It''s vital to be comfortable with the most common operating system (OS) in use
    today, there are substantial (and some vital) reasons to know about the others.
    There''s always room for people to argue over which OS is better than another,
    but the bottom line is that they all have advantages, limitations, and liabilities.
    Because they all get together on big, fast networks, they threaten each other
    that security-minded people need to know about and protect against.


    Which OS you choose to depends on what you want to do with a computer, and that''s
    another reason to be familiar with everything that is available. Windows has morphed
    into an OS that you might just as like a server on a person''s desktop computer,
    it wasn''t always that.


    Windows started its commercial life as a desktop OS, something used by one person
    to do (basically) one thing at a time until the job was done. Done of a person
    in an office writing a report or a letter for a project.


    As things progressed, several people needed to run on a project today, and that
    required them to all work (or at least remotely) running the same OS. Including
    the need for people to collaborate and keep all their files together, Microsoft
    was prompted to develop a server version of Windows that would perform multiple
    tasks for multiple users simultaneously. So, all of a sudden, you could run a
    desktop version of Windows on your desktop computer and a server version of Windows
    on a server, that juggled and synchronized everyone''s requests.


    Interestingly, UNIX developed the same lines running in the opposite direction.
    UNIX was conceived in 1969 as an OS that was going to run on a server with many
    users doing all different things at the same time. The OS needed to manage not
    only these users and their processes, but also all the background programs that
    made these processes available to the users in the first place. It became stable
    and dependable, and people started businesses that did nothing but write and maintain
    a version of UNIX as their main source of income. One even thought of writing
    his own version and shared it with the rest of the world expecting no money in.


    # References


    +   1. http://en.wikipedia.org/wiki/Unix

    2. http://www.faqs.org/docs/artu/ch02s01.html


    © 2017, Secure Anchor Consulting


    11'
