  md: "# Passwd File\n\nIn early UNIX, the encrypted password was stored in the /etc/passwd\
    \ along with user information. Everyone could read the encrypted passwords, but\
    \ the hardware was too slow to crack a well-chosen password.\n\n| Login ID | GID\
    \ | Home Directory |\n\njsmith:x:144:12:Smith John:/home/staff/jsmith:/bin/csh\n\
    \n| Encrypted Password or Shadow Indict | UID | Login Shell |\n\nGECOS Info\n\n\
    SEC401 | Security Essentials Bootcamp Style 45\n\nOriginally, UNIX systems kept\
    \ a user's one-way encrypted password along with user account information in the\
    \ /etc/passwd file. This file is used by many tools (such as ls) to display file\
    \ ownership and so on. The file needs to be world-readable because processes must\
    \ match IDs with the users' names. This lends itself to potential security risks,\
    \ and, therefore, UNIX incorporated what is now called the shadow file to hold\
    \ encrypted passwords.\n\nEach field in the password file is separated by a colon\
    \ (:), as follows:\n\n+   * 1st: User ID\n 2nd: Location for the encrypted password\
    \ (normally an x to indicate the system is shadowed)\n 3rd: User identification\
    \ number\n 4th: User's primary group\n 5th: GECOS field (remarks)\n 6th: User's\
    \ home directory\n 7th: What happens upon login (normally this will be a process)"
  merge: -1
