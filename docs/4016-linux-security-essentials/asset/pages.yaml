  md: '# Useful Built-in Commands (netstat, ps, top, tail)


    Four powerful built-in commands


    | netstat | top |

    | --- | --- |

    | Shows network connections on a system | Provides a dynamic, real-time view of
    a running Linux system |

    | ps | tail |

    | Shows active processes that are running on the system | Displays the last few
    lines of a file and is useful for log files |


    Using is a good basic starting point, but many other valuable tools are built
    into Linux. Although there is a large number of commands, let''s look at four
    powerful built-in tools:


    +   - **netstat**: Damage is caused when malicious content comes into a system
    or critical data leaves a system Netstat provides visibility into network activity
    and connections.

    - **ps**: Processes typically run all the time and can be used for malicious purposes.
    By using ps, you can get visibility into services running on a system and identify
    rogue processes.

    - **top**: One of the key themes of this course is visibility. The more you understand
    the state of a system, the better chance you have of identifying rogue activity.
    Top is a great tool for providing a dynamic, real-time view of what is running
    on a system.

    - **tail**: Viewing real-time information can be difficult, especially with large
    files. The tail command displays the last few lines of a file. Tail is especially
    useful in viewing and analyzing log files.'
  merge: -1
