  md: '# Log Aggregation and SIEM


    # Aggregating and correlating logs


    +   - Centralize your logs

    - Normalize logs

    - Correlate logs based on time

    - Ensure there is a centrally used time server

    - Using UTC is best if spanning multiple time zones


    ![](img/713f43d93c9396a48fab01efb4b1b069_123_0.png)


    One of the best ways to begin creating a baseline on your network and systems
    is to aggregate all the logs on your network and correlate them for analysis of
    the behaviors on the network. Centralizing your logs in your network is a first
    step to begin aggregation for correlation and analysis.


    After centralizing the logs, you should copy them so that the copies of the original
    logs are normalized and correlated. You should do this because when you are collecting
    logs not only for threat detection but also to meet some regulatory enforcement
    or compliance. Those regulations require you to be able to look back at the original
    logs in the event of a compromise. If you are correlating, that means the logs
    have been normalized, in other words, those logs have been changed and potentially
    may not be admissible in court in the event prosecution is necessary. The moral
    of the story is to have a separate log aggregator and correlation server.


    When logs are normalized, you can then begin to correlate across multiple systems
    and platforms to gain an understanding of what is happening the environment throughout
    the day. This helps you quickly discern whether there are anomalies. The solutions
    used to this aggregation and correlation are called SIEMs, which stand for Security
    Incident and Event Monitoring.


    The correlation of logs is possible not only by normalizing the logs but also
    because the systems in your environment should be using the same time sources
    to keep them operating with the exact same time. To reduce confusion, ensure all
    your systems are configured to use the same time zone. If your systems span multiple
    time zones physically, it is recommended you use UTC; otherwise, your logs gets
    more difficult because now you have to adjust for time zone differences when comparing
    logs.'
  merge: -1
  pgno: 123
- img_proc: true
  md: "# SIEMs – Overview\n\n+   * Splunk\n* Alien Vault\n* LogRhythm\n* QRadar\n\
    * Logstash\n* Graylog2\n* LOGGalyze\n\n![](img/713f43d93c9396a48fab01efb4b1b069_124_0.png)\n\
    \n![](img/713f43d93c9396a48fab01efb4b1b069_124_1.png)\n\nThe best way today to\
    \ manage the correlation of logs centrally is through the use of a SIEM. These\
    \ technologies can aggregate all the logs in your environment if you want them\
    \ to be managed on a central log server. Then they will parse, normalize, and\
    \ correlate them for you or enable you to correlate the logs. The purpose is to\
    \ assist you in finding current or emerging threats in the monitored environment,\
    \ whether security related or resource related, such as disks filling up.\n\n\
    The Security Incident Event Monitoring market is becoming quite a competitive\
    \ market because numerous players are offering a wide set of features and advantages\
    \ over each other. Some, such as Splunk, offer a free solution that is limited\
    \ to the number of logs it can parse daily under the free license. Others, such\
    \ as LogRhythm and QRadar, are full commercial license with no free option, and\
    \ are available only if you are interested in purchasing the solution. There are\
    \ also open source solutions, such as Logstash and Graylog2, which are powerful\
    \ but require a lot of technical skill to configure and maintain to gain value\
    \ from them.\n\nReferences\n\n+   1. Security information and event management,\n\
    \   https://en.wikipedia.org/wiki/Security_information_and_event_management\n\
    2. Security information and event management (SIEM),\n   http://searchsecurity.tearget.com/definition/security-information-and-event-management-SIEM"
  merge: -1
  pgno: 124
- img_proc: true
  md: '# SIEMs – Splunk


    # Splunk


    +   * Popular and has a lot of third-party plugin support

    * Cost-effective as long as there are not a lot of logs

    * Cost is based on daily log volume in GBs

    * Very scalable

    * Supports Windows and Linux agents

    * Index any source

    * Ad hoc searches

    * Built from an open source platform


    ![](img/713f43d93c9396a48fab01efb4b1b069_125_0.png)


    ![](img/713f43d93c9396a48fab01efb4b1b069_125_1.png)


    SEC401 | Security Essentials Bootstrap Sryle 123


    Splunk started as an open source solution; it still has a free solution offering
    in which you have a limited daily

    volume but cannot create alerts or generate reports. As a commercial solution,
    it has integration with many

    platforms. Splunk is a log correlator, but you can look at the logs of individual
    technologies to analyze the

    health of those technologies on their own, such as IIS web server log analyzer
    or Juniper Log parser. The

    caveat is that these third-party plugins are just that, and it is not unusual
    that they were created by an

    individual, not a company.


    Splunk is very scalable and offers a distributed log collection capability and
    distributed log searching

    capability. It is a bit difficult to deploy if you deviate from anything other
    than typical log aggregation.


    The other caveat for Splunk is its pricing model, which can get quite expensive
    because it is based on log

    volume per day. If you are under regulation to keep security logs, for instance,
    and your databases are really

    noisy, you will exceed your daily log volume with just database access logs in
    matter of hours.


    Reference


    +   1. Splunk, https://www.splunk.com/'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# SIEMs – Alien Vault


    +   Alien Vault

    * Cost-effective no matter how many logs

    * Offers

    * SIEM

    * File Integrity Monitoring

    * Host Intrusion Detection System

    * Network Intrusion Detection

    * Vulnerability Scanning

    * Built on open source platforms

    * Prebuilt alarms

    * Access to Open Threat Exchange feed


    ![](img/713f43d93c9396a48fab01efb4b1b069_126_0.png)


    Alien Vault is an attractive player in the market, especially for organizations
    that are midsize. It offers a cost-effective solution with lots of prebuilt automation,
    you don''t need a talented security analyst on staff to monitor Alien Vault to
    discover threats. Alien Vault delivers this capability through its Open Threat
    Exchange, which is a threat feed of threats it has identified and created signatures
    for, but also multiple other feeds bundled in.


    Alien Vault is not just a SIEM but has File Integrity Monitoring, Host Intrusion
    Detection System, Network Intrusion Detection System, and Vulnerability Scanning.
    Alien Vault then correlates the information from all these event sources to determine
    issues in the environment.


    The caveat to Alien Vault is it is a commercial solution built on open source
    platforms, some of which are better than others. The log aggregation and correlation,
    however, are strictly Alien Vault technology.


    References


    +   1. AlienVault, https://www.alienvault.com/products'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# SIEMs – LogRhythm


    +   - LogRhythm

    - High-end SIEM

    - Provides intelligently parsed logs based on math and some artificial intelligence

    - Cost based on messages per second

    - Offers File Integrity Monitoring

    - Complex to configure

    - Complex to maintain


    ![](img/713f43d93c9396a48fab01efb4b1b069_127_0.png)


    LogRhythm can be considered one of the top-end SIEM solutions on the market today.
    LogRhythm builds a baseline of the log events on your systems and network, and
    by using proprietary algorithms and artificial intelligence, is able to find outliers
    within the baseline of activity created.


    LogRhythm is a fantastic tool but does a huge learning curve and really requires
    dedicated people to use it and maintain it to gain the value from it. It is a
    complex platform to configure and maintain, but it provides unprecedented results
    on anomaly detection.


    LogRhythm also offers a File Integrity Monitoring agent to use in conjunction
    with its SIEM platform at an extra fee.


    Reference


    +   1. LogRhythm, https://logrhythm.com/'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# SIEMs – QRadar


    +   * QRadar

    * IBM’s SIEM solution

    * Advanced Sense Analytics Engine to detect advanced threats

    * Somewhat difficult to configure

    * Simple to maintain

    * Analyzes all data for threats, net flow, vulnerabilities, logs, and network
    packets


    ![](img/713f43d93c9396a48fab01efb4b1b069_128_0.png)


    QRadar is IBM’s answer to the SIEM need in the marketplace. QRadar is strictly
    a SIEM solution with an Advanced Sense Analytics Engine to detect advanced threats
    through the anomalies on the network. It is similar to LogRhythm in its capability
    to detect anomalies on the network through the use of heuristics but doesn’t use
    the level of math to do its detection LogRhythm does.


    QRadar is somewhat difficult to configure but relatively easy to use and maintain,
    even by those who have little to no training in log analysis and SIEM operation.
    QRadar takes in and analyzes for threats based on vulnerabilities on the network
    systems, logs it receives, network packets it is collecting off the packet sniffer,
    and the net flow data received from switches, routers, and firewalls.


    Reference


    +   1. QRadar, http://www-03.ibm.com/software/products/en/qradar'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# SIEMs – Logstash


    +   * Logstash

    * Open source solution

    * Fantastic synergy with elastic search for amazing speed and scalability

    * No front end on its own; best used with Kibana

    * Somewhat difficult to deploy

    * When used with Kibana and elastic search, gain a flexible real-time view

    * No prebuilt automated anomaly detection


    ![](img/713f43d93c9396a48fab01efb4b1b069_129_0.png)


    Logstash itself is not a SIEM but rather a component of what can be used as a
    SIEM. Logstash is a fully open source solution for log aggregation, pipelining,
    and storage. The developers of Logstash also created Kibana, which is a separate
    web-based dashboard that allows for flexible, real-time reporting, data slicing,
    and elastic search. The Kibana data search engine was specifically designed to
    handle enormous amounts of data to search through be nimble and incredibly fast.
    It was designed for big data analysis. When you combine Logstash, elastic search,
    and Kibana, you end up with a pretty robust SIEM solution.


    The caveat is that Logstash is difficult to deploy because it has multiple independent
    moving parts. Luckily, there is a large community supporting this technology,
    so support is good and documentation is plentiful. There are also no prebuilt
    anomaly detection rules, alerts, or searches; you have to create those on your
    own. You need a skilled log/security analyst to create those to get great value
    out of Logstash and its corresponding tool.


    Reference


    +   1. Logstash, https://www.elastic.co/products/logstash'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# SIEMs - Graylog2


    +   Graylog2

    * Open source solution

    * Unlike Logstash, it includes a built-in dashboard and search engine

    * Very easy to set up

    * Advertised as a log management solution but also gives correlation

    * No prebuilt automated anomaly detection

    * Offers enterprise solution that simply gives support


    ![](img/713f43d93c9396a48fab01efb4b1b069_130_0.png)


    SANS SEC401 | Security Essentials Bootcamp Style 136


    Graylog2 is another open source solution for log management. Though it is advertised
    as a log management solution, it is also a SIEM because it has the capability
    to normalize logs and correlate them with searches that you can build and alert
    on. Unlike Logstash, Graylog2 is an all-in-one solution and requires the setup
    of only Graylog2 to get full functionality. Graylog2 is easy to get running and
    begin parsing logs with.


    Just like Logstash, Graylog2 has no prebuilt anomaly detection rules, alerts,
    or searches; you have to create those on your own, which requires a skilled/security
    analyst to create those to get great value out of Graylog2. However, Graylog2
    does offer an enterprise edition in which you can get free support to help you
    create those rules. The Graylog2 enterprise solution is the same as its free version
    but includes different levels of phone and email support to help you with it.


    Reference

    1. Graylog, https://www.graylog.org/


    128 2017, Secure Anchor Consulting'
  merge: -1
