  md: '# Problem with chroot()


    +   * Have to discover and copy all application dependencies into chroot() directory

    * Helper programs and shared libraries

    * Application and system configuration files

    * Device files (tricky)

    * Look for preconfigured directories provided with OS (BIND, FTP)

    * Applications with complex dependencies may be impossible to chroot()


    Why doesn''t every application run under a chroot() restriction by default? Wouldn''t
    that sort of rigid compartmentalization improve the overall security of the system?
    The answer is yes. This would improve security, but the difficulty is that there
    is significant administrative effort involved in configuring the directory structure
    where the application will chroot().


    Remember that, for the application is concerned, the chroot() directory and the
    directories below it are the entire file system. If that the application needs
    to run another program, read a configuration file, or access a system device,
    a copy of that program, configuration file, or device must be provided underneath
    the chroot directory structure in the same relative file location that the application
    expects. For example, if a BIND name server chroots to /var/named/chroot and wants
    to look at its at /etc/named.conf configuration file, the administrator has to
    create /var/named/chroot/etc/named.conf. If that same program wants access to
    the dev/null system device, the administrator must create a copy of this device
    /var/named/chroot/dev/null, and so on.


    To identify dependencies, you can use a tool called ldd (list dynamic dependencies)
    that will show you the list


    The good news is that starters are providing preconfigured chroot() areas for
    common applications. For example, the TFTP daemon on every UNIX system is set
    up to running chroot()ed in /ftpbase. Red Hat provides a preconfigured /var/named/chroot
    area for running BIND safety, although BIND under Red Hat is not configured to
    use this setup by default.


    Ultimately, an application may have so many external dependencies that creating
    a working chroot() directory tree for the application means basically making an
    almost complete copy of the operating system under the chroot() directory. In
    these cases, just isolating the application on its own server is almost equivalent.
    Virtual machine technology, such as VMware or Xen, is another mechanism you can
    employ to provide isolated "sandbox"-type systems for specific applications.


    ![](img/713f43d93c9396a48fab01efb4b1b069_240_0.png)'
  merge: -1
