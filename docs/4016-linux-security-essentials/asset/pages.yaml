  md: '# Puppet


    +   * Originally a development operations tool

    * Open source and commercial version

    * Limited prebuilt support

    * Commercial version most feature rich

    * Written in Ruby

    * Requires some skill to configure

    * Has some support for Windows systems


    ![](img/713f43d93c9396a48fab01efb4b1b069_91_0.png)


    Puppet is the first centralized configuration management tool in the lineup; it
    is also one of the most popular solutions in the market with both a commercial
    and an open source offering. Originally a development operations tool, Puppet
    organically became a configuration management tool over time. It ensures software
    and configurations are installed and set up consistently across multiple systems
    in an environment.


    Malicious actors need to find only one way to gain access to your environment.
    By using tools such as puppet, a system administrator can control and manage how
    systems are configured. By doing so, they can reduce the total number of vulnerabilities.
    Puppet also gives system administrators a centralized place to address newly released
    vulnerabilities to all affected systems at one time.


    Puppet is written in the Ruby language. Consequently, system administrators who
    have programming skill can easily extend their feature set.


    Puppet offers a free version with a reduced feature set, but it is still rich
    enough to manage many organizations looking for an inexpensive way to manage the
    configuration of Linux systems within their environment. Thus, they can reduce
    risk and adhere to regulatory compliance needs of the organization


    References


