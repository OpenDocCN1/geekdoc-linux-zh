- img_proc: true
  md: '# Setting Up an Encrypted Partition with LUKS


    ```

    cryptsetup --verbose aes-xts-plain64 --key-size 256 --hash sha512 --iter-time
    5000 --use-random /dev/sda

    ```


    ```

    cryptsetup open --type luks /dev/sda3 root

    ```


    ```

    mkfs.ext4 /dev/mapper/root

    ```


    ```

    mount -t ext4 /dev/mapper/root /mnt

    ```


    ```

    umount /mnt

    ```


    ```

    sysctl --write vm.drop_caches=3

    ```


    Create cryptographic devices


    Unlock the device mapper


    Create the file system


    Mount the device to transfer the data


    mount the device


    Clear the copy and cache the buffer


    Setting up encryption with LUKS can be very straightforward, but it is always
    important to remember that all solutions have both pros and cons. Although it
    is important to protect critical data on a Linux server, cryptographic solutions
    work only if there is proper key management in place. Often organizations think
    encryption equals security, but this is true only if it is configured and set
    up correctly. Also, anyone who needs access to the data would need access to the
    keys. Therefore, with large servers, management can be a nightmare.


    In starting encryption, the first step is to make sure there is a partition that
    does not have any data. When you''re setting up the encrypted partition, any information
    on the drive could be lost. You need to set up the partition by creating the cryptographic
    devices and unlocking the device mapper. After doing this, you need to create
    the file system. At this point, the drive is mounted and data copied over the
    drive. After the data is copied, it would be unmounted and the cache and buffer
    need to be cleared.


    # Reference


    +   1. https://www.howtoforge.com/tutorial/how-to-encrypt-a-linux-partition-with-dm-crypt-luks/'
