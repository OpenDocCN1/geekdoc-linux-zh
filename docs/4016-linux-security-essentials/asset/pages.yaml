  md: '# Finding the Needle in the Haystack: | grep


    +   * All attacks are visible; the question is “Can you find them?”

    * | (pronounced pipe) allows for information from one command to be sent to another
    command

    * grep is a regular expression searching tool that enables you to look for certain
    information

    * Utilizing | grep enables on the fly scripting, making it easier to analyze large
    amounts of information

    * A key component of an SOC analyst is to be able to identify events of interest
    (EOI) in a quick, efficient manner


    ![](img/713f43d93c9396a48fab01efb4b1b069_211_0.png)


    There is no such thing as an invisible adversary. All attacks leave clues. The
    real question is “Can you find the clues?” The problem is that in most cases,
    the security engineer or security operations center (SOC) analyst is so overwhelmed
    with information that it is difficult (even impossible at times) to find valuable
    information amidst the noise. Manual methods have their place in security, they
    do not scale and are limited in their capacity. Therefore, one of the goals of
    security is to automate the analysis as much as possible. A great way to do this
    is to do on-the-fly scripting by piping (that is, using the |) to send the output
    from one command as input to another command. This tool enables a security professional
    to take steps that are normally manually performed and allows them to be automated.


    Although automation is important, often an analyst wants to be able to look for
    or identify certain activity. This is the point at which the grep command comes
    into play. The grep command enables you to take a large amount of input and look
    for certain output. The grep command is a regular expression searching tool that
    can take large amounts of output and look for certain information that meets specific
    criteria.'
  merge: -1
