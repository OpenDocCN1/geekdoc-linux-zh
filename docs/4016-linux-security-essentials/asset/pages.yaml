- img_proc: true
  md: '# Syslog (3)


    # Syslog facility codes


    | Facility Code | Keyword Description | Facility Code | Keyword Description |

    |---|---|---|--|

    | 0 | kern | kernel messages | 12 | NTP subsystem |

    | 1 | user | user-level messages | 13 | log audit |

    | 2 | mail | mail system | 14 | log alert |

    | 3 | daemon | system daemons | 15 | cron scheduling |

    | 4 | auth | security/authorization messages | 16 | local0 use (local0) |

    | 5 | syslog | messages generated internally by syslog | 17 | local1 use (local1)
    |

    | 6 | lpr | line printer subsystem | 18 | local2 use (local2) |

    | 7 | news | network news subsystem | 19 | local3 use (local3) |

    | 8 | uucp | UUCP subsystem | 20 | local4 use (local4) |

    | 9 | clock | clock daemon | 21 | local5 use (local5) |

    | 10 | authpriv | security/authorization messages | 22 | local6 use (local6) |

    | 11 | ftp | FTP daemon | 23 | local7 use (local7) |


    ![](img/713f43d93c9396a48fab01efb4b1b069_142_0.png)


    SEC401 | Security Essentials Bootcamp |


    A facility code is used to specify the type of program that is logging the message.
    Messages with facilities may be handled differently. The mapping between facility
    code and keyword is not uniform between operating systems and different syslog
    implementations. As a result, a lot of the facility codes, especially local0 through
    local7, will be used by whatever the vendor wants to use for them. This is one
    of reasons it is tough to parse and normalize syslogs and correlate them across
    multiple platforms.


    The most common facility codes used are kern, user, daemon, auth, syslog, and
    auth priv. These will usually line up with the actual process creating the log
    message. local0 through local7 are used often also, but they do not line with
    any particular application at all, especially with Windows event logs.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Syslog (4)


    # Syslog severity levels


    | Value | Severity | Keyword | Description |

    | 0 | Emergency | emerg | System is unusable |

    | 1 | Alert | alert | Should be corrected immediately |

    | 2 | Critical | crit | Critical conditions |

    | 3 | Error | err | Error conditions |

    | 4 | Warning | warning | May indicate that an error will occur if action is not
    taken |

    | 5 | Notice | notice | Events that are unusual, but not error conditions |

    | 6 | Informational | info | Normal operational messages that require no action
    |

    | 7 | Debug | debug | Information useful to developers for debugging the application
    |


    ![](img/713f43d93c9396a48fab01efb4b1b069_143_0.png)


    The meaning of severity levels other than Emergency and Debug are relative to
    the application and those that produced it. The server process that handles the
    message usually includes all lower levels. That is, if messages are separated
    by individual severity, a Warning level entry will also be included in Notice,
    Info, and Debug processing.


    Because the application is designed to use the severity levels however it fits
    for everything excluding the emergency and debug log levels, applications will
    use the severity levels in confusing ways within the application. Also, one application
    may have a different severity level for the same kind of error in a different
    application, causing further issues with correlation due to the lack of definition
    in the syslog format standard.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Syslog Security (I)


    Syslog security considerations


    +   - Sender authentication

    - Message confidentiality

    - Message delivery and replays


    > Syslog does not, by default, encrypt the traffic, so syslog traffic is inherently
    not confidential and all traffic is sent in cleartext


    Syslog does not provide strong sender authentication. The receiver of the syslog
    message will not be able to ascertain that the message was indeed sent from the
    reported sender or whether the packet was sent from another device. This can also
    lead to a case of mistaken identity if an inappropriately configured machine sends
    syslog messages to a receiver representing itself as another machine.


    Syslog does not, by default, encrypt the traffic, so syslog traffic is inherently
    not confidential and all traffic is sent in cleartext.


    An attacker could record a set of messages that indicate normal activity of a
    machine, and then those messages can be re back to the server without any knowledge
    or verification that those log messages are truly from the source server. The
    only indication that there is a problem occurs when the logs are coming from the
    source server supposedly deviating from the norm of the logs that would normally
    be received at the times they are being received.


    Reference


    +   1. https://tools.ietf.org/html/rfc5426#page-6'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Syslog Security (2 of 2)


    # Syslog security considerations


    +   - Denial of service

    - Unreliable delivery

    - Message prioritization and differentiation


    Syslog does not have any authentication or verification; it will simply accept
    the logs from any source. Any source could send a tremendous amount of noise,
    causing the server to have to drop legitimate syslog traffic destined for it.


    Syslog is susceptible to denial of service in several ways. Because syslog does
    not have any authentication or verification, it will simply accept the logs from
    any source; then any source could send a tremendous amount of noise, causing the
    server to have to drop legitimate syslog traffic destined for it. Access control
    lists can help much here because syslog uses UDP, and it is a sessionless protocol,
    any users can spoof their source IP address to match the allowed sources in an
    access control list and still send a tremendous amount of syslog messages, maxing
    out the bandwidth or the processing capability of the syslog server.


    A denial of service can occur if many logs are sent to the server that it fills
    the disk where the logs are stored and no more logs can be written to it. If the
    logs are not stored on their own disk or partition, this can actually cause the
    whole system to crash if the OS itself does not have any space to use for normal
    operations.


    Returning to the fact that syslog uses UDP as its transport protocol, this is
    a best-effort protocol. This means that the syslog daemon sends the traffic, and
    there is no checking on over the destination server recovered and there is no
    checking on the server side to determine whether the message is corrupted upon
    receipt of the message. All points point to the fact that syslog can be unreliable
    in its delivery, causing you to potentially miss out the critical logs you need.
    It is important to point out that although syslog''s default is UDP, it can also
    be configured to use TCP.


    Syslog has severity levels and facility codes that could be used for prioritization
    and differentiation, but syslog does not contain features that will use these
    aspects of the syslog message format to prioritize and differentiate messages.
    As a result, all messages are processed with the same priority. Even if syslog
    did differentiate and prioritize, the severity levels and facility codes are not
    fully standardized across the industry.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Syslog (5 of 5)


    # Syslog configuration


    +   - Configuration file is syslog.conf


    ```

    # standard logfile

    destination auth {file("/var/log/auth.log"); };

    destination cron {file("/var/log/cron.log"); };

    destination daemon {file("/var/log/daemon.log"); };

    destination kern {file("/var/log/kern.log"); };

    destination lpr {file("/var/log/lpr.log"); };

    destination mail {file("/var/log/mail.log"); };

    destination syslog {file("/var/log/syslog.log"); };

    destination user {file("/var/log/user.log"); };

    destination unicp {file("/var/log/unicp.log"); };

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_146_0.png)


    For both the server and client side of syslog, a syslog.conf file tells syslog
    which logs to capture from what facility and where they should be stored. This
    is also the place where syslog is configured to receive logs remotely or where
    it needs to send logs to remotely.


    The two parts to an entry for syslog.conf are the facility and the action. The
    filter can use both the facility code and the severity level to direct log messages
    to the log files. If the severity is not specified, it is implied that all severity
    levels will be forwarded to the specified log file. Some syslog daemons require
    the specification of the severity level for a facility code, and if you want all
    severity levels for a specific facility code, you simply use an asterisk (*) as
    a wildcard to match them all. It should look like this:


    destination auth.* { file("/var/log/auth.log"); };


    A caveat to using syslog.conf: for UNIX systems, including FreeBSD, can read the
    facility commands when they are delineated by spaces, but not all syslog daemons
    are able to. They all can read tab-delimited files, so it is recommended you tabs
    to delineate the rules you add to the syslog.conf file to ensure it will always
    work.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Syslog-NG


    | | client host | |

    |---|---||

    | | application #1 | application #2 | application #3 |

    | | | | | network interfaces |

    | | source #1 | source #2 | source #3 | log paths |

    | | big paths | filters | destinations | log destinations |

    | | | syslog-server |


    +   * Replacement to syslog


    +   * Developed to add additional security to remote system logging


    +   * Additional filtering


    +   * Sends data with TCP


    SANS


    SEC401 | Security Essentials Bootstrap Style | 145


    Some limitations to syslog have led to the development of other syslog-logging
    packages. Syslog Next Generation (syslog-NG) was developed to add additional security
    to remote system logging and provide for additional filtering options for the
    log files. It is also designed to work with a variety of operating systems, including
    Microsoft Windows, which allows it to be the one logging solution throughout a
    heterogeneous environment.


    The syslog-NG is a drop-replacement for the traditional syslog that is included
    with Linux and UNIX systems.¹¹ Many Linux variants include a syslog-NG package
    in their distribution but do not install it by default. For example, in Fedora,
    an administrator can run `yum install syslog-ng` from the command line, and `chkconfig
    --add syslog-ng`. To switch to syslog-NG, run the syslog daemon and start the
    syslog-daemon. The configuration for syslog-ng resides in /etc/syslog-ng and uses
    the same facilities and properties as the default syslog. It is possible to use
    a variety of proxy servers to collect data and forward to a central log.²


    In addition to filter by facility and priority, syslog-NG enables an administrator
    to filter by hostname and by the actual text of the log message regular expressions.³
    It does this by first creating destinations (namely files), creating filters based
    on facility, priority, hostname, and the presence (or absence) of a string; then
    creating logging rules based on those filters and destinations⁴ For example:


    > # This will create a destination with the alias of "messages" that will be sent
    data to /var/log/messages destination file; `:/var/log/messages`


    References


    +   1. Syslog home page, https://www.balabit.com/network-security/syslog-ng/

