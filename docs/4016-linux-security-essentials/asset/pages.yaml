  md: "# Sysctl Hardening – IPv6\n\n# Settings for hardening IPv6 include\n\n+   -\
    \ Disable router advertisement\n  - net.ipv6.conf.all.accept_ra=0\n  - net.ipv6.conf.default.accept_ra=0\n\
    - Enable IPv6 privacy extensions\n  - net.ipv6.conf.all.use_tempaddr=2\n  - net.ipv6.conf.default.use_tempaddr=2\n\
    - Rate limiting\n  - net.ipv6.icmp.ratelimit – limit in time (ms), default 1000\n\
    \n![](img/713f43d93c9396a48fab01efb4b1b069_105_0.png)\n\nIPv6 is a commonly overlooked\
    \ protocol to harden and secure. Some countries still use IPv4, but they also\
    \ support IPv6 simultaneously. The Sysctl kernel module enables configurations\
    \ that allow a system administrator to control the operation and function of IPv6\
    \ on the interfaces of a Linux host.\n\nTo increase the security posture of IPv6\
    \ on a Linux system, you can do three things. First, you can disable router advertisements.\
    \ This step is advisable, but there is a catch: Router advertisements help determine\
    \ whether they are on the same subnet as another. In addition, router advertisements\
    \ configure the MTU of packets, neighbor discovery, and DNS for Linux systems.\
    \ Although disabling router advertisements might increase IPv6 security, doing\
    \ so will get in the way of administering your systems unless your infrastructure\
    \ is designed for the adjust of lost features caused by disabling router advertisements.\n\
    \nSecond, you can prevent the default self-assignment of IPv6 addresses, which\
    \ include the MAC address of the network interface card to which the IPv6 address\
    \ is assigned. When IPv6 addresses are selfassigned, the MAC address is visible\
    \ from the layer 2 network. In addition, all networks this system can communicate\
    \ with can see the system's MAC address.\n\nThird, you can adjust rate limiting.\
    \ This aids in prevention of service attacks by limiting the resources that can\
    \ be used. The sysctl utility is not as feature in configuring IPv6 as it is with\
    \ IPv4; the reason is that not all the controls have been ported over yet.\n\n\
    Reference\n\n+   - \"Linux Security Guide for Hardening IPv6\", https://linux-audit.com/linux-security-guide-for-hardening-ipv6/"
