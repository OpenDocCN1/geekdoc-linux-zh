  md: "# Sysctl Hardening – Address Space Layout Randomization\n\n+   * Address Space\
    \ Layout Randomization (ASLR)\n  * Randomizes process memory address space\n \
    \ * Makes successful exploits and the resulting control of execution much harder\n\
    \n+   * Effectiveness of ASLR is limited by the amount of available entropy, which\
    \ varies from platform to platform\n\n+   * For ASLR to be useful, all segments\
    \ of a process’s memory space must be randomized\n\n+   * ASLR can be disabled\
    \ per application with setarch\n\n+   * Recommended to remove setarch utility\
    \ from hardened systems\n\nAddress Space Layout Randomization (ASLR) randomizes\
    \ the address space for processes. The purpose is to assist in the prevention\
    \ of exploits that require the use of known address locations for particular process\
    \ functions such as the return function. How effective ASLR is will depend on\
    \ the amount of randomized address space. The more address space is randomized,\
    \ the less likely an exploit can be successfully created. Note also that the amount\
    \ of available entropy for randomization varies between platforms.\n\nYou can\
    \ enable and disable ASLR for individual programs if necessary. You should remove\
    \ the setarch utility or not allow any user to have permissions to use setarch.\
    \ Removing access makes defeating ASLR more difficult because you cannot simply\
    \ gain the privileges of a user who can disable an application’s ASLR setting\
    \ with setarch."
