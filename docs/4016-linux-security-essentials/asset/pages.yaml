  md: "# Enhancing the Overall Security\n\n+   * Many utilities have been built for\
    \ Linux\n* Goals for enhancing OS security\n  * Better visibility\n  * Reducing\
    \ the attack surface\n  * Controlling the damage\n  * Early detection\n\n+   *\
    \ Always identify the overall risk that is going to be reduced\nDetermine if the\
    \ solution is the most cost-effective way of reducing the risk\n\n![](img/713f43d93c9396a48fab01efb4b1b069_180_0.png)\n\
    \nOne of the reasons that technical people use Linux is that it has many capabilities.\
    \ From built-in scripting to security commands, it is a powerful operating system\
    \ for finding, tracking, and minimizing the damage caused by an adversary. However,\
    \ you can capture the power of Linux only if you are aware and understand all\
    \ the built-in capabilities. Utilizing any tool, it is important to remember what\
    \ the goal of security is, most important, what you are trying to accomplish.\
    \ Often, engineers use and/or a ton of tools, and when asked what the security\
    \ goal is, do they have a good answer.\n\nOrganizations today are not making a\
    \ good job with detection. We hear all these stories in which organizations have\
    \ been compromised over a year and the entity had no idea. The reason is that\
    \ they do not have proper visibility into what is happening on the system. Many\
    \ security professionals are accustomed to visible attacks, and when the adversary\
    \ goes into stealth mode, the attack is missed. Understanding what is happening\
    \ on a system that anomalies can be detected and investigated is a key part of\
    \ security. We want to detect everything. Although detection is important, we\
    \ also know that we cannot prevent all attacks, but if we can reduce the attack\
    \ surface, we can make it harder for a compromise to occur.\n\nUltimately, security\
    \ is all about reducing the risk to critical assets. Therefore, any time you are\
    \ going to use a tool, you should always ask these questions:\n\n+   * What is\
    \ the risk?\n* Is this the highest priority risk?\n* Is this the most cost-effective\
    \ way of reducing the risk?\n\nFocus on the highest priority risks with the most\
    \ cost-effective measures, and you will go a long way to securing your organization."
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Understanding of Security


    WARNING – WARNING – WARNING


    Often, security professionals criticize a tool because it is either old or does
    not solve all security problems


    Instead of trying to find fault, ask yourself whether the utility helps or hurts
    your overall security


    The ultimate question to always ask is based on the cost that is required to implement
    the solution, whether the reduction in risk is worth the overall effort


    WARNING – WARNING – WARNING


    ![](img/713f43d93c9396a48fab01efb4b1b069_181_0.png)


    SEC40 | Security Essentials Bootcamp Style 179


    It is important to add a slide about the value of various security tools and issue
    a warning. One of the quality traits that makes security professionals good at
    their jobs is that we know how to break things. Many of us love to find vulnerabilities
    or weaknesses. Although that can be effective when performing a penetration test,
    it can be very dangerous when it comes to security tools. There is no perfect
    solution when it comes to security, and 100% security does not exist. Therefore,
    any tool is going to be effective in some cases but ineffective in others.


    For this entire course, especially in this section, do not focus on what a tool
    does and was not designed to do. Instead, focus on what it was built for and the
    benefits it adds to a system. You may hear criticism about some of the tools in
    this book that people say that a tool does not have these features. The counter
    argument is that this tool requires 20 minutes to configure and catch 5% of all
    attacks. With the current threats that we have today, that should be considered
    a win.


    To be an effective professional, you need to have a lot of tools in your toolbox.
    Not every tool is going to work in every situation, but it is good to have alternatives
    and options. With many customers, you will be using only a subset of the tools,
    but it is still good to have options available.


    The final warning is that new developments are happening all the time, many aspects
    of Linux have not changed. However, be you look at what date a tool was created—say
    it is old—and you jump to the conclusion that it is useless or the information
    is out of date. Many security professionals use tools that are years old because
    they work, and no free solution is available.


    When it comes to cyber defense, remember that preventing it is all about being
    creative and having an open mind. If you are going to dismiss a tool, make sure
    you do so for the right reasons and that you do your research.


