  md: '# # What Is chroot()


    +   - Applications may call chroot() to isolate themselves to a particular directory

    - If attackers compromise an application, they have only limited access to the
    system

    - Some apps have built-in chroot(): TFTP, (anonymous) FTP, BIND, and SSH

    - For other apps, such as Apache, use the chroot wrapper function


    ![](img/713f43d93c9396a48fab01efb4b1b069_238_0.png)


    The UNIX chroot() restriction is an application-isolation feature that must be
    enabled on an application-by-basis.


    An application developer may have to program invoke chroot(), typically early
    in the setup and configuration phase of the application, before the application
    starts accepting requests from external users. When an application calls chroot(),
    it basically specifies the OS kernel directory in the file system where the application
    wants to isolate itself. From that point forward, the kernel enforces this isolation
    and doesn''t let the application "see" any of the file system outside the directory
    that application specified when making the chroot() call. From the application''s
    perspective, it is as if the root and all subdirectories and files below are now
    the only files and directories on. (The system is named chroot() it changes the
    root of the file system from the application''s perspective.)


    The advantage from a security perspective is that, if a vulnerability is discovered
    and exploited in the application, the attacker can only access the parts of the
    file system where the application has chroot itself. This prevents the attacker
    from modifying other configuration files and binaries in the main operating system.
    In fact, the attacker''s exploit may fail completely because it relies on other
    operating systems that are not present in the chroot() directory used by the application.
    This is particularly useful for applications such as BIND and SSH, which are also
    Internet-facing applications and are complex even though it''s likely there are
    going to be more exploits discovered over time. Running applications with chroot
    restriction helps mitigate the potential damage from future security events.


    Aside from mitigating unknown vulnerabilities, chroot is often employed to restrict
    the access that a given application may have to the file system. For example,
    TFTP allows unauthenticated transferred files from a system, so administrators
    want to restrict TFTP to serving files from certain authorized directories. This
    is why TFTP daemon chroot() themselves to a directory like /ftp so that they only
    serve files from this area. Similarly, anonymous FTP servers are configured to
    automatically invoke chroot() so that they only provide access to software archives
    specifically configured by the system administrator.'
  merge: -1
  pgno: 238
- img_proc: true
  md: However, it's important to realize that the decision to use chroot() is left
    to the individual application developer. You might want to chroot() your Apache
    web server to help protect yourself from directory traversal attacks that enable
    outsiders to escape from your standard HTML document tree and access other files
    on the system. Unfortunately, the Apache developers have not included chroot()
    functionality in the application. For these sorts of applications, the OS includes
    a "wrapper" type program called chroot. In the case of Apache, you run the chroot
    "wrapper" program and tell it the directory where you want the chroot() to happen
    and specify the normal command-line invocation for Apache. The chroot program
    performs the chroot() system call and then starts the Apache daemon in this isolated
    environment.
