  md: '# The Core of Containers: cgroups and namespaces


    | cgroups | namespace |

    | --- | --- |

    | - Developed by Google | - Developed by IBM |

    | - Control the isolation of system resources | - Obtain system resources that
    are needed |

    | - Govern the system resources | - Present the resources to the application |

    | - Key resources are CPU and memory | - Appear to be dedicated to the application
    |

    | - Control resources for a group of processes | - Isolation for a single process
    |


    ![](img/713f43d93c9396a48fab01efb4b1b069_242_0.png)


    SEC401 | Security Essentials Boozcamp Style 249


    Cgroups and namespaces are developed by the core of the kernel that allows for
    the isolation of different applications. It is what provides the foundation for
    security.


    Cgroups was originally developed by Google. It controls the control and governance
    of system resources. The key resources that it controls are CPU and memory. Cgroup
    controls resources for a group of processes. It is a key feature that limits,
    accounts for, and isolates system resources for a group of processes. Therefore,
    a process or collection of processes can be limited on how much of a given resource
    they use and the usage can also be tracked and monitored. This capability is very
    valuable to make sure that one or two processes do not utilize resources.


    Namespace was originally developed by IBM. It focuses on obtaining resources that
    an application needs and provides those resources to the application. It performs
    isolation for a single process. For both security and stability, it is critical
    that if a process is compromised or becomes, it cannot negatively impact the other
    processes that are running on the system. Namespace provides a way to isolate
    isolate process and limits what the process can see. With namespace, it enables
    you to isolate each process from all the other


    # References


    +   1. Cgroups, https://en.wikipedia.org/wiki/Cgroups

    2. Containers Anatomy, http://www.slideshare.net/jpetazzzo/anatomy-of-a-container-namespaces-cgroups-some-filesystem-magic-linux

    3. Difference between cgroups and namespace, http://stackoverflow.com/questions/34820558/difference-between-cgroups-and-namespaces


    240 © 2017, Secure Anchor Consulting'
  merge: -1
