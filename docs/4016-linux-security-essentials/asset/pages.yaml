  md: '# Locking User Accounts After Too Many Login Failures


    Edit the /etc/pam.d/system-auth file and add/change the following

    * pam_tally module counts fail login:


    ```

    auth required /lib/security/$ISA/pam_tally.so onerr=fail no_magic_root

    ```


    ```

    account required /lib/security/$ISA/pam_tally.so per_user deny=5

    no_magic_root reset

    ```


    By default, UNIX systems do not lock out an account after a set number of login
    attempts. By setting this

    value, you prevent brute-force password-guessing attacks. Do not apply to the
    root account because this can cause

    denial of service (DoS) for the administrator.


    The pam_tally module locks individual accounts after many failed so or login attempts.


    onerr=fail tells the system what to do when reaching a set of fail=lock accounts.


    No_magic_root tells the system to lock the root account. This prevents a DoS against
    the root account.


    per_user keeps an account of each individual use.


    Deny= $ is the number of attempts made before account locks.


    faillog -u <user> lists the current number of bad logins.

    faillog -u <user> -r unlocks the account.

    faillog -u <user> -m -1 turns off locking on lockout of a particular user.


    You can unlock accounts by using these commands:


    +   * passwd -d <user>

    * usermod -L <user>

    * passwd -u <user>

    * usermod -U <user>'
  merge: -1
