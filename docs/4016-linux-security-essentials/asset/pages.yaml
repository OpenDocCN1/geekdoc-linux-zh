    | Secure Applications | Applications |

    | Secure Network Protocols | Network |

    | Secure Services | Operating System |

    | Secure Boot/''Lock Down'' | Hardware |


    With any operating system, including Mac, it is critical to continually think
    about security and look at additional hardening measures. The following are some
    additional items that you can use to secure a Mac.


    Turn on the built-in firewall to properly filter and control access to services
    that are running on a system. Although firewalls are valuable, the best way to
    secure a service is to turn it off. Therefore, verify that a service is required
    if it is turned on and then manage access with a firewall.


    If file sharing is needed, make sure to set up secure file sharing and careful
    control access. Similar to the theme in the previous paragraph, limit or turn
    off file sharing if it is not needed.


    Setting up access lists is important, but it is important to monitor and keep
    access lists to date. Job requirements and access change over time. Because someone
    needs access today does not mean person needs access in a month.


