  md: '# Criticality of Linux Systems


    +   - Make a list of the most critical data to your organization

    - Determine what the most critical processes that access that data are

    - Map back to what servers that data resides on


    # What percent of those systems is Linux-based?


    HINT: Most appliances and security devices run Linux


    With security, it is not the quantity of the systems, but the quality. When you
    are implementing security, it is critical to always focus on the systems that
    contain the critical data. The difference between a major breach and a minor breach
    is not the system that is compromised but the data contains. If a system is compromised
    and there is no critical data, the impact to the system is minimal. If there is
    critical data, it is a major impact to the system.


    It is, therefore, important to identify the critical data, map it to critical
    processes, and determine what systems they reside on. The question is, "Which
    operating system is running on those systems?" In many cases, a significant percentage
    of them are probably Linux systems. In my experience, there are typically a few
    fewer Linux systems, but they are often the most critical systems.


    When you''re looking at the impact Linux systems have to your organization, it
    is important to not overlook appliances. Most appliances, including security devices,
    are running Linux.'
