  md: '# Ubuntu Fedora


    | Based on Debian Linux | Based on Red Hat Linux |

    |---|--|

    | Comes in Desktop and Server editions | Installer makes user choose: desktop,
    server, or other |

    | APT-based package management | RPM-based package management using yum |

    | Firewall not enabled by default | Firewall included and enabled by default |

    | Includes many capabilities and built-in features | Includes many capabilities
    and built-in features


    ![](img/713f43d93c9396a48fab01efb4b1b069_16_0.png)


    SEC401 | Security Essentials Bootcamp Style 14


    Ubuntu is a Linux distribution. Its name comes from an African word, which, roughly
    translated, means "humanity to others." Mark Shuttleworth, who made billions with
    an Internet company and is the owner of a South African company, is now the driving
    (and unifying) force for Ubuntu Linux.1 You can download a desktop or server edition
    of Ubuntu and any "derivatives" that focus on education, open licensing, multimedia
    work, or specific desktop environments (window managers).2


    Ubuntu is based on the reverted Debian distribution, which has been around since
    1993. Debian is probably best known for its package-management system, the Advanced
    Packaging Tool (APT). Debian has always stroved for stability and avoids software
    that doesn''t make a dependency priority. Ubuntu inherits Debian''s stable environment,
    and APT makes it easy to install software with the following:


    ```

    apt-get install <package name>

    ```


    APT researches the package in question, sees what libraries and other programs
    package might need (these are called dependencies), goes out to the Internet to
    download them, installs them, presents any configuration choices to the user,
    and checks its work—this is all done automatically.3


    For some, Ubuntu''s security is not robust enough (for example, it does not come
    with a default firewall or a graphical control for a firewall).4 Also, some criticize
    Debian''s priority of stability over cutting-edge software.


    Ubuntu comes in server and desktop editions and few derivatives for things such
    as education or multimedia work. It leads the Linux desktop community in supporting
    non-English languages.


    +   1. http://en.wikipedia.org/wiki/Ubuntu (Linux_distribution)

    2. http://www.ubuntu.com/products/whatisubuntu/ubuntuderivatives

    3. http://en.wikipedia.org/wiki/Ubuntu (Linux_distribution)

    4. https://wiki.ubuntu.com/UbuntuFirewall


    14


    © 2017, Secure Anchor Consulting'
