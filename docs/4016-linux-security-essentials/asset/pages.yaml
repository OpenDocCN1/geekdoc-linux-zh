  md: '# Hardening Scripts – Overview


    +   * A default install of a Linux system is not necessarily secure

    * Additional services and components that are installed can often be compromised

    * Default configuration options often contain vulnerabilities

    * Individuals who use Linux do not necessarily understand how to secure a system

    * Manual configuration can be very time consuming


    Hardening scripts are programs that you run on a system with the goal of properly
    securing or reducing the number of vulnerabilities that exist on a system. They
    provide an automated way to secure and lock down a system. Although hardening
    scripts have value, you have to be careful in using them.


    In some cases, too much security can be just as dangerous as too little security.
    Over securing a box can break services or negatively impact the operation of the
    system. Therefore, it is important to understand what the hardening script is
    doing and always test the scripts in development before rolling out to production.
    Of course, any changes to a production system should always go through a well-documented
    change control process.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# # Hardening Scripts PROS and CONS


    PROS

    Scalable way to secure a system Security can be defined once and scaled across
    the enterprise Automation of the hardening process

    Can be used as a validation method in auditing


    CONS

    Blindly applying security can be dangerous

    Security with no clear metrics makes validation difficult

    Person applying the script does not necessary learn or understand security

    Different systems require different security, so a one-size-fits-all approach
    does not always work


    SANS SEC401 | Security Essentials Bootcamp Style 219


    When we look at hardening scripts, there are often mixed feelings about their
    value and use in an enterprise. Although hardening scripts can provide a scalable
    solution, they can also be dangerous if the changes are not fully understood.
    For example, a hardening script could turn off a service that is often not required,
    but if this is done on a critical system that requires the results, the results
    could be catastrophic.


    The main pros of hardening scripts are the scalability and consistency of securing
    a large number of systems. If you need to secure hundreds of systems, hardening
    scripts can provide value. They can also be very useful from an auditing perspective.


    However, if not used correctly, hardening scripts can be dangerous. Essentially,
    a hardening script is blindly making changes to a system. If an admin does not
    fully understand the changes the hardening script is making, it could actually
    break key services or cause harm. Plus, hardening scripts typically provide no
    metrics of the overall increase in security.


    © 2017, Secure Anchor Consulting 229'
  merge: -1
