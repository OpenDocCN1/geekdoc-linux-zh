  md: '# Sudo and Sudoers


    +   su (switch user) is often used to elevate to root

    - Logs the switch of the user to the other user

    - No other control; the user has all root privileges

    - All users know the root user''s password

    sudo gives granular control of execution

    - Users only know their own password

    - Allowed to execute only the commands specified in sudoers file


    | Security policy that can be set with sudo |

    | --- |

    | effective user ID |

    | effective group ID |

    | environment list |

    | working directory |

    | umask |

    | SELinux role |

    | scheduling priority |


    ![](img/713f43d93c9396a48fab01efb4b1b069_101_0.png)


    In Linux environments, it is common for several administrators to know the root
    password. Logging in root provides no accountability because there is no way to
    trace the login back to the user. Therefore, during normal operation, the system
    is not configured to allow direct login as root. Each administrator must log in
    his or her own account. Traditionally, to get root access, administrators would
    use su (which stands for switch user) to elevate their privileges to root. Although
    this approach works, anyone who uses su as root is given full root access but
    not full root. For example, if you want Admin A to be able to create accounts
    but not change permissions on files, they cannot do so with. However, this problem
    is solved with sudo.


    Sudo is an alternative to su; it provides more granularity of control. With sudo,
    you can configure the system so that when Admin A uses sudo, she can only create
    accounts, but no other root access is allowed. In addition, with sudo, each user
    has his or her own password, so there is no longer a single shared password like
    there is with.'
