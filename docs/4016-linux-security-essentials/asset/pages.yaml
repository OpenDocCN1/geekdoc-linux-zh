  md: '# Security Firewalls


    +   - Firewalls are critical to manage and filter traffic

    - Network firewalls provide a boundary defense

    - Host-based firewalls are needed to complement network firewalls

    - With Linux, the same software can provide both network and host-based firewalls

    - Using the same software allows for better control, manageability, and scalability
    across the enterprise


    Even though firewalls cannot prevent all attacks and detection is required, a
    well-configured firewall is still a key part of an effective defense. In addition,
    a properly designed firewall can provide inbound prevention and outbound detection.
    Linux provides a great platform for creating both network and host-based firewalls.


    Network-based firewalls are ideal for setting up boundaries between different
    networks and/or to control the flow in and out from a sensitive network. However,
    network firewalls only protect systems behind the firewall. With traveling laptops,
    additional protection of the computer is needed via host-based firewalls. While
    host-based firewalls can be customized to protect a specific system, they are
    sometimes hard to manage in a large organization.


    Often, Linux-based firewall software can provide both network-based filtering
    if set up in a gateway environment and/or host-based filtering if installed on
    an individual system. Using the same software for both types of firewalls allows
    for centralized management and control.'
  merge: -1
  pgno: 220
- img_proc: true
  md: "# Linux Firewalls\n\n+   * A common theme is that Linux takes a simpler view\
    \ of the world than Windows\n* In Windows, there are host-based and network-based\
    \ firewalls—often made by different vendors with minimal relationships\n* However,\
    \ the following are the real differences:\n    * Both firewalls receive packets\n\
    \    * Both firewalls inspect packets\n    * If denied by the ruleset, both firewalls\
    \ drop packets\n    * The only difference is if the packets are accepted; host-based\
    \ firewalls will send the packet up the stack, and network-based firewalls will\
    \ route it the interface\n\nEven though firewalls cannot prevent all attacks,\
    \ they are still a critical part of a defense-in-depth strategy because they can\
    \ stop some attacks. The goal is to have firewalls between all segments in an\
    \ environment. Purchasing all these firewalls can be expensive. However, by utilizing\
    \ Linux devices, you can deploy a high number of firewalls in a cost-effective\
    \ manner.\n\nIn addition to network firewalls, it is also critical to deploy host-based\
    \ firewalls. The beauty of Linux is that the same software that is used to protect\
    \ a network can also be used for host-based protection. One of the valuable benefits\
    \ of doing this is that you now have a more scalable solution in building, maintaining,\
    \ and deploying rule sets.\n\nUsing the same software for both host and network\
    \ provides more scalable deployment because there are not that many differences\
    \ between the two. Both firewalls receive packets and analyze you via a rule set.\
    \ If the rule set says drop, you drop the packet. The only real difference is\
    \ if the packet is allowed. A network firewall would route the packet out the\
    \ network interface, and the host-based firewall would pass it up the protocol."
