  md: '# OSSEC


    +   * Integrates host-based intrusion detection

    * Comprehensive protection

    * File integrity checking

    * Log monitoring


    +   * Rootcheck

    * Process monitoring

    * Send email alerts and alert logs

    * Integrates with SIEM


    ![](img/713f43d93c9396a48fab01efb4b1b069_218_0.png)


    OSSEC is a fully integrated host-based intrusion detection tool for Linux. Although
    it does provide file integrity checking, it also has other mechanisms to protect
    and secure a host. The key focus is on tracking and identifying indicators of
    compromise. For example, modifying a file and running an additional process are
    actions taken by adversaries when they compromise a system.


    OSSEC also has an active alerting capability when an alteration is made to a key
    file. In addition to conventional alerting, it can also generate email alerts.
    More and more organizations run a security operations center (SOC), OSSEC can
    integrate its alerts with an existing security incident and event management (SIEM)
    to allow for correlation of activity.


