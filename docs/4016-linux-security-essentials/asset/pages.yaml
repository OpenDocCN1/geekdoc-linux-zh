  md: '# POSIX Access Control Lists

    UNIX File Permissions


    Write Permission      Execute Permission      Read Permission


    | | r | w | x | s | r | w | x | s | r | w | x | t | Symbolic Mode |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | Directory | read | write | execute | set-UID | read | write | execute | set-GID
    | read | write | execute | sticky | | |

    | | Owner Permissions | | | | | Group Permissions | | | World Permissions | |
    | |

    | | 4 | 2 | 1 | 4 | 4 | 2 | 1 | 2 | 4 | 2 | 1 | | Absolute Mode |

    | | 7 | 7 | | | 5 | | | | 4 | | | | |


    ![](img/713f43d93c9396a48fab01efb4b1b069_53_0.png)


    The UNIX operating system stores several attributes for files and directories.
    When you execute the ls -l command within a terminal, it provides a list of all
    the files in the current directory and their associated attributes.


    Three basic permissions can be set: read, write, execute. The read permission
    (r) enables you to view the contents of a file or directory or inherently the
    ability to make a copy of a file to a location where write permissions are set.
    The write permission (w) enables you to modify the contents of a file. The execute
    permission enables you to run that file as a program. A program file can execute
    permissions set and not the read permissions, and users will be able to execute
    the program.


    Three categories of read, write, execute permissions can be set: the file''s owner,
    users belonging to the group listed as group owner of the file, and everyone else.
    The first three permissions set are for the owner of the file. The next three
    are for group owner of the file, and the last three permission settings are for
    everyone else. A dash indicates permission is not set.


    The ls command shows the permissions with the (r) (w) (x) in the display, but
    this is not how the operating system stores the permissions settings for files.
    The UNIX access permissions are stored as bits. In the example the owner has read,
    write, and execute permissions. In binary, this is 111, where the 1s from left
    to right are equivalent to 1, 2, 4, which would equal to 7. Note that each letter
    is a placeholder and the binary number 111 would be the greatest possible number.
    We are simplifying the representation of the permissions down to a three-digit
    octal (base 8). This representation of the permissions is known as the absolute
    mode.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# POSIX Access Control Lists

    Special Permission Bits (l) – Symbolic Mode


    | Directory | r | w | s | r | w | x | s | r | w | x | t |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
    :--- |

    | | read | write | set-UID | read | execute | set-GID | read | execute | sticky
    |

    | | Owner Permissions | Group Permissions | World Permissions | |

    | | 4 | 2 | 1 | 4 | 4 | 2 | 1 | 4 | 2 | 1 | 1 |

    | | 7 | | 7 | | | 5 | | | | |


    ![](img/713f43d93c9396a48fab01efb4b1b069_54_0.png)


    Three additional permission flags can be optionally set on a file: set-UID, set-GID,
    and the sticky bit. Due to a lack of room within the ls command, if a set-UID
    flag is set, the (x) is replaced with the (s) because this is an execute special
    permission. The same happens if the set-GID is set, and if the sticky is set,
    replace the last x with (t).


    Set-UID and set-GID were created by the initial UNIX developers. Some programs
    needed to run with different access than the users'' access level was. For example,
    the password command, enables users to change their passwords, root privileges
    to be able to update the /etc/shadow file.


    The user ID flag, often written as said, allows a program to run as the permissions
    of its owner. Because the password program is owned by root, it can execute with
    this flag set.


    The set Group ID works exactly the way, that it only gives the user who accesses
    the program additional access rights, as if the program needs to be able to spool
    for a print job.


    The sticky bit was developed in the early versions of UNIX when systems were much
    slower. The idea was that any program that had the sticky bit set would stay around
    in the memory of the operating system after the program finished executing. This
    helped programs that were frequently to run faster because with the sticky bit
    set, the program did not need to be reloaded into memory all the time. With today''s
    faster systems and improved use of caching, the sticky bit is no longer needed
    for its original purpose but does have meaning when applied to a directory where
    the owner is the only person who can delete files in that directory.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# POSIX Access Control Lists

    Special Permission Bits (2) – Absolute Mode


    Set-UID | Set-GID | Sticky


    | Directory | r | w | x | r | w | x | r | w | x | t |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
    :--- |

    | | read | write | execute | set-UID | read | write | execute | set-GID | read
    | write | execute | sticky |

    | | Owner Permissions | Group Permissions | World Permissions |

    | | | 4 | 2 | 1 | 4 | 4 | 2 | 1 | 2 | 4 | 2 | 1 | 1 |

    | 7 | | 5 | | 4 |


    A fourth octal digit can be placed in front of the three initial octal digits
    to represent the special permission flag. The leading octal digit, set-UID, is
    the most significant binary digit, and its value is 4. Set-GID is the next bit
    at a value of 2, and the last bit is valued at 1.


    This octal notation completely specifies all the permission bits of a file. This
    is generally referred to as the absolute mode of the file, whereas the use of
    r-w-x notation in the display is considered the symbolic mode of the file. Most
    UNIX commands can handle both modes.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '| Permission Behavior | File | Directory |

    |---|---|--|

    | Read | Read file contents | Directory listing |

    | Write | Modify file contents | Create/remove files |

    | Execute | Execute files | Access files in directory |

    | Set-UID | Executes with privilege of file''s owner | N/A |

    | Set-GID | Executes with privileges of file''s group | Group ownership of files
    is inherited |

    | Sticky | N/A | Only owner may remove files |


    The permission flags have different behaviors depending on whether they are being
    applied to files or directories.


    If the read permission is set on a directory, you can get a directory listing
    of the directory. If the execute permission is set on a directory, the user can
    change directory into the directory in question and execute the files within it,
    but cannot display a directory listing. In general, directories need the execute
    bit set to be of practical use, but it is practical in some cases not to give
    read access to those directories, especially to the group and everyone category
    of permissions.


    The permissions on a directory enable a user to change elements of the directory.
    Being able to modify a directory means being able to rename files within the directory,
    add files to the directory, and delete files from the directory. In Windows, these
    are all separate permissions, whereas in UNIX, they are treated as a single permission.'
  merge: -1
