  md: '# Linux Versus Windows


    +   - It is important to remember that although Windows has a much larger install
    base, Linux is usually installed on the most important, mission-critical systems

    - If you sort by price, the most expensive systems are often UNIX-or Linux-based

    - Most security appliances also run Linux

    - For security analysis, assessment, and penetration testing, many security teams
    use Linux in addition to other operating systems


    ![](img/713f43d93c9396a48fab01efb4b1b069_12_0.png)


    SEC401 | Security Essentials Bootcamp Style 10


    In performing assessments, many clients often say they do not have any Linux systems.
    Students will sometimes make similar statements that Linux is not that important
    because there are fewer systems. In reality, both operating systems are important,
    but Linux is more important than most people realize.


    It is always interesting when walking through a data center to hear someone say,
    "We have no Linux systems." In those cases, it is important to point to their
    firewalls, IDS, and IPS, and start saying, "Linux, Linux, Linux." Many people
    do not realize, but almost all appliances run Linux.


    It is also important to note that although there are fewer Linux systems in place,
    they are often the most critical systems to your enterprise. Most desktops run
    Windows, but the key servers that run Linux cannot be forgotten.


    10 © 2017, Secure Anchor Consulting'
