  md: '# Mac OS Security


    +   * Built-in security features

    * Automatic updates

    * Gatekeeper to protect apps

    * FileVault

    * Privacy controls

    * Strong passwords


    +   * iCloud key chain

    * Sandboxing

    * Runtime protection

    * Antiphishing

    * Download protection

    * iCloud device location


    ![](img/713f43d93c9396a48fab01efb4b1b069_22_0.png)


    Mac OS security has many built-in security features. It is really focused on providing
    a secure computing environment. Although Mac has many security features, they
    must be configured, secured, and maintained. It is important to note that not
    all features are turned on by default and need to be enabled to obtain the benefit
    of the feature.


    The following security features are built into the Mac OS:


    +   * **Built-in security features:** With other operating systems, third-party
    software is downloaded and installed so that you have effective security. With
    Mac OS, many of the features are installed by default or built into the operating
    system. Therefore, someone can obtain a secure environment without having to rely
    on third-party tools.

    * **Automatic updates:** New vulnerabilities are being discovered for operating
    systems, and patches and software updates are regularly released by the vendor.
    It is critical to keep a system up to date with automatic updates because the
    longer a system goes unchallenged, the greater the exposure of compromise.\ **Gatekeeper
    protects:** Adversaries are constantly trying to infect a computer by tricking
    the user into downloading malicious software that infects a computer system. Gatekeeper
    can monitor for malicious activity and help protect the operating system in a
    secure state.

    * **FileVault:** Computers contain sensitive information. If a laptop is stolen,
    the information on it could be exposed to an adversary. On-the-fly encryption
    protects data on a computer, if the system is compromised, the data will still
    be protected from unauthorized access.

    * **Privacy controls:** Computers often contain sensitive personal information
    that is needed to help reduce access to different resources on the Internet. Mac
    OS has controls in place to protect and reduce the chance of privacy being disclosed

    * **Strong passwords:** As networking moves more to the cloud, the main mechanism
    to protect and control access is with password authentication. Weak passwords
    can be easily compromised by an adversary, exposing a significant amount of sensitive
    information. It is critical to enforce strong password controls that make it difficult
    for someone to crack.

    * **iCloud key chain:** It is not uncommon for users to manage passwords and credit
    cards to use their system for e-commerce. iCloud''s key chain will provide a secure
    way for users to manage and organize the sensitive information they need to store
    on their system. It also allows for syncing across various devices.


    20 © 2017, Secure Anchoring Consulting'
