  md: '+   - Sandboxing: It is not uncommon for users to be able to download potential
    untrusted software or existing software on a system may be compromised by an adversary.
    Sandboxing enables applications to run in isolation, protecting the system if
    the software attempts to perform malicious activity.


    +   - Runtime protection: Attackers are getting ever stealthy in how they operate.
    Traditional security measures rely on scanning a file to determine if it was malicious.
    Today, this software would not detect malware, and it can only be detected by
    monitoring the software as it is running.


    +   - Antiphishing: More and more attacks target users via various forms of phishing.
    Essentially, this is social engineering. In this kind of attack, a user receives
    a legitimate-looking email, and after he or she clicks on a link, it would infect
    the system. Being able to identify and minimize phishing attacks is a key component
    of protecting a system.


    +   - Download protection: Although antiphishing will protect against email attacks,
    another form of compromise that needs to be protected against is a web-based attack
    in which users either are tricked into downloading malicious content or it is
    covertly downloaded to their system via drive-by downloading.


    +   - iCloud device location: If a device is lost or stolen, it is important to
    be able to find or locate the device.


