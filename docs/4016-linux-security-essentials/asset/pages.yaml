  md: '# Mac OS


    +   * Second most popular OS

    * Uses BSD as its underlying system

    * POSIX-compliant operating system

    * Built on top of XNU kernel

    * Designed to have security built in

    * Many features cannot be disabled

    * Most network services disabled by default


    ![](img/713f43d93c9396a48fab01efb4b1b069_20_0.png)


    Mac OS is the second most common OS in the market today. Mac OS, when first introduced
    in 2001, was a significant change from its predecessor, introducing many security
    features out of the gate and many more as revisions came out. In addition, with
    the release of Mac OS, Apple moved to using BSD as its underlying operating system.


    Mac OS has an impressive suite of security features; some of the major ones are
    listed here:


    +   * **Password Assistant:** This tool guards the strength of your password as
    you are creating. You select the qualities of the password you want, such as numbers,
    special characters, and so on, and it will color-code your password entered based
    on its strength in comparison to the qualities selected. Password Assistant also
    enables you to set the strength of your password.

    * **File Vault:** This feature enables encryption of the home folder of your user
    and the full disk if you desire. It uses the 256-bit Advanced Encryption Standard
    (AES).

    * **OpenSSH:** This is an open source version of Secure Shell (SSH), which is
    an encrypted remote access solution that replaces telnet, login, and ftp. Many
    SSH clients are available for a variety of operating systems; the Mac OS demonstrates
    its security posture.

    * **Firewall:** A personal firewall is installed, and later versions of Mac OS
    include graphical front ends for the firewall, making it easy to manage.

    * **Sandboxing:** An application such as your browser is a target for compromise
    due to its exposure to the Internet. Sandboxing an app is a great way to protect
    systems by limiting the privileges of the app, increasing the difficulty for malicious
    software to compromise your system.

    * **Encrypted backups:** The Time Machine is a built-in backup solution for Mac
    OS; using it, you can set the backups to be encrypted wherever they are stored.'
