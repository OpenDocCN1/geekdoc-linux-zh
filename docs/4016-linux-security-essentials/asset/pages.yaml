    # utmpdump

    utmpdump /run/utmp


    ```

    root@kalli:~# utmpdump /run/utmp

    Utmp dump of /run/utmp

    [1] (00000) [reboot] [4.6.0-kalli-686] [Wed Oct 19 13:35:33 2016 (CDT)]

    [1] (00053) [utlogin] [4.6.0-kalli-686] [Wed Oct 19 13:35:35 2016 (CDT)]

    [7] (01016) [tty2] [0.0.0] [Wed Oct 19 13:35:46 2016 (CDT)]

    [8] (01700) [ts/1] [pts/1] [:] [192.168.0.14] [Tue Oct 25 23:55:09 2016 (CDT)]

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_134_0.png)


    Utmp and btmp are the two main files; they cannot be read by any text editor or
    text-reading program such as. They must be read with the last, or utmpdump command.


    The command only reads from the utmp file and shows who is logged in right now.
    The last command, however, can read from utmp, wtmp, and btmp. Running the command
    by itself will give you who logged in, when they logged in, and when they logged
    out, other useful info on the screen; and it is historical data. Essentially,
    when you are running last with no arguments, you will see the output of the utmp
    file, and if you pass the last command -switch, you can also tell to read from
    the utmp or the btmp file.


    Utmpdump is a program in which you pass the path of the utmp file you wish to
    dump the data from. Its output is a table with no headers. The columns are from
    left:


    +   - Type of record (ut_type)

    - PID of login process (ut_pid)

    - Terminal name,, or term(5) ID (ut_id)

    - Username (ut user)

    - Device name or tty - "dev/tty" or line

    - Hostname for remote login, or kernel version (ut_host)

    - Internet address of remote host (ut_addr v6)

    - Time entry was made (ut_time or actual ut_tv_sec)


    This information can be obtained through the Linux man pages for utmost.


    You can also run the last command to dump the btmp file to show the failures that
    have occurred.'
