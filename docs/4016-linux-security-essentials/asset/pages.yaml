  md: '# CLI Log Parsing – awk


    awk


    +   * Text processor and scripting language

    * Included in most modern operating systems

    * Syntax awk ''/pattern filter/ { action on matches; additional action; }'' filename

    * Has built-in and custom variables

    * Possible to create functions


    ![](img/713f43d93c9396a48fab01efb4b1b069_168_0.png)


    Now sed is not offering enough filtering capability for the logs you have coming.
    You need something that is more scalable and flexible, something more like a scripting
    language. This is where awk comes in. Awk is a programming language designed for
    text processing and typically used as a data extraction and reporting tool. Aw
    was created at Bell Labs in the 1970s, and its name is derived from the surnames
    of its authors—Alfred Aho, Peter Weiner, and Brian Kernighan.¹¹


    Awk can be used as a full-blown script, and if you need to enter multiple lines
    for your script, Linux will generally tab down to the awk interpreter prompt to
    enable you to finish typing in your multiline script, as we will see in future
    examples.


    The main and most common command you will use within awk is the print command,
    so after the parsing and filtering of the text are complete, it will print the
    completed output to the screen or a file.


    Reference


    +   1. https://en.wikipedia.org/wiki/AWK'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# CLI Log Parsing – awk Examples (1)


    ```

    root@kali:~# awk ''^UUID/ {print $1;;}'' /etc/fstab

    UUID=ef70e08f-6236-4e1d-acbe-7fe7e845a7f1

    UUID=58e69442-0f3b-406a-9dff-8ba04ecc5c4a4

    root@kali:~# awk ''BEGIN { FS="; }\n{ print $1;}'' passwd

    avahi

    sshd

    colord

    saned

    speech-dispatcher

    pulse

    king-phasher

    Debian-gdm

    dradis

    beef-xss

    ```


    Awk enables you to filter the important information you want to see quickly and
    print to the screen for simple viewing. For example, use the awk command to view
    all UUID numbers for mounted devices in fstab, execute awk ''^UUID/ {print $1;}''
    /etc/fstab. In this case, you are telling awk to find the term UUID in the file
    and print only for each line.


    You have filtered /etc/passwd previously with grep and cut, but now you can do
    that using awk with a single command and program. Execute awk ''BEGIN { FS=":";
    } {print $1;}'' passwd. Here, you are telling awk to set its field separator variable
    FS to the colon because passwd is a colon-delimited file and then print the first
    field of each line, which is the username in this case. Because you are using
    variables, you have to specify awk that you are beginning with BEGIN at the start
    of the file and to go through it based on the actions specified. Because this
    example does not have any further commands to run after it finishes parsing the
    file, entering END is implied.'
  merge: -1
