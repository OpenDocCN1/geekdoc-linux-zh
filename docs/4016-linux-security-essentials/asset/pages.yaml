  md: '# User Accounts and Groups


    +   * Usernames and passwords are case sensitive

    * User and group names are for the convenience of humans

    * UNIX systems store ownership information with user IDs and group IDs


    ![](img/713f43d93c9396a48fab01efb4b1b069_63_0.png)


    On UNIX systems, all users have usernames and passwords associated with them.
    These usernames and passwords are case sensitive, so the usernames Userl and User
    are two different users in the UNIX system. To help prevent confusion, it is often
    a best practice standard to configure usernames only with all lowercase characters.


    Every user and group name has a corresponding numeric ID associated with it. The
    user, user ID, and password are stored in the system account database, which is
    usually two files. The /etc/passwd file stores the username, UID, and other various
    information such as path and default group; the /etc/shadow is the password database.


    With UNIX systems, the UID and GID values are important, not the usernames or
    group names. For example, if you delete a user from the UNIX system, any of the
    files created will show the UID value as the owner of the file instead because
    the system can no longer look up a valid username for the UID displayed. This
    is unlike SIDs on Windows; the difference is that SIDs are always unique, whereas
    UIDs and GIDs are not unique and can be the same on different standalone UNIX
    systems. As a result, file sharing between systems is problematic because two
    completely different users with different usernames can have the same UID value,
    which means they can both access each other''s files.'
  merge: -1
  pgno: 63
