  md: '# LDAP Support with OpenLDAP


    +   * LDAP is the Lightweight Directory Access Protocol

    * LDAP is a software protocol used to locate resources (such as files) in a network

    * OpenLDAP is largely focused on solving authentication and authorization problems
    in an organization

    * Centralized user management

    * No GUI

    * Integration with many applications

    * Does not work with Active Directory


    ![](img/713f43d93c9396a48fab01efb4b1b069_75_0.png)


    The Pluggable Account Manager is a great solution for managing one or two UNIX
    systems, but to manage tens or even hundreds of systems, ensuring all the password
    settings are same becomes unwieldy. PAM becomes a less attractive solution in
    this case.


    The OpenLDAP project was started in 1998 by Kurt Zeilang. The project started
    by cloning the LDAP reference source from the University of Michigan, where a
    long-running project had supported development and evolution of the LDAP protocol
    until that project''s final release in 1996. OpenLDAP is largely focused on solving
    authentication and authorization problems in an organization. Management of the
    OpenLDAP solution is through the command line and requires a bit of time to configure
    because it is a feature-rich


    It is a common misconception that OpenLDAP will support integration with Active
    Directory, but that is the case. Active Directory is based on LDAP but has moved
    away from the X.500 standard and is entirely proprietary.


    References


    +   1. https://en.wikipedia.org/wiki/OpenLDAP'
