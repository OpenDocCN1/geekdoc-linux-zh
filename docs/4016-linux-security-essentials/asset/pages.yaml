  md: '# IP Tables


    | Built-in, host-based firewall for Linux |

    | Powerful and customizable |

    | Many free scripts and GUIs available for simplifying configuration and maintenance
    |

    | Stateful firewall with NAT capability |


    +   - Built-in, host-based firewall for Linux

    - Powerful and customizable

    - Many free scripts and GUIs available for simplifying configuration and maintenance

    - Stateful firewall with NAT capability


    ![](img/713f43d93c9396a48fab01efb4b1b069_222_0.png)


    Tools like Firewall Builder can help manage firewalls like IP Tables


    SEC401 | Security Essentials Bootstrap Style 239


    The Linux kernel includes IP Tables, which is a built-in firewall with capabilities
    that are equivalent to modern, commercial firewall products, though IP Tables
    on commercial-off-the-shelf (COTS) hardware may not be able to handle the same
    packet throughput as a specialized firewall platform. In fact, many users use
    a Linux machine running IP Tables instead of a commercial firewall product. All
    you need is Linux running on a hardware with multiple network interface cards
    and somebody understands how to configure IP Tables to enforce the policy you
    want.


    Over the past years, though, sites have been looking at IP Tables as a host-based
    firewall to protect individual systems. Because IP Tables is a complete packet
    inspection system, you can implement more powerful filters than just the simple
    source address filtering provided by TCP Wrappers. The problem is that all powerful
    functionality comes with a lot of complexity. Learning how to use IP Tables filters
    to do what you want requires not only knowing how firewalls are configured but
    also overcoming the sometimes bizarre and confusing IP Tables rule language.


    Just to give you a quick impression of the IP Tables command-line interface for
    building firewall rules, here''s a series of IP Tables commands for creating a
    simple policy that allows incoming SSH traffic on port 22/tcp and allows all outgoing
    TCP, UDP, and ICMP traffic:


    ```

    # Flush any existing rules

    iptables -F


    # Set our default policy to drop all packets

    iptables -P INPUT

    iptables -P OUTPUT

    iptables -P FORWARD DROP

    ```


    220             © 2017, Secure Anchor Consulting'
  merge: -1
