  md: '# Restricting Use of Previous Passwords


    Edit the /etc/pam.d/system-auth file and add/change the following:


    +   - pam_cracklib arguments:

    ```

    "password requisite /lib/security/$ISA/pam_cracklib.so retry=3 minlen=-8 lcredit=-1
    ucredit=-1 dcredit=-1 ocredit=-1 difok=3"

