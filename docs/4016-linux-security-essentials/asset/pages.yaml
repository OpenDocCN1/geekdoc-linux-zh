  md: "# Linux File Permissions Overview\n\n+   * Two general ways to represent permissions\n\
    \  * Symbolic\n  * Absolute\n\n+   * Symbolic uses letters to represent the permission\
    \ such as RWX\n  * Absolute represents the permission as a number\n\n+   * To\
    \ change permission on a Linux system, you would use the\nchmod command\n\nIn\
    \ Linux, the two general ways to represent permissions are symbolic and absolute\
    \ mode. In symbolic mode,\ny use letters to represent the permission. For example,\
    \ R means read access and W write access. To\nrepresent the permissions in a more\
    \ compact manner, you can also use absolute mode. In absolute mode, you\nwould\
    \ use a number to refer to the permissions instead of a letter. For example, 4\
    \ is equivalent to R or read\naccess, and 2 is equivalent to W or write access.\
    \ The actual details of the conversion will be covered on the\next slide.\n\n\
    In Linux, when you want to change the permissions on an object, you would use\
    \ the chmod command to alter\nthe permissions. You can use either symbolic or\
    \ absolute mode with chmod."
