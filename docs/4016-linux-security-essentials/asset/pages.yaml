  md: "# The Superuser\n\n+   - A two-class security model:\n  - Normal users\n  -\
    \ Superusers\n- Superusers control all files, processes, and devices\n- Superuser\
    \ is usually called root\n- Superuser accounts always have a UID of o\n- Multiple\
    \ UID o accounts can exist besides the root account\n- UID o account creation\
    \ or access is any attacker’s\n\n![](img/713f43d93c9396a48fab01efb4b1b069_64_0.png)\n\
    \nThe security model for UNIX has two classes: normal users, who can access their\
    \ own files, and a superuser, who can do anything and everything on the system.\n\
    \nThis all-or-nothing security model has been a security concern for many years,\
    \ and as a result, Linux distributions such as SELinux are being developed and\
    \ maintained to have role-based access controls built into the kernel of the OS.\n\
    \nThe superuser is usually called root but does not be: The UNIX system only really\
    \ cares about UIDs and GIDs, and the superuser UID is o. If the superuser is happyadmin,\
    \ its UID must be 0. The superuser account is equivalent to the administrator\
    \ account in Windows systems.\n\nTo permission issues for users on UNIX systems,\
    \ it is not unusual for users to have their UID set to 0. Setting the UID like\
    \ this may solve the access issues a user was having, but this is a serious issue\
    \ for security and auditing purposes. We have stated why this would be based on\
    \ security, with auditing, the logs will log all events coming from UID 0. Therefore,\
    \ if five users use UID 0, you won't know which user did what.\n\nIt is not unusual\
    \ for UNIX systems to have multiple UID 0 accounts on them; some of them are for\
    \ special applications that need the access to do certain operations. These special\
    \ UID 0 accounts are generally locked out, so no one can use them to interact\
    \ log in. Attackers love the extra UID accounts to gain access, so be sure to\
    \ audit them often to ensure the settings for those accounts have not changed."
  merge: -1
