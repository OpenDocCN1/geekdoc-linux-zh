    NAME


    SYNOPSIS


    top display Linux processes


    top -hvi-bchois -d secs -n max -u user p-pid -o fd [cols]


    DESCRIPTION


    The traditional switches .. and whitespace are optional.

    The program provides a dynamic real-time view of a running kernel as well as list
    of processes displaying information as well as types of system summary shown and
    all user configurable information displayed for processes and configuration ..
    encompassing every aspect of its operation. top is referred to throughout this
    document,

    The program provides a Limited Interactive Interface for process management as
    well as more extensive interface for configuration.


    More

