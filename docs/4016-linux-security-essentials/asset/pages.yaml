    One of the common questions people ask is, “What operating system is best for
    security?” When you are asked that question, the answer should be YES. If you
    work in security, you must be proficient in many operating systems, including
    Windows and Linux. This is the point where the virtual machines for the labs come
    in handy when you leave class: because you have a working version of both Windows
    and Linux in isolated virtual machines, you can experiment and work in both environments.


    Windows is good because many organizations run it in their environment, so know
    how it works is important. However, many tools only run in Linux. Therefore, having
    familiarity with Linux is also critical. In addition, many critical servers running
    variants of Linux and need to be secured.


    Because some tools are only available for Linux, it is important to mention that
    Microsoft has developed the Windows subsystem for Linux (WSL). These are components
    that enable Linux binaries to run on Windows. You can find additional information
    at https://blogs.msdn.microsoft.com/wsl/2016/04/22/windows-subsystem-for-linux-overview/'
