  md: '# Operating System Overview


    The memory-resident part of an operating system that directly interfaces with
    the hardware is called the kernel


    ![](img/713f43d93c9396a48fab01efb4b1b069_39_0.png)


    Any operating system overview begins with a 50,000-foot view of the key elements.
    The three key elements of Linux are


    +   - Kernel: The core component of the operating system that is often referred
    to as the “brains” of the operating system

    - Shell: The portion of the operating system with which users and the process
    interact directly

    - Hardware: A collection of physical components such as the actual CPU and memory
    chips


    This description sounds minuscule, but understanding how these components interact
    with each other enables you to understand where the levels of protection efforts
    can be directed. For example, say you want to prevent an elevation of privileges
    action. You can focus your protection efforts towards the interaction between
    the shell and the kernel, keeping a process or user within its respective realm
    of operation.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Kernel


    The kernel manages the hardware and the executing processes

    Kernel services include


    +   - File system

    - Low-level network protocol support (for example, IP)

    - Memory and process management


    ![](img/713f43d93c9396a48fab01efb4b1b069_40_0.png)


    The kernel is the most important part of the Linux operating system, or any operating
    system for that matter. Without the kernel, operating systems do not function.
    The kernel is responsible for order, instructions to all (both hardware and software),
    and complete interaction of all system elements. Destroy the kernel and the system
    becomes useless. Destroy a user or application and only limited functions are
    affected, yet the rest of the operating system functions.


    The kernel of any operating system is generally loaded into memory at boot up.
    This allows faster interaction between all components, and yet it must have a
    dedicated space in memory to reside without shifting.'
  merge: -1
