  md: '# Linux-VServer


    +   * Provides virtualization capability to Linux

    * Utilizes kernel-level isolation

    * Can run multiple virtualized environments simultaneously

    * Provides security controls to properly isolate each virtual machine

    * Uses segmented routing, chroot, extended quotas, and some other standard tools


    Virtualization is a key aspect of both running a data center and utilizing a security
    lab. Virtualization allows for more scalable use of hardware in a data center.
    Because most servers are underutilized, virtualization allows for more cost-effective
    use of the servers that have already been purchased. In addition, virtualization
    is also really important for setting up a virtual lab. As you have seen in this
    class, virtualization is a great way to experiment and learn new tools.


    Linux-VServer (vserver) is an open source software that allows for virtualization
    on a Linux system. Vserver allows the Linux system to run multiple guest operating
    systems. In addition, vserver uses security controls to properly isolate each
    virtual machine. Escaping out of a guest machine is always a concern when using
    virtual machine technology. Vserver helps minimize the risk and accomplishes this
    security using segmented routing, chroot, extended quotas, and some other standard
    tools.'
