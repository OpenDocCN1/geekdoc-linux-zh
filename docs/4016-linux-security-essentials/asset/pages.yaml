    ![](img/713f43d93c9396a48fab01efb4b1b069_85_0.png)


    This slide shows the architecture for systemd and how all the components work
    together. Remember that the goal of systemd is to provide a unified way to manage
    Linux services across different distributions. To accomplish this goal, systemd
    implements three core functions.


    First, systemd provides an integrated method for managing both systems and services.
    A close relationship exists between systems and services. The services that are
    running ultimately comprise the overall system and directly impact the functionality,
    stability, and security of the system. Therefore, it is critical to have an integrated
    way to manage the system at a high level and all the integrated services at a
    more detailed level. Although our focus for this module is simple, you must remember
    that being able to manage the stability of a system is very important.


    Second, systemd provides a software platform for managing, maintaining, and creating
    software. You can use this platform not only to change the existing services but
    also to create and develop new services.


    Third, systemd provides an interface between the applications and the kernel.
    This interface is dangerous because the kernel is the base of the OS and, if compromised,
    can cause a significant negative impact on the system. Therefore, you are encouraged
    to limit or control interaction with the kernel. However, the kernel needs to
    be accessible to applications, so limiting access could negatively affect the
    applications and make things more difficult for developers. Systemd provides various
    ways to allow applications access to the kernel in a more secure and controlled
    manner.


    Remember that systemd not only includes the it daemon but also an entire suite
    of software that is all bundled together to manage and control services on a system.
    This bundle includes the systemd it daemon, journal, logind, and networkd, and
    many other low-level components.


    # Reference


    +   1. https://en.wikipedia.org/wiki/Systemd'
