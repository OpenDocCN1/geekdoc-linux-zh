  md: '# Android Versus IOS


    | Android | iOS |

    | --- | --- |

    | - Open standard with the ability for modifications and changes to be made |
    - Closed software that cannot be modified or changed by third parties |

    | - Less locked down and more configurable | - Locked down with fewer options
    to configure |

    | - Recently more focused on security and integrated features | Always had integrated
    security and focused on security


    ![](img/713f43d93c9396a48fab01efb4b1b069_28_0.png)


    SEC-401 | Security Essentials Bootstrap Style 2-4


    The most important difference to understand when looking at Android versus iOS
    is an open versus closed operating system. Because Android is open, there are
    lots of variants and lots of changes. iOS is closed and cannot be changed or modified.


    The big benefit of an open standard is that it allows for changes to be made to
    add new functionality and enhance the user experience. However, this opens the
    door for malicious content to be embedded into the device. Over the years, there
    has been a larger number of attacks and malicious content embedded in Android
    devices.


    This discussion is interesting because two arguments can be made. We can argue
    that because Android is approximately two-thirds of the market it will draw more
    focus. The other argument is that Apple''s closed ecosystem, which verifies all
    aspects of the boot cycle, is much harder to compromise.'
