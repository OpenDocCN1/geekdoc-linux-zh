  md: '# IP Tables: Setting Up a Service Network—Network-Based Firewall


    ```

    iptables -A FORWARD ... -j ACCEPT around each:

    -m state --state ESTABLISHED,RELATED

    -d web -p tcp --dport 80

    -d web -p tcp --dport 443

    -d mail -p tcp --dport 25

    -s mail -p tcp --dport 25

    -d dns -p udp --dport 53

    -d dns -p tcp --dport 53

    -s dns -p udp --dport 53

    -s admin -d 10.2.30.0/24 -p tcp --dport 22

    iptables -A FORWARD -j DROP

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_225_0.png)


    SANS SEC401 | Security Essentials Bootcamp Style 221


    A sample set of firewall rules for setting up a service network. This network
    has a web server, DNS server, and a mail server, each with its own line in the
    firewall''s /etc/hosts file (such as 192.168.1.7 web).


    In IP Tables, the ESTABLISHED matches packets that are part of an existing conversation—the
    second, third, and any additional packets in a TCP or UDP conversation. RELATED
    packets are those that have a connection to an existing conversation; include
    FTP data channels and ICMP error messages, for example. You can allow these first
    because one rule matches the vast majority of the traffic in the firewall. Placing
    it makes the firewall much more efficient.


    For the rest of the well, you get to focus on the initial packet of a connection.
    Both --dport 80 and --dport 443 HTTP and HTTPS traffic in to to the web server.
    For the mail server, you need to let SMTP mail both in and out, so you have rules
    for SMTP to (-d mail) and from -s mail server. DNS also needs rules for traffic
    to both and from the machine DNS. Because DNS traffic is carried on both TCP and
    UDP, you need to set up four rules.


    You manage the systems over SSH, so you you allow SSH traffic (--dport 22) from
    a single machine called admin to the entire subnet, 10.2.30.0/24. Finally, you
    block any other traffic.


    This isn''t a complete firewall, but it demonstrates the standard parts of setting
    up the service network.


    © 2017, Secure Anchor Consulting 223'
  merge: -1
