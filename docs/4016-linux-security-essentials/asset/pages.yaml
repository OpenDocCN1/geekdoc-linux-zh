  md: '# Samhain Overview


    | Samhain is a host-based intrusion detection system (HIDS) | FEATURES |

    | Contains various features to both prevent and detect host-based attacks | File
    integrity checking |

    | Can monitor multiple operating systems | Detection of rogue executables |

    | Open-source multiplatform application | Rootkit detection |

    | | Port monitoring Log file analysis and correlation


    ![](img/713f43d93c9396a48fab01efb4b1b069_217_0.png)


    SEC401 | Security Essentials Bootcamp Style 215


    Samhain is an application that can be installed on Linux; it provides many features
    and capabilities to defend a host system from attack. The goal is to provide more
    visibility into what is happening on a host system to prevent and detect attacks
    in a timely manner. It is an open source application that is meant to be run on
    multiple operating systems.


    The main feature of Samhain covered in this section is its capability to perform
    file integrity checking. It can store the cryptographic hashes of key files and
    be able to identify changes in files. In addition, it can also look for rogue
    executables that the SUID bit set.


    One of the other nice features is its capability to centrally monitor logs. One
    of the challenges with host-based protection is that it is often not scalable
    because each host has to be managed separately. Samhain can correlate logs from
    multiple sources and look for patterns of attack.


    In addition to all of these great features, Samhain can also do rootkit detection
    and port monitoring.'
