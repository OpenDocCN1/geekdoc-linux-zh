  md: "# CLI Log Parsing – cut\n\n# Cut\n\n+   - Syntax: cut <option>\n- Only use\
    \ one of the switches (-b, -c, or -f)\n- If no file is specified, cut reads from\
    \ standard input\n- Takes the output of grep as input through the use of pipe\
    \ |\n\n+   - -b or --bytes\n- -c or --characters\n-d or -- delimiter\n- -f or\
    \ --fields\n-s or --only-delimited\n\n![](img/713f43d93c9396a48fab01efb4b1b069_158_0.png)\n\
    \nSANS\n\nSEC401 | Security Essentials Bootcamp Style \x154\n\nSay you have found\
    \ the data you are looking for with grep. The only problem is grep returns the\
    \ whole line where the patterns match, but you don't want the whole line; you\
    \ just want a portion of the line shown because you want to find the unique values\
    \ that are in the results for each line into another program. This is where cut\
    \ comes in. Cut takes specified sections within a line of a file or files.\n\n\
    When invoking cut, use the -b, -c, or -f option, only one of them. If no filename\
    \ is specified, cut reads from the standard input. For example, cut will accept\
    \ the output of grep as input using pipe character (|). Cut gives most administrators\
    \ what they need to filter logs without much skill needed.\n\n+   - The -b switch\
    \ selects only the bytes from each line as specified in list. The list specifies\
    \ a byte, a set of bytes, or a range of bytes.\n- -c switch selects only the characters\
    \ from each line as specified in list. The list specifies a character, a set of\
    \ characters, or a range of characters.\n- -d switch specifies another character\
    \ than tab to the delimiter when telling cut to look at column fields\n- -f switch\
    \ selects only these fields on each line and prints any line that contains no\
    \ delimiter character unless the -s option is specified. The list specifies a\
    \ field, a set of fields, or a range of fields.\nThe -s switch tells cut not to\
    \ print lines not containing delimiters.\n\n156\n© 2017, Secure Anchor Consulting"
  merge: -1
  pgno: 158
- img_proc: true
  md: '# CLI Log Parsing – cut Examples


    +   Cut examples

    ```bash

    real# cat data.txt

    one two three four five

    green blue orange red purple

    real cut -f 3 data.txt

    three

    orange

    two three four

    blue orange red

    real cut -f 2-4 data.txt

    cut -f 1-2,4-5 data.txt

    one two four five

    green blue purple

    real cut -f 3 data.txt

    three

    orange red purple

    real -c 3-12 data.txt

    e two three

    een blue

    real cut -b 3-12 data.txt

    two three

    een blue

    real - |

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_159_0.png)


    In this example, a data is specified as data.txt, which has five columns of data.
    Now you want to see anything in the third field/column. In this case, you would
    execute cut -f 3 data.txt to display only the third field or column of data.


    Now, if you want to tell cut to show a range of fields, such as fields 2 through
    4. Now you would execute cut -f 2-4 data.txt, causing cut to only display fields
    2 through 4.


    Although this data set has five fields, you want to show all fields but the first
    one. To do so, you would execute cut -f 1-2,4-5 data.txt, telling cut to display
    fields 1, 2, 4, and 5 only.


    In some situations, you don''t know how many fields are there, or if they change
    line by line, but you know you want to see all fields after and including the
    third field. In this case, you would execute cut -f 3- data.txt to see all fields
    including and after the third field.


    Now you want to list by the character placement and not the field. You want to
    see only characters 3 through 12 printed for each line. To do that, you would
    execute cut -c 3-12 data.txt. Remember that the space in each word is actually
    a tab character, so both lines of output display characters—eight alphanumeric
    characters and two tab characters.


    Now you want to count the bytes instead of characters, which is useful for nonalphanumeric
    filtering. You want to see only the results of bytes 3 through 12. You would execute
    cut-b 3-12 data.txt in this case. You will notice the results, in this case, are
    the same because because you are working with alphanumeric characters already,
    so each byte here represents an alphanumeric character or a tab.


    © 2017, Secure Anchor Consulting 157'
