  md: '# Apple iOS Security Features (I)


    +   - **System security**: Both hardware and security features that support the
    architecture and applications that run on the system

    - **Encryption and data protection**: Protect critical data if the device is stolen
    or unauthorized access is attempted, protecting data at rest

    - **Network security**: Complements data protection and provides security for
    data in transit

    - **Application security**: Creates a platform to enable third-party applications
    to run in a secure environment


    Apple has many security features and provides detailed documentation on all the
    core components and how they work. Here, we look at the core categories of the
    security features that are in iOS.


    +   - **System security**: Both hardware and software features that support the
    architecture and applications that run on the system. For a system to be secure,
    it is critical to ensure that the system boots in a secure manner. If an adversary
    could inject malicious code when the system boots or modify the iOS with malicious
    activity, the system will not be in a secure state. Therefore, it is critical
    to verify all system components and make sure they have not been altered.

    - **Encryption and data protection**: Protect critical data if the device is stolen
    or unauthorized access is attempted. Apple devices often contain sensitive data,
    and it is critical that the information is protected from unauthorized access.
    This component focuses on securing data at rest. A key aspect of data protection
    is encryption. Although encryption is very effective, it is effective only if
    the keys are properly protected.

    - **Network security**: Complements data protection and provides security for
    data in transit. The capability to remotely communicate over networks, including
    the Internet, is a key feature that is of the user experience. Because mobile
    devices communicate over wireless networks, it is critical that information leaving
    the device is properly protected.

    - **Application security**: Creates a platform to enable third-party applications
    to run in a secure environment. Apple has an ecosystem for development of applications,
    but it is still critical to make sure that an application cannot negatively impact
    the environment. When applications run, it is important to make sure that it cannot
    negatively impact other applications or cause harm to the iOS.'
  merge: -1
