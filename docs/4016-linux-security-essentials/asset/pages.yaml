  md: '# # Firewalld


    ![](img/713f43d93c9396a48fab01efb4b1b069_226_0.png)


    +   * Dynamically managed firewall

    * Supports zones trust level for each interface

    * Changes can be made in the runtime environment

    * Firewalld D-Bus allows applications to adapt firewall settings


    That firewall is enabled.


    Another option for firewalls in Linux is Firewalld. a dynamically managed firewall
    that supports zones to define the different trust levels for each of the interfaces.
    In addition to specifying the interface, custom rulesets can also be developed
    for each interface and outbound traffic.


    To allow applications, services, and users to adapt the firewall settings, firewalls
    use the D-Bus interface. This interface is also used for firewall configuration
    tools such as firewall-cmd, firewallctl, firewall-config, and firewall-applet.


    Firewalld is used as the default firewall management tool in the Linux distributions:
    RHEL 7, CentOS 7, Fedora 18 and is also available for several other distributions.


    # References


    +   1. Linux Firewall (iptables, system-config-firewall), https://oracle-base.com/articles/linux-firewall

    2. Firewalld, https://fedoraproject.org/wiki/Firewalld

    3. Firewalld, http://www.firewalld.org/

    4. Fedora Documentation, https://docs.fedoraproject.org/en-US/Fedora/11/html/Security_Guide/Security_Guide-Firewalls-Basic_Firewalld_Configuration.html'
