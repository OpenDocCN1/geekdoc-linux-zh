  md: '# Linux Unified Key Setup


    +   - LUKS is the standard for Linux hard disk encryption

    - Compatibility via standardization

    - Secure against low entropy attacks

    - Support for multiple keys

    - Effective passphrase revocation

    - Free


    ![](img/713f43d93c9396a48fab01efb4b1b069_48_0.png)


    ![](img/713f43d93c9396a48fab01efb4b1b069_48_1.png)


    LUKS is the standard for Linux hard disk encryption.¹ By providing a on-disk format,
    it not only facilitates compatibility among distributions but also provides secure
    management of multiple user passwords. In contrast to existing solutions, LUKS
    stores all necessary setup information in the partition header, enabling the user
    to transport or migrate data seamlessly.


    Although most disk encryption software implements different and incompatible,
    undocumented formats, LUKS specifies a platform-independent standard on-disk format
    for use in various tools. This not only facilitates compatibility and interoperability
    among different programs, but also assures that they all implement password management
    in a secure and documented manner.³


    Cryptsetup is the utility to conveniently set up disk encryption based on the
    DMCrypt kernel module. These include plain dm-crypt volumes, LUKS volumes, loop-AES,
    and TrueCrypt format.⁴


    +   References

    1. https://en.wikipedia.org/wiki/Linux_Unified_Key_Setup

    2. https://guardianproject.info/code/luks/

    3. https://gitlab.com/cryptsetup/cryptsetup'
  merge: -1
