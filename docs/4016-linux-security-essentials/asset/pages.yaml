  md: '# Closing Down Unneeded Ports


    You can control and close down unneeded ports in several ways:


    ```

    /etc/inetd.conf

    Comment out lines with # where the service is listed

    ```


    ```

    /etc/xinetd.d

    Locate the service file name; set disable option to yes in file

    ```


    ```

    /etc/rc.conf

    Comment out lines or change the value from YES to NO

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_96_0.png)


    You can control and close down unneeded ports in many ways. However, that changes
    will not take effect until you restart the daemon.


    inetd


    If a service is managed by inetd, you can close the port by finding the line in
    the /etc/inetd.conf file for the service and comment it out by adding # to the
    beginning of the line.


    xinetd


    Because xinetd is the single point of entry for a large number of network services,
    it could provide access control and logging functionality. This task was traditionally
    handled using add-on services such as twpprapers. However, in addition of add-on
    services, xinetd was created as a replacement for inetd. Aside from that functionality,
    it also has embedded security features, so add-on software is no longer required.


    When you use xinetd, unlike inetd, you cannot close a down port by commenting
    out a line in the configuration file. The xinetd server contains /etc/xinetd.d
    directory, which contains files that are related to different services it manages.
    You must modify each file individually to deactivate the appropriate service.


    Rc.d


    Not all services are managed by either inetd or xinetd. If the system does not
    use an Internet server server, or the server process is activated at startup,
    these are managed by rc so that they can operate independently.


    Reference


    +   1. "Close unneeded ports on Unix/Linux systems", http://www.techpublic.com/blog/it-security/close-unneeded-ports-on-unix-linux-systems/'
  merge: -1
