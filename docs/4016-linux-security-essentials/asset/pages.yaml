  md: '# Classic init


    | Bootloader | System initialization | System operation |

    | --- | --- | --- |

    | head.o (bootstrap code) | | |

    | start_kernel | kernel_init | cpu_idle (idle loop) |

    | rest_init | init_post | init process |


    +   - Also known as System-V style init

    - init was the original boot time service starter

    - Follows a linear process

    - Unable to detect and handle sudden changes to the system

    - Tracks services only during boot or shutdown

    - Uses runlevels


    ![](img/713f43d93c9396a48fab01efb4b1b069_80_0.png)


    When a UNIX system is powered on and the kernel is fully running, it is the first
    process to start. It is responsible for the setup of the entire user environment.
    The init process starts as a process PID; it checks and mounts files systems and
    starts necessary services. Init is the parent process to all other processes and
    adopted orphaned processes in the user space.


    Init was created at a time when parallel processing and changes to a running system
    did not exist, but now they are commonplace. Init starts the service scripts in
    a linear fashion. This means the service time is directly affected by how many
    services there are and Modern environments have systems that can change while
    the system is running. Init does not know about changes made to the system while
    it is running. As a result, the system''s capability to utilize additional memory,
    CPU, or disk capacity will be ignored and unused until the system is rebooted.


    Init deals with services only during startup and shutdown.


    All init-based systems use runlevels, which tell services how a process will start
    as the init process starts.


    The various runlevels with init as follows:


    +   - Runlevel 0 means shuts down the systems.

    - Runlevel 1 means single-user mode.

    - Runlevel 2 means multiuser mode.

    - Runlevel 3 means multiuser mode with networking.

    - Runlevel 5 means starting the system with appropriate display manager and graphics.

    - Runlevel 6 means system reboot.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# Upstart


    +   * Classic init was too rigid a solution and lacked important  features that
    system administrators needed

    * Several solutions were developed

    * One solution is upstart

    * Upstart supports parallel booting of services

    * It supports live system changes

    * It monitors the status of a service

    * It is an optional add-on


    ![](img/713f43d93c9396a48fab01efb4b1b069_81_0.png)


    Most users familiar with Linux know and appreciate the init startup process. Unfortunately,
    it is not a very dynamic solution for starting systems and jobs. In modern environments
    that run Linux systems, the stiffer requirements keep systems and associated services
    more consistently without interruption. Because of the need for better uptime
    and availability of services, users began to develop feature-rich startup solutions.
    One such solution is Upstart.


    Upstart introduces new concepts that are not available in init. These include
    jobs, events, and emitting events. Jobs are processes that maintain system activity
    that need to occur continuously. For example, if you need a service to run or
    be available all the time, a job would run on the system. Jobs use events to allow
    and cause activity on the system. For example, say you need a service to run at
    a specific time. In that case, you would run a job, and an event for the time
    of day would trigger the job.


    As noted, jobs can send or cause events to trigger other jobs. This process, called
    emitting, is ideal for when you are creating a chained process of events in which
    one depends on another before the second can start.


    Upstart supports the following actions:


    +   * Waiting: Indicates the initial state of process

    * Starting: Indicates the place where a job is about to start

    * pre-start: Specifies the place where the pre-start section is loaded

    * spawned: Indicates the place where a start script is about to run

    * post-start: Specifies the place where post-start operations take place

    * running: Indicates the place where the job is fully operational

    * pre-stop: Indicates the place where pre-stop operations take place

    * stopping: Specifies the place where the job is being stopped

    * killed: Indicates the place where the job is stopped

    * post-stop: Indicates the place where post-stop operations take place; to clean
    up


    Reference

    1. Digital Ocean, "The Upstart Event System: What It Is and How to Use It,"

    https://www.digitalocean.com/community/tutorials/the-upstart-event-system-what-it-is-and-how-to-use-it,


    © 2017, Secure Anchor Consulting'
  merge: -1
