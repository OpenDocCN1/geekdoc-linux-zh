    ![](img/713f43d93c9396a48fab01efb4b1b069_44_0.png)


    Administrators can display the currently mounted partitions with the df command.
    df stands for disk free because the command was actually created to help administrators
    find partitions that were running out of disk space.


    The first column shows the disk device associated with the partition, and the
    amount of free space used, and the amount of free space available is not equal
    to the total size in Kilobyte chunks. The shows the piece of the logical file
    system to which the partition corresponds.


    The middle columns in the df output show the total size of the partition, the
    amount of disk space used, and the amount of free space available. Note that the
    bytes used plus the bytes available amount is typically reserve 5% to 10% of the
    total file size for space. When a partition gets to 90%, no user except is allowed
    to write data into the file system. Note that the capacity figure in the second-to-last
    column of the df output takes into account this reserved space. Thus, df shows
    100% full when the partition is actually 90% to 95% full.


    Note that df shows only currently mounted file systems. Typically, the machine
    has a partition devoted to "swap space" for the virtual memory system. This is
    a "raw disk" partition that is not mounted into the logical UNIX file system.
    However, this swap partition has an entry in the /etc/fstab file. Information
    about swap partitions currently in use can also be obtained using the swap -s
    command.'
