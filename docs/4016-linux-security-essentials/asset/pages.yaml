  md: '# Cron


    +   * Scheduling action daemon

    * Starts an action (in the background) at preset time

    * Can also be employed by users

    * Uses crontab file to store the jobs that are going to run

    * Cron daemon (crond) works in total sync with the system clock


    ![](img/713f43d93c9396a48fab01efb4b1b069_86_0.png)


    In addition to the methods discussed, you can also schedule services to start
    at set intervals using cron.


    The cron daemon (crond) works in total sync with the system clock. Every minute
    crond makes its way through the /etc/crontab file to see if there is a task for
    it to perform at a scheduled time. An entry in this file consists of specific
    or recurring time, the user that the system should execute the task as, and the
    command itself or path to a script. Note that any task cron execution is performed
    in the background. Here''s an example of an entry in a crontab file:


    2 5 6 *** /usr/bin/apt-get update


    The first five fields in this line represent the minute, hour, day of month, month,
    and day of week that the command should be executed. The format for this time
    is explained in the man (manual) page for crontab:¹


    | field | allowed values |

    | --- | --- |

    | minute | 0-59 |

    | hour | 0-23 |

    | day of month | 1-31 |

    | month | 1-12 (or names, see below) |

    | day of week | 0-7 (or 7 is Sun, or use names) |


    A field may be an asterisk (*), which always stands for first-last.


    In this example, the command should be executed at 25 minutes past 6:00 a.m. every
    day of the month; the asterisk (*) is a wildcard. The system will start this command
    as the user root; it is meant for a Debian-based system because it is the command
    to update the APT repository contents for the local system.'
