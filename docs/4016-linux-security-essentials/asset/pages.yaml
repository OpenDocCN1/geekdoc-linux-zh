  md: '# Log files of interest


    +   * utmp: Gives a complete picture of users'' logins at which terminals, logouts,
    system events, current status of the system, system boot time

    * wtmp: Provides historical data of utmp

    * btmp: Records only failed login attempts

    * dmesg: Is a display or driver message

    * messages: Contains global system messages

    * maillog: Contains the messages from mail server

    * secure: Contains all security-related messages on the system


    ![](img/713f43d93c9396a48fab01efb4b1b069_133_0.png)


    UNIX systems use multiple key log files, several of which cannot be viewed by
    using any kind of text parsing directly and must be used with their own specific
    log-viewing utility.


    +   * utmp: Gives a complete picture of users'' logins at which terminals, logouts,
    system events, current status of the system, and system boot time.

    * wtmp: Gives historical data of utmp.

    * btmp: Records only failed login attempts.

    * dmesg: Is a display or driver message. It is used to examine or control the
    kernel ring buffer.

    * messages: Contains global system messages, including the messages that are logged
    during system startup. Several things are logged in /var/log/messages, including
    mail, cron, daemon, kernel, and auth.

    * maillog: Contains the messages from the mail server running on the system, such
    as email.

    * secure: Contains all security-related messages on the system. This includes
    authentication failures, possible break-in attempts, SSH logins, failed ssh logouts,
    and invalid user accounts.'
  merge: -1
