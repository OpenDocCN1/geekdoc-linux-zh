  md: "# Look Out:World-Writable Directories\n\n+   - World-writable directories,\
    \ such as /tmp, are used by programs to hold intermediate results\n- What if an\
    \ attacker clobbers your program's temporary file and substitutes it for his own\n\
    - Golden rules:\n  - Avoid world-writable directories if possible\n  - Always\
    \ set the sticky bit for world-writable directories\n\nLinux systems typically\
    \ have a number of directories that are world-writable, meaning that write permissions\
    \ are enabled for the everybody else. In fact, world-writable directories are\
    \ generally configured so that all permissions (read, write, execute) are turned\
    \ on for all three ownership categories. This means that nobody on the system\
    \ can create, rename, and delete files at these directories. Examples of such\
    \ directories would be the standard UNIX /tmp and /var/tmp directories, where\
    \ programs are supposed to write \"scratch\" data and more.\n\nHistorically, world-writable\
    \ directories have caused enormous security problems. A simple example is the\
    \ UNIX C compiler to create programs from source. This compiler usually makes\
    \ several \"passes,\" in which the source code is transformed from one form to\
    \ another before being turned into an executable. The results from each compiler\
    \ \"pass\" are put into temporary files in /tmp. Now, an attacker quickly substituting\
    \ file containing malicious code for one of the files created during a compiler\
    \ pass —suddenly, there is a virus or Trojan horse in the program!\n\nIt is extremely\
    \ important to ensure that the sticky bit is set on all world-writable directories,\
    \ as it is the default for system directories, such as /tmp and /var/tmp. With\
    \ the sticky bit, our attacker would not be able to delete or rename a user's\
    \ intermediate files to substitute the attacker's Trojan code.\n\nThese days,\
    \ many programs simply avoid directories like /tmp altogether and instead are\
    \ to use their own private temporary directories to which normal users on the\
    \ system do not have write permissions. For example, the Sendmail email server\
    \ writes temporary data containing messages that are currently being processed\
    \ into a private directory called /var/spool/inqueue which is accessible only\
    \ by the root user."
  merge: -1
  pgno: 57
- img_proc: true
  md: "# Look Out: SUID/SGID Programs\n\n+   * Double-edged sword\n  * You can't run\
    \ UNIX without SUID/SGID programs\n  * However, rogue SUID/SGID programs can easily\
    \ compromise a machine\n\n+   * Keep track of the SUID/SGID programs provided\
    \ with your operating system\n\n+   * Raise an alarm if new or unexpected SUID/SGID\
    \ programs appear\n\nSet-UID and set-GID programs historically have been among\
    \ the most common weaknesses that attackers have exploited to get privileged access\
    \ on UNIX systems. For example, an attacker may be able to bring a set-UID root\
    \ copy of the UNIX command shell onto the system on a CD-ROM or USB drive. When\
    \ the user executes this shell, he she instantly gets privileges without providing\
    \ a password. Set-UID programs with buffer overflows or other coding errors may\
    \ allow attackers to \"escape\" from the running program and get an interactive\
    \ shell.\n\nIt may be a good idea to make a list of all the set-UID and set-GID\
    \ programs on the system when the machine is installed for the first time. Then,\
    \ periodically scan the system for set-UID and set-GID programs and compare the\
    \ results against the original list. If \"new\" set-UID or set-GID programs appear,\
    \ be as suspicious.\n\nOf course, all of this begs the question, \"How can administrators\
    \ scan their file systems for set-UID and set-GID files in the first place?\"\
    \ It would also be nice to locate world-writable directories to confirm their\
    \ sticky bit is set."
