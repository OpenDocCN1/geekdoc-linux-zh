  md: '# Containers Versus Virtual Machines ( 2of 2)


    | APP 1 | APP 2 | APP 3 |

    | --- | --- | --- |

    | BINS/LIBS | BINS/LIBS | BINS/LIBS |

    | GUEST OS | GUEST OS | GUEST OS |

    | | | DOCKER ENGINE |

    | | HYPERVISOR | HOST OPERATING SYSTEM |

    | | HOST OPERATING SYSTEM | |

    | | INFRASTRUCTURE | INFRASTRUCTURE |


    SANS


    SEC401 | Security Essentials Bootcamp Style 244


    These diagrams provide a great reference to show the difference between containers
    and virtual machines. The first important difference is that virtual machines
    perform isolation at an OS level, and containers perform isolation at an application
    level. Also because an entire operating system is large, virtual machines are
    bigger and not as compact as containers.


    The big difference with containers is that each container shares the same kernel.
    The applications run as isolated processes, they run on a single host operating
    system. Virtual machines each have different guest operating systems that run
    on one single host operating system. With containers, each application is running
    on a single host operating system. One other big difference with virtual machines
    is that each application in each guest uses a different separate kernel. With
    containers, all the applications share the same kernel.


    +   Reference

    1. Docker, https://www.docker.com/what-docker


    244 2017, Secure Anchor Consulting'
