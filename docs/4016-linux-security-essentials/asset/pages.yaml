  md: "# Logrotate\n\n+   /etc/logrotate.conf\nDirectives:\n- include\n  - daily,\
    \ weekly, monthly, size\n  - missingok\n- rotate <n>\n- create <perms> <owner>\n\
    \  <group>\n\n+   Closing and reopening the logfile\n- postrotate ... endscript\n\
    - sharedscripts\n\n+   Remove\n/etc/cron.daily/syslogd\nAdditional directives\
    \ for compression and emailing files\n\n![](img/713f43d93c9396a48fab01efb4b1b069_149_0.png)\n\
    \nLogrotate is configured in the path named /etc/logrotate.conf. Logrotate.conf\
    \ starts with some global options. These options are used as defaults for later\
    \ entries. Order counts in logrotate.conf. The later definitions overwrite the\
    \ earlier definitions. This means that, if you like, you can set global values,\
    \ follow them with the entries you wish to apply to, and then set new values,\
    \ followed by more file entries. However, keep in mind that the more complicated\
    \ your file, the easier it is to make mistakes. Logrotate has an include directive\
    \ that lets you have your configuration commands in multiple files and read them\
    \ in. This can be used to reduce complexity. You can name a directory to be read\
    \ in and all files are read in alphabetical order. Linux packages expect to be\
    \ able to include logrotate configuration files in the directory /etc/logrotate.d,\
    \ so that logrotate is usually included after the global options. Entries for\
    \ logrotise to rotate the filename (or names), followed by any file-specific directives\
    \ in curly braces {. So that you can get an example of how this looks, the default\
    \ /etc/logrotate.conf is included here. In addition to the items mentioned here,\
    \ it includes entries to rotate two non-sys, non-package logs /var/log/wtmp and\
    \ /var/log/bmp.\n\n```\n# see \"logrotate\" for details\n# rotate log files weekly\n\
    weekly\n```\n\n```\n# keep 4 rotations of backlogs\nrotate 4\n```\n\n```\n# create\
    \ new (empty) log files after rotating old ones\ncreate\n```\n\n```\n# uncomment\
    \ if you want your log files compressed\n#compress\n```"
  merge: -1
