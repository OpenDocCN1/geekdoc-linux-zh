- img_proc: true
  md: "```\n# Don't interfere with loopback traffic\niptables -A INPUT -lo -j ACCEPT\n\
    iptables -A OUTPUT -lo -j ACCEPT\n\n# Inbound Rules: Allow SSH (22/tcp) and packets\
    \ from\n# sessions that we have initiated from this system\niptables -A INPUT\
    \ -p tcp --dport 22 -j ACCEPT\niptables -A INPUT -p tcp -m state \\\n  --state\
    \ ESTABLISHED -j ACCEPT\niptables -A INPUT -p udp -m state \\\n  --state ESTABLISHED\
    \ -j ACCEPT\niptables -A INPUT -p icmp -m state \\\n  --state ESTABLISHED -j ACCEPT\n\
    \n# Outbound Rules: Any TCP, UDP, ICMP is OK\niptables -A OUTPUT -p tcp -m state\
    \ \\\n  --state NEW,ESTABLISHED -j ACCEPT\niptables -A OUTPUT -p udp -m state\
    \ \\\n  --state NEW,ESTABLISHED -j ACCEPT\niptables -A OUTPUT -p icmp -m state\
    \ \\\n  --state NEW,ESTABLISHED -j ACCEPT\n```\n\nYou might be able to use the\
    \ previous rules on a simply configured system, such as a personal laptop, but\
    \ for any real application, your firewall rule sets would have to be much more\
    \ complicated than those just shown.\n\n# Reference\n\n+   1. FirewallBuilder\
    \ website, http://www.fwbuilder.org/"
