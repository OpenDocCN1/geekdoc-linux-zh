- img_proc: true
  md: '# Linux Package Management—Features


    Key features of Linux package management tools:


    +   - Download validation: Verify the download is valid and from a trusted source

    - Installation of dependencies: Determine dependencies and make sure they are
    installed

    - Binary format: Install precompiled applications to minimize dealing with source
    code

    - Standard locations for installations: Use standards to install files in common
    locations to enable reuse of code such as libraries

    - User experience components: Add features to make it easier and enhance the user
    experience

    - Verification of installation: Verify the install was done correctly and make
    sure it is a stable install


    ![](img/713f43d93c9396a48fab01efb4b1b069_249_0.png)


    Let''s look at the key components of package management software. Remember that
    the purpose of package management software is to make it simpler, easier, and
    faster for users to install software.


    The first component is verifying that the package is downloaded from a trusted
    source. Especially with Linux, many sites have software available, but many are
    rogue sites and can infect a system. Therefore, it is critical to verify the authenticity
    of the downloaded package prior to installation.


    The second component is to determine the dependencies that are required and install
    the dependencies. One of the primary reasons an an installation fails is that
    the required software is not installed. This is an area that removes a lot of
    the frustration of installing software.


    The third component is to deliver the software in a binary format. Compiling software
    can be very painful, and this component removes a lot of pain.


    The fourth component is to use a standard format and location for installation
    of the file. Having all packages installed in common locations eases management
    and code reuse.


    The fifth component is to enhance the user experience and make it easier for users
    to install software. Many people are accustomed to the easy Windows installer,
    and the goal of package management tools is to make installation as easy as possible.


    The final component is to verify that the installation of the software was done
    correctly. Sometimes, things go wrong when installing software; therefore, it
    is important to make sure the software is fully functional with a stable install
    base.


    Reference


    +   1. https://www.linode.com/docs/tools-reference/linux-package-management'
  merge: -1
  pgno: 249
