  md: '# Syslog (1)


    +   - Standard for message logging

    - Any part of the system, including applications, drivers, and other daemons can
    make log entries

    - A facility code is used to specify the type of program that is logging the message

    - Messages with different facilities may be handled differently


    The workhorse of the Linux logging system is the system logging daemon, or syslog.
    This daemon is normally started from the system startup (rc) scripts when the
    system goes into run level 1. Once it is running, almost any part of the system,
    including applications, drivers, and other daemons, can make log entries. There
    is even a command-line interface so that you can make entries from scripts or
    anywhere else.


    Syslog was developed in the 1980s by Eric Allman as part of the Sendmail project.
    It was readily adopted by other applications and has since become the standard
    logging solution on UNIX-like systems. A variety of implementations also exist
    on other operating systems, and it is commonly found in network devices, such
    as routers.¹


    Reference


    +   1. https://en.wikipedia.org/wiki/Syslog'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Syslog (2)


    # Syslog message format


    ```

    October 20 11:22:32 epilon disk-health[34792]: [ID 613022 user.error]

    my:SY-mon-full-500 c;H : partition health measures for /var did not

    suffice - still using 98% of partition space

    ```


    | Column 1 = "October 20 11:22:32" | > Timestamp |

    | Column 2 = "epilon" | > Loghost |

    | Column 3 = "disk-health[34792]:" | > Application/Process |

    | Column 4 = "[ID 613022 user.error]" | > Syslog facility.level |

    | Column 5 = "my:SY-mon-full-500" | > Message ID |

    | Column 6 = "c;H : partition health..." | > Message possibly including a lot
    of other information |


    ![](img/713f43d93c9396a48fab01efb4b1b069_141_0.png)


    This example shows a syslog message originating from a system that is about to
    run out of space on the partition where /var is mounted. There are six major sections
    to a syslog file, and the message starts with the timestamp.


    The interesting thing about the syslog message format and the rc, which dictates
    how the message should be formatted, is that it is a loose standard. The standard
    states what each column or should have in but does not state how the data should
    be formatted within each column, and where else is this more critical than with
    the timestamp. The column where the timestamp is placed only dictates that the
    timestamp goes in the first column, and not how the timestamp should be formatted.
    As a result, no standard, so different vendors will send their syslog messages
    with varying ways of representing the date and time. Some have the date and time
    in numerical format, others out the month and the day, and still change the order
    and change the text.


    The next column is the logname, which is simply the name of the host that is sending
    the log. Column 3 is the process that sent the log and sometimes the process.
    Column 4 is the facility level, which we will get into on the next slide. There
    are 24 facility levels, and there is a rough standard on how they should be used,
    but it is definitely not ubiquitous on how they should be used across vendors,
    which adds to the confusion.


    Column 5 is the message ID, which is specific to that process generating it. Column
    6 is the actual message of the log detailing the reason for the log.'
  merge: -1
