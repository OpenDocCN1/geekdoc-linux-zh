  md: '# Ps


    +   - Basic but essential processmanagement tool

    - Shows running processes

    - Not continuous like top

    - Displays process information to include CPU usage, memory usage, command


    ```

    root@kali:/run/systemd# ps

    PID TTY TIME CMD

    1450 pts/1 00:00:00 bash

    30863 pts/1 00:00:00 top

    30869 pts/1 00:00:00 top

    30873 pts/1 00:00:55 top

    31726 pts/1 00:00:00 ps

    ```


    ![](img/713f43d93c9396a48fab01efb4b1b069_193_0.png)


    Visibility is critical to not only securing a system but also to finding compromised
    systems. Active threat hunting is becoming a critical part of an effective security
    system. Therefore, having tools to find unusual activity is a critical component
    that any security engineer needs.


    One of the key activities to track running processes on a system. When an adversary
    breaks into a system to do significant damage, you need to run processes on the
    system. In addition, to maintain persistence, rogue processes typically run whenever
    the system starts. Therefore, by carefully monitoring processes, you can detect
    rogue activity.


    While fairly basic, ps is an essential and critical tool; ps can be used to not
    only view processes but also create a baseline. By verifying all legitimate processes,
    you can easily detect rogue processes.


    ```

    root@kali:/run/systemd# ps

    PID TTY TIME CMD

    1450 pts/1 00:00:00 bash

    30863 pts/1 00:00:00 top

    30869 pts/1 00:00:00 top

    30873 pts/1 00:00:55 top

    31726 pts/1 00:00:00 ps

    ```'
