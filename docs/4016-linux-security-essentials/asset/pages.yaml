  md: '# Privilege Elevation


    +   - You should never log in as root or UID 0

    - Anonymous login is very dangerous

    - Logging as UID o provides no accountability if there are multiple accounts

    - Always log in as a normal user

    - Utilize su or sudo to escalate privileges


    SEC401 | Security Essentials Bootcamp Style 63


    You can legitimately elevate your access to superiser in three ways. The first
    way is to simply log in the system as the root account. Logging in this way is
    called an anonymous login because there is no way to tie the back login to a specific
    user in the audit logs. It is best practice to not allow direct logins with root
    because there is not accountability. As part of a disaster recovery and business
    continuity plan or your incident handling plan, you might need to be able to log
    in as root due to emergency. It is only allow the root account to be used at the
    console and should never be used over a nonencrypted channel or any account over
    a nonencrypted channel such as Telnet.


    The second way to gain super access is by using the su command, which is located
    in the /bin/su or /usr/bin/sudo paths. This command enables a normal user to switch
    to any user on the system as long as he or she knows that user''s password, but
    in most cases, it will switch to the root account. In fact, if you just run the
    command by itself, it will default to switch to the root account. Logging in as
    root ensures that all activity with the root account can be traced back to the
    user who switched to the root account for accountability.


    The third way to gain super access is through the use of sudo command. The sudo
    command enables a normal user to execute the sudo command only if he or she is
    in the /etc/sudoers file. There are several advantages to using the sudo command
    over the su command. The sudo command requires only the normal user''s password,
    so the normal user does not need to know the root password. There is also more
    granularity of control because specific commands can be listed, which are the
    only commands the user is allowed to run with sudo. There is more verbosity in
    the logging with the sudo command.


    © 2017, Secure Anchor Consulting 63'
  merge: -1
