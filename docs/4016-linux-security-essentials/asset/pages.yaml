- img_proc: true
  md: '# CLI Log Parsing – Overview


    Linux systems have several tools at your disposal to parse and filter logs, ranging
    from simple filters to complex expression-based filters


    +   - grep

    - cut

    - sed

    - awk


    ![](img/713f43d93c9396a48fab01efb4b1b069_155_0.png)


    SEC401 | Security Essentials Bootcamp Style 153


    When you have all these logs, what are you supposed to do with them? Well, the
    answer is to parse them, of course. Linux systems have several tools at your disposal
    to parse and filter logs, ranging from simple filters to complex expression-based
    filters.


    Grep and cut are often used together when parsing logs, and they make up the simpler
    tools used for parsing logs. If you need advanced parsing of logs where you want
    very specific things to be pulled from the logs or if you need to be able to manipulate
    the way logs are presented or actually change their contents as you are parsing
    the logs, you will want to use sed or awk as your tools of choice.


    Grep is the GNU regular expression filter; it can pull back any line that matches
    or does not match all in part the filter given to it. Often, you don''t need the
    whole line and just a quick way to show only the fields within the lines that
    are interesting. You do this by piping the grep results to the cut program.


    If you need the power of grep and cut plus the ability to complete changes to
    the log files as the file is being parsed, then you can use sed. If you need the
    power of scripting to filter and change the contents of files and how they are
    printed out, using awk is the tool for you because because it is a full scripting
    language.'
  merge: -1
  pgno: 155
- img_proc: true
  md: "# CLI Log Parsing – grep\n\n+   - grep\n  - Fun and easy way to parse out strings\n\
    \  - Accepts any input\n  - Does not filter on newline characters\n  - Command\
    \ syntax: grep <options> <pattern> <filename>\n  - Grep also accepts piped, for\
    \ example:\n    - Cat <filename> | grep <options> <pattern>\n  - Accepts zero\
    \ or more options\n  - Accepts zero or more input filenames\n\n| SANS SEC401 |\
    \ Security Essentials Bootstrap Style I154 |\n\nGrep is a UNIX command that enables\
    \ you to search for a string based on a specified pattern; it then prints the\
    \ line that pattern matches. Grep expects to matching text, it has no limits on\
    \ input line length than available memory, and it can match arbitrary characters\
    \ within a line. If the final file is not a newline, grep silently replaces one.\
    \ Because a newline is also a separator for the list of patterns, there is no\
    \ way to match newline characters in a text.\n\nThere can be zero or more options,\
    \ and the pattern will only be seen as the pattern and not as an input_file name\
    \ if it hasn't already specified within options using the -e pattern or -f file\
    \ options. There can be zero or more input filenames.\n\nGrep also accepts options\
    \ to use redirected to the use of pipe character ().\n\nGrep has several options\
    \ to use in conjunction with the pattern you are to match and to display or not\
    \ display. Most options have a second command that is a full word that means the\
    \ same thing as the single-letter switch.\n- -i is used to identify the pattern\
    \ you want to search for, indicating the pattern by the switch\n- -f is not required.\
    \ This also goes for the -f switch, which you can use to identify the filename\
    \ to be searched. It is not required to be used for grep to search a specified\
    \ file as long as you follow the syntax order, as shown below:\n- --regexp specifies\
    \ that you want to pass a regular expression pattern. If you are regular expression\
    \ aficionado, this expands your filtering options with grep quite a bit more,\
    \ enabling you to be much more specific in your searches.\n- -i tells grep to\
    \ ignore for your search, making the search case insensitive where normally it\
    \ would be case sensitive. There is a caveat to using the -i when dealing with\
    \ languages other than English that have uppercase letters. In short, it might\
    \ be a good idea to run the same search twice using the ignore case where the\
    \ letters you need to be ignored are searched with the ignore case in both upper-\
    \ and lowercase. German, for example, would be a language you would want to verify\
    \ you got all the expected results."
  merge: -1
