- img_proc: true
  md: '# Triple Threat: ls, ps, netstat


    | Most adversaries when they break into a system are going to | Three useful commands:
    |

    |---|---|

    | - Install programs | - ls |

    | - Run daemons/services | - Shows a list of files on the system and helps identify
    modification or changes to files |

    | - Make outbound connections | - ps |

    | New files that have recently been loaded or installed, are running as a service,
    and are making an outbound connection have a high indication of malicious activity
    | - Provides a list of running services and details about the services -n netstat
    - Shows network connections, including outbound connections and the services that
    are making the connections |


    ![](img/713f43d93c9396a48fab01efb4b1b069_196_0.png)


    While you''re working in security, what sometimes happens is that some of the
    simplest techniques are the most powerful. In addition, the more visibility you
    have into how a system operates, the easier it is to spot and find anomalies.
    There are many methods of attacks and variations on how they work. In most cases,
    whether you are looking at basic attack or an advanced threat, they are going
    to upload files to a system, run a process typically as a background task, and
    make an outbound connection, which is often known as a C&C, C2, or command control
    channel.


    A powerful yet fairly simple defensive technique is to baseline a system by looking
    at what files or executables are on the system, with which one of those running
    as a service, and which one of those services is making an outbound connection.
    To do this, you can use the ls, ps and netstat tools to baseline the files that
    are on a system, focusing on executables or content that can be used for malicious
    purposes. After the baseline of files is established, you can run this on periodic
    intervals, looking for any new files that have recently added or changed on the
    system. You can do a similar process with ps, baselining the process that are
    running and identifying any new files that are now running as a process. Finally,
    you would repeat the process with netstat, looking for any new files that are
    running as a process and making an outbound connection.


    This is one method of performing basic hunting in your environment. In threat
    hunting, you proactively look for indicators of compromise (IoC) to find an adversary
    early in the attack process. Because this method is run on a regular basis, it
    can find infections quickly and allow for timely response to minimize the overall
    impact.'
  merge: -1
  pgno: 196
