    To show the power of | grep, let''s look at a hypothetical example. Assume that
    it has been determined that a malicious process called rtkit is found. It has
    been found on other systems to be infected with malicious code. If you run the
    ps command on a standard system, it can produce hundreds of outputs. Going through
    all output is not only time consuming, but it is also error prone and would not
    produce reliable results.


    Instead, if you can take the output of ps and pipe it to grep, you can now look
    for the specific piece of code- in this case, rtkit. As you can see in the slide,
