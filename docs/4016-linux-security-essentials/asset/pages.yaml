  md: '# Tripwire®


    # Intrusion detection through integrity checking


    Two versions


    +   - Commercial

    - Open source


    Creates a “secure” database of file and directory attributes

    Can include SHA signatures for verification


    ![](img/713f43d93c9396a48fab01efb4b1b069_216_0.png)


    Integrity checkers are valuable tools that enable administrators to take a check-and-balance
    look at their systems and be presented with a snapshot of any modifications that
    may have occurred.


    Tripwire® is both a commercial and open source integrity tool. It creates a digital
    snapshot of files and/or directories and places. This is a portable database.
    The database should be maintained offsite, and it should be secured. If an incident
    occurs, or if an organization would like to audit systems, Tripwire® provides
    a quick glance at any changes made to systems since the snapshot was taken. This
    way, responders can immediately highlight any changes made to a system.


    Updating and maintaining the integrity database are as important as storing and
    protecting the snapshot offsite. If required changes are made to a system, an
    update to the integrity database must be performed. However, it is recommended
    that prior to any updates, you perform an integrity check validation to ensure
    the system has not been compromised and that access levels are okay. Then, you
    can perform an update to the system, followed by an update to the integrity database
    to establish a new baseline snapshot.'
  merge: -1
