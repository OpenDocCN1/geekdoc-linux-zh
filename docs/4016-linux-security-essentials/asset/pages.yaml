  md: '# Comparison of Containers: LXC to docker


    | LXC | docker |

    | --- | --- |

    | - Original Linux containers | - Single application LXC containers |

    | - Operating system level virtualization | - More portable and flexible containers
    |

    | - Allows for multiple operating system virtualizations on a single host | -
    Easy to deploy, replicate, and move application workloads |

    | - Key features cgroups and namespace | - Single process and stateless |


    Some people try to compare LXC and docker, but in reality, docker is an evolution
    of LXC. LXC is the original system for creating containers in Linux and focuses
    in on operating system containers. Docker is an enhancement of LXC that focuses
    on single application-level containers. It is important to note that although
    Docker started out using LXC, it has moved away from using LXC to its own libcontainer
    framework based on Go.


    Because docker is at the application level, the containers tend to be smaller
    and more portable. Docker is also focused on single process and stateless-based
    containers.


    Reference

    1. Docker, https://www.docker.com/'
