  md: '# Grsecurity (2)


    +   * Grsecurity also includes PaX

    * Prevents memory from being overwritten

    * Provides memory corruption defenses

    * Provides NOEXEC and runtime code execution

    * Places flags in the executable header


    ```

    Grsecurity -->

    PaX ---

    [ ] Enable access key retention support

    [KEYS]

    [ ] Enable /proc/keys file by which keys may be viewed

    [ ] Restrict unprivileged access to the kernel syslog

    [ ] Enable different security models

    [ ] Enable the security filesystem

    Default security module (Unix Discretionary Access Controls)

    ```


    PaX protects against corruption of memory by containing many of the grsecurity
    mitigations. PaX also improves address layout randomization, plus, it strengthens
    the separation between kernel and userspace code and while eliminating various
    classes of information leaks.


    PaX provides protection from the following:


    +   * Arbitrary code execution.

    * Original code execution while in a different order

    * Original code execution with malicious code


    When you''re using PaX within grsecurity, the MPROTECT and RANDMAP mitigations
    require that you make exceptions so that some applications are able to function.
    Also, running PaX without grsecurity is not a good idea because many grsecurity
    features integrate tightly with PaX. PaX continues to open source, but grsecurity
    is a commercial solution.


    Reference


    +   1. “PaX”, https://wiki.archlinux.org/index.php/PaX'
