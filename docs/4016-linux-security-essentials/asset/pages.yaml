  md: "# Grsecurity (I)\n\n+   - Grsecurity is a set of patches for the UNIX kernel\
    \ that enhance security\n- MAC tool with role-based access control support\n \
    \ - Gradm utility to manage RBAC\n- PaX memory protection\n  - Paxtld to manage\
    \ PaX\n- File System Hardening\n- Kernel Auditing\n- Trusted Path Execution (TPE)\n\
    \n![](img/713f43d93c9396a48fab01efb4b1b069_112_0.png)\n\nGrsecurity was introduced\
    \ to the open source market in 2000 and is still in active development today although\
    \ it is closed source now. Grsecurity introduces true role-based access control,\
    \ which is intended to restrict access to the system further than what is normally\
    \ provided by Linux access control lists. The aim is to create a full-privilege\
    \ system, where users and processes have the absolute minimum privileges to work\
    \ correctly and nothing more.\n\nFile system hardening is included along with\
    \ additional audit logging capability. PaX is a memory protection patch for the\
    \ kernel and it offers many different memory protection mechanisms.\n\nA kernel\
    \ patch is not without its risks. Recently, grsecurity contained a vulnerability\
    \ that caused the kernel to panic; the vulnerability can be caused by any user."
