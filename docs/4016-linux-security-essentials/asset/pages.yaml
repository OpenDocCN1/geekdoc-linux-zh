  md: '# Enabling Password Aging


    Controlled by two configuration files

    * /etc/login.defs

    * **PASS_MAX_DAYS**: Maximum number of days a password is valid. The default is
    99,990.

    * **PASS_MIN_DAYS**: Minimum number of days before a user can change the password
    since the last change. The default is 0.

    * **PASS_MIN_LEN**: Minimum length of password (in Linux, this value is controlled
    by the PAM). The default is 0.

    * **PASS_WARN_AGE**: Number of days when the password change reminder starts.
    The default is 7 days.


    +   * /etc/default/useradd

    * **INACTIVE**: Number of days after password expiration that account is disabled.
    Value of -1 feature disabled (default).

    * **EXPIRE**: Account expiration date in the format YYYY-MM-DD. Default is None.


    ![](img/713f43d93c9396a48fab01efb4b1b069_69_0.png)


    ![](img/713f43d93c9396a48fab01efb4b1b069_69_1.png)


    # Enabling Password Aging


    On most UNIX OSs, the password-expiring and password-rotation features are disabled.
    To enable these features, you must simply apply values to configuration files
    in /etc/login.defs.'
