  md: '# Finding the Data: tail


    +   - Reads the last few lines of a file

    - Can be used for monitoring or base lining

    - Typical default is the last ten lines

    - Default settings can be changed with options

    - Useful for reviewing log files


    ```

    root@kali://var/log/messages

    Oct 12 05:55:12 kali kernel: [604.314832] usb 1-2.1: Manufacturer: WMR

    Oct 12 05:35:17 kali kernel: [604.314832] usb 1-2.1: SerialNumber: 0005026832

    Oct 12 14:20:52 kali kernel: [956]: ** (evolution for-

    usb) 1-2.1: new full-speed USB device, dw0

    Oct 12 16:02:46 kali kernel: [3259.306241] usb 1-2.1: new USB device, dw0

    Oct 12 16:02:46 kali kernel: [3259.310267] usb 1-2.1: New USB device, WMR

    Oct 12 16:02:46 kali kernel: [3259.310272] usb 1-2.1: New USB device strings:
    M

    Oct 12 16:02:46 kali kernel: [3259.317275] usb 1-2.1: Product: Virtual Bluetooth

    Adapter

    Oct 12 16:02:46 kali kernel: [3259.331921] usb 1-2.1: SerialNumber: 0005026832

    tail /var/log/messages

    ```


    A simple but powerful tool for performing analysis is tail. Often, some files
    grow over time and can be very large. Opening a large file can take significant
    resources, and the amount of data can be overwhelming. Being able to look at the
    most recent additions can be helpful from an analytical perspective. Tail is the
    perfect command for reading the last few lines of a file.


    Tail is a great tool for performing spot checks and looking for anomalies in a
    system. For example, if the system is not behaving correctly, you can use tail
    to spot check keys. Although tail can be used with any file, it is often most
    valued when used with log files. Because log files can be very large, tail is
    a great tool for looking at new entries.


    By default, tail will display the last ten lines of a file. However, with options,
    you can change the number of lines that are displayed. With tail, it is always
    recommended that you man tail to review the manual to understand all the available
    options. Options enables you to add power and take a command to the next level.'
