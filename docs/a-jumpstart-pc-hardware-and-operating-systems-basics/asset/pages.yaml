- img_proc: true
  md: '# Chapter 12


    Piezoelectric inkjet printer

    An inkjet printer that moves the ink through the print nozzles by applying electrical
    charges to piezoelectric crystals.


    this technology. Because the heat tends to degrade the print heads over, ink replacement
    cartridges for these models often include replacement print heads as well. (That''s
    one reason why you should avoid home-refilling inkjet kits—because when you refill
    the ink, you don''t get a new print head.)


    A piezoelectric inkjet printer moves the ink with electricity instead of heat.
    The nozzles contain piezoelectric crystals, which change their shape when applied
    to them and force the ink out. Piezo technology is newer and is used in most of
    the inkjet printers sold today by Epson and Lexmark. It''s easier on the printer
    because the printer doesn''t need to contain a heating element, and it''s better
    for the output because the ink used is less prone to smearing.


    The main gripe people have with inkjets is the cost of operation. The ink cartridges
    are rather expensive, and they don''t last very long, making the cost per page
    (cpp) very high for inkjet printers compared to laser or dot matrix printers.'
