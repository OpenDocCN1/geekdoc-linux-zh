  md: "# # Chapter 2\n\nA heat sink is a porcupine-like block that channels heat away\
    \ from the CPU. CPUs use a combination of both—a heat sink block with a fan mounted\
    \ in the center of it.\n\n# # Heat sink\n\nA porcupine-like block that channels\
    \ heat away from the CPU.\n\n# # RAM\n\nChips that store data using electrical\
    \ impulses that are constantly refreshed by the power supply when power goes off,\
    \ the data is erased. Also known as memory, although memory actually a broader\
    \ term encompassing than just RAM.\n\nRandom Access Memory (RAM) acts as short-term\
    \ storage for the PC while it processes data. RAM keeps track of what programs\
    \ and data files are open, what should appear on the screen at any given moment,\
    \ and lots more. Writing to and from RAM is very fast—much faster than writing\
    \ to and from a hard disk. RAM is volatile, which means whatever is stored there\
    \ is only stored temporarily; when you turn off the PC, RAM's content is erased.\
    \ In Chapter 5, you'll learn why this is so, and you'll learn lots of other important\
    \ details about RAM.\n\nPhysically, RAM on a motherboard looks like a small rectangular\
    \ circuit board, about 5.25 inches long. The type shown here is a Dual Inline\
    \ Memory Module (DIMM).\n\n![](img/e4cc2c51a02d134f2b6b98075a06643f_47_0.png)\n\
    \nThere is also an older, shorter kind called a SIMM (Single Inline Memory Module)\
    \ that you might encounter in older PCs.\n\n# # Drives\n\nCD-ROMs, floppy disks,\
    \ and hard disks are all nonvolatile storage. In other words, whatever you place\
    \ on a disk stays there, even after you shut off the PC. That's why it's important\
    \ to save your work before shutting down the PC—because the data exists only in\
    \ RAM. \n\nDisk drives are encased in metal boxes to keep them from being damaged.\
    \ Some drives are separate from their disks, and you can remove one disk and insert\
