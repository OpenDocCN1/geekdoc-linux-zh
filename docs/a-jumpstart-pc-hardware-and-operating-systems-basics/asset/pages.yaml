  md: '# Operating System Basics


    # The Setup Process


    Each Setup program is a little different, tackling tasks in varying order, so
    exact step-by-step instructions would not be meaningful here. However, they all
    do these things sometime during the process:


    +   - Check to make sure there is a valid partition on which to install.

    - Format the partition if needed.

    - Run a quick Scandisk check of all the drives on the PC.

    - Copy installation files to the hard disk.

    - Determine which hardware is installed and what hardware drivers are needed.

    - Ask for an installation key (the string of numbers/letters on the back of the
    CD-ROM case).

    - Ask for a username and business name.

    - Confirm the current date/time.

    - Set up networking components.

    - Set up the PC to automatically start Windows at startup.


    Because each Setup program prompts you at each step, you do not need to memorize
    which versions in which order; simply follow along.


    # Upgrading from Earlier Windows Versions


    If you are upgrading from another Windows, you will need less free disk space
    than for a full, new installation because some of your existing files will be
    overwritten or deleted during the upgrade process.


    Some Windows releases come in Full and Upgrade versions. The Upgrade version is
    cheaper, but it requires that you have an earlier version of Windows from which
    to upgrade. Some Upgrade will accept any earlier version; others are picky and
    only work with a specific list. Check Microsoft''s website for Windows (www.microsoft.com/windows)
    to find out the upgrade requirements for a certain version.


    Depending on the Windows version you are installing, the upgrade steps might be
    slightly or substantially different from those for a fresh install. For example,
    the Setup program might ask for your installation key at a different point in
    the process, or it might detect your hardware at a different point. However, the
    full Setup and the upgrade Setup perform the same basic tasks and arrive at the
    same result.


