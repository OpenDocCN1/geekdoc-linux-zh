  md: '# Installing Removable Disk Drives


    If you read the material in the last chapter about installing hard drives, you
    probably won''t need much help to install a removable drive. Here are the big-picture
    steps:


    +   1. Select and prepare a drive bay.

    2. Install the drive in the bay.

    3. Connect the motherboard and power supply to the drive.

    4. Connect any additional cables required.

    5. Set up the BIOS.


    # Step 1: Select and Prepare a Drive Bay


    A removable drive must go in an external bay because it needs an opening to the
    outside. As you saw way back in Chapter 2, "A Look Inside a PC," external bays
    come in two sizes: one for small drives like floppies and the other for large
    drives like CD-ROMs. Here''s a system with two large bays (both full) and two
    small bays (both empty).


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_179_0.png)


    The extra slot below the small bays is for a proprietary style of floppy drive;
    not all PCs have that. Most PCs have a standard floppy drive in one of the small
    bays. If you run out of the small bays but still have some small drives to install,
    you can use mounting brackets and a face plate that will convert a large bay into
    a small one.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Focus on Removable Disk Drives


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_180_0.png)


    To prepare a bay, pop the plastic cover off it. It''s usually easier to do this
    from behind—if “behind” is reachable without too much trouble. You can also stick
    the flat blade of a screwdriver into a crevice from the front to pop it out.


    If you find a metal panel behind the plastic, don''t freak out—It''s removable.
    If there''s a faceplate on the front of the PC, you might want to remove it first.
    Then pop out the metal piece with a screwdriver. You may need to wiggle it a bit
    first.


    # Step 2: Install the Drive in the Bay


    Then just slide the drive into the bay. It should slide in freely. Push it in
    far enough that the front of the drive is even with the fronts of the existing
    drives.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_180_1.png)


    You can fasten the drive in place with screws now, or you can wait to confirm
    that it works before you fasten it. You might find it easier to put the screws
    in later, after you''ve attached the cables.'
  merge: -1
