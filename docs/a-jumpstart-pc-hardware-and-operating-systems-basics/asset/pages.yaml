    Some older expansion boards have jumpers on the board for setting the I/O address
    and IRQ. These are non-Plug and Play models; you choose the resources they will
    get, and then the chipset takes it from the expansion board. Most cards these
    days, however, are Plug and Play and, therefore, jumperless. Some expansion boards
    that were manufactured during the changeover period can operate either way—that
    one of the positions is Plug and Play rather than a specific assignment.


    Of the four resources you listed here, the most critical is the IRQ. That''s because
    there is a limited number of them and almost every device requires one. Older
    systems with lots of ISA devices would run out of IRQs and no more devices could
    be installed in. One of the advantages of the PCI interface over ISA is that PCI
    devices can share IRQs; each expansion board need not have a unique IRQ assigned
    to it.


    There are other interfaces that help devices share resources. Certain device types—such
    as SCSI, USB, and FireWire—work off a central controller that handles resource
    assignments for multiple devices. The controller requires an IRQ (and other resources
    too), but the individual devices do not.


    Plug and Play

    A standard for detecting new devices and installing drivers for them automatically.
    To work, it must be supported by the motherboard chipset, and the installed operating
    system.


