    # Installing New Devices


    Installing new hardware used to be a great burden in early Windows versions, because
    Plug and Play didn''t work very well (if it worked at all) and because not all
    motherboards and devices were Plug and Play compatible. Nowadays, almost everything
    is Plug and Play compatible, so installing new hardware is basically a matter
    of plugging it in and turning on the PC.


