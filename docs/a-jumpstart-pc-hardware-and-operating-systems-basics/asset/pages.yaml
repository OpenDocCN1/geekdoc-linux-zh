    \ apply\nwhen you're working on PCs as well.\n\nThe biggest danger comes not from\
    \ the PC itself, but from the monitor. The tra-\nditional type of PC monitor (known\
    \ as a CRT) contains a large capacitor in the\nback that can store up to 30,000\
    \ volts—more than enough to kill a person. Fur-\ther, it maintains its charge\
    \ even after the monitor has been unplugged from\nwall outlet for many months.\
    \ Because of this, you should not attempt to\nwork on your own monitor, nor should\
