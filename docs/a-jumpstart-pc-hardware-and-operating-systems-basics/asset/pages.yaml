  md: '# Chapter 7


    # NOTE


    FAT in the sense of "File Allocation Table" is different from FAT16 and FAT32
    referring to a specific type of FAT. All operating systems have some type of FAT
    in a generic sense, that they all keep track of data stored on disks. MS-DOS and
    Windows 95 supported a 16-bit FAT known as FAT16, sometimes just called FAT. Windows
    98 and Me supported both FAT16, and sometimes a 32-bit version called FAT32. Windows
    2000 and XP supported FAT32, but they also support a completely different type
    of FAT called NT File System (NTFS).


    Root directory

    The top-level or main storage area on a disk, not associated with any particular
    folder.


    # Root Directories


    Each high-level formatted disk has a root directory. The root directory is like
    the lobby of an office building—when you''re there, you''re in the building, but
    not in any particular office. Similarly, when the root directory is active, the
    drive is active, but not any particular folder on it.


    The root directory can contain files and folders. Files stored directly in the
    root directory are like people standing in the lobby. Folders in the root directory
    are like office suites. Folders, in turn, hold files, or they can hold subfolders
    (which are like individual rooms within a company''s office suite).


    The root directory is important because the File Allocation Table keeps track
    only of the root directory''s content, sort of like the lobby of a building listing
    only the names of the companies that have offices in it, not the names of all
    the individual employees. When a program references a file, it references a complete
    path to it, such as C:\Windows\win.ini. The operating system sees C: and knows
    it needs to query the C: drive. The C: drive sees \Windows and directs the request
    to the Windows folder. The Windows folder has its own internal listing of its
    contents and is able to direct the operating system to the win.ini file.


