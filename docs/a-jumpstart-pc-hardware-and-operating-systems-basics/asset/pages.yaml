  md: '# Starting Up a PC


    The resulting disk contains the files needed to boot to a command prompt, plus
    several essential MS-DOS commands needed for preparing a hard disk for use, transferring
    files, and so on.


    The startup disk needs to contain more files than a single 1.44MB floppy disk
    can hold, so it utilizes a compression scheme. It contains a few of the files
    on the floppy disk itself, ready to go, but most of them are contained in a compressed
    archive file. When a PC boots from the startup disk, it creates a RAM disk and
    then decompresses the rest of the files to that RAM disk. Therefore, when you
    boot from the startup disk, all your removable drive letters will be off by one.
    For example, if your hard disk is C: and the CD-ROM is normally D; the RAM disk
    will be D: and the CD-ROM will be E:


    # NOTE


    +   Startup disks created in Windows 98 and Me contain real-mode CD-ROM drivers
    so that your CD-ROM drives will not work from the command prompt, but Windows
    95 startup disks do not. You must manually edit the FIG.SYS and AUTOEXEC.BAT files
    on a Windows 95 startup disk to add CD-ROM support. It is a good idea, therefore,
    to have a Windows 98 or Me startup disk in your troubleshooting toolkit. It can
    be used on Windows 95 systems.


    # Using a Startup Disk


    A startup disk is useful in situations where the current Window installation is
    so badly damaged or corrupted that it is not salvageable, or when preparing a
    brand-new hard disk for use.


    When you boot from a startup disk, it asks whether you want to start the PC with
    or without CD-ROM support (Windows 98/Me versions only). Then it extracts the
    compressed files to a RAM disk and presents you with a command prompt. Table 15.1
    lists some of the internal MS-DOS commands you can use from a command prompt,
    and Table 15.2 lists some of the files on the startup disk you can use for troubleshooting
    and system reconstruction.


    # TIP


    You don''t just type the command and press Enter in most cases; you need to type
    some parameters along with it in a specific order and syntax. A command followed
    by /h to get instructions on a particular command.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_296_0.png)'
