  md: '# Chapter 19


    # Understanding Internet Connectivity


    # **Internet**


    A global network of interconnected computers that share data.


    The Internet is a huge network of computers all over the world. Some of those
    computers are connected 24/7; others connect only when needed.


    All the computers on the Internet can be divided into two broad categories, just
    like on a LAN: clients and servers. An Internet client is one where end user sits,
    surfing the Web, reading e-mail, and so on. An Internet server is one that either
    offers client PCs an access point for tapping into the Internet or stores Internet
    content for client PCs to retrieve, such as web pages and e-mail.


    # **Internet client**


    A computer that uses Internet services.


    # **Internet server**


    A computer that provides Internet services to other computers.


    Sometimes the line between an Internet client and Internet server can be fuzzy.
    For example, a home PC user with a full-time cable or DSL connection to the Internet
    might host a small website on his PC or share that connection with several PCs
    in his home. In those cases, his PC is serving as both a client and a server.
    However, when people talk about Internet, they usually mean large, powerful corporate
    servers such as those of ISPs and web hosting companies.


    # **ISP**


    Internet Service Provider. A company that charges people to help them connect
    to the Internet.


    Large corporations sometimes have their own web servers and provide their employees
    with full-time access to the Internet through the corporate LAN. Individuals who
    want to connect to the Internet, however, must sign up with an ISP, a company
    that provides Internet connectivity for a fee. The services provided by ISPs vary,
    but the average package includes a username and password for connecting, at least
    one e-mail account, and a small amount of space for storing a personal website.


    # **Web hosting company**


    A company that charges people to store their websites and keep them available
    at all times to other clients.


    # **Types of Internet Connections


    Until a few years ago, only clients connecting through a corporate network had
    high-speed Internet access; everyone else struggled along with dial-up modems.
    This has changed dramatically, however, and high-speed access is available to
    almost any user who wants to.


    # **Dial-networking**


    A feature that enables clients to log into a remote network via telephone.


    There are different ways of breaking down the various connection types into categories.
    Table 19.1 lists the major players along with some pertinent details about them,
    such as connection speed, telephone usage, and whether or not they use Windows
    Dial-Up Networking (DUN). The alternative is for them to be always on, so you
    don''t connect each time.


    As far as is concerned, there are only two kinds of Internet connections: those
    that require Dial-Up Networking and those that don''t. All the rest is just details.
    I''ll explain how to set up DUN and non-DUN connections later in the chapter.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_343_0.png)


    324'
