  md: '> TIP 25-pin male port shown here is a serial port; recall from Chapter 2''s
    discussion that serial ports sometimes have 25 rather than 9 pins. The 25-pin
    female port shown here is a parallel port.


    The ATX motherboard is the more modern type, and it will eventually replace the
    AT style altogether because of its many advantages. However, in your work as a
    PC technician you will likely continue to encounter AT motherboards for years
    to come.


    # The ATX Motherboard


    An ATX motherboard is the type you''ll find in almost all of the new PCs sold
    today, including all the mainstream brands like Dell and Gateway. You can still
    buy AT motherboards at computer stores, though.


    An ATX motherboard, which is 12"x7.5", is larger than an AT. The expansion slots
    run parallel to the narrow edge, which means the wide edge of the board runs cross
    across the back of the PC case when installed.


    Notice the position of the CPU on the ATX motherboard; it''s next to the expansion
    slots. This enables the CPU to sit closer to the power supply fan, providing improved
    cooling.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_59_0.png)'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# A Closer Look at the Motherboard


    Notice also that the ports are all built into the motherboard on an ATX model,
    so no connectors and cables are required to hook up the parallel, serial, and
    mouse ports. The keyboard connector is the smaller, PS/2 style rather than the
    large round plug on the AT.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_60_0.png)


    The power supply connector on an ATX is a 20-pin female connector. Because it''s
    all one piece, there is no possibility of getting the plugs switched accidentally
    as there is on an AT.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_60_1.png)


    One other feature of an ATX power supply is that the power switch isn''t permanently
    attached to the power supply; it''s attached only to the case itself. A wire runs
    from the power switch in the case directly to the motherboard, and when you press
    the power button, an electrical signal tells the motherboard to start up.


    This is significant (and a very good thing!) for a couple of reasons. One is that
    it''s much easier to replace a bad power supply when you don''t need to fuss with
    removing the switch from the case. The other reason is that the motherboard controls
    the power on/off state, not the power supply, you can use software to start up
    the PC. For example, ATX motherboards can "wake on LAN," which means when the
    network interface card receives a request from the network, it can start up the
    PC to answer it.'
