  md: '# A Closer Look at the Motherboard


    The system bus is the bus that transports data among the processing portions of
    the system. It''s the fastest, widest bus on the whole PC, and necessarily because
    almost every bit of data in the computing process must pass through it. The speed
    of the system bus is either the same as that of the CPU (measured in megahertz,
    or MHz) or a fraction of it. Newer systems are more likely to have CPUs that operate
    at multiples of the system bus. For example, a system with a 1GHz CPU, might have
    a system bus of 100MHz (1/10th of the CPU speed). On modern motherboards, the
    system bus is 64 bits in width, which means it can handle up to 64 bits of data
    simultaneously.


    The motherboard has other bus types, but let''s postpone the discussion for a
    bit. They''re associated with the expansion slots on the motherboard, and those
    items deserve their own section later in the chapter.


    System bus

    The bus that carries data between the CPU and memory. Also called the external
    bus. "External" refers to the fact that the bus is outside the CPU; the CPU also
    has its own internal bus.


    # CPU Slot or Socket


    As you learned in Chapter 2, there are two basic types of CPU: pin grid array
    (PGA) and single edge contact (SEC). A motherboard will support one or the other,
    but not both.


    A motherboard that supports a PGA CPU will have a square socket with lots of little
    holes in it, as shown here. There have been various versions of such a socket
    over the years, and each version has a number. The one shown below is called Socket
    7. It''s a staggered pin grid array (SPGA) socket, because the concentric circles
    of pins are offset from one another. Manufacturers do do so so they can fit more
    pins on the back of a chip without increasing the overall chip size. Earlier PGA
    CPUs did not have staggered pins.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_62_0.png)'
  merge: -1
