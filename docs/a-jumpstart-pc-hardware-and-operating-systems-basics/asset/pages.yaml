- img_proc: true
  md: '# Appendix A


    If you plan to take apart, repair and reassemble PCs, a good toolkit is an essential
    investment. The right tools can save you a lot of time, and help you avoid damage
    to your equipment or injury to yourself.


    Most computer stores sell toolkits of various sizes. You don''t need the largest,
    fanciest one, as long as you have the few basic tools you need for the PCs you''ll
    be working on. For example, Compaq laptops happen to use a small Torx screw (T-8
    size), so if you work on those, you''ll need a T-8 screwdriver; otherwise, you
    probably won''t need one.


    Generally speaking, a good toolkit should contain:


    +   **At least two sizes of Phillips head screwdrivers** You''ll need a medium-sized
    one for large screws as those on the cover of the computer case, plus a small
    one for tiny screws such as those holding a disk drive in place. Most screws in
    a typical computer are Phillips (a four-prong star) rather than regular flathead
    screws (a straight line).


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_359_0.png)


    > **WARNING**nDo not use a magnetized screwdriver inside the computer. Some technicians
    enjoy the convenience of using a screwdriver with a magnetized tip to fish dropped
    screws out of crevices, but it''s easy to damage disks by touching them with a
    magnet. If the only screwdriver you have is magnetized, exercise extreme care
    not to touch its tip to any part of the PC except the screws themselves.


    +   **At least two sizes of flathead screwdrivers** Although flathead screws are
    less common in computer equipment, you will occasionally encounter them.


    +   **Needle-nose pliers** These are useful for grasping small items and for removing
    and replacing circuit board jumpers.


    +   **Tweezers** Or even better, a part retriever, which is like a tiny set of
    retractable claws with a spring-loaded handle.


    The above constitutes the basic set; you might also want the following tools:


    +   **Wire snips** A pair of wire snips for cutting wire and stripping insulation.


    +   **Small flashlight** This is useful to see small areas inside the computer,
    for example, the pin 1 marking on a connector.


    +   **3/16-inch nut driver** This tool helps place 3/16-inch hexagonal nuts into
    the computer. The nuts are useful for mounting hardware on motherboards as well
    as serial and parallel ports.'
  merge: -1
