    buy a cable, or one might come with the modem.


    > WARNING

    In Chapter 17, you''ll learn how to disable a COM port in BIOS to set free up
    IRQs for other purposes. Make sure the COM port you pick in Step 2 hasn''t been
    disabled. If in doubt, try it. If it doesn''t work, skip to Chapter 17 troubleshoot.


