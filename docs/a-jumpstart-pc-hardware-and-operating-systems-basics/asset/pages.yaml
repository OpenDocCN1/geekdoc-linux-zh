  md: '# GUI Operating Systems


    GUI operating system, such as Microsoft Windows, uses pictures and a pointing
    device as the primary user interface. Whereas a command line operating system
    is typing based, a GUI operating system is point-and-click based, making it less
    intimidating for beginners.


    A interface requires much less memorization because users select from menus of
    available commands rather than relying on memory to determine which command to
    use in a particular situation.


    Users can also multitask freely with a GUI operating system because multiple programs
    can run in different areas of the screen simultaneously.


    The disadvantage of multitasking is its high overhead. Executing the programs
    required for creating and maintaining the programs on screens takes up a good
    deal of the CPU''s time and the RAM''s storage space, leaving less for running
    programs. Therefore, a PC running a GUI must have a much more powerful CPU and
    lot more memory than a PC running a command line OS. Each successive version of
    Windows has required more of the CPU and RAM''s attention, with the result that
    only fairly new PCs (a few years old or less) are capable of running the latest
    Windows versions.


    # It''s All about Memory Management


    Later in the chapter, you will learn about the differences between various versions
    of MS-DOS and Microsoft Windows; however, for information to make sense, you first
    need to know something about how an operating system uses memory.


    # Conventional and Upper Memory


    Remember from earlier chapters that PCs based on the 8086 CPU had only 1MB of
    RAM. It was divided into two sections. The first 640KB was conventional memory,
    and the rest was upper memory. Only conventional memory could be used for running
    programs and loading the operating system files and drivers; upper memory was
    reserved for system use. ''One system use'' was for ROM shadowing; another was
    to serve as a staging area for copying data to and from the RAM on the video card.
    However, a good deal of the memory went unused and wasted.


    The main problem with this conventional/upper memory split was that as programs
    got bigger, they began to require more than 640KB. Additional memory was available
    in upper memory, but it was reserved and programs couldn''t utilize it. More nonreserved
    memory was needed.


    Multitask

    To execute more than one program at.


    Conventional

    memory

    The first 640KB of a PC''s

    RAM. Used for running

    programs.


    Upper memory

    The last 360KB of a PC''s

    first megabyte of RAM.

    Reserved for system use.


    ROM Shadowing

    Copying the data from a

    ROM BIOS chip into RAM

    for quicker access to it.


