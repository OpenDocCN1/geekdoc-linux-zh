  md: '# Chapter 10


    # Installing an Expansion Board


    No matter what type of expansion board you''re installing—modem, sound card, network
    card, or whatever—you install it on the motherboard the same way physically. All
    expansion boards fit into expansion slots in a motherboard (or on a riser card
    in a slimline system). You learned about the various bus types in Chapter 3, "A
    Closer Look at the Motherboard," so you already know that there are ISA, PCI,
    and AG expansion slots in the average motherboard and that you can buy expansion
    boards that fit into those various slots.


    Here''s to install one:


    +   1. Make sure you have a free slot of the correct type.


    +   2. Check the expansion board to make sure there are no jumpers that need to
    be set on it.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_193_0.png)


    > TIP


    Check the documentation for the board if you see jumpers. Some boards have jumpers
    that you don''t need to set if you''ve got a Plug and Play PC operating system.


    +   3. If there''s a blank backplate behind the slot you want to use, remove it.
    It might be held in place with a screw. If this is a new case, there may still
    be a piece of metal over the hole from the manufacturing process. If so, pop it
    out with a flat screwdriver. The following figure shows the back-plate removed
    for an ISA slot.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_193_1.png)


    Backplate


    A plate at the back of an expansion slot to keep the dust out of the PC case that
    slot is not being used. You remove the backplate before you install an expansion
    card in that slot. Can also refer to the metal plate attached to the expansion
    card that fits into the same spot that the blank backplate occupied.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_193_2.png)


