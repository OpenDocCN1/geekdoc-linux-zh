    phone line. Suitable for small or medium-sized companies. |

    | T3 | No | No | 44Mbps | Like a T1 but faster. Suitable for large companies with
    many simultaneous Internet users. |

    | Frame Relay | No | No | 56Kbps to 1.554Mbps | An inexpensive alternative to
    T1 for small companies. |

    | ATM | No | No | 155Mbps | Fiber optic connection. Fast and expensive. For large
