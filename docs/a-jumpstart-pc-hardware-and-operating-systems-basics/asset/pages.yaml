  md: '# Starting Up a PC


    You should not operate the PC in Safe mode for your regular activities because
    there is only very limited access to the hardware. Your CD-ROM drives will probably
    not be available in Safe mode, for example.


    Some Windows versions have different subtypes of Safe mode available, such as
    Safe Mode with Networking (same as regular Safe mode that loads the drivers needed
    for accessing network resources) and Safe Mode with Command Prompt (opens a command
    prompt screen).


    # Logged Mode


    Logged mode is just like a regular startup, except that it takes copious notes
    about the startup process and saves them in a file called BOOTLOG.TXT. You can
    then open that file in a text editor such as Notepad and review the boot process
    to figure out what''s wrong.


    # Step-by-Step Confirmation


    This option loads all the regular drivers, but it does so one step at a time,
    and you have the opportunity to say “No” to any line item individually. This is
    available only for Windows 9x versions, not for NT 4, 2000, or XP.


    I found this mode useful for troubleshooting startup problems that are caused
    by a particular driver locking things. I go step-by-step through the startup,
    answering “Y” to each line, until the PC locks up. Then I look on the screen to
    see what the last line was that I said Yes to, and that''s the causing the problem.
    Then to confirm, I restart and go through Step-by-Step again, but this time I
    choose “No” for that line. If Windows boots without locking up, I am then sure
    that line had been the problem. Then I figure out what program or device that
    line is associated with and troubleshoot from there.


    # Command Prompt Only


    This mode, available only for Windows 9x versions, displays a plain command prompt
    without loading any drivers or any portion of Windows. It''s useful when you need
    to run an MS-DOS program or utility that is incompatible with Windows for troubleshooting
    purposes.


    If you need to run an MS-DOS application that doesn''t run well within Windows,
    another way to do it is with MS-DOS mode (available only within Windows 95 and
    98). To use it, choose Start > Shut Down and then restart in MS-DOS mode. Then
    when the PC restarts in DOS, run the program for a command line. You can also
    set the properties for an MS-DOS program''s executable file to use MS-DOS mode.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_294_0.png)'
