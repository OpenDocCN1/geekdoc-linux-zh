  md: '# Chapter 12


    +   * The Device Settings tab is present for all printers, but the options are
    different depending on the printer driver. Some printers have a lot of options
    here, as shown below; other printers might have only one or two options.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_241_0.png)


    # Managing a Print Queue


    When you print in Windows, the print job goes into a queue for that printer. You
    can view the queue by double-clicking the printer''s icon in the Printers folder.
    A printer icon may appear in the notification area while a printer''s queue is
    active. If so, you can double-click that icon to open the queue.


    From the printer''s queue window, you can pause or delete individual jobs or pause
    or purge the entire print queue. Just poke around in the menu system to see what''s
    available.'
