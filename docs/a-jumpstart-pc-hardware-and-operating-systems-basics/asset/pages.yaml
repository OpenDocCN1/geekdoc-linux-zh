    # Disk Formatting


    If you partitioned from FDISK, you must restart your PC afterwards before you
    format. If you partitioned from within Windows 2000/XP, you don''t have to restart.


    # Disk Formatting from a Command Prompt


    If you are working from a command prompt, type FORMAT (drive letter):) and press
    Enter to start the formatting. For example, to format the C: drive, type FORMAT
    C:. A warning appears about formatting fixed disks; type Y and press Enter to
    move past it. Then just wait for the formatting to finish.


    # Disk Formatting from My Computer in Windows


    After you have created a partition, it shows up in My Computer, even if it is
    not formatted. You can format it by right-clicking it and choosing Format. This
    opens the Format dialog box; choose a file system and other settings and click
    OK to format it.


