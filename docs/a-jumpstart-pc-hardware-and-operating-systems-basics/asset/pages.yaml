  md: '# Safety and Preventive Maintenance


    # Cleaning a mouse


    Like the keyboard, the mouse gets very dirty because people have their hands on
    it. And that''s the top of it–bottom also gets dirty from picking up debris and
    dust from the mouse pad.


    When the mouse ball picks up dirt, it conveys it inside the mouse as it rolls.
    Over time, the rollers inside the mouse can get so dirty that they don''t work
    well anymore. The sensors inside the mouse that tell it how much the rollers are
    moving can also become impaired. When a mouse is dirty, the pointer often jumps
    stutters across the screen.


    To clean a mouse:


    +   1. Turn the mouse on its back, and rotate the plastic plate that holds the
    mouse ball in place.

    2. Turn the mouse over again. The ball and plate should fall into your hand.


    > WARNING

    Don''t clean the mouse ball with alcohol, because it dries out the rubber.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_30_0.png)


    +   3. Clean the ball with soap and water; then dry it with a lint-free cloth.

    4. With a cotton swab and alcohol, clean the rollers and contact points inside
    the mouse. Let the alcohol evaporate completely before reassembling the mouse.

    5. Replace the ball and the plastic plate, and rotate the plate to secure it.'
