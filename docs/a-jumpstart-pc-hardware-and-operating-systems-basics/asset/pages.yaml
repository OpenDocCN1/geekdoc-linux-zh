  md: '# A Look Inside a PC


    Serial ports Some systems have one of these; others have two. They are typical
    9-pin male D-sub connectors. The nine pins are arranged with five pins in one
    row and four pins in the other. Some older systems have one-pin serial port and
    25-pin serial port. The 25-pin type is just an elongated model with more pins,
    and you can buy converters that switch between 9-pin and 25-pin formats if you
    need to connect to a different size than it is. Serial ports used to be used for
    many devices, but today the USB type connector is more popular. You might connect
    an external modem to a serial port or a mouse (if your system does not have a
    PS/2 mouse port) or the cradle for a handheld computer such as a PalmPilot.


    Parallel port This is a 25-pin female D-sub connector. The 25 pins are arranged
    with 13 pins in one row and 12 in the other. Printers are by far the most common
    device to use a parallel port, although models of scanners are parallel as well.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_40_0.png)


    Male

    in computer jargon, a male connector is one that has pins rather than holes.


    D-subnA type of connector with asymmetrically arranged pins or holes in multiple
    rows. The outer ring looks sort of like a capital D, which is where the term D-sub
    originates.


    Female

    A female connector is one that has holes rather than pins.


    Sound connectors On some PCs, the sound connectors are built-in; on other systems,
    they''re on a separate sound card in an expansion slot. Here they''re built-in.
    There are three identical round plugs—output for speakers, input for a microphone,
    and input for other devices.


    Joystick connector If the PC has a separate sound card, the joystick port will
    be on that expansion card. As shown here, it will appear with the built-in ports.
    A joystick connector is a 15-pin female D-sub connector with two rows: one with
    8 holes and one with 7.


    In addition to the built-in ports, your PC has an area of rectangular holes covered
    by metal panels. Each of these panels corresponds to an expansion slot in the
    motherboard. When an expansion card is plugged into a slot, its ports stick out
    of that hole. In the following figure, there are two expansion cards: a video
    card and a network card. On some budget systems, the video port is among the built-in
    ones; on higher-end systems, you can expect to find a separate video card.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_40_1.png)


