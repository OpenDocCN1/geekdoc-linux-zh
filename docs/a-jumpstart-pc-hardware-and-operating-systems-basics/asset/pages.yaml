  md: '# # Focus on Hard Drives


    #  Master/Slave Status


    Because each IDE ribbon cable can support two drives, it needs a way of distinguishing
    between them, so data coming through the cable ends up at the correct drive. This
    is handled through the drive''s master/slave status.


    Each drive is designated either the master or the slave. All data comes through
    the master drive''s controller, and anything addressed to the slave drive passes
    through it. The slave drive sees only its own traffic, but the master drive sees
    it all.


    Jumpers on the drive determine its master/slave status. There may be up to four
    different jumper positions on an IDE drive:


    Master This drive functions as the master. There may or may not be a slave drive.


    Slave This drive functions as the slave. There must be a master drive on the same
    cable.


    Cable select The drive''s master/slave status is determined by which ribbon connector
    is plugged into it. It requires a special cable and doesn''t work with all drives.


    Single If present, it is used when there is only one drive on the cable. If Single
    is available, it must be used rather than Master in a single-drive situation.


    To set a jumper, carefully remove the black cap that covers the pins and move
    it to another set of pins.


    Jumper cap


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_158_0.png)


    Sometimes you might see a jumper hanging off a single pin. This is a storage position;
    having a jumper over one pin is the same as not having the jumper at all.


    To determine the correct setting for the jumper, look for a chart on the drive''s
    label. The following chart goes with the jumper just shown. A little confusing
    because because it''s rotated 90 degrees, but get used to it—you''ll find this
    kind of confusion


    Master

    The drive designated to handle all the data traffic on the IDE cable.


    Slave

    The drive that receives all its data through the drive designated as master.


    Jumper

    A metal and plastic cap that fits over two pins on a circuit board, completing
    an electrical circuit between them and changing the flow of electricity through
    the board.


