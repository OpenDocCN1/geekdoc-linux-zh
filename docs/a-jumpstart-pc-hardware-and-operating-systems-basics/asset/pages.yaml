  md: '# Printing Basics

    How a Printer Communicates with a PC


    Now that you know something about how printers work, let''s look at how they work
    with the PC. You need to consider two factors: the physical connection between
    the pieces of hardware and the printer driver software in Windows.


    # Physical Connection


    The most common way to connect a printer to a PC is through the parallel port.
    Nearly all printers sold today have a parallel connector.


    At the PC end of a parallel printer cable is a 25-pin male connector, which fits
    into the 25-pin parallel port on the PC. The maximum length for a parallel printer
    cable is 10 feet; any longer than that and you begin to have problems with the
    signal breaking up. At the printer end of a parallel printer cable is a 36-pin
    male Centronics connector. It fits into a 36-pin female connector on the printer,
    and it is secured in place by wire loops:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_238_0.png)


    Many years ago, serial printers were common alternatives to parallel ones. Having
    a serial printer meant that you could have two separate printers on the same PC--one
    parallel and serial. Back then, PCs had only one parallel port and it was not
    as easy to add a second one via an expansion card as it is today. However, serial
    printers suffered from speed problems. Because a serial cable can send only one
    bit at a time, rather than a full byte as with a parallel cable, serial printing
    was extremely slow.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Chapter 12


    USB is fast becoming a popular way of connecting all kinds of devices to PC, and
    it works for printers too. Most printers sold today include a USB connector option,
    along with parallel. As with other USB devices, the advantages include more foolproof
    Plug and Play, the ability to connect/disconnect while the PC is on, and higher
    speed transfers.


    # Printer driver


    A piece of software that acts as a translator and traffic director between a printer
    and the operating system.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_239_0.png)


    # NOTE


    Printers can also connect to PCs via network interface. There are two ways to
    use a printer on a network. One is to connect it to a PC, which is then turn connected
    to the network; the other is a network interface built into the printer to connect
    it directly into the network, independent of any one PC. You''ll learn more about
    networking in Chapter 13, "Introductory to Networking".


    # Print spooler


    A program that holds print jobs in a queue while they are waiting to be printed.
    The spooler takes the pressure off the operating system, freeing it to work on
    other tasks.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_239_1.png)


    # Printer Drivers


    The printer and the operating system speak different languages. For them to work
    together, they need a translator. This translator is the printer driver, a file
    or group of files that take instructions from the operating system and relay them
    to the printer.


    # Installing a Printer Driver in Windows


    Some printers (particular USB ones) are truly Plug and Play. When you connect
    them, and Windows instantly notifies and prompts you for a driver. You insert
    disk (which came with the printer), click OK, and seconds later you''re ready
    to print.


    Other printers come with a full-blown Setup program on a CD-ROM. If Windows detects
    your printer, you can allow it to look for the needed driver on the CD-ROM, or
    you can click Cancel and then run the Setup program. Inkjet printers work better
    if you use the full Setup program for they often have their own print spooler
    software.


    If there is no Setup program for the printer, and Windows doesn''t detect it automatically,
    the next-preferable way is to use the Add Printer (or Add New Printer) utility
    in the Printers folder (Control Panel). This wizard walks you through the process
    of installing a driver. You''ll need to do this to install more than one driver
    for the same printer, or if you want to set up Windows to use a printer that''s
    not physically connected to your PC (that is, a network printer).


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_239_2.png)


    220'
  merge: -1
