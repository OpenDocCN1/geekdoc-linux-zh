  md: '# Understanding Memory


    EEPROM to tell it to prepare for an update. The utility sends the contents of
    the update file to the EEPROM and tells it that the update is over so it can close
    down again and return to being a read-only chip.


    > NOTE

    On some newer motherboards, the BIOS setup program has its own EEPROM access utility
    built-in, so that when you make changes in setup it writes directly to the EEPROM.


    RAM

    Random Access Memory. Memory that you can both read and write to.


    # Random Access Memory (RAM)


    Dynamic RAM

    RAM that requires constant electricity to retain its data. Abbreviated as DRAM.


    Most of the memory in a PC is RAM rather than ROM–Random Access Memory. “Random
    access” refers to the fact that data is not stored in any particular order. One
    area of RAM storage is just as easy to access as any other, unlike on a cassette
    tape where you must rewind and fast-forward to hit a particular spot.


    Static RAM

    RAM that retains its data until new data is received. Abbreviated as SRAM.


    # Static and Dynamic RAM


    Dynamic RAM (DRAM) is what most people mean when they talk about RAM; RAM that
    loses its data whenever there is no electrical charge flowing through the system.
    Inside a DRAM chip is a grid of tiny capacitors, each of which can store an electrical
    charge for a few milliseconds before it is refreshed. When a particular capacitor
    has a charge, it represents a 1 value. When it does not, it represents a 0. Because
    of this need to be continually refreshed, DRAM retains the data placed into it
    only as long as the PC is turned on. When electrical power is removed, everything
    in DRAM reverts to an un (0 value) state. That’s what we mean when we say RAM
    is volatile.


    Static RAM (SRAM) retains whatever it holds until it receives instructions to
    change. You can think of it as a series of switches–the switch is on until you
    flip it off, or it is off until you flip it on. No electricity is required to
    maintain its state. SRAM is used mostly for caches that assist the CPU by acting
    as temporary storage, as you learned in Chapter 4, “Understanding CPUs.” SRAM
    is very fast because it has low overhead–it does not need to expend any effort
    in retaining its data. In theory, a computer could use SRAM, but it would be very
    expensive.


    The most common usage of SRAM is in the caches that support the CPU. SRAM caches
    are necessary to maintain the speed limitations of DRAM. Because DRAM is slower
    than the CPU, there are always delays when moving data between DRAM and CPU. To
    minimize the performance hit, many CPUs have


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_98_0.png)'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Chapter 5


    one or more caches built into the CPU package. The CPU can save and retrieve data
    from the cache quicker than it can do from RAM, so the CPU can stash data that
    it probably will need again in the near few millions of a second (say, in the
    cache rather than DRAM for a performance boost. The L1 cache is on the front side
    (conceptually, not physically); it holds data waiting to enter the CPU. The L2
    cache is on the back side; it holds data waiting to leave the CPU and travel to
    DRAM.


    Because SRAM is specialized, whenever you see “RAM” you can usually assume that
    the reference is to DRAM. In the rest of this book, I''ll call it RAM.


    # RAM width


    The number of bits that the RAM can simultaneously accept. Analogous to a row
    on a spreadsheet.


    # RAM depth


    The number of rows that the RAM can simultaneously accept. Analogous to a column
    on a spreadsheet.


    # DIMM


    Dual Inline Module. A modern type of RAM packaging with 16 pins.


    # How RAM Stores Data


    RAM stores data in rows and columns, much like a spreadsheet, and each intersection
    of a row and column is a unique address containing one bit (containing either
    one or zero).


    Just like a spreadsheet, a RAM chip''s memory space has a vertical size and horizontal
    size. Its width is the number of cells, and its depth is the number of cells down.
    (This width of width will become important later when we talk about memory banks).


    The operating system uses RAM''s “spreadsheet” as a holding tank for itself, for
    open applications, for data files, and for many other purposes. The operating
    system keeps track of what is stored where, and then it signals to RAM to deliver
    the content of a particular memory address to the CPU at the needed time.


    # SIMM


    Single Inline Memory Module. An older type of RAM packaging with either 72 or
    30 pins.


    # Stick


    A small circuit board which is mounted multiple RAM chips. SIMMs and DIMMs are
    both sticks.


    Memory addressing in a PC is referred to in hexadecimal (“hex”), which you may
    remember is a numbering system with base of 16. A hexadecimal number has digits
    0 through 9 plus the letters A through F. Memory addressing is done in hex rather
    than decimal everything is in multiples of 8 or, and a base-16 numbering system
    fits the requirements very well.


    # Where RAM is Physically Located


    The system''s main DRAM comes from mini circuit boards called DIMMs (Dual Inline
    Memory Modules) or SIMMs (Single Inline Memory Modules) that fit into slots in
    the motherboard, as you saw in Chapter 2, “A Look Inside PC.” These are commonly
    referred to as sticks of RAM. You''ll learn more about them in the Packaging section
    in this chapter.


    There are other types of DRAM in a system too. For example, a video card typically
    has its own RAM, somewhere from 4MB to 64MB of it. This RAM may be soldered permanently
    to the video card, or it may exist as removable


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_99_0.png)'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Understanding Memory


    DIPP chips. (Recall from Chapter 4 that a DIPP is a rectangular chip with legs
    on two sides, looking somewhat like a centipede.)


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_100_0.png)


    Cache on a Stick

    A type of SRAM that serves as an external CPU cache, found mainly on older systems.


    Depending on the age of the system, there may be other pieces of RAM on the motherboard
    as well. For example, in some early systems that did not incorporate a cache in
    the CPU packaging, a separate cache module was available that plugged into a slot
    on the motherboard. These were called Cache on a Stick, or CoaST.


