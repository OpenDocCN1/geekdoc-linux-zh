    Product activation

    An activating measure in Windows XP and other Microsoft applications that makes
    it nearly impossible to install the software on additional PCs once it has been
    installed and activated on another PC.


    A computer that does not exceed the requirements will likely run Windows very
    slowly; in all cases, a faster CPU and more memory will improve performance substantially.


    Office supply and computer stores will gladly sell you a copy of the most recent
    Windows version. However, if you decide that an older OS is the right choice for
    a particular PC, you might need to pick up a used copy. Try eBay (www.ebay.com).
    If you buy a used copy, make sure it comes with the installation key code, a 25-digit
    combination of numbers and letters (usually; original equipment manufacturer (OEM)
    copies may have different numbers) that you need when you install the product.


    In addition, if you bought a used copy of Windows XP, make sure that copy has
    never been activated. Product activation locks the installation key code to the
    hardware on which it was originally installed, so you can''t install it on another
    PC.


