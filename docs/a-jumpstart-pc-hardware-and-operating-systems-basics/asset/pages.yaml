  md: '# Internet Connection Sharing


    Windows 98 Second Edition, Windows Me, Windows 2000, and Windows XP all have a
    feature built in called Internet Connection Sharing (ICS) that allows a LAN-connected
    computer to share its Internet connection with other PCs on the LAN. This makes
    it possible for a family to have a single broadband Internet connection with multiple
    PCs to access the Internet simultaneously. The PCs that will be using the shared
    connection do not necessarily have to be a particular Windows version, as long
    as they have at least Windows 95; because the wizard that sets up the connection
    can make a configuration floppy disk to take each PC that enables it to access
    the shared connection.


    In a nutshell, here is how it works. The main-connected PC has a single IP address
    by which it is known on the Internet for the duration of its connection. That''s
    the ''real'' IP address. When another PC on the network wants to use that connection,
    the sharing PC assigns it a separate IP address using a set of private addresses
    for local use. Whenever traffic comes in or out, the sharing PC shuttles the data
    to the internal IP address for the requesting PC. This is like when a group of
    people are at a restaurant and one person orders for the entire table. Each tells
    the orderer what she wants, and then the orderer speaks in a single voice to the
    waiter, conveying all the orders.


    Windows 98 Second Edition has a special wizard that sets this up; it is found
    on the Accessories menu. In Windows Me, the setup is built into the Internet Connection
    Wizard. In Windows XP, the setup is built into the New Connection Wizard. When
    you set up the connection, you are asked whether you want to share it or not.


    To turn the sharing feature off or after the initial configuration, display the
    properties for the shared connection. In Windows 98 and Me, a sharing button opens
    a box where you can turn it on or off. In Windows XP, a check box for Internet
    Connection Sharing appears on the Advanced tab.


    Another way to share an Internet connection is with a router. If you have cable
    or DSL Internet and a home network, you can hook the incoming cable or DSL line
    to a router and then hook up each PC in the network to that router. The router
    will provide the internal IP address translation needed to share the connection.
    You don''t need any special version of Windows in order to do that, but you may
    find that the router costs as much as a Windows upgrade cost. Some ISPs frown
    on this sharing, and they even explicitly forbid it in their member agreements
    and terminate your service if they find out you are doing it. Others dont'' mind
    and will even help you set it up.


    **Virtual private IP addressing** Assigning internal IP addresses to PCs that
    are separate from external IP addresses in order to share an external IP address
    among multiple PCs. Private IP addresses begin with 192.168.0.1 to 192.168.255.254.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_354_0.png)


    335'
