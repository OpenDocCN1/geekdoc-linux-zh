  md: '# Write-Protecting a Floppy


    To write-protect a floppy disk, slide the little black tab up so that the hole
    in the corner of the disk is open.


    Write-protect

    To make a disk read-only so that nothing can be changed, added, or deleted on
    it.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_187_0.png)


    Old 5.25-inch disks had a tab in the side of the disk casing, and you had to cover
    that tab with a little sticker to write-protect the disk. This was the opposite
    of the deal with modern disks, where you expose a hole rather than closing it
    up.


    # Common Problems with Removable Drives


    We''ll round out this chapter by looking at some of the problems users encounter
    with removable drives and some possible solutions.


    **BIOS Won''t See Drive** The drive may be physically defective, or it may not
    be hooked up correctly. Check the ribbon cable at both ends to make sure the red
    stripe is with pin 1. On an IDE or SCSI drive, check the jumpers (and termination
    for SCSI). On all drives, check the power supply connector.


    In the BIOS setup program, try setting the drive type to Auto, CD-ROM, or ATAPI
    for an IDE CD-ROM. For a floppy drive, you will need to tell the BIOS exactly
    what size and capacity of drive it is.


    **Floppy Light Stays On** If the floppy drive doesn''t work and its lights are
    on all the time, the ribbon cable is plugged in wrong at one end or the other.


    **No Drive Light** If the drive doesn''t work and its activity never comes on,
    it is not receiving power. Try a different power supply connector.


    **Windows Can''t Read Disk** Try a different disk to determine whether the problem
    is the disk or the drive. If it''s the drive, the drive may have misaligned heads.
    (There''s not much you can do about other than replace the drive.) If it''s the
    disk, the disk may have a scratch on it or be going bad. Try running Scandisk
    (and Check Disk in Windows 2000/XP) as described at the end of Chapter 8 to correct
    problems with a disk.'
