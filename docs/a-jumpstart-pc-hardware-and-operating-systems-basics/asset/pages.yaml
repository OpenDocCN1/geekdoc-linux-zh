  md: '# Focus on Removable Disk Drives


    drag-and-drop capability, thanks to a feature called packet-writing. You must
    install packet-writing software in order to enable this feature. Most drives come
    with a packet-writing program; one such program is Adaptec''s DirectCD. Once installed,
    it loads automatically when Windows starts up.


    # TIP


    When referring to a CD-ROM, the spelling is disc rather than disk. To keep it
    straight, think round versus square. Any disk that is square is a disc with a
    K (hard disks and floppy disks). Any disk that is round is a disc with a C (CD-ROM,
    DVD, and so on).


    Packet writing

    A feature that enables a

    CD-RW disc to be treated

    as a regular disk, and to

    be written and rewritten

    multiple times.


    # DVD Drive


    A DVD drive looks and works just like a regular CD-ROM drive most of the time,
    but it can also read DVD data discs as well. It needs no special utilities, applications,
    or support to this.


    If you want to play DVD movies on your PC using a DVD drive, you must have MPEG
    decoding capabilities. MPEG compression is used to store the sound and picture
    for movies. A PC and its normal components don''t have enough firepower to handle
    that amount of data all by themselves. An MPEG decoder takes on that burden and
    does all the decompressing needed for displaying the movie.


    Early DVD drives required a separate expansion board to function as the MPEG decoder.
    Later on, some video cards were introduced that handled this function as a piggyback
    to their regular video card duties. Lately, software MPEG decompression has become
    popular, as programmers have figured out ways to make software a good job of decoding
    without unduly burdening the rest of the PC. However, a separate expansion board
    for MPEG decoding still results in the best quality movie playback with the least
    disruption to the PC''s other operations.


    If you do have a separate MPEG decoder board or decoding on the video card, a
    cable must be installed that runs from the DVD drive to that circuit board.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_184_0.png)'
