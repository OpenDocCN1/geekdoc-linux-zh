  md: '# A Few Other Essential Components


    # Amps


    There is not just one pair of positives/negatives; there are billions upon billions
    of them, just like there are billions of water molecules in a rushing river. A
    single water molecule cannot turn a waterwheel, but when billions of them work
    together, they can make the wheel spin really fast. The volume of electricity
    is the current, just like with water flow. Current is measured in amperes, or
    amps for short.


    # Current


    The volume of electricity flowing through a circuit. Measured in amps.


    # Amps


    Short for amperes. A measurement of electricity current or rate of flow.


    # Watts


    Wattage is the overall amount of power a device uses. It''s determined by multiplying
    volts by amps. So, for example, a 75-watt light bulb uses 0.68 amps of 110 volt
    power (because 110 times 0.68 is approximately 75).


    A light bulb is a good example because different wattages of bulbs will work in
    the same light socket. For example, suppose someone replaces a 75-watt bulb with
    a 100-watt bulb; the device would still use 110v, but it would draw about 0.91
    amps.


    # Wattage


    The amount of electricity a device uses, determined by multiplying volts by amps.


    This illustrates an important point: the amperage is controlled by the device
    receiving the power. The device "draws" the amps it needs out of the outlet; the
    outlet doesn''t push the amps out proactively. When different devices connect
    to the same extension cord, each one uses the same voltage but different amps,
    resulting in different wattages.


    # Resistance


    The amount of obstacle in an electrical path.


    # Resistance


    The positives and negatives always seek each other through the shortest, easiest
    path they can find; this is the path of least resistance. That''s not an old cliché.
    Resistance is an electrical term that measures the amount of obstacle placed in
    the electricity''s path, and it is measured in **ohms**. The Greek omega symbol
    (Ω) represents ohms as a unit of measure.


    # Ohms


    The unit of measurement for resistance.


    Resistance measurements are used to describe the path(s) that electricity can
    take. Given the choice, the electricity will always prefer the lower resistance.
    Electricity needs a resistance of less than 20 ohms in order to be able to connect
    negative and positive. Infinite ohms (abbreviated with the "infinity" symbol ∞)
    means there is total resistance—that is, no possible path.


    Resistance does not have to do with any of the other factors discussed so far—it''s
    a measure of the device itself. So resistance is always tested when the device
    is removed from any power source. Why? Because a device will always


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_218_0.png)


    199'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Chapter II


    have the same resistance—that is, same capacity for impeding electricity from
    passing through it freely—no matter what electricity is available to it.


    # Grounding


    Just as water is always seeking sea level, and will flow downward until it gets
    there, electricity is always seeking the ground. When people get struck by lightning,
    the electricity takes a path to the ground through their bodies. When birds sit
    on an electrical line, they don''t get electrocuted because they are not touching
    the ground. The electricity has no reason to pass through the bird''s bodies because
    the birds do not offer a path to the ground. If a bird (say, a really big bird)
    were to put one foot on the wire and the other foot on the ground, the bird would
    get fried, as would a human.


    Remember back in Chapter 1 when we talked about the importance of grounding with
    static electricity? That principle is in effect for the power coming from the
    wall outlet to the PC as well. The third prong on a connector—the round one—is
    a ground line, and it plays no role in the normal-and-alternate flow through the
    socket. Instead, it''s there to provide a path of very little resistance to the
    ground should it be needed (for example, if a short-circuit occurs that dumps
    a lot of electricity into the system at once). It''s a safety feature—nothing
    more.


    # AC versus DC


    Earlier I explained how the negatives travel from one of the holes in the wall
    outlet to the other, looking for positives. That was an oversimplification. In
    fact, the holes alternate between positive and negative times per second. The
    speed at which they alternate is measured in cycles per second, or herz (Hz).
    Ordinary household electricity alternates at 60Hz. This type of delivery is called
    alternating current (AC). AC is a more efficient way of sending power over wires,
    especially over long distances. When devices run on battery power, however, they
    use direct current (DC). With direct current, power always flows the same direction
    all the time—from negative to positive. Batteries use DC because they have no
    need to be far away from the devices they power and because it requires lower
    overhead (which is desirable for a simple, battery-operated system).


    PC components require DC power, but the wall outlet supplies AC, so one of the
    jobs of the power supply is to convert AC to DC. We''ll look at this further in
    the next section.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_219_0.png)


    200'
