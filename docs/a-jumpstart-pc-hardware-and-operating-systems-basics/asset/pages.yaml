  md: '# Appendix C


    PCMIA Also called PC Card. A standard for credit-card size devices that plug into
    a notebook PC. There are three sizes: Type I (for memory), Type II (for most devices),
    and Type III (for drives).


    Power sag Occurs when the power supply doesn''t get enough power. It''s also called
    brown-out. You may have experienced this in your home when the lights dim and
    buzz for a moment but don''t go out completely.


    Peer-to-peer network A network that consists only of clients, with no central
    server.


    Power surge A power surge occurs when the power supply gets too much power. It
    can cause the PC to reset, the power supply to burn out, or circuits to go bad.
    A power spike is like a surge only much and more likely to permanently damage
    hardware.


    PGA Pin Grid Array. A type of CPU with a grid of pins on its underside that fit
    into a motherboard socket.


    Power Good Wire Also called Power OK wire The wire from the supply to the motherboard
    that tests the power supply''s performance before the rest of the system starts
    up.


    Physical drive The entire physical hard disk, encompassing all partitions and
    logical devices.


    Piezoelectric inkjet printer An inkjet printer that moves the ink through the
    print nozzles by applying electrical charges to piezoelectric crystals.


    Ppm Pages per minute, a measurement of printer output speed.


    Pit An area of an optical disk that is indented, resulting in less light reflecting
    back from it.


    Preemptive Multiple applications taking using the main CPU with the PC itself
    in charge of how much time each application gets once.


    Pixel A dot with a separately described color from the surrounding dots on the
    display.


    Primary corona wire A negatively charged wire in a laser printer applies a uniform
    -600v charge to the drum in preparation for writing a page to.


    Platen The roller bar behind the impact printer that absorbs the impact and keeps
    the paper in place.


    Print resolution The number of individual dots that made an image, measured in
    dpi.


    Plug and Play A standard for devices to talk to operating systems to report their
    specifications and driver requirements can set them up without user intervention.


    Print spool A program that holds print jobs in a queue while they are waiting
    to be printed. The spool takes over the operating system, freeing it to work on
    other tasks.


    Plug and Play A standard for detecting new devices and installing drivers them
    automatically. To work, it must be supported by the device, the motherboard chipset,
    and the installed operating system.


    Polarity The positive or negative aspect of an electrical voltage. A charge can
    have either a positive polarity or a negative polarity.


    Printer driver A piece of software that acts as a translator and traffic driver
    between a printer and the operating system.


    Product activation An anticopy measure in Windows XP and some other Microsoft
    applications makes it nearly impossible to install the software on additional
    PCs once it has been installed and activated on another PC.


    POST Power-On Self Test. A set of low-level hardware diagnostics that confirm
    the basic operability of the motherboard, memory, CPU, and some other essential
    components.


