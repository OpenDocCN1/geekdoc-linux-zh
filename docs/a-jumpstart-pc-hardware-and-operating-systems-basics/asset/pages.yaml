  md: '# Measures of Hard Drive Performance


    When shopping for a hard drive, you''ll be bombarded with lots of specifications.
    Which are important? Which are.not? The following sections help sort it out.


    # Maximum Data Transfer Rate


    Here''s an important specification: how quickly the drive can input and output
    data. On an ATA drive, this is tied in the ATA specification to which the drive
    conforms. An UltraDMA/66 drive can transfer up to 66MB/sec, for example.


    Not all drives that conform to a particular standard are necessarily capable of
    achieving transfer rate, though, especially on a sustained basis. Therefore, this
    specification is more of a theoretical measurement, a means for comparing two
    drives "on-paper" capabilities, rather than an actual measurement of a particular
    drive.


    In addition, the same drive might not always be capable of its theoretical maximum
    because of external factors. For example, if the motherboard''s IDE interface
    does not support UltraDMA, the maximum transfer rate would be bottlenecked by
    the motherboard. A drive that would normally support 66MB/sec might be limited
    to only 16MB/sec or even less by an old motherboard. And as mentioned earlier,
    an IDE drive is limited to the maximum data transfer rate that it can agree upon
    with the other IDE drive on the same cable.


    # Read and Write Seek Times


    These measurements tell how quickly, on the average, the drive can locate a particular
    piece of data to be read (read seek time) or locate a particular spot on the drive
    to write (write seek time). These measurements are expressed in milliseconds (ms).
    An average read seek time might be 9ms, and an average write seek time might be
    12ms. Lower is better.


    # Latency


    The drive''s average latency is the amount of time between when a command is issued
    to it and when it kicks in and executes it. It is measured in milliseconds too;
    an average amount is 5ms. Lower is better.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_162_0.png)'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Rotational Speed


    Some drives are advertised according to their rotational speed—that is, the speed
    at which the drive spins its disks or platters, in revolutions per minute (RPM).
    Generally speaking, a higher RPM means higher drive performance. An RPM of 5600
    is typical of an UDMA/33 drive, while an RPM of 7200 is commonly found on UltraDMA/66
    drives.


    Rotational speed in and of itself is not that important. We don''t care how fast
    the drive spins; we only care how fast it retrieves and stores data. However,
    faster RPM is typical of better performing drives, so the two factors are indirectly
    connected.'
  merge: -1
