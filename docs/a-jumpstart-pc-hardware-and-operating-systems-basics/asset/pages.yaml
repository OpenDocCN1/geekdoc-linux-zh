    some of the frames automatically with the use of keyframes. Let''s say you want
    to animate an object moving from point A to B. With computer animation, you could
    create a still image of the object at point A and another one at point B, and
    the computer could fill all the other frames between them.


    Many computer programs that contain lots of animation keyframes for their animation,
    so that the computer program doesn''t have to send such a staggering amount of
