    use an alcohol-dipped cotton swab if you don''t have one. Be very careful not
    to break them. On some printers, corona wires are not present at all or not user-accessible.


    **Drum** You should never, ever touch the drum directly, because it''s easy to
    scratch, and a scratched drum leaves a scratched image on every printout. Instead,
    use the printer''s built-in cleaning utility program if there is one. Many Hewlett-Packard
    LaserJet printers have such a utility. The procedure involves running a sheet
    of paper through the printer so that a heavy layer of toner adheres to the paper,
    and then running the same sheet through again to pick up excess toner from the
    drum. If your printer doesn''t have such a utility, you don''t need to clean the
    drum. Some models include the drum in the toner cartridge, so that it''s replaced
    with each new toner cartridge; on such printers drum cleaning is not an issue.


    **Cleaning pad** On some printers, a felt pad cleans off excess toner. It''s mounted
    on a hard plastic strip. If your printer model uses a felt pad, a new one will
    be included with the toner cartridge and will need to be replaced at the same
    time as the cartridge. Look in the printer''s manual to determine the location
    of the pad and how to change it.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_33_0.png)


    **Inside plastic parts** If any paper debris or dust is on the open plastic areas
    inside a printer, you can wipe it off with a slightly damp cloth.'
