  md: '# Adjusting Display Settings in Windows


    The Display Properties in Windows is your one-stop shop for changing settings
    pertaining to the monitor and video card. To access Display Properties, right-click
    the Desktop and choose Properties. Then click the Settings tab for access to the
    settings affecting your video card and monitor.


    Here''s an overview of what you can do from the Settings tab in Windows 2000;
    Windows 9x is similar. Explore these on your own in whatever version of Windows
    you have.


    +   - Change the resolution with the Screen area slider and color depth with the
    Colors drop-down list.


    +   - Click the Advanced button and then the Adapter tab for information about
    the video card. From there, click Properties to work with the video card driver
    or click List All Modes to see a comprehensive list of all the resolution, color
    depth, and refresh rate combinations that the installed hardware can support.


    +   - Click the Advanced button and then the Monitor tab to see information about
    the monitor. Click Properties to change the monitor driver, as you saw earlier,
    or choose a different refresh rate from the Refresh Frequency drop-down list.


