  md: '# Troubleshooting Windows Problems


    # # Doing a Controlled Shutdown


    Usually when one error occurs, it starts a domino effect of other errors, the
    best thing to do is to shut down and restart to clear the slate. Here''s a procedure
    for shutting down when the system is acting a little (or a lot) iff:


    +   1. Try to shut down as many running applications normally as possible, especially
    those with unsaved work that you want to save. Switch to the program and save
    your work, and then shut it down with File Exit or by clicking its Close (X) button.

    2. Try the Start > Shut Down command. If the mouse is not working, try pressing
    Alt+F4.

    3. If that doesn''t work, shutting down from the Task Manager. Press Ctrl+Alt+Delete.
    In Windows 9x and XP, this brings up a list of running programs; in Windows 2000,
    you must click Task Manager to see the list. From that dialog box, click Shut
    Down. Depending on the Windows version, Shut Down might be a button, or it might
    appear in the menu bar as shown here.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_336_0.png)


    +   4. If you can''t shut down from the Task Manager, try to terminate the nonresponsive
    program that is preventing shutdown. To do so, press Ctrl+Alt+Delete. Click the
    nonresponsive program, and then click End Task. Repeat for each program that reports
    Not Responding next to it. Then try Shut Down again.'
  merge: -1
