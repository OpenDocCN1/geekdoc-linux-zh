    Ergonomic keyboard A keyboard designed to minimize the stress on the users'' hands
    and wrists.


    Driving time The amount of time that passes between reading one bit and reading
    the next bit on a drive.


    Expanded memory Additional memory 1MB supplied by an expansion board for 80286
    PC


    D-sub A type of connector with asymmetrically arranged pins or holes in multiple
    rows. The outer rings look like a capital D, which is where the term D-sub originates.


    Expansion bus The bus used by ISA expansion. Slow and old; soon to be obsolete.


    Dual-boot A system on which (two or more) operating systems are installed, each
    on a separate partition. At startup the user can choose which should


    Extended memory Additional memory 1MB on a motherboard.


    External data The bus transfers data from outside the CPU to inside and then back
    again.


    Dynamic IP address An IP address that is assigned from a pool of available addresses
    upon connection, and released upon disconnection.


    External speed The system crystal speed, which controls the CPU''s speed.


    Dynamic RAM RAM requires constant electricity to retain its data. Abbreviated
    as DRAM.


    Female A female connector is one that has holes rather than pins.


    Electromagnetic A magnetic field created by electricity.


    File A copy of computer data stored under a single name.


    Electromagnetic interference (EMI) The corruption of a signal by the magnetic
    field of another nearby electrical device.


    File Allocation Table (FAT) A table that keeps track of the content of each section
    of the disk The operating system uses it whenever it needs to open or save a file.


    File extension A code (usually three characters) following a file''s name identifies
    identifies file type. For example, in MYFILE.DOC, the doc indicates a document.


    Electrostatic discharge (ESD) An electric shock occurs when two objects of uneven
    charge come in contact with one another. Otherwise known as static electricity.


    Fixed IP address An IP address that never changes, permanently to a specific client.


    EMM386.EXE A memory management utility that allows the operating system to use
