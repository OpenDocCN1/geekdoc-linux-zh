  md: '# Chapter 6


    Color depth is measured in bits. For example, 4-bit color supports 16 unique colors.
    A four-digit binary number has 16 possible combinations; therefore, the video
    card needs to send four digits for every pixel to the monitor. With 16-bit color,
    you get 256 unique colors, but the video card must send 16 digits to the monitor.
    To calculate the number of colors in a particular bit depth, take 2 to the nth
