  md: '# Chapter 15


    # # Starting with a Windows 9x

    Startup Disk


    Startup disk


    A bootable floppy disk

    containing command line

    utility programs

    troubleshooting.


    A startup disk is a bootable floppy disk containing command line utility programs

    t can be used to troubleshoot and correct serious system errors that prevent

    Windows from starting. You can create a startup disk in the 9x versions of Win-nows
    (95, 98, or Me) but not with any of the NT-based Windows versions (NT 4,2000,
    or XP). It doesn''t work with NT-based versions because they are not based

    on a command line operating system (like MS-DOS), they have no native

    command line interface behind the GUI to fall back to. With NT versions of

    Windows, instead you have the Recovery Console, which is discussed later in

    this chapter.


    RAM disk


    A temporary virtual hard

    disk created out of RAM.


    # # Making a Startup Disk


    The best time to think about a startup disk is before anything goes wrong. Make

    one now, so you''ll have it later when you need it. To make a startup disk:


    +   1. Insert a blank floppy disk (or one that contains nothing you want to

    keep) into your floppy drive.


    +   2. Choose Start > Settings > Control Panel and double-click Add/Remove

    Programs.


    +   3. Click the Startup Disk tab, and then click Create Disk.


    +   4. Follow the prompts to create the startup disk.


    +   5. Label it Startup Disk, along with the Windows version number, and

    store it somewhere safe.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_295_0.png)'
