  md: '# Chapter 4


    There have been other variants of the SEC CPUs besides the Slot 1 type, but most
    of them don''t look any different from the outside than the Pentium II model just
    shown. For example, early versions of the Pentium III used an SEC cartridge design
    with internal improvements. It required a slightly different motherboard slot
    called SEC-2.


    # Slot A


    A motherboard slot that accepts an AMD SEC cartridge.


    Intel''s primary competitor, AMD, also came out with its own SEC-style CPU, the
    Athlon. It was physically compatible with a Slot 1 slot but not pin-compatible.
    In other words, the Athlon CPU could not be used in a motherboard designed for
    a Pentium II, but motherboard manufacturers could create motherboards for the
    Athlon using the same parts that they used for Pentium II motherboards. AMD called
    theirs Slot.


    Intel''s Celeron CPU, a popular low-cost alternative to the Pentium II, also used
    a Slot 1 compatible design. However, instead of having the plastic outer cartridge,
    the Celeron''s circuit board was bare, allowing users to strap fans directly onto
    the CPU chip as with a PGA CPU. The result was a sort of hybrid PGA and SEC effect,
    with a PGA socket and cooling fan mounted on a circuit board at a 90-degree angle
    to the motherboard. This type of CPU is called a Single Edge Processor Package,
    or SEPP. The latest CPUs today (Pentium III and Pentium 4 and beyond) have gone
    back to a PGA design, for two main reasons. One is the cost-it''s much cheaper
    to produce PGAs. The other is motherboard design—the PGA packaging takes up much
    less space.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_87_0.png)'
