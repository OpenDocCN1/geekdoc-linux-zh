  md: '# Chapter 15


    In Windows 2000, it''s called the Advanced Options menu and it looks like this:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_293_0.png)


    # Safe mode


    A limited-functionality Windows troubleshooting mode in which only essential drivers
    are loaded.


    # VGA display


    A display mode consisting of 640×480 resolution and 4-bit color depth (16 colors).


    # Safe Mode


    Safe mode is a GUI operating mode in which the drivers for all nonesential hardware
    remain unloaded. This circumvents any startup problems that might be occurring
    due to device conflicts. For example, let''s say you have just bought a new scanner
    and loaded the software for it, and now Windows won''t start. It''s a good bet
    that the driver for the scanner is causing the problem, so you could start the
    computer in Safe mode and then remove the scanner software. (That''s a short-term
    solution, of course; in the long run you would want to go to the scanner maker''s
    website and find out why it''s not working with your Windows version or your PC.
    Maybe a downloadable fix is available.)


    Safe mode also loads a generic VGA display rather than the specific driver for
    your video card. It does just in case the problem is being caused by a corrupted
    video driver file. When you''re in Safe mode, the words ''Safe mode'' appear on
    the Desktop in the corners so you won''t forget. Depending on the Windows version,
    a troubleshooting Help window might also appear.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_293_1.png)


    274'
