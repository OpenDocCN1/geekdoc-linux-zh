  md: 'Exploring the inside of your PC can be educational and fun. Before you dive
    in though, you''ll need to be aware of some potential perils to both your well-being
    and the PC’s. In this chapter, you''ll learn the safe ways of interacting with
    PC hardware, including:


    +   - Avoiding electric shock

    - Disposing of PC-related hazardous materials safely

    - Preventing electrostatic damage to a PC

    - Avoiding electromagnetic interference

    - Preventing PC problems caused by power fluctuation

    - Cleaning a PC and its associated parts'
  merge: -1
