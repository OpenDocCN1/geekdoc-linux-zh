  md: '# A Few Other Essential Components


    # Keyboard Types and Features


    Until the last few years, all keyboards used the keyboard interface built into
    the motherboard. However, many keyboards use the USB interface these days, and
    in future systems, there might not even be a motherboard keyboard connector. There
    are also wireless keyboards that use an infrared system for connecting to the
    PC.


    There have been many different keyboard layouts over the years, with newer models
    adding more keys. For example, the original IBM PC keyboard did not have a separate
    set of arrow keys; the arrow keys were built into the numeric keypad. In addition,
    the original keyboard had function keys along the side of the normal keys, but
    in later versions they were moved to a row across the top. Knowing the different
    keyboard layouts and their differences is not important—just know that not all
    keyboards have the same keys.


    Many keyboards made in the last several years are Windows keyboards. This basically
    means that they have a couple of extra keys that perform special functions in
    Microsoft Windows:


    +   - The Windows key opens the Start menu (the same as if you had clicked the
    Start button). There are two of these, next to the two Alt keys.

    - The Menu key opens a shortcut menu (the same as if you had right-clicked).


    Ergonomic keyboard

    A keyboard designed to minimize the stress placed on the users'' hands and wrists.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_210_0.png)


    Many keyboards have a split design to help users avoid wrist strain. Such keyboards
    typically have a wrist rest (a sloping platform in front of the keyboard) built
    into them as well. They are called ergonomic keyboards.


    And finally, some keyboards have buttons across the top that users can press as
    shortcuts to issuing commands. For example, my keyboard has a Mute button'
