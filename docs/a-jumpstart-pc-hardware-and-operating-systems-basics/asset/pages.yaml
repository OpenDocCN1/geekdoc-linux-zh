    # Common Modem Problems


    As I mentioned earlier, a good 25 percent of the service calls I make involve
    problems with modems and Internet access. Beginners seem more likely to use a
    modem for Internet connection than advanced PC users, so perhaps that''s why modem
    users seem to require more help. Here are some of the common problems I''ve found
    with modems and some possible solutions.


    # Windows Doesn''t See Modem


    Check to make sure there aren''t any jumpers set on the modem that are conflicting
    with the Plug and Play settings that Windows may be trying to use. Then look in
