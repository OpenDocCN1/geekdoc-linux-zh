    # Precautions to Avoid Viruses


    You can do several things to prevent virus infections on a PC:


    +   - Buy and install an antivirus program such as Norton Antivirus, and keep
    it updated by downloading the latest virus definitions. Some programs check for
    updates automatically at certain intervals. An antivirus program cannot catch
    the latest viruses if it has out-of-date definitions.


    +   - Do not open e-mail attachments from people you don''t know. Even if it comes
    from someone you know, scrutinize it carefully before opening. If the message
    has odd wording, or if it doesn''t "sound" like your friend, it''s probably a
    virus. Remember that some viruses e-mail themselves to everyone in an address
    book, so your friend might himself be a virus victim.


    +   - If possible, use an antivirus program that scans incoming e-mail.


    +   - So you can accurately see the extensions of all files, turn the file extension
    display back on Windows. In a file management window, choose Tools > Folder Options,
    click the View tab, and clear the Hide Extensions for Known File Types check box.


    Antivirus program that monitors files for specific strings of characters that
    are associated with viruses and then quarantines and offers to repair or delete
    the affected files.


    Virus definitions A data file containing the text strings that the antivirus program
    searches to determine whether virus infection exists.


