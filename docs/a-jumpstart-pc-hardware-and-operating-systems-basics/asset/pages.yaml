  md: '# Chapter 14


    When Setup runs on a PC that already contains Windows, you have the option of
    specifying that you don''t want an upgrade, but would prefer a fresh installation
    in a different folder. However, you cannot use your old version of Windows anymore
    after the upgrade if you do choose a different location. If you need to dual-boot
    (that is, you have two different operating systems installed on the same PC and
    be able to switch between them), see the next section, which explains how that
    works.


    Dual-boot

    A system on which two (or more) operating systems are installed, each on a separate
    partition. At startup the user can choose which one run.


    # Dual-Booting


    Dual-booting consists of installing multiple operating systems on a single PC,
    each on a separate partition. When then a menu appears enables you to select which
    of the operating systems you want.


    Third-party software has been available that allowed dual-booting of all operating
    systems for some time. However, Windows NT, Windows 2000, and Windows XP can dual-boot
    with other operating systems without any add-on software if you set them up correctly.


    To set up dual-booting between two operating systems where one of does not support
    dual-booting directly (for example, Windows 95, 98, or Me), you must install the
    non-supported one first so that it is on the primary partition. Then when you
    install the operating system that is dual-boot capable, it will notice that another
    operating system is already installed and it will enable you to set up dual-booting.


    For example, to dual-boot between Windows 98 and Windows 2000, here''s what you
    would do:


    +   1. Install two hard disks in the PC, or partition a single hard disk into
    multiple drive letters.

    2. Install Windows 98 on the primary partition (the C: drive).

    3. Boot from the Windows 2000 CD-ROM, and let the Setup program start running.
    When asked whether you want to upgrade or install a new copy, choose one of the
    other partitions (the D: drive or higher).

    4. Continue installing Windows 2000 normally.


    When you''re finished, a BOOT.INI file (a hidden file) will be in the root directory
    of the primary partition; this contains the menu that will appear each time you
    start the PC. By default, this menu will appear onscreen for 30 seconds at startup.
    If no action is taken during that time, it will automatically boot to the default
    OS.


