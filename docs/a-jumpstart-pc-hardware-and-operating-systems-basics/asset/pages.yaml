  md: '# Chapter 19


    # # Understanding Internet Protocols


    Protocol

    Generically, a set of rules governing a situation. When referring to communications,
    a set of rules that specify how the data is sent and received.


    There''s a veritable alphabet soup associated with Internet connectivity, but
    you don''t have to memorize all of the acronyms and protocols to set up an Internet
    connection—thankfully! However, if you decide to take the A+ exam, you will need
    to study them. Here''s the briefest of overviews.


    # ## TCP/IP


    TCP/IP

    Transmission Control Protocol/Internet Protocol: A set of communication standards
    for sending and receiving data over a network.


    A lot of other standards fall under the big tent of TCP/IP, because it''s not
    actually a single standard, but rather a whole collection of standards, and they
    apply not only to the Internet but to networking in general. Here are some of
    the key points involved in TCP/IP.


    # ## IP Addresses


    Fixed IP address\An IP address that never changes, assigned permanently to a specific
    client.


    The "IP" part of TCP/IP stands for Internet Protocol. You may have heard of IP
    addressing before—it''s a way of assigning a unique numeric address to a particular
    PC or network resource so that other PCs can access it from anywhere in the network.
    An IP address is a string of four three-digit numbers separated by:


    ```

    207.150.192.12

    ```


    Each number does not necessarily have to be a full three digits; leading zeros
    are assumed (i.e., 012 is the same as 12).


    An IP address is actually four eight-digit binary numbers. For example, 207.150.192.12
    is 11001111.10010110.11000000.00011000 in binary. But just trying to into a web
    browser! That''s why IP addresses are normally converted to decimal. It makes
    them easier to read and remember.


    > > TIP You can use the Windows Calculator to convert numbers between binary and
    decimal. To do so, choose View > Scientific and then click the Click button. Type
    in the binary-base number, and then click the Bin button. The binary equivalents
    appears


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_345_0.png)


    When you set up an Internet connection on a PC, you can handle IP addressing in
    two ways. One is to enter a fixed IP address for it. Such an address would be


    326


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_345_1.png)'
