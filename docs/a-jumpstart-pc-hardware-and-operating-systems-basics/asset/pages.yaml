  md: '# Chapter II


    # Electricity Basics


    Most PC technicians don''t need to work with electricity—at least not much. Nonetheless,
    the A+ exam has several questions about electricity, if you want to ace the test
    you have to study electrical concepts. With that in mind, the following is an
    extremely abbreviated tutorial in electrical concepts and measurements.


    # Volts


    The measurement of the strength of a positive or negative electrical charge.


    # Positive and Negative Charge


    When you plug in an electrical device to a outlet, two prongs must insert Into
    that outlet (some plugs have an optional third prong for grounding). One prong
    is positive; the other is negative. Electricity flows into the negative prong
    through the device, and then back out the positive prong into the socket.


    Positives and negatives are very attracted to one another, and they are always
    looking for any opportunity to get together. (Think Romeo and Juliet—or your neighbor''s
    male cat and your female cat) Positives are repelled by other positives, and negatives
    are repelled by other negatives. We start with a whole bunch of negatives together
    in one prong of an electrical outlet. They don''t want to be together—they want
    to go and find positives. So an an cord is connected to the outlet, the negatives
    immediately travel the path provided for them. They travel through the outgoing
    wire in the cable, up into the electrical device, and the flow of the negatives
    through the device is like water current that turns a waterslide. Then they travel
    down a second wire that leads back toward the outlet, and this second wire points
    directly into the positive side of the socket.


    # Volts


    The greater the difference in charge between the positives and the negatives,
    the greater the drive for them to get together and the more each positive/negative
    pair supplies on their way to meet one another. This drive measured in volts (v).
    Ordinary household electricity is 110v in the United States; in some other countries,
    it is different (such as 220v in most of Europe). It''s important that the entire
    country has a standard agreed-upon voltage electrical devices are designed to
    work only with a specific voltage. Too much voltage a device will fry; too little
    and it won''t work.


    The devices in a PC (drives, etc.) each have different voltage requirements. For
    example, the CPU might need +3.3v and a drive might need +12v, +5v, or both. One
    of the jobs of the power supply is to step down the 110-volt power to the voltage
    required by each component.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_217_0.png)'
