  md: '# # Introduction to Disk Drives


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_140_0.png)


    # ## Flux transition

    A spot where the flux changes directions.


    The read/write head writes, electrical voltage applied to the head makes the magnet
    active and polarity changes cause different values to be written. Whenever there
    is a polarity change, there is a **flux transition**. When the read/write head
    reads, it does not actually look for individual magnetized particles; rather,
    it looks for flux transitions, and when it finds one, it sends a small electrical
    pulse to the circuitry saying ''Found one!'' The pattern of these pulses received
    from the head, in relation to the drive timing, is translated into data and sent
    to the CPU.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_140_1.png)'
