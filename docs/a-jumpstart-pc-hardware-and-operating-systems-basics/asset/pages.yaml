  md: '# What Makes One Video Card Better than Another?


    If you shop around for video cards, you''ll quickly see that some cards cost under
    $50, and others cost over $500. Why? Here are a few of the reasons.


    # Memory Type


    As pointed out in the preceding section, different video cards have different
    amounts of memory on them. Not only is the amount of memory important, but also
    the type of memory.


    There have been various types of video RAM over the years, with different prices,
    speeds, and capabilities. Some of these types have been unique to video cards;
    others have simply been different packaging of the same kind of memory found on
    SIMMS and DIMMs. Originally video cards used FPM DRAM, which you may remember
    from Chapter 5, "Understanding Memory." It was slower, but it was cheap. The alternative
    at that time was to pay big bucks for a video card with Video RAM (VRAM), which
    was fast but expensive. A variant of it called Window RAM (WRAM) also came and
    went; it was also fast and expensive. When Extended Data Out (EDO) RAM was popular
    in PCs, it also began to be used on video cards. You may still find it used on
    low-end video cards today. It''s cheap, but it''s not particularly fast.


    Most video cards today use SDRAM or DDR SDRAM, which is the same stuff that the
    PCs themselves use (although of course it''s in a different physical package,
    to fit on the video card). Remember from Chapter 5 that the "S" stands for synchronous;
    it means the RAM is synchronized with the bus. In this case, however, it''s the
    bus on the video card. DDR SDRAM is double data rate, so it performs two operations
    per clock cycle and is twice as fast as regular SDRAM; not surprisingly; it is
    also more expensive.


    # 3D Acceleration


    As learned in the "Video Card Memory" section earlier in the chapter, some video
    cards support 3D acceleration. This basically means that they use part of their
    RAM for multiple buffers that store data for quicker graphics handling programs
    that have 3D graphics.


    To understand 3D animation in terms of the video card, think about an animated
    cartoon. In the old days, each frame of the cartoon was drawn and colored by hand,
    so animation was very labor intensive. Computers have greatly simplified the process
    in several ways. One is that animators can create each


