    sends only selected keyframes to the video card, and the video card uses its extra
    memory and processing capabilities to generate all the other frames needed for
    the animation. It''s more complicated than that, because the moving object also
    needs to have shading, texture, smooth edges, and so on, but this example gives
    you the basic idea.


    Video cards that are better at helping programs generate 3D animation are more
    expensive than those that are not good at it, or don''t have capability at all.
    When you install 3D games, the setup program may allow you to choose between low;
    medium; or high-definition graphics; if you have a high-end video card, the high-definition
    graphics will be no problem. However, on a cheaper video card, the high-definition
    setting might cause you to play with stuttering and jerking, and you might need
    to resort to a lower-quality setting.


    The programmers who wrote these 3D games application programming interfaces (APIs)
    to create the lines of code that tell the video card what to do. This makes it
    possible for a program to work with many different video cards, rather than being
    written specifically for one model. The most popular APIs are OpenGL, 3Dfx Glide,
    Direct3D, and DirectX. When installing applications, a question may appear asking
    which API you want to use. If in doubt, check the documentation of your video
    card to find out which one it supports.


    # Keyframes


    A set of still images that represent the start, middle, and end points of an animation;
    the computer can then generate the additional frames between the points.


    # API


    Application Programming Interface. A set of standards that programmers can use
    to access the features of hardware in their programs.


    # Bus Type


    As you learned in Chapter 3, ''A Closer Look at the Motherboard,'' different buses
    have different speeds and widths. The bus that the video card uses to attach to
    the motherboard makes a big difference in how quickly data can transfer between
    them. By using a card that plugs into a high-speed bus slot rather than a low-speed
    one like ISA, you can dramatically improve the speed at which complex images are
    drawn onscreen.


    The first video cards used the ISA interface, which is limited to 16-bit, 8MHz
    transfer. When local bus interfaces became available, video card manufacturers
    immediately began taking advantage of them. Many 486 PCs used VLB


