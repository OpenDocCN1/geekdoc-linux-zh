  md: '# A Few Other Essential Components


    # Power Supplies


    Now that you know electricity, this discussion of power supplies will probably
    make a lot more sense to you than it otherwise might.


    The power supply in a PC takes 110-volt AC current from the wall outlet and converts
    it into DC current. It also steps down the voltage and sends different voltages
    to the various components via the different colored wires. For example, the red
    wires are for +5v and the black wires are for grounding.


    Power supplies come in two styles: AT and ATX. The power supply must match up
    with the case and motherboard type because the power supply connector on the motherboard
    is different for each. Besides that, the main differentiation of one power supply
    from another is in its wattage, which is discussed next.


    # Wattage Ratings


    A power supply has a maximum wattage, such as 200 or 300 watts. The more devices
    you connect to the PC, the higher the wattage power supply you need. That''s why
    cases with more drive bays usually come with higher wattage power supplies than
    smaller cases-because there is the potential for hooking up more drives that each
    need wattage.


    Remember, wattage is volts amps, and each device draws amps as needed. To determine
    what wattage power supply a system needs, you multiply the volts by the amps for
    each device and add the answers together.


    Many devices indicate on their label the amount of amps they draw, like this CD-RW
    drive, for example:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_220_0.png)'
