  md: '# Chapter 2


    Built-in ports Ports that come with the PC that are used for plugging in keyboard,
    mouse, and other standard devices. We''ll look at these in more detail momentarily.


    Expansion ports Ports that are added in expansion slots on the motherboard and
    are not part of the base PC itself (for example, a video card or modern). We''ll
    look at these more closely in a moment as well.


    Your PC probably has a tangle of wires plugged into the back, as you saw in the
    preceding pages. With all those wires, sorting out what'' what can be difficult.
    Here''s a closer look at the built-in ports:


    PS/2 port A small round port used for connecting some keyboards and mice. The
    name derives from a model of IBM PC that used this type of connector. The PS/2
    computer is long obsolete, but the plug type is still around.


    Keyboard port On an ATX system (which is shown here), the keyboard port is a PS/2
    port. On an AT system, the keyboard port is a larger round plug. You can buy different
    keyboards with the different connectors, or you can buy a plug that converts between
    them; the keyboards themselves are identical except for the plugs. You''ll learn
    about AT and ATX systems in Chapter 3, "A Closer Look at the Motherboard."


    Mouse port The mouse also plugs into a PS/2 port on most systems. On some older
    systems, there is no mouse port; on these systems, you must use a mouse that plugs
    into the serial port (which will be explained in a moment) instead. Even though
    the ports are not interchangeable. Notice in the following figure that there are
    pictures of a keyboard and a mouse next to the ports to help you avoid confusing
    them.


    USB ports These small rectangular slots accept Universal Serial Bus (USB) cables.
    Many types of devices use USB interfaces, including scanners, digital cameras,
    and printers.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_39_0.png)'
