  md: '# # Starting Up a PC


    Here''s an outline of the boot process for MS-DOS:


    +   1. The BIOS performs a Power-On Self Test (POST).

    2. The BIOS searches the drives for a Master Boot Record (MBR). The MBR contains
    data about the partitions, including which partition is active.

    3. The MBR takes control and locates IO.SYS.

    4. IO.SYS takes control. It identifies the installed hardware. It looks for CONFIG.SYS,
    and if it finds it, it executes its instructions.

    5. MSDOS.SYS takes control. It loads MSDOS.SYS (the operating system kernel) into
    memory, and looks for AUTOEXEC.BAT. If it finds it, it executes its instructions.

    6. COMMAND.COM displays a command prompt, indicating it is ready to accept user
    commands.


    POST

    Power-On Self Test. A set of low-level hardware diagnostics that confirm the basic
    operability of the motherboard, memory, CPU, and some other essential components.


    MBR

    Master Boot Record. Information stored on a drive about its partitions and capabilities.


    DPMI

    Protected-Mode-Interface. Like an MS-DOS command prompt interface except it in
    Protected mode rather than Real mode.


    > NOTE

    If the system being booted contains a CONFIG.SYS and/or AUTOEXEC.BAT file, you
    won''t be prompted for the date and time at startup. Otherwise, the first thing
    you''ll see after startup is an Enter Current Date: prompt.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_288_0.png)


    Once you''ve started up MS-DOS, you type commands at the prompt. There are two
    kinds of commands: internal and external. Internal commands are built into the
    DOS kernel, so they''re available at all times. Examples include COPY, DIR (brings
    a directory listing of files), and DEL (deletes files). External commands are
    the names of programs stored on the disk that you can run. The files for the external
    commands are stored in the DOS directory (folder). Examples of these include FORMAT
    and FDISK.


    # # The Windows 9x Boot Process


    Windows 9x actually has two parts: a graphical user interface (GUI) and a Protected-Mode
    Interface (DPMI). You can boot to either of them, and it''s still Windows 9x.
    However, ordinary users almost never use the DPMI: they boot directly into the
    graphical interface that has become synonymous with Windows 9x itself.


    Here''s the sequence for Windows 9x booting:


    +   1. The BIOS performs a POST.

    2. The BIOS searches the drives for the MBR.

    3. The MBR takes control and locates IO.SYS.

    4. IO.SYS takes control. It looks for MSDOS.SYS and processes its instructions.


