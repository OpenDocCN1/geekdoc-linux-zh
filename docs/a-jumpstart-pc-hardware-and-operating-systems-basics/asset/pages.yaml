  md: '# The Video Subsystem


    The video card and the monitor form the video subsystem. These two items work
    closely together, with the limitations of one affecting the performance of the
    other.


    # Video card


    An expansion board that adds a port into which a monitor can be connected. Also
    called video board or video adapter.


    The video card plugs into an expansion slot in the motherboard and provides a
    15-pin male D-sub connector for the monitor. (This is sometimes noted as HD15
    on a monitor). Notice in the following figure that there are five holes per row;
    this is different from the other D-sub type connectors you''ve seen in earlier
    chapters where there were different numbers of pins/holes in each row. Notice
    also that the middle row is offset from the others.


    # Monitor


    A display panel that shows the results of the PC''s activities or processing.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_115_0.png)


    The monitor has a D-sub connector that plugs into the video card, depending on
    the monitor there may not actually be 15 pins. In the following figure, for example,
    notice that the second pin from the left in the second row is missing, giving
    this connector a total of only 14 pins. So don''t assume a pin is broken off and
    the connector is damaged if you see fewer than 15 pins on a monitor connector.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_115_1.png)


    On most PCs, the video card is an expansion card plugged into the motherboard.
    However, some economy-models PCs have built-in video support on the motherboard,
    so a separate video card is not required. On such systems, there is a connector
    on the motherboard to which you attach a cable. That cable runs inside the PC
    to a normal 15-pin video connector that mounts on the back of the case. From the
    outside, it looks like a video card, but inside there''s nothing but the cable.'
