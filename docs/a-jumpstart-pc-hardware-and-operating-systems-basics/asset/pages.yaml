  md: '# Installing and Removing Memory


    PC technicians are often called upon to install memory in a PC. The biggest challenge
    is not the actual installation but selecting and buying the correct sticks of
    memory. As you''ve learned in this chapter, there are many different kinds, and
    within each kind there are multiple speeds, capacities, and other specifications.


    The best way to determine what kind of memory a PC needs is to consult the manual
    for it (or for its motherboard if it''s a built-from-scratch model). Documentation
    should tell what type of memory you need. For example, you might find that an
    old motherboard with 72-pin SIMM slots requires non-parity FPM RAM with a speed
    of at least 60ns and that it can take 16, 32, or 64MB SIMMs. With a newer system,
    you might find that it requires PC100 SDRAM DIMMs of 32, 64, or 128MB each.


    After you know the specs, check the motherboard to see what is already installed.
    If all the memory slots are filled already, you will need to remove some of them
    and add higher-capacity sticks.


    # SIMMs


    To remove a SIMM, you need to pull back the little metal clips on both ends of
    the slot simultaneously to release it.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_109_0.png)'
  merge: -1
