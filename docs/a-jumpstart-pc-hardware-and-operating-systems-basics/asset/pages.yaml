    the SIMM only by the edges.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_110_0.png)


    To insert a SIMM, reverse the process. Slide the SIMM into the slot at a 45-degree
    angle, and then tilt it up to 90 degrees with your fingers.


    # DIMMs


    To remove a DIMM, push down on the levers at both ends of the DIMM (simultaneously
    or not, it doesn''t matter). When you push down, the DIMM pops out of its slot.
    Then just lift it out.


