    # WARNING


    Most types of hardware are not hot-pluggable. In other words, you must turn off
    the PC before you hook them up. Damage can result if you try to connect a device
    while the PC is running. If in doubt, you should assume that you need to turn
    off the PC. Hot-pluggable devices are those that connect via USB, FireWire, or
    PCMCIA


