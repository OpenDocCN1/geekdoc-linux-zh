  md: '# Safety and Preventive Maintenance


    travel through your body to complete a circuit. Finally, try to have someone else
    around when you''re working on anything electrical. That way, someone will be
    there to call for the ambulance if you hurt yourself.


    Don''t let all this scare you off! Working on PCs is not particularly dangerous,
    and your chances of getting an electrical shock are actually quite remote if you
    just use ordinary care.


    # Proper Working Attire


    As a PC technician, you will probably spend some time crawling around underneath
    desks hooking up cables, so dress comfortably in clothes that allow you to bend.
    As is the case with appliance repairpersons, everyone will appreciate if you wear
    a belt and avoid low-riding pants.


    Avoid jewelry made of conductive materials, and avoid any jewelry that might get
    caught on something. That means no dangling earrings, no necklaces, no bracelets,
    and no watches.


    # Safe Hazardous Materials Disposal


    PCs can not only hurt you directly, but they can also hurt your environment. Several
    parts inside a PC require special disposal procedures:


    +   **Batteries** A motherboard has a very small battery; a notebook PC has a
    big one. These batteries can contain lead, lithium, nickel-cadmium, and/or mercury—all
    of which can seep into groundwater in a landfill.


    +   **Toner cartridges** These cartridges from laser printers can contain traces
    of leftover toner, which can cause lung problems if breathed. Depending on the
    model, you might be able to sell your old cartridges to a company that manufactures
    them.


    +   **Monitors** These big plastic shells take a lot of space in a landfill, and
    they also contain phosphorous, mercury, and lead coatings on the back side of
    the monitor glass.


    +   **Circuit boards** These contain small amounts of lead in the soldering.


    +   **Cleaning chemicals** Some cleaning solvents used for PCs can pollute groundwater
    and soil.


    If your community has a hazardous disposal facility, take the above materials
    there. Check the Environmental Protection Agency (EPA) website at www.epa.gov
    if you do not know where to go.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_22_0.png)'
