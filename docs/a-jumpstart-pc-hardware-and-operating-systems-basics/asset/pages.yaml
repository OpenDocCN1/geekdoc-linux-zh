  md: '# A Closer Look at the Motherboard


    The BIOS chip usually has a sticker on it that identifies its manufacturer. The
    most common ones are Award, Phoenix, and AMI. If you''ll look closely at the BIOS
    chip, you''ll see that it''s removable. The little legs on the sides are wedged
    down into sockets, but they''re not welded in place. This enables you to update
    the BIOS by physically replacing the chip if you ever need to do so.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_72_0.png)


    The CMOS chip, on the other hand, stores any exceptions to the BIOS rules that
    you have defined through the BIOS setup program. The CMOS chip relies on the motherboard''s
    battery to retain its content. If you ever need to replace the battery, all BIOS
    settings will revert to what is in on the CMOS chip itself, and you will need
    to reenter any settings you have changed.


