- img_proc: true
  md: '# Chapter 5


    > TIP

    When working with 72-pin SIMMs, you can determine capacity by multiplying the
    first number times 4. The designations 8x32 and 8x36 are both 32MB; 16x62 is 64MB.


    # FPM


    Fast Page Mode. An older type of RAM in which the speed does not correspond to
    the system bus speed. Speeds are measured in nanoseconds.


    # Speed


    Each SIMM or DIMM has a speed. Early speeds were measured in nanoseconds of delay
    between the request for data to be retrieved from RAM and the actual supplying
    of data, with lower numbers being better. For example, 60ns RAM was faster than
    80ns RAM. You had to be careful to buy RAM that was at least fast as your motherboard
    required and careful not mix speeds in the same bank. This type of RAM was called
    Fast Page Mode (FPM).


    # SDRAM


    Synchronous Dynamic RAM. RAM in which the speed is the same as the system bus
    speed. Speeds are measured in megahertz (MHz).


    Today, most systems use Synchronous Dynamic RAM (SDRAM), which operates at the
    same speed as the system bus. You need to match the RAM speed to the motherboard
    bus, so for a motherboard with a 100MHz bus, you need 100MHz RAM, known as PC100.
    On a motherboard with a 133MHz bus, you need PC133 RAM. SDRAM comes packaged only
    in 168-pin DIMMs.


    > WARNING

    Not all 168-pin DIMMs are SDRAM, although the ones sold today are. Some of the
    older ones may be EDO or FPM.


    # Technology


    One reason it can be difficult to select RAM for a motherboard is that there have
    been many different schemes for improving RAM performance over the years. Some
    of them have remained popular; others have gone the way of the dinosaur. The following
    sections explain a few of them.


    # Extended Data Out (EDO)


    Extended Data Out is a type of RAM in which the capacitors need to be refreshed
    less often, so there is less overhead involved in its operation. It is impossible
    to tell by looking at a SIMM or DIMM whether or not it''s EDO; you must rely on
    its labeling.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_105_0.png)'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Understanding Memory


    EDO RAM was popular in the late 486 and early Pentium period. Most Pentium class
    motherboards that used 72-pin SIMMs could take advantage of EDO RAM; most 486
    motherboards could not. The only definitive way to tell is is to consult the motherboard
    manual. EDO is an obsolete standard today, because of the introduction of SDRAM.


    # Error Correction Code (ECC)


    ECC is a quality-control mechanism in the RAM, much like the old parity bit in
    some SIMMs. The motherboard must be capable of using ECC in order to take advantage
    of the feature. It makes the system more expensive, so it''s not widespread use
    on consumer-grade PCs.


    # RDRAM RIMMs


    A whole new type of memory called Ramb DRAM, or RDRAM, has been in the works for
    the last few years at Intel. It is very fast (with a top speed of up to 800MHz),
    but it is also very expensive. RDRAM comes in its own proprietary packaging, so
    it doesn''t fit into standard DIMM slots. The slot that it fits into is called
    a RIMM.


    Most PCs do not use RDRAM because it is so expensive. However, almost all PC manufacturers
    these days have a high-end line of computers, mainly designed for use as servers,
    with motherboards that accept RDRAM.


    # DDR SDRAM


    A lower-cost competitor to RDRAM is Double Data Rate (DDR) SDRAM. It processes
    two operations each clock cycle, so it can operate at twice the speed of the system
    bus. It also fits into regular 168-pin DIMM slots, even though it actually has
    184 pins on the DIMM itself.


    Even though it''s not as fast as RDRAM, it costs much less, so many PC manufacturers
    are using it in their consumer-grade PCs. However, Intel is still the processing
    leader, and Intel makes RDRAM, so DDR SDRAM will probably never be the single
    dominant standard.'
