  md: '# # How a Drive Physically Operates


    Before we start talking about the differences between drives, let''s talk about
    what they all have in common. They all store data.


    As you learned earlier in the book, computer data is stored digitally, in bytes.
    Each byte is an eight-digit combination of 1s and 0s and represents a number,
    a letter, or a symbol. When data moves through a circuit board, it does so in
    patterns of electrical pulses: 1 is a pulse and 0 is a lack of a pulse. Disks
    store data basically the same way. Disks store patterns of magnetic charge or
    of reflective and lessreflective areas. The read/write heads on the drive convert
    the transitions between the spots into electrical pulses (1s). The areas in which
    there is no transition are 0s.


    # ## Read/Write Heads


    Each disk has at least one read/write head. This is like the needle on a phonograph
    player, in that only the part of the disk that is directly under the head gets
    used; the rest of the disk just spins waiting to be noticed by the head. It''s
    mounted on an arm, again again like a phonograph needle.


    Unlike on a phonograph, however, the arm on a disk''s read/write head (also called
    the actuator) can jump in and out very quickly, so it can go from the edge to
    the center to the middle and back again as part of its routine operation rather
    than sticking with a single spiral track. Because of this ability to jump around,
    disk storage is called random access (just like random access memory except it
    is a disk instead).


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_138_0.png)


    **Read/write head**

    The recorder/reader unit on a drive that reads data from the disk and writes data
    to the disk.


    **Actuator**

    The arm on which the read/write head is mounted, which moves the head in and out
    on the disk surface.


    **Random access**nAble to jump to and access any part of the data just as easily
    as any other part.


    119'
