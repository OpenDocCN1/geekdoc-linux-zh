- img_proc: true
  md: '# Chapter 9


    # Step 3: Connect the Motherboard

    Power Supply to the Drive


    Next, run the cables from the motherboard and power supply to the drive. An

    IDE or SCSI removable drive (such as a CD-ROM) is identical to a hard drive in

    t ribbon cabling, so turn back to Chapter 8, "Focus on Hard Drives," if you

    need to review that.


    A floppy connects in the same way too, except it uses different cables. A floppy

    drive ribbon cable is smaller (34 pin), and it has a twist in some of the wires

    ear one end. This twisted end must connect to the floppy drive that is to be

    drive A: (the primary floppy drive). The connector that goes to the motherboard

    is the one on the other end from that. Of course, the red stripe on the cable

    must go to pin 1 at both ends.


    On the motherboard, the red stripes for floppy and IDE cables usually point the

    same way, so if you aren''t sure how to orient the floppy ribbon cable, look at

    how the IDE cables are oriented. On the drive end of the floppy ribbon cable,

    the red stripe almost always goes toward the power supply connector.


    The power supply connector for a floppy drive (called a Mini) is smaller than
    the

    regular Molex connector for the larger drives.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_181_0.png)


    # Step 4: Connect Any

    Additional Cables Required


    Depending on the drive type, you might need to run other cables. For example,

    if it''s a DVD drive, you might need an extra cable that connects the drive to
    an'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Focus on Removable Disk Drives


    MPEG decoder card or to the video card does MPEG decoding. The directions that
    came with the drive should tell you what is necessary.


    If it''s a CD-ROM drive, and you want to play audio CDs on your computer''s sound
    card and speakers, you must run an audio cable from the drive to the sound card
    (or to the motherboard if it has built-in sound support). This is a three-wire
    cable, and it can be shielded or have bare wires, depending on the model. One
    end is a flat, four-hole connector; on the other end may be an identical connector
    or a smaller four-hole connector, depending on the model. Most sound cards have
    several different connectors, so a variety of different audio cables will work
    with them.


    # Step 5: Set Up the BIOS


    Most BIOSes detect IDE devices automatically, so you shouldn''t have to worry
    about this when installing a CD-ROM drive. If you doesn''t, go back to Chapter
    8 and go through the section on setting up the BIOS for a hard drive, but instead
    of the IDE position to Auto, set it to CD-ROM or ATAPI Device.


    If you are replacing one floppy drive with another, you should not need to make
    changes to the BIOS setup unless the new floppy drive is of a different type.
    BIOS setup programs do not detect floppy drives automatically, so you will need
    to make changes if there is an extra floppy drive or change to one with a different
    capacity.


    Depending on the BIOS program, the floppy drive might go by different names. The
    disk referenced in the following figure is a Legacy Diskette. Notice that the
    A: drive is turned on and set for a 3.5-inch high-density (1.44MB) drive. Drive
