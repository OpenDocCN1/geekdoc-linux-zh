  md: '# Printer Types


    Printer types can be broken into two big categories: impact and nonimpact. This
    has to do with the way the image is placed on the page.


    An impact printer is one that uses physical force to place an image on a page.
    If any of you remember typewriters, you''ll recall that a typewriter was an impact
    device. A typewriter used little hammers with pictures of the various letters
    on them; when you struck a key, the hammer jumped up and hit an inked ribbon,
    which left ink on the paper behind it. Nonimpact printers squirt or fuse colored
    material (liquid ink or dry toner) onto a page.


    The following sections explain briefly several different printer types work and
    why you might—or not—want one of them.


    # Dot Matrix


    Dot matrix printers are impact printers; they strike an inked ribbon with an array
    of metal pins, forming an image on the paper behind the ribbon.


    The dot matrix print head consists of a grid of pins that can pop in or out depending
    on instructions from the ECU. The pattern of popped-out pins form each character.
    The original models had only 9 pins, but later models had 24 pins, resulting in
    much easier-to-read letters.


    > NOTE How can only nine pins form a character? Simple—they can''t. Dot matrix
    printers do not print an entire line of text at once; they make two or more passes
    per line of text. The pins arrange themselves to print the top half of a letter
    in one pass, then the bottom half of it in the next pass.


    Dot matrix printer—in theory—generate any typeface at any size because it''s not
    really printing the letters but the images of them. However, most dot matrix printers
    have only two or three resident fonts, so you need an application with software
    fonts or an operating system that supports TrueType fonts to get much font flexibility.


    The paper feeds past the print head vertically, and the print head moves horizontally.
    Sprockets in the sides of the printer pull continuous-feed paper through grabbing
    onto the holes along the sides of the paper. After the printing, the rows of holes
    can be removed by tearing off the perforated edges.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_234_0.png)


    215'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Chapter 12


    Dot matrix printers are mostly obsolete, but some businesses use them for multipart
    forms that need an impact strike to make several carbon copies at once. Dot matrix
    printers are also very economical to operate because they use low-cost ribbons
    rather than the more expensive ink or toner cartridges of other types of printer.


    # Primary corona wire


    A negatively charged wire in a laser printer applies a uniform -600v charge to
    the drum in preparation for writing to it.


    # Laser


    The main problem most people had with dot matrix printers was the print quality.
    It just didn''t look as good as output from a typewriter, even at high quality
    printing modes. Laser printers solved this by producing extremely high quality
    output (300dpi on the early models) that looked even better than a typewriter''s.
    Laser printers remain the workhorses of business today because they continue to
    produce beautiful text—at resolutions up to 1200dpi.


    Laser printers are page printers—they form the entire page''s image in memory
    and transfer it all at once to the page. Therefore, the amount of memory a laser
    printer has is significant, as so is the speed and power of the printer''s ECU.


    If you are old enough to remember mimeograph machines, they provide an excellent
    analogy to the way laser printer works. Recall that a mimeograph took a typed
    sheet of paper and wrapped it around a metal cylinder. As that cylinder rotated
    past ink and then paper, it created copies of the page clinging to the drum. That''s
    what a laser printer does electrical charges cling to the drum and pick up toner.
    The drum has a very negative electrical charge, and a laser neutralizes the charge
    in certain spots. When the drum passes by a reservoir of toner, the toner jumps
    out and clings to the neutralized spots. When it passes by some paper, it jumps
    off onto the paper, and a heater fuses it.


    If you take the A+ exam, you will need to memorize the sequence of events involved
    in laser printing. Here are the events, which you can study now or just file for
    future reference:


    Cleaning All remnants of the previous print are scraped off the drum with a cleaning
    blade, and any residual electrical charges are removed.


    Conditioning The primary corona wire applies a uniform negative charge of -600v
    to the drum''s surface.


    Writing The laser sweeps across the drum''s surface, turning itself on and off
    at precise moments. Wherever the laser was on, the drum surface charge is reduced
    to about -100v. The image of the entire page is written to the drum this way.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_235_0.png)'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Printing Basics


    The drum rotates past toner on a developing cylinder, which has the same 600v
    charge as the un-lasered portions of the drum. The areas of lesser negative charge
    on the drum attract the metallic toner, which jumps onto the drum and sticks to
    it at those spots, but the toner and ignore another in the spots where the charge
    is the same. Now the image of the page exists in the drum toner.


    The transfer corona wire applies a +600v charge to the inkjet paper. When the
    paper passes over the drum, the -100v toner particles on the drum jump off onto
    the paper because its positive charge, at 600v, is greater than the drum''s negative
    charge at 100v. The paper runs past a static charge eliminator, a row of metal
    teeth with a negative charge that neutralizes the paper''s high positive charge.


    At this point, toner is held on the paper by gravity and weak electrostatic forces.
    The fuser applies pressure and heat to the paper, melting the plastic resins in
    the toner so that they stick to the paper. The paper then ejects from the printer.


    Color laser printers are typically more expensive than regular ones because the
    laser printing technology does not lend very very to multicolor printing. In print
    color, a laser printer must make four passes across the same page, laying down
    a different color each time (cyan, magenta, yellow, and black). The need for cheap
    color printing has fueled the popularity of inkjet printers, which are discussed
    next.


    # Inkjet


    Transfer corona wire

    A wire in a laser printer applies a positive charge to the paper on which the
    image will be printed.


    Thermal inkjet printernAn inkjet printer that heats the ink to create vapor bubbles
    that force the ink out.


    Inkjet printers are the most popular printers for personal or home use these days
    because they are a cheap way for the average person to get color printouts.


    Inkjet printers blow jets of ink onto paper. They utilize a nonprint technology;
    the printer heads do not touch the paper at all. There are somewhere between 21
    and 256 nozzles for each of the four colors (cyan, yellow, magenta, and black)
    in the print head, the ECU tells it to squirt ink in different combinations and
    proportions to form whatever colors are needed.


    Two technologies are used to force the ink out of the nozzles: thermal and piezoelectric.


    A thermal inkjet printer heats the ink to about 400 degrees Fahrenheit, which
    creates vapor bubbles that force the ink out. This creates a vacuum inside the
    cartridge, which in turn draws ink into the nozzles. This technology is also called
    bubble jet. Most inkjet printers made by Hewlett Packard and Canon use


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_236_0.png)


    217'
  merge: -1
