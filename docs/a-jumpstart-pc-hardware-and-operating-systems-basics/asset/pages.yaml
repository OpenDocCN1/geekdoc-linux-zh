  md: '# Chapter 19


    Earlier I said that IP addressing was not just for the Internet, but for corporate
    LANs as well. In a TCP/IP network, each IP address can be broken down into two
    parts. The first part tells what domain the PC belongs to, and the second part
    is the unique identifier of that device within that domain. It''s like area codes
    and prefixes in a telephone number except in that case there are three levels
    of division rather than two.


    The dividing line between the first and second parts of the IP address is not
    a fixed point; it can vary depending on the way the network is set up. This is
    great for people designing networks because it gives them lots of flexibility.
    You could have lots of domains with a few addresses each, a few domains with lots
    of addresses, or anywhere in the middle between those extremes. The subnet mask
    defines where the separator line should be. In simplistic terms, the separator
    comes at the point where the 0 begins. So, for example in 255.255.255.0, the separator
    comes after the third group of digits.


    In actual use, however, it becomes more complicated—at least an human-understanding
    perspective—because an IP is actually a 32-bit binary number, not decimal, as
    you''ll recall. Each number between the periods is an 8-digit binary. So the address
    255.255.255.0 is actually 11111111111111111111111100000000. So the breaking point
    is after the 24th digit. It doesn''t necessarily need to break on an eight, so
    you could potentially have a subnet mask such as 255.255.248.0, which would break
    after the 21st digit.


    If you take a course on networking, or study for the Network+ exam, you will spend
    a lot of time learning how to calculate subnet masks. But for our purposes in
    this chapter, all you need to know is how to type one into a dialog box.


    # Connection Protocols


    In the early days of the Internet, several different connection protocols were
    used to establish a TCP/IP Internet connection: SLIP (Serial Line Interface Protocol),
    CSIP (Compressed SLIP), and PPP (Point to Point Protocol). Today, PPP is the dominant
    connection protocol, to which point it is the default and hardly anybody ever
    needs to change it. Many specifications are associated with each of these, but
    you don''t need to know about them for the A+ exam.


    # Communication Protocols


    Once you get an Internet connection established, then what? Then you need some
    TCP/IP communication protocols to send and receive data.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_347_0.png)


    328'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Setting Up Internet Connections


    Several protocols are standard on the Internet. In earlier days, you needed separate
    applications on your PC to work with each one of them, but today programs can
    handle multiple protocols. Here are the most important ones to know:


    Hypertext Transfer Protocol (HTTP) This is the protocol for the World Wide Web
    (or for Short). You use a browser as Internet Explorer to view web pages. A web
    page''s address usually starts with http:// Pages written to be viewed with the
    HTTP protocol are written in a text-only programming language called HTML (Hypertext
    Markup Language). In an HTML document, there might be additional commands that
    produce the animation and other bells-and-whistles associated with the fancier
    web pages. These min-applications are usually written in a system-independent
    programming language as Java, so they will run on any computer.


    World Wide Web

    A network of web pages available for public display on the Internet.


    Web browser

    A program that displays web pages.


    Web page

    A text document with embedded HTML codes that make it appear to be formatted and/or
    to contain pictures and other elements viewed with a browser.


    # NOTE


    HTML uses only the characters on a normal keyboard. It embeds codes within the
    text to represent different kinds of formatting. For example, the code starts
    a new paragraph.


    HTML

    Hypertext Markup Language A text-based programming language used to create Web
    content.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_348_0.png)


    Java

    A platform-independent programming language for creating applications that users
    using any type of PC can run through web interface.


    # File Transfer Protocol (FTP)


    For a long time, it was the only protocol for this purpose, but today many web
    pages integrate file transfer too. You use an FTP protocol to connect to an FTP
    site and upload or download files from an FTP server. Some web browsers enable
    you to connect to FTP sites through them—without a special FTP program—by preceding
    an IP address with ftp:


    # Telnet


    Upload\To transfer a file from your PC to another.


    Telnet is an old protocol, used for making a direct connection to a computer network.
    You log in as a remote user using Telnet and access the text-based operating system
    on the server (usually Unix). You can use a Telnet program or make a telnet connection
    from within a web browser by preceding the IP address with Telnet:


    Download

    To transfer a file from another PC to your PC.


    # E-mail protocols


    FTP site

    A server provides FTP access for a hard disk that accepts uploading or downloading
    operations.


    These protocols are used on mail servers for picking up and sending e-mail. The
    most common one is Post Office Access Protocol (IMAP). Both of these second in
    popularity in Internet Messaging require e-mail programs, such as Outlook or Eudora.
    Each of these receives mail only; use a third protocol called Simple Mail Transfer
    Protocol (SMTP) to send. Depending on your ISP there might be alternative web
    access to your POP or IMAP account as well. In addition to use “normal” e-mail
    protocols, there are e-mail accounts that are entirely web based and use only
    the HTTP protocol (for example, those free e-mail accounts you can get through
    Yahoo, Hotmail, and other services).


    329'
