  md: 'with a magnet. But magnets are not always obvious. Watch out for the following-ing
    magnetic sources, and keep them well away from your disks:


    **Magnetic tools** A lot of hand tools, such as screwdrivers, are magnetized so
    that they can be used to pick up screws. Never use magnetized tools when working
    on a PC! It''s a good idea to buy a set of tools designed for PC work, because
    you can be sure they aren''t magnetized.


    **Unshielded speakers** Speakers contain rather powerful magnets. If your PC has
    a sound card into which you plug a set of speakers, make sure you use speakers
    designed specifically for PCs, because they''re more likely to be magnet-shielded.


    **Telephones** Some telephones contain magnets. Keep disks away from telephones,
    just to be on the safe side.


    > TIP

    The magnets in unshielded speakers can distort the image on your monitor if the
    speakers are too close to it. If you notice distortion on the sides of the display,
    try moving the speakers farther away from it.


