  md: '# Selecting and Configuring a Sound Card


    Sound card

    An expansion board that functions as a converter between sound and digital data
    enabling the computer to generate and receive audio output and input.


    A sound card, like a modem, is also an analog-to-digital (digital-to-analog) converter.
    It takes digital sounds from the operating system and its applications and converts
    them into sounds that play through the speakers, and it takes input from a microphone
    and converts it into binary data that can be stored in a file.


    Waveform

    A sound that originates in the real world, rather than being originated by a computer.


    To hear the sounds from a sound card, you must plug a speaker (or a set of speakers)
    into it. These speakers are usually designed specifically to work with computers,
    and they are EMI shielded in a way that normal speakers (i.e., the kind for a
    regular stereo system) are not.


    # Waveform and MIDI Sounds


    MIDI

    Musical Instrument Digital Interface. An interface and method for creating sound
    and music files entirely digitally, with no analog origin.


    A sound card can play and receive two types of sounds: waveform and MIDI. Waveforms
    originate in the "real world." For example, suppose you take a microphone and
    play it into your sound card, and then use it to record a musician playing a song,
    bird singing, or a friend telling a joke. You have made a waveform recording.


    FM synthesis

    A method of computer simulating the sounds of various musical instruments. Results
    in artificial-sounding MIDI music.


    In contrast, MIDI sounds originate in the computer. For example, you buy an musical
    keyboard and hook it up to your PC''s sound card. When you press a key, the keyboard
    sends digital signals to the sound card, which converts it to audio sound and
    plays it through the speakers. The entire process is digital-there is no conversion
    of analog audio to digital format.


    It''s important to note that waveform refers to the original source of the sound,
    not its current status. For example, if you buy the latest CD by your favorite
    diva, the music on the CD is digital. When you play it back on your PC or stereo,
    it continues to be digital until it is channeled through the speakers into the
    air. That doesn''t make the CD a MIDI recording. It is still waveform real-life
    singer with real-life instruments in a studio and music into the air as the origin
    of the recording.


    Now, why am I telling you all this? Because different sound cards handle different
    types of audio files with varying degrees of finesse. Waveform audio is easy to
    play back, MIDI audio is more challenging, and a high-quality sound card will
    make for more natural-sounding MIDI playback than a cheaper one. See the following
    section for more shopping tips for sound cards.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_201_0.png)'
