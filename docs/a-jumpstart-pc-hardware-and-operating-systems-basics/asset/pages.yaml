  md: '# Cleaning a Printer


    Different types of printers have different cleaning procedures. If any portion
    of the discussion of the printer''s parts doesn''t make sense to you here, wait
    until you''ve learned more about printers in Chapter 12, ‘Printing Basics.’


    # Cleaning an Inkjet Printer


    Wipe the outside casing of an inkjet printer with a damp cloth and mild soapy
    water. It won''t necessarily make the printer perform any better, but it''ll make
    for a nicer office environment.


    The only parts of the inside that need cleaning are the inkjets, and you don''t
    clean them manually; instead you use a utility built into the printer to clean
    them. When printouts seem to be missing one color or another in a certain area,
    or there are gaps in the printout, it''s probably a dirty inkjet nozzle problem.


    > NOTE How do the inkjet nozzles get dirty? Well, the ink in an inkjet printer
    is liquid, and if you don''t use the printer frequently, it dries out, and bits
    of dried ink remain in the nozzles. The head cleaning utility flushes out all
    dried-up ink from the nozzles.


    On most printers there are two ways to activate the cleaning utility:


    +   You can press a sequence of buttons on the printer itself.

    You can choose a command from the printer''s Properties box in Windows.


    Here''s how to do it from Windows.


    +   1. Choose Start > Settings > Printers. (In Windows XP, it''s Start , Printers
    and Faxes.)


    +   2. Right-click your printer and choose Properties.

    3. Click the Utilities tab. The tab you may want not be named Utilities; it varies
    with the printer model and driver. However, you''re looking for a tab with a Head
    Cleaning option on it.


    +   4. Click the Head Cleaning button (or whatever it''s called for your printer)
    and then follow the onscreen prompts.


    +   5. Use the Nozzle Check feature (or similarly named feature for your printer
    model) to print a test that checks to make sure the printer heads are clean.


