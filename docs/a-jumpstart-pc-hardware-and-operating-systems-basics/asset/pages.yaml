  md: '# The Windows Recovery Console


    Using the Recovery Console in Windows 2000 and XP is somewhat like booting to
    a command prompt from a startup floppy disk in Windows 9x. It provides a command
    prompt at which you can type certain commands for recovering problems that prevent
    the PC from starting.


    > Recovery Console

    A command line interface for troubleshooting problems with a Windows 2000 or XP
    installation.


    # Entering the Recovery Console


    By default, the Recovery Console exists only on the Windows CD-ROM. To use it
    from there, do the following:


    +   1. Boot from the Windows CD. The Windows Setup program starts.

    2. At the Welcome to Setup screen, type R to select Recovery Console.

    3. Type 1 to select the first Windows installation on your system.

    4. If prompted for the Administrator password, type it and press Enter.


    You can also install the Recovery Console program on your hard disk, so you won''t
    need the CD if you should ever require the Recovery Console. To do so:


    +   1. While Windows is running normally, insert the Windows 2000 CD in the drive.
    If a window opens automatically for the CD, close it.

    2. Choose Start >= Run. Type x:\i86 winnt32/cmdcons (where x is the drive letter
    of the CD-ROM) and click OK.

    3. A confirmation message appears. Click Yes.

    4. After the installation, another confirmation appears. Click OK.


    One of the side effects of installing the Recovery Console on the hard disk is
    that the dual-boot boot menu appears automatically from then on, each time you
    start Windows, as if you had multiple operating systems installed. You can choose
    the Recovery Console from there.


    # Using the Recovery Console


    When you enter the Recovery Console, it asks which Windows installation you want
    to log onto. In most cases you''ll only have one, so just type 1 and press Enter
    to choose it. Next, it asks you for the administrator password. Type it and


