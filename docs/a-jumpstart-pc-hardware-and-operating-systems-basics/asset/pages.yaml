    by answering the questions.


    Just as with Windows 9x, you can place a shortcut for the connection on your Desktop.
    You can also right-click it and choose Properties to adjust its settings.


    To set the TCP/IP properties for the connection, right-click the connection icon
    in Dial-Up Networking and choose Properties. Then click the Networking tab and
    double-click Internet Protocol. From the dialog box that appears, you can set
    up a static IP address and/or DNS server address or fine-tune any other settings.


