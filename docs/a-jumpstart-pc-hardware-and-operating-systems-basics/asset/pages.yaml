    Expanded memory

    Additional memory over

    1MB supplied via an

    expansion board for

    80286 PCs.


    The next generation of PCs, the 8026s, allowed the use of add-on memory

    boards with expanded memory. Expanded memory was divided into 16KB sections

    paged, and a typical expanded memory board contained a couple of

    abytes in total. The page frame, a 64KB area in the PC''s upper memory,

    hold four of pages at a time. Data was swapped into and out of this

    upper memory area from the expanded memory, enabling the PC to access the

    full amount of the expanded memory (typically about 2MB, up to 16MB is

    available).


    Page frame

    The 64KB area in upper

    memory used to swap

    data into out of

    expanded memory.


    EMS

    Expanded Memory Stan-

    dard. The industry stan-

    dification for

    expanded memory usage.


    A driver for the board was loaded at startup. Each brand of the board required
    a

    different driver, and only programs written specifically for use with expanded

    memory could take advantage of it. The standard for expanded memory was

    call EMS (Expanded Standard). Another name for EMS was LIM, which

    stand for Lotus-Intel-Microsoft (the three companies that jointly developed the

    standard).


    Real mode

    A operating mode

    compatible with 8086

    CPU operation, address-

    ing only 1MB of RAM.


    # Real and Protected Modes


    At this point, Microsoft might have rewritten MS-DOS to allow programs to

    access multiple megabytes of RAM, scrapping the entire conventional/upper

    memory limit. If MS-DOS had been rewritten, it would have lost

    backward-compatibility with older programs, and Microsoft was afraid PC

    users wouldn''t buy it. Their solution was to create two separate modes in which

    a could run. Real mode would run all the programs, and it would be

    limited to 1MB; Protected mode could access up to 16MB of RAM. (Later versions

    of Protected mode would address more RAM than that).


    Protected mode

    A operating mode

    compatible with 80286

    and higher CPUs, address-

    ing multiple megabytes

    of RAM.


    Extended memory

    Additional memory above

    1MB on a motherboard.


    # Extended Memory


    Soon boards began to be built to accept multiple megabytes of memory

    on them (extended memory). Utilizing these advanced motherboards was much

    easier than adding-on memory boards, so expanded memory quickly became

    a thing of the past. Concurrently with this advance, programmers began writing

    applications to take advantage of extended memory using the Extended Memory

    Specification (XMS).


    In order for an application to be able to use EMS memory, a device driver

    HIMEM.SYS was needed to load into memory. It was placed in the CONFIG.SYS

    startup file so that it loaded automatically at startup. A side benefit of HIMEM,

    was that it enabled another command to be used in CONFIG. SYS (DOS=HIGH)

    that relocated parts of MS-DOS from conventional memory to the first 64KB of

    extended memory over the 1MB mark, freeing a few kilobytes of memory


