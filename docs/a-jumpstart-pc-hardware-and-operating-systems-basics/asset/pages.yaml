  md: '# Virtual Memory:

    The Un-Memory


    Paging file

    The file on the hard disk that stores the data in vir-ual memory. Also called
    a swap file.


    As you learned in Chapter 4, virtual memory is not really memory at all, but rather
    a way of simulating memory using unused space on a hard disk. It allows an operating
    system such as Windows to hold more programs and data in RAM at once than it is
    physically capable of (given the system''s actual RAM capacity). Microsoft Windows
    uses virtual memory extensively, especially on systems with only a small amount
    of RAM.


    Virtual memory works by creating a reserved area on the hard disk and then temporarily
    storing part of the RAM''s content there (known as the paging file) acts as an
    overflow tank for data in RAM that has not been accessed recently but still needs
    to remain in RAM, freeing up the actual RAM to store something else. When a program
    calls for the data that has been farmed out to virtual memory, the operating system
    does a swap, moving-out of real RAM and moving the called-for data from the hard
    disk back into RAM again.


    Virtual memory is divided into “pages” of a fixed size, and swapping between RAM
    and virtual memory is sometimes called paging.


    > TIP

    Because a hard disk is much slower than RAM, virtual memory is much slower than
    real RAM. Therefore, systems that lack sufficient RAM and use virtual memory to
    hobble along are poor performers. Such systems can almost be dramatically improved
    by adding more RAM.


    Windows manages virtual memory automatically, and its default settings are usually
    as good as any could come up with your own. But should you ever need to adjust
    virtual memory, you can do so in Windows.


    In Windows 2000, follow these steps:


    +   1. Right-click My Computer, and choose Properties.


    +   2. Click the Advanced tab, and then click the Performance Options button.


    +   3. In the Performance Options dialog box, click the Change button.


    +   4. In the Virtual Memory dialog box, choose a drive to contain the paging
    file and an Initial and maximum size for it.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_107_0.png)'
