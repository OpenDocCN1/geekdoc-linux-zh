  md: '# A Few Other Essential Components


    # Cases


    Once you''ve selected a case for the PC, you can pretty much forget about it.
    The case doesn''t have any electronics of its own (except maybe a couple of lights),
    or any moving parts for that unless you count the power switch.


    However, if you do need to select a case (for example, if you''re building a PC
    from scratch), you need to know a few things about them to make the right choice.


    # Form Factors


    Cases have form factors, just like motherboards. You must match up an AT case
    with an AT motherboard, ATX to ATX, This is not only so the motherboard will properly
    fit in there, but also the connectors to the motherboard will be appropriate.
    Look back at Chapter 3, "A Closer Look at the Motherboard," for a reminder of
    the differences between AT and ATX. They include the type of power switch connection,
    the placement of the ports, and the power supply connector.


    Cases also can have one of two orientations: desktop or tower. A desktop case
    sits with its largest side flat on the desk, and the monitor usually sits on top
    of it. A tower case stands up on end. Tower cases usually (but not always) have
    more drive bays.


    # Bays


    Cases vary in the number of drive bays they have. Different case manufacturers
    have different names for their sizes of cases, but for exampe, a mini-tower case
    might have two large and two small external drive bays, while a mid-tower case
    might have three large ones. A full-tower case typically has at least four large
    and two small external drive bays.


    > WARNING


    When buying a case with a lot of drive bays, make sure you get a high-wattage
    power supply to go with it (300-watt would be good). All those drives will require
    a lot of power! See the section on power supplies later in the chapter.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_216_0.png)


    # Desktop case


    A case designed to sit with its largest side flat on a desk.


    # Tower case


    A PC case designed to stand upright.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_216_1.png)


    197'
