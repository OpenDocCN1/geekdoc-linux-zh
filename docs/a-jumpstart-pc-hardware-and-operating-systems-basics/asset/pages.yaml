  md: '# Correcting Windows Problems


    It doesn’t work right. That’s 90 percent of what you’ll hear, day after day, if
    you become a professional PC technician. Your challenge is to figure out what
    the customer means by that, and to fix it.


    In working with computers, a fix is always possible—It''s just a question of how
    drastic you have to fix it. No matter how badly a Windows installation is screwed
    up, you can always reformat the drive and start over with a fresh install, and
    just about any hardware piece that breaks can be replaced. The difference between
    a mediocre PC technician and a really great one is not that one gets the job done
    and the other doesn’t—anyone can get the job done eventually. The really great
    technician can do it and avoid overkill by trying the simple solutions first before
    resorting to the big time-consuming solutions like reinstalling everything.


    In the following sections, I''ll list some of the most common things that go wrong
    in Windows and provide some suggestions for troubleshooting them. The best teacher
    for this stuff is everyday experience, though, so I encourage you dive into fixing
    as many PCs as you can to hone your skills. Just put the word out to friends and
    relatives that you are interested in fixing their computers for free, and soon
    you''ll have more dinner invitations than you can handle.


    > NOTE

    Sometimes distinguishing between a problem with Windows itself and a problem with
    an individual application can be tough. The line between them is rather fuzzy,
    especially with programs that load automatically at startup. The following sections
    do not draw a sharp dividing line between the two because you won’ always know
    which is the problem in real-life troubleshooting.


    # System Lockout with Frozen Mouse Pointer


    When Windows locks up completely, such that you can’t even move the mouse pointer,
    there’s not much hope for a normal shutdown. The only thing you can do is press
    the PC’s power button to shut it off, and then restart. This type of error is
    more common in Windows 9x than in Windows 2000/XP because Windows 2000 and XP
    run each 32-bit application in its own separate space.'
