  md: '# Alternative Windows Startup Modes


    Now that you know Windows startup is supposed to look like normally, let''s take
    a look at some alternatives that might be useful in special circumstances.


    # Displaying the Startup Menu


    In most Windows versions, you can press the F8 key at startup to see a Startup
    menu. Don''t hold the F8 key down, or you''ll get a Keyboard Stuck error. Instead,
    wait for the Starting Microsoft Windows message to appear and the beep to sound,
    and then press F8 immediately. If you see the Windows splash screen, you''re too
    late. If you''re not fast enough on the draw, try continuously pressing and releasing
    the F8 key in 1-second intervals as soon as you see any text on the screen at
    startup.


    If you are using a dual-boot configuration, a menu appears at startup anyway,
    enabling you to choose the operating system. To get to the Startup menu for a
    particular operating system, highlight it on that list then press the F8 key.


    If you are troubleshooting a startup problem, the Startup menu might appear automatically.
    After an unsuccessful startup, the Startup menu appears by default the next time
    you restart with Safe mode selected as the default. (See the next section to learn
    more about Safe mode.)


    This Startup menu is handy because it lets you choose among several operating
    modes. The following sections describe some of these operating modes. Different
    versions of Windows have different choices, and the wording may be a little different.
    For example, here''s the one for Windows 98:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_292_0.png)'
