    the Desktop, and choose Create Shortcut(s) Here from the menu that appears. You
    can also create network shortcuts with the Add Network Place Wizard in My Network
    Places folder or the Network Neighborhood folder.


    You can create a shortcut from within an application. 32-bit Windows applications
