  md: '# Keyboards


    You know what a keyboard is already, right? It''s that thing you type on. But
    what you might not know is that a keyboard is basically a collection of broken
    circuits called a key matrix. Electricity flows through the circuit board, the
    circuit for each letter is not complete so nothing happens. Then when you press
    a key, it lowers a contact that connects the circuit, like a jumper. The keyboard
    contains a processor that monitors the key matrix and determines what a spot is
    completed, and then uses data to send a byte representing that character to the
    PC.


    Key matrix


    The grid of keys on a keyboard.


    Typematic


    The quick repetition of a typed character, such as holding down the period key
    to make a row of dots. Also called character repeat.


    Data is sent serially to the PC, either through the keyboard Interface or through
    a USB interface. Data comes from the keyboard in 11-bit packets. Each packet contains
    eight data bits (the 1-byte unique code for the character that was typed); the
    other three bits are for administrative use and contain info that aids the transfer.


    # Adjusting Keyboard Operation


    Most keyboards have a 16-byte buffer that can continue to accept input when the
    computer stops accepting it. You might have noticed at some point when the computer
    stops responding, you can continue typing for about 16 characters; then you start
    hearing error beeps. That''s the buffer filling up.


    When you hold down a key, after a brief delay it becomes typematic—that is, the
    character starts repeating quickly on the screen. Windows calls this feature repeat.
    You can control the amount of delay before a key starts typematic behavior, and
    you can control the speed at which type repetition occurs. One way is with the
    MODE command at a command prompt, but a much easier way is to set the Keyboard
    properties in Windows through the Control Panel.


    | Keyboard Properties | |

    | --- | --- |

    | Speed | Input ladies | Hardware |

    | Change repeat | |

    | Repeat delay | Long | Short |

    | Repeat rate | Slow | Fast |

    | Click here and hold down a key to test repeat rate |

    | Cursor blink rate | Slow | Fast |

    | OK | Cancel |'
