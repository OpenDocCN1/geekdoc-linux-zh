  md: '# Understanding Memory


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_104_0.png)


    Parity makes RAM more accurate, but it also adds overhead. Parity-type RAM was
    popular in earlier days when RAM was not very accurate or dependable, but these
    days it is not needed, and most systems do not require parity-type RAM. (Some
    systems are flexible and allow it to be used but do not require it.)


    # RAM Capacity


    Recall that RAM has a width and a depth. Multiplying the two together gives you
    its capacity. For example, you might find an old 30-pin SIMM that''s marked 4x8-70.
    That means it is 4 megabits (1,048,676 bits) in depth and 8 bits in width, and
    70 nanoseconds in speed. Multiplying those numbers together produces 33,667,632
    bits. Divide that by 8 to determine the number of bytes, and you get 4,194,704
    bytes. So it''s a 4MB stick of RAM.


    The width and depth measurements used to be important in older systems, where
    you could not assume a particular width. However, with the advent of 72-pin SIMMs,
    all SIMMs had a 32-bit width so that the width measurement was no longer much
    of an issue. On 72-pin SIMMs, you will commonly see ×32 or ×36 in the measurement,
    as in 4x32 or 4x36. Both represent the same amount of memory, but the ones with
    ×36 are parity memory, and therefore have an extra 4-bit width for the parity
    chip. You can assume that a 168-pin DIMM is 64 bits in width. Parity chips are
    not used in DIMMs.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_104_1.png)


    85'
