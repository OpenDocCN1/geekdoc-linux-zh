  md: '# # Essential Windows Tools and Skills


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_310_0.png)


    You can also boot to a command prompt rather than to the Windows GUI interface
    at startup, as you learned in Chapter 15, "Starting Up a PC."


    # ## Navigating Between Locations at a Command Prompt


    When working with a command prompt, folders are known as directories. Only one
    directory is active at once; it''s known as the current directory. The current
    directory''s name appears in the command prompt. For example, a prompt like this:


    ```

    C:\Windows>

    ```


    means that the Windows directory on the C: drive is current. Whatever command
    you issue affects the current directory unless you specify otherwise. For example,
    if you type this command (the part in bold below):


    ```

    C:\Windows>COPY *.* A:

    ```


    it will copy all files from the current directory to the A: drive. The asterisk
    (*) represents "all", so *.* means "all files, all extensions." It''s the same
    as selecting the entire contents of a folder in Windows Explorer.


    ### Directory

    Same thing as a folder. The term Directory is often used rather than folder when
    referring to work at a command prompt.


    ### Current directory

    The directory (folder) specified in the command prompt, to which commands will
    apply that are not specifically directed at some other location.


    ### Wildcard

    A character represents any value. Two standard wildcards are * for any number
    of characters and ? for a single character.


    > > TIP

    nThe asterisk (*) is called a wildcard because it can stand for anything. An asterisk
    stands for any number of characters. A question mark (?) is used as a wildcard
    to represent a single character.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_310_1.png)'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Chapter 16


    You could specify a different location, such as the C:\Backup folder, by changing
    the command to something like this:


    ```

    C:\Windows>COPY C:\Backup\*.* A:

    ```


    To change the current directory, you use the CD command (which stands for Change
    Directory). For example, to change to the Backup directory, you would type:


    ```

    C:\Windows>CD \Backup

    ```


    And the prompt would then change to:


    ```

    C:\Backup>

    ```


    To change to a different drive, you don''t need any command; just type the letter
    and a colon. So, for example, to change to the A: drive:


    ```

    C:\Backup>A:

    ```


    The prompt would then change to look like this:


    ```

    A->

    ```


    To make a new directory, use the MD command. The new directory is placed as a
    subdirectory of the current directory unless you specify otherwise. For example,
    the following command would create a new directory called Files as a subdirectory
    of C:\Backup:


    ```

    C:\Backup>MD Files

    ```


    To remove a directory, it must be empty, so you must delete everything it with
    the DEL command (discussed later). Then use the RD command like this:


    ```

    C:\Backup>RD Files

    ```


    # Working with Files at a Command Prompt


    If you are accustomed to working with files in Windows using Windows Explorer
    or My Computer, you''ll find the command-prompt method of managing files slow
    and awkward. It''s much better to do your file management from within Windows
    whenever possible.


    However, sometimes you might not have a choice. Therefore, you should have a good
    grasp of the commands necessary for manipulating files at a command prompt.


    Let''s start with the most basic command: DIR. It''s short for Directory, and
    it lists the contents of the current directory. So, for example, this command:


    ```

    C:\Windows>DIR

    ```


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_311_0.png)


    292'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Essential Windows Tools Skills


    would produce a listing of the subdirectories (folders) within C:\Windows. You
    can get a directory of other locations by specifying them in the command. For
    example, this command would give you a listing of what''s on the A: drive''s floppy
    disk:


    ```

    C:\Windows>DIR A:

    ```


    A couple of useful switches for the DIR command: /W displays the listing in a
    ''wide'' (multi-column) format, and /P displays them in a page-by-page format
    (one screenful at a time).


    Another useful command is COPY, which copies files from place to place. For the
    syntax, just remember COPY What Where. For example, copy everything from the root
    directory of the A: drive to C:\MYFILES, use this command:


    ```

    C:\Windows>COPY A:\* C:\MYFILES

    ```


    Yet another command you will need to know DEL, short for Delete. It deletes the
    specified file(s). For example, to delete the file TEXT.DOC from the A: drive,
    you would use this command:


    ```

    C:\Windows>DEL A:\TEXT.DOC

    ```


    As usual, you don''t have to type the location if the file is in the current directory.
    So, for example, to delete all the files in C:\Backup, first change to that directory
    (CD \BACKUP) and then delete the files like this:


    ```

    C:\Backup>DEL *.*

    ```


    One last command: REN, short for Rename. Its syntax is REN Oldname Newname. So
    rename the file APRIL.DOC to MAY.DOC, use this command:


    ```

    C:\Backup>REN APRIL.DOC MAY.DOC

    ```


    This chapter''s discussion barely scratched the surface of the commands a good
    technician should be able to use at a command prompt, but by now you should have
    a sense of what command prompt is about. For more information, pick up a basic
    book on MS-DOS or an advanced book on Windows that covers command prompts.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_312_0.png)'
