  md: '# Chapter 15


    | Table 15.1: Internal MS-DOS Commands |

    | Command | Purpose |

    | --- | --- |

    | Dir | Displays a listing of files and folders |

    | Copy | Copies files and folders from one location to another |

    | Del | Deletes files |

    | CD | Changes to a different directory |

    | MD | Creates a new directory |

    | RD | Removes directories |

    | Ren | Renames files and folders |


    | Table 15.2: Windows 9x Startup Disk Commands |

    | Command | Purpose |

    | --- | --- |

    | Extract | Extracts files from compressed archives, such as those that Windows
    setup files are stored in on the Windows CD-ROM |

    | Fdisk | Runs the Fixed Disk Management partitioning utility program, for creating
    and deleting disk partitions. |

    | Attrib | Shows, sets, and changes attributes on files such as Read-Only, Hidden,
    and System. |

    | Chkdsk | Performs a basic data integrity check on the file system. This is an
    older utility; Scandisk is the newer version. |

    | Edit | Runs the MS-DOS Editor, a text editing program similar to Notepad but
    not Windows-based. |

    | Format | Formats hard and floppy disks. |

    | Scandisk | Performs data integrity and physical disk surface checks on disks.
    |

    | Sys | Transfers the bootable system files from one disk to another. |'
