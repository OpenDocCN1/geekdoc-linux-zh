  md: '# How Video Cards and Monitors don''t use 15-pin connector; instead,


    Some high-end monitors don''t use the standard 15-pin connector; instead, they
    use separate BNC connectors for red, green, and blue. (Obviously, this requires
    a special, high-end video card too.) You will seldom see this type of monitor
    connection on an ordinary PC, but you might find it on a large screen in a video
    teleconferencing center, for example.


    # BNC


    Stands for British Naval Connector. The type of connector used on coaxial cable
    (the kind used with cable TV). Some televisions show BNC as an abbreviation for
    words including Bayonet-Net-Neill-Concelman or Bayonet Coupler.


    # Display Resolution


    The monitor''s screen is made up of individual dots called pixels. Each pixel
    can be a different color from the one adjacent to it. The video card tells the
    monitor which pixels to light up and what colors to make them. It sends new information
    about each pixel to the monitor hundreds of times a second, making any animation
    on the screen look smooth and seamless.


    # Pixel


    The monitor has a maximum number of pixels it can display across and down. This
    is known as its maximum resolution, and it''s described with two numbers: width
    times height. For example, my monitor''s maximum resolution is 1900x1200. The
    video card and monitor must agree upon the resolutions that they can both support
    as a team.


    A dot with a separately described color from the kind used surrounding the dots
    on the display.


    You don''t need to run the monitor at its maximum resolution. It will work nicely
    at any resolution up to and including its maximum. You can switch among resolutions
    by making the change through the operating system. For example, in Windows you
    set display properties that tell the video card what resolution to instruct the
    monitor to use. You can run Windows at resolution from 640x480 (Standard VGA)
    up to your monitor''s physical maximum—provided your video card has enough memory
    (we''ll get into that later in the chapter).


    # Resolution


    The number of pixels across and down in a particular video display mode.


    The higher the resolution you choose, the smaller everything onscreen in a graphical
    interface like Windows. That''s because each item on a Windows screen is a fixed
    number of pixels, so if the pixels are closer together, the object looks smaller.
    To fill in the extra space, Windows expands the Desktop on which everything sits,
    so a high-resolution display will have much emptier Desktop behind the icons and
    windows than a lower resolution.


    # Standard VGA


    VGA stands for Video Graphics Array; it''s standard for basic operation of all
    modern monitors. Standard VGA is 640x480 pixels of resolution and 6 colors.


