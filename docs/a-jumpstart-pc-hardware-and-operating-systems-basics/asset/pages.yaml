  md: '# Setting Up Internet Connections


    assigned by your ISP. Most ISPs, however, do not assign fixed IP addresses because
    there are only a limited number of them to go around and not every customer will
    be connected to the Internet at the same time. Therefore, whenever you connect,
    the ISP assigns a dynamic IP address. You keep this IP address for as long as
    you''re connected, and when you terminate the connection, it goes back into that
    ISP''s pool of addresses. You don''t decide this yourself; your ISP tells you
    what settings to use. Almost dial-up connections use dynamic IP addressing. Always-on
    connections such as cable or DSL can use either.


    Dynamic IP address

    An address that is assigned from a pool of available addresses upon connection,
    and released upon disconnection.


    # DNS


    Even with the decimal numbering system and the separators, IP addresses are not
    exactly catchy, and them can be difficult. A DNS server, therefore, is used to
    translate IP addresses into text-based addresses called URLs that have familiar
    words that people can remember


    DNS servers are all over the world. These specialized servers have the job of
    translating each address that a client requests in URL form into an IP address
    and sending that IP address back to the client for its use. All the DNS servers
    share information with one another (although sometimes when it changes, it takes
    a day or so to change out to the DNS servers in the world).


    DNS for Domain Name System. A method of translating numeric IP addresses to text-based
    URLs.


    For example, suppose the client types www.sycamore11.com. The DNS server comes
    back with the information that this address translates to 207.150.192.12, and
    the web browser software uses that information to connect to the website. This
    is called a DNS Lookup. If you see a DNS Lookup Error in a web browser, it means
    the DNS server has failed to provide a translation for the address you entered.
    It could be there is no information available or because the DNS server is not
    working.


    URL for Uniform Resource Locator. The tested name of a network (usually Internet)
    resource that maps to an IP address through a DNS server, expressed in http://format.


    When you set up an Internet connection, you can enter the IP address of a specific
    DNS server that your ISP has instructed you to use, or you can set it to automatically
    find a DNS server. Again this is not a decision you make yourself; your ISP tells
    you how to set it up.


    # Subnet Masks


    When you set up an Internet connection with a static IP address, you also have
    the opportunity to enter a subnet mask. This is usually something involving 255s
    and 0s, like this: 255.255.255.0. The easy answer is to just enter what your ISP
    instructs and leave it at that. Those of you are curious about how things work
    can read the next few paragraphs; the rest of you can skip them and not be less
    prepared for the A+ exams.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_346_0.png)


    327'
