    \ thing that looks like a suction cup;\nthat's the high-voltage anode.\n\nInside\
    \ the PC itself, has nothing voltage to kill, but the power supply can\ndel a\
    \ nasty 110-volt shock if you tamper with a tangle of colored wires emerging from\
    \ it. This metal box\nside the PC with some screws that enable you to disassemble\
    \ it. Don't.\nsealed, but it has\n\nWhen working on a PC, you should always unplug\
