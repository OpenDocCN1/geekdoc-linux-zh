    dictate some special procedure, as running a setup program first, then installing
    the hardware, and then finishing up with another setup program. Usually you can
    skip all that and just do it as described. However, if the modem doesn''t work
    after you install it, you may go back and check out those instructions and give
    the prescribed procedure a try.


