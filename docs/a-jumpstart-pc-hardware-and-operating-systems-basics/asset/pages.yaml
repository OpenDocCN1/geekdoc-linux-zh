  md: '# Understanding CPUs


    Just because a PGA chip is physically compatible with a particular socket is no
    guarantee that it will work in that motherboard. Compatibility also depends on
    the motherboard''s chipset (which determines the machine language it speaks) and
    on the voltage that the CPU requires (usually 5v or 3.3v). For example, Pentium-class
    motherboards use a Socket 7 socket but use split-voltage scheme that runs the
    CPU internally at a lower voltage (2.8v) while it communicates with the rest of
    the CPUs at 3.3v. A CPU that requires a split-voltage motherboard will not work
    in earlier motherboards that have a Socket 7 socket. A motherboard containing
    a socket that can accommodate any Socket 7 CPU, whether split voltage or not,
    is called a Super Socket 7.


    +   Slot 1

    A motherboard slot that accepts an Intel SEC cartridge-CPU.


    The Pentium II CPUs used an SEC design (described in the following section), but
    don''t imagine that the PGA style died out at that point—far from it. Both the
    Pentium III and Pentium 4 use a type of PGA slot too.


    # SEC CPUs


    One of the problems with PGA CPUs, from Intel''s point of view, was that competitors
    could make CPUs that would work in motherboards designed for Intel CPUs. To prevent
    this with the Pentium II, Intel trademarked the type of slot it fits into, calling
    it Slot 1, such that no other CPU manufacturers could develop compatible CPUs.(Later
    there was also a Slot 2, a slightly larger version that was used with a few high-end
    CPUs.)


    You''ve already seen an SEC CPU in earlier chapters; it''s a cartridge with a
    board edge sticking out of the bottom. That''s the ''single edge'' in the name
    Single Edge Contact:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_86_0.png)'
  merge: -1
