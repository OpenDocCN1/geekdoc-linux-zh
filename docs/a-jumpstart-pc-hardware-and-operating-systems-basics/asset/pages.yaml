  md: '# Chapter 5


    On the above motherboard, there are three banks. The four 30-pin slots are a single
    bank, and each of the two 72-pin slots are a bank.


    Here''s a 64-bit DIMM. Each one stands alone in a single bank.


    # Parity


    An error checking mechanism in RAM that uses an extra bit to ensure data accuracy.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_103_0.png)


    On some systems during the transition period between SIMMs and DIMMs, you might
    find both SIMM and DIMM slots. On such a system, the SIMM slots are in banks of
    two, and each DIMM is a separate bank. On newer motherboards there will be only
    DIMM slots.


    > WARNING

    In systems with multiple slots per bank, you must be careful to place identical
    sticks of RAM in each slot of a bank. Different banks can have different RAM,
    but within a bank they must all be the same capacity and speed and have the same
    special features (if any).


    # Parity Checking


    Because RAM was not completely reliable in the earlier days, a system of error
    checking was developed called parity. Memory with parity checking had an extra
    1-bit chip that functioned as a cross-check to make sure the data was stored correctly.
    A parity check compares the number of 1 values stored in a particular byte with
    the number of 1 values found when accessing that byte. If the values are the same,
    the data is assumed to be correct. If the values are not the same, a parity error
    occurs and you see an error message.


    Here are a couple of sticks of memory—one parity and one non-parity. Count the
    number of chips: the parity model has an extra one. (It wouldn''t be as obvious
    if the SIMMs didn''t have eight and nine chips.)'
