    to those of a less-expensive LCD monitor having a maximum resolution that matches
    the resolution at which it is being operated.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_128_0.png)


    # WARNING


    Not all LCD screens can operate in less than their maximum resolution. On some
    notebook PCs, if you change the resolution in Windows to a lower one than the
    maximum, a black ring appears around the outside instead of everything appearing
    larger on the screen. This is mostly an issue on older notebook PCs. If possible,
    you should view a notebook PC in the resolution in which you plan to operate it
    before you buy it.


    Refresh rate

    The rate at which pixels are refreshed on a monitor, expressed in hertz (Hz).


    # Interlacing


    Some older monitors, or cheaper ones sold, have electron guns that can''t keep
    up with the refreshing needs to display a decent picture. Rather than spending
    more money for better electron guns, the manufacturers sometimes use a technique
    called interlacing to make the monitor''s picture less flickering. Interlacing
    refreshes only every other line of the display with each pass, rather than every
    line. Avoid using monitors that cannot achieve a decent refresh rate (say, 85Hz)
    at the resolution you want without interlacing. There is little reason to buy
    an interlaced monitor today—assuming you even find one—because monitor technology
    has advanced over the last few years to the point where interlacing is seldom
    necessary.


    # Refresh Rate


    As soon as an electron hits a phosphor, it immediately begins to start decaying,
    so each triad in the display must be refreshed by a re-hit with the electron gun
    hundreds of times per second. If pixels are not refreshed quickly enough, the
    display flickers, causing eystrain. The measurement of how many times per second
    the display is refreshed is its refresh rate.


    The higher resolution used, the more challenging it is for the monitor to refresh
    at top speeds because the increased number of unique pixels involved. At a refresh
    rate lower than 75Hz or so, a display flickers noticeably, so a high maximum refresh
    rate is an important feature in a monitor. The maximum refresh rate is typically
    not expressed as a single number, but as a separate number for each of several
    common resolutions. For example, a monitor might be capable of 120Hz at 800×600,
    but only 85Hz at 1280×1024. To change the refresh rate, see “Adjusting Display
    Settings in Windows” later in this chapter.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_128_1.png)


