  md: '# Chapter 17


    A look to to the Resources tab shows that the resource in short supply is an IRQ.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_325_0.png)


    Resource troubleshooting can be much more complicated, but you''ve just seen 90
    percent of the job right here. The essential steps are


    +   1. Check Device Manager.

    2. Identify the source of the conflict.

    3. Manually reassign resources until you resolve the conflict.


    > TIP Windows 2000 and XP are fairly good at resolving resource conflicts on their
    own through Plug and Play, so in real life you will seldom see a resource conflict.
    I "manufactured" the conflict I used as an example here, just so you could see
    what one looked like, but in a normal system COM1 would likely share an IRQ with
    no problems.


    If the problem is occurring because there are no free IRQs, you might disabling
    one of the legacy serial or parallel ports that you aren''t using. Remember that
    these ports use resources even when nothing is plugged into them; you can disable
    them in BIOS Setup.


    Another resource management method that I have occasionally found helpful is to
    physically remove all nonessential hardware from the PC and make sure it is removed
    from Device Manager, and then reinstall all of the ISA and non-Plug and Play hardware
    first. Then reboot Windows and make sure all devices have resources they they
    need. Then Add the PCI Plug and Play hardware, one piece at a time and rebooting
    Windows after each installation. Sometimes this will coax Windows into managing
    the resources better.


