  md: '# How a CPU Works


    CPU stands for Central Processing Unit, often shortened to just "processor" or
    "microprocessor." The CPU''s sole job is to perform mathematical calculations.
    Data comes in, data gets processed, and data goes back again. The CPU is sort
    of Like Rain; it''s great at what it''s great at (math), but it''s limited. It
    doesn''t figure out what to do with that data; it crunches the numbers, many millions
    of them per second. The PC relies on the operating system to be sensible guys
    who figure out what needs to be calculated and why.


    External data bus


    The bus transfers data from outside the CPU to inside and then back out again.


    Register


    A work area inside the CPU that holds a numeric value while the CPU performs calculations.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_79_0.png)


    > NOTE The following sections contain more technical theory than you will need
    to work on PCs in real-life; I''m telling you all this stuff only because I think
    you might find it interesting and because of it might come up on the A+ exam if
    you decide to take it.


    Low-order bits


    The first four bits in a byte (reading from right to left), representing data
    to be processed.


    # How Data Is Processed


    Data comes in and goes out of the CPU on the external data bus. It''s called external
    because it enables data''s that outside the CPU (external to it) to get inside.
    Each of the bits on the CPU carries an electrical charge. Data enters and exits
    the CPU by patterns of electrical passing through these paths.


    High-order bits


    The second four bits in a byte (reading from right to left), representing the
    instructions for processing the data.


    Once the CPU, the data is stored, arranged, and calculated in work areas called
    registers. For example, if the CPU were adding 5+1, the numbers 5 and 1 would
    be in registers while the CPU was preparing the answer.


    When data comes in and is in a register, a part of that data is the number representing
    the operation to be performed on it. For example, suppose you use the CPU byte
    of data (eight bits). The first four bits represent the data (low-order bits)
    and the second four represent the instruction for processing (high-order bits).
    So, if example the CPU received 10011100, it would treat 1001 as data and 1100
    as an instruction. (The CPU) actually reads from right to left, so the number
    it receives would be backward to that: 00111001. However I''ve written it from
    left-to-right in this book because that''s what we English-reading humans expect.


    A byte uniquely represents single alphanumeric character, so how can we suddenly
    only the first four bits are for data? At this micro level of detail, we''re dealing
    with alphabet characters-only numbers. If we''re working only with numbers, four
    digits are more than enough to describe them. This code of low-order and high-order
    bits that the CPU understands is known as the


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_79_1.png)'
  merge: -1
