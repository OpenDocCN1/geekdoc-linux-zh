    # Partitioning


    You already know what partitioning is; here''s how to actually do it.


    # Windows 9x


    In Windows 9x/Me, get to a command 9 prompt. You can do this by booting from your
    emergency startup disk or by choosing Start > Programs > Accessories > MS-DOS
    Prompt from within Windows. (In some versions, it may just be Start > Programs
    > MS-DOS Prompt.)


    From the command prompt, type FDISK and press Enter. In Windows 98 and Me, you''ll
    see a message about enabling large drive support. If you choose Y, the partitions
    you create will be FAT32 partitions and won''t be accessible from MS-DOS, Windows
