  md: '# Troubleshooting


    # Internet Connections


    Here are a few of the most common problems encountered and some suggestions for
    solving them.


    **Modem won''t dial** Make sure the correct modem is identified in the properties
    for the DUN connection, and make sure that the correct COM port has been assigned
    to the modem in Modem Properties.


    **Modem won''t stay connected** This can happen sometimes because of problems
    with ISP, so don''t assume it your PC''s fault unless the problem is persistent
    and the connection has never worked right. If it hangs up after a minute, check
    to make sure the TCP/IP protocol is installed in Network Properties. If it hangs
    up at random intervals, try a different access phone number for your ISP or a
    different phone cord. Also make sure that you have the cord plugged into the correct
    jack on the modem. You could also ask the phone company to test your phone line
    for quality.


    **Can''t send or receive e-mail** If you can view web pages but you can''t get
    your e-mail, and you have never been able to get your e-mail from this PC, the
    problem is likely some bad e-mail settings. Edit the properties for your e-mail
    account in your e-mail program. If you have been able to get your e-mail in the
    past but can''t at the moment, and you have not made any recent changes to your
    settings, it is almost certainly a mail server problem and there is nothing you
    can do about anything. Just wait for ISP to get it fixed.


    Much more is involved in troubleshooting problems with TCP/IP than the hints provided
    here; entire books are devoted to the subject. If you find yourself spending a
    lot of time with TCP/IP, you might want to review some Network+ study materials.'
