    and writes data to the disk.


    Protected mode A PC operating mode compatible with 80286 and higher CPUs, addressing
    multiple megabytes of RAM.


    Real mode A mode of operation for an 80286 CPU that makes it compatible with applications
    written for the 8088 CPU.


    Protocol A language or set of rules for translating between devices.


    Real mode MS-DOS mode, in which only a single task can be performed at once. MS-DOS
    operates in Real mode; Windows does not.


    Protocol Generally, a set of rules governing a situation. When referring to communications,
    a set of rules that specify how the data is sent and received.


    Real mode A PC operating mode compatible with 8086 CPU, addressing only 1MB of
    RAM.


    PS/2 port A round port used for connecting keyboards and mice. The name derives
    from IBM PC that used this type of connector. The PS/2 computer is long obsolete,
    but the plug type is still used.


    Recovery Console A command interface for troubleshooting problems with a Windows
    2000 or XP installation.


    Recycle Bin A temporary storage area for files and folders that have been deleted.


    Quick format A faster normal way of reformatting an already-formatted disk that
    wipes out the FAT contents rather than physically reformatting the data area.


    Refresh rate The rate at which pixels are refreshed on a monitor, expressed in
    Hertz (Hz).


    RAM Chips that store using electrical impulses that are constantly refreshed by
    the power supply. When the power goes off, the data is erased. Also known as memory,
    memory actually is a broader term encompassing more than just RAM.


    Register A work area the CPU holds a numeric value while the CPU performs a calculation
    upon it.


    Registry A configuration file that specifies how Windows 95 will look higher and
    act in relation to users, applications, and hardware.


    RAM Random Access Memory Memory that you can read from and write to.


    Resident A font that is stored in the printer''s ROM and is available at all times,
    regardless of what PC is connected to.


    RAM depth The number of rows that can simultaneously store. Analogous to a column
    on a spreadsheet.


    Resistance The amount of obstacle in an electrical pathway.


    RAM disk A temporary virtual disk created out of RAM.


    Resolution The number of pixels across and down in a video display mode.


    RAM width The number of bits that the RAM can simultaneously access. Analogous
    to a row on a spreadsheet.


    Ribbon cable A cable consisting of several wires laid out in a flat, side-by-side
    arrangement and encased in plastic. It gets its name from the fact that the flat,
    wide cable looks like a piece of ribbon.


    Random access Able to jump and access any part of the data just as easily as any
    other part.


