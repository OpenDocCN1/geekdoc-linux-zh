    Some of the advantages that Windows 2000 offers over Windows NT 4 include:


    **Windows 95/98 feature integration** Windows 2000 supports Plug and Play, FAT32,
    USB, and ACPI power management, all of which were present in Windows 98 but missing
    from Windows NT 4.


    **Different server versions** Windows 2000 offers three different versions of
    the server software. Each is appropriate for a different size of network: Windows
    2000 Server for small to medium-sized networks, Windows 2000 Advanced Server for
    large ones, and Windows 2000 Datacenter Server for extremely large ones.


    **Active Directory** a networking feature that allows all network resources to
    be administered from a single point. Windows 2000 servers (all versions) provide
    Active Directory, and Windows 2000 Professional PCs can use the directory.


    **Dynamic disks** An alternative to normal partitioning that stores the disk configuration
    in a disk management database in the last 1MB of storage on the drive. Dynamic
    disks offer many advantages over standard disks, such as the capability of being
    resized and combined with other partitions. However, they cannot be read by any
    earlier version of Windows or MS-DOS.


    # Windows XP


    Windows XP is the latest version of Windows. It is not covered on the A+ examinations.
    The main thing to know about Windows XP is that it is the culmination of a 10-year
    project to merge the two Windows tracks: Windows 95/98/Me and the business side
    with Windows NT/2000. From an internal standpoint, it is based on Windows NT/2000,
    so it is very stable, the user interface is chock-full of features designed to
    make the average user feel at home. The end user (client) product comes in two
    versions: Professional and Home Edition. The Home Edition is the same as Professional
    except it lacks a few features and utilities and costs about $100 less. The server
    version is called .NET rather than XP, and it is scheduled for release in early
    2003.


    # Selecting an Operating System


    Now that you know the differences between some Windows versions, you can select
    the right operating system for a particular PC.


    Each version of Windows requires a certain minimum hardware configuration. Table
    14.1 lists the requirements. For the A+ exam, you should familiarize yourself
    with the requirements for Windows 98 and Windows 2000 especially.


