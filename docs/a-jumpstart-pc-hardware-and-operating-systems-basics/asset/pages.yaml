- img_proc: true
  md: '# Glossary


    A code typed following a command-prompt command that further defines the command
    was executed.


    Transfer corona wire A laser printer that applies a positive charge to the paper
    on which the image will be printed.


    System bus The bus that carries data between CPU and memory. Also called the external
    bus. ''external'' refers to the fact that the bus is outside CPU; the CPU also
    has its own internal bus.


    TrueType font A software-based outline font that works with Windows-supported
    printer and application. TrueType fonts are also used on Macintosh computers.


    System crystal A quartz oscillator on the motherboard that sets the pace for movement
    of data into out of the CPU.


    Typematic The quick repetition of a typed character, such as holding the period
    key to make a row of dots. Also called character repeat.


    CP/IP Stands for Transmission Control Protocol/Internet Protocol. A communications
    protocol used the Internet and in many LANs.


    Upload To transfer a file from your PC to another PC.


    Upper memory The last 30KB of a PC''s megabyte of RAM. Reserved for system use.


    CP/IP Transmission Control Protocol/Internet protocol. A set of communication
    standards for receiving and delivering data over a network.


    URL Stands for Uniform Resource Locator. The text-based name of a network (usually
    Internet) resource that maps to an IP address through a DNS server, expressed
    in http://


    Terminate To close the SCSI chain at the end, shutting the system that there are
    no other SCSI devices in the chain.


    VGA display A display mode consisting of 640480 resolution and 4-bit color depth
    (16 colors).


    FT Thin Film Transistor. A type of LCD display uses multiple transistors for each
    pixel, resulting a very bright and high-quality display.


    Video card An expansion board that adds a port into a monitor or can be connected.
    Also called video board or video adapter.


    Thermal inkjet printer An inkjet printer that eats the ink to create bubbles that
    out.


    Driver file A file that translates instructions from the operating system into
    commands that the driver understands.


    Power case A PC case designed to stand upright.


    Virtual 8086 Using a single CPU to simulate multiple 8086 CPUs or several tasks
    can run concurrently.


    Trackball A mouse in which the body stays stationary and the user rolls the ball
    manually.


    Virtual machine A simulated separate CPU that runs independently of other activities
    occurring on the same physical system.


    Racks Concentric bands on a disk platter, like engine on a tree.


    Virtual memory Using the hard disk to simulate RAM.


    Tractor fed A paper feed system that uses continuous paper (where one sheet is
    attached to the next at top and bottom) and pulls the paper through the path with
    gears that grab onto perforated holes on the sides of the pages.


    365'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# Appendix C


    Virtual IP addressing Assigning internal IP addresses to PCs that are separate
    from their external IP addresses in order to share an external IP address among
    multiple PCs. Private IP addresses begin with 92.168 and range from 92.168.0.1
    to 192.168.255.254.


    Virus A program designed to spread from one PC to another and (usually) to cause
    damage to the PCs or annoyance to the user.


    Virus definitions A data file containing the text strings that the antivirus program
    searches for to determine virus infection


    Voice A channel in the sound card that plays a single note by a single instrument.
    A typical sound card might have 64 voices, or 64 different sounds could be played
    at once.


    Volts The measurement of the strength of a positive or negative electrical charge.


    Volume label An internal identifier for a formatted disk. It appears under the
    drive icon in My Computer in Windows and at the top of a file list from a command
    prompt. It has no relationship to any physical label on the outside of the disk.


    Wattage The amount of electricity a device uses, determined by multiplying volts.


    Wave table synthesis A method of storing waveforms of various musical instruments
    in the sound card''s memory and then playing them back when playing MIDI music.
    Results in more natural sounding MIDI music.


    Waveform A sound that originates in the real world, rather than being originated
    by a computer.


    Web browser A program that displays web pages.


    Web hosting company A company that charges money to store their websites and keep
    them available at all times to clients.


    Web text A document embedded with HTML codes that make it possible to be formatted
    and/or contain pictures and other elements viewed with a web browser.


    Wide Area Network A network in which resources are separated physically from one
    another (not in the same building).


    Wildcard A character that represents any value. Two standard wildcards are * for
    any number of characters and ? for a single character.


    Windows Clipboard A tool for copying and moving data between Windows applications.


    Windows components Programs, utilities, and add-ons that come with Windows itself
    rather than being purchased separately.


    World Web A network of web pages available for display on the internet.


    Write-protect To make a file read-only so that nothing can be changed, added,
    or deleted.


    XMS Stands for Extended Memory Specification. A standard for using extended memory
    in applications.


    ZIF Zero insertion force. A type of socket into which you can insert a chip without
    any pressure to it. ZIF sockets are advantageous when you''re working with a chip
    that has many "legs" or pins it reduces the chance of bending one of them.


