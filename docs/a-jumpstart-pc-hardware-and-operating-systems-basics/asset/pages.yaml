  md: '# Chapter I


    > NOTE\Nothing bad is likely to happen if you clean the monitor with the power
    on, but it never hurts to play it safe. Long time ago I saw a store employee fry
    a monitor by spraying glass cleaner on it while it was running, and that image
    has stayed with me ever since. Besides, it''s much easier to see the spots and
    dirt on the monitor when it''s turned off.


    Don''t use regular glass cleaner on a monitor because it contains ammonia and
    can potentially harm the anti-glare coating used on some monitors. Don''t use
    soap because it can leave a residue.


    Clean the plastic parts of the monitor with a clean damp cloth and a mild soap
    solution. Make sure the cloth is just barely damp-not wet! Damage can result if
    you drip water down inside the vents holes on the monitor.


    # Cleaning a Keyboard


    A keyboard can get pretty filthy, because it''s always being touched. To clean
    one, first make sure the PC is off. (You don''t necessarily need to unplug the
    keyboard from the PC.) Then do the following:


    +   1. Turn the keyboard upside down and shake it. This clears the debris from
    under the keys.

    2. Wipe the keycaps with a damp cloth and mild soapy water.

    3. Use a folded moistened paper towel to reach in the cracks between the keys.
    Be careful not to drip water under the keys.

    4. Allow the keyboard to dry before using it.


    If you spill liquid on the keyboard, turn off the PC right away, shake the keyboard
    upside down to get rid of the bulk of the liquid, and then clean it and let it
    dry thoroughly. If the liquid contained sugar, and it went below the keys, you
    probably won''t be able to get it clean: just buy a new keyboard. Some people
    have had washing a keyboard in a dishwasher (on the top rack, with no heated drying),
    so if you''re going to throw the keyboard away anyhow, you might try it.


    > WARNING

    Don''t try to remove the individual keys on a keyboard for cleaning. You''ll find
    it very difficult to get it reassembled.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_29_0.png)'
