  md: '# A Look at Some Expansion Boards


    # Types and Features


    Throughout the history of sound cards, they have all internal models, either on
    expansion boards or built into the motherboard. However, Creative Labs recently
    came out with an external sound card (actually it''s not a card at all, more like
    a box) that connects to the PC via USB port. Because it''s external, it isn''t
    subject to the constraints of the PCI or ISA bus and will work on any PC with
    USB support—even a notebook PC. It''s pretty cool—but also pretty high-end and
    overkill for most people.


    Assuming you have an internal model, you''ll probably want a PCI bus. ISA versions
    are still available (although becoming less common), but they are inferior for
    the reasons I''ve outlined in earlier chapters concerning the differences in the
    buses.


    It is not uncommon for an ISA sound card to take two DMA channels, one two IRQs,
    and a large range of I/O addresses. Next, see FM synthesis versus table synthesis.
    This has to do with how MIDI music is played and recorded. Originally all sound
    cards were FM synthesis. FM synthesis simulates musical instruments when a MIDI
    program is playing or music. For example, suppose you have MIDI software for your
    electronic keyboard that can make it sound like an oboe. With an FM synthesis
    sound card, the computer calculates what an oboe sounds and sends that through
    the speakers. It doesn''t sound exactly like a real oboe.


    Wave table synthesis became popular years ago, and nowadays almost all sound cards
    use table synthesis. These sound cards store waveform audio clips of instruments
    playing various notes in their Own Read Only Memory (ROM), and when a MIDI program
    calls for a particular instrument to play a note, the sound card records it from
    its database. This results in MIDI music that sounds almost exactly like real
    waveform music.


    Even though almost all sound cards support wave table synthesis to some extent,
    they vary in how many instruments they have stored in them. Most cards have at
    least 128 instruments these days; some also have several different drums too.
    Cards also vary in how many voices they can support. A voice is a single instrument
    playing a single note. The more voices, the more notes and instruments can be
    handled simultaneously. Sixty-four-voice support is not uncommon in today''s sound
    cards.


    There are many other shopping spots for high-end sound cards, but they''re not
    important to know for the A+ exam. You may want to look into them on your own
    if you''re in the market for a sound card. Some of them include EAX Technology
    support, multi-speaker support (that is, for multiple sets of stereo speakers).
    Surround Sound support, advanced encoders for creating MP3 files, and a digital
    signal processor.


    # Wave table synthesis


    A method of storing waveform clips of various musical instruments in the sound
    card''s memory and playing them back when playing MIDI music. Results in more
    natural sounding MIDI


    # Voice


    A channel in the sound card that plays a single note by a single instrument. A
    typical sound card has 64 voices, so 64 different voices could be played at once.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_202_0.png)


    183'
