    from


    **Slot mask** A hybrid technology combining shadow mask and aperture width.


    **Software font** A font provided to the printer via software on the PC.


    **Safe mode** A limited-functionality Windows troubleshooting mode in which only
    essential drivers are loaded.


    **Software mode (Winmod)** A Windows application that relies on its hardware in
    order to work. Software modem works only with a specific operating system (usually
    Windows).


    **SCSI** Small Computer Systems Interface. An interface for connecting devices
    and others to a PC that allows chaining of up to seven devices together. An alternative
    to IDE


    **Sound card** An expansion board that functions as a converter between analog
    sound and digital data, enabling the computer to generate and receive audio output
    and input.


    **SDRAM** Synchronous Dynamic RAM in in which the speed is the same as the system
    bus. Speeds are measured in megahertz (MHz).


    **Splash screen** The graphic that appears when Windows or other program is loading.
    Usually lists the program name and version number.


    **SEC** Single Edge Contact cartridge. A type of CPU mounted on a circuit board
    inside a plastic casing.


    **Standard VGA** VGA stands for Video Graphics Array; it''s for basic operation
    of all modern monitors. Standard VGA is 640x480 pixels of resolution and 16 colors.


    **Sector** A section of a track created by lines cutting across the diameter of
    the disk platter.


    **Startup disk** A bootable floppy disk containing command line utilities for
    troubleshooting.


    **Server** A computer that serves data to other PCs and provides access to network
    resources.


    **Shadow mask** A grid of perforated metal with holes that guide element placement
    to ensure that the correct phosphors are illuminated on a CRT.


    **Static RAM** RAM that retains its data until it is received. Abbreviated as
    SRAM.


    **Sheet fed** A paper feed system that uses individual pre-cut sheets of paper.


    **Stick** A small circuit board on which is mounted multiple RAM chips. SIMMs
    and DIMMs are both sticks.


    364'
