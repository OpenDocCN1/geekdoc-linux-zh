  md: '# Chapter 18


    After an abnormal shutdown, you should run Scandisk (or Check Disk) sure no file
    system errors have been created. Some versions of Windows run Scandisk automatically
    when starting up after an abnormal shutdown.


    Once you''re back in line, look for the underlying problem causing the error.
    Some reasons for this type of problem include:


    +   **Corrupt or incompatible video driver** Download and install the latest version.


    +   **Conflicting or poorly written programs loading at startup** I have quite
    often with my beginner-level clients--they''re suckers for any ''free offers''
    they see on the Internet, many of which download little programs at startup and
    clog things. Clean out the Startup folder at the Start Menu, and use Add/Remove
    Programs to remove as many of the noninstalled programs as possible. If needed,
    use MSCONFIG to turn off certain programs from starting automatically to figure
    out which is causing the problem.


    +   **Overheating** If the system locks up after somewhere between 5 and 30 minutes
    of operation, and it seems to be random, suspect a faulty cooling fan on the CPU.
    Make sure the fan is spinning and firmly attached to the CPU. Also make sure there
    are no missing backplates or drive covers that could be changing the airflow through
    the case.


    +   **Bad or incompatible RAM** The wrong kind of RAM (wrong speed, non-ECC in
    an ECC system, etc.) can cause random lockups, as bad RAM can. Check the motherboard''s
    RAM requirements, and use a hardware diagnostic program to check the installed
    RAM for errors.


    # System Lockup with Operational Mouse Pointer


    If you still have control over the mouse pointer but nothing else seems to be
    working, you might be able to do a controlled shutdown and restart. This is advantageous
    whenever possible because it minimizes the possibility of file system errors.
    See the section “Doing a Controlled Shutdown” later in this chapter.


    As fixing the problem, it may be a one-time thing. Just go about your business,
    and see if it happens again. If it does, refer to the troubleshooting suggestions
    in the preceding section. If it happens only when you run a certain application,
    then removing and reinstalling that application, or checking the manufacturer''s
    website to see whether a patch is available for it.


