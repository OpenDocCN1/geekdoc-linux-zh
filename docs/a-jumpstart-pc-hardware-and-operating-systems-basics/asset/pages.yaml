  md: '# What''s in a PC Technician''s Toolkit?


    Torx screwdrivers or bits A six-pointed star-shaped screwdriver head. Torx screws
    are often used to secure the covers on places where the manufacturer does not
    want the average consumer to venture, because most people do not have this type
    of screwdriver.


    Knife A cutting blade or utility knife of some sort.


    Windows 98 or Me startup disk Windows 95 startup disks do not contain real-mode
    CD-ROM drivers so will work from the command prompt. You must manually edit the
    CONFIG. SYS and AUTOEXEC. BAT files on a Windows 95 startup disk to add CD-ROM
    support. It''s a good idea, to have a Windows 98 or Me startup disk in your troubleshooting
    toolkit. It can be used on Windows 95 systems.


    Besides your toolkit, you will also want to carry a bag containing these useful
    items:


    Antistatic wrist strap A safety device that greatly reduces the chance of static
    damage to components by channeling any static electric charge to the ground instead
    through computer components.


    Roll of black electrical tape Helpful for wrapping wire ends and insulating components.


    Can of compressed air For cleaning components without using any hazardous liquids.


    Soft, lint-free cloth For cleaning the monitor and other components.


    Digital multimeter A meter that measures multiple types of electrical specs (ohms,
    amps, and volts).


    Finally, it is a good idea to accumulate a stockpile of spare parts if you do
    many PC repairs. Some suggestions are as follows:


    Screws A supply of various sized screws.


    Expansion card backplates Save the metal inserts that you take out of the back
    of a case when you put a modem or other card into the PC. You may need them again
    later.


    Drive faceplates Save the plastic faceplates that you remove from the front of
    cases so you can replace them later if needed.


    Mounting keys These are sometimes supplied with retail hard disks and allow you
    to put a 3.5-inch drive into a 5.25-inch bay. They are useful when your case has
    more free 5.25-inch bays than 3.5-inch bays.


    Cables Save any power, IDE, floppy, CD-ROM, or other cables that you may accumulate.


