    # Expansion bus


    The bus used by ISA expansion slots. Slow and old, soon to be obsolete.


    > NOTE


    The little circuit board of RAM on which the memory chips are mounted is sometimes
    called a “stick” in PC technician slang.


    # Expansion Slots


    You saw back in Chapter 2 that motherboards have expansion slots into which you
    can plug expansion boards that add new features like modems, network interfaces,
    and sound support.


    To better understand the expansion slots, let''s revisit the concept of buses.
    Remember, a bus is a pathway that carries data from place to place on the motherboard.
    Each slot type has a different type of bus.


    # Expansion Bus (ISA)


    The system bus carries data between the CPU and the RAM. Another type of bus is
    the expansion bus. It''s a much slower bus than the system bus, and it is used
    to carry data between Industry Standard Standard Architecture (ISA) expansion
    slots and the system bus. The width of the expansion bus is between 8 and 32 bits,
    depending on the system. Its speed is between 3MHz and 12MHz. Think about that
    for a moment—if the system bus runs at 100MHz, an ISA bus of only 12MHz (at most)
    has real traffic jam potential.


