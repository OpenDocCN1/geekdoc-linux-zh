  md: '# Glossary


    chipset The set of chips built into the mother board that collectively control
    its operation.


    Current The volume of electricity flowing through a circuit. Measured in amps.


    Client A computer that uses network resources an end user.


    Current directory The directory (folder) specified in the command prompt, to which
    commands will apply that are not specifically directed at some other location.


    Client/server network A network that includes both client and server PCs.


    Cylinder The same head position on a stack of platters in a multipl disk such
    as a hard disk.


    Clock cycle One "beat" or "tick" of the system byal''s oscillator.


    Desktop case A PC case designed to sit with its side flat on a desk.


    Clock multiplier The number of times by which the speed exceeds the internal speed.


    Device resources Pathways or memory addresses that help a device communicate with
    the CPU and the operating system.


    Color depth The number of unique colors that particular video monitor supports.


    Dial-up networking A Windows feature that enables clients to log into a remote
    network via telephone.


    Command line A line where user-ped text appears that could automatically be loaded
    each time the PC starts.


    DIMM Dual Inline Memory. A modern type of RAM packaging with 168 pins.


    CONFIG.SYS A file that lists the drivers that the PC loads when it starts.


    Directory Same as a folder. The term is often used rather than folder when referring
    to work at a command prompt.


    Conventional memory The first 640KB of it''s RAM. Used for running programs.


    DMA Direct Memory Access. A way of increasing data transfer rates by enabling
    the device to bypass the CPU and access memory directly.


    Convergence The ability of the electrons to align on each track. If one is slightly
    off, it will result in a green, red, or tint to the screen, either overall or
    in means.


    DNS Stands for Domain Name System. A method of translating IP addresses to text-based
    URLs.


    Cooperative multitasking Multiple tasks taking turns using the main CPU or one,
    with each application in charge of releasing the CPU when it is finished with.


    Dot pitch The measurement of the distance between one colored dot in a triad and
    the same color in an adjacent triad.


    PU Also called the processor, this large, powerful silicon chip does, calculations
    on it and spits them out into memory. The CPU is called the "brain" of a PC, but
    the "calculator" is actually more accurate because it does not think or reason
    for it.


    Double-click The speed at which one click must follow another in order for the
    PC to perceive it as a double click rather than two clicks.


    CRT Cathode Ray Tube. A type of monitor that uses a large vacuum tube and electrons
    to light up a glass screen.


    Double-scan passive matrix An improved passive display that divides the screen
    into sections and has one transistor for each row and column in each section.'
