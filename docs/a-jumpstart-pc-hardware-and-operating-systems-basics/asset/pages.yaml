  md: '# # Chapter 4


    loaded in memory. The 286 CPU performed basic math functions well, but it struggled
    somewhat with more complex math. A 287 coprocessor chip was available as an add-on
    for people who used their computers for activities involving advanced math.


    # Math coprocessor


    An extra chip that provides additional registers with which the CPU can process
    complex math calculations more quickly and efficiently.


    # 80386 CPUs


    The 80386 (or 386 for short) was a 32-bit cpu, with all the buses and registers
    running at 32-bit. Clock speeds ranged from 16MHz to 40MHz. Like the 286, it could
    run in protected mode, but the 386 actually had two different protected modes:
    286 protected and 386 protected. In 386 protected mode, it supported some new
    features, including virtual memory and virtual 8086.


    # 286 protected mode


    An operating mode for an 80386 CPU that emulates 80286 CPU.


    Starting with the 386, Intel began using an ''I'' at the beginning of the new,
    creating a trademarkable name. So we begin to use ''i386'' or ''i386'' on Intel
    brand CPUs.


    # 386 protected mode


    An operating mode for an 8036 CPU that takes advantage of 80386''s advanced features,
    but is incompatible with programs from earlier CPUs.


    Virtual memory made it possible to use of hard disk to simulate extra RAM. This
    allowed a computer to run programs that required more RAM than it physically had.
    Virtual 8086 made it possible to multitask—that is, several programs at once—by
    creating virtual 8086 processors and running a separate rate on each one. Even
    though processor could run only a single program at a time, collectively a 386
    system could run several programs at once.


    # Virtual memory


    Using the hard disk to simulate RAM.


    Not all motherboards at that time were 32-bit, because 32-bit motherboards were
    still expensive. A variation, on the 80386 chip was introduced the 386SX, which
    was just like a regular 386 but had a 16-bit external data bus and a 24-bit address
    bus. It offered most of the benefits of a 386, but it could work on a motherboard
    for a 286.


    # Virtual 8086


    Using a single CPU to emulate multiple 8086 CPUs so several tasks can run concurrently.


    With the 386 family, Intel faced its first competition from other CPU makers.
    AMD and IBM produced compatible 386-type CPUs, and in fact AMD produced the fastest
    386 chip available: a 40MHz model. Intel''s own 386 CPUs ran at a maximum of 33MHz.


    # 80486 CPUs


    The i486 was a 32-bit all-around chip (32-bit external data bus, registers, and
    memory address bus), and it contained a built-in math coprocessor and an 8KB


