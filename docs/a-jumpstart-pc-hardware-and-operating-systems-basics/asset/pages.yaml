    # ## Cleaning a Laser Printer


    Laser printers use toner rather than ink. Because toner is a dry substance (made
    up of a mixture of plastic resin and iron oxide), it doesn''t clog things the
    way liquid ink does. However, toner is a loose powder that can get all over your
    clothes and workspace if you don''t handle the cartridges with care.


    If you do spill some toner, use a slightly damp paper towel to clean it up as
    best you can. If you get it on your clothing, the best way to get it out is with
    a magnet. Because toner is half iron, it''s very magnetic.


    Several parts of a laser printer can accumulate toner on them, making them less
    effective over time. Until you learn the inside parts of a laser printer (Chapter
    12), this discussion might not make much sense to you, but remember it for later.


    The parts to clean on a laser printer include:


    +   **Corona wires** These are individual wires strung across the inside of the
    printer. Most printers have two: the primary corona and the transfer corona. The
    latter is inside the toner cartridge on some models Check the printer''s manual
    to find out whether you can clean them. If you can, clean them with a cleaning
    tool specially designed for that purpose, or


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_32_1.png)'
