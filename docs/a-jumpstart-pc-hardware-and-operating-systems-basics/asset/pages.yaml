  md: '# Setting Up an Internet Connection


    I introduced all those terms and protocols earlier so that when it comes to fill
    in the blanks to set up a connection, you''ll understand what the various blanks
    are requesting. So now that you''re fully armed with that knowledge, let''s get
    down to business!


    First, make sure you have the information you need from the ISP. For a dial-up
    connection, you will need:


    +   **Username** The name you will use when establishing the dial-up connection.
    This might or might not be the same as your e-mail username.


    +   **Password** You''ll need the password for establishing the connection.


    +   **Phone number** The phone number that your modem should call to connect to
    your ISP.


    +   **E-mail server information** You will need the names of the incoming and
    outgoing mail servers, the server type (probably POP), and your e-mail username
    and password.


    > If you don''t have the e-mail server information, you might be able to guess
    it. For example, if your ISP is Acme.com, your incoming mail server is either
    mail.acme.com or pop.acme.com, and your outgoing mail server is probably mail.acme.com
    or smtp.acme.com.


    **Newsgroup server information** Some ISPs provide a news server. This is another
    protocol we haven''t talked about yet in this chapter; it enables you to read
    newsgroups via a newsreader program. It''s probably the ISP name with ''news''
    tacked on in front, as in news.acme.com.


    **DNS server** If you are supposed to set up a specific DNS server to use, an
    address will be provided. They might provide two addresses: one primary and one
    secondary (to be used as a backup).


    For a non-dial-up connection, you will need all of the items listed above except
    the username, password, and phone number, and you might also receive a static
    IP address to use.


    Once you''ve assembled the information you need, go on to the next applicable
    section.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_349_0.png)'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# # Setting Up Internet Connections


    # ## Setting Up a Dial-Up Connection


    A dial-up connection necessarily involves Windows Dial-Up Networking (DUN). Most
    versions of Windows include some type of wizard that walks you through setting
    up a dial-up networking connection, so it''s not difficult.


    Broadband

    High-speed connection to a network resource (usually refers to the internet).


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_350_0.png)


    # NOTE


    The dial-up connection described in the following sections is for a regular ISP,
    not for America Online. AOL does use dial-up connection, but it has its own software
    and uses its own proprietary connection protocol. It sets itself up automatically
    when you install the AOL software. You can also set up AOL to use an existing
    Internet connection, which can be handy if you already have broadband service
    but continue to be a member of AOL. To do that, set the connection type in AOL
    to TCP/IP.


    # ## Windows 95/98/Me


    If using Windows 95, you must manually install Dial-Up Networking (from the Components
    tab of Add/Remove Programs; see Chapter 16, "Essential Windows Tools and Skills")
    and TCP/IP (from the Network Properties box; see Chapter 13, "Introduction to
    Networking\). In Windows 98 and Windows Me, both are installed by default.


    If Dial-Up Networking has been installed, an icon for it appears in My Computer.
    One way of setting up a dial-up Internet connection is to create a new DUN connection
    in the Dial-Up Networking window. To do so, double-click Dial-Up Networking from
    My Computer. If there are existing dial-up networking connections, the Dial-Up
    Networking window appears; double-click Make New Connection to start the New Connection
    Wizard. Then just follow the prompts to create the new connection.


    Another way (Windows 98 and Windows Me only) is to try to open Internet Explorer
    or Outlook Express. If no Internet connection has been set up, the Internet Connection
    Wizard will run and walk you through the process of creating the DUN connection
    and creating your e-mail account at the same time.


    If you choose not to set up an e-mail account during the Internet Connection Wizard,
    you can do it later from the e-mail program. Windows 95 comes with a program called
    Mail Net. The first time you start it (from the Start menu), it walks you through
    a setup wizard where you enter your mail server, e-mail ID and password. In Windows
    98, the program is called Outlook Express, and it too configures itself the first
    time you run it, prompting you for


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_350_1.png)


    331'
