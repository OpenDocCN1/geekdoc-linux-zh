  md: '# What Happens When a PC Starts Up?


    MS-DOS kernel

    The portion of MS-DOS that gets loaded into memory at startup remains resident
    there while the PC is running.


    If you decide to take the A+ OS Technologies exam, you''ll need to memorize the
    names of the files involved in the boot process for Windows 9x and Windows 2000,
    and the order in which they load. For now, though, review the following sections
    as FYI stuff, and don''t stress out trying to memorize it all.


    # The MS-DOS Boot Process


    CONFIG.SYSnA file that lists the drivers that should automatically load each time
    the PC starts.


    It''s good to know something about MS-DOS because you''ll find many remnants of
    it in Windows 9x (that is, Windows 9, 98, and Me). To really understand Windows
    9x, you need to know what items are there for backward-compatibility and which
    are necessary for Windows 9x operation.


    AUTOEXEC.BAT

    A file that lists the programs that automatically run at startup.


    A disk requires three files in order to boot MS-DOS:


    +   - IO.SYS: The controller for hardware interaction

    - MSDOS.SYS: The controller for software interaction including the MS-DOS kernel
    itself

    - COMMAND.COM: The command interpreter that interacts with the user


    They load in that order. The functions of IO.SYS and MSDOS.SYS are actually a
    bit more complicated than that, but let''s keep it simple for now.


    An MS-DOS bootable disk can have startup configuration files: CONFIG.SYS and AUTOEXEC.BAT.
    Both are optional; MS-DOS can boot just without them. Both are plain text files
    that you can edit in a text editor as EDIT (MS''s text editor program).


    CONFIG.SYS contains instructions to load device drivers for various pieces of
    hardware and to set environment settings. You learned aboutEM.SYS and EMM386.EXE
    in Chapter 14, "Operating System Basics." Both of these files are loaded through
    CONFIG.SYS. A driver for a CD-ROM drive would also be in CONFIG.SYS. CONFIG.SYS
    can run only at startup.


    AUTOEXEC.BAT contains instructions to run any programs that you want to automate
    at startup. It runs automatically at startup, but can be run any time by typing
    AUTOEXEC and pressing Enter. The BAT extension stands for "batch file", a batch
    file is a list of commands that should be run as a group, or batch; Examples of
    commands in AUTOEXEC include MSD.EXE (the utility for controlling the CD-ROM driver),
    PROMPT (which specifies the command prompt itself), and MOUSE.COM (which loads
    a mouse driver).


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_287_0.png)


    268'
