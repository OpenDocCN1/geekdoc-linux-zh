  md: '# Safety and Preventive Maintenance


    # # Preventing Power Fluctuations


    A PC''s power supply requires a constant source of 110-volt AC power. It''s able
    to tolerate minor fluctuations, so a little more or a less won''t hurt anything.
    But there are limits to this tolerance, and anything outside those limits can
    cause problems.


    # ## Surge Suppressor


    To protect your PC against power surges and spikes, invest in a surge suppressor.
    This is a power strip that takes the hit when surge or spike occurs, channeling
    any excess power so it doesn''t reach the electrical devices plugged into it.
    The effectiveness of a surge suppressor is measured in joules.


    # ## Power Conditioner


    A power sag can cause the PC to restart itself, such that you lose all your unsaved
    data; it can also cause whatever is in memory at the moment to become corrupted.
    The problem resolves itself when the PC restarts.


    A surge suppressor does nothing to prevent surges. To do that, you need a power
    conditioner. Such a device stores power in a battery, and it supplements the AC
    wall current whenever it is insufficient. You don''t usually find power conditioners
    for sale in computer stores; this function is normally combined with that of an
    uninterruptible power supply (UPS).


    # ## UPS


    UPS protects against power failures that cause the PC to be unexpectedly shut
    down, and it can also act as a power conditioner and surge suppressor. You plug
    your devices into it, and the battery replaces replaces the AC current whenever
    it is insufficient. A UPS is larger than a regular surge suppressor because of
    its large battery, and it is also very heavy of the battery.


    There are two kinds of UPSes: online and standby. An online UPS charges the battery
    from the wall and then uses the power all time to power the attached devices.
    This is the better and more expensive kind. A standby UPS charges the battery
    but lets the AC current flow directly through the devices as long as wall current
    is available. When it''s not available, the unit quickly switches the devices
    over to the battery. This is the more common type sold in stores, and it is much
    cheaper.


    # Power surge


    A power surge occurs when the power supply gets too much power. It can cause the
    PC to reset, the power supply to burn out, or circuits to go bad. A power spike
    is like a sudden surge. Power spikes are more likely to permanently damage hardware.


    # Joule


    A unit of electrical energy. Surge suppressors are rated in joules, such as 800
    or 1,500 joules.


    # Power sag


    Occurs when the power supply doesn''t get enough power. You may have experienced
    this in your home when the lights dim and buzz for a moment but don''t go out
    completely.


