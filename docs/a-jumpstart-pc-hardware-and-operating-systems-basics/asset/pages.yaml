  md: '# Troubleshooting Display Problems


    Here are some common display problems and some ideas for solving them.


    # No Display at All


    If the monitor is completely dark, check the following:


    +   * Does the power light on the monitor come on? If not, the monitor is not
    plugged in, not turned on, or is broken.


    +   * Are the monitor''s brightness and contrast settings turned up? Is the monitor
    snugly plugged into the video card, and is the video card snug in the motherboard?


    +   * Does swapping the video card solve the problem? If so, the problem is the
    video card. Chapter 10 covers installing and removing expansion cards, including
    video cards.


    +   * Does swapping out the monitor solve the problem? If so, perhaps the monitor
    is physically bad.


    +   * Does text appear on the screen at startup and disappear when Windows tries
    to load? If so, it''s a Windows problem, not a hardware problem.


    +   * Does running Windows in Safe Mode solve the problem? If so, probably a video
    driver issue. Safe Mode is covered in Chapter 15, "Starting Up a PC."


    # Garbled Display in Windows


    This is almost always caused by a bad or incompatible video driver. Run Safe Mode
    (see Chapter 15), and while in Safe Mode, reinstall the video driver (see Chapter
    10).


    # Bad Colors or Pixels


    If the display has an overall tint to it (red, green, or blue), the monitor is
    probably at fault. First, make sure the monitor''s cable is firmly seated. A loose
    monitor cable can cause one of the three colors to cut out. Then try adjusting
    the controls on the monitor itself. Check for bent pins on the monitor connector
    too.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_131_0.png)'
