  md: '# # Chapter 2


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_45_0.png)


    # ## Ribbon cable


    CPU The Central Processing Unit, or CPU, is the engine that drives the entire
    operation. It performs all the math calculations, processing millions of calculations
    per second.


    A cable consisting of several wires laid out in a flat, side-by-side arrangement
    in parallel, it gets its name from the fact that the flat, wide cable looks something
    like a piece of ribbon.


    Battery The battery provides a small amount of constant power to the motherboard,
    items that always need to be on (such as the system''s date/time) that stay even
    when the PC is unplugged.


    Expansion slots These are slots into which expansion circuit boards fit. Three
    types are shown here. The single gray one in the center is an AGP slot for a video
    card. (Actually, it''s brown on most motherboards.) The white ones are PCI slots,
    and the black ones are ISA slots. Not all motherboards have all these slot types.
    You''ll learn about the slot types in Chapter 3.


    # ## CPU


    Also called the processor, this large powerful silicon chip takes in data, performs
    calculations on and spits it out into memory. The CPU is sometimes called the
    "brain" of the PC but "calculator" is actually more accurate because it does not
    think or reason for itself.


    Memory (RAM) RAM stands for Random Access Memory; this is the main memory on the
    PC. Most RAM comes today on mini circuit boards. You''ll learn about memory in
    Chapter 5, "Understanding Memory."


    Drive connectors Ribbon cables run from the drives to the motherboard, and they
    connect into these sets of pins.


    # ## Central Processing Unit (CPU)


    The Central Processing Unit (CPU) does the math calculations for the entire PC.
    Modern CPUs can process many millions of instructions per second; in Chapter 3,
    you''ll learn about the types of CPUs and their specifications.


    # ## PGA


    Pin Grid Array. A type of CPU with a grid of pins on its underside that fit into
    a motherboard socket.


    CPUs have two main shapes: pin grid array (PGA) chips and Single Edge Contact
    (SEC). The latter are sometimes called Single Edge Connector, but both refer to
    the same thing. The type you need depends on the type of motherboard.


    > NOTE There is no direct relationship between the motherboard form factor (AT)
    and the type of CPU it uses.


    A PGA chip is flat on the top; on the bottom it has many tiny pins. Each pin fits
    into a hole in a socket in the motherboard. Here''s a PGA model, both front and
    back sides.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_45_1.png)


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_45_2.png)'
