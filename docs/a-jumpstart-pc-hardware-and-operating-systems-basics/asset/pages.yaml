  md: '# Chapter 7


    Two kinds of formatting must be done to a disk before you can use it for data
    storage: physical (low-level) and logical (high-level).


    When you format a floppy disk, either in Windows or DOS, the Format command performs
    both physical and logical formatting at the same time. However, with a hard disk,
    the Format command does only the logical format. The physical, low-level format
    must be done at the factory or performed by a special utility from the drive manufacturer.


    A low-level format creates the sectors and the gaps between them (which are something
    like the blank spaces between songs on an audio recording). It also writes all
    the usable data areas with a placeholder value. You will probably never need to
    perform a low-level format on a hard disk because they come formatted these days,
    but should need ever arise (to repair a disk that has become unreadable, for example,
    or for security purposes), you should acquire a utility from the drive manufacturer
    to handle it, rather than relying on a generic utility. That''s because different
    drive makers handle low-level formatting differently.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_149_0.png)


    After partitioning a drive, you can use the Format command (or the Format utility
    in Windows) to perform a high-level format on the disk. This operation runs some
    housekeeping features to the disk, such as the boot sector, two copies of a File
    Allocation Table (FAT), and a root directory. These features allow the operating
    system to interact with the disk, store files on it, and avoid any defective spots.
    The following sections explain each of those items in more detail.


    High-level formatting sets up the tools needed to interact with the operating
    system.


    | FAT | Boot sector | Root directory | Data area |


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_149_1.png)'
