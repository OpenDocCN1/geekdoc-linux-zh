  md: '# Glossary


    MIDI Musical Digital Interface. An interface and method for creating sound and
    music entirely digitally, with no analog origin.


    MMX Stands for Multimedia Extensions. Built-in functions that applications designed
    for MMX take advantage of to streamline the processing of graphics-intensive commands.


    Modem A device that converts digital to analog sound and vice-versa data is transferred
    between computers via telephone line.


    Monitor A display panel that shows the features of the PC''s activities or processing.


    Monochrome Consisting of only one color. A monochrome monitor shows a single color
    on black or white background (usually).


    MS-DOS kernel The portion of MS-DOS that is loaded into memory at startup and
    remains there while the PC is running.


    Multimeter A meter that is capable of taking several electrical measurements,
    including voltage, amperage, and range.


    Multitask To execute more than one program at once.


    Network Two or more computers connected together to share resources.


    Network Operating System (NOS) An operating system designed to help a server PC
    provide access to files, printers, and other network resources to client PCs.


    Network topology The physical layout of a network.


    Noncontiguous Not physically located together.


    NTFS NT File System. The file storage system native to Windows NT, offering efficiency
    and features over FAT16.


    Ohms The unit of measurement for resistance.


    OLE Object Linking and Embedding. A standard for sharing information between applications
    that allows data to maintain a link with its data file and/or application of origin.


    Operating system (OS) The system program that runs on the PC all the time and
    makes it possible for other programs to execute and for the user to issue commands.


    Optical mouse A mouse that uses light sensors instead of a ball to record movement.


    Overclocking A CPU at a higher clock speed than what it is rated for.


    Packet A piece of data packaged for network transit, including the data plus addressing
    information. Also called a frame.


    Packet writing A feature that enables a CDRW disc to be treated as a regular disk,
    and to be written and rewritten multiple times.


    Page frame The 64KB area in upper memory used to swap data into and out of expanded
    memory.


    Page printer A printer that waits until it has a whole page of data in memory
    and prints the entire page at once.


    Paging file The file on the hard disk that stores the data in virtual memory.
    Also called a swap file.


    Parity An error checking mechanism in RAM that uses an extra bit to ensure data
    accuracy.


    Partition A formative section of a physical hard disk.


    Passive memory An inexpensive type of LCD display that uses one transistor for
    each row and each column.'
