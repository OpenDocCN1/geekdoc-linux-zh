  md: '# Windows Versions


    It would be easy to say “Every PC should have the latest version of Windows” and
    leave it at that. But as I mentioned earlier, one of the problems with a GUI is
    high overhead, and the latest version of Windows will not run on every PC. Therefore,
    you need a passing familiarity with many versions of Windows as well as the latest
    thing.


    The following overviews of the various Windows versions are also helpful in understanding
    how the current version of Windows works, because many of the features that still
    exist today had their origins in these earlier versions. Rather than trying to
    absorb the whole picture at once, it''s easier to learn one version and then build
    on that knowledge version-by-version until you get the complete story.


    # Windows 3.1


    3.1 was a different ‘Windows’ than the one we know today. To start with, it was
    not really an operating system, because it required MS-DOS (the “real” operating
    system) to running behind it. It was more like an add-on to MS-DOS that enabled
    people to run Windows-based GUI programs.


    Windows 3.1 was a 16-bit system, and it could run either 8-bit or 16-bit programs.
    At the time Windows 3.1 was popular, people ran a mix of MS-DOS and Windows programs
    on their PCs, so it was important to be able to leave Windows and get back to
    the bare DOS prompt to run some of the programs. Windows 3.1 allowed this. Some
    other features of Windows 3.1 included:


    +   Virtual machines Windows 3.1 could run in Standard mode (on 80286, which was
    like the old 286 Protected mode) or Enhanced mode (on 80386 and higher, which
    was a 386-optimized Protected mode). In Enhanced mode, it could run more than
    one program at once by creating virtual machines. A virtual machine is a simulated
    8086 CPU operating in its own separate address space. An 8086 CPU can execute
    only one task at once, but multiple virtual machines running at once results in
    multiple programs being able to run at once.


    +   Cooperative multitasking Only one of those virtual machines can use the real
    CPU at once, but Windows 3.1 could detect when one of them was taking a break
    and sneak some processing in one of the others. This gave the illusion that multiple
    programs were running at once. This is cooperative multitasking. Each application
    is in charge of signaling to Windows that it is taking a break and releasing its
    grip on the CPU. This caused problems because not all applications were well-written
    enough to do this consistently without generating errors.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_275_0.png)'
