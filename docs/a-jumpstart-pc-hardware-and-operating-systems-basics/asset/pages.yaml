  md: '# Chapter 7


    The minimum amount of physical space between flux transitions is determined by
    the drive''s rotational speed and performance abilities, and the pattern created
    by these cells is known as the encoding method.


    # Encoding method


    The pattern that determines the distance between each bit of data on a disk.


    Read/write head detects change, and sends electrical pulse which is interpreted
    as a "1".


    # Drive timing


    The amount of time that passes between reading one bit and reading the next bit
    on a drive.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_141_0.png)


    Encoding method specifies that a change is possible at this point, but none is
    detected. Read/write head sends nothing.


    The most popular encoding method for hard disks today is Run Length Limited (RLL),
    of which there are several variations. On a floppy disk, the drive platter is
    separate from the drive controller. Floppy disks typically use a different method
    of encoding, called Modified Frequency Modulation (MFM).


    For example, let''s say that the closest together that two flux transitions can
    possibly be is one "click" (which is really an electrical pulse rather than a
    sound). The timing between clicks, and the amount of physical real estate on the
    disk that the read/write head moves per click, will depend on the drive and is
    known as the drive timing. When reading the drive controller hears clicks "click-nothing-click",
    it knows that there is a bit, two bits just like it, and then a change to the
    opposite kind of bit.


    As you can imagine, drive timing is critical. Without knowing how much time there
    should be between clicks, the drive cant tell how many same-value bits in a row
    are present. For example, suppose there are 10 bits in a row with the same value.
    There is no flux transition between them because they''re all the same. So the
    drive timing must measure the amount of time during a transition is not encountered,
    and then divide that by the amount of time between clicks to arrive at the number
    of bits represented by that length of "silence."'
