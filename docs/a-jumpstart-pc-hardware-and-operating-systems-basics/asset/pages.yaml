  md: '# Chapter 6


    # Monitors


    Monitors come in two types: CRT and LCD. A CRT is a ''normal'' monitor (the box
    type), and an LCD is the flat panel type of monitor found on notebook PCs. The
    following sections explain how each of them works.


    # CRT


    Cathode Ray Tube. A type of monitor that uses a large vacuum tube and electrons
    to light up phosphors on a glass screen.


    # LCD


    Liquid Crystal Display. A type of monitor that sends an electrical charge through
    liquid crystals to bend its reflectivity, changing the light passing through them.


    # CRTs Work


    The most common type of monitor today is the cathode-ray tube, or CRT. It''s essentially
    a large vacuum tube. At the back of the CRT is a long, narrow neck containing
    a cathode, and at the front is a broad rectangular surface with phosphors on it.


    When the cathode is heated, it emits negatively charged electrons. These electrons
    are attracted to the positively charged front of the CRT, where they strike the
    phosphors and cause them to light. One or more electrons inside the monitor direct
    the electrons precisely; so they don''t fly around aimlessly. A monochrome monitor
    has only one color; a color CRT has three: one for red, blue, and green.


    # Monochrome


    Consisting of only one color. A monochrome monitor shows a single color on a black
    or white background (usually black).


    The guns don''t colored electrons, of course, so how are the colors formed on
    the screen? That''s a function of the phosphors on the screen. For each pixel
    on the screen (that is, each identifiable ''dot''), there are three phosphors—one
    red, one blue, and one green-arranged in a triangle, or triad. Each electron gun
    works only on one of a certain color. For example, if a certain pixel is supposed
    to be purple, the red and blue guns will fire at that but the green won''t, and
    your eye will see purple.


    # Dot pitch


    The measurement of the distance between one colored dot in a triad and the same
    color in an adjacent triad.


    The distance between one color in a triad and the same color in the adjacent triad
    is the dot pitch of the monitor, one measure of CRT quality. A lower number means
    the dots are closer together, which makes for a better-quality picture. LCD monitors
    (covered in the next section) are also evaluated in terms of dot pitch.


    # Shadow mask


    A grid of perforated metal with holes to ensure that the correct phosphors are
    illuminated on a CRT.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_125_0.png)


    As you can imagine, the potential for misalignment is great when you are dealing
    with such small phosphors. Several technologies are available for keeping the
    electron beams properly aligned. The most common is a shadow mask, a thin sheet
    of perforated metal that sits between the guns and the phosphors.


    106'
