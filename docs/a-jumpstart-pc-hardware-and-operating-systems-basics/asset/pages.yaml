- img_proc: true
  md: '# Focus on Hard Drives


    This end to motherboard


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_166_0.png)


    Push the connector firmly down onto the pins on the motherboard.


    Red stripe


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_166_1.png)


    Pin 1 indicator


    Now do the same to the drive. You can use either of the remaining connectors on
    the ribbon cable to hook into the drive. Make sure the red stripe aligns with
    Pin 1. Pin 1 on the drive is almost always the end that''s closest to the power
    supply connector.


    # Step 4: Connect It to the Power Supply


    Find a free connector from the power supply and plug it into the drive. The top
    edge of the connector is rounded so it can only fit one way.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_166_2.png)


