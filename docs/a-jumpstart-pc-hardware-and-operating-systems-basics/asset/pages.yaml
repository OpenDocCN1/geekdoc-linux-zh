    the operating system (Windows, for example) translate commands into the languages
    needed to give instructions to the devices.


    The operating system uses a video driver to communicate with the video card, and
    then the video card communicates with the monitor. That''s how the operating system
    controls what should appear on the screen. That''s because it means you can radically
