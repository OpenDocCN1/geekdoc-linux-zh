  md: '# Types of Drives


    You''re probably already aware of the major types of disk drives a PC can have:


    **Hard disk** A non-removable electromagnetic drive, encased in a metal box. The
    disk and the drive are a single unit together and cannot be separated. Used for
    long-term storage in the PC.


    **Floppy** Removable electromagnetic disk with a separate drive unit installed
    in the PC. Holds up to 1.44MB. Used for short-term storage and data transfer between
    PCs. Becoming obsolete because of other drive types that are faster and hold more
    data.


    **LS-120** Just like a floppy drive except it can also accept special LS-120 (Super-Drive*)
    disks that hold up to 120MB.


    **ZIP** A hybrid between a floppy disk and a hard disk. Reads and writes to 100MB
    or 250MB floppy disks encased in a proprietary type of cartridge.


    **CD-ROM** Removable optical disc with a separate drive unit installed in the
    PC. Used for distributing software rather than floppy disks because it can hold
    much more data (up to 700MB) than a floppy. Read-only; cannot be written or changed.


    **CD-Recordable (CD-R)** Removable optical storage that''s just like a CD-ROM
    except it can also write to special CD-R discs. Discs can be written to only once;
    then they become read-only.


    **CD-Rewriteable (CD-RW)** Just like CD-Recordable except it also accepts another
    kind of writeable CD disc (CD-RW) that can be written to and modified multiple
    times.


    **DVD** Just like CD-ROM except it also reads Digital Versatile Discs (DVDs),
    which hold much much more data than ordinary CDs.


    These drive types can be broken down into two different ways: electromagnetic
    versus optical and removable non-removable. I''ll explain the concepts of electromagnetic
    and optical later in this chapter.


    The difference between removable and non-removable is fairly obvious: removable
    drives are separate from their disks, while non-removable ones are not. Chapter
    8 talks about hard drives, which are the most common non-removable drive type.
    Chapter 9 covers removable drives, of which floppy and CD-ROM are the most common.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_137_0.png)'
