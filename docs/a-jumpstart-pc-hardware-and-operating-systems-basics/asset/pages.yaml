- img_proc: true
  md: '# Installing Hard Drives


    Installing a hard disk is not difficult, but there are several steps involved,
    and it''s easy to forget a step and then have to spend time backtracking. For
    example, if you forget to set the jumpers before you mount the drive in the bay,
    you must completely remove it in order to set them (unless you really have tiny
    hands that can grab that jumper from an awkward angle).


    Here''s the big picture of how to install a hard drive; I''ll describe each of
    these steps in more detail in the following sections.


    +   1. Set the jumpers.

    2. Put the drive in a bay.

    3. Connect it to the motherboard via ribbon cable.

    4. Connect it to the power supply.

    5. Set up the BIOS.


    That''s just the physical part; after you install a drive, you must partition
    and format it, which I''ll describe later in the chapter.


    # Step 1: Set the Jumpers


    First, determine what type of drive it is and what other devices will share an
    interface with it.


    If it''s an IDE drive, and you''re going to put it on the same ribbon cable as
    an existing IDE drive, check the existing drive''s settings first. It will either
    be set to Single or Master, depending on whether the drive has a single setting.
    Set it to Master if needed. Then set the jumper on the new drive to Slave.


    If it''s a SCSI drive, check the SCSI ID settings for the existing SCSI devices,
    if any, and set the new drive''s jumpers to an ID number that isn''t taken. If
    this is to be the only SCSI device, terminate it. If not, you can either keep
    the existing terminated device and slip the new drive into the middle of the chain,
    or you can remove termination from the currently terminated device and then terminate
    the new drive.


    # Step 2: Put the Drive in a Bay


    Hard drives are internal, so you don''t need one of the externally accessible
    drive bays for it. Look for a bracket inside where the existing hard drive is
    mounted; there is probably room for another hard drive above or below it. Secure
    the new drive in the bracket with screws.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# NOTE


    Some cases don''t use screws to hold drives in place; instead they use mounting
    rails that fasten to the sides of the drive and then snap the drive into place.


    # Step 3: Connect It to the Motherboard


    There are two types of IDE ribbon cables: the 40-wire kind and the 80-wire kind.
    The 80-wire kind looks like it has more and thinner wires, but its overall dimensions
    are the same. If the drive came in with an 80-wire cable, you should use it rather
    than an existing 40-wire cable in the PC. Otherwise you can use the IDE cable
    that is already there for the original hard drive.


    40 wires


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_165_0.png)


    80 wires


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_165_1.png)


    Same size connector


    # TIP


    If the second IDE connector on the motherboard is unused, you might want to attach
    the new drive to it rather than hooking it into an existing IDE ribbon-bon cable.
    That''s because you might get slightly better performance if the two drives don''t
    have to share.


    If you need to install a new cable on the motherboard, here''s how to do it. Notice
    the cable that there are three connectors: one at each end and one slightly offset
    in the middle. Find the end that is farthest away from the middle connector; that''s
    the end that connects to the motherboard.


    Find the red stripe on the side of the cable; the side with stripe needs to align
    with Pin 1 on the connector. Pin 1 is identified with a small “1” stamped on the
    motherboard or with an arrow pointing to it (as shown here).


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_165_2.png)'
  merge: -1
