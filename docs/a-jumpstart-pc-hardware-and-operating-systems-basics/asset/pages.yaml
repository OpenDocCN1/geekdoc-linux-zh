  md: '# Chapter 12


    # Common Printer Problems


    Here are some ideas for troubleshooting problems with printers.


    Paper Jams


    With laser printers, because they run at faster speeds than other printers, most

    errors occur due to paper jams. Other printer types can also have have jams too.


    A lot of paper jam problems can be avoided simply by using the right type of

    paper. Any paper that is extra-heavy (more than 24 pounds) or extra-light (less

    than 16 pounds), or is torn, curled, or wrinkled is likely to cause a jam—so

    paper that is heavily textured or embossed. Paper jams can also be the result

    of paper and toner particles inside the printer, so clean the printer thoroughly

    as a first step. See the printer''s manual for instructions.


    Sometimes the humidity is high, the printer can stick together in the paper

    tray, feeding multiple sheets at once and causing jams that way. To avoid this,

    take the paper out and fan it.


    If you are still having jam-ups, check to see whether the printer has some sort
    of

    control that specifies the thickness of the paper it is using. If this adjustment
    does

    not match the actual paper in use, jams can result.


    If none of these solves the problem, and the printer is old, perhaps the printer

    feed rollers are getting worn and too smooth. Roughhening them up slightly

    with a kitchen-scrubber or fine-grain sandpaper. This helps the paper

    advance through the feed mechanism.


    # Laser Quality Problems


    Here are some common problems with laser output:


    Printout faint in some spots This can happen when the toner in the cartridge

    st running low. Take out the toner cartridge and shake it from side to side

    several times (never up-and-down, or it could spill). Then put it back in and

    should be good for another 100 pages or so.


    Faint printing can also be the result of the drum reaching the end of its useful
    life.

    On printers where the drum and toner are separate, the drum has a longer life
    but

    must eventually be changed. Such printers usually have a print density control

    that adjusts the amount of toner used for each page. When the drum is new,

    this setting should be on Low, but as the drum ages, you may need to turn it

    u gradually to compensate for the drum''s growing ineffectiveness.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_243_0.png)'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Printing Basics


    Faint printing can also indicate a dirty transfer corona. Remember, the transfer
    corona charges the paper so that the toner on the drum will be attracted to it.
    If the transfer corona is dirty, the paper does not receive the full charge and
    the toner isn''t attracted.


    Loose or smeared toner A tiny bit of loose toner now and might simply mean the
    printer is dirty inside and needs to be cleaned. However, if the toner is consistently
    loose and the image suffers, the fuser is probably not heating enough to melt
    the plastic resin in the toner.


    Vertical white streaks This can indicate dirty corona wires. Clean them if possible.


    Gray mist If the whole page looks like it has been airbrush-painted with a fine
    mist of toner, the corona wires probably need to be cleaned. It could also be
    the result of the print density control being turned too high or of the drum not
    holding a strong charge.


    Horizontal black lines This is usually a dirty or damaged roller problem. You
    can measure the distance between the black lines to determine which roller is
    the problem, but the rollers on different models are different sizes so you must
    consult the printer manufacturer for help.


    Regularly spaced splots Probably a scratched or dirty drum.


    All-white page Broken transfer corona, or the printer is out of toner.


    All-black page Broken primary corona. If the drum is not charged enough, the toner
    will jump off indiscriminately onto the drum, resulting in a full page of toner.


    # Inkjet Quality Problems


    Quality problems with inkjets are usually the result of empty or dried-up ink
    cartridges or clogged print heads. This could manifest itself as one color entirely
    missing, or all discolorations, or as colored stripes on the printout.


    If your printer has a self-test, run it, and see which color(s) are missing, either
    entirely or in spots. Then check the ink to make sure you have plenty of ink of
    that color in the printer.


    If lack of ink is not the problem, try running the head-cleaning utility, and
    then run the self-test again. If you see a little improvement after the cleaning,
    clean again. Keep cleaning until you are not seeing any more improvement or until
    print quality is acceptable.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_244_0.png)'
  merge: -1
