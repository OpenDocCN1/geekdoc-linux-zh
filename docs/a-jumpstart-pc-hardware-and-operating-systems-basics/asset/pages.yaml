  md: '# Chapter 9


    # Considerations for Specific Drive Types


    Is that all there is to setting up a removable drive? Usually, yes. But there
    are a few special cases where some info or configuration would be helpful. Let''s
    look at them now.


    LS-120

    An IDE-based floppy drive that accepts both normal floppy drives and 120MB super
    disks.


    # LS-120 Drive


    An LS-120 drive, also called a “super drive,” is a floppy drive that runs on the
    IDE interface rather than the floppy interface. It reads and writes normal 1.44MB
    floppies, but it also reads and writes special 120MB “super disks.”


    You install and set one of these just like a hard disk. CD-ROM, or any other IDE
    device. The BIOS will probably detect it automatically. If it doesn''t, you might
    poke around in the BIOS setup to see whether there is a specific IDE removable
    you can use for IDE position.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_183_0.png)


    # CD-RW Drive


    A CD-R or CD-RW installs and sets up the system as a regular CD-ROM drive as far
    as the BIOS is concerned. It will operate just fine in any version of Windows
    right out of the box, but it won''t have any writing capabilities until you install
    a CD writing application. The necessary software probably comes with the drive,
    and you can also use higher-end applications separately as Adaptec''s Easy CD
    Creator Platinum.


    A CD-RW drive can write either to CD-R discs or to CD-RW ones. The CD-R blanks
    are write-once, and to write them you use a CD burning application. The CD-RW
    discs are treated like ordinary floppy or hard disks, complete with


    164'
