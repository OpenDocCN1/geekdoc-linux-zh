- img_proc: true
  md: '# A Few Other Essential Components


    In a physically failing power supply, the power supply is not generating its rated
    amount of power, or it is providing the wrong voltages on some wires. The PC generally
    will not start at all if such a condition exists. See the next section, "Testing
    a Power Supply," for help determining whether a power supply is working. Correcting
    a faulty power supply is the best solution; repairing power supplies can be dangerous
    for inexperienced technicians, and it is seldom-effective.


    On an overloaded power supply, there is not enough wattage to support all the
    devices plugged into it. On a system with an overloaded power supply, problems
    often occur at startup, when all the drives are spinning up, or when accessing
    a drive. See the preceding section to calculate how much wattage the system needs.
    Replace the power supply with a higher-wattage model if needed.


    Overheating happens when the power supply fan (or in some cases the cooling fan)
    is not doing its job adequately, or when the system''s airflow is obstructed.
    Most computers are designed to push fresh air through the case, across the main
    heat-producing components. The airflow through the restricted space is very important.
    Removing the case cover, or leaving empty-slot backplates off, prevents the air
    from flowing desired, and overheating can result. If the system starts up okay
    but starts having problems after several minutes of operation, inadequate cooling
    is almost always the problem. Make sure the airflow path is unobstructed, that
    the processor heat sink or cooling fan is in place and operational, and that the
    power supply fan is working quietly and correctly.


    # Power Good Wire


    Also called Power_OK, the wire from the power supply to the motherboard tests
    the power supply''s performance before the rest of the system starts up.


    # Testing a Power Supply


    When the PC starts up, the power supply sends a signal to the motherboard via
    the Power Good wire (one of the wires that leads from the power supply to the
    motherboard). The motherboard looks for a voltage of +3v and +6v on this wire.
    When it receives it, it knows the power supply is ''good'' and allows the system
    to start up. If it doesn''t receive it, or if it receives some other voltage,
    it suspects the power supply is bad and it continually resets itself, refusing
    to start up. This is a protection system built into every motherboard to prevent
    damage from a faulty power supply.


    Therefore, when you suspect that a power supply is faulty, the first thing to
    test is that Power Good pin. On an AT power supply, it''s the orange wire, the
    first pin on the P8 connector. On an ATX power supply, it''s the gray wire. If
    they test okay, you can test the rest of the wires too. See the following sections
    to learn more about it.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_222_0.png)'
