  md: '# Types of CPU Packaging


    Remember from Chapters 2 and 3 that there are two broad categories of CPU packaging:
    PGA and SEC. Within each of these, however, there are many variations.


    As mentioned earlier, a particular motherboard works with only a fixed set of
    CPUs. Part of that is the machine language; the other part is the physical size
    and shape of the CPU slot or socket. In this section, we''ll look at the physical
    sizes and shapes.


    # Pre-PGA CPUs


    Back in the earliest days of computing, the PGA socket had not yet been invented.
    CPUs instead came in a rectangular package called a Dual Inline Pin Package (DIPP).
    The chip looked sort of like a bug—it had a long rectangular body with ''legs''
    on both sides:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_82_0.png)


    These legs fit down into socket holes in the motherboard, but you had to apply
    quite a bit of pressure to make them go in, and bent/broken legs were a common
    occurrence. These chips were used for the original 8086 CPUs and also for the
    8028 CPUs.


    The next generation of CPU used a square chip, a precursor to the PGA chip you''ll
    see in the next section. This chip had little legs on all four sides that stuck'
