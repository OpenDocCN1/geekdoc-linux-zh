  md: '# Introduction to Disk Drives


    # Boot Sectors


    Each high-level formatted disk has a boot sector, which is a sector near the center
    of the disk reserved for boot files (that is, startup files). When that sector
    contains instructions for the startup routine for the operating system. When a
    disk is not bootable, the area is empty.


    When a PC starts up, it checks the disk drives in an order specified by the BIOS,
    looking in the boot sector for the files needed to help load the operating system.(You''ll
    learn more about starting up a PC in Chapter 15, "Starting Up a PC.") If it finds
    the needed information, it tries to boot from that disk. If it doesn''t, it moves
    to the next disk on its list.


    # File Allocation Tables (FATs)


    The File Allocation Table (FAT) is a table that tracks the content of each sector
    in the drive''s root directory. It''s stored on a reserved section of disk, and
    the operating system knows where to look for it.


    The FAT is important because it provides the operating system with a central point
    of reference when opening and saving files. It''s like a card catalog in a library.


    Because each sector holds only 512 bytes, all files occupy more than one sector.
    A file does not necessarily use a group of contiguous sectors. Remember, part
    of "random access" is that each area is just as easily accessible as any other
    area, so a file could store its data in pockets over the whole disk just as easily
    as all in one place. When the operating system calls for the file, the read/write
    head jumps around picking up the pieces of file and sends them to the operating
    system. It knows where to look for those pieces because of the data in the FAT.


    When you open a file stored on a disk, it''s like a game of telephone: the operating
    system consults the FAT, and tells the disk controller to retrieve information
    from a specific sector. The drive controller tells the actuator arm, which moves
    the head, reads the data and sends it back to the controller, which relays it
    to the operating system. It''s the same process when you write to a disk.


    Because the File Allocation Table is so important, two copies of it are stored
    on the disk; they are synchronized with one another. If the two copies don''t
    match, a utility like ScanDisk (or Check Disk in Windows XP) can identify and
    correct the error. The FAT does not keep track of the location of every file on
    the whole disk; it is in charge of the root directory, and any files and folders
    stored directly therein. Each directory (folder) is then in charge of keeping
    its own mini-FAT detailing its content.


    Boot sector

    A reserved sector on the disk for commands to load an operating system when the
    PC starts up.


    File Allocation

    Table (FAT)

    A table that tracks the content of each sector of the disk. The operating system
    consults the FAT whenever it needs to open or save a file.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_150_0.png)


    131'
