    conventional memory for running programs. This 64KB area is known as high memory
    or the HMA (High Memory Area).


    Back then, some applications required the memory to be available in the EMS standard,
    while other applications required the XMS standard. A utility called EMM386.EXE,
    also loaded in CONFIG.SYS, enabled the OS to take charge of the extended memory
    so it could emulate whatever type of memory was needed—either EMS or XMS.


    On PCs with an 80386 chip or higher, EMM386.EXE also has a side benefit. Remember
    that as a side benefit HIMEM.SYS loads parts of MS-DOS into high memory. EMM386.EXE
    (when used with the DOS=MEM command in CONFIG.SYS) takes any leftover portions
    of DOS that could not load into high memory and places them in upper memory, freeing
    up conventional memory.


    Windows 95 (higher) handles all memory management automatically, so you do not
    need to know any of what you just learned in 99 percent of real-life PC technician
    work today. So why did I go to the trouble of telling you? For two reasons. One
    is that a familiarity with all these terms will make the next sections of the
    chapter much easier to understand. Another is that memory management is still
    part of the A+ exam, and you need to know this stuff to pass.


