  md: '# # Removing the Cover


    There are many PC case designs, and each case''s cover comes off a little differently.
    Major PC manufacturers have been using unusual case designs—especially in the
    last several years—so you may sometimes need to resort to reading the PC''s manual
    to determine how to remove the cover.


    On standard PC cases, however, you can usually figure things out by looking for
    and removing screws that are around the edges of the PC and appear to be holding
    the case. For example, there are several screws in the following illustration,
    but only one of them passes through both the back of the PC and the cover.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_42_0.png)


    > > NOTE

    Make sure you put the screws somewhere safe, so you''ll have them when it''s time
    to reassemble.


    After removing any screws holding the cover, slide or lift it off. On some models,
    you might need to slide it a few inches and then lift.


    Some of the nicer and more modern cases don''t use screws, or they use thumbscrews
    that don''t require a screwdriver. Some of the new Dell PCs, for example, have
    buttons to push the top and bottom of the case; when you push both buttons simultaneously,
    the case pops open. On other cases, the cover does not come completely off; instead,
    you remove a side panel for access.'
  merge: -1
