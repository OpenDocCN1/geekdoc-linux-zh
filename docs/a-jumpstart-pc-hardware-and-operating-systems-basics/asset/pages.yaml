    \ phos-\nphors light up, creating\nthe display picture.\n\n# Electricity Precautions\n\
    \nMost of us take electrical precautions in daily life as a matter of course.\
    \ Things\nsuch as not operating monitors near water and not sticking your finger\
    \ in\na wall outlet are no doubt everyday life skills for you, since you have\
