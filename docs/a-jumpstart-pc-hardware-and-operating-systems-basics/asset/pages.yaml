  md: '# Installing a Sound Card


    Installing the actual sound card in an expansion slot is the same old thing that
    you learned at the beginning of the chapter. Prepare a slot, insert the card,
    and away you go.


    After installing the card, however, you have some cables to run that connect to
    it, and this can get tricky.


    First, hook up the speakers. The sound card has only one speaker jack (usually),
    so only one of the speakers can connect to it. The other speaker connects to the
    first speaker, rather than directly to the sound card. Some speakers run on batteries,
    but most of them run on AC power, so a power cord must plug into one or both of
    them. The port on the sound card for the speaker may be labeled as such, or it
    may be labeled SPK or Output (Some cards have a Separate beside the speaker output;
    most don''t). On a sound card with color-coded ports, the speaker is the black
    one.


    Next, if you have a microphone, hook it up to the MIC port on the sound card.
    It may be labeled as MIC or may have some cryptic little picture next to it that
    is supposed to represent a microphone. If there is color-coding, the microphone
    port is the red one.


    The sound card will probably also have a Line Out port. This would be for an external
    recording device or an alternative set of speakers. This port is green on a color-coded
    card.


    Depending on the model, there may be a fourth round port, Line In. This is for
    an external input source. For example, if you want to make a CD of your favorite
    LP, you could hook up your stereo receiver to the sound card through the Line
    In. If there is color coding, the port is blue.


    Finally, there will be a 15-pin female plug (two rows of pins, rather than three
    on a video connector) for a MIDI instrument or joystick.


    # Common Sound Card Problems


    Here are some problems people experience with sound cards and some ideas for fixing
    them.


    # Windows Doesn''t See Sound Card


    Look for the sound card in Device Manager (see Chapter 17). If it''s not there
    at all, the card may be physically defective or not installed correctly (for example,
    not completely seated in the expansion slot). If it''s there there''s an exclamation


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_203_0.png)'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# A Look at Some Expansion Boards


    point next to it, or it''s in the Other Devices category (there''s an unknown
    device in the Other Devices category). Windows has detected that it''s a new device
    but it doesn''t have the needed information about it. Run the setup program that
    came with the sound card to install the drivers for it, or install a driver manually
    as explained in Chapter 17.


    # No Speaker Icon in Notification Area of Windows


    The lack of a speaker icon in the notification area (a.k.a. the System Tray) in
    Windows, down by the clock, can indicate that Windows doesn''t see the sound card
    (see above). But it can also mean that someone has turned off the display of that
    icon.


    To turn the speaker icon display back again:


    +   1. From the Control Panel, double-click Multimedia (or Sounds and Multimedia
    in Windows 2000).

    2. Select the Show volume control on the Taskbar check box.

    3. Click OK.


    # No Sound At All


    Check the easy fix first: check that the speakers are plugged into the correct
    port on the sound card, are turned on, are turned up, and are receiving power
    from whatever source they use (AC or battery).


    Still no sound? Check in Device Manager to make sure Windows sees the sound card.
    (See Chapter 17) Also make sure the sound card has not been muted in Windows.
    To check this, double-click the speaker icon in the notification area to open
    the Volume properties box. Clear any Mute check boxes that are marked, and drag
    the volume slider to increase the volume.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_204_0.png)'
  merge: -1
