  md: '# How Disks Store Data


    Now that you know the physical part of how drives store those all-Important 1s
    and 0s, let''s look at their internal operations—the way the data is organized.


    # Tracks, Sectors, and Cylinders


    +   Formatting

    Laying down guide tracks for the read/write heads on a disk in a drive.


    +   Tracks

    Concentric bands on a disk platter, like the rings on a tree.


    A freshly manufactured disk consists of one or more blank platters covered with
    random electromagnetic particles or a solid sheet of unpitted land. In order to
    store data efficiently, there has to be some sort of filing system in which each
    area has a unique name that can be referred to and accessed. That''s where the
    concepts of tracks and sectors come in.


    +   Sector

    A section of a track created by straight lines cutting across the diameter of
    the disk platter.


    To prepare a disk for use, you must format it. The drive''s read/write head does
    this, as instructed by the operating system. Hard disks, floppy disks, and CD-RW
    discs must be formatted, but not CD-R discs. Because a CD-R disc can be written
    to only once, so if you formatted it, you couldn''t write any data to it later.


    When a disk is formatted, tracks are created on each side of each disk platter.
    These are small concentric bands, like the rings on a cross-section of a tree.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_145_0.png)


    Because a track is too large an area to be effective for storage, each track is
    further carved into sectors. (This name comes from the straight lines that bisect
    the circle, forming the individual sectors.)


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_145_1.png)'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# # Introduction to Disk Drives


    On most hard disks, the number of sectors is not the same for each track. Tracks
    near the edge of the disk have more physical area, so they are divided into more
    sectors. Tracks near the center have less area, so they are divided into fewer
    sectors. This is called zoning recording, because different zones on the drive
    have different numbers of sectors per track. There are usually about 10 zones
    per drive.


    Each sector has a unique identifier that the operating system keeps track of,
    so when you write data in a particular sector it can be retrieved on your command.
    Different drive types divide the surface into different numbers of sectors. Floppy
    disks use between 8 and 36 sectors per track, while hard disks have many hundreds.
    (The average is 700 for a typical hard disk today.)


    Most hard disks have two or more platters. Data that exists on different platters
    but at the same head position (and the same side of the platters-top or bottom)
    is said to be a common cylinder. There are no real cylinders in a physical sense;
    cylinder is simply a convenient way of thinking about the stack of platters. When
    the read/write heads are at a certain in/out position, all the data that can be
    read without head movement is defined by a cylinder number, starting with 0.


    # Cylinder


    The same head position on a stack of platters in a multipatter disk such as a
    hard disk.


    # Geometry


    A drive''s organizational structure, including the number of cylinders, number
    of read/write heads, and number of sectors.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_146_0.png)


    One way to envision a cylinder is to think of a doughnut-shaped cookie cutter
    slicing through a stack of platters.


    The geometry of the drive is its organizational structure—the way it breaks down
    its surface into logical units for storing data. All disks have a geometry, even
    floppies, but on a hard disk the geometry is more significant because it is not
    the same for every hard disk. The ''big three'' for drive geometry are cylinders,
    heads, and sectors (CHS). There are other factors too, but they''re not as significant.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_146_1.png)'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Chapter 7


    In order for a hard disk to communicate with the computer, the BIOS must be informed
    about the hard disk''s geometry. Modern BIOSes and hard disks can automatically
    communicate this information between them, but in very old systems you sometimes
    need to manually enter the drive''s geometry stats into the BIOS setup program.
    Should you ever need to manually enter a drive''s geometry specs, you can usually
    find a label on the outside of the disk.


    # Partition


    A formatable section of a physical hard disk.


    # Partitioning


    Partitioning is done only on hard disks, so we''ll postpone the discussion of
    how to do it until Chapter 8. Briefly, though, partitioning prepares the drive
    by creating one or more formable areas called partitions.


    # Physical drive


    The entire physical hard disk, encompassing all partitions and logical drives.


    A single physical hard disk (the physical drive) can be divided into multiple
    partitions, just like a single large building can be divided into multiple rooms
    by erecting walls. The FDISK utility that comes with MS-DOS and Windows 9x handles
    partitioning; in Windows 2000 and XP it is handled through Windows Setup or through
    the Disk Management utility.


