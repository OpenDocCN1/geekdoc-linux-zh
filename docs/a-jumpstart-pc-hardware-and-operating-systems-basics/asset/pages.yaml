  md: '# Understanding CPUs


    L1 cache. It also contained some new functions and commands that reduced the amount
    of instruction that had to be sent to the CPU, thereby improving overall throughput.
    The 486s ranged from 25MHz to 133MHz.


    The 486 systems were the first to have separate speeds for the internal and external
    bus. Recall that when the CPU is faster than the motherboard''s bus, a multiplier
    is waiting to allow the CPU to execute multiple instructions per clock cycle.
    Early attempts at this were called cache doubling because they multiplied it times
    2; the later 486s used 4x multipliers.


    Recall from the previous section that the difference between 386 (a regular one,
    or DX) and 386SX was the bus width. With 486 systems, however, the difference
    between 486DX and an SX is that a 486DX has a built-in math coprocessor, while
    the 486SX does not.


    # Pentium CPUs


    Intel released the original Pentium in 1993. Early Pentiums had an internal speed
    of 60MHz and 200MHz, and they had an external speed of 60MHz and 75MHz.


    The Pentium had a 64-bit external bus, split into two dual-pipeline 32-bit data
    buses that enabled the CPU to process two separate sets of instructions at the
    same time. The two pipelines were not equal; the main pipeline (U) was fully functional,
    while the secondary pipeline (V) could handle only simple commands.


    The Pentium also added two KB caches: one write-back (for data) and one write-through
    (for program execution). You''ll learn about cache types in the next chapter,
    when we talk about memory.


    Another improvement implemented in the Pentium was branch prediction, a scheme
    in which the cache tries to ''hedge its bets'' by storing both sides of a Yes/No
    branch. For example, suppose a line in a program says "If X=1, go to line 100
    in the program. If not, go to line 200." With branch prediction, both line 100
    and 200 would be loaded into the cache, so either way the data would be readily
    available.


    Later Pentiums (1996 and later) added a new feature called multimedia extensions
    (MMX). The MMX addition helped the CPU with graphic-intensive applications such
    as games, but only those that were specifically written to take advantage of MMX.
    MMX was much hyped, even though there were not many applications that it could
    use.


    Here''s a Pentium CPU. I''ve taken it out of its socket and flipped it on its
    back so you can get a better look. Notice that the CPU itself is the smaller chip
    on the


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_90_0.png)


    # Cache


    A temporary holding area for data that needs to be kept at hand for reuse.


    # L1


    Stands for Level 1. A cache that holds data that is waiting to enter the CPU.
    Sometimes called a front-side cache.


    # MMX


    Stands for Multimedia Extensions. Built-in CPU functions that apply for MMX can
    take advantage of to streamline the processing of graphic-intensive commands.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_90_1.png)'
