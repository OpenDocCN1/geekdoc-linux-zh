  md: '# Chapter 6


    Several different technologies exist for directing and controlling an LCD display.
    They differ primarily in the number of transistors controlling the cells.


    The cheapest-to-manufacture type of LCD is a passive matrix display. A passive
    matrix has one transistor for each row and one transistor for each column, like
    spreadsheet row numbers and column letters. The transistors emitting charges,
    and the combination of charges from two switches twists the liquid crystals in
    that row/column intersection. Because a passive matrix relies on pulsing, each
    pixel has moments when it is receiving no signal, so passive matrix displays are
    not as bright as other types of LCD. For example, a laptop with a maximum resolution
    of 1024×768 has a total of 1,792 transistors.


    # Passive matrix


    An inexpensive type of LCD display that uses one transistor for each row and column.


    # Double-scan passive matrix


    An improved passive matrix display that divides the screen into sections and has
    one transistor for each row and column in each section.


    Double-scan passive matrix displays (DSTN) were developed to help improve the
    brightness of a passive matrix display without increasing the cost dramatically.
    They use the same technology as a normal passive display, but divide the screen
    into two separate rows/columns for each section. This allows the screen to be
    refreshed more rapidly.


    # Active matrix


    A type of LCD monitor that uses a separate transistor for each pixel.


    In contrast, active LCD provides a separate transistor for each pixel. Because
    the pixels do not have to share, pulsing is not required and each cell can be
    constantly ''on.'' This results in a much brighter display that is visible from
    any angle, but also in a display that has more power consumption.


    # TFT


    Thin Film Transistor. A type of LCD display that uses multiple transistors for
    each pixel, resulting in a very bright and high-quality display.


    The latest type of active matrix display, Thin Film Transistor (TFT), uses multiple
    transistors for each pixel (up to four), resulting in very high refresh and redraw
    rates and high power consumption.


    # Monitor Resolution


    The monitor, like the video card, has a maximum resolution. A computer is limited
    to the resolution on which the two can jointly agree.


    A low-end CRT has a maximum resolution of 1280×1024. That means there are 1,280
    triads across, for a total of 1,310,720 pixels. More expensive monitors will usually
    have maximum resolutions, up into the 2 thousands. LCD monitors usually have lower
    maximum resolutions than their CRT counterparts; a high-quality LCD might have
    a maximum resolution of 1024×768.


    Most monitors can operate in any range of resolutions by treating several triads
    as an individual pixel. On a CRT, this is no big deal, and in fact most people
    operate CRTs at a lower resolution are less adept at simulating lower resolutions
    than their maximum, so an LCD monitor''s display (especially text) can look fuzzy
    at lower resolutions. In such a case, a high-resolution LCD monitor might actually
    give display results inferior to


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_127_0.png)'
