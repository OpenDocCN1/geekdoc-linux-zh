  md: '# A Tour of Windows Tools and Utilities


    Noncontiguous\Not physically located together.


    Good PC technician also knows the ins and outs of the various tools that Windows
    provides for keeping a PC healthy and performing well. Here''s a rundown of the
    major ones to know. Not all of these are installed by default, so if you don''t
    see the one you want, use Add/Remove Programs in the Control Panel to install
    it. (That''s covered later in this chapter.)


    Scandisk or Check Disk Scandisk (called Check Disk in Windows 2000 and XP) checks
    and corrects a disk for logical errors in the FAT and for physical surface errors
    that affect data storage. Right-click the drive in My Computer and choose Properties,
    then click the Tab and click Check Now. In Windows 95, 98, and Me, you can also
    access it with Start > Programs > Accessories > System Tools > ScanDisk.


    Disk Disk Defragmenter checks a drive for files stored in noncontiguous clusters
    and rearranges the data physically on the disk so that few files as possible are
    fragmented. Choose Start > Programs > Accessories > System Tools > Disk Defragmenter.


    DriveSpace DriveSpace was a method of increasing the storage capacity of a hard
    disk, and it was popular during the era of expensive hard disks. Nowadays they
    are cheap so there is little reason to use it. Early versions of Windows (95 and
    98) provide a Windows interface for managing DriveSpace Volumes. To run it, choose
    Start > Programs > Accessories > System Tools > DriveSpace. Windows Me comes with
    a stripped down version of the utility that enables you to manage existing DriveSpace
    drives but not create new ones.


    > NOTE\Originally, DriveSpace was called DoubleSpace, and it was included with
    MS-DOS 6.2. Stacker, a company that made a competing product, sued Microsoft for
    infringement on their compression algorithm. Microsoft released MS-DOS 6.21, which
    did not contain it anymore. Then soon afterward Microsoft released MS-DOS 6.22,
    which contained DriveSpace instead. It does the same thing, but the math for doing
    it is different enough to pass legal muster.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_305_0.png)


    286'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Essential Windows Tools and Skills


    FAT32 Converter Windows 95 supported only FAT16; Windows 98 and higher supports
    FAT32. Ordinarily, the only way to change over to FAT32 is by partitioning and
    reformating, but Windows 98 came with a converter that performed the conversion
    without any data loss. To run it (Windows 98 only), choose Start > Programs >
    Accessories > System Tools > DriveSpace.


    System Information This utility provides detailed information about the hardware,
    memory usage, drivers, and other details involved in the behind-the-scenes housekeeping
    of the Windows program. To run it, choose Start > Programs > Accessories > System
    Tools > System Information.


    System Restore This utility, available in Windows Me and Windows XP only, is a
    “go back” type of program that enables you to revert to a previous Windows configuration
    if you install or remove something and Windows starts up. When you run once to
    take a snapshot of the system while it''s working, and then run again to restore
    to that snapshot when problems occur. To run it, choose Start > Programs > Accessories
    > System Tools > System Restore.


    System Editor System Editor, or SYSEDIT is it more popularly known, is not available
    on any Windows menus. You must run it with the Start > Run command. It opens several
    configuration files in a multi-window Notepad-like editing program, so you can
    make changes to them from one convenient location. The included files are AUTOEXEC.BAT,
    CONFIG.SYS, WIN.INI, and SYSTEM.INI. Because all these files exist only for backward
    compatibility and have not been necessary in their own right since Windows 3.1,
    System Editor is not as useful in recent Windows releases.


    System Configuration Utility Here''s an essential tool in the PC troubleshooter
    toolkit, but like System Editor it is not available from the system menu. Choose
    Start > Run and run MSCONFIG to open it. It lets you control how Windows starts
    up, enabling you to exclude certain startup programs, drivers, and to identify
    and eliminate startup programs.


    Registry Editor Recall that the Registry is the repository for all Windows settings
    in Windows 95 and higher. The Registry Editor is an Explorer-like window that
    enables you to view and edit its settings. Beware when using this tool, though,
    improper edits to the Registry can cripple or disable a PC to the point where
    Windows would be completely reinstalled. Choose Start > Run and run REGEDIT to
    open it.


    Backup Microsoft Backup is used to transfer copies of files to removable media
    for backup purposes. It compresses the backed-up files so they take up less space,
    but they must be run through Backup again using the Restore feature to be uncompressed
    when needed. Not all versions of Windows come with Backup, and most do not install
    it by default.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_306_0.png)


    287'
  merge: -1
