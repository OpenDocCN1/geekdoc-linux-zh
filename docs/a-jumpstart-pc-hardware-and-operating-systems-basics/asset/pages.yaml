  md: '# How Video Cards and Monitors Work


    Each gun directs itself through the designated hole for a particular triad, masking
    stray electrons.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_126_0.png)


    # Aperture grille


    A system of vertical wires that help guide electrons so they hit the correct phosphors
    on a CRT.


    # Slot mask


    A hybrid technology combining shadow mask and aperture grille.


    Another technology for accomplishing the same thing is an aperture grille, made
    up of vertical wires between the guns and the phosphors. Still a third method,
    slot mask, is a combination of the two other technologies. In both aperture grille
    and slot mask, red, green, and blue stripes run the full length of the monitor
    rather than interspersed dots. The main difference between them is the number
    and placement of the stabilizing wires.


    On an aperture grille or slot mask monitor, stripe pitch rather than dot pitch
    measures the distance from one colored stripe to another stripe of the same color.
    Stripe pitch is basically the same thing: lower is better. Entry-level CRTs have
    a dot pitch or stripe pitch of about 0.28mm, while the highest quality monitors
    have .22mm or so.


    # How LCDs Work


    The other common display type nowadays is a liquid crystal display, or LCD. You''ll
    find them in laptops and also in flat-panel workstation monitors.


    An LCD screen has two polarized filters, and between them are liquid crystals.
    In order for light to appear on the display screen, it must pass through both
    filters and the crystals. The second filter, however, is at an angle to the first,
    by default nothing can pass through to the display. By applying current to a crystal,
    you can cause it to twist, which also twists the light passing through it. If
    the light twists to matches the angle of the second filter, it can pass through
    it and light up an area of the display. On a color LCD, an additional filter splits
    the light into separate cells for red, green, and blue. Because there is no need
    for a mask to help direct electrons, there is less dark area between pixels; that
    is what gives an LCD display that ''saturated'' appearance that most CRTs cannot
    fully duplicate.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_126_1.png)


