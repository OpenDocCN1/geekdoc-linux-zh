  md: '# Printing Basics


    # Changing Printer Driver Settings


    Once a printer driver has been installed, an icon for it appears in the Printers
    folder. To change a printer''s properties, right-click that icon and choose Properties.
    This opens a Properties box with many tabs. Explore these tabs to learn about
    the settings available for that printer.


    The settings are different for different types of printers—that is, inkjets versus
    lasers, PostScript versus non-PostScript, and so on. However, here are a few settings
    that all have in common:


    +   The General tab provides text boxes for naming the printer driver and providing
    comments and location information. This can be useful if the printer is network-shared
    and other people might need to know where they can pick their prints. The General
    tab also has a Print Test Page button, which prints a test page (of course) and
    a Printing Preferences button that opens a dialog box in which you can set defaults
    for page orientation, number of copies, and so on.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_240_0.png)


    The Sharing tab enables you to share the printer with other computer users on
    a local area network. See Chapter 13 for more information about sharing a printer.


    +   The Ports tab enables you to select the port to which the printer is attached.
    This can be useful if you move a printer to a different port and don''t want to
    have to reinstall its driver.'
